  \n*   电子书搜索下载\n*   电子书打包资源分享\n*   学习资源分享\n\n### 删除最后一个节点\n\n删除最后一个节点要求我们将倒数第二个节点设为新的最后一个节点。此外，新创建的最后一个节点不应有任何后继引用。代码示例如下：\n\
  \n```\npublic function deleteLast() { \n    if ($this->_lastNode !== NULL) { \n\
  \        $currentNode = $this->_lastNode; \n        if ($currentNode->prev === NULL)\
  \ { \n            $this->_firstNode = NULL; \n            $this->_lastNode = NULL;\
  \ \n        } else { \n            $previousNode = $currentNode->prev; \n      \
  \      $this->_lastNode = $previousNode; \n            $previousNode->next = NULL;\
  \ \n            $this->_totalNode--; \n            return TRUE; \n        } \n \
  \   } \n    return FALSE; \n}\n```\n\n### 查找并删除一个节点\n\n当我们从列表中间删除一个节点时，必须重新调整我们要查找的项目的前驱和后继节点。首先，我们将找到目标节点。获取目标节点的前驱节点以及后继节点。然后，将前驱节点的后继指向目标节点之后的节点，前驱节点的反向操作同理。代码如下：\n\
  \n```\npublic function delete(string $query = NULL) { \n    if ($this->_firstNode)\
  \ { \n        $previous = NULL;\n        $currentNode = $this->_firstNode; \n  \
  \      while ($currentNode !== NULL) { \n            if ($currentNode->data ===\
  \ $query) { \n                if ($currentNode->next === NULL) { \n            \
  \        $previous->next = NULL; \n                } else { \n                 \
  \   $previous->next = $currentNode->next; \n                    $currentNode->next->prev\
  \ = $previous; \n                }\n                $this->_totalNode--; \n    \
  \            break; \n            }\n            $previous = $currentNode; \n  \
  \          $currentNode = $currentNode->next; \n        }\n    }\n}\n```\n\n###\
  \ 正向显示列表\n\n双向链表让我们有机会向两个方向显示列表。到目前为止，我们已经看到在使用单向链表时可以单向显示列表。现在，我们将从两个方向查看列表。以下是用于正向显示列表的代码：\n\
  \n```\npublic function displayForward() { \n    echo \"Total book titles: \" . $this->_totalNode\
  \ . \"\\n\"; \n    $currentNode = $this->_firstNode; \n    while ($currentNode !==\
  \ NULL) { \n        echo $currentNode->data . \"\\n\"; \n        $currentNode =\
  \ $currentNode->next; \n    } \n} \n```\n\n### 反向显示列表\n\n要反向显示列表，我们必须从最后一个节点开始，并使用前驱链接继续向后移动，直到到达列表的末尾。这使我们在操作过程中拥有一种独特的方式，可以按需向任何方向移动。代码如下：\n\
  \n```\npublic function displayBackward() { \n    echo \"Total book titles: \" .\
  \ $this->_totalNode . \"\\n\"; \n    $currentNode = $this->_lastNode; \n    while\
  \ ($currentNode !== NULL) { \n        echo $currentNode->data . \"\\n\"; \n    \
  \    $currentNode = $currentNode->prev; \n    }\n}\n```\n\n### 双向链表的复杂度\n\n以下是双向链表操作的最佳、最差和平均情况复杂度。它与单向链表操作的复杂度相似：\n\
  \n| 操作 | 时间复杂度：最差情况 | 时间复杂度：平均情况 |\n| --- | --- | --- |\n| 在开头或结尾插入 | `O(1)` | `O(1)`\
  \ |\n| 在开头或结尾删除 | `O(1)` | `O(1)` |\n| 搜索 | `O(n)` | `O(n)` |\n| 访问 | `O(n)` | `O(n)`\
  \ |\n\n### 使用 PHP SplDoublyLinkedList\n\nPHP **标准 PHP 库** (**SPL**) 有一个双向链表的实现，称为\
  \ `SplDoublyLinkedList`。如果我们使用内置类，就不需要自己实现双向链表。双向链表的实现实际上也可以作为栈和队列工作。PHP 的双向链表实现有许多额外的功能。以下是\
  \ `SplDoublyLinkedList` 的一些常见功能：\n\n\n\n\n| 方法 | 说明 |\n| --- | --- |\n| `Add` |\
  \ 在指定索引处添加一个新节点 |\n| `Bottom` | 从列表开头查看一个节点 |\n| `Count` | 返回列表的大小 |\n| `Current`\
  \ | 返回当前节点 |\n| `getIteratorMode` | 返回迭代模式 |\n| `setIteratorMode` | 设置迭代模式。例如，LIFO、FIFO\
  \ 等 |\n| `Key` | 返回当前节点索引 |\n| `next` | 移动到下一个节点 |\n| `pop` | 从列表末尾弹出一个节点 |\n| `prev`\
  \ | 移动到上一个节点 |\n| `push` | 在列表末尾添加一个新节点 |\n| `rewind` | 将迭代器倒回到顶部 |\n| `shift` |\
  \ 从链表开头移出一个节点 |\n| `top` | 从列表末尾查看一个节点 |\n| `unshift` | 在列表开头预置一个元素 |\n| `valid`\
  \ | 检查列表中是否还有更多节点 |\n\n现在，让我们为书名应用编写一个使用 `SplDoublyLinkedList` 的小程序：\n\n```\n$BookTitles\
  \ = new SplDoublyLinkedList();\n\n$BookTitles->push(\"Introduction to Algorithm\"\
  );\n$BookTitles->push(\"Introduction to PHP and Data structures\");\n$BookTitles->push(\"\
  Programming Intelligence\");\n$BookTitles->push(\"Mediawiki Administrative tutorial\
  \ guide\");\n$BookTitles->add(1, \"Introduction to Calculus\");\n$BookTitles->add(3,\
  \ \"Introduction to Graph Theory\");\n\nfor ($BookTitles->rewind(); $BookTitles->valid();\
  \ $BookTitles->next()) {\n    echo $BookTitles->current() . \"\\n\";\n}\n```\n\n\
  上述代码将产生以下输出：\n\n```\nIntroduction to Algorithm\nIntroduction to Calculus\nIntroduction\
  \ to PHP and Data structures\nIntroduction to Graph Theory\nProgramming Intelligence\n\
  Mediawiki Administrative tutorial guide\n```\n\n## 总结\n\n链表是用于解决不同问题的最流行数据结构之一。无论是用于栈、队列、优先队列，还是用于实现复杂的图算法，链表都是一种非常方便的数据结构，可用于解决你可能遇到的任何问题。在本章中，我们探讨了关于单链表、双向链表和循环链表的所有可能细节，以及它们的复杂度分析。在接下来的章节中，我们将利用链表来实现不同的数据结构和编写算法。\n\
  \n## 构建栈和队列\n\n在日常生活中，我们使用两种最常见的数据结构。我们可以假设这些数据结构受现实世界启发，但它们在计算领域具有非常重要的影响。我们说的是栈和队列数据结构。我们每天堆叠书籍、文件、盘子和衣服，而在售票处、公交车站和购物结账处我们则排队。此外，我们还听说过\
  \ PHP 中的消息队列，这是高端应用中最常用的功能之一。在本章中，我们将探讨流行的栈和队列数据结构的不同实现。我们将学习 PHP 中的队列、优先队列、循环队列和双端队列。\n\
  \n## 理解栈\n\n栈是一种遵循**后进先出（LIFO）**原则的线性数据结构。这意味着栈只有一个端点，用于向结构中添加和移除项目。在栈中添加新项目称为入栈，移除项目称为出栈。由于我们只有一个端点可操作，我们总是将项目压入该端点，而当我们出栈时，该端点的最后一个项目将被弹出。栈顶的最上层元素（也位于栈端的最开始处）称为栈顶。如果我们考虑下图，可以看到每次出栈和入栈操作后，栈顶都会发生变化。此外，我们是在栈顶执行操作，而不是在栈的开头或中间。我们必须小心在栈为空时弹出元素，以及在栈已满时压入元素。如果我们想压入超过其容量的元素，可能会发生栈溢出。\n\
  \n![](img/Image00027.jpg)\n\n从前面的讨论中，我们现在知道栈有四种基本操作：\n\n*   **入栈**：在栈顶添加一个项目。\n\
  *   **出栈**：移除栈顶的项目。\n*   **栈顶**：返回栈顶的项目。它与出栈不同，因为它不移除项目，只是为我们获取值。\n*   **isEmpty**：检查栈是否为空。\n\
  \n现在让我们使用 PHP 实现栈，但采用不同的方式。首先，我们将尝试使用 PHP 的内置数组函数来实现栈。然后我们将研究如何在不使用 PHP 内置函数的情况下构建栈，而是使用其他数据结构，例如链表。\n\
  \n## 读累了记得休息一会哦~\n\n**公众号：古德猫宁李**\n\n*   电子书搜索下载\n*   书单分享\n*   书友学习交流\n\n**网站：**[沉金书屋\
  \ https://www.chenjin5.com](https://www.chenjin5.com)\n\n*   电子书搜索下载\n*   电子书打包资源分享\n\
  *   学习资源分享\n\n## 使用 PHP 数组实现栈\n\n首先，我们将为栈创建一个接口，以便我们可以在不同的实现中使用它，并确保所有实现彼此间具有一定的相似性。让我们编写一个简单的栈接口：\n\
  \n```\ninterface Stack {\n\n    public function push(string $item);\n\n    public\
  \ function pop();\n\n    public function top();\n\n    public function isEmpty();\n\
  \n}\n```\n\n正如我们从前面的接口中看到的，我们将所有栈函数都放在接口内，因为实现它的类必须拥有所有这些提到的函数，否则运行时会抛出致命错误。既然我们要使用\
  \ PHP 数组实现栈，我们将使用一些现有的 PHP 函数来进行入栈、出栈和栈顶操作。我们将以这样的方式实现栈，使我们可以定义栈的大小。如果数组中没有项目而我们仍想出栈，它将抛出下溢异常；如果我们尝试压入超过其容量允许的项目，则会抛出上溢异常。以下是使用数组实现栈的代码：\n\
  \n```\nclass Books implements Stack {\n\n    private $limit;\n    private $stack;\n\
  \n    public function __construct(int $limit = 20) {\n        $this->limit = $limit;\n\
  \        $this->stack = [];\n    }\n\n    public function pop(): string {\n\n  \
  \      if ($this->isEmpty()) {\n            throw new UnderflowException('Stack\
  \ is empty');\n        } else {\n            return array_pop($this->stack);\n \
  \       }\n\n    }\n\n    public function push(string $newItem) {\n\n        if\
  \ (count($this->stack) < $this->limit) {\n            array_push($this->stack, $newItem);\n\
  \        } else {\n            throw new OverflowException('Stack is full');\n \
  \       }\n\n    }\n\n    public function top(): string {\n        return end($this->stack);\n\
  \    }\n\n    public function isEmpty(): bool {\n        return empty($this->stack);\n\
  \    }\n\n}\n```\n\n现在让我们梳理一下我们为栈编写的代码。我们将栈实现命名为 `Books`，但只要是有效的类名，我们可以随意命名。首先，我们使用\
  \ `__construct()` 方法构造栈，并提供一个选项来限制我们可以在栈中存储的项目数量。默认值设为 `20`。下一个方法定义出栈操作：\n\n```\n\
  public function pop(): string {\n\n    if ($this->isEmpty()) {\n        throw new\
  \ UnderflowException('Stack is empty');\n    } else {\n        return array_pop($this->stack);\n\
  \    }\n\n}\n```\n\n如果栈不为空，`pop` 方法将返回一个字符串。我们使用栈类中定义的 empty 方法为此目的。如果栈为空，我们从 SPL\
  \ 抛出一个 `UnderflowException`。如果没有项目可弹出，我们可以阻止该操作发生。如果栈不为空，我们使用 PHP 的 `array_pop`\
  \ 函数从数组返回最后一个项目。\n\n\n\n\n在 `push` 方法中，我们执行与 `pop` 相反的操作。首先，我们检查栈是否已满。如果未满，我们使用\
  \ PHP 的 `array_push` 函数将字符串 `item` 添加到栈的末尾。如果栈已满，我们抛出 SPL 的 `OverFlowException`。`top`\
  \ 方法返回栈顶元素。`isEmpty` 方法检查栈是否为空。\n\n由于我们遵循 PHP 7 标准，因此在方法层面使用了标量类型声明和返回类型声明。\n\n\
  为了使用我们刚刚实现的栈类，我们需要构思一个可以使用所有这些操作的示例。让我们编写一个小程序来创建一个书籍栈。代码如下：\n\n```\ntry { \n\n\
  \    $programmingBooks = new Books(10); \n\n    $programmingBooks->push(\"Introduction\
  \ to PHP7\"); \n\n    $programmingBooks->push(\"Mastering JavaScript\"); \n\n  \
  \  $programmingBooks->push(\"MySQL Workbench tutorial\"); \n\n    echo $programmingBooks->pop().\"\
  \\n\"; \n\n    echo $programmingBooks->top().\"\\n\"; \n\n} catch (Exception $e)\
  \ { \n\n    echo $e->getMessage(); \n\n}\n```\n\n我们创建了一个书籍栈实例，用于存放编程书籍标题。我们执行了三次\
  \ `push` 操作。最后插入的书名是 `\"MySQL Workbench tutorial\"`。如果在三次 `push` 操作后执行 `pop`，将返回该书名。之后，`top`\
  \ 将返回 `\"Mastering JavaScript\"`，它在执行 `pop` 操作后成为新的栈顶元素。我们将整段代码包裹在 `try...catch`\
  \ 块中，以便处理溢出和下溢抛出的异常。上述代码将产生以下输出：\n\n```\nMySQL Workbench tutorial\n\nMastering JavaScript\n\
  ```\n\n现在让我们关注刚才完成的各种栈操作的复杂度。\n\n### 理解栈操作的复杂度\n\n以下是不同栈操作的时间复杂度。在最坏情况下，栈操作的时间复杂度如下：\n\
  \n| **操作** | **时间复杂度** |\n| --- | --- |\n| pop | `O(1)` |\n| push | `O(1)` |\n|\
  \ top | `O(1)` |\n| isEmpty | `O(1)` |\n\n由于栈始终在一端操作并记录栈顶位置，如果我们想在栈中搜索某个项目，意味着必须遍历整个列表。访问栈中的特定项目也是同理。虽然不建议将栈用于此类操作，但如果必须这样做，必须记住其时间复杂度高于常规栈操作。\n\
  \n| **操作** | **时间复杂度** |\n| --- | --- |\n| 访问 | `O(n)` |\n| 搜索 | `O(n)` |\n\n栈的空间复杂度始终为\
  \ `O(n)`。\n\n到目前为止，我们已经了解了如何使用 PHP 数组及其内置函数 `array_pop` 和 `array_push` 实现栈。但我们也可以忽略内置函数，使用手动数组操作实现，或者使用\
  \ `array_shift` 和 `array_unshift` 内置函数。\n\n### 使用链表实现栈\n\n在 第 3 章 *使用链表* 中，我们学习了如何实现链表。我们了解到在链表中可以在末尾插入节点、从末尾移除节点、在列表中间插入、在开头插入等。如果考虑单链表数据结构的“在末尾插入”和“在末尾移除”操作，我们可以轻松实现类似栈的功能。因此，让我们使用上一章的\
  \ `LinkedList` 类来实现栈。代码如下：\n\n```\nclass BookList implements Stack { \n\n\n\n  \
  \  private $stack; \n\n\n\n    public function __construct() { \n\n      $this->stack\
  \ = new LinkedList(); \n\n    }\n\n\n\n    public function pop(): string { \n\n\n\
  \n      if ($this->isEmpty()) { \n\n          throw new UnderflowException('Stack\
  \ is empty'); \n\n      } else { \n\n          $lastItem = $this->top(); \n\n  \
  \        $this->stack->deleteLast(); \n\n          return $lastItem; \n\n      }\
  \ \n\n    } \n\n\n\n    public function push(string $newItem) { \n\n\n\n      $this->stack->insert($newItem);\
  \ \n\n    } \n\n\n\n\n\npublic function top(): string { \n\n  return $this->stack->getNthNode($this->stack->getSize())->data;\
  \ \n\n} \n\n\n\n    public function isEmpty(): bool { \n\n      return $this->stack->getSize()\
  \ == 0; \n\n    } \n\n}\n```\n\n让我们逐块分析代码以理解其工作原理。从顶部开始，我们可以看到在 `constructor` 方法中，我们创建了一个新的\
  \ `LinkedList` 对象并将其赋值给 `stack` 属性，而不是像前一个示例那样使用数组。我们假设 `LinkedList` 类已自动加载，或文件已包含在脚本中。现在让我们关注\
  \ `push` 操作。`push` 操作非常简单。我们只需在链表中插入一个新节点。由于链表没有大小限制，我们这里不检查溢出。\n\n在我们的链表实现中，没有显示最后一个节点的方法。我们曾插入新的最后节点并移除之前的最后一个节点，但在这里，我们需要在不删除的情况下获取最后一个节点的值。为了实现该功能（即栈的\
  \ `top` 操作），我们可以利用 `LinkedList` 实现中的 `getNthNode` 方法和 `getSize` 方法。这样我们可以获取节点。但必须记住一点：我们需要的是节点的字符串值，而不是完整的节点对象。这就是为什么我们返回节点的\
  \ `data` 属性。\n\n与 `top` 操作类似，`pop` 操作也需要在从列表中移除最后一个节点之前返回其数据。为了实现这一点，我们使用 `LinkedList`\
  \ 类的 `top()` 方法和 `deleteLast()` 方法。现在让我们运行一个示例代码，使用这个新实现的 `BookList` 类进行栈操作。代码如下：\n\
  \n```\ntry { \n\n    $programmingBooks = new BookList(); \n\n    $programmingBooks->push(\"\
  Introduction to PHP7\"); \n\n    $programmingBooks->push(\"Mastering JavaScript\"\
  ); \n\n    $programmingBooks->push(\"MySQL Workbench tutorial\"); \n\n    echo $programmingBooks->pop().\"\
  \\n\"; \n\n    echo $programmingBooks->pop().\"\\n\"; \n\n    echo $programmingBooks->top().\"\
  \\n\"; \n\n} catch (Exception $e) { \n\n    echo $e->getMessage(); \n\n}\n```\n\n\
  这看起来与上一个运行的示例非常相似，但这里我们尝试执行两次 `pop` 操作，然后执行一次 `top` 操作。因此输出将如下所示：\n\n```\nMySQL\
  \ Workbench tutorial\n\nMastering JavaScript\n\nIntroduction to PHP7\n```\n\n如果我们了解栈的基本行为及其实现方式，就可以使用数组、链表、双向链表来实现栈。既然我们已经看过数组和链表的实现，现在将探索\
  \ SPL 对栈的实现，它实际上使用了双向链表。\n\n### 使用 SPL 中的 SplStack 类\n\n如果我们不想自己实现栈，可以使用 SPL 现有的栈实现。它非常易用，只需编写极少的代码。正如我们所知，`SplStack`\
  \ 使用 `SplDoublyLinkedList`。它拥有 `push`、`pop`、向前移动、向后移动、`shift`、`unshift` 等所有可能的操作。为了实现我们之前看到的相同示例，我们只需编写以下代码：\n\
  \n```\n$books = new SplStack(); \n\n$books->push(\"Introduction to PHP7\"); \n\n\
  $books->push(\"Mastering JavaScript\"); \n\n$books->push(\"MySQL Workbench tutorial\"\
  ); \n\necho $books->pop() . \"\\n\"; \n\necho $books->top() . \"\\n\"; \n```\n\n\
  是的，使用 `SplStack` 类构建栈就是这么简单。由我们决定是使用 PHP 数组、链表，还是像 `SplStack` 这样的内置类来实现。\n\n###\
  \ 栈的实际应用\n\n\n\n\n## 栈在现代开发中的应用\n\n栈在现代应用程序中有许多用途。无论是在浏览器历史记录中，还是在流行的开发术语“堆栈跟踪”中，栈无处不在。现在我们将尝试使用栈来解决一个实际问题。\n\
  \n### 嵌套括号匹配\n\n当我们求解数学表达式时，首先需要考虑的是嵌套括号的正确性。如果括号嵌套不当，则可能无法计算，或者计算结果可能是错误的。让我们看一些例子：\n\
  \n![](img/Image00028.jpg)\n\n从前面的表达式来看，只有第一个是正确的；其他两个是不正确的，因为括号没有正确嵌套。为了判断括号是否正确嵌套，我们可以使用栈来实现解决方案。以下是实现的伪代码算法：\n\
  \n```\nvalid = true \n\ns = empty stack \n\nfor (each character of the string) {\
  \ \n\n   if(character = ( or { or [ ) \n\n       s.push(character) \n\n  else if\
  \ (character = ) or } or ] ) { \n\n   if(s is empty) \n\nvalid = false \n\n\n\n\
  \     last = s.pop() \n\n    if(last is not opening parentheses of character)  \n\
  \n         valid = false \n\n  } \n\n} \n\nif(s is not empty) \n\nvalid = false\n\
  ```\n\n如果我们查看伪代码，它看起来非常简单。目标是忽略字符串中的任何数字、操作数或空格，仅考虑括号、花括号和方括号。如果它们是左括号，我们将其压入栈中。如果它们是右括号，我们将从栈中弹出元素。如果弹出的括号不是我们试图匹配的左括号，则无效。循环结束时，如果字符串有效，栈应为空。但如果栈不为空，则存在多余的括号，因此字符串无效。现在让我们将其转换为程序：\n\
  \n```\nfunction expressionChecker(string $expression): bool { \n\n    $valid = TRUE;\
  \ \n\n    $stack = new SplStack(); \n\n\n\n    for ($i = 0; $i < strlen($expression);\
  \ $i++) { \n\n    $char = substr($expression, $i, 1); \n\n\n\n    switch ($char)\
  \ { \n\n      case '(': \n\n      case '{': \n\n      case '[': \n\n      $stack->push($char);\
  \ \n\n      break; \n\n\n\n      case ')': \n\n      case '}': \n\n      case ']':\
  \ \n\n      if ($stack->isEmpty()) { \n\n          $valid = FALSE; \n\n      } else\
  \ { \n\n        $last = $stack->pop(); \n\n        if (($char == \")\" && $last\
  \ != \"(\")  \n\n          || ($char == \"}\" && $last != \"{\")  \n\n         \
  \ || ($char == \"]\" && $last != \"[\")) { \n\n\n\n      $valid = FALSE; \n\n  \
  \      } \n\n    } \n\n    break; \n\n  } \n\n\n\n  if (!$valid) \n\n      break;\
  \ \n\n    } \n\n\n\n    if (!$stack->isEmpty()) { \n\n    $valid = FALSE; \n\n \
  \   } \n\n\n\n    return $valid; \n\n}\n```\n\n现在让我们运行前面讨论的三个例子：\n\n```\n$expressions\
  \ = []; \n\n$expressions[] = \"8 * (9 -2) + { (4 * 5) / ( 2 * 2) }\"; \n\n$expressions[]\
  \ = \"5 * 8 * 9 / ( 3 * 2 ) )\"; \n\n$expressions[] = \"[{ (2 * 7) + ( 15 - 3) ]\"\
  ; \n\n\n\nforeach ($expressions as $expression) { \n\n    $valid = expressionChecker($expression);\
  \ \n\n\n\n    if ($valid) { \n\n    echo \"Expression is valid \\n\"; \n\n    }\
  \ else { \n\n    echo \"Expression is not valid \\n\"; \n\n    } \n\n} \n```\n\n\
  这将产生以下输出，这正是我们想要的：\n\n```\nExpression is valid\n\n\n\nExpression is not valid\n\n\
  \n\nExpression is not valid\n```\n\n## 理解队列\n\n队列是另一种特殊的线性数据结构，遵循**先进先出**（**FIFO**）原则。操作有两端：一端用于向队列添加元素，另一端用于从队列移除元素。这与栈不同，栈使用同一端进行添加和移除操作。插入总是在后端或尾部进行。元素的移除将从前端进行。向队列添加新元素的过程称为\
  \ `enqueue`，移除元素的过程称为 `dequeue`。在不移除元素的情况下查看队列前端元素的过程称为 `peek`，类似于栈的 `top` 操作。下图描绘了队列的表示：\n\
  \n![](img/Image00029.jpg)\n\n现在，如果我们为队列定义一个接口，它将如下所示：\n\n```\ninterface Queue {\
  \ \n\n\n\n    public function enqueue(string $item); \n\n\n\n    public function\
  \ dequeue(); \n\n\n\n    public function peek(); \n\n\n\n    public function isEmpty();\
  \ \n\n}\n```\n\n现在我们可以使用不同的方法来实现队列，就像我们对栈所做的那样。首先，我们将使用 PHP 数组实现队列，然后是 `LinkedList`，最后是\
  \ `SplQueue`。\n\n#### 使用 PHP 数组实现队列\n\n我们现在将使用 PHP 数组实现队列数据结构。我们已经看到，可以使用 `array_push()`\
  \ 函数在数组末尾添加元素。为了移除数组的第一个元素，我们可以使用 PHP 的 `array_shift()` 函数，对于 peek 函数，我们可以使用 PHP\
  \ 的 `current()` 函数。根据我们的讨论，代码如下所示：\n\n```\nclass AgentQueue implements Queue {\n\
  \n\n\n    private $limit; \n\n    private $queue; \n\n\n\n    public function __construct(int\
  \ $limit = 20) { \n\n      $this->limit = $limit; \n\n      $this->queue = []; \n\
  \n    } \n\n\n\n    public function dequeue(): string { \n\n\n\n      if ($this->isEmpty())\
  \ { \n\n          throw new UnderflowException('Queue is empty'); \n\n      } else\
  \ { \n\n          return array_shift($this->queue); \n\n      } \n\n    } \n\n\n\
  \n    public function enqueue(string $newItem) { \n\n\n\n      if (count($this->queue)\
  \ < $this->limit) { \n\n          array_push($this->queue, $newItem); \n\n     \
  \ } else { \n\n          throw new OverflowException('Queue is full'); \n\n    \
  \  } \n\n    } \n\n\n\n    public function peek(): string { \n\n      return current($this->queue);\
  \ \n\n    } \n\n\n\n    public function isEmpty(): bool { \n\n      return empty($this->queue);\
  \ \n\n    } \n\n\n\n}\n```\n\n在这里，我们保持了与栈相同的原则。我们想要定义一个固定大小的队列，并进行溢出和下溢检查。为了运行队列实现，我们可以考虑将其用作呼叫中心应用程序的代理队列。以下是使用我们队列操作的代码：\n\
  \n```\ntry { \n\n    $agents = new AgentQueue(10); \n\n    $agents->enqueue(\"Fred\"\
  ); \n\n    $agents->enqueue(\"John\"); \n\n    $agents->enqueue(\"Keith\"); \n\n\
  \    $agents->enqueue(\"Adiyan\"); \n\n    $agents->enqueue(\"Mikhael\"); \n\n \
  \   echo $agents->dequeue().\"\\n\"; \n\n    echo $agents->dequeue().\"\\n\"; \n\
  \n    echo $agents->peek().\"\\n\"; \n\n} catch (Exception $e) { \n\n    echo $e->getMessage();\
  \ \n\n} \n```\n\n这将产生以下输出：\n\n```\nFred\n\n\n\nJohn\n\n\n\nKeith\n```\n\n#### 使用链表实现队列\n\
  \n正如我们在栈实现中所做的那样，我们将使用第 3 章 Chapter 3 *Using Linked Lists* 中的链表实现来实现队列。我们可以使用 `insert()`\
  \ 方法确保始终在末尾插入。我们可以使用 `deleteFirst()` 进行 `dequeue` 操作，使用 `getNthNode()` 进行 `peek`\
  \ 操作。以下是使用链表实现队列的示例实现：\n\n\n\n\n## AgentQueue 实现\n\n```php\nclass AgentQueue implements\
  \ Queue { \n\n    private $limit; \n\n    private $queue; \n\n    public function\
  \ __construct(int $limit = 20) { \n        $this->limit = $limit; \n        $this->queue\
  \ = new LinkedList(); \n    } \n\n    public function dequeue(): string { \n   \
  \     if ($this->isEmpty()) { \n            throw new UnderflowException('Queue\
  \ is empty'); \n        } else { \n            $lastItem = $this->peek(); \n   \
  \         $this->queue->deleteFirst(); \n            return $lastItem; \n      \
  \  } \n    } \n\n    public function enqueue(string $newItem) { \n        if ($this->queue->getSize()\
  \ < $this->limit) { \n            $this->queue->insert($newItem); \n        } else\
  \ { \n            throw new OverflowException('Queue is full'); \n        } \n \
  \   } \n\n    public function peek(): string { \n        return $this->queue->getNthNode(1)->data;\
  \ \n    } \n\n    public function isEmpty(): bool { \n        return $this->queue->getSize()\
  \ == 0; \n    } \n}\n```\n\n---\n\n> 读累了记得休息一会哦~\n\n**公众号：古德猫宁李**\n\n*   电子书搜索下载\n\
  *   书单分享\n*   书友学习交流\n\n**网站：**[沉金书屋 https://www.chenjin5.com](https://www.chenjin5.com)\n\
  \n*   电子书搜索下载\n*   电子书打包资源分享\n*   学习资源分享\n\n---\n\n## 使用 SPL 的 SplQueue 类\n\n如果我们不想花费精力实现队列功能，且对内置解决方案感到满意，可以使用\
  \ `SplQueue` 类满足基本的队列需求。需要注意一点：`SplQueue` 类中没有 `peek` 函数。我们必须使用 `bottom()` 函数来获取队列的第一个元素。以下是使用\
  \ `SplQueue` 实现 `AgentQueue` 的简单示例：\n\n```php\n$agents = new SplQueue(); \n\n$agents->enqueue(\"\
  Fred\"); \n$agents->enqueue(\"John\"); \n$agents->enqueue(\"Keith\"); \n$agents->enqueue(\"\
  Adiyan\"); \n$agents->enqueue(\"Mikhael\"); \n\necho $agents->dequeue().\"\\n\"\
  ; \necho $agents->dequeue().\"\\n\"; \necho $agents->bottom().\"\\n\";\n```\n\n\
  ---\n\n## 理解优先队列\n\n优先队列是一种特殊的队列，元素的插入和移除基于其优先级。在编程领域，优先队列的用途非常广泛。例如，假设我们有一个大型的邮件队列系统，通过队列系统发送月度通讯。如果我们需要使用相同的队列功能向用户发送一封紧急邮件怎么办？由于普通队列的原则是在末尾添加元素，发送该消息的过程将会被严重延迟。为了解决这个问题，我们可以使用优先队列。在这种情况下，我们为每个节点分配一个优先级，并根据该优先级进行排序。优先级较高的元素会移至列表顶端，并优先出队。\n\
  \n构建优先队列主要有两种方法。\n\n### 有序序列\n\n如果我们为优先队列规划有序序列，它可以是升序或降序。有序序列的优点是我们可以快速查找最大值或移除最大优先级元素，因为可以使用\
  \ `O(1)` 复杂度找到它。但插入将耗费更多时间，因为我们必须检查队列中的每个元素，以根据其优先级将元素放在正确的位置。\n\n### 无序序列\n\n无序序列不要求我们遍历每个队列元素来放置新添加的元素。它始终按照普通队列的原则添加到后端。因此，我们可以用\
  \ `O(1)` 复杂度实现入队操作。但如果我们想查找或移除最高优先级元素，则必须遍历每个元素来找到正确的那个。因此，它不利于搜索。\n\n现在我们将编写代码，使用链表实现基于有序序列的优先队列。\n\
  \n---\n\n## 使用链表实现优先队列\n\n到目前为止，我们看到的链表仅使用一个值，即节点数据。现在我们需要传递另一个值作为优先级。为了实现这一点，我们需要修改\
  \ `ListNode` 的实现：\n\n```php\nclass ListNode {\n\n    public $data = NULL; \n   \
  \ public $next = NULL;\n    public $priority = NULL;\n\n    public function __construct(string\
  \ $data = NULL, int $priority = NULL) { \n        $this->data = $data;\n       \
  \ $this->priority = $priority;\n    }\n}\n```\n\n现在节点同时包含数据和优先级。为了允许在插入操作期间考虑此优先级，我们还需要更改\
  \ `LinkedList` 类中 `insert()` 的实现。以下是修改后的实现：\n\n```php\npublic function insert(string\
  \ $data = NULL, int $priority = NULL) { \n    $newNode = new ListNode($data, $priority);\
  \ \n    $this->_totalNode++; \n\n    if ($this->_firstNode === NULL) { \n      \
  \  $this->_firstNode = &$newNode; \n    } else { \n        $previous = $this->_firstNode;\
  \ \n        $currentNode = $this->_firstNode; \n        while ($currentNode !==\
  \ NULL) { \n            if ($currentNode->priority < $priority) { \n           \
  \     if ($currentNode == $this->_firstNode) { \n                    $previous =\
  \ $this->_firstNode; \n                    $this->_firstNode = $newNode; \n    \
  \                $newNode->next = $previous; \n                    return; \n  \
  \              } \n                $newNode->next = $currentNode; \n           \
  \     $previous->next = $newNode; \n                return; \n            } \n \
  \           $previous = $currentNode; \n            $currentNode = $currentNode->next;\
  \ \n        } \n    } \n    return TRUE; \n}\n```\n\n正如我们所见，`insert` 方法已更改为在插入操作期间同时接收数据和优先级。像往常一样，第一步是创建一个新节点并增加节点计数。插入有三种可能性：\n\
  \n*   列表为空，因此新节点是第一个节点。\n*   列表不为空，但新项目具有最高优先级，因此它成为第一个节点，之前的第一个节点跟随其后。\n*   列表不为空且优先级不是最高，因此它在列表内部插入新节点，或者可能在列表末尾。\n\
  \n在我们的实现中，我们考虑了所有三种可能性。因此，最高优先级的项目始终位于列表开头。现在让我们使用这段新代码运行 `AgentQueue` 实现，如下例所示：\n\
  \n```php\ntry { \n    $agents = new AgentQueue(10); \n    $agents->enqueue(\"Fred\"\
  , 1); \n    $agents->enqueue(\"John\", 2); \n    $agents->enqueue(\"Keith\", 3);\
  \ \n    $agents->enqueue(\"Adiyan\", 4); \n    $agents->enqueue(\"Mikhael\", 2);\
  \ \n    $agents->display(); \n    echo $agents->dequeue().\"\\n\"; \n    echo $agents->dequeue().\"\
  \\n\"; \n} catch (Exception $e) { \n    echo $e->getMessage(); \n}\n```\n\n如果没有优先级，队列应该是\
  \ `Fred`、`John`、`Keith`、`Adiyan` 和 `Mikhael`。但由于我们给列表添加了优先级，输出结果为：\n\n```\nAdiyan\n\
  Keith\nJohn\nMikhael\nFred\n```\n\n由于 `Adiyan` 具有最高优先级，它被放置在队列开头，尽管它是在第四位插入队列的。\n\
  \n---\n\n## 使用 SplPriorityQueue 实现优先队列\n\nPHP 已经通过 SPL 内置了对优先队列实现的支持。我们可以使用 `SplPriorityQueue`\
  \ 类来实现优先队列。以下是使用链表的前一个示例，但这次我们选择 SPL：\n\n```php\nclass MyPQ extends SplPriorityQueue\
  \ { \n    public function compare($priority1, $priority2) { \n        return $priority1\
  \ <=> $priority2; \n    }\n}\n\n$agents = new MyPQ();\n\n$agents->insert(\"Fred\"\
  , 1); \n$agents->insert(\"John\", 2);\n$agents->insert(\"Keith\", 3);\n$agents->insert(\"\
  Adiyan\", 4);\n$agents->insert(\"Mikhael\", 2);\n\n// 提取模式\n$agents->setExtractFlags(MyPQ::EXTR_BOTH);\
  \ \n\n// 移至顶部\n$agents->top();\n\nwhile ($agents->valid()) {\n    $current = $agents->current();\n\
  \    echo $current['data'] . \"\\n\";\n    $agents->next();\n}\n```\n\n\n\n这将产生与链表示例相同的结果。扩展我们自己的\
  \ `MyPQ` 类的额外优势在于，我们可以定义是按升序还是降序排序。在这里，我们选择降序，使用 PHP 组合比较运算符（即太空船运算符）进行排序。\n\n大多数情况下，优先队列是使用堆实现的。当我们进入堆章节时，我们也将使用堆来实现优先队列。\n\
  \n## 实现循环队列\n\n当我们使用标准队列时，每次出队一个项目，都必须重新缓冲整个队列。为了解决这个问题，我们可以使用循环队列，其中队尾后面跟着队头，形成一个圆圈。这种特殊类型的队列要求对入队和出队操作进行特殊计算，需考虑队尾、队头和队列的容量限制。循环队列始终是固定队列，也称为循环缓冲区或环形缓冲区。下图展示了循环队列的表示：\n\
  \n![](img/Image00030.jpg)\n\n我们可以使用 PHP 数组实现循环队列。由于我们必须计算队尾和队头部分的位置，数组可用于此目的以实现高效操作。以下是一个循环队列的示例：\n\
  \n```\nclass CircularQueue implements Queue { \n\n\n\n    private $queue; \n\n \
  \   private $limit; \n\n    private $front = 0; \n\n    private $rear = 0; \n\n\n\
  \n    public function __construct(int $limit = 5) { \n\n      $this->limit = $limit;\
  \ \n\n      $this->queue = []; \n\n    } \n\n\n\n    public function size() { \n\
  \n      if ($this->rear > $this->front) \n\n          return $this->rear - $this->front;\
  \ \n\n      return $this->limit - $this->front + $this->rear; \n\n    } \n\n\n\n\
  \    public function isEmpty() { \n\n      return $this->rear == $this->front; \n\
  \n    } \n\n\n\n    public function isFull() { \n\n      $diff = $this->rear - $this->front;\
  \ \n\n      if ($diff == -1 || $diff == ($this->limit - 1)) \n\n          return\
  \ true; \n\n      return false; \n\n    } \n\n\n\n    public function enqueue(string\
  \ $item) { \n\n      if ($this->isFull()) { \n\n          throw new OverflowException(\"\
  Queue is Full.\"); \n\n      } else { \n\n          $this->queue[$this->rear] =\
  \ $item; \n\n          $this->rear = ($this->rear + 1) % $this->limit; \n\n    \
  \  } \n\n    } \n\n\n\n    public function dequeue() { \n\n      $item = \"\"; \n\
  \n      if ($this->isEmpty()) { \n\n          throw new UnderflowException(\"Queue\
  \ is empty\"); \n\n      } else { \n\n          $item = $this->queue[$this->front];\
  \ \n\n          $this->queue[$this->front] = NULL; \n\n          $this->front =\
  \ ($this->front + 1) % $this->limit; \n\n      } \n\n      return $item; \n\n  \
  \  } \n\n\n\n    public function peek() { \n\n      return $this->queue[$this->front];\
  \ \n\n    }\n\n\n\n}\n```\n\n由于我们将 `0` 视为队头标记，因此队列的总大小将为 `limit - 1`。\n\n## 创建双端队列\n\
  \n到目前为止，我们实现的队列都是一端用于入队（称为队尾），另一端用于出队（称为队头）。因此，通常每一端都应用于特定目的。但如果我们需要从两端进行入队和出队操作怎么办？这可以通过双端队列的概念来实现。在双端队列中，两端都可用于入队和出队操作。如果我们查看基于链表的队列实现，会发现我们可以使用链表实现进行尾部插入、头部插入、尾部删除和头部删除。如果我们基于此实现一个新的双端队列类，就能轻松达成目标。下图描绘了一个双端队列：\n\
  \n![](img/Image00031.jpg)\n\n以下是双端队列的实现：\n\n```\nclass DeQueue { \n\n\n\n    private\
  \ $limit; \n\n    private $queue; \n\n\n\n    public function __construct(int $limit\
  \ = 20) { \n\n      $this->limit = $limit; \n\n      $this->queue = new LinkedList();\
  \ \n\n    } \n\n\n\n    public function dequeueFromFront(): string { \n\n\n\n  \
  \    if ($this->isEmpty()) { \n\n          throw new UnderflowException('Queue is\
  \ empty'); \n\n      } else { \n\n          $lastItem = $this->peekFront(); \n\n\
  \          $this->queue->deleteFirst(); \n\n          return $lastItem; \n\n   \
  \   } \n\n    } \n\n\n\n    public function dequeueFromBack(): string { \n\n\n\n\
  \      if ($this->isEmpty()) { \n\n          throw new UnderflowException('Queue\
  \ is empty'); \n\n      } else { \n\n          $lastItem = $this->peekBack(); \n\
  \n          $this->queue->deleteLast(); \n\n          return $lastItem; \n\n   \
  \   } \n\n    } \n\n\n\n    public function enqueueAtBack(string $newItem) { \n\n\
  \n\n      if ($this->queue->getSize() < $this->limit) { \n\n          $this->queue->insert($newItem);\
  \ \n\n      } else { \n\n          throw new OverflowException('Queue is full');\
  \ \n\n      } \n\n    } \n\n\n\n    public function enqueueAtFront(string $newItem)\
  \ { \n\n\n\n      if ($this->queue->getSize() < $this->limit) { \n\n          $this->queue->insertAtFirst($newItem);\
  \ \n\n      } else { \n\n          throw new OverflowException('Queue is full');\
  \ \n\n      } \n\n    } \n\n\n\n    public function peekFront(): string { \n\n \
  \     return $this->queue->getNthNode(1)->data; \n\n    } \n\n\n\n    public function\
  \ peekBack(): string { \n\n      return $this->queue->getNthNode($this->queue->getSize())->data;\
  \ \n\n    } \n\n\n\n    public function isEmpty(): bool { \n\n      return $this->queue->getSize()\
  \ == 0; \n\n    } \n\n\n\n}\n```\n\n现在我们将使用这个类来检查双端队列的操作：\n\n```\ntry { \n\n   \
  \ $agents = new DeQueue(10); \n\n    $agents->enqueueAtFront(\"Fred\"); \n\n   \
  \ $agents->enqueueAtFront(\"John\"); \n\n    $agents->enqueueAtBack(\"Keith\");\
  \ \n\n    $agents->enqueueAtBack(\"Adiyan\"); \n\n    $agents->enqueueAtFront(\"\
  Mikhael\"); \n\n    echo $agents->dequeueFromBack() . \"\\n\"; \n\n    $agents->dequeueFromFront()\
  \ . \"\\n\"; \n\n    echo $agents->peekFront() . \"\\n\"; \n\n} catch (Exception\
  \ $e) { \n\n    echo $e->getMessage(); \n\n}\n```\n\n如果我们查看前面的代码示例，首先我们在队头添加 `Fred`，然后再次在队头添加\
  \ `John`。所以序列现在是 `John`、`Fred`。接着我们在队尾添加 `Keith`，随后在队尾添加 `Adiyan`。现在序列变为 `John`、`Fred`、`Keith`、`Adiyan`。最后，我们在开头添加\
  \ `Mikhael`。所以最终序列是 `Mikhael`、`John`、`Fred`、`Keith`、`Adiyan`。\n\n由于我们首先执行从队尾出队操作，`Adiyan`\
  \ 将最先出队，然后从队头出队 `Mikhael`。新的队头 peek 将是 `John`。运行代码时的输出如下：\n\n```\nAdiyan\n\n\n\n\
  Mikhael\n\n\n\nJohn\n```\n\n## 总结\n\n栈和队列是最常用的数据结构之一。在未来的算法和数据结构中，我们可以以不同方式使用这些抽象数据类型。在本章中，我们学习了实现栈和队列的不同方法，以及不同类型的队列。在下一章中，我们将讨论递归——一种通过将大问题分解为较小实例来解决的特殊方法。\n\
  \n## 读累了记得休息一会哦~\n\n**公众号：古德猫宁李**\n\n*   电子书搜索下载\n*   书单分享\n*   书友学习交流\n\n**网站：**[沉金书屋\
  \ https://www.chenjin5.com](https://www.chenjin5.com)\n\n*   电子书搜索下载\n*   电子书打包资源分享\n\
  *   学习资源分享\n\n## 应用递归算法 - 递归\n\n解决复杂问题总是很难。即使对于程序员来说，解决复杂问题也可能更棘手，有时需要特殊的解决方案。递归就是这样一种计算机程序员遵循的特殊方法，用于解决复杂问题。在本章中，我们将介绍递归的定义、属性、不同类型的递归以及大量示例。递归不是一个新概念；在自然界中，我们看到许多递归元素。分形展示了递归行为。下图展示了自然界中的递归：\n\
  \n![](img/Image00032.jpg)\n\n## 理解递归\n\n\n\n\n## 递归\n\n递归是一种通过将大问题分解为小问题来解决的方法。换句话说，递归是将大问题分解为更小的相似问题来解决它们并获得实际结果。通常，递归被称为函数调用自身。这听起来可能很奇怪，但事实是当处于递归中时，函数必须调用自身。这看起来像什么？让我们看一个例子。\n\
  \n在数学中，“阶乘”一词非常常见。数字 `N` 的阶乘定义为所有小于等于 `N` 的正整数的乘积。它总是用 `!`（感叹号）表示。因此，`5` 的阶乘可以写成如下形式：\n\
  \n`5! = 5 X 4 X 3 X 2 X 1`\n\n同样，我们可以写出给定数字的以下阶乘：\n\n`4! = 4 X 3 X 2 X 1`\n\n`3!\
  \ = 3 X 2 X 1`\n\n`2! = 2 X 1`\n\n`1! = 1`\n\n如果我们仔细观察我们的例子，可以看到我们可以用 `4` 的阶乘来表示\
  \ `5` 的阶乘，如下所示：\n\n`5! = 5 X 4!`\n\n同样，我们可以写成：\n\n`4! = 4 X 3!`\n\n`3! = 3 X 2!`\n\
  \n`2! = 2 X 1!`\n\n`1! = 1 X 0!`\n\n`0! = 1`\n\n或者，我们可以简单地用通用术语说：\n\n`n! = n * (n-1)!`\n\
  \n这代表了递归。我们将每个步骤分解为更小的步骤并解决实际的大问题。这是一张展示如何计算 3 的阶乘的图片：\n\n![](img/Image00033.jpg)\n\
  \n因此，步骤如下：\n\n1. `3! = 3 X 2!`\n2. `2! = 2 X 1!`\n3. `1! = 1 X 0!`\n4. `0! = 1`\n\
  5. `1! = 1 X 1 = 1`\n6. `2! = 2 X 1 = 2`\n7. `3! = 3 X 2 = 6`\n\n### 递归算法的特性\n\n\
  现在，问题可能是，“如果一个函数调用自身，那么它如何停止或知道何时结束递归调用？”当我们编写递归解决方案时，必须确保它具有以下特性：\n\n1. 每次递归调用都应该针对一个更小的子问题。就像阶乘示例，6\
  \ 的阶乘通过 6 和 5 的阶乘的乘积来求解，依此类推。\n2. 它必须有一个基本情况。当达到基本情况时，将不再有进一步的递归，并且基本情况必须能够在没有任何进一步递归调用的情况下解决问题。在我们的阶乘示例中，我们没有从\
  \ 0 继续向下。所以，在这种情况下，0 是我们的基本情况。\n3. 不应该有任何循环。如果每次递归调用都调用同一个问题，那么将会有一个无休止的循环。经过一些重复后，计算机将显示栈溢出错误。\n\
  \n所以，如果我们现在使用 PHP 7 编写阶乘程序，它将如下所示：\n\n```php\nfunction factorial(int $n): int {\n\
  \n   if ($n == 0)\n\n    return 1;\n\n\n\n   return $n * factorial($n - 1);\n\n\
  }\n```\n\n在前面的示例代码中，我们可以看到有一个基本条件，当 `$n` 的值为 `0` 时返回 `1`。如果不满足此条件，则返回 `$n` 和 `$n-1`\
  \ 的阶乘的乘积。因此，它同时满足了第 1 点和第 3 点的特性。我们避免了循环，并确保每次递归调用都在创建一个更大问题的子问题。我们将像这个算法一样编写递归行为：\n\
  \n![](img/Image00034.jpg)\n\n### 递归与迭代算法\n\n如果我们分析我们的阶乘函数，可以看到它可以使用简单的迭代方法配合 `for`\
  \ 或 `while` 循环来编写，如下所示：\n\n```php\nfunction factorial(int $n): int { \n\n    $result\
  \ = 1; \n\n\n\n    for ($i = $n; $i > 0; $i--) {\n\n      $result *= $i; \n\n  \
  \  } \n\n\n\n    return $result; \n\n}\n```\n\n如果这可以写成一个简单的迭代版本，那为什么我们要使用递归？递归用于解决更复杂的问题。并非所有问题都能如此轻松地用迭代解决。例如，我们需要显示某个目录中的所有文件。我们可以简单地通过运行循环来列出所有文件来实现。但是，如果里面还有另一个目录怎么办？然后，我们必须运行另一个循环来获取该目录中的所有文件。如果那个目录里还有另一个目录，并且一直这样下去怎么办？在这种情况下，迭代方法可能完全无济于事，或者可能产生一个复杂的解决方案。最好在这里选择递归方法。\n\
  \n递归管理一个调用栈来管理函数调用。因此，与迭代相比，递归将占用更多内存和时间来完成。此外，在迭代中，每一步我们都可以得到一个结果，但对于递归，我们必须等到基本情况执行才能得到任何结果。如果我们同时考虑阶乘的迭代和递归示例，可以看到有一个名为\
  \ `$result` 的局部变量来存储每一步的计算。然而，在递归中，不需要局部变量或赋值。\n\n### 使用递归实现斐波那契数列\n\n在数学中，斐波那契数是特殊的整数序列，其中一个数由前两个数的和组成，如以下表达式所示：\n\
  \n![](img/Image00035.gif)\n\n如果我们使用 PHP 7 实现这一点，它将如下所示：\n\n```php\nfunction fibonacci(int\
  \ $n): int { \n\n    if ($n == 0) { \n\n    return 1; \n\n    } else if ($n == 1)\
  \ { \n\n    return 1; \n\n    } else { \n\n    return fibonacci($n - 1) + fibonacci($n\
  \ - 2); \n\n    } \n\n}\n```\n\n如果我们考虑前面的实现，可以看到它与之前的示例略有不同。现在，我们从一个函数调用中调用两个函数。我们将很快讨论不同类型的递归。\n\
  \n### 使用递归实现最大公约数计算\n\n递归的另一个常见用途是实现两个数的**最大公约数**（**GCD**）。在最大公约数计算中，我们将继续直到余数变为\
  \ 0。它可以表示如下：\n\n![](img/Image00036.jpg)\n\n现在，如果我们使用 PHP 7 递归实现，它将如下所示：\n\n```php\n\
  function gcd(int $a, int $b): int { \n\n    if ($b == 0) { \n\n     return $a; \n\
  \n    } else { \n\n     return gcd($b, $a % $b); \n\n    } \n\n}\n```\n\n这个实现另一个有趣的部分是，与阶乘不同，我们不是从基本情况返回到调用栈中的其他步骤。基本情况将返回计算出的值。这是进行递归的优化方法之一。\n\
  \n### 不同类型的递归\n\n到目前为止，我们已经看到了一些递归的示例情况以及它是如何被使用的。虽然术语说是递归，但有不同类型的递归。我们将逐一探索它们。\n\
  \n#### 线性递归\n\n编程世界中最常用的递归之一是线性递归。当函数在每次运行中调用自身一次时，我们称之为线性递归。就像我们的阶乘示例，当我们将大计算分解为更小的计算直到达到基本条件时，我们称之为“递推”（winding）。当我们从基本条件返回到第一次递归调用时，我们称之为“回归”（unwinding）。我们将在本章即将到来的部分中处理不同的线性递归。\n\
  \n#### 二叉递归\n\n在二叉递归中，函数在每次运行中调用自身两次。因此，计算取决于来自两个不同的对自身的递归调用的两个结果。如果我们看看我们的斐波那契数列生成递归函数，可以很容易地发现它是二叉递归。除此之外，编程世界中还有许多常用的二叉递归，例如二分查找、分治法、归并排序等。下图展示了二叉递归：\n\
  \n![](img/Image00037.jpg)\n\n---\n\n## 读累了记得休息一会哦~\n\n**公众号：古德猫宁李**\n\n* 电子书搜索下载\n\
  * 书单分享\n* 书友学习交流\n\n**网站：** [沉金书屋 https://www.chenjin5.com](https://www.chenjin5.com)\n\
  \n* 电子书搜索下载\n* 电子书打包资源分享\n* 学习资源分享\n\n#### 尾递归\n\n\n\n\n当递归方法在返回时没有待执行的挂起操作时，该方法即为尾递归。例如，在我们的阶乘代码中，返回值被用来与前一个值相乘以计算阶乘。因此，这不是尾递归。斐波那契数列的递归也是同理。如果我们观察最大公约数（GCD）的递归，会发现返回后没有任何操作需要执行。因此，最终的返回或基准情况的返回实际上就是答案。所以，GCD\
  \ 是尾递归的一个例子。尾递归也是线性递归的一种形式。\n\n## 相互递归\n\n可能会出现这样一种情况：我们需要以交替的方式从两个不同的方法中递归调用另外两个不同的方法。例如，函数\
  \ `A()` 调用函数 `B()`，而函数 `B()` 在每次调用中又调用函数 `A()`。这被称为相互递归。\n\n## 嵌套递归\n\n当一个递归函数调用将其自身作为参数时，称为嵌套递归。嵌套递归的一个常见例子是阿克曼函数。请看下面的方程：\n\
  \n![](img/Image00038.gif)\n\n如果我们看最后一行，可以看到函数 `A()` 被递归调用，但第二个参数本身又是另一个递归调用。所以，这是嵌套递归的一个例子。\n\
  \n虽然有不同类型的递归可用，但我们将仅根据需求使用那些必需的类型。现在，我们将在项目中看到一些递归的实际用例。\n\n## 使用递归构建 N 级分类树\n\n\
  构建多级嵌套分类树或菜向来是个难题。许多 CMS 和网站只允许特定层级的嵌套。为了避免因多次连接查询导致的性能问题，有些系统最多只允许 3-4 层嵌套。现在，我们将探讨如何在不牺牲性能的前提下，借助递归创建\
  \ N 级嵌套分类树或菜单。以下是我们的解决方案思路：\n\n1. 我们将在数据库中定义分类的表结构。\n2. 我们将不使用任何连接查询或多次查询，一次性获取表中的所有分类。这将是一个带有简单\
  \ select 语句的单次数据库查询。\n3. 我们将构建一个分类数组，以便利用递归来显示嵌套分类或菜单。\n\n假设我们在数据库中有一个用于存储分类的简单表结构，如下所示：\n\
  \n```\nCREATE TABLE `categories` ( \n  `id` int(11) NOT NULL, \n  `categoryName`\
  \ varchar(100) NOT NULL, \n  `parentCategory` int(11) DEFAULT 0, \n  `sortInd` int(11)\
  \ NOT NULL \n) ENGINE=InnoDB DEFAULT CHARSET=utf8;\n```\n\n为简单起见，我们假设表中不需要其他字段。此外，表中有如下数据：\n\
  \n| **Id** | **categoryName** | **parentCategory** | **sortInd** |\n| --- | ---\
  \ | --- | --- |\n| 1 | First | 0 | 0 |\n| 2 | Second | 1 | 0 |\n| 3 | Third | 1\
  \ | 1 |\n| 4 | Fourth | 3 | 0 |\n| 5 | Fifth | 4 | 0 |\n| 6 | Sixth | 5 | 0 |\n\
  | 7 | Seventh | 6 | 0 |\n| 8 | Eight | 7 | 0 |\n| 9 | Ninth | 1 | 0 |\n| 10 | Tenth\
  \ | 2 | 1 |\n\n现在，我们已经为数据库创建了表结构，并假设也已录入了一些示例数据。让我们构建一个查询来检索这些数据，以便进行递归解决方案：\n\n\
  ```\n$dsn = \"mysql:host=127.0.0.1;port=3306;dbname=packt;\"; \n$username = \"root\"\
  ; \n$password = \"\"; \n$dbh = new PDO($dsn, $username, $password); \n\n$result\
  \ = $dbh->query(\"Select * from categories order by parentCategory asc, sortInd\
  \ asc\", PDO::FETCH_OBJ); \n\n$categories = []; \n\nforeach($result as $row) { \n\
  \    $categories[$row->parentCategory][] = $row;\n}\n```\n\n上述代码的核心部分在于我们如何将分类存储在数组中。我们根据父分类存储结果。这将帮助我们递归地显示某个分类的子分类。这看起来非常简单。现在，基于分类数组，让我们编写递归函数以分层方式显示分类：\n\
  \n```\nfunction showCategoryTree(Array $categories, int $n) {\n    if(isset($categories[$n]))\
  \ { \n        foreach($categories[$n] as $category) {        \n            echo\
  \ str_repeat(\"-\", $n).\"\".$category->categoryName.\"\\n\"; \n            showCategoryTree($categories,\
  \ $category->id);          \n        }\n    }\n    return;\n}\n```\n\n上述代码实际上通过递归显示所有分类及其子分类。我们获取一个层级，首先打印该层级的分类。紧接着，我们通过代码\
  \ `showCategoryTree($categories, $category->id)` 检查它是否有任何子层级分类。现在，如果我们用根层级（第 0 层）调用递归函数，将得到以下输出：\n\
  \n```\nshowCategoryTree($categories, 0);\n```\n\n其输出如下：\n\n```\nFirst\n-Second\n\
  --Tenth\n-Third\n---Fourth\n----fifth\n-----Sixth\n------seventh\n-------Eighth\n\
  -Nineth\n```\n\n正如我们所见，无需考虑分类层级的深度或执行多次查询，仅凭一个简单的查询和递归函数，我们就能构建嵌套分类或菜单。如果我们想要带有动态显示/隐藏功能的嵌套菜单，可以使用\
  \ `<ul>` 和 `<li>` 来创建。这对于在不陷入实现障碍（如固定层级的连接或固定层级的分类）的情况下获得高效解决方案至关重要。前面的例子完美展示了尾递归，我们不需要等待递归返回任何内容，随着递归的推进，结果已经显示出来了。\n\
  \n## 构建嵌套评论回复系统\n\n我们经常面临如何妥善显示评论回复的挑战。按时间顺序显示有时并不符合需求。我们可能需要以一种方式显示它们，使每条评论的回复位于该评论本身的下方。换句话说，我们需要一个嵌套评论回复系统或线程式评论。我们想要构建类似于下面截图的东西：\n\
  \n![](img/Image00039.jpg)\n\n我们可以遵循嵌套分类部分的相同步骤。不过，这次我们将加入一些 UI 元素使其外观更逼真。假设我们有一个名为\
  \ `comments` 的表，包含以下数据和列。为简单起见，我们不涉及多表关系。我们假设用户名与评论存储在同一张表中：\n\n| **Id** | **comments**\
  \ | **username** | **Datetime** | **parentID** | **postID** |\n| --- | --- | ---\
  \ | --- | --- | --- |\n| 1 | First comment | Mizan | 2016-10-01 15:10:20 | 0 | 1\
  \ |\n| 2 | First reply | Adiyan | 2016-10-02 04:09:10 | 1 | 1 |\n| 3 | Reply of\
  \ first reply | Mikhael | 2016-10-03 11:10:47 | 2 | 1 |\n| 4 | Reply of reply of\
  \ first reply | Arshad | 2016-10-04 21:22:45 | 3 | 1 |\n| 5 | Reply of reply of\
  \ reply of first reply | Anam | 2016-10-05 12:01:29 | 4 | 1 |\n| 6 | Second comment\
  \ | Keith | 2016-10-01 15:10:20 | 0 | 1 |\n| 7 | First comment of second post |\
  \ Milon | 2016-10-02 04:09:10 | 0 | 2 |\n| 8 | Third comment | Ikrum | 2016-10-03\
  \ 11:10:47 | 0 | 1 |\n| 9 | Second comment of second post | Ahmed | 2016-10-04 21:22:45\
  \ | 0 | 2 |\n| 10 | Reply of second comment of second post | Afsar | 2016-10-18\
  \ 05:18:24 | 9 | 2 |\n\n现在让我们编写一个预处理语句来获取某篇文章的所有评论。然后，我们可以构建一个类似于嵌套分类的数组：\n\n```\n\
  $sql = \"Select * from comments where postID = :postID order by parentID asc, datetime\
  \ asc\"; \n$stmt = $dbh->prepare($sql, array(PDO::ATTR_CURSOR => PDO::CURSOR_FWDONLY));\
  \ \n$stmt->setFetchMode(PDO::FETCH_OBJ); \n$stmt->execute(array(':postID' => 1));\
  \ \n$result = $stmt->fetchAll(); \n\n$comments = []; \n\nforeach ($result as $row)\
  \ { \n    $comments[$row->parentID][] = $row;\n}\n```\n\n\n\n现在我们有了数组及其中所有必需的数据；现在可以编写一个递归调用的函数，以正确的缩进显示评论：\n\
  \n```php\nfunction displayComment(array $comments, int $n) {\n    if (isset($comments[$n]))\
  \ {\n        $str = \"<ul>\";\n        foreach ($comments[$n] as $comment) {\n \
  \           $str .= \"<li><div class='comment'><span class='pic'>{$comment->username}</span>\"\
  ;\n            $str .= \"<span class='datetime'>{$comment->datetime}</span>\";\n\
  \            $str .= \"<span class='commenttext'>{$comment->comment}</span></div>\"\
  ;\n            $str .= displayComment($comments, $comment->id);\n            $str\
  \ .= \"</li>\";\n        }\n        $str .= \"</ul>\";\n        return $str;\n \
  \   }\n    return \"\";\n}\n\necho displayComment($comments, 0);\n```\n\n由于我们在 PHP\
  \ 代码中添加了一些 HTML 元素，因此需要一些基础 CSS 使其生效。以下是我们编写的 CSS 代码，旨在实现简洁的设计。没有花哨的效果，纯 CSS 用于创建层叠效果以及评论各部分的基础样式：\n\
  \n```css\nul {\n    list-style: none;\n    clear: both;\n}\n\nli ul {\n    margin:\
