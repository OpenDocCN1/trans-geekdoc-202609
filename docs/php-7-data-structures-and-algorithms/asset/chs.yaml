  \n*   电子书搜索下载\n*   电子书打包资源分享\n*   学习资源分享\n\n## 总结\n\n对于 PHP 开发者来说，函数式编程相对较新，因为其前提条件的支持是在\
  \ 5.4 版本中添加的。函数式编程的出现要求我们理解该范式，并在需要时编写无副作用的纯函数。PHP 对编写函数式代码有很好的支持，利用这一点，我们也可以编写函数式数据结构和算法实现，正如我们在本书中尝试展示的那样。在不久的将来，这可能有助于优化和提高我们应用程序的效率。\n"
