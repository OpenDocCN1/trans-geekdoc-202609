- pgno: 56
  md: '# 12: Have you ever been in a situation where one of your strengths became
    a weakness in an alternate setting?


    Answer:

    It''s important to show an awareness of yourself by having an answer for this
    question, but you want to make sure that the weakness is relatively minor, and
    that it would still remain a strength in most settings. For instance, you may
    be an avid reader who reads anything and everything you can find, but reading
    billboards while driving to work may be a dangerous idea.


    # 13: Who has been the most influential person in your life?


    Answer:

    Give a specific example (and name) to the person who has influenced your life
    greatly, and offer a relevant anecdote about a meaningful exchange the two of
    you shared. It''s great if their influence relates to your professional life,
    but this particular question opens up the possibility to discuss inspiration in
    your personal life as well. The interviewer wants to see that you''re able to
    make strong connections with other individuals, and to work under the guiding
    influence of another person.


    # 14: Do you consider yourself to be a “detailed” or “big picture” type of person?


    Answer:

    Both of these are great qualities, and it’s best if you can incorporate each into
    your answer. Choose one as your primary type, and relate it to experience or specific
    items from your resume. Then, explain how the other type fits into your work as
    well.


    # 15: What is your greatest fear?


    Answer:

    Disclosing your greatest fear openly and without embarrassment is a great way
    to show your confidence to an employer. Choose a fear that you are clearly doing
    work to combat, such as a fear of failure that will seem impossible to the interviewer
    for someone'
