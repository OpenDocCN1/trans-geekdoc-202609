  md: 'prepared! Be sure that you''ve researched the company, their objectives, and
    their services prior to the interview, and know as much about the specific position
    as you possibly can. It''s also helpful to learn about the company''s history
    and key players in the current organization.


    # 46: If you were hired here, what would you do on your first day?


    Answer: While many people will answer this question in a boring fashion, going
    through the standard first day procedures, this question is actually a great chance
    for you to show the interviewer why you will make a great hire. In addition to
    things like going through training or orientation, emphasize how much you would
    enjoy meeting your supervisors and coworkers, or how you would spend a lot of
    the day asking questions and taking in all of your new surroundings.


    # 47: Have you viewed our company''s website?


    Answer: Clearly, you should have viewed the company''s website and done some preliminary
    research on them before coming to the interview. If for some reason you did not,
    do not say that you did, as the interviewer may reveal you by asking a specific
    question about it. If you did look at the company''s website, this is an appropriate
    time to bring up something you saw there that was of particular interest to you,
    or a value that you especially supported.


    # 48: How does X experience on your resume relate to this position?


    Answer: Many applicants will have some bit of experience on their resume that
    does not clearly translate to the specific job in question. However, be prepared
    to be asked about this type of seemingly-irrelevant experience, and have a response
    prepared that takes into account similar skill sets or training that the two may
    share.'
