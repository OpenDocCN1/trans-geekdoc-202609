- pgno: 29
  md: "# 106: What do you mean by greedy regular expression matching? Are PHP regexes\
    \ greedy? How do you overcome this problem?\n\nAnswer:\nRegular Expressions are\
    \ also known as regex. The standard quantifiers in regular expressions are greedy,\
    \ meaning they match as much as they can, only giving back as necessary to match\
    \ the remainder of the regex. We use “?” inside the regex to oppose this behavior.\n\
    \n# 107: What is the difference between preg_replace and ereg_replace?\n\nAnswer:\n\
    Ereg_replace uses a basic version of regular expression, while preg_replace uses\
    \ the perl-compatible regular expressions.\n\n# 108: Can you write a PHP regular\
    \ expression to see if an email address is valid or not?\n\n```\nAnswer:\n/^[^@\\\
    s]+@([-a-z0-9]+\\.)+[a-z]{2,}$/i\n```\n\n# 109: Can you write a PHP function to\
    \ extract URLs from an HTML document?\n\n```\nAnswer:\nfunction pc_link_extractor($s)\
    \ {\n    $a = array();\n    if (preg_match_all('/<a\\s+.*?href=[\\\"\\' ]?([^\\\
    \"\\' >]*)[\\\"\\' ]?[^>]*>(.*)<\\/a>/i', $s, $matches, PREG_SET_ORDER)) {\n \
    \       foreach($matches as $match) {\n            array_push($a,array($match[1],$match[2]));\n\
    \        }\n    }\n    return $a;\n}\n```\n\n# 110: How can we extract string\
    \ 'abc.com' from a string"
  merge: -1
  img_proc: true
