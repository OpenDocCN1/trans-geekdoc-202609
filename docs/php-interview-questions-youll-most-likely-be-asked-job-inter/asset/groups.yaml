    ## Forms, Cookies and Session Management


    ### 183: How do you prevent form hijacking in PHP?


    Answer:

    User input sanitization (client side data validation), form submission key validation,
    prevention of SQL injection attacks, are some of the important factors to prevent
    form hijacking in PHP.


    ### 184: Where does PHP store the cookies and sessions data?


    Answer:

    PHP stores the cookies on client’s machine and session data on server.


    ### 185: What are the differences between GET and POST methods?


    Answer:

    The data submitted by GET method is displayed as part of the URL of the web page
    and hence it is used for small amount of data, which is insensitive. POST method
    is used for sensitive and/or large data.


    ### 186: How do you write the form tag for correct upload of files with PHP?


    Answer:

    We need to use the method as POST and enctype as “multipart/form-data” in order
    for upload to work properly.


    ### 187: How do you get the browser properties using PHP?


    Answer:

    One can get the browser properties using this - echo $_SERVER[''HTTP_USER_AGENT'']
    in PHP. Additionally, one can use get_browser function.


    ### 188: How do you delete the cookie with PHP?


    Answer:

    One can set the cookie in the past to achieve this.


    ### 189: What is a persistent cookie?


    Answer:

    A persistent cookie is a cookie which is stored permanently on browser’s machine.
    Persistent cookies can be used for tracking long term information.


    ### 190: How to read the value of a cookie that’s already set?


    Answer:

    A cookie’s value isn’t available in $_COOKIE during the request in which the cookie
    is set. In other words, the setcookie() function doesn’t alter the value of $_COOKIE.
    On subsequent requests, however, each cookie is stored in $_COOKIE.


    ### 191: How do you change the default session time in PHP?


    Answer:

    The default session time in PHP is 1440 seconds and that can be changed in PHP.ini
    file.


    ### 192: Suppose you want to retrieve a page that requires a cookie to be sent
    with the request for the page. Can you do it using PHP?


    Answer:

    This can be achieved using PHP cURL extension and CURLOPT_COOKIE option.


    ### 193: Can we store the session data in the database instead of plain files?
    What’s the advantage of doing this?


    Answer:

    One can store the session data in database instead of files using pc_DB_session
    class. The advantage of doing this is that multiple web servers can have access
    to the same database.


    ### 194: Can you have multiple active session objects at a time in PHP?


    Answer:

    No, it is not possible in PHP to have multiple active session objects at one time.


    ### 195: What should be done to handle multiple page form when we need to preserve
    from one page to the next?


    Answer:

    One needs to use session tracking to achieve this. Session tracking is secure
    because user cannot modify session variables.


    ### 196: Are you aware of the resubmission of form? How do you get around this
    issue?


    Answer:

    We can generate a unique identifier and pass this as a hidden field with the form.
    We can generate an error, if the token has been used already. This prevents the
    resubmission of the form.


    ### 197: What will happen to sessions if client side cookies are disabled?


    Answer:

    Session is kind of a cookie which works on server side. For working of session
    on server side, cookies should be enabled on server side and also on client side
    browser. But session will also work when cookies are disabled on client side.
    This works by using URL session passing.


    ### 198: What is meant by session in PHP?


    Answer:

    Session is a mechanism for persisting information between page requests from a
    particular user. After calling session_start(), data stored in the $_SESSION superglobal
    will continue to be accessible in future page requests from a client identified
    by a cookie, POST variable or GET parameter.


    ### 199: Which function do we need to use to use our own session-handling functions?


    Answer:

    One needs to use session_set_save_handler to use our own session handling functions.


    ### 200: How do you verify cookie data to make sure user has not altered the data?


    Answer:

    We can compute the MD5 hash of the data and verify it when you receive back the
    same data.


