  - '[PAGE 66]


    # 49: Why do you want this position?


    Answer:

    Keep this answer focused positively on aspects of this specific job that will
    allow you to further your skills, offer new experience, or that will be an opportunity
    for you to do something that you particularly enjoy. Don''t tell the interviewer
    that you''ve been looking for a job for a long time, or that the pay is very appealing,
    or you will appear unmotivated and opportunistic.


    # 50: How is your background relevant to this position?


    Answer:

    Ideally, this should be obvious from your resume. However, in instances where
    your experience is more loosely-related to the position, make sure that you''ve
    researched the job and company well before the interview. That way, you can intelligently
    relate the experience and skills that you do have, to similar skills that would
    be needed in the new position. Explain specifically how your skills will translate,
    and use words to describe your background such as “preparation” and “learning.”
    Your prospective position should be described as an “opportunity” and a chance
    for “growth and development.”


    # 51: How do you feel about X mission of our company?


    Answer:

    It''s important to have researched the company prior to the interview – and if
    you''ve done so, this question won''t catch you off guard. The best answer is
    one that is simple, to the point, and shows knowledge of the mission at hand.
    Offer a few short statements as to why you believe in the mission''s importance,
    and note that you would be interested in the chance to work with a company that
    supports it.


