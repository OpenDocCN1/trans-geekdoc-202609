    E_USER_NOTICE: User-generated notice message.

    E_STRICT: Run-time notices.

    E_RECOVERABLE_ERROR: Catchable fatal error indicating a dangerous error

    E_ALL: Catches all errors and warnings


    # 4: Can you know the screen resolution from a PHP script? If yes, how and if
    no, why?


    Answer:

    PHP being a server side scripting language, it cannot know the client side details.
    The reason PHP can know about the browser is that that information sent with HTTP
    headers to the web server.


    # 5: What is the difference between the functions unlink and unset?


    Answer:

    Unlink is a function for file system handling which deletes a file and Unset is
    a function used to destroy a variable.


    # 6: How do you read the entire file in a string in PHP?


    Answer:

    One can use file_get_contents to read the entire file into a single string.


    # 7: What’s the most important difference between PHP4 and PHP5?


    Answer:

    PHP4 does not support OOP, but PHP5 supports OOP.


    # 8: What is type juggling in PHP?


    Answer:

    Type juggling means that PHP does not require explicit type definition in variable
    declaration. A variable’s type is determined by the context in which the variable
    is used. That is to say, if a string value is assigned to variable $var, $var
    becomes a string. If an integer value is then assigned to $var, it becomes an
    integer.'
