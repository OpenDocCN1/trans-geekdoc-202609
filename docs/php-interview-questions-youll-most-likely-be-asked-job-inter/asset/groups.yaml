    ### 1：您最大的成功是什么？


    回答：

    您最大的成功应该是对您尤其有意义，并且您可以激动地谈论的事情——面试官能够看出来。请始终为这个问题准备好答案，并务必解释您是如何取得成功的，以及您从中学到了什么。


    ### 2：是什么激励您？


    回答：

    最好关注工作中您可以作为日常工作“驱动力”的关键方面。无论是客户服务、带来改变，还是进一步提升技能和获得经验的机会，面试官看到您对职业的热情和对职位的投入都很重要。


    ### 3：当失去动力时您会怎么做？


    回答：

    最佳候选人会回答，他们很少失去动力，因为他们已经采用策略来保持灵感，并且始终致力于自己的目标。此外，您可以通过解释自己因实现目标和进步而感到有动力，因此小的成功总是重新获得动力的绝佳方式，从而给面试官留下深刻印象。


    ### 4：空闲时间您喜欢做什么？


    回答：

    您在这里回答什么远不如您不回答什么重要——面试官不想听到您喜欢喝酒、聚会或沉溺于夜生活。相反，请选择一些活动来关注，这些活动是稳定和成熟的更大迹象，并且不会影响您上班和高效工作的能力，例如阅读、烹饪或摄影。这也是展示您的绝佳机会


