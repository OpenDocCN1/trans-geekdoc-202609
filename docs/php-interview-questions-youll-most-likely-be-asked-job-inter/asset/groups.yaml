    ## PHP Basics


    ### 1: Can PHP comments be nested?


    **Answer:**

    PHP supports C, C++ and perl style of comments. PHP C-style comments cannot be
    nested.


    ### 2: What''s the difference between echo and print?


    **Answer:**

    echo and print both are PHP constructs used for printing on the console. The main
    difference is that echo doesn''t return any value, while print does. This makes
    echo faster than print.


    ### 3: What are the different types of errors in PHP?


    **Answer:**

    PHP has three different types of errors:


    - a) Notices: Non-trivial and non-critical errors that don''t cause termination
    of script. For example, using a variable that has not been defined yet.


    - b) Warnings: For example, attempting to include file which doesn''t exist. These
    errors are displayed to the users by default.


    - c) Fatal Errors: These cause the termination of script. For example, calling
    a non-existent function.


    These can be listed as below –


    - E_ERROR: A fatal error that causes script termination

    - E_WARNING: Run-time warning that does not cause script termination

    - E_PARSE: Compile time parse error.

    - E_NOTICE: Run time notice caused due to error in code

    - E_CORE_ERROR: Fatal errors that occur during PHP''s initial startup (installation)

    - E_CORE_WARNING: Warnings that occur during PHP''s initial startup

    - E_COMPILE_ERROR: Fatal compile-time errors indication problem with script.

    - E_USER_ERROR: User-generated error message.

    - E_USER_WARNING: User-generated warning message.

    - E_USER_NOTICE: User-generated notice message.

    - E_STRICT: Run-time notices.

    - E_RECOVERABLE_ERROR: Catchable fatal error indicating a dangerous error

    - E_ALL: Catches all errors and warnings


    ### 4: Can you know the screen resolution from a PHP script? If yes, how and if
    no, why?


    **Answer:**

    PHP being a server side scripting language, it cannot know the client side details.
    The reason PHP can know about the browser is that that information sent with HTTP
    headers to the web server.


    ### 5: What is the difference between the functions unlink and unset?


    **Answer:**

    Unlink is a function for file system handling which deletes a file and Unset is
    a function used to destroy a variable.


    ### 6: How do you read the entire file in a string in PHP?


    **Answer:**

    One can use file_get_contents to read the entire file into a single string.


    ### 7: What’s the most important difference between PHP4 and PHP5?


    **Answer:**

    PHP4 does not support OOP, but PHP5 supports OOP.


    ### 8: What is type juggling in PHP?


    **Answer:**

    Type juggling means that PHP does not require explicit type definition in variable
    declaration. A variable’s type is determined by the context in which the variable
    is used. That is to say, if a string value is assigned to variable $var, $var
    becomes a string. If an integer value is then assigned to $var, it becomes an
    integer.


    ### 9: How do you sort multidimensional arrays using PHP?


    **Answer:** This can be done using array_multisort function in PHP.


    ### 10: How do you find if the value is in the array or not?


    **Answer:** This can be done using in_array() function in PHP


    ### 11: How do I find out the number of parameters passed into function?


    **Answer:** The func_num_args() function returns the number of parameters passed
    in.


    ### 12: Does PHP support pass by reference?


    **Answer:** Yes, PHP supports pass by reference.


    ### 13: What''s the difference between print and printf?


    **Answer:** Print is a construct and printf is a function. Printf allows formatted
    output, while print doesn''t.


    ### 14: How do you find the MD5 hash of a string in PHP?


    **Answer:** The md5() function calculates the MD5 hash of a string in PHP.


    ### 15: What is Zend engine?


    **Answer:** The Zend engine is the open source scripting engine, commonly known
    for the important role it plays in the web automation language PHP.


    ### 16: Should we use single-quoted strings or double quoted strings?


    **Answer:**

    For variable substitutions, we need to use double quoted strings. If that’s not
    required, for speed purpose, we should use single quoted strings.


    ### 17: How can you redirect a PHP page?


    **Answer:** This can be done using PHP function header().


    ### 18: What is the use of urlencode() function?


    **Answer:** Urlencode() returns the URL encoded version of the given string. URL
    encoded strings are safe to be used as part of the URLs.


    ### 19: Are PHP language constructs case-sensitive?


    **Answer:** No, PHP constructs are not case-sensitive.


    ### 20: Are PHP variable names case-sensitive?


    **Answer:** Yes, PHP variables are case-sensitive.


    ### 21: How do you pick a random value from an array in PHP?


    **Answer:** This can be achieved using array_rand() function in PHP.


    ### 22: How do you get the size of the array in PHP?


    **Answer:** One can get the size of the array using count() function in PHP.


    ### 23: How can you access remote objects in PHP?


    **Answer:** We can access remote objects by using CORBA extension.


    ### 24: Are PHP strings immutable?


    **Answer:** No, PHP strings are not immutable, they can be modified.


    ### 25: What all databases are supported with PHP?


    **Answer:**

    MySQL, MSSQL, Sybase, oracle, mSQL, FrontBase are the databases supported with
    PHP.


    ### 26: What’s the basic difference between JAVASCRIPT and PHP?


    **Answer:**

    JavaScript is a client side scripting language while PHP is a server side scripting
    language.


    ### 27: How can you find the similarity between two strings in PHP?


    **Answer:**

    We can calculate the similarity between two strings using similar_text() function.


    ### 28: How do you find the ASCII value of a character in PHP?


    **Answer:**

    One can use the ord() method in PHP to get the ASCII value of a character.


    ### 29: Which function one needs to use to format a real number in PHP?


    **Answer:**

    PHP offers a function number_format() to format a real number.


    ### 30: Let’s assume you have a string that has multiple newline characters inside
    it. How can you replace all the newlines to HTML line breaks?


    **Answer:**

    PHP has a function nl2br that inserts HTML line breaks for newlines.


    ### 31: What all are the magic methods in PHP?


    **Answer:**

    The function names __construct, __destruct, __call, __callStatic,

