    complete the feedback form and send your preference of color.</p><p><input type
    ="submit" name="submit" value="color"></form><?phpif($cookies) {print"Your preference
    has been saved.";}?></body></html>

    ```


    Basically the code above is a combination of the cookie PHP file and its HTML
    page. The only addition is the line `if(isset($_POST[''submit''])){ }` this condition
    and function in PHP allows us to write a PHP file for the cookies as a single
    file instead of two different files.


    The `isset()` function checks if the submit button in the HTML form has been clicked
    or not. If yes it will continue with the lines inside the bracket which is the
    creation of the cookie. Most hosting sites of websites will allow for this kind
    of mix of PHP and HTML in a single PHP file. It is also possible to have PHP within
    HTML files. Check with the hosting service before signing up or after on any configurations
    they may require. This advice is for those who use shared hosting.


    ## Session


    A session provides a way to track data for a user over a number of pages. Cookie
    stores data on the client and a session stores it on the server. In addition to
    this a session has the following characteristics.


    1. They are more secure, as the data is on the server only.

    2. They allow for storage of more information than a cookie.

    3. They can be made to work even if cookies are not accepted by the user of the
    website.


    A session is like the English meaning of the word (a period of time-like a class
    session). A random session ID is created when a session starts. This is a reference
    to that particular session and its stored data.


    The session ID is sent to the web browser as a cookie and following PHP pages
    will use this cookie to get the session ID to access its data.


    To start or create a session in PHP we start with the `session_start()` function.
    This function must be one of the first lines on every PHP page that uses sessions.


    The cookie which is sent to the browser will have a name such as `PHPSESSID` and
    a value such as `3bcc37dc87cb4b54d63f99da23fb41f1`.


    Once the session has started one can record data to it by assigning values to
    the `$_SESSION` array.


    ```php

    $_SESSION[''color''] =''Yellow'';

    $_SESSION[''age''] =35;

    ```


    The data is written to a temporary file stored on the server. Let us look at the
    following code.


    This code is for a login box.


    ```php

    <?phpif(isset($_POST[''submit''])){if ($_POST[''username'']==''admin'' && $_POST[''password'']==''admin''){session_start();$_SESSION[''username'']
    =''admin'';$_SESSION[''login''] =time();print"You are logged in";exit();}}?><html><head><title>Session
    Example</title></head><body><form action="session.php" method="post"> <p>Username:<input
    type="text" name="username" size="20"><p>Password:<input type="text" name="password"
    size ="20"><p><input type ="submit" name="submit" value="Submit"></form></body></html>

    ```


    The login box will look as follows.


    ![](images/00039.jpeg)


    This code starts with the `isset` function seen in the last cookie example. This
    checks if the submit button is hit or not.


    The next `if` statement checks if the password and username are as required. If
    it is it will print a message and `exit()` function will stop execution of any
    further code. Alternatively if there is a welcome page to be directed to one can
    use the `header()` function as follows- `header(''Location:welcome.php'');` followed
    by `exit();` Make the change in the above code.


    If the username and password entered is incorrect the program will display an
    empty form for further login attempt.


    So now we have started the session for login page. To access session variables
    let us first create the `welcome.php` file so that once the user logs in they
    will get this page.


    From this page we will access the logged in period of the user.


    The welcome page looks like this in terms of code.


    ```php

    <?phpsession_start();print"Welcome to my webpage!!<p>";print ($_SESSION[''username'']);print"<p>You
    have logged in since:<p>";print date(''g:i a'',$_SESSION[''login'']);print "<p><a
    href=logout.php>Logout</a>";?>

    ```


    This code will print the welcome message with the username and the state the time
    and given an option to logout. The output of this code is as follows.


    ![](images/00040.jpeg)


    The logout page script look as follows.


    ```php

    <?phpprint"You have logged out!!<p>";?>

    ```


    The logout script will be changed shortly. The last point in sessions is how to
    delete a session.


    To do this start with `session_start()` and then delete the session variables
    which in our example is username and login time using the `unset()` function.


    ```php

    unset($_SESSION);

    ```


    Finally the data is removed from the server using the `session_destroy()` function.
    Therefore, the above logout script will look as follows.


    ```php

    <?phpsession_start();unset($_SESSION);session_destroy();print"You have logged
    out!!<p>";print"Thank you for visiting my page.";?>

    ```


    After you see the logout page try to hit the back button and see what happens.


    The output is as follows:


    ![](images/00041.jpeg)


    A point to note is that sessions might be implemented slightly differently on
    web hosting where hosting is of shared type. Thus it is important to check with
    the web host faq table or technical support on how it is configured for such kind
    of hosting.


    ## User Defined Functions in PHP


    Functions in PHP can be user made. The functions seen thus far have been already
    defined in PHP.


    A user defined functions is useful when there is no known function that does a
    particular task. Function like in all programming languages decrease repetition
    of code and actually decreases the size the overall lines of code.


    The format of making a function is a follows:


    ```php

    function function_name() {

    statements;

    }

    ```


    The function names follow the same rules of variable names except there is no
    `$` sign for a function. The statements within the `{}` can be any valid PHP statement.


    Let us now look a user made function. This one is called `make_car_menu` and from
    the name it should be obvious that this function is related to cars.


    ```php

    <?phpfunction make_car_menu (){$car =array(1=>''Nissan'',2=>''GM'',3=>''Ford'',4=>''Toyota'',5=>''Mazda'',6=>''Tesla'',7=>''Mitsubishi'',8=>''Hyundai'',9=>''VW'',10=>''BYD'');print"<select
    name=''car''>";foreach ($car as $key=>$value){print"<option value=$key>$value</option>";}print"<select>";}//end
    of functionprint"<form action='''' method=''post''>";make_car_menu();print"</form>";?>

    ```

