    \ 1 和项目 2 之间进行选择以显示。\n\n请注意，在 HTML 文件中，为每个选项在 option 语句中给出了一个值。\n\n正是此值作为选择发送到\
    \ PHP 文件。\n\nHTML 中的选择选项非常方便。然而，其局限性在于，在 Web 浏览器屏幕上显示大量选项可能会很烦人。\n\n### PHP 中的循环\n\
    \nPHP 中的循环重复一组语句，直到条件不再为真为止。`for` 循环是 PHP 中循环控制结构的一个示例。`for` 循环的结构如下：\n\n```php\n\
    for ($x =1; $x<=10; $x++) {\nprint $x;\n}\n```\n\n这里在 `for` 循环中有一个初始点，即 `$x =1`，然后是一个条件，即\
    \ `$x<=10`（小于等于 10）。如果条件满足，则将 `x` 的值递增 1 并每次打印 `x` 的值。\n\n因此数字将从 1 到 10 包含。\n\n\
