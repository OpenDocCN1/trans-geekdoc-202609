    # Chapter 8. PHP for MySQL Database


    In this chapter, the emphasis is to write a PHP code targeting a MySQL database
    and table. If this script is being run on an editor on a standalone computer or
    notebook, then the path to the database is the first thing to be found out.


    This information will be available in the FAQ’s part of the hosting service in
    case code is being written directly on the shared hosting location.


    In the previous chapter, a staff table was shown. This table will be used in this
    chapter to demonstrate the select, insert, update and delete queries.


    The first step in getting data from a table in the database or adding data to
    it is to connect to MySQL in the first place. Note: The examples that follow are
    for PHP version 5 series. For version 7 check end of chapter.


    To this end the function `mysql_connect` is used to connect to MySQL in PHP when
    the target database is MySQL. Anything that is opened has to be closed in programming
    so the `mysql_close()` function plays this role.


    ```

    <html><body><?phpif($dx =mysql_connect(''localhost'',''root '','' '')){print"Connected
    to MySQL.";mysql_close();} else {print"Could not connect to MySQL.";}?></body></html>

    ```


    The connection mechanism is shown above in the PHP script. The line `mysql_connect(''localhost'',''
    root'','' ''))` will be slightly different on the webhost being used. The localhost
    is followed by a username and password.


    In the case of a developer software on a standalone machine the username is usually
    root but this needs to be verified in the help manual of PHP editor being used.


    Now the second step after connecting to MySQL, is to connect to the selected database
    followed by the table to do some action. Let us start our example of the action
    by selecting the select or retrieval option.


    ```

    <html><body><?php$link_id = mysql_connect( ''localhost'',''root'','''') or die
    ("Could not connect: " . mysql_error());mysql_select_db( "thottungal", $link_id
    );$sql = "SELECT * FROM staff";$result_id = mysql_query( $sql, $link_id ) or die
    ( "Statement failed: " . mysql_error() );$x=mysql_num_rows($result_id);print "<b>Total
    number of entries retrieved: </b>$x";print "<table border=1 width=800>";while
    ( $row = mysql_fetch_array( $result_id ) ) {print "<tr><td>".$row[''sid'']."</td>"."<td>".$row[''name'']."</td>"."<td>".$row[''job'']."</td>"."<td>".$row[''salary'']."</td>"."<td>".$row[''location'']."</td></tr>";}mysql_close(
    $link_id );print "</table>";?></body></html>

    ```


    We are using the staff table used in the previous chapter to retrieve all the
    rows in it. There are seven (7) rows in that table. The meaning of the lines of
    code above are as follows:


    `$link_id = mysql_connect( ''localhost'',''root'','''') or die ("Could not connect:
    " . mysql_error());`


    Connect to My SQL. If not give an error and the program stops there.


    `mysql_select_db( "thottungal", $link_id );`


    Having connected to MySQL look for the database.


    `$sql = "SELECT * FROM staff";`


    Write the query that needs to be run in the database.


    `$result_id = mysql_query( $sql, $link_id ) or die ( "Statement failed: " . mysql_error()
    );`


    Run the query and save the result in a variable or give an error.


    `$x=mysql_num_rows($result_id);`


    This line will give the number of rows of available for this query.


    ```

    while ( $row = mysql_fetch_array( $result_id ) ) {

    print "<tr><td>".$row[''sid'']."</td>"."<td>".$row[''name'']."</td>"."<td>".$row[''job'']."</td>"."<td>".$row[''salary'']."</td>"."<td>".$row[''location'']."</td></tr>";

    }

    ```


    The rows of the query will be printed through a loop. Here the while loop is used.
    Each column or field expected in the query is put within rows of a table. Here
    the quotations are very important. Usual errors are not enclosing the elements
    in the correct quotations.


    `mysql_close( $link_id );`


    ## The database has to be closed and so is the table. The result of running this
    code is as follows:


    ![](images/00054.jpeg)


    If all the fields are not needed, then just write the one that are to displayed
