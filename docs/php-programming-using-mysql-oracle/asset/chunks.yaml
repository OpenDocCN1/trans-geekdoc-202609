    \ 之后的语句，依此类推。`break` 告诉 PHP 在找到正确的 case 匹配后退出。\n\n看下面的 PHP 代码。\n\n```php\n<?php\n\
    $x =$POST['choice'];\nswitch($x){\ncase 1:\nIf ($x ==1){\nprint \"You have chosen\
