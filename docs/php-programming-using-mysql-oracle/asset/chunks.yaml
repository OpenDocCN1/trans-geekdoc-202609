    path method will be given in the host''s technical faqs sheet. To create a table
    such as staff click on the structure tab and put in the name and number of columns
    as shown below.


    ![](images/00051.jpeg)


    To complete the table creation, enter the data types and field lengths of each
    field of the staff table and select `sid` as the primary key. Primary key is a
    field whose value does not repeat and is required. The fields of the staff table
    introduced earlier are `sid`, `name`, `job`, `salary` and `location`. Out of these
    all are text except for `salary` which is a number.


    The following shows the table field details.


    ![](images/00052.jpeg)


