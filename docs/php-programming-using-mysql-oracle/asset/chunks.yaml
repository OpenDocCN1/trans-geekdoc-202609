    # 概述


    PHP 是一种用于开发世界范围内动态网页的编程语言。HTML 或超文本标记语言是开发网页的基础，但用 HTML 创建的页面是静态的。PHP 使这些 HTML
    页面能够与数据库交互，并执行诸如添加数据或从中检索数据等操作。


    此外，PHP 可用于创建验证用户输入并为页面提供保护的能力。理解 PHP 的前提是 HTML。JavaScript 允许网页具有动态性，然而 JavaScript
    不是基于服务器的。它在客户端浏览器中运行。另一方面，PHP 是基于服务器的。事实是，要完成一个专业外观且可工作的页面，需要 HTML、JavaScript
    和 PHP 之类的脚本语言。


    本书关于 PHP。 如果需要复习该主题，可以考虑我的 JavaScript 书籍。


    本书的网页位于：http://beamto.fjtbooks


    开始之前：


    要运行 PHP 脚本，这是一种基于服务器的脚本，需要以下内容：


    用于保存扩展名为 ".php" 的文件的记事本编辑器或类似工具。以及


    放置完成后的脚本的位置。这可以是托管站点，其中有许多（免费或廉价的网络托管站点）允许 PHP 脚本。在独立计算机上，可以下载免费的 PHP 编辑器软件。本书的代码使用
    EasyPHP 编辑器（版本 17）和服务器开发，该编辑器和服务器在撰写本书时可以免费下载并安装。PHP 有不同的版本，当前版本是 7。本书适用于版本 5
    和 7。 这两个版本之间存在一些显著差异。然而，许多托管站点仍在使用版本 5 系列。


    大多数 PHP 托管站点包含的默认数据库是 MySQL，并且像上面提到的这样的免费编辑器也附带此类数据库。除了此数据库外，本书还将探讨连接到 Oracle
    数据库的连接。 本书中使用的 Oracle 数据库是可单独使用的 Windows 版本 11.2g Express 版本，可免费下载，网址为 http://www.oracle.com。


    # 第 1 章. 简介


    在任何语言中，按不成文的传统，第一个程序都是“Hello World”。在 PHP 中实现的方法如下：


    使用扩展名为 ".php" 的记事本创建一个名为 hello (`hello.php`) 的文件。 在该文件中输入以下行。


    ```

    <?php  print "Hello World!!!";?>

    ```


    `print` 也可以被单词 `echo` 替换。


    现在如果有人想将其包装在 HTML 标签中是可以的，例如：


    ```

    <html><body><?php  print "Hello World!!!";?></body></html>

    ```


    `<?` 开始 PHP 代码部分，`?>` 结束它。两者都是强制性的。如果此代码放在没有 PHP 的服务器上，此代码的每一行都将对用户可见。


    这实际上是本书中 PHP 的第一个程序。


    ```

    <html><body><?php  phpinfo();?></body></html>

    ```


    上面的代码将给出客户端 PHP 服务器上 php 安装的 PHP 配置信息。


    所有设置都将显示，从版本号开始。 在撰写本文时，大多数免费或廉价的托管站点在其服务器上对 PHP 的版本为 5.4 或更高。向后兼容性是编程的重要组成部分，即使
    PHP 的当前版本更高，了解旧版和新版的功能也很重要。


    ![](img/00001.jpeg)


    如果使用当前版本为七（7）的 PHP，`phpinfo()` 的示例输出将如下所示：


    ![](img/00002.jpeg)


    建议以小写字母编写代码，除非函数对字母大小写有特定要求。请记住，键盘的默认设置是小写字母。`hello.php` 文件可以修改为以红色、粗体、斜体和下划线打印相同的单词“Hello
    World”。请注意，所有 HTML 代码都可以通过 PHP 文件传递。


    ```

    <html><body><?php  print"<font color= red> <b><i><u>Hello World!!</u></i></b></font>?></body></html>

    ```


    通过在代码行之间或相似代码的模块之间添加空格，可以增强代码的清晰度。


    可以向脚本添加注释。有两种类型的注释。一种用于单行，另一种用于多行。


    单行注释为：`//`


    多行注释为：`/* ...... */`


    始终用程序编写的任何语言注释代码。


    ## 变量


    像任何编程语言一样，PHP 也离不开变量，就像其他语言一样，变量是数据的容器。流行的 x、y 和 z 采用不同值的情况在 PHP 中也可用。


    变量应赋予合理的名称，以标识其代表的内容或预期内容。PHP 的保留字不能用作变量。


    变量名区分大小写。 在 PHP 中变量名所需的 `$` 符号之后，名称必须以字母（A-Z 或 a-z）或下划线（`_`）开头。名称不能以数字开头。 这条规则并不新鲜，许多语言都有，但
    `$` 符号要求是 PHP 中必须的。名称中不允许有空格，只能使用下划线。


    PHP 中变量主要有四类 - 数字、字符串、数组和对象。


    数字变量包括以下内容：


    整数 - 1,2,3, -1, -2 等


    浮点数 - 1.0, -19.2 等


    PHP 中的日期类型由数字和字符串组成，并未明确定义为变量类型。


    ### 字符串


    如果变量由一对单引号或双引号括起来的字符组成，则该变量为字符串。


    示例："Hello World"


    "Hello, `$name`"


    " 1"


    "21.07.17"


    "2017"


    ### 数组


    数组按定义以索引格式存储数据。数据使用键输入并使用这些键检索。数组可以是单维或多维的。


    示例：


    | John || Adam || Smith || Mary || Sally |

    | --- | --- | --- | --- | --- |


    其中 John 的索引或键为 0，Adam 的键为 1，以此类推，直到 Sally，她的索引为 4。 这个单维数组的大小为 5（0-4）。


    使用数字作为键的数组称为索引数组。使用字符串作为键的数组称为关联数组。


    数组是任何编程语言的重要组成部分。


    ### 对象


    对象被视为高级功能。要定义对象，必须先定义其结构，即类。然后创建该结构的实例。


    在 C++ 或 Java 等中看到的面向对象编程的概念就是这种类型变量的示例。


    例如：如果有一个名为 car 的变量，则 `car.length` 就是 car 对象的特征示例。


    在 PHP 中使用 "=" 赋值运算符为变量赋值。


    示例：


    ```

    $x = 1.5;

    $y ="John ";

    ```


    要打印结果，我们使用 `print` 函数。


    示例：


    ```

    print "The number is $x";

    ```


