    然而，截断和删除都是数据库管理员保留的功能，因此在实际情况下，除非授予了特定权限，否则程序员可能无法执行代码来执行这些功能。


    ## Version 7 PHP


    PHP 的第 7 版是一个主要版本，并且受新功能影响的领域之一是处理 MySQL 的方式。新的功能被称为 `mysqli`，其中 `i` 代表改进。好消息是，对于熟悉以前连接
    MySQL 方式的人来说，可以轻松迁移到新功能，因为连接方式的相似性。


    `mysqli_connect()` 替换 `mysql_connect()`


    `mysqli_query()` 替换 `mysql_query()`


    `mysqli_fetch_array()` 替换 `mysql_fetch_array()`


    简而言之，除了 `mysql_` 之外，新函数以 `mysqli_` 开头。让我们看一个使用 PHP 7 中的新 mysqli 函数从 staff 数据中选择数据的示例。


    ```

    <html><body><?php$link_id = mysqli_connect( ''localhost'',''root'','''',''thottungal'')
    or die ("Could not connect: " . mysqli_connect_error());$sql = "SELECT * FROM
    staff";$result_id = mysqli_query( $link_id, $sql ) or die ( "Statement failed:
    " . mysqli_error($sql) );$x=mysqli_num_rows($result_id);print "<b>Total number
    of entries retrieved: </b>$x";print "<table border=1 width=800>";while ( $row
    = mysqli_fetch_array( $result_id ) ) {print "<tr><td>".$row[''sid'']."</td>"."<td>".$row[''name'']."</td>"."<td>".$row[''job'']."</td>"."<td>".$row[''salary'']."</td>"."<td>".$row[''location'']."</td></tr>";}mysqli_free_result($result_id);mysqli_close(
    $link_id );print "</table>";?></body></html>

    ```


    逻辑流程与之前的版本 5 相同。`$link_id` 连接到数据库。这里的区别是 `mysqli_connect` 括号内需要输入四个元素。最后一个是数据库名称。其余条目对于开发目的的本地安装是正确的，并且在托管站点上会略有不同。如果网站位于共享托管站点，则需要从共享托管站点的技术支持处获取这些值。


    在将查询赋给 `$sql` 之后，`mysqli_fetch_array` 创建的数组中获得的行数将被打印。然后如代码所示打印出数组。程序通过释放查询的内存然后关闭连接来结束。`mysqli_fetch_array`
    函数可以处理带有字符串或数字关键字的数组。


    因此，除了上面提到的两个段落中的区域外，PHP 5 和 7 的版本非常相似。现在让我们尝试将一行插入到数据库中。版本 5 的相同代码将在下面修改以适应版本
    7。


