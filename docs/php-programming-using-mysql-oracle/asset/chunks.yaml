    The `oci_free_statement()` function is used mainly with the select query as a
    large amount of data will be involved and it is best to clear the memory after
    the execution of such a query.


    In the above code, the `oci_fetch_array` has two parameters- the statement being
    parsed and the type of array keys. `OCI_BOTH` stands for both string and numerical
    keys for an array. If the key is a string, then `OCI_ASSOC` can be used instead.
    The `row[0]` indicates the first column of the oracle table in the array.

