    The scope is based on the location of the variables in the code.


    Scope of a variable is defined as the realm in which it exists.


    Variables defined in a function exist only within that function. In the same manner
    a variable outside a function can only be referenced by the function by passing
    it as an argument as was seen in the last two examples or by using the `global`
    statement.


    Let us modify the example of adding two numbers to calculate the price of two
    items and find the final price after a tax rate of 5%.


    ```

    <?php$tax =5;function sum ($price1, $price2) {global $tax;$sum =$price1 + $price2;$taxrate
    =($tax/100) +1;$sum = $sum * $taxrate;return $sum;}if (isset($_POST[''submit''])){$sum=sum($_POST[''price1''],$_POST[''price2'']);print"<p>The
    total price of these two items is <b>$sum</b><p>";}print"<form action=''function.php''
    method=''post''><p>";print"First Item price:<input type=''text'' name=''price1''
    size=''5''><p>";print"Second Item price:<input type=''text'' name=''price2'' size=''5''><p>";print"<input
    type=''submit'' name=''submit'' value=''Calculate''>";print"</form>";?>

    ```


    The code here takes from the user the price of two items and add them. After adding
    the prices, it then calculates the `taxrate` based on the global variable `tax`.


    `Taxrate` is multiplied with `sum` to display the final price. An important part
    of defining variables is its location and hence its scope.


    # Chapter 6. Files and Directories


    The first step to understanding the importance of a database is files and directories.
    There are two ways to store data with PHP and with most programming languages.
    They are files & directories or a database.


    In a web hosting environment especially one that is shared the settings by the
    host provider might be a little strict when it comes to files.


    A file such as a text file (`.csv`, `.dat`, `.txt`) have certain permission settings
    on the web host. The directory also will have these permissions.


    The permission options are read, write and executable. In addition to these options
    can be set in three different ways based on the user. The owner gets automatic
    write and read rights whereas others and groups are given only read permission.


    Irrespective of the type of hosting (Unix or Windows) the hosting service might
    limitations for security reasons on allowing access to write on files and directories
    in the case of shared hosting. This needs to be studied upfront before spending
    time creating a PHP program based on files and directories for storage and retrieval.


    As mentioned in the previous line files, directories and a database basically
    store data and allow them to be retrieved.


    To write to a file using PHP the following functions can be used:


    `fopen()` to open a file for writing in a particular mode.


    `fwrite()` to actually write the data to the file.


    `fclose()` to close the connection to the file.


    `fopen()` function has several modes of opening a file to write. They are:


    `r` - for reading only. The reading will start at the beginning of the file.


    `r+` - for reading or writing. Either will start at the beginning of the file.


    `w` - for writing only. If the file does not exist, then it will be created and
    overwrite any existing content.


    `w+` - for reading or writing. If the file does not exist, then it will be created
    and overwrite any existing contents when writing.


    `a` - for writing only. The file will be created if it does not exist and new
    data will be appended to the end of the file.


    `a+` - for reading or writing. The file will be created if it does not exist and
    new data will be appended to the end of the file.


    `x` - for writing only. The file will be created if it does not exist but if the
    file exists then nothing will be done.


    `x+` - for reading or writing. The file will be created if it does not exist but
    nothing will be done if the file already exists.


    If the file is not in the same location as the PHP file, the path to the file
    should be included in the code. Let us look at the following code where some data
    will be written to a text file called `data.txt`.


    ```

    <html><body><?phpif (isset($_POST[''submit''])) {if($fx = fopen(''data.txt'',''ab''))
    {$data=$_POST[''data''];fwrite($fx,"$data\n");fclose($fx);}}?><form action="file.php"
    method="post"><p><textarea name="data" rows="5" columns="30"> Enter your data
    here. </textarea><p><input type="submit" name="submit" value="Write the data"></form></body></html>

    ```


    In the code above the text area box allows for data to be entered. The data entered
    as an example is - This is a statement.


    The `data.txt` file is created since it did not exist and writing was in the form
    of an append. The `''ab''` means append using binary mode. The `''b''` is optional.


    The result is as follows:


    ![](images/00045.jpeg)


    ![](images/00046.jpeg)


    The code can be made more accurate by using `$data=trim($_POST[''data'']);`


    and using the `empty` function in the following manner.


    ```

    if(!empty($_POST[''data'']).

