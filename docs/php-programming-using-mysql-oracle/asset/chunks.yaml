- raw: "The examples in this book were developed using the EasyPHP editor which is\
    \ available at the following website- [http://www.easyphp.org](http://www.easyphp.org).\
    \ The current version of PHP at the time of writing this book version 7 and its\
    \ interface was shown in chapter 1. The interface below is for PHP version 5 series.\n\
    \n![](images/00049.jpeg)\n\nClick on the MySQL Administration-PHPMyAdmin module\
    \ or in version 7 start database first before clicking on PHPMyAdmin in the middle\
    \ of the interface page.\n\nA page that looks like this will appear.\n\n![](images/00050.jpeg)\n\
    \nAs can be seen the databases can be created using the new link on the left hand\
    \ side above. C-Panel on all Unix/Linux based web hosting will give a similar\
    \ screen also.\n\nThe menu on top of the above picture lets one list databases\
    \ associated with their account or installation in addition to running SQL commands.\
    \ Export and import allows for back up databases and input of bulk data.\n\nThus\
    \ using a developer software such as EasyPHP one can mimic a real hosting environment.\
    \ The most important part of this is to find the path of the database. This will\
    \ be different slightly on the host and in the developer software. The database\
    \ path method will be given in the host's technical faqs sheet. To create a table\
    \ such as staff click on the structure tab and put in the name and number of columns\
    \ as shown below.\n\n![](images/00051.jpeg)\n\nTo complete the table creation,\
    \ enter the data types and field lengths of each field of the staff table and\
    \ select sid as the primary key. Primary key is a field whose value does not repeat\
    \ and is required. The fields of the staff table introduced earlier are sid ,\
    \ name, job, salary and location. Out of these all are text except for salary\
    \ which is a number.\n\nThe following shows the table field details.\n\n![](images/00052.jpeg)\n\
    \nThe table will be created after the save/go button is clicked. The result on\
    \ the left hand side of the PHPMyAdmin screen will be similar to the one below.\n\
    \n![](images/00053.jpeg)\n\nThese steps are very similar to those done on actual\
    \ web hosting but expect some minor differences in the way or look of the interfaces.\n\
    \n# Chapter 8. PHP for MySQL Database\n\nIn this chapter, the emphasis is to write\
    \ a PHP code targeting a MySQL database and table. If this script is being run\
    \ on an editor on a standalone computer or notebook, then the path to the database\
    \ is the first thing to be found out. \n\nThis information will be available in\
    \ the FAQ’s part of the hosting service in case code is being written directly\
    \ on the shared hosting location.\n\nIn the previous chapter, a staff table was\
    \ shown. This table will be used in this chapter to demonstrate the select, insert,\
    \ update and delete queries.\n\nThe first step in getting data from a table in\
    \ the database or adding data to it is to connect to MySQL in the first place.\
    \ Note: The examples that follow are for PHP version 5 series. For version 7 check\
    \ end of chapter.\n\nTo this end the function mysql\\_connect is used to connect\
    \ to MySQL in PHP when the target database is MySQL. Anything that is opened has\
    \ to be closed in programming so the mysql\\_close() function plays this role.\n\
    \n| <html><body><?phpif($dx =mysql\\_connect('localhost','root ',' ')){print\"\
    Connected to MySQL.\";mysql\\_close();} else {print\"Could not connect to MySQL.\"\
    ;}?></body></html> |\n\n| --- |\n\nThe connection mechanism is shown above in\
    \ the PHP script. The line mysql\\_connect('localhost',' root',' ')) will be slightly\
    \ different on the webhost being used. The localhost is followed by a username\
    \ and password. \n\nIn the case of a developer software on a standalone machine\
    \ the username is usually root but this needs to be verified in the help manual\
    \ of PHP editor being used.\n\nNow the second step after connecting to MySQL,\
    \ is to connect to the selected database followed by the table to do some action.\
    \ Let us start our example of the action by selecting the select or retrieval\
    \ option.\n\n| <html><body><?php$link\\_id = mysql\\_connect( 'localhost','root','')\
    \ or die (\"Could not connect: \" . mysql\\_error());mysql\\_select\\_db( \"thottungal\"\
    , $link\\_id );$sql = \"SELECT \\* FROM staff\";$result\\_id = mysql\\_query(\
    \ $sql, $link\\_id ) or die ( \"Statement failed: \" . mysql\\_error() );$x=mysql\\\
    _num\\_rows($result\\_id);print \"<b>Total number of entries retrieved: </b>$x\"\
    ;print \"<table border=1 width=800>\";while ( $row = mysql\\_fetch\\_array( $result\\\
    _id ) ) {print \"<tr><td>\".$row\\['sid'\\].\"</td>\".\"<td>\".$row\\['name'\\\
    ].\"</td>\".\"<td>\".$row\\['job'\\].\"</td>\".\"<td>\".$row\\['salary'\\].\"\
    </td>\".\"<td>\".$row\\['location'\\].\"</td></tr>\";}mysql\\_close( $link\\_id\
    \ );print \"</table>\";?></body></html> |\n\n| --- |\n\nWe are using the staff\
    \ table used in the previous chapter to retrieve all the rows in it. There are\
    \ seven (7) rows in that table. The meaning of the lines of code above are as\
    \ follows:\n\n$link\\_id = mysql\\_connect( 'localhost','root','') or die (\"\
    Could not connect: \" . mysql\\_error());\n\nConnect to My SQL. If not give an\
    \ error and the program stops there.\n\nmysql\\_select\\_db( \"thottungal\", $link\\\
    _id );\n\nHaving connected to MySQL look for the database.\n\n$sql = \"SELECT\
    \ \\* FROM staff\";\n\nWrite the query that needs to be run in the database.\n\
    \n$result\\_id = mysql\\_query( $sql, $link\\_id ) or die ( \"Statement failed:\
    \ \" . mysql\\_error() );\n\nRun the query and save the result in a variable or\
    \ give an error.\n\n$x=mysql\\_num\\_rows($result\\_id);\n\nThis line will give\
    \ the number of rows of available for this query.\n\nwhile ( $row = mysql\\_fetch\\\
    _array( $result\\_id ) ) {\n\nprint \"<tr><td>\".$row\\['sid'\\].\"</td>\".\"\
    <td>\".$row\\['name'\\].\"</td>\".\"<td>\".$row\\['job'\\].\"</td>\".\"<td>\"\
    .$row\\['salary'\\].\"</td>\".\"<td>\".$row\\['location'\\].\"</td></tr>\";\n\n\
    }\n\nThe rows of the query will be printed through a loop. Here the while loop\
    \ is used. Each column or field expected in the query is put within rows of a\
    \ table. Here the quotations are very important. Usual errors are not enclosing\
    \ the elements in the correct quotations.\n\nmysql\\_close( $link\\_id );\n\n\
    # The database has to be closed and so is the table. The result of running this\
    \ code is as follows:\n\n![](images/00054.jpeg)\n\nIf all the fields are not needed,\
    \ then just write the one that are to displayed and leave the rest alone.\n\n\
    If the query has a where condition - say for example to find all the employees\
    \ and their information if their salary is greater than 3000 the code can be written\
    \ as follows:\n\n| <html><body><?php$link\\_id = mysql\\_connect( 'localhost','root','')\
    \ or die (\"Could not connect: \" . mysql\\_error());mysql\\_select\\_db( \"thottungal\"\
    , $link\\_id );$sql = \"SELECT \\* FROM staff where salary >3000\";$result\\_id\
    \ = mysql\\_query( $sql, $link\\_id ) or die ( \"Statement failed: \" . mysql\\\
    _error() );$x=mysql\\_num\\_rows($result\\_id);print \"<b>Total number of entries\
    \ retrieved: </b>$x\";print \"<table border=1 width=800>\";while ( $row = mysql\\\
    _fetch\\_array( $result\\_id ) ) {print \"<tr><td>\".$row\\['sid'\\].\"</td>\"\
    .\"<td>\".$row\\['name'\\].\"</td>\".\"<td>\".$row\\['job'\\].\"</td>\".\"<td>\"\
    .$row\\['salary'\\].\"</td>\".\"<td>\".$row\\['location'\\].\"</td></tr>\";}mysql\\\
    _close( $link\\_id );print \"</table>\";?></body></html> |\n\n| --- |\n\nThe result\
    \ will be as follows:\n\n![](images/00055.jpeg)\n\nThere is no change except in\
    \ the $sql line.\n\nInserting data is an important part of a database table. If\
    \ there is no data, then there is nothing to retrieve and the database will be\
    \ practically useless.\n\nTo demonstrate the method to insert data into a table\
    \ in MySQL using PHP let us create a PHP file as follows:"
