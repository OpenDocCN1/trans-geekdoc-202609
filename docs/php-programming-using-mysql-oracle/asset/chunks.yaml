    The execute statement is followed by a commit to confirm the insertion into the
    database table.


    The oci\_execute() function takes two parameters. The first is the parse statement
    as seen above and the second one is a method. The following are the methods available
    in oci\_execute():


    OCI\_COMMIT\_ON\_SUCCESS - this will automatically commit all outstanding changes
    for this connection when the statement has succeeded. This is the default.


    OCI\_DEFAULT - this is an old method which might be available in the version of
    OCI8 being used but usage of this is not advised since version 5.3.2 of PHP.


    OCI\_NO\_AUTO\_COMMIT - like the one used in the example above does not commit
    changes. Thus if commit is needed then oci\_commit() has to be used similar to
    the example above. If this is not used any changes requested by the execute statement
    will be roll backed after the program is exited.


    The insert done in the above example could be done by another method. This method
    involves using the OCI8 function called oci\_bind\_by\_name().


    The oci\_bind\_by\_name() binds a PHP variable to an Oracle place holder. This
    binding improves database performance and is also a way to avoid SQL injection
    security issues. SQL injection is a type of computer attack in which malicious
    code is embedded in a poorly-designed application and then passed to the backend
    database. Bind variables are not treated as part of the SQL statement and hence
    it decreases the SQL injection issues. The code is as follows:


    | ?php$db = oci\_connect(''hr'', ''hr'', ''orcl'');if (!$db) {trigger\_error(''Unable
    to connect to database'', e\_user\_error);}$sql = "insert into employee (sid,name,manager)
    values (:sid\_bv,:name\_bv,:manager\_bv)";$stmt = oci\_parse($db, $sql);$sid=''104'';$name
    =''Adam'';$manager =''102'';oci\_bind\_by\_name($stmt, ":sid\_bv", $sid);oci\_bind\_by\_name($stmt,
    ":name\_bv", $name);oci\_bind\_by\_name($stmt, ":manager\_bv",$manager);oci\_execute($stmt,OCI\_NO\_AUTO\_COMMIT);
    |


