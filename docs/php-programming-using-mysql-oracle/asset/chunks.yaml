    \n# Chapter 5.  Web Application Components\n\nThe subject of PHP needs knowledge\
    \ of HTML in the minimum. In addition to this knowledge of Cascading Style Sheets\
    \ (CSS), Java script and Structured Query Language can greatly enhance the ability\
    \ to create dynamic, rich looking web pages.\n\nThis book does not go into development\
    \ of CSS or Java Script in detail. However, an essential background will be given\
    \ in SQL in the database part of this book. \n\nIn this chapter some important\
    \ components of making a web application will be looked at. \n\nExternal files\
    \ may be used in a PHP program. For example, to create a header or footer for\
    \ a page. To do this first create a header.html and footer.html file or the files\
    \ can be PHP files too.\n\nThese external files can be included in a PHP program\
    \ by using one of two functions- include() and require().\n\nThey are used in\
    \ the following manner.\n\ninclude('footer.html')\n\nor \n\ninclude('footer.php')\n\
    \nor \n\nrequire('header.html')\n\nor \n\nrequire('header.php')\n\nThe code will\
    \ be executed at the point where these functions are called. After execution the\
    \ code will continue from the line below the include or require function.\n\n\
    The difference between the two functions is that when using include() if there\
    \ is an error the PHP server will generate a warning but will continue to run\
    \ other code lines. \n\nIn the case of require() if the execution of the included\
    \ file fails the program terminates.\n\nNote the example above assumes that the\
    \ PHP program using include () or require() is in the same folder as the file\
    \ being called. If not the absolute or relative paths to the file must be provided\
    \ within the brackets of the function.\n\nAn example of a relative path is - require('./footer.html');\n\
    \nAn example of an absolute path is - require('c:\\\\users\\\\desktop\\\\header.php');\n\
    \n| <html><body><center><b>Welcome to my page</b></center></body></html> |\n\n\
    | --- |\n\nAssume a header.html file as shown above. The associated PHP program\
    \ calling this header is as follows.\n\n| <?phpinclude('header.html');print\"\
    This is my homepage.\";?> |\n\n| --- |\n\nThe output is as follows.\n\n![](images/00033.jpeg)\n\
    \nThese two functions can come in handy to reduce duplication of work.  \n\nDate\
    \ and time can be displayed in PHP by using the date() function. This function\
    \ returns date and time information in a format based on the arguments given to\
    \ it.\n\nThe options available are as follows.\n\nY - means year in 4-digit format.\n\
    \ny - means year in 2-digit format.\n\nn - means month as one or two digits such\
    \ as 4.\n\nm - means month as two digits such as 05.\n\nF - means month in full\
    \ form of the name of the month such as August.\n\nM - mean month in three letter\
    \ format such as Aug.\n\nj - means day of the month in 1 or 2 digits such as 8.\n\
    \nd - means the day of the month in 2-digit format such as 08.\n\nl - means the\
    \ day of the week such as Sunday.\n\nD - means the day of the week in three letter\
    \ format such as - Sun.\n\nw - means the day of the week as a single digit - such\
    \ as 0 for Sunday.\n\nz - means day of the year from 0 to 365.\n\nt - means the\
    \ number of days in the month - 31 (for August).\n\nS - means the English ordinal\
    \ suffix for a day as 2 characters - rd.\n\ng - means the hour in 12-hour format\
    \ as 1 or 2 digits such as - 6.\n\nG - means the hour in 24-hour format as 1 or\
    \ 2 digits such as 14.\n\nh - means the hour in 12-hour format as 2 digits such\
    \ as 08.\n\nH - means hour in 24-hour format as 2 digits such as 14.\n\ni - means\
    \ minutes such as 35.\n\ns - means seconds such as 15.\n\na - means am or pm.\n\
    \nA - means AM or PM.\n\nU - means seconds since epoch such as 1048623008.\n\n\
    Let us look at this PHP code.\n\n| <?php$x =date('l,F,Y');$y = date('h:i:s');print\
    \ \"$x<p>$y\";?> |\n\n| --- |\n\nThe output will be as follows.\n\n![](images/00034.jpeg)\n\
    \nIt is also possible to write print date('l,F,Y'); to get a result.\n\nA timestamp\
    \ in PHP is a number representing how many seconds have elapsed since midnight\
    \ of January 1 1970. The time() function returns a timestamp for the current moment.\
    \ The mktime() function can return a timestamp for a particular date and time.\n\
    \nFor example:\n\n$x =mktime(06,12,30); where 6 is the hour, 12 the minutes and\
    \ 30 is the seconds. \n\nAn important function in PHP programs for the web is\
    \ the ability to send email. Sending mail in PHP is done by the mail() function.\
    \ The PHP function works in tandem with the servers email application such as\
    \ the sendmail on Unix or a SMTP(Simple Mail Transfer Protocol) server to send\
    \ out emails.\n\nmail('mailto','subject','body of message', 'From: email address\
    \ of Sender');\n\nIt is important to check with the host service before using\
    \ a send mail service. There may be additional requirements from the host service\
    \ especially if the service package is a shared one.\n\n| <?php$x = $\\_POST\\\
    ['email'\\];$y = $\\_POST\\['password'\\]$body=\"Thank you for registering at\
    \ my webpage. Your email address is $x and the password you entered is $y\".mail(\
    \ $x,'Registration complete',$body,'From:admin@yyy.com');?> |\n\n| --- |\n\nThis\
    \ is a sample code of sending mail. It is assumed here that a form or HTML page\
    \ will supply the email and password of the user. The body thanks the user for\
    \ the registration and send the email with the admin's email as sender’s email.\
    \ Use of mail on shared servers for websites should be used with caution. It is\
    \ possible to have a server or domain marked as a source of spam affecting legitimate\
    \ emails.\n\nCookies are way for a server to store information about the user.\
    \ Many websites require cookies to be enabled before the contents are displayed.\
    \ \n\nCookies have to be sent from the server to the client machine before any\
    \ other information.\n\nCookies are sent using the setcookie() function. For example:\n\
    \nsetcookie('Cookiename', 'This is a test cookie');\n\nThere may be a limit of\
    \ the number of cookies that can be sent from a server to a single user. Cookie\
    \ names should follow the naming rules of PHP.\n\n| <?php$cookies=false;setcookie('color',$\\\
    _POST\\['color'\\]);$cookies=true;if($cookies) { print\"Your preference has been\
    \ saved.\"; }?> |\n\n| --- |\n\nThe HTML code for the above PHP file is as follows.\n\
    \n| <html><head><title>Cookie Example</title></head><body><form action=\"cookie.php\"\
    \ method=\"post\"> Yellow<input type=\"radio\" name=\"color\" value=\"Yellow\"\
    />Red<input type=\"radio\" name=\"color\" value=\"Red\"/>Blue<input type=\"radio\"\
    \ name=\"color\" value=\"Blue\"/><br>Please complete the feedback form and send\
    \ your preference of color. </p><p><input type =\"submit\" name=\"submit\" value=\"\
    color\"></form></body></html> |\n\n| --- |\n\nThe HTML page will call the cookie.php\
    \ file and pass on to it the preference of the user.\n\nThe resulting output is\
    \ as follows.\n\n![](images/00035.jpeg)\n\nTo retrieve a value from a cookie,\
    \ use the $\\_COOKIE\\['cookiename'\\] method.\n\n| <?phpprint $\\_COOKIE\\['color'\\\
    ];?> |\n\n| --- |\n\nThe output will be red since I had chosen red.\n\nNext we\
    \ look into adding some parameters to the cookie. The parameters to be added are\
    \ expiration, path, domain and term secure. \n\nsetcookie('color',$\\_POST\\['color'\\\
    ], time()+60,' ',' ',1);\n\nThis follows the format: setcookie('name','value',expiration,'path','domain',secure);\n\
    \nThe path and domain are used to limit a cookie to a specific folder in a website\
    \ or to a specific domain such as www.xyz.com. The path could be something like\
    \ this '/userpages/’.\n\nIn the example above both path and domain has been disregarded.\
    \ Look at the code below.\n\n| <?php$cookies=false;setcookie('color',$\\_POST\\\
    ['color'\\], time()+60,' ',' ',0);$cookies=true;if($cookies) {print\"Your preference\
    \ has been saved.\";}?> |\n\n| --- |\n\nand using the same html file as before\
    \ (reproduced here for convenience)."
