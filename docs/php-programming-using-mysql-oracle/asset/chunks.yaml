    \ is null. |\n| UNIQUE || searches each row of table foruniqueness. |\n\nLet us\
    \ look at some examples using the following table: The name of the table is `staff`.\n\
    \n| sid || name || job || salary || location |\n| --- | --- | --- | --- | ---\
    \ |\n| 100 || Robert || Manager || 8000 || Atlanta |\n| 101 || Albert || Administrator\
    \ || 3000 || Atlanta |\n| 102 || Sally || Secretary || 2000 || Atlanta |\n| 103\
    \ || Martha || Receptionist || 1500 || Chicago |\n| 104 || John || Accountant\
    \ || 5000 || Chicago |\n| 105 || Sandy || Trainee || 1000 || Miami |\n| 106 ||\
    \ James || Lawyer || 7000 || Miami |\n\n```\nselect name from staff \nwhere\n\
    salary > 7000\nand location = 'Atlanta';\n```\n\nThe only person would be: Robert\n\
    \n|  name |\n| --- |\n| Robert |\n\nIf the “and” was replaced by “or” the result\
    \ would be different.\n\n| name |\n| --- |\n| Robert |\n| Albert |\n| Sally |\n\
    \nThe reason is that only one condition has to be satisfied. Robert does make\
    \ more than 7000 and is located in Atlanta but both Albert and Sally are also\
    \ located in the same place but they do not make a monthly salary greater than\
    \ 7000.\n\n```\nselect name from staff\nwhere\nsalary is null;\n```\n\nIn the\
    \ example above the query is searching for a null value in `salary` column. Null\
    \ means nothing. In a database nothing is something and that something is called\
    \ Null. The query will not find any names as there is no name with null salary\
    \ values.\n\nLet us repeat the staff table here for convenience:\n\n| sid || name\
    \ || job || salary || location |\n| --- | --- | --- | --- | --- |\n| 100 || Robert\
    \ || Manager || 8000 || Atlanta |\n| 101 || Albert || Administrator || 3000 ||\
    \ Atlanta |\n| 102 || Sally || Secretary || 2000 || Atlanta |\n| 103 || Martha\
    \ || Receptionist || 1500 || Chicago |\n| 104 || John || Accountant || 5000 ||\
    \ Chicago |\n| 105 || Sandy || Trainee || 1000 || Miami |\n| 106 || James || Lawyer\
    \ || 7000 || Miami |\n\n```\nselect * from staff \nwhere \nlocation in ('Miami',\
    \ 'Chicago');\n```\n\nNotice that when values are text –they have to be enclosed\
    \ within single quotes. Numbers do not have to. If we change the last line of\
    \ this query to `location not in ('Miami', 'Chicago')` then only names of those\
    \ located in cities other than Miami or Chicago will be shown. The result of this\
    \ query will be info on those located in two cities.\n\n| sid || name || job ||\
    \ salary || location |\n| --- | --- | --- | --- | --- |\n| 103 || Martha || Receptionist\
    \ || 1500 || Chicago |\n| 104 || John || Accountant || 5000 || Chicago |\n| 105\
    \ || Sandy || Trainee || 1000 || Miami |\n| 106 || James || Lawyer || 7000 ||\
    \ Miami |\n\nLet us look at this query:\n\n```\nselect * from staff\nwhere\nsalary\
    \ > 3000\nand salary < 6000;\n```\n\nThe query is requesting those who have a\
    \ salary between 3000 and less than 6000. The query will produce the following\
    \ result:\n\n| sid || name || job || salary || location |\n| --- | --- | --- |\
    \ --- | --- |\n| 101 || Albert || Administrator || 3000 || Atlanta |\n| 104 ||\
    \ John || Accountant || 5000 || Chicago |\n\nThe same query could be written as\
    \ follows:\n\n```\nselect * from staff\nwhere\nsalary between 3000 and 6000;\n\
    ```\n\nThe following query takes a look at the “like” operator:\n\n```\nSelect\
    \ * from staff\nWhere\nName like 'R%';\n```\n\nThis will give the following result:\n\
    \n| sid || name || job || salary || location |\n| --- | --- | --- | --- | ---\
    \ |\n| 100 || Robert || Manager || 8000 || Atlanta |\n\nIt is the only name that\
    \ starts with an R. Martha too has the alphabet “r” but it is not at the starting\
    \ position.\n\nIt is possible to call a select query from another query. The following\
    \ is an example that shows this along with the use of the “Exists” operator.\n\
    \n```\nselect name from staff \nwhere exists\n(select name from staff where salary\
    \ > 5000);\n```\nThe result will be:\n\n| name |\n| --- |\n| Robert |\n| Albert\
    \ |\n| Sally |\n| Martha |\n| John |\n| Sandy |\n| James |\n\nIf we change the\
    \ query slightly and try the query below, we will get no responses.\n\n```\nselect\
    \ name from staff \nwhere exists\n(select name from staff where salary > 8000);\n\
    ```\n\nAn example of the use of the “ALL” operator:\n\n```\nselect * from staff\n\
    where \nlocation = all (select location from staff where salary = 3000);\n```\n\
    \n| sid || name || job || salary || location |\n| --- | --- | --- | --- | ---\
    \ |\n| 100 || Robert || Manager || 8000 || Atlanta |\n| 101 || Albert || Administrator\
    \ || 3000 || Atlanta |\n| 102 || Sally || Secretary || 2000 || Atlanta |\n\nThe\
    \ result will be the info for all the staff in the location of Atlanta.\n\nAn\
    \ example of the use of the “ANY” operator:\n\n```\nselect * from staff\nwhere\
    \ \nlocation = any (select location from staff where salary = 3000);\n```\n\n\
    | sid || name || job || salary || location |\n| --- | --- | --- | --- | --- |\n\
    | 100 || Robert || Manager || 8000 || Atlanta |\n| 101 || Albert || Administrator\
    \ || 3000 || Atlanta |\n| 102 || Sally || Secretary || 2000 || Atlanta |\n\nWhen\
    \ using any database, it is best to use small letters for field names and queries.\n\
    \nChange the query as follows:\n\n```\nselect * from staff\nwhere \nlocation =\
    \ any (select location from staff where salary > 3000);\n```\n\nEach location\
    \ with a salary greater than 3000 will be found. In this case all three cities\
    \ have at least one person having a salary greater than 3000. Thus the first part\
    \ of the query will print all the rows in the table. There will be seven rows.\n\
    \nThe commands given thus far can work in the databases such as MySQL, Oracle\
    \ and Microsoft’s Access.\n\nIf an editor is being used to develop PHP scripts\
    \ on your computer before uploading to the website, then the first thing to do\
    \ is to find if it comes with PHPMyadmin module or not.\n"
