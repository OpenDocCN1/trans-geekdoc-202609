    \ {trigger_error('Unable to connect to database', e_user_error);}\n$sql = \"insert\
    \ into employee (sid,name,manager) values ('104','Adam','102')\";\n$stmt = oci_parse($db,\
    \ $sql);\noci_execute($stmt, OCI_NO_AUTO_COMMIT);\noci_commit($db);\noci_close($db);\n\
    ?></body></html>\n```\n\nThe execute statement is followed by a commit to confirm\
    \ the insertion into the database table.\n\nThe `oci_execute()` function takes\
    \ two parameters. The first is the parse statement as seen above and the second\
    \ one is a method. The following are the methods available in `oci_execute()`:\n\
    \n`OCI_COMMIT_ON_SUCCESS` - this will automatically commit all outstanding changes\
    \ for this connection when the statement has succeeded. This is the default.\n\
    \n`OCI_DEFAULT` - this is an old method which might be available in the version\
    \ of OCI8 being used but usage of this is not advised since version 5.3.2 of PHP.\n\
    \n`OCI_NO_AUTO_COMMIT` - like the one used in the example above does not commit\
    \ changes. Thus if commit is needed then `oci_commit()` has to be used similar\
    \ to the example above. If this is not used any changes requested by the execute\
    \ statement will be roll backed after the program is exited.\n\nThe insert done\
    \ in the above example could be done by another method. This method involves using\
    \ the OCI8 function called `oci_bind_by_name()`.\n\nThe `oci_bind_by_name()` binds\
    \ a PHP variable to an Oracle place holder. This binding improves database performance\
    \ and is also a way to avoid SQL injection security issues. SQL injection is a\
    \ type of computer attack in which malicious code is embedded in a poorly-designed\
    \ application and then passed to the backend database. Bind variables are not\
    \ treated as part of the SQL statement and hence it decreases the SQL injection\
    \ issues. The code is as follows:\n\n```\n?php\n$db = oci_connect('hr', 'hr',\
    \ 'orcl');\nif (!$db) {trigger_error('Unable to connect to database', e_user_error);}\n\
    $sql = \"insert into employee (sid,name,manager) values (:sid_bv,:name_bv,:manager_bv)\"\
    ;\n$stmt = oci_parse($db, $sql);\n$sid='104';\n$name ='Adam';\n$manager ='102';\n\
    oci_bind_by_name($stmt, \":sid_bv\", $sid);\noci_bind_by_name($stmt, \":name_bv\"\
    , $name);\noci_bind_by_name($stmt, \":manager_bv\",$manager);\noci_execute($stmt,OCI_NO_AUTO_COMMIT);\n\
    ```\n\n```\noci_commit($db);\noci_close($db);\n?></body></html>\n```\n\nThe code\
    \ above creates three bind variables denoted by the `_bv` ending and values to\
    \ the insert statement is send via reference in the bind statement associated\
    \ with `$sql`.\n\nThe code for updating a row in an oracle database table is as\
    \ follows:\n\n```\n<?php\n$db = oci_connect('hr', 'hr', 'orcl');\nif (!$db) {trigger_error('Unable\
    \ to connect to database', e_user_error);}\n$sql = \"update employee set manager='102'\
    \ where sid='103'\";\n$stmt = oci_parse($db, $sql);\noci_execute($stmt, OCI_NO_AUTO_COMMIT);\n\
    oci_commit($db);\noci_close($db);\n?>\n```\n\nThe code for deleting rows or dropping\
    \ a table can be obtained from the above provided permission to do these are given\
    \ by the administrator.\n\n```\n<?php\n$db = oci_connect('hr', 'hr', 'orcl');\n\
    if (!$db) {trigger_error('Unable to connect to database', e_user_error);}\n$sql\
    \ = \"delete employee where sid='103'\";\n$stmt = oci_parse($db, $sql);\noci_execute($stmt,\
    \ OCI_NO_AUTO_COMMIT);\noci_commit($db);\noci_close($db);\n?>\n```\n\n# Chapter\
    \ 10. Regular Expressions\n\nRegular expressions are found in all programming\
    \ languages to take into consideration the format of some inputs. For example,\
    \ the postal code or zip code in many countries are not in the same format as\
    \ in the United States.\n\nPHP supports two types of regular expressions - POSIX\
    \ extended and PCRE which is Pearl compatible. Note: The information below is\
    \ applicable PHP version 5 only. Even in version 5 some versions will not accept\
    \ the functions below. Functions in PHP 7 are shown at the end of this chapter.\n\
    \nPOSIX has six functions in PHP and they are:\n\n`ereg()` - Match a pattern and\
    \ is case sensisitive.\n\n`eregi()` - Match a pattern and is not case sensitive.\n\
    \n`ereg_replace()` - Matches and replaces a pattern and is case sensitive.\n\n\
    `eregi_replace()` - Matches and replaces a pattern and is not case sensitive.\n\
    \n`split()` - Splits a string using a pattern and is case sensitive.\n\n`spliti()`\
    \ - Splits a string using a pattern and is not case sensitive.\n\nMetacharacters\
    \ help to create patterns to test the input string against.\n\n`.` is a period\
    \ meaning any single character?\n\n`^` is a caret which means beginning of a string.\n\
    \n`$` means end of a string.\n\n`|` means alternatives (or).\n\n`() ` means group.\n\
    \nQuantifiers:\n\n`?` - zero or one occurences.\n\n`*` - zero or more occurences.\n\
    \n`+` - One or more occurences.\n\n`{x}` - Exactly x occurences.\n\n`{x , y}`\
    \ - Between x and y occurences (both are inclusive)\n\n`{x, }` - At least x occurences.\n\
    \nCharacter classes:\n\n`[a-z]` - any lowercase letter.\n\n`[a-z A-Z]` - any letter.\n\
    \n`[0-9]` - any number.\n\n`[\\f\\r\\t\\n\\v]` - any white space.\n\n`[aeiou]`\
    \ - any vowel.\n\n`[\\[:alnum:\\]]` - any letter or number.\n\n`[\\[:alpha:\\\
    ]]` - any letter (same as `[a-zA-Z]`)\n\n`[\\[:blank:\\]]` - any tabs or spaces.\n\
    \n`[\\[:digit:\\]]` - any number.\n\n`[\\[:lower:\\]]` - any lowercase letter.\n\
    \n`[\\[:upper:\\]]` - any uppercase letter.\n\n`[\\[:punct:\\]]` - any punctuation\
    \ character.\n\n`[\\[:space:\\]]` - any white space.\n\nA literal is a value that\
    \ is written exactly as it is interpreted. For example, the letter \"b\" matches\
    \ the letter b.\n\nNow let us write a program that will match the input against\
    \ a five-digit postal code. The postal code consists of only numbers.\n"
  trans: "\n\n如果需要使用每个 Oracle 表的列标题，请记住名称可能区分大小写。默认情况下，列标题为大写字母。因此，如果需要将列标题而不是数字用作数组键，上面的代码可以修改如下。\n\
    \n```\nwhile (($row = oci_fetch_array($stmt,OCI_BOTH)) != false) {print '<tr><td>'.$row[\"\
    SID\"].'</td>'.'<td>'.$row[\"NAME\"].'</td>'.'<td>'.$row[\"MANAGER\"].'</td></tr>';}\n\
    ```\n\n其余代码保持不变。PHP 中有一个名为 `htmlentities` 的函数。其目的是将所有适用字符转换为 HTML 实体。它接受两个参数。其中一个是字符串或输入，另一个参数必须从下面选择：\n\
    \n`ENT_COMPAT` - 将双引号转换并保留单引号。\n\n`ENT_QOUTES` - 将双引号和单引号都转换。\n\n`ENT_NOQOUTES`\
    \ - 将双引号和单引号都保持不转换。\n\n`ENT_IGNORE` - 丢弃无效代码单元序列，而不是返回空字符串。由于安全问题，应谨慎使用。\n\n`ENT_SUBSTITUTE`\
    \ - 用 Unicode 替换字符 U + FFFD（UTF-8）或 `&#FFFD` 替换无效代码单元序列，而不是返回空字符串。\n\n`ENT_DISALLOWED`\
    \ - 用替换字符 U + FFFD（UTF-8）或 `&#FFFD` 替换给定文档类型中无效的代码点，而不是保留原样。在包含嵌入外部内容的 XML 文档中有用。\n\
    \n让我们修改上面的代码以使用 html 实体打印员工表的输出结果。\n\n```\n<?php\n$db = oci_connect('hr', 'hr',\
    \ 'orcl');\nif (!$db) {trigger_error('Unable to connect to database', e_user_error);}\n\
    $sql = 'select * from employee';\n$stmt = oci_parse($db, $sql);\noci_execute($stmt);\n\
    $count = 0;\nprint\"<table border=1>\";\nwhile (($row = oci_fetch_array($stmt,OCI_ASSOC+OCI_RETURN_NULLS))\
    \ != false) {\necho \"<tr>\";\nforeach ($row as $item) {\n```\n\n```\necho \"\
    <td>\" . ($item !== null ? htmlentities($item, ENT_QUOTES) : \"&nbsp;\") . \"\
    </td>\\n\";    \n}\nprint \"</tr>\";\n$count++;\n}\nprint\"</table>\";\nprint\
    \ $count . ' record(s) found.';\noci_free_statement($stmt);\noci_close($db);\n\
    ?></body></html>\n```\n\n输出将与之前的代码相同。这里的不同之处在于无需以数字或非数字方式提及键值。\n\n现在让我们看一个向 Oracle\
    \ 数据库插入数据的代码。\n\n```\n<?php\n$db = oci_connect('hr', 'hr', 'orcl');\nif (!$db)\
    \ {trigger_error('Unable to connect to database', e_user_error);}\n$sql = \"insert\
    \ into employee (sid,name,manager) values ('104','Adam','102')\";\n$stmt = oci_parse($db,\
    \ $sql);\noci_execute($stmt, OCI_NO_AUTO_COMMIT);\noci_commit($db);\noci_close($db);\n\
    ?></body></html>\n```\n\n执行语句后跟一个提交以确认向数据库表插入。\n\n`oci_execute()` 函数接受两个参数。第一个是如上所示的解析语句，第二个是一个方法。`oci_execute()`\
    \ 中可用的方法如下：\n\n`OCI_COMMIT_ON_SUCCESS` - 当语句成功时，这将自动提交此连接的所有未决更改。这是默认值。\n\n`OCI_DEFAULT`\
    \ - 这是一种旧方法，可能在使用的 OCI8 版本中可用，但自 PHP 5.3.2 版本以来不建议使用。\n\n`OCI_NO_AUTO_COMMIT`\
    \ - 与上面示例中使用的类似，不提交更改。因此如果需要提交，则必须使用 `oci_commit()`，类似于上面的示例。如果未使用此方法，执行语句请求的任何更改将在程序退出后回滚。\n\
    \n上面示例中完成的插入可以通过另一种方法完成。此方法涉及使用 OCI8 函数 `oci_bind_by_name()`。\n\n`oci_bind_by_name()`\
    \ 将 PHP 变量绑定到 Oracle 占位符。此绑定可提高数据库性能，也是避免 SQL 注入安全问题的一种方法。SQL 注入是一种计算机攻击，其中恶意代码嵌入到设计不佳的应用程序中，然后传递到后端数据库。绑定变量不被视为\
    \ SQL 语句的一部分，因此减少了 SQL 注入问题。代码如下：\n\n```\n?php\n$db = oci_connect('hr', 'hr',\
    \ 'orcl');\nif (!$db) {trigger_error('Unable to connect to database', e_user_error);}\n\
    $sql = \"insert into employee (sid,name,manager) values (:sid_bv,:name_bv,:manager_bv)\"\
    ;\n$stmt = oci_parse($db, $sql);\n$sid='104';\n$name ='Adam';\n$manager ='102';\n\
    oci_bind_by_name($stmt, \":sid_bv\", $sid);\noci_bind_by_name($stmt, \":name_bv\"\
    , $name);\noci_bind_by_name($stmt, \":manager_bv\",$manager);\noci_execute($stmt,OCI_NO_AUTO_COMMIT);\n\
    ```\n\n```\noci_commit($db);\noci_close($db);\n?></body></html>\n```\n\n上面的代码创建了三个以\
    \ `_bv` 结尾的绑定变量，并通过引用在与 `$sql` 关联的绑定语句中将值发送到插入语句。\n\n更新 Oracle 数据库表中一行的代码如下：\n\
    \n```\n<?php\n$db = oci_connect('hr', 'hr', 'orcl');\nif (!$db) {trigger_error('Unable\
    \ to connect to database', e_user_error);}\n$sql = \"update employee set manager='102'\
    \ where sid='103'\";\n$stmt = oci_parse($db, $sql);\noci_execute($stmt, OCI_NO_AUTO_COMMIT);\n\
    oci_commit($db);\noci_close($db);\n?>\n```\n\n可以从上面获得删除行或删除表的代码，只要管理员授予执行这些操作的权限即可。\n\
    \n```\n<?php\n$db = oci_connect('hr', 'hr', 'orcl');\nif (!$db) {trigger_error('Unable\
    \ to connect to database', e_user_error);}\n$sql = \"delete employee where sid='103'\"\
    ;\n$stmt = oci_parse($db, $sql);\noci_execute($stmt, OCI_NO_AUTO_COMMIT);\noci_commit($db);\n\
    oci_close($db);\n?>\n```\n\n# 第 10 章. 正则表达式\n\n正则表达式存在于所有编程语言中，以考虑某些输入的格式。例如，许多国家的邮政编码或邮编格式与美国不同。\n\
    \nPHP 支持两种类型的正则表达式 - POSIX 扩展和 PCRE，即 Pearl 兼容。注意：以下信息适用于 PHP 版本 5 仅。即使在版本 5 中，一些版本也不会接受下面的函数。本章末尾显示了\
    \ PHP 7 中的函数。\n\nPOSIX 在 PHP 中有六个函数，它们是：\n\n`ereg()` - 匹配模式且区分大小写。\n\n`eregi()`\
    \ - 匹配模式且不区分大小写。\n\n`ereg_replace()` - 匹配并替换模式且区分大小写。\n\n`eregi_replace()` - 匹配并替换模式且不区分大小写。\n\
    \n`split()` - 使用模式拆分字符串且区分大小写。\n\n`spliti()` - 使用模式拆分字符串且不区分大小写。\n\n元字符有助于创建模式以测试输入字符串。\n\
    \n`.` 是一个句点，表示任意单个字符？\n\n`^` 是一个插入符号，表示字符串的开头。\n\n`$` 表示字符串的结尾。\n\n`|` 表示替代项（或）。\n\
    \n`() ` 表示分组。\n\n量词：\n\n`?` - 出现零次或一次。\n\n`*` - 出现零次或多次。\n\n`+` - 出现一次或多次。\n\n\
    `{x}` - 恰好出现 x 次。\n\n`{x , y}` - 出现 x 到 y 次（两者都包含）\n\n`{x, }` - 至少出现 x 次。\n\n\
    字符类：\n\n`[a-z]` - 任意小写字母。\n\n`[a-z A-Z]` - 任意字母。\n\n`[0-9]` - 任意数字。\n\n`[\\f\\\
    r\\t\\n\\v]` - 任意空白。\n\n`[aeiou]` - 任意元音。\n\n`[\\[:alnum:\\]]` - 任意字母或数字。\n\n\
    `[\\[:alpha:\\]]` - 任意字母（与 `[a-zA-Z]` 相同）\n\n`[\\[:blank:\\]]` - 任意制表符或空格。\n\n\
    `[\\[:digit:\\]]` - 任意数字。\n\n`[\\[:lower:\\]]` - 任意小写字母。\n\n`[\\[:upper:\\]]`\
    \ - 任意大写字母。\n\n`[\\[:punct:\\]]` - 任意标点字符。\n\n`[\\[:space:\\]]` - 任意空白。\n\n字面量是按原样写入并按原样解释的值。例如，字母\
    \ \"b\" 匹配字母 b。\n\n现在让我们编写一个程序，将输入与五位邮政编码匹配。邮政编码仅由数字组成。\n\n"
