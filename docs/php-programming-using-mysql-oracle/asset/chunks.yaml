    # Overview


    PHP is a programming language to develop dynamic pages for the world wide web.
    HTML or hypertext markup language is the base for developing web pages but pages
    created in HTML are static. PHP allows these HTML pages to interact with a database
    and do things like adding data or retrieving data from one.


    In addition, PHP can be used to create the ability to verify user input and provide
    protection to pages. The prerequisite to understanding PHP is HTML. JavaScript
    allows dynamism on web pages however, JavaScript is not server based. It works
    within the client browser. PHP on the other hand is server based. The fact is
    one needs HTML, JavaScript and scripting language like PHP to complete a professional
    looking and working page.


    This book is about PHP. One may want to consider my book on JavaScript if they
    need a refresher on that subject.


    The webpage for this book is located at: http://beamto.fjtbooks


    Before we start:


    To run a PHP script which is a server based script one will need the following:


    A note pad editor or similar to save files with the extention ".php". and


    A location to put the script when complete. This can be a hosted site of which
    there are many (free or inexpensive web hosting sites) that allow PHP scripts.
    On a standalone computer it is possible to download a free PHP editor software.
    The code for this book was developed using the EasyPHP editor (version 17) and
    server which can be downloaded and installed for free at the time of writing this
    book. PHP has different versions and the current version is 7. This book is written
    for both version 5 and 7. There are some significant differences between these
    two versions. However, many hosting sites are still using version 5 series.


    The default database that is included in most hosting sites for PHP is MySQL and
    the free editors such as the one mentioned above also come with such a database.
    In addition to this database this book will explore connection to the Oracle database.
    The Oracle database being used with this book is the stand alone windows version
    11.2g Express version which can be downloaded for free at http://www.oracle.com.


    # Chapter 1. Introduction


    The first program by an unwritten tradition in any language is "Hello World".
    The way to do that in PHP is as follows:


    Using notepad with a file extention ".php" create a file called hello (`hello.php`).
    Put the following lines in that file.


    ```

    <?php  print "Hello World!!!";?>

    ```


    The `print` can also be replaced by the word `echo`.


    Now if one wants to wrap this within HTML tags that is fine such as:


    ```

    <html><body><?php  print "Hello World!!!";?></body></html>

    ```


    The `<?` starts the PHP part of the code and `?>` ends it. Both of them are mandatory.
    If this code is put on a server that does not have PHP, every line of this code
    will be visible to the user.


    This is actually the first program in PHP in this book.


    ```

    <html><body><?php  phpinfo();?></body></html>

    ```


    The above code will give the PHP configuration information for the php installation
    on the client''s PHP server.


    All settings will be displayed starting with the version number. Most free or
    inexpensive hosting sites at the time of writing have version 5.4 or higher for
    PHP on their servers. Backward compatibility is an important part of programming
    and even though the current version of PHP is higher than this knowledge of features
    in the old and new is very important.


    ![](images/00001.jpeg)


    If the current version of PHP which is seven (7) is used the sample output from
    `phpinfo()` will be as follows:


    ![](images/00002.jpeg)


    It is advised to write code in small letters unless a function is specific about
    letters. Keep in mind that the default setting of keyboards is small letters.
    The `hello.php` file can be modified to print the same words "Hello World" in
    red and in bold, italic and underlined. Note that all HTML code can be passed
    through the PHP file.


    ```

    <html><body><?php  print"<font color= red> <b><i><u>Hello World!!</u></i></b></font>?></body></html>

    ```


    Clarity of code can be enhanced by putting spaces between code lines or between
    modules of similar code by function.


    Comments can be added to scripts. There are two types of comments. One for single
    line and the other for multiple lines.


    The one for single line is: `//`


    The one for multiple line is: `/* ...... */`


    Always comment a code in which ever language the program is written.


    ## Variables


    Like any programming language PHP is not exempt from variables and like the other
    languages variables are containers of data. Popular x, y and z taking on different
    values is also available in PHP.


    Variables should be given reasonable names that identify what they stand for or
    what is expected. No reserved words of PHP can be used as a variable.


    Variable names are case sensitive. Following the `$` sign which is required for
    a variable name in PHP the name must begin with a letter (A-Z or a-z) or an underscore
    (`_`). The name cannot start with a number. This rule is not new many languages
    have this but the `$` sign requirement is a must in PHP. No spaces are allowed
    within the name except for the underscore.


    There are four main categories of variables in PHP - numbers, strings, arrays
    and objects.


    Number variables consist of the following:


    Integer - 1,2,3, -1, -2etc


    Floating point - 1.0, -19.2 etc


    Date types in PHP consist of numbers and strings are not specifically defined
    as a variable type.


    ### Strings


    A variable is a string if it consists of characters enclosed within a pair of
    either single or double quotation marks.


    Example: "Hello World"


    "Hello, `$name`"


    " 1"


    "21.07.17"


    "2017"


    ### Arrays


    Arrays by definition store data in index format. The data is entered using keys
    and retrieved using these keys. The arrays can be single or of multiple dimensions.


    Example:


    | John || Adam || Smith || Mary || Sally |

    | --- | --- | --- | --- | --- |


    Where John is at index or key 0 and Adam at key 1 and so forth until Sally who
    is at index at 4. The size of this single dimension array is 5 (0-4).


    The arrays that uses numbers for their keys is called a indexed array. An array
    that uses strings as keys is called an associative array.


    Arrays are an important part of any programming language.


    ### Object


    Objects are considered as an advanced feature. To define an object, its structure
    called the class has to be defined. Then instances of that structure are created.


    The concept of object oriented programming as seen in C++ or Java etc is an example
    of this type of variable.


    For example: if there is a variable called car then `car.length` is an example
    of the feature of car object.


    Values are assigned to variables in PHP using the "=" assignment operator.


    Example:


    ```

    $x = 1.5;

    $y ="John ";

    ```


    To print out the result we use the `print` function.


    Example:


    ```

    print "The number is $x";

    ```

