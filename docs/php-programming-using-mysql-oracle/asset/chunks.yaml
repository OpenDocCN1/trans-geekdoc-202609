    # 第 9 章. PHP 用于 Oracle 数据库


    在上一章中讨论的数据库是 MySQL。在本章中，让我们来看一下 PHP 与 Oracle 数据库的关系。这里讨论的 Oracle 数据库是 express
    版本 11.2。如果客户端或独立机器上没有安装，附录 II 展示了如何安装它。


    要使用 PHP 与 Oracle 进行配合，需要对 PHP 安装进行一些配置更改。本书的代码使用 WAMP 编辑器 EasyPHP 开发，该编辑器有多个版本。并非必须使用最新版本，但运行本书代码所需的最低编辑器版本是运行
    PHP 5 及以上的版本。使用编辑器或类似工具连接到 Oracle 所需的配置更改在附录 III 和 IV 中显示。


    非常重要的是要写下 Oracle 安装的默认值。在本章的示例中，默认安装的数据库称为 `orcl`。`hr` 用户及其关联的表将被使用。


    让我们在 Oracle 数据库的 `hr` 用户下创建一个名为 `employee` 的表，密码为 `hr`。为此，请从 Windows 开始菜单中的 Oracle
    应用菜单使用 SQL Plus 接口。界面看起来像这样。如果 `hr` 账户被锁定，以 `sysdba` 登录并使用以下命令 - `alter user hr
    account unlock;` 然后连接到 `hr`。


    ![](img/00059.jpeg)


    要创建 employee 表，使用以下命令：


    ```

    create table employee (sid varchar2(10), name varchar2(50), manager varchar2(10)
    constraint sid_pk primary key = (sid));

    ```


    这将创建 employee 表并将 `sid` 设为主键。就本书而言，这个简单的表已足够。如果 Oracle 相关的 SQL 对你来说是新的，我的 SQL
    书籍可能会有所帮助。


    如果已按照附录 III 和 IV 中讨论的方式对 `PHP.ini`（配置文件）进行了更改并保存，那么现在是时候了解 PHP 连接器用于 Oracle 了。PHP
    程序使用 PHP `OCI8` 扩展连接到 Oracle 数据库。


    在撰写本书时，该扩展可用于 Oracle 12、11、10 和 9 数据库。PHP 本身与 Oracle 数据库无关。


    要连接到数据库，OCI8 PHP 类库提供了以下函数 `oci_connect()`、`oci_pconnect()` 和 `oci_new_connect()`。如果需要非持久连接，则使用
    `oci_connect()`。这也是缓存的。这提高了连接效率。


    `oci_connect` 使用的缓存会在脚本运行后或连接资源被关闭时被移除。


    `oci_new_connect` 不会被缓存，而 `oci_pconnect()` 会被缓存并可在请求之间使用。`oci_close()` 函数与前面提到的三个函数中的任何一个一起使用都是必需的。


    在上面使用 create 语句创建 employee 表之后，必须插入值。


    最简单的方法是使用如下的 insert 语句：


    ```

    insert into employee values(''101'',''Albert'',''103'');

    ```


    并类似地插入上一页图片中显示的其他三行数据。


    安装 Oracle 后，找到 `tnsnames.ora` 文件，通常位于 `network/admin/` 文件夹中。该文件会给出数据库的 `sid` 值。默认是如本章前面提到的
    `orcl`。通常端口是 `1521`，主机为本地。如果是独立计算机或笔记本上安装的 Oracle 11.2 express，则主机为该安装。


    `oci_connect()` 函数有三个部分 - 用户名、密码和 connection_string。


    由于我们要连接到 `hr` 用户下的表，因此用户名为 `hr`，密码为 `hr`，连接字符串为 `orcl` - 即 sid 名称或数据库名称。


    确保 sid 名称与 `tnsmames.ora` 文件中所述完全一致。


    `oci_parse()` 用于解析查询。


    `oci_execute()` 用于执行语句。


    `oci_fetch_array()` 用于以数组格式获取查询的下一行。


    最后 `oci_close()` 将关闭与数据库的连接。


