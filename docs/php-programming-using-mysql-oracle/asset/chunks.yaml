    # Cookie Example


    ```html

    <html><head><title>Cookie Example</title></head><body><form action="cookie.php"
    method="post"> Yellow<input type="radio" name="color" value="Yellow"/>Red<input
    type="radio" name="color" value="Red"/>Blue<input type="radio" name="color" value="Blue"/><br>Please
    complete the feedback form and send your preference of color. </p><p><input type
    ="submit" name="submit" value="color"></form></body></html>

    ```


