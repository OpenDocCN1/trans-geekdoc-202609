    ;\n}break;\n}\nprint\"You have not chosen anything!\";\n?>\n```\n\n在上面的代码中，使用\
    \ `switch` 代替 `if` 语句来选择两个项目中的一个。项目将从类似于下面的 HTML 页面中选择。\n\n```html\n<html><head><title>Switch</title></head><body><form\
