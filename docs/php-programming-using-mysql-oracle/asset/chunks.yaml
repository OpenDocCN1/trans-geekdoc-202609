    The examples in this book were developed using the EasyPHP editor which is available
    at the following website- [http://www.easyphp.org](http://www.easyphp.org). The
    current version of PHP at the time of writing this book version 7 and its interface
    was shown in chapter 1. The interface below is for PHP version 5 series.


