    \ |\n| 102 || Sally || Secretary |\n| 103 || Martha || Receptionist |\n| 104 ||\
    \ John || Accountant |\n| 105 || Sandy || Trainee |\n\n```\nselect sid, name job\
    \ from staff \nwhere \nsalary > 3000;\n```\n\n| sid || name || job |\n| --- |\
    \ --- | --- |\n| 100 || Robert || Manager |\n| 104 || John || Accountant |\n\n\
    如果要包含 3000 的薪资，则查询将如下所示：\n\n```\nselect sid, name job from staff \nwhere \nsalary\
    \ >= 3000;\n```\n\n因此比较运算符为：\n\n| \\=  || 用于比较两个变量的值。 |\n| --- | --- |\n| != ||\
    \ 不等于。 |\n| \\> || 大于。 |\n| < || 小于。 |\n| \\>= || 大于等于。 |\n| <= || 小于等于。 |\n|\
    \ < || 不小于。 |\n| --- | --- |\n| !> || 不大于。 |\n| <> || 比较两个值是否相等或不相等。如果值不相等则条件成立。\
    \ |\n\nSQL 中的逻辑运算符如下：\n\n| AND || 多个条件，每个条件都必须满足。 |\n| --- | --- |\n| OR || 任意一个条件需要满足。\
    \ |\n| ALL || 用于将一个值与另一值集中的所有值进行比较。 |\n| ANY || 用于将一个值与列表中符合条件的任何适用值进行比较 |\n|\
    \ BETWEEN || 用于在给定最小值和最大值的情况下搜索处于一组值范围内的值。 |\n| EXISTS || 用于搜索指定表中满足特定条件的行的存在。\
    \ |\n| IN || 用于将一个值与已指定的字面值列表进行比较。 |\n| LIKE || 用于使用通配符运算符比较相似的值。 |\n| NOT ||\
    \ 与其他逻辑运算符一起使用以否定逻辑运算符的效果。 |\n| IS NULL || 用于比较并查找值是否为空。 |\n| UNIQUE || 搜索表中每一行的唯一性。\
    \ |\n\n让我们使用以下表来看一些示例：表名为 `staff`。\n\n| sid || name || job || salary || location\
    \ |\n| --- | --- | --- | --- | --- |\n| 100 || Robert || Manager || 8000 || Atlanta\
    \ |\n| 101 || Albert || Administrator || 3000 || Atlanta |\n| 102 || Sally ||\
    \ Secretary || 2000 || Atlanta |\n| 103 || Martha || Receptionist || 1500 || Chicago\
    \ |\n| 104 || John || Accountant || 5000 || Chicago |\n| 105 || Sandy || Trainee\
    \ || 1000 || Miami |\n| 106 || James || Lawyer || 7000 || Miami |\n\n```\nselect\
    \ name from staff \nwhere\nsalary > 7000\nand location = 'Atlanta';\n```\n\n唯一的人将是：Robert\n\
    \n|  name |\n| --- |\n| Robert |\n\n如果将“and”替换为“or”，结果会有所不同。\n\n| name |\n| ---\
    \ |\n| Robert |\n| Albert |\n| Sally |\n\n原因在于只需要满足一个条件。Robert 的薪资确实超过 7000 且位于\
    \ Atlanta，但 Albert 和 Sally 也位于同一地点，只是他们的月薪均未超过 7000。\n\n```\nselect name from\
    \ staff\nwhere\nsalary is null;\n```\n\n在上面的示例中，查询正在搜索 `salary` 列中的空值。Null 表示无。在数据库中，无即为某种东西，而这种东西称为\
    \ Null。查询将找不到任何名称，因为没有薪资为空的名称。\n\n为了方便起见，我们在此重复 staff 表：\n\n| sid || name || job\
    \ || salary || location |\n| --- | --- | --- | --- | --- |\n| 100 || Robert ||\
    \ Manager || 8000 || Atlanta |\n| 101 || Albert || Administrator || 3000 || Atlanta\
    \ |\n| 102 || Sally || Secretary || 2000 || Atlanta |\n| 103 || Martha || Receptionist\
    \ || 1500 || Chicago |\n| 104 || John || Accountant || 5000 || Chicago |\n| 105\
    \ || Sandy || Trainee || 1000 || Miami |\n| 106 || James || Lawyer || 7000 ||\
    \ Miami |\n\n```\nselect * from staff \nwhere \nlocation in ('Miami', 'Chicago');\n\
    ```\n\n请注意，当值是文本时——它们必须用单引号括起来。数字则不需要。如果我们将此查询的最后一行更改为 `location not in ('Miami',\
    \ 'Chicago')`，则只会显示位于 Miami 或 Chicago 以外的城市的人员姓名。此查询的结果将是位于这两个城市的人员信息。\n\n| sid\
    \ || name || job || salary || location |\n| --- | --- | --- | --- | --- |\n| 103\
    \ || Martha || Receptionist || 1500 || Chicago |\n| 104 || John || Accountant\
    \ || 5000 || Chicago |\n| 105 || Sandy || Trainee || 1000 || Miami |\n| 106 ||\
    \ James || Lawyer || 7000 || Miami |\n\n让我们来看这个查询：\n\n```\nselect * from staff\n\
    where\nsalary > 3000\nand salary < 6000;\n```\n\n查询要求薪资在 3000 以上且小于 6000 的人员。查询将产生以下结果：\n\
    \n| sid || name || job || salary || location |\n| --- | --- | --- | --- | ---\
    \ |\n| 101 || Albert || Administrator || 3000 || Atlanta |\n| 104 || John || Accountant\
    \ || 5000 || Chicago |\n\n相同的查询也可以写成如下形式：\n\n```\nselect * from staff\nwhere\n\
    salary between 3000 and 6000;\n```\n\n以下查询查看了“like”运算符：\n\n```\nSelect * from\
    \ staff\nWhere\nName like 'R%';\n```\n\n这将给出以下结果：\n\n| sid || name || job || salary\
    \ || location |\n| --- | --- | --- | --- | --- |\n| 100 || Robert || Manager ||\
    \ 8000 || Atlanta |\n\n这是唯一以 R 开头的姓名。Martha 也包含字母“r”，但它不在起始位置。\n\n可以从另一个查询中调用\
    \ select 查询。以下示例展示了这一点以及“Exists”运算符的使用。\n\n```\nselect name from staff \nwhere\
    \ exists\n(select name from staff where salary > 5000);\n```\n结果将为：\n\n| name\
    \ |\n| --- |\n| Robert |\n| Albert |\n| Sally |\n| Martha |\n| John |\n| Sandy\
    \ |\n| James |\n\n如果我们稍微更改查询并尝试下面的查询，将不会得到任何响应。\n\n```\nselect name from staff\
    \ \nwhere exists\n(select name from staff where salary > 8000);\n```\n\n“ALL”运算符的使用示例：\n\
    \n```\nselect * from staff\nwhere \nlocation = all (select location from staff\
    \ where salary = 3000);\n```\n\n| sid || name || job || salary || location |\n\
    | --- | --- | --- | --- | --- |\n| 100 || Robert || Manager || 8000 || Atlanta\
    \ |\n| 101 || Albert || Administrator || 3000 || Atlanta |\n| 102 || Sally ||\
    \ Secretary || 2000 || Atlanta |\n\n结果将是 Atlanta 位置的所有员工信息。\n\n“ANY”运算符的使用示例：\n\
    \n```\nselect * from staff\nwhere \nlocation = any (select location from staff\
    \ where salary = 3000);\n```\n\n| sid || name || job || salary || location |\n\
    | --- | --- | --- | --- | --- |\n| 100 || Robert || Manager || 8000 || Atlanta\
    \ |\n| 101 || Albert || Administrator || 3000 || Atlanta |\n| 102 || Sally ||\
    \ Secretary || 2000 || Atlanta |\n\n在使用任何数据库时，最好对字段名和查询使用小写字母。\n\n按如下方式更改查询：\n\
    \n```\nselect * from staff\nwhere \nlocation = any (select location from staff\
    \ where salary > 3000);\n```\n\n将找到薪资大于 3000 的每个位置。在这种情况下，三座城市中至少有一人薪资大于 3000。因此查询的第一部分将打印表中的所有行。共有七行。\n\
    \n迄今为止给出的命令可以在 MySQL、Oracle 和 Microsoft 的 Access 等数据库中工作。\n\n如果使用编辑器在将 PHP 脚本上传到网站之前在计算机上开发，则首先要做的是查找它是否附带\
    \ PHPMyadmin 模块。\n\n"
