    这与 `strcmp()` 类似，但被认为在语言学上更精确。


    `strcasecmp()` 和 `strnatcasecmp()` -


    这些是 `strcmp()` 和 `strnatcmp()` 的大小写不敏感的伴侣。


    `trim()`-


    示例：


    `$firstname =trim($_POST[''firstname'']);` 通常在 `register_globals` 设置设置为关闭时设置。检查如前所示的
    `phpinfo()` 设置。


    但在不知道设置的情况下使用此函数不会损害 PHP 脚本。


    `trim()` 函数可以进一步分为两个函数 - `rtrim()` 删除字符串变量末尾找到的空格，`ltrim()` 处理字符串变量开头处的空格。


    这用于删除文本前后的空格。


    `ucfirst()` -


    使字符串的首字母大写。


    `ucwords()` -


    使字符串中单词的首字母大写。


    `strtoupper()` -


    使整个字符串大写。


    `strtolower()` -


    使整个字符串小写。


    # 第 3 章. 控制与循环


    在每种编程语言中都有控制和循环结构。`IF` 语句是最常见的一种。


    PHP 中 `IF` 语句的基本结构如下：


    ```

    if (condition)

    {

    statement(s);

    }

    ```


    `IF` 条件可以通过使用 `else` 进一步增强，如下所示。


    ```

    if (condition)

    {

    statement(s);

    } else {

    other statement(s);

    }

    ```


    让我们看一个例子。用户登录页面的 HTML 文件如下。


