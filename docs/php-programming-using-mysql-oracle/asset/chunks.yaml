    让我们重写上面显示的代码以包含这两个语句。第二个语句将确保文本区域框中有一些数据可写入或追加到数据文件。


    ```

    <html><body><?phpif (isset($_POST[''submit''])) {if(!empty($_POST[''data''])){if($fx
    = fopen(''data.txt'',''ab'')) {$data=trim($_POST[''data'']);fwrite($fx,"$data\n");fclose($fx);}}}?><form
    action="file.php" method="post"><p><textarea name="data" rows="5" columns="30"></textarea><p><input
    type="submit" name="submit" value="Write the data"></form></body></html>

    ```


    这段代码与之前看到的相同，但添加了一个空的文本区域框。如果将框留空，则不会向文件追加任何内容。但是，如果在文本区域框中写入数据，它将被写入到 `data.txt`
    文件中。行 `if(!empty($_POST[''data'']))` 检查文本区域框中是否存在数据。


    如果两个用户向同一个文件提交数据，可能会出现一些问题。因此，写入文件的一个重要方面是锁定。当使用数据库时，这不是问题，因为它们有自己的内置锁定机制。


    锁类型必须在 `fopen()` 语句之后提及。锁类型如下：


    `LOCK_SH` - 用于读取目的的共享锁。


    `LOCK_EX` - 用于写入目的的独占锁。


    `LOCK_UN` - 释放锁。


    `LOCK_NB` - 非阻塞锁。


    因此，上述写入 `data.txt` 文件的脚本可以修改如下：


    ```

    <html><body><?phpif (isset($_POST[''submit''])) {if(!empty($_POST[''data''])){if($fx
    = fopen(''data.txt'',''ab'')) {$data=trim($_POST[''data'']);flock($fx,LOCK_EX);fwrite($fx,"$data\n");flock($fx,LOCK_UN);fclose($fx);}}}?><form
    action="file.php" method="post"><p><textarea name="data" rows="5" columns="30"></textarea><p><input
    type="submit" name="submit" value="Write the data"></form></body></html>

    ```


    就写入而言，`data.txt` 文件中不会有任何差异。这里使用的锁是独占锁。在你提交数据时，另一个用户无法写入 `data.txt`。必须解锁锁以允许其他人使用同一文件。


    ### 读取文件


    读取文件与写入它一样重要。可以在一次操作中读取文件的函数是 `file()`。


    `file()` 函数使用一个数组来输入从文件中读取的数据。让我们看看读取本章迄今为止使用的 `data.txt` 文件中输入的数据的代码。此数据 .txt
    文件已使用上述写入脚本输入了三个语句。


    语句如下：This is the first statement. This is the second statement. This is the third
    statement.


    代码如下：


    ```

    <?php$data =file(''data.txt'');$n =count($data);foreach ($data as $key=>$value)
    {print"$value<p>";}?>

    ```


    请注意，变量 `$data` 是一个数组，我们正在按数组章节中所示的方式打印结果。


    输出如下：


    ![](img/00047.jpeg)


    ### 创建目录


    在 PHP 中创建目录使用的是 `mkdir` 函数。此函数的格式如下：


    `mkdir(''directory-name'', permissions);`


    在基于 Windows 的服务器上，权限将被忽略。请在创建目录或使用文件存储和检索数据之前注意网络主机的策略。


    我强烈认为在专业环境中，这些功能应使用数据库完成。


    让我们创建一个代码，要求输入要创建的目录名和文件名，然后在该目录的文件中放入一些文本。代码如下：


    ```

    <html><body><?phpif(isset($_POST[''submit''])){$dirname=trim($_POST[''dirname'']);mkdir("$dirname",0777);$filename=trim($_POST[''filename'']);$data=trim($_POST[''data'']);if($fx
    = fopen("C:\\Program Files (x86)\\EasyPHP-DevServer-14.1VC9\\data\\localweb\\scripts/$dirname/$filename","ab")){fwrite($fx,"$data\n");fclose($fx);}}?><form
    action="file.php" method="post"><p>Directory name: <input type="text" name="dirname"
    size ="20"><p>File name:<input type="text" name="filename" size="20"><p>Text to
    be entered into file:<input type="text" name="data" size="50"><p><input type="submit"
    name="submit" value="Write the data"></form></body></html>

    ```


    此代码将使用 `mkdir()` 创建目录。需要仔细输入文件的路径。错误的或 `\` 会导致代码出现问题。


    # 第 7 章 数据库简介


    随 PHP 开发工具包或免费或共享托管一起提供的数据库是 MySQL 数据库。也有例外。在本章中，我们将了解操作任何数据库所需的 SQL（结构化查询语言）的基础知识。


    SQL 有四个重要的命令，涉及操作数据库表中保存的数据。这四个命令是：


    Select - 从数据库的表中检索数据。


    Insert - 向数据库中的表添加数据。


    Update - 更改数据库表中数据。


    Delete – 从数据库表的行中删除数据。


    除此之外，还有用于创建数据库、表、视图、索引、过程的命令。


    在网络托管站点中，有一个控制面板来创建数据库及其关联的表。在 Unix/Linux 托管中，目前市场上最流行的控制面板是 C-Panel。它可能看起来像下面这样。


    ![](img/00048.jpeg)


    在 Unix/Linux 基于 C-Panels 的情况下，数据库的管理是通过 PHPMyAdmin 选项完成的。在所有托管情况下，始终熟悉所使用的托管的
    faq。


    在下面的成绩表中我们插入如下：


    | sid | name | prelim | midterm | final |

    | --- | --- | --- | --- | --- |

    | 100 | Albert | 100 | 78 | 89 |

    | 101 | Robert | 98 | 93 | 85 |


    `Insert into grades values (''100'',''Albert'',100,78,89);`


    字母数字/字符字符需要在单引号内。


    数字不需要在引号内。


    在插入语句中，遵循与表中相同的字段顺序非常重要。


    可以跳过特定字段或将特定字段的值留空，如下所示：


    `Insert into grades values (''100,''Albert’, null,78,89);`


    上面的示例中 prelim 的值稍后可以使用 update 语句填充，如下所示：


    `update grades set prelim=100 where sid = ''100'';`


    让我们再向表中添加一行。


    `insert into grades values (''101'',''Robert'',98,93,85);`


    要删除表或表的行，我们使用以下命令：


    `delete grades were sid=''100'';`


    这将只删除 sid = 100 的行，而不会删除其他行。删除应谨慎使用。


    `delete grades;`


    将导致所有行被删除。删除表中所有数据的另一种方法是截断。


    `truncate table grades;`


    要完全从数据库中删除表 - 包括结构和值 - 使用 drop 命令如下：


    `drop table grades;`


    这些命令（`drop`、`truncate`、`delete`）在公司或组织中实际工作时必须谨慎使用。以下是使用数据库时需要使用的命令的总结。


    ### DDL：数据定义语言


    | Create | 创建新表。 |

    | --- | --- |

    | Alter | 修改对象，例如表。 |

    | Drop | 删除表。 |

    | Truncates | 删除表字段的值，但保留表的结构不变。 |


    ### DML：数据操纵语言


    | Select | 根据用户的查询检索表的一部分。 |

    | --- | --- |

    | Insert | 将值放入表中。 |

    | Update | 修改表中的行。 |

    | Delete | 从表中删除行。 |


    ### DCL：数据控制语言


    | Grant | 给用户一个特权，例如查看或修改数据库中表的权限。 |

    | --- | --- |

    | Revoke | 从用户那里移除特权。 |


    看下面的表：表的名称是 staff。


    | sid | name | job | salary | location |

    | --- | --- | --- | --- | --- |

    | 100 | Robert | Manager | 8000 | Atlanta |

    | 101 | Albert | Administrator | 3000 | Atlanta |


