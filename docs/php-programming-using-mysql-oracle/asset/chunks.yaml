    因此该 cookie 的持续时间从当前时间算起为 60 秒。如果需要 1 小时，则为 `time() + 3600`，以此类推。安全标志的数字 `0` 表示
    cookie 不会通过安全连接发送。替代方案是用于 HTTPS 连接的 `1`。


    在 60 秒或 1 分钟后，如果使用 `$_COOKIE[''color'']` 选项读取 cookie，则找不到任何值。将会显示错误消息。


