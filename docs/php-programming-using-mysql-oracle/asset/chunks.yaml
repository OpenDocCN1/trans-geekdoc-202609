    # 附录 III. PHP 与 Oracle


    要更改 EasyPHP WAMP，请点击桌面上的 E 图标并选择配置和 PHP。这是适用于版本 12 -14 使用 PHP 5 至 5.6 的版本。


    ![](img/00071.jpeg)


    这将打开 PHP 配置文件。前往以下行


    ![](img/00072.jpeg)


    其中写着 `extension=php_oci8_11g.dll` 并取消注释它。即去掉前面的 `;`。请注意上一行应保持不变。这是因为我们正在激活用于 11g
    express 版本的 oci8 扩展。保存文件并使用文件保存，然后重新启动机器或 EasyPHP 编辑器，就完成了。如果 PHP 是单独安装的，则 PHP.ini
    配置文件也应进行同样的操作，前提是已备份原始文件。


    在对任何配置文件进行更改之前，请先确认管理员是否允许，计算机不是独立的。请查阅附录 IV 以了解 PHP 7。


    ## 附录 IV. Easy PHP 界面


    在本节中，我们将介绍本书用于编写程序的编辑器的不同功能或界面。编辑器是 Easy PHP，可以从 http://www.easyphp.org 下载。


    ![](img/00073.jpeg)


    安装 EasyPHP 编辑器的最新版本后即可获得该界面。直到版本 17，无需互联网连接即可完成安装。一旦桌面上出现图标快捷方式，右键单击并选择打开。当导航栏底部屏幕上出现
    “E” 图标时，右键单击并选择打开仪表板。这将引导至上述界面。


    要开始使用编辑器，请点击启动 HTTP 服务器，如果需要数据库则点击启动数据库服务器。请注意，版本 17 中 PHP 的默认版本为 5.6，因此如果这不是所需版本，请在
    HTTP 服务器下选择更改设置。这是红色按钮之后的第三个按钮。选择版本 7 并点击确定。


    便携目录是脚本所在的位置，PHP 脚本必须从此处运行。文件位于 C 盘或 EasyPHP 下所选驱动器中的 `eds-www` 目录下。使用记事本编写 PHP
    程序并保存在此目录中。它将出现在便携目录下。


    MySQL 管理允许打开 PHPMyadmin 以创建数据库和/或表。MySQL 数据库的整个管理都从这里进行。


    此界面无法直接访问其他数据库，例如 Oracle。也许在编辑器的后续版本中会有。 要激活用于连接 Oracle 的 OCI8 功能，必须找到 PHP.ini
    文件。此版本编辑器中会有两个，因为与之关联有两个 PHP 版本。找到您想要的版本的 PHP.ini 文件，为此请前往 EasyPHP 的安装文件夹。在本书使用的计算机上，其位置为：


    `C:\\Program Files (x86)\\EasyPHP-Devserver-17\\eds-binaries\\php`


    适用于版本 7 和版本 5。选择您想要的 PHP 版本的文件夹，然后找到 PHP.ini 文件并取消注释 `remove ;` 处理 OCI8 dll 的行。如果有两行，则取消注释与
    Oracle express 版本关联的那一行，如果计算机上安装的是该版本的数据库。


    此编辑器上 PHP 的默认版本 `version 7` 是 PHP 5.6。可以使用的在线快速编辑器可用于粘贴代码并进行测试。


    ![](img/00074.jpeg)


    对于 PHP 新手或不喜欢在记事本等中创建文件的人来说，这非常方便。


    请记住，迄今为止，此在线编辑器适用于版本 5.6，并且可以肯定的是，在此编辑器的未来更新版本中，可以看到更现代的在线编辑器。


