    \ of the script will vary according to the editor. Even in EasyPHP editor it is\
    \ possible to run this script under the projects folder in the older versions\
    \ (12 through 14) or in the eds-www folder if in version 17. \n\nIf an error occurs\
    \ and it will from time to time-- read the error message, go back to the code\
    \ written in notepad or editor and correct the code in and around the line number\
    \ given in the error message.\n\nSingle quotes mean that the item within them\
    \ should be taken literally. Double quotes means that the values of the item within\
    \ the quotes should be taken.\n\nFor example:\n\n$name = 'John' and $name = \"\
    John\" will give the same result.\n\nbut \n\n$name = \"$firstname\" and $name\
    \ ='$firstname' will give two results.\n\nValue of firstname= John and $firstname.\n\
    \nIt is possible to assign to a variable the value of another variable as:\n\n\
    $name =$firstname;\n\nIt is best to use double quotes and that is what will be\
    \ used throughout the rest of this book. In addition to the print function there\
    \ is another function called echo() which will print results or messages to the\
    \ screen.\n\nIf one is using the EasyPHP editor version (17) which has PHP 7 in\
    \ it along with PHP 5.6 the interface will look like this.\n\n![](images/00004.jpeg)\n\
    \nThe two options above are for starting the apache server. The settings icon\
    \ under HTTP server will allow one to switch between PHP 5.6 and PHP 7.1.3 in\
    \ this case just by selecting the version from the drop down menu and clicking\
    \ restart. \n\nAt the time of writing this book most hosting websites - especially\
    \ the low cost and free ones still have PHP version 5 on their servers.  This\
    \ book will show the output of both versions and highlight where there are significant\
    \ changes in the new version of PHP.\n\nUnless otherwise stated the code seen\
    \ in this book will work for both old and new versions of PHP.\n\n# Chapter 2.\
    \ HTML and PHP Form\n\nHTML is required to put PHP to full use. PHP programs can\
    \ have HTML within it and HTML script can have PHP embedded in it.\n\nThe first\
    \ script in this chapter will request the name and phone number of a person. The\
    \ form will have a box to enter the name and phone number and some radio buttons\
    \ to choose the title of the person's name.\n\nThe way it works is like this:\n\
    \nAn HTML form/page requests the user to input data. It then requests the PHP\
    \ script on the server to process the data request which ultimately will be added\
    \ to a database.\n\nHTML or a webpage has limited capability to interact with\
    \ the server when it comes to data processing.  It transfers this task using the\
    \ <form action = </form> method.\n\nLet us now write the html code first for the\
    \ html webpage.\n\n| <html><head><title>Feedback form</title></head><body><form\
    \ action=\"feedback.php\"> Mr.<input type=\"radio\" name=\"title\" value=\"Mr.\"\
    />Mrs.<input type=\"radio\" name=\"title\" value=\"Mrs.\"/>Ms.<input type=\"radio\"\
    \ name=\"title\" value=\"Ms.\"/><br>Please complete the feedback form</p><p>Name:\
    \ <input type=\"text\" name=\"name\" size=\"20\"><p>Phone:<input type=\"text\"\
    \ name=\"name\" size=\"20\"><p><input type =\"submit\" name=\"submit\" value=\"\
    Send my response\"></form></body></html> |\n\n| --- |\n\nThe output of this HTML\
    \ file is as follows: Please note that the feedback.html file and its associated\
    \ feedback.php file is kept in the same location. However, this is not a requirement.\
    \ If the files are in separate folders the path to the PHP file must be included\
    \ in the <form action > statement.\n\n![](images/00005.jpeg)\n\nSo the feedback\
    \ html file has three parts- selection of title, name and phone. The <form action>\
    \ statement tells that this file will connect to a script file for further processing.\
    \ The <form action> is closed by a </form> Now that this html file is transferring\
    \ data to a PHP file- the PHP file must be able to capture the data being transferred.\n\
    \nObserve the <form action> statement. It is missing a method. There are two methods-\
    \ get and post. What is the difference between the two methods?\n\nThe GET method\
    \ sends all the data gathered as a part of the URL. The POST method transmits\
    \ the data invisibly. Thus choosing GET method might make some vital information\
    \ visible when the submit button is clicked. There is also a limitation on the\
    \ amount of data that can be send with GET.\n\nThe method of transfer from the\
    \ feedback.html file will be POST. The following change must be made to the feeback.html\
    \ code in the previous page.\n\n<form action =\"feedback.php\" method=\"post\"\
    >\n\nThe following is the code for the feedback.php file:\n\n| <?php$title=$\\\
    _POST\\['title'\\];$name=$\\_POST\\['name'\\];$phone=$\\_POST\\['phone'\\];print\"\
    Thank you,$title $name for your feedback.\";print\"<p> Your phonenumber,$phone\
    \ has been added to our database.\";?> |\n\n| --- |\n\nNote that in the feedback.php\
    \ file above there should be receiving variables to take on the values that are\
    \ being send from the feedback.html file.\n\nIn the case above the variable names\
    \ are the same as that of the data being received but this is not a requirement.\
    \ The names of the fields could x, y or z.\n\nNote that feedback.php has no HTML\
    \ code. This code can be modified as follows to include HTML code.\n\n| <html><head><title>Feedback</title></head><body><?php$title=$\\\
    _POST\\['title'\\];$name=$\\_POST\\['name'\\];$phone=$\\_POST\\['phone'\\];print\"\
    Thank you,$title $name for your feedback.\";print\"<p> Your phonenumber,$phone\
    \ has been added to our database.\";?></body></html> |\n\n| --- |\n\nMore advanced\
    \ HTML can be used to create response page that is more appealing. But our emphasis\
    \ here is on the PHP code. \n\nNote that HTML code can be included within the\
    \ print function and in advanced PHP scripts HTML is usually used dynamically.\n\
    \nThe output from the feedback.php file is as follows:\n\n# ![](images/00006.jpeg)\n\
    \n# If the, get method is used in the feedback.html file to transfer data to the\
    \ feedback.php form then to retrieve the data the $\\_GET\\['fieldname'\\] method\
    \ should be used. Older versions of PHP such as those before version 4.1 used\
    \ to use $HTTP\\_POST\\_VARS and $HTTP\\_GET\\_VARS.\n\nLet us now look at another\
    \ HTML file. This HTML page will request the price, quantity, discount and unfortunately\
    \ the tax of three different items of a supplier. Let us call these different\
    \ items as widget1, widget2 and widget3.  The HTML code looks as follows:\n\n\
    | <html><head><title>Price Checker</title></head><body><form action=\"price.php\"\
    \ method=\"post\"> Widget1.<input type=\"radio\" name=\"item\" value=\"Widget1.\"\
    />Widget2.<input type=\"radio\" name=\"item\" value=\"Widget2.\"/>Widget3.<input\
    \ type=\"radio\" name=\"item\" value=\"Widget3\"/><p>Quantity: <input type=\"\
    text\" name=\"quantity\" size=\"20\"><p>Price:<input type=\"text\" name=\"price\"\
    \ size=\"20\"><p>Discount:<input type=\"text\" name=\"discount\" size=\"20\"><p>Tax:<input\
    \ type=\"text\" name=\"tax\" size=\"20\"><input type =\"submit\" name=\"submit\"\
    \ value=\"Send my response\"></form> </body></html> |\n\n| --- |\n\nThe associated\
    \ php file called price.php is as follows:\n\n| <?php$item=$\\_POST\\['item'\\\
    ];$quantity=$\\_POST\\['quantity'\\];$price=$\\_POST\\['price'\\];$discount=$\\\
    _POST\\['discount'\\];$tax=$\\_POST\\['tax'\\];$tax = ($tax/100);$taxrate =1+$tax;$total\
    \ = ($quantity \\* $price)-$discount;$final=$total\\*$taxrate;print\"You have\
    \ chosen $item\";print\"<p>The quantity ordered is $quantity, at $price$.\";print\"\
    <p>The discount is $discount$.\";print\"<p>The tax is $tax.\";print\"<p>The final\
    \ cost is $final$\";print\"<p>Thank you.\";?> |\n\n| --- |"
