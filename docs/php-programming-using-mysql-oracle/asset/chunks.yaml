  trans: "\n\n# PHP 数组遍历与排序\n\n进入 `/path/to/xxx` 目录，找到 `xxx.json`。\n\n## 使用 `foreach`\
    \ 遍历关联数组\n\n```php\n<?php\n$salary = array ('Adam'=>1000, 'Smith'=> 2000, 'Mary'=>\
    \ 2500, 'Sally'=>1800);\nprint\"The original array looks like this. <br>\";\n\
    foreach($salary as $emp => $amount){\nprint\"$emp:$amount<br>\";\n}\n?>\n```\n\
    \nThe output for this code will look like this.\n\n![](img/00021.jpeg)\n\nThe\
    \ loop is a special version of for. Notice in this example the key is a word and\
    \ the value is a number unlike the earlier example of car models where both key\
    \ and value were text.\n\nIf the output expected is the values of the array and\
    \ not the index or key along with it then the above code can be modified as in\
    \ the table below.\n\nThe difference is in the `foreach` loop where the index\
    \ reference is dropped and the value is mentioned.\n\nThe print is only of the\
    \ amount and not the index value. Note if the array has no shown index such as\
    \ `$name = array ('Tom','Harry','Smith','Adam');` Then also this method shown\
    \ below will work.\n\n```php\n<?php\n$salary = array ('Adam'=>1000, 'Smith'=>\
    \ 2000, 'Mary'=> 2500, 'Sally'=>1800);\nprint\"The original array looks like this.\
    \ <br>\";\nforeach($salary as $amount){\nprint\"$amount<br>\";\n}\n?>\n```\n\n\
    ### 无键的数组示例\n\n```php\n<?php\n$name = array ('Tom','Harry','Smith','Adam');\n\
    print\"The original array looks like this. <br>\";\nforeach($name as $emp){\n\
    print\"$emp<br>\";\n}\n?>\n```\n\nThe output is as follows.\n\n![](img/00022.jpeg)\n\
    \n## 数组排序函数\n\nSorting arrays can be done by using the following functions.\n\n\
    `sort()` - This sorts by values but does not maintain the key values.\n\n`rsort()`\
    \ - This reverses the values and does not maintain the key values.\n\n`asort()`\
    \ - These sorts by values and does maintain the key values.\n\n`arsort()` - The\
    \ values are sorted in inverse manner and it does maintain the key values.\n\n\
    `ksort()` - The sorting is done by keys and it maintains the key values.\n\n`krsort()`\
    \ - Sorting is by keys in inverse and it maintain the key values.\n\nLet us look\
    \ at an example:\n\n```php\n<?php\n$salary = array ('Adam'=>1000, 'Smith'=> 2000\
    \ , 'Mary'=> 2500, 'Sally'=>1800);\nprint\"The original array looks like this.<br>\"\
    ;\nforeach($salary as $emp => $amount){\nprint\"$emp:$amount<br>\";\n}\nprint\"\
    The sort using sort() looks like this:<br>\";\nsort($salary);\nforeach($salary\
    \ as $emp => $amount){\nprint\"$emp:$amount<br>\";\n}\nprint\"The sort using rsort()\
    \ looks like this:<br>\";\nrsort($salary);\nforeach($salary as $emp => $amount){\n\
    print\"$emp:$amount<br>\";\n}\n?>\n```\n\nThe output will be as follows.\n\n![](img/00023.jpeg)\n\
    \nThe code for the other sort functions is below.\n\n```php\n<?php\n$salary =\
    \ array ('Adam'=>1000, 'Smith'=> 2000, 'Mary'=> 2500, 'Sally'=>1800);\nprint\"\
    The sort using asort() looks like this:<br>\";\nasort($salary);\nforeach($salary\
    \ as $emp => $amount){\nprint\"$emp:$amount<br>\";\n}\nprint\"The sort using arsort()\
    \ looks like this:<br>\";\narsort($salary);\nforeach($salary as $emp => $amount){\n\
    print\"$emp:$amount<br>\";\n}\n?>\n```\n\nThe output is as follows.\n\n![](img/00024.jpeg)\n\
    \nTo sort by keys, we use the last two sort functions listed earlier as follows.\n\
    \n```php\n<?php\n$salary = array ('Adam'=>1000, 'Smith'=> 2000, 'Mary'=> 2500,\
    \ 'Sally'=>1800);\nprint\"The sort using ksort() looks like this:<br>\";\nksort($salary);\n\
    foreach($salary as $emp => $amount){\nprint\"$emp:$amount<br>\";\n}\nprint\"The\
    \ sort using krsort() looks like this:<br>\";\nkrsort($salary);\nforeach($salary\
    \ as $emp => $amount){\nprint\"$emp:$amount<br>\";\n}\n?>\n```\n\nThe output will\
    \ be as follows.\n\n![](img/00025.jpeg)\n\nThe `shuffle()` function randomly reorganizes\
    \ the order of an array.\n\nThe following code can be used to see its working.\n\
    \n```php\n<?php\n$salary = array ('Adam'=>1000, 'Smith'=> 2000, 'Mary'=> 2500,\
    \ 'Sally'=>1800);\nprint\"The shuffle() looks like this:<br>\";\nshuffle($salary);\n\
    foreach($salary as $emp => $amount){\nprint\"$emp:$amount<br>\";\n}\n?>\n```\n\
    \nThe output looks like this.\n\n![](img/00026.jpeg)\n\nIf the code is run again\
    \ another order will be seen. In other words, it shuffles randomly and reorganizes\
    \ the order of an array.\n\n## `explode` 与 `implode`\n\nThere are times when one\
    \ of the following has to be done:\n\n1. Convert an array into a string to pass\
    \ its values to a URL.\n2. Convert an array into a string to store the information\
    \ in a database.\n3. Convert a string into an array to convert comma delimited\
    \ text field into separate parts.\n\nThere are two functions `explode` and `implode`\
    \ to do these above things. Let us look at an example.\n\nIn this example we will\
    \ create two files. One is an HTML file that will send the second file which is\
    \ in PHP a bunch of words to alphabetize. The words will be separated by a coma.\
    \ The separator can be something other than a coma also, say for example just\
    \ empty space.\n\nThe HTML file code looks like this.\n\n```html\n<html><body>Enter\
    \ some words separated by commas. <br><p><form action=\"array.php\" method=\"\
    post\"><input type=\"text\" name=\"words\" size=\"100\"><p><input type=\"submit\"\
    \ name=\"submit\" value=\"Submit\"></form></body></html>\n```\n\nThe webpage will\
    \ look like this.\n\n![](img/00027.jpeg)\n\nThe associated PHP file is as follows:\n\
    \n```php\n<?php\n$words=explode(',',$_POST['words']);\nsort($words);\n$string\
    \ = implode('<br>',$words);\nprint\"<p> The alphabetized version of the list entered\
    \ is:<br> $string<p>\";\n?>\n```\n\nThe output of running this code is as follows.\n\
    \n![](img/00028.jpeg)\n\nThe words are received from the HTML page and then converted\
    \ into an array which is sorted. The sorting done here is without a need to maintain\
    \ a key value association. One may try to other sorts as an experiment.\n\nThen\
    \ a new string is created from the sorted array and the string is then printed.\n\
    \nLet us look at an example of an HTML code below.\n\n```html\n<html><head><title>Price\
    \ Checker</title></head><body><form action=\"array.php\" method=\"post\"> Widget1.<input\
    \ type=\"radio\" name=\"item[]\" value=\"Widget1.\"/>Widget2.<input type=\"radio\"\
    \ name=\"item[]\" value=\"Widget2.\"/>Widget3.<input type=\"radio\" name=\"item[]\"\
    \ value=\"Widget3\"/><p><input type =\"submit\" name=\"submit\" value=\"Send my\
    \ response\"></form></body></html>\n```\n\nThe output of this is as follows.\n\
    \n![](img/00029.jpeg)\n\nThe code is not new. The difference here is the `item[]`\
    \ used in the check box options. This will create an associated array in the PHP\
    \ file being called. The code for the associated PHP file is as follows.\n\n```php\n\
    <?php\nprint\"This is to demonstrate the use of arrays in a form. <p>\";\n$w=$_POST['item'];\n\
    foreach ($w as $item){\nprint\"$item<br>\";\n}\n?>\n```\n\nThe output of the PHP\
    \ file is as follows.\n\n![](img/00030.jpeg)\n\nIn itself the purpose of these\
    \ two codes is to show how an array can be created from a form.\n\n## 多维数组\n\n\
    Lastly, arrays can be multidimensional. These can be simple and naturally some\
    \ can be more complex. The purpose of such an array is to provide more information\
    \ than a standard array.\n\nLet us create a multidimensional array.\n\n`$programming\
    \ =array('C++','Java');`\n\n`$hardware = array('Networking','Security');`\n\n\
    Here we have two arrays one for programming and one for hardware subjects.\n\n\
    Both being books on two different subjects can be kept under a second array called\
    \ books.\n\n`$books = array ( 'Software' =>$programming, 'Hardware' => $hardware);`\n\
    \nThus we have created a multidimensional array.\n\nTo point to an element in\
    \ an array within array is at best the same way as done for a single dimensional\
    \ array by using the index or key number.\n\nSo a command `print \"Print the second\
    \ book in programming is {$books['Software'][1]}\";`\n\nwill print the word Java.\n\
    \nLet us look at the full PHP code.\n\n```php\n<?php\n$programming =array('C++','Java');\n\
    $hardware = array('Networking','Security');\n$books = array (\n  'Software' =>$programming,\
    \ 'Hardware' => $hardware);\nprint \"The second book in programming is {$books['Software'][1]}<p>\"\
    ;\nprint \"The first book in networking is{$books['Hardware'][0]}\";\n?>\n```\n\
    \nThe output will be as follows.\n\n![](img/00031.jpeg)\n\nLet us modify the above\
    \ script to use the `print_r()` seen in the beginning of this chapter or `var_dump()`\
    \ function to print out the entire multidimensional array.\n\nThe code is as follows.\n\
    \n"
