    ![](images/00036.jpeg)


    ![](images/00037.jpeg)


    ![](images/00038.jpeg)


    So the duration of this cookie is 60 seconds from the current time. If 1 hour
    is needed then it will be `time() + 3600` and so forth. The number `0` for secure
    means that cookie is not send over a secure connection. The alternative is `1`
    for HTTPS connection.


    After 60 seconds or 1 minute if the cookie is read using the `$_COOKIE[''color'']`
    option no value will be found. An error message will be displayed.


    To delete a cookie the `setcookie()` can be used in the following manner.


    ```php

    setcookie(''cookiename'','' '');

    ```


    ```php

    setcookie(''cookiename'', '' '', time()-60);

    ```


    which is like stating an expiration date in the past.


    Let us look at this code.


    ```php

    <?php$cookies=false;if(isset($_POST[''submit''])){setcookie(''color'',$_POST[''color''],
    time()+60,'' '','' '',0);$cookies=true;}?><html><head><title>Cookie Example</title></head><body><form
    action="cookie.php" method="post"> Yellow<input type="radio" name="color" value="Yellow"/>Red<input
