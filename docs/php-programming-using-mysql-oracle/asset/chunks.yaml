    \ requires down loaders of their products to register. This is a free profile\
    \ registration.\n\nThe next screen if one clicks see all will look like this.\
    \ One needs to accept the license before downloading the appropriate software.\
    \ Once the files are downloaded make sure there is internet connection on the\
    \ computer before preparing to install the software.\n\n![oracle3.jpg](images/00063.jpeg)\n\
    \nInstallation of the windows based express edition of Oracle release 11.2 looks\
    \ similar to the following screen shots. Make sure to write down the details of\
    \ each screen.\n\n![inst.jpg](images/00064.jpeg)"
  fmt: "\n进入`/path/to/xxx`目录，找到`xxx.json`。\n\n在表达式`cvar = avar + bvar`中，加法运算符（`+`）将`avar`与`bvar`相加，得到它们的和`cvar`\n\
    \n在`List.of(arg0, arg1, arg2)`中，`List`接口的工厂方法`of()`接受一系列的元素，返回包含它们的只读列表。\n\n之后我们这样调用`cmd`命令：`cmd\
    \ arg0 arg1 arg2`。\n\n```\nif (condVar > someVal) {console.log(\"xxx\")}\n```\n\
    \n```\n<html><body><?phpif (isset($_POST['submit'])){$pattern = $_POST['pattern'];print\
    \ $pattern;$zipcode = $_POST['zipcode'];print $zipcode;if (eregi($pattern,$zipcode)){print\"\
    The zipcode is a five-digit number\";} else { print\"The zipcode is not a five-digit\
    \ number\";}}?><form action=\"expression.php\" method=\"post\">pattern:<input\
    \ type=text= name=\"pattern\" size =\"20\"><p>zipcode:<input type=text= name=\"\
    zipcode\" size =\"20\"><p><input type=submit name=\"submit\" value=\"Check zipcode\"\
    ><p></form></body></html>\n```\n\nNow if the pattern is entered as `^(\\[0-9\\\
    ]{5})` which stands for the five digit zip code then enter a number it will be\
    \ give a positive answer if the numbers match or if it does not then a negative\
    \ number will be given.\n\nModify the code and see if the pattern is `^ http://www.`\
    \ and enter an URL to compare the pattern against. Note that the error messages\
    \ and input boxes will have to modified to pass on the correct information.\n\n\
    ## PHP 7\n\nIn the new version of PHP\n\n`eregi()` and `ereg()` function(s) replaced\
    \ by `preg_match()`.\n\n`ereg_replace()` replaced by `preg_replace()`\n\n`split()`\
    \ replaced by `preg_split()`\n\nLet us look at some examples.\n\n```\n<?php\n\
    // The \"i\" after the pattern delimiter indicates a case-insensitive search\n\
    if (preg_match(\"/php is easy./i\", \"PHP is easy.\")) {\n    echo \"A match was\
    \ found.\";\n} else {\n    echo \"A match was not found.\";\n}\n?>\n```\n\n```\n\
    <?php\n/* The \\b in the pattern indicates a word boundary, so only the distinct\n\
    * word \"fun\" is matched, and not a word partial like \"have\".\n*/\nif (preg_match(\"\
    /\\bhave\\b/i\", \"We are having fun with PHP.\")) {\n    echo \"A match was found.\"\
    ;\n} else {\n    echo \"A match was not found.\";\n}\n```\n\n```\n<?php\n// get\
    \ host name from URL\npreg_match('@^(?:http://)?([^/]+)@i',\n    \"http://www.xyz.com/index.html\"\
    , $matches);\n$host = $matches[1];\nprint $host;\n?>\n```\n\nThis will print `www.xyz.com`.\n\
    \n# Appendix I. Workshop\n\nThe end of any book in programming is only as good\
    \ as the understanding derived from it. The following questions are examples of\
    \ knowledge that should have been obtained from this book or from similar ones.\n\
    \n1. Name any two functions to print a message in PHP?\n\nAnswer: `echo()`, `print()`;\n\
    \n2. How can an external file be included in a PHP program?\n\nAnswer: The function\
    \ `include()` or `require()` can be used to include an external file. The difference\
    \ is in the way `include()` function can give error messages while continuing\
    \ to run the code but `require()` will terminate the program upon encountering\
    \ any errors.\n\n3. What is the difference between GET and POST methods of transferring\
    \ data?\n\nAnswer: `GET` is used to transfer small amounts of data and this data\
    \ will be visible during transfer. `POST` does not display the values being send\
    \ to the PHP program.\n\n4. How are arrays declared in PHP?\n\nAnswer: `$fruit\
    \ = array('apple', 'grape', 'lemon');`\n\n5. Which function will give the number\
    \ of elements of an array?\n\nAnswer: `count()`. As in `count($array);`\n\n6.\
    \ What is the difference between a session and a cookie?\n\nAnswer: Sessions are\
    \ stored in the server and cookies are stored in the client machines. Cookies\
    \ have expiration time. Sessions are closed when the browser is closed. Users\
    \ do not have access to data stored in the session.\n\n7. How are cookies created\
    \ and read?\n\nAnswer: A cookie is created by using the `setcookie()` function\
    \ and retrieved using the `$_COOKIE['cookie name']` function. Within the `setcookie()`\
    \ function the name of the cookie, value and duration should be included.\n\n\
    8. Name different ways to write a loop in PHP.\n\nAnswer: While, For and do..while.\n\
    \n9. What is the first step in trying to connect to MySQL database using PHP?\n\
    \nAnswer: Connection to MySQL. Then the database.\n\n10. What is the function\
    \ of `explode()`?\n\nAnswer: Explode splits a string into an array by string.\n\
    \n11. What is the role of `trim()`?\n\nAnswer: Removes whitespaces from both ends\
    \ of a string.\n\n12. How can a user be redirected to another webpage?\n\nAnswer:\
    \ Use the `header` function.\n\n13. How to find the length of a string?\n\nAnswer:\
    \ Use the `strlen()` function.\n\n14. An array with a string key is called ______________.\n\
    \nAnswer: Associative array.\n\n15. Which function can be used to check if a form\
    \ has been submitted in a PHP program?\n\nAnswer: `isset()` used with an if statement.\n\
    \n16. How to send mail in PHP?\n\nAnswer: Use the `mail()` function - `mail($to,$subject,$message,$headers);`\n\
    \n17. Name any one encryption function that can be used in PHP.\n\nAnswer: `MD5`.\n\
    \n18. What is meant by the term pear?\n\nAnswer: `PEAR` is a framework and distribution\
    \ system for reusable PHP components. The project seeks to provide a structured\
    \ library of code, maintain a system for distributing code and for managing code\
    \ packages, and promote a standard coding style. `PEAR` is broken into three classes:\
    \ PEAR Core Components, PEAR Packages, and PECL Packages.\n\n19. What is the difference\
    \ between PHP and Javascript?\n\nAnswer: PHP is server based while Javascript\
    \ is client based.\n\n20. Which extension needs to be activated to use PHP with\
    \ Oracle?\n\nAnswer: `oci8` extension in the PHP configuration file needs to be\
    \ uncommented.\n\n# Practical Workshop\n\n1. Create a table named `staff` under\
    \ the user `HR` in an Oracle database. It should have six columns - `id`, `name`,\
    \ `job`, `manager`, `salary` and `location`. All the variables are text or varchar2\
    \ except for salary which is a number. The primary key is `id`.\n\nUsing PHP insert\
    \ any six rows of values to this table.\n\n2. Using PHP display all rows whose\
    \ salary is greater than 1000.\n\n3. Write a program that will read an array of\
    \ numbers and puts them in an ascending order.\n\n4. Develop a PHP page that will\
    \ save the page preferences of the user and allow him to use the page for about\
    \ fifteen minutes.\n\n5. Develop a PHP webpage that allows one to enter a postal\
    \ code, telephone number and country code in three letters based on the American,\
    \ Canadian, European and any Asian format. The program must be able to give appropriate\
    \ messages to guide the user.\n\n# Appendix II. Installing Oracle Database\n\n\
    Check all your applications and see if Oracle is installed. On a windows machine\
    \ we look as usual from the start button onto the applications or programs. Expand\
    \ any oracle installation and find the SQL plus option.\n\nIf Oracle is not one\
    \ of your applications, then go to `www.oracle.com` and download section and based\
    \ on your Windows or Linux details download the appropriate version for your computer.\
    \ At the time of writing this book the only express version was 11G version 2.\n\
    \nIf one has any older version such Oracle 10 Express or Oracle 9i the codes in\
    \ this book will also work. Installing the newer version is not required for the\
    \ content of this book.\n\nPlease note that internet connection will be required\
    \ to complete the registration and installation of the Oracle download.\n\nAfter\
    \ installation and registration, the internet connection will not be required\
    \ for operating the database. At the time of writing this book the oracle website\
    \ looked like this.\n\n![oracle.jpg](images/00061.jpeg)\n\nFollow the downloads\
    \ to database and then to oracle database. The following screen will come up.\n\
    \n![oracle2.jpg](images/00062.jpeg)\n\nNotice that there are two versions for\
    \ windows. Choose the one that is relevant to your machine. Make sure both files\
    \ are downloaded.\n\nClick on see all for more details. Oracle requires down loaders\
    \ of their products to register. This is a free profile registration.\n\nThe next\
    \ screen if one clicks see all will look like this. One needs to accept the license\
    \ before downloading the appropriate software. Once the files are downloaded make\
    \ sure there is internet connection on the computer before preparing to install\
    \ the software.\n\n![oracle3.jpg](images/00063.jpeg)\n\nInstallation of the windows\
    \ based express edition of Oracle release 11.2 looks similar to the following\
    \ screen shots. Make sure to write down the details of each screen.\n\n![inst.jpg](images/00064.jpeg)\n"
  trans: "\n\n进入`/path/to/xxx`目录，找到`xxx.json`。\n\n在表达式`cvar = avar + bvar`中，加法运算符（`+`）将`avar`与`bvar`相加，得到它们的和`cvar`\n\
    \n在`List.of(arg0, arg1, arg2)`中，`List`接口的工厂方法`of()`接受一系列的元素，返回包含它们的只读列表。\n\n之后我们这样调用`cmd`命令：`cmd\
    \ arg0 arg1 arg2`。\n\n```\nif (condVar > someVal) {console.log(\"xxx\")}\n```\n\
    \n```\n<html><body><?phpif (isset($_POST['submit'])){$pattern = $_POST['pattern'];print\
    \ $pattern;$zipcode = $_POST['zipcode'];print $zipcode;if (eregi($pattern,$zipcode)){print\"\
    The zipcode is a five-digit number\";} else { print\"The zipcode is not a five-digit\
    \ number\";}}?><form action=\"expression.php\" method=\"post\">pattern:<input\
    \ type=text= name=\"pattern\" size =\"20\"><p>zipcode:<input type=text= name=\"\
    zipcode\" size =\"20\"><p><input type=submit name=\"submit\" value=\"Check zipcode\"\
    ><p></form></body></html>\n```\n\n现在如果模式输入为 `^(\\[0-9\\]{5})` 它代表五位邮政编码，然后输入一个数字，如果数字匹配则会给出肯定的答案，如果不匹配则会给出否定的答案。\n\
    \n修改代码并查看模式是否为 `^ http://www.` 并输入一个 URL 与模式进行比较。请注意，错误消息和输入框将需要修改以传递正确的信息。\n\n\
    ## PHP 7\n\n在 PHP 的新版本中\n\n`eregi()` 和 `ereg()` 函数被 `preg_match()` 替换。\n\n`ereg_replace()`\
    \ 被 `preg_replace()` 替换\n\n`split()` 被 `preg_split()` 替换\n\n让我们看一些例子。\n\n```\n\
    <?php\n// The \"i\" after the pattern delimiter indicates a case-insensitive search\n\
    if (preg_match(\"/php is easy./i\", \"PHP is easy.\")) {\n    echo \"A match was\
    \ found.\";\n} else {\n    echo \"A match was not found.\";\n}\n?>\n```\n\n```\n\
    <?php\n/* The \\b in the pattern indicates a word boundary, so only the distinct\n\
    * word \"fun\" is matched, and not a word partial like \"have\".\n*/\nif (preg_match(\"\
    /\\bhave\\b/i\", \"We are having fun with PHP.\")) {\n    echo \"A match was found.\"\
    ;\n} else {\n    echo \"A match was not found.\";\n}\n```\n\n```\n<?php\n// get\
    \ host name from URL\npreg_match('@^(?:http://)?([^/]+)@i',\n    \"http://www.xyz.com/index.html\"\
    , $matches);\n$host = $matches[1];\nprint $host;\n?>\n```\n\n这将打印 `www.xyz.com`。\n\
    \n# 附录 I. 研讨会\n\n任何编程书籍的结尾好坏取决于从中获得的理解程度。以下问题是应从本书或类似书籍中获得的知识示例。\n\n1. 命名 PHP\
    \ 中打印消息的任意两个函数？\n\n答案：`echo()`，`print()`；\n\n2. 如何在一个 PHP 程序中包含外部文件？\n\n答案：可以使用\
    \ `include()` 或 `require()` 函数来包含外部文件。区别在于 `include()` 函数可以在继续运行代码的同时给出错误消息，而\
    \ `require()` 在遇到任何错误时会终止程序。\n\n3. GET 和 POST 传输数据方式有什么区别？\n\n答案：`GET` 用于传输少量数据，且此数据在传输过程中可见。`POST`\
    \ 不会显示发送到 PHP 程序的值。\n\n4. PHP 中如何声明数组？\n\n答案：`$fruit = array('apple', 'grape',\
    \ 'lemon');`\n\n5. 哪个函数会给出数组的元素数量？\n\n答案：`count()`。例如 `count($array);`\n\n6. 会话和\
    \ cookie 有什么区别？\n\n答案：会话存储在服务器中，cookie 存储在客户端机器中。Cookie 有过期时间。会话在浏览器关闭时结束。用户无法访问存储在会话中的数据。\n\
    \n7. 如何创建和读取 cookie？\n\n答案：cookie 是通过使用 `setcookie()` 函数创建的，并使用 `$_COOKIE['cookie\
    \ name']` 函数检索。在 `setcookie()` 函数中应包含 cookie 的名称、值和持续时间。\n\n8. 在 PHP 中编写循环的不同方式有哪些？\n\
    \n答案：While、For 和 do..while。\n\n9. 使用 PHP 尝试连接 MySQL 数据库的第一步是什么？\n\n答案：连接到 MySQL。然后是数据库。\n\
    \n10. `explode()` 的功能是什么？\n\n答案：Explode 通过字符串将字符串拆分为数组。\n\n11. `trim()` 的作用是什么？\n\
    \n答案：从字符串的两端删除空白字符。\n\n12. 如何将用户重定向到另一个网页？\n\n答案：使用 `header` 函数。\n\n13. 如何找到字符串的长度？\n\
    \n答案：使用 `strlen()` 函数。\n\n14. 具有字符串键的数组称为 ______________。\n\n答案：关联数组。\n\n15. 哪个函数可用于检查表单是否已在\
    \ PHP 程序中提交？\n\n答案：`isset()` 与 if 语句一起使用。\n\n16. 如何在 PHP 中发送邮件？\n\n答案：使用 `mail()`\
    \ 函数 - `mail($to,$subject,$message,$headers);`\n\n17. 命名可在 PHP 中使用的任何一种加密函数。\n\
    \n答案：`MD5`。\n\n18. 术语 pear 的含义是什么？\n\n答案：`PEAR` 是一个用于可重用 PHP 组件的框架和分发系统。该项目旨在提供结构化的代码库，维护代码分发系统和管理代码包，并推广标准的编码风格。`PEAR`\
    \ 分为三个类别：PEAR 核心组件、PEAR 包和 PECL 包。\n\n19. PHP 和 Javascript 有什么区别？\n\n答案：PHP 基于服务器，而\
    \ Javascript 基于客户端。\n\n20. 使用 PHP 与 Oracle 需要激活哪个扩展？\n\n答案：需要在 PHP 配置文件中取消注释 `oci8`\
    \ 扩展。\n\n# 实践研讨会\n\n1. 在 Oracle 数据库中以用户 `HR` 创建一个名为 `staff` 的表。它应有六列 - `id`、`name`、`job`、`manager`、`salary`\
    \ 和 `location`。所有变量都是文本或 varchar2，除了 salary 是数字。主键是 `id`。\n\n使用 PHP 向此表插入任意六行值。\n\
    \n2. 使用 PHP 显示 salary 大于 1000 的所有行。\n\n3. 编写一个程序读取一组数字并按升序排列它们。\n\n4. 开发一个 PHP\
    \ 页面，可保存用户的页面偏好设置并允许他在大约十五分钟内使用该页面。\n\n5. 开发一个 PHP 网页，允许用户输入邮政编码、电话号码和基于美国、加拿大、欧洲和任何亚洲格式的三字母国家代码。该程序必须能够给出适当的提示信息来指导用户。\n\
    \n# 附录 II. 安装 Oracle 数据库\n\n检查所有应用程序并查看是否已安装 Oracle。在 Windows 机器上，我们通常从开始按钮查看应用程序或程序。展开任何\
    \ oracle 安装并找到 SQL plus 选项。\n\n如果 Oracle 不是您的应用程序之一，则转到 `www.oracle.com` 并下载部分，根据您的\
    \ Windows 或 Linux 详细信息下载适合您计算机的适当版本。在撰写本书时，唯一的 express 版本是 11G 版本 2。\n\n如果有人有任何较旧版本，如\
    \ Oracle 10 Express 或 Oracle 9i，本书中的代码也适用。安装更新版本对于本书内容不是必需的。\n\n请注意，完成 Oracle\
    \ 下载的注册和安装需要互联网连接。\n\n安装和注册后，操作数据库时不需要互联网连接。在撰写本书时，oracle 网站看起来像这样。\n\n![oracle.jpg](img/00061.jpeg)\n\
    \n按照下载到数据库然后到 oracle 数据库的步骤。会出现以下屏幕。\n\n![oracle2.jpg](img/00062.jpeg)\n\n请注意，Windows\
    \ 有两个版本。选择与您的机器相关的版本。确保两个文件都已下载。\n\n点击查看全部以获取更多详细信息。Oracle 要求其产品的下载者注册。这是一个免费的个人资料注册。\n\
    \n如果点击查看全部，下一个屏幕将如下所示。在下载适当软件之前，需要接受许可。一旦文件下载完成，请确保在准备安装软件之前计算机上有互联网连接。\n\n![oracle3.jpg](img/00063.jpeg)\n\
    \nWindows 版 Oracle release 11.2 express 版的安装看起来与以下屏幕截图类似。请确保记录每个屏幕的详细信息。\n\n![inst.jpg](img/00064.jpeg)\n\
    \n"
