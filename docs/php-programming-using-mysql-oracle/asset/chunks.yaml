    # Chapter 10. Regular Expressions


    Regular expressions are found in all programming languages to take into consideration
    the format of some inputs. For example, the postal code or zip code in many countries
    are not in the same format as in the United States.


    PHP supports two types of regular expressions - POSIX extended and PCRE which
    is Pearl compatible. Note: The information below is applicable PHP version 5 only.
    Even in version 5 some versions will not accept the functions below. Functions
    in PHP 7 are shown at the end of this chapter.


    POSIX has six functions in PHP and they are:


    ereg() - Match a pattern and is case sensisitive.


    eregi() - Match a pattern and is not case sensitive.


    ereg\_replace() - Matches and replaces a pattern and is case sensitive.


    eregi\_replace() - Matches and replaces a pattern and is not case sensitive.


    split() - Splits a string using a pattern and is case sensitive.


    spliti() - Splits a string using a pattern and is not case sensitive.


    Metacharacters help to create patterns to test the input string against.


    .    is a period meaning any single character?


    ^   is a caret which means beginning of a string.


    $   means end of a string.


    |   means alternatives (or).


    () means group.


    Quantifiers:


    ?  - zero or one occurences.


    \* - zero or more occurences.


    \+ - One or more occurences.


    {x} - Exactly x occurences.


    {x , y} - Between x and y occurences (both are inclusive)


    {x, } - At least  x occurences.


    Character classes:


    \[a-z\] - any lowercase letter.


    \[a-z A-Z\] - any letter.


    \[0-9\] - any number.


    \[\\f\\r\\t\\n\\v\] - any white space.


    \[aeiou\] - any vowel.


    \[\[:alnum:\]\] - any letter or number.


    \[\[:alpha:\]\] - any letter (same as \[a-zA-Z\])


    \[\[:blank:\]\] - any tabs or spaces.


    \[\[:digit:\]\] - any number.


    \[\[:lower:\]\] - any lowercase letter.


    \[\[:upper:\]\] - any uppercase letter.


    \[\[:punct:\]\] - any punctuation character.


    \[\[:space:\]\] - any white space.


    A literal is a value that is written exactly as it is interpreted. For example,
    the letter "b" matches the letter b.


    Now let us write a program that will match the input against a five-digit postal
    code. The postal code consists of only numbers.'
