  trans: "\n\n现在让我们创建一个 PHP 程序，它将打印名为 John 的人的姓名和地址。\n\n```\n<html><head> <title>Address</title></head><body><?php$name\
    \ = \"John\";$street= \"101, Orchard Lane\";$city =\"Columbia\";$state =\"SC\"\
    ;$zip =29208;print \"The address of $name  |\n```\n\n结果将在附加到所使用的 PHP 编辑器的浏览器中显示。在本书的情况下，使用了\
    \ EasyPHP (`http://www.easyphp.org`) 编辑器，使用该编辑器的输出如下：\n\n# ![](img/00003.jpeg)\n\
    \n# \n\n脚本的位置会根据编辑器而有所不同。即使在 EasyPHP 编辑器中，也可以在旧版本（12 到 14）的 projects 文件夹下运行此脚本，或在版本\
    \ 17 中使用 `eds-www` 文件夹。\n\n如果出现错误，而且有时会发生——请阅读错误消息，返回记事本或编辑器中编写的代码，并在错误消息中给出的行号附近更正代码。\n\
    \n单引号意味着其中的内容应被原样对待。双引号意味着应采用引号内内容的数值。\n\n例如：\n\n`$name = 'John'` 和 `$name = \"\
    John\"` 会给出相同的结果。\n\n但 \n\n`$name = \"$firstname\"` 和 `$name ='$firstname'` 会给出两个结果。\n\
    \n`firstname` 的值为 John 和 `$firstname`。\n\n可以像这样将一个变量的值赋给另一个变量：\n\n`$name =$firstname;`\n\
    \n最好使用双引号，并且本书其余部分将使用双引号。除了 `print` 函数外，还有另一个名为 `echo()` 的函数，它会将结果或消息打印到屏幕上。\n\
    \n如果使用的是 EasyPHP 编辑器版本（17），其中包含 PHP 7 和 PHP 5.6，则界面将如下所示。\n\n![](img/00004.jpeg)\n\
    \n上面的两个选项用于启动 apache 服务器。HTTP 服务器下的设置图标将允许在这种情况下仅通过从下拉菜单中选择版本并单击重启来在 PHP 5.6 和\
    \ PHP 7.1.3 之间切换。\n\n在撰写本书时，大多数托管网站——尤其是低成本和免费的网站——其服务器上仍使用 PHP 版本 5。本书将显示两个版本的输出并突出显示新版本\
    \ PHP 中有显著变化的地方。\n\n除非另有说明，本书中看到的代码将适用于旧版和新版 PHP。\n\n# Chapter 2. HTML and PHP\
    \ Form\n\nHTML 是充分利用 PHP 所必需的。PHP 程序可以包含 HTML，而 HTML 脚本可以嵌入 PHP。\n\n本章的第一个脚本将请求一个人的姓名和电话号码。表单将有一个输入姓名和电话号码的框，以及一些单选按钮来选择姓名的称谓。\n\
    \n其工作原理如下：\n\nHTML 表单/页面要求用户输入数据。然后它要求服务器上的 PHP 脚本处理数据请求，最终数据将被添加到数据库中。\n\nHTML\
    \ 或网页在数据处理方面与服务器交互的能力有限。它使用 `<form action = </form>` 方法将此任务转移。\n\n现在让我们首先为 html\
    \ 网页编写 html 代码。\n\n```\n<html><head><title>Feedback form</title></head><body><form\
    \ action=\"feedback.php\"> Mr.<input type=\"radio\" name=\"title\" value=\"Mr.\"\
    />Mrs.<input type=\"radio\" name=\"title\" value=\"Mrs.\"/>Ms.<input type=\"radio\"\
    \ name=\"title\" value=\"Ms.\"/><br>Please complete the feedback form</p><p>Name:\
    \ <input type=\"text\" name=\"name\" size=\"20\"><p>Phone:<input type=\"text\"\
    \ name=\"name\" size=\"20\"><p><input type =\"submit\" name=\"submit\" value=\"\
    Send my response\"></form></body></html>\n```\n\n此 HTML 文件的输出如下：请注意，`feedback.html`\
    \ 文件及其关联的 `feedback.php` 文件保存在同一位置。然而，这不是必需的。如果文件位于不同的文件夹中，则必须在 `<form action\
    \ >` 语句中包含 PHP 文件的路径。\n\n![](img/00005.jpeg)\n\n因此反馈 html 文件有三个部分——称谓选择、姓名和电话。`<form\
    \ action>` 语句说明此文件将连接到脚本文件以进行进一步处理。`<form action>` 由 `</form>` 关闭。现在这个 html 文件将数据传输到\
    \ PHP 文件——PHP 文件必须能够捕获正在传输的数据。\n\n观察 `<form action>` 语句。它缺少一个方法。有两种方法——`get` 和\
    \ `post`。这两种方法有什么区别？\n\nGET 方法将收集到的所有数据作为 URL 的一部分发送。POST 方法则隐式传输数据。因此选择 GET 方法可能会使某些重要信息在单击提交按钮时变得可见。GET\
    \ 方法传输的数据量也有限制。\n\n从 `feedback.html` 文件的传输方法将为 POST。必须对上一页的 feeback.html 代码进行以下更改。\n\
    \n`<form action =\"feedback.php\" method=\"post\">`\n\n以下是 `feedback.php` 文件的代码：\n\
    \n```\n<?php$title=$_POST['title'];$name=$_POST['name'];$phone=$_POST['phone'];print\"\
    Thank you,$title $name for your feedback.\";print\"<p> Your phonenumber,$phone\
    \ has been added to our database.\";?>\n```\n\n请注意，在上面的 `feedback.php` 文件中，应该有接收变量来接收从\
    \ `feedback.html` 文件发送的值。\n\n在上述情况下，变量名与接收到的数据相同，但这不是必需的。字段的名称可以是 x、y 或 z。\n\n\
    请注意，`feedback.php` 没有 HTML 代码。此代码可以按如下方式修改以包含 HTML 代码。\n\n```\n<html><head><title>Feedback</title></head><body><?php$title=$_POST['title'];$name=$_POST['name'];$phone=$_POST['phone'];print\"\
    Thank you,$title $name for your feedback.\";print\"<p> Your phonenumber,$phone\
    \ has been added to our database.\";?></body></html>\n```\n\n可以使用更高级的 HTML 来创建更具吸引力的响应页面。但我们这里的重点是\
    \ PHP 代码。\n\n请注意，HTML 代码可以包含在 `print` 函数中，并且在高级 PHP 脚本中通常会动态使用 HTML。\n\n`feedback.php`\
    \ 文件的输出如下：\n\n# ![](img/00006.jpeg)\n\n# 如果在 `feedback.html` 文件中使用 get 方法将数据传输到\
    \ `feedback.php` 表单，则检索数据时应使用 `$_GET['fieldname']` 方法。PHP 4.1 之前的旧版本曾使用 `$HTTP_POST_VARS`\
    \ 和 `$HTTP_GET_VARS`。\n\n现在让我们再看一个 HTML 文件。此 HTML 页面将请求供应商的三个不同商品的价格、数量、折扣和不幸的是税费。让我们将这些不同的商品称为\
    \ `widget1`、`widget2` 和 `widget3`。HTML 代码如下所示：\n\n```\n<html><head><title>Price\
    \ Checker</title></head><body><form action=\"price.php\" method=\"post\"> Widget1.<input\
    \ type=\"radio\" name=\"item\" value=\"Widget1.\"/>Widget2.<input type=\"radio\"\
    \ name=\"item\" value=\"Widget2.\"/>Widget3.<input type=\"radio\" name=\"item\"\
    \ value=\"Widget3\"/><p>Quantity: <input type=\"text\" name=\"quantity\" size=\"\
    20\"><p>Price:<input type=\"text\" name=\"price\" size=\"20\"><p>Discount:<input\
    \ type=\"text\" name=\"discount\" size=\"20\"><p>Tax:<input type=\"text\" name=\"\
    tax\" size=\"20\"><input type =\"submit\" name=\"submit\" value=\"Send my response\"\
    ></form> </body></html>\n```\n\n关联的 php 文件名为 `price.php`，如下所示：\n\n```\n<?php$item=$_POST['item'];$quantity=$_POST['quantity'];$price=$_POST['price'];$discount=$_POST['discount'];$tax=$_POST['tax'];$tax\
