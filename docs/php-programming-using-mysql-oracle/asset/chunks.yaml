    Send the choice\"></form></body></html>\n```\n\n上面的 HTML 页面将提供一个名为 `choice` 的下拉选择选项。Choice\
    \ 将有两个选项。Item 1 和 Item 2。在更详细的示例中可以给出更具描述性的名称或选项。\n\n目前，网页将允许用户选择两个选择之一并单击提交按钮。\n\
