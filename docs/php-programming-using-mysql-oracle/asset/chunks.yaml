    # Appendix III. PHP with Oracle


    To make changes to the EasyPHP WAMP click on the E icon on the desktop and choose
    configuration and PHP. This is for version 12 -14 using PHP 5 to 5.6.


    ![](images/00071.jpeg)


    This will open the PHP configuartion file. Go to the line


    ![](images/00072.jpeg)


    which says `extension=php_oci8_11g.dll` and uncomment it. That is remove the `;`
    in front of it. Note the previous line should be left as is. This is because we
    are activating the extension of oci8 for 11g express version. Save the file with
    file save and then restart the machine or EasyPHP editor and that is it. If PHP
    has been installed separately then the PHP.ini configuration file and to the same
    above after a backup of any original file is made.


    Confirm with any administrator if the computer is not a standalone before making
    changes to any configuration files. Check Appendix IV for PHP 7.


    ## Appendix IV. Easy PHP interface


    In this section we look at the different features or interfaces of the editor
    used to write programs in this book. The editor is Easy PHP and it can be downloaded
    from http://www.easyphp.org.


    ![](images/00073.jpeg)


    The interface can be obtained after installing the latest version of EasyPHP editor.
    Upto version 17 there is no need for an internet connection to complete the installation.
    Once the icon shortcut appears on the desktop right click and choose open. As
    the "E" icon appears on the navigation bar at the bottom of the screen right click
    and choose open dashboard. This will lead to the interface above.


    To start using the editor click on start HTTP server and if database is required
    then click on start Database Server. Note that the default version of PHP in version
    17 is 5.6 and so if that is not what is needed choose change settings under the
    HTTP server. This is the third button after the red one. Choose version 7 and
    click ok.


    The portable directory is where the scripts are and it is from here the PHP scripts
    have to be run. The files are located in the `eds-www` directory under c drive
    or the drive chosen under EasyPHP. Use a notepad to write the PHP programs and
    keep it in this directory. It will appear under portable directory.


    The MySQL administration allows one to bring up the PHPMyadmin to create databases
    and or tables. The entire administration of the MySQL database is done from here.


    There is no direct access to other databases such as Oracle from this interface.
    Perhaps in later versions of the editor there might be. To activate the OCI8 feature
    for connection to Oracle it is important to find the PHP.ini file. There will
    two of them in this version of the editor as there are two versions of PHP associated
    with it. Find the PHP.ini file for the version you want and to do this go the
    installation folder of EasyPHP. On the computer used for this book it was located
    at:


    `C:\\Program Files (x86)\\EasyPHP-Devserver-17\\eds-binaries\\php`


    for the version 7 and version 5. Choose the folder for the version of PHP you
    want and then find the PHP.ini file and uncomment `remove ;` the line dealing
    with OCI8 dll. If there are two lines, then uncomment the one associated with
    Oracle express version if that is the version of the database installed on the
    computer being used.


    The default version of the PHP on this editor `version 7` is PHP 5.6. There is
    an online quick editor that can be used to paste code and test.


    ![](images/00074.jpeg)


    This is pretty hand for those who are new to PHP or for those who do not like
    to create files in notepad etc.


    Just keep in mind so far this online editor is for version 5.6 and one can be
    sure in newer versions of this editor in the future one cans see more up to date
    online editors.


