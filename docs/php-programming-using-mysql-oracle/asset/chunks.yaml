    installation. The code for this book was developed using the WAMP editor EasyPHP
    and this has several versions. It is not required to have the latest but the minimum
    version of this editor that will run the code in this book is that runs PHP 5
    and above. The configuration change required to connect to Oracle using editor
    or a similar one is shown in Appendix III and IV.


    It is very important to write down the default values of the Oracle installation.
    In the example(s) of this chapter the database installed by default is called
    `orcl`. The `hr` user and tables associated with that user is going to be used.


    Let us create a table called `employee` in the oracle database under the `hr`
    user with password `hr`. To do this use the SQL plus interface from the apps menu
    in windows under Oracle. The interface will look like this. If the `hr` account
    is locked , login as the `sysdba` and use the following - `alter user hr account
    unlock;` and then connect to `hr`.


    ![](images/00059.jpeg)


    To create the employee table, use the following command:


    ```

    create table employee (sid varchar2(10), name varchar2(50), manager varchar2(10)
    constraint sid_pk primary key = (sid));

    ```


    This will create the employee table with `sid` as the primary key. For the purpose
    of this book this simple table will be sufficient. My book on SQL might be helpful
    if SQL associated with Oracle is new to you.


    If the changes to `PHP.ini` (configuration file) as discussed in Appendix III
    and IV has been done and saved, then it is time to get to the PHP connecters for
    Oracle. PHP program is being connected to the Oracle database using the PHP `OCI8`
    extension.


    This extension at the time of writing this book can be used to Oracle 12,11, 10
    and 9 databases. PHP by itself is independent of the Oracle database.


    To connect to the database the OCI8 PHP class library provides the following functions
    `oci_connect()`, `oci_pconnect()` and `oci_new_connect()`. If a non persistent
    connection is required then use `oci_connect()`. This is also cached. This improves
    efficiency of connection.


    The cache used by `oci_connect` is removed after the script has been run or when
    the connection resource has been closed.


    The `oci_new_connect` is not cached while the `oci_pconnect()` is cached and can
    be used across requests. An `oci_close()` function is required with any of the
    three functions mentioned thus far.


    After creating the employee table above using the create statement. The values
    have to be inserted.


    The easiest way is using the insert statement as follows:


    ```

    insert into employee values(''101'',''Albert'',''103'');

    ```


    and similarly the other three rows of data as shown in the picture in the previous
    page.


    After Oracle has been installed find the `tnsnames.ora` file which is usually
    in the `network/admin/` folder. This file will give the `sid` value of the database.
    The default is `orcl` as mentioned earlier in this chapter. The usual port is
    `1521` and host will be local The host if it is the installation of Oracle 11.2
    express on a standalone computer or notebook.


    The `oci_connect()` function has three parts- username, password and connection_string.


    The username since we are connecting to a table under `hr` user is `hr` and password
    is `hr` and connection string is `orcl`- the sid name or name of database.


    Make sure the sid name is exactly like it is stated in the `tnsmames.ora` file.


    The `oci_parse()` is used to parse a query.


    The `oci_execute()` is used to execute a statement.


    `oci_fetch_array()` is used to fetch the next row from a query in array format.


    Lastly `oci_close()` will close the connection to the database.


    It might be noticed all these steps are similar to the way PHP connects to MySQL
    database. Now let us look at the following code.


    ```

    <?php

    $db = oci_connect(''hr'', ''hr'', ''orcl'');

    if (!$db) {trigger_error(''Unable to connect to database'', E_USER_ERROR);}

    $sql = ''select * from employee'';

    $stmt = oci_parse($db, $sql);

    oci_execute($stmt);

    $count = 0;

    print"<table border=1>";

    while (($row = oci_fetch_array($stmt,OCI_BOTH)) != false) {

    print "<tr><td>".$row[''0'']."</td>"."<td>".$row[''1'']."</td>"."<td>".$row[''2'']."</td></tr>";

    $count++;

    }

    print"</table>";

    print $count . '' record(s) found.'';

    oci_free_statement($stmt);

    ```


    ```

    oci_close($db);?></body></html>

    ```


