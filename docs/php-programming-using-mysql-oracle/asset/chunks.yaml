    ![](images/00047.jpeg)


    ### Creating a directory


    Creating a directory in PHP is done using the `mkdir` function. The format for
    this function is as follows:


    `mkdir(''directory-name'', permissions);`


    Permissions are ignored on Windows based servers. Please note the policy of the
    web host before creating directories or using files for storing and retrieving
    data.


    It is my strong opinion that these functions in a professional setting be done
    using a database.


    Let us create a code that will ask for the directory name and file name to be
    created and then put some text in the file in that directory. The code for that
    is as follows:


    ```

    <html><body><?phpif(isset($_POST[''submit''])){$dirname=trim($_POST[''dirname'']);mkdir("$dirname",0777);$filename=trim($_POST[''filename'']);$data=trim($_POST[''data'']);if($fx
    = fopen("C:\\Program Files (x86)\\EasyPHP-DevServer-14.1VC9\\data\\localweb\\scripts/$dirname/$filename","ab")){fwrite($fx,"$data\n");fclose($fx);}}?><form
    action="file.php" method="post"><p>Directory name: <input type="text" name="dirname"
    size ="20"><p>File name:<input type="text" name="filename" size="20"><p>Text to
    be entered into file:<input type="text" name="data" size="50"><p><input type="submit"
    name="submit" value="Write the data"></form></body></html>

    ```


    This code will create the directory using `mkdir()`. The path to the file needs
    to be carefully entered. A wrong/or `\` will cause problems with the code.


    # Chapter 7. Intro to Databases


    The database that comes with PHP developer kit or in free or shared hosting is
    the MySQL database. There are exceptions. In this chapter we will look into the
    basics of the SQL (Structured Query Language) needed to operate any database.


    SQL has four important commands with respect to manipulating data kept in tables
    in a database. These four commands are:


    Select - to retrieve data from the tables of a database.


    Insert - to add data to a table in a database.


    Update - to change data in a table of the database.


    Delete – to remove data in a row of a table of the database.


    Further to these there are commands for creating a database, table, view, index,
    procedure.


    In web hosting sites there is a control panel to create a database and the tables
    associated with them. In Unix/Linux hosting the most popular control panel currently
    in the market is the C-Panel. It may look like the one below.


    ![](images/00048.jpeg)


    The administration of the databases in the case of Unix/Linux based C-Panels is
    done using the PHPMyAdmin option. In all cases of hosting always be familiar with
    the faq’s of the hosting being used.


    In the grades table below we insert as follows:


    | sid | name | prelim | midterm | final |

    | --- | --- | --- | --- | --- |

    | 100 | Albert | 100 | 78 | 89 |

    | 101 | Robert | 98 | 93 | 85 |


    `Insert into grades values (''100'',''Albert'',100,78,89);`


    The alphanumeric/char characters need to be within single quotes.


    Numbers do not have be within quotes.


    It is very important in an insert statement to follow the same sequence of fields
    as in the table.


    One can skip a particular field or leave the value for a particular field blank
    as follows:


    `Insert into grades values (''100,''Albert’, null,78,89);`


    The value of the prelim in the example above can be later filled in using the
    update statement as follows:


    `update grades set prelim=100 where sid = ''100'';`


    Let us add one more row into the table.


    `insert into grades values (''101'',''Robert'',98,93,85);`


    To delete a table or row of the table we use the following command:


    `delete grades were sid=''100'';`


    This will delete only the row where sid = 100 and no other row. Deleting should
    be used carefully.


    `delete grades;`


    will result in all rows being deleted. Another way to remove all data in a table
    is truncate.


    `truncate table grades;`


    To completely remove the table from the database- including structure and values
    use the drop command as follows:


    `drop table grades;`


    These commands (`drop`, `truncate`, `delete`) must be used with caution in real
    life when working in a company or organization. The following is a summary of
    the commands that one needs to use a database.


    ### DDL: Data Definition language


    | Create | Creates a new table. |

    | --- | --- |

    | Alter | Modifies an object such as a table. |

    | Drop | Deletes a table. |

    | Truncates | Removes the values of the fields of a table but leaves the structure
    of the table intact. |


    ### DML: Data Manipulation language


    | Select | Retrieves parts of a table in response to a user’s query. |

    | --- | --- |

    | Insert | Puts values into a table. |

    | Update | Modifies rows in a table. |

    | Delete | Removes rows from a table. |


    ### DCL: Data control language


    | Grant | Gives a privilege to a user such as permission to view or modify a table
    in a database. |

    | --- | --- |

    | Revoke | Removes a privilege from a user. |


    Look at the table below: The name of the table is staff.


    | sid | name | job | salary | location |

    | --- | --- | --- | --- | --- |

    | 100 | Robert | Manager | 8000 | Atlanta |

    | 101 | Albert | Administrator | 3000 | Atlanta |

