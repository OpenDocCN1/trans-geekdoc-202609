  md: 'Equivalently, consider a random vector


    $$X = \theta \mu + g$$


    where $\theta$ is a Rademacher random variable, $g \sim N(0, I_n)$, and $\theta$
    and $g$ are independent. Draw a sample $X_1,\dots,X_m$ of independent random vectors
    identically distributed with $X$. Then the sample is distributed according to
    the Gaussian mixture model; see Figure 4.5 for illustration.


    ![](img/b122213aed28c1888de83a894123323e_134_0.png)


    **Figure 4.5** $m = 3000$ points drawn from the Gaussian mixture model with means
    $-\mu$ and $\mu$ shown as two big black dots, for $\mu = (-1.6, 0)$.


    Given $m$ sample points from the Gaussian mixture model, our goal is to figure
    out which points belong to which cluster. To do this, we can use a variant of
    the *spectral clustering* algorithm we introduced for networks in Section 3.2.2.


    To see why a spectral method might work here, notice that the distribution of
    $X$ is not isotropic, but rather stretched along $\mu$ (the horizontal direction
    in Figure 4.5.) Thus, we can approximately find $\mu$ by computing the first principal
    component of the data — the eigenvector corresponding to the largest eigenvalue
    of the sample covariance matrix. Next, we can project the data points onto the
    principal component and classify them based on which side of the origin the lie
    on. Here is the algorithm:


    # Spectral Clustering Algorithm


    +   **Input:** points $X_1, \dots, X_m$ in $\mathbb{R}^n$

    +   **Output:** a partition of the points into two clusters

    +   1. Compute the sample covariance matrix $\Sigma_m = \frac{1}{m} \sum_{i=1}^m
    X_i X_i^\top$.

    +   2. Compute the top eigenvector $v = v_1(\Sigma_m)$.

    +   3. Split the points $X_i$ into two communities based on the sign of $\langle
    X_i, v \rangle$.


    **Theorem 4.7.5** (Spectral clustering for the Gaussian mixture model). *Take
    points $X_1,\dots,X_m \in \mathbb{R}^n$ from the Gaussian mixture model with means
    $\mu$ and $-\mu$. If $m \ge C n$ and $\|\mu\|_2 \ge C$, then with probability
