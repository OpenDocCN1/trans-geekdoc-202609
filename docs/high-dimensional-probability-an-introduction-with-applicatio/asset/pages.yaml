    # 7.2.2 Proof of Slepian inequality


    We are ready to establish a preliminary, functional form Slepian inequality.


    **Lemma 7.2.6** (Slepian inequality, functional form). *Consider two mean-zero
    Gaussian random vectors $X$ and $Y$ in $\mathbb{R}^n$. Assume that for all $i,j=1,\ldots,n$,
    we have*


    $$\mathbb{E}X_i^2 = \mathbb{E}Y_i^2 \quad\text{and}\quad \mathbb{E}(X_i-X_j)^2
    \leq \mathbb{E}(Y_i-Y_j)^2.$$


    *Consider a twice-differentiable function $f:\mathbb{R}^n\to\mathbb{R}$ such that*


    $$\frac{\partial^2 f}{\partial x_i\,\partial x_j} \geq 0 \quad\text{for all }
    i\ne j.$$


    *Then*


    $$\mathbb{E}f(X) \geq \mathbb{E}f(Y),$$


    *assuming both expectations exist and are finite.*


    *Proof* The assumptions imply that the entries of the covariance matrices $\Sigma^X$
    and $\Sigma^Y$ of $X$ and $Y$ satisfy


    $$\Sigma_{ii}^{X}=\Sigma_{ii}^{Y} \quad\text{and}\quad \Sigma_{ij}^{X}\geq\Sigma_{ij}^{Y}.$$


    for all $i,j=1,\ldots,n$. We can assume that $X$ and $Y$ are independent. (Why?)
    Apply Lemma 7.2.5 and using our assumptions, we conclude that


    $$\frac{d}{du}\,\mathbb{E}f(Z(u)) \geq 0,$$


    so $\mathbb{E}f(Z(u))$ increases in $u$. Then $\mathbb{E}f(Z(1))=\mathbb{E}f(X)$
    is at least as large as $\mathbb{E}f(Z(0))=\mathbb{E}f(Y)$. This completes the
    proof.


    Now we are ready to prove Slepian inequality, Theorem 7.2.2. Let us state and
    prove it in the equivalent form for Gaussian random vectors.


