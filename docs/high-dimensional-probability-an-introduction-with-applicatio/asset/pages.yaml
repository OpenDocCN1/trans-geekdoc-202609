    For a given function $f : \mathbb{R}^n \to \mathbb{R}$, let’s study how $\mathbb{E}
    f(Z(u))$ changes as $u$ increases from 0 to 1. Of special interest to us is the
    function


    $$f(x) = \mathbf{1}_{\{\max_i x_i < \tau\}}.$$


    We will be able to show that in this case, $\mathbb{E} f(Z(u))$ *increases* in
    $u$. This would imply the conclusion of Slepian inequality at once, since then


    $$\mathbb{E} f(Z(1)) \geq \mathbb{E} f(Z(0)), \quad \text{thus} \quad \mathbb{P}\left\{\max_i
    X_i < \tau\right\} \geq \mathbb{P}\left\{\max_i Y_i < \tau\right\}$$


    as claimed.


    Now let us pass to a detailed argument. To develop Gaussian interpolation, let
    us start with the following useful identity.


    **Lemma 7.2.3** (Gaussian integration by parts). *Let $X \sim N(0,1)$. Then for
    any differentiable function $f : \mathbb{R} \to \mathbb{R}$ we have*


    $$\mathbb{E} X f(X) = \mathbb{E} f''(X),$$


    *assuming both expectations exist and are finite.*


    *Proof* Assume first that $f$ has bounded support. Denoting the Gaussian density
    by


    $$p(x) = \frac{1}{\sqrt{2\pi}} e^{-x^2/2},$$


    we can express the expectation as an integral, and integrate it by parts:


    $$\mathbb{E} f''(X) = \int_{\mathbb{R}} f''(x)p(x)\,dx = -\int_{\mathbb{R}} f(x)p''(x)\,dx.
    \tag{7.6}$$


    Now, a direct check gives $p''(x) = -xp(x)$, so the integral in (7.6) equals


    $$\int_{\mathbb{R}} f(x)p(x)x\,dx = \mathbb{E} X f(X),$$


    as claimed. The result can be extended to general functions by an approximation
    argument. The lemma is proved. $\square$


    By rescaling, we can extend Gaussian integration by parts for $X \sim N(0,\sigma^2)$:


    $$\mathbb{E} X f(X) = \sigma^2 \mathbb{E} f''(X).$$


    (Just write $X = \sigma Z$ for $Z \sim N(0,1)$ and apply Lemma 7.2.3.) We can
    also extend it to high dimensions:


    **Lemma 7.2.4** (Multivariate Gaussian integration by parts). *Let $X \sim N(0,\Sigma)$.
    Then for any differentiable function $f : \mathbb{R}^n \to \mathbb{R}$ we have*


    $$\mathbb{E} X f(X) = \Sigma \cdot \mathbb{E} \nabla f(X),$$'
