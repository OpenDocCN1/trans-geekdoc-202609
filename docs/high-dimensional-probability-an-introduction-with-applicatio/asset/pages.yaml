    for $f(x)$. To check the assumptions of this result, note that for $i\ne j$ we
    have


    $$\frac{\partial^2 f}{\partial x_i\,\partial x_j}=h''(x_i)h''(x_j)\cdot\prod_{k\notin\{i,j\}}h(x_k).$$


    The first two factors are non-positive and the others are nonnegative by the assumption.
    Thus the second derivative is nonnegative, as required.


    It follows that


    $$\mathbb{E}f(X)\ge\mathbb{E}f(Y).$$


    By approximation, this implies


    $$\mathbb{P}\left\{\max_{i\le n}X_i<\tau\right\}\ge\mathbb{P}\left\{\max_{i\le
    n}Y_i<\tau\right\}.$$


