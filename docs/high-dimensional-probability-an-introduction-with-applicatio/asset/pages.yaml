  md: 'Finally, we can upgrade this to a matrix inequality using Proposition 5.4.4(d).
    If $||X|| \le K$ and $|\lambda| < 3/K$, then $e^{\lambda X} \preceq I + \lambda
    X + g(\lambda)X^2$. Take expectation of both sides and use the assumption that
    $\mathbb{E} X = 0$ to get $\mathbb{E} e^{\lambda X} \preceq I + g(\lambda) \mathbb{E}
    X^2$. To complete the proof of the lemma, let''s use the inequality $1+z \le e^z$
    that holds for all scalars $z$. Thus, using again Proposition 5.4.4(d), we see
    that $I+Z \succeq e^Z$ holds for all matrices $Z$, and in particular for $Z =
    g(\lambda) \mathbb{E} X^2$. $\square$ **Step 4: Completion of the proof.** Let
    us return to bounding the quantity in (5.16). Using Lemma 5.4.10, we obtain $E
    \le \operatorname{tr}\exp[\sum_{i=1}^N \log \mathbb{E} e^{\lambda X_i}] \le \operatorname{tr}\exp[g(\lambda)Z]$,
    where $Z := \sum_{i=1}^N \mathbb{E} X_i^2$. Here we used matrix monotonicity of
    $\ln x$ (see Remark 5.4.6) to take logarithms on both sides, summed up the results,
    and then used trace monotonicity (Proposition 5.4.4(b)) to take traces of the
    exponential on both sides. Since the trace of $\exp[g(\lambda)Z]$ is a sum of
    $n$ positive eigenvalues, it is bounded by $n$ times the maximum eigenvalue, so
    $E \le n \cdot \lambda_{\max}(\exp[g(\lambda)Z]) = n \cdot \exp[g(\lambda)\lambda_{\max}(Z)]$
    (why?) $= n \cdot \exp[g(\lambda)||Z||]$ (since $Z \succeq 0$) $= n \cdot \exp[g(\lambda)\sigma^2]$
    (by definition of $\sigma$ in the theorem). Plugging this bound for $E = \mathbb{E}
    e^{\lambda \lambda_{\max}(S)}$ into (5.15), we obtain $\mathbb{P}\{\lambda_{\max}(S)
    \ge t\} \le n \cdot \exp[-\lambda t + g(\lambda)\sigma^2]$. We obtained a bound
    that holds for any $\lambda > 0$ such that $|\lambda| < 3/K$, so we can minimize
    it in $\lambda$. Better yet, instead of computing the exact minimum (which might
    be a little too ugly), we can choose the following value: $\lambda = t/(\sigma^2
    + Kt/3)$. Substituting it into the bound above and simplifying yields $\mathbb{P}\{\lambda_{\max}(S)
    \ge t\} \le n \cdot \exp\!\left(-\frac{t^2/2}{\sigma^2 + Kt/3}\right)$. Repeating
    the argument for $-S$ and combining the two bounds via (5.14), we complete the
    proof of Theorem 5.4.1. (Do this!) $\square$ **Remark 5.4.11 (Matrix Bernstein
    inequality: expectation).** Matrix Bernstein inequality gives a high-probability
    bound. It can be turned into a simpler (but less informative) expectation bound
    in a standard way – using the integrated tail formula (Lemma 1.6.1). Try Exercise
    5.20 to deduce from Theorem 5.4.1 that $\mathbb{E}\big\|\sum_{i=1}^N X_i\big\|
