  md: '# 5.5 Application: community detection in sparse networks


    In Section 4.5, we explored spectral clustering – a basic method for community
    detection in networks. We analyzed its performance on the stochastic block model
    $G(n,p,q)$ with two communities and showed it works for relatively *dense* networks,
    where the expected average degree $\gtrsim \sqrt{n}$ (Remark 4.5.3). Now, using
    matrix Bernstein inequality, we will show that spectral clustering actually works
    for *much sparser* networks, with an expected average degree as low as $O(\log
    n)$.


    **Theorem 5.5.1** (Spectral clustering for sparse stochastic block model). *Let
    $G \sim G(n,p,q)$ where$^{16}$ $p = a/n$, $q = b/n$ and $b < a < 3b$. Assume that*


    $$(a - b)^2 \ge C a \log n.$$


    *Then, with probability at least 0.99, the spectral clustering algorithm (Section
    4.5.5) identifies the communities of $G$ with 99% accuracy, i.e. misclassifying
    at most 0.01$n$ vertices.*


    *Proof*  Let’s follow the argument in Section 4.5, just with a sharper error bound.


    # Step 1: Decomposition.


    Like in Section 4.5.2, we look at the adjacency matrix $A$ of a random graph $G
    \sim G(n,p,q)$, and split it into deterministic and random parts:


    $$A = D + R \quad \text{where} \quad D = \mathbb{E} A$$


    In Section 4.5.2, we analyzed the expected adjacency matrix $D$, noting that its
    second top eigenvector $u_2(D)$ has $\pm1$ coefficients that represent community
    membership. The main difference now is in analyzing the random part


    $$R = A - \mathbb{E} A.$$


    Let’s decompose it entry by entry, keeping symmetry in mind. Denote the standard
    basis vectors in $\mathbb{R}^n$ by $e_1,\dots,e_n$ and write $R$ as a *sum of
    independent, mean-zero random matrices* $Z_{ij}$ that isolate entries $(i,j)$
    and $(j,i)$:


    $$R = \sum_{i \le j} Z_{ij}, \quad \text{where} \quad Z_{ij} = \begin{cases} R_{ij}(e_i
    e_j^\top + e_j e_i^\top), & i < j \\ R_{ii} e_i e_i^\top, & i = j. \end{cases}$$


    # Step 2: Bounding the error.


    Since $A_{ij} \in \{0,1\}$, we have $|R_{ij}| \le 1$, so $\|Z_{ij}\| = \|R_{ij}\|
    \le 1$ (why?), so $\|R_{ij} Z_{ij}\| \le 1$. Thus, applying matrix Bernstein inequality
    (5.17) combined with Markov inequality, we obtain with probability at least 0.99:


    $$\|R\| \lesssim \sigma \sqrt{\log n} + \log n \quad \text{where} \quad \sigma^2
    = \big\| \mathbb{E} \sum_{i \le j} Z_{ij}^2 \big\|.$$ (5.18)


    $^{16}$ With this parametrization, any node is connected to $a/2$ nodes in its
    own community and $b/2$ nodes in the other, on average. (Why?)'
