    $$\mathbb{E}\sup_{x\in T}\left|\|Ax\|_2^2-m\|x\|_2^2\right|\le CK^4\gamma(T)^2+CK^2\sqrt{m}\,\operatorname{rad}(T)\gamma(T).$$


    Check this in **Exercise 9.3**.


    To practice, extend matrix deviation inequality to empirical processes (**Exercise
    9.5**) and prove a version for random projections (**Exercise 9.6** — this one
    is challenging!).


    # ## 9.2 Random matrices, covariance estimation, and Johnson–Lindenstrauss


    Matrix deviation inequality has lots of useful consequences. We will go over a
    few of them through the rest of the chapter.


    # ### 9.2.1 Singular values of random matrices


    Applying the matrix deviation inequality for the unit Euclidean sphere $T=S^{n-1}$
    gives us the singular value bounds from **Section 4.6**.


    Here is the quick check: since for the sphere we have


    $$\operatorname{rad}(T)=1\quad\text{and}\quad w(T)\le\sqrt{n},$$


    the matrix deviation inequality (9.11) shows that the event


    $$\sqrt{m}-CK^2(\sqrt{n}+u)\le\|Ax\|_2\le\sqrt{m}+CK^2(\sqrt{n}+u)\quad\forall
    x\in S^{n-1}$$


    holds with probability at least $1-2\exp(-u^2)$. Using (4.14), this translates
    to


    $$\sqrt{m}-CK^2(\sqrt{n}+u)\le s_n(A)\le s_1(A)\le\sqrt{m}+CK^2(\sqrt{n}+u),$$


    recovering **Theorem 4.6.1** we proved earlier in a different way.


    # ### 9.2.2 Random projections of sets


    Another immediate application of matrix deviation inequality is a (sharper!) version
    of the random projection bound from **Section 7.6**:'
