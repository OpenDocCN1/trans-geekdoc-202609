    **4.12 (a)** A neat trick: block-diagonalize \(P-Q\). Take an orthogonal matrix
    \(\widetilde U=[U\ U_\perp]\) whose first columns form \(U\) and span \(\operatorname{Im}P\).
    Similarly, take an orthogonal matrix \(\widetilde V=[V\ V_\perp]\) whose first
    columns form \(V\) and span \(\operatorname{Im}Q\). Then compute \(\widetilde
    U^T(P-Q)\widetilde V\) and realize that it is a block matrix whose norm is the
    maximal norm of the two blocks.


    **4.13** Use Exercise **4.12** and Lemma **4.1.16**; follow the Davis–Kahan proof
    (Theorem **4.1.15**).'
