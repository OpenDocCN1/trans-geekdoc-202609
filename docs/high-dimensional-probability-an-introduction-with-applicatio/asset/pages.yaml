  md: 'The notion of Gaussian processes generalizes that of Gaussian random vectors
    in \(\mathbb{R}^n\). A classical example of a Gaussian process is the standard
    Brownian motion.


    **Remark 7.1.10** (Distribution is determined by covariance, increments). The
    distribution of a mean-zero Gaussian random vector in \(\mathbb{R}^n\) is completely
    determined by its covariance matrix (recall Proposition 3.3.5). Then the same
    goes for a mean-zero Gaussian process: its distribution is determined by the covariance
    function \(\Sigma(t,s)\), or equivalently (due to Exercise 7.1) by the increments
    \(d(t,s)\), assuming the zero variable is part of the process.


    Many tools we learned about random vectors can be applied to random processes.
    For example, Gaussian concentration (Theorem 5.2.3) implies:


    **Theorem 7.1.11** (Concentration of Gaussian processes). Let \((X_t)_{t\in T}\)
    be a Gaussian process with finite \(T\). Then


    \[

    \left\|\sup_{t\in T}X_t-\mathbb{E}\sup_t X_t\right\|_{\psi_2}\le C\sup_{t\in T}\sqrt{\operatorname{Var}(X_t)}.

    \]


    This is just a restatement of Exercise 5.9(b) — if you skipped it then, do it
    now!


    Let’s look at a broad class of Gaussian processes indexed by high-dimensional
    sets \(T\subset\mathbb{R}^n\). Take a standard normal vector \(g\sim N(0,I_n)\)
    and define


    \[

    X_t:=\langle g,t\rangle,\qquad t\in T. \tag{7.2}

    \]


    This gives us a Gaussian process \((X_t)_{t\in T}\) called *the canonical Gaussian
    process*. The increments match the Euclidean distance:


    \[

    \|X_t-X_s\|_{L^2}=\|t-s\|_2,\qquad t,s\in T.

    \]


    (Check!)


    Actually, one can realize any Gaussian process as the canonical process (7.2).
    This follows from a simple observation about Gaussian vectors:


    **Lemma 7.1.12** (Gaussian random vectors). Let \(X\) be a mean-zero Gaussian
    random vector in \(\mathbb{R}^n\). Then there exist points \(t_1,\ldots,t_n\in\mathbb{R}^n\)
    such that


    \[

    X\stackrel{dist}{=} (\langle g,t_i\rangle)_{i=1}^n,\qquad\text{where }g\sim N(0,I_n).

    \]


    Here \(\stackrel{dist}{=}\) means the equality of distributions.


    *Proof* If \(\Sigma\) denotes the covariance matrix of \(X\), then, by (3.12),
    we have


    \[

    X\stackrel{d}{=}\Sigma^{1/2}g,\qquad\text{where }g\sim N(0,I_n).

    \]


    The entries of \(\Sigma^{1/2}g\) are \(\langle t_i,g\rangle\) where \(t_i\) are
    the rows of \(\Sigma^{1/2}\). Done! □


    It follows that for any Gaussian process \((X_s)_{s\in S}\), all finite-dimensional
    marginals \((X_s)_{s\in S_0}\), \(|S_0|=n\), can be represented as the canonical
    Gaussian process (7.2) indexed in a certain subset \(T_0\subset\mathbb{R}^n\).


    ² We are assuming \(T\) is finite just to avoid measurability issues. But in practice,
    you can usually extend to general \(T\) by approximation. Try it for the canonical
    Gaussian process (7.2)!'
