  md: "# 7.1 Basic concepts and examples\n\n**Definition 7.1.1** (Random process).\
    \ A *random process* is just a collection of random variables \\((X_t)_{t\\in\
    \ T}\\) on the same probability space, which are indexed by elements \\(t\\) of\
    \ some set \\(T\\).\n\nIn some classical examples, \\(t\\) stands for *time*,\
    \ in which case \\(T\\) is a subset of \\(\\mathbb{R}\\). But we primarily study\
    \ processes in high-dimensional settings, where \\(T\\) is a subset of \\(\\mathbb{R}^n\\\
    ) and where the analogy with time is lost.\n\n**Example 7.1.2** (Discrete time).\
    \ If \\(T=\\{1,\\ldots,n\\}\\) then the random process\n\n\\[\n(X_1,\\ldots,X_n)\n\
    \\]\n\ncan be identified with a *random vector* in \\(\\mathbb{R}^n\\).\n\n**Example\
    \ 7.1.3** (Random walks). If \\(T=\\mathbb{N}\\), a discrete-time random process\
    \ \\((X_n)_{n\\in\\mathbb{N}}\\) is simply a *sequence* of random variables. An\
    \ important example is a *random walk* defined as\n\n\\[\nX_n := \\sum_{i=1}^{n}\
    \ Z_i,\n\\]\n\nwhere the increments \\(Z_i\\) are independent, mean-zero random\
    \ variables. See Figure 7.1 for illustration.\n\n![](img/b122213aed28c1888de83a894123323e_201_0.png)\n\
    \n**Example 7.1.4** (Brownian motion). The most classical continuous-time random\
    \ process is the standard *Brownian motion* \\((X_t)_{t\\ge 0}\\), or the *Wiener\
    \ process*. It can be characterized as follows:\n\n+   (i) The process has continuous\
    \ sample paths, i.e. the random function \\(f(t):=X_t\\) is continuous almost\
    \ surely;\n+   \n+   (ii) The increments are independent and satisfy \\(X_t-X_s\\\
    sim N(0,t-s)\\) for all \\(t\\ge s\\).\n\nFigure 7.1 shows a few trials of the\
    \ standard Brownian motion.\n\n**Example 7.1.5** (Random fields). When the index\
    \ set \\(T\\) is a subset of \\(\\mathbb{R}^n\\), a random process \\((X_t)_{t\\\
    in T}\\) is sometimes called a spatial random process, or a *random field*. For\
    \ example, the water temperature \\(X_t\\) at the location on Earth that is parametrized\
    \ by \\(t\\) can be modeled as a spatial random process."
