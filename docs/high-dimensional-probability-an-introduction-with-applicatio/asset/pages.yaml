    \ subset $B\\subset\\mathbb{R}^N$.\n+   \n+   (b) Assume for contradiction that\
    \ the claim holds. Apply it to bound the probabilities of the events $|\\hat{\\\
    mu}(X)|\\ge \\mu/2$ and $|\\hat{\\mu}(Y)-\\mu|\\ge \\mu/2$.\n+   \n+   (c) Choose\
    \ $\\mu$ large enough and replace $Y$ with $X$ using (a) to make both events $|\\\
    hat{\\mu}(X)|<\\mu/2$ and $|\\hat{\\mu}(X)-\\mu|<\\mu/2$ likely. Use triangle\
    \ inequality to arrive at a contradiction.\n\n2.18  \U0001F401  **(Most degrees\
