    # 8.3.1 Definition and examples


    The VC dimension measures how complex a class of Boolean functions is. Here, a
    Boolean function is a map $f : \Omega \to \{0,1\}$ on some set $\Omega$, and we
    are looking at some collection $\mathcal{F}$ of these.


    **Definition 8.3.1** (VC dimension). A subset $\Lambda \subseteq \Omega$ is *shattered*
    by a class of Boolean functions $\mathcal{F}$ if, for any possible binary labeling
    $g : \Lambda \to \{0,1\}$, there is some function $f \in \mathcal{F}$ that matches²
    it on $\Lambda$. The *VC dimension* of $\mathcal{F}$, denoted $\mathrm{vc}(\mathcal{F})$,
    is the largest cardinality of a subset $\Lambda \subseteq \Omega$ that is shattered.
    (And if there is no largest one, we say $\mathrm{vc}(\mathcal{F}) = \infty$.)


    VC dimension can take some time to sink in, so let’s walk through a few examples
    to make it clearer.


    **Example 8.3.2** (Intervals). Let $\mathcal{F}$ consist of the indicators of
    all closed intervals in $\mathbb{R}$:


    $$\mathcal{F} := \{\mathbf{1}_{[a,b]} : a,b \in \mathbb{R},\ a \le b\}.$$


    We claim that


    $$\mathrm{vc}(\mathcal{F}) = 2.$$


    To prove $\mathrm{vc}(\mathcal{F}) \ge 2$, we need to find a two-point set $\Lambda
    \subseteq \mathbb{R}$ that is shattered by $\mathcal{F}$. Take, for example, $\Lambda
    = \{3,5\}$. There are four possible binary labelings $g : \Lambda \to \{0,1\}$
    on this set, and each one can be obtained by restricting some interval indicator
    $f = \mathbf{1}_{[a,b]}$ onto $\Lambda$. For instance, $g(3) = 1,\ g(5) = 0$ comes
    from $f = \mathbf{1}_{[2,4]}$. The other three cases are similar (see Figure 8.5),
    so $\Lambda$ is indeed shattered by $\mathcal{F}$.


    ![](img/b122213aed28c1888de83a894123323e_237_0.png)


    **Figure 8.5** The binary function $g(3) = g(5) = 0$ is the restriction of $\mathbf{1}_{[6,7]}$
    onto $\Lambda = \{3,5\}$ (left). The function $g(3) = 0,\ g(5) = 1$ is the restriction
    of $\mathbf{1}_{[4,6]}$ onto $\Lambda$ (middle left). The function $g(3) = 1,\
    g(5) = 0$ is the restriction of $\mathbf{1}_{[2,4]}$ onto $\Lambda$ (middle right).
    The function $g(3) = g(5) = 1$ is the restriction of $\mathbf{1}_{[2,6]}$ onto
    $\Lambda$ (right).


    To prove $\mathrm{vc}(\mathcal{F}) < 3$, we need to show that no three-point set
    $\Lambda = \{p,q,r\}$ can be shattered by $\mathcal{F}$. To see this, assume $p
    < q < r$ and consider the labeling $g(p) = 1,\ g(q) = 0,\ g(r) = 1$. Then $g$
    can not be a restriction of any indicator $\mathbf{1}_{[a,b]}$ onto $\Lambda$,
    for otherwise $[a,b]$ must contain two points $p$ and $r$ but not the point $q$
    that lies between them, which is impossible.


    ² Formally, this means that the restriction of $f$ onto $\Lambda$ is $g$, i.e.
    $f(x) = g(x)$ for all $x \in \Lambda$.'
