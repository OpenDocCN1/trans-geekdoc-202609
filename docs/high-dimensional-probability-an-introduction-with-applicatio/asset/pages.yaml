  md: '**Remark 7.5.10** (Surprising behavior of width in high dimensions). As we
    can see from Examples 7.5.6–7.5.8, the Gaussian width of the cube $B_\infty^n$
    is roughly (up to a constant factor) the same as that of its *circumscribed* ball
    $\sqrt{n}B_2^n$. But for the cross-polytope $B_1^n$, the width is roughly (up
    to a log factor) like that of its *inscribed* ball $\frac{1}{\sqrt{n}}B_2^n$,
    which is tiny! Why?


    The cube $B_\infty^n$ has so many vertices ($2^n$) that in most directions it
    sticks out to roughly the circumscribed ball, which drives the width. But the
    cross-polytope $B_1^n$ only has $2n$ vertices, so a random direction $g\sim N(0,I_n)$
    likely to be far from all of them. The width is not driven by those lonely $2n$
    “spikes” — it’s driven by the “bulk”, which is roughly the inscribed ball.


    Figure 7.4a shows Milman’s *hyperbolic sketch* of $B_1^n$, highlighting how the
    bulk (the inscribed ball) dominates since the set has few vertices (spikes). You
    can make similar sketches for general convex sets, too (Figure 7.4b) — they are
    great for building high-dimensional intuition, even if you lose convexity in the
    picture.


    For more practice, try Exercise 7.17 to compute the Gaussian width of any $\ell^p$
    ball, covering all three examples above at once — the ball ($p=2$), the cube ($p=\infty$),
    and the cross-polytope ($p=1$). Also work through Exercises 7.18–7.19 to compute
    the Gaussian width of the set of $n\times n$ matrices with operator norm at most
    1.


