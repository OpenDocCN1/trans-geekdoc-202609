  md: '**Definition 8.1.1** (Subgaussian increments). A random process \((X_t)_{t\in
    T}\) on a metric space \((T,d)\) has *subgaussian increments* if there exists
    \(K\ge 0\) such that


    $$\|X_t-X_s\|_{\psi_2}\le Kd(t,s)\quad\text{for all }t,s\in T. \tag{8.1}$$


    **Example 8.1.2** (Gaussian processes). Let \((X_t)_{t\in T}\) be a Gaussian process
    on some set \(T\). It naturally defines a *canonical metric* on \(T\):


    $$d(t,s):=\|X_t-X_s\|_{L^2},\quad t,s\in T,$$


    as we explained in (7.1). With respect to this metric, \((X_t)_{t\in T}\) clearly
    had subgaussian increments, with some absolute constant \(K\).


    Here is another (trivial) example: any random process can be made to have subgaussian
    increments by defining the metric as \(d(t,s):=\|X_t-X_s\|_{\psi_2}\).


    Now we give a bound on a general subgaussian random process \((X_t)_{t\in T}\)
    in terms of the metric entropy \(\log \mathcal{N}(T,d,\varepsilon)\):


    **Theorem 8.1.3** (Dudley integral inequality). Let \((X_t)_{t\in T}\) be a *mean-zero
    random process* on a metric space \((T,d)\) with subgaussian increments as in
    (8.1). Then


    $$\mathbb{E}\sup_{t\in T}X_t\le CK\int_0^\infty\sqrt{\log \mathcal{N}(T,d,\varepsilon)}\,d\varepsilon.$$


    Before we prove Dudley inequality, let’s compare it with Sudakov inequality (Theorem
    7.4.1), which for Gaussian processes says:


    $$\mathbb{E}\sup_{t\in T}X_t\ge c\sup_{\varepsilon>0}\varepsilon\sqrt{\log \mathcal{N}(T,d,\varepsilon)}.$$


    Figure 8.1 illustrates both bounds. There is a clear gap between them, and it
    turns out that metric entropy alone cannot close it – we will explore this later.


    ![](img/b122213aed28c1888de83a894123323e_228_0.png)


    **Figure 8.1** Dudley inequality bounds \(\mathbb{E}\sup_{t\in T}X_t\) by the
    area under the curve. Sudakov inequality bounds it below by the largest area of
    a rectangle under the curve, up to constants.


    The Dudley inequality hints that \(\mathbb{E}\sup_{t\in T}X_t\) is a *multiscale*
    quantity – to bound it, we need to look at \(T\) across all scales \(\varepsilon\).
    And that is exactly how the'
