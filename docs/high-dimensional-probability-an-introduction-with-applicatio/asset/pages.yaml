  md: 'Unlike the classical Johnson-Lindenstrauss Lemma for finite sets (Theorem 5.3.1),
    which gives a relative error, here we get an absolute error δ. It is a small difference
    – but in general, a necessary one (see Exercise 9.11).


    # Remark 9.2.5 (Effective dimension).


    To better understand the additive Johnson-Lindenstrauss lemma, let’s restate it
    using the effective dimension of the data $d(\mathcal{X}) \asymp w(\mathcal{X})^2
    / \operatorname{diam}(\mathcal{X})^2$ (see Definition 7.5.12). If we choose


    $$m \gtrsim \varepsilon^{-2} d(T)$$


    (ignoring the dependence on $K$ for simplicity), then we can make $\delta = \varepsilon
    \operatorname{diam}(\mathcal{X})$ in 9.2.4, so $Q$ preserves distances up to a
    small fraction of diameter – in other words, it reduces the dimension of the data
    down to its effective dimension.


    # 9.3 Random sections: the $M^*$ bound and escape theorem


    Here is a surprising high-dimensional fact: if you slice a convex set $T \subset
    \mathbb{R}^n$ with a random subspace $E$ of codimension $m$, the slice $T \cap
    E$ is often tiny – even when $m \ll n$ and $E$ is nearly full-dimensional! Let’s
    see how this follows from the matrix deviation inequality.


    # 9.3.1 The $M^*$ bound


    It is handy to model a random subspace $E$ as the kernel of an $m \times n$ random
    matrix: $E = \ker A$. We always have


    $$\dim(E) \ge n - m,$$


    and if $A$ has a continuous distribution, $\dim(E) = n - m$ almost surely.


    A great example is a Gaussian matrix $A$ with i.i.d. $N(0,1)$ entries – by rotation
    invariance, $E = \ker(A)$ is uniformly distributed in the Grassmanian:


    $$E \sim \operatorname{Unif}(G_{n,n-m}).$$


    # Theorem 9.3.1 ($M^*$ bound).


    Let $T \subset \mathbb{R}^n$ be a bounded set, and let $A$ be an $m \times n$
    random matrix with independent, isotropic and subgaussian rows $A_i$. Then the
    random subspace $E = \ker A$ satisfies


    $$\mathbb{E} \operatorname{diam}(T \cap E) \le \frac{C K^2 w(T)}{\sqrt{m}},$$


    where $K = \max_i \|A_i\|_{\psi_2}$.


    Proof Apply Theorem 9.1.1 for $T - T$:


    $$\mathbb{E} \sup_{x,y \in T} \big| \|Ax - Ay\|_2 - \sqrt{m} \|x - y\|_2 \big|
    \le C K^2 \gamma(T - T) = 2 C K^2 w(T),$$


    by Lemma 7.5.11(a). Considering only the points $x, y$ in the kernel of $A$ makes'
