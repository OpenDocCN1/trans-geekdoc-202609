    = 2\max_{z\in\mathcal{N}}\sup_{x\in T-T}\langle Q^{\mathsf T}z,x\rangle. \tag{7.22}$$


    (see Exercise 4.35). Now, here is the plan: we will first bound


    $$\sup_{x\in T-T}\langle Q^{\mathsf T}z,x\rangle \tag{7.23}$$


    for a fixed $z\in\mathcal{N}$, and then take union bound over all $z$.


    **Step 3: Concentration.** So, let’s fix $z\in\mathcal{N}$. By construction, $Q^{\mathsf
    T}z$ is uniformly distributed on the sphere: $Q^{\mathsf T}z\sim\operatorname{Unif}(S^{n-1})$
    (check this carefully in Exercise 7.24). The expectation of (7.23) can be expressed
    as the spherical width:


    $$\mathbb{E}\sup_{x\in T-T}\langle Q^{\mathsf T}z,x\rangle=w_s(T-T)=2w_s(T).$$


    (The last equality is just a spherical version of Proposition 7.5.2(e).)

    To check that (7.23) concentrates around its mean, we use the concentration inequality
    on the sphere (Theorem 5.1.3, or more specifically (5.30)). Since $\operatorname{diam}(T)\le
    1$ by assumption, the function $z\mapsto\sup_{x\in T-T}\langle z,x\rangle$ on
    the sphere has Lipschitz norm at most 1 (check!). So (5.30) gives


    $$\mathbb{P}\left\{\sup_{x\in T-T}\langle Q^{\mathsf T}z,x\rangle\ge 2w_s(T)+t\right\}\le
    2\exp(-cnt^2).$$


    **Step 4: Union bound.** Now we unfix $z\in\mathcal{N}$ by taking the union bound:


    $$\mathbb{P}\left\{\max_{z\in\mathcal{N}}\sup_{x\in T-T}\langle Q^{\mathsf T}z,x\rangle\ge
    2w_s(T)+t\right\}\le |\mathcal{N}|\cdot 2\exp(-cnt^2). \tag{7.24}$$


