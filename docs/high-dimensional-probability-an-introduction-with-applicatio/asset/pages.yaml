- pgno: 8
  md: '# Appetizer: Using Probability to Cover a Set


    Let’s begin with an elegant example of how probabilistic reasoning can help in
    geometry – feel free to skip it if you’d rather jump to the main content.


    A *convex combination* of points $z_1,\ldots,z_m \in \mathbb{R}^n$ is a linear
    combination with coefficients that are nonnegative and sum to 1, i.e. it is a
    sum of the form


    $$\sum_{i=1}^{m}\lambda_i z_i \quad\text{where}\quad \lambda_i\ge 0 \quad\text{and}\quad
    \sum_{i=1}^{m}\lambda_i=1. \tag{0.1}$$


    The *convex hull* of a set $T\subset\mathbb{R}^n$ is the set of all convex combinations
    of all finite collections of points in $T$:


    $$\operatorname{conv}(T):=\{\text{convex combinations of }z_1,\ldots,z_m\in T\text{
    for }m\in\mathbb{N}\};$$


    see Figure 0.1 for illustration.


    ![](img/b122213aed28c1888de83a894123323e_8_0.png)


    **Figure 0.1** The shaded area is the convex hull of the U.S. cities.


    The number $m$ of elements defining a convex combination in $\mathbb{R}^n$ is
    not restricted a priori. However, the classical Caratheodory theorem states that
    one can always take $m\le n+1$.


    > **Theorem 0.0.1** (Caratheodory theorem). *Every point in the convex hull of
    a set $T\subset\mathbb{R}^n$ can be expressed as a convex combination of at most
    $n+1$ points from $T$.*


    The bound $n+1$ is tight – for example, it is exactly what you need for a simplex
    (a set of $n+1$ points in general position). But what if we are okay with just
    approximating the point instead of representing it exactly? Then we can actually
    get away with using way fewer points – and surprisingly, the number does not even
    depend on the dimension!'
