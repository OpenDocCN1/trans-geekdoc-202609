  md: 'where $K = \max_i \|A_i\|_{\psi_2}$. The same holds if “rows” is replaced by
    “columns”.


    *Proof of Theorem 8.6.1* We will follow the proof of Theorem 7.3.1 but with Talagrand
    comparison inequality instead of Sudakov-Fernique’s.


    Without loss of generality, $K=1$. We need to bound the random process


    $$X_{uv}=\langle Au,v\rangle,\quad u\in T,\ v\in S.$$


    To check that the increments are subgaussian, fix $(u,v),(w,z)\in T\times S$ and
    write


    $$X_{uv}-X_{wz}=X_{uv}-X_{wv}+X_{wv}-X_{wz}=\langle A(u-w),v\rangle+\langle Aw,v-z\rangle.$$


    Using triangle inequality and the subgaussian assumption (see Exercise 3.34 –
    do it now if you skipped it), we get


    $$\begin{aligned}\|X_{uv}-X_{wz}\|_{\psi_2} &\le \|\langle A(u-w),v\rangle\|_{\psi_2}+\|\langle
    Aw,v-z\rangle\|_{\psi_2}\\ &\lesssim \|u-w\|_2\|v\|_2+\|v-z\|_2\|w\|_2\\ &\le
    \|u-w\|_2\,\operatorname{rad}(S)+\|v-z\|_2\,\operatorname{rad}(T).\end{aligned}\tag{8.52}$$


    Let’s pick a simpler Gaussian process $(Y_{uv})$ for Talagrand comparison inequality
    (Corollary 8.5.6). The increment bound (8.52) points us to a good choice:


    $$Y_{uv}:=\langle g,u\rangle\operatorname{rad}(S)+\langle h,v\rangle\operatorname{rad}(T),$$


    where $g\sim N(0,I_n)$ and $h\sim N(0,I_m)$ are independent. The increments of
    this process are


    $$\|Y_{uv}-Y_{wz}\|_{L_2}^2=\|u-w\|_2^2\operatorname{rad}(S)^2+\|v-z\|_2^2\operatorname{rad}(T)^2.$$


    (Check this like in the proof of Theorem 7.3.1!) Comparing to (8.52), we find
    that


    $$\|X_{uv}-X_{wz}\|_{\psi_2}\lesssim \|Y_{uv}-Y_{wz}\|_{L_2},$$


    where we used the inequality $a+b\le\sqrt{2(a^2+b^2)}$. Applying Talagrand comparison
    inequality (Corollary 8.5.6), we finish the proof:


    $$\begin{aligned}\mathbb{E}\sup_{u\in T,v\in S}X_{uv} &\le \mathbb{E}\sup_{u\in
    T,v\in S}Y_{uv}\\ &=\mathbb{E}\sup_{u\in T}\langle g,u\rangle\operatorname{rad}(S)+\mathbb{E}\sup_{v\in
    S}\langle h,v\rangle\operatorname{rad}(T)\\ &=w(T)\operatorname{rad}(S)+w(S)\operatorname{rad}(T).\end{aligned}$$


    # **Remark 8.6.2 (Operator norms of random matrices).**


    For the special case $T=S^{n-1}$ and $S=S^{m-1}$, Chevet inequality gives us the
    familiar sharp bound on the operator norm:


    $$\mathbb{E}\|A\|\le CK(\sqrt{n}+\sqrt{m}),$$


    which we earlier proved in Section 4.4.2 using $\varepsilon$-nets. But this new
    approach is more flexible. For example, picking $T$ and $S$ as $\ell^p$ balls
    gives the $\|A\|_{p\to q}$ norm of a random matrix – try Exercise 8.41!'
