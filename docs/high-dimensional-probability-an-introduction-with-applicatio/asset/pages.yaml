  md: 'essentially a sharpening of the chaining method we developed in the proof of
    Dudley inequality (Theorem 8.1.4).


    # 8.5.1 A makeover of Dudley inequality


    Recall the bound (8.12) we obtained by chaining:


    $$\mathbb{E}\sup_{t\in T}X_t\lesssim\sum_{k=\kappa+1}^{\infty}\varepsilon_{k-1}\sqrt{\log|T_k|},\tag{8.42}$$


    where $\varepsilon_k=2^{-k}$, $T_k$ are smallest $\varepsilon_k$-nets of $T$,
    so $|T_k|=\mathcal{N}(T,d,\varepsilon_k)$, and $\kappa$ is chosen so that $|T_\kappa|=1$.


    Now, let’s flip the approach: instead of fixing $\varepsilon_k$ and minimizing
    $|T_k|$, fix $|T_k|$ and minimize $\varepsilon_k$. Specifically, pick subsets
    $T_k\subset T$ such that


    $$|T_0|=1,\qquad |T_k|\le 2^{2^k},\qquad k=1,2,\ldots\tag{8.43}$$


    and define


    $$\varepsilon_k=\sup_{t\in T}d(t,T_k),$$


    where $d(t,T_k)$ denotes the distance⁷ from $t$ to the set $T_k$. Each $T_k$ is
    then an $\varepsilon_k$-net, and the chaining bound (8.42) becomes


    $$\mathbb{E}\sup_{t\in T}X_t\lesssim\sum_{k=1}^{\infty}2^{k/2}\sup_{t\in T}d(t,T_{k-1}),$$


    of, after re-indexing,


    $$\mathbb{E}\sup_{t\in T}X_t\lesssim\sum_{k=0}^{\infty}2^{k/2}\sup_{t\in T}d(t,T_k).\tag{8.44}$$


    # 8.5.2 The $\gamma_2$ functional and generic chaining


    So far, we have just restated Dudley’s inequality in a new form — nothing major
    yet. The important step will come now. The generic chaining will allow us to pull
    the supremum outside the sum in (8.44). The resulting quantity has a name:


    **Definition 8.5.1** ($\gamma_2$ functional). Let $(T,d)$ be a metric space. A
    sequence of subsets $(T_k)_{k=0}^{\infty}$ of $T$ satisfying (8.43) is called
    an *admissible sequence*. The $\gamma_2$ functional of $T$ is defined as


    $$\gamma_2(T,d)=\inf_{(T_k)}\sup_{t\in T}\sum_{k=0}^{\infty}2^{k/2}d(t,T_k)\tag{8.45}$$


    where the infimum is over all admissible sequences.


    ⁷ The distance from a point $t$ to a set $A$ in a metric space is $d(t,A)=\inf\{d(t,a):a\in
    A\}$.'
