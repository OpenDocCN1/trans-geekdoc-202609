  md: '# ### 7.6 Application: random projections of sets


    What happens if we project a set \(T \subset \mathbb{R}^n\) onto a random \(m\)-dimensional
    subspace in \(\mathbb{R}^n\) (picked uniformly from the Grassmannian \(G_{n,m}\)),
    like in Figure 5.2? In practice, we might see \(T\) as data and \(P\) as a way
    of dimension reduction, like in Johnson-Lindenstrauss lemma. What can we say about
    the size (diameter) of the projected set \(PT\)?


    For a finite set \(T\), the Johnson-Lindenstrauss Lemma (Theorem 5.3.1) says that
    if \(m \gtrsim \log |T|\), the random projection \(P\) acts essentially as a scaling
    of \(T\): it shrinks all distances between points in \(T\) by a factor \(\approx
    \sqrt{m/n}\). In particular,


    \[\operatorname{diam}(PT) \approx \sqrt{\frac{m}{n}}\,\operatorname{diam}(T).
    \tag{7.20}\]


    But if the cardinality of \(T\) is too large or infinite, (7.20) may fail. For
    instance, if \(T = B_2^n\) is a Euclidean ball, no projection can shrink its size:


    \[\operatorname{diam}(PT) = \operatorname{diam}(T). \tag{7.21}\]


    What about general sets \(T\)? The next result states that a random projection
    shrinks \(T\) as in (7.20), but it cannot shrink it beyond the spherical width
    \(w_s(T)\):


    **Theorem 7.6.1 (Sizes of random projections of sets).** Let \(T \subset \mathbb{R}^n\)
    be a bounded set, and \(P\) be the orthogonal projection in \(\mathbb{R}^n\) onto
    a random \(m\)-dimensional subspace \(E \sim \operatorname{Unif}(G_{n,m})\). Then


    \[\mathbb{E}\,\operatorname{diam}(PT) \lesssim w_s(T) + \sqrt{\frac{m}{n}}\,\operatorname{diam}(T),\]


    where the notation \(\lesssim\) hides positive absolute constant factors.


    *Proof*  Let’s prove the upper bound and leave the lower bound to you (see Exercise
    7.26).


    **Step 1: Change the model.** Let’s switch the view just like in the proof of
    Proposition 5.3.2. A random subspace \(E \subset \mathbb{R}^n\) can be obtained
    by randomly rotating some fixed subspace, such as \(\mathbb{R}^m\). But instead
    of fixing \(T\) and randomly rotating \(\mathbb{R}^m\), we can fix \(E = \mathbb{R}^m\)
    and randomly rotate \(T\). A random rotation of a vector \(x \in T\) is \(Ux\)
    where \(U \sim \operatorname{Unif}(O(n))\) is a random orthogonal matrix. Projecting
    \(Ux\) onto \(E = \mathbb{R}^m\) means keeping the first \(m\) coordinates, i.e.
    \(Qx\) where \(Q\) is the \(m \times n\) matrix consisting of the first \(m\)
    columns of \(U\). So, we can work with \(Q\) instead of \(P\).


    **Step 2: Approximation.** Without loss of generality, \(\operatorname{diam}(T)
    \le 1\). (Why?) We need to bound


    \[\operatorname{diam}(QT) = \sup_{x\in T-T}\|Qx\|_2 = \sup_{x\in T-T}\max_{z\in
    S^{m-1}}\langle Qx,z\rangle.\]


    We will proceed with an \(\varepsilon\)-net argument as in the proof of Theorem
    4.4.3. Choose an \((1/2)\)-net \(\mathcal{N}\) of the sphere \(S^{m-1}\) so that


    \[|\mathcal{N}| \le 5^m\]'
