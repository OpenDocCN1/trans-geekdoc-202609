  md: 'rani [319]. The books [157, 67, 344] offer a comprehensive introduction into
    statistical problems with sparsity constraints; these books discuss Lasso and
    its many variants.


    Sparse recovery based on the nullspace property (Exercise 9.32) goes back to Cohen,
    Dahmen and DeVore [88], see [281, 127, 344].


    Garnaev-Gluskin bound (Exercise 9.28) was first proved in [132], see also [222]
    and [127, Chapter 10].


    General matrix deviation inequality (Theorem 9.6.3) and its proof is due to G.
    Schechtman [295].


    The original version Chevet inequality was proved by S. Chevet [84] and the constant
    factors there were improved by Y. Gordon [140]; see also [21, Section 9.4], [210,
    Theorem 3.20] and [321, 7]. The version of Chevet inequality that we stated in
    Theorem 9.7.1) can be reconstructed from the work of Y. Gordon [140, 142], see
    [210, Corollary 3.21].


    Dvoretzky-Milman theorem has a long history in functional analysis. Proving a
    conjecture of A. Grothendieck, A. Dvoretzky [117, 118] showed that any n-dimensional
    normed space has an m-dimensional almost Euclidean subspace, where m = m(n) grows
    to infinity with n. V. Milman gave a probabilistic proof of this theorem [242]
    and pioneered the study of the best possible dependence m(n). Theorem 9.7.2 is
    due to V. Milman [242]; it is optimal [247], see [21, Theorem 5.3.3]. The tutorial
    [23] contains a a light introduction into Dvoretzky-Milman theorem. For a full
    exposition of Dvoretzky-Milman theorem and many of its ramifications, see e.g.
    [21, Chapter 5 and Section 9.2], [210, Section 9.1] and the references there.
    A “distributional” version of Dvoretzky-Milman theorem, where one asks if a random
    m-dimensional marginal of an n-dimensional distribution is approximately normal,
    has been pioneered for log-concave distributions by B. Klartag [186] (the central
    limit therem for convex bodies) and for discrete distributions by E. Meckes [230].


    The phase transition phenomenon noted in Remark 9.7.5 was put forth by V. Milman
    [245]; see [21, Proposition 5.7.1].


