  md: '“outer product” $xx^{\mathsf T}$. The first interpretation leads to defining
    the variance of $X$ as $\mathbb{E}\|X-\mathbb{E}X\|_2^2$, the quantity that played
    a prominent role in the Appetizer. The second interpretation leads to a more informative
    result: it gives rise to the notion of the *covariance matrix*


    $$\operatorname{cov}(X)=\mathbb{E}(X-\mathbb{E}X)(X-\mathbb{E}X)^{\mathsf T}$$


    which is an $n\times n$ matrix whose $(i,j)$-th entry equals $\operatorname{cov}(X_i,X_j)$.
    We will work with covariance matrices in Section [3.2](#).


    # ## 1.4 Union bound


    If $E_i$ are disjoint events, then the additivity axiom of probability tells us
    that


    $$\mathbb{P}\left(\bigcup_{i=1}^{n}E_i\right)=\sum_{i=1}^{n}\mathbb{P}(E_i).$$


    If the events $E_i$ are not disjoint, this identity may fail: each point belonging
    to several events $E_i$ is counted as one on the left hand side, but several times
    on the right hand side. Thus, instead of an equality, we get an inequality:


    **Lemma 1.4.1** (Union bound). *For any events* $E_1,\ldots,E_n$, *we have*


    $$\mathbb{P}\left(\bigcup_{i=1}^{n}E_i\right)\leq\sum_{i=1}^{n}\mathbb{P}(E_i).$$


    *Proof.* If the event $\bigcup_{i=1}^{n}E_i$ occurs, then at least one of the
    events $E_i$ occurs. Thus the indicators satisfy


    $$\mathbf{1}_{\cup_{i=1}^{n}E_i}\leq\sum_{i=1}^{n}\mathbf{1}_{E_i}. \tag{1.14}$$


    (The right hand side counts how many $E_i$ occur.) Now take expectations and use
    [(1.9)](#) and linearity of expectation to complete the proof. $\square$


    The union bound is typically used to bound the probability of a bad event.


    **Example 1.4.2** (Dense random graphs have no isolated vertices). Imagine that
    $n\geq 2$ freshmen arrive on campus. Friendships form randomly, with each pair
    of students becoming friends with probability $p$ independent of all other pairs.
    Let us show that if $p\geq 4\ln(n)/n$ then there are no friendless students with
    probability at least $1-1/n$.


    *Proof.* Call the students $1,\ldots,n$, and let $E_i$ denote the event that student
    $i$ is friendless. This means that none of the other $n-1$ students are friends
    with $i$, and these $n-1$ sad events are independent and have probability $1-p$
    each. Thus $\mathbb{P}(E_i)=(1-p)^{n-1}$.


    We would like to bound the probability of the bad event


    $$B=\{\text{there exists a friendless student}\}=\bigcup_{i=1}^{n}E_i.$$'
