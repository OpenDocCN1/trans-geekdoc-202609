  md: '# Chaining


    This chapter covers some of the central methods for bounding random processes
    $(X_t)_{t\in T}$. In Section 8.1, we introduce the *chaining* technique and use
    it to bound $\mathbb{E}\sup_{t\in T} X_t$ in terms of covering numbers of $T$,
    a result known as Dudley inequality. We illustrate it in Section 8.2 with an application
    to Monte Carlo integration and *empirical processes*.


    Then in Section 8.3 we introduce the *VC theory*, which gives combinatorial rather
    than metric insights into random processes. We apply it for *statistical learning
    theory* in Section 8.4.


    In Section 8.5, we refine the chaining method to *generic chaining* and get optimal,
    two-sided bounds on random processes, in terms of Talagrand’s $\gamma_2(T)$ functional
    (we only prove an the upper bound here). A useful consequence is Talagrand comparison
    inequality, which generalizes Sudakov-Fernique inequality for subgaussian processes.


    Finally, in Section 8.6, we use Talagrand comparison inequality to derive *Chevet
    inequality*, a handy tool for random bilinear forms over general sets.


    With everything you’ve learned, some exercises now feel like fun mini research
    results – Lipschitz law of large numbers in higher dimensions (Exercise 8.10),
    one-bit quantization (Exercise 8.26), the small ball method with applications
    to heavy-tailed random matrices (Exercise 8.27), and $p \to q$ norms of random
    matrices (Exercise 8.41), just to mention a few!


    # 8.1 Dudley inequality


    For a general Gaussian process $(X_t)_{t\in T}$, Sudakov inequality (Theorem 7.4.1)
    gives a *lower* bound on


    $\mathbb{E}\sup_{t\in T} X_t$


    in terms of the metric entropy of $T$. Now we will go for an *upper* bound. And
    instead of sticking just to Gaussian processes, we will take it further and handle
    more general, subgaussian ones.


