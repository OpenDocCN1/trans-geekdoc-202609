  md: 'and the reverse bounds are basically true too:


    # **Lemma 7.5.11** (Almost equivalent versions of Gaussian width). *For any bounded
    set $T \subset \mathbb{R}^n$, we have.*⁸


    +   (a) $\gamma(T - T) = 2w(T)$.

    +   (b) $h(T) \asymp \gamma(T) \asymp w(T) + \|y\|_2$ for any point $y \in T$.


    *In particular, if $T$ contains the origin, all three versions are equivalent.*


    $h(T) \asymp \gamma(T) \asymp w(T)$.


    *Proof* (a) follows from Proposition 7.5.2(e), since $T - T$ is origin-symmetric.

    (b) Let’s just prove the first part and leave the equivalence $\gamma(T) \asymp
    w(T) + \|y\|_2$ for you to prove in Exercise 7.20. We trivially have $\gamma(T)
    \le h(T)$. For the reverse, look at the function $z \mapsto \sup_{x\in T} |\langle
    z, x\rangle|$ on $\mathbb{R}^n$. Its Lipschitz norm is bounded by the radius $\sup_{x\in
    T} \|x\|_2 = r(T)$ (check!). Then, by Gaussian concentration (5.5),


    $\big\|\sup_{x\in T} |\langle g, x\rangle| - \gamma(T)\big\|_{\psi_2} \lesssim
    r(T)$.


    So, by triangle inequality and Proposition 2.6.6(ii), we get


    $h(T) = \big\|\sup_{x\in T} |\langle g, x\rangle|\big\|_{L^2} \lesssim \big\|\sup_{x\in
    T} |\langle g, x\rangle|\big\|_{\psi_2} \lesssim \gamma(T) + r(T) \lesssim \gamma(T)$.


    The last step used the fact that $\gamma(T) \gtrsim r(T)$, which comes from the
    second part of (b) – just take the supremum over $y \in T$.


    The Gaussian width helps us define a robust version of the notion of dimension.
    The usual linear-algebraic dimension of a set $T \subset \mathbb{R}^n$, which
    is the dimension of the smallest affine space containing it, can change a lot
    with tiny perturbations of $T$. Here is a more robust alternative:


    # **Definition 7.5.12** (Effective dimension). The *effective dimension* of a
    bounded set $T \subset \mathbb{R}^n$ is


    $d(T) := \frac{h(T - T)^2}{\operatorname{diam}(T)^2} \asymp \frac{w(T)^2}{\operatorname{diam}(T)^2}$.


    The equivalence follows from Lemma 7.5.11. The effective dimension is bounded
    by the linear-algebraic one:


    $d(T) \le \dim(T)$,

    with equality when $T$ is a Euclidean ball in some subspace (see Exercise 7.21).
    Unlike the usual dimension, the effective one is stable – small perturbations
    to $T$ only slightly change its width and diameter.


    To get some practice with effective dimension, compute it for ellipsoids (Exercise
    7.23) and bound it for general finite sets (Exercise 7.22).


    ⁸ Here, as usual, the notation $\asymp$ hides positive absolute constant factors.'
