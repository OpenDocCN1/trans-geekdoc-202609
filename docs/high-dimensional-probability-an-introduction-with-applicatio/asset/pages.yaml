  md: 'We do not prove isoperimetric inequalities (Theorems 5.1.4 ans 5.1.5) in this
    book; the bibliography notes for this chapter refer to several known proofs of
    these results.


    # 5.1.3 Blow-up of sets on the sphere


    The isoperimetric inequality leads to a remarkable and counter-intuitive result:
    if a set A covers at least half of the sphere in area, its ε-neighborhood A_ε
    will cover most of the sphere. We will state and prove this “blow-up” phenomenon
    and then try to explain it intuitively. To simplify things in view of Theorem
    5.1.3, we will work with the sphere of radius √n instead of the unit sphere.


    **Lemma 5.1.6 (Blow-up).** Let A be a subset of the sphere √n S^{n-1}, and let
    σ denote the normalized area on that sphere. If σ(A) ≥ 1/2, then,⁶ for every t
    ≥ 0, σ(A_t) ≥ 1 − 2 exp(−c t²).


    *Proof* Consider the hemisphere defined by the first coordinate: H := {x ∈ √n
    S^{n-1} : x₁ ≤ 0}.


    By assumption, σ(A) ≥ 1/2 = σ(H), so the isoperimetric inequality (Theorem 5.1.5)
    implies that σ(A_t) ≥ σ(H_t). (5.1)


    The neighborhood H_t of the hemisphere H is a spherical cap, and we could compute
    its area directly. It is, however, easier to use Theorem 3.4.5 instead, which
    states a random vector X ∼ Unif(√n S^{n-1}) is subgaussian, and ‖X‖_{ψ₂} ≤ C.
    Since σ is the uniform probability measure on the sphere, it follows that σ(H_t)
    = ℙ{X ∈ H_t}.


    Now, the definition of the neighborhood implies that H_t ⊃ {x ∈ √n S^{n-1} : x₁
    ≤ t/√2}. (5.2)


    (Check this – a picture would help.) Thus σ(H_t) ≥ ℙ{X₁ ≤ t/√2} ≥ 1 − 2 exp(−c
    t²).


    The last inequality holds because ‖X₁‖_{ψ₂} ≤ ‖X‖_{ψ₂} ≤ C. In view of (5.1),
    the lemma is proved.


    **Remark 5.1.7 (An even more dramatic blow-up).** The 1/2 value for the area in
    Lemma 5.1.6 was arbitrary and can be replaced with any constant, or even an exponentially
    small quantity! Verify this is Exercise 5.3.


    ⁶ Here the neighborhood A_t of a set A is defined in the same way as before, that
    is A_t := {x ∈ √n S^{n-1} : ∃y ∈ A such that ‖x − y‖₂ ≤ t}.'
