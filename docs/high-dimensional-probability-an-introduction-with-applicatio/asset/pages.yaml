  md: '# 7.4 Sudakov inequality


    Let’s go back to general mean-zero Gaussian processes $(X_t)_{t\in T}$ on any
    index set $T$. As we saw earlier (Remark 7.1.7), the increments


    $$d(t,s):=\|X_t-X_s\|_{L^2}=\bigl(\mathbb{E}(X_t-X_s)^2\bigr)^{1/2} \tag{7.13}$$


    define a metric on $T$, called the *canonical metric*. This metric determines
    the covariance function $\Sigma(t,s)$, which in turn determines the distribution
    of the process $(X_t)_{t\in T}$ (recall Remark 7.1.10). So, in theory, we can
    answer any question about the distribution of the process just by understanding
    the geometry of the metric space $(T,d)$ – in other words, we can study probability
    via geometry.


    Here is a big specific question: how can we estimate


    $$\mathbb{E}\sup_{t\in T}X_t \tag{7.14}$$


    in terms of the geometry of $(T,d)$? This is a hard problem, which we begin to
    study now and continue in Chapter 8.


    We will start with a lower bound on (7.14) in terms of *metric entropy*, which
    was introduced Section 4.2. Recall that for any $\varepsilon>0$, the *covering
    number*


    $$\mathcal{N}(T,d,\varepsilon)$$


    is the smallest cardinality of an $\varepsilon$-net of $T$ in the metric $d$,
    or equivalently the smallest number of closed balls of radius $\varepsilon$ whose
    union covers $T$. The logarithm of the covering number, $\log_2\mathcal{N}(T,d,\varepsilon)$,
    is called the *metric entropy* of $T$.


    **Theorem 7.4.1** (Sudakov inequality). Let $(X_t)_{t\in T}$ be a *mean-zero Gaussian
    process*. Then, for any $\varepsilon\ge 0$, we have


    $$\mathbb{E}\sup_{t\in T}X_t\ge c\varepsilon\sqrt{\log\mathcal{N}(T,d,\varepsilon)}.$$


    where $d$ is the canonical metric defined in (7.13).


    *Proof*  Let us deduce this result from Sudakov-Fernique comparison inequality
    (Theorem 7.2.8). Assume that


    $$\mathcal{N}(T,d,\varepsilon)=:N$$


    is finite; you will handle the infinite case in Exercise 7.4. Let $\mathcal{N}$
    be a maximal $\varepsilon$-separated subset of $T$. Then $\mathcal{N}$ is an $\varepsilon$-net
    of $T$ (recall Lemma 4.2.6), and thus


    $$|\mathcal{N}|\ge N.$$


    Restricting the process to $\mathcal{N}$, we see that it suffices to show that


    $$\mathbb{E}\sup_{t\in\mathcal{N}}X_t\ge c\varepsilon\sqrt{\log N}.$$


    $^5$ If $T$ does not have a finite $\varepsilon$-net, we set $\mathcal{N}(T,d,\varepsilon)=\infty$.'
