    \ its mean by $\\mu = \\mathbb{E}S_N$. Show that\n\n$$\\mathbb{P}\\{|S_N-\\mu|\\\
    ge \\delta\\mu\\}\\le 2\\exp\\left(-\\frac{\\delta^2\\mu}{2+\\delta}\\right) \\\
    quad\\text{for every }\\delta\\ge 0.$$\n\n2.15  \U0001F401  **(Chernoff inequality\
    \ for bounded random variables)** Argue that all versions of Chernoff inequality\
    \ (Theorem 2.3.1, Remark 2.3.2, and Corollary 2.3.4) are valid for any independent\
    \ random variables $X_i$ that take values in the interval $[0,1]$ and have means\
    \ $p_i$.\n\n2.16  \U0001F401\U0001F401  **(Median-of-means: fixing the proof)**\
    \ The proof of Theorem 2.4.1 is slightly flawed: $B=t^2/4$ may not be an integer\
