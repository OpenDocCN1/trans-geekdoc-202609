    # Theorem 9.7.2 (Dvoretzky-Milman theorem).


    Let $A$ be an $m \times n$ Gaussian random matrix with i.i.d. $N(0,1)$ entries,
    and $T \subset \mathbb{R}^n$ be a bounded set. Then the following holds with probability
    at least $0.99$:


    $$r_- B_2^m \subset \operatorname{conv}(AT) \subset r_+ B_2^m \tag{9.45}$$


    where $B_2^m$ denotes the unit Euclidean ball in $\mathbb{R}^m$, and


    $$r_\pm = w(T) \pm C\sqrt{m}\,\operatorname{rad}(T).$$


    The left inclusion holds only if $r_-$ is nonnegative; the right inclusion, always.


    Proof  Let’s express two-sided Chevet inequality (Theorem 9.7.1) in the following
    form:


    $$\mathbb{E}\sup_{y\in S}\Big|\sup_{x\in T}\langle Ax,y\rangle - w(T)\|y\|_2\Big|
    \le C\gamma(S)\operatorname{rad}(T),$$


    where $T \subset \mathbb{R}^n$ and $S \subset \mathbb{R}^m$. (To get this, just
    apply the theorem to $A^\top$ with $T$ and $S$ swapped.)


    Let $S$ be the sphere $S^{m-1}$; its Gaussian complexity satisfies $\gamma(S)
    \le \sqrt{m}$. Then, by Markov inequality, the following holds with probability
    at least $0.99$:


    $$\Big|\sup_{x\in T}\langle Ax,y\rangle - w(T)\Big| \le C\sqrt{m}\,\operatorname{rad}(T)\quad\text{for
    every }y\in S^{m-1}.$$


    By triangle inequality and definition of $r_\pm$, this implies


    $$r_- \le \sup_{x\in T}\langle Ax,y\rangle \le r_+\quad\text{for every }y\in S^{m-1}.$$


    Rewriting $\sup_{x\in T}\langle Ax,y\rangle$ as $\sup_{x\in AT}\langle x,y\rangle$
    and using homogeneity, we get


    $$r_-\|y\|_2 \le \sup_{x\in AT}\langle x,y\rangle \le r_+\|y\|_2\quad\text{for
    every }y\in \mathbb{R}^m.$$


    By duality, this is the same as $(9.45)$ (try Exercise 9.40 to work out the details
    of the duality argument).'
