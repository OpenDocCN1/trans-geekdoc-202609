  md: '# **Remark 9.4.6** (Convex relaxation).


    If $T$ is not convex, we can just replace it with its convex hull $\operatorname{conv}(T)$.
    This turns (9.18) into a convex (and thus tractable) problem. The recovery guarantees
    from Theorem 9.4.4 do not change, since $w(\operatorname{conv}(T)) = w(T)$ by
    Proposition 7.5.2(c).


    The approach we covered is pretty flexible. Try it out yourself: analyze the mean
    squared error (Exercise 9.17), recovery via optimization (Exercise 9.18) and the
    noisy case (9.16) (Exercise 9.19).


    # **Remark 9.4.7** (Unconstrained optimization).


    Forcing strict rules on the solution like $y = A x''$ and $x'' \in T$ in (9.18)
    can be too rigid – noise or a bad choice of $T$ might mean no solution exists.
    A safer move is to relax the rules and just *penalize* how much they are broken.


    So, given noisy measurements


    $$y = A x + w,$$


    a good way to recover $x$ is by solving the *unconstrained* convex problem:


    $$\operatorname{minimize} \|y - A x''\|_2^2 + \lambda \|x''\|_T \quad \text{over
    all } x'' \in \mathbb{R}^n, \tag{9.20}$$


    where $\|\cdot\|_T$ is any norm you like and $\lambda > 0$ tunes the tradeoff
    between fitting the observations $y$ and keeping the solution $x''$ structured
    (small $\|x\|_T$). Adjusting $\lambda$ lets you decide which to prioritize.


    Now, try Exercise 9.20 to prove the recovery guarantee: if $A$ is an $m \times
    n$ random matrix, and $\lambda$ is chosen well, then the solution $\hat{x}$ satisfies


    $$\mathbb{E}\|\hat{x} - x\|_2 \lesssim \frac{w(T)\|x\|_T + \|w\|_2}{\sqrt{m}},$$


    where $T$ is the unit ball of $\|\cdot\|_T$. In short: if $x$ is well structured
    (small $\|x\|_T$) and the noise $w$ is small ($o(1)$ per observation), then you
    can recover $x$ accurately from $m \asymp d(T)$ observations, where $d(T)$ is
    the effective dimension of $T$.


    If this feels a bit abstract, two examples will make it clear.


    # **9.4.2 Example: sparse recovery**


    Sometimes we believe that $x$ is *sparse* – most of its entries are zero or nearly
    zero. For instance, in the genetic study (Example 9.4.2), maybe only $\sim 10$
    genes really affect a disease, and we want to find those. In other applications,
    $x$ may be sparse in some basis: the audio signal from Example 9.4.1 is not sparse
    in time (see Figure 9.5), but its Fourier transform could be sparse – band-limited
    to a small frequency range.


    We can quantify the sparsity of $x \in \mathbb{R}^n$ by the number of nonzero
    entries:


    $$\|x\|_0 := |\operatorname{supp}(x)| = |\{i : x_i \neq 0\}|, \tag{9.21}$$


    and we say that $x$ is $s$-sparse if $\|x\|_0 \le s$. The “$\ell^0$ norm” $\|x\|_0$
    is not really a norm, but is a limit of $\ell^p$ norms as $p \to 0$ (see Exercise
    9.23).'
