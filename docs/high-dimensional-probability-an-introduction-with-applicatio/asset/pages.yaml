  md: '8.15 ☕☕☕ (VC dimension of squares) Let $\mathcal{F}$ be the class of indicators
    of all closed axis-aligned squares – sets of the form $[a, a + d] \times [b, b
    + d]$ in $\mathbb{R}^2$. Show that $\operatorname{vc}(\mathcal{F}) = 3.$


    8.16 ☕☕ (VC dimension of polygons) Let $\mathcal{F}$ be the class of indicators
    of all convex polygons in $\mathbb{R}^2$, without any restriction on the number
    of vertices. Show that $\operatorname{vc}(\mathcal{F}) = \infty.$


    8.17 ☕☕☕ (VC dimension of half-spaces) Prove the result in Example 8.3.5: if $\mathcal{F}$
    is the class of indicators of all half-planes in $\mathbb{R}^n$, then $\operatorname{vc}(\mathcal{F})
    = n + 1.$


    8.18 ☕☕ (VC dimension vs. algebraic dimension) Show that for any finite-dimensional
    class of Boolean functions $\mathcal{F}$ on a domain $\Omega$, we have $\operatorname{vc}(\mathcal{F})
    \le \dim(\mathcal{F})$, where $\dim(\mathcal{F})$ denotes the linear algebraic
    dimension of $\mathcal{F}$, i.e. the maximal number of linearly independent functions
    in $\mathcal{F}$.


    8.19 ☕☕ (Sharpness of Pajor and Sauer-Shelah lemmas) Show that both Pajor Lemma
    8.3.7 and Sauer-Shelah Lemma 8.3.9 are sharp by considering the set $\mathcal{F}$
    of binary strings of length $n$ with at most $d$ ones (this set is often called
    a Hamming ball).


    8.20 ☕ (VC dichotomy) Let $\mathcal{F}$ be a class of Boolean functions on some
    domain. Prove that the growth function $\Pi_{\mathcal{F}}(n)$ can only grow either
    polynomially or exponentially, and nothing in between. More rigorously, prove
    that either $\Pi_{\mathcal{F}}(n) = 2^n$ for all $n$, or there exists a polynomial
    $p(n)$ such that $\Pi_{\mathcal{F}}(n) \le p(n)$ for all $n$.


    8.21 ☕☕ (VC stability) In Proposition 8.3.11, we observed how the VC dimension
    is stable when we combined two function classes by taking pointwise minima or
    maxima. Let us generalize this observation for any number of classes, and for
    any way of combining them. Let $\mathcal{F}_1,\dots,\mathcal{F}_k$ be classes
    of Boolean functions on the same domain. Fix any function $\phi : \{0,1\}^k \to
    \{0,1\}$, which we can think of a Boolean formula. Consider the class $\mathcal{F}
    = \{\phi(f_1,\dots,f_k) : f_1 \in \mathcal{F}_1,\dots,f_k \in \mathcal{F}_k\}$.
    Prove that if $\operatorname{vc}(F_i) \le d$ for every $i$, then $\operatorname{vc}(\mathcal{F})
    \le C d k \log k$ where $C$ is an absolute constant.


    8.22 ☕☕☕☕ (VC dimension of the union)

    (a) Let $\mathcal{F}$ and $\mathcal{G}$ classes of Boolean functions on the same
    domain. Prove that $\operatorname{vc}(\mathcal{F} \cup \mathcal{G}) \le \operatorname{vc}(\mathcal{F})
    + \operatorname{vc}(\mathcal{G}) + 1.$'
