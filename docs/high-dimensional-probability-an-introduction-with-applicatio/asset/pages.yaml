  md: '# 7.1.1 Covariance and increments


    In Section 3.2, we introduced the notion of the covariance matrix of a random
    vector. We now define the *covariance function* of a random process $(X_t)_{t\in
    T}$ in a similar manner. For simplicity, let us assume in this section that the
    random process has zero mean, i.e.


    $$\mathbb{E} X_t = 0 \quad \text{for all } t \in T.$$


    (The adjustments for the general case will be obvious.) The covariance function
    of the process is defined as


    $$\Sigma(t,s) := \operatorname{cov}(X_t,X_s) = \mathbb{E} X_t X_s, \quad t,s \in
    T.$$


    The *increments* of the random process are defined as


    $$d(t,s) := \|X_t - X_s\|_{L^2} = \big(\mathbb{E}(X_t - X_s)^2\big)^{1/2}, \quad
    t,s \in T. \tag{7.1}$$


    # **Example 7.1.6.** The increments of the standard Brownian motion satisfy


    $$d(t,s) = \sqrt{t-s}, \quad t \ge s$$


    by definition. The increments of a random walk of Example 7.1.3 with $\mathbb{E}
    Z_i^2 = 1$ behave similarly:


    $$d(n,m) = \sqrt{n-m}, \quad n \ge m.$$


    (Check!)


    # **Remark 7.1.7** (The canonical metric). Even if the index $T$ has no geometric
    structure, the increments $d(t,s)$ always define a *metric* on $T$, thus automatically
    turning $T$ into a *metric space.*$^1$ However, as we see in Example 7.1.6, this
    metric may not match the Euclidean distance on $\mathbb{R}^n$.


    # **Remark 7.1.8** (Covariance vs. increments). The covariance and the increments
    contain roughly the same information about the random process. Increments can
    be written using the covariance: just expand the square in (7.1) to see that


    $$d(t,s)^2 = \Sigma(t,t) - 2\Sigma(t,s) + \Sigma(s,s).$$


    Vice versa, if the zero random variable $0$ belongs to the process, you can also
    recover the covariance from the increments (see Exercise 7.1).


    # 7.1.2 Gaussian processes


    # **Definition 7.1.9** (Gaussian process). A random process $(X_t)_{t\in T}$ is
    called a *Gaussian process* if, for any finite subset $T_0 \subset T$, the random
    vector $(X_t)_{t\in T_0}$ has normal distribution. Equivalently, $(X_t)_{t\in
    T}$ is Gaussian if every finite linear combination $\sum_{t\in T_0} a_t X_t$ is
    a normal random variable. (To see why these two are equivalent, recall Exercise
    3.16.)


    $^1$ More precisely, $d(t,s)$ is a *pseudometric* on $T$ since the distance between
    two distinct points can be zero, i.e. $d(t,s)=0$ does not necessarily imply $t=s$.'
