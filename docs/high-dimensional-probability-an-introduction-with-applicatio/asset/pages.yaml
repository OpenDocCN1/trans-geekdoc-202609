  md: '3.17 Randomly flip the sign of X ~ N(0,1).

    3.18 Think of G and UG as vectors in ℝ^{n×n}. Check that the mapping G ↦ UG is
    a linear orthogonal transformation, then use the rotation invariance of the normal
    distribution.

    3.19 Represent A using part (a) and use the invariance for G established in Exercise
    3.18.

    3.20 Check that the random vector (Gu, Gv) ∈ ℝ^{2m} obtained by concatenation
    is isotropic.

    3.23 (a) Choose x to be the unit vector in the direction of g₁. Check that, with
    high probability, ⟨g₁, x⟩ > √n/2 while ⟨g₁, x⟩ < √n/2 for all j = 2, …, N.

    3.24 Let r = ‖X‖₂. Compute the CDF of r and differentiate to deduce the density.

    3.25 Use Exercise 3.24 to check that 𝔼‖Y‖₂² = n. Then argue like in the proof
    of Proposition 3.3.8.

    3.26 Argue that we can write ‖X‖∞ = ‖g‖∞ / ‖g‖₂ where g ~ N(0, Iₙ). To prove the
    upper bound, use the Cauchy-Schwarz inequality and a small ball probability bound
    (Exercise 3.7). For the lower bound, use concentration of the norm to control
    ‖g‖₂ and a direct computation using independence to control ‖g‖∞.

    3.27 First, consider n = 2 (the unit circle in the plane), and compute the density
    of the first coordinate of X. Make a plot and note that the density at x is proportional
    to the arclength that projects onto the interval [x, x+ε]. Check that this is
    proportional to g(x) = ε/√1 − x² + o(ε). Now try n = 3 and then a general n.

    3.28 (b) You should be able to express the squared distance to the cube as ∑_{i=1}^n
    (|g_i| − a)_+², where x_+ = max(x,0). Show that the expected distance is small
    if a is large enough. On the other hand, ‖g‖₂ is unlikely to be very small due
    to the concentration of the norm.

    3.30 For example, use the criterion in Exercise 3.29.

    3.33 Note that ⟨UX, v⟩ = ⟨X, Uᵀv⟩ and that Uᵀ is an orthogonal matrix.

    3.34 Note that Av is a mean-zero random vector with independent coordinates. Use
    Lemma 3.4.2 to bound its subgaussian norm.

    3.35 Consider a one-dimensional marginal of ∑_i X_i, and use Proposition 2.7.1
    to bound its subgaussian norm.

    3.36 (a) Argue as in Lemma 3.4.2, but use triangle inequality instead of Proposition
    2.7.1.

    3.38 Exercise 3.14 describes the distribution of 1D marginals of X. Exercise 2.24(c)
    gives their subgaussian norm. Proposition 3.2.2 allows you to maximize that expression.

    3.39 (a) Apply Lemma 2.8.5 and the triangle inequality.

    3.40 (a) If Y is an independent copy of X, you can use Bernstein''s inequality
    to bound |⟨X, Y⟩| above, and concentration of norm to bound ‖X‖₂ and ‖Y‖₂ below,
    all with high probability.

    (b) An idea is to slightly modify an isotropic vector near the origin. For example,
    flip a biased coin. If it is heads (likely), pick X as the first basis vector,
    appropriately scaled. If it is tails (unlikely), sample X from a normal distribution
    on the orthogonal hyperplane ℝ^{n−1}.

    3.41 (a) Use a conditioning trick: condition on Y and apply Theorem 3.4.5.

    3.42 Use the decomposition from Exercise 3.24.

    3.43 To bound the subgaussian norm of a 1D marginal ⟨X, v⟩, first get basic bounds
    on the L² and L∞ norms, and then interpolate them using Exercise 2.35. For the
