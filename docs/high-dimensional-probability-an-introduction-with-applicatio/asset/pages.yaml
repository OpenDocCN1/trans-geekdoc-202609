  md: 'where $g\sim N(0,I_n)$ and $h\sim N(0,I_m)$ are independent Gaussian vectors.
    The increments of this process are


    $$\begin{aligned}

    \mathbb{E}(Y_{uv}-Y_{wz})^2

    &=\mathbb{E}\left(\langle g,u-w\rangle+\langle h,v-z\rangle\right)^2\\

    &=\mathbb{E}\langle g,u-w\rangle^2+\mathbb{E}\langle h,v-z\rangle^2\quad\text{(by
    independence, mean 0)}\\

    &=\|u-w\|_2^2+\|v-z\|_2^2\quad\text{(since $g,h$ are standard normal).}

    \end{aligned}$$


    Comparing the increments of the two processes, we see that


    $$\mathbb{E}(X_{uv}-X_{wz})^2\leq\mathbb{E}(Y_{uv}-Y_{wz})^2\quad\text{for all
    }(u,v),(w,z)\in T,$$


    as required in Sudakov-Fernique inequality. Applying Theorem 7.2.8, we obtain


    $$\begin{aligned}

    \mathbb{E}\|A\|&=\mathbb{E}\sup_{(u,v)\in T}X_{uv}\leq\mathbb{E}\sup_{(u,v)\in
    T}Y_{uv}\\

    &=\mathbb{E}\sup_{u\in S^{n-1}}\langle g,u\rangle+\mathbb{E}\sup_{v\in S^{m-1}}\langle
    h,v\rangle\\

    &=\mathbb{E}\|g\|_2+\mathbb{E}\|h\|_2\\

    &\leq\left(\mathbb{E}\|g\|_2^2\right)^{1/2}+\left(\mathbb{E}\|h\|_2^2\right)^{1/2}\quad\text{(recall
    Exercise 1.11)}\\

    &=\sqrt n+\sqrt m\quad\text{(see Proposition 3.2.1(b)).}

    \end{aligned}$$


    Theorem 7.3.1 only gives an expectation bound, but we can boost it to a high-probability
    bound using the concentration tools from Section 5.2:


    # **Corollary 7.3.2 (Norms of Gaussian random matrices: tails).**


    *Let $A$ be an $m\times n$ matrix with independent $N(0,1)$ entries. Then for
    every $t\geq 0$, we have*


    $$\mathbb{P}\{\|A\|\geq\sqrt m+\sqrt n+t\}\leq 2\exp(-ct^2).$$


    **Proof.** Let’s combine the expectation bound (Theorem 7.3.1) with Gaussian concentration
    (Theorem 5.2.3). Think of $A$ as a long random vector in $\mathbb{R}^{m\times
    n}$ by concatenating the rows. This makes $A$ a standard normal random vector:
    $A\sim N(0,I_{nm})$. Consider the function


    $$f(A):=\|A\|$$


    that maps the vectorized matrix to the matrix’s operator norm. Since the operator
    norm is bounded by Frobenius norm, and the Frobenius norm is just the Euclidean
    norm on $\mathbb{R}^{m\times n}$, $f$ is a Lipschitz function on $\mathbb{R}^{m\times
    n}$ with Lipschitz norm bounded by 1. (Why?) Then Theorem 5.2.3 yields


    $$\mathbb{P}\{\|A\|\geq\mathbb{E}\|A\|+t\}\leq 2\exp(-ct^2).$$


    The bound on $\mathbb{E}\|A\|$ from Theorem 7.3.1 completes the proof.


    Now try Exercise 7.11 to prove that a *symmetric Gaussian matrix* satisfies


    $$\mathbb{E}\|A\|\leq 2\sqrt n,$$


    and Exercise 7.13 to show that the *smallest singular value* of an $m\times n$
    Gaussian matrix $A$ satisfies


    $$\mathbb{E}\,s_n(A)\geq\sqrt m-\sqrt n.$$'
