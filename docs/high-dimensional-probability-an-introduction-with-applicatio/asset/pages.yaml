  md: 'Let’s apply Corollary 8.5.6 for the canonical Gaussian process $Y_x=\langle
    g,x\rangle$ on a set $T\subset\mathbb{R}^n$, where $g\sim N(0,I_n)$. Recall from
    Section 7.5 that


    $$w(T)=\mathbb{E}\sup_{x\in T}\langle g,x\rangle$$


    is the *Gaussian width* of the set $T$. We immediately get the following:


    **Corollary 8.5.8** (Talagrand comparison inequality: geometric form). *Let $(X_x)_{x\in
    T}$ be a mean-zero random process on a subset $T\subset\mathbb{R}^n$. Assume that*


    $$\|X_x-X_y\|_{\psi_2}\le K\|x-y\|_2 \quad\text{for all }x,y\in T.$$


    *Then*


    $$\mathbb{E}\sup_{x\in T}X_x\le CKw(T).$$


    **Remark 8.5.9** (Subgaussian width $\lesssim$ Gaussian width). A nice consequence:
    if $X$ is a subgaussian random vector in $\mathbb{R}^n$, then


    $$\mathbb{E}\sup_{t\in T}\langle X,t\rangle\le CKw(T) \quad\text{for any bounded
    set }T\subset\mathbb{R}^n,$$


    where $K=\|X\|_{\psi_2}$. Just apply Corollary 8.5.8 to the process $(\langle
    X,x\rangle)_{x\in T}$, whose increments satisfy $|\langle X,x\rangle-\langle X,y\rangle|=|\langle
    X,x-y\rangle|\le K\|x-y\|_2$ by definition of a subgaussian random vector.


    For practice, try proving a few versions of Talagrand comparison (Exercise 8.37)
    and use it to get sharp bounds on the $\ell^p$ norms of subgaussian vectors (Exercise
    8.38).


    # 8.6 Chevet inequality


    Talagrand comparison inequality (and more generally generic chaining) is a powerful
    tool that works in a wide range of settings. Let’s use it to get a very general
    uniform bound for a random quadratic form:


    $$\sup_{x\in T,\,y\in S}\langle Ax,y\rangle\le ?$$


    where $A$ is a random matrix and $T,S$ are any bounded sets.


    A special case where $T$ and $S$ are Euclidean balls leads to the operator norm
    of $A$, which we already studied in Theorems 4.4.3 and 7.3.1. Now let’s go general
    and consider arbitrary sets, with the goal of bounding things using just two geometric
    quantities: the *Gaussian width* and the *radius*, defined as


    $$\operatorname{rad}(T):=\sup_{x\in T}\|x\|_2. \tag{8.51}$$


    **Theorem 8.6.1** (Subgaussian Chevet inequality). *Let $A$ be an $m\times n$
    random matrix with independent, mean-zero, subgaussian rows $A_i$. Let $T\subset\mathbb{R}^n$
    and $S\subset\mathbb{R}^m$ be arbitrary bounded sets. Then*


    $$\mathbb{E}\sup_{x\in T,\,y\in S}\langle Ax,y\rangle\le CK\big[w(T)\operatorname{rad}(S)+w(S)\operatorname{rad}(T)\big]$$'
