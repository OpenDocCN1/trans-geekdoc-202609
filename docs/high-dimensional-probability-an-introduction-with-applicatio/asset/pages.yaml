  md: '# ## 2.9 Bernstein inequality


    We are ready to state and prove a version of Hoeffding’s inequality (Theorem [2.7.3](#))
    that works for subexponential distributions:


    **Theorem 2.9.1** (Subexponential Bernstein inequality). *Let* $X_1,\ldots,X_N$
    *be independent, mean-zero, subexponential random variables. Then, for every*
    $t\ge 0$, *we have*


    $$\mathbb{P}\left\{\left|\sum_{i=1}^{N}X_i\right|\ge t\right\}\le 2\exp\left[-c\min\left(\frac{t^2}{\sum_{i=1}^{N}\|X_i\|_{\psi_1}^2},\frac{t}{\max_i\|X_i\|_{\psi_1}}\right)\right].$$


    where $c>0$ is an absolute constant.


    If this bound seems a bit intimidating, do not worry—we will break it down and
    simplify it after the proof.


    **Proof.** We use the exponential moment method, which we learned in the proof
    of Hoeffding and Chernoff inequalities (Theorems [2.2.1](#) and [2.3.1](#)). Denote
    $S_N=\sum_{i=1}^{N}X_i$, multiply both sides of the inequality $S_N\ge t$ by a
    parameter $\lambda\ge 0$, exponentiate, and use Markov inequality and independence.
    This leads to (2.9):


    $$\mathbb{P}\{S_N\ge t\}\le e^{-\lambda t}\prod_{i=1}^{N}\mathbb{E}\exp(\lambda
    X_i). \tag{2.27}$$


    To bound the MGF of each term $X_i$, we use property **(iv)** in Proposition [2.8.1](#).
    It says that if $\lambda$ is small enough so that


    $$|\lambda|\le \frac{c}{\max_i\|X_i\|_{\psi_1}}, \tag{2.28}$$


    then<sup>8</sup> $\mathbb{E}\exp(\lambda X_i)\le \exp(C\lambda^2\|X_i\|_{\psi_1}^2)$.
    Substituting this into (2.27), we obtain


    $$\mathbb{P}\{S_N\ge t\}\le \exp(-\lambda t+C\lambda^2\sigma^2),\qquad \text{where
    }\sigma^2=\sum_{i=1}^{N}\|X_i\|_{\psi_1}^2.$$


    Now we minimize this expression in $\lambda$ subject to the constraint (2.28).
    The optimal choice is $\lambda=\min\left(\frac{t}{2C\sigma^2},\frac{c}{\max_i\|X_i\|_{\psi_1}}\right)$,
    for which we obtain


    $$\mathbb{P}\{S_N\ge t\}\le \exp\left[-\min\left(\frac{t^2}{4C\sigma^2},\frac{ct}{2\max_i\|X_i\|_{\psi_1}}\right)\right].$$


    Repeating this argument for $-X_i$ instead of $X_i$, we obtain the same bound
    for $\mathbb{P}\{-S_N\ge t\}$. Combining these two bounds completes the proof.


    To make Theorem [2.9.1](#) more handy, let us apply it for $a_iX_i$ instead of
    $X_i$. This gives us a version of (2.20) for subexponential distributions:


    <sup>8</sup> Recall that by Proposition [2.8.1](#) and definition of the subexponential
    norm, property **(iv)** holds for a value of $K_4$ that is within an absolute
    constant factor of $\|X\|_{\psi_1}$.'
