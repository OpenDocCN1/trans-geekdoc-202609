  md: '# Proposition 9.2.1 (Sizes of random projections of sets).


    Let $T \subset \mathbb{R}^n$ be a bounded set, and let $A$ be an $m \times n$
    matrix with independent, isotropic and sub-gaussian rows $A_i$. Then the scaled
    matrix $P = \frac{1}{\sqrt{n}}A$ (a “subgaussian projection”) satisfies


    $$\mathbb{E}\,\mathrm{diam}(PT) \le \sqrt{\frac{m}{n}}\,\mathrm{diam}(T) + C K^2
    w_s(T).$$


    Here $K = \max_i \|A_i\|_{\psi_2}$ and $w_s(T)$ is the spherical width of $T$
    (recall Section 7.5.1).


    This is a bit sharper that our older bounds (Theorem 7.6.1 and Exercise 7.25)
    – there is no constant factor in front of $\sqrt{m/n}$.


    Proof Theorem 9.1.1 implies via triangle inequality:


    $$\mathbb{E}\sup_{x\in T}\|Ax\|_2 \le \sqrt{m}\sup_{x\in T}\|x\|_2 + C K^2 \gamma(T),$$


    which we can rewrite in terms of the radii of $AT$ and $T$:


    $$\mathbb{E}\,\mathrm{rad}(AT) \le \sqrt{m}\,\mathrm{rad}(T) + C K^2 \gamma(T).$$


    Apply this bound for the difference set $T - T$ instead of $T$ to get


    $$\mathbb{E}\,\mathrm{diam}(AT) \le \sqrt{m}\,\mathrm{diam}(T) + 2 C K^2 w(T),$$


    where we used Lemma 7.5.11(a) to pass from Gaussian complexity to Gaussian width.
    Divide both sides by $\sqrt{n}$ to complete the proof.


    Now try this: upgrade the expectation bound in Proposition 9.2.1 to a high-probability
    one (Exercise 9.7) and analyze the actual random projections (rather than “Gaussian”
    ones) in Exercise 9.8.


    # 9.2.3 Covariance estimation for low-dimensional distributions


    Let’s revisit the covariance estimation problem from Section 4.7, where we want
    to estimate the covariance matrix $\Sigma = \mathbb{E} X X^{\mathsf T}$ of an
    $n$-dimensional distribution from $m$ i.i.d. samples using the sample covariance
    matrix $\Sigma_m = \frac{1}{m}\sum_{i=1}^m X_i X_i^{\mathsf T}$.


    In general, $m = O(n \log n)$ samples are enough (Section 5.6), but for subgaussian
    distributions, $m = O(n)$ is enough (Section 4.7).


    It gets even better for approximately low-dimensional distributions. If a distribution
    concentrates near an $r$-dimensional subspace, $m = O(r \log n)$ samples suffice
    (Remark 5.6.3). Now we will show that for subgaussian distributions, $m = O(r)$
    samples suffices:


    # Theorem 9.2.2 (Covariance estimation for low-dimensional distributions).


    Let $X$ be a subgaussian random vector in $\mathbb{R}^n$. More specifically, assume
    that there exists $K \ge 1$ such that


    $$\big\|\langle X, x\rangle\big\|_{\psi_2} \le K \big\|\langle X, x\rangle\big\|_{L^2}
    \quad \text{for any } x \in \mathbb{R}^n.$$'
