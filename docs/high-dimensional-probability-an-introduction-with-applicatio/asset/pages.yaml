  md: 'Then, for every positive integer $m$, we have


    $$\mathbb{E}\|\Sigma_m - \Sigma\| \le C K^4\left(\sqrt{\frac{r}{m}}+\frac{r}{m}\right)\|\Sigma\|,$$


    where $r = \operatorname{tr}(\Sigma)/\|\Sigma\|$ is the effective rank of $\Sigma$
    – a measure of the effective dimension of the data (see Remark 5.6.3).


    Proof  We start as in Theorem 4.7.1 by bringing the distribution to the isotropic
    position: $X = \Sigma^{1/2} Z$ and $X_i = \Sigma^{1/2} Z_i$ where $Z$ and $Z_i$
    are isotropic, and


    $$\begin{aligned}

    \|\Sigma_m - \Sigma\| &= \|\Sigma^{1/2} R_m \Sigma^{1/2}\| \quad (\text{where
    } R_m = \frac{1}{m}\sum_{i=1}^m Z_i Z_i^T - I_n)\\

    &= \max_{x\in S^{n-1}} |x^T \Sigma^{1/2} R_m \Sigma^{1/2} x| \quad (\text{see
    Remark 4.1.12})\\

    &= \max_{x\in T} |x^T R_m x| \quad (\text{if we define the ellipsoid } T := \Sigma^{1/2}
    S^{n-1})\\

    &= \max_{x\in T} \left|\frac{1}{m}\sum_{i=1}^m \langle Z_i, x\rangle^2 - \|x\|_2^2\right|
    \quad (\text{by definition of } R_m)\\

    &= \frac{1}{m}\max_{x\in T} \big\|A x\|_2^2 - m\|x\|_2^2\big\|,

    \end{aligned}$$


    where $A$ is the $m \times n$ matrix with rows $Z_i$. As in the proof of Theorem
    4.7.1, $Z_i$ are isotropic, and satisfy $\|Z_i\|_{\psi_2} \lesssim 1$. (For simplicity,
    let’s hide the dependence on $K$ in this argument.) This allows us to apply matrix
    deviation inequality for $A$ (in the form given in Exercise 9.3), which gives


    $$\mathbb{E}\|\Sigma_m - \Sigma\| \lesssim \frac{1}{m}\big(\gamma(T)^2 + \sqrt{m}\,\operatorname{rad}(T)\gamma(T)\big).$$


    The radius and Gaussian complexity of the ellipsoid $T = \Sigma^{1/2} S^{n-1}$
    satisfy


    $$\operatorname{rad}(T) = \|\Sigma\|^{1/2} \quad \text{and} \quad \gamma(T) \le
    (\operatorname{tr}\Sigma)^{1/2}$$


    (check!). So,


    $$\mathbb{E}\|\Sigma_m - \Sigma\| \lesssim \frac{1}{m}\Big(\operatorname{tr}\Sigma
    + \sqrt{m\|\Sigma\|\operatorname{tr}\Sigma}\Big).$$


    Substitute $\operatorname{tr}(\Sigma) = r\|\Sigma\|$ and simplify the bound to
