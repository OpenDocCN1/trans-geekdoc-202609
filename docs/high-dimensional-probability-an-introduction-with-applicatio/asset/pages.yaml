  md: 'By independence, $a + Av$ is a Gaussian random vector that we can write as


    $$a + Av = a + \|v\|_2 g, \quad \text{where} \quad g \sim N(0, I_m)$$


    (again by Exercise 3.20.) We claim that the function


    $$z \mapsto f(a + \|v\|_2 z)$$


    is Lipschitz with respect to the Euclidean norm on $\mathbb{R}^m$, with Lipschitz
    norm bounded by $\|v\|_2$. To check this, fix any $t, s \in \mathbb{R}^m$ and
    use subadditivity of $f$ (in the form of Exercise 9.34) to get


    $$f(a + \|v\|_2 t) - f(a + \|v\|_2 s) \le f(\|v\|_2 t - \|v\|_2 s)$$ $$= \|v\|_2
    f(t - s) \quad \text{(by positive homogeneity)}$$ $$\le \|v\|_2 \|t - s\|_2 \quad
    \text{(using (9.36) with $b = 1$)},$$


    proving our claim.


    Concentration in the Gauss space (Theorem 5.2.3) then yields


    $$\|f(a + Av) - \mathbb{E}_a f(a + Av)\|_{\psi_2(a)} \le C \|v\|_2, \tag{9.41}$$


    where the index “a” reminds us that these bounds are valid for the conditional
    distribution, with $a = Au$ fixed.


    # **Step 3: Removing the conditioning.**


    Since the random vector $a - Av$ has the same distribution as $a + Av$ (why?),
    it satisfies the same bound:


    $$\|f(a - Av) - \mathbb{E}_a f(a - Av)\|_{\psi_2(a)} \le C \|v\|_2, \tag{9.42}$$


    Subtract (9.42) from (9.41), use triangle inequality and the fact that the expectations
    are the same; this gives


    $$\|f(a + Av) - f(a - Av)\|_{\psi_2(a)} \le 2C \|v\|_2.$$


    This bound holds conditionally for any fixed $a = Au$. Therefore, it holds for
    the original distribution, too:


    $$\|f(a + Av) - f(a - Av)\|_{\psi_2} \le 2C \|v\|_2.$$


    (Why?) Passing back to the $x, y$ notation by (9.40), we obtain the desired inequality
    (9.39).


    We proved the theorem for any unit vectors $x, y$. To extend it to the general
    case, argue exactly as in Step 4 in the proof of Theorem 9.1.2 (check!). $\square$


    # **Remark 9.6.5.**


    It is an open question if Theorem 9.6.3 holds for general subgaussian matrices
    $A$.


    To practice, try Exercises 9.35 and 9.36 to get an anisotropic and a high-probability
    versions of Theorem 9.6.3.'
