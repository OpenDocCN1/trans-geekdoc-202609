  md: 'approximation. In particular, since any norm on \(\mathbb{R}^n\) is a convex
    function, Jensen inequality yields


    $$\|\mathbb{E}\,X\| \leq \mathbb{E}\|X\|.$$ \tag{1.19}


    The \(L^p\) norms of a given random variable \(X\) are increasing in \(p\):


    $$\|X\|_{L^p} \leq \|X\|_{L^q}\qquad\text{whenever }p\leq q,$$ \tag{1.20}


    see Exercise [1.11].


    *Minkowski inequality* states that for any \(p\in[1,\infty]\) and any random variables
    \(X,Y\in L^p\), we have


    $$\|X+Y\|_{L^p}\leq\|X\|_{L^p}+\|Y\|_{L^p}.$$ \tag{1.21}


    In other words, the \(L^p\) norm satisfies the triangle inequality.


    *Cauchy-Schwarz inequality* states that for any random variables \(X,Y\in L^2\),
    we have


    $$\|XY\|_{L^1}\leq\|X\|_{L^2}\|Y\|_{L^2}.$$


    The *Hölder inequality* generalizes this result to the \(L^p\) norms. For any
    pair of conjugate exponents \(p,p''\in[1,\infty]\) (introduced in (1.5)) and any
    pair of random variables \(X\in L^p\) and \(Y\in L^{p''}\), we have


    $$\|XY\|_{L^1}\leq\|X\|_{L^p}\|Y\|_{L^{p''}}.$$ \tag{1.22}


    As we recall from a basic probability course, the *distribution* of a random variable
    \(X\) is, intuitively, the information about what values \(X\) takes with what
    probabilities. More rigorously, the distribution of \(X\) is determined by the
    *cumulative distribution function* (CDF) of \(X\), defined as


    $$F_X(t)=\mathbb{P}\{X\leq t\},\qquad t\in\mathbb{R}.$$


    It is often more convenient to work with *tails* of random variables, namely with


    $$\mathbb{P}\{X>t\}=1-F_X(t).$$


    The following result allows us to compute expectation in terms of the tails.


    # **Lemma 1.6.1** (Integrated tail formula). *Any nonnegative random variable*
    \(X\) *satisfies*


    $$\mathbb{E}\,X=\int_0^\infty\mathbb{P}\{X>t\}\,dt.$$


    *The two sides of this identity are either finite or infinite simultaneously.*


    ⁴ This might sound a little bit confusing when we recall from (1.4) that the \(\ell^p\)
    norms are decreasing in \(p\). There is no contradiction because the \(\ell^p\)
    and \(L^p\) norms are normalized differently. The \(\ell^p\) norm of a vector
    \(x=(x_1,\ldots,x_n)\) is \(\|x\|_{\ell^p}=(\sum_{i=1}^n|x_i|^p)^{1/p}\), while
    the \(L^p\) norm of a random variable \(X\) that takes values \(x_1,\ldots,x_n\)
    with probabilities \(1/n\) each is \(\|X\|_{L^p}=(\frac{1}{n}\sum_{i=1}^n|x_i|^p)^{1/p}\).'
