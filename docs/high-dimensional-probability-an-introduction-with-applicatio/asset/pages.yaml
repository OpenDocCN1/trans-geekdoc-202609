    random matrix with i.i.d. $N(0,1)$ entries, and let $f : \mathbb{R}^m \to \mathbb{R}$
    be a positive homogenous and subadditive function satisfying (9.36). Then the
    random process (9.2) has subgaussian increments:*


    ```

    $$\|Z_x - Z_y\|_{\psi_2} \le C b \|x - y\|_2 \quad \text{for all } x, y \in \mathbb{R}^n.\tag{9.38}$$

    ```


