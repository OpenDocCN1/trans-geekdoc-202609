    # 8.7 Notes


    The idea of chaining already appears in Kolmogorov’s proof of his continuity theorem
    for Brownian motion, see e.g. [253, Chapter 1]. Dudley integral inequality (Theorem
    8.1.3) can be traced to the work of R. Dudley. Our exposition in Section 8.1 mostly
    follows [210, Chapter 11], [315, Section 1.2] and [330, Section 5.3].


    Monte Carlo method (Section 8.2.1) is extremely popular in scientific computing,
    especially when combined with the power of Markov chains, see e.g. [63]. The rich
    theory of *empirical processes* (see Definition: empirical process) has applications
    to statistics and machine learning, see [329, 328, 279, 232]. The Lipschitz law
    of large numbers (Theorem 8.2.3), also known Wasserstein law for large numbers,
    is loosely based on [330, Example 5.15], see [115, Chapter 11]. For an introduction
    to transportation of measure (Section 8.2.3), see [342, 85].


    The concept of VC dimension introduced in Section 8.3 goes back to the foundational
    work of V. Vapnik and A. Chervonenkis [335]; modern treatments can be found e.g.
