    T (with respect to the Euclidean metric) is bounded: γ₂(T, d) = inf_{(T_k)} sup_{t∈T}
    ∑_{k=0}^∞ 2^{k/2} d(t, T_k) ≤ C.


    (b) Show that Dudley sum is unbounded: inf_{(T_k)} ∑_{k=0}^∞ 2^{k/2} sup_{t∈T}
    d(t, T_k) → ∞ as n → ∞.


