    $$1 - \sum_{k=1}^{\infty} 2^{2^{k+1}} \cdot 2\exp(-8u^2 2^k) \ge 1 - 2\exp(-u^2).$$


    if $u > c$. (Check the last inequality!)


    **Step 3: Summing up the increments.** In the event that the bound **(8.49)**
    does holds for all $t \in T$ and $k \in \mathbb{N}$, we can sum up the inequalities
    over $k \in \mathbb{N}$ and plug the result into the chaining sum **(8.47)**.
    We get


    $$|X_t - X_{t_0}| \lesssim u \sum_{k=1}^{\infty} 2^{k/2} d(\pi_k(t), \pi_{k-1}(t)),
    \qquad (8.50)$$


    where the notation $\lesssim$ hides an absolute constant factor. By triangle inequality,


    $$d(\pi_k(t), \pi_{k-1}(t)) \le d(t, \pi_k(t)) + d(t, \pi_{k-1}(t)).$$


    Using that bound, reindexing, and plugging in **(8.46)**, we get that the right-hand
    side of **(8.50)** is at most $Cu\gamma_2(T,d)$, that is


    $$|X_t - X_{t_0}| \lesssim u\gamma_2(T,d).$$


    (Check!) Taking the supremum over $T$ yields


    $$\sup_{t \in T}|X_t - X_{t_0}| \lesssim u\gamma_2(T,d).$$


    Since this holds with probability at least $1 - 2\exp(-u^2)$ for any $u > c$,
    we get


    $$\left\|\sup_{t \in T}|X_t - X_{t_0}|\right\|_{\psi_2} \lesssim \gamma_2(T,d).$$


    This quickly implies the conclusion of Theorem **8.5.2** (check!)


    □


    **Remark 8.5.3** (Generic chaining: supremum of increments). Similarly to Dudley
    inequality (Remark **8.1.5**), the generic chaining actually gives


    $$\mathbb{E}\sup_{t,s \in T}|X_t - X_s| \le CK\gamma_2(T,d),$$


    which is valid even without the mean zero assumption $\mathbb{E}X_t = 0$.


    **Remark 8.5.4** (Generic chaining: a high-probability bound). Theorem **8.5.2**
    gives only an expectation bound, but generic chaining actually gives a high-probability
    bound — we have seen this logic in Dudley inequality (Remark **8.1.6**).'
