  md: 'Compare this to the normal MGF formula (2.16). Applied to the normal random
    variable $g^{\top} A X'' = \langle g, A X'' \rangle$ (still conditionally on $X''$),
    it gives


    $$\mathbb{E}_g \exp(\mu g^{\top} A X'') = \exp(\mu^2 \|A X''\|_2^2/2), \quad \mu
    \in \mathbb{R.}\tag{6.10}$$


    Setting $\mu = \sqrt{2C}K\lambda$, we match the right sides of (6.9) and (6.10)
    and obtain


    $$\mathbb{E}_X \exp(\lambda X^{\top} A X'') \le \mathbb{E}_g \exp(\sqrt{2C}K\lambda
    g^{\top} A X'').$$


    Taking expectation over $X''$ of both sides, we see that we have replaced $X$
    by $g$ in the chaos, at a cost of the factor $\sqrt{2C}K$. Repeating for $X''$,
    we can replace it with $g''$, paying another factor $\sqrt{2C}K$. (Try it yourself!)


    Now we move on to step (c) of our plan:


    # **Lemma 6.2.4** (MGF of a Gaussian quadratic form). *Let $A = (a_{ij})$ be an
    $n \times n$ matrix, and let $g, g'' \sim N(0, I_n)$ be independent. Then*


    $$\mathbb{E} \exp(\lambda g^{\top} A g'') \le \exp(\lambda^2 \|A\|_F^2) \quad
    \text{whenever} \quad |\lambda| \le \frac{1}{2\|A\|}. $$


    *Proof* Let’s use rotation invariance of the normal distribution to diagonalize
    $A$. With its singular value decomposition (4.4), $A = U \Sigma V^{\top}$, we
    can write


    $$g^{\top} A g'' = (U^{\top} g)^{\top} \Sigma (V^{\top} g'').$$


    By rotation invariance of the normal distribution (Proposition 3.3.1), $U^{\top}
    g$ and $V^{\top} g''$ are independent standard normal random vectors in $\mathbb{R}^n$.
    So,


    $$g^{\top} A g'' \stackrel{\text{dist}}{=} g^{\top} \Sigma g'' = \sum_{i=1}^n
    s_i g_i g_i''$$


    where “dist” indicates equality in distribution and $s_i$ are the singular values
    of $A$. This is a sum of independent random variables, so


    $$\mathbb{E} \exp(\lambda g^{\top} A g'') = \mathbb{E} \prod_i \mathbb{E} \exp(\lambda
    s_i g_i g_i'') = \prod_i \mathbb{E} \exp(\lambda s_i g_i g_i''). \tag{6.11}$$


    Now, for each $i$ and $t \in \mathbb{R}$, we have


    $$\mathbb{E} \exp(t g_i g_i'') = \mathbb{E} \exp\left(\frac{t^2 g_i''^2}{2}\right)
    = \frac{1}{\sqrt{1 - t^2}} \le \exp(t^2) \quad \text{if } t^2 \le \frac12.$$


    The first identity here follows by conditioning on $g_i$ and using the MGF formula
    (2.16) for the normal random variable $g_i$; the other steps are direct calculations
    (check them!). Substituting this bound with $t = \lambda s_i$ into (6.11), we
    get


    $$\mathbb{E} \exp(\lambda g^{\top} A g'') \le \exp\left(\lambda^2 \sum_i s_i^2\right)
    \quad \text{if} \quad \lambda^2 \le \frac{1}{2 \max_i s_i^2}.$$


    Since $s_i$ are the singular values of $A$, we have $\sum_i s_i^2 = \|A\|_F^2$
    and $\max_i s_i = \|A\|$ (recall Lemma 4.1.11). The lemma is proved.


    5 Or use (2.31) for the subexponential random variable $g_i^2$ to get the same
    result up to constants.'
