    8.5.4 by chaining with the first big leap: t₀ → π_κ(t) → π_{κ+1}(t) → π_{κ+2}(t)
    → … → t where κ is chosen so that u ≍ 2^{κ/2}.


    8.36 ☕☕☕ (Empirical processes: a generic chaining bound) So far, we have bounded
    empirical processes for two kinds of function classes: Lipschitz (Theorem 8.2.3)
    and Boolean with finite VC dimension (Theorem 8.3.15). Now let’s go general. Take
    any class F of real-valued functions on a domain Ω, and let X, X₁, X₂, …, Xₙ be
