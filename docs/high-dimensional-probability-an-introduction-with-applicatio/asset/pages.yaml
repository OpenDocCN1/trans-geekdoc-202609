  md: 'The *degree* of a vertex in a graph is the number of edges connected to it.
    The expected degree of every vertex in $G(n,p)$ equals


    $$(n-1)p=:d.$$


    (Why?) We will show that relatively *dense graphs*, those where $d \gtrsim \log
    n$, are *almost regular* with high probability, meaning the degrees of all vertices
    are approximately equal to $d$.


    **Proposition 2.5.1** (Dense graphs are almost regular). *There is an absolute
    constant $C$ such that the following holds.* Consider a random graph $G \sim G(n,p)$
    with expected degree satisfying $d \ge C \log n$. Then, with probability at least
    $0.99$, the following event occurs: all vertices of $G$ have degrees between $0.9d$
    and $1.1d$.


    *Proof.* The argument is a combination of concentration with a union bound. Let
    us fix a vertex $i$ of the graph. The degree of $i$, which we denote $d_i$, is
    a sum of $n-1$ independent $\operatorname{Ber}(p)$ random variables (the indicators
    of the edges incident to $i$). Applying Chernoff inequality (Corollary 2.3.4)
    we get


    $$\mathbb{P}\{|d_i-d|\ge 0.1d\}\le 2e^{-cd}.$$


    This bound holds for each fixed vertex $i$. Next, we can “unfix” $i$ by taking
    the union bound (Lemma 1.4.1) over all $n$ vertices. We obtain


    $$\mathbb{P}\{\exists i\le n:\ |d_i-d|\ge 0.1d\}\le \sum_{i=1}^{n}\mathbb{P}\{|d_i-d|\ge
    0.1d\}\le n\cdot 2e^{-cd}.$$


    If $d\ge C\log n$ for a sufficiently large absolute constant $C$, the probability
    is bounded by $0.01$. This means that with probability $0.99$, the complementary
    event occurs: $\forall i\le n: |d_i-d|<0.1d$. The proof is complete. $\square$


    **Remark 2.5.2** (Sparse graphs are far from regular). You may wonder if the condition
    $d\gtrsim\log n$ in Proposition 2.5.1 is optimal. It is: if $d<(1-\varepsilon)\ln
    n$, an isolated vertex appears (“a friendless student” in Exercise 1.10), making
    the minimum degree zero. If you have not done Exercises 1.9 and 1.10 yet, give
    them a try them now, along with Exercises 2.18–2.20.


    # 2.6 Subgaussian distributions


    Let us take a fresh look at Hoeffding inequality for sums of independent random
    variables $X_i$:


    $$\mathbb{P}\left\{\left|\sum_{i=1}^{N}a_iX_i\right|\ge t\right\}\le 2\exp\left(-\frac{ct^2}{\|a\|_2^2}\right)
    \quad\text{for all } t\ge 0. \tag{2.14}$$


    This result holds for Rademacher random variables $X_i$ (Theorem 2.2.1), more
    generally for any mean-zero bounded random variables $X_i$ (Theorem 2.2.6), and
    for standard normal random variables $X_i$ (why?).


    This makes us wonder: what is the largest class of distributions for which'
