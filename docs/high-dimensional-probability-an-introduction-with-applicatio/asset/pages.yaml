    3.44 (a) Argue that the density of X₁ at u ∈ [−r, r] is proportional to (r − |u|)^{n−1}.

    (b) Use symmetry to check that the coordinates of X are uncorrelated.

    (c) Compute ℙ{X₁ > r/2}.'
