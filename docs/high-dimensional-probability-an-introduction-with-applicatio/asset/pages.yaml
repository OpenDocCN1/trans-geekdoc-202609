    # 9.6 Deviations of random matrices for general norms


    Let’s generalize the matrix deviation inequality (Theorem 9.1.1) to work for any
    norm – not just the Euclidean one. Actually, we don’t even need the norm to be
    nonnegative – just homogeneity and the triangle inequality will do.


    # **Definition 9.6.1** (Allowing a norm to take negative values). A real-valued
    function $f$ on a linear vector space $V$ is called:


    +   - *Positive-homogeneous* if $f(\alpha x)=\alpha f(x)$ for all $\alpha \ge
    0$ and $x \in V$;

    +   - *Subadditive* if $f(x+y) \le f(x)+f(y)$ for all $x,y \in V$.


    # **Example 9.6.2.** These functions are positive-homogeneous and subadditive:


    +   (a) any *norm*;

    +   (b) any real-valued linear function (called a *linear functional*);

    +   (c) an particular, the function $f(x)=\langle x,y\rangle$ for any fixed vector
    $y \in \mathbb{R}^m$;

    +   (d) the *support function* of any bounded set $S \subset \mathbb{R}^n$, defined
    by


    $$f(x) := \sup_{y\in S}\langle x,y\rangle, \quad x \in \mathbb{R}^m.$$\n(9.35)


    (check this!).


    Here is a version of Theorem 9.1.1 that works for all norms (and even positive-homogeneous,
    subadditive functions), but with a tradeoff – it applies only to Gaussian matrices:


    # **Theorem 9.6.3** (General matrix deviation inequality). *Let $A$ be an $m \times
    n$ random matrix with i.i.d. $N(0,1)$ entries. Let $f : \mathbb{R}^m \to \mathbb{R}$
    be a bounded, positive-homogeneous and subadditive function, and let $b \in \mathbb{R}$
    be such that*


    $$f(x) \le b\|x\|_2 \quad \text{for all } x \in \mathbb{R}^n.$$\n(9.36)


    *Then for any subset $T \subset \mathbb{R}^n$,*


    $$\mathbb{E}\sup_{x\in T}\big|f(Ax)-\mathbb{E}f(Ax)\big| \le C b \gamma(T),$$


    *where $\gamma(T)$ is the Gaussian complexity (see Section 7.5.3).*'
