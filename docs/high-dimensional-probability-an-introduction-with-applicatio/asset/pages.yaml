  md: '# ## 2.7.2 Subgaussian Khintchine inequality


    Let us establish another classic result: a two-sided bound on the $L^p$ norms
    of sums of independent random variables.


    **Theorem 2.7.5 (Khintchine inequality).** Let $X_1,\ldots,X_N$ be independent
    sub-Gaussian random variables with zero means and unit variances, and let $a_1,\ldots,a_N\in\mathbb{R}$.
    Then, for every $p\in[2,\infty)$, we have


    $$\left(\sum_{i=1}^{N}a_i^2\right)^{1/2}\leq\left\|\sum_{i=1}^{N}a_iX_i\right\|_{L_p}\leq
    CK\sqrt{p}\left(\sum_{i=1}^{N}a_i^2\right)^{1/2}.$$


    where $K=\max_i\|X_i\|_{\psi_2}$ and $C$ is an absolute constant.


    *Proof*  For $p=2$, we actually have an equality, since the Pythagorean identity
    (2.19) combined with the unit variance assumption gives


    $$\left\|\sum_{i=1}^{N}a_iX_i\right\|_{L_2}=\left(\sum_{i=1}^{N}a_i^2\|X_i\|_{L_2}^2\right)^{1/2}=\left(\sum_{i=1}^{N}a_i^2\right)^{1/2}.$$


    Then the lower bound in the theorem follows from the monotonicity of the $L^p$
    norms (1.20). For the upper bound, use Proposition 2.7.1:


    $$\left\|\sum_{i=1}^{N}a_iX_i\right\|_{\psi_2}\leq C\left(\sum_{i=1}^{N}a_i^2\|X_i\|_{\psi_2}^2\right)^{1/2}\leq
    CK\left(\sum_{i=1}^{N}a_i^2\right)^{1/2},$$


    and finish by applying Proposition 2.6.6(ii).


    You will extend Khintchine’s inequality for $p\in[1,2]$ in Exercise 2.36.


    # ## 2.7.3 Maximum of subgaussians


    So far, we have focused on *sums* of random variables. But what about other, possibly
    nonlinear, functions? We will explore them in depth in Chapter 5. For now, let
    us give one example: a version of Proposition 2.7.1 for the *maximum*.


    **Proposition 2.7.6 (Maximum of subgaussians).** Let $X_1,\ldots,X_N$ be subgaussian
    random variables for some $N\geq 2$, that are not necessarily independent. Then


    $$\left\|\max_{i\leq N}X_i\right\|_{\psi_2}\leq C\sqrt{\log N}\,\max_{i\leq N}\|X_i\|_{\psi_2}.
    \tag{2.21}$$


    *In particular, we have*


    $$\mathbb{E}\max_{i\leq N}X_i\leq CK\sqrt{\log N}. \tag{2.22}$$


    where $K=\max_{i\leq N}\|X_i\|_{\psi_2}$. The same bounds obviously hold for $\max_i|X_i|$.
    (Why?)


    *Proof*  We give two different proofs of (2.21); pick the one you prefer.'
