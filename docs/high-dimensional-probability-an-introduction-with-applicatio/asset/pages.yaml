    large enough, the probability in (7.24) is bounded by $2e^{-ms^2}$ for any $s\ge
    1$. So, (7.24) and (7.22) give the result:


    $$\mathbb{P}\left\{\frac12\operatorname{diam}(QT)\ge 2w_s(T)+C_s\sqrt{\frac mn}\right\}\le
    e^{-ms^2}\quad\text{for any }s\ge 1.$$


