  md: '# 9.5.2 Restricted isometries


    Let’s find a *deterministic* condition that ensures a matrix $A$ works for sparse
    recovery, and prove that random matrices satisfy this condition. It is called
    the restricted isometry property (RIP):


    **Definition 9.5.5 (RIP).** An $m \times n$ matrix $A$ satisfies the *restricted
    isometry property* (RIP) with parameters $\alpha$, $\beta$ and $s$ if the inequality


    $$\alpha\|v\|_2 \le \|Av\|_2 \le \beta\|v\|_2$$


    holds for all vectors $v \in \mathbb{R}^n$ with at most $s$ nonzero entries.


    RIP just says that the singular values of all $m \times s$ submatrices$^7$ $A_I$
    of $A$ satisfy:


    $$\alpha \le s_s(A_I) \le s_1(A_I) \le \beta. \tag{9.31}$$


    (Why?) And if $\alpha \approx \beta \approx 1$, RIP tells us that all those submatrices
    are approximate isometries (recall Section 4.1.7).


    **Theorem 9.5.6 (RIP implies exact recovery).** *Suppose an $m \times n$ matrix
    $A$ satisfies RIP with some parameters $\alpha$, $\beta$ and $(1+\lambda)s$, where
    $\lambda > (\beta/\alpha)^2$. Then every $s$-sparse vector $x \in \mathbb{R}^n$
    can be exactly recovered from $y = Ax$ by solving (9.27), i.e. the solution satisfies*


    $$\hat{x} = x.$$


    *Proof* As in the proof of Theorem 9.5.1, we need to show that the error


    $$h = \hat{x} - x$$


    is zero. To do this, we decompose $h$ in a way similar to Exercise 9.25. (If you’ve
    solved that exercise, great, but it is not necessary to understand this proof.)


    **Step 1: Decomposing the support.** Let $I_0$ be the support of $x$. Let $I_1$
    index the $\lambda s$ largest entries of $h_{I_0^c}$ in magnitude, let $I_2$ index
    the next $\lambda s$ largest entries of $h_{I_0^c}$ in magnitude, and so on. Finally,
    set $I_{01} = I_0 \cup I_1$. Since


    $$Ah = A\hat{x} - Ax = y - y = 0,$$


    the triangle inequality gives


    $$0 = \|Ah\|_2 \ge \|A_{I_{01}} h_{I_{01}}\ \|_2 - \|A_{I_{01}^c} h_{I_{01}^c}\
    \|_2. \tag{9.32}$$


    Next, let’s look at the two terms on the right-hand side.


    **Step 2: Applying RIP.** Since $|I_{0,1}| \le s + \lambda s$, RIP gives


    $$\|A_{I_{01}} h_{I_{01}}\ \|_2 \ge \alpha \|h_{I_{01}}\ \|_2$$


    and triangle inequality followed by RIP gives


    $$\|A_{I_{01}^c} h_{I_{01}^c}\ \|_2 \le \sum_{i\ge 2} \|A_{I_i} h_{I_i}\ \|_2
    \le \beta \sum_{i\ge 2} \|h_{I_i}\ \|_2.$$


    7 Formally, $A_I$ is the $m \times s$ submatrix made by picking the columns indexed
    by some $s$-element subset $I \subset \{1,\dots,n\}$.'
