    \ estimator is subgaussian everywhere)** You may wonder if Theorem 2.4.1 holds\
    \ for all $t>0$. It does not. In fact, no mean estimator can provide subgaussian\
    \ confidence for all quantiles. *Disprove* the following claim:\n\n> > “There\
    \ exists an absolute constant $c>0$ such that the following holds. For any integer\
    \ $N>0$ and every $t\\ge 0$, one can find a function $\\hat{\\mu}:\\mathbb{R}^N\\\
    to\\mathbb{R}$ satisfying\n> >\n> > $$\\mathbb{P}\\left\\{\\left|\\hat{\\mu}(X_1,\\\
    ldots,X_N)-\\mu\\right|\\ge \\frac{t\\sigma}{\\sqrt{N}}\\right\\}\\le 2e^{-ct^2}$$\n\
    > >\n> > for all i.i.d. random variables $X_1,\\ldots,X_N$ with mean $\\mu$ and\
    \ variance $\\sigma^2$.”\n\nDo this by working out a version of *Le Cam’s two-point\
    \ method*:\n\n+   (a) Consider two random vectors $X=(X_1,\\ldots,X_N)$ and $Y=(Y_1,\\\
    ldots,Y_N)$ with independent Laplace¹⁰ coordinates: $X_i\\sim\\operatorname{Lap}(0,1)$\
