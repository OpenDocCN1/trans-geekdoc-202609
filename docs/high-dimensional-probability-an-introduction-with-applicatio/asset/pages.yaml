    # ### 8.2.3 Empirical measure


    For a broader perspective, take one more look at the Definition 8.2.5 of an empirical
    process. Given an i.i.d. sample $X_1,\ldots,X_n$ picked from $\Omega$ according
    to some probability measure $\mu$, let’s consider the *empirical measure* $\mu_n$
    that assigns equal probabilities $1/n$ to each point, counting multiplicities:


    $$\mu_n=\frac{1}{n}\sum_{i=1}^{n}\delta_{X_i}.$$


    Here $\delta_x$ is the Dirac probability measure at $x$, i.e. $\delta_x(A)=1$
    if $x\in A$ and $0$ otherwise, for any set $A$. So, $\mu_n(A)$ is the fraction
    of sample points that fall in a set $A\subset\Omega$.


    The integral of $f$ with respect to the original measure $\mu$ is $\mathbb{E}f(X)$
    (the “population” average of $f$), and the integral of $f$ with respect to the
    empirical measure $\mu_n$ is $\frac{1}{n}\sum_{i=1}^{n}f(X_i)$ (the “sample”,
    or empirical, average of $f$). The empirical process $X_f$ in (8.23) tracks the
    deviation of the population expectation from the empirical expectation.


    This deviation, which we bound in Theorem 8.2.3, can be thought of as a distance
    between measures $\mu$ and $\mu_n$, called the *Wasserstein distance* $W_1(\mu,\mu_n)$.
    It has an equivalent interpretation as the *transportation cost* of turning one
    measure into the other. The equivalence is provided by the Kantorovich-Rubinstein
    duality theorem. For this reason Theorem 8.2.3 is often called the *Wasserstein
    law of large numbers*.


    Many tools you have learned also work for empirical processes. Try proving an
    empirical version of symmetrization in Exercise 8.11.


    # ### 8.3 VC dimension


    Now we introduce the notion of the VC (Vapnik–Chervonenkis) dimension, which plays
    a major role in statistical learning theory. We connect it to covering numbers,
    and then, through Dudley inequality, to random processes and uniform law'
