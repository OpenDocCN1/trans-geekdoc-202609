  md: "![](img/b122213aed28c1888de83a894123323e_78_0.png)\n\n**Figure 3.6** A convex\
    \ body $K$ (left) is transformed into an isotropic convex body $T(K)$ (right).\
    \ The preconditioner is $T=\\Sigma^{-1/2}$, where $\\Sigma$ is the covariance\
    \ matrix of $K$.\n\n# 3.3.5 Frames\n\nThe notion of a frame, widely used in signal\
    \ processing, extends the concept of a basis but drops the requirement of linear\
    \ independence. Frames are intimately connected to discrete isotropic distributions:\n\
    \n+   **Proposition 3.3.11** (Parseval frames). *For any vectors* $u_1,\\ldots,u_N\\\
    in\\mathbb{R}^n$, *the following are equivalent:*\n+   \n+   (i) (Parseval identity)\
    \ $\\|x\\|^2=\\sum_{i=1}^N\\langle u_i,x\\rangle^2$ for each $x\\in\\mathbb{R}^n$.\n\
    +   \n+   (ii) (Frame expansion) $x=\\sum_{i=1}^N\\langle u_i,x\\rangle u_i$ for\
    \ each $x\\in\\mathbb{R}^n$.\n+   \n+   (iii) (Decomposition of identity) $I_n=\\\
    sum_{i=1}^N u_i u_i^\\mathsf{T}$.\n+   \n+   (iv) (Isotropy) The random vector\
    \ $X\\sim\\operatorname{Unif}\\{\\sqrt{N}u_1,\\ldots,\\sqrt{N}u_N\\}$ is isotropic.\n\
    +   \n+   A set of vectors satisfying these equivalent properties is called a\
    \ Parseval frame.\n\n*Proof* **(i)$\\Rightarrow$(iv)** The identity in (i) can\
    \ be written as\n\n$$\\|x\\|^2=\\frac{1}{N}\\sum_{i=1}^N\\langle\\sqrt{N}u_i,x\\\
    rangle^2=\\mathbb{E}\\langle X,x\\rangle^2.$$\n\nSince this holds for all $x\\\
    in\\mathbb{R}^n$, the random vector $X$ is isotropic by (3.9).\n\n**(iv)$\\Rightarrow$(iii)**\
    \ because isotropy of $X$ means that\n\n$$I_n=\\mathbb{E}XX^\\mathsf{T}=\\frac{1}{N}\\\
    sum_{i=1}^N(\\sqrt{N}u_i)(\\sqrt{N}u_i)^\\mathsf{T}=\\sum_{i=1}^N u_i u_i^\\mathsf{T}.$$\n\
    \n**(iii)$\\Rightarrow$(ii)** follows by multiplying on both sides by $x$. Finally,\
    \ **(ii)$\\Rightarrow$(i)** comes from taking the inner product with $x$.\n\n\
    **Example 3.3.12** (Coordinate distribution). The standard basis $\\{e_1,\\ldots,e_n\\\
    }$ in $\\mathbb{R}^n$ is a Parseval frame. Therefore, a *coordinate random vector*\n\
    \n$$X\\sim\\operatorname{Unif}\\{\\sqrt{n}e_1,\\ldots,\\sqrt{n}e_n\\},$$\n\nis\
    \ isotropic. Among all high-dimensional distributions, Gaussian is often the easiest\
    \ to work with—think of it as “the best.” The coordinate distribution, being highly\
    \ discrete, is often “the worst.”\n\n**Example 3.3.13** (The Mercedes-Benz frame).\
    \ An iconic example of a Parseval frame that is not linearly independent is the\
    \ set of $N$ equispaced points on the circle of radius $\\sqrt{2/N}$, such as\
    \ the one in Figure 3.7 (try Exercise 3.30)."
