  md: 'Since the eigenvalues of $e^{\lambda S}$ are all positive, the maximal eigenvalue
    of $e^{\lambda S}$ is bounded by the sum of all eigenvalues, the trace of $e^{\lambda
    S}$, which leads to


    $E \le \mathbb{E}\,\mathrm{tr}\,e^{\lambda S}.$


    # **Step 2: Application of Lieb inequality**. To prepare for an application of
    Lieb inequality (Lemma 5.4.9), let us separate the last term from the sum $S$:


    $E \le \mathbb{E}\,\mathrm{tr}\,\exp\left[\sum_{i=1}^{N-1} \lambda X_i + \lambda
    X_N\right].$


    Condition on $(X_i)_{i=1}^{N-1}$ and apply Lemma 5.4.9 for the fixed matrix $H
    := \sum_{i=1}^{N-1} \lambda X_i$ and the random matrix $Z := \lambda X_N$. We
    obtain


    $E \le \mathbb{E}\,\mathrm{tr}\,\exp\left[\sum_{i=1}^{N-1} \lambda X_i + \log
    \mathbb{E}\,e^{\lambda X_N}\right].$


    (To be more specific here, we first apply Lemma 5.4.9 for the conditional expectation,
    and then take expectation of both sides using the law of total expectation.)


    We continue in a similar way: separate the next term $\lambda X_{N-1}$ from the
    sum $\sum_{i=1}^{N-1} \lambda X_i$ and apply Lemma 5.4.9 again for $Z = \lambda
    X_{N-1}$. Repeating $N$ times, we obtain


    $E \le \mathrm{tr}\,\exp\left[\sum_{i=1}^{N} \log \mathbb{E}\,e^{\lambda X_i}\right].$
    (5.16)


    # **Step 3: MGF of the individual terms.** It remains to bound the matrix-valued
    moment generating function $\mathbb{E}\,e^{\lambda X_i}$ for each term $X_i$.
    This is a standard task, and the argument will be similar to the scalar case.


    # **Lemma 5.4.10 (Moment generating function).** *Let $X$ be an $n \times n$ symmetric
    mean-zero random matrix such that $||X|| \le K$ almost surely. Then*


    $\mathbb{E}\,\exp(\lambda X) \preceq \exp\big(g(\lambda)\,\mathbb{E}\,X^2\big)\quad
    \text{where}\quad g(\lambda)=\frac{\lambda^2/2}{1-|\lambda|K/3},$


    *provided that* $|\lambda| < 3/K$.


    *Proof* First, note that we can bound the (scalar) exponential function by the
    first few terms of its Taylor expansion as follows:


    $e^{z} \le 1 + z + \frac{1}{1-|z|/3}\,\frac{z^2}{2},\quad \text{if }|z|<3.$


    (To get this inequality, write $e^{z}=1+z+z^2\cdot\sum_{p=2}^{\infty}z^{p-2}/p!$
    and use the bound $p!\ge 2\cdot3^{p-2}$.) Next, apply this inequality for $z=\lambda
    x$. If $|x|\le K$ and $|\lambda|<3/K$ then we obtain


    $e^{\lambda x} \le 1 + \lambda x + g(\lambda)x^2,$


    where $g(\lambda)$ is the function in the statement of the lemma.'
