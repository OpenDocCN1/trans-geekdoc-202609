    $$\mathbb{E}\left|\frac{1}{n}\sum_{i=1}^{n} f(X_i)-\mathbb{E}f(X)\right|\leq \left[\operatorname{Var}\left(\frac{1}{n}\sum_{i=1}^{n}f(X_i)\right)\right]^{1/2}=O\left(\frac{1}{\sqrt{n}}\right).
    \tag{8.20}$$


    **Remark 8.2.2** (Monte Carlo is high-dimensional, agnostic). Monte Carlo works
    well in high dimensions since the error (8.20) does not depend on dimension—unlike
    grid-based integration methods. You don’t even need to know the measure $\mu$;
    just being able to sample from it is enough. Same with $f$ – you only need its
    values at a few random points.


    # ### 8.2.2 Lipschitz law of large numbers


    Can we use the same sample $X_1,\ldots,X_n$ to estimate the integral of any function
    $f:\Omega\to\mathbb{R}$? No. A badly chosen $f$ could wiggle wildly between sample
    points (like in Figure 8.4), making the Monte Carlo estimate (8.19) totally off.


    ![](img/b122213aed28c1888de83a894123323e_234_0.png)


    **Figure 8.4** One sample $X_1,\ldots,X_n$ cannot be used to approximate the integral
    of *all* functions $f$.


    But what if we stick to functions that do not wiggle too much – like Lipschitz
    ones? Then yes!


    **Theorem 8.2.3** (Lipschitz law of large numbers). *Consider the class of functions*


    $$\mathcal{F}:=\{f:[0,1]\to\mathbb{R},\ \|f\|_{\mathrm{Lip}}\leq L\}, \tag{8.21}$$


    *where $L$ is any number. Let $X,X_1,X_2,\ldots,X_n$ be i.i.d. random variables
    taking values in $[0,1]$. Then*


    $$\mathbb{E}\sup_{f\in\mathcal{F}}\left|\frac{1}{n}\sum_{i=1}^{n}f(X_i)-\mathbb{E}f(X)\right|\leq
    \frac{CL}{\sqrt{n}}. \tag{8.22}$$


    **Remark 8.2.4** (One sample serves all Lipschitz functions). Before the proof,
    let’s reiterate the key point: the supremum over $f\in\mathcal{F}$ is inside the
    expectation. Thanks to Markov inequality, this means that a single sample $X_1,\ldots,X_n$
    will, with high probability, work well simultaneously for all $f\in\mathcal{F}$.
    And “work well” means approximating each integral with error $O(1/\sqrt{n})$ –
    same rate as the usual law of large numbers for just one function. So, made the
    law of large numbers uniform without losing anything!'
