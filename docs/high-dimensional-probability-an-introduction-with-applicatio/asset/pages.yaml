  md: '# Lemma 9.5.2 (The error is heavier on x''s support).


    Set $S := \operatorname{supp}(x)$, and let $h_S \in \mathbb{R}^S$ denote the restriction
    of $h$ onto $S$ (and similarly for $S^c$). Then


    $$\|h_{S^c}\|_1 \le \|h_S\|_1.$$


    Proof  Since $\hat{x}$ is the minimizer in the program (9.27), we have


    $$\|\hat{x}\|_1 \le \|x\|_1.\tag{9.28}$$


    But there is also a lower bound


    $$\|\hat{x}\|_1 = \|x + h\|_1 = \|x_S + h_S\|_1 + \|x_{S^c} + h_{S^c}\|_1 \ge
    \|x\|_1 - \|h_S\|_1 + \|h_{S^c}\|_1,$$

    where the last line follows by triangle inequality and using $x_S = x$ and $x_{S^c}=0$.
    Substitute this into (9.28) and simplify to complete the proof. $\square$


    # Lemma 9.5.3 (The error is approximately sparse).


    The error vector satisfies


    $$\|h\|_1 \le 2\sqrt{s}\|h\|_2.$$


    Proof  Using Lemma 9.5.2 and then the Cauchy-Schwarz inequality, we get


    $$\|h\|_1 = \|h_S\|_1 + \|h_{S^c}\|_1 \le 2\|h_S\|_1 \le 2\sqrt{s}\|h_S\|_2 \le
    2\sqrt{s}\|h\|_2.$$ $\square$


    # Proof of Theorem 9.5.1


    Assume $h = \hat{x} - x \ne 0$. Lemma 9.5.3 gives


    $$\frac{h}{\|h\|_2} \in T_s := \{z \in S^{n-1} : \|z\|_1 \le 2\sqrt{s}\},$$


    and since also $Ah = A\hat{x} - Ax = y - y = 0$, we have


    $$\frac{h}{\|h\|_2} \in T_s \cap \ker A.\tag{9.29}$$


    The escape theorem (Theorem 9.3.4) shows that this intersection is empty with
    high probability as long as $m \ge C_1 K^4 w(T_s)^2$. Now, since $T_s \subset
    2\sqrt{s} B_1^n$, we get


    $$w(T_s) \le 2\sqrt{s} w(B_1^n) \le C_2 \sqrt{s \log n},\tag{9.30}$$


    due to (7.19). Thus, if $m \ge C K^4 s \log n$, the intersection in (9.29) is
    empty with high probability, which means that the inclusion in (9.29) cannot hold.
    So, our assumption that $h \ne 0$ is false with high probability. The proof is
    complete. $\square$


