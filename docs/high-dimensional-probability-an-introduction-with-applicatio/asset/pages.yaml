  md: '# Remark 9.7.3 (The effective dimension).


    Assume that $T$ is bounded, convex and contains the origin, and let


    $$m \le c d(T)$$


    where $d(T) \asymp w(T)^2 / \mathrm{rad}(T)^2$ is the effective dimension (see
    Definition 7.5.12). If we pick the absolute constant $c$ small enough, we can
    make $C\sqrt{m}\,\mathrm{rad}(T) \le 0.01 w(T)$, so the that Dvoretzky-Milman
    Theorem 9.7.2 gives


    $$0.99 B \subset A T \subset 1.01 B$$


    with $B = w(T) B_2^n$ is the Euclidean ball of radius $w(T)$.


    > projecting any bounded convex set $T$ onto a random subspace of dimension about
    $d(T)$ makes it look almost like a round ball!


    # Example 9.7.4 (Almost round projections of the cube).


    Consider the cube $T = [-1,1]^n$. By (7.18), $w(T) = \sqrt{2/\pi}\, n$ and $\mathrm{diam}(T)
    = 2\sqrt{n}$, so the effective dimension is $d(T) \asymp n$. So, if $m \le c n$,
    then with high probability we have


    $$0.99 B \subset A[-1,1]^n \subset 1.01 B$$


    where $B$ is the Euclidean ball with radius $\sqrt{2/\pi}\, n$.


    > projecting an $n$-dimensional cube onto a subspace of dimension $m = c n$ makes
    it look almost like a round ball! Figure 9.9 illustrates this remarkable fact.


    # Remark 9.7.5 (Summary of random projections).


    In Sections 7.6 and 9.2.2, we found that a random projection $P$ of a set $T$
    onto an $m$-dimensional subspace in $\mathbb{R}^n$ undergoes a phase transition.
    In the high-dimensional regime ($m \gtrsim d(T)$), the projection shrinks the
    diameter of $T$ by the factor of order $\sqrt{m/n}$:


    $$\mathrm{diam}(PT) \asymp \sqrt{\frac{m}{n}}\,\mathrm{diam}(T)$$


    Moreover, the additive Johnson-Lindenstrauss Lemma 9.2.4 shows that in this regime,
    the random projection $P$ approximately preserves the geometry of $T$ (the distances
    between all points in $T$ shrink roughly by the same scaling factor).


    In the low-dimensional regime ($m \lesssim d(T)$), shrinking stops:


    $$\mathrm{diam}(PT) \asymp w_s(T) \asymp \frac{w(T)}{\sqrt{n}}$$


    regardless of how small $m$ is. Dvoretzky-Milman theorem explains why: $PT$ is
    now an approximately the round ball of radius of order $w_s(T)$ (see Exercise
    9.43), which obviously does not shrink under any projection.


    To practice, get a high-probability version of Dvoretzky-Milman theorem (Exercise
    9.41), show that a Gaussian cloud is nearly round in low dimensions (Exercise
    9.42), and get at version of Dvoretzky-Milman theorem for actual (rather than
    Gaussian) projections (Exercise 9.43).'
