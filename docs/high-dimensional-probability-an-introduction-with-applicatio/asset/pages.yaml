  md: 'Assuming $T$ is finite,⁸ for every $u\ge 0$, the event


    $$\sup_{t,s\in T}|X_t-X_s|\le CK\left[\gamma_2(T,d)+u\cdot\operatorname{diam}(T)\right]$$


    holds with probability at least $1-2\exp(-u^2)$. Try Exercise 8.35 to prove this!
    For Gaussian processes, you can deduce it directly from Gaussian concentration.


    For practice, try applying generic chaining to empirical processes (Exercise 8.36).


    # 8.5.3 Majorizing measure and comparison theorems


    The $\gamma_2$ functional (Definition 8.5.1) is usually harder to compute than
    covering numbers in Dudley inequality (Theorem 8.1.3). But it is often worth the
    effort—unlike Dudley, generic chaining is sharp up to constants:


    **Theorem 8.5.5** (Talagrand majorizing measure theorem). *Let $(X_t)_{t\in T}$
    be a mean-zero Gaussian process on a set $T$, equipped with the canonical metric
    $d(t,s)=\|X_t-X_s\|_{L^2}$ as in (7.1). Then*


    $$c\gamma_2(T,d)\le \mathbb{E}\sup_{t\in T}X_t\le C\gamma_2(T,d).$$


    The upper bound in Theorem 8.5.5 comes straight from generic chaining (Theorem
    8.5.2). The lower bound is trickier; its proof can be seen as a refined, multi-scale
    extension of Sudakov inequality (Theorem 7.4.1), which we will not include here.


    The upper bound, as we know from Theorem 8.5.2, holds not just for Gaussian but
    also for all *subgaussian* processes. Therefore, by combining the upper and lower
    bounds, we can bound any subgaussian process by the Gaussian one:


    **Corollary 8.5.6** (Talagrand comparison inequality). *Let $(X_t)_{t\in T}$ be
    a mean-zero random process on a set $T$ and let $(Y_t)_{t\in T}$ be a mean-zero
    Gaussian process. Assume*


    $$\|X_t-X_s\|_{\psi_2}\le K\|Y_t-Y_s\|_{L^2}\quad\text{for all }t,s\in T.$$


    *Then*


    $$\mathbb{E}\sup_{t\in T}X_t\le CK\,\mathbb{E}\sup_{t\in T}Y_t.$$


    *Proof* Consider the canonical metric $d(t,s)=\|Y_t-Y_s\|_{L^2}$ on $T$. Now just
    use the generic chaining bound (Theorem 8.5.2) followed by the lower bound in
    the majorizing measure Theorem 8.5.5:


    $$\mathbb{E}\sup_{t\in T}X_t\lesssim K\gamma_2(T,d)\lesssim K\,\mathbb{E}\sup_{t\in
    T}Y_t.\quad\square$$


    **Remark 8.5.7** (Sudakov-Fernique). Corollary 8.5.6 extends the Sudakov-Fernique
    inequality (Theorem 7.2.8) to subgaussian processes—with only an absolute constant
    factor as the price for this generalization!


    ⁸ As always, are assuming $T$ is finite to avoid measurability issues; the general
    case typically follows by approximation.'
