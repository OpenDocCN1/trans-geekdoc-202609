  md: '# 8.4.2 Empirical risk minimization


    Once we picked a hypothesis space $\mathcal{F}$, we might just choose the best
    function $f^*$ in it — one that minimizes the risk (8.37):


    $$f^* := \arg\min_{f\in\mathcal{F}} R(f).$$


    The catch is that we cannot actually compute the risk $R(f)$, since this involves
    taking expectation over the whole population $\Omega$. Solution? Take expectation
    over the training data instead:


    **Definition 8.4.3** (Empirical risk minimization). For a function $f : \Omega
    \to \mathbb{R}$, define the *empirical risk* and the empirical minimizer as


    $$R_n(f) := \frac{1}{n}\sum_{i=1}^{n}(f(X_i)-T(X_i))^2,\qquad f_n^* := \arg\min_{f\in\mathcal{F}}
    R_n(f). \tag{8.39}$$


    Now we can compute $R_n(f)$ and $f_n^*$ from the training data. The outcome of
    learning is $f_n^*$, and its quality is measured by the *generalization error*
    $R(f_n^*)$.


    **Example 8.4.4** (Classification). In classification, where $f$ and $T$ take
    values 0 or 1, the empirical risk $R_n(f)$ is just the fraction of training points
    where $f$ gets it wrong: $f(X_i) \ne T(X_i)$. So empirical risk minimization picks
    the $f\in\mathcal{F}$ that makes the fewest mistakes on the training data.


    # 8.4.3 VC generalization bound


    Let’s use the VC theory to bound the generalization error in any classification
    problem (where the target $T$ is Boolean).


    **Theorem 8.4.5** (VC generalization bound). *Assume that the target $T$ is a
    Boolean function, and the hypothesis space $\mathcal{F}$ is a class of Boolean
    functions with finite VC dimension. Then*


    $$\mathbb{E}R(f_n^*) \le R(f^*) + C\sqrt{\frac{\operatorname{VC}(\mathcal{F})}{n}}.$$


    *Proof*  **Step 1: Excess risk.** The following bound holds pointwise:


    $$R(f_n^*)-R(f^*) \le 2\sup_{f\in\mathcal{F}}|R_n(f)-R(f)|. \tag{8.40}$$


    To check it, denote $\epsilon := \sup_{f\in\mathcal{F}}|R_n(f)-R(f)|$ and write


    $$\begin{aligned}R(f_n^*) &\le R_n(f_n^*)+\epsilon &&\text{(since }f_n^*\in\mathcal{F}\text{
    by construction)}\\ &\le R_n(f^*)+\epsilon &&\text{(since }f_n^*\text{ minimizes
    }R_n\text{ in the class }\mathcal{F}\text{)}\\ &\le R(f^*)+2\epsilon &&\text{(since
    }f^*\in\mathcal{F}\text{ by construction).}\end{aligned}$$


    Subtracting $R(f^*)$ from both sides gives (8.40).'
