  md: 'The left tail \(\mathbb{P}\{S_N \le (1-\delta)\mu\}\) can be bounded similarly,
    using **Remark 2.3.2**. (Try it! You should get even a better bound: \(\exp(-\delta^2\mu/2)\).)
    Combine the two tails by a union bound to complete the proof.


    To see a Gaussian tail in **Corollary 2.3.4**, try normalizing \(S_N\) roughly
    as in the central limit theorem. If we set \(Z_N=(S_N-\mu)/\sqrt{\mu}\), we can
    rewrite the conclusion of **Corollary 2.3.4** as follows:


    \[\mathbb{P}\{|Z_N|\ge t\}\le 2\exp(-t^2/3)\quad\text{for every }0\le t\le\sqrt{\mu}.\]


    **Remark 2.3.5** (Small and large deviations). Figure **2.1** shows the probability
    mass function of Binom\((N,\mu/N)\) with \(N=200\) and \(\mu=10\). Near the mean
    \(\mu\), the bell-shaped curve reflects Gaussian behavior. Far to the right, the
    slower decay reflects Poisson behavior. These two regimes align with the central
    limit theorem and the Poisson limit theorem, respectively.


    ![](img/b122213aed28c1888de83a894123323e_38_0.png)


    **Figure 2.1** The probability mass function of the distribution Binom\((N,\mu/N)\)
    with \(N=200\) and \(\mu=10\). It is approximately normal near the mean \(\mu\),
    but it is heavier and farther from the mean.


    # 2.4 Application: median-of-means estimator


    A fundamental data science problem is learning an unknown distribution from a
    sample — for example inferring a country’s income distribution from a survey of
    \(N\) people.


    The most basic task is estimating the mean. Let \(X\) be a random variable with
    mean \(\mu\) and variance \(\sigma^2\) (representing a population), and let \(X_1,\ldots,X_N\)
    be independent copies¹ of \(X\) (representing a sample). We would like to find
    an estimator \(\hat{\mu}=\hat{\mu}(X_1,\ldots,X_N)\) that satisfies \(\hat{\mu}\approx\mu\)
    with high probability.


    The simplest and most popular mean estimator is the *sample mean*


    \[\hat{\mu}:=\frac{1}{N}\sum_{i=1}^{N}X_i.\tag{2.11}\]


    The expected value and variance of this estimator are


    \[\mathbb{E}\,\hat{\mu}=\mu;\qquad \operatorname{Var}(\hat{\mu})=\frac{1}{N^2}\sum_{i=1}^{N}\operatorname{Var}(X_i)=\frac{\sigma^2}{N}.\tag{2.12}\]


    ¹ Independent copies of \(X\) are independent random variables that have the same
    distribution as \(X\).'
