    To complete the proof, all we need to check is


    $$S(\mathcal{F}) \geq S(\mathcal{F}_0) + S(\mathcal{F}_1), \tag{8.29}$$


    for then (8.28) would give $S(\mathcal{F}) \geq |\mathcal{F}_0| + |\mathcal{F}_1|
    = |\mathcal{F}|$, as needed.


    Inequality (8.29) may seem trivial. Any set $\Lambda$ that is shattered by $\mathcal{F}_0$
    or $\mathcal{F}_1$ is automatically shattered by the larger class $\mathcal{F}$,
    and thus each set $\Lambda$ counted by $S(\mathcal{F}_0)$ or $S(\mathcal{F}_1)$
    is automatically counted by $S(\mathcal{F})$. The problem, however, lies in the
    double counting. Assume the same set $\Lambda$ is shattered by both $\mathcal{F}_0$
    and $\mathcal{F}_1$. The counting function $S(\mathcal{F})$ will not count $\Lambda$
    twice. However, a different set will be counted by $S(\mathcal{F})$, which was
    not counted by either $S(\mathcal{F}_0)$ or $S(\mathcal{F}_1)$—namely, $\Lambda
    \cup \{x_0\}$. A moment thought reveals that this set is indeed shattered by $\mathcal{F}$.
    (Check!) This establishes inequality (8.29) and completes the proof of Pajor Lemma.


    Let’s illustrate the key point in the proof of Pajor lemma:


    **Example 8.3.8.** Let us again go back to Example 8.3.4. Following the proof
    of Pajor lemma, we chop out $x_0 = 3$ from $\Omega = \{1, 2, 3\}$, making $\Omega_0
    = \{1, 2\}$. The class $\mathcal{F} = \{001, 010, 100, 111\}$ then breaks into
    two sub-classes


    $$\mathcal{F}_0 = \{010, 100\} \quad \text{and} \quad \mathcal{F}_1 = \{001, 111\}.$$


    There are exactly two subsets $\Lambda$ shattered by $\mathcal{F}_0$, namely $\{1\}$
    and $\{2\}$, and **the same** subsets are shattered by $\mathcal{F}_1$, making
    $S(\mathcal{F}_0) = S(\mathcal{F}_1) = 2$. Of course, the same two subsets are
    also shattered by $\mathcal{F}$, but we need two more shattered subsets to make
    $S(\mathcal{F}) \geq 4$ for the key inequality (8.29). Here is how we construct
    them: append $x_0 = 3$ to the already counted subsets $\Lambda$. The resulting
    sets $\{1, 3\}$ and $\{2, 3\}$ are also shattered by $\mathcal{F}$, and we have
    not counted them yet. Now have at least **four** subsets shattered by $\mathcal{F}$,
    making the key inequality (8.29) true.


    # 8.3.3 Sauer-Shelah Lemma


    We now deduce a remarkable upper bound on the cardinality of a function class
    in terms of VC dimension:


    **Lemma 8.3.9 (Sauer-Shelah Lemma).** *Let $\mathcal{F}$ be a class of Boolean
    functions on an $n$-point set $\Omega$. Then*


    $$|\mathcal{F}| \leq \sum_{k=0}^{d} \binom{n}{k} \leq \left(\frac{en}{d}\right)^d
    \quad \text{where } d = \operatorname{vc}(\mathcal{F}).$$


    *Proof* Pajor Lemma states that $|\mathcal{F}|$ is bounded by the number of subsets
    $\Lambda \subseteq \Omega$ shattered by $\mathcal{F}$. The cardinality of each
    such set $\Lambda$ is bounded by $d = \operatorname{vc}(\mathcal{F})$, according
    to the definition of VC dimension. Thus


    $$|\mathcal{F}| \leq |\{\Lambda \subseteq \Omega : |\Lambda| \leq d\}| = \sum_{k=0}^{d}
    \binom{n}{k}$$'
