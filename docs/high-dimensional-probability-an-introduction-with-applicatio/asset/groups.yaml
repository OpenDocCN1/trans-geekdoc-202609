    $$\mathbb{E}X=\mathbb{E}\int_0^\infty \mathbf{1}_{\{t<X\}}\,dt=\int_0^\infty \mathbb{E}\mathbf{1}_{\{t<X\}}\,dt=\int_0^\infty
