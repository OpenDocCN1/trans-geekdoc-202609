    \  \\]\n\n- **9.3** ☕☕（二次矩阵偏差）  \n  让我们证明备注 9.1.5 中的断言：在定理 9.1.1 的条件下，我们有\n  \\\
    [\n  \\mathbb{E} \\sup_{x \\in T} \\bigl|\\|Ax\\|_2^2 - m\\|x\\|_2^2\\bigr| \\\
