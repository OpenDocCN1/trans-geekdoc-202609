    **Theorem 2.2.5** (Hoeffding inequality, two-sided). *Let* $X_1,\ldots,X_N$ *be
    independent Rademacher random variables, and* $a=(a_1,\ldots,a_N)\in\mathbb{R}^N$.
    *Then, for any* $t>0$, *we have*


    $$\mathbb{P}\left\{\left|\sum_{i=1}^{N}a_iX_i\right|\ge t\right\}\le 2\exp\left(-\frac{t^2}{2\|a\|_2^2}\right).$$


    The exponential moment method we used to prove Hoeffding inequality is quite flexible.
    It applies far beyond the canonical example of the Rademacher distribution. For
    example, in Exercise **2.10** you will prove the following extension of Hoeffding
    inequality for general bounded random variables:


    **Theorem 2.2.6** (Hoeffding inequality for bounded random variables). *Let* $X_1,\ldots,X_N$
    *be independent random variables such that* $X_i\in[a_i,b_i]$ *for every* $i$.
    *Then, for any* $t>0$, *we have*


    $$\mathbb{P}\left\{\sum_{i=1}^{N}(X_i-\mathbb{E}X_i)\ge t\right\}\le \exp\left(-\frac{2t^2}{\sum_{i=1}^{N}(b_i-a_i)^2}\right).$$


    # 2.3 Chernoff inequality


    Hoeffding inequality is quite sharp for Rademacher random variables, but it may
    be too conservative for general bounded random variables. For example, when Bernoulli
    random variables $X_i$ have small means $p_i$, their sum approximates a Poisson
    distribution (Theorem **1.7.6**). Hoeffding inequality (Theorem **2.2.6**) does
    not account for small $p_i$, yielding a Gaussian bound that is far from the true
    Poisson tail. Let’s prove an inequality that is sensitive to the sizes of $p_i$:


    **Theorem 2.3.1** (Chernoff inequality). *Let* $X_i$ *be independent Bernoulli
    random variables with parameters* $p_i$. *Consider their sum* $S_N=\sum_{i=1}^{N}X_i$
    *and denote its mean by* $\mu=\mathbb{E}S_N$. *Then*


    $$\mathbb{P}\{S_N\ge t\}\le e^{-\mu}\left(\frac{e\mu}{t}\right)^t\qquad\text{for
    any }t\ge\mu.$$


    *Proof*  We will use the same exponential moment method as in the proof of Hoeffding
    inequality (Theorem **2.2.1**). Just like before, we multiply the inequality $S_N>t$
    by $\lambda>0$, exponentiate, then apply Markov inequality and use independence
    to get (**2.6**):


    $$\mathbb{P}\{S_N\ge t\}\le e^{-\lambda t}\prod_{i=1}^{N}\mathbb{E}\exp(\lambda
    X_i). \tag{2.9}$$


    It remains to bound the MGF of each Bernoulli random variable $X_i$. Since it
    takes value $1$ with probability $p_i$ and $0$ with probability $1-p_i$, we have


    $$\mathbb{E}\exp(\lambda X_i)=e^{\lambda}p_i+(1-p_i)=1+(e^{\lambda}-1)p_i\le\exp\left[(e^{\lambda}-1)p_i\right].$$'
