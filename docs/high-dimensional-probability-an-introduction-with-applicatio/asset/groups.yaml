    for some matrix Σ and number K. Show that for any subset T ⊂ ℝⁿ,


    \[ \mathbb{E} \sup_{x∈T} \big| \|Bx\|_2 - \sqrt{m} \|Σ^{1/2} x\|_2 \big| \le C
    K^2 \gamma(Σ^{1/2} T). \]


    9.5 ☕☕☕ (Quadratic empirical process) In Exercise 8.36, we bounded the deviation
    of the empirical mean from the sample mean for any subgaussian process. Now, let''s
    do the same for the L² mean by extending Theorem 9.1.1. Take any star-shaped⁹
    class ℱ of real-valued functions on a domain Ω, and let X, X₁, X₂, …, Xₙ be i.i.d.
    random points in Ω. Consider the L² metric on ℱ


    \[ d(f,g) := \big( \mathbb{E}(f(X) - g(X))^2 \big)^{1/2} \]


    and assume that


    \[ \|f(X) - g(X)\|_{ψ₂} \le K d(f,g) \quad \text{for all } f,g ∈ ℱ. \]


    Then show:


    \[ \mathbb{E} \sup_{f∈ℱ} \Big| \Big( \frac{1}{m} \sum_{i=1}^{m} f(X_i)^2 \Big)^{1/2}
    - \big( \mathbb{E} f(X)^2 \big)^{1/2} \Big| \le \frac{C K^2 γ₂(F,d)}{\sqrt{m}},
    \]


    where in the right hand side we have the γ₂ functional from Section 8.5. Can you
    see why this result contains Theorem 9.1.1 if T ⊂ S^{n-1}?


    9.6 ☕☕☕☕ (Deviation of random projections) Prove a version of matrix deviation
    inequality (Theorem 9.1.1) for random projections. Let P be the orthogonal projection
    in ℝⁿ on an m-dimensional subspace uniformly distributed in the Grassmanian G_{n,m}.
    Show that for any subset T ⊂ ℝⁿ, we have


    \[ \mathbb{E} \sup_{x∈T} \big| \|Px\|_2 - \sqrt{\frac{m}{n}} \|x\|_2 \big| \le
    \frac{C γ(T)}{\sqrt{n}}. \]


    9.7 ☕☕ (Sizes of projections: a high-probability bound) Let''s get a high-probability
    version of Proposition 9.2.1. Let T ⊂ ℝⁿ be a bounded set, and let A be an m ×
    n matrix with independent, isotropic and subgaussian rows A_i, and consider the
    “subgaussian projection” P = 1/√n A. Show that for ε > 0, the bound


    \[ \operatorname{diam}(PT) \le (1 + ε) \sqrt{\frac{m}{n}} \operatorname{diam}(T)
    + C K^2 w_s(T) \]


    holds with probability at least 1 - exp(-c ε² m / K⁴). Here K = max_i ‖A_i‖_{ψ₂}
    and w_s(T) is the spherical width of T.


    9.8 ☕☕☕ Prove a version of Proposition 9.2.1 for the original model of P considered
    in Section 7.6, i.e. for the projection P onto a random m-dimensional subspace
    E ∼ Unif(G_{n,m}).


    9.9 ☕ (Covariance estimation with high probability) Check the high-probability
    guarantee on the covariance estimation mentioned in Remark 9.2.3.


    ⁹ Star-shaped means that if f is in ℱ, then so is a f for any a ∈ [0,1]. If ℱ
    is not shar-shaped, no problem – just add to it all a f for a ∈ [0,1]; the Gaussian
    complexity stays the same.'
