    $$m \gtrsim s \log(en/s)$$


    个观测值就足以进行稀疏恢复（见练习 9.26）。


    如需更多练习，可以求 $T_{n,s}$ 和 $S_{n,s}$ 的高斯宽度（练习 9.26–9.27），证明关于切割 $\ell^1$ 球的简洁 Garnaev-Gluskin
    定理（练习 9.28），并了解 Lasso——一种流行的稀疏回归方法，它只是 (9.20) 在 $\ell^1$ 范数下的一个特例（练习 9.21）。


    ## 9.4.3 示例：低秩恢复


    这里还有一个高维线性问题的例子：从 $m$ 个线性观测值中恢复一个 $d \times d$ 矩阵 $X$（而不是向量）：


    $$y_i = \langle A_i, X\rangle, \quad i = 1, \dots, m, \tag{9.25}$$


    其中 $A_i$ 是已知的独立随机矩阵，内积为 $\langle A, B\rangle = \operatorname{tr}(A^T B)$，如 (4.7)
    所示。


    通常，你需要 $d^2$ 个观测值——每个元素一个。要想用更少的观测值，我们需要 $X$ 具有某种结构。一种常见的结构是低秩。就像稀疏度统计非零元素个数一样，秩统计非零奇异值的个数。


    因此让我们试着像第 9.4.2 节那样论证。秩——奇异值的 $\ell^0$ 范数——是一个高度非凸的矩阵函数。为了修正这一点，我们进行凸松弛，用 $\ell^1$
    范数，即奇异值之和（称为核范数）来代替它：


    $$\|X\|_* := \sum_{i=1}^d s_i(X).$$


    我们在练习 7.18 中已经看过核范数——如果你跳过了它，现在是回去尝试的好时机。


    由于每个至多有 $s$ 个非零元素且 $\|x\|_2 \le 1$ 的向量 $x$ 满足 $\|x\|_1 \le \sqrt{s}$，因此每个秩至多为
    $r$ 且 $\|X\|_F \le 1$ 的矩阵满足 $\|X\|_* \le \sqrt{r}$（考虑奇异值向量即可建立联系）。因此，考虑 $T = \sqrt{r}
    B_*$ 作为我们的先验是合理的，其中 $B_*$ 是核范数的单位球：


    $$B_* := \{ X \in \mathbb{R}^{d\times d} : \|X\|_* \le 1\}.$$


    恢复程序 (9.18) 变为


    $$\text{找到 } X'' : y_i = \langle A_i, X''\rangle \ \forall i = 1,\dots,m;\quad
    \|X''\|_* \le \sqrt{r}, \tag{9.26}$$


    它是凸的，并且计算上可处理。而定理 9.4.4 给出：


    ### 引理 9.5.2（误差在 $x$ 的支持集上更大）。


    令 $S := \operatorname{supp}(x)$，并令 $h_S \in \mathbb{R}^S$ 表示 $h$ 在 $S$ 上的限制（$S^c$
    上类似）。则


    $$\|h_{S^c}\|_1 \le \|h_S\|_1.$$


    证明  由于 $\hat{x}$ 是程序 (9.27) 中的最小值点，我们有


    $$\|\hat{x}\|_1 \le \|x\|_1. \tag{9.28}$$


    但还有一个下界


    $$\|\hat{x}\|_1 = \|x + h\|_1 = \|x_S + h_S\|_1 + \|x_{S^c} + h_{S^c}\|_1 \ge
    \|x\|_1 - \|h_S\|_1 + \|h_{S^c}\|_1,$$

    其中最后一行由三角不等式以及 $x_S = x$、$x_{S^c}=0$ 得出。将其代入 (9.28) 并化简即可完成证明。 $\square$


    ### 引理 9.5.3（误差近似稀疏）。


    误差向量满足


    $$\|h\|_1 \le 2\sqrt{s}\|h\|_2.$$


    证明  利用引理 9.5.2，再由柯西-施瓦茨不等式，我们得到


    $$\|h\|_1 = \|h_S\|_1 + \|h_{S^c}\|_1 \le 2\|h_S\|_1 \le 2\sqrt{s}\|h_S\|_2 \le
    2\sqrt{s}\|h\|_2.$$ $\square$


    ### 定理 9.5.1 的证明


    假设 $h = \hat{x} - x \ne 0$。引理 9.5.3 给出


    $$\frac{h}{\|h\|_2} \in T_s := \{z \in S^{n-1} : \|z\|_1 \le 2\sqrt{s}\},$$


    并且由于 $Ah = A\hat{x} - Ax = y - y = 0$，我们有


    $$\frac{h}{\|h\|_2} \in T_s \cap \ker A. \tag{9.29}$$


    逃逸定理（定理 9.3.4）表明，只要 $m \ge C_1 K^4 w(T_s)^2$，这个交集以高概率为空。现在，由于 $T_s \subset 2\sqrt{s}
    B_1^n$，我们得到


    $$w(T_s) \le 2\sqrt{s} w(B_1^n) \le C_2 \sqrt{s \log n}, \tag{9.30}$$


    这是由 (7.19) 得到的。因此，如果 $m \ge C K^4 s \log n$，则 (9.29) 中的交集以高概率为空，这意味着 (9.29) 中的包含关系不可能成立。所以，我们关于
    $h \ne 0$ 的假设以高概率为假。证明完成。 $\square$


    ### 注 9.5.4（对数因子的改进）。


    通过略微收紧 (9.30)，我们可以将定理 9.5.1 中所需的观测数量改进为


    $$m \ge C K^4 s \log(en/s).$$


    这由练习 9.26 得出（如何得出？）。


    作为练习，可以尝试从几何角度解释精确恢复的证明（练习 9.30），将其推广到含噪情形（练习 9.31），并发现精确恢复的一个有用的零空间性质（练习 9.32）。


    ## 9.5.2 受限等距性质


    让我们找到一个*确定性*条件来保证矩阵 $A$ 能用于稀疏恢复，并证明随机矩阵满足这个条件。它被称为受限等距性质（RIP）：


    ### 定义 9.5.5（RIP）。


    一个 $m \times n$ 矩阵 $A$ 满足参数为 $\alpha$、$\beta$ 和 $s$ 的*受限等距性质*（RIP），如果不等式


    $$\alpha\|v\|_2 \le \|Av\|_2 \le \beta\|v\|_2$$


    对所有至多有 $s$ 个非零元素的向量 $v \in \mathbb{R}^n$ 成立。


    RIP 只是说 $A$ 的所有 $m \times s$ 子矩阵$^7$ $A_I$ 的奇异值满足：


    $$\alpha \le s_s(A_I) \le s_1(A_I) \le \beta. \tag{9.31}$$


    （为什么？）而如果 $\alpha \approx \beta \approx 1$，RIP 告诉我们所有这些子矩阵都是近似等距的（回顾第 4.1.7 节）。


    ### 定理 9.5.6（RIP 蕴含精确恢复）。


    *假设一个 $m \times n$ 矩阵 $A$ 满足参数为 $\alpha$、$\beta$ 和 $(1+\lambda)s$ 的 RIP，其中 $\lambda
    > (\beta/\alpha)^2$。则每个 $s$-稀疏向量 $x \in \mathbb{R}^n$ 都可以通过求解 (9.27) 从 $y = Ax$
    中精确恢复，即解满足*


    $$\hat{x} = x.$$


    *证明* 如在定理 9.5.1 的证明中一样，我们需要证明误差


    $$h = \hat{x} - x$$


    为零。为此，我们以类似于练习 9.25 的方式分解 $h$。（如果你已经解决了那个练习，那很好，但理解本证明并不需要它。）


    **第 1 步：分解支持集。** 令 $I_0$ 为 $x$ 的支持集。令 $I_1$ 表示 $h_{I_0^c}$ 中按幅度最大的 $\lambda s$
    个元素的下标，令 $I_2$ 表示 $h_{I_0^c}$ 中接下来 $\lambda s$ 个最大元素的下标，依此类推。最后，令 $I_{01} = I_0
    \cup I_1$。由于


    $$Ah = A\hat{x} - Ax = y - y = 0,$$


    三角不等式给出


    $$0 = \|Ah\|_2 \ge \|A_{I_{01}} h_{I_{01}}\|_2 - \|A_{I_{01}^c} h_{I_{01}^c}\|_2.
    \tag{9.32}$$


    接下来，让我们看看右侧的两项。


    **第 2 步：应用 RIP。** 由于 $|I_{0,1}| \le s + \lambda s$，RIP 给出


    $$\|A_{I_{01}} h_{I_{01}}\|_2 \ge \alpha \|h_{I_{01}}\|_2$$


    而三角不等式再结合 RIP 给出


    $$\|A_{I_{01}^c} h_{I_{01}^c}\|_2 \le \sum_{i\ge 2} \|A_{I_i} h_{I_i}\|_2 \le
    \beta \sum_{i\ge 2} \|h_{I_i}\|_2.$$


    7 形式上，$A_I$ 是通过选取由某个 $s$ 元子集 $I \subset \{1,\dots,n\}$ 索引的列构成的 $m \times s$ 子矩阵。


