    \ $g_i \\sim N(0,1)$ 而不是 Rademacher。\n\n## 引理 6.6.2（使用高斯的对称化）\n\n设 $X_1,\\dots,X_N$\
    \ 为赋范空间中独立的均值为零的随机向量。设 $g_1,\\dots,g_N \\sim N(0,1)$ 为独立的高斯随机变量，且也与 $X_i$ 独立。则\n\
    \n$$\\frac{c}{\\sqrt{\\log N}}\\mathbb{E}\\Big\\|\\sum_{i=1}^{N} g_i X_i\\Big\\\
