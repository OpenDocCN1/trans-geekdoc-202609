    For such $a$, the random variables $(\varepsilon_i a_i)$ have the same distribution
    as $(\varepsilon_i)$ by symmetry. Thus


    $$\mathbb{E}\Big\|\sum_{i=1}^{N} a_i \varepsilon_i x_i\Big\| = \mathbb{E}\Big\|\sum_{i=1}^{N}
    \varepsilon_i x_i\Big\|,$$


    Thus, $f(a) \le \mathbb{E}\big\|\sum_{i=1}^{N} \varepsilon_i x_i\big\|$ whenever
    $\|a\|_{\infty} \le 1$, completing the proof. $\square$


    As an application, let us prove a version of symmetrization (Lemma 6.3.2) but
    with Gaussian random variables $g_i \sim N(0,1)$ instead of Rademachers.


    # **Lemma 6.6.2 (Symmetrization with Gaussians).**


    Let $X_1,\dots,X_N$ be independent, mean-zero random vectors in a normed space.
    Let $g_1,\dots,g_N \sim N(0,1)$ be independent Gaussian random variables, which
    are also independent of $X_i$. Then


    $$\frac{c}{\sqrt{\log N}}\mathbb{E}\Big\|\sum_{i=1}^{N} g_i X_i\Big\| \le \mathbb{E}\Big\|\sum_{i=1}^{N}
    X_i\Big\| \le 3\mathbb{E}\Big\|\sum_{i=1}^{N} g_i X_i\Big\|.$$


    *Proof* **Upper bound.** By symmetrization (Lemma 6.3.2), we have


    $$E := \mathbb{E}\Big\|\sum_{i=1}^{N} X_i\Big\| \le 2\mathbb{E}\Big\|\sum_{i=1}^{N}
    \varepsilon_i X_i\Big\|.$$


    To replace the Rademacher random variables with Gaussians, recall that $\mathbb{E}|g_i|
    = \sqrt{2/\pi}$. Thus we can continue our bound as follows.$^8$


    $$\begin{aligned}

    E &\le 2\sqrt{\frac{\pi}{2}}\,\mathbb{E}_X\Big\|\sum_{i=1}^{N} \varepsilon_i \mathbb{E}_g
    |g_i| X_i\Big\| \\

    &\le 2\sqrt{\frac{\pi}{2}}\,\mathbb{E}\Big\|\sum_{i=1}^{N} \varepsilon_i |g_i|
    X_i\Big\| \quad \text{(by Jensen inequality)}\\

    &= 2\sqrt{\frac{\pi}{2}}\,\mathbb{E}\Big\|\sum_{i=1}^{N} g_i X_i\Big\|.

    \end{aligned}$$


    The last equality holds since the random variables $(\varepsilon_i |g_i|)$ have
    the same joint distribution as $(g_i)$ (Lemma 6.3.1(b)).


    **Lower bound** can be proved by using contraction principle (Theorem 6.6.1)


    $^8$ Here we use index $g$ in $\mathbb{E}_g$ to indicate that this is an expectation
    “over $(g_i)$”, i.e. conditional on $(X_i)$. Similarly, $E_X$ denotes the expectation
    over $(X_i)$.'
