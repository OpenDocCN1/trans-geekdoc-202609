    **6.22** ☕☕ (Self-normalized sums) Let $X_1,\ldots,X_N$ be independent symmetric
    random variables. Show that, for any $t>0$,


    $$\mathbb{P}\left\{\left|\sum_{i=1}^{N}X_i\right|\geq t\left(\sum_{i=1}^{N}X_i^2\right)^{1/2}\right\}\leq
    2e^{-t^2/2}.$$


    This is very general—no subgaussian or moment assumptions needed!


    **6.23** ☕☕☕ (Type⁹ p). Let $p\in[1,2]$.


    (a) Let $x_1,\ldots,x_N\in\mathbb{R}^n$ be any (fixed) vectors. Check that


    $$\mathbb{E}\left\|\sum_{i=1}^{N}\varepsilon_i x_i\right\|_p^p\leq\sum_{i=1}^{N}\|x_i\|_p^p.$$


    (b) Generalize part (a) as follows. Let $X_1,\ldots,X_N$ be mean-zero, independent
    random vectors in $\mathbb{R}^n$. Show that


    $$\mathbb{E}\left\|\sum_{i=1}^{N}X_i\right\|_p^p\leq\sum_{i=1}^{N}\mathbb{E}\|X_i\|_p^p.$$


    (c) Show by example that the results in parts (a)–(b) fail for each $p>2$.


    **6.24** ☕☕☕ (Type 2)


    (a) Let $x_1,\ldots,x_N\in\mathbb{R}^n$ be any (fixed) vectors. Check that


    $$\mathbb{E}\left\|\sum_{i=1}^{N}\varepsilon_i x_i\right\|_p^2\leq Cp\sum_{i=1}^{N}\|x_i\|_p^2.$$


    (b) Generalize part (a) as follows. Let $X_1,\ldots,X_N$ be mean-zero, independent
    random vectors in $\mathbb{R}^n$. Show that


    $$\mathbb{E}\left\|\sum_{i=1}^{N}X_i\right\|_p^2\leq Cp\sum_{i=1}^{N}\mathbb{E}\|X_i\|_p^2.$$


    (c) Show by example that the results in parts (a)–(b) fail for each $p<2$.


    **6.25** ☕☕ (Approximate $\ell^p$-Caratheodory theorem) State and prove a version
    of the approximate Caratheodory theorem (Theorem 0.0.2) for the $\ell^p$ norm,
    for any $p\in[1,\infty)$.


    ⁹ Here is a broader perspective: a normed space $X$ is said to be of type $p$
    if there exists $K$ such that $\mathbb{E}\|\sum_{i=1}^{N}\varepsilon_i x_i\|_p^p\leq
    K^p\sum_{i=1}^{N}\|x_i\|^p$ for any $N$ and vectors $x_1,\ldots,x_N\in X$. In
    this and next exercises, we show that $\ell^p$ is of type $p$ if and only if $p\in[1,2]$,
    and type 2 if and only if $p\in[2,\infty)$.'
