    \quad\text{and}\quad

    \mathbb{E}(X_t-X_s)^2\le\mathbb{E}(Y_t-Y_s)^2. \tag{7.3}

    \]


    Then \(\sup_{t\in T}X_t\) is stochastically dominated by \(\sup_{t\in T}Y_t\):
    for every \(\tau\in\mathbb{R}\), we have


    \[

