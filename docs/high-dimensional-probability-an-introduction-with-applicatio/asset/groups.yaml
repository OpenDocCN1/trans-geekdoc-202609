    [7.5.12]). So the takeaway is:


    $$\operatorname{diam}(PT) \gtrsim \begin{cases} \sqrt{\frac{m}{n}}\,\operatorname{diam}(T),
    & \text{if } m \ge d(T) \\ w_s(T), & \text{if } m \le d(T). \end{cases}$$


