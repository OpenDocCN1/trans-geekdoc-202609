    sample only sees the target function T on half of Ω0, but T could do anything
    on the rest – so it can''t be learn reliably.


    8.34 (a) Set T0={0}. For each k∈N, let Tk contain 0 and the largest 2^{2^k}−1
    elements of T.


    8.35 Write |Xt−X_{t0}|≤|Xt−X_{πκ(t)}|+|X_{πκ(t)}−X_{t0}| and bound the two terms
    separately, each with probability 1−exp(u^2). The first term can be bounded by
    Cγ2(T,d) via chaining πκ(t)→πκ+1(t)→πκ+2(t)→…→t (by the choice of κ, the failure
    probabilities in this finer steps are much smaller than exp(−u^2)). The second
    term, corresponding to the first big leap in chaining, can be bounded by C u diam(T)
    by taking a union bound over Tk.


