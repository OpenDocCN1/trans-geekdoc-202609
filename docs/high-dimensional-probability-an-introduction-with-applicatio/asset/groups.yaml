    \ 和 S. Shelah [300] 独立证明。Sauer-Shelah 引理的各种证明可见于文献，例如 [46, 第17章]、[225, 第10.2–10.3节]、[210,\
    \ 第14.3节]。Sauer-Shelah 引理已知有许多变体，参见例如 [158, 312, 313, 15, 337]。增长函数（8.3.4 节）最初由\
    \ Vapnik–Chervonenkis 引入，他们研究了它的各种性质，包括指数-多项式二分性（习题 8.20）。\n\n定理 8.3.13 归功于 R.\
    \ Dudley [114]；参见 [210, 第14.3节]、[329, 定理 2.6.4]。降维引理 8.3.14 隐含在 Dudley 的证明中；它在\
    \ [237] 中被明确陈述，并在 [330, 引理 7.17] 中被复述。关于 VC 理论从 {0, 1} 到一般实值函数类的推广，参见 [237, 288]、[330,\
    \ 第7.3–7.4节]。\n\n自 V. Vapnik 和 A. Chervonenkis [335] 的开创性工作以来，像定理 8.3.15 这样通过\
    \ VC 维对经验过程进行界定的结果一直是统计学习理论的焦点，参见例如 [232, 32, 329, 288]、[330, 第7章]。我们对定理 8.3.15\
    \ 的阐述基于 [330, 推论 7.18]。尽管这一结果的明确表述在早期文献中难以找到，但它可以从 [32, 定理 6]、[56, 第5节] 推导出来。\n\
    \nGlivenko–Cantelli 定理（定理 8.3.17）是 1933 年的结果 [138, 75]，它早于并在一定程度上推动了 VC 理论的后续发展；关于\
    \ Glivenko–Cantelli 定理及概率论中其他一致性结果的更多内容，参见 [210, 第14.2节]、[329, 115]。例 8.3.18 讨论了差异理论中的一个基本问题；关于差异理论的全面论述，参见\
    \ [224]。\n\n在 8.4 节中，我们仅仅触及了统计学习理论的表面，这是概率论、统计学和理论计算机科学交汇处的一个大领域。关于这一主题的更深入介绍，参见例如教程\
    \ [52, 232] 和专著 [171, 156, 196]。\n\n8.5 节介绍的泛链式方法（generic chaining）由 M. Talagrand\
    \ 自 1985 年起提出（在 X. Fernique [124] 的早期工作之后），它是一种获得高斯过程最优界的方法。我们的阐述基于 Talagrand\
    \ 的著作 [315, 316, 317]，这些著作非常详细地讨论了泛链式方法的衍生影响、应用和历史。次高斯过程的上界（定理 8.5.2）可见于 [315,\
    \ 定理 2.2.22]；下界（控制测度定理 8.5.5）可见于 [315, 定理 2.4.1]。Talagrand 比较不等式（推论 8.5.6）引自 [315,\
    \ 定理 2.4.12]。泛链式方法的另一种阐述可见 [330, 第6章]。R. van Handel 最近在 [332, 333] 中给出了控制测度定理的另一种证明。泛链式方法界的高概率版本（注记\
    \ 8.5.4）出自 [316, 定理 2.2.27] 和 [317, 定理 2.7.13]；S. Dirksen [103] 也用另一种方法证明了该结果。\n\
    \n8.6 节涵盖次高斯过程的 Chevet 不等式。对高斯过程而言，该不等式可追溯到 S. Chevet [84]；随后 Y. Gordon [140]\
    \ 改进了其中的常数，从而得到我们在习题 8.39 中陈述的结果。该结果的详细阐述可见 [21, 第9.4节]。关于 Chevet 不等式的变体与应用，参见\
    \ [321, 7]。\n\nSudakov 不等式与 Dudley 不等式之间的对数差距（习题 8.5）是最优的：交叉多胞体 $T=B_1^n$ 就是一个例子（参见\
    \ [317, 习题 2.5.11]）。\n\n次指数 Dudley 不等式（习题 8.7）可以很容易地推广到几乎任何类型的尾部衰减 [210, 第11.1节]。\n\
    \n局部 Dudley 不等式（习题 8.8）是一种在统计学习理论和随机过程连续性证明中有应用的工具，参见 [330, 第5.4节]。\n\n习题 8.10\
    \ 将 Lipschitz 大数定律推广到更高维。关于其历史、推广、改进和（几乎）最优性，参见 [85, 第2章]。\n\n我们在习题 8.21 中得到的界\
    \ $O(dk\\log k)$ 是最优的 [119]。\n\n增长函数的指数-多项式二分性（习题 8.20），以及把大数定律（LLN）中的一致收敛（习题\
    \ 8.28）和可学习性（习题 8.32）刻画为有限 VC 维，本质上都源于 Vapnik 和 Chervonenkis 的原始工作 [335]。\n\n\
    一比特量化（习题 8.26）在信号处理和机器学习中得到了广泛研究，参见例如 [89, 53, 355, 198, 199, 275, 274, 276, 13,\
    \ 341, 92, 265, 189, 278, 168, 28, 351, 105, 129, 106, 104, 226, 81, 107]。习题 8.26\
    \ 的结果来自 [265, 定理 2.2]。\n\n习题 8.27 给出了*小球方法*的一个简化版本，该方法在 [191] 中被引入，用于削弱随机矩阵理论和机器学习中对分布所做的假设\
    \ [234, 235, 208, 207]。\n\n随机矩阵的 $p\\to q$ 范数（习题 8.41）最初在 [37] 中针对有界元素且 $p=2$、$q\\\
    in[2,\\infty)$ 的情形进行了研究；更一般的近期结果可见 [9, 100, 200, 202, 201]。\n\n## 习题\n\n- 8.1\
    \ ♨♨♨（Dudley 不等式：高概率界）修改 8.1 节中的链式论证，得到注记 8.1.6 所述 Dudley 不等式的高概率版本。为此，将 (8.11)\
    \ 升级为高概率版本：\n\n  $$\\sup_{t\\in T}\\left(X_{\\pi_k(t)}-X_{\\pi_{k-1}(t)}\\right)\\\
    le C\\varepsilon_{k-1}\\left[\\sqrt{\\log|T_k|}+z_k\\right] \\tag{8.53}$$\n\n\
    \  其概率至少为 $1-2\\exp(-z_k^2)$。选择 $z_k$ 的值，以便能对 (8.12) 中的所有项取并集界。\n\n- 8.2 ♨♨（高斯过程的\
    \ Dudley：高概率界）结合 Dudley 不等式与高斯集中性（定理 7.1.11），给出注记 8.1.6 中关于高斯过程的结果的另一种证明。\n\n\
    - 8.3 ♨♨（Dudley 积分与求和等价）在定理 8.1.3 的证明中，我们用 Dudley 积分来界定 Dudley 求和。证明它们实际上在常数意义下等价：\n\
