    2.9 (a) Use translation, dilation and the comparison inequality (Exercise 2.8).
    (b) You should get K(λ)=λa+log(b−aeλ). Check that K″(λ)=−abeλ/(−aeλ+b)2 and use
    the AM-GM inequality √xy ≤ (x+y)/2 for x=−aeλ and y=b. Write down the linear approximation
    of K(λ) using Taylor theorem with a remainder in Lagrange form.


    2.10 Follow the proof of Theorem 2.2.1. Use Hoeffding lemma to bound the MGF of
