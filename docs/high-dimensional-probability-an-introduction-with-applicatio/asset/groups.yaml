    # # 2

    # Concentration of Sums of Independent Random Variables


    In this chapter, we step into the vast world of concentration inequalities. We
    start with some motivation in Section 2.1, then move on to key results — Hoeffding
    inequality (Sections 2.2 and 2.7), Chernoff inequality (Section 2.3), Bernstein
    inequality (Section 2.9) and Khintchine inequality (Section 2.7).


    We also introduce two important classes of distributions: subgaussian (Section
    2.6) and subexponential (Section 2.8). They are “natural habitats” for many results
    in high-dimensional probability and its applications.


    We give two applications of concentration inequalities: for robust mean estimation
    in Section 2.4, and for random graphs in Section 2.5. More applications appear
    later in the book.


    Be sure to try the exercises at the end of this chapter! They offer a guided tour
    of many more concepts, methods, results, and applications: the Mills ratio (Exercise
    2.3), small ball probabilities (Exercise 2.7), a version of Le Cam’s two-point
    method (Exercise 2.17), the expander mixing lemma for random graphs (Exercise
    2.20), stochastic dominance (Exercises 2.27 and 2.28), Orlicz norms (Exercise
    2.42), Bennett inequality (Exercise 2.48), and more.


    # ## 2.1 Why concentration inequalities?


    Concentration inequalities measure the deviation of a random variable $X$ from
    its mean $\mathbb{E}X=\mu$. They typically provide two-sided bounds on the tails
    of $X-\mu$ such as:


    $\mathbb{P}\{|X-\mu|>t\}\leq$ something small.


    The simplest concentration inequality is Chebyshev inequality (Corollary 1.6.3).
    It is very general but often too weak. Let us illustrate this with the example
    of the binomial distribution.


    **Question 2.1.1.** *Toss a fair coin $N$ times. What is the probability that
    we get at least $\frac{3}{4}N$ heads?*'
