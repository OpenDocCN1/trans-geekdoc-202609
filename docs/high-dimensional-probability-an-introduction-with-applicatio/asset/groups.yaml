    ### 8.21 ☕☕（VC 稳定性）


    在命题 8.3.11 中，我们观察到，将两个函数类按逐点取最小值或最大值的方式组合时，VC 维数具有稳定性。现在将这一观察推广到任意数量的函数类，以及任意组合方式。设
