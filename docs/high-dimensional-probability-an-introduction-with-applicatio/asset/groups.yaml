    class of Boolean functions $\mathcal{F}$ on a domain $\Omega$, we have $\operatorname{vc}(\mathcal{F})
    \le \dim(\mathcal{F})$, where $\dim(\mathcal{F})$ denotes the linear algebraic
    dimension of $\mathcal{F}$, i.e. the maximal number of linearly independent functions
    in $\mathcal{F}$.


