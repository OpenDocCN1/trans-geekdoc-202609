    4.14 For “the only” part, compute H². It is a block-diagonal matrix, so its eigenvalues
    should be easy to compute.


    4.15 Apply Davis-Kahan inequality (Exercise 4.13 and Theorem 4.1.15) for the Hermitian
    dilation of A (Exercise 4.14).


    4.17 In one direction, assume that property (c) in Lemma 4.1.17 holds, and consider
    the spectral projection of P onto the top n eigenvalues of AAᵀ (what are they?).
    For the opposite direction, use Weyl inequality (Lemma 4.1.14).


    4.19 Use convexity: recall from (1.3) that Bⁿ, the unit ball of ℝⁿ in the ℓ¹ norm,
    is the convex hull of ± canonical basis vectors; then use the maximal principle
    (Exercise 1.4). Deduce the result for the 2 → ∞ norm by duality (Exercise 4.18(c)).


    4.20 (a) Write ‖A‖∞→1 as the maximum of |xᵀAy| over the unit cubes, and use convexity
    as in Exercise 4.19. (b) One direction is trivial by setting Z = xyᵀ. In the other
    direction, express a rank-one matrix Z as Z = uvᵀ, argue that ‖u‖∞‖v‖∞ ≤ 1, and
    rescale u and v to rewrite Z as Z = xyᵀ with ‖x‖∞ = 1 and ‖y‖∞ ≤ 1.


    4.21 To bound ‖A‖∞→1, express it as in Exercise 4.20(a). Decompose xᵀAy = Σᵢ,ⱼ
    Aᵢⱼxᵢyⱼ into four sums according to the value of (xᵢ, yⱼ) ∈ {−1,1}², and bound
    each sum by the cut norm of A. To bound the cut norm of A, fix subsets I and J
    and write Σᵢ∈I,ⱼ∈J Aᵢⱼ as Σᵢ,ⱼ Aᵢⱼ(1+xᵢ)/2 (1+yⱼ)/2 for some vectors x and y with
    ±1 entries. Expand into four sums and bound each against the ∞ → 1 norm of A.


    4.22 For the ‖A‖∞→1 norm, use Exercise 3.52. For the ‖A‖∞→2 norm, express it as
    the maximum of the quadratic form ‖Ax‖₂² = xᵀ(AᵀA)x and use Theorem 3.5.7.


    4.24 (a) Consider a disconnected metric space, such as T = {−1,1} with with the
    usual Euclidean metric. (b) Argue by contradiction: if two balls are not ε-separated,
    the arithmetic mean of their centers lies in both ε/2-balls.


    4.25 If an ε/2-ball centered at x ∉ K covers some point in K, say y ∈ K, the ε-ball
    centered at y works even better in terms of covering K.


    4.26 (a) Removing a point from K makes it impossible to place a ball with that
    center. Make an example where K is a 3-point set. (b) can be proved similarly
    to Exercise 4.25.


    4.27 (a) Try induction on n.


    4.28 Use Exercise 3.7 for i.i.d. random variables Xᵢ ∼ Unif[−½, ½]; it gives a
    bound on the volume of the intersection of a unit cube with the Euclidean ball
    of radius ε√n. Take a very small ε.


    4.29 (a) This is a version of the integrated tail formula (Exercise 1.15(b)) for
    volume instead of probability. To deduce it, modify the proof of Lemma 1.6.1 by
    writing f(‖x‖) = −∫_{‖x‖}^∞ f′(t)dt.


    4.30 (a) Exercise 1.17(a)) will help with the sandwiching.


    4.31 To bound |𝒩|, note that the cubes y + ε/(2√n)(−1,1)ⁿ where y ∈ 𝒩 are disjoint
    and contained in (1 + ε/2)B₂ⁿ. Run the volumetric argument like in the proof of
    Corollary 4.2.11.


    4.33 Deduce from the error correction assumption that the closed balls of radius
    r centered at points E(x) are disjoint. Then run a version of a volumetric argument.


    4.34 (a) Construct the expansion iteratively. Approximate x by x₁ ∈ 𝒩, normalize
    the residual x − x₁ and approximate it by x₂ ∈ 𝒩, etc.


    4.36 Use Lemma 4.4.1 to approximate ‖A‖ with ‖Ax‖₂ for some x ∈ 𝒩; then use Exercise
    4.35 to approximate ‖Ax‖₂ with ⟨Ax, y⟩ for some y ∈ ℳ. For symmetric matrices,
    modify the proof of Lemma 4.4.1 using the identity xᵀAx − x₀ᵀAx₀ = (x − x₀)ᵀA(x
    + x₀).'
