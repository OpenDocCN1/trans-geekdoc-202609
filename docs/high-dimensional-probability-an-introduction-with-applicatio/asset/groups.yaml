    7.26 To obtain the bound \(\mathbb{E}\operatorname{diam}(PT) \gtrsim w_s(T)\),
    reduce \(P\) to a one-dimensional projection by dropping terms from the singular
    value decomposition of \(P\). To obtain the bound \(\mathbb{E}\operatorname{diam}(PT)
    \ge \sqrt{m/n}\operatorname{diam}(T)\), argue about a pair of points in \(T\).


    7.27 Express the operator norm of \(PA\) in terms of the diameter of the ellipsoid
    \(P(AB_2^n)\) and use Theorem 7.6.1 in part (a) and Exercise 7.25 in part (b).


    8.1 Use Gaussian concentration (Theorem 7.1.11) to get (8.53). Choosing, for example,
    \(z_k = u + \sqrt{k} - \kappa\) should make the union bound go through.


    8.4 (a) This should be straightforward from Exercise 2.37.


    (b) The first \(m\) vectors in \(T\) form a \((1/\sqrt{\log m})\)-separated set.


    8.5 Assume \(\operatorname{diam}(T) = 1\), replace the integral by the sum using
    Exercise 8.3, and split the sum into two parts: where \(2^{-k} \le n^{-2}\) (say)
    and \(n^{-2} < 2^{-k} \le 1\). In the first sum, use the volumetric bound (4.17)
    to bound the covering numbers. The second sum has \(O(\log n)\) terms.


    8.6 Start chaining (8.9) at the coarsest scale \(\kappa\), where a single ball
    covers the entire \(T\), i.e. where \(2^{-\kappa} \approx \operatorname{diam}(T)\),
    but stop early—at scale \(K\), where roughly \(2^{-K} \approx w(T)/(8\sqrt{n})\)
    (say). The last term in (8.8) may not be zero as before, but rather \(\mathbb{E}\sup_{t\in
    T}(X_t-X_{\pi_K(t)})\). Bound this term by \(\frac12 w(T)\), using that \(\|t-\pi_K(t)\|_2
    \le 2^{-K}\).


    8.7 Redo the chaining argument in Section 8.1.


    8.8 Consider the set

    \[

    V=\{(s,t)\in T\times T:d(s,t)\le\delta\},

    \]

    define the random process \(Y_u=X_s-X_t\), indexed by \(u=(s,t)\in V\), and define
    the metric on \(V\) by

    \[

    \rho(u,u'')=\frac{1}{2K}\|Y_u-Y_{u''}\|_{\psi_2}.

    \]

    Check that \(\operatorname{diam}(V,\rho)\le\delta\), bound the covering numbers
    of \((V,\rho)\) by those of \((T,d)\), and apply Dudley’s inequality (8.16).


    8.9 Lay a grid on the square \([0,1]^2\) with step size \(\varepsilon\). Given
    \(f\in\mathcal{F}\), show that \(\|f-f_0\|_{L^\infty}\le\varepsilon\) for some
    “staircase” function \(f_0\) that follows the grid by stepping up/down by \(\varepsilon\)
    or staying flat (see Figure H.1). Bound the number of all staircase functions
    by \(e^{C/\varepsilon^2}\). Next, use Exercise 4.25.


    ![](img/b122213aed28c1888de83a894123323e_316_0.png)


    Figure H.1 Approximating a Lipschitz function \(f\) by a mesh-following function
    \(f_0\) (Exercise 8.9).


    8.10 (b) Instead of applying Dudley’s inequality directly, redo the chaining argument
    (proof of Theorem 8.1.4) and make an early stop at scale \(\delta\), as in the
    solution of Exercise 8.6. Once you have proved (8.54), plug in the covering-number
    bound from (a) and optimize \(\delta\).


    8.18 The restriction of \(\mathcal{F}\) onto a shattered subset \(\Lambda\subset\Omega\)
    consists of all Boolean functions on \(\Lambda\), so its linear-algebraic dimension
    must be at least \(|\Lambda|\) (check!).


    8.22 (a) Argue as in the proof of Proposition 8.3.11 and use the Sauer–Shelah
    lemma (Lemma 8.3.9).


    (b) Try to find an example where \(\operatorname{vc}(\mathcal{F})=\operatorname{vc}(\mathcal{G})=1\)
    while \(\operatorname{vc}(\mathcal{F}\cup\mathcal{G})=3\).


    8.24 Proceed similarly to the proof of Theorem 8.3.15. Combine a concentration
    inequality with a union bound over the entire class \(\mathcal{F}\) restricted
    to \(\{X_1,\ldots,X_n\}\). Control the cardinality of \(\mathcal{F}\) using the
    Sauer–Shelah lemma.


    8.25 Apply the VC law of large numbers (Theorem 8.3.15) to the class of indicators
    of half-spaces.


    8.26 (a) Let \(X_1,\ldots,X_m\) denote the rows of \(A\). Then

    \[

    \Phi(u)=\operatorname{sign}(Au)=\bigl(\operatorname{sign}\langle X_i,u\rangle\bigr)_{i=1}^m.

    \]


    (b) Use the uniform law of large numbers (Theorem 8.3.15) for the function class
    \(\mathcal{F}\) consisting of the indicators of the wedges \(\{(x,u)\ne(x,v)\}\),
    where \(u,v\in S^{n-1}\). Use the stability property of VC dimension (Proposition
    8.3.11) to bound the VC dimension of the wedges in terms of the VC dimension of
    half-spaces, which was computed in Example 8.3.5.


    8.27 (a) Let \(X_1,\ldots,X_m\) denote the rows of \(A\). Use the uniform law
    of large numbers (Theorem 8.3.15) for the function class \(\mathcal{F}\) consisting
    of the indicators of the strips

    \[

    \{x:|\langle x,u\rangle|\ge\varepsilon\},

    \]

    where \(u\in S^{n-1}\). Note that \(|\langle X_i,u\rangle|\ge\varepsilon\) implies
    \(\langle X_i,u\rangle^2\ge\varepsilon^2\).


    (b) Consider a random vector \(X\) that, with probability \(\delta\), equals some
    appropriately chosen multiple of the first basis vector \(e_1\), and, with probability
    \(1-\delta\), takes values in the subspace orthogonal to \(e_1\).


    8.28 Pick an arbitrarily large subset \(\Omega_0\subset\Omega\) shattered by \(\mathcal{F}\),
    and let \(X\sim\operatorname{Unif}(\Omega_0)\).


    8.29 Note that \((f-h)^2\) is obtained from \(f\) by flipping the bits \(f(x)\)
    where \(h(x)=1\).


    8.31 Show that the random process \(X_f=R_n(f)-R(f)\) has subgaussian increments:

    \[

    \|X_f-X_g\|_{\psi_2}\lesssim \frac{1}{\sqrt{n}}\|f-g\|_\infty

    \]

    for all \(f,g\in\mathcal{F}\). Use Dudley’s inequality to deduce that

    \[

    \mathbb{E}\sup_{f\in\mathcal{F}}|R_n(f)-R(f)|\lesssim\frac{1}{\sqrt{n}}

    \]

    (see the proof of Theorem 8.2.3). Then argue as in the proof of Theorem 8.4.5.


    8.32 Take a uniform distribution over a shattered set \(\Omega_0\subset\Omega\)
    of size \(\operatorname{vc}(\mathcal{F})\). The sample only sees the target function
    \(T\) on half of \(\Omega_0\), but \(T\) could do anything on the rest—so it cannot
    be learned reliably.


    8.34 (a) Set \(T_0=\{0\}\). For each \(k\in\mathbb{N}\), let \(T_k\) contain \(0\)
    and the largest \(2^{2^k}-1\) elements of \(T\).


    8.35 Write

    \[

    |X_t-X_{t_0}|\le |X_t-X_{\pi_\kappa(t)}|+|X_{\pi_\kappa(t)}-X_{t_0}|

    \]

    and bound the two terms separately, each with probability \(1-\exp(-u^2)\). The
    first term can be bounded by \(C\gamma_2(T,d)\) via chaining

    \[

    \pi_\kappa(t)\to\pi_{\kappa+1}(t)\to\pi_{\kappa+2}(t)\to\cdots\to t

    \]

    (by the choice of \(\kappa\), the failure probabilities in these finer steps are
    much smaller than \(\exp(-u^2)\)). The second term, corresponding to the first
    big leap in chaining, can be bounded by \(Cu\operatorname{diam}(T)\) by taking
    a union bound over \(T_k\).


    8.36 Following the proof of Theorem 8.2.3, check that the process

    \[

    Z_f=\frac{1}{\sqrt{n}}\sum_{i=1}^n f(X_i)-\sqrt{n}\,\mathbb{E}f(X)

    \]

    has subgaussian increments:

    \[

    \|Z_f-Z_g\|_{\psi_2}\lesssim d(f,g).

    \]

    Then apply the generic chaining bound (Theorem 8.5.2).


    8.37 (a) Use Remark 8.5.3 and the majorizing-measure theorem to get a bound in
    terms of the Gaussian width \(w(T\cup\{0\})\), then pass to Gaussian complexity
    using Exercise 7.20.


    (b) Use Remark 8.5.4 and Exercise 7.20.


    8.38 Use duality (1.6) and Talagrand’s comparison inequality (Remark 8.5.9).


    8.39 (a) Follow the proof of Theorem 7.3.1 more closely instead of applying the
    triangle inequality. Use the Sudakov–Fernique inequality (Theorem 7.2.8) instead
    of Talagrand’s comparison inequality.


    (b) Note that

    \[

    \mathbb{E}\sup_{x\in T,y\in S}\langle Ax,y\rangle

    \ge \sup_{x\in T}\mathbb{E}\sup_{y\in S}\langle Ax,y\rangle.

    \]


    8.40 Use the result of Exercise 8.37(b).


    8.41 Use Chevet’s inequality. Exercise 1.17(a) and Exercise 7.17 should help to
    compute the radius and Gaussian width.


    9.2 Bound the difference between \(\mathbb{E}\|Ax\|_2\) and \(\sqrt{m}\|x\|_2\)
    using the concentration of norm (Theorem 3.1.1). Use Lemma 7.5.11(b) to show that
    this difference can be absorbed by the main error.


    9.3 Use the identity \(a^2-b^2=(a-b)(a+b)\).


    9.4 Reduce to the isotropic case: write \(B_i=\Sigma^{1/2}A_i\) for some isotropic
    \(A_i\) and apply Theorem 9.1.1 to \(\Sigma^{1/2}T\).


    9.5 To see why this result generalizes Theorem 9.1.1, express \(\|Ax\|_2\) as

    \[

    \left(\sum_{i=1}^m\langle A_i,x\rangle^2\right)^{1/2},

    \]

    where \(A_i\) are the rows of the matrix \(A\), and consider the class of linear
    functions on \(\mathbb{R}^n\). To prove the generalization, follow the proof of
    Theorem 9.1.1.


