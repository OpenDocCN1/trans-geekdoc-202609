    \ and Remarks [5.6.3, 5.6.4]).\n\n- **7.24 (Modeling a random vector on the sphere)**\
    \ Let $z$ be a fixed vector on the unit sphere $S^{m-1}$, and let $B$ be an $n\\\
    times m$ matrix consisting of the first $m$ columns of a random orthogonal matrix\
    \ $U\\sim\\operatorname{Unif}(O(n))$. Check that $Bz\\sim\\operatorname{Unif}(S^{n-1})$.\n\
    \n$^9$ Recall that $\\langle A,B\\rangle=\\operatorname{tr}(A^\\mathsf{T}B)$ by\
    \ definition ([4.7]).\n\n## Chaining\n\nThis chapter covers some of the central\
    \ methods for bounding random processes $(X_t)_{t\\in T}$. In Section 8.1, we\
    \ introduce the *chaining* technique and use it to bound $\\mathbb{E}\\sup_{t\\\
    in T} X_t$ in terms of covering numbers of $T$, a result known as Dudley inequality.\
    \ We illustrate it in Section 8.2 with an application to Monte Carlo integration\
    \ and *empirical processes*.\n\nThen in Section 8.3 we introduce the *VC theory*,\
    \ which gives combinatorial rather than metric insights into random processes.\
    \ We apply it for *statistical learning theory* in Section 8.4.\n\nIn Section\
    \ 8.5, we refine the chaining method to *generic chaining* and get optimal, two-sided\
    \ bounds on random processes, in terms of Talagrand’s $\\gamma_2(T)$ functional\
    \ (we only prove an upper bound here). A useful consequence is Talagrand comparison\
    \ inequality, which generalizes Sudakov-Fernique inequality for subgaussian processes.\n\
    \nFinally, in Section 8.6, we use Talagrand comparison inequality to derive *Chevet\
    \ inequality*, a handy tool for random bilinear forms over general sets.\n\nWith\
    \ everything you’ve learned, some exercises now feel like fun mini research results\
    \ – Lipschitz law of large numbers in higher dimensions (Exercise 8.10), one-bit\
    \ quantization (Exercise 8.26), the small ball method with applications to heavy-tailed\
    \ random matrices (Exercise 8.27), and $p \\to q$ norms of random matrices (Exercise\
    \ 8.41), just to mention a few!\n\n### 8.1 Dudley inequality\n\nFor a general\
    \ Gaussian process $(X_t)_{t\\in T}$, Sudakov inequality (Theorem 7.4.1) gives\
    \ a *lower* bound on\n\n$\\mathbb{E}\\sup_{t\\in T} X_t$\n\nin terms of the metric\
    \ entropy of $T$. Now we will go for an *upper* bound. And instead of sticking\
    \ just to Gaussian processes, we will take it further and handle more general,\
    \ subgaussian ones.\n\nThis material will be published by Cambridge University\
    \ Press as *High-Dimensional Probability, 2nd Edition* by Roman Vershynin. This\
    \ pre-publication version is free to view and download for personal use only.\
    \ Not for re-distribution, re-sale or use in derivative works. ©Roman Vershynin\
    \ 202X. If you want to be notified when the printed version is available, let\
    \ me know: rvershyn@uci.edu\n"
