    \ lemma, let’s restate it using the effective dimension of the data $d(\\mathcal{X})\
    \ \\asymp w(\\mathcal{X})^2 / \\operatorname{diam}(\\mathcal{X})^2$ (see Definition\
    \ 7.5.12). If we choose\n\n$$m \\gtrsim \\varepsilon^{-2} d(T)$$\n\n(ignoring\
    \ the dependence on $K$ for simplicity), then we can make $\\delta = \\varepsilon\
    \ \\operatorname{diam}(\\mathcal{X})$ in 9.2.4, so $Q$ preserves distances up\
    \ to a small fraction of diameter – in other words, it reduces the dimension of\
    \ the data down to its effective dimension.\n\n## 9.3 Random sections: the $M^*$\
    \ bound and escape theorem\n\nHere is a surprising high-dimensional fact: if you\
    \ slice a convex set $T \\subset \\mathbb{R}^n$ with a random subspace $E$ of\
    \ codimension $m$, the slice $T \\cap E$ is often tiny – even when $m \\ll n$\
    \ and $E$ is nearly full-dimensional! Let’s see how this follows from the matrix\
    \ deviation inequality.\n\n### 9.3.1 The $M^*$ bound\n\nIt is handy to model a\
    \ random subspace $E$ as the kernel of an $m \\times n$ random matrix: $E = \\\
    ker A$. We always have\n\n$$\\dim(E) \\ge n - m,$$\n\nand if $A$ has a continuous\
    \ distribution, $\\dim(E) = n - m$ almost surely.\n\nA great example is a Gaussian\
    \ matrix $A$ with i.i.d. $N(0,1)$ entries – by rotation invariance, $E = \\ker(A)$\
    \ is uniformly distributed in the Grassmanian:\n\n$$E \\sim \\operatorname{Unif}(G_{n,n-m}).$$\n\
    \n### Theorem 9.3.1 ($M^*$ bound).\n\nLet $T \\subset \\mathbb{R}^n$ be a bounded\
    \ set, and let $A$ be an $m \\times n$ random matrix with independent, isotropic\
    \ and subgaussian rows $A_i$. Then the random subspace $E = \\ker A$ satisfies\n\
    \n$$\\mathbb{E} \\operatorname{diam}(T \\cap E) \\le \\frac{C K^2 w(T)}{\\sqrt{m}},$$\n\
    \nwhere $K = \\max_i \\|A_i\\|_{\\psi_2}$.\n\nProof Apply Theorem 9.1.1 for $T\
    \ - T$:\n\n$$\\mathbb{E} \\sup_{x,y \\in T} \\big| \\|Ax - Ay\\|_2 - \\sqrt{m}\
    \ \\|x - y\\|_2 \\big| \\le C K^2 \\gamma(T - T) = 2 C K^2 w(T),$$\n\nby Lemma\
    \ 7.5.11(a). Considering only the points $x, y$ in the kernel of $A$ makes\n\n\
    as long as⁴ $m \\gtrsim d(T)$. Since $\\dim(E)= n - m$, this condition is equivalent\
    \ to\n\n$$\\dim(E) + cd(T) \\le n.$$\n\nThat lines up with linear algebra intuition:\
    \ if $T$ is a centered Euclidean ball in some subspace $F \\subset \\mathbb{R}^n$,\
    \ slicing can shrink the diameter of $T$ only when $\\dim E + \\dim F \\le n$\
    \ (why?).\n\nTo practice, extend the $M^*$ bound to affine sections (Exercise\
    \ 9.12), prove its high-probability version (Exercise 9.13), and compute the diameter\
    \ of a random slice of the $\\ell^p$ ball (Exercise 9.14).\n\n### 9.3.2 The escape\
    \ theorem\n\nWhen does a random subspace $E$ miss a given set $T$ entirely with\
    \ high probability? Not if $T$ contains the origin – but if $T$ lies on the unit\
    \ sphere (see Figure 9.3), then it does as long as the codimension of $E$ is not\
    \ too small:\n\n### Theorem 9.3.4 (Escape theorem).\n\nLet $T \\subset S^{n-1}$\
    \ be any set, and let $A$ be an $m \\times n$ matrix with independent, isotropic\
    \ and subgaussian rows $A_i$. If\n\n$$m \\ge C K^4 w(T)^2, \\tag{9.14}$$\n\nthen\
    \ the random subspace $E = \\ker A$ satisfies\n\n$$T \\cap E = \\varnothing$$\n\
    \nwith probability at least $1 - 2\\exp(-c m / K^4)$. Here $K = \\max_i \\|A_i\\\
    |_{\\psi_2}$.\n\nProof Let us use the high-probability version of matrix deviation\
    \ inequality (see Remark 9.1.4): with probability at least $1 - 2\\exp(-u^2)$,\
    \ $$\\sup_{x\\in T} \\big| \\|Ax\\|_2 - \\sqrt{m} \\big| \\le C_1 K^2 (w(T) +\
    \ u). \\tag{9.15}$$ Suppose (9.15) occurs. If $T \\cap E \\ne \\varnothing$, then\
    \ for any $x \\in T \\cap E$ we have $Ax = 0$, so $$\\sqrt{m} \\le C_1 K^2 (w(T)\
    \ + u).$$ Set $u = \\sqrt{m}/(2 C_1 K^2)$ and simplify this bound to get $$\\\
    sqrt{m} \\le 2 C_1 K^2 w(T),$$ which contradicts the assumption if the absolute\
    \ constant $C$ is large enough. So, with that choice of $u$, the event (9.15)\
    \ implies $T \\cap E = \\varnothing$. Done!\n\nNow show the tightness of the escape\
    \ theorem (Exercise 9.15 and prove its cousin for a point set instead of a subspace\
    \ (Exercise 9.16).\n\n### Remark 9.4.6 (Convex relaxation).\n\nIf $T$ is not convex,\
    \ we can just replace it with its convex hull $\\operatorname{conv}(T)$. This\
    \ turns (9.18) into a convex (and thus tractable) problem. The recovery guarantees\
    \ from Theorem 9.4.4 do not change, since $w(\\operatorname{conv}(T)) = w(T)$\
    \ by Proposition 7.5.2(c).\n\nThe approach we covered is pretty flexible. Try\
    \ it out yourself: analyze the mean squared error (Exercise 9.17), recovery via\
    \ optimization (Exercise 9.18) and the noisy case (9.16) (Exercise 9.19).\n\n\
    ### Remark 9.4.7 (Unconstrained optimization).\n\nForcing strict rules on the\
    \ solution like $y = A x'$ and $x' \\in T$ in (9.18) can be too rigid – noise\
    \ or a bad choice of $T$ might mean no solution exists. A safer move is to relax\
    \ the rules and just *penalize* how much they are broken.\n\nSo, given noisy measurements\n\
    \n$$y = A x + w,$$\n\na good way to recover $x$ is by solving the *unconstrained*\
    \ convex problem:\n\n$$\\operatorname{minimize} \\|y - A x'\\|_2^2 + \\lambda\
    \ \\|x'\\|_T \\quad \\text{over all } x' \\in \\mathbb{R}^n, \\tag{9.20}$$\n\n\
    where $\\|\\cdot\\|_T$ is any norm you like and $\\lambda > 0$ tunes the tradeoff\
    \ between fitting the observations $y$ and keeping the solution $x'$ structured\
    \ (small $\\|x\\|_T$). Adjusting $\\lambda$ lets you decide which to prioritize.\n\
    \nNow, try Exercise 9.20 to prove the recovery guarantee: if $A$ is an $m \\times\
    \ n$ random matrix, and $\\lambda$ is chosen well, then the solution $\\hat{x}$\
    \ satisfies\n\n$$\\mathbb{E}\\|\\hat{x} - x\\|_2 \\lesssim \\frac{w(T)\\|x\\|_T\
    \ + \\|w\\|_2}{\\sqrt{m}},$$\n\nwhere $T$ is the unit ball of $\\|\\cdot\\|_T$.\
    \ In short: if $x$ is well structured (small $\\|x\\|_T$) and the noise $w$ is\
    \ small ($o(1)$ per observation), then you can recover $x$ accurately from $m\
    \ \\asymp d(T)$ observations, where $d(T)$ is the effective dimension of $T$.\n\
    \nIf this feels a bit abstract, two examples will make it clear.\n\n### 9.4.2\
    \ Example: sparse recovery\n\nSometimes we believe that $x$ is *sparse* – most\
    \ of its entries are zero or nearly zero. For instance, in the genetic study (Example\
    \ 9.4.2), maybe only $\\sim 10$ genes really affect a disease, and we want to\
    \ find those. In other applications, $x$ may be sparse in some basis: the audio\
    \ signal from Example 9.4.1 is not sparse in time (see Figure 9.5), but its Fourier\
    \ transform could be sparse – band-limited to a small frequency range.\n\nWe can\
    \ quantify the sparsity of $x \\in \\mathbb{R}^n$ by the number of nonzero entries:\n\
    \n$$\\|x\\|_0 := |\\operatorname{supp}(x)| = |\\{i : x_i \\neq 0\\}|, \\tag{9.21}$$\n\
    \nand we say that $x$ is $s$-sparse if $\\|x\\|_0 \\le s$. The “$\\ell^0$ norm”\
    \ $\\|x\\|_0$ is not really a norm, but is a limit of $\\ell^p$ norms as $p \\\
    to 0$ (see Exercise 9.23).\n"
  mdcn: "\n\n## 9.2.4 无穷集合的 Johnson-Lindenstrauss 引理\n\n矩阵偏差不等式可以快速恢复第 5.3 节中的 Johnson-Lindenstrauss\
    \ 引理——并将其推广到一般的、可能是无限的集合。\n\n为了从矩阵偏差中得到 Johnson-Lindenstrauss（定理 5.3.1）的一个版本，固定任意\
    \ N 点集 $\\mathcal{X} \\in \\mathbb{R}^n$，并考虑归一化差值：\n\n$T := \\left\\{ \\frac{x\
    \ - y}{\\|x - y\\|_2} : x,y \\in \\mathcal{X} \\text{ distinct} \\right\\}$\n\n\
    $T$ 的高斯复杂度满足\n\n$\\gamma(T) \\le C \\sqrt{\\log N}$\n(9.12)\n\n（仿照示例 7.5.9 验证这一点）。矩阵偏差不等式（定理\
    \ 9.1.1）表明，以高概率，$^2$\n\n$\\sup_{x,y \\in \\mathcal{X}} \\left| \\frac{\\|Ax -\
    \ Ay\\|_2}{\\|x - y\\|_2} - \\sqrt{m} \\right| \\lesssim \\sqrt{\\log N}$。\n\n\
    重新整理各项，将其改写如下：随机矩阵 $Q := \\frac{1}{\\sqrt{m}} A$ 是 $\\mathcal{X}$ 上的近似等距映射，即\n\
    \n$(1 - \\varepsilon)\\|x - y\\|_2 \\le \\|Qx - Qy\\|_2 \\le (1 + \\varepsilon)\\\
    |x - y\\|_2 \\quad \\text{for all } x,y \\in \\mathcal{X}$\n\n其中 $\\varepsilon\
    \ \\asymp \\sqrt{\\log(N)/m}$。等价地，如果我们固定 $\\varepsilon > 0$ 并选择\n\n$m \\gtrsim\
    \ \\varepsilon^{-2} \\log N$，\n那么以高概率 $Q$ 是 $\\mathcal{X}$ 上的 $\\varepsilon$-等距映射，这恢复了经典\
    \ Johnson-Lindenstrauss 引理（定理 5.3.1）的一个版本。\n\n我们刚才给出的论证并不关心 $\\mathcal{X}$ 是否有限——唯一重要的是高斯宽度。因此我们可以将\
    \ Johnson-Lindenstrauss 引理推广到任意集合：\n\n### 引理 9.2.4（加性 Johnson-Lindenstrauss 引理）。\n\
    \n设 $\\mathcal{X} \\subset \\mathbb{R}^n$ 是一个有界集合，$A$ 是一个 $m \\times n$ 随机矩阵，其行\
    \ $A_i$ 独立、各向同性且次高斯。那么，以高概率（例如 0.99），缩放矩阵 $Q = \\frac{1}{\\sqrt{m}} A$ 满足\n\n\
    $\\big|\\|Qx - Qy\\|_2 - \\|x - y\\|_2\\big| \\le \\delta \\quad \\text{for all\
    \ } x,y \\in \\mathcal{X}$\n其中 $\\delta = C K^2 w(\\mathcal{X})/\\sqrt{m}$，$K\
    \ = \\max_i \\|A_i\\|_{\\psi_2}$。\n\n证明 对差集 $T = \\mathcal{X} - \\mathcal{X} =\
    \ \\{x - y : x \\in \\mathcal{X}, y \\in \\mathcal{X}\\}$ 应用矩阵偏差不等式（定理 9.1.1）。那么，以高概率，\n\
    \n$\\sup_{x,y \\in \\mathcal{X}} \\big| \\|Ax - Ay\\|_2 - \\sqrt{m} \\|x - y\\\
    |_2 \\big| \\le C K^2 \\gamma(\\mathcal{X} - \\mathcal{X}) = 2 C K^2 w(\\mathcal{X})$，\
    \ \n由引理 7.5.11(a) 可得。两边除以 $\\sqrt{m}$ 即可完成证明。$\\square$\n\n$^2$ 为简单起见，我们将采用 99%\
    \ 的成功概率（通过马尔可夫不等式），并忽略对次高斯范数 $K$ 的依赖。你将在练习 9.10 中将这一点精确化。\n\n不同于针对有限集合的经典 Johnson-Lindenstrauss\
    \ 引理（定理 5.3.1）给出的是相对误差，这里我们得到的是绝对误差 δ。这是个小差异——但一般而言是必要的（见练习 9.11）。\n\n### 注记 9.2.5（有效维数）。\n\
    \n为了更好地理解加性 Johnson-Lindenstrauss 引理，让我们用数据的有效维数 $d(\\mathcal{X}) \\asymp w(\\\
    mathcal{X})^2 / \\operatorname{diam}(\\mathcal{X})^2$ 来重新表述它（见定义 7.5.12）。如果我们选择\n\
    \n$$m \\gtrsim \\varepsilon^{-2} d(T)$$\n\n（为简单起见忽略对 $K$ 的依赖），那么我们可以令引理 9.2.4\
    \ 中的 $\\delta = \\varepsilon \\operatorname{diam}(\\mathcal{X})$，从而 $Q$ 保持距离，误差不超过直径的一小部分——换句话说，它将数据的维数降至其有效维数。\n\
    \n## 9.3 随机截面：$M^*$ 界与逃逸定理\n\n这里有一个令人惊讶的高维事实：如果你用一个余维数为 $m$ 的随机子空间 $E$ 去切割凸集 $T\
    \ \\subset \\mathbb{R}^n$，截面 $T \\cap E$ 通常非常小——即使当 $m \\ll n$ 且 $E$ 几乎是全维时也是如此！让我们看看这如何从矩阵偏差不等式推出。\n\
    \n### 9.3.1 $M^*$ 界\n\n一种方便的做法是将随机子空间 $E$ 建模为 $m \\times n$ 随机矩阵的核：$E = \\ker\
    \ A$。我们总有\n\n$$\\dim(E) \\ge n - m,$$\n\n并且如果 $A$ 具有连续分布，那么 $\\dim(E) = n - m$\
    \ 几乎必然成立。\n\n一个很好的例子是项为 i.i.d. $N(0,1)$ 的高斯矩阵 $A$——由旋转不变性，$E = \\ker(A)$ 在 Grassmann\
    \ 流形上均匀分布：\n\n$$E \\sim \\operatorname{Unif}(G_{n,n-m}).$$\n\n### 定理 9.3.1（$M^*$\
    \ 界）。\n\n设 $T \\subset \\mathbb{R}^n$ 是一个有界集合，$A$ 是一个 $m \\times n$ 随机矩阵，其行 $A_i$\
    \ 独立、各向同性且次高斯。则随机子空间 $E = \\ker A$ 满足\n\n$$\\mathbb{E} \\operatorname{diam}(T\
    \ \\cap E) \\le \\frac{C K^2 w(T)}{\\sqrt{m}},$$\n\n其中 $K = \\max_i \\|A_i\\|_{\\\
    psi_2}$。\n\n证明 对 $T - T$ 应用定理 9.1.1：\n\n$$\\mathbb{E} \\sup_{x,y \\in T} \\big|\
    \ \\|Ax - Ay\\|_2 - \\sqrt{m} \\|x - y\\|_2 \\big| \\le C K^2 \\gamma(T - T) =\
    \ 2 C K^2 w(T),$$\n\n由引理 7.5.11(a) 可得。仅考虑核 $\\ker A$ 中的点 $x, y$，则只要⁴ $m \\gtrsim\
    \ d(T)$。由于 $\\dim(E) = n - m$，此条件等价于\n\n$$\\dim(E) + cd(T) \\le n.$$\n\n这与线性代数的直觉相符：如果\
    \ $T$ 是某个子空间 $F \\subset \\mathbb{R}^n$ 中以原点为中心的欧几里得球，那么只有当 $\\dim E + \\dim F\
    \ \\le n$ 时，切割才能缩小 $T$ 的直径（为什么？）。\n\n为了练习，请将 $M^*$ 界推广到仿射截面（练习 9.12），证明其高概率版本（练习\
    \ 9.13），并计算 $\\ell^p$ 球的随机截面的直径（练习 9.14）。\n\n### 9.3.2 逃逸定理\n\n随机子空间 $E$ 何时能以高概率完全避开给定的集合\
    \ $T$？如果 $T$ 包含原点，则不能——但如果 $T$ 位于单位球面上（见图 9.3），那么只要 $E$ 的余维数不太小，就可以做到：\n\n###\
    \ 定理 9.3.4（逃逸定理）。\n\n设 $T \\subset S^{n-1}$ 是任意集合，$A$ 是一个 $m \\times n$ 矩阵，其行\
    \ $A_i$ 独立、各向同性且次高斯。如果\n\n$$m \\ge C K^4 w(T)^2, \\tag{9.14}$$\n\n则随机子空间 $E =\
    \ \\ker A$ 满足\n\n$$T \\cap E = \\varnothing$$\n\n以至少 $1 - 2\\exp(-c m / K^4)$\
    \ 的概率。这里 $K = \\max_i \\|A_i\\|_{\\psi_2}$。\n\n证明 我们使用矩阵偏差不等式的高概率版本（见注记 9.1.4）：以至少\
    \ $1 - 2\\exp(-u^2)$ 的概率，$$\\sup_{x\\in T} \\big| \\|Ax\\|_2 - \\sqrt{m} \\big|\
    \ \\le C_1 K^2 (w(T) + u). \\tag{9.15}$$ 假设 (9.15) 发生。如果 $T \\cap E \\ne \\varnothing$，那么对任意\
    \ $x \\in T \\cap E$ 有 $Ax = 0$，因此 $$\\sqrt{m} \\le C_1 K^2 (w(T) + u).$$ 令 $u\
    \ = \\sqrt{m}/(2 C_1 K^2)$ 并化简此界，得到 $$\\sqrt{m} \\le 2 C_1 K^2 w(T),$$ 只要绝对常数\
    \ $C$ 足够大，这就与假设矛盾。因此，在这样的 $u$ 选择下，事件 (9.15) 蕴含 $T \\cap E = \\varnothing$。证毕！\n\
    \n现在请证明逃逸定理的紧性（练习 9.15），并证明其针对点集而非子空间的姊妹版本（练习 9.16）。\n\n### 注记 9.4.6（凸松弛）。\n\n\
    如果 $T$ 不是凸的，我们可以直接将其替换为它的凸包 $\\operatorname{conv}(T)$。这将把 (9.18) 变成一个凸（因此可处理）的问题。定理\
    \ 9.4.4 中的恢复保证不变，因为由命题 7.5.2(c) 可知 $w(\\operatorname{conv}(T)) = w(T)$。\n\n我们介绍的方法相当灵活。请自行尝试：分析均方误差（练习\
    \ 9.17）、通过优化进行恢复（练习 9.18）以及含噪情形 (9.16)（练习 9.19）。\n\n### 注记 9.4.7（无约束优化）。\n\n像\
    \ (9.18) 中那样对解施加 $y = A x'$ 和 $x' \\in T$ 的严格规则可能过于僵硬——噪声或 $T$ 的选择不当可能意味着解不存在。更安全的做法是放宽规则，并且只对违反程度进行*惩罚*。\n\
    \n因此，给定含噪观测\n\n$$y = A x + w,$$\n\n恢复 $x$ 的一个好方法是求解以下*无约束*凸问题：\n\n$$\\operatorname{minimize}\
    \ \\|y - A x'\\|_2^2 + \\lambda \\|x'\\|_T \\quad \\text{over all } x' \\in \\\
    mathbb{R}^n, \\tag{9.20}$$\n\n其中 $\\|\\cdot\\|_T$ 是你喜欢的任意范数，$\\lambda > 0$ 用来调节拟合观测\
    \ $y$ 与保持解 $x'$ 的结构性（$\\|x\\|_T$ 较小）之间的权衡。调整 $\\lambda$ 可以让你决定优先考虑哪一方面。\n\n现在，尝试练习\
    \ 9.20 来证明恢复保证：如果 $A$ 是一个 $m \\times n$ 随机矩阵，并且 $\\lambda$ 选择得当，那么解 $\\hat{x}$\
    \ 满足\n\n$$\\mathbb{E}\\|\\hat{x} - x\\|_2 \\lesssim \\frac{w(T)\\|x\\|_T + \\\
    |w\\|_2}{\\sqrt{m}},$$\n\n其中 $T$ 是 $\\|\\cdot\\|_T$ 的单位球。简而言之：如果 $x$ 结构良好（$\\\
    |x\\|_T$ 较小）且噪声 $w$ 很小（每个观测为 $o(1)$），那么你可以从 $m \\asymp d(T)$ 个观测中精确恢复 $x$，其中 $d(T)$\
    \ 是 $T$ 的有效维数。\n\n如果这感觉有点抽象，那么两个例子就能说明白。\n\n### 9.4.2 示例：稀疏恢复\n\n有时我们相信 $x$ 是*稀疏*的——它的大多数分量为零或接近于零。例如，在遗传学研究中（示例\
    \ 9.4.2），也许只有 $\\sim 10$ 个基因真正影响某种疾病，而我们希望找到这些基因。在其他应用中，$x$ 可能在某个基下是稀疏的：来自示例 9.4.1\
    \ 的音频信号在时域上并不稀疏（见图 9.5），但它的傅里叶变换可能是稀疏的——即带限于一个小的频率范围。\n\n我们可以用非零分量的个数来量化 $x \\\
    in \\mathbb{R}^n$ 的稀疏程度：\n\n$$\\|x\\|_0 := |\\operatorname{supp}(x)| = |\\{i :\
    \ x_i \\neq 0\\}|, \\tag{9.21}$$\n\n并且当 $\\|x\\|_0 \\le s$ 时，我们说 $x$ 是 $s$-稀疏的。“$\\\
    ell^0$ 范数” $\\|x\\|_0$ 实际上并不是一个范数，但它是 $\\ell^p$ 范数在 $p \\to 0$ 时的极限（见练习 9.23）。\n\
    \n"
