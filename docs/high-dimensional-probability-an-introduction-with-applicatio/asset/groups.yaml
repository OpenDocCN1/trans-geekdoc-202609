    2.12 Express the probability in terms of binomial coefficients. To lower bound
    the binomial coefficient, use the result of Exercise 0.6. To handle one of the
    remaining terms (1−μ/N)N−t, prove that the smaller quantity (1−μ/N)N−μ is bounded
    below by e−μ.


    2.14 Check and use the numeric inequality ln(1+x) ≥ x/(1+x/2) for all x ≥ 0.


    2.15 Use the MGF comparison inequality (Exercise 2.8).


    2.16 Argue that we can assume that t ≥ 10 without loss of generality. Choose B
    = ⌈t2/4⌉. If B does not divide N, make one of the blocks larger than B.


    2.17 (a) Using triangle inequality, check that the ratio of the densities of Xi
    ∼ Lap(0,1) and Yi ∼ Lap(μ,1) is uniformly bounded by e−μ. Write down the densities
    of X and Y. Express the probabilities P{X ∈ B} and P{Y ∈ B} in terms of the densities
    of X and Y.'
