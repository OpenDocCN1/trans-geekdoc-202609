    ### Remark 5.4.11 (Matrix Bernstein inequality: expectation)


    Matrix Bernstein inequality gives a high-probability bound. It can be turned into
    a simpler (but less informative) expectation bound in a standard way, using the
    integrated tail formula (Lemma 1.6.1). Try Exercise 5.20 to deduce from Theorem
    5.4.1 that

    \[

    \mathbb{E}\left\|\sum_{i=1}^N X_i\right\|

    \lesssim

    \left\|\sum_{i=1}^N \mathbb{E}X_i^2\right\|^{1/2}\sqrt{\log(2n)}

    + K\log(2n),

    \tag{5.17}

    \]


    ## 5.5 Application: community detection in sparse networks


    In Section 4.5, we explored spectral clustering, a basic method for community
    detection in networks. We analyzed its performance on the stochastic block model
    $G(n,p,q)$ with two communities and showed it works for relatively *dense* networks,
    where the expected average degree $\gtrsim \sqrt{n}$ (Remark 4.5.3). Now, using
    matrix Bernstein inequality, we will show that spectral clustering actually works
    for *much sparser* networks, with an expected average degree as low as $O(\log
    n)$.


    ### Theorem 5.5.1 (Spectral clustering for sparse stochastic block model)


    *Let $G \sim G(n,p,q)$ where$^{16}$ $p = a/n$, $q = b/n$ and $b < a < 3b$. Assume
    that*

    \[

    (a-b)^2 \ge C a \log n.

    \]


    *Then, with probability at least 0.99, the spectral clustering algorithm (Section
    4.5.5) identifies the communities of $G$ with 99% accuracy, i.e. misclassifying
    at most 0.01$n$ vertices.*


    *Proof.* Let’s follow the argument in Section 4.5, just with a sharper error bound.


    ### Step 1: Decomposition


    Like in Section 4.5.2, we look at the adjacency matrix $A$ of a random graph $G
    \sim G(n,p,q)$, and split it into deterministic and random parts:

    \[

    A = D + R \quad \text{where} \quad D = \mathbb{E}A.

    \]


    In Section 4.5.2, we analyzed the expected adjacency matrix $D$, noting that its
    second top eigenvector $u_2(D)$ has $\pm1$ coefficients that represent community
    membership. The main difference now is in analyzing the random part

    \[

    R = A - \mathbb{E}A.

    \]


    Let’s decompose it entry by entry, keeping symmetry in mind. Denote the standard
    basis vectors in $\mathbb{R}^n$ by $e_1,\dots,e_n$ and write $R$ as a *sum of
    independent, mean-zero random matrices* $Z_{ij}$ that isolate entries $(i,j)$
    and $(j,i)$:

    \[

    R = \sum_{i \le j} Z_{ij}, \quad \text{where} \quad

    Z_{ij} =

    \begin{cases}

    R_{ij}(e_i e_j^\top + e_j e_i^\top), & i < j,\\

    R_{ii}e_i e_i^\top, & i = j.

    \end{cases}

    \]


    ### Step 2: Bounding the error


    Since $A_{ij} \in \{0,1\}$, we have $|R_{ij}| \le 1$, so $\|Z_{ij}\| = \|R_{ij}\|
    \le 1$ (why?). Thus, applying matrix Bernstein inequality (5.17) combined with
    Markov inequality, we obtain with probability at least 0.99:

    \[

    \|R\| \lesssim \sigma\sqrt{\log n} + \log n

    \quad \text{where} \quad

    \sigma^2 = \left\|\mathbb{E}\sum_{i \le j} Z_{ij}^2\right\|.

    \tag{5.18}

    \]


    $^{16}$ With this parametrization, any node is connected to $a/2$ nodes in its
    own community and $b/2$ nodes in the other, on average. (Why?)


    ### Remark 5.5.2 (Sparsity)


    The sparsest graphs for which Theorem 5.5.1 is non-trivial have expected average
    degree

    \[

    \frac{n(p+q)}{2} = \frac{a+b}{2} \asymp \log n.

    \]


    That’s way sparser than $O(\sqrt{n})$ we have achieved previously (Remark 4.5.3)!


    To practice more with these ideas, try Exercise 5.25 to do community detection
    in the stochastic block model without loops (a pretty natural model).


    ## 5.6 Application: covariance estimation for general distributions


    In Section 4.7, we learned how to estimate the covariance matrix of a subgaussian
    distribution in $\mathbb{R}^n$ from a sample of size $O(n)$. Now, we drop the
    subgaussian assumption, making it work for much broader distributions, even discrete
    ones. The trade-off is just a logarithmic oversampling factor!


    Like in Section 4.7, we estimate the second moment matrix $\Sigma = \mathbb{E}XX^{\top}$
    by its sample version

    \[

    \Sigma_m = \frac{1}{m}\sum_{i=1}^m X_iX_i^{\top}.

    \]


    If $X$ has zero mean, then $\Sigma$ is the covariance matrix of $X$, and $\Sigma_m$
    is the sample covariance matrix.


    ### Theorem 5.6.1 (General covariance estimation)


    Let $X$ be a random vector in $\mathbb{R}^n$, $n \ge 2$. Assume that for some
    $K \ge 1$,

    \[

    \|X\|_2 \le K(\mathbb{E}\|X\|_2^2)^{1/2}

    \quad \text{almost surely.}

    \tag{5.20}

    \]


    Then, for every positive integer $m$, we have

    \[

    \mathbb{E}\|\Sigma_m - \Sigma\|

    \le

    C\left(\sqrt{\frac{K^2n\log n}{m}} + \frac{K^2n\log n}{m}\right)\|\Sigma\|.

    \]


    *Proof.* By Proposition 3.2.1(b), we have $\mathbb{E}\|X\|_2^2 = \operatorname{tr}(\Sigma)$,
    so (5.20) becomes

    \[

    \|X\|_2^2 \le K^2\operatorname{tr}(\Sigma)

    \quad \text{almost surely.}

    \tag{5.21}

    \]


    Apply the expected version of matrix Bernstein inequality (5.17) for the sum of
    i.i.d. mean-zero random matrices $X_iX_i^{\top} - \Sigma$ and get$^{17}$

    \[

    \mathbb{E}\|\Sigma_m - \Sigma\|

    =

    \frac{1}{m}\mathbb{E}\left\|\sum_{i=1}^m (X_iX_i^{\top} - \Sigma)\right\|

    \lesssim

    \frac{1}{m}\big(\sigma\sqrt{\log n} + M\log n\big)

    \tag{5.22}

    \]

    where

    \[

    \sigma^2

    =

    \left\|\sum_{i=1}^m \mathbb{E}(X_iX_i^{\top} - \Sigma)^2\right\|

    =

    m\left\|\mathbb{E}(XX^{\top} - \Sigma)^2\right\|.

    \]


    $^{17}$ As usual, the notation $a \lesssim b$ hides absolute constant factors,
    i.e. it means that $a \le Cb$ where $C$ is an absolute constant.


    Compare this to the normal MGF formula (2.16). Applied to the normal random variable
    $g^{\top}AX'' = \langle g, AX''\rangle$ (still conditionally on $X''$), it gives

    \[

    \mathbb{E}_g\exp(\mu g^{\top}AX'')

    =

    \exp(\mu^2\|AX''\|_2^2/2),

    \quad \mu \in \mathbb{R}.

    \tag{6.10}

    \]


    Setting $\mu = \sqrt{2C}K\lambda$, we match the right sides of (6.9) and (6.10)
    and obtain

    \[

    \mathbb{E}_X\exp(\lambda X^{\top}AX'')

    \le

    \mathbb{E}_g\exp(\sqrt{2C}K\lambda g^{\top}AX'').

    \]


    Taking expectation over $X''$ of both sides, we see that we have replaced $X$
    by $g$ in the chaos, at a cost of the factor $\sqrt{2C}K$. Repeating for $X''$,
    we can replace it with $g''$, paying another factor $\sqrt{2C}K$. (Try it yourself!)


    Now we move on to step (c) of our plan:


    ### Lemma 6.2.4 (MGF of a Gaussian quadratic form)


    *Let $A = (a_{ij})$ be an $n \times n$ matrix, and let $g, g'' \sim N(0,I_n)$
    be independent. Then*

    \[

    \mathbb{E}\exp(\lambda g^{\top}Ag'')

    \le

    \exp(\lambda^2\|A\|_F^2)

    \quad \text{whenever} \quad

    |\lambda| \le \frac{1}{2\|A\|}.

    \]


    *Proof.* Let’s use rotation invariance of the normal distribution to diagonalize
    $A$. With its singular value decomposition (4.4), $A = U\Sigma V^{\top}$, we can
    write

    \[

    g^{\top}Ag'' = (U^{\top}g)^{\top}\Sigma(V^{\top}g'').

    \]


    By rotation invariance of the normal distribution (Proposition 3.3.1), $U^{\top}g$
    and $V^{\top}g''$ are independent standard normal random vectors in $\mathbb{R}^n$.
    So,

    \[

    g^{\top}Ag''

    \stackrel{\text{dist}}{=}

    g^{\top}\Sigma g''

    =

    \sum_{i=1}^n s_i g_i g_i'',

    \]

    where “dist” indicates equality in distribution and $s_i$ are the singular values
    of $A$. This is a sum of independent random variables, so

    \[

    \mathbb{E}\exp(\lambda g^{\top}Ag'')

    =

    \mathbb{E}\prod_i \mathbb{E}\exp(\lambda s_i g_i g_i'')

    =

    \prod_i \mathbb{E}\exp(\lambda s_i g_i g_i'').

    \tag{6.11}

    \]


    Now, for each $i$ and $t \in \mathbb{R}$, we have

    \[

    \mathbb{E}\exp(tg_i g_i'')

