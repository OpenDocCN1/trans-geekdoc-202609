    $$\operatorname{diam}(PT)\asymp\max\left[w_s(T),\sqrt{\frac mn}\operatorname{diam}(T)\right].$$


    我们来找出这两项相等时的“相变”点。令它们相等并解出 $m$：


    $$m=\frac{(\sqrt{n}\,w_s(T))^2}{\operatorname{diam}(T)^2}\asymp\frac{w(T)^2}{\operatorname{diam}(T)^2}\asymp
