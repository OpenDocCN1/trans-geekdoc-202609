    1.13 (a) To prove the first inequality, use Jensen inequality (1.19) for the random
    vector X = (X1,…,Xn). Guess which norm you should use here. To prove the second
    inequality, bound the maximum of n nonnegative numbers by the sum. (c) Consider
    independent Bernoulli random variables Ber(pn); find the value of pn that make
    the argument work.


    1.14 Both bounds follow from Jensen inequality. For the first bound, use (1.19)
