    Splitting the event based on whether $E_n$ occurs, we get


    $$\mathbb{P}\{\sqrt{n}\langle X,v\rangle\le t\}\le \mathbb{P}\{\sqrt{n}\langle
    X,v\rangle\le t\text{ and }E_n\}+\mathbb{P}(E_n^c)$$

    $$\le \mathbb{P}\{g_1\le t_n\}+p_n.$$


    Hence


    $$\mathbb{P}\{\sqrt{n}\langle X,v\rangle\le t\}-\mathbb{P}\{g_1\le t\}\le \mathbb{P}\{g_1\in[t,t_n]\}+p_n.
    \tag{3.18}$$


    The density of $g_1$ on $[t,t_n]$ is bounded by $e^{-t^2/2}$, so


    $$(3.18)\le e^{-t^2/2}(t_n-t)+p_n=e^{-t^2/2}\frac{\ln n}{\sqrt n}+p_n\le \frac{C\ln
    n}{\sqrt n}+p_n.$$


    The right-hand side does not depend on $v$ or $t$, and it goes to zero as $n\to\infty$.
    A similar argument gives a bound on $\mathbb{P}\{g_1\le t\}-\mathbb{P}\{\sqrt{n}\langle
    X,v\rangle\le t\}$ that also goes to zero. (Do it!) Combining the two bounds completes
    the proof.


    **Remark 3.3.10** (The density of the 1D marginals of the sphere). The density
    of the 1D marginals of the uniform distribution on the sphere of radius $\sqrt
    n$ can be computed. As you will see in Exercise $3.27$, it is proportional to
    $(1-x^2/n)^{\frac{n-3}{2}}$. For large $n$, this approximates $e^{-x^2/2}$, consistent
    with the Gaussian limit.


    # ### 3.3.4 Uniform on a convex set


    This example comes from convex and computational geometry. A bounded convex set
    $K\subset\mathbb{R}^n$ with a non-empty interior is called a *convex body*. Let
    $X$ be a random vector uniformly distributed in $K$:


    $$X\sim\operatorname{Unif}(K).$$


    The density of $X$ equals $1/\operatorname{Vol}(K)$ on $K$ and zero elsewhere.
    The mean of $X$,


    $$\mu=\mathbb{E}X=\frac{1}{\operatorname{Vol}(K)}\int_K x\,dx,$$


    is the center of gravity of $K$. If $\Sigma=\operatorname{cov}(X)$ is the covariance
    matrix of $K$, then the standard score $Z:=\Sigma^{-1/2}(X-\mu)$ is an isotropic
    random vector, as we noticed in $(3.10)$. Also, $Z$ is uniformly distributed in
    the affinely transformed copy of $K$:


    $$Z\sim\operatorname{Unif}\left(\Sigma^{-1/2}(K-\mu)\right).$$


    (Why?) In summary, we found an affine transformation $T$ that makes the uniform
    distribution on $T(K)$ isotropic. The convex body $T(K)$ is often itself called
    an isotropic convex body.


    In algorithmic convex geometry, we can think of the isotropic convex body $T(K)$
    as a well-conditioned version of $K$, with $T$ acting like a *preconditioner*
    (see Figure $3.6$). Algorithms such as finding the volume of $K$ usually work
    better when $K$ is well-conditioned.'
