    到目前为止，我们已经对两类函数类的经验过程给出了界：Lipschitz 函数类（定理 8.2.3）和 VC 维数有限的布尔函数类（定理 8.3.15）。现在考虑一般情形。取定义在域
    \(\Omega\) 上的任意实值函数类 \(\mathcal{F}\)，并设 \(X, X_1, X_2, \ldots, X_n\) 是 \(\Omega\)
