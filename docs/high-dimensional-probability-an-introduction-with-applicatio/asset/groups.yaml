    \ $A_I$. First, fix $I$. By Theorem 4.6.1, we get\n\n$$0.9\\sqrt{m} \\le s_s(A_I)\
    \ \\le s_1(A_I) \\le 1.1\\sqrt{m}$$ (9.34)\n\nwith probability at least $1 - 2\\\
    exp(-2c m / K^4)$ (set $t = \\sqrt{2c m}/K^2$ and use the assumption on $m$, choosing\
    \ constants $c$ and $C$ appropriately). Using the bound $\\binom{n}{s} \\le \\\
    exp(s \\log(en/s))$ from (0.6) and the assumption on $m$. The proof is complete.\n\
    \nWe just learned an alternative approach to exact recovery:\n\n*Second proof\
    \ of Theorem 9.5.1*  By Theorem 9.5.7, $A$ satisfies RIP with $\\alpha = 0.9\\\
    sqrt{m}$, $\\beta = 1.1\\sqrt{m}$ and $3s$. Thus, Theorem 9.5.6 for $\\lambda\
    \ = 2$ guarantees exact recovery. So Theorem 9.5.1 holds – and we even get the\
    \ logarithmic improvement from Exercise 9.5.4!\n\nTo practice, show that random\
    \ projections satisfy RIP (Exercise 9.33).\n\n## 9.6 Deviations of random matrices\
    \ for general norms\n\nLet’s generalize the matrix deviation inequality (Theorem\
    \ 9.1.1) to work for any norm – not just the Euclidean one. Actually, we don’t\
    \ even need the norm to be nonnegative – just homogeneity and the triangle inequality\
    \ will do.\n\n### Definition 9.6.1 (Allowing a norm to take negative values).\n\
    \nA real-valued function $f$ on a linear vector space $V$ is called:\n\n- *Positive-homogeneous*\
    \ if $f(\\alpha x)=\\alpha f(x)$ for all $\\alpha \\ge 0$ and $x \\in V$;\n- *Subadditive*\
    \ if $f(x+y) \\le f(x)+f(y)$ for all $x,y \\in V$.\n\n### Example 9.6.2.\n\nThese\
    \ functions are positive-homogeneous and subadditive:\n\n- (a) any *norm*;\n-\
    \ (b) any real-valued linear function (called a *linear functional*);\n- (c) in\
    \ particular, the function $f(x)=\\langle x,y\\rangle$ for any fixed vector $y\
    \ \\in \\mathbb{R}^m$;\n- (d) the *support function* of any bounded set $S \\\
    subset \\mathbb{R}^n$, defined by\n\n$$f(x) := \\sup_{y\\in S}\\langle x,y\\rangle,\
    \ \\quad x \\in \\mathbb{R}^m.$$ (9.35)\n\n(check this!).\n\nHere is a version\
    \ of Theorem 9.1.1 that works for all norms (and even positive-homogeneous, subadditive\
    \ functions), but with a tradeoff – it applies only to Gaussian matrices:\n\n\
    ### Theorem 9.6.3 (General matrix deviation inequality).\n\n*Let $A$ be an $m\
    \ \\times n$ random matrix with i.i.d. $N(0,1)$ entries. Let $f : \\mathbb{R}^m\
    \ \\to \\mathbb{R}$ be a bounded, positive-homogeneous and subadditive function,\
    \ and let $b \\in \\mathbb{R}$ be such that*\n\n$$f(x) \\le b\\|x\\|_2 \\quad\
    \ \\text{for all } x \\in \\mathbb{R}^n.$$ (9.36)\n\n*Then for any subset $T \\\
    subset \\mathbb{R}^n$,*\n\n$$\\mathbb{E}\\sup_{x\\in T}\\big|f(Ax)-\\mathbb{E}f(Ax)\\\
    big| \\le C b \\gamma(T),$$\n\n*where $\\gamma(T)$ is the Gaussian complexity\
    \ (see Section 7.5.3).*\n\nExactly as in Section 9.1, Theorem 9.6.3 would immediately\
    \ follow from Talagrand comparison inequality once we show that the random process\n\
    \n$$Z_x := f(Ax) - \\mathbb{E} f(Ax)\\tag{9.37}$$\n\nhas subgaussian increments.\
    \ Let us do this now:\n\n### Theorem 9.6.4 (Subgaussian increments).\n\n*Let $A$\
    \ be an $m\\times n$ Gaussian random matrix with i.i.d. $N(0,1)$ entries, and\
    \ let $f : \\mathbb{R}^m \\to \\mathbb{R}$ be a positive-homogeneous and subadditive\
    \ function satisfying (9.36). Then the random process (9.2) has subgaussian increments:*\n\
    \n$$\\|Z_x - Z_y\\|_{\\psi_2} \\le C b \\|x - y\\|_2 \\quad \\text{for all } x,\
    \ y \\in \\mathbb{R}^n.\\tag{9.38}$$\n\n*Proof of Theorem 9.6.4*  Without loss\
    \ of generality we may assume that $b = 1$. (Why?) Just like in the proof of Theorem\
    \ 9.1.2, first assume that\n\n$$\\|x\\|_2 = \\|y\\|_2 = 1.$$\n\nIn this case,\
    \ the inequality in (9.38) becomes\n\n$$\\|f(Ax) - f(Ay)\\|_{\\psi_2} \\le C \\\
    |x - y\\|_2.\\tag{9.39}$$\n\n### Step 1: Creating independence.\n\nConsider the\
    \ vectors\n\n$$u := \\frac{x + y}{2}, \\quad v := \\frac{x - y}{2}.\\tag{9.40}$$\n\
    \nThen $x = u + v$ and $y = u - v$, and thus\n\n$$Ax = Au + Av, \\quad Ay = Au\
    \ - Av$$\n\n(see Figure 9.8). Since $u$ and $v$ are orthogonal (check!), the Gaussian\
    \ random\n\n![](img/b122213aed28c1888de83a894123323e_291_0.png)\n\n**Figure 9.8**\
    \ Creating a pair of orthogonal vectors $u, v$ out of $x, y.$\n\nvectors $Au$\
    \ and $Av$ are independent (recall Exercise 3.20).\n\n### Step 2: Using Gaussian\
    \ concentration.\n\nLet’s condition on $a := Au$ and study the conditional distribution\
    \ of\n\n$$f(Ax) = f(a + Av).$$\n\nBy independence, $a + Av$ is a Gaussian random\
    \ vector that we can write as\n\n$$a + Av = a + \\|v\\|_2 g, \\quad \\text{where}\
    \ \\quad g \\sim N(0, I_m)$$\n\n(again by Exercise 3.20.) We claim that the function\n\
    \n$$z \\mapsto f(a + \\|v\\|_2 z)$$\n\nis Lipschitz with respect to the Euclidean\
    \ norm on $\\mathbb{R}^m$, with Lipschitz norm bounded by $\\|v\\|_2$. To check\
    \ this, fix any $t, s \\in \\mathbb{R}^m$ and use subadditivity of $f$ (in the\
    \ form of Exercise 9.34) to get\n\n$$f(a + \\|v\\|_2 t) - f(a + \\|v\\|_2 s) \\\
    le f(\\|v\\|_2 t - \\|v\\|_2 s)$$ $$= \\|v\\|_2 f(t - s) \\quad \\text{(by positive\
    \ homogeneity)}$$ $$\\le \\|v\\|_2 \\|t - s\\|_2 \\quad \\text{(using (9.36) with\
    \ $b = 1$)},$$\n\nproving our claim.\n\nConcentration in the Gauss space (Theorem\
    \ 5.2.3) then yields\n\n$$\\|f(a + Av) - \\mathbb{E}_a f(a + Av)\\|_{\\psi_2(a)}\
    \ \\le C \\|v\\|_2, \\tag{9.41}$$\n\nwhere the index “a” reminds us that these\
    \ bounds are valid for the conditional distribution, with $a = Au$ fixed.\n\n\
    ### Step 3: Removing the conditioning.\n\nSince the random vector $a - Av$ has\
    \ the same distribution as $a + Av$ (why?), it satisfies the same bound:\n\n$$\\\
    |f(a - Av) - \\mathbb{E}_a f(a - Av)\\|_{\\psi_2(a)} \\le C \\|v\\|_2, \\tag{9.42}$$\n\
    \nSubtract (9.42) from (9.41), use triangle inequality and the fact that the expectations\
    \ are the same; this gives\n\n$$\\|f(a + Av) - f(a - Av)\\|_{\\psi_2(a)} \\le\
    \ 2C \\|v\\|_2.$$\n\nThis bound holds conditionally for any fixed $a = Au$. Therefore,\
    \ it holds for the original distribution, too:\n\n$$\\|f(a + Av) - f(a - Av)\\\
    |_{\\psi_2} \\le 2C \\|v\\|_2.$$\n\n(Why?) Passing back to the $x, y$ notation\
    \ by (9.40), we obtain the desired inequality (9.39).\n\nWe proved the theorem\
    \ for any unit vectors $x, y$. To extend it to the general case, argue exactly\
    \ as in Step 4 in the proof of Theorem 9.1.2 (check!). $\\square$\n\n### Remark\
    \ 9.6.5.\n\nIt is an open question if Theorem 9.6.3 holds for general subgaussian\
    \ matrices $A$.\n\nTo practice, try Exercises 9.35 and 9.36 to get an anisotropic\
    \ and a high-probability versions of Theorem 9.6.3.\n\n![](img/b122213aed28c1888de83a894123323e_294_0.png)\n\
    \n![](img/b122213aed28c1888de83a894123323e_294_1.png)\n\nFigure 9.9 A random projection\
    \ of an 8-dimensional cube (left) and 10^4 Gaussian points (right) onto the plane\n\
    \n### Theorem 9.7.2 (Dvoretzky-Milman theorem).\n\nLet $A$ be an $m \\times n$\
    \ Gaussian random matrix with i.i.d. $N(0,1)$ entries, and $T \\subset \\mathbb{R}^n$\
    \ be a bounded set. Then the following holds with probability at least $0.99$:\n\
    \n$$r_- B_2^m \\subset \\operatorname{conv}(AT) \\subset r_+ B_2^m \\tag{9.45}$$\n\
    \nwhere $B_2^m$ denotes the unit Euclidean ball in $\\mathbb{R}^m$, and\n\n$$r_\\\
    pm = w(T) \\pm C\\sqrt{m}\\,\\operatorname{rad}(T).$$\n\nThe left inclusion holds\
    \ only if $r_-$ is nonnegative; the right inclusion, always.\n\nProof  Let’s express\
    \ two-sided Chevet inequality (Theorem 9.7.1) in the following form:\n\n$$\\mathbb{E}\\\
    sup_{y\\in S}\\Big|\\sup_{x\\in T}\\langle Ax,y\\rangle - w(T)\\|y\\|_2\\Big|\
    \ \\le C\\gamma(S)\\operatorname{rad}(T),$$\n\nwhere $T \\subset \\mathbb{R}^n$\
    \ and $S \\subset \\mathbb{R}^m$. (To get this, just apply the theorem to $A^\\\
    top$ with $T$ and $S$ swapped.)\n\nLet $S$ be the sphere $S^{m-1}$; its Gaussian\
    \ complexity satisfies $\\gamma(S) \\le \\sqrt{m}$. Then, by Markov inequality,\
    \ the following holds with probability at least $0.99$:\n\n$$\\Big|\\sup_{x\\\
    in T}\\langle Ax,y\\rangle - w(T)\\Big| \\le C\\sqrt{m}\\,\\operatorname{rad}(T)\\\
    quad\\text{for every }y\\in S^{m-1}.$$\n\nBy triangle inequality and definition\
    \ of $r_\\pm$, this implies\n\n$$r_- \\le \\sup_{x\\in T}\\langle Ax,y\\rangle\
    \ \\le r_+\\quad\\text{for every }y\\in S^{m-1}.$$\n\nRewriting $\\sup_{x\\in\
    \ T}\\langle Ax,y\\rangle$ as $\\sup_{x\\in AT}\\langle x,y\\rangle$ and using\
    \ homogeneity, we get\n\n$$r_-\\|y\\|_2 \\le \\sup_{x\\in AT}\\langle x,y\\rangle\
    \ \\le r_+\\|y\\|_2\\quad\\text{for every }y\\in \\mathbb{R}^m.$$\n\nBy duality,\
    \ this is the same as $(9.45)$ (try Exercise 9.40 to work out the details of the\
    \ duality argument).\n"
