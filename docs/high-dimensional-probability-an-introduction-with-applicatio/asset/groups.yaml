    - **4.44** (a) 将习题 4.19(a) 与 (2.22) 结合。(b) 将习题 4.19(b) 与习题 3.13 结合。


    - **4.45** 难点在于：若 q 很小，期望邻接矩阵 D = 𝔼A 的第二特征值可能没有与第一特征值很好地分离，从而难以使用 Davis–Kahan
    不等式。为了修正这一点，修改算法，同时考虑 D 的两个最大特征向量；由于 Davis–Kahan 不等式的高维版本（引理 4.1.16，习题 4.13），A
    仍将很接近。


