    In this case, the inequality in (9.3) becomes


    $$\|\|Ax\|_2 - \|Ay\|_2\|_{\psi_2} \le C K^2 \|x - y\|_2.$$ (9.5)


    Since the squared $\ell^2$ norm would be simpler to work with (no square root),
    let’s first prove a version of (9.5) with squared norms. Here’s a good guess for
    what it should look like: with high probability,


    $$\|Ax\|_2^2 - \|Ay\|_2^2 = (\|Ax\|_2 + \|Ay\|_2)\cdot(\|Ax\|_2 - \|Ay\|_2) \lesssim
    \sqrt{m}\,\|x - y\|_2.$$ (9.6)


    This seems reasonable because $\|Ax\|_2$ and $\|Ay\|_2$ are roughly $\sqrt{m}$
    by (9.4), and we expect (9.5) to hold.


    Let’s go ahead and prove this. Expand the matrix-vector product:


    $$\|Ax\|_2^2 - \|Ay\|_2^2 = \sum_{i=1}^{m} (\langle A_i, x\rangle^2 - \langle
    A_i, y\rangle^2) = \sum_{i=1}^{m} \langle A_i, x + y\rangle \langle A_i, x - y\rangle,$$


    and divide both sides by $\|x - y\|_2$, getting


    $$\Delta := \frac{\|Ax\|_2^2 - \|Ay\|_2^2}{\|x - y\|_2} = \sum_{i=1}^{m} \langle
    A_i, u\rangle \langle A_i, v\rangle,$$ (9.7)

    where


    $$u := x + y \quad \text{and} \quad v := \frac{x - y}{\|x - y\|_2}.$$


    Our goal is to show that $|\Delta| \lesssim \sqrt{m}$ with high probability.


    What do we see in (9.7)? A sum of independent random variables $\langle A_i, u\rangle
    \langle A_i, v\rangle$. They are mean-zero, because by construction we have


    $$\langle A_i, u\rangle \langle A_i, v\rangle = \frac{\langle A_i, x\rangle^2
    - \langle A_i, y\rangle^2}{\|x - y\|_2},$$


    and by isotropy, $\mathbb{E}[\langle A_i, x\rangle^2 - \langle A_i, y\rangle^2]
    = 1 - 1 = 0$. And they are subexponential: Lemma 2.8.6 and the subgaussian assumption
    on $A_i$ give


    $$\|\langle A_i, u\rangle \langle A_i, v\rangle\|_{\psi_1} \le \|\langle A_i,
    u\rangle\|_{\psi_2} \cdot \|\langle A_i, v\rangle\|_{\psi_2} \le K\|u\|_2 \cdot
    K\|v\|_2 \le 2K^2$$


    where in the last step we used that $\|u\|_2 \le \|x\|_2 + \|y\|_2 \le 2$ and
    $\|v\|_2 = 1$. So we can apply Bernstein inequality (Theorem 2.9.1) and get


    $$\mathbb{P}\{ |\Delta| \ge t\sqrt{m}\} \le 2\exp\!\left[-c\min\left(\frac{t^2}{K^4},
    \frac{t\sqrt{m}}{K^2}\right)\right] \le 2\exp\!\left(-\frac{c_1 t^2}{K^4}\right)$$
    (9.8)

    for any $0 \le t \le \sqrt{m}$.


    **Step 3: Unit vectors $x, y$ and the original process.** Now let’s get rid of
    the squares and prove the original inequality (9.5) for all unit vectors $x$ and
    $y$.


    1 To get the last inequality in (9.8), recall that $K$ is bounded below by a positive
    absolute constant (why?) and choose the constant $c > 0$ small enough.'
