    # 5.5 Application: community detection in sparse networks


    In Section 4.5, we explored spectral clustering – a basic method for community
    detection in networks. We analyzed its performance on the stochastic block model
    $G(n,p,q)$ with two communities and showed it works for relatively *dense* networks,
    where the expected average degree $\gtrsim \sqrt{n}$ (Remark 4.5.3). Now, using
    matrix Bernstein inequality, we will show that spectral clustering actually works
    for *much sparser* networks, with an expected average degree as low as $O(\log
    n)$.


    **Theorem 5.5.1** (Spectral clustering for sparse stochastic block model). *Let
    $G \sim G(n,p,q)$ where$^{16}$ $p = a/n$, $q = b/n$ and $b < a < 3b$. Assume that*


    $$(a - b)^2 \ge C a \log n.$$


    *Then, with probability at least 0.99, the spectral clustering algorithm (Section
    4.5.5) identifies the communities of $G$ with 99% accuracy, i.e. misclassifying
    at most 0.01$n$ vertices.*


    *Proof*  Let’s follow the argument in Section 4.5, just with a sharper error bound.


    # Step 1: Decomposition.


    Like in Section 4.5.2, we look at the adjacency matrix $A$ of a random graph $G
    \sim G(n,p,q)$, and split it into deterministic and random parts:


