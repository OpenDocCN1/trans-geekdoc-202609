    ## 7.4 Sudakov inequality


    Let’s go back to general mean-zero Gaussian processes $(X_t)_{t\in T}$ on any
    index set $T$. As we saw earlier (Remark 7.1.7), the increments


    $$d(t,s):=\|X_t-X_s\|_{L^2}=\bigl(\mathbb{E}(X_t-X_s)^2\bigr)^{1/2} \tag{7.13}$$


    define a metric on $T$, called the *canonical metric*. This metric determines
    the covariance function $\Sigma(t,s)$, which in turn determines the distribution
    of the process $(X_t)_{t\in T}$ (recall Remark 7.1.10). So, in theory, we can
    answer any question about the distribution of the process just by understanding
    the geometry of the metric space $(T,d)$ – in other words, we can study probability
    via geometry.


    Here is a big specific question: how can we estimate


    $$\mathbb{E}\sup_{t\in T}X_t \tag{7.14}$$


    in terms of the geometry of $(T,d)$? This is a hard problem, which we begin to
    study now and continue in Chapter 8.


    We will start with a lower bound on (7.14) in terms of *metric entropy*, which
    was introduced Section 4.2. Recall that for any $\varepsilon>0$, the *covering
    number*


    $$\mathcal{N}(T,d,\varepsilon)$$


    is the smallest cardinality of an $\varepsilon$-net of $T$ in the metric $d$,
    or equivalently the smallest number of closed balls of radius $\varepsilon$ whose
    union covers $T$. The logarithm of the covering number, $\log_2\mathcal{N}(T,d,\varepsilon)$,
    is called the *metric entropy* of $T$.


    **Theorem 7.4.1** (Sudakov inequality). Let $(X_t)_{t\in T}$ be a *mean-zero Gaussian
    process*. Then, for any $\varepsilon\ge 0$, we have


    $$\mathbb{E}\sup_{t\in T}X_t\ge c\varepsilon\sqrt{\log\mathcal{N}(T,d,\varepsilon)}.$$


    where $d$ is the canonical metric defined in (7.13).


    *Proof*  Let us deduce this result from Sudakov-Fernique comparison inequality
    (Theorem 7.2.8). Assume that


    $$\mathcal{N}(T,d,\varepsilon)=:N$$


    is finite; you will handle the infinite case in Exercise 7.4. Let $\mathcal{N}$
    be a maximal $\varepsilon$-separated subset of $T$. Then $\mathcal{N}$ is an $\varepsilon$-net
    of $T$ (recall Lemma 4.2.6), and thus


    $$|\mathcal{N}|\ge N.$$


    Restricting the process to $\mathcal{N}$, we see that it suffices to show that


    $$\mathbb{E}\sup_{t\in\mathcal{N}}X_t\ge c\varepsilon\sqrt{\log N}.$$


    $^5$ If $T$ does not have a finite $\varepsilon$-net, we set $\mathcal{N}(T,d,\varepsilon)=\infty$.


    Let’s do it by comparing $(X_t)_{t\in\mathcal N}$ to a simpler Gaussian process
    $(Y_t)_{t\in\mathcal N}$, defined as follows:


    $$Y_t := \frac{\varepsilon}{\sqrt{2}}g_t,\qquad \text{where } g_t \text{ are independent
    } N(0,1) \text{ random variables.}$$


    To use Sudakov-Fernique comparison inequality (Theorem 7.2.8), we need to compare
    the increments of the two processes. Fix two different points $t,s\in\mathcal
    N$. By definition, we have


    $$\mathbb E(X_t-X_s)^2=d(t,s)^2\geq\varepsilon^2$$


    while


    $$\mathbb E(Y_t-Y_s)^2=\frac{\varepsilon^2}{2}\,\mathbb E(g_t-g_s)^2=\varepsilon^2.$$


    (In the last line, we use that $g_t-g_s\sim N(0,2)$.) This implies that


    $$\mathbb E(X_t-X_s)^2\geq\mathbb E(Y_t-Y_s)^2\qquad\text{for all }t,s\in\mathcal
    N.$$


    Applying Theorem 7.2.8, we obtain


    $$\mathbb E\sup_{t\in\mathcal N}X_t\geq\mathbb E\sup_{t\in\mathcal N}Y_t=\frac{\varepsilon}{\sqrt{2}}\,\mathbb
    E\max_{t\in\mathcal N}g_t\geq c\varepsilon\sqrt{\log N}.$$


    In the last step, we used that the expected maximum of $N$ i.i.d. $N(0,1)$ random
    variables is at least $c\sqrt{\log N}$, see Exercise 2.38(b). The proof is complete.
    □


    ### 7.4.1 Application for covering numbers in $\mathbb R^n$


    Sudakov inequality can be used to bound the covering numbers of an arbitrary set
    $T\subset\mathbb R^n$:


    **Corollary 7.4.2** (Sudakov inequality in $\mathbb R^n$). *Let $T\subset\mathbb
    R^n$. Then, for any $\varepsilon>0$, we have*


    $$\mathbb E\sup_{t\in T}\langle g,t\rangle\geq c\varepsilon\sqrt{\log\mathcal
    N(T,\varepsilon)}.$$


    *Here $\mathcal N(T,\varepsilon)$ is the smallest number of Euclidean balls with
    radius $\varepsilon$ and centers in $T$ that cover $T$, just like in Section 4.2.1.*


    *Proof.* Consider the canonical Gaussian process $X_t:=\langle g,t\rangle$ where
    $g\sim N(0,I_n)$. As we noted in Section 7.1.2, the canonical distance for this
    process is the Euclidean distance in $\mathbb R^n$, i.e. $d(t,s)=\|X_t-X_s\|_{L^2}=\|t-s\|_2$
    for any $t,s\in T$. Then the corollary follows from Sudakov inequality (Theorem
    7.4.1). □


    In Exercise 8.5, you will show that Corollary 7.4.2 is sharp up to a log factor:


    $$\mathbb E\sup_{t\in T}\langle g,t\rangle\leq C\log(n)\cdot\varepsilon\sqrt{\log\mathcal
    N(T,\varepsilon)}.$$


    For a quick application of Sudakov inequality, let’s (roughly) re-derive the bound
    on covering numbers of polytopes in $\mathbb R^n$ from Corollary 0.0.3:


    *Proof*  Let’s just prove part (f) and leave the rest for you in Exercise 7.15.
    For the lower bound, fix any \(x,y\in T\). Since both \(x-y\) and \(y-x\) are
    in \(T-T\), property (e) gives


    \[w(T)\geq \frac{1}{2}\mathbb{E}\max\bigl(\langle x-y,g\rangle,\langle y-x,g\rangle\bigr)=\frac{1}{2}\mathbb{E}|\langle
    x-y,g\rangle|=\frac{1}{2}\sqrt{\frac{2}{\pi}}\,\|x-y\|_2.\]


    The last equality holds since \(\langle x-y,g\rangle\sim N(0,\|x-y\|_2^2)\) and
    \(\mathbb{E}|X|=\sqrt{2/\pi}\) for \(X\sim N(0,1)\). (Check!) Taking the supremum
    over all \(x,y\in T\) gives the result. For the upper bound in (f), use property
    (e) again to get


    \[w(T)=\frac{1}{2}\mathbb{E}\sup_{x,y\in T}\langle g,x-y\rangle\leq \frac{1}{2}\mathbb{E}\sup_{x,y\in
    T}\|g\|_2\|x-y\|_2\leq \frac{1}{2}\mathbb{E}\|g\|_2\cdot\operatorname{diam}(T).\]


    Since \(\mathbb{E}\|g\|_2\leq (\mathbb{E}\|g\|_2^2)^{1/2}=\sqrt{n}\), we are done.
    □


    **Remark 7.5.3** (Width and diameter). Both upper and lower bounds in (f) are
    optimal and the \(O(\sqrt{n})\) gap between them cannot be improved (see Exercise
    7.16). So, diameter is not a great way to capture Gaussian width.


    ### 7.5.1 Geometric meaning of width


    Gaussian width has a nice geometric meaning: it’s about how wide the set \(T\subset\mathbb{R}^n\)
    looks in random directions. The width of \(T\) in the direction \(\theta\in S^{n-1}\)
    is the width of the smallest slab (between parallel hyperplanes orthogonal to
    \(\theta\)) that contains \(T\) (see Figure 7.3), which can be expressed as \(\sup_{x,y\in
    T}\langle\theta,x-y\rangle\) (check)! If we average the width over all unit directions
    \(\theta\), we get


    \[\mathbb{E}\sup_{x,y\in T}\langle\theta,x-y\rangle=\mathbb{E}\sup_{z\in T-T}\langle\theta,z\rangle.\tag{7.16}\]


    ![](img/b122213aed28c1888de83a894123323e_215_0.png)


    **Figure 7.3** The width of a set \(T\subset\mathbb{R}^n\) in the direction of
    a unit vector \(\theta\).


    **Definition 7.5.4** (Spherical width). The *spherical width* of a set \(T\subset\mathbb{R}^n\)
    is


    \[w_s(T):=\mathbb{E}\sup_{x\in T}\langle\theta,x\rangle\quad\text{where}\quad\theta\sim\operatorname{Unif}(S^{n-1}).\]


    The only difference between the Gaussian and spherical widths is in the random
    vectors we average over: \(g\sim N(0,I_n)\) versus \(\theta\sim\operatorname{Unif}(S^{n-1})\).
    Both are rotation invariant, but \(g\) is approximately \(\sqrt{n}\) times longer
    than \(\theta\). Thus:


    **Lemma 7.5.5** (Gaussian vs. spherical widths). *The Gaussian width is approximately*
    \(\sqrt{n}\) *times the spherical width:*


    $$\left(\sqrt{n}-\frac{C}{\sqrt{n}}\right)w_s(T)\leq w(T)\leq \sqrt{n}\,w_s(T).$$


    *Proof.* Express the Gaussian vector \(g\) through its length and direction: \(g=r\theta\),
    where \(r=\|g\|_2\) and \(\theta=g/\|g\|_2\). Now, \(\theta\sim\operatorname{Unif}(S^{n-1})\)
    is independent of \(r\) (see Exercise [3.22](#)). Thus


    $$w(T)=\mathbb{E}\sup_{x\in T}\langle r\theta,x\rangle=\mathbb{E}[r]\cdot\mathbb{E}\sup_{x\in
    T}\langle\theta,x\rangle=\mathbb{E}\|g\|_2\cdot w_s(T).$$


    It remains to use concentration of the norm (see Exercise [3.2](#)), which gives
    \(\sqrt{n}-C/\sqrt{n}\leq\mathbb{E}\|g\|_2\leq\sqrt{n}\), and finishes the proof.


    ### 7.5.2 Examples


    **Example 7.5.6** (Euclidean ball and sphere). The Gaussian widths of the unit
    ball and sphere are


    $$w(S^{n-1})=w(B_2^n)=\mathbb{E}\|g\|_2=\sqrt{n}\pm\frac{C}{\sqrt{n}}, \tag{7.17}$$


    where we used concentration of norm (Exercise [3.2](#)) in the last step. The
    spherical widths of these sets of course equal 1.


    **Example 7.5.7** (Cube). The unit ball of the \(\ell^\infty\) norm in \(\mathbb{R}^n\)
    is the cube \(B_\infty^n=[-1,1]^n\). So, using duality ([1.6](#)), we get


    $$w(B_\infty^n)=\mathbb{E}\|g\|_1=\mathbb{E}|g_1|\cdot n=\sqrt{\frac{2}{\pi}}\cdot
    n. \tag{7.18}$$


    **Example 7.5.8** (Cross-polytope). The unit ball of the \(\ell^1\) norm in \(\mathbb{R}^n\)
    is the *cross-polytope* \(B_1^n=\{x\in\mathbb{R}^n:\|x\|_1\leq 1\}\), see ([1.3](#)).
    Its Gaussian width satisfies


    $$w(B_1^n)\simeq\sqrt{\log n} \tag{7.19}$$


    where the notation \(\simeq\) hides absolute constant factors. This is because


    $$w(B_1^n)=\mathbb{E}\|g\|_\infty=\mathbb{E}\max_{i\leq n}|g_i|,$$


    where the first equation uses duality ([1.6](#)). Then (7.19) follow from Exercise
    2.38(b).


    **Example 7.5.9** (Finite point sets). Any finite set of points \(T\subset\mathbb{R}^n\)
    satisfies


    $$w(T)\leq C\sqrt{\log|T|}\cdot\operatorname{diam}(T).$$


    To prove this, we can assume that \(\operatorname{diam}(T)=1/2\) (by rescaling),
    and that \(T\) lies in the unit Euclidean ball (by translation). Then argue as
    in (7.15) (do it!).

