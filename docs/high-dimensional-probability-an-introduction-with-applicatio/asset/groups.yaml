    The conditioning trick often helps us to calculate probabilities and expectations.
    This method is based on the concept of *conditional probability* of an event $E$
    given event $F$, denoted by


    $$\mathbb{P}(E\mid F)=\frac{\mathbb{P}(E\cap F)}{\mathbb{P}(F)},$$


    and the concept of *conditional expectation* of a random variable $X$ given another
    random variable $Y$, denoted by $\mathbb{E}[X\mid Y]$.


    The *law of total expectation* says that


    $$\mathbb{E}X=\mathbb{E}\left[\mathbb{E}[X\mid Y]\right]. \tag{1.15}$$


    Informally, this identity says that in order to compute the expectation of $X$,
    we can first average with respect to $X$ while keeping the value of $Y$ fixed,
    and then average the result with respect to $Y$. This is the essence of the conditioning
    trick.


    The conditioning trick can also help us compute probabilities. If $E$ is any event
    and $Y$ is a random variable, we can define the conditional probability of $E$
    given $Y$ as


    $$\mathbb{P}(E\mid Y):=\mathbb{E}\left[\mathbf{1}_E\mid Y\right],$$


    where $\mathbf{1}_E$ denotes the indicator of the event $E$. Since $\mathbb{E}\,\mathbf{1}_E=\mathbb{P}(E)$,
    the law of total expectation in this case reads as


    $$\mathbb{P}(E)=\mathbb{E}\left[\mathbb{P}(E\mid Y)\right]. \tag{1.16}$$


    Thus, in order to compute probabilities using the conditioning trick, we first
    need to find the probability while keeping the value of $Y$ fixed, and then average
