  - '[PAGE 200]


    # 7


    # Random Processes


    In this chapter, we turn our attention to random processes – collections of random
    variables $(X_t)_{t\in T}$, which may be dependent. In classical settings like
    Brownian motion, $t$ represents time, so $T \subset \mathbb{R}$. But in high-dimensional
    probability, $T$ can be any abstract set. A key example is the canonical Gaussian
    process


    $$X_t = \langle g,t\rangle,\quad t\in T,$$


    where $T \subset \mathbb{R}^n$ and $g \sim N(0,I_n)$. We introduce it in Section
    [7.1](7.1).


    In Section [7.2](7.2), we explore powerful comparison inequalities for Gaussian
    processes – Slepian, Sudakov-Fernique, and Gordon – using a new trick: Gaussian
    interpolation. In Section [7.3](7.3), we use these tools to prove a sharp bound
    on the operator norm of an $m\times n$ Gaussian random matrices.


    How does a Gaussian process $(X_t)_{t\in T}$ capture the geometry of $T$? In Section
    [7.4](7.4), we prove Sudakov inequality – a lower bound on the *Gaussian width*


    $$w(T)=\mathbb{E}\sup_{t\in T}\langle g,t\rangle$$


    using covering numbers. (Upper bounds come later in Chapter [8](8).) Gaussian
    width is a key concept linking probability with metric geometry; we take a closer
    look at it in Section [7.5](7.5) and connect it to other ideas like effective
    dimension.


    In Section [7.6](7.6), we compute the size of a random projection of any bounded
    set $T \subset \mathbb{R}^n$. The crucial quantity that determines it is the Gaussian
    width.


    You will have plenty of chances to practice these ideas: prove symmetrization
    and contraction inequalities for random processes (Exercises [7.2–7.4](7.2–7.4),
    [7.8](7.8)), derive the important min-max inequality for Gaussian processes –
    Gordon inequality (Exercise [7.9](7.9)), get sharp bounds for Gaussian matrices
    (Exercises [7.11](7.11) and [7.13](7.13)), compute the Gaussian width for the
    $\ell^p$ balls (Exercise [7.17](7.17)), explore the nuclear norm (Exercises [7.18](7.18)
    and [7.19](7.19)), effective dimension (Exercises [7.21–7.22](7.21–7.22)), random
    projections of general sets (Exercises [7.25](7.25) and [7.26](7.26)), and matrix
    sketching (Exercise [7.27](7.27)).'
  - "[PAGE 201]\n\n# 7.1 Basic concepts and examples\n\n**Definition 7.1.1** (Random\
    \ process). A *random process* is just a collection of random variables \\((X_t)_{t\\\
    in T}\\) on the same probability space, which are indexed by elements \\(t\\)\
    \ of some set \\(T\\).\n\nIn some classical examples, \\(t\\) stands for *time*,\
    \ in which case \\(T\\) is a subset of \\(\\mathbb{R}\\). But we primarily study\
    \ processes in high-dimensional settings, where \\(T\\) is a subset of \\(\\mathbb{R}^n\\\
    ) and where the analogy with time is lost.\n\n**Example 7.1.2** (Discrete time).\
    \ If \\(T=\\{1,\\ldots,n\\}\\) then the random process\n\n\\[\n(X_1,\\ldots,X_n)\n\
    \\]\n\ncan be identified with a *random vector* in \\(\\mathbb{R}^n\\).\n\n**Example\
    \ 7.1.3** (Random walks). If \\(T=\\mathbb{N}\\), a discrete-time random process\
    \ \\((X_n)_{n\\in\\mathbb{N}}\\) is simply a *sequence* of random variables. An\
    \ important example is a *random walk* defined as\n\n\\[\nX_n := \\sum_{i=1}^{n}\
    \ Z_i,\n\\]\n\nwhere the increments \\(Z_i\\) are independent, mean-zero random\
    \ variables. See Figure 7.1 for illustration.\n\n![](img/b122213aed28c1888de83a894123323e_201_0.png)\n\
    \n**Example 7.1.4** (Brownian motion). The most classical continuous-time random\
    \ process is the standard *Brownian motion* \\((X_t)_{t\\ge 0}\\), or the *Wiener\
    \ process*. It can be characterized as follows:\n\n+   (i) The process has continuous\
    \ sample paths, i.e. the random function \\(f(t):=X_t\\) is continuous almost\
    \ surely;\n+   \n+   (ii) The increments are independent and satisfy \\(X_t-X_s\\\
    sim N(0,t-s)\\) for all \\(t\\ge s\\).\n\nFigure 7.1 shows a few trials of the\
    \ standard Brownian motion.\n\n**Example 7.1.5** (Random fields). When the index\
    \ set \\(T\\) is a subset of \\(\\mathbb{R}^n\\), a random process \\((X_t)_{t\\\
    in T}\\) is sometimes called a spatial random process, or a *random field*. For\
    \ example, the water temperature \\(X_t\\) at the location on Earth that is parametrized\
    \ by \\(t\\) can be modeled as a spatial random process."
