    # ## 2.7.2 Subgaussian Khintchine inequality


    Let us establish another classic result: a two-sided bound on the $L^p$ norms
    of sums of independent random variables.


    **Theorem 2.7.5 (Khintchine inequality).** Let $X_1,\ldots,X_N$ be independent
    sub-Gaussian random variables with zero means and unit variances, and let $a_1,\ldots,a_N\in\mathbb{R}$.
    Then, for every $p\in[2,\infty)$, we have


    $$\left(\sum_{i=1}^{N}a_i^2\right)^{1/2}\leq\left\|\sum_{i=1}^{N}a_iX_i\right\|_{L_p}\leq
    CK\sqrt{p}\left(\sum_{i=1}^{N}a_i^2\right)^{1/2}.$$


    where $K=\max_i\|X_i\|_{\psi_2}$ and $C$ is an absolute constant.


    *Proof*  For $p=2$, we actually have an equality, since the Pythagorean identity
    (2.19) combined with the unit variance assumption gives


