    ## 2.9 伯恩斯坦不等式


    我们准备陈述并证明霍夫丁不等式（定理 [2.7.3](#)）的一个版本，它适用于次指数分布：


    **定理 2.9.1**（次指数伯恩斯坦不等式）。*设* $X_1,\ldots,X_N$ *为独立、零均值、次指数随机变量。那么，对任意* $t\ge 0$，*有*


