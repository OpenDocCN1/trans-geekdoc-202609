    \  \\begin{cases}\n  \\sqrt{p'}\\,n^{1/p'}, & p'\\le \\log n,\\\\\n  \\sqrt{\\\
    log n}, & p'\\ge \\log n,\n  \\end{cases}$$\n\n  where $p'$ is the conjugate exponent\
    \ for $p$, as in Hölder inequality (1.22).\n\n- **7.18 (Nuclear norm)** For an\
    \ $n\\times n$ matrix $A$, the operator norm $\\|A\\|$ is the $\\ell^\\infty$\
    \ norm of the singular values, and the Frobenius norm $\\|A\\|_F$ is the $\\ell^2$\
    \ norm (see Lemma 4.1.11). Define the *nuclear norm* as the $\\ell^1$ norm of\
    \ the singular values:\n\n  $$\\|A\\|_* := \\sum_{i=1}^{n}s_i(A).$$\n\n  (a) Just\
    \ like $\\ell^1$ and $\\ell^\\infty$ norms are dual for vectors (see Exercise\
    \ [1.19(b)]), prove that the nuclear and operator norms are dual for matrices:\
    \ $^9$\n\n  $$\\|A\\|_* = \\max\\{\\langle A,B\\rangle : \\|B\\|\\le 1\\}.$$\n\
    \n  (b) Conclude that the nuclear norm is indeed a norm.\n\n- **7.19 (Gaussian\
