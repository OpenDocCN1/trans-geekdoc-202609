  - '[PAGE 257]


    **Remark 8.6.3 (Gaussian Chevet inequality).** For Gaussian matrices $A$ with
    i.i.d. $N(0,1)$ entries, we can even prove Chevet inequality with sharp constant
    1:


    $$\mathbb{E}\sup_{x\in T,y\in S}\langle Ax,y\rangle \le w(T)\,\operatorname{rad}(S)+w(S)\,\operatorname{rad}(T),$$


    and a reverse inequality up to a constant (Exercise 8.39). Later, we will further
    improve Gaussian Chevet inequality in Section 9.7.1.


    For more practice, prove a high-probability version of Chevet (Exercise 8.40).


    # 8.7 Notes


    The idea of chaining already appears in Kolmogorov’s proof of his continuity theorem
    for Brownian motion, see e.g. [253, Chapter 1]. Dudley integral inequality (Theorem
    8.1.3) can be traced to the work of R. Dudley. Our exposition in Section 8.1 mostly
    follows [210, Chapter 11], [315, Section 1.2] and [330, Section 5.3].


    Monte Carlo method (Section 8.2.1) is extremely popular in scientific computing,
    especially when combined with the power of Markov chains, see e.g. [63]. The rich
    theory of *empirical processes* (see Definition: empirical process) has applications
    to statistics and machine learning, see [329, 328, 279, 232]. The Lipschitz law
    of large numbers (Theorem 8.2.3), also known Wasserstein law for large numbers,
    is loosely based on [330, Example 5.15], see [115, Chapter 11]. For an introduction
    to transportation of measure (Section 8.2.3), see [342, 85].


    The concept of VC dimension introduced in Section 8.3 goes back to the foundational
    work of V. Vapnik and A. Chervonenkis [335]; modern treatments can be found e.g.
    in [329, Section 2.6.1], [210, Section 14.3], [330, Section 7.2], [225, Sections
    10.2–10.3], [232, Section 2.2], [329, Section 2.6]. Pajor Lemma 8.3.7 is originally
    due to A. Pajor [268]; see [128], [210, Proposition], [330, Theorem 7.19], [329,
    Lemma 2.6.2].


    What we now call Sauer-Shelah Lemma (Lemma 8.3.9) was proved independently by
    V. Vapnik and A. Chervonenkis [335], N. Sauer [294] and M. Perles and S. Shelah
    [300]. Various proofs of Sauer-Shelah lemma can be found in literature, e.g. [46,
    Chapter 17], [225, Sections 10.2–10.3], [210, Section 14.3]. A number of variants
    of Sauer-Shelah Lemma is known, see e.g. [158, 312, 313, 15, 337]. The growth
    function (Section 8.3.4) was originally introduced by Vapnik-Chervonenkis, who
    studied its various properties including the exponential-polynomial dichotomy
    (Exercise 8.20).


    Theorem 8.3.13 is due to R. Dudley [114]; see [210, Section 14.3], [329, Theorem
    2.6.4]. The dimension reduction Lemma 8.3.14 is implicit in Dudley proof; it was
    stated explicitly in [237] and reproduced in [330, Lemma 7.17]. For generalization
    of VC theory from {0, 1} to general real-valued function classes, see [237, 288],
    [330, Sections 7.3–7.4].


    Since the foundational work of V. Vapnik and A. Chervonenkis [335], bounds on
    empirical processes via VC dimension like Theorem 8.3.15 were in the spotlight
    of the statistical learning theory, see e.g. [232, 32, 329, 288], [330, Chapter
    7]. Our presentation of Theorem 8.3.15 is based on [330, Corollary 7.18]. Although
    explicit statements of this result are difficult to find in earlier literature,
    it can be derived from [32, Theorem 6], [56, Section 5].


    Glivenko-Cantelli theorem (Theorem 8.3.17) is a result from 1933 [138, 75] which
    predated and partly motivated the later development of VC theory; see [210, Section
    14.2], [329, 115] for more on Glivenko-Cantelli theorems and other uniform results
    in probability theory. Example 8.3.18 discusses a basic problem in discrepancy
    theory; see [224] for a comprehensive treatment of discrepancy theory.


    In Section 8.4 we scratch the surface of statistical learning theory, which is
    a big area on the intersection of probability, statistics, and theoretical computer
    science. For deeper introduction to this subject, see e.g. the tutorials [52,
    232] and books [171, 156, 196].


    Generic chaining, presented in Section 8.5, was put forward by M. Talagrand since
    1985 (after an earlier work of X. Fernique [124]) as a sharp method to obtain
    bounds on Gaussian processes. Our presentation is based on Talagrand’s books [315,
    316, 317], which discuss ramifications, applications and history of generic chaining
    in great detail. The upper bound on subgaussian'
