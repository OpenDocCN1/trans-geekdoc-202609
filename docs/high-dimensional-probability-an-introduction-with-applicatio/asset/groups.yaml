    ## 2.3 Chernoff inequality


    Hoeffding inequality is quite sharp for Rademacher random variables, but it may
    be too conservative for general bounded random variables. For example, when Bernoulli
    random variables $X_i$ have small means $p_i$, their sum approximates a Poisson
    distribution (Theorem **1.7.6**). Hoeffding inequality (Theorem **2.2.6**) does
    not account for small $p_i$, yielding a Gaussian bound that is far from the true
    Poisson tail. Let’s prove an inequality that is sensitive to the sizes of $p_i$:


    **Theorem 2.3.1** (Chernoff inequality). *Let* $X_i$ *be independent Bernoulli
    random variables with parameters* $p_i$. *Consider their sum* $S_N=\sum_{i=1}^{N}X_i$
    *and denote its mean by* $\mu=\mathbb{E}S_N$. *Then*


    $$\mathbb{P}\{S_N\ge t\}\le e^{-\mu}\left(\frac{e\mu}{t}\right)^t\qquad\text{for
    any }t\ge\mu.$$


    *Proof*  We will use the same exponential moment method as in the proof of Hoeffding
    inequality (Theorem **2.2.1**). Just like before, we multiply the inequality $S_N>t$
    by $\lambda>0$, exponentiate, then apply Markov inequality and use independence
    to get (**2.6**):


    $$\mathbb{P}\{S_N\ge t\}\le e^{-\lambda t}\prod_{i=1}^{N}\mathbb{E}\exp(\lambda
    X_i). \tag{2.9}$$


    It remains to bound the MGF of each Bernoulli random variable $X_i$. Since it
    takes value $1$ with probability $p_i$ and $0$ with probability $1-p_i$, we have


    $$\mathbb{E}\exp(\lambda X_i)=e^{\lambda}p_i+(1-p_i)=1+(e^{\lambda}-1)p_i\le\exp\left[(e^{\lambda}-1)p_i\right].$$


    The left tail $\mathbb{P}\{S_N \le (1-\delta)\mu\}$ can be bounded similarly,
    using **Remark 2.3.2**. (Try it! You should get an even better bound: $\exp(-\delta^2\mu/2)$.)
    Combine the two tails by a union bound to complete the proof.


    To see a Gaussian tail in **Corollary 2.3.4**, try normalizing $S_N$ roughly as
    in the central limit theorem. If we set $Z_N=(S_N-\mu)/\sqrt{\mu}$, we can rewrite
    the conclusion of **Corollary 2.3.4** as follows:


    \[\mathbb{P}\{|Z_N|\ge t\}\le 2\exp(-t^2/3)\quad\text{for every }0\le t\le\sqrt{\mu}.\]


    **Remark 2.3.5** (Small and large deviations). Figure **2.1** shows the probability
    mass function of Binom$(N,\mu/N)$ with $N=200$ and $\mu=10$. Near the mean $\mu$,
    the bell-shaped curve reflects Gaussian behavior. Far to the right, the slower
    decay reflects Poisson behavior. These two regimes align with the central limit
    theorem and the Poisson limit theorem, respectively.


    ![](img/b122213aed28c1888de83a894123323e_38_0.png)


    **Figure 2.1** The probability mass function of the distribution Binom$(N,\mu/N)$
    with $N=200$ and $\mu=10$. It is approximately normal near the mean $\mu$, but
    it is heavier and farther from the mean.


    ## 2.4 Application: median-of-means estimator


    A fundamental data science problem is learning an unknown distribution from a
    sample — for example inferring a country’s income distribution from a survey of
    $N$ people.


    The most basic task is estimating the mean. Let $X$ be a random variable with
    mean $\mu$ and variance $\sigma^2$ (representing a population), and let $X_1,\ldots,X_N$
    be independent copies¹ of $X$ (representing a sample). We would like to find an
    estimator $\hat{\mu}=\hat{\mu}(X_1,\ldots,X_N)$ that satisfies $\hat{\mu}\approx\mu$
    with high probability.


    The simplest and most popular mean estimator is the *sample mean*


    \[\hat{\mu}:=\frac{1}{N}\sum_{i=1}^{N}X_i.\tag{2.11}\]


    The expected value and variance of this estimator are


    \[\mathbb{E}\,\hat{\mu}=\mu;\qquad \operatorname{Var}(\hat{\mu})=\frac{1}{N^2}\sum_{i=1}^{N}\operatorname{Var}(X_i)=\frac{\sigma^2}{N}.\tag{2.12}\]


    ¹ Independent copies of $X$ are independent random variables that have the same
    distribution as $X$.


    The *degree* of a vertex in a graph is the number of edges connected to it. The
    expected degree of every vertex in $G(n,p)$ equals


    $$(n-1)p=:d.$$


    (Why?) We will show that relatively *dense graphs*, those where $d \gtrsim \log
    n$, are *almost regular* with high probability, meaning the degrees of all vertices
    are approximately equal to $d$.


    **Proposition 2.5.1** (Dense graphs are almost regular). *There is an absolute
    constant $C$ such that the following holds.* Consider a random graph $G \sim G(n,p)$
    with expected degree satisfying $d \ge C \log n$. Then, with probability at least
    $0.99$, the following event occurs: all vertices of $G$ have degrees between $0.9d$
    and $1.1d$.


    *Proof.* The argument is a combination of concentration with a union bound. Let
    us fix a vertex $i$ of the graph. The degree of $i$, which we denote $d_i$, is
    a sum of $n-1$ independent $\operatorname{Ber}(p)$ random variables (the indicators
    of the edges incident to $i$). Applying Chernoff inequality (Corollary 2.3.4)
    we get


    $$\mathbb{P}\{|d_i-d|\ge 0.1d\}\le 2e^{-cd}.$$


    This bound holds for each fixed vertex $i$. Next, we can “unfix” $i$ by taking
    the union bound (Lemma 1.4.1) over all $n$ vertices. We obtain


    $$\mathbb{P}\{\exists i\le n:\ |d_i-d|\ge 0.1d\}\le \sum_{i=1}^{n}\mathbb{P}\{|d_i-d|\ge
    0.1d\}\le n\cdot 2e^{-cd}.$$


    If $d\ge C\log n$ for a sufficiently large absolute constant $C$, the probability
    is bounded by $0.01$. This means that with probability $0.99$, the complementary
    event occurs: $\forall i\le n: |d_i-d|<0.1d$. The proof is complete. $\square$


    **Remark 2.5.2** (Sparse graphs are far from regular). You may wonder if the condition
    $d\gtrsim\log n$ in Proposition 2.5.1 is optimal. It is: if $d<(1-\varepsilon)\ln
    n$, an isolated vertex appears (“a friendless student” in Exercise 1.10), making
    the minimum degree zero. If you have not done Exercises 1.9 and 1.10 yet, give
    them a try now, along with Exercises 2.18–2.20.


