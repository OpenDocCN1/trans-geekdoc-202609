    &=\sqrt n+\sqrt m\quad\text{(see Proposition 3.2.1(b)).}

    \end{aligned}

    $$


    Theorem 7.3.1 only gives an expectation bound, but we can boost it to a high-probability
    bound using the concentration tools from Section 5.2:


    **Corollary 7.3.2 (Norms of Gaussian random matrices: tails).**


    *Let \(A\) be an \(m\times n\) matrix with independent \(N(0,1)\) entries. Then
    for every \(t\geq 0\), we have*


    $$

    \mathbb{P}\{\|A\|\geq\sqrt m+\sqrt n+t\}\leq 2\exp(-ct^2).

    $$


