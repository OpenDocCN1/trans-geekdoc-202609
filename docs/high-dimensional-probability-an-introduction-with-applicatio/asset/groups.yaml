    只需要二进尺度的一部分。由于 \(T\) 是有限的，存在足够小的数 \(\kappa\in\mathbb{Z}\)（定义最粗糙的网）和足够大的数 \(K\in\mathbb{Z}\)（定义最精细的网），使得


    $$

    T_\kappa=\{t_0\}\text{ for some }t_0\in T,\qquad T_K=T. \tag{8.6}

    $$


    对点 \(t\in T\)，令 \(\pi_k(t)\) 表示 \(T_k\) 中离 \(t\) 最近的点，于是我们得到


    $$

    d(t,\pi_k(t))\le\varepsilon_k. \tag{8.7}

    $$


    由于根据假设 \(\mathbb{E}X_{t_0}=0\)，我们得到


    $$

    \mathbb{E}\sup_{t\in T}X_t=\mathbb{E}\sup_{t\in T}(X_t-X_{t_0}).

    $$


    ## 8.2 应用：经验过程


    让我们将 Dudley 不等式应用于*经验过程*——一类由函数索引的自然随机过程。下面是一个启发性的例子。


    ### 8.2.1 蒙特卡洛方法


    假设我们要计算积分


    $$

    \int_{\Omega} f\,d\mu

    $$


    其中 \(f : \Omega \to \mathbb{R}\) 是某个集合 \(\Omega\) 上的给定函数，\(\mu\) 是 \(\Omega\)
    上的概率测度。例如，对于函数 \(f : [0,1] \to \mathbb{R}\)，这可能就是 \(\int_0^1 f(x)\,dx\)（见图 8.3a）。


    我们可以*用概率方法*做到这一点。假设 \(X\) 是根据 \(\mu\) 抽取的 \(\Omega\) 中的随机点，即对任何可测集 \(A \subset
    \Omega\)，有 \(\mathbb{P}\{X \in A\} = \mu(A)\)。（例如，如果你在 \([0,1]\) 上积分，则 \(X \sim
    \operatorname{Unif}[0,1]\)。）于是积分变为期望：


    $$

    \int_{\Omega} f\,d\mu = \mathbb{E}\,f(X).

    $$


    现在取 i.i.d. 样本 \(X_1, X_2, \ldots\)。由大数定律（定理 1.7.1），


    $$

    \frac{1}{n}\sum_{i=1}^{n} f(X_i) \to \mathbb{E}\,f(X) \quad \text{almost surely}
    \tag{8.18}

    $$


    当 \(n \to \infty\) 时。因此，我们可以用算术平均值来逼近积分：


    $$

    \int_{\Omega} f\,d\mu \approx \frac{1}{n}\sum_{i=1}^{n} f(X_i) \tag{8.19}

    $$


    （见图 8.3b）。这就是*蒙特卡洛方法*——通过随机样本点处函数值的平均来计算积分。


    ![](img/b122213aed28c1888de83a894123323e_233_0.png)


    **图 8.3** 用于数值积分的蒙特卡洛方法。


    **注 8.2.1**（误差率）。蒙特卡洛估计 (8.19) 的期望误差是 \(O(1/\sqrt{n})\)。这来自大数定律 (1.23) 中的收敛速度：


    $$

    \mathbb{E}\left|\frac{1}{n}\sum_{i=1}^{n} f(X_i)-\mathbb{E}f(X)\right|\leq \left[\operatorname{Var}\left(\frac{1}{n}\sum_{i=1}^{n}f(X_i)\right)\right]^{1/2}=O\left(\frac{1}{\sqrt{n}}\right).
    \tag{8.20}

    $$


    **注 8.2.2**（蒙特卡洛方法适用于高维，且无需模型知识）。蒙特卡洛方法在高维中效果很好，因为误差 (8.20) 不依赖于维数——这与基于网格的积分方法不同。你甚至不需要知道测度
    \(\mu\)；只要能从中采样就够了。对于 \(f\) 也是如此——你只需要它在少数几个随机点处的值。


    ### 8.2.2 Lipschitz 大数定律


    我们能否用同一样本 \(X_1,\ldots,X_n\) 来估计任意函数 \(f:\Omega\to\mathbb{R}\) 的积分？不能。一个选得不好的
    \(f\) 可能在样本点之间剧烈波动（如图 8.4 所示），从而使蒙特卡洛估计 (8.19) 完全失效。


    ![](img/b122213aed28c1888de83a894123323e_234_0.png)


    **图 8.4** 一个样本 \(X_1,\ldots,X_n\) 不能用来逼近*所有*函数 \(f\) 的积分。


    但如果我们只考虑不会波动太厉害的函数——比如 Lipschitz 函数呢？那样的话，是可以的！


    **定理 8.2.3**（Lipschitz 大数定律）。*考虑函数类*


    $$

    \mathcal{F}:=\{f:[0,1]\to\mathbb{R},\ \|f\|_{\mathrm{Lip}}\leq L\}, \tag{8.21}

    $$


    其中 \(L\) 是任意数。设 \(X,X_1,X_2,\ldots,X_n\) 是取值于 \([0,1]\) 的 i.i.d. 随机变量。则


    $$

    \mathbb{E}\sup_{f\in\mathcal{F}}\left|\frac{1}{n}\sum_{i=1}^{n}f(X_i)-\mathbb{E}f(X)\right|\leq
    \frac{CL}{\sqrt{n}}. \tag{8.22}

    $$


    **注 8.2.4**（一个样本服务所有 Lipschitz 函数）。在证明之前，我们重申关键点：对 \(f\in\mathcal{F}\) 的上确界位于期望内部。借助
    Markov 不等式，这意味着单个样本 \(X_1,\ldots,X_n\) 将以高概率对所有 \(f\in\mathcal{F}\) 同时有效。“有效”意味着以误差
    \(O(1/\sqrt{n})\) 逼近每个积分——与仅针对一个函数的通常大数定律具有相同的速率。因此，我们在毫无损失的情况下使大数定律成为一致的！


