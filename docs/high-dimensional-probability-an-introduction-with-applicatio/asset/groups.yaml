    $$\mathbb{P}\{|X-\mu|\ge t\}\le \frac{\sigma^2}{t^2}.$$


    *证明* 将不等式 $|X-\mu|\ge t$ 两边平方，然后对随机变量 $(X-\mu)^2$ 应用马尔可夫不等式。 □


    ## 1.7 极限定理


    *独立随机变量之和*的研究处于经典概率论的核心。设 $X_1,\ldots,X_N$ 是均值为 $\mu$、方差为 $\sigma^2$ 的独立同分布（i.i.d.）随机变量。那么，和的方差公式
