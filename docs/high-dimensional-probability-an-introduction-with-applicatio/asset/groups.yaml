    U，一个 (ε/3)-网来逼近 V（类似地），以及一个 (ε/3)-网来逼近 Σ。你会发现习题 4.4 很有用。(c) 考虑 Frobenius 范数 ≤
    1 且只有前 r 列非零的 m × n 矩阵。


