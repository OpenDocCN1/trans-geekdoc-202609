    E \le n \cdot \lambda_{\max}(\exp[g(\lambda)Z])

    = n \cdot \exp[g(\lambda)\lambda_{\max}(Z)]

    \]

    (why?)

    \[

    = n \cdot \exp[g(\lambda)\|Z\|]

    \]

    (since $Z \succeq 0$)

    \[

    = n \cdot \exp[g(\lambda)\sigma^2]

    \]

    (by definition of $\sigma$ in the theorem).


