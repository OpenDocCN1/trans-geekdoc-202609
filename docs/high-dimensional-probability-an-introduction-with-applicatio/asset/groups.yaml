    **Remark 7.5.3** (Width and diameter). Both upper and lower bounds in (f) are
    optimal and the \(O(\sqrt{n})\) gap between them cannot be improved (see Exercise
    7.16). So, diameter is not a great way to capture Gaussian width.


    # 7.5.1  Geometric meaning of width


    Gaussian width has a nice geometric meaning: it’s about how wide the set \(T\subset\mathbb{R}^n\)
    looks in random directions. The width of \(T\) in the direction \(\theta\in S^{n-1}\)
    is the width of the smallest slab (between parallel hyperplanes orthogonal to
    \(\theta\)) that contains \(T\) (see Figure 7.3), which can be expressed as \(\sup_{x,y\in
    T}\langle\theta,x-y\rangle\) (check)! If we average the width over all unit directions
    \(\theta\), we get


    \[\mathbb{E}\sup_{x,y\in T}\langle\theta,x-y\rangle=\mathbb{E}\sup_{z\in T-T}\langle\theta,z\rangle.\tag{7.16}\]


    ![](img/b122213aed28c1888de83a894123323e_215_0.png)


    **Figure 7.3** The width of a set \(T\subset\mathbb{R}^n\) in the direction of
    a unit vector \(\theta\).


    **Definition 7.5.4** (Spherical width). The *spherical width* of a set \(T\subset\mathbb{R}^n\)
    is


    \[w_s(T):=\mathbb{E}\sup_{x\in T}\langle\theta,x\rangle\quad\text{where}\quad\theta\sim\operatorname{Unif}(S^{n-1}).\]


    The only difference between the Gaussian and spherical widths is in the random
    vectors we average over: \(g\sim N(0,I_n)\) versus \(\theta\sim\operatorname{Unif}(S^{n-1})\).
    Both are rotation invariant, but \(g\) is approximately \(\sqrt{n}\) times longer
    than \(\theta\). Thus:'
