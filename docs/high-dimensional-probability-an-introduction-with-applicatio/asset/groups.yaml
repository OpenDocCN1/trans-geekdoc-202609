    **Definition 8.1.1** (Subgaussian increments). A random process \((X_t)_{t\in
    T}\) on a metric space \((T,d)\) has *subgaussian increments* if there exists
    \(K\ge 0\) such that


    $$

    \|X_t-X_s\|_{\psi_2}\le Kd(t,s)\quad\text{for all }t,s\in T. \tag{8.1}

    $$


    **Example 8.1.2** (Gaussian processes). Let \((X_t)_{t\in T}\) be a Gaussian process
    on some set \(T\). It naturally defines a *canonical metric* on \(T\):


    $$

    d(t,s):=\|X_t-X_s\|_{L^2},\quad t,s\in T,

    $$


    as we explained in (7.1). With respect to this metric, \((X_t)_{t\in T}\) clearly
    had subgaussian increments, with some absolute constant \(K\).


    Here is another (trivial) example: any random process can be made to have subgaussian
    increments by defining the metric as \(d(t,s):=\|X_t-X_s\|_{\psi_2}\).


    Now we give a bound on a general subgaussian random process \((X_t)_{t\in T}\)
    in terms of the metric entropy \(\log \mathcal{N}(T,d,\varepsilon)\):


    **Theorem 8.1.3** (Dudley integral inequality). Let \((X_t)_{t\in T}\) be a *mean-zero
    random process* on a metric space \((T,d)\) with subgaussian increments as in
    (8.1). Then


    $$

    \mathbb{E}\sup_{t\in T}X_t\le CK\int_0^\infty\sqrt{\log \mathcal{N}(T,d,\varepsilon)}\,d\varepsilon.

    $$


    Before we prove Dudley inequality, let’s compare it with Sudakov inequality (Theorem
    7.4.1), which for Gaussian processes says:


    $$

    \mathbb{E}\sup_{t\in T}X_t\ge c\sup_{\varepsilon>0}\varepsilon\sqrt{\log \mathcal{N}(T,d,\varepsilon)}.

    $$


    Figure 8.1 illustrates both bounds. There is a clear gap between them, and it
    turns out that metric entropy alone cannot close it – we will explore this later.


    ![](img/b122213aed28c1888de83a894123323e_228_0.png)


    **Figure 8.1** Dudley inequality bounds \(\mathbb{E}\sup_{t\in T}X_t\) by the
    area under the curve. Sudakov inequality bounds it below by the largest area of
    a rectangle under the curve, up to constants.


    The Dudley inequality hints that \(\mathbb{E}\sup_{t\in T}X_t\) is a *multiscale*
    quantity – to bound it, we need to look at \(T\) across all scales \(\varepsilon\).
    And that is exactly how the proof works. We will first prove a discrete version
    using dyadic scales \(\varepsilon=2^{-k}\) (like a Riemann sum), then move to
    the continuous version.


    **Theorem 8.1.4** (Discrete Dudley inequality). Let \((X_t)_{t\in T}\) be a mean-zero
    random process on a metric space \((T,d)\) with subgaussian increments as in (8.1).
    Then


    $$

    \mathbb{E}\sup_{t\in T}X_t\le CK\sum_{k\in\mathbb{Z}}2^{-k}\sqrt{\log\mathcal{N}(T,d,2^{-k})}.
    \tag{8.2}

    $$


    The proof uses the important technique of *chaining*. It is basically a multi-scale
    version of the \(\varepsilon\)-net argument we have used before, like in the proofs
    of Theorems 4.4.3 and 7.6.1.


    In the \(\varepsilon\)-net argument, we approximate \(T\) by an \(\varepsilon\)-net
    \(\mathcal{N}\) so every point \(t\in T\) is close to some \(\pi(t)\in\mathcal{N}\),
    with \(d(t,\pi(t))\le\varepsilon\). Then the increment condition (8.1) gives


    $$

    \|X_t-X_{\pi(t)}\|_{\psi_2}\le K\varepsilon. \tag{8.3}

    $$


    This leads to


    $$

    \mathbb{E}\sup_{t\in T}X_t\le \mathbb{E}\sup_{t\in T}X_{\pi(t)}+\mathbb{E}\sup_{t\in
    T}(X_t-X_{\pi(t)}).

    $$


    We can handle the first term via a union bound over \(|\mathcal{N}|=\mathcal{N}(T,d,\varepsilon)\)
    points \(\pi(t)\). But the second term is tricky — it is not clear how to combine
    (8.3) with a union bound over all \(t\in T\). To fix this, we don’t stop at one
    net, but we choose smaller and smaller \(\varepsilon\) to get better approximations
    \(\pi_1(t),\pi_2(t),\ldots\) to \(t\) with finer nets. That is the idea behind
    *chaining*, which we will now formalize.


    **Proof of Theorem 8.1.4.** **Step 1: Chaining set-up.** Without loss of generality,
    we may assume that \(K=1\) (why?) and \(T\) is finite (see Remark 7.2.1). Define
    the dyadic scale


    $$

    \varepsilon_k=2^{-k},\qquad k\in\mathbb{Z}. \tag{8.4}

    $$


    and choose \(\varepsilon_k\)-nets \(T_k\) of \(T\) so that


    $$

    |T_k|=\mathcal{N}(T,d,\varepsilon_k). \tag{8.5}

    $$


    Only a part of the dyadic scale will be needed. Since \(T\) is finite, there exists
    a small enough number \(\kappa\in\mathbb{Z}\) (defining the coarsest net) and
    a large enough number \(K\in\mathbb{Z}\) (defining the finest net), such that


    $$

    T_\kappa=\{t_0\}\text{ for some }t_0\in T,\qquad T_K=T. \tag{8.6}

    $$


    For a point \(t\in T\), let \(\pi_k(t)\) denote a closest point in \(T_k\), so
    we have


    $$

    d(t,\pi_k(t))\le\varepsilon_k. \tag{8.7}

    $$


    Since \(\mathbb{E}X_{t_0}=0\) by assumption, we have


    $$

    \mathbb{E}\sup_{t\in T}X_t=\mathbb{E}\sup_{t\in T}(X_t-X_{t_0}).

    $$


    ## 8.2 Application: empirical processes


    Let’s apply Dudley inequality to *empirical processes* – certain natural random
    processes indexed by functions. Here is a motivating example.


    ### 8.2.1 The Monte Carlo method


    Suppose we want to compute an integral


    $$

    \int_{\Omega} f\,d\mu

    $$


    where \(f : \Omega \to \mathbb{R}\) is a given function on some set \(\Omega\)
    and \(\mu\) is a probability measure on \(\Omega\). For instance, this could just
    be \(\int_0^1 f(x)\,dx\) for a function \(f : [0,1] \to \mathbb{R}\) (see Figure
    8.3a).


    We can do this *probabilistically*. Suppose \(X\) is a random point in \(\Omega\)
    drawn according to \(\mu\), i.e. \(\mathbb{P}\{X \in A\} = \mu(A)\) for any measurable
    set \(A \subset \Omega\). (For instance, \(X \sim \operatorname{Unif}[0,1]\) if
    you are integrating over \([0,1]\).) Then the integral becomes the expectation:


    $$

    \int_{\Omega} f\,d\mu = \mathbb{E}\,f(X).

    $$


    Now take i.i.d. samples \(X_1, X_2, \ldots\). By the law of large numbers (Theorem
    1.7.1),


    $$

    \frac{1}{n}\sum_{i=1}^{n} f(X_i) \to \mathbb{E}\,f(X) \quad \text{almost surely}
    \tag{8.18}

    $$


    as \(n \to \infty\). So, we can approximate the integral with the arithmetic mean:


    $$

    \int_{\Omega} f\,d\mu \approx \frac{1}{n}\sum_{i=1}^{n} f(X_i) \tag{8.19}

    $$


    (see Figure 8.3b). This is the *Monte Carlo method* – compute the integral by
    averaging function values at random sample points.


    ![](img/b122213aed28c1888de83a894123323e_233_0.png)


    **Figure 8.3** Monte Carlo method for numerical integration.


    **Remark 8.2.1** (Error rate). The expected error of the Monte Carlo estimate
    (8.19) is \(O(1/\sqrt{n})\). This comes from the rate of convergence in the law
    of large numbers (1.23):


    $$

    \mathbb{E}\left|\frac{1}{n}\sum_{i=1}^{n} f(X_i)-\mathbb{E}f(X)\right|\leq \left[\operatorname{Var}\left(\frac{1}{n}\sum_{i=1}^{n}f(X_i)\right)\right]^{1/2}=O\left(\frac{1}{\sqrt{n}}\right).
    \tag{8.20}

    $$


    **Remark 8.2.2** (Monte Carlo is high-dimensional, agnostic). Monte Carlo works
    well in high dimensions since the error (8.20) does not depend on dimension—unlike
    grid-based integration methods. You don’t even need to know the measure \(\mu\);
    just being able to sample from it is enough. Same with \(f\) – you only need its
    values at a few random points.


    ### 8.2.2 Lipschitz law of large numbers


    Can we use the same sample \(X_1,\ldots,X_n\) to estimate the integral of any
    function \(f:\Omega\to\mathbb{R}\)? No. A badly chosen \(f\) could wiggle wildly
    between sample points (like in Figure 8.4), making the Monte Carlo estimate (8.19)
    totally off.


    ![](img/b122213aed28c1888de83a894123323e_234_0.png)


    **Figure 8.4** One sample \(X_1,\ldots,X_n\) cannot be used to approximate the
    integral of *all* functions \(f\).


    But what if we stick to functions that do not wiggle too much – like Lipschitz
    ones? Then yes!


    **Theorem 8.2.3** (Lipschitz law of large numbers). *Consider the class of functions*


    $$

    \mathcal{F}:=\{f:[0,1]\to\mathbb{R},\ \|f\|_{\mathrm{Lip}}\leq L\}, \tag{8.21}

    $$


    where \(L\) is any number. Let \(X,X_1,X_2,\ldots,X_n\) be i.i.d. random variables
    taking values in \([0,1]\). Then


    $$

    \mathbb{E}\sup_{f\in\mathcal{F}}\left|\frac{1}{n}\sum_{i=1}^{n}f(X_i)-\mathbb{E}f(X)\right|\leq
    \frac{CL}{\sqrt{n}}. \tag{8.22}

    $$


    **Remark 8.2.4** (One sample serves all Lipschitz functions). Before the proof,
    let’s reiterate the key point: the supremum over \(f\in\mathcal{F}\) is inside
    the expectation. Thanks to Markov inequality, this means that a single sample
    \(X_1,\ldots,X_n\) will, with high probability, work well simultaneously for all
    \(f\in\mathcal{F}\). And “work well” means approximating each integral with error
    \(O(1/\sqrt{n})\) – same rate as the usual law of large numbers for just one function.
    So, we made the law of large numbers uniform without losing anything!

