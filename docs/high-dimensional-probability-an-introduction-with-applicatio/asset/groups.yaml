    \ T}$，Sudakov不等式（定理7.4.1）用 $T$ 的度量熵给出 $\\mathbb{E}\\sup_{t\\in T} X_t$ 的*下*界。现在我们将寻求*上*界。而且我们不会局限于高斯过程，而是更进一步，处理更一般的次高斯过程。\n\
