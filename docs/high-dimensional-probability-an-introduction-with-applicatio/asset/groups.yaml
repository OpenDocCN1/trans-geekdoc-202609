    \ presentation of the proofs of Slepian and Sudakov-Fernique inequalities in Section\
    \ [7.2] is based on the approach of J.-P. Kahane [180] and a smoothing argument\
    \ of S. Chatterjee (see [11, Section 2.2]), and it follows [330, Section 6.1].\n\
    \nThe relevance of comparison inequalities to random matrix theory was noticed\
    \ by S. Szarek. The applications in Section [7.3] can be derived from the work\
    \ of Y. Gordon [140]. Our presentation there follows the argument in [94, Section\
    \ II.c], reproduced also in [340, Section 5.3.1].\n\nSudakov inequality (Theorem\
    \ [7.4.1]) was originally proved by V. N. Sudakov. Our presentation follows [210,\
    \ Theorem 3.18]; see [21, Section 4.2] for an alternative proof via duality.\n\
    \nGaussian width, introduced in Section [7.5], originates in geometric functional\
    \ analysis and asymptotic convex geometry [21, 246]. Starting from [290], the\
    \ role of Gaussian width was recognized in applications to signal processing and\
    \ high-dimensional statistics. Milman’s “hyperbolic sketch” of a high-dimensional\
    \ convex body discussed in Remark [7.5.10] is from [241]; for more on this, see\
    \ the preface of [21] and [23].\n\nThe effective dimension introduced in Section\
    \ [7.5.3] has some variants in the literature, including the statistical dimension\
    \ for convex cones [228, 18, 267].\n\nTheorem [7.6.1] on the diameters of random\
    \ projections of sets is due to V. Milman [245], see also [21, Proposition 5.7.1].\n\
    \nTalagrand contraction principle (Exercise [7.3]) can be found in [210, Corollary\
    \ 3.17], where one can find a more general result (with a convex and increasing\
