    **例 8.3.5**（半空间）。\(\mathbb{R}^n\) 中的半空间是如下形式的集合

    \[

    \{x : \langle a, x\rangle \le b\}

    \]

    其中 \(a\in\mathbb{R}^n\)，\(b\in\mathbb{R}\)。设 \(\mathcal{F}\) 是 \(\mathbb{R}^n\)
    中所有半空间的指示函数类。则

    \[

    \operatorname{VC}(\mathcal{F}) = n+1.

    \]


    **注 8.3.6**（VC 维与参数数量）。函数类的 VC 维通常与参数数量大致匹配——例如，\(\mathbb{R}^n\) 中的半空间由 \(n+1\)
