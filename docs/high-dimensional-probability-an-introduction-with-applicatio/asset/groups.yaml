    \ 9.33）。\n\n## 9.6 随机矩阵对一般范数的偏差\n\n让我们将矩阵偏差不等式（定理 9.1.1）推广，使其适用于任意范数——而不仅仅是欧几里得范数。实际上，我们甚至不需要范数为非负——只要齐次性和三角不等式就足够了。\n\
    \n### 定义 9.6.1（允许范数取负值）。\n\n实值函数 $f$ 在线性向量空间 $V$ 上称为：\n\n- *正齐次* 如果对所有 $\\alpha\
    \ \\ge 0$ 和 $x \\in V$ 有 $f(\\alpha x)=\\alpha f(x)$；\n- *次可加* 如果对所有 $x,y \\in\
    \ V$ 有 $f(x+y) \\le f(x)+f(y)$。\n\n### 例 9.6.2。\n\n这些函数是正齐次且次可加的：\n\n- (a) 任意\
    \ *范数*；\n- (b) 任意实值线性函数（称为 *线性泛函*）；\n- (c) 特别地，对于任意固定向量 $y \\in \\mathbb{R}^m$，函数\
    \ $f(x)=\\langle x,y\\rangle$；\n- (d) 任意有界集合 $S \\subset \\mathbb{R}^n$ 的 *支撑函数*，定义为\n\
