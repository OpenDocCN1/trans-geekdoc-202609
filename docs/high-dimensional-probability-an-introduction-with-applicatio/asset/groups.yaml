    ### 8.17 ☕☕☕（半空间的 VC 维数）


    证明例 8.3.5 中的结论：若 \(\mathcal{F}\) 是 \(\mathbb{R}^n\) 中所有半空间的指示函数类，则 \(\operatorname{vc}(\mathcal{F})
