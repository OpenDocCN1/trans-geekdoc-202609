    <sup>8</sup> 回忆命题 [2.8.1](#) 和次指数范数的定义，性质 **(iv)** 对 $K_4$ 的某个值成立，该值在 $\|X\|_{\psi_1}$
    的一个绝对常数因子范围内。


    2.14 🐁🐁 **（切尔诺夫不等式：小偏差）** 我们来推广推论 2.3.4。设 $X_i$ 为参数为 $p_i$ 的独立伯努利随机变量。考虑它们的和 $S_N
    = \sum_{i=1}^N X_i$，并记其均值为 $\mu = \mathbb{E}S_N$。证明


    $$\mathbb{P}\{|S_N-\mu|\ge \delta\mu\}\le 2\exp\left(-\frac{\delta^2\mu}{2+\delta}\right)
    \quad\text{对任意 }\delta\ge 0.$$


    2.15 🐁 **（切尔诺夫不等式：有界随机变量）** 论证切尔诺夫不等式的所有版本（定理 2.3.1、注记 2.3.2 和推论 2.3.4）对于任意取值于区间
    $[0,1]$ 且均值为 $p_i$ 的独立随机变量 $X_i$ 都成立。


    2.16 🐁🐁 **（均值中位数：修正证明）** 定理 2.4.1 的证明略有缺陷：$B=t^2/4$ 可能不是能整除 $N$ 的整数。请修正这一点。


    2.17 🐁🐁🐁 **（不存在处处次高斯的均值估计量）** 你可能想知道定理 2.4.1 是否对所有 $t>0$ 都成立。事实并非如此。实际上，任何均值估计量都不能对所有分位数提供次高斯置信度。*反驳*以下断言：


    > > “存在一个绝对常数 $c>0$，使得以下结论成立：对任意整数 $N>0$ 和任意 $t\ge 0$，可以找到一个函数 $\hat{\mu}:\mathbb{R}^N\to\mathbb{R}$
    满足

    > >

    > > $$\mathbb{P}\left\{\left|\hat{\mu}(X_1,\ldots,X_N)-\mu\right|\ge \frac{t\sigma}{\sqrt{N}}\right\}\le
    2e^{-ct^2}$$

    > >

    > > 对所有均值为 $\mu$、方差为 $\sigma^2$ 的独立同分布随机变量 $X_1,\ldots,X_N$ 都成立。”


    请通过推导 *Le Cam 两点法*的一个版本来完成：


    - (a) 考虑两个随机向量 $X=(X_1,\ldots,X_N)$ 和 $Y=(Y_1,\ldots,Y_N)$，其坐标独立且服从拉普拉斯¹⁰分布：对某个
    $\mu>0$，$X_i\sim\operatorname{Lap}(0,1)$，$Y_i\sim\operatorname{Lap}(\mu,1)$。验证对任意可测子集
    $B\subset\mathbb{R}^N$，有 $\mathbb{P}\{X\in B\}\le e^\mu\mathbb{P}\{Y\in B\}$。

    - (b) 反设该断言成立。应用它来给出事件 $|\hat{\mu}(X)|\ge \mu/2$ 和 $|\hat{\mu}(Y)-\mu|\ge \mu/2$
    的概率的界。

    - (c) 选取足够大的 $\mu$，并利用 (a) 将 $Y$ 替换为 $X$，使得事件 $|\hat{\mu}(X)|<\mu/2$ 和 $|\hat{\mu}(X)-\mu|<\mu/2$
    都很有可能发生。然后使用三角不等式得到矛盾。


    2.18 🐁 **（稀疏随机图的大部分度数没问题）** 在习题 1.10 中，我们看到一个典型的稀疏随机图 $G\sim G(n,p)$ 有孤立顶点（“没有朋友的学生”），导致最小度数为零。然而，大部分顶点的度数仍然接近期望度数
    $d=(n-1)p$。证明：存在绝对常数 $C>0$，使得若 $d\ge C$，则以下事件以至少 $0.99$ 的概率发生：至少 $99\%$ 的顶点的度数介于
    $0.9d$ 和 $1.1d$ 之间。


    2.19 🐁🐁🐁🐁🐁 **（稀疏随机图的最大度数）** 在习题 1.10 中，我们观察到典型的稀疏随机图 $G\sim G(n,p)$ 的最小度数为零。但最大度数（“最受欢迎学生的朋友数量”）呢，记为


    ¹⁰ 拉普拉斯分布 $\operatorname{Lap}(\mu,1)$ 的概率密度函数为 $\frac{1}{2}e^{-|x-\mu|}$，其中 $x\in\mathbb{R}$。其均值为
    $\mu$，方差为 $2$。（请验证！）


    根据 $E_n$ 是否发生来对事件进行拆分，我们得到


    $$\mathbb{P}\{\sqrt{n}\langle X,v\rangle\le t\}\le \mathbb{P}\{\sqrt{n}\langle
    X,v\rangle\le t\text{ 且 }E_n\}+\mathbb{P}(E_n^c)$$

    $$\le \mathbb{P}\{g_1\le t_n\}+p_n.$$


    因此


    $$\mathbb{P}\{\sqrt{n}\langle X,v\rangle\le t\}-\mathbb{P}\{g_1\le t\}\le \mathbb{P}\{g_1\in[t,t_n]\}+p_n.
    \tag{3.18}$$


    $g_1$ 在 $[t,t_n]$ 上的密度以 $e^{-t^2/2}$ 为界，因此


    $$(3.18)\le e^{-t^2/2}(t_n-t)+p_n=e^{-t^2/2}\frac{\ln n}{\sqrt n}+p_n\le \frac{C\ln
    n}{\sqrt n}+p_n.$$


    右端不依赖于 $v$ 或 $t$，并且当 $n\to\infty$ 时趋于零。类似的论证给出了 $\mathbb{P}\{g_1\le t\}-\mathbb{P}\{\sqrt{n}\langle
    X,v\rangle\le t\}$ 的一个同样趋于零的界。（请自行完成！）将这两个界合并，证明完成。


    **注记 3.3.10**（球面上的一维边际密度）。半径为 $\sqrt n$ 的球面上的均匀分布的一维边际密度可以计算出来。正如你将在习题 $3.27$
    中看到的，它与 $(1-x^2/n)^{\frac{n-3}{2}}$ 成正比。当 $n$ 很大时，这近似于 $e^{-x^2/2}$，与高斯极限一致。


    ### 3.3.4 凸集上的均匀分布


    这个例子来自凸几何和计算几何。一个有非空内部的有界凸集 $K\subset\mathbb{R}^n$ 被称为*凸体*。设 $X$ 为均匀分布于 $K$ 中的随机向量：


    $$X\sim\operatorname{Unif}(K).$$


    $X$ 的密度在 $K$ 上等于 $1/\operatorname{Vol}(K)$，在其他地方为零。$X$ 的均值，


    $$\mu=\mathbb{E}X=\frac{1}{\operatorname{Vol}(K)}\int_K x\,dx,$$


    是 $K$ 的重心。若 $\Sigma=\operatorname{cov}(X)$ 是 $K$ 的协方差矩阵，则标准得分 $Z:=\Sigma^{-1/2}(X-\mu)$
    是一个各向同性随机向量，正如我们在 $(3.10)$ 中注意到的。此外，$Z$ 均匀分布于 $K$ 的仿射变换后的副本中：


    $$Z\sim\operatorname{Unif}\left(\Sigma^{-1/2}(K-\mu)\right).$$


    （为什么？）总而言之，我们找到了一个仿射变换 $T$，使得 $T(K)$ 上的均匀分布是各向同性的。凸体 $T(K)$ 本身通常也被称为各向同性凸体。


    在算法凸几何中，我们可以将各向同性凸体 $T(K)$ 视为 $K$ 的一个良态版本，其中 $T$ 起到*预条件子*的作用（见图 $3.6$）。当 $K$ 良态时，诸如求
    $K$ 的体积之类的算法通常表现更好。


