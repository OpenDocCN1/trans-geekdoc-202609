    **注记 7.5.10**（宽度在高维中的惊人表现）。从例 7.5.6–7.5.8 可以看出，立方体 $B_\infty^n$ 的高斯宽度与其*外接*球 $\sqrt{n}B_2^n$
    大致相同（相差一个常数因子）。但对于交叉多胞体 $B_1^n$，其宽度（相差一个对数因子）大约与其*内切*球 $\frac{1}{\sqrt{n}}B_2^n$
    相似，而这个内切球非常小！这是为什么呢？


    立方体 $B_\infty^n$ 有非常多的顶点（$2^n$ 个），因此在大多数方向上它都大致凸出到外接球的范围，正是这一点决定了宽度。但交叉多胞体 $B_1^n$
    只有 $2n$ 个顶点，所以随机方向 $g\sim N(0,I_n)$ 很可能远离所有这些顶点。宽度并不是由那些孤零零的 $2n$ 个“尖刺”决定的，而是由“主体部分”决定的，这个主体部分大致就是内切球。


    图 7.4a 展示了 Milman 关于 $B_1^n$ 的*双曲草图*，突出显示了为什么主体部分（内切球）占主导地位——因为这个集合只有很少的顶点（尖刺）。你也可以对一般凸集画出类似的草图（图
    7.4b）——即使图中失去了凸性，它们也非常有助于建立高维直觉。


    若想进一步练习，请尝试习题 7.17，计算任意 $\ell^p$ 球的高斯宽度，它将一次覆盖上述三个例子——球（$p=2$）、立方体（$p=\infty$）和交叉多胞体（$p=1$）。另外请完成习题
    7.18–7.19，计算算子范数至多为 1 的 $n\times n$ 矩阵集合的高斯宽度。


    ![](img/b122213aed28c1888de83a894123323e_217_0.png)


    ### 7.5.3 高斯复杂度与有效维数


    高斯宽度 $w(T)$ 有几个有用的“近亲”。通常我们取 $\langle g,t\rangle$ 的期望最大值，但有时使用 $L^1$ 或 $L^2$ 平均更便于处理：


    $$w(T)=\mathbb{E}\sup_{x\in T}\langle g,x\rangle,\qquad \gamma(T):=\mathbb{E}\sup_{x\in
    T}|\langle g,x\rangle|,\qquad h(T):=\left(\mathbb{E}\sup_{x\in T}\langle g,x\rangle^2\right)^{1/2},$$


    其中 $g\sim N(0,I_n)$。我们称 $\gamma(T)$ 为 $T$ 的*高斯复杂度*。显然，


    $$w(T)\leq\gamma(T)\leq h(T),$$


    而且反向的不等式也基本成立：


    **引理 7.5.11**（高斯宽度的几个近似等价形式）。*对任意有界集合 $T \subset \mathbb{R}^n$，有*⁸


    - (a) $\gamma(T - T) = 2w(T)$。

    - (b) 对任意一点 $y \in T$，$h(T) \asymp \gamma(T) \asymp w(T) + \|y\|_2$。


    *特别地，如果 $T$ 包含原点，那么这三种形式是等价的：*


    $h(T) \asymp \gamma(T) \asymp w(T)$。


    *证明* (a) 由命题 7.5.2(e) 直接得出，因为 $T - T$ 是关于原点对称的。

    (b) 我们只证明第一部分，把等价关系 $\gamma(T) \asymp w(T) + \|y\|_2$ 留给你在习题 7.20 中证明。我们显然有 $\gamma(T)
    \le h(T)$。对于反向不等式，考虑 $\mathbb{R}^n$ 上的函数 $z \mapsto \sup_{x\in T} |\langle z,
    x\rangle|$。它的 Lipschitz 范数以半径 $\sup_{x\in T} \|x\|_2 = r(T)$ 为界（请检验！）。于是，由高斯集中不等式
    (5.5)，


    $\big\|\sup_{x\in T} |\langle g, x\rangle| - \gamma(T)\big\|_{\psi_2} \lesssim
    r(T)$。


    因此，由三角不等式和命题 2.6.6(ii)，我们得到


    $h(T) = \big\|\sup_{x\in T} |\langle g, x\rangle|\big\|_{L^2} \lesssim \big\|\sup_{x\in
    T} |\langle g, x\rangle|\big\|_{\psi_2} \lesssim \gamma(T) + r(T) \lesssim \gamma(T)$。


    最后一步用到了 $\gamma(T) \gtrsim r(T)$，这来自 (b) 的第二部分——只需对 $y \in T$ 取上确界即可。


    高斯宽度帮助我们定义维数概念的一个稳健版本。集合 $T \subset \mathbb{R}^n$ 通常的线性代数维数，即包含它的最小仿射空间的维数，会因
    $T$ 的微小扰动而发生很大变化。下面是一个更稳健的替代：


    **定义 7.5.12**（有效维数）。有界集合 $T \subset \mathbb{R}^n$ 的*有效维数*为


    $d(T) := \frac{h(T - T)^2}{\operatorname{diam}(T)^2} \asymp \frac{w(T)^2}{\operatorname{diam}(T)^2}$。


    等价关系由引理 7.5.11 得出。有效维数以线性代数维数为界：


    $d(T) \le \dim(T)$，


    当 $T$ 是某个子空间中的欧氏球时取等号（见习题 7.21）。与通常的维数不同，有效维数是稳定的——对 $T$ 的微小扰动只会略微改变其宽度和直径。


    为了练习有效维数，请计算椭球的有效维数（习题 7.23），并估计一般有限集合的有效维数上界（习题 7.22）。


    ⁸ 此处一如既往，记号 $\asymp$ 隐藏正的绝对常数因子。


    ## 7.6 应用：集合的随机投影


    如果我们将集合 \(T \subset \mathbb{R}^n\) 投影到 \(\mathbb{R}^n\) 中一个随机的 \(m\) 维子空间上（从格拉斯曼流形
    \(G_{n,m}\) 中均匀选取），会发生什么？如图 5.2 所示。在实践中，我们可以把 \(T\) 看作数据，把 \(P\) 看作一种降维方式，例如 Johnson-Lindenstrauss
    引理就是如此。关于投影集合 \(PT\) 的大小（直径），我们能说些什么呢？


    对于有限集合 \(T\)，Johnson-Lindenstrauss 引理（定理 5.3.1）指出：如果 \(m \gtrsim \log |T|\)，那么随机投影
    \(P\) 本质上相当于对 \(T\) 作一个缩放：它将 \(T\) 中所有点之间的距离按大约 \(\sqrt{m/n}\) 的因子缩小。特别地，


    \[\operatorname{diam}(PT) \approx \sqrt{\frac{m}{n}}\,\operatorname{diam}(T).
    \tag{7.20}\]


    但如果 \(T\) 的基数太大甚至是无限的，(7.20) 可能失效。例如，当 \(T = B_2^n\) 是欧氏球时，任何投影都不能缩小它的大小：


    \[\operatorname{diam}(PT) = \operatorname{diam}(T). \tag{7.21}\]


    那么一般的集合 \(T\) 又如何呢？下面的结果表明，随机投影会像 (7.20) 那样缩小 \(T\)，但不能将其缩小到低于球面宽度 \(w_s(T)\)：


    **定理 7.6.1（集合随机投影的大小）。** 设 \(T \subset \mathbb{R}^n\) 为有界集合，\(P\) 为 \(\mathbb{R}^n\)
    到随机 \(m\) 维子空间 \(E \sim \operatorname{Unif}(G_{n,m})\) 上的正交投影。则


    \[\mathbb{E}\,\operatorname{diam}(PT) \lesssim w_s(T) + \sqrt{\frac{m}{n}}\,\operatorname{diam}(T),\]


    其中记号 \(\lesssim\) 隐藏正的绝对常数因子。


    *证明* 我们证明上界，下界留给你完成（见习题 7.26）。


    **第 1 步：更换模型。** 我们像命题 5.3.2 的证明中那样切换视角。随机子空间 \(E \subset \mathbb{R}^n\) 可以通过随机旋转某个固定子空间（例如
    \(\mathbb{R}^m\)）得到。但我们不必固定 \(T\) 并随机旋转 \(\mathbb{R}^m\)，而是可以固定 \(E = \mathbb{R}^m\)
    并随机旋转 \(T\)。向量 \(x \in T\) 的随机旋转是 \(Ux\)，其中 \(U \sim \operatorname{Unif}(O(n))\)
    是随机正交矩阵。将 \(Ux\) 投影到 \(E = \mathbb{R}^m\) 上，相当于保留前 \(m\) 个坐标，即 \(Qx\)，其中 \(Q\)
    是由 \(U\) 的前 \(m\) 列构成的 \(m \times n\) 矩阵。因此，我们可以用 \(Q\) 代替 \(P\) 来工作。


    **第 2 步：逼近。** 不失一般性，设 \(\operatorname{diam}(T) \le 1\)。（为什么？）我们需要估计


    \[\operatorname{diam}(QT) = \sup_{x\in T-T}\|Qx\|_2 = \sup_{x\in T-T}\max_{z\in
    S^{m-1}}\langle Qx,z\rangle.\]


    我们将像定理 4.4.3 的证明中那样使用 \(\varepsilon\)-网论证。取球面 \(S^{m-1}\) 的一个 \((1/2)\)-网 \(\mathcal{N}\)，使得


    \[|\mathcal{N}| \le 5^m\]


    这里使用了推论 4.2.11。我们可以将球面 $S^{m-1}$ 上的上确界替换为网 $\mathcal{N}$ 上的上确界，代价是因子 2：


    $$\operatorname{diam}(QT) \le 2\sup_{x\in T-T}\max_{z\in\mathcal{N}}\langle Qx,z\rangle
    = 2\max_{z\in\mathcal{N}}\sup_{x\in T-T}\langle Q^{\mathsf T}z,x\rangle. \tag{7.22}$$


    （见习题 4.35）。现在的计划是：我们先固定 $z\in\mathcal{N}$，估计


    $$\sup_{x\in T-T}\langle Q^{\mathsf T}z,x\rangle \tag{7.23}$$


    然后对所有 $z$ 取并集界。


    **第 3 步：集中。** 现在固定 $z\in\mathcal{N}$。由构造可知，$Q^{\mathsf T}z$ 在球面上均匀分布：$Q^{\mathsf
    T}z\sim\operatorname{Unif}(S^{n-1})$（请在习题 7.24 中仔细检验）。(7.23) 的期望可以表示为球面宽度：


    $$\mathbb{E}\sup_{x\in T-T}\langle Q^{\mathsf T}z,x\rangle=w_s(T-T)=2w_s(T).$$


    （最后一个等式只是命题 7.5.2(e) 的球面版本。）

    为了检验 (7.23) 围绕其均值集中，我们使用球面上的集中不等式（定理 5.1.3，更具体地说是 (5.30)）。由于根据假设 $\operatorname{diam}(T)\le
