    ### 8.2.3 经验测度


    为了获得更广阔的视角，我们再来看一眼经验过程的定义 8.2.5。给定按某个概率测度 \(\mu\) 从 \(\Omega\) 中抽取的独立同分布样本 \(X_1,\ldots,X_n\)，考虑*经验测度*
    \(\mu_n\)，它赋予每个点以相等的概率 \(1/n\)，并按重数计数：


    $$\mu_n=\frac{1}{n}\sum_{i=1}^{n}\delta_{X_i}.$$


    这里 \(\delta_x\) 是 \(x\) 处的狄拉克概率测度，即对任意集合 \(A\)，若 \(x\in A\) 则 \(\delta_x(A)=1\)，否则为
    0。因此，\(\mu_n(A)\) 是落入集合 \(A\subset\Omega\) 的样本点所占的比例。


    函数 \(f\) 关于原测度 \(\mu\) 的积分是 \(\mathbb{E}f(X)\)（\(f\) 的“总体”均值），而 \(f\) 关于经验测度 \(\mu_n\)
    的积分是 \(\frac{1}{n}\sum_{i=1}^{n}f(X_i)\)（\(f\) 的“样本”或经验均值）。经验过程 \(X_f\) 在 (8.23)
    中刻画了经验期望与总体期望之间的偏差。


    这个偏差——我们在定理 8.2.3 中给出了它的界——可视为测度 \(\mu\) 与 \(\mu_n\) 之间的距离，称为 *Wasserstein 距离*
