    \ then $\\mathbb{E}\\sup_{t\\in T}X_t=\\infty$.\n\n- **7.15 (Properties of Gaussian\
    \ width)** Prove Properties (a)–(d) and (g) in Proposition 7.5.2.\n\n- **7.16\
    \ (Gaussian width and diameter)** Show by example that, for any dimension $n$,\
    \ both bounds in Proposition 7.5.2(f) are attained up to absolute constant factors.\n\
    \n- **7.17 (Gaussian width of the $\\ell^p$ ball)** Let $1 \\le p \\le \\infty$.\
