    (the “population” average of $f$), and the integral of $f$ with respect to the
    empirical measure $\mu_n$ is $\frac{1}{n}\sum_{i=1}^{n}f(X_i)$ (the “sample”,
    or empirical, average of $f$). The empirical process $X_f$ in (8.23) tracks the
    deviation of the population expectation from the empirical expectation.


    This deviation, which we bound in Theorem 8.2.3, can be thought of as a distance
    between measures $\mu$ and $\mu_n$, called the *Wasserstein distance* $W_1(\mu,\mu_n)$.
