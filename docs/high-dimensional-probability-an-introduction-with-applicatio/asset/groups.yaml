    \ $L^2$ 意义下）。如果我们选择观测条目的平均数量 $m$ 使得\n\n$$m \\ge C' r n \\log n$$\n\n大常数 $C'$，则定理\
    \ 6.5.1 保证平均误差远小于 $\\|X\\|_\\infty$。因此，*矩阵补全是可能的，只要观测条目数超过 $rn$ 一个对数裕度。*\n\n*证明*\
    \ 我们首先在算子范数中对恢复误差进行界定，然后利用低秩假设过渡到 Frobenius 范数。\n\n## 第 1 步：对算子范数中的误差进行界定\n\n\
    使用三角不等式，我们可以将误差拆分为如下形式：\n\n$$\\|\\hat{X} - X\\| \\le \\|\\hat{X} - p^{-1}Y\\|\
    \ + \\|p^{-1}Y - X\\|.$$\n\n由于我们选择 $\\hat{X}$ 为 $p^{-1}Y$ 的最佳秩 $r$ 近似，第二项占主导，即\
    \ $\\|\\hat{X} - p^{-1}Y\\| \\le \\|p^{-1}Y - X\\|$，于是我们有\n\n$$\\|\\hat{X} - X\\\
    | \\le 2\\|p^{-1}Y - X\\| = \\frac{2}{p}\\|Y - pX\\|. \\tag{6.17}$$\n\n注意矩阵 $\\\
    hat{X}$，其难以处理，已从界中消失。取而代之的是 $Y - pX$，其更容易理解，因为其条目\n\n$$ (Y - pX)_{ij} = (\\delta_{ij}\
    \ - p)X_{ij}, $$\n\n是独立的、均值为零的随机变量。利用定理 6.4.1（更精确地，其非对称版本，见练习 6.28），我们得到\n\n$$\\\
    mathbb{E}\\|Y - pX\\| \\le C\\sqrt{\\log n}\\left(\\mathbb{E}\\max_{i\\le n}\\\
    |(Y - pX)_{i:}\\|_2 + \\mathbb{E}\\max_{j\\le n}\\|(Y - pX)_{:j}\\|_2\\right).\
    \ \\tag{6.18}$$\n\n为了界定 $Y - pX$ 行的范数，我们将其写为\n\n$$\\|(Y - pX)_{i:}\\|_2^2 = \\\
    sum_{j=1}^n (\\delta_{ij} - p)^2 X_{ij}^2 \\le \\sum_{j=1}^n (\\delta_{ij} - p)^2\
    \ \\cdot \\|X\\|_\\infty^2,$$\n\n列的情况类似。这些独立随机变量之和可使用 Bernstein（或 Chernoff）不等式轻松界定，从而得到\n\
    \n$$\\mathbb{E}\\max_{i\\in[n]}\\sum_{j=1}^n (\\delta_{ij} - p)^2 \\lesssim p\
    \ n.$$\n\n（自己在练习 6.30 中完成此计算！）结合列的类似界并代入 (6.18)，我们得到\n\n$$\\mathbb{E}\\|Y - pX\\\
    | \\lesssim \\sqrt{p n \\log n}\\,\\|X\\|_\\infty.$$\n\n凸函数 $f$ 在立方体上的最大值在顶点处取得，此时所有\
    \ $a_i = \\pm 1$。\n\n对于这样的 $a$，随机变量 $(\\varepsilon_i a_i)$ 与 $(\\varepsilon_i)$\
    \ 在对称性下具有相同的分布。因此\n\n$$\\mathbb{E}\\Big\\|\\sum_{i=1}^{N} a_i \\varepsilon_i x_i\\\
