    ## 8.4.1 风险、拟合与复杂度


    给定训练数据 (8.36)，我们希望找到一个函数 $f : \Omega \to \mathbb{R}$ 来近似 $T$，这样我们之后可以通过检查 $f(X)$
    来诊断新患者 $X$。我们的目标是最小化误诊新患者的*风险*，定义为：


    $$R(f) = \mathbb{E}\,(f(X) - T(X))^2. \tag{8.37}$$


    **例 8.4.2。** 在 $T$ 和 $f$ 都是布尔函数的分类问题中，风险就是误分类的概率（请验证这一点！）：


    $$R(f) = \mathbb{P}\{f(X) \ne T(X)\}. \tag{8.38}$$


    我们需要多少训练数据？这取决于问题的复杂度。如果我们认为目标函数 $T(X)$ 的行为很复杂，就需要更多数据。由于我们通常事先不知道这一点，我们将会把猜测限定的函数
    $f$ 限制在某个函数类 $\mathcal{F}$ 中，这个函数类称为*假设类*。


    但是我们如何选择 $\mathcal{F}$ 呢？没有通用的规则，但它应该平衡拟合与复杂度。如果 $\mathcal{F}$ 过于简单——比如只包含线性函数——我们可能会*欠拟合*（见图
