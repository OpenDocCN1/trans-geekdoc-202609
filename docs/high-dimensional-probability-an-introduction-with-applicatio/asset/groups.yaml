  md: "\nBefore we prove Theorem 6.5.1, note that the recovery error\n\n$$\\frac{1}{n}\\\
    |\\hat{X} - X\\|_F = \\left(\\frac{1}{n^2}\\sum_{i,j=1}^n |\\hat{X}_{ij} - X_{ij}|^2\\\
    right)^{1/2}.$$\n\nrepresents the average error per entry (in the $L^2$ sense).\
    \ If we choose the average number of observed entries $m$ so that\n\n$$m \\ge\
    \ C' r n \\log n$$\n\nwith large constant $C'$, then Theorem 6.5.1 guarantees\
    \ that the average error is much smaller than $\\|X\\|_\\infty$. So, *matrix completion\
    \ is possible if the number of observed entries exceeds $rn$ by a logarithmic\
    \ margin.*\n\n*Proof* We first bound the recovery error in the operator norm,\
    \ and then pass to the Frobenius norm using the low rank assumption.\n\n## Step\
    \ 1: Bounding the error in the operator norm\n\nUsing the triangle inequality,\
    \ we can split the error as follows:\n\n$$\\|\\hat{X} - X\\| \\le \\|\\hat{X}\
    \ - p^{-1}Y\\| + \\|p^{-1}Y - X\\|.$$\n\nSince we have chosen $\\hat{X}$ as a\
    \ best rank $r$ approximation to $p^{-1}Y$, the second summand dominates, i.e.\
    \ $\\|\\hat{X} - p^{-1}Y\\| \\le \\|p^{-1}Y - X\\|$, so we have\n\n$$\\|\\hat{X}\
    \ - X\\| \\le 2\\|p^{-1}Y - X\\| = \\frac{2}{p}\\|Y - pX\\|. \\tag{6.17}$$\n\n\
    Note that the matrix $\\hat{X}$, which is tricky to handle, is gone from the bound.\
    \ Instead, we get $Y - pX$, which is easier to understand since its entries,\n\
    \n$$ (Y - pX)_{ij} = (\\delta_{ij} - p)X_{ij}, $$\n\nare independent, mean-zero\
    \ random variables. Using Theorem 6.4.1 (more precisely, its non-symmetric version,\
    \ see Exercise 6.28), we get\n\n$$\\mathbb{E}\\|Y - pX\\| \\le C\\sqrt{\\log n}\\\
    left(\\mathbb{E}\\max_{i\\le n}\\|(Y - pX)_{i:}\\|_2 + \\mathbb{E}\\max_{j\\le\
    \ n}\\|(Y - pX)_{:j}\\|_2\\right). \\tag{6.18}$$\n\nTo bound the norms of the\
    \ rows of $Y - pX$, we write them as\n\n$$\\|(Y - pX)_{i:}\\|_2^2 = \\sum_{j=1}^n\
    \ (\\delta_{ij} - p)^2 X_{ij}^2 \\le \\sum_{j=1}^n (\\delta_{ij} - p)^2 \\cdot\
    \ \\|X\\|_\\infty^2,$$\n\nand similarly for columns. These sums of independent\
    \ random variables can be easily bounded using Bernstein (or Chernoff) inequality,\
    \ which yields\n\n$$\\mathbb{E}\\max_{i\\in[n]}\\sum_{j=1}^n (\\delta_{ij} - p)^2\
    \ \\lesssim p n.$$\n\n(Do this calculation yourself in Exercise 6.30!) Combining\
    \ with a similar bound for the columns and substituting into (6.18), we obtain\n\
    \n$$\\mathbb{E}\\|Y - pX\\| \\lesssim \\sqrt{p n \\log n}\\,\\|X\\|_\\infty.$$\n\
    \nThe maximum of the convex function $f$ on the cube is attained at a vertex,\
    \ where all $a_i = \\pm 1$.\n\nFor such $a$, the random variables $(\\varepsilon_i\
    \ a_i)$ have the same distribution as $(\\varepsilon_i)$ by symmetry. Thus\n\n\
    $$\\mathbb{E}\\Big\\|\\sum_{i=1}^{N} a_i \\varepsilon_i x_i\\Big\\| = \\mathbb{E}\\\
    Big\\|\\sum_{i=1}^{N} \\varepsilon_i x_i\\Big\\|,$$\n\nThus, $f(a) \\le \\mathbb{E}\\\
    big\\|\\sum_{i=1}^{N} \\varepsilon_i x_i\\big\\|$ whenever $\\|a\\|_{\\infty}\
    \ \\le 1$, completing the proof. $\\square$\n\nAs an application, let us prove\
    \ a version of symmetrization (Lemma 6.3.2) but with Gaussian random variables\
    \ $g_i \\sim N(0,1)$ instead of Rademachers.\n\n## Lemma 6.6.2 (Symmetrization\
    \ with Gaussians)\n\nLet $X_1,\\dots,X_N$ be independent, mean-zero random vectors\
    \ in a normed space. Let $g_1,\\dots,g_N \\sim N(0,1)$ be independent Gaussian\
    \ random variables, which are also independent of $X_i$. Then\n\n$$\\frac{c}{\\\
    sqrt{\\log N}}\\mathbb{E}\\Big\\|\\sum_{i=1}^{N} g_i X_i\\Big\\| \\le \\mathbb{E}\\\
    Big\\|\\sum_{i=1}^{N} X_i\\Big\\| \\le 3\\mathbb{E}\\Big\\|\\sum_{i=1}^{N} g_i\
    \ X_i\\Big\\|.$$\n\n*Proof* **Upper bound.** By symmetrization (Lemma 6.3.2),\
    \ we have\n\n$$E := \\mathbb{E}\\Big\\|\\sum_{i=1}^{N} X_i\\Big\\| \\le 2\\mathbb{E}\\\
    Big\\|\\sum_{i=1}^{N} \\varepsilon_i X_i\\Big\\|.$$\n\nTo replace the Rademacher\
    \ random variables with Gaussians, recall that $\\mathbb{E}|g_i| = \\sqrt{2/\\\
