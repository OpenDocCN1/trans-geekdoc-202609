    7.26 要得到界 \(\mathbb{E}\operatorname{diam}(PT) \gtrsim w_s(T)\)，可从 \(P\) 的奇异值分解中丢弃若干项，将
    \(P\) 化为一个一维投影。要得到界 \(\mathbb{E}\operatorname{diam}(PT) \ge \sqrt{m/n}\operatorname{diam}(T)\)，则对
    \(T\) 中的一对点进行论证。


    7.27 用椭球 \(P(AB_2^n)\) 的直径表示 \(PA\) 的算子范数，并在第 (a) 问中使用定理 7.6.1，在第 (b) 问中使用练习 7.25。


    8.1 使用高斯集中不等式（定理 7.1.11）得到 (8.53)。例如，选取 \(z_k = u + \sqrt{k} - \kappa\) 应能使并集界成立。


    8.4 (a) 利用练习 2.37 应当可以直接得出。


    (b) \(T\) 中的前 \(m\) 个向量构成一个 \((1/\sqrt{\log m})\)-分离集。


    8.5 假设 \(\operatorname{diam}(T) = 1\)，利用练习 8.3 将积分替换为求和，并将该和分成两部分：一部分是 \(2^{-k}
    \le n^{-2}\)（例如），另一部分是 \(n^{-2} < 2^{-k} \le 1\)。在第一部分和中使用体积界 (4.17) 来控制覆盖数。第二部分和只有
    \(O(\log n)\) 项。


    8.6 从最粗糙的尺度 \(\kappa\) 开始链式论证 (8.9)，此时单个球覆盖整个 \(T\)，即 \(2^{-\kappa} \approx \operatorname{diam}(T)\)，但提前停止——在尺度
    \(K\) 处停止，此时大致有 \(2^{-K} \approx w(T)/(8\sqrt{n})\)（例如）。(8.8) 中的最后一项此时可能不再像之前那样为零，而是
    \(\mathbb{E}\sup_{t\in T}(X_t-X_{\pi_K(t)})\)。利用 \(\|t-\pi_K(t)\|_2 \le 2^{-K}\)，用
    \(\frac12 w(T)\) 来界住这一项。


    8.7 重做第 8.1 节中的链式论证。


    8.8 考虑集合

    \[

    V=\{(s,t)\in T\times T:d(s,t)\le\delta\},

    \]

    定义随机过程 \(Y_u=X_s-X_t\)，其中 \(u=(s,t)\in V\)，并在 \(V\) 上定义度量

    \[

    \rho(u,u'')=\frac{1}{2K}\|Y_u-Y_{u''}\|_{\psi_2}.

    \]

    验证 \(\operatorname{diam}(V,\rho)\le\delta\)，用 \((T,d)\) 的覆盖数来界 \((V,\rho)\) 的覆盖数，然后应用
    Dudley 不等式 (8.16)。


    8.9 在正方形 \([0,1]^2\) 上放置步长为 \(\varepsilon\) 的网格。给定 \(f\in\mathcal{F}\)，证明存在某个“阶梯”函数
    \(f_0\) 沿着网格以 \(\varepsilon\) 为步长上升/下降或保持平坦，使得 \(\|f-f_0\|_{L^\infty}\le\varepsilon\)（见图
    H.1）。用 \(e^{C/\varepsilon^2}\) 来界所有阶梯函数的个数。接下来使用练习 4.25。


    ![](img/b122213aed28c1888de83a894123323e_316_0.png)


    图 H.1 用网格跟随函数 \(f_0\) 逼近 Lipschitz 函数 \(f\)（练习 8.9）。


    8.10 (b) 不要直接应用 Dudley 不等式，而是重做链式论证（定理 8.1.4 的证明），并在尺度 \(\delta\) 处提前停止，如同练习 8.6
    的解答那样。一旦证明了 (8.54)，将 (a) 中的覆盖数界代入并优化 \(\delta\)。


    8.18 \(\mathcal{F}\) 在某个被 Shatter 的子集 \(\Lambda\subset\Omega\) 上的限制包含 \(\Lambda\)
    上的所有布尔函数，因此其线性代数维数至少为 \(|\Lambda|\)（请验证！）。


    8.22 (a) 仿照命题 8.3.11 的证明进行论证，并使用 Sauer–Shelah 引理（引理 8.3.9）。


    (b) 尝试找出一个例子，使得 \(\operatorname{vc}(\mathcal{F})=\operatorname{vc}(\mathcal{G})=1\)，而
    \(\operatorname{vc}(\mathcal{F}\cup\mathcal{G})=3\)。


    8.24 类似于定理 8.3.15 的证明进行。将集中不等式与对整个类 \(\mathcal{F}\)（限制在 \(\{X_1,\ldots,X_n\}\)
    上）的并集界相结合。使用 Sauer–Shelah 引理来控制 \(\mathcal{F}\) 的基数。


    8.25 对半空间指示函数类应用 VC 大数定律（定理 8.3.15）。


    8.26 (a) 设 \(X_1,\ldots,X_m\) 表示 \(A\) 的行。则

    \[

    \Phi(u)=\operatorname{sign}(Au)=\bigl(\operatorname{sign}\langle X_i,u\rangle\bigr)_{i=1}^m.

    \]


    (b) 对由楔形 \(\{(x,u)\ne(x,v)\}\) 的指示函数组成的函数类 \(\mathcal{F}\)（其中 \(u,v\in S^{n-1}\)）使用一致大数定律（定理
    8.3.15）。利用 VC 维的稳定性性质（命题 8.3.11），用半空间的 VC 维来界定楔形的 VC 维，而半空间的 VC 维已在例 8.3.5 中计算。


    8.27 (a) 设 \(X_1,\ldots,X_m\) 表示 \(A\) 的行。对由带状区域

    \[

    \{x:|\langle x,u\rangle|\ge\varepsilon\}

    \]

    的指示函数组成的函数类 \(\mathcal{F}\)（其中 \(u\in S^{n-1}\)）使用一致大数定律（定理 8.3.15）。注意，\(|\langle
    X_i,u\rangle|\ge\varepsilon\) 蕴含 \(\langle X_i,u\rangle^2\ge\varepsilon^2\)。


    (b) 考虑一个随机向量 \(X\)，它以概率 \(\delta\) 等于第一个基向量 \(e_1\) 的某个适当倍数，并以概率 \(1-\delta\)
    取值于与 \(e_1\) 正交的子空间中。


    8.28 选取一个任意大的子集 \(\Omega_0\subset\Omega\)，它被 \(\mathcal{F}\) Shatter，并令 \(X\sim\operatorname{Unif}(\Omega_0)\)。


    8.29 注意，\((f-h)^2\) 是通过翻转 \(h(x)=1\) 的那些 \(f(x)\) 位从 \(f\) 得到的。


    8.31 证明随机过程 \(X_f=R_n(f)-R(f)\) 具有次高斯增量：

    \[

    \|X_f-X_g\|_{\psi_2}\lesssim \frac{1}{\sqrt{n}}\|f-g\|_\infty

    \]

    对所有 \(f,g\in\mathcal{F}\) 成立。使用 Dudley 不等式推出

    \[

    \mathbb{E}\sup_{f\in\mathcal{F}}|R_n(f)-R(f)|\lesssim\frac{1}{\sqrt{n}}

    \]

    （参见定理 8.2.3 的证明）。然后仿照定理 8.4.5 的证明进行论证。


    8.32 在一个被 \(\mathcal{F}\) Shatter 的集合 \(\Omega_0\subset\Omega\) 上取均匀分布，其大小为 \(\operatorname{vc}(\mathcal{F})\)。样本只在
    \(\Omega_0\) 的一半上看到目标函数 \(T\)，但 \(T\) 在其余部分上可以任意——因此无法可靠地学习它。


    8.34 (a) 令 \(T_0=\{0\}\)。对每个 \(k\in\mathbb{N}\)，令 \(T_k\) 包含 \(0\) 以及 \(T\) 中最大的
    \(2^{2^k}-1\) 个元素。


    8.35 写出

    \[

    |X_t-X_{t_0}|\le |X_t-X_{\pi_\kappa(t)}|+|X_{\pi_\kappa(t)}-X_{t_0}|

    \]

    并分别以概率 \(1-\exp(-u^2)\) 界住这两项。第一项可以通过链式论证

    \[

    \pi_\kappa(t)\to\pi_{\kappa+1}(t)\to\pi_{\kappa+2}(t)\to\cdots\to t

    \]

    用 \(C\gamma_2(T,d)\) 来界（根据 \(\kappa\) 的选择，这些更精细步骤中的失败概率远小于 \(\exp(-u^2)\)）。第二项对应于链式论证中的第一次大跳跃，可以通过对
    \(T_k\) 取并集界，用 \(Cu\operatorname{diam}(T)\) 来界。


    8.36 仿照定理 8.2.3 的证明，验证过程

    \[

    Z_f=\frac{1}{\sqrt{n}}\sum_{i=1}^n f(X_i)-\sqrt{n}\,\mathbb{E}f(X)

    \]

    具有次高斯增量：

    \[

    \|Z_f-Z_g\|_{\psi_2}\lesssim d(f,g).

    \]

    然后应用泛型链式界（定理 8.5.2）。


    8.37 (a) 使用注记 8.5.3 和控制测度定理，得到用高斯宽度 \(w(T\cup\{0\})\) 表示的界，然后利用练习 7.20 过渡到高斯复杂度。


    (b) 使用注记 8.5.4 和练习 7.20。


    8.38 使用对偶性 (1.6) 和 Talagrand 比较不等式（注记 8.5.9）。


    8.39 (a) 更紧密地跟进定理 7.3.1 的证明，而不是应用三角不等式。使用 Sudakov–Fernique 不等式（定理 7.2.8）替代 Talagrand
    比较不等式。


    (b) 注意

    \[

    \mathbb{E}\sup_{x\in T,y\in S}\langle Ax,y\rangle

    \ge \sup_{x\in T}\mathbb{E}\sup_{y\in S}\langle Ax,y\rangle.

    \]


    8.40 使用练习 8.37(b) 的结果。


    8.41 使用 Chevet 不等式。练习 1.17(a) 和练习 7.17 应有助于计算半径和高斯宽度。


    9.2 使用范数集中性（定理 3.1.1）来界 \(\mathbb{E}\|Ax\|_2\) 与 \(\sqrt{m}\|x\|_2\) 之间的差。使用引理
    7.5.11(b) 证明该差可以被主误差吸收。


    9.3 使用恒等式 \(a^2-b^2=(a-b)(a+b)\)。


    9.4 化归到各向同性情形：将 \(B_i=\Sigma^{1/2}A_i\) 写成某个各向同性 \(A_i\)，并将定理 9.1.1 应用于 \(\Sigma^{1/2}T\)。


    9.5 为了理解该结果为何推广定理 9.1.1，将 \(\|Ax\|_2\) 表示为

    \[

    \left(\sum_{i=1}^m\langle A_i,x\rangle^2\right)^{1/2},

    \]

    其中 \(A_i\) 是矩阵 \(A\) 的行，并考虑 \(\mathbb{R}^n\) 上的线性函数类。为了证明该推广，仿照定理 9.1.1 的证明进行。


