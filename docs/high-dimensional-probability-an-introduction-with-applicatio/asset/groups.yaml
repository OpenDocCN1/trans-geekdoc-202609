  - '[PAGE 283]


    A quick dimension count shows that we can recover $x$ from $y = Ax$ if $A$ is
    in general position and we have enough observations: $m \ge 2\|x\|_0$ (try Exercise
    9.22). Sounds great – we can recover a sparse vector from only a few observations!
    The catch? It is computationally hard unless we already know the support of $x$.
    Without that, searching over all possible supports is too expensive – there are
    $\binom{n}{s} \ge 2^s$ subsets to check. Fortunately, random observations can
    help. Here is how.


    Let’s try to use the tools from Section 9.4.1. If we believe $x$ is $s$-sparse,
    it is tempting to pick as our prior


    $$T = \{x \in \mathbb{R}^n : \|x\|_0 \le s\},$$


    but $T$ is highly non-convex, so solving (9.18) would be computationally hard.


    Here is a simple fix: replace the “$\ell^0$ norm” by the $\ell^1$ norm – the closest
    $\ell^p$ that is actually a norm (see Exercise 9.23). Since $s$-sparse vectors
    with $\|x\|_2 \le 1$ satisfy $\|x\|_1 \le \sqrt{s}$ (check!), it makes sense to
    pick the convex set


    $$T'' := \sqrt{s}\,B_1^n \tag{9.22}$$


    as our prior. The recovery program (9.18) becomes


    $$\text{find } x'' : y = Ax'', \quad \|x''\|_1 \le \sqrt{s}, \tag{9.23}$$


    which is convex and computationally tractable. And Theorem 9.4.4 gives:


    # **Corollary 9.4.8 (Sparse recovery).**


    Suppose the rows $A_i$ of $A$ are independent, isotropic and subgaussian random
    vectors. Assume an unknown $s$-sparse vector $x \in \mathbb{R}^n$ satisfies $\|x\|_2
