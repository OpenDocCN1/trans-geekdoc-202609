    ## 8.3 VC 维


    现在我们引入 VC（Vapnik–Chervonenkis）维的概念，它在统计学习理论中扮演重要角色。我们将把它与覆盖数联系起来，再通过 Dudley 不等式与随机过程及一致大数定律联系起来。对统计学习理论的应用将在下一节给出。


    ### 8.3.1 定义与例子


    VC 维度量一个布尔函数类的复杂度。这里，布尔函数是某个集合 \(\Omega\) 上的映射 \(f : \Omega \to \{0,1\}\)，我们考虑这些函数组成的某个集合
    \(\mathcal{F}\)。


    **定义 8.3.1**（VC 维）。若对于任意可能的二元标记 \(g : \Lambda \to \{0,1\}\)，都存在某个函数 \(f \in \mathcal{F}\)
    在 \(\Lambda\) 上与它匹配²，则称子集 \(\Lambda \subseteq \Omega\) 被布尔函数类 \(\mathcal{F}\)
    *打散*。\(\mathcal{F}\) 的 *VC 维*，记作 \(\mathrm{vc}(\mathcal{F})\)，是被打散的 \(\Lambda
    \subseteq \Omega\) 的最大基数。（若不存在最大基数，则称 \(\mathrm{vc}(\mathcal{F}) = \infty\)。）


    VC 维的概念可能需要一些时间才能消化，因此我们来看几个例子，把它弄清楚。


    **例 8.3.2**（区间）。令 \(\mathcal{F}\) 由 \(\mathbb{R}\) 中所有闭区间的指示函数组成：


    $$\mathcal{F} := \{\mathbf{1}_{[a,b]} : a,b \in \mathbb{R},\ a \le b\}.$$


    我们断言


    $$\mathrm{vc}(\mathcal{F}) = 2.$$


    为了证明 \(\mathrm{vc}(\mathcal{F}) \ge 2\)，我们需要找到一个被 \(\mathcal{F}\) 打散的包含两个点的集合
    \(\Lambda \subseteq \mathbb{R}\)。例如取 \(\Lambda = \{3,5\}\)。这个集合上有四种可能的二元标记 \(g
    : \Lambda \to \{0,1\}\)，每一种都可以通过把某个区间指示函数 \(f = \mathbf{1}_{[a,b]}\) 限制到 \(\Lambda\)
    上得到。例如，\(g(3) = 1,\ g(5) = 0\) 来自 \(f = \mathbf{1}_{[2,4]}\)。其余三种情况类似（见图 8.5），所以
    \(\Lambda\) 确实被 \(\mathcal{F}\) 打散。


    ![](img/b122213aed28c1888de83a894123323e_237_0.png)


    **图 8.5** 二元函数 \(g(3) = g(5) = 0\) 是 \(\mathbf{1}_{[6,7]}\) 在 \(\Lambda = \{3,5\}\)
    上的限制（左）。函数 \(g(3) = 0,\ g(5) = 1\) 是 \(\mathbf{1}_{[4,6]}\) 在 \(\Lambda\) 上的限制（中左）。函数
    \(g(3) = 1,\ g(5) = 0\) 是 \(\mathbf{1}_{[2,4]}\) 在 \(\Lambda\) 上的限制（中右）。函数 \(g(3)
    = g(5) = 1\) 是 \(\mathbf{1}_{[2,6]}\) 在 \(\Lambda\) 上的限制（右）。


    为了证明 \(\mathrm{vc}(\mathcal{F}) < 3\)，我们需要证明任何包含三个点的集合 \(\Lambda = \{p,q,r\}\)
    都不能被 \(\mathcal{F}\) 打散。为此，假设 \(p < q < r\)，并考虑标记 \(g(p) = 1,\ g(q) = 0,\ g(r)
    = 1\)。那么 \(g\) 不可能是任何指示函数 \(\mathbf{1}_{[a,b]}\) 在 \(\Lambda\) 上的限制，否则 \([a,b]\)
    必须包含 \(p\) 和 \(r\) 这两个点，却不能包含位于它们之间的点 \(q\)，这是不可能的。


    ² 形式化地说，这意味着 \(f\) 在 \(\Lambda\) 上的限制是 \(g\)，即对所有 \(x \in \Lambda\) 都有 \(f(x)
    = g(x)\)。


    **例 8.3.3**（半平面）。令 \(\mathcal{F}\) 由 \(\mathbb{R}^2\) 中所有闭半平面的指示函数组成。我们断言


    $$\operatorname{vc}(\mathcal{F}) = 3.$$


    为了证明 \(\operatorname{vc}(\mathcal{F}) \ge 3\)，我们需要找到一个被 \(\mathcal{F}\) 打散的包含三个点的集合
    \(\Lambda \subset \mathbb{R}^2\)。令 \(\Lambda\) 由如图 8.6 所示处于一般位置的三个点组成。\(2^3=8\)
    个二元标记 \(g:\Lambda\to\{0,1\}\) 中的每一个都是某个半平面指示函数在 \(\Lambda\) 上的限制。要看出这一点，只需让半平面恰好包含
