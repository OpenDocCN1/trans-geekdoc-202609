    concentration (Theorem 5.2.3). Think of \(A\) as a long random vector in \(\mathbb{R}^{m\times
    n}\) by concatenating the rows. This makes \(A\) a standard normal random vector:
    \(A\sim N(0,I_{nm})\). Consider the function


    $$

    f(A):=\|A\|

    $$


    that maps the vectorized matrix to the matrix''s operator norm. Since the operator
    norm is bounded by Frobenius norm, and the Frobenius norm is just the Euclidean
    norm on \(\mathbb{R}^{m\times n}\), \(f\) is a Lipschitz function on \(\mathbb{R}^{m\times
    n}\) with Lipschitz norm bounded by 1. (Why?) Then Theorem 5.2.3 yields


    $$

    \mathbb{P}\{\|A\|\geq\mathbb{E}\|A\|+t\}\leq 2\exp(-ct^2).

    $$


    The bound on \(\mathbb{E}\|A\|\) from Theorem 7.3.1 completes the proof.


    Now try Exercise 7.11 to prove that a *symmetric Gaussian matrix* satisfies


    $$

    \mathbb{E}\|A\|\leq 2\sqrt n,

    $$


    and Exercise 7.13 to show that the *smallest singular value* of an \(m\times n\)
    Gaussian matrix \(A\) satisfies


    $$

    \mathbb{E}\,s_n(A)\geq\sqrt m-\sqrt n.

    $$

