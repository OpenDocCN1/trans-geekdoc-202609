    p, p′ ∈ (1,∞), set yi := |xi|p/p′ for all i.


    2.1 To prove the upper bound, take square root on both sides of the inequality
    Yn ≥ E Yn and apply Markov inequality. To prove the lower bound, consider the
    event where all Xi ≥ 1/2.


    2.3 (b) Using the formula from part (a), express the Gaussian tail as −1/√(2π)
    ∫t∞ f′(x)/x dx and integrate by parts with u = 1/x and v = f(x). Repeat.


    2.4 (b) Integrate by parts and then use Proposition 2.1.2.


    2.5 Compare Taylor expansions of both sides term by term.


    2.7 Use the exponential moment method to bound the probability P{∑i=1N (−Xi/ε)
    ≥ −N}.


