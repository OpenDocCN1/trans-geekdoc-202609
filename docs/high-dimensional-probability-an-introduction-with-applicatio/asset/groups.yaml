    Finally, we can upgrade this to a matrix inequality using Proposition 5.4.4(d).
    If $\|X\| \le K$ and $|\lambda| < 3/K$, then

    \[

    e^{\lambda X} \preceq I + \lambda X + g(\lambda)X^2.

    \]

    Take expectation of both sides and use the assumption that $\mathbb{E}X = 0$ to
    get

    \[

    \mathbb{E}e^{\lambda X} \preceq I + g(\lambda)\mathbb{E}X^2.

    \]

    To complete the proof of the lemma, let us use the inequality $1+z \le e^z$ that
    holds for all scalars $z$. Thus, using again Proposition 5.4.4(d), we see that
    $I+Z \preceq e^Z$ holds for all matrices $Z$, and in particular for $Z = g(\lambda)\mathbb{E}X^2$.


    $\square$


