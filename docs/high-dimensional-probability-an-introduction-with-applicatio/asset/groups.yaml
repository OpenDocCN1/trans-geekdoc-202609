    (Theorem 8.3.15) for the function class F consisting of the indicators of the
    strips {x:|⟨x,u⟩|≥ε}, where u∈S^{n-1}. Note that |⟨Xi,u⟩|≥ε implies ⟨Xi,u⟩^2≥ε.
    (b) Consider a random vector X that with probability δ equals some appropriately
    chosen multiple of the first basis vector e1, and with probability 1−δ takes values
    in the subspace orthogonal to e1.


