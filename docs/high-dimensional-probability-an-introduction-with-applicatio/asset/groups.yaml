    Replace $x$ with the random variable $X$ and take the expectation on both sides.
    This gives


    $$\mathbb{E}X=\mathbb{E}\int_0^\infty \mathbf{1}_{\{t<X\}}\,dt=\int_0^\infty \mathbb{E}\mathbf{1}_{\{t<X\}}\,dt=\int_0^\infty
    \mathbb{P}\{t<X\}\,dt.$$


    To change the order of expectation and integration in the second equality, we
    used Fubini–Tonelli theorem. The proof is complete. □


    Conversely, Markov inequality bounds the tails in terms of expectation:


    **Proposition 1.6.2** (Markov inequality). *For any nonnegative random variable
    $X$ and $t>0$, we have*


    $$\mathbb{P}\{X\ge t\}\le \frac{\mathbb{E}X}{t}.$$


    *Proof*  Fix $t>0$. We can represent any real number $x$ via the identity


    $$x=x\mathbf{1}_{\{x\ge t\}}+x\mathbf{1}_{\{x<t\}}.$$


    Replace $x$ with the random variable $X$ and take expectation:


    $$\mathbb{E}X=\mathbb{E}X\mathbf{1}_{\{X\ge t\}}+\mathbb{E}X\mathbf{1}_{\{X<t\}}\ge
    t\mathbb{1}_{\{X\ge t\}}+0=t\cdot\mathbb{P}\{X\ge t\}.$$


    Divide both sides by $t$ to complete the proof. □


    Markov’s inequality gives the best possible tail bound if all we know is $\mathbb{E}X$.
    But if we also know the variance, we get a better bound that decays quadratically
    in $t$ – and learn how tightly $X$ concentrates around its mean:


    **Corollary 1.6.3** (Chebyshev inequality). *Let $X$ be a random variable with
    mean $\mu$ and variance $\sigma^2$. Then, for any $t>0$, we have*


    $$\mathbb{P}\{|X-\mu|\ge t\}\le \frac{\sigma^2}{t^2}.$$


    *Proof*  Square both sides of the bound $|X-\mu|\ge t$ and apply Markov inequality
    for the random variable $(X-\mu)^2$. □


    ## 1.7 Limit theorems


    The study of *sums of independent random variables* lies at the heart of classical
    probability theory. Let $X_1,\ldots,X_N$ be independent and identically distributed
    (i.i.d.) random variables with mean $\mu$ and variance $\sigma^2$. Then the formula
    for the variance of a sum (1.8) gives


    $$\operatorname{Var}\left(\frac{1}{N}\sum_{i=1}^{N}X_i\right)=\frac{\sigma^2}{N}.
    \tag{1.23}$$


    ## 2 Concentration of Sums of Independent Random Variables


    In this chapter, we step into the vast world of concentration inequalities. We
    start with some motivation in Section 2.1, then move on to key results — Hoeffding
    inequality (Sections 2.2 and 2.7), Chernoff inequality (Section 2.3), Bernstein
    inequality (Section 2.9) and Khintchine inequality (Section 2.7).


    We also introduce two important classes of distributions: subgaussian (Section
    2.6) and subexponential (Section 2.8). They are “natural habitats” for many results
    in high-dimensional probability and its applications.


    We give two applications of concentration inequalities: for robust mean estimation
    in Section 2.4, and for random graphs in Section 2.5. More applications appear
    later in the book.


    Be sure to try the exercises at the end of this chapter! They offer a guided tour
    of many more concepts, methods, results, and applications: the Mills ratio (Exercise
    2.3), small ball probabilities (Exercise 2.7), a version of Le Cam’s two-point
    method (Exercise 2.17), the expander mixing lemma for random graphs (Exercise
    2.20), stochastic dominance (Exercises 2.27 and 2.28), Orlicz norms (Exercise
    2.42), Bennett inequality (Exercise 2.48), and more.


    ### 2.1 Why concentration inequalities?


    Concentration inequalities measure the deviation of a random variable $X$ from
    its mean $\mathbb{E}X=\mu$. They typically provide two-sided bounds on the tails
    of $X-\mu$ such as:


    $\mathbb{P}\{|X-\mu|>t\}\leq$ something small.


    The simplest concentration inequality is Chebyshev inequality (Corollary 1.6.3).
    It is very general but often too weak. Let us illustrate this with the example
    of the binomial distribution.


    **Question 2.1.1.** *Toss a fair coin $N$ times. What is the probability that
    we get at least $\frac{3}{4}N$ heads?*

