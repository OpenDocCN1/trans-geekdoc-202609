    h,v\rangle\\

    &=\mathbb{E}\|g\|_2+\mathbb{E}\|h\|_2\\

    &\leq\left(\mathbb{E}\|g\|_2^2\right)^{1/2}+\left(\mathbb{E}\|h\|_2^2\right)^{1/2}\quad\text{（回忆练习1.11）}\\

    &=\sqrt n+\sqrt m\quad\text{（见命题3.2.1(b)）。}

    \end{aligned}

    $$


