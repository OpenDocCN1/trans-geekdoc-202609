    of the first coordinate of X. Make a plot and note that the density at x is proportional
    to the arclength that projects onto the interval [x, x+ε]. Check that this is
    proportional to g(x) = ε/√1 − x² + o(ε). Now try n = 3 and then a general n.

    3.28 (b) You should be able to express the squared distance to the cube as ∑_{i=1}^n
    (|g_i| − a)_+², where x_+ = max(x,0). Show that the expected distance is small
    if a is large enough. On the other hand, ‖g‖₂ is unlikely to be very small due
