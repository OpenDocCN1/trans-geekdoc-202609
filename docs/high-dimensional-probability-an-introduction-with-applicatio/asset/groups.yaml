    \ [242] 并开创了研究最佳可能依赖 \\(m(n)\\) 的研究。定理 9.7.2 由 V. Milman [242] 给出；它是最佳的 [247]；参见\
    \ [21, Theorem 5.3.3]。教程 [23] 包含对 Dvoretzky–Milman 定理的轻松介绍。关于 Dvoretzky–Milman\
    \ 定理及其众多推论的完整阐述，参见例如 [21, Chapter 5 and Section 9.2]、[210, Section 9.1] 及其参考文献。Dvoretzky–Milman\
    \ 定理的“分布”版本，即询问 \\(n\\) 维分布的随机 \\(m\\) 维边际是否近似正态，已由 B. Klartag [186] 对对数凹分布（凸体的中心极限定理）以及\
