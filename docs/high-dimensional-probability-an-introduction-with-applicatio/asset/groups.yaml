    sqrt{n}-t\\} \\le 2\\exp(-ct^2) \\quad\\text{for any } t \\ge 0.$$\n\n- **7.14\
    \ (Sudakov inequality for non-compact sets)** Show that if $(T,d)$ is not relatively\
