    通过采用首次大步跃迁的链式方法，证明注 8.5.4 中的结论：


    \[

    t_0 \to \pi_\kappa(t) \to \pi_{\kappa+1}(t) \to \pi_{\kappa+2}(t) \to \cdots \to
    t

    \]


    其中 \(\kappa\) 的选取满足


    \[

    u \asymp 2^{\kappa/2}.

    \]


