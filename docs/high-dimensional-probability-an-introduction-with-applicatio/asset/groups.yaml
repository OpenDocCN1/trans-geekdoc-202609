  - '[PAGE 11]


    To bound the cardinality of $\mathcal{N}$, note that there are $N^k$ ways to choose
    $k$ out of $N$ vertices with repetition. Thus $|\mathcal{N}| \le N^k$. The proof
    is complete. □


    Covering techniques are helpful in several settings. We relate covering to packing
    in Section 4.2, to entropy and coding in Section 4.3, and to random processes
    in Chapters 7–8. But for now, let us show how to use covering to study volume.


    You may remember the formula for the volume of some special shapes like a parallelopiped
    or a prism. But computing the volume of a general polyhedron is not easy, especially
    in high dimensions. Nevertheless, we have a simple bound:


    **Theorem 0.0.4** (Volume of a polytope). *Let $P$ be a polytope with $N$ vertices,
    which is contained in the unit Euclidean ball of $\mathbb{R}^n$, denoted by $B$.
    Then*


    $$\frac{\operatorname{Vol}(P)}{\operatorname{Vol}(B)} \le \left(3\sqrt{\frac{\log
    N}{n}}\right)^n. \tag{0.2}$$


    *Proof* Corollary 0.0.3 says that the polytope $P$ can be covered by at most $N^k$
    balls of radius $1/\sqrt{k}$. The volume of each ball is $(1/\sqrt{k})^n\operatorname{Vol}(B)$.
    (This is because of the particular way the volume scales in dimension $n$: increasing
    the radius of the ball by a factor of $r$ increases the volume by a factor of
    $r^n$.) The volume of $P$ is bounded by the total volume of the balls that cover
    $P$, thus


    $$\operatorname{Vol}(P) \le N^k(1/\sqrt{k})^n\operatorname{Vol}(B),$$


    and rearranging the terms gives


    $$\frac{\operatorname{Vol}(P)}{\operatorname{Vol}(B)} \le \frac{N^k}{k^{n/2}}.
    \tag{0.3}$$


    This bound is true for every $k \in \mathbb{N}$. So let us find the optimal $k$,
    the one that minimizes the right hand side. To do this, we take the logarithm,
    differentiate, and set the derivative to zero. This produces the optimal value


    $$k_0 = \frac{n}{2\log N}. \tag{0.4}$$


    (Check!) Substitute $k=k_0$ into (0.3), simplify the expression, and get


    $$\frac{\operatorname{Vol}(P)}{\operatorname{Vol}(B)} \le \left(\sqrt{\frac{2e\log
    N}{n}}\right)^n.$$


    This bound is even better than we claimed. But there is a slight inaccuracy in
    our proof. Can you spot it without reading further?


    The value of $k$ needs to be integer, and there is no guarantee that the optimal
    value (0.4) is integer. To fix this inaccuracy, we can take $k=\lceil k_0\rceil$.
    Substitute this $k$ into (0.3), use that $k_0 \le k \le k_0+1$ and get the corrected
    bound


    $$\frac{\operatorname{Vol}(P)}{\operatorname{Vol}(B)} \le \frac{N^{k_0+1}}{k_0^{n/2}}
    \le N\left(\sqrt{\frac{2e\log N}{n}}\right)^n.$$


    If $N \le e^{n/9}$ then the right hand side is bounded by $\left(3\sqrt{\log(N)/n}\right)^n$,
    and the proof'
