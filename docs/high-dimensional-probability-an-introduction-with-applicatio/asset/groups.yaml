    \n### 例 9.7.4（立方体的近似圆投影）。\n\n考虑立方体 \\(T = [-1,1]^n\\)。由 (7.18)，\\(w(T) = \\sqrt{2/\\\
    pi}\\, n\\) 且 \\(\\mathrm{diam}(T) = 2\\sqrt{n}\\)，所以有效维数为 \\(d(T) \\asymp n\\\
    )。因此，若 \\(m \\le c n\\)，则以高概率有\n\n\\[\n0.99 B \\subset A[-1,1]^n \\subset 1.01\
    \ B\n\\]\n\n其中 \\(B\\) 为半径为 \\(\\sqrt{2/\\pi}\\, n\\) 的欧几里得球。\n\n> 将 \\(n\\) 维立方体投影到维数为\
    \ \\(m = c n\\) 的子空间上，使其看起来几乎像一个圆球！图 9.9 说明了这一显著事实。\n\n### 备注 9.7.5（随机投影的总结）。\n\
    \n在第 7.6 节和 9.2.2 节中，我们发现集合 \\(T\\) 到 \\(\\mathbb{R}^n\\) 中 \\(m\\) 维子空间的随机投影\
    \ \\(P\\) 经历相变。在高维情形（\\(m \\gtrsim d(T)\\)）下，投影将 \\(T\\) 的直径缩小了数量级为 \\(\\sqrt{m/n}\\\
    ) 的因子：\n\n\\[\n\\mathrm{diam}(PT) \\asymp \\sqrt{\\frac{m}{n}}\\,\\mathrm{diam}(T)\n\
    \\]\n\n此外，加性 Johnson–Lindenstrauss 引理 9.2.4 显示，在此情形下，随机投影 \\(P\\) 近似保持 \\(T\\\
    ) 的几何结构（\\(T\\) 中所有点之间的距离大致按相同的缩放因子缩小）。\n\n在低维情形（\\(m \\lesssim d(T)\\)）下，缩小停止：\n\
    \n\\[\n\\mathrm{diam}(PT) \\asymp w_s(T) \\asymp \\frac{w(T)}{\\sqrt{n}}\n\\]\n\
    \n无论 \\(m\\) 多小。Dvoretzky–Milman 定理解释了原因：\\(PT\\) 现在近似为半径数量级为 \\(w_s(T)\\) 的圆球（见练习\
    \ 9.43），它显然在任何投影下都不会缩小。\n\n练习一下，得到 Dvoretzky–Milman 定理的高概率版本（练习 9.41），证明高斯云在低维中近乎圆形（练习\
    \ 9.42），并得到适用于实际（而非高斯）投影的 Dvoretzky–Milman 定理版本（练习 9.43）。\n\n## 注释\n\n压缩感知是在 [319]\
    \ 中引入的。书籍 [157, 67, 344] 对稀疏性约束下的统计问题提供了全面的介绍；这些书籍讨论了 Lasso 及其众多变体。\n\n基于零空间性质的稀疏恢复（练习\
