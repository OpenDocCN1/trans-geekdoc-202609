    ## 8.3.2 Pajor 引理


    假设定义域 \(\Omega\) 是有限的，由 \(n\) 个点组成。那么 \(\Omega\) 上的任何布尔函数类 \(\mathcal{F}\) 也是有限的，并且

    \[

    2^{\operatorname{VC}(\mathcal{F})} \le |\mathcal{F}| \le 2^n. \tag{8.27}

    \]

    （为什么？）上界通常是松散的——大多数函数类的大小更接近下界。这并不那么显然。为了给这一结果做准备，我们首先证明被 \(\mathcal{F}\) 打散的
    \(\Omega\) 的子集与 \(\mathcal{F}\) 中的函数一样多。


    **引理 8.3.7**（Pajor 引理）。*设 \(\mathcal{F}\) 是有限集 \(\Omega\) 上的布尔函数类。则*

    \[

    |\mathcal{F}| \le \left|\{\Lambda\subseteq\Omega : \Lambda \text{ 被 } \mathcal{F}
    \text{ 打散}}\right|.

    \]

    *我们在右边的计数中包含空集 \(\Lambda=\emptyset\)。*


    在证明之前，让我们用例 8.3.4 来说明这个结果。这里，\(|\mathcal{F}|=4\)，并且有六个子集 \(\Lambda\) 被 \(\mathcal{F}\)
    打散，即 \(\{1\},\{2\},\{3\},\{1,2\},\{1,3\}\) 和 \(\{2,3\}\)。（请检查！）因此 Pajor 引理中的不等式为
    \(4\le6\)。


    *引理 8.3.7 的证明。* 我们对 \(\Omega\) 的基数进行归纳。\(|\Omega|=1\) 的情形是平凡的，因为我们在计数中包含了空集。假设引理对任意
    \(n\) 点集 \(\Omega\) 成立，我们来证明对 \(|\Omega|=n+1\) 的 \(\Omega\) 成立。从集合 \(\Omega\)
    中切掉一个（任意的）点，我们可以将其表示为

    \[

    \Omega=\Omega_0\cup\{x_0\}, \quad \text{其中 } |\Omega_0|=n.

    \]

    类 \(\mathcal{F}\) 于是自然分成两个子类

    \[

    \mathcal{F}_0:=\{f\in\mathcal{F}: f(x_0)=0\} \quad\text{和}\quad \mathcal{F}_1:=\{f\in\mathcal{F}:
    f(x_0)=1\}.

    \]

    由归纳假设，计数函数

    \[

    S(\mathcal{F}) = \left|\{\Lambda\subseteq\Omega : \Lambda \text{ 被 } \mathcal{F}
    \text{ 打散}}\right|

    \]

    满足

    \[

    S(\mathcal{F}_0)\ge|\mathcal{F}_0| \quad\text{且}\quad S(\mathcal{F}_1)\ge|\mathcal{F}_1|.
    \tag{8.28}

    \]

    此处，为了正确使用归纳假设，我们将 \(\mathcal{F}_0\) 和 \(\mathcal{F}_1\) 中的函数限制到 \(n\) 点集 \(\Omega_0\)
    上。


    为了完成证明，我们只需检验

    \[

    S(\mathcal{F}) \ge S(\mathcal{F}_0)+S(\mathcal{F}_1), \tag{8.29}

    \]

    因为这样 (8.28) 将给出 \(S(\mathcal{F})\ge|\mathcal{F}_0|+|\mathcal{F}_1|=|\mathcal{F}|\)，这正是所需的。


    不等式 (8.29) 可能看起来是平凡的。任何被 \(\mathcal{F}_0\) 或 \(\mathcal{F}_1\) 打散的集合 \(\Lambda\)
    都会自动被更大的类 \(\mathcal{F}\) 打散，因此被 \(S(\mathcal{F}_0)\) 或 \(S(\mathcal{F}_1)\) 计数的每个集合
    \(\Lambda\) 也自动被 \(S(\mathcal{F})\) 计数。然而，问题在于重复计数。假设同一个集合 \(\Lambda\) 同时被 \(\mathcal{F}_0\)
    和 \(\mathcal{F}_1\) 打散。计数函数 \(S(\mathcal{F})\) 不会将 \(\Lambda\) 计数两次。但是，\(S(\mathcal{F})\)
    会计数一个不同的集合，这个集合既没有被 \(S(\mathcal{F}_0)\) 计数，也没有被 \(S(\mathcal{F}_1)\) 计数——即 \(\Lambda\cup\{x_0\}\)。稍加思考就会发现，这个集合确实被
    \(\mathcal{F}\) 打散。（请检查！）这建立了不等式 (8.29)，并完成了 Pajor 引理的证明。


    让我们来说明 Pajor 引理证明中的关键点：


    **例 8.3.8。** 让我们再次回到例 8.3.4。按照 Pajor 引理的证明，我们从 \(\Omega=\{1,2,3\}\) 中切掉 \(x_0=3\)，得到
    \(\Omega_0=\{1,2\}\)。类 \(\mathcal{F}=\{001,010,100,111\}\) 于是分成两个子类

    \[

    \mathcal{F}_0=\{010,100\} \quad\text{和}\quad \mathcal{F}_1=\{001,111\}.

    \]

    被 \(\mathcal{F}_0\) 打散的集合 \(\Lambda\) 恰好有两个，即 \(\{1\}\) 和 \(\{2\}\)，并且**同样的**集合也被
    \(\mathcal{F}_1\) 打散，使得 \(S(\mathcal{F}_0)=S(\mathcal{F}_1)=2\)。当然，同样的两个集合也被 \(\mathcal{F}\)
    打散，但我们需要两个更多的打散集合来使关键不等式 (8.29) 中的 \(S(\mathcal{F})\ge4\) 成立。下面是我们构造它们的方法：将 \(x_0=3\)
    附加到已经计数的子集 \(\Lambda\) 上。得到的集合 \(\{1,3\}\) 和 \(\{2,3\}\) 也被 \(\mathcal{F}\) 打散，而我们还没有对它们进行计数。现在至少有**四个**被
    \(\mathcal{F}\) 打散的集合，使得关键不等式 (8.29) 成立。


    ## 8.3.3 Sauer–Shelah 引理


    我们现在推出一个关于函数类基数的显著上界，用 VC 维表示：


    **引理 8.3.9（Sauer–Shelah 引理）。** *设 \(\mathcal{F}\) 是 \(n\) 点集 \(\Omega\) 上的布尔函数类。则*

    \[

    |\mathcal{F}| \le \sum_{k=0}^{d} \binom{n}{k} \le \left(\frac{en}{d}\right)^d

    \]

    其中 \(d=\operatorname{VC}(\mathcal{F})\)。


    *证明。* Pajor 引理说明 \(|\mathcal{F}|\) 以被 \(\mathcal{F}\) 打散的 \(\Omega\) 的子集 \(\Lambda\)
    的数目为上界。根据 VC 维的定义，每个这样的集合 \(\Lambda\) 的基数以 \(d=\operatorname{VC}(\mathcal{F})\)
    为上界。因此

    \[

    |\mathcal{F}| \le \left|\{\Lambda\subseteq\Omega: |\Lambda|\le d\}\right| = \sum_{k=0}^{d}
    \binom{n}{k},

    \]

    因为右边的和给出了一个 \(n\) 元集合中基数至多为 \(d\) 的子集的总数。这证明了 Sauer–Shelah 引理的第一个不等式。第二个不等式由我们在练习
    0.6 中证明的二项式和的界得出。


    Pajor 引理和 Sauer–Shelah 引理通常都是紧的（尝试练习 8.19）。


    ## 8.3.4 增长函数


    Sauer–Shelah 引理假设定义域 \(\Omega\) 是有限的。那么像 \(\Omega=\mathbb{R}^n\) 这样的无限定义域上的函数类
    \(\mathcal{F}\) 呢？通常用增长函数来度量 \(\mathcal{F}\) 的复杂度是很方便的：


    **定义 8.3.10**（增长函数）。设 \(\mathcal{F}\) 是定义域 \(\Omega\) 上的布尔函数类。\(\mathcal{F}\)
    的增长函数定义为将 \(\mathcal{F}\) 中所有函数限制到 \(n\) 个元素的子集上所能得到的函数的最大数量：

    \[

    \Pi_{\mathcal{F}}(n) = \sup\left\{\left|\mathcal{F}\right|_{\Lambda} : \Lambda\subseteq\Omega,\
    |\Lambda|=n\right\}.

    \]


