    # 5.2.2 Hamming cube


    The method based on isoperimetry also works for concentration for the Hamming
    cube


    ({0,1}^n, d, ℙ),


    (recall Definition 4.2.14), where d(x,y) is the normalized Hamming distance, measuring
    the fraction of the digits where the binary strings x and y differ:


    d(x,y) = 1/n |{i : x_i ≠ y_i}|.


    The measure ℙ is the uniform probability measure on the cube:


    ℙ(A) = |A| / 2^n   for any A ⊂ {0,1}^n.


    # Theorem 5.2.5 (Concentration on the Hamming cube). Consider a random vector
    X ~ Unif{0,1}^n. (Thus, the coordinates of X are independent Ber(1/2) random variables.)
    Then for any function f : {0,1}^n → ℝ we have


    ‖f(X) − 𝔼 f(X)‖_{ψ₂} ≤ C ‖f‖_{Lip} / √n. (5.6)


    This result follows from the isoperimetric inequality on the Hamming cube, whose
    minimizers are known to be the Hamming balls – neighborhoods of single points
    with respect to the Hamming distance. (Try deducing it!)


    # 5.2.3 Symmetric group


    A similar results holds for the symmetric group S_n, a set of all n! permutations
    of n symbols {1,…,n}. We can view the symmetric group as a metric measure space


    (S_n, d, ℙ).


    Here d(π,ρ) is the normalized Hamming distance – the fraction of the symbols on
    which permutations π and ρ differ:


    d(π,ρ) = 1/n |{i : π(i) ≠ ρ(i)}|.


    The measure ℙ is the uniform probability measure on S_n, i.e.


    ℙ(A) = |A| / n!   for any A ⊂ S_n.


    # Theorem 5.2.6 (Concentration on the symmetric group). Consider a random permutation
    X ~ Unif(S_n) and a function f : S_n → ℝ. Then the concentration inequality (5.6)
    holds.'
