    引理 8.3.7 和 Sauer–Shelah 引理 8.3.9 都是紧的。


    ### 8.20 ☕（VC 二分定理）


    设 \(\mathcal{F}\) 是某个定义域上的布尔函数类。证明增长函数 \(\Pi_{\mathcal{F}}(n)\) 只能呈多项式增长或指数增长，不存在介于两者之间的情形。更严格地说，证明以下结论必有其一：对所有
