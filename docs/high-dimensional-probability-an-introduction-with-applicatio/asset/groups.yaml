    i.e. the maximal number of linearly independent functions in \(\mathcal{F}\).


    ### 8.19 ☕☕ (Sharpness of Pajor and Sauer–Shelah lemmas)


    Show that both Pajor Lemma 8.3.7 and Sauer–Shelah Lemma 8.3.9 are sharp by considering
    the set \(\mathcal{F}\) of binary strings of length \(n\) with at most \(d\) ones
    (this set is often called a Hamming ball).


    ### 8.20 ☕ (VC dichotomy)


    Let \(\mathcal{F}\) be a class of Boolean functions on some domain. Prove that
    the growth function \(\Pi_{\mathcal{F}}(n)\) can only grow either polynomially
    or exponentially, and nothing in between. More rigorously, prove that either \(\Pi_{\mathcal{F}}(n)
    = 2^n\) for all \(n\), or there exists a polynomial \(p(n)\) such that \(\Pi_{\mathcal{F}}(n)
    \le p(n)\) for all \(n\).


    ### 8.21 ☕☕ (VC stability)


    In Proposition 8.3.11, we observed how the VC dimension is stable when we combined
    two function classes by taking pointwise minima or maxima. Let us generalize this
    observation for any number of classes, and for any way of combining them. Let
    \(\mathcal{F}_1,\dots,\mathcal{F}_k\) be classes of Boolean functions on the same
    domain. Fix any function \(\phi : \{0,1\}^k \to \{0,1\}\), which we can think
    of as a Boolean formula. Consider the class


    \[

    \mathcal{F} = \{\phi(f_1,\dots,f_k) : f_1 \in \mathcal{F}_1,\dots,f_k \in \mathcal{F}_k\}.

    \]


    Prove that if \(\operatorname{vc}(\mathcal{F}_i) \le d\) for every \(i\), then


    \[

    \operatorname{vc}(\mathcal{F}) \le C d k \log k

    \]


    where \(C\) is an absolute constant.


    ### 8.22 ☕☕☕☕ (VC dimension of the union)


    (a) Let \(\mathcal{F}\) and \(\mathcal{G}\) be classes of Boolean functions on
    the same domain. Prove that


    \[

    \operatorname{vc}(\mathcal{F} \cup \mathcal{G}) \le \operatorname{vc}(\mathcal{F})
    + \operatorname{vc}(\mathcal{G}) + 1.

    \]


    ### 8.32 ☕☕☕ (No learning with infinite VC dimension)


    Theorem 8.4.5 hints that to learn well, we need at least as many training points
    \(n\) as the VC dimension of the hypothesis class. Show that if


    \[

    n < \frac{1}{2}\operatorname{vc}(\mathcal{F}),

    \]


    then there exists a distribution on \(\Omega\) where no algorithm can reliably
    learn the target function in \(\mathcal{F}\). (Make this precise!)


    ### 8.33 ☕☕☕ (γ₂ functional is at least as good as Dudley)


    Show that the \(\gamma_2\) functional is bounded by the Dudley integral:


    \[

    \gamma_2(T, d) \le C \int_0^\infty \sqrt{\log \mathcal{N}(T, d, \varepsilon)}\,d\varepsilon.

    \]


    ### 8.34 ☕☕☕ (γ₂ functional can outperform Dudley)


    Sometimes the \(\gamma_2\) functional (8.45) can be significantly smaller than
    the Dudley sum in (8.44). To see this, let’s revisit the example in Exercise 8.4:


    \[

    T := \{0\} \cup \left\{ \frac{e_k}{\sqrt{1 + \log k}},\ k = 1, \ldots, n \right\}.

    \]


    (a) Construct an admissible sequence \((T_k)\) to check that the \(\gamma_2\)
    functional of \(T\) (with respect to the Euclidean metric) is bounded:


    \[

    \gamma_2(T, d) = \inf_{(T_k)} \sup_{t\in T} \sum_{k=0}^\infty 2^{k/2} d(t, T_k)
    \le C.

    \]


    (b) Show that the Dudley sum is unbounded:


    \[

    \inf_{(T_k)} \sum_{k=0}^\infty 2^{k/2} \sup_{t\in T} d(t, T_k) \to \infty \quad
    \text{as } n \to \infty.

    \]


    ### 8.35 ☕☕☕☕ (Generic chaining: a high-probability bound)


    Prove the result in Remark 8.5.4 by chaining with the first big leap:


    \[

    t_0 \to \pi_\kappa(t) \to \pi_{\kappa+1}(t) \to \pi_{\kappa+2}(t) \to \cdots \to
    t

    \]


    where \(\kappa\) is chosen so that


    \[

    u \asymp 2^{\kappa/2}.

    \]


    ### 8.36 ☕☕☕ (Empirical processes: a generic chaining bound)


    So far, we have bounded empirical processes for two kinds of function classes:
    Lipschitz (Theorem 8.2.3) and Boolean with finite VC dimension (Theorem 8.3.15).
    Now let’s go general. Take any class \(\mathcal{F}\) of real-valued functions
    on a domain \(\Omega\), and let \(X, X_1, X_2, \ldots, X_n\) be i.i.d. random
    points in \(\Omega\). Let \(d\) be a metric on \(\mathcal{F}\) satisfying


    \[

    \|f(X) - g(X)\|_{\psi_2} \le d(f, g) \quad \text{for all } f, g \in \mathcal{F}.

    \]


    (For instance, \(d(f, g) = C\|f - g\|_{L_\infty}\) works.) Then show:


    \[

    \mathbb{E} \sup_{f\in\mathcal{F}} \left| \frac{1}{n} \sum_{i=1}^n f(X_i) - \mathbb{E}
    f(X) \right|

    \le C \frac{\gamma_2(\mathcal{F}, d)}{\sqrt{n}}.

    \]


    In this case, the inequality in (9.3) becomes


    \[

    \left\| \|Ax\|_2 - \|Ay\|_2 \right\|_{\psi_2}

    \le C K^2 \|x - y\|_2. \tag{9.5}

    \]


    Since the squared \(\ell^2\) norm would be simpler to work with (no square root),
    let’s first prove a version of (9.5) with squared norms. Here’s a good guess for
    what it should look like: with high probability,


    \[

    \|Ax\|_2^2 - \|Ay\|_2^2

    = (\|Ax\|_2 + \|Ay\|_2)\cdot(\|Ax\|_2 - \|Ay\|_2)

    \lesssim \sqrt{m}\,\|x - y\|_2. \tag{9.6}

    \]


    This seems reasonable because \(\|Ax\|_2\) and \(\|Ay\|_2\) are roughly \(\sqrt{m}\)
    by (9.4), and we expect (9.5) to hold.


    Let’s go ahead and prove this. Expand the matrix-vector product:


    \[

    \|Ax\|_2^2 - \|Ay\|_2^2

    = \sum_{i=1}^{m} (\langle A_i, x\rangle^2 - \langle A_i, y\rangle^2)

    = \sum_{i=1}^{m} \langle A_i, x + y\rangle \langle A_i, x - y\rangle,

    \]


    and divide both sides by \(\|x - y\|_2\), getting


    \[

    \Delta := \frac{\|Ax\|_2^2 - \|Ay\|_2^2}{\|x - y\|_2}

    = \sum_{i=1}^{m} \langle A_i, u\rangle \langle A_i, v\rangle, \tag{9.7}

    \]


    where


    \[

    u := x + y \quad \text{and} \quad v := \frac{x - y}{\|x - y\|_2}.

    \]


    Our goal is to show that \(|\Delta| \lesssim \sqrt{m}\) with high probability.


    What do we see in (9.7)? A sum of independent random variables \(\langle A_i,
    u\rangle \langle A_i, v\rangle\). They are mean-zero, because by construction
    we have


    \[

    \langle A_i, u\rangle \langle A_i, v\rangle

    = \frac{\langle A_i, x\rangle^2 - \langle A_i, y\rangle^2}{\|x - y\|_2},

    \]


    and by isotropy,


    \[

    \mathbb{E}[\langle A_i, x\rangle^2 - \langle A_i, y\rangle^2] = 1 - 1 = 0.

    \]


    And they are subexponential: Lemma 2.8.6 and the subgaussian assumption on \(A_i\)
    give


    \[

    \|\langle A_i, u\rangle \langle A_i, v\rangle\|_{\psi_1}

    \le \|\langle A_i, u\rangle\|_{\psi_2} \cdot \|\langle A_i, v\rangle\|_{\psi_2}

    \le K\|u\|_2 \cdot K\|v\|_2

    \le 2K^2

    \]


    where in the last step we used that \(\|u\|_2 \le \|x\|_2 + \|y\|_2 \le 2\) and
    \(\|v\|_2 = 1\). So we can apply Bernstein inequality (Theorem 2.9.1) and get


    \[

    \mathbb{P}\{ |\Delta| \ge t\sqrt{m}\}

    \le 2\exp\!\left[-c\min\left(\frac{t^2}{K^4}, \frac{t\sqrt{m}}{K^2}\right)\right]

    \le 2\exp\!\left(-\frac{c_1 t^2}{K^4}\right) \tag{9.8}

    \]


    for any \(0 \le t \le \sqrt{m}\).


    **Step 3: Unit vectors \(x, y\) and the original process.** Now let’s get rid
    of the squares and prove the original inequality (9.5) for all unit vectors \(x\)
    and \(y\).


    ¹ To get the last inequality in (9.8), recall that \(K\) is bounded below by a
    positive absolute constant (why?) and choose the constant \(c > 0\) small enough.

