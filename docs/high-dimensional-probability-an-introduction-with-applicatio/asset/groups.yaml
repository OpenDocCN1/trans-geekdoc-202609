    **Example 8.3.5** (Half-spaces). A half-space in ℝⁿ is a set of the form


    {x : ⟨a, x⟩ ≤ b} where a ∈ ℝⁿ and b ∈ ℝ.


    Let 𝓕 be the class of indicators of all half-spaces in ℝⁿ. Then


    vc(𝓕) = n + 1.


    **Remark 8.3.6** (VC dimension vs. parameter count). VC dimension of a function
    class often roughly matches the number of parameters — for instance, half-spaces
    in ℝⁿ are defined with n + 1 parameters, which matches their VC dimension (see
    Exercise 8.3.5). This is not a hard rule but rather a useful heuristic.


    # 8.3.2 Pajor Lemma


    Suppose the domain Ω is finite and consists of n points. Then any class of Boolean
    functions 𝓕 on Ω is also finite, and


    2^vc(𝓕) ≤ |𝓕| ≤ 2ⁿ. (8.27)


    (Why?) The upper bound is usually loose — most function classes are closer in
    size to the lower bound. This is not so obvious. To prepare for this result, let’s
    first show that there are as many shattered subsets of Ω as the functions in 𝓕.


    **Lemma 8.3.7** (Pajor lemma). *Let 𝓕 be a class of Boolean functions on a finite
    set Ω. Then*


    |𝓕| ≤ |{Λ ⊆ Ω : Λ is shattered by 𝓕}|.


    *We include the empty set Λ = ∅ in the count on the right side.*


    Before the proof, let’s illustrate this result using Example 8.3.4. Here, |𝓕|
    = 4 and there are six subsets Λ that are shattered by 𝓕, namely {1}, {2}, {3},
    {1, 2}, {1, 3} and {2, 3}. (Check!) Thus the inequality in Pajor lemma reads 4
    ≤ 6.


    *Proof of Lemma 8.3.7.* We proceed by induction on the cardinality of Ω. The case
    |Ω| = 1 is trivial, since we include the empty set in the counting. Assume the
    lemma holds for any n-point set Ω, and let us prove it for Ω with |Ω| = n + 1.
    Chopping out one (arbitrary) point from the set Ω, we can express it as


    Ω = Ω₀ ∪ {x₀}, where |Ω₀| = n.


    The class 𝓕 then naturally breaks into two sub-classes


    𝓕₀ := {f ∈ 𝓕 : f(x₀) = 0} and 𝓕₁ := {f ∈ 𝓕 : f(x₀) = 1}.


    By the induction hypothesis, the counting function


    S(𝓕) = |{Λ ⊆ Ω : Λ is shattered by 𝓕}|


    satisfies³


    S(𝓕₀) ≥ |𝓕₀| and S(𝓕₁) ≥ |𝓕₁|. (8.28)


    ³ To properly use the induction hypothesis here, restrict the functions in 𝓕₀
    and 𝓕₁ onto the n-point set Ω₀.'
