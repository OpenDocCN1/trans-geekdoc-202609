  - '[PAGE 301]


    9.22 ☕☕ (The sparse recovery problem is well posed) Let A be an m × n matrix in
    general position (choose a convenient definition of general position yourself).


    +   (a) Show that if m ≥ 2‖x‖₀, then the equation y = Ax has a unique solution
    (if it exists).

    +   (b) In this case, how can you find x algorithmically efficiently if you know
    the support of x (i.e. which entries are nonzero)?


    9.23 ☕☕☕ (The “ℓᵖ norms” for 0 ≤ p < 1) In (9.21), we defined ‖x‖₀ as the number
    of nonzero entries of the vector x.


    +   (a) Check that ‖·‖₀ is not a norm on ℝⁿ.

    +   (b) Check that ‖·‖ₚ is not a norm on ℝⁿ if 0 < p < 1 (Figure 9.10 shows that
    the unit balls are not convex).

    +   (c) Show that, for every x ∈ ℝⁿ, ‖x‖₀ = limₚ→0₊ ‖x‖ₚᵖ.


    ![](img/b122213aed28c1888de83a894123323e_301_0.png)


    Figure 9.10 The unit ℓᵖ balls for various values of p in ℝ².


    9.24 ☕☕☕ (Approximate sparse recovery) Let’s extend sparse recovery (Corollary
    9.4.8) to accommodate approximately sparse signals.


    +   (a) Show that any s-sparse signal x can be recovered from measurements y =
    Ax by solving the optimization problem minimize ‖x′‖₁ subject to y = Ax′, whose
    solution x̂ gives the recovery error 𝔼‖x̂ − x‖₂ ≤ CK² √(s log n / m) ‖x‖₂.

    +   (b) Argue that a similar result holds for approximately sparse signals. State
    and prove such a guarantee.


    9.25 ☕☕☕ (Convexifying the set of sparse vectors) Consider the set of unit s-sparse
    vectors: Sₙ,ₛ := { x ∈ ℝⁿ : ‖x‖₀ ≤ s, ‖x‖₂ ≤ 1 } (9.46) and the truncated ℓ¹ ball:
    Tₙ,ₛ := √s B₁ⁿ ∩ B₂ⁿ = { x ∈ ℝⁿ : ‖x‖₁ ≤ √s, ‖x‖₂ ≤ 1 }. (9.47)'
