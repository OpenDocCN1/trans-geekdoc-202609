    1.15 (b) Use the integrated tail formula for f(X) and make a change of variable
    t = f(s).


    1.16 Consider the event E = {X > ε E X} and decompose E X into E X 1E and E X
    1Ec.


    1.17 (a) To prove the lower bound for q < ∞, assume first that all coefficients
    of x satisfy |xi| ≤ 1, deduce that |xi|q ≤ |xi|p and sum these inequalities. To
    prove the upper bound for q < ∞, use the Hölder inequality with exponent p/q.


    1.18 Use the result of Exercise 1.17 for q = ∞.


    1.19 (a) Assume first that xi ≥ 0 for all i. In the case where p = 1, p′ = ∞,
