    8.29 Note that (f−h)^2 is obtained from f by flipping the bits f(x) where h(x)=1.


    8.31 Show that the random process Xf=Rn(f)−R(f) has subgaussian increments: ‖Xf−Xg‖ψ2≲1/√n‖f−g‖∞
    for all f,g∈F. Use Dudley inequality to deduce that E sup_{f∈F}|Rn(f)−R(f)|≲1/√n
    (see the proof of Theorem 8.2.3). Then argue like in the proof of Theorem 8.4.5.


