    ## 7.1.1 Covariance and increments


    In Section 3.2, we introduced the notion of the covariance matrix of a random
    vector. We now define the *covariance function* of a random process \((X_t)_{t\in
    T}\) in a similar manner. For simplicity, let us assume in this section that the
    random process has zero mean, i.e.


    \[

    \mathbb{E}X_t=0 \quad \text{for all } t\in T.

    \]


    (The adjustments for the general case will be obvious.) The covariance function
    of the process is defined as


    \[

    \Sigma(t,s):=\operatorname{cov}(X_t,X_s)=\mathbb{E}X_tX_s,\quad t,s\in T.

    \]


    The *increments* of the random process are defined as


    \[

    d(t,s):=\|X_t-X_s\|_{L^2}=\big(\mathbb{E}(X_t-X_s)^2\big)^{1/2},\quad t,s\in T.
    \tag{7.1}

    \]


    **Example 7.1.6.** The increments of the standard Brownian motion satisfy


    \[

    d(t,s)=\sqrt{t-s},\quad t\ge s

    \]


    by definition. The increments of a random walk of Example 7.1.3 with \(\mathbb{E}Z_i^2=1\)
    behave similarly:


    \[

    d(n,m)=\sqrt{n-m},\quad n\ge m.

    \]


    (Check!)


    **Remark 7.1.7 (The canonical metric).** Even if the index \(T\) has no geometric
    structure, the increments \(d(t,s)\) always define a *metric* on \(T\), thus automatically
    turning \(T\) into a *metric space.*¹ However, as we see in Example 7.1.6, this
    metric may not match the Euclidean distance on \(\mathbb{R}^n\).


    **Remark 7.1.8 (Covariance vs. increments).** The covariance and the increments
    contain roughly the same information about the random process. Increments can
    be written using the covariance: just expand the square in (7.1) to see that


    \[

    d(t,s)^2=\Sigma(t,t)-2\Sigma(t,s)+\Sigma(s,s).

    \]


    Vice versa, if the zero random variable \(0\) belongs to the process, you can
    also recover the covariance from the increments (see Exercise 7.1).


    ## 7.1.2 Gaussian processes


    **Definition 7.1.9 (Gaussian process).** A random process \((X_t)_{t\in T}\) is
    called a *Gaussian process* if, for any finite subset \(T_0\subset T\), the random
    vector \((X_t)_{t\in T_0}\) has normal distribution. Equivalently, \((X_t)_{t\in
    T}\) is Gaussian if every finite linear combination \(\sum_{t\in T_0}a_tX_t\)
    is a normal random variable. (To see why these two are equivalent, recall Exercise
    3.16.)


    ¹ More precisely, \(d(t,s)\) is a *pseudometric* on \(T\) since the distance between
    two distinct points can be zero, i.e. \(d(t,s)=0\) does not necessarily imply
    \(t=s\).


    The notion of Gaussian processes generalizes that of Gaussian random vectors in
    \(\mathbb{R}^n\). A classical example of a Gaussian process is the standard Brownian
    motion.


    **Remark 7.1.10 (Distribution is determined by covariance, increments).** The
    distribution of a mean-zero Gaussian random vector in \(\mathbb{R}^n\) is completely
    determined by its covariance matrix (recall Proposition 3.3.5). Then the same
    goes for a mean-zero Gaussian process: its distribution is determined by the covariance
    function \(\Sigma(t,s)\), or equivalently (due to Exercise 7.1) by the increments
    \(d(t,s)\), assuming the zero variable is part of the process.


    Many tools we learned about random vectors can be applied to random processes.
    For example, Gaussian concentration (Theorem 5.2.3) implies:


    **Theorem 7.1.11 (Concentration of Gaussian processes).** Let \((X_t)_{t\in T}\)
    be a Gaussian process with finite \(T\). Then


    \[

    \left\|\sup_{t\in T}X_t-\mathbb{E}\sup_tX_t\right\|_{\psi_2}\le C\sup_{t\in T}\sqrt{\operatorname{Var}(X_t)}.

    \]


    This is just a restatement of Exercise 5.9(b)—if you skipped it then, do it now!


    Let’s look at a broad class of Gaussian processes indexed by high-dimensional
    sets \(T\subset\mathbb{R}^n\). Take a standard normal vector \(g\sim N(0,I_n)\)
    and define


    \[

    X_t:=\langle g,t\rangle,\qquad t\in T. \tag{7.2}

    \]


    This gives us a Gaussian process \((X_t)_{t\in T}\) called *the canonical Gaussian
    process*. The increments match the Euclidean distance:


    \[

    \|X_t-X_s\|_{L^2}=\|t-s\|_2,\qquad t,s\in T.

    \]


    (Check!)


    Actually, one can realize any Gaussian process as the canonical process (7.2).
    This follows from a simple observation about Gaussian vectors:


    **Lemma 7.1.12 (Gaussian random vectors).** Let \(X\) be a mean-zero Gaussian
    random vector in \(\mathbb{R}^n\). Then there exist points \(t_1,\ldots,t_n\in\mathbb{R}^n\)
    such that


    \[

    X\stackrel{dist}{=}(\langle g,t_i\rangle)_{i=1}^n,\qquad\text{where }g\sim N(0,I_n).

    \]


    Here \(\stackrel{dist}{=}\) means the equality of distributions.


    *Proof* If \(\Sigma\) denotes the covariance matrix of \(X\), then, by (3.12),
    we have


    \[

    X\stackrel{d}{=}\Sigma^{1/2}g,\qquad\text{where }g\sim N(0,I_n).

    \]


    The entries of \(\Sigma^{1/2}g\) are \(\langle t_i,g\rangle\), where \(t_i\) are
    the rows of \(\Sigma^{1/2}\). Done! \(\square\)


    It follows that for any Gaussian process \((X_s)_{s\in S}\), all finite-dimensional
    marginals \((X_s)_{s\in S_0}\), \(|S_0|=n\), can be represented as the canonical
    Gaussian process (7.2) indexed in a certain subset \(T_0\subset\mathbb{R}^n\).


    ² We are assuming \(T\) is finite just to avoid measurability issues. But in practice,
    you can usually extend to general \(T\) by approximation. Try it for the canonical
    Gaussian process (7.2)!


    ## 7.2 Slepian, Sudakov-Fernique and Gordon inequalities


    In many applications, it helps to have a *uniform* bound on a random process:


    \[

    \mathbb{E}\sup_{t\in T}X_t=?

    \]


    **Remark 7.2.1 (Making \(T\) finite).** To avoid measurability issues, let’s think
    of \(\mathbb{E}\sup_{t\in T}X_t\) as shorthand for \(\sup_{T_0\subset T}\mathbb{E}\max_{t\in
    T_0}X_t\), where \(T_0\) runs over all finite subsets. The general case usually
    follows by approximation.


    For some processes, this quantity can be computed exactly. For example, if \((X_t)\)
    is a standard Brownian motion, the so-called reflection principle gives


    \[

    \mathbb{E}\sup_{t\le t_0}X_t=\sqrt{\frac{2t_0}{\pi}}\quad\text{for every }t_0\ge0.

    \]


    For general random processes—even Gaussian—the problem is nontrivial.


    The first general bound we prove is the Slepian comparison inequality for Gaussian
    processes. It basically says: the faster the process grows (in terms of the increments),
    the farther it gets.


