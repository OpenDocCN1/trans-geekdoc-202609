  - '[PAGE 312]


    4.37 Assume without loss of generality that μ = 1. Represent ||Ax||₂² − 1 as a
    quadratic form ⟨Rx, x⟩ where R = AᵀA − Iₙ. Use Exercise 4.36 to compute the maximum
    of this quadratic form on a net.


    4.38 Use the ε-net expansion (Exercise 4.34).


    4.39 Fix an ε/2-net ℳ of RB₂ⁿ with good size. It is enough to show that each point
    y ∈ ℳ is within distance ε/2 from some point gᵢ/√n ∈ RB₂ⁿ. For each y ∈ ℳ, fix
    a ball B_y with radius r = ¼ min(ε, R) satisfying y ∈ B_y ⊂ RB₂ⁿ. Find a lower
    bound on the probability that g₁/√n lands in a given ball B_y. Use independence
    to show that at least one of the N vectors gᵢ/√n does so with high probability.
    Finally, apply a union bound over ℳ.


    4.40 Use Exercise 4.39 to show that the scaled random vectors gᵢ/√n, i > 1, form
    an good net of ball of radius 10. Use Exercise 4.38 to show that the convex hull
    of these points contains a ball of radius 5. Meanwhile, with high probability,
    the first vector g₁/√n falls in the radius 5 ball, and thus in the convex hull
    of the other vectors.


    4.41 Use the integrated tail formula (Lemma 1.6.1).


    4.42 Bound the operator norm of A below by the Euclidean norm of the first column
    and first row. Use concentration of the norm (3.2) to complete the proof.


    4.43 The proof of Theorem 4.4.3 only relies on one property of A: that ⟨Ax, y⟩
    = ⟨A, xyᵀ⟩ is subgaussian for any unit vectors x, y.


    4.44 (a) Combine Exercise 4.19(a) with (2.22). (b) Combine Exercise 4.19(b) with
    Exercise 3.13.


    4.45 The challenge is that, if q is small, the second eigenvalue of the expected
    adjacency matrix D = 𝔼A might not be well separated from the first, making it
