    Let us return to bounding the quantity in (5.16). Using Lemma 5.4.10, we obtain

    \[

    E \le \operatorname{tr}\exp\left[\sum_{i=1}^N \log \mathbb{E}e^{\lambda X_i}\right]
    \le \operatorname{tr}\exp[g(\lambda)Z],

    \]

    where

    \[

    Z := \sum_{i=1}^N \mathbb{E}X_i^2.

    \]


    Here we used matrix monotonicity of $\ln x$ (see Remark 5.4.6) to take logarithms
    on both sides, summed up the results, and then used trace monotonicity (Proposition
    5.4.4(b)) to take traces of the exponential on both sides. Since the trace of
    $\exp[g(\lambda)Z]$ is a sum of $n$ positive eigenvalues, it is bounded by $n$
    times the maximum eigenvalue, so

