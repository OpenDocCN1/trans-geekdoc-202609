    # 8.4.1 Risk, fit and complexity


    Given the training data (8.36), we want to find a function f : Ω → ℝ that approximates
    T, so we can later diagnose a new patient X by checking f(X). We aim to minimize
    the *risk* of misdiagnosing a new patient, defined as:


    $$R(f) = \mathbb{E}\,(f(X) - T(X))^2. \tag{8.37}$$


    **Example 8.4.2.** In classification problems where T and f are Boolean functions,
    the risk is simply the probability of misclassification (check this!):


    $$R(f) = \mathbb{P}\{f(X) \ne T(X)\}. \tag{8.38}$$


    How much training data do we need? That depends on the complexity of the problem.
    If we believe the target function T(X) behaves in a complicated way, we need more
    data. Since we usually do not know this up front, we limit our guesses f to some
    class of functions 𝓕, called the *hypothesis class*.


    But how do we pick 𝓕? There is no universal rule, but it should balance fit and
    complexity. If 𝓕 is too simplistic — say, only linear functions — we might *underfit*
    (see Figure 8.10a) and miss real patterns. Too complex, and we might *overfit*,
    just memorizing the training data rather than generalizing from it (Figure 8.10b),
    and we also need way more data. The sweet spot is a hypothesis class that is just
    complex enough to capture the real patterns, without chasing random noise (Figure
    8.10c).


