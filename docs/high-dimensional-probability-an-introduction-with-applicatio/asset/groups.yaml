    $$

    \mathbb{P}\{\|A\|\geq\mathbb{E}\|A\|+t\}\leq 2\exp(-ct^2).

    $$


    由定理7.3.1给出的\(\mathbb{E}\|A\|\)的界完成了证明。


    现在尝试练习7.11来证明一个*对称高斯矩阵*满足


