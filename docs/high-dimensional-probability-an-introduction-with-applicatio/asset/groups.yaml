    **第 4 步：并集界。** 现在通过取并集界来“释放” $z\in\mathcal{N}$：


    $$\mathbb{P}\left\{\max_{z\in\mathcal{N}}\sup_{x\in T-T}\langle Q^{\mathsf T}z,x\rangle\ge
    2w_s(T)+t\right\}\le |\mathcal{N}|\cdot 2\exp(-cnt^2). \tag{7.24}$$


    回顾 $|\mathcal{N}|\le 5^m$。选择 $t=C_s\sqrt{m/n}$，并取常数 $C$ 足够大，则对任意 $s\ge 1$，(7.24)
