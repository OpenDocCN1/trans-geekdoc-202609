    回想基础概率论课程中的内容，随机变量 \(X\) 的*分布*直观上就是关于 \(X\) 以什么概率取什么值的信息。更严格地说，\(X\) 的分布由其*累积分布函数*（CDF）决定，定义为


    $$F_X(t)=\mathbb{P}\{X\leq t\},\qquad t\in\mathbb{R}.$$


