    **证明。** 我们使用指数矩方法，这是在霍夫丁和切尔诺夫不等式的证明（定理 [2.2.1](#) 和 [2.3.1](#)）中学到的。记 $S_N=\sum_{i=1}^{N}X_i$，将不等式
    $S_N\ge t$ 两边乘以参数 $\lambda\ge 0$，再取指数，并使用马尔可夫不等式和独立性。这导致 (2.9)：


    $$\mathbb{P}\{S_N\ge t\}\le e^{-\lambda t}\prod_{i=1}^{N}\mathbb{E}\exp(\lambda
    X_i). \tag{2.27}$$


    为了给出每一项 $X_i$ 的矩生成函数的界，我们使用命题 [2.8.1](#) 中的性质 **(iv)**。它表明，若 $\lambda$ 足够小以至于


    $$|\lambda|\le \frac{c}{\max_i\|X_i\|_{\psi_1}}, \tag{2.28}$$


    则<sup>8</sup> $\mathbb{E}\exp(\lambda X_i)\le \exp(C\lambda^2\|X_i\|_{\psi_1}^2)$。将其代入
    (2.27)，我们得到


    $$\mathbb{P}\{S_N\ge t\}\le \exp(-\lambda t+C\lambda^2\sigma^2),\qquad \text{其中
    }\sigma^2=\sum_{i=1}^{N}\|X_i\|_{\psi_1}^2.$$


    现在我们在约束 (2.28) 下关于 $\lambda$ 最小化这个表达式。最优选择是 $\lambda=\min\left(\frac{t}{2C\sigma^2},\frac{c}{\max_i\|X_i\|_{\psi_1}}\right)$，此时我们得到


    $$\mathbb{P}\{S_N\ge t\}\le \exp\left[-\min\left(\frac{t^2}{4C\sigma^2},\frac{ct}{2\max_i\|X_i\|_{\psi_1}}\right)\right].$$


