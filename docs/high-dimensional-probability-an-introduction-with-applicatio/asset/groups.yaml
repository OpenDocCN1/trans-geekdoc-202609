    |⟨X_i, u⟩ − θ_i β| ≤ β/2，其中 β = ‖μ‖₂。(e) 既然你从 (d) 知道 v ≈ u，那么可以得出：99.5% 的点 X_i
    满足 |⟨X_i, v⟩ − ⟨X_i, u⟩| ≤ 0.1β。（为此，写出这些量的平方和，并用 Σ_m 和 u − v 来表示它。）现在与 (b) 结合。


