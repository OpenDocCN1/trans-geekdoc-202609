    \n### 定理 9.6.3（一般矩阵偏差不等式）。\n\n*设 $A$ 为 $m \\times n$ 随机矩阵，其元素独立同分布为 $N(0,1)$。设\
    \ $f : \\mathbb{R}^m \\to \\mathbb{R}$ 为有界、正齐次且次可加的函数，且 $b \\in \\mathbb{R}$ 满足*\n\
