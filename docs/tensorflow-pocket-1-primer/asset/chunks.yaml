    如果你是第一次遇到激活函数这个概念，它可能会让你困惑，所以这里有一个可能对你有帮助的类比。假设你深夜在开车，且公路上没有其他车。只要没有障碍物（停止标志、交通信号灯等），你就可以以恒速行驶。另一方面，假设你开车进了一家大型超市的停车场。当你接近减速带时，你必须减速、通过减速带，然后再次加速，并对每一个减速带重复这个过程。


    将神经网络中的非线性激活函数想象成减速带的对应物：你无法无法保持恒速，这（通过类比）意味着你不能先将所有权重矩阵相乘并将它们“折叠”成单一的权重矩阵。另一个类比是路带有多个收费站的道路：你必须减速、支付路费，然后恢复行驶，直到到达下一个收费站。这些只是类比（因此是不完美的），旨在帮助你理解非线性激活函数的必要性。


    ## 常见激活函数


    尽管有很多激活函数（如果你知道如何做，也可以定义自己的），但以下是一些常见的激活函数列表，以及它们的简要描述：


    • `Sigmoid`

    • `Tanh`

    • `ReLU`

    • `ReLU6`

    • `ELU`

    • `SELU`


    `sigmoid` 激活函数基于欧拉常数 `e`，值范围在 0 到 1 之间，其公式所示：


    1\[1+e^(-x)\]


    `tanh` 激活函数也基于欧拉常数 `e`，其公式所示：


    \[e^x – e^(-x)\]\[e^x+e^(-x)\]


    记住上述公式的一种方法是注意分子和分母具有相同的项：它们在分子中用 `-` 号隔开，在分母中用 `+` 号隔开。`tanh` 函数的值范围在 -1 到 1
    之间。


    `ReLU`（修正线性单元）激活函数非常简单：如果 `x` 为负数，则 `ReLU(x)` 为 0；对于 `x` 的所有其他值，`ReLU(x)` 等于 `x`。`ReLU6`
    是 TensorFlow 特有的，它是 `ReLU(x)` 的变体：额外的限制是当 `x >= 6` 时 `ReLU(x)` 等于 6（因此得名）。


    `ELU` 是指数线性单元（Exponential Linear Unit），它是 `ReLU` 的指数“包络”，用指数激活函数替换了 `ReLU` 的两个线性段，该函数对于所有
    `x` 值（包括 `x = 0`）都是可微的。


    `SELU` 是比例指数线性单元（Scaled Exponential Linear Unit）的缩写，它比其他激活函数稍微复杂（使用频率较低）。要详细解释这些以及其他激活函数（以及描述其形状的图表），请访问以下
    Wikipedia 链接：


    [`en.wikipedia.org/wiki/Activation_function`](https://en.wikipedia.org/wiki/Activation_function)


    上述链接提供了激活函数的列表及其导数。


    ## TENSORFLOW 激活函数


    TensorFlow（以及许多其他框架）提供了许多激活函数的实现，这节省了你自己编写激活函数实现的时间精力。


    以下是与列表中某些激活函数对应的 TensorFlow API 列表：


    • `tf.nn.relu`

    • `tf.nn.relu6`

    • `tf.nn.selu`

    • `tf.nn.softmax`

    • `tf.nn.softplus`

    • `tf.nn.sigmoid`

    • `tf.nn.tanh`


