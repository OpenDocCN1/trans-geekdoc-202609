    第一章包含了 TensorFlow 代码示例，展示了非常简单的 TensorFlow 功能，接后的章节通过代码示例展示了各种 TensorFlow 内置 API。第三章深入探讨了
    TensorFlow 数据集（Dataset），并提供了大量的代码示例，说明了如何将“懒性”操作与数据集结合。第四章讨论了线性回归，第五章深入探讨了逻辑回归。如果你认为自己在学习前两章的代码时会非常吃力，那么建议先读一本“绝对初学者”类型的书籍来为学习本书做准备。


    另一点是：尽管 Jupyter 非常流行，但书中的所有代码示例都是 Python 脚本。不过，你可以通过各种在线教程快速了解 Jupyter 的实用功能。此外，值得关注
    Google Collaboratory，它是完全在线的工具，基于 Jupyter 笔记本，并提供免费的 GPU 使用。


    ## 代码示例是如何创建的？


    书中的代码示例是在运行了 OS X 10.12.6 (macOS Sierra) 的 Macbook Pro 上使用 TensorFlow 1.12 版本创建并测试的。关于其内容：代码示例主要源自作者的“深度学习与
    TensorFlow”研究生课程。在某些情况下，代码示例还包含了来自在线论坛讨论的短代码段。需要记住的关键点是，代码示例遵循“四 C”原则：考虑到本书的篇幅，它们必须尽可能做到**清晰、简洁、完整且准确**。


    ## 本书的技术前提条件是什么？


    你需要对 Python 有一定的了解，并知道如何从命令行启动 Python 代码（对于 Mac 用户，是在类 Unix 环境下）。此外，掌握基础线性代数（向量和矩阵）、概率/统计学（平均值、中位数、标准差）以及微积分基础概念（如导数）将帮助你学习书中的内容。


    以下前提条件对于理解书中最后两章的代码示例至关重要：对神经网络有一定的了解，这包括隐藏层和激活函数的概念（即使你并不完全理解它们）。对交叉熵（cross entropy）的知识对于某些代码示例也有帮助。通俗地说，这本书假设你已经学会了“爬”，以便帮助你学习如何“走”。


    还要记住，TensorFlow 提供了大量的 API，其中一些在书的章节代码示例中有所讨论。虽然你可以通过阅读在线文档来“掌握”这些 API 的用途，但这仅适用于基础的
    TensorFlow API；也就是说，在你在 TensorFlow 代码示例中实际操作它们之前，你可能无法真正理解它们的工作原理以及为什么需要它们。换句话说，如果你阅读包含你不理解的
    API 的 TensorFlow 代码示例，很多情况下，即使反复阅读这些示例，你仍然无法理解这些 API。


    更高效的方法是通过阅读展示这些 API 用途的小型代码示例来学习 TensorFlow API 的用途，之后阅读更复杂的 TensorFlow 代码示例。


    ## 本书的非技术前提条件是什么？


    虽然这个问题的答案很难量化，但对学习 TensorFlow 和机器学习的强烈愿望，以及阅读和理解代码示例的动力和自律，是非常重要的。


    即使是复杂的 TensorFlow API，在第一次遇到时也可能具有挑战性，因此请准备好阅读多次代码示例。


    ## 哪些主题未包含在内？


    本书不涵盖卷积神经网络 (`CNN`）、循环神经网络 (`RNN`）或长短期记忆网络 (`LSTM`）。


    ## 我如何设置 Shell？


    如果你是 Mac 用户，有三种方法。第一种方法是使用 Finder 导航到 `Utilities`（实用工具），然后双击 `Terminal`（终端）。


    ```

    open /Applications/Terminal.app

    ```


    接下来，如果你已经有一个可用的 shell，可以通过 `command+n` 调用它。如果你是 PC 用户，可以安装 Cygwin (`https://cygwin.com/`)
    或使用其他工具包如 MKS。注意，如果自定义别名定义在 `.bashrc` 以外的文件中，将不会自动设置。


    ## 完成本书后的“下一步”是什么？


    这个问题的答案差异很大，主要因为答案很大程度上取决于你的目标。最好的答案是针对一个你关心的专业或个人问题，尝试书中的新工具或新技术。


    如果你已经达到了此处所学知识的极限，并想进一步获得 TensorFlow 的技术深度，有各种在线资源和文献描述了复杂的特性。除非 TensorFlow 1.x
    是硬性要求，否则花些时间学习 TensorFlow 2 可能是一个好主意，作者将在即将出版的 Pocket Primer 中介绍。


    ## 配套文件


    可以通过向出版社发送邮件至 `info@merclearning.com` 获取书中代码示例和图片的配套文件。


    # 第一章 TensorFlow 简介


    本章简要介绍了 TensorFlow 的各种功能，以及 TensorFlow“家族”中包含的一些工具和项目。本章的意图是提供相关的 TensorFlow 信息、如何通过
    TensorBoard 可视化 TensorFlow 图形、如何通过 Jupyter 笔记本在浏览器中调用 TensorFlow 代码，以及在哪里可以使用免费的
    GPU 支持训练神经网络（Google Colaboratory）。本章的内容将为你学习第二章做好准备，第二章提供了常用 TensorFlow API 的“基础”（通过短代码示例说明），这些
    API 也会出现在后续章节的代码示例中。


    在阅读本章之前，请记住几点。首先，在书中，除非另有说明，否则 TensorFlow 指的是 TensorFlow 1.x。为了方便起见，你经常会看到用缩写
    `TF` 代替 TensorFlow。此外，为了给你提供一套不错的的 TensorFlow 代码示例，关于 TensorFlow 的历史细节被降到了最低。


