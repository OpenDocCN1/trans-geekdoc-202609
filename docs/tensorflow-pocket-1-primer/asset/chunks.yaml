- fmt: '

    With the preceding points in mind, the first section of this chapter briefly discusses
    linear classifiers, followed by an overview of activation functions, which are
    of paramount importance for deep neural networks. In this section you will learn
    how and why they are used in neural networks. This section also contains a list
    of the `TensorFlow` APIs for activation functions, followed by a description of
    some of their merits. Even though `Logistic Regression` relies on the `sigmoid`
    function, it’s still worthwhile to learn something about some of the other activation
    functions. In addition, you will see a code sample that contains `TensorFlow`
    and the `sigmoid` activation function.


    The second section introduces logistic regression, which is actually a classifier
    (despite its name). This section contains a code sample that involves `TensorFlow`
    and `Logistic Regression`. The final portion of this chapter contains a very brief
    introduction to `Keras`, along with a code sample that illustrates how to define
    a `Keras`-based model for the `MNIST` dataset. `Keras` is well-integrated into
    the latest versions of `TF 1.x`, and it’s also a core part of `TensorFlow 2`.
    Later on, if you plan to learn `TensorFlow 2`, it’s definitely worthwhile to learn
    more about `Keras`.


    ## WHAT IS CLASSIFICATION?


    The purpose of classification is to predict the class of given data points, where
    classes refer to categories and are also called targets or labels. For example,
    spam detection in email service providers involves binary classification (only
    2 classes). The `MNIST` dataset contains a set of images, where each image is
    a single digit, which means there are 10 labels. Some applications in classification
    include: credit approval, medical diagnosis, and target marketing.


    ## What are Classifiers?


    In the previous chapter you learned that linear regression uses supervised learning
    in conjunction with numeric data: the goal is to train a model that can make numeric
    predictions (e.g., the price of stock tomorrow, the temperature of a system, its
    barometric pressure, and so forth).


    By contrast, classifiers use supervised learning in conjunction with non-numeric
    classes of data: the goal is to train a model that can make categorical predictions.
    For instance, suppose that each row in a dataset is a specific wine, and each
    column pertains to a specific wine feature (tannin, acidity, and so forth).


    Suppose further that there are five classes of wine in the dataset: for simplicity,
    let’s label them A, B, C, D, and E. Given a new data point, which is to say a
    new row of data, a classifier for this dataset attempts to determine the label
    for this new wine.


    Some of the classifiers in this chapter can perform categorical classification
    and also make numeric predictions (i.e., they can be used for regression as well
    as classification).


    ## Common Classifiers


    Some of the most popular classifiers for Machine Learning are listed here:


    - linear classifiers

    - kNN

    - logistic regression

    - decision trees

    - random forests

    - SVMs

    - Bayesian classifiers

    - CNNs (deep learning)


    In the case of Deep Learning, image classification can be performed by `CNNs`
    (Convolutional Neural Networks), which makes them classifiers (they can also be
    used for audio and text processing).


    Keep in mind that different classifiers have different advantages and disadvantages,
    which often involves a trade-off between complexity and accuracy, similar to algorithms
    in fields that are outside of AI.


    The subsequent sections provide a brief description of the ML classifiers that
    are listed in the previous section.


    ## What are Linear Classifiers?


    A linear classifier separates a dataset into two classes. A linear classifier
    is a line for 2D, a plane for 3D, and a hyperplane for higher dimensions.


    Linear classifiers are often used when the input vectors are sparse or when the
    number of dimensions is large. They are often the fastest classifiers when the
    speed of classification is of importance.


    ## WHAT ARE ACTIVATION FUNCTIONS?


    The briefest description: an activation function is (usually) a non-linear function
    that introduces non-linearity into a neural network, thereby preventing “consolidation”
    of the layers. Some well-known activation functions are `sigmoid`, `tanh`, and
    `ReLU`.


    Suppose that we have a neural network that does not contain any activation function.
    The weights of the edges that connect the input layer with the first hidden layer
    is a matrix: let’s call it `W1`. Next, the weights of the edges that connect the
    first hidden layer with the second hidden layer is a matrix: let’s call it `W2`.
    Repeat this process until we reach the edges that connect the final hidden layer
    with the output layer: let’s call this `Wk`. Since we do not have an activation
    function, we can simply multiply the matrices `W1`, `W2`, …, `Wk` together and
    produce one matrix: `W`. We have now collapsed the original neural network to
    an input layer and an output layer.


    Fortunately, this reduction will not occur when we specify an activation function
    between every pair of layers. In other words, an activation function at each layer
    prevents this consolidation. Hence, we can maintain all the hidden layers during
    the process of training.


    For simplicity, let’s assume that we have the same activation function between
    adjacent layers (we’ll remove this assumption shortly). The process for using
    an activation function in a neural network is as follows:


    1. start with an input vector `x1` of numbers

    2. multiply `x1` by the matrix `W1` for the edges that connect the input layer
    with the first hidden layer, which produces a new vector `x2`

    3. apply the activation function to each element of `x2` to create another vector
    `x3`


    At this point we repeat Steps 2 and 3, except that we use the starting vector
    `x3` and the weights matrix `W2` for the edges that connect the first hidden layer
    with the second hidden layer (or just the output layer if there is only one hidden
    layer).


    After completing the preceding process, we have “preserved” the neural network,
    which means that it can be trained on a dataset. One other thing: instead of using
    the same activation function at each step, you can replace each activation function
    by a different activation function (the choice is yours).


    ## Why do we Need Activation Functions?


    The previous section outlines the process for transforming an input vector from
    the input layer and then through the hidden layers until it reaches the output
    layer. The purpose of activation functions in neural networks is vitally important,
    so it’s worth repeating here: activation functions “preserve” the structure of
    neural networks and prevent them from being reduced to an input layer and an output
    layer. In other words, if we specify a non-linear activation function between
    every pair of consecutive layers, then we explicitly control the exact number
    of layers in the neural network.


    Without a non-linear activation function, we simply multiply a weight matrix for
    a given pair of consecutive layers with the output vector that is produced from
    the previous pair of consecutive layers. We repeat this simple multiplication
    until we reach the output layer of the neural network.

