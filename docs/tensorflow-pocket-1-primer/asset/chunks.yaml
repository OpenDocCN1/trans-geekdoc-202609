    # Index


    *PREFACE*


    **WHAT IS THE GOAL?**


    The goal of this book is to introduce advanced beginners to TensorFlow 1.x fundamentals
    for basic machine learning algorithms in TensorFlow. It is intended to be a fast-paced
    introduction to various “core” features of TensorFlow, with code samples that
    cover deep learning and TensorFlow. The material in the chapters illustrates how
    to solve a variety of tasks using TensorFlow, after which you can do further reading
    to deepen your knowledge.


    This book provides more detailed code samples than those that are found in intermediate
    and advanced TensorFlow books. Although it contains some basic code samples in
    TensorFlow, some familiarity with TensorFlow will be helpful.


    The book will also save you the time required to search for code samples, which
    is a potentially time-consuming process. In any case, if you’re not sure whether
    or not you can absorb the material in this book, glance through the code samples
    to get a feel for the level of complexity.


    At the risk of stating the obvious, please keep in mind the following point: *you
    will not become an expert in TensorFlow by reading this book.*

