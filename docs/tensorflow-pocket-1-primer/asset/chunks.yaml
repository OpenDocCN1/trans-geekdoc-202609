  raw: 'The third portion of this chapter discusses another set of TensorFlow APIs,
    including reduce\_mean() and equal(), both of which are involved in calculating
    the accuracy of a the training of a neural network (in conjunction with tf.argmax()).
    You will also learn about the truncated\_normal() API, which is a variant of the
    tf.random\_normal() API, and the one\_hot() API for encoding data in a particular
    fashion (i.e., the digit 1 in one position and zero in all other positions of
    a vector). One of the most frequently used APIs is reshape(), which you will see
    in any TensorFlow code that involves training a Convolutional Neural Network (CNN).
    After you have completed this section of the chapter, navigate to the following
    URL that contains a massive collection of TF APIs:


    *[https://www.tensorflow.org/api\_docs/python/tf](https://www.tensorflow.org/api_docs/python/tf)*


    The fourth portion of this chapter offers more details about TensorBoard (which
    was briefly introduced in [Chapter 1](#08_chapter01.html)), and shows you how
    to use TensorBoard APIs in TensorFlow code in order to “augment” a TensorFlow
    graph with supplemental information that can be rendered in TensorBoard in a Web
    browser.


    **TF TENSOR OPERATIONS**


    TF supports many arithmetic operations on TensorFlow tensors, such as:


    Adding pairs of tensors


    Multiplying tensors


    Dividing tensors


    Subtracting tensors


    The preceding operations are performed on an element-by-element basis of two tensors.
    For example, adding two 2x2 tensors involves four additions, whereas adding two
    4x4 tensors involves sixteen additions.


    The TF tf.argmax() API enables you to find the maximum value of each row (or each
    column) of a two-dimensional TF tensor. This API is used in CNNs as part of the
    calculation of the number of images (in the case of MNIST) that are correctly
    identified during the training phase. The TF tf.argmin()API is similar to the
    tf.argmax()API, except that minimum values are found instead of maximum values.


    TensorFlow provides statistical methods, such as tf.reduce\_mean() and tf.random\_normal(),
    for calculating the mean of a set of numbers and randomly selecting numbers from
    a normal distribution. The tf.truncated\_normal() API is similar to the tf.random\_normal()
    API, with the added constraint that the selected numbers must be in a specified
    range (which is specified by you).


    Other useful TensorFlow APIs are shown in the following list:


    eval()


    rank()


    reduce\_sum()


    reshape()


    range()


    equal()


    one\_hot()


    name\_scope()


    summary.scalar()


    Later in this chapter, you will see code samples that illustrate how to use most
    of the TF APIs in the preceding list.


    **TENSORFLOW AND BUFFERS**


    Listing 2.1 displays the contents of tf-basic-buffer.py, which illustrates how
    to save the contents of a TF graph to a TF buffer.


