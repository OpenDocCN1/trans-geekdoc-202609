    you can load any Jupyter notebook on GitHub by just adding the path to the URL
    `colab.research.google.com/github/` (http://colab.research.google.com/github/)
    (see the website for details).


    Google Colaboratory has support for other technologies, such as `HTML` and `SVG`,
    enabling you to render SVG-based graphics in notebooks that are in Google Colaboratory.
    One point to keep in mind: any software that you install in a Google Colaboratory
    notebook is only available on a per-session basis: if you log out and log in again,
    you need to perform the same installation steps that you performed during your
    earlier Google Colaboratory session.


    As mentioned earlier, there is one other very nice feature of Google Colaboratory:
    you can execute code on a GPU for up to twelve hours per day for free. This free
    GPU support is extremely useful for people who do not have a suitable GPU on their
    local machine (which is probably the majority of users), and now they launch TensorFlow
    code to train neural networks in less than 20 or 30 minutes that would otherwise
    require multiple hours of CPU-based execution time.


    Keep in mind the following details about Google Colaboratory. First, when you
    connect to a server in Google Colaboratory, you start what’s known as a `session`.
    You can execute the code in a session with a `CPU` (the default), a `GPU`, or
    a `TPU` (which incurs a cost), and you can execute your code without any time
    limit for your session. However, if you select the GPU option for your session,
    only the first 12 hours of GPU execution time are free during the session. Any
    additional GPU time during that same session incurs a small charge (see the website
    for those details).


    The other point to keep in mind is that any software that you install in a Jupyter
    notebook during a given session will not be saved when you exit that session.
    For example, the following code snippet installs TFLearn in a Jupyter notebook:


    ```bash

    !pip install tflearn

    ```


    When you exit the current session and at some point later you start a new session,
    you need to install TFLearn again, as well as any other software (such as Github
    repositories) that you also installed in any previous session.


    ## OTHER CLOUD PLATFORMS


    Google Cloud Platform (`GCP`) is a cloud-based service that enables you to train
    TensorFlow code in the cloud. GCP provides Deep Learning DL images (similar in
    concept to Amazon AMIs) that are available here:


    [https://cloud.google.com/deep-learning-vm/docs](https://cloud.google.com/deep-learning-vm/docs)


    The preceding link provides documentation, and also a link to DL images based
    on different technologies, including `TensorFlow` and `PyTorch`, with GPU and
    CPU versions of those images. Along with support for multiple versions of `Python`,
    you can work in a browser session or from the command line.


    ## GCP SDK


    Install `GCloud SDK` on a Mac-based laptop by downloading the software at this
    link:


    [https://cloud.google.com/sdk/docs/quickstart-macos](https://cloud.google.com/sdk/docs/quickstart-macos)


    You will also receive USD 300 dollars worth of credit (over one year) if you have
    never used Google cloud.


    ## SUMMARY


    This chapter introduced you to TensorFlow, its architecture, and some of the tools
    that are part of the TensorFlow “family.” Then you learned how to create a TensorFlow
    graph containing TensorFlow constants, placeholders, and variables. You also learned
    how to perform TensorFlow arithmetic operations, along with some built-in functions.


    Next, you learned how to calculate trigonometric values, how to use `for` loops,
    `while` loops, and how to calculate exponential values. You also saw how to perform
    various operations on arrays, such as creating an identity matrix and a constant
    matrix.


    You also learned how to save a TensorFlow graph and then view its contents in
    a browser using the built-in `TensorBoard` utility that is launched from the command
    line. Finally, you learned about Google Colaboratory, which is a Jupyter notebook-based
    environment that is accessible in a browser and executes your code in the cloud.


    # CHAPTER 2


    ## USEFUL TENSORFLOW APIS


    This chapter focuses on useful TensorFlow APIs that you will encounter in many
    TensorFlow code samples. In fact, you will use these APIs in code samples that
    involve more complex TensorFlow code that are beyond the scope of this book.


    An entire chapter devoted to APIs might seem like “dry” content, but the rationale
    is simple: you need all the APIs in this chapter if you continue learning about
    TensorFlow. Consequently, it’s easier to find these TensorFlow APIs when they
    are located a single chapter. After you have read this chapter, you will be better
    prepared for the code samples that use these APIs in subsequent chapters.


    Obviously, you are not “required” to read this chapter in its entirety, even if
    you are new to TensorFlow. However, it’s worth skimming this chapter to make note
    of the TensorFlow APIs that are discussed. Doing so gives you a cursory overview
    of this chapter, and when you encounter code samples that use APIs in this chapter,
    you can read the appropriate section with details about those APIs.


    The first part of this chapter briefly discusses some TensorFlow features, such
    as eager execution, which has a more Python-like syntax than “regular” TensorFlow
    syntax, and tensor operations (such as multiplying tensors). This section also
    shows you how to create `for` loops and `while` loops in TensorFlow. Recall from
    Chapter 1 that TensorFlow 2 uses eager execution as the default execution whereas
    Tensorflow 1.x uses deferred execution. As this book goes to print, TensorFlow
    2 has not been released, which means that the code samples in this book are for
    TensorFlow 1.x.


    The second part of this chapter contains a collection of TensorFlow code samples
    that show you how to use various APIs that are commonly used in machine learning.
    Specifically, you will see how to use the `tf.random_normal()` API for generating
    random numbers (which is useful for initializing the weights of edges in neural
    networks); the `tf.argmax()` API for finding the index of each row (or column)
    that contains the maximum value in each row (or column), which is used for calculating
    the accuracy of the training process involving various algorithms; and also the
    `tf.range()` API, which is similar to the `np.linspace()` API that you saw in
    [Chapter 1](#08_chapter01.html).

