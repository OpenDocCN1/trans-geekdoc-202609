    ## THE TENSORFLOW FLATMAP() OPERATOR (1)


    In addition to the TF `map()` operator, TF also supports the TF `flat_map()` operator.
    However, the TF `Dataset.map()` and TF `Dataset.flat_map()` operators expect functions
    with different signatures. Specifically, `Dataset.map()` takes a function that
    maps a single element to a single element, whereas `Dataset.flat_map()` takes
    a function that maps a single element to multiple elements.


