    接下来，你学习了如何使用 TensorFlow 的 `tf.random_normal()` API 生成随机数（这对于初始化神经网络中边的权重非常有用），随后是
    `tf.argmax()` API，用于找到每行（或每列）中包含最大值的索引，该 API 用于计算涉及各种算法的训练过程的准确率。你还学习了 `tf.range()`
    API，它类似于 NumPy 的 `np.linspace()` API。


    此外，你还学习了 `TF.reduce_mean()` 和 `equal()` API，这两者都参与了神经网络训练准确率的计算（结合 `tf.argmax()`
    使用）。紧接着，你学习了 TensorFlow 的 `truncated_normal()` API，它是 `tf.random_normal()` API
    的一种变体，以及用于以特定方式编码数据的 TF `one_hot()` API。此外，你还学习了 TensorFlow 的 `reshape()` API，你将在涉及训练卷积神经网络（CNN）的
    TensorFlow 代码中看到它。


    在这一章的后半部分，你接触了 TensorBoard，它是 TensorFlow 分发中的一个非常强大的可视化工具。你看到了一些代码示例，这些示例在调用其他
    TensorFlow API 的同时调用了 TensorBoard API，以为 TensorFlow 图添加补充信息，这些信息会在 Web 器的 TensorBoard
    中渲染。


    # 第三章


    ## TENSORFLOW 数据集


    本章包含了各种代码示例，说明了如何使用 TensorFlow Datasets。它支持丰富的运算符集合，这些运算符可以简化你的 TensorFlow 代码，并允许你处理非常大的数据集（即大到无法放入内存的数据集）。你将学习如何通过“方法链”在定义
    TF 数据集时指定某些运算符（如 `filter()` 和 `map()`）。此外，你还将学习 TF 器（estimators，在 `tf.estimator`
    命名空间中）、TF 层（layers，在 `tf.layers` 命名空间中）以及 TFRecords。


    熟悉 lambda 表达式（后文将讨论）和响应式编程对本章将非常有帮助。事实上，如果你已经有了 `RxJS`、`RxAndroid`、`RxJava` 或其他涉及延迟执行的环境的经验，那么这一章的内容将非常简单。


    本章的第一部分简要介绍了 TF Datasets 和 lambda 表达式。本节还介绍了 TensorFlow 中的几种类型的迭代器，包括“单次（one shot）”迭代器和“可重复（reiterable）”迭代器。


    本章的第二部分讨论了 `TextLineDatasets`，它处理文本文件非常方便。本节的代码示例还使用了上一节讨论的四种迭代器中的两种。


    本章的第三部分讨论了所谓的“中间”或“懒”运算符，例如 `filter()`、`flatmap()` 和 `map()` 运算符。你可以使用方法链来组合这些运算符，产生强大的代码组合，从而显著降低
    TensorFlow 代码的复杂性。


    本章的最后部分简要讨论了 TF estimators（各种机器学习算法的实现）以及为稠密神经网络（DNN）和卷积神经网络（CNN）提供各种类的 TF 层。


    ### TENSORFLOW 数据集


    TensorFlow Datasets（通过 `tf.data.Dataset` 命名空间访问）非常适用于创建异步优化的数据流水线。简而言之，TF Dataset
    API 从磁盘加载数据（包括图像和文本），应用优化转换，创建批次（batches），并将批次发送到 GPU。因此，TF Dataset API 有于提高 GPU
    利用率。此外，在 TF 2.0 中使用 `tf.functions` 可以充分利用数据集的异步预取/流式功能。


    TF Dataset 充当数据集周围的类似容器的“包装器”，类似于 Pandas DataFrame。因此，一个非常大的数据集可以涉及一个巨大的 TF Dataset。TF
    Dataset 也可以将输入流水线表示为元素的集合（即张量的嵌套结构），以及作用于这些元素的转换的“逻辑计划”。例如，你可以定义一个 TF Dataset，它初始包含文本文件中的文本行，然后提取以
    "" 字符开头的文本行，最后只显示前三行。创建这个流水线很容易：创建一个 TF Dataset，然后链式调用懒运算符 `filter()` 和 `take()`，这与你将在本章稍后看到的示例类似。


    ### TensorFlow 数据集的基本步骤


    按顺序执行以下三个步骤，以创建和处理 TF Dataset 的内容：


    1. 导入数据

    2. 创建迭代器

    3. 消费数据


