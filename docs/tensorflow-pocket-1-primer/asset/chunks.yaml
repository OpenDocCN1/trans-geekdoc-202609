    TensorFlow 2 可能在 2019 年中旬左右发布，届时 TensorFlow 1.x 将成为遗留代码（如引言中所）。最重要的变化之一是将“即时执行（eager
    execution）”作为默认模式，而不是“延迟执行（deferred execution）”模式。


    ## 为什么使用 TF 1.x 而不是 TF 2？


    有几个原因让我们留在 TF 1.x 而不切换到 TF 2。首先，在本书出版时，TF 2 尚未发布。其次（可能更为重要），目前在线 TensorFlow 代码示例中使用即时执行的仅占极比非常小。幸运的是，Google
    将提供将 TF 1.x 代码转换为 TF 2 的工具，这将在许多情况下提供帮助，例如，当从 TF 1.x API 到 TF 2 API 可以进行直接转换时。当这些工具无法完成转换时，可能会有各种在线教程说明如何进行转换。


    第三，存在大量使用 TF 1.x 的代码库，其中包括许多客户甚至 Google 自身。从 TF 1.x 到 TF 2 的转换过程将花费大量时间，因为一些（可能是大型）公司转型速度较慢。作为一个类比，考虑从
    Python 2.x 到 Python 3.x 的迁移：尽管 Python 3.x 已经发布多年，但仍有许多地方在使用 Python 2.x（而且 Python
    2.x 已于 2020 年“寿命”）。


    存在一个可能的例外：如果你是 TensorFlow 的“新手”，且没有迫切需要学习 TensorFlow，那么等到 TF 2 的生产版本发布可能对你来说工作量少。


    ## 什么是 TensorFlow 张量（Tensor）？


    简单来说，TF 张量是一个类似于 NumPy ndarray 的多维数组。TF 张量由其维度定义，总结如下：


    | 标量 (scalar): | 零阶张量 |

    | --- | --- |

    | 向量 (vector): | 一阶张量 |

    | 矩阵 (matrix): | 二阶张量 |

    | 3 维数组: | 三阶张量 |


    正如你将在后续章节中看到的，TensorFlow 支持各种数据类型和原始类型。除了常量和变量外，TensorFlow 还提供了一种名为“占位符（placeholder）”的数据类型，它充当持有临时数据的缓冲区。对于需要训练的事项使用
    TF 变量，例如平面上最佳拟合线的斜率 `m` 和截距 `b`。


    ## TensorFlow 数据类型


    TensorFlow 支持以下数据类型：


    - `tf.float32`

    - `tf.float64`

    - `tf.int8`

    - `tf.int16`

    - `tf.int32`

    - `tf.int64`

    - `tf.uint8`

    - `tf.string`

    - `tf.bool`


    上述列表中的数据类型自言易懂：两个浮点类型、四个整数类型、一个无符号整数类型、一个字符串类型和一个布尔类型。正如你所看到的，有 32 位和 64 位浮点类型，以及从
    8 位到 64 位的整数类型。


    ## TensorFlow 原始类型


    TensorFlow 支持以下原始类型（数组将在后讨论）：


    ### TF 常量 (Constants)

    - TF 占位符 (Placeholders)

    - TF 变量 (Variables)


    TensorFlow `constant` 是一个不可变的值，示例所示：

    ```

    aconst = tf.constant(3.0)

    ```


    TensorFlow `placeholder` 为数据分配空间，类似于其他语言中的“缓冲区”。TF 占位符非常棒用的一点是，它们不需要指定形状：它们会“自动地”假设分配给它们的形状。一个简单的
    TensorFlow 占位符示例：

    ```

    a = tf.placeholder("float")

    b = tf.placeholder("float")

    c = tf.multiply(a,b)

    ```

    如前面的代码所示，`c` 定义为 `a` 和 `b` 的乘积，它们还没有值。使用 `feed_dict` 为占位符赋值，示例所示：

    ```

    a = tf.placeholder("float")

    b = tf.placeholder("float")

    c = tf.multiply(a,b)

    feed_dict = {a:2, b:3}

    ```

    `c` 的计算将在后文 sessions 部分显示。


    TensorFlow `variable` 是 TensorFlow 图中的一个“可训练的值”。例如，平面最佳拟合线的斜率 `m` 和截距 `b` 是两个可训练的值。一些
    TF 变量的示例所示：

    ```

    b = tf.Variable(3, name="b")

    x = tf.Variable(2, name="x")

    z = tf.Variable(5, name="z")

    lm = tf.Variable(W + b, name="lm")

    ```

    注意 `b`、`x` 和 `W` 被赋值为数值，而 `z` 和 `lm` 被定义为表达式。具体而言，变量 `z` 的值取决于 `x` 的值（等于 2），变量
    `lm` 的值取决于 `W` 和 `b`。`z` 和 `lm` 都在 TensorFlow “session”中求值，后所示。


    ## TensorFlow 图 (Graphs)


    当你在 Python 脚本中定义 TensorFlow 代码时，通常会使用某些数据类型和其他构造。在执行 TensorFlow 代码之前，TensorFlow
    会根据你定义的常量、占位符和变量生成图结构。典型的 TensorFlow 图包含：


    - 图 (Graph): 操作图 (DAG)

    - 会话 (Sessions): 图

    - 延迟执行（默认）

    - 并行操作（默认）

    - 节点 (Nodes): 算子/变量/常量

    - 边 (Edges): 张量


    TF 1.x 图被拆分为子图并并行执行（如果可用多个 CPU 或 GPU）。书中的章节包含了 Python 编写的 TensorFlow 代码示例，说明了如何执行算术运算、计算三角值以及如何使用即时执行。


    ## TensorFlow 版本号


    列表 1 显示了 `tf-version.py` 的内容，说明如何查找机器上安装的 TensorFlow 版本号。


    ### LISTING 1: tf-version.py

    ```python

    import tensorflow as tf

    print(''TF version:'',tf.__version__)

    ```

    列表 1 包含一个 import 语句和一个显示安装的 TensorFlow 版本的 print 语句。列表 1 的输出如下：

    `(''TF version:'', ''1.12.0'')`


    列表 1 由两个语句组成：TensorFlow 的 import 语句，随后是显示机器安装的 TensorFlow 版本的 print 语句。列表 1 的输出如下（取决于你机器安装的
    TensorFlow 版本）：

    `TF version: 1.12.0`


    ## 带有 TF.SESSION() 的 TensorFlow 图


    TF 1.x 中的 TensorFlow 图由两部分组成：Python 脚本部分的 TensorFlow 代码，随后是 `tf.Session()` 对象的实例（通常缩写为
    `sess`）。为了从 TF 张量获取值，你调用 `sess.run()` 方法并将 TF 张量作为 `sess.run()` 方法的参数。相比之下，TF
    2 不需要 `tf.Session()` 实例，它比 TF 1.x 更具“Python 风格”。


    在 TF 1.x 代码的极简单情况下（例如显示 TensorFlow 版本号），你不需要 `tf.Session()` 对象。


    列表 2 显示了 `tf-session.py` 的内容，说明了如何在 TensorFlow 图中使用 `tf.Session()` 对象。


    ### LISTING 2: tf-session.py

    ```python

    import tensorflow as tf

    aconst = tf.constant(3.0)

    print(aconst)

    # output: Tensor("Const:0", shape=(), dtype=float32)

    sess = tf.Session()

    print(sess.run(aconst))

    # output: 3.0

    sess.close()

    # => 有一种更好的方法……

    ```

    列表 2 开始于 import 语句、TF 常量 `aconst` 的定义，以及一个显示 `aconst` 元数据的 print 语句。列表 2 的下一部分将变量
    `sess` 初始化为 `tf.Session` 类的实例，随后是一个显示变量 `aconst` 值的 print 语句。列表 2 的输出如下：

    `3.0`


