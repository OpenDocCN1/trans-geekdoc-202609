  trans: "\n该技术用于模拟线段的代码示例中，然后训练部分将近似最拟合线 `m` 和 `b` 的值。显然，我们已经知道了最拟合线的方程：此技术的目的是将训练出的斜率\
    \ `m` 的值和 y 轴截距 `b` 的值与已知值（在这种情况下，这些值是 2.5 和 5）进行比较。\n\n这里是列表 4.1 的部分输出：\n\n![image](img/page_115-1.jpg)\n\
    \n![image](img/page_116.jpg)\n\n图 4.5 显示了基于 `x` 和 `y` 值的散点图。\n\n![image](img/fig4_5.jpg)\n\
    \n***图 4.5***线段的垂点散点图。\n\n## 为什么“扰动技术”很有用\n\n你已经看到过如何使用“扰动技术”，作为对比，考虑一个包含在 Python\
    \ 数组变量 `X` 和 `Y` 中定义的以下点的数据集：\n\n`X = [0,0.12,0.25,0.27,0.38,0.42,0.44,0.55,0.92,1.0]`\n\
    \n`Y = [0,0.15,0.54,0.51, 0.34,0.1,0.19,0.53,1.0,0.58]`\n\n如果你需要为上述数据集找到最拟合线，你会如何猜测斜率\
    \ `m` 和 y 轴截距 `b` 的值？在大多数情况下，你可能无法猜出它们的值。相反，“扰动技术”允许你在预先指定斜率 `m`（以及可选 y 轴截距 `b`\
    \ 值）的直线上“抖动”这些点。\n\n记住，“扰动技术”只有当你引入不会导致 `m` 和 `b` 值发生变化的小随机值时才有效。\n\n## 使用 NUMPY\
    \ 和 MATPLOTLIB 散点图\n\n列表 4.1 中的代码为变量 `x` 分配了随机值，而斜率 `m` 则分配了一个硬编码值。`y` 值是 `x`\
    \ 值的硬编码倍数，加上通过“扰动技术”计算出的随机值。因此，我们不知道 y 轴截距 `b` 的值。\n\n在本节中，`trainX` 的值基于 `np.linspace()`\
    \ API，而 `trainY` 的值涉及上一节描述的“扰动技术”。\n\n示例中的代码简单地打印 `trainX` 和 `trainY` 的值，这些值对应于欧几里得平面上的数据点。列表\
    \ 4.2 显示了 `np-plot2.py` 的内容，说明如何在 NumPy 中模拟线性数据集。\n\n***列表 4.2: np-plot2.py***\n\
    \n![image](img/page_117.jpg)\n\n列表 4.2 通过 NumPy `linspace()` API 初始化 NumPy 数组变量\
    \ `trainX`，随后定义两个部分的数组变量 `trainY`。第一部分是线性项 `4*trainX`，第二部分涉及随机生成的数字“扰动技术”。列表 3.6\
    \ 的输出是：\n\n![image](img/page17-1.jpg)\n\n下一节包含一个与列表 3.2 类似的示例，使用相同的“扰动技术”来生成一组近似线段的点。\n\
    \n## 使用 NUMPY 和 MATPLOT 绘制二次散点图\n\n列表 4.3 显示了 `np-quadratic.py` 的内容，它说明了如何在平面上绘制二次函数。\n\
    \n***列表 4.3: np-quadratic.py***\n\n![image](img/page17-2.jpg)\n\n![image](img/page18-1.jpg)\n\
    \n列表 4.3 使用通过 `linspace()` API 生成的值初始化数组变量 `x`，在这种情况下，这是一组位于 -5 到 5 之间的 100 个等间距小数。注意产生元素数组的段片段，其中每个元素都是单个数字。\n\
    \n数组 `y` 定义为两个部分：第一部分是二次方程 `-0.5 + 2*x + 3*x**2`，第二部分是基于随机数的“扰动”值（类似于列表 4.1 中的代码）。因此，数组\
    \ `y` 模拟了一组近似二次方程的值。列表 4.3 的输出是：\n\n![image](img/page18.jpg)\n\n图 4.6 显示了基于 `x`\
    \ 和 `y` 值的散点图，其形状近似二次方程。\n\n![image](img/fig4_6.jpg)\n\n***图 4.6***二次方程的垂点散点图。\n\
    \n## MSE 公式\n\n图 3.8 显示了 MSE 的公式。用通俗的话说，MSE 是实际 `y` 值与预测 `y` 值之间差的平方和，除以点的个数。注意，预测的\
    \ `y` 值是每个点如果在该点处将拥有的 `y` 值。\n\n对于线性回归，MSE 是常用的，但还有其他类型。\n\n## 误差类型\n\n虽然我们只讨论线性回归，但还有其他误差类型将在后续章节中讨论：\n\
    \n- `MSE`（均方误差）\n- `RMSE`（均方根误差）\n- `R²`决定系数\n- `MAE`（均绝对误差）\n\n`RMSE` 是 MSE 的平方根。用通俗的话说，MSE\
    \ 是实际 `y` 值与预测 `y` 值之间差的平方和，除以点的个数。\n\n `MAE` 是误差的绝对值的平均值。\n\n `R²` 决定系数表示模型对观测数据的解释程度。`R²`\
    \ 越接近 1，模型拟合效果越好。\n\n `RMSE` 是 MSE 的平方根。用通俗的话说，MSE 是实际 `y` 值与预测 `y` 值之间差的平方和，除以点的个数。\n\
    \n `MAE` 是误差的绝对值的平均值。\n\n `R²` 决定系数表示模型对观测数据的解释程度。\n"
