    ## WORKING WITH TF.ESTIMATORS AND TF.LAYERS (OPTIONAL)


    The first sub-section introduced below is useful if you have some experience with
    well-known machine learning algorithms using a Python library such as `scikit-learn`.
    You will see a list of the TensorFlow classes that are similar to their Python-based
    counterparts in machine learning, with classes for regression tasks and classes
    for classification tasks.


    The second subsection contains a list of TensorFlow classes that are relevant
    for defining CNNs in TensorFlow.


    If you are new to machine learning, then this section will have much more limited
    value to you right now, but you can still learn what’s available for future reference.


    ### What are TF Estimators?


    The `tf.estimator` namespace contains an assortment of classes that implement
    various algorithms that are available in machine learning, such as boosted trees,
    `DNN classifiers`, `DNN regressors`, `linear classifiers`, and `linear regressors`.


    The estimator-related classes `DNNRegressor`, `LinearRegressor`, and `DNNLinearCombinedRegressor`
    are for regression tasks, whereas the classes `DNNClassifier`, `LinearClassifier`,
    and `DNNLinearCombinedClassifier` are for classification tasks. A more extensive
    list of estimator classes (with very brief descriptions) is listed below:


    - `BoostedTreesClassifier`: A classifier for Tensorflow Boosted Trees models

    - `BoostedTreesRegressor`: A cegressor for Tensorflow Boosted Trees models

    - `CheckpointSaverHook`: Saves checkpoints every N steps or seconds

    - `DNNClassifier`: A classifier for TensorFlow DNN models

    - `DNNEstimator`: An estimator for TensorFlow DNN models with user-specified head

    - `DNNLinearCombinedClassifier`: An estimator for TensorFlow Linear and DNN joined
    classification models

    - `DNNLinearCombinedRegressor`: An estimator for TensorFlow Linear and DNN joined
    models for regression

    - `DNNRegressor`: A regressor for TensorFlow DNN models

    - `Estimator`: Estimator class to train and evaluate TensorFlow models

    - `LinearClassifier`: Linear classifier model

    - `LinearEstimator`: An estimator for TensorFlow linear models with user-specified
    head

    - `LinearRegressor`: An estimator for TensorFlow Linear regression problems


    All estimator classes are in the `tf.estimator` namespace, and all the estimator
    classes inherit from the `tf.estimator.Estimator` class. Read the online documentation
    for the details of the preceding classes as well as online tutorials for relevant
    code samples.


