    A feature that contains non-numeric values is called categorical or nominal data.
    Since neural networks expect numeric values as their input values, we must “map”
    non-numeric feature values into a corresponding set of numeric values. The term
    one-hot encoding involves the conversion of each non-numeric value into a vector
    that contains a single 1 (and zeroes elsewhere).


