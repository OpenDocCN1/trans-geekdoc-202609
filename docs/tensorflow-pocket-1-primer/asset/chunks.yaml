    本章的第三部分讨论了另一组 TensorFlow API，包括 `reduce_mean()` 和 `equal()`，它们都涉及神经网络训练准确率的计算（与
    `tf.argmax()` 一起使用）。你还将学习到 `truncated_normal()` API，它是 `tf.random_normal()` API
    的变体，以及用于以特定方式编码数据的 `one_hot()` API（即：在向量的某位置上数字为 1，在其他其他位置为 0）。最常用的 API 之一是 `reshape()`，你将在任何涉及训练卷积神经网络（CNN）的
    TensorFlow 代码中看到它。在完成本章的这一节后，请访问以下 URL，其中包含大量的 TF API 集合：


    [`www.tensorflow.org/api_docs/python/tf`](https://www.tensorflow.org/api_docs/python/tf)


    本章的第四部分提供了关于 TensorBoard 的更多细节（在第 1 章 中已简要介绍过），并向你展示如何在 TensorFlow 代码中使用 TensorBoard
    API，通过补充信息来“增强” TensorFlow 图，这些信息可以在 Web 浏览器中的 TensorBoard 中渲染。


    ## TF 张量操作


    TF 支持对 TensorFlow 张量进行许多算术运算，例如：


    - 张量成对相加

    - 张量相乘

    - 张量相除

    - 张量相减


    上述操作是基于两个张量的逐元素执行的。例如，两个 2x2 张量的相加涉及四次加法，而两个 4x4 张量的相加涉及十六次加法。


    TF 的 `tf.argmax()` API 允许你找到二维 TF 张量每行（或每列）的最大值。该 API 在 CNN 中用于计算训练期间正确识别的图像数量（以
    MNIST 为例）。TF 的 `tf.argmin()` API 与 `tf.argmax()` API 类似，不同之处在于找到的是最小值而不是最大值。


    TensorFlow 提供了统计方法，如 `tf.reduce_mean()` 和 `tf.random_normal()`，用于计算一组数字的平均值以及从正态分布中随机选择数字。`tf.truncated_normal()`
    API 与 `tf.random_normal()` API 类似，增加了一个约束条件：所选数字必须在指定的范围内（由你指定）。


    其他有用的 TensorFlow API 如下列表所示：


    - `eval()`

    - `rank()`

    - `reduce_sum()`

    - `reshape()`

    - `range()`

    - `equal()`

    - `one_hot()`

    - `name_scope()`

    - `summary.scalar()`


    在本章后面，你将看到演示如何使用上述列表中大多数 TF API 代码示例。


