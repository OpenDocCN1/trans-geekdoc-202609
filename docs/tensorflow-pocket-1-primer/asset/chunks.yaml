    This technique is used in code samples that simulate a line segment, and then
    the training portion approximates the values of `m` and `b` for the best-fitting
    line. Obviously, we already know the equation of the best fitting-line: the purpose
    of this technique is to compare the trained values for the slope `m` and y-intercept
    `b` with the known values (which in this case are 2.5 and 5).


    A partial output from Listing 4.1 is here:


    ![image](images/page_115-1.jpg)


    ![image](images/page_116.jpg)


    [Figure 4.5](#11_chapter04.html#fig4_5) displays a scatter plot of points based
    on the values of `x` and `y`.


    ![image](images/fig4_5.jpg)


    ***FIGURE 4.5***A Scatter Plot of Points for a Line Segment.


    ## Why the “Perturbation Technique” is Useful


    You already saw how to use the “perturbation technique” and, by way of comparison,
    consider a dataset with the following points that are defined in the Python array
    variables `X` and `Y`:


    `X = [0,0.12,0.25,0.27,0.38,0.42,0.44,0.55,0.92,1.0]`


    `Y = [0,0.15,0.54,0.51, 0.34,0.1,0.19,0.53,1.0,0.58]`


    If you need to find the best fitting line for the preceding dataset, how would
    you guess the values for the slope `m` and the y-intercept `b`? In most cases,
    you probably cannot guess their values. On the other hand, the “perturbation technique”
    enables you to “jiggle” the points on a line whose value for the slope `m` (and
    optionally the value for the y-intercept `b`) is specified in advance.


    Keep in mind that the “perturbation technique” only works when you introduce small
    random values that do not result in different values for `m` and `b`.


    ## SCATTER PLOTS WITH NUMPY AND MATPLOTLIB


    The code in Listing 4.1 assigned random values to the variable `x`, whereas a
    hard-coded value is assigned to the slope `m`. The `y` values are a hard-coded
    multiple of the `x` values, plus a random value that is calculated via the “perturbation
    technique.” Hence we do not know the value of the y-intercept `b`.


    In this section, the values for `trainX` are based on the `np.linspace()` API,
    and the values for `trainY` involve the “perturbation technique” that is described
    in the previous section.


    The code in this example simply prints the values for `trainX` and `trainY`, which
    correspond to data points in the Euclidean plane. Listing 4.2 displays the contents
    of `np-plot2.py` that illustrates how to simulate a linear dataset in NumPy.


    ***LISTING 4.2: np-plot2.py***


    ![image](images/page_117.jpg)


    Listing 4.2 initializes the NumPy array variable `trainX` via the NumPy `linspace()`
    API, followed by the array variable `trainY` that is defined in two parts. The
    first part is the linear term `4*trainX` and the second part involves the “perturbation
    technique” that is a randomly generated number. The output from Listing 3.6 is:


    ![image](images/page17-1.jpg)


    The next section contains an example that is similar to Listing 3.2, using the
    same “perturbation technique” to generate a set of points that approximate a line
    segment.


    ## A QUADRATIC SCPLOT WITH NUMPY AND MATPLOT


    Listing 4.3 displays the contents of `np-quadratic.py`, which illustrates how
    to plot a quadratic function in the plane.


    ***LISTING 4.3: np-quadratic.py***


    ![image](images/page17-2.jpg)


    ![image](images/page18-1.jpg)


    Listing 4.3 initializes the array variable `x` with the values that are generated
    via the `linspace()` API, which in this case is a set of 100 equally spaced decimal
    numbers between -5 and 5. Notice the snippet which results in an array of elements,
    each of which is a single number.


    The array `y` is defined in two parts: the first part is a quadratic equation
    `-0.5 + 2*x + 3*x**2` and the second part is a “perturbation” value based on a
    random number (similar to the code in Listing 4.1). Thus, the array `y` simulates
    a set of values that approximates a quadratic equation. The output from Listing
    4.3 is:


    ![image](images/page18.jpg)


    [Figure 4.6](#11_chapter04.html#fig4_6) displays a scatter plot of points based
    on the values of `x` and `y`, which have an approximate shape of a quadratic equation.


    ![image](images/fig4_6.jpg)


    ***FIGURE 4.6***A Scatter Plot of Points for a Quadratic Equation.


    ## THE MSE FORMULA


    Figure 3.8 displays the formula for the MSE. In plain English, the MSE is the
    sum of the squares of the difference between an actual `y` value and the predicted
    `y` value, divided by the number of points. Notice that the predicted `y` value
    is the `y` value each point would have if that point were actually on the best-fitting
    line.


    Although the MSE is popular for linear regression, there are other error types,
    some of which are discussed briefly in the next section.


    ## A List of Error Types


    Although we will only discuss MSE for linear regression in this book, there are
    other types of formulas that you can use for linear regression, some of which
    are listed here:


    - `MSE`

    - `RMSE`

    - `RMSPROP`

    - `MAE`


    The MSE is the basis for the preceding error types. For example, `RMSE` is “Root
    Squared Error,” which is the square root of MSE. On the other hand, `MAE` is “Mean
    Absolute Error,” which is the sum of the absolute value of the differences of
    the `y` terms (not the square of the differences of the `y` terms), which is then
    divided by the number of terms.


    The `RMSProp` optimizer utilizes the magnitude of recent gradients to normalize
    the gradients. Maintain a moving average over the root mean squared (RMS) gradients,
    and then divide that term by the current gradient.


    Although it’s easier to compute the derivative of MSE, it’s also true that MSE
    is more susceptible to outliers, whereas `MAE` is less susceptible to outliers.
    The reason is simple: a squared term can be significantly larger than the absolute
    value of a term. For example, if a difference term is 10, then a squared term
    of 100 is added to MSE, whereas only 10 is added to MAE. Similarly, if a difference
    term is -20, then a squared term 400 is added to MSE, whereas only 20 (which is
    the absolute value of -20) is added to MAE.


    ## Non-Linear Least Squares


    When predicting housing prices, where the dataset contains a wide range of values,
    techniques such as linear regression or random forests can cause the model to
    overfit the samples with the highest values in order to reduce quantities such
    as mean absolute error. In this scenario, you probably want an error metric, such
    as relative error, which reduces the importance of fitting the samples with the
    largest values. This technique is called non-linear least squares, which may use
    a log-based transformation of labels and predicted values. The next section contains
    several code samples, the first of which involves calculating the MSE manually,
    followed by an example that uses NumPy formulas to perform the calculations. Finally,
    we’ll look at a TensorFlow example for calculating the MSE.


    ## CALCULATING THE MSE MANUALLY


    This section contains two line graphs, both of which contain a line that approximates
    a set of points in a scatter plot. The MSE for the line in [Figure 4.7](#11_chapter04.html#fig4_7)
    is computed as follows:


    `MSE = 1*1 + (-1)*(-1) + (-1)*(-1) + 1*1 = 4`


    [Figure 4.7](#11_chapter04.html#fig4_7) displays a line segment that approximates
    a scatter plot of points (some of which intersect the line segment).


    ![image](images/fig4_7.jpg)


