    Listing 2.1 contains the standard import statement and then initializes the variable
    `g` with the current (default) TensorFlow graph. Next, the `with` code block defines
    the TF placeholders `a` and `b`, followed by the TF variable `c` that is the product
    of `a` and `b`. Next, `feed_dict` is initialized with the values 2 and 3 for `a`
    and `b`, respectively, thereby enabling the next `print()` statement to print
    the value of `c`. A portion of the output from launching the code in Listing 2.1
    is here:


    ![image](images/page_49-1.jpg)


    ![image](images/page_50.jpg)


    Later in this chapter you will learn how to use TensorBoard in order to display
    the graph that corresponds to TensorFlow code (such as Listing 2.1).


    ## TF OPERATIONS WITH RANDOM NUMBERS


    TF provides APIs for generating random numbers, such as the TF `tf.random_normal()`
    API that generates random numbers from a normal distribution. Listing 2.2 displays
    the contents of `tf–normal–dist.py` that illustrates how to use the `tf.random_normal()`
    method in a TF graph.


    ***LISTING 2.2: tf-normal-dist.py***


    ![image](images/page_50-1.jpg)


    Listing 2.2 defines the TF variables `w` (initialized with random values) and
    `b` (initialized with hard-coded values). The TF `w` variable has dimensions 784x10,
    whose rows correspond to a “flattened” 28x28 image, and the columns correspond
    to the 10 digits 0 through 9. You will frequently see TF tensors with shape 784x10
    when you work with images in CNNs in TensorFlow (and Keras as well).


    ![image](images/page_51.jpg)


    Listing 2.3 displays the contents of `tf-random-normal.py` that illustrates how
    to use the `tf.random_normal()` method in a TF graph.


    ***LISTING 2.3: tf-random-normal.py***


    ![image](images/page_51-1.jpg)


    Listing 2.3 initializes the `values` variable with the element weights, which
    is initialized as a TF variable that comprises a 6x3 tensor containing randomly
    selected values from a normal distribution. The output from launching the code
    in Listing 2.3 is here:


    ![image](images/page_51-2.jpg)


    ## TF ARRAYS AND MAXIMUM VALUES


    The TF `tf.argmax()` API determines the index values containing maximum values
    on a row-wise basis or on a column-wise basis for a TF tensor. Just to be sure
    you understand the previous statement: the TF `tf.argmax()` API determines the
    index values containing maximum values on a row-wise basis or on a column-wise
    basis for a TF tensor.


    Listing 2.4 displays the contents of `tf-max.py` that illustrates how to find
    the maximum value on a row-wise basis.


    ***LISTING 2.4: tf-max.py***


    ![image](images/page_52.jpg)


    ## TF RANGE() API


    The `range()` API generates a range of numbers between an initial value and a
    final value, where consecutive values differ by the same constant.


