    \n非正式地说，lambda 表达式接收一个输入变量，并对该变量执行某种（由你指定的）操作。例如，这里有一个“骨干型”lambda 表达式，它向输入变量 `x`\
    \ 加 1：\n\n```python\nlambda x: x + 1\n```\n\n你可以在有效的 TensorFlow 代码片段中使用上述 lambda\
