    # THE TF.EVAL() API


    Listing 2.9 displays the contents of `tf-eval.py` that illustrates how to invoke
    the `TF.eval()` API that provides another mechanism for evaluating TF tensors.


    **LISTING 2.9: tf-eval.py**


