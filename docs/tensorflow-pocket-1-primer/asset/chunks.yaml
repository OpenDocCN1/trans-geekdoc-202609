    ## THE TF.ONE_HOT() API (REVISITED)


    [Chapter 1](#08_chapter01.html) contains an example of using the `TF one_hot()`
    API with TF arrays of numbers, and this section describes how to create a “one
    hot” encoding for categorical (i.e., non-numeric) data.


    A feature that contains non-numeric values is called categorical or nominal data.
    Since neural networks expect numeric values as their input values, we must “map”
    non-numeric feature values into a corresponding set of numeric values. The term
    one-hot encoding involves the conversion of each non-numeric value into a vector
    that contains a single 1 (and zeroes elsewhere).


    For example, suppose that we have a color variable the values of which are red,
    green, or blue. The one-hot encoding of this color variable happens to look like
    a 3x3 identity matrix, as shown here:


    ![image](images/page_67.jpg)


    Now, suppose that you have a dataset with six rows of data the color values of
    which are red, green, blue, red, green, and blue. Then the six rows would contain
    the following values (let’s ignore the values of the other elements of these six
    rows):

    '
  raw: 'This truncated interval is the interval from which random numbers are selected.
    Specifically, randomly generate a number and include that number in the “result”
    set if it’s *inside* the “truncated” normal distribution. However, if the randomly
    chosen value lies *outside* the truncated normal distribution, regenerate the
    value (and do so repeatedly if it’s necessary) until it’s *inside* the truncated
    normal distribution, after which the number is included in the “result” set.


    The tf.truncated\_normal() API helps to prevent (or at least reduce) saturation
    that can occur with the sigmoid function: neurons stop “learning” if saturation
    occurs.


