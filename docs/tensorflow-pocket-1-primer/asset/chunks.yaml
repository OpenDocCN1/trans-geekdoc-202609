    # TF.SIZE(), TF.SHAPE(), AND TF.RANK() API


    这三个 TensorFlow API 之间某种关联，因此它们包含在同一个章节中以便参考。


    `tf.size()` API 返回 TF 张量中的元素数量。这里有一个简单的示例：


    ```python

    t = tf.constant([[[1,1,1],[2,2,2]],[[3,3,3],[4,4,4]]])

    tf.size(t) # 12

    ```


    本质上，忽略方括号并计算元素数量即可得出答案。`tf.shape()` API 返回 TF 张量的形状，即每个“维度”上的元素数量。这里有一个简单的示例：


    ```python

    t = tf.constant([[[1,1,1],[2,2,2]],[[3,3,3],[4,4,4]]])

    tf.shape(t) # [2, 3]

    ```


    `tf.rank()` API 返回选择张量每个元素所需的索引数量。rank 也称为“阶数”、“度”或“ndims”。这里有一个简单的示例：


    ```python

    # the shape of ''t'' is [2, 3]

    t = tf.constant([[[1,1,1],[2,2,2]],[[3,3,3],[4,4,4]]]]

    tf.rank(t) # 3

    ```


    注意，张量的 rank 不等于矩阵的 rank。你最初可能认为前一个示例中的 rank 是 4 而不是 3，因为很容易忽略嵌套括号的数量。这里显示了显示上述
    TF 的更简单的方法：


    ![image](img/page_56.jpg)


