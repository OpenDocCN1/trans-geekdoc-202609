- fmt: "\nIf this is the first time you have encountered the concept of an activation\
    \ function, it’s probably confusing, so here’s an analogy that might be helpful.\
    \ Suppose you’re driving your car late at night and there’s nobody else on the\
    \ highway. You can drive at a constant speed for as long as there are no obstacles\
    \ (stop signs, traffic lights, and so forth). On the other hand, suppose you drive\
    \ into the parking lot of a large grocery store. When you approach a speed bump\
    \ you must slow down, cross the speed bump, and increase speed again, and repeat\
    \ this process for every speed bump.\n\nThink of the non-linear activation functions\
    \ in a neural network as the counterpart to the speed bumps: you simply cannot\
    \ maintain a constant speed, which (by analogy) means that you cannot first multiply\
    \ all the weight matrices together and “collapse” them into a single weight matrix.\
    \ Another analogy involves a road with multiple toll booths: you must slow down,\
    \ pay the toll, and then resume driving until you reach the next toll booth. These\
    \ are only analogies (and hence imperfect) to help you understand the need for\
    \ non-linear activation functions.\n\n## Common Activation Functions\n\nAlthough\
    \ there are many activation functions (and you can define your own if you know\
    \ how to do so), here is a list of common activation functions, followed by brief\
    \ descriptions:\n\n• `Sigmoid`\n• `Tanh`\n• `ReLU`\n• `ReLU6`\n• `ELU`\n• `SELU`\n\
    \nThe `sigmoid` activation function is based on Euler’s constant `e`, with a range\
    \ of values between 0 and 1, and its formula is shown here:\n\n1\\[1+e^(-x)\\\
    ]\n\nThe `tanh` activation function is also based on Euler’s constant `e`, and\
