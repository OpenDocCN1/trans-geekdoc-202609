    expressions, along with some simple code samples. This section also introduces
    you to several types of iterators in TensorFlow, including “one shot” iterators
    and “reiterable” iterators.


    The second part of this chapter discusses TextLineDatasets, which are very convenient
    for working with text files. The code samples in this section also use two of
    the four types of iterators that are discussed in the previous section.


    The third part of this chapter discusses so-called “intermediate” or “lazy” operators,
    such as filter(), flatmap(), and map() operators. You can use *method chaining*
    in order to combine these operators, resulting in powerful code combinations that
    can significantly reduce the complexity of your TensorFlow code.


    The final portion of the chapter briefly discusses TF estimators, which are implementations
    of various machine learning algorithms, as well as TF layers that provide an assortment
    of classes for Dense Neural Networks (DNN) and (Convolutional Neural Networks
    (CNN).


    **TENSORFLOW DATASETS**


    TensorFlow Datasets (accessible via the namespace tf.data.Dataset) are well-suited
    for creating asynchronous and optimized data pipelines. In brief, the TF Dataset
    API loads data from the disk (both images and text), applies optimized transformations,
    creates batches, and sends the batches to the GPU. Hence, the TF Dataset API is
    good for better GPU utilization. In addition, use tf.functions in TF 2.0 to utilize
    dataset asynchronous prefetching/streaming features fully.


    A TF Dataset acts as a container-like “wrapper” around a dataset, somewhat analogous
    to a Pandas DataFrame. A very large dataset can therefore involve a very large
    TF Dataset. A TF Dataset can also represent an input pipeline as a collection
    of elements (i.e., a nested structure of tensors), along with a “logical plan”
    of transformations that act on those elements. For example, you can define a TF
    Dataset that initially contains the lines of text in a text file, then extract
    the lines of text that start with a “#” character, and then display only the first
    three lines. Creating this pipeline is easy: create a TF Dataset and then chain
    the lazy operators filter() and take(), which is similar to an example that you
    will see later in this chapter.


    **Basic Steps for TensorFlow** Datasets


    Perform the following three steps in order to create and process the contents
    of a TF Dataset:


    1.Import Data


    2.Create an Iterator


    3.Consume the Data


    There are many ways to populate a TF Dataset with data that can be retrieved from
    multiple sources. For simplicity, the code samples in the first part of this chapter
    perform the following steps: first create a TF Dataset instance with an initialized
    NumPy array of data; second, define an iterator instance in order to iterate through
    the TF Dataset; and third, use the iterator to access the elements of the dataset
    (and, in some cases, supply those elements to a TF model).


    **A Simple TensorFlow Dataset**


    Listing 3.1 displays the contents of tf-numpy-dataset.py, which illustrate how
    to create a TF Dataset from a NumPy array of numbers. Although this code sample
    is minimalistic, it’s the starting point in various other code samples in this
    chapter.


    ***LISTING 3.1: tf-numpy-dataset.py***


    ![image](images/page_77-2.jpg)


    Listing 3.1 contains two import statements and then initializes the variable x
    as a NumPy array with the integers from 0 through 9 inclusive. The variable dataset
    is initialized as a TF Dataset that’s based on the contents of the variable x.


    Note that nothing else happens in Listing 3.1: later you will see more meaningful
    code samples involving TF Datasets.


    **TENSORFLOW RAGGED CONSTANTS AND TENSORS (OPTIONAL)**


    The section is marked “optional” because the code samples require TF 2. If you
    launch the code samples using TF 1.x, you will see the following error message:


    ![image](images/page_77-3.jpg)


    As you probably know, every element in a multi-dimensional array has the same
    dimensions. For example, a 2x3 array contains two rows and three columns: each
    row is a 1x3 vector, and each column is a 2x1 vector. As another example, a 2x3x4
    array contains two 3x4 arrays (and the same logic applies to each 3x4 array).


    On the other hand, a *ragged constant* is a set of elements that has different
    lengths. You can think of ragged constants as a generalization of “regular” datasets.


    Listing 3.2 displays the contents of tf-raggedtensors1.py, which illustrates how
    to define a ragged dataset and then iterate through its contents.


    ***LISTING 3.2: tf-raggedtensors1.py***


    ![image](images/page_77.jpg)


    Listing 3.2 defines two ragged constants digits and words consisting of integers
    and strings, respectively. The remaining portion of Listing 3.2 is five print()
    statements that applies various operations to these two datasets and then displays
    the results.


    The first print() statement adds the value 3 to every number in the digits dataset,
    and the second print() statement computes the row-wise average of the elements
    of the digits dataset because axis=1 (whereas axis=0 performs column-wise operations).


    The third print() statement appends the element \[\[5,3\]\] to the digits dataset,
    and performs this operation in a column-wise fashion (because axis=0). The fourth
    print() statement “doubles” each non-empty element of the digits dataset. Finally,
    the fifth print() statement extracts the first two characters from each string
    in the words dataset.


    The output from launching the code in Listing 3.2 is here:


    ![image](images/page_78.jpg)


    Listing 3.3 displays the contents of tf-ragged-tensors.py that illustrates how
    to define a ragged tensor in TensorFlow.'
