    ### SUMMARY


    This chapter introduced you to linear regression, and a brief description of how
    to calculate a best-fitting line for a dataset of values in the Euclidean plane.
    You saw how to perform linear regression using `NumPy` in order to initialize
    arrays with data values, along with a “perturbation” technique that introduces
    some randomness for the `y` values. This technique is useful because you will
    know the correct values for the slope and y-intercept of the best-fitting line,
    which you can then compare with the trained values.


    You then learned how to perform linear regression in code samples that involve
    TensorFlow. In addition, you saw how to use `Matplotlib` in order to display line
    graphs for best-fitting lines and graphs that display the cost versus the number
    of iterations during the training-related code blocks. Finally, you saw how to
    use a `tf.estimator` class in order to train a linear model.


