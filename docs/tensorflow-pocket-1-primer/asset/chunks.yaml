    TensorFlow 2 will probably be released around mid-2019, at which point TensorFlow
    1.x will become legacy code (as mentioned in the introduction). One of the most
    significant changes involves “eager” execution as the default mode instead of
    “deferred” execution mode.


    ## Why use TF 1.x Instead of TF 2?


    There are several reasons for staying with TF 1.x instead of switching to TF 2.
    First, as this book goes to print, TF 2 has not been released. Second (and perhaps
    even more important), currently there is a very small percentage of online TensorFlow
    code samples that use eager execution. Fortunately, Google will provide tools
    for converting TF 1.x code to TF 2 that will assist in many situations, i.e.,
    when there is a straightforward conversion from TF 1.x APIs to TF 2 APIs. When
    those tools cannot perform the conversion, there will probably be an assortment
    of online tutorials available that will explain how to make the conversion.


    Third, there is a massive code base that uses TF 1.x, which includes many customers
    and even Google itself. The conversion process from TF 1.x to TF 2 will take a
    lot of time because some (probably large) companies will be slow to make the transition.
    As an analogy, consider the migration from Python 2.x to Python 3.x: there are
    still many places that continue using Python 2.x, even though Python 3.x was released
    several years ago (and also the “end of life” for Python 2.x in 2020).


    There is one possible exception: if you are “brand new” to TensorFlow and you
    do not have an urgent need to learn TensorFlow, then it might be less work for
    you to wait until a production version of TF 2 is available.


    ## WHAT IS A TENSORFLOW TENSOR?


    In simplified terms, a TF tensor is an n-dimensional array that is similar to
    a NumPy ndarray. A TF tensor is defined by its dimensionality, as summarized here:


    | scalar number: | a zeroth-order tensor |

    | --- | --- |

    | vector: | a first-order tensor |

    | matrix: | a second-order tensor |

    | 3-dimensional array: | a 3rd order tensor |


    As you will see in subsequent sections, TensorFlow supports various data types
    and primitive types. In addition to constants and variables, TensorFlow provides
    a data type called a “placeholder,” which acts as a buffer that holds transient
    data. Use TF variables for things that need to be trained, such as the slope `m`
    and intercept `b` of a best-fitting line in the plane.


    ## TensorFlow Data Types


    TensorFlow supports the following data types:


    - `tf.float32`

    - `tf.float64`

    - `tf.int8`

    - `tf.int16`

    - `tf.int32`

    - `tf.int64`

    - `tf.uint8`

    - `tf.string`

    - `tf.bool`


    The data types in the preceding list are self-explanatory: two floating point
    types, four integer types, one unsigned integer type, one string type, and one
    Boolean type. As you can see, there is a 32-bit and a 64-bit floating point type,
    and integer types that range from 8-bit through 64-bit.


    ## TensorFlow Primitive Types


    TensorFlow supports the following primitive types (arrays are discussed later):


    ### TF Constants

    - TF Placeholders

    - TF Variables


    A TensorFlow `constant` is an immutable value, and a simple example is shown here:

    ```

    aconst = tf.constant(3.0)

    ```


    A TensorFlow `placeholder` allocates space for data, and it’s somewhat analogous
    to a “buffer” in other languages, such as C. The really nice aspect of TF placeholders
    is that they do not need to specify their shape: they “automagically” assume the
    shape of the data that is assigned to them. A simple example of a TensorFlow placeholder
    is shown here:

    ```

    a = tf.placeholder("float")

    b = tf.placeholder("float")

    c = tf.multiply(a,b)

    ```

    As you can see in the preceding block, `c` is defined as the product of `a` and
    `b`, which do not have a value. Use `feed_dict` to assign values to placeholder,
    as shown here:

    ```

    a = tf.placeholder("float")

    b = tf.placeholder("float")

    c = tf.multiply(a,b)

    feed_dict = {a:2, b:3}

    ```

    The calculation of `c` itself is shown later in the section that discusses sessions.


    A TensorFlow `variable` is a “trainable value” in a TensorFlow graph. For example,
    the slope `m` and intercept `b` of a best-fitting line in the plane are two trainable
    values. Some examples of TF variables are shown here:

    ```

    b = tf.Variable(3, name="b")

    x = tf.Variable(2, name="x")

    z = tf.Variable(5, name="z")

    W = tf.Variable(2)

    lm = tf.Variable(W + b, name="lm")

    ```

    Notice that `b`, `x`, and `W` are assigned numeric values, whereas `z` and `lm`
    are defined as expressions. Specifically, the value of the variable `z` depends
    on the value of `x` (which equals 2), and the value of the variable `lm` depends
    on the values of `W` and `b`. Both `z` and `lm` are evaluated inside a TensorFlow
    “session”, as shown in a later section.


    ## TENSORFLOW GRAPHS


    Whenever you define TensorFlow code in a Python script, you will often use some
    combination of TF data types and other constructs. Before executing TensorFlow
    code, TensorFlow generates a graph structure based on the constants, placeholders,
    and variables that you have defined. A typical TensorFlow graph consists of the
    following:


    - Graph: graph of operations (DAG)

    - Sessions: contains graph(s)

    - lazy execution (default)

    - operations in parallel (default)

    - Nodes: operators/variables/constants

    - Edges: tensors


    TF 1.x graphs are split into subgraphs and executed in parallel (or multiple CPUs
    or GPUs, if the latter are available). The chapters in this book contain an assortment
    of TensorFlow code samples written in Python that illustrate how to perform arithmetic
    operations, calculate trigonometric values, and how to use eager execution.


    ## The TensorFlow Version Number


    Listing 1.1 displays the contents of `tf-version.py` that illustrates how to find
    the version number of TensorFlow is installed on your machine.


    ### LISTING 1.1: tf-version.py

    ```

    import tensorflow as tf

    print(''TF version:'',tf.__version__)

    ```

    Listing 1.1 contains an import statement and one `print()` statement that displays
    the installed version of TensorFlow. The output from Listing 1.1 is here:

    `(''TF version:'', ''1.12.0'')`


    Listing 1.1 consists of two statements: an import statement for TensorFlow followed
    by a `print()` statement that displays the version of TensorFlow that is installed
    on your machine. The output from Listing 1.1 is here (the number depends on the
    version of TensorFlow you installed on your machine):

    `TF version: 1.12.0`


    ## A TENSORFLOW GRAPH WITH TF.SESSION()


    A Tensorflow graph in TF 1.x consists of two parts: TensorFlow code in the first
    portion of a Python script, followed by an instance of a `tf.Session()` object
    (often abbreviated as `sess`). In order to obtain values from TF tensors, you
    invoke the `sess.run()` method and specify a TF tensor as an argument to the `sess.run()`
    method. By contrast, TF 2 does not require an instance of `tf.Session()`, and
    it’s more “Pythonesque” than TF 1.x.


    In extremely simple cases of TF 1.x code, such as displaying the version number
    of TensorFlow, you do not need a `tf.Session()` object.


    Listing 1.2 displays the contents of `tf-session.py` that illustrates how to use
    the `tf.Session()` object in a TF graph.


    ### LISTING 1.2: tf-session.py

    ```

    import tensorflow as tf

    aconst = tf.constant(3.0)

    print(aconst)

    # output: Tensor("Const:0", shape=(), dtype=float32)

    sess = tf.Session()

    print(sess.run(aconst))

    # output: 3.0

    sess.close()

    # => there''s a better way…

    Listing 1.2 starts with an import statement, the definition of the TF constant
    `aconst`, and one `print()` statement that displays the metadata for `aconst`.
    The next portion of Listing 1.2 initializes the variable `sess` as an instance
    of the `tf.Session` class, followed by a `print()` statement that display the
    value of the variable `aconst`. The output from Listing 1.2 is here:

    `3.0`


    Listing 1.3 displays the contents of `tf-session2.py` that illustrates how to
    use the `tf.Session()` object in a TF graph.


    ### LISTING 1.3: tf-session2.py

    ```

    import tensorflow as tf

    aconst = tf.constant(3.0)

    print(aconst)

    ```

