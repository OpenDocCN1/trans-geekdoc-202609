    ## WORKING WITH KERAS


    As mentioned in the introduction, this section provides a very brief introduction
    to Keras that will give you the bare minimum for creating Keras-based models (indeed,
    entire books are devoted to Keras).


    If you are new to Keras, there are a couple of points to keep in mind. First,
    Keras is integrated into the latest versions of TF 1.x as well as a core part
    of TF 2, located in the `tf.keras` namespace. Second, Keras is well-suited for
    defining models to solve a myriad of tasks, such as linear regression and logistic
    regression, as well as Deep Learning tasks involving CNNs, RNNs, and LSTMs.


    A Keras model generally involves at least the following sequence of steps:


    * Specify a dataset (if necessary, convert data to numeric data)

    * Split the dataset into training data and test data (usually 80/20 split)

    * Define the Keras model (`tf.keras.models.Sequential()`)

    * Compile the Keras model (the `compile()` API)

    * Train (fit) the Keras model (the `fit()` API)

    * Make a prediction (the `prediction()` API)


    Note that the preceding bullet items skip some steps that are part of a real Keras
    model, such as evaluating the Keras model on the test data, as well as dealing
    with issues such as overfitting.


    The first bullet item states that you need a dataset, which can be as simple as
    a CSV file with 100 rows of data (and just 3 columns). In general, a dataset is
    substantially larger: it can be a file with 1,000,000 rows of data and 10,000
    columns in each row. We’ll look at a concrete dataset in a subsequent section.


    Next, a Keras model is in the `tf.keras.models` namespace, and the simplest (and
    also very common) Keras model is `tf.keras.models.Sequential`. In general, a Keras
    model contains layers that are in the `tf.keras.layers` namespace, such as `tf.keras.Dense`
    (which means that two adjacent layers are fully connected).


    The activation functions that are referenced in Keras layers are in the `tf.nn`
    namespace, such as `tf.nn.ReLU` for the ReLU activation function.


    Here’s a code block of the Keras model that’s described in the preceding paragraphs
    (which covers the first four bullet points):


    ![image](images/page_157.jpg)


    We have three more bullet items to discuss, starting with the compilation step.
    Keras provides a `compile()` API for this step, an example of which is here:


    ![image](images/page_157-1.jpg)


    Next we need to specify a training step, and Keras provides the `fit()` API (as
    you can see, it’s not called `train()`), an example of which is here:


    ```

    model.fit(x_train, y_train, epochs=5)

    ```


    The final step is the prediction, and Keras provides the `predict()` API, an example
    of which is here:


    ```

    pred = model.predict(x)

    ```


    Listing 5.4 displays the contents of `tf-basic-keras.py` that combines the code
    blocks in the preceding steps.


