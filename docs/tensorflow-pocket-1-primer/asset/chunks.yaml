    \n('val:', 3)\n\n('val:', 4)\n\n('val:', 5)\n\n('val:', 6)\n\n('val:', 7)\n\n\
    ('val:', 8)\n\n('val:', 9)\n\n**WHAT ARE ITERATORS?**\n\nAn *iterator* is similar\
    \ to a “cursor” in other languages. You can think of an iterator as something\
    \ that “points” to an item in a dataset. By way of analogy, if you have a linked\
    \ list of items, an iterator is analogous to a pointer that “points” to the first\
    \ element in the list, and each time you move the pointer to the next item in\
    \ the list, you are “advancing” the iterator.\n\nWorking with datasets and iterators\
    \ involves the steps:\n\n1.create a dataset\n\n2.create an iterator (see next\
    \ section)\n\n3.“point” the iterator to the dataset\n\n4.print the contents of\
    \ the current item\n\n5.“advance” the iterator to the next item\n\n6.go to Step\
    \ 4 if there are more items\n\nNotice that Step 6 specifies “if there are more\
    \ items,” which you can handle via a try/except block (shown later in this chapter)\
    \ when the iterator goes beyond the last item in the dataset. This technique is\
    \ very useful because it obviates the need to know the number of items in a dataset.\
    \ TensorFlow provides several types of iterators, as discussed in the next section.\n\
    \n**TensorFlow Iterators**\n\nTensorFlow supports four types of iterators, as\
    \ listed here:\n\n1.One shot\n\n2.Initializable\n\n3.Reinitializable\n\n4.Feedable\n\
    \nA *one-shot iterator* can iterate only once through a dataset. After we reach\
    \ the end of the dataset, the iterator will no longer yield elements; instead,\
    \ it will raise an Exception. For example, if dx is an instance of tf.data.Dataset,\
    \ then the following code snippet defines a one-shot iterator:\n\niterator = dx.make\\\
    _one\\_shot\\_iterator()\n\nAn *initializable iterator* can be dynamically updated:\
    \ invoke its initializer operation and pass new data via the parameter feed\\\
    _dict. If dx is an instance of tf.data.Dataset, then the following code snippet\
    \ defines a reusable iterator:\n\niterator = dx.make\\_initializable\\_iterator()\n\
    \nA *reinitializable iterator* can be initialized from a different Dataset. This\
    \ type of iterator is very useful for training datasets that require some additional\
    \ transformation, such as shuffling its contents.\n\nA *feedable iterator* allows\
    \ you to select from different iterators: this type of iterator is essentially\
    \ a “selector” to select an iterator from a collection of iterators.\n\nThe code\
    \ samples in this chapter involve either one-shot iterators or Initializable iterators.\
    \ The next section contains a code sample that illustrates how to define a TF\
    \ Dataset and a reusable iterator in TensorFlow.\n\n**TENSORFLOW REUSABLE ITERATORS**\n\
    \nListing 3.5 displays the contents of tf-init-iterator.py, which illustrates\
    \ how to define a reusable iterator in TensorFlow.\n\n***LISTING 3.5: tf-init-iterator.py***\n\
    \n![image](images/page_82.jpg)\n\nListing 3.5 initializes the variable x as NumPy\
    \ array consisting of the integers from 0 through 9 inclusive. Next, the variable\
    \ dx is initialized as a TF Dataset that is created from the contents of the variable\
    \ x. The next code snippet defines the variable iterator as an “initializable”\
    \ iterator, followed by the variable next\\_element that is populated with the\
    \ first integer in dx (which is the integer 0).\n\nThe final portion of Listing\
    \ 3.5 involves a for loop that iterates through the elements of dx and displays\
    \ their values. Notice that the loop iterates through 15 values, whereas dx contains\
    \ only 10 elements. What will happen?\n\nThe answer lies in the conditional logic\
    \ in the for loop: when the variable i equals 9, the iterator variable is “reset”\
    \ to its initial value, thereby preventing an error. You can test this situation\
    \ by “commenting out” the if statement, and when you launch the code you will\
    \ see the following error message:\n\nOutOfRangeError (see above for traceback):\
    \ End of sequence  \n\n\\[\\[node IteratorGetNext (defined at tf-init-iterator.py:11)\
    \ \\]\\]"
