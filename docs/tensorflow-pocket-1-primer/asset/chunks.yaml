    ### What are tf.layers?


    The `tf.layers` namespace contains an assortment of classes for the layers in
    Neural Networks, including DNNs and CNNs. Some of the more common classes in `tf.layers`
    are listed below:


    - `BatchNormalization`: Batch Normalization

    - `Conv2D`: 2D convolution layer (e.g., spatial convolution over images)

    - `Dense`: Densely-connected layer

    - `Dropout`: Applies dropout to the input

    - `Flatten`: Flattens an input while preserving the batch axis (axis 0)

    - `Layer`: Base layer class

    - `MaxPooling2D`: Max pooling layer for 2D inputs (e.g., images)


    For example, a minimalistic CNN starts with a “triple” that consists of a `Conv2D`
    layer, followed by `ReLU` (Rectified Linear Unit) activation function, and then
    a `MaxPooling2D` layer. If you see this triple appear a second time, followed
    by two `Dense` layers and then a `softmax` activation function, it’s known as
    “LeNet.”


    A bit of trivia: In the late 1990s, when people deposited cheques at an automated
    bank machine, LeNet scanned the contents of those cheques to determine the digits
    of the cheque amount (of course, customers had to confirm that the number determined
    by LeNet was correct). LeNet had an accuracy rate around 90%, which is a very
    impressive result for such a simple convolutional neural network!


    ### Other Useful Parts of TensorFlow


    In addition to the classes in the previous sections, TensorFlow provides a number
    of other useful namespaces, including the following list


    - `tf.data`

    - `tf.linalg`

    - `tf.lite`

    - `tf.losses`

    - `tf.math`

    - `tf.nn`

    - `tf.random`

    - `tf.saved_model`

    - `tf.test`

    - `tf.train`

    - `tf.version`


    The `tf.data` namespace contains the `tf.data.Dataset` namespace, which contains
    classes that are discussed in the first half of this chapter; the `tf.linalg`
    namespace contains an assortment of classes that perform operations in linear
    algebra; the `tf.lite` namespace contains classes for mobile application development.


    The `tf.math` namespace contains classes for trigonometric calculations; the `tf.nn`
    namespace contains classes for batch normalization, RNNs, dropout rate, and max
    pooling. Read the extensive online documentation for more details regarding these
    (and other classes) in TensorFlow.


    ### WHAT IS A TFRECORD?


    A TFRecord is a file that describes the data required during the training phase
    and the testing phase of a model. There are two protocol buffer message types
    available for a TFRecord: the `Example` message type and the `SequenceExample`
    message type. These protocol buffer message types enable you to arrange data as
    a map from string keys to values that are lists of integers, 32-bit floats, or
    bytes.

