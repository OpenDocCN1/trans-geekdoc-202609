    vector by invoking the TensorFlow `tf.nn.sigmoid()` method to the result of multiplying
    the input vector `X` with the `hidden_weights1` matrix (and then adding the bias
    vector `b`). The second line of code multiplies `hidden_layer` and `ow`, and then
