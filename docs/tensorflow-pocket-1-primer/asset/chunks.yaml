    the data required during the training phase and the testing phase of a model.


    CHAPTER 4


    *LINEAR REGRESSION*


    This chapter introduces linear regression, along with code samples of linear regression:
    first with NumPy APIs, and then with TensorFlow APIs. The code samples use an
    “incremental” approach, starting with simple examples that involve Python and
    NumPy code (often using the NumPy linspace() API). Then you will see comparable
    code samples involving TensorFlow code. In addition, the samples in the second
    half of the chapter usually involve concepts from the first half of the chapter.


    The first part of this chapter briefly discusses the basic concepts involved in
    linear regression. Although linear regression was developed more than 200 years
    ago, this technique is still one of the “core” techniques for solving (albeit
    simple) problems in statistics and machine learning. In fact, the technique known
    as “mean squared error” (MSE) for finding a best-fitting line for data points
    in a 2D plane (or a hyperplane for higher dimensions) is implemented in Python
    and TensorFlow in order to minimize so-called “cost” functions that are discussed
    later.


    The second section in this chapter contains additional code samples involving
    linear regression tasks using standard techniques in NumPy. Hence, if you are
    comfortable with this topic, you can probably skim quickly through the first two
    sections of this chapter. The third section shows you how to solve linear regression
    using TensorFlow.


    **WHAT IS LINEAR REGRESSION?**


    The goal of linear regression is to find the best-fitting line that “represents”
    a dataset. Keep in mind two key points. First, the best-fitting line does not
    necessarily pass through all (or even most of) the points in the dataset. The
    purpose of a best-fitting line is to minimize the distance of that line from the
    points in the dataset. Second, linear regression does not determine the best-fitting
    polynomial: the latter involves finding a higher-degree polynomial that passes
    through many of the points in a dataset.


    Moreover, a dataset in the plane can contain two or more points that lie on the
    same *vertical* line, which is to say that those points have the same x value.
    However, a function *cannot* pass through such a pair of points: if two points
    (x1,y1) and (x2,y2) have the same x value, then they must have the same y value
    (i.e., y1=y2). On the other hand, a function can have two or more points that
    lie on the same *horizontal* line.


    Now consider a scatter plot with many points in the plane that are sort of “clustered”
    in an elongated cloud-like shape: a best-fitting line will probably intersect
    only limited number of points (in fact, a best-fitting line might not intersect
    *any* of the points).


    One other scenario to keep in mind: suppose a dataset contains a set of points
    that lie on the same line. For instance, let’s say the x values are in the set
    {1,2,3,...,10} and the y values are in the set {2,4,6,...,20}. Then the equation
    of the best-fitting line is y=2\*x+0. In this scenario, all the points are *collinear*,
    which is to say that they lie on the same line.


    **Linear Regression versus Curve-Fitting**


    Suppose a dataset consists of n data points of the form (x, y), and no two of
    those data points have the same x value. Then there is a polynomial of degree
    less than or equal to n-1 that passes through those n points (if you are really
    interested, you can find a mathematical proof of this statement in online articles).
    For example, a line is a polynomial of degree one and it can intersect any pair
    of non-vertical points in the plane. For any triple of points (that are not all
    on the same line) in the plane, there is a quadratic equation that passes through
    those points.


    In addition, sometimes a lower degree polynomial is available. For instance, consider
    the set of 100 points in which the x value equals the y value: in this case, the
    line y \= x (which is a polynomial of degree one) passes through all 100 points.


    However, keep in mind that the extent to which a line “represents” a set of points
    in the plane depends on how closely those points can be approximated by a line,
    which is measured by the *variance* of the points (the variance is a statistical
    quantity). The more collinear the points, the smaller the variance; conversely,
    the more “spread out” the points are, the larger the variance.


    **When are Solutions Exact Values?**


    Although statistics-based solutions provide closed-form solutions for linear regression,
    neural networks provide *approximate* solutions. This is due to the fact that
    machine learning algorithms for linear regression involve a sequence of approximations
    that “converges” to optimal values, which means that machine learning algorithms
    produce estimates of the exact values. For example, the slope m and y-intercept
    b of a best-fitting line for a set of points a 2D plane have a closed-form solution
    in statistics, but they can only be approximated via machine learning algorithms
    (exceptions do exist, but they are rare situations).'
