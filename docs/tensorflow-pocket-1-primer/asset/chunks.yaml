    ## 总结


    本章向您介绍了 TensorFlow、其架构以及作为 TensorFlow“家族”一部分的一些工具。然后，您学习了如何创建一个包含 TensorFlow 常量、占位符和变量的
    TensorFlow 图。您还学习了如何执行 TensorFlow 算术操作以及一些内置函数。


    接下来，您学习了如何计算三角值、如何使用 `for` 循环、`while` 循环以及如何计算指数值。您还看到了如何对数组执行各种操作，例如创建单位矩阵。


    您还学习了如何保存 TensorFlow 图，并使用从命令行启动 `TensorBoard` 工具在浏览器中查看其内容。


    # 第 2 章


    ## 有用的 TensorFlow API


    本章重点介绍在许多 TensorFlow 代码示例中用到的 TensorFlow API。事实上，您将在涉及超出本书范围的复杂 TensorFlow 代码示例中使用这些
    API。


    整个章节关于 API 的章节似乎内容很“枯燥”，但理由很简单：如果您继续学习 TensorFlow，就需要本章中的所有 API。因此，将这些 API 集中在一个章节中更容易查找。在读完本章后，您将为后续章节中使用这些
    API 的代码示例做好更充分的准备。


    显然，您“不需要”通读本章，即使您是 TensorFlow 新手。但是，值得浏览本章以留意所讨论的 TensorFlow API。这样做可以让您对本章有一个概括性的了解，当您遇到使用这些
    API 的代码时，可以阅读关于这些 API 的相应章节。


    本章的第一部分简要介绍了一些 TensorFlow 特性，例如快速执行（其语法比常规的 TensorFlow 语法更像 Python）以及张量操作（例如张量相乘）。该部分还展示了如何在
    TensorFlow 中创建 `for` 循环和 `while` 循环。回顾第 1 章，TensorFlow 2 使用快速执行作为默认执行方式，而 TensorFlow
    1.x 使用延迟执行。在本书出版时，TensorFlow 2 尚未发布，这意味着书中的代码示例适用于 TensorFlow 1.x。


    本章的第二部分包含一组 TensorFlow 代码示例，向您展示如何使用机器学习中常用的各种 API。具体而言，您将看到如何使用 `tf.random_normal()`
    API 生成随机数（这对于初始化神经网络边的权重非常有用）；使用 `tf.argmax()` API 找到每行（或每列）中最大值的索引，用于计算涉及各种算法的训练过程的准确率；以及
    `tf.range()` API，它与在 第 1 章 中见过的 `np.linspace()` API 类似。


