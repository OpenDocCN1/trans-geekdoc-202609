    ### WORKING WITH TF.ESTIMATOR MODELS


    When you create a `tf.estimator` model, you specify the input data via an “input
    function” called `input_fn`. This function, which returns a `tf.data.Dataset`
    of batches of data, is invoked from `tf.estimator.Estimator` methods as `train`
    and `evaluate`. The input function returns the following values:


    - `features`: A dict from feature names to `Tensors` or `SparseTensors` with batches
    of features

    - `labels`: A Tensor containing batches of labels


    The keys of the `features` are used to configure the model’s input layer. Note:
    the input function is called while constructing the TensorFlow graph, *not* while
    running the graph. It is returning a representation of the input data as a sequence
    of TensorFlow operations.


