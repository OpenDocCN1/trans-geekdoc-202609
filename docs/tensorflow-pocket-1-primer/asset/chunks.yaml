    ## 使用 KERAS


    如引言所述，本节对 Keras 进行了非常短的介绍，将为你提供创建基于 Keras 模型所需的最少知识（事实上，有整本书的书都在介绍 Keras）。


    如果你是 Keras 的初学者，有几点需要记住。首先，Keras 已经集成到 TF 1.x 的最新版本中，并作为 TF 2 的核心部分，位于 `tf.keras`
    命名空间下。其次，Keras 非常适合定义模型来解决各种任务，例如线性回归和逻辑回归，以及涉及 CNN、RNN 和 LSTM 的深度学习任务。


    一个 Keras 模型通常至少涉及以下步骤：


    *   指定数据集（如有必要，将数据转换为数值数据）

    *   将数据集拆分为训练数据和测试数据（通常采用 80/20 分 split）

    *   定义 Keras 模型 (`tf.keras.models.Sequential()`)

    *   编译 Keras 模型（使用 `compile()` API）

    *   训练（fit）Keras 模型（使用 `fit()` API）

    *   进行预测（使用 `prediction()` API）


    注意，上述列表项目跳过了一些实际 Keras 模型包含的步骤，例如在测试数据上评估 Keras 模型，以及处理过拟合等问题。


    第一个列表项目说明你需要一个数据集，它可以简单到如一个包含 100 行数据的 CSV 文件（仅 3 列）。通常情况下，数据集要大得多：它可以是一个包含 1,000,000
    行数据和每行 10,000 列的文件。我们将在后续章节中查看一个具体的数据。


    接下来，Keras 模型位于 `tf.keras.models` 命名空间，最简单（也是最）的 Keras 模型是 `tf.keras.models.Sequential`。通常，Keras
    模型包含位于 `tf.keras.layers` 命名空间的层，例如 `tf.keras.Dense`（这意味着两个相邻层是全连接的）。


    Keras 层中引用的激活函数位于 `tf.nn` 命名空间，例如用于 ReLU 激活函数的 `tf.nn.ReLU`。


    以下是上述段落描述的 Keras 模型代码块（涵盖了前四个列表点）：


    ![image](img/page_157.jpg)


    我们还有三个点需要讨论，从编译步骤开始。Keras 为此步骤提供了 `compile()` API，示例在此：


    ![image](img/page_157-1.jpg)


    接下来我们需要指定训练步骤，Keras 提供了 `fit()` API（如你所见，它不叫 `train()`），示例在此：


    ```

    model.fit(x_train, y_train, epochs=5)

    ```


    最后一步是预测，Keras 提供了 `predict()` API，示例在此：


    ```

    pred = model.predict(x)

    ```


    列表 5.4 显示了 `tf-basic-keras.py` 的内容，结合了前面的步骤代码块。


    ## 使用 KERAS 和 MNIST 数据集


    列表 5.5 显示了 `tf-simple-keras.py` 的内容，向你展示如何创建一个基于 Keras 的模型。


    列表 5.5 包含新代码，它初始化 `mnist` 数据集，然后分别用训练数据和测试数据填充 `x_train`、`y_train`、`x_test` 和
    `y_test`。每对中的第一个变量引用图像，而每对中的第二个变量引用图像对应的标签。


    注意 `x_train` 和 `y_train` 中的值被按 255 的因子缩小了，这意味着值在 0 到 1 之间，而不是 0 到 255（后者是允许的像素值）。你可能会问为什么要。令人惊讶的是，也可能不符合直觉，当输入值在
    0 到 1 之间时，模型的表现更好。


