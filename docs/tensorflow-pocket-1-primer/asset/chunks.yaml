    **SUMMARY**


    This chapter started with an overview of activation functions, why they are important
    in neural networks, and also how they are used in neural networks. Then you saw
    a list of the TensorFlow APIs for various activation functions, followed by a
    description of some of their merits.


    Next, you saw an overview of Logistic Regression, followed by a TensorFlow code
    sample involving Logistic Regression (and also uses the sigmoid activation function).
    Then you got a very condensed introduction to Keras, followed by an example of
    creating a Keras-based model that was trained on the MNIST dataset.


