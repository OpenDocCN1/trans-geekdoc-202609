    functions that are defined in the second portion of Listing 5.1.


    ![image](images/fig5_2.jpg)


    ***FIGURE 5.2***TensorFlow Activation Functions.


    ## What is logistic regression?


    Logistic regression is essentially the result of “applying” the `sigmoid` activation
    function to linear regression in order to perform binary classification. Logistic
    regression is useful in a variety of unrelated fields. Such fields include machine
    learning, various medical fields, and social sciences. Logistic regression can
    be used to predict the risk of developing a given disease, based on various observed
    characteristics of the patient. Other fields that use logistic regression include
    engineering, marketing, and economics.


    Logistic regression can be binomial (only two outcomes for a dependent variable),
    multinomial (three or more outcomes for a dependent variable), or ordinal (dependent
    variables are ordered).


    For instance, suppose that a dataset consists of data that belong either to class
    A or to class B. If you are given a new data point, logistic regression predicts
    whether that new data point belongs to class A or to class B. By contrast, linear
    regression predicts a numeric value, such as the next-day value of a stock.


    *Despite its name, logistic regression is a classification technique and not a
    regression technique.*


