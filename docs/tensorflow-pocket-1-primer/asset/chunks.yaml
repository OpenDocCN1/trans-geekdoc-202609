    In these two figures, we calculated the MSE easily and quickly, but in general,
    it’s significantly more difficult. For instance, if we plot 10 points in the Euclidean
    plane that do not closely fit a line, with individual terms that involve non-integer
    values, we would probably need a calculator.


    A better solution involves NumPy functions, such as the `np.linspace()` API, as
    discussed in the next section.


    ## APPROXIMATING LINEAR DATA WITH NP.LINSPACE()


    Listing 4.4 displays the contents of `tf-linspace1.py`, which illustrates how
    to generate some data with the `np.linspace()` API in conjunction with the “perturbation
    technique.”


    ***LISTING 4.4: tf-linspace1.py***


    ![image](images/page_121.jpg)


    The purpose of this code sample is merely to generate and display a set of randomly
    generated numbers. Later in this chapter, we will use this code as a starting
    point for an actual linear regression task.


    Listing 4.4 starts with two import statements, followed by the definition of the
    array variable `trainX` that is initialized via the `np.linspace()` API. Next,
    the array variable `trainY` is defined via the “perturbation technique” that you
    have seen in previous code samples. The output from Listing 4.4 is here:


    ![image](images/page_122.jpg)


    ## SIMPLE 2D DATAPOINTS IN TENSORFLOW


    Listing 4.5 displays the contents of `basic-linreg1.py`, which calculates the
    y-coordinates of 2D points based on simulated data for the x-coordinates.


    ***LISTING 4.5: basic-linreg1.py***


    ![image](images/page_122-1.jpg)


    Listing 4.5 contains the variables `W` and `b` and the placeholder `x`, followed
    by the variable `linear_model` that is the equation of a line in the Euclidean
    plane. The with code block starts with the initialization of the variables (shown
    in bold). This pair of statements is required whenever TensorFlow variables are
    defined (such as `W` and `b`) in the code. Finally, a `print()` statement generates
    the output, as shown here:


    ```

    -0.5 0. 0.5 1.

    ```


    The preceding four values are computed by substituting the `x` values 1, 2, 3,
    and 4 in the variable `linear_model`, which, in turn, calculates the four numbers
    in the preceding array. Now that we know how to generate (x,y) values for a linear
    equation, let’s learn how to calculate the MSE, which is discussed in the next
    section.


    ## SIMPLE LINEAR MODELS IN TENSORFLOW


    The code sample defines a linear equation in TensorFlow based on a hard-coded
    value 0.5 for the slope (`W`) and -1 for the y-intercept (`b`), and then calculates
    the MSE for a set of values for the variables `x` and `y`. Note that the TensorFlow-based
    linear regression appears later in this chapter.


    Listing 4.6 displays the contents of `basic-linreg2.py`, which illustrates how
    to compute the MSE with simulated data.


    ***LISTING 4.6: basic-linreg2.py***


    ![image](images/page_123.jpg)


    Listing 4.6 contains the variables `W` and `b` and the placeholder `x`, followed
    by the variable `linear_model` that is the equation of a line in the Euclidean
    plane. The next block of code is the standard code for initializing the session
    and the values of variables, followed by a `print()` statement. The output from
    Listing 4.6 is:


    ```

    23.5

    ```


    The next example generates a set of data values using the `np.linspace()` method
    and the `np.random.randn()` method in order to introduces some randomness in the
    data.


    ## GRADIENT DESCENT WITH TENSORFLOW (1)


    Now we are ready to perform gradient descent with TensorFlow code to find the
    best-fitting line for a set of data (at last!). Listing 4.7 displays the contents
    of `tf-linear-regression2.py`, which illustrates how to simulate a linear dataset
    in NumPy in conjunction with the “perturbation technique.”


    ***LISTING 4.7: tf-linear-regression2.py***


    ![image](images/page_123-1.jpg)

    ![image](images/page_124.jpg)


    Listing 4.7 extends the code in Listing 3.6 by defining `X`, `Y`, and `w`, followed
    by the TensorFlow variable `y_model` that is the product of `W` and `x`. The next
    portion of Listing 4.7 defines a cost variable that is the MSE of the actual values
    `Y` and the values `y_model` (which represents the best fitting line).


    Next, the variable `train_op` is defined as a gradient descent optimizer, with
    a learning rate of 0.01, that invokes the `minimize()` method to minimize the
    cost variable (defined in the preceding line). This two-line block of code is
    very common in linear regression; even though the `learning_rate` might be different,
    and the gradient descent optimizer might be replaced with an Adam optimizer, the
    basic structure of these two lines is the same. The output from Listing 4.7 is:


    ![image](images/page_124-1.jpg)


    Notice two things about the output. First, only the value of `w` (which is the
    slope) is displayed, because we are trying to fit a line that passes through the
    origin to the data points; hence the value of the y-intercept is 0. Second, the
    definition of the variable `trainY` is four times the values of `trainX` plus
    a randomized value for a “perturbation” effect.


    We already know that the slope of the best-fitting line is 4, but the computed
    value is only 2.397479 because the number of iterations is small. We can improve
    the accuracy of `w` by increasing the number of iterations from 10 to 100, and
    we get the following set of numbers:


    ```

    w: 3.662091

    w: 3.662157

    w: 3.662207

    w: 3.662267

    w: 3.662311

    ```


    If we increase the number of iterations from 100 to 1,000, we get the following
    set of numbers:


    ```

    w: 4.085785

    w: 4.085785

    w: 4.085785

    w: 4.085785

    w: 4.085785

    ```


    This time the estimated values for the slope are much closer to the value 4, but
    notice that the last four calculated values are the same: in fact, the last 800
    calculated values are all equal! This example shows you that increasing the number
    of iterations does not always increase the accuracy of the generated approximations.


    ## GRADIENT DESCENT WITH TENSORFLOW (2)


    Listing 4.8 displays the contents of `tf-linear-regression3.py` that illustrates
    how to simulate a linear dataset in NumPy.


    ***LISTING 4.8: tf-linear-regression3.py***


    ![image](images/page_125.jpg)

    ![image](images/page_126.jpg)


    Listing 4.8 starts with familiar code: first it initializes the TF variables `W`
    and `b`, followed by the TF placeholder `x`, and the variable `linear_model` that
    is a linear combination of `W` and `b`.


    Next, the TF placeholder `y` is defined, followed by the TF variables `loss`,
    `optimizer`, and `train` that are required in order to train the linear model.
    If you look carefully, you can see that the `loss` variable is defined as the
    MSE. The `optimizer` variable is gradient descent, and the `train` variable is
    the result of minimizing the `loss` variable.


    The next portion of Listing 4.8 initializes the array variables `x_train` and
    `y_train`, whose values represent points on the line `y = -x + 1` (which has slope
    -1 and y-intercept 1). The with code block initializes the TF variables, followed
    by a loop that executes 100 times. Every iteration of the loop calculates new
    values for the slope, the y-intercept, and the loss function. The final code snippet
    prints the values of these three variables after every tenth iteration through
    the loop. The output from Listing 4.8 is:


    ![image](images/page_126-1.jpg)


    If we increase the number of iterations from 100 to 1,000 we get this output:


    ![image](images/page_127-1.jpg)


    We know that the best-fitting line has a slope equal to -1 and y-intercept of
    1, and the corresponding approximations are -0.99999654 and 0.99998975, respectively.
    Thus, the estimated values for the slope and the y-intercept are very close to
    the correct result, and the value for the loss is essentially equal to zero.

