    **WHAT ARE ACTIVATION FUNCTIONS?**


    The briefest possible description: an activation function is (usually) a non-linear
    function that introduces non-linearity into a neural network, thereby preventing
    a “consolidation” of the hidden layers in neural network. Some well-known activation
    functions are sigmoid, tanh, and ReLU (which also has several variations).


    Suppose that we have a neural network that does not contain any activation function.
    The weights of the edges that connect the input layer with the first hidden layer
    is a matrix: let’s call it W1. Next, the weights of the edges that connect the
    first hidden layer with the second hidden layer is a matrix: let’s call it W2.
    Repeat this process until we reach the edges that connect the final hidden layer
    with the output layer: let’s call this matrix Wk. Since we do not have an activation
    function, we can simply multiply the matrices W1, W2, …, Wk together and produce
    *one* matrix: let’s call it W. We have now collapsed the original neural network
