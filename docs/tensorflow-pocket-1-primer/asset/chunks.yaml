    尽管 `sigmoid` 和 `tanh` 激活函数不是卷积神经网络的首选激活函数，但这两种激活函数都出现在 LSTM（以及其他 RNN）中与输入门、遗忘门和输出门的计算中（这些内容都超出了本书的讨论范围）。


    ## Sigmoid、softmax 和 hardmax


    本节简要讨论了这三个函数之间的某些区别。首先，`sigmoid` 函数用于逻辑回归模型中的二分类，以及 LSTM 和 GRU 中的门控。在构建神经网络时，`sigmoid`
    函数被用作激活函数，但请记住，概率之和并不一定等于 1。


    其次，`softmax` 函数是 `sigmoid` 函数的推广：它用于逻辑回归模型中的多分类。`softmax` 函数是 CNN 中“全连接层”的激活函数，该层通常是最右侧的隐藏层和输出层。与
    `sigmoid` 函数不同，概率之和必须等于 1。你可以使用 `sigmoid` 函数或 `softmax` 进行二分类（n=2）。


    第三，所谓的“hardmax”函数为输出值分配 0 或 1（类似于阶跃函数）。例如，假设我们有三个类别 `{c1, c2, c3}`，它们的得分分别为 `[1,
    7, 2]`。`hardmax` 概率为 `[0, 1, 0]`，而 `softmax` 概率为 `[0.1, 0.7, 0.2]`。注意，`hardmax`
    概率之和为 1，`softmax` 概率之和也是如此。然而，`hardmax` 概率是全有或无，而 `softmax` 概率类似于获得“部分分数”。


