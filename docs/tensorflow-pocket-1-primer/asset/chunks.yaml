    g with the current (default) TensorFlow graph. Next, the with code block defines
    the TF placeholders a and b, followed by the TF variable c that is the product
    of a and b. Next, feed\_dict is initialized with the values 2 and 3 for a and
    b, respectively, thereby enabling the next print() statement to print the value
    of c. A portion of the output from launching the code in Listing 2.1 is here:


