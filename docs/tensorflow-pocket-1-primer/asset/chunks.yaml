    Fortunately, this reduction will not occur when we specify an activation function
    between every pair of consecutive layers. In other words, *an activation function
    at each layer prevents this “matrix consolidation*.” Hence, we can maintain all
    the intermediate hidden layers during the process of training the neural network.


    For simplicity, let’s assume that we have the same activation function between
    every pair of adjacent layers (we’ll remove this assumption shortly). The process
    for using an activation function in a neural network is as follows:


    1.start with an input vector x1 of numbers


    2.multiply x1 by the matrix of weights W1 for the edges that connect the input
    layer with the first hidden layer, which produces a new vector x2


    3.“apply” the activation function to each element of x2 to create another vector
    x3


    At this point we repeat Steps 2 and 3, except that we use the “starting” vector
    x3 and the weights matrix W2 for the edges that connect the first hidden layer
    with the second hidden layer (or just the output layer if there is only one hidden
    layer).


    After completing the preceding process, we have “preserved” the neural network,
    which means that it can be trained on a dataset. One other thing: instead of using
    the same activation function at each step, you can replace each activation function
    by a different activation function (the choice is yours).


    **Why do we Need Activation Functions?**


    The previous section outlines the process for transforming an input vector from
    the input layer and then through the hidden layers until it reaches the output
    layer. The purpose of activation functions in neural networks is vitally important,
    so it’s worth repeating here: activation functions “preserve” the structure of
    neural networks and prevent them from being reduced to an input layer and an output
    layer. In other words, if we specify a non-linear activation function between
    every pair of consecutive layers, then we explicitly control the exact number
    of layers in the neural network.


    Without a non-linear activation function, we simply multiply a weight matrix for
    a given pair of consecutive layers with the output vector that is produced from
    the previous pair of consecutive layers. We repeat this simple multiplication
    until we reach the output layer of the neural network.


    **How do Activation Functions Work?**'
