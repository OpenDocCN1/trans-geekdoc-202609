  raw: 'If this is the first time you have encountered the concept of an activation
    function, it’s probably confusing, so here’s an analogy that might be helpful.
    Suppose you’re driving your car late at night and there’s nobody else on the highway.
    You can drive at a constant speed for as long as there are no obstacles (stop
    signs, traffic lights, and so forth). On the other hand, suppose you drive into
    the parking lot of a large grocery store. When you approach a speed bump you must
    slow down, cross the speed bump, and increase speed again, and repeat this process
    for every speed bump.


    Think of the non-linear activation functions in a neural network as the counterpart
    to the speed bumps: you simply cannot maintain a constant speed, which (by analogy)
    means that you cannot first multiply all the weight matrices together and “collapse”
    them into a single weight matrix. Another analogy involves a road with multiple
    toll booths: you must slow down, pay the toll, and then resume driving until you
    reach the next toll booth. These are only analogies (and hence imperfect) to help
    you understand the need for non-linear activation functions.


    **Common Activation Functions**


    Although there are many activation functions (and you can define your own if you
    know how to do so), here is a list of common activation functions, followed by
    brief descriptions:


    •Sigmoid


    •Tanh


    •ReLU


    •ReLU6


    •ELU


    •SELU


    The sigmoid activation function is based on Euler’s constant e, with a range of
    values between 0 and 1, and its formula is shown here:


    1/\[1+e^(-x)\]


    The tanh activation function is also based on Euler’s constant e, and its formula
    is shown here:


    \[e^x – e^(-x)\]/\[e^x+e^(-x)\]


    One way to remember the preceding formula is to note that the numerator and denominator
    have the same pair of terms: they are separated by a “-” sign in the numerator
    and a “+” sign in the denominator. The tanh function has a range of values between
    -1 and 1.


    The ReLU (Rectified Linear Unit) activation function is straightforward: if x
    is negative then ReLU(x) is 0; for all other values of x, ReLU(x) equals x. ReLU6
    is specific to TensorFlow, and it’s a variation of ReLU(x): the additional constraint
    is that ReLU(x) equals 6 when x >= 6 (hence its name).


    ELU is Exponential Linear Unit and it’s the exponential “envelope” of ReLU, which
    replaces the two linear segments of ReLU with an exponential activation function
    that is differentiable for all values of x (including x = 0).


    SELU is an acronym for Scaled Exponential Linear Unit, and it’s slightly more
    complicated than the other activation functions (and used less frequently). For
    a thorough explanation of these and other activation functions (along with graphs
    that depict their shape), navigate to the following Wikipedia link:


    *[https://en.wikipedia.org/wiki/Activation\_function](https://en.wikipedia.org/wiki/Activation_function)*


    The preceding link provides a long list of activation functions as well as their
    derivatives.


    **TENSORFLOW ACTIVATION FUNCTIONS**


    TensorFlow (and many other frameworks) provide implementations for many activation
    functions, which saves you the time and effort from writing your own implementation
    of activation functions.


    Here is a list of TensorFlow APIs that correspond to some of the activation functions
    that are listed in the previous section:


    •tf.nn.relu


    •tf.nn.relu6


    •tf.nn.selu


    •tf.nn.softmax


    •tf.nn.softmax\_cross\_entropy\_with\_logits\_v2


    •tf.nn.softplus


    •tf.sigmoid


    •tf.tanh


    The following subsections provide additional information regarding some of the
    activation functions in the preceding list. Keep the following point in mind:
    for simple neural networks, use ReLU as your first preference.


    **The ReLU Activation Function**


    Currently ReLU is often the “preferred” activation function: previously the preferred
    activation function was tanh (and before tanh it was sigmoid). ReLU behaves close
    to a linear unit and provides the best training accuracy and validation accuracy.


    ReLU is like a switch for linearity: it’s “off” if you don’t need it, and its
    derivative is 1 when it’s active, which makes ReLU the simplest of all the current
    activation functions. The second derivative of the function is 0 (except the origin):
    it’s a very simple function that simplifies optimization. In addition, the gradient
    is large whenever you need large values, and it never “saturates” (i.e., it does
    not shrink to zero on the positive horizontal axis).


    Rectified linear units and generalized versions are based on the principle that
    linear models are easier to optimize. Use the ReLU activation function or one
    of its related alternatives (discussed later).


    **The Advantages and Disadvantages of ReLU**


    The following list contains the advantages of the ReLU activation function:


    •Does not saturate in the positive region


    •very efficient in terms of computation


    •models with ReLU typically converge faster those with other activation functions


    However, ReLU does have a disadvantage when the activation value of a ReLU neuron
    becomes 0: then the gradients of the neuron will also be 0 during back-propagation.
    You can mitigate this scenario by judiciously assigning the values for the initial
    weights as well as the learning rate.


    **ELU**


    ELU is an acronym for *exponential linear unit* that is based on ReLU: the key
    difference is that ELU is differentiable at the origin (ReLU is a continuous function
    but *not* differentiable at the origin). However, keep in mind several points.
    First, ELUs trade computational efficiency for “immortality” (immunity to dying):
    read the following paper for more details: [arxiv.org/abs/1511.07289](http://arxiv.org/abs/1511.07289).
    Secondly, RELUs are still popular and preferred over ELU because the use of ELU
    introduces an additional new hyper-parameter.


    **Sigmoids**


    The sigmoid activation function has a range in (0,1), and it saturates and “kills”
    gradients. Unlike the tanh activation function, sigmoid outputs are not zero-centered.
    In addition, both sigmoid and softmax (discussed later) are discouraged for vanilla
    feed forward implementation (see Chapter 6 of *Deep Learning*, the online book
    by Ian Goodfellow et al.). However, the sigmoid activation function is still used
    in LSTMs (specifically for the forget gate, input gate, and the output gate),
    GRUs (Gated Recurrent Units), and probabilistic models. Moreover, some autoencoders
    have additional requirements that preclude the use of piecewise linear activation
    functions.


    **Softmax**


    The softmax activation function maps the values in a dataset to another set of
    values that are between 0 and 1, and whose sum equals 1. Thus, softmax creates
    a probability distribution. In the case of image classification with Convolutional
    Neural Networks (CNNs), the softmax activation function “maps” the values in the
    final hidden layer (often abbreviated as “FC”) to the 10 neurons in the output
    layer. The index of the position that contains the largest probability is matched
    with the index of the number 1 in the one-hot encoding of the input image. If
    the index values are equal, then the image has been classified, otherwise it’s
    considered a mismatch.


    **Softplus**


    The softplus activation function is a smooth (i.e., differentiable) approximation
    to the ReLU activation function. Recall that the origin is the only non-differentiable
    point of the ReLU function, which is “smoothed” by the softmax activation whose
    equation is here:


    f(x) = ln(1 + e^x)


    **Tanh**


    The tanh activation function has a range in (-1,1), whereas the sigmoid function
    has a range in (0,1). Both of these two activations saturate, but unlike the sigmoid
    neuron the tanh output is zero-centered. Therefore, in practice the tanh non-linearity
    is always preferred to the sigmoid nonlinearity.'
