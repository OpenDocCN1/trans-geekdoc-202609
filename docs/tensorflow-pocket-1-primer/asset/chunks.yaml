    classification models


    •DNNLinearCombinedRegressor: An estimator for TensorFlow Linear and DNN joined
    models for regression


    •DNNRegressor: A regressor for TensorFlow DNN models


    •Estimator: Estimator class to train and evaluate TensorFlow models


    •LinearClassifier: Linear classifier model


    •LinearEstimator: An estimator for TensorFlow linear models with user-specified
    head


