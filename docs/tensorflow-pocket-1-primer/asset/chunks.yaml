    \ then the following code snippet defines a reusable iterator:\n\n```python\n\
    iterator = dx.make_initializable_iterator()\n```\n\nA *reinitializable iterator*\
    \ can be initialized from a different Dataset. This type of iterator is very useful\
    \ for training datasets that require some additional transformation, such as shuffling\
    \ its contents.\n\nA *feedable iterator* allows you to select from different iterators:\
    \ this type of iterator is essentially a “selector” to select an iterator from\
    \ a collection of iterators.\n\nThe code samples in this chapter involve either\
    \ one-shot iterators or Initializable iterators. The next section contains a code\
