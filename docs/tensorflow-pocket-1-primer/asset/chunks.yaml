    Second, the code samples in this book were tested on a Macbook Pro (12.5.3) with
    `Python` 3.5.1 and `TensorFlow` 1.12, which is currently the latest version of
    `TensorFlow 1.x`. When `TensorFlow 2` is released in 2019, all `TensorFlow 1.x`
    releases will become legacy code. However, Google will probably continue supporting
    `TensorFlow 1.x` for at least another year after the release of `TensorFlow 2`.
    At that point there won’t be any new code development for `TF 1.x` (except for
    security-related updates).


    The first part of this chapter briefly discusses some `TensorFlow` features and
    some of the tools that are part of the `TensorFlow` “family.” The second section
    of this chapter shows you how to write `TensorFlow` code that contains various
    combinations of `TF` constants, `TF` placeholders, and `TF` variables. After reading
    these code samples, you will learn about the differences between `TF` placeholders
    and `TF` variables, which tend to confuse people who are new to `TensorFlow`.


    The third section of this chapter shows you how to perform arithmetic operations
    in `TensorFlow`, how to use various built-in functions, how to calculate trigonometric
    values, `for loops`, `while loops`, the `tf.less() ` API, and how to calculate
    exponential values.


    The fourth section contains `TF` code samples that perform various operations
    on arrays, such as creating an identity matrix, a constant matrix, a random uniform
    matrix, and a truncated normal matrix. This section also shows you how to multiply
    `TensorFlow` arrays and how to convert `Python` arrays to `TensorFlow` arrays.


    The fourth section shows you how to save a `TensorFlow` graph so that you can
    view its contents in a browser using the built-in `TensorBoard` utility that is
    launched from the command line. The final section introduces you to Google Colaboratory,
    which is a fully online Jupyter-based environment that offers 12 hours of daily
    GPU usage for free.


    # WHAT IS TENSORFLOW?


    `TensorFlow` is an open source framework from Google that was released in November,
    2015. The `TensorFlow` framework is for machine learning and deep learning. `TensorFlow`
    evolved from Google Brain and is available through an Apache license. In this
    book, the `TensorFlow` code samples use `Python` 3.x. `TensorFlow` also supports
    a variety of programming languages and hardware platforms. Here is a short list
    of some `TensorFlow` features:


    - Support for `Python`, `Java`, `C++`

    - Desktop, server, mobile device (`TF Lite`)

    - CPU/GPU/TPU support

    - Linux and Mac OS X support

    - VM for Windows


    Navigate to the `TensorFlow` home page, where you will find links to many resources
    for `TensorFlow`:


    [https://www.tensorflow.org](https://www.tensorflow.org)


    Install `TensorFlow` by issuing the following command from the command line:


    ```bash

    pip install tensorflow

    ```


    If you want to upgrade `TensorFlow` to the latest version, issue the following
    command from the command line:


    ```bash

    pip install --upgrade tensorflow

    ```


    # TensorFlow Architecture (High View)


    `TensorFlow` consists of two main components: 1) a graph protocol buffer, and
    2) a runtime to execute (distributed) graph that is analogous to `Python` code
    and the `Python` interpreter. `TensorFlow` is written in `C++` and supports various
    graph-based operations involving primitive values and so-called tensors (discussed
    later).


    `TensorFlow` creates a “computation” graph for numerical computation and data
    flow, with the notion that “everything is a graph.” Graph and data visualization
    are handled via `TensorBoard` (discussed later) that is included as part of `TensorFlow`.
    As you will see in the code samples in this book, `TensorFlow` APIs are available
    in `Python` and can therefore be embedded in `Python` scripts.


    The default execution mode for `TF 1.x` is `deferred execution`, whereas `TF 2`
    uses `eager execution` (think “immediate mode”). Although `TF 1.4` introduced
    eager execution, the vast majority of `TF 1.x` code samples that you will find
    online uses deferred execution. `TensorFlow` supports arithmetic operations on
    tensors (i.e., multi-dimensional arrays with enhancements) as well as conditional
    logic and `while loops`.


    `TensorFlow` provides a “checkpoint” API to save `TensorFlow` graphs and restore
    them at a later point. In addition, you can view saved graphs in `TensorBoard`,
    which is a very useful data visualization tool that is bundled with `TensorFlow`.


    # TensorFlow Features


    The following list contains various high-level features of `TensorFlow`:


    - Distributed computation

    - R/D for developing new ML algorithms

    - A REPL environment

    - Take models from training to production

    - Large-scale distributed models

    - TF graph computed on different machines

    - Models for mobile


    Most of the preceding items are self-explanatory. The `TensorFlow` REPL (read-eval-print-loop)
    is available through the `Python` REPL, which is accessible by opening a command
    shell and then typing the following command:


    ```bash

    python

    ```


    As a simple illustration of accessing `TensorFlow`-related functionality in the
    `Python` REPL, import the `TensorFlow` library as follows:


    ```python

    >>> import tensorflow as tf

    ```


    Now check the version of `TensorFlow` that is installed on your machine with this
    command:


    ```python

    >>> print(''TF version:'',tf.__version__)

    ```


    The output of the preceding code snippet is shown here (the number that you see
    depends on which version of `TensorFlow` you installed):


    ```

    TF version: 1.12.0

    ```


    Although the `Python` REPL is useful for short code blocks, it’s simpler to place
    the `TensorFlow` code samples in this book inside `Python` scripts that you can
    launch with the `Python` executable.


    # TensorFlow Use Cases


    `TensorFlow` is designed to solve many use cases, some of which are listed here:


    - Image recognition

    - Computer vision

    - Voice/sound recognition

    - Time series analysis

    - Language detection

    - Language translation

    - Text-based processing

    - Handwriting recognition


    In case you didn’t already know, the preceding list also includes common-use cases
    that are suitable for machine learning as well as deep learning.


    # OTHER TENSORFLOW-BASED TOOLKITS


    `TensorFlow` has the following associated toolkits:


    - `TensorBoard` (included as part of `TensorFlow`)

    - `TensorFlow Serving` (hosting)

    - `TensorFlow Lite` (for mobile)

    - `tensorflow.js` (for web pages and NodeJS)


    The `TensorFlow` distribution contains `TensorBoard`, which is a graph visualization
    tool that runs in a browser. For example, type the following command that accesses
    a saved TF graph in the subdirectory `/tmp/abc`:


    ```bash

    tensorboard –logdir=/tmp/abc

    ```


    Next, open a browser session and navigate to this URL:


    `localhost:6006`


    Now you will see a visualization of the `TensorFlow` graph that was saved as a
    file in the directory `/tmp/abc`.


    `TensorFlow Serving` is a flexible, high-performance serving system for machine
    learning models that is designed for production environments. `TensorFlow Serving`
    makes it easy to deploy new algorithms and experiments, while keeping the same
    server architecture and APIs. More information is here:


    [https://www.tensorflow.org/serving/](https://www.tensorflow.org/serving/)


    `TensorFlow Lite` was created for developing mobile applications (both Android
    and iOS). `TensorFlow Lite` supersedes `TensorFlow Mobile`, which was an earlier
    SDK for developing mobile applications. `TensorFlow Lite` is a lightweight solution
    for mobile and embedded devices. It enables on-device machine learning inference
    with low latency and a small binary size. `TensorFlow Lite` also supports hardware
    acceleration with the Android Neural Networks API. More information about `TensorFlow
    Lite` is here:


    [https://www.tensorflow.org/lite/](https://www.tensorflow.org/lite/)


    A more recent addition is `tensorflow.js` that provides JavaScript APIs to access
    TensorFlow in a Web page. The `tensorflow.js` toolkit was previously called `deeplearning.js`.
    In addition, `tensorflow.js` can be used with `NodeJS`. More information about
    `tensorflow.js` is here:


    [https://js.tensorflow.org/](https://js.tensorflow.org/)

