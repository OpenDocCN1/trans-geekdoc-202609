    Although method chaining is a concise way to chain operators, invoking dozens
    of lazy operators in a single (very long) line of code can quickly become difficult
    to understand, whereas writing code using the “longer way” would be easier to
    debug.


    A suggestion: start with each lazy operator in a separate line of code, and after
    you are satisfied that the individual results are correct, *then* use method chaining
    to combine the operators in a single line of code (up to a maximum of four or
    five lazy operators).


