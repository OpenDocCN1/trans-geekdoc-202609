    Listing 2.3 initializes the values variable with the element weights, which is
    initialized as a TF variable that comprises a 6x3 tensor containing randomly selected
    values from a normal distribution. The output from launching the code in Listing
    2.3 is here:


    ![image](images/page_51-2.jpg)


    **TF ARRAYS AND MAXIMUM VALUES**


    The TF tf.argmax() API determines the index values containing maximum values on
    a row-wise basis or on a column-wise basis for a TF tensor. Just to be sure you
    understand the previous statement: the TF tf.argmax() API determines the *index*
    values that contain maximum values and *not* the actual maximum values in those
    index positions. As a trivial example, the array \[10,20,30\] contains a minimum
    value of 10 in index position 0 and a maximum value of 30 in index position 2.
    Consequently, TF tf.argmax() API returns the value 2, whereas the TF tf.argmin()
    API returns the value 0.


