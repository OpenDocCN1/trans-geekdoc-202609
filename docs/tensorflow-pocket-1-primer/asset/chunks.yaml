    Although `sigmoid` and `tanh` activation functions are not the preferred activation
    functions for Convolutional Neural Networks, both of these activation functions
    appear in LSTMs (and other RNNs) during the calculations pertaining to input gates,
    forget gates, and output gates (all of which is beyond the scope of this book).


    ## Sigmoid, softmax, and hardmax


    This section briefly discusses some of the differences among these three functions.
    First, the `sigmoid` function is used for binary classification in logistic regression
    model, as well as the gates in LSTMs and GRUs. The `sigmoid` function is used
    as activation function while building neural networks, but keep in mind that the
    sum of the probabilities is not necessarily equal to 1.


    Second, the `softmax` function generalizes the `sigmoid` function: it’s used for
    multi-classification in logistic regression model. The `softmax` function is the
    activation function for the “fully connected layer” in CNNs, which is the right-most
    hidden layer and the output layer. Unlike the `sigmoid` function, the sum of the
    probabilities must equal 1. You can use either the `sigmoid` function or `softmax`
    for binary (n=2) classification.


    Third, the so-called “hardmax” function assigns 0 or 1 to output values (similar
    to a step function). For example, suppose that we have three classes `{c1, c2,
    c3}` whose scores are `[1, 7, 2]`, respectively. The `hardmax` probabilities are
    `[0, 1, 0]`, whereas the `softmax` probabilities are `[0.1, 0.7, 0.2]`. Notice
    that the sum of the `hardmax` probabilities is 1, which is also true of the sum
    of the `softmax` probabilities. However, the `hardmax` probabilities are all-or-nothing,
    whereas the `softmax` probabilities are analogous to receiving “partial credit.”


    ## TensorFlow and the sigmoid activation function


    Listing 5.1 displays the contents of `tf-activation-functions.py` that illustrates
    how to create a TensorFlow graph that involves seven activation functions, including
    the `sigmoid` function for logistic regression.


