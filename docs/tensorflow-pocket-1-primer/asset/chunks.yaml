    列表 13 的后续部分定义了 `feature_columns` 作为列数组 `x`（通常该数组可以包含许多值）。列表 13 的中间部分定义了四个输入函数：`input_fn`、`train_input_fn`、`eval_input_fn`
    和 `predict_input_fn`，分别用于输入数据、训练阶段、测试阶段和预测阶段。所有这些函数都需要 `x`、`y`、`batch_size`、`num_epochs`
    和 `shuffle` 的适当值。


    列表 13 中的下一个代码块对模型进行 100 轮的实际训练，然后评估训练阶段以及测试阶段，最后进行预测。列表 13 的运行输出如下：


    ![image](img/page140.jpg)


    你可以看到，预测值是 `x_predict` 数组中对应值的 3 倍。这说明像列表 13 这样的小数据集很难产生准确的预测。


    ### 总结


    本章向你介绍了线性回归，并简要描述了如何为欧几平面上的数据集计算拟合线。你学习了如何使用 `NumPy` 执行线性回归以初始化数据数组，以及一种为 `y`
    值引入某些随机性的“扰动”技术。这种技术非常有用，因为你会知道拟合线的斜率和截距的正确值，然后将其与训练值进行比较。


    然后你学习了如何在涉及 TensorFlow 的示例中执行线性回归。此外，你学习了如何使用 `Matplotlib` 显示拟合线的线图以及训练期间代价与迭代次数关系的图表。最后，你学习了如何使用
    `tf.estimator` 类来训练线性模型。


    # 第 5 章：逻辑回归


    本章假设你接触过激活函数（即使你不完全理解它们），并且已经读过第 4 章的内容。此外，你对神经网络中的隐藏层有基本的理解，而书中并未讨论这一点。根据你的熟悉程度，你可能需要在深入本章之前阅读一些准备性材料（网上有许多文章）。


    上述假设的理由是，如前言所述，这本书不是为“绝对初学者”准备的，为每章每个代码示例中的每个概念提供非常详细的解释可能会使这本书的长度增加一倍。然而，本书属于高级初学者的“口袋指南”（Pocket
    Primer）系列，该系列假设读者已经（有限地）接触过本章中的某些概念。


    因此，本书尝试一种折中方案：在解释可以扩展你现有知识时包含它们，同时在代码方面“直奔主题”（通俗地说）。根据你的背景，准备好花一些时间阅读代码示例，并随时“调整”参数的值以查看它们如何影响代码性能。


    正如你所看到的，本章的代码示例比上一章少，但长度相对较长。在某些情况下，代码示例顶部的注释块中有一个 TF API 列表。某些代码示例被分为几个子部分，以便更容易理解代码。如果你需要阅读多次代码示例，请不要惊讶，更重要的是，不要被学习曲线所挫败。作为一种安慰：在你用过
    TF 1.x 之后，你会发现 TF 2 比 TF 1.x 更容易，你的学习曲线可能会缩短很多。


