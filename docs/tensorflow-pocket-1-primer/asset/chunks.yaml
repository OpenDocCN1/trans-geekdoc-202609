    \n# CHAPTER 4: LINEAR REGRESSION\n\nThis chapter introduces linear regression,\
    \ along with code samples of linear regression: first with NumPy APIs, and then\
    \ with TensorFlow APIs. The code samples use an “incremental” approach, starting\
    \ with simple examples that involve Python and NumPy code (often using the NumPy\
    \ `linspace()` API). Then you will see comparable code samples involving TensorFlow\
    \ code. In addition, the samples in the second half of the chapter usually involve\
    \ concepts from the first half of the chapter.\n\nThe first part of this chapter\
    \ briefly discusses the basic concepts involved in linear regression. Although\
    \ linear regression was developed more than 200 years ago, this technique is still\
    \ one of the “core” techniques for solving (albeit simple) problems in statistics\
    \ and machine learning. In fact, the technique known as “mean squared error” (MSE)\
    \ for finding a best-fitting line for data points in a 2D plane (or a hyperplane\
    \ for higher dimensions) is implemented in Python and TensorFlow in order to minimize\
    \ so-called “cost” functions that are discussed later.\n\nThe second section in\
    \ this chapter contains additional code samples involving linear regression tasks\
    \ using standard techniques in NumPy. Hence, if you are comfortable with this\
    \ topic, you can probably skim quickly through the first two sections of this\
    \ chapter. The third section shows you how to solve linear regression using TensorFlow.\n\
    \n### WHAT IS LINEAR REGRESSION?\n\nThe goal of linear regression is to find the\
    \ best-fitting line that “represents” a dataset. Keep in mind two key points.\
    \ First, the best-fitting line does not necessarily pass through all (or even\
    \ most of) the points in the dataset. The purpose of a best-fitting line is to\
    \ minimize the distance of that line from the points in the dataset. Second, linear\
    \ regression does not determine the best-fitting polynomial: the latter involves\
    \ finding a higher-degree polynomial that passes through many of the points in\
    \ a dataset.\n\nMoreover, a dataset in the plane can contain two or more points\
    \ that lie on the same vertical line, which is to say that those points have the\
    \ same x value. However, a function *cannot* pass through such a pair of points:\
    \ if two points `(x1,y1)` and `(x2,y2)` have the same x value, then they must\
    \ have the same y value (i.e., `y1=y2`). On the other hand, a function can have\
    \ two or more points that lie on the same horizontal line.\n\nNow consider a scatter\
    \ plot with many points in the plane that are sort of “clustered” in an elongated\
    \ cloud-like shape: a best-fitting line will probably intersect only limited number\
    \ of points (in fact, a best-fitting line might not intersect any of the points).\n\
    \nOne other scenario to keep in mind: suppose a dataset contains a set of points\
    \ that lie on the same line. For instance, let’s say the x values are in the set\
    \ `{1,2,3,...,10}` and the y values are in the set `{2,4,6,...,20}`. Then the\
    \ equation of the best-fitting line is `y=2*x+0`. \n\n### Linear Regression versus\
    \ Curve-Fitting\n\nSuppose a dataset consists of `n` data points of the form `(x,\
    \ y)`, and no two of those points have the same x value. Then there is a polynomial\
    \ of degree less than or equal to `n-1` that passes through those `n` points (if\
    \ you are really interested, you can find a mathematical proof of this statement\
