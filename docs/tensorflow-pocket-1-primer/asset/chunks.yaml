    - `variables` can be shared (or non-trainable)

    - used for storing/maintaining state

    - internally stores a persistent tensor

    - modifications are visible across multiple `tf.Sessions`

    - you can read/modify the values of the tensor

    - multiple workers see the same values for `tf.Variables`

    - the best way to represent shared, persistent state manipulated by your program


    ## TF Variables versus TF Tensors


    Keep in mind the following distinction between TF variables and TF tensors: TF
    `variables` represent your model’s trainable parameters (ex: weights and biases
    of a neural network), whereas TF `tensors` represents the data fed into your model
    and the intermediate representations of that data as it passes through your model.


    ## Initializing Variables in TensorFlow Graphs


    Earlier in this chapter, you learned that variables are initialized in a TensorFlow
    session. Doing so will initialize variables with their computed values, such as
    the `lm` variable that is defined in terms of the variables `W` and `x`.


    The TensorFlow method `tf.global_variables_initializer()` explicitly causes the
    initialization of all variables in your code, and it works in asynchronous mode.


    ## TensorFlow Graph Execution


    In all but trivial cases, a TF graph involves the following sequence of steps:


    - Build (define) a TF graph

    - Initialize a `tf.Session()`

    - Feed data into the graph

    - Execute the graph

    - generate some output


    In subsequent chapters, you will see TensorFlow code samples that illustrate each
    of the steps in the preceding list.


    ## ARITHMETIC OPERATIONS IN TF GRAPHS


    Listing 1.11 displays the contents of `tf-arithmetic.py` that illustrates how
    to perform arithmetic operations in a TF graph.


    ***LISTING 1.11: tf-arithmetic.py***


    ![image](images/page_32.jpg)


    ![image](images/page_33.jpg)


    Listing 1.11 contains straightforward code for computing the sum, difference,
    product, and quotient via the `tf.add()`, `tf.subtract()`, `tf.multiply()`, and
    the `tf.div()` APIs, respectively. The with code block displays the result of
    invoking those APIs, and the output from Listing 1.11 is here:


    ```

    6

    2

    18

    1

    ```


    ## TF GRAPHS AND BUILT-IN FUNCTIONS


    Listing 1.12 displays the contents of `tf-math-ops.py` that illustrates how to
    perform additional arithmetic operations and how to use trigonometric functions
    in a TF graph.


    ***LISTING 1.12: tf-math-ops.py***


    ```python

    import tensorflow as tf


    PI = 3.141592


    sess = tf.Session()


    print(sess.run(tf.div(12,8)))


    print(sess.run(tf.floordiv(20.0,8.0)))


    print(sess.run(tf.sin(PI)))


    print(sess.run(tf.cos(PI)))


    print(sess.run(tf.div(tf.sin(PI/4.), tf.cos(PI/4.))))

    ```


    Listing 1.12 contains a hard-coded approximation for `PI`, an instance of `tf.Session()`,
    and four `print()` statements that display various arithmetic results. Note in
    particular the third output value is a very small number (the correct value is
    zero). The output from Listing 1.12 is here:


    ```

    1

    2.0

    6.27833e-07

    -1.0

    1.0

    ```


    Listing 1.13 displays the contents of `tf-math-ops-pi.py` that illustrates how
    to perform arithmetic operations and how to use `m.pi` for increased accuracy
    in a TF graph.


    ***LISTING 1.13: tf-math-ops-pi.py***


    ```python

    import tensorflow as tf

    import math as m


    PI = tf.constant(m.pi)


    sess = tf.Session()


    print(sess.run(tf.div(12,8)))


    print(sess.run(tf.floordiv(20.0,8.0)))


    print(sess.run(tf.sin(PI)))


    print(sess.run(tf.cos(PI)))


    print(sess.run(tf.div(tf.sin(PI/4.), tf.cos(PI/4.))))

    ```


    Listing 1.13 contains the `tf.floordiv()`, `tf.sin()`, and `tf.cos()` APIs that
    calculate the floor of the quotient, the sine of a number (in radians), and the
    cosine of a number (in radians). This time the approximated value is closer to
    the correct value. The output from Listing 1.13 is here:


    ```

    1

    2.0

    6.27833e-07

    -1.0

    1.0

    ```

