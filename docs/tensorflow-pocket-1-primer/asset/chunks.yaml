    \ `dx` 中的第一个整数（即 0）。\n\n列表 3.5 的最后部分包含一个遍历 `dx` 循环。当变量 `i` 等于 9 时，迭代器变量被“重置”为其初始值，从而防止错误。你可以通过“注释掉”\
