    - `variables` 可以是共享的（或不可训练的）

    - 用于存储/维护状态

    - 内部存储一个持久化张量

    - 修改在多个 `tf.Sessions` 中可见

    - 你可以读取/修改张量的值

    - 多个工作负载可以看到 `tf.Variables` 的相同值

    - 表示你的程序所操作的共享、持久化状态的最佳方式


    ## TF 变量对比 TF 张量


    请记住 TF 变量与 TF 张量之间的以下区别：TF `variables` 代表你模型的可训练参数（例如：神经网络的权重和偏置），而 TF `tensors`
    代表馈入你模型的数据以及这些数据在通过模型过程中的中间表示。


    ## 在 TensorFlow 图中初始化变量


    在本章的早些部分，你已经学习了如何在 TensorFlow 会话中初始化变量。这样做将根据其计算值初始化变量，例如根据变量 `W` 和 `x` 定义的变量
    `lm`。


    TensorFlow 方法 `tf.global_variables_initializer()` 显式地触发代码中所有变量的初始化，并以异步模式运行。


    ## TensorFlow 图的执行


    在所有非微道情况（非平凡情况）下，TF 图都涉及以下步骤序列：


    - 构建（定义）一个 TF 图

    - 初始化 `tf.Session()`

    - 将数据馈入图

    - 执行图

    - 生成某些输出


    在随后的章节中，你将看到 TensorFlow 代码示例，用于说明上述列表中的每一个步骤。


    ## TF 图中的算术运算


