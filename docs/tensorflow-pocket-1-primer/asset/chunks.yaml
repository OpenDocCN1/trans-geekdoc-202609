    \ each feature is stored in a key value pair, where the key corresponds to the\
    \ title that is allotted to each feature. These titles are used later for extracting\
    \ the data from `TFRecord`. The created dictionary is passed as input to a `Feature`\
    \ class. Finally, the features object is passed as input to `Example` class that\
    \ is appended into the `TFRecord`. The preceding process is repeated for every\
    \ type of data that is stored in `TFRecord`.\n\nThe `TFRecord` file format is\
    \ a record-oriented binary format that you can use for training data. In addition,\
    \ the `tf.data.TFRecordDataset` class enables you to stream over the contents\
    \ of one or more `TFRecord` files as part of an input pipeline. \n\nYou can store\
