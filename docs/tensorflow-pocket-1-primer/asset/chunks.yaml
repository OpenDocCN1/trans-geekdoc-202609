    API 在 `Python` 中可用，因此可以嵌入到 `Python` 脚本中。


    `TF 1.x` 的默认执行模式是延迟执行（deferred execution），而 `TF 2` 使用即时执行（eager execution，设为“立即模式”）。尽管
    `TF 1.4` 引入了即时执行，但你在网上找到的大多数 `TF 1.x` 代码示例都使用延迟执行。`TensorFlow` 支持对张量的算术运算（即增强的多维数组）以及条件逻辑和
    `while loops`。


    `TensorFlow` 提供了一个“检查点”（checkpoint）API 来保存 `TensorFlow` 图并在稍后恢复它们。此外，你可以在 `TensorBoard`
    中查看保存的图，这是一个随 `TensorFlow` 绑定的非常有用的数据可视化工具。


    # TensorFlow 特性


    以下列表包含了 `TensorFlow` 的各种高级特性：


    - 分布式计算

    - 开发新机器学习算法的 R/D

    - REPL 环境

    - 从训练到生产的模型迁移

    - 大规模分布式模型

    - 在不同机器上计算的 TF 图

    - 移动模型


    上述大多数项目都是自言自明的。`TensorFlow` REPL（读-评估-打印循环）可以通过 `Python` REPL 使用，通过打开命令行 shell
    并输入以下命令即可访问：


    ```bash

    python

    ```


    作为在 `Python` REPL 中访问 `TensorFlow` 相关功能的简单示例，按如下方式导入 `TensorFlow`


    库：


    ```python

    >>> import tensorflow as tf

    ```


    现在用此命令检查机器上安装的 `TensorFlow` 版本：


    ```python

    >>> print(''TF version:'',tf.__version__)

    ```


    上述代码段的输出在此（你看到的数字取决于安装了哪个版本的 `TensorFlow`）：


    ```

    TF version: 1.12.0

    ```


    尽管 `Python` REPL 很有用，但可以在 `Python` 脚本中运行 `TensorFlow` 代码块。


    # TensorFlow 用例


    `TensorFlow` 设计用于解决许多用例，此处列出了一些：


    - 图像识别

    - 计算机视觉

    - 语音/声音识别

    - 时间序列分析

    - 语言翻译

    - 文本处理

    - 手写识别


    如果你之前不知道，上述列表还包含了适用于机器学习以及深度学习的常见用例。


    # 其他 TensorFlow 工具包


    `TensorFlow` 拥有以下关联工具包：


    - `TensorBoard`（作为 `TensorFlow` 的一部分）

    - `TensorFlow Serving`（托管）

    - `TensorFlow Lite`（用于移动端）

    - `tensorflow.js`（用于网页）


    `TensorFlow` 分发包含 `TensorBoard`，这是一个图的可可视化工具。例如，输入以下命令访问 `/tmp/abc` 中保存的图：


    ```bash

    tensorboard --logdir=/tmp/abc

    ```


    接下来，打开浏览器窗口并导航到此 URL：


    `localhost:6006`


    现在你看到保存在目录 `/tmp/abc` 中的 `TensorFlow` 图的可视化。


    `TensorFlow Serving` 是一个用于机器学习模型的灵活、高性能服务系统，适用于生产环境。`TensorFlow Serving` 能够轻松部署新算法和实验，同时保持相同的服务器架构和
    API。更多信息在此处：


    [`www.tensorflow.org/serving/`](https://www.tensorflow.org/serving/)


    `TensorFlow Lite` 为开发移动应用（Android 和 iOS）而创建。`TensorFlow Lite` 取代了早期开发移动应用的 SDK
    `TensorFlow Mobile`。`TensorFlow Lite` 是移动和嵌入式设备的轻量级解决方案。它实现了低延迟和小体积的设备端机器学习推理。`TensorFlow
    Lite` 还通过 Android 神经网络 API 支持硬件加速。关于 `TensorFlow Lite` 的更多信息在此处：


    [`www.tensorflow.org/lite/`](https://www.tensorflow.org/lite/)


    最近添加的是 `tensorflow.js`，它提供了 JavaScript API 在网页中访问 TensorFlow。`tensorflow.js` 工具包以前被称为
    `deeplearning.js`。此外，`tensorflow.js` 可以配合 `NodeJS` 使用。关于 `tensorflow.js` 的更多信息在此处：


    [`js.tensorflow.org/`](https://js.tensorflow.org/)


