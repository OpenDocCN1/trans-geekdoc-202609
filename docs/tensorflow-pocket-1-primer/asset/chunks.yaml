    Keep in mind that even though a closed-form solution for “traditional” linear
    regression provides an exact value for both `m` and `b`, sometimes you can only
    use an approximation of the exact value. For instance, suppose that the slope
    `m` of a best-fitting line equals the square root of 3 and the y-intercept `b`
    is the square root of 2. If you plan to use these values in source code, you can
    only work with an approximation of these two numbers. In the same scenario, a
    neural network computes approximations for `m` and `b`, regardless of whether
    or not the exact values for `m` and `b` are irrational, rational, or integer values.
    However, machine learning algorithms are better suited for complex, non-linear,
    multi-dimensional datasets, which is beyond the capacity of linear regression.


    As a simple example, suppose that the closed form solution for a linear regression
    problem produces integer or rational values for both `m` and `b`. Specifically,
    let’s suppose that a closed form solution yields the values `2.0` and `1.0` for
    the slope and y-intercept, respectively, of a best-fitting line. The equation
    of the line looks like this:


    ```

    y = 2.0 * x + 1.0

    ```


    However, the corresponding solution from training a neural network might produce
    the values `2.0001` and `0.9997` for the slope `m` and the y-intercept `b`, respectively,
    as the values of `m` and `b` for a best-fitting line. Always keep this point in
    mind, especially when you are training a neural network.


    ## What is Multivariate Analysis?


    Multivariate analysis generalizes the equation of a line in the Euclidean plane
    to higher dimensions, and it’s called a hyper plane instead of a line. The generalized
    equation has the following form:


    ```

    y = w1*x1 + w2*x2 + . . . \+ wn*xn + b

    ```


    In the case of 2D linear regression, you only need to find the value of the slope
    (`m`) and the y-intercept (`b`), whereas in multivariate analysis you need to
    find the values for `w1`, `w2`, `. . .`, `wn`. Note that multivariate analysis
    is a term from statistics, and in machine learning it’s often referred to as “generalized
    linear regression.”


    Keep in mind that most of the code samples in this book that pertain to linear
    regression involve 2D points in the Euclidean plane.


    ## OTHER TYPES OF REGRESSION


    Linear regression finds the best fitting line that “represents” a dataset, but
    what happens if a line in the plane is not a good fit for the dataset? This is
    a relevant question when you work with datasets.


    Some alternatives to linear regression include quadratic equations, cubic equations,
    or higher-degree polynomials. However, these alternatives involve trade-offs,
    as we’ll discuss later.


    Another possibility is a sort of hybrid approach that involves piece-wise linear
    functions, which comprise a set of line segments. If contiguous line segments
    are connected, then it’s a piece-wise linear continuous function; otherwise it’s
    a piece-wise linear discontinuous function.


    Thus, given a set of points in the plane, regression involves addressing the following
    questions:


    1. What type of curve fits the data well? How do we know?

    2. Does another type of curve fit the data better?

    3. What does “best fit” mean?


    One way to check if a line fits the data involves a visual check, but this approach
    does not work for data points that are higher than two dimensions. Moreover, this
    is a subjective decision, and some sample datasets are displayed later in this
    chapter. By visual inspection of a dataset, you might decide that a quadratic
    or cubic (or even higher degree) polynomial has the potential of being a better
    fit for the data. However, visual inspection is probably limited to points in
    a 2D plane or in three dimensions.


    Let’s defer the non-linear scenario and let’s make the assumption that a line
    would be a good fit for the data. There is a well-known technique for finding
    the “best fitting” line for such a dataset, and it’s called MSE that we’ll discuss
    later in this chapter.


    The next section provides a quick review of linear equations in the plane, along
    with some images that illustrate examples of linear equations.


    ## WORKING WITH LINES IN THE PLANE (OPTIONAL)


    This section contains a short review of lines in the Euclidean plane, so you can
    skip this section if you are comfortable with this topic. A minor point that’s
    often overlooked is that lines in the Euclidean plane have infinite length. If
    you select two distinct points of a line, then all the points between those two
    selected points is a line segment. A `ray` is a “half infinite” line: when you
    select one point as an endpoint, then all the points on one side of the line constitutes
    a ray.


    For example, the points in the plane for which y-coordinate is 0 is a line (it’s
    the x-axis), whereas the points between `(0,0)` and `(1,0)` on the x-axis form
    a line segment. In addition, the points on the x-axis that are to the right of
    `(0,0)` form a ray, and the points on the x-axis that are to the left of `(0,0)`
    also form a ray.


    For simplicity and convenience, in this book we’ll use the terms “line” and “line
    segment” interchangeably, and now let’s delve into the details of lines in the
    Euclidean plane. Just in case you’re a bit fuzzy on the details, here is the equation
    of a (non-vertical) line in the Euclidean plane:


    ```

    y = m*x + b

    ```


    The value of `m` is the slope of the line and the value of `b` is the y-intercept
    (i.e., the place where the line intersects the y-axis).


    If need be, you can use a more general equation that can also represent vertical
    lines, as shown here:


    ```

    a*x + b*y + c = 0

    ```


    However, we won’t be working with vertical lines, so we’ll stick with the first
    formula.


    [Figure 4.1](#11_chapter04.html#fig4_1) displays three horizontal lines whose
    equations (from top to bottom) are `y = 3`, `y = 0`, and `y = -3`, respectively.


    ![image](images/fig4_1.jpg)


    ***FIGURE 4.1***A Graph of Three Horizontal Line Segments.


    [Figure 4.2](#11_chapter04.html#fig4_2) displays two slanted lines whose equations
    are `y = x` and `y = -x`, respectively.


    ![image](images/fig4_2.jpg)


    ***FIGURE 4.2***A Graph of Two Diagonal Line Segments.


    [Figure 4.3](#11_chapter04.html#fig4_3) displays two slanted parallel lines whose
    equations are `y = 2*x` and `y = 2*x + 3`, respectively.


    ![image](images/fig4_3.jpg)


    ***FIGURE 4.3***A Graph of Two Slanted Parallel Line Segments.


    [Figure 4.4](#11_chapter04.html#fig4_4) displays a piece-wise linear graph consisting
    of line segments.


    ![image](images/fig4_4.jpg)


    ***FIGURE 4.4***A PieceWise Linear Graph of Segments.


    Now let’s turn our attention to generating quasi-random data using a NumPy API,
    and then we’ll plot the data using Matplotlib.


    ## SCATTER PLOTS WITH NUMPY AND MATPLOTLIB


    Listing 4.1 displays the contents of `np-plot1.py`, which illustrates how to use
    the NumPy `randn()` API to generate a dataset and then the `scatter()` API in
    Matplotlib to plot the points in the dataset.


    One detail to note is that all the adjacent horizontal values are equally spaced,
    whereas the vertical values are based on a linear equation plus a “perturbation”
    value. This “perturbation technique” (which is not a standard term) is used in
    other code samples in this chapter in order to add a slightly randomized effect
    when the points are plotted. The advantage of this technique is that the best-fitting
    values for `m` and `b` are known in advance, and therefore we do not need to guess
    their values.


    ***LISTING 4.1: np-plot1.py***


    ![image](images/page_115.jpg)


    Listing 4.1 contains two import statements and then initializes the array variable
    `x` with 15 random numbers between 0 and 1.


    Next, the array variable `y` is defined in two parts: the first part is a linear
    equation `2.5*x + 5` and the second part is a “perturbation” value that is based
    on a random number. Thus, the array variable `y` simulates a set of values that
    closely approximate a line segment.

