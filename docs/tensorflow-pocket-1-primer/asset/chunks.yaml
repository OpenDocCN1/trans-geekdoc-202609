    # THE TF.SIZE(), TF.SHAPE(), AND TF.RANK() APIS


    These three TensorFlow APIs are somewhat related to each other, so they are included
    in the same section for easy reference.


    The `tf.size()` API returns the number of elements in a TF tensor. Here is a simple
    example:


    ```python

    t = tf.constant([[[1,1,1],[2,2,2]],[[3,3,3],[4,4,4]]])

    tf.size(t) # 12

    ```


    In essence, ignore the square brackets and count the number of elements in order
    to determine the answer. The `tf.shape()` API returns the shape of a TF tensor,
    which is the number of elements in each “dimension.” Here is a simple example:


    ```python

    t = tf.constant([[[1,1,1],[2,2,2]],[[3,3,3],[4,4,4]]])

    tf.shape(t) # [2, 3]

    ```


    The `tf.rank()` API returns the number of indices required to select each element
    of the tensor. The rank is also known as the “order,” “degree” or “ndims.” Here
    is a simple example:


    ```python

    # the shape of ''t'' is [2, 3]

    t = tf.constant([[[1,1,1],[2,2,2]],[[3,3,3],[4,4,4]]]]

    tf.rank(t) # 3

    ```


    Note that the rank of a tensor does not equal the rank of matrix. You might initially
    think the rank in the preceding example is 4 instead of 3 because it’s easy to
    overlook the number of nested brackets. An easier way to display the preceding
    TF is shown here:


    ![image](images/page_56.jpg)


    As you can see in the preceding layout, the rank of the tensor is 3 because you
    need to “traverse” 3 levels in order to identify each element of the tensor. Listing
    2.10 displays the contents of `tf-rank.py`, which illustrates how to invoke the
    `TF.rank()` API.


    **LISTING 2.10: tf-rank.py**


    ![image](images/page_57.jpg)


    Listing 2.10 is a simple example that defines the TF constants `b1`, `b2`, and
    `b3` that have dimensions 0, 1, and 2, respectively. The three `print()` statements
    display the rank of these TF constants, which equals their dimensionality. The
    output from launching the code in Listing 2.10 is:


    ```

    0

    1

    2

    ```


    If you know the shape of a TF tensor, you can determine its rank and its size.
    In the examples above, the shape is `[2,2,3]` and therefore the rank is 3 (which
    equals the number of elements in `[2,2,3]`) and the size is 12 (2x2x3=12).


    # THE TF.REDUCE_PROD() AND TF.REDUCE_SUM() API


    Listing 2.11 displays the contents of `tf-reduce-prod.py`, which illustrates how
    to invoke the `TF.reduce_prod()` and `TF.reduce_sum()` APIs for multiplying and
    adding, respectively, the numeric elements in a TF tensor.


    **LISTING 2.11: tf-reduce-prod.py**


    ![image](images/page_57-1.jpg)


    Listing 2.11 defines the TF constants `x` and `y`, followed by three variables
    of which the values are based on three TF APIs. Specifically, `sum_x` equals the
    value of invoking the `tf.reduce_sum()` API with the TF constant `x`, which equals
    the sum of the numeric elements of `x`. Next, `prod_y` equals the value of invoking
    the `tf.reduce_prod()` API with the TF constant `y`, which equals the product
    of the numeric elements of `y`. Finally, `div_xy` equals the ratio of `sum_x`
    and `prod_y`. The output from launching the code in Listing 2.11 is:


    ```

    600

    6

    100

    ```


    # THE TF.REDUCE_MEAN() API


    Listing 2.12 displays the contents of `tf-reduce-mean.py` that illustrates how
    to invoke the `TF.reduce_mean()` APIs.


    **LISTING 2.12: tf-reduce-mean.py**


    ![image](images/page_58.jpg)


    Listing 2.12 defines the TF constants `x` and `y`, followed by three variables,
    the values of which are based on three TF APIs. Specifically, `sum_x` equals the
    value of invoking the `tf.reduce_sum()` API with the TF constant `x`, which equals
    the sum of the numeric elements of `x`. Next, `prod_y` equals the value of invoking
    the `tf.reduce_prod()` API with the TF constant `y`, which equals the product
    of the numeric elements of `y`. Finally, `mean` equals the sum of `sum_x` and
    `prod_y`. The output from launching the code in Listing 2.12 is:


    ```

    303

    ```


    # THE TF.REDUCE_MEAN() API


    Listing 2.13 displays the contents of `tf-mean1.py`, which illustrates how to
    invoke the `TF.reduce_mean()` APIs.


    **LISTING 2.13: tf-reduce-mean2.py**


    ![image](images/page_59.jpg)


    Listing 2.13 defines the TF constant `x1`, which is a 4x3 tensor. The next portion
    of Listing 2.13 defines `y1` and `y2` via the TF API `tf.reduce_sum()`. The contents
    of `y1` is the column-wise averages, and the contents of `y2` is the row-wise
    averages. The output from Listing 2.13 is:


    ```

    (''y1:'', array([2.5, 2.5, 2.5], dtype=float32))

    (''y2:'', 2.5)

    ```


    # THE TF RANDOM_NORMAL() API (2)


    The TensorFlow `tf.random_normal()` API returns a set of values from a normal
    distribution with mean equal to 0 and standard deviation equal to 1 as the default
    values.


    Listing 2.14 displays the contents of `tf-rand-normal2.py` that illustrates how
    to use the `random_normal()` API with a NumPy array.


    **LISTING 2.14: tf-rand-normal2.py**


    ![image](images/page_59-1.jpg)


    Listing 2.14 contains three for loops, all of which initialize the variable `x_train`
    by invoking the `tf.random_normal()` API with the mean equal to 5 and the stddev
    equal to 2.0. Moreover, all three loops define the `y_train` variable as a linear
    combination of the `x_train` values. The first parameter of the `tf.random_normal()`
    API specifies the shape of the set of random numbers. This parameter is set to
    `(1,)`, `(2,)`, and `(3,)` in the three for loops, which means that there will
    be one, two, and three columns of output, respectively.


    The output from Listing 2.14 displays the values of the `x_train` variable in
    each of the three for loops, as shown here:


    ![image](images/page_60-2.jpg)


    # THE TF.TRUNCATED_NORMAL() API


    The `tf.truncated_normal()` API produces a set of random values from a truncated
    normal distribution, which differs from the `tf.random_normal()` API in terms
    of the interval from which random values are selected. First, visualize a regular
    normal distribution the mean of which is close to 0. Second, mentally “chop off”
    values that are more than 2 standard deviations from the mean, which results in
    a “truncated” normal distribution.

