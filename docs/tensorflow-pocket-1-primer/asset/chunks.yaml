    ## ReLU 的优缺点


    `ReLU` 的优点包括：


    • 在正区域不饱和

    • 计算方面效率极高

    • 模型收敛


    ## ELU


    `ELU` 是指数线性单元的缩写，它之所以仍然流行是因为使用 `ELU` 引入了额外的超参数。详情请阅读以下论文：[arxiv.org/abs/1511.0289](http://arxiv.org/abs/1511.0289)。


    ## Sigmoids


    `sigmoid` 激活函数的范围在 (0,1)，它会饱和并“杀死”梯度。与 `tanh` 激活函数不同，`sigmoid` 输出不是以零为中心的。


    ## Softmax


    `softmax` 激活函数将数据集中的值映射到另一组在 0 到 1 之间且和等于 1 的值。因此，`softmax` 创建了概率分布。在卷积神经网络（CNN）进行图像分类的情况下，`softmax`
    激活函数将最后一个隐藏层（通常缩写为 `FC`）中的值“映射”到输出层的 10 个神经元。包含最大概率的位置索引与输入图像独热编码中数字 1 的索引匹配。


    ## Softplus


    `softplus` 激活函数是 `ReLU` 激活函数的平滑（即可微）近似。回想原点是 `ReLU` 函数唯一的不可微点，该点通过 `softplus`
    激活函数被“平滑”，其方程如下：


    ```

    f(x) = ln(1 + e^x)

    ```


    ## Tanh


    `tanh` 激活函数的范围在 (-1,1)，而 `sigmoid` 函数的范围在 (0,1)。这两种激活都会饱和，但与 sigmoid 神经元不同，`tanh`
    输出是以零为中心的。


