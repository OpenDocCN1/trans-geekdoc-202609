- fmt: '

    The first chapter contains TensorFlow code samples that illustrate very simple
    TensorFlow functionality, followed by a chapter where code samples illustrate
    an assortment of TensorFlow built-in APIs. The third chapter delves into the TensorFlow
    Dataset, with a plethora of code samples that illustrate how to use “lazy” operators
    in conjunction with datasets. The fourth chapter discusses linear regression and
    the fifth chapter delves into logistic regression. If you think that you’ll struggle
    significantly with the code in the first two chapters, then an “absolute beginners”
    type of book is recommended to prepare you for this book.


    Another point: although Jupyter is popular, all the code samples in this book
    are Python scripts. However, you can quickly learn about the useful features of
    Jupyter through various online tutorials. In addition, it’s worth looking at Google
    Collaboratory, which is entirely online and is based on Jupyter notebooks, along
    with free GPU usage.


    ## HOW WERE THE CODE SAMPLES CREATED?


    The code samples in this book were created and tested using TensorFlow version
    1.12 on a Macbook Pro with OS X 10.12.6 (macOS Sierra). Regarding their content:
    the code samples are derived primarily from the author for his “Deep Learning
    and TensorFlow” graduate course. In some cases, there are code samples that incorporate
    short sections of code from discussions in online forums. The key point to remember
    is that the code samples follow the “Four Cs”: they must be clear, concise, complete,
    and correct to the extent that it’s possible to do so, given the size of this
    book.


    ## WHAT ARE THE TECHNICAL PREREQUISITES FOR THIS BOOK?


    You need some familiarity with Python, and also know how to launch Python code
    from the command line (in a Unix-like environment for Mac users). In addition,
    a mixture of basic linear algebra (vectors and matrices), probability/statistics
    (mean, median, standard deviation), and basic concepts in calculus (such as derivatives)
    will help you learn the material in this book.


    The following prerequisite is important for understanding the code samples in
    the last two chapters of this book: some familiarity with neural networks, which
    includes the concept of hidden layers and activation functions (even if you don’t
    fully understand them). Knowledge of cross entropy is also helpful for some of
    the code samples. To phrase things more colloquially, this book assumes that you
    know how to crawl in order to help you learn how to walk.


    Also keep in mind that TensorFlow provides a vast assortment of APIs, some of
    which are discussed in the code samples in the book chapters. While it’s possible
    for you to “pick up” the purpose of those APIs by reading the online documentation,
    that’s only true for the basic TensorFlow APIs, which is to say that you probably
    won’t really understand how they work and why they are needed until you work with
    them in TensorFlow code samples. In other words, if you read TensorFlow code samples
    containing APIs that you do not understand, in many cases you will not understand
    those APIs even after repeatedly reading the code samples.


    A more efficient approach is to learn about the purpose of the TensorFlow APIs
    by reading small code samples that illustrate the purpose of those APIs, after
    which you can read more complex TensorFlow code samples.


    ## WHAT ARE THE NON-TECHNICAL PREREQUISITES FOR THIS BOOK?


    Although the answer to this question is more difficult to quantify, it’s very
    important to have a strong desire to learn TensorFlow and machine learning, along
    with the motivation and discipline to read and understand the code samples.


    Even the non-trivial TensorFlow APIs can be a challenge to understand the first
    time you encounter them, so be prepared to read code samples several times.


    ## WHICH TOPICS ARE EXCLUDED?


    The book does not cover Convolutional Neural Networks (`CNN`), Recurrent Neural
    Networks (`RNN`), or Long Term Memory (`LSTM`).


    ## HOW DO I SET UP A SHELL?


    If you are a Mac user, there are three ways to do so. The first method is to use
    Finder to navigate to `Utilities` and then double click on `Terminal`.


    ```

    open /Applications/Terminal.app

    ```


    Next, if you already have a shell available, you can invoke it via `command+n`.
    If you are a PC user, you can install Cygwin (`https://cygwin.com/`) or use another
    toolkit such as MKS. Note that custom aliases are not automatically set if they
    are defined in a file other than `.bashrc`.


    ## WHAT ARE THE “NEXT STEPS” AFTER FINISHING THIS BOOK?


    The answer to this question varies widely, mainly because the answer depends heavily
    on your objectives. The best answer is to try a new tool or technique from the
    book on a problem you care about, professionally or personally.


    If you have reached the limits of what you have learned here and want to get further
    technical depth regarding TensorFlow, there are various online resources and literature
    describing complex features. Unless TensorFlow 1.x is a requirement, it’s probably
    a good idea to set aside some time to learn TensorFlow 2, which is available from
    the author in an upcoming Pocket Primer.


    ## COMPANION FILES


    Companion files with code samples and images from the book may be obtained by
    writing to the publisher at `info@merclearning.com`.


    # CHAPTER 1 INTRODUCTION TO TENSORFLOW


    This chapter provides a quick introduction to various features of TensorFlow,
    and some of the TensorFlow tools and projects that are included in the TensorFlow
    “family.” The intent of this chapter is to provide relevant TensorFlow information,
    how to visualize TensorFlow graphs via TensorBoard, how to invoke TensorFlow code
    in a browser via Jupyter notebooks, and where to train neural networks with free
    GPU support (Google Colaboratory). The material in this chapter will prepare you
    for Chapter 2, which provides a “foundation” of commonly used TensorFlow APIs
    (illustrated via short code samples) that are also in code samples in the remaining
    chapters.


    There are a few points to keep in mind before you read this chapter. First, in
    this book, TensorFlow refers to TensorFlow 1.x, unless explicitly stated otherwise.
    For expediency, you will often see the acronym `TF` used instead of TensorFlow.
    In addition, the historical details regarding TensorFlow are minimized in order
    to provide you with a decent set of TensorFlow code samples.

