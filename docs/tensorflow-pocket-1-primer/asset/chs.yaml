  \n### 什么是 tf.layers？\n\n`tf.layers` 命名空间包含用于神经网络层的各种类，包括 DNN 和 CNN。下面列出了 `tf.layers`\
  \ 中一些常见的类：\n\n- `BatchNormalization`: 批次归一化\n- `Conv2D`: 2D 卷积层（例如，图像上的空间卷积）\n-\
  \ `Dense`: 全连接层\n- `Dropout`: 对输入应用丢\n- `Flatten`: 在保留批轴（轴 0）的同时展平输入\n- `Layer`:\
  \ 基础层类\n- `MaxPooling2D`: 用于 2D 输入（例如图像）的最大池化层\n\n例如，一个极简的 CNN 从一个“三连组”开始，由 `Conv2D`\
  \ 层组成，后面跟着 ReLU（修正的线性单元）激活函数，然后是 `MaxPooling2D` 层。如果你看到这个三连组再次出现，随后是两个 `Dense` 层和\
  \ `softmax` 激活函数，它被称为“LeNet”。\n\n一点小知识：在 20 世纪 90 年代后期，当人们在自动银行机存款支票时，LeNet 扫描支票的内容来确定金额（当然，客户需要确认\
  \ LeNet 确定的数字是正确的）。LeNet 的准确率达到 90%，对于这样一个简单的卷积神经网络来说是非常令人深刻的结果！\n\n### TensorFlow\
  \ 其他有用部分\n\n删除前面节中的类外，TensorFlow 还提供了许多其他有用的命名空间，包括以下列表\n\n- `tf.data`\n- `tf.linalg`\n\
  - `tf.lite`\n- `tf.losses`\n- `tf.math`\n- `tf.nn`\n- `tf.random`\n- `tf.saved_model`\n\
  - `tf.test`\n- `tf.train`\n- `tf.version`\n\n`tf.data` 命名空间包含了 `tf.data.Dataset`\
  \ 命名空间，包含了本章前半部分讨论的类；`tf.linalg` 命名空间包含了执行线性代数操作的各种类；`tf.lite` 命名空间用于移动应用开发。`tf.math`\
  \ 命名空间包含了用于三角计算的类；`tf.nn` 命名空间包含了用于批次归一化、RNN、丢弃率和最大池化的类。\n\nTFRecord 是一个描述了模型在训练阶段和测试阶段所需数据的文件。TFRecord\
  \ 有两种协议缓冲区消息类型：`Example` 消息类型和 `SequenceExample` 消息类型。这些协议缓冲区消息类型允许你将数据排列从字符串键到整数列表、32\
  \ 位浮点数列表或字节列表的映射。\n\n\n\n\n\n`TFRecord` 中的数据被“封装”在一个 `Feature` 类中。此外，每个特征（feature）都以键值对的形式存储，其中键对应于分配给每个特征的标题。这些标题之后将用于从\
  \ `TFRecord` 中提取数据。创建的字典被作为输入传递给 `Feature` 类。最后，特征对象作为输入传递给 `Example` 类，并将其添加到 `TFRecord`\
  \ 中。上述过程对于存储在 `TFRecord` 中的每种类型的数据都会重复执行一遍。\n\n`TFRecord` 文件格式是一种面向记录的二进制格式，你可以将其用于训练数据。此外，`tf.data.TFRecordDataset`\
  \ 类允许你作为输入流水线的一部分，流遍历一个或多个 `TFRecord` 文件的内容。\n\n你可以在 `Example` 格式中存储任何类型的数据（包括图像）。然而，你需要指定将数据排列为序列化字节的机制，以及如何重构原始格式。\n\
