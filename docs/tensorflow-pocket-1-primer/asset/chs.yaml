  \ API，通过补充信息来“增强” TensorFlow 图，这些信息可以在 Web 浏览器中的 TensorBoard 中渲染。\n\n## TF 张量操作\n\
  \nTF 支持对 TensorFlow 张量进行许多算术运算，例如：\n\n- 张量成对相加\n- 张量相乘\n- 张量相除\n- 张量相减\n\n上述操作是基于两个张量的逐元素执行的。例如，两个\
  \ 2x2 张量的相加涉及四次加法，而两个 4x4 张量的相加涉及十六次加法。\n\nTF 的 `tf.argmax()` API 允许你找到二维 TF 张量每行（或每列）的最大值。该\
  \ API 在 CNN 中用于计算训练期间正确识别的图像数量（以 MNIST 为例）。TF 的 `tf.argmin()` API 与 `tf.argmax()`\
  \ API 类似，不同之处在于找到的是最小值而不是最大值。\n\nTensorFlow 提供了统计方法，如 `tf.reduce_mean()` 和 `tf.random_normal()`，用于计算一组数字的平均值以及从正态分布中随机选择数字。`tf.truncated_normal()`\
  \ API 与 `tf.random_normal()` API 类似，增加了一个约束条件：所选数字必须在指定的范围内（由你指定）。\n\n其他有用的 TensorFlow\
  \ API 如下列表所示：\n\n- `eval()`\n- `rank()`\n- `reduce_sum()`\n- `reshape()`\n- `range()`\n\
  - `equal()`\n- `one_hot()`\n- `name_scope()`\n- `summary.scalar()`\n\n在本章后面，你将看到演示如何使用上述列表中大多数\
