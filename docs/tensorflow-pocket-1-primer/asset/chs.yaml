  \ 50 次的 `for` 循环。`for` 循环首先通过“洗牌” `dsX` 和 `dsY` 的结果来初始化 `dsX` 和 `dsY`，这有助于减少匹配到非预期数据模式的概率。数组变量\
  \ `trainX` 和 `trainY` 分别被赋值为 `dsX` 和 `dsY` 的前 200 个值，其中 200 是变量 `trainsamples` 的值。\n\
