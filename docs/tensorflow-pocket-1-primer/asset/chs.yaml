  \n## 使用 TF.ESTIMATORS 和 TF.LAYERS（可选）\n\n下面介绍的第一个子节对于你具有使用如 `scikit-learn` 等 Python\
  \ 库进行常用机器学习算法的经验将非常有帮助。你将看到一个 TensorFlow 类列表，这些类类似于机器学习中基于 Python 的对应类，包含了用于回归任务的类和用于分类任务的类。\n\
  \n第二个子节包含了与在 TensorFlow 中定义 CNN 相关的 TensorFlow 类列表。\n\n如果你是机器学习的新手，那么这一节对你现在的价值有限，但你仍然可以学习目前可用的内容以备将来参考。\n\
  \n### 什么是 TF Estimators？\n\n`tf.estimator` 命名空间包含各种实现了机器学习中可用算法的类，例如提升树、`DNN classifiers`、`DNN\
  \ regressors`、线性分类器和线性线性回归器。\n\n与估计器相关的类 `DNNRegressor`、`LinearRegressor` 和 `DNNLinearCombinedRegressor`\
  \ 用于回归任务，而类 `DNNClassifier`、`LinearClassifier` 和 `DNNLinearCombinedClassifier` 用于分类任务。下面列出了更广泛估计器类列表（带有非常短的描述）：\n\
  \n- `BoostedTreesClassifier`: 用于 TensorFlow Boosted Trees 模型的分类器\n- `BoostedTreesRegressor`:\
  \ 用于 TensorFlow Boosted Trees 模型的回归器\n- `CheckpointSaverHook`: 每隔 N 步或每秒保存检查点\n\
  - `DNNClassifier`: 用于 TensorFlow DNN 模型的分类器\n- `DNNEstimator`: 用于用户指定头的 TensorFlow\
  \ DNN 模型的估计器\n- `DNNLinearCombinedClassifier`: 用于 TensorFlow Linear 和 DNN 联合分类模型的估计器\n\
  - `DNNLinearCombinedRegressor`: 用于 TensorFlow Linear 和 DNN 联合回归模型的估计器\n- `DNNRegressor`:\
  \ 用于 TensorFlow DNN 模型的回归器\n- `Estimator`: 用于训练和评估 TensorFlow 模型的估计器类\n- `LinearClassifier`:\
  \ 线性分类器模型\n- `LinearEstimator`: 用于用户指定头的 TensorFlow 线性模型的估计器\n- `LinearRegressor`:\
  \ 用于 TensorFlow 线性回归问题的估计器\n\n所有估计器类都在 `tf.estimator` 命名空间中，并且所有估计器类都继承自 `tf.estimator.Estimator`\
  \ 类。请阅读在线文档以获取上述类的详细信息，并查看在线教程获取相关的代码示例。\n\n### TF Estimators 和 tf.data.Dataset（可选）\n\
