  ## 使用 KERAS\n\n如引言所述，本节对 Keras 进行了非常短的介绍，将为你提供创建基于 Keras 模型所需的最少知识（事实上，有整本书的书都在介绍\
  \ Keras）。\n\n如果你是 Keras 的初学者，有几点需要记住。首先，Keras 已经集成到 TF 1.x 的最新版本中，并作为 TF 2 的核心部分，位于\
  \ `tf.keras` 命名空间下。其次，Keras 非常适合定义模型来解决各种任务，例如线性回归和逻辑回归，以及涉及 CNN、RNN 和 LSTM 的深度学习任务。\n\
  \n一个 Keras 模型通常至少涉及以下步骤：\n\n*   指定数据集（如有必要，将数据转换为数值数据）\n*   将数据集拆分为训练数据和测试数据（通常采用\
  \ 80/20 分 split）\n*   定义 Keras 模型 (`tf.keras.models.Sequential()`)\n*   编译 Keras\
  \ 模型（使用 `compile()` API）\n*   训练（fit）Keras 模型（使用 `fit()` API）\n*   进行预测（使用 `prediction()`\
  \ API）\n\n注意，上述列表项目跳过了一些实际 Keras 模型包含的步骤，例如在测试数据上评估 Keras 模型，以及处理过拟合等问题。\n\n第一个列表项目说明你需要一个数据集，它可以简单到如一个包含\
  \ 100 行数据的 CSV 文件（仅 3 列）。通常情况下，数据集要大得多：它可以是一个包含 1,000,000 行数据和每行 10,000 列的文件。我们将在后续章节中查看一个具体的数据。\n\
  \n接下来，Keras 模型位于 `tf.keras.models` 命名空间，最简单（也是最）的 Keras 模型是 `tf.keras.models.Sequential`。通常，Keras\
  \ 模型包含位于 `tf.keras.layers` 命名空间的层，例如 `tf.keras.Dense`（这意味着两个相邻层是全连接的）。\n\nKeras\
  \ 层中引用的激活函数位于 `tf.nn` 命名空间，例如用于 ReLU 激活函数的 `tf.nn.ReLU`。\n\n以下是上述段落描述的 Keras 模型代码块（涵盖了前四个列表点）：\n\
