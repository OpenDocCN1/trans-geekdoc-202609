  \ `x_predict` 数组中对应值的 3 倍。这说明像列表 13 这样的小数据集很难产生准确的预测。\n\n## 总结\n\n本章向你介绍了线性回归，并简要描述了如何为欧几平面上的数据集计算拟合线。你学习了如何使用\
  \ `NumPy` 执行线性回归以初始化数据数组，以及一种为 `y` 值引入某些随机性的“扰动”技术。这种技术非常有用，因为你会知道拟合线的斜率和截距的正确值，然后将其与训练值进行比较。\n\
  \n然后你学习了如何在涉及 TensorFlow 的示例中执行线性回归。此外，你学习了如何使用 `Matplotlib` 显示拟合线的线图以及训练期间代价与迭代次数关系的图表。最后，你学习了如何使用\
  \ `tf.estimator` 类来训练线性模型。\n\n# 第 5 章：逻辑回归\n\n本章假设你接触过激活函数（即使你不完全理解它们），并且已经读过第 4\
  \ 章的内容。此外，你对神经网络中的隐藏层有基本的理解，而书中并未讨论这一点。根据你的熟悉程度，你可能需要在深入本章之前阅读一些准备性材料（网上有许多文章）。\n\
  \n上述假设的理由是，如前言所述，这本书不是为“绝对初学者”准备的，为每章每个代码示例中的每个概念提供非常详细的解释可能会使这本书的长度增加一倍。然而，本书属于高级初学者的“口袋指南”（Pocket\
  \ Primer）系列，该系列假设读者已经（有限地）接触过本章中的某些概念。\n\n因此，本书尝试一种折中方案：在解释可以扩展你现有知识时包含它们，同时在代码方面“直奔主题”（通俗地说）。根据你的背景，准备好花一些时间阅读代码示例，并随时“调整”参数的值以查看它们如何影响代码性能。\n\
  \n正如你所看到的，本章的代码示例比上一章少，但长度相对较长。在某些情况下，代码示例顶部的注释块中有一个 TF API 列表。某些代码示例被分为几个子部分，以便更容易理解代码。如果你需要阅读多次代码示例，请不要惊讶，更重要的是，不要被学习曲线所挫败。作为一种安慰：在你用过\
  \ TF 1.x 之后，你会发现 TF 2 比 TF 1.x 更容易，你的学习曲线可能会缩短很多。\n\n\n\n\n考虑到上述几点，本章的第一节将简要讨论线性分类器，接着概述激活函数，激活函数对深层神经网络至关重要。在本节中，你将学习在神经网络中如何以及为什么要使用这些函数。本节还包含了一份用于激活函数的\
  \ `TensorFlow` API 列表，并对其中一些的优点进行了描述。尽管 `Logistic Regression`（逻辑回归）依赖于 `sigmoid`\
  \ 函数，但学习其他一些激活函数仍然是值得的。此外，你将看到一个包含 `TensorFlow` 和 `sigmoid` 激活函数的代码示例。\n\n第二节介绍了逻辑回归，它实际上是一个分类器（尽管名字里有回归）。本节包含一个涉及\
  \ `TensorFlow` 和 `Logistic Regression` 的代码示例。本章的最后部分对 `Keras` 进行了简要介绍，并提供了一个说明如何为\
  \ `MNIST` 数据集定义基于 `Keras` 模型的示例。`Keras` 深度集成在最新版本的 `TF 1.x` 中，它也是 `TensorFlow 2`\
  \ 的核心部分。之后，如果你计划学习 `TensorFlow 2`，那么学习更多关于 `Keras` 的知识绝对是值得的。\n\n## 什么是分类？\n\n分类的目的是预测给定数据点的类别，其中类别指的是分类，也称为目标或标签。例如，邮件服务提供商的垃圾邮件检测涉及二分类（只有\
  \ 2 个类目）。`MNIST` 数据集包含一组图像，每张图像都是单数字，这意味着有 10 个标签。分类的一些应用包括：贷款审批、医疗诊断和目标营销。\n\n\
  ## 什么是分类器？\n\n在上一章中，你学习了线性回归如何结合数值数据使用监督学习：目标是训练一个可以进行数值预测的模型（例如，明天的股票价格、系统的温度、其气压等）。\n\
  \n相比之下，分类器结合非数值类别的数据使用监督学习：其目标是训练一个可以进行类别预测的模型。例如，假设数据集中的每一行代表一种特定的葡萄酒，每一列对应一个特定的葡萄酒特征（单宁酸、酸度等）。\n\
  \n进一步假设数据集中有五类葡萄酒：为了简单起见，我们将它们标记为 A、B、C、D 和 E。给定一个新的数据点（即新的一行数据），该数据集的分类器将尝试确定这只新酒的标签。\n\
  \n本章中的某些分类器既可以执行类别分类，也可以进行数值预测（即它们既可以用于回归，也可以用于分类）。\n\n## 常见分类器\n\n这里列出了机器学习中最流行的一些分类器：\n\
  \n- 线性分类器\n- kNN\n- 逻辑回归\n- 决策树\n- 随机森林\n- SVMs\n- 贝叶斯分类器\n- CNNs（深度学习）\n\n在深度学习中，图像分类可以通过\
  \ `CNNs`（卷积神经网络）实现，这使得成为分类器（它们也可以用于音频和文本处理）。\n\n请记住，不同的分类器有不同的优，这通常涉及到复杂性和准确性之间的权衡，类似于\
  \ AI 之外领域的算法。\n\n随后的章节将对上一节列出的 ML 分类器进行简要描述。\n\n## 什么是线性分类器？\n\n线性分类器将数据集划分为两类。线性分类器在\
  \ 2D 中是一条线，在 3D 中是一个平面，在高维空间中是一个超平面。\n\n当输入向量是稀疏的或维度很大时，通常会使用线性分类器。当分类速度很重要时，它们通常是最快的分类器。\n\
  \n## 什么是激活函数？\n\n最简短的描述：激活函数是（通常）一种向神经网络中引入非线性的非线性函数，从而防止层之间的“合并”。一些著名的激活函数是 `sigmoid`、`tanh`\
  \ 和 `ReLU`。\n\n假设我们有一个不包含激活函数的神经网络。连接输入层到第一个隐藏层的权重是一个矩阵，我们称之为 `W1`。接下来，连接第一个隐藏层到第二个隐藏层的权重是一个矩阵，我们称之为\
  \ `W2`。重复此过程，直到连接最后一个隐藏层到输出层：`Wk`。由于我们没有激活函数，我们可以简单地将 `W1`、`W2` 到 `Wk` 相乘并得到一个矩阵\
  \ `W`。我们现在将原始网络压缩为了输入层和一个输出层。\n\n幸运的是，当我们在每对层之间指定激活函数时，这种压缩就不会发生。换句话说，每层的激活函数防止了这种情况。因此，在训练过程中我们可以保持所有的隐藏层。\n\
  \n为了简单，假设相邻层之间具有相同的激活函数（我们很快会取消这个假设）。在神经网络中使用激活函数的步骤如下：\n\n1. 从输入向量 `x1` 开始\n2.\
  \ 将 `x1` 乘以连接输入层到第一个隐藏层的矩阵 `W1`，产生新向量 `x2`\n3. 将激活函数应用到 `x2` 的每个元素上，创建另一个向量 `x3`\n\
  \n此时，我们重复步骤 2 和 3，只是我们使用的是起始向量 `x3` 和连接第一个隐藏层到第二个隐藏层的权重矩阵 `W2`（如果只有一个隐藏层，则使用输出层）。\n\
  \n完成上述过程后，我们“保留”了神经网络，这意味着可以在数据集上对其训练。另一点：与其在每一步都使用相同的激活函数，你可以将每个激活函数替换为不同的激活函数（由你决定）。\n\
  \n## 为什么我们需要激活函数？\n\n上一节概述了从输入层通过隐藏层转换到输出向量的过程。激活函数在神经网络中的作用至关重要，因此在这里值得重复：激活函数“保留”了神经网络的结构，防止其被简化为输入层和输出层。换句话说，如果在每对层之间都指定非线性激活函数，那么我们就显式地控制了神经网络的精确层数。\n\
  \n如果没有非线性激活函数，我们只是将给定的一对连续层的权重矩阵乘以上一对连续层产生的输出向量。重复这种简单的乘法直到到达神经网络的输出层。\n\n\n\n\n\
  \n如果你是第一次遇到激活函数这个概念，它可能会让你困惑，所以这里有一个可能对你有帮助的类比。假设你深夜在开车，且公路上没有其他车。只要没有障碍物（停止标志、交通信号灯等），你就可以以恒速行驶。另一方面，假设你开车进了一家大型超市的停车场。当你接近减速带时，你必须减速、通过减速带，然后再次加速，并对每一个减速带重复这个过程。\n\
  \n将神经网络中的非线性激活函数想象成减速带的对应物：你无法无法保持恒速，这（通过类比）意味着你不能先将所有权重矩阵相乘并将它们“折叠”成单一的权重矩阵。另一个类比是路带有多个收费站的道路：你必须减速、支付路费，然后恢复行驶，直到到达下一个收费站。这些只是类比（因此是不完美的），旨在帮助你理解非线性激活函数的必要性。\n\
  \n## 常见激活函数\n\n尽管有很多激活函数（如果你知道如何做，也可以定义自己的），但以下是一些常见的激活函数列表，以及它们的简要描述：\n\n• `Sigmoid`\n\
  • `Tanh`\n• `ReLU`\n• `ReLU6`\n• `ELU`\n• `SELU`\n\n`sigmoid` 激活函数基于欧拉常数 `e`，值范围在\
  \ 0 到 1 之间，其公式所示：\n\n1\\[1+e^(-x)\\]\n\n`tanh` 激活函数也基于欧拉常数 `e`，其公式所示：\n\n\\[e^x\
  \ – e^(-x)\\]\\[e^x+e^(-x)\\]\n\n记住上述公式的一种方法是注意分子和分母具有相同的项：它们在分子中用 `-` 号隔开，在分母中用\
  \ `+` 号隔开。`tanh` 函数的值范围在 -1 到 1 之间。\n\n`ReLU`（修正线性单元）激活函数非常简单：如果 `x` 为负数，则 `ReLU(x)`\
  \ 为 0；对于 `x` 的所有其他值，`ReLU(x)` 等于 `x`。`ReLU6` 是 TensorFlow 特有的，它是 `ReLU(x)` 的变体：额外的限制是当\
  \ `x >= 6` 时 `ReLU(x)` 等于 6（因此得名）。\n\n`ELU` 是指数线性单元（Exponential Linear Unit），它是\
  \ `ReLU` 的指数“包络”，用指数激活函数替换了 `ReLU` 的两个线性段，该函数对于所有 `x` 值（包括 `x = 0`）都是可微的。\n\n`SELU`\
  \ 是比例指数线性单元（Scaled Exponential Linear Unit）的缩写，它比其他激活函数稍微复杂（使用频率较低）。要详细解释这些以及其他激活函数（以及描述其形状的图表），请访问以下\
  \ Wikipedia 链接：\n\n[`en.wikipedia.org/wiki/Activation_function`](https://en.wikipedia.org/wiki/Activation_function)\n\
  \n上述链接提供了激活函数的列表及其导数。\n\n## TENSORFLOW 激活函数\n\nTensorFlow（以及许多其他框架）提供了许多激活函数的实现，这节省了你自己编写激活函数实现的时间精力。\n\
  \n以下是与列表中某些激活函数对应的 TensorFlow API 列表：\n\n• `tf.nn.relu`\n• `tf.nn.relu6`\n• `tf.nn.selu`\n\
  • `tf.nn.softmax`\n• `tf.nn.softplus`\n• `tf.nn.sigmoid`\n• `tf.nn.tanh`\n\n## ReLU\
