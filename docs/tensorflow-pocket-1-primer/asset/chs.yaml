  \n## TF 变量对比 TF 张量\n\n请记住 TF 变量与 TF 张量之间的以下区别：TF `variables` 代表你模型的可训练参数（例如：神经网络的权重和偏置），而\
  \ TF `tensors` 代表馈入你模型的数据以及这些数据在通过模型过程中的中间表示。\n\n## 在 TensorFlow 图中初始化变量\n\n在本章的早些部分，你已经学习了如何在\
  \ TensorFlow 会话中初始化变量。这样做将根据其计算值初始化变量，例如根据变量 `W` 和 `x` 定义的变量 `lm`。\n\nTensorFlow\
  \ 方法 `tf.global_variables_initializer()` 显式地触发代码中所有变量的初始化，并以异步模式运行。\n\n## TensorFlow\
