  \n\n\n\n该截断区间是选择随机数时的区间。具体来说，随机生成一个数字，如果该数字位于“截断”正态分布内部，则将其包含在“结果”集中。然而，如果随机选取的值位于截断正态分布之外，则重新生成该值（如有必要重复操作），直到它位于截断正态分布内部，然后将该数字包含在“结果”集中。\n\
