  \n本章的第一部分简要讨论了线性回归涉及的基本概念。尽管线性回归是在 200 多年前开发的，但这种技术仍然是解决统计学和机器学习中（尽管是简单的）问题的“核心”技术之一。事实上，被称为“均方误差”（MSE）的技术用于寻找最佳拟合线。……（注：原文后续出现大量重复段落，以下为对原文重复部分的完整翻译）\n\
  \n……技术。被称为“均方误差”（MSE）的技术用于寻找最佳拟合线。……（此处根据原文重复内容进行对应翻译）\n\n## 什么是线性回归？\n\n线性回归的目标是找到一个能够表示数据集的拟合线。首先，线性回归并不一定穿过数据中的所有点。……（此处根据原文重复内容进行对应翻译）\n\
  \n\n\n\n[content]\n请记住，虽然“传统”线性回归的闭式解可以为 `m` 和 `b`提供精确值，但有时你只能使用该精确值的近似值。例如，假设最佳拟合线的斜率\
  \ `m` 等于 3 的平方根，y 截距 `b` 等于 2 的平方根。如果你计划在源代码中使用这些值，你只能处理这两个数字的近似值。在相同的情况下，神经网络会计算\
  \ `m` 和 `b` 的近似值，无论 `m` 和 `b` 的精确值是无理数、有理数还是整数。然而，机器学习算法更适用于复杂的、非线性的多维数据集，而这超出了线性回归的能力范围。\n\
  \n举一个简单的例子，假设线性回归问题的闭式解为 `m` 和 `b` 产生了整数或有理值。具体来说，假设闭式解得到的最佳拟合线斜率和 y 截距的值分别为 `2.0`\
  \ 和 `1.0`。该线的方程如下：\n\n```\ny = 2.0 * x + 1.0\n```\n\n然而，通过训练神经网络得到的相应解可能会为斜率 `m`\
  \ 和 y 截距 `b` 分别产生 `2.0001` 和 `0.9997` 作为最佳拟合线的值。始终记住这一点，尤其是当你训练神经网络时。\n\n## 什么是多变量分析？\n\
  \n多变量分析将欧几里得平面上的直线方程推广到更高维，它被称为“超平面”而不是“直线”。广义方程具有以下形式：\n\n```\ny = w1*x1 + w2*x2\
  \ + . . . \\+ wn*xn + b\n```\n\n在 2D 线性回归中，你只需要找到斜率（`m`）和 y 截距（`b`）的值，而在多变量分析中，你需要找到\
  \ `w1`、`w2`、`...`wn` 的值。注意，多变量分析是一个统计学术语，在机器学习中通常被称为“广义线性回归”。\n\n请记住，书中与线性回归的大多数代码示例涉及欧几里得平面上的\
  \ 2D 点。\n\n## 其他类型的回归\n\n线性回归找到一条“代表”数据集的最佳拟合线，但如果平面上的直线并不是数据集的良好拟合会发生什么？当你处理数据集时，这是一个相关的问题。\n\
  \n线性回归的一些替代方案包括二次方程、立方方程或高阶多项式。然而，正如我们稍后讨论的，这些替代方案涉及到权衡。\n\n另一种可能性是涉及分段线性函数的混合方法，它由一组线段组成。如果相邻的线段连接起来，那么它就是分段线性连续函数；否则它是分段线性不连续函数。\n\
  \n因此，给定平面上点集，回归涉及解决以下问题：\n\n1. 哪种类型的曲线能很好地拟合数据？如何知道？\n2. 是否有其他类型的曲线能更好地拟合数据？\n3.\
  \ “最佳拟合”意味着什么？\n\n检查直线是否拟合数据的一种方法是视觉检查，但这种方法对于维度高于两个维度的数据点无效。此外，这是一个主观决定，本章稍后部分将显示一些示例数据集。通过对数据集进行视觉检查，你可能会判断二次或三次（甚至更高阶）多项式有潜力成为数据更佳的拟合模型。然而，视觉检查可能仅限于\
  \ 2D 平面或三维空间中的点。\n\n让我们推迟非线性场景，并假设直线能够很好地拟合数据。对于此类数据集，有一种著名的技术可以寻找“最佳拟合”线，称为 MSE（均方误差），我们将在本章稍后讨论。\n\
