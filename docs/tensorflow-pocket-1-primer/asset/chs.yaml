  \ <tf.RaggedTensor [[1, 2, 3, 4], [], [5, 6, 7], [8], []]]>\n```\n\n## 什么是迭代器（ITERATORS）？\n\
  \n非正式地说，迭代器类似于其他语言中的“指针”。通过迭代器，你可以遍历数据集。\n\n处理数据集和迭代器涉及以下步骤：\n\n1. 创建数据集\n2. 创建迭代器\n\
  3. 迭代器指向元素\n4. 获取元素\n5. 移动迭代器到下一个元素\n6. 如果还有更多元素，则继续；否则通过 `try/except` 块处理这种情况。\n\
  \n## TensorFlow 迭代器\n\nTensorFlow 支持四种迭代器，如下所示：\n\n1. 单次（One shot）\n2. 可初始化（Initializable）\n\
  3. 可重初始化（Reinitializable）\n4. 可馈（Feedable）\n\n单次迭代器只能遍历数据集一次。当我们到达数据集末尾时，它不再产生元素；而是会抛出一个异常。例如，如果\
  \ `dx` 是 `data.Dataset` 的实例，那么以下代码片段定义了一个单次迭代器：\n\n```python\niterator = dx.make_one_shot_iterator()\n\
  ```\n\n可初始化迭代器可以动态更新：通过 `feed_dict` 参数传递新数据来初始化。如果 `dx` 是 `data.Dataset` 的实例，那么以下代码片段定义了一个可初始化迭代器：\n\
  \n```python\niterator = dx.make_initializable_iterator()\n```\n\n可重初始化迭代器可以从不同的数据集进行初始化。这种迭代器对于需要额外转换（如洗牌内容）的数据集非常有用。\n\
  \n可馈迭代器允许你从迭代器中选择：这种迭代器本质上是用于选择迭代器的“选择器”。\n\n## TensorFlow 重用迭代器\n\n列表 3.5 显示了 `tf-init-iterator.py`，演示了如何在\
  \ TensorFlow 中定义重用迭代器。\n\n### 列表 3.5: tf-init-iterator.py\n\n![image](img/page_82.jpg)\n\
