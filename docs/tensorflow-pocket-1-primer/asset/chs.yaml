  \n```\ny: [24]\n```\n\n## TF.SIZE(), TF.SHAPE(), AND TF.RANK() API\n\n这三个 TensorFlow\
  \ API 之间某种关联，因此它们包含在同一个章节中以便参考。\n\n`tf.size()` API 返回 TF 张量中的元素数量。这里有一个简单的示例：\n\n\
