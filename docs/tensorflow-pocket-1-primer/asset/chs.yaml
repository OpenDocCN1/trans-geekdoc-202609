  \ `testX` 和 `testY` 分别初始化为数组 `dsX` 和 `dsY` 最右侧的 60 个值，其中 60 是变量 `testsamples` 的值。\n\
  \n接下来，变量 `cost1` 被初始化为零，随后是另一个简单的循环（与之前的内部循环类似），它根据测试数据计算 `cost1` 的值。该循环在每隔 10 次迭代后还会打印代价值。\n\
