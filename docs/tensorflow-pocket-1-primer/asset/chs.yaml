  • `tf.nn.softmax`\n• `tf.nn.softplus`\n• `tf.nn.sigmoid`\n• `tf.nn.tanh`\n\nTensorFlow（以及许多其他框架）提供了许多激活函数的实现，这节省了你自己编写激活函数实现的时间精力。\n\
  \n以下是列表中某些激活函数对应的 TensorFlow API 列表：\n\n• `tf.nn.relu`\n• `tf.nn.relu6`\n• `tf.nn.selu`\n\
  • `tf.nn.softmax`\n• `tf.nn.softplus`\n• `tf.nn.sigmoid`\n• `tf.nn.tanh`\n\nTensorFlow（以及许多其他框架）提供了许多激活函数的实现，这节省了你自己编写激活函数实现的时间精力。\n\
  \n以下是列表中某些激活函数对应的 TensorFlow API 列表：\n\n• `tf.nn.relu`\n• `tf.nn.relu6`\n• `tf.nn.selu`\n\
  • `tf.nn.softmax`\n• `tf.nn.softplus`\n• `tf.nn.sigmoid`\n• `tf.nn.tanh`\n\nTensorFlow（以及许多其他框架）提供了许多激活函数的实现，这节省了你自己编写激活函数实现的时间精力。\n\
  \n以下是列表中某些激活函数对应的 TensorFlow API 列表：\n\n• `tf.nn.relu`\n• `tf.nn.relu6`\n• `tf.nn.selu`\n\
  • `tf.nn.softmax`\n• `tf.nn.softplus`\n• `tf.nn.sigmoid`\n• `tf.nn.tanh`\n\nTensorFlow（以及许多其他框架）提供了许多激活函数的实现，这节省了你自己编写激活函数实现的时间精力。\n\
  \n以下是列表中某些激活函数对应的 TensorFlow API 列表：\n\n• `tf.nn.relu`\n• `tf.nn.relu6`\n• `tf.nn.selu`\n\
  • `tf.nn.softmax`\n• `tf.nn.softplus`\n• `tf.nn.sigmoid`\n• `tf.nn.tanh`\n\n## ReLU\
  \ 的优缺点\n\n`ReLU` 的优点包括：\n\n• 在正区域不饱和\n• 计算方面效率极高\n• 模型收敛\n\n## ELU\n\n`ELU` 是指数线性单元的缩写，它之所以仍然流行是因为使用\
  \ `ELU` 引入了额外的超参数。详情请阅读以下论文：[arxiv.org/abs/1511.0289](http://arxiv.org/abs/1511.0289)。\n\
  \n## Sigmoids\n\n`sigmoid` 激活函数的范围在 (0,1)，它会饱和并“杀死”梯度。与 `tanh` 激活函数不同，`sigmoid`\
  \ 输出不是以零为中心的。\n\n## Softmax\n\n`softmax` 激活函数将数据集中的值映射到另一组在 0 到 1 之间且和等于 1 的值。因此，`softmax`\
  \ 创建了概率分布。在卷积神经网络（CNN）进行图像分类的情况下，`softmax` 激活函数将最后一个隐藏层（通常缩写为 `FC`）中的值“映射”到输出层的\
  \ 10 个神经元。包含最大概率的位置索引与输入图像独热编码中数字 1 的索引匹配。\n\n## Softplus\n\n`softplus` 激活函数是 `ReLU`\
  \ 激活函数的平滑（即可微）近似。回想原点是 `ReLU` 函数唯一的不可微点，该点通过 `softplus` 激活函数被“平滑”，其方程如下：\n\n```\n\
  f(x) = ln(1 + e^x)\n```\n\n## Tanh\n\n`tanh` 激活函数的范围在 (-1,1)，而 `sigmoid` 函数的范围在\
  \ (0,1)。这两种激活都会饱和，但与 sigmoid 神经元不同，`tanh` 输出是以零为中心的。\n\n\n\n\n尽管 `sigmoid` 和 `tanh`\
  \ 激活函数不是卷积神经网络的首选激活函数，但这两种激活函数都出现在 LSTM（以及其他 RNN）中与输入门、遗忘门和输出门的计算中（这些内容都超出了本书的讨论范围）。\n\
  \n## Sigmoid、softmax 和 hardmax\n\n本节简要讨论了这三个函数之间的某些区别。首先，`sigmoid` 函数用于逻辑回归模型中的二分类，以及\
  \ LSTM 和 GRU 中的门控。在构建神经网络时，`sigmoid` 函数被用作激活函数，但请记住，概率之和并不一定等于 1。\n\n其次，`softmax`\
  \ 函数是 `sigmoid` 函数的推广：它用于逻辑回归模型中的多分类。`softmax` 函数是 CNN 中“全连接层”的激活函数，该层通常是最右侧的隐藏层和输出层。与\
  \ `sigmoid` 函数不同，概率之和必须等于 1。你可以使用 `sigmoid` 函数或 `softmax` 进行二分类（n=2）。\n\n第三，所谓的“hardmax”函数为输出值分配\
  \ 0 或 1（类似于阶跃函数）。例如，假设我们有三个类别 `{c1, c2, c3}`，它们的得分分别为 `[1, 7, 2]`。`hardmax` 概率为\
  \ `[0, 1, 0]`，而 `softmax` 概率为 `[0.1, 0.7, 0.2]`。注意，`hardmax` 概率之和为 1，`softmax` 概率之和也是如此。然而，`hardmax`\
  \ 概率是全有或无，而 `softmax` 概率类似于获得“部分分数”。\n\n## TensorFlow 与 sigmoid 激活函数\n\n列表 5.1 显示了\
  \ `tf-activation-functions.py` 的内容，展示了如何创建一个包含七个激活函数的 TensorFlow 图，其中包含了逻辑回归的 `sigmoid`\
  \ 函数。\n\n***列表 5.1: tf-activation-functions.py***\n\n![image](img/page_149.jpg)\n\
