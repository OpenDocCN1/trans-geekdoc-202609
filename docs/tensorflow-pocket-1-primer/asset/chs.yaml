  \ 5.2***TensorFlow 激活函数。\n\n## 什么是逻辑回归？\n\n逻辑回归本质上是将 `sigmoid` 激活函数“应用”到线性回归上，以执行二分类。逻辑回归在许多不相关的领域都非常有用。这些领域包括机器学习、各种医学领域和社会科学。逻辑回归可以根据患者的各种观察特征预测预测某种的风险。其他使用逻辑回归的领域还包括工程、营销和经济学。\n\
  \n逻辑回归可以是二项（因变量只有两个结果）、多项（因变量有三个或更多结果）或序数的（因变量是有顺序的）。\n\n例如，假设一个数据集包含属于 A 类或 B 类的数据。如果你给一个新的数据点，逻辑回归会预测该新数据点属于\
  \ A 类还是 B 类。相比之下，线性回归预测的是数值，例如股票的次日价格。\n\n*尽管名字如此，但逻辑回归是一种分类技术，而不是回归技术。*\n\n## TensorFlow\
  \ 与逻辑回归 (1)\n\n列表 5.2 显示了 `logistic-regression1.py` 的内容，它定义了（但没有调用）Python 方法 `model()`，该方法计算向量与矩阵的积，然后应用\
  \ TensorFlow 的 `sigmoid()` 函数。换句话说，`model()` 方法执行了神经网络中两个相邻层之间的转换。\n\n本节的代码示例旨在展示“设置”代码，下一节包含调用\
  \ `model()` 方法的完整代码。\n\n***列表 5.2: logistic-regression1.py***\n\n![image](img/page_152.jpg)\n\
  \n列表 5.2 起于一些导入语句，包括一个用于 SKLearn `shuffle` API 的导入，用于下一节的完整代码示例。列表 5.2 的后续部分初始化了变量\
  \ `trainsamples` 和 `testamples`，分别代表训练样本和测试样本的数量。\n\n列表 5.2 的后续部分定义了 `model()` 方法，它接收参数\
  \ `X`、`hidden_weights`、`hidden_bias1` 和 `ow`。`model()` 方法只有两行代码。第一行代码通过调用 TensorFlow\
