  \ TF 层。\n\n## TENSORFLOW 数据集\n\nTensorFlow Datasets（通过 `tf.data.Dataset` 命名空间访问）非常适用于创建异步优化的数据流水线。简而言之，TF\
  \ Dataset API 从磁盘加载数据（包括图像和文本），应用优化转换，创建批次（batches），并将批次发送到 GPU。因此，TF Dataset API\
  \ 有于提高 GPU 利用率。此外，在 TF 2.0 中使用 `tf.functions` 可以充分利用数据集的异步预取/流式功能。\n\nTF Dataset\
  \ 充当数据集周围的类似容器的“包装器”，类似于 Pandas DataFrame。因此，一个非常大的数据集可以涉及一个巨大的 TF Dataset。TF Dataset\
  \ 也可以将输入流水线表示为元素的集合（即张量的嵌套结构），以及作用于这些元素的转换的“逻辑计划”。例如，你可以定义一个 TF Dataset，它初始包含文本文件中的文本行，然后提取以\
  \ \"\" 字符开头的文本行，最后只显示前三行。创建这个流水线很容易：创建一个 TF Dataset，然后链式调用懒运算符 `filter()` 和 `take()`，这与你将在本章稍后看到的示例类似。\n\
