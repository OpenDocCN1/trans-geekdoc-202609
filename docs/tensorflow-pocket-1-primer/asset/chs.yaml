  \ TensorFlow API 列表：\n\n• `tf.nn.relu`\n• `tf.nn.relu6`\n• `tf.nn.selu`\n• `tf.nn.softmax`\n\
  • `tf.nn.softplus`\n• `tf.nn.sigmoid`\n• `tf.nn.tanh`\n\nTensorFlow（以及许多其他框架）提供了许多激活函数的实现，这节省了你自己编写激活函数实现的时间精力。\n\
