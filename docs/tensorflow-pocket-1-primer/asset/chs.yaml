- "# TensorFlow 入门指南\n\n\n\n\n\n\n\n\n\n\n\n### Oswald Campesato\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n## TensorFlow 数据集\n## 总结\n\n## 线性回归\n\n## 逻辑回归\n\n# 索引\n\n*前言*\n\
  \n**目标是什么？**\n\n本书的目标是向高级初学者介绍 TensorFlow 1.x 基础知识，用于实现 TensorFlow 中的基础机器学习算法。它旨在对\
  \ TensorFlow 的各种“核心”功能进行快速介绍，并配有涵盖深度学习的 TensorFlow 代码示例。章节中的内容说明了如何使用 TensorFlow\
  \ 解决各种任务，之后你可以通过进一步阅读来加深知识。\n\n本书提供的代码示例比中级和高级 TensorFlow 书籍中的更详细。尽管它包含了一些基础的 TensorFlow\
  \ 代码示例，但对 TensorFlow 有一定的熟悉将会有帮助。\n\n本书还将节省你搜索代码示例的时间，这可能是一个耗时的过程。无论如何，如果你不确定自己否吸收书中的内容，可以浏览一下代码示例以感受其复杂程度。\n\
  \n虽然这可能有些显而易见，但请记住以下一点：*你无法通过阅读这本书就成为 TensorFlow 专家。*\n\n\n\n\n第一章包含了 TensorFlow\
  \ 代码示例，展示了非常简单的 TensorFlow 功能，接后的章节通过代码示例展示了各种 TensorFlow 内置 API。第三章深入探讨了 TensorFlow\
  \ 数据集（Dataset），并提供了大量的代码示例，说明了如何将“懒性”操作与数据集结合。第四章讨论了线性回归，第五章深入探讨了逻辑回归。如果你认为自己在学习前两章的代码时会非常吃力，那么建议先读一本“绝对初学者”类型的书籍来为学习本书做准备。\n\
  \n另一点是：尽管 Jupyter 非常流行，但书中的所有代码示例都是 Python 脚本。不过，你可以通过各种在线教程快速了解 Jupyter 的实用功能。此外，值得关注\
  \ Google Collaboratory，它是完全在线的工具，基于 Jupyter 笔记本，并提供免费的 GPU 使用。\n\n## 代码示例是如何创建的？\n\
  \n书中的代码示例是在运行了 OS X 10.12.6 (macOS Sierra) 的 Macbook Pro 上使用 TensorFlow 1.12 版本创建并测试的。关于其内容：代码示例主要源自作者的“深度学习与\
  \ TensorFlow”研究生课程。在某些情况下，代码示例还包含了来自在线论坛讨论的短代码段。需要记住的关键点是，代码示例遵循“四 C”原则：考虑到本书的篇幅，它们必须尽可能做到**清晰、简洁、完整且准确**。\n\
  \n## 本书的技术前提条件是什么？\n\n你需要对 Python 有一定的了解，并知道如何从命令行启动 Python 代码（对于 Mac 用户，是在类 Unix\
  \ 环境下）。此外，掌握基础线性代数（向量和矩阵）、概率/统计学（平均值、中位数、标准差）以及微积分基础概念（如导数）将帮助你学习书中的内容。\n\n以下前提条件对于理解书中最后两章的代码示例至关重要：对神经网络有一定的了解，这包括隐藏层和激活函数的概念（即使你并不完全理解它们）。对交叉熵（cross\
  \ entropy）的知识对于某些代码示例也有帮助。通俗地说，这本书假设你已经学会了“爬”，以便帮助你学习如何“走”。\n\n还要记住，TensorFlow 提供了大量的\
  \ API，其中一些在书的章节代码示例中有所讨论。虽然你可以通过阅读在线文档来“掌握”这些 API 的用途，但这仅适用于基础的 TensorFlow API；也就是说，在你在\
  \ TensorFlow 代码示例中实际操作它们之前，你可能无法真正理解它们的工作原理以及为什么需要它们。换句话说，如果你阅读包含你不理解的 API 的 TensorFlow\
  \ 代码示例，很多情况下，即使反复阅读这些示例，你仍然无法理解这些 API。\n\n更高效的方法是通过阅读展示这些 API 用途的小型代码示例来学习 TensorFlow\
  \ API 的用途，之后阅读更复杂的 TensorFlow 代码示例。\n\n## 本书的非技术前提条件是什么？\n\n虽然这个问题的答案很难量化，但对学习 TensorFlow\
  \ 和机器学习的强烈愿望，以及阅读和理解代码示例的动力和自律，是非常重要的。\n\n即使是复杂的 TensorFlow API，在第一次遇到时也可能具有挑战性，因此请准备好阅读多次代码示例。\n\
  \n## 哪些主题未包含在内？\n\n本书不涵盖卷积神经网络 (`CNN`）、循环神经网络 (`RNN`）或长短期记忆网络 (`LSTM`）。\n\n## 我如何设置\
  \ Shell？\n\n如果你是 Mac 用户，有三种方法。第一种方法是使用 Finder 导航到 `Utilities`（实用工具），然后双击 `Terminal`（终端）。\n\
  \n```\nopen /Applications/Terminal.app\n```\n\n接下来，如果你已经有一个可用的 shell，可以通过 `command+n`\
  \ 调用它。如果你是 PC 用户，可以安装 Cygwin (`https://cygwin.com/`) 或使用其他工具包如 MKS。注意，如果自定义别名定义在\
  \ `.bashrc` 以外的文件中，将不会自动设置。\n\n## 完成本书后的“下一步”是什么？\n\n这个问题的答案差异很大，主要因为答案很大程度上取决于你的目标。最好的答案是针对一个你关心的专业或个人问题，尝试书中的新工具或新技术。\n\
  \n如果你已经达到了此处所学知识的极限，并想进一步获得 TensorFlow 的技术深度，有各种在线资源和文献描述了复杂的特性。除非 TensorFlow 1.x\
  \ 是硬性要求，否则花些时间学习 TensorFlow 2 可能是一个好主意，作者将在即将出版的 Pocket Primer 中介绍。\n\n## 配套文件\n\
  \n可以通过向出版社发送邮件至 `info@merclearning.com` 获取书中代码示例和图片的配套文件。\n\n# 第一章 TensorFlow 简介\n\
  \n本章简要介绍了 TensorFlow 的各种功能，以及 TensorFlow“家族”中包含的一些工具和项目。本章的意图是提供相关的 TensorFlow 信息、如何通过\
  \ TensorBoard 可视化 TensorFlow 图形、如何通过 Jupyter 笔记本在浏览器中调用 TensorFlow 代码，以及在哪里可以使用免费的\
  \ GPU 支持训练神经网络（Google Colaboratory）。本章的内容将为你学习第二章做好准备，第二章提供了常用 TensorFlow API 的“基础”（通过短代码示例说明），这些\
  \ API 也会出现在后续章节的代码示例中。\n\n在阅读本章之前，请记住几点。首先，在书中，除非另有说明，否则 TensorFlow 指的是 TensorFlow\
  \ 1.x。为了方便起见，你经常会看到用缩写 `TF` 代替 TensorFlow。此外，为了给你提供一套不错的的 TensorFlow 代码示例，关于 TensorFlow\
  \ 的历史细节被降到了最低。\n\n\n\n\n\n其次，书中的代码示例在 Macbook Pro (12.5.3) 上测试过，配备了 `Python` 3.5.1\
  \ 和 `TensorFlow` 1.12，这是目前 `TensorFlow 1.x` 的最新版本。当 `TensorFlow 2` 于 2019 年发布时，所有的\
  \ `TensorFlow 1.x` 版本将成为遗留代码。然而，Google 可能会在 `TensorFlow 2` 发布后继续支持 `TensorFlow 1.x`\
  \ 至少一年。届那时，`TF 1.x` 将不再有新的开发（安全更新除外）。\n\n本章的第一部分简要讨论了一些 `TensorFlow` 特性以及 `TensorFlow`\
  \ “家族”的一部分工具。本章第二部分将向你展示如何编写包含 `TF` 常量、`TF` 符（placeholders）和 `TF` 变量组合的 `TensorFlow`\
  \ 代码。阅读这些代码示例后，你将学习 `TF` 符和 `TF` 变量之间的区别，这通常会让初学者 `TensorFlow` 的人感到困惑。\n\n本章第三部分将向你展示如何在\
  \ `TensorFlow` 中执行算术运算、如何使用各种内置函数、如何计算三角值、`for loops`、`while loops`、`tf.less()`\
  \ API，以及如何计算指数值。\n\n第四部分包含 `TF` 代码示例，用于对数组执行各种操作，例如创建恒等矩阵、常量矩阵、随机均匀矩阵和截断正态矩阵。该部分还向你展示如何相乘\
  \ `TensorFlow` 数组以及如何将 `Python` 数组转换为 `TensorFlow` 数组。\n\n第四部分向你展示如何保存 `TensorFlow`\
  \ 图，以便你可以使用从命令行启动的内置 `TensorBoard` 工具在浏览器中查看其内容。最后一部分介绍了 Google Colaboratory，这是一个完全在线的、基于\
  \ Jupyter 的环境，提供每日 12 小时的免费 GPU 使用时长。\n\n## 什么是 TensorFlow？\n\n`TensorFlow` 是 Google\
  \ 于 2015 年 11 月发布的开源框架。`TensorFlow` 框架用于机器学习和深度学习。`TensorFlow` 演变自 Google Brain\
  \ 并通过 Apache 许可协议提供。在书中，`TensorFlow` 代码示例使用 `Python` 3.x。`TensorFlow` 还支持多种编程语言和硬件平台。以下是一些\
  \ `TensorFlow` 特性的简列表：\n\n- 支持 `Python`、`Java`、`C++`\n- 桌面、服务器、移动设备 (`TF Lite`)\n\
  - 支持 CPU/GPU/TPU\n- 支持 Linux 和 Mac OS X\n- Windows 虚拟机\n\n访问 `TensorFlow` 主页，你可以在那里找到许多关于\
  \ `TensorFlow` 的资源链接：\n\n[`www.tensorflow.org`](https://www.tensorflow.org)\n\n\
  通过命令行执行以下命令安装 `TensorFlow`：\n\n```bash\npip install tensorflow\n```\n\n如果你想将 `TensorFlow`\
  \ 升级到最新版本，请在命令行执行以下命令：\n\n```bash\npip install --upgrade tensorflow\n```\n\n## TensorFlow\
  \ 架构（高视图）\n\n`TensorFlow` 由两个主要组件组成：1) 图协议缓冲区（graph protocol buffer），2) 用于执行（分布式）图的运行时，它类似于\
  \ `Python` 代码和 `Python` 解释器。`TensorFlow` 用 `C++` 编写，并支持涉及原始值和所谓张量（后文将讨论）的各种图操作。\n\
  \n`TensorFlow` 为数值计算和数据流创建一个“计算”图，其核心理念是“一切皆图”。图和数据可视化通过作为 `TensorFlow` 一部分的 `TensorBoard`（后文将讨论）处理。正如你在书中的代码示例中所看到的，`TensorFlow`\
  \ API 在 `Python` 中可用，因此可以嵌入到 `Python` 脚本中。\n\n`TF 1.x` 的默认执行模式是延迟执行（deferred execution），而\
  \ `TF 2` 使用即时执行（eager execution，设为“立即模式”）。尽管 `TF 1.4` 引入了即时执行，但你在网上找到的大多数 `TF 1.x`\
  \ 代码示例都使用延迟执行。`TensorFlow` 支持对张量的算术运算（即增强的多维数组）以及条件逻辑和 `while loops`。\n\n`TensorFlow`\
  \ 提供了一个“检查点”（checkpoint）API 来保存 `TensorFlow` 图并在稍后恢复它们。此外，你可以在 `TensorBoard` 中查看保存的图，这是一个随\
  \ `TensorFlow` 绑定的非常有用的数据可视化工具。\n\n## TensorFlow 特性\n\n以下列表包含了 `TensorFlow` 的各种高级特性：\n\
  \n- 分布式计算\n- 开发新机器学习算法的 R/D\n- REPL 环境\n- 从训练到生产的模型迁移\n- 大规模分布式模型\n- 在不同机器上计算的 TF\
  \ 图\n- 移动模型\n\n上述大多数项目都是自言自明的。`TensorFlow` REPL（读-评估-打印循环）可以通过 `Python` REPL 使用，通过打开命令行\
  \ shell 并输入以下命令即可访问：\n\n```bash\npython\n```\n\n作为在 `Python` REPL 中访问 `TensorFlow`\
  \ 相关功能的简单示例，按如下方式导入 `TensorFlow`\n\n库：\n\n```python\n>>> import tensorflow as tf\n\
  ```\n\n现在用此命令检查机器上安装的 `TensorFlow` 版本：\n\n```python\n>>> print('TF version:',tf.__version__)\n\
  ```\n\n上述代码段的输出在此（你看到的数字取决于安装了哪个版本的 `TensorFlow`）：\n\n```\nTF version: 1.12.0\n\
  ```\n\n尽管 `Python` REPL 很有用，但可以在 `Python` 脚本中运行 `TensorFlow` 代码块。\n\n## TensorFlow\
  \ 用例\n\n`TensorFlow` 设计用于解决许多用例，此处列出了一些：\n\n- 图像识别\n- 计算机视觉\n- 语音/声音识别\n- 时间序列分析\n\
  - 语言翻译\n- 文本处理\n- 手写识别\n\n如果你之前不知道，上述列表还包含了适用于机器学习以及深度学习的常见用例。\n\n## 其他 TensorFlow\
  \ 工具包\n\n`TensorFlow` 拥有以下关联工具包：\n\n- `TensorBoard`（作为 `TensorFlow` 的一部分）\n- `TensorFlow\
  \ Serving`（托管）\n- `TensorFlow Lite`（用于移动端）\n- `tensorflow.js`（用于网页）\n\n`TensorFlow`\
  \ 分发包含 `TensorBoard`，这是一个图的可可视化工具。例如，输入以下命令访问 `/tmp/abc` 中保存的图：\n\n```bash\ntensorboard\
  \ --logdir=/tmp/abc\n```\n\n接下来，打开浏览器窗口并导航到此 URL：\n\n`localhost:6006`\n\n现在你看到保存在目录\
  \ `/tmp/abc` 中的 `TensorFlow` 图的可视化。\n\n`TensorFlow Serving` 是一个用于机器学习模型的灵活、高性能服务系统，适用于生产环境。`TensorFlow\
  \ Serving` 能够轻松部署新算法和实验，同时保持相同的服务器架构和 API。更多信息在此处：\n\n[`www.tensorflow.org/serving/`](https://www.tensorflow.org/serving/)\n\
  \n`TensorFlow Lite` 为开发移动应用（Android 和 iOS）而创建。`TensorFlow Lite` 取代了早期开发移动应用的 SDK\
  \ `TensorFlow Mobile`。`TensorFlow Lite` 是移动和嵌入式设备的轻量级解决方案。它实现了低延迟和小体积的设备端机器学习推理。`TensorFlow\
  \ Lite` 还通过 Android 神经网络 API 支持硬件加速。关于 `TensorFlow Lite` 的更多信息在此处：\n\n[`www.tensorflow.org/lite/`](https://www.tensorflow.org/lite/)\n\
  \n最近添加的是 `tensorflow.js`，它提供了 JavaScript API 在网页中访问 TensorFlow。`tensorflow.js` 工具包以前被称为\
  \ `deeplearning.js`。此外，`tensorflow.js` 可以配合 `NodeJS` 使用。关于 `tensorflow.js` 的更多信息在此处：\n\
  \n[`js.tensorflow.org/`](https://js.tensorflow.org/)\n\n\n\n\n\nTensorFlow 2 可能在\
  \ 2019 年中旬左右发布，届时 TensorFlow 1.x 将成为遗留代码（如引言中所）。最重要的变化之一是将“即时执行（eager execution）”作为默认模式，而不是“延迟执行（deferred\
  \ execution）”模式。\n\n## 为什么使用 TF 1.x 而不是 TF 2？\n\n有几个原因让我们留在 TF 1.x 而不切换到 TF 2。首先，在本书出版时，TF\
  \ 2 尚未发布。其次（可能更为重要），目前在线 TensorFlow 代码示例中使用即时执行的仅占极比非常小。幸运的是，Google 将提供将 TF 1.x\
  \ 代码转换为 TF 2 的工具，这将在许多情况下提供帮助，例如，当从 TF 1.x API 到 TF 2 API 可以进行直接转换时。当这些工具无法完成转换时，可能会有各种在线教程说明如何进行转换。\n\
  \n第三，存在大量使用 TF 1.x 的代码库，其中包括许多客户甚至 Google 自身。从 TF 1.x 到 TF 2 的转换过程将花费大量时间，因为一些（可能是大型）公司转型速度较慢。作为一个类比，考虑从\
  \ Python 2.x 到 Python 3.x 的迁移：尽管 Python 3.x 已经发布多年，但仍有许多地方在使用 Python 2.x（而且 Python\
  \ 2.x 已于 2020 年“寿命”）。\n\n存在一个可能的例外：如果你是 TensorFlow 的“新手”，且没有迫切需要学习 TensorFlow，那么等到\
  \ TF 2 的生产版本发布可能对你来说工作量少。\n\n## 什么是 TensorFlow 张量（Tensor）？\n\n简单来说，TF 张量是一个类似于 NumPy\
  \ ndarray 的多维数组。TF 张量由其维度定义，总结如下：\n\n| 标量 (scalar): | 零阶张量 |\n| --- | --- |\n| 向量\
  \ (vector): | 一阶张量 |\n| 矩阵 (matrix): | 二阶张量 |\n| 3 维数组: | 三阶张量 |\n\n正如你将在后续章节中看到的，TensorFlow\
  \ 支持各种数据类型和原始类型。除了常量和变量外，TensorFlow 还提供了一种名为“占位符（placeholder）”的数据类型，它充当持有临时数据的缓冲区。对于需要训练的事项使用\
  \ TF 变量，例如平面上最佳拟合线的斜率 `m` 和截距 `b`。\n\n## TensorFlow 数据类型\n\nTensorFlow 支持以下数据类型：\n\
  \n- `tf.float32`\n- `tf.float64`\n- `tf.int8`\n- `tf.int16`\n- `tf.int32`\n- `tf.int64`\n\
  - `tf.uint8`\n- `tf.string`\n- `tf.bool`\n\n上述列表中的数据类型自言易懂：两个浮点类型、四个整数类型、一个无符号整数类型、一个字符串类型和一个布尔类型。正如你所看到的，有\
  \ 32 位和 64 位浮点类型，以及从 8 位到 64 位的整数类型。\n\n## TensorFlow 原始类型\n\nTensorFlow 支持以下原始类型（数组将在后讨论）：\n\
  \n### TF 常量 (Constants)\n- TF 占位符 (Placeholders)\n- TF 变量 (Variables)\n\nTensorFlow\
  \ `constant` 是一个不可变的值，示例所示：\n```\naconst = tf.constant(3.0)\n```\n\nTensorFlow `placeholder`\
  \ 为数据分配空间，类似于其他语言中的“缓冲区”。TF 占位符非常棒用的一点是，它们不需要指定形状：它们会“自动地”假设分配给它们的形状。一个简单的 TensorFlow\
  \ 占位符示例：\n```\na = tf.placeholder(\"float\")\nb = tf.placeholder(\"float\")\nc =\
  \ tf.multiply(a,b)\n```\n如前面的代码所示，`c` 定义为 `a` 和 `b` 的乘积，它们还没有值。使用 `feed_dict` 为占位符赋值，示例所示：\n\
  ```\na = tf.placeholder(\"float\")\nb = tf.placeholder(\"float\")\nc = tf.multiply(a,b)\n\
  feed_dict = {a:2, b:3}\n```\n`c` 的计算将在后文 sessions 部分显示。\n\nTensorFlow `variable`\
  \ 是 TensorFlow 图中的一个“可训练的值”。例如，平面最佳拟合线的斜率 `m` 和截距 `b` 是两个可训练的值。一些 TF 变量的示例所示：\n\
  ```\nb = tf.Variable(3, name=\"b\")\nx = tf.Variable(2, name=\"x\")\nz = tf.Variable(5,\
  \ name=\"z\")\nlm = tf.Variable(W + b, name=\"lm\")\n```\n注意 `b`、`x` 和 `W` 被赋值为数值，而\
  \ `z` 和 `lm` 被定义为表达式。具体而言，变量 `z` 的值取决于 `x` 的值（等于 2），变量 `lm` 的值取决于 `W` 和 `b`。`z`\
  \ 和 `lm` 都在 TensorFlow “session”中求值，后所示。\n\n## TensorFlow 图 (Graphs)\n\n当你在 Python\
  \ 脚本中定义 TensorFlow 代码时，通常会使用某些数据类型和其他构造。在执行 TensorFlow 代码之前，TensorFlow 会根据你定义的常量、占位符和变量生成图结构。典型的\
  \ TensorFlow 图包含：\n\n- 图 (Graph): 操作图 (DAG)\n- 会话 (Sessions): 图\n- 延迟执行（默认）\n- 并行操作（默认）\n\
  - 节点 (Nodes): 算子/变量/常量\n- 边 (Edges): 张量\n\nTF 1.x 图被拆分为子图并并行执行（如果可用多个 CPU 或 GPU）。书中的章节包含了\
  \ Python 编写的 TensorFlow 代码示例，说明了如何执行算术运算、计算三角值以及如何使用即时执行。\n\n## TensorFlow 版本号\n\
