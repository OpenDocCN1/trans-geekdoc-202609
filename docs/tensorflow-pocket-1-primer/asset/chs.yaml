  \n## MSE 公式\n\n图 3.8 显示了 MSE 的公式。用通俗的话说，MSE 是实际 `y` 值与预测 `y` 值之间差的平方和，除以点的个数。注意，预测的\
  \ `y` 值是每个点如果在该点处将拥有的 `y` 值。\n\n对于线性回归，MSE 是常用的，但还有其他类型。\n\n## 误差类型\n\n虽然我们只讨论线性回归，但还有其他误差类型将在后续章节中讨论：\n\
  \n- `MSE`（均方误差）\n- `RMSE`（均方根误差）\n- `R²`决定系数\n- `MAE`（均绝对误差）\n\n`RMSE` 是 MSE 的平方根。用通俗的话说，MSE\
  \ 是实际 `y` 值与预测 `y` 值之间差的平方和，除以点的个数。\n\n `MAE` 是误差的绝对值的平均值。\n\n `R²` 决定系数表示模型对观测数据的解释程度。`R²`\
  \ 越接近 1，模型拟合效果越好。\n\n `RMSE` 是 MSE 的平方根。用通俗的话说，MSE 是实际 `y` 值与预测 `y` 值之间差的平方和，除以点的个数。\n\
  \n `MAE` 是误差的绝对值的平均值。\n\n `R²` 决定系数表示模型对观测数据的解释程度。\n\n\n\n因此，图 4.7 中的线条 MSE 比图 4.8\
  \ 中的线条要小，这可能让你感到惊讶（或者你猜对了吗？）\n\n在这两张图中，我们很容易快速地计算出 MSE，但通常情况下，这要困难得多。例如，如果我们在欧几里得平面上绘制\
  \ 10 个不紧密拟合直线的点，且单个项涉及非整数值，我们可能需要用到计算器。\n\n更好的解决方案是使用 NumPy 函数，例如下一节将讨论的 `np.linspace()`\
  \ API。\n\n## 使用 NP.LINSPACE() 对线性数据进行拟合\n\n列表 4.4 显示了 `tf-linspace1.py` 的内容，该文件说明了如何结合\
