- raw: 'Think about this problem from the perspective of a company like Facebook.
    At the time of writing this book, Facebook has over 2.96 billion active users.
    Let''s say you''re traveling in a different country and meet someone you want
    to add on Facebook. You go into the search bar and type out this person''s name.
    If we simplify how the Facebook app works, it has to search across these 2.96
    billion records and find the person you are looking for.


    The speed at which you find this person really matters. Imagine what kind of experience
    it would be if when you search for a friend, Facebook put up a spinning activity
    indicator and said, come back in a couple hours. I don''t think we''d use Facebook
    as much if that was the case. From the company''s perspective, working on making
    search as fast as possible using different strategies really matters.


    Now, I said that the two strategies Britney and John used were examples of search.
    More specifically, these are **search algorithms**. The strategy John took where
    he started at the beginning of the range and just counted one number after the
    other is a type of search called **linear search**. It is also called **sequential
    search**, which is a better description of how it works, or even, **simple search**,
    since it really is quite simple.


    But what makes his approach an algorithm as opposed to just looking for something?
    Remember we said that an algorithm is a set of steps or instructions to complete
    a task? Linear search is a search algorithm and we can visualize it like this.
    We start at the beginning of the list or the range of values. Then we compare
    the current value to the target. If the current value is the target value that
    we''re looking for, we''re done (step 1). If it''s not, we''ll move on sequentially
    to the next value in the list (step 2) and then repeat step 2. If we reach the
    end of the list, then the target value is not in the list.


    This definition has nothing to do with programming and in fact you can use it
    in the real world. For example, I could tell you to walk into a bookstore and
    find me a particular book, and one of the ways you could do it is using the linear
    search algorithm. You could start at the front of the bookstore and read the cover
    or the spine of every book to check that it matches the book that you''re looking
    for. If it doesn''t, you go to the next book and repeat until you find it or run
    out of books.


    What makes this an algorithm is the **specificity** of how it is defined. In contrast
    to just jumping into a problem and solving it as we go along, an algorithm follows
    a certain set of guidelines and we use the same steps to solve the problem each
    time we face it. An important first step to defining the algorithm is not the
    algorithm itself, but the problem we''re trying to solve.


    ![Image](images/image-4.jpeg)


    Figure 1.1.4: The number of steps of an Algorithm for solving a problem


    Our first guideline is that an algorithm must have a **clear problem statement**.
    It''s pretty hard to define an instruction set when you don''t have a clear idea
    of what problem you''re trying to solve. In defining the problem, we need to specify
    how the input is defined and what the output looks like when the algorithm has
    done its job. For linear search, the input can be generally described as a series
    of values and the output is a value matching the one we''re looking for.


    ![Image](images/image-5.jpeg)


    Figure 1.1.5: An example of a linear search Algorithm


    Right now, we''re trying to stay away from anything code related, so this problem
    statement definition is pretty generic. But once we get to code, we can actually
    tighten this up. Once we have a problem. An algorithm is a set of steps that solves
    this problem.


    Given that the next guideline is that **an algorithm definition must contain a
    specific set of instructions in a particular order**, we really need to be clear
    about the order in which these instructions are executed. So specific order is
    really important.


    ![Image](images/image-6.jpeg)


    Figure 1.1.6: An ordered list of steps required to complete a linear search Algorithm


    Taking our simple definition of linear search, if I switched up the order in Figure
    1.1.6 and said, move sequentially to the next value before specifying that first
    comparison step, if the first value were the target one, our algorithm wouldn''t
    find it because we moved to the second value before comparing. Now you might think,
    okay, that''s just an avoidable mistake and kind of common sense. The thing is
    computers don''t know any of that and just do exactly as we tell them, so specific
    order is really important.


    The third guideline is that **each step in our algorithm definition must not be
    a complex one** and needs to be explicitly clear. What I mean by that is that
    you shouldn''t be able to break down any of the steps into further or additional
    subtasks. Each step needs to be a distinct one. We can''t define linear search
    as search until you find this value because that can be interpreted in many ways
    and further broken down into many more steps. It''s not clear.


    ![Image](images/image-7.jpeg)


    Figure 1.1.7: Each step of an Algorithm needs to be a distinct one; subtasks are
    not allowed


    Next, **algorithms should produce a result**. This one might seem obvious. If
    it didn''t, how would we know whether the algorithm works or not. To be able to
    verify that our algorithm works correctly, we need a result. Now, when using a
    search algorithm, the end result can actually be nothing, which indicates that
    the value wasn''t found. But that''s perfectly fine. There are several ways to
    represent “nothing” in code, and as long as the algorithm can produce some result,
    we can understand its behavior.


    The last guideline is that the **algorithm should actually complete and cannot
    take an infinite amount of time**. If we let John loose in the world''s largest
    library and ask him to find a novel, we have no way of knowing whether he succeeded
    or not, unless he came back to us with a result.


    Now, here’s a quick recap. What makes an algorithm an algorithm and not just something
    you do?


    ![Image](images/image-8.jpeg)


    Figure 1.1.8: A recap of 5 Algorithm guidelines


    **1**. It needs to have a clearly defined problem statement, input, and output.
    When using linear search, the input needs to be just a series of values, but to
    actually use Britney''s strategy, there''s one additional precondition so to speak.
    If you think about her strategy, it required that the numbers be sorted in ascending
    order. This means that where the input for John is just a series of values to
    solve the problem, the input to Britney''s algorithm needs to be a sorted series
    of values. So, clearly defined problem statement, clearly defined input and clearly
    defined output.


    **2**. The steps in the algorithm need to be in a very specific order.


    **3**. The steps also need to be distinct. You should not be able to break it
    down into further sub-tasks.


    **4**. Next, the algorithm should produce a result, and finally,


    **5**. The algorithm should complete in a finite amount of time.


    These guidelines not only help us define what an algorithm is, but also helps
    us verify that the algorithm is correct. Executing the steps in an algorithm for
    a given input must result in **the same output every time**. If in the game I
    played above the answer was 50 every time, then every single time John must take
    50 turns to find out that the answer is 50. If somehow he takes 50 turns in one
    round, then 30 the next, we technically don''t have a correct algorithm. Consistent
    results for the same set of values is how we know that the algorithm is correct.'
