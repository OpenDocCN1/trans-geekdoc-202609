- raw: 'I should stress that we''re not going to be designing any algorithms on our
    own and we''ll start off and spend most of our time learning the tried-and-true
    algorithms that are known to efficiently solve problems. The reason for talking
    about what makes for a good algorithm though is that the same set of guidelines
    makes for good algorithmic thinking, which is one of the most important skills
    we want to cultivate. When we encounter a problem, before rushing in and thinking
    about solutions, what we want to do is work through the guidelines. First, we
    break down the problem into any possible number of smaller problems where each
    problem can be clearly defined in terms of an input and an output.


    ### 1.1.4. Practice Exercise 1


    **Q1**. If we cannot determine the output of a program, can we call it an algorithm
    even if it solves the problem at hand?


    A. No.


    B. Yes.


    **Q2**. For which of the following reasons do we learn about algorithms and data
    structures? Choose the correct answer below:


    A. To be aware of existing solutions to common problems


    B. To understand the efficiency of solutions to common problems


    C. To be able to evaluate and break down problems into distinct parts


    D. All of the above


    ### 1.1.5. Answers to Practice Exercise 1


    1\. A


    2\. D


    ### 1.1.6. Evaluating Linear Search


    Now that we know how to generally define an algorithm, let''s talk about what
    it means to have a good algorithm. An important thing to keep in mind is that
    there''s no one single way to measure whether an algorithm is the right solution
    because it is all about context. Earlier we touched on two concepts, **correctness**
    and **efficiency**. Let''s define correctness more clearly because before we can
    evaluate an algorithm on efficiency, we need to ensure it''s correctness. Before
    we define our algorithms, we start by defining our problem.


    In the definition of that problem, we have a clearly defined input, satisfying
    any preconditions and a clearly defined output. An algorithm is deemed correct
    if on every run of the algorithm against all possible values in the input data,
    we always get the output we expect. Part of correctness means that for any possible
    input, the algorithm should always terminate or end. If these two are not true,
    then our algorithm isn''t correct.


    If you were to pick up an Algorithms textbook and look up *correctness*, you will
    run into a bunch of mathematical theory. This is because traditionally algorithm
    correctness is proved by mathematical induction, which is a form of reasoning
    used in mathematics to verify that a statement is correct. This approach involves
    writing what is called a specification and a correctness proof. We won''t be going
    into that in this course. Proof through induction is an important part of designing
    algorithms, but we''re confident that you can understand algorithms both in terms
    of how and when to use them without getting into the math, so if you pick up a
    textbook and feel daunted, don''t worry. I do too. But we can still figure things
    out without it.


    So, once we have a correct algorithm, we can start to talk about **how efficient**
    an algorithm is. Remember that this efficiency ultimately matters because they
    help us solve problems faster and deliver a better end user experience in a variety
    of fields. For example, algorithms are used in the sequencing of DNA and more
    efficient sequencing algorithms allow us to research and understand diseases better
    and faster, but let''s not get ahead of ourselves. We''ll start simple by evaluating
    John''s linear search algorithm in terms of its efficiency.


    First, what do we mean by efficiency? There are **two measures of efficiency**
    when it comes to algorithms, time and space. Sounds really cool and very sci-fi,
    huh? Efficiency measured by time, something you''ll hear called **time complexity**,
    is a measure of how long it takes the algorithm to run. Time complexity can be
    understood generally outside the context of code and computers because how long
    it takes to complete a job is a universal measure of efficiency. The less time
    you take, the more efficient you are.


    The second measure of efficiency is called **space complexity**, and this is pretty
    computer specific. It deals with the amount of memory taken up on the computer.
    Good algorithms need to balance between these two measures to be useful. For example,
    you can have a blazingly fast algorithm, but it might not matter if the algorithm
    consumes more memory than you have available.


    Both of these concepts, time and space complexity, are measured using the same
    metric, but it is a very technical sounding metric, so let''s build up to its
    slowly and start simple. In section 1.1.2, I played a game with John and Britney
    where they tried to guess the number I was thinking of. Effectively, they were
    searching for a value. So, how do we figure out how efficient each algorithm is
    and which algorithm was more suited to our purposes?


    If we consider the number of tries they took to guess or search for the value
    as an indicator of the time they take to run through the exercise, this is a good
    indicator of how long the algorithm runs for a given set of values. This measurement
    is called the **running time** of an algorithm and we''ll use it to define time
    complexity in the game. We played it 4 rounds. Let''s recap those in Figure 1.1.9,
    focusing on John''s performance.


    ![Image](images/image-9.jpeg)


    Figure 1.1.9: Chart showing John’s performance in 4 rounds of a game played in
    section 1.1.2


    In round 1, we had 10 values, the target was 3 and John took 3 turns. In round
    2, we had 10 values. The target was 10 and John took 10 turns. In round 3, we
    had 100 values, the target was 5, John took 5 tries. Finally in round 4, when
    the target was 100, given 100 values, John took 100 tries. On paper, it''s hard
    to gauge anything about this performance. When it comes to anything with numbers
    though, I like to put it up on a graph and compare visually on the vertical or
    Y-axis.


    ![Image](images/image-10.jpeg)


    Figure 1.1.10: A graph to compare John’s number of tries (running time) against
    the number of values/target value


    Let''s measure the number of tries it took John to guess the answer, or the running
    time of the algorithm. On the horizontal or x-axis, what do we put for each turn?
    We have a number of **Values** as well as a **Target** value. We could plot the
    target value on the horizontal axis, but that leaves some context and meaning
    behind. It''s far more impressive that John took 5 tries when the range went up
    to a 100 than when he took 3 tries for a maximum of 10 values. We could plot the
    maximum range of values, but then we''re leaving out the other half of the picture.
    There are data points, however that satisfy both requirements.


    If we only plot the values where the target, the number John was looking for,
    was the same as the maximum range of values, we have a data point that includes
    both the size of the data set as well as his effort. There''s an additional benefit
    to this approach as well. There are three ways we can measure how well John does
    or in general, how well any algorithm does.


    First, we can check how well John does in the best case or good scenarios from
    the perspective of his strategy in the range of 100 values. The answer being a
    lone number like 3 at the start of the range is a good scenario. He can guess
    it fairly quickly. 1 is his best-case scenario. Alternatively, we could check
    how well he does on average. We could run this game a bunch of times and average
    out the running time. This would give us a much better picture of John''s performance
    over time, but our estimates would be too high if the value he was searching for
    was at the start of the range or far too low if it was at the end of the range.'
