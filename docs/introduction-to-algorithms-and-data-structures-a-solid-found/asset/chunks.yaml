    # 1. 算法导论


    无论你是高中生还是大学生、行业内的开发者或是正在学习编程的人，你都无疑遇到过“算法”这个词。对很多人来说，这个词听起来有点吓人。它代表了一部分似乎遥不可及的知识。似乎只有计算机科学学位的人才懂算法。


    而对其他人来说，这会产生“冒充者综合征”的感觉。你可能已经知道如何编写代码，但因为对算法一无所知，你并不是真正的开发者。这让某些开发者将某些工作归为高于自己的技能水平，因为面试中包含了算法题。无论，你的原因是什么，在本课程中，我们的目标是消除所有这些感觉，让你熟悉算法的基础知识。像任何其他学科一样，我喜欢在课程开始时介绍课程是什么、以及不是什么。


