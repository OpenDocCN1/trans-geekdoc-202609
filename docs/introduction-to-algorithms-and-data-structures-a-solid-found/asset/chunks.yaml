    即使你对 Python 一无所知，只要你理解编程的原理，你就应该能够很好地跟上。例如，如果你是一个 JavaScript 开发者或正在学习 JavaScript
    的学生，很有可能你仍然理解我们稍后写的代码。如果你需要任何跟进内容，我一定会在过程中提供链接。让我们从简单的东西开始。


    ## 1.1. 玩计数游戏


    让我们通过和两个同事玩一个简单的游戏来对算法进行温和的介绍！在接下来的几节中，我们将讨论算法思维、什么是算法，并查看两种流行的搜索算法。


    ### 1.1.1. 什么是算法？


    算法是完成任务的一组指令。这听起来可能有些简化，但它确实是如此。一份`食谱`是一个算法。你的`晨间例程`是一个算法。`驾驶指南`也是算法。


    如果你以前写过代码（例如 `print("Hello World")`），或者广义地说，人们所说的算法是指离开迷宫所需要的一组步骤。


