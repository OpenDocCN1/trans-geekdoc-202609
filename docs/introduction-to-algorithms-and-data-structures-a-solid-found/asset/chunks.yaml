  fmt: '

    For sake of completeness, let''s plot a combinatorial runtime on our graph so
    that we can compare. An algorithm such as one that solves the traveling salesman
    problem has a worst case runtime of `O(n!)`.


    ![Image](images/image-47.jpeg)


    Figure 1.2.31: Graph of a combinatorial runtime


    Studying exponential runtimes like this are useful for two reasons. First, in
    studying how to make such algorithms efficient, we develop strategies that are
    useful across the board and can potentially be used to make existing algorithms
    even more efficient. Second, it''s important to be aware of problems that take
    a long time to solve.


    Knowing right off the bat that a problem is somewhat unsolvable in a realistic
    time means you can focus your efforts on other aspects of the problem. As a beginner
    though, you''re going to steer clear of all this and focus your efforts on algorithms
    with polynomial runtimes since we''re much more likely to work with and learn
    about such algorithms.


    Now that we know some of the common complexities, in the next section, we’ll talk
    about how we determined the complexity of an algorithm because there are some
    nuances.


    ### 1.2.9. How to Determine the Complexity of an Algorithm


    Over the last few sections, we took a look at common complexities that we would
    encounter in studying algorithms. But the question remains, how do we determine
    what the worst-case complexity of an algorithm is? Earlier, I mentioned that even
    though we say that an algorithm has a particular upper bound or worst-case runtime,
    each step in a given algorithm can have different runtimes.


    Let''s bring up the steps for binary search. Again, assuming the list is sorted,
    the first step is to determine the middle position of the list. In general, this
    is going to be a `constant time operation`. Many programming languages hold on
    to information about the size of the list, so we don''t actually need to walk
    through the list to determine the size. Now if we didn''t have information about
    the size of the list, we would need to walk through counting each item one by
    one until we reach the end of the list, and this is a `linear time operation`.
    Realistically this is a `O(1)` or constant time.


    Step two is to compare the element in the middle position to the target element.
    We can assume that in most modern programming languages this is also a constant
    time operation because the documentation for the language tells us it is.


    Step three is our success case and the algorithm ends. This is our best case and
    so far, we have only incurred two constant time operations, so we would say that
    the `best-case runtime of binary search is constant time`, which is actually true.
    But remember that best case is not a useful metric, except for if we don''t match
    is splitting the list into sublists.


    Assuming the worst-case scenario, the algorithm would keep splitting into sublists
    until a single element list is reached with the value that we''re searching for.
    The runtime for this step is `logarithmic` since we discard half the values each
    time. So, in our algorithm, we have a couple steps that are constant time and
    one step that is logarithmic overall.


    When evaluating the runtime for an algorithm, we say that the algorithm has as
    its upper bound, the same runtime as the least efficient step in the algorithm.
    Think of this way. Let''s say you''re participating in a triathlon which is a
    race that has a swimming, running and a cycling component. You could be a phenomenal
    swimmer and a really good cyclist, but you''re a pretty terrible runner. No matter
    how fast you are at swimming or cycling, your overall race time is going to be
    impacted the most by your running race time because that''s the part that takes
    you the longest.


    If you take 1hour 30 minutes to finish the running component, 55 minutes to swim,
    and 38 minutes to bike, it won''t matter if you can fine tune your swimming technique
    down to finish in 48 minutes and your cycle time to 35 because you''re still bounded
    at the top by your running time, which is close to almost double your bike time.


    Similarly with the binary search algorithm, it doesn''t matter how fast we make
    the other steps, they''re already as fast as they can be in the worst-case scenario.
    The splitting of the list down to a single element list is what will impact the
    overall running time of your algorithm. This is why we say that the time complexity
    or runtime of the algorithm in the worst case is `O(log n)` or logarithmic. As
    I alluded to though, your algorithm may hit a best-case runtime and in between
    the two, best and worst case, have an average runtime as well. This is important
    to understand because algorithms don''t always hit their worst case. But this
    is getting a bit too complex for us.


    For now, we can safely ignore average case performances and focus only on the
    worst case in the future. If you decide to stick around, we''ll circle back and
    talk about this more. Now that you know about algorithms, complexities and Big
    O, take some practice exercise in the next section. Then you can take a break
    from all of that and write code in the section after.


    ### 1.2.10. Practice Exercise 3


    **Q1**. I started following a workout plan recently and one of the routines goes
