- raw: 'This concept is called **algorithmic thinking**, and it''s something we''re
    going to try and cultivate together as we work through this chapter. Lastly, learning
    about algorithms gives you a deeper understanding about complexity and efficiency
    in programming. Having a better sense of how your code will perform in different
    situations is something that you''ll always want to develop and hone.


    Algorithmic thinking is why algorithms also come up in big tech interviews. Interviewers
    don''t care as much that you are able to write a specific algorithm in code, but
    more about the fact that you can break a seemingly insurmountable problem into
    distinct components, and identify the right tools to solve each distinct component.
    That is what we plan on doing. In this course though, we''re going to focus on
    some of the tools and concepts you''ll need to be aware of before we can dive
    into the topic of algorithms. If you''re ready, let''s get started!


    ### 1.1.2. Guess the Number Game


    In this section, I’m going to do something unusual. I have two friends, Britney
    and John, who are going to play a game with me. This game is really simple, and
    you may have played it before. It goes something like this. I''m going to think
    of a number between 1 and 10, and they have to guess what the number is. Easy,
    right? When they guess a number, I''ll tell them if their guess is too high or
    too low. The winner is the one with the *fewest* tries. Between you and me, the
    answer is 3. All right, let’s start with John.


    Me: I''m thinking of a number between 1 and 10. What is it?


    John: Uh, quick question. Does the range include 1 and 10?


    That is a really good question. What John did right there was to establish the
    bounds of our problem. No solution works on every problem, and an important part
    of algorithmic thinking is to clearly define what the problem set is, and clarify
    what values count as inputs.


    Me: Yeah, 1 and 10 are both included.


    John: Is it 1?


    Me: Too low?


    John: Is it 2?


    Me: Too low?


    John: Is it 3?


    Me: Correct!


    Okay, that was an easy one. It took John **three tries** to get the answer. Let''s
    switch over to Britney and play another round using the same number as the answer.


    Me: Britney, I''m thinking of a number between 1 and 10 inclusive, so both 1 and
    10 are in the range. What number am I thinking of?


    Britney: Is it 5?


    Me: Too high.


    Britney: Two?


    Me: Too low?


    Britney: Is it 3?


    Me: Correct!


    What we had there was two very different ways of playing the same game. Somehow
    with even such a simple game, we saw different approaches to figuring out a solution.
    To go back to algorithmic thinking for a second, this means that with any given
    problem, there''s no one best solution. Instead, what we should try and figure
    out is what solution works better for the current problem. In this first pass
    at the game, they both took the same amount of turns to find the answer, so it''s
    not obvious who has the better approach, and that''s mostly because the game was
    easy. Let''s try this one more time. This time the answer is 10. Now, John first.


    John: Is it 1?


    Me: Too low.


    John: Is it 2?


    Me: Still too low.


    John: Is it 3?


    Me: Too low.


    John: Is it 4?


    Me: Too low.


    John: Is it 5?


    Me: Still too low.


    John: Is it 6?


    Me: Too low.


    John: Is it 7?


    Me: Too low.


    John: Is it 8?


    Me: Too low.


    John: Is it 9?


    Me: Too low.


    John: Is it 10?


    Me: Correct. You got it!


    Now let’s do the same thing, but with Britney this time,


    Britney: Is it 5?


    Me: Too low.


    Britney: 8?


    Me: Too low.


    Britney: Is it 9?


    Me: Still too low.


    Britney: It''s 10.


    Here, we start to see a difference between their strategies. When the answer was
    3, they both took the same number of turns. This is important. When the number
    was larger, but not that much larger, 10 in this case, we start to see that Britney''s
    strategy did better. She took **four** tries while John took **ten**. We''ve played
    two rounds so far, and we''ve seen a difference set of results based on the number
    they were looking for.


    If you look at John''s way of doing things, then the answer being 10 (the round
    we just played), is his worst-case scenario. He will take the maximum number of
    turns (ten) to guess it. When we picked a random number like 3, it was hard to
    differentiate which strategy was better because they both performed exactly the
    same. But in John''s worst case scenario, a clear winner in terms of strategy
    emerges. In terms of algorithmic thinking, we''re starting to get a sense that
    the specific value they''re searching for may not matter as much as where that
    value lies in the range that they have been given.


    Identifying this helps us understand our problem better. Let''s do this again
    for a range of numbers from 1 to 100. We''ll start by picking 5 as an answer to
    trick them. This time, we''re going to run through the exercise again, but this
    time from 1 to 100 and both 1 and 100 are included.


    At this point, without even having to run through the exercise, we can guess how
    many tries John is going to take. Since he starts at 1 and keeps going, he''s
    going to take **five tries**. For Britney''s turn, let’s run through the exercise.


    Britney: Is it 50?


    Me: Too high.


    Britney: Is it 25?


    Me: Still too high.


    Britney: Is it 13?


    Me: Too high.


    Britney: Is it 7?


    Me: Too high.


    Britney: Is it 4?


    Me: Too low.


    Britney: Is it 6?


    Me: Too high.


    Britney: Is it 5?


    Me: Correct!


    Let''s evaluate. John took five tries. Britney on the other hand took seven tries,
    so John wins this round. But again, in determining whose strategy is preferred,
    there''s no clear winner right now. What this tells us is that it''s not particularly
    useful to look at the easy answers where we arrive at the number fairly quickly
    because it''s at the start of the range. Instead, let''s try one where we know
    John is going to do poorly. Let''s look at his worst-case scenario where the answer
    is 100 and see how Britney performs in such a scenario.


    If I do this exercise one more time with John, 1 through 100 again, you can guess
    what happens. John takes 100 tries.


    Me: Now, Britney, you''re up.


    Britney: Is it 50?


    Me: Too low.


    Britney: Is it 75?


    Me: Too low.


    Britney: 88?


    Me: Too low,


    Britney: 94?


    Me: Too low.


    Britney: Is it 97?


    Me: Too low.


    Britney: 99?


    Me: Too Low.


    Britney: 100.


    Me: correct.


    That took Britney seven turns again and this time she is the clear winner. If
    you compare their individual performances for the same number set, you''ll see
    that Britney''s approach leaves John''s in the dust. When the answer was 5, so
    right around the start of the range, John took five turns, but when the answer
    was 100 right at the end of the range, he took 100 tries. It took him 20 times
    the amount of tries to get that answer compared to Britney.


    On the other hand, if you compare Britney''s efforts when the number was five,
    she took seven tries, but when the number was 100, she took the same amount of
    tries. This is pretty impressive. If we pretend that the number of tries is the
    number of seconds it takes Britney and John to run through their attempts, this
    is a good estimate for how fast their solutions are.


    Okay, we''ve done this a couple times and Britney and John are getting tired.
    Let''s take a break. In the next section, we''ll talk about the point of this
    exercise.


    ### 1.1.3. Algorithm Guidelines


    In the last section we ran through an exercise where I had some of my coworkers
    guess what number I was thinking. What was the point of that exercise? You might
    be thinking, hey, I thought I was here to learn about algorithms. The exercise
    we just did was an example of a real-life situation you''ll run into when building
    websites, apps and writing code. Both approaches taken by John and Britney to
    find the number I was thinking of are examples of searching for a value. It might
    be weird to think that there''s more than one way to search, but as you saw in
    the game, the speed at which the result was obtained differed between John and
    Britney.'
