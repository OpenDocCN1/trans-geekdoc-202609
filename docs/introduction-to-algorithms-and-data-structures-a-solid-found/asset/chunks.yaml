- raw: 'Remember our guidelines for defining an algorithm? Read them up again really
    quick in Figure 1.1.8. Let''s use those to define this algorithm.


    *   **Step 1**: We determine the middle position of the sorted list.


    *   **Step 2**: We compare the element in the middle position to the target element.


    *   **Step 3**: If the elements match, we return the middle position and end.
    If they don''t match then step 4.


    *   **Step 4**: We check whether the element in the middle position is smaller
    than the target element. If it is, then we go back to step 2 with a new list that
    goes from the middle position of the current list to the end of the current list.


    *   **Step 5**: If the element in the middle position is greater than the target
    element, then again we go back to step 2 with a new list that goes from the start
    of the current list to the middle position of the current list.


    We repeat this process until the target element is found, or until a sublist contains
    only one element. If that single element sublist does not match the target element,
    then we end the algorithm, indicating that the element does not exist in the list.


    That is the magic behind how Britney managed to solve the round much faster. In
    the next section, we’ll talk about the efficiency of binary search.


    ### 1.1.8. Practice Exercise 2


    **Q1.** Which of the following best defines the input for binary search? Choose
    the correct answer below:


    A. A sorted, sequential series of arbitrary data


    B. A sequential series of arbitrary data


    Q2. An algorithm is considered correct if, on every run of the algorithm, against
    all possible values in the input data we always get the output we expect. Choose
    the correct answer below.


    A. False


    B. True


    **Q3.** Choose the correct answer below. Time complexity can be described as


    A. The efficiency of an algorithm measured by the amount of time it takes in relation
    to the size of the data set.


    B. The efficiency of an algorithm measured by the amount of memory it consumes
    in relation to the size of the data set.


    ### 1.1.9. Answers to Practice Exercise 2


    1\. A


    2\. B


    3\. A


    ## 1.2. Time Complexity


    Over the last few lessons, we saw two of my colleagues play a game with different
    strategies and different end results. These strategies were examples of real-world
    algorithms but we still don''t have a good understanding of which one was better.
    In this section, we''re going to take a look at time complexity and measuring
    the efficiency of algorithms.


    ### 1.2.1. Efficiency of an Algorithm


    We have a vague understanding that Britney''s approach is better in most cases,
    but just like with linear search, it helps to visualize this. Much like we did
    with linear search, when determining the efficiency of an algorithm (remember,
    we''re still only looking at efficiency in terms of time - time complexity as
    it''s called), we always want to evaluate how the algorithm performs in the worst-case
    scenario.


    Now, you might be thinking, well, that doesn''t seem fair because given a series
    of data, if the target value we''re searching for is somewhere near the front
    of the list, then linear search may perform just as well, if not slightly better
    than binary search. That is totally true. Remember, a crucial part of learning
    algorithms is understanding what works better in a given context. When measuring
    efficiency though, we always use the worst-case scenarios as a benchmark because
    remember, it can never perform worse than the worst case. Let''s plot these values
    on the graph we started earlier.


    With the number of tries, or the runtime of the algorithm, on the Y-axis, and
    the maximum number of values in the series or n on the horizontal axis, to represent
    the worst-case scenario, we have two data points. When n equals 10, Britney took
    4 tries using binary search, and when n equals 100, it took 7 tries.


    ![Image](images/image-17.jpeg)


    Figure 1.2.1: Graph representing the number of tries and 10 to 100 values of n
    for a binary search


    But even side by side, these data points are sort of meaningless. Remember that
    while there is quite a difference between the runtime of linear search and binary
    search at an n value of a 100, for a computer that shouldn''t matter. What we
    should check out is how the algorithm performs at levels of n that might actually
    slow a computer down. As n grows larger and larger, how do these algorithms compare
    to one another? Let''s add that to the graph.


    Now a picture starts to emerge. As n gets really large, the performances of these
    two algorithms differ significantly. The difference is kind of staggering actually.
    Even with the simple game, we saw that binary search was better, but now we have
    a much more complete idea of how much better.


    For example, when n is 1000, the runtime of linear search measured by the number
    of operations or turns is also 1000.


    ![Image](images/image-18.jpeg)


    Figure 1.2.2: Graph highlighting the performance of linear search for 1000 tries
    and 10000 values of n


    For binary search, it takes just 10 operations. Now, let''s look at what happens
    when we increase n by factor of 10. See Figure 1.2.3.


    ![Image](images/image-19.jpeg)


    Figure 1.2.3: Graph highlighting the performance of binary search for 1000 tries
    and 10000 values of n


    At 10,000, linear search takes 10,000 operations while binary search takes 14
    operations.


    ![Image](images/image-20.jpeg)


    Figure 1.2.4: Graph comparing linear and binary searches for 10,000 tries and
    10,000 value of n


    As you can see in Figure 1.2.4, an increase by a factor of 10, and binary search
    only needs 4 more operations to find a value. If we increase it again by factor
    of 10, once more to an end value of 100,000, binary search takes only 17 operations,
    it is blazing fast! What we''ve done here is plotted on a graph how the algorithm
    performs as the input set it is working on increases. In other words, we''ve plotted
    the **growth rate** of the algorithm, also known as the **order of growth**.


    Different algorithms grow at different rates, and by evaluating their growth rates,
    we get a much better picture of their performance because we know how the algorithm
    will hold up as n grows larger. This is so important. In fact, it is the standard
    way of evaluating an algorithm and brings us to a concept called **Big O**.


    ### 1.2.2. The Big O


    You might have heard this word thrown about, and if you found it confusing, don''t
    worry. We''ve already built up a definition in the past few lessons. We just need
    to bring it all together. Let''s start with a common statement you''ll see in
    studies on algorithms.


    Big O is a theoretical definition of the complexity of an algorithm as a function
    of the size.


    Wow, what a mouthful! This sounds really intimidating, but it''s really not. Let''s
    break it down. Big O is a notation used to describe complexity. What I mean by
    notation is that it simplifies everything we''ve talked about down into a single
    variable. An example of complexity written in terms of Big O looks like this.


    ![Image](images/image-21.jpeg)


    Figure 1.2.5: The Big O: Order of magnitude of complexity of an algorithm


    As you can see, it starts with an uppercase letter O. That''s why we call it Big
    O. It''s literally a big O. The O comes from order of magnitude of complexity,
    so that''s where we get the big O from. Now, complexity here refers to the exercise
    we''ve been carrying out in measuring efficiency. If it takes Britney 4 tries
    when n is 10, how long does the algorithm take when n is 10 million? When we use
    big O for this, the variable used, which we''ll get to, distills that information
    down so that by reading the variable you get a big picture view without having
    to run through data points and graphs just like we did.'
