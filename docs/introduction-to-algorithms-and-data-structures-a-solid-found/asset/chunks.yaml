    How would you generally define the runtime of this algorithm as?


    1. Linear or `O(n)`

    2. Quasilinear or `O(log n)`

    3. Quadratic or `O(n²)`


    **Q4**. Every step in an algorithm has a cost or time complexity of its own. Choose
