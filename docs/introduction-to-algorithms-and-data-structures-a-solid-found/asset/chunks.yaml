    \ This is called a docstring and is a Python convention for documenting your code.\
    \ Here’s the updated code:\n\ndef linear\\_search(list, target):  \n\n *\"\"\"\
    \  \n\n Returns the index position of the target if found, else returns None \
    \ \n\n \"\"\"*\n\nTo save your code, go to the main menu at the top of Pycharm\
    \ window and follow this path:\n\n*File > Save All* or use the keyboard shortcut\
    \ *Ctrl + S*.\n\nThe linear search algorithm is a sequential algorithm that compares\
