- raw: 'Logarithmic or subline runtimes are preferred to linear because they''re more
    efficient. But in practice, linear search has its own set of advantages, which
    we''ll take a look at in the next section.


    Let''s look at the situation we encountered with the linear search algorithm.
    We saw that in the worst-case scenario, whatever the value of n was, John took
    exactly that many tries to find the answer. As in linear search, when the number
    of operations to determine the result in the worst-case scenario is at most the
    same as n, we say that the algorithm runs in linear time. We represent this as
    O(n). You can read that as Big O of n, or you can say linear time, which is more
    common. When we put that up on a graph against constant time and logarithmic time,
    we get a line that looks like Figure 1.2.11.


    ![Image](images/image-27.jpeg)


    Figure 1.2.11: Graph of Linear (yellow), Sublinear/Logarithmic (orange) and Constant
    runtimes


    Any algorithm that sequentially reads the input will have linear time. So, remember,
    anytime you know a problem involves reading every item in a list, that means a
    linear runtime. As you saw from the game we played, Britney''s strategy using
    binary search was clearly better, and we can see that on the graph. So, if we
    had the option, why would we use linear search which runs in linear time?


    Remember that binary search had a precondition, **the input set had to be sorted**.
    While we won''t be looking at sorting algorithms in this course, as you learn
    more about algorithms, you''ll find that sorting algorithms have varying complexities
    themselves, just like search does. So, we have to do additional work prior to
    using binary search. For this reason, in practice, linear search ends up being
    more performant up to a certain value of n because the combination of sorting
    first and then searching using binary search adds up.


    ### 1.2.4. Linear & Quadratic Time


    The next common complexity you''ll hear about is when an algorithm runs in quadratic
    time. If the word quadratic sounds familiar to you, it''s because you might have
    heard about it in math class. Quadratic is a word that means an operation raised
    to the second power (such as x²), or when something is squared.


    Let''s say you and your friends are playing a tower defense game and to start
    it off, you''re going to draw a map of the terrain. This map is going to be a
    grid and you pick a random number to determine how large this grid is. Let''s
    set n, the size of the grid to 4.


    ![Image](images/image-28.jpeg)


    Figure 1.2.12: Map of a terrain with 4 grids in a tower defense game


    Next, you need to come up with a list of coordinates so you can place towers,
    enemies and other stuff on this map. So how would we do this? If we start at the
    bottom and move horizontally, we''d have coordinate points that go (1, 1), (1,
    2), (1, 3) and (1, 4). Then you go up one level vertically and we have points
    (2, 1), (2, 2), (2, 3) and (2, 4). Go up one more and you have the points (3,
    1), (3, 2), (3, 3) and (3, 4). On the last (top) row you have the points (4, 1),
    (4, 2), (4, 3) and (4, 4). Notice that we have a pattern as you can see in Figure
    1.2.13.


    ![Image](images/image-29.jpeg)


    Figure 1.2.13: Map of the terrain with 4 grids and coordinates


    For each row we take the value and then create a point by adding to that every
    column value. The range of values go from one to the value of n. We can generally
    think of it this way: for the range of values from one to n, for each value in
    that range, we create a point by combining that value with the range of values
    from one to n.


    Again, doing it this way for each value in the range of one to n, we create an
    n number of values and we end up with 16 points, which is also n times n or n².
    This is an algorithm with a **quadratic runtime** because for any given value
    of n, we carry out n² number of operations.


    Now I pick a relatively easy, so to speak, example here because in English at
    least we often denote map sizes by height times width (h x w), so we would call
    this a 4 by 4 grid, which is just another way of saying 4² or n². See Figure 1.2.14.


