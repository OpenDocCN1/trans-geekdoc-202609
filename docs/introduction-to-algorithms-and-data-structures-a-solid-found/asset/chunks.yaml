    About The Author


    My name is Bolakale Aremu. My educational background is in software development.
    I have a few colleagues who are software developers and system engineers. I spent
    over 17 years as a software developer, and I’ve done a bunch of other things too.
    I''ve been involved in SDLC/process, data science, operating system security and
    architecture, and many more. My most recent project is serverless computing where
    I simplify the building and running of distributed systems. I always use a practical
    approach in my projects and courses.


    Bolakale Aremu


    CEO, Ojula Technology Innovations


    Web developer and Software Engineer


    [Ojulaweb.com](https://ojulaweb.com/)


    # 0\. What You Will Learn & How to Get Help


    The design of an efficient algorithm for the solution of the problem calls for
    the inclusion of appropriate data structures. In the field of computer science,
    data structures are used to store and organize data in a way that is easy to understand
    and use. They are used to organize and represent data in a way that will make
    it easier for computers to retrieve and analyze it. These are the fundamental
    building blocks that any programmer must know how to use correctly in order to
    build their own programs.


    ## **0.1. Benefits of learning about** **algorithms and data structures**


    First, they will help you become a better programmer. Another benefit is that
    they will make you think more logically. Furthermore, they can help you design
    better systems for storing and processing data. They also serve as a tool for
    optimization and problem-solving.


    As a result, the concepts of algorithms and data structures are very valuable
    in any field. For example, you can use them when building a web app or writing
    software for other devices. You can apply them to machine learning and data analytics,
    which are two hot areas right now. If you are a hacker, algorithms and data structures
    in Python are also important for you everywhere.


    Now, whatever your preferred learning style, I''ve got you covered. If you''re
    a visual learner, you''ll love my clear diagrams and illustrations throughout
    this book. If you''re a practical learner, you''ll love my hands-on lessons so
    that you can get practical with algorithms and data structures and learn in a
    hands-on way.


    ## 0.2. Course Structure


    There are three volumes in this course. This is volume one. In this volume, you''ll
    take a deep dive into the world of algorithms. With increasing frequency, algorithms
    are starting to shape our lives in many ways - from the products recommended to
    us, to the friends we interact with on social media, to even important social
    issues like policing, privacy and healthcare. So, the first part of this course
    covers what **algorithms** are, how they work, and where they can be found (real
    life applications).


    In the second volume, you''ll work through an introduction to data structures.
    You''re going to learn about two introductory data structures - **arrays** and
    **linked lists**. You''ll look at common operations and how the runtimes of these
    operations affect our everyday code.'
