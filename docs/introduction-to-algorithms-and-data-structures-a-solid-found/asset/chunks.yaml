    归排序（Merge Sort）的第一部分是将这些列表切割成数量减半的子列表。这类似于二分查找，其中每次比较操作都会将范围缩小一半。你知道二分查找的最坏情况运行时间是
    `log n`。因此，分割操作的运行时间相同，均为 `O(log n)` 或对数级。但将列表平分并不是归排序需要做的唯一事情。我们还需要执行`比较操作`以便对这些值进行排序。如果你观察该算法的每一步，我们执行了
    `n` 次比较操作，这使得该算法的最坏情况运行时间达到了 `O(nlog n)`，也称为准线性。


    ### 1.2.7. 多项式运行时间


    如果你没有理解归排序是如何工作的，不要担心。这并不是本次演示的目的。我们稍后会介绍归排序。到目前为止我们看到的运行时间都被称为`多项式运行时间`。


    如果对于给定的 `n` 值，一个算法的最坏情况运行时间为 `O(n^k)` 的形式，其中 `k` 只是某个值，那么该算法被认为具有多项式运行时间。因此，它可以是
    `n²`（其中 `k = 2` 为二次运行时间），以及 `n³`（其中 `k = 3` 为三次运行时间），以此此类推。所有这些形式都是 `n` 的某个幂次方。任何受此限制的内容，即任何落入图
    1.2.24 图表下方的内容，都被认为具有多项式运行时间。具有上界或大 O 值为多项式的运行时间的算法被认为是高效算法，并可能在实践中使用。


    ![Image](img/image-40.jpeg)


    图 1.2.24：多项式运行时间图


    ### 1.2.8. 指数级运行时间


    现在，我们将看到的下一类运行时间是我们认为不高效的运行时间。这些被称为`指数运行时间`。对于这些运行时间，随着 `n` 的轻微增加，操作数量会呈指数级增长。正如我们马上看到的，这些算法的成本太高，无法使用。指数运行时间是指大
    O 值为某个数字 `x` 的 `n` 次方的算法，即 `O(x^n)`。


    ![Image](img/image-41.jpeg)


    图 1.2.25：指数运行时间图


    假设你想打开一个装有密码挂锁的储物柜。假设你忘记了密码。这个锁需要一个两位密码，密码数字范围从 `0` 到 `9`。你首先将拨盘设为 `00`。在第一个拨盘保持为
    `0` 的情况下，你将第二个拨盘更改为 `1` 并尝试打开它。如果不起作用，你将其设置为 `2`，然后再次尝试。你会一直这样做，如果第二个拨盘设为 `9`
    时你仍然没有成功，那么你就回到第一个拨盘，将其设置为 `1` 并重新开始设置第二个拨盘。你必须经过的值范围是 `00` 到 `99`，共 100 个值。


    ![Image](img/image-42.jpeg)


    图 1.2.26：带有两个位数的数字储物柜


    这可以泛化为 `10²`，因为每个拨盘上有 10 个值，且有两个拨盘。逐个搜索每个值直到碰巧找到正确的那个，这种策略被称为`暴力破解`（brute force），而`暴力破解算法具有指数级运行时间`。这里有两个拨盘，所以
    `n = 2`，每个拨盘有 10 个值。因此，我们再次可以将该算法泛化为 `10^n`，其中 `n` 代表拨盘的数量。该算法之所以如此低效，是因为锁上只要多增加一个拨盘，操作数量就会显著增加。如果有三个拨盘，在最坏情况下（即正确密码是范围内的最后一个数字），组合数量为
    `10³` 或 1000 个值。如果再增加一个轮盘，它就变成了 `10⁴` 或 10,000 个值。随着 `n` 的增加，操作数量呈指数级增长，直到达到在现实时间范围内无法解决的程度。


    ![Image](img/image-43.jpeg)


    图 1.2.27：带有三个位数的数字储物柜


    现在你可能会想，好吧，任何计算机都可以破解四位数字锁，事实如此，因为这里的 `n` 足够小。但这就是`我们用于密码的相同原理`。在一个实现良好的典型密码字段中，允许用户使用最多
    26 个英语字母、`0` 到 `9` 的数字以及一组大约 33 个的特殊字符。因此，`26 + 10 + 33 = 69` 个字符。如图 1.2.28 所示。


    ![Image](img/image-44.jpeg)


    图 1.2.28：可以接受最多 69^n 个字符的网站密码字段


    所以，通常这意味着密码中的每个字符可以是 69 个值中的其中一个。这意味着对于一个单字符密码，需要 69 的 `n` 次方（`69^n`）操作。所以对于 `n
    = 1`，我们有 69 次操作。在最坏情况下，为了算出密码，只需将 `n` 增加到 2，猜测密码所需的操作数就会增加到 `69²` 或 4,761 次。


    现在通常在安全网站上并没有真正的限制，但一般来说，密码长度限制在 20 个字符左右。由于每个字符可能有 69 种值，且有 20 个字符，在最坏情况下猜测密码需要的操作数是
    69 的 20 次方（`69²⁰`），或大约 `6 x 10³⁶` 次操作。一个具有 5 核的 Intel CPU 每秒可以执行大约 65,000 亿条指令。这是一个奇特的数字。要在这个非常简单的模型中破解我们的
    20 位密码码，这台 Intel CPU 需要 `2 x 10²⁰` 年来暴力破解密码。


    所以，虽然这个算法最终会产生结果，但由于它是如此低效，以至于毫无意义。这就是人们建议你设置更长密码的原因之一，因为暴力破解在最坏情况下是指数级的，你每添加一个字符都会按指数级增加组合数量。


    下一类指数算法通过一个著名的问题`旅行商问题`（traveling salesman）得到了很好的说明。该问题陈述如下：给定一组城市以及它们之间的距离，访问每个城市并返回起点的最路径是什么？这看起来是一个简单的问题，但让我们从简单的情况开始，三个城市
    A、B 和 C。为了找出最短路径，我们需要考虑所有的路线。对于三个城市，我们有 6 条路线。


    ![Image](img/image-45.jpeg)


    图 1.2.29：带有城市 A、B、C 的地图


    在理论上，这些路线中的是可以舍弃的。例如，`A - B - C` 等于 `C - B - A`，但方向相反。所以我们可以舍弃后三条路线，包括 `C - A
    - B` 和 `B - C - A`。但当我们这样做时，通过 B 从 A 到 C 的路线可能不同于通过 B 从 C 到 A，所以保留 6 条路线并从那里确定最短路径。


    现在如果我们增加到 4 个城市，组合增加到 24。


    ![Image](img/image-46.jpeg)


    图 1.2.30：计算 A、B、C、D 每个城市的最短路径


    这种数学关系被称为`阶乘`（factorial），写为 `n` 后加感叹号（`n!`）。阶乘基本上通过以下方式获得：


    ```

    n! = n(n-1)(n-2)(n-3)…(2)(1)

    ```


    即 `n` 乘以 `n-1` 乘以 `n-2`，以此此类推，直到达到数字 1。例如，3 的阶乘是


    ```

    3! = 3 x 2 x 1 = 6

    ```


    这是我们 3 个城市的组合数量。4 的阶乘是


    ```

    4! = 4 x 3 x 2 x 1 = 24

    ```


    这是我们在 4 个城市得到的组合数量。在解决旅行商问题时，最高效的算法将具有`阶乘运行时间`，或者它所被称为`组合``运行时间`。在 `n` 值较小时，可以使用具有阶乘运行时间的算法。但如果
    `n` 值例如是 200（即 `200!`），解决该问题所需的时间将比人类存在的时间还要长！

