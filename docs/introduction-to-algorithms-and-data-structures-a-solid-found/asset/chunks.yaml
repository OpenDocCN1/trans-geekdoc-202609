- raw: "It's important to remember that complexity is relative. When we evaluate the\
    \ complexity of the binary search algorithm, we're doing it relative to other\
    \ search algorithms, not all algorithms. Big O is a useful notation for understanding\
    \ both time and space complexity, but only when comparing amongst algorithms that\
    \ solve the same problem. The last bit (n) in that definition of Big O is a **function\
    \ of the size**, and all this means is that big O measures complexity as the input\
    \ size grows because it's not important to understand how an algorithm performs\
    \ in a single data set, but in all possible data sets.\n\nYou'll also see big\
    \ O referred to as the **Upper Bounds** of the algorithm. What that means is that\
    \ big O measures how the algorithm performs in the worst-case scenario. That's\
    \ all Big O is. Nothing special! It's just a notation that condenses the data\
    \ points and graphs that we've built up down to one variable.\n\nWhat do these\
    \ variables look like? For John's strategy, linear search, we say that it has\
    \ a time complexity of **O(n)**, that is, Big O and then an “n” inside parenthesis.\
    \ For Britney's strategy binary search, we say that it has a time complexity of\
    \ **O(log n)**, that is, Big O log n. That's Big O with something called a “log”\
    \ and an “n” inside parentheses. Now, don't worry if you don't understand that.\
    \ We'll go into that in more detail later on in the course.\n\nEach of these has\
    \ a special meaning, but it helps to work through all of them to get a big picture\
    \ view. So, over the next few lessons, we’ll examine what are called common complexities\
    \ or common values of Big O that you'll run into and should internalize.\n\n###\
    \ 1.2.3. Constant and Logarithmic Time\n\nIn our discussions of complexity, we\
    \ made one assumption that the algorithm as a whole had a single measure of complexity,\
    \ That isn't true, and we'll get at how we arrive at these measures for the entire\
    \ algorithm at the end of this exercise. But each step in the algorithm has its\
    \ own space and time complexity. In linear search, for example, there are multiple\
    \ steps and the algorithm goes like this:\n\n*   Start at the beginning of the\
    \ list or range of values.\n\n*   Compare the current value to the target.\n\n\
    *   If the current value is the target value that we're looking for, we're done.\n\
    \n*   If it's not, we'll move on sequentially to the next value in the list and\
    \ repeat step two.\n\n*   If we reach the end of the list, then the target value\
    \ is not in the list.\n\nLet's go back to step two for a second. Comparing the\
    \ current value to the target, does the size of the dataset matter for this step?\
    \ When we're at step two, we're already at that position in the list and all we're\
    \ doing is reading the value to make a comparison. Reading the value is a single\
    \ operation, and if we were to plot it on a graph of runtime per operations against\
    \ n, it looks like Figure 1.2.6. A straight line that takes constant time regardless\
    \ of the size of n.\n\n![Image](images/image-22.jpeg)\n\nFigure 1.2.6: The graph\
    \ of runtime per operations against n\n\nSince this takes the same amount of time\
    \ in any given case, we say that the runtime is constant time. It doesn't change\
    \ in Big O notation, so we represent this as big O with a one inside parenthesis.\
    \ Now, when I first started learning all this, I was really confused as to how\
    \ to read this. Even if it was in my own head, should I say Big O of 1? When you\
    \ see this written, you are going to read this as constant time, so reading a\
    \ value in a list is a **constant time operation**. This is the most ideal case\
    \ when it comes to runtimes because input size does not matter. Also, we know\
    \ that regardless of the size of n, the algorithm runtime will remain the same.\n\
    \nThe next step up in complexity, so to speak, is the situation we encountered\
    \ with the binary search algorithm. Traditionally, explaining the time complexity\
    \ of binary search involves math, and I'm going to try to do it both with and\
    \ without. When we played the game using **binary search**, we noticed that with\
    \ every turn we were able to discard half of the data. But there's another pattern\
    \ that emerges that we didn't explore. Let's say n equals 10. How long does it\
    \ take to find an item at the 10th position of the list? We can write this out\
    \ as shown in Figure 1.2.7. So, we go from 10 to 5 to 8 to 9 and then down to\
    \ 10. Here it takes us **4** tries to cut down the list to just one element and\
    \ find the value we're looking for.\n\n![Image](images/image-23.jpeg)\n\nFigure\
    \ 1.2.7: Finding how long does it take to find an item at the 10th position of\
    \ the list in binary search\n\nLet's double the value of n to 20 and see how long\
    \ it takes for us to find an item at the 20th position.\n\n![Image](images/image-24.jpeg)\n\
    \nFigure 1.2.8: Finding how long does it take to find an item at the 20th position\
    \ of the list in binary search\n\nSo, we started 20 and then we picked 10. From\
    \ there we go to 15, 17, 19, and finally 20. So here, it takes us **5** tries.\
    \ Now, let's double it again so that n is 40 and we try to find the item in the\
    \ 40th position. Try it. When we start at 40, the first midpoint we're going to\
    \ pick is 20. From there we go to 30, then 35, 37, 39, and then 40. It takes **6**\
    \ tries.\n\nNotice that every time we double the value of n, the number of operations\
    \ it takes to reduce the list down to a single element only increases by **1**.\
    \ There's a mathematical relationship to this pattern and it's called a **logarithm\
    \ of n**. You don't really have to know what algorithms truly are, but if you\
    \ like underlying explainers, I'll give you a quick one. If you've taken algebra\
    \ classes, you may have learned about exponent. Here's a quick refresher.\n\n\
    2 x 1= 2. Now, this can be written as 2¹ ^() = 2 (two raised to the first power)\
    \ because it is our base case.\n\nNow, 2 x 2 = 4. This can be written as 2² =\
    \ 4 (two raised to the second power) because we're multiplying 2 twice. First,\
    \ we multiplied 2 times 1. Then we multiply the result of that by 2.\n\nNow, 2\
    \ x 2 x 2 = 8, and we can write this as 2³ = 8 (two raised to the third power)\
    \ because we're multiplying 2 three times. In 2² and 2³, the ² and ³ there are\
    \ called exponents, and they define how the number grows.\n\nWith 2³, we start\
    \ with the base value (2) and multiply itself three times. The **inverse** of\
    \ an exponent is called a logarithm. So, if I say log[2] 8 = 3, I'm basically\
    \ saying the opposite of an exponent. Instead of saying how many times do I have\
    \ to multiply this value, I'm asking how many times do I have to divide 8 by 2\
    \ to get the value 1. This is 3 operations.\n\nWhat about the result of log to\
    \ the base 2 of 16? That evaluates to four. That is, log[2] 16 \\= 4. \n\nWhy\
    \ does any of this matter? Notice that this is sort of how binary search works.\
    \ Log to the base 2 of 16 is 4. If n was 16, how many tries does it take to get\
    \ to that last element? Well, that is **5** tries, or (log[2] 16 + 1).\n\nIn general,\
    \ for a given value of n, the number of tries it takes to find the worst-case\
    \ scenario is log[2] n + 1. Because this pattern is overall a logarithmic pattern,\
    \ we say that the runtime of such algorithms is logarithmic. If we plot these\
    \ data points on our graph, a logarithmic runtime looks like Figure 1.2.9.\n\n\
    ![Image](images/image-25.jpeg)\n\nFigure 1.2.9: Graph of a logarithmic runtime\n\
    \nIn big O notation, we represent a logarithmic runtime as **O(log n)**, which\
    \ is written as big O with log n inside parenthesis, or even sometimes as **O(ln\
    \ n)**. When you see this, read it as **logarithmic time**. As you can see on\
    \ the graph, as n grows really large, the number of operations grows very slowly\
    \ and eventually flattens out. Since this line is below the line for a linear\
    \ runtime, which you can see in Figure 1.2.10, you might often hear algorithms\
    \ with logarithmic runtimes being called **sublinear**.\n\n![Image](images/image-26.jpeg)\n\
    \nFigure 1.2.10: Linear (yellow) and Sublinear/Logarithmic (orange) runtimes"
