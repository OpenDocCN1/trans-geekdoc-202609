- raw: 'The first part of Merge Sort cuts those lists into sublists with half the
    numbers. This is similar to binary search where each comparison operation cuts
    down the range to half the values. You know the worst-case runtime in binary search
    is log n. So, the splitting operations have the same runtime, O(log n) or logarithmic.
    But splitting into half is not the only thing we need to do with Merge Sort. We
    also need to carry out **comparison operations** so we can sort those values.
    If you look at each step of this algorithm, we carry out an n number of comparison
    operations, and that brings the worst-case runtime of this algorithm to O(nlog
    n), also known as quasilinear.


    ### 1.2.7. Polynomial Runtimes


    Don''t worry if you didn''t understand how Merge Sort works. That wasn''t the
    point of the demonstration. We will be covering Merge Sort later. The runtimes
    we''ve looked at so far are all called **polynomial runtimes**.


    An algorithm is considered to have a polynomial runtime if for a given value of
    n, its worst-case runtime is in the form of **O(n^k)**, where k just means some
    value. So, it could be n² where k = 2 for a quadratic runtime, and n³ where k
    = 3 for a cubic runtime, and so on. All of those are in the form of n raised to
    some power. Anything that is bounded by this, that is, anything that falls under
    the graph in Figure 1.2.24 is considered to have a polynomial runtime. Algorithms
    with an upper bound or a runtime with a big O value that is polynomial are considered
    efficient algorithms, and are likely to be used in practice.


    ![Image](images/image-40.jpeg)


    Figure 1.2.24: Graph of a polynomial runtimes


    ### 1.2.8. Exponential Runtimes


    Now, the next class of runtimes that we''re going to look at are runtimes that
    we don''t consider efficient. These are called **exponential runtimes**. With
    these runtimes, as n increases slightly, the number of operations increases exponentially.
    As we''ll see in a second, these algorithms are far too expensive to be used.
    An exponential runtime is an algorithm with a big O value of some number x raised
    to the nth power, O(x^n).


    ![Image](images/image-41.jpeg)


    Figure 1.2.25: Graph of a exponential runtimes


    Imagine that you wanted to break into a locker that had a padlock on it. Let''s
    assume you forgot your code. This lock takes a two-digit code and the digit for
    the code ranges from **0** to **9**. You start by setting the dials to **00**.
    With the first dial remaining on 0, you change the second dial to 1 and try and
    open it. If it doesn''t work, you set it to 2, then try again. You would keep
    doing this and if you still haven''t succeeded with the second dial set to 9,
    then you go back to that first dial, set it to 1 and start the second dial over.
    The range of values you''d have to go through is **00** to **99**, which is 100
    values.


    ![Image](images/image-42.jpeg)


    Figure 1.2.26: A digital locker with two digits


    This can be generalized as 10², since there are 10 values on each dial raised
    to two dials. Searching through each individual value until you stumble on the
    right one is a strategy called **brute force**, and **brute force algorithms have
    exponential runtimes**. Here, there are two dials, so n = 2, and each dial has
    10 values. So again, we can generalize this algorithm as 10^n where n represents
    the number of dials. The reason that this algorithm is so inefficient is because
    with just one more dial on the lock, the number of operations increases significantly.
    With three dials, the number of combinations in the worst-case scenario where
    the correct code is the last digit in the range, is 10³ or 1000 values. With an
    additional wheel it becomes 10⁴ or 10,000 values. As n increases, the number of
    operations increases exponentially to a point where it''s unsolvable in a realistic
    amount of time.


    ![Image](images/image-43.jpeg)


