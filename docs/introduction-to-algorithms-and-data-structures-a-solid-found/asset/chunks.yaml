    ### 1.1.1. What is an Algorithm?


    An algorithm is a set of steps or instructions for completing a task. This might
    sound like an oversimplification, but really that''s precisely what an algorithm
    is. A **recipe** is an algorithm. Your **morning routine** when you wake up is
    an algorithm and the **driving directions** you follow to get to a destination
    is also an algorithm In computer science, the term algorithm more specifically
    means the set of steps a program takes to finish a task.


    If you''ve written code before (such as print (“Hello World”) or any code really),
    generally speaking, you have written an algorithm. Given that much of the code
    we write can be considered an algorithm, what do people mean when they say you
    should know about algorithms? Now consider this.


    Let''s say I''m a teacher in a classroom and I tell everyone I have an assignment
    for them. On their desks, they have a picture of a maze and their task is to come
    up with the way to find the quickest way out of the maze. Everyone does their
    thing and comes up with a solution.


    ![Image](images/image-1.jpeg)


    Figure 1.1.1: Students solved a maze problem in a classroom


    Every single one of these solutions is a viable solution and is a valid example
    of an algorithm: the steps one needs to take to get out of the maze.


    ![Image](images/image-2.jpeg)


    Figure 1.1.2: Three solutions to the maze problem were drawn on the board by the
    teacher


    But from being in classrooms or any group of any sort, you know that some people
    will have better ideas than others. We all have a diverse array of skillsets.
    Over time, our class picks the best of these solutions, and anytime we want to
    solve a maze, we go with one of these solutions. This is what the field of algorithms
    is about. There are many problems in computer science, but some of them are pretty
    common. Regardless of what project you''re working on, different people have come
    up with different solutions to these common problems, and over time, the field
    of computer science has identified several that do the job well for a given task.


    When we talk of algorithms, we''re referring to two points. We''re primarily saying
    there''s an established body of knowledge on how to solve particular problems
    well, and it''s important to know what these solutions are. Now, why is it important?
    If you''re unaware that a solution exists, you might try to come up with one yourself
    and there''s a likelihood that your solution won''t be as good or efficient, whatever
    that means, compared to those that have been thoroughly reviewed. But there''s
    a second component to it as well.


    Part of understanding algorithms is not just knowing that an algorithm exists,
    but understanding when to apply it. Understanding when to apply an algorithm requires
    properly understanding the problem at hand, and this arguably is the most important
    part of learning about algorithms and data structures. As you progress through
    this chapter, you should be able to look at a problem and break it down into distinct
    steps. When you have a set of steps, you should then be able to identify which
    algorithm or data structure is best for the task at hand.


    ![Image](images/image-3.jpeg)


    Figure 1.1.3: Algorithmic thinking: Algorithm 2 was found to be the best for solving
    the problem'
