    **Q2**. My son throws toys all over the floor and I clean them up by picking up
    one at a time. How would you generalize the runtime of my "cleaning" algorithm?
    Choose the correct answer below.


    1. `O(n²)` or quadratic time

    2. `O(n)` or linear time

    3. `O(1)` or constant time


    **Q3**. You have a box of Lego bricks of various colors that you want to organize
