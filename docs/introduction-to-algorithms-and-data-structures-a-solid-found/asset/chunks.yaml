    Let''s imagine a scenario where Facebook naively implements linear search when
    finding friends. They looked at the latest US census, saw that 50% of names start
    with the letters A through J, which is the first 40% of the alphabet, and thought,
    okay, on average linear search serves us well, but what about the rest of those
    whose names start with the letter after J in the alphabet? Searching for a name
    like Peter would take longer than the average and much longer for someone whose
    name starts with a letter Z.


    ![Image](images/image-11.jpeg)

    Figure 1.1.11: An example of implementation of linear search on Facebook


    So, while measuring the runtime of an algorithm, on average, might seem like a
    good strategy, it won''t necessarily provide an accurate picture. By picking the
    maximum in the range, we''re measuring how our algorithm does in the worst-case
    scenario. Analyzing the worst-case scenario is quite useful because it indicates
    that the algorithm will never perform worse than we expect. There''s no room for
    surprises.


    ![Image](images/image-12.jpeg)

    Figure 1.1.12: The worst-case scenario of our algorithm


    Back to our graph in Figure 1.1.10, we''re going to plot the number of tries,
    a proxy for running time of the algorithm, against the number of values in the
    range, which will shorten to `n`. “n” here also represents John''s worst case
    scenario. When `n` is 10, he takes 10 turns. When `n` is 100, he takes 100 turns.
    But these two values alone are insufficient to really get any sort of visual understanding.
    Moreover, it''s not realistic. John may take a long time to work through 100 numbers,
    but a computer can do that in no time. To evaluate the performance of linear search
    in the context of a computer, we should probably throw some harder and larger
    ranges of values added.


    The nice thing is by evaluating a worst-case scenario, we don''t actually have
    to do that work. We know what the result will be. For a given value of `n`, using
    linear search, it will take `n` tries to find the value in the worst-case scenario.
    So, let''s add a few values in there to build out the graph shown in Figure 1.1.13.


    ![Image](images/image-13.jpeg)

    Figure 1.1.13: John’s performance graph with larger ranges of values of `n` added


    Okay, so we have a good picture of what this is starting to look like. As the
    values get really large, the running time of the algorithm gets large as well.
    Well, we sort of already knew that. Before we dig into this runtime any deeper,
    let''s switch tracks and evaluate Britney''s work. By having something to compare
    against, it should become easier to build a mental model around time complexity.


    ### 1.1.7. Evaluating Binary Search


    The algorithm John used, linear search, seemed familiar to us, and you could understand
    it because it''s how most of us search for things in real life anyway,


    Britney''s approach on the other hand got results quickly, but it was a bit harder
    to understand, so let''s break it down. Just like John''s approach, Britney started
    with a series of values, or a list of numbers, as her input. Where John just started
    at the beginning of the list and searched sequentially, Britney''s strategy is
    to always start in the middle of the range. From there, she asks a comparison
    question.


    Is the number in the middle of the range equal to the answer she''s looking for,
    and if it''s not, is it greater than or less than the answer? If it''s greater
    than, she can eliminate all the values less than the one she''s currently evaluating,
    as illustrated in Figure 1.1.14. If it''s lesser than the answer, she can eliminate
    all the values greater than the one she''s currently evaluating with the range
    of values that she''s left over with. She repeats this process until she arrives
    at the answer.


    ![Image](images/image-14.jpeg)

    Figure 1.1.14: Chart illustrating how Britney eliminates all the values less than
    the one she''s currently evaluating


    Let''s visualize how she did this by looking at round 3. In round 3, the number
    of values in the range was 100. The answer was 5. The bar in Figure 1.1.15 represents
    the range of values, 1 at the left, 100 at the right, and the pointer represents
    the value Britney chooses to evaluate. So, she starts in the middle at 50. She
    asks, is it equal to the answer? I say it''s too high. This tells her that the
    value she''s evaluating is greater than our target value, which means there''s
    no point in searching any of the values to the right of 50. that is, values greater
    than 50 in this range, so she can discard those values altogether.


    ![Image](images/image-15.jpeg)

    Figure 1.1.15: Chart illustrating how Britney eliminates all the values greater
    than 50


    She only has to consider values from 1 to 50. Now, the beauty of this strategy
    and the reason why Britney was able to find the answer in such few turns is that
    with every value she evaluates, she can discard half of the current range. On
    her second turn, she picks the value in the middle of the current range, which
    is 25. She asks the same question. I say that the value is too high again, and
    this tells her that she can discard everything greater than 25 and the range of
    values drops from 1 to 25.


    ![Image](images/image-16.jpeg)

    Figure 1.1.16: Chart illustrating how Britney eliminates all the values greater
    than 25


    Again, she evaluates the number in the middle roughly, so that would be 13 in
    Figure 1.1.16. I tell her this is still too high. She discards the values greater,
    moves to value at 7, which is still too high. Then she moves to 4, which is now
    too low. She can now discard everything less than 4, which leaves the numbers
    4 through 7. Then she picks 6, which was too high, This only leaves one value:
    5.


    This seems like a lot of work, but being able to get rid of half the values with
    each turn is what makes this algorithm much more efficient. Now, there''s one
    subtlety to using binary search, and you might have caught onto this. For this
    search method to work, as we''ve mentioned, the values need to be sorted.


    With linear search, it doesn''t matter if the values are sorted since a linear
    search algorithm just progresses sequentially, checking every element in the list.
    If the target value exists in the list, it will be found. But let''s say this
    range of values 1 to 100 was unsorted, Britney would start at the middle with
    something like 14, and ask if this value was too low or too high. I say it''s
    too high, so she discards everything less than 14.


    Now, this example starts to fall apart here because while Britney knows what numbers
    are less than 14 and greater than 1, she doesn''t need an actual range of values
    to solve this. A computer however does need that. Remember, search algorithms
    are run against lists containing all sorts of data. It''s not always just a range
    of values containing numbers. In a real use case of binary search, which we''re
