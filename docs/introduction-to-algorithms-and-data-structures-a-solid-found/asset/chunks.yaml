    Britney: Is it 25?

    Me: Still too high.

    Britney: Is it 13?

    Me: Too high.

    Britney: Is it 7?

    Me: Too high.

    Britney: Is it 4?

    Me: Too low.

    Britney: Is it 6?

    Me: Too high.

    Britney: Is it 5?

    Me: Correct!


    Let''s evaluate. John took five tries. Britney on the other hand took seven tries,
    so John wins this round. But again, in determining whose strategy is preferred,
    there''s no clear winner right now. What this tells us is that it''s not particularly
    useful to look at the easy answers where we arrive at the number fairly quickly
    because it''s at the start of the range. Instead, let''s try one where we know
    John is going to do poorly. Let''s look at his worst-case scenario where the answer
    is 100 and see how Britney performs in such a scenario.


    If I do this exercise one more time with John, 1 through 100 again, you can guess
    what happens: John takes 100 tries.


    Me: Now, Britney, you''re up:


    Britney: Is it 50?

    Me: Too low.

    Britney: Is it 75?

    Me: Too low.

    Britney: Is it 88?

    Me: Too low.

    Britney: Is it 94?

    Me: Too low.

    Britney: Is it 97?

    Me: Too low.

    Britney: Is it 99?

    Me: Too low.

    Britney: Is it 100?

    Me: Correct.

    '
  trans: '

    这个概念被称为 `algorithmic thinking`（算法思维），这是我们在学习本章节时将尝试共同培养的技能。最后，学习算法能让你对编程中的复杂性和效率有更深入的理解。对代码在不同情况下的表现有更好的敏锐度这将是你一直想要开发和完善的技能。


    `algorithmic thinking` 也就是为什么算法也会出现在大厂的面试中。面试官并不那么在意你是否能用代码写出一个特定的算法，而是更看重你能够将一个看似不可逾越的问题拆解为不同的组件，并识别出解决每个特定组件的正确工具。这正是我们计划做的。在这门课程中，在我们深入探讨算法主题之前，我们将关注你需要注意的一些概念。如果你准备好了，让我们开始吧！


    ## 1. 猜数字


    在这一节中，我要做一些不寻常的事情。我有两个朋友，Britney 和 John，他们将和我玩一个游戏。这个游戏非常简单，你可能以前玩过。规则是这样的：我想一个
    1 到 10 之间的数字，他们必须猜出那个数字。如果他们猜得太大了，我会告诉他们“大”；如果猜得太小了，我会告诉他们“小”。尝试次数最少的人获胜。


    私下里说，答案是 `3`。好了，让我们从 John 开始。


    我：我想了一个 1 到 10 之间的数字。它是多少？

    John：是 5 吗？

    我：太大了。

    John：是 2 吗？

    我：太小了。

    John：是 3 吗？

    我：正确！


    好的，这道题很简单。John 尝试了 `three` 次才得到答案。让我们换成 Britney，用同一个数字再玩一轮。


    我：我想了一个 1 到 10 之间的数字。它是多少？

    Britney：是 5 吗？

    我：太大了。

    Britney：是 2 吗？

    我：太小了。

    Britney：是 3 吗？

    我：正确！


    等等，这不太对。我们刚才展示了玩同一个游戏的两种方式。不知何故，即使是一个简单的游戏，我们也看到了发现解决方案的不同方法。回到 `algorithmic thinking`，这意味着对于任何给定的问题，都没有最优解。相反，我们应该找出什么方法对当前问题更有效。这一轮中，他们找到答案所用的次数相同，所以因为游戏太简单，并不看出谁的方法更好。让我们再试一次。这次的答案是
    `10`。


    现在先看 John 的：


    John：是 1 吗？

    我：太小了。

    John：是 2 吗？

    我：太小了。

    John：是 3 吗？

    我：太小了。

    John：是 4 吗？

    我：太小了。

    John：是 5 吗？

    我：太小了。

    John：是 6 吗？

    我：太小了。

    John：是 7 吗？

    我：太小了。

    John：是 8 吗？

    我：太小了。

    John：是 9 吗？

    我：太小了。

    John：是 10 吗？

    我：正确。你猜中了！


    现在让我们做同样的事情，但这次换成 Britney：


    Britney：是 5 吗？

    我：太小了。

    Britney：是 8 吗？

    我：太小了。

    Britney：是 9 吗？

    我：太小了。

    Britney：是 10 吗？

    我：正确。


    在这里，我们开始看到他们策略之间的差异。当答案是 3 时，两人都用了同样的次数。当答案是 10 时，我们开始看到策略的差异。Britney 只用了 `four`
    次，而 John 用了 `ten` 次。这显然说明谁的方法更好。让我们再试一次。先看 John：


    John：是 1 吗？

    我：太小了。

    John：是 2 吗？

    我：太小了。

    John：是 3 吗？

    我：太小了。

    John：是 4 吗？

    我：太小了。

    John：是 5 吗？

    我：太小了。

    John：是 6 吗？

    我：太小了。

    John：是 7 吗？

    我：太小了。

    John：是 8 吗？

    我：太小了。

    John：是 9 吗？

    我：太小了。

    John：是 10 吗？

    我：正确。你猜中了！


    现在换成 Britney：


    Britney：是 5 吗？

    我：太小了。

    Britney：是 8 吗？

    我：太小了。

    Britney：是 9 吗？

    我：太小了。

    Britney：是 10 吗？

    我：正确。


    '
