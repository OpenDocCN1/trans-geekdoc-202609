    Figure 1.2.14: This map illustrates an algorithm with a quadratic time


    In Big O notation, we would write this as O(n²) or say that this is an **algorithm
    with a quadratic runtime**. Many search algorithms have a worse case quadratic
    runtime, which you''ll learn about soon.


    ### 1.2.5. Cubic Runtime


    Now, in addition to quadratic runtimes, you may also run into cubic runtimes as
    you encounter different algorithms. In such an algorithm, for given value of n,
    the algorithm executes n³ number of operations. Cubic runtimes are not as common
    as quadratic algorithms though, so we won''t look at any examples. But I think
    it''s worth mentioning. Thrown up on our graph, quadratic and cubic runtimes look
    like Figure 1.2.15.


    ![Image](images/image-31.jpeg)


    Figure 1.2.15: Graph of quadratic and cubic runtimes


    This is starting to look pretty expensive computationally, as they say. We can
    see here that for small changes in 2, there''s a pretty significant change in
    the number of operations that we need to carry out.


    ### 1.2.6. Quasilinear Runtime


    The next worst-case runtime we''re going to look at is one that is called quasi
    linear. It’s sort of easier to understand. I’ll start with the Big O notation.
    Quasilinear runtimes are written out as **O(n log n)**. We learned what log n
    was right? A logarithmic runtime, where as n grows, the number of operations only
    increased by a small factor. With a quasilinear runtime, what we''re saying is
    that for every value of n, we''re going to execute a log n number of operations,
    hence the runtime of n times log n.


