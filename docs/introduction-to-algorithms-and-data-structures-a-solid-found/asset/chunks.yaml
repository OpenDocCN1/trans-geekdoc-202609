    \ if found, else returns None  \n\n\"\"\"  \n\n *for i in range(0, len(list)):\
    \  \n\n if list\\[i\\]== target:  \n\n return i  \n\n return None\n\nEven though\
    \ all the individual operations in our algorithm run in constant time, in the\
