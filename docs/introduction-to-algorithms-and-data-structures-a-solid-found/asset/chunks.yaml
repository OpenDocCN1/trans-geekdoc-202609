- raw: 'In the third volume, you''re going to bring your knowledge of algorithms and
    data structures together to solve the problem of sorting data using the Merge
    Sort algorithm. We will look at algorithms in two categories: **sorting** and
    **searching**. You''ll implement well-known sorting algorithms like Selection
    Sort, Quicksort, and Merge Sort. You''ll also learn basic search algorithms like
    Sequential Search and Binary Search.


    At the end of many sections of this course, short practice exercises are provided
    to test your understanding of the topic discussed. Answers are also provided so
    you can check how well you have performed in each section. At the end of the course,
    you will find a **link to download more helpful resources, such as codes and screenshots
    used in this book, and more practice exercises**. You can use them for quick references
    and revision as well. My **support link is also provided** so you to contact me
    any time if you have questions or need further help.


    By the end of this course, you will understand what algorithms and data structures
    are, how they are measured and evaluated, and how they are used to solve real-life
    problems. So, everything you need is right here in this book. I really hope you’ll
    enjoy it. Are you ready? Let''s dive in!


    # 1\. Introduction to Algorithms


    Whether you are a high school or college student, a developer in the industry
    or someone who is learning to code, you have undoubtedly run into the term algorithm.
    For many people, this word is kind of scary. It represents this body of knowledge
    that seems just out of reach. Only people with computer science degrees know about
    algorithms.


    Now to others, this brings up feelings of imposter syndrome. You might already
    know how to code, but you''re not a real developer because you don''t know anything
    about algorithms. It makes some developers frame certain jobs as above their skill
    level because the interview contained algorithm questions. Well, whatever your
    reasons are, in this course, our goal is to dispel all those feelings and get
    you comfortable with the basics of algorithms. Like any other subject, I like
    to start my courses with what the course is and what is not.


    In this part of the course, we''re going to cover the very basic set of knowledge
    that you need as a foundation for learning about algorithms. This part is less
    about specific algorithms and more about the tools you will need to evaluate algorithms,
    understand how they perform, compare them to each other, and make a statement
    about the utility of an algorithm in a given context.


    Now don''t worry. None of this will be theoretical, and we will learn these concepts
    by using well-known algorithms. We''ll also be writing code, so I do expect you
    to have some programming experience if you intend to continue with this topic.
    You can definitely stick around even if you don''t know how to code, but you might
    want to learn the basics of programming.


    In the meantime, we will be using the Python programming language. Python reads
    a lot like regular English and is the language you will most likely encounter
    when learning about algorithms these days. If you don''t know how to code, or
    if you know how to code in a different language, check out the following book
    that completely simplifies Python programming language for beginners:


    [https://www.scribd.com/book/513773394/Python-Programming-from-Beginner-to-Paid-Professional-Part-1-Learn-Python-for-Automation-IT-with-Video-Tutorials](https://www.scribd.com/book/513773394/Python-Programming-from-Beginner-to-Paid-Professional-Part-1-Learn-Python-for-Automation-IT-with-Video-Tutorials)
    (or use this BIT.LY short link: [http://bit.ly/3ZKREhB](http://bit.ly/3ZKREhB)).


    Even if you know nothing about Python. as long as you understand the fundamentals
    of programming, you should be able to follow along pretty well. If you''re a JavaScript
    developer or a student who''s learning JavaScript for example, chances are good
    that you''ll still be able to understand the code we write later. I''ll be sure
    to provide links along the way if you need anything to follow up on. Let''s start
    with something simple.


    ## 1.1. Playing a Counting Game


    Let''s get a gentle introduction to algorithms by playing a simple game with two
    of my colleagues! Over the next few lessons, we’ll talk about algorithmic thinking,
