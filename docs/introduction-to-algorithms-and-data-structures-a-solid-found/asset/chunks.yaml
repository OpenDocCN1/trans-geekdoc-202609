    然而，对于递归版本，情况完全是另一回事了。在二分查找的递归版本中，我们并不使用变量来跟踪我们正在处理列表的哪部分。相反，在每次递归函数调用时，我们都会创建一个包含值子集或子列表的新列表。


    假设我们有一个大小为 `n` 的列表，在最坏的情况下，目标元素是列表中的最后一个。在这个列表和目标上调用二分查找的递归实现会导致如下场景：该函数将调用自己，并创建一个从列表中间点到列表末尾的新列表。由于我们丢弃了一半的值，该子列表的大小为
    `n/2`。该函数将不断调用自己，创建一个大小为当前列表一半的新子列表，直到它到达一个包含单个元素的列表并满足停止条件。


    这种在每次执行算法逻辑时，子列表的大小都按比例缩减的模式，我们之前见过。你还记得是在哪里吗？这正是二分查找的工作原理。它每次都丢弃一半的值，直到找到解决方案。现在，我们知道正因为这种模式，二分查找的运行时间是对数级的。事实上，二分查找递归版本的空间复杂度也是相同的。


    如果我们从与列表匹配的 `n` 大内存分配开始，在递归二分查找的每次函数调用中，我们需要分配大小为 `n/2`、`n/4` 等额外的内存，直到我们拥有一个空列表或包含单个值的子列表。因此，我们说二分查找算法的递归版本以对数时间运行，大
    复杂度为 `O(log n)`。这在图 1.4.1 中所示。


    ![Image](img/image-55.jpeg)


    图 1.4.1：二分查找递归版本的空间复杂度图


    现在，这里有一个重要的注意事项。这完全取决于语言。还记得我说过像 Swift 这样的编程语言可以进行一些技巧，使得递归深度无关吗？同样的概念也适用于这里。如果你想更多地了解这个概念，它被称为
    `tail optimization`（尾优化）。之所以被称为尾优化，是因为如果你把函数看作有一个结尾，如果递归函数调用是函数的最后一行代码（正如第 1.3.3
    节所示），我们称之为为尾递归，因为它是函数中调用自己的最后部分。


    现在，Swift 用来减少空间（从而减少计算开销）以跟踪这些递归调用的技巧被称为 `tail call optimization`（尾调用优化）或 `tail
    call elimination`（尾调用消除）。这是你在算法讨论中经常看到的词之一，但并不总是对 `you` 有用。


    那么，如果这些内容对 `us` 有用了呢？虽然 Python 没有实现尾调用优化，因此二分查找的递归版本占用对数空间。如果我们必须在两种实现之间进行选择，考虑到迭代版本和递归版本的时间复杂度或运行时间是相同的，我们绝对应该在
    Python 中选择迭代实现，因为它在常数空间内运行。


    呼！好了，内容真多。但通过这一切，我们现在已经建立了两种区分处理相同任务的算法并进行判断的重要方法。


    ### 1.4.3 学习内容回顾


    我们已经到了一个应该回顾所有所学内容的地步。让我们花几分钟时间。


    ### 1. 算法思维


    我们学到的第一点，也可以可以说是最重要的，是算法思维。算法思维是一种解决问题的方法，涉及将输入分解为输出。这不是你一夜之间就能培养出来的，但随着时间的推移，你将能够立即将其应用于任何问题。无论如何，意识到如何将其解构为更易管理的东西是有好处的，遵循算法指南是一个很好的起点。


    ### 2. 如何定义和实现算法


    我们学习的第二点是如何定义和实现算法。我们已经多次涵盖了这些指南（参见图 1.4.1），所以在这里的结束处我就不再让你感到无聊了。


    ### 3. 大 O 和运行时间


    接下来，我们学习了大 O 和衡量算法的时间复杂度。这是一个稍微复杂的话题，但一旦你抽离了数学部分，它并不像看起来那么模糊。不要误会我的意思，数学非常重要，但仅对于那些设计和分析算法的人来说。我们的目标更多是关于如何理解和评估算法。


    ![Image](img/image-56.jpeg)


    图 1.4.2：不同算法的运行时间图

    '
