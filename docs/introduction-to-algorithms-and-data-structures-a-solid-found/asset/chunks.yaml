- raw: 'Now, this is an entirely different story with the recursive version, however.
    In the recursive version of binary search, we don''t make use of variables to
    keep track of which portion of the list we''re working with. Instead, we create
    new lists every time with a subset of values or sublists with every recursive
    function call.


    Let''s assume we have a list of size n, and in the worst-case scenario, the target
    element is the last in the list. Calling the recursive implementation of binary
    search on this list and target would lead to a scenario like this. The function
    would call itself and create a new list that goes from the midpoint to the end
    of the list. Since we''re discarding half the values, the size of the sublist
    is n/2. This function will keep calling itself creating a new sublist that''s
    half the size of the current one until it arrives at a single element list and
    a stopping condition.


    This pattern where the size of the sublist is reduced by a factor on each execution
    of the algorithmic logic we''ve seen before. Do you remember where? This is exactly
    how binary search works. It discards half the values every time until it finds
    a solution. Now, we know that because of this pattern, the running time of binary
    search is logarithmic. In fact, this space complexity of the recursive version
    of binary search is the same.


    If we start out with a memory allocation of size n that matches the list, on each
    function call of recursive binary search, we need to allocate additional memory
    of size n/2, n/4 and so on until we have a sublist that is either empty or contains
    a single value. Because of this, we say that the recursive version of the binary
    search algorithm runs in logarithmic time with a Big O of O(log n). This is illustrated
    in Figure 1.4.1.


    ![Image](images/image-55.jpeg)


    Figure 1.4.1: Illustration of the space complexity of the recursive version of
    binary search


    Now, there''s an important caveat here. This totally depends on the language.
    Remember how I said that a programming language like Swift can do some tricks
    to where recursion depth doesn''t matter? The same concept applies here. If you
    care to read more about this concept, it''s called **tail optimization**. It''s
    called tail optimization because, if you think of a function as having a head
    and a tail, if the recursive function call is the last line of code in the function
    as it is in section 1.3.3, we call this tail recursion since it''s the last part
    of the function that calls itself.


    Now, the trick that Swift does to reduce the amount of space, and therefore computing
    overhead, to keep track of this recursive calls is called **tail call optimization**
    or **tail call elimination**. It''s one of those things that you''ll see thrown
    around a lot in algorithm discussions but may not always be relevant to *you*.


    Now, what if any of this is relevant to *us*? While Python does not implement
    tail call optimization, so the recursive version of binary search takes logarithmic
    space. If we had to choose between the two implementations, given that time complexity
    or runtime of both versions, the iterative and the recursive version are the same,
    we should definitely go with the iterative implementation in Python since it runs
    in constant space.


    Whew! Okay, that was a lot. But with all of this, we''ve now established two important
    ways to distinguish between algorithms that handle the same task and determine
    which one we should use.


    ### 1.4.3. A Recap of What You Learned


    We''ve arrived at what I think is a good spot to take a long break and let all
    of these new concepts sink in. But before you go off to take your practice exercise,
    let''s take a few minutes to recap everything we''ve learned so far.


    While we did implement two algorithms in this course, in actual code, much of
    what we learned here was conceptual and will serve as building blocks for everything
    we''re going to learn in the future. So, let''s list all of it out.


    1\. Algorithmic Thinking


    The first thing we learned about and arguably the most important was algorithmic
    thinking. Algorithmic thinking is an approach to problem solving that involves
    breaking a problem down into a clearly defined input and output, along with a
    distinct set of steps that solves the problem by going from input to output.


    Algorithmic thinking is not something you develop overnight by taking one course,
    so don''t worry if you''re thinking, I still don''t truly know how to apply what
    I learned here. Algorithmic thinking sinks in after you go through several examples
    in a similar fashion to what we did today. It also helps to apply these concepts
    in the context of a real example, which is another thing we will strive to do
    moving forward.


    Regardless, it is important to keep in mind that the main goal here is not to
    learn how to implement a specific data structure or algorithm off the top of your
    head. I''ll be honest, I had to look up a couple code snippets for a few of the
    algorithms myself in writing this course. But in going through this, you now know
    that binary search exists and can apply it to a problem where you need a faster
    search algorithm. Unlike most courses where you can immediately apply what you
    have learned to build something cool, learning about algorithms and data structures
    will pay off more in the long run.


    2\. How to Define and Implement Algorithms


    The second thing we learned about is how to define and implement algorithms. We''ve
    gone over these guidelines several times (see Figure 1.1.8), so I won''t bore
    you here again at the end. But I will remind you that if you''re often confused
    about how to effectively break down a problem in code to something more manageable,
    following those algorithm guidelines is a good place to start.


    3\. Big 0 and Runtimes


    Next, we learned about Big O and measuring the time complexity of algorithms.
    This is a mildly complicated topic, but once you''ve abstracted the math away,
    it isn''t as hazy a topic as it seems. Now, don''t get me wrong, the math is pretty
    important, but only for those designing and analyzing algorithms. *Our* goal is
    more about how to understand and evaluate algorithms.


    ![Image](images/image-56.jpeg)


    Figure 1.4.2: Graph of runtimes of different algorithms


    We learned about common runtimes like constant, linear, logarithmic, and quadratic
    runtimes. These are all fairly new concepts, but in time you will immediately
    be able to distinguish the runtime of an algorithm based on the code you write
    and have an understanding of where it sits on an efficiency scale.


    You''ll also in due time internalize runtimes of popular algorithms, like the
    fact that binary search runs in logarithmic time and constant space, and be able
    to recommend alternative algorithms for a given problem. All in all, over time,
    the number of tools in your tool belt will increase.


    4\. Important Search Algorithms


    Next, we learned about two important search algorithms and the situations in which
    we select one over the other. We also implemented these algorithms in code so
    that you got a chance to see them work. We did this in Python, but if you are
    more familiar with a different language, you should try your hand at implementing
    it yourself. It''s a really good exercise to go through.


    5\. Recursion


    Finally, we learned about an important concept and a way of writing algorithmic
    code through recursion. Recursion is a tricky thing and, depending on the language
    you write code with, you may run into it more than others. It is also good to
    be aware of because as we saw in our implementation of binary search, whether
    recursion was used or not affected the amount of space we used.'
