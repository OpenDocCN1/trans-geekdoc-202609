    \ to start with a function named binary search. So, we'll say\n\ndef binary\\\
    _search(list, target):\n\nThis takes a list and a target. If you remember, binary\
    \ search works by breaking the array or list down into smaller sets until we find\
    \ the value we're looking for. We need a way to keep track of the position of\
    \ the list that we're working with. So. let's create two variables *first* and\
    \ *last* to point to the beginning and end of the array.\n\n first = 0  \n\n last\
    \ = len(list) - 1\n\nNow if you're new to programming, list positions are represented\
    \ by index values that start at 0 instead of 1. So here, we're setting *first*\
    \ to 0 to point to the first element in the list. *Last* is going to point to\
    \ the last element in the list but we'll say *len(list) – 1*, not *len(list)*.\
    \ Now this may be confusing to you, so here’s a quick sidebar to explain what's\
    \ going on.\n\nLet's say we have a list containing 5 elements. If we called *Len*\
    \ on that list, we should get 5 back because there are 5 elements. But remember\
    \ that because the position number start at 0, the last value is not at position\
    \ 5, but at 4. In nearly all programming languages, getting the position of the\
    \ last element in the list is obtained by determining the length of the list and\
    \ deducting 1, which is what we're doing.\n\nNow, we know what the first and last\
    \ positions are when we start the algorithm. For our next line of code, we're\
    \ going to create a *while* loop. A *while* loop takes a condition and keeps executing\
    \ the code inside the loop until the condition evaluates to false. For our condition,\
    \ we're going to tell Python to keep executing this loop until the value of *first*\
    \ is less than or equal to the value of *last*. So,\n\n while first <= last:\n\
    \nWell, why you may ask, why is this our condition? Well, let's work through this\
    \ implementation and then a visualization should help. Inside the *while* loop\
    \ we're going to calculate the midpoint of our list since that's the first step\
    \ of binary search.\n\n  midpoint = (first + last)//2\n\nNow the two forward slashes\
    \ here are what Python calls a floor division operator. What it does is it rounds\
    \ down *midpoint* to the nearest whole number. So, let’s say we have an eight-element\
    \ array, where *first* is 0, *last* is 7. If we divided (0 + 7) by 2, we would\
    \ get 3.5. Now, 3.5 is not a valid index position, so we round that down to 3\
    \ using the floor division operator. Now we have a midpoint.\n\nThe next step\
    \ of binary search is to evaluate whether the value at this midpoint is the same\
    \ as the target we're looking for. So, we say\n\n if list\\[midpoint\\] == target:\n\
    \n return midpoint\n\nto find out if *list* and value at *midpoint* equals the\
    \ *target*. Well, if it is, then we'll go ahead and return the *midpoint*. The\
    \ return statement terminates our algorithm, and over here we're done. This is\
    \ our best-case scenario. Next, we'll use the else-if, *elif* as follows.\n\n\
    \ elif list\\[midpoint\\] < target\n\nThis checks if the value at midpoint is\
    \ less than the target. Now, if the value is less than the target, then we don't\
    \ care about any of the values lower than the midpoint. So, we redefine *first*\
    \ to point to the value after the midpoint as follows.\n\n first = midpoint +\
    \ 1\n\nNow if the value at the midpoint is greater than the target, then we can\
    \ discard the values after the midpoint and redefine *last* to point to the value\
    \ prior to the midpoint. So, we say\n\n else:  \n\n  last = midpoint - 1\n\nNow\
    \ what if we had executed all this code and never hit a case where midpoint equal\
    \ the target? Well, that would mean the list did not contain the target value.\
    \ So, after the while loop, at the bottom, we'll return *None*.\n\n return None\n\
    \nHere’s the updated code.\n\ndef binary\\_search(list, target):  \n\n first =\
    \ 0  \n\n last = len(list) - 1  \n\n while first <= last:  \n\n midpoint = (first\
    \ + last)//2  \n\n if list\\[midpoint\\] == target:  \n\n return midpoint  \n\n\
    \ elif list\\[midpoint\\] < target:  \n\n first = midpoint + 1  \n\n else:  \n\
    \n last = midpoint - 1  \n\n return None\n\nWe have several operations that make\
    \ up our binary search algorithm. So, let's look at the runtime of each step.\
    \ We start by assigning values to *first* and *last*. The value assigned to *last*\
    \ involves a call to the *len* function to get the size of the list, but we already\
    \ know this is a constant time operation in Python. So, both of these operations\
    \ run in constant time."
