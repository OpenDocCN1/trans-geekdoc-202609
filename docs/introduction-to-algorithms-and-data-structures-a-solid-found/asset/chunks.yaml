    为了完整起见，让我们在图上绘制一个组合运行时间图以便进行比较。诸如解决旅行商问题的算法，其最坏情况运行时间为 `O(n!)`。


    ![Image](img/image-47.jpeg)


    图 1.2.31: 组合运行时间图


    研究这种指数级运行时间是有用的，原因有二。首先，在研究如何让此类算法更高效时，我们开发的策略是处处通用的，并且可能用于使现有算法更加高效。其次，意识到那些需要很长时间解决的问题是非常重要的。


    从一开始就知道某个问题在现实时间内是某种程度上不可解决的，意味着你可以将精力集中在问题的其他方面。然而，作为一名初学者，你将避开这一切，并将精力集中在具有多项式运行时间的算法上，因为我们更有可能处理和学习此类算法。


    现在我们已经了解了一些常见的复杂度，在接下来的节中，我们将讨论如何确定一个算法的复杂度，因为其中存在一些细微差别。


    ### 1.2.9. 如何确定算法的复杂度


    在过去的几个章节中，我们查看了研究算法时会遇到的常见复杂度。但问题仍然是，我们如何确定一个算法的最坏情况复杂度？早些时候提到，尽管我们说一个算法具有特定的上界或最坏情况运行时间，但给定算法中的每一步都有不同的运行时间。


    让我们回顾二分查找的步骤。同样，假设列表是有排序的，第一步是确定列表的中间位置。通常，这是一个 `constant time operation`（常数时间操作）。许多编程语言都保留了列表大小的信息，因此我们实际上不需要遍历列表来确定大小。现在如果我们没有列表大小信息，就需要逐个计数每个项目直到列表末尾，这是一个
    `linear time operation`（线性时间操作）。在现实中，这是 `O(1)` 或常数时间。


    第二步是将中间位置的元素与目标元素进行比较。我们可以假设在大多数现代编程语言中，这也是一个常数时间操作，因为语言文档是这么说的。


    第三步是我们的成功情况，算法结束。这是我们的最好情况，到目前为止，我们只经历了两次常数时间操作，所以我们会说`二分查找的最佳情况运行时间是常数时间`，这实际上是真实的。但请记住，最好情况并不是一个有用的指标，除非我们在拆分列表为子列表时没有匹配。


    假设在最坏的情况下，算法将不断拆分为子列表，直到达到包含我们要搜索的值的单个元素列表。这一步的运行时间是 `logarithmic`（对数的），因为我们每次都丢弃一半的值。因此，在我们的算法中，我们有几个常数时间的步骤和一个整体上是对数的步骤。


    在评估算法的运行时间时，我们说算法的上界与算法中效率最低的步骤的运行时间相同。可以这样想：假设你正在参加三项铁锦赛，这是一项包含游泳、跑步和自行车项目的比赛。你可能是一个非凡的游泳运动员和优秀的自行车手，但你跑步非常糟糕。无论你游泳或骑行有多快，你的总比赛时间受跑步时间的影响最大，因为那是耗时间最长的部分。


    如果你花费 1 小时 30 分钟完成跑步，55 分钟游泳，38 分钟骑车，那么你即使将游泳技术精进到 48 分钟完成，将自行车时间缩短到 35 分钟也没用，因为你的上限仍然受限于你的跑步时间，而那几乎是你自行车时间的两倍。


    二分查找算法也是如此，无论我们把其他步骤变得多快，在最坏情况下，它们已经是尽可能快的了。将列表拆分为单个元素列表的操作将影响你算法的整体运行时间。这就是为什么我们说算法在最坏情况下的时间复杂度或运行时间是
    `O(log n)` 或对数的。正如我所暗示的，你的算法可能会遇到最好情况运行时间，而在最好情况和最坏情况之间，还有一个平均运行时间。理解这一点很重要，因为算法并不总是会达到其最坏情况的。但这对我们来说变得有点太复杂了。


    目前，我们可以安全地忽略平均情况性能，并在未来只关注最坏情况。如果你决定留下来，我们会回来详细讨论这一点。现在你已经了解了算法、复杂度和大 O 表示法，请在下一节中做一些练习题。然后你可以从这些内容中休息一下，在随后的章节中编写代码。


    ### 1.2.10. 练习题


    **Q1**. 我最近开始遵循一个健身计划，其中一个流程如下：我必须完成规定数量的引体向上，每完成一次引体向上，我就必须完成等数量的俯卧。例如，如果我想做
    10 个引体向上，在每次引体向上后，我做 10 个俯卧撑。你如何泛化此类流程的运行时间？从下方选择正确答案。


    1. 平方时间，因为对于任何给定流程完成的练习总数是 `n` 乘以 `n`。

    2. 常数时间。我是超人，可以完成任何数量的练习。

    3. 线性时间。因为练习的总数与 `n` 成比例增加。


    **Q2**. 我儿子把玩具扔得到处都是我通过一个一个捡起来清理。你会如何泛化我的“清理”算法？从下方选择正确答案。


    1. `O(n²)` 或平方时间

    2. `O(n)` 或线性时间

    3. `O(1)` 或常数时间


    **Q3**. 你有一盒各种颜色的乐木，你想按颜色整理成一堆。你和朋友把积木分成尽可能小的堆，整理每个堆，然后合并堆。你通常如何定义这个算法的运行时间？


    1. 线性 `O(n)`

    2. 准线性 `O(log n)`

    3. 平方 `O(n²)`


    **Q4**. 算法中的每一步都有自己的代价或时间复杂度。从下方选择正确答案。


    1. 对

    2. 错


    **Q5**. 如果一个算法的运行时间为 `O(1)`，当 `n = 10000` 相比 `n = 10` 会花费多久？


    1. 时间增加 1000 倍。

    2. 时间增加 `log 1000` 倍。

    3. 时间相同。


    ### 1.2.11. 练习题 3 的答案


    1. A.

    2. B.

    3. B.

    4. A.

    5. C.


    ## 1.3. 代码中的算法


    到目前为止，我们只是从抽象角度观察算法，但你来此地也是为了学习如何实现它们！在接下来的几个节中，我们将编写代码来实现线性查找和二分查找。


    ### 1.3.1. 代码中的线性查找




    到目前为止，我们花了大量时间在理论上，虽然这些都是重要的知识点，但当你开始编写代码时，你会更好地理解算法是如何工作的。


