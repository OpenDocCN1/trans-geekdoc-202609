    \n# 0. 你将学习什么以及如何获得帮助\n设计用于解决方案的高效算法需要包含适当的数据结构。在计算机科学领域，数据结构用于以易用的方式存储和组织数据。它们通过组织和表示数据，使计算机更容易进行检索和分析。这些是任何程序员必须学会如何使用以构建\
    \ way 自己的基础基石。\n\n## 0.1. 学习算法和数据结构的益处\n首先，它们能帮助你成为一名更好的程序员。另一个益处是它们会让你的思维更具逻辑性。此外，它们可以帮助你设计更好的存储和处理数据的系统。它们也是优化和解决问题的工具。\n\
    \n因此，算法和数据结构的概念在任何领域都非常有价值。例如，在构建 Web 应用或为其他设备编写软件时，可以使用它们。你可以将它们应用于机器学习和数据分析，这是现在的两个热门领域。如果你是一个黑客，Python\
    \ 中的算法和数据结构对你在任何地方都同样重要。\n\n## 0.2. 课程结构\n本课程共有三卷。这是第一卷。在本卷中，你将深入探索算法的世界。随着频率的增加，算法正在以许多方式塑造我们的生活——从推荐给我们的产品，到我们在社交媒体上互动的朋友，甚至到警察执法、隐私和医疗保健等重要的社会问题。因此，课程的第一部分涵盖了算法是什么、它们如何工作以及在哪里可以找到它们。\n\
    \n在第二卷中，你将学习数据结构的入门。你将学习两种入门数据结构——数组和链表。你将查看常见操作以及这些操作的运行时间如何影响我们的日常代码。\n\n"
