    在编写递归函数时，你总是需要一个停止条件，通常我们会在递归函数的开头设置这个停止条件。这种停止条件通常被称为 `base case`（基准情况）。在我们的递归二分查找函数中，我们有两个停止条件。第一个条件是当传入空列表时函数应该返回的内容。


    评估一个空列表似乎很奇怪，因为你不会预期在一个空列表上进行搜索。但如果你观察我们的函数是如何工作的，递归二分查找会不断调用自己，而每次调用时，列表的大小都会减半。


    如果我们搜索的目标值在列表中不存在，那么函数将不断减半搜索范围，直到变成空列表。考虑一个包含数字 `1`、`2`、`3` 的三元素列表，我们正在寻找目标 `4`。在第一次迭代中，中间点是
    `2`，所以函数将带有列表 `3` 再次调用。


    在下一次迭代中，中间点是 `0` 且目标仍然较大，因此函数这次在调用自己时会传入一个空列表，因为单元素列表中的索引 `0 + 1` 是并不存在的。当我们得到一个空列表时，意味着在遍历整个列表后没有找到该值。这就是为什么我们把空列表定义为返回
    `false` 的停止条件或基准情况。


    如果不是空列表，我们就有另一套完全不同的指令要执行。首先，我们获取列表的中间点。一旦有了中间点，我们就可以引入下一个基准情况或停止条件。如果中间点的值与目标相同，则我们返回
    `true`。有了这两个停止条件，我们就涵盖了搜索算法中所有可能的逻辑路径。你要么找到了该值，要么没找到。一旦有了基准情况，递归函数的其余实现部分就是在更小的子列表上调用该函数，直到遇到其中一个基准情况为止。递归函数自调用的次数被称为
    `recursive depth`（递归深度）。


    现在，我提到这些内容是因为，如果你在开始学习算法后，决定去而去进行你自己的研究，你可能会看到很多使用递归实现的算法。我们第一次实现二分查找的方法被称为一种
    `iterative solution`（迭代解决方案）。现在，当你看到“迭代”（iterative）这个词时，通常意味着解决方案是使用某种循环结构实现的。


    另一方面，递归解决方案涉及一组停止条件和一个不断调用自己的函数。计算机科学家和计算机科学教科书（特别是以前的教科书）倾向于并使用所谓的 `functional
    languages`（函数式语言）编写。在函数式语言中，我们尽量避免更改传递给函数的数据在我们在我们分查找的第一版本中（`1.3.2`节），我们使用列表创建了
    `first` 和 `last` 变量，然后根据需要修改 `first` 和 `last` 以得出解决方案。


    函数式语言不喜欢这样做。所有这些对变量的修改倾向于使用递归的解决方案。像 `Python` 这种我们使用的语言是相反的，它不喜欢递归。事实上，`Python`
    有一个最大递归深度，超过后函数将停止执行。`Python` 更倾向于迭代解决方案。


    现在，我提到这一切出于两个原因。如果你决定学习用非 `Python` 的你喜欢的语言来实现算法，那么你可能会认为递归解决方案是该特定语言中的最佳实现。例如，我是一个
    iOS 开发者，我使用一种名为 `Swift` 的语言。`Swift` 与 `Python` 的不同之处在于它不在乎递归深度，并且不需要那些即使函数自调用多少次也无关紧要的技巧。所以，如果你想在
    `Swift` 代码中看到这种实现，你就知道递归是如何工作的。好了，现在你已经有些概念了。


    我提到的第二个原因实际上更重要，让我们进入下一节。


    ### 1.4.2 空间复杂度 (Space Complexity)


    在本书开头，我提到了衡量算法效率的方法。一个是 `time complexity`（时间复杂度），即算法随 `n` 增长的运行时间；另一个是 `space
    complexity`（空间复杂度）。空间复杂度是衡量随着算法增长，需要多少工作存储或额外存储的指标。


    *(注：原文后续部分存在大量重复的句子，已根据要求去除了重复内容，仅保留核心逻辑翻译)*


    '
