    \ I bet you didn't know that all along you were implementing what is essentially\
    \ a well-known algorithm. So, I hope this goes to show you that algorithms are\
    \ a pretty approachable topic.\n\nLike everything else, this does get advanced,\
    \ but as long as you take things slow, there's no reason for it to be impossible.\
    \ Remember that not any block of code counts as an algorithm. To be a proper implementation\
    \ of linear search, this block of code must return a value, must complete execution\
    \ in a finite amount of time, and must output the same result every time for a\
    \ given input set."
