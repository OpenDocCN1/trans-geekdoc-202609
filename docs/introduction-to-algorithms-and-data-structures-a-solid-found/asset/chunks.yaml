    对数或亚线性的运行时间比线性时间更优，因为它们更高效。但在实践中，线性搜索有其自身的优势，我们将在下一节中探讨这些优势。


    让我们看看在线性搜索算法中遇到的情况。我们看到，在最坏情况下，无论 `n` 的值是多少，约翰恰好需要相应次数的尝试才能找到答案。与线性搜索一样，当在最坏情况下确定结果的操作次数最多与
    `n` 相同时，我们说该算法的运行时间为线性时间。我们将其表示为 `O(n)`。你可以读作 Big O of `n`，或者说线性时间，后者更常见。当我们将其画在图表上并与常数时间和对数时间进行比较时，我们得到一条类似于图
    1.2.11 的折线。


    ![Image](img/image-27.jpeg)


    图 1.2.11: 线性（黄色）、亚线性/对数（橙色）和常数运行时间的图


    任何顺序读取输入的算法都将具有线性时间。因此，请记住，每当你知道一个问题涉及读取列表中的每一个项时，这意味着线性运行时间。正如你从我们玩的游戏看到的，布布尼使用二分搜索的策略显然更好，我们也可以从图中看到这一点。所以，如果我们有选择，为什么还要使用运行线性时间的线性搜索呢？


    记住，二分搜索有一个前提条件，`输入集必须是排序的`。虽然我们在本课程中不会涉及排序算法，但随着你学习到更多算法，你会发现排序算法本身也有不同的复杂度，就像搜索一样。因此，在使用二分搜索之前，我们必须进行额外的工作。由于这个原因，在实践中，在
    `n` 达到某个值之前，线性搜索的性能更好，因为先排序再使用二分搜索的组合成本更高了。


    ## 1.2.4 线性与二次时间


    你将听到的下一个常见复杂度是算法以二次时间运行。如果你觉得“quadratic”（二次）这个词很熟悉，是因为你可能在数学课上听过它。Quadratic 的意思是操作的二次方（例如
    `x²`），或者某物被平方。


    假设你和朋友正在玩一个塔防游戏，为了开始，你要画一张地形地图。这张地图将是一个网格，你随机选择一个数字来决定这个网格有多大。让我们设置网格的大小 `n` 为
    4。


    ![Image](img/image-28.jpeg)


    图 1.2.12: 塔防游戏中具有 4 个网格的地形地图


    接下来，你需要列出一个坐标列表以便在地图上放置塔、敌人和其他东西。那么我们该怎么做呢？如果我们从底部开始水平方向移动，我们将得到坐标点 `(1, 1)`、`(1,
    2)`、`(1, 3)` 和 `(1, 4)`。然后你垂直方向向上移动一级，我们有了点 `(2, 1)`、`(2, 2)`、`(2, 3)` 和 `(2,
    4)`。再向上移动一级，有了点 `(3, 1)`、`(3, 2)`、`(3, 3)` 和 `(3, 4)`。在最后一行（顶端），我们有点 `(4, 1)`、`(4,
    2)`、`(4, 3)` 和 `(4, 4)`。正如你在图 1.2.13 中看到的，我们有一个模式。


    ![Image](img/image-29.jpeg)


    图 1.2.13: 具有 4 个网格的地形地图


    对于每一行，我们取该值并通过增加列来创建一个点。值的范围从 1 到 `n`。我们通常这样考虑：对于从 1 到 `n` 的值范围，在该范围内的每个值，我们创建一个点。再次，对于从
    1 到 `n` 的值范围内的每个值这样做，我们创建 `n` 个值，并得到 `n²` 个点，也就是 `n` 乘以 `n`。这是一个二次运行时间的算法，对于任何给定的
    `n` 值，它执行 `n²` 次操作。现在相对容易，在英语中，我们通常用高度乘以宽度 (`h x w`) 表示地图大小，所以我们会称这是一个 4x4 的网格，这也就是
    `4²` 或 `n²`。


    ![Image](img/image-30.jpeg)


    图 1.2.14: 说明具有二次时间算法的地图


    在大大 O 表示法中，我们会将其写为 `O(n²)`，或者说这是一个具有二次运行时间的算法。许多算法都有二次运行时间，你很快就会学习。


    ## 1.2.5 三次时间


    现在，除了二次时间，当你遇到不同算法时可能还会遇到三次。在这样的算法中，对于给定的 `n` 值，算法执行 `n³` 次操作。三次时间没有二次算法那么常见，所以我们不会看例子。但我认为它值得提到。在我们的图中，二次时间和三次时间看起来如图
    1.2.15。


    ![Image](img/image-31.jpeg)


    图 1.2.15: 二次和三次运行时间的图


    这在计算上开始看起来非常昂贵。我们可以在这里看到，对于值的微小变化，我们需要执行的操作数量发生了显著变化。


    ## 1.2.6 亚线性时间


    我们将看到的下一个最坏情况运行时间是亚线性。它比较容易理解。我会从大 O 表示法开始。我们学过什么是 `log n` 对吧？对数运行时间随着 `n` 的增长，操作次数只增加一个很小的倍数。对于亚线性运行时间，我们说对于每个
    `n` 值，我们将执行 `log n` 次操作，因此运行时间为 `n` 乘以 `log n`。


    此外，你之前看到过二次运行时间对于每个 `n` 值我们执行了 `n` 次操作。与其他运行时间相比，亚线性算法的运行时间位于线性运行时间和二次运行时间之间。看图
    1.2.16。


    ![Image](img/image-32.jpeg)


    图 1.2.16: 二分、亚线性和二次运行时间的图形比较


    在实际使用中我们会在哪里看到亚线性运行时间？嗯，排序算法是你绝对能看到它的地方。例如，归并排序是最坏情况运行时间为 `O(n log n)` 的排序算法。让我们来看一个简单的例子。假设我们从一个类似于图
    1.2.17 的数字列表开始，我们需要对其进行排序。


    ![Image](img/image-33.jpeg)


    图 1.2.17: 使用归并排序的八个数字列表


    归并排序从将此列表从分成两个列表。图 1.2.18。


    ![Image](img/image-34.jpeg)


    图 1.2.18: 归并排序将列表从中间分成两个列表


    然后取出每个子列表并从中间对对半。


    ![Image](img/image-35.jpeg)


    图 1.2.19: 归并排序再次将每个子列表从中间对对半


    再次，它继续这样做，直到我们得到一个只有单个数字的列表。


    ![Image](img/image-36.jpeg)


    图 1.2.20: 归并排序不断拆分每个子列表直到我们得到只有单个数字的列表


    当我们剩下单个数字时，可以进行一次排序操作，并反向方向合并子列表。


    ![Image](img/image-37.jpeg)


    图 1.2.21: 归并排序通过反向合并子列表执行一次排序操作 (n=1)


    ![Image](img/image-38.jpeg)


    图 1.2.22: 归并排序再执行一次排序操作 (n=2)


    ![Image](img/image-39.jpeg)


    图 1.2.23: 归并排序再执行一次排序操作 (n=3) 排序完成


