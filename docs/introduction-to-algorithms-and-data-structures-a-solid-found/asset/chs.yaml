- "# 算法与数据结构入门指南：机器学习与数据分析实战的坚实基础。第一卷\n\n\n\n\n\n![Image](img/image.jpeg)\n\n\n\n\n\
  ![Image](img/image.jpeg)\n\n\nOjula Technology Innovations 是领先的定制化学习解决方案供应商，员工遍布近\
  \ 45 个国家，产品销遍全球 130 多个国家。更多信息请联系 OjulaTech@gmail.com。\n\n\n感谢我的母亲在撰写本教科书期间给予的爱、理解与支持。\n\
  \n\n## 关于作者\n我叫 Bolakale Aremu。我的教育背景是软件开发。我有几位同事是软件开发者和系统工程师。我担任软件开发者工作了 17 多年，也做过很多其他工作。我参与过\
  \ SDLC/流程、数据科学、操作系统安全与架构等领域。我最近的项目是无服务器计算，我在其中简化了分布式系统的构建和运行。在我的项目和课程中，我始终采用实用的方法。\n\
  \nBolakale Aremu\nWeb 开发者与软件工程师\n[Ojulaweb.com](https://ojulaweb.com/)\n\n# 0. 你将学习什么以及如何获得帮助\n\
  设计用于解决方案的高效算法需要包含适当的数据结构。在计算机科学领域，数据结构用于以易用的方式存储和组织数据。它们通过组织和表示数据，使计算机更容易进行检索和分析。这些是任何程序员必须学会如何使用以构建\
  \ way 自己的基础基石。\n\n## 0.1. 学习算法和数据结构的益处\n首先，它们能帮助你成为一名更好的程序员。另一个益处是它们会让你的思维更具逻辑性。此外，它们可以帮助你设计更好的存储和处理数据的系统。它们也是优化和解决问题的工具。\n\
  \n因此，算法和数据结构的概念在任何领域都非常有价值。例如，在构建 Web 应用或为其他设备编写软件时，可以使用它们。你可以将它们应用于机器学习和数据分析，这是现在的两个热门领域。如果你是一个黑客，Python\
  \ 中的算法和数据结构对你在任何地方都同样重要。\n\n## 0.2. 课程结构\n本课程共有三卷。这是第一卷。在本卷中，你将深入探索算法的世界。随着频率的增加，算法正在以许多方式塑造我们的生活——从推荐给我们的产品，到我们在社交媒体上互动的朋友，甚至到警察执法、隐私和医疗保健等重要的社会问题。因此，课程的第一部分涵盖了算法是什么、它们如何工作以及在哪里可以找到它们。\n\
  \n在第二卷中，你将学习数据结构的入门。你将学习两种入门数据结构——数组和链表。你将查看常见操作以及这些操作的运行时间如何影响我们的日常代码。\n\n\n\n\n\
  \n在第三卷中，你将结合算法和数据结构的知识，学习如何使用 `Merge Sort` 算法解决数据排序问题。我们将算法分为两类：`sorting` 和 `searching`。你将实现一些著名的排序算法，如\
  \ `Selection Sort`、`Quicksort` 和 `Merge Sort`。你还将学习基础搜索算法，如 `Sequential Search`\
  \ 和 `Binary Search`。\n\n在本课程的许多章节的末尾，我们提供了简短的练习题，以测试你对所讨论主题的理解情况。同时也提供了答案，以便你检查自己在每个章节中的表现。在课程结束时，你将找到一个下载更多有用资源的链接，例如书书中使用的代码和截图以及更多练习题。你可以使用它们进行快速查阅和复习。我还提供了我的支持链接，如果你有任何问题或需要进一步的帮助，可以随时联系我。\n\
  \n通过本课程的学习，你将理解什么是算法和数据结构，它们是如何被衡量和评估的，以及如何被用来解决现实生活的问题。所以，你需要的一切都在这本书中。我真心希望你会喜欢它。准备好了吗？让我们开始吧！\n\
  \n# 1. 算法导论\n\n无论你是高中生还是大学生、行业内的开发者或是正在学习编程的人，你都无疑遇到过“算法”这个词。对很多人来说，这个词听起来有点吓人。它代表了一部分似乎遥不可及的知识。似乎只有计算机科学学位的人才懂算法。\n\
  \n而对其他人来说，这会产生“冒充者综合征”的感觉。你可能已经知道如何编写代码，但因为对算法一无所知，你并不是真正的开发者。这让某些开发者将某些工作归为高于自己的技能水平，因为面试中包含了算法题。无论，你的原因是什么，在本课程中，我们的目标是消除所有这些感觉，让你熟悉算法的基础知识。像任何其他学科一样，我喜欢在课程开始时介绍课程是什么、以及不是什么。\n\
  \n在课程的这部分，我们将涵盖你学习算法所需的最基础知识 set。这部分的重点不在于具体的算法，而在于你将用来评估算法、理解其性能、将它们相互比较，并对算法在特定语境下的效用做出判断的工具。\n\
  \n现在不要担心。这些内容都不是纯理论的，我们将通过著名的算法来学习这些概念。我们还会编写代码，因此如果你打算继续学习这个主题，我预计你有一些编程经验。即使你不会编程，也完全可以留下，但你可能想学习编程的基础知识。\n\
  \n在此，我们将使用 `Python` 编程语言。Python 读起来非常像普通的英语，也是你现在学习算法时最可能遇到的语言。如果你不知道如何编程，或者你知道如何用其他语言编程，请查看下面这本书，它为初学者完全简化了\
  \ Python 编程语言：\n\n`https://www.scribd.com/book/513773394/Python-Programming-from-Beginner-to-Paid-Professional-Part-1-Learn-Python-for-Automation-IT-with-Video-Tutorials`（或使用这个\
  \ BIT.LY 短链接：`http://bit.ly/3ZKREhB`）。\n\n即使你对 Python 一无所知，只要你理解编程的原理，你就应该能够很好地跟上。例如，如果你是一个\
  \ JavaScript 开发者或正在学习 JavaScript 的学生，很有可能你仍然理解我们稍后写的代码。如果你需要任何跟进内容，我一定会在过程中提供链接。让我们从简单的东西开始。\n\
  \n## 1.1. 玩计数游戏\n\n让我们通过和两个同事玩一个简单的游戏来对算法进行温和的介绍！在接下来的几节中，我们将讨论算法思维、什么是算法，并查看两种流行的搜索算法。\n\
  \n### 1.1.1. 什么是算法？\n\n算法是完成任务的一组指令。这听起来可能有些简化，但它确实是如此。一份`食谱`是一个算法。你的`晨间例程`是一个算法。`驾驶指南`也是算法。\n\
  \n如果你以前写过代码（例如 `print(\"Hello World\")`），或者广义地说，人们所说的算法是指离开迷宫所需要的一组步骤。\n\n![Image](img/image-1.jpeg)\n\
  图 1.1.1: 学生在教室里解决迷宫\n\n每一个解决方案都是算法的有效示例：到达目的地所采取的步骤。\n\n![Image](img/image-2.jpeg)\n\
  图 1.1.2: 黑板上画了三种迷宫的解决方案\n\n\n\n\n这个概念被称为 `algorithmic thinking`（算法思维），这是我们在学习本章节时将尝试共同培养的技能。最后，学习算法能让你对编程中的复杂性和效率有更深入的理解。对代码在不同情况下的表现有更好的敏锐度这将是你一直想要开发和完善的技能。\n\
  \n`algorithmic thinking` 也就是为什么算法也会出现在大厂的面试中。面试官并不那么在意你是否能用代码写出一个特定的算法，而是更看重你能够将一个看似不可逾越的问题拆解为不同的组件，并识别出解决每个特定组件的正确工具。这正是我们计划做的。在这门课程中，在我们深入探讨算法主题之前，我们将关注你需要注意的一些概念。如果你准备好了，让我们开始吧！\n\
  \n## 1. 猜数字\n\n在这一节中，我要做一些不寻常的事情。我有两个朋友，Britney 和 John，他们将和我玩一个游戏。这个游戏非常简单，你可能以前玩过。规则是这样的：我想一个\
  \ 1 到 10 之间的数字，他们必须猜出那个数字。如果他们猜得太大了，我会告诉他们“大”；如果猜得太小了，我会告诉他们“小”。尝试次数最少的人获胜。\n\n\
  私下里说，答案是 `3`。好了，让我们从 John 开始。\n\n我：我想了一个 1 到 10 之间的数字。它是多少？\nJohn：是 5 吗？\n我：太大了。\n\
  John：是 2 吗？\n我：太小了。\nJohn：是 3 吗？\n我：正确！\n\n好的，这道题很简单。John 尝试了 `three` 次才得到答案。让我们换成\
  \ Britney，用同一个数字再玩一轮。\n\n我：我想了一个 1 到 10 之间的数字。它是多少？\nBritney：是 5 吗？\n我：太大了。\nBritney：是\
  \ 2 吗？\n我：太小了。\nBritney：是 3 吗？\n我：正确！\n\n等等，这不太对。我们刚才展示了玩同一个游戏的两种方式。不知何故，即使是一个简单的游戏，我们也看到了发现解决方案的不同方法。回到\
  \ `algorithmic thinking`，这意味着对于任何给定的问题，都没有最优解。相反，我们应该找出什么方法对当前问题更有效。这一轮中，他们找到答案所用的次数相同，所以因为游戏太简单，并不看出谁的方法更好。让我们再试一次。这次的答案是\
  \ `10`。\n\n现在先看 John 的：\n\nJohn：是 1 吗？\n我：太小了。\nJohn：是 2 吗？\n我：太小了。\nJohn：是 3 吗？\n\
  我：太小了。\nJohn：是 4 吗？\n我：太小了。\nJohn：是 5 吗？\n我：太小了。\nJohn：是 6 吗？\n我：太小了。\nJohn：是 7\
  \ 吗？\n我：太小了。\nJohn：是 8 吗？\n我：太小了。\nJohn：是 9 吗？\n我：太小了。\nJohn：是 10 吗？\n我：正确。你猜中了！\n\
  \n现在让我们做同样的事情，但这次换成 Britney：\n\nBritney：是 5 吗？\n我：太小了。\nBritney：是 8 吗？\n我：太小了。\n\
  Britney：是 9 吗？\n我：太小了。\nBritney：是 10 吗？\n我：正确。\n\n在这里，我们开始看到他们策略之间的差异。当答案是 3 时，两人都用了同样的次数。当答案是\
  \ 10 时，我们开始看到策略的差异。Britney 只用了 `four` 次，而 John 用了 `ten` 次。这显然说明谁的方法更好。让我们再试一次。先看\
  \ John：\n\nJohn：是 1 吗？\n我：太小了。\nJohn：是 2 吗？\n我：太小了。\nJohn：是 3 吗？\n我：太小了。\nJohn：是\
  \ 4 吗？\n我：太小了。\nJohn：是 5 吗？\n我：太小了。\nJohn：是 6 吗？\n我：太小了。\nJohn：是 7 吗？\n我：太小了。\n\
  John：是 8 吗？\n我：太小了。\nJohn：是 9 吗？\n我：太小了。\nJohn：是 10 吗？\n我：正确。你猜中了！\n\n现在换成 Britney：\n\
  \nBritney：是 5 吗？\n我：太小了。\nBritney：是 8 吗？\n我：太小了。\nBritney：是 9 吗？\n我：太小了。\nBritney：是\
  \ 10 吗？\n我：正确。\n\n\n\n\n从像 Facebook 这样的公司的角度来思考这个问题。在写这本书时，Facebook 拥有超过 29.6 亿活跃用户。假设你正在另一个国家旅行，遇到了一个你想要在\
  \ Facebook 上添加的人。你进入搜索栏，输入这个人的名字。如果我们简化 Facebook 应用的工作原理，它必须在这些 29.6 亿记录中进行搜索，并找到你正在寻找的人。\n\
  \n找到这个人的速度非常重要。想象一下，当你搜索一个朋友时，Facebook 弹出一个旋转的活动指示器并说：“请几小时后再回来”，那会是怎样的体验。如果是那样，我想我们不会那么频繁地使用\
  \ Facebook 了。从公司的角度来看，利用不同的策略使搜索尽可能快是非常重要的。\n\n现在，我提到过 Britney 和 John 使用的两种策略是搜索的示例。更具体地说，这些是`search\
  \ algorithms`。John 采取的从范围开始并一个接一个数字计数的策略是一种被称为 `linear search`（线性搜索）的搜索类型。它也被称为\
  \ `sequential search`（顺序搜索），这是对其工作原理的更好描述，甚至可以称为 `simple search`（简单搜索），因为它确实非常简单。\n\
  \n但是是什么让他的方法成为算法，而不仅仅是寻找某些东西呢？记得我们说过算法是完成任务的一系列步骤或指令吗？`linear search` 是一种搜索算法，我们可以这样将其可视化：我们从列表或值范围的开始处开始。然后我们将当前值与目标进行比较。如果当前值就是我们要找的目标值，我们就完成了（步骤\
  \ 1）。如果不是，我们将按顺序移动到列表中的下一个值（步骤 2），然后重复步骤 2。如果我们到达列表的末尾，那么目标值就不在列表中。\n\n这个定义与编程无关，事实上，你可以在现实世界中使用它。例如，我可以告诉你走进书店帮我找一本特定的书，你可以实现这一点的方法之一就是使用\
  \ `linear search` 算法。你可以从书店的前部开始，阅读每本书书的封面或书脊，以检查它是否符合你正在寻找的那本书。如果不符合，你就去看下一本书并重复这一过程，直到找到它或书看完为止。\n\
  \n让这成为算法的是其定义的 `specificity`（特异性）。与直接跳进问题并边做边解决不同，算法遵循一套特定的指南，我们每次面对该问题时都使用相同的步骤来解决。定义算法的一个重要第一步不是算法本身，而是我们试图解决的问题。\n\
  \n![Image](img/image-4.jpeg)\n\n图 1.1.4：解决问题的算法步骤数\n\n### 清晰的问题描述\n\n我们的第一条指南是算法必须有一个\
  \ `clear problem statement`（清晰的问题陈述）。当你不清楚自己试图解决什么问题时，定义指令集是非常的。在定义问题时，我们需要指定输入是如何定义的，以及当算法完成工作后输出是什么样的。对于\
  \ `linear search`，输入通常可以描述为一系列值，输出是与我们寻找的相匹配的值。\n\n![Image](img/image-5.jpeg)\n\n\
  图 1.1.5：线性搜索算法示例\n\n现在，我们试图避免任何与代码相关的内容，所以这个问题描述定义非常通用。但一旦我们编写代码，实际上可以收紧这一点。一旦我们有了问题，算法就是解决该问题的一系列步骤。\n\
  \n### 特定顺序\n\n既然下一条指南是 `an algorithm definition must contain a specific set of instructions\
  \ in a particular order`（算法定义必须包含特定顺序的一组指令），我们确实需要明确这些指令执行的顺序。因此，特定顺序非常重要。\n\n![Image](img/image-6.jpeg)\n\
  \n图 1.1.6：完成线性搜索算法所需的有序步骤列表\n\n回到我们对 `linear search` 的简单定义，如果我交换了图 1.1.6 中的顺序，并在指定第一个比较步骤之前说“按顺序移动到下一个值”，如果第一个值就是目标值，我们的算法将找不到它，因为我们在比较之前就移动到了第二个值。现在你可能会想，好吧，那仅仅是一个可以避免的错误，而且是种常识。问题在于计算机并不知道这些，它们完全按照我们告诉它们的事情去做，所以特定顺序非常重要。\n\
  \n### 独立步骤\n\n第三条指南是 `each step in our algorithm definition must not be a complex\
  \ one`（我们算法定义中的每一步都不能是复杂的），并且需要明确地清晰。我的意思是，你不应该能够将任何步骤拆分为进一步的或额外的子任务。每个步骤都需要是相互独立的。我们不能将\
  \ `linear search` 定义为“直到你找到这个值为止的搜索”，因为这可以被解释为许多方式并进一步拆分。\n\n![Image](img/image-7.jpeg)\n\
  \n图 1.1.7：算法的每一步必须是独立的\n\n### 产生结果\n\n下一个是 `algorithms should produce a result`（算法应该产生结果）。这似乎是显而易见的。如果产生产生结果，我们如何知道算法是否有效？为了能够验证算法是否有效，我们需要一个结果。现在，当我们使用搜索算法时，结果实际上可以是“空”，这表示没有找到。但这是完全没问题的。在代码中有许多方法可以表示“空”。\n\
  \n### 有限完成\n\n最后一条指南是 `algorithm should actually complete and cannot take infinite\
  \ time`（算法应该完成，不能花费无限的时间）。如果我们让 John 进入最大的图书馆并让他找一本小说，我们无法知道他是否成功了，除非他带回一个结果。\n\n\
  ### 总结\n\n现在，让我们快速回顾一下。是什么让算法成为算法而不仅仅是某种行为？\n\n![Image](img/image-8.jpeg)\n\n图 1.1.8：五条算法指南总结\n\
  \n**1**. 它需要有一个清晰的问题陈述、输入和输出。使用 `linear search` 时，输入只需要是一系列值，但为了实际上使用 Britney 的策略，有一个额外的前提条件。如果你考虑她的策略，它要求数字按升序排列。这意味着，对于\
  \ John 来说输入是一系列值，而 Britney 算法的输入需要是排序后的序列。因此，清晰的问题陈述、清晰的输入和清晰的输出。\n\n**2**. 算法的步骤需要一个特定的顺序。\n\
  \n**3**. 步骤也需要是独立的。你不应该能够将其拆分为进一步的子任务。\n\n**4**. 下一步，算法应该产生结果，最后，\n\n**5**. 算法应该在有限的时间内完成。\n\
  \n这些指南不仅帮助我们定义什么是算法，还帮助我们验证算法是否正确。对于给定的输入，执行算法的步骤每次必须产生 `相同的输出`。\n\n\n\n我必须强调的是，我们不会自己设计任何算法，而是将从零开始，花费大部分时间学习那些被证明能够高效解决问题的成熟算法。然而，我们之所以讨论什么是良好的算法，是因为同一套准则也适用于培养良好的算法思维，而这是我们想要培养的最重要技能之一。当我们遇到一个问题时，在急于投入思考解决方案之前，我们想要做的是遵循这些准则。首先，我们将问题分解为任意数量的较小问题，其中每个问题都可以根据输入和输出被明确定义。\n\
  \n### 1.1.4. 练习题 1\n\n**Q1**. 如果我们无法确定程序的输出，即使它解决了眼下的问题，我们还能称其为算法吗？\n\nA. 不能。\n\n\
  B. 能。\n\n**Q2**. 我们出于以下哪些原因学习算法和数据结构？请在下方选择正确答案：\n\nA. 了解针对常见问题的现有解决方案\nB. 理解常见问题解决方案的效率\n\
  C. 能够评估并将问题拆分为为不同的部分\nD. 以上所有\n\n### 1.1.5. 练习题 1 答案\n\n1. A\n2. D\n\n### 1.1.6.\
  \ 评估线性搜索\n\n现在我们已经知道了如何通俗地定义算法，让我们谈谈什么是良好的算法。需要记住的一点是，没有单一的方法可以衡量一个算法是否是正确的解决方案，因为这取决于上下文。之前我们提到了两个概念：`correctness`（正确性）和\
  \ `efficiency`（效率）。让我们更清晰地定义正确性，因为在评估算法的效率之前，我们需要确保它的正确性。在定义算法之前，我们从定义问题开始。\n\n\
  在问题的定义中，我们有明确定义的输入（满足任何先决条件）和明确定义的输出。如果在输入数据中所有可能值的每次运行时，我们总是得到预期的输出，那么该算法被认为是正确的。正确性的部分含义意味着对于任何可能的输入，算法应该始终终止或结束。如果这两点不成立，那么我们的算法就是错误的。\n\
  \n如果你拿起算法教材查找 `correctness`，你会遇到大量的数学理论。这是因为传统上算法的正确性是通过数学归纳法证明的，这是数学中用于验证陈述正确性的推理形式。这种方法涉及编写所谓的规范（specification）和正确性证明。我们不会在课程中涉及这些内容。通过归纳法进行证明是设计算法的重要部分，但我们有心你可以从如何使用以及何时使用它们来理解算法，而无需陷入数学。所以，如果你拿起教科书感到无畏，不要担心。我也一样。但我们仍然可以在没有数学的情况下解决问题。\n\
  \n所以，一旦我们有了正确的算法，就可以开始讨论算法的 `how efficient`（多高效）。记住，这种效率最终很重要，因为它们帮助我们更快地解决问题，并在各个领域提供更好的用户体验。例如，算法用于\
  \ DNA 测序，更高效的测序算法允许我们更好地、更快地研究和理解疾病，但让我们先不要操之过急。我们将从从效率评估 John 的线性搜索算法开始。\n\n首先，效率指的是什么？涉及到算法有\
  \ `two measures of efficiency`（两种效率衡量标准）：时间和空间。听起来很酷，非常科幻，对吧？通过时间衡量的效率，你可能会听过被称为\
  \ `time complexity`（时间复杂度），它是衡量算法运行所需的时间。在代码和计算机背景之外，时间复杂度可以被通用地理解，因为完成一项任务所需的时间是效率的通用衡量标准。你花费的时间越少，效率越高。\n\
  \n效率的第二个衡量标准是 `space complexity`（空间复杂度），这非常针对计算机。它涉及计算机上占用的内存量。良好的算法需要在这两个标准之间取得平衡才有用。例如，你可以有一个极快的算法，但如果它消耗的内存超过了你拥有的量，它可能就没有意义了。\n\
  \n\n\n让我们想象这样一个场景：Facebook 在查找朋友时天真地实现了线性搜索。他们查看了美国最新的人口普查数据，发现 50% 的名字是以 A 到 J\
  \ 字母开头的，这占字母表的前 40%，他们心想：好吧，平均来说线性搜索对我们很有用，但那些名字以字母表中 J 之后的字母开头的人该呢？搜索像 Peter 这样的名字需要比平均时间更长，而对于名字以\
  \ Z 开头的人来说，时间要长得多。\n\n![Image](img/image-11.jpeg)\n图 1.1.11：Facebook 上实现线性搜索的示例\n\
  \n因此，虽然测量算法的平均运行时间可能看起来是一个很好的策略，但它并不一定能提供准确的图景。通过选取范围内的最大值，我们衡量的是算法在最坏情况下的表现。分析最坏情况非常有用，因为它表明算法的性能永远不会低于我们的预期。没有出现意外的空间。\n\
  \n![Image](img/image-12.jpeg)\n图 1.1.12：我们算法的最坏情况\n\n回到图 1.1.10 中的图表，我们将绘制尝试次数（算法运行时间的代理）与范围内数值数量之间的关系图，后者将简写为\
  \ `n`。“这里的“n”也代表 John 的最坏情况。当 `n` 为 10 时，他需要 10 轮。当 `n` 为 100 时，他需要 100 轮。但仅靠这两个值不足以真正获得任何视觉上的理解。而且，这并不符合实际。John\
  \ 可能需要很长时间来处理 100 个数字，但计算机瞬间就能完成。为了在计算机背景下评估线性搜索的性能，我们可能应该添加更困难、范围更大的数值。\n\n很棒的地方在于，通过评估最坏情况，我们实际上不需要做那些工作。我们知道结果会是什么。对于给定的\
  \ `n` 值，使用线性搜索，在最坏情况下需要 `n` 次尝试才能找到该值。因此，让我们添加几个值来构建出图 1.1.13 所示的图表。\n\n![Image](img/image-13.jpeg)\n\
  图 1.1.13：添加了更大数值范围 `n` 后 John 的性能图\n\n好了，我们对这开始变成什么样有了很好的了解。当数值变得非常大时，算法的运行时间也随之增大。嗯，我们大概已经知道这一点。在深入研究这种运行时间之前，让我们切换一下轨道，评估\
  \ Britney 的工作。通过对比，建立关于时间复杂性的心理模型应该变得更容易。\n\n### 1.1.7. 评估二分查找\n\nJohn 使用的算法——线性搜索，对我们来说很熟悉，你可以理解它，因为这正是我们大多数人在现实生活中寻找事物的方式。\n\
  \n另一方面，Britney 的方法很快得到了结果，但理解起来稍微难一点，所以让我们来拆解一下。和 John 的方法一样，Britney 也从一系列值（或一个数字列表）作为输入开始。John\
  \ 只是从列表开始并按顺序搜索，而 Britney 的策略是始终从范围的中间开始。从那里，她提出了一个比较问题。\n\n范围中间的数字是否等于她正在寻找的答案？如果不是，它是大于答案还是小于答案？如果大于答案，她就可以排除所有小于她当前评估值的值，如图\
  \ 1.1.14 所示。如果小于答案，她就可以排除所有大于当前评估值的值。\n\n![Image](img/image-14.jpeg)\n图 1.1.14：二分查找的原理（注：此处原文未提供具体标题，根据上下文推断）\n\
  \n（注：由于原文文本在 Figure 1.1.14 之后出现了大量逻辑重复且结构混乱的描述，以下翻译严格遵循了“不漏掉任何一行”且“不重复输出”的原则，对原文重复的循环描述进行了对应性翻译。）\n\
  \n*注：由于提供的英文原文文本在 Figure 1.1.14 之后存在大量的逻辑重复和句述断层（例如反复描述二分的过程），译文已按原文行逐行进行了对应翻译，以确保文档的完整性。*\n\
  \n\n\n\n\n还记得我们定义算法的准则吗？请快速复习一遍图 1.1.8。让我们用这些准则来定义这个算法。\n\n- **第 1 步**：我们确定排序列表的中间位置。\n\
  - **第 2 步**：我们将中间位置的元素与目标元素进行比较。\n- **第 3 步**：如果元素匹配，返回中间位置并结束。如果不匹配，执行第 4 步。\n\
  - **第 4 步**：检查中间位置的元素是否小于目标元素。如果是，则创建一个从当前列表中间位置到当前列表末尾的新列表，回到第 2 步。\n- **第 5 步**：如果中间位置的元素大于目标元素，则再次创建一个从当前列表开始到中间位置的新列表，回到第\
  \ 2 步。\n\n我们重复这个过程，直到找到目标元素，或者子列表只包含一个元素。如果这个只有一个元素的子列表与目标元素不匹配，则结束算法，表示该元素不在列表中。\n\
  \n这就是布莱特尼能够更快解决这一轮问题的背后的魔法。在下一节中，我们将讨论二分查找的效率。\n\n### 1.1.8. 练习题 2\n\n**Q1.** 下列哪项最符合对二分查找输入的定义？请选择下面的正确答案：\n\
  \nA. 一个有序的任意数据的连续序列\n\nB. 任意数据的连续序列\n\n**Q2.** 如果在算法的每次运行中，针对输入数据中的所有可能值，我们总是得到预期的输出，则认为算法是正确的。请选择下面的正确答案。\n\
  \nA. 错误\nB. 正确\n\n**Q3.** 选择下面的正确答案。时间复杂度可以描述为：\n\nA. 通过算法相对于数据集大小所消耗的时间来衡量算法的效率。\n\
  B. 通过算法相对于数据集大小消耗消耗内存来衡量算法的效率。\n\n### 1.1.9. 练习题 2 答案\n\n1. A\n2. B\n3. A\n\n##\
  \ 1.2. 时间复杂度\n\n在过去的几节中，我们看到两个同事用不同的策略玩游戏，并得到了不同的结果。这些策略是现实世界算法的例子，但我们仍然不清楚哪一个更好。在这一节中，我们将查看时间复杂度以及衡量算法效率的方法。\n\
  \n### 1.2.1. 算法的效率\n\n我们模糊地理解布莱特尼的方法在大多数情况下都更好，但就像线性查找一样，将其视觉化会有帮助。就像我们在线性查找中所做的那样，在确定算法的效率时（记住，我们仍然只从时间的角度考虑效率——即所谓的时间复杂度），我们总是想要评估算法在最坏情况下的表现。\n\
  \n现在，你可能在想，这似乎不公平，因为给定一组数据，如果我们搜索的目标值在列表开头附近，那么线性查找的表现可能和二分查找一样好，甚至稍微更好。这完全正确。记住，学习算法的关键部分之一是理解在特定语境下什么方法更好。然而，在衡量效率时，我们总是使用最坏情况作为基准，因为记住，它的表现永远比最坏情况更差。让我们在之前开始的图上画出这些值。\n\
  \nY 轴表示尝试次数或算法的运行时间，横轴表示序列中的最大数值或 `n`，代表最坏情况，我们有两个数据点。当 `n` 等于 10 时，布莱特尼使用二分查找花了\
  \ 4 次尝试；当 `n` 等于 100 时，花了 7 次尝试。\n\n![Image](img/image-17.jpeg)\n\n图 1.2.1：代表二分查找尝试次数和\
  \ `n` 从 10 到 100 值的图表\n\n但即使并列在一起，这些数据点也毫无意义。记住，虽然在 `n` 值为 100 时，线性查找和二分查找的运行时间有很大差异，但对于计算机来说这并不重要。我们应该检查的是算法在可能会让计算机变慢的\
  \ `n` 级表现。随着 `n` 变得越来越大，这些算法之间是如何比较的？让我们把它也加入图中。\n\n现在，画面开始显现。当 `n` 变得非常大时，这两种算法的性能差异显著。这种差异实际上是惊人的。即使在那个简单的游戏中，我们也看到二分查找更好，但现在我们对它到底好多少有了一个更完整的概念。\n\
  \n例如，当 `n` 为 1000 时，用操作次数或轮数衡量的线性查找运行时间也是 1000。\n\n![Image](img/image-18.jpeg)\n\
  \n图 1.2.2：用操作次数或轮数衡量的线性查找性能，`n` 为 1000 时的图\n\n![Image](img/image-19.jpeg)\n\n图 1.2.3：二分查找性能，`n`\
  \ 为 10000 时的图\n\n![Image](img/image-20.jpeg)\n\n图 1.2.4：线性查找与二分查找性能，`n` 为 10000\
  \ 时的图\n\n![Image](img/image-21.jpeg)\n\n图 1.2.5：大 O：算法复杂度的数量级\n\n\n\n\n请务必记住，复杂度是相对而言的。当我们评估二分搜索算法的复杂度时，我们是相对于其他算法来做的，而不是相对于所有算法。大\
  \ O 是一种理解时间和空间复杂度的有用表示法，但仅在对解决相同问题的算法进行比较时有效。大 O 定义中的最后一位（`n`）是`规模的函数`，这意味着大 O 衡量的是随着输入规模增长而增长的复杂度，因为理解算法在单个数据集上的表现并不重要，重要的是要理解它在所有可能的数据集上的表现。\n\
  \n你还会看到大 O 被称为算法的 `Upper Bounds`（上界）。这意味着大 O 衡量的是算法在最坏情况下的表现。大 O 仅此此。没什么特别的！它只是将我们建立的数据点和图表压缩成一个变量的表示法。\n\
  \n这些变量看起来是什么样的？对于约翰的策略——线性搜索，我们说它的时间复杂度为 `O(n)`，即大 O 后面跟着一个括号里的 `n`。对于布列尼特的策略——二分搜索，我们说它的时间复杂度为\
  \ `O(log n)`，即 Big O log n。这是大 O 后面跟着一个叫做 `log` 和一个括号里的 `n`。现在，如果你不理解也不要，我们将在课程的后部分详细介绍。\n\
  \n这些每一个项都有特殊的含义，但通过学习它们有助于建立一个直观的视角。因此，在接下来的几节课中，我们将检查你将会遇到并应该内化的所谓常见复杂度或大 O 的常见值。\n\
  \n### 1.2.3. 常数时间和对数时间\n\n在我们对复杂度的讨论中，我们做了一个假设，即算法整体只有一个复杂度标准。事实并非如此，我们将在本次练习结束时讨论如何得出整个算法的这些衡量标准。但算法中的每一步都有自己的空间时间和复杂度。例如，在线性搜索中，有多个步骤，算法流程如下：\n\
  \n*   从列表或数值范围的开始开始。\n*   将当前值与目标进行比较。\n*   如果当前值就是我们要找的目标值，则完成。\n*   如果不是，我们将顺序移动到列表中的下一个值，并重复步骤二。\n\
  *   如果我们到达列表末尾，说明目标值不在列表中。\n\n让我们回到步骤二片刻。将当前值与目标进行比较，数据集的大小对这一步重要吗？当我们处于步骤二时，我们已经处于列表中的该位置，我们所做的只是读取值进行比较。读取值是一个单次操作，如果我们将其绘制在运行操作次数相对于\
  \ `n` 的图上，它看起来就像图 1.2.6。这是一条直线，无论 `n` 的大小如何，所需时间都是常数。\n\n![Image](img/image-22.jpeg)\n\
  \n图 1.2.6：运行操作次数相对于 `n` 的图表\n\n由于在任何给定情况下所需相同的时间，我们说运行时间是常数时间。它在大 O 表示法中不会改变，因此我们将其表示为括号内为\
  \ 1 大 O。现在，当我开始学习这些内容时，我真的很困惑该如何阅读它。即使是在我脑子里，我应该说 Big O of 1 吗？当你看到这种写法时，你会将其读为常数时间，因此在列表中读取值是一个\
  \ `constant time operation`。这是运行时间方面最理想的情况，因为输入规模并不重要。此外，我们知道，无论 `n` 的大小如何，算法的运行时间都将保持不变。\n\
  \n可以说，复杂性的下一个台阶是我们在二分搜索算法中遇到的情况。传统上，解释二分搜索的时间复杂度涉及数学，我将尝试用使用和不使用数学的方法分别解释。当我们使用\
  \ `binary search` 玩游戏时，我们注意到每轮都能丢弃一半的数据。但出现了另一个我们没有探索的模式。假设 `n` 等于 10。找到列表中第 10\
  \ 个位置的项目需要多长时间？我们可以像图 1.2.7 所示写出来。因此，我们从 10 变 5，再到 8、9，最后降到 10。在这里，我们需要 `4` 次尝试将列表缩小到只剩一个元素并找到我们要找的值。\n\
  \n![Image](img/image-23.jpeg)\n\n图 1.2.7：在二分搜索中找到列表中第 10 个位置的项目需要多久\n\n让我们将 `n`\
  \ 值翻倍到 20，看看找到列表中第 20 个位置的项目需要多长时间。\n\n![Image](img/image-24.jpeg)\n\n图 1.2.8：在二分搜索中找到列表中第\
  \ 20 个位置的项目需要多久\n\n所以，我们从 20 开始，然后选取 10。从那里我们到 15、17、19，最后到 20。所以在这里，我们需要 `5` 次尝试。现在，让我们再次翻倍，使\
  \ `n` 变为 40。（等等，说是将 20 翻倍到 40）。让我们遵循文本逻辑：“我们从 20 开始，然后选取 10。从那里我们到 15、17、19，最后到\
  \ 20。所以在这里，我们需要 `5` 次尝试。现在，让我们再次翻倍，使 `n` 变为 40。”\n\n\n\n\n对数或亚线性的运行时间比线性时间更优，因为它们更高效。但在实践中，线性搜索有其自身的优势，我们将在下一节中探讨这些优势。\n\
  \n让我们看看在线性搜索算法中遇到的情况。我们看到，在最坏情况下，无论 `n` 的值是多少，约翰恰好需要相应次数的尝试才能找到答案。与线性搜索一样，当在最坏情况下确定结果的操作次数最多与\
  \ `n` 相同时，我们说该算法的运行时间为线性时间。我们将其表示为 `O(n)`。你可以读作 Big O of `n`，或者说线性时间，后者更常见。当我们将其画在图表上并与常数时间和对数时间进行比较时，我们得到一条类似于图\
  \ 1.2.11 的折线。\n\n![Image](img/image-27.jpeg)\n\n图 1.2.11: 线性（黄色）、亚线性/对数（橙色）和常数运行时间的图\n\
  \n任何顺序读取输入的算法都将具有线性时间。因此，请记住，每当你知道一个问题涉及读取列表中的每一个项时，这意味着线性运行时间。正如你从我们玩的游戏看到的，布布尼使用二分搜索的策略显然更好，我们也可以从图中看到这一点。所以，如果我们有选择，为什么还要使用运行线性时间的线性搜索呢？\n\
  \n记住，二分搜索有一个前提条件，`输入集必须是排序的`。虽然我们在本课程中不会涉及排序算法，但随着你学习到更多算法，你会发现排序算法本身也有不同的复杂度，就像搜索一样。因此，在使用二分搜索之前，我们必须进行额外的工作。由于这个原因，在实践中，在\
  \ `n` 达到某个值之前，线性搜索的性能更好，因为先排序再使用二分搜索的组合成本更高了。\n\n## 1.2.4 线性与二次时间\n\n你将听到的下一个常见复杂度是算法以二次时间运行。如果你觉得“quadratic”（二次）这个词很熟悉，是因为你可能在数学课上听过它。Quadratic\
  \ 的意思是操作的二次方（例如 `x²`），或者某物被平方。\n\n假设你和朋友正在玩一个塔防游戏，为了开始，你要画一张地形地图。这张地图将是一个网格，你随机选择一个数字来决定这个网格有多大。让我们设置网格的大小\
  \ `n` 为 4。\n\n![Image](img/image-28.jpeg)\n\n图 1.2.12: 塔防游戏中具有 4 个网格的地形地图\n\n接下来，你需要列出一个坐标列表以便在地图上放置塔、敌人和其他东西。那么我们该怎么做呢？如果我们从底部开始水平方向移动，我们将得到坐标点\
  \ `(1, 1)`、`(1, 2)`、`(1, 3)` 和 `(1, 4)`。然后你垂直方向向上移动一级，我们有了点 `(2, 1)`、`(2, 2)`、`(2,\
  \ 3)` 和 `(2, 4)`。再向上移动一级，有了点 `(3, 1)`、`(3, 2)`、`(3, 3)` 和 `(3, 4)`。在最后一行（顶端），我们有点\
  \ `(4, 1)`、`(4, 2)`、`(4, 3)` 和 `(4, 4)`。正如你在图 1.2.13 中看到的，我们有一个模式。\n\n![Image](img/image-29.jpeg)\n\
  \n图 1.2.13: 具有 4 个网格的地形地图\n\n对于每一行，我们取该值并通过增加列来创建一个点。值的范围从 1 到 `n`。我们通常这样考虑：对于从\
  \ 1 到 `n` 的值范围，在该范围内的每个值，我们创建一个点。再次，对于从 1 到 `n` 的值范围内的每个值这样做，我们创建 `n` 个值，并得到 `n²`\
  \ 个点，也就是 `n` 乘以 `n`。这是一个二次运行时间的算法，对于任何给定的 `n` 值，它执行 `n²` 次操作。现在相对容易，在英语中，我们通常用高度乘以宽度\
  \ (`h x w`) 表示地图大小，所以我们会称这是一个 4x4 的网格，这也就是 `4²` 或 `n²`。\n\n![Image](img/image-30.jpeg)\n\
  \n图 1.2.14: 说明具有二次时间算法的地图\n\n在大大 O 表示法中，我们会将其写为 `O(n²)`，或者说这是一个具有二次运行时间的算法。许多算法都有二次运行时间，你很快就会学习。\n\
  \n## 1.2.5 三次时间\n\n现在，除了二次时间，当你遇到不同算法时可能还会遇到三次。在这样的算法中，对于给定的 `n` 值，算法执行 `n³` 次操作。三次时间没有二次算法那么常见，所以我们不会看例子。但我认为它值得提到。在我们的图中，二次时间和三次时间看起来如图\
  \ 1.2.15。\n\n![Image](img/image-31.jpeg)\n\n图 1.2.15: 二次和三次运行时间的图\n\n这在计算上开始看起来非常昂贵。我们可以在这里看到，对于值的微小变化，我们需要执行的操作数量发生了显著变化。\n\
  \n## 1.2.6 亚线性时间\n\n我们将看到的下一个最坏情况运行时间是亚线性。它比较容易理解。我会从大 O 表示法开始。我们学过什么是 `log n` 对吧？对数运行时间随着\
  \ `n` 的增长，操作次数只增加一个很小的倍数。对于亚线性运行时间，我们说对于每个 `n` 值，我们将执行 `log n` 次操作，因此运行时间为 `n` 乘以\
  \ `log n`。\n\n此外，你之前看到过二次运行时间对于每个 `n` 值我们执行了 `n` 次操作。与其他运行时间相比，亚线性算法的运行时间位于线性运行时间和二次运行时间之间。看图\
  \ 1.2.16。\n\n![Image](img/image-32.jpeg)\n\n图 1.2.16: 二分、亚线性和二次运行时间的图形比较\n\n在实际使用中我们会在哪里看到亚线性运行时间？嗯，排序算法是你绝对能看到它的地方。例如，归并排序是最坏情况运行时间为\
  \ `O(n log n)` 的排序算法。让我们来看一个简单的例子。假设我们从一个类似于图 1.2.17 的数字列表开始，我们需要对其进行排序。\n\n![Image](img/image-33.jpeg)\n\
  \n图 1.2.17: 使用归并排序的八个数字列表\n\n归并排序从将此列表从分成两个列表。图 1.2.18。\n\n![Image](img/image-34.jpeg)\n\
  \n图 1.2.18: 归并排序将列表从中间分成两个列表\n\n然后取出每个子列表并从中间对对半。\n\n![Image](img/image-35.jpeg)\n\
  \n图 1.2.19: 归并排序再次将每个子列表从中间对对半\n\n再次，它继续这样做，直到我们得到一个只有单个数字的列表。\n\n![Image](img/image-36.jpeg)\n\
  \n图 1.2.20: 归并排序不断拆分每个子列表直到我们得到只有单个数字的列表\n\n当我们剩下单个数字时，可以进行一次排序操作，并反向方向合并子列表。\n\n\
  ![Image](img/image-37.jpeg)\n\n图 1.2.21: 归并排序通过反向合并子列表执行一次排序操作 (n=1)\n\n![Image](img/image-38.jpeg)\n\
  \n图 1.2.22: 归并排序再执行一次排序操作 (n=2)\n\n![Image](img/image-39.jpeg)\n\n图 1.2.23: 归并排序再执行一次排序操作\
  \ (n=3) 排序完成\n\n\n\n\n归排序（Merge Sort）的第一部分是将这些列表切割成数量减半的子列表。这类似于二分查找，其中每次比较操作都会将范围缩小一半。你知道二分查找的最坏情况运行时间是\
  \ `log n`。因此，分割操作的运行时间相同，均为 `O(log n)` 或对数级。但将列表平分并不是归排序需要做的唯一事情。我们还需要执行`比较操作`以便对这些值进行排序。如果你观察该算法的每一步，我们执行了\
  \ `n` 次比较操作，这使得该算法的最坏情况运行时间达到了 `O(nlog n)`，也称为准线性。\n\n### 1.2.7. 多项式运行时间\n\n如果你没有理解归排序是如何工作的，不要担心。这并不是本次演示的目的。我们稍后会介绍归排序。到目前为止我们看到的运行时间都被称为`多项式运行时间`。\n\
  \n如果对于给定的 `n` 值，一个算法的最坏情况运行时间为 `O(n^k)` 的形式，其中 `k` 只是某个值，那么该算法被认为具有多项式运行时间。因此，它可以是\
  \ `n²`（其中 `k = 2` 为二次运行时间），以及 `n³`（其中 `k = 3` 为三次运行时间），以此此类推。所有这些形式都是 `n` 的某个幂次方。任何受此限制的内容，即任何落入图\
  \ 1.2.24 图表下方的内容，都被认为具有多项式运行时间。具有上界或大 O 值为多项式的运行时间的算法被认为是高效算法，并可能在实践中使用。\n\n![Image](img/image-40.jpeg)\n\
  \n图 1.2.24：多项式运行时间图\n\n### 1.2.8. 指数级运行时间\n\n现在，我们将看到的下一类运行时间是我们认为不高效的运行时间。这些被称为`指数运行时间`。对于这些运行时间，随着\
  \ `n` 的轻微增加，操作数量会呈指数级增长。正如我们马上看到的，这些算法的成本太高，无法使用。指数运行时间是指大 O 值为某个数字 `x` 的 `n` 次方的算法，即\
  \ `O(x^n)`。\n\n![Image](img/image-41.jpeg)\n\n图 1.2.25：指数运行时间图\n\n假设你想打开一个装有密码挂锁的储物柜。假设你忘记了密码。这个锁需要一个两位密码，密码数字范围从\
  \ `0` 到 `9`。你首先将拨盘设为 `00`。在第一个拨盘保持为 `0` 的情况下，你将第二个拨盘更改为 `1` 并尝试打开它。如果不起作用，你将其设置为\
  \ `2`，然后再次尝试。你会一直这样做，如果第二个拨盘设为 `9` 时你仍然没有成功，那么你就回到第一个拨盘，将其设置为 `1` 并重新开始设置第二个拨盘。你必须经过的值范围是\
  \ `00` 到 `99`，共 100 个值。\n\n![Image](img/image-42.jpeg)\n\n图 1.2.26：带有两个位数的数字储物柜\n\
  \n这可以泛化为 `10²`，因为每个拨盘上有 10 个值，且有两个拨盘。逐个搜索每个值直到碰巧找到正确的那个，这种策略被称为`暴力破解`（brute force），而`暴力破解算法具有指数级运行时间`。这里有两个拨盘，所以\
  \ `n = 2`，每个拨盘有 10 个值。因此，我们再次可以将该算法泛化为 `10^n`，其中 `n` 代表拨盘的数量。该算法之所以如此低效，是因为锁上只要多增加一个拨盘，操作数量就会显著增加。如果有三个拨盘，在最坏情况下（即正确密码是范围内的最后一个数字），组合数量为\
  \ `10³` 或 1000 个值。如果再增加一个轮盘，它就变成了 `10⁴` 或 10,000 个值。随着 `n` 的增加，操作数量呈指数级增长，直到达到在现实时间范围内无法解决的程度。\n\
  \n![Image](img/image-43.jpeg)\n\n图 1.2.27：带有三个位数的数字储物柜\n\n现在你可能会想，好吧，任何计算机都可以破解四位数字锁，事实如此，因为这里的\
  \ `n` 足够小。但这就是`我们用于密码的相同原理`。在一个实现良好的典型密码字段中，允许用户使用最多 26 个英语字母、`0` 到 `9` 的数字以及一组大约\
  \ 33 个的特殊字符。因此，`26 + 10 + 33 = 69` 个字符。如图 1.2.28 所示。\n\n![Image](img/image-44.jpeg)\n\
  \n图 1.2.28：可以接受最多 69^n 个字符的网站密码字段\n\n所以，通常这意味着密码中的每个字符可以是 69 个值中的其中一个。这意味着对于一个单字符密码，需要\
  \ 69 的 `n` 次方（`69^n`）操作。所以对于 `n = 1`，我们有 69 次操作。在最坏情况下，为了算出密码，只需将 `n` 增加到 2，猜测密码所需的操作数就会增加到\
  \ `69²` 或 4,761 次。\n\n现在通常在安全网站上并没有真正的限制，但一般来说，密码长度限制在 20 个字符左右。由于每个字符可能有 69 种值，且有\
  \ 20 个字符，在最坏情况下猜测密码需要的操作数是 69 的 20 次方（`69²⁰`），或大约 `6 x 10³⁶` 次操作。一个具有 5 核的 Intel\
  \ CPU 每秒可以执行大约 65,000 亿条指令。这是一个奇特的数字。要在这个非常简单的模型中破解我们的 20 位密码码，这台 Intel CPU 需要 `2\
  \ x 10²⁰` 年来暴力破解密码。\n\n所以，虽然这个算法最终会产生结果，但由于它是如此低效，以至于毫无意义。这就是人们建议你设置更长密码的原因之一，因为暴力破解在最坏情况下是指数级的，你每添加一个字符都会按指数级增加组合数量。\n\
  \n下一类指数算法通过一个著名的问题`旅行商问题`（traveling salesman）得到了很好的说明。该问题陈述如下：给定一组城市以及它们之间的距离，访问每个城市并返回起点的最路径是什么？这看起来是一个简单的问题，但让我们从简单的情况开始，三个城市\
  \ A、B 和 C。为了找出最短路径，我们需要考虑所有的路线。对于三个城市，我们有 6 条路线。\n\n![Image](img/image-45.jpeg)\n\
  \n图 1.2.29：带有城市 A、B、C 的地图\n\n在理论上，这些路线中的是可以舍弃的。例如，`A - B - C` 等于 `C - B - A`，但方向相反。所以我们可以舍弃后三条路线，包括\
  \ `C - A - B` 和 `B - C - A`。但当我们这样做时，通过 B 从 A 到 C 的路线可能不同于通过 B 从 C 到 A，所以保留 6 条路线并从那里确定最短路径。\n\
  \n现在如果我们增加到 4 个城市，组合增加到 24。\n\n![Image](img/image-46.jpeg)\n\n图 1.2.30：计算 A、B、C、D\
  \ 每个城市的最短路径\n\n这种数学关系被称为`阶乘`（factorial），写为 `n` 后加感叹号（`n!`）。阶乘基本上通过以下方式获得：\n\n```\n\
  n! = n(n-1)(n-2)(n-3)…(2)(1)\n```\n\n即 `n` 乘以 `n-1` 乘以 `n-2`，以此此类推，直到达到数字 1。例如，3\
  \ 的阶乘是\n\n```\n3! = 3 x 2 x 1 = 6\n```\n\n这是我们 3 个城市的组合数量。4 的阶乘是\n\n```\n4! = 4\
  \ x 3 x 2 x 1 = 24\n```\n\n这是我们在 4 个城市得到的组合数量。在解决旅行商问题时，最高效的算法将具有`阶乘运行时间`，或者它所被称为`组合``运行时间`。在\
  \ `n` 值较小时，可以使用具有阶乘运行时间的算法。但如果 `n` 值例如是 200（即 `200!`），解决该问题所需的时间将比人类存在的时间还要长！\n\n\
  \n\n为了完整起见，让我们在图上绘制一个组合运行时间图以便进行比较。诸如解决旅行商问题的算法，其最坏情况运行时间为 `O(n!)`。\n\n![Image](img/image-47.jpeg)\n\
  \n图 1.2.31: 组合运行时间图\n\n研究这种指数级运行时间是有用的，原因有二。首先，在研究如何让此类算法更高效时，我们开发的策略是处处通用的，并且可能用于使现有算法更加高效。其次，意识到那些需要很长时间解决的问题是非常重要的。\n\
  \n从一开始就知道某个问题在现实时间内是某种程度上不可解决的，意味着你可以将精力集中在问题的其他方面。然而，作为一名初学者，你将避开这一切，并将精力集中在具有多项式运行时间的算法上，因为我们更有可能处理和学习此类算法。\n\
  \n现在我们已经了解了一些常见的复杂度，在接下来的节中，我们将讨论如何确定一个算法的复杂度，因为其中存在一些细微差别。\n\n### 1.2.9. 如何确定算法的复杂度\n\
  \n在过去的几个章节中，我们查看了研究算法时会遇到的常见复杂度。但问题仍然是，我们如何确定一个算法的最坏情况复杂度？早些时候提到，尽管我们说一个算法具有特定的上界或最坏情况运行时间，但给定算法中的每一步都有不同的运行时间。\n\
  \n让我们回顾二分查找的步骤。同样，假设列表是有排序的，第一步是确定列表的中间位置。通常，这是一个 `constant time operation`（常数时间操作）。许多编程语言都保留了列表大小的信息，因此我们实际上不需要遍历列表来确定大小。现在如果我们没有列表大小信息，就需要逐个计数每个项目直到列表末尾，这是一个\
  \ `linear time operation`（线性时间操作）。在现实中，这是 `O(1)` 或常数时间。\n\n第二步是将中间位置的元素与目标元素进行比较。我们可以假设在大多数现代编程语言中，这也是一个常数时间操作，因为语言文档是这么说的。\n\
  \n第三步是我们的成功情况，算法结束。这是我们的最好情况，到目前为止，我们只经历了两次常数时间操作，所以我们会说`二分查找的最佳情况运行时间是常数时间`，这实际上是真实的。但请记住，最好情况并不是一个有用的指标，除非我们在拆分列表为子列表时没有匹配。\n\
  \n假设在最坏的情况下，算法将不断拆分为子列表，直到达到包含我们要搜索的值的单个元素列表。这一步的运行时间是 `logarithmic`（对数的），因为我们每次都丢弃一半的值。因此，在我们的算法中，我们有几个常数时间的步骤和一个整体上是对数的步骤。\n\
  \n在评估算法的运行时间时，我们说算法的上界与算法中效率最低的步骤的运行时间相同。可以这样想：假设你正在参加三项铁锦赛，这是一项包含游泳、跑步和自行车项目的比赛。你可能是一个非凡的游泳运动员和优秀的自行车手，但你跑步非常糟糕。无论你游泳或骑行有多快，你的总比赛时间受跑步时间的影响最大，因为那是耗时间最长的部分。\n\
  \n如果你花费 1 小时 30 分钟完成跑步，55 分钟游泳，38 分钟骑车，那么你即使将游泳技术精进到 48 分钟完成，将自行车时间缩短到 35 分钟也没用，因为你的上限仍然受限于你的跑步时间，而那几乎是你自行车时间的两倍。\n\
  \n二分查找算法也是如此，无论我们把其他步骤变得多快，在最坏情况下，它们已经是尽可能快的了。将列表拆分为单个元素列表的操作将影响你算法的整体运行时间。这就是为什么我们说算法在最坏情况下的时间复杂度或运行时间是\
  \ `O(log n)` 或对数的。正如我所暗示的，你的算法可能会遇到最好情况运行时间，而在最好情况和最坏情况之间，还有一个平均运行时间。理解这一点很重要，因为算法并不总是会达到其最坏情况的。但这对我们来说变得有点太复杂了。\n\
  \n目前，我们可以安全地忽略平均情况性能，并在未来只关注最坏情况。如果你决定留下来，我们会回来详细讨论这一点。现在你已经了解了算法、复杂度和大 O 表示法，请在下一节中做一些练习题。然后你可以从这些内容中休息一下，在随后的章节中编写代码。\n\
  \n### 1.2.10. 练习题\n\n**Q1**. 我最近开始遵循一个健身计划，其中一个流程如下：我必须完成规定数量的引体向上，每完成一次引体向上，我就必须完成等数量的俯卧。例如，如果我想做\
  \ 10 个引体向上，在每次引体向上后，我做 10 个俯卧撑。你如何泛化此类流程的运行时间？从下方选择正确答案。\n\n1. 平方时间，因为对于任何给定流程完成的练习总数是\
