  \ 用于天气预报研究的量子机器学习\n\nKolla Bhanu Prakash，印度安得拉邦瓦德斯瓦兰 Koneru Lakshmaiah 教育基金会计算机科学与工程系\n\
  \n## 摘要\n\n气候学科学可以通过量子机器学习（QML）方法得到改革。大气科学的建模和预测是天气预报中的一个动态主题，这取决于数学和数据科学。将 QML\
  \ 技术应用于天气预报仍处于起步阶段，我们可以期望这些新方法能够克服经典方法中发现的局限性。天气分析的主要关注点是优化，这可以使用量子计算机解决。为了避免预测误差，我们需要正确建模预测模型中涉及的参数。为了扩展工作以校准新模型和估计参数，可以考虑量子近似优化算法。有时我们需要处理复杂的系统来预测准确的天气条件。我们可以期望通过使用量子模拟更好地理解气候学来改善天气预报。量子支持向量机和量子神经网络在处理用于分析的气候数据的数\
  \ TB 数据方面可以发挥很大作用，这将有助于识别数据中的联系和模式；经典方法失败了。因为大气是混沌的，所以天气预报本质上是不可预测的。为了更好地衡量和控制天气预报中的不确定性，可以应用量子计算，这可能导致更准确的预测。由于天气数据经常敏感且对各种用途至关重要，因此可以使用量子密码学和安全技术来保护天气数据和预报中心之间的通信。\n\
  \n## 关键词\n\n量子计算；量子机器学习；优化；天气；气候\n\n## 5.1 引言\n\n\n\n\n\n量子机器学习（`QML`）可能产生重大影响的一个领域是天气预报。`QML`\
  \ 具有许多可能的應用。(Lin et al., 2024; Boehm & Schumer, 2023) 大气过程的复杂性给传统的天气预报模型带来了困难，而量子计算可能有助于更快地处理复杂的计算。天气预报充满了优化问题，这非常适合量子计算机。通过使用\
  \ `QML` 算法优化复杂大气模型的參數，可以做出更精确的预测 (Giani & Goff-Eldredge, 2022; Kerr, 2007)。天气预报涉及对海量数据集的检查，`QML`\
  \ 方法可能会改善这一点 (Delworth & Knutson, 2000)。在量子计算的参与下，可以更深入地推断天气中的模式 (Cui et al., 2021)。与经典算法相比，量子算法预计在模拟大气科学方面表现更好，这将提高准确性\
  \ (Guo et al., 2022)。不确定性问题可以使用 `QML` 更好地解决，并且使用这些算法的气候研究人员在预测中将获得最佳的置信度 (Ermida\
  \ et al., 2020; Vancutsem, et al., 2010)。量子支持向量机（`QSVM`）和量子神经网络（`QNN`）将是比经典算法更适合准确天气预报的选择\
  \ (Paudel et al., 2022)。量子集成学习也可以是预测天气预报的另一个良好算法 (Paudel et al., 2022; Rice et al.,\
  \ 2021)。`QML` 的潜力正被多个领域的科研人员积极研究，其中包括气象学。\n\n## 5.2 相关工作\n\n量子物理学家和大气科学家目前正在共同工作\
  \ (Andersen, 2021; Moore, 2006)。地球地表温度（`LST`）波动是气候变化的关键标志，影响着自然界和人类社会 (Franklin\
  \ & Chong, 2006)。例如，在生长季节，`LST` 是制定农业决策时考虑的最重要因素之一。在卫星遥感的帮助下，无法在全球范围内持续监测精细分辨率的\
  \ `LST` 变化 (Giani & Eldredge, 2021)。随着过去几年众多算法的发展和完善，利用卫星传感器估计 `LST` 已大大改善 (Paudel\
  \ et al., 2022)。Landsat 任务使用长波红外（`LWIR`）波段提供热数据，时间分辨率为 16 天，空间分辨率为 30 m。另一方面，通过利用两个\
  \ `LWIR` 波段，中等分辨率成像光谱辐射计（`MODIS`）可以更规律地监测全球 `LST` (Crawford et al., 2021)。`MODIS`\
  \ 的 1 公里空间分辨率非常适合在世界范围内监测 `LST` 变化，并且已在多项研究中使用，尽管其分辨率不如 Landsat 精细 (Sebastianelli\
  \ et al., 2022)。在以前的研究中，使用多种粗分辨率 `MODIS` 数据计算了日平均地表温度 (Zaidenberg et al., 2021)。然而，云覆盖会影响测量的准确性。此外，由于它没有考虑时间变化，先前工作中使用的地表温度函数是日温度估计的良好模型，但不是多年或昼夜分析的最佳模型\
  \ (Kulikowski, 2019)。监测短期和长期温度变化以及以高空间分辨率测量大尺度 `LST` 变化的计算挑战 (Gaitan, 2021; Somaroo\
  \ et al., 1999) 也已在一些额外出版物中总结 (`Table 5–1`)。\n\n`Table 5–1`\n\n使用量子计算的潜在益处。\n\n\
  | S. no. || Category || Challenge || Potential benefits |\n| --- | --- | --- | ---\
  \ |\n| 1 || 电网韧性和安全 || 确保发电设施今后可靠且坚固。 || 改进的气候和天气模型可能使基础设施布局更安全，量子优化可能有助于更好地设计新的资源，如风电场。\
  \ |\n| --- | --- | --- | --- |\n| 2 || 天气预报和气候建模 || 随着模拟和预报模型复杂性和分辨率的提高，满足计算需求。\
  \ || 基于流体动力学的模拟分辨率增强能力可能使模型得到改进，从而更全面地理解可能的未来情况，并增强缓解和适应策略的规划。 |\n| 3 || 电网管理 ||\
  \ 安排和分配资源以平衡供需，特别是当发电机的数量和分散程度增加时。 || 通过改善运行条件，量子优化可能有助于成本效益的管理策略并降低消费者成本。 |\n|\
  \ 4 || 量子化学 || 评估各种材料的分子尺度特性和操作，以促进技术创新。 || 量子计算可以通过改进减缓气候变化的方法以及发现和开发新型能源生产和储存技术来加速进程。\
  \ |\n\n\n\n\n\n气候变化正在迅速发生。这主要是由于人类引起的 1.1°C 的全球变暖，带来了许多环境挑战（Kose et al., 2022；Molina\
  \ et al., 2023）。变化的副作用如今正在增加，解决方案需要额外的资金（Didal et al., 2017）。损失和损害源于一些已经严重到无法调整的气候后果。在\
  \ 2025 年之前，全球温室气体（GHG）排放量在与 1.5°C 相一致的路径上达到峰值。作为关键的解决方案方式，需要离开化石燃料（Biamonte et al.,\
  \ 2017）。作为净零的目标，温度升高 1.5°C 似乎是一个近期、最佳的解决方案。迫切需要一些旨在减缓以及适应导向解决方案的气候资金。如果我们不保证公平转型，气候变化的影响——以及我们为适应和防止其而做出的共同努力——将加剧不平等（Lloyd\
  \ et al., 2013）。社会保障体系可以重新设计以纳入适应，从而降低城市和农村社区对各种气候威胁的易感性。当与提供清洁水、卫生条件和医疗保健等基础设施和基本服务获取的举措相结合时，这些行动尤其成功。如果政府、民间社会组织和企业部门合作，提供这些服务可以提高脆弱地区的气候韧性。在这一点上，以生态系统为导向的适应可以帮助应对这些问题（Molina-Perez\
  \ et al., 2020）。\n\n韧性也可以通过获得更好的技术来加强，例如太阳能和风能、更好的动物育种，以及更具韧性的作物种类。科学毋庸置疑。气候变化对地球和人类福祉都构成风险。如果我们现在不采取行动，气候变化的影响可能严重到我们的世界将无法自认。未来几年有一个短暂的机会，为每个人创造一个可持续的、宜居的未来。为了扭转方向，需要快速、积极和协调一致的行动来减少排放、增强韧性、保护生态系统，并大幅扩大适应和损失与损害管理的资金。图\
  \ 5–1 和 5–2 分别代表传统工作站和州气象中心通信。\n\n![Figure 5–1 Weather-to-climate prediction (https://eos.org/science-updates/bridging-the-weather-to-climate-prediction-gap).](img/F000122f05-01-9780443219054.jpg)\n\
  \n图 5–1 从天气到气候预测（[`eos.org/science-updates/bridging-the-weather-to-climate-prediction-gap`](https://eos.org/science-updates/bridging-the-weather-to-climate-prediction-gap)）。\n\
  \n![Figure 5–2 State Met Centers communication (https://www.slideshare.net/csisaproject/5-feb-2011-b-p-yadav-director-imd).](img/F000122f05-02-9780443219054.jpg)\n\
