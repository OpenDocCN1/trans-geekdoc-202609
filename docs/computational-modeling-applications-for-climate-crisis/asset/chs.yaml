  \n## 3.2 讨论与结果\n\n最先进的气候模型表明，随着更温暖的世界到来，暴雨事件将逐渐增加。这一事件清楚地证明了社会对当前极端天气的脆弱性。需要尽早减少温室气体排放，从而在人们和管理系统之间创建和完善紧急预警，并使基础设施“气候适应性”——以减少伤亡和成本，并使其经受住极端突发洪水的灾难（Nijhuis,\
  \ 2021）。全球变暖是无限降雨的主要原因。\n\n### 3.2.1 海平面上升\n\n在一次讨论中，来自 IPCC 的科学家表示，到 2100 年全球海平面将从\
  \ 0.3 到 1 m 上升。同时，随着地球变暖每升高一度，海平面大约上升 2.3 m。海平面随温度升高而上升需要多长时间的问题仍然是研究人员未知（Willis\
  \ et al., 2018）。根据调查，最大温度上升发生在 1910–45 年和 1975 年之后。然而，如果没有采取预防措施减少 CO[2] 排放和其他温室气体。到\
  \ 2100 年，气温将上升 5°C，预计海平面将因全球化的人类财富而上升 48 cm（Enzler, 2021）。\n\n### 3.2.2 手机或基站的辐射\n\
  \n加尔各答贾达普尔大学的研究人员通过从种子阶段开始让近 50 株辣椒植物暴露于手机辐射中进行了实验。Bhaskar 教授表示，与未暴露于辐射的正常植物相比，暴露的叶片发现皱缩且看起来暗淡。这证明了植物受手机辐射影响（Cell\
  \ phone radiation affects plants, vegetables: Research, 2016）。在另一项研究中，来自金奈 Salim\
  \ Ali 鸟类学和自然历史中心的研究人员以及西班牙和比利时的研究声称鸟类死亡是由电磁辐射（EMR）引起的。据旁遮普大学称，EMR 会损害鸟类卵和胚胎（Ram,\
  \ 2008）。研究表明，手机基站和手机手持设备的辐射排放对蜜蜂产生副作用（Santhosh, 2018）。在手机基站附近观察到树木的高水平损害。使用统计分析演示手机基站的\
  \ EMR 对树木有害。结果与手机基站损坏的树木可靠，损坏从一侧开始逐渐扩展到整棵树（Waldmann-Selsam, 2016）。研究人员建议，由于使用某些类型的家用产品化学品、通风不足和电子烟雾辐射，室内空气污染物浓度增加。这得出结论，辐射逐渐减少树木和鸟类的数量。随着树木受影响，周边地区更容易受到二氧化碳污染物和其他运输释放的污染物的影响。这样，间接地，EMF\
  \ 辐射导致社会全球变暖。\n\n### 3.2.3 信息通信技术行业的排放\n\nICT 行业通过其发展的各个行业推动了国家/地区的经济增长。研究人员和分析师估计，到\
  \ 2020 年最多将有 500 亿台设备添加到 ICT；统计结果证明未来五年将有超过 1000 亿台设备。数据中心是地球上最大的能源消费者，其温室气体排放份额很大，超过了许多国家的能源消费水平（Reports\
  \ on the Increasing Energy Consumption of Wireless Systems and Digital Ecosystem,\
  \ 2021）。开发任何 AI 系统都会消耗大量能源。此外，ChatGPT 每年排放 CO[2]（8.4 吨）；通过在 AI R&D 中推广可持续实践（Sophie,\
  \ 2023），可以减少排放。\n\n\n\n\n\n来自加拿大麦克马斯特大学的研究人员指出，ICT（包括计算机、手机和数据中心）的温室气体排放将使全球排放量从\
  \ 1%（2007 年）增加到超过 14%（2040 年）。全球交通运输部门现有的碳足迹减少了一半（Garg et al., 2011）。ICT 行业 CO[2]\
  \ 排放的总体贡献对 CC 具有巨大影响。在一份欧盟报告中，研究人员估计，为将全球气温上升控制在 2°C 以下，到 2020 年碳排放必须减少约 15%–30%（Patel,\
  \ 2018）。然而，由于疫情，PC 的碳排放并未减少反而增加。封锁期间，大多数工作和购物（必需品和杂货）都在网上进行。*下载 300 部 4G 高清电影需要\
  \ 1 kWh 的电；然而，使用 5G，1 kWh 可下载 5K 超高清电影（**Cho, 2020**）*。\n\n### 3.2.4 人工神经网络——排放率计算\n\
