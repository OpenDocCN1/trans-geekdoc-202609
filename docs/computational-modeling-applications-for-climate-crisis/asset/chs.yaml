  \ monthly trends for Nehru Nagar.\n\n## 8.7 空气质量指数的需求\n\nAQI 有助于人们了解当地空气质量如何影响健康。在美国，每年估计有\
  \ 10 万人因空气质量差而过早死亡。在印度，估计每年死亡人数为 67 万人。每当人们呼吸空气污染物时，它们就会进入血液并导致咳嗽和眼睛发痒，加重许多呼吸问题，可能导致癌症和过早死亡。空气污染会导致呼吸系统和心血管系统疾病。因此，AQI\
  \ 有助于评估和比较任何地点的短期和长期疾病。烟雾或雾霾等污染物会降低大气中的能见度。AQI 值在或低于 100 时通常为良好或令人满意（Table 8–9）。Table\
  \ 8–9 表示 2019 年、2020 年、2022 年和 2023 年 4 月 15 日 PM2.5 和相应 AQI 的比较值，适用于三个不同州：AP（维沙卡帕特南）、RJ（沙斯特里纳加尔）和德里（奈赫鲁纳加尔）。从读数中可以观察到，NN\
  \ 中的 PM2.5 和 AQI 正在增加，而 SN 在 2021 年最高，但对于维沙卡帕特南，AQI 和 PM 2.5 值急剧上升。该图（Fig. 8–14）表示值的变化。\n\
