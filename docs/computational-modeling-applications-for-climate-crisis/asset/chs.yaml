  \ *Chaos, Solitons & Fractals*. 2020;140110121.\n\n## 可持续发展目标-13：零碳足迹案例\n\nPrisilla\
  \ Jayanthi Gandam, CMR Institute of Technology, Hyderabad, Telangana, India\n\n\
  ## Abstract\n\n可持续发展目标已在各国启动，以促进健康的氛围并减少全球二氧化碳排放。目标不仅仅是某个个人国家或个人；而是国家层面的关切。零碳足迹涉及来自各个部门的合作，包括工业、医院、住宅建筑和交通。在本研究中，重点是影响气候变化的碳排放，进而扰乱整个生态系统。然而，印度的整体\
  \ SDG 指数得分为 54，安德拉维哈尔的 CO 在 2020 年 2 月至 3 月达到 120 ppm。已实施地理空间技术以适应和减缓气候变化。关键是通过使用清洁和绿色电力来节约能源并减少碳排放。\n\
  \n## Keywords\n\nCarbon; climate change; ecosystem; electromagnetic field; radiation;\
  \ renewable energy; solar power\n\n## 3.1 Introduction\n\n可持续发展目标框架旨在提供社会、环境和经济进步。在\
  \ SDG 中，目标-13 涉及与碳排放相关的气候行动。它要求在生产中消除浪费并增加产量节约。\n\n\n\n\n\n这一流行病年影响了许多人的生活和生计，导致气候危机并影响全球经济损失和社会生活。这是一场未知且意外的流行病，影响了人类生活。尽管交通运输部门的\
  \ CO[2] 排放量显著下降了 6.4%，但在医疗行业的所有废物处置中却发现了巨大的增长。全球宣布了到 2030 年将碳排放减少一半并到 2050 年实现净零碳的紧急决定，目标为\
  \ 1.5°C。巴黎协定中的一项显著声明与可持续发展目标的采纳相辅相成。\n\n科学明确指出，如果一个部门未能实现这些目标，社会的经济就会受到破坏。可持续发展目标及其目标是综合且普遍适用的，考虑到不同的国家现实、能力和发展水平，并尊重国家政策和优先事项。全球层面的雄心是能源部门实现目标。能源的生产和使用是全球温室气体排放的主要来源。在大气中，CO[2]\
  \ 水平和其他温室气体在 2019 年创下新纪录；该年恰好是第二温暖的年份。煤炭是温室气体排放的主要来源，煤炭是人类种族的敌人，污染全球环境。\n\n在 2020\
  \ 年 COVID-19 大流行期间，由于旅行禁令和经济停滞，温室气体排放出现了 6% 的大幅下降。运输排放约占石油需求的 60%，而石油需求的下降在 2020\
  \ 年排放下降中贡献了最大份额（IEA, 2021 [`www.iea.org/data-and-statistics/charts/change-in-co2-emissions-by-fuel-1990-2020`](https://www.iea.org/data-and-statistics/charts/change-in-co2-emissions-by-fuel-1990-2020)）。运输区的大部分能源使用由石油提供，石油会释放有毒空气污染物和温室气体（Guttikunda\
  \ & Jawahar, 2012）。医疗保健是最大的污染行业之一，约占全球温室气体总量的 5%（Sherman, 2021；Jayanthi & Muralikrishna,\
  \ 2023）。电动汽车的使用将消除到 2030 年的 CO[2] 排放，并在连接主要城市的智能道路上建立自动烟雾探测器/传感器。COVID-19 并未暂停气候变化（CC），但当大流行消失时，预计排放将恢复到极端水平（[`www.un.org/sustainabledevelopment/climate-change/`](https://www.un.org/sustainabledevelopment/climate-change/)）。\n\
