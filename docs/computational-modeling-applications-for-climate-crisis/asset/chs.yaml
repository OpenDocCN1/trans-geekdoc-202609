  \ close=\"|\" open=\"|\"><mml:mrow><mml:msub><mml:mrow><mml:mi>y</mml:mi></mml:mrow><mml:mrow><mml:mi\
  \ mathvariant=\"normal\">actual</mml:mi></mml:mrow></mml:msub><mml:mo>&#8722;</mml:mo><mml:msub><mml:mrow><mml:mi>y</mml:mi></mml:mrow><mml:mrow><mml:mi\
  \ mathvariant=\"normal\">predicted</mml:mi></mml:mrow></mml:msub></mml:mrow></mml:mfenced></mml:mrow></mml:math>\
  \ (9–5)\n\n![Equation](img/F000080si12.png)(9–5)\n\n${MAPE} = \\\\frac{1}{N}\\\\\
  sum\\\\limits\\_{i = 1}^{N}\\\\left| \\\\frac{y\\_{actual} - y\\_{predicted}}{y\\\
  _{actual}} \\\\right|$<mml:math><mml:mi mathvariant=\"normal\">MAPE</mml:mi><mml:mo>=</mml:mo><mml:mfrac><mml:mrow><mml:mn>1</mml:mn></mml:mrow><mml:mrow><mml:mi>N</mml:mi></mml:mrow></mml:mfrac><mml:munderover><mml:mo>&#8721;</mml:mo><mml:mrow><mml:mi>i</mml:mi><mml:mo>=</mml:mo><mml:mn>1</mml:mn></mml:mrow><mml:mrow><mml:mi>N</mml:mi></mml:mrow></mml:munderover><mml:mrow><mml:mfenced\
  \ close=\"|\" open=\"|\"><mml:mrow><mml:mfrac><mml:mrow><mml:msub><mml:mrow><mml:mi>y</mml:mi></mml:mrow><mml:mrow><mml:mi\
  \ mathvariant=\"normal\">actual</mml:mi></mml:mrow></mml:msub><mml:mo>&#8722;</mml:mo><mml:msub><mml:mrow><mml:mi>y</mml:mi></mml:mrow><mml:mrow><mml:mi\
  \ mathvariant=\"normal\">predicted</mml:mi></mml:mrow></mml:msub></mml:mrow><mml:mrow><mml:msub><mml:mrow><mml:mi>y</mml:mi></mml:mrow><mml:mrow><mml:mi\
  \ mathvariant=\"normal\">actual</mml:mi></mml:mrow></mml:msub></mml:mrow></mml:mfrac></mml:mrow></mml:mfenced></mml:mrow></mml:math>\
  \ (9–6)\n\n![Equation](img/F000080si13.png)(9–6)\n\n$R^{2} = 1 - \\\\frac{\\\\sum\\\
  \\limits\\_{i = 1}^{N}\\\\left( {y\\_{actual} - y\\_{predicted}} \\\\right)^{2}}{\\\
  \\sum\\\\limits\\_{i = 1}^{N}\\\\left( {y\\_{mean} - y\\_{actual}} \\\\right)^{2}},$<mml:math><mml:msup><mml:mrow><mml:mi>R</mml:mi></mml:mrow><mml:mrow><mml:mn>2</mml:mn></mml:mrow></mml:msup><mml:mo>=</mml:mo><mml:mn>1</mml:mn><mml:mo>&#8722;</mml:mo><mml:mfrac><mml:mrow><mml:munderover><mml:mo>&#8721;</mml:mo><mml:mrow><mml:mi>i</mml:mi><mml:mo>=</mml:mo><mml:mn>1</mml:mn></mml:mrow><mml:mrow><mml:mi>N</mml:mi></mml:mrow></mml:munderover><mml:mrow><mml:msup><mml:mrow><mml:mfenced\
  \ close=\")\" open=\"(\"><mml:mrow><mml:msub><mml:mrow><mml:mi>y</mml:mi></mml:mrow><mml:mrow><mml:mi\
  \ mathvariant=\"normal\">actual</mml:mi></mml:mrow></mml:msub><mml:mo>&#8722;</mml:mo><mml:msub><mml:mrow><mml:mi>y</mml:mi></mml:mrow><mml:mrow><mml:mi\
  \ mathvariant=\"normal\">predicted</mml:mi></mml:mrow></mml:msub></mml:mrow></mml:mfenced></mml:mrow><mml:mrow><mml:mn>2</mml:mn></mml:mrow></mml:msup></mml:mrow></mml:mrow><mml:mrow><mml:munderover><mml:mo>&#8721;</mml:mo><mml:mrow><mml:mi>i</mml:mi><mml:mo>=</mml:mo><mml:mn>1</mml:mn></mml:mrow><mml:mrow><mml:mi>N</mml:mi></mml:mrow></mml:munderover><mml:mrow><mml:msup><mml:mrow><mml:mfenced\
  \ close=\")\" open=\"(\"><mml:mrow><mml:msub><mml:mrow><mml:mi>y</mml:mi></mml:mrow><mml:mrow><mml:mi\
  \ mathvariant=\"normal\">mean</mml:mi></mml:mrow></mml:msub><mml:mo>&#8722;</mml:mo><mml:msub><mml:mrow><mml:mi>y</mml:mi></mml:mrow><mml:mrow><mml:mi\
  \ mathvariant=\"normal\">actual</mml:mi></mml:mrow></mml:msub></mml:mrow></mml:mfenced></mml:mrow><mml:mrow><mml:mn>2</mml:mn></mml:mrow></mml:msup></mml:mrow></mml:mrow></mml:mfrac><mml:mo>,</mml:mo></mml:math>\
  \ (9–7)\n\n![Equation](img/F000080si14.png)(9–7)\n\n其中 *y*[*p**r**e**d**i**c**t**e**d*]<mml:math><mml:msub><mml:mrow><mml:mi>y</mml:mi></mml:mrow><mml:mrow><mml:mi\
  \ mathvariant=\"normal\">predicted</mml:mi></mml:mrow></mml:msub></mml:math>![Equation](img/F000080si15.png)\
  \ 表示 `ANN` 模型的输出，*y*[*a**c**t**u**a**l*]<mml:math><mml:msub><mml:mrow><mml:mi>y</mml:mi></mml:mrow><mml:mrow><mml:mi\
  \ mathvariant=\"normal\">actual</mml:mi></mml:mrow></mml:msub></mml:math>![Equation](img/F000080si16.png)\
  \ 是数值模拟的结果，*N*<mml:math><mml:mi>N</mml:mi></mml:math>![Equation](img/F000080si17.png)\
  \ 是数据的总量，而 *y*[*m**e**a**n*]<mml:math><mml:msub><mml:mrow><mml:mi>y</mml:mi></mml:mrow><mml:mrow><mml:mi\
  \ mathvariant=\"normal\">mean</mml:mi></mml:mrow></mml:msub></mml:math>![Equation](img/F000080si18.png)\
  \ 是所有数据点数值模拟结果的均值。\n\n## 9.2.5 优化器数学方程：Adam、SGD、Adamax、Adagrad、Adadelta、RMSProp\
  \ 和 Nadam\n\n在本章中，使用以下方程来更好地理解优化器的特性：\n\n#### 9.2.5.1 Adagrad\n\n$\\\\theta\\_{t\
  \ + 1} = \\\\theta\\_{t} - \\\\frac{\\\\eta}{\\\\sqrt{G\\_{t} + \\\\epsilon}}g\\\
  _{t},$<mml:math><mml:msub><mml:mrow><mml:mi>&#952;</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>+</mml:mo><mml:mn>1</mml:mn></mml:mrow></mml:msub><mml:mo>=</mml:mo><mml:msub><mml:mrow><mml:mi>&#952;</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>&#8722;</mml:mo><mml:mfrac><mml:mrow><mml:mi>&#951;</mml:mi></mml:mrow><mml:mrow><mml:msqrt><mml:mrow><mml:msub><mml:mrow><mml:mi>G</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>+</mml:mo><mml:mi>&#1013;</mml:mi></mml:mrow></mml:msqrt></mml:mrow></mml:mfrac><mml:msub><mml:mrow><mml:mi>g</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>,</mml:mo></mml:math>\
  \ (9–8)\n\n![Equation](img/F000080si19.png)(9–8)\n\n\n\n\n\n其中 `θ[t]`![Equation](img/F000080si20.png)\
  \ 是第 `t`![Equation](img/F000080si21.png) 代的节点权重，`η`![Equation](img/F000080si22.png)\
  \ 是学习率，`g[t]`![Equation](img/F000080si23.png) 是当前世代的梯度向量，`G[t]`![Equation](img/F000080si24.png)\
  \ 是包含所有先前梯度平方的对角矩阵，而 `ϵ`![Equation](img/F000080si25.png) 是一个提供数值稳定性的很小项。\n\n####\
  \ 9.2.5.2 Adamax\n\n$\\\\left. \\\\begin{matrix} {m\\_{t} = \\\\beta\\_{1}m\\_{t\
  \ - 1} + \\\\left( {1 - \\\\beta\\_{1}} \\\\right)g\\_{t}} \\\\\\\\ \\\\quad \\\\\
  \\\\ {v\\_{t} = \\\\beta\\_{1}v\\_{t - 1} + \\\\left( {1 - \\\\beta\\_{2}} \\\\\
  right){g\\_{t}}^{2}} \\\\\\\\ \\\\end{matrix} \\\\right\\\\},$<mml:math><mml:mrow><mml:mfenced\
  \ close=\"}\" open=\"\"><mml:mrow><mml:mtable><mml:mtr><mml:mtd><mml:msub><mml:mrow><mml:mi>m</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>=</mml:mo><mml:msub><mml:mrow><mml:mi>&#946;</mml:mi></mml:mrow><mml:mrow><mml:mn>1</mml:mn></mml:mrow></mml:msub><mml:msub><mml:mrow><mml:mi>m</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mn>1</mml:mn></mml:mrow></mml:msub><mml:mo>+</mml:mo><mml:mrow><mml:mfenced\
  \ close=\")\" open=\"(\"><mml:mrow><mml:mn>1</mml:mn><mml:mo>&#8722;</mml:mo><mml:msub><mml:mrow><mml:mi>&#946;</mml:mi></mml:mrow><mml:mrow><mml:mn>1</mml:mn></mml:mrow></mml:msub></mml:mrow></mml:mfenced></mml:mrow><mml:msub><mml:mrow><mml:mi>g</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub></mml:mtd></mml:mtr><mml:mtr><mml:mtd><mml:mspace\
  \ width=\"1em\"/></mml:mtd></mml:mtr><mml:mtr><mml:mtd><mml:msub><mml:mrow><mml:mi>v</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>=</mml:mo><mml:msub><mml:mrow><mml:mi>&#946;</mml:mi></mml:mrow><mml:mrow><mml:mn>1</mml:mn></mml:mrow></mml:msub><mml:msub><mml:mrow><mml:mi>v</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mn>1</mml:mn></mml:mrow></mml:msub><mml:mo>+</mml:mo><mml:mrow><mml:mfenced\
  \ close=\")\" open=\"(\"><mml:mrow><mml:mn>1</mml:mn><mml:mo>&#8722;</mml:mo><mml:msub><mml:mrow><mml:mi>&#946;</mml:mi></mml:mrow><mml:mrow><mml:mn>2</mml:mn></mml:mrow></mml:msub></mml:mrow></mml:mfenced></mml:mrow><mml:msup><mml:mrow><mml:msub><mml:mrow><mml:mi>g</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub></mml:mrow><mml:mrow><mml:mn>2</mml:mn></mml:mrow></mml:msup></mml:mtd></mml:mtr></mml:mtable></mml:mrow></mml:mfenced></mml:mrow><mml:mo>,</mml:mo></mml:math>\
  \ (9–9)\n\n![Equation](img/F000080si26.png)(9–9)\n\n其中 `m[t]`![Equation](img/F000080si27.png)\
  \ 是过去梯度的指数衰减平均值，`β1`![Equation](img/F000080si28.png) 是衰减率，`v[t]`![Equation](img/F000080si29.png)\
  \ 是过去梯度平方的指数衰减平均值，而 `β2`![Equation](img/F000080si30.png) 是衰减率。\n\n#### 9.2.5.3 Adam\n\
  \n`v[t] = max(β[2]v[t − 1],|g[t]|)`<mml:math><mml:msub><mml:mrow><mml:mi>v</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>=</mml:mo><mml:mi>max</mml:mi><mml:mrow><mml:mfenced\
  \ close=\")\" open=\"(\"><mml:mrow><mml:msub><mml:mrow><mml:mi>&#946;</mml:mi></mml:mrow><mml:mrow><mml:mn>2</mml:mn></mml:mrow></mml:msub><mml:msub><mml:mrow><mml:mi>v</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mn>1</mml:mn></mml:mrow></mml:msub><mml:mo>,</mml:mo><mml:mrow><mml:mfenced\
  \ close=\"|\" open=\"|\"><mml:mrow><mml:msub><mml:mrow><mml:mi>g</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub></mml:mrow></mml:mfenced></mml:mrow></mml:mrow></mml:mfenced></mml:mrow></mml:math>\
  \ (9–10)\n\n![Equation](img/F000080si31.png)(9–10)\n\n#### 9.2.5.4 SGD\n\n以下方程用于生成噪声更少的新的数据序列：\n\
  \n`v[t] = βv[t − 1] + (1−β)s[t]`,<mml:math><mml:msub><mml:mrow><mml:mi>v</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>=</mml:mo><mml:mi>&#946;</mml:mi><mml:msub><mml:mrow><mml:mi>v</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mn>1</mml:mn></mml:mrow></mml:msub><mml:mo>+</mml:mo><mml:mrow><mml:mfenced\
  \ close=\")\" open=\"(\"><mml:mrow><mml:mn>1</mml:mn><mml:mo>&#8722;</mml:mo><mml:mi>&#946;</mml:mi></mml:mrow></mml:mfenced></mml:mrow><mml:msub><mml:mrow><mml:mi>s</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>,</mml:mo></mml:math>\n\
  \n![Equation](img/F000080si32.png)\n\n其中 `s[t]`![Equation](img/F000080si33.png)\
  \ 是在时间 `t`![Equation](img/F000080si34.png) 生成的噪声数据。\n\n以下方程用于在 SGD 中更新权重 (`w`)![Equation](img/F000080si35.png)\
  \ 和偏置 (`b`)![Equation](img/F000080si36.png)：\n\n\n\n\n\n$\\\\left. \\\\begin{matrix}\
  \ {w\\_{t} = w\\_{t - 1} - \\\\eta\\\\frac{\\\\partial L}{\\\\partial w\\_{t - 1}}}\
  \ \\\\\\\\ \\\\quad \\\\\\\\ {b\\_{t} = b\\_{t - 1} - \\\\eta\\\\frac{\\\\partial\
  \ L}{\\\\partial b\\_{t - 1}}} \\\\\\\\ \\\\end{matrix} \\\\right\\\\},$<mml:math><mml:mrow><mml:mfenced\
  \ close=\"}\" open=\"\"><mml:mrow><mml:mtable><mml:mtr><mml:mtd><mml:msub><mml:mrow><mml:mi>w</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>=</mml:mo><mml:msub><mml:mrow><mml:mi>w</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mn>1</mml:mn></mml:mrow></mml:msub><mml:mo>&#8722;</mml:mo><mml:mi>&#951;</mml:mi><mml:mfrac><mml:mrow><mml:mo>&#8706;</mml:mo><mml:mi>L</mml:mi></mml:mrow><mml:mrow><mml:mo>&#8706;</mml:mo><mml:msub><mml:mrow><mml:mi>w</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mn>1</mml:mn></mml:mrow></mml:msub></mml:mrow></mml:mfrac></mml:mtd></mml:mtr><mml:mtr><mml:mtd><mml:mspace\
  \ width=\"1em\"/></mml:mtd></mml:mtr><mml:mtr><mml:mtd><mml:msub><mml:mrow><mml:mi>b</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>=</mml:mo><mml:msub><mml:mrow><mml:mi>b</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mn>1</mml:mn></mml:mrow></mml:msub><mml:mo>&#8722;</mml:mo><mml:mi>&#951;</mml:mi><mml:mfrac><mml:mrow><mml:mo>&#8706;</mml:mo><mml:mi>L</mml:mi></mml:mrow><mml:mrow><mml:mo>&#8706;</mml:mo><mml:msub><mml:mrow><mml:mi>b</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mn>1</mml:mn></mml:mrow></mml:msub></mml:mrow></mml:mfrac></mml:mtd></mml:mtr></mml:mtable></mml:mrow></mml:mfenced></mml:mrow><mml:mo>,</mml:mo></mml:math>\
  \ (9–11)\n\n![Equation](img/F000080si37.png)(9–11)\n\n其中 $\\\\frac{\\\\partial L}{\\\
  \\partial w}$<mml:math><mml:mfrac><mml:mrow><mml:mo>&#8706;</mml:mo><mml:mi>L</mml:mi></mml:mrow><mml:mrow><mml:mo>&#8706;</mml:mo><mml:mi>w</mml:mi></mml:mrow></mml:mfrac></mml:math>![Equation](img/F000080si38.png)\
  \ 是损失对权重的导数，而 $\\\\frac{\\\\partial L}{\\\\partial b}$<mml:math><mml:mfrac><mml:mrow><mml:mo>&#8706;</mml:mo><mml:mi>L</mml:mi></mml:mrow><mml:mrow><mml:mo>&#8706;</mml:mo><mml:mi>b</mml:mi></mml:mrow></mml:mfrac></mml:math>![Equation](img/F000080si39.png)\
  \ 是损失对偏置的导数。\n\n#### 9.2.5.5 Adadelta\n\n$w\\_{t} = w\\_{t - 1} - \\\\eta\\_{t}^{\\\
  \\prime}\\\\frac{\\\\partial L}{\\\\partial w\\_{t - 1}}{with}\\\\eta\\_{t}^{\\\\\
  prime} = \\\\frac{\\\\eta}{\\\\sqrt{g\\_{t} + \\\\varepsilon}},$<mml:math><mml:msub><mml:mrow><mml:mi>w</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>=</mml:mo><mml:msub><mml:mrow><mml:mi>w</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mn>1</mml:mn></mml:mrow></mml:msub><mml:mo>&#8722;</mml:mo><mml:msubsup><mml:mrow><mml:mi>&#951;</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow><mml:mrow><mml:mo>&#8242;</mml:mo></mml:mrow></mml:msubsup><mml:mfrac><mml:mrow><mml:mi>&#8706;</mml:mi><mml:mi>L</mml:mi></mml:mrow><mml:mrow><mml:mi>&#8706;</mml:mo><mml:msub><mml:mrow><mml:mi>w</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mn>1</mml:mn></mml:mrow></mml:msub></mml:mrow></mml:mfrac><mml:mspace\
  \ width=\".25em\"/><mml:mi mathvariant=\"normal\">with</mml:mi><mml:mspace width=\"\
  .25em\"/><mml:msubsup><mml:mrow><mml:mi>&#951;</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow><mml:mrow><mml:mo>&#8242;</mml:mo></mml:mrow></mml:msubsup><mml:mo>=</mml:mo><mml:mfrac><mml:mi>&#951;</mml:mi><mml:mrow><mml:msqrt><mml:mrow><mml:msub><mml:mrow><mml:mi>g</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>+</mml:mo><mml:mi>&#949;</mml:mi></mml:mrow></mml:msqrt></mml:mrow></mml:mfrac><mml:mo>,</mml:mo></mml:math>\
