  \n4\n\n## Evaluating computational time series methods for monthly rainfall forecasting\
  \ in the wettest region of Türkiye: a case study of Rize province\n\nİsmail Kırbaş^(1),\
  \ Osman Tayfun Bişkin^(2) and Ahmet Çifci^(2),    ¹Department of Computer Engineering,\
  \ Faculty of Engineering and Architecture, Burdur Mehmet Akif Ersoy University,\
  \ Burdur, Turkey,    ²Department of Electrical-Electronics Engineering, Faculty\
  \ of Engineering and Architecture, Burdur Mehmet Akif Ersoy University, Burdur,\
  \ Turkey\n\n## Abstract\n\n准确的降雨预测对于有效的水资源管理和减轻气候变化影响至关重要。本章评估了三种计算时间序列方法——自回归积分滑动平均模型\
  \ (`ARIMA`)、Prophet 和长短期记忆 (`LSTM`) 网络——在土耳其里泽省月降水预测中的预测能力。里泽省因其地形多样性和易发生山洪暴发，被认为是土耳其最湿润的地区，因此被选为研究区域。利用\
  \ 2004 年至 2023 年的气象数据来开发模型并比较其预测性能。为解决降雨时间序列的非平稳性，在建模前对数据进行预处理，应用了窗口为 3 个月和 5 个月的移动平均滤波器。\n\
  \n\n\n\n\n`ARIMA`、`Prophet` 和 `LSTM` 模型均在 2004 年至 2021 年的过滤历史数据上进行训练，并将它们的短期预测与\
  \ 2022 年至 2023 年的实际观测值进行评估。当采用具有更大滤波窗口的平滑输入数据集时，预测准确性表现出逐步提升。`ARIMA` 和 `LSTM` 模型在捕捉时间趋势和周期性变化以生成稳健的月度预测方面表现出强大的能力。将更长期的移动平均引入建模过程增强了平稳性并降低了噪声，使算法能够更精确地推断降雨模式以及与过去事件的关系。该研究证明了计算时间序列模型在里泽降水预测中的可行性，并验证了简单预处理技术在优化非平稳气候数据以用于建模应用方面的价值。\n\
  \n## Keywords\n\n计算分析；降雨预测；Rize；`ARIMA`；`Prophet`；`LSTM`\n\n## 4.1 Introduction\n\
  \n降雨是地球水文循环的重要要素，对环境和生命的维持具有实质性影响（Hou et al., 2014；Ravi et al., 2022；Rodrigo-Comino,\
  \ 2021）。温度、湿度、大气压和风模式只是影响这一复杂气象现象的变量中的几个。对降雨进行准确评估和研究对于理解当地气候趋势、有效管理水资源、优化农业实践和维持生态系统至关重要（Barua\
  \ et al., 2013；Berhane et al., 2020；Sidle & Bogaard, 2016）。降雨通常以毫米（`mm`）或英寸（`inch`）为单位在特定时间范围内量化，通常按日、月或年为基准（Miftahuddin\
  \ et al., 2020）。降雨空间分布的显著变异是地形因素如山地地形、海域邻近性和盛行大气环流模式的结果。这种多样性导致了从干旱沙漠到丰饶雨林的广泛气候带。研究降雨模式涉及统计分析、建模和预测方法的使用。科学家使用各种设备，包括雨量计、天气雷达和卫星图像，来观察和量化不同地理和时间维度上的降雨（de\
  \ Oliveira Simoyama et al., 2023；Guzzetti et al., 2020；Han et al., 2023）。上述数据对于理解长期模式、极端天气事件以及气候变化对降雨模式的影响至关重要。降雨不仅对环境产生重大影响，而且具有严重的社会经济后果。充足的降雨对农业至关重要，因为它为作物生长和粮食生产提供所需的水分。另一方面，降雨过多或不足可能导致洪水、干旱和水资源短缺，从而影响人类、经济和生态系统。\n\
  土耳其的地理位置和多样化的地形造就了该国丰富的气候多样性，其特征为七个不同的气候带。每个区域都表现出独特的降雨模式，形成了气候条件的马赛克。这种多样性是海拔、水体邻近性和区域地形等因素的结果。地形和海洋影响成为塑造土耳其降雨的关键因素。山地地形、沿海邻近性和盛行风模式之间的相互作用导致不同地区观察到的复杂降水模式。沿海地区可能由于海洋影响而经历更高的湿度和降雨机会增加，而内陆地区可能更容易受到干旱条件的影响。东部黑海盆地是土耳其降雨最丰富的地区，降雨量最高（Akçay\
  \ et al., 2022；Şimşek et al., 2023）。黑海的邻近性和地形抬升效应——湿润空气在山地地形上抬升——导致该地区降水丰富。另一方面，土耳其中部和南部地区通常经历降雨不足，尤其是在夏季（Albayrak\
  \ et al., 2022；Sen et al., 2012）。这些区域差异对农业、水资源和整体环境可持续性具有影响。降雨的季节性分布是土耳其气候的另一个关键方面。虽然冬季月份通常带来增加的降水，尤其是在受地中海和黑海气候影响的沿海地区，但夏季月份通常以干燥条件为标志。这种季节性对农业实践有直接影响，因为水的可用性显著影响作物生长和产量。近年来，土耳其观察到极端降雨事件的变化，短时到长时的降雨强度增加。这一趋势与气候变化的更广泛影响有关（Danandeh\
  \ Mehr & Kahya, 2017；Nigussie & Altunkaynak, 2019；Yilmaz, 2015）。大气变暖导致更强烈的对流降雨事件，可能导致诸如山洪和土壤侵蚀等问题。了解土耳其的这些变化对于有效的水资源管理和减轻气候变化的后果至关重要。\n\
  \n## 4.2 Literature review\n\n\n\n\n\n准确的降雨量测量和预测对于广泛的行业以及应对气候变化和变异带来的挑战至关重要。降雨预测是一项具有挑战性的任务，因为全球降雨模式不规则且气候变化多端。不同的模型和算法通过分析历史气象数据来预测降雨，旨在预测降雨的发生和降雨量。\n\
  \nShi et al. (2015) 通过引入卷积长短期记忆 (`LSTM`) (`ConvLSTM`) 网络，提出了一种创新的降水临近预报方法。该方法解决了基于过去雷达观测预测未来降水的挑战。`ConvLSTM`\
  \ 网络利用了卷积神经网络进行空间特征提取的优势以及 `LSTM` 捕捉时间依赖性的能力。通过对真实雷达数据的实验，作者证明了其提出的方法在降水临近预报方面优于传统方法。`ConvLSTM`\
  \ 网络表现出更高的准确性，并且能够捕捉数据中复杂的时空模式。\n\nKim et al. (2017) 开发了 `DeepRain` 模型，采用深度学习技术利用多通道雷达数据进行降水预测。该模型基于\
  \ `ConvLSTM` 网络，通过捕捉空间和时间依赖性高效处理雷达数据。通过对真实雷达数据的实验，作者证明了 `DeepRain` 在降水预测方面优于传统方法。\n\
  \nHu et al. (2018) 探索了人工神经网络 (`ANN`s) 和 `LSTM` 网络在基于 1971 年至 2013 年汾河流域洪水事件模拟降雨径流过程方面的应用。研究结果表明，`LSTM`\
  \ 模型在降雨径流模拟中优于概念性和物理性模型。\n\nAkbari Asanjan et al. (2018) 重点研究利用基于人工神经网络的遥感降水估算 (`PERSIANN`)\
  \ 结合 `LSTM` 循环神经网络。通过整合这两种方法，该研究旨在提高短期降水预报的准确性和可靠性。研究得出结论，所提出的框架对降水的预测是准确的，特别是对于具有复杂和演变动态的对流系统。\n\
  \nGao et al. (2020) 比较了 `LSTM`、门控循环单元 (`GRU`) 和传统 `ANN` 模型，证明在时间步长优化时，`LSTM` 和 `GRU`\
  \ 模型优于 `ANN`。结果表明，`LSTM` 和 `GRU` 模型可以在不牺牲预测精度的情况下处理更大的时间步长，其中 `GRU` 模型因其结构更简单且在短期径流预测中效率更高而脱颖而出。\n\
  \nNi et al. (2020) 基于 `LSTM` 开发了两种混合模型，即小波-`LSTM` (`WLSTM`) 和卷积 `LSTM` (`CLSTM`)，用于月度径流和降雨预测。模型与多层感知器和\
  \ `LSTM` 进行了比较。结果显示，`WLSTM` 和 `CLSTM` 是预测时间序列的更好选择。\n\nSulasikin et al. (2021) 研究了三种不同时间序列模型的使用：季节性自回归综合移动平均、Facebook\
  \ `Prophet` 和 `LSTM`，以预测雅加达中部用于洪水缓解的月降雨量。研究结果表明，Facebook `Prophet` 的均方误差 (`MSE`)\
  \ 和均方根误差 (`RMSE`) 最低，使其成为预测雅加达中部月降雨量的最合适模型。\n\nRhaiem et al. (2021) 提出了开发一种创新的提取、转换和加载工具，用于处理突尼斯农业国家观测站的降雨数据，并将其集成到大数据平台中。他们还采用了\
  \ Voronoi 空间分析和来自 OpenStreetMap 的志愿者地理信息数据来估计新空间单元的降雨量。此外，该研究评估了自回归综合移动平均 (`ARIMA`)、`ANN`\
  \ 和 `LSTM` 在时间序列预测中的有效性。结果显示 `LSTM` 表现出更优的预测精度。\n\nAnul Haq (2022) 开发并优化了一种名为气候深度\
  \ `LSTM` (`CDLSTM`) 的新颖深度学习模型，用于预测印度喜马拉雅邦的温度和降雨值。此外，`CDLSTM` 模型的性能通过采用 Facebook\
  \ `Prophet` 模型进行评估，从而增强了其预测能力。研究确定了喜马拉雅地区温度和降雨变化之间存在稳健的相关性。因此，`CDLSTM` 成为气候变化预测的有前景的方法，特别是在喜马拉雅等对气候影响具有重要意义和脆弱性的地区。\n\
  \nChen et al. (2022) 引入了一种新颖的基于深度学习的 `LSTM` 模型，用于预测月降雨数据。该模型的有效性通过与随机森林 (`RF`) 数据驱动模型进行比较分析来评估，使用了土耳其里泽和孔亚气象站\
  \ 41 年的月降雨数据。采用了最佳窗口大小以确定降雨时间序列最合适的滞后时间。`LSTM` 模型在两个气象站的降雨预测中均表现出优于 `RF` 模型的性能。\n\
  \nAllawi et al. (2023) 提出了一种通过将优化算法与 `ANN` 集成来检测降雨模式非线性的方法，具体采用人工蜂群、粒子群优化和帝国竞争算法。该研究在马来西亚进行了真实案例研究，使用了\
  \ 54 年的月降雨数据，得出了用于实时降雨预测的 `ANN` 模型。统计分析显示，帝国竞争算法与 `ANN` 模型优于其他模型，证明其作为预测月降雨量的高精度工具的潜力。\n\
  \n与之前的研究相比，本章的主要贡献如下：\n\n*   • 该研究应用并比较了三种时间序列预测模型——`ARIMA`、`Prophet` 和 `LSTM`——来预测土耳其里泽省的月降雨量。\n\
  *   • 系统分析了使用不同大小移动平均滤波器预处理输入数据的影响。结果表明，滤波可以通过降低噪声和增强平稳性来改善模型性能。\n*   • 通过对原始和滤波时间序列的详细分解，促进了趋势、季节性和残差成分的可视化。这有助于诊断在捕捉不同信号方面的优势和弱点。\n\
  *   • 通过全面展示评估指标，包括预测图和损失曲线，实现了模型拟合和预测技能的透明验证。\n\n## 4.3 研究区域和所用数据的概述\n\n\n\n\n\n\
  ## 里泽省概况\n\n里泽位于大约北纬 40°20′ 至 41°20′、东经 40°22′ 至 41°28′ 之间。其北面濒临黑海，南面与埃尔祖鲁姆省接壤，西面与特拉布宗省接壤，东面与阿尔特温省接壤（如\
  \ 图 4–1 所示）。里泽的总地理面积约为 3920 平方公里。从地形上看，土耳其东北部的里泽省呈现出对比鲜明的景观。在西部地区，有郁郁葱葱的绿色山丘覆盖着茶园。黑海的侵蚀性洋流侵蚀了东部广大高原崎岖的地形，形成了峡谷。截至\
  \ 2023 年，里泽的估计人口约为 344,000 人。里泽省境内有几条重要的河流和溪流。费尔蒂纳河因其湍急的急流和强劲的水流而被公认为最重要的一条河流，因其湍急的水流而获得了“暴风雨之水”的昵称。该河发源于卡奇卡尔山脉，流经\
  \ 68 公里后注入黑海。与费尔蒂纳河平行流淌的赫姆辛河较短。它流经赫姆辛和帕扎尔区，并注入黑海。\n\n![Figure 4–1 Geographic location\
  \ of the Rize province. Map lines delineate study areas and do not necessarily depict\
  \ accepted national boundaries.](img/F000031f04-01-9780443219054.jpg)\n\nFigure\
  \ 4–1 Geographic location of the Rize province. Map lines delineate study areas\
  \ and do not necessarily depict accepted national boundaries.\n\n## 气候\n\n里泽是土耳其降雨量最多的城市之一，年降雨量超过\
  \ 2300 毫米，年平均降雨天数接近 173 天。里泽由于靠近黑海，气候温和潮湿。沿海地区全年平均气温约为 14.5°C（MGM, 2023）。然而，里泽内陆山区气温更低。黑海的影响使里泽气候潮湿，全年降雨频繁。2010\
  \ 年 8 月 26 日，该地区经历了一场强降雨，24 小时内降雨总量达 166.5 毫米。这场强降雨导致了巨大的破坏，包括众多挡土墙的倒塌。这场洪水造成了严重破坏，对其路径上的汽车和公寓造成了严重损害（Şen\
  \ & Kahya, 2017）。\n\n## 数据集\n\n本章使用的数据集来自水文气象与遥感中心（CHRS），通过其数据门户 [`chrsdata.eng.uci.edu/`](https://chrsdata.eng.uci.edu/)\
