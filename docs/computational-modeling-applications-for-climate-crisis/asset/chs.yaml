  Additionally, feature importance was calculated to understand the effect of input\
  \ parameters on the CatBoost model (Fig. 12–4). Examining Fig. 12–4, it was figured\
  \ out that the SPI values of the Isparta meteorological station have the highest\
  \ effect on the water level estimation of Lake Eğirdir, while the SPI values of\
  \ the Uluborlu station have the lowest effect.\n\n![Figure 12–4 Feature importance\
  \ chart for CatBoost model.](img/F000055f12-04-9780443219054.jpg)\n\nFigure 12–4\
  \ Feature importance chart for CatBoost model.\n\nThen, forecasting for the next\
  \ 10 years were made with LSTM using the SPI values of Eğirdir, Senirkent, Uluborlu,\
  \ Yalvaç, and Isparta meteorological stations. For this, 80% (409 months of data)\
  \ of the SPI values between 1976 and 2019 (517 months of data) were used to train\
  \ LSTM models, and the remaining 20% (108 months of data) was used for testing the\
  \ models. To determine the LSTM models that give the best results, different units,\
  \ activation functions, and optimizers were tried and *R*² values were compared.\
  \ The parameters and *R*² values of the best LSTM models developed for each station\
  \ are given in Table 12–3 and the time series in Fig. 12–5.\n\nTable 12–3\n\n The\
  \ most appropriate hyperparameters and *R*² values for long short-term memory models.\
  \ \n\n| Station  || Parameters |\n\n| --- | --- |\n\n| Units || Activation || Optimizer\
  \ || *R*² |\n\n| Eğirdir || 396 || tanh || adam || 0.82 |\n\n| --- | --- | --- |\
  \ --- |\n\n| Senirkent || 460 || relu || adam || 0.80 |\n\n| Uluborlu || 12 || tanh\
  \ || rmsprop || 0.80 |\n\n| Yalvaç || 364 || relu || rmsprop || 0.75 |\n\n| Isparta\
  \ || 460 || relu || adam || 0.74 |\n\n![Figure 12–5 Time series of long short-term\
  \ memory models for each station.](img/F000055f12-05a-9780443219054.jpg)\n\nFigure\
  \ 12–5 Time series of long short-term memory models for each station.\n\nAs can\
  \ be seen from Table 12–3, the highest success was obtained at Eğirdir station with\
  \ an *R*² value of 0.82, while the lowest *R*² value was obtained as 0.74 at Isparta\
  \ station among the LSTM models. While the *R*² value at Senirkent and Uluborlu\
  \ stations was 0.80, the *R*² value at Yalvaç station was 0.75.\n\n\n\n-   图 12-5\
  \ 所示，LSTM 模型在所有站点正确预测了 SPI 值的增减。LSTM 模型开发后，使用了前一步开发的最佳机器学习模型的下一个 10 年 SPI 值作为输入，并预测了未来\
  \ 10 年的湖泊水位。Eğirdir 湖在 1976 至 2019 年的水位在图 12-6 中给出，未来 10 年的 Eğirdir 湖水位变化在图 12-7\
  \ 中给出。\n\n![Figure 12–6 Eğirdir Lake water level change between 1976 and 2019.](img/F000055f12-06-9780443219054.jpg)\n\
  \nFigure 12–6 Eğirdir Lake water level change between 1976 and 2019.\n\n![Figure\
  \ 12–7 Eğirdir Lake water level change for the next 10 years.](img/F000055f12-07-9780443219054.jpg)\n\
  \nFigure 12–7 Eğirdir Lake water level change for the next 10 years.\n\n图 12-6 的检查显示，最小湖泊水位出现在\
  \ 1994 年 10 月的 915.81 m、2008 年 12 月的 916.25 m 以及 2018 年 12 月的 916.20 m。将这些最小水位与在\
  \ Senirkent、Uluborlu 和 Isparta 站点于 1990 年 11 月记录的最干旱值（见图 12-2）进行比较，显示出在大约 48 个月后出现了显著的湖泊水位下降。与此同时，Eğirdir\
  \ 站和 Yalvaç站在 2007 年 10 月的最干旱值与 2008 年 12 月的 916.25 m 湖泊水位之间存在约 12 个月的延迟。\n\n图 12-7\
  \ 的可能未来 10 年湖泊水位估计显示，2021 年 8 月的 916.94 m 水位可能是 2017 至 2018 年所有站点的干旱期所致。还显示，1976\
  \ 至 2019 年观测期间 Eğirdir 湖的平均水位约为 917.30 m，而未来 10 年预计约为 917.50 m。\n\n## 12.4 Conclusions\n\
  \n本研究使用机器学习算法探讨气象干旱与湖泊水位之间的关系。首先，计算了 1976 至 2019 年 Eğirdir、Senirkent、Uluborlu、Yalvaç和\
  \ Isparta 站点的 12 个月 SPI 值。根据计算出的 SPI 值，这五个站点共获得了 127 个月的共同干旱期。随后，将这 127 个月的 SPI\
  \ 值作为输入，使用 kNN、SVR、AdaBoost、RF、ET、GBR、XGBoost 和 CatBoost 等机器学习模型进行预测，估算 Eğirdir\
  \ 湖泊水位。模型结果表明，CatBoost 算法表现最佳。为提升 CatBoost 模型的成功率并防止过拟合，采用 Optuna 进行超参数调优，模型性能得到提升。此外，为更好地理解该模型，计算了特征重要性值，并分析输入对模型结果的影响。根据特征重要性，Isparta\
  \ 站是 Eğirdir 湖泊水位估计 CatBoost 模型中最具影响力的站点，其他站点的影响也值得注意。\n\n其次，利用 LSTM 在各站点估计未来 10\
  \ 年的 SPI 值，从而预测可能的 Eğirdir 湖泊水位。检查各站点最合适的 LSTM 模型的结果后，发现测试集中计算值与预测值相似。随后，将所有时期的\
  \ SPI 值作为各站点最佳 LSTM 模型的输入，预测未来 10 年的 SPI 值。同时，将未来 10 年的 SPI 值作为最佳机器学习模型的输入，预测湖泊水位。将\
  \ 1976 至 2019 年 Eğirdir 湖泊水位与机器学习模型的未来 10 年预测值进行比较，发现机器学习模型的平均水位预测误差为 0.20 m。本研究表明，机器学习模型能够成功评估气象干旱对湖泊水位的影响，并预测未来的水位变化。结论表明，气象干旱对\
  \ Eğirdir 湖泊水位的影响通常在 2 至 4 年之间，这段时间足以建立早期预警系统以防范可能的水文干旱，并开展最优的湖泊管理研究。\n\n## References\n\
