  \n图 4–16 移动平均滤波（窗口大小 5）月降雨训练数据、预测值和 Prophet 模型的实际值。\n\n表 4–2 总结了各实验中模型在测试集上获得的 MAE、MSE、RMSE\
  \ 和 MAPE 值。在原始数据实验中，Prophet 模型优于 ARIMA 和 LSTM 模型，MAE 最低为 19.225，MSE 为 564.023，RMSE\
  \ 为 23.749。就 MAPE 而言，ARIMA 模型表现最佳，值为 3.635，其次是 LSTM 为 3.700，然后是 Prophet 为 4.206。当应用窗口大小为\
  \ 3 个月的移动平均滤波器时，所有模型根据所有指标的性能都大幅提高。ARIMA 模型取得了最佳结果，MAE、MSE 和 RMSE 值分别为 8.349、86.139\
  \ 和 9.281。MAPE 也最低，为 0.353。 对于使用 5 个月移动平均滤波数据的实验，ARIMA 再次表现最佳，MAE、MSE 和 RMSE 值分别为\
  \ 4.850、28.473 和 5.336。MAPE 为 0.199% 也是模型中最低的。\n\n表 4–2\n\n实验的数值结果。\n\n|    || Model\
