  \n## 旅游与气候变化关系的计算建模方法\n\nGamze Kose, 土耳其阿伊丁阿德南·门德雷斯大学健康旅游系\n\n## 摘要\n\n全世界的人类活动对社会经济流动和技术变革具有巨大影响。作为一个无尽的循环，人类活动及其成果决定了社会的特征和未来世界的确切状况。然而，应该指出的是，并非所有人类活动或成果对我们生活的世界或生态系统都有积极影响。虽然气候变化似乎有着漫长的发生历史，但尤其是在\
  \ 21 世纪，它表现出更负面的影响。由于能源消耗、先进技术的密集使用以及引发不平衡排放的广泛人类活动，减少气候变化影响的研究在过去十年中已成为高度优先事项。在这一点上，有许多子领域需要考虑气候变化与相关活动范围之间的具体关系。其中，旅游活动可以成为讨论气候变化可能影响的利基领域。也可以评估气候变化对旅游活动的影响。因此，该关系可以从双向角度进行评估。本章的目的是提供旅游与气候变化的总体概述，并将重点扩展到计算建模方法。通过关注计算建模，旨在理解如何有效地使用和引导建模以优化旅游-气候变化关系，并为进一步研究提供思路。此外，本章还对旅游-气候变化相互作用的计算建模提供了一种总体方法。这种方法似乎是对旅游导向研究和气候变化行动背景下文献的及时贡献。\n\
  \n## 关键词\n\n计算建模；旅游；气候变化；技术；未来\n\n## 10.1 引言\n\n旅游可以被定义为解释人们为了个人或以业务为导向的目的离开其已知地点（国家或城市），并与目标地点进行文化、社会和经济互动的概念（Camilleri,\
  \ 2018; Netto, 2009）。在此背景下，旅游并非一种常见的人类活动。相反，它有许多原因和结果，应从社会科学和技术科学两个角度进行审视。实际上，与社会和经济优势的联系一直在塑造对与旅游潜力相关具体因素的总体关注。这样的潜力与人们的兴趣、社会文化特征、进行旅游活动的直接或间接原因以及确定旅游行动计划的经济状况相关联（Camilleri,\
  \ 2018; Sharma, 2004）。除此之外，总体方法已通过创建确保可持续旅游的系统内反馈机制的成果得到支持。所有这些努力都需要与人们的反馈以及通过不断进步的技术组件广泛收集的数据中的隐藏模式密切互动。还值得注意的是，旅游活动对技术和社会条件方面的全球变化高度敏感。\n\
  \n\n\n\n当今日的条件以技术视角进行审视时，可以说信息和通信技术（ICT）的进步使得旅游目的地的旅行更加实用。ICT 使人们能够获取世界各地特定地点的所需信息。此外，获取旅行方式、文化景点以及目标地点潜在活动的信息也更加便捷（Bethapudi,\
  \ 2013; Van Wee et al., 2013）。由于 ICT 使得全球沟通得以实现，信息获取和沟通的优势使得在旅游情境中规划和行动变得不再遥不可及。当然，现代生活各个领域的数字化转型也影响了商业方式，使得全球旅行的更便捷方式提升了旅游目的的强度，不仅限于个人意图，也包括商业目的（Abeba,\
  \ 2024; Imtiaz & Kim, 2019; Şahin, 2024）。因此，基于此前的所有解释，可以说技术是推动全球旅游活动扩张的关键催化剂。\n\n\
  正如旅游领域所见，技术进步在生活许多领域带来了优势。然而，技术的强烈使用以及人类活动的贡献增加了气候变化的程度。气候变化以温度水平和天气事件的平均状态的显著变化和变异而闻名（Romm,\
  \ 2022）。早期的研究表明，气候变化的预警已经出现，但自 2000 年代以来，气候条件的具体影响已经显现。特别是近几年，出现了许多意外事件，如风暴、极端（高温或低温）温度、森林火灾、冰川融化以及生态系统的转移（Levine\
  \ & Steele, 2021; Walsh et al., 2020）。甚至也有讨论将 `COVID-19` 与可能的流行病与气候变化相连（Gupta et\
  \ al., 2021; Lounis et al., 2023）。随着时间的推移，气候变化的术语逐渐演变为气候危机。由于这似乎是对人类及其他生物的生存性风险，目前正在大力努力应对气候变化的负面影响，并采取措施使现状转向平衡状态。从全国范围内减少碳排放的法规，到低能耗的绿色解决方案，再到电动汽车的转型以取代化石燃料车辆，气候危机的斗争中有许多不同的做法。此外，分析人类行为——无论是直接还是间接导致资源不均使用——也至关重要。与此相关，人类活动通常与使用化石燃料车辆以及与先进技术的互动相联系（Dunlap\
  \ & Brulle, 2015; Karyono, 2015; Trenberth, 2018）。与先进技术的互动包括使用云服务、运行人工智能、投资加密货币，甚至使用智能设备拍照、录像或进行即时通信。同样，旅游活动的增加也与气候变化相关，因为信息获取、沟通、旅行以及文化、社会和商业互动中的进一步行动在技术使用背景下显而易见。由于数据流量庞大且可能与复杂关系相连，这些活动可以通过计算模型的努力来观察。除了人类活动的负面影响外，还可以关注气候变化对旅游活动的负面影响。实际上，文献更关注气候变化对旅游的影响，但通过双向讨论，可以更好地把握平衡。\n\
  \n作为一种及时且显著的视角，本章探讨旅游与气候变化之间的关系。为此，本章旨在提供总体的关系概述，并扩展到计算建模方法的范畴。通过专注于计算建模，旨在理解如何有效利用并引导建模，以优化旅游与气候变化的关系，并为进一步研究提供思路。此外，本章还给出了旅游与气候变化相互作用的计算建模的一般方法。鉴于旅游与气候变化交叉领域的文献需要输入，本章的努力与成果有望为贡献并加速相关工作及后续方法的开展。\n\
  \n与本章范围相关，后续章节组织如下：下一节将围绕文献视角，阐述气候变化与旅游的关系。随后，第三节聚焦于计算建模视角，详细说明计算建模的工作原理，并定义相应的样本建模方法。最后，本章以进一步研究的讨论结束，并指向结论。\n\
  \n## 10.2 Connections between tourism and climate change\n\n当前的旅游范畴高度依赖于技术的使用，因为旅游活动的任何阶段都可以通过技术组件得到改进。此外，气候条件的变化迫使旅游领域调整方向或聚焦于不同的地点或活动阶段。因此，理解不同主体和活动如何塑造旅游与气候变化之间的联系至关重要。本节在转向计算建模视角之前，提供相关的一般性解释。\n\
  \n### 10.2.1 Technology factor\n\n\n\n\n旅游业在从不同行为主体（如机构、管理人员、游客和第三方服务提供商）的角度进行评估时具有多个阶段。在活动策划、广告和推广活动中，机构和管理人员使用以数据为导向的分析和决策支持系统。从游客的角度来看，类似的技术互动通过使用社交媒体、专门开发的应用程序以及由先进技术背景赋能的沟通周期得以实现。因此，即使在确切的旅游活动之前，也存在着显著的技术使用强度，这可以与气候变化动态相联系。在旅行时，一些资源被用于移动。考虑到乘坐飞机旅行以及进一步的交通，有多种使用技术的方式，这会触发燃料和电力等资源的消耗。当旅游活动正在进行时，由于旅游活动内部不可预测的人类活动，它几乎是无止境的流动。当然，旅游的特殊性导致人类活动增加，从而导致进一步的技术和资源使用。图\
  \ 10–1 展示了旅游的不同阶段以及潜在的技术使用案例。\n\n![Figure 10–1 Phases of tourism activities and\
  \ the potential technology use cases.](img/F00002Xf10-01-9780443219054.jpg)\n\n\
  图 10–1 旅游活动阶段及潜在技术使用案例。\n\n尽管确切的旅游活动并非气候变化的核心，但当同时考虑人数、资源、技术组件以及技术使用速度时，它们可以被接受为间接影响，会带来指数级的负面影响。实际上，气候变化的影响应从指数原因的角度进行分析，这些原因在技术时代迅速出现。尤其是国际上的旅游活动就是这一现象的例子，但国家层面的行动也应纳入同一范围，因为技术使用已在人类向旅游意图的行动中发生。除了人类活动的视角外，分析也可以针对气候变化对旅游活动的影响。此时可以说，气候变化可以通过导致其在适应策略上花费更多资金，或根据世界各地生态系统动态变化而设计的新目的地制定新计划，从而影响旅游活动。然而，重要的是要指出，适应策略可能导致更多技术或资源的使用，从而为旅游业与气候变化之间的相互负面影响创造一个无尽的循环。这种情况指出了需要最优解决方案，这可以通过精心设计的政策和全球意识来实现。作为这些努力的一部分，计算解决方案可以提供很大帮助，因为当前的数据时代往往超出了人类控制能力。\n\
  \n### 10.2.2 旅游与气候变化关系研究\n\n在文献审查时，可以看到人们对理解旅游与气候变化之间的关系存在一些研究兴趣。实际上，研究通常侧重于气候变化对旅游范围内变化条件的负面影响。然而，硬币的另一面始终与人类活动的影响相联系。正因如此，正如本章经常提到的那样，确切的关系应从双向视角建立。\n\
  \n#### 10.2.2.1 气候变化对旅游的影响\n\n旅游与气候变化之间的文献联系似乎在几年前就已建立。在她的文献研究中，Becken (2013) 指出旅游与气候变化之间存在一个不断增长的知识领域。她简要地在政策、气候影响、减缓和适应等多个维度研究努力的背景下检测到确切的关系。在这项研究之前，Becken\
  \ and Hay (2007) 提供了一本关于风险和机遇的广泛讨论的书籍研究。详细来说，这本书将旅游和气候都视为相互作用的系统。它从冬季和沿海旅游案例的角度考虑了气候变化的负面影响。就温室气体问题而言，该书从旅游业和人类行为的角度提供了讨论。此外，气候变化减缓解决方案与针对旅游的商业、交通和碳补偿项目相联系（Becken\
  \ & Hay, 2007）。Scott, Hall, et al. (2012) 指出冬季运动旅游、自然旅游和沿海旅游是受气候变化影响的市场细分，并指出了旅游与气候变化之间复杂的关系。他们还表示，值得注意的研究方法与环境/生态系统变化、旅游需求在时间上和地理上的变化以及受气候条件影响的目的地竞争力相关。值得注意的是，Scott,\
  \ Gössling, et al. (2012) 的书籍研究提供了关于旅游与气候变化关系双向影响的另一系列讨论。除了旅游适应和减缓的需求外，该书还关注碳管理视角，并将温室气体排放视为旅游和流动性增长的结果。就适应和减缓视角而言，Weaver\
  \ (2011) 讨论了可持续旅游活动的潜力，并考虑了生物多样性和空气质量等地方因素的可持续性机会。另一方面，Scott and Gössling (2022)\
  \ 指出气候变化对文化和自然遗产以及旅游需求的负面影响，并认为如果气候变化问题无法有效管理，旅游业就无法维持自身。涵盖相关努力，文献经常收到关于政策和社会努力以在旅游与气候条件之间找到平衡的替代视角（Becken\
  \ et al., 2020; Becken & Clapcott, 2011; Dubois & Ceron, 2006a; Kajan & Saarinen,\
  \ 2013; Scott & Becken, 2010; Scott & Gössling, 2021）。\n\n#### 10.2.2.2 旅游对气候变化的影响\n\
  \n\n\n\n\n聚焦于旅游对气候影响的文献在详细考虑温室气体排放时取得了显著成果。Lenzen et al. (2018) 进行了一项研究量化了旅游在共计\
  \ 160 个国家之间造成的全球碳流动。该研究揭示了由于旅游活动碳足迹出现了关键性增长。研究发现旅游活动的原因与交通、食品和购物相关。作者认为旅游将在温室气体排放的全球增长中发挥显著作用。详细而言，Filimonau\
  \ et al. (2013) 根据其对度假套餐旅游背景下碳影响的研究发现，旅游对温室气体排放具有关键的间接影响。作为另一项发现的问题，Eijgelaar et\
  \ al. (2010) 表明南极邮轮旅游活动对排放和气候危机产生影响。具体而言，旅游需求以及包括飞机和邮轮在内的交通似乎是具有负面影响的重要因素。相关的南极旅游问题在替代研究中经常被考虑（Amelung\
  \ & Lamers, 2007；Jabour, 2014；Kariminia et al., 2013；Nielsen, 2022；Shijin et al.,\
  \ 2020；Tejedo et al., 2022）。已有研究通过考虑世界各地特定旅游目的地展示了旅游活动对气候的影响。Gühnemann et al. (2021)\
  \ 表明奥地利的游客出行由于密集的汽车出行和长途飞行导致气体排放增加。考虑到瑞士的案例，Perch-Nielsen et al. (2010) 发现尤其是航空运输对气体排放有很大影响，导致气候危机。研究还进行了预测以了解旅游的气体排放是否可以减少。然而，到目前为止研究尚未提供积极的消息（Balli\
  \ et al., 2019；Dubois & Ceron, 2006b；Isik et al., 2017；Liu et al., 2021；Scott et\
  \ al., 2010）。\n\n研究表明，美洲大陆高收入国家的旅游活动在气候变化的负面影响中发挥主导作用（Gozbasi et al., 2021）。这也可以扩展到全球范围内的其他高收入国家（Lenzen\
  \ et al., 2018）。另一方面，旅游业发达的亚洲国家在环境影响方面被发现存在劣势（Nosheen et al., 2021），但 Voumik et\
  \ al. (2023) 的一项最新研究表明旅游对亚洲的碳排放没有直接影响。然而，似乎研究中报告的主要原因仍然可以间接与旅游活动相关。最终，似乎基于区域的研究不足以从特定国家旅游视角清晰地描述全球气候危机。因此，旅游与气候变化之间的联系采用累积状态，而解决方案可以被视为地方性的。当评估旅游活动的细节时，可以看出文献经常在旅游与气候危机关系背景下提及交通、技术使用和人类流动（Dube\
  \ & Nhamo, 2021）。考虑到研究结果，以下因素可以被指出为旅游中导致气候变化负面影响的基本组成部分：\n\n*   • *Transportation\
  \ and Travels*: 尤其是航空运输、邮轮旅行和长途汽车旅行（特别是使用化石燃料和/或旧车）导致温室气体排放增加。\n*   • *Technology*:\
  \ 尽管该因素应进一步研究以确定主要技术工具和/或使用视角，但似乎旅游活动期间技术的密集使用在负面影响中发挥作用。这种联系是实际问题，与技术使用增加与气候变化之间的正相关联系在一起。\n\
  *   • *Mobility*: 人类流动在即使是旅游活动时也具有许多复杂动态。它包括许多人类活动，包括旅行、购物、技术使用以及可与气候变化情景联系的许多其他行为。因此，人类流动的累积视角似乎是气候负面影响的另一个因素。\n\
  \nFig. 10–2 代表了旅游与气候变化之间双向关系结果的总体概述。可以看出，双方的影响各有其特征并与许多参数具有复杂关系。此外，解决气候变化问题的努力需要在相关关系背景下需要更多预测性和描述性分析。这种方式中的一种重要方法是使用计算建模来理解和预测动态。这样，进一步的发现可以帮助设计旅游与气候变化之间的平衡关系。\n\
  \n![Figure 10–2 Two-sided relation between tourism and climate change.](img/F00002Xf10-02-9780443219054.jpg)\n\
  \nFigure 10–2 Two-sided relation between tourism and climate change.\n\n## 10.3\
  \ Computational modeling for tourism and climate change\n\n旅游与气候变化关系的计算建模方法通常用于预测目的。这是因为在应对气候影响或优化旅游活动（例如降低气体排放）方面采取进一步行动需要一些以预测为结构的宝贵预先知识。除此之外，还需要一些描述性建模视角来理解当前情况。当然，计算建模是一个领域，随着新的科学成果、参数和知识的出现而拥有许多开放机会，这些都促进了在旅游与气候交汇处动态特征理解能力的发展。\n\
  \n### 10.3.1 Computational models for effects of climate change on tourism\n\n文献提供了从气候变化对旅游影响视角的计算模型研究。例如，Mieczkowski\
  \ (1985) 通过召回模型作为旅游气候指数（`TCIndex`）提供了最早的建模视角之一。考虑到日间热舒适指数（`Cd_coi`）、日热舒适指数（`Cda_coi`）、降水量指数（`Pa_rec`）、风欣赏指数（`W`）和日照价值指数（`S`），`TCIndex`\
  \ 得分根据 20 到 100 的范围进行分类：\n\n\n\n\n\n`TCIndex` = 2(4`Cd_coi`+`Cda_coi`+2`S`+2`Pa_rec`+`W`)\
  \ (10–1)\n\n![Equation](img/F00002Xsi1.png)(10–1)\n\n`TCIndex` 并非旨在聚焦气候变化对旅游业的直接影响，但足以追踪气候变化对旅游流的影响。除此之外，文献一直关注测量旅游需求以了解气候变化对旅游业的影响。就计算建模而言，通常考虑三种方法：离散选择模型、时间序列分析以及总量旅游需求模型（Rossello-Nadal,\
  \ 2014）。离散选择模型基于人们为何选择特定旅游目的地的提问。据此，Morley (1992) 提出了根据访问目的地 *i* 进行效用计算的模型（而非 *j*，考虑\
  \ *i ≠ j*），其选择概率计算如下：\n\n`Util[n_i]` = `β[n]'a[n_i]` + `τ[n_i]` (10–2)\n\n![Equation](img/F00002Xsi2.png)(10–2)\n\
  \n`π[n_i]` = Pr(`β[n]'a[n[i]]`+`τ[n[i]]` > `β[n]'a[n[j]]`+`τ[n[j]]`) (10–3)\n\n\
  ![Equation](img/F00002Xsi3.png)(10–3)\n\n相关模型激发了研究对微观经济视角及进一步营销分析的兴趣。然而，由于决策过程是某种复杂动态，它常被认为受众多参数影响（Marcussen,\
  \ 2011; Rossello-Nadal, 2014）。另一方面，离散选择模型也被用来理解气候变化如何影响决策以及旅游业的总体状况（Bujosa & Rossello,\
  \ 2013; Eugenio-Martin & Campos-Soria, 2010）。\n\n在时间序列分析的背景下，将天气条件整合到旅游动态中更为有利。例如，考虑第\
  \ *i* 个月的旅游流数量（`F[i]`），连同创新项（`x[i]`）和天气变量（`w[i]`），在以下方程形式中提出了一个预测模型（Bujosa & Rossello,\
  \ 2013）：\n\n`∂pF i` = `∇px[i]` + `δyw[i]` (10–4)\n\n![Equation](img/F00002Xsi4.png)(10–4)\n\
  \n值得注意的是，这样的模型有助于揭示英国游客的旅游行为与英国天气相关不同变量之间的显著关系（Rossello, 2009）。需要指出的是，时间序列分析与离散选择模型一样具有价值，因为这些建模方法显示了旅游与气候变化之间的关系。然而，有人指出这两种建模方法都允许收集短期预测的信息，因此长期影响需要额外的建模解决方案（Li\
  \ et al., 2005; Rossello-Nadal, 2014; Song & Li, 2008）。为应对这一状况，引入了总量旅游需求模型。作为一个显著的模型，汉堡旅游模型（HTM）采用两个方程来评估目标年份的国际游客出游和入境。具体而言，HTM\
  \ 试图通过考虑诸如总到达人数（`Arr`）、总出发人数（`Dep`）、目标国家的平均温度（`Tar`）、人口（`Pop`）以及其他参数如该国人均收入（`IC`）等参数来理解气候变化如何影响旅游流（Hamilton\
  \ et al., 2005）：\n\n\n\n\n\nln *Arr*[d] = *γ*[0] + *γ*[1]*X*[d] + *γ*[2]*Tar*[d]\
