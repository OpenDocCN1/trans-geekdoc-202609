  \ 门控循环单元网络\n\nCho 等人于 2014 年提出了 GRU（Cho et al., 2014）。GRU 通过使用门来管理数据流，如 图 9-6 和\
  \ 9-7 所示。但其上只有两个门：重置门和更新门。更新门管理有多少新数据被纳入先前状态。重置门管理有多少先前数据被擦除。GRU 架构采用以下数学表示：\n\n\
