  \n2\n\n\n*GRU*，门控循环单元；*LSTM*，长短期记忆；*MA*，移动平均；*MAE*，平均绝对误差；*MEAE*，中位数绝对误差；*MSE*，均方误差；*MSLE*，均方对数误差；*RNN*，循环神经网络。\n\
  \n3 个月、6 个月和 12 个月数据集的最成功模型性能值以粗体突出显示。\n\n## 2.5 结论\n\n本章重点预测布尔杜尔省的降水水平。每日和月度降水数据表现出显著的噪声，促使我们采用\
  \ 3 个月、6 个月和 12 个月 `MA` 进行预测。`GRU`、`LSTM` 和传统 `RNN` 模型被部署用于此目的。这些模型的预测性能使用 `MAE`、`MSE`、`MSLE`\
  \ 和 `MEAE` 等指标进行评估。比较模型后，`GRU` 模型成为更优的执行者，特别是对于降水 3 个月和 12 个月 `MA`，在这些指标上超越了其他模型。另一方面，对于\
  \ 6 个月 `MA`，`GRU` 在 `MSLE` 方面表现出色，而 `LSTM` 模型在与其它模型相比时，在 `MAE`、`MSE` 和 `MEAE` 指标方面表现出更优的性能。\n\
  \n由于全年无雨天频率高，数据集中包含大量零值。此外，降水量在一年中并未表现出一致的上升或下降趋势；相反，它遵循明显的季节性模式。因此按日预测的效果较差，按季节预测获得了更准确的结果。\n\
