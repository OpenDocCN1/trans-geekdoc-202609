  #### 9.2.3.1 长短期记忆与门控循环单元\n\n\n\n\n\n使用门控来调节信息流是 `GRU` 和 `LSTM` 共有的一个特征。但 `GRU`\
  \ 只有两个门，而 `LSTM` 有三个。正因如此，`LSTM` 比 `GRU` 更复杂也更具表达力。此外，`LSTM` 和 `GRU` 的区别还在于前者包含一个独立的记忆单元，而后者将其合并为一个记忆向量。`LSTM`\
  \ 以及 `GRU` 在多种任务（包括情感分析、语言建模和语音识别）中的有效性已在多项研究中得到检验。研究结果相互矛盾；有些研究表明 `LSTM` 比 `GRU`\
  \ 工作得更好，而另一些研究则建议相反。然而，大多数研究一致认为，在分析序列数据时，`LSTM` 和 `GRU` 同样有用，尽管具体的任务和数据集将决定每个模型的表现如何。\n\
