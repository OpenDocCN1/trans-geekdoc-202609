  \n本章描述了在 `python` 框架内使用 DL 模型对全球温度进行气候变化建模的方法论。原始且未经处理的全球数据集收集自 Berkeley Earth（[`berkeleyearth.org/data/`](http://berkeleyearth.org/data/)）。它提供了从\
  \ 1743 年到 2013 年的网格格式温度数据以及陆地和海洋的超高分辨率时间序列数据。构建、训练和评估了三种流行的神经网络，如 `RNN`、`LSTM` 和\
  \ `GRU`，使用各种优化器如 `Adam`、`SGD`、`Adamax`、`Adagrad`、`Adadelta`、`RMSprop` 和 `Nadam`\
  \ 来预测全球温度趋势以及美国和印度温度趋势。本章的主要贡献如下：\n\n1. 使用 `Adam` 优化器，使用 `LSTM` 可以实现更快的训练和计算成本更低，其次是\
  \ `GRU` 和 `RNN`。均方误差为：`MSE=0.09250031065887551`（`LSTM`），`MSE=0.08040434597627735`（`GRU`），`MSE=0.06096303859943463`（`RNN`）\n\
  2. 使用 `SGD` 优化器，`LSTM` 预测效果良好，其次是 `GRU` 和 `RNN`。均方误差为：`MSE=1.8776324756386953`（`LSTM`），`MSE=0.9815534033191056`（`GRU`），`MSE=0.11220742113813277`（`RNN`）\n\
  3. 使用 `Adamax` 优化器，`LSTM` 预测效果良好，其次是 `RNN` 和 `GRU`。均方误差为：`MSE=0.0998461682132788`（`LSTM`），`MSE=0.09855693036455689`（`RNN`），`MSE=0.09817570471281879`（`GRU`）\n\
  4. 使用 `Adagrad` 和 `Adadelta` 优化器，`LSTM` 预测效果良好，其次是 `GRU` 和 `RNN`。均方误差为：`MSE=22.645661292549917`（`Adagrad`\
  \ 下的 `LSTM`），`MSE=2.210322750347732`（`Adagrad` 下的 `GRU`），`MSE=0.22145172804570754`（`Adagrad`\
  \ 下的 `RNN`），`MSE=49.68461904083209`（`Adadelta` 下的 `LSTM`），`MSE=41.480035564039305`（`Adadelta`\
  \ 下的 `GRU`），`MSE=13.816304188418261`（`Adadelta` 下的 `RNN`）\n5. 使用 `RMSProp` 优化器，`GRU`\
  \ 预测效果良好，其次是 `RNN` 和 `LSTM`。均方误差为：`MSE=0.10032250216117587`（`GRU`），`MSE=0.08745906210421796`（`RNN`），`MSE=0.07977269791361769`（`LSTM`）\n\
  6. 使用 `Nadam` 优化器，`LSTM` 预测效果良好，其次是 `RNN` 和 `GRU`。均方误差为：`MSE=0.09401263234931696`（`LSTM`），`MSE=0.0772197251373337`（`RNN`），`MSE=0.07443513244167563`（`GRU`）。\n\
  \n本章中说明的 DL 模型可用于预测地球即将到来的气候变化。\n\n## References\n\n* Ardabili et al., 2020 Ardabili,\
