  \ (4.10)\n\n![Equation](img/F000031si21.png)(4.10)\n\n## 4.5 结果与讨论\n\n对 `ARIMA`、`Prophet`\
  \ 和 `LSTM` 模型在土耳其里泽省 2004–23 年期间的月降雨时间序列数据上的预测性能进行了评估。数据被分为训练集和测试集，其中 2004 年 1 月至\
  \ 2021 年 12 月的数据用于模型训练，剩余的 2022 年 1 月至 2023 年 10 月的数据用于评估。基于原始原始月降雨数据以及使用窗口大小为 3\
  \ 个月和 5 个月的移动平均滤波器预处理后的数据，进行了三次实验。\n\n\n\n\n`Fig. 4–7` 描绘了将 `LSTM` 模型应用于里泽月降雨数据时，损失值随训练轮数变化的曲线。损失值衡量模型在训练期间预测输出与真实目标输出之间的差异。损失越低表示性能越好，目标是尽可能将其最小化。在该图中，蓝色线条追踪了\
  \ `LSTM` 模型参数在每个轮次根据训练数据迭代更新时损失的演变情况。可以看出，初始时损失较高，但在连续的训练周期中损失稳步下降，达到最小值后趋于平稳。这种行为表明\
  \ `LSTM` 网络正在利用反向传播和梯度下降优化有效地学习输入时间序列中的模式。随着训练的进行，模型改进了捕捉过去与未来降雨值之间时间关系的能力。值得注意的是，损失在前\
  \ 10 个轮次内急剧下降，此后下降速率开始趋于平稳。这表明大部分学习发生在早期，之后收益递减。它为确定理想的训练轮次数以避免过拟合提供了参考。\n\n![Figure\
  \ 4–7 Loss value plot during long short-term memory model training.](img/F000031f04-07-9780443219054.jpg)\n\
  \n`Figure 4–7` 长短期记忆模型训练过程中的损失值曲线图。\n\n`Fig. 4–8` 展示了将 `LSTM` 模型应用于预测里泽 2022 年 1\
  \ 月至 2023 年 10 月月降雨量的结果。具体而言，它显示了该测试期间预测值与实际观测降雨量之间的比较。蓝色线条描绘了每个月实际记录的历史降雨总量。与此同时，绿色点代表\
  \ `LSTM` 网络在对 2004 年至 2021 年的先前数据进行训练后做出的预报量。目视检查该图可知，在评估阶段的大部分时间内，预测值紧密追踪真实月降雨曲线的起伏。这种紧密的追踪性能表明，模型能够基于其从历史数据中学到的知识，准确推断测试月份的降雨模式。然而，也偶尔出现偏差，例如\
  \ 2022 年 3 月和 9 月以及 2023 年 7 月，实际观测值与模型预报明显偏离。这表明虽然 `LSTM` 网络合理地捕捉了总体趋势，但在预测某些异常值方面仍不完美。值得注意的是，模型可靠地捕捉到季节性波动，预测曲线中的峰值和谷值总体上与实际情况一致。这验证了\
  \ `LSTM` 记住了训练降雨序列中表现出的周期性月度变化。\n\n![Figure 4–8 Raw monthly rainfall training data,\
  \ predictions, and actual values for LSTM model.](img/F000031f04-08-9780443219054.jpg)\n\
  \nFigure 4–8 Raw monthly rainfall training data, predictions, and actual values\
  \ for LSTM model.\n\n`Figs. 4–9` 和 `4–10` 显示了使用 `LSTM` 模型预测里泽月降雨量并与实际观测值进行比较的结果，但降雨数据分别经过\
  \ 3 个月和 5 个月移动平均滤波预处理。在 `Fig. 4–9` 中，输入到 `LSTM` 的数据使用 3 个月窗口进行滤波。评估 2022–23 年的预测时，可以看到绿色预报数据比原始数据\
  \ `Fig. 4–8` 更精确地追踪观测降雨量（红色线）的起伏。这种更紧密的拟合意味着 3 个月平均去除了噪声，使 `LSTM` 更有效地学习模式。类似地，`Fig.\
  \ 4–10` 显示了使用 5 个月滤波输入到 `LSTM` 模型的评估结果。在此，预测值（绿色）与实际测量值（红色）几乎完美对应，在所有时间点几乎没有偏差。这种更优的匹配表明，更长的平均降低了失真，使得\
  \ `LSTM` 完全捕捉到里泽的潜在降水趋势。值得注意的是，虽然 `Figs. 4–9` 和 `4–10` 相对于 `Fig. 4–8` 显示出改进的预报，但从\
  \ 3 个月到 5 个月滤波数据集，预测的准确性逐步提高。渐进增强的实现证实，加入额外的平滑技术成功减少了非平稳性，导致输入数据更符合 `LSTM` 的平稳性假设。因此，模型的预测能力得到提升。\n\
  \n![Figure 4–9 Moving average filtered (window size 3) monthly rainfall training\
  \ data, predictions, and actual values for long short-term memory model.](img/F000031f04-09-9780443219054.jpg)\n\
  \n`Figure 4–9` 移动平均滤波（窗口大小 3）月降雨训练数据、预测值和长短期记忆模型的实际值。\n\n![Figure 4–10 Moving average\
  \ filtered (window size 5) monthly rainfall training data, predictions, and actual\
  \ values for long short-term memory model.](img/F000031f04-10-9780443219054.jpg)\n\
  \n`Figure 4–10` 移动平均滤波（窗口大小 5）月降雨训练数据、预测值和长短期记忆模型的实际值。\n\n实施 `ARIMA` 模型预测里泽 2022\
  \ 年 1 月至 2023 年 10 月月降雨量的结果显示在 `Fig. 4–11` 中。预测值与该评估期间的实际观测值进行比较。蓝色线条追踪测试时间段内每个月的真实测量降雨总量。叠加的绿色线为\
  \ `ARIMA` 模型在 2004 年至 2021 年历史数据上训练后做出的预报量。目视检查后可以明显看出，`ARIMA` 预测总体上遵循真实月降雨曲线所反映的起伏。这表明模型能够准确预测降水变化，因为其理解了潜在的时间序列模式。确实存在一些差异，例如\
  \ 2022 年 2 月、8 月和 9 月，实际降雨量超过预期。然而，与总体上显示的紧密追踪相比，此类差异相对较小。\n\n![Figure 4–11 Raw\
  \ monthly rainfall training data, predictions, and actual values for ARIMA model.](img/F000031f04-11-9780443219054.jpg)\n\
  \nFigure 4–11 Raw monthly rainfall training data, predictions, and actual values\
  \ for ARIMA model.\n\n\n\n\n\nARIMA 模型的预测性能评估显示在 图 4–12 和 4–13 中。模型分别使用 3 个月和 5\
  \ 个月移动平均降雨序列作为输入进行评估。评估期为 2022 年至 2023 年。在 图 4–12 中，ARIMA 模型在用 3 个月移动平均滤波器预处理的数据上训练。与实际测量值相比，绿色预测曲线比原始数据（见\
  \ 图 4–11）更准确地反映了观测降雨（红线表示）的变化。这种增强表明滤波器帮助模型捕捉趋势。图 4–13 显示了使用 5 个月平均输入对 ARIMA 进行评估的结果。在这里，预测值几乎完美地对应于实际观测值，绿色线和红线之间在任何时间点都几乎没有可感知的偏差。这种高度吻合表明更长的平均产生了更高的平稳性，使模型能够以最高精度学习降水趋势。值得注意的是，与\
  \ LSTM 模型一样，从 3 个月到 5 个月窗口采用平滑输入，ARIMA 预测与现实之间的吻合度不断提高。这强化了额外的滤波有助于进一步去除噪声，从而产生最适合\
  \ ARIMA 假设的输入。\n\n![图 4–12 移动平均滤波（窗口大小 3）月降雨训练数据、自回归积分滑动平均模型的预测值和实际值。](img/F000031f04-12-9780443219054.jpg)\n\
