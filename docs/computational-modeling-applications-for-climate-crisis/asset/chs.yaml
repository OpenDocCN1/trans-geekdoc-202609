  \ University, Isparta, Turkey,    ³Department of Civil Engineering, Engineering\
  \ and Natural Sciences Faculty, Kırıkkale University, Kırıkkale, Turkey\n\n## Abstract\n\
  \nThis study investigates the impact of meteorological droughts on the water level\
  \ of Eğirdir Lake, indicating hydrological drought, utilizing machine learning (ML)\
  \ models, including k-nearest neighbors, support vector regression, AdaBoost, Random\
  \ Forest, extra trees, gradient boosting regressor, XGBoost, and CatBoost algorithms.\
  \ Initially, standardized precipitation index (SPI) series were calculated for 12-month\
  \ period, analyzing precipitation data from 1976 to 2019 obtained from meteorological\
  \ stations in Eğirdir, Senirkent, Uluborlu, Yalvaç, and Isparta. ML models were\
  \ developed to estimate the water level of Eğirdir Lake exclusively based on SPI\
  \ values during only dry periods. The CatBoost algorithm gave the best performance\
  \ among ML models with an *R*² value of 0.71 for the testing set. Hyperparameter\
  \ tuning for CatBoost model was enhanced with Optuna the success of the model and\
  \ mitigate overfitting. Therefore the *R*² value of the CatBoost model increased\
  \ to 0.75. Subsequently, long short-term memory was employed to forecast the next\
  \ 10-year SPI values for each station. Additionally, the best ML model, utilizing\
  \ possible SPI values for the next 10 years, forecasts potential water levels for\
  \ Lake Eğirdir. The study concludes that ML models effectively assess the impact\
  \ of meteorological droughts on lake water levels and can predict forthcoming water\
  \ level changes.\n\n## Keywords\n\nMeteorological drought; standardized precipitation\
  \ index; lake level; machine learning; long short-term memory\n\n## 12.1 Introduction\n\
  \nHydrological drought occurs with the continuation of meteorological drought, which\
  \ occurs when precipitation falls below the mean in a period time and decreases\
  \ in groundwater and surface water resources (Gumus, 2017). Agricultural drought\
  \ occurs when the decreasing water resources potential cannot meet the plant water\
  \ needs (Dai et al., 2020). In this context, it is of great importance to accurately\
  \ determine the severity, magnitude, and duration of a possible meteorological drought\
  \ and subsequent hydrological drought to make forward-looking and sustainable planning\
  \ of water resources in a region.\n\n\n\n\n-   [标准化降水指数 (SPI)](https://wiki.example.org/feynmans_learning_method)\
  \ 是一种用于在不同时间尺度上监测气象干旱的方法 (`McKee et al., 1993`). 该方法因仅使用降水数据而受到许多研究者的青睐 (`Alvarez\
  \ et al., 2024`; `Angelidis et al., 2012`; `Bhunia et al., 2020`; `Latifoğlu & Özger,\
  \ 2023`; `Młyński et al., 2024`; `Moreira et al., 2006`; `Pande et al., 2023`; `Sakellariou\
  \ et al., 2024`; `Šebenik et al., 2017`). `Kumar et al. (2009)` 使用 SPI 方法对印度安得拉邦的长期降水数据进行气象干旱分析，他们指出该地区降水的累积概率分布函数在下尾和上尾偏离正态分布，需要尝试不同的概率分布函数。`Abeysingha\
  \ and Rajapaksha (2020)` 利用斯里兰卡 54 个气象站的降水数据，在 3 个月、6 个月和 12 个月的周期内使用 SPI 方法分析干旱，并对\
  \ SPI 系列应用曼 Kendall 趋势检验，检测到干旱呈上升趋势。`Mahmoudi et al. (2021)` 研究了在伊朗 63 个站点的降水数据为零时，确定最合适的概率分布以用于\
  \ SPI 值。`Masoudi and Taheri (2024)` 利用 1990 年至 2019 年的降水数据为伊朗法尔省（Fars）制作干旱风险图，图示表明干旱风险从东南向西北递增。`Rezaiy\
  \ and Shabri (2024)` 利用 1970 年至 2019 年的降水数据为阿富汗哈拉特省（Herat Province）计算 3 个月、6 个月、9\
  \ 个月和 12 个月的 SPI 系列，对 SPI 系列进行 Ensemble Empirical Mode Decomposition (EEMD) 分解，并使用\
  \ Autoregressive Integrated Moving Average (ARIMA) 进行干旱预测，他们指出 EEMD-ARIMA 模型比 ARIMA\
  \ 更成功。 \n\n自然湖泊和人工湖泊是受气候变化影响的重要地表水资源，它们在支持渔业和休闲活动、满足饮用水和灌溉水需求、缓和气候、提高农业产量等方面对区域经济贡献显著。因此，检查湖泊水位——作为受气候变化和气象干旱影响的水文干旱指标——至关重要\
  \ (`Erkoç, 2023`; `Mtilatila et al., 2020`; `Wang et al., 2018`; `Zhang et al.,\
  \ 2015`). `Mtilatila et al. (2020)` 评估了湖泊和河流流域的气象干旱和水文干旱趋势，指出因气温升高和降水减少，该地区干旱趋势呈上升。`Liu\
  \ et al. (2020)` 提出在中国东鼎湖（Dongting Lake）地区采用创新的洪水调控方案，在洪水期间蓄积多余径流，以防止水文干旱。 \n\n\
  机器学习（ML）是基于输入信息处理不同函数并通过自学生成解决方案的算法系统，它们被用于获得最佳预测并预测水文领域的时间序列数据，如干旱 (`Dai et al.,\
  \ 2024`; `Fan et al., 2024`; `Hancock & Khoshgoftaar, 2020`; `Ibrahim et al., 2020`;\
  \ `Sanjeetha et al., 2021`; `Zhang et al., 2024`). `Huang et al. (2019)` 利用 2001\
  \ 年至 2015 年中国南方五个站点的气象数据，通过类别增强（CatBoost）、随机森林（RF）和支持向量机（SVM）算法估算参考蒸发 otranspiration，他们指出\
  \ CatBoost 算法比其他方法提供更快且更准确的结果。`Kumar et al. (2023)` 尝试不同的机器学习算法预测 Garudeshwar 盆地的河流流量，其中指出\
  \ CatBoost 算法在建模水文时间序列方面表现出色。`Saber et al. (2022)` 使用 LightGBM 和 CatBoost 算法在埃及瓦迪系统（Wadi\
  \ System）中建模闪 lood 敏感性，他们指出 LightGBM 在 445 个闪 lood 区域表现更为成功。`Wang and Qian (2023)`\
  \ 提出将 CatBoost 用于河网分类，并通过 SHapley Additive exPlanations (SHAP) 增强模型成功率，取得了合理的成功。\
  \ \n\n`Belayneh and Adamowski (2013)` 利用人工神经网络（ANN）、支持向量回归（SVR）和小波分析（WA）等不同的机器学习算法，对埃塞俄比亚阿瓦什河流域的标准化降水指数（SPI）所确定的气象干旱进行预测，他们指出\
  \ WA-ANN 方法在 3 个月的时间跨度内成功估计 SPI 值。`Citakoglu and Coşkun (2022)` 使用 ANN、自适应模糊推理系统、SVR、高斯过程回归和\
  \ k 最近邻（kNN）算法，在计算 Sakarya 气象站降水数据的 1 个月、3 个月和 6 个月期间的 SPI 系列后，预测 t+1 月的数值，他们指出不同的混合方法在每个周期中均取得了成功。`Mokhtar\
  \ et al. (2021)` 利用标准化蒸渗指数（SPEI）在 3 个月和 6 个月的时间跨度内，在中国青藏高原计算气象干旱，并使用多种机器学习算法估算 SPEI\
  \ 值，比较了不同输入组合下机器学习算法的表现。`Dash et al. (2024)` 采用逻辑回归、决策树（DT）、随机森林（RF）和支持向量机（SVM）算法对降水进行预测，指出随机森林模型提供最佳预测。\n\
  \n\n\nLong short-term memory (LSTM) has a structure that uses the output obtained\
  \ in the previous step as the input of the current step and organizes the flow of\
  \ information by keeping it in memory for a short time. It is frequently used in\
  \ modeling and forecasting time series. This method has achieved high success in\
  \ estimating nonlinear data. In recent years, the method has been often preferred\
  \ in hydrology for future predictions (Baykal et al., 2023; Latifoğlu & Nuralan,\
  \ 2020; Swagatika et al., 2024). Xu et al. (2024) stated that the Cauchy mutation\
  \ and adaptive weight factor (CABES) method increased the success of LSTM in estimating\
  \ annual flow values of Xiajiang hydrological station in the Ganjiang River Basin,\
  \ China. Kadam et al. (2024) made a drought assessment with 6-month SPI values using\
  \ recurrent neural network, gated recurrent unit (GRU), and LSTM deep learning methods\
  \ for the Marathwada region in India. They stated that the model based on LSTM with\
  \ 6-month SPI is the most successful model for the region. Li, Liu et al. (2024)\
  \ used LSTM, GRU, and temporal convolutional network deep learning methods to predict\
  \ the level changes of Polang Lake, located in the middle parts of the Yangtze River\
  \ in China. They preferred Bayesian model average and Monte Carlo methods to increase\
  \ the prediction accuracy of the models and stated that GRU gave the best estimations.\
  \ Li, Shu et al. (2024) compared LSTM and `bidirectional long short-term memory\
  \ (BiLSTM)` methods in a different study for Polang Lake level prediction. While\
  \ both methods were found to be successful in short-term forecasts, BiLSTM was found\
  \ to be more successful in long-term forecasts.\n\nIn this study, the effects of\
  \ meteorological droughts on Eğirdir Lake water level changes, that is, hydrological\
  \ drought, were examined with ML algorithms. For this purpose, firstly, SPI series\
  \ were calculated for meteorological drought in a 12-month period using precipitation\
  \ data between 1976 and 2019 from Eğirdir, Senirkent, Uluborlu, Yalvaç, and Isparta\
  \ meteorological stations. ML models were developed to estimate the water level\
  \ of Eğirdir Lake with only SPI values during dry periods as input. Then, the next\
  \ 10-year (2020–30) SPI values of each station were estimated with LSTM and the\
  \ possible change of Eğirdir Lake water level was examined with the most appropriate\
  \ ML model selected. When analyzing the existing studies in the literature, it was\
  \ seen that ML studies on the prediction of lake water level from meteorological\
  \ drought were limited. In addition, estimating lake levels using only the dry periods\
  \ of the SPI series and forecasting possible level changes with LSTM also reveal\
  \ the novelty of the study.\n\n## 12.2. Materials and methods\n\n### 12.2.1 Study\
  \ region\n\nLake Eğirdir is the second largest freshwater lake in Turkey, located\
  \ within the borders of Isparta Province, formed by tectonic and karst effects.\
  \ It is located between 35°37′41″ and 38°16′55″ northern latitudes and 30°44′39″\
  \ and 30°57′43″ eastern longitudes (Fig. 12–1). The lake, which has steep rocks\
  \ and a flat and shallow bottom, has a shoreline length of 150 km. Another of the\
  \ most important features of Lake Eğirdir is its connection with the sea. The waters\
  \ coming to Kovada Lake through the 22 km Kovada canal were discharged from the\
  \ Kovada Valley to Aksu Stream and from there to the Mediterranean via karst paths.\
  \ For the last 20 years, the waters of the lake have been flowing to the Karacaören\
  \ I and II Dams built in the Çandır Plain.\n\n![Figure 12–1 The study region. Map\
  \ lines delineate study areas and do not necessarily depict accepted national boundaries.](img/F000055f12-01-9780443219054.jpg)\n\
  \nFigure 12–1 The study region. Map lines delineate study areas and do not necessarily\
  \ depict accepted national boundaries.\n\nThe most important water inputs feeding\
  \ the lake are the springs from the bottom of the lake. At the same time, there\
  \ are many large and small streams and streams descending from the surrounding mountains\
  \ and fed by rainwater. The most important of these are the Pupa Stream, which comes\
  \ from Yalvaç district and flows into the lake from Gelendost district, passing\
  \ through Akçay, Uluborlu and Senirkent districts, Değirmen Stream descending from\
  \ Hoyran Plain, and Aksu Stream, which connects to the lake with a channel from\
  \ Aksu Stream. Eğirdir Lake meets the drinking water needs of Isparta province and\
  \ surrounding settlements. It is also used as irrigation water in the plains of\
  \ Isparta, Gönen, Uluborlu, Senirkent, Yalvaç, Gelendost, and Eğirdir (URL-1).\n\
  \n## 12.2.2 Standardized precipitation index\n\nSPI is a widely used method developed\
  \ by McKee et al. (1993) to monitor meteorological drought. Abnormalities in dry\
  \ or wet events at any time scale in a region can be determined by SPI, which depends\
  \ on only precipitation parameter. It is the index value (SPI) obtained by dividing\
  \ the difference of the precipitation value (*X*[*i*]) from the mean (*X*[mean])\
  \ for the specified period by the standard deviation (*σ*)![Equation](img/F000055si1.png))\
  \ (Eq. 12.1).\n\n${SPI} = \\\\left( \\\\frac{x\\_{i}{- x}\\_{mean}}{\\\\sigma} \\\
  \\right)$<mml:math><mml:mi mathvariant=\"normal\">SPI</mml:mi><mml:mo>=</mml:mo><mml:mo>(</mml:mo><mml:mfrac><mml:mrow><mml:msub><mml:mrow><mml:mi>x</mml:mi></mml:mrow><mml:mrow><mml:mi>i</mml:mi></mml:mrow></mml:msub><mml:msub><mml:mrow><mml:mo>&#8722;</mml:mo><mml:mi>x</mml:mi></mml:mrow><mml:mrow><mml:mi\
  \ mathvariant=\"normal\">mean</mml:mi></mml:mrow></mml:msub></mml:mfrac><mml:mo>)</mml:mo></mml:math>\
  \ (12.1)\n\n![Equation](img/F000055si2.png)(12.1)  \n\n## 12.2.3 Machine learnings\
  \ algorithms\n\nML uses a variety of computational methods to generate knowledge\
  \ from data. Data scientists note that there is no best, one-size-fits-all algorithm\
  \ for solving a problem. The type of algorithm to be used to obtain the best model\
  \ may vary depending on the problem type and the number of variables. ML is broadly\
  \ classified into four groups: supervised (in case of smaller amount of data and\
  \ clearly labeled for training), unsupervised (usually for large datasets), semisupervised\
  \ (where unlabeled data are available and retrieving labeled data are exhausting),\
  \ and reinforcement learning (maximizing cumulative reward concept in an environment\
  \ of software agents) (Mahesh, 2020). In this study, kNN, SVR, adaptive boosting\
  \ (AdaBoost), RF, Extra trees (ET), gradient boosting regressor (GBR), eXtreme gradient\
  \ boosting (XGBoost), and CatBoost algorithms were used.\n\n#### 12.2.3.1 k-nearest\
  \ neighbors\n\nkNN is a nonparametric ML algorithm proposed by Shakhnarovich et\
  \ al. (2008). It relies on data training to predict outcomes. The term closest to\
  \ the output using the training data is measured by distance. For a data point,\
  \ the kNN algorithm determines points that are close and similar to the training\
  \ data and averages the values of these points (Lee et al., 2021; Twumasi & Twumasi,\
  \ 2022).\n\n#### 12.2.3.2 Support vector regression\n\n\n\n\nProposed by `Cortes`\
  \ and [`Vapnik` (1995), `SVR` is an ML technique where a model learns the significance\
  \ of a variable to characterize the relationship between input and output (`Zhang\
  \ & O'Donnell`, 2020). It is a statistical learning algorithm that allows reaching\
  \ a universal solution with a small number of examples. This algorithm is a powerful\
  \ regression approach for estimating linear and nonlinear systems and has been widely\
  \ used in different studies to solve estimation problems (`Malik` et al., 2021).\
  \ Moreover, having high prediction accuracy increases generalization ability (`Awad`\
  \ et al., 2015).\n\n#### 12.2.3.3 Adaptive boosting\n\n`AdaBoost` is one of the\
  \ ensemble algorithms obtained by combining weak learning algorithms such as `DTs`\
  \ to create a stronger learning algorithm. During training of the model, a weight\
  \ `w[i]` is assigned to each sample and this weight is recalculated iteratively.\
  \ At each iteration, `AdaBoost` changes the weight `w[i]` to reduce the error by\
  \ reaching training samples with higher error in the prediction value, so that each\
  \ subsequent regression tree has a reweighted training data set (`Drucker`, 1997).\n\
  \n#### 12.2.3.4 Random forest\n\n`RF` is an ML algorithm used to solve classification\
  \ and regression problems that combines the output of multiple randomly generated\
  \ `DTs`. It is an alternative technique that provides improved prediction success\
  \ than general classification and regression tree models (`Vrontos` et al., 2021).\
  \ Random decision forests in this ensemble learning method, which makes class (classification)\
  \ or number (regression) predictions according to the type of problem by creating\
  \ many `DTs` in the training phase for classification, regression, and other tasks,\
  \ eliminates the problems of overfitting `DTs` to training sets (`Lee` et al., 2021).\n\
  \n#### 12.2.3.5 Extra tree algorithm\n\n`ET`, one of the ensemble learning methods\
  \ that belongs to the family of `DT`-based models, separates the nodes with randomly\
  \ selected cutoff points, unlike other tree-based combination methods. It uses the\
  \ entire learning sample when evolving trees to minimize bias (`Geurts` et al.,\
  \ 2006). When creating a `DT`, the dependency relationship of extracted data samples\
  \ is used (`Kumar` et al., 2022; `Sharaff & Gupta`, 2019). The `DT` selects the\
  \ best features based on Gini index given in `Eq. (12.2)`.\n\n$\\\\mathit{gini}\\\
  \\left( D \\\\right) = 1 - \\\\sum\\\\limits\\_{i = 1}^{m}P\\_{i}^{2}$<mml:math><mml:mi\
  \ mathvariant=\"italic\">gini</mml:mi><mml:mrow><mml:mfenced close=\")\" open=\"\
  (\"><mml:mrow><mml:mi>D</mml:mi></mml:mrow></mml:mfenced></mml:mrow><mml:mo>=</mml:mo><mml:mn>1</mml:mn><mml:mo>&#8722;</mml:mo><mml:munderover><mml:mo>&#8721;</mml:mo><mml:mrow><mml:mi>i</mml:mi><mml:mo>=</mml:mo><mml:mn>1</mml:mn></mml:mrow><mml:mrow><mml:mi>m</mml:mi></mml:mrow></mml:munderover><mml:mrow><mml:msubsup><mml:mrow><mml:mi>P</mml:mi></mml:mrow><mml:mrow><mml:mi>i</mml:mi></mml:mrow><mml:mrow><mml:mn>2</mml:mn></mml:mrow></mml:msubsup></mml:mrow></mml:math>\
  \ (12.2)\n\n![Equation](img/F000055si3.png)(12.2) \n\nwhere *m* denotes the number\
  \ of output labels and *P*[*i*] represents the probability of belonging to the *i*th\
  \ output label in the *D* dataset (`Du` et al., 2023).\n\n#### 12.2.3.6 Gradient\
  \ boosting regressor\n\n`GBR`, an integrated model having higher performance and\
  \ stability, is a technique that extends the boosting algorithm for solving the\
  \ regression problem proposed by `Friedman` (2001). It uses negative gradients of\
  \ the loss function, such as least squares and least absolute deviation, to solve\
  \ the minimum value. `GBR`, which can handle well the noisy and unclean data, support\
  \ different loss functions, and has powerful prediction capability for nonlinear\
  \ data, is widely used in research. It prevents the problem of overfitting during\
  \ the `DT` learning phase by stopping the growth of the tree as soon as possible\
  \ (`Li` et al., 2018).\n\n#### 12.2.3.7 eXtreme gradient boosting\n\n`XGBoost` by\
  \ developed by `Chen` and [`Guestrin` (2016), is as an improved version of gradient\
  \ boosting. It has the added benefit of parallel tree boosting and uses a gradient\
  \ boosting framework. The algorithm overcomes overfitting and achieves higher performance,\
  \ and additionally uses parallel operations, which reduces computation time. Many\
  \ weak learners are combined using `XGBoost` to predict the output with a boosting\
  \ method (`Naghibi` et al., 2020).\n\n#### 12.2.3.8 Category boosting\n\n`CatBoost`,\
  \ a gradient `DT` algorithm that can handle categorical features better, uses the\
  \ entire data set for training. Thus it provides categorical characteristics with\
  \ minimal loss of information (`Prokhorenkova` et al., 2018). It can combine all\
  \ categorical features into one new feature. Additionally, it overcomes deviations\
  \ in the solution with its sequential boosting feature and provides faster results\
  \ (`Huang` et al., 2019).\n\n## 12.3 Results and discussion\n\nIn this study, the\
  \ effect of meteorological droughts on Eğirdir Lake water level was examined with\
  \ ML algorithms. For this, firstly, SPI values were calculated for meteorological\
  \ drought in a 12-month period using precipitation data from Eğirdir, Senirkent,\
  \ Uluborlu, Yalvaç, and Isparta meteorological stations between 1976 and 2019 (`Fig.\
  \ 12–2`). Secondly, ML models were developed to estimate the water level of Lake\
  \ Eğirdir by using only SPI values during dry periods as input. Then, SPI values\
  \ for the next 10 years (2020–30) of each station were forecasted with LSTM and\
  \ the possible change of Eğirdir Lake water level was examined with the most appropriate\
  \ ML model.\n\n![Figure 12–2 Time series of 12-month standardized precipitation\
  \ index values.](img/F000055f12-02a-9780443219054.jpg)\n\nFigure 12–2 Time series\
  \ of 12-month standardized precipitation index values.\n\nWhen `Fig. 12–2` was examined,\
  \ a total of 281 months were dry at Eğirdir station, 265 months at Senirkent station,\
  \ 237 months at Uluborlu station, 217 months at Yalvaç station, and 241 months at\
  \ Isparta station. While in October 2007, for Eğirdir, Senirkent, and Yalvaç stations\
  \ the lowest SPI values were obtained as −2.55, −2.03, and −3.24, respectively,\
  \ they were found as −2.78 and −2.82, respectively, in Uluborlu and Isparta stations\
  \ in November 1990. At the same time, an SPI value of −2.38 was obtained at Senirkent\
  \ station in November 1990, and −2.86 at Isparta station in February 2000. The common\
  \ dry period of all stations was determined as 127 months. ML models were developed\
  \ using kNN, `SVR`, `AdaBoost`, `RF`, `ET`, `GBR`, `XGBoost`, and `CatBoost` algorithms.\
  \ In the models, the dry values of these five stations in the study region were\
  \ used as input, and the lake water level in these dry months was estimated. The\
  \ determination coefficient (*R*²) and root mean square error (RMSE) of the developed\
  \ ML models are shown in `Table 12–1`. The calculation of *R*² and RMSE values are\
  \ given in `Eqs. 12.3` and `12.4`, respectively.\n\n\n\n$R^{2} = 1 - \\frac{\\\\\
