  \ (10–6)\n\n![Equation](img/F00002Xsi6.png)(10–6)\n\n气候变化对旅游业的影响也从旅游场所的角度进行了研究。例如，Pons-Pons\
  \ et al. (2012) 模拟了安道尔冬季滑雪旅游的影响。 Hein et al. (2009) 通过评估西班牙的五个不同旅游区域进行了另一项特定地点的研究。\
  \ Bigano, Hamilton, et al. (2008) 提供了多国模型来理解海平面上升对旅游业的影响。 Carrillo et al. (2022)\
  \ 使用天气预报模型研究了加那利群岛的影响。 还有替代研究来运行计算模型，以了解气候变化对北美、地中海、葡萄牙、西藏、德国-瑞士和奥地利阿尔卑斯山以及加拿大落基山脉等广泛和较小区域选择的影响\
  \ (Bigano, Bosello, et al., 2008; Pintassilgo et al., 2016; Scott et al., 2004,\
  \ 2007; Soboll & Dingeldey, 2012; Zhong et al., 2019)。 这些选择指出了确保受欢迎的旅游目的地以及在气候变化的负面影响下全国性参观区域可持续性的重要性。\n\
  \n### 10.3.2 旅游业对气候影响的计算模型\n\n当情景转向旅游业引发气候变化/危机的情况时，基于计算建模的显著研究。 这些研究广泛考虑了旅游活动造成的温室气体排放。\
  \ 例如， Kelly and Williams (2007) 引入了目的地规划策略的模型，其中包含能源使用和气体排放状态。 基于惠斯勒、不列颠哥伦比亚省（北美的一座山地度假胜地），他们通过考虑诸如旅行流量（`PerKmTr`：出行人公里）和建筑物中的能源消耗等方面来衡量能源和气体排放：\n\
  \n${\\\\mathit{Per}\\\\mathit{Km}\\\\mathit{Tr}}\\_{x} = \\\\sum\\\\limits\\_{y\
  \ = 1}^{m}\\\\left( \\\\mathit{empl}\\_{y} \\\\times \\\\mathit{work}\\\\\\_\\\\\
  mathit{days} \\\\times {\\\\mathit{return}\\\\\\_\\\\mathit{dist}}\\_{y} \\\\times\
  \ {{mod}\\\\\\_\\\\mathit{spl}}\\_{\\\\mathit{xy}} \\\\right)$<mml:math><mml:msub><mml:mrow><mml:mi\
