  \ Methodology\n\n### 4.4.1 Autoregressive integrated moving average\n\nBox and Jenkins\
  \ 提出了使用 ARIMA 作为表示随机信号的模型 (Box & Jenkins, 1970)。它是自回归移动平均 ARMA 模型的推广版本。ARMA 模型通常应用于广义平稳随机信号。然而，如果信号或数据在均值意义上是非平稳的，则应用\
  \ ARIMA 模型。因此，在数据或信号具有非平稳性质的情况下，它在预测问题中被广泛使用。在表示 ARMA 模型时，它表示为 `ARMA(p,q)`，其中 `p`\
  \ 是自回归 AR 部分的阶数，`q` 是移动平均 MA 部分的阶数。类似地，ARIMA 模型表示为 `ARIMA(p,d,q)`，其中 `p` 和 `q` 的含义与\
  \ ARMA 模型中的相同。然而，在 ARIMA 模型中，还有一个额外的参数 `d`，它指的是对原始数据进行差分以使其平稳的次数。\n\n设 `x[t]` 表示时间\
  \ `t` 时时间序列数据的取值或观测值。使用 `ARMA(p,q)` 模型表示该信号可表示如下：\n\n`x[t] = θ[1]x[t-1] + θ[2]x[t-2]\
  \ + … + θ[p]x[t-p] + Φ[0]e[t-0] + Φ[1]e[t-1] + … + Φ[q]e[t-q]`，<mml:math><mml:msub><mml:mrow><mml:mi>x</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>=</mml:mo><mml:msub><mml:mrow><mml:mi>&#952;</mml:mi></mml:mrow><mml:mrow><mml:mn>1</mml:mn></mml:mrow></mml:msub><mml:msub><mml:mrow><mml:mi>x</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mn>1</mml:mn></mml:mrow></mml:msub><mml:mo>+</mml:mo><mml:msub><mml:mrow><mml:mi>&#952;</mml:mi></mml:mrow><mml:mrow><mml:mn>2</mml:mn></mml:mrow></mml:msub><mml:msub><mml:mrow><mml:mi>x</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mn>2</mml:mn></mml:mrow></mml:msub><mml:mo>+</mml:mo><mml:mo>&#8230;</mml:mo><mml:mo>+</mml:mo><mml:msub><mml:mrow><mml:mi>&#952;</mml:mi></mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:msub><mml:msub><mml:mrow><mml:mi>x</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mi>p</mml:mi></mml:mrow></mml:msub><mml:mo>+</mml:mo><mml:msub><mml:mrow><mml:mi\
  \ mathvariant=\"normal\">&#934;</mml:mi></mml:mrow><mml:mrow><mml:mn>0</mml:mn></mml:mrow></mml:msub><mml:msub><mml:mrow><mml:mi>e</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mn>0</mml:mn></mml:mrow></mml:msub><mml:mo>+</mml:mo><mml:msub><mml:mrow><mml:mi\
  \ mathvariant=\"normal\">&#934;</mml:mi></mml:mrow><mml:mrow><mml:mn>1</mml:mn></mml:mrow></mml:msub><mml:msub><mml:mrow><mml:mi>e</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mn>1</mml:mn></mml:mrow></mml:msub><mml:mo>+</mml:mo><mml:mo>&#8230;</mml:mo><mml:mo>+</mml:mo><mml:msub><mml:mrow><mml:mi\
  \ mathvariant=\"normal\">&#934;</mml:mi></mml:mrow><mml:mrow><mml:mi>q</mml:mi></mml:mrow></mml:msub><mml:msub><mml:mrow><mml:mi>e</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mi>q</mml:mi></mml:mrow></mml:msub><mml:mo>,</mml:mo></mml:math>\
  \ (4.1)\n\n![Equation](img/F000031si1.png)(4.1)\n\n其中 `θ` 和 `Φ` 分别是 AR 和 MA 系数。项\
  \ `e[t]` 表示随机信号中的误差项。ARIMA 模型是 ARMA 模型的推广版本，使用 `ARIMA(p,d,q)` 模型表示信号为\n\n`y[t] =\
  \ θ[1]y[t-1] + θ[2]y[t-2] + … + θ[p]y[t-p] + Φ[0]e[t-0] + Φ[1]e[t-1] + … + Φ[q]e[t-q]`，<mml:math><mml:msub><mml:mrow><mml:mi>y</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>=</mml:mo><mml:msub><mml:mrow><mml:mi>&#952;</mml:mi></mml:mrow><mml:mrow><mml:mn>1</mml:mn></mml:mrow></mml:msub><mml:msub><mml:mrow><mml:mi>y</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mn>1</mml:mn></mml:mrow></mml:msub><mml:mo>+</mml:mo><mml:msub><mml:mrow><mml:mi>&#952;</mml:mi></mml:mrow><mml:mrow><mml:mn>2</mml:mn></mml:mrow></mml:msub><mml:msub><mml:mrow><mml:mi>y</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mn>2</mml:mn></mml:mrow></mml:msub><mml:mo>+</mml:mo><mml:mo>&#8230;</mml:mo><mml:mo>+</mml:mo><mml:msub><mml:mrow><mml:mi>&#952;</mml:mi></mml:mrow><mml:mrow><mml:mi>p</mml:mi></mml:mrow></mml:msub><mml:msub><mml:mrow><mml:mi>y</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mi>p</mml:mi></mml:mrow></mml:msub><mml:mo>+</mml:mo><mml:msub><mml:mrow><mml:mi\
  \ mathvariant=\"normal\">&#934;</mml:mi></mml:mrow><mml:mrow><mml:mn>0</mml:mn></mml:mrow></mml:msub><mml:msub><mml:mrow><mml:mi>e</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mn>0</mml:mn></mml:mrow></mml:msub><mml:mo>+</mml:mo><mml:msub><mml:mrow><mml:mi\
  \ mathvariant=\"normal\">&#934;</mml:mi></mml:mrow><mml:mrow><mml:mn>1</mml:mn></mml:mrow></mml:msub><mml:msub><mml:mrow><mml:mi>e</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mn>1</mml:mn></mml:mrow></mml:msub><mml:mo>+</mml:mo><mml:mo>&#8230;</mml:mo><mml:mo>+</mml:mo><mml:msub><mml:mrow><mml:mi\
  \ mathvariant=\"normal\">&#934;</mml:mi></mml:mrow><mml:mrow><mml:mi>q</mml:mi></mml:mrow></mml:msub><mml:msub><mml:mrow><mml:mi>e</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mi>q</mml:mi></mml:mrow></mml:msub><mml:mo>,</mml:mo></mml:math>\
  \ (4.2)\n\n![Equation](img/F000031si2.png)(4.2)\n\n其中 `y[t]` 是差分后的时间序列信号。此外，`θ`\
  \ 和 `Φ` 分别表示 AR 和 MA 系数。ARIMA 模型中的项 `d` 是差分的阶数，差分后的时间序列根据该参数的值获得。例如，如果 `d` 选择为 1，则\
  \ `y[t]` 变为 `y[t] = x[t] - x[t-1]`<mml:math><mml:msub><mml:mrow><mml:mi>y</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>=</mml:mo><mml:msub><mml:mrow><mml:mi>x</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>&#8722;</mml:mo><mml:msub><mml:mrow><mml:mi>x</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mn>1</mml:mn></mml:mrow></mml:msub></mml:math>![Equation](img/F000031si3.png)。\n\
  \n### 4.4.2 Prophet model\n\n\n\n\n\nTaylor and Letham (2018) 提出了 `Prophet` 模型作为一种具有可解释参数的模块化回归模型。它允许研究人员应用他们对数据的知识。因此\
  \ `Prophet` 模型具有使用统计预测和判断预测的优势。时间序列信号可以用 `Prophet` 模型写成如下形式：\n\n*x*[*t*] = *g*[*t*] + *s*[*t*] + *h*[*t*] + *e*[*t*],<mml:math><mml:msub><mml:mrow><mml:mi>x</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>=</mml:mo><mml:msub><mml:mrow><mml:mi>g</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:msub><mml:mrow><mml:mo>+</mml:mo><mml:mi>s</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>+</mml:mo><mml:msub><mml:mrow><mml:mi>h</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>+</mml:mo><mml:msub><mml:mrow><mml:mi>e</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>,</mml:mo></mml:math>\
  \ (4.3)\n\n![Equation](img/F000031si4.png)(4.3)\n\n其中 `g[t]` 表示信号的趋势项，而 `s[t]` 表示数据中的周期性变化。项\
  \ `h[t]` 表示假日期项并代表假期对数据的影响。`Prophet` 模型的这一特性对于金融数据非常有用。最后，`e[t]` 是误差项，表示数据的随机特征。为了预测数据中的季节性效应，`Prophet`\
  \ 利用傅里叶级数展开 (Wang et al., 2022)。\n\n### 4.4.3 长短期记忆\n\n`LSTM` 最初由 Hochreiter and\
  \ Schmidhuber (1997) 提出，其主要目标是解决梯度消失问题。`LSTM` 架构是用于处理序列数据的 `GRU` 模型的高级变体 (Kirbas,\
  \ 2019)。正如 Gers et al. (2000) 详细描述的，一个 `LSTM` 层由输入、输出和遗忘门组成。输入门和输出门调节层内输入和输出数据的流动，而遗忘门负责擦除单元记忆\
  \ (Gers et al., 2000)。用 `i[t]`、`o[t]` 和 `f[t]` 分别表示输入、输出和遗忘门，一个 `LSTM` 层在数学上表示如下：\n\
  \n*i*[*t*] = *σ*(*W*[*i*]\\[*h*[*t* − 1],*x*[*t*]\\]+*b*[*i*])<mml:math><mml:msub><mml:mrow><mml:mi>i</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>=</mml:mo><mml:mi>&#963;</mml:mi><mml:mrow><mml:mfenced\
  \ close=\")\" open=\"(\"><mml:mrow><mml:msub><mml:mrow><mml:mi>W</mml:mi></mml:mrow><mml:mrow><mml:mi>i</mml:mi></mml:mrow></mml:msub><mml:mrow><mml:mfenced\
  \ close=\"\\]\" open=\"\\\"><mml:mrow><mml:msub><mml:mrow><mml:mi>h</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mn>1</mml:mn></mml:mrow></mml:msub><mml:mo>,</mml:mo><mml:msub><mml:mrow><mml:mi>x</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub></mml:mrow></mml:mfenced></mml:mrow><mml:mo>+</mml:mo><mml:msub><mml:mrow><mml:mi>b</mml:mi></mml:mrow><mml:mrow><mml:mi>i</mml:mi></mml:mrow></mml:msub></mml:mrow></mml:mfenced></mml:mrow></mml:math>\n\
  \n![Equation\n\n*o*[*t*] = *σ*(*W*[*o*]\\[*h*[*t* − 1],*x*[*t*]\\]+*b*[*o*])<mml:math><mml:msub><mml:mrow><mml:mi>o</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>=</mml:mo><mml:mi>&#963;</mml:mi><mml:mrow><mml:mfenced\
  \ close=\")\" open=\"(\"><mml:mrow><mml:msub><mml:mrow><mml:mi>W</mml:mi></mml:mrow><mml:mrow><mml:mi>o</mml:mi></mml:mrow></mml:msub><mml:mrow><mml:mfenced\
  \ close=\"\\]\" open=\"\\\"><mml:mrow><mml:msub><mml:mrow><mml:mi>h</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mn>1</mml:mn></mml:mrow></mml:msub><mml:mo>,</mml:mo><mml:msub><mml:mrow><mml:mi>x</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub></mml:mrow></mml:mfenced></mml:mrow><mml:mo>+</mml:mo><mml:msub><mml:mrow><mml:mi>b</mml:mi></mml:mrow><mml:mrow><mml:mi>o</mml:mi></mml:mrow></mml:msub></mml:mrow></mml:mfenced></mml:mrow></mml:math>\
  \ (4.4)\n\n![Equation(4.4)\n\n*f*[*t*] = *σ*(*W*[*f*]\\[*h*[*t* − 1],*x*[*t*]\\\
  ]+*b*[*f*]),<mml:math><mml:msub><mml:mrow><mml:mi>f</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>=</mml:mo><mml:mi>&#963;</mml:mi><mml:mrow><mml:mfenced\
  \ close=\")\" open=\"(\"><mml:mrow><mml:msub><mml:mrow><mml:mi>W</mml:mi></mml:mrow><mml:mrow><mml:mi>f</mml:mi></mml:mrow></mml:msub><mml:mrow><mml:mfenced\
  \ close=\"\\]\" open=\"\\\"><mml:mrow><mml:msub><mml:mrow><mml:mi>h</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mn>1</mml:mn></mml:mrow></mml:msub><mml:mo>,</mml:mo><mml:msub><mml:mrow><mml:mi>x</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub></mml:mrow></mml:mfenced></mml:mrow><mml:mo>+</mml:mo><mml:msub><mml:mrow><mml:mi>b</mml:mi></mml:mrow><mml:mrow><mml:mi>f</mml:mi></mml:mrow></mml:msub></mml:mrow></mml:mfenced></mml:mrow><mml:mo>,</mml:mo></mml:math>\n\
  \n![Equation\n\n其中变量 `b[i]`、`b[o]` 和 `b[f]` 是偏置参数，而 `W[i]`、`W[o]` 和 `W[f]` 分别表示输入、输出和遗忘权重参数。`σ(.)`\
  \ 在 Eq. (4.4) 中是 sigmoid 激活函数。向量 `h[t]` 是时间 `t` 处的隐藏状态，由下式给出\n\n*h*[*t*] = *o*[*t*] ⊙ tan *h*(*c*[*t*]),<mml:math><mml:msub><mml:mrow><mml:mi>h</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>=</mml:mo><mml:msub><mml:mrow><mml:mi>o</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>&#8857;</mml:mo><mml:mi>tan</mml:mi><mml:mi>h</mml:mi><mml:mrow><mml:mfenced\
  \ close=\")\" open=\"(\"><mml:mrow><mml:msub><mml:mrow><mml:mi>c</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub></mml:mrow></mml:mfenced></mml:mrow><mml:mo>,</mml:mo></mml:math>\
  \ (4.5)\n\n![Equation](img/F000031si8.png)(4.5)\n\n其中 `c[t]` = `i[t]` ⊙ `c̃[t]` + `f[t]` ⊙ `c[t\
  \ − 1]`<mml:math><mml:msub><mml:mrow><mml:mi>c</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>=</mml:mo><mml:msub><mml:mrow><mml:mi>i</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>&#8857;</mml:mo><mml:msub><mml:mrow><mml:mover\
  \ accent=\"true\"><mml:mrow><mml:mi>c</mml:mi></mml:mrow><mml:mo>&#732;</mml:mo></mml:mover></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>+</mml:mo><mml:msub><mml:mrow><mml:mi>f</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>&#8857;</mml:mo><mml:msub><mml:mrow><mml:mi>c</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mn>1</mml:mn></mml:mrow></mml:msub></mml:math>![Equation](img/F000031si9.png)\
  \ 和 ![ent](img/odot_8857.png) 表示哈达玛积。函数 `tan h(.)`<mml:math><mml:mi>tan</mml:mi><mml:mi>h</mml:mi><mml:mrow><mml:mfenced\
  \ close=\")\" open=\"(\"><mml:mrow><mml:mo>.</mml:mo></mml:mrow></mml:mfenced></mml:mrow></mml:math>![Equation](img/F000031si10.png)\
  \ 对应于双曲正切函数。表达式 `c̃[t]`<mml:math><mml:msub><mml:mrow><mml:mover accent=\"true\"\
  ><mml:mrow><mml:mi>c</mml:mi></mml:mrow><mml:mo>&#732;</mml:mo></mml:mover></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub></mml:math>![Equation](img/F000031si11.png)\
  \ 可以表示为\n\n\n\n\n\n`c̃[t]` = `tan h(W[c][h[t-1],x[t]]+b[c])`.<mml:math><mml:msub><mml:mrow><mml:mover\
  \ accent=\"true\"><mml:mrow><mml:mi>c</mml:mi></mml:mrow><mml:mo>&#732;</mml:mo></mml:mover></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub><mml:mo>=</mml:mo><mml:mi>tan</mml:mi><mml:mi>h</mml:mi><mml:mrow><mml:mfenced\
  \ close=\")\" open=\"(\"><mml:mrow><mml:msub><mml:mrow><mml:mi>W</mml:mi></mml:mrow><mml:mrow><mml:mi>c</mml:mi></mml:mrow></mml:msub><mml:mrow><mml:mfenced\
  \ close=\"\\]\" open=\"\\\"><mml:mrow><mml:msub><mml:mrow><mml:mi>h</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi><mml:mo>&#8722;</mml:mo><mml:mn>1</mml:mn></mml:mrow></mml:msub><mml:mo>,</mml:mo><mml:msub><mml:mrow><mml:mi>x</mml:mi></mml:mrow><mml:mrow><mml:mi>t</mml:mi></mml:mrow></mml:msub></mml:mrow></mml:mfenced></mml:mrow><mml:mo>+</mml:mo><mml:msub><mml:mrow><mml:mi>b</mml:mi></mml:mrow><mml:mrow><mml:mi>c</mml:mi></mml:mrow></mml:msub></mml:mrow></mml:mfenced></mml:mrow><mml:mo>.</mml:mo></mml:math>\
  \ (4.6)\n\n![Equation(4.6)\n\n这里，`W[c]` 表示权重参数，而 `b[c]` 是偏置变量。\n\n### 4.4.4 性能评估标准\n\
  \n为了评估 `ARIMA`、`Prophet` 和 `LSTM` 模型在预测方面的有效性，计算了多个误差指标，包括平均绝对误差 (`MAE`)、`MSE`、`RMSE`\
  \ 和平均绝对百分比误差 (`MAPE`)。这些常见的性能指标被用于比较 `ARIMA`、`Prophet` 和 `LSTM` 模型。令 `y` <mml:math><mml:mi>y</mml:mi></mml:math>![Equation](img/F000031si13.png)\
  \ 为表示序列 `x` <mml:math><mml:mi>x</mml:mi></mml:math>![Equation](img/F000031si14.png)\
  \ 未来值的向量，定义为 `y` = `x̃` = [`x[T]` `x[T+1]`…`x[T+k]`] <mml:math><mml:mi>y</mml:mi><mml:mo>=</mml:mo><mml:mover\
