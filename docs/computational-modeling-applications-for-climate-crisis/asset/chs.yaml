  \ 年降雨量很高，而在随后的几年（2019 年和 2022 年）有所下降。原因是大气中污染增加，从而导致全球变暖。此外，可以观察到雪地地区的空气质量良好。雪通过吸收空气中的污染物来减少污染物并改善大气中的空气质量。\n\
  \n## 8.8 废物能源——PM2.5 回收\n\n今天的废物行业遍布循环经济的每个角落和每个心脏。工业 4.0 涉及不同的技术致力于废物管理，其不同阶段包括：废物产生、储存、收集、废物处置和废物处理（[ISWA\
  \ \\[2021–2030\\], n.d](#Ch008_125-155_B9780443219054000043.xhtml#bib39).）。然而，工业\
  \ 5.0 涉及 6R：识别、重新考虑、实现、减少、再利用和回收，以及物流效率设计原则。四 R——维修、减少、再利用和回收——对于思考零废物至关重要。回收是工业再利用的重要成果之一，其中涉及工艺废物；道路上空载的运输车辆属于工艺废物（Demir\
  \ & Cicibaş, 2019）。\n\n\n\n\n\nIndustry 5.0 旨在以人为中心，通过辅助技术的发展并推动实现环境目标（Turner 等,\
  \ 2022）。CC 对废物产生有负面影响。然而，废物处理和处置可能对气候产生积极和消极影响。因此，增加废物管理活动可减少温室气体排放（Waste and Climate\
  \ Change: Global trends and strategy framework. United Nations Environmental Programme\
  \ Division of Technology, n.d.）。废物不是问题，而是解决方案的一部分，也是可再生能源的重要来源；其能量价值可通过焚烧和工业共燃烧等热过程加以利用。废物层级（Waste\
  \ and Climate Change: Global trends and strategy framework. United Nations Environmental\
  \ Programme Division of Technology, n.d.）包括废物预防、再利用、回收、废物能源化和填埋，其中会产生能源浪费（图 8–16）。本研究讨论了\
  \ PM2.5 回收。\n\n![Figure 8–16 Waste to energy.](img/F000043f08-16-9780443219054.jpg)\n\
  \n图 8–16 废物能源化。\n\n电子废物处置和回收活动会排放 PM（Bungadaeng 等, 2019）和多环芳烃（PAHs）（Gu 等, 2010），这些物质会暴露于工人和附近居民，导致各种疾病。根据\
  \ Zheng 等 (2016) 的研究，PM2.5 由致癌和非致癌元素以及 PAH 组成，对人类健康尤其是儿童的危害风险高于成人。电子废物的回收、排放控制以及工人的防护措施在早期阶段并不存在或未得到告知（Kwarteng\
  \ 等, 2022）。\n\nANDRITZ 布袋除尘器用于收集 PM 排放物、灰分再循环以及部分气态污染物的吸收。湿式静电除尘器用于从气流中累积亚微米颗粒和气溶胶（PM10）（Clean\
  \ air for better tomorrow. Air Pollution Control, n.d.）。\n\n在重型柴油车中，使用柴油颗粒过滤器，但由于成本昂贵，大多数燃料车辆或轻型汽车中并未发现颗粒过滤器。\
  \ Han 等 (2015) 提出了一种自供电摩擦电过滤器，用于利用摩擦电化效应从车辆尾气中消除 PM。摩擦电过滤器具有非常巨大的收集能力，PM2.5 的收集效率约为\
  \ ~95.5%，利用尾管的自振动。\n\n### 8.8.1 废物到能源价值转换：用于电极的 PM2.5\n\n从柴油车上，连接空气计量 MV 便携式采样器至发动机排气口，产生并收集\
  \ PM2.5 样品。在观察研究期间，每收集一小时，PM2.5（4–5 mg）样品从空气采样器中的滤膜（PTFE）中收集（图 8–17）。然后，在 900°C\
