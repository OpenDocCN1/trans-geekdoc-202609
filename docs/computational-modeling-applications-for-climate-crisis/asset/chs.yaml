  \ 2017;33:229–237.\n\n## 第 9 章\n\n## 在 Python 框架内开发用于气候变化的深度学习模型\n\nHemaraju Pollayi^1,\
  \ Praveena Rao^2, Dathathreya Chakali^1 和 Pratyusha Bandaru^1, ¹土木工程系，GITAM 大学，海得拉巴，特伦甘纳邦，印度，²土木工程系，航空工程学院，海得拉巴，特伦甘纳邦，印度\n\
  \n## 摘要\n\n气候危机是对地球和人类构成的全球变暖风险，因此开发深度学习（DL）模型以缓解气候变化至关重要。即使是最先进的计算机也无法准确复制地球的气候，因为其复杂性。全球温度的上升，即地球的长期变暖，是由于燃烧化石燃料如煤炭、石油和天然气产生的排放所致。全球和区域气候模型是基于循环神经网络（RNNs）并考虑真实数据开发的，这些真实数据包括地形、土地覆盖和土壤类型。这些全球模型有助于理解人类行为如何影响整个地球。地理模型，通常为几十公里，通常聚焦于特定区域，具有更精细的分辨率，更适合研究对农业、疾病和特定生态系统的影响。在\
  \ Python 框架中执行的操作包括加载原始脏数据集、清洗和预处理。数据集被输入模型以探索区域和全球的可视化。模型训练后并评估其性能后预测全球温度趋势。流行的神经网络如\
  \ RNN、长短期记忆和门控循环单元使用各种优化器如 Adam、SGD、Adamax、Adagrad、Adadelta、RMSProp 和 Nadam 来预测全球温度趋势并评估模型的性能。最后，本研究中说明的\
  \ DL 模型可用于预测地球即将到来的气候变化。\n\n## 关键词\n\n气候危机；全球变暖；循环神经网络；可视化；气候变化\n\n## 9.1 引言\n\n\
  如 Fig. 9–1 所示，世界目前 81 亿的人口预计到 2050 年将增长至约 98 亿，对应美国人口普查局—国际数据库（[`www.census.gov`](http://www.census.gov)）。人口的增加将提高对食物、材料、交通和能源等资源的需求，并提高破坏环境的可能性。\n\
  \n![Figure 9–1 To calculate the global population the U.S. Census Bureau uses data\
  \ from the international Database.](img/F000080f09-01-9780443219054.jpg)\n\nFigure\
  \ 9–1 To calculate the global population the U.S. Census Bureau uses data from the\
  \ international Database.\n\n我们的星球在过去几年经历了剧烈的气候变化。科学家观察到，由于环绕地球的卫星和其他技术创新，全球变暖现在迫在眉睫。自\
  \ 19 世纪末以来，世界平均环境温度已上升 1.62°F（0.9°C），主要是由于人类造成的二氧化碳和其他物质的大气排放增加。大部分变暖发生在过去 35–40\
  \ 年，完全是人类活动的结果。\n\n可以说，全球变暖对文明的最大威胁，其影响变得越来越明显：风暴、干旱、火灾和洪水变得更强、更常见。全球环境正在改变，影响着对人类生存至关重要的农业活动和自然资源。根据\
  \ 2018 年气候破坏全球评估，如果全球在 30 年内不消除温室气体（GHG）排放，地球将遭受灾难性后果（David et al., 2022）。\n\n###\
  \ 9.1.1 全球挑战\n\n除了提高全球温度外，环境变化还导致冰盖融化、冰川后退、降雪减少、海平面上升、北极冰川减少以及海洋 pH 失衡。总体而言，这些问题造成了全球困境。\n\
  \n**[Imp Question] Will humanity be able to protect the Earth for coming generations?**\n\
  \n是的，人类缓解全球变暖的能力可以通过计算智能得到加强。\n\n### 9.1.2 人工智能\n\n人工智能（AI）被描述为机器对认知能力的复制，特别是自动化系统。这些过程涉及学习（收集数据和用于利用它的规则）、构思（应用原则以实现暂定或精确的结果）和自我纠正。AI\
  \ 是一个广泛的术语，具有两个分支：机器学习（ML）和深度学习（DL）。\n\n### 9.1.3 机器学习\n\n利用 ML，系统可以通过收集数据、使用它来学习，然后创建可利用所获得知识得出结论的计算机程序，从而自动变得熟练。\n\
  \n### 9.1.4 深度学习\n\n\n\n\n\nDL 将算法分层排列以自行产生人工神经网络（`ANN`）；这样的系统能够获取信息并做出审慎的决策。`ML`\
  \ 有一个名为 `DL` 的子领域。在人类大脑的运作中，`DL` 中的“深度”一词指的是多个层级的交互或神经元。\n\n`AI` 在有效实施时有潜力改变整个领域。`AI`\
  \ 能够带来技术上的创新进步。以下是 `DL` 在地球上的一些潜在应用：\n\n* 气候建模和天气预报\n* 智慧农业\n* 分布式能源电网。\n\n公共机构（如\
  \ `NASA`）使用它来改善气候和天气模型的功能和有效性。这些数学框架处理的是复杂的数据，例如涉及海洋和大气中流体动力学的算法和科学原理。方程的复杂性需要昂贵、高度耗能的计算。`DL`\
  \ 网络可以大致匹配这些气候模拟的某些特征，这使得计算能够显著更快地运行，并在进行模拟时纳入更多来自真实系统的变量。`AI` 方法的使用可以使这些天气和气候模型受益，以解决偏差问题。\n\
  \n`AI` 具有加快寻求应对气候变化的补救措施的巨大潜力。`AI` 正在帮助研究人员和决策者理解和应对气候变化问题：（1）收集和评估信息，（2）预测，（3）提高系统效率和预测性维护，以及（4）促进下一代技术的发展。尽管这些发展前景广阔，但\
  \ `AI` 在创建气候解决方案方面的应用仍面临三大主要障碍。\n\n首先，`ML` 被用于天平的另一侧。\n\n* 到 2025 年，得益于部署 `AI` 加快天然气和石油的勘探与生产，石油和天然气行业预计将实现\
  \ 4000 亿美元的利润。\n* 此外，还有 `AI` 的绿色足迹问题，随着其应用的扩大和对处理能力的需要增加，其足迹也在增长。\n* 2019 年，其影响非常微小：`AI`\
  \ 仅占全球信息和通信技术行业温室气体排放量 1% 至 2% 的一小部分。然而，随着 `AI` 使用得更频繁且模型变得更复杂，其影响需要密切测量和监控。\n*\
  \ 最后的困难是准确性，尤其是在涉及人员和基础设施安全时。\n* 将 `ML` 应用于电网调节和优化，这具有严格的限制。如果物理原理不正确，`AI` 优化的后果可能是停电，伴随财务损失，甚至可能危及生命——这些是我们绝对不希望发生的。\n\
  \n缓解气候变化是减少排放，而适应则意味着为不可避免的结果做好准备。\n\n* 必须对土地利用、工业、建筑、交通和能源基础设施进行改造以缓解温室气体排放。\n\
  * 考虑到气候和灾难性事件，适应需要为韧性和处理灾难做好准备。\n\n`ML` 有潜力成为降低温室气体排放并帮助社会适应不断变化的环境的非常有效的工具。智能电网到灾害管理都存在有趣的研究问题和良好的商业潜力，以识别高影响问题（全球应对气候变化的努力），在这些问题中\
  \ `ML` 可以与其他学科结合使用以弥补当前差距。\n\n对使用 `DL` 和 `ML` 的水文过程、气候变化和地球系统进行的一项系统综述已发表（Ardabili\
  \ et al., 2020）。为了改善城市韧性并减少全球城市的灾害风险，提出了一种关于天气相关灾难预测的新观点。它依赖于历史灾难数据、气候计算模型和环境测量（Haggag\
  \ et al., 2021）。Chakrabortty et al. (2021) 基于 `ANN`、深度学习神经网络（`DLNN`）和数据库（`DB`）算法方法估计了洪水易感性。Wunsch\
  \ et al. (2022) 考察了环境变化将对 21 世纪德国地下水供应产生的直接影响。`NASA` 的研究人员称地球表面正在升温，并且过去二十年出现了有记录以来最高的气温中的几个（NASA,\
  \ 2024）。Lee et al. (2020) 提出了一种长期、短期记忆框架，一种基于数据的数据黑箱技术，用于湄公河干流 Kratie 站的雨水径流监测程序。最初的基于\
  \ `DL` 的冰川形成预测是通过模拟 21 世纪法国阿尔卑斯山冰川演化而创建的（Bolibar et al., 2022）。地理工程和地球表面温度是与缓解和适应气候变化相关的两个研究领域，其中\
  \ `ML` 和 `DL` 算法的使用最为广泛（Ladi et al., 2022）。`LSTM` 在综合预测五项关键气候因子时，比行业标准的指数平滑和自回归积分移动平均（`ARIMA`）模型高出\
  \ 32%–48%，估计总体均方根误差为 0.91（Malik et al., 2023）。政策制定者和其他利益相关者在制定措施以减少气候变化对农业用地的影响并提高韧性时应将这些结果作为参考。利用预测模型和与气温上升相关的实例，一个深度神经网络预测了\
  \ 2050 年与多环芳烃相关的潜在环境、经济和风险情况（Ki et al., 2021）。根据评估，癌症发病率在西部和南部地区可能会上升超过 50%，超过较不危险的阈值。Lydiri\
  \ et al. (2023) 利用卷积神经网络分析了 Twitter 用户对气候变化的想法。结果表明，我们的方法优于逻辑回归、支持向量机和朴素贝叶斯 `ML`\
  \ 技术。在以南部季风为特征的地区，气候变化及其伴随的高降雨事件对土地资源构成严重威胁（Paramita et al., 2022）。为了估计 Dwarakeswar\
  \ 河流域沟壑塌陷的脆弱性，研究人员研究了 `ANN`、`SVM` 和 `DLNN`。\n\n## 9.2 用于气候变化的深度学习模型\n\n\n\n\n\n\
  在全球应对全球变暖的斗争中，本章力求对 `DL` 在通过创造性研究或高效工程使用时可能产生非常大影响的领域进行全面总结。处理连续数据的一种常见 `DL` 技术是循环神经网络（`RNNs`）。它们已在多个领域得到有效应用，包括自然语言处理、语言建模和语音识别。然而，梯度消失和梯度爆炸问题使得重新训练\
  \ `RNNs` 变得困难。许多 `RNN` 架构，例如门控循环单元（`GRU`）和长短期记忆（`LSTM`）网络，已被提出以解决这些问题。在本章中，作者比较了这些模型并强调了它们的优缺点。\n\
  \n### 9.2.1 循环神经网络\n\n能够处理序列数据的具有循环的神经网络称为 `RNNs`。不幸的是，梯度消失问题阻碍了传统 `RNN` 学习持久依赖关系的能力。两种解决此问题的\
  \ `RNN` 变体是 `GRU` 和 `LSTM`。序列数据处理和循环是 `LSTMs`、`RNNs` 和 `GRUs` 的基本原理。\n\n在 `RNN`\
  \ 中，每个时间步的结果取决于前面的输出以及该时刻的输入。具有仅一个隐藏层并使用基于时间反向传播训练的 `RNN` 类似于 `Elman` 网络，是最基本的类型。然而，梯度消失问题阻碍了典型\
  \ `RNN` 识别随时间持续的依赖关系的能力。Fig. 9–2 显示了标准 `RNN` 和前馈网络的表示。\n\n![Figure 9–2 Representation\
  \ of (A) standard recurrent neural network and (B) feed-forward network.](img/F000080f09-02-9780443219054.jpg)\n\
  \nFigure 9–2 Representation of (A) standard recurrent neural network and (B) feed-forward\
  \ network.\n\nFig. 9–3 显示了 `RNN` 单元的架构。它接收来自当前和先前步骤的信息。这里，tan *h* `tan h` 用作激活函数；然而，你也可以使用不同的激活函数代替。`RNN`\
  \ 的主要特征是其利用隐藏层来解决问题的利用。对于预测目的，`RNNs` 可以利用隐藏层来帮助记忆词（或数据）序列。`RNN` 的隐藏状态由\n\n*h*[*t*]\
  \ = tan h(*W*[*h h*]*h*[*t* − 1]+*W*[*x h*]*x*[*t*]).\n\n![Equation](img/F000080si2.png)(9–1)\n\
  \n![Figure 9–3 Architecture of recurrent neural network unit.](img/F000080f09-03-9780443219054.jpg)\n\
  \nFigure 9–3 Architecture of recurrent neural network unit.\n\n### 9.2.2 长短期记忆网络\n\
  \n`LSTM` 由 Hochreiter and Schmidhuber (1997) 提出。定期地，`LSTM` 将数据存储在其记忆单元中。与记忆单元相连的三个门：遗忘门、输入门和输出门。输入门调节有多少新数据被保留在记忆单元中。输出门调节有多少数据被提取出记忆单元。遗忘门调节有多少数据被从记忆单元中擦除。本质上，每个\
  \ `LSTM` 网络都有三组门来调节信息流和单元来存储数据，如 Figs. 9–4 和 9–5 所示。数据由单元状态通过第一步携带到所有后续时间步而不消失。\n\
