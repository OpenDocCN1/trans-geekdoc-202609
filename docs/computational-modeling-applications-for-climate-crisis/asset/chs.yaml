  \n## 4.6 结论\n\n\n\n\n\n降雨预报对农业、灾害管理以及确保粮食和水安全至关重要。农民依靠短期和长期的降水预测来决定种植和收获时间，以最大化作物产量。水资源管理机构依赖降雨预报来调节水库水位并产生水电。准确的降雨预测对于及时发布洪水和干旱预警以保护生命并最大限度减少损失至关重要。然而，预报由于大气和地形因素以非线性方式相互作用，在复杂、变化的时空模式中难以建模，从而导致不确定性在\
  \ 10 天后增加。\n\n本研究探索了 `ARIMA`、`Prophet` 和 `LSTM` 模型在基于土耳其里泽省 20 年历史气象数据预测月降雨量的有效性。重点在于评估和比较这三种模型在时间序列预测任务中日益流行的预测性能。月降雨序列表现出高度波动性和非平稳性，需要在建模前进行预处理。采用窗口为\
  \ 3 个月和 5 个月的移动平均滤波器来平滑波动并诱导平稳性。信号分解揭示了清晰的、递增的趋势和季节性变化，模型旨在捕捉这些变化。当直接将 `ARIMA`、`Prophet`\
  \ 和 `LSTM` 技术应用于原始数据时，三者均产生了在 2022–23 年评估期间合理追踪实际月降雨波动的预测。然而，采用平滑输入显著增强了其性能。在 3\
  \ 个月滤波数据上训练模型可获得更贴合的预测。使用 5 个月平均输入产生的预测与观测值高度吻合，几乎完美地复制了里泽的降水趋势。这证实了额外的滤波通过进一步减轻时间序列中的噪声和非平稳性来帮助模型。平滑输入更准确地代表了这些技术旨在揭示的平稳信号结构。这使它们能够以最高精度辨别历史降雨模式并将此类学习转化为高度熟练的短期预测。\n\
  \n在这三种方法中，`Prophet` 在直接应用于原始数据时表现出最接近的预测，而 `ARIMA` 在使用预处理输入时实现了最佳预测质量。总体而言，`ARIMA`\
  \ 成为表现最佳者，在不同程度的输入平滑下始终产生比 `Prophet` 和 `LSTM` 更准确的预测。超参数调优过程可用于改进 `LSTM` 模型。在未来的研究中，可利用启发式超参数调优算法以开发性能更好的模型。\n\
