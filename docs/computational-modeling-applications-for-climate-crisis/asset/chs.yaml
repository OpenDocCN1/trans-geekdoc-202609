  \ 20.1562 || 20.3172 || 0.3599 || 0.3628 || 7.2594 || −210.0527 |\n\n## 8.6.1 维沙卡帕特南空气污染物的小时趋势\n\
  \n维沙卡帕特南和沙斯特里那加尔的小时数据是在 2022 年 4 月、7 月、12 月和 2023 年 1 月的连续六天收集的。趋势清楚地显示雨季污染较低（Jayanthi\
  \ & Muralikrishna, 2022）。*x*\\-轴和 *y*\\-轴分别表示小时数和污染物数量。\n\n在收集用于测量空气质量指数（`AQI`）的数据中，存在多个自变量（月度图表），例如\
  \ `PM2.5`、`PM10`、`CO`、`NO[2]`，以及一个因变量（`AQI`）；因此，这被称为多元时间序列。在多元时间序列中，趋势图具有一个以上的时间序列变量。每个变量不依赖于其历史数据，而是依赖于其他变量。\n\
  \n方程如下：\n\n```\nZ1 = a[1] + w[1]10 * y1 + w[1]11 * y2 + e1\n```\n\n![Equation](img/F000043si3.png)(8.3)\n\
  \n```\nZ2 = a[2] + w[1]20 * y1 + w[1]21 * y2 + e1\n```\n\n![Equation](img/F000043si4.png)(8.4)\n\
  \n这里，\n\n*   `a[1]` 和 `a[2]` 是常数项，\n*   `w[10]`、`w[11]`、`w[20]` 和 `w[21]` 是系数，\n\
  *   `e[1]` 和 `e[2]` 是误差项\n\n同样，对于单变量趋势图（小时图），单一因变量和自变量，线性回归方程如下：\n\n\n\n\n\n`a`\
  \ = `m``b` + `c` (8.5)\n\n![Equation](img/F000043si5.png)(8.5)\n\n这里，\n\n* `a` =\
  \ 自变量\n* `b` = 因变量\n* `m` = 斜率\n* `c` = `y`-截距\n\n1. A. 四月\n\n对于维沙卡帕特南，四月（Fig. 8–2A），观测时间为\
  \ 2022 年 4 月 25 日至 30 日。4 月 27 日，`PM2.5` 为最低，范围为 39–42；同样，`CO` 在 4 月 29 日为最低，范围为\
  \ 20–34；`NO[2]` 在 4 月 30 日为最低，范围为 38–43；`PM10` 在 4 月 28 日为 95–106。\n\n2. B. 2022\
  \ 年七月\n\n七月（Fig. 8–2B），读数考虑自 2022 年 7 月 20 日至 25 日。7 月 24 日，`PM2.5`（40–46）和 `NO[2]`（39–40）均被发现具有最低范围；同样，7\
  \ 月 25 日，`CO`（11–23）和 `PM10`（79–87）均被发现为最低。\n\n3. C. 2022 年十二月\n\n2022 年十二月（Fig.\
  \ 8–2C），观测收集自 2022 年 12 月 1 日至 6 日。12 月 2 日，`PM2.5`（114–119）和 `PM10`（110–113）均有最低值。同样，12\
  \ 月 4 日，`CO`（16–45）和 `NO[2]`（30–35）的最低范围被记录。\n\n4. D. 2023 年一月\n\n本月考虑的观测时间为 2023\
  \ 年 1 月 1 日至 6 日（Fig. 8–2D）。1 月 3 日，`PM2.5` 在 73–93 范围内为最低；同样，`CO` 在 1 月 1 日于 19–31\
  \ 范围内为最低。1 月 2 日，`NO[2]`（28–33）和 `PM10`（86–110）均处于最低值。\n\n![Figure 8–2 (A) April\
  \ month air pollutant trends. (B) July month air pollutant trends. (C) December\
  \ month air pollutant trends. (D) January month air pollutant trends.](img/F000043f08-02a-9780443219054.jpg)\n\
  \nFigure 8–2 (A) April month air pollutant trends. (B) July month air pollutant\
  \ trends. (C) December month air pollutant trends. (D) January month air pollutant\
  \ trends.\n\n## 8.6.2 空气质量指数小时趋势：2022 年四月、七月、十二月和 2023 年一月——维沙卡帕特南\n\n`AQI` 的趋势显示了维沙卡帕特南大气中空气质量的增减（Fig.\
