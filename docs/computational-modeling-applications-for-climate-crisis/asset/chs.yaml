  ## 6.4 气候变化适应\n\n联合国秘书长安东尼奥·古特雷斯曾评论道“气候变化是我们这个时代的决定性问题……我们每一天不作为，都是我们更接近我们都不想要的命运的一天——一个将在人类和地球生命造成的损害中世代回响的命运”（[`www.undrr.org/climate-action-and-disaster-risk-reduction`](https://www.undrr.org/climate-action-and-disaster-risk-reduction)）。\n\
  \n有令人信服的证据表明全球平均气温和海洋温度上升，雪和冰加速融化，海平面上升。这种深刻的转变导致气候变化，进而以两种重要方式加剧灾害风险。\n\n1. 1.\
  \ 天气和气候灾害的放大，以及\n2. 2. 由于生态系统退化以及水和粮食资源可用性减少，社区对自然灾害的脆弱性加剧。\n\n某些地区经历了加剧的干旱、作物受损以及野火风险增加。相反，降水增加的地区容易发生洪水和山体滑坡，这通常会导致大量人员伤亡和资产损失。\n\
  \n政府间气候变化专门委员会（`IPCC`）将减缓描述为“人为干预以减少气候系统的人为强迫；它包括减少温室气体来源和排放以及增强温室气体汇的策略”（Edenhofer,\
  \ 2014）。\n\n各种机器学习技术已应用于气候研究，例如降雨预测，以及使用多层感知器神经网络算法预测干旱（Ali et al., 2017）。开发了一个`ANN`模型来估算土耳其的日平均年太阳辐射，从而创建了基于卫星的太阳辐射图（Şahin\
  \ et al., 2013）。地理信息系统和贝叶斯信念网络被引入用于评估多伦多的洪水脆弱性指数（Abebe et al., 2018）。`ANN`模型已被应用于气候变化适应（`CCA`）政策（Biesbroek\
  \ et al., 2020），而`CNNs`已被用于野火检测（Oh et al., 2020）。此外，在 Jain et al. (2023)的研究中，人工智能（`AI`）已被确定为`CCA`的有前景的工具。\n\
  \n## 6.5 粮食安全——气候变化的影响\n\n气候引起的温度、降水和降雨模式变化已影响产量质量和食品安全。粮食可获得性是确保粮食安全和生活水平的基本方面（Karanth\
  \ et al., 2023）。机器学习（`ML`）算法和基因组预测提供了创新技术，以加快育种工作，增加作物产量以应对干旱和气温升高（Cortés & Lopez-Hernandez,\
  \ 2021）。强降雨增加将导致人类污水溢出污染其他水源，导致各种水源性疾病。强降雨将增加蚊子和其它昆虫的繁殖，导致疟疾、霍乱、登革热、腹泻、伤寒和钩端螺旋体病等各种疾病。此外，温度的轻微上升将影响气候变化，增加人类感染风险。温度升高会危及本土获得性疾病，导致*Campylobacter*\
  \ sp.在食物上生长（Semenza et al., 2012）。温度升高将增加食物中毒和变质的风险，除非采取必要的措施，如延长冷链得到改善（James &\
  \ James, 2010）。气候变化对粮食安全有影响（Uyttendaele et al., 2015）。名为气候变化与食品安全新兴风险（`CLEFSA`）的项目解决了不确定性，并通过科学研究证明了随温度升高食源性疾病的风险（Maggiore\
  \ et al., 2020）。\n\n## 6.6 预测气候和天气\n\n### 6.6.1 TrajGRU 临近预报\n\n临近预报是指开发`AI`算法用于超短期预报。使用遥感技术，它可提前约\
  \ 3 小时预测天气。临近预报与局部天气现象有关，例如雷暴、气旋和极端温度变化。超短程预报为 0 至 6 小时，短程预报长达 72 小时。临近预报描述当前天气状况并外推数小时，假设预测降水模式没有显著改变。\n\
  \n布鲁诺·凯斯勒基金会和 Arpae 引入了两种不同的`TrajGRU`方法用于临近预报意大利北部气候：\n\n1. 1. 2022 年 5 月 28 日意大利北部的一次对流事件\n\
  2. 2. 2022 年 4 月 22 日的一次层状事件。\n\n对流涉及在不稳定环境中由于上升气流和下沉气流导致大气中热量和湿气的垂直输送。相比之下，层状是指大范围气流因大尺度风和大气动力学迫使它们斜向叠加的情况。\n\
  \n变量反射率（`Z_60`）和其他此类纬度、经度、地理地图限制以及以度为单位的数据分辨率。\n\n\n\n\n\nThe data was obtained\
  \ from ([`climateindex.eu/`](https://climateindex.eu/)) for this study. `TrajGRU`\
  \ model 1 utilizes on reflectivity images as training inputs for nowcasting forecast\
  \ as shown in Fig. 6–5. This figure showcases reflectivity images used as inputs,\
  \ with distinct color gradients representing varying intensities of precipitation.\
  \ Patterns can be observed for the convective event on May 28, 2022, and the stratiform\
  \ event on April 22, 2022. Annotations indicate key geographical areas and meteorological\
  \ phenomena. The map boundaries, latitude, and longitude lines provide geographical\
  \ context to the forecasted regions.\n\n![Figure 6–5 Visualization of the TrajGRU\
  \ model 1 outputs for nowcasting forecasts in Northern Italy. Map lines delineate\
  \ study areas and do not necessarily depict accepted national boundaries.](img/F000092f06-05-9780443219054.jpg)\n\
  \nFigure 6–5 Visualization of the `TrajGRU` model 1 outputs for nowcasting forecasts\
  \ in Northern Italy. Map lines delineate study areas and do not necessarily depict\
  \ accepted national boundaries.\n\nThe `TrajGRU` model 2 is trained using reflectivity\
  \ images and lightning data for nowcasting forecast in Fig. 6–6. The lightning data\
