  Figure 9–22 温度误差。\n\n要产生预测或判断，模型会在 ML 和 DL 系统中均使用数据集进行训练。优化过程，即确定理想的模型参数集以最小化训练数据上的误差或损失，是训练过程中的关键步骤。优化算法对任何\
  \ DL 程序的成功至关重要。优化器算法在训练阶段被采用，以确定理想模型的<|message|> 参数配置。上述技术会迭代地修改模型的权重和偏见，直到达到最佳损失值。\n\
  \nKeras 为神经网络模型训练提供了众多优化器。以下优化算法在当前的 DL 中被用于增强神经网络的训练：\n* Adaptive Moment Estimation\
  \ (Adam)\n* Stochastic Gradient Descent (SGD)\n* Adaptive Moment Estimation with\
  \ Infinity Norm (Adamax)\n* Adaptive Gradient Algorithm (Adagrad)\n* Adaptive Delta\
  \ (Adadelta)\n* Root Mean Square Propagation (RMSProp)\n* Nesterov Adaptive Moment\
  \ Estimation (Nadam).\n\n各种优化器的优缺点在 Table 9–1 中进行了汇总。在第一步，构建并训练 LSTM 模型以预测全球温度趋势，其中\
  \ activation=`linear`，optimizer=`adam`，loss=`mse`。在第二步，构建并训练 GRU 模型以预测全球温度趋势，其中\
  \ activation=`linear`，optimizer=`adam`，loss=`mse`。在第三步，构建并训练 RNN 模型以预测全球温度趋势，其中\
  \ activation=`linear`，optimizer=`adam`，loss=`mse`。在 Table 9–2 中，可训练参数分别为 53,051、40,251\
  \ 和 13,301，对应 LSTM、GRU 和 RNN。\n\n### Table 9–1\n各种优化器的优缺点。\n\n| S. No. | Optimizer\
  \ | Advantages | Disadvantages |\n| --- | --- | --- | --- |\n| 1 | Adam | • Efficient<br>•\
  \ Ease of implementation<br>• Applicable to large datasets and high-dimensional\
  \ models | Hyperparameter tweaking is necessary |\n| 2 | SGD | • Simple to implement<br>•\
  \ Efficient in computation<br>• Works well with big datasets that have an elevated\
  \ feature space dimensionality | • Inert in the nearby minimum<br>• Extremely sensitive\
  \ to the starting learning rate |\n| 3 | Adamax | • Robust to high-dimensional spaces<br>•\
  \ Performs well in presence of noisy gradients | Computationally expensive |\n|\
  \ 4 | Adagrad | • Adaptive learning rate per parameter<br>• Efficient with sparse\
  \ data | • Stop learning too early<br>• Acquisition rates may rapidly decrease as\
  \ quadratic gradients accumulate |\n| 5 | Adadelta | • Lack of learning rate exceedingly\
  \ precise<br>• Has the ability to adjust the pace of learning even more quickly\
  \ than Adagrad | Rapid convergence is caused by an excessively rapid pace of learning\
  \ adaptation |\n| 6 | RMSProp | • Working well for goals that are not stationary<br>•\
  \ A parameter that restricts the buildup of gradients has an adaptive learning rate\
  \ | Slow convergence rate in some situations |\n| 7 | Nadam | • Little faster training\
  \ time than Adam<br>• Less tuning on hyperparameters | Change optimizer if performance\
  \ of model does not meet expectation |\n\n### Table 9–2\n\n\n\n\n\n长短期记忆 (`LSTM`)、门控循环单元\
