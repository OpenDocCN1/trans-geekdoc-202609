  \ || 0.1 |\n| Ferrovanadium || 1 |\n\n### 8.2.1 来自各种来源的 2.5 um 颗粒物——澳大利亚\n\nTable\
  \ 8–2 表示根据 IQair 污染报告，按年份划分的 PM2.5 总工业排放量。澳大利亚（8）的年均 PM2.5 水平（μg/m³）略高于加拿大（7.7）、新西兰（7.5）和瑞典（6.6）。\n\
  \nTable 8–2\n\nPM2.5 排放更新（`www.npi.gov.au/npidata/action/load/summary-result, n.d`.）。\n\
  \n| Year || Total industry emission (kg) |\n| --- | --- |\n| 2016–17 || 31,000,000\
  \ |\n| --- | --- |\n| 2017–18 || 30,000,000 |\n| 2018–19 || 30,000,000 |\n| 2019–20\
  \ || 30,000,000 |\n| 2020–21 || 29,000,000 |\n\n## 8.3 二氧化氮污染——儿童哮喘\n\nTakenoue\
  \ et al. (2012) 对 NO[2] 暴露与儿童哮喘之间的关系进行了研究。氮二氧化物（NO[2]）是一种无法避免的空气污染物，也是与死亡率相关的最大空气污染物排放源。NO[2]\
  \ 主要是城市污染物，与儿科健康问题相关，包括哮喘，尤其是在亚洲和非洲。在 2011 年和 2012 年，中国的 NO[2] 排放量达到峰值。在印度、中东部分地区和东欧，NO[2]\
  \ 排放量有所增加（Anenberg et al., 2022）。在另一项关于 NO[2] 的案例研究中，已证明燃气烹饪会产生 NO[2] 和其他污染物，如超细颗粒。该研究还显示，生活在有燃气烹饪污染的房屋内的儿童患哮喘的风险增加\
  \ 42%。尤其是儿童，接触室内 NO[2] 会增加急性呼吸道疾病和慢性呼吸道疾病的风险，降低肺功能并加重哮喘。根据 Lin et al. (2013)，儿童大部分时间都在室内度过。儿童接触室外\
  \ NO[2]、PM2.5 和黑碳（BC）会促进儿童哮喘的发展（Khreis et al., 2019）。长期接触 NO[2] 会导致严重的健康疾病。慢性暴露显著导致了较高的\
  \ COVID-19 死亡率（Ogen, 2020）。\n\n## 8.4 一氧化碳\n\n随着 CO 浓度的增加，可观察到心律失常（Rose et al.,\
  \ 2019）和持续升高的死亡风险（Chen et al., 2021）。CO 浓度增加 1 mg/m³（0–3 天）与心血管、呼吸系统等疾病相关（Wang et\
  \ al., 2021）。在英国家庭中，长期接触 CO 主要关注与燃气设备污染相关的对人类健康的影响。慢性 CO 暴露会产生 10% 或更高的 COHb 水平，导致包括红细胞增多症在内的血流动力学效应（Tam\
  \ et al., 2012）。\n\n## 8.5 气候变化——全球变暖\n\n\n\n\n\nCC 是一个具有挑战性的全球性问题。CC 是由主要污染物排放造成的。CC\
  \ 扰乱了健康的社会和环境因素——呼吸清洁空气、饮用安全水、食物和住所。BC 是细 PM 的一种成分，在 CO[2] 之后是导致全球变暖的主要贡献者之一。BC\
  \ 通过吸收阳光来温暖地球大气，加速雪和冰的融化。PM2.5 浓度的增加会增加 CC，反之亦然（Park et al., 2020），从而会成为最大的全球健康威胁（Huang\
  \ et al., 2021）。CC 对 PM2.5 空气质量具有更大且更显著的影响。几项研究工作已使用由一般循环模型驱动的化学传输模型研究了 CC 对 PM2.5\
  \ 的影响（Amos et al., 2010）。研究证明，CC 对空气污染的影响因区域和季节而异，具体取决于 PM2.5 的成分。它包括 PM2.5 的七种成分，即铵、元素碳、硝酸盐、有机碳、硅、钠和硫酸盐（Weeberb\
  \ et al., 2019）。CC 通过调节大气环流、温度和水文循环来控制 PM2.5 浓度（Park et al., 2020）。\n\n## 8.6 广义线性模型——印度空气污染\n\
  \n讨论了印度三个邦 AP、德里和 RJ 降雨对空气污染物影响的案例研究。空气污染物数据取自 [`app.cpcbccr.com/AQI_India/`](https://app.cpcbccr.com/AQI_India/)\
  \ 并应用了机器学习算法和广义线性模型进行分析。GLM 是一种回归模型，它将 `y` 的条件期望转换为回归变量 `X` 的线性组合。链接函数 `g(.)` 是\
  \ GLM 的转换函数。\n\n```\ng\\left( \\pi_{i} \\right) = \\sum\\limits_{j = 0}^{p}{\\beta_{j}.}x_{\\\
