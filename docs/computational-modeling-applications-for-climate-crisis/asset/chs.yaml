  \ || 3469 || 97 || 91 || 23 || 34 || 54 |\n\n*DALY*，伤残调整生命年。\n\n通过更多使用太阳能、太阳能热水器和太阳能电力，可以减少电力生产和供应，并提高各部门能源的利用效率，其中能源消耗较高。相关性分析的研究是在独特的指标时间序列对之间进行的，同时考虑了国家和国家细分数据（Pradhan\
  \ et al., 2017）。从 1990 年到 2020 年，煤炭（蓝色）、石油（深蓝色）和天然气（绿色）的 CO[2] 排放量急剧变化情况如图 Fig.\
  \ 3–8 所示，全球能源相关 CO[2] 排放量如图 Fig. 3–9 所示。太阳能可靠、可持续，是办公室、教育机构和医院最常用的能源。它有助于降低电费，是家庭用途的良好能源来源。\n\
  \n![Figure 3–8 CO2 emissions by fuel, 1990–2020 (https://www.iea.org/data-and-statistics/charts/change-in-co2-emissions-by-fuel-1990-2020).](img/F000079f03-08-9780443219054.jpg)\n\
  \nFigure 3–8 按燃料划分的 CO[2] 排放量，1990–2020 年（[`www.iea.org/data-and-statistics/charts/change-in-co2-emissions-by-fuel-1990-2020`](https://www.iea.org/data-and-statistics/charts/change-in-co2-emissions-by-fuel-1990-2020)）。\n\
  \n![Figure 3–9 Global energy associated CO2 emissions, 1990–2020 (https://www.iea.org/data-and-statistics/charts/change-in-co2-emissions-by-fuel-1990-2020).](img/F000079f03-09-9780443219054.jpg)\n\
  \nFigure 3–9 全球能源相关 CO[2] 排放量，1990–2020 年（[`www.iea.org/data-and-statistics/charts/change-in-co2-emissions-by-fuel-1990-2020`](https://www.iea.org/data-and-statistics/charts/change-in-co2-emissions-by-fuel-1990-2020)）。\n\
  \n然而，在对 ICT 行业 CO[2] 排放进行大量研究后，提出了针对云数据中心的“碳高效绿色政策”建议，以提高能源效率并降低碳足迹（Garg et al.,\
  \ 2011）。利用零碳电力电解水产生的氢被称为 *绿色氢*。它具有显著的潜力，帮助各国实现经济转型以实现气候目标（Fan et al., 2021）。观察到在工业革命之前，CO[2]\
  \ 浓度保持在约 280 ppm（体积）。然而，在 2020 年 3 月，全球月平均浓度上升至 413.67 ppm，即比 2019 年高出 3 ppm（Greenhouse\
  \ Gases, 2020）。投资名为“碳捕获与储存”的技术，可捕获电力生产和化石燃料气体生产行业的排放物，从而加工并防止 CO[2] 进入大气。预计全球 CO[2]\
  \ 排放量到 2030 年将下降至 2010 年的 45%，并在 2050 年左右实现净零排放，从而避免气温上升超过 1.5°C（Fan et al., 2021）。总体而言，可持续发展目标为实现\
  \ 1.5°C 更暖世界的可气候适应性发展路径提供了良好见解。\n\n#### 3.2.6.1 Hydropower\n\n全球变暖正在加剧并影响气候变化，突发性强降雨引发洪水、冰川融化以及野火发生。建议使用零排放技术发电。水电是一种清洁、经济且最常见的可再生能源。它成本低、耐用。可减少社会温室气体排放和能源账单。水电依靠水循环的持续再充电系统发电，使用在过程中不会减少的水作为燃料。\n\
  \n水流经管道流过涡轮机叶片，推动叶片转动，然后带动发电机产生称为水电的电力。水电站的原理是将其将由于水在高处出口而产生的势能和由于快速流动的水而产生的动能通过涡轮机叶片的运动转化为机械能。储存的水以高压从高处落下，冲击涡轮机叶片，涡轮机转轮开始旋转。转轮连接到中心轴，轴再连接到发电机，发电，即将涡轮机的机械能转化为电能。该电能可通过变压器的电压调节器经输电线路供给家庭或工业使用。\n\
  \n与使用化石燃料的其他主要电力来源相比，水电对环境更安全。此外，水电站不排放化石燃料设施常见的废气或热量，这些是空气污染和全球变暖的主要贡献者。通常，发电机在运行时会排放烟雾并产生可怕的噪音污染。\n\
  \n### 3.2.7 Climate change with extreme rising temperature globally\n\n\n\n\n\n\
  39 位研究人员团队的研究，包括科学家们，指出大量降雨模式年际变化很大，影响着 `CC`。极端降雨发生在西欧更大面积范围内，并影响了全球温度（气候变化使西欧洪水更可能，2021）。`CC`\
  \ 导致了引发洪水的强降雨事件，如 图 3–10 所示。温室气体 `GHGs` 排放和温度升高导致的全球变暖加剧是降雨模式变化的关键因素。\n\n![Figure\
  \ 3–10 Precipitation sum in Western Europe (Climate change made floods in Western\
  \ Europe more likely, 2021). Map lines delineate study areas and do not necessarily\
  \ depict accepted national boundaries.](img/F000079f03-10-9780443219054.jpg)\n\n\
  图 3–10 西欧降水总量（气候变化使西欧洪水更可能，2021）。地图线划定研究区域，不一定代表公认的国家边界。\n\n在另一项案例研究中，西北美国和加拿大西部经历了异常且危险的热浪（图\
  \ 3–11）。这一不可预测的事件导致山地冰川融化引发山体滑坡、森林火灾频繁发生，以及污染物导致空气质量恶化（六月以异常高温结束，2021）。\n\n![Figure\
  \ 3–11 Rising temperature globally (June ends with exceptional heat, 2021). Map\
  \ lines delineate study areas and do not necessarily depict accepted national boundaries.](img/F000079f03-11-9780443219054.jpg)\n\
  \n图 3–11 全球气温上升（六月以异常高温结束，2021）。地图线划定研究区域，不一定代表公认的国家边界。\n\n科学家们无可辩驳的证据表明，随着地球变暖，地球的健康状况正在下降。冰川融化推动了过去二十年中海平面上升的\
  \ 21%（融化的冰川推动了过去二十年中“21% 的海平面上升”，2021）。`NASA` 领导的研究指出，如果全球气温比工业化前水平上升 2°C，人们将面临\
  \ `CC` 的多重影响。在 图 3–12 中，火灾天气指数预测了极端天气条件，包括低降雨和高风速导致区域温度升高（NASA 研究揭示了两度变暖下的复合气候风险，2023）。`NASA`\
  \ 称 2023 年 7 月是纽约有记录以来最热的月份。\n\n![Figure 3–12 The prediction for the year 2045 for\
  \ analysis of global change (NASA) (NASA Study Reveals Compounding Climate Risks\
  \ at Two Degrees of Warming, 2023). Map lines delineate study areas and do not necessarily\
  \ depict accepted national boundaries.](img/F000079f03-12-9780443219054.jpg)\n\n\
  图 3–12 2045 年全球变化分析预测（`NASA`）（NASA 研究揭示了两度变暖下的复合气候风险，2023）。地图线划定研究区域，不一定代表公认的国家边界。\n\
  \n根据一份气候科学报告，洪水是由于大量降水落在土地上或河流无法吸收和排出过量水造成的。然而，`IPCC` 注意到与突发洪水相关的几个变量（洪水与气候变化：你需要知道的一切，2019）。来自纽约的科学家，`NASA`\
  \ 的戈达德太空研究所报告称，气候变暖趋势令人担忧，伴随着森林火灾加剧、飓风增强、破坏性干旱和海平面上升（NASA 表示 2022 年是有记录以来第五暖年份，变暖趋势持续，22\
  \ 有记录以来第五暖年份，变暖趋势持续，2023）。\n\n## 3.3 气候变化的地理空间方法\n\n在比拉斯布尔市的案例研究中（图 3–13），恰蒂斯加尔邦（印度），实施了\
  \ `GIS` 技术以识别该区域的土地动态。研究包括土地利用和土地覆盖变化的制图、监测和分析。有趣的是，`AI` 算法被用于城市规划和管理。`CC` 在全球城市、沿海和冰川地区均受到影响。温度、空气污染和降水是直接的\
  \ `CC` 影响。气温上升导致冰川融化影响海平面上升和全球土地转化。总体而言，由于城市扩张，全球平均气温上升了 2°C。图 3–13 的结果显示了地球表面温度的变化，并突出了\
  \ 1981 年至 2020 年间该研究区域的空间分布（Halder & Bandyopadhyay, 2021）。地理空间技术被证明对于做出更准确的估计和预测，以及制定更优化的\
  \ `CC` 适应和减缓计划不可或缺（Boulos & Wilson, 2023）。\n\n![Figure 3–13 Climate change scenarios\
  \ of Bilaspur (A) Urban Heat Island (B) Urban thermal field variation index (Halder\
  \ & Bandyopadhyay, 2021). Map lines delineate study areas and do not necessarily\
  \ depict accepted national boundaries.](img/F000079f03-13-9780443219054.jpg)\n\n\
  图 3–13 比拉斯布尔的气候变化情景（A）城市热岛（B）城市热场变化指数（Halder & Bandyopadhyay, 2021）。地图线划定研究区域，不一定代表公认的国家边界。\n\
  \n鉴于上述因素，可以看出极端全球变暖正在导致突发性强降雨，而冰川融化正在加剧海平面上升。应采取预防性科学方法来控制 `GHG` 排放。然而，一种名为碳灯塔的解决方案提供了简便的脱碳途径。\n\
  \n## 3.4 结论\n\n`IPCC` 在评估全球科学、技术和社会经济生产的机制方面发挥作用，以了解人类引起的 `CC` 的风险及其对人类的观测和预测影响。需要改善贫困人口生计的经济和社会标准以降低其脆弱性。地理空间技术也被用于\
  \ `CC` 适应和减缓。使用水电和太阳能将减少 `CO[2]`，从而 `SDG` 旨在到 2030 年减少碳排放。\n\n## 参考文献\n\n* Boulos\
