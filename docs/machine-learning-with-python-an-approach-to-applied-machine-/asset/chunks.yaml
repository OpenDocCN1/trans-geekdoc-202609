- raw: 'Categorical features are those features which contain value from a predefined
    set. For example, gender (Male and Female), colour (Red, Blue, Green), Noise Level
    (Very High, High, Good, Low, Very Low) etc.


    Categorical features bin the data in predefined categories.


    Also, some problem may arise due to categorical variables. One problem is large
    number of categories. Consider an example of Indian cities. We have a data of
    10000 rows and the city of India as one of the attribute (Pune, Ajmer, Jaipur,
    Mumbai, Kanpur etc.). Let say for 10000 row of data we have 500 different cities.
    Now, if we train this model and start predicting, our model is highly depending
    on the city. It overfits on training data to reduce the error and perform poor
    on generalized data.


    Also, if some city which is not a part of the current set comes, model fails to
    predict outcome for that.


    To handle this situation, we can think of considering states instead of cities.
    So, we have to deal with only 29 states and 7 union territories. By reducing number
    of levels, we can create better generalized model.


    Another problem is that some of the models only consider numerical attributes.
    Their cost function is based on the numerical value of feature.


    This problem can be handled in two ways:


    ![](index-100_1.jpg)


    Replacing each value with a number: We can replace each category with a number.
    For example color (Red -1 , Green-2 , Blue-3). After making this transformation
    categorical attribute will contain only number and we can train our algorithm.
    But this technique will not always explain the data correctly. In above example
    we replaced Red with 1 and Blue with 3. As weknow, all the three colors have equal
    weightage in original data. But here we are giving more weight to blue or in another
    way Green is near to Red as compare to Blue. Which is not correct.


    Create dummy variable: To deal with above problem, we follow dummy variable creation
    approach. In this method we create one new feature for each of the category. Each
    feature contains value of zero and one. If category is equal to the feature, it
    will get value 1 otherwise zero. In the case of color we will create three features
    (is\_Red, is\_Blue, is\_Green).


    At one time, only one of the feature can take value 1. After creating new features,
    we can drop old feature (color in this case).


    Also, we can do this task by creating number of categories - 1 features. In the
    above example we can skip creating is\_Green variable. If the value of is\_Red
    and is\_Blue is zero, that means color is green. So, we are not losing any information
    but removing redundancy.


    3.5.3 Handling time-based features


    Time based features can be converted to categorical features based on the need.
    Consider a problem where time is given in the form hh:mm:ss dd:mm:yy (ex. - 22:45:12
    18:12:2017) and we have to predict temperature at that time.


    So, based on our knowledge, we know that the temperature of a day vary depending
    on time. So, we can extract time of the day and make a feature time\_of\_day which
    contains 4 values morning, afternoon, evening and night.


    Also, we know that temperature vary in different part of the year. So, we can
    extract value of month of the year (1 to 12) and create a feature month and put
    the respective month (January, February etc.) in it. We can move one more level
    and create season feature (Spring, Summer, Fall, Winter) from the values of month.


    Although for this kind of problem, one separate domain exists which is called
    Time Series Analysis. This we will cover in upcoming chapters. But if date is
    not our primary feature, we can do some transformation and make some good features
    out of it.


    ![](index-102_1.jpg)


    3.5.4 Handling text features


    Text features are very common for real world application. Consider a problem of
    shopping cart website where you have to generate top products based on the user
    comments. So, for this you have to write a classifier which takes comments as
    input and classify them as positive, negative and neutral. And finally, you give
    a score (number of positive - number of negative) to the product based on all
    reviews and show high score products. Solution or predictive power of this model
    depends on the features from your text data. There are multiple approaches present
    to do that. We will also learn text classification in a separate chapter.


    Creating a word count vector: In this approach we create a set of all possible
    word which can come in the data. Second we create a matrix from data (rows are
    records and columns are count of word). We initialize this matrix with zero values.
    Now, we start processing each string and increase the count of words by 1 which
    comes in the string. Columns of this matrix acts as a feature vector in our problem
    This is just a basic way to do things. We can apply a lot of other filters like
    remove stop words to improve the feature set.


    TFIDF (Term Frequency, Inverse document frequency): It is most commonly used method
    in text data handling. It is based on the fact that important words are those
    which comes frequently in related document but not comes in every document. So,
    applying this method each document/text get a score vector of words. Higher score
    of any word means word is important for that document.


    3.5.5 Missing data


    Missing data is very common problem in machine learning. Missing data means we
    don''t get all feature value for some data points. We have to make some assumption
    or handle this case carefully. There are multiple ways to handle missing data.


    Remove features which contains missing values: One of the simplest way to analyse
    the data, is to check for all the features which contains missing value and remove
    them. Wecan train our model with remaining features.


    Whenever we get test data, we have to remove features from that also.


    This technique is useful when we have good set of features and only few columns
    contains missing value and their correlation with dependent variable is not high.
    But if most of the columns contains missing values, this technique is not preferred.


    Remove rows contains missing values: We can remove the rows from data which contains
    any data point missing. But if the test data also contains the missing values,
    our machine learning algorithm will fail to predict correct output. Also, if large
    number of rows contains missing values, this method will reduce training data.


    Replace missing values with significant data: This technique works well in most
    situations. Different types of data missing values can be replaced by different
    values. For numerical attributes, we can replace missing values by:


    Mean of the feature values.


    Median of the feature values.


    Zero.


    For categorical attributes, we can create a new category ''default'' for each
    missing data point and do the analysis.


    3.5.6 Dimension reduction


    Large dimensions of data are problem in model training. We can reduce dimension
    to a significant level by applying algorithms (ex-Principal Component Analysis,
    AutoEncoder etc.). These methods create new features that can explain full set
    of features efficiently.


