  trans: '

    为了解释模型参数，我们可以固定其他特征并解释它们与输出之间的关系。在我们的房屋示例中，让我们尝试进行解释。为此，我们需要固定房屋的其他特征。即在浴室数量和人口固定的情况下，房屋面积每变化一个单位，输出的变化。


    现在，我们讨论多元回归的算法。由于单个观测值的输出如下：


    ![](img/index-184_1.jpg)

    ![](img/index-184_2.jpg)

    ![](img/index-184_3.jpg)


    考虑到完整数据集，我们可以将其重写为：`Y = \hat{Y}`


    观测值数量 = `n`


    特征数量 = `d`


    `Y` 是一个包含 `n` 个值的向量。`X` 是一个 `n × d` 的矩阵，`w` 是一个包含 `d` 个值的向量，`\hat{Y}` 是一个包含 `n`
    个值的向量。所以，


    多元回归的残差平方和（Residual Sum of Squares）定义为：其中 `β` 代表长度为 `d` 的向量，代表第 `i` 个样本的特征。


    以矩阵形式：


    ```

    RSS = ( y - X β)( y - X β)ᵀ

    ```


    ![](img/index-185_1.jpg)

    ![](img/index-185_2.jpg)


    是 `y` 的预测值，等于 `\hat{y}`。我们可以取 `RSS` 的梯度：


    ```

    \nabla = -2 X^T ( y - X β)

    ```


    所以，为了求解得到 `β`，令梯度等于零。


    ```

    0 = -2 X^T ( y - X β)

    ```


    通过求解上述方程，我们得到：


    ```

    β = ( X^T X)⁻¹ X^T y

    ```


    所以，我们可以通过求解上述方程获得所有参数。当特征很多时，该方程的计算开销非常大。


    让我们为这个问题应用另一种解决方案（梯度下降）。`β_{k+1}` 是第 `k + 1` 次迭代时的参数值。


    当 `\nabla > \epsilon` 时


    ![](img/index-186_1.jpg)


    最终方程为：


    当 `\nabla + \epsilon` 时


    在实现中，我们可以将所有参数初始化为零。


    ![](img/index-187_1.jpg)

    ![](img/index-187_2.jpg)


    ## 5.3 模型评估


    现在，我们学习了构建回归模型的技术。在本节中，我们将学习模型评估的方法。评估模型是非常重要的，这样你就可以考虑特征、模型复杂度等因素。


    在我们的房屋示例中，我们有 100 间房屋的数据。我们使用多元回归建立模型并开始预测。但一段时间后，我们开始觉得模型的效果并不好。在大规模新数据上，我们的线性关系无法正确成立。因此，为了计算错误预测导致的损失，我们使用损失函数。


    `\hat{y}` 是我们的预测值 `y` 是实际值。我们有不同的损失函数选择。


    绝对误差损失函数 =


    ![](img/index-188_1.jpg)

    ![](img/index-188_2.jpg)


    ### 5.3.1 训练误差


    训练误差是在训练集上量的预测误差。


    训练集是用于构建模型的数据集。


    在这里，函数是通过考虑训练数据形成的。


    在统计学和机器学习中，我们使用另一个术语来定义误差，均方根误差（Root mean squared error）。


    取平方根的原因是为了让误差与输出具有相同的单位。


    随着模型复杂度的增加，训练误差会减小。考虑这三个模型：


    ![](img/index-189_1.jpg)

    ![](img/index-189_2.jpg)


    第一个只是一个点。为每个输入提供平均结果。在这种情况下，训练误差非常高。第二个是条线。训练误差小于上一个模型。第三个高阶多项式模型。该模型的训练误差非常小。


    训练误差不是模型性能的良好衡量。它在训练数据上过于乐观。我们正在检查已训练模型的损失，并相应此地修改模型。


    ![](img/index-190_1.jpg)

    ![](img/index-190_2.jpg)


    ### 5.3.2 泛化误差


    泛化误差是完整数据（而不仅仅是训练集）上的误差。它可以表示为：


    ```

    E_{gen}

    ```


    所以，在训练我们的回归算法时，大多数点是可见的。泛化误差并不总是随着模型复杂度的增加而减少。


    我们无法计算泛化误差。简单的原因是我们不知道完整数据是什么，不知道未来会发生什么。


    ![](img/index-191_1.jpg)

    ![](img/index-191_2.jpg)


    ### 5.3.3 测试误差


    我们无法估计泛化误差。所以，为了获得模型的真实误差，我们使用另一种技术。在创建模型时，我们隐藏一些示例并在剩余示例上训练模型。模型完成后，我们在这些测试点上评估性能。


    使用这种误差的益处是模型未见过测试示例。它在测试点上进行测试，误差与泛化误差相似。


    所以，显然测试误差是泛化误差的噪声版本。


    我们增加模型复杂度，训练误差减少了，但真实误差增加了。这在机器学习中被称为过拟合。通常情况下，在训练数据上拟合良好但在真实数据上表现很差的模型容易过拟合。


    ![](img/index-193_1.jpg)

    ![](img/index-193_2.jpg)


    ### 5.3.4 不可约误差


    假设我们找到了预测输出的真实。但数值仍然符合模式。考虑房屋的例子。可能存在两个属性完全相同的卖家，但他们的售价不同。


    所以，在这种情况下，我们的预测无法准确。这种误差或噪声是我们无法控制的。这被称为不可约偏差（Bias）是真实函数与平均拟合之间的差异。


    ![](img/index-194_1.jpg)


    低复杂度模型具有高偏差。方差：任何拟合与平均拟合之间的差异。高复杂度模型具有高方差。换句话说，我们在数据上拟合。


    ![](img/index-195_1.jpg)


    ### 5.3.5 偏差-方差权衡


    我们可以通过下面的曲线理解偏差与方差之间的权衡。当模型复杂度较低时，偏差较高，方差较低。随着模型复杂度的增加，方差开始增加而偏差减少。我们的误差取决于偏差和方差。我们考虑均方误差（MSE），


    ```

    MSE = Bias + Variance

    ```


    我们尝试选择 `MSE` 最小的点。


    我们无法计算偏差和方差，因为它们基于泛化数据集。但我们可以优化这两者之间的权衡。


    ![](img/index-196_1.jpg)

    ![](img/index-196_2.jpg)

    '
