    So, our new cost for any model would be the sum of measure of fit and magnitude
    of coefficients of model. Small number in both is desired. So, we need to balance
    these two numbers to reduce the overall cost. Measure of fit can be calculated
    as earlier Residual Sum of Square. Coefficient magnitude can be handled by different
    ways. One way is to sum the absolute values of coefficients; this is known as
    `L1`. We can also sum the square of magnitude of coefficients; this is known as
    `L2 norm`.


