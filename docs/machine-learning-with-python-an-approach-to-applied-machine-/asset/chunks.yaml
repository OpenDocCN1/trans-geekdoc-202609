    11.4 Collaborative Filtering


    Collaborative filtering is based on the idea of similar interest. Take an example
    of two users Ankita and Neha. Ankita likes product 1,3,4 and Neha likes products
    3,4,7. As both are agreed on two products, it is highly that Ankita will like
    product 7 and Neha will like product 1. This technique is completely based on
    past behavior of users. This is most widely used technique in recommendation engine
    building. There are two types of collaborative filtering exists:


    User-User collaborative filtering: based on similar users, based on their item
    purchase.


    Item-Item collaborative filtering: based on similar items, based on purchased
    by users.


    In this section we will focus on item-item collaborative filtering. We will use
    Pearson correlation coefficient to recommend item to the user based on his past
    item selection. Correlation between items is calculated to understand their similarity
    based on user reviews.


    Pearson correlation coefficient is the measure of correlation between two variables.
    It is represented by r.


