    Preface


    Machine Learning is the next big thing in computer science. From manufacturing
    to e-Commerce and shipping, it is used everywhere and provides solution which
    are based on the data. The idea behind Machine Learning is to make a knowledgeable
    Model which is as intelligent as human in taking a decision. Now with the increasing
    power of computation and memory, Machine Learning can provide even better solution
    than humans.


    This book is organized in 12 chapters. Each chapter touches one of the primary
    area of machine learning.


    First chapter of this book starts with basic Introduction of Machine Learning.
    Reader can get the idea of general Machine Learning Algorithms with their use
    to solve different types of real world problem.


    Chapter 2 contains basics of Python Language. Python is an open source language
    and a very good tool for applying Machine Learning. That''s why we have chosen
    it to program Machine Learning Algorithms. Chapter 3


    provides techniques to perform Feature Engineering. Finding correct features and
    modifying them is equally important in Machine Learning as Algorithms. Chapter
    4 focused on Data VisualizaJon Techniques. With use of pre-built Python Library,
    user can visualize the data and present it to others.


    Chapter 5 to 7 contains Supervised Learning Algorithms. Chapter 5


    explains Basic Regression Techniques with example on a real-world data.


    Chapter 6 focuses on Advanced Regression Techniques with the solution of overfitCng
    problem. Chapter 7 provides details of classificaCon Algorithms. It contains both
    parameterized and non-parameterized techniques to solve the problem. Chapter 8
    gives idea of Unsupervised Learning, mainly Clustering.


    Chapter 9 to 12 provides knowledge on advanced concepts in Machine Learning. Chapter
    9 covers Text Analysis. It contains an example to classify news in predefined
    category. Neural Networks and Deep Learning is discussed in chapter This is highly
    used in unstructured, image and voice data. Chapter 11 provides methods of building
    a Recommendation System with examples in each category. Last chapter 12 discusses
    Time Series Data, methods to handle and make forecasting on it.


    This book is helpful for all types of readers. Either you want to start in machine
    learning or want to learn the concepts more or pracIce with the code, it provides
    everything. We recommend users to learn the concept and practice it by using sample
    code to get the full of this book.


    Although the content and codes are checked by other Data Scientists, there may
    be some shortcomings. Author welcomes your suggestions and criticism if any. Author
    will try his best to remove those errors in future editions of this book.


    Acknowledgement


    I would like to express my gratitude to the BPB Publication for bringing out the
    book in its present form.


    A great thanks to my family and friends, without their support I wouldn''t be
    able to complete this task.


    “No matter how far I can go, my parents will remain always with me.”


    \-Abhishek Vijayvargia


