    Chapter 10


    Neural Network and Deep Learning


    Neural network and deep learning provides the best solution for the hottest problem
    in the industry in computer vision, speech recognition, natural language processing
    etc.


    As in today''s world data is increasing with a rapid speed. Generating insights
    from large amount of data is the power of deep learning. Deep learning is becoming
    popular recently with GPUs in the market, which can do computation much faster
    than traditional CPUs. Also, a lot of open source libraries (TensorFlow, Torch,
    Keras, Caffe etc.) are introduced which helps and get the best from deep learning
    models. In this chapter first, we will understand the basic computation by using
    vectorized programming. Then, we will understand the concepts behind traditional
    neural networks followed by deep learning models. We will use keras in python
    for building models.


    Deep learning moved artificial intelligence to a different level. Deep learning
    based system (DeepMind AlphaGo) defeated Lee Sedol in the Go board game who was
    the ranked 1 player for this game around the world.


    Not only in the games, deep learning is beating humans and generating better predictions
