    ## 10.3 Deep Learning


    Deep learning is nothing but a neural network which contains large number of layers.


    Above is 4-layer neural network. It contains 3 hidden layers and one output layer.
    Number of units in any layer is denoted by `Hence = 4`, `n1 = 4`, `n2 = 3`, `n3
    = 1`, As number of hidden units in first layer is 4, second layer is 4, third
    layer is 3 and forth layer is 1. `f` used to denote activation at layer `l`.


    Using deep network, we can compute function with fewer number of hidden units.


    Deep learning rise happens because of the computational power increment. Earlier
    models are trained on CPUs which have 4-24 cores. These cores can be used to do
    parallel processing and do computations.


    In Neural Network, we have to do computations on each node and collect the result.
    As with limited cores, our parallel processing bounds to the number of cores available.


    In GPUs, 1000-4000 processing cores are available to do the parallel computation.
    Deep learning hidden unit calculation can be done in these cores and results are
    multiple times faster.


    ### 10.3.1 Hyper parameters


    Deep learning model has a lot of choice for hyper parameters:

    - Learning Rate

    - Number of hidden layer

    - Number of hidden units

    - Number of iteration to get the minima

    - Activation function

    - Momentum

    - Batch size

    - Regularization term


    These parameters controls `w` and `b`. These are called hyper parameters. So,
    Deep learning solution works in this way:


    ![](index-419_1.jpg)


    First, we start with choice of hyper parameters. Then we build the solution by
    using programming language frameworks. Finally, we calculate cost for the solution.
    We can choose different set of hyper parameters and repeat this cycle.


    ## 10.4 Deep Learning Architecture


    With the advancement in computing power and rise of GPUs, different variants of
    neural networks are available to solve problems in different domains. In this
    section, we will learn about some popular deep learning architecture:


    - Deep Belief Network (DBN)

    - Convolution Neural Network (CNN)

    - Recurrent Neural Network (RNN)

    - Long Short-Term Memory (LSTM)

    - Deep Stacking Network (DSN)


    Let''s discuss each architecture one by one.


    ### 10.4.1 Deep belief networks


    Deep Belief Network (DBF) is multilayer network. Each two layers are restricted
    Boltzmann machines (RBM). We can assume DBN as a stack of RBMs.


    In DBN each hidden layer understands abstract representation of input feature.
    Output layer is different. It performs classification task. In DBN two tasks are
    performed - Unsupervised pretraining and supervised fine-tuning.


    - **Unsupervised pretraining**: in this `RBM` is trained to reconstruct its own
    input. Each layer takes input from previous layer.

    - **Supervised fine-tuning**: in this, labels are applied and gradient descent
    with back propagation algorithm is used to do training.


    ### 10.4.2 Convolutional neural networks


    Convolutional neural networks (CNN) are based on visual cortex. It assumes that
    input are images and extract properties in different layers. It''s multiple hidden
    layer do feature extraction followed by classification.


    Feature extraction task divide in convolution and pooling. First image is fed
    to convolution layer and features are extracted. After this pooling is done to
    reduce the dimensionality of extracted feature. Again, on these reduced dimensions,
    convolution and pooling is done. Multiple layers of convolution and pooling is
    done which extract feature at different levels.


    Final, layer outputs the overall features of images.


    ### 10.4.3 Recurrent neural networks


    Recurrent neural network has connection that feed back to past layer or in the
    same layer. This implementation allows network to maintain memory of past and
    current events. RNN is trained by using a variant of back propagation which is
    called back propagation through time. In this technique weight updates are done
    by summing all the weight updates of errors of elements which comes in the sequence.


    RNN can store information while processing input. This kind of architecture is
    very useful when past information helps in prediction of future information (like
    in case of time series analysis).


    RNN maintains context nodes to store the information. Hidden layer output is applied
    back to hidden layer but whole network remains feed forward.


    ### 10.4.4 Long Short-Term Memory


    Long Short Term Memory (LSTM) networks are based on memory cell.


    Memory cell can store the information for long time or short time depending on
    the importance of information.


    Each LSTM memory cell contains three types of gate, input gate, forget gate and
    output gate.


    - `input gate` allows information to enter in the cell.

    - `forget gate` allows information to be forgotten or removed from the cell. By
    this useless information is removed and space is created for any new useful information.

    - `output gate` is used to output information from the cell.


    ### 10.4.5 Deep Stacking Network


    Deep stacking network is a set of deep networks. Each network has its own set
    of hidden layers.


    In one instance of DSN, three modules are present. Each module contains input
    layer, one hidden layer and output layer. These three modules are stacked on each
    other. One module input contains output of previous module.


    ## 10.5 Deep Learning Framework


    Today with the power of deep learning to solve complex problem, a lot of frameworks
    exists. Using these framework, applying deep learning in different problems is
    very easy.


    ### Tensorflow


    It was developed by google brain team and open sourced in 2015. It is a python
    based library which can run on multiple CPUs and GPUs.


    ### Theano

