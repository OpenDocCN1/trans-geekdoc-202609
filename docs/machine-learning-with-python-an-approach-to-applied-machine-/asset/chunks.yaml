    # 第 4 章：数据可视化


    数据可视化是数据的图形化表示。通过图表和图形，比阅读表格或成千上行的原始数据更容易理解结果。我们的大脑更好地理解视觉事物，这有助于做出决策。


    例如，考虑人类和计算机做出决策的方式。


    计算机可以更快地处理海量信息。


    假设我们写了一个程序来读取百万行数据并做出决策。对于人类来说，这并不容易。他们需要时间来分析数据并做出决策。为了处理这种情况，我们以可视化的方式呈现这些数据。例如，使用柱状图查看过去每个决策的影响，或使用饼图显示过去的决策及其成功率。


    最后，数据科学家必须向听众展示他们的结果，而听众对机器学习算法、假设或数据工程并不了解。数据可视化通过这种方式帮助决策者做出决策。数据科学家将此作为工具，围绕数据构建一个故事。


