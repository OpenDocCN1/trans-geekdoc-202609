    # Chapter 3:## Feature Engineering


    As the name suggest this process include engineering (creation, transformation
    etc,) of features from data. Now the first question is


    ### 3.1 What is Feature?


    Consider an example of data stored in sql database tables. Table is made up of
    rows and columns. Table contains `Integer` data, `String` data, `Date` fields
    etc. Now consider the date column. We want to do some analysis, but this field
    is not directly useful. So, first we write a program (or script) to extract day
    on any particular date and create a separate column with that information. Now
    we have 7 days (Monday, Sunday etc.) stored in a new column. Again, we create
    a script to check: is a day is weekend or a weekday. We create another field `is_weekend`.
    It contains `True` if the day is weekend otherwise `False`. We can use this for
    our analysis or to build predictive model. This is


    So, the form of attribute (or field) which is useful in data science process is
    called Feature. Feature may depend on the type of requirement. In the example
    above, we are more interested in getting the weekend information. Other analysis
    may need the day of week or month of year for analysis. In that case month of
    the year is the feature. So, this is completely application dependent.


    Feature is used in:

    - In Computer Vision techniques image pixels, edges, corners etc.

    - In Speech recognition sound levels, noise levels etc.


    ### 3.2 Why Feature Engineering?


    In Machine Learning to get success in any modelling technique we need good features
    in the data. Features are very important to increase the predictive power of any
    model. When we try to solve real world problem, we may not always get the best
    features. As, Features may exist with a lot of problems like missing values, outlier,
    different type, error in data collection etc. Before training any machine learning
    model, we have to clean, transform and find right set of features.


    We can take an example of cooking food. We have given a lot of ingredient and
    we have to find which is needed to solve our problem.


    Without selection of right ingredient, we cannot make perfect food. Same is feature
    engineering in data science process.


    Data Scientist while solving any problem, spend more than half of their time in
    selecting the right features. Some of the benefits of spending time in feature
    engineering:

    - Make simple model to perform much better than complex model.

    - Reduce model selection time. They increase predictive power of simple models.

    - Reduce training time by simplifying the model.


    It is all about decomposing the data in an intelligent fashion. We will discuss
    all the important aspects of feature engineering in this chapter.


    ### 3.3 Feature Extraction


    Feature extraction is process of selecting new features from the existing set
    of features by doing some transformation in order to remove redundancy. In the
    original data, a lot of feature may exist. But it may possible that we can represent
    all the features with fewer new feature. This is called feature New features can
    represent the data very likely to the old features. The advantage of doing feature
    extraction is that the dimensions of the training data is reduced.


    ### 3.4 Feature Selection


    Feature selection are the techniques to select subset of the features from the
    data. It is different from the feature extracted where we have created new features.
    In this we find most useful features from the data itself.


    Feature selection is important because:

    - Model creation is faster due to less features.

    - Easy to explain and interpret features.

    - Better Generalized model. Predictive model behaves nearly same on generalized
    data.


    Feature selection is basically a search problem. We have to find ways to select
    features which can produce better results. Different techniques which are used
    in feature selection are:


    - **Filter**: These methods are based on score of features by some statistical
    test. Each feature is evaluated with the outcome on statistical test (like pearson
    correlation, chi-squared test etc.) and a score is generated. Later features are
    ranked based on their score and lower score features are removed.

    - **Wrapper Methods**: These methods use machine learning algorithm to find the
    best feature. First, different subsets of features are created. Now with these
    set of features machine learning algorithm is trained on sample data and model
    performance is evaluated. The set of features which gives best performance are
    considered as selected features. These methods will take more time because they
    do actual training of algorithm with different set of features.

    - **Embedded methods**: There are other techniques... used for feature selection.
    These techniques will select best feature during the training itself. Some of
    the examples are `ridge` and `lasso` regression which we will see in later chapters.


    ### 3.5 Feature Engineering Methods - General Guidelines While dealing with different
    kind of features, we can follow some basic principles to achieve better results.
    These are some general guidelines which works well on almost all kind of data.


    #### 3.5.1 Handling Numerical Features


    Data may contain a lot of numerical features. For example: cost of a product,
    temperature of the day, height of a person are all numerical features. A dataset
    is formed by mixing different kind of numerical attributes. Consider a problem
    of predicting a house. It contains attributes like house price, location, age
    of property, distance from nearest bus station, number of rooms as independent
    variable and rent as dependent variable (target variable).


    If we take a raw data and apply machine learning algorithm, it is highly biased
    on the attributes like house price. Because the value of the price is domination
    and higher than other attributes like number of rooms. So, first we have to convert
    numerical feature to some standardize form to take it in the same range as other
    attributes. This method is applicable to all attributes. We call this process
    as normalization


    Two popular techniques of doing normalization are:

    - **Min - Max Normalization**: This process brings the feature in the range of
    `[0,1]`. First it calculates minimum and maximum value of each numerical feature.
    After it apply the following transformation on each value of the feature:

    ```

    X = (X - min(X))/(max(X) - Min(X))

    ```

    - **Z-Score Normalization**: Min-Max normalization is not preferred when data
    contains outlier. In the presence of outlier, values are move to closer to zero
    as range of the data increases. Other techniques which is commonly used for doing
    normalization is z-score. Z-score follows the principle of statistics and move
    the data to mean zero and standard deviation as one.

    ```

    Z = (X - mean(X))/StdDev(X)

    ```


    Both of the above techniques can be applied to normalize numerical features. Sometimes,
    it is beneficial to convert numerical feature to categories or binning them together.
    This method also helps in reducing outlier effect and generate better prediction.
    For example, age of the property. This field can contain value like 1, 3, 5, 15,
    45 (In case of historical building). Now to understand the data properly we can
    bin this in 5 categories:

    - Less than a year (`<= 1`)

    - Between 1 to 5 years (`> 1 AND <= 5`)

    - Between 5 to 10 years (`>5 AND <=10`)

    - Between 10 to 20 years (`<10 AND <=20`)

    - More than 20 years (`>20`)


    Above feature is just an example. Binning numerical attribute depends om different
    things like better generalization accuracy, correlation with target, etc.


