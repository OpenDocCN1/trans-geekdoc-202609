  trans: "\n在现实世界中，数据并不是线性分离的。它们可能如下所示。\n\n因此，我们无法画一条线来将红点和绿点分开。但如果我们使用一个平面将红点和绿点分开，就可以使用分类器对它们进行分类。让我们创建一个新维度，并通过该平面将点分开。\n\
    \n![](img/index-45_1.jpg)\n\n现在，我们的红点和绿点通过一个新的维度分开了。\n\n这种技术被称为 `Kernel`（内核）。\n\
    \n现实世界的数据复杂得多，具有许多维度。`支持向量分类器`配合 `Kernel Trick` 用于解决复杂问题。\n\n现在来看另一个问题。考虑城市中一家名为\
    \ A2A 的杂货店。他们提供基于电话的配送服务。每当他们接到任何物品的电话时，就会让送货员带着地址去送货，并在地点交付产品。他们成功在市中心建立了办公室，从那里可以准时为越来越多的人服务。\n\
    \n![](img/index-46_1.jpg)\n\n这里的点代表发给 A2A 的服务请求。现在他们意识到，将所有请求直接发送到一个中心是没有意义的。因此，他们决定在城市里开设四个中心，以便接收不同区域的请求并相应地解决。\n\
    \n所以，为了解决这个问题，让我们随机添加四个中心，并将请求分配在它们上面。\n\n![](img/index-47_1.jpg)\n\n![](img/index-47_2.jpg)\n\
    \n显然，这不是配送中心的最分配。在接下来的步骤中，我们将每个点移动到分类点的中心。再次，将所有点归类到最近的中心，并将商店位置移动到分类步骤的中心。经过多次迭代，我们将得到这样的分配。\n\
    \n因此，每个点的分配是基于该点到中心点的距离。这种技术被称为 `K-Means`（均值聚类）。\n\n我们可以使用另一种方法进行聚类。与其先将它们分成若干类并重新分配，我们可以将所有点视为独立的类。然后，我们将最近的两个点分组并形成一个类。我们不断这样做，直到出现任何大距离或我们形成了最小数量的类。这种技术被称为\
    \ `Hierarchical`（层次分类）。因此，在本章中，我们涵盖了许多日常生活中的机器学习示例。在书中，我们将详细学习每一个示例并用 Python 进行编码。我们还将学习一些高级技术。\n\
