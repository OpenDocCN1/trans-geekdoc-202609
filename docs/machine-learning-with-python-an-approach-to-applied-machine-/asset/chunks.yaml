    can go to millions. If we consider combination of words, these numbers can go
    to billions. If we run regression algorithm over it, model needs to find billions
    of parameters and take huge time in training.


    Feature selection is a process of selecting useful features. We tried some techniques
    in feature engineering chapter. We will use lasso regression to do this work.


    6.3.1 All Subset algorithm


    One way to do is to find all possible combinations of features and train model
    for each combination.


    For i =1 to number\_of\_features:


    Take all the combinations of i features


    Train model on selected model


    Calculate Error by using cross validation Select the model with least error.


    This algorithm has run time complexity in exponential. This algorithm is good
    if number of features are less. But if number of features are large, it is computationally
    very expensive to apply this algorithm.


    If we have total D number of features, we have to train and test 2D


    models.


    ![](index-225_1.jpg)


    Clearly it is not a good technique for large features.


    6.3.2 Greedy Algorithm for Feature Selection Greedy algorithm based on finding
    the best feature within the available feature set. We add that feature in our
    list and remove that feature from available list.


    Feature set = empty


    Available set = All features


    For i =1 to number\_of\_feature:


    Fit the model by using current best feature and feature set.


    Remove selected feature from available list and put it in Feature set.


    Calculate Error using cross validation


    Select the feature set with least error.


    Training error will go down in each step. We have to use validation set approach
    to decide the stopping point.


    In this algorithm first, we train the model D times. Next time we have to train
    the model only D - 1 times because one feature is moved to feature


    set. Third time we have only D - 2 features to create model. The algorithm ends
    with only one feature left. Considering that feature means considering all the
    features - 1 in the feature set and 1 in the available set, D - 1 + 1 = So, the
    complexity of the algorithm would be D + + ….. 3 + 2 + 1 =


    Greedy algorithm is computationally much efficient << than all subset algorithm.


