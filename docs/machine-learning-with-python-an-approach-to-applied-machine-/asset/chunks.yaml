    # Chapter 8: Unsupervised Learning


    In previous chapters we worked on supervised learning problems. We were given
    a set of features or attributes and a dependent variable Our task was to create
    a model to efficiently `y`. `y` can be categorical (in case of classification)
    or numerical (in case of regression). We also defined loss function for our model
    assessment.


    In this chapter, we will focus on another branch of machine learning which is
    called un supervised learning. In unsupervised learning problem outcome / dependent
    variable `y` is missing from data. We have to find properties from feature set
    As in supervised learning, we have model assessment is done by loss function.
    But in unsupervised learning as `y` is not available, we have to build algorithm
    that finds suitable properties based on the feature set These are inferences gathered
    from data without the response variable. So, there is no labeled data available
    in unsupervised learning, hence it is difficult to commit on performance of our
    model.


    Unsupervised learning has a lot of use cases in today''s world:

    - Finding the optimal location for a telephone tower. Different type of distribution
    exists in different part of the world. Clustering algorithm can group people and
    determine center to place the network tower.

    - Finding genetic sequence and patterns.

    - Create group of customers to give different offers and deals (Marketing segmentation).

    - Give summary of news and articles.

    - Finding patterns, interdependency of variables in the dataset.


    ## 8.1 Clustering


    Clustering is the way to group the objects in a way that similar object formed/lies
    in single group. Number of groups may vary depending on the requirements.


    Clustering is done to reveal interesting groups in the data. To understand the
    requirement of clustering, consider a set of customers. A credit card company
    ran a campaign and collected data from new customer including their age, gender,
    address, salary, designation, family, contact number, email etc. These details
    are gathered by their marketing executives by meeting persons at different part
    of the city. Now after collecting the data, the biggest task is to convert this
    contacts into their customer. One simple approach is their sales person start
    contacting each person, tell benefits about their credit cards and tries to sell
    them. Customer listens for a few mins and started getting confused about the types
    of credit cards offers and hangs up the phone showing no interest in proceeding
    further.


    Now, machine learning helps in these kinds of problem to convert this contact
    to customer. First it takes all the data (profile of customer, credit card types,
    their properties and past customers) and group the customers according to their
    profile. So, the algorithm gives output like this:


    ```

    {Gender:Male, Age:20-30, Location: New Delhi} => Gold Signature Credit Card +
    10% discount on movie tickets

    {Gender:Female, Age:30-40, Location: Pune} => Diamond Plus Credit Card + 15% discounts
    on 5-star hotels

    ```


    Now, these types of cards are recommended for the customers directly based on
    their profiles and interests. So, instead of showing customers all types of cards
    and benefits, sales person can directly send email or do a phone call.


    ## 8.2 K Means Clustering


    K means clustering, assigns data points to one of `K` clusters depending on their
    distance from the center. It starts by randomly assigning the clusters in the
    space. Then each data point assign to one of the cluster based on its distance
    from centroid. After assigning each point to one of the cluster, new cluster centroids
    are assigned. This process runs iteratively until it finds good cluster. In analysis
    we assume that number of cluster is given in advanced and we have to put points
    in one of the group. Consider a scenario of broadband company. Based on their
    market analysis and expert''s knowledge, the feel that they had five types of
    customers and they can give deals to them according to their group. So, in this
    case `K` is equals to `5`.


    To understand K Means clustering take another example of online game playing.
    The game has a feature in which two players can compete and they can also play
    on predefined missions. Each time player completes a mission or wins in a battle
    he gets some points. After earning suitable points players are promoted to next
    level. Whenever player click on multiplayer game, systems tries to find player
