    凝聚法（自下而上方法）：在这种方法中，我们将每个点视为一个聚类。在每一步中，我们选择两个最近的点并将它们合并成一个单一聚类。重复执行这一步骤，直到只剩下一个聚类。这种技术在上面的示例中进行了描述。


    ![](img/index-331_1.jpg)


    ### 8.3.1 距离矩阵


    我们可以使用不同类型的距离矩阵来计算聚类中点之间的距离。


    ![](img/index-332_1.jpg)


    ### 8.3.2 聚类连接


    定义两个聚类之间连接的方法有很多。使用不同的连接方法可以得到不同的聚类分配。


    - **单连接（Single Linkage）**：两个聚类之间的距离定义为它们之间任意点之间的最小距离。一个属于一个聚类，另一个属于另一个聚类。

    - **全连接（Complete Linkage）**：两个聚类之间的距离定义为它们之间任意点之间的最大距离。一个属于一个聚类，另一个属于另一个聚类。

    - **平均连接（Average Linkage）**：两个聚类之间的距离定义为它们之间所有点对之间的平均距离。一个属于一个聚类，另一个属于另一个聚类。


    ![](img/index-333_1.jpg)


