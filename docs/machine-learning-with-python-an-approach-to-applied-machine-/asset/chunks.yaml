    \ questions as input and And weight of these questions as `5`, `3`, `4`. If your\
    \ score is greater than `6`, you go, otherwise you move on. Let's assume your\
    \ answers are yes, yes and no. Your overall score for this problem is:\n\nScore:\
    \ `5 × 1 + 3 × 1 + 4 × 0 = 8` (Greater than `6`, Go don't miss it.)\n\n Neural\
    \ networks work in similar fashion. They have weights for different neurons as\
    \ input. And neuron feeds information to another neuron.\n\n![](index-396_1.jpg)\n\
    \n## 10.2.1 Gradient Descent\n\nNow the challenge is how to make neural network\
    \ to learn from training data. Our goal is to create a model that generates output\
    \ correctly for training data. In other words, our model should minimize the cost\
    \ function.\n\nHere, `w` is the set of parameters and `b` is bias. `'` denotes\
    \ the number of training example. `y` represents actual output and `y_hat` is\
    \ the predicted output. `J` is a cost function which is also known as Mean Squared\
    \ Error (MSE). So, it is obvious that this function result cannot be negative.\
    \ The best case is when `J = 0`. Our parameters and bias should be in a way that\
    \ moves cost function towards zero.\n\nWe use gradient descent algorithm to do\
    \ this work. We change the parameters in a way that reduce the cost and try to\
    \ reach to global minima.\n\nNow, it is important way by which we can improve\
    \ our cost function. This is known as learning rate. It is the rate by which we\
    \ modify our cost function in the direction to right results. Learning rate plays\
    \ an important role. If it is lower, it takes time in convergence. If it is higher,\
    \ we may miss the global minima. By this, we need to make choice based on the\
    \ nature of the problem.\n\nIn Neural networks, we use backpropagation algorithm\
    \ to compute gradient. In backpropagation we modify internal weights to generate\
    \ desired output.\n\n![](index-398_1.jpg)\n\n## 10.2.2 Activation function\n\n\
    Till now in our explanation of neural networks, we use sigmoid function as an\
    \ activation function. The goal of activation function is to convert input signal\
    \ to output signal.\n\nThis function generates value in the range of `0` to `1`.\
    \ We can use other functions also for activation.\n\nFirst, start with very simple\
    \ activation. Suppose we can start with the activation based on some threshold\
    \ value. If the output of neuron is greater than some threshold we can consider\
    \ it as `1` otherwise `0`. That is good for binary classification. But this concept\
    \ failed in multiclass classification where we have different classes and we want\
    \ to take one from each neuron. Instead of giving Boolean answer about activation,\
    \ it is good to say that we can choose the activation value and maximum value\
    \ at next level.\n\nNow consider another activation as:\n\n`ActLin = Cx`\n\nThis\
    \ activation function has linear relationship with input. So, activation is `c`\
    \ times the input `x`. This helps the problem of multi class classification.\n\
    \nWhenever there are more classes we can decide a range for activation and choose\
    \ the class accordingly.\n\nEverything seems fine, but there is a problem. The\
    \ gradient of this function is `c`. In other words, gradient is constant. It means\
    \ in another layer, we can completely represent it as function of input and subsequent\
    \ in all layers. So, our output is just a function of input. This means the power\
    \ of using multiple layers is out.\n\nThe intuition behind neural network is to\
    \ represent any function. Using nonlinear functions, we can learn complex and\
    \ nonlinear relationship between input and output.\n\nNow let's discuss about\
    \ some popular activation functions\n\n![](index-400_1.jpg)\n\n![](index-400_2.jpg)\n\
    \n### 10.2.2.1 Sigmoid Function\n\nSigmoid function is also known as logistic\
    \ function. For `x`, value of function is `1/ (1+exp(-x))`. This function is smooth\
    \ and non-linear in nature. Combination of these function is also non -linear\
    \ which is good for our neural network model. It bounds the output in `[0,1]`\
    \ for any input `(-inf,inf)`. Let's see the example of graph in python for sigmoid\
    \ function.\n\nGenerate numbers from `-10`, `10` with step `1`.\n\nGenerate graph\n\
    \n![](index-401_1.jpg)\n\nAs we can see from above figure, for higher values of\
    \ input, output remains nearly constant (`0` or `1`). This function is mostly\
    \ used in binary classification.\n\n![](index-402_1.jpg)\n\n![](index-402_2.jpg)\n\
    \n### 10.2.2.2 Tanh Function\n\nTanh function is represented by `(exp(2x) - exp(-2x))\
    \ / (exp(2x) + exp(-2x))`. It is also a nonlinear function, which generates output\
    \ in the range `(-1,1)`.\n\nFirst define tanh function for numpy array Generate\
    \ numbers from `-10`, `10` with step `1`.\n\nGenerate output graph\n\n![](index-403_1.jpg)\n\
    \n![](index-404_1.jpg)\n\n### 10.2.2.3 ReLu function\n\nReLu stands for rectified\
    \ linear units. It is given as: `R = Max(0, x)`.\n\nSo ReLu function gives output\
    \ `0` for all negative value otherwise same as given number.\n\nGenerate output\n\
    \n![](index-405_1.jpg)\n\nReLu is the nonlinear function. It generates output\
    \ from `(0,inf)`. So, this function will activate only those nodes which gives\
    \ positive output from ReLu.\n\n## 10.2.3 Parameter Initialization\n\nIn neural\
    \ network we need to initialize parameters by some value. We can initialize `b`\
    \ to zero but not `w`. If we initialize nodes in one layer, it produces same output.\
    \ So after weight update, all nodes update by same amount. Hence, all hidden units\
    \ compute the same function.\n\nTo deal with this limitation we initialize `w`\
    \ with random values. If we use large values, activation function (`sigmoid`,\
    \ `tanh`) results vanishes. So, the learning slows down.\n\nWe will build our\
    \ first simple neural network by using keras. For this experiment we will use\
    \ iris dataset. This is a public dataset downloaded from `https://archive.ics.uci.edu/ml/datasets/iris`.\
    \ For this task we need to install two additional libraries `keras` and `tensorflow`.\
    \ Use the following command to install `keras` and `tensorflow`.\n\nImport libraries\
    \ needed for neural network.\n\n![](index-407_1.jpg)\n\n![](index-407_2.jpg)\n\
    \n![](index-407_3.jpg)\n\n![](index-407_4.jpg)\n\nLoad data.\n\nCheck the data\n\
    \nAbove data has three classes in text form. To give input to our neural network\
    \ model, we first need to convert them to one hot encoding. We use `pandas.get_dummies()`\
    \ function to create one hot encoded class.\n\n![](index-408_1.jpg)\n\n![](index-408_2.jpg)\n\
    \n![](index-408_3.jpg)\n\n![](index-408_4.jpg)\n\nRemove class and concat one\
    \ hot encoding values Separate independent and dependent attributes Training and\
    \ test split\n"
