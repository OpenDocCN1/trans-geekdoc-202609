    # 第 5 章：回归


    回归是一种从输入预测连续输出的技术。输入以特征的形式给出。输出或响应变量是连续的。在回归中，我们找到映射这些特征到连续响应的模型。因此，我们的模型学习输入与输出之间的关系。


    ### 预测股票价格


    在市场上，股票价格根据不同因素上下波动。我们可以建立回归模型，根据社交媒体活动、市场位置预测下周的股价。


    ### 预测销量


    在业务中，预测销量并采取必要行动非常有用。如果预测较低，我们需要改进某些优惠（可能是营销或销售）。


    ### 预测票价


    在假期和长周末，每个人都想旅行。机票也取决于季节。例如，夏季假期期间人们待家里。但在冬季和雨季，他们想去远离流量的地方。航空公司根据季节、假期、占用人数等预测价格。


    ### 预测社交媒体上的点赞/评论


    当公司想要为客户提供任何优惠/交易时，进行分析很重要。根据之前帖子的响应，他们可以理解并预测新帖子的点赞/评论，以吸引更多观众。


    我们首先从 `simple regression` 开始。在回归的部分，输入和输出都是单变量。我们将拟合一条最符合给定输出的直线。我们将使用 `gradient
    descent` 算法寻找最佳直线。通过该算法，我们将得到截距和斜率。


    之后，我们将转向更复杂的回归形式，即 `multiple regression`。在这里我们考虑许多输入变量来预测结果。衡量模型的性能至关重要。有时复杂模型在训练数据上看起来很好，但在测试或新数据上表现糟糕。我们将定义不同类型的误差并尝试最小化误差。我们还将学习偏差-方差权衡（bias
    tradeoff）。


    随着模型复杂性的增加，我们在训练数据上的性能更好，但在测试数据上的表现变差。我们将在下一章学习处理此问题的 `ridge` 和 `lasso regression`。Lasso
    回归也用于特征选择。我们还将学习 `kernel regression` 等回归技术。


    ## 5.1 简单回归


    正如名称所示，它是简单的。给定一个输入，我们必须为输出拟合一条直线。我们将通过预测房屋价格来理解这种方法。为了做到这一点，我们有与房屋价格相关的历史数据。假设我们有两个数据点：平方英尺的房屋大小和房屋价格。房屋大小被视为赋予算法的输入，价格被视为输出。因此，我们的数据是两个点
    `(x, y)`。


    `(x, y) -> (房屋大小, 房屋价格)` 我们在平面上画出这些点。


    ![](img/index-163_1.jpg)


    对于任意点，向 `x` 轴画一条垂线，它代表房屋的大小。同样向 `y` 轴画一条垂线，代表房屋的价格。


    画一条映射房屋大小与价格之间关系的直线。


    ![](img/index-164_1.jpg)


    `f` 是表示房屋大小与价格之间预期关系的函数。考虑一个点。根据我们的关系函数，房屋价格大约等于 `f(house size)`。


    `y >> f`


    ![](img/index-165_1.jpg)


    因此，房屋 `i` 的值给出：


    `y_i = f() + ε`


    `ε` 被视为房屋预测的误差。该误差在不同示例中为正、负或零。误差的期望值为零。


    `E[ε] = 0`


    因此，我们的数据在线路上方或下方的概率相等。在回归中，我们必须完成两个任务。第一个任务是为给定问题选择函数类型。该函数与输出是常数关系吗？还是线性的、二次的、三次或更高阶？选择函数类型后，我们必须找到给定问题的估计函数。


    我们的整体回归模型可以通过此解释：


    ![](img/index-166_1.jpg)


    我们的数据是房屋大小和价格。在这个问题上，我们进行数据清洗（处理缺失值、异常值等）。建立我们的回归模型并生成输出。现在，我们的输出与实际输出进行比较。这个过程持续直到函数给出最佳近似。


    在简单回归中，我们必须拟合一条直线。我们的拟合方程可以给出：


    `f = α + βx`


    输出给出：`y_i = α + βx + ε`


    这里 `ε` 是房屋预测误差项。`α` 和 `β` 是我们回归模型的系数，被称为斜率和截距。


    ![](img/index-167_1.jpg)


    ![](img/index-167_2.jpg)


    让我们理解回归模型中的成本。这是通过残差平方和（RSS）来量的。RSS 是实际值与预测值之间差异的平方和。


    `RSS = Σ (Predicted Price - Actual)²` 考虑输入 `x`、输出 `y` 和参数，这里 `n` 是训练的总数。


    ![](img/index-168_1.jpg)


    ![](img/index-168_2.jpg)


    因此，回归的目标是最小化 RSS。我们的算法应该选择在训练数据上 RSS 最小的直线。一旦确定了直线或关系，我们只需将值代入函数即可输出。


    我们尝试估计参数。估计参数是对实际参数的最优猜测。因此，对于任何输入 `x`，我们使用此公式对 `y` 进行预测。


    这里在计算输出 `y` 时可能存在误差，但这是已知的。该误差可能是正的、负的或零。因此，我们的最佳猜测是直线上的值。


    ![](img/index-169_1.jpg)


    假设。值为 20000。现在，任何房屋的大小是 800 平方英尺。现在，根据我们的回归模型，该房屋的价格是多少？


    `Price = 450 × 800 × 20000`


    `Price = £380,000`


