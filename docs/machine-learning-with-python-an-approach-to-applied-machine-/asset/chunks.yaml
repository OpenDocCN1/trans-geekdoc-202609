    ## 朴素贝斯


    现在考虑机器学习分类问题。我们有 `k` 个特征和 `C` 个类别。我们的目标是预测实例属于某个类别 `Ci` 的概率。朴素贝斯算法获取特征向量，并计算在这些组特征下类别
    `Ci` 的条件概率。我们对所有类别执行此操作，并将具有最大概率的类别作为预测类别。


    朴素贝斯算法的优点是实现简单且快速。它在存在分类特征时表现良好。对于数值型特征，假设数据来自正态分布。


    如果分类特征在测试数据中包含某些新类别，该模型将将其概率分配为零。我们应用拉普拉斯变换（Laplace transformation）来处理这个问题。此外，独立预测的假设在现实世界中很少出现。


