    ## 7.2 逻辑回归


    逻辑回归是以逻辑函数作为链接函数的线性模型。逻辑函数也称为 sigmoid 函数。它的公式如下：


    该函数对于不同取值的 `score` 表现如下：从上文可以清楚地看到，对于大的负值，`sigmoid` 返回近似 0（或非常接近 0）。对于大的正值，`sigmoid`
    返回接近 1 的值。


    因此，正类别的概率可以描述为：


    ![](img/index-250_1.jpg)


    ![](img/index-250_2.jpg)


    让我们取一些 `score` 的值，并检查评论为正的概率：


    如果系数的值很高，曲线更陡陡。


    因此，为了建立模型，我们从一条拟合数据的直线开始，并以移动直线的方式来最大化质量或似然性。我们使用与回归中相同的梯度下降算法来寻找模型的参数。


    如果输入包含类别输入（`gender`、`age group`），我们需要相应地处理它们。我们不能直接将这些类别输入放入方程中。因此，我们使用编码并将它们转换为数值特征。这些技术在特征工程章节已经讨论过。


    到目前为止，我们只讨论二分类（两个类别）。如果结果有多个类别，我们可以使用相同的模型来预测其中一个。


    处理多分类的一种方法是“孤立性分类”（one-versus-all）。我们为每个类别构建一个单独的模型。假设我们有 `N` 个数据点和 `K` 个类别。我们使用数据构建
    `K` 个不同的逻辑回归模型。在每个模型中，我们取一类，并将所有其他类视为一类以构建相同的二分类模型。例如，如果我们必须将图像分为三类：狗、猫、鼠，我们首先创建一个模型，第一类是狗，第二类是包含所有猫和鼠示例的其他类。第二个模型的第一类是猫，第二类是包含所有狗和鼠示例的其他类。同样地，第三个模型的第一类是鼠，另一类是狗和猫。


    现在，当我们要对 `K` 类中的任何记录进行分类时，我们使用 `K` 个不同的模型预测每个类的概率。具有最大概率的类别被报告为预测类别。一个重要的观察结果是，每个类别概率之和并不需要等于
    1。


