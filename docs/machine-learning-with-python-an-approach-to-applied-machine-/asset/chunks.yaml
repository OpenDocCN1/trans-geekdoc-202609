    Introduction to Machine Learning


    1.1 Introduction


    We all are human. We learn from experiences. From the day we born, we start learning
    things. As we grow up, we start learning how to stand on feet and walk. We listen
    to the people around us and try to speak the same.


    We learn the meaning of different words. What to say when we are hungry or need
    something. We also start classifying things as good and bad. For example, when
    we go near to the fire first time, we feel the heat, and we come back. We learn
    not to go too close to the fire.


    Now think about the working of a computer. It follows the instruction given by
    humans. It can process millions of instructions in a second and return the result.
    It can perform the task described by human but cannot take decision by itself.


    Here comes the machine learning in action. What will happen if we will give computer
    ability to think like human? Isn''t it Awesome? We can give every day''s action
    in a format that computer can understand and do a math around it and build some
    model that will help it taking actions in future.


    So, human learn from experience and computer follows instruction.


    Instead we can give experience directly to computer to learn and prepare itself
    for action. Now we define the experience in a structured format. So, we say computer
    learn from data (Experience) and this process is called Machine


    Let''s take an example of Banana shopping. Your mother instructed you to go to
    market and buy some good banana. She told you that bright yellow bananas are good.
    You went to a vendor and started picking banana as per your mother''s advise.
    You took 20 bananas and came home. Now you noticed that some banana was not in
    good taste as others. In fact, five were bad ones. You took each banana one by
    one and started making assumptions. You understood that 12 bananas were big and
    8 were small.


    All the 8 bananas were good but big ones were not same. So out of 12, five bananas
    tasted bad.


    Next day you were ready with your knowledge. When you arrived in the market, you
    noticed some other vendor was selling bananas with discount.


    You went there and started picking small bananas. Now these bananas were different.
    This vendor had some green bananas. You took them. After reaching home, you again
    started with your banana testing skills and classify each as good or bad (depending
    on taste). You found that big green banana was good but small green bananas did
    not taste as good as others. So, you learned new rule.


    You started considering yourself as banana expert. One day you had to go to your
    cousins wedding in another city (far from your hometown). You saw bananas and
    went to test your skills. Now you surprised to see that all the bananas were very
    small and tasted very good (sweet like sugar). Here you learned that bananas from
    this part of the country were best.


    Now you are an expert. You come home and ready for shopping. Your sister come
    home after a long time and she hates banana. She likes Guavas. Now what will you
    do? You again start your learning to find the best Guavas.


    Now to make your computer do this task is Machine Learning. So, you give knowledge
    in form of data points. The property of data points is called Here features are
    size of banana (small, medium, large), color, origin etc. is taste (Good or Bad).
    So, you give this data to your machine learning program and it learns how to classify
    banana in good or bad category.


    So, machine learning algorithms are kind of smart algorithms that gives you power
    of taking decision based on experience.


    1.2 Machine Learning Process


    Machine learning is not just a simple algorithm which you can put anywhere and
    start getting fantastic results. It is a process that start with defining the
    data and ends with the model with some defined level of accuracy. In this section,
    we learn about this process.


    **1\. Define the problem**


    The machine learning process starts with defining a business problem.


    What is the need of machine learning? Does this task really need advanced predictive
    algorithm for solution?


    Defining the problem is very important. It gives you direction to think about
    the solution more formally. It basically deals with two questions.


    A. What is the problem?


    This question covers the problem definitions and present it more formally.


    Consider a task where we want to find an image contains human or not.


    Now to define it we will divide it in Task(T), Experience(E) and Performance(P)


    Task (T): Classify an image contains human or not.


    Experience(E): Images with the label contains human or not.


    Performance(P): Error rate. Out of all classified images, what is the percentage
    of wrong prediction. Lower error rate leads to higher accuracy.


    B. Why does this problem need a solution?


    This question focused more on business side. It covers the motivation and benefits
    for solving the problem.


    For example, if you are a researcher and solving the problem to publish a paper
    and form a baseline for others, is may be your motivation.


    Other needs is to identify, is there any human activity during night at bank''s
    ATM when no security is present.


    We also need to define the scenarios where we can use this solution. Is this a
    general solution or designed for specific task (i.e. detecting person in ATM sensors)?
    Also till when the solution is valid (is it lifetime or in a specific month/year)?


    **2\. Collect the data**


    After defining the problem, data collection process starts. There are different
    ways to collect the data. If we want to associate review with ratings, we start
    by scraping the website. For analyzing twitter data and associate it with sentiment,
    we start by APIs provided by twitter and start collecting the data for a tag or
    which is associated with a company.


    Marketing researcher create different survey form and put it on the website to
    collect the data. In manufacturing industries sensors generate tera bytes of data
    per minutes. Websites generates logs on user activity.


    For big consumer companies like Amazon, Facebook this data is huge.


    Depending on problem, we also want to collect labels along with data.


    Suppose we want to build a classifier that classify news post to three groups,
    sports news, market news, political news. So, with each news that we have collected,
    we need one of the label associates with the article.


    This data can be used to build machine learning classifier.


    So, right data is the key to solve any machine learning problem. More and better-quality
    data leads to generate better result even from basic algorithms.


    **3\. Prepare the data**


    After data collection you need to focus on data preparation. Once you collect
    the data, you need to prepare it in the format used by machine learning algorithm.
    Algorithms are not doing any magic trick. You have to feed them with the right
    form of input to get the result. Depending on algorithm libraries, they expect
    different types of input formats.


    Data preparation starts with data selection. Not every data gives actionable insights.
    Suppose we are analyzing logs on a server. It generates a lot of system related
    information after each user activity. That may not be useful if we are predicting
    the marketing response of a campaign. So, based on problem, we can decide to remove
    that data from further processing.'
