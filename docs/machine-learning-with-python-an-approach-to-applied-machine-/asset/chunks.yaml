    5.3 Model assessment


    So, we have learned the techniques to build regression model. In this section,
    we will learn the way of model assessment. It is important to assess the model
    so that you can take consideration of features, model complexity etc.


    In our house example, we have data of 100 house. We build our model by using multiple
    regression and start predicting. But after sometimes, we start feeling that our
    model is not doing great. On the new large data, our linear relationship is not
    holding correctly. So, to calculate the loss due to wrong predictions, we use
    a loss function.


    is our predicted value and y is the actual value. We have different choice of
    Loss function.


    Absolute Error Loss function =


    ![](index-188_1.jpg)


    ![](index-188_2.jpg)


    5.3.1 Training Error


    Training error is the error of prediction measured on the training set.


    Training set is the dataset which is used to build the model.


    Here, the function is formed by considering training data.


    In Statistics and Machine Learning we use another term to define error, Root mean
    squared error.


    The reason for doing square root is to take the error in the same units of output.


    Training error is reduced as the model complexity increases. Consider these three
    models:


    ![](index-189_1.jpg)


    ![](index-189_2.jpg)


    First is just a point. Giving average result for each input. In this training
    error is very high. Second is a line. Training error is less than previous model.
    Third is higher degree polynomial model. Training error is very less in this model.


    Training error is not a good measure of model performance. It is highly optimistic
    on training data. We are checking the loss on our trained model and modifying
    the model accordingly.


    ![](index-190_1.jpg)


    ![](index-190_2.jpg)


    5.3.2 Generalized Error


    Generalized error is the error on complete data (and not only training dataset).
    This can be given as:


    So, most of the points are not visible during training our regression algorithm.
    Generalized error does not always decrease with the increasing of model complexity.


    We cannot calculate generalized error. Simple reason is we don''t know what is
    the complete data is. What is coming in future.


    ![](index-191_1.jpg)


    ![](index-191_2.jpg)


    5.3.3 Testing Error


    We cannot estimate generalization error. So, to get the true error of the model,
    we use another technique. While creating the model, we hide some example and train
    the model on remaining example. After the model building is complete, we evaluate
    the performance on these test set points.


    The benefit of using this error is the model never seen test example. So it is
    tested on the test point and the error is nearly same as generalized error.


    So, as it is clear that Test error is the noisy version of generalization error.


    We increase the model complexity and training error is reduced but true error
    is increase. This is called overfitting in machine learning. In general, model
    fit very well on training data but very bad on true data is prone to overfit.


    ![](index-193_1.jpg)


    ![](index-193_2.jpg)


    5.3.4 Irreducible Error


    Let say we have found the true to predict the output. But the values are still
    not following the pattern. Consider the example of a house. There may exists two
    seller having exact same properties, but sellers are selling them in different
    prices.


    So, our prediction cannot be exact in this case. This kind of error or noise we
    cannot control. This is called as irreducible Bias: Bias is the difference between
    true function and the average fit over the data. If there is bias, there is error.
    Bias means our average fit does not capture the true relationship.


    ![](index-194_1.jpg)


    Low complexity model has high bias, as they are not close to true relationship.
    High complexity model has high bias.


    Variance: It is the difference of any fit and average fit. In other words, variation
    between average fit on the data and the fit in consideration.


    If the model complexity is very high variations between any fit and average fit
    is very low. If the model complexity is low, this variation is low.


    ![](index-195_1.jpg)


    5.3.5 Bias-Variance Tradeoff


    We can understand the tradeoff between bias and variance by using the curve below.
    As model complexity is low, bias is high, and variance is low. As the model complexity
    increases, variance started increasing and bias decreases. Our error depends on
    both bias and variance. We consider Mean Squared Error (MSE),


    MSE = + Variance


    We try to choose the point where MSE is least.


    We cannot compute bias and variance because they are based on generalized dataset.
    But we can optimize the tradeoff between these two.


    ![](index-196_1.jpg)


    ![](index-196_2.jpg)


    In regression we have to complete two tasks: Select the complexity of model


    Compute test error that is near to generalization error.


    One way to do this is to divide the dataset in two: Training set and Test set.


    First choose some model complexity. This refers to degree of polynomial.


    Now train the model by using this. Assess the model on the test set. If the performance
    is not satisfactory, try with other model complexity and retrain the model. Do
    this step till we get good result or best result in test set.


    There is one problem with this approach. Our goal is to find generalization error
    by using test set. But here we are choosing model complexity in a way that it
    reduces error on test set. So, in other words we are using information from test
    set during train which is not allowed. To handle this situation, create another
    test set. We call it Validation set.


    ![](index-197_1.jpg)


    ![](index-197_2.jpg)


    Now train the model by using training set data and evaluate performance with chosen
    model complexity on validation set. Do it repeatedly till we get best performance
    on validation set. Now finally test your model on test set. As the data in the
    test set never used for any training purpose it gives correct measure for generalization
    error.


    There are different type of division of data, which can be done as per the dataset.
    We can divide the data in 50%, 20%,30% as training set, validation set and test
    set. In some case we can choose 80%, 10%, 10% as training, validation and test
    set.


    Now will work on python code to perform multiple regression.'
