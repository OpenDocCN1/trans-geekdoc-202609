    按照流程，我们首先开始在训练数据上训练模型。我们将训练集分为 `train` 和 `validation` set。我们使用这两个集合创建模型。一旦模型完成，我们就在测试数据上对其进行评估。


    因此，测试数据包含实例或记录以及一个包含类别的目标变量。当我们的模型通过记录预测出正确类别时，我们称为成功。当它给出错误的分类时，我们称之为失败。因此，误差可以计算为：


    我们也可以将准确率定义为：


    ![](img/index-253_1.jpg)


    ![](img/index-253_2.jpg)


