    \nFit the data\n\n![](index-320_1.jpg)\n![](index-320_2.jpg)\n![](index-320_3.jpg)\n\
    \nNow let's try with `K=3`.\n\n![](index-321_1.jpg)\n![](index-321_2.jpg)\n\n\
    ![](index-322_1.jpg)\n![](index-322_2.jpg)\n\nIf we don't know what should be\
    \ the correct value of K, `scikit` has a method to check the errors.\n\n![](index-323_1.jpg)\n\
    ![](index-323_2.jpg)\n![](index-323_3.jpg)\n\nWe can see that elbow is coming\
    \ at 3. So, 3 is the correct choice for number of cluster.\n\n![](index-324_1.jpg)\n\
    \n![](index-325_1.jpg)\n![](index-325_2.jpg)\n\n![](index-326_1.jpg)\n\n![](index-327_1.jpg)\n\
    ![](index-327_2.jpg)\n\n### 8.3 Hierarchical Clustering\nHierarchical clustering\
    \ is an algorithm that builds the hierarchy of clusters. In this clustering we\
    \ make hierarchy of point by different strategy to achieve clustering.\n\nConsider\
    \ the example of points in the space.\n\nFirst consider each point as a cluster.\
    \ So, at the beginning there are total 5 different clusters (A, B, C, D, E) are\
