    word). We initialize this matrix with zero values. Now we start processing each
    string and increase the count of words by 1 which comes in the string. Columns
    of this matrix acts as a feature vector in our problem This is just a basic way
    to do things. We can apply a lot of other filters like remove stop words to improve
    the feature set.


    ### TFIDF (Term Frequency, Inverse document frequency)

    It is most commonly used method in text data handling. It is based on the fact
    that important words are those which comes frequently in related document but
    not comes in every document. So, applying this method each document/text get a
    score vector of words. Higher score of any word means word is important for that
    document.


    ## 3.5.5 Missing data


    Missing data is very common problem in machine learning. Missing data means we
    don''t get all feature value for some data points. We have to make some assumption
    or handle this case carefully. There are multiple ways to handle missing data.


    ### Remove features which contains missing values

    One of the simplest way to analyse the data, is to check for all the features
    which contains missing value and remove them. We train our model with remaining
    features. Whenever we get test data, we have to remove features from that also.


    This technique is useful when we have good set of features and only few columns
    contains missing value and their correlation with dependent variable is not high.
    But if most of the columns contains missing values, this technique is not preferred.


    ### Remove rows contains missing values

    We can remove the rows from data which contains any data point. But if the test
