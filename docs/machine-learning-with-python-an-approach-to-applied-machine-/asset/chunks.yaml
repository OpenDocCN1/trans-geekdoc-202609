    # 前言

    机器学习是计算机科学的下一个大趋势。从制造业到电子商务和物流，它无处不在，并提供了基于数据的解决方案。机器学习背后的思想是创建一个智能`Model`（模型），使其在决策方面像人类一样智能。现在，随着计算和内存能力的不断增强，机器学习可以提供比人类更优解决方案。


    本书由 12 章组成。每章都涉及机器学习的一个主要领域。


    本书的第一章从机器学习的基本`Introduction`（介绍）开始。读者可以了解通`机器学习算法`及其在解决不同类型的现实世界问题中的应用。


    第 2 章包含了 `Python` 语言的基础知识。`Python` 是一种开源语言，是应用机器学习的非常好工具。这就是为什么我们选择它来编写`机器学习算法`的原因。第
    3 章提供了执行`特征工程`的技术。在机器学习中，寻找正确的特征并修改它们与`算法`同样重要。第 4 章侧重于`数据可视化技术`。通过使用预构建的`Python
    Library`（库），用户可以将数据可视化并展示给他人。


    第 5 章到第 7 章包含了`监督学习算法`。第 5 章通过真实世界数据的示例解释了`基础回归技术`。


    第 6 章侧重于`高级回归技术`以及解决`overfitng`（过拟合）问题的方案。第 7 章提供了`分类算法`的详细信息。它包含了解决问题的参数化和非参数化技术。第
    8 章介绍了`无监督学习`，主要是`聚类`。


    第 9 章到第 12 章提供了机器学习中高级概念的知识。第 9 章涵盖了`文本分析`。它包含一个将新闻归入预定义类别的示例。本章讨论了`神经网络`和`深度学习`，这在非结构化、图像和语音数据中被广泛使用。第
    11 章提供了构建`推荐系统`的方法，并在每个类别中都有示例。最后一章第 12 章。


