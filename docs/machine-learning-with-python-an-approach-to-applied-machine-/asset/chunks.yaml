    words. One technique is to choose whichever in top hierarchy. Another technique
    is to choose lowest common ancestor.


    Wordnet are available in nltk which can be used to solve our purpose. First we
    need to import necessary package


    Now we want to give the word with the sense. Here we take three words


    ''cat'', ''lion'' and ''dog'' as noun and find their similarity.


    Calculate similarity:


    ![](index-373_1.jpg)


    We can see the similarity between cat-dog and cat-lion.


    Topic modeling is the statistical technique of finding topics from the text.


    It is used to find hidden properties in the document. A document contains a lot
    of topic. For example, if we see words like correlation, mean, sum these belongs
    to Mathematics. So we can say in a document of a type (like mathematical, biological,
    physical) has some similar words, which can be used to classify any new document.


    In a document multiple topic can be detected. For example, it uses 5


    words related to biology and 15 words related to Statistics. It can belong to
    both. Maybe it''s a study of biology with some statistical points in it.


    Topic modeling is different from using regular expression or using rules to find
    topics. It uses clustering to group the word together and extract topics out of
    them. Topic modeling has different use cases across industries.


    Blog website use topics to group similar blogs together and recommended by using
    new blogs. Research papers can be categorized into category and people can consider
    them directly when they are trying to research cross domain.


    We can extract topics from text by using different techniques. One technique that
    we discussed previously TFIDF (Term Frequency Inverse Document Frequency) can
    be used to find strong topics from the word. It marks important words that acts
    as topics.


    ![](index-374_1.jpg)


    ![](index-374_2.jpg)


    Another useful technique is Latent Dirichlet Allocation or LDA. LDA works backwards,
    it takes document and figure out topics which creates that document. It is a matrix
    factorization technique. First, we present all the information into document term
    matrix. Each row represents a document and column represents all the possible
    words. Each cell value represents count of that word in the document. We convert
    this matrix into two matrices - document - topic and topic - term. LDA iterates
    through each word in each document and tries to improve topic - term relation.


    After good number of iteration both matrix got information regarding distributions.
    This is the stopping or acceptance criteria for LDA.


    There are number of parameters exists in LDA to tune and get better modeling.
    Number of topics needs to be extracted from corpus. Topic terms exists in each
    topic. Number of iteration or maximum passes needed for convergence.


