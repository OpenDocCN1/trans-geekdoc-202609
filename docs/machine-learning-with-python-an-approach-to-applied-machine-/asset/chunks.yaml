    Chapter 5


    Regression


    Regression is a technique of predicting the continuous valued output from input.
    Input data is given in the form of features. Output or response variable is continuous.
    In regression, we find model that maps these features to continuous response variable.
    So, in a way, our model is learning a relationship between input and output.


    Let''s understand the problem of regression by these examples: Predicting Stock
    price: In stock market, stock price goes up and down depending on the different
    factors. We can build a regression model that takes input of news related to that
    stock, its price window for last one-month, social media follower''s activity,
    market position, peer performance last month and predict the price of the stock
    in next week.


    Forecast sales of a month: In business, it is very useful to predict sales and
    do the necessary actions. If the prediction of sales is lower, we need to improve
    some of our offering (may be better marketing or after sales service) and if prediction
    is high, we need to manage our resources accordingly.


    Predict airfare: During holidays and long weekends, everyone wants to travel.
    Flight companies also tries to make most of the revenue at that


    time. Also, it depends on season. For example, during holidays in summers, people
    stays at home. But during winter and rainy season they want to go somewhere which
    is away from high traffic. Airlines predict the price based on season, holiday,
    festival, number of seats occupied, last year minimum and maximum price etc.


    Predict like/comment on social media: When companies want to put any offer/deals
    for the customer, it is important to do analysis before posting any stuff publicly.
    Based on the response on their previous post, they can understand and predict
    likes/comments on new post and can modify them to attract more and more audience.


    We first start with simple regression. In this part of regression, input and output
    are single variables. We will try to fit a single line that fits best on the given
    output. We will use gradient descent algorithm to find the best line that fit
    the data. Using this algorithm, we will get intercept and slope of the line.


    After this we will move to more complex form of regression, which is multiple
    regression. Here, we consider many input variables to predict the outcome.


    Measuring the performance of our model is important. Sometime complex model looks
    great on training but perform worst on test or new data. We will define different
    type of error and tries to minimize the desired error.


    We will also learn about the bias variance tradeoff.


    As the complexity of model increases we get better performance on training data.
    But it starts performing bad on test data. We will learn ridge and lasso regression
    in next chapter that deals with this problem. Lasso


    regression also used for feature selection. We will also learn some other regression
    techniques like kernel regression.


