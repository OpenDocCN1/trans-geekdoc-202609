    As we can see that increasing degree (or complexity) will not always help. On
    test data, `degree=4` is giving good result as compare to `degree=2`. When we
    increased the degree to 16, performance reduces. Model is trying to fit accurately
    on training data and performing bad generalized data.


    ![](index-212_1.jpg)


    The problem of overfitting influenced by number of features. If data contains
    more features, overfitting is harder to avoid. We can reduce overfitting by increasing
    the data points. To reduce overfit, we can change our model assessment. Earlier
    we are concerned only about fit on the data. Now we will consider parameters of
    model along with fit on the data that controls overfitting problem.


    ![](index-213_1.jpg)

