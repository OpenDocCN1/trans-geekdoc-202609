- raw: 'In real world, data is not clearly separable. It may come like this.


    So, we cannot draw a line to separate red points with green points. But if we
    separate red points with green points by using a plane we can classify them by
    using a classifier. Let''s create a new dimension and separate the points by using
    that plane.


    ![](index-45_1.jpg)


    Now our Red and Green points are separated by using a new dimension.


    This technique is known as Kernel


    Real world data is much complex and has many dimensions. Kernel Trick with Support
    Vector Machine Classifier is used to solve a complex problem.


    Now move to another problem. Consider the business of a grocery store A2A in a
    city. They provide call based delivery service. Whenever they get a call for any
    item they send their delivery boy with the address and the person deliver the
    product at the location. They managed to get their office in the center of the
    city from where they can serve more and more people on time.


    ![](index-46_1.jpg)


    Here points represent service request came to A2A. Now they realize it would not
    make any sense to direct all request to one center. So, they decided to open four
    centers in the city which can take the request from different parts and solve
    accordingly.


    So, to solve this problem, let''s add the four centers randomly and put the request
    on them.


    ![](index-47_1.jpg)


    ![](index-47_2.jpg)


    Clearly it is not the best assignment of delivery centers. In next steps, we move
    each point to the center of classified points. Again, classify all the points
    to nearest center and move store location to the center of classified step. After
    multiple iteration, we will get the assignment like this.


    So, the assignment of each point is based on distance of points to center point.
    This technique is called K-Means


    We can use another method for clustering. Instead of first grouping them into
    clusters and reassigning, we can take all the points as independent clusters.
    Then, we group the two nearest points and form one clusters. We keep doing that
    till there is any large distance occur or we formed minimum number of clusters.
    This technique is called Hierarchical So, in this chapter, we have covered a lot
    of examples of machine learning in daily life. In this book, we will learn each
    one of them in detail and code in python. We will learn some advanced technique
    also.


    Chapter 2


    Understanding Python


    To apply machine learning and data science a lot of tools are available.


    You can start solving machine learning problem by putting your data on those tools,
    performing some basic feature of engineering and start building predictive models.
    Most of the tools contain implementation of all popular machine learning techniques
    to solve any task.


    Now consider a task where you have to solve some algorithmic problem.


    You need to perform some data filtering, apply sorting or searching and modification
    on the data. The best way to do that work is by programming language. Understanding
    programming language and its libraries gives you a power to solve any computational
    problem.


    Consider the work of a mechanic in repairing a car. First, we go to mechanic and
    tell him our problem. He takes his tool kit and start searching right tools to
    complete the job. Then he starts applying those tools in order to complete the
    work. Not all the tools are necessary for this work. Some tools may need to be
    consider again and again to do the job.


    Also, some order should be followed to fulfill the requirement. For example, he
    cannot work on engine of the car without opening its front bonnet.


    Real world problem solving also works in similar fashion. We first start by defining
    a problem. Than we start searching high level solution for the problem. After
    finalizing it, we move to find lower level solution and


    apply them in a particular order to solve problem. Similarly, Programming language
    works as a tool for us. We can implement our ideas/solution by using programming
    languages.


    2.1 Why Python?


    Python is very popular programming language among the data scientist.


    First, it is free and easy to learn. We don''t have to pay much attention for
    small task. Second, it is object oriented, which is why it is supported by large
    organization developer community. Third, it''s huge open source library support.
    Python has good number of library to achieve data science and machine learning
    solution faster. We don''t need to write each algorithm, from scratch. Some of
    the libraries like pandas, scikit-learn, scipy, numpy, keras are very useful to
    implement your machine learning algorithm quickly.


    Let''s first understand the use of programming language to solve any real-world
    problem by an example.


    Suppose you are hosting a party. You assign a number to each person coming in
    the party between 1 to 100 uniquely. Now when the party is over, you make an announcement.


    "I will take out a random number between 1 to 200. If there exists any two people
    whose numbers sum is equal to this number, I will give a prize to both."


    Now you know that you have distributed numbers to x people. How to ensure that
    you have to give prize to two people or not?


    ![](index-52_1.jpg)


    ![](index-52_2.jpg)


    ![](index-52_3.jpg)


    Let''s try to solve this problem by using python. First, we start the problem
    by taking input data in a list.


    Now you choose a random number which we store in a variable.


    Now to solve this problem, we have to sort the data first. In python list sorting
    is easy and can be done by sort function.


    By using the above statement, we filled the variable with sorted number.


    So now we use two pointers. One from beginning and the other from end.


    We first check their sum. If it is less than the given value (means our current
    sum is less than the required sum) we move front pointer a step ahead and check.
    If it is greater than the given value (means our current sum is greater than the
    required sum) we move back pointer one step less and check. At any point if our
    current sum is equals to required sum, we can say that two people exists with
    the given sum and you have to give prize to both. Or if both pointer crosses their
    path and still the required sum is not achieved, you can claim that no two people
    exists and save yourself. The complete solution is written here


    ![](index-53_1.jpg)


    ![](index-53_2.jpg)


    ![](index-53_3.jpg)


    To get the answer you have to pass your sorted list and sum to the function Don''t
    worry if you are not able to understand the code. We will go through the entire
    process and understand basic principle of programming language.


    2.2 Download and Install Python


    Python can be downloaded from its official website https://www.python.org/downloads/


    Depending on your operating system, you can download appropriate version of python.


    When you first go to the website you can see two different versions of python
    (2.7.x and 3.x). Python supports multiple style of programming.


    User enjoys both Scripting and Object-Oriented way of programming in python. If
    you are a new programmer, we will recommend you to use Python 3.x. Although these
    versions are not much different with each other. As a note from same website Python
    2.7, after releasing Python 3, no major version comes in Python 2.x. And Python
    3 is growing, more libraries are added, so it is better to start with Python 3.


    ![](index-55_1.jpg)


    2.2.1 Install Python in Windows


    After downloading you can run setup file.


    After this, click on Install now, installation begins. You can also choose customize
    installation. If you are using python first time, you can choose default setting.


    ![](index-56_1.jpg)


    ![](index-56_2.jpg)


    After completing, the setup will process successfully


    ![](index-57_1.jpg)


    You can verify the installation by using following command


    2.2.2 Anaconda'
