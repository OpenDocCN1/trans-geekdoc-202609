    ## Chapter 11: Recommendation System

    Recommender Systems are applications or platforms that recommend useful things
    to the user according to the context. The goal of recommendation systems are to
    present items to user which are interesting to them. It helps in selection and
    increase in sales. In our day to day life, we find ourselves surrounded by recommender
    systems. While we search for product on any popular e-Commerce website, it starts
    recommending products. For example, if we search for camera and buy it, next time
    system starts recommending camera, etc. In video sharing platform, like `youtube`,
    when we watch any video, it starts recommending videos. In movie rating website
    like `IMDB`, when we rate or search for any movie, it starts recommending movies.


    Some popular recommendation systems are:

    - Product Recommendation: Amazon, Snapdeal, Walmart

    - Music Recommendation: Last.fm, youtube

    - Movie Recommendation: Jinni, Movielens


    This chapter deals with strategy and ways to develop recommender engines. We will
    learn about the following techniques of building recommendation engines in this
    chapter:

    - Popularity Based

    - Content Based

    - Classification Based

    - Collaborative Filtering

    - Model Based


    ### 11.1 Popularity Based Recommender Engines

    Popularity based recommendation engines are based on the usage of items by all
    the users. The items which is used most is consider as most item. These systems
    recommend popular items to all the users. These systems are based on past usage
    count of all items. Highest count item is recommended to all the users. These
    kinds of recommendation systems are used in news articles which recommend top
    items to each new user. If any story is clicked by more users, its count goes
    higher, and is recommended to all users.


    One drawback of these systems is that they assume each user as same type. They
    recommend same items to each user irrespective of their profile, geography and
    other attributes. The reason for this is they don''t consider user data. In this
    task we will use books data. This dataset is downloaded from `http://www2.informatik.uni-freiburg.de/~cziegler/BX/`.
