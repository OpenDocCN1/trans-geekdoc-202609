    Chapter 7


    Classification


    Classification is a supervised machine learning technique. In this we have given
    features and a categorical output. We have to predict this output by using these
    features. Models are called classifiers. The goal of a classifier is to learn
    the relationship between input variables and categorical outcome. These different
    categorical outcomes are called classes.


    Let''s understand classification using these examples Classifying emails: We get
    a lot of emails daily. Some emails contain raw text and fake discounts for products.
    These are called spam mails. When we login to our account, our email service provider
    automatically finds spam and remove it from our inbox. So, it classifies each
    email as spam or not spam. This is a kind of binary classifier because it classifies
    email in one of the two categories. Today modern email providers classify emails
    into more categories like primary, social, forum, promotions etc.


    Classify Document: When we start reading a document, we get a sense of the category
    in which document belongs. For example, news in the newspaper. It can belong to
    sports, politics, education, market etc. These all are categories. We can create
    a classifier that takes the document as input and classify it into one of the
    predefine category.


    Classify Image: We can build classifier from image. We can give input as different
    images of animal and give a label to each image i.e. cat, horse, dog, monkey etc.
    Images contains features, which can be extracted before building any model over
    it. We can train the classifier. Now this classifier can take input as any animal
    and classify them in one of the predefined animal categories.


    Text recognition: Recognizing text from handwritten data can be done by using
    classification. We can define each character, digit and symbol as a class. When
    we get image of any character, we can classify it into one of the character. Using
    this we can transform complete hand-written document in a computer readable format
    with high confidence.


    Stock prediction: Using the history of stock performance, current news, growth
    in the sector of that stocks, performance of similar stocks etc., we can build
    a classifier that advises for any stock, i.e. Buy, Sell or Hold.


    In this chapter we will learn core techniques of classification in details.


    First, we start with linear classifier, learn how to make equation by using features
    and predict class using that equation. We will move to learn logistic regression
    which also gives probability of each class. We will learn gradient descent to
    get the best model with the available data. With increasing complexity of the
    model, overfitting may come in the picture.


    We will learn how to deal with overfitting in classification task.


    For non-linear features and relationship, we will focus on decision trees.


    We will learn how to create best trees, avoid overfitting and present it graphically.
    We will also learn about best way to handle missing data in


    these techniques. Apart from accuracy, we will learn other methods exists for
    model assessment.


    We will learn random forest technique to enhance the power of decision tree and
    reduce overfitting. We will also work on Naïve Bayes algorithm which assume no
    relation between features of the dataset.


