    Time Series Analysis


    Time series contains a sequence of data points which are indexed in an order.
    This order is basically the time in which they happened or recorded.


    Points are recorded at discreate time with equal space intervals. Some of the
    examples are temperature over the year, stock price sequence at every five-minute
    interval, visitors on a website during holiday week etc.


    Time Series analysis includes methods to analyze the time series data points and
    make meaningful insights. These insights can be used as business perspective to
    get the trends and direction in past.


    Time series forecasting is the way to predict the behavior by using the past data
    points. Forecasting is very much useful to know the direction of data.


    For example, consider the demand for a drug from a pharmaceutical company. They
    can create points for there sales in past and predict demand in future. That is
    very useful to fulfill the drug requirement and do not waste any additional resource.'
