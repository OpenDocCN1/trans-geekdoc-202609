    7.3 Decision Trees


    Decision tree is a technique of classification. Decision tree is basically a tree
    in which each intermediate node represents a decision and leaf node represents
    a decision. We have learned example of decision tree in our introductory chapter.


    Here, is the example of decision tree to classify an article into predefined category.


    If the age of a person is equal or less than 15 years, we classify the article
    as Kids category. If the age is greater than 15 and Gender is Male, article will
    be classified as Politics.


    Advantages of Decision Tree Easy to explain to others. It does not need any complex
    mathematical knowledge to understand the result.


    Can handle irrelevant attributes.


    Can capture nonlinear relationships in the data.


    Decision tree learning, or construction of tree is fast process. It uses greedy
    algorithms to create trees. Also, prediction by using tree is fast.


    Normalization and other cleaning on data is not needed.


    It is not based on assumptions. In linear methods, we have to test some assumptions
    before building the model. No assumptions are needed in decision tree learning.


    Can handle both numerical and categorical attributes.


    Disadvantage of Decision Tree


    Decision tree needs to stop somewhere. Otherwise they will give no error on training
    data and high error on test data.


    Decision trees are mainly of two types:


    Classification Tree: Dependent variable is categorical. For example, predict loan
    defaulter or not using bank statements, age and gender. In classification trees,
    at any node majority class is given as prediction.


    Regression Tree: Dependent variable is continuous. For example, predict salary-based
    age, years of experience, house location etc. In regression tree, at any node
    mean value of all the values is given as predictions.


    7.3.1 Tree terminology


    Root Node: The node at the top of the tree.


    Child Node: One node is child node of other if it is below from the node (away
    from root node).


    Parent Node: One node is parent node of other if it is above of the node (closer
    to the root node).


    Siblings: Two nodes are sibling if they share same parent node.


    Leaf Node: Node which do not have any child node.


    Edge: Connection between two nodes.


    Degree: Count of sub tree of any node.


    Height of a node: Number of edges from node to leaf node having longest edges
    in the middle.


    Height of tree: Height of root node.


    ![](index-275_1.jpg)


    7.3.2 Decision Tree Learning


    Now we will focus on algorithm which is used to learn the decision tree from training
    data. Tree learning algorithms generally works from top to bottom. It checks for
    best attribute at any point of learning and create a decision node around that.
    Different algorithms have different definition of best attributes.


    Gini Score: It is based on the split of different class attribute at any node.


    Its best value is zero when node divides the data perfectly (One class completely
    on one branch and Second class completely on another branch in case of binary
    classification problem). Its worst value is 1 when both branches have classes
    in the same proportion. It considers only binary splits while creating tree.


    Our goal of decision tree learning is to create a model that reduces error.


    Error is defined as number of incorrect predictions, divided by total number of
    examples.


    Let''s take an example of 3 features and one target variable:


    Above data contains 3 features (Age range, Previous defaulters, Income range)
    and one target variable (Loan status).


    We can create a decision tree on each field. Number of possible trees can go to
    exponential. This is NP-Hard


    We use recursive algorithm to build decision tree.


    Start with empty decision tree.


    Select best feature to split.


    Split the data into different groups based on feature value.


    If no more possibility of split.


    Make prediction with majority class.


    Split the features recursively.


    This algorithm has a lot of open problems to deal with. One is how to select the
    best feature on which data is going to split. Another is the stopping criterial
    of recursion. We will solve this issues in this section.


    Let''s first start with one level decision tree, decision stump. Decision stump
    contains one decision and classify the data according to that decision.


    ![](index-277_1.jpg)


    Let''s take an example of Loan status decision tree made on above data. We have
    past data of 1000 records with 600 as Approved and 400 as Not-Approved.


    Above is the decision stump created on income range. It forms three groups from
    data based on income range. First group contains all approved status. Second group
    contains 300 approved and 50 Not Approved status. Third group contains 100 Approved
    and 350 Not Approved cases. We make the decision based on majority of class in
    that group.


    Now looking at the full dataset, let say we have K number of features. We have
    to decide out of these K feature which feature to split first, second and so on.


    So, we start by each feature, create a decision tree and calculate the overall
    error on each decision stump. The stump which gives lowest error is consider best
    to split on the data. After splitting data by that decision stump, we move to
    lower level and build a new decision stump by considering remaining K-1 features.
    This process moves till all features are finished or nothing remain more to classify.


    To make the prediction by using decision tree, we start from the root node and
    move towards leaf node.


    We can also perform multiclass classification with probability. Probability of
    a class is the number of example of that class in the group divided by total number
    of examples in the group.


    **Continuous Variable**


    Till now we have considered only categorical feature in building decision tree.
    We can also use continuous feature to build decision tree. One solution is to
    bucket the continuous data into different groups. For example, divide the income
    into different income range.'
