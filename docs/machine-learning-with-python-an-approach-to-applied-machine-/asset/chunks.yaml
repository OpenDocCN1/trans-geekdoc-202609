    ## 第 11 章：推荐系统

    推荐系统根据上下文向用户推荐有用内容的应用程序或平台。推荐系统的目标是向用户展示他们感兴趣的物品。这有助于选择并增加销售。在日常生活中，我们发现自己被推荐系统包围。当我们在任何热门电子商务网站上搜索产品时，它就开始推荐产品。例如，如果我们搜索相机并购买了，下一次系统就会开始推荐相机，等等。在视频分享平台（如
    `youtube`）中，当我们观看任何视频时，它就开始推荐视频。在 `IMDB` 等电影评分网站上，当我们对任何电影进行评分或搜索时，就开始推荐电影。


    一些流行的推荐系统有：

    - 产品推荐：Amazon, Snapdeal, Walmart

    - 音乐推荐：Last.fm

    - 电影推荐：MovieLens


    本章将介绍推荐系统的策略和方法：

