    12.4 Time Series Forecasting


    Time series forecasting is a way to predict the value of a variable in future.


    To apply any models of time series forecasting we need to make it stationary.
    Stationary means time series should have constant mean, constant variance and
    constant autocorrelation. We need to remove seasonality and trends from the data.
    Seasonality can be additive or multiplicative. We use different transformation
    on data to remove trends and seasonality. We can test the time series stationary
    or not by using Dickey-Fuller test.


    There are multiple methods and tricks present to make the time series stationary.
    We need to remove seasonal elements and trends before making any forecast. Most
    of the real-world time series data contains both seasonality and trends. Time
    series forecasting model does not need these properties for better forecasting.
    To detrend the time series we can take moving average. This can be done by window
    functions described in previous section of this chapter. We can also use linear
    regression and fit a line along with the data. Removing seasonality is difficult
    and it needs a lot of domain knowledge. For example, in a drug sale, seasonality
    may exist due to winter in each year. We can use locally weighted scatterplot
    smoothing in some cases to remove seasonality.


    After making time series stationary we can move to ARIMA model. It contains two
    types of processes. First is Moving Average(MA). This process is defined by using
    the equation:


