    ## 6.1 Introduction


    From the discussion of bias and variance, we know that if a model complexity is
    very high, bias is low, but variance is high. And if the model complexity is low,
    bias is high, but variance is low. Bias and variance play role in error in the
    model.


    Also, we have learned about overfitting in the data. Overfitting occurs when exist
    two model `A` and `B` such that: `Training Error (A) < Training Error (B)` but
    `Generalization Error (A) > Generalization Error(B)`.


    For example, consider two models in the given data. First model does not perform
    well on training data. Second model produce no error on training data. But this
    model gives high error on unseen data. This situation is called overfitting.


    ![](index-206_1.jpg)

    ![](index-206_2.jpg)


    Reducing training error with increasing model complexity, we may end up overfitted
    model which gives less performance on test data. Let''s understand increasing
    model complexity and performance using python code.


