    我们可以通过使用决策过程来理解这一点。假设你想花钱去听一场音乐会。但我们需要根据各种因素做出决定，这些因素包括：

    - 你的银行账户里有足够的钱吗？

    - 你的朋友会去吗？

    - 现在是假期吗？


    让我们这三个“是/否”问题视为输入，并将这些问题的权重分别为 `5`、`3`、`4`。如果得分大于 `6`，你就去，否则就放弃。假设你的答案是：是、是、否。你对这个问题的总分是：


    得分：`5 × 1 + 3 × 1 + 4 × 0 = 8`（大于 `6`，去，不要错过。）


    神经网络的工作方式也类似。它们对不同的神经元有不同的权重。并且一个神经元会将信息传递给另一个神经元。


    ![](img/index-396_1.jpg)


    ## 10.2.1 梯度下降


    现在的挑战是如何让神经网络从训练数据中学习。我们的目标是创建一个能够为训练数据生成正确输出的模型。换句话说，我们的模型应该最小化代价函数。


    在这里，`w` 是参数集，`b` 是偏置。`''` 表示训练样本的数量。`y` 表示实际输出，`y_hat` 是预测输出。`J` 是一个代价函数，也称为均方误差
    (MSE)。因此，显然这个函数的结果不能为负数。最好的情况是 `J = 0`。我们的参数和偏置应该以一种让代价函数趋于零的方式变化。


    我们使用梯度下降算法来完成这项工作。我们通过改变参数来减少代价，并尝试达到全局最小值。


    现在，一种改进代价函数的方法至关重要。这被称为学习率。它是我们朝着正确结果的方向修改代价函数的速率。学习率起着重要作用。如果学习率太低，收敛需要很的时间；如果学习率太高，我们可能会错过全局最小值。因此，我们需要根据问题的性质做出选择。


    在神经网络中，我们使用反向传播算法来计算梯度。在反向传播中，我们修改内部权重以生成所需的输出。


    ![](img/index-398_1.jpg)


    ## 10.2.2 激活函数


    在目前为止对神经网络的解释中，我们使用 sigmoid 函数作为激活函数。激活函数的目标是将输入信号转换为输出信号。


    该函数生成的数值范围在 `0` 到 `1` 之间。我们也可以使用其他函数进行激活。


    首先从非常简单的激活开始。假设我们可以从基于某些阈值的激活开始。如果神经元的输出大于某个阈值，我们可以将其视为 `1`，否则为 `0`。这对于二分类很有用。但这个概念在多分类中失败了，在其中我们有不同的类别，并且想要从每个神经元中取一个值。与其对激活给出布尔答案，不如说我们可以选择激活值以及下一级的最大值。


    现在考虑另一种激活函数：


    `ActLin = Cx`


    这种激活函数与输入之间存在线性关系。因此，激活是输入 `x` 的 `c` 倍。这有助于多分类问题。


    每当类别更多时，我们可以为激活设定一个范围并据此选择类别。


    一切看起来良好，但存在一个问题。该函数的梯度是 `c`。换句话说，梯度是常数。这意味着在另一层中，我们可以将其完全表示为输入的函数，并在后续所有层中也是如此。因此，我们的输出只是输入的函数。这意味着使用多个层的优势就消失了。


    神经网络背后的直觉是表示任何函数。通过使用非线性函数，我们可以学习输入和输出之间复杂且非线的关系。


    现在让我们讨论一些流行的激活函数


    ![](img/index-400_1.jpg)


    ![](img/index-400_2.jpg)


    ### 10.2.2.1 Sigmoid 函数


    Sigmoid 函数也称为逻辑函数（logistic function）。对于 `x`，函数的值为 `1/ (1+exp(-x))`。该函数是平滑且是非线性的。这些函数的组合也是非线性的，这对我们的神经网络模型是有益的。它将任何输入
    `(-inf,inf)` 的输出限制在 `[0,1]` 之间。让我们看看在 Python 中 sigmoid 函数的图表示例。


    从 `-10` 到 `10` 生成步长为 `1` 的数字。


    生成图表


    ![](img/index-401_1.jpg)


    从上面的图中可以看出，对于较大的输入值，输出保持近乎不变（`0` 或 `1`）。该函数主要用于二分类。


    ![](img/index-402_1.jpg)


    ![](img/index-402_2.jpg)


    ### 10.2.2.2 Tanh 函数


    Tanh 函数表示为 `(exp(2x) - exp(-2x)) / (exp(2x) + exp(-2x))`。它也是一个非线性函数，生成的输出范围在 `(-1,1)`
    之间。


    首先为 numpy 数组定义 tanh 函数。从 `-10` 到 `10` 生成步长为 `1` 的数字。


    生成输出图


    ![](img/index-403_1.jpg)


    ![](img/index-404_1.jpg)


    ### 10.2.2.3 ReLu 函数


    ReLu 代表整流线性单元（rectified linear units）。它的公式为：`R = Max(0, x)`。


    因此，ReLu 函数对所有负值输出 `0`，否则与给定数字相同。


    生成输出


    ![](img/index-405_1.jpg)


    ReLu 是非线性函数。它生成的范围是 `(0,inf)`。因此，该函数只会激活那些 ReLu 产生正输出的节点。


    ## 10.2.3 参数初始化


    在神经网络中，我们需要通过某些值初始化参数。我们可以将 `b` 初始化为零，但 `w` 不行。如果我们在一个层中初始化节点，它们将产生相同的输出。在权重更新后，所有节点以相同的幅度更新。因此，所有隐藏单元计算相同的函数。


    为了解决这个局限性，我们使用随机值初始化 `w`。如果使用较大的值，激活函数（`sigmoid`、`tanh`）的结果会消失。因此，学习会变慢。


    我们将使用 keras 构建第一个简单的神经网络。在这个实验中，我们将使用 iris 数据集。这是一个从 https://archive.ics.uci.edu/ml/datasets/iris
    下载的公共数据集。对于此任务，我们需要安装两个额外的库 `keras` 和 `tensorflow`。使用以下命令安装 `keras` 和 `tensorflow`。


    导入神经网络所需的库。


    ![](img/index-407_1.jpg)


    ![](img/index-407_2.jpg)


    ![](img/index-407_3.jpg)


    ![](img/index-407_4.jpg)


    加载数据。


    检查数据


    上述数据具有文本形式的类别。为了给我们的神经网络模型提供输入，我们首先需要将它们转换为独热编码。我们使用 `pandas.get_dummies()` 函数创建独热编码的类别。


    ![](img/index-408_1.jpg)


    ![](img/index-408_2.jpg)


    ![](img/index-408_3.jpg)


    ![](img/index-408_4.jpg)


    删除类别并合并独热编码值 分离独立和依赖属性 训练集和测试集划分


    '
