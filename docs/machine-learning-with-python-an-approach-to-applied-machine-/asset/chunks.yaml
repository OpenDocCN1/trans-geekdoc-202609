    7.3.3 Decision Boundaries


    We have seen decision boundaries in logistic regression. Examples explain above
    the line are classified as negative and below the line are classified as positive.


    Now, consider a decision tree. First, we have created a decision tree by using
    only one features.


    ![](index-280_1.jpg)


    ![](index-280_2.jpg)


    In above, split is made based on the value of feature 2. If we consider split
    by using both features, decision boundaries can be given as: So, in decision tree,
    decision boundaries are always parallel to axis.


    ![](index-281_1.jpg)


    Decision tree also faces the problem of overfitting. If we have so many features,
    we keep splitting and making branches, and end of very less data in each group.
    This is not the generalized solution. Creating big tree make different small boxes
    parallel to axis but they are failed on generalized data. Training error keeps
    decreasing as the depth of the tree increases, but generalization error increases.
    We can understand the relationship using: Simple decision trees are better in
    terms of overfitting. We choose the depth or complexity of decision tree based
    on the validation tree. If simple and complex tree both gives same validation
    error (or nearly same), choose the simplest one.


    There exists two ways to choose simple tree: Early Stopping: We start building
    the tree and stop at some depth (avoid large depth). We can stop where validation
    error is not decreasing anymore. We can also stop if the data at any node is small.
    For example,


