  trans: '


    # 分类特征


    分类特征是指那些包含预定义集合值的特征。例如：性别（男、女）、颜色（红、蓝、绿）、噪声水平（极高、高、好、低、极低）等。


    分类特征将数据分箱到预定义的类别中。


    此外，分类变量可能会导致一些问题。其中一个问题是类别数量过多。考虑一个印度城市的例子。我们有 10000 行数据，并将印度城市作为其中一个属性（浦纳、阿杰梅尔、斋浦、孟买、坎普尔等）。假设在
    10000 行数据中有 500 个不同的城市。现在，如果我们训练这个模型并开始预测，我们的模型将高度依赖城市。它在训练数据上过拟合以减少误差，而在泛化数据上的表现很差。


    此外，如果出现当前集合之外的城市，模型将无法预测其结果。


    为了处理这种情况，我们可以考虑考虑州而不是城市。这样，我们只需要处理 29 个州和 7 个联邦地。通过减少层级数量，我们可以创建出更好的泛化模型。


    另一个问题是某些模型只考虑数值属性。它们的代价函数是基于特征的数值的。


    此问题可以通过两种方式来处理：


    ![](img/index-100_1.jpg)


    ### 将每个值替换为数字

    我们可以将每个类别替换为一个数字。例如颜色（红-1，绿-2，蓝-3）。进行此转换后，分类属性将只包含数字，我们可以训练算法。但这种技术并不总是能正确解释数据。在上面的例子中，我们将红色替换为
    1，将蓝色替换为 3。正如我们所知，原始数据中三种颜色的权重是相等的。但在这里我们赋予了蓝色更大的权重，或者换句话说法，绿色相对于蓝色更接近红色。这是不正确的。


    ### 创建虚拟变量（Dummy Variable）

    为了解决上述问题，我们采用虚拟变量创建法。在这种方法中，我们为每个类别创建一个新特征。每个特征包含 0 和 1 的值。如果类别等于特征，则取值为 1，否则为
    0。以颜色为例，我们将创建三个特征（`is_Red`、`is_Blue`、`is_Green`）。


    在同一时刻，只有一个特征可以取值为 1。在创建新特征后，我们可以删除旧特征（在此情况下为颜色）。


    此外，我们也可以通过创建类别数-1 个特征来完成此任务。在上面的例子中，我们可以跳过创建 `is_Green` 变量。如果 `is_Red` 和 `is_Blue`
    的值为 0，意味着颜色是绿色。因此，我们没有丢失任何信息，只是消除了冗余。


    ## 3.5.3 处理基于时间的特征


    根据需要，可以将基于特征转换为分类特征。考虑一个问题，时间以 `hh:mm:ss dd:mm:yy` 的形式给出（例如 22:45:12 18:12:2017），我们需要预测那个时间的温度。


    因此，根据我们的知识，我们知道一天的温度随时间变化。因此，我们可以提取一天的时间并创建一个 `time_of_day` 特征，它包含早晨、下午、晚上和深夜四个值。


    此外，我们知道温度在一年中的不同时期也会变化。因此，我们可以提取月份（1 到 12）并创建一个 `month` 特征，并将相应的月份（一月、二月等）放入其中。我们可以再移动一个层级，根据月份的值创建
    `season` 特征（春季、夏季、秋季、冬季）。


    尽管对于这类问题存在一个独立的领域称为时间序列分析。我们将在接下来的章节中介绍。但如果日期不是我们的主要特征，我们可以进行一些转换并从中提取一些很好的特征。


    ![](img/index-102_1.jpg)


    '
