    # 第 8 章：无监督学习


    在之前的章节中，我们处理了监督学习问题。我们被给定一组特征或属性以及一个因变量。我们的任务是创建一个模型来高效地预测 `y`。`y` 可以是分类的（分类情况下），也可以是数值的（回归情况下）。我们还为我们的模型评估定义了损失函数。


    在本章中，我们将关注机器学习的另一个分支，称为无监督学习。在无监督学习问题中，数据中缺少结果/因变量 `y`。我们必须从特征集中发现属性。正如在监督学习中一样，我们的模型评估是通过损失函数完成的。但在无监督学习中，由于
    `y` 不可用，我们必须构建算法，根据特征集寻找合适的属性。这些是从没有响应变量的数据中收集的推理。因此，无监督学习中没有可标签数据，因此很难确定我们模型的性能。


    无监督学习在今天世界上有很多用例：

    - 在数据中发现最佳位置。

    - 根据不同的类型进行分组。

    - 发现模式。

    - 对客户进行细分并提供优惠。

    - 总结并提供信息。

    - 发现变量的相互依赖性。


    ## 8.1 聚类


    聚类是根据需求将对象分组，这取决于单组分布。为了理解聚类，考虑一个数据集。聚类以发现有趣的类别。

    - 聚类算法可以根据模式进行分组。

    - 考虑一家信用卡公司。

    - 收集他们的年龄、性别、地址、薪水、职位等信息。

    - 这些细节由营销人员收集。

    - 聚类在不同部分进行。

    - 聚类是根据需求进行分组。

    - 聚类是根据模式进行分组。

    - 聚类可以发现模式。


    现在，机器学习在这些问题上帮助转换联系。首先它获取所有数据（客户的个人资料、信用卡类型和过去的经历）并给出如下输出：


    ```

    {Gender:Male, Age:20-30, Location: New Delhi} => 金牌信用卡，电影票 90% 折

    {Gender:Female, Age:30-40, Location: Pune} => 钻石信用卡，星级酒店 85% 折

    ```


    现在，这些类型的卡根据客户的个人资料和兴趣直接进行推荐。因此，与其向客户展示所有类型的卡和福利，销售人员可以直接发送电子邮件或拨打电话。


    ## 8.2 K-means 聚类


    K-means 聚类根据数据点到中心的距离将其分配到 `K` 个簇之一。它从在空间中随机分配簇开始。然后根据到质心的距离将每个数据点分配到一个簇。在将每个点分配到一个簇后，会分配新的簇质心。此过程迭代运行，直到找到良好的簇。在分析中，我们假设簇的数量是预给定的，我们必须将点放入一个组。考虑一个宽带公司的场景。根据他们的市场分析和专家知识，他们认为有五类客户，并可以根据小组向他们提供优惠。在这种情况下，`K`
    等于 `5`。


    为了理解 K-means 聚类，取另一个在线游戏的例子。游戏有一个功能，其中两个玩家可以竞争，他们也可以在预定义的任务上进行。每当玩家完成任务或赢得战斗时，就会获得一些积分。获得足够的积分后，玩家会被提升到下一个级别。每当玩家点击多人游戏时，系统会寻找当前在线且与玩家技能集匹配的玩家。


    这个问题可以通过玩家的级别轻松解决。如果一个级别为 `5` 的玩家请求多人游戏，系统会尝试为其分配另一个级别相似的在线玩家。这种方法开始看起来很棒，但它存在问题。并不是所有玩家都是相同的。有些玩家


    ![](img/index-311_1.jpg)


    很容易理解游戏并表现得比别人更好。换句话说，某些玩家可以非常快地达到 `50` 级，可能只需要几天。对于其他人来说，可能需要几个月才能到达那里。


