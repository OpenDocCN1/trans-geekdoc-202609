    8.3.2 Linkage


    Different ways exist to define linkage between two clusters. Using different linkage
    techniques, we can get different cluster assignments.


    Single Linkage: Distance between two cluster is defined as the minimum distance
    between any points in both cluster. One point belongs to one cluster and second
    point belongs to another cluster.


    Complete Linkage: Distance between two cluster is defined as the maximum distance
    between any points in both cluster. One point belongs to one cluster and second
    point belongs to another cluster.


    Average Linkage: Distance between two cluster is defined as the mean distance
    between all points in both cluster. One point belongs to one cluster and second
    point belongs to another cluster.


