    首先，我们需要理解凹函数和凸函数的概念。


    ### 凹函数 (Concave function)

    这类函数是指如果我们选择两个点并应用函数，然后在两点之间画一条线，这条线始终位于函数的下方。


    ### 凸函数 (Convex function)

    这类函数是指如果我们选择两个点并应用函数，然后在两点之间画一条线，这条线始终位于函数的上方。


    在凹函数或凸函数中，导数仅在一点为零。如果导数在任何地方都不为零或在多个位置为零，则函数为


    ![](img/index-171_1.jpg)


    `既非凹非凸`。因此，通过导数我们可以找到函数的最大值或最小值。凹函数的最大可以通过爬山算法（hill climbing approach）获得。


    爬山算法从一点开始，向更接近解决方案的方向移动。考虑曲线上的点 `''a''`。我们想要找到函数值最大的点。


    取函数 `h(a)` 中的点 `''a''`。从点 `''a''` 向右或向左移动。我们可以对函数 `h(a)` 求导数。


    在点 `ai` 处，函数的导数为正，因此我们可以从 `''a''` 增加它。


    在点 `aj` 处，导数为负，因此我们想要减少 `''a''`。我们的目标是到达一个斜率（导数）为零的点，即最大值点。我们可以分为两个区域：一个是导数为正的区域，另一个是导数为负的区域。在最大值点导数为零。


    ![](img/index-172_1.jpg)

    ![](img/index-172_2.jpg)


    导数为零的点就是收敛点。因此，我们可以这样移动点：


    如果导数为正，则变大；如果导数为负，则变小；如果导数为零，两者相等且我们达到了最大值。


    要获得精确的最大值是非常困难的。我们可以说，如果 `» a` 我们停止算法。我们可以选择两个值之间的差异并将它们视为几乎相等。


    现在，为了控制点更新的速度，我们引入了另一个参数 `learning rate`（学习率）。


    在这里，`y` 代表学习率。学习率的选择非常重要。如果我们选择的学习率太高，可能会跳过最大值并在最大值周围移动。如果我们选择的学习率太低，可能需要花费很多步骤才能达到最大值。


    该问题的解决方案之一是动态学习率。从较高的学习率开始并逐渐减小它。


    同样，我们寻找凸函数的最大值最小值。


    ![](img/index-173_1.jpg)

    ![](img/index-173_2.jpg)


    对于凸函数，我们想要找到最小值。在任何点 `''a''` 处，如果导数或斜率为负，意味着我们必须增加它的值以移动到底部。同样，如果任何点的导数大于零，意味着我们需要减小
