    # Chapter 4: Data Visualization


    Data visualization is graphical representation of data. It is easier to understand
    the result by charts and graphs rather than reading tables or thousands of lines
    of raw data. Our brain can understand visual things better and it helps to take
    the decisions.


    For example, consider the way a human and computer take the decisions.


    Computer can process information much faster with large amount of data.


    Suppose we have written a program to read millions of lines of data and take a
    decision. For humans, it is not that easy. They need time to analyze the data
    and make decision. To deal with this situation, we present this data visually.
    For example, using bar chart to see the impact of each decision in past or pie
    chart showing past decision and their success.


    At the end, data scientists have to show their results to the audience, who do
    not have knowledge of machine learning algorithms, hypothesis or data engineering.
    Data Visualization helps in that way to convey the decision makers to take the
    decision. Data scientist used this as a tool to build a story around the data.


    In this chapter, we will learn how to generate graphs and charts in `python`.


    We will use functional and object-oriented approach to visualize the data.


    Some of the popular packages in `python` to visualize the data are:

    * `matplotlib`

    * `seaborn`

    * `ggplot`

    * `geoplotlib`

    * `bokeh`

    * `plotly`


    We will use `matplotlib` in this chapter. Also, we will learn to code other useful
    libraries.


    ![](index-131_1.jpg)

    ![](index-131_2.jpg)

    ![](index-131_3.jpg)


    ### 4.1 Line Chart


    It is a chart in which series of data points are connected by straight lines.
    It provides simple behavior of a parameter over the other. This is most commonly
    used to show the trends over time. We can use line chart to compare related features.


    Let''s start by generating our first chart in `jupyter notebook`. First import
    the library needed for this:


    By default, `matplotlib` open new browser tab to show the result. If we want to
    see the result in line with the current notebook, we can use this command: We
    need data along with two axes. On x-axis take number from 1 to 20. On y-axis take
    random data with `mean = 50`.


    ```python

    x = np.arange(1, 21)

    y = np.random.normal(50, 10, 20)

    plt.plot(x, y)

    plt.show()

    ```


    ![](index-132_1.jpg)

    ![](index-132_2.jpg)

    ![](index-132_3.jpg)


    ### 4.2 Bar Chart


    It is a chart in which series of data points are connected by straight lines.
    It provides simple behavior of a parameter over the other. This is most commonly
    used to show the trends over time. We can use line chart to compare related features.


    ```python

    import matplotlib.pyplot as plt

    import numpy as np


    categories = [''A'', ''B'', ''C'', ''D'', ''E'']

    values = [10, 20, 15, 25, 20]

    plt.bar(categories, values)

    plt.show()

    ```


    ![](index-133_1.jpg)

    ![](index-133_2.jpg)


    ### 4.3 Pie Chart


    It is a chart in which series of data points are connected by straight lines.
    It provides simple behavior of a parameter over the other. This is most commonly
    used to show the trends over time. We can use line chart to compare related features.


    ```python

    import matplotlib.pyplot as plt


    labels = [''A'', ''B'', ''C'', ''D'']

    sizes = [15, 30, 45, 10]

    plt.pie(sizes, labels=labels, autopct=''%1.1f%%'')

    plt.show()

    ```


    ### 4.4 Histograms


    It is a chart in which series of data points are connected by straight lines.
    It provides simple behavior of a parameter over the other. This is most commonly
    used to show the trends over time. We can use line chart to compare related features.


    ```python

    import matplotlib.pyplot as plt

    import numpy as np


    data = np.random.normal(0, 1, 1000)

    plt.hist(data, bins=30)

    plt.show()

    ```


    ### 4.5 Scatter Plot


    It is a chart in which series of data points are connected by straight lines.
    It provides simple behavior of a parameter over the other. This is most commonly
    used to show the trends over time. We can use line chart to compare related features.


    ```python

    import matplotlib.pyplot as plt

    import numpy as np


    x = np.random.rand(100)

    y = np.random.rand(100)

    plt.scatter(x, y)

    plt.show()

    ```


    ### 4.6 Box Plot


    It is a chart in which series of data points are connected by straight lines.
    It provides simple behavior of a parameter over the other. This is most commonly
    used to show the trends over time. We can use line chart to compare related features.


    ```python

    import matplotlib.pyplot as plt

    import numpy as np


    data = np.random.normal(100, 20, (100, 4))

    plt.boxplot(data)

    plt.show()

    ```


    ### 4.7 Plotting using Object Oriented way


    In above examples, we have used functions to generate the plots. We can also use
    object-oriented approach to generate this. We first define a figure object and
