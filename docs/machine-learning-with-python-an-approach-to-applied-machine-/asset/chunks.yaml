    \ the city.\n\n![](index-314_1.jpg)\n\nMove cluster centroid to the center of\
    \ the cluster data.\n\nSo, we can use training dataset to make the cluster. When\
    \ we get instances from test data, we can assign them to one of the available\
    \ cluster.\n\nIn some cases, `K` is not clearly defined, and we have to think\
    \ about the optimal number of `K`. There are ways to do that. We will discuss\
    \ that in upcoming sections. When we talk about solving supervised learning problem,\
    \ we think about cost function and tries to minimize cost of any assignment. In\
    \ the case of clustering we also defined the cost function.\n\nHere, the cost\
    \ function is not associated with any output `y`.\n\nThe cost of assignment of\
    \ any point to any cluster is given as:\n\n![](index-315_1.jpg)\n\nHere, `Xk`\
    \ is the centroid of the cluster. `Xj` is a single instance. We do it for all\
    \ points in the cluster and for all the clusters. In `K Means` clustering our\
    \ objective is to minimize the above value. Algorithm tries to shift the cluster\
    \ centroids where the above value is lower with current assignment.\n\nAfter finding\
    \ new cluster centroids again all the points are assigned to nearby cluster centroid\
    \ and distance is calculated.\n\nThe algorithm can be understood as:\n\n```\n\
    Start with K random centroids in the dataset\nWhile there is change of cluster\
    \ to any point\n    For each point in the dataset\n        For each Cluster Centroid\n\
    \            Calculate distance between point and the respective centroid\n  \
    \          Assign point to the cluster with closest centroid\n        For each\
    \ cluster calculate mean\n            Assign centroid to the mean of the cluster\n\
    ```\n\n### 8.2.1 Problem with Random assignment of Cluster centroid\n`K Means`\
    \ clustering starts with assignment of cluster to random points.\n\nNow assume\
    \ problem where points assigned to very near to each other.\n\nSo, we start clustering\
    \ algorithm and it ends with putting most of the points in one single cluster\
    \ and approximately none in others.\n\nTo handle these kind of problem, we will\
    \ start `K Means` clustering several times and choose the solution that gives\
    \ minimum cost.\n\n![](index-317_1.jpg)\n\n### 8.2.2 Finding value of K\nPreviously\
    \ we built the algorithm for a fix value of `K`. In most cases value of `K` is\
