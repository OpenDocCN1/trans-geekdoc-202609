    \ people who can repay the amount in the given timeline without any defaults.\n\
    \nFor example, if a person has monthly income of `$20K` and applied for the loan\
    \ of `$100K`, bank can grant the permission as they can see the source of income\
    \ to repay the loan. On other way, if a person of income `$3K` per month applied\
    \ for a loan of `$600K`, bank may reject his application early.\n\nSo, based on\
    \ past defaulter history bank created a data which looks like this. Red points\
    \ denote the application which got rejected by the bank. Green points denote the\
    \ application which got approved by the bank.\n\n![](index-39_1.jpg)\n\nNow what\
    \ happened to a person of monthly income as `$10K` and want a loan amount of `$300K`?\
    \ Let's separate the data by using the line. From the above line we can say that\
    \ the person with `$20K` monthly salary and `$300K` loan amount request is going\
    \ to be accepted by bank.\n\n![](index-40_1.jpg)\n\nSo, we have fitted a line\
    \ to separate the data points. We used the same algorithm (`gradient descent`)\
    \ which we use in the case of regression. Here, the target variable is categorical\
    \ instead of continuous in the case of regression. This technique is known as\
    \ `Logistic Regression`. Now, some new manager comes in the bank and checked all\
    \ the records, He thinks that the parameters by which bank is approving or rejecting\
    \ the loan request is ridiculous. Some amount like `$100K` or `$200K` is not that\
    \ risky and can be given to anyone with a valid request. So, he changed the rule\
    \ and data looks like this.\n\n![](index-41_1.jpg)\n\nClearly, it is not possible\
    \ to fit a single line to separate out red and green points. Ok, we can't separate\
    \ it by a single line but what about two lines? Let's see This is Awesome. We\
    \ have separated the Red points with Green points by using two lines instead of\
    \ one. This technique is known as Neural Network.\n\n![](index-42_1.jpg)\n\nNeural\
    \ network is based on the concept of neurons of our brain. In our brain neurons\
    \ collects the information and pass it to other neurons. Based on the input from\
    \ previous neurons, next neuron takes the call and decide the output. It also\
    \ forwards its information to other neurons. Finally, by processing different\
    \ neurons our brain takes the decision.\n\nThis concept can be understood by using\
    \ the model as shown below, in which two neurons create model by using different\
    \ assumption and forward their finding to another neuron. Output neuron takes\
    \ the decision based on information collected.\n\n![](index-43_1.jpg)\n![](index-43_2.jpg)\n\
    \nAbove are the representation of neural network by using different neurons. While\
    \ handling data, we may have different choice for choosing a line that separate\
    \ the data points. Consider the two examples\n\n![](index-44_1.jpg)\n![](index-44_2.jpg)\n\
    \n`Line 2` seems to be better in separating the data. It has more margins as compare\
    \ to `Line 1`.\n\nFinding the best line is better than any other separating line.\
    \ This solution cannot be achieved by using `gradient descent`. We need linear\
    \ optimization to find this line. This technique is known as large margin classifier\
    \ or Support Vector Machine (`SVM`).\n"
  trans: '

    通过这一行，你预测出 1250 平英尺房屋的价格为 475,000 英镑。因此，我们形成了一条线，通过房屋的大小来预测房屋的价格。这种技术被称为**线性回归**（Linear
    Regression）。我们可以通过这种技术为现有点构建一条最佳直线。首先，我们随机选择一条直线。


    ![](img/index-30_1.jpg)

    ![](img/index-30_2.jpg)


    现在，计算每个点到直线的距离。


    所以，总距离是 `a+b+c`。现在，让我们移动直线并再次计算距离。


    我们改变了直线，但距离 `a+b+c` 增加了。所以显然这没有帮助。让我们向另一个方向移动直线。


    ![](img/index-31_1.jpg)

    ![](img/index-31_2.jpg)


    这比第一个要好。现在让我们移动这条直线，并尝试反复执行同样的步骤。我们最终将完成这项任务。


    所以，根据给出的示例，这是最高效的直线。此外，在这里我们取的是距离直线的负距离。寻找这条直线的技术被称为 `gradient descent`（梯度下降）。


    有时，在所有点上拟合一条直线并没有意义。考虑所示的点集：


    ![](img/index-32_1.jpg)

    ![](img/index-32_2.jpg)


    如果我们尝试使用线性回归技术来拟合直线，它看起来是这样的：显然，这条线对于预测并不理想。相反，我们使用这条曲线对数据进行建模。


    ![](img/index-33_1.jpg)


    由于参数是多项式的，这被称为多项式回归（Polynomial Regression）。


    让我们来看另一个例子。考虑一个销售鞋子的网站。


    它包含来自不同公司的各种鞋子。你可以在他们的在线商店购买鞋子。每次成功交付鞋后，公司都会发送一封电子邮件来收集客户反馈。客户在评论区写评价并发送。有些评价是正面的，有些评价是负面的。


    由于公司每天销售数千双鞋，因此需要跟踪每条评论并采取相应的行动。例如，如果客户报告鞋子质量差，就向制造商检查该问题。或者某些鞋子反响非常高，最好将它们放在网站的首页。


    为了解决这个问题，你从一组客户评论开始。你将每条评论分类为负面或正面。考虑这些例子：


    ### 正面

    - `A1`: 质量很好！！我喜欢它

    - `A2`: 产品非常好。

    - `A3`: 给我父亲买了一双。他非常喜欢。


    ### 负面

    - `B1`: 材质不好。不合脚。

    - `B2`: 讨厌这个产品。包装也很糟糕。

    - `B3`: 永远不要买这个产品。


    所以，你从这些示例开始，开始分析正负集合。你发现如果评论中包含 `love` 这个词，它更有可能是正面评论。因此，你制定这条规则并检查整个数据集。你发现 60%
    的正面评论包含 `love` 这个词。另一方面，只有 10% 的负面评论包含 `love` 这个词。


    同样，对于其他单词


    ![](img/index-35_1.jpg)

    ![](img/index-35_2.jpg)


    所以，对于未来的任何评论，我们通过乘以概率，并根据其包含的单词判断它是正面还是负面的。这被称为 `Naïve Bayes`（朴素贝叶斯）。


    让我们来看另一个为不同的人推荐杂志的例子。假设我们记录了用户的 `age`、`gender` 和 `location` 以及他们阅读的杂志类型。这是相关的数据。


    现在，通过对这些数据的观察，我们可以看到年龄小于 15 岁的人喜欢阅读 `Kids` 杂志。让我们创建一个节点及其决策。


    这里展示了一个图。每个圆节点代表决策节点。图的边表示相应的决策。每个矩形节点代表遵循该图分支所做的决策。


    ![](img/index-36_1.jpg)

    ![](img/index-36_2.jpg)


    所以，我们可以说 `age` 小于或等于 15 岁的人可能阅读 `Kids` 杂志。现在让我们处理年龄大于 15 岁的分支。我们的第二个观察是男性，他们喜欢阅读
    `Political` 杂志。我们为他们创建相同的决策节点和分支。


    太棒了。现在处理 `age` 大于 15 岁且为 `Female` 的人。我们还有一个可以利用的信息——`Location`。


    ![](img/index-37_1.jpg)


    所以我们可以说来自 `US` 的人喜欢阅读 `Sports` 杂志，否则他们喜欢 `Business` 杂志。让我们在这里建立节点。


    我们正确地分类了每个数据点。所以这被称为决策树（Decision Tree）。可能存在多种创建决策树的方法。这些也可以根据可用数据提供正确的预测。考虑这棵树


    ![](img/index-38_1.jpg)


    它也正确地分类了数据。


    让我们来看另一个例子。每年都有很多人申请贷款。根据他们的 `income` 和贷款金额，银行决定是否给予贷款。目标是向那些能够在给定时间内偿还金额而无任何违约的人提供贷款。


    例如，如果一个人的月收入为 `$20K` 并申请了 `$100K` 的贷款，银行可以批准，因为他们能看到偿还贷款的收入来源。反之，如果一个月收入为 `$3K`
    的人申请了 `$600K` 的贷款，银行可能会提前拒绝他的申请。


    所以，根据过去的违约历史，银行创建了如下所示的数据。红点表示被银行拒绝的申请。绿点表示被银行批准的申请。


    ![](img/index-39_1.jpg)


    现在，月收入为 `$10K` 想要 `$300K` 贷款的人会怎样？让我们用直线将数据分开。从上面的直线我们可以说，月薪 `$20K` 申请 `$300K`
    贷款的人将被银行接受。


    ![](img/index-40_1.jpg)


    所以，我们拟合了一条直线来分离数据点。我们使用了与回归案例中相同的算法 (`gradient descent`）。在这里，目标变量是分类的，而不是回归情况那样是连续的。这种技术被称为
    `Logistic Regression`（逻辑回归）。现在银行来了一位新经理并检查了所有记录，他认为批准或拒绝贷款请求的参数是荒谬的。像 `$100K`
    或 `$200K` 的金额并没有那么风险，可以给任何有效的请求。所以，他改变了规则，数据如下。


    ![](img/index-41_1.jpg)


    显然，不可能用一条直线来分离红绿点。好吧，我们无法用一条直线分离它们，但两条直线呢？让我们看看。太棒了。我们使用两条直线而不是一条分离了红点和绿点。这种技术被称为神经网络（Neural
    Network）。


    ![](img/index-42_1.jpg)


    神经网络基于大脑神经元的概念。在大脑中，神经元收集信息并将其传递给其他神经元。根据之前神经元的输入，下一个神经元做出判断并决定输出。它也将其信息转发给其他神经元。最后，通过处理不同的神经元，大脑做出决策。


    可以使用所示的模型来理解这一概念，其中两个神经元通过不同的假设创建模型，并将发现转发给另一个神经元。输出神经元根据收集的信息做出决策。


    ![](img/index-43_1.jpg)

    ![](img/index-43_2.jpg)


    以上是使用不同神经元的神经网络的表示。在处理数据时，我们可能有多种选择来分离数据点的直线。考虑这两个例子


    ![](img/index-44_1.jpg)

    ![](img/index-44_2.jpg)


    `Line 2` 似乎在分离数据方面更好。与 `Line 1` 相比，它具有更大的间隔。

    '
