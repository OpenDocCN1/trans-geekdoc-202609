    9.4 Text Classification


    Classification refers to classify data in some pre-defined categories. In earlier
    chapter, we worked on different classification algorithms and classify the data
    by them. In text classification domain, text is the data.


    Classify text in one of the given category is referred as text classification.


    Given a text we can classify it in one of the category like sports, movie review,
    business news etc. We can find about sentiment of comments to understand the product
    review. We can also correct spellings based on context.


    We understand from previous chapters that machine learning algorithms works best
    with great features. The better your feature, better is your model performance.


    Extracting features from text is not straight forward. All the information needed
    to solve classification problem exists in text. We need to represent it in a meaningful
    way so that it can be used as good features for machine learning algorithms.


    Text features can be created by using words present in the text. We can remove
    stop words (The,It) from the text which are less important and common for all
    the articles. We can format it (convert case) or perform stemming to convert them
    to their base form.


    Also, we can consider properties of words to create features. For example, word
    is noun or verb, sentence is correct or not, structure of the sentence,


    ![](index-361_1.jpg)


    sequence of words (double face) etc.


    So, we can apply different classification algorithms. First, we start with Naïve
    Bayes algorithm and see how we can use this to get right answers.


    Suppose, we have given some text and we want to classify it in one of the category
    - politics, sports and business.


    Now we got the article with text - ''presidential election impact economy''.


    As we can guess the article related to politics. But it also contains some information
    that it can relate to Business category also. As for now we have to choose one
    category, we will go for the most likely - Politics.


    So, to use the naïve Bayes classifier to understand and generate predictions we
    have to define its terms.


    Prior probability refers to the percentage of each class in the training data.


    For example, in our training data Politics appears 50% of the time, we say it''s
    prior probability is 0.50.


    Posterior probability refers to probability of class ''Politics'' if the word
    is


    ''Presidential''.


    As we know for this from naïve Bayes:


    We can use the same for our text data:


    ![](index-362_1.jpg)


    ![](index-362_2.jpg)


    We can calculate the same for other categories also. Whichever value is highest,
    we can assign that article to that category.


    We also have to consider that naïve Bayes algorithm consider features independence.
    So, we calculate probability of each class by We calculate the class by calculating
    probability of each words given a class and multiply them together. Also, we multiply
    them with the Prior probability of class Y.


    Prior probability and Likelihood can be calculating by iterating over the training
    data and count the occurrence of words.


    Probability(Y) can be calculated as number of document which are classified as
    Y divided by total documents.


    Probability(xj | Y) can be calculated as word xj appears in the document classified
    as Y divided by total number of Y documents.


    For example


    ![](index-363_1.jpg)


    Total number of document = N


    Total number of document having class politics = P


    Total number of P documents having word ''Presidential'' = X


    Probability(''Politics'') = P/N


    Probability(''Presidential''| ''Politics'') = X/P'
