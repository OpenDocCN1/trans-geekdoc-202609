    ### 第 7 章：分类


    分类是一种监督学习技术。在这种情况下，我们提供了特征和分类输出。我们需要通过这些特征来预测该输出。这些模型被称为分类器。分类器的目标是学习输入变量与分类结果之间的关系。这些不同的结果被称为类别（classes）。


    邮件分类：我们收到大量的邮件。有些邮件包含原始文本和产品折扣，这些被称为邮件。当我们登录账户时，电子邮件服务会自动找到垃圾邮件并从收件箱中删除。因此，它将每封邮件分类为垃圾邮件或非垃圾邮件。这是一个二分类器，因为它将邮件分为两个类别之一。现代邮件提供商会将邮件分为更多类别，如主要、社交等。


    文档分类：当我们开始阅读文档时，能够感觉到文档所属的类别。例如，新闻可以属于体育、教育、市场等。这些都是类别。我们可以创建一个以文档为输入并分类为预定义类的分类器。


    图像分类：我们可以从图像构建分类器。我们可以将不同的图像作为输入，并为每个图像赋予标签，即猫、狗、猴子等。图像包含了在构建任何模型之前可以提取的特征。现在，这个分类器可以接受任何图像并将其分类为预定义类别之一。


    文本识别：使用分类可以识别手写数据中的文本。我们可以将每个字符和符号定义为一个类。当我们得到任何字符时，我们可以以很高的信度将其分类为计算机可读格式的字符之一。


    股票预测：利用股票历史表现、当前新闻、行业增长等，我们可以构建分类器来为任何股票提供建议，即买入、卖出或持有。


    在本章中，我们将详细学习分类的核心技术。首先我们从线性分类器开始，学习如何使用特征建立方程，并使用该方程预测类别。我们将转向逻辑回归，它也会给出每个类的概率。我们将学习梯度下降法以利用可用数据获取最佳模型。随着模型复杂性的增加，可能会出现过拟合。我们将学习如何在分类任务中处理过拟合。


    对于非线性特征和关系，我们将关注决策树。我们将学习如何创建最优树、避免过拟合并以图形形式展示。我们还将学习在这些技术中处理缺失数据的最佳方法。除了准确率外，我们还将学习其他模型评估方法。我们将学习随机森林技术来增强决策树的力量并减少过拟合。我们还将在朴素贝叶斯算法上工作，该算法假设数据集的特征之间没有关系。


    ![](img/index-243_1.jpg)


    ### 7.1 线性分类器


    在线性分类器中，输出是输入的加权和。为了理解线性分类器背后的直觉，让我们以在线书店为例。我们的任务是获取显示在网站首页的顶部书籍。我们有关于书籍的数据以及关于该书籍内容的评论。我们希望推广获得读者好评的书籍。此外，对于每条新评论，我们希望将其分类为正面反馈或负面反馈。


    示例 1：太棒了。喜欢反复阅读它。 - 正面

    示例 2：写得很好。解释了核心概念。 - 正面

    示例 3：写作方式糟糕。错误百出。 - 负面


    现在假设我们生成了与重要单词相关的权重。


    ![](img/index-244_1.jpg)


    让我们计算与以下示例相关的得分：

    测试示例：书很好。它有一些语法错误，但总的来说是一本很好的读物。我喜欢它。

    `Score(Test-Example): nice + mistakes + like = 1.3 - 1.7 + 1.6 = 1.2`（正面）。


    因此，如果得分大于零，我们就说反馈是正面的。


    我们可以从下面理解该过程：

    首先我们获取数据并将其分为训练集和验证集。在训练集上应用分类算法并生成分类器模型。该模型在验证集数据上进行评估。


    决策边界是将一类的决策与其他类分开的边界。考虑一个具有两个数值特征且输出为二的（正或负）的数据集。


    ![](img/index-245_1.jpg)

    ![](img/index-245_2.jpg)


    正类一类的示例，负是另一类的示例。在这种情况下，决策边界将是一条线。线上的任何点属于负类，线下的任何点都属于正类。


    如果特征是 2，决策边界是一条线。

    如果特征是 3，决策边界是一个平面。

    如果特征大于 3（高维），决策边界是一个超平面。


    因此，在线性分类器的情况下，我们的模型将如下：

    `Model = w0 + w1*x1 + w2*x2 + ... + wn*xn`

    其中 `w` 是输入 `x` 的系数，其中 `w0` 取值为 1。


    与其给出类别，不如给出支持该类别的概率。考虑以下语句：

    “书很好，但我不会向其他人推荐它。”


    对于这条语句，我们不确定是正面反馈还是负面反馈。我们不确定类别。因此，与其给出类别，不如给出该评论所属的每个类别的概率。类别的概率是示例属于该类的几率。对于每个类，它从
    0 到 1 变化。如果概率为 0，则拥有该类的几率为无。如果概率为 1，我们 100%确定示例属于该类。


    ![](img/index-247_1.jpg)


    #### 概率的属性

    - 概率始终在 0 和 11 之间。

    - 所有类别的概率之和为 1。

    - 条件概率是在某些条件已满足的情况下，某个结果发生的概率。例如，在邮件文本包含 `discount` 一词的情况下，邮件是垃圾邮件的概率是多少。我们将使用这个条件概率来预测类别。


    ![](img/index-248_1.jpg)


