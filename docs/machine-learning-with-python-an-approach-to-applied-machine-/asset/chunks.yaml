- raw: 'After identifying data on higher level basis, we need to transform or preprocess
    it to make it useful for machine learning algorithms. These are some of the process
    involves in preprocessing of the data.


    Cleaning: Data may have errors which needs to remove for processing.


    Suppose data have missing values for some attributes. Now some of the good algorithms
    cannot deal with missing values. So, we replace missing values with some value
    (mean/median for numerical values and default for categorical values). Sometimes
    data contains sensitive information like email id and contact number of users.
    We need to remove it before sharing the data with the team.


    Formatting: Algorithm needs data in predefined format. Python based machine learning
    libraries expects data in the form of python list. Some real-time machine learning
    libraries use json format of data. Other, tools use csv for excel file. Depending
    on what tool or technique we are using, we need to format the data and put in
    the correct form.


    Sampling: Not all the data is useful. Specially for some algorithm which stores
    the data in the model, it is difficult to generate prediction in real time. We
    can remove the similar instances from data. If the data is labeled, we can remove
    the instances in the same proportion.


    Decomposition: Some features are more useful if decompose. Consider date attribute
    in a dataset. We can decompose the date in day, month and year. We can also create
    features like weekend or weekday, quarter of the year, leap year or with dates
    to make it more useful in predictions.


    Scaling: Different attributes follow different units and values. Suppose we are
    measuring height of a person in centimeters. For some data, it may be available
    in inches, so, first we need to transform that to centimeters.


    Also, higher/lower value of one attribute may affect the other attributes.


    For example, we have three features, such as person age, weight and annual income
    and we want to predict health insurance plan. If we use the data directly, model
    will depend highly on salary as the values are much higher as compare to other
    attributes. So, we need to scale each attribute to \[0,1\] or \[- 1,1\].


    This process is also known as Feature We work on feature select, preprocess and
    transform it in a form that is useful for Machine Learning algorithms.


    **4\. Split data in training and testing**


    The goal of any machine learning algorithm is to predict well on unseen new data.
    We use training data to build the model. In training data, we move the algorithm
    in the direction which reduces training error. But we cannot consider accuracy
    on training data as the generalized accuracy. The reason is that the algorithm
    may memorize the instances and classify the points accordingly. So, to evaluate
    them, we need to divide them in training and testing. We train our algorithm on
    training data and calculate final accuracy by running them on testing data. Testing
    data is hidden to the algorithm at the time of training.


    One general method is to use 60-80% data in training and rest of it as testing.
    So, the model which gives best result on test data is considered and accepted.


    ![](index-24_1.jpg)


    **5\. Algorithm selection**


    We start with our set of machine learning algorithm and apply on feature engineered
    training data. Algorithm selection depends on the problem definition. For example,
    if we are collecting data from emails and classifying them in spam or not spam,
    we need algorithms which takes input variable and gives an output (spam/not spam).
    These types of algorithms are known as Classification algorithm (Decision Tree,
    Naïve Bayes, Neural Networks etc.). If we want to predict any continuous variable
    (i.e. sales in an upcoming quarter), we use Regression algorithms (linear regression,
    kernel regression etc.). If our problem does not have any output or response associated
    and we can group them based on their properties, we use Clustering algorithms.
    So, there are bunch of algorithms in each category. We will see examples in next
    section.


    **6\. Training the algorithm**


    After algorithm selection we start with training the model. Training is done on
    training dataset. Most of the algorithm start with random assignment of weights/
    parameters and improve them in each iteration. In training algorithm, steps run
    several times on the training dataset to produce results. For example, in the
    case of linear regression, algorithm starts with randomly placing the separating
    line and keep improving itself (shifting the line) after each iteration.


    **7\. Evaluation on Test data** After creating best algorithm on training data,
    we evaluate performance on test dataset. Test dataset is not available to algorithm
    during training. So, algorithm decisions are not biased by test dataset points.


    **8\. Parameter Tuning**


    After selecting right algorithm for our problem, we start it and try to improve
    it for better performances. Each algorithm has different types of settings which
    we can configured and change the performance. This is called Parameter For example,
    for learning rate of algorithm, we can change the rate of learning and improve
    the performance. These parameters are called Hyper Modifying these parameters
    is more like an art.


    **9\. Start Using your model**


    After completing all the above steps, you are ready with the model which you trained
    and evaluated on your test dataset. Now you can use this model to start predicting
    the values for the new data points. For production environments, you can deploy
    the model to the server and use its prediction power by communicating using APIs.
    Off course this model will not be always same. Whenever you get new data, you
    start by looking all the above steps to improve your performance.


    So, in machine learning we start by our problem and finally finish with a prediction
    algorithm to solve the problem.


    ![](index-26_1.jpg)


    Let''s start by some problem and try to see how machine learning algorithm can
    be used to solve this.


