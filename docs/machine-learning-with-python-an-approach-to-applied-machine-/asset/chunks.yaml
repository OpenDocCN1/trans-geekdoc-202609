    ## 12. 时间序列预测


    时间序列预测预测变量未来值的方法。


    为了应用任何时间序列预测模型，我们需要使其平稳。平稳意味着时间序列应该具有恒定的均值、恒定的方差和恒定的自相关性。我们需要从数据中消除季节性和趋势。季节性可以是加性的或乘性的。我们对数据使用不同的变换来消除趋势和季节性。我们可以通过使用
    `Dickey-Fuller test` 来测试时间序列是否平稳。


    目前有多种方法和技巧可以使时间序列平稳。在进行任何预测之前，我们需要消除季节性元素和趋势。大多数真实世界的时间序列数据都包含季节性和趋势。时间序列预测模型不需要这些属性即可获得更好的预测。为了消除时间序列的趋势，我们可以取移动平均值。这可以通过本章上一节描述的窗口函数完成。我们还可以使用线性回归并沿着数据拟合一条线。消除季节性是困难的，需要大量的领域知识。例如，在药物销售中，季节性可能由于每年的冬季存在。某些情况下，我们可以使用局部加权散点平滑来消除季节性。


    在使时间序列平稳后，我们可以转向 ARIMA 模型。它包含两种过程。第一种移动平均(MA)。该过程通过以下方程定义：


    ![](img/index-477_1.jpg)

    ![](img/index-477_2.jpg)

    ![](img/index-477_3.jpg)


    `μ` 是均值，`θ` 是参数。


    因此，值等于过去数据中的均值加上误差项。


    如果我们使用以零为中心的数据或均值为零的数据，ARIMA 中的另一个过程是自回归 (AR) 过程。


    自回归过程表示为：因此，时间 `t` 的值取决于之前的时间。在自回归过程中，过去的值会影响当前值。也存在误差项。


    ARIMA 为：


    - `AR` = 自回归项

    - `I` = 差分（由于去趋势）

    - `MA` = 移动平均项


    当时间序列平稳时，ARIMA 模型非常有用。如果时间序列不平稳，ARIMA 模型将用不大。根据数据，我们可以决定使用 ARIMA 模型中的哪种变体或设置。首先，我们需要检查数据中的趋势并进行适当的变换。某些


    ![](img/index-478_1.jpg)

    ![](img/index-478_2.jpg)


    某些库使用极大似然估计来获取 ARIMA 模型的正确参数。


    让我们构建第一个 ARIMA 模型。我们将取一组数据并对其进行不同的变换。最后，我们将应用 ARIMA 模型进行时间序列预测。


    数据是航空乘客数据。它包含从 49 年 1 月到 60 年 12 月某航空公司的每月乘客。数据公开可用。我们使用 `Month` 作为日期类型，并将此列作为此
    dataframe 的索引。检查数据中的初始记录：现在，我们的任务是使这个时间序列平稳。首先，我们检查当前时间序列是否平稳。如果统计属性随时间保持不变，则时间序列是平稳的。时间序列应该具有以下属性：


    - 恒定的均值

    - 恒定的方差

    - 自协方差与时间无关


    ![](img/index-479_1.jpg)

    ![](img/index-479_2.jpg)


    为了对数据进行分析，首先对其绘图。可以看到数值随时间增加。存在季节性趋势，但整体数值在增加。我们可以使用 `Dickey-Fuller Test` 来检查时间序列是否平稳。在此测试中，我们假设零假设是不平稳的。备择假设时间序列是平稳的。结果包含统计量和不同置信水平的临界值。如果临界值大于统计量，我们可以拒绝零假设并接受备择假设。


    导入 `Dickey-Fuller Test` 的库


    ![](img/index-480_1.jpg)


