    因此，我们可以将所有训练数据作为验证集，并考虑平均性能。这种技术被称为`K 折交叉验证`（K-Fold Cross Validation），我们将数据集划分为
    `K` 。


    我们训练模型 `K` 次。每次取 `K` 份中的一组作为验证，其余 `K-1` 份用于训练。对 `K` 份中的每组执行此操作，并获取每个模型的误差。最终误差是这
    `K` 个验证集上所有误差的平均值。


    当 `K` 的值等于训练样本的数量时，它能给出误差的最优近似。但这样做在计算上是非常昂贵的，因为我们必须为每个数据点训练模型。这被称为`留一`（Leave
    One Out）交叉验证。通常 `K` 选择为 `5`、`10` 或 `20`。


    为了估计我们的调优参数，我们选择 `g` 的某个值并计算交叉验证误差。对 `g` 的每个可能值重复此过程。交叉验证误差最低的值认为是最好的。


    ![](img/index-219_1.jpg)


    ![](img/index-219_2.jpg)


    岭回归有助于减少过拟合。我们可以应用更高的惩罚。


    `alpha = 0`（等同于线性回归最小二法解）


    ![](img/index-220_1.jpg)


    `alpha = 0.01`


    ![](img/index-221_1.jpg)


    ![](img/index-221_2.jpg)


    `alpha = 1`


    ![](img/index-222_1.jpg)


    `alpha = 100`


    ### 6.3 Lasso 回归


    良好的特征对于任何模型的良好运行都是必要的。但当特征很多时，我们需要大量的计算来构建模型。


    考虑一个特征为字典中单词的问题。这些特征可以达到数百万。如果我们考虑单词的组合，这些数字可以达到数十亿。如果我们在其上运行回归算法，模型需要找到数十亿个参数并在训练上花费大量时间。


    特征选择是一个选择有用特征的过程。我们在特征工程章节尝试过一些技术。我们将使用 lasso 回归来完成这项工作。


    #### 6.3.1 全子集算法


    一种方法是找到特征的所有可能组合，并为每个组合训练模型。


    对于 `i = 1` 到 `number_of_features`：

    1. 取所有 `i` 个特征的组合

    2. 在选定的特征上训练模型

    3. 使用交叉验证计算 `Error`

    4. 选择误差最小的模型。


    该算法的运行时间复杂度是指数级的。如果特征数量较少，该算法是很好的。但如果特征数量很大，应用该算法在计算上将是非常昂贵的。


    如果我们有总共 `D` 个特征，我们必须训练和测试 `2^D` 个模型。


    ![](img/index-225_1.jpg)


    显然，对于大量特征来说这不是好技术。


    #### 6.3.2 特征选择的贪心算法


    贪心算法基于在可用特征集中找到最佳特征。我们将该特征添加到列表中，并从可用列表中移除该特征。


    - `Feature set 特征集 = 空`

    - `Available set  = 所有特征`


    对于 `i = 1` 到 `number_of_feature`：

    1. 使用当前最佳特征和特征集拟合模型。

    2. 从可用列表中移除选定的特征并将其放入 `Feature set`。

    3. 使用交叉验证计算 `Error`

    4. 选择误差最小的特征集。


    训练误差在每一步都会下降。我们必须使用验证集方法来决定停止点。


    在此算法中，首先，我们训练模型 `D` 次。下一次我们需要训练模型 `D` 次……（此处省略重复内容）

