    it controls the balance between `RSS` and `norm`.


    If the value of tuning parameter `γ` is zero, it is same as our earlier solution
    and cost is equal to `RSS` only. If the value of `γ` is very high, we are neglecting
    the `RSS` and focusing on magnitude coefficients only.


