    ## 7.3 决策树


    决策树是一种分类技术。决策树基本上是一种树，其中每个中间节点代表一个决策，叶节点代表一个决策。我们在介绍章节中学习过决策树的示例。


    这里有一个将文章分类为预定义类的示例。


    如果一个人的 `age` 等于或小于 15 岁，我们将文章分类为 `Kids` 类别。如果 `age` 大于 15 岁且 `Gender` 为 `Male`，文章将被分类为
    `Politics`。


    ### 决策树的优点

    - 易于向他人解释。理解结果不需要任何复杂的数学知识。

    - 可以处理无关属性。

    - 可以捕捉数据中的非线性关系。

    - 决策树学习或树的构建是一个快速过程。它使用贪心算法创建树。此外，使用树进行预测很快。

    - 不需要对数据进行归一化或其他清理。

    - 它不假设。在在线方法中，我们必须在构建模型之前测试某些假设。决策树学习不需要假设。

    - 可以同时处理数值和分类属性。


    ### 决策树的缺点

    决策树需要在某处停止。否则，它们在训练数据上不会产生错误，但在测试数据上产生高错误。


    决策树主要有两种类型：

    - **分类树**：因变量是分类的。例如，使用银行流水、`age` 和 `gender` 预测是否会违约。在分类树中，任何节点处的多数类都作为预测结果。

    - **回归树**：因变量是连续的。例如，根据薪水预测年龄、工作年限、房屋位置等。在回归树中，任何节点处所有值的平均值都作为预测结果。


    ### 7.3.1 树的术语

    - **根节点**：树顶部的节点。

    - **子节点**：如果一个节点位于另一个节点下方（远离根节点），则该节点是另一个节点的子节点。

    - **父节点**：如果一个节点位于另一个节点上方，则该节点是另一个节点的父节点。

    - **兄弟节点**：共享同一个父节点的节点。

    - **叶节点**：没有子节点的节点。

    - **边**：节点之间的连接。

    - **度**：节点的计数。

    - **节点的高度**：边的数量。

    - **树的高度**：根节点的数量*。


    ![](img/index-275_1.jpg)


    ### 7.3.2 树的学习

    现在我们关注如何构建构建树。决策树学习从上到下工作。


    `Gini Score`：它基于不同的属性。当节点完美划分数据时，其最佳值为 0。当两个分支的比例相同时，其最差值为 1。我们树学习的目标是减少误差。误差定义为错误预测的次数除以示例总数。


    让我们来看一个有 3 个特征和一个目标变量的示例：

    上面的数据包含 `Age range`、`Previous defaulters`、`Income range` 和一个目标变量（`Loan status`）。


    我们可以在每个特征上创建决策树。可能树的数量可以呈指数级增长。这是 `NP-Hard` 问题。


    从空决策树开始。选择最佳特征进行分割。根据特征值将数据划分为不同的组。如果没有进一步分割的可能性，则根据多数类进行预测。


    递归地分割特征。该算法有很多待解决的问题。其中之一是如何选择数据进行分割的特征特征。另一个是递归的停止标准。我们将在本节解决这些问题。


    让我们先从单层决策树开始，即决策桩（decision stump）。决策桩包含一个决策并根据此对数据进行分类。


    ![](img/index-277_1.jpg)


    让我们以上述数据为例，对贷款状态做出决策。我们有 1000 条记录的历史数据，其中 600 条为批准（Approved），400 条为未批准（Not-Approved）。


    上面是基于 `income range` 创建的决策桩。它根据收入范围从数据中形成三组。第一组包含所有批准状态。第二组包含 300 个批准状态和 50 个未批准状态。第三组包含
    100 个批准状态和 350 个未批准案例。我们根据该组中的多数类做出决策。


    现在观察整个数据集，假设我们有 K 个特征。我们必须决定在这 K 个特征中哪个特征先分割，第二个哪个，以此类推。


    因此，我们从每个特征开始，创建一个决策树并计算每个决策桩的整体误差。误差最小的决策桩被认为是分割数据的最佳选择。通过该决策桩分割数据后，我们移动到较低层次并考虑剩余的
    K-1 个特征构建新桩。


    ### 连续变量

    到目前，我们在构建决策树时只考虑了分类特征。我们也可以使用连续特征来构建决策树。一种解决方案是将连续数据分到不同的组。例如，将收入划分为不同的收入范围。


    '
