  \ 平台的名称、是否为商业平台以及对其用途的简要描述。\n\n## 敏捷 (AGILE)\n\n| IoT 平台 | 平台性质 | 简要描述 |\n| :---\
  \ | :--- | :--- |\n| `Resin.io` | 商业 | 针对 Linux 设备的设备平台。它使得远程设备上部署、更新和维护代码变得简单。\
