- "# 物联网平台互操作性进阶\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n![](img/img01.jpg)\n\n\
  # 免责声明\n\n本文档中的信息按“原样”提供，不保证该信息适用于任何特定目的，也不提供任何保证或担保。用户使用该信息需自行承担其全部的风险和责任。\n\n\
  本文档仅反映作者的观点，欧盟委员会（EC）对于对其中包含的信息可能进行的任何使用均不承担责任。\n\n# 1 执行摘要\n\n物联网欧洲平台倡议 (IoT-EPI)\
  \ 项目正在解决物联网以及联网智能对象平台的主题，旨在提供一种扩展到联网设备和对象平台网络中的物联网，该网络支持具有动态自适应配置能力的智能环境、业务、服务和人员。研究活动的重点关注领域是架构和语义互操作性，这些领域可靠地涵盖了多个用例。目标是为联网智能对象提供动态配置的基础设施和集成平台，涵盖多种技术和多种智能制品。IoT-EPI\
  \ 生态系统的创建旨在增加物联网相关欧洲研究和创新的影响，包括七个关于物联网平台的欧洲前景项目：`AGILE`、`BIG IoT`、`INTER-IoT`、`VICINITY`、`SymbIoTe`、`bIoTope`\
  \ 和 `TagItSmart`。\n\n本白皮书提供了关于 IoT-EPI 创建和使用的物联网平台及生态系统中互操作性的见解。本文档的范围涵盖了处理现有物联网平台互操作性的方面、挑战和方法，并对该背景下互操作性的未来提供了一些见解。它提出了可能的解决方案以及一种可能的物联网互操作性平台架构。\n\
  \n由于互操作性在物联网系统中具有关键且重要的作用，它与物联网中的许多相关主题和方面密切相关：性能、兼容性、集成、投资率 (ROI)、市场认可、开发设计。\n\n\
  本白皮书的编写和开发利用了 IoT-EPI 框架内其他活动的成果和可用信息。特别是，补充作者的重要信息来源是 IoT-EPI 报告。\n\n关于这项工作，本白皮书旨在成为物联网平台互操作性的有用信息来源。物联网系统中的这一关键方面对每个\
  \ IoT-EPI 主题（创新、平台互操作性、社区建设、业务模式、教育平台、国际合作）具有相关性和影响。\n\n# 2 物联网平台格局\n\n## 2.1. 定义\n\
  \n物联网平台可以定义为一个智能层，它将事物连接到网络，并将应用程序从事物中抽象出来，旨在实现服务的开发。物联网平台实现了几个主要目标，例如灵活性（能够在不同上下文中部署事物）、易用性（能够使用用户体验简单）和生产力（通过创建服务来提高效率，同时也实现新服务的开发）。物联网平台促进通信、数据流、设备管理和应用程序的功能。目标是在物联网平台框架内构建物联网应用。\n\
  \n\n\n\nIoT 平台的功能涵盖了从传感器/执行器、硬件到连接、云端和应用的数字价值链，如图 2.1 所示。硬件连接平台用于连接边缘设备并在数据中心外部处理数据（边缘计算/雾计算），并对设备进行编程以做出做出决策。其核心优势是通过使用从传感器到数据中心的高级数据管理和分析实现的安全性、互操作性、可扩展性和可管理性。IoT\
  \ 软件平台包括异构传感器/执行器的集成；各种通信协议抽象了所有这些复杂性，并为开发者提供了简单的 API，以便通过任何网络与任何传感器通信。\n\n![图 2.1.\
  \ 覆盖数据价值链的 IoT 平台 [1]](images/fig2_1.jpg)\n\n**图 2.1.** 覆盖数据价值链的 IoT 平台 [1\\]\n\n\
  IoT 平台还协助数据摄入、存储和分析，因此开发者可以专注于构建应用程序和服务，而这正是 IoT 的真正价值所在。云提供商提供基于云的 IoT 平台，支持开发者在他们的云上构建\
  \ IoT 解决方案。基础设施即服务 (IaaS) 供应商和平台即服务 (PaaS) 供应商提供了涵盖不同应用领域的 IoT 开发者解决方案。PaaS 解决方案抽象了底层的网络、计算和存储基础设施，侧于移动和大数据功能，同时转向抽象边缘设备（传感器/执行器），并添加了数据摄入/处理和分析服务的特性\
  \ [1\\]。\n\nIoT 平台的定义在主要功能上重叠，但在细微细节上可能有所不同。Gartner 对 IoT 平台提出了最简洁的定义之一 [2\\]。它将\
  \ IoT 平台定义为软件套件或 PaaS 云产品，用于监控并可能管理和控制各种类型的终端，通常通过端用户在平台上构建的应用程序来实现。它促进了涉及 IoT 终端的操作以及与企业资源的集成。平台应该能够：\n\
  \n*   设备及其应用程序软件的配置与管理\n*   数据的聚合、集成、转换、存储和管理（通常统称为“数据消化”）\n*   事件处理（规则引擎/编排/BPM）\n\
  *   应用程序的定制与构建（SDK、应用服务器、IDE 等）\n*   IoT 数据分析与可视化\n*   网络安全\n*   IoT 设备通信（网络和/或互联网）\n\
  *   适配器（API 枢纽、网关软件，也指向终端上的应用程序）\n*   面向最终用户和开发者的用户界面\n\nIoT 平台促进了通信、数据流、设备管理和应用程序的功能。平台本身并不是应用程序，尽管许多应用程序可以完全在\
  \ IoT 平台框架内构建。它将机器、设备、应用程序和人类连接到数据和控制中心。它不仅限于实体中央指挥；理想情况下，可以从许多不同的位置点进行访问和管理。它采用了更优、更快的搜索引擎和数据存储系统，其容量和复杂性远超将行业带至现在的水平\
  \ [3\\]。\n\nIoT 的根源是连接性：更多的事物、更多的人，以及它们之间产生的连接矩阵。然而，在不到十年的时间里，技术已经远远超出了这一考虑。许多公司可能认为在内部构建平台是有优势的，但现在已经清楚，大部分技术栈现在可以使用开箱即用的工具来实现。\n\
  \nIoT 平台独立存在 IoT 技术栈的硬件层和应用层之间。理想的平台将与任何连接设备集成，与设备应用程序融合，并以相同的方式在任何设备中实现 IoT 特性和功能。\n\
  \nThingWorx [4\\] 将 IoT 平台定义为一组组件，能够：\n\n*   部署监控、管理和控制连接设备的应用程序。\n*   从连接设备远程收集数据。\n\
  *   设备之间独立且安全的连接。\n*   设备/传感器管理。\n*   与第三方系统集成。\n\nLink Labs [5\\] 从高层将 IoT 平台定义为“将边缘硬件、访问点和数据网络连接到价值链其他部分（通常是端用户应用程序）的支撑软件”。IoT\
  \ 平台通常处理持续的管理任务和数据可视化，允许使用户实现环境的自动化。你可以将这些平台视为边缘采集的数据与面向用户的 SaaS 或移动应用程序之间的中间人”。\n\
  \n\n\n\n实现互操作性是物联网（IoT）的主要目标之一。正如“物联网”这一名称所言，它在于连接万物并使它们能够像今天的互联网一样易于访问。“广义地说，互操作性可以定义为：不同的系统、组织和/或个体共同工作以实现共同目标的程度衡量”\
  \ \\[6\\]。然而，互操作性是一个复杂的概念，它包含许多方面。在文献中，对这些互操作性方面存在许多不同的分类，通常也称为互操作性层次。对于技术系统而言，互操作性层次最重要的分类之一是`概念互操作性层次模型`（LCIM），并在图\
  \ 3.1 中所示。尽管它是在仿真理论背景下创建的，但具有更广泛的适用性。它定义了六种互操作性层次：技术、语法、语义、务实、动态和概念互操作性。\n\n欧洲互操作性框架的设计旨在“支持向公民和企业提供泛欧电子政府服务”\
  \ \\[8\\]，它仅定义了三个层次：技术、语义和组织互操作性。\n\n![图 3.1 概念互操作性层次模型 \\[7\\].](images/fig3_1.jpg)\n\
  \n**图 3.1** 概念互操作性层次模型 \\[7\\]。\n\nETSI 和 AIOTI 提供了更针对物联网的分类，定义了四个层次 \\[9\\]：技术、语法、语义和组织互操作性。简而言之定义如下：\n\
  \n*   • **技术互操作性**：通常与通信协议以及运行这些协议的基础设施相关。\n*   • **语法互操作性**：通常与数据格式和编码相关，例如 XML、JSON\
  \ 和 RDF。\n*   • **语义互操作性**：与交换内容（信息）含义的共同理解相关。\n*   • **组织互操作性**：与组织跨不同信息系统、基础设施、区域或文化进行有效通信和信息传输的能力相关。\n\
  \n由于这是物联网领域最认可的互操作性层次分类，我们在本文中遵循这一标准。\n\n## 3.1 物联网平台互操作性挑战\n\n### 3.1.1 物联网互操作性模式\n\
  \n实现物联网的互操作性需要密切观察物联网生态系统中关键组件的交互。在研究技术互操作性、语法互操作性、语义互操作性和组织互操作性的细节之前，我们在这里分析了这些交互，并在图\
  \ 3.2 中识别出六种通用的物联网生态系统互操作性模式。本节基于 \\[10]]发布的材料。\n\n“跨平台访问”模式 (图 3.2, I) 是物联网生态系统的基本特征。该模式的目标是隐藏应用程序或服务通过相同接口访问资源（信息或功能）的事。\n\
  \n“跨应用访问”模式 (图 3.2, II)扩展了“跨平台访问”模式。其目标是允许服务不仅从不同平台访问信息和功能，还能从托管数据的平台通过相同接口进行访问。\n\
  \n“平台独立性”模式 (图 3.2, III) 的目标是允许单个应用程序或服务运行在不同的平台上。当产生数据的传感器基于完全不同的技术时，这尤为具有挑战性。\n\
  \n“平台规模独立”模式 (图 3.2, IV) 是向连接的服务和应用程序隐藏不同的平台规模。`服务器级`平台是连接了大量设备的平台（例如云平台），而`设备级`平台允许直接访问连接的传感器，`雾网级`平台则是边缘网关等中介设备。\n\
  \n最后，“高级级服务面部”模式 (图 3.2, V) 将互操作性要求从平台扩展到更高级的服务。在这里，服务的作用类似于平台，并通过通用接口提供物联网产品。\n\
  \n![图 3.2 互操作性模式 \\[10\\].](images/fig3_2.jpg)\n\n**图 3.2.** 互操作性模式 \\[10\\].\n\n\
  \n\n\n\n平台与平台之间的直接交互使得现有的（原生）应用程序可以使用由其他联邦平台管理和运行的资源，就像这些资源是由单一平台提供的一样，如图 3.2.VI]]。在计算机科学中，语义的含义是相同的，但这里能指与其所指意义的关系需要被机器理解和处理。\n\
  \n实现这一点的最常见方法是使用本体论，它是“对[共享]概念的显式规范化” [[6]]，并且可以被想象成一个正式定义的信息模型。这与 Tim Berners-Lee\
  \ 在 2001 年提出的语义网 [[13]] 理念相一致，该理念建议互联网从文档网向机器可读和可理解的数据网演进。语义网的基石是资源描述格式¹]]，它是“跨大型垂直应用进行数据交换和服务创建”的关键，这也是\
  \ IoT 演的的步骤 [[15]]。\n\n实现语义互操作性的挑战在于找到一种提供这种对事物的明确、共享意义的方法，即弥合两个（或多个）平台之间的语义鸿沟。图\
  \ 3.4。\n\n### 4. 处理 IoT 互操作性的 IoT-EPI 项目\n\n#### 4.1. IoT-EPI 平台 - 架构映射\n\nIoT 平台的采用受到经济等因素的驱动，例如增加云服务以及合作伙伴系统的开发。在这种背景下，设备制造商通过\
  \ IoT SDK 提供内置解决方案和模型，以提供易用性，允许使用多个门户和应用程序。随着 IoT 套件内部的整合以及服务提供者的各种产品，与服务提供者的关系变得日益重要。\n\
  \n设备发现领域的标准化工作正在加速，以支持异构设备通信和互操作的能力。标准是实现互操作性的关键，能够降低成本并刺激增长。然而，标准的流程非常复杂，演进和采用需要很长时间，且成熟稳定的标准占据主地位仍需时间，因此供应商和买家不得不在多个标准上进行过度投资。\n\
  \n在这个复杂的环境中，IoT-EPI 项目正在开发互操作解决方案，解决 IoT 架构中的不同层问题，并为不同 IoT 平台之间的互操作提供机制。\n\n在接下来的段落中，我们简要讨论\
  \ IoT 架构层与 IoT-EPI 项目提供的活动及解决方案之间的映射。\n\n**AGILE** 为 IoT 构建了模块化的硬件和软件网关，专注于物理、网络通信、处理、存储和应用层。AGILE\
  \ 软件模块解决了设备管理、通信网络（如区域网络和传感器网络）以及分布式存储解决方案等功能。该项目考虑了提供健壮安全管理解决方案所需的所有模块。\n\n**bIoTope**\
  \ 为开放标准的使用和用例实现提供了架构和建议，使利益相关者能够轻松创建新的 IoT 系统和服务，并利用用于互联智能对象的先进系统之系统（SoS）能力快速利用可用信息。bIoTope\
  \ 还开发并提供了标准化的开放 API 以实现互操作性。该项目涵盖了 IoT 架构的所有八个层，并在跨域环境中验证了互操作解决方案。\n\n\n\n\n\n`BIG\
  \ IoT` 开发了一个用于已实现的 IoT 平台的通用、统一 Web API。作为该项目的一部分，8 个合作伙伴 IoT 平台正在集成到该生态系统中，另有若干平台正通过社区建设过程加入。该项目关注\
  \ IoT 架构的上层层，通过解决安全管理、APIs、服务集成、外部系统服务、应用程序以及企业业务问题。\n\n`INTER-IoT` 项目解决一个开放的跨层框架、相关方法和工具，通过关注\
  \ IoT 架构的六层（模块涵盖了 QoS 和设备管理、服务集成、外部系统服务、存储和虚拟化），以实现异构 IoT 平台之间的自愿互操作性。该项目涵盖了所有网络通信层和全套安全管理套件。\n\
  \n`symbIoTe` 为各种 IoT 平台以及传感/执行资源提供了一个统一视图的抽象层。应用程序可以使用实现语义 IoT 引擎的 `symbIoTe Core\
  \ Services` 来寻找由 `symbIoTe` 平台提供的适当资源，并直接访问平台的虚拟资源进行数据采集和执行。该项目关注从物理层到应用层的 IoT 架构七层结构，并提出了一套完整的安全管理套件。\n\
  \n`TagItSmart!` 提供了一系列工具和赋能技术，可以通过提供的 API 集成到不同的 IoT 平台，使整个价值链的用户能够充分利用依赖条件的功能代码的力量，将多个应用领域的消费市场产品与数字世界连接。\n\
  \n`VICINITY` 专注于一个为 IoT 基础设施提供“即服务互操作性”的平台和生态系统，并解决 IoT 架构的上五层。工作考虑了服务集成、业务逻辑、虚拟化、存储、API、工具、外部系统服务、应用程序、数据分析和云服务。\n\
  \n## 4.2 AGILE\n\n`AGILE` 项目旨在解决硬件和软件层面的技术和语法互操作性。在硬件方面，项目设计了硬件组件，扩展了现有 IoT 网关平台的先进水平，具有双重目标：通过扩展最常用且低成本的\
  \ `Raspberry Pi` 平台的能力开发所谓的“创作者网关”（Maker’s Gateway）；以及开发用于工业目的的模块化硬件网关设计。对于创作者网关，项目向开源硬件社区贡献了一个遵循\
  \ `Raspberry HAT` 规范的扩展板，通过两个额外的无线模块插座扩展了平台功能，并带有包括 GPS 在内的多个传感器，以及进一步的有线传感器连接选项。该项目还提供了代码，帮助开发者在名为\
  \ `Node-Red` 的基于 Web 的可视化应用程序开发环境中可视化并最终使用这些功能。这些工具的易用性使得没有软件/硬件知识的人能够在快速原型环境中组装其所需的解决方案，该环境也用于测试以及大产前的准备。\n\
  \n在软件方面，`AGILE` 项目的目标是通过 `Eclipse Foundation` 向 IoT 软件开发者/创作者社区发布开源代码，帮助他们根据设备将所属的平台环境轻松地配置设备或网关。代码在设计时考虑了网关平台的互操作性，最大限度地减少了依赖，因此不仅支持项目内部开发的两个网关硬件平台变体，还支持市场上的其他其他平台。为此，使用了\
  \ `Docker` 容器化（`https://www.docker.com/`）来将软件组件彼此以及与底层硬件/操作系统隔离开。事实上，`Docker` 是软件容器领先的容器化技术，包含软件二进制执行文件、运行时和所有相关依赖的包。\n\
  \n为了进一步促进硬件支持，项目还贡献了基于 `Linux` `Yocto` 的 `ResinOS` 操作系统的开发，该系统专门针对基于 `docker` 的多容器部署进行了优化，可适用于大量的\
  \ IoT 网关平台。\n\n因此，通过创建一个可以在用户和开发者之间共享的 IoT 应用生态系统，利用现有的如 `Docker` 容器生态系统更容易促进平台的互操作性。用户能够通过\
  \ `Docker` 应用市场安全地发现、安装/管理和共享为互操作性目的而开发的组件。\n\n`Figure 4.1` 详细展示了 `AGILE Architecture`\
  \ 的样貌，以及在容器平台中作为可执行镜像运行的各种模块，使其能够解决互操作性问题。为此值得强调的是 IoT 设备和硬件模块发现、IoT 设备通信（硬件互操作性），以及\
  \ `Device Management UI` 和 `IoT Data Management UI`（软件互操作性），它们涵盖了语法互操作性的所有方面。\n\n\
  ![Figure 4.1. AGILE Detailed Architecture](img/fig4_1.jpg)\n\n**图 4.1.** AGILE 详细架构\n\
  \n图片的顶部显示了 `AGILE` 如何通过允许用户利用外部平台进行数据管理（例如 `Dropbox` 和 `Google-Drive`）、IoT 设备的 API（如可穿戴设备\
  \ API、家庭自动化 API 等）以及应用程序的可扩展部署（例如支持 `CloudFoundry` PaaS 和集成 `FIWARE` 赋能器、`Microsoft\
  \ Azure` 等）来实现现有 IoT 平台的水平互操作。`AGILE` 通过为其基于 `Node-Red` 的可视化应用程序组合环境提供特定的 IoT 平台模块，在软件层面解决了这些挑战。结合\
  \ `Figure 3.2` 的分类，这种方法类似于“跨平台访问”模式，不同在于 `AGILE` 以 `Node-Red` 模块的形式支持，可以组合同时使用 `AGILE`\
  \ 以及其他几个平台功能的应用程序。\n\n该项目没有解决任何语义互操作性的方法。\n\n## 4.3 BIG IoT\n\n`BIG IoT` 项目的目标是通过利用`智能物体平台`的能力，通过开放的\
  \ `BIG IoT API` 和 `BIG IoT Marketplace` 建立`语法`和`语义互操作性`，消除物联网服务和应用提供者的技术入门障碍，实现跨标准、跨平台和跨领域的\
  \ IoT 服务和应用程序。因此，该项目正在定义一个物联网生态系统的综合架构，包括完善的安全设计和服务组合方法，同时提供了维持生态系统的业务模式。\n\n###\
  \ 4.3.1 The BIG IoT Architecture\n\n\n\n\n\n本小节基于 \\[10\\] 和 \\[17\\] 发表的材料。下面概述了\
  \ BIG IoT 项目的架构方法以及相关的互操作性方面。图 4.2 展示了用于 IoT 生态系统的 BIG IoT 架构概览。该架构专门设计用于支持上述描述的所有互操作性模式（第\
  \ 4.1.1 节）。该架构围绕一组通接口展开，并称为 BIG IoT API，这些接口由提供者、消费者以及进行资源交易的市场共同支持。这些接口包括以下基本交互：\n\
  \n![Figure 4.2. BIG IoT 架构概览 A [10] 和 B [17].](images/fig4_2.jpg)\n\n**图 4.2.**\
  \ BIG IoT 架构概览 A [10] 和 B [17]。\n\n*   • M1: 提供者和消费者的身份验证与授权\n*   • M2: 服务的注册（通过提供者）\n\
  *   • M3: 服务的查询（通过消费者）\n*   • M4: 服务访问的计费\n*   • A1: 消费者请求的服务访问\n\n这些接口是实现互操作性并落实模式\
  \ I – V（第 4.1.1 节）的基础。据此，实现模式 II、III 和 V 的关键挑战，例如：\n\n*   • 服务的提供者和消费者来自不同的应用领域（II）；\n\
  *   • IoT 服务托管在不同的 IoT 平台上的，例如位于不同的地区（III）；\n*   • IoT 服务位于在不同的提供者系统上，例如 IoT 平台或某服务（V）。\n\
  \n此图中同样重要的概念是 BIG IoT 消费者库和提供者库（Consumer and Provider Libs）。例如，提供者库（Provider Lib）实现了\
  \ `Register` 接口（M2），用于将服务描述上传到市场，并提供 `Access` 接口（A1）向消费者提供信息。这些库的用处在于支持平台、服务和应用程序的开发者在市场上推广他们的服务，或使用市场来发现和访问这些服务。他们只需要实现一次\
  \ `Provider (P1)` 或 `Consumer (P2)` 接口，并可以在底层消息格式和交互细节发生变化时轻松更新库以进一步保持兼容。对于通过 `Register`\
  \ 接口（M2）进行的注册过程，使用了一种称为服务描述（Offering Description）的语义描述，并依赖资源描述框架（RDF）。\n\n### 4.3.2.\
  \ IoT 平台互操作方法\n\nBIG IoT 架构的核心目标是通过 BIG IoT 生态系统促进 IoT 平台的集成。基础设施平台和设备级平台都是目标对象。从架构角度来看，特别是考虑到\
  \ BIG IoT API 的实现以及与市场的集成，我们识别出以下类型的 IoT 平台：\n\n> **类型 1：服务器基础设施或云端 IoT 平台**，假设为“始终在线”，且应用程序或服务可以通过互联网随时访问。\n\
  \n> **类型 2：设备级 IoT 平台，托管在对通信、计算和内存资源方面无限制⁴的设备上**，假设为“始终在线”，其中连接和通信资源假设是按“固定费用”计划计费的。\n\
  \n> **类型 3：设备级 IoT 平台，托管在对通信、计算和内存资源方面无限制，但“并非始终在线”的设备上**。\n\n> **类型 4：设备级 IoT 平台，托管在对通信、计算和内存资源方面无限制的设备上，但通过“按需付费”计划连接到互联网**，类型\
  \ 4 设备也是类型 3。\n\n> **类型 5：设备级 IoT 平台，托管在对通信、计算和内存资源方面受限⁵的设备上**。\n\n在 BIG IoT 项目，合作伙伴集成了\
  \ 8 个平台。首先是云端或基础设施级平台：Bosch 的 Smart City6 平台（类型 1，模式 2），CSI 的 Smart Data7 平台（类型\
  \ 1，模式 3），OpenIoT8 平台（类型 1，模式 2），VMZ 的 TIC9 平台（模式 2），Siemens APM 平台，以及 WorldSensing10\
  \ 平台（模式 2）。此外还有设备级平台：Bosch 的 BEZIRK11 平台（类型 2、3）以及 Econais 的 Wby12 平台（类型 4，模式 2）。这些启用\
  \ BIG IoT 的平台通过 BIG IoT API 集成，目前在三个试点站点推出：巴塞罗那、沃尔斯堡和皮埃蒙。我们的用例分为：智能停车、智能交通管理、公共交通优化、智能自行车共享、基于激励的绿色路线规划、多模式路线优化器、智能充电、设备间通信。我们在\
  \ NG 使用 Bosch Smart City 平台、VMZ 的 TIC 平台、Siemens APM；在 BCN 集成了 Smart Data。\n\n###\
  \ 4.3.3. 互操作性方面\n\n解决与这些模式相关的互操作问题需要使用通用信息模型，例如通过语义网提供的模型。这些通用信息模型需要允许对服务的描述，以便消费者（例如服务或应用程序）可以使用它们，即使它们来自不同的领域或系统。BIG\
  \ IoT 核心模型定义了创建服务描述所需的内核词汇。服务描述依赖于 W3C 物联网（WoT）小组的工作，特别是物描述（TD）格式，并将被映射到 W3C SSN/SOSA。语义通过领域无关和领域相关的模型进一步增强。领域相关模型用于语义标注服务描述的元数据、服务类别以及输入输出数据。BIG\
  \ IoT 语义应用领域模型使用 BIG IoT 语义核心模型、领域无关和或领域模型创建。该模型建立了核心模型与领域模型之间的关系。除了服务分类和数据建模，领域模型还定义了语义标注服务相关特征的词汇。例如，`mobility:ParkingSpace`\
  \ 类可以用于标注停车位及其特征，如 `parking space id` 或 `parking space location`。\n\n对于服务描述的语义标注（例如定义输入、输出和服务类别的语义），需要一个定义良好的领域术语词汇。该词汇应该是广泛共享并达成共识的，以便所有\
  \ IoT 平台的提供者和消费者都能依赖它。我们选择了 schema.org 作为我们领域模型的基础，因为它为结构化数据提供了一种中立的、社区开发的词汇。\n\n\
  \n\n\n\n生态系统的核心支柱是市场（Marketplace）。在这里，`Provider`（例如 IoT 平台）通过上传提议描述（第 3.2 节）来注册其资源。为了方便提供者符合\
  \ BIG IoT API 以在生态系统中提供其资源，可以使用 `Provider Library (Lib)`。它可以被用于建立通往实际资源的网关，并实现 BIG\
  \ IoT API 以及各种交互和工作流（第 3.4 节）。该库负责向市场进行提供者的身份验证并注册其提议。它还提供了一个 Web API 来授予对资源的访问。\n\
  \n除了这些提供 IoT 平台访问的机制外，市场还通过资源消费货币化的可能性丰富了生态系统。因此，消费者和提供者双方都会向市场报告计费数据（例如获取/提供的资源记录数量）。这是收费和账单的基础，也是生态系统周边商业机会的基石。\n\
  \n上述 IoT 生态系统与平台规模无关。也就是说，IoT 平台既可以在云端（例如服务器、数据中心）运行，可以在雾端（例如网关、蜂窝通信基站），也可以在设备端（例如树莓派、智能手机）运行。在最后一种情况下，IoT\
  \ 平台可以代表一个 IoT “物”。BIG IoT API 可以独立于此类平台规模而使用。\n\n### 4.3.4. 该方法的唯一性与特定特性\n\nBIG\
  \ IoT 方案包含以下目标：首先，它开放定义了所谓的 BIG IoT API，这是一种通用的、基于 Web 的应用程序接口（API），供智能对象平台采用。\n\
  \n其次，BIG IoT 生态系统的核心是一个开放市场。一旦 BIG IoT API 为语法和语义上可互操作的 IoT 及跨平台连接提供了构建块，并实现了这种交换，市场就为平台和服务供应构成的生态系统奠定了基础。市场实现了基于\
  \ BIG IoT API 开发的应用程序和服务的广告、质量控制和货币化。可以为特定领域建立市场，例如由利益相关者为工业或能源领域建立，或者由智慧城市为交通或建筑领域建立市场。\n\
  \n第三，BIG IoT 通过提供专门的软件基础设施支持应用程序和服务的开发。此外，它提供了发现和编排服务的功能。该功能基于语义服务描述，并将通过语义推理器启用自动的服务链。这些功能促进了现有服务的重用。\n\
  \n第四，BIG IoT 项目与当前的标准化倡接对接以获取建议，并且此，我们将利用项目中阐述的结果对这些标准化活动做出贡献。\n\n最后，与 BIG IoT API\
  \ 和市场相关的核心技术将在 Eclipse 下作为开源软件发布。BIG IoT 提案已通过，Eclipse Bridge.IoT 项目已创建 ([`projects.eclipse.org/proposals/eclipse-bridge.iot`](https://projects.eclipse.org/proposals/eclipse-bridge.iot))。\n\
  \n用于语义互操作的方法：任意信息模型和领域特定模型。\n\n### 4.4. bIoTope\n\n`bIoTope` 的主要目标是让公司能够轻松创建新的 IoT\
  \ 系统，并快速利用可用的系统系统（SoS）能力。这种 SoS 方法意味着 `Figure 3.2` (07_Chapter03.xhtml#fig3_2) 中的所有五种互操作模式都已实现。`bIoTope`\
  \ 采用的方法与其他大多数架构之处在于，它在物理尺寸或计算能力方面没有采用分层架构。通过这种 SoS 方法，`Figure 3.2` (07_Chapter03.xhtml#fig3_2)\
  \ 中的模式 I-III 是默认实现的基础要求。任何实现了必要的 IoT 标准的系统都可以与任何其他系统直接通信，如 `Figure 4.3` (08_Chapter04.xhtml#fig4_3)\
  \ 所示。这种能力实现了 `Figure 3.2` (07_Chapter03.xhtml#fig3_2) 中的模式 `IV) 平台规模独立`。\n\n不原生支持\
  \ IoT 标准的系统可以通过我们在 `bIoTope` 中所谓的 `Wrappers`（封装器）加入，即暴露应公开的服务的软件组件（这对应于 `Figure\
  \ 3.2` (07_Chapter03.xhtml#fig3_2) 中的模式 `V) 高级服务面部`）。这同样标志着确保数据和服务对未经授权的方不可访问。\n\
  \n```\nFigure 4.3. bIoTope 系统系统类型连接（非分层）连接性。\n```\n\n在 `bIoTope` 中，“IoT 标准”指的是围绕标准格局“腰部”的一组有限的适当标准，如\
  \ `Figure 4.4` (08_Chapter04.xhtml#fig4_4) 所示。如果预计 IoT 将成为一个类似于万维网（WWW）的成功案例，它将需要一个类似的基础，即一组简单、定义良好、通用且强大的标准。WWW\
  \ 以 `HTTP` 和 `HTML` 作为初始核心标准开始。随着时间的推移，其他标准引入了补充功能，增强了 WWW 应用的能力，但基础模块仍然相同。\n\n\
  ```\nFigure 4.4. bIoTope 标准格局图。\n```\n\n`bIoTope` 中使用的核心标准用粗体显示。其他标准取决于不同应用的领域和需求。当使用核心\
  \ IoT 标准之外的标准（或私有协议和格式）时，`bIoTope` 使用 `Wrapper`（即 `Service Facade`）使其符合核心 IoT 标准。\n\
  \n`bIoTope` 充分利用了 `The Open Group` 开发并正式发布的消息标准，特别是 `Open Messaging Interface (O-MI)`\
  \ 和 `Open Data Format (O-DF)` 标准。这些标准源于过去的欧盟 FP6-FP7 项目，在这些项目中，真实的工业应用需要对重型和个人车辆、家用设备等许多领域收集和管理产品实例级信息。基于这些真实应用的需求，并且由于没有发现任何无需大量修改或扩展即可满足这些要求的现有标准，合作伙伴联盟开始规范新的\
  \ IoT 互操作标准。`O-MI` 主要在 `Figure 2.1` (06_Chapter02.xhtml#fig2_1) 栈中提供技术互操作，提供了实现通用\
  \ IoT 系统所需的、`HTTP` 等协议未提供的必要。`O-MI` 可用于实现 RESTful IoT 信息系统，也可以使用 `HTTP` 以外的其他底层协议，如\
  \ `Figure 4.5` (08_Chapter04.xhtml#fig4_5) 所示。\n\n\n\n\n\nO-DF 为物联网中的对象提供了一种通用的内容描述模型，并可以使用更具体的词汇表进行扩展（例如，使用特定领域的本体词汇表）。O-DF\
  \ 目前使用 `XML` 作为底层语法，但它提供了一套用于标注物联网（以及其他）数据的最小化、通用语义。O-DF 可以被认为是连接图 4.5 中第 2 层（语法互操作性）和第\
  \ 3 层（语义互操作性）的桥梁，因为它提供了跨平台、领域和规模的方式引用外部分类法、本体和词汇表的能力。\n\n图 4.5 展示了一个 bIoTope 生态系统，在该系统中，不同的符合物联网标准的系统（无论是否通过封装器实现）能够感知彼此的存在，以及它们向彼此提供的不同数据和服务¹⁴z\
  \ 当一个新系统需要“加入”符合 bIoTope 标准的生态系统时（例如一辆进入新城市并需要发现可用服务的汽车），bIoTope 将提供发现机制来发现相关的 O-MI\
  \ 节点。某些节点将实现 bIoTope `loTBnB` API，这是一个符合物联网标准的服务的市场。\n\n![图 4.5. bIoTope 生态系统图。](img/fig4_5.jpg)\n\
  \n**图 4.5.** bIoTope 生态系统图。\n\n图 4.6 展示了不同的平台、系统和服务如何使用物联网标准发布所需的数据和和服务。开放数据格式 (O-DF)\
  \ 提供了使用现有或新词汇表（如 `schema.org`、`SSN`、`GML` 等）来标注“任何”物联网数据或服务的手段，如图 4.4 所示。通过链接数据原理，甚至可以在一个\
  \ O-DF 结构（包括专有词汇表）中使用多个不同的词汇表。\n\n![图 4.6. bIoTope 架构图。](img/fig4_6.jpg)\n\n**图\
  \ 4.6.** bIoTope 架构图。\n\nbIoTope 架构深受微服务架构 (MSA) 思想的影响，根据应用需求可以以最佳方式联合使用不同的“小型”标准。MSA\
  \ 是实现图 3.2 中模式 `V) “高级服务面面\"` 的通用方法。对 MSA 的支持是 O-MI 和 O-DF 的基本设计原则，这意味着“任何”大小的服务都可以发布和消费，无论它是对当前传感器值的简单请求，还是对汽车当前位置附近可用停车位的请求。\n\
  \n这种 MSA 方法在系统灵活性和精益软件原则方面具有多优势，因为新的符合物联网标准的服务可以由较小的现有服务组合而成。在当前竞争激烈的物联网标准化格局中，它还提供了风险管理优势，因为不同的符合标准的软件组件和封装器可以调整以支持新的或“胜出”的标准，而不影响整个系统架构。\n\
  \n虽然 bIoTope 架构应被理解为高度灵活且能够集成任意平台，但它在图 4.6 中呈现。这种方法是 O-MI 和 O-DF 的基本设计原则，这意味着“任何”大小的服务都可以发布和消费，无论它是对当前传感器值的简单请求，还是对汽车当前位置附近可用停车位的请求。\n\
  \n\n\n\n\n这种面向层的解决方案通过 `INTER-LAYER` 实现，它是几种针对特定层的互操作性解决方案。每个互操作性基础设施层都与相邻层有强耦合，并提供接口。接口将由一个元级框架控制，以提供全局互操作性。每种互操作性机制都可以通过\
  \ `API` 访问。互操作性基础设施层可以通过接口进行通信和互操作。这种跨层设计实现了更深层次、更完整的集成。\n\n### 4.5.3. 层次与互操作性方面面\n\
  \n**设备层 (D2D)**：在设备层面，D2D 解决方案将允许新型物联网设备的无缝接入，并使其能够与已有的设备进行互操作。D2D 解决方案是一个模块化网关，支持广泛的协议以及原始转发。它由两部分组成：仅处理网络访问和通信协议的物理部分，以及处理所有其他网关操作和服务的虚拟部分（`gw\
  \ virtualization`）。当连接丢失时，虚拟部分仍保持功能，并能够响应 `API` 和 `Middleware`（中间件）请求。网关采用模块化方法，允许添加可选的服务块以适应特定场景，从而实现智能对象生态系统的快速增长。\n\
  \n**网络层 (N2N)**：N2N 解决方案实现了无缝的网络到网络互操作，允许透明的智能对象移动和信息路由支持。它还允许卸载和漫游，这意味着通过网络实现了网关和平台之间的互连。互操作性通过使用\
  \ `SDN` 和 `NFV` 范式创建虚拟网络来实现，并由 `N2N API` 提供支持。N2N 解决方案将允许全互联生态系统的设计与实现，并解决智能对象的移动问题。\n\
  \n**中间件层 (MW2MW)**：在中间件层面，`INTER-IoT` 解决方案将为异构物联网平台中的物联网设备提供无缝的资源发现和管理系统。中间件层的互操作性通过建立抽象层并将物联网平台挂载其上来实现。该层包含的不同模块提供了用于管理对象虚拟表示的服务，通过创建抽象层来访问它们的所有功能和信息。这些服务可以通过通用的\
  \ `API` 访问。该层的互操作性将允许在大规模多平台物联网系统中对智能对象进行全局利用。\n\n**应用与服务层 (AS2AS)**：`INTER-IoT`\
  \ 将实现不同物联网平台之间异构服务的使用。我们的方法允许对不同平台的服务进行发现、目录化、使用甚至组合。AS2AS 还将提供一个 `API` 作为集成工具箱，促进开发集成现有异构物联网服务的新应用程序。\n\
  \n**语义与数据层 (DS2DS)**：`INTER-IoT` 保证了不同物联网平台以及异构数据源之间数据和信息的共同解释，这些数据源通常采用不同的数据格式和本体论，且无法直接相互共享信息。`INTER-IoT\
  \ DS2DS` 方法是第一个在异构物联网平台之间提供`通用语义和句法互操作性`的解决方案。它基于一种新方法，即将物联网平台的本体论向 `INTER-IoT`\
  \ 采用的通用 `Central Ontology`（中心本体）进行或进行语义翻译，而不是直接进行平台间的翻译。这种技术极大减少了实现通用语义互操作所需的潜在语义翻译组合数量。`INTER-IoT`\
  \ 语义互操作性工具适用于任何词汇表或本体论。`INTER-IoT` 拥有的模块化 `Central Ontology`（称为 `GOIoTP`）适用于所有物联网平台、设备和服务，并可在\
  \ `http://docs.inter-iot.eu/ontology` 获取。此外，句法翻译器允许不同数据格式（如 `JSON`、`XML` 等）之间的互操作性。尽管\
  \ `INTER-IoT` 的试点部署实现了基于`带扩展的核心信息模型`的语义互操作性方法，但 `INTER-IoT` 支持在其试点方法与 `Core Information\
  \ Model` 之间的任何解决方案。\n\n**跨层**：`INTER-IoT` 还保证了所有层中必须具备的非功能方面：信任、安全、隐私和服务质量 (`QoS`)。此外，`INTER-IoT`\
  \ 为每一层提供了虚拟化解决方案，以实现快速部署。安全性在每一层内部得到保证，并通过加密通信和安全令牌实现外部 `API` 访问。`INTER-IoT` 实现了数据隐私法，并在医疗健康等特定案例中，符合医疗设备法规。\n\
  \n关于第 3.1 节](#03_1) 描述描述的架构模式，`INTER-IoT` 支持以下六种互操作性模式：\n\n*   跨平台访问：通过 `AS2AS`\
  \ 服务实现。\n*   跨域访问：由于 `INTER-IoT` 是领域无关的，通过 `DS2DS` 解决方案实现。\n*   平台独立性：通过 `DS2DS`\
  \ 的语义和句法翻译实现。\n*   平台规模独立性：通过 `INTER-IoT AS2AS` 实现。\n*   高级服务界面：通过 `INTER-IoT AS2AS`\
  \ 实现。\n*   平台间交互：这是 `INTER-IoT` 的设计目标，通过 `D2D` 或 `MW2MW` 实现。\n\n上述模式均为架构性的。`INTER-IoT`\
  \ 从不同的视角识别了互操作性的主要模式：从语义视角（关于语义互操作）和中间件互操作视角（涉及句法和功能性互操作）。`INTER-IoT` 拥有相应的宏模式和微模式。\n\
  \n最后，对于三种主要的互操作类型（功能性、句法、语义），`INTER-IoT` 实现了所有类型。通过 `INTER-IoT DS2DS` 解决方案，可以在具有不同数据格式和本体论的平台之间实现通用的句法和语义互操作。此外，其他\
  \ `INTER-IoT` 层（`D2D` 和 `N2N`）可以提供智能元素之间的功能性互操作，实现网络连接。\n\n## 4.6. symbIoTe\n\n\
  `symbIoTe (跨物联网环境智能对象的共生)` 的主要目标是设计一种灵活且安全的跨物联网平台互操作中间件，促进跨平台的物联网应用开发、平台协作以及动态适应空间。这通过以下方式实现：1)\
  \ 用于平台提供者注册的连接（虚拟化）智能对象（即物联网资源）的语义物联网搜索引擎；2) 用于跨平台统一使用这些资源的抽象层；3) 用于快速跨平台应用开发的高级领域特定\
  \ API（赋能器）；以及 4) 物联网平台联盟，即两个平台之间的关联，促进其安全交互、协作和资源交换；5) 为同区域设备和网关提供互操作的动态自配置智能空间；以及\
  \ 6) 物联网平台、网关和智能设备之间的安全互操作协议。这支持中小企业和物联网市场的新进入者在短开发周期内构建创新的物联网服务。\n\n![图 4.10. symbIoTe\
  \ 高层架构](img/fig4_10.jpg)\n\n\n\n\n\n### 图 4.10. symbIoTe 高层架构\n\n### symbIoTe 架构\n\
  \nsymbIoTe 架构围绕分层 IoT 栈构建，用于连接智能空间内的各种设备（传感器、执行器和 IoT 网关）与云端。智能空间共享可用的本地资源（连接性、计算和存储），而运行在云端的平台服务实现了\
  \ IoT 平台联邦，并通过灵活的访问控制向第三方开放互操作 API[#08_Chapter04.xhtml#fn4_18]。该架构包含四个层级领域，如图图 4.10](#08_Chapter04.xhtml#fig4_10)\
  \ 所示。\n\n1) **应用领域 (Application Domain)** 允许平台注册其想要发布并通过互操作 API 访问的 IoT 设备，同时 symbIoTe\
  \ 通过其核心服务（Core Services）提供了跨平台搜索 IoT 设备的手段。我们还构建了特定领域的后端服务（增强器 Enablers），这些服务利用底层平台提供的基础设施来提供增值服务，例如对从不同平台获取的传感器数据进行数据分析。增强器简化了跨平台和特定领域的应用程序开发（特别是特别是移动和\
  \ Web IoT 应用程序）。\n\n2) **云领域 (Cloud Domain)** 提供了一了一种统一且受属性控制的访问[#10_References.xhtml#ref_25]，用于平台通过开放\
  \ API（互操作 API）向第三方暴露的虚拟 IoT 设备。此外，它为 IoT 平台联邦构建了服务，根据特定平台的业务目标和定义的服务水平协议（SLAs），实现紧密的平台协作和资源交换。\n\
  \n3) **智能空间领域 (Smart Space Domain)** 为本地空间内协作 IoT 设备和网关的发现与互操作提供服务，而**智能设备领域 (Smart\
  \ Device Domain)** 则涉及智能设备的漫游能力，使其在不同空间移动时保持身份。\n\n### IoT 平台互操作方法\n\nsymbIoTe 允许灵活的\
  \ IoT 平台互操作机制（平台联邦内的平台间直接交互、智能空间内的平台间交互），这是通过在引入的架构领域中增量部署 symbIoTe 功能实现的，使得平台提供商可以选择合适的互操作解决方案，并仅将选定的功能集成到其平台中。这实际上影响了平台与支持\
  \ symbIoTe 的生态系统中其他平台的互操作水平和协作程度。目前构想的解决方案对现有 IoT 平台的影响很小，因为它主要只需要开发一个小的互操作模块。此外，symbIoTe\
  \ 增加的安全层为异构 IoT 平台联邦中的资源受控访问提供了一种分布式且有效的机制。\n\n![图 4.11 symbIoTe 合规级](img/fig4_11.jpg)\n\
  \n**图 4.11** symbIoTe 合规级\n\n## 互操作方面\n\nsymbIoTe 方法定义了四个互操作级别，如图 4.11](#08_Chapter04.xhtml#fig4_11)\
  \ 所示。当我们从想要实现互操作的 IoT 平台的角度考虑时，我们也称为合规级。在所有四个级别中，互操作都是通过提供一种统一且安全的方式来发布、发现和消费 IoT\
  \ 资源来实现的，但每个级别**1 级**允许 IoT 应用与虚拟 IoT 资源（包括传感器和执行器）之间的交互，即应用程序可以通过统一接口跨平台发现并使用资源。此外，平台可以集成\
  \ symbIoTe 组件以实现灵活的基于属性的访问控制。**2 级** 允许 IoT 平台通过形成联邦进行紧密协作。联邦可以被视为核心服务的封闭和分布式版本，即平台只能向联邦成员发布和交换资源。**3\
  \ 级** 实现了动态智能空间：在网关级别采纳新资源，并在协作的智能空间内实现支持 symbIoTe 的 IoT 设备（例如移动设备和 Arduino 板板）之间的直接交互，即使它们连接到不同的网关并由不同的\
  \ IoT 平台管理。这实现了协作和邻近 IoT 网关之间的资源迁移，以防止供应商锁定。**4 级** 为 IoT 设备的漫游提供支持，这些设备在移动时可以保持其唯一身份，并且无论当前位置如何，始终可以通过核心服务找到。第\
  \ 1 级可以直接映射到 IERC《互操作白皮书》中定义的语义和句法互操作[#10_References.xhtml#ref_26]。第 2 级、3 级和 4\
  \ 级涉及组织级互操作。symbIoTe 在此提出了一种具有更细粒度组织互操作的原始方法，通过将特定的互操作概念置于云端或智能空间来实现。\n\n### 该方法的独特特性与特定功能\n\
  \nsymbIoTe 的第一个独特特性是其语义互操作解决方案，它遵循第 3.1.2 节](#07_Chapter03.xhtml#sec3_1_2) 中介绍的带有扩展的核心信息模型方法。核心信息模型\
  \ (CIM) 是用于描述注册到 symbIoTe 的资源的中心信息模型，并在所有平台之间共享。它设计得尽可能抽象和极简，同时根据创建最小相互理解所需的尽可能具体。通过这种方式，CIM\
  \ 实现了所有平台之间有限的开箱即用互操作。为了在 symbIoTe 中实际注册资源，平台使用平台特定信息模型 (PIM)，它们是 CIM 的扩展，包含了特定平台的术语。由于每个\
  \ PIM 都是 CIM 的扩展，即使在使用不同 PIM 的平台之间，也能确保基本的互操作性。这种灵活性超越了目前的技术水平，预计将获得平台所有者（尤其是中小企业）的高度认可，因为将其平台信息模型适配到\
  \ symbIoTe 的过程被显著简化，同时它提供了使用其现有信息模型的手段。\n\n此外，symbIoTe 开发了一种策略，以便在运行不同 PIM 的平台之间实现更高层次的互操作。它是基于使用声明式映射的\
  \ SPARQL 查询重写和数据翻译，在不同 PIM 之间进行翻译。这一概念有望对 IoT 解决方案的语义互操作产生巨大影响，因为信息模型的标准化过程通常很漫长且复杂，而且限制了平台的灵活性。\n\
  \n第二个独特特性涉及核心服务提供的实现的 IoT 资源语义搜索引擎，它让 IoT 应用开发者为各种跨平台和跨领域的应用程序寻找合适的 IoT 资源。该搜索引擎使用并支持列出的\
  \ symbIoTe 信息模型。\n\n第三个独特之处涉及平台联邦内的平台间直接交互，以实现平台间更紧密的协作。在这里，symbIoTe 提供了新的功能来丰富平台交互：资源交换、信任和\
  \ SLA 管理，以及对跨联邦平台智能设备漫游的支持。\n\n\n\n\n\n第四个独特性涉及`security perspective`（安全视角）。symbIoTe\
  \ 在异构 IoT 平台联邦中实现了一种灵活、分布式且有效的机制，用于对资源（包括传感器和执行器）进行受控访问。设计的方法论根于强大的`基于属性的访问控制`（Attribute-Based\
  \ Access Control）机制。特定的访问策略被定义为属性的组合（即用户的属性、角色、详情），并分配给每个资源，而对该资源的访问仅授予拥有与上述策略匹配的属性集的用户。\n\
  \n上述特征使得 symbIoTe 能够支持第 3.1.1 节所示的所有六种互操作模式。\n\nsymbIoTe 支持第 3.1.1 节所示的所有六种互操作模式，并且这些模式可以映射到上述特征。模式\
  \ I、II 和 III 通过提供的 `Core` 服务（例如资源搜索）、`Interworking API`、对 `PIMs` 的支持以及语义映射来实现。模式\
  \ IV（`Platform-Scale Independence`，平台规模独立）适用于 symbIoTe 的四个互操作/合规级别；模式 V（`Higher-Level\
  \ Service Facade`，高层服务脸面）匹配 `Enablers`（赋能器）的概念；模式 VI（`Platform-to-Platform Direct\
  \ Interactions`，平台间直接交互）符合 symbIoTe 中定义的联邦概念。\n\nsymbIoTe 遵循`agile-like`（类敏捷）方法，在\
  \ [`github.com/symbiote-h2020`](https://github.com/symbiote-h2020) 实现一个开源的中间件原型。来自所有联盟合作伙伴的开发者共同利用微服务架构实现软件组件，以满足高度分布式\
  \ IoT 生态系统的增量功能部署和可扩展性需求。关于`licensing`（许可），联盟为 `Core Services` 选择了“左拷贝”许可证（`LGPL-3.0`），以便将更新、错误修复和新功能始终反馈给`Open\
  \ Source Community`。对于位于平台侧的中间件组件，许可遵循“非左拷贝”方法（选择了 `BSD 3-Clause`）。\n\n## 4.7 TagItSmart\n\
  \nTagItSmart 架构组件的综合视图见图 4.12。TagItSmart 被设计为一组松耦合的组件，可以集成到不同的环境（IoT 平台）中并跨环境运行。为此，提供特定\
  \ TagItSmart 功能（如智能标签编码、解码等）的组件带有自己的 `APIs`，而更通用的 IoT 功能则复用所使用的底层 IoT 平台。这种方法使得在不同设置下使用\
  \ TagItSmart 功能更加直接，并降低了开发者的学习曲线。\n\n![Figure 4.12. TagItSmart Platform Functional\
  \ Architecture](img/fig4_12.jpg)\n\n**图 12.** TagItSmart 平台功能架构\n\n从功能角度来看，`User/Developer\
  \ level`（用户/开发者层）提供了访问不同 TagItSmart 组件的前端功能。此外，在此级别，`TagItSmart SDK` 支持将智能标签解码功能集成到第三方（智能手机）应用程序中。\n\
  \n在`Service level`（服务层），我们可以找到以下功能块：\n\n*   `Security`（安全）组件处理身份验证、授权和对其他组件的访问控制等方面。安全性在多个层面解决：通过在加密标签中嵌入包含的策略，使用`密文策略属性访问控制加密`（`CP-ABE`）确保智能标签的安全性，以执行与不同用户相关的访问控制策略；网络平台和\
  \ `APIs` 的安全性通过基于凭据的身份管理和身份机制机制确保；而信任性和数据完整性则取决于分布式账本技术。\n\n*   `Service Execution`（服务执行）组件包括能够执行平台中注册服务的组件，以及用于触发动态创建工作流的服务模板。整个过程允许平台用户发布服务请求，然后由平台进行处理，将其解析为需要“粘合在一起”的子服务，以支持整个服务请求，然后进行执行。为了实现这一过程，首先利用了一系列仓库来暴露平台中可用的服务，以便能够被恰当地发现、配置、触发和重用。此外，还涉及一个拦截服务请求并能够将其分解为所需服务的组件（`Service\
  \ Manager`，服务管理器）。服务模板引导这一识别服务请求在子服务和用户信息方面需要什么的过程。后者既是为了确保只有授权用户才能访问平台并发布服务请求以及通过平台获得服务（例如，`FC-scanner`\
  \ 用户能够使用托管在 TagItSmart 平台中的解码或流处理组件），也是为了根据所有权、位置和其他可用性标准识别服务请求执行过程中涉及的适当资源。最终，服务的运行时执行由\
  \ `Workflow Enforcer`（工作流执行器）承担，它充当组件之间的“中间人”，在组件传递信息并处理错误。\n\n*   `Data Processing`（数据处理）组件提供了处理和操作平台生成数据的额外功能。\n\
  \n*   `SmartTags`（智能标签）组件有助于智能标签的集成和创建。\n\n*   `Data Access`（数据访问）组件提供了 TagItSmart\
  \ 运行的相应注册表、语义模型和仓库。\n\n**表 4.1** 集成策略![](img/tab4_1.jpg)\n\n在`Virtual Entity`（虚拟实体）层，平台对象的实际表示根据语义模型提供对其数据的访问和定义的操作。\n\
  \n以上述架构为起点，此处描述了如何在实践中实现 TagItSmart 功能：\n\n`Full Implementation of an IoT Platform\
  \ with TagItSmart`（带 TagItSmart 的 IoT 平台全实现）：该场景从零开始 TagItSmart 架构中定义的所有组件，功能集成在相同的代码库中。支持平台的基础由实现者提供。\n\
  \n`Hosted in a third party IoT platform`（托管在第三方 IoT 平台）：该场景将 TagItSmart 功能集成到已有的\
  \ IoT 平台中。组件实现可能需要一些调整以符合现有平台，但它们应遵循相应的 `API` 实现互操作。基础设施需求由第三方 IoT 平台供应商设置。\n\n\
  `Shared and hosted externally`（共享并在外部托管）：该场景将 TagItSmart 视为一组暴露开放 `API` 的独立服务，可以同时从多个平台访问。部署和基础设施需求与\
  \ IoT 平台独立处理。\n\n图 4.12 中定义的组件是满足从不同用例中提取的需求所需的组件集，同时实现了智能标签的创建和生命周期管理。根据所选的集成策略，某些组件在特定\
  \ IoT 平台上的实现和部署可能会不同。\n\n**表 4.2.** TagItSmart API 示例\n\n| **OPERATION** || **API**\
  \ || **DESCRIPTION** |\n\n| --- | --- | --- |\n\n\n\n\n| 方法 | 端点 | 描述 |\n| :---\
  \ | :--- | :--- |\n| SmartTag 激活 | `POST/product/set-smart-tag-date` | 此方法用于激活 SmartTag\
  \ 以使其能够在系统中使用。 |\n| SmartTag 扫描 | `POST/product/product-context` | 此方法用于 POST 产品扫描所在的位置，并返回该产品的所有相关上下文，包括评论和传感器状态。\
  \ |\n| SmartTag 回收 | `POST /recycl3r/api/v1/recycling_info` | 此方法用于获取有关产品回收的分类和位置信息。\
  \ |\n\n如上所述，`TagltSmart` 组件定义了一组通 API 方法，以保证互操作性和无缝集成，并能够在在其组件之上创建第三方应用程序（见表 4.1）。\n\
  \n## 4.8 VICINITY\n\nVICINITY 项目围绕通过 VICINITY 平台（即互操作性服务）连接不同的 IoT 生态系统的概念构建，这使得能够像操作自己的对象一样与来自不同生态系统的\
  \ IoT 对象进行交互。互操作性服务创建了一个环境，可以在其中部署增值服务，并使跨域信息可用。\n\n![图 4.13. VICINITY 概念](img/fig4_13.jpg)\n\
  \n**图 4.13.** VICINITY 概念\n\n![图 4.14. VICINITY 语义互操作性方法](img/fig4_14.jpg)\n\n**图\
  \ 4.14.** VICINITY 语义互操作性方法\n\n在所示图中展示了两个独立的生态系统：智能建筑和能源生态系统。这些生态系统中的每一个都通过其 `VICINITY\
  \ Adapter` 通过 `VICINITY Gateway` 集成到 VICINITY 中。根据 VICINITY 邻中虚拟社区的设置，`VICINITY\
  \ Adapters` 可以根据语义互操作性访问远程 IoT 对象（例如能源生态系统中的电池），并将其作为自身生态系统的一部分。此外，`VICINITY Adapter`\
  \ 在虚拟社区内共享的 IoT 对象可以被增值服务访问，以便使用通用的 VICINITY 本体提供跨域服务。\n\n![图 4.15. 用于发现的语义互操作性方法](img/fig4_15.jpg)\n\
  \n**图 4.15.** 用于发现的语义互操作性方法\n\n在 IoT 环境下实现互操作性的主要挑战之一，是让消费者在分布式和动态的场景中发现那些与其需求相关但对其没有任何预先知识的\
  \ IoT 对象。VICINITY 跨域互操作性依赖于：\n\n![图 4.16. 用于访问的语义互操作性方法](img/fig4_16.jpg)\n\n**图\
  \ 4.16.** 用于访问的语义互操作性方法\n\n*   `VICINITY ontology`¹⁹ 作为使用的通用且抽象的信息模型；\n*   语义代理平台作为语义仓库。W3C\
  \ 物联网物描述（`TD`）是用于描述集成到 VICINITY 中的任何 IoT 对象的框架；\n*   `Gateway Adapter APIs` 是实际消费者者（例如\
  \ `Adapters`）与仓库之间的语义中介。\n\nVICINITY 语义互操作性的第一个目标是安全地发现 IoT 对象。\nVICINITY 语义互操作性的第二个目标是实现对\
  \ IoT 对象的访问。\n\n# 5 推进 IoT 平台互操作性\n\nIoT-EPI 在提供互操作方面的努力已经提供了新的平台机制和方法。在这种背景下，已经发现了需要进一步调查的互操作性差距。\n\
  \n物联网（IoT）环境相当复杂，具有支持各种通信协议的异构物理设备，它们可能连接到中间网关，然后连接到它们的表示。因此，可以通过多种方式与 IoT 设备交互。\n\
  \nIoT 平台需要在多个层面的互操作性，这意味着需要找到每一层的特征功能并定义可以映射的元协议。虽然协议提供的功能基本相同（例如对由标识符标识的资源进行 `get/set/update/subscribe`），但资源发现功能必须跨协议解决。\n\
  \n需要对面向层的方法进行研究，以解决在 IoT 系统所有层（设备、网络、中间件、应用、数据和语义）提供更紧密互操作性的问题，并重点关注信任、隐私和安全方面。这种互操作性方法还提供了涵盖服务质量（QoS）和设备管理、服务集成、外部系统服务、存储和虚拟化的模块。\n\
  \n关于语义互操作性，目前的工作集中在给定领域定义并标准化通用词表（例如 `http://iot.schema.org`）。另一个有趣的方向是根据 WoT 方法对任何\
  \ IoT 对象进行领域无关的努力。然而，模型的标准化并不总是可行的方案。因此，研究还应关注即使使用不同的信息模型也能实现语义互操作性的技术。\n\n分层互操作方法允许利益相关者或平台运营商选择最佳互操作机制。此类选项提供了层层之间的协调，增强了协作解决方案（例如网关和网络）并实现了安全管理。\n\
  \n对于网关互操作性，基于软件定义网络（`SDN`）的可编程网络层网络函数虚拟化（`NFV`）对于合并 IoT 和 5G 以及遵循现有架构至关重要。使用可编程网络有两个优势：移动性管理和大规模\
  \ IoT 的 QoS 管理。\n\n\n\n通用物联网互操作性框架中最具前景的方面是找到资源访问、资源发现以及语义互操作的共同方法。\n\n需要进一步的研究来解决系统之系统视角下的互操作性问题，在这种视角下，所有设备、“物”和其他信息系统都应该能够在互联网协议（`TCP/IP`等）级别甚至在世界维网（`WWW`）级别（`HTTP`、`WebSockets`等）上进行互操作。这意味着低层协议（`Zigbee`、`LoRa`等）被抽象在了一了一组有限物联网标准的“封装器”和服务的之后。\n\
  \n所有物联网应用都需要应对物联网中互操作性的复杂本质和可持续性要求。为此，需要一个可持续的互操作性框架，该框架应特别针对物联网的特定特性和限制。\n\n一个可能的物联网可持续互操作性框架应该能够解决以下方面：\n\
  \n*   **物联网互操作性的可扩展性管理**：为了正确支持物联网的互操作性，必须高效、有效地管理互操作性资源。\n*   **物联网互操作性的测量能力**：为了妥善管理和执行物联网的互操作性，必须找到一种能够量化和/或定性互操作性本身的方法。\n\
  *   **物联网的动态互操作技术和方法论**：为了在复杂的物联网生态系统中实现持久的互操作，必须允许“物”进入并进行动态互操作，而无需进行大量的修改。\n\n\
  验证方面在通用互操作性中非常重要，对于物联网而言更是如此。测试和验证确保了互操作方法、协议等能够应对物联网的特定性质和要求。我们需要提供高效、准确的测试套件以及相关的互操作测试方法论，有助于彻底测试互连的“物”、机器和智能对象所使用的底层协议，以及嵌入式服务和应用程序。从这个角度来看，我们必须考虑，对于大多数现有测试方法来说，物联网中互连的“资源”是自然分布的。由于它们是分布式的，传统的、经典的处理所有这些组件和测试执行的单一中心化测试系统已不再适用。被测试组件的分布式特性要求向分布式测试方法发展。\n\
  \n物联网研究社区必须对用于评估物联网平台接入性能的数据集达成共，并对用于评估物联网平台处理性能的实时查询集达成共。测试/实验序列必须是显性的、透明且基于共识的，以确保公平无偏的基准测试过程。\n\
  \n互操作解决方案的实施旨在采用使用不同业务模型的开源方法。解决方案在项目结束后仍需要具有可持续性。进一步的研究应关注平台之间 API 同质化和联邦认证等关键方面。这应该允许灵活的跨域/跨平台业务流程的创建。\n\
  \n利用物联网（平台）技术处理自动化复杂系统是未来的一个关键挑战。在此背景下，复杂系统是指那些由丰富的感知能力（例如雷达、视觉）和先进执行（例如控制机器人手臂）大量组成的系统。这些复杂系统的自动化需要智能的传感器数据处理和推理，以有意义地控制执行。物联网平台技术通过作为复杂系统内部以及复杂系统之间的互操作接口，具有促进和增强系统创建潜力。物联网社区定义的传感器、执行器和“物”的描述格式、通信协议和\
  \ API 需要使用通用语言来实现这种智能处理和推理。\n\n物联网平台技术可以提供巨大开发推动的自动化复杂系统示例，范围从连接机器人和机器人生态系统到与物流链集成的自动化生产线，再到自动车辆（船舶、飞机、火车、卡车、汽车）和车队。\n\
  \n通过物联网平台技术，将组件和系统连接到更复杂的系统正变得可能。因此，此类复杂系统内部及之间的智能和自动化协作将是一个核心挑战。从现有组件池（通过存储库填充）自动创建物联网组件的组合将增加经济影响，因为在多个组合中重用组件将增加产生的收入。不再通过中心化方式控制组合，而是通过智能编排进行去中心化组织。\n\
  \n在未来，可能会动态创建复杂服务，例如当汽车到达一个新城市并需要该城市物联网生态系统的特定服务时。如何高效地实现这种基于上下文的服务组合是需要进一步研究的核心课题之一。\n\
  \n目前物联网背景下语义互操作的努力侧重于“通过标准实现的互操作”，试图定义供多个平台使用的标准词汇，从而建立语义互操作。然而，总会存在不希望或甚至无法标准化的场景。在这些情况下，需要其他语义互操作的方法来提供语义互操作。最突出且最有前景的是基于平台所使用的不同信息模型之间的语义映射的数据和查询翻译。然而，由于语义映射技术并非能够显著简化过程的简单工具，因此还需要改进。\n\
  \n跨所有平台的“物”的唯一身份仍然是一个未解决的问题。例如，汽车可以通过串口或车辆识别号码（`VIN`）、车牌号、保险号或其他标识符来识别。最合适的标识可能取决于使用上下文，因此此特性应该是任何物联网信息系统的要求。\n\
  \n尽管有多种方法为每个单独的“物”和每个项目分配身份，但对齐这些不同身份方法并允许其映射以便在不同环境中轻松使用同一个“物”的工作必须继续。\n\n对通用物联网互操作框架的研究工作需要继续，并需要对不同的互操作层及其协议进行详细、广泛的分析，并结合大量的科学研究以及标准化工作。\n\
  \n关于互操作性的路线图与物联网生态系统的创建相关联，主要围绕现有解决方案的开发者（即 `IoT-EPI`）。互操作解决方案的功能必须扩展，包括用于控制执行的自-*机制，特别是在未来的物联网自主系统中。\n\
