  \ `Yucca` 项目，该项目允许连接应用程序、社交网络、系统和分布式对象，并收集数据和信息，通过处理和分析开发端到端 |\n| `Smart City Platform`\
  \ | 商业, Bosch | 考虑到智慧城市的解决方案，其需求与传统企业应用有所不同。事实上，智慧城市设施由许多针对城市单独定制的解决方案组成，但在运行、数据共享和安全方面有共同需求。智慧城市平台\
  \ (SCP) 的目标是连接智慧城市中的孤岛，例如治理、交通、能源、环境、工业生活、旅游等。Bosch SCP 提供了开发、运行和维护此类系统的工具和方法，同时不会损害数据安全和隐私。\
