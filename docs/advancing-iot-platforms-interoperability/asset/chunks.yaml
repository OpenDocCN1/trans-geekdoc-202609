  trans: '


    `BIG IoT` 开发了一个用于已实现的 IoT 平台的通用、统一 Web API。作为该项目的一部分，8 个合作伙伴 IoT 平台正在集成到该生态系统中，另有若干平台正通过社区建设过程加入。该项目关注
    IoT 架构的上层层，通过解决安全管理、APIs、服务集成、外部系统服务、应用程序以及企业业务问题。


    `INTER-IoT` 项目解决一个开放的跨层框架、相关方法和工具，通过关注 IoT 架构的六层（模块涵盖了 QoS 和设备管理、服务集成、外部系统服务、存储和虚拟化），以实现异构
    IoT 平台之间的自愿互操作性。该项目涵盖了所有网络通信层和全套安全管理套件。


    `symbIoTe` 为各种 IoT 平台以及传感/执行资源提供了一个统一视图的抽象层。应用程序可以使用实现语义 IoT 引擎的 `symbIoTe Core
    Services` 来寻找由 `symbIoTe` 平台提供的适当资源，并直接访问平台的虚拟资源进行数据采集和执行。该项目关注从物理层到应用层的 IoT 架构七层结构，并提出了一套完整的安全管理套件。


    `TagItSmart!` 提供了一系列工具和赋能技术，可以通过提供的 API 集成到不同的 IoT 平台，使整个价值链的用户能够充分利用依赖条件的功能代码的力量，将多个应用领域的消费市场产品与数字世界连接。


    `VICINITY` 专注于一个为 IoT 基础设施提供“即服务互操作性”的平台和生态系统，并解决 IoT 架构的上五层。工作考虑了服务集成、业务逻辑、虚拟化、存储、API、工具、外部系统服务、应用程序、数据分析和云服务。


    ## 4.2 AGILE


    `AGILE` 项目旨在解决硬件和软件层面的技术和语法互操作性。在硬件方面，项目设计了硬件组件，扩展了现有 IoT 网关平台的先进水平，具有双重目标：通过扩展最常用且低成本的
    `Raspberry Pi` 平台的能力开发所谓的“创作者网关”（Maker’s Gateway）；以及开发用于工业目的的模块化硬件网关设计。对于创作者网关，项目向开源硬件社区贡献了一个遵循
    `Raspberry HAT` 规范的扩展板，通过两个额外的无线模块插座扩展了平台功能，并带有包括 GPS 在内的多个传感器，以及进一步的有线传感器连接选项。该项目还提供了代码，帮助开发者在名为
    `Node-Red` 的基于 Web 的可视化应用程序开发环境中可视化并最终使用这些功能。这些工具的易用性使得没有软件/硬件知识的人能够在快速原型环境中组装其所需的解决方案，该环境也用于测试以及大产前的准备。


    在软件方面，`AGILE` 项目的目标是通过 `Eclipse Foundation` 向 IoT 软件开发者/创作者社区发布开源代码，帮助他们根据设备将所属的平台环境轻松地配置设备或网关。代码在设计时考虑了网关平台的互操作性，最大限度地减少了依赖，因此不仅支持项目内部开发的两个网关硬件平台变体，还支持市场上的其他其他平台。为此，使用了
    `Docker` 容器化（`https://www.docker.com/`）来将软件组件彼此以及与底层硬件/操作系统隔离开。事实上，`Docker` 是软件容器领先的容器化技术，包含软件二进制执行文件、运行时和所有相关依赖的包。


    为了进一步促进硬件支持，项目还贡献了基于 `Linux` `Yocto` 的 `ResinOS` 操作系统的开发，该系统专门针对基于 `docker` 的多容器部署进行了优化，可适用于大量的
    IoT 网关平台。


    因此，通过创建一个可以在用户和开发者之间共享的 IoT 应用生态系统，利用现有的如 `Docker` 容器生态系统更容易促进平台的互操作性。用户能够通过 `Docker`
    应用市场安全地发现、安装/管理和共享为互操作性目的而开发的组件。


    `Figure 4.1` 详细展示了 `AGILE Architecture` 的样貌，以及在容器平台中作为可执行镜像运行的各种模块，使其能够解决互操作性问题。为此值得强调的是
    IoT 设备和硬件模块发现、IoT 设备通信（硬件互操作性），以及 `Device Management UI` 和 `IoT Data Management
    UI`（软件互操作性），它们涵盖了语法互操作性的所有方面。


    ![Figure 4.1. AGILE Detailed Architecture](img/fig4_1.jpg)


    **图 4.1.** AGILE 详细架构


    图片的顶部显示了 `AGILE` 如何通过允许用户利用外部平台进行数据管理（例如 `Dropbox` 和 `Google-Drive`）、IoT 设备的 API（如可穿戴设备
    API、家庭自动化 API 等）以及应用程序的可扩展部署（例如支持 `CloudFoundry` PaaS 和集成 `FIWARE` 赋能器、`Microsoft
    Azure` 等）来实现现有 IoT 平台的水平互操作。`AGILE` 通过为其基于 `Node-Red` 的可视化应用程序组合环境提供特定的 IoT 平台模块，在软件层面解决了这些挑战。结合
    `Figure 3.2` 的分类，这种方法类似于“跨平台访问”模式，不同在于 `AGILE` 以 `Node-Red` 模块的形式支持，可以组合同时使用 `AGILE`
    以及其他几个平台功能的应用程序。


    该项目没有解决任何语义互操作性的方法。


    ## 4.3 BIG IoT


    `BIG IoT` 项目的目标是通过利用`智能物体平台`的能力，通过开放的 `BIG IoT API` 和 `BIG IoT Marketplace` 建立`语法`和`语义互操作性`，消除物联网服务和应用提供者的技术入门障碍，实现跨标准、跨平台和跨领域的
    IoT 服务和应用程序。因此，该项目正在定义一个物联网生态系统的综合架构，包括完善的安全设计和服务组合方法，同时提供了维持生态系统的业务模式。


    ### 4.3.1 The BIG IoT Architecture


    '
- fmt: '

    This subsection is based on the material published in \[[10](#10_References.xhtml#ref_10)\]
    and \[[17](#10_References.xhtml#ref_17)\]. Below, the architectural approach and
    related interoperability aspects of the BIG IoT project are outlined. [Figure
    4.2](#08_Chapter04.xhtml#fig4_2) presents an overview of the BIG IoT architecture
    for IoT ecosystems. The architecture has been specifically designed to support
    all of the above-described patterns of interoperability (Section 4.1.1). The architecture
    is centred around a common set of interfaces, referred to as the BIG IoT API,
    that are supported both by offering providers and consumers, as well as the marketplace,
    where resources are traded. These interfaces include the following basic interactions:


    ![Figure 4.2. BIG IoT Architecture Overview A [10] and B [17].](images/fig4_2.jpg)


    **Figure 4.2.** BIG IoT Architecture Overview A [[10](#10_References.xhtml#ref_10)]
    and B [[17](#10_References.xhtml#ref_17)].


    *   • M1: Authentication & authorization of offering providers and consumers

    *   • M2: Registration of offerings (through offering providers)

    *   • M3: Querying of offerings (through offering consumers)

    *   • M4: Accounting of offering access

    *   • A1: Access to offerings requested by offering consumers


    These interfaces are the basis for enabling interoperability and realizing the
    patterns I – V (Section 4.1.1). Thereby, key challenges for realizing patterns
    II, III, and V are e.g.:


    *   • The offering providers and consumers are from different application domains
    (II);

    *   • The IoT offerings are hosted on different IoT platforms, e.g. located in
    different regions (III);

    *   • The IoT offerings are on different provider systems, e.g. an IoT platform
    or a service (V).


    Important in this figure is also the concepts of the BIG IoT Consumer and Provider
    Libs. For example, the Provider Lib implements the `Register` interface (M2) for
    uploading a description of an offering to the marketplace and offers the `Access`
    interface (A1) to provide the information to a consumer. The benefit of these
    libraries is that developers of platforms, services and applications are supported
    in advertising their offerings on the marketplace or use the marketplace to discover
    and access them. They only have to implement once the `Provider (P1)` or `Consumer
    (P2)` interface and can easily update the libraries in order to further comply
    in case of changes in the details of the underlying message formats and interactions.
    For the registration process via the `Register` interface (M2) a semantic description
    is used that is called an Offering Description and relies on the Resource Description
    Framework (RDF).


    ### 4.3.2. IoT platforms interoperability approach


    A central goal of the BIG IoT architecture is to facilitate the integration of
    IoT platforms through the BIG IoT ecosystem. Both infrastructure as well as device-level
    platforms are targeted. From an architectural perspective, specifically considering
    the implementation of the BIG IoT API and integration with marketplaces, we have
    identified the following types of IoT platforms:


    > **Type 1: Server Infrastructure or Cloud based IoT Platform** assumed to be
    “always online” and anytime accessible by applications or services via the Internet.


    > **Type 2: Device-level IoT Platform, hosted on devices that are unconstrained⁴
    with respect to communication, compute and memory resources** assumed to be “always
    online” whereby connectivity and communication resources is assumed to be charged
    on a “flat-rate” plan.


    > **Type 3: Device-level IoT Platform, hosted on devices that are unconstrained
    with respect to communication, compute and memory resources, but are “not always
    online”**.


    > **Type 4: Device-level IoT Platform, hosted on devices that are unconstrained
    with respect to communication, compute and memory resources, but are connected
    to the Internet via a “pay-per-use” plan**, Type 4 devices are often also of Type
    3.


    > **Type 5: Device-level IoT Platform, hosted on devices that are constrained⁵
    with respect to communication, compute and/or memory resources**.


    In the BIG IoT Project, overall 8 platforms are integrated by the partners. First,
    6 cloud- or infrastructure-level platforms are part of the ecosystem: Bosch’s
    Smart City platform, based on the Bosch IoT Suite[6](#08_Chapter04.xhtml#fn4_6)
    (**Type 1; Mode 1, Mode 2, Mode 4**), CSI’s Smart Data[7](#08_Chapter04.xhtml#fn4_7)
    platform (**Type 1; Mode 3**), OpenIoT[8](#08_Chapter04.xhtml#fn4_8) (**Type 1;
    Mode 1, Mode 2**), VMZ’s TIC[9](#08_Chapter04.xhtml#fn4_9) platform (**Type 1;
    Mode 1, Mode 2**), Siemens APM platform (**Type 1; Mode 2**), and WorldSensing[10](#08_Chapter04.xhtml#fn4_10)
    (**Type 1; Mode 1, Mode 2**). Further, there are 2 device-level platforms: Bosch’s
    BEZIRK[11](#08_Chapter04.xhtml#fn4_11) platform (**Type 2, Type 3**) and Econais’
    Wby[12](#08_Chapter04.xhtml#fn4_12) platform (**Type 4; Mode 1, Mode 2**). Those
    BIG IoT-enabled platforms are integrated via the BIG IoT API and currently rolled
    out in 3 Pilot sites: Barcelona, Wolfsburg, and Piedmont. Our Use Cases are divided
    in 9 clusters: Smart Parking, Smart Traffic Management, Public Transport Optimization,
    Healthy Bike Navigation, Smart Bike Sharing, Incentive-based Green route Planning,
    Multi-Modal Route Optimizer, Smart Charging, Device-to-Device Communication. In
    NG we use Bosch’s Smart City platform, VMZ’s TIC platform, Siemens APM Platform;
    in BCN are OpenIoT, WorldSensing, Bosch’s BEZIRK; Piedmont integrates CSI’s Smart
    Data.


    ### 4.3.3. Interoperability aspects


    Solving interoperability issues related to these patterns requires the use of
    common information models, e.g., offered through Semantic Web technologies. Those
    common information models need to allow the description of offerings, so that
    consumers (e.g., services or applications) can work with them, even if they are
    from different domains or systems. The BIG IoT Core Model defines the core vocabulary
    required to create an Offering Description. The Offering Description relies on
    the work done within W3C Web of Things (WoT) group, in particular, the Thing Description
    (TD) format [[21](#10_References.xhtml#ref_21)]\] and going to be mapped also
    to W3C SSN/SOSA. The semantics are further enriched by domain independent and
    domain dependent models. A domain dependent model is used to semantically annotate
    the metadata, offering category and input/output data of an Offering Description.
    The BIG IoT semantic Application Domain Model is created using the BIG IoT semantic
    Core Model, domain independent and/or domain models. This model establishes the
    relationship between the core model and domain model. Along with offering categorization
    and data modeling, the Domain Model also defines the vocabulary to semantically
    annotate the domain dependent features of an offering. For example, the class
    `mobility:ParkingSpace` can be used to annotate a parking space and its features
    such as `parking space id`, or `parking space location`.


    For the semantic annotation of offering descriptions, e.g., defining the semantics
    of inputs, outputs and offering category, a well-defined vocabulary of domain
    terms is needed. This vocabulary should be widely shared and agreed upon so that
    all consumers and providers of IoT platforms can rely on it. We have selected
    schema.org as a basis for our domain model, as it provides a vendor-neutral, community-developed
    vocabulary for structured data.

