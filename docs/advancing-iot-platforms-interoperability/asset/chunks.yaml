    The fourth uniqueness relates to the `security perspective`. symbIoTe implements
    a flexible, distributed, and effective mechanism for controlled access to resources,
    both sensors and actuators, in a federation of heterogeneous IoT platforms. The
    conceived methodology grounds its roots in the powerful `Attribute-Based Access
    Control` mechanism. A specific access policy, defined as a combination of attributes
    (i.e., user’s properties, roles, details) is assigned to each resource, while
    the access to that resource can be granted only to users in possession of a set
    of attributes matching the aforementioned policy.


    The above listed features allow symbIoTe to support all six patterns of interoperability
    presented in [Section 3.1.1](#07_Chapter03.xhtml#sec3_1_1).


    All six patterns of interoperability presented in [Section 3.1.1](#07_Chapter03.xhtml#sec3_1_1)
    are supported by symbIoTe and can be mapped to the above listed features. Pattern
    I, II and III are supported through the provided `Core` services (e.g. search
    for resources), the `Interworking API`, support for `PIMs` and semantic mapping.
    Pattern IV (`Platform-Scale Independence`) fits to the four interoperability/compliance
    levels of symbIoTe; pattern V (`Higher-Level Service Facade`) matches the concept
    of `Enablers` and pattern VI (`Platform-to-Platform Direct Interactions`) the
    concept of federations as defined in symbIoTe.


    symbIoTe is implementing an `Open Source` middleware prototype available at [https://github.com/symbiote-h2020](https://github.com/symbiote-h2020),
    following an `agile-like` approach. Developers from all consortium partners join
    forces in the implementation of the software components using the microservices
    architecture to fulfil the requirements of incremental feature deployment and
    scalability of the highly-distributed IoT ecosystem. Regarding `licensing`, the
    consortium has selected a “copyleft” license for the `Core Services` (`LGPL-3.0`),
    so that updates, bug fixes and new features are always given back to the `Open
    Source Community`. For the middleware components residing at the platforms’ side
    the licensing is following the “non-copyleft” approach (the `BSD 3-Clause` is
    selected).


    ## 4.7 TagItSmart


    A comprehensive view of TagItSmart architecture components is presented in [Figure
    4.12](#08_Chapter04.xhtml#fig4_12). TagItSmart is designed as a set loosely coupled
    components which can be integrated in and across different environments (IoT platforms).
    To this end, components providing specific TagItSmart functionality like smart
    tag encoding, decoding etc. come with their own `APIs`, while more generic IoT
    functions are reused from the underlying IoT platform used. This approach makes
    use of TagItSmart functionality rather straightforward in different settings and
    reduces the learning curve for developers.


    ![Figure 4.12. TagItSmart Platform Functional Architecture](images/fig4_12.jpg)


    **Figure 4.12.** TagItSmart Platform Functional Architecture


    From the functional point of view, the `User/Developer level` provides the front
    end functionality enabling access to different TagItSmart components. Additionally,
    at this level, the `TagItSmart SDK` enables integration of the smart tag decoding
    functionality into third party (smartphone) applications.


    At the `Service level`, we can find the following functional blocks:


    *   `Security` components deal with aspects such as authentication, authorisation
    and access control to the rest of the components. The security is addressed on
    several levels: the security of the smart tags is ensured with `Ciphertext Policy
    Attribute Based Encryption` (`CP-ABE`) by embedding policy contained in the ciphered
    tag in order to enforce access control policies associated with the different
    users; the security of the web platform and the `APIs` are ensured with the identity
    management based on credentials and authentication mechanism; and trustworthiness
    and data integrity hinge on the distributed ledger technology.


    *   `Service Execution` components include those that enable execution of services
    registered in the platform, as well as the service templates used to trigger dynamic
    creation of workflows. The overall process allows users of the platform to issue
    service requests that are then processed by the platform, resolved in terms of
    sub-services that need to be “glued together” to support the overall service request
    and are then executed. In order for this to take place, a series of repositories
    are leveraged to first of all expose the services that are available in the platform,
    so they can be discovered, configured, triggered and reused appropriately. In
    addition, a component that intercepts the service requests and is able to break
    them down to services that are needed are involved (`Service Manager`). The service
    templates guide this process of identifying what a service request needs in terms
    of sub-services as well user information. The latter both for making sure that
    only authorised users are allowed to access the platform and issue service requests
    as well as be served through the platform (e.g. an `FC-scanner` user to be able
    to use a decoding or stream processing component that is hosted in the TagItSmart
    platform) but also for identifying appropriate resources based on ownership, location
    and other availability criteria that need to be involved during a service request
    execution. Eventually the runtime execution of a service is undertaken by the
    `Workflow Enforcer`, which acts as a a “middle man” between components, passing
    information between components appropriately and handling errors so that other
    components can focus solely on their functional operation.


    *   `Data Processing` components provide additional functionality to handle and
    work with the data generated in the platform.


    *   `SmartTags` components facilitate integration, creation and scanning of the
    `SmartTags`.


    *   `Data Access` components provide the corresponding registries, semantic models
    and repositories on which TagItSmart operates.


    **Table 4.1** Integration Strategies


    ![](images/tab4_1.jpg)


    At the `Virtual Entity` level, the actual representations of the objects that
    are part of the platform provide access to their data and defined actions based
    on the semantic models.


    Taking the architecture described above as the starting point, here we describe
    how TagItSmart functionality can be implemented in practice:


    `Full Implementation of an IoT Platform with TagItSmart`: this scenario builds
    up from scratch all the components defined in the architecture of TagItSmart the
    functionality is integrated in the same codebase. The infrastructure needed to
    support the platform is provisioned by the implementation provider.


    `Hosted in a third party IoT platform`: this scenario integrates TagItSmart functionality
    in an already existing IoT platform. Components implementation might need some
    adaptation to comply with the existing platform, yet they should be interoperable
    by following the correspondent `API`. Infrastructure needs are set up by the third
    party IoT platform provider.


    `Shared and hosted externally`: this scenario considers TagItSmart as a standalone
    set of services that expose an open `API` and that can be accessed from different
    platforms simultaneously. Deployment and infrastructure needs are handled independently
    from the IoT Platform.


    The components defined in [Figure 4.12](#08_Chapter04.xhtml#fig4_12). are the
    set of components needed to fulfil the requirements extracted from the different
    use cases, while enabling creation and lifecycle management of the `SmartTags`.
    Based on the chosen integration strategy, mapping of some of the components to
    real implementations and deployments in a specific IoT platform will be different.


    **Table 4.2.** TagItSmart APIs example


    | **OPERATION** || **API** || **DESCRIPTION** |


    | --- | --- | --- |

