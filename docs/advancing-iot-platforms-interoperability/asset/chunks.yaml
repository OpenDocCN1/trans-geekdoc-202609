    Achieving interoperability is one of the main objectives of the IoT. As the name
    Internet of Things already states, it is all about connecting things and make
    them easily accessible just like the Internet today. “Broadly speaking, interoperability
    can be defined as a measure of the degree to which diverse systems, organizations,
    and/or individuals are able to work together to achieve a common goal” \[[6](#10_References.xhtml#ref_6)\].
    However, interoperability is a complex thing and there are many aspects to it.
    In literature, there exists quite a lot of different classifications of these
    aspects of interoperability, often also called levels of interoperability. One
    of the most important classification of levels of interoperability for technical
    systems is called `Levels of Conceptual Interoperability Model` (LCIM) and is
    depicted in [Figure 3.1](#07_Chapter03.xhtml#fig3_1). Although it was created
    in the context simulation theory it has a much broader applicability. It defines
    six levels of interoperability: technical, syntactic, semantic, pragmatic, dynamic
    and conceptual interoperability.


    The European Interoperability Framework designed “to support the delivery of pan-European
    eGovernment services to citizens and enterprises” \[[8](#10_References.xhtml#ref_8)\]
    defines only three levels: technical, semantic and organisational interoperability.


    ![Figure 3.1 The Levels of Conceptual Interoperability Model \[7\].](images/fig3_1.jpg)


    **Figure 3.1** The Levels of Conceptual Interoperability Model \[[7](#10_References.xhtml#ref_7)\].


    A more IoT-specific classification is provided by ETSI and AIOTI and defines four
    levels \[[9](#10_References.xhtml#ref_9)\]: technical, syntactic, semantic and
    organisational interoperability. In short, they are defined as follows.


    *   • **Technical Interoperability**: usually associated with communication protocols
    and the infrastructure needed for those protocols to operate.

    *   • **Syntactic Interoperability**: usually associated with data formats and
    encodings, e.g., XML, JSON and RDF.

    *   • **Semantic Interoperability**: associated with the common understand of
    the meaning of the exchanged content (information).

    *   • **Organisational Interoperability**: associated with the ability of organisations
    to effectively communicate and transfer information even across different information
    systems, infrastructures or geographic regions and cultures.


    As this is the most agreed-upon classification of interoperability levels within
    the IoT domain we follow it in this document.


    ## 3.1 IoT platforms interoperability challenges


    ### 3.1.1 Patterns of IoT interoperability


    Achieving interoperability on the IoT, requires a closer look at interactions
    of the key components in IoT ecosystems. Before looking into the specifics of
    technical interoperability, syntactic interoperability, semantic interoperability,
    and organizational interoperability, we analyse here those interactions and we
    identify in [Figure 3.2](#07_Chapter03.xhtml#fig3_2) six generic interoperability
    patterns for IoT ecosystems. This subsection is based on the material published
    in \[[10](#10_References.xhtml#ref_10)\].


    The “Cross Platform Access” pattern ([Figure 3.2, I](#07_Chapter03.xhtml#fig3_2))
    is the basic characteristic of an IoT ecosystem. The goal of this pattern is to
    hide that an application or service accesses resources (information or functions)
    through the same interface.


    The “Cross Application Access” pattern ([Figure 3.2, II](#07_Chapter03.xhtml#fig3_2))
    extends the “Cross Platform Access” pattern. The goal is to allow services to
    access information and functions not only from different platforms, but also from
    platforms that host data data through the same interface.


    The goal of the “Platform Independence” pattern ([Figure 3.2, III](#07_Chapter03.xhtml#fig3_2))
    is to allow a single application or service to be used on top of different platforms.
    This is especially challenging, when the sensors producing data are based on entirely
    different technology.


    The “Platform-Scale Independence” pattern ([Figure 3.2, IV](#07_Chapter03.xhtml#fig3_2))
    is to hide different platform scales towards the connecting services and applications.
    The `server-level` platforms are platforms with many devices connected (e.g. a
    cloud platform), whereas `device-level` platforms grant direct access to attached
    sensors, and `fog-level` platforms are intermediaries such as edge gateways.


    Finally, the “Higher-level Service Facades” pattern ([Figure 3.2, V](#07_Chapter03.xhtml#fig3_2))
    extends the interoperability requirements from platforms to higher-level services.
    Here, services are acting similar to platforms and also provide IoT offerings
    via a common interface.


    ![Figure 3.2 The patterns of interoperability \[10\].](images/fig3_2.jpg)


    **Figure 3.2.** The patterns of interoperability \[[10](#10_References.xhtml#ref_10)\].

