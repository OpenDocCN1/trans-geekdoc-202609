    Platform-to-platform direct interactions enable existing (native) applications
    to use resources managed and operated by other federated platforms as if they
    were offered by a single platform, as shown in [Figure 3.2.VI](#07_Chapter03.xhtml#fig3_2).
    This reduces the burden of interacting with multiple platforms from an application
    or a service, while platforms increase the portfolio of offered resources. For
    example, if Platform 2 offers to barter data produced by its static temperature
    sensors within a federation formed by platforms 1 and 2, this means that Platform
    1 can use and offer temperature readings produced by those sensors as if Platform
    1 was managing the devices.


    Platform 1 offers in turn its temperature sensors located in another location
    to Platform 2. Therefore, an application or service can use the sensors from a
    single platform. Note that oneM2M has also identified such interaction between
    two platforms and tags the interface for platform interworking `Mcc’` (between
    two services providers).


    ### 3.1.2. Semantic Interoperability


    Semantics, as seen in linguistics and philosophy, refers to the study of meaning,
    which means the relation of signifiers like words, symbols or signs and their
    denotation [[[12](#10_References.xhtml#ref_12)]]. In computer science, the meaning
    of semantics is the same, but here the relations of signifiers and their denotation
    need to be understandable and process able by machines.


    The most common way to achieve this is by using an ontology which is ‘an explicit
    specification of a [shared] conceptualization’ [[[6](#10_References.xhtml#ref_6)]]
    and can be imaged like a formally defined information model. This is in line with
    the idea of the Semantic Web [[[13](#10_References.xhtml#ref_13)]] introduced
    by Tim Berners-Lee in 2001, proposing the evolution of the Internet from a web
    of documents to a web of machine-readable and -understandable data. The corner
    stone technologies of the Semantic Web are the Resource Description Format[¹](#07_Chapter03.xhtml#fn2_1)
    (`RDF`), a lightweight (meta data) data model for describing ontologies, and SPARQL
    Protocol and RDF Query Language[²](#07_Chapter03.xhtml#fn2_2) (`SPARQL`), which
    both are standardized by the World Wide Web Consortium (W3C).


    To enable building new innovative applications which, make use of data from multiple
    IoT systems, spanning existing “IoT silos” these systems must not only be able
    to exchange raw data but also have a common understanding of its meaning. Unfortunately,
    even if today’s IoT systems are willing to expose their data and resources to
    others, their semantically incompatible information models, offering different
    descriptions or even understandings of resources and operational procedures become
    an issue. Therefore, semantic interoperability is defined as “the ability of computer
    systems to exchange data with unambiguous, shared meaning” [[[14](#10_References.xhtml#ref_14)]]
    is the key to “data exchange and service creation across large vertical applications”,
    which is the next step of evolution of the IoT [[[15](#10_References.xhtml#ref_15)]].


    The challenge in achieving semantic interoperability is to find a way to provide
    this unambiguous, shared meaning of things, i.e. bridging the semantic gap between
    two (or more) platforms. [Figure 3.4](#07_Chapter03.xhtml#fig3_4).


    ### 4. IoT-EPI Projects addressing IoT interoperability


    #### 4.1. IoT-EPI Platforms - Architectural mapping


    The IoT platforms adoption is driven by factors such as economics that add cloud
    services and the development of partner ecosystems. In this context, device manufacturers
    provide built in solutions and models with the IoT SDKs to provide ease of use
    that allows the use of multiple portals and applications. The relationship with
    the service providers is increasingly important with the integration within the
    IoT suite and the various offerings from service providers.


    The development of standardisation is accelerating in the area of device discovery
    to support ability for heterogeneous devices to communicate and interoperate.
    Standards are key to enabling interoperability, driving down costs and stimulating
    growth. However, standards processes are complex, take a long time to evolve and
    be adopted, and will still take some time to have mature, stable standards dominating,
    so suppliers and buyers are having to over-invest in multiple standards.


    In this complex environment, the IoT-EPI projects are developing interoperability
    solutions that are addressing different layers in the IoT architecture and offer
    mechanisms for providing interoperability between different IoT platforms.


    In the following paragraphs, we briefly discuss the mapping of the IoT architecture
    layers to the activities and solutions provided by the IoT-EPI projects.


    **AGILE** builds a modular hardware and software gateway for the IoT focusing
    on the physical, network communication, processing, storage and application layers.
    The AGILE software modules are addressing functions such as device management,
    communication networks like area and sensor networks and solution for distributed
    storage. The project considers all the modules needed to provide a robust security
    management solution.


    **bIoTope** provides an architecture and recommendations for the use of open standards
    and use case implementations that enable stakeholders to easily create new IoT
    systems and services and to rapidly harness available information using advanced
    Systems-of-Systems (SoS) capabilities for Connected Smart Objects. bIoTope also
    develops and provides standardised open APIs to enable interoperability. The project
    addresses all eight layers of the IoT architecture and validates the interoperability
    solutions in a cross-domain environment.

