    IoT platforms facilitate communication, data flow, device management, and the
    functionality of applications. A platform is not the application itself, although
    many applications can be built entirely within an IoT platform framework. It links
    machines, devices, applications, and people to data and control centres. It is
    not confined to brick-and-mortar central command; ideally, it can be accessed
    and managed from many different locus points. It employs better, quicker search
    engines and data storage systems with the capacity and sophistication to handle
    volume far beyond what has brought industry to the present moment \[[3](#10_References.xhtml#ref_3)\].
    Most of its elements are cloud-based and running on wireless connectivity, which
    may be established via third-party providers, application programming interfaces
    (APIs), cellular capabilities, or -most likely- a combination of these technologies.


    Through dashboards, APIs, data engines, and algorithms, a platform enables elements
    and sectors of a business network to connect, monitor, and communicate with each
    other with far greater speed and flexibility than we have yet seen. Data from
    an ever-expanding ecosystem can be collected, sorted, and harnessed entirely online.
    The platform also can enable data prioritization, a feature of critical importance
    at a time when machines, sensors, and other objects are beginning to generate
    new floods of information.


    IoT platforms provide security features, scalability, and capacity for pulling
    in, storing, and analysing data. It may connect machines, people, applications,
    or all three. Like any intelligent network, it provides innate predictive qualities
    that use data for the purposes of maintenance and troubleshooting. The user interfaces
    are intuitive and extensible, allowing for the future development of application
    extensions and the necessary scalability to track an increasing number of connected
    devices, people, and data sources.


    Essentially, an IoT platform allows for greater concentration of resources in
    value-added applications. Instead of requiring companies to focus on the lower
    levels of the technology stack, which are essential but not value-positive, attention
    can be paid to application development; a smarter, more integrated IoT ecosystem;
    and intelligent data generation.


    Using IoT platforms applications are sent to market faster and with better support.
    Connectivity and data management - which historically have required huge investments
    in time and development costs - are “givens” on the IoT platform, as reliable
    as electricity generation, and just as liberating to users.


    The root of the IoT is connectivity: more things, more people, and the matrix
    of connections that springs up between them. Yet, in less than a decade, the technology
    has moved far beyond this fundamental consideration. Where many companies may
    have believed it was advantageous to build out a platform internally, it is becoming
    clear that much of the technology stack can now be implemented with out-of-the
    box tools and effective engagement with vendors.


    ThingWorx \[[4](#10_References.xhtml#ref_4)\] defines an IoT platform as a suite
    of components that enable:


    *   •  Deployment of applications that monitor, manage, and control connected
    devices.


    *   •  Remote data collection from connected devices.


    *   •  Independent and secure connectivity between devices.


    *   •  Device/sensor management.


    *   •  Integration with third party systems.


    IoT platforms exist independently between the hardware and the application layers
    of the IoT technology stack. The ideal platform will integrate with any connected
    device, blend in with device applications, and enable implementation of IoT features
    and functions into any device in the same way.


    Link Labs \[[5](#10_References.xhtml#ref_5)\] defines an IoT platform at a high
    level as “the support software that connects edge hardware, access points, and
    data networks to other parts of the value chain (which are generally the end-user
    applications). IoT platforms typically handle ongoing management tasks and data
    visualization, which allow users to automate their environment. You can think
    of these platforms as the middleman between the data collected at the edge and
    the user-facing SaaS or mobile application”.


    IoT platforms are often referred to as middleware solutions, which can collectively
    be referred to as the value chain of IoT, that are the “plumbing” of the IoT.
    Generally, an IoT or M2M solution is a mash-up of functions from multiple vendors,
    which include:


    *   •  Sensors or controllers.


    *   •  A gateway device to aggregate and transmit data back and forth to the data
    network.


    *   •  A communications network to send data.


    *   •  Software for analysing and translating data.


    *   •  The end application service, which creates much of the value.


    # 3 IoT platforms interoperability concepts, approaches and principles'
