- fmt: '

    The most promising aspects of a common framework for IoT interoperability are
    finding common approaches to resource access, resource discovery as well as semantic
    interoperability.


    Further research is needed to address interoperability in the systems-of-systems
    view where all devices, ‘things’ and other information systems should be able
    to interoperate at the level of Internet protocols (`TCP/IP`, etc.) or even at
    the World Wide Web (`WWW`) level (`HTTP`, `WebSockets`, etc.). This signifies
    that lower-level protocols (`Zigbee`, `LoRa`, etc.) are abstracted away behind
    ‘wrappers’ and services using a limited set of IoT standards.


    All IoT applications need to cope with the complex nature and sustainability requirements
    of interoperability in the IoT. For this, a framework is required for sustainable
    interoperability that especially targets the specific characteristics and constraints
    of the IoT.


    A possible framework for sustainable interoperability in the IoT should be able
    to address the following aspects:


    *   **Scalability management of interoperability in the IoT**: to correctly support
    interoperability in the IoT, interoperability resources must be efficiently and
    effectively managed.

    *   **Capacity of interoperability measurement in the IoT**: to properly manage
    and execute interoperability in the IoT, a method must be reached to quantify
    and/or qualify the interoperability itself.

    *   **Dynamic interoperability techniques and methodologies for the IoT**: to
    achieve enduring interoperability in the complex IoT ecosystem, ‘things’ must
    be permitted to enter and dynamically interoperate without the need for heavy
    modification.


    The validation aspect is very important in interoperability in general and even
    more so for the IoT. Testing and validating assert that interoperability methods,
    protocols and so on can cope with the specific nature and requirements of the
    IoT. We need to provide efficient and accurate test suites and an associated interoperability
    testing methodology that helps in testing thoroughly both the underlying protocols
    used by interconnected ‘things’, machines and smart objects, and the embedded
    services and applications. In this view, we have to consider that to most of the
    existing testing methods, interconnected ‘resources’ in the IoT are naturally
    distributed. As they are distributed, the usual and classical approach of a single
    centralised testing system dealing with all these components and the test execution
    is no longer applicable. The distributed nature of the tested components requires
    moving towards distributed testing methods.


    The IoT research community has to agree on data sets for evaluating IoT platform
    ingestion performance, as well as agree on sets of real-time queries for evaluating
    an IoT platform digestion performance. Testing/experiment sequences have to be
    made explicit, transparent and consensus-based to ensure a fair and unbiased benchmarking
    process.


    Implementation of the interoperability solutions should aim for an open source
    approach using different business models. The solutions need to be sustainable
    even after the end of the projects. Further research should focus on the key aspect
    of API homogenisation between platforms and federation authentication. This should
    allow for flexible cross-domain/cross-platform business process creation.


    Utilising IoT (platform) technology for handling automated complex systems is
    a key challenge for the future. In this context, complex systems relate to systems
    that are heavily composed of rich sensing capabilities (e.g. radar, visual) and
    advanced actuation (e.g. controlling robot arms). The automation of these complex
    systems requires intelligent sensor data processing and reasoning to meaningfully
    control the actuation. IoT platform technology has the potential to facilitate
    and enhance the creation of systems significantly by being the interoperable interface
    within and between complex systems and the automation. Sensors, actuators and
    ‘things’ description formats, communication protocols and APIs defined by the
    IoT community need to use a lingua franca to enable such intelligent processing
    and reasoning.


    Examples for such automated complex systems where IoT platform technology can
    provide a drastic development boost range from connected robots and robotic ecosystems
    over automated manufacturing lines that are integrated with logistic chains to
    automated vehicles (ships, aircrafts, trains, trucks, cars) and fleets.


    Connecting components and systems to more complex systems is becoming possible
    with IoT platform technology. Thereby, intelligent and automated collaboration
    within and between such complex systems will be a central challenge. Automatically
    creating compositions of IoT components out of a pool of existing components (populated
    via a repository) will increase economic impact because reusing the components
    in multiple compositions will increase revenue created. Instead of controlling
    the composition centrally, it will be organised decentralised through intelligent
    choreographies.


    In the future, complex services might even be created on the fly, for example
    when a car arrives in a new city and needs a specific service from the city’s
    IoT ecosystem. How such context-based service composition can be implemented efficiently
    is one of the core research topics that requires further study.


    Current efforts on semantic interoperability in the context of IoT focus on ‘interoperability
    by standardization’ trying to define standardized vocabularies to be used by multiple
    platforms and thus establishing semantic interoperability. However, there always
    will be scenarios where standardization is not desired or not even possible. To
    provide semantic interoperability in these cases other approaches to semantic
    interoperability are needed. The most prominent and promising is using data and
    query translation based on semantic mappings between the different information
    models used by the platforms. However, since the semantic mapping technologies
    are not trivial tools that would significantly make easier the process are required.


    The unique identity of ‘things’ that spans across all platforms is still an unresolved
    issue. For instance, a car can be identified by a serial number or vehicle identification
    number (`VIN`), registration plate number, insurance number or some other identifier.
    The most appropriate one might depend on the usage context, so this feature should
    be a requirement for any IoT information system.


    Although there are multiple ways of assigning identity to each individual ‘thing’
    and each individual item, the work on aligning these different identity approaches
    and enabling their mapping to allow easy use of the same ‘thing’ in different
    environments has to continue.


    The research work on a common IoT interoperability framework needs to be continued
    and requires a detailed and broad analysis of the different interoperability levels
    and their protocols paired with intensive scientific research as well as standardisation
    work.


    A roadmap regarding interoperability is linked with the creation of the IoT ecosystems
    mainly with developers around the existing solutions (i.e. `IoT-EPI`). The functionalities
    of the interoperability solutions must be extended, including self-* mechanisms
    for controlling actuation, especially in future IoT autonomous systems.


    # 6 References


    1.  [1](#06_Chapter02.xhtml#rref_1)    A. Gluhak, O. Vermessan, R. Bahr, F. Clari,
    T. Macchia, M. T. Delgado, A. Hoeer, F. Boesenberg, M. Senigalliesi and V. Barchetti,
