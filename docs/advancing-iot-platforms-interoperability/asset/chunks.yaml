    IoT platforms’ functionalities cover the digital value chain from sensors/actuators,
    hardware to connectivity, cloud and applications, as illustrated in [Figure 2.1](#06_Chapter02.xhtml#fig2_1).
    Hardware connectivity platforms are used for connecting the edge devices and processing
    the data outside the datacentre (edge computing/fog computing), and program the
    devices to make decisions on the fly. The key benefits are security, interoperability,
    scalability and manageability by using advanced data management and analytics
    from sensor to datacentre. IoT software platforms include the integration of heterogeneous
    sensors/actuators; various communication protocols abstract all those complexities
    and present developers with simple APIs to communicate with any sensor over any
    network.


    ![Figure 2.1. IoT Platforms covering the data value chain \[1\]](images/fig2_1.jpg)


    **Figure 2.1.** IoT Platforms covering the data value chain \[[1](#10_References.xhtml#ref_1)\]


    IoT platforms also assist with data ingestion, storage, and analytics, so developers
    can focus on building applications and services, which is where the real value
    lies in IoT. Cloud-based IoT platforms are offered by cloud providers to support
    developers to build IoT solutions on their clouds. Infrastructure as a Service
    (IaaS) providers and Platform as a Service (PaaS) providers have solutions for
    IoT developers covering different application areas. PaaS solutions, abstract
    the underlying network, compute, and storage infrastructure, have focus on mobile
    and big data functionality, while moving to abstract edge devices (sensors/actuators)
    and adding features for data ingestion/processing and analytics services \[[1](#10_References.xhtml#ref_1)\].


    IoT platform definitions may differ in subtle and perhaps secondary details while
    overlapping on major features. One of the most succinct definitions of an IoT
    platform has been proposed by Gartner \[[2](#10_References.xhtml#ref_2)\]. It
    defines the IoT platform as a software suite or a PaaS cloud offering that monitors,
    and may manage and control, various types of endpoints, often via applications
    end users build on the platform. It facilitates operations involving IoT endpoints
    and integration with enterprise resources. Platforms should be capable of:


    * Provisioning and management of devices and their application software

    * Data aggregation, integration, transformation, storage and management (often
    collectively referred to as “data digestion”)

    * Event processing (rule engine/orchestration/BPM)

    * Customizing and building applications (SDK, app server, IDE and others)

    * IoT data analysis and visualization

    * Cybersecurity

    * IoT device communications (network and/or Internet)

    * Adapter (API hub, gateway software but also to the application on endpoint)

    * User interfaces for both end users and developers


    IoT platforms facilitate communication, data flow, device management, and the
    functionality of applications. A platform is not the application itself, although
    many applications can be built entirely within an IoT platform framework. It links
    machines, devices, applications, and people to data and control centres. It is
    not confined to brick-and-mortar central command; ideally, it can be accessed
    and managed from many different locus points. It employs better, quicker search
    engines and data storage systems with the capacity and sophistication to handle
    volume far beyond what has brought industry to the present \[[3](#10_References.xhtml#ref_3)\].


    The root of the IoT is connectivity: more things, more people, and the matrix
    of connections that springs up between them. Yet, in less than a decade, the technology
    has moved far beyond this consideration. Where many companies may have believed
    it was advantageous to build out a platform internally, it is becoming clear that
    much of the technology stack can now be implemented with out of the box tools.


    IoT platforms exist independently between the hardware and the application layers
    of the IoT technology stack. The ideal platform will integrate with any connected
    device, blend in with device applications, and enable implementation of IoT features
    and functions into any device in the same way.


    ThingWorx \[[4](#10_References.xhtml#ref_4)\] defines an IoT platform as a suite
    of components that enable:


    * Deployment of applications that monitor, manage, and control connected devices.

    * Remote data collection from connected devices.

    * Independent and secure connectivity between devices.

    * Device/sensor management.

    * Integration with third party systems.


    Link Labs \[[5](#10_References.xhtml#ref_5)\] defines an IoT platform at a high
    level as “the support software that connects edge hardware, access points, and
    data networks to other parts of the value chain (which are generally the end-user
    applications). IoT platforms typically handle ongoing management tasks and data
    visualization, which allow users to automate their environment. You can think
    of these platforms as the middleman between the data collected at the edge and
    the user-facing SaaS or mobile application”.

