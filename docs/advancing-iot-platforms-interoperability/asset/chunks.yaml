  trans: '


    第四个独特性涉及`security perspective`（安全视角）。symbIoTe 在异构 IoT 平台联邦中实现了一种灵活、分布式且有效的机制，用于对资源（包括传感器和执行器）进行受控访问。设计的方法论根于强大的`基于属性的访问控制`（Attribute-Based
    Access Control）机制。特定的访问策略被定义为属性的组合（即用户的属性、角色、详情），并分配给每个资源，而对该资源的访问仅授予拥有与上述策略匹配的属性集的用户。


    上述特征使得 symbIoTe 能够支持第 3.1.1 节所示的所有六种互操作模式。


    symbIoTe 支持第 3.1.1 节所示的所有六种互操作模式，并且这些模式可以映射到上述特征。模式 I、II 和 III 通过提供的 `Core` 服务（例如资源搜索）、`Interworking
    API`、对 `PIMs` 的支持以及语义映射来实现。模式 IV（`Platform-Scale Independence`，平台规模独立）适用于 symbIoTe
    的四个互操作/合规级别；模式 V（`Higher-Level Service Facade`，高层服务脸面）匹配 `Enablers`（赋能器）的概念；模式
    VI（`Platform-to-Platform Direct Interactions`，平台间直接交互）符合 symbIoTe 中定义的联邦概念。


    symbIoTe 遵循`agile-like`（类敏捷）方法，在 [`github.com/symbiote-h2020`](https://github.com/symbiote-h2020)
    实现一个开源的中间件原型。来自所有联盟合作伙伴的开发者共同利用微服务架构实现软件组件，以满足高度分布式 IoT 生态系统的增量功能部署和可扩展性需求。关于`licensing`（许可），联盟为
    `Core Services` 选择了“左拷贝”许可证（`LGPL-3.0`），以便将更新、错误修复和新功能始终反馈给`Open Source Community`。对于位于平台侧的中间件组件，许可遵循“非左拷贝”方法（选择了
    `BSD 3-Clause`）。


    ## 4.7 TagItSmart


    TagItSmart 架构组件的综合视图见图 4.12。TagItSmart 被设计为一组松耦合的组件，可以集成到不同的环境（IoT 平台）中并跨环境运行。为此，提供特定
    TagItSmart 功能（如智能标签编码、解码等）的组件带有自己的 `APIs`，而更通用的 IoT 功能则复用所使用的底层 IoT 平台。这种方法使得在不同设置下使用
    TagItSmart 功能更加直接，并降低了开发者的学习曲线。


    ![Figure 4.12. TagItSmart Platform Functional Architecture](img/fig4_12.jpg)


    **图 12.** TagItSmart 平台功能架构


    从功能角度来看，`User/Developer level`（用户/开发者层）提供了访问不同 TagItSmart 组件的前端功能。此外，在此级别，`TagItSmart
    SDK` 支持将智能标签解码功能集成到第三方（智能手机）应用程序中。


    在`Service level`（服务层），我们可以找到以下功能块：


    *   `Security`（安全）组件处理身份验证、授权和对其他组件的访问控制等方面。安全性在多个层面解决：通过在加密标签中嵌入包含的策略，使用`密文策略属性访问控制加密`（`CP-ABE`）确保智能标签的安全性，以执行与不同用户相关的访问控制策略；网络平台和
    `APIs` 的安全性通过基于凭据的身份管理和身份机制机制确保；而信任性和数据完整性则取决于分布式账本技术。


    *   `Service Execution`（服务执行）组件包括能够执行平台中注册服务的组件，以及用于触发动态创建工作流的服务模板。整个过程允许平台用户发布服务请求，然后由平台进行处理，将其解析为需要“粘合在一起”的子服务，以支持整个服务请求，然后进行执行。为了实现这一过程，首先利用了一系列仓库来暴露平台中可用的服务，以便能够被恰当地发现、配置、触发和重用。此外，还涉及一个拦截服务请求并能够将其分解为所需服务的组件（`Service
    Manager`，服务管理器）。服务模板引导这一识别服务请求在子服务和用户信息方面需要什么的过程。后者既是为了确保只有授权用户才能访问平台并发布服务请求以及通过平台获得服务（例如，`FC-scanner`
    用户能够使用托管在 TagItSmart 平台中的解码或流处理组件），也是为了根据所有权、位置和其他可用性标准识别服务请求执行过程中涉及的适当资源。最终，服务的运行时执行由
    `Workflow Enforcer`（工作流执行器）承担，它充当组件之间的“中间人”，在组件传递信息并处理错误。


    *   `Data Processing`（数据处理）组件提供了处理和操作平台生成数据的额外功能。


    *   `SmartTags`（智能标签）组件有助于智能标签的集成和创建。


    *   `Data Access`（数据访问）组件提供了 TagItSmart 运行的相应注册表、语义模型和仓库。


    **表 4.1** 集成策略![](img/tab4_1.jpg)


    在`Virtual Entity`（虚拟实体）层，平台对象的实际表示根据语义模型提供对其数据的访问和定义的操作。


    以上述架构为起点，此处描述了如何在实践中实现 TagItSmart 功能：


    `Full Implementation of an IoT Platform with TagItSmart`（带 TagItSmart 的 IoT 平台全实现）：该场景从零开始
    TagItSmart 架构中定义的所有组件，功能集成在相同的代码库中。支持平台的基础由实现者提供。


    `Hosted in a third party IoT platform`（托管在第三方 IoT 平台）：该场景将 TagItSmart 功能集成到已有的
    IoT 平台中。组件实现可能需要一些调整以符合现有平台，但它们应遵循相应的 `API` 实现互操作。基础设施需求由第三方 IoT 平台供应商设置。


    `Shared and hosted externally`（共享并在外部托管）：该场景将 TagItSmart 视为一组暴露开放 `API` 的独立服务，可以同时从多个平台访问。部署和基础设施需求与
    IoT 平台独立处理。


    图 4.12 中定义的组件是满足从不同用例中提取的需求所需的组件集，同时实现了智能标签的创建和生命周期管理。根据所选的集成策略，某些组件在特定 IoT 平台上的实现和部署可能会不同。


    **表 4.2.** TagItSmart API 示例


    | **OPERATION** || **API** || **DESCRIPTION** |


    | --- | --- | --- |


