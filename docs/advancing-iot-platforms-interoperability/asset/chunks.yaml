    # 1 执行摘要


    物联网欧洲平台倡议 (IoT-EPI) 项目正在解决物联网以及联网智能对象平台的主题，旨在提供一种扩展到联网设备和对象平台网络中的物联网，该网络支持具有动态自适应配置能力的智能环境、业务、服务和人员。研究活动的重点关注领域是架构和语义互操作性，这些领域可靠地涵盖了多个用例。目标是为联网智能对象提供动态配置的基础设施和集成平台，涵盖多种技术和多种智能制品。IoT-EPI
    生态系统的创建旨在增加物联网相关欧洲研究和创新的影响，包括七个关于物联网平台的欧洲前景项目：`AGILE`、`BIG IoT`、`INTER-IoT`、`VICINITY`、`SymbIoTe`、`bIoTope`
    和 `TagItSmart`。


    本白皮书提供了关于 IoT-EPI 创建和使用的物联网平台及生态系统中互操作性的见解。本文档的范围涵盖了处理现有物联网平台互操作性的方面、挑战和方法，并对该背景下互操作性的未来提供了一些见解。它提出了可能的解决方案以及一种可能的物联网互操作性平台架构。


    由于互操作性在物联网系统中具有关键且重要的作用，它与物联网中的许多相关主题和方面密切相关：性能、兼容性、集成、投资率 (ROI)、市场认可、开发设计。


    本白皮书的编写和开发利用了 IoT-EPI 框架内其他活动的成果和可用信息。特别是，补充作者的重要信息来源是 IoT-EPI 报告。


    关于这项工作，本白皮书旨在成为物联网平台互操作性的有用信息来源。物联网系统中的这一关键方面对每个 IoT-EPI 主题（创新、平台互操作性、社区建设、业务模式、教育平台、国际合作）具有相关性和影响。


    # 2 物联网平台格局


    ## 2.1. 定义


    物联网平台可以定义为一个智能层，它将事物连接到网络，并将应用程序从事物中抽象出来，旨在实现服务的开发。物联网平台实现了几个主要目标，例如灵活性（能够在不同上下文中部署事物）、易用性（能够使用用户体验简单）和生产力（通过创建服务来提高效率，同时也实现新服务的开发）。物联网平台促进通信、数据流、设备管理和应用程序的功能。目标是在物联网平台框架内构建物联网应用。


