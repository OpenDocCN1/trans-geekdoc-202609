    the different IoT standard compliant systems (through Wrappers or not) are aware
    of each other’s existence and the different data and services that they provide
    to each other[^(14)](#08_Chapter04.xhtml#fn4_14). When a new system needs to “join”
    a bIoTope compliant ecosystem, e.g. a car that arrives into a new city and needs
    to discover available services, bIoTope will provide discovery mechanisms for
    discovering relevant O-MI nodes. Certain nodes will implement the bIoTope loTBnB
    API, which is a marketplace for IoT compliant services.


    ![Figure 4.5. bIoTope ecosystem illustration.](images/fig4_5.jpg)


    **Figure 4.5.** bIoTope ecosystem illustration.


    [Figure 4.6](#08_Chapter04.xhtml#fig4_6) illustrates how different platforms,
    systems and services can publish the desired data and services using IoT standards.
    The Open Data Format (O-DF) provides means for annotating “any” IoT data or service
    using existing or new vocabularies, such as schema.org, SSN, GML, etc., as shown
    in [Figure 4.4](#08_Chapter04.xhtml#fig4_4). It is even possible to use several
    different vocabularies within one O-DF structure (including proprietary ones)
    by linked data principles.


    ![Figure 4.6. bIoTope architecture illustration.](images/fig4_6.jpg)


    **Figure 4.6.** bIoTope architecture illustration.


    The bIoTope architecture is heavily influenced by a Micro-Services Architecture
    (MSA) thinking, where different “small” standards can be used jointly in the best
    way depending on application requirements. MSA is a generic way of implementing
    pattern ***V) “Higher-level Service Facades”*** in [Figure 3.2](#07_Chapter03.xhtml#fig3_2).
    Support for MSA is a fundamental design principle of O-MI and O-DF in the sense
    that services of “any” size can be published and consumed, no matter if it is
    a simple request for a current sensor value or a request for available parking
    places in proximity of a car’s current location.


    Such an MSA approach provides several advantages regarding system flexibility
    and lean software principles because new IoT standards-compliant services can
    be composed from smaller, existing services. It also provides a risk management
    advantages in the current competitive IoT standardization landscape because different
    standard-compliant software components and wrappers can be adapted to support
    new or “winning” standards without impacting the whole system architecture.


    Whilst bIoTope should be understood as a highly flexible and dynamic ecosystem
    capable of seamlessly integrating arbitrary proprietary IoT platforms, it nevertheless
    builds upon a number of several core components presented in the top layer of
    [Figure 4.6](#08_Chapter04.xhtml#fig4_6), which provide essential functionality.
    The basic viewpoint coordinates of from the architectural framework is presented
    in [Figure 4.7](#08_Chapter04.xhtml#fig4_7). This figure adopts the conventions
    established, for example, by NIST[^(15)](#08_Chapter04.xhtml#fn4_15) or IoT-A[^(16)](#08_Chapter04.xhtml#fn4_16)
    with regards to the meanings of the cardinal directions North-South-East-West
    and set interaction patterns to human (north / west) and machines (south / east).


    ![Figure 4.7. bIoTope concept illustration.](images/fig4_7.jpg)


    **Figure 4.7.** bIoTope concept illustration.


    Nevertheless, the presented Services (XaaS) can be seen basically as chained micro
    services or functional blocks. Composed functional blocks result in a specific
    services, which as well can be part of an aggregation of several services. [Figure
    4.8](#08_Chapter04.xhtml#fig4_8) introduces a functional view onto those micro
    services, labelled as functional blocks. Basis for all functional blocks inside
    the ecosystem is the compliance to O-MI and O-DF. This compliance brings automatically
    the fundamental services for “publication” and “consumption” and their inherited
    sub-functions. For the interconnection of various services appearing in the ecosystem,
    the “marketplace / service catalogue” sets a cornerstone to interact as an intermediator
    between services. One possible instance of this services is represented by the
    IoTBnB[^(17)](#08_Chapter04.xhtml#fn4_17) implementation. This specific implementation
    is as well supported by the Security & Privacy service that handles unauthorized
    actions. Inside of the ecosystem are other services (Visualization, Context Provisioning,
    Service Composition and RDF Integration & Semantics) that help to realize the
    stated core components / services on the top layer of [Figure 4.6](#08_Chapter04.xhtml#fig4_6).


    ![Figure 4.8. bIoTope reference architecture.](images/fig4_8.jpg)


    **Figure 4.8.** bIoTope reference architecture.


    Used approach to semantic interoperability: Arbitrary Information Model + Domain-Specific
    Models


    ## 4.5.   INTER-IoT


    ### 4.5.1.   Uniqueness and special features of the approach


    INTER-IoT offers a layer-oriented solution for enabling seamless IoT platforms’
    interoperability. With this solution, different platforms can be interconnected
    and transparently interoperate among them at any specific layer or level (Device,
    Network, Middleware, Application and Data and Semantics). INTER-IoT is the first
    approach in providing universal semantic translation among platforms. It also
    provides a methodology (INTER-METH) for guiding and easing the implementation.
    INTER-IoT open framework (INTER-FW) offers a set of tools for interoperability
    at each specific layer which can be accessed through an API. Furthermore, INTER-IoT
    offers a virtualized version of each layer solution to facilitate a quick implementation
    with Docker.


    ![Figure 4.9. INTER-IoT layered architecture](images/fig4_9.jpg)


    **Figure 4.9.** INTER-IoT layered architecture


    INTER-IoT solution can be applied to any application domain and across domains
    in which there is a need for interconnection and/or interoperability. INTER-IoT
    will facilitate the formation of interoperable IoT ecosystems, make the design
    of IoT devices, smart objects or services easier to companies and developers,
    and support launching them to the market quickly to a broader client base. In
    the long term, the ability for applications to connect to and interact with heterogeneous
    smart objects will become a huge enabler for new products and services.


    ### 4.5.2.   INTER-IoT Architecture


    INTER-IoT presents a novel layer-oriented solution for interoperability, to provide
    interoperability at any layer and across layers among different IoT systems and
    platforms. Contrary to a more general global approach, the INTER-IoT layered approach
    has a higher potential in order to provide interoperability. It facilitates a
    tight bidirectional integration, higher performance, complete modularity, high
    adaptability and flexibility, and presents increased reliability.'
