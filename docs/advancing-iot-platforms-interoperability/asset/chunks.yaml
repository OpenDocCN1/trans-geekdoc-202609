    ## 4.4.   bIoTope


    A primary goal of bIoTope is to enable companies to easily create new IoT systems
    and rapidly harness available information using advanced Systems-of-Systems (SoS)
    capabilities for Connected Smart Objects. This SoS approach signifies that all
    five patterns of interoperability in [Figure 3.2](#07_Chapter03.xhtml#fig3_2)
    are implemented through open standards that can be combined and used together
    in different ways. The SoS approach taken by bIoTope differs from most other proposed
    architectures for IoT systems in the sense that there is no layered architecture
    regarding the physical size or computational capabilities of the communicating
    systems. With this SoS approach, patterns I-III in [Figure 3.2](#07_Chapter03.xhtml#fig3_2)
    are basic requirements that are implemented by default. Any system that implements
    the necessary IoT standards can communicate directly with any other system that
    implements and understands the same standards, as illustrated in [Figure 4.3](#08_Chapter04.xhtml#fig4_3).
    This capability implements pattern ***IV) “Platform-Scale Independence”*** in
    [Figure 3.2](#07_Chapter03.xhtml#fig3_2).


    Systems that do not natively support the necessary IoT standards can join by what
    we call Wrappers in bIoTope, i.e. software components that expose the services
    that should be published to the IoT level using the appropriate standards (this
    corresponds to pattern ***V) “Higher-level Service Facades***” in [Figure 3.2](#07_Chapter03.xhtml#fig3_2)).
    This also signifies ensuring that data and services that are not public remain
    non-accessible to unauthorized parties.


    ![Figure 4.3. bIoTope Systems of Systems type cross-connected (non-layered) connectivity.](images/fig4_3.jpg)


    **Figure 4.3.** bIoTope Systems of Systems type cross-connected (non-layered)
    connectivity.


    In bIoTope, “IoT standard” signifies a limited set of appropriate standards around
    the “waist” of the standards landscape as illustrated in [Figure 4.4](#08_Chapter04.xhtml#fig4_4).
    If the IoT is expected to become a similar success story as the World Wide Web
    (WWW), it will need a similar foundation with a set of simple, well-defined, generic
    and powerful standards. The WWW started with HTTP and HTML as the initial core
    standards. Over time supplementary functionality has been introduced by other
    standards that augment the capabilities of WWW applications but the fundamental
    building blocks and principles are still the same.


    ![Figure 4.4. Illustration of bIoTope standards landscape.](images/fig4_4.jpg)


    **Figure 4.4.** Illustration of bIoTope standards landscape.


    The core IoT standards used in bIoTope are shown in bold. The other standards
    are used depending on the domain and requirements of different applications. When
    other standards (or proprietary protocols and formats) than the core IoT standards
    are used, bIoTope uses a Wrapper (i.e., a ***Service Facade***) for making them
    compliant with the core IoT standards.


    bIoTope takes full advantage of messaging standards developed and officially published
    by The Open Group, notably the Open Messaging Interface (O-MI) and Open Data Format
    (O-DF) standards[^(13)](#08_Chapter04.xhtml#fn4_13) \[[22](#10_References.xhtml#ref_22)\]
    \[[23](#10_References.xhtml#ref_23)\]. Those standards emerged out of past EU
    FP6-FP7 projects, where real-life industrial applications required the collection
    and management of product instance-level information for many domains involving
    heavy and personal vehicles, household equipment, etc. Based on the needs of those
    real-life applications, and as no existing standards could be identified that
    would fulfil those requirements without extensive modification or extensions,
    the partner consortia started the specification of new IoT interoperability standards.
    O-MI mainly provides Technical Interoperability in the stack of [Figure 2.1](#06_Chapter02.xhtml#fig2_1)
    with the necessary functionality needed for implementing generic IoT systems that
    is not provided by protocols such HTTP. O-MI can be used for implementing RESTful
    IoT information systems, also using other underlying protocols than HTTP as illustrated
    in [Figure 4.5](#08_Chapter04.xhtml#fig4_5).'
