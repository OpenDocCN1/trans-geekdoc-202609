    The central pillar of the ecosystem is the Marketplace. Here, a `Provider` (e.g.,
    an IoT platform) registers its resources by uploading an offering description
    (Section 3.2). To facilitate a provider in conforming with the BIG IoT API for
    offering its resources in the ecosystem, the `Provider Library (Lib)` can be utilized.
    It can be used to establish a gateway to the actual resources and implements the
    BIG IoT API and the various interactions and workflows (Section 3.4). The library
    authenticates the provider with the Marketplace and registers its offerings. It
    also offers a Web API to grant access to the resources.


    Beyond these mechanisms for providing access to IoT platforms, the Marketplace
    enriches the ecosystem with the possibility of monetizing the consumption of resources.
    Therefore, both sides, the consumer and provider, report accounting data (e.g.
    number of resource records obtained/provided) back to the Marketplace. This is
    the basis for charging and billing, and the foundation for business opportunities
    around the ecosystem.


    The above described IoT ecosystem is platform-scale independent. I.e., IoT platforms
    can operate either on cloud-level (e.g., server, data centre), on fog-level (e.g.,
    gateway, cellular communication base station), or on device-level (e.g., Raspberry
    PI, smartphone). In the last case, the IoT platform can represent an IoT ‘thing’.
    The BIG IoT API can be used independent of this scale of the platform.


    ### 4.3.4. Uniqueness and specific features of the approach


    The BIG IoT approach comprises the following objectives: First, it openly defines
    the so-called BIG IoT API, a generic, Web-based application programming interface
    (API) for the adoption by smart object platforms.


    Second, at the core of BIG IoT ecosystem stands an open marketplace. Once the
    BIG IoT API provides the building blocks for a syntactically and semantically
    interoperable IoT and inter-platform connectivity and exchange is enabled, the
    marketplace lays the foundation for an ecosystem of platforms and services offerings.
    The marketplace enables the advertisement, quality control, and monetization of
    applications and services developed on top of the BIG IoT API. A marketplace can
    be setup for specific domains, e.g., by stakeholders for the industry or energy
    domain, or by Smart Cities for the mobility or building domain.


    Third, BIG IoT supports the development of applications and services by providing
    a dedicated software infrastructure. In addition, it provides functionality to
    discover and orchestrate services. This functionality is based on semantic service
    descriptions and an automated service chaining will be enabled through semantic
    reasoners. These functionalities facilitate the reusing of existing services.


    Fourth, BIG IoT project engages with current standardization initiatives to receive
    input and further on, we will contribute to those standardization activities with
    the results elaborated in the project.


    Finally, the core technologies related to BIG IoT API and Marketplace will be
    available as open source under Eclipse. The BIG IoT proposal has been approved
    and the Eclipse Bridge.IoT project has been created ([https://projects.eclipse.org/proposals/eclipse-bridge.iot](https://projects.eclipse.org/proposals/eclipse-bridge.iot))


    Used approach to semantic interoperability: Arbitrary Information Model and Domain-Specific
    Models


    ### 4.4. bIoTope


    A primary goal of `bIoTope` is to enable companies to easily create new IoT systems
    and rapidly harness available Systems-of-Systems (SoS) capabilities. This SoS
    approach signifies that all five patterns of interoperability in `Figure 3.2`
    (07_Chapter03.xhtml#fig3_2) are implemented. The approach taken by `bIoTope` differs
    from most other architectures in the sense that there is no layered architecture
    regarding the physical size or computational capabilities. With this SoS approach,
    patterns I-III in `Figure 3.2` (07_Chapter03.xhtml#fig3_2) are basic requirements
    that are implemented by default. Any system that implements the necessary IoT
    standards can communicate directly with any other system as illustrated in `Figure
    4.3` (08_Chapter04.xhtml#fig4_3). This capability implements pattern `IV) Platform-Scale
    Independence` in `Figure 3.2` (07_Chapter03.xhtml#fig3_2).


    Systems that do not natively support the IoT standards can join by what we call
    `Wrappers` in `bIoTope`, i.e., software components that expose the services that
    should be public (this corresponds to pattern `V) Higher-level Service Facades`
    in `Figure 3.2` (07_Chapter03.xhtml#fig3_2)). This also signifies ensuring that
    data and services remain non-accessible to unauthorized parties.


    ```

    Figure 4.3. bIoTope Systems of Systems type-connected (non-layered) connectivity.

    ```


    In `bIoTope`, “IoT standard” signifies a limited set of appropriate standards
    around the “waist” of the standards landscape as illustrated in `Figure 4.4` (08_Chapter04.xhtml#fig4_4).
    If the IoT is expected to become a similar success story as the World Wide Web
    (WWW), it will need a similar foundation with a set of simple, well-defined, generic
    and powerful standards. The WWW started with `HTTP` and `HTML` as the initial
    core standards. Over time supplementary functionality has been introduced by other
    standards that augment the capabilities of WWW applications but the fundamental
    blocks are still the same.


    ```

    Figure 4.4. Illustration of bIoTope standards landscape.

    ```


    The core standards used in `bIoTope` are shown in bold. The other standards are
    used depending on the domain and requirements of different applications. When
    other standards (or proprietary protocols and formats) than the core IoT standards
    are used, `bIoTope` uses a `Wrapper` (i.e., a `Service Facade`) for making them
    compliant with the core IoT standards.


    `bIoTope` takes full advantage of messaging standards developed and officially
    published by `The Open Group`, notably the `Open Messaging Interface (O-MI)` and
    `Open Data Format (O-DF)` standards. Those standards emerged out of past EU FP6-FP7
    projects, where real-life industrial applications required the collection and
    management of product instance-level information for many domains involving heavy
    and personal vehicles, household equipment, etc. Based on the needs of those real-life
    applications, and as no existing standards could be identified that would fulfil
    those requirements without extensive modification or extensions, the partner consortia
    started the specification of new IoT interoperability standards. `O-MI` mainly
    provides Technical Interoperability in the stack of `Figure 2.1` (06_Chapter02.xhtml#fig2_1)
    with the necessary functionality needed for implementing generic IoT systems that
    is not provided by protocols such `HTTP`. `O-MI` can be used for implementing
    RESTful IoT information systems, also using other underlying protocols than `HTTP`
    as illustrated in `Figure 4.5` (08_Chapter04.xhtml#fig4_5).

    '
