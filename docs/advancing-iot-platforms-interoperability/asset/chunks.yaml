    and minimalistic as possible and at the same time as specific as needed to create
    a minimal mutual understanding. This way, the CIM enables limited out-of-the-box
    interoperability between all platforms. To actually register resources with symbIoTe,
    platforms use ***Platform-Specific Information Models*** (PIMs) that are extensions
    of the CIM including platform-specific terms. As each PIM is an extension of the
    CIM, basic interoperability is ensured, even between platforms using different
    PIMs. Such flexibility goes beyond the state of the art and is expected to lead
    to a high acceptance by platform owners, especially SMEs, as the process of adapting
