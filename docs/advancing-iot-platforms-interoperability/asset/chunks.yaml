    # 7 Annex


    The following section captures the different platforms the IoT-EPI projects are
    utilizing. The purpose is to present the current state of play and to get a view
    of the seven emerging ecosystems. The analysis briefly introduces the IoT platform
    name, whether the platform is commercial or not and provides a brief description
    of its main purpose.


    ## AGILE


    | IoT platform | Nature of platform | Brief description |

    | :--- | :--- | :--- |

    | `Resin.io` | Commercial | Device management platform for Linux based devices.
    It makes it simple to deploy, update, and maintain code running on remote devices.
    |

    | `Eclipse IoT` | Open source | Eclipse IoT provides the technology needed to
    build IoT Devices, Gateways, and Cloud Platforms. It also provides open source
    implementations for IoT standards such as `MQTT`, `CoAP`, `LWM2M`, `OneM2M`, `OPC-UA`
    and more. |

    | `NodeRED` | Open source | Tool for wiring together hardware devices, APIs and
    online services in new and interesting way. IoT service enablement platform developed
    by IBM.


    ## BIG IoT


    | IoT platform | Nature of platform | Brief description |

    | :--- | :--- | :--- |

    | `Smart Data Platform` | Open source | CSI Piemonte’s Smart Data Platform (`SDP`)
    is a self-service platform enabling application development based on Internet
    of Things and Big Data. SDP is based on project `Yucca` which allows for interconnecting
    applications, social networks, systems and distributed objects and collecting
    data and information, by processing and analysing them to develop end-to-end |

    | `Smart City Platform` | Commercial, Bosch | Considering solutions for Smart
    Cities, the requirements differ from those known for classical enterprise applications.
    In fact, Smart City installations are composed of many different solutions individually
    customized for the city, but with a common need w.r.t. operation, data sharing
    and security. The Smart City platform (`SCP`) targets to connect the silos in
    the Smart City, i.e., governance, mobility, energy, environment, industry life,
    tourism, etc. Bosch SCP offers tools and methods to develop, operate and maintain
    such systems without sacrificing data security and privacy. |

