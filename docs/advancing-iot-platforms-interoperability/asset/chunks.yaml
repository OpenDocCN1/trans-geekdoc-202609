  trans: '


    # Wubby Platform


    | IoT 平台 | 平台性质 | 简述 |

    | :--- | :--- | :--- |

    | Wubby Platform | 商业性, Econais | Wubby 是一个用于快速开发日常物品的软件组件和服务生态系统[28]。日常物品是嵌入电子设备、软件、传感器和网络连接的实体，用于收集和交换数据。
    |

    | OpenIoT Platform | 开源 | OpenIoT 是一种传感器中间件平台，能够简化从异构传感器收集数据的过程，同时确保其语义注释[29]。它实现了云端的语义互操作性并提供了
    IoT 应用开发工具。 |

    | Traffic Information Centre Platform | 商业性, VMZ | 由 VMZ 提供的 TIC 移动平台是一个数据和服务平台，旨在为柏林所有可用出行方案提供全面信息[30]。该平台包含来自交通信息中心、移动运营方和基础设施提供者的实时数据，并使用第三方提供的模态路由器提供多模式路由平台。
    |

    | Bitcarrier/Sensefield/FastPrk | 商业性, World Sensing | Worldsensing 为智能城市提供了独特的交通管理组合，其中包括
    Bitcarrier，这是一种专为道路和城市环境设计的实时智能交通管理和信息解决方案[31]。Fastprk 提供了一种智能停车系统，Sensefields
    提供了一套用于检测和监控车辆及交通流的创新系统。 |

    | BEZIRK Platform | 开源 | 博世的 Bezirk 平台是一个点对点的 IoT 中间件，遵循面向服务的范式，在本地设备上进行通信和服务执行。Bezirk
    的开发目标是便于应用程序中不同组件之间针对网络中不同设备分布的异步交互。 |


    # BioTope


    | IoT 平台 | 平台性质 | 简述 |

    | :--- | :--- | :--- |

    | O-MI/O-DF Reference Implementation | 开源 | 针对 IoT `O-MI` 和 `O-DF` 标准的实现，便于设置基于标准的
    IoT 节点实例。主要用于“沙箱”安装，但也可以扩展到“工业级”用途。 |

    | DIALOG | 开源 | 最初由 Aalto 在 2001 年开发的 IoT 中间件，已在许多研究项目以及工业试点中得到进一步开发和使用。 |

    | NodeRED | 开源 | 一种以新颖方式将硬件设备、API 和在线服务连接在一起的工具。由 IBM 开发的可视 IoT 服务启用平台。 |

    | Warp 10 | 开源 | 用于 IoT 数据存储、管理和分析的平台，特别是针对地理时间序列（Geo Time Series）。 |

    | FIWARE | 开源 | FIWARE 是一个用于未来互联网应用开发和全球部署的中间件平台。它是欧盟对涉及网络供应商和运营商的大规模研究计划投入的结果。
    |

    | Open IoT | 开源 | OpenIoT 是一种传感器中间件平台，能够简化从异构传感器收集数据的过程，同时确保其语义注释。它实现了云端的语义互操作性并提供了
    IoT 应用开发工具。 |

    | Mist | 源 | 用于 ControlThings 分布式安全 IoT 部署的软件栈。 |

    | eAir web | 源 | 用于远程使用和管理 Enervent 空调单元的云服务。 |

    | 其他 | 开源/闭源 | 许多平台，例如 BMW 的平台、赫尔辛基的几个智能停车平台、OpenDataSoft 的平台。估计目前或未来使用了超过 10
    个不同的平台。 |


    # INTER-IoT


    | IoT 平台 | 平台性质 | 简述 |

    | :--- | :--- | :--- |

    | SEAMS |  项目 | 智能、节能和自适应管理平台 (SEAMS) 是在欧洲项目 SEA TERMINALS 框架内，于 Noatum 瓦伦西亚集装箱终端开发并实施的一种先进原型监控工具。SEAMS
    平台原型能够监控港口集装箱终端正在使用的机器和设备。 |

    | I3WSN | 学术平台 | 用于室内环境的工业级智能无线传感器网络，由瓦伦西亚理工大学开发的平台。 |

    | Unical BodyCloud | 开源 | BodyCloud 是一个将体体传感器网络（BSNs）与云平台即服务（PaaS）基础设施集成的开放平台，目前基于
    Google App Engine。 |

    | NodeRED | 开源 | 一种以新颖方式将硬件设备、API 和在线服务连接在一起的工具。我们将在 AS2AS 互操作框架中使用它。 |

    | OpenIoT | 开源 | OpenIoT 是一种传感器中间件平台，能够简化从异构传感器收集数据的过程，同时确保其语义注释。它实现了云端的语义互操作性并提供了
    IoT 应用开发工具。 |

    | FIWARE | 开源 | FIWARE 是一个用于未来互联网应用开发和全球部署的中间件平台。它是欧盟对涉及网络供应商和运营商的大规模研究计划投入的结果。
    |

    | UniversAAL | 开源 | UniversAAL 是在 FP7 项目框架下开发的 IoT 平台，目前应用于不同的 AAL、电子健康和 AHA 环境中。
    |

    | Eclipse OM2M | 开源 | 由 LAAS-CNRS 发起的 Eclipse OM2M 项目是 oneM2M 和 SmartM2M 标准的开源实现。
    |

    | WSO2 | 开源 ASL2.0 | WSO2 IoT Server 使设备制造商和企业能够连接并管理设备、构建应用、管理事件、确保设备和数据安全，并以可扩展的方式可视化传感器数据。
    |

    | Microsoft Azure IoT Suite | 微软专用 | Microsoft Azure 是一个功能全云平台，具有特定的 IoT 组件，支持设备连接到云端、分析、存储和可视化捕获的数据。Microsoft
    Azure Suite 为 IoT 部署提供了易于配置的后端。它是领域无关的，不提供数据模型。它可以与高级数据分析、机器学习和其他组件相结合。 |

    | Amazon AWS IoT | 亚马逊专用 | AWS 专为 IoT 系统设计的模块[32]。它通过易用的管理界面和控制连接状态的 REST API
    实现了直接访问 Amazon 云。一旦数据发送到 AWS IoT，就可以利用巨大的 AWS 云解决方案生态系统。该平台完全领域无关并提供了强大的安全保护。
    |


    # TagItSmart


    | IoT 平台 | 平台性质 | 简述 |

    | :--- | :--- | :--- |

    | SocIoTal | 开源 | 具有隐私感知数据共享的社区 IoT 平台。由 FP7 SOCIATAL 项目开发。 |

    | FIWARE | 开源 | FIWARE 是一个用于未来互联网应用开发和全球部署的中间件平台。它是欧盟对涉及网络供应商和运营商的大规模研究计划投入的结果。
    |

    | EVRYTHNG | 商业 | IoT 智能产品平台。该平台收集、管理和应用来自智能产品和智能包装的实时数据，以驱动 IoT 应用。 |

    | RunMyProcess | 商业 | 构建具有强大业务流程集成的设备无关连接应用程序；在全球范围内部署系统；运行安全、可靠且可扩展的操作。数千个预置连接器，可以快速将启用
    IoT 的设备、云服务和社交媒体与本地企业应用及系统集成。 |


