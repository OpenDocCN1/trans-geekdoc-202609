    in the context simulation theory it has a much broader applicability. It defines
    six levels of interoperability: technical, syntactic, semantic, pragmatic, dynamic
    and conceptual interoperability.


    The European Interoperability Framework designed “to support the delivery of pan-European
    eGovernment services to citizens and enterprises” \[[8](#10_References.xhtml#ref_8)\]
