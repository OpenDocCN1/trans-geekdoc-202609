    ![Figure 4.16. Semantic interoperability approach for Access](images/fig4_16.jpg)


    **Figure 4.16.** Semantic interoperability approach for Access


    *   •  The VICINITY ontology[^(19)](#08_Chapter04.xhtml#fn4_19) as the common
    and abstract information model to be used;


    *   •  The Semantic agent platform as the semantic repository. The W3C Web of
    Things Thing Description (TD) is the framework to be used for describing any IoT
    object integrated in VICINITY;


    *   •  Gateway Adapter APIs are the semantic mediators between the actual consumers,
    e.g., Adapters, and the repository of Thing Descriptions (TDs). Therefore, they
    provide an interface for discovery requests;


    *   •  Gateway Adapter APIs must be able to specify discovery needs as semantic-based
    search criteria (SPARQL query).


    The first goal of semantic interoperability in VICINITY is to securely discover
    IoT objects. A discovery search initiated on a VICINITY Node through the Gateway
    API is performed in the Thing Description repository and constrained by the current
    setup virtual neighbourhood in the Neighbourhood Manager (discovered IoT objects
    are filtered by access rules defined on the virtual neighbourhood manager).


    The second goal of semantic interoperability in VICINITY is to enable accessing
    to heterogeneous IoT objects in such a way that any of their interaction resources
    can be effectively ***consumed*** after they were discovered. Based on the result
    of the discovery process, IoT objects are accessed directly in the P2P network
    or through the Communication server services sending consumption request messages.


    The Gateway API processes response messages separately and applies the corresponding
    access mappings specified in the previously given Virtual TED. For each response
    and after the data ***lifting*** process is completed, the Gateway API extracts
    the property value by querying the just lifted semantic data. Finally, the Gateway
    API returns each result obtained and represented in the common VICINITY format.


    Used approach to semantic interoperability: Core Information Model with Extensions.


    # 5 Advancing IoT platforms interoperability


    The IoT-EPI efforts towards providing a framework for IoT platforms interoperability
    have already provided new advanced IoT platforms interoperability mechanisms and
    approaches. In this context, several interoperability gaps have been identified,
    that require further investigation and future research efforts.


    Internet of Things (IoT) environments are rather complex with heterogeneous physical
    devices supporting various communication protocols, while they are possibly connected
    to an intermediary gateway and then to their virtual representations (i.e. services)
    running on different platforms. Thus, it is possible to interact with a single
    IoT device in many ways using its varied interfaces and representations.


    IoT platforms require interoperability on multiple levels, which means finding
    the characteristic functionalities of each layer and defining meta-protocols that
    can be mapped on the ones used in the platforms (i.e. on the level of syntactic
    interoperability, the characteristic functionality is resource access). Resource
    access is realised through different protocols, for example O-MI, REST-based with
    JavaScript Online Notation (JSON) based on the W3C Web of Things (WoT) Description,
    OData-like and so on. While the functionality the protocols provide is basically
    the same (e.g. get/set/update/subscribe to a resource identified by some kind
    of identifier), the resource discovery functionality must be addressed across
    protocols.


    Research on a layer-oriented approach is required to address providing tighter
    interoperability at all layers of IoT systems (device, network, middleware, application,
    data and semantics) with a strong focus on guaranteeing trust, privacy and security
    aspects within this interoperability. This interoperability approach also provides
    modules covering quality of service (QoS) and device management, service integration,
    external system services, storage and virtualisation.


    Regarding semantic interoperability, current work focuses on defining and standardizing
    common vocabularies in given domains (e.g. [http://iot.schema.org](http://iot.schema.org)).
    Interesting direction is also the effort towards domain-agnostic aspects of any
    IoT object, following the WoT approach (with interaction patterns, links and security).
    However, standardization of models is not always a viable option. Therefore, research
    should also focus on techniques that enable semantic interoperability even if
    different information models are used like semantic mapping.


    Layered approaches for interoperability allow the stakeholders or platform operators
    to select the best mechanism for interoperation. Management of such options provides
    coordination between layers, enhances cooperative solutions (e.g. gateways and
    network) and enables security management.


    With regard to gateway interoperability, the inclusion of a programmable network
    layer based on software-defined networking (SDN)/network functions virtualisation
    (NFV) is critical for merging IoT and 5G and following the existing architectures.
    Using a programmable network has two advantages: management of mobility and management
    of QoS for massive IoT management.'
