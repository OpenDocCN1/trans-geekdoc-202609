    | Method | Endpoint | Description |

    | :--- | :--- | :--- |

    | SmartTag activation | `POST/product/set-smart-tag-date` | This method is used
    to activate the SmartTag to be enable it use in the system. |

    | SmartTag scan | `POST/product/product-context` | This method is used to POST
    the location where the product was scanned and returns all related context for
    the product including reviews and sensor states. |

    | SmartTag recycle | `POST /recycl3r/api/v1/recycling_info` | This method is used
    to get information about sorting and location for product recycling. |


    As stated above, `TagltSmart` components define a common set of API methods to
    guarantee interoperability and seamless integration, as well as enabling creation
    of the third-party applications on top of its components ([Table 4.1](#08_Chapter04.xhtml#tab4_1)).


    ## 4.8 VICINITY


    The VICINITY project is built around the concept of connecting different IoT ecosystems
    through the VICINITY platform (interoperability as a service), which enables to
    interact with IoT objects from other different ecosystems as if they were their
    own. The interoperability services create an environment where value-added services
    can be deployed and processes make available cross-domain information.


    ![Figure 4.13. VICINITY Concept](images/fig4_13.jpg)


    **Figure 4.13.** VICINITY Concept


    ![Figure 4.14. VICINITY Semantic interoperability approach](images/fig4_14.jpg)


    **Figure 4.14.** VICINITY Semantic interoperability approach


    In the presented figure, two separate ecosystems are presented: intelligent building
    and energy ecosystem. Each of these ecosystems is integrated into VICINITY by
    its `VICINITY Adapter` through the `VICINITY Gateway`. Based on the setup of virtual
    neighbourhoods in the VICINITY Neighbourhood manager, `VICINITY Adapters` may
    access remote IoT objects based on semantic interoperability, for example a battery
    in an Energy ecosystem, and use them as a part of their ecosystem. Moreover, IoT
    objects shared by the `VICINITY Adapter` within a virtual neighbourhood may be
    accessed by value-added services to provide cross-domain services using a common
    VICINITY ontology.


    ![Figure 4.15. Semantic interoperability approach for Discovery](images/fig4_15.jpg)


    **Figure 4.15.** Semantic interoperability approach for Discovery


    One of the main challenges of implementing interoperability in the IoT context
    is to enable consumers to discover, in a distributed and dynamic scenario, those
    IoT objects that are relevant to their needs but without having any prior knowledge
    about them. The VICINITY cross-domain interoperability relies on:


    ![Figure 4.16. Semantic interoperability approach for Access](images/fig4_16.jpg)


    **Figure 4.16.** Semantic interoperability approach for Access


    *   The `VICINITY ontology`[^(19)](#08_Chapter04.xhtml#fn4_19) as the common and
    abstract information model to be used;

    *   The Semantic agent platform as the semantic repository. The W3C Web of Things
    Thing Description (`TD`) is the framework to be used for describing any IoT object
    integrated in VICINITY;

    *   `Gateway Adapter APIs` are the semantic mediators between the actual consumers,
    e.g., `Adapters`, and the repository.

