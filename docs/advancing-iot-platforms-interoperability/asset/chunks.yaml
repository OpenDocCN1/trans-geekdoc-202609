    # 1 Executive summary


    The IoT European Platforms Initiative (IoT-EPI) projects are addressing the topic
    of Internet of Things and Platforms for Connected Smart Objects and aim to deliver
    an IoT extended into a web of platforms for connected devices and objects that
    supports smart environments, businesses, services and persons with dynamic and
    adaptive configuration capabilities. The specific areas of focus of the research
    activities are architectures and semantic interoperability, which reliably cover
    multiple use cases. The goal is to deliver dynamically-configured infrastructure
    and integration platforms for connected smart objects covering multiple technologies
    and multiple intelligent artefacts. The IoT-EPI ecosystem has been created with
    the objective of increasing the impact of the IoT-related European research and
    innovation, including seven European promising projects on IoT platforms: `AGILE`,
    `BIG IoT`, `INTER-IoT`, `VICINITY`, `SymbIoTe`, `bIoTope`, and `TagItSmart`.


    This white paper provides an insight regarding interoperability in the IoT platforms
    and ecosystems created and used by IoT-EPI. The scope of this document covers
    the interoperability aspects, challenges and approaches that cope with interoperability
    in the current existing IoT platforms and presents some insights regarding the
    future of interoperability in this context. It presents possible solutions, and
    a possible IoT interoperability platform architecture.


    Due to the critical and important role of interoperability in IoT systems, it
    is strongly related with many relevant topics and aspects in IoT: performance,
    compatibility, integration, ROI, market acceptance, development design.


    The creation and development of this white paper has taken advantage from outcomes
    and available information from other activities in the framework of IoT-EPI. In
    particular, important sources of information that complement the authors are IoT-EPI
    reports.


    Regarding the output of this work, this white paper intends to be a useful source
    of information of interoperability in IoT platforms. This critical aspect in IoT
    systems has relevance and impact on the topics of each IoT-EPI (Innovation, Platform
    Interoperability, Community Building, Business Models, Educational Platforms,
    International Cooperation).


    # 2 IoT platforms landscape


    ## 2.1. Definitions


    An IoT platform can be defined as an intelligent layer that connects the things
    to the network and that abstracts applications from the things with the goal to
    enable the development of services. IoT platforms achieve several main objectives
    such as flexibility (being able to deploy things in different contexts), usability
    (being able to make the user experience easy) and productivity (enabling service
    creation in order to improve efficiency, but also enabling new service development).
    An IoT platform facilitates communication, data flow, device management, and the
    functionality of applications. The goal is to build IoT applications within an
    IoT platform framework.

