    a unified and secure way to advertise, find and consume IoT resources, but in
    each level, a different interoperability scenario is enabled offering various
    degrees of details about the involved resources.


    **Level 1** enables interactions between IoT applications and virtualized IoT
    resources (**both sensors and actuators**), i.e., applications can find and use
    resources across platforms through uniform interfaces. In addition, platforms
    can integrate symbIoTe components for flexible attribute-based access control.
    **Level 2** allows IoT platforms to collaborate closely by forming **federations**.
    Federations can be considered as a closed and distributed version of the Core
    Services, i.e., the platforms can advertise and barter resources only to the members
