    # Wubby Platform


    | IoT platform | Nature of platform | Brief description |

    | :--- | :--- | :--- |

    | Wubby Platform | Commercial, Econais | Wubby is an ecosystem of software components
    and services for rapid development of everyday objects [[28](#10_References.xhtml#ref_28)].
    Everyday objects are physical objects embedded with electronics, software, sensors
    and network connectivity to collect and exchange data. |

    | OpenIoT Platform | Open Source | OpenIoT is a sensor middleware platform that
    eases the collection of data from heterogeneous sensors, while ensuring their
    semantic annotations [[29](#10_References.xhtml#ref_29)]. It enables semantic
    interoperability in the cloud and provides IoT app development tools. |

    | Traffic Information Centre Platform | Commercial, VMZ | The TIC mobility platform
    provided by VMZ is a data and service platform that has been developed to provide
    comprehensive information on all mobility options available in Berlin [[30](#10_References.xhtml#ref_30)].
    The platform includes real-time data from the traffic information center, mobility
    operators and infrastructure providers and provides a multimodal routing platform
    using the modal router offered by third parties. |

    | Bitcarrier/Sensefield/FastPrk | Commercial, World Sensing | Worldsensing provides
    a unique traffic management portfolio for Smart Cities that includes Bitcarrier,
    a real-time intelligent traffic management and information solution designed for
    both road and urban environments [[31](#10_References.xhtml#ref_31)]. Fastprk
    provides an intelligent parking system and Sensefields provides an innovative
    system for detecting and monitoring vehicles and traffic flow. |

    | BEZIRK Platform | Open Source | Bosch’s Bezirk platform is a peer-to-peer IoT
    middleware for both communication and service execution on local devices following
    the service-oriented paradigm. Bezirk is developed with a view to facilitate asynchronous
    interactions between the different components of an application with respect to
    distribution across different devices in a network. |


    # BioTope


    | IoT platform | Nature of platform | Brief description |

    | :--- | :--- | :--- |

    | O-MI/O-DF Reference Implementation | Open source | Implementation of `O-MI`
    and `O-DF` standards for the IoT that makes it easy to set up standard-based IoT
    node instances. Mainly used for “sandbox” installations but can be scaled up for
    “industry-level” purposes. |

    | DIALOG | Open source | IoT Middleware originally developed by Aalto in 2001,
    which has been further developed and used in numerous research projects as well
    as industrial pilots. |

    | NodeRED | Open source | Tool for wiring together hardware devices, APIs and
    online services in new and interesting way. Visual IoT service enablement platform
    developed by IBM. |

    | Warp 10 | Open source | Platform for storage, management and analysis of IoT
    data, especially for Geo Time Series. |

    | FIWARE | Open source | FIWARE is a middleware platform for the development and
    global deployment of applications for Future Internet. It is an outcome of a large
    investment of the EU into large-scale research programme involving network vendors
    and operators. |

    | Open IoT | Open source | OpenIoT is a sensor middleware platform that eases
    the collection of data from heterogeneous sensors, while ensuring their semantic
    annotations. It enables semantic interoperability in the cloud and provides IoT
    app development tools. |

    | Mist | Closed-source | Software stack for distributed, secure IoT deployments
    of ControlThings. |

    | eAir web | Closed-source | Cloud service for remote use and management of Enervent
    Air Handling units. |

    | Other | Open/Closedsource | Numerous platforms such BMW’s platform, several
    Smart Parking platforms in Helsinki, OpenDataSoft’s platform. Estimated over 10
    different platforms used now or in the future. |


    # INTER-IoT


    | IoT platform | Nature of platform | Brief description |

    | :--- | :--- | :--- |

    | SEAMS | EU project | Smart, Energy-Efficient and Adaptive Management Platform
    (SEAMS) is a state-of the art prototype-monitoring tool developed and implemented
    within the framework of the European project SEA TERMINALS at Noatum Container
    Terminal Valencia. The SEAMS platform prototype is capable of monitoring the machines
    and equipment that are being used at a Port Container Terminal. |

    | I3WSN | Academic platform | Industrial Intelligent Wireless Sensor Networks
    for indoor environments, platform developed by Universitat Politécnica de Valencia
    |

    | Unical BodyCloud | Open source | BodyCloud is an open platform for the integration
    of BSNs with a Cloud Platform-as-a-Service (PaaS) infrastructure and it’s currently
    based on Google App Engine. |

    | NodeRED | Open source | Tool for wiring together hardware devices, APIs and
    online services in new and interesting way. We will use it in the AS2AS interoperability
    framework |

    | OpenIoT | Open source | OpenIoT is a sensor middleware platform that eases the
    collection of data from heterogeneous sensors, while ensuring their semantic annotations.
    It enables semantic interoperability in the cloud and provides IoT app development
    tools. |

    | FIWARE | Open source | FIWARE is a middleware platform for the development and
    global deployment of applications for Future Internet. It is an outcome of a large
    investment of the EU into large-scale research programme involving network vendors
    and operators. |

    | UniversAAL | Open Source | UniversAAL is an IoT platform developed in the framework
    of an FP7 project and applied currently in different AAL, eHealth and AHA environments.
    |

    | Eclipse OM2M | Open Source | The Eclipse OM2M project, initiated by LAAS-CNRS,
    is an open source implementation of oneM2M and SmartM2M standard. |

    | WSO2 | Open Source ASL2.0 | WSO2 IoT Server enables device manufacturers and
    enterprises to connect and manage their devices, build apps, manage events, secure
    devices and data, and visualize sensor data in a scalable manner. |

    | Microsoft Azure IoT Suite | Proprietary Microsoft | Microsoft Azure is a full
    cloud-based platform with IoT specific components to support connection of devices
    to the cloud, analyse, store and visualize captured data. Microsoft Azure Suite
    provides an easy to configure back-end for IoT deployments. It is domain agnostic
    and provides no models for data. It can be combined with advanced data analytics,
    machine learning and other components. |

    | Amazon AWS IoT | Proprietary Amazon | AWS module specially intended to IoT systems
    [[32](#10_References.xhtml#ref_32)]. It enables a straightforward access to Amazon
    Cloud thanks to an easy to use management interface and a REST API to control
    the status of the things connected. Once data is sent to the AWS IoT, then it
    can be used the huge ecosystem of AWS cloud solutions. This platform is completely
    domain agnostic and provides a strong security protection. |


