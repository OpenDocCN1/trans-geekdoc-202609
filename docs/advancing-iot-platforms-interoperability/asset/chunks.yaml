    # Microsoft Azure


    | Microsoft | Commercial | Full cloud-based platform with IoT specific components
    to support connection of devices to the cloud, analyse, store and visualize captured
    data. Can be combined with advanced data analytics, machine learning and other
    components. |


    ## symbioTe


    | IoT platform | Nature of platform | Brief description |

    | :--- | :--- | :--- |

    | `OpenIoT` | Open source | OpenIoT is a sensor middleware platform that eases
    the collection of data from heterogeneous sensors, while ensuring their semantic
    annotations. It enables semantic interoperability in the cloud and provides IoT
    app development tools. |

    | `Symphony` | Commercial, Nextworks | Networks platform for the integration of
    home and building control systems. Symphony can monitor, supervise and control
    many different building systems, devices, controllers and networks available from
    third-party suppliers. It is a service-oriented middleware, able to integrate
    several functional subsystems into a unified IP based platform. |

    | `Mobility Back-end as a Service (MoBaaS)` | Commercial, Ubiwhere | System integration
    platform to wrap around different city data sources. Application enablement environment
    geared towards smart city apps focusing on transport and mobility aspects of cities.
    |

    | `nAssist` | Commercial, Sensing and Control Systems S.L. | A software platform
    designed and conceived to allow agile, continuous management of data in the fields
    of energy efficiency, security and automation. Cloud-based communication software
    that enables clients to easily and intelligently connect machines and devices
    to the cloud and then process, transform, organize and store machine and sensor
    data. |

    | `Navigo Digitale IoT platform` | Commercial, Navigo | A vertical IoT platform
    created to manage digital assets pertaining to harbours used for boating and yachting.
    Its focus is to provide services to the harbour’s activities (B2B) and to its
    end-users (B2C). |

    | `KIOLA` | Commercial, AIT | A mobile health data collection and online therapy
    management system. It integrates different sensor devices on the client side and
    provides backend interfaces for health management systems. |


    ## VICINITY


    | IoT platform | Nature of platform | Brief description |

    | :--- | :--- | :--- |

    | `LinkSmart` | Open source | IoT middleware originally developed in the Hydra
    project. It allows developers to incorporate heterogeneous physical devices into
    their applications through easy-to-use web services for controlling any device.
    |

    | `IoTivity` | Open Source | IoTivity is an open source software framework enabling
    seamless device-to-device connectivity to address the emerging needs of the Internet
    of Things. |

    | `SiteWhere` | Open Source | The Open Platform for the Internet of Things provides
    a set of APIs to connect devices through MQTT, AMQP, Stomp and other protocols,
    enabling self-registration of devices and manipulation with devices using batches.
    |

    | `Eclipse Kura` | Open Source | Eclipse Kura is Java/OSGi-based framework for
    IoT gateways including a set of APIs to access to hardware in/outputs, management
    of network configurations, communication with M2M/IoT Integration Platforms. Moreover,
    Eclipse Kura supports Apache Camel routes to introduce business logic on the level
    of the IoT gateway. |

    | `TinyMesh` | Commercial | Self-managed and self-healing mesh network platform
    for TinyMesh compatible devices that enables the collection of measures and performance
    in the network. |

    | `Gorenje Cloud services` | Commercial | Cloud based IoT platform to control
    and maintain Gorenje household appliances. |


