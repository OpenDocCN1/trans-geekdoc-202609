    # Microsoft Azure


    | Microsoft | 商业 | 完整的云平台，具有特定的 IoT 组件，用于支持设备连接到云端，并分析、存储和可视化捕获的数据。可以与高级数据分析、机器学习和其他组件相结合。
    |


    ## symbioTe


    | IoT 平台 | 平台性质 | 简要描述 |

    | :--- | :--- | :--- |

    | `OpenIoT` | 开源 | OpenIoT 是一个传感器中间件平台，简化了从异构传感器收集数据，同时确保其语义标注。它实现了云端的语义互操作性，并提供了
    IoT 应用开发工具。 |

    | `Symphony` | 商业, Nextworks | 用于集成家居和建筑控制系统的网络平台。Symphony 可以监控、监督和控制来自第三方供应商的许多不同建筑系统、设备、控制器和网络。它是一个面向服务的中间件，能够将多个功能子系统集成到基于
    IP 的统一平台中。 |

    | `Mobility Back-end as a Service (MoBaaS)` | 商业, Ubiwhere | 用于封装不同城市数据源的集成平台。面向智能城市应用的应用启用环境，专注于城市的交通和移动方面。
    |

    | `nAssist` | 商业, Sensing and Control Systems S.L. | 一个设计和构思用于能源效率、安全和自动化领域数据敏捷、持续管理的软件平台。基于云的通信软件允许客户轻松、智能地将机器和设备连接到云端，然后处理、转换、组织和存储机器及传感器数据。
    |

    | `Navigo Digitale IoT platform` | 商业, Navigo | 一种用于管理与船舶和游艇港口的数字资产的垂直 IoT 平台。其重点是为港口活动（B2B）及其终端用户（B2C）提供服务。
    |

    | `KIOLA` | 商业, AIT | 移动健康数据采集和在线治疗管理系统。它集成了客户端不同的传感器设备，并为健康管理系统提供后端接口。 |


    ## VICINITY


    | IoT 平台 | 平台性质 | 简要描述 |

    | :--- | :--- | :--- |

    | `LinkSmart` | 开源 | 最初在 Hydra 项目开发的 IoT 中间件。它允许开发者通过易于使用的 Web 服务将异构物理设备整合到应用程序中，以控制任何设备。
    |

    | `IoTivity` | 开源 | IoTivity 是一个开源软件框架，能够实现无缝的设备间连接，以满足物联网的新兴需求。 |

    | `SiteWhere` | 开源 | 物联网开放平台提供了一组 API 通过 MQTT、AMQP、Stomp 和其他协议连接设备，实现设备的自注册和使用批处理操作设备。
    |

    | `Eclipse Kura` | 开源 | Eclipse Kura 是一个基于 Java/OSGi 的 IoT 网关框架，包括一组用于访问硬件输入/输出、网络配置管理以及与
    M2M/IoT 集成平台通信的 API。此外，Eclipse Kura 支持 Apache Camel 路由，可以在 IoT 网关层面引入业务逻辑。 |

    | `TinyMesh` | 商业 | 用于 TinyMesh 兼容设备的自管理和自愈网格平台，能够收集网络测量数据和性能。 |

    | `Gorenje Cloud services` | 商业 | 用于控制和维护 Gorenje 家电的云端 IoT 平台。 |


