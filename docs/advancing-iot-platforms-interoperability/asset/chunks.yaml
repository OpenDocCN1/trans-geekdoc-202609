    `BIG IoT` develops a generic, unified Web API for IoT platforms implemented. As
    part of the project, 8 partner IoT platforms are being integrated with the ecosystem
    plus several additional platforms are joining via the community building process.
    The project focuses on the upper layers of the IoT architecture by addressing
    the security management, APIs, service integration, external system services,
    applications, and the business enterprise.


    `INTER-IoT` project addresses an open cross-layer framework, an associated methodology
    and tools to enable voluntary interoperability among heterogeneous IoT platforms
    by focusing on six layers of the IoT architecture with modules covering the QoS
    and device management, service integration, external system services, storage
    and virtualisation. The project addresses all network communication layer and
    the full security management suite.


    `symbIoTe` is providing an abstraction layer for a unified view on various IoT
    platforms and sensing/actuating resources. Applications can use `symbIoTe Core
    Services` implementing a semantic IoT engine to find adequate resources offered
    by `symbIoTe`-enabled platforms and subsequently access platform’s virtual resources
    directly for data acquisition and actuation. The project focuses on seven layers
    of the IoT architecture from physical to application layer and proposes a full
    security management suite.


    `TagItSmart!` offers a set of tools and enabling technologies that can be integrated
    into different IoT platforms using provided APIs to enable users across the value
    chain to fully exploit the power of condition-dependent functional codes to connect
    mass-market products with the digital world across multiple application sectors.


    `VICINITY` focuses on a platform and ecosystem that provides “interoperability
    as a service” for infrastructures in the IoT and addresses the five-upper layer
    of the IoT architecture. The work considers the service integration, business
    logic, virtualisation, storage, APIs, tools, external system services, applications,
    data analytics and cloud services.


    ## 4.2 AGILE


    The `AGILE` project aims to address technical and syntactic interoperability at
    hardware and software levels. On the hardware front the project designs hardware
    components extending the current state-of-the-art of available IoT gateway platforms
    with a twofold objective: to develop a so called “Maker’s Gateway” by extending
    the capabilities of the most adopted and low-cost `Raspberry Pi` platform; and
    to develop a modular hardware gateway design for industrial purposes. For the
    Maker’s Gateway, the project contributes a shield following the `Raspberry HAT`
    specification to the Open Hardware community, extending the capabilities of the
    platform by two additional sockets for radio modules, with several sensors including
    a GPS, and with further wired sensor connectivity options. The project also provides
    code that helps developers visualise and eventually use the features of these
    in a web-based visual application development environment called `Node-Red`. The
    ease of use for these tools enables people with no software / hardware competences
    to assemble their required solutions in a fast prototyping environment used also
    for testing purposes and before mass production.


    On the software front the objectives of the `AGILE` project are to release open
    source code through the `Eclipse Foundation` to the community of IoT software
    developers / makers, helping them to easily configure their devices or gateways
    according to the platform environment these will be part of. The code is designed
    with gateway platform interoperability in mind, minimizing dependencies and thus
    supporting not just the two gateways hardware platform variants developed inside
    the project but also other platforms available on the market. To this end, `Docker`
    containerization (`https://www.docker.com/`) is used to separate software components
    from each other and from the underlying HW/OS. In fact, `Docker` is the leading
    containerisation technology for software containers, packages that contain software
    binary executables, runtimes and all related dependencies.


    To further facilitate HW support, the project also contributes to the development
    of the `Linux` `Yocto`-based `ResinOS` operating system, specifically tuned for
    `docker`-based multi-container deployments adaptable to a large number of IoT
    gateway platforms.


    Interoperability of platforms is therefore more easily fostered with the creation
    of an ecosystem of IoT applications that can be shared between users and developers
    leveraging existing initiatives like the `Docker` container ecosystem. Users are
    able to discover, install/manage and share components that have been developed
    for interoperability purposes in a secure way through the `Docker` app marketplace.


    `Figure 4.1` gives a more detailed view of what the `AGILE Architecture` looks
    like and which are the various modules that, run as executable images in a container
    platform, enable it to address interoperability. Worth highlighting for this purpose
    the IoT Device and HW module Discovery and IoT Device Communication (hardware
    interoperability) and the `Device Management UI` and `IoT Data Management UI`
    (software interoperability) that encompass all aspects of syntactic interoperability.


    ![Figure 4.1. AGILE Detailed Architecture](images/fig4_1.jpg)


    **Figure 4.1.** AGILE Detailed Architecture


    The top part of the picture shows how `AGILE` achieves horizontal interoperability
    of existing IoT platforms by allowing users to utilise external platforms for
    data management (e.g., `Dropbox` and `Google-Drive`), APIs for IoT devices (like
    wearable device APIs, home automation APIs, etc.) and application scalable deployment
    (e.g., support for `CloudFoundry` PaaS and integration of `FIWARE` enablers, `Microsoft
    Azure`, etc.). `AGILE` addresses these challenges at the software level by providing
    IoT platform specific modules for its `Node-Red` based visual application composition
    environment. With the categorization of `Figure 3.2`, this approach is similar
    to the “Cross Platform Access” pattern, with the notable difference that `AGILE`
    provides support in form of `Node-Red` modules, of which the application that
    uses features of both `AGILE` and several other cloud platforms can be composed.


    The project does not address any approach to semantic interoperability.


    ## 4.3 BIG IoT


    The goal of the `BIG IoT` project is to remove technological market entry barriers
    of service and application providers of the Internet of Things by exploiting the
    capabilities of `smart object platforms` through establishing `syntactic` and
    `semantic interoperability` via an open `BIG IoT API` and `BIG IoT Marketplace`
    to enable cross-standard, cross-platform, and cross-domain IoT services and applications.
    Thereby, the project is defining a comprehensive architecture for IoT ecosystems
    including a solid security design and service composition approach, while at the
    same time providing business models that sustain the ecosystem.


    ### 4.3.1 The BIG IoT Architecture

