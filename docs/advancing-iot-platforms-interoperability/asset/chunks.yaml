    ## 4.8 VICINITY


    The VICINITY project is built around the concept of connecting different IoT ecosystems
    through the VICINITY platform (interoperability as a service), which enables to
    interact with IoT objects from other different ecosystems as if they were their
    own. The interoperability services create an environment where value-added services
    can be deployed and processes make available cross-domain information.


    ![Figure 4.13. VICINITY Concept](images/fig4_13.jpg)


    **Figure 4.13.** VICINITY Concept


    ![Figure 4.14. VICINITY Semantic interoperability approach](images/fig4_14.jpg)


    **Figure 4.14.** VICINITY Semantic interoperability approach


    In the presented figure, two separate ecosystems are presented: intelligent building
    and energy ecosystem. Each of these ecosystems is integrated into VICINITY by
    its `VICINITY Adapter` through the `VICINITY Gateway`. Based on the setup of virtual
    neighbourhoods in the VICINITY Neighbourhood manager, `VICINITY Adapters` may
    access remote IoT objects based on semantic interoperability, for example a battery
    in an Energy ecosystem, and use them as a part of their ecosystem. Moreover, IoT
    objects shared by the `VICINITY Adapter` within a virtual neighbourhood may be
    accessed by value-added services to provide cross-domain services using a common
    VICINITY ontology.


    ![Figure 4.15. Semantic interoperability approach for Discovery](images/fig4_15.jpg)


    **Figure 4.15.** Semantic interoperability approach for Discovery


    One of the main challenges of implementing interoperability in the IoT context
    is to enable consumers to discover, in a distributed and dynamic scenario, those
    IoT objects that are relevant to their needs but without having any prior knowledge
    about them. The VICINITY cross-domain interoperability relies on:


    ![Figure 4.16. Semantic interoperability approach for Access](images/fig4_16.jpg)


    **Figure 4.16.** Semantic interoperability approach for Access


    *   The `VICINITY ontology` (`[^(19)]`) as the common and abstract information
    model to be used;

    *   The Semantic agent platform as the semantic repository. The W3C Web of Things
    Thing Description (`TD`) is the framework to be used for describing any IoT object
    integrated in VICINITY;

    *   `Gateway Adapter APIs` are the semantic mediators between the actual consumers,
    e.g., `Adapters`, and the repository.


    The first goal of semantic interoperability in VICINITY is to securely discover
    IoT objects.

    The second goal of semantic interoperability in VICINITY is to enable accessing
    IoT objects.


    ## 5 Advancing IoT platforms interoperability


    The IoT-EPI efforts towards providing interoperability have already provided new
    platforms mechanisms and approaches. In this context, several interoperability
    gaps have been identified that require further investigation.


    Internet of Things (IoT) environments are rather complex with heterogeneous physical
    devices supporting various communication protocols, while they are possibly connected
    to intermediary gateway and then to their representations. Thus, it is possible
    to interact with a IoT device in many ways.


    IoT platforms require interoperability on multiple levels, which means finding
    the characteristic functionalities of each layer and defining meta-protocols that
    can be mapped. While the functionality the protocols provide is basically the
    same (e.g `get/set/update/subscribe` to a resource identified by some identifier),
    the resource discovery functionality must be addressed across protocols.


    Research on a layer-oriented approach is required to address providing tighter
    interoperability at all layers of IoT systems (device, network, middleware, application,
    data and semantics) with a strong focus on guaranteeing trust, privacy and security
    aspects. This interoperability approach also provides modules covering quality
    of service (QoS) and device management, service integration, external system services,
    storage and virtualisation.


    Regarding semantic interoperability, current work focuses on defining and standardizing
    common vocabularies in given domains (e.g `http://iot.schema.org`). Interesting
    direction is also the effort towards domain-agnostic aspects of any IoT object,
    following the WoT approach. However, standardization of models is not always a
    viable option. Therefore, research should also focus on techniques that enable
    semantic interoperability even if different information models are used.


    Layered approaches for interoperability allow the stakeholders or platform operators
    to select the best mechanism for interoperation. Management of such options provides
    coordination between layers, enhances cooperative solutions (e.g gateways and
    network) and enables security management.


    With regard to gateway interoperability, the inclusion of a programmable network
    layer based on software-defined networking (`SDN`)network functions virtualisation
    (`NFV`) is critical for merging IoT and 5G and following the existing architectures.
    Using a programmable network has two advantages: management of mobility and management
    of QoS for massive IoT management.

