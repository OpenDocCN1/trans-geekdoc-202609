    ![Figure 3.1 The Levels of Conceptual Interoperability Model \[7\].](images/fig3_1.jpg)


    **Figure 3.1** The Levels of Conceptual Interoperability Model \[[7](#10_References.xhtml#ref_7)\].


    A more IoT-specific classification is provided by ETSI and AIOTI and defines four
    levels \[[9](#10_References.xhtml#ref_9)\]: technical, syntactic, semantic and
    organisational interoperability. In short, they are defined as follows.


    *   •  **Technical Interoperability**: usually associated with communication protocols
    and the infrastructure needed for those protocols to operate.


    *   •  **Syntactic Interoperability**: usually associated with data formats and
    encodings, e.g., XML, JSON and RDF.


    *   •  **Semantic Interoperability**: associated with the common understand of
    the meaning of the exchanged content (information).


    *   •  **Organisational Interoperability**: associated with the ability of organisations
    to effectively communicate and transfer information even across different information
    systems, infrastructures or geographic regions and cultures.


    As this is the most agreed-upon classification of interoperability levels within
    the IoT domain we follow it in this document.


    ## 3.1.   IoT platforms interoperability challenges


    ### 3.1.1.   Patterns of IoT interoperability


    Achieving interoperability on the IoT, requires a closer look at interactions
    of the key components in IoT ecosystems. Before looking into the specifics of
    technical interoperability, syntactic interoperability, semantic interoperability,
    and organizational interoperability, we analyse here those interactions and we
    identify in [Figure 3.2](#07_Chapter03.xhtml#fig3_2) six generic interoperability
    patterns for IoT ecosystems. This subsection is based on the material published
    in \[[10](#10_References.xhtml#ref_10)\].


    The “Cross Platform Access” pattern ([Figure 3.2, I](#07_Chapter03.xhtml#fig3_2))
    is the basic characteristic of an interoperable IoT ecosystem. The goal of this
    pattern is to hide that an application or service accesses resources (information
    or functions) from different platforms through the same interface specification.
    The challenge of realizing this goal lays in allowing applications or services
    to discover platforms with relevant information, and enabling platforms that are
    potentially from different providers to have the same interface and use the same
    formats to communicate data.


    The pattern “Cross Application Domain Access” ([Figure 3.2, II](#07_Chapter03.xhtml#fig3_2))
    extends the “Cross Platform Access” pattern. The goal is that services/applications
    are able to access information and functions not only from different platforms,
    but also from platforms, which host information from multiple application domains.
    Thereby, it is crucial that semantic interoperability is given through well-defined
    and shared information models. A cross-domain application that accesses multiple
    IoT platforms, could e.g. air quality information and traffic data to provide
    green routing through a city.


    ![Figure 3.2. The patterns of interoperability \[10\].](images/fig3_2.jpg)


    **Figure 3.2.** The patterns of interoperability \[[10](#10_References.xhtml#ref_10)\].


    The goal of the pattern “Platform Independence” ([Figure 3.2, III](#07_Chapter03.xhtml#fig3_2))
    is to allow a single application or service to be used on top of different IoT
    platforms (e.g. in different regions). For example, these can be multiple deployments
    of a “smart parking” service used in two different geographic regions, which utilize
    different platforms with information about parking spots. This is especially challenging,
    when the sensors producing the IoT data are based on entirely different technology
    (e.g., radar-based parking spot observation, or counting in and outs of a parking
    lot).


    The goal of the “Platform-Scale Independence” pattern ([Figure 3.2, IV](#07_Chapter03.xhtml#fig3_2))
    is to hide different platform scales towards the connecting services and applications.
    The so called ***server-level*** platforms are platforms with many devices connected
    (e.g. a cloud platform), whereas ***device-level*** platforms grant direct access
    to attached sensors, and ***fog-level*** platforms are intermediaries such as
    edge gateways. A platform implementing this pattern has to hide its scale from
    applications and services accessing it.


    Finally, the pattern “Higher-level Service Facades” ([Figure 3.2, V](#07_Chapter03.xhtml#fig3_2))
    extends the interoperability requirements from platforms to higher-level services.
    Here, services are acting similar to platforms and also provide IoT offerings
    via a common interface. Such a service acts as a façade towards an IoT platform
    and use or process the IoT offerings of the platform to provide added value.


    Once the above described patterns are implemented, they ensure ecosystem interoperability
    and allow an easy re-usage of IoT offerings from the various platforms of the
    ecosystem.


    Organizational interoperability can be realized by ***IoT platform federations***
    formed by multiple partnering institutions that collaborate by sharing IoT resources
    in locations originally out of their reach. This represents an additional horizontal
    integration that enables “Open networked” IoT business models according to the
    classification in \[[11](#10_References.xhtml#ref_11)\].


    We can define an IoT platform federation as an association of several platforms
    enabling their secure interoperation, collaboration and sharing of resources.
    Platforms can be enabled to perform collaborative sensing/actuation tasks and
    to interact directly so as to trade/share resources. A mechanism for defining
    and monitoring Service Level Agreements (SLAs) should be in place, while we can
    also envision the emergence of roaming ***IoT devices***, where a device registered
    and managed by one platform is nomadic and can interact with resources in smart
    spaces managed by another federated platform (in a ***visited smart space***).
    Federated platforms should of course control the terms under which a roaming IoT
    device is allowed to use resources in environments operated by visited platforms.'
