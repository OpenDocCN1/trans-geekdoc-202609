    \ which was the problems suffered by some of those machines that fell into disuse\
    \ had neither an economic nor technical basis. Alignment of Technology and Business\
    \ Strategy a substantial amount of    investments and efforts are also involved\
    \ in expert systems. Inconsistency between the technology and the organization’s\
    \ business strategy could ultimately ruin such efforts and money.  "
