    The debate has extended beyond whether machines can “think” like humans. If the
    dream of “thinkable” machines become a reality, then undoubtedly, this would have
    profound social implications and cause permanent changes in the very foundation
    of the society we are living in. Nevertheless, the current success of expert systems
    seems assured.


    ## Social Implications of Expert Systems


    To harness the brainpower of the experts could be passed along in assisting others
    have always been the major driving force behind the expert systems development.
    It is among the most positive potentials of Artificial Intelligence. As mentioned
    by Reddy, “to share the know-how and knowledge in the form of information products
    is the only way that supports in reducing this ever-widening gap between the have
    and have-nots.” Expert systems could be used as a mean of sharing the wealth of
    knowledge; the wealth of sharing with the disadvantaged is of great importance.
    As progress has been made to develop smart AI applications, we might be doing
    well on our way to “help the illiterate, the poor, and the disadvantaged people
    of all the nations and the world.” While expert systems, when it comes to its
    usage, is of great importance and benefit to our social lives, there are also
    determinants and potential downfalls that could lead to ethical and extremely
    difficult legal dilemmas.


    While it is obviously foolhardy and dangerous to deploy logic machines used as
    a command on the battlefield, think about the system of air-traffic control that
    is used to route airplanes carrying hundreds and thousands of passengers or used
    in the systems of medical diagnosis that might assist physicians in death-or-life
    situations? What can possibly happen as of result of the wrong advice of these
    systems? Accountability does not make sense because who should be held accountable?
    Furthermore, when it comes to systems that think autonomously and are aware of
    their own existence, could they be advicing incorrectly and whether that is intentional
    or not? In the future, do you think the legal system should be extended to deal
    with machines, just as in Isaac Asimov’s fiction “Three Laws of Robotics”?


    Expert systems development also raises the question of who should own the knowledge,
    and there should be an owner. A list of questions was presented by Richard L Dunn
    on this issue: “Is it your employer, or you? How much should you share with a
    knowledge engineer who shows up at your office? Is your value more or less to
    your company if he ‘drains your brain’? Is your company allowed to take that intelligence
    and give it away or sell it to someone else or a party without compensating you?”
    Certainly, intellectual property laws and copyrights are well established.


    It is essential for employers to own the copyrightable materials and patentable
    products developed during an employment career. But with regard to the experience
    and knowledge you have gained during work, are they subjected to the same regulation?
    And after all, personal experience and knowledge are marketable commodities. Therefore,
    that is the reason for your hiring by your employer. However, supposing that experience
    or knowledge could somehow be stored and captured in a computer system that you
    no longer control, or that computer system has acquired experience and knowledge
    from a group of people or someone else who have the same expertise like you, does
    the company still need your services? It would be better to get prepared for all
    these questions before it gets too late to answer them.


    The human intelligence complexities had been underestimated before, especially
    when it comes to the field of expert systems. Managerial challenges and technological
    limitations still remain in expert systems development. However, the future for
    expert systems seems bright with the success of neural networks despite the earlier
    setbacks, `CASE` technology, and other state-of-art technologies. Furthermore,
    careful consideration must be given to ethical and legal issues that will certainly
    arise during the advancement of expert system technology. Should the dream of
    autonomous “thinkable” machines ever become a reality, our lives as we know it
    would be changed forever?


    ## Uses of AI in our Daily Life


    ![](image-83ri5mdu.png) We all use artificial intelligence in our lives daily
    in many ways. We use it, manage it, and respond to AI all the time, every hour
    and every minute of the day. Lack of skilled workforce in the industry, it is
    required for businesses to use AI. Companies hire programmers who create specific
    tasks to automate the workforce with the help of machines and software. Let’s
    understand, manage and use AI in a practical way.


    ### 1. Automate the repetitive tasks


    AI brings friendly changes in any kind of operation by making it faster and reliable.
    For repetitive tasks like social media Blog sharing on specified times, schedules
    Post for publishing are all made easy by AI. For example, the recurring monthly
    deposits into your bank accounts, automatic bills payments, automatic credit recharges,
    etc. these simple tasks consume our time, and AI is used to help us complete these
    tasks without wasting our time.


    AI enables this method, “Let Machine Play Your Roles”.


    Jobs like production, recycling, cleaning, infrastructure development, design,
    transport, and many engineering jobs are mostly done by AI Machines. These machines
    are smart, they collect data and information, and they are able to make their
    own decisions. 3 decades ago, all these jobs were done by humans using machines
    manually, but AI has replaced them as they are more reliable, and there is less
    chance of error. These machines collect data and information, and it is processed
    and analyzed to make the job more efficient.


    AI or Automation is programmed on the basis of the following methods.


    #### i) Users behavior prediction


    Notice how search engines offer a suggestion to complete your sentences? When
    a user input and inquiry into the algorithmic machines, it will predict what the
    user may want to type. This means that the search engine is programmed to similar
    search, responsive websites automatically adapt based on user devices. This means
    website designs (`CSS`) are already programmed to keep the user interface and
    user experience the same on any device.


    You must be thinking of how anyone can predict some once future behavior. It is
    true no one can tell the future, but AI is coming close to it, would you like
    to know how it’s happening? All of this is made possible by the data collected
    by each machine and applications that we are using in our daily lives. The pattern
    of data collected by the machines and user behavior is analyzed by computers and
    people. And this is why they are programming the future by using programming languages
    to collect, manage and analyze all sorts of data and create automatic outputs
    for the future.

