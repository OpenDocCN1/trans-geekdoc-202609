    \ doctors can determine a patient's health threats and determine the medial side\
    \ effects of numerous medications (Hussain and Qamar 2016).  \n\n  Exclusively,\
    \ AI has inspired the industry of medical analysis leading to state-of-the-art\
    \ study which has, in turn, resulted in saving lives.    Evidently, a lot of the\
    \ people understand the significance of AI, as well as the role it offers played\
    \ in boosting their lives. From the chart previously mentioned, 59% of individuals\
