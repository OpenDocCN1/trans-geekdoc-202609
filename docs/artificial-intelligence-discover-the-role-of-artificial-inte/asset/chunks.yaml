    ## 5) 数字助手

    一些先进的机构使用数字助手与用户进行交互，这通常减少了招聘方面的需求。数字同事也被用于许多网站，以提供用户所需的项目。我们可以轻松地与它们讨论我们正在搜索的具体内容。因此，许多聊天机器人的设计已经到让人难以判断我们是在与机器人聊天还是与人类交流。


    我们都意识到组织拥有一个客户支持团队，想要消除特定客户的不确定性和疑问。通过使用`AI`，特定机构可以创建`Voice bot`（语音机器人）或`Chatbot`（聊天机器人），帮助消费者解决疑问。我们看到许多公司已经在其网站和移动应用程序上使用了这些人人员。


    ## 6) 更快的决策

    通过结合`AI`与其他技术，与人类相比，我们可以轻松让机器更快地做出选择并更快地执行操作。在做出选择时，人类会从情感和实际两个方面分析多个因素，但`AI`驱动的设备非常适合处理此类任务，并能以更快的方式提供结果。


    我们都在 `Windows` 上玩过智力激励游戏。要击败 `CPU` 几乎是不可能的，因为它通常是困难模式，因为涉及到游戏背后的`AI`。它会根据所使用的方法在极短的时间内采取最可能的步骤。


    ## 7) 日常应用

    日常程序，例如 `Apple''s Siri`、`Window''s Cortana`、`Google''s OK Search` 搜索引擎经常用于我们的日常生活，无论是搜索位置、自拍、拨打手机、回复新邮件以及许多其他功能。


    大约 20 年前，当我们计划去某个地方时，我们过去会请求以前去过那里的人提供特定路线。现在，我们只需要说 `OK Google` 然后说 `Visakhapatnam`。它一定会在
    `google map` 上显示 Visakhapatnam 的位置，以及根据你当前的位置前往 Visakhapatnam 的最佳路径。


    ## 8) 新发明

    `AI` 正在几乎每个领域推动许多创新，这可以帮助人类解决大多数复杂困难。最近，医生已经可以使用先进的基于`AI`的技术在早期阶段预测女性的乳腺癌。


    ## 人工智能的缺点

    正如每个鲜亮的一面都有黑暗面一样，`Artificial Intelligence`也有一些缺点。让我们来看看：


    ### 1) 高昂的创建成本

    由于 `AI` 会不断更新，硬件和计算机软件随着时间的推移需要升级，以满足典型的最新要求。机器需要修理和维护，这反过来需要大量的费用。由于它们是非常复杂的设备，其创建需要巨大的成本。


    ### 2) 让人类变得懒惰

    `AI` 通过其软件自动处理与工作相关的大部分任务让人们变得懒惰。人类倾向于依赖这些发明，这可能会给后代带来问题。


    ### 3) 失业

    随着 `AI` 配合机器人升级了大多数典型的重复性任务和额外工作，人类的干预正在变得显著减少，这将导致就业需求方面的一个大问题。每个组织都在寻求用 `AI
    robots` 替换最少的认证人员，这些机器人通常能以更高的效率完成类似的工作。


    ### 4) 缺乏情感

    显而易见，机器在高效运行方面通常好得多，但它们无法替代产生团队的人际关系。设备无法与人类建立纽带，这在涉及 `Staff Management`（员工管理）时是一个关重要的属性。


    ### 5) 缺乏发散思维

    设备只能执行那些被设计或编程执行的任务，对于设计之外的任何事情，它们往往会驱动或提供无关的组件，这可能成为一个严重的背景。


    这些通常是与 `Artificial Intelligence` 相关的若干优缺点。每一项新发明或突破可能两者兼具，但我们作为人类需要能够处理好这些，并利用发明的积极因素来创造一个更好的星球。`Artificial
    intelligence` 具有巨大的潜力优势。人类的责任将确保“机器人的起义”不会失控。一些人还说，如果人工智能直接落入错误的人手中，可能会摧毁人类世界。但尽管如此，没有任何规模的
    `AJE` 应用可以摧毁或奴役人类。


    ## 人工智能如何改变建筑的 5 种方式

    ![image-83.png]


    后一步绝对是 `Artificial General Intelligence`（通用人工智能）。谢天谢地，我们的公司还没有这里。这种 `AI` 最终将成为像我们一样思考的系统。我们距离这种形式还有
    30-40 年。消除这种特定形式 `AI` 的关键阶段在于它将通过演示和错误进行自我学习。最终且最可能的酷酷（最可怕）的情况是，`AI` 更新到一种高于其人类创造者的水平。这真的是
    `Artificial Super Intelligence`（超级人工智能）。尽管有人认为我们可能永远无法达到这一水平，但大多数人肯定认为这是可能的。


    ## 日常中的人工智能


    ### 智能手机

    让我们从你每天使用的设备开始，你的智能手机。在此时，可以安全地假设你以及和你圈子里的每个人都有智能手机。无论一个人是否意识到，你每天都在与 `AJE` 交互。从你下载的软件到手机自带的集成软件，这些工具中的每一个都为其功能中织入了某种程度
    `AJE`。内置的智能助手如 `Google Assistant`、`Alexa`、`Siri` 或 `Bixby` 使用 `AJE` 来理解你，甚至完成你推荐的任务。人们使用的许多应用程序如
    `Spotify`、`Netflix` 或 `Apple Music`，使用弱人工智能来优化你的收听体验，例如推荐完美的曲目。


    ### 智能家居及其设备

    我们的每一个家都在变得越来越聪明，你可以归功于 `artificial intelligence`。事实是，我们的家只会变得更好。智能扬箱和合适的器具随着时间的推移学习我们的行为，努力让我们的生活更加舒适。未来将会到来一个新的时代，或者可能当你的房子比你自己更了解你时，它已经在那了。以
