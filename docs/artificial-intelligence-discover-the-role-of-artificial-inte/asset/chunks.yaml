    显而易见，由于 AI 能够执行不同的功能，它确实推动了生产领域的发展（Brynjolfsson & McAfee 2014）。此外，AI 可用于公司的通用管理系统，用于帮助维护员工记录、提取用于决策规划的数据。主要，AI
    的部分已使控制和生产市场部门能够恰当时期完成工作并增强组织发展。


    ## 节省时间


    在如今，时间具有极大的意义，人们准备好开发能够协助节省时间的设备。根据 Gurkaynak 及其同事（2016）的研究，AI 特性已被证明可以节省时间并有效提高每一秒的价值。与人类相比，它能够更高效地同时完成多项任务。同样，它们通过对相同数据进行评估，提供问题解决方案的速度比个人要快得多（Brynjolfsson
    & McAfee 2014）。显然，AI 系统能做到的比人类多。此外，通过 AI，重复性任务已经得到了消除，而这些任务是人类花费了大量时间试图摆脱的。通过
    AI，员工不再关注重复性任务，而是专注于处理更困难的问题（Makridakis 2017）。因此，AI 带来的变化在我们日常生活中显著增加。


    ## 人工智能的影响


    ![](img/image-83ri5mdu.png)


    ### 教学、学习与教育


    众所周知的是，所有人类行为都基于预期，但我们以某种方式无法预测未来，因为我们没有相关的数据，因为它尚未发生。然而，我们完全可以利用目前的生活经验和知识来想象明天将是如何，并朝着那个方向推动发展。如果我们能够理解产生现在的过去，我们可能也能对未来有良好的洞察。现在，为了理解
    AI 可能带来的机遇，我们首先需要了解当前世界中的 AI，以及当未来 AI 被广泛使用时社会将变成什么样。AI 有改变事物发生方式的能力。例如，它可以以许多不同的方式改变教学教育的结构，这可能给学术界和教育带来新的挑战。AI
    可能会放大技能差异，并为全球每个人提供平等的学习机会。它还可以改变学习发生的概念。它可以以新的形式带来课堂，也可能会删除它们。它还可能改变老师在课堂上的教学方式，或者可能要求学生基于技术基础采用完全不同的学习方法。


    它可能在权力的民主化方面发挥巨大作用，并可能结束垄断。它还可能引发收入平等并消除全球贫困。这一切毫无疑问是可能的，但我们需要聪明且努力地去经营。现在是做这些的最佳时机，也是见证并实现
    AI 成果的最佳时机。如今市场上对 AI 异常狂热，由于该领域有点棘手，但努力绝对是值得的。2013 年之后，AI 一一直是美国政策制定者议程的首要任务，当时像
    Frey 和 Osborne 这样的天才预测到，由于系统的结构性变化，美国几乎一半的工作将面临取代。这项研究被行业研究人员进一步证明是正确的，他们也得出劳动力市场将发生巨大的变化和转型。与此同时，精通
    AI 的人员在行业中获得了丰厚的职位，市场和学术界对 AI 也掀起了疯狂的热潮。某公司声称是 AI 领域的领导者，并将到 2030 年在 AI 领域增长 1500
    亿美元。仅在 2017 年，美国国防部就在 AI 上投入了巨大的 20 亿美元，该领域的整体私人投资超过了 200 亿美元。甚至欧盟的 AI 初创公司也计划在
    202x 年向 AI 投资超过 200 亿欧元。


    在小型任务中，AI 已经超过了人类智能。2018 年，斯坦福大学的一位研究人员仅花一年开发了 AI 系统，就能通过正面 X 射线图像检测出超过 144 种疾病或医疗状况，从而在肺炎诊断准确率上超越了人类。2017
    年发生了一件非常有趣的事，`AlphaGo` 在围棋中击败了世界冠军。名为 `AlphaZero` 的人工神经网络仅经过 24 小时的训练就实现了超人的智力，并在游戏中击败了三届世界冠军。谷歌首席执行官
    Sundar Pichai 在 2018 年的主演讲中震惊了人们，他演示了 `Duplex`——这是一个用于组织和处理预约系统的 AI 系统——它一直在欺骗人们认为他们正在与人类对话，实际上是
    AI。因此，在一个充满自动驾驶汽车、机器人接管行业和 AI 奇迹涌现的社会中，我们无法否认 AI 正在变得极其智能的事实，而随着智能而来的还有权力。因此，AI
    可以利用文化中赋予的所有善恶力量。然而，目前的 AI 系统受到巨大的限制，对于它们能做的事情已经设定了边界。它们不能随心所欲地做任何事情。然而，一位作者最近注意到，媒体上讨论的关于基于
    AI 想法的炒作都是三十年前的事了，而 AI 能做到的比讨论的要多得多。


    目前主导的模型也面临着挑战。对当前主导学习模型的这种挑战之一是，它们只将世界视为过去的重复，而不是对未来的预测或期待。学习标准以及过时的材料是由人类提供或提供的。我们将展示一个三阶段学习模型，证明规范和价值观往往通过未言说的、内性的情感反应表现出来。即使是最新的、最先进的学习模型也是基于最古老的
    AL 方法，而且所有的数据和智能都来自人类。


    ![](img/image-x62lfk51.png) 然而，需要付出巨大的努力才能实现伟大未来的梦想。


