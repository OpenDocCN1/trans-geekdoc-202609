    This will lead to the birth of new things out of the old running systems and the
    reinvention of knowledge creation, learning and its applications in many industries
    and research centres. It will, in the end, give rise to a whole different and
    new social and cultural system with new ways of learning and teaching and making
    things happen.


    Let’s focus on some questions that address the relevance of and shift in the structure
    of educational places and the change in policies. Which jobs will come into the
    market, and which jobs will be deleted? So what could be the skills that are required
    in this century where `AI` is so widely used? How could we include `AI` in the
    university curriculum, and how could we use `AI` to change the way teachers teach?
    Do we still need to monitor students in the classrooms? Can we use `AI` to access
    students without any biasness? Do we need any building to have classrooms in or
    there is no need for classrooms? Is `Ai` able to overcome the ill effects of diseases
    such as dyslexia or other learning disabilities? These are some of the most asked
    questions but answering them is not a piece of cake and requires immense research.


    The aim of this very report is to out such questions into context to address them
    in a meaningful way possible. We would also be focusing on the background discussion
    that will provide hints for discussion and will lead us to some final arguments
    or answers that are needed to make the society the best place and favorable to
    use the applications of `AI`. In order to this tedious task, we need to dissect
    `AI-first` and see what is inside. So this should be very clear that there are
    so many things that `AI` could do very well and there are things that `AI` can
    never do or may be possible in future but not present. Currently, there is a huge
    buzz in the market and is however not very easy to recognize the best questions
    out of a plethora of them. However, in order to have a realistic future, it is
    very important to have a good understanding of the basic principles of `AI`, the
    context in which it is applied in learning, education and teaching and then focuses
    on some specific forms of `AI` that is adaptive neural network which is responsible
    for the recent rising interest in `AI`.


    ## A three-level model of action to analyse Artificial Intelligence and its impact


    ![](image-83ri5mdu.png) ![](image-x62lfk51.png) THERE HAVE BEEN THREE hierarchically
    attached to human behavior as distinguished by the cultural-historical theory
    of activity. First of all, behavior could be analyzed as a social and meaningful
    work directed and controlled by socially and culturally constructed motives. Through
    goal-oriented acts, activities could be realized and could lead to problem-solving
    after that. Then using the tools available, operations could be implemented in
    the current situation and concrete context. There is however a very important
    aspect to this three-level hierarchy and that is that we cannot reduce the levels
    to each other. The meaning of any activity could be explained using cultural,
    social and historical terms that normally do not make sense at the operation level.
    For instance, we could explain both object and purpose by putting it in the sense
    that we are teaching to give rise to responsible citizen and individuals, well-paid
    jobs, and so on.


    The output of the activity mentioned above, however, could be decoded into solid
    acts which further depends on factors like norms, social principles, institutions,
    the social division of labor and the ways and procedures in which societies organizes
    social production and many other factors. These social factors shape and give
    structure to our activities. These also give rise to an implicit normative, anticipatory
    and emotional background which gives foundation to the running system to go on.
    This level also gives the foundation to ethics of actions. The link and correlation
    between activity and act are thereby similar to the link between utterances and
    words. Words are needed for utterance as well as for acts for activity expression.
    However, understanding the meaning of the utterance is also difficult if the words
    are not defined. In order to write a statement, we need words and for words, we
    definitely need letters but it is not possible to comprehend the meaning of sentences
    just by understanding the meaning of letters and words. This means that it is
    not possible to build a model of human behavior just by understanding the meaning
    of words and letters. For a proper understanding of activities, social and inter-generational
    learning is important and human activity level could not be accessed just by the
    empirical testing of human behavior.


    The level of an act, on the other hand, contains internally and externally observable
    behavior. In addition, the activity level answer a culturally, socially and historical
    and meaningful question “why” and the question of “WHY” is answered by the level
    of acts. Teaching description on this level could be, for instance, “I am writing
    this book”. The third and last operational level focuses on the question “how”
    setting could be implemented in concrete settings. For example, there could be
    a plethora of ways for assessing and examining students’ skills and many types
    of homework and ways to deliver it to students. This is the level of technology
    operation as a tool and this level could be let’s say that “I am attaching a picture
    to a slide”. Learning theorists and psychologists have been focusing on many levels
    of the three-level hierarchy since the last century. Associationist and behaviouristic
    theories of learning have mainly addressed the operation levels. In addition,
    constructivist and cognitivist learning theories have focused mainly on cognitive
    levels, and constructionists are also focusing on the material and social context.
    Theorists, who are socio culturists, have been often focusing on cultural, social
    and material learning. In figure 1, some famous theorists have been depicted these
    three levels.


    A human can learn on all the three-level of activity of the hierarchy. When our
    habits or routines are restricted by any obstacle, our operational response gets
    replaced by actions. In such cases, we try to interpret the problem in question
    and quest for a possible solution. At this very level, learning is all about problem-solving
    which also lead to the formation of new models too. New ways and procedure of
    dealing with problems appear and could be internalized and adopted. Lev Vygotsky
    was the founder of cultural-historical theory and he had also focused and put
    emphasis on the important role of cultural and social activities that modify human
    thinking and learning. The birth of new and more advanced forms of thought is
    made possible for they also rely upon historically and culturally developed knowledge.
    So it is very obvious that cognitive level activities make use of resources both
    from the top level and bottom level operations. Engeström has also elucidated
    the role of learning and its importance in the creation of new educational practices
    and activities. In a conceptual frame like this one, learning the activity level
    could be easily understood as a realization and innovation of imagined features.

