  trans: '


    # 1. 识别人们希望 AI 解决的问题


    一旦你能够掌握核心要点，几乎任何业务的下一步都是开始开始探索不同的想法。思考如何为你现有的产品和服务添加 `AJE` 能力。更重要的是，你的业务应该在脑中明确特定的应用场景，在这些场景中，AI
    可以解决业务问题，或者提供可以证明的价值。


    “当我们与某些公司合作时，我们首先从概述其关键技术计划和问题入手。我们希望能够展示出自然语言处理、图像识别、`CUBIC CENTIMETERS` 等如何融入到这些产品中，这通常是在公司的监督下，通过某种类型的研讨会由
    Tang 进行非常详细的解释。细节总是因企业而异。例如，如果一家公司通常进行视频 CCTV 监控，那么在这一过程中加入 `CUBIC CENTIMETERS`
    可能会产生巨大的价值。”


    # 3. 优先考虑具体的价值


    接下来，你能够评估你识别出的各种可能的 `AJAI` 实施方案所具有的组织和财务关联。人们很容易陷入“空中楼阁”式的 AI 讨论而找不到出路，但 Tang
    强调了将你的倡议立即与业务价值挂钩的重要性。


    “要确定优先级，请查看潜力和可行性的特定维度，并将这些人员放入一个 2x2 矩阵中，”Tang 说。“这应该帮助你根据短期存在进行优先级排序，并了解对公司而言的财务价值是多少。对于这种步骤，你通常需要经理和高层专业人员的所有权和认可。”


    # 承认内部能力空间


    发现你想要实现的目标与你在某些给定时间内通过组织能力可能实际实现的水平之间存在显著差异。Tang 报告说，一家企业在直接投入全面的 AI 呈现之前，应该能够知道对于新的技术和业务流程自己哪些是能做的，哪些是不能做的。


    “有时这可能需要很长时间才能实施，”Tang 说。“解决内部能力差距意味着在继续之前，要识别个人需要获得什么，以及任何需要在内部改进的流程。根据公司的情况，可能有现有的项目或团队可以帮助某些业务部门自发地完成这一任务。”


    # 5. 由专家进行交付并安排试点项目


    一旦你的业务从公司和技术角度来看已经准备就绪，下一步就是获取和整合的时间了。Tang 表示，这里最重要的部分是从小处着，在心中有项目目标，并且最重要的是，熟悉你对
    AI 了解和不了解什么。这将是吸引外部权威或 AI 顾问可以变得弥足珍贵的地方。


    “你不再需要为第一个工作花费大量时间；通常对于任何试点工作，2-3 个月是一个很好的范围，”Tang 说。“你希望能够将内部和外部人员聚集在某个团队中，也许是
    4-5 个老少皆有的成员，这种紧凑的时间框架可以保持小组专注于简单的目标。”


    在试点完成后，你必须能够决定更长期、更复杂的项目可能是什么，以及该价值主张对于你的业务是否合理。至关重要的是双方的专业知识——理解业务的人员和通常了解 AI
    的人员——必须合并到试点项目团队中。


    # 6. 组建任务小组以整合数据


    Tang 指出，在将 `ML` 引入业务 之前，个人需要清理重要的计算机数据以使其做好准备，以避免“垃圾进，垃圾出”的情况。“公司内部数据通常分散在涉及不同遗留系统的多个数据孤岛中，甚至可能在具有不同优先级的各种业务小组手中，”Tang
    解释道，“因此，获得高质量数据的一个非常关键的步骤是建立一个跨-[业务部门]任务小组，将不同的数据集整合在一起，并解决不一致之处；这样数据通常是准确且丰富的，并带有
    `ML` 所需的所有正确衡量。”


    # 7. 从小开始


    开始将 AI 应用于你当前数据的一个小样本，而不是太快速地处理过多的内容。“从简单开始，增量地使用 `AJE` 来证明价值，收集反馈，然后相应扩大，”Aaron
    Brauser 解释道，他是 `M*Modal` 的解决方案管理副总裁，该公司为医疗保健机构提供自然语言理解 (`NLU`) 技术，以及一个与电子医疗记录
    (`EMRs`) 集成的 `AJE` 平台。


    与数据相关的特定类型可以是某些医学专业的数据。“对 AI 将阅读的确切内容要有选择性，”M*Modal` 的首席医疗信息官 (`CMIO`) Gilan El
    Saadawi 博士说，“例如，选择一个人想要解决特定问题，让 AI 专注于它，并给它特定的问题来回答，而不是把每个信息都丢给它。”


    # 8. 将存储包含在 AI 计划中


    当你从少量信息升级后，你将不得不考虑应用 AI 方案的存储区域要求，根据 `Penguin Processing` 的首席技术官 (`CTO`) Philip
    Pokorny 的说法，该公司提供高性能处理 (`HPC`)、AI 和 `ML` 解决方案。


    “改进算法对于获得研究收益至关重要。但如果没有大量文件来帮助构建更准确的版本，AI 方法无法充分改进以实现你的计算目标，”Pokorny 在一篇名为《关键判断：构建无留遗憾的整个人工智能解决方案的有用信息》的简明文档中写道，“这就是为什么在
    AI 程序设计的初期强烈建议包含快速、优化的存储。”


    此外，你还需要为数据摄取、工作流和建模优化 AI 安全，他建议道。“在审查选项方面做出努力可以对系统上线运行的方式产生巨大、积极的影响，”Pokorny 添加道。


    # 将人工智能作为你日常任务的一部分


    由于 AI 提供的额外信息和自动化，员工获得了一个工具，让 AI 成为他们日常工作中不可或缺的一部分，而不是替代它，根据 `Moogsoft`（一家提供此类功能
    AI 服务提供商）的全球 IT 传道者 Dominic Wellington 的说法，“某些人员可能会影响他们就业的技术感到谨慎，因此，引入完美的解决方案来增强他们的日常任务是必不可少的。”


