    自 20 世纪 90 年代以来，教育考试服务（ETS）和培生（Pearson）等机构一直在开发定制的 `NLP` 评估设备，用于政府支持的考试试卷共同评分。许多受欢迎的
    `MOOCs`（包括由 `EdX`、`Coursera` 和 `Udacity` 制作的正在使用 `NLP`、`AI` 以及自由支持的方法论，对简答题和文章类要求的评估方式与编程作业类似。旨在帮助研究生水平备考和可靠学习的在线指导系统同样在快速发展。考虑到对于职场人士和职业转型者来说，面对面交流的需求并不那么关键，这些结构具有显著的保障性。虽然它们不是
    `MACHINE INTELLIGENCE` 强化结构和应用的先驱，但随着技术的尝试和验证，它们将成为早期采用者。人们可能会认为，`MACHINE INTELLIGENCE`
    是一种解决问题的难题，它让教师（特别是在前沿教育领域）能够将其教学廊规模扩大两到三倍——几千人的班级规模是常态。为了对海量学生进行持续测试，自动化作业评估也是可能的，例如使用电子资源（如
    `WordNet`、`Wikipedia` 和在线本体）来评估语言、`wh`（谁/什么/何时/何地/为什么）问题以及选择题。


    受在线课程的影响，这些方法确保被深度理解并应用于网络学习。尽管这些系统的长期影响对教育架构意味着什么尚不清楚，但 `MACHINE INTELLIGENCE`
    社会在短时间内取得了巨大进展。


    ### 学习分析

    通过从大规模网络学习平台（从 `MOOCs` 到可汗汗学院 `Khan Academy`）到规模较小的在线活动收集的教学资源，同样推动了学习分析领域的快速发展。在线课程对于广泛传播非常有价值，但它们也是数据收集和测试评估的主要工具，这将促进持续发现和完善规模化学习的理念。例如，学习分析研究学会（`SOLAR`）的成立，以及包括学习分析与知识会议（AIK）和规模化学习会议（`L@S`）的崛起反映了这一点。该学会将重要的学习分析、自然语言处理和其他
    AI 技术应用于学生职责、领导力和结果的评估。目前的努力试图揭示基本的学生障碍模式，预测哪些学生面临失败风险，并提供与学习结果紧密结合的持续性学生分析。


    近期的工作还致力于理解与感激、形成、数据验证和记忆相关的心理机制，并通过创建和测试信息技术将这些理解应用于教育实践。


    ### 挑战与机遇

    人们可能预见到，现在学校、学院和大学中 AI 引擎的使用会日益普及。其很大程度的缺失可以归于这些机构缺乏资金支持，以及缺乏关于进展广度的数据支持。然而，这些问题正在通过私人基金会和各种活动逐步解决，以便在暑期营中准备好实质上具有裁量权的教师。在人工智能的各个领域一样，对
    `MOOCs` 能力的盲目关注和认证表明，愿望往往超过现实。特定机构的经历，例如圣何塞州立大学与 `Udacity` 的合作，引发了对新信息发展能力日益审慎的评估。


    在接下来的十五年里，总而言，人类教师将通过 `MACHINE INTELLIGENCE` 的帮助，实现更好的人机协作，无论是在教学廊还是在家。研究小组预计将创建逻辑上广泛且日益复杂的计算机生成的模拟环境，学生可以在其中沉浸在所有学科的科目中。朝这一方向迈出的几个阶段正在进行中，通过加强
    `MACHINE INTELLIGENCE` 研究人员与人文和人文系统专家之间的合作来实现，斯坦福大学的 `Galileo Correspondence Project`
    和哥伦比亚大学的 `Making and Knowing Project` 就是例子。这些跨学科项目创造了具有清晰记录的自然体验，并利用虚拟现实（`VR`）来探索智能考古目标。`VR`
    程序现在正开始用于自然科学，例如科学、生物结构、地质学和天文学，使学生能够接触到通常难以接触的环境和事物。过去宇宙和史诗宇宙的模拟将成为言语和各门科学考试的标准配置。人工智能推理程序将不断模糊正式化学习廊准备与自主导向、特定学习之间的界限。


    灵活的学习结构（例如）将成为前沿教育教学方法的亮点，其目的是为了控制成本的同时服务更多学生，并让学生更快完成学业。虽然正式指导不会消失，但研究小组承认 `MOOCs`
    和各种类型的在线学习将成为从 K-12 到大学的所有层次学习的一部分，形成一种混合教学廊体验。这一进展将促使管理学习的方法变得日益灵活，其中学生可以使用最适合自己的教育框架按照自己独特的进度进行学习。在线指导系统将随着学生的增长而学习，支持我们对学习策略的认知更新。相应的，学习评估将激发相关工具的发展。


