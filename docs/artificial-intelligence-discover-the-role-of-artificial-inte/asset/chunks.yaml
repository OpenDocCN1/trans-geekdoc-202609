    为了实现网络规模的运作，这些阶段必须依赖于通常有效构建在语言处理、数据恢复、图像处理、公共支持和人工智能领域的系统。例如，面向社区的推荐系统已被开发，用于根据客户的统计数据和浏览历史来推荐相关的电影、音乐或文章。定制化的娱乐源也同样利用人工智能来跟上时事潮流。正如《点球女孩》一书和电影所示，职业体育比赛目前已暴露在集中的定量分析之中。通过过去的完整执行数据，利用先进的传感器和摄像头可以对场上信号进行检测。编程已用于创作音乐和感知音轨。来自计算机视觉和
    `NLP` 的程序已用于制作舞台表演。事实上，即使是普通用户也可以舞台上发挥创造力，例如 `WordsEye`，它可以根据自然语言内容创建出 `3D` 场景。人工智能还进入了人类经验表达的实证研究领域，并在法字学以及近年来的艺术品分析中得到了广泛应用。


    人们对`MACHINE INTELLIGENCE`驱动的刺激产生的反应能量令人震惊，并引发了对其削弱人与人之间联系的担忧。很少有人预到人们会花费大量时间与演示文互动。年轻人经常表现出在家里玩自己的设备时更快乐的迹象，而不是在外面和伙伴们在一起。人工智能将逐步使娱乐变得更加智能化、个性化和具有吸引力。研究应当引导向如何利用这些特性来造人类和社会的利益。


    ## 想象未来

    任何类型娱乐的成功最终取决于其主体的个人和社会群体。人们认为有趣的娱乐方式各不相同，并随着时间的推移而变化。因此，很难明确预测未来十五年娱乐将采取何种形式。尽管如此，目前的趋势至少暗示了未来娱乐格局可能包含的几个亮点。


    到目前为止，数据革命主要发生在软件领域。然而，随着廉价传感器和设备可用性的提高，剧院设施中所使用的硬件将会有显著的进展。计算机生成现实和触觉技术可能会进入我们的客厅——定制化的伙伴机器人正在开发中。随着`Automatic
    Speech Recognition`的持续升级，研究小组预计与机器人和其他娱乐设施的交流将变得基于交换，起初可能是强制性的，但逻辑上会越来越像人类。同样，协作框架预计将增加新的属性，例如感知、同情以及对自然节奏（如时间）的适应。


    今天，一个拥有摄像机和随手可得编程工具的初学者就可以拍出相当不错的电影。将来，越来越先进的设备和应用程序将使创作优秀内容变得简单得多，例如制作音乐或使用符号来剪辑电影。娱乐的创作和传播将受益于技术的进步，例如
    `ASR`、命名和`Machine Translation`，这将使内容能够廉价地复制给不同的观众。


    这种`MACHINE INTELLIGENCE`制作媒体的民主化和扩张使得很难预测人们对娱乐的偏好（这是一个流动的领域）将如何发展。随着内容越来越多地精确传递，以及关于消费者偏好和习惯的大量信息被记录，媒体巨头将权能够微观研究并服务于日益特定的人群——甚至到个人。媒体聚合体可能为作为“长者”的发展做好了准备，它们可以控制特定个人所接触的思想和在线体验。目前还不清楚更广泛的社会是否会采取措施避免它们的产生。这一点以及其他与`MACHINE
    INTELLIGENCE`相关的策略将在后续章节中详细讨论。


    ## AI 公共政策的前景与建议

    `MACHINE INTELLIGENCE`应用的目标必须是为社会激励。我们的政策建议源于这一目标，虽然本报告关注的是 2030 年的一座北美常见城市，但这些建议随着时间的推移广泛适用于不同的地区。加强我们解读`ML`框架的能力并参与其使用的程序可能有助于建立信任并防止重大失误。必须注意扩大和增强人类的能力和联系，并避免社会的边缘化。应当强调支持这一方向的研究并教育公共政策讨论。鉴于目前美国企业在该领域的明确指南，预计会有新的或经过调整的法律和政策来应对`ML`可能带来的全面影响。与“额外”或“更严格”的监管相比，方法应该旨在支持支持性进步、产生和转移技能，并培养企业和城市在处理这些技术引发的基础性文化问题方面的广泛责任。从长远来看，`AI`将赋能新的财富创造，这将需要对如何共享
    AI 技术的金融产品进行社会讨论。


    ## 现在的与未来的 AI 政策

    从一开始，人们既形成也适应了新技术。本报告预计`ROBOTICS`技术的进步将被一点地实现并处理——而不是在系统本身发生突然的、意料之外的跳跃——并将发展现有的事物，使这种变化变得简单。另一方面，策略、权力登记或数据可用性方面的微小移动可能会在短时间内带来新颖的、游戏应用。`AI`应用的成功程度取决于它们为人类生活创造的价值。继续下去，人们使用和适应`ROBOTICS`应用的简易程度将以同样的方式决定它们的成功。另一方面，由于`ROBOTICS`应用无法抵抗错误和失望，其繁荣的标志将是客户看待和承担其不足的方式。

