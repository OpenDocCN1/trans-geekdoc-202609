    The revolution of deep learning is only beginning to influence robotics in large
    part due to their difficulties of acquiring the large labeled data sets that have
    driven other learning-based areas of Artificial Intelligence. Reinforcement learning
    about which we talked above, obviates the requirement of labeled data that may
    help to bridge this gap but only requires systems that are capable of safely exploring
    a policy space without committing errors that is harmful to the system itself
    or others. Advances in reliable machine perception much of which will be driven
    by machine learning, including force, computer vision, and tactile perception,
    will continue to perform as a key enabler to advancing the capabilities of robotics.


    ## Computer vision

    The most prominent form of machine perception in computer vision. It has been
    the sub-area of Artificial Intelligence mostly transformed with the deep learning
    rise. A few years ago, the method of choice for most visual classification tasks
    were support vector machines. But the availability of large datasets especially
    through the internet, the confluence of large-scale computing especially on `GPUs`,
    and refinements of neural network algorithms have led to dramatic progress and
    improvements in performance on benchmark tasks (e.g., classification on `ImageNet17`).
    Computers, for the first time, are capable of performing some visual classification
    tasks better than humans. Current research is also more focused on automatic video
    and image captioning.


    ## Natural Language Processing (NLP)

    Often accompanied by automatic speech recognition, another very active area of
    machine perception is Natural Language Processing (NLP). Natural language processing
    is a fast growing commodity for mainstream languages with large data sets. About
    20% of current mobile queries are done by voice as announced by `Google`, and
    the recent demonstrations have proved the real-time translation possibilities.
    Further research is now shifting towards the development of refined systems that
    are capable of interacting with people not just reacts to stylized requests but
    also through dialog.


    ## Collaborative systems

    Research carried out on collaborative systems investigates algorithms and models
    to help develop autonomous systems that can work collaboratively with humans and
    other systems. The research relies on the development of formal models of collaboration
    and studying the capabilities of systems to become effective partners. Growing
    interest is in the applications utilizing the complementary strengths of machines
    and humans—for humans to help Artificial Intelligent systems for their limitations
    to overcome, and for agents to augment human activities and abilities.


    ## Crowdsourcing and human computation

    It is a reality that human abilities are superior to automated methods for accomplishing
    tasks, research on human and crowdsourcing computation investigate the different
    methods to augment computer systems with the help of human intelligence for problem-solving
    that computers alone can’t solve well. Introduced only about 15-year ago, this
    research has an established presence in Artificial Intelligence. A most known
    example of crowdsourcing is `Wikipedia`, which is a knowledge repository that
    is updated and maintained by netizens and exceeding the traditionally-compiled
    information sources, such as dictionaries and encyclopedias, in-depth and scale.
    The main focus of crowdsourcing is devising innovative ways to harness human intelligence.
    For solving scientific problems, volunteers are energized by the Citizen science
    platforms, while paid crowdsourcing platforms like `Amazon Mechanical Turk`, which
    is providing on-demand automated access to human intelligence. Further work in
    this area has facilitated advances in the subfields of Artificial Intelligence,
    including `NLP` and computer vision, by enabling large amounts of labeled training
    data or/and human interaction data to be collected in a very short time. Currently
    held research efforts reflect exploring ideal divisions of tasks between machines
    and humans based on their different costs and capabilities.


    ## Algorithmic game theory and computational social choice

    New attention is being drawn to the social and economic dimensions of Artificial
    Intelligence, including incentive structures. Multi-agent systems and distributed
    Artificial Intelligence have been studied since the early 1980s gained prominence
    and were accelerated by the internet started in the late 1990s. There are some
    natural requirements that systems handle potentially misaligned incentives, including
    self-interested firms or human participants, as well as automated agents based
    on them. The topics that receive attention include computational mechanism design
    (an economic theory of incentive design, seeking incentive-compatible systems
    where inputs are truthfully reported), incentive aligned information elicitation
    (prediction markets, scoring rules, peer prediction), computational social choice
    (a theory for how to aggregate rank orders on alternatives), and algorithmic game
    theory (the equilibria of markets, parlor games, and network games, for example,
    `Poker`—a game where significant advances have been made currently and in the
    previous years through no-regret learning and abstraction techniques).


    ## Internet of Things (IoT)

    Research of a growing body is devoted to the idea that devices can be interconnected
    in a wide array to share and collect their sensory information. These devices
    can include vehicles, buildings, appliances, cameras, and other things. While
    it is a matter of wireless networking technology to connect the devices, artificial
    intelligence can use and process the resulting huge data for useful and intelligent
    purposes. Now, these devices are using a bewildering array of incompatible communication
    protocols. Artificial Intelligence could be of help and tame this Tower of Babel.


    ## Neuromorphic Computing

    The von Neumann model of computing is implemented by traditional computers, which
    separates the modules for input/output, instruction-processing, and memory. With
    the deep neural networks (`DNNs`) success on a wide array of tasks, alternative
    models of computing are actively pursued by manufacturers—especially those that
    are inspired by what is known about biological neural networks (`BNNs`)—with the
    aim of bringing improvement in the efficiency of hardware and robustness of computing
    systems. Such “neuromorphic” computers, at the moment, have not yet clearly demonstrated
    big wins and are just starting to become commercially viable. A splash in the
    application landscape is already created by the deep neural networks (`DNNs`).
    There is a possibility that larger wave hit when these networks, as opposed to
    simulated on standard von Neumann architectures, can be executed and trained on
    dedicated neuromorphic hardware, as they are today.

