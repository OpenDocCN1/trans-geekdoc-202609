    \ in Ai focuses on the cognitive level of activity hierarchy. Cognition was also\
    \ interpreted in a purely individualistic way. AI has been helpful in designing\
    \ general algorithms for thinking which manipulates symbols, as humans do-the\
    \ argument. While logic-based systems have been focusing on the solving process\
    \ of general problems. Knowledge-based approach, on the other hand, made use of\
    \ simple models of inference and a more elucidated interpretation of domain-specific\
    \ knowledge, the argument being that effective decision making needs more knowledge\
    \ and not logic.    In contrast, ML (machine learning) and ANN (artificial neural\
    \ network) typically make use of learning models that could be characterized as\
    \ behavioristic. The systems have normally a pre-defined criterion which gives\
    \ detail about optimal response and are also provided with a huge amount of data.\
    \ Algorithms do not copy or imitating human intelligence in such systems.  \n\n\
      Instead, they make use of the training data practices and define strategies\
    \ for adapting the output of the system. In applications like games, the training\
    \ data could automatically be generated; however, in the most recent and important\
    \ neural network; humans provide data. A good example is the arrival of the best\
    \ of the best image recognition AI system. To a large extent, AI systems rely\
    \ on a public ImageNet database that has around 14 million images. Using the Amazon\
    \ Mechanical Truck crowdsourcing platform, the labelling of objects in the image\
    \ was done.    ![](image-x62lfk51.png)  RECENT & FUTURE DEVELOPMENTS in AI   \
    \ The current interest in AI is the result of three development that took place\
    \ at the same time. The first and foremost is the high interest in realistic computer\
    \ games that need special graphic processors. Fast parallel programming became\
    \ available at a low cost when the PC graphic card making company Nvidia launched\
    \ its CUDA programming interface. Its graphics accelerator card was known around\
    \ the world. This also gave researchers a chance to make neural networks with\
    \ many interconnected layers made out of artificial neurons with a big number\
    \ of the parameter for the network to learn. Secondly, a huge amount of data became\
    \ available as computers and users got linked. This digitalization of video, image,\
    \ text and voice has engendered a platform for machine learning to thrive.  \n\
    \n  This has also given AI researchers the freedom to work on the old artificial\
    \ neural network models, and a huge data source for training. These data sets\
    \ have proved to be enough and abundant to tackle some pressing challenges in\
    \ AI, which also include recognition of objects from digital image and machine\
    \ translation. Earlier it was also believed that computers also need to know the\
    \ language as well as the structure so that they could be able to translate the\
    \ text as well as speech to different languages. For many users, it is enough\
    \ to just process millions of available sentences to understand the context in\
    \ which words appear.    Another common way is to make use of publically available\
    \ GloVe word representations, which have been produced using text corpora that\
    \ included as much as 840 billion word tokens which are found on documents. And\
    \ other pages on the internet, and afterward translated to the vocabulary of as\
    \ much as 2 million words. Using a machine-learning algorithm and these available\
    \ data set, the world has been plotted in points in 300-dimensional vector space.\
    \ The geometric relation and location among words in such space capture many features\
    \ of word use, which could also be used as a foundation for translation from one\
    \ to another language. Though a pure data-based and statistical approach are not\
    \ enough to comprehend creative or new uses of languages, and it also works great\
    \ in practical use.  \n\n  Thirdly, the testing and creation of the neural network\
    \ are made easy by specialized open-source ML programming environments. In the\
    \ latest AI neural systems, learning takes place by slow adjustment of weights\
    \ of the network. It is further based on if the networks make precise predictions\
    \ with data training. The basic task in such learning is to provide information\
    \ about the importance of each neuron’s activity. It also provides information\
    \ about the right and wrong predictions made by neurons. So when there is an association\
    \ between active neuron and wrong decision, the activity of neurons dwindles as\
    \ well as the weights of the incoming links and connections. Since there could\
    \ be several layers of neurons and a number of connections between neurons, this\
    \ makes the task difficult for even quantum computers. The influence of a neuron\
    \ over a prediction could also be assessed by using chain rule in calculus, which\
    \ shows the propagation of information from the outer layer of the network, layer\
    \ by layer to the inner layer. This is termed as “backpropagation” of error. And\
    \ yes, the calculation and computation of network making use of this model might\
    \ involve a billion of computations in the advanced networks. Latest neural artificial\
    \ intelligence development platforms can easily get it done with a couple of lines\
    \ of program coding.  "
