    深度学习的革命才开始影响机器人领域，这在很大程度上是因为机器人领域难以获取驱动人工智能中其他基于学习领域的大型标记数据集。我们上面讨论过的强化学习消除了对标记数据的需求，这可能有助于帮助弥补这一鸿沟，但它仅要求系统能够安全地探索策略空间，而不会产生对系统本身或其他者有害的错误。可靠机器感知的进步（其中很大一部分将由机器学习驱动，包括力、计算机视觉和触觉感知）将继续作为推动机器人能力提升的关键因素。


    ## 计算机视觉

    计算机视觉中最突出的机器感知形式。它是随着深度学习兴起而发生变革的人工智能子领域。几年前，大多数视觉分类任务的首选方法是支持向量机。但由于大型数据集的可用（尤其是通过互联网）、大规模计算（特别是在
    `GPUs` 上）的汇聚以及神经网络算法的改进，使得在基准任务上的性能取得了巨大的进展和改进（例如 `ImageNet17` 上的分类）。计算机第一次在某些视觉分类任务上优于人类。目前的研究也更多地关注自动视频和图像描述生成。


    ## 自然语言处理 (NLP)

    通常伴随着自动语音识别，另一个非常活跃的机器感知领域是自然语言处理 (NLP)。自然语言处理是具有大型数据集的主流语言中快速增长的商品。根据 `Google`
    的，目前约 20%的移动查询是通过语音完成的，最近的演示证明了实时翻译的可能性。进一步的研究正转向开发精细的系统，这些系统能够与人交互，不仅是对风格化的请求做出反应，还能通过对话。


    ## 协作系统

    对协作系统的研究调查了算法和模型，以帮助开发与人类和其他系统协作工作的自主系统。该研究依赖于协作形式模型的开发，以及对系统成为有效伙伴的能力的研究。日益增长的兴趣在于利用机器和人类互补优势的应用——让人类帮助人工智能系统克服其局限性，并让智能体增强人类活动和能力。


    ## 众包与人类计算

    人类能力在完成任务方面优于自动化方法是一个事实，对人类和众包计算的研究调查了不同的方法，通过人类智能来增强计算机系统，以解决计算机本身无法很好解决的问题。这项研究仅在约
    15 年前被引入，它在人工智能领域已具有稳固的地位。众包最为人知的例子是 `Wikipedia`，它是一个由网民更新和维护的知识库，在深度和规模上超过了传统的编译信息源（如字典和百科全书）。众包的主要重点是设计创新方法来利用人类智能。对于解决科学问题，志愿者被公民科学平台激发，而像
    `Amazon Mechanical Turk` 这样的付费众包平台则提供了按需的人类智能访问。该领域的进一步工作促进了人工智能子领域的进步，包括 `NLP`
    和计算机视觉，因为它收集大量的标记训练数据和/或人类交互数据。目前的研究工作反映了根据不同的成本和能力，探索机器与人类之间理想的任务划分。


    ## 算法博弈论与计算社会选择

    人工智能和社会经济维度（包括激励结构）正受到关注。多智能体系统和分布式人工智能自 20 世纪 80 年代初以来得到研究，并随着 20 世纪 90 年代末互联网的启动而加速。系统存在一些天然要求，要处理潜在的不一致激励，包括自私利益的公司或人类参与者，以及基于此的自动化智能体。受关注的话题包括计算机制设计（一种激励设计的经济理论，寻求输入被真实报告的激励兼容系统）、激励一致的信息引导（预测市场、评分规则、同伴预测）、计算社会选择（一种如何汇总替代方案排序的理论）以及算法博弈论（市场均衡、牌室游戏和网络游戏的均衡，例如
    `Poker`——这种游戏在当前和过去几年中，通过无悔学习和抽象技术已取得了重大进展）。


    ## 物联网 (IoT)

    越来越多的研究力量正致力于这样一个理念：设备可以以广泛的方式相互连接，以共享和收集它们的感应信息。这些设备可以包括车辆、建筑、家电器、摄像头和其他物品。虽然连接设备是无线网络技术的问题，但人工智能可以使用并处理产生的海量数据用于有用且智能的用途。现在，这些设备正在使用令人眼目的各种通信协议。人工智能可以提供帮助并驯服这个“巴别塔”。


    ## 神经形态计算

    传统计算机实现冯·诺依曼计算模型，它将输入/输出、指令处理和内存模块分开。随着深度神经网络 (`DNNs`) 在各种任务上的成功，制造商正积极寻求替代计算模型——特别是那些受到生物神经网络
    (`BNNs`) 启发的模型——其目的是提高硬件效率和计算系统的稳健性。此类“神经形态”计算机目前尚未明确展现出巨大优势，刚刚开始变得商业化。深度神经网络
    (`DNNs`) 已经在应用领域创造了一次波澜。有可能，当这些网络不再是在标准的冯·诺依曼架构上模拟，而是在专用的神经形态硬件上执行和训练时，可能会引发更大的浪潮。

