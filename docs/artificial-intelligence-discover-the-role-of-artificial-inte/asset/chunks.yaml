    医疗管理人员将帮助减轻与各种并发症相关的复杂性，就像参与治疗过程一样。


    ### 药物与设备

    更紧凑的增强器和视觉辅助装置将缓解听力和视力退化的影响，改善健康状况和社交参与。改进的康复和居家治疗将减少对治疗机构或护理留留的需求。物理辅助设备（智能助行器、轮椅和外骨骼）将扩大行动不者的活动范围。研究小组预计，识别技术的进步将使老年人在家中获得更自由的活动。从根本上说，具有物理接近性和直接操作能力的社会管理人员（例如模仿具有主要交流能力的适应机器人）可能为新技术的应用提供支持。尽管如此，这将需要人工智能多个领域的融合——自然语言处理（NLP）、推理、学习、识别和应用自主性——以创建一个对老年人来说重要且实用的系统。这些进步还将引发对各个领域安全的关注，包括助手、家人和监护人，并为远比更强大、连接更紧密的人群带来新问题。


    ### 培训与教育

    过去十五年见证了人工智能在教育准备方面的显著进展。如今，教师和学生已广泛使用此类应用程序，尽管在 K-12 和校园环境之间存在差异。无论如何，高质量的指导将可靠地需要人类教师的动态投入，人工智能承诺重新设计各个层次的教育，特别是通过规模化的个性化。像医疗服务一样，如何最好地组织人机互动和面对面学习与极具前景的人工智能技术相结合是一项关键挑战。机器人长期以来一直是信息设备，从
    20 世纪 80 年代 MIT 媒体实验室的早期 Lego Mindstorms 套件开始。科学、数学、语言和各种需求的智能辅导系统 (ITS) 将学生与直觉机器导师联系起来。标准语言处理，特别是与人工智能和公开支持相结合时，已经帮助了电子学习，并让教师能够在复制其研究领域规模的同时，关注特定学生的调整需求和风格。来自大型电子学习平台的教学方案已经控制了学习评估的快速发展。


    尽管如此，学校和大学在接受人工智能进展方面一直滞后，主要由于缺乏优势以及缺乏有力证据证明它们能帮助学生实现学习目标。在北美一个普通城市在未来的十五年里，使用智能助手和其他人工智能开发来帮助教师在考场和家中，预计将由内向外扩大，正如电脑生成的现实（VR）应用的学习一样。尽管如此，基于电脑的教育结构不会完全取代学校的人类培训。


    ### 机器人教育

    如今，不同机构已提供用于 K-12 学校的动态精制多功能软件包，这些机器人可以使用多种语言编程，并具有新的识别技术。`Ozobot` 是一种教授青少年编程和进行逻辑推理的机器人，同时通过挖掘隐藏的代码计划来移动或玩游戏。`Cubelets`
    帮助青少年通过社交活动机器人方块来思考、行动或感知，取决于不同方块的限制。超级工作坊的 `Dash` 和 `Dot` 扩展了编程的边界。八岁及日益准备良好的儿童可以使用视觉编程语言
    `Blockly` 进行练习，或使用 `C` 或 `Java` 编写 iOS 和 Android 应用。`PLEO RB` 是一种机器人宠物，通过展示机器人对自然界不同部分的反应帮助青少年学习科学。无论如何，虽然对孩子来说很有趣且具有社交性，但要让此类软件包普及，必须有说服力的证据证明它们提高了学生的学业表现。


    ### 智能辅导系统 (ITS) 与网络学习

    ITS 是从研究实验室任务发展而来的，例如 `Why-2 Atlas`，它通过人机对话来处理材料科学，在那个时代就处于领先地位。ITS 从探索性研究阶段到认证用途的快速发展令人惊讶且欢迎。可下载的软件和在线平台，例如
    `Carnegie Speech` 或 `Duolingo`，使用自动语音识别 (ASR) 和 `NLP` 策略提供模糊口语训练，以识别语言错误并帮助用户纠正。辅导系统，例如
    `Carnegie Cognitive Tutor`，已在美国中学中使用以帮助学生学习数学。


    各种 ITS 已发布用于地理、电路、医学研究、计算机培训和编程、先天特性和科学的规划。抽象导师使用程序模拟高于平均水平的人类导师的行为，例如，当学生在某个数学题上卡壳时提供经验。根据所涉及的知识和提供的反馈，导师会提供情境化的表达分析。


    应用程序正在创造前沿的教育。一种名为 `SHERLOCK` 的 ITS 开始用于教授空军专业人员分析航母上的电气系统问题。此外，南加州大学信息科学学院开发了更先进的基于图像的训练模块，为派往全球哨站的军事人员行为做好准备，同时管理来自不同社会阶层的人员。用于微调教学的新计算，例如贝叶斯知识追踪
    (`Bayesian Knowledge Tracing`)，实现了个性化的掌握学习和问题排序。影响最大的是大规模开放在线课程 (MOOCs) 以及各个层次的网络学习模式——包括对
    `Wikipedia` 和 `Khan Academy` 等设备的使用，以及作为同步学习的官方系统以及独特的指导和灵活学习的机械装置。

