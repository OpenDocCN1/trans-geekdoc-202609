    他补充说，公司在技术性能方面应当透明，以解决工作流中的疑虑。他表示：“因此为员工提供‘内部’知识，让他们能够清晰地想象 AI 如何增强他们的目标，而不是消灭它们。”


    ## 10. 平衡构建


    Pokorny 讨论到，当你在开发 AI 方法时，需要同时满足技术需求和研究工作。Pokorny 提到：“即使在开始创建 AI 程序之前，首要考虑的问题也是你应该构建具有稳定性的机器。这听起来可能是显而易见的，但很多时候，AI
    系统是围绕团队设想获取研究目标的特定领域而创建的，而不理解辅助研究的硬件和程序上的某些要求和局限性。结果实际上是一个不理想的、功能故障的程序，无法实现所需的目标。”


    ![](img/image-x62lfk51.png)


    要做到这一点，公司必须为存储空间、图形处理器（`GPU`）和网络留出足够的带宽。安全措施也是一个经常被忽视的组成部分。AI 从本性上需要大量信息来完成工作。


    请确保你理解哪些形式的数据无疑与工作相关，并且你通常的安全措施——加密、电子专用网络（`VPN`）和反恶意病毒软件——可能不够。Pokorny 提到：“同样，你必须平衡用于完成研究的总预算支出方式与通过冗余措施防止能源故障及其他情况的必要性。你可能还需要具备灵活性，以便在用户规范更改时允许设备被重新利用。”


    ## AI 如何影响日常生活？


    ![](img/image-83ri5mdu.png)


    ### 自动化运输系统


    运输市场很大程度上拥抱了技术的进步。根据（Zhang and Minbiole 2016），人们已经实施了 AI 工程来制造自动驾驶汽车。尽管出于安全考虑汽车需要驾驶员，但这些创新充分证明了目前技术进步中
    AI 的巨大作用。例如，让汽车自行行驶并绕过物体是困难的。允许同一辆汽车通过路口并防止与不同车辆碰撞的技术具有关键的创新性（Cunha et al. 2016）。实现这些事情中的每一件绝对都是神奇的，而且
    AI 借用了大量的技能和理解。AI 因为自动驾驶汽车背后的技术在多个方面改善了人们的日常活动。通过自动驾驶，事故发生的数量大幅减少（Harper, Hendrickson
    and Samaras 2016）。通常，事故与多种因素有关，如酒精、超速、处方药、激进驾驶、应对不足、对公路标志及路况的无知、持续的反应瞬间和过度补偿。


    考虑到大约 40% 的完全事故是因为酒精和物质滥用的影响。因此，通过全面执行自动驾驶汽车，本可以挽救的生命多出 1100 多条。


    ## 参与危险工作


    AI 生成的机器人越来越多地被设计用于支持人类承担危险情况。机器人接管了对人类危险的职位（Smith & Anderson 2014）。许多危险工作包括拆除炸弹，这对真实人类来说造成了巨大的风险。因此，随着机器人的进步，拆弹已变得容易，因为机器人可以轻松执行，且几乎没有任何恐惧。正因如此，机器人已经极大地帮助了在目前依赖的最危险工作中挽救了数千人的生命（Abdalla
    et al. 2016）。最后，随着 AI 的进一步改进，更多职位将无疑被机器人取代，这可能包括产生毒素的焊接。在高温下和在震耳欲聋噪音环境下工作的人将极大受益于
    AI 的理解。在这方面，AI 的执行已极大帮助为人类提供了安全措施并防止了伤害（Helbing et al. 2017）。


    ## 计算机方法


    根据 Vermesan 及其同事（2017）的观点，如今，自动化的推理、理解以及人类感知方式已成为人们日常活动的一部分。在长途驾驶和旅行中使用 `GPS`，智能手机技术的使用，都是
    AI 在人们生活中发挥作用的良好范例。有了 AI，错误发生的概率降到了最低，特别是在打字时，因为计算机可以预测我们将写的内容，并对打字错误的短语进行纠正。这显然是
    AI 设备运作的一个典型案例。此外，每当人们在社交网站上上传图像时，AI `algorithm` 就会识别并为他们标记标签（Smith & Eckroth
    2017）。此外，AI 数据通常很好地应用于银行和金融机构，以控制和安排统计数据。AI 技术的使用减少了错误数量并提高了准确性的概率。此外，AI 特性对神经科学医学分析和复杂神经系统疾病分析做出了显著贡献。例如，在使用
    AI 时，医生可以确定患者的健康风险，并确定多种药物的医学副作用（Hussain and Qamar 2016）。


    专门地，AI 启发了医学分析行业，导致了尖端研究，反过来拯救了生命。


    显然，许多人理解 AI 的意义以及它在提高生活质量方面发挥的作用。从之前提到的图表来看，59% 的人认为 AI 极大影响了他们的生活，24% 的人没有意识到
    AI 所处的位置，17% 的人不知道它是否发挥了任何作用。


    ![](img/image-x62lfk51.png)


    ## 减少人类努力


    AI 在人类日常生活中发挥着重要作用。今天，多个行业正在利用人类技术开发执行真实人类追求的设备（Frey and Osborne 2017）。这些资源确保了制造速度、性能和效率的一致性，保证了质量工作的监管。因此，AI
    技术在生活的各个方面发布，承诺了一个无错误的世界。这确实如此，因为设备可以规律工作而不会疲劳，不像人类，这加速了执行任务的功能并将提供准确的结果。


