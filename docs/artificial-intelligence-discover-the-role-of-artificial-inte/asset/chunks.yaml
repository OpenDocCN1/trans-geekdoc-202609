    机器翻译（MT）的发展将进一步使以合理的准确率将信息材料翻译成不同语言变得更加简单，就像现在它对特定手册进行解读那样。目前仅依赖于人工中介的教科书理解将不断改进改进策略，以提高其在教学体系中的应用速度和准确性。正如我们所知，由于这些领域正在快速发展，电子学习系统也将为成年人和职场人士提高知识和技能（或重新培训并熟悉另一个领域）提供开放途径。这将推动完全在线硕士学位的增长，类似于依赖在线课程的硕士学位。


    ## 更深远的文化影响


    在普通民众难以获得教育的国家，如果大众拥有获取这些资源的设备，在线资源可能会产生积极成效。在线教育资源的进展应该使那些协助全球信息任务的基金会能够更方便地通过提供工具，并在很大程度上直接参与其使用的培训，来提供优质教育。


    例如，大量的信息应用程序（其中大部分是免费的）正在适用于 `iPad`。另一方面，学生中目前出现了一个巨大的倾向，即将他们的社交活动限制在电子社交上，并在在线活动中投入大量精力而缺乏面对面的接触。由于指导越来越多地在网上发生，缺乏与同伴标准的、密切的面对面接触会对学生的社交发展产生什么影响？某些进展甚至似乎导致了神经反应。另一方面，具有医学意义的青少年已经受益于目前与
    `MACHINE INTELLIGENCE` 系统的协作。


    ## 低资源社区


    在北美的一的一个普通城市中，人工智能存在多种开放途径，来改善低资源配置社区的人的生活状况——毫无疑问，它已经经常在各种情况下开始出现。理解这些即时的人工智能责任可能同样尝试满足中国家的潜在需求。在人工智能社交活动中，对这些人并没有产生巨大的关注，事实上，人工智能的资助者对缺乏商业应用的研究投入不足。


    凭借集中的火花和赞助需求，人工智能发展可以帮助解决低资源系统的需求。发展中的企业是充满前景的。通过消除对人工智能可能导致失业和其他社会问题的担忧，人工智能可以提供缓解措施和方案，特别是当其执行于受影响系统对其产生信任的环境时。


    ## 计算机智能、数据挖掘策略


    在“为了社会进步的数据科学”旗帜下，`MACHINE INTELLIGENCE` 已被用于创建智能模型，帮助政府机构更切实地利用其有限的预算来解决问题，例如铅污染，这是一个由于密歇根州弗林特不断发生的而引起关注的重大公共健康压力。青少年可能因铅水平升高而面临问题，但遗憾的是，这意味着问题在他们已经受到影响后才被简单识别。目前有许多项目正在利用智能模型帮助政府保护危险中的儿童，包括那些可能尚未被发现的人。


    基本上，伊利诺州人类服务部（`IDHS`）使用智能模型来识别面临不良出生结果的孕妇，以扩大产前护理的影响。辛辛那提市利用它们主动识别并向有违规风险的房屋发送筛选。


    ### 计划


    任务分配和协调系统已被不同的社交场合应用，用于在食物变质前发放食物，从可能过剩的人（例如，餐厅）到食物银行和需要帮助的人。


    ### 利用社交网络实现影响力化


    关系关联可以成为一种进行更早、更广泛的话题干预的手段，包括大量人群。例如，`MACHINE INTELLIGENCE` 可能选择协助传播健康相关信息。在洛杉矶，有超过
    5000 名贫困的青少年（13 至 24 岁）。特定的干预措施是不方便且昂贵的，而且青少年对强度的不确定性意味着关键信息最好通过合作伙伴领袖进行传播。计算机智能任务可能选择利用贫困青年的关系关联，有针对地挑选同伴领袖来传播健康相关信息，例如如何避免
    `HIV` 的传播。


    这些框架的动态、模糊的性质为 `MACHINE INTELLIGENCE` 的研究带来了困难。同样应该采取措施，防止 `MACHINE INTELLIGENCE`
    结构复制单面的偏见，例如，通过非法的种族标记识别人的 AI，或者通过极度相关的代理部分，例如邮政分区。无论如何，只要经过深思熟虑地传递，对 `MACHINE
    INTELLIGENCE` 日益明显的依赖最终可能实现隔阂的减少，因为 `MACHINE INTELLIGENCE` 程序通常比人类更容易进行有效的检查。


    ## 公共安全与保障


    ![](img/image-83ri5mdu.png)


    城市社区目前已经为公共健康和安全提供了人工智能技术。到 2030 年，普通的北美城市将严重依赖这些技术。这些包括用于监控的摄像头（可以识别突出潜在犯罪行为、抢劫的异常情况）以及预测性警务应用。同样，对于大多数问题，既有优势也有风险。增加公众信任至关重要。虽然人们确实担心融合人工智能的警务在某些特定情况下可能会变得压迫性或不可避免，但反之情况也是可能的。计算机智能可能使警务变得更加集中并仅在需要时使用。此外，在谨慎部署的情况下，人工智能可能还帮助消除人类基本领导中固有的偏见。


    人工智能研究最有效的应用之一是识别高成本犯罪，例如信用卡勒诈。网络安全（包括垃圾邮件）是一个普遍关注的问题，人工智能正在产生影响。

