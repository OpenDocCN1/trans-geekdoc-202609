    ## 交通与递送

    这可能是最明显的例子之一。自动驾驶汽车的兴起很容易归因于——是的，你猜对了——`AI`。像 `Tesla` 这样的公司已经将自动驾驶车辆的现实直接推向了传统领域。然而，此并不止于此。你上班的方式，无论是通过旅游巴士还是火车，都可能变成完全自动化的。事实上，`GE`
    和 `Toyota` 等许多机构正寄希望于此。我们不要忽视个人接收包裹的方式也将得到改进。`Amazon` 甚至 `Walmart` 已经在对无人机自动运输和递送计划进行投资。


    ## 社交媒体

    你每天都使用社交媒体，也许稍微有点过度了。尽管关于它有许多争议，但 `AI` 确实影响了你在社交媒体上的行为、点击、查看和互动。`AI` 获取了你过去所有的经验、互联网搜索、互动以及你所做的许多事情，并为你量身定制社交媒体体验。事实上，这让你的社交媒体更具有成瘾性。


    ## 视频游戏

    你可能每天都会花几个小时玩游戏。有趣的是，`AI` 不仅让视频游戏变得更有趣，还让游戏制作变得简单得多，并对创作者更加开放。`Google` 和 `Nvidia`
    正在开发由强大的 `AI` 完全驱动的巨大开发者工具。


    ## 银行与金融

    从纳秒级执行库存交易到为优质长期投资提供建议，`AI` 正在推动经济和银行业的发展。即使当你与银行的客户服务聊天时，你极可能正在与一个 `AI chatbot`
    对话。尽管如此，`AI` 已经准备改变我们在金融领域进行投资的方式。


    ## 导航与旅行

    所以你可能已经深知这一点：`AI` 渗透到了你生活的每一个角落。如果你认为旅行能让你脱离 `AI` 主宰的控制并安全无忧，那么你就错了。无论是使用 `Google`
    还是 `Apple Maps`，给朋友叫 `Uber` 还是预订机票，`AI` 都在全程协助你。


    # 遵循这 10 个步骤在你的业务中采用 AI


    智能行业喜爱的事之一是人工智能 (`AI`)。它具有不同的应用场景，涵盖范围从高端数据科学到自动化客户服务，这项技术遍布全球和各个企业。让我们讨论一下你的业务如何安全且高效地受益。


    人工智能 (`AI`) 显然是现代技术行业中一种增长的力量，因为它在会议上占据了中心位置，并在零售和制造业等各种行业中展现出巨大的潜力。新产品不断被嵌入虚拟助手，而聊天机器人可以
    24/7 在供应商网站到你的网络托管服务提供商的支持页面回答你的任何问题。同样，`Google`、`Microsoft` 和 `Salesforce` 等大型先进公司正在将
    `AI` 集成到其整个技术栈的智能层。是的，我们可以说 `AI` 在全球范围内拥有它的时刻并主宰着行业。


    这并不是流行文化所改变或让我们预期的那种 `AI`；它不是感知机器人或“天空网”，甚至不是托尼·斯塔克的 Jarvis 助手。这种 `AI` 大流正在每个人眼前的表面发生，它让我们现有技术变得更智能，并释放了企业收集的所有数据的力量。这到底意味着：随着机器学习
    (`ML`)、计算机视觉、深度学习和自然语言处理 (`NLP`) 的广泛发展，在工作中使用算法定理已经像烤蛋糕一样简单。


    对于企业来说，根据你组织的具体需求，可以通过各种方式添加实用的 `AI` 应用，业务智能 (`BI`) 从你收集的数据中获取信息。企业将使用 `AI` 用于从挖掘社交信息到驱动客户关系管理
    (`CRM`) 参与，再到涉及追踪和管理资产时的供应与效能优化。


    `TechCode` 世界 `AI+ 加速器`计划负责人 `Luke Tang` 表示，`ML` 在 `AI` 开发中起着关键作用，该计划孵化 `AI` 初创公司，并帮助企业在其现有产品和服务的基础上整合
    `AI`。


    “现在，人工智能是由机器学习的所有最新进展驱动的。没有单一的突破，但我们现在从机器学习中提取的业务价值是惊人的，”`Tang` 说，“从企业的角度来看，现在发生的事情可能会导致某些围绕控制和协调的核心业务流程发生中断：报告、调度和资源分配。”


    我们从一些专家那里提供了一些建议，以解释企业可以在组织中添加和使用 `AI` 的步骤，并确保你实施的任何内容都能取得成功……


    ### 1. 熟悉 AI

    花时间熟悉时尚 `AI` 能做什么。`TechCode 加速器`通过与大学和 `AI` 领域公司组织的合作，为其初创公司提供大量资源。你必须充分利用在线数据和资源，让自己了解
    `AI` 的基本概念。`Tang` 推荐了 `Udacity` 等机构提供的许多远程工作坊和在线课程，作为入门 `AI` 以及扩展你组织内计算和预测分析等领域知识的简单方法。


    * 以下是一些你可以用来开始的在线资源：

    *   `Udacity` 的 `Intro to AI` 课程和 `AI Nanodegree Program`

    *   `Stanford University` 的在线课程：`AI: Principles & Techniques`

    *   通过 `edx` 由 `Columbia University` 提供的 `AI` 在线课程

    *   `Microsoft` 的开源认知工具包帮助开发者掌握深度学习算法

    *   用于机器智能的开源 (`OS`) `Google Tensor Flow` 软件库

    *   来自 `AI Access Foundation` 的 `AI Resources` ASCII 文本文件代码目录

    *   计算机科学促进协会 (`AAAI`) 的资源页面

    *   `MonkeyLearn` 的机器学习简明指南

