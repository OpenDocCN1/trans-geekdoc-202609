    在 21 世纪 00 年代，自动驾驶汽车的梦想已经在海洋和天空成为现实，甚至在火星上也是如此，但自动驾驶汽车最有效的存在是以实验室研究原型的形式存在的。在大都市中使用它们，由于行人、交通拥堵以及可能出现在汽车控制之外的许多突发事件等因素，被认为是一个过于复杂到无法实现自动化的难题。尽管实现这种自给自足行驶所需的组件在
    2000 年已经可用——而且事实上确实存在一些自运行车辆原型——但很少有人预料到主流机构能够在 2015 年发展并部署自运行汽车。在 2004 年美国高级研究计划局（DARPA）首次关于自主驾驶的高级研究“大项目”期间，研究团队未能在一个有限的荒凉地区投放中完成任务。但在
    2004 年至 2012 年的短短八年里，学术界和企业界都发生了快速且惊的发展。传感技术的进步和用于决策任务的机器学习知识加速了发展，结果是，谷歌的自动驾驶汽车和特斯拉的半自动汽车如今正行驶在城市街道上。谷歌的自动驾驶车辆已经行驶了超过
    1,500,000 英里（在没有意外的情况下为 300,000 英里），它们完全完全的——不需要人类进入。


    特斯拉通过软件更新在现有车型中广泛发布了自动驾驶功能。他们的汽车是半自主的，预计人类驾驶员保持参与，并在他们遇到潜在麻烦时接管。这种半自给自足的方法是否可持续目前并不总是清楚，因为随着人类对汽车的能力变得更加自信，他们可能会对道路的关注减少，并且在最需要它们的时候变得越来越不那么依赖它们。2016
    年 6 月发生的一起涉及自运行汽车的乘客身亡事故，使这一问题进入了更敏锐的意识中。


    在不久的将来，传感算法将在所需的实用能力上实现惊人的人类级整体性能。计算机感知（包括视觉）在识别和跟踪等定义良好的任务中，已经接近或达到了人类水平的整体性能。通过算法升级，可能会在更高级的推理能力（包括规划）方面观察到认知的进步。最新文献预测自动驾驶车辆将在
    2020 年被广泛采用。而自动驾驶能力的采用将主要局限于私人交通。


    我们将看到自动驾驶和远程控制的货运汽车、飞行器和面包车。包括共享出行在内的点对点交通服务也可能利用自动驾驶车辆。除了自动驾驶汽车之外，机器人技术的进步将促进其他种类自运行汽车的创造和采用，包括机器人和无人机。需要多少自动驾驶车辆才能产生巨大的吸引力目前并不总是清楚。半自动驾驶汽车所需的协作及其对人类驾驶员认知负荷的影响并不总是被很好理解。但如果未来的自动驾驶汽车按照预测的速度发展，并且它们在驾驶方面超过了人类水平的表现，将观察到各种广泛的社会变革。自动驾驶汽车将消除美国意外死亡和伤害的最主要原因之一，并延长人类的寿命。通常情况下，美国的一名通勤者单程驾驶需要花费
    20-25 分钟。在自动驾驶汽车时代，人们在通勤期间可能有更多时间来工作或娱乐自己。而且自动驾驶汽车和共享交通带来的舒适度增加和认知负荷减轻，也可能对人类选择居住的地方产生影响。停车需求的减少也可能影响城市和公共空间的设计。


    自动驾驶汽车可能要求增加人口各个子群的自由和流动性，包括青少年、老年人和残障人士。自动驾驶汽车和点对点交通服务也可能会推迟拥有汽车的愿望。对车辆总使用的影响很难预测。空载行驶和增加出行意愿可能会导致总里程的增加。作为替代，共享汽车——人们将汽车作为服务而非私人拥有——如果结合良好的激励（如收费或折扣），也可能减少总里程。共享交通的可用性可能会取代公共交通的需求——或者公共交通也可以转向私人快速交通，这已在
    4 个城市实现。随着自动驾驶汽车的普及，关于其安全的问题将会产生，如何确保技术在发布之前不同的道路条件下是安全的且经过良好的。


    ### 交通规划


    到 2005 年，城市已经开始投资交通基础设施以开发对车辆和行人的感知能力。目前使用的传感器包括感应线圈、摄像头、远程访客微波传感器、雷达和 GPS。例如，2013
    年，纽约开始使用微波传感器、摄像头网络和读取器来发现大都市的交通流量。


