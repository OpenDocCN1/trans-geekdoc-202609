    争论已经超出了机器是否能像人类一样“思考”的范围。如果“可思考”机器的梦想成为现实，毫无疑问，这将产生深远的社会影响，并使我们所生活的社会基础发生永久性的改变。尽管如此，专家系统目前的成功似乎已无悬念。


    ## 专家系统的社会影响


    利用专家的脑力并将其传递以帮助他人，一直是专家系统发展的主要驱动力。这是人工智能最积极的潜力之一。正如 Reddy 所言，“以信息产品的形式分享专长和知识，是缩小富人与穷人之间这一不断扩大的差距的唯一途径。”
    专家系统可以作为共享知识财富的手段；与弱势群体分享财富具有极其重要的意义。随着智能 AI 应用开发的不断取得，我们可能在“帮助所有国家和世界的文盲、贫困和弱势群体”的道路上走得很好。虽然专家系统在使用方面对我们的社会生活具有重要意义和益处，但也存在可能导致伦理和极其困难的法律困境的因素和潜在缺陷。


    虽然在战场上部署作为命令指令的逻辑机器显然是愚蠢且危险的，但请想想用于引导携带成千上万乘客飞机的空中交通控制系统，或者用于可能协助医生处理生死关头的医疗诊断系统？这些系统给出错误建议可能会发生什么？问责制将毫无意义，因为应该由谁承担责任呢？此外，当涉及到自主思考并意识到自身存在的系统时，它们是否会给出错误的建议，而无论这种建议是有意的还是无意的？在未来，你认为法律体系是否应该扩展到处理机器，就像艾萨克·阿西莫夫的小说《机器人三定律》中那样？


    专家系统的开发还引发了关于谁应该拥有知识的问题，且应该有一个所有者。理查·L·邓对此问题提出了一系列问题：“是你的雇主，还是你？你应该向出现在你办公室的知识工程师分享多少内容？如果他‘抽干你的大脑’，你对公司的价值是增加了还是减少了？你的公司是否被允许获取这些智能并将其赠送或卖给他人或某一方，而不向你提供补偿？”
    显然，知识产权法和版权法已经非常完善。


    雇主拥有职业生涯期间开发的具有版权保护的材料和可申请专利的产品至关重要。但对于你在工作中获得的经验和知识，它们是否受到同样的监管？归根结底，经验和知识是市场化商品。因此，这就是雇主雇佣你的原因。然而，假设这些经验或知识以某种方式存储并捕获到一个你不再控制的计算机系统中，或者该计算机系统从一群与你拥有相同专业知识的人或其他人那里获得了经验和知识，公司是否还需要你的服务？在太晚回答这些问题之前，最好为应对这些问题做好准备。


    人类智能的复杂性以前被低估了，特别是在专家系统领域。专家系统的开发中仍然存在管理挑战和技术局限。然而，尽管早期受到挫折，`CASE` 技术和其他先进技术的成功，使得专家系统的未来似乎是光明的。此外，必须仔细考虑在专家系统技术进步过程中一定会出现的伦理和法律问题。如果自主“可思考”机器的梦想真的变为现实，我们所知的生活将发生永远改变吗？


    ## AI 在日常生活中的应用


    ![](img/image-83ri5mdu.png) 我们在日常生活中以多种方式使用人工智能。我们每天、每小时、每分钟都在使用、管理并对 AI 做出反应。由于行业缺乏熟练的劳动力，企业需要使用
    AI。公司聘用程序员创建特定任务，通过机器和软件的帮助来实现劳动力自动化。让我们以实践的方式理解、管理和使用 AI。


    ### 1. 自动化重复任务


    AI 通过让操作更快、更可靠，为任何操作带来了友好的变化。对于重复性任务，如在指定时间分享社交媒体博客、计划发布帖子等，都通过 AI 变得简单。例如，你银行账户每月固定的定期存款、自动账单支付、自动信用卡充值等，这些简单任务消耗了我们的时间，而
    AI 被用于帮助我们完成这些任务而不浪费我们的时间。


    AI 实现了这种方法：“让机器扮演你的角色”。


    生产、回收、清洁、基础设施建设、设计、运输和许多工程工作大部分由 AI 机器完成。这些机器非常智能，它们收集数据和信息，并能够做出决定。30 年前，所有这些工作都是人类使用机器手动完成的，但
    AI 取代了它们，因为 AI 更可靠，出错概率更低。这些机器收集数据和信息，并对其进行处理和分析以使工作更高效。


    AI 或自动化是基于以下方法编写的。


    #### i) 用户行为预测


    注意搜索引擎如何提供句子补全建议？当用户向算法机器输入并进行查询时，它会预测用户可能想输入什么。这意味着搜索引擎被程序化进行类似的搜索，响应式网站会根据用户设备自动调整。这意味着网站设计（`CSS`）已经过过程序，以在任何设备上保持用户界面和用户体验一致。


    你一定在思考如何能预测未来的某些行为。确实，没有人能预知未来，但 AI 正在接近它，你想知道它是如何发生的吗？这一切都是通过我们日常生活中使用的每台机器和应用程序所收集的数据实现的。机器收集的数据模式和用户行为由计算机和人类进行分析。这就是为什么他们正在通过编程语言来收集、管理和分析各种数据，并为未来创建自动输出的原因。


