    为了提供不间断的娱乐、无限流量数据包、更快的视频流媒体甚至视频会议，为业务提供全球最快的网速，以及为大学生提供网站和程序的在线学习、课程和学位课程，这种特定市场中利用人工智能将几乎所有内容提升到下一个水平的最新概念被称为“雾上计算”（fog
    up computing）。云计算程序和系统是基于人工智能开发的。在这些特定领域，企业、语言学校、联邦机构等可以建立远程基础设施、远程数据存储、备份和事件管理等。雾上基础设施的编程方式使其根据应用程序内的特定负载自动扩展其存储、加速、安全及许多其他功能。


    ![](img/image-x62lfk51.png)


    简单来说，如果有一百名学生（网站和应用程序流量）正在使用或甚至指令应用程序执行特定功能，那么人工智能会立即切换服务器开关指向 M 点；如果实时有 300 名学生针对同一个应用程序，它将自动将存储空间扩展到
    C 点。


    现在，由于一切运行得非常快，没有存储问题，没有维护成本等，这对于使用这些技术的人来说快速又舒适。对于企业而言，在涵盖生活大部分部分的价值交换中，将云计算与人工智能集成到日常实际上是可行的。关于人工智能在日常生活中的应用，我们可以说，人工智能正在将我们的日常生活和工作生活推向新的标准、方法、新常规、创新的健康习惯、新类型的疾病以及与之相关的问题和解决方案。我们许多人可以说，我们正在再次将信息技术推向新的高度。在过去，发生了许多变化，从互联网的发明到搜索引擎、社交媒体营销和广告以及在线学习。


    ## 人工智能的优势与缺点


    ![](img/image-83ri5mdu.png)


    如今，随着人工智能、机器学习和云计算，我们正在进入一个全新的世界。在这里，你可以发现自动驾驶汽车、高质量产品、个性化应用、情境化和个性化的替代方案、自动故障检测甚至故障排除、更快的决策生成（商业智能）、创新的园艺、均衡饮食扫描机及程序、生产力的提高、大气保护方法、人脸识别的新想法、回收利用的创造力、帮助人们增强的新型业务模式，以及以前从未想过的新理论。


    但这些通常只是人工智能在日常生活中的优点。它也有反的一面。人工智能的结果也有负面影响，例如，人类失去了面对机器和自动程序的工作机会。同样令人担忧的是机器和应用程序将了解你的财务状况、位置、社交圈等许多信息。


    代理是你全新的虚拟朋友或商店助理，由于一切都是完全自动化的，这可能会导致许多男女的生产力降低。焦虑和压力可能成为人类最大的问题，而人工智能未来将呈现的久坐生活方式无疑更糟。全球范围内拥有更多专业能力和创造力的人将成为最强大的力量。从技术上讲，这是一个数据驱动的世界。人工智能如果使用得当，就像人们日常生活中的恩赐。但它也有自己的缺点。现在这取决于我们许多人能为设备提供多少心理管理。我们对哪些技术不会让我们成为奴隶有多大的信心。


    人工智能应用的一些巨大好处将是巨大的，并且可以改善任何专业领域。为什么不看看这些人呢：


    ### 1) 减少人为错误

    “人为错误”这个词的产生主要是因为人类会偶尔出错。然而，如果个人电脑设计得恰当，它们就不会导致这些错误的发生。有了人工大脑，决策是通过应用选定的算法集从以前积累的信息中获得的。


    结果是错误减少了，而且以更高精度达到准确性的概率通常是可能的。在利用人工智能进行的天气预报中，他们减少了大部分的人类问题。


    ### 2) 由机器承担风险而非人类

    这将是人工智能最大的优势之一。通过开发可以代表我们执行风险任务的 AI 机器人来克服人类的许多风险限制。让它去往火星、拆除炸弹、探索深海区域、煤炭和石油采矿，这可以成功地用于任何自然或人为的意外事故。见过乌克兰典型的切尔诺贝利核电站爆炸吗？当时没有人工智能驱动的机器人可以简单地通过早期阶段操控火源来帮助我们最大限地减少辐射结果，每个靠近核心区域的人在几分钟内就了。他们最终通过微型直升机从远处倾入了细沙和硼。AI
    机器人可以用在这种干预总是危险的情况下。


    ### 3) 24x7 全天候可用

    普通人类每天工作 4-6 小时，不包括休息或间隙。人类的构造方式是为了留出时间来恢复精力并为新一天的工作做好准备，这些人甚至还有每周休息，以保持工作、生活和个人生活的平衡。但通过使用人工智能，我们都可以让机器
    24/7 不断运行而无需休息，而且它们不像人类那样会感到无聊。教育机构和帮助热中心收收到大量的查询和问题，这些问题反可以通过人工智能成功处理。


    ### 4) 帮助处理重复性工作

    在我们的日常工作中，我们都在执行许多重复性工作，如发送新的感谢邮件、验证特定文档的错误等许多工作。应用人工智能，我们能够成功地自动化这些枯燥的任务，甚至可以为人们消除“无聊”的任务，释放他们的时间去变得更有创造力。在银行，我们所有人经常看到为了获得抵押而进行的多次文件验证，这是银行所有者的一项重复任务。通过典型的
    AI 认知自动化，所有者可以加快文件验证的速度，买家和所有者都将从中受益。

