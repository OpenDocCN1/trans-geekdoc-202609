  trans: '

    许多研究人员以多种方式反驳了这一观点，但它确实损害了人们在不同的生命关要应用中对机器以及所谓专家系统的信任。在 1956 年的达特茅斯 AI 夏季暑期研究项目中，麦卡锡（McCarthy）组织了一场研讨会，人工智能（AI）在会议上正式诞生并被命名为一个领域。研究机器模拟智能某些方面的方法被视为该项目的目标——这一持续推动该领域发展的重点且核心的思想。在提案书中，麦卡锡与纳撒尼尔·罗彻斯特（Nathaniel
    Rochester）、马文·明斯基（Marvin Minsky）和克劳德·香农（Claude Shannon）共同创作。虽然功归于整个团队，但麦卡锡因使用“人工智能”这一术语而闻名，并被归为此人。在参与者中，许多人开始在
    AI 的旗号下工作并领导了重大项目。这些伟大人物对 `AI` 充满热情，包括亚瑟·萨缪尔（Arthur Samuel）、塞尔里奇（Selfridge）、奥利弗（Oliver）、雷·所洛门诺夫（Ray
    Solomonoff）、赫伯特·西蒙（Herbert Simon）和艾伦·纽威尔（Allen Newell）。达特茅斯研讨会建立了一个专门的研究社区和 AI
    领域的统一身份，但许多描述人工智能的技术思想在早期就已经存在了。


    托马斯·贝叶斯（Thomas Bayes）在上世纪为事件概率的推理提供了一个框架。乔治·布尔（George Boole）在那个世纪展示了追溯到亚里士多德的逻辑可以通过类似于求解方程组的方式系统地进行。世纪末，实验科学的进步导致了统计学出现，借此可以从数据中得出严谨的推论。物理构建机器和可执行指令序列的想法捕捉了先驱们的想象力，例如查尔斯·巴贝奇（Charles
    Babbage）。到 20 世纪 50 年代初，这一想法已经成熟并导致了第一批电子原始机器人的制造，那时它们已经具备了自主感知和行动的能力。在艾兰·图灵（Alan
    Turing）的帮助下，支撑计算机科学成为可能的最重要的思想和贡献之一。艾兰·图灵提出了计算的形式模型。图灵的经典论文 `Computing Intelligence,
    and Machinery` 构想了计算机的可能性，它是为了模拟智能而创建的，并探索了许多现在与 AI 相关的元素。这些包括可能如何测试智能，以及机器如何自动学习。AI
    的灵感正来源于这些思想。尽管图灵无法获得将其思想转诸行动所需的计算资源。


    在 20 世纪 50 年代到 1970 年代的二十年间，人工智能的追求中出现了几个重点领域。西蒙（Simon）和纽威尔（Newell）开创了对启发式方法的探索——`Heuristic
    search` 是一种在大型和组合空间中寻找解决方案的高效程序。他们特别将这一思想应用于构建数学定理的证明。这首先通过他们的 `Logic Theorist`
    程序实现，然后通过 `General Problem Solver` 实现。塞尔里奇及其同事在计算机领域早期的字符识别工作，为脸部识别等更复杂的应用奠定了基础。此外，自然语言处理（NLP）的工作在
    60 年代后期已经开始。“谢基”（Shakey）是 SRI International 制造的一个轮式机器人，移动机器人领域也随之启动。萨缪尔的国际跳棋程序通过自我对弈来改进自己。这恰好是机器学习系统首批运行的实例之一。罗森布特（Rosenblatt）的
    `Perceptron` 是一种基于生物神经元的计算模型，作为人工神经网络领域的基础而出现。费根鲍姆（Feigenbaum）等人提倡构建专家系统——即为医疗诊断和化学等专门领域定制的知识库。


    早期的概念进展假设存在一个可以进行推理的符号系统。但到 20 世纪 80 年代初，尽管取得了这些令人前景的进展，但实践与理论之间的差距出现了，部分源于人工智能社区对直接访问环境数据的系统重视不足。此外还过度强调被称为布尔逻辑的
    `True/False`，忽略了量化不确定性的必要性。在 80 年代中期，当人们对人工智能的兴趣下降资金枯竭时，该领域被迫承认这些缺点。这一时期被尼尔森（Nilsson）称为“AI
    寒冬”。90 年代迫切需要的再度复兴是基于这样一个观点：“老派 AI”作为端到端的方法构建智能系统是不够的。相反，智能系统必须从头开始构建，随时解决当前任务，尽管熟练程度不同。技术进步也使得构建由现实数据驱动的系统变得可能。可靠且廉价的执行和传感硬件使得机器人更容易制造。


    此外，互联网收集大量数据的能力，以及处理这些数据的计算存储和算力的可用性，使得统计技术和从设计上从数据衍生解决方案的方法成为可能。这些发展使得人工智能在过去的二十年中脱颖而出，对我们的日常生活产生了深远影响，我们将在以后详细介绍。


    # 专家系统 ![](img/image-83ri5mdu.png)


    ## 概述


    专家系统旨在对多个特定知识领域的专家进行建模的计算机程序。专家系统通常有三个基本组成部分：包含人类经验和知识的规则与事实的知识数据库，处理咨询并确定如何进行推理的推理引擎，以及与用户交互的输入/输出接口。根据
    K. S. Metaxiotis 等人的，专家系统的特点是：


    - 不仅使用数值计算，还使用符号逻辑；

    - 具有数据驱动的处理；

    - 包含特定知识领域显性内容的知识数据库；

    - 能够以用户更容易理解的方式解释结论。


    20 世纪 50 年代初，专家系统首次作为人工智能的一个集出现，兰德-卡内基团队开发了通用问题求解器来处理几何问题、定理证明和国际象棋游戏。与此同时，MIT
    的约翰·麦卡锡（John McCarthy）后来发明了 `LISP`，这是后来专家系统和人工智能领域主导的编程语言。

    '
- fmt: '

    # Evolution of Expert Systems


    The expert systems were increasingly used in industrial applications during the
    1960s and 1970s. Let’s know about some of the famous applications during this
    decade were `MYCIN` (a medical diagnosis system), `DENDRAL` (a chemical structure
    analyzer), `ACE` (AT&T''s cable maintenance system), and `XCON` (a computer hardware
    configuration system). In 1972, `PROLOG` was created as an alternative to `LISP`
    in logic programming designed to handle computational linguistics, especially
    `NLP` (natural language processing).


    Artificial Intelligence was perceived as a direct threat to humans at that time
    because expert systems were considered revolutionary solutions capable of solving
    problems in any area of human activity. This perception was built that would later
    bring an inevitable skeptical backlash. These successful systems stimulated a
    near-magical fascination with smart applications. The industry largely deemed
    the expert systems as a competitive tool to sustain technological advantages.
    By the end of the 1980s, 500 companies were involved in either maintaining or
    developing expert systems. Expert systems usage improved with a growth rate of
    30% a year. Companies like `TI`, `IBM`, `DEC`, `Xerox`, `HP`, and universities
    such as `Stanford`, `MIT`, `Carnegie-Mellon`, `Rutgers`, and many more had taken
    part in pursuing expert system technology & developing practical applications.


    ## Current Applications


    Expert systems have expanded nowadays into many sectors of our society and can
    be found in a broad spectrum of areas such as credit authorization, health care,
    chemical analysis, financial management, corporate planning, genetic engineering,
    oil and mineral prospecting, automobile manufacture and design, and air-traffic
    control. As K. S. Metaxiotis and colleagues pointed out that the importance of
    expert systems is increasing in both decision support, which provides options
    and issues to decision-makers, and decision making where people can make decisions
    beyond their level of experience and knowledge.


    Expert systems have distinct leads over traditional computer programs. Expert
    systems, in contrast to humans, can provide permanent storage for expertise and
    knowledge; once programmed to use and ask for inputs, it offers a consistent level
    of consultation; and provide support as a depository of knowledge from potentially
    unlimited expert sources and thereby provide support in the comprehensive decisions.


    ## Key Technological Issues


    Numerous unresolved technical performance limitations and issues that severely
    affect the implementation and development of expert systems. The most critical
    of these problems confronting institutions and corporations and the solutions
    thereof will be examined in this section.


    The major technological issues facing expert systems lie in the areas of software
    methodology and handling uncertainty, knowledge acquisition, and validation.


    ### Software Standards and Interoperability


    there is no general standard in development methodology and expert system software,
    neither commonly adopted expert system infrastructure and protocols exist. The
    knowledge system is developed uniquely with a little consideration for interoperability.
    With the coalition of the American Association of Artificial Intelligence (`AAAI`),
    `DARPA`, the `IEEE` Computer Society, and the US government, recent efforts in
    defining expert system standards have been actively pursued. Development complexity,
    risks, and costs could be reduced once widely accepted standards are established,
    and also the expert system new generation tools are in place.


    ### Knowledge Acquisition and Analysis


    Knowledge Acquisition and Analysis is usually considering a way to discover the
    static facts of the world and the relationships of many different events that
    human performs in solving real-life problems. Human''s problem-solving skills
    oftentimes are far more complex and complicated than what the knowledge collection
    can achieve. Let’s consider an example; humans at an early age normally learn
    how to walk sometimes through practices and sometimes painful experiences. This
    kind of error know-how and trial is not accessible in the form of rules and facts.


    Asking a human to articulate a set of rules based on their know-how, mainly the
    reflection of skills, will not be accurate. Furthermore, knowledge systems do
    not learn from their experience. You might have heard about the Case-based reasoning
    (`CBR`) theory. This theory focuses on solving new problems that are based on
    similar past problem solutions. This seems to be capable of eliminating the complex
    task of maintaining facts and rules using the adaptive acquisition of problem-solving
    techniques. `CBR` does not handle to assemble and process commonsense knowledge,
    and therefore the `CYC` project developed by `Cycorp Inc.` aims to handle this.
    The expert systems in the future could integrate the commonsense knowledge from
    the `CYC` project with the application-specific modules to be captured from `CBR`
    for the enhancement of their analysis process and knowledge acquisition.


    ### Handling Uncertainty


    Due to the lacking of precision in inputs and rules, the ability of expert systems
    to derive correct output is often compromised. The inference engine builts upon
    algorithms manipulating knowledge in the form of a decision tree that is not designed
    to handle uncertainty. Some expert systems incorporate fuzzy logic to cope with
    imprecise inputs and rules in areas such as linear and nonlinear control, financial
    systems, pattern recognition, and data analysis.


    Present labels are usually used by the fuzzy logic in such systems to categorize
    real-time inputs, and utilizes fuzzy inference in calculating numerical outputs
    and conclusions from imprecise rules.


    ### System Integration


    Knowledge database has no easy access. The `LISP`-based expert system tools lack
    the ability of integrating with other applications that are written in traditional
    languages. You should know that most of the systems are still not portable among
    different hardware. Such issues of system integration can contribute to higher
    risks and costs. For this, the requirement of new system architectures can fully
    integrate knowledge databases and external systems.


    ### Validation


    expert systems quality is often measured with its comparison to the results of
    those derived from human experts. However, there are ambiguous validation or verification
    techniques specifications. Adequate evaluation of an expert system remains an
    open question, although several attempts have been made in utilizing pre-established
    test cases that are developed by independent experts in verifying the reliability
    and performance of the systems.


    ## Managerial and Organizational Challenges


    Successes in the economic or technical sense of an expert system do not guarantee
    long-term use or a high-level of adoption rate in businesses. During the early
    and the middle of the 1980s, expert systems built as surveyed by `T. Grandon Gill`.
    The key results of all the systems surveyed were as follows:


    * about 1-3rd were being actively maintained and used

    * about 1-6th were though available to users but were not being maintained, and

    * about one-half were abandoned.


    This survey indicated another problem, which was the problems suffered by some
    of those machines that fell into disuse had neither an economic nor technical
    basis.


    ### Alignment of Technology and Business Strategy


    a substantial amount of investments and efforts are also involved in expert systems.
    Inconsistency between the technology and the organization’s business strategy
    could ultimately ruin such efforts and money.

    '
