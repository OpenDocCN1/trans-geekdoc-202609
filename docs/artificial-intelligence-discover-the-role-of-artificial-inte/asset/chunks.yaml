    尽管天文学和音乐在清单上并不算显眼，但也许是因为它们现在被包含在想象力和科学等术语中了。人工智能对高级数字技能的直接影响要求高级 AI 和 `ML` 模型的增长，这在某些领域需要极高的能力水平。这也是目前
    AI 专家薪资极高的原因之一。神经 AI 专家数量可能每年都在增加，但要在该领域进行尖端实践所需的基础理解，需要顶尖水平的数学、科学和技术技能，而这些技能很难获得。高级
    AI 方法的扩展需要对线性代数、统计学、微分方程以及计算机架构以及新兴芯片技术和工具有良好的理解。这种强制性的人才组合相当稀缺，最新的估算拥有这套技能的人数在万左右。有特定的
    5,000 人在过去几年发表过学术研究或在 AI 会上做过报告。可以预测，AI 的卓越洞察力和当前的需求将相对快速地引导人才进入这一领域。例如，自 2018
    年启动以来，来自 80 多个国家的约 90,000 名学者注册了为期六周的“AI 元素”课程，该课程是由芬兰 AI 中心作为 AI 教育计划的一部分组织的。


    这门入门课程在立法者、公共部门以及试图营造 AI 扩张感的私营组织中广泛传播。然而，AI 高级能力不能快速学会，AI 相关人才的短缺可能会对教学和学习产生严重的无意影响。2017
    年，全球 AI 相关的商业并购和收购规模约为 218 亿美元，缺乏收入的初创企业为每个 AI 专业人员筹集的资金高达 500 万至 1000 万美元。由于高素质专家现在可以获得非常丰厚的年薪，大学在寻找该领域优秀教师方面将面临巨大问题。某些应用工作可以通过培训人员使用开放的开发工具和学习资源来完成，但关键任务型应用的增长需要相当创新的技能。这种状况的一个相当即时的结果是，高级
    AI 能力和计算能力可能会以服务的形式提供。这可能意味着对高级 AI 能力将不会有巨大的需求。由于高额的工资差异，许多统计学、数学物理、数学、计算机以及芯片设计以及可能的神经生理学学者可能会重新评估他们的职业路径，并发现成为
    AI 专家的新身份。


    此外，在目前宽松的学习环境中，对先进技术和探索的开放获取可能也意味着高级 AI 能力可能会从意想不到的地方出现，例如，通过开源硬件和开源软件小组。通常，AI
    可以用于三种根本上不同的技术，这些技术可能对儿童和成人的人类推理能力增长产生不同的影响。


    首先，AI 可以维持现有能力。当能力被定义为领域特定知识和行为范围的结合时，人工智能可以减少对人类理解、技能和能力的需求，并强调行为范围的重要性。结果是人类本质上不需要学习以前对于经验行为是必要的领域特定知识。具体来说，当领域特定意识对于能力变得不再那么时，跨领域和独立于领域的通用能力可能会变得更加重要。


    ### 2030 年的人工与生活


    直到那时，人工智能的吸引力在于它的承诺。在过去的 15 年里，许多承诺已经兑现。该领域正在从简单的智能系统转向构建可信的系统。有几个因素推动了 AI 革命。这些因素中首位的是机器学习
    (`ML`) 的成熟，这在很大程度上得到了云计算的支持。这种信息处理算法的性能飞跃与感知、传感和目标识别等基础操作硬件技术的重大进展相伴。数据驱动的新市场和平台也有所贡献。


    ### 研究趋势


    驱动该研究“热点”领域的趋势描述如下。


    #### 大规模机器学习 (ML)

    机器学习中的基本问题已经得到了理解，例如监督学习和无监督学习。扩展现有算法以处理极大规模数据集是当前努力的重点。让我们举个例子；传统方法在处理数据集时可以负担进行多次扫描，而其他现代方法被设计为只进行一次扫描；在某些情况下，只有亚线性方法可以被接受。


    #### 深度学习 (DL)

    训练卷积神经网络 (`CNNs`) 的能力对计算机视觉领域受益最多，应用包括活动识别、目标识别、视频标注及其若干变体。深度学习也大幅渗透了其他感知领域，例如语音、音频和自然语言处理
    (`NLP`)。


    #### 强化学习

    正如我们所知的，传统的机器学习主要侧重于模式挖掘，但强化学习将重点转移到决策能力，这项技术将帮助人工智能更深入地进入执行学习和关于真实世界行动的领域。作为一种框架，基于经验驱动的序列决策已经存在了几十年，但这些方法在实践中尚未取得巨大成就，主要归因于扩展和表示的问题。然而，深度学习的到来为强化学习注入了一剂“强心针”。AlphaGo
    最近的成功——Google Deepmind 开发的这一在 5 局比赛中击败人类围棋冠军的计算机程序——很大程度上归功于强化学习。AlphaGo 的训练是初始化一个自动智能体和人类专家数据库，随后通过自对弈进行大量游戏进行完善，在此过程中应用了强化学习。


    #### 机器人

    机器人导航在静态环境中已基本解决。目前，努力的方向是考虑如何训练机器人以预测和可泛化的方式与周围世界交互。另一个当前关注的话题是交互环境中产生的这种自然需求：操纵。


