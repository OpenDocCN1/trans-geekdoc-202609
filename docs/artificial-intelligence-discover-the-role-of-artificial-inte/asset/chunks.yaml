    为了实现未来的进步，临床人员必须从开始就参与到其中，以确保结构构建良好且值得信赖。成功地，另一批日益精通的专家正在常规地在 `PDAs` 上使用特定的应用程序。与此同时，基础性工作仍需完成，但临床人员的工作范围已扩展到他们渴望来自任何方面的帮助。因此，误用新的学习技术、通过挖掘智能写作来创建诱导的复杂实例，以及通过支持自由形式交易来建立可验证的心理伙伴，这种机会从未像现在这样显而易见。只要这些进步不受到权威、现实和社交限制的阻碍，那么医疗服务水平的巨大提升就掌握在我们手中。


    ![](img/![](image-x62lfk51.png)


    # 医疗分析


    在人群层面，`ROBOTICS` 挖掘大量患者临床记录的能力有望实现更精细、更具个性化的分析和治疗。随着全基因、唯一的基因组测序成为每位患者的标准配置，基因型-表型关联的自动化披露也将变得可能。


    一项相关的（可能更早）能力将是发现“像我那样的患者”，通过对相似伴侣进行分析来指导治疗选择。传统的和非传统的医疗保健信息在社交阶段的扩大下，可能会导致自我特征化亚群的出现；每个亚群由一个通过机械提议和检查框架增强的综合医疗服务系统管理。随着大量人的医疗系统和终身临床记录变得可用，这些进步可能会从根本上改变医疗服务的提供。同样，从可穿戴设备中自动获取个人生态数据将扩展个性化医疗。随着供应商发现连接庞大人口（例如
    `ShareCare`）并随后生成可以挖掘以提供个性化研究和建议的人口规模数据的方法，这些活动变得越来越经济可行。


    遗憾的是，`FDA` 一直推迟批准创新的指示性程序，快速进展仍存在许多遗留障碍。`HIPAA`（健康保险可移植性与责任法案）对于确保隐私保护的要求，为患者信息流向可能可能使用
    `ROBOTICS` 技术的应用程序造成了合法障碍。然而，批准药物的预见负面影响可能会比现在更频繁、更早、更彻底地出现，探索关联关系的便携应用可能会被阻止从授权记录中提取基本数据。此外，总体而言，医疗领域人工智能的研究和发展受到缺乏广泛认可的安全保障策略和原则的阻碍。`FDA`
    推迟支持创意程序，在某种程度上是因为对这些框架成本/效益权衡的理解模糊。如果监管机构（主要是 `FDA`）认为成功的展示后报告是对某些风险的可靠屏障，那么更快地批准新药物和干预措施可能会变得可能。


    机械图像解释长期以来一直是一个受关注的焦点。翻译命名糟糕的巨大图像文档（例如从网络上抓取的巨大照片档案）的进展一直困难。


    ## 图像解释


    从一开始；令人惊讶的是，医学图像解释尚未发生类似的变革。大多数医学成像模式（`CT`、`MR` 和超声）本质上是数字化的，图像完全归档的，并且有内部研发部门的大型机构（例如
    `Siemens`、`Philips`、`GE`）致力于成像。无论如何，到为止，一些障碍限制了进展。大多数医诊图像文件在过去的十年中才变得数字化。更重要的是，医学中的问题不在于看到图像中有什么（这是肝脏还是肾脏？），而是对其做出精细的判断（肝脏中微深色的斑块是否意味着一个具有破坏性的肿瘤？）。准确的指南指导着这些高风险的决策。事实上，即使有了最先进的进展，放射学家目前可能还需要查看图像，因此这种建议还没有说服力。此外，医疗保健指南阻止了跨基础信息的简单组织。因此，毫无疑问，协调考虑的大协会（例如
    `Kaiser Permanente`）可以解决这些问题。


    ## 未来展望


    总而言之，自动化/增强的图像翻译开始获得动力。未来十五年可能不会带来完全自动化的放射学，但对图像“分诊”或二级检查的初步探索可能会提高医学成像的速度和成本效益。当与电子患者记录系统相结合时，大规模的人智能算法可以应用于医学图像信息。例如，不同的重要医疗保健系统拥有大量患者的记录，每份记录都有放射学报告，且大多数都有相关的患者记录。目前，已有论文表明，深度神经网络可以通过从这些信息中进行训练，以高可靠性交付基本的放射学发现。


    # 医疗保健中的机器人


    十五年前，医疗应用的自主通常是科幻小说。一家名为 `Robodoc` 的公司（`IBM` 的产品）为骨科手术创建了机械系统，例如髋膝关节置换。这项技术起了，但该公司在财务上陷入了斗争，并最终因其技术被关闭并收购。


    然而，最近，精密机械自主性的研究和实际应用发生了爆炸。2000 年，Intuitive Surgical 展示了 `da Vinci` 系统，这是一项从头开始的创新，使痛苦的心脏手术避免了手术刀，并在
    2003 年与其单一大型测试 `Computer Motion` 合并，为前列腺癌治疗建立了巨大的市场平衡。`da Vinci` 直到其第四代，提供了 3D
    表示（而不是 2D 单眼腹腔镜）和人体工程学阶段的手腕器。它被视为各种腹腔镜方法的标准，并每年在约七十五万次手术中应用，提供了一个物理阶段，更重要的是另一个用于思考医疗系统的安排。


