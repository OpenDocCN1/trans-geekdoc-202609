  trans: '


    # 面向未来


    许多经济学家、理论家和专家对超人工智能系统不可避免的出现发表了高调声明，认为这些系统最终可能在生活的许多领域取代人类。或许值得脚注的是，大多数 AI 学习模型所体现的认知能力，在仔细观察之下，非常类似于生物学特征。关于人工智能未来的几项预测仍然立足于对过去技术进展的推断，以及对计算领域
    `Moore''s Law` 持续性的特定猜测，并对人类学习的创新形式与额外的基础性关系能力之间的差异表示轻微担忧。


    人类学习需要几项元层面的能力。具体而言，对于人类来说，了解什么构成了知识，如何继续获得、生产和习得知识至关重要。在学习过程中如何控制推理、礼貌和情感，以及学习的共同和应用动力是什么。正如
    `Luckin` 最近指出的，现今的 AI 需要大部分的元认知和控制能力。值得注释的是，目前 AI 的未来在很大程度上将受到芯片设计增长的驱动。


    在近五十年里，计算机和内存芯片的增长受到半导体芯片组件结构缩减的快速且持续发展的推动。在过去的十年中，人们逐渐认识到这种扩张接近终点，需要新方法来推动半导体行业的发展。神经人工智能学通过将增长转向新的计算模型以及模拟计算，开启了“后摩尔定律”时代。这标志着知识基础技术基础上的一个关键缺口。在实践中，大多数人工智能专家致力于
    `narrow AI`（狭义人工智能），而不是 `general AI`（通用人工智能），后者将具有类人类的能力。在人工智能的第一次达特茅斯夏季项目中，首席研究人员表示计算机很快就会变得智能。这种希望在今天看来似乎是不切实际的。尽管增长能力类似于人类智力的
    AI 结构可能是可能的，但现有的 AI 系统定制了相当基础的学习模型以及生物智能。


    许多现代 AI 系统依赖于根本性的反射和行为主义学习模型，这些模型是由世纪初的科学家 `Pavlov` 和 `Thorndike` 推动的。因此，它们可能被更准确地称为机械倾向，而非人工智能。尽管有这些局限性，人工智能在教育领域的力量在过去的三十年里得到了广泛认可。尽管对教室的影响相对较小，但新的发展表明这种情况可能会发生转变。具体而言，基于
    AI 的系统可以作为支持教师和初学者的系统得到广泛使用。AI 还可以快速调整经济和劳动力市场，为教育和教育系统产生新的需求。


    ## AI 对技能与能力需求


    ![](img/image-83ri5mdu.png)


    现行教育体系的重要作用之一是，它创造了允许人们为生活的经济领域做出贡献的能力。教育系统的过去与工业社会的增长密切相关，而工资劳动在工业社会中仍然是一个主导性的建立准则。在先进的政策辩论中，教育因此被认为是就业的原因。在这种理解下，教育是经济产出和效率的关键驱动力，围绕教育的政策是从经济发展的角度概述的。因此，从教育系统的角度询问
    AI 将如何改变工作和劳动力市场也是非常重要的。对于经济学家来说，首要问题是机械化和自动化兴起是否会导致失业。随着技术提高劳动生产率，维持生产所需的人力会更少。如果技术取代了特定的工作，人们就会转而其他工作。事实上，这种微弱的模型无疑太简单了。总的来说，这就是上世纪发生的情况，当时农业和制造业工作被计算机化，工人转向了服务业。许多影响力的研究证实了这一设计。通过使用过去的统计数据，它们特征性地完成了额外的技能和劳动产出并没有增加失业。相反，众所周知，机械化没有产生持久性失业的一个重要原因是人口增长，这不断放大了对制品和服务的需求。许多其他原因，如全球化、教育、对不可再生自然资本的摄入增加、医疗保健、科学的增长也参与了上世纪经济的发展，因此利用传统设计对未来进行预测是困难的。尽管一些有力的研究声称机械化没有产生失业，但可能因此也有价值回顾机械化的历史及其社会问题。工业化导致了从普鲁士到墨西哥、俄罗斯以及全球的动荡，往往伴随着痛苦的代价。许多生命被丧失。


    ### AI 对技能需求的影响


    '
- fmt: '

    The ground-breaking research by `Frey` and `Osborne` enquired specialists in `AI`
    and robotics what are those possible holdups that prevent the mechanization of
    labor work. Using these computerization blockages as an initial point, they then
    enquired the specialists to categorize a set of `OINET` jobs grounded on whether
    mechanization of their jobs seemed conceivable. Those jobs that didn’t encompass
    hard-to-automate tasks remained categorized as having a significant risk of being
    automated. A critical upshot of the `Frey` and `Osborne` reading is that it foretold
    that about partial of `U.S.` jobs are at great peril of being mechanized shortly
    using present-day technologies. Whether this approximation is precise or not,
    it still elaborates the opinion that educational systems will be below strong
    gravity to discourse this wide-spread change. The outdated educational arrangement
    has vexed to forecast the future demand for diverse kinds of education founded
    on projected labor market growths. `Frey` and `Osborne` displayed that `AI` will
    have an essential influence on the labor market, and generate breaks in numerous
    trends that presently reinforce educational development and policies. We, consequently,
    need to reassess both the content and the purposes of education in this fresh
    setting.


    ## AI impacts on Skill-biased and task-biased models of technology


    Many previous studies on the impact of computers and automation were based on
    skill-biased prototypes of the technological amendment. In skill-biased models,
    occupations that do not need cultured, knowledgeable, and skillful labors are
    vulnerable to mechanization. In such models, `PCs` are projected to be used mostly
    for jobs that need narrow skills. It is natural to undertake that to circumvent
    joblessness people need extra and higher-level education as well as training.


    On the other hand, current studies on mechanization have accepted a task-biased
    method. It accepts that those jobs that can be precisely defined can be programmed
    with a computer. In these lessons, jobs that entail tedious tasks are vulnerable
    to mechanization. This has characteristically directed investigators to assume
    that jobs that need human-like intellect are not vulnerable to computerization.
    The effect for educational policy could be that education should emphasis on non-routine
    mental tasks, often branded as 21st-century expertise. `Osborne` and `frey` used
    a task-biased model, but they reasoned for a diverse tactic. In their opinion,
    the effect on `AI` and automation must be studied grounded on present technological
    tailbacks. `AI` is quickly becoming able to achieve tasks that have conventionally
    been agreed upon to need human thought.


    According to `Frey` and `Osborne`, it is consequently significant to ask specialists
    what computers cannot ensure. All those errands where practical blocks do not
    occur may be computerized, and if a job contains such tasks, it is vulnerable
    to computerization. Outside such an occupation-level examination, it is exciting
    to drill down to specific jobs and consider how `AI` could change them. We have
    done this for the `OINET` Middle School Teachers. The table lists certain of the
