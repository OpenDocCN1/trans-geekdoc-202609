    # 全球发展与 AI 研究的前景


    数据驱动模型的确定成就已经淘汰了 AI 的传统标准。例如，定理验证、基于逻辑的理解说明和理性推理等措施正受到越来越多的关注，这在很大程度上是因为通过现实世界训练进行持续连接的任务日益频繁。作为
    20 世纪 70 年代和 80 年代 AI 研究支柱的规划，由于其对难以满足真实请求的显示模式的严重依赖，也已不再那么关注。


    基于规则的方法——包括基于物理的程序到视觉以及机器人中的传统控制和映射——已经完全让位给了数据驱动的方法，后者在项目处理中通过感知动作的结果来接近闭环。贝叶斯推理和图模型（尽管目前仍然非常流行）似乎也正在过时，因为它们被海量信息流和深度学习知识的巨大成就所淹没。


    在接后的十五年里，研究小组预计具有人类感知能力的新兴系统将增加，这意味着这些系统能够精确建模，并准确针对其协作对象的人类特征。人们非常关注日益普及的、符合人类安全的推理推理能力和机器人显示场所将会发展，数据驱动的产品及其市场也将如此。研究小组还假设，随着从业人员开始理解纯深度学习方法的某些局限性，许多常见的
    AI 类型将再次出现。我们鼓励年轻研究人员不要重新发明轮子，而是要关注该行业前五十年里 AI 各个领域的许多进展，以及科学、心理学和控制理论等相关领域。


    ## AI 领域


    尽管 AI 研究和实践的特定案例共享通用技术（包括系统学习等），但它们在经济和社会的独特领域也存在显著差异。我们将这些领域称为“领域”，并在本节中描述 8
    个领域 AI 研究和实施的独特状态，以及它们的影响和独特的挑战：交通；家用/服务型机器人；医疗保健；教育；低资源社区；公共安全与保障；就业与工作场所；以及娱乐。


    基于上述分析，我们还预计未来十五年内北美的普通城镇将取得发展。与流行文化中对 AI 的常见描述不同，我们寻求提供一个平衡的概述，说明 AI 如何开始改变普通生活，以及这些变化在到
    2030 年期间可能如何发展。


    ## 交通


    交通运输可能是公众首次被要求接受 AI 设备在重要任务中的可靠性和性的领域之一。自动驾驶交通将迅速变得常见，作为大多数人首次接触具身 AI 系统，它将对公众的
    AI 认知产生强烈影响。


    一旦物理硬件变得足够安全和坚固，它们在日常生活中的出现可能发生得如此突然，让公众感到惊讶并需要时间来适应。随着汽车变得比人更会，城市居民将拥有更少的汽车，生活方式更加便利，并将时间用于其他地方，导致一种全新的城市运作。此外，在
    2030 年的北美普通城市，调整将限于汽车和卡车，但可能涵盖飞行汽车和个人机器人，并引发社会、道德和政策问题。一些关键技术已经催了 AI 在交通领域的大规模应用。


    ### 智能汽车


    与 2000 年相比，如今关于私人和公共交通数据的规模和多样性——得益于智能手机的采用、成本降低以及各种传感器的先进精度——是惊人的。如果没有这些数据的记录和连接，包括访客实时感知与预测、路线计算、点对点拼车和自动驾驶汽车在内的方案现在将是不可能的。


    `GPS` 于 2001 年通过车载路由设备引入个人车辆，从那时起成为交通基础设施不可或缺的一部分。`GPS` 帮助驾驶员，同时为创新公司和城市提供大规模数据，几乎是交通设计。配备
    `GPS` 技术的多种智能手机协助扩展网络和个人共享的区域信息。目前的车辆还配备了广泛的检测能力。预计美国的普通汽车将拥有七十个传感器，包括编码器、加速度计、环境光传感器和湿度传感器。传感器不仅用于车辆。2000
    年左右制造的汽车具有车辆内部状态的传感器，例如其加速度、车轮位置和速度。


    它们目前已拥有的将实时检测与识别及决策相结合的总功能，例如`牵引力控制系统 (TCS)`、`电子稳定控制系统 (ESC)`、`防锁制动系统 (ABS)` 和气囊控制。自
    2003 年以来，自动化功能已不断引入商用汽车。这些功能帮助驾驶员或完全接管某些描述良好的运动，以提高安全性和豪华感。目前的车辆可以自动停车、在高速公路执行执行自适应巡航、在停车和交叉交通中转向，并在换道期间提醒驾驶员盲区内的物体。视觉和雷达技术已用于扩展预碰撞系统，该系统能够在检测到碰撞危险时让车辆自动刹车。深度学习也被引入以提高汽车识别环境周围物体和理解声音的能力。


    ### 自动驾驶汽车


    早在 30 年代，科幻小说作家就想象了自动驾驶汽车的未来，但由于 60 年代的原因，构建它们对 AI 社区一直是一个挑战。


