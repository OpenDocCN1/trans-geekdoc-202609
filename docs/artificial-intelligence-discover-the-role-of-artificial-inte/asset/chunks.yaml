    # 城市通过多种方法利用 AI 方法来优化服务，包括公交和地铁时刻表，以及追踪交通状况以动态调整限速，或在公路、桥梁和 HOV（高人数客车）道上实施智能定价。街道社区中传感器和摄像头的使用，还可以优化访客的微调时间以提高流动效率，并辅助计算机执法。这些动态技术旨在提高交通领域内有限资源的利用率，并由于数据供应和人员的高度连接而成为可能。


    ## 交通规划的演变与数据驱动系统

    # 在 2000 年之前，交通规划者面临压力，必须依赖与特定日期或时间相关的静态定价技术来控制需求。随着动态定价技术的出现，这引发了关于公共资源分配公平性的新问题，因为在需求过剩的情况下，市场状况可能导致部分公众无法获得服务。大规模数据的提供也使交通成为系统主控程序的完美领域。自
    2006 年以来，`MapQuest`、`Google Maps` 和 `Bing Maps` 等程序被公众广泛用于路线规划、乘坐公共交通、获取交通状况的实时统计和预测以及区域定位服务。


    # 理想的寻路算法已用于引导车辆和行人前往指定的旅游景点。尽管有了这些进展，但传感和优化策略在城市基础设施中的大规模应用仍慢于这些策略在个人汽车或人类身上的应用。尽管某些城市已经实施了传感和优化程序，但目前对于使用的传感基础设施和
    AI 策略尚未标准化。基础开销、不同城市之间的优先事项差异以及大多数参与方所担心的高协调成本阻碍了采用，公众对传感相关的隐私问题也是如此。尽管如此，AI 可能会对城市基础设施产生日益的影响。随着信息可用性的提高，对人类行为、替代方案和目标的准确预测模型很可能会出现。关于此类紧急情况的伦理问题将在本文第三部分进行讨论。


    美国交通部于 2016 年发布了一项提案征集，要求中型城市采用智能城市交通基础设施。该计划计划向城市授予 400 万美元，展示如何利用技术和数据重新想象人类以及物品的移动。


    ## 未来愿景与自动技术

    # 一个愿景是互联车辆网络，可以通过车车通信实现极高的驾驶安全性。如果这一富有想象力和远见的见解变为现实，我们预计多智能体协调、协作和规划方面的进展可能对未来的汽车产生重大影响，并在使交通系统更可靠、更绿色方面发挥作用。机器人还可能通过个人运动设备和应用参与交通（例如，`Segway
    robot`）。对于产品运输，人们对无人机的兴趣已经扩大，`Amazon` 目前正在测试一种使用无人机的运输设备，尽管在适当的保护法规和指南方面仍存在问题。提升的传感能力、无人机的采用以及相关的交通基础设施也将增加对个人隐私和私人信息保护的担忧。在未来几年里，这些和相关的交通问题将通过企业的预见性行动或法律框架来寻求解决。正如第三部分政策讨论中提到的，如何有效地完成这些工作将影响交通领域内
    AI 相关进展的步伐和范围。


    ## 按需交通

    # 按需交通服务（包括 `Uber` 和 `Lyft`）已发展成为传感、连接和 AI 的另一项核心支撑，通过利用位置和匹配度（声誉模型）算法为驾驶员和乘客进行匹配。除了动态定价外，这些服务通过支付意愿来调节准入，同时动态定价还鼓励了驾驶员数量的增加，并已成为城市交通的一种著名技术。随着它们的快速发展，出现了一些政策和法律问题，以及与现有出租服务的竞争，以及对缺乏监管和安全的担忧。按需交通服务似乎是接近自动驾驶汽车的主要压力来源。拼车和搭车一直被视为减少访客拥堵和提高私有交通资源利用的有效方法。`Zimride`
    和 `Nuride` 提供的服务让具有相似路线的人员共同出行。然而，这种拼车方式尚未在大范围内获得支持。


    ## 与人互动

    # 多年来，人们想象了各种截然不同、充满未来感的交通工具。尽管未来的车辆可能更智能，无人机可能更普及，但在 2030 年之前，我们拥有外观和功能与今天完全不同的通用交通工具的可能性极小。我们对小组的预期是，在这个时间范围内，能够飞行、游泳和动力的无人机，或飞行四翼机不会成为常见的交通方式（尽管目前已存在原型）。我们依靠人类在学习、执行和评估方面成为自动驾驶汽车和无人机的伙伴。这种伙伴关系体现在人类与机器物理及虚拟存在的同时。我们预测算法的进展将促进机器从人类输入中学习。我们还期待用于人类注意力建模的模型和算法，以引导人与设备之间的对话和协调。这是未来汽车改进的重要部分。


    ## 家用/物流机器人

    # 在过去的十五年里，机器人已经进入了人类家庭。遗憾的是，程序范围内的增长缓慢，与部署在现有程序上日益先进的 AI 并行。AI 的进展往往受到机械创新的启发，反过来促进了新
    AI 技术的引入。在未来的十五年里，机器驱动和 AI 技术的协同进步有望提高家用机器人在普通北美城市中安全可靠的使用和应用。


    ### 吸尘器

    # 2001 年，经过几年的开发，电动吸尘机器人 `Electrolux Trilobite` 成为主要的商业家用机器人。它具有简单的控制装置以执行避障和一些导航功能。


