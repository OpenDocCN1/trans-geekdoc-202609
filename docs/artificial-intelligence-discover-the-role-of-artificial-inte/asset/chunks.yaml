  trans: '


    `Frey` 和 `Osborne` 的突破性研究询问了 `AI` 和机器人领域的专家，究竟是哪些阻碍劳动工作机械化的可能障碍。以这些计算机化障碍为起点，他们随后要求专家根据其工作机械化是否似乎可行，对一组
    `OINET` 职业进行分类。那些不包含难以自动化任务的职业被归类为具有显著的被自动化风险。`Frey` 和 `Osborne` 研究结果的一项关键结论是，它预言了在何今技术下，大约大部分的
    `U.S.`（美国）工作在短期内正面临着被机械化的巨大危险。无论这一估算是否精确，它仍然阐述了这样一种观点：教育体系将缺乏足够的驱动力来应对这种广泛的变革。过时的教育安排一直难以根据预测的劳动力市场增长来预测对各种教育的需求。`Frey`
    和 `Osborne` 显示，`AI` 将对劳动力市场产生本质影响，并对目前加强教育发展和政策的许多趋势产生断裂。因此，我们需要在这一新背景下重新评估教育的内容和目的。


    ## AI 对技能偏向和任务偏向技术模型的影响


    许多关于计算机和自动化影响的早期研究是基于技术改进的技能偏向原型模型。在技能偏向模型中，不需要受过良好教育、具备知识和熟练技能劳动力的职业容易受到机械化的影响。在这些模型中，`PCs`
    被预计主要用于需要狭窄技能的工作。自然推断的是，为了避免失业，人们需要额外的、更高层次的教育以及培训。


    另一方面，目前关于机械化的研究接受了任务偏向的方法。它认为那些可以被精确定义的任务可以用计算机进行编程。在这些研究中，涉及繁琐任务的工作容易被机械化。这特征性地引导研究人员假设，需要人类智力的工作是不容易被计算机化的。这对教育政策的影响可能是，教育应该侧重于非常规的心理任务，这些通常被称为
    21 世纪的专长。`Osborne` 和 `frey` 使用了任务偏向模型，但他们论证了一种多样化的策略。在他们看来，必须根据当前的技术瓶颈来研究 `AI`
    和自动化的影响。`AI` 正在迅速变得能够完成传统上公认为需要人类思考的任务。


    根据 `Frey` 和 `Osborne` 的观点，询问专家计算机无法保证什么是至关重要的。所有没有发生实际障碍的任务都可能被计算机化，如果一份工作包含此类任务，它就容易被计算机化。在这样的这种职业层面的审查之外，深入研究特定工作并考虑
    `AI` 如何改变它们也是令人兴奋的。我们已经对 `OINET` 的初中学教师进行了这种研究。表格列出了教师的某些特定工作（正如它们在 `OINET` 中被列出的那样），处于其主职权力范围内。`AI`
    对工作的可能影响基于作者的计算，并被视为具有揭示性的。一种解释可能是，技术目前已经进步到了一个阶段，某些具有挑战性的人类心理活动（例如执行与教育、管理和通信相关的任务）也可以由计算机完成。更严厉的观点可能是，教师在目前的教育系统中承担了某种程度的自动化任务。高性工作的列表也反映了关于教学目的及其周围社会机构的深刻见解。例如，如果教育机构被用作社会筛选的工具，那么相对高风险的分析和成就评估可能至关重要。在强调增长（例如社会能力）的教育体系中，决定性的评估可能会在排名中靠前。


    ## 人工智能能力与三级模型中的任务替代


    如果我们利用三级活动模型，关于工作未来和人才需求的计量经济学研究似乎呈现出一种创新的视角。正如 `Von Neumann` 在大约五十年前所声称的那样，如果我们能够精确且明确地定义一项任务，就可能通过计算机来执行它。


    `Von Neumann` 讨论的是计算机模拟任何可以复制的系统的能力，但他也阐明了我们可能需要新的判断和新的形式来实现这一点。从中得出的一个谦的结论可能是，没有本质性的技术障碍会让机械化仅仅是一个梦想。


