    例如，其中的某些技能（如学习走路）在某种程度上是行为性的，也可以由 AI 驱动的机器人学习。相反，其中的几项工作还需要长时间的传统空间和社会空间。因此，可能使用
    `AI` 来模拟一位演奏钢琴家欢快地演绎巴赫的《哥尔德堡变奏曲》，并产生听起来相似的音乐。然而，对《哥尔德堡变奏曲》进行表现性的阐释需要对社会历史的广泛知识、对巴赫与其他音乐人之间关系的回响、对后世理解的意识，以及训练所需的时间。弹奏一个旋律可能只需要不到一秒，但要能够做到这一点可能需要多年时间。尽管音乐会钢琴家可能并非“普通”人这一点是不言而喻的，但几项非常典型的普通工作需要平行的文化化和智慧。无疑，维果斯基在
    20 世纪 30 年代的认知发展理论中的一个主要主张是：那些将人类与其他生物区分开来的创新智力，恰恰是那些不能被定义为弱小反射，而需要社会和社会学习的能力。这表明
    `Ng` 实际上是在讨论自然行为而非智力。因此，主要的自动化瓶颈不在于技术能力，而在于务实行为与其内涵之间的定性差异。


    ### 趋势与转型

    只要动作的核心是静态的，我们可能就能自动化这种行为，并通过使用大量此类行为的样本来学会。然而，人类教育的几种形式和人类推理的进步形式是建立在对原本不存在的地方意义的基础上。为了论述人类智力的这些领域，`AI`
    研究人员将需要远超目前 `AI` 中弃用的理解模型。因此，关于计算机化、自动化和 `Artificial Intelligence` 影响的计量经济教育是令人兴奋且紧迫的；然而，它们并很好地预测未来。总体而言，没有明确理由说明为什么古代趋势在社会经济变化中仍然可用。计量经济模型对于根据过去接受现状可能是重要的；但只有在没有发生重大变化的情况下，它们才能预测未来。这仅适用于基于数据的模型，而我们没有关于未来的实验数据。尽管，它们是有意义的，因为它们认为我们可以完全精确地预测未来：如果没有重大变化，目前盛行的
    `AI` 技术广泛使用将预示着与过去不同的未来。


    这种略不一致的结果表明，如果没有别的原因，那是因为付薪劳动曾是塑造工业时代、其制度和我们日常生活的中心因素。


    ### 作为数据偏向技术变化的神经 AI

    `Quintini50` 和 `Nedelkoska` 在 `OECD` 的最新研究对计算机化影响的计量经济研究给出了客观的评估，并利用 `OECD 成人技能调查
    (PIAAC)` 的输出扩展了 `Frey` 和 `Osborne` 的研究。`Nedelkoska` 和 `Quintini` 协调了 `Frey` 和
    `Osborne` 与劳动力市场及工作任务之间的 `PIAAC` 变量障碍，例如复杂性率、问题解决以及咨询或教育他人。`Nedelkoska` 和 `Quintini`
    使用的变量非常有效且纯粹语境化。对于 32 个国家的样本，他们确定了平均工作有 48% 的概率被计算机化，不同国家之间存在差异。


    经济学家已经雇用了技能偏向和任务偏向模型来研究计算机化、计算机和 `Artificial intelligence` 的影响。然而，`Neural AI`
    和 `ML` 并不完全符合这些模型。严重的瓶颈不在于工作是单调还是非单调的，或者它是否需要复合问题解决；相反，在于该工作是否可以被机器学习。


    这反过来取决于是否有可用于学习的统计数据。因此，`AI` 对工作的影响最好可以在“数据偏向”模型中达成共识。如果统计数据可以获取且历史重演，现在的 `ML`
    算法至少可以在代码中模拟过去。在学习、发明和知识形成关于联结当前知识片段的程度上，技术可能也很明于这样做。从技术主题的角度来看，此类行为是相当合法的。有充分理由预期，社会、经济和智力过程，以及其他可以被称为生命的系统，无法使用这种方法进行伪造。


    ### 教育：能力平台的创造者

    结果，`AI` 在用于增强人类推理以及辅助人类知识和感知时，可能会产生主要影响。这提出了一种广泛的信念，当 `AI` 用于学术目的和教育环境时，要把人类保留在圈内。假设某些工作（也许是车司机、公用事业表读员或数据录入员）将在未来几天内变得过时，教育政策的一个紧迫问题是这些工作的人如何转到新工作。加拿大皇家银行
    (`RBC`) 的新研究集中在这一查询上，发现了六组可以对加拿大的工作进行分类。


    此外，这项研究使用了 `OINET` 统计数据，但专注于技能而非工作，正如 `Frey` 和 `Osborne` 研究中的那样。`RBC` 研究认为，由于几项工作在技能要求上重叠，在这些小组内部培养技能，使人们在旧职业自动化时能够转到新工作，是相对没有压力的。这种方法平衡了这种观点：存在对未来至关重要的横向人才和能力。对于《欧盟
    终身学习关键能力》中定义的重要能力，以及《欧洲教育工作者数字能力框架》，也可能被提出类似的问题。我们将讨论可能对语言主要技能产生影响的一些示例能力。通常，对未来劳动力和技能需求的研究表明，学校未来绝不能侧重精确的工作相关专业知识。相反，教育应该产生允许真正的终身学习的能力阶段。相当不合逻辑，这种关于“平台教育”的观点认为，我们可能回到中世纪的三艺
    (`trivium54`) 和四艺 (`quadrivium55`)，以及它们的七大自由艺术。

