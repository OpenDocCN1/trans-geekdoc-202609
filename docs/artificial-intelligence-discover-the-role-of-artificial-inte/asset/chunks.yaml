  raw: "  Many researchers refuted this argument in numerous ways, but it does undermine\
    \ the faith of people in machines & so-called expert systems in different life-critical\
    \ applications.    At the AI Dartmouth summer research project, McCarthy organized\
    \ a workshop in 1956 in which Artificial Intelligence (AI) was officially born\
    \ and christened as a field. Investigation of ways in which machines could be\
    \ made to simulate aspects of intelligence was considered as the goal of this\
    \ project—the focused and essential idea that continue driving the field forward.\
    \ In the proposal, McCarthy co-authored for the workshop along with Nathaniel\
    \ Rochester, Marvin Minsky, and Claude Shannon. The overall credit goes to the\
    \ team, but McCarthy is well-known for the use of the term Artificial Intelligence\
    \ and is credited with it. Among the attendants, many people started working and\
    \ led significant projects under the banner of AI. These great people were passionate\
    \ about AI, including Arthur Samuel, Selfridge, Oliver, Ray Solomonoff, Herbert\
    \ Simon, and Allen Newell.    A dedicated research community and a unified identity\
    \ for the AI field was created at the Dartmouth workshop, many of the technical\
    \ ideas that have come to describe Artificial Intelligence existed much earlier.\
    \  \n\n  Thomas Bayes, in the century, provided a framework for reasoning about\
    \ the probability of events. George Boole, in the century, showed that logical\
    \ back to Aristotle—could be performed systematically in such a manner similar\
    \ to solving a system of equations. By the turn of the century, experimental sciences\
    \ progress had led to the emergence of the statistics field, with the help of\
    \ which inferences from data to be drawn rigorously. The idea of engineering a\
    \ machine physically and sequences of instructions to be executed, the imagination\
    \ of pioneers was captured, such as Charles Babbage. By the early 1950s, this\
    \ had matured and resulted in the construction of the first electronic Primitive\
    \ robots known for their ability to sense and act autonomously had also been built\
    \ by that time.    One of the most influential ideas and contributions that underpin\
    \ Computer Science becomes possible with the help of Alan Turing. Alan Turing\
    \ proposed a formal model of computing. Turing’s classic essay, Computing Intelligence,\
    \ and Machinery, the possibility of computers is imagined, which is created for\
    \ simulating intelligence and explores many of the ingredients that are now associated\
    \ with AI. These include how intelligence can possibly be tested and how machines\
    \ could learn automatically. AI is inspired by these ideas. Though Turing had\
    \ no access to the computing resources that are needed for the translation of\
    \ his ideas into action.  \n\n  Several focal areas in the quest for Artificial\
    \ Intelligence emerged between the two decades from the 1950s to the 1970s.   \
    \ Simon and Newell pioneered the foray into heuristic Heuristic search is an efficient\
    \ procedure for finding solutions in large and combinatorial spaces. They particularly\
    \ applied this idea to construct proofs of mathematical theorems. This was done\
    \ firstly through their Logic Theorist program, and then through the General Problem\
    \ Solver. Early work in character recognition in the area of computer by Selfridge\
    \ & colleagues, laid the basis for more complex applications such as face recognition.\
    \ Also, work on natural language processing (NLP) had begun by the late 60s. “Shakey”\
    \ is a wheeled robot that built at SRI International, and the field of mobile\
    \ robotics launched with it. The checkers-playing program by Samuels improved\
    \ itself through self-play. This happened to be one of the first working instances\
    \ of a machine learning system. Rosenblatt’s Perceptron is a computational model\
    \ that is based on biological neurons that occurred as the basis for the field\
    \ of artificial neural networks Building the expert systems were advocated by\
    \ Feigenbaum and others—knowledge repositories tailored for specialized domains\
    \ such as medical diagnosis and chemistry.  \n\n  The early conceptual progress\
    \ assumes explicitly the presence of a symbolic system that could be possibly\
    \ reasoned about and built upon. But by the early 1980s, in spite of this promising\
    \ headway made into different aspects of AI. Still, no significant practical successes\
    \ could be boosted by the field. This gap between practice and theory arose in\
    \ part from a deficient emphasis within the Artificial Intelligence community\
    \ physically on grounding systems with direct access to environmental data and\
    \ signals. There was also an overemphasis on (True/False) known as the Boolean\
    \ logic, that is overlooking the requisite to quantify uncertainty. In the mid-1980s,\
    \ when the interest of people in Artificial Intelligence dropped and funding dried\
    \ up, the field was forced to take cognizance of these shortcomings. This period\
    \ is called “AI winter” By Nilsson.    A much-needed resurgence in the 1990s built\
    \ upon the idea that “Good Old-Fashioned AI” was inadequate to building intelligent\
    \ systems as an end-to-end approach. Rather, intelligent systems necessary to\
    \ be built from the ground up, at all times, solving the task at hand, albeit\
    \ with many different degrees of proficiency. Technological progress had also\
    \ been making the task of building systems that are driven by real-world data\
    \ feasibly. Reliable and cheaper hardware for actuation and sensing made robots\
    \ easier to build.  \n\n  Further, the capacity of the internet to gather large\
    \ amounts of data, and the availability of computing storage and power to process\
    \ that data, enabled statistical techniques and ways that derive solutions from\
    \ data by design. These developments have allowed Artificial Intelligence to emerge\
    \ over the past two decades as a profound impact on our daily lives, which we\
    \ will be covering later in detail.  \n\nExpert Systems    ![](image-83ri5mdu.png) \
    \ Overview    Expert systems are those computer programs that aim to model human\
    \ expertise in multiple specific knowledge areas. Expert systems have usually\
    \ three basic components: a knowledge database with rules and facts that represent\
    \ human experience and knowledge, an inference engine processing consultation,\
    \ and to determine how inferences are being made, an output/input interface to\
    \ interact with the users.    According to K. S. Metaxiotis et al., characteristics\
    \ of expert systems are:    •  Not just use numerical calculations but also symbolic\
    \ logic;    •  With data-driven processing;    •  a knowledge database containing\
    \ explicit contents of a certain area of knowledge; &    •  Capable of interpreting\
    \ conclusions in such a way that it is easier for users to understand.    In the\
    \ early 1950s, Expert systems first emerged as a subset of AI when the Rand-Carnegie\
    \ team developed the general problem solver for dealing with geometric problems,\
    \ theorems proof, and chess playing. John McCarthy at MIT, at the same time, later\
    \ on, invented LISP, the later dominant programming language in expert systems\
    \ and Artificial Intelligence.  "
