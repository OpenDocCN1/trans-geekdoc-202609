  trans: '

    一年后，iRobot 推出了 Roomba，它的产率仅为 Trilobite 的十分之一，并配备了最方便的 512 字节 RAM，运行基于逻辑的控制器。在智力方面，它做出的最大改变是能够防止掉下楼梯。得益于，全球范围内已有
    1600 万台 Roomba 投入使用，现在也存在许多不同的竞争品牌。


    随着低价嵌入式处理器的处理能力和 RAM 内存从 2000 年初的惨淡水平提高，这些机器人的 AI 能力也随之显著进步。新增了简单的导航、自动充电以及管理满垃圾容器的移动功能，并观察到处理电线和地毯流苏的能力，这得于机械改进和基于传感器的感知的结合。


    最近，`VSLAM`（视觉同步定位与建图）的加入——一种已经存在了二十年的 AI 时代——使得机器人能够在轻松移动的同时构建房屋的整个三维全局模型，并提高了清洁范围的效率。


    早期对许多新软件包可能用于家用机器人的预期并未实现。机器人吸尘器局限于局部平坦区域，而真实的家庭有很多单级台阶，通常还有楼梯；关于机器人在实际房屋内部的移动性很少或没有研究。


    硬件结构仍然难以构建，且极少人类需求足够大以购买的应用。用于照片标签标记和 3D 物体识别等功能的感知算法，尽管在 AI 会议上很常见，但作为商品仍也仅开发了几年。


    ### 2030 年家用机器人


    尽管目前家庭内部机器人的增长缓慢，但有迹象表明这在未来十五年内会发生变化。Amazon Robotics 和 Uber 等公司正在利用各种聚合技术开发大规模经济效益。


    此外：模块系统（`SiM`）带有许多片上系统（`SoC`）子系统，目前由手机芯片制造商（如高通的 `SnapDragon`、三星的 `Artik` 等）推向市场。这些设备比十多年前的超级计算机还要强大，拥有
    8 个或更多 64 位核心，以及用于加密、摄像头驱动程序、额外 `DSPs` 以及某些感知算法的硬性硅的专用芯片，这意味着低成本设备可能支持比我们在过去十五年中所认为的得多的车载
    AI 能力。


    云端（“他人的电脑”）能够实现家用机器人更快速地发布新软件，并共享在许多特殊房屋中收集的数据集，这反过来有助于引导基于云的工具学习，并为已部署的机器人提供功能升级。


    通过深度学习实现的语音技术和图像标记方面的极大进展，将增强机器人与家庭中人类的互动。由游戏结构推动的廉价 3D 传感器推动了全球研究人员对 3D 感知算法的研究，旨在加速家用和供应商机器人的改进和采用。


    在过去的 3 年里，廉价且安全的机械臂已被全球数百个实验室中，引发了关于操纵的新一轮热潮，这随后可能在 2025 年左右应用于家庭。该行业超过半打的初创公司正在开发基于
    AI 的家用机器人，目前专门专注于社交互动。新的伦理和隐私问题也可能随之产生。


    ### 健康领域中的 AI


    对于人工智能的发展，医疗服务一直被视为一个充满前景的领域。基于人工智能的应用在未来几年内可能会提高许多人的健康水平和个人满意度——前提是它们能够获得医生、护理人员和患者的信任，并且消策略、行政和商业障碍。主要应用包括临床决策支持、持续监测和指导、辅助医疗手术或患者护理的自动化设备，以及社会保险体系的管理。近期的胜利，例如，挖掘社交网络以预测潜在的健康风险、预测风险患者的
    `ROBOTICS` 以及辅助医疗手术的机械自主，已经扩展了 `ROBOTICS` 在人类服务领域的可行性。


    与医疗专家和患者协作策略的改进将是一项基本测试。在不同地区，数据是关键的推动因素。从个人检测设备和移动应用程序中收集社交性数据取得了巨大飞跃，从临床环境中的电子健康记录（`EHR`）以及在较小程度上，从预计协助康复治疗和急诊中心活动的机器人中收集。


    尽管如此，使用这些数据对个体患者和患者群体进行更精细的诊断和治疗已显示出困难性。研究和关联被过时的规则和激励机制向推后了。糟糕的人机交互程序以及在如此巨大且复杂的结构中执行操作的内在困难和威胁，阻碍了对
    AI 在社会保健中可靠性的确认。这些障碍的减少或消除，结合显然仍触手可及的进展，基本上可以在未来几年内提高一些人的健康状况和个人满足感。


    ### 临床环境


    长期以来，`ROBOTICS` 控制的医生伙伴的愿景一直是一个近距离的幻想。尽管在治疗管理中 AI 相关的开发已经有了强大的试点，但目前的社会保健体系仍然非常不适合吸收和部署快速发展的进展。《平负担医疗法案》提供的激励机制为电子健康记录（`EHRs`）进入临床实践铺平了道路，然而，执行效果糟糕，消解了医生对其支持性的信任。


    少数社交性协会控制着 `EHR` 市场，且界面被广泛认为是不可接受的，包括医生经常删除的骚扰弹出窗口。使用来自 `EHR` 数据进行新评估（包括 AI）的保证仍被认为是未知的，由于这些以及其他监管和基础性障碍。预见随后的十五年，`ROBOTICS`
    驱动，在何时结合充足的数据和良好的系统，将改变致力于人类医生的心理努力。

