    随着人机界面与机器人（ROBOTICS）的日益融合，引发了新的保护担忧。社会学研究那些被设计为对人类创新做出反应的个体，其表现就像人类一样。某份报告中的受访者被要求回答他们在被构思时，电脑最初在构建时是否已经表达了意图。在另一份报告中，当他们面对人机界面时，他们回避了敏感的查询。从根本上说，在于：在一个由明显的社会运营者在我们的家庭、汽车、工作场所、急诊室和电话中“生活”的所饱和的世界里，人们是否会继续欣赏孤立的可能性？


    # 法律与安排


    关于风险和争议的早期法律和安排选择确保了互联网的商业合理性。另一方面，如今产品业务表面上经历着企业从开放自由编程转向对受许可技术安全的更具强制性的追求，这导致了某些人称为专利“丛林化”现象。在促进机器人技术进步的同时，提高参与度并防止外部损害之间，取得正确的平衡，将是一项重点性挑战。


    # 风险（普通）


    由于机器人技术的设计是为了合法地影响世界，甚至是在物理层面，由机器人引起的伤害风险将显著增加。`MACHINE INTELLIGENCE` 以设计者意料之外的方式行动的可能性，挑战了侵权法中法院判定可预见损害的总体假设。无论如何，当出于公正或效率的原因，责任更适合归于其他地方时，法院可能会主观地将风险分配给人类执行者。相反，法院可能拒绝认定责任，理由是受法院监督的诉讼人没有、且无法预判到
    `MACHINE INTELLIGENCE` 造成的危害。那么风险将自然而然地落在典型的受害者身上。产品责任的角色——以及制造这些产品的组织所承担的义务——在人类执行者对机器行为的责任变得越来越小时，可能会发生发展。


    # 风险（刑事）


    如果侵权法预见损害应该是可预见的，那么刑事法则进一步要求损害是有计划的。美国法律特别赋予了犯罪意图（men''s rea，即预期心理）这一概念特殊的意义。


    当 `MACHINE INTELLIGENCE` 应用参与到如果由人类实施将构成犯罪的行为中时，法院和其他法律形象应该对应该由谁负责以及基于何种假设感到困惑。


    # 组织


    上述问题引发了这样一个问题：`MACHINE INTELLIGENCE` 框架是否以及在什么条件下可以作为个人或公司的运营者。美国、加拿大及其他地区的有效管理机构正在设定程序可以进入合并合同的条件。`MACHINE
    INTELLIGENCE` 合法地进行法律约束性活动越频繁，对法律下职权标准的测试就越发突出。


    # 认证


    “人工智能”的概念本身就提到了对人类能力和创造力的替代。此外，在许多独特情况下，从领导头衔到执行医疗程序或专门从事法律事务，人类在执行特定任务之前必须获得某些认证或许可。同样，法律和安排应该——而且目前确实在做——思考如何在
    `MACHINE INTELLIGENCE` 框架中判定胜任。。例如，想象一家机械技术公司制造了一个能够自主排除参考章节的精细阶段设备。或者，想象一家律师事务所编写了一个适用于提供法律建议的应用程序。今天，从法律角度来看，尚不清楚这种图像中的实体是否需要通过医学考试或法律资格考试，更不用说它们何时被要求履行此类职责。


    # 工作


    随着 `MACHINE INTELLIGENCE` 代替人类工作，一些工作将消失，新的机会将会产生。对职业的净影响尚不确定，但劳动力市场可能不会让每个人平等受益。对某些类型技能或能力的兴趣可能会发生根本性下降，对拥有这些技能的人员水平和工资产生不利影响。虽然财务水平和贷款的确定结果并非不可避免，但它们很大程度上取决于治理安排、组织决定如何分类工作，以及个人的选择。


