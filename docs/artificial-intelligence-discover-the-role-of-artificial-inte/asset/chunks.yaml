    学习小组的理解是，总而言之，试图控制“人类意识”将是徒劳的，因为 `AI` 并没有某种逻辑上的意义（它并不是某件特定的东西），而且危险和挑战在很大程度上因地而异。或者，政策制定者应该看到，在不同程度上，随着时间的推移，各种机构将需要明确的、合适的规则，来涵盖使用
    `AI` 创建的程序或以某种方式加入 `Artificial Intelligence` 的行为。机构将有能力审查私营和公共领域产生的标准和进展，并在适当的地方制定规则。


    ## 未来的规则


    考虑到 `AI` 进步可能带来的巨大变化，对“更额外”和“更严格”指南的压力是不可避免的。对 `MACHINE INTELLIGENCE` 是什么、不是什么的误判，特别是在恐恐情绪的基础上，可能会对本可以造所有人受益的进步造成限制。这将是一个灾难性的错误。一个扼杀进步或将其转移到其他管辖区的指南将产生适得其反的效果。


    幸运的是，指导当前先进技术有效治理的规则可以启发启发。例如，一项针对欧洲四个国家和美国安全准则的近期多年研究得出了不合理的结果。这些国家，例如西班牙和法国，拥有严格且详尽的指南，在伙伴关系内部复制了“一致性态度”，这对进步和强有的安全保障都产生了士气的影响。这些组织并没有承担内部安全保障责任并建立专业团队来在企业中鼓励它以及制定形式，或从外部引入安全倡导者或学者，而是将安全视为一种一致性运动。他们的关注点在于规避罚款或惩分，而不是主动规划创新和调整实践以确保安全。


    另一方面，美国和德国的行政状况将日益模糊的目标与高度的透明度和重要要求相结合，这在催化机构将安全视为自身的责任方面越来越有效。广泛的法律指令促机构建立专业团队和程序以实施安全控制，与外部伙伴联系，并调整其实践以适应创新。


    要求提高透明度使沿海社会团体和媒体成为法庭和公众舆论的有效权威，使安全在公司财务报表中变得日益显著，并推动他们投入资源进行安全保障。


    在 `AI` 领域，监管机构也可以加强一个包括内部和外部责任、透明度和专业化的良性循环，而不是轻微的一致性。随着 `MACHINE INTELLIGENCE`
    进入城市地区，它将继续测试现有对特性的确认，例如安全和责任。像许多技术一样，`MACHINE INTELLIGENCE` 可以被用于善意或恶毒的目的。本报告试图包含这两种可能性。关于如何最好引导
    `MACHINE INTELLIGENCE` 改善我们的生活和人类整体的习惯，同时允许该领域的创造力，进行一场令人震惊且受教育的对话是迫切且基本的需求。计划应该被评估，看它们是否公平地促进了
    `AI` 优势的进步公平共享，还是将权力和利益集中在少数特权阶手中。


    此外，由于未来的 `MACHINE INTELLIGENCE` 发展及其应用无法被完美地预见，计划应该根据预见的社会问题不断重新评估，并对已处理的系统进行确认。正如本报告记录的，巨大的与
    `ROBOTICS` 相关的技术在过去几年中已经影响了北美城市网络，而且在未来十五内将发生重大的自由化升级。近期的进展很大程度上是互联网公司在材料进步中从事的大型数据集开发和评估的直接结果，更最近，还有“深度学习”的应用。在未来几年里，随着整个社区在空间（例如交通和社保）遇到新的
    `ROBOTICS` 应用，它们应该以建立信任、感知并尊重人类和社会互动的特征呈现出来。在允许发展的同时，方法和系统应该解决道德、保证和安全建议，并努力确保今天
    `ROBOTICS` 的益处将得到充分且合理的分配。如果希望 `Artificial Intelligence` 研究及其应用要在 2030 年及以后对北美城市生活产生建设性结果，那么这样做将是基础性的。


    ## 结论


    关于在日常生活中使用 `Artificial Intelligence` 的结论，我们可以说，`Artificial intelligence` 现在正在以新的标准、方法、新的常规改变我们的日常和工作生活、创新的健康习惯、新类型的疾病，以及与问题和解决方案相关的新类型。我们中的许多人可以说，我们正在将信息技术推向新的高度。在过去，已经发生了许多变化，从互联网的发明到搜索引擎、社交媒体营销和广告以及在线学习。


    人工智能以不同方式显著增强了人类的生活，在获得 `AI` 优势之前，人类将与以前不同。`AI` 的执行导致了时间的节省，使得公司和日常人类活动的产出增加。此外，`AI`
    功能的扩展侧重于减少人类工作、自动化方法、计算机化运输方法和参与危险任务。显然，`AI` 极大地激励了人类的生活，并像魔术一样在他们活动的自动化过程中提供帮助。这些方法中的许多有很多时刻和需要执行的人工劳动。`AI`
    对流程的自动化将个人和业务的实际工作中释放出来，并实现持续。


    人类智能的复杂性以前被低估了，特别是在专家系统领域。管理挑战和技术局限在专家系统的开发中仍然存在。然而，由于神经网络的成功，尽管存在挫折、`CASE` 技术和其他尖端技术，专家系统的未来似乎是光明的。此外，必须对专家系统技术发展过程中出现的伦理和法律问题进行仔细考虑。


