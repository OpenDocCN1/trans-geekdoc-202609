    人工智能工具可能在帮助警方监督犯罪现场或搜索与搜救行动方面同样具有价值，通过帮助指挥官组织任务和分配资源；然而，这些设备尚未准备好实现此类活动的自动化。`Artificial
    Intelligence` 的进步以及专门学习的趋势——例如通过与以往情况的相似性来加速在特定情况下的学习——可能会推动此类框架的发展。


    今天部署在世界各地的摄像头通常在解决违规方面比预测违规更有价值。这是因为从录像中识别事件的证据性质较低，且缺乏人力来查看海量的视频流。随着该领域的人工智能不断改进，它将通过更准确的事件排序和高效的视频自动化处理来更好地帮助犯罪预测和起诉，识别异常异常——其中可能包括警方疏职的证据。这些改进可能导致极其无边界的侦察。一些城市刚刚引入了侦察目的机器人，警方利用机器人维护港口、机场、海滨地区、水渠和机械办公楼安全的做法可能会增加，从而引发对隐私、安全及其他问题的担忧。


    纽约警察局的 `CompStat` 是强调预测性警务的主要工具，许多警察部门目前都在使用它。人工智能总体上提升了预测违规可能发生在何时、何地以及谁可能实施的能力。正如电影
    `Minority Report` 中夸张渲染的那样，预测性警务设备引发了无辜个人被过度针对的阴影。尽管如此，设计良好的人工智能预测设备可能真正消除或减少人类偏见，而不是加强它，研究和资源应当投入到确保这种效果。


    计算机智能策略可用于创建更智能的重演，以培训执法人员进行协作。当来自不同国家的犯罪组织和恐怖镇压者正在密谋时，不同国家的执法力量在联合打击他们方面仍面临困难。培训全球执法人员群体充当小组是极具挑战性的。欧盟通过
    `Horizon 2020` 计划目前支持此类项目中的工作，例如 `LawTrain`。下一阶段将通过提供协助此类协作的设备，从重演转向真实审查。


    确实存在用于审查 `Twitter` 和其他渠道以搜索特定类型事件及其可能如何影响安全的设备。例如，人工智能可以帮助非正式社区调查，以防止面临被 `ISIS`
    或或其他恐怖组织激进化的风险。执法部门越来越热于尝试识别网络生活中麻烦事件的计划，并监控个人在各地的集会以检查安全性。关于通过群体模拟来决定如何控制群体的研究有很多。同时，人们对执法机构可能越权并利用此类工具滥用个人隐私的真实担忧也存在。


    美国运输安全管理局 (`TSA`)、海岸岸卫队以及许多其他目前依赖 `ARTIFICIAL INTELLIGENCE` 的安全部门可能会扩大其依赖，以实现巨大的效率和可行性提升。人工智能策略——视觉、语音分析和步行检查——可以帮助询问者、调查员和安全监控识别可能的欺骗和犯罪行为。例如，`TSA`
    目前有一项旨在重新评估全国机场安全的目标任务。


    名为 `DARMS` 的框架旨在通过本地数据，根据个人的风险分类和所乘航班来定制安全，从而提高机场安全的效率和可行性。该项目的未来愿景是一个在人们通过它时检查其安全的通道。未来，这项技术的工程师应当足够谨慎，避免通过反映过去偏见的数据集产生偏见工作（例如关于个人的风险等级）。


    ## 商业与职场


    虽然人工智能的进步可能会对普通北美城市的商业和职场趋势产生深远影响，但很难准确评估目前的影响（正面或负面）。在过去的十五年里，业务的发展经历了严重的低迷和不断的全球化，特别是首次参与全球经济，同时也经历了非人工智能驱动发展的巨大变化。自
    20 世纪 90 年代以来，效率和 GDP 持续增长，但中心薪酬停滞不前，就业人数有所下降。


    有明显的例子表明，某些领域的卓越进展产生了重大影响（有好的也有坏），许多地区的自动化在不久将来可能实现巨大的升级。这些运动中的很大一部分是由“计划”驱动的发展推动的，包括尝试性资源调度、分类、数据准备和搜索。理解这些运动将为人工智能如何影响未来的劳动力需求提供经验，考虑到对能力的需求转变。在此之前，电子技术对熟练领域的工人的影响更大（例如旅行主），而不是最底端的技能工作或最有能力的体力工作。另一方面，随着人工智能系统的改进，顶尖结构所能完成的任务范围正在扩大，这可能会不断增加被视为标准的程度。计算机知识正逐渐进入该领域的高端，包括不一定由机器执行的机能组织。为了发挥作用，人工智能进展应该消除人类对被看轻的合理恐惧情绪。短期内，人工智能可能取代任务而非职业，并且同样会创造新的工作类型。

