    它拥有一种非常通用的接口引擎和基于人类智能的领域知识。特别是在专家系统中，领域知识试图复制并模拟人类专家的知识结构。在 20 世纪 80 年代，专家系统引起了巨大的轰动并广为人，约
    2/3 的富敦 500 强公司每天都在使用该系统。它们被广泛应用于经济的不同部门，例如金融系统、物流系统、制造系统、物流以及业务流程的自动化。自 20 世纪
    80 年代初以来，已经开发了许多用于教育和学习的专家系统。到该年代末，基于知识的人工智能趋势逐渐减弱，因为当时显而易见，开发领域知识库需要专家知识工程师，而且由于互联网和计算机的普及，兴趣转向了业务流程自动化和系统集成。如今，标准的编程环境利用了许多独立专家系统的理念。然而，随着基于知识的人工智能缓慢衰落，神经网络人工智能在几年内出现了一次兴起。


    然而，在系统集成和并行编程方面也存在瓶颈。这些困难使得人工智能系统仅限于大学和实验室。结果，注意力转向了移动互联网和全球维网等新趋势。在实践中，人工智能中基于知识和基于逻辑的方法都关注活动层次结构的认知层面。认知也被以一种纯粹个人主义的方式来解释。人工智能在设计处理符号的通用思考算法方面提供了帮助，就像人类所做的那样。基于逻辑的系统一直专注于通用问题的解决过程。另一方面，基于知识的方法利用了简单的推理模型和对领域知识更清晰的阐释，其论点是有效的决策需要更多知识而非逻辑。相比之下，ML（机器学习）和
    ANN（人工神经网络）通常利用可以表述为行为主义的学习模型。这些系统通常具有一个预定义的准则，给出关于最优响应的细节，并提供海量数据。在这些系统中，算法并不复制或模仿人类智能。


    相反，它们利用训练数据实践，并定义了适应系统输出的策略。在游戏等应用中，训练数据可以自动生成；但在最新且最重要的神经网络中，则由人类提供数据。一个很好的例子是顶尖图像识别人工智能系统的出现。在很大程度上，人工智能系统依赖于包含约
    1400 万张图片的公共 ImageNet 数据库。通过 Amazon Mechanical Turk 众包平台，完成了图像中对象的标注。


    ![](img/image-x62lfk51.png)


    # 人工智能的近期与未来发展


    当前对人工智能的关注是三个同时发生的发展的结果。首先是对对比需要特殊图形处理器的写实电脑游戏的高度兴趣。当 PC 显卡公司 Nvidia 推出其`CUDA`编程接口时，低成本的快速并行编程变得可用。它的图形加速卡闻誉全球。这为研究人员提供了一个机会，创建由许多人工神经元构成的多个相互连接层的神经网络，并具有大量的参数供网络学习。其次，随着计算机和用户的连接，海量数据变得随手可用。这种视频、图像、文本和语音的数字化为机器学习的蓬勃发展提供了平台。


    这让人工智能研究人员能够自由地研究旧的人工神经网络模型，并拥有巨大的训练数据源。这些数据集已被证明足够且丰富，可以应对人工智能中的一些紧迫挑战，也包括从数字图像中识别物体和机器翻译。早些人们认为计算机也需要了解语言和结构，以便能够将文本和语音翻译成不同的语言。对于许多用户来说，只需处理数百万可用句子来理解词汇出现的语境就足够了。另一种常见方法是利用公开的`GloVe`词表示，这些表示是使用文本语料库产生的，语料库包含了互联网文档和其他网页上多达
    8400 亿个词标记，随后翻译成多达 200 万词的词汇。使用机器学习算法和这些可用数据集，世界被绘制成 300 维向量空间中的点。这种空间中词之间的几何关系和位置捕捉了词使用的许多特征，这些特征也可以作为从一种语言翻译到另一种语言的基础。尽管纯基于数据和统计的方法不足以理解语言的创造性或新用法，它在实际应用中效果非常好。


    第三，专门的开源 ML 编程环境使得神经网络的测试和创建变得简单。在最新的 AI 神经的人工智能系统中，学习通过缓慢调整网络权重来进行。这进一步取决于网络是否在数据训练中做出了精确预测。这种学习中的基本任务是提供关于每个神经元活动重要的信息。它还提供了关于神经元所做的正确错误预测的信息。因此，当活跃神经元与错误决策之间存在关联时，神经元的活动以及输入链路和连接的权重就会减少。由于可能存在多层神经元以及神经元之间的许多连接，这使得该任务即使对于量子计算机也是困难的。可以使用微积分中的链式法则来评估神经元对预测的影响，它显示了信息从网络外层层层向内层的传播。这被称为误差的“反向传播”。是的，利用这种模型进行网络计算和计算在高级网络中可能涉及数十亿次计算。最新的神经网络人工智能开发平台可以仅通过几行程序代码轻松完成任务。


