    # Maintenance Cost of Expert Systems

    We know that expert systems are complicated and can require extensive knowledge
    of development tools developed and maintained by people and the application domain,
    so ultimately, the maintenance cost could be high in this case. A loss of key
    personnel results in almost the full portion of the project to be re-worked. Keep
    in mind that projects can be delayed or abandoned if the vulnerabilities in staffing
    turnover are unresolved.


    ## Expert Systems Make Mistakes

    there will be legal concerns over “expert system makes mistakes,” which could
    drive developers and investors away. Remind what we mentioned previously, there
    is consensus on what testing is essential for evaluating an expert system’s reliability,
    validity, and performance. There is not even a single legal authority to validate
    and certify systems. The potential functional and legal liabilities of such systems
    go wrong, especially in life-critical systems such as air-traffic control and
    medical diagnosis could be astronomical and crippling.


    ## Resistance from Users

    as we know that traditional computer programs cannot perform tasks better than
    the expert systems, but expert systems perform tasks just like an expert performs.
    This could trigger strong resistance and opposition to such technology from users
    with concerns about expert systems replacing them and taking their jobs. These
    organizational and managerial challenges appear to be very crucial for expert
    systems. When it comes to the failure of taking care of such issues, it could
    lead to system cancellation or abandonment.


    ## Is "Thinking" Machine Ever Possible

    it was a long dream of scientists that a system could “think” autonomously free
    of human interference. Even the five decades of research were not enough to bring
    this dream come true. The human beings intuitive intelligence is still beyond
    the capabilities of ‘reasoning machines.’ Some people are more optimistic, while
    some deem the discovery of a ‘thinkable machine’ a dangerous endeavor that is
    ultimately doomed to failure. Jeff Hawkins, in his award-winning book “On Intelligence,”
    predicted that the mind-machine might appear its existence in the world within
    a decade. His reason for this prediction was, “It took fifty years to switch from
    room-sized computers to pocket size. In comparison to this, as we are now in an
    advanced technological position, it should go much faster for the same transition
    for intelligent machines.” For exploring expert systems development potential,
    it is essential for comparing the differences between machine “thinking” and humans,
    and discussion on their possibilities for the future.


    ## Human’s Know-how and Intuitive Intelligence

    You might remember the example that we mentioned previously about humans who learn
    how to walk through practice and trial, and such skill is called “know-how.” Humans
    acquire these skills through experiences and instructions. As we know that the
    human learning process is actually a gradual process, and there is appearing to
    have no sudden leaping forward that is from rule-based knowledge to experience-based
    know-how. Novices follow the instructions and rules, while more competent users
    take into account the situation elements like sensing the opponent’s weakness
    in chess play. Very proficient users recall past solutions of similar experience
    and can intuitively apply them to the present without first sorting them out by
    going through rule-based deliberations or rules. Another aspect of human intelligence
    is the different mindset when they consciously work on solving problems. Chess
    play as an example; grand maters do not see themselves as board manipulating pieces.
    Rather, they involved themselves deeply in the world of opportunities, strengths,
    threats, weaknesses, hopes, and fears. With this involvement level, human experts
    to think differently and come up with innovative solutions and new innovations.


    ## The Human Mind

    Properties of the human brain are very interesting. Speculation of Raj Reddy says
    that the human brain is composed of about one hundred billion neural cells, and
    normally there is a possibility that the brain might be performing over 200 trillion
    operations every second if not faster than that. In problem domains such as speech,
    motor processes, and vision, “it is more powerful than one thousand supercomputers;
    however, it is less powerful than a 4-bit microprocessor when it comes to simple
    tasks such as multiplication.” These processing events going on in the brain need
    little conscious awareness and effort the part of humans, and their emulation
    is extremely difficult for machines. In contrast, machines can excel in some processes
    that are difficult and possible for a human being. Reddy went on to argue that
    if a silicon-based intelligence is ever achieved, after all, it might just have
    different attributes.


    ![](image-x62lfk51.png) HUBERT DREYFUS AND colleagues also questioned if the mind
    of a human can be materialized into an info-processing machine. An example might
    tell you how, “if it is known that a small box is resting on a large box, it can
    be imagined what would happen if the large box is removed.” However, a computer
    must be given a list of facts about boxes, such as their weight, size, and frictional
    coefficients, details, or information about how each is affected by various kinds
    of movements.”


    Generally, a human thinks with images, and this what we know “imagination.” Human
    beings do not think the descriptions but use images to respond and understand
    situations. Unlike logic machines step-by-step reasoning, the human process is
    totally different from such explicit.


    ## What the Future Holds

    The dream of a “thinkable” machine could be controversial, exciting, and also
    intimidating. In the book “Singularity Is Near,” Ray Kurzweil says that When Humans
    Transcend Biology provides some intriguing future thoughts such as the nanobots,
    which are sub-micro agents injected into the human bloodstream. They could be
    brought in use for monitoring and maintaining biological and chemical balances.
    In addition to this, these nanobots could also specialize patrolling the brain
    and downloading synaptic connections and every stored neural pattern from brain
    cells to a supercomputer system. A system like these would, in turn, recreate
    a version of software of the human mind, including emotions, memory, instincts,
    and thoughts. Also, there is a possibility of porting the program to other machines
    just like any other software, acting and thinking as “yourself” with immortality!
    Unambiguously, the human mind from inside or the inner-workings are more complicated,
    complex, and challenging to start creating machines that could simulate human
    intellectual abilities is daunting. Furthermore, it still remains debatable on
    endowing computer systems possibility with human-like intelligence.

