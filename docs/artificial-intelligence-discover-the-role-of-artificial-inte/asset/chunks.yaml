    Opportunities and possibilities that are normally figured out or discovered at
    cognition level could turn social practices and activity systems upside down thereby
    giving rise to space for more but new motives and purpose to begin with social
    organization. However, most of this development as a result of activities is unintended
    and self-emergent. Complies social interactions give rise to and shape social
    institutions, structures and practices. This, however, remains unidentified to
    a large number of society members. The three-level models enable us to start with
    an easy and useful foundation to understand `AU` and the possible impacts it could
    have on human life and activities. The entry of `AI` into social practices and
    operations gives rise to the efficiency of work and increase the marginal productivity
    of labor and machines. It also automates and replaces as well as substitutes humans
    in jobs previously been held by humans. So when `AI` enters social practices,
    it changes and transforms the motive system and outdate current specializations
    and activities. For instance, routine and technical skills emphasis the operational
    level. In addition, vocational training has also focused on this skill set of
    teaching how to make use of domain-specific knowledge and use the underlying tools.


    The recent system of education is more focused on problem-solving, and I think
    it gives rise to scholars and critical thinkers who have the decision making abilities
    and entrepreneurial competence to make things happen and create values out of
    scratch. I think have a skill set that modern need is crucial as it addresses
    opportunities for cultural and social changes that take place at activity levels.
    At the same time, learning at the operation level needs data on the present concrete
    environment. Normally data for such operations could be generated by using physical
    interactions and perception. At the level of socially motivated activity, learning,
    on the other hand, needs knowledge basic knowledge about social systems of meaning.
    In order to absorb such knowledge, communication language, as well as dialogue,
    becomes imperative. Technology is a very important factor and indicates a change
    in the current system. Technology in the current industrialized era focuses on
    making tools for innovation and growth. So all three levels of activity have somehow
    complex dependencies. This model is also currently been inspected in the interaction
    between child and robot (social robotics). We will be focusing briefly on the
    three different kinds of `AI` and to locate their abilities in this hierarchy
    as well as to discuss the potential of the three kinds of `AI`.


    So to talk about modern lives, we may fractal structure. This three-level model
    of activity elucidates that many different kinds of `AI` and machine learning
    systems work on different layers of hierarchy. The level of meaningful activity
    is fundamental according to the sociocultural theory of learning and throw light
    on an advanced form of human learning and intelligence, which is outside the current
    scope of `AI`.


    ### Three types of AI


    Historically, `AI` could be categorized into three alternate approaches: they
    are:

    * Data based

    * Knowledge-based

    * Logic-based


    The first of the list that is data-based is also termed as machine learning and
    artificial neural networks. However, it is surprising that the recent innovations
    and success in `AI` also depict the old approaches to `AI`.


    #### Data-based neural AI


    It was `Nicolas Rashevsky`, who first of all developed certain mathematical models
    for neural networks as early as the 1930s. The models made news only when his
    student `Pitts` elucidated biological neural networks in 1942 and termed it as
    `networks of logical switches`.


    `Pitts` and `Warren` published the paper, and the publication took place after
    `Alan Turing` had written about the mechanization of formal logic which led to
    the appearance of the first digital computer. With this, it became evident that
    all the formal logical sequences could be simulated and mechanized by such neural
    networks. The brain was viewed as a computer and computer was termed as the `electric
    brain`. The metaphor became part of English literature and has been widely quoted
    since then. The two-lined metaphor has in it, a whole discussion about research
    in organizational and cognitive sciences and now influences the connectivity model
    of learning, economics and many areas of popular and scientific thinking.


    Neural network models informed by neurobiology has provided a foundation for the
    present neural artificial intelligence. The most important and earliest contribution
    was made by `Frank Rosenblatt` in the 1950s. He was inspired by the famous neuropsychologist’s
    stance that learning takes place in the neural networks by the process of synaptic
    modification and by the famous economist `Friedrich Hayek` who worked on distributed
    learning. So `Frank` suggested that learning in the biological neural networks
    could be pictured as a slow change in the network connection. `Frank` presented
    a multi-layered picture of his findings, which in many ways, is similar to the
    current advanced neural networks.


    It, however, is different from today’s `AI` system in that modern systems are
    laden with numerous deep-learning and neural-learning systems and the process
    is done by using machines which are billion times faster than the one (`IBM 704`)
    `Frank` used for his research and findings. The simple behavioristic learning
    model of most of the `AI` is the only single feature that differentiates them.
    Others include the presence of very advanced computational needs and the need
    for data during learning. For such systems, the presence of data is the most important
    success factor, and if data is not there, there is no success. If we use biological
    terminology for such a thing, we would call it “Datavores.” It is due to this
    very reason that we call this “Data-based” approach to `AI`.


    #### Logic- and knowledge-based AI


    Neural Network models (`NNMs`) had been pretty popular in the 1950s and 60s too.
    These models were also considered as a key to studying language, abstraction and
    creativity in the Dartmouth summer research projects back in 1956, where the term
    `artificial intelligence` was coined. Despite continued work on neural networks,
    research in artificial intelligence swiftly shifted to “symbolic processing`.


    According to the famous mathematicians after `Hilbert` and `Russell`, logical
    truth could be extracted or derived from the formal sentence manipulation. And
    this is an open secret that the computer cannot and was not able to make the logical
    inference back then. Another commendable effort was made by `Logic Theorist` which
    was put forward by `Allen Newell`, `Herbert Simon` and `John Shaw` over the snowy
    Christmas break back in 1955. This was the solution to the problem and the system
    could not break the logical structure and could manipulate it very well. It additionally
    could derive proof of logical theories. All three researchers were sure they had
    created a mechanical brain that could think. This was soon followed by `General
    Problem Solver` that could just any logical problem that made sense and had a
    solution. The dominant approach to `AI` had been the logical approach from 1950
    to the 1970s. By the late 1970s, it was however though and accepted that human
    thinking could not be explained and simulated just be a mere explanation of logical
    statements. As a result, the central focus of `AI` became domain-specific knowledge.
    This also gave rise to an “expert system” or more specifically, knowledge-based
    systems. An early example of this was the `SHRDLU` natural language understanding
    program and the `MYCIN` medical diagnostic system, which was widely used for recommendation
    of medicine and dosage based on symptoms of the disease.

