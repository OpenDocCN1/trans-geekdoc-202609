  trans: '

    通常在认知层面被构思或发现的机会与可能性，可能会彻底颠覆社会实践和活动系统，从而为社会组织的开展创造更多、新的动机和目的空间。然而，这种由活动产生的大部分发展是无意间且自发涌的。复杂的社会互动产生并塑造了社会制度、结构和实践。然而，许多社会成员尚未识别到这一点。这三个层级模型使我们能够从一个简单且实用的基础开始，理解
    `AU` 以及它对人类生活和活动可能产生的影响。`AI` 进入社会实践和运作，提升了工作效率，并增加了劳动力和机器的边际生产率。它还自动化并取代了、替代了以前由人类担任的工作。因此，当
    `AI` 进入社会实践时，它改变并转化了动机系统，并使现有的专业化和活动过时。例如，常规和技术性技能强调的是操作层面。此外，职业培训也侧于这一技能 set，即教授如何利用领域特定知识并使用底层工具。


    最近的教育体系更关注解决问题，我认为它培养了具有决策能力和创业能力的学者和批判性思考者，他们能够让事情发生并从零开始创造价值。我认为拥有现代需求所需的技能
    set 至关重要，因为它解决了发生在活动层面的文化和社会变革的机遇。同时，操作层面的学习需要关于当前具体环境的数据。通常，此类操作的数据可以通过物理交互和感知生成。另一方面，在社会动机驱动的活动层面，学习需要关于社会意义系统的基础知识。为了吸收这些知识，交流语言以及对话变得必不可少。技术是一个非常重要的因素，预示着当前体系的变化。在当前的工业化时代，技术侧重于为创新和增长制造工具。因此，活动的三个层面都以某种方式存在复杂的依赖关系。这种模型目前也被应用于儿童与机器人之间的交互（社会机器人学）中。我们将简要重点关注三种不同的
    `AI`，并定位它们在这一层级结构中的能力，同时讨论这三种 `AI` 的潜力。


    所以谈到现代生活，我们可能会采用分形结构。这种活动的三层级模型阐明了许多不同类型的 `AI` 和机器学习系统在层级结构的不同层面上工作。根据社会文化学习理论，意义活动层面是基础性的，它揭示了人类学习和智能的一种高级形式，而这超出了当前
    `AI` 的范畴。


    ### 三类 AI


    从历史角度看，`AI` 可分为三种交替出现的方法，它们是：

    * 基于数据的

    * 基于知识的

    * 基于逻辑的


    列表中的第一个是基于数据的，也被称为机器学习和人工神经网络。然而，令人惊讶的是，近期 `AI` 的创新和成功也描绘了旧的 `AI` 方法。


    #### 基于数据的神经 AI


    是 `Nicolas Rashevsky` 早在 20 世纪 30 年代就为神经网络开发了某些数学模型。直到他的学生 `Pitts` 在 1942 年阐明了生物神经网络并将其称为
    `逻辑开关网络` 时，这些模型才引起了关注。


    `Pitts` 和 `Warren` 发表了论文，该论文发表在 `Alan Turing` 写了关于形式逻辑机械化的之后，这导致了第一台数字计算机的出现。借此，显而易见，所有的形式逻辑序列都可以通过这种神经网络进行模拟和机械化。大脑被视为计算机，计算机被称为`电脑`。这个比喻变成了英语文学的一部分，并从那以后被广泛引用。这个双线比喻中包含了关于组织科学和认知科学研究的整个讨论，现在影响了学习、经济学以及许多流行和科学思维领域的连接模型。


    由神经生物学启发的神经网络模型为现在的人工智能提供了基础。最重要且最早的贡献是由 `Frank Rosenblatt` 在 20 世纪 50 年代做出的。这种灵感源于著名的经济学家
    `Friedrich Hayek` 对分布式学习的研究。`Frank` 展示了一个多层的图景，这在许多方面与目前的神经网络相似。然而，它与今天的 `AI`
    系统的区别在于，现代系统充满了深度学习和神经网络系统，这种过程是由机器完成的，速度快万倍。`AI` 的简单行为学习模型是区分它们的唯一特征。其他还包括复杂的计算需求和学习对数据的需求。对于此类系统，数据的存在是最重要的成功因素，如果没有数据，就没有成功。如果我们使用生物学术语来描述这种事物，我们会称之为“数据吞噬者”。正由于这个原因，我们将这种
    `AI` 方法称为“基于数据的”。


    #### 基于逻辑和知识的 AI


    神经网络模型 (`NNMs`) 在 20 世纪 50 年代和 60 年代也非常流行。这些模型也被认为是研究语言、抽象和创造力的关键，在 1956 年的达特茅斯夏季研究会上，`人工智能`
    一词在那里被创造出来。尽管对神经网络有持续工作，人工智能的研究迅速转向了 `符号处理`。


    根据著名的数学家们 `Hilbert` 和 `Russell`，逻辑真理可以从形式句子处理中提取或推导出。而且这是一个公开的秘密，当时的计算机不能也无法进行逻辑推理。另一项值得赞的成就是
    `Logic Theorist`，由 `Allen Newell`、`Herbert Simon` 和 `John Shaw` 在 1955 年雪冷的圣诞假期期间提出。这是问题的解决方案，该系统无法破坏逻辑结构，并能很好地操纵它。它还能够推导出逻辑理论的证明。这三位研究人员确定他们创造了一个能够思考的机械大脑。紧随之后的是
    `General Problem Solver`，它可以解决任何有意义且有解决方案的逻辑问题。`AI` 的主流方法在 1950 年到 1970 年间一直是逻辑方法。到
    20 世纪 70 年代后期，尽管被认为并接受人类思维不能仅仅通过逻辑陈述的简单解释来解释和模拟。因此，`AI` 的核心焦点变成了领域特定知识。

