  trans: '

    到目前为止，美国的程序在某种程度上是不明确的，并由一组协会进行监管。在传输治疗性诊断和药物的设备中使用人工智能，依赖于美国食品药品监督管理局（`FDA`）的严格监管，这既包括对设备本身性质的描述，也包括对其制造技术的证明，涵盖编程构建的标准。在受监管的空域中使用机器人属于联邦航空管理局（`FAA`）的管辖。对于面对
    `MACHINE INTELLIGENCE` 系统的用户，联邦贸易委员会（`FTC`）的监管成为一个关键因素。例如，使用 `MACHINE INTELLIGENCE`
    技术的金融市场（如高频交易）受证券交易委员会（`SEC`）的监管。


    尽管某些技术是明确的，但定义模糊且广泛的“关键基础设施”权威类别可能适用于 `MACHINE INTELLIGENCE` 应用。奥巴马政府的《总统政策指令》（`PPD`）详尽地描述了关键基础设施为：“偏好、结构和框架，无论是物理还是虚拟，对美国而言至关重要，以至于其破坏或毁灭将严重影响国家安全、国家经济安全、国家总体福利或繁荣，或上述任何组合。”


    如今，一项努力并非仅仅因为符合这一广泛定义就受到政府监管。或者说，政府政策的一般做法是在经济的十六个领域寻求规则。对于 `MACHINE INTELLIGENCE`
    而言，关键基础设施的描述主要取决于终端用户应用，而非真正编写 `MACHINE INTELLIGENCE` 程序的开发部门或部分。


    例如，软件公司 `Google`、`Facebook` 和 `Amazon` 一直努力避免被归类为经济关键部门，认为这将为监管打开大门，并不可避免地干扰它们的快速产品迭代周期和创造能力。无论如何，制造、运行和维护使用
    `MACHINE INTELLIGENCE` 关键系统的协会，对控制该产品产生兴趣是必然。


    目前某些针对医疗软件的行政体系（例如 `FDA` 的高风险治疗性软件指南）要求在设计者层面执行明确的编程设计规范。尽管如此，现代软件框架通常由多个供应商提供的库分组成，并具有一定的应用自主性。要求为最基础、不常见的应用暴露每一个此类工程师所需的模型，似乎既不现实也不具吸引力。


    在安全关键应用中允许不受限制地使用此类组件似乎也是不妥的。促进进步与引导安全之间的权衡是困难的，无论在技巧上还是在实践上。无论如何，未来的行政机构需要更卓越的能力，以理解专家、政府和行业所设立的标准和措施所产生的影响。


    ### 安排与法律考量


    虽然本报告对自动化思维（`AI`）如何与法律交互的全面评估超出了本文范围，但有一点是明确的：作为变革性技术，`MACHINE INTELLIGENCE` 在短期、长期内都可以挑战许多法律问题。法律和策略如何适应
    `MACHINE INTELLIGENCE` 的进步——以及 `MACHINE INTELLIGENCE` 如何符合法律和策略中反映的价值观——取决于多种社会、伦理、经济及其他因素，并很可能因地区而异。


    美国法律涵盖了普通法、联邦、州和地方目标及法律，以及可能对 `MACHINE INTELLIGENCE` 最具核心性的——规则。取决于其部署方式，`MACHINE
    INTELLIGENCE` 可能涉及所有的法律来源。


    例如，内华达州通过了一项完全允许自动驾驶车辆的法律，并授权`内华达车辆管理局`制定规定。随后，国家公路交通安全管理局（`NHTSA`）规定，自动驾驶车辆系统而非车辆乘客可以被视为车辆的“司机”。一些车辆计划通过在手握方向盘时准确保持独立模式（并非总是如此）来规避这一问题，目标是让人类驾驶员拥有绝对的控制权和责任。尽管如此，`Tesla`
    对这一框架的选择未能避开 2016 年 6 月发生的一起包括自动驾驶车辆在内的首次重大交通事故。此类事件无疑影响了公众对自动驾驶的情绪。此外，随着大量人员首次参与到示例化的行政管理中，免费公共交通将强烈影响公众对人工智能的印象。


    无人驾驶汽车显然是行政管理、产品和其他其他环境中发布 `ARTIFICIAL INTELLIGENCE` 的众多案例之一。将 `ARTIFICIAL INTELLIGENCE`
    引入证券交易体系或产生医疗诊断结果的法律影响，也将随着对这些情况的理解而改变。许多不同的 `ARTIFICIAL INTELLIGENCE` 应用属于现有的非技术明确政策范围，包括预测性警务、无偏见进步、人类服务应用（例如老年护理和辅助交通）、旨在连接儿童的系统（例如，自主辅导系统需要遵守法律以确保对发育与结构的公平对待）。鉴于美国法律的现状，短期内对
    `MACHINE INTELLIGENCE` 进行详尽处理似乎是不现实的。无论如何，可以预计 AI 法律和策略的通用类别将在不同背景下广泛产生。


    ### 保护


    个人的私有数据可以通过人工智能做出的选择和预期被揭露。虽然人工智能涉及安全的部分行为反映了其他技术（例如电脑和互联网）的特征，但某些问题可能是人工智能所特有的。例如，人工智能根据过去案例预测未来行为的能力引发了测试问题。目前机构使用人工智能预测信贷风险。此外，政府通过复杂的计算运行犯人详情，以便在考虑假释时预测再犯率。在这些情况下，确保种族和性取向等因素未被用于基于人工智能的决策是一项特殊的测试。无论如何，当此类特征没有直接提供给计算模型时，它们目前可能与看似无害的特征（例如邮政编码）密切对应。然而，通过谨慎的结构、测试和安排，ROBOTICS
    计算可能会比普通人做出更少偏见的选择。

