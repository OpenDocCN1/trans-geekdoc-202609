    这些趋势在 2012 年开始汇聚，当时一个使用领先的 Nvidia 显卡训练的多功能网络在图像识别竞赛中表现出卓越的性能。该竞赛实际上基于 ImageNet
    数据库，其中包含了约 1400 万张由人工标注的图像。ILSVRC（ImageNet 大规模视觉识别挑战赛）现在是人工智能成功的领先基准。除了其他 100
    种物体外，分类挑战和物体检测任务使用了约 120 万张图像进行训练。到 2017 年，最好的神经网络架构能够以 97.7% 的精确率和前 5% 的准确率预测出准确物体类别。这意味着所涉及的正确物体位于网络预测的前五个可能类别之中。物体识别的即时改进使得获胜者多年来的前
    5% 错误率处于领先。


    神经人工智能的复兴在某种程度上归功于详细电子文本、数字图像、社交工作链接和互联网搜索模式的提供。最近的进展还受到以下事实的加速：如此巨大的数据集并不容易用普通计算机利用和分析。机器学习（ML）需要大数据，但它有能力让这些大数据变得有用且有价值。这就是为什么机器学习在工业中被如此广泛使用，因为使用此类模型产生了巨大的商业利润和激励，而这是普通计算机无法实现的。


    ## 基于数据的人工智能学习模型


    ![](img/image-83ri5mdu.png) ![](img/image-x62lfk51.png)


    **所有最新的 AI 系统**都是基于一种被称为监督学习模型（supervised model of learning）的东西。训练数据为监督学习模型提供了基础。训练数据由人类提供，这样做是有利的，因为当训练数据的标签被错误预测时，我们能够调整网络权重。在提供大量示例后，误差可以减少到某种程度，使得预测在实际用途中变得。例如，如果一个图像程序试图区分牛和羊，那么在训练过程中，需要有人向系统输入某张照片中是是牛还是羊。


    监督学习模型的另一个良好替代方案被称为迁移学习（transfer learning）。我们知道，训练一个完整的神经网络需要大量数据，这使其能够学习区分数据中重要和主要的特征。训练好的网络总是可以复用的，只要基础特征都是完整的，它也可以用于网络识别工作。


    例如，可以使用包含百万张图像的数据来训练一个网络来识别人脸。一旦系统能够识别每张用作训练数据的人脸，系统的深层就会针对人脸识别进行优化。然后系统可以被训练以检测未在数据中使用且以前从未见过的新脸。这消除了对海量计算和数据的需求。这意味着
    AI 开发人员不需要总是训练系统，而是可以从从事此类业务的专业供应商处购买训练好的系统。


    例如，由斯坦福大学开发的 GloVe 向量已作为 Google 预训练 Inception 模型和神经语言处理的起点。这意味着监督学习系统假定我们对输入模式可能代表的类别具有先验知识。这种学习模型在人工智能中使用得最频繁，而且由于实际需要，将模式归类为一组预定义类别的集合通常也足够了。自动驾驶汽车应该能够区分汽车、卡车、自行车骑者和孩子。这是通过监督学习实现的，监督学习产生了产生数据或输入集合的模式。这种智能和思考与生物是相同的，因为学到的行为与环境条件相关。


    由于这些学习行为是在斯金纳强化学习（Skinnerian reinforcement learning）和巴尔霍洛夫反射理论（Pavlovian theory
    of reflexes）背景下被解释的。正如维果茨基（Vygotsky）在 1920 年指出的，这种学习简单地代表了一种鸟类和人类同样胜任的学习发展模型。监督学习系统面临的挑战之一是，它无法在现在观察世界，只能通过过去的数据这样做。这意味着它们将世界视为过去的重复。也有报告说，用于训练的数据是由人类记录提供的。因此，文化和个人偏见并非天生，而是存在于基于监督学习的
    AI 系统中的。上述模型展示了隐含的价值和规范，这些价值以未言化的情感反应形式表现出来。因此可以说，监督学习模型交织并体现了通常未被探索的文化信仰。以一种启发性的方式，监督学习系统产生了只能感知人类预定义环境的机器。从教学和伦理角度来看，由于它们与其他
    AI 系统交互，这被认为是不好的，从长远来看可能是危险的。


    自世纪 60 年代以来，许多监督模型已被开发和应用，由于计算能力的提高，研究人员现在可以更好地获取全球信息。例如，Google 的 AlphaZero 游戏使用了一种人工智能强化学习系统，该系统非常能够模拟游戏并根据游戏成功调整权重。强化学习模型受到斯金纳模型的启发，并以一种导致积极结果的方式放大行为。


    强化模型的一种变体形式是生成对抗网络，也称为 GANs，这很有趣，因为一个网络试图欺骗另一个网络，并展示了它生成的数据来自训练数据集。通过这种方法，已经创建了合成的艺术品图像以及人脸，其程度机器无法区分真实人脸和图像。在商业上，它也被广泛地应用于时尚行业的产品设计。图灵学习（Turing
    learning）是 GAN 的另一种变体形式，其中系统在学习后允许与周围的人积极互动。它尝试数据的来源。


