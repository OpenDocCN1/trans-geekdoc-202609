    ### ARTIFICIAL INTELLIGENCE AND LIFE 2030


    Until the millennium, the appeal of artificial intelligence lay in its promise.
    In the last 15 years, much of that promise redeemed. The field is shifting from
    simple, intelligent systems to building systems that are trustworthy. There are
    several factors have fueled the revolution of AI. The foremost among these factors
    is the maturity of machine learning (`ML`), supported in part by cloud computing.
    This performance leap of information processing algorithms has been going along
    with significant progress in hardware technology for basic operations such as
    perception, sensing, and object recognition. New markets and platforms for data-driven
    have contributions as well.


    ### Research Trends


    The trends that drive the “hot” areas of this research are described below.


    #### Large-scale machine learning (ML)

    The basic problems in machine learning are well-understood such as supervised
    and unsupervised learning. Scaling of existing algorithms for working with extremely
    large datasets is a major focus of current efforts. Let’s take an example; traditional
    methods could afford in making several passes over the data set, the other modern
    ones designed to make only a single pass; only sublinear methods can be admitted
    in some cases.


    #### Deep learning (DL)

    The ability to train convolutional neural networks (`CNNs`) has most benefited
    the computer vision field, with applications such as activity recognition, object
    recognition, video labeling, and several variants thereof. Deep learning also
    makes significant inroads into other areas of perception, such as speech, audio,
    and natural language processing (`NLP`).


    #### Reinforcement learning

    As we know that traditional machine learning is mostly focused on pattern mining,
    but reinforcement learning shifts the focus to decision-making abilities, a technology
    that will help artificial intelligence to advance more deeply into the realm of
    learning executing and about actions in the real world. It has existed for several
    decades for experience-driven sequential decision-making as a framework, but the
    methods haven’t found great achievements in practice, mainly owing to issues of
    scaling and representation. However, deep learning advent is providing reinforcement
    learning with a “shot in the arm.” The AlphaGo recent success, Google Deepmind
    developed this computer program that beat the human Go champion in a 5-game match,
    was due in greater part to reinforcement learning. The training of AlphaGo was
    to initialize an automated agent along with a human expert database but was subsequently
    refined by playing lots of games against itself during which reinforcement learning
    was applied.


    #### Robotics

    Robotic navigation is largely solved at least in static environments. Currently,
    the efforts are to consider how robots should be trained to interact with the
    world around it in predictable and generalizable ways. Another topic of current
    interest is such a natural requirement that arises in interactive environments
    is manipulation.

