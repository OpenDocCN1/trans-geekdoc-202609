    **Abstract-** Dengue disease is caused by the Aedes virus. The World Health Organization
    (WHO) reports an annual incidence of 100-400 million infections in 2019 which
    is the largest number of dengue cases reported and projected to date. It can be
    turned into life-threatening hemorrhagic fever which every occurs annually. This
    paper focuses on predicting dengue fever and its subtypes in the early stage of
    disease progression to ensure well-suited supportive care and therapy. We utilized
    a dataset of 101,000 cases which were reported to the WHO in 2019. Because such
    an outbreak can create havoc in society. Because the cost of dengue is high, it
    is crucial to reduce the causality. In this study, we developed a model to predict
    dengue fever. A patient dataset, containing information of the patient''s medical
    history and laboratory results, contains raw data of types of dengue fever from
    the Department of Chittagong Medical College Hospital. The dataset was split into
    70:30 ratio (70 for training and 30 for tests purposes). We applied machine learning
    forest (RF) in the proposed classification model. Finally, the decision tree resulted
    in an average accuracy of 79%, which is high for medical form.


    **Keywords—** Dengue Fever Prediction; Artificial Intelligence; Machine Learning;
    Clinical Decision Support


    I. INTRODUCTION

    Dengue fever is a dangerous disease. It is spread by the Aedes mosquito at their
    larva stage when they carry the dengue virus. The virus spreads when they bite
    human blood. It seems like a typical flu fever at the immediate stage. The significant
    symptoms do not appear at the early stage and only become visible when the victim


    reaches a critical stage. Seremiological studies show that if the virus infects
    anyone, then the immune system gets and the body enters dengue fever. Various
    clinical symptoms and anomalies are detected in the laboratories of dengue patients.
    These are similar to other normal fever like typhoid, murine fever, or just a
    fever. The dengue fever must be treated precisely at the primary stage [2]


    The dengue fever has four different serotypes, such as (DENV) DENV 1-4. A patient,
    bitten by the Aedes mosquitoes, suffers under a rash which involves fever, muscle
    pain, headache, and nausea [1]. Furthermore, people can face severe symptoms when
    they are bitten more than one time. Patients from cases of dengue hemorrhagic
    fever (DHF) are likely to get dengue shock syndrome (DSS) [4]. By infection of
    DHF or DSS [5], epidemicity has been set to reach as much as 10-40% in case of
    occurrence.


    The standard machine learning algorithms for predictions include support vector
    machine [8], decision tree [9-11], k-means [12], naive Bayes, sequential optimization
    and random forest [13, 15, 26]. However, the results of the methods were performed
    based on the classified outstanding dataset and of'
