    demographic regions. Moreover, one of the research combined patient medical history,
    clinical and personal data for the classification. Beside, recent research was
    carried out on fever prediction in Bangladesh. As the DENV has epidemic patterns,
    it is important to identify the high-risk regions of potential outbreak and to
    collect data from affected patients. Furthermore, with 101,000 cases reported
    in Bangladesh, two densely populated cities (Dhaka and Chittagong) were targeted
    for this study.


    We presented a machine machine learning (ML) model to predict dengue using the
    collected data. For this purpose, a dataset of 209 patients was gathered in 2019
    from the distinct medical colleges used. We then proceeded to derive the final
    dataset of 23 attributes belonging to the machine learning algorithms for dengue
    prediction. This research aims to assist the public in the self-diagnosis of dengue
    fever for consulting an expert and minimizing the doctor''s burden in advance.
    If our model succeeds with satisfactory accuracy then it will act as a treatment
    guide for the patients.


    Sharef, Nurhafidah Mohd, et al [21] evaluated a using a neural network with nonlinear
    regression and backpropagation. The study achieved 99% accuracy:


    TABLE I. Review of Dengue Related Research Papers


    | Area | Algorithm | Accuracy |

    | --- | --- | --- |

    | Marimuto, T [14] | Model for mining the dengue sequences | Association rules,
    support vector machine | SVM: 96.7% |

    | Rao, K, N [15] | Prediction of the occurrence of dengue | Decision tree (DT)
    | - |

    | Sharma, H [16] | Implemented mining from different state of India | Association
    rules, k-means | 94% |

    | Shaukat, K [17] | Implemented different algorithms and performed comparisons
    of them | Naive Bayes (NB) | NB: 88% |

    | Batha, R [18] | Predicted the outbreak of dengue based on environmental factors
    | Support machine (SVM) | 95% |

    | Subitha, N [19] | Detecting dengue using spatial mining | backpropagation |
    BPN: 95% |

    | Sudom, N [20] | Proposed a spatial clustering method for identifying the risk
    of dengue infection | ArcGIS10.1 | Unsupervised algorithm |

    | Sharef, Nurhafidah Mohd, et al [21] | Analyzed and evaluating of dengue prediction
    | Backpropagation and nonlinear regression | BPN: 93% |


    Marimuto, T., et al [14] presented a computational model to map the gene sequences
    for clustering among the dengue viruses. They established classification and association
    rules through the standards used and achieved 96.74% accuracy.


    Rao, K., N., et al [15] suggested a method found out association rules using the
    decision tree. They proposed the role of association rules for predicting the
    disease by analyzing the affected features of affected patients. Their model achieved
    99% accuracy.


    Shaukat, K., et al [16] proposed a classification and clustering model to detect
    dengue using the patients'' data from various states of India.


    Batha, R., et al [18] proposed a model using the support vector machine based
    on environmental features. The model used features and applied C-SVM using the
    Gaussian kernel for better accuracy. The executed model achieved better accuracy
    than their predictions.


    Subitha, N., et al [19] have described the mining model for dengue fever. They
    implemented KNN. In this paper, they improved the performance of mining. They
    have applied the model to segment microscopic blood image using a neural network
    to improve results about dengue fever. Backpropagation network applied to classification
    result. it 98% accuracy,


    A brief overview of dengue-related research was presented in Table I. We observed
    that the methods focused on publicly secondary data. Their achieving accuracy
    of the study model has no relation to the origin and the area of implementation
    are between different geographic locations. Moreover, most of the datasets had
    limited features, which in this study, we added relevant features to the patient''s
    personal, diagnostic, and symptom data.


    In this paper, we proposed a model (fig 1) to predict different types of dengue
    fever such as normal fever, extreme dengue fever. The model started with patients''
    data collection process followed by data processing, and then machine learning
    algorithms are to evaluate the result to the highest accuracy of prediction.'
