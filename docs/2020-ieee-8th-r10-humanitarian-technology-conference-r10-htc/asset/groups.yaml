    ![](img/7cabec6c4ba1b05a89d665c53a5229a7_4_0.png) Fig. 3. ROC curve of test data


    ![](img/7cabec6c4ba1b05a89d665c53a5229a7_4_1.png) Fig. 4. ROC curve of multiclass


    We derived the result values of classification parameters (Table V) as the following:


    - TPR = Recall/(TP+FN)

    - FPR = TN/(TN+FP)

    - Precision = TP/(TP+FP)

    - F-measure = 2*Precision*Recall/(Precision+Recall)

    - Accuracy = (TP+TN)/(Total)


    After the result evaluation, the random training accuracy decreased from 70% to
    68% whereas the decision tree accuracy increased from 71% to 79%. Finally, the
    decision tree predicts with better accuracy other classifier, where true positive
    (TP), false positive (FP), false negative (FN), and true negative (TN) are parameters
    of confusion matrix [31-33].


    ## V. CONCLUSION


    Figure 3 shows the ROC curve of test data accuracy. ROC curve in figure 4 depicts
    the comparative analysis between TPR and FPR. The pink line represents the micro-average
    with 0.85 score; the blue line represents the macro-average with 0.83 score. The
    other lines show class individually. This paper proposed an ML-based model to
    predict fever. Data of 209 patients collected from Dhaka and Chittagong hospitals.
    Finally, an accuracy of 79% was achieved using the decision tree, and finalized
    for our model to classify three types of dengue. This model will be useful for
    patients to follow up on the disease, and medical practitioners can quickly diagnose
    the patient''s data. In the future, we will seek additional risk factors and location-based
    data added for effective generation.


