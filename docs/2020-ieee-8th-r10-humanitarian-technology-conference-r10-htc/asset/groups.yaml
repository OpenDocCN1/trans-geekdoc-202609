    Chittagong, 孟加拉\nravinaravi@gmail.com\n\n**摘要-** 登革热是由伊蚊病毒引起的。世界卫生组织（WHO）报告显示，2019年每年有1亿至4亿例感染，这是迄为止报告和预测的登革热病例数量最多。它可能演变为危生命的出血性热，且每年都会发生。本文重点关注在疾病进展的早期预测登革热及其亚型，以确保获得合适的支持性护理和治疗。我们利用了2019年向世界卫生组织报告的101,000例病例的数据集。因为这种爆发会给社会造成巨大混乱。由于登革热的成本很高，降低死亡率至关重要。在这项研究中，我们开发了一个预测登革热的模型。患者数据集包含患者的病史和实验室结果信息，包含了来自Chittagong医学院医院的登革热类型原始数据。数据集按70:30的比例划分（70%用于训练，30%用于测试）。我们在提出的分类模型中应用了机器学习森林（RF）。最后，决策树的平均准确率为79%，这对于医学模型来说是一个高水平。\n\
    \n**关键词—** 登革热预测；人工智能；机器学习；临床决策支持\n\n## I. 引言\n\n登革热是一种危险的疾病。它通过携带登革病毒的伊蚊幼虫阶段传播。病毒在叮咬人类血液时扩散。在初期阶段，它看起来像典型的流感发热。显著症状在早期并不出现，只有当患者进入关键阶段时才会可见。流行病学研究显示，如果病毒感染任何人，免疫系统就会产生反应，身体进入登革热状态。在登革热患者的实验室中可以检测出各种临床症状和异常。这些与伤寒、鼠疫热或普通发热等正常发热相似。登革热必须在初期阶段进行精确治疗\
    \ [2]。\n\n登革热有四种血型，如 (DENV) DENV 1-4。被伊蚊叮咬的患者会遭受皮疹，并伴有发热、肌肉疼痛、头痛和恶心 [1]。此外，人们在被叮咬多次后可能会面临严重症状。登革热出血性热（DHF）病例可能会发生登革热休克综合征（DSS）[4]。通过DHF或DSS的感染\
    \ [5]，一旦发生，其流行率可能高达10-40%。\n\n用于预测的标准机器学习算法包括支持向量机 [8]、决策树 [9-11]、k均值 [12]、朴素贝叶斯、序列优化和随机森林\
    \ [13, 15, 26]。然而，这些方法的结果是基于分类的优秀数据集和人口统计区域进行的。此外，其中一项研究结合了患者病史、临床和个人数据进行分类。此外，近期对孟加拉的发热预测进行了研究。由于DENV具有流行病模式，识别潜在爆发的高风险地区并从受影响患者那里收集数据非常重要。此外，由于孟加拉报告了101,000例病例，本研究针对了两个人口稠密的城市（达卡和吉塔洪格）。\n\
