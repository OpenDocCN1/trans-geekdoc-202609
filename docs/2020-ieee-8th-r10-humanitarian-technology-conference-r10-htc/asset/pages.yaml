    # C. Feature Selection


    Feature selection is the process of reducing the number of input variables when
    developing a predictive model. It is desirable to reduce the number of input variables
    to reduce the computational cost of modeling, and in some cases, improve the performance
    of the model. In ours, we have matching datasets, and we use the "median" method
    to remove these variables. We use fit and transform() to normalize and standardize
    our data.


    # D. Data Split


    After preprocessing, we split our dataset into different ratios of train and test
    dataset using in-function train_test_split(). We get the best performance with
    a ratio of 70% training and 30% testing dataset.'
