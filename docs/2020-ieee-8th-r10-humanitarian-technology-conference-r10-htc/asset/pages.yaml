    # IV. RESULT AND DISCUSSION


    A receiving characteristic curve or ROC curve

    is one kind of graphical representation using a plot

    demonstrates the ability of a binary classifier

    system based on a threshold [22 - 24]. It is a probability

    curve, and the area (ROC) represents the

    degree of separation; it is plotted by the positive rate

    (TPR) on the y-axis against the false positive rate (FPR)

    on the x-axis at various thresholds. The test sensitivity, recall, or probability

    detection process. A false-positive rate represents

    probability of false alarm [27-30].


    The confusion matrix is used to describe the

    performance of a classification model. Table V shows

    comparative result derived from the confusion matrix

    training and test data of DT and RF.


    | Algorithms | Precision | Recall | F-Measure |

    |---|---|---||

    | DT Training | 0.82 | 0.82 | 0.82 |

    | DT Test | 0.79 | 0.79 | 0.79 |

    | RF Training | 1.00 | 1.00 | 1.00 |

