    We derived the result values of the classification

    parameters (Table V) as the following:


    ```

    TPR = Recall/TP/(TP+FN)

    ```


    ```

    FPR = TN/(TN+FP)

    ```


    ```

    Precision= TP/(TP+FP)

    ```


    ```

    F-measure=2*TP/(2TP+FP)

    ```


    ```

    Accuracy= (TP+TN)/(P+N)

    ```


    After the result evaluation, it the random

    fever training accuracy was decreased in the testing model

    from 70% to 68% whereas the decision tree training

    accuracy increased from 71% to

    79%. Finally, the decision tree predicts with better accuracy

    an other classifier.


    where, true positive(TP), false positive(FP), false

    negative(FN), and true negative(TN) are parameters of

    confusion matrix [31-33]


    # V. CONCLUSION


    Figure 3 shows the ROC curve of test data accuracy.

    ROC curve in figure 4 depicts the comparative

    analysis between TPR and FPR. The pink line represents

    the micro-average with a 0.85 F1 score; the blue line represents

    the macro-average with a 0.83 score. The other lines

    show 3 class areas individually.


    This paper proposed an ML-based model to predict

    dengue fever. Data of 209 patients collected from

    Dhaka and Chittagong medical hospitals. Patients''

    personal data


    Finally, an accuracy of 79% was achieved using the

    decision tree, and finalized for our model to

    classify three types of dengue fever. This model will be

    useful for the patients to follow up on the disease, and

    the medical practitioners can quickly diagnose the fever

    base on the patient''s data.


    In the future, we will seek additional and

    risk factors for dengue fever which to be included in the

    dataset. Beside and location-based data also be

    added for effective generation and classification.'
