  md: '# E. Patients'' Fever Classification


    Decision tree and random forest algorithms were used to predict fevers. CART (classification
    and regression) were used to split the decision tree for an imperfect fever dataset.
    If a label is randomly selected according to the distribution of labels in the
    set. An attribute with the lowest impurity is chosen to split the node.


    in Figure 2. It is to note that rapid breathing has the lowest impurity and is
    selected as a root node for the decision tree. If a node has Gini index 0 it will
    give a decision and cannot be divided. All the leaves give fever class.


    a) Equation of Gini Impurity


    Gini index is a statistical measure of inequality ranging from 0 (absolute) to
    1 (absolute). Gini impurity of a node is the probability that a randomly chosen
    sample in a node would be incorrectly labeled if it was labeled by the distribution
    of samples in the node. The decision tree tries to minimize when splitting each
    node. The equation (1) formulas the Gini index, where D is the 209 patients dataset,
    P is the total probability of a patient belongs to a fever class, and n is the
    number of fever classes. Gini (D) measures the impurity for the whole dataset.


    b) Equation of Random Forest


    A decision tree is prone to overfitting, which means that it learns rules for
    the train set, and those rules are not generalized well the train set. To overcome
    this, random forest (RF) algorithm works as it merges numerous decision trees
    into a single ensemble. As a result, it generated different datasets from its
    original dataset (D-209) using the bootstrap method, and constructed n decision
    trees. The final value was calculated by averaging all the predicted values of
    the m trees in the forest.


    ```

    Gini(D) = 1 - \sum_{i \in D} n_i^2

    ```


    If D splits on A two subsets D1 and D2 then Gini index for a particular attribute
    is shown in (2):


    ```

    Gini(D) = \frac{|D1|}{|D|}Gini(D1) + \frac{|D2|}{|D|}Gini(D2)

    ```


    In equation (3), we calculate the reduction of impurity for a particular attribute,


    ```

    \DeltaGini(D) = Gini(D) - Gini(A)

    ```


    ```

    RF_fi = \frac{\sum_{D \in all trees} norm_{fiID}}{m}

    ```


    where, rf sub(i) is importance of feature i calculated from all the trees in the
    RF, rf sub(d) is normalized importance for feature in D, and m is total number
    of trees. The importance of each feature was derived in equation (5):


    ```

    fr_i = \frac{\sum_{D \in nodes} bn_i(D)}{\sum_{D \in nodes} bn(m)}

    ```


    where, fr sub(i) is importance of feature i, bn sub(D) is the importance of node
    D. For creating a node in RF, a node importance was calculated using gini impurity
    (6):


    ```

    bn_d = wt(d)Gini(D) - wt(left)Gini(left) - wt(right)Gini(right)

    ```


    where, bn(d) is the importance of binary node d, wt(d) is weighted number of samples
    reaching node d, left(d) and right(d) is right child node of node D after split.


