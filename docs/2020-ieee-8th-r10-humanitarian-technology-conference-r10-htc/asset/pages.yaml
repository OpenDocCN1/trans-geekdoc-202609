    Marimuto, T., et al [14] presented a computational model to map the gene sequences
    for clustering among the dengue viruses. They established classification and association
    rules through the standards used and achieved 96.74% accuracy.


    Rao, K., N., et al [15] suggested a method found out association rules using the
    decision tree. They proposed the role of association rules for predicting the
    disease by analyzing the affected features of affected patients. Their model achieved
    99% accuracy.


    Shaukat, K., et al [16] proposed a classification and clustering model to detect
    dengue using the patients'' data from various states of India.


    Batha, R., et al [18] proposed a model using the support vector machine based
    on environmental features. The model used features and applied C-SVM using the
    Gaussian kernel for better accuracy. The executed model achieved better accuracy
    than their predictions.


    Subitha, N., et al [19] have described the mining model for dengue fever. They
    implemented KNN. In this paper, they improved the performance of mining. They
    have applied the model to segment microscopic blood image using a neural network
    to improve results about dengue fever. Backpropagation network applied to classification
    result. it 98% accuracy,


    A brief overview of dengue-related research was presented in Table I. We observed
    that the methods focused on publicly secondary data. Their achieving accuracy
    of the study model has no relation to the origin and the area of implementation
    are between different geographic locations. Moreover, most of the datasets had
    limited features, which in this study, we added relevant features to the patient''s
    personal, diagnostic, and symptom data.


    In this paper, we proposed a model (fig 1) to predict different types of dengue
    fever such as normal fever, extreme dengue fever. The model started with patients''
    data collection process followed by data processing, and then machine learning
    algorithms are to evaluate the result to the highest accuracy of prediction.'
