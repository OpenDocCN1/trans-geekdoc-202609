    \ is treated as a constant and removed. The weights of *block* and *dblock* kernels\
    \ are obtained similarly.\n\n## Algorithm 1 DP-Judgment Without Row Number Limit\n\
    \n```\n**Input:** The set of kernels $Ker = \\{Ker_1, Ker_2, \\dots, Ker_n\\}$;\
    \ Compute time limit $C^*_time$; Height limit of WSE $H_{WSE}$:\n1. **for** $i\
    \ = 1 \\dots n$ **do**\n   2.   **for** $k = 1 \\dots i$ **do**\n   3.      $NewHeight\
    \ \\leftarrow f_{i-k}$\n   4.      $+ GetHeight(\\{Ker_{i-k+1}, \\dots, Ker_i\\\
    }, C^*_time)$\n   5.      **if** $NewHeight < f_i$ **then**\n   6.         $f_i\
    \ \\leftarrow NewHeight$\nPlacement with compute time limit $C^*_time$ is achievable\
    \ if and only\nif $f_n \\leq H_{WSE}$\n```\n\nHowever, even with given areas,\
    \ the $C_{time}$ still varies with the parameters of kernels. So we pick the kernel\
    \ with largest area, calculate its all compute times in different combination\
    \ of parameters under the area constraint, and select the minimum one to be the\
    \ estimated $C_{time}$. The initial search interval is set from one-tenth of the\
    \ estimated $C_{time}$ to ten times of it, which is proved practically large enough\
    \ in our experiments.\n\nNext, for the targeted $C^*_time$, we will exploit DP\
    \ algorithm to generate a placement with minimum height to judge if it is legal.\
    \ During DP progress, all execution parameters of each kernel will be determined.\n\
    \n### 3.2 DP-Judgment\n\nWe design two different DP based judgment algorithms.\
    \ The first one will get a placement without limiting number of rows and it tends\
    \ to get better $C_{time}$. The second one sets a row number limit because many\
    \ rows always lead to large $C_{time}$. Although this limit will lead to a slight\
    \ deterioration of $C_{time}$, it will bring much better $C_{dist}$.\n\n### 3.2.1\
    \ DP-Judgment Without Row Number Limit\n\nAlgorithm 1 describes the judgment function\
    \ for a targeted $C^*_time$ and the row number will be determined automatically.\
    \ $f_i$ means the minimum height used in the case of the first $i$ kernels were\
    \ placed in topological order. If there are $k$ kernels in the last row, $f_i$\
    \ can be calculated by:\n\n```\n$f_i = f_{i-k} + GetHeight(\\{Ker_{i-k+1}, \\\
    dots, Ker_i\\}, C^*_time)$ (5)\n```\n\nHere, $Ker_i$ is the i-th kernel. The $GetHeight$\
    \ is a function which places a set of kernels in a row and returns the minimum\
    \ height of the row, which will be introduced in Section 3.3. We get the minimum\
    \ $f_i$ after enumerating all $k$. If more than one $k$ get the minimum $f_i$,\
    \ we choose the one whose $C_{dist}$ and $C_{adapter}$ is smaller. In the end,\
    \ we get $f_n$ as the final height while all the kernels are placed. We can accept\
    \ the $C^*_time$ if $f_n$ is smaller than height limit $H_{WSE}$.\n\n### 3.2.2\
    \ DP-Judgment With Row Number Limit\n\nIn order to find some other result with\
    \ possibly better $C_{dist}$, we come up with another DP-Judgment described in\
    \ Algorithm 2. The main difference is that the row number $R$ is fixed in the\
    \ second algorithm. $f_{i,j}$ means the minimum height used in the case that the\
    \ first $i$ kernels were placed in topological order and $j$ rows are used in\
    \ the meantime. If there are $k$ kernels in the last row, $f_{i,j}$ can be calculated\
    \ by:\n\n```\n$f_{i,j} = f_{i-k, j-1} + GetHeight(\\{Ker_{i-k+1}, \\dots, Ker_i\\\
    }, C^*_time)$ (6)\n```\n\nUsing this DP equation, we can get the minimum $C^*_time$\
    \ while kernels are placed in $R$ rows. In general, as the number of rows decreases,\
    \ $C_{dist}$ will also decrease, but $C_{time}$ will increase. So we can try different\
    \ $R$ to find a balance between $C_{dist}$ and $C_{time}$. Our experimental result\
    \ demonstrates that when the placement of Algorithm 2 is better than Algorithm\
    \ 1, $R$ is always one or two.\n\n## Algorithm 2 DP-Judgment With Row Number Limit\n\
    \n```\n**Input:** The set of kernels $Ker = \\{Ker_1, \\dots, Ker_n\\}$; Compute\
    \ time limit $C^*_time$; Row number $R$; Height limit of WSE $H_{WSE}$:\n1. **for**\
    \ $i = 1 \\dots n$ **do**\n   2.   $f_{i,1} \\leftarrow GetHeight(\\{Ker_1, Ker_2,\
    \ \\dots, Ker_i\\}, C^*_time)$\n   3.   **for** $j = 2 \\dots R$ **do**\n   4.\
    \     **for** $i = 1 \\dots n$ **do**\n   5.       **for** $k = 1 \\dots n$ **do**\n\
    \   6.         $NewHeight \\leftarrow f_{i-k, j-1}$\n   7.         $+ GetHeight(\\\
    {Ker_{i-k+1}, \\dots, Ker_i\\}, C^*_time)$\n   8.         **if** $NewHeight <\
    \ f_{i,j}$ **then**\n   9.           $f_{i,j} \\leftarrow NewHeight$\nPlacement\
    \ with compute time limit $C^*_time$ is achievable if and only\nif $f_{n,R} \\\
    leq H_{WSE}$\n```\n\nWhen the value of $R$ is one, all the kernels are placed\
    \ as strips as Figure 5(a) shows and we always get the best $C_{dist}$. However,\
    \ this placement always get a high $C_{time}$. As a result we try to decrease\
    \ some kernel's height. We place some kernels as horizontal strip, next place\
    \ other kernels in one row as Figure 5(d) shows. The $C_{time}$ and $C_{dist}$\
    \ of this strategy are between the result of DP with $R=1$ and $R=2$.\n\nWhen\
    \ the weight of $C_{dist}$ is huge, the $R=1$ appears to get the best result.\
    \ In order to get better $C_{dist}$, compute time limit is enlarged. After getting\
    \ minimum $C_{time}$, we multiply it by $\\alpha$ and run DP-Judgment to get the\
    \ result. The $\\alpha$ is assigned 80 times from $1.02$ to $1.02^{80}$ in our\
    \ algorithm.\n\nIn short, several strategies with row number limit are tried and\
    \ the best result should be selected. In order to get the minimum total cost $C_{total}$,\
    \ Algorithm 1 and Algorithm 2 will both be run and the best placement will be\
    \ selected.\n\n### 3.3 Row Height Minimization\n\nIn this section, the algorithm\
    \ for function $GetHeight$ is introduced. Another binary search is used to find\
    \ the minimum row height $H_{limit}$ that all the kernels can be placed in a row\
    \ in the case of compute time and width limits are fixed. We define a guessed\
    \ value of $H_{limit}$ as $H^w_{limit}$ . The $H^w_{limit}$ is equal to the middle\
    \ number of the binary search's range. The height of every kernel is set to be\
    \ $H^w_{limit}$ and then we place kernels in a row from left to right one by one.\
    \ We can accept $H^w_{limit}$ if the total width is smaller than the width limit\
    \ of WSE after all the kernels are placed, and then shrink the range of row height\
    \ to the smaller half, otherwise to the larger half.\n\nFor a given height, compute\
    \ time and memory limit, we need a function to figure out a set of parameter for\
    \ a kernel to get the minimum width. Our algorithm enumerates the values of $h$\
    \ and $w$ using two levels of loops with effective pruning and then figures out\
    \ the corresponding $c$ and $k$. After that, we pick a set of parameter which\
    \ brings minimum width. We consider two situations, rotating kernels by 90 degree\
    \ or not.\n\nIf we do not rotate the kernel, in order to get a smaller compute\
    \ time, the height of every convolution is better to be $H^w_{limit}$. Based on\
    \ Equation (1a), the parameter $c$ of every convolution is:\n\n```\n$c = \\lfloor\
    \ \\frac{H^w_{limit}}{\\lceil h \\times w - 1 \\rceil} \\rfloor$ (7)\n```\n\n\
    In order to satisfy the memory $M_{limit}$, according to Equation (1d), the parameter\
    \ $k$ of each convolution must satisfy:\n\n```\n$k \\geq \\lceil \\frac{K \\times\
    \ \\frac{C}{c} \\times R \\times S + \\frac{W+1}{w} \\times \\frac{H+R-1}{R}}{M_{limit}}\
    \ \\rceil$ (8)\n```\n"
