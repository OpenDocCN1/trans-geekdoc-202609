    (1d), the parameter $c$ of each convolution must satisfy:


    $$c \geq \frac{C \times K/k \times R \times S}{M_{limit} - \frac{W+S}{w} \times
    \frac{H+R-1}{h} \times \frac{K}{k}} \quad (11)$$


    In order to satisfy the compute time limit, according to Equation (1c), the parameter
    $c$ of each convolution must satisfy:


    $$c \geq \left\lceil \frac{C}{C^*_{time} \div \left(\left\lceil \frac{H}{h} \right\rceil
    \times \left\lceil \frac{W}{w} \right\rceil \times \left\lceil \frac{K}{k} \right\rceil
    \times R \times S \div T^2\right)} \right\rceil \quad (12)$$


    ## 3.4 Refinement


    After placement generation, we perform two refinement algorithms to reduce adapter
    cost $C_{adapter}$ and L1 distance $C_{dist}$. Where the adapter cost refinement
    algorithm adjusts the execution parameters, the L1 distance refinement algorithm
    does not modify any parameters, but only changes the position of kernels or reorders
    them.


    ### 3.4.1 Adapter Cost Refinement


    In adapter cost refinement algorithm, the parameters of the kernels will be redetermined
    to decrease $C_{adapter}$ while the compute time $C_{time}$ is unchanged. A kernel
    will be picked up and its $h$ and $w$ parameters will be changed to be the same
    to kernels which are connected to it. Then other parameters will be recalculated
    to keep compute time and width unchanged. This process changes the selected kernel''s
    height. The legal adjustment area is defined as an area whose width is the kernel''s
    width and height is the row height. As Figure 6(a) shows, the blue kernel is selected
    and the highlight area is legal adjustment area. If the kernel is still in the
    legal adjustment area, this change is acceptable. The $h$ and $w$ parameter will
    be redetermined to be the pair which brings the minimum $C_{adapter}$. All kernels
    will be tried like this. The process will run several times until there is no
    improvement.


    ### 3.4.2 L1 distance Refinement


    The L1 distance refinement algorithm picks each row and moves kernels in the row
    to search better $C_{dist}$. We adapt a window-based local reordering technique
    similar to FastPlaceDP [8]. A window covering several continuously kernels will
    move from the beginning to the ending of the row as Figure 6(b) shows. The all
    possible orders of kernels in the window will be enumerated and the result will
    be saved if $C_{dist}$ decreases. The size of the window is set to 6 to balance
    the run time overhead and quality improvement. Besides, the position of some continuously
    kernels will be reversed as another simple strategy whose window size is much
    bigger than local reordering. This step will be iterated for many times until
    there is no improvement.


    ## 4 EXPERIMENTAL RESULTS


    We implement GigaPlacer in C++ and compile it with g++ 5.4.0. Benchmarks [5] are
    from ISPD 2020 Contest with number of kernels ranges from 16 to 100 as Table 1
    shows. All experiments were conducted on a linux machine with a 1.6GHz intel i5-10210U
    processor and 8-GB memory.


    GigaPlacer generates solutions by embedding several strategies in the DP-based
    algorithm. The experiment shows that the placement generation strategies we design
    are all effective, and all these strategies appear in the final result. Figure
    7 shows the final results of GigaPlacer on test cases E, I, M, and F.


    ## 5 CONCLUSION


    In this paper, we present GigaPlacer to place NN layers on WSE. A minimum compute
    time is achieved by a binary-search-based framework. Two DP-based algorithms focus
    on different objectives are integrated to place the kernels. To further reduce
    inter-kernel communication overhead, we adjust the parameters of connected kernels
    and try to reorder some kernels. Compared with the first place of the ISPD2020
    Contest, GigaPlacer is not only better but also faster. Our future work will be
    improving the judgment function to automatically optimize the inter-kernel distance,
    instead of setting limitation of row numbers manually. We also intend to explore
    more topologies to place the kernels for better performance.


