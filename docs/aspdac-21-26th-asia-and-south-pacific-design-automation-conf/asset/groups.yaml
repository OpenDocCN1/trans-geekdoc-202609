    # 图 6：两种细化算法。


    为了满足计算时间限制 $C^*_{time}$，根据公式 (1c)，每个卷积的参数 $k$ 必须满足：


    $$k \geq \left\lceil \frac{K}{C^*_{time} \div \left(\left\lceil \frac{H}{h} \right\rceil
    \times \left\lceil \frac{W}{w} \right\rceil \times \left\lceil \frac{C}{c} \right\rceil
    \times R \times S \div T^2\right)} \right\rceil \quad (9)$$


    因此我们可以得到满足公式 (8) 和 (9) 的最小 $k$。


    此外，我们可以将核旋转 90 度。在这种情况下，所有卷积的总宽度为 $H^*_{limit}$。为了使每个卷积的高度相似，其宽度按以下比例分配：


    $$\left\lceil \frac{H}{h} \right\rceil \times \left\lceil \frac{W}{w} \right\rceil
    \times R \times S \times C \times K \div T^2 \quad (10)$$


    根据公式 (1b)，在分配宽度后计算每个卷积的参数 $k$。为了满足内存限制，根据公式 (1d)，每个卷积的参数 $c$ 必须满足：


    $$c \geq \frac{C \times K/k \times R \times S}{M_{limit} - \frac{W+S}{w} \times
    \frac{H+R-1}{h} \times \frac{K}{k}} \quad (11)$$


    为了满足计算时间限制，根据公式 (1c)，每个卷积的参数 $c$ 必须满足：


    $$c \geq \left\lceil \frac{C}{C^*_{time} \div \left(\left\lceil \frac{H}{h} \right\rceil
    \times \left\lceil \frac{W}{w} \right\rceil \times \left\lceil \frac{K}{k} \right\rceil
    \times R \times S \div T^2\right)} \right\rceil \quad (12)$$


    ## 3.4 细化


    在布局生成后，我们执行两种细化算法以降低适配器成本 $C_{adapter}$ 和 L1 距离 $C_{dist}$。其中适配器成本细化算法调整执行参数，L1
    距离细化算法不修改任何参数，仅改变核的位置或重新排序它们。


    ### 3.4.1 适配器成本细化


    在适配器成本细化算法中，核的参数将被重新确定以降低 $C_{adapter}$，同时计算时间 $C_{time}$ 保持不变。会挑选一个核，并将其 $h$
    和 $w$ 参数更改为与其相连的核相同。然后重新计算其他参数以保持计算时间和宽度不变。此过程会改变所选核的高度。合法调整区域定义为宽度为核的宽度、高度为行高的区域。如图
    6(a) 所示，蓝色核被选中，高亮区域为合法调整区域。如果核仍在合法调整区域内，则此更改是可以接受的。$h$ 和 $w$ 参数将被重新确定为使 $C_{adapter}$
    最小的配对。所有核都将以这种方式尝试。该过程将多次运行，直到没有改进为止。


    ### 3.4.2 L1 距离细化


    L1 距离细化算法挑选每一行并移动该行中的核以搜索更好的 $C_{dist}$。我们采用与 FastPlaceDP [8] 类似的基于窗口的局部重排序技术。一个覆盖若干连续核的窗口将从行的开头移动到行尾，如图
    6(b) 所示。窗口中核的所有可能顺序将被枚举，如果 $C_{dist}$ 减小则保存结果。窗口大小设置为 6 以平衡运行时间开销和质量提升。此外，一些连续核的位置将被反转，作为另一种简单的策略，其窗口大小远大于局部重排序。此步骤将迭代多次，直到没有改进为止。


    ## 4 实验结果


    我们使用 C++ 实现 GigaPlacer 并使用 g++ 5.4.0 编译。基准测试 [5] 来自 ISPD 2020 竞赛，核的数量范围从 16 到
    100，如表 1 所示。所有实验均在配备 1.6GHz Intel i5-10210U 处理器和 8GB 内存的 Linux 机器上进行。


    GigaPlacer 通过在基于 DP 的算法中嵌入多种策略来生成解决方案。实验表明，我们设计的布局生成策略都有效，并且所有这些策略都出现在最终结果中。图
    7 显示了 GigaPlacer 在测试案例 E、I、M 和 F 上的最终结果。


    ## 5 结论


    在本文中，我们提出了 GigaPlacer 用于在 WSE 上放置 NN 层。通过基于二分搜索的框架实现了最小计算时间。两种关注不同目标的基于 DP 的算法被集成以放置核。为了进一步降低核间通信开销，我们调整了相连核的参数并尝试重新排序一些核。与
    ISPD2020 竞赛的第一名相比，GigaPlacer 不仅更好而且更快。我们未来的工作将改进判断函数以自动优化核间距离，而不是手动设置行数限制。我们还打算探索更多拓扑以放置核以获得更好的性能。


