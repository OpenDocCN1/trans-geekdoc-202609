    \nGengjie Chen  \nGiga Design Automation  \ngchen@giga-da.com\n\nHailong You \
    \ \n西安电子科技大学  \nhlyou@mail.xidian.edu.cn\n\n**摘要** 为满足深度学习应用对计算资源日益增长的需求，ASIC\
    \ 加速器是必要的。近期提出了一种晶圆级引擎（WSE）[1]，它能够同时加速神经网络（NN）中的多个层。然而，如果没有高质量的放置将 NN 层正确映射到 WSE\
    \ 上，则无法实现加速效率。这里，WSE 放置类似于将块放置到芯片区域的传统 ASIC 布局规划问题，但它们从根本上是不同的。由于最慢的层决定了整个 NN\
    \ 在 WSE 上的计算时间，工作负载更重的层需要更多的计算资源。此外，层的所在位置和内部 I/O 连接的协议适配器成本会影响层间通信开销。在本文中，我们提出了\
    \ GigaPlacer 来应对这一新挑战。开发了一种基于二分搜索的框架以获得 NN 的最小计算时间。两种具有不同优化策略的基于动态规划的算法被集成以生成合法放置。通过一些细化，可以进一步最小化连接层之间的距离和适配器成本。与\
    \ ISPD2020 竞赛的第一名相比，GigaPlacer 将竞赛指标最多降低了 6.89%，平均降低了 2.09%，同时运行速度快了 7.23 倍。\n\
