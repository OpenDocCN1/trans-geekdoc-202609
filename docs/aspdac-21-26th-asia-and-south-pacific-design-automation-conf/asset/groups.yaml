    kernel for example, it contains *three conv* kernels, where the calculation methods
    of metrics of each *conv* kernel are same as in Equation (1). And in the *conv*
    kernels, the formal parameters R and S are determined by *F*, a given formal parameter
    of the *dblock* kernel. Because the *conv*s are placed horizontally, the width
    of the *block* kernel is the sum of widths of *conv* kernels, while other metrics
    pick the maximum one.


    In the WSE placement problem, the kernel connections are specified by a kernel
    graph. The communication overhead between two connected kernels is related to
    their distance but also the protocol adapter. The adapter cost represents the
    mismatching of the I/O protocols of connected kernels. For each connection, the
    adapter cost is the number of parameter ($h$, $w$, $c$) mismatches between the
    two connected kernels.


    # 2.4 Problem Formulation


    In general, the WSE placement problem can be formally defined as follows. A kernel
    library specifying the performance functions of kernels and a kernel graph with
    connection relationships are given. The following constraints should be satisfied:


    +   - All kernels must be placed in the tile grid with dimensions of 63×63×;

    +   - A kernel must be a rectangle and contain an integer number of tiles;

    +   - No overlap between kernels is allowed;

    +   - The unit memory of each tile in kernels should not exceed the memory limit,
    48KB.


    And the optimization objective is to minimize a weighted sum of


    +   - *C*_dist, the total L1 distance between communicating kernels,

    +   - *C*_time, the maximum compute time of all kernels,

    +   - *C*_adapter, the sum of the adapter cost of each connections.


    That is, the total cost *C*_total is:


    ```

    $$C_{total} = w_{dist}C_{dist} + w_{time}C_{time} + w_{adapter}C_{adapter},$$

    (2)

    ```


    where $w_{dist}$, $w_{time}$ and $w_{adapter}$ are the weights for the corresponding
    costs.


    # 3 ALGORITHMS


    In this section, we will describe the placement generation algorithms. Figure
    4 describes the overall flow for GigaPlacer. The main framework is described in
    Section 3.1. To get a balanced result between compute time $C_{time}$ and L1 distance
    $C_{dist}$, approaches based on binary search but with different judgement by
    DP are proposed in Section 3.2. Section 3.3 introduces the algorithm for placing
    kernels in a row, which is used in DP. We also perform a refinement to decrease
    $C_{dist}$ and adapter cost $C_{adapter}$ and it will be mentioned in Section
    3.4.


    ![](img/9193339587477a25149234f19dc04369_2_1.png)


    Figure 5: Example placements by GigaPlacer. Kernels are placed row by row. They
    are generated for a same NN design while row number *R* is different.


    # 3.1 Binary-Search-Based Framework


    In this section, we propose a framework which generates a placement with minimum
    $C_{time}$ while kernels are legally placed in restricted area. GigaPlacer places
    the kernels row by row as in Figure 5. In this way, if the kernels are placed
    in a certain order, the $C_{time}$ is monotonic with the total height. So binary
    search can help us *find* the minimum $C_{time}$. In each iteration of binary
    search, we define a guessed value of $C_{time}$ as $C_{time}^{ss}$. The $C_{time}^{ss}$
    is equal to the middle height of the search range. If all kernels can be placed
    legally while their compute time is smaller than $C_{time}^{ss}$, the search range
    of $C_{time}$ will be shrunk to the smaller half, otherwise it will be shrunk
    to the larger half.


    Since a smaller initial search range helps to reduce the runtime of binary search,
    an estimation of $C_{time}$ is needed. The minimum $C_{time}$ can be achieved
    when the compute time is uniform across all kernels. To keep the compute time
    roughly equal, the kernels'' areas should generally subject to a set of ratios
    that is calculated from the formulas in Figure 3. To be more specific, the area
    weights of kernels (for *conv*, *block* and *dblock* respectively) are set to:


    ```

    $$w_{conv} = HWC KRS / T^{2}$$

    (3a)


    $$w_{block} = 29 / (64 × HWF^{2})$$

    (3b)


    $$w_{dblock} = 17 / (16 × HWF^{2})$$

    (3c)

    ```


    For instance, based on Equation (1), the weight $w_{conv}$ of a *conv* kernel
    is approximated by


    ```

    $$w_{conv} = width × height = hw(c + 1) × 3k$$

    $$≈ 3 × hwc × \frac{3}{time} × \frac{HWC KRS}{T^{2}}$$

    (4)

    ```


    Here, $3/time$ is treated as a constant and removed. The weights of *block* and
    *dblock* kernels are obtained similarly.'
