    \ Li  \nXidian University  \nbzli@stu.xidian.edu.cn  \n  \nQi Du  \nXidian University\
    \  \nqdu@stu.xidian.edu.cn  \n  \nDingcheng Liu  \nXidian University  \ndcliu1997@gmail.com\
    \  \n  \nJingchong Zhang  \nXidian University  \njc zhang_1@stu.xidian.edu.cn\
    \  \n  \nGengjie Chen  \nGiga Design Automation  \ngchen@giga-da.com  \n  \nHailong\
    \ You  \nXidian University  \nhlyou@mail.xidian.edu.cn\n\n**ABSTRACT** To meet\
    \ the growing demand from deep learning applications for computing resources,\
    \ accelerators by ASIC are necessary. A wafer-scale engine (WSE) is recently proposed\
    \ [1], which is able to simultaneously accelerate multiple layers from a neural\
    \ network (NN). However, without a high-quality placement that properly maps NN\
    \ layers onto the WSE, the acceleration efficiency cannot be achieved. Here, the\
    \ WSE placement resembles the traditional ASIC floorplan problem of placing blocks\
    \ onto a chip region, but they are fundamentally different. Since the slowest\
    \ layer determines the compute time of the whole NN on WSE, a layer with a heavier\
    \ workload needs more computing resources. Besides, locations of layers and protocol\
    \ adapter cost of internal IO connections will influence inter-layer communication\
    \ overhead. In this paper, we propose GigaPlacer to handle this new challenge.\
    \ A binary-search-based framework is developed to obtain a minimum compute time\
    \ of the NN. Two dynamic-programming-based algorithms with different optimizing\
    \ strategies are integrated to produce legal placement. The distance and adapter\
    \ cost between connected layers can be further minimized by some refinements.\
    \ Compared with the first place of the ISPD2020 Contest, GigaPlacer reduces the\
    \ contest metric by up to 6.89% and on average 2.09%, while runs 7.23x faster.\n\
    \n![](img/9193339587477a25149234f19dc04369_0_0.png)\n\n**ACM Reference Format:**\
    \  \nBenzheng Li, Qi Du, Dingcheng Liu, Jingchong Zhang, Gengjie Chen, and Hailong\
    \ You. 2021. *Placement for Wafer-Scale Deep Learning Accelerator*. In *26th Asia\
    \ and South Pacific Design Automation Conference (ASP-DAC '21)*, January 18–21,\
    \ 2021, Tokyo, Japan. ACM, New York, NY, USA, 6 pages. https://doi.org/10.1145/3394855.3431563\n\
    \n# ## 1 INTRODUCTION\n\nWith a blossoming of deep learning applications in the\
    \ 2010s [9], accelerating neural networks (NNs) is becoming a prominent issue\
    \ in order to satisfy the rapidly increasing computational requirements. Specialized\
    \ accelerator by ASIC is a promising technique for this problem. For instance,\
    \ an accelerator called DianNao [3] is 117.87 times faster than a 128-bit 2GHz\
    \ SIMD processor, with a reduction of total energy by 21.08x. Tensor processing\
    \ unit (TPU) proposed by Google [6] is on average about 15-30x faster over its\
    \ contemporary CPU or GPU, improving TOPS/Watt by about 30-80x. Recently, a wafer-scale\
    \ engine (WSE) is proposed by Cerebras [1]. Consisting of 400k programmable\n\n\
    cores and distributed on-chip memory, the WSE can partially accelerate computations\
    \ of multiple layers from a NN. It also offers high bandwidth for communication\
    \ between layers by local connectivity with a 2D mesh topology. However, to fully\
    \ utilize its capability, the placement of the layers implemented on WSE needs\
    \ thorough optimization.\n\nIn the WSE placement, each layer is mapped to be a\
    \ rectangular array of cores, called a kernel, as shown in Figure 1. The influence\
    \ on the acceleration efficiency by the placement includes allocation of cores,\
    \ arrangement of the kernels' locations and protocol adapter cost of connections.\
    \ Since the kernel with the lowest throughput determines the overall performance,\
    \ the compute time should be kept uniform across all the kernels. Thus, the number\
    \ of cores allocated to a kernel needs to be proportional to the workload. Additionally,\
    \ the cores transfer data via the on-chip mesh network. So the intra-kernel communication\
    \ overhead is affected by the distance between the cores located to the kernel,\
    \ which can be characterized as the shape of the kernel. Similarly, the inter-kernel\
    \ communication overhead is influenced by the distance between cores in different\
    \ kernels. Besides, the protocol adapter cost, which is related to the parameters\
    \ of the connected kernels, also affects the inter-kernel communication.\n\nThe\
    \ WSE placement problem resembles the traditional floorplan problem, which is\
    \ to place a set of blocks (modules or macros) onto the 2D chip region. Simulated\
    \ annealing (SA) is a classic algorithm to search a good topology of blocks in\
    \ a floorplan. The topologies can be divided into two classes. Slicing structure\
    \ is a rectangle dissection generated by recursively slicing a rectangular region,\
    \ while non-slicing structure allows rectangles piled up irregularly. A representation\
    \ of slicing structures, called normalized Polish expression (nPe) [10], provides\
    \ operations for SA to perturb the floorplan. And the search of non-slicing floorplans\
    \ is enabled by representations like O-tree [4] and B*-tree [2]. Recently, an\
    \ approach based on reinforcement learning (RL) is-"
  - "[PAGE 1]\n\nproposed [7] to place the macros one at a time. States in this RL\
    \ placement problem are all the possible partial placement of a netlist, and the\
    \ available actions of a macro are the feasible locations. Actions are taken by\
    \ a policy network trained to generalize to unseen blocks.\n\nHowever, WSE placement\
    \ is fundamentally different from the floorplan problem. Both the areas and the\
    \ shapes of kernels remain to be determined in the WSE placement problem. Instead,\
    \ blocks in the floorplan problem are all with fixed area, and mostly with fixed\
    \ shapes. Besides, the number of adjustable parameters in WSE placement problem\
    \ is much greater, which significantly enlarges the solution space. As a result,\
    \ it’s difficult for SA-based and learning-based methods to generate nearly optimal\
    \ placements for WSE. On the other hand, the connectivity of a NN is dramatically\
    \ simpler than that of a floorplan netlist. In SA-based and learning-based methods,\
    \ great efforts are put into handling the complex connectivity of the blocks.\
    \ Therefore, placing layers in topological orders of the NN can substantially\
    \ reduce runtime with little sacrifice of quality. In our early exploration, we\
    \ tried implementing a SA algorithm based on nPe, and found its performance poor.\
    \ Even in the SA algorithm’s best case, its score was still 13% worse than GigaPlacer,\
    \ but took a 2.6 times longer runtime.\n\nTo optimize the compute time of NNs’\
    \ acceleration, we proposed an effective and efficient placer, called GigaPlacer,\
    \ to handle the WSE placement problem. Our contribution is summarized as follows:\n\
    \n+   - We proposed two dynamic-programming-based (DP-based) algorithms to place\
    \ the layers. A binary-search-based framework is adopted to guarantee the uniformity\
    \ of compute time of all kernels.\n+   - We proposed a row height minimization\
    \ algorithm to determine the optimal execution parameters for each kernel. We\
    \ exploit an effective enumeration technique with pruning, guided by binary search.\
    \ In this way, the wafer area will be fully utilized.\n+   - We proposed two techniques\
    \ to further refine the results. Inter-kernel distance is reduced by swapping\
    \ some kernels, and the protocol adapter cost is minimized by slightly adjusting\
    \ parameters of connected kernels.\n+   - In comparison with the first place of\
    \ the ISPD2020 Contest, we achieved a reduction on the contest metric by up to\
    \ 6.89% and on average 2.09%, with 7.23× runtime speed up.\n\n# 2  PRELIMINARIES\n\
    \nThis section introduces the basic structure of WSE at first. The parameters\
    \ and performance functions of kernels are presented later, and the problem formulation\
    \ is introduced in the end.\n\n# 2.1  Wafer-Scale Engine\n\nIn WSE, there are\
    \ around 400k tiles arranged in a 633×633 grid. Each tile has a programmable execution\
    \ core, 48KB SRAM, and a router for interconnection with other tiles.\n\nIn the\
    \ WSE placement problem, layers in NN are mapped to a set of rectangular kernels,\
    \ where each kernel occupies multiple tiles and performs an individual NN computational\
    \ task by running the execution cores of tiles in parallel [5].\n\n# 2.2  Kernel\
    \ Parameters\n\nThe performance of kernels is determined by various parameters\
    \ including formal parameters and execution parameters.\n\nH, W, R, S, C, K, T\
    \ are the formal parameters that are defined by NN specification and cannot be\
    \ modified by compilation procedure. As depicted in Figure 2, H and W represent\
    \ the sizes of input images; R and\n\n![](img/9193339587477a25149234f19dc04369_1_0.png)\n\
    \n```\nconvperf(H,W,R,S,C,K,T,h,w,c,k)={\n    height = h*w*(c+1)\n    width  \
    \ = 3*k\n    time    = ceil(H/h)*ceil(W/w)*ceil(C/c)*ceil(K/k)*R*S/T/T\n    memory\
    \  = C/c*K/R*S*(W+S-1)*(H+R-1)*h*k\n}\ndblockperf(H,W,F,h,w,c1,c2,c3,k1,k2,k3)={\n\
    \    conv1 = convperf(H,W,1,1,F,F/4,1,h,w,c1,k1)\n    conv2 = convperf(H,W,1,1,F,F/4,1,h,w,c2,k2)\n\
    \    conv3 = convperf(H,W,1,1,F,F/4,1,h,w,c3,k3)\n    height = max(conv1.height,conv2.height,conv3.height)\n\
    \    width  = conv1.width+conv2.width+conv3.width\n    time   = max(conv1.time,conv2.time,conv3.time)\n\
    \    memory = max(conv1.memory,conv2.memory,conv3.memory)\n}\nblockperf(H,W,F,h,w,c1,c2,c3,c4,k1,k2,k3,k4)={\n\
    \    conv1 = convperf(H, W, 1,1,F/2,F/4,F/4,1,h,w,c1,k1)\n    conv2 = convperf(H,\
    \ W, 3,3,F/4,F/4,1,h,w,c2,k2)\n    conv3 = convperf(H/2,W/2,1,1,F/2,F,F,1,h,w,c3,k3)\n\
    \    conv4 = convperf(H, W, 1,1,F/2,F/4,F/4,1,h,w,c4,k4)\n    height = max(conv1.height,conv2.height,conv3.height,conv4.height)\n\
    \    width  = conv1.width+conv2.width+conv3.width+conv4.width\n    time   = max(conv1.time,conv2.time,conv3.time,conv4.time)\n\
    \    memory = max(conv1.memory,conv2.memory,conv3.memory,conv4.memory)\n}\n```\n\
    \n**Figure 3: Performance functions of two types of kernels, _dblock_ and _block_,\
    \ given by the kernel library.**\n\n$S$ represent the sizes of the receptive field;\
    \ $C$ and $K$ are the numbers of input and output features; $T$ represents the\
    \ step size of the operation. $h$, $w$, $c$, $k$ are the execution parameters\
    \ that determine the amount and arrangement of tiles in kernels and describe how\
    \ parallel operations can be performed on the tiles. They separate the various\
    \ dimensions of tensor operations, $H$, $W$, $C$, $K$. Unlike formal parameters,\
    \ they are allowed to be modified.\n\n# 2.3  Kernel Performance Functions\n\n\
    For each kernel, its size, compute time and memory are calculated by parameters.\
    \ These metrics represent the compute resources required to execute a kernel.\
    \ In the given kernel library, the performance functions of various types of kernels\
    \ are specified. Among them, the performance functions of a basic convolution\
    \ kernel, _conv_, are as follows.\n\n$$height = hw(c+1) \\tag{1a}$$\n$$width =\
    \ 3k \\tag{1b}$$\n$$time = \\lfloor H/h \\rfloor\\lfloor W/w \\rfloor\\lfloor\
    \ C/c \\rfloor\\lfloor K/k \\rfloor RS/T^2 \\tag{1c}$$\n$$memory = \\left\\lfloor\
    \ \\frac{CKRS}{ck} + \\frac{(W+S-1)(H+R-1)K}{whk} \\right\\rfloor \\tag{1d}$$\n\
    \nNote that the _memory_ refers to the memory required for each tile.\n\nIn addition\
    \ to _conv_ kernel, there are other types of kernels which contain multiple _conv_\
    \ kernels. The performance functions of two types of kernels, _dblock_ and _block_,\
    \ are shown in Figure 3. Take the _dblock_"
