    \ 东京，日本. ACM, New York, NY, USA, 6 pages. https://doi.org/10.1145/3394855.3431563\n\
    \n## 1 引言\n\n随着 2010 年代深度学习应用的蓬勃发展 [9]，加速神经网络（NNs）变得日益重要，以满足快速增长的计算需求。专用 ASIC\
    \ 加速器是解决此问题的有前景的技术。例如，名为 DianNao [3] 的加速器比 128 位 2GHz SIMD 处理器快 117.87 倍，总能耗降低了\
    \ 21.08×。Google 提出的张量处理单元（TPU）[6] 平均比其同期 CPU 或 GPU 快约 15–30×，TOPS/Watt 提高了约 30–80×。近期，Cerebras\
    \ 提出了晶圆级引擎（WSE）[1]。WSE 由 40 万个可编程核心和分布式片上内存组成，可以部分加速 NN 的多个层的计算。它还通过具有 2D 网格拓扑的局部连接为层间通信提供高带宽。然而，要充分利用其能力，需要对在\
    \ WSE 上实现的层的放置进行彻底优化。\n\n在 WSE 放置中，每个层被映射为一个矩形核心阵列，称为内核，如图 1 所示。放置对加速效率的影响包括核心分配、内核位置的安排以及连接的协议适配器成本。由于吞吐量最低的内核决定了整体性能，计算时间应在所有内核中保持一致。因此，分配给内核的核心数量需要与工作负载成比例。此外，核心通过片上网格网络传输数据。因此，内核内通信开销受分配给该内核的核心之间的距离影响，这可以表征为内核的形状。同样，内核间通信开销受不同内核中核心之间距离的影响。此外，与连接内核的参数相关的协议适配器成本也会影响内核间通信。\n\
    \nWSE 放置问题类似于传统的布局规划问题，即将一组块（模块或宏）放置到二维芯片区域。模拟退火（SA）是一种经典算法，用于搜索布局规划中块的良好拓扑结构。拓扑结构可以分为两类。切片结构是通过递归切片矩形区域生成的矩形剖分，而非切片结构允许矩形不规则堆叠。切片结构的表示形式称为归一化波兰表达式（nPe）[10]，为\
    \ SA 提供了扰动布局规划的操作。而 O-tree [4] 和 B*-tree [2] 等表示形式使得非切片布局规划的搜索成为可能。近期，提出了一种基于强化学习（RL）的方法\
    \ [7] 来逐个放置宏。在此 RL 放置问题中，状态是网络表的全部可能部分放置，而宏的可用操作是可行位置。操作由训练有素的策略网络执行，以推广到未见过的块。\n\
    \n然而，WSE 放置与布局规划问题从根本上不同。在 WSE 放置问题中，内核的面积和形状仍需确定。相反，布局规划问题中的块都具有固定面积，且大多具有固定形状。此外，WSE\
    \ 放置问题中可调参数的数量要大得多，这显著扩大了解决方案空间。因此，基于 SA 和基于学习的方法很难为 WSE 生成近乎最优的放置。另一方面，NN 的连接性比布局规划网络表简单得多。在基于\
    \ SA 和基于学习的方法中，投入了很大精力来处理块的复杂连接。因此，按 NN 的拓扑顺序放置层可以在几乎不牺牲质量的情况下大幅减少运行时间。在我们早期的探索中，我们尝试实现基于\
    \ nPe 的 SA 算法，发现其性能较差。即使在 SA 算法的最佳情况下，其得分仍比 GigaPlacer 差 13%，但运行时间长了 2.6 倍。\n\n\
    为了优化 NN 加速的计算时间，我们提出了一种有效且高效的放置器，称为 GigaPlacer，以处理 WSE 放置问题。我们的贡献总结如下：\n\n- 我们提出了两种基于动态规划（DP-based）的算法来放置层。采用基于二分搜索的框架来保证所有内核计算时间的一致性。\n\
    - 我们提出了一种行高最小化算法来确定每个内核的最佳执行参数。我们利用一种有效的枚举技术并进行剪枝，由二分搜索指导。这样，晶圆面积将被充分利用。\n- 我们提出了两种进一步细化结果的技术。通过交换一些内核来减少内核间距离，并通过略微调整连接内核的参数来最小化协议适配器成本。\n\
    - 与 ISPD2020 竞赛的第一名相比，我们在竞赛指标上实现了最高 6.89% 的降低，平均降低 2.09%，运行速度提升了 7.23 倍。\n\n##\
    \ 2 预备知识\n\n本节首先介绍 WSE 的基本结构。随后介绍内核的参数和性能函数，最后介绍问题表述。\n\n### 2.1 晶圆级引擎\n\n在 WSE\
    \ 中，约有 40 万个 tile 排列在 633×633 网格中。每个 tile 具有一个可编程执行核心、48KB SRAM 以及用于与其他 tile 互连的路由器。\n\
    \n在 WSE 放置问题中，NN 中的层被映射为一组矩形内核，其中每个内核占用多个 tile，并通过并行运行 tile 的执行核心来执行单个 NN 计算任务\
    \ [5]。\n\n### 2.2 内核参数\n\n内核的性能由包括形式参数和执行参数在内的各种参数决定。\n\nH、W、R、S、C、K、T 是由 NN 规范定义的形式参数，不能通过编译过程修改。如图\
    \ 2 所示，H 和 W 表示输入图像的大小；R 和 S 表示感受野的大小；C 和 K 是输入和输出特征的数量；T 表示操作的步长。h、w、c、k 是执行参数，决定内核中\
    \ tile 的数量和排列，并描述如何在 tile 上执行并行操作。它们将张量操作的各个维度 H、W、C、K 分开。与形式参数不同，它们允许被修改。\n\n\
    ![](img/9193339587477a25149234f19dc04369_1_0.png)\n\n### 2.3 内核性能函数\n\n对于每个内核，其大小、计算时间和内存由参数计算得出。这些指标代表执行内核所需的计算资源。在给定的内核库中，各种类型内核的性能函数被指定。其中，基本卷积内核\
    \ _conv_ 的性能函数如下。\n\n$$height = hw(c+1) \\tag{1a}$$\n$$width = 3k \\tag{1b}$$\n\
    $$time = \\lfloor H/h \\rfloor\\lfloor W/w \\rfloor\\lfloor C/c \\rfloor\\lfloor\
    \ K/k \\rfloor RS/T^2 \\tag{1c}$$\n$$memory = \\left\\lfloor \\frac{CKRS}{ck}\
    \ + \\frac{(W+S-1)(H+R-1)K}{whk} \\right\\rfloor \\tag{1d}$$\n\n请注意，_memory_ 指的是每个\
    \ tile 所需的内存。\n\n除 _conv_ 内核外，还有其他包含多个 _conv_ 内核的类型内核。两种类型内核 _dblock_ 和 _block_\
    \ 的性能函数如图 3 所示。取 _dblock_\n"
