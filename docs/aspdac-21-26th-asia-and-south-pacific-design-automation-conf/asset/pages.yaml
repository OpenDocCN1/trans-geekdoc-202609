  md: "proposed [7] to place the macros one at a time. States in this RL placement\
    \ problem are all the possible partial placement of a netlist, and the available\
    \ actions of a macro are the feasible locations. Actions are taken by a policy\
    \ network trained to generalize to unseen blocks.\n\nHowever, WSE placement is\
    \ fundamentally different from the floorplan problem. Both the areas and the shapes\
    \ of kernels remain to be determined in the WSE placement problem. Instead, blocks\
    \ in the floorplan problem are all with fixed area, and mostly with fixed shapes.\
    \ Besides, the number of adjustable parameters in WSE placement problem is much\
    \ greater, which significantly enlarges the solution space. As a result, it’s\
    \ difficult for SA-based and learning-based methods to generate nearly optimal\
    \ placements for WSE. On the other hand, the connectivity of a NN is dramatically\
    \ simpler than that of a floorplan netlist. In SA-based and learning-based methods,\
    \ great efforts are put into handling the complex connectivity of the blocks.\
    \ Therefore, placing layers in topological orders of the NN can substantially\
    \ reduce runtime with little sacrifice of quality. In our early exploration, we\
    \ tried implementing a SA algorithm based on nPe, and found its performance poor.\
    \ Even in the SA algorithm’s best case, its score was still 13% worse than GigaPlacer,\
    \ but took a 2.6 times longer runtime.\n\nTo optimize the compute time of NNs’\
    \ acceleration, we proposed an effective and efficient placer, called GigaPlacer,\
    \ to handle the WSE placement problem. Our contribution is summarized as follows:\n\
    \n+   - We proposed two dynamic-programming-based (DP-based) algorithms to place\
    \ the layers. A binary-search-based framework is adopted to guarantee the uniformity\
    \ of compute time of all kernels.\n+   - We proposed a row height minimization\
    \ algorithm to determine the optimal execution parameters for each kernel. We\
    \ exploit an effective enumeration technique with pruning, guided by binary search.\
    \ In this way, the wafer area will be fully utilized.\n+   - We proposed two techniques\
    \ to further refine the results. Inter-kernel distance is reduced by swapping\
    \ some kernels, and the protocol adapter cost is minimized by slightly adjusting\
    \ parameters of connected kernels.\n+   - In comparison with the first place of\
    \ the ISPD2020 Contest, we achieved a reduction on the contest metric by up to\
    \ 6.89% and on average 2.09%, with 7.23× runtime speed up.\n\n# 2  PRELIMINARIES\n\
    \nThis section introduces the basic structure of WSE at first. The parameters\
