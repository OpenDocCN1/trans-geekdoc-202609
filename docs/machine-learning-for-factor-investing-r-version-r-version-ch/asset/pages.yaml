- pgno: 159
  md: 'It remains to formulate the assumptions for each of the three parts.


    We start with the trees’ structures, $q_m$. Trees are defined by their splits
    (at nodes) and these splits are characterized by the splitting variable and the
    splitting level. First, the size of trees is parametrized such that a node at
    depth $d$ is nonterminal with probability given by


    ```

    \alpha(1 + d)^{-\beta}, \quad \alpha \in (0, 1), \quad \beta > 0. \quad (9.17)

    ```


    The authors recommend to set $\alpha = 0.95$ and $\beta = 2$. This gives a probability
    of 5% to have 1 node, 55% to have 2 nodes, 28% to have 3 nodes, 9% to have 4 nodes
    and 3% to have 5 nodes. Thus, the aim is to force relatively shallow structures.


    Second, the choice of splitting variables is driven by a generalized Bernoulli
    (categorical) distribution which defines the odds of picking one particular feature.
    In the original paper by Chipman et al. (2010), the vector of probabilities was
    uniform (each predictor has the same odds of being chosen for the split). This
    vector can also be random and sampled from a more flexible Dirichlet distribution.
    The level of the split is drawn uniformly on the set of possible values for the
    chosen predictor.


    Having determined the prior of structure of the tree $q_m$, it remains to fix
    the terminal values at the leaves $(\mathbf{w}_m|q_m)$. The weights at all leaves
    are assumed to follow a Gaussian distribution $\mathcal{N}(\mu_\mu, \sigma_\mu^2)$,
    where $\mu_\mu = (y_{\min} + y_{\max})/2$ is the center of the range of the label
    values. The variance $\sigma_\mu^2$ is chosen such that $\mu_\mu$ plus or minus
    two times $\sigma_\mu^2$ covers 95% of the range observed in the training dataset.
    Those are default values and can be altered by the user.


    Lastly, for computational purposes similar to those of linear regressions, the
    parameter $\sigma^2$ (the variance of $\epsilon$ in (9.14)) is assumed to follow
    an inverse Gamma law IG($\nu/2, \lambda\nu/2$) akin to that used in Bayesian regressions.
    The parameters are by default computed from the data so that the distribution
    of $\sigma^2$ is realistic and prevents overfitting. We refer to the original
    article, section 2.2.4, for more details on this topic.


    In sum, in addition to $M$ (number of trees), the prior depends on a small number
    of parameters: $\alpha$ and $\beta$ (for the tree structure), $\mu_\mu$ and $\sigma_\mu^2$
    (for the tree weights) and $\nu$ and $\lambda$ (for the noise term).


    # 9.5.3 Sampling and predictions


    The posterior distribution in (9.15) cannot be obtained analytically but simulations
    are an efficient shortcut to the model (9.14). Just as in Gibbs and Metropolis-Hastings
    sampling, the distribution of simulations is expected to converge to the sought
    posterior. After some burn-in sample, a prediction for a newly observed set $\mathbf{x}_*$
    will simply be the average (or median) of the predictions from the simulations.
    If we assume $S$ simulations after burn-in, then the average is equal to


    ```

    \tilde{y}(\mathbf{x}_*) := \frac{1}{S} \sum_{s=1}^S \sum_{m=1}^M \mathcal{T}_m
    \quad q_m^{(s)}, \mathbf{w}_m^{(s)}, \mathbf{x}_* \ .

    ```


    The complex part is naturally to generate the simulations. Each tree is sampled
    using the Metropolis-Hastings method: a tree is proposed, but it replaces the
    existing one only under some (possibly random) criterion. This procedure is then
    repeated in a Gibbs-like fashion.


    Let us start with the MH building block. We seek to simulate the conditional distribution'
  merge: -1
  img_proc: true
- pgno: 160
  md: '$(q_m, \mathbf{w}_m) \mid (q_{-m}, \mathbf{w}_{-m}, \sigma^2, \mathbf{y}, \mathbf{x}),$


    where \(q_{-m}\) and \(\mathbf{w}_{-m}\) collect the structures and weights of
    all trees except for tree number \(m\). One tour de force in BART is to simplify
    the above Gibbs draws to


    $(q_m, \mathbf{w}_m) \mid (\mathbf{R}_m, \sigma^2),$


    where \(\mathbf{R}_m = \mathbf{y} - \sum_{l \neq m} \mathcal{T}_l(q_l, \mathbf{w}_l,
    \mathbf{x})\) is the partial residual on a prediction that excludes the \(m^{th}\)
    tree.


    The new MH proposition for \(q_m\) is based on the previous tree and there are
    three possible (and random) alterations to the tree:


    +   - growing a terminal node (increase the complexity of the tree by adding a
    supplementary leaf);

    +   - pruning a pair of terminal nodes (the opposite operation: reducing complexity);

    +   - changing splitting rules.


    For simplicity, the third option is often excluded. Once the tree structure is
    defined (i.e., sampled), the terminal weights are independently drawn according
    to a Gaussian distribution \(\mathcal{N}(\mu_\mu, \sigma_\mu^2)\).


    After the tree is sampled, the MH principle requires that it be accepted or rejected
    based on some probability. This probability increases with the odds that the new
    tree increases the likelihood of the model. Its detailed computation is cumbersome
    and we refer to section 2.2 in Sparapani et al. (2019) for details on the matter.


    Now, we must outline the overarching Gibbs procedure. First, the algorithm starts
    with trees that are simple nodes. Then, a specified number of loops include the
    following *sequential steps*:


    | Step | Task |

    | :--- | :--- |

    | 1 | sample \((q_1, \mathbf{w}_1) \mid (\mathbf{R}_1, \sigma^2);\) |

    | 2 | sample \((q_2, \mathbf{w}_2) \mid (\mathbf{R}_2, \sigma^2);\) |

    | ... | ...; |

    | m | sample \((q_m, \mathbf{w}_m) \mid (\mathbf{R}_m, \sigma^2);\) |

    | ... | ...; |

    | M | sample \((q_M, \mathbf{w}_M) \mid (\mathbf{R}_M, \sigma^2); (last tree )\)
    |

    | M+1 | sample \(\sigma^2\) given the full residual \(\mathbf{R} = \mathbf{y}
    - \sum_{l=1}^M \mathcal{T}_l(q_l, \mathbf{w}_l, \mathbf{x})\) |


    At each step \(m\), the residual \(\mathbf{R}_m\) is updated with the values from
    step \(m-1\). We illustrate this process in Figure 9.3 in which \(M=3\). At step
    1, a partition is proposed for the first tree, which is a simple node. In this
    particular case, the tree is accepted. In this scheme, the terminal weights are
    omitted for simplicity. At step 2, another partition is proposed for the tree,
    but it is rejected. In the third step, the proposition for the third is accepted.
    After the third step, a new value for \(\sigma^2\) is drawn and a new round of
    Gibbs sampling can commence.'
