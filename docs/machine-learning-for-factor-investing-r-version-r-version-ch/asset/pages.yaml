- pgno: 253
  md: "# # Unsupervised learning\n\nAll algorithms presented in Chapters 5 to 9 belong\
    \ to the larger class of supervised learning tools. Such tools seek to unveil\
    \ a mapping between predictors **X** and a label **Z**. The supervision comes\
    \ from the fact that it is asked that the data tries to explain this particular\
    \ variable **Z**. Another important part of machine learning consists of unsupervised\
    \ tasks, that is, when **Z** is not specified and the algorithm tries to make\
    \ sense of **X** on its own. Often, relationships between the components of **X**\
    \ are identified. This field is much too vast to be summarized in one book, let\
    \ alone one chapter. The purpose here is to briefly explain in what ways unsupervised\
    \ learning can be used, especially in the data pre-processing phase.\n\n# ## 15.1\
    \ The problem with correlated predictors\n\nOften, it is tempting to supply all\
    \ predictors to a ML-fueled predictive engine. That may not be a good idea when\
    \ some predictors are highly correlated. To illustrate this, the simplest example\
    \ is a regression on two variables with zero mean and covariance and precisions\
    \ matrices:\n\n\\(\\Sigma = \\mathbf{X}'\\mathbf{X} = \\begin{pmatrix} 1 & \\\
    rho \\\\ \\rho & 1 \\end{pmatrix}, \\quad \\Sigma^{-1} = \\frac{1}{1-\\rho^2}\
    \ \\begin{pmatrix} 1 & -\\rho \\\\ -\\rho & 1 \\end{pmatrix}.\\)\n\nWhen the covariance/correlation\
    \ \\(\\rho\\) increase towards 1 (the two variables are co-linear), the scaling\
    \ denominator in \\(\\Sigma^{-1}\\) goes to zero and the formula \\(\\hat{\\boldsymbol{\\\
    beta}} = \\Sigma^{-1}\\mathbf{X}'\\mathbf{Z}\\) implies that one coefficient will\
    \ be highly positive and one highly negative. The regression creates a spurious\
    \ arbitrage between the two variables. Of course, this is very inefficient and\
    \ yields disastrous results out-of-sample.\n\nWe illustrate what happens when\
    \ many variables are used in the regression below (Table 15.1). One elucidation\
    \ of the aforementioned phenomenon comes from the variables Mkt_Cap_12M_Usd and\
    \ Mkt_Cap_6M_Usd, which have a correlation of 99.6% in the training sample. Both\
    \ are singled out as highly significant but their signs are contradictory. Moreover,\
    \ the magnitude of their coefficients are very close (0.21 versus 0.18) so that\
    \ their net effect cancels out. Naturally, providing the regression with only\
    \ one of these two inputs would have been wiser.\n\n```\nlibrary(broom)\ntraining_sample\
    \ %>%\n  dplyr::select(c(features, \"R1M_Usd\")) %>%\n  lm(R1M_Usd ~ . , data\
    \ = .) %>%\n  tidy() %>%\n  filter(abs(statistic) > 3) %>%\n  knitr::kable(booktabs\
    \ = TRUE,\n  caption = \"Significant predictors in the training sample.\")\n```"
