- pgno: 186
  md: '# 11.1 Linear ensembles


    # 11.1.1 Principles


    In this chapter we adopt the following notations. We work with $M$ models where
    $\tilde{y}_{i,m}$ is the prediction of model $m$ for instance $i$ and errors $\epsilon_{i,m}
    = y_i - \tilde{y}_{i,m}$ are stacked into a $(I \times M)$ matrix $\mathbf{E}$.
    A linear combination of models has sample errors equal to $\mathbf{Ew}$, where
    $\mathbf{w} = w_m$ are the weights assigned to each model and we assume $\mathbf{w}''\mathbf{1}_M
    = 1$. Minimizing the total (squared) error is thus a simple quadratic program
    with unique constraint. The Lagrange function is $L(\mathbf{w}) = \mathbf{w}''\mathbf{E}''\mathbf{Ew}
    - \lambda(\mathbf{w}''\mathbf{1}_M - 1)$ and hence


    ```

    \frac{\partial}{\partial \mathbf{w}} L(\mathbf{w}) = \mathbf{E}''\mathbf{Ew} -
    \lambda \mathbf{1}_M = 0 \Leftrightarrow \mathbf{w} = \lambda(\mathbf{E}''\mathbf{E})^{-1}\mathbf{1}_M
    ,

    ```


    and the constraint imposes $\mathbf{w}^* = \frac{(\mathbf{E} \mathbf{E}'')^{-1}
    \mathbf{1}_M}{(\mathbf{1}_M \mathbf{E} \mathbf{E}'')^{-1} \mathbf{1}_M}$. This
    form is similar to that of minimum variance portfolios. If errors are unbiased
    ($\mathbf{1}''_I \mathbf{E} = \mathbf{0}''_M$), then $\mathbf{E}''\mathbf{E}$
    is the covariance matrix of errors.


    This expression shows an important feature of optimized linear ensembles: they
    can only add value if the models tell different stories. If two models are redundant,
    $\mathbf{E}''\mathbf{E}$ will be close to singular and $\mathbf{w}^*$ will arbitrage
    one against the other in a spurious fashion. This is the exact same problem as
    when mean-variance portfolios are constituted with highly correlated assets: in
    this case, diversification fails because when things go wrong, all assets go down.
    Another problem arises when the number of observations is too small compared to
    the number of assets so that the covariance matrix of returns is singular. This
    is not an issue for ensembles because the number of observations will usually
    be much larger than the number of models $(I >> M)$.


    In the limit when correlations increase to one, the above formulation becomes
    highly unstable and ensembles cannot be trusted. One heuristic way to see this
    is when $M = 2$ and


    ```

    \mathbf{E}'' \mathbf{E} = \begin{pmatrix} \sigma_1^2 & \rho \sigma_1 \sigma_2
    \\ \rho \sigma_1 \sigma_2 & \sigma_2^2 \end{pmatrix} \Leftrightarrow (\mathbf{E}''
    \mathbf{E})^{-1} = \frac{1}{1 - \rho^2} \begin{pmatrix} \sigma_1^{-2} & -\rho(\sigma_1
    \sigma_2)^{-1} \\ -\rho(\sigma_1 \sigma_2)^{-1} & \sigma_2^{-2} \end{pmatrix}

    ```


    so that when $\rho \to 1$, the model with the smallest errors (minimum $\sigma_i^2$)
    will see its weight increasing towards infinity while the other model will have
    a similarly **negative weight**: the model arbitrages between two highly correlated
    variables. This seems like a very bad idea.


    There is another illustration of the issues caused by correlations. Let’s assume
    we face $M$ correlated errors $\epsilon_m$ with pairwise correlation $\rho$, zero
    mean and variance $\sigma^2$. The variance of errors is


    ```

    \mathbb{E} \frac{1}{M} \sum_{m=1}^M \epsilon_m^2 = \frac{1}{M^2} \left[ \sum_{m=1}^M
    \epsilon_m^2 + \sum_{m \neq n} \epsilon_n \epsilon_m \right]

    = \frac{\sigma^2}{M} + \frac{1}{M^2} \sum_{n \neq m} \rho \sigma^2

    = \rho \sigma^2 + \frac{\sigma^2(1 - \rho)}{M}

    ```'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'where while the second term converges to zero as $M$ increases, the second
    term remains and is **linearly increasing** with $\rho$. In passing, because variances
    are always positive, this result implies that the common pairwise correlation
    between $M$ variables is bounded below by $-(M-1)^{-1}$. This result is interesting
    but rarely found in textbooks.


    One improvement proposed to circumvent the trouble caused by correlations, advocated
    in a seminal publication (Breiman (1996)), is to enforce positivity constraints
    on the weights and solve


    \(\text{argmin}_w \, w'' E'' E w, \quad \text{s.t.} \quad w'' \mathbf{1}_M = 1
    \quad w_m \geq 0 \quad \forall m\)


    Mechanically, if several models are highly correlated, the constraint will impose
    that only one of them will have a nonzero weight. If there are many models, then
    just a few of them will be selected by the minimization program. In the context
    of portfolio optimization, Jagannathan and Ma (2003) have shown the benefits of
    constraint in the construction mean-variance allocations. In our setting, the
    constraint will similarly help discriminate wisely among the ''best'' models.


    In the literature, forecast combination and model averaging (which are synonyms
    of ensembles) have been tested on stock markets as early as in Von Holstein (1972).
    Surprisingly, the articles were not published in Finance journals but rather in
    fields such as Management (Virtanen and Yli-Olli (1987), Wang et al. (2012)),
    Economics and Econometrics (Donaldson and Kamstra (1996), Clark and McCracken
    (2009), Mascio et al. (2020)), Operations Reasearch (Huang et al. (2005), Leung
    et al. (2001), and Bonaccolto and Patterlini (2019)), and Computer Science (Harrald
    and Kamstra (1997), Hassan et al. (2007)).


    In the general forecasting literature, many alternative (refined) methods for
    combining forecasts have been studied. Trimmed opinion pools (Grushka-Cockayne
    et al. (2016)) compute averages over the predictions that are not too extreme.
    We refer to Gaba et al. (2017) for a more exhaustive list of combinations as well
    as for an empirical study of their respective efficiency. Overall, findings are
    mixed and the heuristic simple average is, as usual, hard to beat (see, e.g.,
    Genre et al. (2013)).


    # 11.1.2 Example


    In order to build an ensemble, we must gather the predictions and the corresponding
    errors into the E matrix. We will work with 5 models that were trained in the
    previous chapters: penalized regression, simple tree, random forest, xgboost and
    feed-forward neural network. The training errors have zero means, hence E''E is
    the covariance matrix of errors between models.


    ```

    err_pen_train <- predict(fit_pen_pred, x_penalized_train) - training_sample$R1M_Usd
    # Reg.

    err_tree_train <- predict(fit_tree, training_sample) - training_sample$R1M_Usd
    # Tree

    err_RF_train <- predict(fit_RF, training_sample) - training_sample$R1M_Usd # RF

    err_XGB_train <- predict(fit_xgb, train_matrix_xgb) - training_sample$R1M_Usd
    # XGBoost

    err_NN_train <- predict(model, NN_train_features) - training_sample$R1M_Usd #
    NN

    E <- cbind(err_pen_train, err_tree_train, err_RF_train, err_XGB_train, err_NN_train)
    # E matrix

    colnames(E) <- c("Pen_reg", "Tree", "RF", "XGB", "NN") # Names

    cor(E) # Cor. mat.

    ```


    ```

    ##          Pen_reg      Tree       RF       XGB      NN

    ## Pen_reg 1.0000000 0.9984394 0.9968224 0.9310186 0.9972770

    ```'
