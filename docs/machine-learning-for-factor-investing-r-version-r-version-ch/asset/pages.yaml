    # ## 10.2 Validation


    Validation is the stage at which a model is tested and tuned before it starts
    to be deployed on real or live data (e.g., for trading purposes). Needless to
    say, it is critical.


    # ### 10.2.1 The variance-bias tradeoff: theory


    The **variance-bias tradeoff** is one of the core concepts in supervised learning.
    To explain it, let us assume that the data is generated by the simple model


    \[ y_i = f(\mathbf{x}_i) + \epsilon_i, \quad \mathbb{E}[\epsilon] = 0, \quad \mathbb{V}[\epsilon]
    = \sigma^2, \]


    but the model that is estimated yields


    \[ y_i = \hat{f}(\mathbf{x}_i) + \hat{\epsilon}_i. \]


    Given an unknown sample x, the decomposition of the average squared error is


    \begin{align*}

    \mathbb{E}[\hat{\epsilon}^2] &= \mathbb{E}[(y - \hat{f}(\mathbf{x}))^2] = \mathbb{E}[(f(\mathbf{x})
    + \epsilon - \hat{f}(\mathbf{x}))^2] \\

    &= \underbrace{\mathbb{E}[(f(\mathbf{x}) - \hat{f}(\mathbf{x}))^2]}_{\text{total
    quadratic error}} + \underbrace{\mathbb{E}[\epsilon^2]}_{\text{irreducible error}}
    \\

    &= \mathbb{E}[\hat{f}(\mathbf{x})^2] + \mathbb{E}[f(\mathbf{x})^2] - 2\mathbb{E}[f(\mathbf{x})\hat{f}(\mathbf{x})]
    + \sigma^2 \\

    &= \mathbb{E}[\hat{f}(\mathbf{x})^2] + f(\mathbf{x})^2 - 2f(\mathbf{x})\mathbb{E}[\hat{f}(\mathbf{x})]
    + \sigma^2 \\

    &= \mathbb{E}[\hat{f}(\mathbf{x})^2] - \mathbb{E}[\hat{f}(\mathbf{x})]^2 + \mathbb{E}[\hat{f}(\mathbf{x})]^2
    + f(\mathbf{x})^2 - 2f(\mathbf{x})\mathbb{E}[\hat{f}(\mathbf{x})] + \sigma^2 \\

    &= \underbrace{\mathbb{V}[\hat{f}(\mathbf{x})]}_{\text{variance of model}} + \underbrace{\mathbb{E}[(f(\mathbf{x})
    - \hat{f}(\mathbf{x}))]^2}_{\text{squared bias}} + \sigma^2

    \end{align*}


    In the above derivation, \(f(x)\) is not random, but \(\hat{f}(x)\) is. Also,
    in the second line, we assumed \(\mathbb{E}[\epsilon(f(x) - \hat{f}(x))] = 0\),
    which may not always hold (though it is a very common assumption). The average
    squared error thus has three components:'
  merge: -1
  img_proc: true
- pgno: 172
  md: '+   - the variance of the model (over its predictions);

    +   - the squared bias of the model;

    +   - and one irreducible error (independent from the choice of a particular model).


    The last one is immune to changes in models, so the challenge is to minimize the
    sum of the first two. This is known as the variance-bias tradeoff because reducing
    one often leads to increasing the other. The goal is thus to assess when a small
    increase in either one can lead to a larger decrease in the other.


    There are several ways to represent this tradeoff and we display two of them.
    The first one relates to archery (see Figure 10.4) below. The best case (top left)
    is when all shots are concentrated in the middle: on average, the archer aims
    correctly and all the arrows are very close to one another. The worst case (bottom
    right) is the exact opposite: the average arrow is above the center of the target
    (the bias is nonzero) and the dispersion of arrows is large.


    ![](img/8861a37f775d09b4ba7a5151f604d9f5_172_0.png)


    # FIGURE 10.4: First representation of the variance-bias tradeoff.


    The most often encountered cases in ML are the other two configurations: either
    the arrows (predictions) are concentrated in a small perimeter, but the perimeter
    is not the center of the target; or the arrows are on average well distributed
    around the center, but they are, on average, far from it.


    The second way the variance bias tradeoff is often depicted is via the notion
    of model complexity. The most simple model of all is a constant one: the prediction
    is always the same, for instance equal to the average value of the label in the
    training set. Of course, this prediction will often be far from the realized values
    of the testing set (its bias will be large), but at least its variance is zero.
    On the other side of the spectrum, a decision tree with as many leaves as there
    are instances has a very complex structure. It will probably have a smaller bias,
    but undoubtedly it is not obvious that this will compensate the increase in variance
    incurred by the intricacy of the model.


    This facet of the tradeoff is depicted in Figure 10.5 below. To the left of the
    graph, a simple model has a small variance but a large bias, while to the right
    it is the opposite for a complex model. Good models often lie somewhere in the
    middle, but the best mix is hard to find.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '![](img/8861a37f775d09b4ba7a5151f604d9f5_173_0.png)


    FIGURE 10.5: Second representation of the variance-bias tradeoff.


    The most tractable theoretical form of the variance-bias tradeoff is the ridge
    regression.² The coefficient estimates in this type of regression are given by
    $\hat{\mathbf{b}}_\lambda = (\mathbf{X}''\mathbf{X} + \lambda \mathbf{I}_N)^{-1}\mathbf{X}''\mathbf{Y}$
    (see Section 5.1.1), where $\lambda$ is the penalization intensity. Assuming a
    *true* linear form for the data generating process ($\mathbf{y} = \mathbf{Xb}
    + \boldsymbol{\epsilon}$ where $\mathbf{b}$ is unknown and $\sigma^2$ is the variance
    of errors - which have identity correlation matrix), this yields


    ```

    $\mathbb{E}[\hat{\mathbf{b}}_\lambda] = \mathbf{b} - \lambda(\mathbf{X}''\mathbf{X}
    + \lambda \mathbf{I}_N)^{-1}\mathbf{b}, \quad (10.8)$

    $\mathbb{V}[\hat{\mathbf{b}}_\lambda] = \sigma^2(\mathbf{X}''\mathbf{X} + \lambda
    \mathbf{I}_N)^{-1}\mathbf{X}''\mathbf{X}(\mathbf{X}''\mathbf{X} + \lambda \mathbf{I}_N)^{-1}.
    \quad (10.9)$

    ```


    Basically, this means that the bias of the estimator is equal to $-\lambda(\mathbf{X}''\mathbf{X}
    + \lambda \mathbf{I}_N)^{-1}\mathbf{b}$, which is zero in the absence of penalization
    (classical regression) and converges to some finite number when $\lambda \to \infty$,
    i.e., when the model becomes constant. Note that if the estimator has a zero bias,
    then predictions will too: $\mathbb{E}[\mathbf{X}(\mathbf{b} - \hat{\mathbf{b}})]
    = \mathbf{0}$.


    The variance (of estimates) in the case of an unconstrained regression is equal
    to $\mathbb{V}[\hat{\mathbf{b}}] = \sigma(\mathbf{X}''\mathbf{X})^{-1}$. In Equation
    (10.9), the $\lambda$ reduces the magnitude of figures in the inverse matrix.
    The overall effect is that as $\lambda$ increases, the variance decreases and
    in the limit $\lambda \to \infty$, the variance is zero when the model is constant.
    The variance of predictions is


    ```

    $\mathbb{V}[\mathbf{X}\hat{\mathbf{b}}] = \mathbb{E}[(\mathbf{X}\hat{\mathbf{b}}
    - \mathbb{E}[\mathbf{X}\hat{\mathbf{b}}])(\mathbf{X}\hat{\mathbf{b}} - \mathbb{E}[\mathbf{X}\hat{\mathbf{b}}])'']$

    $= \mathbf{X}\mathbb{E}[(\hat{\mathbf{b}} - \mathbb{E}[\hat{\mathbf{b}}])(\hat{\mathbf{b}}
    - \mathbb{E}[\hat{\mathbf{b}}])'']\mathbf{X}''$

    $= \mathbf{X}\mathbb{V}[\hat{\mathbf{b}}]\mathbf{X}$

    ```


    All in all, ridge regressions are very handy because with a single parameter,
    they are able to provide a cursor that directly tunes the variance-bias tradeoff.


    It''s easy to illustrate how simple it is to display the tradeoff with the ridge
    regression. In the example below, we recycle the ridge model trained in Chapter
    5.


    ²Another angle, critical of neural networks is provided in Geman et al. (1992).'
  merge: -1
