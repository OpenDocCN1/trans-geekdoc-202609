    \              gamma = 0.1,\n              nrounds = round(nrounds),\n       \
    \       verbose = 0)\n\n  pred <- predict(fit, test_features)\n  list(Score =\
    \ -mean((pred-test_label)^2),\n       Pred = pred)\n}\n```\n\nOnce the objective\
    \ function is defined, it can be plugged into the Bayesian optimizer.\n\n```\n\
    library(rBayesianOptimization)\nbayes_opt <- BayesianOptimization(bayes_par_opt,\n\
