- pgno: 197
  md: '# Portfolio backtesting


    In this section, we introduce the notations and framework that will be used when
    analyzing and comparing investment strategies. Portfolio backtesting is often
    conceived and perceived as a quest to find the best strategy - or at least a solidly
    profitable one. When carried out thoroughly, this possibly long endeavor may entice
    the layman to confuse a fluke for a robust policy. Two papers published back-to-back
    warn against the **perils of data snooping**, which is related to _p_-hacking.
    In both cases, the researcher will torture the data until the sought result is
    found.


    Fabozzi and de Prado (2018) acknowledge that only strategies that work make it
    to the public, while thousands (at least) have been tested. Picking the pleasing
    outlier (the only strategy that seemed to work) is likely to generate disappointment
    when switching to real trading. In a similar vein, Arnott et al. (2019b) provide
    a list of principles and safeguards that any analyst should follow to avoid any
    type of error when backtesting strategies. The worst type is arguably **false
    positives** whereby strategies are found (often by cherrypicking) to outperform
    in one very particular setting, but will likely fail in live implementation.


    In addition to these recommendations on portfolio constructions, Arnott et al.
    (2019a) also warn against the hazards of blindly investing in smart beta products
    related to academic factors. Plainly, expectations should not be set too high
    or face the risk of being disappointed. Another takeaway from their article is
    that **economic cycles** have a strong impact on factor returns: correlations
    change quickly and drawdowns can be magnified in times of major downturns.


    Backtesting is more complicated than it seems and it is easy to make small mistakes
    that lead to _apparently_ good portfolio policies. This chapter lays out a rigorous
    approach to this exercise, discusses a few caveats, and proposes a lengthy example.


    # 12.1 Setting the protocol


    We consider a dataset with three dimensions: time \(t = 1, ..., T\), assets \(n
    = 1, ..., N\) and characteristics \(k = 1, ..., K\). One of these attributes must
    be the price of asset \(n\) at time \(t\), which we will denote \(p_{t,n}\). From
    that, the computation of the arithmetic return is straightforward (\(r_{t,n} =
    p_{t,n}/p_{t-1,n} - 1\)) and so is any heuristic measure of profitability. For
    simplicity, we assume that time points are equidistant or uniform, i.e., that
    \(t\) is the index of a trading day or of a month for example. If each point in
    time \(t\) has data available for all assets, then this makes a dataset with \(I
    = T \times N\) rows.


    The dataset is first split in two: the out-of-sample period and the **initial
    buffer** period. The buffer period is required to train the models for the first
    portfolio composition. This period'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'is determined by the size of the training sample. There are two options for
    this size: fixed (usually equal to 2 to 10 years) and expanding. In the first
    case, the training sample will roll over time, taking into account only the most
    recent data. In the second case, models are built on all of the available data,
    the size of which increases with time. This last option can create problems because
    the first dates of the backtest are based on much smaller amounts of information
    compared to the last dates. Moreover, there is an ongoing debate on whether including
    the full history of returns and characteristics is advantageous or not. Proponents
    argue that this allows models to see many different **market conditions**. Opponents
    make the case that old data is by definition outdated and thus useless and possibly
    misleading because it won''t reflect current or future short-term fluctuations.


    Henceforth, we choose the rolling period option for the training sample, as depicted
    in Figure 12.1.


    ![](img/8861a37f775d09b4ba7a5151f604d9f5_198_0.png)


    **FIGURE 12.1:** Backtesting with rolling windows. The training set of the first
    period is simply the buffer period.


    Two crucial design choices are the **rebalancing frequency** and the **horizon**
    at which the label is computed. It is not obvious that they should be equal but
    their choice should make sense. It can seem right to train on a 12-month forward
    label (which captures longer trends) and invest monthly or quarterly. However,
    it seems odd to do the opposite and train on short-term movements (monthly) and
    invest at a long horizon.


    These choices have a direct impact on how the backtest is carried out. If we note:


    +   • \(\Delta_h\) for the holding period between 2 rebalancing dates (in days
    or months);

    +   • \(\Delta_s\) for the size of the desired training sample (in days or months
    - not taking the number of assets into consideration);

    +   • \(\Delta_l\) for the horizon at which the label is computed (in days or
    months),


    then the total length of the training sample be \(\Delta_s + \Delta_l\). Indeed,
    at any moment \(t\), the training sample should stop at \(t - \Delta_l\) so that
    the last point corresponds to a label that is calculated until time \(t\). This
    is highlighted in Figure 12.2 in the form of the red danger zone. We call it the
    red zone because any observation which has a time index \(s\) inside the interval
    \((t - \Delta_l, t]\) will engender a forward looking bias. Indeed if a feature
    is indexed by \(s \in (t - \Delta_l, t]\), then by definition, the label covers
    the period \([s, s + \Delta_l]\) with \(s + \Delta_l > t\). At time \(t\), this
    requires knowledge of the future and is naturally not realistic.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '![](img/8861a37f775d09b4ba7a5151f604d9f5_199_0.png)


    FIGURE 12.2: The subtleties in rolling training samples.


    # 12.2 Turning signals into portfolio weights


    The predictive tools outlined in Chapters 5 to 11 are only meant to provide a
    signal that is expected to give some information on the future profitability of
    assets. There are many ways that this signal can be integrated in an investment
    decision (see Snow (2020) for ways to integrate ML tools into this task).


    First and foremost, there are at least two steps in the portfolio construction
    process and the signal can be used at any of these stages. Relying on the signal
    for both steps puts a lot of emphasis on the predictions and should only be considered
    when the level of confidence in the forecasts is high.


    The first step is **selection**. While a forecasting exercise can be carried out
    on a large number of assets, it is not compulsory to invest in all of these assets.
    In fact, for long-only portfolios, it would make sense to take advantage of the
    signal to exclude those assets that are presumably likely to underperform in the
    future. Often, portfolio policies have fixed sizes that impose a constant number
    of assets. One heuristic way to exploit the signal is to select the assets that
    have the most favorable predictions and to discard the others. This naive idea
    is often used in the asset pricing literature: portfolios are formed according
    to the quantiles of underlying characteristics and some characteristics are deemed
    interesting if the corresponding **sorted portfolios** exhibit very different
    profitabilities (e.g., high average return for high quantiles versus low average
    return for low quantiles).


    This is for instance an efficient way to test the relevance of the signal. If
    Q portfolios q = 1, ..., Q are formed according to the rankings of the assets
    with respect to the signal, then one would expect that the out-of-sample performance
    of the portfolios be monotonic with q. While a rigorous test of monotonicity would
    require to account for all portfolios (see, e.g., Romano and Wolf (2013)), it
    is often only assumed that the extreme portfolios suffice. If the difference between
    portfolio number 1 and portfolio number Q is substantial, then the signal is valuable.
    Whenever the investor is able to short assets, this amounts to a dollar neutral
    strategy.


    The second step is **weighting**. If the selection process relied on the signal,
    then a simple weighting scheme is often a good idea. Equally weighted portfolios
    are known to be hard to beat (see DeMiguel et al. (2009b)), especially compared
    to their cap-weighted alternative, as is shown in Plyakha et al. (2016). More
    advanced schemes include equal risk contributions'
  merge: -1
  img_proc: true
- pgno: 200
  md: '(Maillard et al. (2010)) and constrained minimum variance (Coqueret (2015)).
    Both only rely on the covariance matrix of the assets and not on any proxy for
    the vector of expected returns.


    For the sake of completeness, we explicitize a generalization of Coqueret (2015)
    which is a generic constrained quadratic program:


    ```

    \min_{\mathbf{w}} \frac{\lambda}{2} \mathbf{w}'' \mathbf{\Sigma} \mathbf{w} -
    \mathbf{w}'' \boldsymbol{\mu}, \quad \text{s.t.} \quad \begin{aligned} \mathbf{w}''
    \mathbf{1} &= 1, \\ (\mathbf{w} - \mathbf{w}_-)'' \mathbf{\Lambda} (\mathbf{w}
    - \mathbf{w}_-) &\le \delta_R, \\ \mathbf{w}'' \mathbf{w} &\le \delta_D, \end{aligned}
    (12.1)

    ```


    where it is easy to recognize the usual **mean-variance optimization** in the
    left-hand side. We impose three constraints on the right-hand side.¹ The first
    one is the budget constraint (weights sum to one). The second one penalizes variations
    in weights (compared to the current allocation, **w**<sub>-</sub>) via a diagonal
    matrix \(\mathbf{\Lambda}\) that penalizes trading costs. This is a crucial point.
    Portfolios are rarely constructed from scratch and are most of the time **adjustments**
