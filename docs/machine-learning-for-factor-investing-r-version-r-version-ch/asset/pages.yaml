    # # 5.3 Predictive regressions


    # ## 5.3.1 Literature review and principle


    The topic of predictive regressions sits on a collection of very interesting articles.
    One influential contribution is Stambaugh (1999), where the author shows the perils
    of regressions in which the independent variables are autocorrelated. In this
    case, the usual OLS estimate is biased and must therefore be corrected. The results
    have since then been extended in numerous directions (see Campbell and Yogo (2006)
    and Hjalmarsson (2011), the survey in Gonzalo and Pitarakis (2018) and, more recently,
    the study of Xu (2020) on predictability over multiple horizons).


    A second important topic pertains to the time-dependence of the coefficients in
    predictive regressions. One contribution in this direction is Dangl and Halling
    (2012), where coefficients are estimated via a Bayesian procedure. More recently
    Kelly et al. (2019) use time-dependent factor loadings to model the cross-section
    of stock returns. The time-varying nature of coefficients of predictive regressions
    is further documented by Henkel et al. (2011) for short term returns. Lastly,
    Farmer et al. (2019) introduce the concept of pockets of predictability: assets
    or markets experience different phases; in some stages, they are predictable and
    in some others, they aren’t. Pockets are measured both by the number of days that
    a t-statistic is above a particular threshold and by the magnitude of the R^2
    over the considered period. Formal statistical tests are developed by Demetrescu
    et al. (2020).


    The introduction of penalization within predictive regressions goes back at least
    to Rapach et al. (2013), where they are used to assess lead-lag relationships
    between US markets and other international stock exchanges. More recently, Chinco
    et al. (2019a) use LASSO regressions to forecast high frequency returns based
    on past returns (in the cross-section) at various horizons. They report statistically
    significant gains. Han et al. (2019) and Rapach and Zhou (2019) use LASSO and
    elasticnet regressions (respectively) to improve forecast combinations and single
    out the characteristics that matter when explaining stock returns.


    These contributions underline the relevance of the overlap between predictive
    regressions and penalized regressions. In simple machine-learning based asset
    pricing, we often seek to build models such as that of Equation (3.7). If we stick
    to a linear relationship and add penalization terms, then the model becomes:


    ```

    $$r_{t+1,n} = \alpha_n + \sum_{k=1}^K \beta_n^k f_{t,n}^k + \epsilon_{t+1,n},
    \quad \text{s.t.} \quad (1-\alpha) \sum_{j=1}^J |\beta_j| + \alpha \sum_{j=1}^J
    \beta_j^2 < \theta$$

    ```


    where we use \(f_{t,n}^k\) or \(x_{t,n}^k\) interchangeably and \(\theta\) is
    some penalization intensity. Again, one of the aims of the regularization is to
    generate more robust estimates. If the patterns extracted hold out of sample,
    then


    ```

    $$\hat{r}_{t+1,n} = \hat{\alpha}_n + \sum_{k=1}^K \hat{\beta}_n^k f_{t,n}^k,$$

    ```


    will be a relatively reliable proxy of future performance.'
