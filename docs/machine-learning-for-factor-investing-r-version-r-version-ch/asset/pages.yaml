- pgno: 33
  md: '# Factor investing and asset pricing anomalies


    Asset pricing anomalies are the foundations of **factor investing**. In this chapter
    our aim is twofold:


    +   present simple ideas and concepts: basic factor models and common empirical
    facts (time-varying nature of returns and risk premia);


    +   provide the reader with lists of articles that go much deeper to stimulate
    and satisfy curiosity.


    The purpose of this chapter is not to provide a full treatment of the many topics
    related to factor investing. Rather, it is intended to give a broad overview and
    cover the essential themes so that the reader is guided towards the relevant references.
    As such, it can serve as a short, non-exhaustive, review of the literature. The
    subject of factor modelling in finance is incredibly vast and the number of papers
    dedicated to it is substantial and still rapidly increasing.


    The universe of peer-reviewed financial journals can be split in two. The first
    kind is the **academic** journals. Their articles are mostly written by professors,
    and the audience consists mostly of scholars. The articles are long and often
    technical. Prominent examples are the _Journal of Finance_, the _Review of Financial
    Studies_ and the _Journal of Financial Economics_. The second type is more **practitioner**-orientated.
    The papers are shorter, easier to read, and target finance professionals predominantly.
    Two emblematic examples are the _Journal of Portfolio Management_ and the _Financial
    Analysts Journal_. This chapter reviews and mentions articles published essentially
    in the first family of journals.


    Beyond academic articles, several monographs are already dedicated to the topic
    of style allocation (a synonym of factor investing used for instance in theoretical
    articles (Barberis and Shleifer (2003)) or practitioner papers (Asness et al.
    (2015))). To cite but a few, we mention:


    +   Ilmanen (2011): an exhaustive excursion into risk premia, across many asset
    classes, with a large spectrum of descriptive statistics (across factors and periods),


    +   Ang (2014): covers factor investing with a strong focus on the money management
    industry,


    +   Bali et al. (2016): very complete book on the cross-section of signals with
    statistical analyses (univariate metrics, correlations, persistence, etc.),


    +   Jurczenko (2017): a tour on various topics given by field experts (factor
    purity, predictability, selection versus weighting, factor timing, etc.).


    Finally, we mention a few wide-scope papers on this topic: Goyal (2012), Cazalet
    and Roncalli (2014) and Baz et al. (2015).'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# 3.1 Introduction


    The topic of factor investing, though a decades-old academic theme, has gained
    traction concurrently with the rise of equity traded funds (ETFs) as vectors of
    investment. Both have gathered momentum in the 2010 decade. Not so surprisingly,
    the feedback loop between practical financial engineering and academic research
    has stimulated both sides in a mutually beneficial manner. Practitioners rely
    on key scholarly findings (e.g., asset pricing anomalies) while researchers dig
    deeper into pragmatic topics (e.g., factor exposure or transaction costs). Recently,
    researchers have also tried to quantify and qualify the impact of factor indices
    on financial markets. For instance, Krkoska and Schenk-Hoppé (2019) analyze herding
    behaviors while Cong and Xu (2019) show that the introduction of composite securities
    increases volatility and cross-asset correlations.


    The core aim of factor models is to understand the **drivers of asset prices**.
    Broadly speaking, the rationale behind factor investing is that the financial
    performance of firms depends on factors, whether they be latent and unobservable,
    or related to intrinsic characteristics (like accounting ratios for instance).
    Indeed, as Cochrane (2011) frames it, the first essential question is _which characteristics
    really provide independent information about average returns?_ Answering this
    question helps understand the cross-section of returns and may open the door to
    their prediction.


    Theoretically, linear factor models can be viewed as special cases of the arbitrage
    pricing theory (APT) of Ross (1976), which assumes that the return of an asset
    $n$ can be modelled as a linear combination of underlying factors $f_k$:


    $$r_{t,n} = \alpha_n + \sum_{k=1}^K \beta_{n,k} f_{t,k} + \epsilon_{t,n}, \tag{3.1}$$


    where the usual econometric constraints on linear models hold: \(\mathbb{E}[\epsilon_{t,n}]
    = 0\), \(\text{cov}(\epsilon_{t,n}, \epsilon_{t,m}) = 0\) for \(n \neq m\) and
    \(\text{cov}(\mathbf{f}_n, \boldsymbol{\epsilon}_n) = 0\). If such factors do
    exist, then they are in contradiction with the cornerstone model in asset pricing:
    the capital asset pricing model (CAPM) of Sharpe (1964), Lintner (1965) and Mossin
    (1966). Indeed, according to the CAPM, the only driver of returns is the market
    portfolio. This explains why factors are also called ‘anomalies’.


    Empirical evidence of asset pricing anomalies has accumulated since the dual publication
    of Fama and French (1992) and Fama and French (1993). This seminal work has paved
    the way for a blossoming stream of literature that has its meta-studies (e.g.,
    Green et al. (2013), Harvey et al. (2016) and McLean and Pontiff (2016)). The
    regression (3.1) can be evaluated once (unconditionally) or sequentially over
    different time frames. In the latter case, the parameters (coefficient estimates)
    change and the models are thus called _conditional_ (we refer to Ang and Kristensen
    (2012) and to Cooper and Maio (2019) for recent results on this topic as well
    as for a detailed review on the related research). Conditional models are more
    flexible because they acknowledge that the drivers of asset prices may not be
    constant, which seems like a reasonable postulate.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# 3.2 Detecting anomalies


    # 3.2.1 Challenges


    Obviously, a crucial step is to be able to identify an anomaly and the complexity
    of this task should not be underestimated. Given the publication bias towards
    positive results (see, e.g., Harvey (2017) in financial economics), researchers
    are often tempted to report partial results that are sometimes invalidated by
    further studies. The need for replication is therefore high and many findings
    have no tomorrow (Linnainmaa and Roberts (2018)), especially if transaction costs
    are taken into account (Patton and Weller (2020), Chen and Velikov (2020)). Nevertheless,
    as is demonstrate by Chen (2019), p-hacking alone cannot account for all the anomalies
    documented in the literature. One way to reduce the risk of spurious detection
    is to increase the hurdles (often, the _t_-statistics) but the debate is still
    ongoing (Harvey et al. (2016), Chen (2020)), or to resort to multiple testing
    (Harvey et al. (2020)).


    Some researchers document fading anomalies because of publication: once the anomaly
    becomes public, agents invest in it, which pushes prices up and the anomaly disappears.
    McLean and Pontiff (2016) document this effect in the US but Jacobs and Müller
    (2020) find that all other countries experience sustained post-publication factor
    returns. With a different methodology, Chen and Zimmermann (2020) introduce a
    publication bias adjustment for returns and the authors note that this (negative)
    adjustment is in fact rather small. Penasse (2019) recommends the notion of _alpha
    decay_ to study the persistence or attenuation of anomalies.


    The destruction of factor premia may be due to herding (Krkoska and Schenk-Hoppé
    (2019), Volpati et al. (2020)) and could be accelerated by the democratization
    of so-called smart-beta products (ETFs notably) that allow investors to directly
    invest in particular styles (value, low volatility, etc.). For a theoretical perspective
    on the attractivity of factor investing, we refer to Jin (2019). On the other
    hand, DeMiguel et al. (2019) argue that the price impact of crowding in the smart-beta
    universe is mitigated by trading diversification stemming from external institutions
    that trade according to strategies outside this space (e.g., high frequency traders
    betting via order-book algorithms).


    The remainder of this subsection was inspired from Baker et al. (2017) and Harvey
    and Liu (2019a).


    # 3.2.2 Simple portfolio sorts


    This is the most common procedure and the one used in Fama and French (1992).
    The idea is simple. On one date,


    +   1. rank firms according to a particular criterion (e.g., size, book-to-market
    ratio);


    +   2. form \( J \ge 2 \) portfolios (i.e., homogeneous groups) consisting of
    the same number of stocks according to the ranking (usually, \( J=2, J=3, J=5
    \) or \( J=10 \) portfolios are built, based on the median, terciles, quintiles
    or deciles of the criterion);'
  merge: -1
  img_proc: true
- pgno: 36
  md: "+   3. the weight of stocks inside the portfolio is either uniform (equal weights),\
    \ or proportional to market capitalization;\n\n+   4. at a future date (usually\
    \ one month), report the returns of the portfolios. Then, iterate the procedure\
    \ until the chronological end of the sample is reached.\n\nThe outcome is a time\
    \ series of portfolio returns \\( r_t^j \\) for each grouping \\( j \\). An anomaly\
    \ is identified if the t-test between the first (\\( j=1 \\)) and the last group\
    \ (\\( j=J \\)) unveils a significant difference in average returns. More robust\
    \ tests are described in Cattaneo et al. (2020). A strong limitation of this approach\
    \ is that the sorting criterion could have a non-monotonic impact on returns and\
    \ a test based on the two extreme portfolios would not detect it. Several articles\
    \ address this concern: Patton and Timmermann (2010) and Romano and Wolf (2013)\
    \ for instance. Another concern is that these sorted portfolios may capture not\
    \ only the priced risk associated to the characteristic, but also some unpriced\
    \ risk. Daniel et al. (2020b) show that it is possible to disentangle the two\
    \ and make the most of altered sorted portfolios.\n\nInstead of focusing on only\
    \ one criterion, it is possible to group asset according to more characteristics.\
    \ The original paper Fama and French (1992) also combines market capitalization\
    \ with book-to-market ratios. Each characteristic is divided into 10 buckets,\
    \ which makes 100 portfolios in total. Beyond data availability, there is no upper\
    \ bound on the number of features that can be included in the sorting process.\
    \ In fact, some authors investigate more complex sorting algorithms that can manage\
    \ a potentially large number of characteristics (see e.g., Feng et al. (2019)\
    \ and Bryzgalova et al. (2019b)).\n\nFinally, we refer to Ledoit et al. (2020)\
    \ for refinements that take into account the covariance structure of asset returns\
    \ and to Cattaneo et al. (2020) for a theoretical study on the statistical properties\
    \ of the sorting procedure (including theoretical links with regression-based\
    \ approaches). Notably, the latter paper discusses the optimal number of portfolios\
    \ and suggests that it is probably larger than the usual 10 often used in the\
    \ literature.\n\nIn the code and Figure 3.1 below, we compute size portfolios\
    \ (equally weighted: above versus below the median capitalization). According\
    \ to the size anomaly, the firms with below median market cap should earn higher\
    \ returns on average. This is verified whenever the orange bar in the plot is\
    \ above the blue one (it happens most of the time).\n\n```\ndata_ml %>%\n  group_by(date)\
    \ %>%\n  mutate(large = Mkt_Cap_12M_Usd > median(Mkt_Cap_12M_Usd)) %>% # Creates\
    \ the cap sort\n  ungroup() %>% # Ungroup\n  mutate(year = lubricate::year(date))\
    \ %>% # Creates a year variable\n  group_by(year, large) %>% # Analyze by year\
