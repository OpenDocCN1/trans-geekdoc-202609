    # ## 13.2 Local interpretations


    Whereas global interpretations seek to assess the impact of features on the output
    overall, local methods try to quantify the behavior of the model on particular
    instances or the neighborhood thereof. Local interpretability has recently gained
    traction and many papers have been published on this topic. Below, we outline
    the most widespread methods.1


    1 For instance, we do not mention the work of Horel and Giesecke (2019) but the
    interested reader can have a look at their work on neural networks (and also at
    the references cited in the paper).'
