  md: '# 3.4.3 The green factors


    The demand for ethical financial products has sharply risen during the 2010 decade,
    leading to the creation of funds dedicated to socially responsible investing (SRI
    - see Camilleri (2020)). Though this phenomenon is not really new (Schueth (2003),
    Hill et al. (2007)), its acceleration has prompted research about whether or not
    characteristics related to ESG criteria (environment, social, governance) are
    priced. Dozens and even possibly hundreds of papers have been devoted to this
    question, but no consensus has been reached. More and more, researchers study
    the financial impact of climate change (see Bernstein et al. (2019), Hong et al.
    (2019) and Hong et al. (2020)) and the societal push for responsible corporate
    behavior (Fabozzi (2020), Kurtz (2020)). We gather below a very short list of
    papers that suggests conflicting results:


    +   favorable: ESG investing works (Kempf and Osthoff (2007), Cheema-Fox et al.
    (2020)), can work (Nagy et al. (2016), Alessandrini and Jondeau (2020)), or can
    at least be rendered efficient (Branch and Cai (2012)). A large meta-study reports
    overwhelming favorable results (Friede et al. (2015)), but of course, they could
    well stem from the publication bias towards positive results.


    +   unfavorable: Ethical investing is not profitable according to Adler and Kritzman
    (2008) and Blitz and Swinkels (2020). An ESG factor should be long unethical firms
    and short ethical ones (Lioui (2018)).


    +   mixed: ESG investing may be beneficial globally but not locally (Chakrabarti
    and Sen (2020)). Portfolios relying on ESG screening do not significantly outperform
    those with no screening but are subject to lower levels of volatility (Gibson
    et al. (2020), Goulier and Utz (2020)). As is often the case, the devil is in
    the details, and results depend on whether to use E, S or G (Bruder et al. (2019)).


    On top of these contradicting results, several articles point towards complexities
    in the measurement of ESG. Depending on the chosen criteria and on the data provider,
    results can change drastically (see Galema et al. (2008), Berg et al. (2020) and
    Atta-Darkua et al. (2020)).


    We end this short section by noting that of course ESG criteria can directly be
    integrated into ML model, as is for instance done in de Franco et al. (2020).


    # 3.5 The links with machine learning


    Given the exponential increase in data availability, the obvious temptation of
    any asset manager is to try to infer future returns from the abundance of attributes
    available at the firm level. We allude to classical data like accounting ratios
    and to alternative data, such as sentiment. This task is precisely the aim of
    Machine Learning. Given a large set of predictor variables (X), the goal is to
    predict a proxy for future performance y through a model of the form (2.1).


    Some attempts toward this direction have already been made (e.g., Brandt et al.
    (2009), Hjalmarsson and Manchev (2012), Ammann et al. (2016), DeMiguel et al.
    (2020)), but not with any ML intent or focus originally. In retrospect, these
    approaches do share some links'
