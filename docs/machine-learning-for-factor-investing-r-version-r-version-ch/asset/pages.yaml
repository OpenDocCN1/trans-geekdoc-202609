- pgno: 109
  md: "# ## 6.6 Discussion\n\nIn factor investing, these weights can very well depend\
    \ on the feature values (\\(W_i = \\mathcal{W}_i(\\mathbf{x}_i)\\)). For instance,\
    \ for one particular characteristic \\(\\mathbf{x}^k\\), weights can be increasing\
    \ thereby giving more importance to assets with high values of this characteristic\
    \ (e.g., value stocks are favored compared to growth stocks). One other option\
    \ is to increase weights when the values of the characteristic become more extreme\
    \ (deep value and deep growth stocks have larger weights). If the features are\
    \ uniform, the weights can simply be \\(\\mathcal{W}_i(x_i^k) \\propto |x_i^k\
    \ - 0.5|\\): firms with median value 0.5 have zero weight and as the feature value\
    \ shifts towards 0 or 1, the weight increases. Specifying weights on instances\
    \ biases the learning process just like views introduced à la Black and Litterman\
    \ (1992) influence the asset allocation process. The difference is that the nudge\
    \ is performed well ahead of the portfolio choice problem.\n\nIn xgboost, the\
    \ implementation instance weighting is done very early, in the definition of the\
    \ xgb.DMatrix:\n\n```\n```\ninst_weights <- runif(nrow(train_features_xgb)) #\
    \ Random weights\ninst_weights <- inst_weights / sum(inst_weights) # Normalization\n\
    train_matrix_xgb <- xgb.DMatrix(data = train_features_xgb,\n                 \
    \               label = train_label_xgb,\n                                weight\
    \ = inst_weights) # Weights!\n```\n```\n\nThen, in the subsequent stages, the\
    \ optimization will be performed with these hard-coded weights. The splitting\
    \ points can be altered (via the total weighted loss in clusters) and the terminal\
    \ weight values (6.5) are also impacted.\n\n# ## 6.5 Discussion\n\nWe end this\
    \ chapter by a discussion on the choice of predictive engine with a view towards\
    \ portfolio construction. As recalled in Chapter 2, the ML signal is just one\
    \ building stage of construction of the investment strategy. At some point, this\
    \ signal must be translated into portfolio weights.\n\nFrom this perspective,\
    \ simple trees appear suboptimal. Tree depths are usually set between 3 and 6.\
    \ This implies between 8 and 64 terminal leaves at most, with possibly very unbalanced\
    \ clusters. The likelihood of having one cluster with 20% to 30% of the sample\
    \ is high. This means that when it comes to predictions, roughly 20% to 30% of\
    \ the instances will be given the same value.\n\nOn the other side of the process,\
    \ portfolio policies commonly have a fixed number of assets. Thus, having assets\
    \ with equal signals does not permit to discriminate and select a subset to be\
    \ included in the portfolio. For instance, if the policy requires exactly 100\
    \ stocks and 105 stocks have the same signal, the signal cannot be used for selection\
    \ purposes. It would have to be combined with exogenous information such as the\
    \ covariance matrix in a mean-variance type allocation.\n\nOverall, this is one\
    \ reason to prefer aggregate models. When the number of learners is sufficiently\
    \ large (5 is almost enough), the predictions for assets will be unique and tailored\
    \ to these assets. It then becomes possible to discriminate via the signal and\
    \ select only those assets that have the most favorable signal. In practice, random\
    \ forests and boosted trees are probably the best choices."
  merge: -1
  img_proc: true
