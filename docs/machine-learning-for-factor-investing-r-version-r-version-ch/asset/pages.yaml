  md: '![](img/8861a37f775d09b4ba7a5151f604d9f5_37_0.png)


    **FIGURE 3.1:** The size factor: average returns of small versus large firms.


    # ### 3.2.3 Factors


    The construction of so-called factors follows the same lines as above. Portfolios
    are based on one characteristic and the factor is a long-short ensemble of one
    extreme portfolio minus the opposite extreme (small minus large for the size factor
    or high book-to-market ratio minus low book-to-market ratio for the value factor).
    Sometimes, subtleties include forming bivariate sorts and aggregating several
    portfolios together, as in the original contribution of Fama and French (1993).
    The most common factors are listed below, along with a few references. We refer
    to the books listed at the beginning of the chapter for a more exhaustive treatment
    of factor idiosyncrasies. For most anomalies, theoretical justifications have
    been brought forward, whether risk-based or behavioral. We list the most frequently
    cited factors below:


    +   - Size (**SMB** = small firms minus large firms): Banz (1981), Fama and French
    (1992), Fama and French (1993), Van Dijk (2011), Asness et al. (2018) and Astakhov
    et al. (2019).


    +   - Value (**HM** = high minus low: undervalued minus ‘growth’ firms): Fama
    and French (1992), Fama and French (1993), Asness et al. (2013).


    +   - Momentum (**WML** = winners minus losers): Jegadeesh and Titman (1993),
    Carhart (1997) and Asness et al. (2013). The winners are the assets that have
    experienced the highest returns over the last year (sometimes the computation
    of the return is truncated to omit the last month). Cross-sectional momentum is
    linked, but not equivalent, to time series momentum (trend following), see e.g.,
    Moskowitz et al. (2012) and Lempérière et al. (2014). Momentum is also related
    to contrarian movements that occur both at higher and lower frequencies (short-term
    and long-term reversals), see Luo et al. (2020).


    +   - Profitability (**RMW** = robust minus weak profits): Fama and French (2015),
    Bouchaud et al. (2019). In the former reference, profitability is measured as
    (revenues - (cost and expenses))/equity.


    +   - Investment (**CMA** = conservative minus aggressive): Fama and French (2015),
    Hou et al.'
