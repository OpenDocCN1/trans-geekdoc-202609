- pgno: 302
  md: "![](img/8861a37f775d09b4ba7a5151f604d9f5_302_0.png)\n\nFIGURE 18.13: Time series\
    \ of returns.\n\n# 18.8.2 Advanced weighting function\n\nFirst, we code the function\
    \ with all inputs.\n\n```\n```r\nweights <- function(Sigma, mu, Lambda, lambda,\
    \ k_D, k_R, w_old){\n  N <- nrow(Sigma)\n  M <- solve(Lambda*Sigma + 2*k_R*Lambda\
    \ + 2*k_D*diag(N)) # Inverse matrix\n  num <- 1-sum(M %*% (mu + 2*k_R*Lambda %*%\
    \ w_old)) # eta numerator\n  den <- sum(M %*% rep(1,N)) # eta denominator\n  eta\
    \ <- num / den # eta\n  vec <- mu + eta * rep(1,N) + 2*k_R*Lambda %*% w_old #\
    \ Vector in weight\n  return(M %*% vec)\n}\n```\n```\n\nSecond, we test it on\
    \ some random dataset. We use the returns created at the end of Chapter 1 and\
    \ used for the Lasso allocation in Section 5.2.2. For \\mu, we use the sample\
    \ average, which is rarely a good idea in practice. It serves as illustration\
    \ only.\n\n```\n```r\nSigma <- returns %>% dplyr::select(-date) %>% as.matrix()\
    \ %>% cov() # Covariance matrix\nmu <- returns %>% dplyr::select(-date) %>% apply(2,mean)\
    \ # Vector of exp. returns\nLambda <- diag(nrow(Sigma)) # Trans. Cost matrix\n\
    lambda <- 1 # Risk aversion\nk_D <- 1\nk_R <- 1\nw_old <- rep(1, nrow(Sigma))\
    \ / nrow(Sigma) # Prev. weights: EW\nweights(Sigma, mu, Lambda, lambda, k_D, k_R,\
    \ w_old) %>% head() # First weights\n```\n```\n\n```\n## [,1]\n## 1 0.0031339308\n\
    ## 3 -0.0003243527\n## 4 0.0011944677\n## 7 0.0014194215\n## 9 0.0015086240\n\
    ## 11 -0.0005015207\n```\n\nSome weights can of course be negative. Finally, we\
    \ use the map2() function to test some"
  merge: -1
  img_proc: true
- pgno: 303
  md: "sensitivity. We examine 3 key indicators:\n\n+   - **diversification**, which\
    \ we measure via the inverse of the sum of squared weights (inverse Hirschman-Herfindhal\
    \ index);\n+   - **leverage**, which we assess via the absolute sum of negative\
    \ weights;\n+   - **in-sample volatility**, which we compute as w'Σx\n\nTo do\
    \ so, we create a dedicated function below.\n\n```\nsensi <- function(lambda,\
    \ k_D, Sigma, mu, Lambda, k_R, w_old){\n  w <- weights(Sigma, mu, Lambda, lambda,\
    \ k_D, k_R, w_old)\n  out <- c()\n  out$$div <- 1/sum(w^2) # Diversification\n\
    \  out$$lev <- sum(abs(w[w<0])) # Leverage\n  out$$vol <- t(w) %*% Sigma %*% w\
    \ # In-sample vol\n  return(out)\n}\n```\n\nInstead of using the baseline map2\
    \ function, we rely on a version thereof that concatenates results into a dataframe\
    \ directly.\n\n```\nlambda <- 10^(-3:2) # parameter values\nk_D <- 2^10^(-3:2)\
    \ # parameter values\npars <- expand.grid(lambda, k_D) # parameter grid\nlambda\
    \ <- pars$$lambda\nk_D <- pars$$k_D\n\nres <- map2_dfr(lambda, k_D, sensi,\n \
    \               Sigma = Sigma, mu = mu, Lambda = Lambda, k_R = k_R, w_old = w_old)\n\
    bind_cols(lambda = as.factor(lambda), k_D = as.factor(k_D), res) %>%\n  gather(key\
    \ = indicator, value = value, -lambda, -k_D) %>%\n  ggplot(aes(x = lambda, y =\
    \ value, fill = k_D)) + geom_col(position = \"dodge\") +\n  facet_grid(indicator\
    \ ~ ., scales = \"free\")\n```\n\nIn Figure 18.14, each panel displays an indicator.\
    \ In the first panel, we see that diversification increases with k_D: indeed,\
    \ as this number increases, the portfolio converges to uniform (EW) values. The\
    \ parameter λ has a minor impact. The second panel naturally shows the inverse\
    \ effect for leverage: as diversification increases with k_D, leverage (i.e.,\
    \ total negative positions - shortsales) decreases. Finally, the last panel shows\
    \ that in-sample volatility is however largely driven by the risk aversion parameter.\
    \ As λ increases, volatility logically decreases. For small values of λ, k_D is\
    \ negatively related to volatility but the pattern reverses for large values of\
    \ λ. This is because the equally weighted portfolio is less risky than very leveraged\
    \ mean-variance policies, but more risky than the minimum-variance portfolio.\n\
    \n# ## 18.8.3 Functional programming in the backtest\n\nOften, programmers prefer\
    \ to avoid loops. In order to avoid a loop in the backtest, we need to code what\
    \ happens for one given date. This is encapsulated in the following function.\
    \ For simplicity, we code it for only one strategy. Also, the function will assume\
    \ the structure of the data is known, but the columns (features & labels) could\
    \ also be passed as arguments. We recycle the function **weights\\_xgb** from\
    \ Chapter 12.\n\n```\nportf_map <- function(t, data_ml, ticks, t_oos, m_offset,\
    \ train_size, weight_func){\n  train_data <- data_ml %>% filter(date < t_oos[t]\
    \ - m_offset * 30, # Roll. window w. buffer\n```"
  merge: -1
  img_proc: true
