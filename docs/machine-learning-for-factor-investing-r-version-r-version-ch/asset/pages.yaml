  md: '# 11


    # Ensemble models


    Let us be honest. When facing a prediction task, it is not obvious to determine
    the best choice between ML tools: penalized regressions, tree methods, neural
    networks, SVMs, etc. A natural and tempting alternative is to **combine** several
    algorithms (or the predictions that result from them) to try to extract value
    out of each engine (or learner). This intention is not new and contributions towards
    this goal go back at least to Bates and Granger (1969) (for the purpose of passenger
    flow forecasting).


    Below, we outline a few books on the topic of ensembles. The latter have many
    names and synonyms, such as **forecast aggregation**, **model averaging**, **mixture
    of experts** or **prediction combination**. The first four references below are
    monographs, while the last two are compilations of contributions:


    +   • Zhou (2012): a very didactic book that covers the main ideas of ensembles;


    +   • Schapire and Freund (2012): the main reference for boosting (and hence,
    ensembling) with many theoretical results and thus strong mathematical groundings;


    +   • Seni and Elder (2010): an introduction dedicated to tree methods mainly;


    +   • Claeskens and Hjort (2008): an overview of model selection techniques with
    a few chapters focused on model averaging;


    +   • Zhang and Ma (2012): a collection of thematic chapters on ensemble learning;


    +   • Okun et al. (2011): examples of applications of ensembles.


    In this chapter, we cover the basic ideas and concepts behind the notion of ensembles.
    We refer to the above books for deeper treatments on the topic. We underline that
    several ensemble methods have already been mentioned and covered earlier, notably
    in Chapter 6. Indeed, random forests and boosted trees are examples of ensembles.
    Hence, other early articles on the combination of learners are Schapire (1990),
    Jacobs et al. (1991) (for neural networks particularly), and Freund and Schapire
    (1997). Finally, for a theoretical view on ensembles with a Bayesian perspective,
    we refer to Razin and Levy (2020).'
