    We confirm that the HML factor remains redundant when the four others are present
    in the asset pricing model. The figures we obtain are very close to the ones in
    the original paper (Fama and French (2015)), which makes sense, since we only
    add 5 years to their initial sample.


    At a more macro-level, researchers also try to figure out which models (i.e.,
    combinations of factors) are the most likely, given the data empirically observed
    (and possibly given priors formulated by the econometrician). For instance, this
    stream of literature seeks to quantify to which extent the 3-factor model of Fama
    and French (1993) outperforms the 5 factors in Fama and French (2015). In this
    direction, De Moor et al. (2015) introduce a novel computation for p-values that
    compare the relative likelihood that two models pass a zero-alpha test. More generally,
    the Bayesian method of Barillas and Shanken (2018) was subsequently improved by
    Chib et al. (2020).


    Lastly, even the optimal number of factors is a subject of disagreement among
    conclusions of recent work. While the traditional literature focuses on a limited
    number (3-5) of factors, more recent research by DeMiguel et al. (2020), He et
    al. (2020), Kozak et al. (2019) and Freyberger et al. (2020) advocates the need
    to use at least 15 or more (in contrast, Kelly et al. (2019) argue that a small
    number of latent factors may suffice). Green et al. (2017) even find that the
    number of characteristics that help explain the cross-section of returns varies
    in time.


    # 3.2.6 Advanced techniques


    The ever increasing number of factors combined to their importance in asset management
    has led researchers to craft more subtle methods in order to “organize” the so-called
    factor zoo and, more importantly, to detect spurious anomalies and compare different
    asset pricing'
