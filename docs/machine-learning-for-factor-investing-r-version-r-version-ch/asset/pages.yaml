    for the label of a dataset.


    In Bayesian analysis, one sophistication (compared to a frequentist approach)
    comes from the fact that the data is not almighty. The distribution of the parameter
    \(\theta\) will be a mix between some **prior** distribution set by the statistician
    (the user, the analyst) and the empirical distribution from the data. More precisely,
    a simple application of Bayes’ formula yields


    \(p(\theta|\mathbf{y}) = \frac{p(\theta)p(\mathbf{y}|\theta)}{p(\mathbf{y})} \propto
    p(\theta)p(\mathbf{y}|\theta).\)


    The interpretation is immediate: the distribution of \(\theta\) knowing the data
    \(\mathbf{y}\) is proportional to the distribution of \(\theta\) times the distribution
    of \(\mathbf{y}\) knowing \(\theta\). The term \(p(\mathbf{y})\) is often omitted
    because it is simply a scaling number that ensures that the density sums or integrates
    to one.


    We use a slightly different notation between Equation (9.1) and Equation (9.2).
    In the former, \(P\) denotes a true probability, i.e., it is a number. In the
    latter, \(p\) stands for the whole probability density function of \(\theta\)
    or \(\mathbf{y}\).


    The whole purpose of Bayesian analysis is to compute the so-called **posterior**
    distribution \(p(\theta|\mathbf{y})\) via the **prior** distribution \(p(\theta)\)
    and the **likelihood function** \(p(\mathbf{y}|\theta)\). Priors are sometimes
    qualified as informative, weakly informative or uninformative, depending on the
    degree to which the user is confident on the relevance and robustness of the prior.
    The simplest way to define a non-informative prior is to set a constant (uniform)
    distribution over some realistic interval(s).


    The most challenging part is usually the likelihood function. The easiest way
    to solve the problem is to resort to a specific distribution (possibly a parametric
    family) for the distribution of the data and then consider that observations are
    i.i.d., just as in a simple maximum likelihood inference. If we assume that new
    parameters for the distributions are gathered into \(\lambda\), then the likelihood
    can be written as


    \(p(\mathbf{y}|\theta, \lambda) = \prod_{i=1}^{I} f_{\lambda}(y_i; \beta),\)


    but in this case the problem becomes slightly more complex because adding new
    parameters changes the posterior distribution to \(p(\theta, \lambda|\mathbf{y})\).
    The user must find out the joint distribution of \(\theta\) and \(\lambda\) -
    given \(\mathbf{y}\). Because of their nested structure, these models are often
    called **hierarchical models**.


    Bayesian methods are widely used for portfolio choice. The rationale is that the
    distribution of asset returns depends on some parameter and the main issue is
    to determine the posterior distribution. We very briefly review a vast literature
    below. Bayesian asset allocation is investigated in Lai et al. (2011) (via stochastic
    optimization), Guidolin and Liu (2016) and Dangl and Weissensteiner (2020). Shrinkage
    techniques (of means and covariance matrices) are tested in Frost and Savarino
    (1986), Kan and Zhou (2007) and DeMiguel et al. (2015). In a similar vein, Tu
    and Zhou (2010) build priors that are coherent with asset pricing theories. Finally,
    Bauder et al. (2020) sample portfolio returns which allows to derive a Bayesian
    optimal frontier. We invite the interested reader to also dwelve in the references
    that are cited within these few articles.'
  merge: -1
