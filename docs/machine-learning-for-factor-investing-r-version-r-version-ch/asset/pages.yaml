  md: "# # 16.4 Simple examples\n\n# ## 16.4.1 Q-learning with simulations\n\nTo illustrate\
    \ the gist of the problems mentioned above, we propose two implementations of\
    \ Q-learning. For simplicity, the first one is based on simulations. This helps\
    \ understand the learning process in a simplified framework. We consider two assets:\
    \ one risky and one riskless, with return equal to zero. The returns for the risky\
    \ process follow an autoregressive model of order one (AR(1)): r_{t+1} = a + \\\
    rho r_t + \\epsilon_{t+1} with |\\rho| < 1 and \\epsilon following a standard\
    \ white noise with variance \\sigma^2. In practice, individual (monthly) returns\
    \ are seldom autocorrelated, but adjusting the autocorrelation helps understand\
    \ if the algorithm learns correctly (see exercise below).\n\nThe environment consists\
    \ only in observing the past return r_t. Since we seek to estimate the Q function,\
    \ we need to discretize this state variable. The simplest choice is to resort\
    \ to a binary variable: equal to -1 (negative) if r_t < 0 and to +1 (positive)\
    \ if r_t \\ge 0. The actions are summarized by the quantity invested in the risky\
    \ asset. It can take 5 values: 0 (risk-free portfolio), 0.25, 0.5, 0.75 and 1\
    \ (fully invested in the risky asset). This is for instance the same choice as\
    \ in Pendharkar and Cusatis (2018).\n\nThe landscape of R libraries for RL is\
    \ surprisingly sparse. We resort to the package ReinforcementLearning which has\
    \ an intuitive implementation of Q-learning (another option would be the reinforcelearn\
    \ package). It requires a dataset with the usual inputs: state, action, reward\
    \ and subsequent state. We start by simulating the returns: they drive the states\
    \ and the rewards (portfolio returns). The actions are sampled randomly. Technically,\
    \ the main function of the package requires that states and actions be of character\
    \ type. The data is built in the chunk below.\n\n```\nlibrary(ReinforcementLearning)\n\
    set.seed(42)\nn_sample <- 10^5\nrho <- 0.8\nsd <- 0.4\na <- 0.06 * rho\ndata_RL\
    \ <- tibble(returns = a/rho + arima.sim(n = n_sample,\n                      \
    \                     list(ar = rho),\n                                      \
    \     sd = sd),\n                  action = round(runif(n_sample)*4)/4) %>%\n\
    \  mutate(new_state = ifelse(returns < 0, \"neg\", \"pos\"),\n         reward\
    \ = returns * action,\n         state = lag(new_state),\n         action = as.character(action))\
    \ %>%\n  na.omit()\ndata_RL %>% head()\n```\n\n```\n## # A tibble: 6 x 5\n## \
    \  returns action new_state reward state\n##   <dbl> <chr> <chr> <dbl> <chr>\n\
    ## 1 -0.474 0.5 neg -0.237 neg\n## 2 0.185 0.25 neg -0.0463 neg\n## 3 0.146 0.25\
    \ pos 0.0364 neg\n## 4 0.543 0.75 pos 0.407 pos\n## 5 0.202 0.75 pos 0.152 pos\n\
    ## 6 0.376 0.25 pos 0.0940 pos\n```"
