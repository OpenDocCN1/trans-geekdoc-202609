    # 7.6 Other common architectures


    In this section, we present other network structures. Because they are less mainstream
    and often harder to implement, we do not propose code examples and stick to theoretical
    introductions.


    # 7.6.1 Generative adversarial networks


    The idea of Generative Adversarial Networks (GANs) is to improve the accuracy
    of a classical neural network by trying to fool it. This very popular idea was
    introduced by Goodfellow et al. (2014). Imagine you are an expert in Picasso paintings
    and that you boast about being able to easily recognize any piece of work from
    the painter. One way to refine your skill is to test them against a counterfeiter.
    A true expert should be able to discriminate between a true original Picasso and
    one emanating from a forger. This is the principle of GANs.


    GANs consist in two neural networks: the first one tries to learn and the second
    one tries to fool the first (induce it into error). Just like in the example above,
    there are also two sets of data: one (x) is true (or correct), stemming from a
    classical training sample and the other one (z) is fake and generated by the counterfeiter
    network.


    In the GAN nomenclature, the network that learns is D because it is supposed to
    discriminate, while the forger is G because it generates false data. In their
    original formulation, GANs are aimed at classifying. To ease the presentation,
    we keep this scope. The discriminant network has a simple (scalar) output: the
    probability that its input comes from true data (versus fake data). The input
    of G is some arbitrary noise and its output has the same shape/form as the input
    of D.


    We state the theoretical formula of a GAN directly and comment on it below. D
    and G play the following minimax game:


    ```

    min max {E[log(D(x))] + E[log(1 - D(G(z)))]} . (7.12)

    ```


    First, let us decompose this expression in its two parts (the optimizers). The
    first part (i.e., the first max) is the classical one: the algorithm seeks to
    maximize the probability of assigning the correct label to all examples it seeks
    to classify. As is done in economics and finance, the program does not maximize
    D(x) itself on average, but rather a functional form (like a utility function).


    On the left side, since the expectation is driven by x, the objective must be
    increasing in the output. On the right side, where the expectation is evaluated
    over the fake instances, the right classification is the opposite, i.e., 1 - D(G(z)).


    The second, overarching, part seeks to minimize the performance of the algorithm
    on the simulated data: it aims at shrinking the odds that D finds out that the
    data is indeed corrupt. A summarized version of the structure of the network is
    provided below in Figure (7.13).'
