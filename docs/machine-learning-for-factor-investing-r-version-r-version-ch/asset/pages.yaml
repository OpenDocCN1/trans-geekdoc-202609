    # ## 7.5 Recurrent networks


    # ### 7.5.1 Presentation


    Multilayer perceptrons are feed-forward networks because the data flows from left
    to right with no looping in between. For some particular tasks with sequential
    linkages (e.g., time-series or speech recognition), it might be useful to keep
    track of what happened with the previous sample (i.e., there is a natural ordering).
    One simple way to model ''memory'' would'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'be to consider the following network with only one intermediate layer:


    \(\bar{y}_i = f^{(y)} \left( \sum_{j=1}^{U_1} h_{i,j} w_j^{(y)} + b^{(2)} \right)\)


    \(\mathbf{h}_i = f^{(h)} \left( \sum_{k=1}^{U_0} x_{i,k} w_k^{(h,1)} + b^{(1)}
    + \underbrace{\sum_{k=1}^{U_1} w_k^{(h,2)} h_{i-1,k}}_{\text{memory part}} \right)\),


    where \(h_0\) is customarily set at zero (vector-wise).


    These kinds of models are often referred to as Elman (1990) models or to Jordan
    (1997) models if in the latter case \(h_{i-1}\) is replaced by \(y_{i-1}\) in
    the computation of \(h_i\). Both types of models fall under the overarching umbrella
    of Recurrent Neural Networks (RNNs).


    The \(h_i\) is usually called the state or the hidden layer. The training of this
    model is complicated and must be done by unfolding the network over all instances
    to obtain a simple feed-forward network and train it regularly. We illustrate
    the unfolding principle in Figure 7.9. It shows a very deep network. The first
    input impacts the first layer and then the second one via \(h_1\) and all following
    layers in the same fashion. Likewise, the second input impacts all layers except
    the first and each instance \(i-1\) is going to impact the output \(\bar{y}_i\)
    and all outputs \(\bar{y}_j\) for \(j \ge i\). In Figure 7.9, the parameters that
    are trained are shown in blue. They appear many times, in fact, at each level
    of the unfolded network.


    ![](img/8861a37f775d09b4ba7a5151f604d9f5_133_0.png)


    # FIGURE 7.9: Unfolding a recurrent network.


    The main problem with the above architecture is the loss of memory induced by
    **vanishing gradients**. Because of the depth of the model, the chain rule used
    in the back-propagation will imply a large number of products of derivatives of
    activation functions. Now, as is shown in Figure 7.4, these functions are very
    smooth and their derivatives are most of the time smaller than one (in absolute
    value). Hence, multiplying many numbers smaller than one leads to very small figures:
    beyond some layers, the learning does not propagate because the adjustments are
    too small.


    One way to prevent this progressive discounting of the memory was introduced in
    Hochreiter and Schmidhuber (1997) (Long-Short Term Memory - LSTM model). This
    model was subsequently simplified by the authors Chung et al. (2015) and we present
    this more parsimonious model below. The Gated Recurrent Unit (GRU) is a slightly
    more complicated'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'version of the vanilla recurrent network defined above. It has the following
    representation:


    ```

    \tilde{y}_i = z_i \tilde{y}_{i-1} + (1 - z_i) \tanh \mathbf{w}''_y \mathbf{x}_i
    + b_y + u_y r_i \tilde{y}_{i-1} \quad \text{output (prediction)}

    z_i = \text{sig}(\mathbf{w}''_z \mathbf{x}_i + b_z + u_z \tilde{y}_{i-1}) \quad
    \text{''update gate''} \in (0,1)

    r_i = \text{sig}(\mathbf{w}''_r \mathbf{x}_i + b_r + u_r \tilde{y}_{i-1}) \quad
    \text{''reset gate''} \in (0,1).

    ```


    In compact form, this gives


    ```

    \tilde{y}_i = \underbrace{z_i}_{\text{weight past value}} \underbrace{\tilde{y}_{i-1}}_.
    + \underbrace{(1-z_i)}_{\text{weight}} \underbrace{\tanh \mathbf{w}''_y \mathbf{x}_i
    + b_y}_{\text{candidate value (classical RNN)}} + \underbrace{u_y r_i \tilde{y}_{i-1}}_-
    ,

    ```


    where the \(z_i\) decides the optimal mix between the current and past values.
    For the candidate value, \(r_i\) decides which amount of past/memory to retain.
    \(r_i\) is commonly referred to as the ‘reset gate’ and \(z_i\) to the ‘update
    gate’.


    There are some subtleties in the training of a recurrent network. Indeed, because
    of the chaining between the instances, each batch must correspond to a coherent
    time series. A logical choice is thus one batch per asset with instances (logically)
    chronologically ordered. Lastly, one option in some frameworks is to keep some
    memory between the batches by passing the final value of \(\tilde{y}_i\) to the
    next batch (for which it will be \(\tilde{y}_0\)). This is often referred to as
    the stateful mode and should be considered meticulously. It does not seem desirable
    in a portfolio prediction setting if the batch size corresponds to all observations
    for each asset: there is no particular link between assets. If the dataset is
    divided into several parts for each given asset, then the training must be handled
    very cautiously.


    Recurrent networks and LSTM especially have been found to be good forecasting
    tools in financial contexts (see, e.g., Fischer and Krauss (2018) and Wang et
    al. (2020)).


    # 7.5.2 Code and results


    Recurrent networks are theoretically more complicated compared to multilayered
    perceptrons. In practice, they are also more challenging in their implementation.
    Indeed, the serial linkages require more attention compared to feed-forward architectures.
    In an asset pricing framework, we must separate the assets because the stock-specific
    time series cannot be bundled together. The learning will be sequential, one stock
    at a time.


    The dimensions of variables are crucial. In Keras, they are defined for RNNs as:


    +   1. The size of the batch: in our case, it will be the number of assets. Indeed,
    the recurrence relationship holds at the asset level, hence each asset will represent
    a new batch on which the model will learn.


    +   2. The time steps: in our case, it will simply be the number of dates.


    +   3. The number of features: in our case, there is only one possible figure
    which is the number of predictors.


    For simplicity and in order to reduce computation times, we will use the same
    subset of stocks as that from Section 5.2.2. This yields a perfectly rectangular
    dataset in which all dates have the same number of observations.'
