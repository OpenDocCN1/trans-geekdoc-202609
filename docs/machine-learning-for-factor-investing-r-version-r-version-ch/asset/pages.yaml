  md: 'where


    ```

    \(m_I^{k,-}(c^{(k)}) = \frac{1}{\#\{i, x_i^{(k)} < c^{(k)}\}} \sum_{\{x_i^{(k)}
    < c^{(k)}\}} y_i \text{ and}\)

    \(m_I^{k,+}(c^{(k)}) = \frac{1}{\#\{i, x_i^{(k)} > c^{(k)}\}} \sum_{\{x_i^{(k)}
    > c^{(k)}\}} y_i\)

    ```


    are the average values of Y, conditional on \(X^{(k)}\) being smaller or larger
    than \(c\). The cardinal function \(\#\{\cdot\}\) counts the number of instances
    of its argument. For feature \(k\), the optimal split \(c^{k,*}\) is thus the
    one for which the total dispersion over the two subgroups is the smallest.


    The optimal splits satisfy \(c^{k,*} = \text{argmin}_{c^{(k)}} V_I^{(k)}(c^{(k)})\).
    Of all the possible splitting variables, the tree will choose the one that minimizes
    the total dispersion not only over all splits, but also over all variables: \(k^*
    = \text{argmin}_k V_I^{(k)}(c^{k,*})\).


    After one split is performed, the procedure continues on the two newly formed
    clusters. There are several criteria that can determine when to stop the splitting
    process (see Section 6.1.3). One simple criterion is to fix a maximum number of
    levels (the depth) for the tree. A usual condition is to impose a minimum gain
    that is expected for each split. If the reduction in dispersion after the split
    is only marginal and below a specified threshold, then the split is not executed.
    For further technical discussions on decision trees, we refer for instance to
    section 9.2.4 of Hastie et al. (2009).


    When the tree is built (trained), a prediction for new instances is easy to make.
    Given its feature values, the instance ends up in one leaf of the tree. Each leaf
    has an average value for the label: this is the predicted outcome. Of course,
    this only works when the label is numerical. We discuss below the changes that
    occur when it is categorical.


    # ## 6.1.2 Further details on classification


    Classification exercises are somewhat more complex than regression tasks. The
    most obvious difference is the measure of dispersion or heterogeneity. This loss
    function which must take into account the fact that the final output is not a
    simple number, but a vector. The output \(\vec{\mathbf{y}}_i\) has as many elements
    as there are categories in the label and each element is the probability that
    the instance belongs to the corresponding category.


    For instance, if there are 3 categories: buy, hold and sell, then each instance
    would have a label with as many columns as there are classes. Following our example,
    one label would be (1,0,0) for a buy position for instance. We refer to Section
    4.5.2 for a introduction on this topic.


    Inside a tree, labels are aggregated at each cluster level. A typical output would
    look like (0.6,0.1,0.3): they are the proportions of each class represented within
    the cluster. In this case, the cluster has 60% of buy, 10% of hold and 30% of
    sell.


    The loss function must take into account this multidimensionality of the label.
    When building trees, since the aim is to favor homogeneity, the loss penalizes
    outputs that are not concentrated towards one class. Indeed, facing a diversified
    output of (0.3,0.4,0.3) is much harder to handle than the concentrated case of
    (0.8,0.1,0.1).


    The algorithm is thus seeking purity: it searches a splitting criterion that will
    lead to'
