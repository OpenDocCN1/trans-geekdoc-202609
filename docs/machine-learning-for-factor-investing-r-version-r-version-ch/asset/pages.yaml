- pgno: 158
  md: '# ### 9.5 Bayesian additive trees


    # #### 9.5.1 General formulation


    Bayesian additive regression trees (BARTs) are an ensemble technique that mixes
    Bayesian thinking and regression trees. In spirit, they are close to the tree
    ensembles seen in Chapter 6, but they differ greatly in their implementation.
    In BARTs like in Bayesian regressions, the regularization comes from the prior.
    The original article is Chipman et al. (2010) and the implementation (in R) follows
    Sparapani et al. (2019).


    Formally, the model is an aggregation of _M_ models, which we write as


    ```

    \[ y = \sum_{m=1}^M \mathcal{T}_m(q_m, \mathbf{w}_m, \mathbf{x}) + \epsilon, \tag{9.14}
    \]

    ```


    where \(\epsilon\) is a Gaussian noise with variance \(\sigma^2\), and the \(\mathcal{T}_m
    = \mathcal{T}_m(q_m, \mathbf{w}_m, \mathbf{x})\) are decision trees with structure
    _q<sub>m</sub>_ and weights vectors **w**_<sub>m</sub>_. This decomposition of
    the tree is the one we used for boosted trees and is illustrated in Figure 6.5.
    _q<sub>m</sub>_ codes all splits (variables chosen for the splits and levels of
    the splits) and the vectors **w**_<sub>m</sub>_ correspond to the leaf values
    (at the terminal nodes).


    At the macro-level, BARTs can be viewed as traditional Bayesian objects, where
    the parameters \(\boldsymbol{\theta}\) are all of the unknowns coded through _q<sub>m</sub>_,
    **w**_<sub>m</sub>_ and \(\sigma^2\) and where the focus is set on determining
    the posterior


    ```

    \[ q_m, \mathbf{w}_m, \sigma^2 \mid (\mathbf{X}, \mathbf{Y}). \tag{9.15} \]

    ```


    Given particular forms of priors for \( q_m, \mathbf{w}_m, \sigma^2 \) , the algorithm
    draws the parameters using a combination of Metropolis-Hastings _and_ Gibbs samplers.


    # #### 9.5.2 Priors


    The definition of priors in tree models is delicate and intricate. The first important
    assumption is independence: independence between \(\sigma^2\) and all other parameters
    and independence between trees, that is, between couples (_q<sub>m</sub>,_**w**_<sub>m</sub>_)
    and (_q<sub>n</sub>,_**w**_<sub>n</sub>_) for _m_=_n_. This assumption makes BARTs
    closer to random forests in spirit and further from boosted trees. This independence
    entails


    ```

    \[ P((q_1, \mathbf{w}_1), \dots, (q_M, \mathbf{w}_M), \sigma^2) = P(\sigma^2)
    \prod_{m=1}^M P(q_m, \mathbf{w}_m). \]

    ```


    Moreover, it is customary (for simplicity) to separate the structure of the tree
    (_q<sub>m</sub>_) and the terminal weights (**w**_<sub>m</sub>_), so that by a
    Bayesian conditioning


    ```

    \[ P((q_1, \mathbf{w}_1), \dots, (q_M, \mathbf{w}_M), \sigma^2) = \underbrace{P(\sigma^2)}_{\text{noise
    term}} \prod_{m=1}^M \underbrace{P(\mathbf{w}_m|q_m)}_{\text{tree weights}} \underbrace{P(q_m)}_{\text{tree
    struct.}} \tag{9.16} \]

    ```'
