  md: "+   - set equal weights $w_i = I^{-1}$;\n\n+   - For $m = 1, \\dots, M$ do:\n\
    \n+   1. Find a learner $l_m$ that minimizes the weighted loss $\\sum_{i=1}^I\
    \ w_i L(l_m(\\mathbf{x}_i), \\mathbf{y}_i);$\n\n+   2. Compute a learner weight\n\
    +   \n+   $$a_m = f_a(\\mathbf{w}, l_m(\\mathbf{x}), \\mathbf{y});$$\n\n+   3.\
    \ Update the instance weights\n+   \n+   $$w_i \\leftarrow w_i e^{f_w(l_m(\\mathbf{x}_i),\
    \ y_i)};$$\n\n+   4. Normalize the $w_i$ to sum to one.\n\n+   - The output for\
    \ instance $\\mathbf{x}_i$ is a simple function of $\\sum_{m=1}^M a_m l_m(\\mathbf{x}_i),$\
    \ \n+   \n+   $$\n+   \\tilde{y}_i = f_y \\sum_{m=1}^M a_m l_m(\\mathbf{x}_i)\
    \ \\quad .\n+   $$\n\nLet us comment on the steps of the algorithm. The formulation\
    \ holds for many variations of Adaboost and we will specify the functions $f_a$\
    \ and $f_w$ below.\n\n+   1. The first step seeks to find a learner (tree) $l_m$\
    \ that minimizes a weighted loss. Here the base loss function $L$ essentially\
    \ depends on the task (regression versus classification).\n\n+   2. The second\
    \ and third steps are the most interesting because they are the heart of Adaboost:\
    \ they define the way the algorithm adapts sequentially. Because the purpose is\
    \ to aggregate models, a more sophisticated approach compared to uniform weights\
    \ for learners is a tailored weight for each learner. A natural property (for\
    \ $f_a$) should be that a learner that yields a smaller error should have a larger\
    \ weight because it is more accurate.\n\n+   3. The third step is to change the\
    \ weights of observations. In this case, because the model aims at improving the\
    \ learning process, $f_w$ is constructed to give more weight on observations for\
    \ which the current model does not do a good job (i.e., generates the largest\
    \ errors). Hence, the next learner will be incentivized to pay more attention\
    \ to these pathological cases.\n\n+   4. The third step is a simple scaling procedure.\n\
    \nIn Table 6.1, we detail two examples of weighting functions used in the literature.\
    \ For the original Adaboost (Freund and Schapire (1996), Freund and Schapire (1997)),\
    \ the label is binary with values +1 and -1 only. The second example stems from\
    \ Drucker (1997) and is dedicated to regression analysis (with real-valued label).\
    \ The interested reader can have a look at other possibilities in Schapire (2003)\
    \ and Ridgeway et al. (1999)."
