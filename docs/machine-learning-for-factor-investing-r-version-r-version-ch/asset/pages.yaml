- pgno: 227
  md: '# 13.2.1 LIME


    LIME (Local Interpretable Model-Agnostic Explanations) is a methodology originally
    proposed by Ribeiro et al. (2016). Their aim is to provide a faithful account
    of the model under two constraints:


    +   - simple interpretability, which implies a limited number of variables with
    visual or textual representation. This is to make sure any human can easily understand
    the outcome of the tool;

    +   - local faithfulness: the explanation holds for the vicinity of the instance.


    The original (black-box) model is $f$ and we assume we want to approximate its
    behavior around instance $x$ with the interpretable model $g$. \(^2\) The simple
    function $g$ belongs to a larger class $G$. The vicinity of $x$ is denoted $\pi_x$
    and the complexity of $g$ is written $\Omega(g)$. LIME seeks an interpretation
    of the form


    ```

    \(\xi(x) = \arg\min_{g \in G} \mathcal{L}(f, g, \pi_x) + \Omega(g),\)

    ```


    where \(\mathcal{L}(f, g, \pi_x)\) is the loss function (error/imprecision) induced
    by $g$ in the vicinity \(\pi_x\) of $x$. The penalization \(\Omega(g)\) is for
    instance the number of leaves or depth of a tree, or the number of predictors
    in a linear regression.


    It now remains to define some of the above terms. The vicinity of $x$ is defined
    by \(\pi_x(z) = e^{-D(x,z)^2 / \sigma^2}\), where $D$ is some distance measure
    and \(\sigma^2\) some scaling constant. We underline that this function decreases
    when $z$ shifts away from $x$.


    The tricky part is the loss function. In order to minimize it, LIME generates
    artificial samples close to $x$ and averages/sums the error on the label that
    the simple representation makes. For simplicity, we assume a scalar output for
    $f$, hence the formulation is the following:


    ```

    \(\mathcal{L}(f, g, \pi_x) = \sum_z \pi_x(z) (f(z) - g(z))^2\)

    ```


    and the errors are weighted according to their distance from the initial instance
    $x$: the closest points get the largest weights. In its most basic implementation,
    the set of models $G$ consists of all linear models.


    In Figure 13.5, we provide a simplified diagram of how LIME works.


    \(^2\)In the original paper, the authors dig deeper into the notion of interpretable
    representations. In complex machine learning settings (image recognition or natural
    language processing), the original features given to the model can be hard to
    interpret. Hence, this requires an additional translation layer because the outcome
    of LIME must be expressed in terms of easily understood quantities. In factor
    investing, the features are elementary, hence we do not need to deal with this
    issue).'
  merge: -1
  img_proc: true
