- pgno: 230
  md: 'In each graph (one graph corresponds to the explanation around one instance),
    there are two types of information: the sign of the impact and the magnitude of
    the impact. The sign is revealed with the color (positive in blue, negative in
    red) and the magnitude is shown with the size of the rectangles.


    The values to the left of the graphs show the ranges of the features with which
    the local approximations were computed.


    Lastly, we briefly discuss the choice of distance function chosen in the code.
    It is used to evaluate the discrepancy between the true instance and a simulated
    one to give more or less weight to the prediction of the sampled instance. Our
    dataset comprises only numerical data; hence, the Euclidean distance is a natural
    choice:


    ```

    Euclidean(\mathbf{x}, \mathbf{y}) = \sqrt{\sum_{n=1}^{N} (x_i - y_i)^2}.

    ```


    Another possible choice would be the Manhattan distance:


    ```

    Manhattan(\mathbf{x}, \mathbf{y}) = \sum_{n=1}^{N} |x_i - y_i|.

    ```


    The problem with these two distances is that they fail to handle categorical variables.
    This is where the Gower distance steps in (Gower (1971)). The distance imposes
    a different treatment on features of different types (classes versus numbers essentially,
    but it can also handle missing data!). For categorical features, the Gower distance
    applies a binary treatment: the value is equal to 1 if the features are equal,
    and to zero if not (i.e., \(1_{\{x_n=y_n\}}\)). For numerical features, the spread
    is quantified as \(1 - \frac{|x_n - y_n|}{R_n}\), where \(R_n\) is the maximum
    absolute value the feature can take. All similarity measurements are then aggregated
    to yield the final score. Note that in this case, the logic is reversed: x and
    y are very close if the Gower distance is close to one, and they are far away
    if the distance is close to zero.


    # 13.2.2 Shapley values


    The approach of Shapley values is somewhat different compared to LIME and closer
    in spirit to PDPs. It originates from cooperative game theory (Shapley (1953)).
    The rationale is the following. One way to assess the impact (or usefulness) of
    a variable is to look at what happens if we remove this variable from the dataset.
    If this is very detrimental to the quality of the model (i.e., to the accuracy
    of its predictions), then it means that the variable is substantially valuable.


    The simplest way to proceed is to take all variables and remove one to evaluate
    its predictive ability. Shapley values are computed on a larger scale because
    they consider all possible combinations of variables to which they add the target
    predictor. Formally, this gives:


    ```

    \phi_k = \sum_{S \subseteq \{x_1, ..., x_K\} \setminus x_k} \frac{Card(S)!(K -
    Card(S) - 1)!}{K!} (\hat{f}_{S \cup \{x_k\}}(S \cup \{x_k\}) - \hat{f}_S(S) \quad
    (13.3)

    ```


    $S$ is any subset of the coalition that doesn''t include feature $k$ and its size
    is Card($S$).'
