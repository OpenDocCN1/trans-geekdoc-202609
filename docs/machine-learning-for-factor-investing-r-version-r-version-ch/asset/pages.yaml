  md: "characteristic (e.g., market capitalization), a threshold level (quantile of\
    \ the characteristic) and a direction (long position in the top or bottom of the\
    \ distribution).\n\n```\nstrat <- function(data, feature, thresh, direction){\n\
    \  data_tmp <- dplyr::select(data, feature, date, R1M_Usd)  # Data\n  colnames(data_tmp)[1]\
    \ <- \"feature\"                     # Colname\n  data_tmp %>%\n    mutate(decision\
    \ = direction * feature > direction * thresh) %>%  # Investment decision\n   \
    \ group_by(date) %>%                                    # Date-by-date analysis\n\
    \    mutate(nb = sum(decision),                            # Nb assets in portfolio\n\
    \           w = decision / nb,                             # Weights of assets\n\
    \           return = w * R1M_Usd) %>%                      # Asset contribution\n\
    \    summarise(p_return = sum(return)) %>%                  # Portfolio return\n\
    \    summarise(avg = mean(p_return), sd = sd(p_return), SR = avg/sd) %>% # Perf.\
    \ metrics\n  return()\n}\n```\n\nThen, we test the function on a triplet of arguments.\
    \ We pick the price-to-book (Pb) ratio. The position is positive and the threshold\
    \ is 0.3, which means that the strategy buys the stocks that have a Pb value above\
    \ the 0.3 quantile of the distribution.\n\n```\nstrat(data_ml, \"Pb\", 0.3, 1)\
    \  # Large cap\n```\n\n```\n## # A tibble: 1 x 3\n##   avg   sd    SR\n##   <dbl>\
    \ <dbl> <dbl>\n## 1 0.0102 0.0496 0.207\n```\n\nThe output keeps three quantities\
    \ that will be useful to compute the statistic (12.5). We must now generate these\
    \ indicators for many strategies. We start by creating the grid of parameters.\n\
    \n```\nfeature <- c(\"Div_Yld\", \"Ebit_Bv\", \"Mkt_Cap_6M_Usd\", \"Mom_11M_Usd\"\
    , \"Pb\", \"Vol1Y_Usd\")\nthresh <- seq(0.2, 0.8, by = 0.1)   # Threshold values\
    \ values\ndirection <- c(1, -1)               # Decision direction\npars <- expand.grid(feature,\
    \ thresh, direction)  # The grid\nfeature <- pars[,1] %>% as.character()     \
    \     # re-features\nthresh <- pars[,2]                               # re-thresholds\n\
    direction <- pars[,3]                            # re-directions\n```\n\nThis\
    \ makes 84 strategies in total. We can proceed to see how they fare. We plot the\
    \ corresponding Sharpe ratios below in Figure 12.4. The top plot shows the strategies\
    \ that invest in the bottoms of the distributions of characteristics while the\
    \ bottom plot pertains to the portfolios that are long in the lower parts of these\
    \ distributions.\n\n```\ngrd <- pmap(list(feature, thresh, direction),    # Parameters\
    \ for the grid search\n            strat,                              # Function\
    \ on which to apply the grid search\n            data = data_ml              \
    \        # Data source/input\n) %>%\n  unlist() %>%\n  matrix(ncol = 3, byrow\
    \ = T)\ngrd <- data.frame(feature, thresh, direction, grd)  # Gather & reformat\
    \ results\ncolnames(grd) [4:6] <- c(\"mean\", \"sd\", \"SR\")        # Change\
    \ colnames\ngrd <- grid %>% mutate_at(vars(direction), as.factor) # Change type:\
    \ factor (for plot)\ngrd %>% ggplot(aes(x = thresh, y = SR, color = feature))\
    \ + # Plot!\n  geom_point() + geom_line() + facet_grid(direction ~.)\n```"
