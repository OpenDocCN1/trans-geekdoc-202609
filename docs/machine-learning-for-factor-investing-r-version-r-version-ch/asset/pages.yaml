  md: '![](img/8861a37f775d09b4ba7a5151f604d9f5_228_0.png)


    FIGURE 13.5: Simplistic explanation of LIME: the explained instance is surrounded
    by a red square. Five points are generated (the triangles) and a weighted linear
    model is fitted accordingly (dashed grey line).


    For expositional clarity, we work with only one dependent variable. The original
    training sample is shown with the black points. The fitted (trained) model is
    represented with the blue line (smoothed conditional average) and we want to approximate
    how the model works around one particular instance which is highlighted by the
    red square around it. In order to build the approximation, we sample 5 new points
    around the instance (the 5 red triangles). Each triangle lies on the blue line
    (they are model predictions) and has a weight proportional to its size: the triangle
    closest to the instance has a bigger weight. Using weighted least-squares, we
    build a linear model that fits to these 5 points (the dashed grey line). This
    is the outcome of the approximation. It gives the two parameters of the model:
    the intercept and the slope. Both can be evaluated with standard statistical tests.


    The sign of the slope is important. It is fairly clear that if the instance had
    been taken closer to x = 0, the slope would have probably been almost flat and
    hence the predictor could be locally discarded. Another important detail is the
    number of sample points. In our explanation, we take only five, but in practice,
    a robust estimation usually requires around one thousand points or more. Indeed,
    when too few neighbors are sampled, the estimation risk is high and the approximation
    may be rough.


    We proceed with an example of implementation. There are several steps:


    +   1. Fit a model on some training data.


    +   2. Wrap everything using the lime() function.'
