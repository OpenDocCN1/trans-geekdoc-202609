  md: '# # 16

    Reinforcement learning


    Due to its increasing popularity within the Machine Learning community, we dedicate
    a chapter to reinforcement learning (RL). In 2019 only, more than 25 papers dedicated
    to RL have been submitted to (or updated on) arXiv under the **q:fin** (quantitative
    finance) classification. Moreover, an early survey of RL-based portfolios is compiled
    in Sato (2019) (see also Zhang et al. (2020)) and general financial applications
    are discussed in Kolm and Ritter (2019b), Meng and Khushi (2019), Charpentier
    et al. (2020) and Mosavi et al. (2020). This shows that RL has recently gained
    traction among the quantitative finance community.<sup>1</sup>


    While RL is a framework much more than a particular algorithm, its efficient application
    in portfolio management is not straightforward, as we will show.


    # ## 16.1 Theoretical layout


    # ### 16.1.1 General framework


    In this section, we introduce the core concepts of RL and follow relatively closely
    the notations (and layout) of Sutton and Barto (2018), which is widely considered
    as a solid reference in the field, along with Bertsekas (2017). One central tool
    in the field is called the **Markov Decision Process** (MDP, see Chapter 3 in
    Sutton and Barto (2018)).


    MDPs, like all RL frameworks, involve the interaction between an **agent** (e.g.,
    a trader or portfolio manager) and an **environment** (e.g., a financial market).
    The agent performs **actions** that may alter the state of environment and gets
    a reward (possibly negative) for each action. This short sequence can be repeated
    an arbitrary number of times, as is shown in Figure 16.1.


    ![](img/8861a37f775d09b4ba7a5151f604d9f5_267_0.png)


    **FIGURE 16.1:** Scheme of Markov Decision Process. R, S and A stand for reward,
    state and action, respectively.


    <sup>1</sup>Like neural networks, reinforcement learning methods have also been
    recently developed for derivatives pricing and hedging, see for instance Kolm
    and Ritter (2019a).'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'Given initialized values for the state of the environment ($S_0$) and reward
    (usually $R_0 = 0$), the agent performs an action (e.g., invests in some assets).
    This generates a reward $R_1$ (e.g., returns, profits, Sharpe ratio) and also
    a future state of the environment ($S_1$). Based on that, the agent performs a
    new action and the sequence continues. When the sets of states, actions and rewards
    are finite, the MDP is logically called _finite_. In a financial framework, this
    is somewhat unrealistic and we discuss this issue later on. It nevertheless is
    not hard to think of simplified and discretized financial problems. For instance,
    the reward can be binary: win money versus lose money. In the case of only one
    asset, the action can also be dual: investing versus not investing. When the number
    of assets is sufficiently small, it is possible to set fixed proportions that
    lead to a reasonable number of combinations of portfolio choices, etc.


    We pursue our exposé with finite MDPs; they are the most common in the literature
    and their formal treatment is simpler. The relative simplicity of MDPs helps grasp
    the concepts that are common to other RL techniques. As is often the case with
    Markovian objects, the key notion is that of **transition probability**:


    $p(s'', r|s, a) = \mathbb{P}[S_t = s'', R_t = r | S_{t-1} = s, A_{t-1} = a],$


    which is the probability of reaching state $s''$ and reward $r$ at time $t$, conditionally
    on being in state $s$ and performing action $a$ at time $t-1$. The finite sets
    of states and actions will be denoted with $\mathcal{S}$ and $\mathcal{A}$ henceforth.
    Sometimes, this probability is averaged over the set of rewards which gives the
    following decomposition:


    \(\sum_r r p(s'', r|s, a) = \mathcal{P}_{ss}^a \mathcal{R}_{ss}^a, \quad \text{where}
    \quad \mathcal{P}_{ss}^a = \mathbb{P}[S_t = s'' | S_{t-1} = s, A_{t-1} = a], \quad
    \text{and} \quad \mathcal{R}_{ss}^a = \mathbb{E}[R_t | S_{t-1} = s, S_t = s'',
    A_{t-1} = a].\)


    The goal of the agent is to maximize some function of the stream of rewards. This
    gain is usually defined as


    \(G_t = \sum_{k=0}^T \gamma^k R_{t+k+1} = R_{t+1} + \gamma G_{t+1},\)


    i.e., it is a discounted version of the reward, where the discount factor is $\gamma
    \in (0, 1]$. The horizon $T$ may be infinite, which is why $\gamma$ was originally
    introduced. Assuming the rewards are bounded, the infinite sum may diverge for
    $\gamma = 1$. That is the case if rewards don''t decrease with time and there
    is no reason why they should. When $\gamma < 1$ and rewards are bounded, convergence
    is assured. When $T$ is finite, the task is called _episodic_ and, otherwise,
    it is said to be _continuous_.


    In RL, the focal unknown to be optimized or learned is the **policy** $\pi$, which
    drives the actions of the agent. More precisely, $\pi(a, s) = \mathbb{P}[A_t =
    a | S_t = s]$, that is, $\pi$ equals the probability of taking action $a$ if the
    state of the environment is $s$. This means that actions are subject to randomness,
    just like for mixed strategies in game theory. While this may seem disappointing
    because an investor would want to be sure to take _the_ best action, it is also
    a good reminder that the best way to face random outcomes may well be to randomize
    actions as well.


    Finally, in order to try to determine the _best_ policy, one key indicator is
    the so-called value function:


    \(v_\pi(s) = \mathbb{E}_\pi [G_t | S_t = s],\)'
