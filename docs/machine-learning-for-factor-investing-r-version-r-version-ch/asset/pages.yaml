  md: '\(\mathbb{E} (f(x) - f_n(x))^2 = \underbrace{O \frac{c_f}{n}}_{\text{size of
    network}} + \underbrace{O \frac{nK \log(N)}{N}}_{\text{size of sample}} , \quad
    (7.1)\)


    where \(K\) is the dimension of the input (number of columns) and \(c_f\) is a
    constant that depends on the generator function \(f\). The above quantity provides
    a bound on the error that can be achieved by the best possible neural network
    given a dataset of size \(N\).


    There are clearly two components in the decomposition of this bound. The first
    one pertains to the complexity of the network. Just as in the original universal
    approximation theorem, the error decreases with the number of units in the network.
    But this is not enough! Indeed, the sample size is of course a key driver in the
    quality of learning (of i.i.d. observations). The second component of the bound
    indicates that the error decreases at a slightly slower pace with respect to the
    number of observations (log(\(N\))/\(N\)) and is linear in the number of units
    and the size of the input. This clearly underlines the link (trade-off?) between
    sample size and model complexity: having a very complex model is useless if the
    sample is small just like a simple model will not catch the fine relationships
    in a large dataset.


    Overall, a neural network is a possibly very complicated function with a lot of
    parameters. In linear regressions, it is possible to increase the fit by spuriously
    adding exogenous variables. In neural networks, it suffices to increase the number
    of parameters by arbitrarily adding units to the layer(s). This is of course a
    very bad idea because high-dimensional networks will mostly capture the particularities
    of the sample they are trained on.


    # 7.2.3 Learning via back-propagation


    Just like for tree methods, neural networks are trained by minimizing some loss
    function subject to some penalization:


    \(O = \sum_{i=1}^I \text{loss}(y_i, \tilde{y}_i) + \text{penalization},\)


    where \(\tilde{y}_i\) are the values obtained by the model and \(y_i\) are the
    *true* values of the instances. A simple requirement that eases computation is
    that the loss function be differentiable. The most common choices are the squared
    error for regression tasks and cross-entropy for classification tasks. We discuss
    the technicalities of classification in the next subsection.


    The training of a neural network amounts to alter the weights (and biases) of
    all units in all layers so that \(O\) defined above is the smallest possible.
    To ease the notation and given that the \(y_i\) are fixed, let us write \(D(\tilde{y}_i(\mathbf{W}))
    = \text{loss}(y_i, \tilde{y}_i)\), where \(\mathbf{W}\) denotes the entirety of
    weights and biases in the network. The updating of the weights will be performed
    via gradient descent, i.e., via


    \(\mathbf{W} \leftarrow \mathbf{W} - \eta \frac{\partial D(\tilde{y}_i)}{\partial
    \mathbf{W}} . \quad (7.2)\)


    This mechanism is the most classical in the optimization literature and we illustrate
    it in Figure 7.5. We highlight the possible suboptimality of large learning rates.
    In the diagram, the descent associated with the high \(\eta\) will oscillate around
    the optimal point, whereas the one related to the small eta will converge more
    directly.'
