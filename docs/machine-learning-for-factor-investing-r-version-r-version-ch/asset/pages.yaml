  md: 'Facing a classification problem, the trick is to use an appropriate activation
    function at the very end of the network. The dimension of the terminal output
    of the network should be equal to \( J \) (number of classes to predict), and
    if, for simplicity, we write \(\mathbf{x}_i\) for the values of this output, the
    most commonly used activation is the so-called *softmax* function:


    ```

    \(\tilde{\mathbf{y}}_i = s(\mathbf{x})_i = \frac{e^{x_i}}{\sum_{j=1}^J e^{x_j}}.\)

    ```


    The justification of this choice is straightforward: it can take any value as
    input (over the real line) and it sums to one over any (finite-valued) output.
    Similarly as for trees, this yields a ‘probability’ vector over the classes. Often,
    the chosen loss is a generalization of the entropy used for trees. Given the target
    label \(\mathbf{y}_i = (y_{i,1}, \dots, y_{i,L}) = (0, 0, \dots, 0, 1, 0, \dots,
    0)\) and the predicted output \(\tilde{\mathbf{y}}_i = (\tilde{y}_{i,1}, \dots,
    \tilde{y}_{i,L})\), the cross-entropy is defined as


    ```

    \(\text{CE}(\mathbf{y}_i, \tilde{\mathbf{y}}_i) = - \sum_{j=1}^J \log(\tilde{y}_{i,j})
    y_{i,j} . \quad (7.10)\)

    ```


    Basically, it is a proxy of the dissimilarity between its two arguments. One simple
    interpretation is the following. For the nonzero label value, the loss is \(-\log(\tilde{y}_{i,l})\),
    while for all others, it is zero. In the log, the loss will be minimal if \(\tilde{y}_{i,l}
    = 1\), which is exactly what we seek (i.e., \(y_{i,l} = \tilde{y}_{i,l}\)). In
    applications, this best case scenario will not happen, and the loss will simply
    increase when \(\tilde{y}_{i,l}\) drifts away downwards from one.


    # 7.3 How deep we should go and other practical issues


    Beyond the ones presented in the previous sections, the user faces many degrees
    of freedom when building a neural network. We present a few classical choices
    that are available when constructing and training neural networks.


    # 7.3.1 Architectural choices


    Arguably, the first choice pertains to the structure of the network. Beyond the
    dichotomy feed-forward versus recurrent (see Section 7.5), the immediate question
    is: how big (or how deep) the networks should be. First of all, let us calculate
    the number of parameters (i.e., weights plus biases) that are estimated (optimized)
    in a network.


    +   - For the first layer, this gives \((U_0 + 1)U_1\) parameters, where \(U_0\)
    is the number of columns in \(\mathbb{X}\) (i.e., number of explanatory variables)
    and \(U_1\) is the number of units in the layer.


    +   - For layer \(l \in [2, L]\), the number of parameters is \((U_{l-1} + 1)U_l\).


    +   - For the final output, there are simply \(U_L + 1\) parameters.'
