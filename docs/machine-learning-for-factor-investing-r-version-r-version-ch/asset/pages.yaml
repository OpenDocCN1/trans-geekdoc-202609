    # ### 3.2.5 Factor competition


    The core purpose of factors is to explain the cross-section of stock returns.
    For theoretical and practical reasons, it is preferable if redundancies within
    factors are avoided. Indeed, redundancies imply collinearity which is known to
    perturb estimates (Belsley et al. (2005)). In addition, when asset managers decompose
    the performance of their returns into factors, overlaps (high absolute correlations)
    between factors yield exposures that are less interpretable; positive and negative
    exposures compensate each other spuriously.


    A simple protocol to sort out redundant factors is to run regressions of each
    factor against all others:


    ```

    $f_{t,k} = a_k + \sum_{j \neq k} \delta_{k,j} f_{t,j} + \epsilon_{t,k}.$ (3.5)

    ```


    The interesting metric is then the test statistic associated to the estimation
    of $a_k$. If $a_k$ is significantly different from zero, then the cross-section
    of (other) factors fails to explain exhaustively the average return of factor
    $k$. Otherwise, the return of the factor can be captured by exposures to the other
    factors and is thus redundant.


    One mainstream application of this technique was performed in Fama and French
    (2015), in which the authors show that the HML factor is redundant when taking
    into account four other factors (Market, SMB, RMW and CMA). Below, we reproduce
    their analysis on an updated sample. We start our analysis directly with the database
    maintained by Kenneth French.


    We can run the regressions that determine the redundancy of factors via the procedure
    defined in Equation (3.5).


    ```

    factors <- c("MKT_RF", "SMB", "HML", "RMW", "CMA")

    models <- lapply(paste(factors, '' ~ MKT_RF + SMB + HML + RMW + CMA'', factors),

    function(f){ lm(as.formula(f), data = FF_factors) %>% # Call lm(.)

    summary() %>% %>% # Gather the output

    "$"(coef) %>% # Keep only the coefs

    data.frame() %>% %>% # Convert to dataframe

    filter(rownames(.) == "(Intercept)") %>% # Keep only the Intercept

    dplyr::select(Estimate, `Pr...t..`)} # Keep the coef & p-value


    alphas <- matrix(unlist(models), ncol = 2, byrow = T) %>% # Switch from list to
    dataframe

    data.frame(row.names = factors)

    # alphas # To see the alphas (optional)

    ```


    We obtain the vector of $\alpha$ values from Equation (3.5). Below, we format
    these figures along with $p$-value thresholds and export them in a summary table.
    The significance levels of coefficients is coded as follows: 0 < (***) < 0.001
    < (**) < 0.01 < (*) < 0.05.


    ```

    results <- matrix(NA, nrow = length(factors), ncol = length(factors) + 1) # Coefs

    signif <- matrix(NA, nrow = length(factors), ncol = length(factors) + 1) # p-values

    for(j in 1:length(factors)){

    form <- paste(factors[j],

    '' ~ MKT_RF + SMB + HML + RMW + CMA'', factors[j]) # Build model

    fit <- lm(form, data = FF_factors) %>% summary() # Estimate model

    coef <- fit$coefficients[,1] # Keep coefficients

    ```'
