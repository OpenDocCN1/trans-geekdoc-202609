- pgno: 249
  md: 'linear $f(\mathbf{x}_t) = \theta''\mathbf{x}_t$ and the data $\mathbf{x}_t$
    consists of asset returns, thus, the values are portfolio returns as long as $\theta''\mathbf{1}_N
    = 1$ (the budget constraint). The loss functions $L_t$ correspond to a concave
    utility function (e.g., logarithmic) and the regret is reversed:


    ```

    $$R_T = \sup_{\theta^* \in \Theta} \sum_{t=1}^T L_t(\mathbf{r}''_t \theta^*) -
    \sum_{t=1}^T L_t(\mathbf{r}''_t \theta_t),$$

    ```


    where $\mathbf{r}''_t$ are the returns. Thus, the program is transformed to maximize
    a concave function. Several articles (often from the Computer Science or ML communities)
    have proposed solutions to this type of problems: Blum and Kalai (1999), Agarwal
    et al. (2006) and Hazan et al. (2007). Most contributions work with price data
    only, with the notable exception of Cover and Ordentlich (1996), which mentions
    external data (‘_side information_’). In the latter article, it is proven that
    constantly rebalanced portfolios distributed according to two random distributions
    achieve growth rates that are close to the unattainable optimal rates. The two
    distributions are the uniform law (equally weighting, once again) and the Dirichlet
    distribution with constant parameters equal to 1/2. Under this universal distribution,
    Cover and Ordentlich (1996) show that the wealth obtained is bounded below by:


    ```

    $\text{wealth universal} \ge \frac{\text{wealth from optimal strategy}}{2(n+1)^{(m-1)/2}},$

    ```


    where \(m\) is the number of assets and \(n\) is the number of periods.


    The literature on online portfolio allocation is reviewed in Li and Hoi (2014)
    and outlined in more details in Li and Hoi (2018). Online learning, combined to
    early stopping for neural networks, is applied to factor investing in Wong et
    al. (2020). Finally, online learning is associated to clustering methods for portfolio
    choice in Khedmati and Azin (2020).


    # 14.2.3 Homogeneous transfer learning


    This subsection is mostly conceptual and will not be illustrated by coded applications.
    The ideas behind transfer learning can be valuable in that they can foster novel
    ideas, which is why we briefly present them below.


    Transfer learning has been surveyed numerous times. One classical reference is
    Pan and Yang (2009), but Weiss et al. (2016) is more recent and more exhaustive.
    Suppose we are given two datasets \(D_S\) (source) and \(D_T\) (target). Each
    dataset has its own features \(\mathbf{X}^S\) and \(\mathbf{X}^T\) and labels
    \(\mathbf{y}^S\) and \(\mathbf{y}^T\). In classical supervised learning, the patterns
    of the target set are learned only through \(\mathbf{X}^T\) and \(\mathbf{y}^T\).
    Transfer learning proposes to improve the function \(f^T\) (obtained by minimizing
    the fit \(y_i^T = f^T(\mathbf{x}_i^T) + \epsilon_i^T\) on the target data) via
    the function \(f^S\) (from \(y_i^S = f^S(\mathbf{x}_i^S) + \epsilon_i^S\) on the
    source data). Homogeneous transfer learning is when the feature space does not
    change, which is the case in our setting. In asset management, this may not always
    be the case if for instance new predictors are included (e.g., based on alternative
    data like sentiment, satellite imagery, credit card logs, etc.).


    There are many subcategories in transfer learning depending on what changes between
    the source \(S\) and the target \(T\): is it the feature space, the distribution
    of the labels, and/or the relationship between the two? These are the same questions
    as in Section 14.2. The latter case is of interest in finance because the link
    with non-stationarity is evident: it is when the model \(f\) in \(\mathbf{y} =
    f(\mathbf{X})\) changes through time. In transfer learning jargon, it is written
    as \(P[\mathbf{y}^S|\mathbf{X}^S] = P[\mathbf{y}^T|\mathbf{X}^T]\): the conditional
    law of the label knowing the features is not the same when switching from the
    source to the target. Often, the term ‘domain adaptation’ is'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'used as synonym to transfer learning. Because of a data shift, we must adapt
    the model to increase its accuracy. These topics are reviewed in a series of chapters
    in the collection by Quionero-Candela et al. (2009).


    An important and elegant result in the theory was proven by Ben-David et al. (2010)
    in the case of binary classification. We state it below. We consider $f$ and $h$
    two classifiers with values in $\{0, 1\}$. The average error between the two over
    the domain $S$ is defined by


    $$\epsilon_S(f, h) = \mathbb{E}_S[|f(\mathbf{x}) - h(\mathbf{x})|].$$


    Then,


    $$\epsilon_T(f_T, h) \le \epsilon_S(f_S, h) + \underbrace{2 \sup_B |P_S(B) - P_T(B)|}_{\text{difference
    between domains}} + \underbrace{\min(\mathbb{E}_S[|f_S(\mathbf{x}) - f_T(\mathbf{x})|],
    \mathbb{E}_T[|f_S(\mathbf{x}) - f_T(\mathbf{x})|])}_{\text{difference between
    the two learning tasks}}$$


    where $P_S$ and $P_T$ denote the distribution of the two domains. The above inequality
    is a bound on the generalization performance of $h$. If we take $f_S$ to be the
    best possible classifier for $S$ and $f_T$ the best for $T$, then the error generated
    by $h$ in $T$ is smaller than the sum of three components:


    +   - the error in the $S$ space;

    +   - the distance between the two domains (by how much the data space has shifted);

    +   - the distance between the two best models (generators).


    One solution that is often mentioned in transfer learning is instance weighting.
    We present it here in a general setting. In machine learning, we seek to minimize


    $$\epsilon_T(f) = \mathbb{E}_T [L(y, f(\mathbf{X}))],$$


    where $L$ is some loss function that depends on the task (regression versus classification).
    This can be arranged


    $$

    \begin{aligned}

    \epsilon_T(f) &= \mathbb{E}_T \frac{P_S(\mathbf{y}, \mathbf{X})}{P_S(\mathbf{y},
    \mathbf{X})} L(y, f(\mathbf{X})) \n&= \sum_{\mathbf{y}, \mathbf{X}} P_T(\mathbf{y},
    \mathbf{X}) \frac{P_S(\mathbf{y}, \mathbf{X})}{P_S(\mathbf{y}, \mathbf{X})} L(y,
    f(\mathbf{X})) \n&= \mathbb{E}_S \frac{P_T(\mathbf{y}, \mathbf{X})}{P_S(\mathbf{y},
    \mathbf{X})} L(y, f(\mathbf{X}))

    \end{aligned}

    $$


    The key quantity is thus the transition ratio $\frac{P_T(\mathbf{y}, \mathbf{X})}{P_S(\mathbf{y},
    \mathbf{X})}$ (Radon–Nikodym derivative under some assumptions). Of course this
    ratio is largely inaccessible in practice, but it is possible to find a weighting
    scheme (over the instances) that yields improvements over the error in the target
    space. The weighting scheme, just as in Coqueret and Guida (2020), can be binary,
    thereby simply excluding some observations in the computation of the error. Simply
    removing observations from the training sample can have benefitial effects.


    More generally, the above expression can be viewed as a theoretical invitation
    for user-specified instance weighting (as in Section 6.4.7). In the asset allocation
    parlance, this can be viewed as introducing views as to which observations are
    the most interesting, e.g., value stocks can be allowed to have a larger weight
    in the computation of the loss if the user believes they carry more relevant information.
    Naturally, it then always remains to minimize this loss.'
