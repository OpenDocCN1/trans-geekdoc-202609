    \ stock_id != 13) %>%  # All other observations\n  dplyr::select(features)\nneighbors\
    \ <- get.knnx(data = knn_sample, query = knn_target, k = 30)\nneighbors$nn.index\
    \         # Indices of the k nearest neighbors\n```\n\n```\n##        [,1]  [,2]\
