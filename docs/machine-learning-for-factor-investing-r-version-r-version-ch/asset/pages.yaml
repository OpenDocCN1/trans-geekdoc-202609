  md: 'with ML tools. The general formulation is the following. At time \(T\), the
    agent or investor seeks to solve the following program:


    ```

    \(\max_{\boldsymbol{\theta}_T} \mathbb{E}_T \left[ u(r_{p, T+1}) \right] = \max_{\boldsymbol{\theta}_T}
    \mathbb{E}_T \left[ u \left( (\bar{\mathbf{w}}_T + \mathbf{x}_T \boldsymbol{\theta}_T)''
    \mathbf{r}_{T+1} \right) \right] ,\)

    ```


    where \(u\) is some utility function and \(r_{p, T+1} = (\bar{\mathbf{w}}_T +
    \mathbf{x}_T \boldsymbol{\theta}_T)'' \mathbf{r}_{T+1}\) is the return of the
    portfolio, which is defined as a benchmark \(\bar{\mathbf{w}}_T\) plus some deviations
    from this benchmark that are a linear function of features \(\mathbf{x}_T \boldsymbol{\theta}_T\).
    The above program may be subject to some external constraints (e.g., to limit
    leverage).


    In practice, the vector \(\boldsymbol{\theta}_T\) must be estimated using past
    data (from \(T - \tau\) to \(T - 1\)): the agent seeks the solution of


    ```

    \(\max_{\boldsymbol{\theta}_T} \frac{1}{\tau} \sum_{t=T-\tau}^{T-1} u \left( \sum_{i=1}^{N_T}
    (\bar{w}_{i,t} + \boldsymbol{\theta}''_t \mathbf{x}_{i,t}) r_{i, t+1} \right)
    \tag{3.6}\)

    ```


    on a sample of size \(\tau\) where \(N_T\) is the number of asset in the universe.
    The above formulation can be viewed as a learning task in which the parameters
    are chosen such that the reward (average return) is maximized.


    # ## 3.5.1 A short list of recent references


    Independent of a characteristics-based approach, ML applications in finance have
    blossomed, initially working with price data only and later on integrating firm
    characteristics as predictors. We cite a few references below, grouped by methodological
    approach:


    +   - penalized quadratic programming: Goto and Xu (2015), Ban et al. (2016) and
    Perrin and Roncalli (2019),

    +   - regularized predictive regressions: Rapach et al. (2013) and Chinco et al.
    (2019a),

    +   - support vector machines: Cao and Tay (2003) and the references therein,

    +   - model comparison and/or aggregation: Kim (2003), Huang et al. (2005), Matías
    and Reboredo (2012), Reboredo et al. (2012), Dunis et al. (2013), Gu et al. (2020b)
    and Guida and Coqueret (2018b). The latter two more recent articles work with
    a large cross-section of characteristics.


    We provide more detailed lists for tree-based methods, neural networks and reinforcement
    learning techniques in Chapters 6, 7 and 16, respectively. Moreover, we refer
    to Ballings et al. (2015) for a comparison of classifiers and to Henrique et al.
    (2019) and Bustos and Pomares-Quimbaya (2020) for surveys on ML-based forecasting
    techniques.


    # ## 3.5.2 Explicit connections with asset pricing models


    The first and obvious link between factor investing and asset pricing is (average)
    return prediction. The main canonical academic reference is Gu et al. (2020b).
    Let us first write the general equation and then comment on it:


    ```

    \(r_{t+1, n} = g(\mathbf{x}_{t,n}) + \epsilon_{t+1}. \tag{3.7}\)

    ```


    The interesting discussion lies in the differences between the above model and
    that of'
