    ##    1          2          3          4          5\n## 0.009787728 0.012507087\
    \ 0.008722386 0.009398814 -0.011511758\n```\n\nOne first comment is that each\
    \ instance has its own prediction, which contrasts with the outcome of simple\
    \ tree-based outcomes. Combining many trees leads to tailored forecasts. Note\
    \ that the second line of the chunk freezes the random number generation. Indeed,\
    \ random forests are by construction contingent on the arbitrary combinations\
    \ of instances and features that are chosen to build the individual learners.\n\
