  md: '# # Support vector machines


    While the origins of support vector machines (SVMs) are old (and go back to Vapnik
    and Lerner (1963)), their modern treatment was initiated in Boser et al. (1992)
    and Cortes and Vapnik (1995) (binary classification) and Drucker et al. (1997)
    (regression). We refer to http: //www.kernel-machines.org/books for an exhaustive
    bibliography on their theoretical and empirical properties. SVMs have been very
    popular since their creation among the machine learning community. Nonetheless,
    other tools (neural networks especially) have gained popularity and progressively
    replaced SVMs in many applications like computer vision notably.


    # ### 8.1 SVM for classification


    As is often the case in machine learning, it is easier to explain a complex tool
    through an illustration with binary classification. In fact, sometimes, it is
    originally how the tool was designed (e.g., for the perceptron). Let us consider
    a simple example in the plane, that is, with two features. In Figure 8.1, the
    goal is to find a model that correctly classifies points: filled circles versus
    empty squares.


    A model consists of two weights w = (w1, w2) that load on the variables and create
    a natural linear separation in the plane. In the example above, we show three
    separations. The red one


    ![](img/8861a37f775d09b4ba7a5151f604d9f5_143_0.png)


    FIGURE 8.1: Diagram of binary classification with support vectors.'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'is not a good classifier because there are circles and squares above and beneath
    it. The blue line is a good classifier: all circles are to its left and all squares
    to its right. Likewise, the green line achieves a perfect classification score.
    Yet, there is a notable difference between the two.


    The grey star at the top of the graph is a mystery point and given its location,
    if the data pattern holds, it should be a circle. The blue model fails to recognize
    it as such while the green one succeeds. The interesting features of the scheme
    are those that we have not mentioned yet, that is, the grey dotted lines. These
    lines represent the no-man’s land in which no observation falls when the green
    model is enforced. In this area, each strip above and below the green line can
    be viewed as a margin of error for the model. Typically, the grey star is located
    inside this margin.


    The two margins are computed as the parallel lines that maximize the distance
    between the model and the closest points that are correctly classified (on both
    sides). These points are called **support vectors**, which justifies the name
    of the technique. Obviously, the green model has a greater margin than the blue
    one. The core idea of SVMs is to maximize the margin, under the constraint that
    the classifier does not make any mistake. Said differently, SVMs try to pick the
    most robust model among all those that yield a correct classification.


    More formally, if we numerically define circles as +1 and squares as -1, any ‘good’
    linear model is expected to satisfy:


    ```

    \(\begin{aligned} \sum_{k=1}^K w_k x_{i,k} + b \ge +1 \qquad \text{when } y_i
    = +1 \\ \sum_{k=1}^K w_k x_{i,k} + b \le -1 \qquad \text{when } y_i = -1, \end{aligned}\)
    (8.1)

    ```


    which can be summarized in compact form \(y_i \times \sum_{k=1}^K w_k x_{i,k}
    + b \ge 1\). Now, the margin between the green model and a support vector on the
    dashed grey line is equal to \(\|\mathbf{w}\|^{-1} = \sqrt{\sum_{k=1}^K w_k^2}^{-1/2}\).
    This value comes from the fact that the distance between a point \((x_0, y_0)\)
    and a line parametrized by \(ax + by + c = 0\) is equal to \(d = \frac{|ax_0 +
    by_0 + c|}{\sqrt{a^2 + b^2}}\). In the case of the model defined above (8.1),
    the numerator is equal to 1 and the norm is that of \(\mathbf{w}\). Thus, the
    final problem is the following:


    ```

    \(\text{argmin}_{\mathbf{w}, b} \frac{1}{2} \|\mathbf{w}\|^2 \quad \text{s.t.
    } y_i \sum_{k=1}^K w_k x_{i,k} + b \ge 1.\) (8.2)

    ```


    The dual form of this program (see chapter 5 in Boyd and Vandenberghe (2004))
    is


    ```

    \(L(\mathbf{w}, b, \boldsymbol{\lambda}) = \frac{1}{2} \|\mathbf{w}\|^2 + \sum_{i=1}^I
    \lambda_i \, y_i \sum_{k=1}^K w_k x_{i,k} + b - 1 \quad ,\) (8.3)

    ```


    where either \(\lambda_i = 0\) or \(y_i \sum_{k=1}^K w_k x_{i,k} + b = 1\). Thus,
    only some points will matter in the solution (the so-called support vectors).
    The first order conditions impose that the derivatives of this Lagrangian be null:


    ```

    \(\frac{\partial L}{\partial \mathbf{w}} L(\mathbf{w}, b, \boldsymbol{\lambda})
    = \mathbf{0} , \qquad \frac{\partial L}{\partial b} L(\mathbf{w}, b, \boldsymbol{\lambda})
    = 0 ,\)

    ```'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'where the first condition leads to


    \(\mathbf{w}^* = \sum_{i=1}^I \lambda_i y_i \mathbf{x}_i.\)


    This solution is indeed a linear form of the features, but only some points are
    taken into account. They are those for which the inequalities (8.1) are equalities.


    Naturally, this problem becomes infeasible whenever the condition cannot be satisfied,
    that is, when a simple line cannot perfectly separate the labels, no matter the
    choice of coefficients. This is the most common configuration and datasets are
    then called logically *not linearly separable*. This complicates the process but
    it is possible to resort to a trick. The idea is to introduce some flexibility
    in (8.1) by adding correction variables that allow the conditions to be met:


    \(\begin{aligned} \sum_{k=1}^K w_k x_{i,k} + b \ge +1 - \xi_i & \quad \text{when
    } y_i = +1 \\ \sum_{k=1}^K w_k x_{i,k} + b \le -1 + \xi_i & \quad \text{when }
    y_i = -1, \end{aligned} \quad (8.4)\)


    where the novelties, the \(\xi_i\) are positive so-called ‘slack’ variables that
    make the conditions feasible. They are illustrated in Figure 8.2. In this new
    configuration, there is no simple linear model that can perfectly discriminate
    between the two classes.


    ![](img/8861a37f775d09b4ba7a5151f604d9f5_145_0.png)


    **FIGURE 8.2:** Diagram of binary classification with SVM - linearly inseparable
    data.


    The optimization program then becomes


    \(\underset{\mathbf{w},b,\xi}{\text{argmin}} \frac{1}{2}||\mathbf{w}||^2 + C \sum_{i=1}^I
    \xi_i \quad \text{s.t.} \quad y_i \sum_{k=1}^K w_k \phi(x_{i,k}) + b \ge 1 - \xi_i
    \quad \text{and} \quad \xi_i \ge 0, \quad \forall i \} , \quad (8.5)\)


    where the parameter \(C > 0\) tunes the cost of mis-classification: as \(C\) increases,
    errors become more penalizing.


    In addition, the program can be generalized to nonlinear models, via the kernel
    \(\phi\) which is applied to the input points \(x_{i,k}\). Nonlinear kernels can
    help cope with patterns that are more complex than straight lines (see Figure
    8.3). Common kernels can be polynomial, radial'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'or sigmoid. The solution is found using more or less standard techniques for
    constrained quadratic programs. Once the weights **w** and bias $b$ are set via
    training, a prediction for a new vector $\mathbf{x}_j$ is simply made by computing
    $\sum_{k=1}^K w_k \phi(x_{j,k}) + b$ and choosing the class based on the sign
    of the expression.


    ![](img/8861a37f775d09b4ba7a5151f604d9f5_146_0.png)


    FIGURE 8.3: Examples of nonlinear kernels.


    # 8.2 SVM for regression


    The ideas of classification SVM can be transposed to regression exercises but
    the role of the margin is different. One general formulation is the following


    $$\underset{\mathbf{w}, b, \xi}{\text{argmin}} \frac{1}{2}||\mathbf{w}||^2 + C
    \sum_{i=1}^I (\xi_i + \xi_i^*) \quad (8.6)$$\n\text{s.t. } \sum_{k=1}^K w_k \phi(x_{i,k})
    + b - y_i \le \epsilon + \xi_i \quad (8.7)$$\ny_i - \sum_{k=1}^K w_k \phi(x_{i,k})
    - b \le \epsilon + \xi_i^* \quad (8.8)$$\n\xi_i, \xi_i^* \ge 0, \quad \forall
    i, \quad (8.9)$$


    and it is illustrated in Figure 8.4. The user specifies a **margin** $\epsilon$
    and the model will try to find the linear (up to kernel transformation) relationship
    between the labels $y_i$ and the input $\mathbf{x}_i$. Just as in the classification
    task, if the data points are inside the strip, the slack variables $\xi_i$ and
    $\xi_i^*$ are set to zero. When the points violate the threshold, the objective
    function (first line of the code) is penalized. Note that setting a large $\epsilon$
    leaves room for more error. Once the model has been trained, a prediction for
    $\mathbf{x}_j$ is simply $\sum_{k=1}^K w_k \phi(x_{j,k}) + b$.'
