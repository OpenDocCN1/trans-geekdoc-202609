- pgno: 295
  md: "```\n```r\nntree = n_trees[j],      # Nb of random trees\n  mtry = 5)     \
    \         # Nb of predictors for each tree\nmse_RF[j] <- mean((predict(fit_temp,\
    \ testing_sample) - testing_sample$R1M_Usd)^2)\n}\nmse_RF\n```\n```\n\n# [1] 0.03967754\
    \ 0.03885924 0.03766900 0.03696370 0.03699772\n\nTrees are by definition random\
    \ so results can vary from test to test. Overall, large numbers of trees are preferable\
    \ and the reason is that each new tree tells a new story and diversifies the risk\
    \ of the whole forest. Some more technical details of why that may be the case\
    \ are outlined in the original paper by Breiman (2001).\n\nFor the last exercises,\
    \ we recycle the formula used in Chapter 6.\n\n```\n```r\ntree_2008 <- rpart(formula,\n\
    \  data = data_ml %>% filter(year(date) == 2008), # Data source: 2008\n  cp =\
    \ 0.001,\n  maxdepth = 2)\nrpart.plot(tree_2008)\n```\n```\n\nThe first splitting\
    \ criterion in Figure 18.10 is enterprise value (EV). EV is an indicator that\
    \ adjusts market capitalization by substracting debt and adding cash. It is a\
    \ more faithful account of the true value of a company. In 2008, the companies\
    \ that fared the least poorly were those with the highest EV (i.e., large, robust\
    \ firms).\n\n```\n```r\ntree_2009 <- rpart(formula,\n  data = data_ml %>% filter(year(date)\
    \ == 2009), # Data source: 2009\n  cp = 0.001,\n  maxdepth = 2)\nrpart.plot(tree_2009)\n\
    ```\n```\n\nIn 2009 (Figure 18.11), the firms that recovered the fastest were\
    \ those that experienced high volatility in the past (likely, downwards volatility).\
    \ Momentum is also very important: the firms with the lowest past returns are\
    \ those that rebound the fastest. This is a typical example of the momentum crash\
    \ phenomenon studied in Barroso and Santa-Clara (2015) and Daniel and Moskowitz\
    \ (2016). The rationale is the following: after a market downturn, the stocks\
    \ with the most potential for growth are those that have suffered the largest\
    \ losses. Consequently, the negative (short) leg of the momentum factor performs\
    \ very well, often\n\n![](img/8861a37f775d09b4ba7a5151f604d9f5_295_0.png)\n\n\
    # FIGURE 18.10: Tree for 2008."
  merge: -1
  img_proc: true
- pgno: 296
  md: "# 18.5 Chapter 8: the autoencoder model\n\nFirst, it is imperative to format\
    \ the inputs properly. To avoid any issues, we work with perfectly rectangular\
    \ data and hence restrict the investment set to the stocks with no missing points.\
    \ Dimensions must also be in the correct order.\n\n```\ndata_short <- data_ml\
    \ %>%\t # Shorter dataset\n  filter(stock_id %in% stock_ids_short) %>%\n  dplyr::select(c(\"\
    stock_id\", \"date\", features_short, \"R1M_Usd\"))\ndates <- unique(data_short$date)\t\
    \ # Vector of dates\n\nN <- length(stock_ids_short)\t # Dimension for assets\n\
    Tt <- length(dates)\t\t # Dimension for dates\nK <- length(features_short)\t #\
    \ Dimension for features\n\nfactor_data <- data_short %>%\t # Factor side data\n\
    \  dplyr::select(date, stock_id, R1M_Usd) %>%\n  spread(key = stock_id, value\
    \ = R1M_Usd) %>%\n  dplyr::select(-date) %>%\n  as.matrix()\n\nbeta_data <- array(unlist(data_short\
    \ %>%\t # Beta side data: beware the permutation below!\n    dplyr::select(-stock_id,\
    \ -date, -R1M_Usd)),\n  dim = c(N, Tt, K))\n\nbeta_data <- aperm(beta_data, c(2,1,3))\t\
    \ # Permutation\n```\n\nNext, we turn to the specification of the network, using\
    \ a functional API form.\n\n```\nmain_input <- layer_input(shape = c(N), name\
    \ = \"main_input\")\t # Main input: returns\nfactor_network <- main_input %>%\t\
    \ # Def of factor side network\n  layer_dense(units = 8, activation = \"relu\"\
    , name = \"layer_1-r\") %>%\n  layer_dense(units = 4, activation = \"tanh\", name\
    \ = \"layer_2-r\")\n```\n\n![](img/8861a37f775d09b4ba7a5151f604d9f5_296_0.png)\n\
    \nFIGURE 18.11: Tree for 2009."
  merge: -1
  img_proc: true
- pgno: 297
  md: "```\naux_input <- layer_input(shape = c(N,K), name = \"aux_input\")  # Aux\
    \ input: characteristics\nbeta_network <- aux_input %>%  # Def of beta side network\n\
    \  layer_dense(units = 8, activation = \"relu\", name = \"layer_1_1\") %>% \n\
    \  layer_dense(units = 4, activation = \"tanh\", name = \"layer_2_1\") %>% \n\
    \  layer_permute(dims = c(2,1), name = \"layer_3_1\")  # Permutation!\nmain_output\
    \ <- layer_dot(c(beta_network, factor_network),  # Product of 2 networks\n   \
    \                    axes = 1, name = \"main_output\")\nmodel_ae <- keras_model(\n\
    \  inputs = c(main_input, aux_input),\n  outputs = c(main_output)\n)\n```\n\n\
    Finally, we ask for the structure of the model, and train it.\n\n```\nsummary(model_ae)\
    \  # See model details / architecture\n## -------------------------------------------------------------------\n\
    ## Layer (type)                 Output Shape         Param #   Connected to\n\
    ## ============================================================================\n\
    ## aux_input (InputLayer)       (None, 793, 7)       0\n## -------------------------------------------------------------------\n\
    ## layer_1_1 (Dense)            (None, 793, 8)       64        aux_input[0][0]\n\
    ## -------------------------------------------------------------------\n## main_input\
    \ (InputLayer)      (None, 793)          0\n## -------------------------------------------------------------------\n\
    ## layer_2_1 (Dense)            (None, 793, 4)       36        layer_1_1[0][0]\n\
    ## -------------------------------------------------------------------\n## layer_1_R\
    \ (Dense)            (None, 8)            6352      main_input[0][0]\n## -------------------------------------------------------------------\n\
    ## layer_3_1 (Permute)          (None, 4, 793)       0        layer_2_1[0][0]\n\
