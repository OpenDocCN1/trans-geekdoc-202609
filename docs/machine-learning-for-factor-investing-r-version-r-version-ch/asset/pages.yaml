  md: 'Higher order moments of returns are sometimes used (skewness and kurtosis),
    but they are far less common. We refer for instance to Harvey et al. (2010) for
    one method that takes them into account in the portfolio construction process.


    For some people, the volatility is an incomplete measure of risk. It can be argued
    that it should be decomposed into ‘good’ volatility (when prices go up) versus
    ‘bad’ volatility when they go down. The downward semi-variance is computed as
    the variance taken over the negative returns:


    \(\sigma_{-}^2 \approx \frac{1}{\text{card}(r_t < 0)} \sum_{t=1}^T (r_t - \mu)^2
    1_{\{r_t < 0\}}.\)


    The average return and the volatility are the typical moment-based metrics used
    by practitioners. Other indicators rely on different aspects of the distribution
    of returns with a focus on tails and extreme events. The **Value-at-Risk** (VaR)
    is one such example. If \(F_r\) is the empirical cdf of returns, the VaR at a
    level of confidence \(\alpha\) (often taken to be 95%) is


    \(\text{VaR}_\alpha(\mathbf{r}_t) = F_r(1 - \alpha).\)


    It is equal to the realization of a bad scenario (of return) that is expected
    to happen \((1 - \alpha)\%\) of the time on average. An even more conservative
    measure is the so-called **Conditional Value at Risk** (CVaR), also known as expected
    shortfall, which computes the average loss of the worst \((1 - \alpha)\%\) scenarios.
    Its empirical evaluation is


    \(\text{CVaR}_\alpha(\mathbf{r}_t) = \frac{1}{\text{Card}(r_t < \text{VaR}_\alpha(\mathbf{r}_t))}
    \sum_{r_t < \text{VaR}_\alpha(\mathbf{r}_t)} r_t.\)


    Going crescendo in the severity of risk measures, the ultimate evaluation of loss
    is the **maximum drawdown**. It is equal to the maximum loss suffered from the
    peak value of the strategy. If we write \(P_t\) for the time-\(t\) value of a
    portfolio, the drawdown is


    \(D_T^P = \max_{0 \le t \le T} P_t - P_T,\)


    and the maximum drawdown is


    \(MD_T^P = \max_{0 \le s \le T} \max_{0 \le t \le s} P_t - P_s, 0 .\)


    This quantity evaluates the greatest loss over the time frame \([0, T]\) and is
    thus the most conservative risk measure of all.


