    There is a nice economic intuition behind the above results which justifies the
    term "sparse hedging". We take the case of the minimum variance portfolio, for
    which \(\boldsymbol{\mu} = \mathbf{1}\). In Equation (5.10), we try to explain
    the return of asset 1 with that of all other assets. In the above equation, up
    to a scaling constant, the portfolio has a unit position in the first asset and
    \(-\hat{\beta}_1\) positions in all other assets. Hence, the purpose of all other
    assets is clearly to hedge the return of the first one. In fact, these positions
    are aimed at minimizing the squared errors of the aggregate portfolio for the
    first asset (these errors are exactly \(\mathbf{e}_1\)). Moreover, the scaling
    factor \(\sigma_1^{-2}\) is also simple to interpret: the more we trust the regression
    output (because of a small \(\sigma_1^2\)), the more we invest in the hedging
    portfolio of the asset.


    This reasoning is easily generalized for any line of \(\Sigma^{-1}\), which can
    be obtained by regressing the returns of asset \(i\) on the returns of all other
    assets. If the allocation scheme has the form (5.8) for given values of \(\boldsymbol{\mu}\),
    then the pseudo-code for the sparse portfolio strategy is the following.


