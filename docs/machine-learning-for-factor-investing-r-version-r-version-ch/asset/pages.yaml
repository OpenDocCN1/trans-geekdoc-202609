    # FIGURE 14.2: Output of the causal impact study.


    Below, we copy and paste the report generated by the function (obtained by the
    commented line in the above code). The conclusions do not support a marked effect
    of the crisis on the model probably because the signs of the error in the post
    period constantly change sign.


    During the post-intervention period, the response variable had an average value
    of approx. 0.016. In the absence of an intervention, we would have expected an
    average response of 0.031. The 95% interval of this counterfactual prediction
    is [-0.0059, 0.063]. Subtracting this prediction from the observed response yields
    an estimate of the causal effect the intervention had on the response variable.
    This effect is -0.015 with a 95% interval of [-0.047, 0.022].


    Summing up the individual data points during the post-intervention period (which
    can only sometimes be meaningfully interpreted), the response variable had an
    overall value of 1.64. Had the intervention not taken place, we would have expected
    a sum of 3.09. The 95% interval of this prediction is [-0.59, 6.34]. The above
    results are given in terms of absolute numbers. In relative terms, the response
    variable showed a decrease of -47%. The 95% interval of this percentage is [-152%,
    +72%].


    This means that, although it may look as though the intervention has exerted a
    negative effect on the response variable when considering the intervention period
    as a whole, this effect is not statistically significant, and so cannot be meaningfully
    interpreted. The apparent effect could be the result of random fluctuations that
    are unrelated to the intervention. This is often the case when the intervention
    period is very long and includes much of the time when the effect has already
    worn off. It can also be the case when the intervention period is too short to
    distinguish the signal from the noise. Finally, failing to find a significant
    effect can'
