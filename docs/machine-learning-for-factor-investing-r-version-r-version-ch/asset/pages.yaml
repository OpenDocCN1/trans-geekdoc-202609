- pgno: 89
  md: '# # Tree-based methods


    Classification and regression trees are simple yet powerful clustering algorithms
    popularized by the monograph of Breiman et al. (1984). Decision trees and their
    extensions are known to be quite efficient forecasting tools when working on tabular
    data. A large proportion of winning solutions in ML contests (especially on the
    Kaggle website1) resort to improvements of simple trees. For instance, the meta-study
    in bioinformatics by Olson et al. (2018) finds that boosted trees and random forests
    are the top 2 algorithms from a group of 13, excluding neural networks.


    Recently, the surge in Machine Learning applications in Finance has led to multiple
    publications that use trees in portfolio allocation problems. A long, though not
    exhaustive, list includes: Ballings et al. (2015), Patel et al. (2015a), Patel
    et al. (2015b), Moritz and Zimmermann (2016), Krauss et al. (2017), Gu et al.
    (2020b), Guida and Coqueret (2018a), Coqueret and Guida (2020) and Simonian et
    al. (2019). One notable contribution is Bryzgalova et al. (2019b) in which the
    authors create factors from trees by sorting portfolios via simple trees, which
    they call _Asset Pricing Trees_.


    In this chapter, we review the methodologies associated to trees and their applications
    in portfolio choice.


    # ## 6.1 Simple trees


    # ### 6.1.1 Principle


    Decision trees seek to partition datasets into **homogeneous clusters**. Given
    an exogenous variable **Y** and features **X**, trees iteratively split the sample
    into groups (usually two at a time) which are as homogeneous in **Y** as possible.
    The splits are made according to one variable within the set of features. A short
    word on nomenclature: when **Y** consists of real numbers, we talk about _regression
    trees_ and when **Y** is categorical, we use the term _classification trees_.


    Before formalizing this idea, we illustrate this process in Figure 6.1. There
    are 12 stars with three features: color, size and complexity (number of branches).


    The dependent variable is the color (let''s consider the wavelength associated
    to the color for simplicity). The first split is made according to size or complexity.
    Clearly, complexity is the better choice: complicated stars are blue and green,
    while simple stars are yellow, orange and red. Splitting according to size would
    have mixed blue and yellow stars (small ones) and green and orange stars (large
    ones).'
