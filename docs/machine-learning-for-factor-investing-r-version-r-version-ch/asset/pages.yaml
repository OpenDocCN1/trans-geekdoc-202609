    ## Tree -0.069388482

    ## RF 1.323525884

    ## XGB -0.001401754

    ## NN 0.406693431


    Because of the high correlations, the optimal weights are not balanced and diversified:
    they load heavily on the random forest learner (best in sample model) and ‘short’
    a few models in order to compensate. As one could expect, the model with the largest
    negative weights (Pen_reg) has a very high correlation with the random forest
    algorithm (0.997).


    Note that the weights are of course computed with training errors. The optimal
