  md: "An intuitive prediction for $y_i$ is the following weighted average:\n\n$$\\\
    hat{y}_i = \\frac{\\sum_{j \\neq i} h(D(\\mathbf{x}_j, \\mathbf{x}_i))y_j}{\\\
    sum_{j \\neq i} h(D(\\mathbf{x}_j, \\mathbf{x}_i))},$$\n\nwhere $h$ is a decreasing\
    \ function. Thus, the further $\\mathbf{x}_j$ is from $\\mathbf{x}_i$, the smaller\
    \ the weight in the average. A typical choice for $h$ is $h(z) = e^{-az}$ for\
    \ some parameter $a > 0$ that determines how penalizing the distance $D(\\mathbf{x}_j,\
    \ \\mathbf{x}_i)$ is. Of course, the average can be taken in the set of $k$ nearest\
    \ neighbors, in which case the $h$ is equal to zero beyond a particular distance\
    \ threshold:\n\n$$\\hat{y}_i = \\frac{\\sum_{j \\in \\text{neighbor}} h(D(\\mathbf{x}_j,\
    \ \\mathbf{x}_i))y_j}{\\sum_{j \\in \\text{neighbor}} h(D(\\mathbf{x}_j, \\mathbf{x}_i))}.$$\n\
    \nA more agnostic rule is to take $h := 1$ over the set of neighbors and in this\
    \ case, all neighbors have the same weight (see the old discussion by Bailey and\
    \ Jain (1978) in the case of classification). For classification tasks, the procedure\
    \ involves a voting rule whereby the class with the most votes wins the contest,\
    \ with possible tie-breaking methods. The interested reader can have a look at\
    \ the short survey in Bhatia et al. (2010).\n\nFor the choice of optimal $k$,\
    \ several complicated techniques and criteria exist (see, e.g., Ghosh (2006) and\
    \ Hall et al. (2008)). Heuristic values often do the job pretty well. A rule of\
    \ thumb is that $k = \\sqrt{I}$ ($I$ being the total number of instances) is not\
    \ too far from the optimal value, unless $I$ is exceedingly large.\n\nBelow, we\
    \ illustrate this concept. We pick one date (31th of December 2006) and single\
    \ out one asset (with stock\\_id equal to 13). We then seek to find the $k = 30$\
    \ stocks that are the closest to this asset at this particular date. We resort\
