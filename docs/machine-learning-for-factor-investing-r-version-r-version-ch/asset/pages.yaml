    In the spirit of factor models, performance can also be assessed through the lens
    of exposures. If we recall the original formulation from Equation (3.1):


    \(r_{t,n} = \alpha_n + \sum_{k=1}^K \beta_{t,k,n} f_{t,k} + \epsilon_{t,n},\)


    then the estimated \(\hat{\alpha}_n\) is the performance that cannot be explained
    by the other factors.'
