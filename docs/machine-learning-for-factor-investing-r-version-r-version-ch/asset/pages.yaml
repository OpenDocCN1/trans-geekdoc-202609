    One consequence of backtest overfitting is that it is illusory to hope for the
    same Sharpe ratios in live trading as those obtained in the backtest. Reasonable
    professionals divide the Sharpe ratio by two at least (Harvey and Liu (2015),
    Suhonen et al. (2017)). In Bailey and de Prado (2014), the authors even propose
    a statistical test for Sharpe ratios, provided that some metrics of all tested
