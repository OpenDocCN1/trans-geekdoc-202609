  md: "The second way to enforce instance weighting is via random sampling. If instances\
    \ have weights $w_i$, then the training of learners can be performed over a sample\
    \ that is randomly extracted with distribution equal to $w_i$. In this case, an\
    \ instance with a larger weight will have more chances to be represented in the\
    \ training sample. The original adaboost algorithm relies on this method.\n\n\
    # 6.3.2 Illustration\n\nBelow, we test an implementation of the original Adaboost\
    \ classifier. As such, we work with the R1M_Usd_C variable and change the model\
    \ formula. The computational cost of Adaboost is high on large datasets, thus\
    \ we work with a smaller sample and we only impose three iterations.\n\n```\n\
    library(fastAdaBoost)\nsubsample <- (1:52000)*4\nfit_adaboost_C <- adaboost(formula_C,\n\
    \                           data = data.frame(training_sample[subsample,]),\n\
    \                           nIter = 3)\n# Adaboost package\n# Target small sample\n\
    # Model spec.\n# Data source\n# Number of trees\n```\n\nFinally, we evaluate the\
    \ performance of the classifier.\n\n```\nmean(testing_sample$R1M_Usd_C == predict(fit_adaboost_C,\
    \ testing_sample)$class)\n```\n\n```\n## [1] 0.5028202\n```\n\nThe accuracy (as\
    \ evaluated by the hit ratio) is clearly not satisfactory. One reason for this\
    \ may be the restrictions we enforced for the training (smaller sample and only\
    \ three trees).\n\n# 6.4 Boosted trees: extreme gradient boosting\n\nThe ideas\
    \ behind tree boosting were popularized, among others, by Mason et al. (2000),\
    \ Friedman (2001), and Friedman (2002). In this case, the combination of learners\
    \ (prediction tools) is not agnostic as in random forest, but adapted (or optimized)\
    \ at the learner level. At each step s, the sum of models \\( M_S = \\sum_{s=1}^{S-1}\
    \ m_s + m_S \\) is such that the last learner \\( m_S \\) was precisely designed\
    \ to reduce the loss of \\( M_S \\) on the training sample.\n\nBelow, we follow\
    \ closely the original work of Chen and Guestrin (2016) because their algorithm\
    \ yields incredibly accurate predictions and also because it is highly customizable.\
    \ It is their implementation that we use in our empirical section. The other popular\
    \ alternative is lightgbm (see Ke et al. (2017)). What XGBoost seeks to minimize\
    \ is the objective\n\n```\n\\( O = \\underbrace{\\sum_{i=1}^{I} \\text{loss}(y_i,\
    \ \\tilde{y}_i)}_{\\text{error term}} + \\underbrace{\\sum_{j=1}^{J} \\Omega(T_j)}_{\\\
    text{regularization term}} \\) .\n```\n\nThe first term (over all instances) measures\
    \ the distance between the true label and the output from the model. The second\
    \ term (over all trees) penalizes models that are too complex."
