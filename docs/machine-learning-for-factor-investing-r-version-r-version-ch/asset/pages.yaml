    The original formulation was given by Wolpert (1992a) but we also recommend a
    look at the more recent reference Ho and Pepyne (2002). There are in fact several
    theorems and two of them can be found in Wolpert and Macready (1997).


    The statement of the theorem is very abstract and requires some notational conventions.
    We assume that any training sample $S = \{(\mathbf{x}_1, y_1), \dots, (\mathbf{x}_I,
