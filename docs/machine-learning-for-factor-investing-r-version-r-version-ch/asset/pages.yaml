  md: "the past 6 months Granger-causes 1 month ahead returns for one particular stock\
    \ (the first in the sample).\n\n```\nlibrary(lmtest)\nx_granger <- training_sample\
    \ %>%\n  filter(stock_id == 1) %>%   # ... stock nb 1\n  pull(Mkt_Cap_GM_Usd)\
    \        # ... & Market cap\ny_granger <- training_sample %>%\n  filter(stock_id\
    \ == 1) %>%   # ... stock nb 1\n  pull(RIM_Usd)               # ... & 1M return\n\
    fit_granger <- grangertest(x_granger,\n                           y_granger,\n\
    \                           order = 6,\n                           na.action =\
    \ na.omit)\nfit_granger\n```\n\n```\n### Granger causality test\n###\n### Model\
    \ 1: y_granger ~ Lags(y_granger, 1:6) + Lags(x_granger, 1:6)\n### Model 2: y_granger\
    \ ~ Lags(y_granger, 1:6)\n### Res.Df Df F Pr(>F)\n### 1     149\n### 2     155\
    \  -6  4.111 0.0007554 ***\n### ---\n### Signif. codes:  0 '***' 0.001 '**' 0.01\
    \ '*' 0.05 '.' 0.1 ' ' 1\n```\n\nThe test is directional and only tests if X Granger-causes\
    \ Y. In order to test the reverse effect, it is required to inverse the arguments\
    \ in the function. In the output above, the p-value is very low, hence the probability\
    \ of observing samples similar to ours knowing that H0 holds is negligible. Thus\
    \ it seems that market capitalization does Granger-cause one-month returns. We\
    \ nonetheless underline that Granger causality is arguably weaker than the one\
    \ defined in the next subsection. A process that Granger-causes another one simply\
    \ contains useful predictive information, which is not proof of causality in a\
    \ strict sense. Moreover, our test is limited to a linear model and including\
    \ nonlinearities may alter the conclusion. Lastly, including other regressors\
    \ (possibly omitted variables) could also change the results (see, e.g., Chow\
    \ et al. (2002)).\n\n# 14.1.2 Causal additive models\n\nThe zoo of causal model\
    \ encompasses a variety of beasts (even BARTs from Section 9.5 are used for this\
    \ purpose in Hahn et al. (2019)). The interested reader can have a peek at Pearl\
    \ (2009), Peters et al. (2017), Maathuis et al. (2018) and Hühnermund and Bareinboim\
    \ (2019) and the references therein. One central tool in causal models is the\
    \ do-calculus developed by Pearl. Whereas traditional probabilities P[Y|X] link\
    \ the odds of Y conditionally on observing X take some value x, the do(.) forces\
    \ X to take value x. This is a looking versus doing dichotomy. One classical example\
    \ is the following. Observing a barometer gives a clue what the weather will be\
    \ because high pressures are more often associated with sunny days:\n\nP[sunny\
    \ weather|barometer says \"high\"] > P[sunny weather|barometer says \"low\"],\n\
    \nbut if you hack the barometer (force it to display some value),\n\nP[sunny weather|barometer\
    \ hacked to \"high\"] = P[sunny weather|barometer hacked \"low\"],\n\nbecause\
    \ hacking the barometer will have no impact on the weather. In short notation,\
    \ when there is an intervention on the barometer, P[weather|do(barometer)] = P[weather].\
    \ This is"
  merge: -1
  img_proc: true
- pgno: 238
  md: 'an interesting example related to causality. The overarching variable is pressure.
    Pressure impacts both the weather and the barometer and this joint effect is called
    confounding. However, it may not be true that the barometer impacts the weather.
    The interested reader who wants to dive deeper into these concepts should have
    a closer look at the work of Judea Pearl. Do-calculus is a very powerful theoretical
    framework, but it is not easy to apply it to any situation or dataset (see for
    instance the book review Aronow and Sävje (2019)).


    While we do not formally present an exhaustive tour of the theory behind causal
    inference, we wish to show some practical implementations because they are easy
    to interpret. It is always hard to single out one type of model in particular
    so we choose one that can be explained with simple mathematical tools. We start
    with the simplest definition of a structural causal model (SCM), where we follow
    here chapter 3 of Peters et al. (2017). The idea behind these models is to introduce
    some hierarchy (i.e., some additional structure) in the model. Formally, this
    gives


    ```

    X = \epsilon_X

    Y = f(X, \epsilon_Y),

    ```


    where the \epsilon_X and \epsilon_Y are independent noise variables. Plainly,
    a realization of X is drawn randomly and has then an impact on the realization
    of Y via f. Now this scheme could be more complex if the number of observed variables
    was larger. Imagine a third variable comes in so that


    ```

    X = \epsilon_X

    Y = f(X, \epsilon_Y),

    Z = g(Y, \epsilon_Z)

    ```


    In this case, X has a causation effect on Y and then Y has a causation effect
    on Z. We thus have the following connections:


    ![](img/8861a37f775d09b4ba7a5151f604d9f5_238_0.png)


    The above representation is called a graph and graph theory has its own nomenclature,
    which we very briefly summarize. The variables are often referred to as _vertices_
    (or _nodes_), and the arrows as _edges_. Because arrows have a direction, they
    are called _directed_ edges. When two vertices are connected via an edge, they
    are called _adjacent_. A sequence of adjacent vertices is called a _path_, and
    it is directed if all edges are arrows. Within a directed path, a vertex that
    comes first is a parent node and the one just after is a child node.


    Graphs can be summarized by adjacency matrices. An adjacency matrix \mathbf{A}
    = A_{ij} is a matrix filled with zeros and ones. A_{ij} = 1 whenever there is
    an edge from vertex i to vertex j. Usually, self-loops (X \rightarrow X) are prohibited
    so that adjacency matrices have zeros on the diagonal. If we adjacency consider
    a simplified version of the above graph like X \rightarrow Y \rightarrow Z, the
    corresponding adjacency matrix is


    | 0 | 1 | 0 |

    |---|---|---|

    | 0 | 0 | 1 |

    | 0 | 0 | 0 |'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'where letters $X, Y$, and $Z$ are naturally ordered alphabetically. There are
    only two arrows: from $X$ to $Y$ (first row, second column) and from $Y$ to $Z$
    (second row, third column).


    A **cycle** is a particular type of path that creates a loop, i.e., when the first
    vertex is also the last. The sequence $X \rightarrow Y \rightarrow Z \rightarrow
    X$ is a cycle. Technically, cycles pose problems. To illustrate this, consider
    the simple sequence $X \rightarrow Y \rightarrow X$. This would imply that a realization
    of $X$ causes $Y$ which in turn would cause the realization of $Y$. While Granger
    causality can be viewed as allowing this kind of connection, general causal models
    usually avoid cycles and work with **directed acyclic graphs** (DAGs). Formal
    graph manipulations (possibly linked to do-calculus) can be computed via the *causaleffect*
    package Tikka and Karvanen (2017). Direct acyclic graphs can also be created and
    manipulated with the *dagitty* (textor2016robust) and *ggdag* packages.


    Equipped with these tools, we can explicitize a very general form of models:


    $X_j = f_j \mathbf{X}_{\text{pa}_D(j)}, \epsilon_j \quad (14.1)$


    where the noise variables are mutually independent. The notation $\text{pa}_D(j)$
    refers to the set of parent nodes of vertex $j$ within the graph structure $D$.
    Hence, $X_j$ is a function of all of its parents and some noise term $\epsilon_j$.
    An additive causal model is a mild simplification of the above specification:


    $X_j = \sum_{k \in \text{pa}_D(j)} f_{j,k}(\mathbf{X}_k) + \epsilon_j \quad (14.2)$


    where the nonlinear effect of each variable is cumulative, hence the term ‘additive’.
    Note that there is no time index there. In contrast to Granger causality, there
    is no natural ordering. Such models are very complex and hard to estimate. The
    details can be found in Bühlmann et al. (2014). Fortunately, the authors have
    developed an R package that determines the DAG $D$.


    Below, we build the adjacency matrix pertaining to the small set of predictor
    variables plus the 1-month ahead return (on the training sample). We use the *CAM*
    package which has a very simple syntax.$^1$


    ```

    library(CAM)                     # Activate the package

    data_caus <- training_sample %>% dplyr::select(c("R1M_Usd", features_short))

    fit_cam <- CAM(data_caus)        # The main function

    fit_cam$Adj                      # Showing the adjacency matrix

    ```


    ```

    ## 8 x 8 sparse Matrix of class "dgCMatrix"

    ##

    ## [1,] . 1 1 1 1 1 1 1

    ## [2,] . . . 1 . . 1 .

    ## [3,] . 1 . 1 . . 1 1

    ## [4,] . . . . . . . .

    ## [5,] . 1 1 . 1 . 1 1

    ## [6,] . 1 1 1 . 1 1 1

    ## [7,] . . 1 . . . . .

    ## [8,] . 1 . 1 . . 1 .

    ```


    $^1$The CAM package was removed from CRAN in November 2019 but can still be installed
    manually. First, download the content of the package: https://cran.r-project.org/web/packages/CAM/index.html.
    Second, copy it in the directory obtained by typing `.libPaths()` in the console.'
