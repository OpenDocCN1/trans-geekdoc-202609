  md: '# 12.4.3 Simple safeguards


    As is mentioned at the beginning of the chapter, two common sense references for
    backtesting are Fabozzi and de Prado (2018) and Arnott et al. (2019b). The pieces
    of advice provided in these two articles are often judicious and thoughtful.


    One additional comment pertains to the output of the backtest. One simple, intuitive
    and widespread metric is the transaction cost-adjusted Sharpe ratio defined in
    Equation (12.4). In the backtest, let us call \(SR^B_{TC}\) the corresponding
    value for the benchmark, which we like to define as the equally-weighted portfolio
    of all assets in the trading universe (in our dataset, roughly one thousand US
    equities). If the \(SR^P_{TC}\) of the best strategy is above \(2 \times SR^B_{TC}\),
    then there is probably a glitch somewhere in the backtest.


    This criterion holds under two assumptions:


    +   1) a sufficiently long enough out-of-sample period and


    +   2) long-only portfolios.


    It is unlikely that any realistic strategy can outperform a solid benchmark by
    a very wide margin over the long term. Being able to improve the benchmark’s annualized
    return by 150 basis points (with comparable volatility) is already a great achievement.
    Backtests that deliver returns more than 5% above those of the benchmark are dubious.


    # 12.5 Implication of non-stationarity: forecasting is hard


    This subsection is split into two parts: in the first, we discuss the reason that
    makes forecasting such a difficult task and in the second we present an important
    theoretical result originally developed towards machine learning but that sheds
    light on any discipline confronted with out-of-sample tests. An interesting contribution
    related to this topic is the study from Farmer et al. (2019). The authors assess
    the predictive fit of linear models through time: they show that the fit is strongly
    varying: sometimes the model performs very well, sometimes, not so much. There
    is no reason why this should not be the case for ML algorithms as well.


    # 12.5.1 General comments


    The careful reader must have noticed that throughout Chapters 5 to 11, the performance
    of ML engines is underwhelming. These disappointing results are there on purpose
    and highlight the crucial truth that machine learning is no panacea, no magic
    wand, no philosopher’s stone that can transform data into golden predictions.
    Most ML-based forecasts fail. This is in fact not only true for very well enhanced
    and sophisticated techniques, but also for simpler econometric approaches (Dichtl
    et al. (2020a)), which again underlines the need to replicate results to challenge
    their validity.


