- pgno: 275
  md: 'where \( B(\boldsymbol{\alpha}) \) is the multinomial beta function:


    \( B(\boldsymbol{\alpha}) = \frac{\prod_{n=1}^N \Gamma(\alpha_n)}{\Gamma \sum_{n=1}^N
    \alpha_n} . \)


    If we set \( \pi = \pi_\alpha = f_\alpha \), the link with factors or characteristics
    can be coded through \( \alpha \) via a linear form:


    (\text{F1}) \( \alpha_{n,t} = \theta_{0,t} + \sum_{k=1}^K \theta_t^{(k)} x_{t,n}^{(k)},
    \qquad (16.19) \)


    which is highly tractable, but may violate the condition that \( \alpha_{n,t}
    > 0 \) for some values of \( \theta_{k,t} \). Indeed, during the learning process,
    an update in \( \theta \) might yield values that are out of the feasible set
    of \( \alpha_t \). In this case, it is possible to resort to a trick that is widely
    used in online learning (see, e.g., section 2.3.1 in Hoi et al. (2018)). The idea
    is simply to find the acceptable solution that is closest to the suggestion from
    the algorithm. If we call \( \theta^* \) the result of an update rule from a given
    algorithm, then the closest feasible vector is


    \( \theta = \min_{z \in \Theta(x_t)} ||\theta^* - z||^2, \qquad (16.20) \)


    where \( ||\cdot|| \) is the Euclidean norm and \( \Theta(x_t) \) is the feasible
    set, that is, the set of vectors \( \theta \) such that the \( \alpha_{n,t} =
    \theta_{0,t} + \sum_{k=1}^K \theta_t^{(k)} x_{t,n}^{(k)} \) are all non-negative.


    A second option for the form of the policy, \( \pi_{\theta_t}^2 \), is slightly
    more complex but remains always valid (i.e., has positive \( \alpha_{n,t} \) values):


    (\text{F2}) \( \alpha_{n,t} = \exp \ \theta_{0,t} + \sum_{k=1}^K \theta_t^{(k)}
    x_{t,n}^{(k)} \ , \qquad (16.21) \)


    which is simply the exponential of the first version. With some algebra, it is
    possible to derive the policy gradients. The policies \( \pi_{\theta_t}^j \) are
    defined by the Equations (Fj) above. Let \( F \) denote the digamma function.
    Let \( \mathbf{1} \) denote the \( \mathbb{R}^N \) vector of all ones. We have


    \(\frac{\nabla_{\theta_t} \pi_{\theta_t}^1}{\pi_{\theta_t}^1} = \sum_{n=1}^N (F
    (\mathbf{1}'' \mathbf{X}_t \theta_t) - F (\mathbf{x}_{t,n} \theta_t) + \ln w_n)
    \mathbf{x}_{t,n}''\)

    \(\frac{\nabla_{\theta_t} \pi_{\theta_t}^2}{\pi_{\theta_t}^2} = \sum_{n=1}^N F
    \ 1'' e^{\mathbf{X}_t \theta_t} - F (e^{\mathbf{x}_{t,n} \theta_t}) + \ln w_n
    \ e^{\mathbf{x}_{t,n} \theta_t} \mathbf{x}_{t,n}''\)


    where \( e^{\mathbf{X}} \) is the element-wise exponential of a matrix \( \mathbf{X}
    \).


    The allocation can then either be made by direct sampling, or using the mean of
    the distribution \( (\mathbf{1}'' \alpha)^{-1} \alpha \). Lastly, a technical
    note: Dirichlet distributions can only be used for small portfolios because the
    scaling constant in the density becomes numerically intractable for large values
    of \( N \) (e.g., above 50).'
