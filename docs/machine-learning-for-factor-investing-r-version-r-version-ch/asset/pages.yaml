- pgno: 154
  md: "This expression has two parts: the Gaussian component which relates mostly\
    \ to **b**, and the inverse gamma component, entirely dedicated to $\\sigma$.\
    \ The mix between the prior and the data is clear. The posterior covariance matrix\
    \ of the Gaussian part ($\\boldsymbol{\\Lambda}_*$) is the sum between the prior\
    \ and a quadratic form from the data. The posterior mean **b**<sub>∗</sub> is\
    \ a weighted average of the prior **b**<sub>0</sub> and the sample estimator $\\\
    hat{\\mathbf{b}}$. Such blends of quantities estimated from data and a user-supplied\
    \ version are often called **shrinkages**. For instance, the original matrix of\
    \ cross-terms $\\mathbf{X}'\\mathbf{X}$ is shrunk towards the prior $\\boldsymbol{\\\
    Lambda}_0$. This can be viewed as a **regularization** procedure: the pure fit\
    \ originating from the data is mixed with some 'external' ingredient to give some\
    \ structure to the final estimation.\n\nThe interested reader can also have a\
    \ look at section 16.3 of Greene (2018) (the case of conjugate priors is treated\
    \ in subsection 16.3.2).\n\nThe formulae above can be long and risky to implement.\
    \ Luckily, there is an R package (`spBayes`) that performs Bayesian inference\
    \ for linear regression using the conjugate priors. Below, we provide one example\
    \ of how it works. To simplify the code and curtail computation times, we consider\
    \ two predictors: market capitalization (size anomaly) and price-to-book ratio\
    \ (value anomaly). In statistics, the **precision matrix** is the inverse of the\
    \ covariance matrix. In the parameters, the first two priors relate to the Gaussian\
    \ law and the last two to the inverse gamma distribution:\n\n\\(f_{\\text{invgamma}}(x,\
    \ \\alpha, \\beta) = \\frac{\\beta^\\alpha}{\\Gamma(\\alpha)} x^{-1-\\alpha} e^{-\\\
    frac{\\beta}{x}},\\)\n\nwhere \\(\\alpha\\) is the shape and \\(\\beta\\) is the\
    \ scale.\n\n```\nprior_mean <- c(0.01,0.1,0.1,0.1)      # Average value of parameters\
    \ (prior)\nprecision_mat <- diag(prior_mean^2) %>% solve()   # Inverse cov matrix\
    \ of parameters (prior)\nfit_lmBayes <- bayesLMConjugate(\n  RlM_Usd ~ Mkt_Cap3M_Usd\
    \ + Pb,       # Model: size and value\n  data = testing_sample,              #\
    \ Data source, here, the test sample\n  n.samples = 2000,                   #\
    \ Number of samples used\n  beta.prior.mean = prior_mean,       # Avg prior: size\
    \ & value rewarded & unit beta\n  beta.prior.precision = precision_mat, # Precision\
    \ matrix\n  prior.shape = 0.5,                  # Shape for prior distribution\
    \ of sigma\n  prior.rate = 0.5)                   # Scale for prior distribution\
    \ of sigma\n```\n\nIn the above specification, we must also provide a prior for\
    \ the constant. By default, we set its average value to 0.01, which corresponds\
    \ to a 1% average monthly return. Once the model has been estimated, we can plot\
    \ the distribution of coefficient estimates.\n\n```\nfit_lmBayes$p.beta.tau.sq.samples[1:3]\
    \ %>% as_tibble() %>% \n  `colnames<-`(c(\"Intercept\", \"Size\", \"Value\"))\
    \ %>% \ngather(key = coefficient, value = value) %>% \nggplot(aes(x = value, fill\
    \ = coefficient)) + geom_histogram(alpha = 0.5)\n```"
