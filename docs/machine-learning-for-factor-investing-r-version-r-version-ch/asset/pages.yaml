- pgno: 123
  md: '+   • iterations: the number of iterations can mean alternatively the ratio
    of sample size divided by batch size or this ratio multiplied by the number of
    epochs. It’s either the number of weight updates required to reach one epoch or
    the total number of updates during the whole training.


    When the batch is equal to only one instance, the method is referred to as ‘stochastic
    gradient descent’ (SGD): the instance is chosen randomly. When the batch size
    is strictly above one and below the total number of instances, the learning is
    performed via ‘mini’ batches, that is, small groups of instances. The batches
    are also chosen randomly, but without replacement in the sample because for one
    epoch, the union of batches must be equal to the full training sample.


    It is impossible to know in advance what a good number of epochs is. Sometimes,
    the network stops learning after just 5 epochs (the validation loss does not decrease
    anymore). In some cases when the validation sample is drawn from a distribution
    close to that of the training sample, the network continues to learn even after
    200 epochs. It is up to the user to test different values to evaluate the learning
    speed. In the examples below, we keep the number of epochs low for computational
    purposes.


    # ## 7.3.3 Penalizations and dropout


    At each level (layer), it is possible to enforce constraints or penalizations
    on the weights (and biases). Just as for tree methods, this helps slow down the
    learning to prevent overfitting on the training sample. Penalizations are enforced
    directly on the loss function and the objective function takes the form


    \(O = \sum_{i=1}^I \text{loss}(y_i, \hat{y}_t) + \sum_k \lambda_k ||\mathbf{W}_k||_1
    + \sum_j \delta_k ||\mathbf{W}_j||_2^2\),


    where the subscripts \(k\) and \(j\) pertain to the weights to which the \(L^1\)
    and (or) \(L^2\) penalization is applied.


    In addition, specific constraints can be enforced on the weights directly during
    the training. Typically, two types of constraints are used:


    +   • norm constraints: a maximum norm is fixed for the weight vectors or matrices;


    +   • non-negativity constraint: all weights must be positive or zero.


    Lastly, another (somewhat exotic) way to reduce the risk of overfitting is simply
    to reduce the size (number of parameters) of the model. Srivastava et al. (2014)
    propose to omit units during training (hence the term ‘dropout’). The weights
    of randomly chosen units are set to zero during training. All links from and to
    the unit are ignored, which mechanically shrinks the network. In the testing phase,
    all units are back, but the values (weights) must be scaled to account for the
    missing activations during the training phase.


    The interested reader can check the advice compiled in Bengio (2012) and Smith
    (2018) for further tips on how to configure neural networks. A paper dedicated
    to hyperparameter tuning for stock return prediction is Lee (2020).'
