    +   - Han et al. (2019) show with penalized regressions that 20 to 30 characteristics
    (out of 94) are useful for the prediction of monthly returns of US stocks. Their
    methodology is interesting: they regress returns against characteristics to build
    forecasts and then regress the returns on the forecast to assess if they are reliable.
    The latter regression uses a LASSO-type penalization (see Chapter 5) so that useless
    characteristics are excluded from the model. The penalization is extended to elasticnet
    in Rapach and Zhou (2019).


    +   - Kelly et al. (2019) and Kim et al. (2019) both estimate models in which
    factors are latent but loadings (betas) and possibly alphas depend on characteristics.
    Kirby (2020) generalizes the first approach by introducing regime-switching. In
    contrast, Lettau and Pelger (2020a) and Lettau and Pelger (2020b) estimate latent
    factors without any link to particular characteristics (and provide large sample
    asymptotic properties of their methods).


    +   - In the same vein as Hoechle et al. (2018), Gospodinov et al. (2019) and
    Bryzgalova (2019) and discuss potential errors that arise when working with portfolio
    sorts that yield long-short returns. The authors show that in some cases, tests
    based on this procedure may be deceitful. This happens when the characteristic
    chosen to perform the sort is correlated with an external (unobservable) factor.
    They propose a novel regression-based approach aimed at bypassing this problem.


    More recently and in a separate stream of literature, Koijen and Yogo (2019) have
    introduced a demand model in which investors form their portfolios according to
    their preferences towards particular firm characteristics. They show that this
    allows them to mimic the portfolios of large institutional investors. In their
    model, aggregate demands (and hence, prices) are directly linked to characteristics,
    not to factors. In a follow-up paper, Koijen et al. (2019) show that a few sets
    of characteristics suffice to predict future returns. They also show that, based
    on institutional holdings from the UK and the US, the largest investors are those
    who are the most influential in the formation of prices. In a similar vein, Betermier
    et al. (2019) derive an elegant (theoretical) general equilibrium model that generates
    some well-documented anomalies (size, book-to-market). The models of Arnott et
    al. (2014) and Ali and Titman (2019) are also able to theoretically generate known
    anomalies. Finally, in Martin and Nagel (2019), characteristics influence returns
    via the role they play in the predictability of dividend growth. This paper discussed
    the asymptotic case when the number of assets and the number of characteristics
    are proportional and both increase to infinity.


