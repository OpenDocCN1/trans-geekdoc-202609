    get the \(i^{th}\) line of \(\hat{\Sigma}^{-1}\):


    ```

    \(\hat{\Sigma}^{-1}_{i \cdot} = \text{argmin}_{\beta_{i|i}} \left\{ \sum_{t=1}^T
    \left( r_{i,t} - a_i + \sum_{n \neq i}^N \beta_{i|n} r_{n,t} \right)^2 + \lambda\alpha||\beta_{i|}||_1
    + \lambda(1-\alpha)||\beta_{i|}||_2^2 \right\}\)

    ```


    +   2. to get the weights of asset \(i\), we compute the \(\boldsymbol{\mu}\)-weighted
    sum: \(w_i = \sigma_i^{-2} \mu_i - \sum_{j \neq i} \beta_{i|j} \mu_j ,\)'
