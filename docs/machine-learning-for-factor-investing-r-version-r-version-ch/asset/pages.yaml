- pgno: 219
  md: 'This chapter is dedicated to the techniques that help understand the way models
    process inputs into outputs. A recent book (Molnar (2019) available at https://christophm.github.io/interpretable-ml-book/)
    is entirely devoted to this topic and we highly recommend to have a look at it.
    Another more introductory and less technical reference is Hall and Gill (2019).
    Obviously, in this chapter, we will adopt a tone which is factor-investing orientated
    and discuss examples related to ML models trained on a financial dataset.


    Quantitative tools that aim for interpretability of ML models are required to
    satisfy two simple conditions:


    +   1. That they provide information about the model.

    +   2. That they are highly comprehensible.


    Often, these tools generate graphical outputs which are easy to read and yield
    immediate conclusions.


    In attempts to white-box complex machine learning models, one dichotomy stands
    out:


    +   • **Global models** seek to determine the relative role of features in the
    construction of the predictions once the model has been trained. This is done
    at the global level, so that the patterns that are shown in the interpretation
    hold *on average* over the whole training set.

    +   • **Local models** aim to characterize how the model behaves around one particular
    instance by considering small variations around this instance. The way these variations
    are processed by the original model allows to simplify it by approximating it,
    e.g., in a linear fashion. This approximation can for example determine the sign
    and magnitude of the impact of each relevant feature in the vicinity of the original
    instance.


    Molnar (2019) proposes another classification of interpretability solutions by
    splitting interpretations that depend on one particular model (e.g., linear regression
    or decision tree) versus the interpretations that can be obtained for any kind
    of model. In the sequel, we present the methods according to the global versus
    local dichotomy.'
  merge: -1
  img_proc: true
- pgno: 220
  md: "# ## 13.1 Global interpretations\n\n# ### 13.1.1 Simple models as surrogates\n\
    \nLet us start with the simplest example of all. In a linear model,\n\n$$y_i =\
    \ \\alpha + \\sum_{k=1}^K \\beta_k x_i^k + \\epsilon_i,$$\n\nthe following elements\
    \ are usually extracted from the estimation of the $\\beta_k$:\n\n+   - the $R^2$,\
    \ which appreciates the **global fit** of the model (possibly penalized to prevent\
    \ overfitting with many regressors). The $R^2$ is usually computed in-sample;\n\
    +   - the sign of the estimates $\\hat{\\beta}_k$, which indicates the **direction**\
    \ of the impact of each feature $x^k$ on $y$;\n+   - the $t$-statistics $t_{\\\
    hat{\\beta}_k}$, which evaluate the **magnitude** of this impact: regardless of\
    \ its direction, large statistics in absolute value reveal prominent variables.\
    \ Often, the $t$-statistics are translated into $p$-values which are computed\
    \ under some suitable distributional assumptions.\n\nThe last two indicators are\
    \ useful because they inform the user on which features matter the most and on\
    \ the sign of the effect of each predictor. This gives a simplified view of how\
    \ the model processes the features into the output. Most tools that aim to explain\
    \ black boxes follow the same principles.\n\nDecision trees, because they easy\
    \ to picture, are also great models for interpretability. Thanks to this favorable\
    \ feature, they are target benchmarks for simple models. Recently, Vidal et al.\
    \ (2020) propose a method to reduce an ensemble of trees into a unique tree. The\
    \ aim is to propose a simpler model that behaves exactly like the complex one.\n\
    \nMore generally, it is an intuitive idea to resort to simple models to proxy\
    \ more complex algorithms. One simple way to do so is to build so-called **surrogate**\
    \ models. The process is simple:\n\n+   1. train the original model $f$ on features\
    \ **X** and labels **y**;\n+   2. train a simpler model $g$ to explain the predictions\
    \ of the trained model $\\hat{f}$ given the features **X**:\n\n$$\\hat{f}(\\mathbf{X})\
    \ = g(\\mathbf{X}) + \\text{error}$$\n\nThe estimated model $\\hat{g}$ explains\
    \ how the initial model $\\hat{f}$ maps the features into the labels. To illustrate\
    \ this, we use the *iml* package (see Molnar et al. (2018)). The simpler model\
    \ is a tree with a depth of two.\n\n```\nlibrary(iml)\nmod <- Predictor$new(fit_RF,\n\
    \                 data = training_sample %>% dplyr::select(features))\ndt <- TreeSurrogate$new(mod,\
    \ maxdepth = 2)\nplot(dt)\n```"
  merge: -1
  img_proc: true
