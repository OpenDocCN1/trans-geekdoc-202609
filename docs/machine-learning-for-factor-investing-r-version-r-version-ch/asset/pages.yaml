- pgno: 152
  md: 'Once an initial value for $\mathbf{x}$ has been sampled ($\mathbf{x}_0$), each
    new iteration ($m$) of the simulation takes place in three stages:


    +   1. generate a candidate value $\mathbf{x}''_{m+1}$ from $p(\mathbf{x}|\mathbf{x}_m)$,


    +   2. compute the acceptance ratio \(\alpha = \min \frac{p(\mathbf{x}_{m+1})p(\mathbf{x}_m|\mathbf{x}_{m+1})}{p(\mathbf{x}_m)p(\mathbf{x}''_{m+1}|\mathbf{x}_m)}\)


    +   3. pick $\mathbf{x}_{m+1} = \mathbf{x}''_{m+1}$ with probability \(\alpha\)
    or stick with the previous value ($\mathbf{x}_{m+1} = \mathbf{x}_m$) with probability
    \(1 - \alpha\).


    The interpretation of the acceptance ratio is not straightforward in the general
    case. When the sampling generator is symmetric (\(p(\mathbf{x}|\mathbf{y}) = (\mathbf{y}|\mathbf{x})\)),
    the candidate is always chosen whenever \(p(\mathbf{x}''_{m+1}) \ge p(\mathbf{x}_m)\).
    If the reverse condition holds (\(p(\mathbf{x}''_{m+1}) < p(\mathbf{x}_m)\)),
    then the candidate is retained with odds equal to \(p(\mathbf{x}''_{m+1})/p(\mathbf{x}_m)\),
    which is the ratio of likelihoods. The more likely the new proposal, the higher
    the odds of retaining it.


    Often, the first simulations are discarded in order to leave time to the chain
    to converge to a high probability region. This procedure (often called ‘burn in’)
    ensures that the first retained samples are located in a zone that is likely,
    i.e., that they are more representative of the law we are trying to simulate.


    For the sake of brevity, we stick to a succinct presentation here, but some additional
    details are outlined in section 11.2 of Gelman et al. (2013) and in chapter 7
    of Kruschke (2014).


    # ## 9.3 Bayesian linear regression


    Because Bayesian concepts are rather abstract, it is useful to illustrate the
    theoretical notions with a simple example. In a linear model, \(y_i = \mathbf{x}_i\mathbf{b}
    + \epsilon_i\) and it is often statistically assumed that the \(\epsilon_i\) are
    i.i.d. and normally distributed with zero mean and variance \(\sigma^2\). Hence,
    the likelihood of Equation (9.3) translates into


    \(p(\epsilon|\mathbf{b}, \sigma) = \prod_{i=1}^I \frac{e^{-\frac{\epsilon_i^2}{2\sigma}}}{\sigma\sqrt{2\pi}}
    = (\sigma\sqrt{2\pi})^{-I} e^{-\frac{\sum \epsilon_i^2}{2\sigma^2}}\).


    In a regression analysis, the data is given both by $\mathbf{y}$ and by $\mathbf{X}$,
    hence both are reported in the notations. Simply acknowledging that \(\epsilon
    = \mathbf{y} - \mathbf{Xb}\), we get


    \(p(\mathbf{y}, \mathbf{X}|\mathbf{b}, \sigma) = \prod_{i=1}^I \frac{e^{-\frac{\epsilon_i^2}{2\sigma^2}}}{\sigma\sqrt{2\pi}}
    \tag{9.4}\)

    \(= (\sigma\sqrt{2\pi})^{-I} e^{-\sum_{i=1}^I \frac{(y_i - \mathbf{x}_i \mathbf{b})^2}{2\sigma^2}}
    = (\sigma\sqrt{2\pi})^{-I} e^{-\frac{(\mathbf{y} - \mathbf{Xb})(\mathbf{y} - \mathbf{Xb})}{2\sigma^2}}\)

    \(= \underbrace{(\sigma\sqrt{2\pi})^{-I} e^{-\frac{(\mathbf{y} - \mathbf{Xb})(\mathbf{y}
    - \mathbf{Xb})}{2\sigma^2}}}_{\text{depends on } \sigma \text{, not } \mathbf{b}}
    \times \underbrace{e^{-\frac{(\mathbf{b} - \hat{\mathbf{b}}) \mathbf{X} \mathbf{X}
    (\mathbf{b} - \hat{\mathbf{b}})}{2\sigma^2}}}_{\text{depends on both } \sigma
    \text{, and } \mathbf{b}} . \tag{9.5}\)


    In the last line, the second term is a function of the difference \(\mathbf{b}
    - \hat{\mathbf{b}}\), where \(\hat{\mathbf{b}} = (\mathbf{X}''\mathbf{X})^{-1}\mathbf{X}''\mathbf{y}\).'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'This is not surprising: \(\hat{\mathbf{b}}\) is a natural benchmark for the
    mean of \(\mathbf{b}\). Moreover, introducing \(\hat{\mathbf{b}}\) yields a relatively
    simple form for the probability.


    The above expression is the frequentist (data-based) block of the posterior: the
    likelihood. If we want to obtain a tractable expression for the posterior, we
    need to find a prior component that has a form that will combine well with this
    likelihood. These forms are called **conjugate priors**. A natural candidate for
    the right part (that depends on both \(\mathbf{b}\) and \(\sigma\)) is the multivariate
    Gaussian density:


    \(p[\mathbf{b}|\sigma] = \sigma^{-k} e^{-\frac{(\mathbf{b}-\mathbf{b}_0) \boldsymbol{\Lambda}_0
    (\mathbf{b}-\mathbf{b}_0)}{2\sigma^2}}, \quad (9.6)\)


    where we are obliged to condition with respect to \(\sigma\). The density has
    prior mean \(\mathbf{b}_0\) and prior covariance matrix \(\boldsymbol{\Lambda}_0^{-1}\).
    This prior gets us one step closer to the posterior because


    \(p[\mathbf{b}, \sigma | \mathbf{y}, \mathbf{X}] \propto p[\mathbf{y}, \mathbf{X}
    | \mathbf{b}, \sigma] p[\mathbf{b}, \sigma] \propto p[\mathbf{y}, \mathbf{X} |
    \mathbf{b}, \sigma] p[\mathbf{b}|\sigma] p[\sigma]. \quad (9.7)\)


    In order to fully specify the cascade of probabilities, we need to take care of
    \(\sigma\) and set a density of the form


    \(p[\sigma^2] \propto (\sigma^2)^{-1-a_0} e^{-\frac{b_0}{2\sigma^2}}, \quad (9.8)\)


    which is close to that of the left part of (9.5). This corresponds to an inverse
    gamma distribution for the variance with prior parameters \(a_0\) and \(b_0\)
    (this scalar notation is not optimal because it can be confused with the prior
    mean \(\mathbf{b}_0\) so we must pay extra attention).


    Now, we can simplify \(p[\mathbf{b}, \sigma | \mathbf{y}, \mathbf{X}]\) with (9.5),
    (9.6) and (9.8):


    \(p[\mathbf{b}, \sigma | \mathbf{y}, \mathbf{X}] \propto (\sigma\sqrt{2\pi})^{-I}
    \sigma^{-2(1+a_0)} e^{-\frac{(\mathbf{y}-\mathbf{X}\hat{\mathbf{b}})''(\mathbf{y}-\mathbf{X}\hat{\mathbf{b}})}{2\sigma^2}}
    \times e^{-\frac{(\mathbf{b}-\mathbf{b})'' \mathbf{X}'' \mathbf{X}(\mathbf{b}-\hat{\mathbf{b}})}{2\sigma^2}}
    \sigma^{-k} e^{-\frac{(\mathbf{b}-\mathbf{b}_0)'' \boldsymbol{\Lambda}_0 (\mathbf{b}-\mathbf{b}_0)}{2\sigma^2}}
    e^{-\frac{b_0}{2\sigma^2}}\)


    which can be rewritten


    \(p[\mathbf{b}, \sigma | \mathbf{y}, \mathbf{X}] \propto \sigma^{-I-k-2(1+a_0)}
    \times \exp \left( - \frac{\mathbf{y} - \mathbf{X}\hat{\mathbf{b}} \quad \mathbf{y}
    - \mathbf{X}\hat{\mathbf{b}} + (\mathbf{b}-\hat{\mathbf{b}})'' \mathbf{X}'' \mathbf{X}(\mathbf{b}-\hat{\mathbf{b}})
    + (\mathbf{b}-\mathbf{b}_0)'' \boldsymbol{\Lambda}_0 (\mathbf{b}-\mathbf{b}_0)
    + b_0}{2\sigma^2} \right) \).


    The above expression is simply a quadratic form in \(\mathbf{b}\) and it can be
    rewritten after burdensome algebra in a much more compact manner:


    \(p(\mathbf{b} | \mathbf{y}, \mathbf{X}, \sigma) \propto \sigma^{-k} e^{-\frac{(\mathbf{b}-\mathbf{b}_*)''
    \boldsymbol{\Lambda}_* (\mathbf{b}-\mathbf{b}_*)}{2\sigma^2}} \times (\sigma^2)^{-1-a_*}
    e^{-\frac{b_*}{2\sigma^2}}, \quad (9.9)\)


    where


    \(\boldsymbol{\Lambda}_* = \mathbf{X}''\mathbf{X} + \boldsymbol{\Lambda}_0\)

    \(\mathbf{b}_* = \boldsymbol{\Lambda}_*^{-1} (\boldsymbol{\Lambda}_0 \mathbf{b}_0
    + \mathbf{X}''\mathbf{X}\hat{\mathbf{b}})\)

    \(a_* = a_0 + I/2\)

    \(b_* = b_0 + \frac{1}{2} \mathbf{y}''\mathbf{y} + \mathbf{b}_0'' \boldsymbol{\Lambda}_0
    \mathbf{b}_0 + \mathbf{b}_*'' \boldsymbol{\Lambda}_* \mathbf{b}_* \).'
  merge: -1
