  md: "![](img/8861a37f775d09b4ba7a5151f604d9f5_289_0.png)\n\nFIGURE 18.3: The value\
    \ factor: portfolio values.\n\n# 18.2 Chapter 5\n\nBelow, we import a credit spread\
    \ supplied by Bank of America. Its symbol/ticker is “BAMLC0A0CM”. We apply the\
    \ data expansion on the small number of predictors to save memory space. One important\
    \ trick that should not be overlooked is the uniformization step after the product\
    \ (4.3) is computed. Indeed, we want the new features to have the same properties\
    \ as the old ones. If we skip this step, distributions will be altered, as we\
    \ show in one example below.\n\nWe start with the data extraction and joining.\
    \ It’s important to join early so as to keep the highest data frequency (daily)\
    \ in order to replace missing points with **close values**. Joining with monthly\
    \ data before replacing creates unnecessary lags.\n\n```\ngetSymbols.FRED(\"BAMLC0AOCM\"\
    ,\n env = \".GlobalEnv\",\n return.class = \"xts\")\n# Extract data\n```\n\n##\
    \ [1] \"BAMLC0AOCM\"\n\n```\ncred_spread <- fortify(BAMLC0AOCM) # Transform to\
    \ dataframe\ncolnames(cred_spread) <- c(\"date\", \"spread\") # Change column\
    \ name\ncred_spread <- cred_spread %>% # Take extraction and...\n full_join(data_ml\
    \ %>% dplyr::select(date), by = \"date\") %>% # Join!\n mutate(spread = na.locf(spread))\
    \ # Replace NA by previous\ncred_spread <- cred_spread[!duplicated(cred_spread),\
    \ ] # Remove duplicates\n```\n\nThe creation of the augmented dataset requires\
    \ some manipulation. Features are no longer uniform as is shown in Figure 18.4."
  merge: -1
  img_proc: true
- pgno: 290
  md: "```\ndata_cond <- data_ml %>%  # Create new dataset\n  dplyr::select(c(\"stock_id\"\
    , \"date\", features_short))\nnames_cred_spread <- paste0(features_short, \"_cred_spread\"\
    )  # New column names\nfeat_cred_spread <- data_cond %>%  # Old values\n  dplyr::select(features_short)\n\
    cred_spread <- data_ml %>%  # Create vector of spreads\n  dplyr::select(date)\
    \ %>\n  left_join(cred_spread, by = \"date\")\nfeat_cred_spread <- feat_cred_spread\
    \ *  # This product creates...\n  matrix(cred_spread$cred_spread,  # the new values...\n\
    \         length(cred_spread$spread),  # using duplicated...\n         length(features_short)))\
    \  # columns\ncolnames(feat_cred_spread) <- names_cred_spread  # New column names\n\
    data_cond <- bind_cols(data_cond, feat_cred_spread)  # Aggregate old & new\ndata_cond\
    \ %>% ggplot(aes(x = Eps_cred_spread)) + geom_histogram()  # Plot example\n```\n\
    \n![](img/8861a37f775d09b4ba7a5151f604d9f5_290_0.png)\n\n# FIGURE 18.4: Distribution\
    \ of Eps after conditioning.\n\nTo prevent this issue, uniformization is required\
    \ and is verified in Figure 18.5.\n\n```\ndata_cond <- data_cond %>%  # From new\
    \ dataset\n  group_by(date) %>%  # Group by date and...\n  mutate_at(names_cred_spread,\
    \ norm_unif)  # Uniformize the new features\ndata_cond %>% ggplot(aes(x = Eps_cred_spread))\
    \ + geom_histogram(bins = 100)  # Verification\n```\n\n![](img/8861a37f775d09b4ba7a5151f604d9f5_290_1.png)\n\
    \n# FIGURE 18.5: Distribution of uniformized conditioned feature values."
  merge: -1
  img_proc: true
- pgno: 291
  md: "The second question naturally requires the downloading of VIX series first\
    \ and the joining with the original data.\n\n```\n```r\ngetSymbols.FRED(\"VIXCLS\"\
    ,\n             env = \".GlobalEnv\",\n             return.class = \"xts\")  \
    \                # Extract data\n```\n```\n\n+   # [1] \"VIXCLS\"\n\n```\n```r\n\
    vix <- fortify(VIXCLS)                                  # Transform to dataframe\n\
    colnames(vix) <- c(\"date\", \"vix\")                       # Change column name\n\
    vix <- vix %>%                                        # Take extraction and...\n\
    \  full_join(data_ml %>% dplyr::select(date), by = \"date\") %>%  # Join!\n  mutate(vix\
    \ = na.locf(vix))                            # Replace NA by previous\nvix <-\
    \ vix[!duplicated(vix),]                           # Remove duplicates\nvix <-\
    \ data_ml %>%                                      # Keep original data format\n\
    \  dplyr::select(date) %>%                               # ...\n  left_join(vix,\
    \ by = \"date\")                           # Via left_join()\n```\n```\n\nWe can\
    \ then proceed with the categorization. We create the vector label in a new (smaller)\
    \ dataset but not attached to the large data_ml variable. Also, we check the balance\
    \ of labels and its evolution through time (see Figure 18.6).\n\n```\n```r\ndelta\
    \ <- 0.5                                            # Magnitude of vix correction\n\
    vix_bar <- median(vix$vix)                              # Median of vix\ndata_vix\
    \ <- data_ml %>%                                 # Smaller dataset\n  dplyr::select(stock_id,\
    \ date, R1M_Usd) %>%            # ...\n  mutate(r_minus = (-0.02) * exp(-delta*(vix$vix-vix_bar)),\
    \ # r_-\n         r_plus = 0.02 * exp(delta*(vix$vix-vix_bar)))     # r_+\ndata_vix\
    \ <- data_vix %>%                                # New label!\n  mutate(R1M_Usd_Cvix\
    \ = if_else(R1M_Usd < r_minus, -1,\n                                  if_else(R1M_Usd\
    \ > r_plus, 1, 0)),\n         R1M_Usd_Cvix = as.factor(R1M_Usd_Cvix))\ndata_vix\
    \ %>%                                           # ...\n  mutate(year = year(date))\
    \ %>%                         # ...\n  group_by(year, R1M_Usd_Cvix) %>%      \
    \                # ...\n  summarise(nb = n()) %>%                            \
    \    # ...\n  ggplot(aes(x = year, y = nb, fill = R1M_Usd_Cvix)) + geom_col()\n\
    ```\n```\n\n![](img/8861a37f775d09b4ba7a5151f604d9f5_291_0.png)\n\n# **FIGURE\
    \ 18.6:** Evolution of categories through time.\n\nFinally, we switch to the outliers\
    \ (Figure 18.7)."
