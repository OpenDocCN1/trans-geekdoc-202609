    # 15.3 Clustering via k-means


    The second family of unsupervised tools pertains to clustering. Features are grouped
    into homogeneous families of predictors. It is then possible to single out one
    among the group (or to create a synthetic average of all of them). Mechanically,
    the number of predictors is reduced.


    The principle is simple: among a group of variables (the reasoning would be the
    same for observations in the other dimension) \(\mathbf{x}_{\{1 \le j \le J\}}\),
    find the combination of \(k < J\) groups that minimize


    \(\sum_{i=1}^k \sum_{\mathbf{x} \in S_i} ||\mathbf{x} - \mathbf{m}_i||^2,\) (15.8)'
  merge: -1
  img_proc: true
- pgno: 262
  md: "where || · || is some norm which is usually taken to be the Euclidean l²-norm.\
    \ The Sᵢ are the groups and the minimization is run on the whole set of groups\
    \ S. The mᵢ are the group means (also called centroids or barycenters): mᵢ = (card(Sᵢ))⁻¹\
    \ Σₓ∈Sᵢ x.\n\nIn order to ensure optimality, all possible arrangements must be\
    \ tested, which is prohibitively long when k and J are large. Therefore, the problem\
    \ is usually solved with greedy algorithms that seek (and find) solutions that\
    \ are not optimal but ‘good enough’.\n\nOne heuristic way to proceed is the following:\n\
    \n+   0. Start with a (possibly random) partition of k clusters.\n+   \n+   1.\
    \ For each cluster, compute the optimal mean values mᵢ* that minimizes expression\
    \ (15.8). This is a simple quadratic program.\n+   \n+   2. Given the optimal\
    \ centers mᵢ*, reassign the points xᵢ so that they are all the closest to their\
    \ center.\n+   \n+   3. Repeat steps 1. and 2. until the points do not change\
    \ cluster at step 2.\n\nBelow, we illustrate this process with an example. From\
    \ all 93 features, we build 10 clusters.\n\n```\nset.seed(42)\nk_means <- training_sample\
    \ %>%\ndplyr::select(features) %>%\nas.matrix() %>%\nt() %>%\nkmeans(10)\nclusters\
    \ <- tibble(factor = names(k_means$cluster),\ncluster = k_means$cluster) %>%\n\
    arrange(cluster)\nclusters %>% filter(cluster == 4)\n```\n\n```\n## A tibble:\
    \ 4 x 2\n##   factor          cluster\n##   <chr>           <int>\n## 1 Asset_Turnover\
    \       4\n## 2 Bb_Yld              4\n## 3 Recuring_Earning_Total_Assets 4\n\
    ## 4 Sales_Ps             4\n```\n\nWe single out the fourth cluster which is\
    \ composed mainly of accounting ratios related to the profitability of firms.\
    \ Given these 10 clusters, we can build a much smaller group of features that\
    \ can then be fed to the predictive engines described in Chapters 5 to 9. The\
    \ representative of a cluster can be the member that is closest to the center,\
    \ or simply the center itself. This pre-processing step can nonetheless cause\
    \ problems in the forecasting phase. Typically, it requires that the training\
    \ data be also clustered. The extension to the testing data is not straightforward\
    \ (the clusters may not be the same)."
