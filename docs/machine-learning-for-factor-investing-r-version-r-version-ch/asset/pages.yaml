  md: '# # 2 Introduction


    Conclusions often echo introductions. This chapter was completed at the very end
    of the writing of the book. It outlines principles and ideas that are probably
    more relevant than the sum of technical details covered subsequently. When stuck
    with disappointing results, we advise the reader to take a step away from the
    algorithm and come back to this section to get a broader perspective of some of
    the issues in predictive modelling.


    # ### 2.1 Context


    The blossoming of machine learning in factor investing has it source at the confluence
    of three favorable developments: data availability, computational capacity, and
    economic groundings.


    First, *the data*. Nowadays, classical providers, such as Bloomberg and Reuters
    have seen their playing field invaded by niche players and aggregation platforms.1
    In addition, high-frequency data and derivative quotes have become mainstream.
    Hence, firm-specific attributes are easy and often cheap to compile. This means
    that the size of X in (2.1) is now sufficiently large to be plugged into ML algorithms.
    The order of magnitude (in 2019) that can be reached is the following: a few hundred
    monthly observations over several thousand stocks (US listed at least) covering
    a few hundred attributes. This makes a dataset of dozens of millions of points.
    While it is a reasonably high figure, we highlight that the chronological depth
    is probably the weak point and will remain so for decades to come because accounting
    figures are only released on a quarterly basis. Needless to say that this drawback
    does not hold for high-frequency strategies.


    Second, *computational power*, both through hardware and software. Storage and
    processing speed are not technical hurdles anymore and models can even be run
    on the cloud thanks to services hosted by major actors (Amazon, Microsoft, IBM
    and Google) and by smaller players (Rackspace, Techila). On the software side,
    open source has become the norm, funded by corporations (TensorFlow & Keras by
    Google, Pytorch by Facebook, h2o, etc.), universities (Scikit-Learn by INRIA,
    NLPCore by Stanford, NLTK by UPenn) and small groups of researchers (caret, xgboost,
    tidymodels to list but a pair of frameworks). Consequently, ML is no longer the
    private turf of a handful of expert computer scientists, but is on the contrary
    accessible to anyone willing to learn and code.


    Finally, *economic framing*. Machine learning applications in finance were initially
    introduced by computer scientists and information system experts (e.g., Braun
    and Chandler (1987), White (1988)) and exploited shortly after by academics in
    financial economics (Bansal


    1 We refer to https://alternativedata.org/data-providers/2 for a list of alternative
    data providers. Moreover, we recall that Quandl, an alt-data hub was acquired
    by Nasdaq in December 2018. As large players acquire newcomers, the field may
    consolidate.'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'and Viswanathan (1993)), and hedge funds (see, e.g., Zuckerman (2019)). Nonlinear
    relationships then became more mainstream in asset pricing (Freeman and Tse (1992),
    Bansal et al. (1993)). These contributions started to pave the way for the more
    brute-force approaches that have blossomed since the 2010 decade and which are
    mentioned throughout the book.


    In the synthetic proposal of Arnott et al. (2019b), the first piece of advice
    is to rely on a model that makes sense economically. We agree with this stance,
    and the only assumption that we make in this book is that future returns depend
    on firm characteristics. The relationship between these features and performance
    is largely unknown and probably time-varying. This is why ML can be useful: to
    detect some hidden patterns beyond the documented asset pricing anomalies. Moreover,
    dynamic training allows to adapt to changing market conditions.


    # 2.2 Portfolio construction: the workflow


    Building successful portfolio strategies requires many steps. This book covers
    many of them but focuses predominantly on the prediction part. Indeed, allocating
    to assets most of the time requires to make bets and thus to presage and foresee
    which ones will do well and which ones will not. In this book, we mostly resort
    to supervised learning to forecast returns in the cross-section. The baseline
    equation in supervised learning,


    \(\mathbf{y} = f(\mathbf{X}) + \epsilon,\) (2.1)


    is translated in financial terms as


    \(\mathbf{r}_{t+1,n} = f(\mathbf{x}_{t,n}) + \epsilon_{t+1,n},\) (2.2)


    where \(f(\mathbf{x}_{t,n})\) can be viewed as the **expected return** for time
    \(t + 1\) computed at time \(t\), that is, \(\mathbb{E}_t[r_{t+1,n}]\). Note that
    the model is **common to all assets** (\(f\) is not indexed by \(n\)), thus it
    shares similarity with panel approaches.


    Building accurate predictions requires to pay attention to **all** terms in the
    above equation. Chronologically, the first step is to gather data and to process
    it (see Chapter 4). To the best of our knowledge, the only consensus is that,
    on the **x** side, the features should include classical predictors reported in
    the literature: market capitalization, accounting ratios, risk measures, momentum
    proxies (see Chapter 3). For the dependent variable, many researchers and practitioners
    work with monthly returns, but other maturities may perform better out-of-sample.


    While it is tempting to believe that the most crucial part is the choice of \(f\)
    (it is the most sophisticated, mathematically), we believe that the choice and
    engineering of inputs, that is, the variables, are at least as important. The
    usual modelling families for \(f\) are covered in Chapters 5 to 9. Finally, the
    errors \(\epsilon_{t+1,n}\) are often overlooked. People consider that vanilla
    quadratic programming is the best way to go (the most common for sure!), thus
    the mainstream objective is to minimize squared errors. In fact, other options
    may be wiser choices (see for instance Section 7.4.3).


    Even if the overall process, depicted in Figure 2.1, seems very sequential, it
    is more judicious'
  merge: -1
  img_proc: true
- pgno: 31
  md: "to conceive it as **integrated**. All steps are intertwined and each part should\
    \ not be dealt with independently from the others.³ The global framing of the\
    \ problem is essential, from the choice of predictors, to the family of algorithms,\
    \ not to mention the portfolio weighting schemes (see Chapter 12 for the latter).\n\
    \n![](img/8861a37f775d09b4ba7a5151f604d9f5_31_0.png)\n\nFIGURE 2.1: Simplified\
    \ workflow in ML-based portfolio construction.\n\n# 2.3 Machine learning is no\
    \ magic wand\n\nBy definition, the curse of predictions is that they rely on **past**\
    \ data to infer patterns about **subsequent** fluctuations. The more or less explicit\
    \ hope of any forecaster is that the past will turn out to be a good approximation\
    \ of the future. Needless to say, this is a pious wish; in general, predictions\
    \ fare badly. Surprisingly, this does not depend much on the sophistication of\
    \ the econometric tool. In fact, heuristic guesses are often hard to beat.\n\n\
    To illustrate this sad truth, the baseline algorithms that we detail in Chapters\
    \ 5 to 7 yield at best mediocre results. This is done **on purpose**. This forces\
    \ the reader to understand that blindly feeding data and parameters to a coded\
    \ function will seldom suffice to reach satisfactory out-of-sample accuracy.\n\
    \nBelow, we sum up some key points that we have learned through our exploratory\
    \ journey in financial ML.\n\n+   - The first point is that **causality** is key.\
    \ If one is able to identify \\(X \\rightarrow y\\), where \\(y\\) are expected\
    \ returns, then the problem is solved. Unfortunately, causality is incredibly\
    \ hard to uncover.\n+   \n+   - Thus, researchers have most of the time to make\
    \ do with simple **correlation** patterns, which are far less informative and\
    \ robust.\n+   \n+   - Relatedly, financial datasets are extremely noisy. It is\
    \ a daunting task to **extract signals** out of them. **No-arbitrage** reasonings\
    \ imply that if a simple pattern yielded durable profits, it would mechanically\
    \ and rapidly vanish."
