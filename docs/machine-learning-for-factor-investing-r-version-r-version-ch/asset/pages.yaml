    # ## 7.4.2 Classification example


    We pursue our exploration of neural networks with a much more detailed example.
    The aim is to carry out a classification task on the binary label R1M_Usd_C. Before
    we proceed, we need to format the label properly. To this purpose, we resort to
    one-hot encoding (see Section 4.5.2).


    ```

    library(dummies)

    NN_train_labels_C <- training_sample$R1M_Usd_C %>% dummy() # Package for one-hot
    encoding

    NN_test_labels_C <- testing_sample$R1M_Usd_C %>% dummy() # One-hot encoding of
    the label

    # One-hot encoding of the label

    ```


    The labels NN_train_labels_C and NN_test_labels_C have two columns: the first
    flags the instances with above median returns and the second flags those with
    below median returns. Note that we do not alter the feature variables: they remain
    unchanged. Below, we set the structure of the networks with many additional features
    compared to the first one.


    ```

    model_C <- keras_model_sequential()

    model_C %>% # This defines the structure of the network, i.e. how layers are organized

    layer_dense(units = 16, activation = ''tanh'', # Nb units & activation

    input_shape = ncol(NN_train_features), # Size of input

    kernel_initializer = "random_normal", # Initialization of weights

    kernel_constraint = constraint_nonneg()) # Weights should be nonneg

    layer_dropout(rate = 0.25) # Dropping out 25% units

    layer_dense(units = 8, activation = ''elu'', # Nb units & activation

    bias_initializer = initializer_constant(0.2), # Initialization of biases

    kernel_regularizer = regularizer_l2(0.01)) # Penalization of weights

    layer_dense(units = 2, activation = ''softmax'') # Softmax for categorical output

    ```


    Before we start commenting on the many options used above, we highlight that Keras
    models, unlike many R variables, are mutable objects. This means that any piping
    %>% after calling a model will alter it. Hence, successive trainings do not start
    from scratch but from the result of the previous training.'
