  md: '![](img/8861a37f775d09b4ba7a5151f604d9f5_140_0.png)


    # **FIGURE 7.11:** Scheme of a convolutional unit. Note: the dimensions are general
    and do not correspond to the number of squares.


    Iteratively reducing the dimension of the output via sequences of convolutional
    layers like the one presented above would be costly in computation and could give
    rise to overfitting because the number of weights would be incredibly large. In
    order to efficiently reduce the size of outputs, **pooling layers** are often
    used. The job of pooling units is to simplify matrices by reducing them to a simple
    metric such as the minimum, maximum or average value of the matrix:


    ```

    o_{i,k} = f(x_{i+j-1,k+l-1}; 1 \le j \le J, 1 \le l \le L),

    ```


    where f is the minimum, maximum or average value. We show examples of pooling
    in Figure 7.12 below. In order to increase the speed of compression, it is possible
    to add a stride to omit cells. A stride value of v will perform the operation
    only every v value and hence bypass intermediate steps. In Figure 7.12, the two
    cases on the left do not resort to pooling, hence the reduction in dimension is
    equal to the size of the pooling size. When stride is into action (right pane),
    the reduction is more marked. From the 1,000 by 1,000 input, a 2-by-2 pooling
    layer with stride 2 will yield a 500-by-500 output: the dimension is shrinked
    fourfold, as in the right scheme of Figure 7.12.'
  merge: -1
