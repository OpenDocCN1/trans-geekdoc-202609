  md: "There are several ways to split the training data so as to build different\
    \ subsets of training samples. The first dichotomy is between random versus deterministic\
    \ splits. Random splits are easy and require only the target sample size to be\
    \ fixed. Note that the training samples can be overlapping as long as the overlap\
    \ is not too large. Hence if the original training sample has $I$ instance and\
    \ the ensemble requires $M$ models, then a subsample size of $\\lceil I/M \rceil$\
    \ may be too conservative especially if the training sample is not very large.\
    \ In this case $\\lceil I/\\sqrt{M} \rceil$ may be a better alternative. Random\
    \ forests are one example of ensembles built in random training samples.\n\nOne\
    \ advantage of deterministic splits is that they are easy to reproduce and their\
    \ outcome does not depend on the random seed. By the nature of factor-based training\
    \ samples, the second splitting dichotomy is between time and assets. A split\
    \ within assets is straightforward: each model is trained on a different set of\
    \ stocks. Note that the choices of sets can be random, or dictated by some factor-based\
    \ criterion: size, momentum, book-to-market ratio, etc.\n\nA split in dates requires\
    \ other decisions: is the data split in large blocks (like years) and each model\
    \ gets a block, which may stand for one particular kind of market condition? Or\
    \ are the training dates divided more regularly? For instance, if there are 12\
    \ models in the ensemble, each model can be trained on data from a given month\
    \ (e.g., January for the first models, February for the second, etc.).\n\nBelow,\
    \ we train four models on four different years to see if this helps reduce the\
    \ inter-model correlations. This process is a bit lengthy because the samples\
    \ and models need to be all redefined. We start by creating the four training\
    \ samples. The third model works on the small subset of features, hence the sample\
    \ is smaller.\n\n```\n```r\ntraining_sample_2007 <- training_sample %>%\n  filter(date\
