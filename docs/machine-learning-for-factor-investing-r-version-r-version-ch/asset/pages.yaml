    # 12.3 Performance metrics


    The evaluation of performance is a key stage in a backtest. This section, while
    not exhaustive, is intended to cover the most important facets of portfolio assessment.


    # 12.3.1 Discussion


    While the evaluation of the accuracy of ML tools (See Section 10.1) is of course
    valuable (and imperative!), the portfolio returns are the ultimate yardstick during
    a backtest. One essential element in such an exercise is a benchmark because raw
    and absolute metrics don''t mean much on their own.


    This is not only true at the portfolio level, but also at the ML engine level.
    In most of the trials of the previous chapters, the MSE of the models on the testing
    set revolves around 0.037. An interesting figure is the variance of one-month
    returns on this set, which corresponds to the error made by a constant prediction
    of 0 all the time. This figure is equal to 0.037, which means that the sophisticated
    algorithms don''t really improve on a naive heuristic. This benchmark is the one
    used in the out-of-sample \(R^2\) of Gu et al. (2020b).


    In portfolio choice, the most elementary allocation is the uniform one, whereby
    each asset receives the same weight. This seemingly simplistic solution is in
    fact an incredible benchmark, one that is hard to beat consistently (see DeMiguel
    et al. (2009b) and Plyakha et al. (2016)). Theoretically, uniform portfolios are
    optimal when uncertainty, ambiguity or estimation risk is high (Pflug et al. (2012),
    Maillet et al. (2015)) and empirically, it cannot be outperformed even at the
    factor level (Dichtl et al. (2020b)). Below, we will pick an equally weighted
    (EW) portfolio of all stocks as our benchmark.'
