- pgno: 293
  md: "```\n## 12 2009-12-31 -0.251\n```\n\nThe returns are all very high. The annual\
    \ value is plausible. In addition, a quick glance at the Vol1Y values shows that\
    \ the stock is the most volatile of the dataset.\n\n# ## 18.3 Chapter 6\n\nWe\
    \ recycle the training and testing data variables created in the chapter (coding\
    \ section notably). In addition, we create a dedicated function and resort to\
    \ the `map2()` function from the _purrr_ package.\n\n```\nalpha_seq <- (0:10)/10\
    \          # Sequence of alpha values\nlambda_seq <- 0.1^(0:5)           # Sequence\
    \ of lambda values\npars <- expand.grid(alpha_seq, lambda_seq) # Exploring all\
    \ combinations!\nalpha_seq <- pars[,1]\nlambda_seq <- pars[,2]\nlasso_sens <-\
    \ function(alpha, lambda, x_train, y_train, x_test, y_test){ # Function\n  fit_temp\
    \ <- glmnet(x_train, y_train,\n                     alpha = alpha, lambda = lambda)\
    \ # Model\n  return(sqrt(mean((predict(fit_temp, x_test) - y_test)^2))) # Output\n\
    }\nrmse_elas <- map2(alpha_seq, lambda_seq, lasso_sens,       # Automation\n \
    \                 x_train = x_penalized_train, y_train = y_penalized_train,\n\
    \                  x_test = x_penalized_test, y_test = testing_sample$R1M_Usd)\n\
    bind_cols(alpha = alpha_seq, lambda = as.factor(lambda_seq), rmse = unlist(rmse_elas))\
    \ %>%\nggplot(aes(x = alpha, y = rmse, fill = lambda)) + geom_col() + facet_grid(lambda\
    \ ~ .) +\ncoord_cartesian(ylim = c(0.19,0.193))\n```\n\nAs is outlined in Figure\
    \ 18.8, the parameters have a very marginal impact. Maybe the model is not a good\
    \ fit for the task.\n\n# ## 18.4 Chapter 7\n\n```\nfit1 <- rpart(formula,\n  \
    \            data = training_sample,       # Data source: full sample\n      \
    \        cp = 0.001)                   # Precision: smaller = more leaves\nmean((predict(fit1,\
    \ testing_sample) - testing_sample$R1M_Usd)^2)\n```\n\n```\n## [1] 0.04018973\n\
    ```\n\n```\nfit2 <- rpart(formula,\n              data = training_sample,    \
    \   # Data source: full sample\n              cp = 0.01)                    #\
    \ Precision: smaller = more leaves\nmean((predict(fit2, testing_sample) - testing_sample$R1M_Usd)^2)\
    \ # Test!\n```\n\n```\n## [1] 0.03699696\n```"
