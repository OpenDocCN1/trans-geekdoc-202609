    t = \phi \ (SR - SR^*)\sqrt{\frac{T-1}{1-\gamma_3SR + \frac{\gamma_4-1}{4}SR^2}}
    , \quad (12.5)


    where $SR$ is the Sharpe Ratio obtained by the best strategy among all that were
