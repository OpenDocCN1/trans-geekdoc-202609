- pgno: 294
  md: "![](img/8861a37f775d09b4ba7a5151f604d9f5_294_0.png)\n\n**FIGURE 18.8:** Performance\
    \ of elasticnet across parameter values.\n\n```\nrpart.plot(fit1) # Plot the first\
    \ tree\n```\n\nThe first model (Figure 18.9) is **too** precise: going into the\
    \ details of the training sample does not translate to good performance out-of-sample.\
    \ The second, simpler model, yields better results.\n\n```\nn_trees <- c(10, 20,\
    \ 40, 80, 160)\nmse_RF <- c()\nfor(j in 1:length(n_trees)){\n    fit_temp <- randomForest(\n\
    \        as.formula(paste(\"R1M_Usd ~ \", paste(features_short, collapse = \"\
    \ + \"))), # New formula!\n        data = training_sample, # Data source: training\
    \ sample\n        sampsize = 30000, # Size of (random) sample for each tree\n\
    \        replace = TRUE, # Is the sampling done with replacement?\n```\n\n![](img/8861a37f775d09b4ba7a5151f604d9f5_294_1.png)\n\
    \n**FIGURE 18.9:** Sample (complex) tree."
