    \ and the length of the buffer period shown in Figure 12.2. This **buffer period\
    \ is imperative** because the label is based on a long-term (12-month) return.\
    \ This lag is compulsory to avoid any forward-looking bias in the backtest.\n\n\
    Below, we create a function that computes the turnover (variation in weights).\
    \ It requires both the weight values as well as the returns of all assets because\
    \ the weights just before a rebalancing depend on the weights assigned in the\
    \ previous period, as well as on the returns of the assets that have altered these\
    \ original weights during the holding period.\n\n```\nturnover <- function(weights,\
    \ asset_returns, t_oos){\n  turn <- 0\n  for(t in 2:length(t_oos)){\n    realised_returns\
    \ <- %>% filter(date == t_oos[t]) %>% dplyr::select(-date)\n    prior_weights\
    \ <- weights[t-1,] * (1 + realised_returns) # Before rebalancing\n    turn <-\
    \ turn + apply(abs(weights[t,] - prior_weights/sum(prior_weights)),1,sum)\n  }\n\
    \  return(turn/(length(t_oos)-1))\n}\n```\n\nOnce turnover is defined, we embed\
