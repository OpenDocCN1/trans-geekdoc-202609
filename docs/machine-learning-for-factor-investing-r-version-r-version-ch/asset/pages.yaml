- pgno: 244
  md: '![](img/8861a37f775d09b4ba7a5151f604d9f5_244_0.png)


    Naturally, if we acknowledge that the environment changes, it appears logical
    to adapt models accordingly, i.e., dynamically. This gives rise to the so-called
    **stability-plasticity dilemma**. This dilemma is a trade-off between model **reactiveness**
    (new instances have an important impact on updates) versus **stability** (these
    instances may not be representative of a slower trend and they may thus shift
    the model in a suboptimal direction).


    Practically, there are two ways to shift the cursor with respect to this dilemma:
    alter the chronological depth of the training sample (e.g., go further back in
    time) or, when it''s possible, allocate more weight to recent instances. We discuss
    the first option in Section 12.1 and the second is mentioned in Section 6.3 (though
    the purpose in Adaboost is precisely to let the algorithm handle the weights).
    In neural networks, it is possible, in all generality to introduce instance-based
    weights in the computation of the loss function, though this option is not (yet)
    available in Keras (to the best of our knowledge: the framework evolves rapidly).
    For simple regressions, this idea is known as **weighted least squares** wherein
    errors are weighted inside the loss:


    \( L = \sum_{i=1}^I w_i(y_i - \mathbf{x}_i\mathbf{b})^2 \).


    In matrix terms, \( L = (\mathbf{y} - \mathbf{Xb})''\mathbf{W}(\mathbf{y} - \mathbf{Xb})
    \), where **W** is a diagonal matrix of weights. The gradient with respect to
    **b** is equal to \( 2\mathbf{X}''\mathbf{WXb} - 2\mathbf{X}''\mathbf{Wy} \) so
    that the loss is minimized for \( \mathbf{b}^* = (\mathbf{X}''\mathbf{WX})^{-1}\mathbf{X}''\mathbf{Wy}
    \). The standard least-square solution is recovered for **W** = **I**. In order
    to fine-tune the reactiveness of the model, the weights must be a function that
    decreases as instances become older in the sample.


    There is of course no perfect solution to changing financial environments. Below,
    we mention two routes that are taken in the ML literature to overcome the problem
    of non-stationarity in the data generating process. But first, we propose yet
    another clear verification that markets do experience time-varying distributions.'
  merge: -1
  img_proc: true
- pgno: 245
  md: "# 14.2.1 Non-stationarity: yet another illustration\n\nOne of the most basic\
    \ practices in (financial) econometrics is to work with returns (relative price\
    \ changes). The simple reason is that returns seem to behave consistently through\
    \ time (monthly returns are bounded, they usually lie between -1 and +1). Prices\
    \ on the other hand shift and, often, some prices never come back to past values.\
    \ This makes prices harder to study.\n\nStationarity is a key notion in financial\
    \ econometrics: it is much easier to characterize a phenomenon with distributional\
    \ properties that remain the same through time (this makes them possible to capture).\
    \ Sadly, the distribution of returns is not stationary: both the mean and the\
    \ variance of returns change along cycles.\n\nBelow, in Figure 14.4, we illustrate\
    \ this fact by computing the average monthly return for all calendar years in\
    \ the whole dataset.\n\n```\ndata_ml %>%\n  mutate(year = year(date)) %>%    \
    \  # Create a year variable\n  group_by(year) %>%                 # Group by year\n\
    \  summarize(avg_ret = mean(R1M_Usd)) %>%  # Compute average return\n  ggplot(aes(x\
    \ = year, y = avg_ret)) + geom_col() + theme_grey()\n```\n\n![](img/8861a37f775d09b4ba7a5151f604d9f5_245_0.png)\n\
    \n**FIGURE 14.4:** Average monthly return on a yearly basis.\n\nThese changes\
    \ in the mean are also accompanied by variations in the second moment (variance/volatility).\
    \ This effect, known as volatility clustering, has been widely documented ever\
    \ since the theoretical breakthrough of Engle (1982) (and even well before). We\
    \ refer"
  merge: -1
  img_proc: true
