- pgno: 149
  md: '# # 9

    Bayesian methods


    This section is dedicated to the subset of machine learning that makes prior assumptions
    on parameters. Before we explain how Bayes’ theorem can be applied to simple building
    blocks in machine learning, we introduce some notations and concepts in the subsection
    below. Good references for Bayesian analysis are Gelman et al. (2013) and Kruschke
    (2014). The latter, like the present book, illustrates the concepts with many
    lines of R code.


    # ## 9.1 The Bayesian framework


    Up to now, the models that have been presented rely on data only. This approach
    is often referred to as ‘frequentist’. Given one dataset, a frequentist will extract
    (i.e., estimate) a unique set of optimal parameters and consider it to be the
    best model. Bayesians, on the other hand, consider datasets as **snapshots of
    reality** and, for them, parameters are thus random! Instead of estimating one
    value for parameters (e.g., a coefficient in a linear model), they are more ambitious
    and try to determine the **whole distribution** of the parameter.


    In order to outline how that can be achieved, we introduce basic notations and
    results. The foundational concept in Bayesian analysis is the **conditional probability**.
    Given two random sets (or events) $A$ and $B$, we define the probability of $A$
    knowing $B$ (equivalently, the odds of having $A$, conditionally on having $B$)
    as


    \( P[A|B] = \frac{P[A \cap B]}{P[B]},\)


    that is, the probability of the intersection between the two sets divided by the
    probability of \(B\). Likewise, the probability that both occur is equal to \(P[A
    \cap B] = P[A]P[B|A]\). Given \(n\) disjoint events \(A_i\), \(i=1, ...n\) such
    that \(\sum_{i=1}^n P(A_i) = 1\), then for any event \(B\), the law of total probabilities
    is (or implies)


    \( P(B) = \sum_{i=1}^n P(B \cap A_i) = \sum_{i=1}^n P(B|A_i)P(A_i).\)


    Given this expression, we can formulate a general version of Bayes’ theorem:


    \( P(A_i|B) = \frac{P(A_i)P(B|A_i)}{P(B)} = \frac{P(A_i)P(B|A_i)}{\sum_{i=1}^n
    P(B|A_i)P(A_i)}.\) (9.1)


    Endowed with this result, we can move forward to the core topic of this section,
    which is the estimation of some parameter \(\theta\) (possibly a vector) given
    a dataset, which we denote with **y**'
  merge: -1
  img_proc: true
