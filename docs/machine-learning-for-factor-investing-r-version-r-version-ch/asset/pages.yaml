  md: "we closely follow the notations of Brodersen et al. (2015). The model is driven\
    \ by two equations:\n\n$y_t = \\mathbf{Z}'_t \\boldsymbol{\\alpha}_t + \\epsilon_t$\n\
    $\\boldsymbol{\\alpha}_{t+1} = \\mathbf{T}_t \\boldsymbol{\\alpha}_t + \\mathbf{R}_t\
    \ \\boldsymbol{\\eta}_t$.\n\nThe dependent variable is expressed as a linear function\
    \ of state variables $\\boldsymbol{\\alpha}_t$ plus an error term. These variables\
    \ are in turn linear functions of their past values plus another error term which\
    \ can have a complex structure (it’s a product of a matrix $\\mathbf{R}_t$ with\
    \ a centered Gaussian term $\\boldsymbol{\\eta}_t$). This specification nests\
    \ many models as special cases, like ARIMA for instance.\n\nThe goal of Brodersen\
    \ et al. (2015) is to detect causal impacts via regime changes. They estimate\
    \ the above model over a given training period and then predict the model’s response\
    \ on some test set. If the aggregate (summed/integrated) error between the realized\
    \ versus predicted values is significant (based on some statistical test), then\
    \ the authors conclude that the breaking point is relevant. Originally, the aim\
    \ of the approach is to quantify the effect of an intervention by looking at how\
    \ a model trained before the intervention behaves after the intervention.\n\n\
    Below, we test if the $100^{th}$ date point in the sample (April 2008) is a turning\
    \ point. Arguably, this date belongs to the time span of the subprime financial\
    \ crisis. We use the *CausalImpact* package which uses the *bsts* library (Bayesian\
    \ structural time series).\n\n```\nlibrary(CausalImpact)\nstock1_data <- data_ml\
    \ %>% filter(stock_id == 1)  # Data of first stock\nstruct_data <- data.frame(y\
    \ = stock1_data$R1M_Usd) %>%  # Combine label...\n  cbind(stock1_data %>% dplyr::select(features_short()))\
    \  # ... and features\npre.period <- c(1,100)  # Pre-break period (pre-2008)\n\
    post.period <- c(101,200)  # Post-break period\nimpact <- CausalImpact(zoo(struct_data),\
    \ pre.period, post.period)\nsummary(impact)\n```\n\n```\n## Posterior inference\
    \ {CausalImpact}\n##\n##\n##               Average     Cumulative\n## Actual \
    \       0.016     1.638\n## Prediction (s.d.)  0.031 (0.017)  3.091 (1.715)\n\
    ## 95% CI        [-0.004, 0.065]  [-0.403, 6.476]\n##\n## Absolute effect (s.d.)\
    \  -0.015 (0.017)  -1.453 (1.715)\n## 95% CI        [-0.048, 0.02]   [-4.838,\
    \ 2.04]\n##\n## Relative effect (s.d.)  -47% (55%)    -47% (55%)\n## 95% CI  \
    \      [-157%, 66%]    [-157%, 66%]\n##\n## Posterior tail-area probability p:\
    \   0.18293\n## Posterior prob. of a causal effect:  82%\n##\n## For more details,\
    \ type: summary(impact, \"report\")\n```\n\n```\n#summary(impact, \"report\")\
