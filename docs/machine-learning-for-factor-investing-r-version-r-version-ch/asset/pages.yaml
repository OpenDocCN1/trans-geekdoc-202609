  md: "# 11.2 Stacked ensembles\n\n# 11.2.1 Two-stage training\n\nStacked ensembles\
    \ are a natural generalization of linear ensembles. The idea of generalizing linear\
    \ ensembles goes back at least to Wolpert (1992b). In the general case, the training\
    \ is performed in two stages. The first stage is the simple one, whereby the _M_\
    \ models are trained independently, yielding the predictions \\(\\tilde{y}_{i,m}\\\
    ) for instance _i_ and model _m_. The second step is to consider the output of\
    \ the trained models as input for a new level of machine learning optimization.\
    \ The second level predictions are \\(\\tilde{y}_i = h(\\tilde{y}_{i,1}, \\dots,\
    \ \\tilde{y}_{i,M})\\), where _h_ is a new learner (see Figure 11.1). Linear ensembles\
    \ are of course stacked ensembles in which the second layer is a linear regression.\n\
    \nThe same techniques are then applied to minimize the error between the true\
    \ values _y<sub>i</sub>_ and the predicted ones \\(\\tilde{y}_i\\).\n\n**Stage\
    \ 1: first learning level**\nsimple training\nand predictions \\(\\tilde{\\mathbf{y}}_m\\\
    )\nModel 1\nModel 2\n...\nModel M\n↓\nI*M = nb\npredictions\n(l = nb instances)\n\
    \n**Stage 2: 2nd learning level**\noptimise combination\nor feed new learner\n\
    **estimate this model:**\ny = h(\\(\\tilde{y}_1\\), \\(\\tilde{y}_2\\) ... \\\
    (\\tilde{y}_M\\))\n\\(\\hat{h}\\) is the aggregate\nmeta model\n\n**Stage 3: Forecast!**\n\
    reverse operation:\ntwo step prediction\n1. Make the forecasts\nat indiv. learner\n\
    level\n2. Feed the forecasts\nto the second\nmodel \\(\\hat{h}\\)\n\n# FIGURE\
    \ 11.1: Scheme of stacked ensembles.\n\n# 11.2.2 Code and results\n\nBelow, we\
