    # 10.4 Short discussion on validation in backtests


    The topic of validation in backtests is more complex than it seems. There are
    in fact two scales at which it can operate, depending on whether the forecasting
    model is dynamic (updated at each rebalancing) or fixed.


    Let us start with the first option. In this case, the aim is to build a unique
    model and to test it on different time periods. There is an ongoing debate on
    the methods that are suitable to validate a model in that case. Usually, it makes
    sense to test the model on successive dates, moving forward posterior to the training.
    This is what makes more sense, as it replicates what would happen in a live situation.


    In machine learning, a popular approach is to split the data into K partitions
    and to test K different models: each one is tested on one of the partitions but
    trained on the K – 1 others. This so-called cross-validation (CV) is prescribed
    by most experts (and common sense) for a simple reason: most of the time, the
    training set encompasses data from future dates and tests on past values. Nonetheless,
    some advocate one particular form of CV that aims at making sure that there is
    no informational overlap between the training and testing'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'set (Sections 7.4 and 12.4 in De Prado (2018)). The premise is that if the
    structure of the cross-section of returns is constant through time, then training
    on future points and testing on past data is not problematic as long as there
    is no overlap. The paper Schnaubelt (2019) provides a comprehensive and exhaustive
    tour in many validation schemes.


    One example cited in De Prado (2018) is the reaction to a model to an unseen crisis.
    Following the market crash of 2008, at least 11 years have followed without any
    major financial shake. One option to test the reaction of a recent model to a
    crash would be to train it on recent years (say 2015-2019) and test it on various
    points (e.g., months) in 2008 to see how it performs.


    The advantage of a fixed model is that validation is easy: for one set of hyperparameters,
    test the model on a set of dates, and evaluate the performance of the model. Repeat
    the process for other parameters and choose the best alternative (or use Bayesian
    optimization).


    The second major option is when the model is updated (retrained) at each rebalancing.
    The underlying idea here is that the structure of returns evolves through time
    and a dynamic model will capture the most recent trends. The drawback is that
    validation must (should?) be rerun at each rebalancing date.


    +   Let us recall the dimensions of backtests:

    +   - number of **strategies**: possibly dozens or hundreds, or even more;

    +   - number of trading **dates**: hundreds for monthly rebalancing;

    +   - number of **assets**: hundreds or thousands;

    +   - number of **features**: dozens or hundreds.


    Even with a lot of computational power (GPUs, etc.), training many models over
    many dates is time-consuming, especially when it comes to hyperparameter tuning
    when the parameter space is large. Thus, validating models at each trading date
    of the out-of-sample period is not realistic.


    One solution is to keep an early portion of the training data and to perform a
    smaller scale validation on this subsample. Hyperparameters are tested on a limited
    number of dates and most of the time, they exhibit stability: satisfactory parameters
    for one date are usually acceptable for the next one and the following one as
    well. Thus, the full backtest can be carried out with these values when updating
    the models at each period. The backtest nonetheless remains compute-intensive
    because the model has to be retrained with the most recent data for each rebalancing
    date.'
