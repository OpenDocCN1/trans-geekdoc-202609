- pgno: 41
  md: 'where the vector $\boldsymbol{r}$ stacks all returns of all stocks and $\boldsymbol{x}$
    is a lagged variable so that the regression is indeed predictive. If the estimate
    $\hat{b}$ is significant given a specified threshold, then it can be tempting
    to conclude that $\boldsymbol{x}$ does a good job at predicting returns. Hence,
    long-short portfolios related to extreme values of $\boldsymbol{x}$ (mind the
    sign of $\hat{b}$) are expected to generate profits. This is unfortunately often
    false because $\hat{b}$ gives information on the past* ability of $\boldsymbol{x}$
    to forecast returns. What happens in the future may be another story.


    Statistical tests are also used for portfolio sorts. Assume two extreme portfolios
    are expected to yield very different average returns (like very small cap versus
    very large cap, or strong winners versus bad losers). The portfolio returns are
    written $r_t^+$ and $r_t^-$. The simplest test for the mean is $t = \sqrt{T} \frac{m_{r^+}
    - m_{r^-}}{\sigma_{r_+ - r_-}}$, where $T$ is the number of points and $m_{r_\pm}$
    denotes the means of returns and $\sigma_{r_+ - r_-}$ is the standard deviation
    of the difference between the two series, i.e., the volatility of the long-short
    portfolio. In short, the statistic can be viewed as a scaled Sharpe ratio (though
    usually these ratios are computed for long-only portfolios) and can in turn be
    used to compute $p$-values to assess the robustness of an anomaly. As is shown
    in Linnainmaa and Roberts (2018) and Hou et al. (2020), many factors discovered
    by researchers fail to survive in out-of-sample tests.


    One reason why people are overly optimistic about anomalies they detect is the
    widespread reverse interpretation of the $p$-value. Often, it is thought of as
    the probability of one hypothesis (e.g., my anomaly exists) given the data. In
    fact, it’s the opposite; it’s the likelihood of your data sample, knowing that
    the anomaly holds.


    $p - \text{value} = P[D|H]$


    \(\text{target prob.} = P[H|D] = \frac{P[D|H]}{P[D]} \times P[H],\)


    where $H$ stands for hypothesis and $D$ for data. The equality in the second row
    is a plain application of Bayes’ identity: the interesting probability is in fact
    a transform of the $p$-value.


    Two articles (at least) discuss this idea. Harvey (2017) introduces **Bayesianized**
    $p$-values:


    \(\text{Bayesianized } p - \text{value} = \text{Bpv} = e^{-t^2/2} \times \frac{\text{prior}}{1
    + e^{-t^2/2} \times \text{prior}}, \quad (3.3)\)


    where $t$ is the $t$-statistic obtained from the regression (i.e., the one that
    defines the $p$-value) and prior is the analyst’s estimation of the odds that
    the hypothesis (anomaly) is true. The prior is coded as follows. Suppose there
    is a p% chance that the null holds (i.e., (1-p)% for the anomaly). The odds are
    coded as $p/(1-p)$. Thus, if the $t$-statistic is equal to 2 (corresponding to
    a $p$-value of 5% roughly) and the prior odds are equal to 6, then the Bpv is
    equal to $e^{-2} \times 6 \times (1 + e^{-2} \times 6)^{-1} \approx 0.448$ and
    there is a 44.8% chance that the null is true. This interpretation stands in sharp
    contrast with the original $p$-value which cannot be viewed as a probability that
    the null holds. Of course, one drawback is that the level of the prior is crucial
    and solely user-specified.


    The work of Chinco et al. (2020) is very different but shares some key concepts,
    like the introduction of Bayesian priors in regression outputs. They show that
    coercing the predictive regression with an $L^2$ constraint (see the ridge regression
    in Chapter 5) amounts to introducing views on what the true distribution of $b$
    is. The stronger the constraint, the more the estimate $\hat{b}$ will be shrunk
    towards zero. One key idea in their work is the assumption of a distribution for
    the true $b$ across many anomalies. It is assumed to be Gaussian and centered.
    The interesting parameter is the standard deviation: the larger it is, the more
    frequently significant anomalies are discovered. Notably, the authors show that'
