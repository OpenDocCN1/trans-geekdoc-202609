- pgno: 165
  md: '# 10

    Validating and tuning


    As is shown in Chapters 5 to 11, ML models require user-specified choices before
    they can be trained. These choices encompass parameter values (learning rate,
    penalization intensity, etc.) or architectural choices (e.g., the structure of
    a network). Alternative designs in ML engines can lead to different predictions,
    hence selecting a good one can be critical. We refer to the work of Probst et
    al. (2018) for a study on the impact of hyperparameter tuning on model performance.
    For some models (neural networks and boosted trees), the number of degrees of
    freedom is so large that finding the right parameters can become complicated and
    challenging. This chapter addresses these issues but the reader must be aware
    that there is no shortcut to building good models. Crafting an effective model
    is time-consuming and often the result of many iterations.


    # 10.1 Learning metrics


    The parameter values that are set before training are called hyperparameters.
    In order to be able to choose good hyperparameters, it is imperative to define
    metrics that evaluate the performance of ML models. As is often the case in ML,
    there is a dichotomy between models that seek to predict numbers (regressions)
    and those that try to forecast categories (classifications). Before we outline
    common evaluation benchmarks, we mention the econometric approach of Li et al.
    (2020). The authors propose to assess the performance of a forecasting method
    compared to a given benchmark, conditional on some external variable. This helps
    monitor under which (economic) conditions the model beats the benchmark. The full
    implementation of the test is intricate, and we recommend the interested reader
    have a look at the derivations in the paper.


    # 10.1.1 Regression analysis


    Errors in regression analyses are usually evaluated in a straightforward way.
    The L^1 and L^2 norms are mainstream; they are both easy to interpret and to compute.
    The second one, the root mean squared error (RMSE) is differentiable everywhere
    but harder to grasp and gives more weight to outliers. The first one, the mean
    absolute error gives the average'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'distance to the realized value but is not differentiable at zero. Formally,
    we define them as


    ```

    MAE(\mathbf{y}, \tilde{\mathbf{y}}) = \frac{1}{I} \sum_{i=1}^I |y_i - \tilde{y}_i|,
    \quad (10.1)

    ```


    ```

    MSE(\mathbf{y}, \tilde{\mathbf{y}}) = \frac{1}{I} \sum_{i=1}^I (y_i - \tilde{y}_i)^2,
    \quad (10.2)

    ```


    and the RMSE is simply the square root of the MSE. It is always possible to generalize
    these formulae by adding weights $w_i$ to produce heterogeneity in the importance
    of instances. Let us briefly comment on the MSE. It is by far the most common
    loss function in machine learning, but it is not necessarily the exact best choice
    for return prediction in a portfolio allocation task. If we decompose the loss
    into its 3 terms, we get the sum of squared realized returns, the sum of squared
    predicted returns and the product between the two (roughly speaking, a covariance
    term if we assume zero means). The first term does not matter. The second controls
    the dispersion around zero of the predictions. The third term is the most interesting
    from the allocator''s standpoint. The negativity of the cross-product \(-2y_i\tilde{y}_i\)
    is always to the investor''s benefit: either both terms are positive and the model
    has recognized a profitable asset, or they are negative and it has identified
    a bad opportunity. It is when \(y_i\) and \(\tilde{y}_i\) don''t have the same
    sign that problems arise. Thus, compared to the \(\tilde{y}_i^2\), the cross-term
    is more important. Nonetheless, algorithms do not optimize with respect to this
    indicator.


    These metrics (MSE and RMSE) are widely used outside ML to assess forecasting
    errors. Below, we present other indicators that are also sometimes used to quantify
    the quality of a model. In line with the linear regressions, the \(R^2\) can be
    computed in any predictive exercise.


    ```

    R^2(\mathbf{y}, \tilde{\mathbf{y}}) = 1 - \frac{\sum_{i=1}^I (y_i - \tilde{y}_i)^2}{\sum_{i=1}^I
    (y_i - \bar{y})^2}, \quad (10.3)

    ```


    where \(\bar{y}\) is the sample average of the label. One important difference
    with the classical \(R^2\) is that the above quantity can be computed on the testing
    sample and not on the training sample. In this case, the \(R^2\) can be negative
    when the mean squared error in the numerator is larger than the (biased) variance
    of the testing sample. Sometimes, the average value \(\bar{y}\) is omitted in
    the denominator (as in Gu et al. (2020b) for instance). The benefit of removing
    the average value is that it compares the predictions of the model to a zero prediction.
    This is particularly relevant with returns because the simplest prediction of
    all is the constant zero value and the \(R^2\) can then measure if the model beats
    this naive benchmark. A zero prediction is always preferable to a sample average
    because the latter can be very much period dependent. Also, removing \(\bar{y}\)
    in the denominator makes the metric more conservative as it mechanically reduces
    the \(R^2\).


    Beyond the simple indicators detailed above, several exotic extensions exist and
    they all consist in altering the error before taking the averages. Two notable
    examples are the Mean Absolute Percentage Error (MAPE) and the Mean Square Percentage
    Error (MSPE). Instead of looking at the raw error, they compute the error relative
    to the original value (to be predicted). Hence, the error is expressed in a percentage
    score and the averages are simply equal to:'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'MAPE(\mathbf{y}, \tilde{\mathbf{y}}) = \frac{1}{I} \sum_{i=1}^{I} \frac{y_i
    - \tilde{y}_i}{y_i} ,


    MSPE(\mathbf{y}, \tilde{\mathbf{y}}) = \frac{1}{I} \sum_{i=1}^{I} (\frac{y_i -
    \tilde{y}_i}{y_i})^2 ,


    where the latter can be scaled by a square root if need be. When the label is
    positive with possibly large values, it is possible to scale the magnitude of
    errors, which can be very large. One way to do this is to resort to the Root Mean
    Squared Logarithmic Error (RMSLE), defined below:


    RMSLE(\mathbf{y}, \tilde{\mathbf{y}}) = \sqrt{\frac{1}{I} \sum_{i=1}^{I} \log
    \frac{1 + y_i}{1 + \tilde{y}_i}} ,


    where it is obvious that when \(y_i = \tilde{y}_i\), the error metric is equal
    to zero.


    Before we move on to categorical losses, we briefly comment on one shortcoming
    of the MSE, which is by far the most widespread metric and objective in regression
    tasks. A simple decomposition yields:


    MSE(\mathbf{y}, \tilde{\mathbf{y}}) = \frac{1}{I} \sum_{i=1}^{I} (y_i^2 + \tilde{y}_i^2
    - 2y_i\tilde{y}_i) .


    In the sum, the first term is given, there is nothing to be done about it, hence
    models focus on the minimization of the other two. The second term is the dispersion
    of model values. The third term is a cross-product. While variations in \(\tilde{y}_i\)
    do matter, the third term is by far the most important, especially in the cross-section.
    It is more valuable to reduce the MSE by increasing \(y_i\tilde{y}_i\). This product
    is indeed positive when the two terms have the same sign, which is exactly what
    an investor is looking for: correct directions for the bets. For some algorithms
    (like neural networks), it is possible to manually specify custom losses. Maximizing
    the sum of \(y_i\tilde{y}_i\) may be a good alternative to vanilla quadratic optimization
    (see Section 7.4.3 for an example of implementation).


    # 10.1.2 Classification analysis


    The performance metrics for categorical outcomes are substantially different compared
    to those of numerical outputs. A large proportion of these metrics are dedicated
    to binary classes, though some of them can easily be generalized to multiclass
    models.


    We present the concepts pertaining to these metrics in an increasing order of
    complexity and start with the two dichotomies true versus false and positive versus
    negative. In binary classification, it is convenient to think in terms of true
    versus false. In an investment setting, true can be related to a positive return,
    or a return being above that of a benchmark - false being the opposite.


    There are then 4 types of possible results for a prediction. Two when the prediction
    is right (predict true with true realization or predict false with false outcome)
    and two when the prediction is wrong (predict true with false realization and
    the opposite). We define the corresponding aggregate metrics below:'
  merge: -1
  img_proc: true
- pgno: 168
  md: '+   - frequency of true positive: \( TP = I^{-1} \sum_{i=1}^I 1_{\{y_i=\tilde{y}_i=1\}}
    \),

    +   - frequency of true negative: \( TN = I^{-1} \sum_{i=1}^I 1_{\{y_i=\tilde{y}_i=0\}}
    \),

    +   - frequency of false positive: \( FP = I^{-1} \sum_{i=1}^I 1_{\{\tilde{y}_i=1,
    y_i=0\}} \),

    +   - frequency of false negative: \( FN = I^{-1} \sum_{i=1}^I 1_{\{\tilde{y}_i=0,
    y_i=1\}} \),


    where true is conventionally encoded into 1 and false into 0. The sum of the four
    figures is equal to one. These four numbers have very different impacts on out-of-sample
    results, as is shown in Figure 10.1. In this table (also called a **confusion
    matrix**), it is assumed that some proxy for future profitability is forecast
    by the model. Each row stands for the model''s prediction and each column for
    the realization of the profitability. The most important cases are those in the
    top row, when the model predicts a positive result because it is likely that assets
    with positive predicted profitability (possibly relative to some benchmark) will
    end up in the portfolio. Of course, this is not a problem if the asset does well
    (left cell), but it becomes penalizing if the model is wrong because the portfolio
    will suffer.


    ![](img/8861a37f775d09b4ba7a5151f604d9f5_168_0.png)


    # FIGURE 10.1: Confusion matrix: summary of binary outcomes.


    Among the two types of errors, **type I** is the most daunting for investors because
    it has a direct effect on the portfolio. The **type II** error is simply a missed
    opportunity and is somewhat less impactful. Finally, true negatives are those
    assets which are correctly excluded from the portfolio.


    From the four baseline rates, it is possible to derive other interesting metrics:


    +   - **Accuracy** = \( TP + TN \) is the percentage of correct forecasts;

    +   - **Recall** = \(\frac{TP}{TP+FN}\) measures the ability to detect a winning
    strategy/asset (left column analysis). Also known as sensitivity or true positive
    rate (TPR);

    +   - **Precision** = \(\frac{TP}{TP+FP}\) computes the probability of good investments
    (top row analysis);

    +   - **Specificity** = \(\frac{TN}{FP+TN}\) measures the proportion of actual
    negatives that are correctly identified as such (right column analysis);

    +   - **Fallout** = \(\frac{FP}{FP+TN} = 1-\text{Specificity}\) is the probability
    of false alarm (or false positive rate), i.e., the frequence at which the algorithm
    detects falsely performing assets (right column analysis);

    +   - **F-score**, \( F_1 = 2\frac{\text{recall}\times\text{precision}}{\text{recall}+\text{precision}}
    \) is the harmonic average of recall and precision.


    All of these items lie in the unit interval and a model is deemed to perform better
    when'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'they increase (except for fallout for which it is the opposite). Many other
    indicators also exist, like the false discovery rate or false omission rate, but
    they are not as mainstream and less cited. Moreover, they are often simple functions
    of the ones mentioned above.


    A metric that is popular but more complex is the Area Under the (ROC) Curve, often
    referred to as AUC. The complicated part is the ROC curve where ROC stands for
    Receiver Operating Characteristic; the name comes from signal theory. We explain
    how it is built below.


    As seen in Chapters 6 and 7, classifiers generate output that are probabilities
    that one instance belongs to one class. These probabilities are then translated
    into a class by choosing the class that has the highest value. In binary classification,
    the class with a score above 0.5 basically wins.


    In practice, this 0.5 threshold may not be optimal and the model could very well
    correctly predict false instances when the probability is below 0.4 and true ones
    otherwise. Hence, it is a just idea to test what happens if the decision threshold
    changes. The ROC curve does just that and plots the recall as a function of the
    fallout when the threshold increases from zero to one.


    When the threshold is equal to 0, true positives are equal to zero because the
    model never forecasts positive values. Thus, both recall and fallout are equal
    to zero. When the threshold is equal to one, false negatives shrink to zero and
    true negatives too, hence recall and fallout are equal to one. The behavior of
    their relationship in between these two extremes is called the ROC curve. We provide
    stylized examples below in Figure 10.2. A random classifier would fare equally
    good for recall and fallout and thus the ROC curve would be a linear line from
    the point (0,0) to (1,1). To prove this, imagine a sample with a \(p \in (0, 1)\)
    proportion of true instances and a classifier that predicts true randomly with
    a probability \(p'' \in (0, 1)\). Then because the sample and predictions are
    independent, \(TP = p''p\), \(FP = p''(1 - p)\), \(TN = (1 - p'')(1 - p)\) and
    \(FN = (1 - p'')p\). Given the above definition, this yields that both recall
    and fallout are equal to \(p''\).


    ![](img/8861a37f775d09b4ba7a5151f604d9f5_169_0.png)


    **FIGURE 10.2:** Stylized ROC curves.


    An algorithm with a ROC curve above the 45° angle is performing better than an
    average'
  merge: -1
  img_proc: true
