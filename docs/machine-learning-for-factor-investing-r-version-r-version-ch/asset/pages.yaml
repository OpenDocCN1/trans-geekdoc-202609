- pgno: 106
  md: '# 6.4.5 Extensions


    Several additional features are available to further prevent boosted trees to
    overfit. Indeed, given a sufficiently large number of trees, the aggregation is
    able to match the training sample very well, but may fail to generalize well out-of-sample.


    Following the pioneering work of Srivastava et al. (2014), the DART (Dropout for
    Additive Regression Trees) model was proposed by Rashmi and Gilad-Bachrach (2015).
    The idea is to omit a specified number of trees during training. The trees that
    are removed from the model are chosen randomly. The full specifications can be
    found at https://xgboost.readthedocs.io/en/latest/tutorials/dart.html and we use
    a 10% dropout in the first example below..


    Monotonicity constraints are another element that is featured both in xgboost
    and lightgbm. Sometimes, it is expected that one particular feature has a monotonic
    impact on the label. For instance, if one deeply believes in momentum, then past
    returns should have an increasing impact on future returns (in the cross-section
    of stocks).


    Given the recursive nature of the splitting algorithm, it is possible to choose
    when to perform a split (according to a particular variable) and when not to.
    In Figure 6.6, we show how the algorithm proceeds. All splits are performed according
    to the same feature. For the first split, things are easy because it suffices
    to verify that the averages of each cluster are ranked in the right direction.
    Things are more complicated for the splits that occur below. Indeed, the average
    values set by all above splits matter as they give bounds for acceptable values
    for the future average values in lower splits. If a split violates these bounds,
    then it is overlooked and another variable will be chosen instead.


    # 6.4.6 Code and results


    In this section, we train a model using the XGBoost library. Other options include
    catboost, gbm, lightgbm, and h2o’s own version of boosted machines. Unlike many
    other packages, the XGBoost function requires a particular syntax and dedicated
    formats. The first step is thus to encapsulate the data accordingly.


    Moreover, because training times can be long, we shorten the training sample as
    advocated in Coqueret and Guida (2020). We retain only the 40% most extreme observations
    (in terms of label values: top 20% and bottom 20%) and work with the small subset
    of features. In all


    ![](img/8861a37f775d09b4ba7a5151f604d9f5_106_0.png)


    **FIGURE 6.6:** Imposing monotonic constraints. The constraints are shown in bold
    blue in the bottom leaves.'
  merge: -1
