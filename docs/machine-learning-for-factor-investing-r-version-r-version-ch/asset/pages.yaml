- pgno: 151
  md: '# 9.2 Bayesian sampling


    # 9.2.1 Gibbs sampling


    One adjacent field of applications of Bayes'' theorem is **simulation**. Suppose
    we want to simulate the multivariate distribution of a random vector **X** given
    by its density \(p = p(x_1, \dots, x_J)\). Often, the full distribution is complex,
    but its marginals are more accessible. Indeed, they are simpler because they depend
    on only one variable (when all other values are known):


    \(p(X_j = x_j | X_1 = x_1, \dots, X_{j-1} = x_{j-1}, X_{j+1} = x_{j+1}, \dots,
    X_J = x_J) = p(X_j = x_j | \mathbf{X}_{-j} = \mathbf{x}_{-j}),\)


    where we use the compact notation \(\mathbf{X}_{-j}\) for all variables except
    \(X_j\). One way to generate samples with law \(p\) is the following and relies
    both on the knowledge of the conditionals \(p(x_j | \mathbf{x}_{-j})\) and on
    the notion of **Markov Chain Monte Carlo**, which we outline below. The process
    is iterative and assumes that it is possible to draw samples of the aforementioned
    conditionals. We write \(x_j^m\) for the \(m^{th}\) sample of the \(j^{th}\) variable
    \((X_j)\). The simulation starts with a prior (or fixed, or random) sample \(\mathbf{x}^0
    = (x_1^0, \dots, x_J^0)\). Then, for a sufficiently large number of times, say
    \(T\), new samples are drawn according to


    ```

    \(x_1^{m+1} = p(X_1|X_2 = x_2^m, \dots, X_J = x_J^m);\)

    \(x_2^{m+1} = p(X_2|X_1 = x_1^{m+1}, X_3 = x_3^m, \dots, X_J = x_J^m);\)

    \(\dots\)

    \(x_J^{m+1} = p(X_J|X_1 = x_1^{m+1}, X_2 = x_2^{m+1}, \dots, X_{J-1} = x_{J-1}^{m+1}).\)

    ```


    The important detail is that after each line, the value of the variable is updated.
    Hence, in the second line, \(X_2\) is sampled with the knowledge of \(X_1 = x_1^{m+1}\)
    and in the last line, all variables except \(X_J\) have been updated to their
    \((m+1)^{th}\) state. The above algorithm is called Gibbs sampling. It relates
    to Markov chains because each new iteration depends only on the previous one.


    Under some technical assumptions, as \(T\) increases, the distribution of \(\mathbf{x}_T\)
    converges to that of \(p\). The conditions under which the convergence occurs
    have been widely discussed in series of articles in the 1990s. The interested
    reader can have a look for instance at Tierney (1994), Roberts and Smith (1994),
    as well as at section 11.7 of Gelman et al. (2013).


    Sometimes, the full distribution is complex and the conditional laws are hard
    to determine and to sample. Then, a more general method, called Metropolis-Hastings,
    can be used that relies on the rejection method for the simulation of random variables.


    # 9.2.2 Metropolis-Hastings sampling


    The Gibbs algorithm can be considered as a particular case of the Metropolis-Hastings
    (MH) method, which, in its simplest version, was introduced in Metropolis and
    Ulam (1949). The premise is similar: the aim is to simulate random variables that
    follow \(p(\mathbf{x})\) with the ability to sample from a simpler form \(p(\mathbf{x}|\mathbf{y})\)
    which gives the probability of the future state **x**, given the past one **y**.'
