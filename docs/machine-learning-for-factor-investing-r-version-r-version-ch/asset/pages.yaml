    \ 6.2.1 Principle\n\nMost of the time, when having several modelling options at\
    \ hand, it is not obvious upfront which individual model is the best, hence a\
    \ combination seems a reasonable path towards the diversification of prediction\
    \ errors (when they are not too correlated). Some theoretical foundations of model\
    \ diversification were laid out in Schapire (1990).\n\nMore practical considerations\
    \ were proposed later in Ho (1995) and more importantly in Breiman (2001) which\
    \ is the major reference for random forests. There are two ways to create multiple\
    \ predictors from simple trees, and random forests combine both:\n\n+   • first,\
    \ the model can be trained on similar yet different datasets. One way to achieve\
    \ this is via bootstrap: the instances are resampled with or without replacement\
    \ (for each individual tree), yielding new training data each time a new tree\
    \ is built.\n\n+   • second, the data can be altered by curtailing the number\
