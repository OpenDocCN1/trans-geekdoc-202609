  md: '# # 1

    Notations and data


    # ## 1.1 Notations


    This section aims at providing the formal mathematical conventions that will be
    used throughout the book.


    Bold notations indicate vectors and matrices. We use capital letters for matrices
    and lower case letters for vectors. v'' and M'' denote the transposes of v and
    M. M = [m]_i,j, where i is the row index and j the column index.


    We will work with two notations in parallel. The first one is the pure machine
    learning notation in which the labels (also called output, dependent variables
    or predicted variables) y = y_i are approximated by functions of features X_i
    = (x_{i,1}, ..., x_{i,K}). The dimension of the feature matrix X is I x K: there
    are I instances, records, or observations and each one of them has K attributes,
    features, inputs, or predictors which will serve as independent and explanatory
    variables (all these terms will be used interchangeably). Sometimes, to ease notations,
    we will write x_i for one instance (one row) of X or x_k for one (feature) column
    vector of X.


    The second notation type pertains to finance and will directly relate to the first.
    We will often work with discrete returns r_{t,n} = p_{t,n}/p_{t-1,n} - 1 computed
    from price data. Here t is the time index and n the asset index. Unless specified
    otherwise, the return is always computed over one period, though this period can
    sometimes be one month or one year. Whenever confusion might occur, we will specify
    other notations for returns.


    In line with our previous conventions, the number of return dates will be T and
    the number of assets, N. The features or characteristics of assets will be denoted
    with x_{t,n}^{(k)}: it is the time-t value of the k^{th} attribute of firm or
    asset n. In stacked notation, x_{t,n} will stand for the vector of characteristics
    of asset n at time t. Moreover, r_t stands for all returns at time t while r_n
    stands for all returns of asset n. Often, returns will play the role of the dependent
    variable, or label (in ML terms). For the riskless asset, we will use the notation
    r_{t,f}.


    The link between the two notations will most of the time be the following. One
    instance (or observation) i will consist of one couple (t, n) of one particular
    date and one particular firm (if the data is perfectly rectangular with no missing
    field, I = T x N). The label will usually be some performance measure of the firm
    computed over some future period, while the features will consist of the firm
    attributes at time t. Hence, the purpose of the machine learning engine in factor
    investing will be to determine the model that maps the time-t characteristics
    of firms to their future performance.


    In terms of canonical matrices: I_N will denote the (N x N) identity matrix.


    From the probabilistic literature, we employ the expectation operator E[.] and
    the conditional expectation E_t[.], where the corresponding filtration F_t corresponds
    to all information'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'available at time $t$. More precisely, $\mathbb{E}_t[\cdot] = \mathbb{E}[\cdot|\mathcal{F}_t]$.
    $\mathbb{V}[\cdot]$ will denote the variance operator. Depending on the context,
    probabilities will be written simply $P$, but sometimes we will use the heavier
    notation $\mathbb{P}$. Probability density functions (pdfs) will be denoted with
    lowercase letters ($f$) and cumulative distribution functions (cdfs) with uppercase
    letters ($F$). We will write equality in distribution as $X \stackrel{d}{=} Y$,
    which is equivalent to $F_X(z) = F_Y(z)$ for all $z$ on the support of the variables.
    For a random process $X_t$, we say that it is **stationary** if the law of $X_t$
    is constant through time, i.e., $X_t \stackrel{d}{=} X_s$, where $\stackrel{d}{=}$
    means equality in distribution. Sometimes, asymptotic behaviors will be characterized
    with the usual Landau notation $o(\cdot)$ and $O(\cdot)$. The symbol $\propto$
    refers to proportionality: $x \propto y$ means that $x$ is proportional to $y$.
    With respect to derivatives, we use the standard notation $\frac{\partial}{\partial
    x}$ when differentiating with respect to $x$. We resort to the compact symbol
    $\nabla$ when all derivatives are computed (gradient vector). In equations, the
    left-hand side and right-hand side can be written more compactly: l.h.s. and r.h.s.,
    respectively.


    +   Finally, we turn to functions. We list a few below:

    +   - $1_{\{x\}}$: the indicator function of the condition $x$, which is equal
    to one if $x$ is true and to zero otherwise.

    +   - $\phi(\cdot)$ and $\Phi(\cdot)$ are the standard Gaussian pdf and cdf.

    +   - $\text{card}(\cdot) = \#(\cdot)$ are two notations for the cardinal function
    which evaluates the number of elements in a given set (provided as argument of
    the function).

    +   - $\lfloor \cdot \rfloor$ is the integer part function.

    +   - for a real number $x$, $[x]^+$ is the positive part of $x$, that is $\max(0,
    x)$.

    +   - $\tanh(\cdot)$ is the hyperbolic tangent: $\tanh(x) = \frac{e^x - e^{-x}}{e^x
    + e^{-x}}.$

    +   - $\text{ReLu}(\cdot)$ is the rectified linear unit: $\text{ReLu}(x) = \max(0,
    x)$.

    +   - $s(\cdot)$ will be the softmax function: $s(\mathbf{x})_i = \frac{e^{x_i}}{\sum_{j=1}^J
    e^{x_j}}$, where the subscript $i$ refers to the $i^{th}$ element of the vector.


    # 1.2 Dataset


    Throughout the book, and for the sake of **reproducibility**, we will illustrate
    the concepts we present with examples of implementation based on a single financial
    dataset available at https://github.com/shokru/mlfactor.github.io/tree/master/material.
    This dataset comprises information on 1,207 stocks listed in the US (possibly
    originating from Canada or Mexico). The time range starts in November 1998 and
    ends in March 2019. For each point in time, 93 **characteristics** describe the
    firms in the sample. These attributes cover a wide range of topics:


    +   • **valuation** (earning yields, accounting ratios);

    +   • **profitability** and quality (return on equity);

    +   • **momentum** and technical analysis (past returns, relative strength index);

    +   • **risk** (volatilities);'
