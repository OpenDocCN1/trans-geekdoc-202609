- pgno: 32
  md: '+   - The no-free lunch theorem of Wolpert (1992a) imposes that the analyst
    formulates views on the model. This is why economic or **econometric framing**
    is key. The assumptions and choices that are made regarding both the dependent
    variables and the explanatory features are decisive. As a corollary, data is key.
    The inputs given to the models are probably much more important than the choice
    of the model itself.

    +   - To maximize out-of-sample efficiency, the right question is probably to
    paraphrase Jeff Bezos: what''s not going to change? **Persistent** series are
    more likely to unveil enduring patterns.

    +   - Everybody makes mistakes. Errors in loops or variable indexing are part
    of the journey. What matters is to **learn** from those lapses.


    To conclude, we remind the reader of this obvious truth: nothing will ever replace
    **practice**. Gathering and cleaning data, coding backtests, tuning ML models,
    testing weighting schemes, debugging, starting all over again: these are all absolutely
    indispensable steps and tasks that must be repeated indefinitely. There is no
    sustitute to experience.'
