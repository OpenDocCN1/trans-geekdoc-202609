    The two variables have a close to monotonic impact on future returns. Returns,
    on average, decrease with market capitalization (thereby corroborating the so-called
    *size effect*). The reverse pattern is less pronounced for volatility: the curve
    is rather flat for the first half of volatility scores and progressively increases,
    especially over the last quintile of volatility values (thereby contradicting
    the low-volatility anomaly).


    One important empirical property of features is **autocorrelation** (or absence
    thereof). A high level of autocorrelation for one predictor makes it plausible
    to use simple imputation techniques when some data points are missing. But autocorrelation
    is also important when moving towards prediction tasks and we discuss this issue
    shortly below in Section 4.6. In Figure 4.3, we build the histogram of autocorrelations,
    computed stock-by-stock and feature-by-feature.


    ```

    autocorrs <- data_ml %>%

    dplyr::select(c("stock_id", features)) %>%

    gather(key = feature, value = value, -stock_id) %>

    % group_by(stock_id, feature) %>%

    summarize(acf = acf(value, lag.max = 1, plot = FALSE)$acf[2])

    autocorrs %>% ggplot(aes(x = acf)) + xlim(-0.1,1) +

    geom_histogram(bins = 60)

    ```'
