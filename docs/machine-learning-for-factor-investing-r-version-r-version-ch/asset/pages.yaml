    # 4.2 Missing data


    Similarly to any empirical discipline, portfolio management is bound to face missing
    data issues. The topic is well known and several books detail solutions to this
    problem (e.g., Allison (2001), Enders (2010), Little and Rubin (2014) and Van
    Buuren (2018)). While researchers continuously propose new methods to cope with
    absent points (Honaker and King (2010) or Che et al. (2018) to cite but a few),
    we believe that a simple, heuristic treatment is usually sufficient as long as
    some basic cautious safeguards are enforced.


    First of all, there are mainly two ways to deal with missing data: **removal**
    and **imputation**. Removal is agnostic but costly, especially if one whole instance
    is eliminated because of only one missing feature value. Imputation is often preferred
    but relies on some underlying and potentially erroneous assumption.


    A simplified classification of imputation is the following:


    +   - A basic imputation choice is the median (or mean) of the feature for the
    stock over the past available values. If there is a trend in the time series,
    this will nonetheless alter the trend. Relatedly, this method can be forward-looking,
    unless the training and testing sets are treated separately.


    +   - In time series contexts with views towards backtesting, the most simple
    imputation comes from previous values: if $x_t$ is missing, replace it with $x_{t-1}$.
    This makes sense most of the time because past values are all that is available
    and are by definition backward-looking. However, in some particular cases, this
    may be a very bad choice (see words of caution below).'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# 4.2 Missing data


    Medians and means can also be computed over the **cross-section** of assets. This
    roughly implies that the missing feature value will be relocated in the bulk of
    observed values. When many values are missing, this creates an atom in the distribution
    of the feature and alters the original distribution. One advantage is that this
    imputation is not forward-looking.


    +   Many techniques rely on some modelling assumptions for the data generating
    process. We refer to nonparametric approaches (Stekhoven and Bühlmann (2011) and
    Shah et al. (2014)), which rely on random forests, see Chapter 6, Bayesian imputation
    (Schafer (1999)), maximum likelihood approaches (Enders (2001), Enders (2010)),
    interpolation or extrapolation and nearest neighbor algorithms (García-Laencina
    et al. (2009)). More generally, the four books cited at the begining of the subsection
    detail many such imputation processes. Advanced techniques are much more demanding
    computationally.


    A few words of caution:


    +   Interpolation should be avoided at all cost. Accounting values or ratios that
    are released every quarter must never be linearly interpolated for the simple
    reason that this is forward-looking. If numbers are disclosed in January and April,
    then interpolating February and March requires the knowledge of the April figure,
    which, in live trading will not be known. Resorting to past values is a better
    way to go.


    +   Nevertheless, there are some feature types for which imputation from past
    values should be avoided. First of all, returns should not be replicated. By default,
    a superior choice is to set missing return indicators to zero (which is often
    close to the average or the median). A good indicator that can help the decision
    is the persistence of the feature through time. If it is highly autocorrelated
    (and the time series plot create a smooth curve, like for market capitalization),
    then imputation from the past can make sense. If not, then it should be avoided.


    +   There are some cases that can require more attention. Let us consider the
    following fictitious sample of dividend yield:


    # TABLE 4.1: Challenges with chronological imputation.


    | Date | Original yield | Replacement value |

    |---|---|---|

    | 2015-02 | NA | preceding (if it exists) |

    | 2015-03 | 0.02 | untouched (none) |

    | 2015-04 | NA | 0.02 (previous) |

    | 2015-05 | NA | 0.02 (previous) |

    | 2015-06 | NA | <= **Problem**! |


    In this case, the yield is released quarterly, in March, June, September, etc.
    But in June, the value is missing. The problem is that we cannot know if it is
    missing because of a genuine data glitch, or because the firm simply did not pay
    any dividends in June. Thus, imputation from past value may be erroneous here.
    There is no perfect solution but a decision must nevertheless be taken. For dividend
    data, three options are:


    +   1) Keep the previous value. In R, the function na.locf() from the *zoo* package
    is incredibly efficient for this task.


    +   2) Extrapolate from previous observations (this is very different from **interpolation**):'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'for instance, evaluate a trend on past data and pursue that trend.


    +   3) Set the value to zero. This is tempting but may be sub-optimal due to dividend
    smoothing practices from executives (see for instance Leary and Michaely (2011)
    and Chen et al. (2012) for details on the subject). For persistent time series,
    the first two options are probably better.


    Tests can be performed to evaluate the relative performance of each option. It
    is also important to **remember** these design choices. There are so many of them
    that they are easy to forget. Keeping track of them is obviously compulsory. In
    the ML pipeline, the **scripts** pertaining to data preparation are often key
    because they do not serve only once!


    # ## 4.3 Outlier detection


    The topic of outlier detection is also well documented and has its own surveys
    (Hodge and Austin (2004), Chandola et al. (2009) and Gupta et al. (2014)) and
    a few dedicated books (Aggarwal (2013) and Rousseeuw and Leroy (2005), though
    the latter is very focused on regression analysis).


    Again, incredibly sophisticated methods may require a lot of efforts for possibly
    limited gain. Simple heuristic methods may suffice, as long as they are documented
    in the process, may suffice. They often rely on ‘hard’ thresholds:


    +   • for one given feature (possibly filtered in time), any point outside the
    interval $[\mu - m\sigma, \mu + m\sigma]$ can be deemed an outlier. Here \(\mu\)
    is the mean of the sample and \(\sigma\) the standard deviation. The multiple
    value \(m\) usually belongs to the set \(\{3, 5, 10\}\), which is of course arbitrary.

    +   • likewise, if the largest value is above \(m\) times the second-to-largest,
    then it can also be classified as an outlier (the same reasoning applied for the
    other side of the tail).

    +   • finally, for a given small threshold \(q\), any value outside the \([q,
    1-q]\) quantile range can be considered outliers.


    This latter idea was popularized by **winsorization**. Winsorizing amounts to
    setting to \(x^{(q)}\) all values below \(x^{(q)}\) and to \(x^{(1-q)}\) all values
    above \(x^{(1-q)}\). The winsorized variable \(\tilde{x}_i\) is:


    ```

    \(\tilde{x}_i = \begin{cases} x_i & \text{if } x_i \in [x^{(q)}, x^{(1-q)}] \quad
    (\text{unchanged}) \\ x^{(q)} & \text{if } x_i < x^{(q)} \\ x^{(1-q)} & \text{if
    } x_i > x^{(1-q)} \end{cases}.\)

    ```


    The range for \(q\) is usually (0.5%, 5%) with 1% and 2% being the most often
    used.


    The winsorization stage **must** be performed on a feature-by-feature and a date-by-date
    basis. However, keeping a time series perspective is also useful. For instance,
    a $800B market capitalization may seems out of range, except when looking at the
    history of Apple’s capitalization.


    We conclude this subsection by recalling that *true* outliers (i.e., extreme points
    that are not due to data extraction errors) are valuable because they are likely
    to carry important information.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# # 4.4 Feature engineering


    Feature engineering is a very important step of the portfolio construction process.
    Computer scientists often refer to the saying “garbage in, garbage out”. It is
    thus paramount to prevent the ML engine of the allocation to be trained on ill-designed
    variables. We invite the interested reader to have a look at the recent work of
    Kuhn and Johnson (2019) on this topic. The (shorter) academic reference is Guyon
    and Elisseeff (2003).


    # ## 4.4.1 Feature selection


    The first step is selection. Given a large set of predictors, it seems a sound
    idea to filter out unwanted or redundant exogenous variables. Heuristically, simple
    methods include:


    +   - computing the correlation matrix of all features and making sure that no
    (absolute) value is above a threshold (0.7 is a common value) so that redundant
    variables do not pollute the learning engine;

    +   - carrying out a linear regression and removing the non significant variables
    (e.g., those with p-value above 0.05).

    +   - perform a clustering analysis over the set of features and retain only one
    feature within each cluster (see Chapter 15).


    Both these methods are somewhat reductive and overlook nonlinear relationships.
    Another approach would be to fit a decision tree (or a random forest) and retain
    only the features that have a high variable importance. These methods will be
    developed in Chapter 6 for trees and Chapter 13 for variable importance.


    # ## 4.4.2 Scaling the predictors


    The premise of the need to pre-process the data comes from the large variety of
    scales in financial data:


    +   - returns are most of the time smaller than one in absolute value;

    +   - stock volatility lies usually between 5% and 80%;

    +   - market capitalization is expressed in million or billion units of a particular
    currency;

    +   - accounting values as well;

    +   - accounting ratios can have inhomogeneous units;

    +   - synthetic attributes like sentiment also have their idiosyncrasies.


    While it is widely considered that monotonic transformations of the features have
    a marginal impact on prediction outcomes, Galili and Meilijson (2016) show that
    this is not always the case (see also Section 4.8.2). Hence, the choice of normalization
    may in fact very well matter.


    If we write xi for the raw input and x̃i for the transformed data, common scaling
    practices include:


    +   - standardization: x̃i = (xi − mx)/σx, where mx and σx are the mean and standard
    deviation of x, respectively;'
  merge: -1
  img_proc: true
- pgno: 62
  md: '+   - min-max rescaling over [0,1]: \(\tilde{x}_i = (x_i - \min(\mathbf{x}))/(\max(\mathbf{x})
    - \min(\mathbf{x}))\);

    +   - min-max rescaling over [-1,1]: \(\tilde{x}_i = 2\frac{x_i - \min(\mathbf{x})}{\max(\mathbf{x})
    - \min(\mathbf{x})} - 1\);

    +   - uniformization: \(\tilde{x}_i = F_{\mathbf{x}}(x_i)\), where \(F_{\mathbf{x}}\)
    is the empirical c.d.f. of \(\mathbf{x}\). In this case, the vector \(\tilde{\mathbf{x}}\)
    is defined to follow a uniform distribution over [0,1].


    Sometimes, it is possible to apply a logarithmic transform of variables with both
    large values (market capitalization) and large outliers. The scaling can come
    after this transformation. Obviously, this technique is prohibited for features
    with negative values.


    It is often advised to scale inputs so that they range in [0,1] before sending
    them through the training of neural networks for instance. The dataset that we
    use in this book is based on variables that have been uniformized: for each point
    in time, the cross-sectional distribution of each feature is uniform over the
    unit interval. In factor investing, the scaling of features must be **operated
    separately for each date and each feature**. This point is critical. It makes
    sure that for every rebalancing date, the predictors will have a similar shape
    and do carry information on the cross-section of stocks.


    Uniformization is sometimes presented differently: for a given characteristic
    and time, characteristic values are ranked and the rank is then divided by the
    number of non-missing points. This is done in Freyberger et al. (2020) for example.
    In Kelly et al. (2019), the authors perform this operation but then subtract 0.5
    to all features so that their values lie in [-0.5,0.5].


    Scaling features across dates should be proscribed. Take for example the case
    of market capitalization. In the long run (market crashes notwithstanding), this
    feature increases through time. Thus, scaling across dates would lead to small
    values at the beginning of the sample and large values at the end of the sample.
    This would completely alter and dilute the cross-sectional content of the features.


    # 4.5 Labelling


    # 4.5.1 Simple labels


    There are several ways to define labels when constructing portfolio policies.
    Of course, the finality is the portfolio weight, but it is rarely considered as
    the best choice for the label.$^1$


    Usual labels in factor investing are the following:


    +   - raw asset returns;

    +   - future relative returns (versus some benchmark: market-wide index, or sector-based
    portfolio for instance). One simple choice is to take returns minus a cross-sectional
    mean or median;

    +   - the probability of positive return (or of return above a specified threshold);'
  merge: -1
  img_proc: true
- pgno: 63
  md: '+   - the probability of outperforming a benchmark (computed over a given time
    frame);

    +   - the binary version of the above: YES (outperforming) versus NO (underperforming);

    +   - risk-adjusted versions of the above: Sharpe ratios, information ratios,
    MAR or CALMAR ratios (see Section 12.3).


    When creating binary variables, it is often tempting to create a test that compares
    returns to zero (profitable versus non profitable). This is not optimal because
    it is very much time-dependent. In good times, many assets will have positive
    returns, while in market crashes, few will experience positive returns, thereby
    creating very unbalanced classes. It is a better idea to split the returns in
    two by comparing them to their time-_t_ median (or average). In this case, the
    indicator is relative and the two classes are much more balanced.


    As we will discuss later in this chapter, these choices still leave room for additional
    degrees of freedom. Should the labels be rescaled, just like features are processed?
    What is the best time horizon on which to compute performance metrics?


    # 4.5.2 Categorical labels


    In a typical ML analysis, when _y_ is a proxy for future performance, the ML engine
    will try to minimize some distance between the predicted value and the realized
    values. For mathematical convenience, the sum of squared error (_L_<sup>2</sup>
    norm) is used because it has the simplest derivative and makes gradient descent
    accessible and easy to compute.


    Sometimes, it can be interesting not to focus on raw performance proxies, like
    returns or Sharpe ratios, but on discrete investment decisions, which can be derived
    from these proxies. A simple example (decision rule) is the following:


    ```

    y_{t,i} = \left\{\begin{array}{ c c }

    -1 & \text{if } \hat{r}_{t,i} < r_- \\

    0 & \text{if } \hat{r}_{t,i} \in [r_-, r_+] \\

    +1 & \text{if } \hat{r}_{t,i} > r_+

    \end{array}\right., \quad (4.2)

    ```


    where \(\hat{r}_{t,i}\) is the performance proxy (e.g., returns or Sharpe ratio)
    and \(r_\pm\) are the decision thresholds. When the predicted performance is below
    _r_<sub>-</sub>, the decision is -1 (e.g., _sell_), when it is above _r_<sub>+</sub>,
    the decision is +1 (e.g., _buy_) and when it is in the middle (the model is neither
    very optimistic nor very pessimistic), then the decision is neutral (e.g., _hold_).
    The performance proxy can of course be relative to some benchmark so that the
    decision is directly related to this benchmark. It is often advised that the thresholds
    \(r_\pm\) be chosen such that the three categories are relatively balanced, that
    is, so that they end up having a comparable number of instances.


    In this case, the final output can be considered as categorical or numerical because
    it belongs to an important subgroup of categorical variables: the ordered categorical
    (**ordinal**) variables. If _y_ is taken as a number, the usual regression tools
    apply.


    When _y_ is treated as a non-ordered (**nominal**) categorical variable, then
    a new layer of processing is required because ML tools only work with numbers.
    Hence, the categories must be recoded into digits. The mapping that is most often
    is used called ‘**one-hot encoding**’. The vector of classes is split in a sparse
    matrix in which each column is dedicated to one class. The matrix is filled with
    zeros and ones. A one is allocated to the column corresponding to the class of
    the instance. We provide a simple illustration in the table below.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# TABLE 4.2: Concise example of one-hot encoding.


    | Initial data | One-hot encoding |

    | :--- | :--- |

    | Position | Sell | Hold | Buy |

    | buy | 0 | 0 | 1 |

    | buy | 0 | 0 | 1 |

    | hold | 0 | 1 | 0 |

    | sell | 1 | 0 | 0 |

    | buy | 0 | 0 | 1 |


    In classification tasks, the output has a larger dimension. For each instance,
    it gives the probability of belonging to each class assigned by the model. As
    we will see in Chapters 6 and 7, this is easily handled via the softmax function.


    From the standpoint of allocation, handling categorical predictions is not necessarily
    easy. For long-short portfolios, plus or minus one signals can provide the sign
    of the position. For long-only portfolio, two possible solutions: (i) work with
    binary classes (in versus out of the portfolio) or (ii) adapt weights according
    to the prediction: zero weight for a -1 prediction, 0.5 weight for a 0 prediction
    and full weight for a +1 prediction. Weights are then of course normalized so
    as to comply with the budget constraint.


    # 4.5.3 The triple barrier method


    We conclude this section with an advanced labelling technique mentioned in De
    Prado (2018). The idea is to consider the full dynamics of a trading strategy
    and not a simple performance proxy. The rationale for this extension is that often
    money managers implement P&L triggers that cash in when gains are sufficient or
    opt out to stop their losses. Upon inception of the strategy, three barriers are
    fixed (see Figure 4.4):


    +   - one above the current level of the asset (magenta line), which measures
    a reasonable expected profit;


    +   - one below the current level of the asset (cyan line), which acts as a stop-loss
    signal to prevent large negative returns;


    +   - and finally, one that fixes the horizon of the strategy after which it will
    be terminated (black line).


    If the strategy hits the first (resp. second) barrier, the output is +1 (resp.
    -1), and if it hits the last barrier, the output is equal to zero or to some linear
    interpolation (between -1 and +1) that represents the position of the terminal
    value relative to the two horizontal barriers. Computationally, this method is
    **much** more demanding, as it evaluates a whole trajectory for each instance.
    Again, it is nonetheless considered as more realistic because trading strategies
    are often accompanied with automatic triggers such as stop-loss, etc.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '![](img/8861a37f775d09b4ba7a5151f604d9f5_65_0.png)


    FIGURE 4.4: Illustration of the triple barrier method.


    # 4.5.4 Filtering the sample


    One of the main challenges in Machine Learning is to extract as much **signal**
    as possible. By signal, we mean patterns that will hold out-of-sample. Intuitively,
    it may seem reasonable to think that the more data we gather, the more signal
    we can extract. This is in fact false in all generality because more data also
    means more noise. Surprisingly, filtering the training samples can improve performance.
    This idea was for example implemented successfully in Fu et al. (2018), Guida
    and Coqueret (2018a) and Guida and Coqueret (2018b).


    In Coqueret and Guida (2020), we investigate why smaller samples may lead to superior
    out-of-sample accuracy for a particular type of ML algorithm: decision trees (see
    Chapter 6). We focus on a particular kind of filter: we exclude the labels (e.g.,
    returns) that are not extreme and retain the 20% values that are the smallest
    and the 20% that are the largest (the bulk of the distribution is removed). In
    doing so, we alter the structure of trees in two ways:


    +   - when the splitting points are altered, they are always closer to the center
    of the distribution of the splitting variable (i.e., the resulting clusters are
    more balanced and possibly more robust);


    +   - the choice of splitting variables is (sometimes) pushed towards the features
    that have a monotonic impact on the label.


    These two properties are desirable. The first reduces the risk of fitting to small
    groups of instances that may be spurious. The second gives more importance to
    features that appear globally more relevant in explaining the returns. However,
    the filtering must not be too intense. If, instead of retaining 20% of each tail
    of the predictor, we keep just 10%, then the loss in signal becomes too severe
    and the performance deteriorates.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# ## 4.5.5 Return horizons


    This subsection deals with one of the least debated issues in factor-based machine
    learning models: horizons. Several horizons come into play during the whole ML-driven
    allocation workflow: the **horizon of the label**, the **estimation window** (chronological
    depth of the training samples) and the **holding periods**. One early reference
    that looks at these aspects is the founding academic paper on momentum by Jegadeesh
    and Titman (1993). The authors compute the profitability of portfolios based on
    the returns over the past \(J = 3, 6, 9, 12\) months. Four holding periods are
    tested: \(K = 3, 6, 9, 12\) months. They report: “_The most successful zero-cost
    (long-short) strategy selects stocks based on their returns over the previous
    12 months and then holds the portfolio for 3 months._” While there is no machine
    learning whatsoever in this contribution, it is possible that their conclusion
    that horizons matter may also hold for more sophisticated methods. This topic
    is in fact much discussed, as is shown by the continuing debate on the impact
    of horizons in momentum profitability (see, e.g., Novy-Marx (2012), Gong et al.
    (2015) and Goyal and Wahal (2015)).


    This debate should also be considered when working with ML algorithms. The issues
    of estimation windows and holding periods are mentioned later in the book, in
    Chapter 12. Naturally, in the present chapter, the horizon of the label is the
    important ingredient. Heuristically, there are four possible combinations if we
    consider only one feature for simplicity:


    +   1. oscillating label and feature;

    +   2. oscillating label, smooth feature (highly autocorrelated);

    +   3. smooth label, oscillating feature;

    +   4. smooth label and feature.


    Of all of these options, the last one is probably preferable because it is more
    robust, all things being equal.\(^2\) By _all things being equal_, we mean that
    in each case, a model is capable of extracting some relevant pattern. A pattern
    that holds between two slowly moving series is more likely to persist in time.
    Thus, since features are often highly autocorrelated (cf Figure 4.3), combining
    them with smooth labels is probably a good idea. To illustrate how critical this
    point is, we will purposefully use 1-month returns in most of the examples of
    the book and show that the corresponding results are often disappointing. These
    returns are very weakly autocorrelated while 6-month or 12-month returns are much
    more persistent and are better choices for labels.


    Theoretically, it is possible to understand why that may be the case. For simplicity,
    let us assume a single feature \(x\) that explains returns \(r\): \(r_{t+1} =
    f(x_t) + e_{t+1}\). If \(x_t\) is highly autocorrelated and the noise embeded
    in \(e_{t+1}\) is not too large, then the two-period ahead return \((1+r_{t+1})(1+r_{t+2})
    - 1\) may carry more signal than \(r_{t+1}\) because the relationship with \(x_t\)
    has diffused and compounded through time. Consequently, it may also be beneficial
    to embed memory considerations directly into the modelling function, as is done
    for instance in Dixon (2020). We discuss some practicalities related to autocorrelations
    in the next section.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# ## 4.6 Handling persistence


    While we have separated the steps of feature engineering and labelling in two
    different subsections, it is probably wiser to consider them jointly. One important
    property of the dataset processed by the ML algorithm should be the consistency
    of persistence between features and labels. Intuitively, the autocorrelation patterns
    between the label \( y_{t,n} \) (future performance) and the features \( x_{t,n}^{(k)}
    \) should not be too distant.


    One problematic example is when the dataset is sampled at the monthly frequency
    (not unusual in the money management industry) with the labels being monthly returns
    and the features being risk-based or fundamental attributes. In this case, the
    label is very weakly autocorrelated, while the features are often highly autocorrelated.
    In this situation, most sophisticated forecasting tools will arbitrage between
    features which will probably result in a lot of noise. In linear predictive models,
    this configuration is known to generate bias in estimates (see the study of Stambaugh
    (1999) and the review by Gonzalo and Pitarakis (2018)).


    Among other more technical options, there are two simple solutions when facing
    this issue: either introduce autocorrelation into the label, or remove it from
    the features. Again, the first option is not advised for statistical inference
    on linear models. Both are rather easy econometrically:


    +   - to increase the autocorrelation of the label, compute performance over longer
    time ranges. For instance, when working with monthly data, considering annual
    or biennial returns will do the trick.

    +   - to get rid of autocorrelation, the shortest route is to resort to differences/variations:
    \(\Delta x_{t,n}^{(k)} = x_{t,n}^{(k)} - x_{t-1,n}^{(k)}\). One advantage of this
    procedure is that it makes sense, economically: variations in features may be
    better drivers of performance, compared to raw levels.


    A mix between persistent and oscillating variables in the feature space is of
    course possible, as long as it is driven by economic motivations.


    # ## 4.7 Extensions


    # ## 4.7.1 Transforming features


    The feature space can easily be augmented through simple operations. One of them
    is lagging, that is, considering older values of features and assuming some memory
    effect for their impact on the label. This is naturally useful mostly if the features
    are oscillating (adding a layer of memory on persistent features can be somewhat
    redundant). New variables are defined by \(\breve{x}_{t,n}^{(k)} = x_{t-1,n}^{(k)}\).


    In some cases (e.g., insufficient number of features), it is possible to consider
    ratios or products between features. Accounting ratios like price-to-book, book-to-market,
    debt-to-equity are examples of functions of raw features that make sense. The
    gains brought by a'
