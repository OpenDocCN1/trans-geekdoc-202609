    covariance matrix is singular. Thus, we have a small heuristic shrinkage term.
    For a more rigorous treatment of this technique, we refer to the original article
    Ledoit and Wolf (2004) and to the recent improvements mentioned in Ledoit and
    Wolf (2017). In short, we use $\hat{\Sigma} = \Sigma_S + \delta I$ for some small
    constant $\delta$ (equal to 0.01 in the code below).


    ```

    weights_multi <- function(returns, j, alpha, lambda){

    N <- ncol(returns)

    if(j == 1){ # j = 1 => EW

    return(rep(1/N,N))

    }

    if(j == 2){ # j = 2 => Minimum Variance

    sigma <- cov(returns) + 0.01 * diag(N) # Covariance matrix + regularizing term

    w <- solve(sigma) %*% rep(1,N) # Inverse & multiply

    return(w / sum(w)) # Normalize

    }

    if(j == 3){ # j = 3 => Penalised / elasticnet

    w <- weights_sparsehedge(returns, alpha, lambda)

    }

    }

    ```


    Finally, we proceed to the backtesting loop. Given the number of assets, the execution
    of the loop takes a few minutes. At the end of the loop, we compute the standard
    deviation of portfolio returns (monthly volatility). This is the key indicator
    as minimum variance seeks to minimize this particular metric.


    ```

    for(t in 1:length(t_oos)){ # Loop = rebal. dates

    temp_data <- returns %>% # Data for weights

    filter(date < t_oos[t]) %>% # Expand. window

    dplyr::select(-date) %>%

    as.matrix()

    realised_returns <- returns %>% # OOS returns

    filter(date == t_oos[t]) %>%

    dplyr::select(-date)

    for(j in 1:nboot){ # Loop over strats

    portf_weights[t,j,] <- weights_multi(temp_data, j, 0.1, 0.1) # Hard-coded params!

    portf_returns[t,j] <- sum(portf_weights[t,j,] * realised_returns) # Portf. returns

    }

    }

    colnames(portf_returns) <- c("EW", "MV", "Sparse") # Colnames

    apply(portf_returns, 2, sd) # Portfolio volatilities (monthly scale)

    ```


    ```

    ## EW MV Sparse

    ## 0.04180422 0.03350424 0.02672169

    ```


    The aim of the sparse hedging restrictions is to provide a better estimate of
    the covariance structure of assets so that the estimation of minimum variance
    portfolio weights is more accurate. From the above exercise, we see that the monthly
    volatility is indeed reduced when building covariance matrices based on sparse
