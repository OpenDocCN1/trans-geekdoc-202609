  md: "\\(\\frac{\\partial D(\\tilde{y}_i)}{\\partial w_{k,j}^{(L)}} = \\frac{\\partial\
    \ D(\\tilde{y}_i)}{\\partial v_{i,k}^{(L)}} \\frac{\\partial v_{i,k}^{(L)}}{\\\
    partial w_{k,j}^{(L)}} = \\frac{\\partial D(\\tilde{y}_i)}{\\partial v_{i,k}^{(L)}}\
    \ o_{i,j}^{(L-1)} \\quad (7.6)\\)\n\n\\(= \\frac{\\partial D(\\tilde{y}_i)}{\\\
    partial o_{i,k}^{(L)}} \\frac{\\partial o_{i,k}^{(L)}}{\\partial v_{i,k}^{(L)}}\
    \ o_{i,j}^{(L-1)} = \\frac{\\partial D(\\tilde{y}_i)}{\\partial o_{i,k}^{(L)}}\
    \ (f^{(L)})'(v_{i,k}^{(L)}) o_{i,j}^{(L1)} \\quad (7.7)\\)\n\n\\(= \\underbrace{D'(\\\
    tilde{y}_i) f^{(L+1)\\prime}}_{computed \\ above!} v_{i,k}^{(L+1)} w_k^{(L+1)}\
    \ (f^{(L)})'(v_{i,k}^{(L)}) o_{i,j}^{(L-1)}, \\quad (7.8)\\)\n\nwhere, as we show\
    \ in the last line, one part of the derivative was already computed in the previous\
    \ step (Equation (7.4)). Hence, we can recycle this number and only focus on the\
    \ right part of the expression.\n\nThe magic of the so-called back-propagation\
    \ is that this will hold true for each step of the differentiation. When computing\
    \ the gradient for weights and biases in layer $l$, there will be two parts: one\
    \ that can be recycled from previous layers and another, local part, that depends\
    \ only on the values and activation function of the current layer. A nice illustration\
    \ of this process is given by the Google developer team: playground.tensorflow.org.\n\
    \nWhen the data is formatted using tensors, it is possible to resort to vectorization\
    \ so that the number of calls is limited to an order of the magnitude of the number\
    \ of nodes (units) in the network.\n\nThe back-propagation algorithm can be summarized\
    \ as follows. Given a sample of points (possibly just one):\n\n+   1. the data\
    \ flows from left as is described in Figure 7.6. The blue arrows show the **forward\
    \ pass**;\n+   \n+   2. this allows the computation of the error or loss function;\n\
    +   \n+   3. all derivatives of this function (w.r.t. weights and biases) are\
    \ computed, starting from the last layer and diffusing to the left (hence the\
    \ term back-propagation) - the green arrows show the **backward pass**;\n+   \n\
    +   4. all weights and biases can be updated to take the sample points into account\
    \ (the model is adjusted to reduce the loss/error stemming from these points)."
