- pgno: 271
  md: 'makes sure that the magnitude of this direction is not too large. The update
    rule in (16.8) is often referred to as ‘temporal difference’ learning because
    it is driven by the improvement yielded by estimates that are known at time t
    + 1 (target) versus those known at time t.


    One important step of the Q-learning sequence (**QL**) is the second one where
    the action $a_i$ is picked. In RL, the best algorithms combine two features: **exploitation**
    and **exploration**. Exploitation is when the machine uses the current information
    at its disposal to choose the next action. In this case, for a given state $s_i$,
    it chooses the action $a_i$ that maximizes the expected reward $Q_i(s_i, a_i)$.
    While obvious, this choice is not optimal if the current function $Q_i$ is relatively
    far from the *true Q*. Repeating the locally optimal strategy is likely to favor
    a limited number of actions, which will narrowly improve the accuracy of the Q
    function.


    In order to gather new information stemming from actions that have not been tested
    much (but that can potentially generate higher rewards), exploration is needed.
    This is when an action $a_i$ is chosen randomly. The most common way to combine
    these two concepts is called $\epsilon$-greedy exploration. The action $a_i$ is
    assigned according to:


    ```

    $$a_i = \begin{cases} \argmax_a Q_i(s_i, a) & \text{with probability } 1 - \epsilon
    \\ \text{randomly (uniformly) over } \mathcal{A} & \text{with probability } \epsilon
    \end{cases} \quad (16.10)$$

    ```


    Thus, with probability $\epsilon$, the algorithm explores and with probability
    $1 - \epsilon$, it exploits the current knowledge of the expected reward and picks
    the best action. Because all actions have a non-zero probability of being chosen,
    the policy is called “soft”. Indeed, then best action has a probability of selection
    equal to $1 - \epsilon(1 - \text{card}(\mathcal{A})^{-1})$, while all other actions
    are picked with probability $\epsilon/\text{card}(\mathcal{A})$.


    # 16.1.3 SARSA


    In Q-learning, the algorithm seeks to find the action-value function of the optimal
    policy. Thus, the policy that is followed to pick actions is different from the
    one that is learned (via Q). Such algorithms are called *off-policy*. On-policy
    algorithms seek to improve the estimation of the action-value function $q_\pi$
    by continuously acting according to the policy $\pi$. One canonical example of
    on-policy learning is the SARSA method which requires two consecutive states and
    actions **SARSA**. The way the quintuple $(S_t, A_t, R_{t+1}, S_{t+1}, A_{t+1})$
    is processed is presented below.


    The main difference between Q learning and SARSA is the update rule. In SARSA,
    it is given by


    ```

    $$Q_{i+1}(s_i, a_i) \longleftarrow Q_i(s_i, a_i) + \eta (r_{i+1} + \gamma Q_i(s_{i+1},
    a_{i+1}) - Q_i(s_i, a_i)) \quad (16.11)$$

    ```


    The improvement comes only from the **local** point $Q_i(s_{i+1}, a_{i+1})$ that
    is based on the new states and actions $(s_{i+1}, a_{i+1})$, whereas in Q-learning,
    it comes from all possible actions of which only the best retained $\max_a Q_i(s_{i+1},
    a)$.


    A more robust but also more computationally demanding version of SARSA is *expected
    SARSA* in which the target Q function is averaged over all actions:


    ```

    $$Q_{i+1}(s_i, a_i) \longleftarrow Q_i(s_i, a_i) + \eta \quad r_{i+1} + \gamma
    \sum_a \pi(a, s_{i+1}) Q_i(s_{i+1}, a) - Q_i(s_i, a_i) \quad (16.12)$$

    ```'
