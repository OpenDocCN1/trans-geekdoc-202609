    The representation of the tree is different, compared to those seen in Chapter
    6. Indeed, the four possible outcomes (determined by the conditions in the top
    lines) no longer yield a simple value (average of the label), but more information
    is given, in the form of a box plot (including the interquartile range and outliers).
    In the above representation, it is the top right cluster that seems to have the
    highest rewards, with especially many upward outliers. This cluster consists of
    small firms with volatile past returns.


    # 13.1.2 Variable importance (tree-based)


    One incredibly favorable feature of simple decision trees is their interpretability.
    Their visual representation is clear and straightforward. Just like regressions
    (which are another building block in ML), simple trees are easy to comprehend
    and do not suffer from the black-box rebuke that is often associated with more
    sophisticated tools.


    Indeed, both random forests and boosted trees fail to provide perfectly accurate
    accounts of what is happening inside the engine. In contrast, it is possible to
    compute the aggregate share (or importance) of each feature in the determination
    of the structure of the tree once it has been trained.


    After training, it is possible to compute, at each node n the gain G(n) obtained
    by the subsequent split if there are any, i.e., if the node is not a terminal
    leaf. It is also easy to determine which variable is chosen to perform the split,
    hence we write N_k the set of nodes for which feature k is chosen for the partition.
    Then, the global importance of each feature is given by


    $$I(k) = \sum_{n \in \mathcal{N}_k} G(n),$$'
