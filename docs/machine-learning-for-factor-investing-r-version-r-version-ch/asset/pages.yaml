- pgno: 68
  md: 'larger spectrum of features are not obvious. The risk of overfitting increases,
    just like in a simple linear regression adding variables mechanically increases
    the \( R^2 \). The choices must make sense, economically.


    Another way to increase the feature space (mentioned above) is to consider variations.
    Variations in sentiment, variations in book-to-market ratio, etc., can be relevant
    predictors because sometimes, the change is more important than the level. In
    this case, a new predictor is \(\bar{x}_{t,n}^{(k)} = x_{t,n}^{(k)} - x_{t-1,n}^{(k)}\).


    # 4.7.2 Macro-economic variables


    Finally, we discuss a very important topic. The data should never be separated
    from the context it comes from (its environment). In classical financial terms,
    this means that a particular model is likely to depend on the overarching situation
    which is often proxied by macro-economic indicators. One way to take this into
    account at the data level is simply to multiply the feature by an exogenous indicator
    \( z_t \) and in this case, the new predictor is


    ```

    \(\bar{x}_{t,n}^{(k)} = z_t \times x_{t,n}^{(k)}\) (4.3)

    ```


    This technique is used by Gu et al. (2020b) who use 8 economic indicators (plus
    the original predictors (\( z_t = 1 \))). This increases the feature space ninefold.


    Another route that integrates shifting economic environments is conditional engineering.
    Suppose that labels are coded via formula (4.2). The thresholds can be made dependent
    on some exogenous variable. In times of turbulence, it might be a good idea to
    increase both \( r_+ \) (buy threshold) and \( r_- \) (sell threshold) so that
    the labels become more conservative: it takes a higher return to make it to the
    buy category, while short positions are favored. One such example of dynamic thresholding
    could be


    ```

    \( r_{t,\pm} = r_{\pm} \times e^{\pm \delta (\text{VIX}_t - \bar{\text{VIX}})},
    \) (4.4)

    ```


    where VIX\(_t\) is the time-\(t\) value of the VIX, while \(\bar{\text{VIX}}\)
    is some average or median value. When the VIX is above its average and risk seems
    to be increasing, the thresholds also increase. The parameter \(\delta\) tunes
    the magnitude of the correction. In the above example, we assume \( r_- < 0 <
    r_+ \).


    # 4.7.3 Active learning


    We end this section with the notion of active learning. To the best of our knowledge,
    it is not widely used in quantitative investment, but the underlying concept is
    enlightening, hence we dedicate a few paragraphs to this notion for the sake of
    completeness.


    In general supervised learning, there is sometimes an asymmetry in the ability
    to gather features versus labels. For instance, it is free to have access to images,
    but the labelling of the content of the image (e.g., "a dog", "a truck", "a pizza",
    etc.) is costly because it requires humlan annotation. In formal terms, **X**
    is cheap but the corresponding **y** is expensive.


    As is often the case when facing cost constraints, an evident solution is greed.
    Ahead of the usual learning process, a filter (often called query) is used to
    decide which data to label and train on (possibly in relationship with the ML
    algorithm). The labelling is performed by a'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'so-called *oracle* (which/who knows the truth), usually human. This technique
    that focuses on the most informative instances is referred to as **active learning**.
    We refer to the surveys of Settles (2009) and Settles (2012) for a detailed account
    of this field (which we briefly summarize below). The term **active** comes from
    the fact that the learner does not passively accept data samples but actively
    participates in the choices of items it learns from.


    One major dichotomy in active learning pertains to the data source **X** on which
    the query is based. One obvious case is when the original sample **X** is very
    large and not labelled and the learner asks for particular instances within this
    sample to be labelled. The second case is when the learner has the ability to
    simulate/generate its own values **x**_i_. This can sometimes be problematic if
    the oracle does not recognize the data that is generated by the machine. For instance,
    if the purpose is to label images of characters and numbers, the learner may generate
    shapes that do not correspond to any letter or digit: the oracle cannot label
    it.


    In active learning, one key question is, how does the learner choose the instances
    to be labelled? Heuristically, the answer is by picking those observations that
    maximize learning efficiency. In binary classification, a simple criterion is
    the probability of belonging to one particular class. If this probability is far
    from 0.5, then the algorithm will have no difficulty of picking one class (even
    though it can be wrong). The interesting case is when the probability is close
    to 0.5: the machine may hesitate for this particular instance. Thus, having the
    oracle label it is useful in this case because it helps the learner in a configuration
    in which it is undecided.


    Other methods seek to estimate the fit that can be obtained when including particular
    (new) instances in the training set, and then to optimize this fit. Recalling
    Section 3.1 in Geman et al. (1992) on the variance-bias tradeoff, we have, for
    a training dataset $D$ and one instance $x$ (we omit the bold font for simplicity),


    ```

    \mathbb{E} \left[ (y - \hat{f}(x; D))^2 \mid \{D, x\} \right] = \mathbb{E} \left[
    \underbrace{(y - \mathbb{E}[y|x])^2}_{\text{indep. from } D \text{ and } \hat{f}}
    \mid \{D, x\} \right] + (\hat{f}(x; D) - \mathbb{E}[y|x])^2,

    ```


    where the notation $f(x; D)$ is used to highlight the dependence between the model
    $\hat{f}$ and the dataset $D$: the model has been trained on $D$. The first term
    is irreducible, as it does not depend on $\hat{f}$. Thus, only the second term
    is of interest. If we take the average of this quantity, taken over all possible
    values of $D$:


    ```

    \mathbb{E}_D \left[ (\hat{f}(x; D) - \mathbb{E}[y|x])^2 \right] = \underbrace{\left(
    \mathbb{E}_D \left[ \hat{f}(x; D) - \mathbb{E}[y|x] \right] \right)^2}_{\text{squared
    bias}} + \underbrace{\mathbb{E}_D \left[ (\hat{f}(x, D) - \mathbb{E}_D[\hat{f}(x;
    D)])^2 \right]}_{\text{variance}}

    ```


    If this expression is not too complicated to compute, the learner can query the
    $x$ that minimizes the tradeoff. Thus, on average, this new instance will be the
    one that yields the best learning angle (as measured by the $L^2$ error). Beyond
    this approach (which is limited because it requires the oracle to label the possibly
    irrelevant instance), many other criteria exist for querying and we refer to section
    3 from Settles (2009) for an exhaustive list.


    One final question: is active learning applicable to factor investing? One straightforward
    answer is that data cannot be annotated by human intervention. Thus, the learners
    cannot simulate their own instances and ask for corresponding labels. One possible
    option is to provide the learner with $\mathbf{X}$ but not $\mathbf{y}$ and keep
    only a queried subset of observations with the corresponding labels. In spirit,
    this is close to what is done in Coqueret and Guida (2020) except that the query
    is not performed by a machine but by the human user. Indeed, it is'
  merge: -1
  img_proc: true
