    # 5.2 Sparse hedging for minimum variance portfolios


    # 5.2.1 Presentation and derivations


    The idea of constructing sparse portfolios is not new per se (see, e.g., Brodie
    et al. (2009), Frastrich et al. (2015)) and the link with the selective property
    of the LASSO is rather straightforward in classical quadratic programs. Note that
    the choice of the \(L^1\) norm is imperative because when enforcing a simple \(L^2\)
    norm, the diversification of the portfolio increases (see Coqueret (2015)).


    The idea behind this section stems from Goto and Xu (2015) but the cornerstone
    result was first published by Stevens (1998) and we present it below. We provide
    details because the derivations are not commonplace in the literature.


    In usual mean-variance allocations, one core ingredient is the inverse covariance
    matrix of assets \(\Sigma^{-1}\). For instance, the maximum Sharpe ratio (MSR)
    portfolio is given by


    ```

    \(\mathbf{w}^{\text{MSR}} = \frac{\Sigma^{-1}\mu}{\mathbf{1}''\Sigma^{-1}\mu},\)

    (5.8)

    ```'
