  md: '![](img/8861a37f775d09b4ba7a5151f604d9f5_94_0.png)


    # FIGURE 6.2: Simple characteristics-based tree. The dependent variable is the
    1 month future return.


    There usually exists a convention in the representation of trees. At each node,
    a condition describes the split with a Boolean expression. If the expression is
    **true**, then the instance goes to the **left cluster**; if not, it goes to the
    **right** cluster. Given the whole sample, the initial split in this tree (Figure
    6.2) is performed according to the price-to-book ratio. If the Pb score (or value)
    of the instance is above 0.025, then the instance is placed in the left bucket;
    otherwise, it goes in the **right bucket**.


    At each node, there are two important metrics. The first one is the average value
    of the label in the cluster, and the second one is the proportion of instances
    in the cluster. At the top of the tree, all instances (100%) are present and the
    average 1-month future return is 1.3%. One level below, the left cluster is by
    far the most crowded, with roughly 98% of observations averaging a 1.2% return.
    The right cluster is much smaller (2%) but concentrates instances with a much
    higher average return (5.9%). This is possibly an idiosyncrasy of the sample.


    The splitting process continues similarly at each node until some condition is
    satisfied (typically here: the maximum depth is reached). A color codes the average
    return: from white (low return) to blue (high return). The leftmost cluster with
    the lowest average return consists of firms that satisfy all the following criteria:


    +   - have a Pb score above 0.025;

    +   - have a 3-month market capitalization score above 0.16;

    +   - have a score of average daily volume over the past 3 months above 0.085.


    Notice that one peculiarity of trees is their possible heterogeneity in cluster
    sizes. Sometimes, a few clusters gather almost all of the observations while a
    few small groups embed some outliers. This is not a favorable property of trees,
    as small groups are more likely to be flukes and may fail to generalize out-of-sample.'
