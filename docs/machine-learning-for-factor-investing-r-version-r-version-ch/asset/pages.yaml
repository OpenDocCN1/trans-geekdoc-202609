- pgno: 101
  md: '# TABLE 6.1: Examples of functions for Adaboost-like algorithms.


    | | Bin. classif. (orig. Adaboost) | Regression (Drucker (1997)) |

    |---|---|---|

    | Individual error | \(\epsilon_i = \mathbf{1}_{\{y_i \neq l_m(\mathbf{x}_i)\}}\)
    | \(\epsilon_i = \frac{|y_i - l_m(\mathbf{x}_i)|}{\max_i |y_i - l_m(\mathbf{x}_i)|}\)
    |

    | Weight of learner via \(f_a\) | \(f_a = \log \frac{1-\epsilon}{\epsilon}\),
    with \(\epsilon = I^{-1} \sum_{i=1}^I w_i \epsilon_i\) | \(f_a = \log \frac{1-\epsilon}{\epsilon}\),
    with \(\epsilon = I^{-1} \sum_{i=1}^I w_i \epsilon_i\) |

    | Weight of instances via \(f_w(i)\) | \(f_w = f_a \epsilon_i\) | \(f_w = f_a
    \epsilon_i\) |

    | Output function via \(f_y\) | \(f_y(x) = \text{sign}(x)\) | weighted median
    of predictions |


    Let us comment on the original Adaboost specification. The basic error term \(\epsilon_i
    = \mathbf{1}_{\{y_i \neq l_m(\mathbf{x}_i)\}}\) is a dummy number indicating if
    the prediction is correct (we recall only two values are possible, +1 and -1).
    The average error \(\epsilon \in [0, 1]\) is simply a weighted average of individual
    errors and the move of the \(m^{th}\) learner defined in Equation (6.2) is given
    by \(a_m = \log \frac{1-\epsilon}{\epsilon}\) . The function \(x \mapsto \log((1-x)^{-1})\)
    decreases on \([0, 1]\) and switches sign (from positive to negative) at \(x =
    1/2\). Hence, when the average error is small, the learner has a large positive
    weight, but when the error becomes large, the learner can even obtain a negative
    weight. Indeed, the threshold \(\epsilon > 1/2\) indicated that the learner is
    wrong more than 50% of the time. Obviously, this indicates a problem and the learner
    should even be discarded.


    The change in instance weights follows a similar logic. The new weight is proportional
    to \(w_i \frac{1-\epsilon}{\epsilon}\) . If the prediction is right and \(\epsilon_i
    = 0\), the weight is unchanged. If the prediction is wrong and \(\epsilon_i =
    1\), the weight is adjusted depending on the average error \(\epsilon\). If the
    error is small and the learner efficient (\(\epsilon < 1/2\)), then \((1-\epsilon)/\epsilon
    > 1\) and the weight of the instance increases. This means that for the next round,
    the learner will have to focus more on instance \(i\).


    Lastly, the final prediction of the model corresponds to the sign of the weighted
    sums of individual predictions: if the sum is positive, the model will predict
    +1 and it will yield -1 otherwise. The odds of a zero sum are negligible. In the
    case of numerical labels, the process is slightly more complicated and we refer
    to Section 3, step 8 of Drucker (1997) for more details on how to proceed.


    We end this presentation with one word on instance weighting. There are two ways
    to deal with this topic. The first one works at the level of the loss functions.
    For regression trees, Equation (6.1) would naturally generalize to


    ```

    \(V_N^{(k)}(c^{(k)}, \mathbf{w}) = \sum_{x_i^{(k)} < c^{(k)}} w_i \left( y_i -
    m_N^{k,-}(c^{(k)}) \right)^2 + \sum_{x_i^{(k)} > c^{(k)}} w_i \left( y_i - m_N^{k,+}(c^{(k)})
    \right)^2 ,\)

    ```


    and hence an instance with a large weight \(w_i\) would contribute more to the
    dispersion of its cluster. For classification objectives, the alteration is more
    complex and we refer to Ting (2002) for one example of an instance-weighted tree-growing
    algorithm. The idea is closely linked to the alteration of the misclassification
    risk via a loss matrix (see Section 9.2.4 in Hastie et al. (2009)).'
  merge: -1
  img_proc: true
