  md: '# Penalized regressions and sparse hedging for minimum variance portfolios


    In this chapter, we introduce the widespread concept of regularization for linear
    models. There are in fact several possible applications for these models. The
    first one is straightforward: resort to penalizations to improve the robustness
    of factor-based predictive regressions. The outcome can then be used to fuel an
    allocation scheme. For instance, Han et al. (2019) and Rapach and Zhou (2019)
    use penalized regressions to improve stock return prediction when combining forecasts
    that emanate from individual characteristics.


    Similar ideas can be developed for macroeconomic predictions for instance, as
    in Uematsu and Tanaka (2019). The second application stems from a less known result
    which originates from Stevens (1998). It links the weights of optimal mean-variance
    portfolios to particular cross-sectional regressions. The idea is then different
    and the purpose is to improve the quality of mean-variance driven portfolio weights.
    We present the two approaches below after an introduction on regularization techniques
    for linear models.


    Other examples of financial applications of penalization can be found in d''Aspremont
    (2011), Ban et al. (2016) and Kremer et al. (2019). In any case, the idea is the
    same as in the seminal paper Tibshirani (1996): standard (unconstrained) optimization
    programs may lead to noisy estimates, thus adding a structuring constraint helps
    remove some noise (at the cost of a possible bias). For instance, Kremer et al.
    (2019) use this concept to build more robust mean-variance (Markowitz (1952))
    portfolios and Freyberger et al. (2020) use it to single out the characteristics
    that _really_ help explain the cross-section of equity returns.


    # 5.1 Penalized regressions


    # 5.1.1 Simple regressions


    The ideas behind linear models are at least two centuries old (Legendre (1805)
    is an early reference on least squares optimization). Given a matrix of predictors
    **X**, we seek to decompose the output vector **y** as a linear function of the
    columns of **X** (written **X**\(\beta\)) plus an error term \(\epsilon\): \(\mathbf{y}
    = \mathbf{X}\beta + \epsilon\).


    The best choice of \(\beta\) is naturally the one that minimizes the error. For
    analytical tractability, it is the sum of squared errors that is minimized: \(L
    = \epsilon''\epsilon = \sum_{i=1}^I \epsilon_i^2\). The loss _L_ is called the
    sum of squared residuals (SSR). In order to find the optimal \(\beta\), it is
    imperative to differentiate this loss _L_ with respect to \(\beta\) because the
