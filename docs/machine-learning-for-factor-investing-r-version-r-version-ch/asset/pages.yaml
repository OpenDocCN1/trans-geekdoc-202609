- pgno: 209
  md: "# 12.6 First example: a complete backtest\n\nWe finally propose a full detailed\
    \ example of one implementation of a ML-based strategy run on a careful backtest.\
    \ What follows is a generalization of the content of Section 5.2.2. In the same\
    \ spirit, we split the backtest in four parts:\n\n+   1. the creation/initialization\
    \ of variables;\n+   \n+   2. the definition of the strategies in one main function;\n\
    +   \n+   3. the backtesting loop itself;\n+   \n+   4. the performance indicators.\n\
    \nAccordingly, we start with initializations.\n\n```\nsep_00s <- as.Date(\"2007-01-01\"\
    )\nticks <- data_ml$stock_id %>%\nas.factor() %>%\nlevels()\nN <- length(ticks)\n\
    t_oos <- returns$data[returns$date > sep_00s] %>%\nunique() %>%\nas.Date(origin\
    \ = \"1970-01-01\")\nTt <- length(t_oos)\nnb_port <- 2\nportf_weights <- array(0,\
    \ dim = c(Tt, nb_port, N))\nportf_returns <- matrix(0, nrow = Tt, ncol = nb_port)\n\
    ```\n\nThis first step is crucial, it lays the groundwork for the core of the\
    \ backtest. We consider only two strategies: one ML-based and the EW (1/N) benchmark.\
    \ The main (weighting) function will consist of these two components, but we define\
    \ the sophisticated one in a dedicated wrapper. The ML-based weights are derived\
    \ from XGBoost predictions with 80 trees, a learning rate of 0.3 and a maximum\
    \ tree depth of 4. This makes the model complex but not exceedingly so. Once the\
    \ predictions are obtained, the weighting scheme is simple: it is an EW portfolio\
    \ over the best half of the stocks (those with above median prediction).\n\nIn\
    \ the function below, all parameters (e.g., the learning rate, eta or the number\
    \ of trees nrounds) are hard-coded. They can easily be passed in arguments next\
    \ to the data inputs. One very important detail is that in contrast to the rest\
    \ of the book, the label is the 12-month future return. The main reason for this\
    \ is rooted in the discussion from Section 4.6. Also, to speed up the computations,\
    \ we remove the bulk of the distribution of the labels and keep only the top 20%\
    \ and bottom 20%, as is advised in Coqueret and Guida (2020). The filtering levels\
    \ could also be passed as arguments."
  merge: -1
  img_proc: true
- pgno: 210
  md: "```\n```r\nweights_xgb <- function(train_data, test_data, features){\ntrain_features\
    \ <- train_data %>% dplyr::select(features) %>% as.matrix() # Indep. variable\n\
    train_label <- train_data$R12M_Usd / exp(train_data$Vol1Y_Usd) # Dep. variable\n\
    ind <- which(train_label < quantile(train_label,0.2)| # Filter\n             train_label\
    \ > quantile(train_label, 0.8))\ntrain_features <- train_features[ind, ] # Filt'd\
    \ features\ntrain_label <- train_label[ind] # Filtered label\ntrain_matrix <-\
    \ xgb.DMatrix(data = train_features, label = train_label) # XGB format\nfit <-\
    \ train_matrix %>% # Data source (pipe input)\nxgb.train(data = .,\n        eta\
    \ = 0.3, # Learning rate\n        objective = \"reg:linear\", # Number of random\
    \ trees\n        max_depth = 4, # Maximum depth of trees\n        nrounds = 80\
    \ # Number of trees used\n        )\nxgb_test <- test_data %>% # Test sample =>\
    \ XGB format\ndplyr::select(features) %>% as.matrix() %>%\nxgb.DMatrix()\npred\
    \ <- predict(fit, xgb_test) # Single prediction\nw <- pred > median(pred) # Keep\
    \ only the 50% best predictions\nw$weights <- w / sum(w)\nw$names <- unique(test_data$stock_id)\
    \ # Best predictions, equally-weighted\nreturn(w)\n}\n```\n```\n\nCompared to\
    \ the structure proposed in Section 6.4.6, the differences are that the label\
    \ is not only based on long-term returns, but it also relies on a volatility component.\
    \ Even though the denominator in the label is the exponential quantile of the\
    \ volatility, it seems fair to say that it is inspired by the Sharpe ratio and\
    \ that the model seeks to explain and forecast a risk-adjusted return instead\
    \ of a raw return. A stock with very low volatility will have its return unchanged\
    \ in the label, while a stock with very high volatility will see its return divided\
    \ by a factor close to three (exp(1)=2.718).\n\nThis function is then embedded\
    \ in the global weighting function which only wraps two schemes: the EW benchmark\
    \ and the ML-based policy.\n\n```\n```r\nportf_compo <- function(train_data, test_data,\
    \ features, j){\nif(j == 1){ # This is the benchmark\n  N <- test_data$stock_id\
    \ %>% # Test data dictates allocation\n    factor() %>% nlevels()\n  w <- 1/N\
    \ # EW portfolio\n  w$weights <- rep(w,N)\n  w$names <- unique(test_data$stock_id)\
    \ # Asset names\n  return(w)\n}\nif(j == 2){ # This is the ML strategy.\n  return(weights_xgb(train_data,\
    \ test_data, features))\n}\n}\n```\n```\n\nEquipped with this function, we can\
    \ turn to the main backtesting loop. Given the fact that we use a large-scale\
    \ model, the computation time for the loop is large (possibly a few hours on a\
    \ slow machine with CPU). Resorting to functional programming can speed up the\
    \ loop (see exercise at the end of the chapter). Also, a simple benchmark equally\
    \ weighted portfolio can be coded with tidyverse functions only."
