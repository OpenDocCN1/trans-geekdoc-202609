  md: "![](img/8861a37f775d09b4ba7a5151f604d9f5_215_0.png)\n\n**FIGURE 12.4:** Sharpe\
    \ ratios of all backtested strategies.\n\nThe last step is to compute the statistic\
    \ (12.5). We code it here:\n\n```\n```r\nDSR <- function(SR, Tt, M, g3, g4, SR_m,\
    \ SR_v){ # First, we build the function\n  gamma <- -digamma(1) # Euler-Mascheroni\
    \ constant\n  SR_star <- SR_m + sqrt(SR_v)*(((1-gamma)*qnorm(1-1/M) + gamma*qnorm(1-1/M/exp(1))))\
    \ # SR*\n  num <- (SR-SR_star) * sqrt(Tt-1) # Numerator\n  den <- sqrt(1 - g3*SR\
    \ + (g4-1)/4*SR^-2) # Denominator\n  return(pnorm(num/den))\n}\n```\n```\n\nAll\
    \ that remains to do is to evaluate the arguments of the function. The “best”\
    \ strategy is the one on the top left corner of Figure 12.4 and it is based on\
    \ market capitalization.\n\n```\n```r\nM <- nrow(pars)                       \
    \         # Number of strategies we tested\nSR <- max(grd$SR)                \
    \              # The SR we want to test\nSR_m <- mean(grd$SR)                \
    \           # Average SR across all strategies\nSR_v <- var(grd$SR)          \
    \                  # Std dev of SR\n# Below, we compute the returns of the strategy\
    \ by recycling the code of the strat() function\ndata_tmp <- dplyr::select(data_m1,\
    \ \"Mkt_Cap_6M_Usd\", date, R1M_Usd) # feature = Mkt_Cap\ncolnames(data_tmp)[1]\
    \ <- \"feature\"\nreturns_DSR <- data_tmp %>%\n  mutate(decision = feature < 0.2)\
    \ %>% # Investment decision: 0.2 is the best threshold\n  group_by(date) %>% \
    \                        # Date-by-date computations\n  mutate(nb = sum(decision),\
    \                 # Nb assets in portfolio\n         w = decision / nb,      \
    \            # Portfolio weights\n         return = w * R1M_Usd) %>%         \
    \  # Asset contribution to return\n  summarise(p_return = sum(return))       \
    \     # Portfolio return\ng3 <- skewness(returns_DSR$p_return)         # Function\
    \ from the e1071 package\ng4 <- kurtosis(returns_DSR$p_return) + 3     # Function\
    \ from the e1071 package\nTt <- nrow(returns_DSR)                      # Number\
    \ of dates\nDSR(SR, Tt, M, g3, g4, SR_m, SR_v)           # The sought value!\n\
    ```\n```\n\n## [1] 0.6676416\n\nThe value 0.6676416 is not high enough (it does\
    \ not reach the 90% or 95% threshold) to"
