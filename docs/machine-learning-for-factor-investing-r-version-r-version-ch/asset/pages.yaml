    The graph of Figure 15.1 reveals several blue squares around the diagonal. For
    instance, the biggest square around the first third of features relates to all
    accounting ratios based on free cash flows. Because of this common term in their
    calculation, the features are naturally highly correlated. These local correlation
    patterns occur several times in the dataset and explain why it is not a good idea
    to use simple regression with this set of features.


    In full disclosure, multicollinearity (when predictors are correlated) can be
    much less a problem for ML tools than it is for pure statistical inference. In
    statistics, one central goal is to study the properties of β coefficients. Collinearity
    perturbs this kind of analysis. In machine learning, the aim is to maximize out-of-sample
    accuracy. If having many predictors can be helpful, then so be it. One simple
    example can help clarify this matter. When building a regression tree, having
    many predictors will give more options for the splits. If the features make sense,
    then they can be useful. The same reasoning applies to random forests and boosted
    trees. What does matter is that the large spectrum of features helps improve the
    generalization ability of the model. Their collinearity is irrelevant.'
