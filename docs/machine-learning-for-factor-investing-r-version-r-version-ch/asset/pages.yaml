- pgno: 235
  md: '# Two key concepts: causality and non-stationarity


    A prominent point of criticism faced by ML tools is their inability to uncover
    **causality** relationships between features and labels because they are mostly
    focused (by design) to capture correlations. Correlations are much weaker than
    causality because they characterize a two-way relationship (X $\leftrightarrow$
    y), while causality specifies a direction X $\rightarrow$ y or X $\leftarrow$
    y. One fashionable example is sentiment. Many academic articles seem to find that
    sentiment (irrespectively of its definition) is a significant driver of future
    returns. A high sentiment for a particular stock may increase the demand for this
    stock and push its price up (though contrarian reasonings may also apply: if sentiment
    is high, it is a sign that mean-reversion is possibly about to happen). The reverse
    causation is also plausible: returns may well cause sentiment. If a stock experiences
    a long period of market growth, people become bullish about this stock and sentiment
    increases (this notably comes from extrapolation, see Barberis et al. (2015) for
    a theoretical model). In Coqueret (2020), it is found (in opposition to most findings
    in this field), that the latter relationship (returns $\rightarrow$ sentiment)
    is more likely. This result is backed by causality driven tests (see Section 14.1.1).


    Statistical causality is a large field and we refer to Pearl (2009) for a deep
    dive into this topic. Recently, researchers have sought to link causality with
    ML approaches (see, e.g., Peters et al. (2017), Heinze-Deml et al. (2018), Arjovsky
    et al. (2019)). The key notion in their work is **invariance**.


    Often, data is collected not at once, but from different sources at different
    moments. Some relationships found in these different sources will change, while
    others may remain the same. The relationships that are invariant to **changing
    environments** are likely to stem from (and signal) causality. One counter-example
    is the following (related in Beery et al. (2018)): training a computer vision
    algorithm to discriminate between cows and camels will lead the algorithm to focus
    on grass versus sand! This is because most camels are pictured in the desert while
    cows are shown in green fields of grass. Thus, a picture of a camel on grass will
    be classified as cow, while a cow on sand would be labelled “camel”. It is only
    with pictures of these two animals in different contexts (environments) that the
    learner will end up truly finding what makes a cow and a camel. A camel will remain
    a camel no matter where it is pictured: it should be recognized as such by the
    learner. If so, the representation of the camel becomes invariant over all datasets
    and the learner has discovered causality, i.e., the true attributes that make
    the camel a camel (overall silhouette, shape of the back, face, color (possibly
    misleading!), etc.).


    This search for invariance makes sense for many disciplines like computer vision
    or natural language processing (cats will always look like cats and languages
    don’t change much). In finance, it is not obvious that invariance may exist. Market
    conditions are known to be time-varying and the relationships between firm characteristics
    and returns also change from year to year. One solution to this issue may simply
    be to embrace **non-stationarity** (see Section 1.1 for a definition of stationarity).
    In Chapter 12, we advocate to do that by updating models as frequently as possible
    with rolling training sets: this allows the'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'predictions to be based on the most recent trends. In Section 14.2 below, we
    introduce other theoretical and practical options.


    # 14.1 Causality


    Traditional machine learning models aim to uncover relationships between variables
    but do not usually specify *directions* for these relationships. One typical example
    is the linear regression. If we write $y = a + bx + \epsilon$, then it is also
    true that $x = b^{-1}(y - a - \epsilon)$, which is of course also a linear relationship
    (with respect to $y$). These equations do not define causation whereby $x$ would
    be a clear determinant of $y$ ($x \rightarrow y$, but the opposite could be false).


    # 14.1.1 Granger causality


    The most notable tool first proposed by Granger (1969) is probably the simplest.
    For simplicity, we consider only two stationary processes, $X_t$ and $Y_t$. A
    strict definition of causality could be the following. $X$ can be said to cause
    $Y$, whenever, for some integer $k$,


    $$(Y_{t+1}, ..., Y_{t+k})|(\mathcal{F}_{Y,t} \cup \mathcal{F}_{X,t}) \stackrel{d}{=}
    (Y_{t+1}, ..., Y_{t+k})|\mathcal{F}_{Y,t},$$


    that is, when the distribution of future values of $Y_t$, conditionally on the
    knowledge of both processes is not the same as the distribution with the sole
    knowledge of the filtration $\mathcal{F}_{Y,t}$. Hence $X$ does have an impact
    on $Y$ because its trajectory alters that of $Y$.


    Now, this formulation is too vague and impossible to handle numerically, thus
    we simplify the setting via a linear formulation. We keep the same notations as
    section 5 of the original paper by Granger (1969). The test consists of two regressions:


    $$X_t = \sum_{j=1}^m a_j X_{t-j} + \sum_{j=1}^m b_j Y_{t-j} + \epsilon_t$$

    $$Y_t = \sum_{j=1}^m c_j X_{t-j} + \sum_{j=1}^m d_j Y_{t-j} + \nu_t$$


    where for simplicity, it is assumed that both processes have zero mean. The usual
    assumptions apply: the Gaussian noises $\epsilon_t$ and $\nu_t$ are uncorrelated
    in every possible way (mutually and through time). The test is the following:
    if one $b_j$ is nonzero, then it is said that $Y$ Granger-causes $X$ and if one
    $c_j$ is nonzero, $X$ Granger-causes $Y$. The two are not mutually exclusive and
    it is widely accepted that feedback loops can very well occur.


    Statistically, under the null hypothesis, $b_1 = \cdots = b_m = 0$ (resp. $c_1
    = \cdots = c_m = 0$), which can be tested using the usual Fischer distribution.
    Obviously, the linear restriction can be dismissed but the tests are then much
    more complex. The main financial article in this direction is Hiemstra and Jones
    (1994).


    There are many R packages that embed Granger causality functionalities. One of
    the most widespread is `lmtest`, so we work with it below. The syntax is incredibly
    simple. The *order* is the maximum lag $m$ in the above equation. We test if market
    capitalization averaged over'
  merge: -1
  img_proc: true
