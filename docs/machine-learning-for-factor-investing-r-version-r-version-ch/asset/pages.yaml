    # 15.2.1 A bit of algebra


    In this short subsection, we define some key concepts that are required to fully
    understand the derivation of principal component analysis (PCA). Henceforth, we
    work with matrices (in bold fonts). An \(I \times K\) matrix \(\mathbf{X}\) is
    orthonormal if \(I > K\) and \(\mathbf{X}''\mathbf{X} = \mathbf{I}_K\). When \(I
    = K\), (the square) matrix is called orthogonal and \(\mathbf{X}''\mathbf{X} =
    \mathbf{X}\mathbf{X}'' = \mathbf{I}_K\), i.e., \(\mathbf{X}^{-1} = \mathbf{X}''\).


    One foundational result in matrix theory is the Singular Value Decomposition (SVD,
    see, e.g., chapter 5 in Meyer (2000)). The SVD is formulated as follows: any \(I
    \times K\) matrix \(\mathbf{X}\) can be decomposed into


    \(\mathbf{X} = \mathbf{U}\boldsymbol{\Delta}\mathbf{V}''\), (15.1)


    where \(\mathbf{U} \ (I \times I)\) and \(\mathbf{V} \ (K \times K)\) are orthogonal
    and \(\boldsymbol{\Delta}\) (with dimensions \(I \times K\)) is diagonal, i.e.,
    \(\Delta_{i,k} = 0\) whenever \(i = k\). In addition, \(\Delta_i, i \geq 0\):
    the diagonal terms of \(\boldsymbol{\Delta}\) are nonnegative.


    For simplicity, we assume below that \(\mathbf{1}''_I\mathbf{X} = \mathbf{0}''_K\),
    i.e., that all columns have zero sum (and hence zero mean).1 This allows to write
    that the covariance matrix is equal to its sample estimate \(\boldsymbol{\Sigma}_X
    = \frac{1}{I-1}\mathbf{X}''\mathbf{X}\).


    One crucial feature of covariance matrices is their symmetry. Indeed, real-valued
    symmetric (square) matrices enjoy a SVD which is much more powerful: when \(\mathbf{X}\)
    is symmetric, there exist an orthogonal matrix \(\mathbf{Q}\) and a diagonal matrix
    \(\mathbf{D}\) such that


    \(\mathbf{X} = \mathbf{Q}\mathbf{D}\mathbf{Q}''\), (15.2)


    This process is called **diagonalization** (see chapter 7 in Meyer (2000)) and
    conveniently applies to covariance matrices.


    # 15.2.2 PCA


    The goal of PCA is to build a dataset \(\tilde{\mathbf{X}}\) that has fewer columns
    but that keeps as much information as possible when compressing the original one,
    \(\mathbf{X}\). The key notion is the **change of base**, which is a linear transformation
    of \(\mathbf{X}\) into \(\mathbf{Z}\), a matrix with identical dimension, via


    \(\mathbf{Z} = \mathbf{X}\mathbf{P}\), (15.3)


    where \(\mathbf{P}\) is a \(K \times K\) matrix. There are of course an infinite
    number of ways to transform \(\mathbf{X}\) into \(\mathbf{Z}\), but two fundamental
    constraints help reduce the possibilities. The first constraint is that the columns
    of \(\mathbf{Z}\) be uncorrelated. Having uncorrelated features is desirable because
    they then all tell different stories and have zero redundancy. The second constraint
    is that the variance of the columns of \(\mathbf{Z}\) is highly concentrated.
    This means that a few factors (columns) will capture most of the explanatory power
    (signal), while most (the others) will consist predominantly of noise. All of
    this is coded in the covariance matrix of \(\mathbf{Y}\):


    +   • the first condition imposes that the covariance matrix be diagonal;


    1In practice, this is not a major problem; since we work with features that are
    uniformly distributed, de-meaning amounts to remove 0.5 to all feature values.'
  merge: -1
  img_proc: true
- pgno: 257
  md: "+   - the second condition imposes that the diagonal elements, when ranked\
    \ in decreasing magnitude, see their value decline (sharply if possible).\n\n\
    The covariance matrix of Z is\n\n$$\\Sigma_Y = \\frac{1}{I-1} Z'Z = \\frac{1}{I-1}\
    \ P'X'XP = \\frac{1}{I-1} P'\\Sigma_X P. \\quad (15.4)$$\n\nIn this expression,\
    \ we plug the decomposition (15.2) of $\\Sigma_X$:\n\n$$\\Sigma_Y = \\frac{1}{I-1}\
    \ P' Q D Q' P,$$\n\nthus picking P = Q, we get, by orthogonality, $\\Sigma_Y =\
    \ \\frac{1}{I-1} D$, that is, a diagonal covariance matrix for Z. The columns\
    \ of Z can then be re-shuffled in decreasing order of variance so that the diagonal\
    \ elements of $\\Sigma_Y$ progressively shrink. This is useful because it helps\
    \ locate the factors with most informational content (the first factors). In the\
    \ limit, a constant vector (with zero variance) carries no signal.\n\nThe matrix\
    \ Z is a linear transformation of X, thus, it is expected to carry the same information,\
    \ even though this information is coded differently. Since the columns are ordered\
    \ according to their relative importance, it is simple to omit some of them. The\
    \ new set of features X consists in the first $K'$ (with $K' < K$) columns of\
    \ Z.\n\nBelow, we show how to perform PCA and visualize the output with the factoextra\
    \ package. To ease readability, we use the smaller sample with few predictors.\n\
