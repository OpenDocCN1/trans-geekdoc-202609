  md: 'For simplicity, we propose the full derivation with the simplest loss function
    loss(y, \(\tilde{y}\)) = \((y - \tilde{y})^2\), so that:


    \(O = \sum_{i=1}^I (y_i - m_{J-1}(\mathbf{x}_i) - T_J(\mathbf{x}_i))^2 + \sum_{j=1}^J
    \Omega(T_j).\)


    # 6.4.1 Managing loss


    Let us assume that we have already built all trees \(T_j\) up to \(j=1, \dots,
    J-1\) (and hence model \(M_{J-1}\)): how to choose tree \(T_J\) optimally? We
    rewrite


    \(O = \sum_{i=1}^I (y_i - m_{J-1}(\mathbf{x}_i) - T_J(\mathbf{x}_i))^2 + \sum_{j=1}^J
    \Omega(T_j)\)


    \(= \sum_{i=1}^I \{y_i^2 + m_{J-1}(\mathbf{x}_i)^2 + T_J(\mathbf{x}_i)^2\} + \sum_{j=1}^{J-1}
    \Omega(T_j) + \Omega(T_J) \quad \text{(squared terms + penalization)}\)


    \(- 2 \sum_{i=1}^I \{y_i m_{J-1}(\mathbf{x}_i) + y_i T_J(\mathbf{x}_i) - m_{J-1}(\mathbf{x}_i)
    T_J(\mathbf{x}_i))\} \quad \text{(cross terms)}\)


    \(= \sum_{i=1}^I \{-2y_i T_J(\mathbf{x}_i) + 2m_{J-1}(\mathbf{x}_i) T_J(\mathbf{x}_i)
    + T_J(\mathbf{x}_i)^2\} + \Omega(T_J) + c\)


    All terms known at step \(J\) (i.e., indexed by \(J-1\)) vanish because they do
    not enter the optimization scheme. They are embedded in the constant \(c\).


    Things are fairly simple with quadratic loss. For more complicated loss functions,
    Taylor expansions are used (see the original paper).


    # 6.4.2 Penalization


    In order to go any further, we need to specify the way the penalization works.
    For a given tree \(T\), we specify its structure by \(T(x) = w_{q(x)}\), where
    \(w\) is the output value of some leaf and \(q(\cdot)\) is the function that maps
    an input to its final leaf. This encoding is illustrated in Figure 6.5. The function
    \(q\) indicates the path, while the vector \(\mathbf{w} = w_i\) codes the terminal
    leaf values.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '![](img/8861a37f775d09b4ba7a5151f604d9f5_104_0.png)


    FIGURE 6.5: Coding a decision tree: decomposition between structure and node and
    leaf values.


    We write \( l = 1, \dots, L \) for the indices of the leaves of the tree. In XGBoost,
    complexity is defined as:


    ```

    \(\Omega(T) = \gamma L + \frac{\lambda}{2} \sum_{l=1}^L w_l^2,\)

    ```


    where


    +   • the first term penalizes the **total number of leaves**;


    +   • the second term penalizes the **magnitude of output values** (this helps
    reduce variance).


    The first penalization term reduces the depth of the tree, while the second shrinks
    the size of the adjustments that will come from the latest tree.


    # 6.4.3 Aggregation


    We aggregate both sections of the objective (loss and penalization). We write
    \( I_l \) for the set of the indices of the instances belonging to leaf \( l \).
    Then,


    ```

    O = 2 \sum_{i=1}^I \left\{ -y_i T_J(\mathbf{x}_i) + m_{J-1}(\mathbf{x}_i) T_J(\mathbf{x}_i)
    + \frac{T_J(\mathbf{x}_i)^2}{2} \right\} + \gamma L + \frac{\lambda}{2} \sum_{l=1}^L
    w_l^2

    = 2 \sum_{i=1}^I \left\{ -y_i w_{q(\mathbf{x}_i)} + m_{J-1}(\mathbf{x}_i) w_{q(\mathbf{x}_i)}
    + \frac{w_{q(\mathbf{x}_i)}^2}{2} \right\} + \gamma L + \frac{\lambda}{2} \sum_{l=1}^L
    w_l^2

    = 2 \sum_{l=1}^L w_l \sum_{i \in I_l} (-y_i + m_{J-1}(\mathbf{x}_i)) + \frac{w_l^2}{2}
    \sum_{i \in I_l} 1 + \frac{\lambda}{2} \quad + \gamma L

    ```'
  merge: -1
