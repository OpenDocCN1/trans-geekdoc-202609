    # ### 12.3.4 Risk-adjusted measures


    Now, the tradeoff between the average return and the volatility is a cornerstone
    in modern finance, since Markowitz (1952). The simplest way to synthesize both
    metrics is via the **information ratio**:

    \[IR(P, B) = \frac{\mu_{P-B}}{\sigma_{P-B}},\]


    where the index \(P - B\) implies that the mean and standard deviations are computed
    on the long-short portfolio with returns \(r_t^P - r_t^B\). The denominator \(\sigma_{P-B}\)
    is sometimes called the **tracking error**.


    The most widespread information ratio is the **Sharpe ratio** (Sharpe (1966))
    for which the benchmark is some riskless asset. Instead of directly computing
    the information ratio between two portfolios or strategies, it is often customary
    to compare their Sharpe ratios. Simple comparisons can benefit from statistical
    tests (see, e.g., Ledoit and Wolf (2008)).


    More extreme risk measures can serve as denominator in risk-adjusted indicators.
    The Managed Account Report (MAR) ratio is, for example, computed as

    \[MAR^P = \frac{\tilde{\mu}_P}{MD^P},\]


    while the Treynor ratio is equal to

    \[Treynor = \frac{\mu_P}{\hat{\beta}_M},\]


    i.e., the (excess) return divided by the market beta (see Treynor (1965)). This
    definition was generalized to multifactor exposures by Hübner (2005) into the
    generalized Treynor ratio:

    \[GT = \mu_P \frac{\sum_{k=1}^K \bar{f}_k}{\sum_{k=1}^K \hat{\beta}_k \bar{f}_k},\]


    where the \(\bar{f}_k\) are the sample average of the factors \(f_{t,k}\). We
    refer to the original article for a detailed account of the analytical properties
    of this ratio.


