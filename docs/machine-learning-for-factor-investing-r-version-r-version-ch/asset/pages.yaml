  img_proc: true
- pgno: 53
  md: 'long-short portfolio of these two sets, with uniform weights. Note that Fama
    and French (1993) use a more complex approach which also takes market capitalization
    into account both in the weighting scheme and also in the composition of the portfolios.


    One of the advances enabled by machine learning is to automate the construction
    of the factors. It is for instance the approach of Feng et al. (2019). Instead
    of building the factors heuristically, the authors optimize the construction to
    maximize the fit in the cross-section of returns. The optimization is performed
    via a relatively deep feed-forward neural network and the feature space is lagged
    so that the relationship is indeed predictive, as in Equation (3.7). Theoretically,
    the resulting factors help explain a substantially larger proportion of the in-sample
    variance in the returns. The prediction ability of the model depends on how well
    it generalizes out-of-sample.


    A third approach is that of Kelly et al. (2019) (though the statistical treatment
    is not machine learning per se).$^3$ Their idea is the opposite: factors are latent
    (unobserved) and it is the betas (loadings) that depend on the characteristics.
    This allows many degrees of freedom because in $r_{t,n} = \alpha_n + (\boldsymbol{\beta}_{t,n}(\mathbf{x}_{t-1,n}))''\mathbf{f}_t
    + \epsilon_{t,n}$, only the characteristics $\mathbf{x}_{t-1,n}$ are known and
    both the factors $\mathbf{f}_t$ and the functional forms $\boldsymbol{\beta}_{t,n}(\cdot)$
    must be estimated. In their article, Kelly et al. (2019) work with a linear form,
    which is naturally more tractable.


    Lastly, a fourth approach (introduced in Gu et al. (2020a)) goes even further
    and combines two neural network architectures. The first neural network takes
    characteristics $\mathbf{x}_{t-1}$ as inputs and generates factor loadings $\boldsymbol{\beta}_{t-1}(\mathbf{x}_{t-1})$.
    The second network transforms returns $\mathbf{r}_t$ into factor values $\mathbf{f}_t(\mathbf{r}_t)$
    (in Feng et al. (2019)). The aggregate model can then be written:


    ```

    $\mathbf{r}_t = \boldsymbol{\beta}_{t-1}(\mathbf{x}_{t-1})''\mathbf{f}_t(\mathbf{r}_t)
    + \boldsymbol{\epsilon}_t.$ (3.9)

    ```


    The above specification is quite special because the output (on the l.h.s.) is
    also present as input (in the r.h.s.). In machine learning, autoencoders (see
    Section 7.6.2) share the same property. Their aim, just like in principal component
    analysis, is to find a parsimonious nonlinear representation form for a dataset
    (in this case, returns). In Equation (3.9), the input is $\mathbf{r}_t$ and the
    output function is $\boldsymbol{\beta}_{t-1}(\mathbf{x}_{t-1})''\mathbf{f}_t(\mathbf{r}_t)$.
    The aim is to minimize the difference between the two just as is any regression-like
    model.


    Autoencoders are neural networks which have outputs as close as possible to the
    inputs with an objective of dimensional reduction. The innovation in Gu et al.
    (2020a) is that the pure autoencoder part is merged with a vanilla perceptron
    used to model the loadings. The structure of the neural network is summarized
    below.


    ```

    returns ($\mathbf{r}_t$) \xrightarrow{NN_1} factors ($\mathbf{f}_t = NN_1(\mathbf{r}_t)$)

    characteristics ($\mathbf{x}_{t-1}$) \xrightarrow{NN_2} loadings ($\boldsymbol{\beta}_{t-1}
    = NN_2(\mathbf{x}_{t-1})$) \big\} \longrightarrow returns ($r_t$)

    ```


    A simple autoencoder would consist of only the first line of the model. This specification
    is discussed in more details in Section 7.6.2.


    As a conclusion of this chapter, it appears undeniable that the intersection between
    the two fields of asset pricing and machine learning offers a rich variety of
    applications. The literature is already exhaustive and it is often hard to disentangle
    the noise from the great ideas in the continuous flow of publications on these
    topics. Practice and implementation is the only way forward to extricate value
    from hype. This is especially true because agents'
