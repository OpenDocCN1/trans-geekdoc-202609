    The best performing ML engine is the random forest. The boosted tree model is
    the worst, by far. Below, we compute the optimal (non-constrained) weights for
    the combination of models.


    ```

    w_ensemble <- solve(t(E) %*% E) %*% rep(1,5)

    w_ensemble <- w_ensemble / sum(w_ensemble)

    w_ensemble # Optimal weights

