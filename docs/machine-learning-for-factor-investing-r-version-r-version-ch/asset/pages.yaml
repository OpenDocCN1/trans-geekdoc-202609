    that the combination has not been explored. Some states seem to be more often
    represented (“X1.1”, “X1.2” and “X2.1”), others, less (“X3.1” and “X3.2”). It
    is hard to make any sense of the recommendations. Some states close “X0.1” and
    “X1.1” but the outcomes related to them are very different (buy and short versus
    hold and buy). Moreover, there is no coherence and no monotonicity in actions
    with respect to individual state values: low values of states can be associated
    to very different actions.


    One reason why these conclusions do not appear trustworthy pertains to the data
    size. With only 200+ time points and 99 state-action pairs (11 times 9), this
    yields on average only two data points to compute the Q function. This could be
    improved by testing more random actions, but the limits of the sample size would
    eventually (rapidly) be reached anyway. This is left as an exercise (see below).


    # 16.5 Concluding remarks


    Reinforcement learning has been applied to financial problems for a long time.
    Early contributions in the late 1990s include Neuneier (1996), Moody and Wu (1997),
    Moody et al. (1998) and Neuneier (1998). Since then, many researchers in the computer
    science field have sought to apply RL techniques to portfolio problems. The advent
    of massive datasets and the increase in dimensionality make it hard for RL tools
    to adapt well to very rich environments that are encountered in factor investing.


    Recently, some approaches seek to adapt RL to continuous action spaces (Wang and
    Zhou (2019), Aboussalah and Lee (2020)) but not to high-dimensional state spaces.
    These spaces are those required in factor investing because all firms yield hundreds
    of data points characterizing their economic situation. In addition, applications
    of RL in financial frameworks have a particularity compared to many typical RL
    tasks: in financial markets, actions of agents have **no impact on the environment**
    (unless the agent is able to perform massive trades, which is rare and ill-advised
    because it pushes prices in the wrong direction). This lack of impact of actions
    may possibly mitigate the efficiency of traditional RL approaches.


    Those are challenges that will need to be solved in order for RL to become competitive
    with alternative (supervised) methods. Nevertheless, the progressive (online-like)
    way RL works seems suitable for non-stationary environments: the algorithm slowly
    shifts paradigms as new data arrives. In stationary environments, it has been
    shown that RL manages to converge to optimal solutions (Kong et al. (2019), Chaouki
    et al. (2020)). Therefore, in non-stationary markets, RL could be a recourse to
    build dynamic predictions that adapt to changing macroeconomic conditions. More
    research needs to be carried out in this field on large dimensional datasets.


    We end this chapter by underlining that reinforcement learning has also been used
    to estimate complex theoretical models (Halperin and Feldshteyn (2018), García-Galicia
    et al. (2019)).'
