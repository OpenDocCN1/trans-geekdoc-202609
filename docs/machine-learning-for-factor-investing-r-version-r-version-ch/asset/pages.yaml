  md: "for instance to Cont (2007) for more details on this topic. For the computation\
    \ of realized volatility in R, we strongly recommend chapter 4 in Regenstein (2018).\n\
    \nIn terms of machine learning models, this is also true. Below, we estimate a\
    \ pure characteristic regression with one predictor, the market capitalization\
    \ averaged over the past 6-months ($r_{t+1,n} = \\alpha + \\beta x_{t,n}^{cap}\
    \ + \\epsilon_{t+1,n}$). The label is the 6-month forward return and the estimation\
    \ is performed over every calendar year.\n\n```\ndata_ml %>%\nmutate(year = year(date))\
    \ %>%         # Create a year variable\ngroup_by(year) %>%                # Group\
    \ by year\nsummarize(beta_cap = lm(R6M_USd ~ Mkt_Cap_6M_USd) %>%  # Perform regression\n\
    \       coef() %>%                  # Extract coefs\n       t() %>%          \
    \           # Transpose\n       data.frame() %>%            # Format into df\n\
    \       pull(Mkt_Cap_6M_USd)) %>%   # Pull coef (remove intercept)\nggplot(aes(x\
    \ = year, y = beta_cap)) + geom_col() +   # Plot\ntheme_grey()\n```\n\n![](img/8861a37f775d09b4ba7a5151f604d9f5_246_0.png)\n\
    \n**FIGURE 14.5:** Variations in betas with respect to 6-month market capitalization.\n\
    \nThe bars in Figure 14.5 highlight the concept drift: overall, the relationship\
    \ between capitalization and returns is negative (the size effect again). Sometimes\
    \ it is markedly negative, sometimes, not so much. The ability of capitalization\
    \ to explain returns is time-varying and models must adapt accordingly."
