  md: 'The complicated task in the above equation is to compute the gradient (derivative)
    which tells in which direction the adjustment should be done. The problem is that
    the successive nested layers and associated activations require many iterations
    of the chain rule for differentiation.


    ![](img/8861a37f775d09b4ba7a5151f604d9f5_118_0.png)


    **FIGURE 7.5:** Outline of gradient descent.


    The most common way to approximate a derivative is probably the finite difference
    method. Under the usual assumptions (the loss is twice differentiable), the centered
    difference satisfies:


    ```

    \(\frac{\partial D(\tilde{y}_i(w_k))}{\partial w_k} = \frac{D(\tilde{y}_i(w_k
    + h)) - D(\tilde{y}_i(w_k - h))}{2h} + O(h^2),\)

    ```


    where \(h > 0\) is some arbitrarily small number. In spite of its apparent simplicity,
    this method is costly computationally because it requires a number of operations
    of the magnitude of the number of weights.


    Luckily, there is a small trick that can considerably ease and speed up the computation.
    The idea is to simply follow the chain rule and recycle terms along the way. Let
    us start by recalling


    ```

    \(\tilde{y}_i = f^{(L+1)} \left( \mathbf{o}_i^{(L)} \right)'' \mathbf{w}^{(L+1)}
    + b^{(L+1)} = f^{(L+1)} \ b^{(L+1)} + \sum_{k=1}^{U_L} w_k^{(L+1)} o_{i,k}^{(L)}
    ,\)

    ```


    so that if we differentiate with the most immediate weights and biases, we get:


    ```

    \(\frac{\partial D(\tilde{y}_i)}{\partial w_k^{(L+1)}} = D''(\tilde{y}_i) \ f^{(L+1)}
    '' \ b^{(L+1)} + \sum_{k=1}^{U_L} w_k^{(L+1)} o_{i,k}^{(L)} \ o_{i,k}^{(L)} \quad
    (7.3)\)

    \(= D''(\tilde{y}_i) \ f^{(L+1)} '' \ v_{i,k}^{(L+1)} \ o_{i,k}^{(L)} \quad (7.4)\)

    \(\frac{\partial D(\tilde{y}_i)}{\partial b^{(L+1)}} = D''(\tilde{y}_i) \ f^{(L+1)}
    '' \ b^{(L+1)} + \sum_{k=1}^{U_L} w_k^{(L+1)} o_{i,k}^{(L)} .\quad (7.5)\)

    ```


    This is the easiest part. We must now go back one layer and this can only be done
    via the chain rule. To access layer \(L\), we recall identity \(v_{i,k}^{(L)}
    = \left( \mathbf{o}_i^{(L-1)} \right)'' \mathbf{w}_k^{(L)} + b_k^{(L)} = b_k^{(L)}
    + \sum_{j=1}^{U_L} o_{i,j}^{(L-1)} w_{k,j}^{(L)}\). We can then proceed:'
