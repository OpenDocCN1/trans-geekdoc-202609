    # 14.2 Dealing with changing environments


    The most common assumption in machine learning contributions is that the samples
    that are studied are i.i.d. realizations of a phenomenon that we are trying to
    characterize. This constraint is natural because if the relationship between $X$
    and $y$ always changes, then it is very hard to infer anything from observations.
    One main issue in Finance is that this is often the case: markets, behaviors,
    policies, etc., evolve all the time. This is at least partly related to the notion
    of absence of arbitrage: if a trading strategy worked all the time, all agents
    would eventually adopt it via herding, which would annihilate the corresponding
    gains.$^3$ If the strategy is kept private, its holder would become infinitely
    rich, which obviously has never happened.


    There are several ways to define changes in environments. If we denote with $\mathbb{P}_{XY}$
    the multivariate distribution of all variables (features and label), with $\mathbb{P}_{XY}
    = \mathbb{P}_X\mathbb{P}_{Y|X}$, then two simple changes are possible:


    +   - **covariate shift**: $\mathbb{P}_X$ changes but $\mathbb{P}_{Y|X}$ does
    not: the features have a fluctuating distribution, but their relationship with
    $Y$ holds still;

    +   - **concept drift**: $\mathbb{P}_{Y|X}$ changes but $\mathbb{P}_X$ does not:
    feature distributions are stable, but their relation to $Y$ is altered.


    Obviously, we omit the case when both items change, as it is too complex to handle.
    In factor investing, the feature engineering process (see Section 4.4) is partly
    designed to bypass the risk of covariate shift. Uniformization guarantees that
    the marginals stay the same but correlations between features may of course change.
    The main issue is probably concept drift when the way features explain the label
    changes through time. In Cornuéjols et al. (2018),$^4$ the authors distinguish
    four types of drifts, which we reproduce in Figure 14.4. In factor models, changes
    are presumably a combination of all four types: they can be abrupt during crashes,
    but most of the time they are progressive (gradual or incremental) and never-ending
    (continuously recurring).


    $^3$See for instance the papers on herding in factor investing: Krkoska and Schenk-Hoppé
    (2019) and Santi and Zwinkels (2018).


    $^4$This book is probably the most complete reference for theoretical results
    in machine learning, but it is in French.'
