  md: "The quantity of interest is the so-called contribution of feature \\( j \\\
    notin \\mathbf{k} \\) with respect to data point \\( x^* \\) and set \\( \\mathbf{k}\
    \ \\):\n\n\\( \\phi^j_{\\mathbf{k}}(x^*) = \\tilde{f}_{\\mathbf{k} \\cup j}(x^*)\
    \ - \\tilde{f}_{\\mathbf{k}}(x^*) \\).\n\nJust as for Shapley values, the above\
    \ indicator computes an average impact when augmenting the set of predictors with\
    \ feature \\( j \\). By definition, it depends on the set \\( \\mathbf{k} \\),\
    \ so this is one notable difference with Shapley values (that span _all_ permutations).\
    \ In Staniak and Biecek (2018), the authors devise a procedure that incrementally\
    \ increases or decreases the set \\( \\mathbf{k} \\). This greedy idea helps alleviate\
    \ the burden of computing all possible combinations of features. Moreover, a very\
    \ convenient property of their algorithm is that the sum of all contributions\
    \ is equal to the predicted value:\n\n\\( \\sum_j \\phi^j_{\\mathbf{k}}(x^*) =\
    \ f(x^*) \\).\n\nThe visualization makes that very easy to see (as in Figure 13.7\
    \ below).\n\nIn order to illustrate one implementation of breakdown, we train\
    \ a random forest on a limited number of features, as shown below. This will increase\
    \ the readability of the output of the breakdown.\n\n```\nformula_short <- paste(\"\
    R1M_Usd ~\", paste(features_short, collapse = \" + \"))  # Model\nformula_short\
    \ <- as.formula(formula_short)  # Formula format\nfit_RF_short <- randomForest(formula_short,\
    \  # Same formula as before\n    data = dplyr::select(training_sample, c(features_short,\
    \ \"R1M_Usd\")),\n    sampsize = 10000,      # Size of (random) sample for each\
    \ tree\n    replace = FALSE,       # Is the sampling done with replacement?\n\
    \    nodesize = 250,        # Minimum size of terminal cluster\n    ntree = 12,\
    \            # Nb of random trees\n    mtry = 5               # Nb of predictive\
    \ variables for each tree\n)\n```\n\nOnce the model is trained, the syntax for\
    \ the breakdown of predictions is very simple.\n\n```\nlibrary(breakDown)\nexplain_break\
    \ <- broken(fit_RF_short,\n    data_ml[6, ] %>% dplyr::select(features_short),\n\
    \    data = data_ml %>% dplyr::select(features_short))\nplot(explain_break)\n\
    ```"
