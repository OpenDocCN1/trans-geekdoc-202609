- pgno: 55
  md: '# # Data preprocessing


    The methods we describe in this chapter are driven by financial applications.
    For an introduction to non-financial data processing, we recommend two references:
    chapter 3 from the general purpose ML book by Boehmke and Greenwell (2019) and
    the monograph on this dedicated subject by Kuhn and Johnson (2019).


    # ## 4.1 Know your data


    The first step, as in any quantitative study, is obviously to make sure the data
    is trustworthy, i.e., comes from a reliable provider (a minima). The landscape
    in financial data provision is vast to say the least: some providers are well
    established (e.g., Bloomberg, Thomson-Reuters, Datastream, CRSP, Morningstar),
    some are more recent (e.g., Capital IQ, Ravenpack) and some focus on alternative
    data niches (see https://alternativedata.org/data-providers/ for an exhaustive
    list). Unfortunately, and to the best of our knowledge, no study has been published
    that evaluates a large spectrum of these providers in terms of data reliability.


    The second step is to have a look at **summary statistics**: ranges (minimum and
    maximum values), and averages and medians. Histograms or plots of time series
    carry of course more information but cannot be analyzed properly in high dimensions.
    They are nonetheless sometimes useful to track local patterns or errors for a
    given stock and/or a particular feature. Beyond first order moments, second order
    quantities (variances and covariances/correlations) also matter because they help
    spot colinearities. When two features are highly correlated, problems may arise
    in some models (e.g., simple regressions, see Section 15.1).


    Often, the number of predictors is so large that it is unpractical to look at
    these simple metrics. A minimal verification is recommended. To further ease the
    analysis:


    +   - focus on a subset of predictors, e.g., the ones linked to the most common
    factors (market-capitalization, price-to-book or book-to-market, momentum (past
    returns), profitability, asset growth, volatility);

    +   - track outliers in the summary statistics (when the maximum/median or median/minimum
    ratios seem suspicious).


    Below, in Figure 4.1, we show a box plot that illustrates the distribution of
    correlations between features and the one month ahead return. The correlations
    are computed on a date-by-date basis, over the whole cross-section of stocks.
    They are mostly located close to zero, but some dates seem to experience extreme
    shifts (outliers are shown with black circles). The market capitalization has
    the median which is the most negative while volatility'
  merge: -1
  img_proc: true
