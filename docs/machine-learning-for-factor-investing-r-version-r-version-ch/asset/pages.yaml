- pgno: 105
  md: 'The function is of the form \(aw_l + \frac{b}{2}w_l^2\), which has minimum
    values \(-\frac{a^2}{2b}\) at point \(w_l = -a/b\). Thus, writing #(.) for the
    cardinal function that counts the number of items in a set,


    ```

    \(\rightarrow \quad w_l^* = \frac{\sum_{i \in I_l}(y_i - m_{J-1}(\mathbf{x}_i))}{1
    + \frac{\lambda}{2} \#\{i \in I_l\}}, \text{ so that} \tag{6.5}\)


    \(O_L(q) = -\frac{1}{2} \sum_{l=1}^L \frac{\sum_{i \in I_l}(y_i - m_{J-1}(\mathbf{x}_i))^2}{1
    + \frac{\lambda}{2} \#\{i \in I_l\}} + \gamma L,\)

    ```


    where we added the dependence of the objective both in \(q\) (structure of tree)
    and \(L\) (number of leaves). Indeed, the meta-shape of the tree remains to be
    determined.


    # 6.4.4 Tree structure


    Final problem: the **tree structure**! Let us take a step back. In the construction
    of a simple regression tree, the output value at each node is equal to the average
    value of the label within the node (or cluster). When adding a new tree in order
    to reduce the loss, the node values must be computed completely differently, which
    is the purpose of Equation (6.5).


    Nonetheless, the growing of the iterative trees follows similar lines as simple
    trees. Features must be tested in order to pick the one that minimizes the objective
    for each given split. The final question is then: what''s the best depth and when
    to stop growing the tree? The method is to


    +   proceed node-by-node;


    +   for each node, look at whether a split is useful (in terms of objective) or
    not:


    ```

    \(\text{Gain} = \frac{1}{2} (\text{Gain}_L + \text{Gain}_R - \text{Gain}_O) -
    \gamma\)

    ```


    +   each gain is computed with respect to the instances in each bucket (cluster):


    ```

    \(\text{Gain}_{\mathcal{X}} = \frac{\sum_{i \in I_\mathcal{X}}(y_i - m_{J-1}(\mathbf{x}_i))^2}{1
    + \frac{\lambda}{2} \#\{i \in I_\mathcal{X}\}},\)

    ```


    where \(I_\mathcal{X}\) is the set of instances within cluster \(\mathcal{X}\).


    \(\text{Gain}_O\) is the original gain (no split) and \(\text{Gain}_L\) and \(\text{Gain}_R\)
    are the gains of the left and right clusters, respectively. One word about the
    \(-\gamma\) adjustment in the above formula: there is one unit of new leaves (two
    new minus one old)! This makes a one leaf difference; hence \(\Delta L = 1\) and
    the penalization intensity for each new leaf is equal to \(\gamma\).


    Lastly, we underline the fact that XGBoost also applies a **learning rate**: each
    new tree is scaled by a factor \(\eta\), with \(\eta \in [0, 1]\). After each
    step of boosting the new tree \(T_J\) sees its values discounted by multiplying
    them by \(\eta\). This is very useful because a pure aggregation of 100 optimized
    trees is the best way to overfit the training sample.'
