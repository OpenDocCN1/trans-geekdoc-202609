  md: '# 10.2.3 The risk of overfitting: principle


    The notion of *overfitting* is one of the most important in machine learning.
    When a model overfits, the accuracy of its predictions will be disappointing,
    thus it is one major reason why *some* strategies fail out-of-sample. Therefore,
    it is important to understand not only what overfitting is, but also how to mitigate
    its effects.


    One recent reference on this topic and its impact on portfolio strategies is Hsu
    et al. (2018), which builds on the work of *White* (2000). Both of these references
    do not deal with ML models, but the principle is the same. When given a dataset,
    a sufficiently intense level of analysis (by a human or a machine) will always
    be able to detect some patterns. Whether these patterns are spurious or not is
    the key question.


    In Figure 10.8, we illustrate this idea with a simple visual example. We try to
    find a model that maps x into y. The (training) data points are the small black
    circles. The simplest model is the constant one (only one parameter), but with
    two parameters (level and slope), the fit is already quite good. This is shown
    with the blue line. With a sufficient number of parameters, it is possible to
    build a model that flows through all the points. One example would be a high-dimensional
    polynomial. One such model is represented with the red line. Now there seems be
    a strange point in the dataset and the complex model fits closely to match this
    point.


    ![](img/8861a37f775d09b4ba7a5151f604d9f5_176_0.png)


    FIGURE 10.8: Illustration of overfitting: a model closely matching training data
    is rarely a good idea.


    A new point is added in light green. It is fair to say that it follows the general
    pattern of the other points. The simple model is not perfect and the error is
    non-negligible. Nevertheless, the error stemming from the complex model (shown
    with the dotted gray line) is approximately twice as large. This simplified example
    shows that models that are too close to the training data will catch idiosyncrasies
    that will not occur in other datasets. A good model would overlook these idiosyncrasies
    and stick to the enduring structure of the data.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# 10.2.4 The risk of overfitting: some solutions


    Obviously, the easiest way to avoid overfitting is to resist the temptation of
    complicated models (e.g., high-dimensional neural networks or tree ensembles).


    The complexity of models is often proxied via two measures: the number of parameters
    of the model and their magnitude (often synthesized through their norm). These
    proxies are not perfect because some complex models may only require a small number
    of parameters (or even small parameter values), but at least they are straightforward
    and easy to handle. There is no universal way of handling overfitting. Below,
    we detail a few tricks for some families of ML tools.


    For regressions, there are two simple ways to deal with overfitting. The first
    is the number of parameters, that is, the number of predictors. Sometimes, it
    can be better to only select a subsample of features, especially if some of them
    are highly correlated (often, a threshold of 70% is considered as too high for
    absolute correlations between features). The second solution is penalization (via
    LASSO, ridge or elasticnet), which helps reduce the magnitude of estimates and
    thus of the variance of predictions.


    For tree-based methods, there are a variety of ways to reduce the risk of overfitting.
    When dealing with simple trees, the only way to proceed is to limit the number
    of leaves. This can be done in many ways. First, by imposing a maximum depth.
    If it is equal to d, then the tree can have at most 2^d terminal nodes. It is
    often advised not to go beyond d = 6. The complexity parameter in rpart (cp) is
    another way to shrink the size of trees: any new split must lead to a reduction
    in loss at least equal to cp. If not, the split is not deemed useful and is thus
    not performed. Thus when cp is large, the tree is not grown. The last two parameters
    available in rpart are the minimum number of instances required in each leaf and
    the minimum number of instances per cluster requested in order to continue the
    splitting process. The higher (i.e., the more coercive) these figures are, the
    harder it is to grow complex trees.


    In addition to these options, random forests allow to control for the number of
    trees in the forest. Theoretically (see Breiman (2001)), this parameter is not
    supposed to impact the risk of overfitting because new trees only help reduce
    the total error via diversification. In practice, and for the sake of computation
    times, it is not recommended to go beyond 1,000 trees. Two other hyperparameters
    are the subsample size (on which each learner is trained) and the number of features
    retained for learning. They do not have a straightforward impact on bias and tradeoff,
    but rather on raw performance. For instance, if subsamples are too small, the
    trees will not learn enough. Same problem if the number of features is too low.
    On the other hand, choosing a large number of predictors (i.e., close to the total
    number) may lead to high correlations between each learner''s prediction because
    the overlap in information contained in the training samples may be high.


    Boosted trees have other options that can help alleviate the risk of overfitting.
    The most obvious one is the learning rate, which discounts the impact of each
    new tree by η ∈ (0, 1). When the learning rate is high, the algorithm learns too
    quickly and is prone to sticking close to the training data. When it''s low, the
    model learns very progressively, which can be efficient if there are sufficiently
    many trees in the ensemble. Indeed, the learning rate and the number of trees
    must be chosen synchronously: if both are low, the ensemble will learn nothing
    and if both are large, it will overfit. The arsenal of boosted tree parameters
    does not stop there. The penalizations, both of score values and of the number
    of leaves, are naturally a tool to prevent the model from going to deep in the
    particularities of the training sample.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'Finally, constraints of monotonicity like those mentioned in Section 6.4.5
    are also an efficient way to impose some structure on the model and force it to
    detect particular patterns.


    Lastly **neural networks** also have many options aimed at protecting them against
    overfitting. Just like for boosted trees, some of them are the learning rate and
    the penalization of weights and biases (via their norm). Constraints, like nonnegative
    constraints, can also help when the model theoretically requires positive inputs.
    Finally, dropout is always a direct way to reduce the dimension (number of parameters)
    of a network.


    # 10.3 The search for good hyperparameters


    # 10.3.1 Methods


    Let us assume that there are $p$ parameters to be defined before a model is run.
    The simplest way to proceed is to test different values of these parameters and
    choose the one that yields the best results. There are mainly two ways to perform
    these tests: independently and sequentially.


    Independent tests are easy and come in two families: grid (deterministic) search
    and random exploration. The advantage of a deterministic approach is that it covers
    the space uniformly and makes sure that no corners are omitted. The drawback is
    the computation time. Indeed, for each parameter, it seems reasonable to test
    at least five values, which makes $5^p$ combinations. If $p$ is small (smaller
    than 3), this is manageable when the backtests are not too lengthy. When $p$ is
    large, the number of combinations may become prohibitive. This is when random
    exploration can be useful because in this case, the user specifies the number
    of tests upfront and the parameters are drawn randomly (usually uniformly over
    a given range for each parameter). The flaw in random search is that some areas
    in the parameter space may not be covered, which can be problematic if the best
    choice is located there. It is nonetheless shown in Bergstra and Bengio (2012)
    that random exploration is preferable to grid search.


    Both grid and random searches are suboptimal because they are likely to spend
    time in zones of the parameter space that are irrelevant, thereby wasting computation
    time. Given a number of parameter points that have been tested, it is preferable
    to focus the search in areas where the best points are the most likely. This is
    possible via an interative process that adapts the search after each new point
    has been tested.


    One other popular approach in this direction is **Bayesian optimization** (BO).
    The central object is the objective function of the learning process. We call
    this function $O$ and it can be widely seen as a loss function possibly combined
    with penalization and constraints. For simplicity here, we will not mention the
    training/testing samples and they are considered to be fixed. The variable of
    interest is the vector $\mathbf{p} = (p_1, ..., p_l)$ which synthesizes the hyperparameters
    (learning rate, penalization intensities, number of models, etc.) that have an
    impact on $O$. The program we are interested in is


    ```

    \(\mathbf{p}_* = \underset{\mathbf{p}}{\text{argmin}} \, O(\mathbf{p}).\) (10.10)

    ```


    The main problem with this optimization is that the computation of $O(\mathbf{p})$
    is very costly.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# 10.3 The search for good hyperparameters


    Therefore, it is critical to choose each trial for **b** wisely. One key assumption
    of BO is that the distribution of $O$ is Gaussian and that $O$ can be proxied
    by a linear combination of the $p_i$. Said differently, the aim is to build a
    Bayesian linear regression between the input $\mathbf{p}$ and the output (dependent
    variable) $O$. Once a model has been estimated, the information that is concentrated
    in the posterior density of $O$ is used to make an educated guess at where to
    look for new values of $\mathbf{p}$.


    This educated guess is made based on a so-called **acquisition function**. Suppose
    we have tested $m$ values for $\mathbf{p}$, which we write $\mathbf{p}^{(m)}$.
    The current best parameter is written $\mathbf{p}_m^* = \underset{1 \le k \le
    m}{\text{argmin}} O(\mathbf{p}^{(k)})$. If we test a new point $\mathbf{p}$, then
    it will lead to an improvement only if $O(\mathbf{p}) < O(\mathbf{p}_m^*)$, that
    is if the new objective improves the minimum value that we already know. The average
    value of this improvement is


    ```

    \(\mathbf{EI}_m(\mathbf{p}) = \mathbb{E}_m[[O(\mathbf{p}_m^*) - O(\mathbf{p})]_+],\)
    (10.11)

    ```


    where the positive part $[\cdot]_+$ emphasizes that when $O(\mathbf{p}) \ge O(\mathbf{p}_m^*)$,
    the gain is zero. The expectation is indexed by $m$ because it is computed with
    respect to the posterior distribution of $O(\mathbf{p})$ based on the $m$ samples
    $\mathbf{p}^{(m)}$. The best choice for the next sample $\mathbf{p}^{m+1}$ is
    then


    ```

    \(\mathbf{p}^{m+1} = \underset{\mathbf{p}}{\text{argmax}} \mathbf{EI}_m(\mathbf{p}),\)
    (10.12)

    ```


    which corresponds to the maximum location of the expected improvement. Instead
    of the EI, the optimization can be performed on other measures, like the probability
    of improvement, which is $\mathbb{P}_m[O(\mathbf{p}) < O(\mathbf{p}_m^*)]$.


    In compact form, the iterative process can be outlined as follows:


    +   - **step 1**: compute $O(\mathbf{p}^{(m)})$ for $m = 1, \dots, M_0$ values
    of parameters.

    +   - **step 2a**: compute sequentially the posterior density of $O$ on all available
    points.

    +   - **step 2b**: compute the optimal new point to test $\mathbf{p}^{m+1}$ given
    in Equation (10.12).

    +   - **step 2c**: compute the new objective value $O(\mathbf{p}^{m+1})$.


    +   - **step 3**: repeat steps 2a to 2c as much as deemed reasonable and return
    the $\mathbf{p}^m$ that yields the smallest objective value.


    The interested reader can have a look at Snoek et al. (2012) and Frazier (2018)
    for more details on the numerical facets of this method.


    Finally, for the sake of completeness, we mention a last way to tune hyperparameters.
    Since the optimization scheme is $\underset{\mathbf{p}}{\text{argmin}} O(\mathbf{p})$,
    a natural way to proceed would be to use the sensitivity of $O$ with respect to
    $\mathbf{p}$. Indeed, if the gradient $\frac{\partial O}{\partial p_i}$ is known,
    then a gradient descent will always improve the objective value. The problem is
    that it is hard to compute a reliable gradient (finite differences can become
    costly). Nonetheless, some methods (e.g., Maclaurin et al. (2015)) have been applied
    successfully to optimize over large dimensional parameter spaces.


    We conclude by mentioning the survey Bouthillier and Varoquaux (2020), which spans
    2 major AI conferences that took place in 2019. It shows that most papers resort
    to hyperparameter tuning. The two most often cited methods are *manual tuning*
    (hand-picking) and *grid search*.'
  merge: -1
  img_proc: true
- pgno: 180
  md: "# 10.3.2 Example: grid search\n\nIn order to illustrate the process of grid\
    \ search, we will try to find the best parameters for a boosted tree. We seek\
    \ to quantify the impact of three parameters:\n\n+   eta, the learning rate,\n\
    \n+   nrounds, the number of trees that are grown,\n\n+   lambda, the weight regularizer\
    \ which penalizes the objective function through the total sum of squared weights/scores.\n\
    \nBelow, we create a grid with the values we want to test for these parameters.\n\
    \n```\neta <- c(0.1, 0.3, 0.5, 0.7, 0.9)   # Values for eta\nnrounds <- c(10,\
    \ 50, 100)           # Values for nrounds\nlambda <- c(0.01, 0.1, 1, 10, 100)\
    \  # Values for lambda\npars <- expand.grid(eta, nrounds, lambda) # Exploring\
    \ all combinations!\nhead(pars)                          # Let's see the parameters\n\
    ```\n\n```\n##  Var1 Var2 Var3\n## 1  0.1  10  0.01\n## 2  0.3  10  0.01\n## 3\
    \  0.5  10  0.01\n## 4  0.7  10  0.01\n## 5  0.9  10  0.01\n## 6  0.1  50  0.01\n\
    ```\n\n```\neta <- pars[,1]\nnrounds <- pars[,2]\nlambda <- pars[,3]\n```\n\n\
    Given the computational cost of grid search, we perform the exploration on the\
    \ dataset with the small number of features (which we recycle from Chapter 6).\
    \ In order to avoid the burden of loops, we resort to the functional programming\
    \ capabilities of R, via the purrr package. This allows us to define a function\
    \ that will lighten and simplify the code. This function, coded below, takes data\
    \ and parameter inputs and returns an error metric for the algorithm. We choose\
    \ the mean squared error to evaluate the impact of hyperparameter values.\n\n\
    ```\ngrid_par <- function(train_matrix, test_features, test_label, eta, nrounds,\
    \ lambda){\n  fit <- train_matrix %>% \n    xgb.train(data = .,             #\
