    ```

    \( q_\pi(s, a) = \sum_{a'', r, s} \pi(a'', s'') p(s'', r|s, a) [r + \gamma \mathbb{E}_\pi
    [G_{t+1} | S_t = s'', A_t = a'']] \

    = \sum_{a'', r, s} \pi(a'', s'') p(s'', r|s, a) [r + \gamma q_\pi(s'', a'')].
    \quad (16.6) \)

    ```


    This equation links \( q_\pi(s, a) \) to the future \( q_\pi(s'', a'') \) from
    the states and actions \( (s'', a'') \) that are accessible from \( (s, a) \).


    Notably, Equation (16.6) is also true for the optimal action-value function \(
    q_* = \max_\pi q_\pi(s, a) \):


    ```

    \( q_*(s, a) = \max_a \sum_{r, s} p(s'', r|s, a) [r + \gamma q_*(s'', a'')] ,
    \

    = \mathbb{E}_\pi [r|s, a] + \gamma \sum_{r, s} p(s'', r|s, a) \max_a q_*(s'',
    a'') \quad (16.7) \)

    ```


    because one optimal policy is one that maximizes \( q_\pi(s, a) \), for a given
    state \( s \) and over all possible actions \( a \). This expression is central
    to a cornerstone algorithm in reinforcement learning called \( Q \)-learning (the
    formal proof of convergence is outlined in Watkins and Dayan (1992)). In \( Q
    \)-learning, the state-action function no longer depends on policy and is written
    with capital \( Q \). The process is the following:


    Initialize values \( Q(s, a) \) for all states \( s \) and actions \( a \). For
    each episode:


    +   - Initialize state \( S_0 \) and for each iteration \( i \) until the end
    of the episode;

    +   - observe state \( s_i \);

    +   - perform action \( a_i \) (depending on \( Q \));

    +   - receive reward \( r_{i+1} \) and observe state \( s_{i+1} \);

    +   - Update \( Q \) as follows:


    ```

    \( Q_{i+1}(s_i, a_i) \longleftarrow Q_i(s_i, a_i) + \eta \left( \underbrace{r_{i+1}
    + \gamma \max_a Q_i(s_{i+1}, a) - Q_i(s_i, a_i)}_{\text{echo of (16.7)}} \right)
    \quad (16.8) \)

    ```


    The underlying reason this update rule works can be linked to fixed point theorems
    of contraction mappings. If a function \( f \) satisfies \( |f(x) - f(y)| < \delta
    |x - y| \) (Lipshitz continuity), then a fixed point \( z \) satisfying \( f(z)
    = z \) can be iteratively obtained via \( z \leftarrow f(z) \). This updating
    rule converges to the fixed point. Equation (16.7) can be solved using a similar
    principle, except that a learning rate \( \eta \) slows the learning process but
    also technically ensures convergence under technical assumptions.


    More generally, (16.8) has a form that is widespread in reinforcement learning
    that is summarized in Equation (2.4) of Sutton and Barto (2018):


    ```

    \(\text{New estimate} \leftarrow \text{Old estimate} + \text{Step size (i.e.,
    learning rate)} \times (\text{Target - Old estimate}), \quad (16.9) \)

    ```


    where the last part can be viewed as an error term. Starting from the old estimate,
    the new estimate therefore goes in the ‘right’ (or sought) direction, modulo a
    discount term that'
