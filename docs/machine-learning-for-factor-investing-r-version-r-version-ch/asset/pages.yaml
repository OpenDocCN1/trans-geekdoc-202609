  md: 'gradient be equal to zero:


    $$ \nabla_\beta L = \frac{\partial}{\partial \beta}(y - X\beta)''(y - X\beta)
    = \frac{\partial}{\partial \beta}\beta''X''X\beta - 2y''X\beta $$ $$ = 2X''X\beta
    - 2X''y $$


    so that the first order condition \(\nabla_\beta L = 0\) is satisfied if


    $$ \beta^* = (X''X)^{-1}X''y, \quad (5.1) $$


    which is known as the standard ordinary least squares (OLS) solution of the linear
    model. If the matrix X has dimensions \(I \times K\), then the \(X''X\) can only
    be inverted if the number of rows \(I\) is strictly superior to the number of
    columns \(K\). In some cases, that may not hold; there are more predictors than
    instances and there is no unique value of \(\beta\) that minimizes the loss. If
    \(X''X\) is nonsingular (or positive definite), then the second order condition
    ensures that \(\beta^*\) yields a global minimum for the loss \(L\) (the second
    order derivative of \(L\) with respect to \(\beta\), the Hessian matrix, is exactly
    \(X''X\)).


    Up to now, we have made no distributional assumption on any of the above quantities.


    Standard assumptions are the following:


    +   - E[y|X] = X\beta: linear shape for the regression function;

    +   - E[\epsilon|X] = 0: errors are independent of predictors;

    +   - E[\epsilon\epsilon''|X] = \sigma^2 I: homoscedasticity - errors are uncorrelated
    and have identical variance;

    +   - the \epsilon_i are normally distributed.


    Under these hypotheses, it is possible to perform statistical tests related to
    the \(\hat{\beta}\) coefficients. We refer to chapters 2 to 4 in Greene (2018)
    for a thorough treatment on linear models as well as to chapter 5 of the same
    book for details on the corresponding tests.


    # 5.1.2 Forms of penalizations


    Penalized regressions have been popularized since the seminal work of Tibshirani
    (1996). The idea is to impose a constraint on the coefficients of the regression,
    namely that their total magnitude be restrained. In his original paper, Tibshirani
    (1996) proposes to estimate the following model (LASSO):


    $$ y_i = \sum_{j=1}^J \beta_j x_{i,j} + \epsilon_i, \quad i = 1, \dots, I, \quad
    \text{s.t.} \quad \sum_{j=1}^J |\beta_j| < \delta, \quad (5.2) $$


    for some strictly positive constant \(\delta\). Under least square minimization,
    this amounts to solve the Lagrangian formulation:


    $$ \min_\beta \left\{ \sum_{i=1}^I \left( y_i - \sum_{j=1}^J \beta_j x_{i,j} \right)^2
    + \lambda \sum_{j=1}^J |\beta_j| \right\}, \quad (5.3) $$


    for some value \(\lambda > 0\) which naturally depends on \(\delta\) (the lower
    the \(\delta\), the higher the \(\lambda\): the constraint is more binding). This
    specification seems close to the ridge regression (\(L^2\) regularization), which
    is in fact anterior to the Lasso:


    $$ \min_\beta \left\{ \sum_{i=1}^I \left( y_i - \sum_{j=1}^J \beta_j x_{i,j} \right)^2
    + \lambda \sum_{j=1}^J \beta_j^2 \right\}, \quad (5.4) $$'
