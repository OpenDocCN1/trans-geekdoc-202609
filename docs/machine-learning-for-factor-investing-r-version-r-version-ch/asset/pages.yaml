  md: "# # 18.6 Chapter 9\n\nSince we are going to reproduce a similar analysis several\
    \ times, let’s simplify the task with 2 tips. First, by using default parameter\
    \ values that will be passed as common arguments to the `svm` function. Second,\
    \ by creating a custom function that computes the MSE. Third, by resorting to\
    \ functional calculus via the `map` function from the `purrr` package. Below,\
    \ we recycle datasets created in Chapter 6.\n\n```\nmse <- function(fit, features,\
    \ label){\n  return(mean((predict(fit, features)-label)^2))\n}\npar_list <- list(y\
    \ = train_label_xgb[1:10000],\n                 x = train_features_xgb[1:10000,],\n\
    \                 type = \"eps-regression\",\n                 epsilon = 0.1,\n\
    \                 gamma = 0.5,\n                 cost = 0.1)\nsvm_par <- function(kernel,\
    \ par_list){\n  require(e1071)\n  return(do.call(svm, c(kernel = kernel, par_list)))\n\
    }\nkernels <- c(\"linear\", \"radial\", \"polynomial\", \"sigmoid\")\nfit_svm_par\
    \ <- map(kernels, svm_par, par_list = par_list)\nmap(fit_svm_par, mse,\n    features\
    \ = test_feat_short,\n    label = testing_sample$RIM_Usd)\n```\n\n```\n## [[1]]\n\
    ## [1] 0.03849786\n## [[2]]\n## [1] 0.03924576\n## [[3]]\n## [1] 0.03951328\n\
    ## [[4]]\n## [1] 334.8173\n```\n\nThe first two kernels yield the best fit, while\
    \ the last one should be avoided. Note that apart from the linear kernel, all\
