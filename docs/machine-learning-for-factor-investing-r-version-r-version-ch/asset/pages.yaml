    With these tools in hand, it is possible to build new predictive tools. In Hoseinzade
    and Haratizadeh (2019), predictors such as price quotes, technical indicators
    and macro-economic data are fed to a complex neural network with 6 layers in order
    to predict the sign of price variations. While this is clearly an interesting
    computer science exercise, the deep economic motivation behind this choice of
    architecture remains unclear.


    # 7.6.4 Advanced architectures


    The superiority of neural networks in tasks related to computer vision and natural
    language processing is now well established. However, in many ML tournaments in
    the 2010 decade, neural networks have often been surpassed by tree-based models
    when dealing with tabular data. This puzzle encouraged researchers to construct
    novel NN structures that are better suited to tabular databases. Examples include
    Arik and Pfister (2019) and Popov et al. (2019), but their ideas lie outside the
    scope of this book. Surprisingly, the reverse idea also exists: Nuti et al. (2019)
    try to adapt trees and random forests so that they behave more like neural networks.
    The interested reader can have a look at the original papers.


    # 7.7 Coding exercise


    The purpose of the exercise is to code the autoencoder model described in Gu et
    al. (2020a) (see Section 7.6.2). When coding NNs, the dimensions must be rigorously
    reported. This is why we reproduce a diagram of the model in Figure 7.13 which
    clearly shows the inputs and outputs along with their dimensions.'
