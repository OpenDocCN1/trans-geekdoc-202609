- pgno: 92
  md: 'clusters that are as pure as possible, i.e., with one very dominant class,
    or at least just a few dominant classes. There are several metrics proposed by
    the literature and all are based on the proportions generated by the output. If
    there are _J_ classes, we denote these proportions with _p<sub>j</sub>_. For each
    leaf, the usual loss functions are:


    +   • the Gini impurity index: \(1 - \sum_{j=1}^J p_j^2\);


    +   • the misclassification error: \(1 - \max_j p_j\);


    +   • entropy: \(-\sum_{j=1}^J \log(p_j)p_j\).


    The Gini index is nothing but one minus the Herfindahl index which measures the
    diversification of a portfolio. Trees seek partitions that are the least diversified.
    The minimum value of the Gini index is zero and reached when one _p<sub>j</sub>_
    = 1 and all others are equal to zero. The maximum value is equal to \(1 - 1/J\)
    and is reached when all _p<sub>j</sub>_ = 1/_J_. Similar relationships hold for
    the other two losses. One drawback of the misclassification error is its lack
    of differentiability which explains why the other two options are often favored.


    Once the tree is grown, new instances automatically belong to one final leaf.
    This leaf is associated to the proportions of classes it nests. Usually, to make
    a prediction, the class with highest proportion (or probability) is chosen when
    a new instance is associated with the leaf.


    # ## 6.1.3 Pruning criteria


    When building a tree, the splitting process can be pursued until the full tree
    is grown, that is, when:


    +   • all instances belong to separate leaves, and/or


    +   • all leaves comprise instances that cannot be further segregated based on
    the current set of features.


    At this stage, the splitting process cannot be pursued.


    Obviously, fully grown trees often lead to almost perfect fits when the predictors
    are relevant, numerous and numerical. Nonetheless, the fine grained idiosyncrasies
    of the training sample are of little interest for out-of-sample predictions. For
    instance, being able to perfectly match the patterns of 2000 to 2006 will probably
    not be very interesting in the period from 2007 to 2009. The most reliable sections
    of the trees are those closest to the root because they embed large portions of
    the data: the average values in the early clusters are trustworthy because the
    are computed on a large number of observations. The first splits are those that
    matter the most because they determine the most general patterns. The deepest
    splits only deal with the peculiarities of the sample.


    Thus, it is imperative to limit the size of the tree to avoid overfitting. There
    are several ways to prune the tree and all depend on some particular criteria.
    We list a few of them below:


    +   • Impose a minimum number of instances for each terminal node (leaf). This
    ensures that each final cluster is composed of a sufficient number of observations.
    Hence, the average value of the label will be reliable because it is calculated
    on a large amount of data.


    +   • Similarly, it can be imposed that a cluster has a minimal size before even
    considering any'
