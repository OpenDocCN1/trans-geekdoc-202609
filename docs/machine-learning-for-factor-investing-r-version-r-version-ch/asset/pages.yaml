  md: "We preferred to limit the number of features shown on the graph for obvious\
    \ readability concerns.\n\nThere are differences in the way the models rely on\
    \ the features. For instance, the most important feature changes from a model\
    \ to the other: the simple tree model gives the most importance to the price-to-book\
    \ ratio, while the random forest bets more on volatility and boosted trees give\
    \ more weight to capitalization.\n\nOne defining property of random forests is\
    \ that they give a chance to all features. Indeed, by randomizing the choice of\
    \ predictors, each individual exogenous variable has a shot at explaining the\
    \ label. Along with boosted trees, the allocation of importance is more balanced\
    \ across predictors, compared to the simple tree which puts most of its eggs in\
    \ just a few baskets.\n\n# ## 13.1.3 Variable importance (agnostic)\n\nThe idea\
    \ of quantifying the importance of each feature in the learning process can be\
    \ extended to nontree-based models. We refer to the papers mentioned in the study\
    \ by Fisher et al. (2019) for more information on this stream of the literature.\
    \ The premise is the same as above: the aim is to quantify to what extent one\
    \ feature contributes to the learning process.\n\nOne way to track the added value\
    \ of one particular feature is to look at what happens if its values inside the\
    \ training set are entirely shuffled. If the original feature plays an important\
    \ role in the explanation of the dependent variable, then the shuffled version\
    \ of the feature will lead to a much higher loss.\n\nThe baseline method to assess\
    \ feature importance in the general case is the following:\n\n+   1. Train the\
    \ model on the original data and compute the associated loss \\( l^* \\).\n+ \
    \  \n+   2. For each feature \\( k \\), create a new training dataset in which\
    \ the feature's values are randomly permuted. Then, evaluate the loss \\( l_k\
    \ \\) of the model based on this altered sample.\n+   \n+   3. Rank the variable\
    \ importance of each feature, computed as a difference VI\\(_k = l_k - l^* \\\
    ) or a ratio VI\\(_k = l_k / l^* \\).\n\nWhether to compute the losses on the\
    \ training set or the testing set is an open question and remains to the appreciation\
    \ of the analyst. The above procedure is of course random and can be repeated\
    \ so that the importances are averaged over several trials: this improves the\
    \ stability of the results. This algorithm is implemented in the FeatureImp()\
    \ function of the iml R package developed by the author of Molnar (2019). We also\
    \ recommend the vip package, see Greenwell and Boehmke (ming).\n\nBelow, we implement\
    \ this algorithm manually so to speak for the features appearing in Figure 13.2.\
    \ We test this approach on ridge regressions and recycle the variables used in\
    \ Chapter 5. We start by the first step: computing the loss on the original training\
