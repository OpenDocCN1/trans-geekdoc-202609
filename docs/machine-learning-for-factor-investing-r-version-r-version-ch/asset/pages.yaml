    # FIGURE 15.1: Correlation matrix of predictors.


    In the remainder of the chapter, we present two approaches that help reduce the
    number of predictors:


    +   - the first one aims at creating new variables that are uncorrelated with
    each other. Low correlation is favorable from an algorithmic point of view, but
    the new variables lack interpretability;

    +   - the second one gathers predictors into homogeneous clusters and only one
    feature should be chosen out of this cluster. Here the rationale is reversed:
    interpretability is favored over statistical properties because the resulting
    set of features may still include high correlations, albeit to a lesser point
    compared to the original one.


    # 15.2 Principal component analysis and autoencoders


    The first method is a cornerstone in dimensionality reduction. It seeks to determine
    a smaller number of factors (K′ < K) such that:

    - i) the level of explanatory power remains as high as possible;'
