- pgno: 247
  md: '# ## 14.2.2 Online learning


    Online learning refers to a subset of machine learning in which new information
    arrives progressively and the integration of this flow is performed iteratively
    (the term ‘online’ is not linked to the internet). In order to take the latest
    data updates into account, it is imperative to update the model (stating the obvious).
    This is clearly the case in finance and this topic is closely related to the discussion
    on learning windows in Section 12.1.


    The problem is that if a 2019 model is trained on data from 2010 to 2019, the
    (dynamic) 2020 model will have to be re-trained with the whole dataset including
    the latest points from 2020. This can be heavy and including just the latest points
    in the learning process would substantially decrease its computational cost. In
    neural networks, the sequential batch updating of weights can allow a progressive
    change in the model. Nonetheless, this is typically impossible for decision trees
    because the splits are decided once and for all. One notable exception is Basak
    (2004), but, in that case, the construction of the trees differs strongly from
    the original algorithm.


    The simplest example of online learning is the Widrow-Hodd algorithm (originally
    from Widrow and Hoff (1960)). Originally, the idea comes from the so-called ADALINE
    (ADAptive LInear NEuron) model which is a neural network with one hidden layer
    with linear activation function (i.e., like a perceptron, but with a different
    activation).


    Suppose the model is linear, that is \(\mathbf{y} = \mathbf{X}\mathbf{b} + \mathbf{e}\)
    (a constant can be added to the list of predictors) and that the amount of data
    is both massive and coming in at a high frequency so that updating the model on
    the full sample is proscribed because it is technically intractable. A simple
    and heuristic way to update the values of \(\mathbf{b}\) is to compute


    ```

    \(\mathbf{b}_{t+1} \longleftarrow \mathbf{b}_t - \eta(\mathbf{x}_t \mathbf{b}
    - y_t)\mathbf{x}''_t,\)

    ```


    where \(\mathbf{x}_t\) is the row vector of instance \(t\). The justification
    is simple. The quadratic error \((\mathbf{x}_t \mathbf{b} - y_t)^2\) has a gradient
    with respect to \(\mathbf{b}\) equal to \(2(\mathbf{x}_t \mathbf{b} - y_t)\mathbf{x}''_t\);
    therefore, the above update is a simple example of gradient descent. \(\eta\)
    must of course be quite small: if not, each new point will considerably alter
    \(\mathbf{b}\), thereby resulting in a volatile model.


    An exhaustive review of techniques pertaining to online learning is presented
    in Hoi et al. (2018) (section 4.11 is even dedicated to portfolio selection).
    The book Hazan et al. (2016) covers online convex optimization which is a very
    close domain with a large overlap with online learning. The presentation below
    is adapted from the second and third parts of the first survey.


    Datasets are indexed by time: we write \(\mathbf{X}_t\) and \(\mathbf{y}_t\) for
    features and labels (the usual column index \((k)\) and row index \((i)\) will
    not be used in this section). Time has a bounded horizon \(T\). The machine learning
    model depends on some parameters \(\theta\) and we denote it with \(f_\theta\).
    At time \(t\) (when dataset \((\mathbf{X}_t, \mathbf{y}_t)\) is gathered), the
    loss function \(L\) of the trained model naturally depends on the data \((\mathbf{X}_t,
    \mathbf{y}_t)\) and on the model via \(\theta_t\) which are the parameter values
    fitted to the time-\(t\) data. For notational simplicity, we henceforth write
    \(L_t(\theta_t) = L(\mathbf{X}_t, \mathbf{y}_t, \theta_t)\). The key quantity
    in online learning is the regret over the whole time sequence:


    ```

    \(R_T = \sum_{t=1}^T L_t(\theta_t) - \inf_{\theta^* \in \Theta} \sum_{t=1}^T L_t(\theta^*).\)
    (14.3)

    ```


    The regret is the total loss incurred by the models \(\theta_t\) minus the minimal
    loss that could have been obtained with full knowledge of the data sequence (hence
    computed in hindsight).'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'The basic methods in online learning are in fact quite similar to the batch-training
    of neural networks. The updating of the parameter is based on


    ```

    \mathbf{z}_{t+1} = \boldsymbol{\theta}_t - \eta_t \nabla L_t(\boldsymbol{\theta}_t),
    \quad (14.4)

    ```


    where \nabla L_t(\boldsymbol{\theta}_t) denotes the gradient of the current loss
    $L_t$. One problem that can arise is when \mathbf{z}_{t+1} falls out of the bounds
    that are prescribed for \boldsymbol{\theta}_t. Thus, the candidate vector for
    the new parameters, \mathbf{z}_{t+1}, is projected onto the feasible domain which
    we call $S$ here:


    ```

    \boldsymbol{\theta}_{t+1} = \Pi_S(\mathbf{z}_{t+1}), \quad \text{with } \Pi_S(\mathbf{u})
    = \underset{\boldsymbol{\theta} \in S}{\arg\min} \|\boldsymbol{\theta} - \mathbf{u}\|_2.
    \quad (14.5)

    ```


    Hence \boldsymbol{\theta}_{t+1} is as close as possible to the intermediate choice
    \mathbf{z}_{t+1}. In Hazan et al. (2007), it is shown that under suitable assumptions
    (e.g., $L_t$ being strictly convex with bounded gradient \sup_{\boldsymbol{\theta}}
    \nabla L_t(\boldsymbol{\theta}) \le G$), the regret $R_T$ satisfies


    ```

    R_T \le \frac{G^2}{2H}(1 + \log(T)),

    ```


    where $H$ is a scaling factor for the learning rate (also called step sizes):
    $\eta_t = (Ht)^{-1}$.


    More sophisticated online algorithms generalize (14.4) and (14.5) by integrating
    the Hessian matrix \nabla^2 L_t(\boldsymbol{\theta}) := [\nabla^2 L_t]_{i,j} =
    \frac{\partial}{\partial \theta_i \partial \theta_j} L_t(\boldsymbol{\theta})
    and/or by including penalizations to reduce instability in \boldsymbol{\theta}_t.
    We refer to section 2 in Hoi et al. (2018) for more details on these extensions.


    An interesting stream of parameter updating is that of the passive-aggressive
    algorithms (PAAs) formalized in Crammer et al. (2006). The base case involves
    classification tasks, but we stick to the regression setting below (section 5
    in Crammer et al. (2006)). One strong limitation with PAAs is that they rely on
    the set of parameters where the loss is either zero or negligible: \Theta^* =
    \{ \boldsymbol{\theta}, L_t(\boldsymbol{\theta}) < \epsilon \}. For general loss
    functions and learner $f$, this set is largely inaccessible. Thus, the algorithms
    in Crammer et al. (2006) are restricted to a particular case, namely linear $f$
    and $\epsilon$-insensitive hinge loss:


    ```

    L(\boldsymbol{\theta}) = \begin{cases} 0 & \text{if } |\boldsymbol{\theta}^\top
    \mathbf{x} - y| \le \epsilon \quad (\text{close enough prediction}) \\ |\boldsymbol{\theta}^\top
    \mathbf{x} - y| - \epsilon & \text{if } |\boldsymbol{\theta}^\top \mathbf{x} -
    y| > \epsilon \quad (\text{prediction too far}) \end{cases}

    ```


    for some parameter $\epsilon > 0$. If the weight \boldsymbol{\theta} is such that
    the model is close enough to the true value, then the loss is zero; if not, it
    is equal to the absolute value of the error minus $\epsilon$. In PAA, the update
    of the parameter is given by


    ```

    \boldsymbol{\theta}_{t+1} = \underset{\boldsymbol{\theta}}{\arg\min} \|\boldsymbol{\theta}
    - \boldsymbol{\theta}_t\|_2^2, \quad \text{subject to } L(\boldsymbol{\theta})
    = 0,

    ```


    hence the new parameter values are chosen such that two conditions are satisfied:
    - the loss is zero (by the definition of the loss, this means that the model is
    close enough to the true value); - and, the parameter is as close as possible
    to the previous parameter values.


    By construction, if the model is good enough, the model does not move (passive
    phase), but if not, it is rapidly shifted towards values that yield satisfactory
    results (aggressive phase).


    We end this section with a historical note. Some of the ideas from online learning
    stem from the financial literature and from the concept of **universal portfolios**
    originally coined by Cover (1991) in particular. The setting is the following.
    The function $f$ is assumed to be'
