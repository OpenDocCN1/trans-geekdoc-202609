    # 9.4 Naive Bayes classifier


    Bayes'' theorem can also be easily applied to **classification**. We formulate
    it with respect to the label and features and write


    ```

    $P[\mathbf{y}|\mathbf{X}] = \frac{P[\mathbf{X}|\mathbf{y}]P[\mathbf{y}]}{P[\mathbf{X}]}
    \propto P[\mathbf{X}|\mathbf{y}]P[\mathbf{y}],$ (9.10)

    ```


    and then split the input matrix into its column vectors $\mathbf{X} = (\mathbf{x}_1,
    \dots, \mathbf{x}_K)$. This yields


    ```

    $P[\mathbf{y}|\mathbf{x}_1, \dots, \mathbf{x}_K] \propto P[\mathbf{x}_1, \dots,
    \mathbf{x}_K|\mathbf{y}]P[\mathbf{y}].$ (9.11)

    ```


    The ‘naive’ qualification of the method comes from a simplifying assumption on
    the features.$^1$ If they are all mutually independent, then the likelihood in
    the above expression can be expanded into


    ```

    $P[\mathbf{y}|\mathbf{x}_1, \dots, \mathbf{x}_K] \propto P[\mathbf{y}] \prod_{k=1}^K
    P[\mathbf{x}_k|\mathbf{y}].$ (9.12)

    ```


    $^1$This assumption can be relaxed, but the algorithms then become more complex
    and are out of the scope of the current book. One such example that generalizes
    the naive Bayes approach is Friedman et al. (1997).'
