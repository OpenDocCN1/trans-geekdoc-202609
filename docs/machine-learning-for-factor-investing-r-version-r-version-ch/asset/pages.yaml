    In ML-based asset pricing, the most notable application of GANs was introduced
    in Chen et al. (2020). Their aim is to make use of the method of moment expression


    $\mathbb{E}[M_{t+1}r_{t+1,n}g(I_t, I_{t,n})] = 0,$


    which is an application of Equation (3.8) where the instrumental variables $I_{t,n}$
    are firm-dependent (e.g., characteristics and attributes) while the $I_t$ are
    macro-economic variables (aggregate dividend yield, volatility level, credit spread,
    term spread, etc.). The function $g$ yields a $d$-dimensional output, so that
    the above equation leads to $d$ moment conditions. The trick is to model the SDF
    as an unknown combination of assets $M_{t+1} = 1 - \frac{1}{n} \sum_{n=1}^N w(I_t,
    I_{t,n})r_{t+1,n}$. The primary discriminatory network ($D$) is the one that approximates
    the SDF via the weights $w(I_t, I_{t,n})$. The secondary generative network is
    the one that creates the moment condition through $g(I_t, I_{t,n})$ in the above
    equation.


    The full specification of the network is given by the program:


    $\min_w \max_g \sum_{j=1}^N \| \mathbb{E} \left[ \begin{pmatrix} 1 - \sum_{n=1}^N
    w(I_t, I_{t,n})r_{t+1,n} \\ r_{t+1,j}g(I_t, I_{t,j}) \end{pmatrix} \right] \|^2,$


    where the $L^2$ norm applies on the $d$ values generated via $g$. The asset pricing
    equations (moments) are not treated as equalities but as a relationship that is
    approximated. The network defined by $\mathbf{w}$ is the asset pricing modeler
    and tries to determine the best possible model, while the network defined by $\mathbf{g}$
    seeks to find the worst possible conditions so that the model performs badly.
    We refer to the original article for the full specification of both networks.
    In their empirical section, Chen et al. (2020) report that adopting a strong structure
    driven by asset pricing imperatives add values compared to a pure predictive ‘vanilla’
    approach such as the one detailed in Gu et al. (2020b). The out-of-sample behavior
    of decile sorted portfolios (based on the model''s prediction) display a monotonic
    pattern with respect to the order of the deciles.


    GANs can also be used to generate artificial financial data (see Efimov and Xu
    (2019), Marti (2019) and Wiese et al. (2020)), but this topic is outside the scope
    of the book.


    # 7.6.2 Autoencoders


    In the recent literature, autoencoders (AEs) are used in Huck (2019) (portfolio
    management), and Gu et al. (2020a) (asset pricing).


    AEs are a strange family of neural networks because they are classified among
    non-supervised algorithms. In the supervised jargon, their label is equal to the
    input. Like GANS, autoencoders consist of two networks, though the structure is
    very different: the first network encodes the input into some intermediary output
    (usually called the code), and the second network decodes the code into a modified
    version of the input.


    ![](img/8861a37f775d09b4ba7a5151f604d9f5_138_0.png)'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'Because autoencoders do not belong to the large family of supervised algorithms,
    we postpone their presentation to Section 15.2.3.


    The article Gu et al. (2020a) resorts to the idea of AEs while at the same time
    augmenting the complexity of their asset pricing model. From the simple specification
    \( r_t = \beta_{t-1}\mathbf{f}_t + e_t \) (we omit asset dependence for notational
    simplicity), they add the assumptions that the betas depend on firm characteristics,
    while the factors are possibly nonlinear functions of the returns themselves.
    The model takes the following form:


    \( r_{t,i} = \mathbf{NN}_{\mathbf{beta}}(\mathbf{x}_{t-1,i}) + \mathbf{NN}_{\mathbf{factor}}(\mathbf{r}_t)
    + e_{t,i},\) (7.14)


    where \(\mathbf{NN}_{\mathbf{beta}}\) and \(\mathbf{NN}_{\mathbf{factor}}\) are
    two neural networks. The above equation looks like an autoencoder because the
    returns are both inputs and outputs. However, the additional complexity comes
    from the second neural network \(\mathbf{NN}_{\mathbf{beta}}\). Modern neural
    network libraries such as Keras allow for customized models like the one above.
    The coding of this structure is left as exercise (see below).


    # 7.6.3 A word on convolutional networks


    Neural networks gained popularity during the 2010 decade thanks to a series of
    successes in computer vision competitions. The algorithms behind these advances
    are convolutional neural networks (CNNs). While they may seem a surprising choice
    for financial predictions, several teams of researchers in the Computer Science
    field have proposed approaches that rely on this variation of neural networks
    (Chen et al. (2016), Loreggia et al. (2016), Dingli and Fournier (2017), Tsantekidis
    et al. (2017), Hoseinzade and Haratizadeh (2019)). Hence, we briefly present the
    principle in this final section on neural networks. We lay out the presentation
    for CNNs of dimension two, but they can also be used in dimension one or three.


    The reason why CNNs are useful is because they allow to progressively reduce the
    dimension of a large dataset by keeping local information. An image is a rectangle
    of pixels. Each pixel is usually coded via three layers, one for each color: red,
    blue and green. But to keep things simple, let''s just consider one layer of,
    say 1,000 by 1,000 pixels, with one value for each pixel. In order to analyze
    the content of this image, a convolutional layer will reduce the dimension of
    inputs by resorting to some convolution. Visually, this simplification is performed
    by scanning and altering the values using rectangles with arbitrary weights.


    Figure 7.11 sketches this process (it is strongly inspired by Hoseinzade and Haratizadeh
    (2019)). The original data is a matrix (\( I \times K \)) \( x_{i,k} \) and the
    weights are also a matrix \( w_{j,l} \) of size (\( J \times L \)) with \( J <
    I \) and \( L < K \). The scanning transforms each rectangle of size (\( J \times
    L \)) into one real number. Hence, the output has a smaller size: \( (I - J +
    1) \times (K - L + 1) \). If \( I = K = 1,000 \) and \( J = L = 201 \), then the
    output has dimension \( (800 \times 800) \) which is already much smaller. The
    output values are given by


    \( o_{i,k} = \sum_{j=1}^J \sum_{l=1}^L w_{j,l} x_{i+j-1, k+l-1}.\)'
  merge: -1
  img_proc: true
