  md: 'This curse of dimensionality is accompanied by the fundamental question of
    training data. Two options are conceivable: market data versus simulations. Under
    a given controlled generator of samples, it is hard to imagine that the algorithm
    will beat the solution that maximizes a given utility function. If anything, it
    should converge towards the static optimal solution under a stationary data generating
    process (see, e.g., Chakoui et al. (2020) for trading tasks), which is by the
    way a very strong modelling assumption.


    This leaves market data as a preferred solution but even with large datasets,
    there is little chance to cover all the (actions, states) combinations mentioned
    above. Characteristics-based datasets have depths that run through a few decades
    of monthly data, which means several hundreds of time-stamps at most. This is
    by far too limited to allow for a reliable learning process. It is always possible
    to generate synthetic data (as in Yu et al. (2019)), but it is unclear that this
    will solidly improve the performance of the algorithm.


    # 16.3 Policy gradient


    # 16.3.1 Principle


    Beyond the discretization of action and state spaces, a powerful trick is **parametrization**.
    When \(a\) and \(s\) can take discrete values, action-value functions must be
    computed for all pairs \((a, s)\), which can be prohibitively cumbersome. An elegant
    way to circumvent this problem is to assume that the policy is driven by a relatively
    modest number of parameters. The learning process is then focused on optimizing
    this set of parameters \(\theta\). We then write \(\pi_\theta(a, s)\) for the
    probability of choosing action \(a\) in state \(s\). One intuitive way to define
    \(\pi_\theta(a, s)\) is to resort to a soft-max form:


    ```

    \(\pi_\theta(a, s) = \frac{e^{\theta \mathbf{h}(a,s)}}{\sum_b e^{\theta \mathbf{h}(b,s)}},\tag{16.14}\)

    ```


    where the output of function \(\mathbf{h}(a, s)\), which has the same dimension
    as \(\theta\) is called a feature vector representing the pair \((a, s)\). Typically,
    \(\mathbf{h}\) can very well be a simple neural network with two input units and
    an output dimension equal to the length of \(\theta\).


    One desired property for \(\pi_\theta\) is that it be differentiable with respect
    to \(\theta\) so that \(\theta\) can be improved via some gradient method. The
    most simple and intuitive results about policy gradients are known in the case
    of episodic tasks (finite horizon) for which it is sought to maximize the average
    gain \(\mathbb{E}_\theta[G_t]\) where the gain is defined in Equation (16.3).
    The expectation is computed according to a particular policy that depends on \(\theta\),
    this is why we use a simple subscript. One central result is the so-called policy
    gradient theorem which states that


    ```

    \(\nabla \mathbb{E}_\theta [G_t] = \mathbb{E}_\theta \left[ G_t \frac{\nabla \pi_\theta}{\pi_\theta}
    \right].\tag{16.15}\)

    ```


    This result can then be used for **gradient ascent**: when seeking to maximize
    a quantity, the parameter change must go in the upward direction:


    ```

    \(\theta \leftarrow \theta + \eta \nabla \mathbb{E}_\theta [G_t].\tag{16.16}\)

    ```'
