  md: '# 7.4 Code samples and comments for vanilla MLP


    There are several frameworks and libraries that allow robust and flexible constructions
    of neural networks. Among them, Keras and Tensorflow (developed by Google) are
    probably the most used at the time we write this book (PyTorch, from Facebook,
    is one alternative). For simplicity and because we believe it is the best choice,
    we implement the NN with Keras (which is the high level API of Tensorflow, see
    https://www.tensorflow.org). The original Python implementation is referred on
    https://keras.io, and the details for the R version can be found here: https://keras.rstudio.com.
    We recommend a thorough installation before proceeding. Because the native versions
    of Tensorflow and Keras are written in Python (and accessed by R via the reticulate
    package), a running version of Python is required below. To install Keras, please
    follow the instructions provided at https://keras.rstudio.com.


    In this section, we provide a detailed (though far from exhaustive) account of
    how to train neural networks with Keras. For the sake of completeness, we proceed
    in two steps. The first one relates to a very simple regression exercise. Its
    purpose is to get the reader familiar with the syntax of Keras. In the second
    step, we lay out many of the options proposed by Keras to perform a classification
    exercise. With these two examples, we thus cover most of the mainstream topics
    falling under the umbrella of feed-forward multilayered perceptrons.


    # 7.4.1 Regression example


    Before we head to the core of the NN, a short stage of data preparation is required.
    Just as for penalized regressions (glmnet package) and boosted trees (xgboost
    package), the data must be sorted into four parts which are the combination of
    two dichotomies: training versus testing and labels versus features. We define
    the corresponding variables below. For simplicity, the first example is a regression
    exercise. A classification task will be detailed below.


    ```

    ```

    NN_train_features <- dplyr::select(training_sample, features) %>%   # Training
    features

    as.matrix()                                   # Matrix = important

    NN_train_labels <- training_sample$R1M_Usd     # Training labels

    NN_test_features <- dplyr::select(testing_sample, features) %>% # Testing features

    as.matrix()                                   # Matrix = important

    NN_test_labels <- testing_sample$R1M_Usd      # Testing labels

    ```

    ```


    In Keras, the training of neural networks is performed through three steps:


    +   1. Defining the structure/architecture of the network;

    +   2. Setting the loss function and learning process (options on the updating
    of weights);

    +   3. Train by specifying the batch sizes and number of rounds (epochs).


    We start with a very simple architecture with two hidden layers.


    ```

    ```

    library(keras)

    # install_keras() # To complete installation

    model <- keras_model_sequential()

    ```

    ```'
