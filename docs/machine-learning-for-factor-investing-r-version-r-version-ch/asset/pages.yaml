    \nThe accuracy is disappointing. There are two potential explanations for this\
    \ (beyond the possibility of very different patterns in the training and testing\
    \ sets). The first one is the sample size, which may be too small. The original\
    \ training set has more than 200,000 observations, hence we retain only one in\
    \ 10 in the above training specification. We are thus probably sidelining relevant\
    \ information and the cost can be heavy. The second reason is the number of predictors,\
    \ which is set to 30, i.e., one third of the total at our disposal. Unfortunately,\
    \ this leaves room for the algorithm to pick less pertinent predictors. The default\
    \ numbers of predictors chosen by the routines are $\\sqrt{p}$ and \\(p/3\\) for\
    \ classification and regression tasks, respectively. Here \\(p\\) is the total\
    \ number of features.\n\n# ## 6.3 Boosted trees: Adaboost\n\nThe idea of boosting\
    \ is slightly more advanced compared to agnostic aggregation. In random forest,\
    \ we hope that the diversification through many trees will improve the overall\
    \ quality of the model. In boosting, it is sought to iteratively improve the model\
    \ whenever a new tree is added. There are many ways to boost learning and we present\
    \ two that can easily be implemented with trees. The first one (Adaboost, for\
    \ adaptive boosting) improves the learning process by progressively focusing on\
    \ the instances that yield the largest errors. The second one (xgboost) is a flexible\
    \ algorithm in which each new tree is only focused on the minimization of the\
    \ training sample loss.\n\n# ### 6.3.1 Methodology\n\nThe origins of adaboost\
    \ go back to Freund and Schapire (1997) and Freund and Schapire (1996), and for\
    \ the sake of completeness, we also mention the book dedicated to boosting by\
    \ Schapire and Freund (2012). Extensions of these ideas are proposed in Friedman\
    \ et al. (2000) (the so-called real Adaboost algorithm) and in Drucker (1997)\
    \ (for regression analysis). Theoretical treatments were derived by Breiman et\
    \ al. (2004).\n\nWe start by directly stating the general structure of the algorithm:"
