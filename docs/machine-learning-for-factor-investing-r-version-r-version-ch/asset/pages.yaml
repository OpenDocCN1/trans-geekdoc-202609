    and their method aims at solving this problem. Their lengthy procedure seeks to
    test if maximal additional contribution of a candidate variable is significant;

    +   - Fama and French (2018) compare asset pricing models through squared maximum
    Sharpe ratios;

    +   - Giglio and Xiu (2019) estimate factor risk premia using a three-pass method
    based on principal component analysis;

    +   - Pukthuanthong et al. (2018) disentangle priced and non-priced factors via
    a combination of principal component analysis and Fama and MacBeth (1973) regressions;

    +   - Gospodinov et al. (2019) warn against factor misspecification (when spurious
    factors are included in the list of regressors). Traded factors (resp. macro-economic
    factors) seem more likely (resp. less likely) to yield robust identifications
    (see also Bryzgalova (2019)).


    There is obviously no infallible method, but the number of contributions in the
    field highlights the need for robustness. This is evidently a major concern when
    crafting investment decisions based on factor intuitions. One major hurdle for
    short-term strategies is the likely time-varying feature of factors. We refer
    for instance to Ang and Kristensen (2012) and Cooper and Maio (2019) for practical
    results and to Gagliardini et al. (2016) and Ma et al. (2020) for more theoretical
    treatments (with additional empirical results).


    # 3.3 Factors or characteristics?


    The decomposition of returns into linear factor models is convenient because of
    its simple interpretation. There is nonetheless a debate in the academic literature
    about whether firm returns are indeed explained by exposure to macro-economic
    factors or simply by the characteristics of firms. In their early study, Lakonishok
    et al. (1994) argue that one explanation of the value premium comes from incorrect
    extrapolation of past earning growth rates. Investors are overly optimistic about
    firms subject to recent profitability. Consequently, future returns are (also)
    driven by the core (accounting) features of the firm. The question is then to
    disentangle which effect is the most pronounced when explaining returns: characteristics
    versus exposures to macro-economic factors.


    In their seminal contribution on this topic, Daniel and Titman (1997) provide
    evidence in favour of the former (two follow-up papers are Daniel et al. (2001a)
    and Daniel and Titman (2012)). They show that firms with high book-to-market ratios
    or small capitalizations display higher average returns, even if they are negatively
    loaded on the HML or SMB factors. Therefore, it seems that it is indeed the intrinsic
    characteristics that matter, and not the factor exposure. For further material
    on characteristics’ role in return explanation or prediction, we refer to the
    following contributions:


    +   - Section 2.5.2. in Goyal (2012) surveys pre-2010 results on this topic;

    +   - Chordia et al. (2019) find that characteristics explain a larger proportion
    of variation in estimated expected returns than factor loadings;

    +   - Kozak et al. (2018) reconcile factor-based explanations of premia to a theoretical
    model in'
