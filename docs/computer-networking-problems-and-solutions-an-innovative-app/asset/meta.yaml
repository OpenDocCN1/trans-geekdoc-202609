- - '#####'
  - 2. 在大多数应用流量情况下，流量是通过 TCP over IP 传输的，而不是 UDP。TCP 是可靠的。TCP 流量发送方在发送更多流量之前会等待接收方确认收到。在缓冲区膨胀的情况下，一个数据包在拥塞接口的已满、过大缓冲区中停留过长时间，导致数据包交付给接收方延迟。接收方收到数据包并发送确认。确认到达发送方很慢，但最终还是到达了。TCP
    不关心数据包到达需要多长时间，只要它最终到达即可。因此，发送方继续以相同的速度通过拥塞接口发送流量，这使得过大的缓冲区保持满载，延迟时间保持很长。
