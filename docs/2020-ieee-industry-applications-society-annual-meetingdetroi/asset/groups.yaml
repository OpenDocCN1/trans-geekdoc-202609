    图6. 光伏功率的频率分解


    ### 3. 最优频率点的选择


    通过FFT分析，可以将光伏功率分解为低频分量和高频分量。低频分量代表光伏功率的规律部分，指示其趋势；而高频分量代表光伏功率的随机性，指示由天气等因素引起的波动。如何准确地分解低频和高频分量是一个难题。在本文研究中，从分解数据与原始数据的相关性角度选择最优频率划分。对光伏功率进行频域分解时，数据所示：从图7可以看出，当频率达到某值时，随着频率增加，低频分量与原始数据的相关性不再增加，高频分量与原始数据的相关性下降。这种最优频率划分既确保了低频分量的提取，又不会因过度提取低频分量导致高频分量的预测达到不可接受的水平。本文通过最小化低频分量与原始数据之间的平方差来求解最优频率，这被视为一个优化问题。具体公式见式(7)，新的目标函数如下所示。本文选取
    $\alpha=0.173$，$\beta=0.827$，得到频率划分点 $f_*=1825$。


    ```

    $min F(f) = [L(f)-H(f)]^2\ns1. \quad f \in [0, \frac{N}{2}]$

    其中，$F(f)$为目标函数。当目标函数达到最小值时，低频分量与原始数据的相关性与高频分量与原始数据的相关性达到平衡。$L(f)$为低频分量与原始数据的相关性，$H(f)$为高频分量与原始数据的相关性，$N$为频率总数。


    ![](img/b2070772115f03863ef6fb0189e63b2e_4_0.png)


    图9. 加权后分解分量与原始数据的相关性


