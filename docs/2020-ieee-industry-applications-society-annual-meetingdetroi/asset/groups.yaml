    ![](img/b2070772115f03863ef6fb0189e63b2e_4_2.png)


    图10. 加权后的平方差图


    ![](img/b2070772115f03863ef6fb0189e63b2e_4_3.png)


    图8. 加权前的平方差图


    图是高频分量相关性减去低频分量相关性的差值图。图中所示，当频率划分点 $f_*=365$ 时，低频分量与原始数据的相关性与高频分量与原始数据的相关性达到平衡。通过加权低频分量的规律性和高精度，首先显示低频分量的比例较高。当频率值增加时，低频分量与原始数据的相关性可以降低。然而，当低频分量与原始数据的相关性基本不变时，低频分量的精度达到最大值。此时，精度主要取决于高频分量。因此，在优先考虑低频分量时，通常增加频率。这种方法在式(7)的目标函数中引入权重，通过赋予低频分量与原始数据相关性低权重，高频分量与原始数据相关性高权重。在此值上，优先低频分量的设计思想是：在
    $f_*$ 之后，低频分量与原始数据的相关性不再显著增加，而高频分量的相关性仍保持下降趋势。因此，$f_*$ 是最优频率点。


    ![](img/b2070772115f03863ef6fb0189e63b2e_4_4.png)


    图11. 频率点 $f_*$ 处的最优分解结果。


    ```

    $min F(f) = [\alpha L(f)-\beta H(f)]^2\ns1. \quad f \in [0, \frac{N}{2}]$

    ```


    其中，$\alpha$ 是低频分量与原始数据的相关性权重，$\beta$ 是高频分量与原始数据的相关性权重。


