    ## 4.4 结果


    ### 4.4.1 分量分解预测结果


    表 III 和 IV 显示了不同尺度下低频和高频分的预测误差。从结果可以看出，随着小时数的增加，MAE 和 RMSE 也会增加，预测精度下降。这表明随着时间尺度的增加，预测难度之增大。


    ## 4.4.2 最终预测结果


    图 12 显示了不同尺度下的最终结果，表 V-VIII 显示了无频率分解模型的对比。随着小时数的增加，不含频率分解模型的 MAE 减少。所提模型的精度分别提升了
    63.54%、70.90%、23.32% 和 39.51%。所提模型的 MAPE 精度提升了 61.81% 和 49.61%，而所提模型的 RMSE 精度提升了
    83.56% 和 78.47%。可以看出频率分解提高了预测精度。高频成分在吸收低频成分后波动更加剧，这可能导致对高频成分预测的减少。然而，通过选择最优频率分解方法，本文不仅提高了原始数据中低频成分的比例，还在一定程度上平衡了高频成分预测的难度。在添加并重构低、高频成分后，最终结果的精度通常得到了提高。


