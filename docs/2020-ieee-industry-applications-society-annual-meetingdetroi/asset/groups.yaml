    # 超短短期光伏功率预测

    基于频域分解与深度学习


    胡林，赵震，王飞

    华北电力大学电气工程系

    中国保定 071003

    feiwang@ncepu.edu.cn


    齐具强，李宇

    调度与控制中心

    国网新疆电力电力有限公司

    中国乌鲁木齐 830018

    qiujang412@163.com, lyu@sgcc.xjcc.com


    Mithilesh Shafi-khaban

    技术与创新学院

    Varasasa大学

    Varasy 05250, 印度

    mfashak@unvasasa.in


    **摘要—** 超短短期光伏（PV）功率预测可以实现光伏发电的高效调度和优化投资。然而，受多种因素影响，光伏发电存在波动。为了提高光伏超短期预测，本文提出了一种基于频域分解和深度学习的方法。首先，通过快速傅里叶变换（Fast
    Fourier）识别每个频率波的幅值和相位。分析频率分解分量与原始数据。通过最小化高频分量与原始数据之间相关性的差异，获得分解生成的频率分解需求。最后，本文给出了1、2、3和4小时的预测结果。结果充分表明，所提方法提高了预测准确性。


    **关键词—** 光伏功率预测，超短短期，频谱分析，频域分解


    ## I. 引言


    ### 1.1 背景与方法论


    由于各种因素的影响，光伏发电具有较大的波动性 [9]。传统的预测方法难以获得满意的结果。近年来，光伏功率分析已成为一个研究课题。然而，频域分解方法是从频域提取并分析光伏特性。文献
    [12] 使用经验模态分解（EMD）分解不同分量的时间序列，并通过小波分解预测光伏发电量。文献 [14] 了一种基于希尔伯特-黄变换（HHT）和集成经验模态分解（IEMD）的新型预测方法，以提高预测引擎的准确性。使用IEMD分析数据。在上述文献中，数据仅使用现有方法进行分解，无法通过有效方法支持分解结果的可靠性。


    ### 1.3 挑战


    尽管存在缺乏有效方法来支持频域分解结果可靠性的担忧，本文提出了一种基于最优频率分解点选择的光伏功率超短期预测方法。每个频率波的幅值和相位由快速傅里叶分解定义。由于频率分解点不同，因此分析了分解分量与原始数据之间的相关性。通过分析分解分量的结果，获得分解低频分量和高频分量的最优频率分界点。然后使用卷积神经网络预测低频分量和高频分量，并通过数据重构获得最终预测结果。


    本文的主要贡献如下：


    - (1) 通过最小化低频分量与原始数据相关性与高频分量与原始数据相关性之间的差异大小，获得了最优的频域分解点，支持了频域分解的合理性。

    - (2) 本文方法通过中国宁夏光伏电站的数据进行了验证。结果显示所提方法提高了准确性。


    本文其余部分的结构如下：第2节介绍了FFT理论和深度学习。第3节介绍了如何选择频域分解的最优频率点。第4节介绍了模型参数和测试结果。第6节得结论。


    ## II. 方法论


    ### 2.1 快速傅里叶变换


    离散傅里叶变换（DFT）可以将有限长度的频域进行离散化，但其计算复杂度太大，无法实时处理问题。通过使用快速傅里叶变换（FFT）[15]，将长度为N的序列分解为两个长度为N/2的序列。一个是偶序列，另一个是奇序列。对原始序列重复分解直到达到两个点。FFT利用周期性和对称性大大减少了计算量。与DFT相比，FFT是复杂的且快速的。它代表了时域中由各种频率和幅值组成的正弦波信号。在本文中我们考虑使用FFT在频域分解光伏功率。离散化序列的频率所示公式(1)。根据公式(1)，相同频率的正弦和余弦被视为系数。我们考虑所有波形的正弦波。通过FFT在频域得到的模代表余弦波系数，复数的幅值代表频谱和相位。实际(2)
