    of the frequency domain decomposition results, this paper proposes an ultra-short-term
    forecasting of PV power based on optimal frequency decomposition point selection.
    The amplitude and phase of each frequency wave is deined by Fast Fourier decomposition.
    As the frequency decomposition point is different, the correlation between the
    decomposition component and the original data is analyzed. By analyzing the results
