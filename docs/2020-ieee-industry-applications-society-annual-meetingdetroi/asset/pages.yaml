    # 4.3 Performance criterion


    In order to evaluate the performance of the forecasting model, we employ two effective
    indices as Mean Absolute Error (MAE) and Root Mean Square Error (RMSE). Under
    the same set of training data, the smaller MAE and RMSE, and the better the forecasting
    effect. The mathematical formulas for the two error indices are shown in (10)
    and (11):


    ```

    MAE = \frac{1}{N} \sum |y_i - \hat{y}_i|

    ```


    # VI. CONCLUSION


    To overcome the shortcomings that there is no effective to support the methodology
    of the frequency domain decomposition results, we demonstrate an ultra short-term
    forecasting of PV power based optimal frequency-domain decomposition and deep
    learning. The amplitude and phase of each frequency wave are obtained by Fast
    Fourier decomposition. As the frequency decomposition differs, the correlation
    between low frequency component and the original data is minimized. minimizing
    the square of the correlation between low frequency components and raw data is
