    # 2.3.1 Convolution layer


    The role of the convolutional layer is to extract features from the input layer.
    The convolutional layer is typically composed of multiple convolution kernels,
    each of which is used to compute a feature map. Each cell of the feature map is
    connected to the region of the adjacent cell in the previous layer. The convolution
    of the input by the convolution kernel and nonlinear processing of convolution
    by activation function can acquire the new feature. The formula for the convolutional
    layers is shown by Eq. (5)


    ```

    $y_{i,j}^l = f(w_{ij}^l * x_i^l + b_j^l)$

    ```


    Where $w_{ij}^l$ and $b_j^l$ are the weights and biases of the $k$-th convolutional
    kernel in the $l$-th layer, respectively. $x_i^l$ is the input information of
    $(i,j)$ in the $l$-th convolution layer. The weight $w_{ij}^l$ is shared by each
    region of the input, which is weights sharing. $f(\cdot)$ is the activation function
    applied to the convolution layer, which can effectively improve the fitting ability
    of the model.


    ```

    $y_{i,j}^l = pool(y_{m,n,a}^{l-1})$

    ```


    # 2.3.2 Pooling layer


    The role of the pooling layer is to reduce the size of the feature map generated
    by the convolutional layer, and to effectively extract the feature information
    in the feature map. The formula for pool is shown by Eq. (6)


    Where $(m,n) \in R_{i,j}$ and $R_{i,j}$ are the information at $(i,j)$.


    # 2.3.3 Fully connected layer


    The function of the fully connected layer is to summarize the distributed feature
    representations learned by the previous layer into the same space for subsequent
    applications. All neurons in the layer are connected to each neuron in the current
    layer.


