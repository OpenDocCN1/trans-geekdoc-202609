    # 4.4 Results


    # 4.4.1 Decomposition component forecasting results


    Table III and IV show forecasting error indices of low-frequency and high-frequency
    components at different scales. From the results, it can be seen that as the number
    of hours increases, MAE and RMSE also increase, and forecasting accuracy decreases.
    This shows that as the time scale increases, the difficulty of forecasting increases.


    # 4.4.2 Ultimate forecasting results


    Fig. 12 shows final results at different scales, and Tables V-VIII show the comparison
    of with and without frequency-decomposition model. As the number of hours increases,
    the MAE of the model without frequency decomposition decreases. The proposed model
    has improved accuracy by 63.54%, 70.90%, 23.32% and 39.51%. MAPE of the proposed
    model has improved accuracy by 61.81%, 49.61% and the RMSE of the proposed model
    has improved accuracy by 83.56%, 78.47%. It can be seen that frequency-decomposition
    decomposition method improves forecasting accuracy. High-frequency components
    are more volatile after the absorption of low-frequency components, which may
    lead to reduced forecasting of high-frequency component. However, by selecting
    the optimal frequency-decomposition method, the paper not only improves the proportion
    of low-frequency components in raw data, but also balances the difficulty of predicting
    high-frequency components to a certain extent. After adding and reconstructing
    low and high frequency components, the accuracy of ultimate results is generally
    improved.


