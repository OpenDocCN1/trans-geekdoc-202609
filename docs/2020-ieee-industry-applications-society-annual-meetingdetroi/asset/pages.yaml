    **Abstract—Ultra-short-term photovoltaic (PV) power forecasting can achieve the
    efficient dispatch of PV and the optimal investment. However, due to various factors,
    the photovoltaic power generation has fluctuations. To improve the ultra-short-term
    forecasting of PV, this paper proposes a method based on frequency-domain decomposition
    and deep learning. First, the amplitude and phase of each frequency wave is identified
    by Fast Fourier. As the frequency decomposition component and the original data
    is analyzed. By minimizing the difference of the correlation that the correlation
    between high-frequency and raw data, the frequency generation demands for decomposition
    are obtained. Finally, the paper presents the results of predicting 1, 2, 3 hours
    and 4 hours. The results fully show that the proposed method improves forecasting
    accuracy.


    **Keywords—PV power forecasting, ultra-short-term, spectrum analysis, frequency-domain
    decomposition**


    # ## I. Introduction


    # ### 1.1 Background and methodology


    # ### 1.2 Frequency decomposition


    Due to various factors, the photovoltaic power generation has high fluctuations
    [9]. It is difficult to achieve satisfactory results with traditional forecasting
    methods. In recent years, the analysis of PV power has become a research topic.
    However, frequency-domain decomposition method extracts and analyzes PV characteristics
    from the frequency domain. Literature [12] uses empirical mode decomposition (EMD)
    to decompose different components time series and forecast PV generation by wavelet
    decomposition. Literature [14] proposes a new forecasting method based on Hilbert-Huang
    Transform (HHT) and integrated empirical mode decomposition (IEMD) to improve
    the accuracy of forecasting engine. IEMD is used to analyze the data. In the above
    literature, the data are only decomposed using existing methods, but can support
    the reliability of the decomposition results through an effective method.


    # ### 1.3 Challenges


