    # ### 3. Selection of optimal frequency demarcation point


    Through FFT analysis, PV power can be decomposed into low-frequency components
    and high-frequency components. The low-frequency component represents the regular
    part of PV power which indicates its trend, while the high-frequency component
    represents the randomness of PV power, which indicates its fluctuations caused
    by other factors such as weather. How accurately decompose low-frequency components
    and high-frequency components is a difficult problem. In this study, the article
    chooses the optimal frequency demarcation point from the perspective of the correlation
    between decomposed data and raw data. It shows the correlation between decomposed
    components and raw data. When frequency-domain decomposition is performed on PV
    power, the data shows


    From Fig. 7, it is seen that when the frequency reaches a value, as the frequency
    increases, the correlation between low-frequency components and raw data does
    not increase. It can be considered that there is no significant increase in the
    correlation between low-frequency components and raw data and high-frequency component
    and raw data to decline. This optimal frequency demarcation point that balances
    both low-frequency components and high-frequency components not only ensures extraction
    of low-frequency components, but also does not cause the difficulty'
