    # Ethical Implications of Machine Learning in Mobile Environments


    Questions have arisen as to whether user data can be collected and used without
    explicit permission from apps based on machine learning. Apart from privacy, accountability,
    openness, prejudice and justice are all part of these issues.


    +   - Privacy Concerns: Personal information, e.g., voice recordings, location,
    behaviour patterns, and biometrics, may be extracted from the user’s data by ML
    algorithms. When using these data to identify features, preferences, and habits,
    a user profile can be created. However, since users do not know how or to what
    extent their information is being collected, it may be considered a breach of
    privacy to gather information without their consent or without explicit privacy
    policies (Char et al., 2020).'
  merge: -1
  img_proc: true
- pgno: 152
  md: '+   - **Fairness and Bias:** In particular, biases that can lead to unfair
    and discriminatory results are present in machine learning algorithms, which are
    used in artificial intelligence. The algorithms themselves, or the data they have
    been trained with, may be to blame for these biases. When a machine learning algorithm
    is applied to an application, it may disproportionately favor some set of applicants
    because of their age, gender or socioeconomic status. When using biased machine
    learning algorithms in mobile applications, they can have a significant impact
    on social networking, financial services and criminal justice. Inequitable outcomes
    may lead to an increase of current social disparities and undermine public confidence
    in such frameworks.

    +   - **Transparency and Accountability:** Artificial intelligence plays a major
    role in addressing transparency and accountability issues. Complicated machine
    learning algorithms often make it difficult to understand how decisions are made
    and what information is being handled, which creates distrust and a sense of manipulation.
    The decentralised structure of mobile computing, making it difficult to identify
    and hold people accountable for the outputs of ML applications, is also hindering
    efforts in addressing ethical issues.

    +   - **Addressing Ethical Concerns:** The following actions can be taken to address
    ethical concerns about machine learning (ML) in mobile environments: gathering
    only the records that are required; giving clear explanations for data usage and
    decision-making; getting user consent and granting them control over their data;
    putting bias detection and mitigation strategies into practice; setting up accountability
    mechanisms and guaranteeing auditability; and educating the public about the moral
    ramifications of ML in mobile environments. By taking into account those criteria,
    developers, legislators and consumers can cooperate to ensure that machine learning
    is ethically and responsibly used within an urban environment (La Polla et al.,
    2013).


