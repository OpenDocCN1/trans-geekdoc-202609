  md: '# Data and Model in Smart Cities


    When it comes to producing information that can assist decision-making, smart
    cities need many data sources and models that can be relied upon. In situations
    when a large number of intelligent devices and sensors are involved, the difficulty
    of the situation increases significantly. In this part, five sample applications
    for smart cities are presented, together with the data involved, the models that
    correspond to them, and the computational needs that are necessary for them.


    # Transport and Traffic Management


    In terms of activities that are associated with urban life, transport is one of
    the most significant factors. Sensors put in cars that are used for traffic or
    monitors that are placed along roads are responsible for the generation and collection
    of traffic data. Data that document people’s routine mobility in cities are referred
    to as commuting data. The data collected from geo-tagged social networks includes
    postings (such as blogs and tweets) that are tagged with geoinformation and are
    collected from social networks. Road segments and junctions are the two types
    of data that are represented by road network data. Intelligent transportation
    systems make use of a variety of models, including agent-based traffic management
    models, cognitive rationality-based executive models, and mixed-ranked logit models.


    # Smart City Technology


    Components that are used in the development of smart cities include software solutions,
    user interfaces, communication networks, and devices that are linked to the internet
    of things (IoT). The Internet of Things, on the other hand, may be considered
    their principal source of dependence. The Internet of Things (IoT) is a network
    of interconnected devices, for example autos, sensors, or home appliances, that
    are able to communicate with one another and exchange information. Examples of
    these types of devices include connected devices. Sensors and gadgets connected
    to the Internet of Things are the ones responsible for gathering and transmitting
    data, which is after that saved either in the cloud or on other servers. The convergence
    of the physical and digital aspects of the city is made possible by the connectivity
    of these'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'devices and the use of data analytics. This results in an improvement in the
    efficiency of both the public and commercial sectors, which in turn enables economic
    gains and improves the lives of citizens.


    Sometimes, the Internet of Things devices have processing capabilities that are
    referred to as edge computing. Through the use of edge computing, it is possible
    to guarantee that the communication network is only exposed to the information
    that is the most significant and relevant.


    Within a computer system, the protection, monitoring, and control of network traffic
    are all essential functions that need the implementation of a firewall security
    system. In order to guarantee the safety of the data that is continuously sent
    inside a smart city network, firewalls are installed to prevent anyone getting
    into the Internet of Things without permission network or the data of the city.


    Other smart city technologies include:


    +   - APIs, which stand for application programming interfaces

    +   - AI stands for artificial intelligence.

    +   - computed in the cloud

    +   - control panels

    +   - learning via machine (ML)

    +   - M2M stands for machine to machine.

    +   - a network of mesh.


    # Devices and Sensors


    Data is collected from physical assets, machinery, and equipment via a broad variety
    of devices and sensors that are a part of the Industrial Internet of Things (IIoT)
    networks. A wide variety of sensors and devices, such as temperature sensors,
    pressure sensors, motion sensors, actuators, and others, may be included in this
    category.


    # Edge Computing


    When it comes to processing and analysing the data at the network’s edge, which
    is located closer to the user to the source, edge computing is an essential component
    of an Industrial Internet of Things (IIoT) system. By reducing'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'latency, improving real-time decision-making, and minimising data transfer
    to the cloud, edge computing helps to enhance the overall experience.


    # Future Urban Computing for Smart Cities


    At this point, with increased connectivity to the cloud, the network’s periphery
    is increasingly serving as a mobile computing system. This is as a result of the
    fast development of 5G networks as well as the increased integration with cloud
    computing. There have been a number of instances in which the phrase “mobile cloud
    computing” has been used in the field of mobile computing. The whole computer
    network will be pushed to a new decentralised computing stage, and the process
    of developing smart cities will be hastened as a consequence of the interaction
    between how mobile computing and cloud computing can be used to handle data on
    demand. Both of these developments will occur simultaneously.


    As the number of mobile devices endures to rise, it will become more obvious that
    there is a need for interaction with neighbouring edge applications. When combined
    with enhanced dispensation, computing, and power capacities, as well as the decentralised
    nature of mobile computing, edge computing is anticipated to deliver meaningfully
    enhanced throughput, enhanced performance, and real-time responses. This is accomplished
    by bringing computing and data closer to the user, as well as by tailoring the
    dispensation requirements of each individual user. Computing at the edge and computing
    on mobile devices are both capable of managing localised data for the purpose
    of facilitating rapid response for a certain range of area sizes. Nevertheless,
    centralised cloud computing is also being driven by the growing amount of data
    generated in metropolitan areas and the geo-analysis of data across cities.


    The purpose of detecting, recording, sharing, and analysing a wide range of human-related
    activities, a number of different devices will link to the cloud-based Internet
    inside the smart city. Computing on the cloud, when combined with the assistance
    of algorithms that are powered by artificial intelligence, will provide businesses,
    governments, and individual citizens with more intelligent solutions.'
