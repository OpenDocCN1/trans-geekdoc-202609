  md: '![](img/c85958019b68390d7282fc3932db4305_257_0.png)


    **Figure 1.** Distinctions between AR And VR.


    Here, we list the precise distinctions between AR and VR as shown in Figure 1:


    +   - **Definition:** Augmented reality (AR) is the overlaying of digital data
    over the real environment to improve user experience by seamlessly integrating
    virtual and physical aspects. Conversely, virtual reality, or VR, obscures users’
    physical surroundings and submerges them in a computer-generated reality, so eclipsing
    the real world entirely.

    +   - **User Background:** With augmented reality (AR), users can benefit from
    digital augmentation while maintaining a strong sense of realism. Here, digital
    content is overlayed onto the existing environment to allow for the simultaneous
    manipulation of virtual and physical elements. Virtual reality, on the other hand,
    immerses users in a virtual environment that completely replaces the real world
    with a computer-generated setting in order to create a closed and immersive experience.

    +   - **Hardware & Devices:** In order to access AR experiences, users commonly
    use tablets, smartphones, AR glasses, and heads-up displays, among other devices.
    Conversely, specialised gear, like virtual reality headsets, is typically needed
    for virtual reality, which gives a large viewing field and isolates users from
    the outside world.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '+   - Collaboration: Augmented reality users can relate to both virtual and
    physical objects with ease thanks to voice instructions, touch gestures on devices,
    and real-world movements. Users interact with virtual reality primarily using
    motion controllers or gestures within the scene to ensure they are completely
    submerged in it.

    +   - Entanglement: Unlike virtual reality, which achieves total isolation from
    the actual world, augmented reality (AR) maintains a symbiotic relationship with
    it, making for a less immersive experience. Because it immerses users completely,
    virtual reality (VR) gives them a strong sense of presence in the virtual environment.

    +   - Use cases: Real-time data conception, gaming edges, and navigation apps
