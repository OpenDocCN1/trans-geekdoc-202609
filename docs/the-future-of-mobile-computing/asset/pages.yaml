    # Edge Services and Applications


    Edge as a Service (EaaS) is the term used to describe the on-demand cloud-based
    delivery of edge computing resources, capabilities, and services to users. Without
    having to maintain the underlying hardware and software components, it enables
    companies and developers to take advantage of edge computing infrastructure. The
    users can access edge computing resources remotely like cloud services. To bring
    computation closer to the data source or end users, the edge infrastructure is
    typically deployed across a distributed network of edge locations or devices.
    The benefits of edge as a service include on-demand resource provisioning, reduced
    latency, simplified development and deployment, cost efficiency, scalability and
    agility, edge analytics and AI, and enhanced security and privacy. Edge service
    providers include Cloud service providers, telecommunications firms, or providers
    of specialised edge computing platforms.'
