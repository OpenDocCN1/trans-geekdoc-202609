  md: '# Internet of Things for Smart Cities


    The concept of smart cities is a product of the pervasive digitalization that
    has been made possible by the supporting technology that has made it feasible
    for this to happen. The efforts that are being conducted to construct smart cities
    are centred upon the Internet of Things (IoT), which is fundamental to the concept.
    According to projections, the internet will have over 75 billion connected devices
    by the year 2025. This will result in an increase in the number of apps that are
    being created. When it comes to smart cities, the IoT makes it feasible for sensors
    to collect and send the city status data to a central cloud. This information
    contains information on the city’s present condition. This information may then
    be mined or analysed with the intention of obtaining patterns and making decisions
    according to those patterns.


    # Built-in Workflow


    # Mobile Computing for Quick Responses Close to Home


    Mobile computing is the initial gate through which data enters the workflow at
    the beginning of the process. Only lightweight preparatory tasks, such as data
    cleansing and reorganization, may be carried out at the mobile computing stage.
    This is because mobile computers, in general, have a limited capacity, and because
    of limits such as battery life, they are unable to function properly. On the other
    hand, in-situ monitoring, when combined with a basic comprehension of the data,
    has the potential to cut down on time delay for tasks that do not need a great
    deal of calculation but rather merely the capacity to make straightforward judgments.
    When an unexpected amount of heat is detected, for instance, alerts that have
    been set up on a mobile device with a temperature threshold that is limited may
    be activated in a responsive manner.


    # Edge Computing Prepares Data and Controls Microcontrollers


    In addition to the collection of data at the edge and the transmission of the
    raw data to the cloud, as is the case with mobile computing, computing at the
    edge offers additional possibilities for greater data preparation. These capabilities
    are in addition to the fact that the data is collected at the edge.'
