    has become increasingly prevalent in modern society, enabling users to access
    data and applications from almost anywhere. Portability, Wireless Connectivity,
    Location Awareness, Limited Resource Constraints, Touch Interfaces, Diverse Applications,
    Multitasking are some of the mobile computing. Mobile computing is changing the
    way people work, communicate and access information. It also facilitates the development
    of a broad mobile application ecosystem for a variety of needs and interests.
