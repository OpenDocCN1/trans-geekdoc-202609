    A et al., 2020; Kozik R et al., 2021). Edge computing equips edge devices with
    the ability to perform advanced analytics. Data can be analysed in real-time to
    gain insightful knowledge, spot trends, anticipate equipment problems, and enhance
    production procedures by running analytics algorithms locally (Wang F et al.,
    2020). Industrial automation systems can make intelligent decisions at the edge
    thanks to edge analytics, which eliminates the need for constant data transfer
    to a distant server.


    Robotics applications in industrial automation are improved by edge computing.
    Real-time data processing and decision-making can happen onboard by putting edge
    devices nearby or directly aboard robots. This reduces the need for constant communication
