    efficiently at the boundary of two networks. They are frequently employed in situations
    requiring real-time or nearly real-time processing as well as those with bandwidth,
    latency, or connectivity limitations. The networks with different protocols become
    highly incompatible and can be managed with the help of edge device. Moreover,
    edge devices provide interconnectivity between two different networks to carry
    out operations such as data transmission, monitoring and filtering between networks.
