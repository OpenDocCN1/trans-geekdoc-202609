    # Remote Patient Monitoring


    A medical procedure known as remote patient monitoring (RPM) enables medical professionals
    to keep an eye on patients’ health away from conventional healthcare facilities.
    In order to gather patient data and send it to healthcare professionals for analysis
    and decision-making, it entails the use of linked devices, sensors, and mobile
    applications. By putting computational power and data processing closer to the
    patient’s location, edge computing is essential for improving the effectiveness
    and efficiency of remote patient monitoring (Vora J et al., 2017). Here is a detailed
    explanation of how edge computing is beneficial for remote patient monitoring.


    Edge computing facilitates the processing and analysis of patient data at the
    edge devices, such as wearable technology or home monitoring systems. As a result,
    healthcare professionals can get quick insights into a patient’s health status
    and use that information to spot possible problems, monitor trends, and take prompt
    action. Real-time data analysis is crucial in urgent circumstances, such as identifying
    irregularities in vital signs or responding to emergencies. With edge computing,
    patient data can be processed locally instead of being sent to a central cloud
    server. To cut down on latency and enable faster reaction times, it is instead
    handled locally at the edge devices (Goundar et al., 2021). As a result, healthcare
    providers can get timely notifications and take appropriate action in time-sensitive
    circumstances.


    Edge computing makes it possible to continuously monitor the health status of
    patients. A complete picture of the patient’s health status throughout time is
    provided by connected devices and sensors, which collect data in real-time. With
    the use of continuous monitoring, medical personnel can spot small changes in
    a patient’s health and take early action to avoid complications or hospital stays.
    Even when network access is spotty, edge computing ensures that patient data is
    continuously analysed and examined. Edge computing handles privacy and security
    issues with remote patient monitoring. Sensitive data can be retained inside the
    boundaries of the edge devices and the patient’s home network by processing patient
    data locally, lowering the risk of data breaches. By using this strategy, privacy
    laws are respected, and patient health information is protected. Additionally,
    edge computing lessens the need to send sensitive data over open networks, lowering
    the risk of intrusion.'
