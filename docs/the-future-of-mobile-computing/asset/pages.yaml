    # ## Conclusion


    A taxonomy offers a structured framework for organising and understanding the
    complexities of edge computing systems through the analysis and classification
    of various edge computing-related elements, including edge devices, edge architectures
    and edge services. Also, a taxonomy improves understanding and management of the
    heterogeneous nature of devices present at the network edge by classifying edge
    devices based on their capabilities, characteristics, and functionalities. Making
    informed decisions about the choice of device, allocation of resources and distribution
    of tasks in edge computing environments is made easier though this categorization.


    The architectural approaches used in edge computing, such as cloud-centric, fog
    computing, and mobile edge computing, can also be identified and distinguished
    using a taxonomy of edge architectures. In order to make the'
