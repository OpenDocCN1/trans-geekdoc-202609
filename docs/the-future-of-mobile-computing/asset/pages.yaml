    packaging, and processing equipment.


    # Limited Availability of Inputs


    The agricultural and business sectors are not very profitable due to high raw
    material costs in both farming and processing. Since local intermediary goods
    suppliers cannot compete with imports in terms of both price and quality, imports
    are frequently the source of inputs needed to add value to primary products.


