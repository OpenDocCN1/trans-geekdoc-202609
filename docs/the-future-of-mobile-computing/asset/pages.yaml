  md: '# Fundamentals of Artificial Intelligence


    # Basics of AI and Machine Learning


    Computer science research on artificial intelligence (AI) is essentially concerned
    with building machines that are capable of tasks that frequently call for human
    intelligence. Naturally, machine learning (Bhargava et al., 2021) is a subfield
    of artificial intelligence that develops statistical models and algorithms that
    allow computers to see patterns in data, learn from it, and make judgments. By
    training on datasets, a learning machine can gain knowledge over time while improving
    its performance. The three main methods of machine learning are reinforcement
    learning (teaching algorithms through trial and error based on environmental input),
    supervised learning (training models of recorded data), and unsupervised learning
    (finding patterns in unrecorded data). The combination of artificial intelligence
    (AI) and machine learning results in AI that can perform tasks such as natural
    language processing, image recognition, and predictive analytics as specified
    in Figure 1. These systems have revolutionized many industries and driven technology.


    # Types of AI: Narrow AI vs. General AI


    The two main categories of artificial intelligence (AI) are general intelligence
    (strong intelligence) and narrow intelligence (weak intelligence). Systems that
    express intelligence in a strictly defined way and are specifically taught and
    adapted to one or more tasks are called narrow artificial intelligence (AI) systems.
    Image recognition, virtual assistants, and translation software are some examples.
    Although narrow AI is good at good tasks, its cognitive complexity is not as broad
    as human intelligence. General intelligence, on the other hand, seeks to apply
    human-like intelligence across a variety of tasks and the ability to understand,
    retrieve, and use information in a variety of ways. Any intellectual task that
    humans can do will be done through general intelligence. Although there are now
    numerous narrow-scope AI applications, general AI remains a challenging and evolving
    field. Scientists and engineers are working to create flexible and adaptable artificial
    intelligence (AI) that can demonstrate a wide range of knowledge (Kuusi et al.,
    2022).'
  merge: -1
  img_proc: true
