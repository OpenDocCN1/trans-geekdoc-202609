    # Introduction


    Online education has grown in popularity as a result of technological developments
    and increasing internet accessibility. There has been a significant increase in
    the use of virtual classrooms as a result of the flexibility and convenience it
    offers to a variety of learners (Barbara B. Lockee. et al., 2016). But along with
    this growth have come difficulties regarding student participation and academic
    honesty. To address these problems, a multi-model student online monitoring system
    has arisen. These systems enable secure and reliable online learning, promoting
    an environment favorable to academic success, by integrating capabilities like
    facial recognition, keystroke analysis, and eye-tracking. This personalized approach
    to learning can significantly enhance the overall educational experience (Shivangi
    Dhawan et al., 2019).


    # Background and Motivation


