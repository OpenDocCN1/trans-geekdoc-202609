  md: '# Mobile Sensors and IoT in farming


    A sensor is an apparatus that detects a physical quantity and converts it into
    a signal that can be read and used by other apparatuses. These days, a huge range
    of sensors are accessible, and many well-known smartphones already have a number
    of sensors installed, including gyroscopes, barometers, accelerometers, light
    sensors, temperature sensors, and GPS.


    Smart phones are equipped with three different types of sensors: environmental,
    motion, and location sensors. Motion sensors, which make up the first category
    are monitor rotational and acceleration forces. This includes the ambient air
    temperature measured by a thermometer, the pressure measured by a barometer, and
    the light level measured by a photometer. The third type of sensors, known as
    position sensors, measures the actual position of the gadget. These sensors include
    orientation sensors, GPS, and magnetometers.


    # IoT in Farming


    Smart Agriculture is the common term used to denote the application of IoT solutions
    in agriculture. Farmers may collect machine and environmental measurements using
    Internet of Things (IoT) sensors, as specified in Figure 2 will enable them to
    improve nearly every aspect of their operations, from livestock to crops, and
    make more informed decisions. Numerous parts of agriculture could be transformed
    by technologies (Padhy et al., 2022) and the Internet of Things. Specifically,
    there are four ways that IoT (Farooq et al., 2022) might enhance agriculture:


    +   - Many data points gathered by intelligent agricultural sensors.

    +   - Reduced manufacturing hazards and improved internal process control.

    +   - Increased quantity and quality of the products.

    +   - Smaller environmental impact.


