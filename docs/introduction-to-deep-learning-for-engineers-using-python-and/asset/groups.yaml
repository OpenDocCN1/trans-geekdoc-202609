    ![](img/194138d45b566d0634bfa2025ddf48f7_68_0.png)\n\n**图 6.16：** 在 GCP 中创建计算引擎。\n\
    \n![](img/194138d45b566d0634bfa2025ddf48f7_68_1.png)\n\n**图 6.17：** 在 GCP 中设置\
    \ VM 的步骤。\n\n检查您的外部 IP。您稍后会用到它。\n\n## 6.5 GPU 配额请求\n\nGPU 配额请求是如果您计划访问 Google\
    \ 远程服务器中的 GPU 的重要步骤。您可以在创建实例之前完成它。进入导航菜单、IAM 和管理，然后选择配额（图 6.18）。\n\n如果您是新用户，您可能会在右上角看到升级选项。在这种情况下，您需要通过点击升级来升级您的账户（图\
