    **图 5.1:** 通过迁移学习的学习过程 [55].


    我们可以有效地使用，并且该过程所需的努力也相对不大。一些广泛使用的预训练网络有 ResNet、GoogLeNet、VGG、Inception、DenseNet、EfficientNet
    等 [51]。现在还有许多其他即用型预训练模型可用，随着深度学习领域的兴起，新的模型也在不断被测试并添加到此列表中。


    使用预训练网络的一个优点是，这些架构已经使用大型数据集（例如 ImageNet）进行了训练和测试。我们可以在迁移学习过程中部分或全部使用这些网络。对于模型的局部使用，只需在新数据集上重新训练最后几层，但网络的核心部分不会改变。另一方面，我们也可以在不使用参数值的情况下利用整个架构，将所有权重随机初始化，然后使用新数据集训练模型。这些简单的技术可以显著提升深度学习模型的性能，并且最近，这种做法在计算机视觉应用中变得广为接受
    [52–54]。迁移学习过程的示意图如图 5.1 所示。


    ### 5.3.1 特征提取、微调和数据增强


    深度学习架构逐层学习特征。例如，当卷积网络从图像中学习时，它倾向于在前几层学习模式、纹理、边缘和亮度。这些来自图像的特征用于处理许多不同类型的自然图像，因此可以重复使用。通常，深度学习网络的最后几层非常特定于当前任务。因此，对于分类问题，如果我们利用预训练模型进行迁移学习而不使用其最后一层，我们就可以轻松获得训练网络的隐藏状态以提取一些标准特征。


    为了更严格的训练过程，我们可以在对新数据重新训练之前重新配置模型的部分层（尤其是最后几层）。这一步将对整个模型进行微调，但该方法的成功实施取决于我们试图完成的数据集和预测任务。PyTorch
    包 “torchvision” 有许多流行的模型架构可供我们用于深度迁移学习 [56]。


    如果我们用于深度学习的训练数据相对较少，可以使用数据增强技术来提高模型性能。增强将通过不同方式操纵训练图像，例如翻转、旋转、剪切、裁剪、移动 RGB 通道等等。因此，我们可以从单张图像中获得各种独特且相关的图像。它将增加我们模型训练数据表示的数量。最近，研究人员正在探索不同的数据增强技术以提高模型的验证准确率。我们将在第
    7 章展示使用预训练权重、微调和数据增强的实际实现。


    ### 5.4 模型评估


    在训练期间，我们最初需要将标注数据集分为训练集和测试集。训练数据（可细分为训练集和验证集）将用于学习模型参数，而测试数据将估计学习模型的准确性。通常，大型测试集会以较低的方差进行良好估计。用于模型评估的指标类型有多种，例如混淆矩阵、准确率、F1
    分数等。


    为了评估模型，我们可以首先检查分类准确率，尤其是在不同类别的样本数量几乎相等时。它只是正确预测数与预测总数之比。混淆矩阵可用于以矩阵形式显示输出结果的质量，其中较高的对角线值表示许多正确结果。混淆矩阵可以通过查找真阳性（模型预测为阳性，且为真实结果）、假阳性（模型预测为阳性，但为错误结果）、真阴性（模型预测为阴性，且为真实结果）和假阴性（模型预测为阴性，但为错误结果）来构建。从矩阵的值中，我们可以计算精确率、召回率和加权
    F1 分数以了解相关性和模型性能。


    评估指标应根据模型执行的任务进行选择。评估模型时最好检查多个指标，因为模型在不同指标上的表现可能不同。第 7 章中显示的多类分类案例研究几乎有 50% 的测试数据和
    50% 的训练数据。因此，为了更简单的评估，我们仅对该问题展示了训练损失和准确率指标。


