    ## 4.3 RECURRENT NEURAL NETWORK (RNN)


    The Recurrent Neural Network (RNN) is another popular deep learning architecture
    that is used for predicting sequential data with the help of an additional memory
    state. The prediction by RNN architecture depends on both current and past inputs.


    The use of RNN escalated rapidly within the last decade. It has been delivering
    state-of-the-art results in many different fields such as language processing,
    speech recognition, video analysis, fake video creation, music generation, grammatical
    inference, trajectory control of robots, and so on [33–39].


    ### 4.3.1 BASIC STRUCTURES


    RNN deals with vectorize data, i.e., inside this network, all inputs and outputs
    are vectors for many time-steps. Among many underlying internal architectures
    of RNN, one-to-many, many-to-one, and many-to-many are commonly used.


    For a one-to-many architecture, one input is mapped into multiple outputs (Fig.
    4.4). In this case, intermediate representations of the input unit are done in
    a series of hidden states, where every hidden state is a function of all previous
    states. An example application of this type of architecture is image captioning,
    where input is a single image, but the outputs are words of multiple classes.


    ![](img/194138d45b566d0634bfa2025ddf48f7_50_0.png)


    **Figure 4.4:** Schematic diagram of a one-to-many RNN architecture.


    In the many-to-one RNN architecture, many inputs are mapped into hidden states
    but produce only one class or quantity output. This type of network is very useful
    to gauge or classify emotional state and sensitivity from writings. A schematic
    of many-to-one RNN architecture is given in Fig. 4.5.


    ![](img/194138d45b566d0634bfa2025ddf48f7_51_0.png)


    **Figure 4.5:** Schematic diagram of a many-to-one RNN architecture.


    In the many-to-many RNN structure, multiple inputs go through hidden states and
    produce multiple outputs. It is used for translating sentences in another language,
    video frame labeling, and for many other prediction applications where multiple
    inputs produce multiple outputs. Many-to-many RNN structures might have different
    layouts based on the numbers of inputs and outputs. A schematic of many-to-many
    RNN architecture is given in Fig. 4.6.


    ![](img/194138d45b566d0634bfa2025ddf48f7_52_0.png)


    Figure 4.6: Schematic diagram of a many-to-many RNN architecture.


    Besides these RNN architectures, there are many other input-output dynamics. For
    example, a simple one-to-one RNN structure similar to the classical feed-forward
    network.


    An RNN model is challenging to train because to update the parameters, backpropagation
    algorithm needs to calculate gradients at different time steps. This operation
    makes the network unstable due to vanishing and exploding gradients. In order
    to avoid this problem, different supporting units such as Gated Recurrent Unit
    (GRU), Bidirectional Recurrent Neural Network (BRNN), and Long Short-Term Memory
    (LSTM) are used. For example, the LSTM network uses cells with input, output,
    and forget-gate to control the flow of information. LSTM can be used with other
    tricks such as gradient clipping to set a threshold value for the error gradient
    and weight regularization (L1-absolute or L2-Squared) to introduce a penalty to
    the loss functions, etc. An LSTM based recurrent network is more effective when
    several layers are involved in the sequence of data [34]. To train a recurrent
    network for complex high-dimensional data, a GPU-based hardware (e.g., NVIDIA
    cuDNN) that supports deep learning framework is highly recommended.


    ## 4.4 OTHER DEEP LEARNING MODELS


    Among the other deep learning models, recursive and unsupervised pre-trained networks
    are gaining popularity. Recursive networks apply the same set of weights recursively
    to learn from structured information, and it is known for being computationally
    expensive [40]. Recursive models are suitable for pattern analysis as they can
    process both the numerical and symbolic data together. Different variants of recursive
    networks are continuously emerging and explored by contemporary researchers. Although
    it is relatively less popular than the recurrent network, it has shown excellent
    performance in natural language processing, image decomposition, and forecasting
    problems.


    The unsupervised pre-trained network can help to improve the CNN''s performance,
    and it can reduce labeled data dependency by creating layers of feature detectors
    [41]. This type of network is suitable for finding hidden patterns inside the
    data by using autoencoders, Generative Adversarial Networks (GANs), and other
    methods.


    An autoencoder has different variants, but it is generally a neural network where
    the input features are reduced or mapped in a hidden layer and then restore or
    remapped to the same numbers of features at the output. The middle layer of an
    autoencoder, also called the bottleneck is symmetric about the center, and it
    contains fewer nodes than input or output nodes. A schematic diagram of the autoencoder
    architecture is given in Fig. 4.7.


    ![](img/194138d45b566d0634bfa2025ddf48f7_53_0.png)


    Figure 4.7: Schematic of an autoencoder architecture [42].


    The GANs is one of the exciting classes of deep learning. It can produce realistic
    data by using two parallel adversarial networks that compete with each other.
    One of the networks works as a data generator, and the other network classifies
    it by utilizing real data. This process continues until the second network fails
    to discriminate between the real and synthetic data [13]. A GAN model is relatively
    difficult to train as it can suffer from mode collapse, diminished gradient, and
    non-convergence problems [43, 44].


    Generative networks can be used to generate realistic pictures or images, and
    it is explored in many different engineering domains for image reconstructions.
    Recently, GAN was used to learn scene dynamics from a large amount of unlabeled
    video (26 terabytes), and it also showed impressive results in recovering features
    from astrophysical images by reducing random and systematic noises [45].


    Although GAN is an amazing development for deep learning, using it, people can
    make fake media content, realistic images, and online profiles that can negatively
    affect our society. There are numerous other potential applications of GAN that
    exist in the field of arts, industry, and medicine, and it will definitely create
    an impact on our society in the near future.


    ## Deep Transfer Learning


    ### 5.1 INTRODUCTION


    Transfer learning is a method of applying the knowledge of a pre-trained network
    to another model when we have insufficient data and computing resources to train
    a new model from scratch. Using this method, knowledge learned from one type of
    data can be applied to totally different types of data. The deep convolutional
    network showed tremendous success in image recognition and classification tasks
    using transfer learning methods [46, 47]. One of the key challenges to train a
    deep learning model from the beginning is that it requires a huge amount of labeled
    dataset, which is not common in many practical scenarios. Generally, a model can
    make good predictions if it is trained on a big dataset. There are many deep learning
    models available that are developed from big datasets, such as, ImageNet, MNIST,
    MS COCO, Caltech datasets, Pascal VOC, CIFAR10, and so on. The performance of
    a deep learning model increases if it is trained on a big dataset. For example,
    the popular ImageNet dataset contains 14,197,122 images, and the Tiny Images dataset
    contains 79,302,017 images [48, 49]. We can use deep learning models that are
    trained on these datasets for doing a different task.


    ### 5.2 TYPES OF TRANSFER LEARNING


    The relationship between traditional machine learning and transfer learning can
    be categorized into three different ways, according to Pan et al. [50]: Inductive,
    Transductive, and Unsupervised learning. Inductive transfer learning method can
    be built by infusing similar instances from different learning tasks, transductive
    transfer learning can be used when the source and target tasks are the same, and
    the unsupervised transfer learning does unsupervised learning tasks (e.g., clustering,
    dimensionality reduction). Pan and Yang [50] also sub-categorized transfer learning
    approaches based on the instance, feature-representation, parameter, and relational-knowledge
    transfers.


    ### 5.3 USING PRE-TRAINED NETWORKS


    If we want to use a dataset for supervised learning, we will need to label or
