    ## 7.8 模型测试


    测试准确率定义了模型对测试数据集的预测能力，该数据集包含8,041张汽车图像。训练完成后，我们的模型能够正确预测91.5%的图像。然而，这一准确率是基于斯坦福汽车数据集提供的测试图像得出的。我们可以通过拍摄一张汽车照片，或使用互联网上任意一张汽车图像来检验模型性能。


    我们用谷歌搜索了“Volkswagen Golf Hatchback 1991”，保存了该图像，并使用Jupyter Notebook将其上传到GCP云主目录。由于我们的模型是在裁剪后的图像上训练的，因此在分类该图像之前，我们还进行了裁剪。图7.31展示了从主目录读取图像（例如car_image1.jpg）并调整其大小以使用我们的模型进行测试的方法。


    现在，为了通过模型测试该图像，我们使用了图7.32中所示的代码。这里的模型输出类别是190+1=191。由于Python从0开始读取列，因此我们应该加1。从cars_meta.csv文件中，我们还发现类别191实际上是Volkswagen
    Golf Hatchback 1991。


    我们还检查了互联网上的一些2013年之前的汽车模型图像，大多数情况下（10次中有9次），模型能够正确预测汽车的品牌、型号和年款。


