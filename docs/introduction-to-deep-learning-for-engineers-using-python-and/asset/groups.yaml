    \ cars_test_annos_withlabels.mat 文件来计算测试数据集的准确率。请注意，他们的网站上还有一个类似的文件 cars_test_annos.mat，但其中没有定义类别。因此，我们建议每个人在开展此项目之前仔细检查斯坦福汽车数据集。\n\
    \n为了从图像中识别汽车品牌和型号，我们需要使用训练数据训练一个深度学习模型，然后使用测试数据测试模型的性能。为此任务使用了一个名为 EfficientNet\
    \ B7 的预训练深度神经网络，从训练数据集中提取特征。\n\n使用预训练网络的迁移学习过程示意图如图 7.1 所示。最后，为了测试，我们将输入几张随机汽车图片（从互联网下载），以查看新的深度学习模型在给定数据集之外的表现如何。\n\
    \n### 7.2 数据处理\n\n数据处理步骤对于有效使用任何深度学习模型都非常关键。我们必须仔细检查图像的标签和名称，以及训练\n\n"
