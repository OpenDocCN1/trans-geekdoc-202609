    \n**图 6.15：** 在自定义元数据“启动脚本”部分编写启动脚本。\n\n然后进入“磁盘”标签页并勾选“删除实例时删除启动磁盘”。最后，点击“创建”来创建计算引擎。这些步骤显示在图\
    \ 6.16 中。\n\n您可能会看到一条警告消息，提示该区域没有足够的资源来满足请求。通常，如果您没有选择任何 GPU，您将不会看到此错误消息。但如果您看到错误消息，您应该尝试不同的区域来创建实例。例如，您可以从\
