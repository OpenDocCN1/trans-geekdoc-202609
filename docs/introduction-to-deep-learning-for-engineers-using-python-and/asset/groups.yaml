    \n![](img/194138d45b566d0634bfa2025ddf48f7_70_1.png)\n\n请求获批后您将收到一封电子邮件。\n\n**图\
    \ 6.21：** 在 GCP 中提交 GPU 配额请求的步骤。\n\n接下来，从配额页面选择配额类型 → 所有配额，服务：Compute Engine API，指标：GPU（所有区域），位置：所有位置（图\
    \ 6.20）。\n\n这些选择非常重要。您也可以在特定区域请求 GPU。接下来，通过选择编辑配额来请求配额（图 6.21）。在提交请求之前，写下您想要的\
