    \ 6.14 中的脚本到自定义元数据“启动脚本”部分。此操作将帮助您在每次启动实例时执行一些软件安装和更新（图 6.15）。\n\n![](img/194138d45b566d0634bfa2025ddf48f7_66_0.png)\n\
    \n**图 6.13：** 为 VM 设置启动磁盘的步骤。\n\n```bash\n#!/bin/bash\necho \"Checking for CUDA\
