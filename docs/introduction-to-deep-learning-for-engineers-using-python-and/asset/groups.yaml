    The Recurrent Neural Network (RNN) is another popular deep learning architecture
    that is used for predicting sequential data with the help of an additional memory
    state. The prediction by RNN architecture depends on both current and past inputs.


    The use of RNN escalated rapidly within the last decade. It has been delivering
    state-of-the-art results in many different fields such as language processing,
    speech recognition, video analysis, fake video creation, music generation, grammatical
    inference, trajectory control of robots, and so on [33–39].


    # 4.3.1  BASIC STRUCTURES


    RNN deals with vectorize data, i.e., inside this network, all inputs and outputs
    are vectors for many time-steps. Among many underlying internal architectures
    of RNN, one-to-many, many-to-one, and many-to-many are commonly used.


    For a one-to-many architecture, one input is mapped into multiple outputs (Fig.
    4.4). In this case, intermediate representations of the input unit are done in
    a series of hidden states, where every hidden state is a function of all previous
    states. An example application of this type of architecture is image captioning,
    where input is a single image, but the outputs are words of multiple classes.


    In the many-to-one RNN architecture, many inputs are mapped into hidden states
    but produce only one class or quantity output. This type of network is very useful
    to gauge or classify'
