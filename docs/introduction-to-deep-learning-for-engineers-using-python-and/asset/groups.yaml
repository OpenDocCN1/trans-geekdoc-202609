    \ 个 vCPU 内核和 30 GB 内存（图 6.12）。\n\n这只是一个示例，您可以根据自己的需求选择不同的自定义 VM。如果您认为 CPU 足以处理机器学习模型，您也可以仅使用\
    \ CPU 进行计算。在这里，我们打算向您展示为项目选择 GPU 的方法，因为大多数深度学习模型都需要 GPU 来进行并行计算。\n\n![](img/194138d45b566d0634bfa2025ddf48f7_65_0.png)\n\
    \n**图 6.12：** 自定义云 CPU 的步骤。\n\n如果您展开 CPU 平台和 GPU，您将看到该位置可用的 GPU 类型。但在配额批准之前，您将无法添加\
