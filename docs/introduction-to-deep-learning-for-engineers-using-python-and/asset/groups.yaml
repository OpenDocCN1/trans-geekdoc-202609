    # Basic Artificial Neural Network and Architectures


    # 3.1 INTRODUCTION


    An artificial neural network is an algorithm or software architecture that has
    interconnected layers of functions similar to the biological neurons. Although
    the process of learning in the human brain is super complicated and not fully
    understood, the software architecture of machine learning uses activation function
    and connected pathways that can be compared to the biological neurons and synapses,
    respectively. Furthermore, an artificial neural network can learn (alternatively,
    find optimum model weights or biases) through training, which is an important
    phenomenon that mimics the process of learning in our human brain. For these reasons,
    the term “Neural” is used in the field of machine learning.


    The neural network architecture consists of several basic components, such as
    the number of inputs, outputs, hidden layers, and the type of activation functions.
    A simple multi-layer neural network has a topology similar to Fig. 3.1.


    The hidden layer inside a network contains neurons that perform tensor operations
    based on the output requirements. For example, if our required output is a numerical
    value, such as predicting body temperature or test score, we use linear regression.
    On the other hand, we can use logistic regression to predict binary outputs and
    multi-class outputs. Binary outputs are predicting between true or false, pass
    or fail, cat or non-cat picture, and multi-class outputs are predicting one from
    multiple classes, such as finding out if a picture is a cat, bird, dog, or fish
    picture. The logistic regression can also be used for predicting ordinal outputs
    (e.g., determining high, medium, or low ranges). Each input in the neurons of
    the input layer is multiplied by weights associated with its connecting pathways
    and then added to a bias to generate the next output.


    The learning process of an artificial neural network is actually finding out weights
    and biases that will generate a minimum error. The weights and biases always needed
    to be adjusted if the network produces poor results. When the network finds the
    best or desired result, it will not update these parameters.


    Several methods of learning schemes are widely used in machine learning based
    on data types or observation methods such as supervised, unsupervised, and reinforcement
    learning. When the network can compare its predictions with the correct results
    to make adjustments, then it is called supervised learning. Unsupervised learning
    is the type of learning when the'
