    Platform (GCP) console to run a deep learning model. Google started its cloud
    computing service in 2008, which supports various computing frameworks, including
    Python [57]. By using a free Google account, we can easily run Google’s web-based
    user interface of GCP for computing, storage, networking, security, big data/analytics,
    and artificial intelligence.


    At the time of writing this note, GCP provides a 12-month free trial with $300
    credits to any users who set up a billing account using credit card or bank details.
    This pay-as-you-go billing model is very convenient and economical for someone
    who wants to explore deep learning models using a powerful computation engine
    without purchasing. Other related information and eligibility on the free trial
    are available at Google Cloud Free Tier site [58]. Another economical option we
    could use here is to choose a preemptible instance for Compute Engine, which is
    much cheaper than using a regular instance. We are going to discuss the preemptible
    instance later in this chapter.


