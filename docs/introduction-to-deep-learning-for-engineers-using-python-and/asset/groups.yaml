    在本章中，为了演示深度学习的应用，我们对一个多类别图像分类问题使用了迁移学习过程。我们的目标是实现一个深度学习模型来确定汽车的品牌、型号和年份。为了训练和测试我们的模型，我们使用了一个整理好的汽车数据集，其中共包含\
    \ 16,185 张不同的汽车图像。该数据集（斯坦福汽车数据集，Stanford's Cars Dataset）曾被用于一项 Kaggle 竞赛，可从 [62]\
    \ 下载。该数据集的早期版本也曾被用于刚体类别细粒度分类的 3D 对象表示研究 [63]。\n\n在斯坦福汽车数据集中，16,185 张汽车图像中的 196\
