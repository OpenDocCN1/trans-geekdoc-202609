    ![](img/194138d45b566d0634bfa2025ddf48f7_43_0.png)


    **Figure 3.10:** If the cost function, J, is a function of two parameters (weight
    and bias), the gradient descent algorithm will search for a minimum on the surface.
    In this example plot, the Start Point 1 will converge to a local minimum, and
    the Start Point 2 will converge to a global minimum.


    In Fig. 3.10, the height of the surface shows the value of the cost function J
    for the respective weight and bias.


    In most of the machine learning optimization tasks, the cost function is a higher-dimensional
    function due to the existence of many weights and biases. This type of higher-dimensional
    plot is impossible to visualize.


    The gradient descent algorithm is simultaneously performed for all values of weights
    and biases. If we have n neurons in a hidden layer, all the weights will update
    through Equation (3.15) [14]. Here α is the learning rate, which tells the algorithm
    how big or small the step size would be while moving in the direction of the downhill
    step. The negative gradients push the algorithm to move toward the downhill direction.


    \[

    \begin{aligned}

    \omega_1 &= \omega_1 - \alpha \frac{\partial}{\partial \omega_1} J(\omega, b)
    \\

    \omega_2 &= \omega_2 - \alpha \frac{\partial}{\partial \omega_2} J(\omega, b)
    \\

    \omega_3 &= \omega_3 - \alpha \frac{\partial}{\partial \omega_3} J(\omega, b)
    \\

    &\vdots \\

    \omega_n &= \omega_n - \alpha \frac{\partial}{\partial \omega_n} J(\omega, b)

    \end{aligned}

    \tag{3.15}

    \]


    The bias parameters for a hidden layer will update using Equation (3.16):


    \[

    b = b - \alpha \frac{\partial}{\partial b} J(\omega, b)

    \tag{3.16}

    \]


    Equations (3.15) and (3.16) show the calculation for one layer only. This computational
    process becomes expensive in the case of deep learning when we have many hidden
    layers.


    The learning rate, α, is one of the critical hyper-parameters for model training,
    and it needs to be tuned carefully. If the learning rate is too low, the gradient
    descent algorithm will become computationally expensive. On the other hand, if
    the learning rate is relatively big, it may overshoot the minimum and fail to
    converge.


    One way to use the learning rate effectively is to reduce its value as the training
    progresses. This process is known as the adaptive learning rate [15]. The adaptive
    learning rate can be reduced or adjusted using a pre-defined schedule such as
    time-based decay, step decay, and exponential decay [16]. Many algorithms, such
    as Adam, SGD, AdaGrad, and RMSProp, use the adaptive learning rate. The PyTorch
    `torch.optim` package has built-in functions that allow users to pass arguments
    to different optimizers for implementing the adaptive learning algorithm [17].


    ## Chapter 4: Introduction to Deep Learning


    ### 4.1 Introduction


    Deep learning is a computational neural network architecture containing multiple
    hidden layers. Since deep learning is a larger neural network, it is treated as
    a subfield of machine learning and artificial intelligence. It is an extremely
    powerful tool for speech recognition, remote sensing, classifying objects, and
    pattern recognition tasks. For the past few years, deep learning algorithms are
    extensively employed in many different scientific and engineering applications
    such as self-driving cars, fraud detections, health care, entertainment, and so
    on. Using many hidden layers, a deep learning model learns from big datasets with
    multiple levels of abstraction.


    During the learning process, a backpropagation algorithm helps the model to fine-tune
    the parameters of one layer from the calculated parameters of the previous layer.
    Figure 4.1 shows a schematic of a deep learning model with *n* hidden layers and
    biases, where every neuron in a layer is connected to every neuron of the next
    layer.


    If we start modeling from scratch, the optimum numbers of layers and neurons of
    a deep network should be chosen carefully. There are no correct layer or neuron
    numbers for a specific problem, and numerous factors can influence the output.
    Many powerful deep learning architectures such as Inception-v3, ResNet, Inception-ResNet,
    DenseNet, and Pyramidal Residual Net have more than 100 layers [18–22]. However,
    the performance of these architectures depends on both node and layer numbers.
    Having too many hidden layers is not always effective, and it should be selected
    based on the type of training dataset and output requirements. An optimum selection
    of these parameters (also called capacity) can help us to avoid overfitting and
    underfitting during the training process [23]. Most of the time, we don’t need
    too many layers as they can add unnecessary difficulties to the computational
    process. A system with 5–20 nonlinear hidden layers can map extremely complex
    functions for inputs that are simultaneously sensitive to minute details [24].
    Therefore, while selecting a deep learning model, we need to be extra cautious
    regarding network layers and architecture.


    As the growth of deep learning is accelerating, many new deep learning models
    are continuously coming out each year. Some of the popular deep learning architectures
    are briefly discussed in the following sections.


