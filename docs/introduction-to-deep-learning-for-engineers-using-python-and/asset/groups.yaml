    available to fulfill the request. Very typically, if you don’t select any GPU,
    you will not see this error message. But if you see an error message, you should
    try a different zone to create your instance. For example, you may change from
    us-west1-b to a, c or us-central1, us-east1, etc.


    When the instance is successfully created, you will see a notification. At this
    stage, you will need to stop the instance from Compute Engine → VM instances.
    Select three dots, as shown in Fig. 6.17, and then select stop. This trick will
    save some unnecessary billing in your account. You may only start the instance
    when you run a model or install dependencies.


    # 6.5  GPU QUOTA REQUEST


    The GPU quota request is an important step if you plan to access GPUs in Google’s
    remote server. You may finish it before creating an instance. Go to Navigation
    Menu, IAM & Admin, and then select Quotas (Fig. 6.18).


    If you are a new user, you might see an upgrade option on the top right corner.
    In that case, you will need to upgrade your account by clicking the upgrade (Fig.
    6.19). Otherwise, you won’t be able to submit the Quota request. Even after upgrading,
    Google will not charge you until your free ($300) credits have run out.'
