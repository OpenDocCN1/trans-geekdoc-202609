    \ 会提供拒绝原因，您需要稍后再试。\n\n一旦您的配额获批，您需要通过添加 GPU 来更新实例。如果您想对当前实例进行任何更改，请先停止正在运行的实例（deeplearning1），然后选择该实例。您将找到一个编辑按钮用于对实例进行更改。\n\
    \n![](img/194138d45b566d0634bfa2025ddf48f7_71_0.png)\n\n**图 6.22：** 编辑 VM 实例并添加\
    \ GPU。\n\n选择编辑，然后展开“CPU 平台和 GPU”部分。在这里您可以添加所需 GPU 的数量和类型。如果您只有一个 GPU 配额，您将无法添加多个\
    \ GPU。如果您认为项目需要多个 GPU，那么您应该在上一节中请求配额数量（图 6.21）。您可以拥有多个 GPU 配额。在本演示中，我们选择了一个 NVIDIA\
