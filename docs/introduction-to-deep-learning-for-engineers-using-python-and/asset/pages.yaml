    # ### 4.2.1  POOLING LAYER


    A pooling layer reduces the spatial size of the representation, which is another
    integral task of the convolutional neural network. This step is done to pool or
    extract the most important features from the output of a convolutional layer.


    The pooling process can reduce the spatial size or dimension of each feature map
    through different formulations such as max, average, sum, overlapping, L2, etc.
    This step generally helps the model to understand feature motifs that may appear
    at different locations of the training image. A schematic for feature mapping
    through max-pooling, average-pooling, and sum-pooling is given in Fig. 4.2. Typically,
    the convolution neural network has several convolutional and pooling layers at
    the beginning before going through the fully connected layers.


    # ### 4.2.2  FULLY CONNECTED LAYER


    The final stage of the convolutional neural network contains fully connected layers.
    It is similar to the regular artificial neural network and contains neurons that
    are connected to all neurons from the previous layer. The training image features
    that are extracted through convolutional and pooling layers are classified in
    the fully connected layer. Sometimes, to use computational memory efficiently,
    two small, fully connected layers are used instead of one large layer. Some of
    the popular convolution neural networks such as AlexNet, VGG Net uses more than
    one fully'
