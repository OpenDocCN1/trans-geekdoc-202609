- pgno: 110
  md: '# Author’s Biography


    # TARIQ M. ARIF


    ![](img/194138d45b566d0634bfa2025ddf48f7_110_0.png)


    **Tariq M. Arif** is an assistant professor in the Department of Mechanical Engineering
    at Weber State University, UT. Prior to that, he worked at the University of Wisconsin,
    Platteville, as a lecturer. Tariq obtained his Ph.D. in 2017 from the Mechanical
    Engineering department of the New Jersey Institute of Technology (NJIT), NJ. His
    main research interests are in the area of artificial intelligence and genetic
    algorithm for robotics control, computer vision, and biomedical simulations of
    focused ultrasound surgery. He completed his Masters in 2011 from the University
    of Tokushima, Japan, and a B.Sc. in 2005 from Bangladesh University of Engineering
    and Technology (BUET). Tariq also worked in the Japanese automobile industry as
    a CAD/CAE engineer after completing his B.Sc. degree. In his industrial and academic
    carrier, Tariq has been involved in many different research projects. Currently,
    he is working on the implementation of deep learning models for various engineering
    tasks.'
