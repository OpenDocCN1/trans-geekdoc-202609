    # 4.4 OTHER DEEP LEARNING MODELS


    Among the other deep learning models, recursive and unsupervised pre-trained networks
    are gaining popularity. Recursive networks apply the same set of weights recursively
    to learn from structured information, and it is known for being computationally
    expensive [40]. Recursive models are suitable for pattern analysis as they can
    process both the numerical and symbolic data together. Different variants of recursive
    networks are continuously emerging and explored by contemporary researchers. Although
    it is relatively less popular than the recurrent network, it has shown excellent
    performance in natural language processing, image decomposition, and forecasting
    problems.


    The unsupervised pre-trained network can help to improve the CNN''s performance,
    and it can reduce labeled data dependency by creating layers of feature detectors
    [41]. This type of network is suitable for finding hidden patterns inside the
    data by using autoencoders, Generative Adversarial Networks (GANs), and other
    methods.


    An autoencoder has different variants, but it is generally a neural network where
    the input features are reduced or mapped in a hidden layer and then restore or
    remapped to the same numbers of features at the output. The middle layer of an
    autoencoder, also called the bottleneck is symmetric about the center, and it
    contains fewer nodes than input or output nodes. A schematic diagram of the autoencoder
    architecture is given in Fig. 4.7.


    The GANs is one of the exciting classes of deep learning. It can produce realistic
    data by using two parallel adversarial networks that compete with each other.
    One of the networks'
