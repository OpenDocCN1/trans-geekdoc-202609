  md: '![](img/194138d45b566d0634bfa2025ddf48f7_55_0.png)


    **Figure 5.1:** Learning process through transfer learning [55].


    that we can use effectively, and the amount of effort required for this process
    is also relatively insignificant. Some of the widely used pre-trained networks
    are ResNet, GoogleLeNet, VGG, Inception, DenseNet, VGG, EfficientNet, etc. [51].
    Many other ready-to-use pre-trained models are available now, and as the field
    of deep learning is emerging, new models are continuously being tested and added
    to this list.


    One of the advantages of using pre-trained networks is that the architectures
    have already been trained and tested using a large dataset (e.g., ImageNet). We
    can just use these networks partially or wholly in the transfer learning process.
    For partial uses of a model, only the last few layers are regulated to train it
    on a new dataset, but the core part of the network doesn’t change. On the other
    hand, we can also utilize the whole architecture without parameter values, initialize
    all the weights randomly, and then train the model using the new dataset. These
    simple techniques can significantly boost the performance of a deep learning model,
    and recently, this practice is becoming well accepted in computer vision applications
    [52–54]. A schematic of transfer learning process is shown in Fig. 5.1.


    # 5.3.1 **FEATURE EXTRACTION, FINE TUNING, AND DATA AUGMENTATION**


    Deep learning architectures learn features through layer by layer. For example,
    when a convolutional network learns from images, it tends to learn patterns, textures,
    edges, and brightness in the first few layers. These features from images are
    used for processing many different types of natural images, and therefore they
    can be reused. Typically, the last few layers of a deep learn-'
  merge: -1
