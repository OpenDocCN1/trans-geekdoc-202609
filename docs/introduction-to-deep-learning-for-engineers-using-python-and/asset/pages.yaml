- pgno: 14
  md: '# Preface


    My goal in writing this book is to motivate engineering students to learn deep
    learning applications. As a newly evolved area, deep learning models and their
    implementation methods are rapidly changing. This nature of continuous development
    provides an extra layer of challenges for newcomers, especially those who are
    not in the field of data science or machine learning. I found it exciting that
    many engineering projects can be optimized and improved significantly by implementing
    a deep learning model that is already tuned for a similar application. Currently,
    there are numerous excellent books and online resources available on deep learning
    to explain theories and applications. But I always felt the need for a short book
    that shows all the necessary techniques to utilize deep learning models in real-life
    projects using cloud computing. So, my primary motivation in writing this manuscript
    is to give a whole picture of the application process.


    One of the challenges I faced while writing is to squeeze the introductory chapters
    that cover fundamental theories. I would suggest readers relate the case study
    part with fundamental theories and focus on running the codes provided in this
    book by setting up a GCP account. Although this book covers only a small facet
    of deep learning implementation, I hope it will inspire engineering students to
    learn other different variations that can be related to their projects.


    Tariq M. Arif

    July 2020'
  merge: -1
  img_proc: true
