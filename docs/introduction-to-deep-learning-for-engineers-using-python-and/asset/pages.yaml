    functions. The derivatives of activation functions also play an important role
    as they are used in the backpropagation error calculation during gradient descent.
    A short description of typical activation functions and their derivatives are
    given in the following sections for reference.


    # 3.3.1 SIGMOID ACTIVATION


    The sigmoid activation and its derivative are defined by Equations (3.1) and (3.2),
    respectively:


    $$\sigma(z) = \frac{1}{1 + e^{-z}} \tag{3.1}$$


    and


    $$\sigma''(z) = \sigma(z)(1 - \sigma(z)). \tag{3.2}$$


    This function is also known as the logistic regression function. We can use it
    when we need to determine the probability between 0 and 1. Sometimes, the sigmoid
    function exists only in the output layer of a neural network for doing the binary
    classification. A plot of sigmoid function in the range of −5 to 5 is given in
    Fig. 3.3.


    # 3.3.2 HYPERBOLIC TANGENT ACTIVATION


    Hyperbolic tangent, also known as tanh function and its derivative are defined
    by Equations (3.3) and (3.4), respectively:


    $$\sigma(z) = \frac{e^{z} - e^{-z}}{e^{z} + e^{-z}} \tag{3.3}$$'
