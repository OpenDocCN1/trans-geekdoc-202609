    # # Introduction to Deep Learning


    # ## 4.1 INTRODUCTION


    Deep learning is a computational neural network architecture containing multiple
    hidden layers. Since deep learning is a larger neural network, it is treated as
    a subfield of machine learning and artificial intelligence. It is an extremely
    powerful tool for speech recognition, remote sensing, classifying objects, and
    pattern recognition tasks. For the past few years, deep learning algorithms are
    extensively employed in many different scientific and engineering applications
    such as self-driving cars, fraud detections, health care, entertainment, and so
    on. Using many hidden layers, a deep learning model learns from big datasets with
    multiple levels of abstraction.


    During the learning process, a backpropagation algorithm helps the model to fine-tune
    the parameters of one layer from the calculated parameters of the previous layer.
    Figure 4.1 shows a schematic of a deep learning model with *n* hidden layers and
    biases, where every neuron in a layer is connected to every neuron of the next
    layer.


    If we start modeling from scratch, the optimum numbers of layers and neurons of
    a deep network should be chosen carefully. There are no correct layer or neuron
    numbers for a specific problem, and numerous factors can influence the output.
    Many powerful deep learning architectures such as inception-V3, ResNet, Inception-ResNet,
    DenseNet, and Pyramidal Residual Net have more than 100 layers [18–22]. However,
    the performance of these architectures depends on both node and layer numbers.
    Having too many hidden layers is not always effective, and it should be selected
    based on the type of training dataset and output requirements. An optimum selection
    of these parameters (also called capacity) can help us to avoid overfitting and
    underfitting during the training process [23]. Most of the time, we don’t need
    too many layers as they can add unnecessary difficulties to the computational
    process. A system with 5–20 nonlinear hidden layers can map extremely complex
    functions for inputs that are simultaneously sensitive to minute details [24].
    Therefore, while selecting a deep learning model, we need to be extra cautious
    regarding network layers and architecture.


    As the growth of deep learning is accelerating, many new deep learning models
    are continuously coming out each year. Some of the popular deep learning architectures
    are briefly discussed in the following sections.'
