    # 4.2 CONVOLUTIONAL NEURAL NETWORK


    Convolutional Neural Network (CNN), also known as ConvNet, was initially developed
    by Yann LeCun for computer vision and image processing [25]. Later on, it has
    been successfully modified by other researchers for improved sentence classification,
    speech recognition, image segmentation, and image classification tasks [26–29].
    For computer-vision related operations, CNN is the most widely used deep learning
    method. A CNN will have a number of convolutional and pooling layers at the beginning,
    and after that, it goes through the fully connected layers.


    The image input in the convolutional layer is typically rearranged in multiple
    arrays or multi-channeled images. For example, a color image is a combination
    of three-color channels (red, green, and blue), and each of these channels can
    be presented in a 2D array for the input. Inside the 2D array, the intensities
    of these color channels are ranged from 0–255.


    The convolutional layer also contains kernels to map features from the input images.
    They typically slice through image depth, numbers of pixels, or zero-padding around
    a shape to learn from different sections of three channel inputs. When multiple
    kernels concatenate with each other, they are called filters. Therefore, filters
    have one more dimension than the kernels. Inside the network, each of the kernels
    will add a new layer that corresponds to edges, depths, shapes, or textures of
    the image.'
