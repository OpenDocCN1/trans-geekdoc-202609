    # 7.8 MODEL TESTING


    The testing accuracy defines how well the model can predict the testing data set,
    which has 8,041 car images. After training, our model can predict 91.5% of images
    correctly. However, this accuracy is based on the testing images provided by Stanford’s
    car dataset. We may check the model performance by taking a car picture or by
    using a random car image from the internet.


    We did a google search “Volkswagen Golf Hatchback 1991,” saved the image, and
    uploaded it to the GCP cloud home folder using Jupyter Notebook. We also did cropping
    before classifying this image, since our model was trained on cropped images.
    Figure 7.31 shows the way to read an image from the home folder (e.g., car_image1.jpg)
    and resize it for testing using our model.


    Now to test this image through the model, we used the codes shown in Fig. 7.32.
    The model output class here is 190+1 =191. As Python reads columns from 0, we
    should add 1. From the cars_meta.csv file, we also find that class 191 is actually
    Volkswagen Golf Hatchback 1991.


    We also checked a couple of pre-2013 car model images from the internet, and most
    of the time (9 out of 10), the model can predict car make, model, and year correctly.'
