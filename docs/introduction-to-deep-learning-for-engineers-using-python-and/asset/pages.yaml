  md: '# Introduction: Python and Array Operations


    # 1.1 INTRODUCTION


    Python is a popular object-oriented programming language that was initially created
    by Guido van Rossum in 1990. Later on, many developers and programmers contributed
    to its growth, and its popularity has been escalated in recent years in many different
    domains, including machine learning [1]. Python also has many vibrant online communities
    and active support forums. Among the popular programming forums, the https://stackoverflow.com/
    and https://python-forum.io/ sites have a substantial amount of useful information
    for beginners. One of the benefits of using Python is that it provides numerous
    ready-to-use robust libraries that are actively maintained by developers through
    the GitHub page (https://github.com/). Many of its libraries can be implemented
    effectively for general-purpose programming, scientific computing, data visualization,
    and machine learning applications. Beside freely available libraries, there are
    numerous other reasons why Python become a popular programming language, not only
    for machine learning or artificial intelligence but also for web, game development,
    and business applications. The Python hype is likely to grow for many more years
    to come, and recently, many top U.S. universities have switched to Python for
    teaching introductory programming classes [2].


    Deep learning is a new and popular platform that is widely used in many different
    predictive problems related to artificial intelligence. Many scientists and researchers
    use Python programming language and its libraries to utilize deep learning models.
    Training a deep learning model requires an extensive amount of data processing
    capabilities by GPU-based hardware, which is relatively expensive. Nowadays, there
    are cloud computing platforms available such as Amazon Web Services (AWS), Microsoft
    Azure, and Google Cloud Platform (GCP), and these platforms can be used for training
    a data-intensive deep learning model. In this book, we have shown the steps required
    to run a deep learning model using the google cloud platform in a cost-effective
    way. Since the basic Python programming is required to follow this text, the introductory
    chapters (Chapters 1 and 2) are included to provide relevant Python programming
    skills and library descriptions. For running deep learning model, a widely used
    library known as NumPy (Numerical Python) and a tensor array library (PyTorch)
    are used.


    Next, Chapters 3-5 provide basic introductions related to the artificial neural
    network, deep learning, and transfer learning frameworks. Chapter 6 illustrates
    the essential tips and'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'tricks to set up the Google Cloud Platform’s GPU engine and the PyTorch library.
    Finally, Chapter 7 presents a case study for the actual implementation of a deep
    learning model.


    Although introductory backgrounds are provided, anyone who is completely new to
    Python should read some basics of Python data structure and string manipulations
    before starting Chapter 7. Numerous materials are freely available online to learn
    the basics of Python programming. A good starting point is the official Python
    tutorials available at https://docs.python.org/3/tutorial/.


    In the following sections, we are going to show the steps to install Anaconda
    and run Jupyter Notebook. These steps will be useful to follow the case study
    presented at the end. Later in this chapter, we will show a few simple array manipulations
    using Python and NumPy library.


    # 1.2 ANACONDA INSTALLATION


    We are going to use an open-source distribution for Python, known as Anaconda,
    which includes a lot of useful scientific packages for machine learning applications
    and data processing. One of the benefits of using Anaconda is that it comes with
    hundreds of libraries that are not required to install separately for our workflows
    such as NumPy, Matplotlib, pandas, SciPy, Bokeh, and many more. To download Anaconda
    visit https://www.anaconda.com/products/individual. Once the download option has
    been selected, there will be options for selecting the installer associated with
    different operating platforms (e.g., Windows/ MacOS/ Linux). While installing
    the Anaconda, make sure to check on both of the advanced options, as shown in
    Fig. 1.1.


    If Python had already been installed on your computer, this selection would help
    to create the correct PATH variable needed for the installation.


    # 1.3 USING JUPYTER NOTEBOOK


    After Anaconda installation Anaconda Navigator can be opened from the program
    search menu, which provides several interactive computing environments, including
    the Jupyter Notebook. We can open Jupyter Notebook from Anaconda, or we may search
    in the search menu for “Jupyter Notebook (Anaconda3)” and select from there.


    The Jupyter Notebook (shown in Fig. 1.2) allows us to create live Python code
    and iterate data effectively for machine learning applications. This notebook
    editor is tremendously popular and became a de facto standard among data scientists.
    One study shows that in September 2018, the code-sharing site GitHub counted more
    than 2.5 million public Jupyter Notebooks [3].


    # 1.4 ARRAY COMPUTING USING NUMPY


    The NumPy (Numerical Python) library can be used to handle a massive amount of
    array-based dataset. It was first introduced in 2006, and due to its high performance
    in handling big-data for deep learning, many other supporting libraries such as
    Pandas and SciPy (Scientific Python)'
