    # 6.5.1 A COST-EFFECTIVE APPROACH


    There is a cost-effective option in GCP that you may consider for your project,
    known as preemptible instance. If you select a preemptible instance, you will
    be able to run an instance at a much lower price than a regular instance. But
    the server might terminate (preempt) these instances if it needs to access these
    resources for other tasks. This option is a little inconvenient to use, knowing
    that your instance may shut down any time, but it is economical. Another notable
    limitation of the preemptible instance is that the compute engine is always going
    to terminate after they run for 24 hours. So, this is the trade-off between preemptible
    and non-preemptible, and you have to make your decision based on your requirements.
    For a new user who is running small deep learning models and still exploring different
    functionalities of GCP, preemptible is a practical and economical option. Note
    that some of the zones may not have preemptible instances available. You will
    find useful information related to preemptible instances in the GCPs website [60].
    In this text, the model we are going to use will take about an hour to run on
    a GPU based compute engine. So, we have selected the “preemptible” option for
    our instance.'
