- pgno: 56
  md: 'ing network are very specific to the current task. So, for a classification
    problem, if we utilize a pre-train model for transfer learning without using its
    last layer, we will easily get the hidden states of the trained network to extract
    some standard features.


    For a more rigorous training process, we can reconfigure some of the layers of
    the model (especially last few) before retraining it on the new data. This step
    will fine-tune the whole model, but the successful implementation of this approach
    depends on the dataset and the prediction task we are trying to accomplish. The
    PyTorch package “torchvision” has many popular model architectures that we can
    use for deep transfer learning [56].


    If we have relatively less amount of data for deep learning, we can use the data
    augmentation technique to improve model performance. Augmentation will manipulate
    the training images through different ways, such as flipping, rotating, shearing,
    cropping, shifting RGB channels, and so on. As a result, we will get various unique
    and relevant images from a single image. It will increase the amount of training
    data representation of our model. Recently, different data augmentation techniques
    are explored by researchers for improving the validation accuracy of a model.
    We will show a practical implementation of using pre-trained weights, fine-tuning,
    and data augmentation in Chapter 7.


    # 5.4   MODEL EVALUATION


    During training, we will initially need to split our annotated data sets into
    training and test sets. The training data (can be subdivided into training and
    validation set) will be used to learn the model parameters, and test data will
    estimate the accuracy of the learned model. Typically, a large test set will do
    a good estimation with low variance. There are different types of metrics available
    that used in model evaluation, such as confusion matrix, accuracy, F1 score, and
    so on.


    To evaluate the model, we can initially check classification accuracy, especially
    when we have an almost equal number of samples for different classes. It is just
    the ratio correct predictions to the total numbers of predictions. The confusion
    matrix can be used to give the quality of output result shown in a matrix, where
    higher diagonal values indicate many correct results. A confusion matrix can be
    constructed by finding true positive (model predicted positive, which is a true
    result), false positive (model predicted positive, which is a false result), true
    negative (model predicted negative, which is a true result), and false negative
    (model predicted negative, which is a false result). From the values of the matrix,
    we can calculate precision, recall, and weighted F1 scores to understand the relevance
    and model performance.


    Evaluation metrics should be selected based on the task performed by a model.
    It is always better to check multiple metrics to evaluate a model since a model
    may perform differently in different metrics. The multiclass classification case
    study shown in Chapter 7 has almost 50% test and 50% training data. Therefore,
    for a simpler evaluation, we showed only the training loss and accuracy metrics
    for that problem.'
