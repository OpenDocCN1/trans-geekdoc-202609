    # 3.4 MINIMIZING THE LOSS FUNCTION


    The loss function is the quantity that will be minimized during training [5].
    It is also known as the objective function or error function. A neural network
    may have multiple loss functions based on the number of outputs. A classification
    model should have a cross-entropy loss or a log loss of 0. Generally, for a two-class
    classification problem binary cross-entropy, and for multiclass classification
    problems, categorical cross-entropy is used. The learning process of a neural
    network is basically finding out weights and biases to minimize the loss function.


    Typically, the loss function is also called cost function if the error is calculated
    for the entire training set or a batch. The standard binary cross-entropy loss
    function can be defined by Equation (3.13) [12]:


    $$J = -\frac{1}{M} \sum_{m=1}^{M} [y_m \times \log\big(h_\theta(x_m)\big) + (1
    - y_m) \times \log\big(1 - h_\theta(x_m)\big)] , \qquad (3.13)$$


    where $M$ = number of training examples, $y_m$ = target label for training example
    $m$, $x_m$ = input for training example $m$, $h_\theta$ = model with neural network
    weights $\theta$. For categorical targets if $\hat{y}_1 \dots \hat{y}_m$ are the
    probabilities of the “$m$” classes, and the $r$th class is the ground-truth class,
    then'
