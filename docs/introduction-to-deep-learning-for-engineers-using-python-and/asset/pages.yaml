    # 3.3  NEURONS AND ACTIVATION FUNCTIONS


    Many internal parameters can influence the output found from an artificial neural
    network. But generally, outputs are directly related to the number of neurons
    and their activation functions.


    The neurons are the nodes, typically shown by circles that are arranged inside
    the layers. Inside a layer, these neurons take input weights from all connections
    and add a bias, initializes these parameters, and then calculates the output using
    another function known as an activation function. The mathematical operations
    happening inside each layer amplify dramatically as the neurons and connections
    are increased. Figure 3.1 shows a simple neural network when we have two hidden
    layers, and each of them containing four neurons. Figure 3.2 focuses on the operations
    happening inside one of the neurons of hidden layer 1.


    This operation can be divided into two steps of computations. First, **Z** is
    calculated using the weights (**W**), bias (**b**), and inputs (**x**). Second,
    the activation function **σ** is calculated using **Z**. We could simply say that
    output of a neuron is a function of a function. In Fig 3.2, a sigmoid activation
    function is shown as an example.


    The sigmoid activation function (shown in Fig. 3.2) has the ability to map any
    predicted value between 0 and 1. This output can be used to estimate the probability,
    where a threshold or tipping point (e.g., 0.5) is used for binary classification
    problems. For example, if *output* ≥ 0.5, class = 1 and if *output* < 0.5, class
    = 0. There are many other types of activation functions available for an artificial
    neural network. It is one of the important selection parameters that dictate the
    computational efficiency.'
