  md: '# Deep Transfer Learning


    # 5.1 INTRODUCTION


    Transfer learning is a method of applying the knowledge of a pre-trained network
    to another model when we have insufficient data and computing resources to train
    a new model from scratch. Using this method, knowledge learned from one type of
    data can be applied to totally different types of data. The deep convolutional
    network showed tremendous success in image recognition and classification tasks
    using transfer learning methods [46, 47]. One of the key challenges to train a
    deep learning model from the beginning is that it requires a huge amount of labeled
    dataset, which is not common in many practical scenarios. Generally, a model can
    make good predictions if it is trained on a big dataset. There are many deep learning
    models available that are developed from big datasets, such as, ImageNet, MNIST,
    M.S. COCO, Caltech datasets, Pascal VOC, CIFAR10, and so on. The performance of
    a deep learning model increases if it is trained on a big dataset. For example,
    the popular ImageNet dataset contains 14,197,122 images, and the Tina Image contains
    79,302,017 images [48, 49]. We can use deep learning models that are trained on
    these datasets for doing a different task.


    # 5.2 TYPES OF TRANSFER LEARNING


    The relationship between traditional machine learning and transfer learning can
    be categorized into three different ways, according to Pan et al. [50]: Inductive,
    Transductive, and Unsupervised learning. Inductive transfer learning method can
    be built by infusing similar instance form different learning tasks, transductive
    transfer learning can be used when the source and target tasks are the same, and
    the unsupervised transfer learning do unsupervised learning tasks (e.g., clustering,
    dimensionality reduction). Pan and Yang [50] also sub-categorized transfer learning
    approaches based on the instance, feature-representation, parameter, and relational-knowledge
    transfers.


    # 5.3 USING PRE-TRAINED NETWORKS


    If we want to use a dataset for supervised learning, we will need to label or
    annotate data for training. Annotating a large volume of data, which is an integral
    part of deep learning, would be extremely time-consuming. Fortunately, as we mentioned
    in the introduction, there is an easy way to avoid this by implementing knowledge
    from a pre-trained model architecture that has already been trained on a different
    dataset. There are many pre-trained models available'
  merge: -1
  img_proc: true
