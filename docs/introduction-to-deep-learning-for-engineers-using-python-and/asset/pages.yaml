    The learning rate, α is one of the critical hyper-parameters for model training,
    and it needs to be tuned carefully. If the learning rate is too low, the gradient
    descent algorithm will become computationally expensive. On the other hand, if
    the learning rate is relatively big, it may overshoot the minima and fail to converge.


