    \ code\n\n*   Putting your package on PyPi\n\nWhy object-oriented programming?\n\
    \nObject-oriented programming has a few benefits over procedural programming,\
    \ which is the programming style you most likely first learned. As you'll see\
    \ in this lesson:\n\n*   Object-oriented programming allows you to create large,\
    \ modular programs that can easily expand over time.\n\n*   Object-oriented programs\
    \ hide the implementation from the end user.\n\nConsider Python packages like\
    \ Scikit-learn, pandas, and NumPy. These are all Python packages built with object-oriented\
    \ programming. Scikit-learn, for example, is a relatively large and complex package\
    \ built with object-oriented programming. This package has expanded over the years\
    \ with new functionality and new algorithms.\n\nWhen you train a machine learning\
    \ algorithm with Scikit-learn, you don't have to know anything about how the algorithms\
    \ work or how they were coded. You can focus directly on the modeling.\n\nHere's\
