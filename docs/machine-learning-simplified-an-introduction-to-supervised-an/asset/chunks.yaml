    要完成本课程的练习，你需要一个 `AWS Account ID`。


    然而，你无需完成本课时的练习才能从基础课程毕业。本课时包含的练习标记为 `OPTIONAL ONLY`，如果你无法创建 AWS 账户，只需阅读练习模块即可了解这些工具的工作方式。


    要设置新的 AWS Account ID，请参考“如何创建并激活新的 Amazon Web Services 账户？”的说明。


    创建账户时需要提供付款方式。如需了解哪些服务免费，请参阅 AWS Free Tier 文档。


    这些练习会产生费用吗？


    本课时包含大量演示和练习。你 `do not` 需要购买任何 AWS 设备即可完成本课。但请仔细阅读以下可能用于演示和完成练习的 AWS 服务列表。


    使用 AWS DeepRacer 训练强化学习模型


    *   使用 AWS DeepRacer 入门，你将在首月获得 `10 小时免费` 用于训练或评估模型，以及 `5GB 免费存储空间`。这足以训练第一个时间试验模型、对其进行评估、调优，然后将其提交至
    AWS DeepRacer 联盟。`此优惠在你首次使用服务后 30 天内有效`。


    *   超过 `10 小时` 的训练和评估后，你需要为训练、评估和存储机器学习模型付费。费用基于你为新模型训练和评估的时间以及存储模型的大小。想了解 AWS
    DeepRacer 计费细节，请参阅 AWS DeepRacer Pricing。


    使用 AWS DeepComposer 生成音乐


    *   入门时，`AWS DeepComposer` 为首次用户提供 `12 个月免费额度`。免费额度允许你最多进行 `500 项推理任务`，即可生成 `500
    件音乐`，使用 `AWS DeepComposer Music Studio`。你可以使用其中一个实例免费完成练习。想了解 `AWS DeepComposer`
    的费用，请参阅 `AWS DeepComposer` Pricing。


    构建自定义生成式 AI 模型（GAN）使用 Amazon SageMaker（可选）


    *   Amazon SageMaker 是独立服务，拥有自己的计费和计费等级。要训练自定义生成式 AI 模型，教练使用的实例类型不在 Amazon SageMaker
    免费额度范围内。如果你想与教练一起编码并训练自己的自定义模型，可能会产生费用。请注意，创建自定义模型完全是可选的，完成本课程不需要完成此练习。想了解 SageMaker
    的费用，请参阅 Amazon SageMaker Pricing。


