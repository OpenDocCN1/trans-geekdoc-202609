  trans: '

    你是一家图书推荐公司的编辑，想要撰写一篇关于本年度最大书籍趋势的文章。你认为存在一种名为“微类型”的趋势，并有信心通过书籍描述文本识别出这些微类型。


    通过一种无监督机器学习技术——聚类，你可以验证你的假设：书籍描述文本可以用来识别这些“隐藏”的微类型。


    在本节课程早期，你被介绍了无监督学习的概念。这种机器学习任务特别适用于数据未标记的情况。


    ![Image](img/image28.png)


    ### 步骤二：构建数据集


    为了验证假设，你收集了今年 800 本出版于当年的浪漫类书籍的描述文本。


    数据探索、清洗和预处理


