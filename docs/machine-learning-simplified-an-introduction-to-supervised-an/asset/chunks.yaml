- raw: '3.  I believe my customers fall into one of many customer segments, but I
    don’t know what those segments are in advance. After asking for permission, I
    collect a bunch of data on their actions when they use my product and try to determine
    if there are any collections of users that behave in similar ways


    4.  I work for a show company and want to provide a service to help parents predict
    their children’s shoe sizes for any particular age. Within this system, I represent
    shoe size as a continuum of values and then round to the nearest shoe size.


    Answer: B, D


    1.  As a machine learning practitioner, you’re working with stakeholders on music
    streaming app. Your supervisor asks, “How can we increase the average number of
    minutes a customer spends listening on our app”?


    This is a broad question (too broad) with many different potential factors affecting
    how long a customer might spend listening to music.


    How might you change the scope or redefine the question to be better suited, and
    more concise, for a machine learning task?


    1.  Will changing the frequency of when we start playing ad affect how long a
    customer listens to music on our service.


    2.  Will creating customer playlist encourage customers to listen to music longer?


    3.  Will creating artist interviews about their songs increase how long our customers
    spend listening to music?


    Answer: All of the Above


    ## Step Two: Build a Dataset


    The next step in the machine learning process is to build a dataset that can be
    used to solve your machine learning-based problem. Understanding the data needed
    helps you select better models and algorithms so you can build more effective
    solutions.


    The most important step of the machine learning process


    Working with data is perhaps the most overlooked—yet most important—step of the
    machine learning process. In 2017, an O’Reilly study showed that machine learning
    practitioners spend 80% of their time working with their data.


    The Four Aspects of Working with Data


    ![Image](images/image15.png)


    You can take an entire class just on working with, understanding, and processing
    data for machine learning applications. Good, high-quality data is essential for
    any kind of machine learning project. Let''s explore some of the common aspects
    of working with data.


    Data collection


    Data collection can be as straightforward as running the appropriate SQL queries
    or as complicated as building custom web scraper applications to collect data
    for your project. You might even have to run a model over your data to generate
    needed labels. Here is the fundamental question:


    Does the data you''ve collected match the machine learning task and problem you
    have defined?


    Data inspection


    The quality of your data will ultimately be the largest factor that affects how
    well you can expect your model to perform. As you inspect your data, look for:


    *   Outliers


    *   Missing or incomplete values


    *   Data that needs to be transformed or preprocessed so it''s in the correct
    format to be used by your model


    Summary statistics


    Models can assume how your data is structured.


    Now that you have some data in hand it is a good best practice to check that your
    data is in line with the underlying assumptions of your chosen machine learning
    model.


    With many statistical tools, you can calculate things like the mean, inner-quartile
    range (IQR), and standard deviation. These tools can give you insight into the
    scope, scale, and shape of the dataset.


    Data visualization


    You can use data visualization to see outliers and trends in your data and to
    help stakeholders understand your data.


    Look at the following two graphs. In the first graph, some data seems to have
    clustered into different groups. In the second graph, some data points might be
    outliers.


    ![Image](images/image16.png)


    Terminology


    Impute is a common term referring to different statistical tools which can be
    used to calculate missing values from your dataset.


    Outliers are data points that are significantly different from others in the same
    sample.


    Additional reading


    In machine learning, you use several statistical-based tools to better understand
    your data. The sklearn library has many examples and tutorials, such as this example
    demonstrating outlier detection on a real dataset.


    Quiz: Build A Dataset


    Use this series of True / False questions to test your knowledge of different
    parts of building your dataset. Some questions are asking you to think just a
    little bit deeper about some of the content you just learned.


    1.  True or false: Your data requirements will not change based on the machine
    learning task you are using.


    1.  True


    2.  False


    Answer: B


    1.  True or false: models are universal, so date is not relevant.


    1.  True


    2.  False


    Answer: B


    1.  True or false: data needs to be formatted so that is compatible with the model
    and model training algorithm you plan to use


    1.  True


    2.  False


    Answer: A


    1.  True or false: Data visualizations are they only way to identify outliers
    in your data.


    1.  True


    2.  False


    Answer: B


    1.  True or false: After you start using your model(performing inference), you
    don’t need to check the new data that it received.


    1.  True


    2.  False


    Answer: B


    ## Step Three: Model Training


    Splitting your Dataset


    The first step in model training is to randomly split the dataset. This allows
    you to keep some data hidden during training, so that data can be used to evaluate
    your model before you put it into production. Specifically, you do this to test
    against the bias-variance trade-off. If you''re interested in learning more, see
    the Further learning and reading section.


    Splitting your dataset gives you two sets of data:


    *   **Training dataset**: The data on which the model will be trained. Most of
    your data will be here. Many developers estimate about 80%.


    *   **Test dataset**: The data withheld from the model during training, which
    is used to test how well your model will generalize to new data.


    Model Training Terminology


    The model training algorithm iteratively updates a model''s parameters to minimize
    some loss function.


    Let''s define those two terms:


    *   Model parameters: Model parameters are settings or configurations the training
    algorithm can update to change how the model behaves. Depending on the context,
    you’ll also hear other more specific terms used to describe model parameters such
    as weights and biases. Weights, which are values that change as the model learns,
    are more specific to neural networks.


    *   Loss function: A loss function is used to codify the model’s distance from
    this goal. For example, if you were trying to predict a number of snow cone sales
    based on the day’s weather, you would care about making predictions that are as
    accurate as possible. So you might define a loss function to be “the average distance
    between your model’s predicted number of snow cone sales and the correct number.”
    You can see in the snow cone example this is the difference between the two purple
    dots.


    Putting it All Together


    The end-to-end training process is


    *   Feed the training data into the model.


    *   Compute the loss function on the results.


    *   Update the model parameters in a direction that reduces loss.


    You continue to cycle through these steps until you reach a predefined stop condition.
    This might be based on a training time, the number of training cycles, or an even
    more intelligent or application-aware mechanism.


    Advice From the Experts


    Remember the following advice when training your model.


    *   Practitioners often use machine learning frameworks that already have working
    implementations of models and model training algorithms. You could implement these
    from scratch, but you probably won''t need to do so unless you’re developing new
    models or algorithms.'
