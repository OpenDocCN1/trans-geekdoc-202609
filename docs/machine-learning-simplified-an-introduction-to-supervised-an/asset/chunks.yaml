    工具通常针对特定用例设计，因此很难概括选择规则。下面的文章提供了具体用例和指标在实际中的应用。


    `*` 这份医疗领域的示例，通过 xgboost 树模型自动预测脊柱病理状况，展示了如何通过避免假阳和假阴预测来发挥重要作用。


    `*` 流行的开源库 `sklearn` 提供了常用指标及其使用方法的信息。


    `*` 这篇来自 AWS 机器学习博客的文章展示了选择正确的模型评估指标对于使用 Amazon Forecast 进行准确能耗估算的重要性。


    ## Step Five: Model Inference


    恭喜！你已准备好部署模型。


    在训练模型、评估其效果并满意结果后，你就可以使用看不见的数据在实际场景中生成预测。在机器学习中，这一过程通常称为推理。


    ### 迭代过程


    ![Image](img/image20.png)


    即使部署后，你也会持续监控模型，确保其输出符合预期。你可能会重新审视数据、调整训练算法的参数，或更换用于训练的模型类型。


    ## 示例介绍


    在本节剩余内容中，我们将通过 3 个真实世界机器学习任务案例，展示机器学习如何解决实际问题。


    `*` **监督学习**


    `*` 利用机器学习预测住宅价格，依据小区用地面积和卧室数量。


    `*` **无监督学习**


    `*` 利用机器学习通过书籍封面描述中的词汇识别书籍的微类别。


    `*` **深度神经网络**


    虽然此类任务超出本节范围，但我们希望展示现代机器学习的强大与灵活。你将看到它如何用于分析监控摄像头原始视频中的实验室影像，以检测化学泄漏。


    ## 示例一：房价预测


    房价预测是机器学习入门中最常用的例子。


    传统上，房地产评估师会使用可量化的房屋细节（如房间数、用地面积、建造年份）来估算房屋价值。


    你发现这种关联，认为可以使用机器学习预测房价。


    ![Image](img/image21.png)


    ### 步骤一：定义问题


    我们能否根据用地面积或卧室数量估算房屋价格？


    你可以获取最近已售房屋的成交价，或委托评估师评估未知售价的房屋。由于你拥有这些数据，这属于监督学习任务。目标是预测连续数值，因此这也是回归任务。


    ![Image](img/image22.png)


    ### 步骤二：构建数据集


    *   **数据收集**：你在过去一年内收集本地区已售房屋的大量样本，并请评估师对未知售价的房屋进行评估。


    *   **数据探索**：确认所有数据均为数值，因为大多数机器学习模型基于数字序列工作。若存在文本数据，需将其转换为数值。后续示例将展示此过程。


    *   **数据清洗**：查找缺失值或异常值（如 10 间卧室的豪宅）。虽有多种处理异常值的方法，但也可直接从数据集中移除这些条目。


    | 房间数 | 用地面积 (ft²) | 房屋价值 ($) |

    | --- | --- | --- |

    | 4 | 10,454 | 339,900 |

    | 3 | 9,147 | 239,000 |

    | 3 | 10,890 | 250,000 |

    | 10 | 25,877 | 877,000 |


    数据清洗：移除异常值


    *   **数据可视化**：绘制房价与各输入变量的关系图，观察趋势。下图显示用地面积越大，房价越高。


    ![Image](img/image23.png)


    ### 步骤三：模型训练


    在实际训练前，需将数据划分。标准做法是将 80% 纳入训练集，20% 纳入测试集。


    线性模型选择


    从前图可知，用地面积越大，房价越高，关系简单，可用线性模型拟合。


    单变量线性模型可表示为直线，两变量时为平面，三个以上变量时为高维面。其核心直线斜率恒定的直观不变。


    使用 Python 库


    Python 的 scikit-learn 库提供了模型训练算法的实现工具。


    ### 步骤四：评估


    回归场景中常用的评估指标是根均方误差（RMS）。其数学原理超出本节范围，但可粗略理解为测试集中预测值与真实值的“平均误差”，因此数值越低越好。


    ![Image](img/image24.png)


    下图展示了数据点相对于蓝色拟合线的分布。理想情况下，数据点应尽可能接近“平均”拟合线，以减少总体误差。


    你会计算模型在测试集中对每个数据点的预测值与真实值之间的根均方误差。此计算细节超出本节范围，但需理解整体流程。


    ![Image](img/image25.png)


    ### 结果解读


    模型越优，RMS 结果越好。但你可能仍不确定计算出的具体数值是否良好。


    许多机器学习工程师会手动统计预测偏差超过阈值（如 $50,000）的次数，以验证模型准确性。


    ### 步骤五：推理：使用模型


    现在你已准备好让模型投入使用。下图展示了使用新数据（训练时未见）预测效果的过程。


    ![Image](img/image26.png)


    ### 术语


    *   **连续**：浮点数，取无限可能值范围。与有限可能值的离散/类别值相对。


    *   **高维面**：数学术语，指包含多个平面的表面。


    *   **平面**：数学术语，指像纸张一样的平坦表面（如可由两点连成直线的平面）。


    *   回归：监督机器学习中的常见任务。


    ### 进一步阅读


    Machine Learning Mastery 博客是学习机器学习的极佳资源。以下博客文章深入探讨了回归模型的训练方法。


    `*` 如何在 Python 中开发 Ridge 回归模型，为本节示例提供了另一种解决方案。


    `*` 回归是流行的机器学习任务，可使用多种评估指标进行评估。


    ## 示例二：书籍类别探索


    在本视频中，你了解到如何将机器学习流程应用于无监督学习任务——通过书籍描述文本识别不同微类别。


    ### 步骤一：定义问题


    ![Image](img/image27.png)


    基于书籍描述中常见词汇的存在，找出相似书籍的聚类。


    '
