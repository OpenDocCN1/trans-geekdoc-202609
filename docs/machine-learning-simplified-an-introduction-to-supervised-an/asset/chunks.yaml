    # Different between machine learning and traditional programming-based approaches


    ![Image](images/image4.png)


    In traditional problem-solving with software, a person analyzes a problem and
    engineers a solution in code to solve that problem. For many real-world problems,
    this process can be laborious (or even impossible) because a correct solution
    would need to consider a vast number of edge cases.


    Imagine, for example, the challenging task of writing a program that can detect
    if a cat is present in an image. Solving this in the traditional way would require
    careful attention to details like varying lighting conditions, different types
    of cats, and various poses a cat might be in.


    In machine learning, the problem solver abstracts away part of their solution
    as a flexible component called a model, and uses a special program called a model
    training algorithm to adjust that model to real-world data. The result is a trained
    model which can be used to predict outcomes that are not part of the data set
    used to train it.


    In a way, machine learning automates some of the statistical reasoning and pattern-matching
    the problem solver would traditionally do.


    The overall goal is to use a model created by a model training algorithm to generate
    predictions or find patterns in data that can be used to solve a problem.


    ## Understanding Terminology


    ![Image](images/image5.png)


    Machine learning is a new field created at the intersection of statistics, applied
    math, and computer science. Because of the rapid and recent growth of machine
    learning, each of these fields might use slightly different formal definitions
    of the same terms.


    ### Terminology


    Machine learning, or ML, is a modern software development technique that enables
    computers to solve problems by using examples of real-world data.


    In supervised learning, every training sample from the dataset has a corresponding
    label or output value associated with it. As a result, the algorithm learns to
    predict labels or output values.


    In reinforcement learning, the algorithm figures out which actions to take in
    a situation to maximize a reward (in the form of a number) on the way to reaching
    a specific goal.


    In unsupervised learning, there are no labels for the training data. A machine
    learning algorithm tries to learn the underlying patterns or distributions that
    govern the data.


    ## Components of Machine Learning


    ### Models


    In machine learning, all tasks are resolved with three primary components, namely:


    *   A machine learning model


    *   A model training algorithm


    *   A model inference algorithm


    ## Clay Analogy for Machine Learning


    You can understand the relationships between these components by imagining the
    stages of crafting a teapot from a lump of clay.


