    Create a Tensorflow Dataset


    Much like there are different libraries to help with cleaning and formatting data,
    there are also different frameworks. Some frameworks are better suited for particular
    kinds of machine learning workloads and for this deep learning use case, we’re
    going to use a Tensorflow framework with a Keras library.


    We''ll use the dataset object to feed batches of data into our model.


    *   Run the first `Load Data` cell to set parameters.


    *   Run the second `Load Data` cell to prepare the data.


    Build a Custom GAN Model (Optional): Part 2


    To create the custom GAN, you will need to use an instance type that is not covered
    in the Amazon SageMaker free tier. You may incur a cost if you want to build a
    custom GAN.


    You can learn more about SageMaker costs in the Amazon SageMaker pricing documentation.


    **Important**: This is an optional exercise. You will not need to complete this
    exercise in order to graduate from the foundation''s course. If you are unable
    to create an AWS account, please move to the next module.


    Model Architecture


    Before we can train our model, let’s take a closer look at model architecture
    including how GAN networks interact with the batches of data we feed into the
    model, and how the networks communicate with each other.


    How the Model Works


    The model consists of two networks, a generator and a discriminator (critic).
    These two networks work in a tight loop:


    *   The `generator` takes in a batch of single-track piano rolls (melody) as the
    input and generates a batch of multi-track piano rolls as the output by adding
    accompaniments to each of the input music tracks.


    *   The `discriminator` evaluates the generated music tracks and predicts how
    far they deviate from the real data in the training dataset.


    *   The feedback from the discriminator is used by the generator to help it produce
    more realistic music the next time.


    *   As the generator gets better at creating better music and fooling the discriminator,
    the discriminator needs to be retrained by using music tracks just generated by
    the generator as fake inputs and an equivalent number of songs from the original
    dataset as the real input.


    *   We alternate between training these two networks until the model converges
    and produces realistic music.


    The discriminator is a binary classifier which means that it classifies inputs
    into two groups, e.g. “real” or “fake” data.


