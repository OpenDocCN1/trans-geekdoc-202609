- raw: "*   In AWS DeepRacer’s case, each state is an image captured by its camera.\n\
    \n*   The car’s initial state is the starting line of the track and its terminal\
    \ state is when the car finishes a lap, bumps into an obstacle, or drives off\
    \ the track.\n\nAction\n\n*   For every state, an agent needs to take an action\
    \ toward achieving its goal.\n\n*   An AWS DeepRacer car approaching a turn can\
    \ choose to accelerate or brake and turn left, right, or go straight.\n\nReward\n\
    \n*   Feedback is given to an agent for each action it takes in a given state.\n\
    \n*   This feedback is a numerical reward.\n\n*   A reward function is an incentive\
    \ plan that assigns scores as rewards to different zones on the track.\n\nEpisode\n\
    \n*   An episode represents a period of trial and error when an agent makes decisions\
    \ and gets feedback from its environment.\n\n*   For AWS DeepRacer, an episode\
    \ begins at the initial state, when the car leaves the starting position, and\
    \ ends at the terminal state, when it finishes a lap, bumps into an obstacle,\
    \ or drives off the track.\n\nIn a reinforcement learning model, an agent learns\
    \ in an interactive real-time environment by trial and error using feedback from\
    \ its own actions. Feedback is given in the form of rewards.\n\n![Image](images/image42.png)\n\
    \nIn a reinforcement learning model, an agent learns in an interactive real-time\
    \ environment by trial and error using feedback from its own actions. Feedback\
    \ is given in the form of rewards.\n\n## Putting Your Spin on AWS DeepRacer: \n\
    \n### The Practitioner's Role in RL\n\nAWS DeepRacer may be autonomous, but you\
    \ still have an important role to play in the success of your model. In this section,\
    \ we introduce the training algorithm, action space, hyperparameters, and reward\
    \ function and discuss how your ideas make a difference.\n\n*   *An algorithm*\
    \ is a set of instructions that tells a computer what to do. ML is special because\
    \ it enables computers to learn without being explicitly programmed to do so.\n\
    \n*   *The training algorithm* defines your model’s learning objective, which\
    \ is to maximize total cumulative reward. Different algorithms have different\
    \ strategies for going about this.\n\n*   A soft actor critic (SAC) embraces exploration\
    \ and is data-efficient, but can lack stability.\n\n*   A proximal policy optimization\
    \ (PPO) is stable but data-hungry.\n\n*   An action space is the set of all valid\
    \ actions, or choices, available to an agent as it interacts with an environment.\n\
    \nDiscrete action space represents all of an agent's possible actions for each\
    \ state in a finite set of steering angle and throttle value combinations.\n\n\
    Continuous action space allows the agent to select an action from a range of values\
    \ that you define for each sta te.\n\n*   Hyperparameters are variables that control\
    \ the performance of your agent during training. There is a variety of different\
    \ categories with which to experiment. Change the values to increase or decrease\
    \ the influence of different parts of your model.\n\n*   For example, the learning\
    \ rate is a hyperparameter that controls how many new experiences are counted\
    \ in learning at each step. A higher learning rate results in faster training\
    \ but may reduce the model’s quality.\n\n*   The reward function's purpose is\
    \ to encourage the agent to reach its goal. Figuring out how to reward which actions\
    \ is one of your most important jobs.\n\nPutting Reinforcement Learning into Action\
    \ with AWS DeepRacer\n\nThis video put the concepts we've learned into action\
    \ by imagining the reward function as a grid mapped over the race track in AWS\
    \ DeepRacer’s training environment, and visualizing it as metrics plotted on a\
    \ graph. It also introduced the trade-off between exploration and exploitation,\
    \ an important challenge unique to this type of machine learning.\n\n![Image](images/image43.png)\n\
    \nEach square is a state. The green square is the starting position, or initial\
    \ state, and the finish line is the goal, or terminal state.\n\nKey points to\
    \ remember about **reward functions**:\n\n*   Each state on the grid is assigned\
    \ a score by your reward function. You incentivize behavior that supports your\
    \ car’s goal of completing fast laps by giving the highest numbers to the parts\
    \ of the track on which you want it to drive.\n\n*   The reward function is the\
    \ actual code you'll write to help your agent determine if the action it just\
    \ took was good or bad, and how good or bad it was.\n\n![Image](images/image44.png)\n\
    \nThe squares containing exes are the track edges and defined as terminal states,\
    \ which tell your car it has gone off track.\n\nKey points to remember about **exploration\
    \ versus exploitation:**\n\n*   When a car first starts out, it explores by wandering\
    \ in random directions. However, the more training an agent gets, the more it\
    \ learns about an environment. This experience helps it become more confident\
    \ about the actions it chooses.\n\n*   Exploitation means the car begins to exploit\
    \ or use information from previous experiences to help it reach its goal. Different\
    \ training algorithms utilize exploration and exploitation differently.\n\nKey\
    \ points to remember about the **reward graph**:\n\n*   While training your car\
    \ in the AWS DeepRacer console, your training metrics are displayed on a reward\
    \ graph.\n\n*   Plotting the total reward from each episode allows you to see\
    \ how the model performs over time. The more reward your car gets, the better\
    \ your model performs.\n\nKey points to remember about **AWS DeepRacer**:\n\n\
    *   AWS DeepRacer is a combination of a physical car and a virtual simulator in\
    \ the AWS Console, the AWS DeepRacer League, and community races.\n\n*   An AWS\
    \ DeepRacer device is not required to start learning: you can start now in the\
    \ AWS console. The 3D simulator in the AWS console is where training and evaluation\
    \ take place.\n\nNew Terms\n\n*   Exploration versus exploitation: An agent should\
    \ exploit known information from previous experiences to achieve higher cumulative\
    \ rewards, but it also needs to explore to gain new experiences that can be used\
    \ in choosing the best actions in the future.\n\nAdditional Reading\n\n*   If\
    \ you are interested in more tips, workshops, classes, and other resources for\
    \ improving your model, you'll find a wealth of resources on the AWS DeepRacer\
    \ Pit Stop page.\n\n*   For detailed step-by-step instructions and troubleshooting\
    \ support, see the AWS DeepRacer Developer Documentation.\n\n*   If you're interested\
    \ in reading more posts on a range of DeepRacer topics as well as staying up to\
    \ date on the newest releases, check out the AWS Discussion Forums.\n\n*   If\
    \ you're interested in connecting with a thriving global community of reinforcement\
    \ learning racing enthusiasts, join the AWS DeepRacer Slack community.\n\n*  \
    \ If you're interested in tinkering with DeepRacer's open-source device software\
    \ and collaborating with robotics innovators, check out our AWS DeepRacer GitHub\
    \ Organization.\n\nExercise: Interpret the reward graph of your first AWS DeepRacer\
    \ model\n\nInstructions\n\nTrain a model in the AWS DeepRacer console and interpret\
    \ its reward graph.\n\nPart 1: Train a reinforcement learning model using the\
    \ AWS DeepRacer console\n\nPractice the knowledge you've learned by training your\
    \ first reinforcement learning model using the AWS DeepRacer console.\n\n*   If\
    \ this is your first time using AWS DeepRacer, choose **Get started** from the\
    \ service landing page, or choose Get started with reinforcement learning from\
    \ the main navigation pane.\n\n*   On the **Get started with reinforcement learning**\
    \ page, under Step 2: Create a model and race, choose Create model. Alternatively,\
    \ on the AWS DeepRacer home page, choose Your models from the main navigation\
    \ pane to open the Your models page. On the Your models page, choose Create model."
