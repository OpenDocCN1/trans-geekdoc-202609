    # 机器学习与基于传统编程的方法的区别


    ![Image](img/image4.png)


    在传统的软件问题解决中，人分析问题并编写代码以解决该问题。对于许多现实问题，这一过程可能费时费力（甚至是不可能的），因为正确的解决方案需要考虑大量的边界情况。


    想象一下，挑战性的任务是编写一个程序来检测图像中是否存在猫。传统方式下，需要仔细关注诸如光照条件变化、不同种类的猫以及猫可能处于的各种姿态等细节。


    在机器学习中，问题解决者将解决方案的一部分抽象为一个灵活的组件，称为模型，并使用一种特殊的程序——模型训练算法，对该模型在真实数据上的进行调整。结果是一个经过训练的模型，可以用于预测训练数据集中未包含的结果。


    在某种程度上，机器学习自动化了传统问题解决者所做的统计推理和模式匹配。


    总体目标是使用由模型训练算法创建的模型，生成预测或在数据中发现模式，以解决问题。


    ## 术语理解


    ![Image](img/image5.png)


    机器学习是统计学、应用数学和计算机科学交叉领域的一个新兴领域。由于机器学习的快速且近期的增长，这三个领域可能对同一术语有略有不同的正式定义。


    ### 术语


    机器学习（ML）是一种现代软件开发技术，它使计算机能够通过使用现实数据的示例来解决问题。


    在监督学习中，数据集中的每个训练样本都与一个标签或输出值相关联。因此，算法学会了预测标签或输出值。


    在增强学习中，算法通过在达到特定目标的过程中最大化奖励（以数字形式）来确定在特定情境下应采取哪些行动。


    在无监督学习中，训练数据没有标签。机器学习算法尝试学习数据背后的模式或分布。


    ## 机器学习的组成部分


    ### 模型


    在机器学习中，所有任务都通过三个主要组件来解决：


    *   一个机器学习模型


    *   一个模型训练算法


    *   一个模型推理算法


    ## 陶土比喻（用于理解机器学习）


    你可以通过想象制作陶土茶壶的过程来理解这些组件之间的关系。


    *   首先，你从一块生块陶土开始。此时，陶土可以被塑造成许多不同的形状，用于多种不同的目的。你决定用这块陶土做一个茶壶。


    *   那么，你如何制作这个茶壶呢？你检查并分析原始陶土，决定如何改变它以使其更像你心中的茶壶。


    *   接下来，你将陶土塑形，使其更像目标茶壶。


    恭喜！你完成了茶壶。你检查了材料，评估了如何改变它们以达到目标，并进行了改变，茶壶现在可以供你享用。


    ## 什么是机器学习模型？


    机器学习模型就像一块陶土，可以被塑造成许多不同的形状并服务于多种不同的目的。更技术性的定义是，机器学习模型是一段代码或框架，可以根据提供的数据进行修改，从而解决不同但相关的问题。


    ### 重要提示


    模型是一个极其通用的程序（或代码块），它通过用于训练它的数据变得具体化。它用于解决不同的问题。


    ### 示例 1


    想象你拥有一辆雪糕车，你有一些数据，显示每天平均售出的雪糕数量与当天的高温之间的关系。你想更好地理解这种关系，以便在高销售额的日子里保持足够的库存。


    ![Image](img/image6.png)


    如上图所示，你可以看到一个模型的例子，即线性回归模型（由实线表示）。可以看出，基于提供的数据，该模型预测高温越高，每天平均售出的雪糕数量也越多。太棒了！


    ### 示例 2


    让我们看一个使用相同线性回归模型但数据不同、问题完全不同的例子。


    想象你在高等教育领域工作，想更好地理解学费成本与大学生人数之间的关系。在这个例子中，我们的模型预测，随着学费成本的增加，参加大学的人数可能会减少。


    ![Image](img/image7.png)


    利用相同的线性回归模型（由实线表示），你可以看到，随着成本增加，参加大学的人数确实会下降。


    这两个例子都表明，模型是一个通用的程序，它通过用于训练它的数据变得具体化。


    ## 模型训练


    模型训练算法如何用于训练模型？


    在前面的章节中，我们讨论了两个关键信息：模型和数据。本章节展示了这两个要素如何用于创建经过训练的模型。这个过程称为*模型训练*。


    模型训练算法通过交互过程工作


    让我们重新回到陶土茶壶的比喻。我们已经得到一块陶土，现在想做一个茶壶。让我们看看塑造陶土的算法，以及它与机器学习算法的相似之处：


    *   **思考需要做出的改变**。第一步是检查原始陶土，思考可以做出哪些改变使其更像茶壶。同样，模型训练算法使用模型处理数据，然后将结果与某个目标（比如我们的陶土茶壶）进行比较。


    *   **做出这些改变**。现在，你将陶土塑形，使其更像茶壶。同样，模型训练算法会轻轻调整模型的特定部分，使其更接近实现目标。


    *   **重复**。通过反复进行这些步骤，你会越来越接近想要的结果，直到你确定已经足够接近，可以停止。


    ![Image](img/image8.png)


    ### 模型推理：使用你的训练模型


    现在，你的茶壶已经做好准备。你检查了陶土，评估了需要做出的改变，并进行了改变，茶壶现在可以供你使用。享受你的茶！


    *从机器学习的角度来看*，我们现在准备使用模型推理算法，利用已训练的模型生成预测。这个过程通常被称为**模型推理**。


    ![Image](img/image9.png)


    ## 测验


    以下哪项是机器学习中使用的主要组件？（选择多个框）


    1.  一个模型完整性算法


    2.  一个机器学习模型


    3.  一个模型训练算法


    4.  一个准备算法


    5.  一个模型推理算法


    回想陶土茶壶的比喻。以下说法是否正确：当你处理原始陶土块时，你总是需要有想做什么的想法？


    1.  真


    2.  假


    Ans: B

    '
