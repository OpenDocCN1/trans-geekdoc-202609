- raw: 'To complete the exercises in this course, you need an **AWS Account ID**.


    However, you are not required to complete the exercises in this lesson in order
    to graduate from the foundations course. The exercises included in this lesson
    are **OPTIONAL ONLY**, so if you cannot create an AWS account, please simply read
    the exercise modules to understand how these tools are meant to work.


    To set up a new AWS Account ID, follow the directions in How do I create and activate
    a new Amazon Web Services account?


    You are required to provide a payment method when you create the account. To learn
    about which services are available at no cost, see the AWS Free Tier documentation.


    Will these exercises cost anything?


    This lesson contains many demos and exercises. You **do not** need to purchase
    any AWS devices to complete the lesson. However, please carefully read the following
    list of AWS services you may need in order to follow the demos and complete the
    exercises.


    Train your reinforcement learning model with AWS DeepRacer


    *   To get started with AWS DeepRacer, you receive **10 free hours** to train
    or evaluate models and **5GB of free storage** during your first month. This is
    enough to train your first time-trial model, evaluate it, tune it, and then enter
    it into the AWS DeepRacer League. **This offer is valid for 30 days after you
    have used the service for the first time.**


    *   Beyond 10 hours of training and evaluation, you pay for training, evaluating,
    and storing your machine learning models. Charges are based on the amount of time
    you train and evaluate a new model and the size of the model stored. To learn
    more about AWS DeepRacer pricing, see the AWS DeepRacer Pricing


    Generate music using AWS DeepComposer


    *   To get started, **AWS DeepComposer** provides a 12-month Free Tier for first-time
    users. With the Free Tier, you can perform up to 500 inference jobs translating
    to 500 pieces of music using the **AWS** **DeepComposer** Music studio. You can
    use one of these instances to complete the exercise at no cost. To learn more
    about **AWS DeepComposer** costs, see the **AWS DeepComposer** Pricing.


    Build a custom generative AI model (GAN) using Amazon SageMaker (optional)


    *   Amazon SageMaker is a separate service and has its own service pricing and
    billing tier. To train the custom generative AI model, the instructor uses an
    instance type that is not covered in the Amazon SageMaker free tier. If you want
    to code along with the instructor and train your own custom model, you may incur
    a cost. Please note, that creating your own custom model is completely optional.
    You are not required to do this exercise to complete the course. To learn more
    about SageMaker costs, see the Amazon SageMaker Pricing.


    Please confirm that you have taken the necessary steps to complete this lesson.


    *   I have an AWS account ID


    *   I understand that to finish this course, I do not need to purchase AWS DeepRacer
    or AWS DeepComposer devices.


    *   I understand that for 30 days after I first use AWS DeepRacer, I have 10 free
    hours of model training and evaluation to finish the demo and exercise in the
    AWS DeepRacer section.


    *   I understand that the AWS Free Tier provides me with **500 AWS DeepComposer
    inferences jobs** (500 pieces of music) at no cost.


    *   I understand that the “Build a custom GAN” demo is optional and I can watch
    the demo rather that completing it on my own, as I may incur a charge for completing
    the exercise.


    *   I understand that I may liable for any charge incurred on my AWS account.


    ### Reinforcement Learning and Its Applications


    This section introduces you to a type of machine learning (ML) called reinforcement
    learning (RL). You''ll hear about its real-world applications and learn basic
    concepts using AWS DeepRacer as an example. By the end of the section, you will
    be able to create, train, and evaluate a reinforcement learning model in the AWS
    DeepRacer console.


    In reinforcement learning (RL), an agent is trained to achieve a goal based on
    the feedback it receives as it interacts with an environment. It collects a number
    as a reward for each action it takes. Actions that help the agent achieve its
    goal are incentivized with higher numbers. Unhelpful actions result in a low reward
    or no reward.


    With a learning objective of maximizing total cumulative reward, over time, the
    agent learns, through trial and error, to map gainful actions to situations. The
    better trained the agent, the more efficiently it chooses actions that accomplish
    its goal.


    Reinforcement Learning Applications


    Reinforcement learning is used in a variety of fields to solve real-world problems.
    It’s particularly useful for addressing sequential problems with long-term goals.
    Let’s take a look at some examples.


    *   RL is great at **playing games**:


    *   Go (board game) was mastered by the AlphaGo Zero software.


    *   Atari classic video games are commonly used as a learning tool for creating
    and testing RL software.


    *   StarCraft II, the real-time strategy video game, was mastered by the AlphaStar
    software.


    *   RL is used in **video game level design**:


    *   Video game level design determines how complex each stage of a game is and
    directly affects how boring, frustrating, or fun it is to play that game.


    *   Video game companies create an agent that plays the game over and over again
    to collect data that can be visualized on graphs.


    *   This visual data gives designers a quick way to assess how easy or difficult
    it is for a player to make progress, which enables them to find that “just right”
    balance between boredom and frustration faster.


    *   RL is used in **wind energy optimization**:


    *   RL models can also be used to power robotics in physical devices.


    *   When multiple turbines work together in a wind farm, the turbines in the front,
    which receive the wind first, can cause poor wind conditions for the turbines
    behind them. This is called wake turbulence and it reduces the amount of energy
    that is captured and converted into electrical power.


    *   Wind energy organizations around the world use reinforcement learning to test
    solutions. Their models respond to changing wind conditions by changing the angle
    of the turbine blades. When the upstream turbines slow down it helps the downstream
    turbines capture more energy.


    *   Other examples of real-world RL include:


    *   **Industrial robotics**


    *   **Fraud detection**


    *   **Stock trading**


    *   **Autonomous driving**


    ![Image](images/image40.png)


    New Terms


    *   **Agent**: The piece of software you are training is called an agent. It makes
    decisions in an environment to reach a goal.


    *   **Environment**: The environment is the surrounding area with which the agent
    interacts.


    *   **Reward**: Feedback is given to an agent for each action it takes in a given
    state. This feedback is a numerical reward.


    *   **Action**: For every state, an agent needs to take an action toward achieving
    its goal.


    ## Reinforcement Learning with AWS DeepRacer


    Reinforcement Learning Concepts


    In this section, we’ll learn some basic reinforcement learning terms and concepts
    using **AWS DeepRacer** as an example.


    This section introduces six basic reinforcement learning terms and provides an
    example for each in the context of AWS DeepRacer.


    ![Image](images/image41.png)


    Basic RL terms: Agent, environment, state, action, reward, and episode


    Agent


    *   The piece of software you are training is called an agent.


    *   It makes decisions in an environment to reach a goal.


    *   In AWS DeepRacer, the agent is the AWS DeepRacer car and its goal is to finish
    \* laps around the track as fast as it can while, in some cases, avoiding obstacles.


    Environment


    *   The environment is the surrounding area within which our agent interacts.


    *   For AWS DeepRacer, this is a track in our simulator or in real life.


    State


    *   The state is defined by the current position within the environment that is
    visible, or known, to an agent.'
