    本节介绍一种叫强化学习（RL）的机器学习类型。你会了解其实际应用，并通过 AWS DeepRacer 示例学习基本概念。本节结束时，你将能够在 AWS DeepRacer
    控制台创建、训练和评估强化学习模型。


    在强化学习（RL）中，代理（agent）通过与环境交互，根据收到的反馈来训练达成目标。它为每个采取的动作获得一个数值奖励。有助于代理达成目标的动作会获得更高的奖励，无帮助的动作则获得低奖励或无奖励。


    以最大化总累计奖励为学习目标，随着时间的推移，代理通过试错学会在不同情境下映射有价值的动作。训练得更好的代理能更高效地选择能实现目标的动作。


    ### 强化学习应用


    强化学习在多个领域用于解决实际问题，特别适用于具有长期目标的顺序性问题。以下是一些示例。


    *   RL  excels at **playing games**:


    *   Go (board game) was mastered by the AlphaGo Zero software.


    *   Atari classic video games are commonly used as a learning tool for creating
    and testing RL software.


    *   StarCraft II, the real-time strategy video game, was mastered by the AlphaStar
    software.


    *   RL is used in **video game level design**:


    *   Video game level design determines how complex each stage of a game is and
    directly affects how boring, frustrating, or fun it is to play that game.


    *   Video game companies create an agent that plays the game over and over again
    to collect data that can be visualized on graphs.


    *   This visual data gives designers a quick way to assess how easy or difficult
    it is for a player to make progress, which enables them to find that “just right”
    balance between boredom and frustration faster.


    *   RL is used in **wind energy optimization**:


    *   RL models can also be used to power robotics in physical devices.


    *   When multiple turbines work together in a wind farm, the turbines in the front,
    which receive the wind first, can cause poor wind conditions for the turbines
    behind them. This is called wake turbulence and it reduces the amount of energy
    that is captured and converted into electrical power.


    *   Wind energy organizations around the world use reinforcement learning to test
    solutions. Their models respond to changing wind conditions by changing the angle
    of the turbine blades. When the upstream turbines slow down it helps the downstream
    turbines capture more energy.


    *   Other examples of real-world RL include:


    *   **Industrial robotics**


    *   **Fraud detection**


    *   **Stock trading**


    *   **Autonomous driving**


    ![Image](img/image40.png)


    ### 新术语


    *   **Agent**: 你正在训练的软件称为 agent。它在环境中做出决策以达成目标。


    *   **Environment**: 环境是代理交互的周围区域。


    *   **Reward**: 代理在给定状态下每个动作的反馈是数值奖励。


    *   **Action**: 对于每个状态，agent 需要采取动作以实现目标。


    ## 强化学习与 AWS DeepRacer


    ### 强化学习概念


    本节将使用 **AWS DeepRacer** 为例，学习一些基础强化学习术语和概念。


    本节介绍六个基础强化学习术语，并为每个术语在 AWS DeepRacer 语境中提供示例。


    ![Image](img/image41.png)


    ### 基础 RL 术语：Agent、environment、state、action、reward、episode


    #### Agent


    *   你正在训练的软件称为 agent。


    *   它在环境中做出决策以达成目标。


    *   在 AWS DeepRacer 中，agent 是 AWS DeepRacer 小车，其目标是在尽可能快地完成 * laps（圈数）的同时，在某些情况下避免障碍。


    #### Environment


    *   环境是代理交互的周围区域。


    *   对于 AWS DeepRacer，这是模拟器中的赛道或真实世界中的赛道。


    #### State


    *   状态是代理当前在环境中可见或已知的位置。


    '
