    ## 机器学习五个步骤的入门


    机器学习过程的主要步骤


    在前面的图中，你可以看到机器学习过程的主要步骤概览。无论使用什么具体模型或训练算法，机器学习实践者都会遵循相同的工作流程来完成机器学习任务。


    这些步骤是迭代的。在实践中，这意味着在流程的每一步，你都会检查流程进展情况。事情是否按预期进行？如果不，就返回并重新审视当前步骤或之前的步骤，尝试找出问题所在。


    ![Image](img/image10.png)


    本书其余部分围绕这五个重要步骤展开。请再次检查它们，然后准备好深入每一个步骤。


    *   第一步：定义问题


    *   第二步：构建数据集


    *   第三步：训练模型


    *   第四步：评估模型


    *   第五步：推理（使用模型）


    ## 第一步：定义问题。


    如何开始机器学习任务？


    *   定义一个非常具体的任务。


    *   回想一下雪茄销售的例子。现在想象你拥有一家冰淇淋店，销售雪茄糖果以及许多其他产品。你想问自己：“如何增加销售？”这是一个合理的问题，但它是**相反**于一个非常具体的任务。下面的例子展示了机器学习实践者可能如何尝试回答这个问题。


    *   “在热布丁布丁上加$1.00 的撒糖费用，是否会增加热布丁布丁的销售？”


    *   “在雪茄糖果上加$0.50 的有机口味费用，是否会增加雪茄糖果的销售？”


    *   识别我们可能用来解决这个问题的机器学习任务。


    *   这将帮助你更好地理解项目所需的数据。


    什么是机器学习任务？


    所有模型训练算法以及模型本身都以数据作为输入。它们的输出可能截然不同，并根据其设计的任务分为几个类别。通常，我们使用用于训练模型的数据类型作为定义机器学习任务的一部分。


    在本课程中，我们将关注两种常见的机器学习任务：


    *   监督学习


    *   无监督学习


    ## 监督学习与无监督学习


    数据是否包含标签，常用于识别机器学习任务。


    ![Image](img/image11.png)


    监督任务


    如果你使用的是已标记的数据，则该任务为监督任务。我们使用“标记”一词指代已经包含解决方案的数据，称为标签。


    例如*：根据温度预测售出的雪茄糖果数量是监督学习的一个例子。*


    ![Image](img/image12.png)


    在前面的图中，数据包含温度和售出的雪茄糖果数量。这两个部分都用于生成图中的线性回归。我们的目标是预测售出的雪茄糖果数量，并将该值输入模型。我们提供给模型已标记的数据，因此我们正在进行监督机器学习任务。


    无监督任务


    如果你使用的是未标记的数据，则该任务被视为无监督任务。这意味着在训练模型时，你不需要向模型提供任何标签或解决方案。


    让我们来看看未标记的数据。


    ![Image](img/image13.png)


    *   仔细观察前面的图片。你注意到图中的树了吗？你只是注意到图中物体并将其识别为树，这叫做对图片进行标记。与你不同，计算机仅将图像视为像素强度矩阵。


    *   由于这张图片的原始数据中没有标记，因此它被视为未标记数据。


    当我们没有标签时，如何分类任务？


    无监督学习使用没有标签的数据。常见的任务包括聚类。聚类有助于确定数据中是否存在自然出现的分组。


    让我们看看无标记数据中的聚类如何工作。


    识别书籍微类别与无监督学习


    想象你为一家推荐书籍的公司工作。


    假设：你非常有信心微类别存在，并且有一个名为“青少年吸血鬼浪漫”微类别。由于你不知道微类别有哪些，就无法使用**监督学习**技术。


    这就是无监督学习中的聚类技术可能检测到数据中某些分组的地方。书籍描述中的词汇和短语可能为书籍的微类别提供指导。


    ![Image](img/image14.png)


    我们最初根据训练模型时是否存在标记数据来划分任务。通常，任务会进一步通过标签的类型来定义。


    在**监督学习**中，有两种主要标识你会看到：


    *   **类别标签**包含离散的可能值集合。例如，在机器学习问题中，你希望根据图片识别花的类型，你会使用已标记为你想识别的花类别的图片进行训练。此外，当你使用类别标签时，通常会进行分类任务，这是监督学习的一个子集。


    *   **连续（回归）标签**不包含离散的可能值集合，通常意味着你处理的是数值数据。在雪茄糖果销售的例子中，我们试图预测售出的雪茄糖果数量。我们的标签是一个数值，理论上可以是任何值。


    在无监督学习中，聚类只是一个例子。还有其他选项，例如深度学习。


    ## 测验


    将任务与对应的数据类型匹配


    1.  监督学习


    2.  无监督学习


    | 数据使用 || 机器学习任务 |


    | --- | --- |


    | 已标记数据 ||   |


    | 未标记数据 ||   |


    ## 术语


    *   **聚类**。一种无监督学习任务，帮助确定数据中是否存在自然出现的分组。


    *   **类别标签**包含离散的可能值集合，例如“是猫”和“不是猫”。


    *   **连续（回归）标签**不包含离散的可能值集合，这意味着可能有无限多的可能性。


    *   **离散**：统计学中指结果只能取有限数个值的术语（例如，星期几）。


    *   **标签**指包含解决方案的数据。


    *   使用**未标记**数据意味着在训练模型时，你不需要向模型提供任何标签或解决方案。


    ## 附加阅读


    *   AWS 机器学习博客是了解更多机器学习项目的绝佳资源。


    *   你可以使用 Amazon SageMaker 计算美式职业棒球的新统计数据。


    *   你还可以在 AWS 机器学习博客上找到关于使用 Amazon SageMaker 标记可疑医疗索赔的文章。


    *   机器学习适合哪些问题和问题？


    ## 测验：定义问题


    1.  哪个以下问题符合回归任务的定义？


    1.  我想通过设置摄像头并编写程序来检测我的猫何时跳上餐桌，以判断我的猫是否在画面中或不在画面中。


    2.  我想确定在线新闻文章的预计阅读时间，因此我收集了一周的阅读时间数据，并编写浏览器插件，利用这些数据预测新文章的阅读时间。

