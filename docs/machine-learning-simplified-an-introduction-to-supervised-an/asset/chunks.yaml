- raw: 'Different between machine learning and traditional programming-based approaches


    ![Image](images/image4.png)


    In traditional problem-solving with software, a person analyzes a problem and
    engineers a solution in code to solve that problem. For many real-world problems,
    this process can be laborious (or even impossible) because a correct solution
    would need to consider a vast number of edge cases.


    Imagine, for example, the challenging task of writing a program that can detect
    if a cat is present in an image. Solving this in the traditional way would require
    careful attention to details like varying lighting conditions, different types
    of cats, and various poses a cat might be in.


    In machine learning, the problem solver abstracts away part of their solution
    as a flexible component called a model, and uses a special program called a model
    training algorithm to adjust that model to real-world data. The result is a trained
    model which can be used to predict outcomes that are not part of the data set
    used to train it.


    In a way, machine learning automates some of the statistical reasoning and pattern-matching
    the problem solver would traditionally do.


    The overall goal is to use a model created by a model training algorithm to generate
    predictions or find patterns in data that can be used to solve a problem.


    Understanding Terminology


    ![Image](images/image5.png)


    Machine learning is a new field created at the intersection of statistics, applied
    math, and computer science. Because of the rapid and recent growth of machine
    learning, each of these fields might use slightly different formal definitions
    of the same terms.


    Terminology


    Machine learning, or ML, is a modern software development technique that enables
    computers to solve problems by using examples of real-world data.


    In supervised learning, every training sample from the dataset has a corresponding
    label or output value associated with it. As a result, the algorithm learns to
    predict labels or output values.


    In reinforcement learning, the algorithm figures out which actions to take in
    a situation to maximize a reward (in the form of a number) on the way to reaching
    a specific goal.


    In unsupervised learning, there are no labels for the training data. A machine
    learning algorithm tries to learn the underlying patterns or distributions that
    govern the data.


    ## Components of Machine Learning


    ### Models


    In machine learning, all tasks are resolved with three primary components, namely:


    *   A machine learning model


    *   A model training algorithm


    *   A model inference algorithm


    ## Clay Analogy for Machine Learning


    You can understand the relationships between these components by imagining the
    stages of crafting a teapot from a lump of clay.


    *   First, you start with a block of raw clay. At this stage, the clay can be
    molded into many different forms and be used to serve many different purposes.
    You decide to use this lump of clay to make a teapot.


    *   So how do you create this teapot? You inspect and analyze the raw clay and
    decide how to change it to make it look more like the teapot you have in mind.


    *   Next, you mold the clay to make it look more like the teapot that is your
    goal.


    Congratulations! You''ve completed your teapot. You''ve inspected the materials,
    evaluated how to change them to reach your goal, and made the changes, and the
    teapot is now ready for your enjoyment.


    ## What are machine learning models?


    A machine learning model, like a piece of clay, can be molded into many different
    forms and serve many different purposes. A more technical definition would be
    that a machine learning model is a block of code or framework that can be modified
    to solve different but related problems based on the data provided.


    Important


    A model is an extremely generic program (or block of code), made specific by the
    data used to train it. It is used to solve different problems.


    Example 1


    Imagine you own a snow cone cart, and you have some data about the average number
    of snow cones sold per day based on the high temperature. You want to better understand
    this relationship to make sure you have enough inventory on hand for those high
    sales days.


    ![Image](images/image6.png)


    In the graph above, you can see one example of a model, a linear regression model
    (indicated by the solid line). You can see that, based on the data provided, the
    model predicts that as the high temperate for the day increases so do the average
    number of snow cones sold. Sweet!


    Example 2


    Let''s look at a different example that uses the same linear regression model,
    but with different data and to answer completely different questions.


    Imagine that you work in higher education and you want to better understand the
    relationship between the cost of enrollment and the number of students attending
    college. In this example, our model predicts that as the cost of tuition increases
    the number of people attending college is likely to decrease.


    ![Image](images/image7.png)


    Using the same linear regression model (indicated by the solid line), you can
    see that the number of people attending college does go down as the cost increases.


    Both examples showcase that a model is a generic program made specific by the
    data used to train it.


    ## Model Training


    How are model training algorithms used to train a model?


    In the preceding section, we talked about two key pieces of information: a model
    and data. In this section, we show you how those two pieces of information are
    used to create a trained model. This process is called *model training*.


    Model training algorithms work through an interactive process


    Let''s revisit our clay teapot analogy. We''ve gotten our piece of clay, and now
    we want to make a teapot. Let''s look at the algorithm for molding clay and how
    it resembles a machine learning algorithm:


    *   **Think about the changes that need to be made**. The first thing you would
    do is inspect the raw clay and think about what changes can be made to make it
    look more like a teapot. Similarly, a model training algorithm uses the model
    to process data and then compares the results against some end goal, such as our
    clay teapot.


    *   **Make those changes**. Now, you mold the clay to make it look more like a
    teapot. Similarly, a model training algorithm gently nudges specific parts of
    the model in a direction that brings the model closer to achieving the goal.


    *   **Repeat**. By iterating over these steps over and over, you get closer and
    closer to what you want until you determine that you’re close enough that you
    can stop.


    ![Image](images/image8.png)


    Model Inference: Using Your Trained Model


    Now you have our completed teapot. You inspected the clay, evaluated the changes
    that needed to be made, and made them, and now the teapot is ready for you to
    use. Enjoy your tea!


    *So what does this mean from a machine learning perspective*? We are ready to
    use the model inference algorithm to generate predictions using the trained model.
    This process is often referred to as **model inference**.


    ![Image](images/image9.png)


    Quiz


    Which of the following are the primary components used in machine learning? (Select
    Multiple Boxes)


    1.  A model integrity algorithm


    2.  A machine learning model


    3.  A model training algorithm


    4.  A preparation algorithm


    5.  A model inference algorithm


    Think back to the clay teapot analogy. Is it true or false that you always need
    to have an idea of what your’re making when you are handling your raw block of
    clay?


    1.  True


    2.  False


    Ans: B


    Terminology


    A **model** is an extremely generic program, made specific by the data used to
    train it.


    **Model training algorithms** work through an interactive process where the current
    model iteration is analyzed to determine what changes can be made to get closer
    to the goal. Those changes are made and the iteration continues until the model
    is evaluated to meet the goals.


    **Model inference** is when the trained model is used to generate predictions.


