- raw: "The advantage of unit tests is that they are isolated from the rest of your\
    \ program, and thus, no dependencies are involved. They don't require access to\
    \ databases, APIs, or other external sources of information. However, passing\
    \ unit tests isn’t always enough to prove that our program is working successfully.\
    \ To show that all the parts of our program work with each other properly, communicating\
    \ and transferring data between them correctly, we use integration tests. In this\
    \ lesson, we'll focus on unit tests; however, when you start building larger programs,\
    \ you will want to use integration tests as well.\n\nTo learn more about integration\
    \ testing and how integration tests relate to unit tests, see Integration Testing.\
    \ That article contains other very useful links as well.\n\nUnit Testing Tools\n\
    \nTo install pytest, run pip install -U pytest in your terminal. You can see more\
    \ information on getting started here.\n\n*   Create a test file starting with\
    \ *test\\_.*\n\n*   Define unit test functions that start with *test\\_* inside\
    \ the test file.\n\n*   Enter *pytest* into your terminal in the directory of\
    \ your test file and it detects these tests for you.\n\n*test\\_* is the default;\
    \ if you wish to change this, you can learn how in this pytest configuration.\n\
    \nIn the test output, periods represent successful unit tests and Fs represent\
    \ failed unit tests. Since all you see is which test functions failed, it's wise\
    \ to have only one *assert* statement per test. Otherwise, you won't know exactly\
    \ how many tests failed or which tests failed.\n\nYour test won't be stopped by\
    \ failed assert statements, but it will stop if you have syntax errors.\n\n##\
    \ Logging\n\nLogging is valuable for understanding the events that occur while\
    \ running your program. For example, if you run your model overnight and the results\
    \ the following morning are not what you expect, log messages can help you understand\
    \ more about the context in those results occurred. Let's learn about the qualities\
    \ that make a log message effective.\n\nLog messages\n\nLogging is the process\
    \ of recording messages to describe events that have occurred while running your\
    \ software. Let's take a look at a few examples, and learn tips for writing good\
    \ log messages.\n\nTip: Be professional and clear\n\nBad: Hmmm... this isn't working???\n\
    \nBad: idk.... :(\n\nGood: Couldn't parse file.\n\nTip: Be concise and use normal\
    \ capitalization\n\nBad: Start Product Recommendation Process\n\nBad: We have\
    \ completed the steps necessary and will now proceed with the recommendation process\
    \ for the records in our product database.\n\nGood: Generating product recommendations.\n\
    \nTip: Choose the appropriate level for logging\n\nDebug: Use this level for anything\
    \ that happens in the program. Error: Use this level to record any error that\
    \ occurs. Info: Use this level to record all actions that are user driven or system\
    \ specific, such as regularly scheduled operations.\n\nTip: Provide any useful\
    \ information\n\nBad: Failed to read location data\n\nGood: Failed to read location\
    \ data: store\\_id 8324971\n\nQuestions to ask yourself when conducting a code\
    \ review\n\nFirst, let's look over some of the questions we might ask ourselves\
    \ while reviewing code. These are drawn from the concepts we've covered in these\
    \ last two lessons.\n\nIs the code clean and modular?\n\n*   Can I understand\
    \ the code easily?\n\n*   Does it use meaningful names and whitespace?\n\n*  \
    \ Is there duplicated code?\n\n*   Can I provide another layer of abstraction?\n\
    \n*   Is each function and module necessary?\n\n*   Is each function or module\
    \ too long?\n\nIs the code efficient?\n\n*   Are there loops or other steps I\
    \ can vectorize?\n\n*   Can I use better data structures to optimize any steps?\n\
    \n*   Can I shorten the number of calculations needed for any steps?\n\n*   Can\
    \ I use generators or multiprocessing to optimize any steps?\n\nIs the documentation\
    \ effective?\n\n*   Are inline comments concise and meaningful?\n\n*   Is there\
    \ complex code that's missing documentation?\n\n*   Do functions use effective\
    \ docstrings?\n\n*   Is the necessary project documentation provided?\n\nIs the\
    \ code well tested?\n\n*   Does the code high test coverage?\n\n*   Do tests check\
    \ for interesting cases?\n\n*   Are the tests readable?\n\n*   Can the tests be\
    \ made more efficient?\n\nIs the logging effective?\n\n*   Are log messages clear,\
    \ concise, and professional?\n\n*   Do they include all relevant and useful information?\n\
    \n*   Do they use the appropriate logging level?\n\nTips for conducting a code\
    \ review\n\nNow that we know what we're looking for, let's go over some tips on\
    \ how to actually write your code review. When your coworker finishes up some\
    \ code that they want to merge to the team's code base, they might send it to\
    \ you for review. You provide feedback and suggestions, and then they may make\
    \ changes and send it back to you. When you are happy with the code, you approve\
    \ it and it gets merged to the team's code base.\n\nAs you may have noticed, with\
    \ code reviews you are now dealing with people, not just computers. So it's important\
    \ to be thoughtful of their ideas and efforts. You are in a team and there will\
    \ be differences in preferences. The goal of code review isn't to make all code\
    \ follow your personal preferences, but to ensure it meets a standard of quality\
    \ for the whole team.\n\nTip: Use a code linter\n\nThis isn't really a tip for\
    \ code review, but it can save you lots of time in a code review. Using a Python\
    \ code linter like pylint can automatically check for coding standards and PEP\
    \ 8 guidelines for you. It's also a good idea to agree on a style guide as a team\
    \ to handle disagreements on code style, whether that's an existing style guide\
    \ or one you create together incrementally as a team.\n\nTip: Explain issues and\
    \ make suggestions\n\nRather than commanding people to change their code a specific\
    \ way because it's better, it will go a long way to explain to them the consequences\
    \ of the current code and suggest changes to improve it. They will be much more\
    \ receptive to your feedback if they understand your thought process and are accepting\
    \ recommendations, rather than following commands. They also may have done it\
    \ a certain way intentionally, and framing it as a suggestion promotes a constructive\
    \ discussion, rather than opposition.\n\nBAD*: Make model evaluation code its\
    \ own module - too repetitive.*\n\nBETTER*: Make the model evaluation code its\
    \ own module. This will simplify models.py to be less repetitive and focus primarily\
    \ on building models.*\n\nGOOD*: How about we consider making the model evaluation\
    \ code its own module? This would simplify models.py to only include code for\
    \ building models. Organizing these evaluations methods into separate functions\
    \ would also allow us to reuse them with different models without repeating code.*\n\
    \nTip: Keep your comments objective\n\nTry to avoid using the words \"I\" and\
    \ \"you\" in your comments. You want to avoid comments that sound personal to\
    \ bring the attention of the review to the code and not to themselves.\n\nBAD*:\
    \ I wouldn't groupby genre twice like you did here... Just compute it once and\
    \ use that for your aggregations.*\n\nBAD*: You create this groupby dataframe\
    \ twice here. Just compute it once, save it as groupby\\_genre and then use that\
    \ to get your average prices and views.*\n\nGOOD*: Can we group by genre at the\
    \ beginning of the function and then save that as a groupby object? We could then\
    \ reference that object to get the average prices and views without computing\
    \ groupby twice.*\n\nTip: Provide code examples\n\nWhen providing a code review,\
    \ you can save the author time and make it easy for them to act on your feedback\
    \ by writing out your code suggestions. This shows you are willing to spend some\
    \ extra time to review their code and help them out. It can also just be much\
    \ quicker for you to demonstrate concepts through code rather than explanations.\n\
    \nLet's say you were reviewing code that included the following lines:\n\nfirst\\\
    _names = \\[\\]\n\nlast\\_names = \\[\\]\n\nfor name in enumerate(df.name):\n\n\
    \ first, last = name.split(' ')\n\n first\\_names.append(first)"
