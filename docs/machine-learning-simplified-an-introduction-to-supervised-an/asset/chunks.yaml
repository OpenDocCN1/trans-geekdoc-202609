    \ or characteristic. Examples would be color, length, size, etc. These attributes\
    \ can take on specific values like blue, 3 inches, large, etc.\n\n*   *Method*:\
    \ An action that a class or object could take.\n\n*   *OOP*: A commonly used abbreviation\
    \ for object-oriented programming.\n\n*   *Encapsulation*: One of the fundamental\
    \ ideas behind object-oriented programming is called encapsulation: you can combine\
