- raw: "*   Since it isn't easy to write your best code while you're still trying\
    \ to just get it working, allocating time to do this is essential to producing\
    \ high-quality code. Despite the initial time and effort required, this really\
    \ pays off by speeding up your development time in the long run.\n\n*   You become\
    \ a much stronger programmer when you're constantly looking to improve your code.\
    \ The more you refactor, the easier it will be to structure and write good code\
    \ the first time.\n\nWhy Refactor?\n\n*   Reduce workload in the long run\n\n\
    *   Easier to maintain code\n\n*   Reuse more of your code\n\n*   Become a better\
    \ developer\n\n## Writing Clean Code\n\nWriting clean code: Meaningful names\n\
    \nUse meaningful names.\n\n*   *Be descriptive and imply type*: For booleans,\
    \ you can prefix with is\\_ or has\\_ to make it clear it is a condition. You\
    \ can also use parts of speech to imply types, like using verbs for functions\
    \ and nouns for variables.\n\n*   *Be consistent but clearly differentiate*: age\\\
    _list and age is easier to differentiate than ages and age.\n\n*   *Avoid abbreviations\
    \ and single letters*: You can determine when to make these exceptions based on\
    \ the audience for your code. If you work with other data scientists, certain\
    \ variables may be common knowledge. While if you work with full stack engineers,\
    \ it might be necessary to provide more descriptive names in these cases as well.\
    \ (Exceptions include counters and common math variables.)\n\n*   *Long names\
    \ aren't the same as descriptive names*: You should be descriptive, but only with\
    \ relevant information. For example, good function names describe what they do\
    \ well without including details about implementation or highly specific uses.\n\
    \nTry testing how effective your names are by asking a fellow programmer to guess\
    \ the purpose of a function or variable based on its name, without looking at\
    \ your code. Coming up with meaningful names often requires effort to get right.\n\
    \nWriting clean code: Nice whitespace\n\nUse whitespace properly.\n\n*   Organize\
    \ your code with consistent indentation: the standard is to use four spaces for\
    \ each indent. You can make this a default in your text editor.\n\n*   Separate\
    \ sections with blank lines to keep your code well organized and readable.\n\n\
    *   Try to limit your lines to around 79 characters, which is the guideline given\
    \ in the PEP 8 style guide. In many good text editors, there is a setting to display\
    \ a subtle line that indicates where the 79 character limit is.\n\nFor more guidelines,\
    \ check out the code layout section of PEP 8 in the following notes.\n\n## Writing\
    \ Modular Code\n\nFollow the tips below to write modular code.\n\n**Tip**: *DRY\
    \ (Don't Repeat Yourself)*\n\nDon't repeat yourself! Modularization allows you\
    \ to reuse parts of your code. Generalize and consolidate repeated code in functions\
    \ or loops.\n\n**Tip**: *Abstract out logic to improve readability*\n\nAbstracting\
    \ out code into a function not only makes it less repetitive, but also improves\
    \ readability with descriptive function names. Although your code can become more\
    \ readable when you abstract out logic into functions, it is possible to over-engineer\
    \ this and have way too many modules, so use your judgement.\n\n**Tip**: *Minimize\
    \ the number of entities (functions, classes, modules, etc.)*\n\nThere are trade-offs\
    \ to having function calls instead of inline logic. If you have broken up your\
    \ code into an unnecessary amount of functions and modules, you'll have to jump\
    \ around everywhere if you want to view the implementation details for something\
    \ that may be too small to be worth it. Creating more modules doesn't necessarily\
    \ result in effective modularization.\n\n**Tip**: *Functions should do one thing*\n\
    \nEach function you write should be focused on doing one thing. If a function\
    \ is doing multiple things, it becomes more difficult to generalize and reuse.\
    \ Generally, if there's an \"and\" in your function name, consider refactoring.\n\
    \n**Tip**: *Arbitrary variable names can be more effective in certain functions*\n\
    \nArbitrary variable names in general functions can actually make the code more\
    \ readable.\n\n**Tip**: *Try to use fewer than three arguments per function*\n\
    \nTry to use no more than three arguments when possible. This is not a hard rule\
    \ and there are times when it is more appropriate to use many parameters. But\
    \ in many cases, it's more effective to use fewer arguments. Remember we are modularizing\
    \ to simplify our code and make it more efficient. If your function has a lot\
    \ of parameters, you may want to rethink how you are splitting this up.\n\n##\
    \ Efficient Code\n\nKnowing how to write code that runs efficiently is another\
    \ essential skill in software development. Optimizing code to be more efficient\
    \ can mean making it:\n\n*   Execute faster\n\n*   Take up less space in memory/storage\n\
    \nThe project on which you're working determines which of these is more important\
    \ to optimize for your company or product. When you're performing lots of different\
    \ transformations on large amounts of data, this can make orders of magnitudes\
    \ of difference in performance.\n\n## Documentation\n\n*   Documentation: Additional\
    \ text or illustrated information that comes with or is embedded in the code of\
    \ software.\n\n*   Documentation is helpful for clarifying complex parts of code,\
    \ making your code easier to navigate, and quickly conveying how and why different\
    \ components of your program are used.\n\n*   Several types of documentation can\
    \ be added at different levels of your program:\n\n*   **Inline comments** - line\
    \ level\n\n*   **Docstrings** - module and function level\n\n*   **Project documentation**\
    \ - project level\n\n## Inline Comments\n\n*   Inline comments are text following\
    \ hash symbols throughout your code. They are used to explain parts of your code,\
    \ and really help future contributors understand your work.\n\n*   Comments often\
    \ document the major steps of complex code. Readers may not have to understand\
    \ the code to follow what it does if the comments explain it. However, others\
    \ would argue that this is using comments to justify bad code, and that if code\
    \ requires comments to follow, it is a sign refactoring is needed.\n\n*   Comments\
    \ are valuable for explaining where code cannot. For example, the history behind\
    \ why a certain method was implemented a specific way. Sometimes an unconventional\
    \ or seemingly arbitrary approach may be applied because of some obscure external\
    \ variable causing side effects. These things are difficult to explain with code.\n\
    \n## Docstrings\n\nDocstring, or documentation strings, are valuable pieces of\
    \ documentation that explain the functionality of any function or module in your\
    \ code. Ideally, each of your functions should always have a docstring.\n\nDocstrings\
    \ are surrounded by triple quotes. The first line of the docstring is a brief\
    \ explanation of the function's purpose.\n\nOne-line docstring\n\ndef population\\\
    _density(population, land\\_area):\n\n \"\"\"Calculate the population density\
    \ of an area.\"\"\"\n\n return population / land\\_area\n\nIf you think that the\
    \ function is complicated enough to warrant a longer description, you can add\
    \ a more thorough paragraph after the one-line summary.\n\n## Multi-line docstring\n\
    \ndef population\\_density(population, land\\_area):\n\n \"\"\"Calculate the population\
    \ density of an area.\n\n Args:\n\n population: int. The population of the area\n\
    \n land\\_area: int or float. This function is unit-agnostic, if you pass in values\
    \ in terms of square km or square miles the function will return a density in\
    \ those units.\n\n Returns:\n\n population\\_density: population/land\\_area.\
    \ The population density of a \n\n particular area.\n\n \"\"\"\n\n return population\
    \ / land\\_area\n\nThe next element of a docstring is an explanation of the function's\
    \ arguments. Here, you list the arguments, state their purpose, and state what\
    \ types the arguments should be. Finally, it is common to provide some description\
    \ of the output of the function. Every piece of the docstring is optional; however,\
    \ doc strings are a part of good coding practice.\n\n## Version Control In Data\
    \ Science"
