    \ section.\n\n*   *exercise.ipynbcontains explanations and instructions.*\n\n\
    *   *answer.py contains solution to the exercise.*\n\nGetting started\n\nOpen\
    \ the exercise.ipynb notebook file using Jupyter Notebook and follow the instructions\
    \ in the notebook to complete the exercise\n\n## Commenting object-oriented code\n\
    \nDid you notice anything special about the answer key in the previous exercise?\
    \ The Pants class and the SalesPerson class contained docstrings! A docstring\
    \ is a type of comment that describes how a Python module, function, class, or\
    \ method works. Docstrings are not unique to object-oriented programming.\n\n\
    For this section of the course, you just need to remember to use docstrings and\
    \ to comment your code. It will help you understand and maintain your code and\
    \ even make you a better job candidate.\n\nFrom this point on, please always comment\
    \ your code. Use both inline comments and document-level comments as appropriate.\n\
    \nTo learn more about docstrings, see Example Google Style Python Docstrings.\n\
    \nDocstrings and object-oriented code\n\nThe following example shows a class with\
    \ docstrings. Here are a few things to keep in mind:\n\n*   Make sure to indent\
    \ your docstrings correctly or the code will not run. A docstring should be indented\
    \ one indentation underneath the class or method being described.\n\n*   You don't\
    \ have to define self in your method docstrings. It's understood that any method\
    \ will have self as the first method input.\n\nclass `Pants`:\n\n    \"\"\"The\
    \ Pants class represents an article of clothing sold in a store\n\n    \"\"\"\n\
    \n    def `\\_\\_init\\_\\_(self, color, waist_size, length, price)`:\n\n    \
    \    \"\"\"Method for initializing a Pants object\n\n        Args: \n\n      \
    \  color (str)\n\n        waist_size (int)\n\n        length (int)\n\n       \
    \ price (float)\n\n        Attributes:\n\n        color (str): color of a pants\
    \ object\n\n        waist_size (str): waist size of a pants object\n\n       \
    \ length (str): length of a pants object\n\n        price (float): price of a\
    \ pants object\n\n        \"\"\"\n\n        self.color = color\n\n        self.waist_size\
    \ = waist_size\n\n        self.length = length\n\n        self.price = price\n\
    \n    def `change_price(self, new_price)`:\n\n        \"\"\"The change_price method\
    \ changes the price attribute of a pants object\n\n        Args: \n\n        new_price\
    \ (float): the new price of the pants object\n\n        Returns: None\n\n    \
    \    \"\"\"\n\n        self.price = new_price\n\n    def `discount(self, percentage)`:\n\
    \n        \"\"\"The discount method outputs a discounted price of a pants object\n\
    \n        Args:\n\n        percentage (float): a decimal representing the amount\
    \ to discount\n\n        Returns:\n\n        float: the discounted price\n\n \
    \       \"\"\"\n\n        return self.price * (1 - percentage)\n\n## A Gaussian\
