- raw: 'The tools used for model evaluation are often tailored to a specific use case,
    so it''s difficult to generalize rules for choosing them. The following articles
    provide use cases and examples of specific metrics in use.


    *   This healthcare-based example, which automates the prediction of spinal pathology
    conditions, demonstrates how important it is to avoid false positive and false
    negative predictions using the tree-based xgboost model.


    *   The popular open-source library sklearn provides information about common
    metrics and how to use them.


    *   This entry from the AWS Machine Learning blog demonstrates the importance
    of choosing the correct model evaluation metrics for making accurate energy consumption
    estimates using Amazon Forecast.


    ## Step Five: Model Inference


    Congratulations! You''re ready to deploy your model.


    Once you have trained your model, have evaluated its effectiveness, and are satisfied
    with the results, you''re ready to generate predictions on real-world problems
    using unseen data in the field. In machine learning, this process is often called
    inference.


    Iterative Process


    ![Image](images/image20.png)


    Even after you deploy your model, you''re always monitoring to make sure your
    model is producing the kinds of results that you expect. There may be times when
    you reinvestigate the data, modify some of the parameters in your model training
    algorithm, or even change the model type used for training.


    ## Introduction to Examples


    Through the remainder of the lesson, we will be walking through 3 different case
    study examples of machine learning tasks actually solving problems in the real
    world.


    *   **Supervised learning**


    *   Using machine learning to predict housing prices in a neighborhood based on
    lot size and number of bedrooms


    *   **Unsupervised learning**


    *   Using machine learning to isolate micro-genres of books by analyzing the wording
    on the back cover description.


    *   **Deep neural network**


    *   While this type of task is beyond the scope of this lesson, we wanted to show
    you the power and versatility of modern machine learning. You will see how it
    can be used to analyze raw images from lab video footage from security cameras,
    trying to detect chemical spills.


    ## Example One: House Price Prediction


    House price prediction is one of the most common examples used to introduce machine
    learning.


    Traditionally, real estate appraisers use many quantifiable details about a home
    (such as number of rooms, lot size, and year of construction) to help them estimate
    the value of a house.


    You detect this relationship and believe that you could use machine learning to
    predict home prices.


    ![Image](images/image21.png)


    ### Step One: Define the Problem


    Can we estimate the price of a house based on lot size or the number of bedrooms?


    You access the sale prices for recently sold homes or have them appraised. Since
    you have this data, this is a supervised learning task. You want to predict a
    continuous numeric value, so this task is also a regression task.


    ![Image](images/image22.png)


    ### Step Two: Building a Dataset


    *   **Data collection**: You collect numerous examples of homes sold in your neighborhood
    within the past year, and pay a real estate appraiser to appraise the homes whose
    selling price is not known.


    *   **Data exploration**: You confirm that all of your data is numerical because
    most machine learning models operate on sequences of numbers. If there is textual
    data, you need to transform it into numbers. You''ll see this in the next example.


    *   **Data cleaning**: Look for things such as missing information or outliers,
    such as the 10-room mansion. Several techniques can be used to handle outliers,
    but you can also just remove those from your dataset.


    | No of Rooms || Lot Size (ft²) || House Value ($) |


    | --- | --- | --- |


    | 4 || 10,454 || 339,900 |


    | 3 || 9,147 || 239,000 |


    | 3 || 10,890 || 250,000 |


    | 10 || 25,877 || 877,000 |


    Data Cleaning: removing outlier values


    *   Data visualization: You can plot home values against each of your input variables
    to look for trends in your data. In the following chart, you see that when lot
    size increases, the house value increases.


    ![Image](images/image23.png)


    ### Step Three: Model Training


    Prior to actually training your model, you need to split your data. The standard
    practice is to put 80% of your dataset into a training dataset and 20% into a
    test dataset.


    Linear model selection


    As you see in the preceding chart, when lot size increases, home values increase
    too. This relationship is simple enough that a linear model can be used to represent
    this relationship.


    A linear model across a single input variable can be represented as a line. It
    becomes a plane for two variables, and then a hyperplane for more than two variables.
    The intuition, as a line with a constant slope, doesn''t change.


    Using a Python library


    The Python scikit-learn library has tools that can handle the implementation of
    the model training algorithm for you.


    ### Step Four: Evaluation


    One of the most common evaluation metrics in a regression scenario is called root
    mean square or RMS. The math is beyond the scope of this lesson, but RMS can be
    thought of roughly as the "average error” across your test dataset, so you want
    this value to be low.


    ![Image](images/image24.png)


    In the following chart, you can see where the data points are in relation to the
    blue line. You want the data points to be as close to the "average" line as possible,
    which would mean less net error.


    You compute the root mean square between your model’s prediction for a data point
    in your test dataset and the true value from your data. This actual calculation
    is beyond the scope of this lesson, but it''s good to understand the process at
    a high level.


    ![Image](images/image25.png)


    Interpreting Results


    In general, as your model improves, you see a better RMS result. You may still
    not be confident about whether the specific value you’ve computed is good or bad.


    Many machine learning engineers manually count how many predictions were off by
    a threshold (for example, $50,000 in this house pricing problem) to help determine
    and verify the model''s accuracy.


    ### Step Five: Inference: Try out your model


    Now you are ready to put your model into action. As you can see in the following
    image, this means seeing how well it predicts with new data not seen during model
    training.


    ![Image](images/image26.png)


    Terminology


    *   **Continuous**: Floating-point values with an infinite range of possible values.
    The opposite of categorical or discrete values, which take on a limited number
    of possible values.


    *   **Hyperplane**: A mathematical term for a surface that contains more than
    two planes.


    *   **Plane**: A mathematical term for a flat surface (like a piece of paper)
    on which two points can be joined by a straight line.


    *   Regression: A common task in supervised machine learning.


    Additional reading


    The Machine Learning Mastery blog is a fantastic resource for learning more about
    machine learning. The following example blog posts dive deeper into training regression-based
    machine learning models.


    *   How to Develop Ridge Regression Models in Python offers another approach to
    solving the problem in the example from this lesson.


    *   Regression is a popular machine learning task, and you can use several different
    model evaluation metrics with it.


    ## Example Two: Book Genre Exploration


    In this video, you saw how the machine learning process can be applied to an unsupervised
    machine learning task that uses book description text to identify different micro-genres.


    ### Step One: Define the Problem


    ![Image](images/image27.png)


    Find clusters of similar books based on the presence of common words in the book
    descriptions.'
