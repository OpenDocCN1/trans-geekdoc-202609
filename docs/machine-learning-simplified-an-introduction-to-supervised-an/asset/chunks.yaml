- raw: 'As the model tries to identify data as “real” or “fake”, it’s going to make
    errors. Any prediction different than the ground truth is referred to as an error.


    The measure of the error in the prediction, given a set of weights, is called
    a loss function. Weights represent how important an associated feature is to determining
    the accuracy of a prediction.


    Loss functions are an important element of training a machine learning model because
    they are used to update the weights after every iteration of your model. Updating
    weights after iterations optimizes the model making the errors smaller and smaller.


