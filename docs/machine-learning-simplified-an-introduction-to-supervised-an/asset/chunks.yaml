    Recap


    In this demo we learned how to setup a Jupyter notebook in Amazon SageMaker, reviewed
    a machine learning code, and what data preparation, model training, and model
    evaluation can look like in a notebook instance. While this was a fun use case
    for us to explore, the concepts and techniques can be applied to other machine
    learning projects like an object detector or a sentiment analysis on text.


    Glossary


    *   **Action**: For every state, an agent needs to take an action toward achieving
    its goal.


    *   **Agent**: The piece of software you are training is called an agent. It makes
    decisions in an environment to reach a goal.


    *   **Discriminator**: A neural network trained to differentiate between real
    and synthetic data.


    *   **Discriminator loss**: Evaluates how well the discriminator differentiates
    between real and fake data.


    *   **Edit event**: When a note is either added or removed from your input track
    during inference.


    *   **Environment**: The environment is the surrounding area within which the
    agent interacts.


    *   **Exploration versus exploitation**: An agent should exploit known information
    from previous experiences to achieve higher cumulative rewards, but it also needs
    to explore to gain new experiences that can be used in choosing the best actions
    in the future.


    *   **Generator**: A neural network that learns to create new data resembling
    the source data on which it was trained.


    *   **Generator loss**: Measures how far the output data deviates from the real
    data present in the training dataset.


    *   **Hidden layer**: A layer that occurs between the output and input layers.
    Hidden layers are tailored to a specific task.


    *   **Input layer**: The first layer in a neural network. This layer receives
    all data that passes through the neural network.


    *   **Output layer**: The last layer in a neural network. This layer is where
    the predictions are generated based on the information captured in the hidden
    layers.


    *   **Piano roll**: A two-dimensional piano roll matrix that represents input
    tracks. Time is on the horizontal axis and pitch is on the vertical axis.


    *   **Reward**: Feedback is given to an agent for each action it takes in a given
    state. This feedback is a numerical reward.


    # CHAPTER FOUR


    ## Software Engineering Practices, Part I


    In this lesson, you''ll learn about the following software engineering practices
    and how they apply in data science.


    *   Writing clean and modular code


    *   Writing efficient code


    *   Code refactoring


    *   Adding meaningful documentation


    *   Using version control


    In the lesson following this one (part 2), you''ll also learn about the following
    software engineering practices:


    *   Testing


    *   Logging


    *   Code reviews


    ## Clean and Modular Code


    *   **Production code**: Software running on production servers to handle live
    users and data of the intended audience. Note that this is different from production-quality
    code, which describes code that meets expectations for production in reliability,
    efficiency, and other aspects. Ideally, all code in production meets these expectations,
    but this is not always the case.


    *   **Clean code**: Code that is readable, simple, and concise. Clean production-quality
    code is crucial for collaboration and maintainability in software development.


    *   **Modular code**: Code that is logically broken up into functions and modules.
    Modular production-quality code that makes your code more organized, efficient,
    and reusable.


    *   **Module**: A file. Modules allow code to be reused by encapsulating them
    into files that can be imported into other files.


    ## Refactoring Code


    *   *Refactoring*: Restructuring your code to improve its internal structure without
    changing its external functionality. This gives you a chance to clean and modularize
    your program after you''ve got it working.'
