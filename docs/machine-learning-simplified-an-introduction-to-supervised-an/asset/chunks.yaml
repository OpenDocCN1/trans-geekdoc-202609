    3. 我认为我的客户属于众多客户细分群体之一，但我事先并不知道这些细分群体是什么。在获得授权后，我收集了他们在使用我的产品时的行为数据，并尝试判断是否存在行为相似的用户群体。


    4. 我为一家演出公司工作，想提供一项帮助父母预测孩子在特定年龄段鞋码的服务。在该系统中，我将鞋码表示为一个数值的连续范围，然后取到最近的鞋码。


    1. 作为机器学习从业者，你正在与音乐流媒体应用的利益相关者合作。你的上级问：“我们如何增加客户在我们应用上聆听的平均分钟数？”


    这个问题范围太广泛，涉及的影响因素众多。


    你如何能够缩小范围或重新定义问题，使其更适合机器学习任务，并更简洁明确？


    1. 改变我们开始播放广告的频率，会影响客户在我们服务上聆听音乐的时长吗？


    2. 创建客户播放列表是否能鼓励客户聆听更长时间的音乐？


    3. 创建关于歌曲的艺术家访谈是否会增加我们的客户聆听音乐的时长？


    Answer: All of the Above


    ## Step Two: Build a Dataset


    机器学习流程的下一步是构建一个能用于解决你机器学习问题的数据集。了解所需的数据有助于你选择更合适的模型和算法，从而构建更有效的解决方案。


    机器学习过程中最重要的一步


    与数据打交道是机器学习过程中可能被忽视，但也是最重要的一步。2017 年 O’Reilly 的一项研究显示，机器学习从业者花费 80%的时间在处理数据上。


    数据工作的四个方面


    ![Image](img/image15.png)


    仅在数据工作、理解和处理方面，就可以上一整节课。高质量的数据是任何机器学习项目的基础。让我们来探讨一些数据工作的常见方面。


    数据收集


    数据收集可以是运行适当的 SQL 查询那么简单，也可以是构建定制的 Web 爬虫应用来收集项目所需数据，甚至需要先对数据运行模型以生成所需的标签。这里的核心问题是：


    收集到的数据是否与你定义的机器学习任务和问题相匹配？


    数据检查


    数据的质量将是影响模型表现的最大因素。在检查数据时，请寻找：


    *   外围值


    *   缺失或不完整的值


    *   需要转换或预处理的数据，以确保其格式适合模型使用


    总结统计量


    模型会假设数据的结构。


    现在你已经拥有数据，检查数据是否符合所选机器学习模型的底层假设是一个良好实践。


    通过统计工具，你可以计算均值、四分位距（IQR）和标准差等指标，这些指标能为你提供对数据范围、规模和形状的洞察。


    数据可视化


    你可以使用数据可视化来观察数据中的外围值和趋势，并帮助利益相关者理解数据。


    观察以下两张图表。第一张图表中，部分数据似乎聚集成不同的群组。第二张图表中，部分数据点可能是外围值。


    ![Image](img/image16.png)


    术语


    “插补”是一个常用术语，指代用于计算数据集中缺失值的统计工具。


    外围值是指在同一样本中显著不同于其他数据点的数据点。


    进一步阅读


    在机器学习中，你会使用多种基于统计的工具来更好地理解数据。sklearn 库提供了许多示例和教程，例如展示真实数据集外围检测的示例。


    测验：构建数据集


    使用这一系列真假问题来测试你对构建数据集不同部分的了解。有些问题要求你更深入地思考之前学习的内容。


    1. 真或假：你的数据需求不会因所使用的机器学习任务而改变。


    1. 真


    2. 假


    Answer: B


    1. 真或假：模型是通用的，因此日期不相关。


    1. 真


    2. 假


    Answer: B


    1. 真或假：数据需要格式化，以确保其与所计划使用的模型和训练算法兼容。


    1. 真


    2. 假


    Answer: A


    1. 真或假：数据可视化是识别数据中外围值的唯一方法。


    1. 真


    2. 假


    Answer: B


    1. 真或假：在开始使用模型（进行推理）后，你不需要检查模型接收到的新数据。


    1. 真


    2. 假


    Answer: B


    ## Step Three: Model Training


    划分数据集


    模型训练的第一步是随机划分数据集。这使你能够在训练过程中保留一些数据，以便在将模型投入生产前评估其表现。具体来说，这是为了检验偏差-方差权衡。如果想进一步了解，请参阅“进一步学习和阅读”部分。


    划分数据集会给你提供两组数据：


    *   **训练数据集**：用于训练模型的数据。大部分数据位于此处。许多开发者估计约占 80%。


    *   **测试数据集**：在训练过程中保留未提供给模型的数据，用于测试模型在新数据上的泛化能力。


    模型训练术语


    模型训练算法会迭代更新模型参数，以最小化某个损失函数。


    让我们定义这两个术语：


    *   模型参数：模型参数是训练算法可以更新的设置或配置，用于改变模型的行为。在某些上下文中，你也会听到更具体的术语，如权重和偏置。权重是随模型学习而变化的值，更具体地适用于神经网络。


    *   损失函数：损失函数用于量化模型距离目标的程度。例如，如果你试图根据天气预测雪糕的销售数量，你希望预测尽可能准确。因此，你可能定义损失函数为“模型预测的雪糕销售数量与正确数量之间的平均距离”。在雪糕示例中，这对应于两个紫点之间的差值。


    将一切整合在一起


    完整的训练过程是：


    *   将训练数据输入模型。


    *   在结果上计算损失函数。


    *   更新模型参数，使损失减小。


    你将循环执行这些步骤，直到满足预定义的停止条件。停止条件可能基于训练时间、训练周期数量，或是更智能或更贴合应用的机制。


    专家建议


    在训练模型时，请记住以下建议。


    *   实践者通常使用已经提供现成模型和训练算法的机器学习框架。你可以从零实现这些模型，但除非你正在开发新模型或算法，否则通常不需要这样做。


