- raw: '![Image](images/image49.png)


    Well-trained – Avoid overlifting


    Adjust hyperparameters


    The AWS DeepRacer console''s default hyperparameters are quite effective, but
    occasionally you may consider adjusting the training hyperparameters. The hyperparameters
    are variables that essentially act as settings for the training algorithm that
    control the performance of your agent during training. We learned, for example,
    that the learning rate controls how many new experiences are counted in learning
    at each step.


    In this reward graph example, the training completion graph and the reward graph
    are swinging high and low. This might suggest an inability to converge, which
    may be helped by adjusting the learning rate. Imagine if the current weight for
    a given node is .03, and the optimal weight should be .035, but your learning
    rate was set to .01. The next training iteration would then swing past optimal
    to .04, and the following iteration would swing under it to .03 again. If you
    suspect this, you can reduce the learning rate to .001. A lower learning rate
    makes learning take longer but can help increase the quality of your model.


    ![Image](images/image50.png)


    Adjust hyperparameters


    Good Job and Good Luck!


    Remember: training experience helps both model and reinforcement learning practitioners
    become a better team. Enter your model in the monthly AWS DeepRacer League races
    for chances to win prizes and glory while improving your machine learning development
    skills!


    ## Introduction to Generative AI


    Generative AI and Its Applications


    Generative AI is one of the biggest recent advancements in artificial intelligence
    because of its ability to create new things.


    Until recently, the majority of machine learning applications were powered by
    discriminative models. A discriminative model aims to answer the question, "If
    I''m looking at some data, how can I best classify this data or predict a value?"
    For example, we could use discriminative models to detect if a camera was pointed
    at a cat.


    As we train this model over a collection of images (some of which contain cats
    and others which do not), we expect the model to find patterns in images which
    help make this prediction.


    A generative model aims to answer the question,"Have I seen data like this before?"
    In our image classification example, we might still use a generative model by
    framing the problem in terms of whether an image with the label "cat" is more
    similar to data you’ve seen before than an image with the label "no cat."


    However, generative models can be used to support a second use case. The patterns
    learned in generative models can be used to create brand new examples of data
    which look similar to the data it seen before.


    ![Image](images/image51.png)


    Discriminative versus Generative algorithms


    ## Generative AI Models


    In this lesson, you will learn how to create three popular types of generative
    models: generative adversarial networks (GANs), general autoregressive models,
    and transformer-based models. Each of these is accessible through AWS DeepComposer
    to give you hands-on experience with using these techniques to generate new examples
    of music.


    Autoregressive models


    Autoregressive convolutional neural networks (AR-CNNs) are used to study systems
    that evolve over time and assume that the likelihood of some data depends only
    on what has happened in the past. It’s a useful way of looking at many systems,
    from weather prediction to stock prediction.


    Generative adversarial networks (GANs)


    Generative adversarial networks (GANs), are a machine learning model format that
    involves pitting two networks against each other to generate new content. The
    training algorithm swaps back and forth between training a generator network (responsible
    for producing new data) and a discriminator network (responsible for measuring
    how closely the generator network’s data represents the training dataset).


    Transformer-based models


    Transformer-based models are most often used to study data with some sequential
    structure (such as the sequence of words in a sentence). Transformer-based methods
    are now a common modern tool for modeling natural language.


    We won''t cover this approach in this course but you can learn more about transformers
    and how AWS DeepComposer uses transformers in AWS DeepComposer learning capsules.


    ## Generative AI with AWS DeepComposer


    ### What is AWS DeepComposer?


    AWS DeepComposer gives you a creative and easy way to get started with machine
    learning (ML), specifically generative AI. It consists of a USB keyboard that
    connects to your computer to input melody and the AWS DeepComposer console, which
    includes AWS DeepComposer Music studio to generate music, learning capsules to
    dive deep into generative AI models, and AWS DeepComposer Chartbusters challenges
    to showcase your ML skills.


    ![Image](images/image52.png)


    AWS DeepComposer


    AWS DeepComposer keyboard


    You don''t need an AWS DeepComposer keyboard to finish this course. You can import
    your own MIDI file, use one of the provided sample melodies, or use the virtual
    keyboard in the AWS DeepComposer Music studio.


    AWS DeepComposer music studio


    To generate, create, and edit compositions with AWS DeepComposer, you use the
