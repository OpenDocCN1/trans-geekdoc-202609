  trans: '

    神经网络超出本课程的范围，但你可以把它们看作是一系列通过连接而成的非常简单的模型。这些简单模型被称为神经元，这些模型之间的连接被称为可训练的模型参数，即权重。


    卷积神经网络是一种特殊的神经网络，特别擅长处理图像。


    ### Step Four: Model Evaluation


    如前面的示例所示，你可以使用许多不同的统计指标来评估你的模型。随着你在机器学习领域积累经验，你会学习如何研究哪些指标能帮助你最有效地评估模型。以下是常见指标的列表：


    | Accuracy || False positive rate || Precision |


    | --- | --- | --- |


    | Confusion matrix || False negative rate || Recall |


    | F1 Score || Log Loss || ROC curve |


    |   || Negative predictive value || Specificity |


    在某些情况下，准确率可能不是最佳的评估机制。


    **Why not**? 你意识到模型几乎总是看到‘不包含溢出’类，因此，只要模型大部分时间都预测“不溢出”，它看起来就会显得相当准确。


    真正重要的是一个能够很少漏掉真实溢出的评估工具。


    通过一些网络侦探的工作，你发现这是一个常见问题，而精确率（Precision）和召回率（Recall）将会很有效。你可以把精确率理解为回答“在所有关于溢出的预测中，有多少是正确的？”的问题，而召回率则是回答“在所有实际溢出中，我们检测到了多少？”的问题。


    手动评估起着重要作用。你不确定你的模拟溢出是否足够真实。为了更好地了解模型在真实溢出上的表现，你从历史记录中找到了额外的示例。这使你确认模型运行得相当满意。


    ### Step Five: Model Inference


    模型可以部署在像 AWS Panorama 这样的系统上，用于运行机器学习工作负载。


    好在大多数时候，结果来自类 ‘Does not contain spill’。


    ![Image](img/image36.png)


    但是，当检测到类 **''Contains spill''** 时，简单的分页系统可以提醒团队进行响应。


    ![Image](img/image37.png)


    ### 术语


    **Convolutional neural networks(CNN)** 是一种特殊的神经网络，特别擅长处理图像。


    **Neural networks**：一系列通过连接的非常简单的模型。


    *   这些简单模型被称为神经元


    *   这些模型之间的连接是可训练的模型参数，称为权重。


    ### 进一步阅读


    随着你继续深耕机器学习之路，你会开始认识到哪些问题非常适合机器学习。


    AWS 机器学习博客是寻找更多机器学习项目示例的绝佳资源。


    *   在 Protecting people from hazardous areas through virtual boundaries with Computer
    Vision 博客文章中，你可以看到本课程中描述的深度学习过程的更详细示例。


    ### 课程回顾


    祝贺你完成了本课程。让我们回顾一下你学了什么。


    *   在本课程的第一部分，我们讨论了机器学习到底是什么，介绍了一些机器学习中常用的术语和概念，并识别了机器学习项目中常见的组成部分。


    *   我们了解到机器学习涉及使用训练好的模型生成预测并从数据中检测模式。我们窥探了背后的过程，也拆解了机器学习中不同的步骤或任务。


    *   我们通过三个机器学习示例展示了它们如何解决实际问题。


    *   一个监督学习任务：利用机器学习根据地块大小和卧室数量预测所在社区房屋的价格。


    *   一个无监督学习任务：利用机器学习在书籍数据集中根据描述性文字找到有趣的书籍集合。


    *   使用深度神经网络从实验室视频和图像中检测化学溢出。


    ### Learning Objectives


    如果你阅读了图片并完成了所有测验，那么你应该已经掌握了本课程的学习目标。你现在应该能够识别以下内容。请逐一检查并勾选：


    *   区分监督学习和无监督学习


    *   识别可以使用机器学习解决的问题


    *   描述常用算法，包括线性回归、逻辑回归和 k-means


    *   描述模型训练和测试的工作原理


    *   使用矩阵评估机器学习模型的性能


    # CHAPTER THREE


    ## Machine Learning with AWS


    Why AWS?


    AWS 的机器学习使命是将机器学习置于每个开发者的手中。


    *   AWS 提供最广泛且最深入的人工智能（AI）和机器学习（ML）服务，灵活性无与伦比。


    *   你可以通过 AWS SageMaker 加速机器学习的采用。以前需要数月才能构建且需要专业知识的模型，现在可以在数周甚至数天内完成。


    *   AWS 提供最全面的云服务，专为机器学习优化。


    *   机器学习在 AWS 上的规模远超其他任何地方。


    AWS Machine Learning offerings


    在 AI 服务方面，你不一定需要从零编写机器学习解决方案。AWS 预训练的 AI 服务提供即插即用的智能，直接用于你的应用和工作流。你只需将这些服务应用于自己的使用场景即可。


    Amazon 有不同的健康 AI 服务，无需机器学习知识即可使用。其中一个例子是 Amazon Transcribe Medical，它将医疗语音转换为文本。医护人员与患者之间的对话构成了患者诊断和治疗的基础。准确性至关重要。Amazon
    Transcribe Medical 是一种自动语音识别（ASR）服务，用于短时录音。


    AWS AI services


    通过使用 AWS 预训练的 AI 服务，你可以将即插即用的智能应用于广泛的应用场景，如个性化推荐、联系中心现代化、提升安全与安全性以及提高客户参与度。


    ### Industry-specific solutions


    无需机器学习知识，即可为医疗、制造等不同行业的应用添加智能。


    ### AWS Machine Learning services


    AWS 让你能够快速构建、训练和部署模型。Amazon SageMaker 是一个完全托管的服务，消除了 ML 工作流的复杂性，使每个开发者和数据科学家都能为各种用例部署机器学习。


    ### ML infrastructure and frameworks


    AWS 工作流服务简化了管理和扩展底层机器学习基础设施的难度。


    ![Image](img/image38.png)


    ### Getting started


    除了 AWS Training and Certification 等教育资源外，AWS 还创建了一系列教育工具，帮助开发者以独特且有趣的方式将新的机器学习技术投入使用，如
    **AWS DeepRacer** 和 **AWS DeepComposer**。


    **AWS DeepRacer**：一种设计用于通过物理赛道测试增强学习模型的自主赛车。


    **AWS DeepComposer**：一种由生成式 AI 驱动的创作设备，能够将旋律转化为全新原创歌曲。


    **AWS ML Training and Certification**：用于培训 Amazon 开发者的课程。


    ![Image](img/image39.png)


    ## AWS Account Requirements


    需要 AWS 账户


    '
