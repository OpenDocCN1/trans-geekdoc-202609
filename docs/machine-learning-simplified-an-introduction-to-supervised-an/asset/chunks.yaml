- raw: 'If you need a refresher on using Git for version control, check out the course
    linked in the extracurriculars. If you''re ready, let''s see how Git is used in
    real data science scenarios!


    Scenario #1


    Let''s walk through the Git commands that go along with each step in the scenario
    you just observed in the video.


    Step 1: You have a local version of this repository on your laptop, and to get
    the latest stable version, you pull from the develop branch.


    Switch to the develop branch


    git checkout develop


    Pull the latest changes in the develop branch


    git pull


    Step 2: When you start working on this demographic feature, you create a new branch
    called demographic, and start working on your code in this branch.


    Create and switch to a new branch called demographic from the develop branch


    git checkout -b demographic


    Work on this new feature and commit as you go


    git commit -m ''added gender recommendations''


    git commit -m ''added location specific recommendations''


    ...


    Step 3: However, in the middle of your work, you need to work on another feature.
    So you commit your changes on this demographic branch, and switch back to the
    develop branch.


    Commit your changes before switching


    git commit -m ''refactored demographic gender and location recommendations ''


    Switch to the develop branch


    git checkout develop


    Step 4: From this stable develop branch, you create another branch for a new feature
    called friend\_groups.


    Create and switch to a new branch called friend\_groups from the develop branch


    git checkout -b friend\_groups


    Step 5: After you finish your work on the friend\_groups branch, you commit your
    changes, switch back to the development branch, merge it back to the develop branch,
    and push this to the remote repository’s develop branch.


    Commit your changes before switching


    git commit -m ''finalized friend\_groups recommendations ''


    Switch to the develop branch


    git checkout develop


    Merge the friend\_groups branch into the develop branch


    git merge --no-ff friends\_groups


    Push to the remote repository


    git push origin develop


    Step 6: Now, you can switch back to the demographic branch to continue your progress
    on that feature.


    Switch to the demographic branch


    git checkout demographic


    Scenario #2


    Let''s walk through the Git commands that go along with each step in the scenario
    you just observed in the video.


    Step 1: You check your commit history, seeing messages about the changes you made
    and how well the code performed.


    View the log history


    git log


    Step 2: The model at this commit seemed to score the highest, so you decide to
    take a look.


    Check out a commit


    git checkout bc90f2cbc9dc4e802b46e7a153aa106dc9a88560


    After inspecting your code, you realize what modifications made it perform well,
    and use those for your model.


    Step 3: Now, you''re confident merging your changes back into the development
    branch and pushing the updated recommendation engine.


    Switch to the develop branch


    git checkout develop


    Merge the friend\_groups branch into the develop branch


    git merge --no-ff friend\_groups


    Push your changes to the remote repository


    git push origin develop


    Scenario #3


    Let''s walk through the Git commands that go along with each step in the scenario
    you just observed in the video.


    Step 1: Andrew commits his changes to the documentation branch, switches to the
    development branch, and pulls down the latest changes from the cloud on this development
    branch, including the change I merged previously for the friends group feature.


    Commit the changes on the documentation branch


    git commit -m "standardized all docstrings in process.py"


    Switch to the develop branch


    git checkout develop


    Pull the latest changes on the develop branch down


    git pull


    Step 2: Andrew merges his documentation branch into the develop branch on his
    local repository, and then pushes his changes up to update the develop branch
    on the remote repository.


    Merge the documentation branch into the develop branch


    git merge --no-ff documentation


    Push the changes up to the remote repository


    git push origin develop


    Step 3: After the team reviews your work and Andrew''s work, they merge the updates
    from the development branch into the master branch. Then, they push the changes
    to the master branch on the remote repository. These changes are now in production.


    Merge the develop branch into the master branch


    git merge --no-ff develop


    Push the changes up to the remote repository


    git push origin master


    Note on merge conflicts


    For the most part, Git makes merging changes between branches really simple. However,
    there are some cases where Git can become confused about how to combine two changes,
    and asks you for help. This is called a merge conflict.


    Mostly commonly, this happens when two branches modify the same file.


    For example, in this situation, let’s say you deleted a line that Andrew modified
    on his branch. Git wouldn’t know whether to delete the line or modify it. You
    need to tell Git which change to take, and some tools even allow you to edit the
    change manually. If it isn’t straightforward, you may have to consult with the
    developer of the other branch to handle a merge conflict.


    ## Model versioning


    In the previous example, you may have noticed that each commit was documented
    with a score for that model. This is one simple way to help you keep track of
    model versions. Version control in data science can be tricky, because there are
    many pieces involved that can be hard to track, such as large amounts of data,
    model versions, seeds, and hyperparameters.


    The following resources offer useful methods and tools for managing model versions
    and large amounts of data. These are here for you to explore, but are not necessary
    to know now as you start your journey as a data scientist. On the job, you’ll
    always be learning new skills, and many of them will be specific to the processes
    set in your company.


    # CHAPTER FIVE


    ## Software Engineering Practices, Part 2


    In part 2 of software engineering practices, you''ll learn about the following
    practices of software engineering and how they apply in data science.


    *   Testing


    *   Logging


    *   Code reviews


    ## Testing


    Testing your code is essential before deployment. It helps you catch errors and
    faulty conclusions before they make any major impact. Today, employers are looking
    for data scientists with the skills to properly prepare their code for an industry
    setting, which includes testing their code.


    Testing And Data Science


    Problems that could occur in data science aren’t always easily detectable; you
    might have values being encoded incorrectly, features being used inappropriately,
    or unexpected data breaking assumptions.


    To catch these errors, you have to check for the quality and accuracy of your
    analysis in addition to the quality of your code. Proper testing is necessary
    to avoid unexpected surprises and have confidence in your results.


    Test-driven development (TDD): A development process in which you write tests
    for tasks before you even write the code to implement those tasks.


    Unit test: A type of test that covers a “unit” of code—usually a single function—independently
    from the rest of the program.


    Unit tests


    We want to test our functions in a way that is repeatable and automated. Ideally,
    we''d run a test program that runs all our unit tests and cleanly lets us know
    which ones failed and which ones succeeded. Fortunately, there are great tools
    available in Python that we can use to create effective unit tests!


    Unit test advantages and disadvantages'
