- raw: "Neural networks are beyond the scope of this lesson, but you can think of\
    \ them as a collection of very simple models connected together. These simple\
    \ models are called neurons, and the connections between these models are trainable\
    \ model parameters called weights.\n\nConvolutional neural networks are a special\
    \ type of neural network particularly good at processing images.\n\n### Step Four:\
    \ Model Evaluation\n\nAs you saw in the last example, there are many different\
    \ statistical metrics you can use to evaluate your model. As you gain more experience\
    \ in machine learning, you will learn how to research which metrics can help you\
    \ evaluate your model most effectively. Here's a list of common metrics:\n\n|\
    \ Accuracy || False positive rate || Precision |\n\n| --- | --- | --- |\n\n| Confusion\
    \ matrix || False negative rate || Recall |\n\n| F1 Score || Log Loss || ROC curve\
    \ |\n\n|   || Negative predictive value || Specificity |\n\nIn cases such as this,\
    \ accuracy might not be the best evaluation mechanism.\n\n**Why not**? You realize\
    \ the model will see the 'Does not contain spill' class almost all the time, so\
    \ any model that just predicts “no-spill” most of the time will seem pretty accurate.\n\
    \nWhat you really care about is an evaluation tool that rarely misses a real spill.\n\
    \nAfter doing some internet sleuthing, you realize this is a common problem and\
    \ that Precision and Recall will be effective. You can think of precision as answering\
    \ the question, \"Of all predictions of a spill, how many were right?\" and recall\
    \ as answering the question, \"Of all actual spills, how many did we detect?\"\
    \n\nManual evaluation plays an important role. You are unsure if your staged spills\
    \ are sufficiently realistic compared to actual spills. To get a better sense\
    \ how well your model performs with actual spills, you find additional examples\
    \ from historical records. This allows you to confirm that your model is performing\
    \ satisfactorily.\n\n### Step Five: Model Inference\n\nThe model can be deployed\
    \ on a system that enables you to run machine learning workloads such as AWS Panorama.\n\
    \nThankfully, most of the time, the results will be from the class 'Does not contain\
    \ spill.\n\n![Image](images/image36.png)\n\nBut, when the class **'Contains spill'**\
    \ is detected, a simple paging system could alert the team to respond.\n\n![Image](images/image37.png)\n\
    \nTerminology\n\n**Convolutional neural networks(CNN)** are a special type of\
    \ neural network particularly good at processing images.\n\n**Neural networks**:\
    \ a collection of very simple models connected together.\n\n*   These simple models\
    \ are called neurons\n\n*   the connections between these models are trainable\
    \ model parameters called weights.\n\nAdditional reading\n\nAs you continue your\
    \ machine learning journey, you will start to recognize problems that are excellent\
    \ candidates for machine learning.\n\nThe AWS Machine Learning Blog is a great\
    \ resource for finding more examples of machine learning projects.\n\n*   In the\
    \ Protecting people from hazardous areas through virtual boundaries with Computer\
    \ Vision blog post, you can see a more detailed example of the deep learning process\
    \ described in this lesson.\n\nLesson Review\n\nCongratulations on making it through\
    \ the lesson. Let's review what you learning.\n\n*   In the first part of the\
    \ lesson, we talked about what machine learning actually is, introduced you to\
    \ some of the most common terms and ideas used in machine learning, and identified\
    \ the common components involved in machine learning projects.\n\n*   We learned\
    \ that machine learning involves using trained models to generate predictions\
    \ and detect patterns from data. We looked behind the scenes to see what is really\
    \ happening. We also broke down the different steps or tasks involved in machine\
    \ learning.\n\n*   We looked at three machine learning examples to demonstrate\
    \ how each works to solve real-world situations.\n\n*   A supervised learning\
    \ task in which you used machine learning to predict housing prices for homes\
    \ in your neighborhood, based on the lot size and the number of bedrooms.\n\n\
    *   An unsupervised learning task in which you used machine learning to find interesting\
    \ collections of books in a book dataset, based on the descriptive words in the\
    \ book description text.\n\n*   Using a deep neural network to detect chemical\
    \ spills in a lab from video and images.\n\nLearning Objectives\n\nIf you read\
    \ through studied the images, and completed all the quizzes, then you should've\
    \ mastered the learning objectives for the lesson. You should recognize all of\
    \ these by now. Please read through and check off each as you go through them.\n\
    \n*   Differentiate between supervised learning and unsupervised learning\n\n\
    *   Identify problems that can be solved with machine learning\n\n*   Describe\
    \ commonly used algorithms including linear regression, logistic regression, and\
    \ k-means\n\n*   Describe how model training and testing works\n\n*   Evaluate\
    \ the performance of a machine learning model using matrices.\n\n# CHAPTER THREE\n\
    \n## Machine Learning with AWS\n\nWhy AWS?\n\nThe AWS machine learning mission\
    \ is to put machine learning in the hands of every developer.\n\n*   AWS offers\
    \ the broadest and deepest set of artificial intelligence (AI) and machine learning\
    \ (ML) services with unmatched flexibility.\n\n*   You can accelerate your adoption\
    \ of machine learning with AWS SageMaker. Models that previously took months to\
    \ build and required specialized expertise can now be built in weeks or even days.\n\
    \n*   AWS offers the most comprehensive cloud offering optimized for machine learning.\n\
    \n*   More machine learning happens at AWS than anywhere else.\n\nAWS Machine\
    \ Learning offerings\n\nWhen it comes to AI services, you don’t necessarily need\
    \ to code ML solutions from scratch. AWS pre-trained AI services provide ready-made\
    \ intelligence for your applications and workflows. You can just take the services\
    \ and apply them from your own use cases. \n\nAmazon has different health AI offerings,\
    \ which requires no machine learning knowledge. One example of Amazon health AI\
    \ offering is Amazon Transcribe Medical, which turns medical speech into text.\
    \ Conversations between health care providers and patients provide the foundations\
    \ of a patient’s diagnosis and treatment. Its very important that they information\
    \ is accurate. Amazon Transcribe Medical is an automatic speech recognition, short-form\
    \ ASR service. \n\nAWS AI services\n\nBy using AWS pre-trained AI services, you\
    \ can apply ready-made intelligence to a wide range of applications such as personalized\
    \ recommendations, modernizing your contact center, improving safety and security,\
    \ and increasing customer engagement.\n\nIndustry-specific solutions\n\nWith no\
    \ knowledge in machine learning needed, add intelligence to a wide range of applications\
    \ in different industries including healthcare and manufacturing.\n\nAWS Machine\
    \ Learning services\n\nWith AWS, you can build, train, and deploy your models\
    \ fast. Amazon SageMaker is a fully managed service that removes complexity from\
    \ ML workflows so every developer and data scientist can deploy machine learning\
    \ for a wide range of use cases.\n\nML infrastructure and frameworks\n\nAWS Workflow\
    \ services make it easier for you to manage and scale your underlying ML infrastructure.\n\
    \n![Image](images/image38.png)\n\nGetting started\n\nIn addition to educational\
    \ resources such as AWS Training and Certification, AWS has created a portfolio\
    \ of educational devices to help put new machine learning techniques into the\
    \ hands of developers in unique and fun ways, with **AWS DeepRacer** and **AWS\
    \ DeepComposer**.\n\n**AWS DeepRacer**: An autonomous race car designed to test\
    \ reinforcement learning models by racing on a physical track\n\n**AWS DeepComposer**:\
    \ A composing device powered by generative AI that creates a melody that transforms\
    \ into a completely original song\n\n**AWS ML Training and Certification**: Curriculum\
    \ used to train Amazon developers.\n\n![Image](images/image39.png)\n\n## AWS Account\
    \ Requirements\n\nAn AWS account is required"
