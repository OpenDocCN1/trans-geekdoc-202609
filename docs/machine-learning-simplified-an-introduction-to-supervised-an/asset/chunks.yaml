  trans: '

    从业者使用一种称为模型选择的过程来确定使用哪个模型或哪些模型。已建立的模型列表不断增长，甚至经验丰富的机器学习从业者在解决机器学习问题时也会尝试多种不同类型的模型。


    超参数是模型上的设置，在训练过程中保持不变，但会影响模型训练的速度或可靠性，例如模型应识别的簇数量。


    做好准备进行迭代。


    基于机器学习的实用问题解决通常不是精确的科学，你可能会对数据或问题做出假设，但这些假设可能会被证明是错误的。不要气馁，而是养成尝试新事物、衡量成功以及在迭代之间比较结果的习惯。


    延伸学习


    以下视频未涵盖的内容，供高级读者参考。


    线性模型


    线性模型是入门课程中最常见的模型，它通过线性函数（如 y = mx + b 或在 x 与 y 图表上的一条直线）描述输入数值集合与输出数值集合之间的关系。


    分类任务通常使用紧密相关的逻辑模型，该模型在线性函数的输出上再加入一个转换，将结果映射到 \[0, 1\] 范围内，解释为“目标类别的概率”。线性模型训练快速，可作为更复杂模型的出色基准。虽然媒体更关注复杂模型，但对于大多数新问题，建议先从简单模型开始。


    基于树的模型


    基于树的模型是入门课程中第二常见的模型类型。它们通过构建一个极其庞大的嵌套 if/else 块结构来学习分类或回归，在每个 if/else 块中将世界划分为不同区域。训练过程决定这些划分的具体位置以及每个叶节点的赋值。


    例如，若要判断光传感器是否在阳光下或阴影中，可以训练一个深度为 1 的树，其最终学习到的配置类似于：if (sensor_value > 0.698)，则返回
    1；else 返回 0。基于树的模型 XGBoost 常被用作现成实现，并在此基础上提供了超出本文讨论的增强功能。在尝试更复杂的模型之前，先使用基于树的模型快速得到基线是有益的。


    深度学习模型


    深度学习极为流行且强大，它是一种基于人脑概念模型的现代方法。该模型（也称为神经网络）由若干神经元（非常简单的计算单元）及其之间的权重（数学表示）组成，权重决定信息从一个神经元流向下一个神经元的程度。训练过程涉及为每个权重寻找合适的值。


    为不同问题或数据类型确定了多种神经网络结构。


    以下是值得注意的几个例子（并非完整列表）：


    *   `FFNN`: 最直接的神经网络结构方式，Feed Forward Neural Network (`FFNN`) 将神经元组织为一系列层，每层神经元的权重连接到上一层的所有神经元。


    *   `CNN`: 卷积神经网络 (`CNN`) 在网格化数据上使用嵌套的滤波器，是处理图像时最常用的模型类型。


    *   `RNN/LSTM`: 循环神经网络 (`RNN`) 及其相关的长短期记忆网络 (`LSTM`) 设计用于高效表示传统计算中的 for 循环，在迭代过程中收集状态，可用于处理序列数据。


    *   `Transformer`: 这是对 `RNN/LSTMs` 的更现代替代，Transformer 架构能够在涉及序列数据的更大数据集上进行训练。


    使用 Python 库进行机器学习


    对于经典模型（线性、基于树）以及一系列常用机器学习工具，请参考 scikit-learn。该库的官方文档组织得很友好，适合初学者了解空间，也可作为获取极富价值的工具和技术的入门途径。


    对于深度学习，`mxnet`、`tensorflow` 和 `pytorch` 是三大最常用库。为了满足大多数机器学习需求，这三者在功能上相互匹配且相当。


    术语


    超参数是模型上的设置，在训练过程中保持不变，但会影响模型训练的速度或可靠性，例如模型应识别的簇数量。


    `loss function` 用于编码模型相对于目标的距离。


    `Training dataset`: 用于训练模型的数据。大部分你的数据都在这里。


    `Test dataset`: 训练时保留下来的数据，用于评估模型在新数据上的泛化能力。


    模型参数是训练算法可以更新的设置或配置，用于改变模型的行为。


    Additional reading


    *   偏差-变异权衡（bias-variance trade-off）的维基百科条目可帮助你更好地理解这一常见机器学习概念。


    *   在本 AWS Machine Learning 博客中，你可以看到如何使用 Amazon SageMaker 训练机器学习算法来预测天气对空气质量的影响。


    ## Step Four: Model Evaluation


    在收集数据并训练模型后，你可以开始评估模型的表现。用于评估的指标通常与所定义的问题高度相关。随着你对机器学习理解的深入，你将能够探索更多种类的指标，从而更有效地进行评估。


    使用模型准确率


    模型准确率是一种常见的评估指标。准确率是模型预测正确的次数占总预测次数的比例。


    下面是一个示例：


    ![Image](img/image17.png)


    假设你构建了一个模型，用来根据可测量的特征（如花瓣长度）识别两种常见的花卉种类。你想知道模型正确预测物种的频率。这需要查看模型的准确率。


    Extended Learning


    以下内容未在上述视频中涵盖，供高级读者参考。


    使用 Log Loss（对数损失）


    对数损失用于计算模型对其预测的不确定性。这里的不确定性指的是模型对所生成预测正确的可能性的程度。


    ![Image](img/image18.png)


    例如，假设你在预测客户是否会购买外套或 T 恤。对数损失可以帮助你了解模型对给定预测的不确定程度。在单个实例中，模型可能有 5% 的把握认为客户会购买 T
    恤；在另一个实例中，模型可能有 80% 的把握认为客户会购买 T 恤。对数损失让你能够衡量模型对预测准确性的信心强度。


    在这两种情况下，模型都预测客户会购买 T 恤，但模型对该预测的置信度会随之变化。


    记住：此过程是 **iterative**


    ![Image](img/image19.png)


    我们经历的每一步都高度迭代，在整个项目过程中可能会被重新评估或重新定义。每一步都可能发现需要回到之前的步骤重新评估某些假设。不要担心！这种模糊性是正常的。


    Terminology


    `Log loss` 用于计算模型对其预测的不确定性。


    `Model Accuracy` 是模型预测正确的次数占总次数的比例。


    Additional reading


    '
