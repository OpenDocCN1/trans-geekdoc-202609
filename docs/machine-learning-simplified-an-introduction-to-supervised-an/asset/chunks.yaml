    \ eat. These are all verbs.\n\nClass, object, method, and attribute\n\nObject-oriented\
    \ programming (OOP) vocabulary\n\nClass: A blueprint consisting of methods and\
    \ attributes.\n\nObject: An instance of a class. It can help to think of objects\
    \ as something in the real world like a yellow pencil, a small dog, or a blue\
    \ shirt. However, as you'll see later in the lesson, objects can be more abstract.\n\
    \nAttribute: A descriptor or characteristic. Examples would be color, length,\
    \ size, etc. These attributes can take on specific values like blue, 3 inches,\
    \ large, etc.\n\nMethod: An action that a class or object could take.\n\nOOP:\
    \ A commonly used abbreviation for object-oriented programming.\n\nEncapsulation:\
    \ One of the fundamental ideas behind object-oriented programming is called encapsulation:\
    \ you can combine functions and data all into a single entity. In object-oriented\
    \ programming, this single entity is called a class. Encapsulation allows you\
    \ to hide implementation details, much like how the scikit-learn package hides\
    \ the implementation of machine learning algorithms.\n\nIn English, you might\
    \ hear an attribute described as a property, description, feature, quality, trait,\
    \ or characteristic. All of these are saying the same thing.\n\nHere is a reminder\
    \ of how a class, an object, attributes, and methods relate to each other.\n\n\
    ![Image](img/image72.png)\n\nA class is a blueprint consisting of attributes and\
    \ methods.\n\nOOP Syntax\n\nObject-oriented programming syntax\n\nIn this video,\
    \ you'll see what a class and object look like in Python. In the next section,\
    \ you'll have the chance to play around with the code. Finally, you'll write your\
    \ own class.\n\nFunction versus method\n\nIn the video above, at 1:44, the dialogue\
    \ mistakenly calls init a function rather than a method. Why is init not a function?\n\
    \nA function and a method look very similar. They both use the def keyword. They\
    \ also have inputs and return outputs. The difference is that a method is inside\
    \ of a class whereas a function is outside of a class.\n\nWhat is self?\n\nIf\
    \ you instantiate two objects, how does Python differentiate between these two\
    \ objects?\n\nshirt_one = Shirt('red', 'S', 'short-sleeve', 15)\n\nshirt_two =\
    \ Shirt('yellow', 'M', 'long-sleeve', 20)\n\nThat's where self comes into play.\
    \ If you call the change_price method on shirt_one, how does Python know to change\
    \ the price of shirt_one and not of shirt_two?\n\nshirt_one.change_price(12)\n\
    \nBehind the scenes, Python is calling the change_price method:\n\n def change_price(self,\
    \ new_price):\n\n self.price = new_price\n\nSelf tells Python where to look in\
    \ the computer's memory for the shirt_one object. Then, Python changes the price\
    \ of the shirt_one object. When you call the change_price method, shirt_one.change_price(12),\
    \ self is implicitly passed in.\n\nThe word self is just a convention. You could\
    \ actually use any other name as long as you are consistent, but you should use\
    \ self to avoid confusing people.\n\nExercise: Use the Shirt class\n\n![Image](img/image73.png)\n\
    \nShirt class exercise\n\nYou've seen what a class looks like and how to instantiate\
    \ an object. Now it's your turn to write code that instantiates a shirt object.\n\
    \nYou need to download three files for this exercise. These files are located\
    \ on this page in the Supporting materials section.\n\nShirt_exercise.ipynb contains\
    \ explanations and instructions.\n\nAnswer.py containing solution to the exercise.\n\
    \nTests.py tests for checking your code: You can run these tests using the last\
    \ code cell at the bottom of the notebook.\n\nGetting started\n\nOpen the Shirt\
    \ Exercise.ipynb notebook file using Jupyter Notebook and follow the instructions\
    \ in the notebook to complete the exercise.\n\nNotes about OOP\n\nSet and get\
    \ methods\n\nThe last part of the video mentioned that accessing attributes in\
    \ Python can be somewhat different than in other programming languages like Java\
    \ and C++. This section goes into further detail.\n\nThe Shirt class has a method\
    \ to change the price of the shirt: shirt_one.change_price(20). In Python, you\
    \ can also change the values of an attribute with the following syntax:\n\nshirt_one.price\
    \ = 10\n\nshirt_one.price = 20\n\nshirt_one.color = 'red'\n\nshirt_one.size =\
    \ 'M'\n\nshirt_one.style = 'long_sleeve'\n\nThis code accesses and changes the\
    \ price, color, size, and style attributes directly. Accessing attributes directly\
    \ would be frowned upon in many other languages, but not in Python. Instead, the\
    \ general object-oriented programming convention is to use methods to access attributes\
    \ or change attribute values. These methods are called set and get methods or\
    \ setter and getter methods.\n\nA get method is for obtaining an attribute value.\
    \ A set method is for changing an attribute value. If you were writing a Shirt\
    \ class, you could use the following code:\n\nclass Shirt:\n"
