- raw: '*   Practitioners use a process called model selection to determine which
    model or models to use. The list of established models is constantly growing,
    and even seasoned machine learning practitioners may try many different types
    of models while solving a problem with machine learning.


    *   Hyperparameters are settings on the model which are not changed during training
    but can affect how quickly or how reliably the model trains, such as the number
    of clusters the model should identify.


    *   Be prepared to iterate.


    Pragmatic problem solving with machine learning is rarely an exact science, and
    you might have assumptions about your data or problem which turn out to be false.
    Don’t get discouraged. Instead, foster a habit of trying new things, measuring
    success, and comparing results across iterations.


    Extended Learning


    This information hasn''t been covered in the above video but is provided for the
    advanced reader.


    Linear models


    One of the most common models covered in introductory coursework, linear models
    simply describe the relationship between a set of input numbers and a set of output
    numbers through a linear function (think of y = mx + b or a line on a x vs y chart).


    Classification tasks often use a strongly related logistic model, which adds an
    additional transformation mapping the output of the linear function to the range
    \[0, 1\], interpreted as “probability of being in the target class.” Linear models
    are fast to train and give you a great baseline against which to compare more
    complex models. A lot of media buzz is given to more complex models, but for most
    new problems, consider starting with a simple model.


    Tree-based models


    Tree-based models are probably the second most common model type covered in introductory
    coursework. They learn to categorize or regress by building an extremely large
    structure of nested if/else blocks, splitting the world into different regions
    at each if/else block. Training determines exactly where these splits happen and
    what value is assigned at each leaf region.


    For example, if you’re trying to determine if a light sensor is in sunlight or
    shadow, you might train tree of depth 1 with the final learned configuration being
    something like if (sensor\_value > 0.698), then return 1; else return 0;. The
    tree-based model XGBoost is commonly used as an off-the-shelf implementation for
    this kind of model and includes enhancements beyond what is discussed here. Try
    tree-based models to quickly get a baseline before moving on to more complex models.


    Deep learning models


    Extremely popular and powerful, deep learning is a modern approach based around
    a conceptual model of how the human brain functions. The model (also called a
    neural network) is composed of collections of neurons (very simple computational
    units) connected together by weights (mathematical representations of how much
    information to allow to flow from one neuron to the next). The process of training
    involves finding values for each weight.


    Various neural network structures have been determined for modeling different
    kinds of problems or processing different kinds of data.


    A short (but not complete!) list of noteworthy examples includes:


    *   **FFNN**: The most straightforward way of structuring a neural network, the
    Feed Forward Neural Network (FFNN) structures neurons in a series of layers, with
    each neuron in a layer containing weights to all neurons in the previous layer.


    *   **CNN**: Convolutional Neural Networks (CNN) represent nested filters over
    grid-organized data. They are by far the most commonly used type of model when
    processing images.


    *   **RNN/LSTM**: Recurrent Neural Networks (RNN) and the related Long Short-Term
    Memory (LSTM) model types are structured to effectively represent for loops in
    traditional computing, collecting state while iterating over some object. They
    can be used for processing sequences of data.


    *   **Transformer**: A more modern replacement for RNN/LSTMs, the transformer
    architecture enables training over larger datasets involving sequences of data.


    Machine Learning Using Python Libraries


    For more classical models (linear, tree-based) as well as a set of common ML-related
    tools, take a look at scikit-learn. The web documentation for this library is
    also organized for those getting familiar with space and can be a great place
    to get familiar with some extremely useful tools and techniques.


    For deep learning, mxnet, tensorflow, andpytorch are the three most common libraries.
    For the purposes of the majority of machine learning needs, each of these is feature-paired
    and equivalent.


    Terminology


    Hyperparameters are settings on the model which are not changed during training
    but can affect how quickly or how reliably the model trains, such as the number
    of clusters the model should identify.


    A **loss function** is used to codify the model’s distance from this goal


    **Training dataset**: The data on which the model will be trained. Most of your
    data will be here.


    **Test dataset**: The data withheld from the model during training, which is used
    to test how well your model will generalize to new data.


    Model parameters are settings or configurations the training algorithm can update
    to change how the model behaves.


    Additional reading


    *   The Wikipedia entry on the bias-variance trade-off can help you understand
    more about this common machine learning concept.


    *   In this AWS Machine Learning blog post, you can see how to train a machine-learning
    algorithm to predict the impact of weather on air quality using Amazon SageMaker.


    ## Step Four: Model Evaluation


    After you have collected your data and trained a model, you can start to evaluate
    how well your model is performing. The metrics used for evaluation are likely
    to be very specific to the problem you have defined. As you grow in your understanding
    of machine learning, you will be able to explore a wide variety of metrics that
    can enable you to evaluate effectively.


    Using Model Accuracy


    Model accuracy is a fairly common evaluation metric. Accuracy is the fraction
    of predictions a model gets right.


    Here''s an example:


    ![Image](images/image17.png)


    Imagine that you built a model to identify a flower as one of two common species
    based on measurable details like petal length. You want to know how often your
    model predicts the correct species. This would require you to look at your model''s
    accuracy.


    Extended Learning


    This information hasn''t been covered in the above video but is provided for the
    advanced reader.


    Using Log Loss


    Log loss seeks to calculate how uncertain your model is about the predictions
    it is generating. In this context, uncertainty refers to how likely a model thinks
    the predictions being generated are to be correct.


    ![Image](images/image18.png)


    For example, let''s say you''re trying to predict how likely a customer is to
    buy either a jacket or t-shirt.


    Log loss could be used to understand your model''s uncertainty about a given prediction.
    In a single instance, your model could predict with 5% certainty that a customer
    is going to buy a t-shirt. In another instance, your model could predict with
    80% certainty that a customer is going to buy a t-shirt. Log loss enables you
    to measure how strongly the model believes that its prediction is accurate.


    In both cases, the model predicts that a customer will buy a t-shirt, but the
    model''s certainty about that prediction can change.


    Remember: This Process is lterative


    ![Image](images/image19.png)


    Every step we have gone through is highly iterative and can be changed or re-scoped
    during the course of a project. At each step, you might find that you need to
    go back and reevaluate some assumptions you had in previous steps. Don''t worry!
    This ambiguity is normal.


    Terminology


    **Log loss** seeks to calculate how uncertain your model is about the predictions
    it is generating.


    **Model Accuracy** is the fraction of predictions a model gets right.


    Additional reading'
