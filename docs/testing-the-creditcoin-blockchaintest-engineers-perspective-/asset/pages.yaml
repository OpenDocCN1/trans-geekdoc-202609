- pgno: 220
  md: '# CHAPTER 8 HOW OTHERS TEST BLOCKCHAIN


    Due to the diversity of projects and teams at ChainSafe, and also in general,
    everyone''s definition of what “high quality” means is different. Andrew is going
    with a practical model following the ISO 25010¹² standard – high quality is the
    level to which the software under test satisfied the requirements posted by its
    stakeholders. This generic model is used as a guideline principle at ChainSafe
    which then evolves according to the product and blockchain-specific needs.


    According to Andrew, the challenges in terms of working with a blockchain are
    as follows:


    +   **Data immutability**: Blockchain state cannot be changed after it is recorded,
    and if your testing requires specific on-chain state, you can mitigate this by
    either using fresh testing accounts every time and/or using local and shared testnet
    chains. In Creditcoin I actually use fresh testing accounts most of the time coupled
    with the fact that the suite does not depend on the actual data itself – just
    that it is present! I am probably missing some test coverage here.


    +   **Finality**: This is the level of confidence that a recently appended block
    will not be removed from the chain. The challenge is there that there are multiple
    nodes which operate independently from one another, and it is entirely possible
    that your transactions make it into a block on a specific node A at the same time
    in which another node B produces a block. This is what we call forking, and a
    healthy blockchain will be able to resolve these forks and eventually all nodes
    will be consistent with one another. The challenge for development and


    ¹² www.iso.org/standard/78176.html'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'testing, especially for products like a bridge, is that when you examine the
    on-chain state, you may be looking at a fork of the canonical chain which would
    later be reverted, that is, it is not completely finalized yet. One way to resolve
    this is to wait for a certain amount of blocks, for example, 12, and then perform
    the assertions against the latest block. How much this grace period will be usually
    based on your intimate knowledge of the underlying blockchain. This is also more
    likely to be a challenge when working with cross-chain applications rather than
    when working on a single chain.


    +   **Latency**: The delay between cause and effect in the system that isn''t
    specific to blockchain, but according to Andrew it is more of a factor in blockchain
    testing scenarios. For some projects, ChainSafe deals with this by deploying their
    release candidate clients into shared environments, for example, Testnet, and
    then records performance stats in Grafana for a specific period, usually 2 weeks.
    You can think of this as a soak test. At the end of the soak period, the current
    baseline is compared against previous releases and/or baselines from rival host
    clients and/or stakeholder requirements.


    +   **Data retention/data availability**: This refers to the fact that historical
    blockchain and off-chain data may no longer be available if node operators are
    not incentivized to keep it around. This becomes even more important in the context
    of NFTs because in many chains an NFT is just an on-chain receipt pointing to
    an external URL. This external resource'
