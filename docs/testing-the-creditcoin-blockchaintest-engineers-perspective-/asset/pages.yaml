    Genesis block is number zero. It is usually hard-coded into the blockchain implementation,
    for example, your client program, and may contain metadata that''s necessary for
    the subsequent correct operation of the chain. For example, which account is the
    root account or a starting balance for a set of predefined addresses.


    A fork happens when the blockchain diverges into two potential paths forward.
    A fork may occur when multiple nodes produce a block at nearly the same time.
    The fork is resolved when subsequent blocks are added and one of the paths becomes
    longer than the alternatives.


    A hard fork usually occurs when there is a change to the blockchain protocol that
    is not backward-compatible and requires all users to upgrade their software in
    order to continue participating in the network. In a hard fork scenario, the blockchain
    network exists as two separate digital entities which are not connected to one
    another. Hard forks may also occur due to bugs in the software implementation
    and/or networking issues which lead to consensus failure. In other words, participants
    in the blockchain cannot come to an agreement which path forward should be the
    canonical one and the result is two separate chains.


    Since a blockchain is meant to be used as a source of truth, situations in which
    forks cannot be resolved and the result is a hard-fork considered to be critical
    and potentially damaging to the blockchain.


    Block finality refers to the irreversible confirmation of transactions on a blockchain,
    ensuring security and preventing double-spending. Block finalization is the process
    used to handle forks and choose the canonical chain where the majority of the
    participants are in agreement that blocks should not be reverted. In practical
    terms, this means two-thirds of all participants.'
