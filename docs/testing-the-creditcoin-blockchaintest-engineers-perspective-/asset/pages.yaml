    At the time of writing this book, I''ve been thinking about how to solve this
    challenge but still don''t have the full answer. The entirety of Creditcoin comprises
    several layers and applications I believe whatever analysis you do must encompass
    all of them. I am a firm believer that in the face of unknown technology, we should
    first strive to understand how it works in its core before trying to search edge
    cases and possible risks. Without in-depth understanding, we''re just guessing
    and that is not good enough in my opinion. The overall process will probably be
    something like this:


    +   Find all places, in all applications, or libraries, where a particular storage
    item/setting value is used.


    +   Create a list of the different functional areas where it is used, for example,
    https://github.com/gluwa/creditcoin3/pull/283#issuecomment-2015201729, because
    it not be immediately obvious or because other developers may have decided to
    add additional checks in unexpected places.


    +   Try to understand what all of the areas on your list are doing and how they
    work.


    +   Trace conditional expressions, and macros, for example, if statements and
    macros, which assert on the value you are analyzing, especially when they yield
    errors and panics. This is a clear indication something will go wrong under specific
