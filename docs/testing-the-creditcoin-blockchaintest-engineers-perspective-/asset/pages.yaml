  md: '# # About the Author


    ![](img/fdf35d2d28d1fdd7aff60f2490629a1b_10_0.png)


    Alexander Todorov is a quality assurance engineer and an ISTQB and Red Hat certified
    professional with two decades of industry experience, an open source hacker with
    thousands of contributions, a Python instructor, and co-organizer of FOSDEM’s
    Testing and Continuous Delivery devroom. He''s also tested multiple components
