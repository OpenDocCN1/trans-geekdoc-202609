  md: '# CHAPTER 3


    # # Introducing

    the Creditcoin

    Blockchain


    One of the main problems that Creditcoin addresses is the fact that millions,
    and even billions, of people in the developing world do not have access to the
    traditional banking system – that is, they simply do not have bank accounts. Such
    individuals cannot use credit as a financial instrument in order to improve their
    lives because this traditional instrument isn’t accessible to them by virtue of
    lacking bank accounts. In certain locations, there’s probably also a lack of brick-and-mortar
    infrastructure, for example, a farmer who is willing to take on debt in order
    to purchase machinery that will save hours of manual labor and therefore increase
    productivity. When you do not have access to infrastructure, this simply isn’t
    possible where Creditcoin comes in.


    # What Is Creditcoin


    Creditcoin started as a blockchain-agnostic investment protocol which allows participants
    to lend and borrow any cryptocurrency. On its website, it was also described as
    “Borderless Financial Platform” which had evolved'
  merge: -1
