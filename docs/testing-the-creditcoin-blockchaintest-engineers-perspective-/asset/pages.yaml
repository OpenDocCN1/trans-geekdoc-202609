    # Documentation Review


    Before the introduction of staking, the existing documentation for version 1.x
    and 2.0 included a fairly limited amount of user facing instructions. That was
    the so-called “Creditcoin Mining Node Setup” which basically told the user how
    to generate a public/private keypair and how to use their public address when
    starting a Creditcoin container. It has been removed in https://github.com/gluwa/creditcoin/pull/1505.


