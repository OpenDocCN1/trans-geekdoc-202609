- pgno: 66
  md: '# CHAPTER 4 CREDITCOIN 1.X


    # Transaction Processor(s)


    In the architecture of the Hyperledger Sawtooth framework, the set of possible
    transactions are defined by an extensible system called transaction families.
    Each application defines the custom transaction families for its unique requirements;
    this is the business logic of the blockchain application. In the case of Creditcoin,
    that is how we model a loan cycle and record its artifacts onto a blockchain.


    The Sawtooth framework allows application developers to write transaction processors
    in a programming language of their choice. The set of valid transaction families
    is initially configured inside the genesis block and is kept as an on-chain value
    which can be later altered. Creditcoin 1.x uses separate transaction processors
    which are running independently of each other as separate containers as part of
    a node.


    Settings-tp which started as hyperledger/sawtooth-settings-tp:1.0 (Python) and
    later hyperledger/sawtooth-settings-tp:1.2 (Rust). This transaction processor
    is responsible for storing on-chain settings like Gateway URL (see below), valid
    transaction families and their versions, consensus algorithm and its attributes,
    and others. It acts as a key-value pair stored on the blockchain, and it is also
    possible to define your own settings to be used by other components.


    The CREDITCOIN transaction family processor understands what a loan cycle is.
    Versions evolved from 1.0, 1.1, 1.2 all the way to 1.8. Each transaction sent
    by a client carries a version number and can be understood by a transaction processor
    with a compatible version number. In other words, that’s how you can upgrade the
    protocol. The CREDITCOIN family processor will parse the raw transaction payload
    using the Protocol Buffers data format and also perform housekeeping tasks like
    expired loan requests before handing off the transaction to the Validator component
    for writing onto the chain.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# CHAPTER 4 CREDITCOIN 1.X


    Creditcoin transaction processor versions 1.0 through 1.7 have been initially
    implemented in C++ and used mid-2021 when I started working on Creditcoin.


    Source code: https://github.com/gluwa/creditcoin-legacy/tree/dev/ccprocessor


    Around the same time, Creditcoin transaction processor was rewritten from scratch
    using Rust with backward compatible support for families 1.0 through 1.7, and
    that''s what I''ve mostly used. This new implementation was meant to be deployed
    as part of the switch to Sawtooth 1.2 mentioned earlier. Note that despite the
    fact that version scheme format looks like compatible SemVer, different versions
    of the transaction processor family may be incompatible with one another. This
    means blockchain operators using an older version may not be able to process transactions
    coming from new clients, and they should upgrade. For example, this could be due
    to a new transaction being added in later versions, which would fail if executed
    by an older transaction processor.


    Source code: https://github.com/gluwa/creditcoin-legacy-processor-rust


    # REST API


    The Sawtooth framework provides a REST API which allows clients and external applications
    to interact with the blockchain using common HTTP/JSON protocols. It provides
    a language-neutral interface for submitting transactions and reading blocks. Notably
    this is useful to query information about blocks during testing using curl or
    libraries for your favorite programming language. All responses are in JSON format.


    The REST API is a lightweight layer on top of Sawtooth''s internal ZeroMQ/Protobuf
    communication layer. Clients can bypass the REST API interface entirely and use
    ZeroMQ/Protobuf to communicate with the blockchain directly if they wish to do
    so.


