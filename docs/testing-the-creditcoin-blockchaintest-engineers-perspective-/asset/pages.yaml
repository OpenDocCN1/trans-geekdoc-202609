    Source code: https://github.com/gluwa/sawtooth-legacy-core/tree/dev/rest_api


    # Gateway


    The gateway component facilitates communication with external blockchains in order
    to validate transfers of crypto tokens. This is the so-called "off-chain worker"
    component in later versions. That is, it will make sure that when Creditcoin records
    loan transactions between Lender and Borrower, there are corresponding transfers
    between the two parties, for the same amount which are recorded on an external
    blockchain such as Ethereum.


    The Creditcoin gateway listens on a network socket for requests in the form:


    ```

    <blockchain> verify <source_address> <destination_address> <proof> <destination_amount>
    <transaction_id> <networkId or unused>

    ```


    The communication protocol between Gateway and the CREDITCOIN transactions processor
    is ZeroMQ and between Gateway and the blockchain RPC endpoint is target dependent,
    either using the Nether or NBitcoin libraries.


    This component is implemented in C# .NET and handles all requests asynchronously
    and in parallel. Gateway implements the Bitcoin, ERC20, Ethereum, and Ethless
    plugins with the vision that other blockchain networks could be supported in the
    future. As far as I am aware, only Ethereum has been tested and officially supported
    in production!


    Source code: https://github.com/gluwa/creditcoin-legacy-gateway'
