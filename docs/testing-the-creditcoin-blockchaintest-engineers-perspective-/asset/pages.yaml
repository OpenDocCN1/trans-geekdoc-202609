    interfaces. Then there are two new chapters “Nominator Guides” and “Validator
    Guides” which explain the two main roles in a nominated proof-of-stake blockchain
    and point the users to the respective application which can use.


    Becoming a validator in a proof-of-stake network is much more involved in becoming
    a miner in a proof-of-work blockchain and also includes multiple independent steps.


    Reviewing the documentation, both from QE and other stakeholders, means exactly
    that – review for typos, grammatical errors, items which don’t make sense, terms
    which are not clear or obvious to someone without experience, etc. It was an iterative
