- pgno: 55
  md: '# CHAPTER 3 INTRODUCING THE CREDITCOIN BLOCKCHAIN


    Information such as loan terms, repayments, and credit performance are available
    on the Creditcoin blockchain, facilitating easy and transparent risk assessment
    and connecting capital from Web3 to realworld credit investment opportunities.
    The Creditcoin blockchain itself is the necessary infrastructure for enabling
    the creation of other financial products related to loans, for example, a peer-to-peer
    lending platform, an investment platform, an exchange, or all of the above combined.


    The full schema of the original Creditcoin Loan Cycle is depicted on this page:


    https://docs.creditcoin.org/cc2/faq#how-does-the-creditcoin-network-use-ctc


    Creditcoin is multichain by design and shown on Figure 3-1. Data recorded natively
    into the Creditcoin chain represents loan terms and agreements and borrowing,
    lending, and repayment state between participants over time. For example, Alice
    may record that she is seeking a loan with the same terms, and finally record
    of their agreement (called a DealOrder) may be recorded. Creditcoin, at least
    in its original inception, does not support cryptocurrencies, which means that
    actual transfers happen outside of the Creditcoin network and is represented by
    third-party crypto tokens. For example, if lending in ETH, transactions are recorded
    on the Ethereum mainnet network. If using a different crypto token to record fiat
    currency transactions, then we may use other Ethereum-compatible networks such
    as Goerli or Sepolia. When funding on external blockchain happens, this must be
    recorded into Creditcoin. The actual record contains a transaction hash valid
    on the external chain, and the Creditcoin software will go to Ethereum, for example,
    to inspect and validate the information presented to it. The amount transferred
    between two participants and their addresses should match their identity and loan
    terms recorded previously in Creditcoin. Initial Creditcoin implementation in
    version 1.x came with proofof-concept code for Bitcoin as well; however, I am
    not aware if that has ever been used in practice.'
