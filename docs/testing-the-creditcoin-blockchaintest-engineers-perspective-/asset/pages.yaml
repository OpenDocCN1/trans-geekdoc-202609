    For example, validate.test ts uses an account XXXXX to become a validator with
    Bob''s node and then clean up properly after itself. On the next step, another
    test scenario generates an account YYYYY and also tries to become a validator
    controlling Bob''s node! In a severe hijacking the running Creditcoin node without
    cleaning up properly. That''s possible because configuring session keys for the
    node (e.g., rotate keys) is a permissionless operation, and as long as you have
    access to the running process (e.g., the RPC port), you can do this.


    This results in a state where the on-chain algorithms are expecting certain signatures
    before they can finalize a block, but those signatures never arrive because the
    validator accounts are no more. This breaks finalization which in turn breaks
    all client transactions. More precisely, transactions still make it into new blocks,
    but our tools, including the test automation suite, are designed to wait until
    a block is finalized before reporting an error. Because finalization never happens,
    everything becomes slow until commands and test jobs eventually time out.


    The solution to this problem is actually very simple – make sure test scenarios
    don''t have a shared state – that is, start a new independent chain before every
    group of test scenarios is executed as shown in Figure 7-4!'
