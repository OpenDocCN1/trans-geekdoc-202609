    These problems would never have been discovered if the staging environment wasn''t
    forked from production or if it had too few blocks (data in storage). This goes
    to show how important testing with your production data is! Also goes to show
    that good developer experience, for example, documentation and quality examples,
    can benefit both vendor and community developers directly.


    Another problem that was discovered with off-chain worker nonce management. Remember
    this is the component that talks to the outside world and a nonce is a unique
    number used during communications. The issue is that when a verification fails
    the off-chain worker still updates its nonce while the on-chain nonce doesn''t
    change. The off-chain worker can handle the situation when it sends a transaction
    and that transaction fails immediately, but there''s no way to check what''s the
    status of a transaction if it gets removed from the pool at some later time or
    doesn''t fail immediately. You end up with several failure scenarios on the next
    round:


    +   - OWC nonce is too small; on-chain nonce is higher – transaction will fail
    b/c the nonce has already used.


    +   - Two transactions with the same nonce in the transaction pool – one will
    be dropped from the pool, but you don''t know that it has been dropped. There
    are also other reasons transactions can be dropped from the transaction pool,
    and then the two nonce counters get out of sync.


