- pgno: 56
  md: '# CHAPTER 3 INTRODUCING THE CREDITCOIN BLOCKCHAIN


    The Creditcoin blockchain validates and records external artifacts such as addresses
    and transactions on other blockchains onto its own chain and also validates ownership
    of an address, for example, on Ethereum.


    The native crypto token on the Creditcoin blockchain is called CTC. It is used
    as a utility token to guarantee the economic stability of the blockchain itself.
    At the time of writing of this book, the CTC token is not used directly for lending.


    From a business point of view, the model behind Creditcoin can be described as
    Infrastructure as a Service. The primary consumer of this blockchain infrastructure
    is fintech partners who would like to record transactions onto the blockchain
    and are willing to access prior credit history and/or gain access to potential
    new markets and business opportunities that infrastructure enables. For example,
    one such partner is Aella in Nigeria. In fact according to the Creditcoin documentation,
    Aella is the first institutional user of the Creditcoin blockchain, having integrated
    its operations with Creditcoin in June 2022.


    Real humans engage in credit-related activities, for example, the farmer from
    my example or an investment agent can technically use the blockchain directly;
    that was even demonstrated in YouTube videos of the Creditcoin 1.x client strategy;
    however, I don''t think that was meant to be a viable long-term strategy. Such
    users are far more likely to use a mobile app for their day-to-day interactions,
    and this mobile app would communicate with the blockchain infrastructure either
    directly or via some sort of back-end API layer. In fact Gluwa, Inc. has also
    working on such an API layer named Credal²³ but I do not have much involvement
    in this area.


    > https://docs.creditcoin.org/cc2/faq#what-is-the-relationship-between-creditcoin-gluwa-and-aella


