  md: 'On to the bigger challenge - how can you analyze a proposed change in order
    to gain confidence nothing would break or that it would not cause unforeseen side
    effects? For example, we already know that changing block time is a no-go, and
    there are assertions in place in order to catch such a situation before it makes
