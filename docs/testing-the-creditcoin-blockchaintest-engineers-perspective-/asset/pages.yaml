- pgno: 128
  md: '# CHAPTER 5 CREDITCOIN 2.0


    on_initialize(). The naive implementation is to read everything from storage,
    iterate over it, filter items, and write back the rest. That caused memory allocation
    to grow past a certain boundary and caused a crash.


    The temporary solution the team wanted is to keep expired records in storage at
    the expense of some more disc space being b/c these are only relevant in the event
    where we have a loan marketplace which at the time of writing we didn''t have
    so the tradeoff was acceptable. See https://github.com/gluwa/creditcoin/pull/1253
    for more details.


    The technical background of this bug lies inside the Substrate framework. There
    is a maximum allocation limit of 32 MB inside the runtime, and Creditcoin was
    trying to allocate 52 MB; https://github.com/paritytech/substrate/issues/11132
    and https://github.com/paritytech/substrate/pull/11206.


    At the time when this appeared, the version of Substrate used to build the production
    release of Creditcoin was 10 months old hot-fixing by cherry-picking commits from
    upstream may not have been feasible. It could have exposed other risks we weren''t
    aware of so the team didn''t go down this path!


    These facts just go to show that every piece of testing infrastructure should
    be treated with the same attention as production infrastructure – monitoring,
    alerts, and all!


    It also goes to show that there may be bugs hidden inside your blockchain implementation
    that will surface months or even years later, depending on usage volume, and simulating
    extended usage of the blockchain is important. As fate would have it, Creditcoin
    2.3 exhibited a very similar issue.


