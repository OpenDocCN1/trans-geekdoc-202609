- pgno: 65
  md: 'While the consensus interface is responsible for determining who can publish
    a block, whether a published block is valid according to the consensus rules,
    and which block should become the chain head in the case of a fork, it is the
    validator component that will publish the blocks.


    The validator component in Creditcoin 1.x is based on the hyperledger/sawtooth-validator:1.0
    container image which is implemented in Python. The container image deployed for
    Creditcoin is a custom build with hot patches overwriting the original Python
    files related to proof of work!


    Note that toward the end-of-life of Creditcoin 1.x, there was an attempt to switch
    to hyperledger/sawtooth-validator:1.2 which itself is implemented in Rust, with
