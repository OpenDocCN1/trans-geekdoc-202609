- pgno: 132
  md: '# CHAPTER 6


    # Creditcoin 2.3


    Creditcoin 2.3 (technical version number), publicly referred to as Creditcoin
    2.0+ (2 plus), is the next significant release in the Creditcoin 2.x family. It
    is a natural successor of v2.0 and builds upon the existing implementation. The
    most noticeable change is the switch from a proof-of-work to a nominated proof-of-stake
    (NPoS) consensus algorithm.


    Note I will keep using the 2.3 version number in this book to make it a bit more
    explicit when I''m talking about the NPoS variant of Creditcoin 2!


    Participants in a proof-of-stake consensus mechanism compete for the opportunity
    to append blocks to the blockchain proportional to the amount of crypto tokens
    they have stake. In general more tokens are presumed to lead to greater chance
    of being chosen by the algorithm. Nominated proof of stake (NPoS) is a variation
    of the PoS consensus mechanism which allows other blockchain participants to vote
    for validators which act honestly.


    Operators running Creditcoin nodes are still known as validators. There is also
    a new group of participants known as nominators who can vote for validators using
    their own funds. That, nominators are saying we trust this validator(s) with our
    money because they have shown to act in good faith in the past. Remember that
    in general all of these participants are anonymous.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Components of Creditcoin 2.3


    From an operational point of view, Creditcoin 2.3 introduces several components
    to the blockchain, but most everything else stays the same! These components are
    forks of tools used by the Polkadot blockchain, which is a popular proof-of-stake
    blockchain and also the creators of the Substrate blockchain framework.


    # Staking-Related Pallets


    This component refers to Substrate''s stock pallets which enable staking capabilities
    such the ability to stake funds; the ability to vote for validators, penalties,
    and rewards for PoS participants; and the election mechanism determines the set
    of active validators who get to participate in a current era. In Creditcoin 2.3
    and later an era is defined as 24 hours comprising of 2 sessions all known as
    epochs.


    These pallets are included into the Creditcoin runtime with minor modifications
    to the pallets themselves. The runtime however defines some values for them, such
    as expected block time and epoch duration in blocks.


    This should not to be confused with the directory pallets/staking/src inside the
    Creditcoin source code. That was part of a former effort to decentralize the off-chain
    worker component which was later removed. Arguably the naming of this component
    had been chosen poorly.


    # Creditcoin-cli


    A nominated proof-of-stake blockchain requires a bit more interaction from all
    participants compared to a proof-of-work chain. While nominators have the Creditcoin
    Staking Dashboard web application, validators do not have a dedicated web interface.
    To be fair, there is the Polkadot JS Apps application, also known as the Substrate
    portal which'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# CHAPTER 6 CREDITCOIN 2.3


    can be used to configure a validator for any NPoS Substrate compatible blockchain.
    Instead of using this unbranded generic third-party interface, creditcoin-cli
    allows users to stake their funds, become validators, and perform a few other
    maintenance operations.


    This is a command line application written in TypeScript which is bundled together
    the docker image. All commands in the cli application talk to the blockchain via
    a WebSockets RPC endpoint. By default this is ws://127.0.0.1:9944 which is the
    address on which the creditcoinnode binary accepts RPC connections inside of a
    running container.


    The reason for this bundling together is that some RPC calls are considered unsafe
    and should not be exposed via the Internet - for example, rotating node keys.
    Pretty much everything is either querying the blockchain or requires the user
    to sign an extrinsic and be safely sent over any available RPC endpoint. The canonical
    RPC URL for Creditcoin 2 is ws://rpc.mainnet.creditcoin.network/ws, and cli commands
    can communicate directly with it.


    Because Creditcoin is a distributed system, it doesn''t really matter which RPC
    endpoint you point the application to. As long as a transaction is signed and
    is received by a running node, it will make its way to the underlying blockchain.
    It is entirely possible that the RPC node receiving the transaction is not the
    same node which will include transaction into a block. The only exception that
    I can think of is the aforementioned rotate-keys operation which talks to the
    node directly, doesn''t require a signature, and in a way bypasses the blockchain.


    # Switch_to_pos()


    This is a custom extrinsic which lives in a dedicated pallet of a similar name.
    Its job is to store the block number at which the switch from PoW to PoS happened,
    raise block difficulty to the maximum in order to prevent any of the existing
    PoW nodes from producing a block, and initialize the list of validators for the
    first proof-of-stake session'
