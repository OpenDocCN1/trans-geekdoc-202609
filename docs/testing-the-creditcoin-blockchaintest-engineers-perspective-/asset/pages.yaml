  md: '# CHAPTER 1 INTRODUCTION


    State is the current snapshot on the blockchain – the total number of blocks,
    the transactions recorded in these blocks, and the value(s) recorded in local
    storage. In practice when we talk about state, we mean a snapshot of the blockchain
    at a specific block. For example, the state at block 1000 is that Alice has a
    balance of 300 and Bob has none! In block 1010, the internal state has changed
    due to transactions which have been executed in the meantime. For example, Bob
    has earned a certain amount of tokens. When we talk about state, quite often we
    mean the last values recorded onto the blockchain ignoring previous history. Depending
    on the context, we may want to take into account prior history, probably if you
    are trying to reproduce a specific bug.


    Mining is the process of performing computationally intensive cryptographic operations
    as part of the proof-of-work consensus algorithm. Computers performing this work
    are known as miners. Broadly speaking, we also use the term miner referring to
    a computer and/or a human participating in a blockchain, regardless of the actual
    consensus algorithm.


    In cryptography and blockchain, a nonce is an arbitrary number that can be used
    just once in communication. It is often a pseudo-random number issued in an authentication
    protocol to ensure that all communications cannot be reused in replay attacks.


    Validator is a computer node that verifies the legitimacy of blockchain transactions.
    Also known as miners or minters, validators are the ones who participate in the
    consensus algorithm and gain privilege to append blocks to the blockchain. The
    process is entirely automated, and when we say “user,” we generally mean a computer
    participating in the blockchain network; however, keep in mind that this computer
    is operated by a human, the user, which may also be referred to with the same
    terms. The term validator is commonly used with proof-of-stake consensus algorithms,
    while miner is more commonly used with the proof-of-work algorithm.'
