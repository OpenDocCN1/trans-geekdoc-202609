  md: '# CHAPTER 4 CREDITCOIN 1.X


    The REST API component used in Creditcoin is a fork of hyperledger/sawtooth-rest-api
    with minor cosmetic patches on top. From what I can tell, the usage of a custom
    container was due to the fact that the original sawtooth-core repository is a
