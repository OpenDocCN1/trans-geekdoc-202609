- pgno: 243
  md: '+   - Minting tests: Verify minting functionality under various conditions
    – paused contract, locked public minting, exceeding mint limits.


    +   - Admin functions: Ensure only admins can perform certain actions, for example,
    setting token URI.


    +   - Exclusion list: Test functionality related to excluding addresses from royalty
    payments.


    +   - Sufficient balance check: Verify that NFT transfers only occur if the sender
    has sufficient tokens to cover royalties.


    +   - Market transfers: Test specific market transfer methods and related royalties.


    In a presentation titled Blockchain Testing Frameworks Challenges delivered few
    years ago at the TestWare testing conference in Poland, Sebastian mentions multiple
    blockchain components and layers on which we can and should test, but I need to
    point out that this does not apply to everyone in every situation. I argue that
    many blockchain-related applications focus only on certain layers of the stack,
    and this is where the majority of the testing will happen.


    In the example described above, The NFT Marketplace is essentially a smart contract,
    and depending on the business requirements, there may not be a need to go testing
    further than that. A counterexample is Creditcoin, where the primary testing is
    on the protocol layer. Even though Creditcoin 2.x we made a switch from proof-of-work
    to proof-of-stake consensus, we didn''t test the algorithm implementation itself.
    We tested the transitioning procedure, the ability to preserve on-chain data and
    block history, but the consensus algorithm itself is a ready-made component which
    our implementation ingested, almost as a drop-in replacement.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# CHAPTER 8 HOW OTHERS TEST BLOCKCHAIN


    One quote from the presentation which I particularly like is


    > How to test a smart contract if we don''t fully understand it and don''t have
    the knowledge and tools to test it?

    —Sebastian Viquez


    Definitely agree with this and just replace the words “smart contract” with whatever
    blockchain component you happen to be working with. I have worked primarily on
    testing the data model and transactions layer which is relatively straightforward.
    Regardless it took me a long time to be able to fully understand all of the components
    and their internal interactions I felt comfortable in my environment. If you as
    a tester are new to a project and new to blockchain technology, you are bound
    to go through the same experience.


    On the tools spectrum, I was surprised to learn about Hyperledger Caliper²⁰ a
    performance benchmarking tool which I could have used during the Creditcoin 1.x
    time frame. Instead my team and I went for in-house tooling because that''s what
    we know how to do, and frankly I joined relatively late in the development cycle
    to have any time to research and find this tool. During Creditcoin 2.x and then
    3.0, my team performed more performance benchmarking, and this time around we
    were aware of existing tools for the Substrate ecosystem. However, we went for
    in-house solutions again because the existing tools were not immediately suitable
    for our case, and it was just faster to create what we needed instead of figuring
    out how to workaround the limitations of a tool we had no experience with. This
    only goes to show that there are still areas in which the tooling and test framework
    ecosystem may not be mature enough or may not fit your particular testing needs.


    ²⁰ https://www.hyperledger.org/projects/caliper'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Summary


    As you have seen by now, blockchain testing can be very colorful. There are many
    areas in which we can test and also many tools that we can use. Despite that and
    despite the inherent complexity in certain software components, blockchain testing
    is not super different from traditional software testing.


    Thank you for reading so far into this book. I hope that you have enjoyed it and
    learned something valuable that you can apply in your day-to-day work!


    Happy testing!'
