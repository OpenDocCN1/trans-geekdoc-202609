    static analysis tools enabled:


    +   - Enable CI execution for every PR using GitHub Actions.

    - Deprecate older Azure Pipelines which were not kept under git.


    +   - Execute any obvious unit tests (e.g., cargo test), and start collecting
    coverage metrics where possible to inform further decisions.


    +   - Enable static analysis tools aka linters and code formatters (e.g., cargo
    check, cargo fmt), and see where we stand. Work on fixing reported issues.


    +   - Start using Dependabot for keeping dependencies up to date.


    +   - Build docker container for the component, and run sanity checks against
    it because that''s how it is supposed to be delivered.


    +   - Experiment with other static analysis tools to see what can be helpful (e.g.,
