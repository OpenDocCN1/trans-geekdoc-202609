- pgno: 15
  md: '# CHAPTER 1


    # Introduction


    Cryptographer David Chaum first proposed a blockchain-like protocol in his 1982
    dissertation “Computer Systems Established, Maintained, and Trusted by Mutually
    Suspicious Groups” with further improvements on this idea in the next 15–20 years.


    The decentralized blockchain was conceptualized by a person (or group of people)
    known as Satoshi Nakamoto in 2008 giving rise to Bitcoin. 2013 was the start of
    Ethereum which introduced smart contract functionality. Due to concerns over the
    high energy consumption required for cryptographic computations, later chains
    such as Cardano (2017), Solana (2020), and Polkadot (2020) started adopting the
    less energy-intensive proof-of-stake model.


    At present, we are witnessing continuously increasing interest and investment
    into blockchain technology with a multitude of companies searching for practical
    applications beyond cryptocurrencies. It is the time when blockchain technology
    is entering the world of the more common software engineering folks. It is also
    the time when blockchain technology is being productized, which leads to the necessity
    of testing for these products.


    As an experienced quality assurance engineer with nearly two decades of experience,
    I felt very intrigued about working in the blockchain testing space, yet at the
    same time, I felt extremely uncomfortable for a very long time. I have prior experience
    with testing low-level infrastructure type


    https://www.statista.com/topics/5122/blockchain/#statisticChapter'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# CHAPTER 1 INTRODUCTION


    software, like various parts of the Linux operating system, but didn''t have any
    experience with cryptocurrency or blockchain before. Because I was working on
    a product that was already in production, I needed to learn a lot of things very
    quickly in order to be a productive member of the team. It was like drinking from
    a firehose, and to this day it feels like that sometimes.


    This book is for the common tester and quality engineering folks, who may very
    soon be required to work on a blockchain software product without having the necessary
    understanding of what it is, how it actually works, and what is important in terms
    of "assuring" quality.


    Blockchain networks are distributed systems which are usually more complex compared
    to regular software products, and there are a myriad of items to be tested which
    requires a vast skill set. This book is not meant to be an exhaustive resource
    for every possible scenario; that is impossible. Instead, it is meant to tell
    my story as a blockchain test engineer and hopefully be your starting point in
    this domain.


    Happy testing!


    # Introduction to Blockchain


    There are multiple components in distributed systems like blockchain, and some
    of them are not necessarily common knowledge unless you have worked in this specific
    technical field. This chapter explains what a blockchain is and establishes some
    of the common terms used in this domain and gives you some examples.


    A blockchain is a growing list of records, called blocks, which are securely linked
    by cryptographic functions which guarantee that data is tamper proof. In the context
    of Figure 1-1, we can think each block as a snapshot of the current state at a
    specific period of time. If someone tries to modify this state at a later date,
    that would cause all of the blocks afterward to be invalid with respect to the
    modified block,'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'thus revealing data tampering. It is also referred to as a distributed digital
    ledger. Such architecture allows for participants who don''t trust each other
    to still have trust in the data recorded onto the blockchain.


    ![](img/fdf35d2d28d1fdd7aff60f2490629a1b_17_0.png)


    **Figure 1-1. Example of linked data blocks forming a blockchain**

    License: CC BY 3.0, source https://commons.wikimedia.org/wiki/File:Blockchain_landscape.svg


    Blockchain participants are individual operators who execute the blockchain client
    software on their computer systems. Their motivation is usually financial - to
    gain rewards for providing distributed computing resources to the blockchain.


    In order to record new information onto the blockchain, participants must be in
    agreement - for example, what is the answer to a difficult mathematical problem.
    This is known as consensus. By design, most blockchain systems are open for participation
    to anyone, and in many cases participants are anonymous, could be faulty (due
    to software or hardware bugs) or misbehaving (due to possible external incentive
    to falsify records in the blockchain), and generally cannot be trusted. It is
    the job of a consensus algorithm to ensure that participants in such a system
    can reach an agreement and to detect and exclude participants who are considered
    to be at fault. Otherwise, the blockchain software cannot proceed to the next
    step, which is recording actual data into storage.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# CHAPTER 1 INTRODUCTION


    Once new transactions are combined into a block and this block is distributed
    across multiple nodes in the blockchain, it cannot be erased or modified. The
    blockchain ensures full transaction history, and the use of cryptographic functions
    ensures that information recorded on the chain is secure by design. These records
    are essentially read-only. Algorithms and software architecture are chosen so
    that they guarantee these principles. The actual cryptographic, consensus, networking,
    and other algorithms and implementation architectures vary, and there is a lot
    of ongoing research in this space, but the underlying principle is ensuring data
    integrity as shown in Figure 1-1.


    Although many of today''s blockchain platforms are capable of supporting smart
    contracts and cryptocurrencies, these are not strictly required for the core operation
    of a blockchain as a secure distributed ledger. It is the opposite, being a secure
    distributed ledger, that makes the existence of smart contracts and cryptocurrencies
    possible.


    A blockchain implementation is an infrastructure type of software which on a very
    high abstraction level resembles a database – there is some data recorded in storage
    and the outside world, that is, other applications can read and write to the blockchain.


    Blockchain applications are usually more complex than other pieces of software
    that testers may be familiar with, with multiple components working in parallel
    and multiple networking channels and protocols being active at the same time.


    # Blockchain Attributes


    This section is included only for your reference. In a practical implementation,
    most of these attributes are available to you out of the box, courtesy of the
    chosen blockchain framework.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'The testing requirements around these particular attributes depend on your
    operational and business requirements and in practical implementations, for example,
    where you are not developing the underlying algorithms themselves, are most likely
    going to be resolved by having heavy monitoring and alerts rather than a functional
    test suite.


    +   - Security: Information on a blockchain is generally considered to be secure
    against modification so that historical records can be trusted. The blockchain
    is also considered generally secure against malicious actors because of its distributed
    nature


    +   - Fault tolerance: In a blockchain network, there may be nodes which exhibit
    faulty behavior or are downright malicious. Blockchain implementations have built-in
    tolerance against this.


    +   - Reliability: The probability that the blockchain will work properly in a
    specified environment and for a given amount of time. For nominated proof-of-stake
    consensus, this translates to having at least two-thirds of all elected validators
    online and functioning properly during the current era.


    +   - Reproducibility: Transactions on the blockchain can be replayed by another
    node which should always result in the same state, for example, same information
    stored locally on disk for the node replaying the transactions.


    +   - Transparency: Records on a public blockchain are accessible to everyone,
    and all state transitions, from genesis to the current block, can be replayed
    and verified individually. That is, even though participants are anonymous, all
    of their actions are fully transparent and can be retraced by anyone.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '+   Finality is the level of confidence that a well-formed block recently appended
    to the blockchain will not be revoked in the future and thus can be trusted. Most
    distributed blockchain protocols cannot guarantee the finality of a freshly committed
    block, and instead rely on “probabilistic finality”: as the block goes deeper
    into a blockchain, it is less likely to be altered or reverted by a newly found
    consensus.


    +   Public vs. private: Whether the blockchain is fully open to the public, for
    example, anyone can participate or not. Blockchains that you hear about the news
    are public, including Creditcoin.


    +   Permissionless vs. permission: Whether anyone can join an existing blockchain
    network, operate a node, and participate in consensus with/without first obtaining
    some sort of permission, approval, etc. Popular blockchains like Bitcoin, Ethereum,
    and of course, Creditcoin are permissionless.


    # # Blockchain Glossary


    **Transaction** like in a regular SQL database is an operation that seeks to append
    new information onto the blockchain. It is usually exposed as an API function
    so that users may interact with the blockchain. Blockchain transactions are usually
    a singular entity analogous to a single SQL statement executed against a traditional
    database. Transactions represent the blockchain’s business domain, for example,
    AddBidOrder for Creditcoin or transfer of Ether from one party to another in the
    case of Ethereum. There can be multiple transaction types supported by a blockchain
    network.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'A hash is the result of a one-way cryptographic function usually receiving
    binary data as input and returning a hexadecimal string! Each data has a unique
    hash representation, and you cannot reverse the hash value. Even a one-bit modification
    of the input data will result in vastly different hash value. This makes it safe
    to publicly share the hash value in lieu of the data itself and to use the same
    hash value to verify that two pieces of data are exactly the same thing.


    Transaction hash is a hexadecimal string representing the cryptographic hash of
    each transaction. Often these strings are used in lieu of identifiers. For example,
    https://etherscan.io/tx/0x8d16ea41628ac89745c95147c0ea394809074607395b0d792d1bea93628ob1
    represents a transaction where I have exchanged one crypto token (G-CRE) for another
    (ETH).


    Gas or transaction fee is the representation of how much it costs to execute a
    particular transaction on the blockchain. It can vary over time and between transaction
    types and is meant to represent the computational expense for the transaction.
    This value is usually represented by the blockchain''s native crypto token. The
    purpose of gas is related to token economics and also provides a security feature
    making malicious behavior economically non viable.


    A block explorer is typically a web application which allows the user to search
    and inspect blocks, transactions, and addresses on a blockchain. A popular one
    is Etherscan For a similar function is performed by Subscan (https://creditcoin3-testnet.subscan.io/)
    and Blockscout (https://creditcoin-testnet.blockscout.com).


    Block is a collection of multiple transactions that are recorded atomically onto
    the blockchain. Either all transactions within the block are recorded or none
    of them are. If we make an analogy with the git version control system'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# CHAPTER 1 INTRODUCTION


    While we may commonly refer to blocks as records, the meaning is different compared
    to a database record, which represents a singular collection of discrete values,
    in other words a row of column values. In the blockchain context, the term record
    is closer in meaning to the vinyl disk record which holds multiple songs.


    Blocks contain a list of transactions, references to the previous and next blocks,
    as well as additional metadata such as time stamps, cryptographic hashes, and
    signatures. There is a maximum limit of how many transactions can be stored in
    a single block, depending on implementation.


    Block fullness or block saturation level represents the percentage of how much
    of the total available space within a block is actually used. For example, if
    the blockchain is not in use, each block may hold a single heartbeat/timestamp
    transaction. Or may hold hundreds of transactions in a heavily used blockchain.


    Block hash is the hexadecimal string representing the cryptographic hash of each
    block. Very often these are used in lieu of addresses or identifiers. For example,
    03e89f72d1bc09af19759a94c34d769a94bb0ca9d257b2efe8adac0502cc11 corresponds to
