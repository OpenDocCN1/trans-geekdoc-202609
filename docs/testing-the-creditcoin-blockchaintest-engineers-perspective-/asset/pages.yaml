- pgno: 54
  md: '# CHAPTER 3 INTRODUCING THE CREDITCOIN BLOCKCHAIN


    since then. This protocol is detailed in a whitepaper which is published on the
    https://creditcoin.org website. Its first edition was published in 2017 and has
    been updated several times since then.


    The Creditcoin blockchain is the canonical, open source implementation of the
    Creditcoin protocol, built and maintained by Gluwa, Inc. It is a blockchain network
    for investment-related activities, which records loan transactions into a distributed
    public ledger. This allows representation of real-world assets and facilitates
    the connection between investors and fundraisers. The records are stored forever
    on the blockchain, and this data can be used for future credit evaluation by interested
    parties, for example, traditional lenders.


    Versions 1 and 2 mentioned in this book have a more narrow scope toward loan-related
    transactions, while the latest version 3 becomes more generic and evolves into
    a multichain credit protocol that powers real-world assets with native support
    of smart contracts. On the https://gluwa.com/ website, this latest iteration is
    dubbed “Technology powers global financial inclusion,” but I digress.


    ![](img/fdf35d2d28d1fdd7aff60f2490629a1b_54_0.png)


    Figure 3-1. Schematic depiction of Creditcoin'
