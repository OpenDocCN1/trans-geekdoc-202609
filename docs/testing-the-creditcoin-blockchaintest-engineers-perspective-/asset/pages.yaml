- pgno: 64
  md: '# CHAPTER 4 CREDITCOIN 1.X


    creditcoin SendFunds amount sighash

    creditcoin RegisterAddress blockchain address network

    creditcoin RegisterTransfer gain transferId TxId

    creditcoin AddAskOrderId amount interest maturity fee expiration

    creditcoin AddBidOrderId amount interest maturity fee expiration

    creditcoin AddOfferOrder bidOrderId expiration

    creditcoin AddDealOrder offerId expiration


    bitcoin RegisterTransfer gain dealOrderId|repaymentOrderId sourceTxId

    ethereum RegisterTransfer gain dealOrderId|repaymentOrderId

    rc20 RegisterTransfer gain dealOrderId|repaymentOrderId


    This application reads configuration from a json file and then communicates with
    the REST API endpoint of a single node in the Sawtooth network diagram. It can
    be any node, but usually that''s the publicly facing URL for Creditcoin or a node
    that you may be running yourself. This component is written in C#.NET.


    Source code: https://github.com/gluwa/creditcoin-legacy-client


    # Validator


    In the Sawtooth framework, the validator component ensures that the same transactions
    result in the same state transitions and that the resulting data is the same for
    all participants in the network. The validator has two major subcomponents that
    use schedulers to calculate changes and the resulting Merkle hashes based on transaction
    processing. These subprocess are responsible for creating new candidate blocks,
    completing published blocks and validating proposed blocks to determine if they
    should be considered for the new chain head. Although the name is the same, please
    do not confuse this with a validator as defined in the scope of Creditcoin 2 and
    later.'
