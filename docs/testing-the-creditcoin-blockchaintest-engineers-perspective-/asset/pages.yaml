  md: '# CHAPTER 7


    # Creditcoin 3.0


    Creditcoin 3.0 is the next evolution of the Creditcoin evolving from a specialized
    blockchain to record loan transactions into a more generic chain targeting real-world
    asset management. It is a fully EVM-compatible Layer 1 blockchain. In other words,
    it supports smart-contract development and is compatible with many popular tools
    used in the Ethereum ecosystem, for example, wallet apps and smart-contract development
    tools. Creditcoin 3.0 is built with the Substrate framework adding a special EVM
    compatibility layer on top of it and uses the nominated-proof-of-stake consensus
    algorithm


    The two main design features are EVM compatibility and the so-called Universal
    Oracle which unlocks multi-chain information streams and cross-chain transactions
    to build and deploy multi-chain contracts. Development is performed in phases,
    and at the time of writing this book, only the EVM compatibility layer has been
    implemented.


    Creditcoin 3.0 is proposed as an independent blockchain, rather than an incremental
    upgrade from the 2.x family which again greatly simplifies development and testing.
    The original proposal also states that Creditcoin 2 functionality will be implemented
    as L2 on Creditcoin 3.0. I am assuming that what would be a [set of ] smart-contract(s)
    able to record the loan cycle flow. At the time of writing, these implementation
    details are non-existent though.'
