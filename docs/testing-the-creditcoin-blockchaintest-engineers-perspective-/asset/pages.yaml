- pgno: 203
  md: 'Any operation related to staking will need to be followed by an unbound transaction
    eventually, then waiting for a downtime period and then withdrawal of funds. In
    such scenarios there may be more steps, more actors, and more waiting involved.
    The period is based on block time and number of eras, for example, one validation
    cycle. When doing all of this locally or in CI, it is relatively quick, and you
    also have full control over all values and the environment. When doing the same
    in production, the difference is drastic - era is 24 hours. Unbinding period is
    7 days. Certain operations also depend on when exactly during these 24 hours you
    issue the transaction leading to even wait time. It’s a rolling window of time
    which can take anywhere between 12 and 36 hours for the effect to take place.


    Obviously you cannot have your test suite running for 7 days and waiting to clean
    up after itself - that is just a waste of resources. You can split it up and execute
    the cleanup portion separately via cron - this opens up the question of storing
    and sharing credentials between test suites/cleanup tools.


    This also brings the question of how to assert on long running tasks which are
    straightforward to automate? For example, becoming a validator on the Creditcoin
    blockchain is a relatively easy process; there is even the wizard command in the
    cli which performs all steps for you. However this command only signals an intention.
    The results do not take effect immediately. It can take anywhere between 12 and
    36 hours, assuming everything else is is good for a participant to become an active
    validator after they signal their intentions and the respective transactions make
    it into a block.


    How do you assert that whatever the test did actually result in the expected outcome?
    How do you make sure that dynamically provisioned resources, for example, a virtual
    machine or a container, do not get recycled before they are actually needed or
    are left dangling afterward?


    One possibility here is only manual testing disregarding the fact that you spent
    time to automate your test suite. Another possibility is a'
