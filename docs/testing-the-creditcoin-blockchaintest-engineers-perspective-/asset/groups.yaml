  mdcn: "\n\n## 第 4 章 CREDITCOIN 1.X\n\n在流程方面，我建立了一种模式，让测试工程师参与代码审查、漏洞验证，最好是直接在现有的拉请求（pull\
    \ request）上进行测试，并在任何合并之前将工单标记为已完成（DONE）！为代码审查建立了一份清单，其中一项是必须添加新的单元测试/集成测试。还启用了分支保护规则，并要求在合并拉请求之前至少需要两个批准。你可能会辩说这不是测试人员的工作，但我会反驳。如果它可以提高质量，那么这就是我的职责！\n\
    \n在此期间，我尝试更深入熟悉 Hyperledger Sawtooth 框架以及 Creditcoin 1.x 的各种组件，以便开始添加用 Rust 编写的单元和集成测试。由于优先级、时间限制以及\
    \ Sawtooth 的特性，我在这方面没有成功。我只成功为一些独立函数添加了几个明显的单元测试，远没有我预期的那么多。在接下来的章节中，你将看到 Creditcoin\
    \ 2 与此完全相反。\n\n这段时间的大精力放在集成测试套件上，并利用它完成即将到来的 v1.7 到 v1.8 的切换。1.8 的事务族与旧版本不兼容，而且几乎所有其他组件都发生了变化，这使得我们需要对这一迁移路径进行更严谨的执行和测试。\n\
    \n由于 Sawtooth 节点由多个独立组件组成，每个组件都作为一个独立的容器运行，因此直接在拉请求上进行测试并不容易。你需要硬件资源来启动一个独立的区块链，而且功能更改往往分散在多个组件中。这意味着进行孤立测试是不切实际的。实际上，我经常做的是检出相关的拉请求，有时将相关的提交拾取（cherry-pick）到一个临时分支；然后重新构建所有组件的\
    \ docker 镜像，并使用之前提到的 `docker-compose` 文件启动本地链。由于主测试套件是一个集成类型套件，与其它组件相比具有不同的访问控制（即在\
    \ GitHub 上不是公开的），因此执行它最可行的方法是将其配置指向新创建的链，并手动启动所有测试场景。考虑到现有的基础设施，将其自动化并非不可能，但也不十分实用。\n\
    \n尽管并非不可能，但使用集成类型测试套件在分布在多个不同仓库、使用多种不同编程语言编写的多个组件上收集覆盖率指标是不切实际的。因此，我不清楚现有测试套件对实现的覆盖程度和彻底程度。我分析了现有测试套件的源代码，据我所知，它至少执行了一次贷款周期中的所有事务，包括正向和反向场景。是否缺少了某个测试场景，或者某些场景之间实际上是重复的，我并不知道，而且情况并不显而易见。\n\
    \n### 测试的改进\n\n我将这一节命名为“测试的改进”，因为当时我对 Creditcoin 1.x 的所有组件还非常陌生，而且测试策略的可视化和实现在这一时期处于起步阶段。因此，这一部分更多是我根据\
    \ GitHub 历史记录对我对 Creditcoin 1.x 早期贡献的重要说明。\n\n- 维护私有的 `creditcoin-legacy-tests`\
    \ 测试套件及相关的性能基准测试。\n- 为每个拉请求实现粗略的 CI 支持——单元测试、代码检查器（linter）、收集代码覆盖率——最初是为了更熟悉代码库，建立“测试覆盖率”的基线，并找到我可以取得进展的领域。这适用于：\n\
    \  - `creditcoin-legacy-consensus-rust`\n  - `creditcoin-legacy-processor-rust`\n\
    \  - `creditcoin-legacy-shared`\n- 我认为“实验”一词适用于为某些用 Rust 编写的组件添加小型单元测试。我并没有在这个任务上花费太多时间，而且当时整个组件架构和实现对我来说仍然很模糊，所以我的效率并不高。\n\
    \n启用分支保护规则，并要求合并前至少需要两个批准，包括我通过审查清单进行的首次流程改进，如图 4-2 所示。\n\n| 更改描述 |\n| :--- |\n\
    | 代码审查清单 |\n| 目标分支为 dev，除非我们从 dev 合并到 main |\n| 所有 CI 检查报告显示通过 (PASS) |\n\n**图\
    \ 4-2. 代码审查清单**\n\n这份清单后来演变为包含更多细节，但这是最早的版本之一。在我写这本书时，我看到另一个开源项目的同事类似清单；他们的好得多。每一项都是指向页面的超链接，提供有关特定需求或如何执行特定任务的更多细节和示例。\n\
    \n> 注意：作为测试人员，我们绝对应该利用这种格式，让清单链接回文档和示例，因为对于在仓库内部工作的每个人来说，这样效率高得多！\n\n对于派叉（forked）仓库\
    \ `gluwa/sawtooth-legacy-core: gluwa/sawtooth-legacy-sdk-rust`，我最初启用了 GitHub Actions，希望我们可以直接使用他们已有的任何测试。这种做法是短暂的，因为当时\
    \ Hyperledger Sawtooth 使用的是 Jenkins 而不是 GitHub Actions，我没有足够的时间进行完全迁移，也没有兴趣为两个仓库部署并维护一个独立的\
    \ Jenkins 实例。相反，我满足于编译、代码检查和单元测试 CI 任务，只要我不需要执行配置 CI 流水线和执行几个 `cargo` 命令之外的任何其他操作即可。\n\
    \n我让 `creditcoin-legacy-gateway` 对来自外部的畸形消息更具健壮，这是我在处理无关任务时发现的。我还更新了 `docker-compose`\
    \ 文件中的 `restart_policy`，因为节点有时会内存溢。\n\n在每个可能的仓库中启用 Dependabot，以便我们可以保持更新。Dependabot\
    \ 起于一家独立公司，后被 GitHub 收购，可以在新版本可用时自动跟踪依赖并打开拉请求。对于 C# .NET 仓库（主要是 `creditcoin-legacy-shared`），可以使用\
    \ SonarCloud 作为静态分析工具，它暴露了许多代码异味（code smells）。然后我工作修复了其中的许多问题。有人可能会这不是测试人员的工作，但我不同意——我是一名测试工程师，在能够做到的情况下我不反对修复代码。\n\
    \n## 第 4 章 CREDITCOIN 1.X\n\n如果我们看我最喜欢的定义：\n\n静态分析是……在不实际执行程序的情况下对计算机软件进行的分析……在源代码的版本上进行……\n\
    \n> https://en.wikipedia.org/wiki/Static_program_analysis\n\n特别是参考文献 15、16 和 17，我们将看到与测试人员的职责存在重叠。我是静态分析工具的坚定支持者，事实上还使用、讨论过并举办过如何使用自定义规则扩展或构建自己的静态分析工具的工作坊，这可以帮助你在测试金字塔的阶段0\
    \ 检测到漏洞或潜在错误。\n\n在 Creditcoin 1.8 开发期间，添加了一个名为 `RegisterOrder` 的新事务。这也是与 Creditcoin\
    \ 旧版本不兼容的原因。这个新事务作为一个方便的入口，在内部记录与理想独立事务相同的状态。我为 `RegisterOrder` 编写了新的集成和性能测试，并实际上检查了它在链上产生的副作用与它本要封装的其他事务产生的结果是否一致！毕竟贷款就是贷款，无论你使用多少个事务将其记录到区块链中——结果必须是相同的。\n\
    \n由于 Creditcoin 的几乎每个组件都以 docker 镜像分发，因此需要 CI 任务来不断构建和检查这些容器。这里的初始测试侧重于 Dockerfile\
    \ 中包含 `HEALTHCHECK` 命令以及内部使用只读文件系统。\n\n"
