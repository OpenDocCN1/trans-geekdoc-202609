    preconditions I as part of the system test in order to assert on specific behavior.
    That is, the majority of testing for Creditcoin happens before anything gets merged
    and deployed into an existing network. By extension this also negates the need
    for many testing activities after a new version of the blockchain is deployed.
    This has probably saved me from having to deal with many practical challenges,
    but it is certainly something to think about depending on how your organization
    and you personally approach testing.


    # Summary


    In this chapter, I''ve introduced the blockchain development frameworks I''ve
    used and talked a bit about the differences between them and how that affects
    testing.


    In the next chapter, I will introduce you to what Creditcoin is and how it works
    which will be the basis for subsequent chapters where I share my testing journey
    with you.'
