    git 仓库整体重组。


    源代码：https://github.com/gluwa/creditcoin-legacy/tree/dev/PoW


    ## 共识


    Creditcoin 1.x 使用由团队开发的的工作量共识引擎，该引擎通过 Sawtooth 内部互连协议与验证器组件直接连接。它使用 Rust 语言实现。由于
    git 历史没有追溯到我加入 Creditcoin 团队之前，我不完全确定这个共识实现是从一开始就存在的，还是它替换了之前存在的另一种实现。


    源代码：https://github.com/gluwa/creditcoin-legacy-consensus-rust


    # 第 4 章 CREDITCOIN 1.X


    ## 交易处理器(s)


    在 Hyperledger Sawtooth 框架架构中，所有可能的交易由一个名为“交易族”（transaction families）的可扩展系统定义。每个应用程序都根据其独特需求定义自定义交易族；这就是区块链应用程序的业务逻辑。在
    Creditcoin 中，我们通过这种方式模拟贷款周期并将其产物记录在区块链上。


    Sawtooth 框架允许应用程序开发者使用他们喜欢的编程语言编写交易处理器。有效交易族的集合最初被配置在创世区块（genesis block）中，并作为链上值保留，之后可以进行修改。Creditcoin
    1.x 使用独立的交易处理器，它们作为节点的一部分，以独立容器的形式相互运行。


    Settings-tp 起始于 `hyperledger/sawtooth-settings-tp:1.0` (Python)，后来演变为 `hyperledger/sawtooth-settings-tp:1.2`
    (Rust)。该交易处理器负责存储链上设置，如网关 URL（见下文）、有效交易族及其版本、共识算法及其属性等。它以键值对的形式存储在区块链上，你也可以定义自己的设置供其他组件使用。


    CREDITCOIN 交易族处理器能够理解什么是贷款周期。版本从 1.0、1.1、1.2 一直演进到 1.8。客户端发送的每条交易都带有一个版本号，并可以被兼容版本号的交易处理器理解。换句话说，这就是你升级协议的方式。CREDITCOIN
    族处理器会使用 Protocol Buffers 数据格式解析原始交易负载，并在将交易移交给验证器组件写入链上之前，执行诸如清理过期贷款请求等清理任务。


    # 第 4 章章 CREDITCOIN 1.X


    Creditcoin 交易处理器版本 1.0 到 1.7 最初是使用 C++ 实现的，并在我 2021 年年中开始工作 Creditcoin 时投入使用。


    源代码：https://github.com/gluwa/creditcoin-legacy/tree/dev/ccprocessor


    大约同时，Creditcoin 交易处理器使用 Rust 从头重写，并对 1.0 到 1.7 族提供了向后兼容，这也是我主要使用的部分。这个新实现旨在作为前面提到的切换到
    Sawtooth 1.2 的一部分。请注意，尽管版本方案格式看起来像兼容的语义化版本（SemVer），但不同版本的交易处理器族之间可能是不兼容的。这意味着使用旧版本的区块链节点可能无法处理来自新客户端的交易，他们应该进行升级。例如，这可能是因为后续版本中增加了新的交易，这些交易如果由旧的交易处理器执行将会失败。


    源代码：https://github.com/gluwa/creditcoin-legacy-processor-rust


    ## REST API


    Sawtooth 框架提供了一个 REST API，允许客户端和外部应用程序使用常用的 HTTP/JSON 协议与区块链交互。它为提交交易和读取区块提供了一个语言无关的接口。值得注意的是，这在测试期间使用
    `curl` 或你喜爱的编程语言的库来查询区块信息时非常有用。所有响应均为 JSON 格式。


    REST API 是 Sawtooth 内部 ZeroMQ/Protobuf 通信层之上的轻量级层。如果客户端需要，可以完全跳过 REST API 接口，直接使用
    ZeroMQ/Protobuf 与区块链通信。


    59


    # 第 4 章 CREDITCOIN 1.X


    Creditcoin 中使用的 REST API 是 `hyperledger/sawtooth-rest-api` 的分支，并带有微小的外观补丁。据我观察，使用自定义容器是因为原始的
    `sawtooth-core` 仓库是一个单体仓库而非其他的。


    源代码：https://github.com/gluwa/sawtooth-legacy/tree/dev/rest_api


    ## 网关 (Gateway)


    网关组件促进与外部区块链通信，以验证加密代币的传输。这就是所谓的“链外节点”（off-chain worker）组件。也就是说，它确保当 Creditcoin
    记录贷款人和借款人之间的贷款交易时，外部区块链（如以太坊）上存在相应的传输。


    网关监听网络套接字格式如下的请求：


    ```

    <blockchain> <source_address> <destination_address> <proof> <destination_amount>
    <transaction_id> <networkId>

    ```


    网关与 CREDITIN 交易处理器之间的通信协议是 ZeroMQ，网关与区块链端点的通信取决于目标，要么使用 Nether 或者使用 NBitcoin 库。


    该组件用 C# .NET 实现，并异步且并行地处理所有请求。网关实现了 Bitcoin、ERC20、Ethereum 插件，愿景是未来能够支持其他区块链网络。据我所知，只有以太坊通过了测试并在环境中获得了官方支持。


    源代码：https://github.com/gluwa/creditcoin-legacy-gateway


    ## SDKs


    Sawtooth-SDK-Rust 和 Sawtooth-SDK-Cxx 是各自仓库的分支，用于 Creditcoin 交易处理器的开发。它们包含了许多发布给
    Creditcoin 的补丁。


    源代码：https://github.com/gluwa/sawtooth-legacy-sdk-rust https://github.com/gluwa/sawtooth-legacy-sdk-cxx


    Creditcoin-Shared 是一个 C# 库，被一些用该语言编写的组件使用，例如被网关组件使用。


    源代码：https://github.com/gluwa/creditcoin-legacy-shared 注意，在过渡到 Creditcoin 2.0 后，所有与
    1.x 相关的仓库都已重命名，包含 `legacy-` 前缀。我们那时所谓的处理器现在被称为 `creditcoin-legacy-processor-rust`！在本书的其余部分，我将在论及各种组件时使用当前名称，以尽量减少混淆。


    ## Creditcoin-Legacy-Tests


    这是 1.x 发布系列的主测试套件。它是一个集成测试套件，通过 RPC 端点向区块链发送交易。它在外部触发并执行，并位于独立的 git 仓库中。遗憾的是，源代码仓库不公开，因此我们不会在书中过多讨论它。


    当我开始研究该仓库时，其中大部分基础工作已经存在，我添加了一些改进和新的测试场景，但没有更改测试套件本身的整体架构。同一代码库也被用作起点

    '
