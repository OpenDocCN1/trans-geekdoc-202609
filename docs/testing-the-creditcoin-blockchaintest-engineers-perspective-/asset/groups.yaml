    # CHAPTER 3 INTRODUCING THE CREDITCOIN BLOCKCHAIN


    The Creditcoin blockchain validates and records external artifacts such as addresses
    and transactions on other blockchains onto its own chain and also validates ownership
    of an address, for example, on Ethereum.


    The native crypto token on the Creditcoin blockchain is called CTC. It is used
    as a utility token to guarantee the economic stability of the blockchain itself.
    At the time of writing of this book, the CTC token is not used directly for lending.


    From a business point of view, the model behind Creditcoin can be described as
