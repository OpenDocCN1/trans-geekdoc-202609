    ## 第四章 CREDITCOIN 1.X


    创建一个性能基准工具。该测试套件最初主要使用 C#.NET 和 MSTTest 编写，后来使用了 NUnit 测试框架。


    ## Creditcoin-Legacy-Docker-Compose


    用于 Creditcoin v1.x 主网的 Docker Compose 文件。该仓库作为 Creditcoin 1.x 各组件各种 docker 镜像的权威参考，并作为如何启动必要组件以成为网络参与者的示例配置。它是创建用于测试目的配置的起点。


    源代码：https://github.com/gluwa/creditcoin-legacy-docker-compose


    ## Creditcoin-Legacy-Docker-Compose-Testnet


    这是后文讨论的测试用仓库。它包含了用于部署隔离测试环境的配置文件和 docker 镜像引用。


    后来，该仓库还由社区成员监控，以获取即将发布的 Creditcoin 1.8 版本 Beta 测试所需的最新容器版本信息！


    源代码：https://github.com/gluwa/creditcoin-legacy-docker-compose-testnet


    ## Creditcoin 1.x 时间线


    根据 GitHub 和 Docker Hub 上的公开历史，我可以梳理出以下时间线。这里主要用于背景参考。


    - 1. 我于 2021 年 6 月 17 日开始与 Creditcoin 团队合作。

    - 2. 我的第一个拉请求（pull request）似乎出现在 2021 年 7 月 13 日。

    - 3. Creditcoin 1.7.1 于 2021 年 7 月 23 日发布，我没有参与。

    - 4. 基于 Sawtooth 框架的 Creditcoin 1.8 镜像于 2022 年 3 月 28 日由 Docker Hub 发布，作为 1.x
    网络的最后一个版本。


    实际上测试了 1.x 系列的最后更新，大约花费了 6 个月，如果信息仅部分可用，请见谅。更多时间戳请见后续章节。


    ## 测试 Creditcoin 1.x


    在谈论 Creditcoin 1.x，特别是关于测试以及如何改进团队工作以获得更高质量软件的话题时，我们必须考虑此发生的时间段。在我看来，测试随着流程和组织变更而出现是不可避免的。


    这里关注的时期大约是 2021 年，期间团队为每个组件使用了 GitHub 上的个人公共仓库。这也是团队转型为一名全职 QA 工程师（我本人）直接嵌入团队的时期。


    仓库创建时间线：


    - 2018 年 11 月 27 日：创建 https://github.com/gluwa/creditcoin-legacy。

    - 2019 年 2 月 28 日：创建 https://github.com/gluwa/creditcoin-legacy-docker-compose-testnet。

    - 2019 年 7 月 29 日：创建 https://github.com/gluwa/creditcoin-legacy-docker-compose。

    - 2021 年 4 月 14 日：https://github.com/gluwa/sawtooth-legacy-sdk-cxx 在 fork 中首次提交。

    - 2021 年 4 月 17 日：创建 https://github.com/gluwa/creditcoin-legacy-shared。

    - 2021 年 4 月 17 日：创建 https://github.com/gluwa/creditcoin-legacy-client。

    - 2021 年 5 月 22 日：https://github.com/gluwa/sawtooth-core 在 fork 中首次提交。

    - 2021 年 5 月 28 日：创建 https://github.com/gluwa/creditcoin-legacy-processor-rust。

    - 本人加入团队。

    - 2021 年 8 月 3 日：创建 https://github.com/gluwa/creditcoin-legacy-consensus-rust。

    - 2021 年 9 月 21 日：https://github.com/gluwa/sawtooth-legacy-sdk-rust 在 fork 中首次提交。

    - 2021 年 9 月 29 日：创建 https://github.com/gluwa/creditcoin-legacy-gateway。


    CI（持续集成）启用时间线：


    - 2020 年 2 月 25 日：creditcoin-legacy-docker-compose-testnet - GitHub Pages 构建的
    CI 状态，此仓库中没有实际测试。

