    A nominator is a participant in the blockchain which votes with their funds in
    favor of selected validators. In proof-of-stake networks, nominators are a role
    of users who can participate in the blockchain without needing much technical
    knowledge to operate a blockchain node. They are sometimes also known as “investors”
    because they only use their funds, as opposed to technical operators.


    [Crypto] token is some sort of digital token that is used to represent value on
    the blockchain in order for the blockchain network to be economically sustainable.
    Validators are rewarded tokens in exchange for operating hardware that supports
    the blockchain and the data stored within it.


    Tokens such as BTC, ETH, CTC, and others are referred to as cryptocurrency which
    may take a life of its own. Because a token is a representation of value, it can
    be exchanged for other tokens of value, for example, paper money, also called
    fiat currency, or another digital token. Token economics is outside the scope
    of this book.


    The existence of crypto tokens is usually a must for public blockchain networks
    because Private networks with stricter access control and/or focus on solving
    a particular business problem would rarely need crypto tokens. The expected profit
    of solving the business problem at hand provides the necessary motivation for
    operators of such networks.


    Note Blockchains usually have what''s called a native token or a utility token
    which is meant to facilitate operating the blockchain. Then there can be other
    tokens, also known as coins, which could be exchanged, traded, or used for any
    other purposes. It is not uncommon that such coins are attributed significant
    value just because of their existence, not because of their technical utility.


    ## CHAPTER 1 INTRODUCTION


    [crypto] wallet address is represented as a long hexadecimal string which holds
    information about different crypto tokens and their balance owned by whoever controls
    it. The hex string is used as the wallet address and in practice represents the
    public key of a private-public key pair. In general wallets are anonymous accounts
    on the blockchain. Note that this address is relevant to a particular blockchain.
    My address on Ethereum is 0x718bb20f2ab1937710d2Ac579d97835a6fD099C. My address
    may not exist on other blockchain networks. It is also important to note that
    different blockchains may use different address formats and representation. In
    Ethereum the length is 20 bytes represented by 40 hexadecimal digits as shown
    before. In Subcoin, the Substrate framework, the format is 32-byte account identifier;
    however, not all addresses in Substrate-based networks are based on keys.


    Since the algorithms generating these addresses have very low probability of collisions,
    wallet addresses are practically unique and can be used across blockchains as
    long as the format is supported. In practice, the first time a transfer is made
    to a particular address, the “account” behind it will start to exist on that particular
    blockchain.


    A wallet app is an application which holds your public/private keys and allows
    the user to interact with a blockchain by signing transactions for transferring
    or exchanging different crypto tokens. Most commonly that is a web browser extension
    or a mobile application. Popular wallet apps, for example, are MetaMask and SubWallet,
    but there are many more available with varying functionality. For example, the
    financial mobile application Revolut also contains features of a crypto wallet,
    allowing you to purchase tokens, send transfers to other addresses, or make investments
    in crypto, even though its feature scope is much larger. Because wallet apps hold
    private keys and allow the user to sign transactions, they are often one of the
    most visible software pieces for a user interacting with a blockchain.


    Note that depending on context, the term wallet may refer either to the address
    of an account, to the user facing application used to manipulate funds in this
    account or both.


    ## CHAPTER 1 INTRODUCTION


    A crypto faucet is a quick way of rewarding users with small amounts of crypto
    tokens in exchange for performing various tasks on a website or mobile application.
    The tasks user completes could be clicking on a paid ad, completing a CAPTCHA
    test, logging in every day, or interacting with a Discord bot, for example. In
    a blockchain testing environment, your team will have internal/external faucets
    to help testers acquire some cryptocurrency and use it for testing.


    Mainnet, testnet, devnet, and stagenet are separate instances of a blockchain
    network. They are isolated from one another, and you can have as many as you need
    for testing and development purposes. Unique accounts, tokens, blocks, and transactions
    will exist in each instance of the network. The instance called mainnet is the
    production environment. The rest are assigned more or less arbitrarily by the
    blockchain creators. Some blockchains may have multiple test and development environments
    denoted by names.


    Staking is the action of committing a certain amount of crypto tokens in order
    to participate in the proof-of-stake consensus mechanism. This applies to both
    validator and nominator roles. The economic incentive is higher return on investment.
    While similar to traditional investment instruments, the process of staking by
    itself is meant to be a process where the user is actively engaged in order to
    ensure a healthy community for the blockchain. Remember that a blockchain is a
    highly distributed environment and the more participants the better.


    Slashing is the process of applying penalties (taking away tokens) to a malicious
    validator in a Proof of Stake blockchain network thus making such behavior economically
    viable. Slashing also extends to nominators,


    ## CHAPTER 1 INTRODUCTION


    and that''s why it is recommended for participants in blockchain staking to be
    active and monitor what''s happening on the blockchain regularly. For example,
    do not vote for a validator and then forget about it.


    Client is any software program that communicates with a blockchain. In the context
    of a blockchain application, we usually mean the software program that is executed
    natively on the computer and implements the various components of the blockchain.
    That''s typically the program which acts as a validator on the blockchain. In
    a broader context, a client can also refer to a wallet application or to yet another
    application interacting with the blockchain, for example, a staking dashboard
    or a telemetry dashboard. It can also mean an application designed to interact
    with a particular contract.


    Some some implementations have a separate runtime component that encapsulates
    the transactions and business logic while the client itself is delegated lower
    level tasks of communicating over the network, writing to storage, etc.


    Web3 is an idea for a new iteration of the World Wide Web which incorporates concepts
    such as decentralization, blockchain technologies, and token-based economics.
    The term was coined in 2014 by Ethereum co-founder Gavin Wood.


    A smart contract is a program written in a particular language, for example, Solidity,
    and stored on a blockchain capable of executing such programs. Not all blockchains
    support smart contracts. The most popular example is implementing a cryptocurrency
    token, say stored on Ethereum mainnet; however, smart contracts are not limited
    to that. Examples demonstrate transactional games such as tic-tac, voting, blind
    auctions, payment channels, and more. I think everything that can be represented
    as transactions can be programmed into a smart contract.


    The core properties of a smart contract are that it cannot be changed once deployed
    onchain (it is tied to a particular address or transaction hash) and that interactions
    with the smart contract are transparent, represented in the form of transactions,
    even though participants on all sides may be anonymous and not necessarily trust
    each other. Smart contracts may also execute other smart contracts by calling
    functions exposed by them. Execution of functions defined inside a smart contract
    is recorded as transactions on the blockchain. Once deployed onchain, smart contracts
    cannot change; however, you can deploy newer versions of the contract which results
    in a different contract address. Smart contracts have the concept of contract
    storage, aka storage, available internally to the contract which can hold information
    such as token balances for a newly created cryptocurrency.


