    Creditcoin 2.0 automatically refreshes type definitions when running tests in
    CI and will automatically commit and push these changes to the current branch
    of a pull request. To avoid infinite CI loops, the majority of GitHub jobs aren''t
    repeated on the automated commit. To make it clear - all types are updated before
    any tests are executed in CI, and only if these tests are passing the changes
    are included in a commit.


    # Benchmarks and Weights Generation with Gluwa-bot


    In Substrate a benchmark is a programmatic way of discovering the computational
    complexity of an on-chain operation as an extrinsic. Generally speaking, it is
    related to the number of storage reads and writes. Benchmark files are written
    by a human.


    Then benchmarks are executed as part of CI to make sure that they compile and
    that they dont crash. This is the sanity testing portion.


    Before a release benchmarks are executed on reference hardware, and the generated
    weights are committed to the release branch. Because that''s different from the
    dev branch, the same commit is automatically rebased and published as a pull request
    against the dev branch too. This ensures that everything gets released also makes
    through the dev branch to minimize deviations in the future and the need to resolve
    conflicts in git, especially during the release process.


    # Migrations and Upgrade Testing


    From the in-house pallets, only pallet/creditcoin/ actually contains storage migrations.
    They are named sequentially, v1, v2, v3, etc., and each one of them is exercised
    via unit test in a mocked environment.'
  - '[PAGE 114]


    That is to make sure the migration functions functions as expected - in other
    words storage items are actually migrated (think DB migrations in ORM apps). This
    mocked environment also exercises pre/post migration hooks as an early warning
    against errors inside of migration functions. Yet some uncertainties remain:


    +   - We have missed corner cases

    - Will the migration work with actual production data


    These uncertainties are addressed by two extra test jobs:


    +   1) Simulating the upgrade process and making sure it won''t crash


    +   2) Simulating on-chain state and local storage and making sure storage migrations
    will be applied without crashing


    The same simulations are executed via two different methods:


    +   1) Via try-runtime: This is a functionality set made available by the Substrate
    framework which allows an upgrade and migrations to be simulated in-memory. It
    will query a production RPC endpoint for the current on-chain state and replicate
    that locally in memory. Then it will execute the migrations against the local
    in-memory storage. If nothing fails, we''re considering this success. This can
    be viewed as a sanity test of runtime upgrades. The detailed upstream documentation
    at https://paritytech.github.io/try-runtime-cli/try_runtime/


    +   2) Fork the chain and upgrade: This method is closer to reality as it consumes
    the real production data and performs a real runtime upgrade (in isolation).'
  - '[PAGE 115]


    # CHAPTER 5 CREDITCOIN 2.0


    First we start a creditcoin-node and synchronize with an already existing blockchain
    – for example, Testnet or Mainnet, depending on which our release target is. Then
    using a helper tool called creditcoin-fork, https://github.com/gluwa/creditcoin-fork,
    the current on-chain state is scraped and recorded into a JSON file. This json
    file represents a new chain specification, where the genesis block is a replica
    of the latest on-chain state. This allows us to execute a local chain whose storage
    items match the production version but still inject development accounts into
    it and execute it independently. When the newly created local chain is up and
    running, perform the runtime upgrade which triggers the storage migrations. When
    that passes, execute the integration test suite against the fork to make sure
    the fork is still functionally to the origin.


    For upgrade and migrations testing, we''re using self-hosted GitHub runners which
    are deployed on-demand in Azure. This is because the upgrade and migration workflows
    require lots of memory – 16 GB at the very least. Block import process is also
    computationally intensive.


    Storage migration hooks are instrumented in two ways in order to facilitate these
    testing activities:


    +   - A pre and post hook for every migration which allows us to share state before
    and after the migration for the purposes of assertions. Since storage migrations
    are executed at runtime, we''re making use of the fact that the assert ! macro
    in Rust will cause a runtime panic, that is, it will cause the process to crash
    if the assertion fails. A non-zero exit code will cause the CI job to report a
    failure.'
