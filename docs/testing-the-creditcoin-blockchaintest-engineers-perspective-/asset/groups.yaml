    注意，区块链通常拥有所谓的原生代币（native token）或实用代币（utility token），用于方便区块链的操作。然后可能存在其他代币，也称为币（coins），它们可以被交换、交易或用于任何其他目的。这些币仅仅因为它们的存在而被赋予巨大价值的情况并不罕见，而不是因为它们的技术用途。


