    \nSawtooth 的初始版本是用 Python 实现的，随后某些组件用 Rust 重新实现。\n\n注意：GitHub上的原始 Hyperledger\
    \ Sawtooth 仓库已在其维护者的请求下于2024年2月1日（本书编写期间）存档。该代码库的持续维护发布已移至 Splinter 社区，地址为 [https://www.splinter.dev](https://www.splinter.dev)。\n\
    \nHyperledger Sawtooth 是 Creditcoin 1.x 区块链的开发框架，我在其生命周期后期接触过它。\n\n## Substrate\n\
    \nSubstrate ([https://substrate.io](https://substrate.io)) 是一个区块链框架，声称是快速构建自定义、面向未来的区块链的最强大的框架。它允许开发者构建专门的区块链应用程序。Substrate\
    \ 由 Polkadot 网络和 Parity Technologies 领导，后者由以的首任 CTO Gawin Wood 领导。\n\n使用 Substrate\
    \ 构建自己的区块链出奇地简单，你可以按照他们的教程快速入门。参见 [https://docs.substrate.io/tutorials/build-a-blockchain/build-local-blockchain/](https://docs.substrate.io/tutorials/build-a-blockchain/build-local-blockchain/)。这里的核心概念是可组合性——你的区块链实现由多个称为“pallets”（小节）的组件组成，这些组件在运行时胶合在一起。\n\
    \nSubstrate 使用 Rust 编程语言构建，而 Polkadot 的其他工具则使用 TypeScript —— 这些通常是客户端库和前端应用程序。\n\
    \nCreditcoin 2.x 及更高版本是使用 Substrate 构建的。\n\n## Ethereum\n\n我个人没有在以太坊上进行过任何开发和测试，提到它是因为它非常流行。Geth\
    \ 似乎是用 Go 语言实现的主要的以太坊客户端；参见 [https://github.com/ethereum/go-ethereum](https://github.com/ethereum/go-ethereum)。因为该实现是开源的，完全可以分叉它并修改代码，以创建你喜欢的风格的自定义区块链。这显然是\
    \ Muscoin 链的做法。另一方面，你更有可能在以太坊主网上部署一个智能合约，而不是构建一条自定义链。\n\n无论哪种情况，以太坊都有很多开发工具可用；如果你感兴趣，参见\
    \ [https://ethereum.org/en/developers/docs/frameworks/](https://ethereum.org/en/developers/docs/frameworks/)。\n\
    \n## 编程语言\n\n本书讨论的编程语言在 Creditcoin 1.x 期间是 Python、C++ 和 C#.NET 的丰富混合，而在 2.0 及之后的版本中主要是\
    \ Rust 和 TypeScript。\n\n**Rust** 是一种通用的编程语言，强调性能、类型安全和并发。它在没有垃圾回收器的情况下强制执行内存安全。Rust\
    \ 是一种静态类型和强类型的函数式语言，是系统编程的流行语言，包括像区块链这样的分布式系统以及 Linux 内核。\n\n开发者 Graydon Hoare\
    \ 在 2006 年于 Mozilla Research 工作期间将 Rust 作为一个个人项目。Mozilla 在 2009 年正式赞助了该项目，从那时起，该语言被快速采用。以下是\
    \ Rust 中 Hello World 程序的样子。\n\n### 列表 2-1. Rust 中的 Hello World\n\n```\nfn main()\
    \ {\n    println!(\"Hello, World!\");\n}\n```\n\n在 Rust 中，开发者可以使用 `struct` 或 `enum`\
    \ 关键字创建用户定义类型，并使用 `impl` 关键字为这些类型附加方法。Rust 受到许多其他语言的影响，并不是完全的面向对象的。虽然你可以使用带有数据和方法的用户定义数据类型（它们看起来像类），但\
    \ Rust 并没有真正的 OOP 继承概念。相反，Rust 使用泛型、trait（特征）和多态。如果你对 trait 不熟悉，可以将其看作是接口定义，它需要在所有预期支持该接口的数据类型中进行实现。\n\
    \n从测试人员的角度来看使用 Rust 有几个“已知问题”：\n\n- 编译器是你的朋友——内存安全几乎排除了随机的运行时失败；强类型意味着几乎不可能在不应该使用变量的代码块中误用变量（例如，复制粘贴问题）。\n\
    - 语言内置了良好的自动化测试设施。\n- 测试可以并行执行。\n- 断言（Assertions）通过宏执行，当它们失败时会产生运行时 panic（恐慌崩溃）。\n\
    - 从头编译需要相当长的时间，因此保留构建缓存非常重要。\n- 流行的代码覆盖率和静态分析工具对 Rust 的支持可能较差，因为它仍然是一种相对较新的语言。\n\
    - “单元”测试和“集成”测试代码之间的区别很小，如果你对该语言不熟悉，可能不会立即显现。\n- 内置测试框架中没有共享设置/清理（setup/teardown）的语法。\n\
    \n关于 Rust 语言特别是测试的更多信息，请参见 [https://doc.rust-lang.org/book/ch11-testing.html](https://doc.rust-lang.org/book/ch11-testing.html)。\n\
    \n**TypeScript** 是带类型的 JavaScript。TypeScript 是一种构建 JavaScript 之上的强类型编程语言。\n\n\
    ### 列表 2-2. TypeScript 中的 Hello World\n\n```\nconst message: string = 'Hello,\
    \ World!';\nconsole.log(message);\n```\n\n之前提到的 Rust 的优点同样适用于这里。TypeScript 编译器和\
    \ linter 是最好的朋友，并为你捕捉错误。一个巨大的奖励是流行的 TypeScript 测试框架拥有 TypeScript 绑定并为第三方工具和服务提供了更多选择。网站：[https://www.typescriptlang.org/](https://www.typescriptlang.org/)。\n\
    \n在 Substrate/Polkadot 生态系统中，选择的选择是流行的 Jest 测试框架，我在测试 Creditcoin 时广泛使用了它。如果你来自\
    \ Web 应用程序测试的背景，可能有足够的经验快速上手。我的个人背景远离 Web，但在开始时只遇到了一些小问题。\n\nSolidity 是一种静态类型的大括号编程语言，用于开发运行在以太坊和其他兼容\
    \ EVM 的链上的智能合约。\n\n### 列表 2-3. Solidity 示例 Hello World\n\n```solidity\n// 编译器版本必须大于等于\
    \ 0.8.24 且 0.9.0\npragma solidity ^0.8.24;\n\ncontract HelloWorld {\n    string\
    \ public greet = \"Hello World!\";\n}\n```\n\n该示例表示一个存储特定值的智能合约，它没有暴露任何外部调用的函数，仅用于说明。更多信息请参见\
    \ [https://soliditylang.org](https://soliditylang.org)。\n\n虽然 Creditcoin 起初并不是智能合约平台，但一直存在与智能合约交互的需求——记住，在加密货币中进行的实际贷款转账和还款是在外部区块链上进行的。在后来的\
    \ Creditcoin 3.0 版本中，智能成为了了一等公民。\n\n智能合约本身的测试超出了本书的范围，我个人在该领域没有经验。至少能够阅读和理解 Solidity\
    \ 代码是非常重要的，以便在意外与智能合约交互的边界情况下使用。\n\n"
