    # CHAPTER 8 HOW OTHERS TEST BLOCKCHAIN


    # # On Test Automation and Tools


    Given the diverse nature of products and their stages of maturity, there isn''t
    a one-size-fits-all requirement for test automation and code coverage metrics
    at ChainSafe. During the period in which a product is undergoing rapid iteration
    and proof-of-concept, there is usually not much investment in test automation.
    Teams are more likely to wait until the architecture model has stabilized before
    to work on test automation and enabling CI jobs on pull requests in GitHub. This
    usually happens when new functionality is being added to the product under test.


    In terms of programming languages and testing frameworks, ChainSafe teams are
    using the defaults coming from the language when it comes to unit and integration-type
    testing in the same repository which ranges Go, Rust, and TypeScript. The rule
    of thumb for Andrew is "use the standard testing tools built into the language."
    This is what he calls "core-testing."


    As we go up the testing pyramid into e2e and UAT testing, the tools become a bit
    more standardized with a clear preference to use Cypress for anything that touches
    a user interface. Using Cypress however hits limitations when you have to interact
    with browser extensions that sign and submit transactions to the underlying blockchain
    - it isn''t directly supported, although there are around and third-party plugins;
    see https://github.com/cypress-io/cypress/issues/16703 and https://github.com/cypress-io/cypress/issues/14808.
    Hacking Cypress to speak to a browser extension is however, ChainSafe prefers
    not to add complexity into their testing tools as they lose the ability for introspection
    when sending commands from Cypress to the extension and the ability to listen
    to blockchain events which may not be reported/observable through the DOM or rather
    may not be observable through the extension itself.'
