    You can find several more libraries on the ChainSafe GitHub page:


    https://github.com/orgs/ChainSafe/repositories?q=web3.


    ChainSafe is also very proud of their cypress-polkadot-wallet plugin; however,
    this is not a core product but rather one of their testing tools more on it a
    bit later.


    ## Browser Extensions and Distributed Applications


    - Polkadot Snap for MetaMask¹⁰ is a MetaMask plugin for interacting with distributed
    apps on Polkadot and other Substrate-based chains because a vanilla MetaMask installation
    can only work with Ethereum compatible chains.

    - Multix¹¹ is an interface to easily manage complex multi-signature wallets on
    the Polkadot blockchain.


    ## Testing Strategy


    Andrew, like myself, is coming into the blockchain world from a traditional software
    development and testing background. His value proposition is to bring his existing
    expertise into the blockchain domain. In practical terms, this means to balance
    the need for blockchain development to be nimble and fast yet at the same time
    define some processes like collecting product requirements, establishing process
    of reviewing pull requests, creating test plans and executing them, adding test
    automation, and so on.


    While my original impression was that there aren''t many engineers in blockchain
    because of the inherent complexity of distributed systems and also the relatively
    unfamiliar programming languages, Andrew brings a slightly different point of
    view:


    ¹⁰ https://github.com/ChainSafe/metamask-snap-polkadot

    ¹¹ https://github.com/ChainSafe/Multix


    - Blockchain development is still a pretty niche area in the world of software
    development. It''s mostly made up of smaller teams and the technology stack is
    still new, so it can be tricky to find talent in general and testers in particular.

    - Partly because of the immutability aspect, and I also think partly because of
    the nature of distributed systems, blockchain developers seem to have a higher
    level of testing experience compared to other domains in the IT industry. Or probably
    they are just more experienced developers because they need to be in order to
    work in this domain space.

    - In terms of testing at the unit and integration layer we see a lot; however,
    this is done by developers as one of many other responsibilities and is not a
    dedicated effort.

    - Having someone who''s really focused on quality process and risk mitigation
    is super important as building a high-quality product is much more than just test
    creation and test execution.


    I will also add that some blockchain-related startups have been working on speculative
    coins and were under pressure to cut corners and seek fast exit rather than follow
    a traditional software development process and build a quality product.


    # CHAPTER 8 HOW OTHERS TEST BLOCKCHAIN


    Due to the diversity of projects and teams, and also in general, everyone''s definition
    of “high quality” is different. This generic model is used following the ISO 25010
    standard²².


    According to Andrew, the challenges in terms of working with blockchain are as
    follows:


    - **Data immutability**: Blockchain state cannot be changed after it is recorded,
    and if your testing requires specific on-chain state, you can mitigate this by
    either using local and/or shared testnet.

    - **Finality**: This is the level of confidence that a recently appended block
    will not be removed from the chain. The challenge is there are multiple nodes
    which operate independently from one another, and it is entirely possible that
    your transactions make it into a block on specific node A the same time in which
    node B produces a block. This is what we call forking, and a healthy blockchain
    will be able to resolve these forks and eventually all nodes will be consistent
    with one another. Testing, especially for products like a bridge, is that when
    you examine the on-chain state, you may be looking at a fork of the canonical
    chain which would later be reverted, that is, it is not finalized yet. One way
    to resolve this is to wait for a certain amount of blocks, for example, 12, and
    then perform the assertions against the latest block. How much this grace period
    will be based on your intimate knowledge of the underlying blockchain. This is
    also more likely to be a challenge when working with cross-chain applications
    rather than working on a single chain.

    - **Latency**: The delay between cause and effect in the system that isn''t specific
    to blockchain, but according to Andrew it is more of a factor in blockchain testing
    scenarios. For some projects, ChainSafe deals with this by deploying their release
    candidate clients into shared environments, for example, Testnet, and then records
    performance stats in Grafana for a specific period, usually two weeks. You can
    think of this as a soak test. At the end of the soak period, the current baseline
    is compared against previous releases and/or baselines from rival host clients.
    own- **Data retention/data availability**: This refers to the fact that historical
    blockchain and off-chain data may no longer be available if node operators are
    not incentivized to keep it around. This becomes even more important in the context
    of NFTs because in many chains an NFT is just an on-chain receipt pointing to
    an external URL. external resource


    ² www.iso.org/standard/78176.html

