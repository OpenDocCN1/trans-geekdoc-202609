    注意：智能合约是一种记录在区块链本身上的计算程序！它可以在链上存储数据、执行其他智能合约程序并发出事件。用户通过向部署智能合约的地址发送交易来与智能合约进行交互。从用户的角度来看，这些交互是通过
    MetaMask 等钱包应用程序完成的。


    ## 被测试产品


    在本书中，我们将使用一个虚构名称来称为待测试的应用：NFT 市场（The NFT Marketplace）。请注意，该名称和描述是虚构的；但核心产品功能并非如此。


    **提示：非同质化代币或 NFT** 是唯一的数字资产，记录在区块链上，并带有可以通过密码学验证的所有权。NFT 的元数据使其具有独特性，这意味着没有两个
    NFT 是完全相同的。例如，这些元数据可以链接到数字文件。你可以将 NFT 视为一个标识符或收据，用于证明所有权和真实性。“非同质化”意味着它是独一且不能被其他东西替代；换句话说，每个代币都是非常具体的。另一端是普通的加密货币代币，它们是同质的，也就是说它们彼此相似并且可以轻松交换。


    NFT 是通过被称为“铸造”（minting）的过程创建的，该过程还涉及与智能合约的交互。铸造 NFT 的主要目标是将你的数字内容放到区块链上，同时保留你数字艺术或物品的所有权。根据实际使用的区块链，NFT
    指向数字艺术可能使用链上或链外存储！


    实现 NFT 的智能合约遵循区块链生态系统中已建立的标准，例如 ERC-721 和 ERC-1155。相比之下，流行的加密代币遵循另一个标准，例如 ERC-20。关于这些标准的更多信息可以访问
    https://veavid.com/blog/erc20-vs-erc721-vs-erc1155/。


    数字内容可以被无限复制，没有办法区分一个文件和另一个文件，也就是说，原始和副本之间没有区别。使用 NFT 的唯一标识符有助于区分不同的 NFT —— 即即使它们的内容相同，也能区分不同的数字文件。这反过来为数字世界中寻求通过其作品获利的创作者们开启了更多可能性。


    NFT 市场应用程序允许其用户根据其订阅级别与代表图像的 NFT 资产进行交易。用户可以查看、购买、出售、拍卖不同的数字资产。他们还可以获得价值积分，并根据其他用户的交互监控其资产价值的增长，例如，他们的图片获得了多少点赞。


    NFT 市场应用程序由传统的 Web 2.0 前端、一个铸造过程以及一系列智能合约组成，这些合约负责：


    - 管理用户账户，其中定义了多个角色：普通用户、管理员、艺术家。每个角色允许不同的功能集。

    - NFT 铸造过程，涉及创建数字物品或文件、设计随物品艺术品、建立带有代码的文本文件、将文件上传到 NFT 智能合约并在 NFT 市场上发布。

    - 处理资产交易，例如转移给其他用户。在铸造过程中，使用智能合约分配所有权并处理 NFT 的转移，同时证明其真实性。当一件艺术品被铸造为 NFT 时，它会被分配一个直接链接到单个区块链地址的唯一标识符。每个数字艺术都有所有者，所有细节在区块链上公开并可以验证。即使创作者铸造了同一物品的
    1000 个 NFT，每一个也可以通过其唯一标识符轻松与其他区分来。

    - 实现市场相关的应用程序功能。想象有一个网站，你可以在那里上传图像并将此图像转换为数字资产包含在你的个人账户中，就像艺术家在展厅展示他们所有待售画作一样。这是同一个概念，但增加了其他因素，例如社交媒体点赞和网站访问量，喜欢的人越多，获得的价值就越高，艺术家能赚到的钱就越多。


    该应用程序部署在 Polygon 区块链上，其主要目标是：


    1. 鼓励用户参与他们可以铸造、获取、出售或转移的资产订阅。

    2. 增加资产价值。


    '
