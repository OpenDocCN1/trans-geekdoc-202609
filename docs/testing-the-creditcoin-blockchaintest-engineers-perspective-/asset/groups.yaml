    # Weights and Benchmarks


    Weights represent the computational burden required to execute a specific transaction
    on the blockchain and are the main component of determining transaction fees.
    When filling blocks with transactions, there is a maximum weight that can fit
    into a block. Weights in a Substrate-based chain, such as Creditcoin, are generally
    denoted as the number of reads and writes on the chain for each extrinsic function.
    Weights can also vary with hardware configuration.


    Benchmarks provide a consistent way to express the amount of time it takes to
    execute different functions in the runtime and under different conditions. Benchmarks
    are written by a human developer and then can be used to automatically generate
    more accurate weights for extrinsic calls!


    Usually these benchmarks will be executed on what is designated “reference hardware,”
    and automatically generated weights will be included in the source code. This
    operation will be repeated on a regular basis, for example, when preparing for
    a new release.


    Reference hardware is whatever you decide given the functional and customer/participants
    target of the blockchain. For Creditcoin this is a memory optimized Standard_E4as_v4
    virtual machine instance in Azure. Polkadot, the creators of the Substrate framework,
    recommend more powerful hardware: n2-standard-8 VM instance on Google Cloud Platform
    and c6i.4xlarge on Amazon Web Services EC2.


    # Runtime


    Inside the runtime/src/ directory is where all of the components are put together
    to define what constitutes the Creditcoin node. It’s mostly plumbing code which
    defines concrete data types for all of the pallets involved in the implementation,
    for example:'
  - '[PAGE 94]


    ```

    pub type Moment = u64;


    // Some way of identifying an account on the chain. We

    intentionally make it equivalent

    // to the public key of our transaction signing scheme.

    pub type AccountId = <Signer as IdentifyAccount>::AccountId;


    // Balance of an account.

    pub type Balance = u128;

    ```


    The runtime itself is compiled into WebAssembly (WASM) and can be published on-chain
    as part of your release process. When the natively compiled runtime version and
    the on-chain runtime version match, a Substrate node will use its native runtime
    because it is faster. In all other cases, when on-chain and native runtime numbers
    don''t match, the node will use the WASM runtime downloaded from the chain. This
    is why updating numbers for a Substrate-based blockchain implementation is important!

    Makes the release and upgrade process so much easier because miners don''t need
    to upgrade their containers at the same time! It''s important to point out that
    compatibility/interoperability between different native and WASM versions falls
    within the scope of the Substrate framework itself and has not been tested in
    detail as part of Creditcoin. I don''t recall this ever being a problem because
    of the preemptive approach taken to version number updates by the team.


    # Storage Migrations


    A good analogy for the actual information stored on-chain is a database for a
    typical web 2.0 application. Similar to ORM models in Creditcoin 2.0, we have
    storage items which are data types defining what gets written on-chain, for example,
    a map between accounts and balances or a map between lenders and borrowers! On
    the blockchain, this is all in binary format, SCALE, encoded in our implementation.'
  - '[PAGE 95]


    # CHAPTER 5 CREDITCOIN 2.0


    As business logic and source code changes, we need to perform operations that
    would transform the binary data from its older format into the desired current
    format. This is what the migrations component is responsible for, and it behaves
    similar to database migrations in traditional ORM frameworks.


    Migrations are triggered via internal hooks upon upgrade of the WASM runtime and
    follow an internal numbering scheme. Each individual pallet can have its own migrations,
    independent of other pallets. In Creditcoin 2.0 outside of the system pallets,
    only pallets/creditcoin contains custom migrations.


    # Custom RPCs


    This component allows you to define and expose additional RPC methods to be used
    by extremal applications. These methods can be whatever you decide. In Creditcoin
    2.0, it is used to expose some mining-related statistics and a bit of the chain
    internal information used for monitoring a fleet of running miner nodes.


    In the Substrate framework, RPC methods are exposed as JSON-RPC via the HTTP and
    WebSockets simultaneously.


    # Telemetry and Custom Metrics


    The Substrate framework allows you to automatically expose a telemetry stream
    to Prometheus – the open source monitoring system and visualize these metrics
    in Grafana. This component allows you to define your own metrics too which are
    conveniently available at <url>:9615/metrics in plain/text format.


    In a couple cases in Creditcoin 2.0, the same data is made available both as Prometheus
    metrics and via a custom RPC method. Both endpoints call into the same internal
    functions and serve as wrappers around them.'
  - '[PAGE 96]


    Another case is also present in Creditcoin 2.0 where custom metrics definitions
    call into an RPC method to extract information. We call both a custom RPC method
    and a system defined one, there’s no difference between the two.


    The fact that similar/same information is exposed as JSON-RPC and Prometheus stream
    is mainly a convenience decision. You don’t need to do both.


    # # Creditcoin-js


    Creditcoin-js is a wrapper around the polkadot-js library, which is the primary
    means of communicating with Substrate-based chains. Creditcoin-js provides some
    convenience in error handling and cleaner consumer interface. At the time of writing,
    it is primarily used for integration tests and/or helper scripts.


    # # Creditcoin-squid


    This is an indexing and proxy service which ingests the events that happen on
    the blockchain and records them into a standard RDBMS and then exports a GraphQL
    API for consumption. It is based on the Subsquid open source project, https://subid.io,
    hence the name. The overall architecture of this component is shown in Figure
    5-2.


    This component is independent of the blockchain and represents an industry-standard
    means of consuming blockchain-related data by third-party applications. The source
    code uses the GPL-3.0 open source license; however, at the time of writing, it
    has not been released publicly!'
  - '[PAGE 97]


    ![](img/fdf35d2d28d1fdd7aff60f2490629a1b_97_0.png)


    Figure 5-2. Architecture of creditcoin-squid


    # # Timeline of Creditcoin 2.0


    The lifecycle of Creditcoin 2.0 begins in late November 2021 with a skeleton of
    the creditcoin pallet built on top of an example code base of a Substrate-based
    blockchain node. At that time I was still testing the upcoming 1.8 version, and
    the 2.0 implementation was still considered an experiment. Later it turned out
    that it was a viable option to just reimplement everything.


    In the following months, all extrinsics are implemented, including basic unit
    testing and cleaning up of the code base and enabling other pallets as additional
    dependencies are discovered. The implementation is bundled up as a docker image.'
  - '[PAGE 98]


    The first public release is 2.0.0-beta-2 on Mar 2, 2022, followed by another one,
    titled Mainnet release: 2.0.0-beta-5 on Mar 23, 2022.² Creditcoin 2.0 development
    continues throughout 2022 and 2023 and eventually becomes Creditcoin 2.3 described
    further in this book.


    # # Testing of Creditcoin 2.0


    Testing for Creditcoin 2.0 started early during its lifecycle and is more organic
    compared to Creditcoin 1.x. It is also more structured and better defined. The
    Substrate framework makes it relatively easy to exercise a lot of the functionality
    via cargo test and collect coverage metrics. Everything related to testing Creditcoin
    2.0 is automated and is available in its GitHub repository! The CI environment
    in which these automated tests are executed is GitHub Actions.


    Regular CI jobs look like this.


    > ²https://github.com/gluwa/creditcoin/releases'
