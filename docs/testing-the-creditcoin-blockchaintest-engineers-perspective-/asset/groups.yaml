    - Chopsticks, https://github.com/AcalaNetwork/chopsticks is a forking tool for
    Substrate-based networks similar to our own creditcoin-fork.

    - Dappeteer, https://github.com/ChainSafe/dappeteer, now archived, is a library
    to facilitate end-to-end testing for dApps using Puppeteer + MetaMask. This was
    created originally by ChainSafe for signing dapps under a real metamask extension
    but later utilized further for testing snaps development work within MetaMask.


    For smart contracts, testing activities revolve around logic verification, vulnerabilities
    scanning, and security audits, including from external third-party providers.


    # Testing Smart Contracts with Sebastian Viquez


    During my journey of testing Creditcoin, I have worked predominantly on testing
    at the protocol layer itself and almost not at the layer that sits on top of it
    – that is a blockchain application implemented as a smart contract. I even mentioned
    in the beginning of this book that practical applications of smart contracts are
    outside of the scope of this book.


    Well, well, well. Given that Creditcoin has now evolved into a general purpose
    blockchain that supports smart contracts, it is only fitting that we actually
    get to hear a different point of view from someone with more experience in this
    area.


    I talked to Sebastian Viquez, a fellow QA lead and an early Bitcoin adopter from
    Costa Rica. What follows is a summary of his experience.

    '
  mdcn: '


    # 第8章 其他人如何测试区块链


    可以在任何时候被移除。这与 Sui 网络上的 NFT 实现形成对比，13 在该网络上，所有数据可以、但不一定必须在链上无限存储。绕过此问题的一种方法是使用如
    Pinata^14 这样的固定服务，你付费让你的数据在一段时间内持久化。这本质上是一个数据镜像服务，保证了 IPFS 文件的可用性。另一种方法是自己运行数据镜像服务和/或所谓的全节点，但在处理第三方链工作时，这种方法可能成本效益较低。在对公共区块链网络进行测试时，你可能会遇到预期数据缺失的情况，导致测试失败。


    # 拥有专属 QA 工程师的小组


    ChainSafe 的某些团队拥有全职分配给团队的专属 QA 工程师。这些工程师参与团队的所有活动，如站会会议和拉请求（pull request）评审。他们的重点和大部分测试工作发生在拉请求本身上，即在新功能或新更改合并之前进行。其他测试活动如下：


    - 在独立环境中进行补充测试，例如独立链或测试网。

    - 参与早期规划阶段 - 在编写任何代码之前，评审产品需求文档并与开发人员讨论实现细节/提出问题。

    - 负责新功能的测试自动化，主要是集成类型的的测试。


    ^13 https://blog.sui.io/onchain-storage-explained/

    14 www.pinata.cloud


    这里的长期目标是让 QA 通过不断参与开发过程变得更强大、更有价值。


    # 没有专属 QA 工程师的小组


    这些团队正在开发新项目，可能是概念验证等。他们主要由开发者组成，主要依赖单元测试和集成类型测试。这些测试套件大部分由开发者自己创建，QA 工程师加入填补空白，大部分测试是由开发团队负责的集成测试。在团队中，QA
    工程师帮助并建议测试相关活动，例如在需要时创建测试计划和测试用例，或执行手动测试，但并不完全负责测试工作。


    在这里，取决于产品，团队可能有一套手动烟测试套件，预计测试工程师参与用户验收测试（UAT）、端到端测试以及测试网环境内部测试和/或主要发生在 git 仓库之外的自动化任务。


    例如，在测试 Syigma 桥接时，可能会有针对两条链执行的多个步骤。在这种情况下，QA 工程师更有可能编写一些辅助脚本来自动设置链上状态，然后手动执行验证和检查，特别是对于新功能和新集成。这是一种半自动测试方法，而不是硬写一个完整的端到端测试用例。在信贷质押（Credit
    staking）的背景下，我之前描述过完全自动的 e2e 测试套件在清理方面面临着某些挑战，因为必须等待链上条件的实现。通过不进行 100% 自动化，ChainSafe
    能够避免此类问题。


    # 关于测试自动化和工具


    考虑到产品的多样性及其成熟阶段，ChainSafe 在测试自动化和代码覆盖率指标方面没有一劳永逸的要求。在产品经历快速迭代和概念验证的期间，通常对测试自动化的投入不多。团队更倾向于等待架构模型稳定后再开始进行测试自动化并在
    GitHub 的拉请求中启用 CI 任务。这通常发生在向被测试产品中添加新功能时。


    在编程语言和测试框架方面，ChainSafe 团队在同一仓库中进行单元测试和集成类型测试时，使用语言自带的默认，涉及 Go、Rust 和 TypeScript。对于
    Andrew 来说，准则就是“使用语言内置的标准测试工具”。这就是他所说的“核心测试（core-testing）”。


    随着我们沿着测试金字塔移动到 e2e 和 UAT 测试，工具变得更加复杂。由于需要与浏览器插件交互，使用 Cypress 会遇到限制，尽管它可以用于监听区块链事件，ChainSafe
    倾向于不使用通过 DOM 观察的或者通过插件可见的。


    当被测试的对象是分布式应用时，Andrew 的主要目标是完全移除钱包，通过 mock `window.ethereum` 对象来实现。在实践中，浏览器插件也受到测试，极至少通过手动烟测试进行，且没有明显问题。


    这种方法对于 Multix 并不适用，因为钱包的工作方式与 Ethereum 不同。此外，Andrew 发现需要变通方法处理多签钱包。解决方案是一个连接你的测试框架到
    Polkadot API 的编程钱包库。这就是之前提到的 cypress-wallet 插件，可以通过 https://github.com/chainsafe/polkadot-wallet
    获取。


    另一方面，如果你没有资源创建自己的测试工具和库，且或者 ChainSafe 的工具不符合你的需求，你可以使用 Playwright 进行界面自动化。我见过使用
    Chrome 浏览器执行多个浏览器插件的运行测试套件，它可以签名并提交交易。这可能并不优雅，但是一个相对容易上手的方法。


    ChainSafe 使用的其他工具：


    - Chopsticks：https://github.com/AcalaNetwork/chopsticks 是一个基于 Substrate 的网络分支工具，类似于我们的
    creditcoin-fork。

    - Dappeteer：https://github.com/ChainSafe/dappeteer（已归档）是一个使用 Puppeteer + MetaMask
    进行 dApp 端到端测试的库。它最初由 ChainSafe 创建，用于在真实的 MetaMask 扩展下签名 dapps，后来更多用于测试 MetaMask
    内的 snaps 开发。


    对于智能合约，测试围绕逻辑验证、漏洞扫描和安全审计，包括来自第三方提供方的审计。


    # 与 Sebastian Viquez 测试智能合约


    在测试 Creditcoin 的过程中，我主要在协议层本身进行测试，而几乎没有测试在其之上的层——即作为智能合约实现的区块链应用。我甚至在书的开头提到，智能合约的实际应用不在本书的涵盖范围内。


    好吧，好吧。考虑到 Creditcoin 现在已经演变成一个支持智能合约的通用区块链，从一个在该领域更有经验的人士那里听听不同的观点是完全合理的。


    我和 Sebastian Viquez 聊了聊，他是一位来自哥斯达黎加的同行 QA 负责人，也是比特币的早期采用者。以下是他经验的总结。


    '
