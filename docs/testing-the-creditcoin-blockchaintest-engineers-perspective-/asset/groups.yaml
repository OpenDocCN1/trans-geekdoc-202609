    \n# 健全性测试与静态分析\n\n在此类别中，我将大部分不属于其他类型的内容分类：linter（代码检查）、代码格式化程序和自定义脚本——我喜欢遵循语言设定的最佳实践并编写整洁的代码。用于测试\
    \ Creditcoin 的工具包括 cargo fmt、Clippy、eslint 和 prettier。\n\n在某些情况下，静态分析工具可以检测出可能导致\
    \ bug 的模式，我确保创建定制化工具来检查源码中的此类模式。在某些语言生态系统中，这种努力以 linter 插件的形式存在，而在 Creditcoin\
    \ 的情况下，这些大多是独立的 bash 脚本。这些脚本将检查源代码（例如使用 grep），并向我们警告可能导致错误的常见错误。例如：\n\n+ - 记住存在原生运行时和链上运行时，使用哪一个取决于运行时版本号？现在想象一下运行时行为改变但版本号没有改变的情况——这可能导致节点运行不同版本的代码。在许多情况下需要增加版本号，因此此脚本采取了预防性方法，并根据简化的启发算法要求增加版本号。有时这种版本号的增加并非绝对必要，但防患于一。它也与开发过程的其他部分完美契合。\n\
