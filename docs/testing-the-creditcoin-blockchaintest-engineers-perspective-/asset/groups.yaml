    ## v1.7 ► v1.8 切换及怀疑的网络问题


    作为现有测试套件的一部分，我添加了额外的节点，以模拟旧的 1.7 节点尝试与升级后的 1.8 链配对，这按理是不可能的。实际的断言仅是检查被测试的节点并确保它没有连接到区块链的其他部分。还添加了一些其他场景，例如通过检查被测试的区块链来跟踪平均区块发布时间，并对所谓的“内部代币”（house-creditcoin）交易进行健全性检查。


    在 Creditcoin 1.8 的测试期间，我主要与一个开发者合作调试一个怀疑的网络问题（可能是多个问题）。使用现有的 docker-compose 文件，我们在跨越多个云提供商和地理区域启动了区块链的专用版本，并在网络节点的指定方式上略有不同——要么是静态指定的，要么是动态发现。然后使用现有的测试套件向此目标链发送交易并观察网络状态。这就是
    creditcoin-legacy-docker-compose-testnet 仓库的起源。后来，该网络向选定的社区成员开放，以获得更大的多样性。


    我们寻找的主要项目是节点对等状态以及使用 https://github.com/atodorov/Creditcoin-Tools 上的工具检测分叉的存在，因为这些是尚未完全理解的根源的最明显的症状。在实践中，一个仅有
    6-10 个节点的区块链，某些节点丢失彼此之间的连接将无法持续半天，无法重新连接并重启它们的分叉。有时节点会分成集群，进入 2 或 3 个孤立的分叉。手动强制它们重新连接（例如通过重启）并不总是有效，有时会导致无法解决的分叉。记住，即使验证者断开连接，他们仍然会产生区块，因为会有内部触发的交易，例如时间戳和维护事务。


    在 v1.8 发布之前，这项工作经历了 41 次内部构建，如 https://github.com/gluwa/creditcoin-legacy-docker-compose-testnet/pull/12
    所示。我上一次测试 Creditcoin Sawtooth 实现是 2022 年 3 月 15 日。https://github.com/gluwa/creditcoin-legacy-docker-compose-testnet/pull/12。


