    # CHAPTER 8 HOW OTHERS TEST BLOCKCHAIN


    Due to the diversity of projects and teams at ChainSafe, and also in general,
    everyone''s definition of what “high quality” means is different. Andrew is going
    with a practical model following the ISO 25010¹² standard – high quality is the
    level to which the software under test satisfied the requirements posted by its
    stakeholders. This generic model is used as a guideline principle at ChainSafe
    which then evolves according to the product and blockchain-specific needs.


    According to Andrew, the challenges in terms of working with a blockchain are
    as follows:


    +   **Data immutability**: Blockchain state cannot be changed after it is recorded,
    and if your testing requires specific on-chain state, you can mitigate this by
    either using fresh testing accounts every time and/or using local and shared testnet
    chains. In Creditcoin I actually use fresh testing accounts most of the time coupled
    with the fact that the suite does not depend on the actual data itself – just
    that it is present! I am probably missing some test coverage here.


    +   **Finality**: This is the level of confidence that a recently appended block
    will not be removed from the chain. The challenge is there that there are multiple
    nodes which operate independently from one another, and it is entirely possible
    that your transactions make it into a block on a specific node A at the same time
    in which another node B produces a block. This is what we call forking, and a
    healthy blockchain will be able to resolve these forks and eventually all nodes
    will be consistent with one another. The challenge for development and


    ¹² www.iso.org/standard/78176.html'
