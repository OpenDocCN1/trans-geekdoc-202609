  mdcn: "\n\n## 第 7 章 CREDITCOIN 3.0\n\n基于 Substrate 的地址为 32 字节。这就是为什么在 Creditcoin\
    \ 3.0 中，每个账户有两个不同的地址——原生 Substrate 地址和一个虚拟的 EVM 地址，称为关联地址（associated address）。\n\
    \n来源：https://github.com/gluwa/frontier\n\n### Creditcoin3\n\n这是 3.0 版本的主要源代码仓库，包含了区块链运行时（runtime）实现、Docker\
    \ 容器规范以及其他部分。与 Creditcoin 2 相比的主要区别在于，该仓库的大部分是底层架构代码（plumbing code）——在编写时，没有自定义的调色（pallets），没有自定义交易，且几乎没有额外的\
    \ RPC 调用。\n\n来源：https://github.com/gluwa/creditcoin3\n\n### EVM 追踪 RPC\n\n这是一个内部组件，是\
    \ `creditcoin3-node` 客户端的一部分，它导出了多个 RPC 方法，能够追踪发生在基于 Substrate 链 EVM 层上的交易，例如智能合约内部的交易。该组件的主要目的是为像\
    \ Blockscout 这样的区块浏览器提供必要的信息。如果没有它，区块浏览器应用程序仍然能够看到每个区块及其内部记录的交易；但它将无法遍历 EVM 相关的交易，无法显示其更细粒度的细节。\n\
    \n这些 RPC 的代码来自 Moonbeam 区块链，已合并到 `creditcoin3-node` 中，路径为 https://github.com/gluwa/creditcoin3/pull/169。由于这是一部分大量的第三方代码，经过人工验证其运行符合预期。最初，该组件暴露的\
    \ RPC 方法通过编译器标志有条件启用，随后被作为标准构建的一部分包含。\n\n### 预编译（Precompiles）\n\n这是 `gluwa/creditcoin3`\
    \ 仓库内部的一个组件，是在 Creditcoin 3 测试网正式发布后添加的。该组件允许你跨越 Creditcoin 3 的以太坊侧与 Substrate\
    \ 运行时之间的差距，并从 EVM 侧与运行时进行交互，这在通常情况下是不可能的。\n\n从外部视图来看，该组件充当智能合约的角色，在固定地址始终可用，类似于一组预定义的智能合约集合。在实现方面，它有一个用\
    \ Rust 编写的入口函数，是 Creditcoin 运行时的一部分。在编写此书时，Creditcoin 3 包含一个名为 `substrate-transfer`\
    \ 的单一预编译，其目标是让从现有的 Substrate 钱包一步到位为 EVM 地址注资变得更容易（否则需要两个步骤）。包含更多预编译合约的示例是 Moonbeam\
    \ 网络；更多细节见 https://docs.moonbeam.network/builders/pallets-precompiles/precompiles/。\n\
    \n### Creditcoin 3 CLI\n\n与 Creditcoin 2 类似，这是一个封装在容器镜像中的命令行程序，供验证节点节点操作者使用。它是\
    \ `gluwa/creditcoin3` 仓库的一部分。该组件最初是 Creditcoin 2 现有命令行源码的副本，但额外添加了两个功能：处理转账的命令以及对代理（proxy）功能的支持。\n\
    \n### 代理功能（Proxy Functionality）\n\n这是区块链和命令行应用程序的功能性子组件。我在这里提到它因为它很重要，而且因为它影响了我们进行测试的方式。记得在讨论\
    \ Creditcoin 2 时，我提到过所谓的“储蓄”（stash）账户和“控制”（controller）账户，并且它们被弃用了。代理账户是新场的新秀。\n\
    \n正如 Creditcoin 3.0 名称所示，用户可以创建另一个账户，该账户持有足够的资金来支付交易费用，并代表其主账户进行日常操作。代理由主账户授权，然后用于代表主账户签名交易。使用代理账户可以显著降低风险：如果持有所有资金的主账户意外泄露或被盗，可以避免大量资金遭受损失损失。\n\
    \n在基于 Substrate 的链中，可以实现一种代理过滤器（proxy filter），它向用户导出不同的代理类型并控制允许哪些运行时调用（即外接调用\
    \ extrinsics）。这就是你如何为代理账户实现访问控制。Creditcoin 3 带有三种不同的代理类型：质押（Staking）、非转账（NonTransfer）和全部（All）！这就是\
    \ Creditcoin 定义过滤的方式：\n\n### 代理过滤器实现\n\n```rust\nimpl InstanceFilter<RuntimeCall>\
    \ for ProxyFilter {\n    fn filter(&self, call: &RuntimeCall) -> bool {\n    \
    \    match self {\n            ProxyFilter::All => true,\n            ProxyFilter::Staking\
    \ => matches!(\n                call,\n                RuntimeCall::Staking(_),\n\
    \                RuntimeCall::Session(_),\n                RuntimeCall::Utility(_),\n\
    \                RuntimeCall::VoterList(_)\n            ),\n            ProxyFilter::NonTransfer\
    \ => matches!(\n                call,\n                RuntimeCall::Grandpa(_),\n\
    \                RuntimeCall::ImOnline(_),\n                RuntimeCall::Proxy(_),\n\
    \                RuntimeCall::Session(_),\n                RuntimeCall::Staking(_),\n\
    \                RuntimeCall::System(_),\n                RuntimeCall::Timestamp(_),\n\
    \                RuntimeCall::Utility(_),\n                RuntimeCall::VoterList(_)\n\
    \            ),\n        }\n    }\n}\n\nfn is_upsert(&self, o: &Self) -> bool\
    \ {\n    match (self, o) {\n        (ProxyFilter::All, _) => true,\n        (ProxyFilter::NonTransfer,\
    \ ProxyFilter::Staking) => true,\n        (a, b) if a == b => true,\n        _\
    \ => false,\n    }\n}\n```\n\n### 质押面板（Staking Dashboard）\n\n这是一个允许提名者质押资金并投票验证者的\
    \ Web 应用。它是一个标准的 React.js 应用，将钱包扩展（例如 SubWallet）连接到 Creditcoin 区块链。质押面板的主要功能是质押、投票验证者、创建和参与提名池以及监控性能和奖励。\n\
    \nCreditcoin 3 的质押面板起源于对 Creditcoin v2 的现有质押面板。最初，我们认为通过 rebase 到上游最新版本就足以支持两个版本的链。原始提交位于\
    \ https://github.com/gluwa/creditcoin-staking-dashboard/pull/108。\n\n在进行重base\
    \ 时，团队实际上发现上游代码库已进化到需要更新构建区块链的 Substrate 框架版本。在一个质押面板中支持不同版本的链的安排是否可行无人知晓，因为我们决定将现有代码拆分到新仓库\
    \ `gluwa/creditcoin3-staking-dashboard` 并继续开发。在生产环境中，两个质押面板实例是分开的，托管在不同的 URL 下。\n\
    \n公共 URL：https://cc3-staking.creditcoin.org\n\n### Subscan API\n\nSubscan 是一个监控数十基于\
    \ Substrate 的区块链网络的服务，并将信息聚合到 SQL 数据库中。该组件被质押面板用于渲染性能图表（例如过去的奖励）。它还提供了某种程度的区块浏览器功能。\n\
    \n这是与 Creditcoin 2.3 相同的组件；但是，Creditcoin 3 没有使用其开源分支，而是使用了 SaaS 版本的 API，公开访问地址为\
    \ https://creditcoin3-testnet.subscan.io。\n\n### Blockscout\n\nBlockscout 是一个用于检查和分析基于\
    \ EVM 的区块链的工具，即区块浏览器。Blockscout 与 Subscan 等其他浏览器的主要区别在于它可以理解智能合约调用或所谓的内部交易。也就是说，即不是由现有\
    \ Substrate 原语表示的交易。\n\n该组件以服务形式消费，Creditcoin 3.0 的测试网浏览器地址为 https://creditcoin-testnet.blockscout.com。\n\
    \n"
