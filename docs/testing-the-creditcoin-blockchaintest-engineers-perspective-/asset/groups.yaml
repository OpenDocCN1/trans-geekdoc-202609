    ## 第三章

    ## 介绍 Creditcoin 区块链


    Creditcoin 解决的主要问题之一是：发展中国家有数百万甚至数十亿的人无法使用传统银行系统——也就是说，他们根本没有银行账户。这些个人无法将信贷作为一种金融工具来改善生活，因为由于缺乏银行账户，他们无法获得这种传统工具。在某些地区，可能还缺乏实体基础设施，例如，一位愿意承担债务以购买机器的农民，以此节省数小时的人工劳动并提高生产率。当你无法获得基础设施时，这种做法是不可能的，而这正是
    Creditcoin 发挥用场的地方。


    ## 什么是 Creditcoin


    Creditcoin 起始于一种与区块链无关的投资协议，允许参与者借贷任何加密货币。在它的网站上，它曾被描述为“无边界金融平台”，从那时以后一直在演变。该协议在发布在
    [https://creditcoin.org](https://creditcoin.org) 网站上的白皮书中详细介绍。其第一版发布于 2017 年，之后进行了多次更新。


    Creditcoin 区块链是 Creditcoin 协议的官方开源实现，由 Gluwa, Inc. 构建并维护。它是一个用于投资相关活动的区块链网络，将贷款交易记录在分布式公共账本中。这使得现实世界的资产能够具象化，并促进了投资者与筹资者之间的连接。记录永久存储在区块链上，这些数据可以供利益相关方（例如传统贷款贷人）用于未来的信誉评估。


    书中提到的版本 1 和版本 2 范围较窄，侧重于贷款相关交易，而最新的版本 3 则变得更加通用，并演变为一个多链信贷协议，通过原生支持智能合约为现实资产提供动力。在
    [https://gluwa.com/](https://gluwa.com/) 网站上，这一最新迭代被称为“技术赋能全球金融包容”，但我在此赘赘了。


    ![](img/fdf35d2d28d1fdd7aff60f2490629a1b_54_0.png)


    图 3-1. Creditcoin 示意图


    贷款条款、还款和信誉表现等信息可以在 Creditcoin 区块链上获取，便于进行透明的风险评估，并将 Web3 的资本连接到现实世界的信贷投资机会。Creditcoin
    区块链本身是创建其他与贷款相关的金融产品的必要基础设施，例如点对点贷款平台、投资平台、交易所或上述所有者的结合。


    原始 Creditcoin 贷款周期的完整架构在本页所示：


    https://docs.creditcoin.org/cc2/faq#how-does-the-creditcoin-network-use-ctc


    Creditcoin 在设计上是多链的，如图 3-1 所示。原生记录在 Creditcoin 链上的数据代表了贷款条款、协议，以及参与者之间随时间推的借贷、贷款和还款状态。例如，Alice
    可能会记录她正在寻求相同条款的贷款，并最终记录他们的协议（称为 `DealOrder`）。Creditcoin 至少在最初设计时并不支持加密货币，这意味着实际转账发生在
    Creditcoin 网络之外，并由第三方加密代币表示。例如，如果使用 ETH 进行贷款，交易将记录在以太坊主网上。如果使用不同的加密代币来记录法币交易，那么我们可能会使用其他以太坊兼容的网络，如
    Goerli 或 Sepolia。当在外部区块链上进行融资时，必须将其记录在 Creditcoin 中。实际记录包含在外部链上有效的交易哈希，Creditcoin
    软件将前往以太坊等检查并验证提交给它的信息。两个参与者之间传输的金额及其地址应与它们之前在 Creditcoin 中记录的身份和贷款条款相匹配。版本 1.x初始
    Creditcoin 实现还带有比特币的方案验证代码；然而，我不知道它是否在实践中用过。


    Creditcoin 区块链将其他区块链上的外部产物（如地址和交易）验证并记录在自己的链上，并且还验证地址的所有权，例如以太坊上的地址。


    Creditcoin 区块链上的原生加密代币称为 CTC。它被用作实用代币来保证区块链本身的经济稳定性。在编写本书时，CTC 代币尚未直接用于贷款。


    从业务角度来看，Creditcoin 背后的模型可以描述为“基础设施即服务”（IaaS）。该区块链基础设施的主要消费者是金融科技合作伙伴，他们希望将交易记录在区块链上，并愿意访问之前的信誉历史和/或获得基础设施所提供的潜在新市场和业务机会。例如，其中一个合作伙伴是尼日利亚的
    Aella。事实上，根据 Creditcoin 的文档，Aella 是 Creditcoin 区块链的首个机构用户，已于 2022 年 6 月将其业务与 Creditcoin
    集成。


    真实的人参与信贷活动（例如我例子中的农民或投资代理人）在技术上可以直接使用区块链；这在 Creditcoin 1.x 客户端策略的 YouTube 视频中得到过演示；然而，我不认为这是一个可行的长期策略。此类用户更有可能使用移动
    App 进行日常交互，而这个移动 App 将直接或通过某种后端 API 层与区块链基础设施通信。事实上，Gluwa, Inc. 也一直在开发一个名为 Credal²
    的 API 层，但我对该领域没有太多参与。


    > https://docs.creditcoin.org/cc2/faq#what-is-the-relationship-between-creditcoin-gluwa-and-aella


    > https://docs.creditcoin.org/cc2/faq#what-is-credal-what-advantages-does-it-offer


    > https://credal.io/


    区块链中的所有参与者无论是执行几次交易的个人，还是在网络上记录成千上万交易的贷款伙伴，都需要支付交易费。然而，大多数运营费用由运行各种区块链节点的人承担；他们通常向云提供商支付计算、存储容量和网络带宽费用。


    ## 对测试活动的影响


    请注意，本书涵盖的时间范围与 Creditcoin 本身的快速开发和演变同步。一方面，Creditcoin 的定义从 3.0 版本开始开始向一个更通用的区块链网络转变。另一方面，我们需要讨论这如何影响测试活动。


    在任何快速节奏的环境中，实际的工程和测试活动看起来可能非常混乱，与我们在更传统的设置或较慢移动的环境中看到的不同。特别是：


    - 没有多少时间来正式收集和记录深度需求。需求目标本身往往在实际技术实施过程中发生变化。


