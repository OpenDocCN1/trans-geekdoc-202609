    # Integration Tests Speed-Up


    I''ve mentioned previously that the biggest part of the test suite for Creditcoin
    3 is the integration test suite. It contains the highest number of individual
    test scenarios and takes the most time to execute. On per CI job, this execution
    time has grown to around 90 minutes. While writing this book, I worked on a number
    of tasks to try and bring this down which of course starts by measuring how much
    testing do we actually.


    # CREDITCOIN 3.0


    At the time of writing this book, there were over 7000 workflow runs in GitHub
    Actions for the gluwa/credit3 repository online. Of them integration test jobs
    average roughly 1000 hours per month. The initial speed-up targeted a few low
    hanging fruits:


    - Reduce the value for hard-coded sleep calls, and remove such calls where possible.

    - Rewrite setup sections so that related test scenarios would share their setup
    instead of each scenario having their own. That was especially useful for long
    running test scenarios withdrawUnbonded.test.ts which need to wait 15+ minutes
    for the correct pre-conditions before they can actually do anything.

    - Conditionally skip other long-running test scenarios, like validatorCycle.test
    on purpose. This scenario takes around 20 minutes, with a maximum timeout of around
    30 minutes, and acts like an end-to-end testing with all the individual commands
    used inside it tested separately in isolation. We don''t need to repeat this on
    every single pull request, so I''ve added a conditional statement which will execute
    this scenario only on commits directly into the dev branch, for example, post
    merge. It is still executed on pull requests against other branches for extra
    safety before a new release.


