    see later in this book, preserving chain history became a requirement for the
    2.3 release!'
  - '[PAGE 88]


    # CHAPTER 5 CREDITCOIN 2.0


    The situation say the binary history for the previous tech stack should be preserved,
    meaning querying blocks and transactions by their existing hashes and active loan
    history which essentially spans two different chains, is outside of the scope
    of this book as I haven''t tested anything like that. The easiest way to achieve
    this that I imagine is to have both a Substrate node and a Sawtooth node running
    together plus an additional RPC routing layer which will connect to the respective
    chain depending on block number. In one version of this imaginary setup, you will
    have to account for the difference in RPC calls between Hyperledger Sawtooth and
    Substrate and/or provide a compatibility layer for that as well. Most likely you
    will have to generate dummy blocks on the new chain to account for the difference
    in block height.


    Another possibility would be to wrap the raw block data from v1.8 into a Substrate
    block and inject these blocks as part of the process for the 2.0 network and provide
    some sort of compatibility layer as part of the Substrate implementation. Which
    one would have been easier or more suitable, I cannot say.


    # Components of Creditcoin 2.0


    A blockchain implementation based on the Substrate framework is a monolithic code
    base which compiles to an executable binary called a node. There are two main
    parts of the node called the client and the runtime. Application logic, the transactions,
    and storage items which define what the blockchain does are defined inside the
    runtime. The client part is responsible for standardized tasks such as peer-to-peer
    networking, exposing RPCs, consensus, producing blocks, and so on. Unlike the
    previous version in Creditcoin 2.0, everything is encapsulated into a single running
    container. The node itself is a multi-threaded application which spawns the various
    components of the blockchain and executes them in parallel – around 50 or so threads
    as shown in Listing 5-1.'
