    \ = SCHEDULER_PREFIX;\n\n        if old_pallet == new_pallet {\n            log::info!(\n\
    \                target:\"runtime::creditcoin\",\n                \"pre-migrate\
    \ V7, nothing to do.\",\n            );\n            return vec![];\n        }\n\
