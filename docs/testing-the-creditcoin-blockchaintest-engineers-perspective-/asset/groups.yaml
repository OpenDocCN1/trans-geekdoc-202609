    test level and trying to model the switch via unit tests doesn’t bring practical
    value because using mocked runtime implementation. This is something which is
    easier to be observed and checked from the outside.


    # Integration Tests


    The majority of integration test suite stayed the same, and I added tests for
    new extrinsics as per the usual workflow. A few tests related to metrics and RPCs
    were removed because they are no longer applicable.


    Two new items became important before the official switch of stake:


    1. Assert that block history is preserved.

    2. Incorporate a call to switch_to_pos() as part of the existing upgrade procedure.


    Asserting on historical block preservation is relatively straightforward:


    - Launch a stand-alone blockchain for testing purposes. It starts as proof of
    work.

    - From outside of integration test suite, record information about the last proof-of-work
    block – its hash and block details. Keep this information into a JSON file. Could
    be done as a setup step inside the test suite as well. The reason it happens outside
    of the test suite is because of the ability to execute this test suite against
    other chains where the switch had already happened.

    - Switch to proof of stake by calling switch_to_pos() extrinsic.

    - Query the blockchain again with the same block hash stored in the JSON file.

    - Compare block details – they should be the same as the ones stored in the JSON
    file.


    # CHAPTER 6 CREDITCOIN 2.3


    Simulating the switch as part of the upgrade testing is also straightforward:


    - Launch a stand-alone blockchain for testing purposes. It starts as proof work.

    - Synchronize with a target blockchain as before, for example, Testnet.

    - Execute the runtimeUpgrade script which uploads the newest WASM blob on chain.

    - Either fork and/or disconnect the local node from the target live to prevent
    changes from propagating. We do both in two separate test jobs.

    - Call switchToPos() against the locally running node in order to trigger the
    switch.

    - Execute the existing integration test suite against the local node to make sure
    everything works. This also includes a check for block history preservation which
    is baked into the integration test suite.


    **Tip In the Rust source code, extrinsic functions follow the snake_case naming
    convention, while in the TypeScript client libraries, the same names are converted
    to camelCase. Both are the same, but I guess this may lead to confusion if one
    is unfamiliar


    # Testing Subscan Essentials


    The actual upstream repository of subscan essentials was not in the best state
    when it comes to testing. History on GitHub showed that CI jobs have been failing
    for over a year when I last checked, and there is a long list of commits merged
    to the main branch with failing CI jobs.


    As part of the Creditcoin fork, I have enabled all of the common tools we use
    on other repositories – MegaLinter, pre-commit CI, Dependabot, CodeQL, etc. Also
    added golang ci linter as a language specific tool and made sure we have code
    coverage reporting and CI executed on each pull request.


    Together with this, I have added multiple improvements around setting up services
    inside the testing environment – for example, use the existing docker-compose.yml
    setup instead of specifying configuration values in multiple places, using the
    same golang version as part of CI, and when building docker images, cleaning up
    Dockerfile and more. Basically make sure that all the extra tools which are standard
    practice for Creditcoin are happy and the issues reported by them are resolved.


    The good news is that there is an existing test suite written in Go. It is a kind
    of API test suite, somewhere between a fully integrated test suite and a unit
    test suite as far as I can tell. Its job is to exercise the various API endpoints
    and assert on their responses.

