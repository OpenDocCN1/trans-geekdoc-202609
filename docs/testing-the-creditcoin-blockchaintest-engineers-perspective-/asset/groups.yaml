    # 第一章 引言


    软件与 Linux 操作系统系统的各个部分类似，但我在此之前对加密货币或区块链完全没有经验。因为我当时正在开发一个已经投入生产的产品，我需要非常快速地学习很多知识，以便成为团队中的高效成员。那种感觉就像在用高压水管喝水，直到今天，有时仍有这种感觉。


    这本书是为普通测试人员和质量工程人员编写的，他们很快可能被要求从事区块链软件产品的工作，但他们可能对区块链是什么、它是如何运作的，以及在“保证”质量方面哪些是重要的仍然缺乏必要的理解。


    区块链网络是分布式系统，与普通软件产品相比，它们通常更复杂，并且有无数项目需要测试，这需要庞大的技能集。本书并非旨在涵盖所有可能场景的详尽资源；那是不可能的。相反，它的目的是讲述我作为一个区块链测试工程师的故事，并希望成为你进入这一领域的起点。


    祝测试愉快！


    # 区块链简介


    像区块链这样的分布式系统包含多个组件，除非你工作在这一特定的技术领域，否则其中某些组件并不是常识。本章将解释什么是区块链，并建立该领域常用的一些通用术语，并提供一些示例。


    区块链是一个不断增长的记录列表，称为“区块”，通过加密函数安全地链接，这些函数保证了数据不可篡改。在图 1-1 的范围内，我们可以将每个区块视为特定时间段当前状态的快照。如果有人在之后尝试修改此状态，将导致后续的所有区块相对于被修改的区块失效，从而揭示数据篡改。它也被称为分布式数字账本。这种架构使得互不信任的参与者仍然能够信任记录在区块链上的数据。


    ![](img/fdf35d2d28d1fdd7aff60f2490629a1b_17_0.png)


    **图 1-1. 形成区块链的链数据区块示例**

    许可：CC BY 3.0，来源 https://commons.wikimedia.org/wiki/File:Blockchain_landscape.svg


    区块链参与者是在其计算机系统上运行区块链客户端软件的个人操作员。他们的动机通常是财务上的——通过为区块链提供分布式计算资源获得奖励。


    为了在区块链上记录新信息，参与者必须达成共识——例如，一个困难数学问题的答案是什么。这被称为共识（consensus）。从设计上，大多数区块链系统向任何人开放，在许多情况下，参与者是匿名的，可能是故障的（由于软件或硬件漏洞）或行为不当的（由于可能存在伪造区块链记录的外部激励），并且通常是不可信任的。共识算法的工作是确保此类系统中的参与者能够达成一致，并检测和排除被认为有故障的参与者。否则，区块链软件无法进入下一步，即将实际数据记录到存储中。


    # 第一章 引言


    一旦新交易组合成一个区块并将该区块分发到区块链中的多个节点上，它就无法被删除或修改。区块链确保了完整的交易历史，加密函数的使用确保了记录在链上的信息在设计上是安全的。这些记录本质上是只读的。选择算法和软件架构是为了保证这些原则。实际的加密、共识、网络和其他算法以及实现架构各异，该领域有许多正在进行的研究，但基本原理是如图
    1-1 所示确保数据完整性。


    尽管今天的许多区块链平台能够支持智能合约和加密货币，但这些对于区块链作为安全分布式账本的核心运行来说并不是严格要求的。相反，正是作为安全分布式账本，使得智能合约和加密货币的存在成为可能。


    区块链实现是一种基础设施类型的软件，在非常抽象的层面上类似于数据库——存储和外部世界中记录了一些数据，也就是说其他应用程序可以对区块链进行读取和写入。


    区块链应用程序通常比测试人员可能熟悉的其他软件更复杂，有多个组件并行工作，并且多个网络通道和协议同时激活。


    # 区块链属性


    包含此节仅供你参考。在实际实现中，得益于所选的区块链框架，这些属性的大多数是开箱即用的。


    围绕这些特定属性的测试需求取决于你的运营和业务需求，在实际实现中，例如，在你没有开发底层算法本身时，这些需求最可能通过加强监控和告警来解决，而不是功能测试套件。


    - **安全性（Security）**：区块链上的信息通常被认为是防篡改的，因此历史记录是可以信任的。由于其分布式特性，区块链通常也被认为是防止恶意攻击者安全的。

    - **容错性（Fault tolerance）**：在区块链网络中，可能存在表现出故障或完全恶意的节点。区块链实现内置了对这种现象的容忍。

    - **可靠性（Reliability）**：区块链在指定环境和给定时间内正常工作的概率。对于命名的权益证明（proof-of-stake）共识，这意味着在当前时代，至少有二之三的所有被选验证者在线并正常运行。

    - **可重复性（Reproducibility）**：区块链上的交易可以由另一个节点重放，这应该始终产生相同的状态，例如，重放交易的节点在本地磁盘上存储相同的信息。

    - **透明性（Transparency）**：公共区块链上的记录所有人都可以访问，从创世区块到当前区块的所有状态转换都可以被单独重放和验证。也就是说，尽管参与者是匿名的，他们所有的操作都是完全透明的。

    - **终性（Finality）**：对最近添加到区块链的良好区块在未来不会被撤销并可以被信任的信心程度。大多数分布式区块链协议无法保证新提交区块的终性，而是依赖于“概率终性”：区块在区块链中的深度越深，被更改或回滚的可能性就越小。

    - **公共与私有（Public vs. private）**：区块链是否对公众完全开放，例如任何人都可以参与。你在新闻中听到的区块链都是公有的，包括 Creditcoin。

    - **无许可与许可（Permissionless vs. permission）**：任何人是否都可以加入现有的区块链网络、运行节点并参与共识，而无需先获得某种许可、批准等。流行的区块链如比特币、以太坊以及当然
    Creditcoin 是无许可的。


    # 区块链术语表


    **交易（Transaction）**类似于普通 SQL 数据库中的操作，寻求在区块链上附加新信息的操作。它通常暴露为 API 函数，以便用户与区块链交互。区块链交易通常是一个实体，类似于针对传统数据库执行的单个
    SQL 语句。交易代表区块链的业务领域，例如 Creditcoin 的 AddBidOrder 或以太坊中 Ether 从一方到另一方的转移。区块链网络可以支持多种交易类型。


    '
