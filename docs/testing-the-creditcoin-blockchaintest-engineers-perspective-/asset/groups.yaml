    # 前言


    本书涵盖了区块链测试的历程，适用于那些可能很快进入区块链领域但对其、工作原理以及在质量保证方面缺乏必要理解的测试人员和质量工程人员。书中讨论的 99% 内容都是开源的，并贯穿了多处代码引用。


