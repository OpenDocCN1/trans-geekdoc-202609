    # CHAPTER 5


    # Creditcoin 2.0


    Creditcoin 2.0 is a proof-of-work blockchain implemented using the Substrate framework.
    It models the same transactions and business logic as the previous 1.8 implementation
    but was developed independently.


    The main objective of Creditcoin 2.0 is protocol compatibility with the previous
    1.x version. Here I mean compatibility in terms of all possible transactions listed
    in the Creditcoin whitepaper being implemented with same or very similar names
    (allowing for capitalization) and input parameters. What I mean is a logical compatibility
    with the minimum necessity for changes in the whitepaper and there is no binary
    compatibility between the 1.8 and 2.0 versions, and they were never meant to be
    able to operate together with one another.


    Creditcoin 2.0 mainnet has been deployed independently of Creditcoin 1.x mainnet,
    and there is no connection between the two. Because the underlying data structure
    and technology stack are completely different, interoperability between the two
    implementations was never a requirement, thus no interoperability testing.


    At the time of creating v2.0, there were probably around a million blocks on v1.8
    Mainnet, and the only data that were deemed important and needed to be migrated
    non-zero CTC balances for all existing accounts which were included in the genesis
    block for 2.0! In other words, if a user called Jackie participated in Creditcoin
    1.x and had accumulated a balance greater than zero, then she should be able to
    immediately start Creditcoin 2.0 with the same account (same public and private
    keys) and see that her balance is exactly what it was. This switch is uni-directional.'
