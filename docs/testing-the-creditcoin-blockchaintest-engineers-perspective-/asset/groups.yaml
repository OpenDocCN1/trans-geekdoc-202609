    the sos-report command similar to something I''ve seen in commercial Linux distributions.
    Ideally this command will be part of the docker container, will collect all of
    the necessary information from step 1, and then allow the user to review it and
    submit it to the support team!


    This proposal is also where you start building your knowledge base and expanding
    the support services offered to the public. While not strictly a testing-related
    activity, it can benefit overall quality in a few ways.


    +   - Testers can learn a lot from the actual users on the field - this is real-world
    usage of the software under test, and we can use this knowledge to improve coverage
    where needed.


    +   - In the event of known issues, testers are likely to have already seen it
    or to be familiar with the issue because we''ve got a lot of edge-case knowledge
