  - '[PAGE 79]


    # CHAPTER 4 CREDITCOIN 1.X


    transition nor did I have a desire to deploy and maintain a separate Jenkins instance
    because of two repositories. Instead I settled for compile, lint, and unit test
    CI jobs as long as I didn''t have to do anything else other than configure the
    CI pipelines and execute several cargo commands.


    I made creditcoin-legacy-gateway more robust to malformed messages coming from
    the outside world, which I discovered while working on an unrelated task. Made
    it ignore messages which it couldn''t parse instead of crashing. As part of exercising
    the performance benchmarks I was working on, I''ve also managed to contribute
    a few optimizations.


    I''ve made small improvements to cclient; error messages in several repositories;
    updated restart_policy field in docker-compose files because I discovered that
    nodes were running out of memory sometimes and then crashing - mostly small things
    related to quality of life for the engineering team.


    Enable Dependabot on every possible repository, so we can keep up-to-date. For
    those, Dependabot started as an independent company, later acquired by GitHub,
    which automatically keeps tabs of your dependencies and opens pull requests whenever
    a new version is available. This has the added benefit that in case there are
    incompatibilities between versions your CI jobs will probably fail. It is not
    100% guaranteed that if everything in CI is green, you won''t have a problem,
    but nevertheless Dependabot making multiple repositories up to date a relatively
    easy task. It supports a plethora of package management systems including Docker,
    NuGet, cargo (for Rust), and npm/js which I was most interested in.


    For the C# .NET repositories, primarily creditcoin-legacy-shared, I had access
    to SonarCloud as a static analysis tool which exposed a number of code smells.
    Then I worked on fixing many of them. One may say that this isn''t the job of
    a tester, but I disagree - I am a test engineer and I don''t mind fixing code
    whenever I am capable of doing so.'
  - '[PAGE 80]


    # CHAPTER 4 CREDITCOIN 1.X


    If we look at a favorite definition of mine:


    Static analysis is ... the analysis of computer software that is performed without
    actually executing programs... performed on some version of the source code...


    > https://en.wikipedia.org/wiki/Static_program_analysis


    Especially references 15, 16, and 17, we are going to see that there is an overlap
    with the job role of a tester. I am a strong believer in static analysis tools
    and in fact used, spoken about, and hosted practical workshops how to extend or
    build your own static analysis tools with customized rules which can help you
    detect bugs or possible errors during step #0 of your testing pyramid – before
    you start testing anything else. That is why I tend to use lots of tools, and
    in the next chapters, you will see how I''ve added a few custom ones to prevent
    possible error conditions for Creditcoin 2.


    During the development of Creditcoin 1.8, there was a new transaction added called
    RegisterDealOrder. This is also the reason for the incompatibility with older
    versions of Creditcoin. This new transaction serves as a convenient entry-point
    which internally records the same state as ideal stand-alone transactions. I''ve
    worked on new integration and performance tests for RegisterDealOrder as well
    as actually checking that it results in the same side effects on-chain as produced
    by the other transactions it was meant to bundle together! A loan is a loan after
    all, regardless of how many transactions you use to record it into the blockchain
    – the results must be the same.


    Because almost every component of Creditcoin is distributed as a docker image,
    it was necessary to have CI jobs that constantly build and inspect these containers.
    Initial testing here focuses on having a HEALTHCHECK command in Dockerfile and
    read-only file system inside'
