    ## 第3章 介绍 Creditcoin 区块链


    - 测试策略可能并非显而易见，这是前述内容的直接结果。很多时候，测试会基于性原理开始，涵盖最显而易见的正向和反向场景，随着时间的推移和对被测系统的深入了解，测试会不断扩展。这与其他软件测试项目没有太大区别，但可能遗漏重要测试的风险稍高，因为环境本身具有更高的风险。


    - 与更传统的应用程序类型相比，可用的测试工具选择较少。例如，如果我没记错，最初研究 Substrate 的客户端库时，只有两个——一个是 Python 编写的，另一个是
    TypeScript 编写的。我现在找到了第三个用 Rust 编写的。虽然我更偏于 Python，但那个特定的库当时不支持异步函数（async functions），而整个
    Substrate API 都是异步的。因此，技术选型其实并不是真正的选择。


