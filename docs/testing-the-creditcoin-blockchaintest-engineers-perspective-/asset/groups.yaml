    图 7-9. 依赖矩阵任务


    # 总结


    正如你现在看到的，测试 Creditcoin 3 与其 v2 家族的前身非常相似。这是预料之中的，因为底层技术栈和开发实践大致相同。另一方面，出现了一些新的测试挑战，我想这也是预料之中的。


    遗憾的是，目前我没有更多可以分享的测试内容了。由于我正在写这本书，Creditcoin 3 的下一个阶段尚未到来，我还没有参与其中，也不了解与其实现相关的实际细节。


    在下一章中，我将讨论我通常如何处理测试，以及我认为测试工程师的工作是什么。请再多留一会儿。


    # 第 8 章


    # 其他人如何测试区块链


    我写这本书的动力是分享我在区块链测试方面的个人经验，希望对其他人有所帮助。在写作过程中，我实际上结识了其他在区块链领域工作的测试人员。当然，他们所从事的产品与我的不同，他们的方法也各不同。


    本章概述了 Andrew Snaith 和 Sebastian Viquezo 的经验，他们乐意接受与我的交流。正如你所看到的，区块链中需要测试的内容比我在之前所有章节涵盖涵盖得多。


    ## 我的区块链测试方法


    与其他任何类型的测试一样，我首先尝试理解我们想要做什么以及我所工作环境的局限性：


    - 被测区块链的所有组件有哪些？

    - 每个组件是如何工作的？其复杂性如何？

    - 涉及哪些风险？业务需求是什么？

    - 哪些部分可以通过单元测试、集成测试和/或其他类型的测试进行？

    - 我到底如何编写这些类型的测试——例如语法、可用工具和示例？


    这帮助我从业务角度和技术角度建立对所有活动部分的理解。我倾向于先从技术方面开始逐渐扩大我的理解。只要可能，我会在开发周期早期参与测试并尽可能实现自动化。这也有助于对复杂系统的行为进行编码，这在许多情况下非常有用。


    对于 Creditcoin，这意味着我专注于测试逻辑，并随着我们对整个区块链如何使用以及详细运行的的增加，在出现时覆盖额外的场景。持续参与拉取请求（pull
    requests）的代码审查，提出问题并为缺失的测试或重构需求创建工单（tickets），对质量的贡献超过了我自动化的任何特定测试场景或发现的单个 Bug。


    这是一种自底而上的方法，也是一种有机的方法——从第一天开始测试，并测试你接触到的每一个微小产品。这也是我多年职业生涯产生的一种个人偏好——我一直都在产品公司工作，处理的都是高度技术性的产品，并且与开发者同事处于同一水平。对于基础设施类产品来说，事实如此。


    我不确定自己是否有资格为没有这种情况的人提供建议。我想“去尝试一下”就是足够好的建议了。


    # 跨区块链栈测试

    对话 Andrew Snaith


    测试区块链协议和客户端实现只是谜图的一面，由于 Gluwa 控制两者，这使得测试 Creditcoin 相对容易。我与 ChainSafe 的质量工程主管
    Andrew Snaith 讨论了他对区块链测试的观点，并发现了比我想象的更多的细微差别。


    ChainSafe 是一家多链区块链研究开发公司，拥有开源软件。他们为外部客户提供开发服务，同时也开发自己的产品。


    在组织方面，公司有多个工程团队，大部分团队工作在他们所谓的“流”（streams）上。有些工程师致力于单个流，而另一些人并行处理多个流。同样，有些团队有专门的质量工程师，而另一些则没有，后文将介绍。工作本身跨越了多个链并跨越整个栈：主机客户端开发、跨链桥接、web3
    工具库和 SDK、分布式应用、智能合约以及浏览器扩展。


    注意 桥接（bridge）是连接两个或多个区块链的计算机程序。


