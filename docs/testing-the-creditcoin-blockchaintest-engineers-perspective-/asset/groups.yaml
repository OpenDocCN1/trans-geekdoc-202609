  mdcn: '


    # 测试 Creditcoin 质押面板


    该组件的上游版本位于 https://github.com/paritytech/polkadot-staking-dashboard。如果我们仔细观察其
    2023 年夏季的测试套件，可以发现里面内容不多，至少在公开可见范围内是如此。CI 任务会在每个拉请求（pull request）时执行，并运行静态检查（linter）和构建任务。我能找到唯一的测试文件是
    `graphs.test.ts`，它执行了几个辅助函数。似乎没有其他形式的单元或组件测试，也没有使用 Selenium 或 Playwright 等工具进行任何自动化测试。与
    Polkadot 生态系统的其他组件不同，这里似乎没有在私有的 GitLab CI 或 Jenkins 实例中调度其他的测试任务。


    现在完全有可能是该应用程序正在进行内部测试，或者可能作为另一个存储库的一部分存在自动化测试套件。我很难相信没有这些，只是我没找到任何可以在 GitHub 上
    公开的显眼内容。因此，如果你正在一个下游分支（fork）上工作，这并不是理想的情况，但也无能为力。当你分叉 git 仓库并决定使用它时，这是一个你必须接受的风险。


    对于 Creditcoin 的分支，我已经启用了我们所有的标准工具——pre-commit CI、Dependabot、CodeQL、MegaLinter
    等。这些工具中仍有一些针对代码库报告了丢失的问题，这些问题是该组件初始状态的一部分。与 Creditcoin 3（所有报告的问题实际上都已修复）不同，这些问题中并非每一个都认为认为重要到需要修复的程度。


    由于开发和发布 Creditcoin v2.3 的时间限制，团队同意在后续采用一个简单的手动测试计划——大约 20 个测试场景，涵盖了品牌展示和“正向路径”（happy
    path）功能最可见的方面——即，确保它能够发现并提名验证者，而不会出现任何明显的错误或问题。这并不意味着没有 Bug；当然，是有的。只是大多数问题并没有严重到足以阻碍运行的程度。许多
    Bug 在随后的下游版本中也被修复了。


    # 第 6 章节 CREDITCOIN 2.3


    请记住，该测试计划最初是在 Creditcoin 任何质押功能之前，根据 Polkadot 质押面板的视觉线索开发的，并在积极执行过程中经历了多次更改和改进。这只是测试人员必须为未知情况做好准备的又一种情况。


    此外，每个拉请求都经过了手动测试——验证所提要修复的问题是否已修复，并且如上述，没有东西看起来损坏。


    在实践方面，这意味着在能够复制测试这些拉请求之前，需要检查拉请求、在本地构建并运行本地 Creditcoin 区块链。这一流程在 Creditcoin 3.0
    中得到了改进。


    # 测试 Creditcoin-cli


    Creditcoin-cli 是一个标准的 TypeScript 应用，设计用于在终端执行，更准确地说，是在运行的 docker 容器内部执行。


    有两个主要的子组件以相当直接的方式进行测试——工具函数和辅助函数通过单元测试执行，而实际命令则通过集成测试套件执行，方式就像节点 way触发这些命令一样。这两个测试套件都是使用
    Jest 测试框架用 TypeScript 编写。


    这两个测试套件之间有明确的分离——单元测试可以在没有任何外部依赖的情况下执行，而集成测试需要运行的 creditcoin-node(s) 和兼容以太坊的区块链（例如
    Hardhat）。所有内容都在本地隔离环境中运行，并使用预定义的账户 Alice & Bob。


    在断言方面，集成测试重用了现有的辅助函数和区块链 API 来断言预期状态。它们还对标准输出（stdout）命令输出进行断言！


    由于开发速度快，creditcoin-cli 最初仅通过使用命令并尝试在 PoS 链中成为验证者来手动进行测试。我发现了许多边缘情况、Bug 和小错误，这些在正式发布前已纠正。单元和集成测试套件源于这种经验，在本文写作时仍处于进行中，因为大多数测试工作都是如此。


    一个有趣的现象，例如，当新参与者想要加入 Creditcoin 区块链时，他们的账户中首先需要 CTC 资金。设置过程需要执行 `registerAddress`
    和 `requestCollectCoins` 内置（intrinsics）。这些是为了允许外部证明以太坊钱包的所有权，并将后以太坊上的 G-CRE 代币转换为
    Creditcoin 主网上的 CTC。


    这里的问题是，这两个外部调用都带有交易费用，对于新用户来说，没有外部资金就无法在 Creditcoin 上开始。这给测试带来了问题，因为在领取更多资金之前，我们需要有资金的账户。这种孤立测试通过发布一个
    sudo 交易来更新测试账户的余额而相对解决，因为我们知道 sudo 账户的密钥！在针对测试网（Testnet）或主网（Mainnet）进行测试时，我们需要使用已有资金的账户，且某些步骤不能执行两次，因此无法覆盖所有的测试场景。


    在本书写作时，这个问题仍然存在且尚未解决。我认为它一直一直是 Creditcoin 交互流程的一部分，但之前没有出现，是因为到目前为止无辅助的外部参与是有限的。解决这个问题最简单的方法可能是取消
    `registerAddress` 和 `requestCollectCoins` 内置的交易费用。


    creditcoin-cli 测试会自动收集代码覆盖率指标并将其发送到 https://app.codecov.io/gluwa/creditcoin/tree/main/scripts%2Fcc-cli；然而，此指标并未用于指导测试套件的开发。在写作时，cli
    集成测试套件的重点是执行 `wizard` 命令


    # 第 6 章节 CREDITCOIN 2.3


    并且将完整的验证者周期模拟作为正向路径测试场景进行练习。其他一些命令也经过了测试，但并没有对所有命令提供全面的测试覆盖。这种测试覆盖是在组件初始发布后添加的。


    # 测试 Gluwa 的 Substrate 分支


    由于上述的区块历史保留功能，我们选择使用 Substrate 框架的分支。关于质押奖励和惩罚的问题让我更仔细地研究了上游是如何测试它们的。我发现的结果作为一个职业生涯都致力于开源黑客的人，我并不认同的。


    上游 Substrate 在私有的 GitLab 实例中执行测试。从我观察来看，他们的某些作业定义使用了同样不向公开的工具和容器镜像。总的来说，如果你试图维护一个开源框架的下游分支，用户体验是最糟糕的。


    本质上，Creditcoin 团队无法知道我们所做的任何更改是否破坏了 Substrate，或者任何较新的 Substrate 版本是否与我们的更改兼容，在所有这些内容合并到下游分支并你尝试基于它构建
    Creditcoin 之前。


    警告：新版本的 Substrate 对质押子系统引入了重大更改，例如，将他们所谓的质押账户（stash account）和控制账户（controller account）仅合并为一个账户，这改变了大多数与质押相关的
    API/交易调用的签名！


    在 GitLab 上注册了与 Creditcoin 相关的组后，我花了一周时间试图理解上游所有的 CI 任务，找出它们在何报错，注释掉代码或尝试一些快速补丁，


    '
