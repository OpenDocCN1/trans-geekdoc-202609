    6-10 个节点的区块链，某些节点丢失彼此之间的连接将无法持续半天，无法重新连接并重启它们的分叉。有时节点会分成集群，进入 2 或 3 个孤立的分叉。手动强制它们重新连接（例如通过重启）并不总是有效，有时会导致无法解决的分叉。记住，即使验证者断开连接，他们仍然会产生区块，因为会有内部触发的交易，例如时间戳和维护事务。


