  mdcn: "\n\n# 第 7 章 CREDITCOIN 3.0\n\n- 现有的集成测试使用 ethers.js 库，该库需要合约十六进制地址和合约 ABI（应用二进制接口），并以另一个\
    \ JSON 文件的形式提供，才能实例化一个与区块链交互的对象。显然，这两部分信息是硬编码的，但我们需要确保它们始终与原始源代码匹配，而不会随着时间的推移而产生偏差——也就是说，不要测试了与你正在构建的完全相同的代码！\n\
    \n在编写本文时，我不清楚的问题是，如果区块链中添加了预编译合约（precompiled contracts），我们该怎么办？我们是将它们的所有元数据压缩到同一个\
    \ JSON 文件中，还是为每个合约创建独立的文件？这个问题的答案将影响检查的执行方式。\n\n## 测试 Creditcoin 3 CLI 和代理功能\n\
    \n对于 Creditcoin 3 CLI，预期的测试组合包括：针对各种辅助函数的单元测试（这些函数不需要运行中的链），以及对单个命令和验证者流程进行的集成测试，并对它们的成功执行情况、预期的错误处理以及链上状态进行断言。这里的现有测试套件与\
    \ Creditcoin 2 CLI 测试套件相比更加详细。我特意为命令行应用程序支持的每一个命令添加了测试，涵盖了正向场景、负面场景，以及一些端到端的测试场景。\n\
    \n由于每个测试场景都是独立执行的，我放弃了收集和合并代码覆盖率指标的。我分析了每个命令的测试覆盖率并添加了缺失的部分。这听起来并没有那么糟糕，因为可用命令集在最初引入之后几乎不会再发生变化——在我看来，在这种情况下手动进行测试覆盖率分析是可以接受的。这一次，我选择了低技术解决方案，而不是寻求自动化。\n\
    \nCreditcoin 3 CLI 测试套件的一个显著区别是，作为测试套件的一部分执行了代理功能（proxy functionality）。我们必须考虑以下属性：\n\
    \n- 我们是否使用了代理账户（proxy account）？是或否。\n- 提供的代理账户密钥是否有效？是；否；是，但账户没有资金；但代理已为不同的账户进行了配置。\n\
    - 代理类型是什么？三个可能的值。\n\n在实现方面，使用代理账户会导致几处差异：\n\n1. 任何处理密钥的代码必须请求代理账户密钥，而不是存储账户（stash\
    \ account）的密钥。\n2. 签名并向区块链提交交易必须通过代理账户完成。\n3. 检查可用余额分为两个部分：\n   1. 代理账户必须有足够的资金支付费用。\n\
    \   2. 任何额外金额必须根据存储余额进行检查——例如，当你想质押更多资金时，你的主账户而非代理账户必须拥有指定的可用余额。\n4. 显示余额和状态、查询操作，在通过代理账户查询链时必须始终使用主账户地址。\n\
    \n# 第 7 章 CREDITCOIN 3.0\n\n我们不感兴趣提供的密钥无效的情况，因为那会导致密钥环（keyrings）无法初始化，无论是否使用代理账户。这会在到达链之前尽早失败，并且不会被显式测试。其他某些组合也是无效的，因此我们留下了以下测试组合，这些组合在\
    \ CI 配置中以环境变量变量的形式表示：\n\n1. proxy=no\n2. proxy=yes / no-funds /\n3. proxy=yes\
    \ / not-a-proxy /\n4. proxy=yes / valid-proxy / type=Staking\n5. proxy=yes / valid-proxy\
    \ / type=NonTransfer\n6. proxy=yes / valid-proxy / type=All\n\n对于场景 2 和 3，重点在于断言预期的错误处理。命令行应用程序不应崩溃，也不应允许交易通过。相反，它应该打印一条易友的错误信息，解释哪里出了问题。这是我在测试网发布后仍在努力的工作，因为我们第一次尝试并没有完全做对。\n\
    \n测试套件使用了通用的设置/清理（setup/teardown）函数，这些函数会相应操作测试账户、其资金和/或密钥。该套件内部大部分测试场景使用了条件执行，利用了名为\
    \ `testIf` 和 `describeIf` 的自定义函数，见列表 7-2。这些函数构建在 Jest 框架现有的 `test()` 和 `describe()`\
    \ 函数之上，并且仅在给定表达式为真时才执行实际测试场景，因为并不是每个测试场景适用于所有可能的环境组合，例如：\n\n## 列表 7-2. testIF()\
    \ 函数的使用示例\n\n```js\ntestIF(\n  process.env.PROXY_ENABLED === 'yes' && process.env.PROXY_\n\
    \  SECRET_VARIANT === 'no-funds',\n  'should error with account balance too low\
    \ message',\n  () => {\n    try {\n      CLI('bond --amount 111');\n    } catch\
    \ (error: any) {\n      expect(error.exitCode).toEqual(1);\n      expect(error.stderr).toContain(\n\
    \        'Invalid Transaction: Inability to pay some\n        fees , e.g. account\
    \ balance too low',\n      );\n    }\n  }\n);\n```\n\n某些 CLI 命令不支持代理功能，要么是显式选择，要么是因为它们不需要用户进行身份验证。对于此类命令，条件测试执行将评估环境并在需要时跳过测试，而不是重复执行不会带来任何新信息的额外操作。这些命令主要在\
    \ `proxy=no` 时进行测试。\n\n注意，所有这六种变体都是并行执行的，由于它们选择性地跳过了某些场景，因此开销并不大。实际问题是共享状态导致了副作用。\n\
    \n![](img/fdf35d2d28d1fdd7aff60f2490629a1b_184_0.png)\n图 7-3.共享区块链的所有测试\n\n虽然单个\
    \ *.test.ts 文件仍然是独立且顺序执行的，但实际的实现是每个测试场景都会在区块链上创建一个随机账户，然后用它来担任活跃验证者的角色并用该角色执行命令。共享状态（例如活跃验证者以及控制\
    \ Alice 和 Bob 的账户）记录在链上，结果在某些情况下，区块链的活跃验证者集配置了某些账户，而实际上下一个命令是用另一个账户执行的。\n\n例如，validate.test\
    \ ts 使用账户 XXXXX 成为 Bob 节点的验证者，并在结束后进行良好清理。在下一步，另一个测试场景生成了账户 YYYY 并尝试成为控制 Bob 节点的验证者！在严重的情况下，在没有进行良好清理的情况下劫持了运行的\
    \ Creditcoin 节点。这是可能的，因为为节点配置密钥（例如旋转密钥）是一个无许可的操作，只要你可以访问运行的进程（例如 RPC 端口），就可以这样做。\n\
    \n这导致了这样状态：链上算法等待某些签名后才能完成区块，但这些签名永远不会到达，因为验证账户消失了。这破坏了完成确认，进而破坏了所有客户端交易。具体来说，交易仍然进入新区块，但我们的工具（包括测试自动化套件）被设计为等待区块完成确认后再报告错误。由于完成确认从未发生，一切都变得缓慢，直到命令和测试作业最终超时。\n\
    \n解决这个问题的实际上非常简单——确保测试场景之间没有共享状态——也就是说，在执行每组测试场景之前启动一个新的独立的链，如图 7-4 所示！\n\n"
