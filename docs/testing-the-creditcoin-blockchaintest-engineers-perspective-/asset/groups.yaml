    # CHAPTER 4 CREDITCOIN 1.X


    +   - Broken or faulty comms between validator/consensus can trigger unrecoverable
    errors in the consensus depending on the missing event/timeout or state in the
    publishing state machine.


    > —The Creditcoin 1.8 change log¹


    A decision was made that we will not continue going in this direction and it would
    be better to rewrite the blockchain from scratch using a different framework.
    Substrate was chosen as the replacement technology stack.


    Creditcoin v1.8 was published as the last release of the 1.x family, and it was
    communicated that the next version will be incompatible and community members
    should gradually move onto the new chain. This final release in the Creditcoin
    1.x series is using Hyperledger Sawtooth version 1.2.6.


    # Summary


    What a ride! Join a new team just as they release an upgrade to their flagship
    product then start testing it only to have everything become end of life in just
    a few months. I''m certain everyone of us has seen this over the years, but I
    don''t recall seeing it happen so quickly ever in my career before.


    It is definitely a roller coaster of emotions. On one hand, I felt excited that
    I was doing something new and challenging; on the other hand it was too much to
    take in and I felt frustrated that I didn''t understand most of the inner workings
    of the software under test and that I wasn''t making much progress as I wanted.


    > ¹ https://docs.creditcoin.org/cc2/creditcoin-change-log/version-1.8-2022-03-28'
