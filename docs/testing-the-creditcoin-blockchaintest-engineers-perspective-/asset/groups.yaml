    哈希（Hash）是单向加密函数的结果，通常接收二进制数据作为输入并返回一个十六进制字符串！每份数据都有唯一的哈希表示，且你无法反转哈希值。输入数据即使只有一个比特的修改，也会导致完全不同的哈希值。这使得公开共享哈希值而非数据本身是安全的，并且可以使用相同的哈希值来验证两份数据是否完全相同。


    交易哈希（Transaction hash）是一个代表每笔交易加密哈希的十六进制字符串。这些字符串通常被用作替代标识符。例如，https://etherscan.io/tx/0x8d16ea41628ac89745c95147c0ea394809074607395b0d792d1bea93628ob1
    代表了一次交易，在这次交易中我用一种加密货币（G-CRE）兑换了另一种（ETH）。


    Gas 费或交易费（Transaction fee）是在区块链上执行特定交易的成本表示。它会随着时间的推移和交易类型的不同而变化，旨在代表交易的计算费用。该值通常由区块链的原生加密货币表示。Gas
    的目的与代币经济有关，同时也提供了一种安全特性，使得恶意行为在经济上变得不可行。


    区块浏览器（Block explorer）通常是一个 Web 应用程序，允许用户搜索和检查区块链上的区块、交易和地址。流行的是 Etherscan，类似的功能也由
    Subscan（https://creditcoin3-testnet.subscan.io/）和 Blockscout（https://creditcoin-testnet.blockscout.com）提供。


    区块（Block）是多个交易的集合，原子化地记录在区块链上。区块内的所有交易要么都被记录，要么一个都不记录。如果我们将其与 git 版本控制系统进行类比：


    # 第1章 引言


    虽然我们通常将区块称为“记录”（records），但其含义与数据库记录不同。数据库记录代表的是离散值的单一集合，换句话说就是一列列的值。在区块链语境下，“记录”一词的含义更接近于包含多首歌曲的黑胶唱片记录。


    区块包含交易列表、对前一个和下一个区块的引用，以及额外的元数据，如时间戳、加密哈希和签名。根据实现的不同，单个区块可以存储的交易数量有一个最大限制。


    区块填充率（Block fullness）或区块饱和度（Block saturation level）代表区块内总可用空间实际被使用的百分比。例如，如果区块链未未使用，每个区块可能只包含一个心跳/时间戳交易；而在频繁使用的区块链中，它可能包含数百笔交易。


    区块哈希（Block hash）是代表每个区块加密哈希的十六进制字符串。这些哈希经常被用作地址或标识符。例如，03e89f72d1bc09af19759a94c34d769a94bb0ca9d257b2efe8adac0502cc11
    对应于以太坊网络上的第 19517842 号区块。其内容可以通过 https://etherscan.io/block/0x3e89f72d1bc09af19759a94c34d769a94bb0ca9d257b2efe8adac0502cc11
    或 https://etherscan.io/block/19517842 进行检查。


    此区块包含 185 笔独立交易，包括我兑换代币的那笔。


    区块高度（Block height）或区块编号（Block number）是其之前的区块数量。旧区块的高度越低。这个数字越大，区块链存在的时间越久。


    区块时间（Block time）是区块链上区块之间的平均时间，例如 15 秒。该值本身是任意的，由区块链的创建者选定。重要的是这个值大约是一个常数。在比特币中，预期的区块时间为
    10 分钟，而在以太坊中，设计的区块时间为


    # 第1章 引言


    15 秒，实际中通常在 10 到 19 秒之间。Creditcoin 的初始实现使用 60 秒，后续版本降到了 15 秒。恒定的区块时间对于分层应用更好，因为它们知道操作在什么时间范围内可以被视为失败或超时。


    创世区块（Genesis block）是 0 号。它通常被硬编码在区块链实现中（例如你的客户端程序中），并可能包含后续正确运行链所需的元数据。例如，哪个账户是根账户，或一组预定义地址的起始余额。


    分叉（Fork）发生在区块链分出两条潜在的未来路径时。当多个节点在几乎相同的时间产生区块时，可能会发生分叉。当后续区块被添加且其中一条路径比其他路径长时，分叉就会解决。


    硬分叉（Hard fork）通常发生在区块链协议发生不后兼容的更改时，要求所有用户升级软件以继续参与网络。在硬分叉场景下，区块链网络作为两个互不连接的数字实体存在。硬分叉也可能由于软件实现中的
    Bug 和/或网络问题导致共识失败。换句话说，区块链的参与者无法就哪条未来路径应该是规范路径达成一致，结果就是产生了两条独立的链。


    由于区块链旨在作为真理来源，无法解决分叉并导致硬分叉的情况被认为是关键且可能对区块链造成损害。


    区块终结性（Block finality）指的是区块链上交易的不可逆确认，确保安全性并防止双重花费。区块终结化（Block finalization）是用于处理分叉并选择规范链的过程。在实践中，这意味着所有参与者的三分之二。


    # 第1章 引言


    状态（State）是区块链上的当前快照——区块总数、记录在这些区块中的交易以及记录在本地存储中的值。实践中，当我们谈论状态时，指的是区块链在特定区块的快照。例如，区块
    1000 的状态是 Alice 余额为 300，而 Bob 没有！在区块 1010 中，由于期间执行了交易，内部状态发生了变化。例如，Bob 获得了一定数量的代币。当我们谈论状态时，通常指的是记录在区块链上的最后值，忽略历史。根据上下文，我们可能需要考虑之前的历史，可能是在你尝试重现特定
    Bug 时。


    挖掘（Mining）是工作量证明共识算法的一部分执行计算密集型加密操作的过程。执行这些工作的计算机被称为矿工。广义上我们也使用矿工一词来指代参与区块链的计算机和人类，无论实际共识算法如何。


    在加密和区块链中，nonce 是通信中仅使用一次的任意数字。它通常是验证协议发布的伪随机数，以确保通信不会被用于重放攻击。


    验证者（Validator）是验证区块链交易合法性的计算机节点。验证者也被称为矿工或铸币者（minters），他们是参与共识算法并获得向区块链添加区块权限的人。


    '
