    # Testing


    Sebastian has described his testing strategy into a Medium.com article, https://medium.com/@sebas.viquez/simple-test-strategy-for-web3-apps-using-hardhat-testing-framework-25efa21e98e,
    and I urge you to read in it. Here''s the list of:


    +   - Start with unit testing smart contracts, using the popular Hardhat tool
    to verify the correctness of each individual function inside your smart contract(s).
    You can configure Hardhat to use its own embedded Ethereum chain, another local
    chain like Ganache, or an external chain like Goerli (a named Ethereum Testnet
    instance).


    +   - Then move onto integration testing in order to exercise different parts
    of the Web3 application. In particular focusing on interactions between multiple
    smart contracts.


    +   - Moving onto security-related testing with tools like MythX¹⁵ or Slither¹⁶
    to analyze your smart contracts for common security vulnerabilities. Given these
    are more static analysis tools, I personally would move them toward the bottom
    of the testing pyramid and include them very early into the process.


    ¹⁵ https://mythx.io/


    ¹⁶ https://www.alchemy.com/dapps/slither'
  - '[PAGE 231]


    # CHAPTER 8 HOW OTHERS TEST BLOCKCHAIN


    +   - End-to-end testing which also includes the user interface for the application.
    For the UI portion of the tests, use your favorite tool. An interesting piece
    here is the truffle-assertions^17 library which allows tests to assert on events
    emitted by smart contracts.


    +   - What Sebastian calls “Blockchain Network Testing” is actually deploying
    your contracts to a blockchain network running in the real world, rather than
    using a chain locally on your computer, and then exercising the application and
    the test suite again. Due to the cost of tokens on a real chain, a testnet like
    environment, for example, Goerli and Sepolia, can be used before moving to mainnet.
    Inevitably that leads to the test suite having to execute some scenarios conditionally.
    This approach is also something that I like to do quite a lot described in earlier
    chapters in this book. The most certain way to know whether the application will
    work in real life is to execute as much as you can in production.


    +   - Sebastian describes load and performance testing using the k6^18 tool; however,
    any tool that you are familiar with should work. On the other hand, your personal
    approach for performance and load testing has been to interact with the blockchain
    directly, sending transactions using a chain-specific client library.


    > ^17 https://archive.trufflesuite.com/


    > ^18 https://k6.io'
  - '[PAGE 232]


    # CHAPTER 8 HOWTHERS TEST BLOCKCHAIN


    A notable testing challenge for The NFT Marketplace was the fact that your entrypoint
    for testing is a random address on a blockchain and not much else. One way to
    interact with the application and retrieve data is by using a client library,
    for example, ethers.js; another way is to extract the data and/or perform interactions
    using higher level tools such as Postman or the RestAssured library. This isn''t
    something I very keen because I believe it represents more work on my side as
    a test engineer and because I prefer to program rather than use one-size-fits-all
    type of tools; however, it is perfectly possible. Remember that in order for a
    blockchain network to be useful for external parties, it exports an API interface
    usually via standard RPC protocols, and this is where tools like Postman can plug
    into. Maybe that''s more useful in the situation where you as a tester need to
    perform exploratory testing and need tools which allow you to interact with the
    blockchain manually. I have limited similar experience due to the nature of my
    work, and it''s hard for me to relate.


    Another interesting challenge mentioned by Sebastian is knowing much every operation
    in The NFT Marketplace costs and also to some extent being able to control because
    transaction costs will have a direct impact on user experience and application
    adoption and the price of participating in a marketplace. Here Sebastian has extensive
    use of the Ganache tool, in order to easily simulate specific conditions before
    examining and testing The NFT Marketplace. You can think about Ganache as a tool
    which lets you mock and control everything about the blockchain before testing
    the application that sits on top of it. This approach should make it possible
    for you as a tester to be able to understand all of the internals of your smart
    contracts under test even before deploying to a public blockchain.


