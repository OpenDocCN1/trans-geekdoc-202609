    across multiple cloud providers and geographic regions with slight variations
    in how network peers are specified – either statically or discovered dynamically.
    Then using the existing test suite, started sending transactions to this target
    chain and observed the state of networking. This is the origin of the creditcoin-legacy-docker-compose-testnet
    repository. Later this network was opened to selected community members for even
    diversity.


    The main items we were looking for were node peering status and presence of forks
    using the tools at https://github.com/atodorov/Creditcoin-Tools since these were
    the most obvious symptoms of a not completely understood root cause. In practice
    a blockchain of just 6–10 nodes will not last half a day without some of the nodes
    losing connectivity between each other, not being able to reconnect and restart
    their own forks. Sometimes nodes would split into clusters entering into 2 or
    3 isolated forks. Manually forcing them to reconnect, for example, by restarting,
    did not always work, sometimes resulting in forks which couldn''t be resolved.
    Remember that even when validators are disconnected, they still produce blocks
    because there are transactions which are triggered internally such as timestamps
    and house-keeping.


