    # Continuous Testing on Pull Requests, Devnet, Testnet, and Mainnet


    Before explaining when testing happens and each individual target, I need to explain
    the various environments.


    +   **Cl environment:** That''s GitHub actions running an isolated blockchain
    and performing various assertions against it using all of the available test suites
    and test scripts. Usually in the context of an open pull request, regardless of
    the target branch;


    +   **Devnet:** That''s an instance of the blockchain usually upgraded to the
    latest available version. The main consumer of this instance is other developer
    teams working on layered products, for example, mobile and/or front-end applications.
    The Devnet environment mainly exists for the purposes of developing other applications
    communicate with the blockchain and is intended to function as an internal dogfood
    environment. This network itself is public but is far less likely to see much
    participation from external parties compared to Testnet. It is also much more
    likely that the actual blockchain data in this environment will not be preserved
    and destroyed over time.'
