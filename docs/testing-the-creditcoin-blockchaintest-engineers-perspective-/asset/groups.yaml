  mdcn: '


    # Crunch


    在基于 Substrate 框架的 NPoS 区块链中，验证者和提名者以加密代币的形式获得奖励。这种情况发生在每个代（era）中，并且存在一个支付此类奖励的最大窗口期——
    84 个代。任何人都可以触发不会自动发生的支付操作。


    Crunch 是一个命令行界面和 Matrix 机器人，用于为基于 Substrate 的链在每个代申领质押奖励，从而减少了与区块链进行手动交互的需要。


    该组件是 turboFlakes/crunch 的分支，包含了针对 Creditcoin 3.0 的特定更改，旨在用于 Gluwa 自己的验证节点自动请求支付。它使用
    Rust 编程语言编写。


    来源：https://github.com/gluwa/crunch


    # Creditcoin 3.0 时间线


    本书概述了从 3.0 仓库初始创建到 Creditcoin 3.0 测试网公开公告后不久的测试活动，大约在 2023 年 12 月到 2024 年 5 月之间。


    Creditcoin 3 测试网于 2024 年 3 月 21 日宣布²


    # Creditcoin 3.0 的测试


    3.0 版本的测试很大程度上建立在测试 Creditcoin 2.x 系列时积累的经验基础上。这意味着像静态分析工具、外部和内部 linter（代码检查工具）以及自动更新（例如
    Dependabot）与之前的版本基本相同。


    > ²https://creditcoin.org/blog/creditcoins-real-world-evm-testnet-is-live/


    由于 Creditcoin 3 的开发是在 Creditcoin 2 99% 的测试实践和基础设施已经到位之后开始的，因此在早期直接从 Creditcoin
    2 仓库完整复制所有 CI 配置，然后在需要的地方进行细微调整是非常常见的。本节将尝试关注 Creditcoin 3.0 测试方面的不同之处，而不是重复我之前为
    Creditcoin 2.0 和 2 提到的所有项目。


    请记住，3.0 版本的主要测试目标之一是 EVM 兼容性。


    以下是在拉取请求（pull requests）执行的典型 CI 流水线（图 7-2）。


    ![](img/fdf35d2d28d1fdd7aff60f2490629a1b_175_0.png)


    **图 7-2.** CI 任务概述


    # 单元测试


    Creditcoin 3.0 的 Rust 代码库单元测试非常少，主要来自 `evm-tracing` 包。其余是围绕以太账户 ID 派生的检查，以及对外部交易（extrinsic）权重兼容
    EVM 的检查。预编译（Precompiles）与外部函数类似，它们也有自己的单元测试。


    # 第 7 章 CREDITCOIN 3.0


    `gluwa/creditcoin3` 仓库中的实际源代码除了 `evm-tracing` 包和 `precompiles/` 目录外，大部分是运行时逻辑（runtime
    plumbing）。在单元测试层面没有太多可以的内容——没有自定义 RPC 或自定义指标，没有插件（pallets），也没有像 Creditcoin 2 那样的自定义外部交易。


    # EVM 和智能合约测试


    我们使用由另一个团队编写的智能合约测试套件。该测试套件被封装为 `@gluwa/evm-network-test` NPM 包，并提供了几个可执行命令作为其入口。在编写本书时，有
    `baseTest` 和 `gasTest` 命令，两者都需要一个 Creditcoin RPC URL 和私钥作为参数。这些命令可以如下执行：


    ```

    ./node_modules/.bin/baseTest --rpc <creditcoin-rpc-url>

    --private_key <private-key-for-a-funded-account>

    ```


    注意，这里的地址和私钥是 EVM 格式（以 0x 开头），而不是 Substrate 格式。对于运行在开发者模式下的独立区块链进行执行，可以使用预置资金的开发账户及其地址和私钥，这些内容在
    https://docs.moonbeam.network/builders/get-started/networks/moonbeam-dev/#pre-funded-development-accounts
    上有更详细的描述。


    此 EVM 测试套件通过 Hardhat Runner 执行——Hardhat 是一个流行的任务运行器，也是基于以太坊智能合约流行开发环境 Hardhat
    的一部分。包含测试场景的实际文件使用 JavaScript 编写，并使用了流行的 `chai` 断言库，该库是 Hardhat 生态系统中的默认库。


    `baseTest` 编译并部署一个代表加密代币的智能合约，然后对其进行执行各种交易，并对预期状态进行断言。这里的重点是确保代表 ERC20 加密代币的合约可以部署到
    Creditcoin 上，代币可以在不同钱包之间传输，并且通常用户可以与部署的合约交互。`gasTest` 工具将结果收集到 CSV 文件中。尽管顾名如此，但该文件中没有任何断言。


    该测试套件的源代码仓库无法通过 GitHub 获取，但以开源 MIT 许可证发布的 NPM 包可以从 https://www.npmjs.js/package/@gluwa/evm-network-test
    获取，你可以在安装后查看实际代码。只需进入到 `node_modules/@gluwa/evm-network-test/` 目录查看即可。


    从区块链的角度来看，作为此测试套件一部分的工具在我们运行区块链相关集成测试的每个环境中执行，例如：本地、Devnet、Testnet 等。你可以将其认为是主仓库中可用的集成测试套件的另一个分支。


    # 测试 EVM 追踪功能


    RPC 方法 `debug_traceTransaction` 和 `debug_traceBlockByHash` 是我们在运行区块链相关集成测试的每个环境中执行的
    EVM 追踪入口点。它们通过集成测试部署一个智能合约，进行几次交易，并对响应进行断言。这些方法旨在供第三方提供者使用，因此如果出现问题将是重大阻塞。


    # 区块链集成测试


    这是针对区块链本身的任何类型的集成测试。它使用 TypeScript 编写，并使用 Jest 测试框架。源代码位置位于 `gluwa/creditcoin3`
    的 `cli/src/test/blockchain-tests`。


    > 为了更容易复用共享代码和辅助函数，集成测试套件与单元测试套件封装在一起。这节省了一些精力。另一种方案将其移动到单独目录并单独管理依赖，这被认为是额外工作且没有收益。


    与 Creditcoin 2 类似，此测试套件通过 Jest 配置控制，并可以在包括生产环境在不同的环境中执行。在编写时，它包含了上述 `evm-tracing`
    测试、查询，并对运行链的某些值进行断言，执行可用的预编译 `substrate_transfer`。


    这里的另一个重点是 Creditcoin 3 在配置方面更加多样。主要差异在于区块时间和质押时长，这些在本地、Devnet 和 Testnet 是不同的。


    # 预编译测试


    之前已经提到过，但它值得拥有独立章节，因为该领域有更多内容。显然，有覆盖正向和反向路径场景的单元测试和集成测试。还有其他东西，被称为合约元数据。


    元数据存储在 JSON 文件中，Blockscout 浏览器应用程序通过 URL 读取这些 JSON 文件。这是必要的，以便 Blockscout 在分析与其相关的内部交易时知道显示哪些额外信息。


    此元数据包含预编译名称、地址及其字节码，以及 Solidity 源代码的单行版本。它被视为来自 Blockscout 程序的外部接口。


    在测试方面，我主要使用自定义静态分析脚本来断言某些内容，例如


    - 文件名不会更改，否则会导致 404 错误并破坏客户端应用程序。

    - 元数据中的字节码和源代码实际上与 Solidity 接口定义匹配。

    - 地址定义在独立的 JSON 字段中，因此它们需要匹配。

    - 我们已经知道如何在底层源代码更改时自动更新仓库中的源码以重新生成元数据，并使用 `gluwa-bot` 提交到 git。


    - 此处的命名约定遵循分支（例如 Devnet、Testnet、Mainnet），以确保根据我们发布的哪个分支可用预期的文件，并根据现有的发布流程推向前上述自动源码更新。


    '
