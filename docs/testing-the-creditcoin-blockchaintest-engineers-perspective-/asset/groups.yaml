    # Crunch


    In a NPoS blockchain based on the Substrate framework, validators and nominators
    earn rewards in the form of crypto tokens. This happens in every era, and there
    is a maximum window in which such rewards may be paid out - 84 eras. Anyone can
    trigger a payout that doesn''t happen automatically.


    Crunch is a command-line interface and a Matrix bot to claim staking rewards every
    era for Substrate-based chains, thus reducing the need for manual interactions
    with the blockchain.


    This component is a fork of turboFlakes/crunch with changes specific to Creditcoin
    3.0 and with the intention to be used for automatically requesting payouts by
    Gluwa''s own validator nodes. It is written in the Rust programming language.


    Source: https://github.com/gluwa/crunch


    # Timeline of Creditcoin 3.0


    This book outlines testing activities from the initial creation of 3.0 repositories
    until shortly after the public announcement of Creditcoin 3.0 Testnet - roughly
    between December 2023 and May 2024.


    Creditcoin 3 Testnet was announced on March 21, 2024²


    # Testing of Creditcoin 3.0


    Testing for the 3.0 version largely builds upon the experience gained during testing
    the 2.x family of Creditcoin. This means like static analysis tools, external
    and internal linters, and automatic updates, for example, Dependabot, are basically
    the same as in previous version.


    > ²https://creditcoin.org/blog/creditcoins-real-world-evm-testnet-is-live/


    Because development of Creditcoin 3 began after 99% of the testing practices and
    infrastructure of Creditcoin 2 was already in place, it was fairly common in the
    early days to copy all of the CI configuration verbatim from the Creditcoin 2
    repository and then adjust bits and pieces where needed. This section will try
    focusing on what''s different in terms of testing for Creditcoin 3.0 instead of
    repeating all of the items I''ve mentioned for Creditcoin 2.0 and 2 previously.


    Keep in mind that one of the main testing objectives for the 3.0 version is EVM
    compatibility.


    Here''s how a typical CI pipeline exercised on pull requests looks like (Figure
    7-2).


    ![](img/fdf35d2d28d1fdd7aff60f2490629a1b_175_0.png)


    **Figure 7-2.** CI jobs overview


    # Unit Tests


    The Rust code base of Creditcoin 3.0 has a very small number of unit tests predominantly
    coming from the evm-tracing package. The rest are checks around Ethereum account
    ID derivation and checking that extrinsic weight is EVM compatible. Precompiles
    are similar to extrinsic functions, and they have their own unit tests as well.


    # CHAPTER 7 CREDITCOIN 3.0


    The actual source code inside the gluwa/creditcoin3 repository, except the evm-tracing
    package and precompiles/ directory, is mostly the runtime plumbing. There isn''t
    much that can be exercised on the unit test level – there are no custom RPCs or
    custom metrics, there are no pallets, nor are there custom extrins like in Creditcoin
    2.


    # EVM and Smart-Contract Testing


    We''re using a smart-contract test suite, written by a different team. This test
    suite is packaged as the @gluwa/evm-network-test NPM package and provides a few
    executable commands as its entry points. At the time of writing this book, there
    are basicTest and gasTest commands both of which require a Creditcoin RPC URL
    and a private key as their arguments. These commands can be executed as:


    ```

    ./node_modules/.bin/baseTest --rpc <creditcoin-rpc-url>

    --private_key <private-key-for-a-funded-account>

    ```


    Note that addresses and private keys are here in the EVM format, starting with
    0x, not the Substrate format. For executing against a standalone blockchain running
    in developer-mode, one can use the pre-funded development accounts and their addresses
    and private keys which are described in more details on https://docs.moonbeam.network/builders/get-started/networks/moonbeam-dev/#pre-funded-development-accounts.


    This EVM test suite is executed via Hardhat Runner – a popular task runner, part
    of a popular development environment for Ethereum-based smart-contracts called
    Hardhat. The actual files containing test scenarios are written in JavaScript
    with the popular chai assertion library which is the default in the Hardhat ecosystem.


    baseTest compiles and deploys a smart contract which represents a crypto token,
    then exercises various transactions on it, and asserts on the expected state.
    The focus here is to make sure that a contract representing an ERC20 crypto token
    can be deployed onto Creditcoin, tokens can be transferred between different wallets,
    and in general that users can interact with the deployed contract. The gasTest
    tool collects results into a CSV file. Despite its name, there are no assertions
    in this file.


    The source code repository for this test suite isn''t available via GitHub, but
    the NPM package, published under the open source MIT license, is available from
    https://www.npmjs.js/package/@gluwa/evm-network-test, and you can examine the
    actual code after installing it. just cd into the node_modules/@gluwa/evm-network-test/
    directory and take a look.


    From the blockchain point of view, the tools which are part of this test suite
    are executed against every environment we run blockchain-related integration tests
    on, for example, local, Devnet, Testnet, etc. You can think of it as another branch
    of the integration test suite which is available in the main repository.


    # Testing EVM Tracing Functionality


    The RPC methods debug_traceTransaction and debug_traceBlockByHash are the entry
    points to EVM tracing, and they are exercised via an integration test which deploys
    a smart contract, makes a couple of transactions, and then calls these RPC methods
    with the respective transactions hashes and asserts on the responses. These two
    RPC methods are meant to be consumed by third-party providers, so they are considered
    to be important, and if this breaks, that will be a major blocker. This isn''t
    a stand-alone test suite but rather just one of the existing scenarios.


    # Integration Tests for the Blockchain


    This is the parent of any sort of so-called integration testing related to the
    blockchain itself. It is written in TypeScript and uses the Jest testing framework.
    Source code location under the gluwa/creditcoin3 repository is cli/src/test/blockchain-tests.


    > To make it easier/simple to reuse shared code and helper functions, the blockchain
    integration test suite is bundled together with the unit/integration test suite
    for the Creditcoin 3 component. This saves a bit of effort to figure out everything
    is and makes the code base simpler. An alternative is moving it into a separate
    directory and managing dependencies separately which was perceived as extra work
    without benefit.


    Similar to Creditcoin 2, this test suite is controlled via Jest config files and
    can be executed against different environments, including a production environment.
    At the time of writing, it includes the aforementioned evm-tracing tests, queries,
    and asserts on some runtime values from the running chain it is being against
    and exercises the available precompile, substrate_transfer, from the outside.


    Another important mention here is that Creditcoin 3 is more diverse when it comes
    to configuration for different environments. The major difference is in block
    time and staking duration which are different for local, Devnet, and Testnet.


    # Precompile Testing


    This was already mentioned, but it deserves a separate section because there''s
    more in this area. Obviously there are unit and integration tests which cover
    positive and negative path scenarios. There is also something else, called contract
    metadata.


    This metadata is stored in JSON files, and the Blockscout explorer application
    reads these JSON files via their URL. That''s necessary so that Blockscout knows
    what additional information to display for this contract when analyzing internal
    transactions related to it.


    This metadata contains the precompile name, address, and its bytecode, as well
    as an 1-line version of the Solidity source code. It is treated as an external
    API interface from the Blockscout application.


    On the testing side, I mostly use custom static analysis scripts to assert on
    things like


    - File names don''t change b/c will result in 404 errors and break the consumer
    application.

    - Bytecode and source code included in metadata actually match the Solidity interface
    definition.

    - Addresses are defined in separate JSON fields so they need to match.

    - We already know how to automatically update source code in the repository to
    regenerate metadata in the event the underlying source code changes and commit
    to git using gluwa-bot.


    - The naming convention is here per branch ak environment (e.g., Devnet, Testnet,
    Mainnet) to make sure that expected files are available based on which branch
    we are releasing into and roll forward the aforementioned automatic source updates
    according to the existing release procedures.

