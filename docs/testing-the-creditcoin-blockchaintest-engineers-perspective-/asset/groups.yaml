    \ CI 中执行任何测试之前，所有类型都已更新，并且只有在这些测试通过时，更改才会包含在提交中。\n\n## 使用 Gluwa-bot 进行基准测试和权重生成\n\
    \n在 Substrate 中，基准测试（benchmark）是一种发现链上操作（extrinsic）计算复杂性的程序方法。通常情况下，它与存储读写次数有关。基准文件由人工编写。\n\
    \n然后，基准测试作为 CI 的一部分被执行，以确保它们可以编译且不会崩溃。这是健康测试部分。\n\n在发布之前，会在参考硬件上执行基准测试，生成的权重会被提交到发布分支。因为这与开发分支不同，同一个提交也会自动重新变基（rebase）并针对开发分支发布一个\
    \ pull request。这确保了所有内容都得到了发布，同时也通过开发分支，最大限度地减少未来的偏差以及在 git 中解决冲突的需求，特别是在发布过程中。\n\
    \n## 迁移与升级测试\n\n在内部调包（pallets）中，只有 `pallet/creditcoin/` 包含了存储迁移。它们按顺序命名为 v1、v2、v3\
    \ 等，每一个都在模拟环境中通过单元测试进行验证。\n\n这是为了确保迁移函数按预期运行——换句话说，存储项实际上被迁移（类似于 ORM 应用中的数据库迁移）。该模拟环境还测试了迁移前后的钩子（hooks），作为对迁移函数内部错误的早期警示。然而仍然存在一些不确定性：\n\
    \n- 我们遗掉了边缘情况\n- 迁移在实际生产数据上是否可行\n\n这些不确定性通过两个额外的测试任务来：\n\n- 1) 模拟升级过程并确保其不会崩溃\n\
    - 2) 模拟链上状态和本地存储，确保存储迁移能够应用而不会崩溃\n\n相同的模拟通过两种不同的方法执行：\n\n- 1) 通过 `try-runtime`：这是\
    \ Substrate 框架提供的一功能set，允许在内存中模拟升级和迁移。它查询生产 RPC 端点以获取当前链上状态并在本地内存中进行复制。然后它针对本地内存存储执行迁移。如果没有失败，我们就认为成功。这可以被视为运行时升级的健康测试。详细的上游文档见\
    \ https://paritytech.github.io/try-runtime-cli/try_runtime/\n- 2) 分叉链并升级：这种方法更接近现实，因为它消耗真实的生产数据并执行真实的运行时升级（在隔离环境中）。\n\
    \n# 第 5 章 CREDITCOIN 2.0\n\n首先，我们启动一个 `creditcoin-node` 并与已有的区块链同步——例如测试网或主网，取决于我们的发布目标。然后使用一个名为\
    \ `creditcoin-fork` 的辅助工具 https://github.com/gluwa/creditcoin-fork，抓取当前的链上状态并记录到\
    \ JSON 文件中。该 json 文件代表了一个新的链规范，其中创世区块是最新链上状态的副本。这允许我们执行一个本地链，其存储项与生产版本匹配，但仍向其中注入开发账户并独立运行。当新创建的本地链运行时，执行运行时升级以触发存储迁移。通过后，针对分叉执行集成测试套件，以确保分叉在功能上与原始一致。\n\
    \n对于升级和迁移测试，我们使用自托管的 GitHub runners，这些 runners 按需在 Azure 中部署。这是因为升级和迁移工作流需要大量内存——至少\
