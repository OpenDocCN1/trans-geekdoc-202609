    # 权重与基准 (Weights and Benchmarks)


    权重代表了在区块链上执行特定交易所需的计算负载，是确定交易费用的主要组成部分。在区块填充交易时，每个区块有一个容纳的最大权重。在像 Creditcoin 等基于
    Substrate 的链中，权重通常表示为每个外部函数（extrinsic function）在链上的读取和写入操作次数。权重也会随着硬件配置而变化。


    基准测试（Benchmarks）提供了一种一致的方法，用于表达在运行时不同条件下执行不同函数所需的时间。基准测试由开发人员编写，然后可以用于自动为外部调用生成更准确的权重！


    通常，这些基准测试会在指定的“参考硬件”上执行，自动生成的权重将包含在源代码中。此操作将定期进行，例如在准备新版本发布时。


    参考硬件是根据你对区块链的功能和客户/参与者目标所决定的任何设备。对于 Creditcoin 来说，这是 Azure 中内存优化的 `Standard_E4as_v4`
    虚拟机实例。Substrate 框架的创建者 Polkadot 推荐更强大的硬件：Google Cloud Platform 上的 `n2-standard-8`
    虚拟机实例以及 Amazon Web Services EC2 上的 `c6i.4xlarge`。


    # 运行时 (Runtime)


    `runtime/src/` 目录下是所有组件组合的地方，用于定义构成 Creditcoin 节点的内容。大部分是管道代码（plumbing code），为实现中涉及的所有模块（pallets）定义具体的的数据类型，例如：


    ```

    pub type Moment = u64;


    // 识别链上账户的某种方式。我们刻意将其等同

    // 于交易签名方案的公钥。

    pub type AccountId = <Signer as IdentifyAccount>::AccountId;


    // 账户余额。

    pub type Balance = u128;

    ```


    运行时本身被编译为 WebAssembly (WASM)，并可以作为发布流程的一部分发布到链上。当原生编译的运行时版本与链上运行时版本匹配时，Substrate
    节点将使用其原生运行时，因为它速度更快。在所有其他情况下（当链上和原生运行时版本号不匹配时），节点将使用从链下载的 WASM 运行时。这就是为什么更新基于
    Substrate 的区块链实现的版本号非常重要！


    这使得发布和升级过程变得简单得多，因为矿工不需要同时升级他们的容器！需要指出的是，不同原生和 WASM 版本之间的兼容性/互操作性属于 Substrate
    框架本身的范畴，尚未作为 Creditcoin 的一部分进行过详细测试。我不记得由于团队在版本号更新上采取的预防性方法，这曾出现过问题。


    # 存储迁移 (Storage Migrations)


    对链上存储实际信息的良好类比是典型 Web 2.0 应用的数据库。类似于 Creditcoin 2.0 中的 ORM 模型，我们拥有存储项，这些数据类型定义了写入链上的内容，例如，账户与余额之间的映射，或出贷人与借款人之间的映射！在区块链上，这些都以二进制格式（SCALE）在我们的实现中进行编码。


    # 第 5 章 CREDITCOIN 2.0


    随着业务逻辑和源代码的更改，我们需要执行操作，将二进制数据从旧格式转换为目标所需的当前格式。这就是迁移组件负责的工作，它的行为类似于传统 ORM 框架中的数据库迁移。


    迁移通过 WASM 运行时升级时的内部钩子（hooks）触发，并遵循内部编号方案。每个单独的模块（pallet）都可以有自己的迁移，且独立于其他模块。在 Creditcoin
    2.0 中，系统模块外，只有 `pallets/creditcoin` 包含自定义迁移。


    # 自定义 RPC (Custom RPCs)


    此组件允许你定义并暴露额外的 RPC 方法，供外部应用程序使用。这些方法可以是你决定的任何内容。在 Creditcoin 2.0 中，它用于暴露一些与挖掘相关的统计数据以及用于监控运行中的矿工节点的链内部信息。


    在 Substrate 框架中，RPC 方法通过 HTTP 和 WebSockets 同时以 JSON-RPC 暴露。


    # 遥测与自定义指标 (Telemetry and Custom Metrics)


    Substrate 框架允许你自动向 Prometheus 暴露遥测流（这是一个开源监控系统），并在 Grafana 中可视化这些指标。此组件也允许你定义自己的指标，这些指标可以方便地以纯文本格式在
    `<url>:9615/metrics` 访问。


    在 Creditcoin 2.0 的某些情况下，相同的数据会以 a. 两种形式可用。


    '
