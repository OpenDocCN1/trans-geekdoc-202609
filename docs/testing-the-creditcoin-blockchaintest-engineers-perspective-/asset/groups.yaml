    # Timeline of Creditcoin 2.3


    The timeline for v2.3 stretches roughly from May to September 2023. It is a period
    of rapid testing and development during which the major components have been fleshed
    out. This period goes through development, NPoS Testnet announcement plus community
    engagement, and finally the migration of Creditcoin Mainnet to proof of stake.


    The primary goal here is to make sure none of the existing functionalities breaks
    and that making the switch to proof of stake doesn’t bring the network down -
    both in terms of the network staying up; the network keeps producing blocks after
    the switch and older history is still accessible.


    A secondary objective is to make sure users can assume newly introduced roles,
