    # CHAPTER 6 CREDITCOIN 2.3


    The other part of “testing the documentation” is actually following all of the
    technical steps listed and making sure they are correct; the order is the correct
    one, and the commands shown will result in the documented outcome, making sure
    that version numbers, URLs, etc. are also the correct ones.


