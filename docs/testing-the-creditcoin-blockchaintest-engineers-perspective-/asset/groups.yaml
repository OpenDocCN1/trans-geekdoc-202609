  - '[PAGE 169]


    # Precompile(s)


    This is a component internal to the gluwa/creditcoin3 repository which was added
    after the official announcement of the Creditcoin 3 Testnet. This component allows
    you to bridge the gap between the Ethereum side of Creditcoin 3 and the Substrate
    runtime and interact with the runtime from the EVM side which isn''t normally
    possible.


    From an external point of view, this component acts as a smart-contract which
    is always available at a fixed address, sort of a predefined collection of smart-contract.
    Implementation wise there is an entry-function which is written in Rust and is
    part of the Creditcoin runtime. This is very similar to a extrinsics function.
    Then there is the smart-contract interface definition written within the Solidity
    language. The important part here is the predefined address at the contract is
    going to be deployed.


    At the time of writing this book, Creditcoin 3 contains a single precompile called
    substrate-transfer, whose goal is to make it easier to fund EVM addresses on Creditcoin
    from existing Substrate wallets in just a single step (otherwise that would take
    two steps). It is available at address 0x00000000000000000000000000000000Fd1 https://creditcoin-testnet.blockscout.com/address/0x00000000000000000000000000000000Fd1


    A counter example which contains more precompiled contracts is the Moonbeam network;
    see https://docs.moonbeam.network/builders/pallets-precompiles/precompiles/ and
    https://github.com/moonbeam-foundation/moonbeam/tree/master/precompiles for more
    details.'
