    Rust 重写了。如图 4-1 所示，一个 Sawtooth节点代表多个组件的集合。


    ## Sawtooth 节点


    ![](img/fdf35d2d28d1fdd7aff60f2490629a1b_62_0.png)


    **图 4-1 参与网络的多个 Sawtooth 节点示意图**


    许可证：Creative Commons Attribution 4.0 国际许可证；见 https://github.com/hyperledger/sawtooth-docs/tree/main


    源：https://github.com/hyperledger/sawtooth-docs/tree/main/1.2/developers_guide/creating_sawtooth_network


    使用 Hyperledger Sawtooth 的区块链实现由多个相互连接的节点组成。在 Creditcoin 的 Sawtooth 架构中，上述每个组件都作为独立程序实现并作为容器镜像。单个
    Creditcoin 节点是运行容器的集合，例如在测试期间使用 docker-compose 启动。


    ## Creditcoin 1.x 的组件


    以下是 Creditcoin 1.x 高级组件列表。请始终记住这些组件之间是完全独立的，它们作为独立的容器分布，并与其他 Creditcoin 节点进行通信！每个组件都可能有自己的子组件！


    ### Client


    ccclient 是一个命令行程序，允许人类通过注册以地址、收集初始 CTC 代币，并作为贷款人、借款人或收集者参与 Creditcoin 区块链。该程序不仅允许用户向区块链发送特定交易，还允许他们执行某些查询。这里是某些命令的形式：


    - 转账

    - 卖单

    - 买单

    - 报价


    ```

    show Balance sighash|0

    show Address sighash|0 blockchain network

    show MatchingOrders sighash|0

    show CurrentOffers sighash|0

    show CreditHistory sighash|0

    show NewDeals sighash|0

    show Transfer sighash|0 dealOrderId

    show CurrentLoans sighash|0

    ```


    SendFunds amount sighash

    RegisterAddress blockchain network

    RegisterTransfer gain transferId TxId

    AddAskOrderId amount fee expiration

    AddBidOrderId amount fee expiration

    AddOfferOrder bidOrderId expiration

    AddDealOrder offerId expiration


    bitcoin RegisterTransfer gain dealOrderId|repaymentOrderId sourceTxId

    ethereum RegisterTransfer gain dealOrderId|repaymentOrderId

    rc20 - ...


    此应用程序从 json 文件读取配置，然后与 Sawtooth 网络单节点的 REST API 端点通信。可以是任何节点，但通常是 Creditcoin 的公开
    URL 或你自己在运行的节点。此组件用 C#.NET 编写。


    源代码：https://github.com/gluwa/creditcoin-legacy-client


    ### Validator


    在 Sawtooth 框架中，验证器（validator）组件确保相同的交易导致相同的状态转换，并且网络中所有参与者得到的数据是相同的。验证器有两个主要的子组件，使用调度器根据交易处理情况计算更改和生成的
    Merkle 哈希值。这些子进程负责创建新的候选区块、完成已发布的区块并验证提议区块以确定其是否应被考虑进入新链。虽然名称相同，但请不要将其与 Creditcoin
    2 及以后版本范围中定义的验证器混淆。


    '
