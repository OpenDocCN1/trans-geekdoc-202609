    根据测试矩阵新部署了带有相应标签的运行器（runners），然后在 `integration-test-cli` 任务定义中使用相同的标签来选择合适的运行器。这确保了六个唯一的运行器，每个运行器只会被分配给一个集成测试任务。完成后销毁它们！


    此举使得矩阵中运行时间最长的测试任务缩短了 30 分钟。我推测，尽管区块链相关的操作有大量的等待，但使用这些自托管运行器（self-hosted runners）仍然比
    GitHub 共享运行器更快，因为它们是专用资源，不会过度订阅。I/O 和大多数 CPU 操作花费的时间会更短，因为底层操作系统正在全力处理你的测试任务，而不是成百上千个其他进程。我还没有确凿的证明这是否真实原因，但它是合理的，而且实证结果表明使用这些自托管运行器比共享运行器更快。


    **注意** 除了你的托管环境中可以同时部署虚拟机数量的限制外，还有另一个更微妙的因素可能对你的 CI 施加意外的限制。这就是你选择的云提供商设置的 API
    请求速率限制，与你需要按需部署资源的频率有关。在 Creditcoin 3 中，我看到底层部署 API 返回 **429 Too Many Requests**
    的频率足以令人恼火，并导致我的 CI 设置失败！


    这告诉我，我在任何给定时间可以拥有的虚拟机总数与我每小时/每分钟允许的 API 请求数量没有关系。如果你的测试高度依赖于自托管运行器，这个问题需要进行更详细的评估。


    使用 GitHub Actions 现有的语法完成所有这些并不困难；但它带来了一个不希望的副作用——你现在有了一个依赖于另一个矩阵测试任务的矩阵测试任务，见图
    7-9。如果其中一个集成测试任务失败或超时，没有简单的方法可以重启它。我的意思是，你可以在 GitHub 界面上点击那个特定失败任务的重启按钮，但这会导致不想要的结果。你所做的最好就是一起重启矩阵中的所有任务——而这通过目前的
    GitHub 界面简单是不可能的——你必须重启在同一个 yaml 文件中定义的所有任务。


    在写此书时，这是一个相当最近的问题，但我想我知道解决方案应该是什么。如果在 `dependency-github-runner` 任务之前还有一个 CI（即在依赖链的左侧），它可以作为入口点。我们称之为
    `integration-test-cli-entrypoint`。如果后续的任何任务需要重启，测试人员可以重启 `integration-test-cli-entrypoint`
    任务以及其后的所有内容。这仍然不是最优，但它不会触发同一 yaml 文件中定义的其他 CI 任务重启。我正在本能地尝试！


