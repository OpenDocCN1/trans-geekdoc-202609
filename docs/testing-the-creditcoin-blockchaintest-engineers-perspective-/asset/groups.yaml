    在检查了上游仓库的状态后，我不认为 GitHub 上发布的代码与生产环境中所使用的代码完全相同。至少对于涉及的所有组件而言是如此。


    然而，那里并没有更好的替代方案。如果团队认为这些上游组件不够好，我们可能不得不投入更多时间来开发自己的组件，或者与第三方供应商进行及时的讨论，以使用他们的托管服务。这作为一种长期策略是可行的，团队可能也会这样做，但在我们拥有快速开发周期时，这种做法在短期内行不通。


    ## 提示：对你可能依赖的任何关键第三方开源组件的状态进行断言（Assert）！即使该组件最初看起来并不那么关键！


    接下来的挑战与之相关——由于不熟悉所有组件本身，导致未能充分理解组件的需求；以及与利益相关者就其发布计划和感知质量水平的预期沟通不够详尽。在实践中，“公共测试网发布”在进度和质量上与实际的主网发布非常接近。对于这个测试网，人们并不期望它达到
    Beta 质量，而是期望它将接近生产级质量，仅存在细微的问题和错误。这与其他、更传统的软件的开发和发布方式不同。换句话说，大部分的测试和开发压力集中在发布周期的早期，你的冲刺阶段（sprints）可以大致归类为活跃期和其他相对安静的时期。


    在某些领域，无疑是区块链和加密货币，测试发布版本的出现可能比该发布版本的功能质量更为重要。这扭曲了看似微小问题的优先级，


    ## 第 6 章 CREDITCOIN 2.3


    使得那些“你可能以后再修复”的问题实际上变成了一个需要快速处理、甚至可能阻碍你发布的重大问题。这完全关乎面子（optics）！


    我在本书早些部分提到过，在依赖第三方组件时，你需要意识到谁是生产它们的供应商以及他们的主要业务目标是什么。在直接修复开源应用时，这确实如此。例如，Polkadot
    Staking Dashboard 被 Polkadot 区块链使用，我发现了一些他们乐意容忍的 Bug。另一方面，同样的 Bug 也出现在 Creditcoin
    Staking Dashboard 中，而它们被视为 Creditcoin 产品所有者不太愿意容忍的问题，因此必须在同一领域内投入额外的开发和测试资源。仅仅因为一个规模更大的玩家使用了与你相同的底层软件组件，并不意味着该底层软件是
    100% 顶尖的！


    > 提示：确保整个团队都对质量方面的预期达成一致！确保工程人员和利益相关者达成共识！


    此外，如果我们这些测试人员能够率先采用验收/发布标准，将是极好的。这些标准在处理企业级软件的大型组织中常见，但在快速发展的初创企业类环境中要少得多。


    例如，Fedora Linux 发行版的的基础发布标准记录在 https://fedoraproject.org/wiki/Basic_Release_Criteria，在特定版本中添加的每个新功能都有自己的额外标准。我相信这有助于大家对交付内容建立预期，并进行反馈、计划和调整。显然，这可以从小开始并随着时间的推演变，但我认为缺乏标准是一个错误，尤其是对我这个测试人员来说。


    ## 从 PoW 到 PoS 的迁移


    实际的迁移过程被列入了一份清单文档中，并在不同的环境中执行了多次：本地、Staging（主网的分叉），直到团队对所有步骤都充满信心，并且在实际迁移主网节点之前没有明显的问题为止！


    遗憾的是，`switch_to_pos()` 外部调用、上述清单以及所有与断言迁移前后从工作量证明到权益量证明的状态相关的测试，在之后就不再需要了，并且已被删除。那确实是一次“一次性”的测试。


    ## 总结


    Creditcoin 2.3 显然挺过了向权益量证明的切换。在写本文时，已经过了 200 万个区块之后，因此区块链作为权益量证明运行的时间超过了它作为工作量证明运行的时间。更重要的是，我度过了这段非常忙碌的，并学习了更多关于“测试区块链”的方面，这些是我以前没有考虑过的。


    在下一章中，我将讨论下一次迭代——Creditcoin 3.0 以及它带来的新颖性。团队再次进行了切换——这次方向略有不同。


    ## 第 7 章


    ## Creditcoin 3.0


    Creditcoin 3.0 是 Creditcoin 的下一次演进，从一个记录贷款交易的专用区块链演变为针对现实资产管理的更通用链。它是一个完全兼容 EVM
    的 Layer 1 区块链。句话说，它支持智能合约开发，并与以太坊生态系统的许多流行工具兼容，例如钱包 App 和智能合约开发工具。Creditcoin 3.0
    使用 Substrate 框架构建，在其上方添加了一个特殊的 EVM 兼容层，并使用了提名权益证明（nominated-proof-of-stake）共识算法。


    两个主要设计特性是 EVM 兼容性和通用预言机（Universal Oracle），它解锁了多链信息流和跨链交易，以构建和部署多链合约。开发分阶段进行，在编写本书时，仅实现了
    EVM 兼容层。


    Creditcoin 3.0 是作为一个独立的区块链提出的，而不是来自 2.x 系列的增量式升级，这再次极大地简化了开发和测试。原始提案还规定，Creditcoin
    2 功能将作为 L2 实现在 Creditcoin 3.0 上。我假设这是一个能够记录贷款流程的智能合约（s）。在编写时，这些实现细节尚不存在。


    第 7 章 CREDITCOIN 3.0


    **注意**：Creditcoin 3.0 测试网的公开公告 ¹ 也提到了现有区块链的重命名。之前的 Creditcoin 2 将重命名为“Creditcoin
    Classic”，而新的 EVM 兼容 v3.0 将简单命名为“Creditcoin”。在本书的剩余部分我将继续使用显式的版本号以避免混淆。


    ## Creditcoin 3.0 的组件


    我在这里概述 Creditcoin 3.0 中最重要的组件。由于它是基于 Substrate 的链，某些项目与 Creditcoin 2 相同。


