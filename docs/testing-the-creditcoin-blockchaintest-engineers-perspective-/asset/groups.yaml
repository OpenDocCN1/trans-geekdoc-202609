    PoS 的迁移过程后最初卡住了。由于是在调用 `switch_to_pos()` 外部（extrinsic）时，它期望一个账户列表，这些账户将在第一个选举周期完成之前作为初始验证者。该列表预期每个验证者有两个条目——质押账户（stash）和一个控制器账户（controller
    account），然后这些条目会被传递给生成新块的 BABE 插件（pallet）。其中这些参数在源代码中指定的顺序与 BABE 期望的顺序相反。在之前的测试中，我们始终对质押和控制器账户使用同一个账户，因此我们并没有发现这个
    bug。从“测试”的角度来说，阶段环境起到了它的作用，捕获了这个问题。


    顺带提：“stash”和“controller”是来自 Substrate 框架的概念，其中一个账户（“controller”）代表另一个账户（“stash”）执行操作。在迁移期间，Substrate
    已经发布了框架的新版本，从 stash + controller 账户迁移到单账户，因为使用两个账户会令人困惑。在 Creditcoin 3.0 中只有一个“stash
    账户”！工程团队中的每个人都知道这一事实，这就是为什么没有人考虑过使用两个不同的账户进行测试的原因，包括我在内。


    在阶段环境中发现了另一组与迁移相关的问题，这两者都几乎肯定会导致整个区块链的崩溃。这两个问题都与一个特定的区块号有关，因为该数字被用作一个硬编码且足够大的值：


    - 1. 发现了一个初始问题，节点内存耗尽并崩溃。这发生在运行时升级（runtime upgrade）之后。该操作尝试分配过多的内存并导致节点崩溃。内存足够大的机器没有崩溃，但升级花费的时间太长，无法被认为是行的。


    - 2. 下一个问题是相邻的——在每个区块上执行的 `on_initialize()` 钩子尝试从存储中删除许多项。在 Creditcoin 2.0 中，发现该相同的函数过于急于从链上存储中读取项到内存中；请参见
    https://github.com/gluwa/creditcoin/pull/1253 。当前的问题是要删除的项太多，导致 I/O 操作花费的时间超过了在破坏区块生产之前必须提交新区块的允许时间。这是
    `::clear_prefix(block_number, u32::MAX, None)` 代码段试图删除数量极其离谱的项。此修复位于 https://github.com/gluwa/creditcoin/pull/1353
    – 对可以删除的内容设置了限制。


