    is fintech partners who would like to record transactions onto the blockchain
    and are willing to access prior credit history and/or gain access to potential
    new markets and business opportunities that infrastructure enables. For example,
    one such partner is Aella in Nigeria. In fact according to the Creditcoin documentation,
    Aella is the first institutional user of the Creditcoin blockchain, having integrated
    its operations with Creditcoin in June 2022.


