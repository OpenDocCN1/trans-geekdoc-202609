    Web 或移动开发要高。


    虽然在 Web 和移动端你仍然依赖许多第三方组件，但它们背后的组织通常不是你的直接竞争对手。例如，Django 和 Ruby on Rails 框架由大型社区开发，并由各自的非营利基金会管理，唯一目的是为
    IT 社区提供更好的框架来创建 Web 应用。另一个例子是分别由 Facebook 和 Google 的 React Native 和 Flutter 移动应用框架。虽然
    Facebook 和 Google 并不是独立的软件供应商，但它们的核心业务依赖于快速开发高质量应用的能力，而且它们开发了大量的软件，这意味着它们实际上有直接的动力去创建良好的通用开发框架。


    特别提到 Substrate 区块链框架及其生态系统，其主要开发者是 Polkadot/Parity Technologies，其核心业务是运行 Polkadot
    网络区块链。虽然它们在提供通用区块链框架方面做得非常出色，但我们必须考虑到某些组件的内部优先级可能比其他组件更高，这与它们的业务目标一致。特别是我在 Polkadot
    Staking Dashboard 基础中看到过一些问题，这些问题导致了 Creditcoin 侧的问题。这种情况是：相同的核心技术导致同一领域内运行的两个不同供应商出现了多样化的已知问题和
    Bug。在我看来，这需要考虑的一种技术风险，这种风险在更传统的 Web 和移动世界中程度较小。


    由于上述提到的所有因素，我认为 Creditcoin 的测试策略是“计划-构建-测试-发现-重复”，或者用我喜欢的话说是“吃饭、睡觉、测试、重复”。也就是说，测试
    Creditcoin 和提高质量是一个迭代过程，随着新领域和风险的发现，该过程会不断自我完善。


    这也意味着，区块链实现的测试与其开发是紧密耦合的，你可以通过将测试工程师直接嵌入开发团队来获得最大的成效。考虑到已经提到的所有限制条件，我认为没有其他办法了。


    关于测试的一个好消息是，尽管 Creditcoin 区块链用于记录真实世界金融资产的信息，但它并不直接处理此类资产。贷款和还款转账由双方在另一条区块链上发起的，这意味着你并不直接处理转账，只是检查并记录有关它们的信息。这大大减少了在任何金融服务应用中发现的相关风险。


