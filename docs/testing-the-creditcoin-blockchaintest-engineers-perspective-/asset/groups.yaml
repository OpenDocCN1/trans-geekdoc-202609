    分层方法，其中所有功能将在隔离环境中进行测试，并仅针对生产环境进行部分测试。这引发了关于信任度的问题。


    第三种可能性如图 7-8 所示，是将传统的“设置-执行-断言-清理”（setup-act-assert-teardown）流程分为多个可以独立执行的单元，例如通过
    cron 或某种队列执行。这些独立的自动化部分需要在之间共享数据，在区块链测试的范围内，可能最简单的方法直接将此类数据记录在链上——不需要额外的 SQL 数据库。QA
    和利益相关者应该能够为了状态报告查询这些数据。然而，这并没有解决触发这些自动化脚本的问题——智能合约无法自行启动操作，因此你需要一个外部进程定期调用智能合约中的函数。在智能合约内部运行的函数还面临着耗尽燃气（gas）并导致回滚的挑战，因此你不能在测试开始时调用一个函数；让它睡眠几天，然后让它进行清理。智能合约也不可能与链外世界交互，例如跨互联网调用
    API 函数。目前有像 ChainAPI (https://chainapi.com/) 这样的解决方案，但我尚未尝试过。


    我认为长运行测试场景编排的一种实用的解决方案看起来如下所示：


    - 触发测试设置 + 执行脚本。

    - 测试数据被记录在共享位置，可能通过智能合约记录在链上。

    - 将期要执行的自动化脚本被记录在队列中，并可能带有它们需要执行时的估计区块号。

    - 在未来的某个时间执行断言 + 清理部分；结果通过智能合约记录回链上。


    在某些情况下，清理部分本身就是一个包含多个步骤的长运行任务。例如，释放未绑定资金，然后在一周后提取它们。对于这种情况也遵循已描述的过程。


    在能够访问并测试同一条区块链的背景下，我认为将共享数据记录到链本身是另一种“自食其果”（eating your own dog food）的方式。然而，这并非绝对必要。你可以使用标准的
