    # 测试 Subscan Essentials


    subscan essentials 的上游仓库在测试方面的状态并不理想。GitHub 历史记录显示，在我上次检查时，CI 任务已经失败了一年多，并且有一长串在
    CI 失败的情况下合并到主分支的提交。


    作为 Creditcoin 分支的一部分，我启用了我们在其他仓库中使用的常用工具——MegaLinter、pre-commit CI、Dependabot、CodeQL
    等。还添加了 `golang ci linter` 作为语言特定工具，并确保了代码覆盖率报告并在每个拉取请求中执行 CI。


