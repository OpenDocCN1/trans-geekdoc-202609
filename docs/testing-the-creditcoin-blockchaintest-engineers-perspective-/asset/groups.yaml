    # Other Interesting Testing


    **Tip** Any third-party tools and dependencies that you use, even if only as part
    of your development, testing, and/or release pipelines can fail if you pursue
    an aggressive upgrade strategy.


    In the case of Creditcoin and the Rust programming language, some tools and packages
    require a newer compiler version, for example, https://github.com/gluwa/creditcoin3/pull/159.
    It''s fine when you know that and can wait for all of the relevant bits to be
    upgraded. This becomes an issue when you have extra dependencies, not directly
    specified in Cargo.toml, the Rust package manager files, but rather installed
    directly into CI jobs using fixed versions. To make the matter worse, the CI job
    which failed is executed conditionally and if not part of the pull request updating
    the compiler version! To make the matter even worse, the subsum package, the culprit
    that failed, on crates.io, the Rust package repository, is 3 years old; new versions
    have made it only as git tags and cannot benefit from automatedabot upgrades.


    All in all, it''s a lesson in testing — everything that you use needs to be tested.
    If it isn''t included as part of existing CI/test suites, then you need to make
    sure it is exercised explicitly! Otherwise it is just going to fail when you least
    see see https://github.com/gluwa/creditcoin3/pull/332. At the time of writing,
    I had to upgrade from v0.17.1 to v0.19.0 to avoid compiler errors. Even this version
    isn''t 100% happy. It produces a compiler warning:


    warning: ambiguous glob-exports

    ```rust

    --> lib/src/lib.rs:19:9

    19 | pub use chain_info::*;

    ^^^^^^^^^^ the name `Error` in the type namespace is first re-exported here

    24 | pub use types::;

    but the name `Error` in the type namespace is also re-exported here

    ```


    ## Challenge: How to Analyze and Keep Track of Changes to On-Chain Settings


    There is an interesting challenge related to modifying various on-chain, and possibly
    runtime settings. If you recall, many of blockchain parameters are hard-coded
    under runtime/, and there are many which can also be changed afterward. For example,
    using the Polkadot JS web interface, it is very easy to send transaction and modify
    existing configuration – change minimum amount required to create nomination pools.
    This poses two main challenges:


    - How to keep track of such changes; other words if I am to wipe out existing
    environment and redeploy with the latest version, how do I make sure its parameters
    will be the same as before?

    - How do I analyze such changes in order to figure out possible risks of modifying
    a value on-chain? https://github.com/paritytech/polkadot-sdk/issues/3739.


    The first challenge is relatively easy to solve. Substrate already contains migration
    sub-component, and tests are also not perfect and could have missed a scenario
    which would have negative impact. While enabling whole machinery and testing infrastructure
    around it just so you can change a single value, having all on-chain storage changes
    as part of migration yields several benefits:


    - Everything is in git so history is preserved.

    - Any new environment launched from future versions will take care of itself as
    needed.

    - You can test against mock and production data in order to find edge cases.


    Assuming you know how to solve challenge #2, then you can use migrations machinery
    and implement pre-conditions into the source code which will alert you when a
    migration is to break, for example, when testing against production environment
    before release.


    ## Resource Management for Testing in Production Environments


    I''ve already mentioned how I am capable of testing against multiple environments
    and whenever possible would like to exercise test suites against a production
    environment, including test suites for any third-party components. The challenge
    then becomes how you clean up after yourself when you have long periods of time
    between steps, see Figure 7-7?


    Any operation related to staking will need to be followed by an unbound transaction,
    then waiting for a downtime period and then withdrawal of funds. In such scenarios
    there may be more steps, more actors, and more waiting involved. The period is
    based on block time and number of eras, for example, one validation cycle. When
    doing all of this locally or in CI, it is relatively quick, and you also have
    full control over values and the environment. When doing the same in production,
    the difference is drastic - era is 24 hours. Unbinding period is 7 days. Certain
    operations also depend on when exactly during these 24 hours you issue the transaction
    leading to even wait time. It’s a rolling window of time which can take anywhere
    between 12 and 36 hours for the effect to take place.


    At the time of writing this, I''ve been thinking about how to solve this challenge
    but still don''t have the full answer. The entirety of Creditcoin comprises several
    layers and applications I believe whatever analysis you do must encompass all
    of them. I am a firm believer that in the face of unknown technology, we should
    first strive to understand how it works in its core before trying to search edge
    cases and possible risks. Without in-depth understanding, we are just guessing
    and that is not good in my opinion. The overall process will probably be something
    like this:


    - Find all places in all applications or libraries where a particular storage
    item/setting value is used.

    - Create a list of the different functional areas where it is used, for example
    https://github.com/gluwa/creditcoin3/pull/283#issuecomment-2015 because it might
    not be immediately obvious or because other developers may have decided to add
    additional checks in unexpected places.

    - Try to understand what all of the areas on your list are doing and how they
    work.

    - Trace conditional expressions, and macros, for example, if statements and macros,
    which assert on the value you are analyzing, especially when they yield errors
    and panics. This is a clear indication something will go wrong under specific
    conditions.

    - For values which represent minimum, maximum, etc. inspect your current on-chain
    data to see whether you have outliers. For example, if I am about to reconfigure
    a setting related to minimum amount, do I already have on-chain participants which
    are staking less than the proposed new amount? Sort of a boundary-value analysis
    against the existing data.

    - These "specific conditions" become the prerequisites before you can apply migrations
    and update the setting to its newly desired value. That’s the start of testing
    this area further.


    The above list is a rough outline. It is important to note that it must be codified
    into a more formal process for engineers and stakeholders to follow with several
    places in this process where we can stop, evaluate pros and cons, and make decisions.
    Another important item is that such process and evaluation must not take too long,
    or at least be predictable so that you can deliver software changes in a timely
    manner. And that is the bane of all software development and testing – how do
    you estimate the unknown and how do you manage risk when you have no idea how
    all of the little pieces are supposed to work and when there are thousands of
    little pieces that you rely upon?

