    up-to-date as possible. This reduces maintenance burden over the long run, lets
    you know whether the software under test is still compatible with newer libraries
    or not, and contributes a tiny bit to improved overall security of your software.
    If CI jobs are passing, then merge the updated version, usually with only the
    QA engineer providing review.


    A notable exception here is the Substrate framework itself, which is consumed
    via a git repository. The various components of the Substrate framework rarely
    published by crates.io, the Rust package repository, and require manual upgrades.
    That process isn’t automated in Creditcoin 2.0. Technically speaking, it is relatively
    easy to create your own bot that would propose upgrades for newer versions of
    the Substrate framework, even when consumed via a git fork. It is my impression
    that Substrate is still actively changing frequently which would require manual
    work to inspect and assess any incompatibilities so probably not much benefit
    to be gained by automating this process.


    # Pre-commit CI


    A popular service with Python developers which can modify the source code and
    create a new commit. Creditcoin 2.0 doesn’t use the full capabilities of this
    service - mainly it uses pre-commit CI to correct missing newline at the end of
    files, trailing white space and some types. The service itself has not been designed
    with a Rust or TypeScript code base in mind and the benefit you can get out of
    it is limited. My main motivation for introducing it - annoying missing newline
    characters to just everything look ugly when displaying file contents in a terminal
    [editor]. Just make the code look nice.


