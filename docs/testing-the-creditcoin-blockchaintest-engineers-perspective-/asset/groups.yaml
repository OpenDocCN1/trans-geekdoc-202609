    \n        );\n\n        let new_pallet = SCHEDULER_PREFIX;\n        let new_pallet_prefix\
    \ = twox_128(new_pallet.as_bytes());\n\n        let past_count = useize::from_le_bytes(ctx.try_into().unwrap());\n\
    \    }\n}\n```\n"
