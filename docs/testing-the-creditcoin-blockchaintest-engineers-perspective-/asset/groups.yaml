  mdcn: '


    -   铸造测试：在各种条件下验证铸造功能——暂停的合约、锁定的公共铸造、超过铸造限制。

    -   管理员功能：确保只有管理员可以执行某些操作，例如设置标记 URI。

    -   排除列表：测试与将地址排除在版税支付之外相关的功能。

    -   余额充足检查：验证只有当发送者拥有足够的标记来覆盖版税时，才会发生 NFT 转移。

    -   市场传输：测试特定的市场传输方法及相关的版税。


    Sebastian 在几年前于波兰 TestWare 测试会议上发表的一场名为《区块链测试框架挑战》的演讲中，他提到了多个我们可以且应该测试的区块链组件和层级，但我需要指出，这并不适用于每个人的每种情况。我认为许多区块链相关应用只关注堆栈的某些层，而这正是大多数测试发生的地方。


    在上述描述的示例中，NFT 市场（NFT Marketplace）本质上是一个智能合约，根据业务需求，可能没有必要进行进一步的测试。一个反例是 Creditcoin，其主要测试是在协议层进行的。尽管在
    Creditcoin 2.x 中我们从工作量证明切换到了权益证明共识，但我们并没有测试算法本身的实现。我们测试了过渡程序、保留链上数据和区块历史的能力，但共识算法本身是一个现成的组件，我们的实现直接了它，几乎就像一个即插用的替代品。


    # 第 8 章 其他如何测试区块链


    演讲中我特别喜欢的一句话是：


    > 如果我们不完全理解一个智能合约，并且没有测试它的知识和工具，我们又该如何测试它呢？

    > —Sebastian Viquez


    我完全同意这一点，只需将“智能合约”一词替换为你恰正在处理的任何区块链组件即可。我主要工作在数据模型和事务层的测试，这相对简单。无论如何，我花花了很长时间才能完全理解所有组件及其内部相互作用，从而在我的环境中感到自如。如果你作为一个测试人员，对一个项目是新手的，对区块链技术也是新手的，你不可避免会经历同样的体验。


    在工具谱上，我惊讶地获知 Hyperledger Caliper²⁰，这是一个性能基准测试工具，我本可以在 Creditcoin 1.x 期间使用它。相反，我和我的团队选择了内部工具，因为那是我们擅长的，而且坦率地说，我加入开发周期较晚，没有时间去研究和发现这个工具。在
    Creditcoin 2.x 及其后的 3.0 中，我的团队执行了更多的性能基准测试，这一次我们意识到了 Substrate 生态系统中存在的工具。然而，我们再次选择了内部解决方案，因为现有的工具并不立即适用于我们的情况，创建我们需要的东西比研究如何绕过我们没有经验的工具的局限性快得多。这仅说明在某些领域，工具和测试框架生态系统可能不够成熟，或者不符合你特定的测试需求。


    ²⁰ https://www.hyperledger.org/projects/caliper


    # 总结


    正如你现在所看到的，区块链测试可以非常丰富。我们有许多可以测试的领域，也有许多可以使用的工具。尽管如此，尽管某些软件组件具有固有的复杂性，区块链测试与传统的软件测试并没有太大区别。


    感谢你读到这里。我希望你喜欢这本书，并学到了可以应用到日常工作中非常有价值的知识！


    祝测试愉快！


