    ## 第1章 引言


    加密水龙头（crypto faucet）是一种快速奖励用户的方式，通过让用户在网站或移动应用程序上执行各种任务来换少量加密代币。用户完成的任务可以是点击付费广告、完成
    CAPTCHA 验证、每天登录或与 Discord 机器人交互，例如。在区块链测试环境中，你的团队将拥有内部/外部水龙头，帮助测试人员获取一些加密货币并用于测试。


    主网（Mainnet）、测试网（testnet）、开发网（devnet）和阶段网（stagenet）是区块链网络的多个独立实例。它们之间相互隔离，你可以根据测试和开发需要拥有任意数量的实例。唯一的账户、代币、区块和交易将存在于网络的每个实例中。被称为主网实例是生产环境。其余实例由区块链创建者多或少随机地分配。某些区块链可能有由名称命名的多个测试和开发环境。


    质押（Staking）是投入一定数量加密代币以参与权益证明共识机制的行为。这适用于验证者和提名者角色。其经济激励是更高的投资回报。虽然与传统的投资工具相似，但质押过程本身旨在让用户积极参与，以确保区块链拥有一个健康的社区。记住，区块链是一个高度分布的环境，参与者越多越好。


    罚没（Slashing）是在权益证明区块链网络中对恶意验证者实施惩罚（没收代币）的过程，从而使这种行为在经济上变得可行。罚没也扩展到提名者，


    ## 第1章 引言


    这就是为什么建议区块链质押参与者保持活跃并定期监控区块链上发生的情况的原因。例如，不要为某个验证者投票后就忘记。


    客户端（Client）是任何与区块链通信的软件程序。在区块链应用程序的背景下，我们通常指的是在计算机上原生执行并实现区块链各种组件的软件程序。那通常是在区块链上充当验证者的程序。在更广泛的背景下，客户端也可以指钱包应用或另一个与区块链交互的应用程序，例如质押仪表板或遥测仪表板。它也可以指旨在与特定合约交互的应用程序。


    某些实现具有独立的运行时组件，用于封装交易和业务逻辑，而客户端本身负责处理网络通信、写入存储等底层任务。


    Web3 是万维网的新一次迭代的想法，结合了去中心化、区块链技术和代币经济学等概念。该术由以太坊联合创始人 Gavin Wood 在 2014 年提出。


    智能合约（Smart contract）是使用特定语言（例如 Solidity）编写并存储在能够执行此类程序的区块链上的程序。并非所有区块链都支持智能合约。最流行的例子是在以太坊主网上实现加密货币；然而，智能合约不仅限于此。示例展示了交易性游戏，如井棋、投票、盲拍卖、支付通道等。我认为任何可以表示为交易的内容都可以编写到智能合约中。


    智能合约的核心属性是在部署上链后无法更改（它绑定到特定的地址或交易哈希），并且与智能合约的交互是透明的，以交易的形式表示，尽管所有双方可能是匿名的且并不相互信任。智能合约还可以通过调用暴露的函数来执行其他智能合约。智能合约内部定义的函数执行会被记录在区块链上的交易中。一旦部署上链，智能合约无法更改；但你可以部署新版本的合约，导致不同的合约地址。智能合约拥有合约存储（简称存储）的概念，合约内部可用，可以存储如新创建加密货币的令牌余额等信息。


    EVM，或以太坊虚拟机，是执行智能合约和去中心化应用程序的环境。正如名称所示，此规范源自以太坊主网区块链。该规范是开放的，由以太坊基金会以太坊社区维护。


