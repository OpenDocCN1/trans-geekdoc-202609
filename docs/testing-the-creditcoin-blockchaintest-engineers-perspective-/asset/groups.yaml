  mdcn: "\n\n# 第 5 章 CREDITCOIN 2.0\n\n唯一需要验证的数据是区块链旧实例与新实例之间的账户/余额映射，这通过查询所有数据并进行比较相对容易实现。没有迁移其他数据（例如现有的贷款流交易）是一项业务决策，幸运的是，这同时也避免了在迁移过程中进行更全面数据一致性测试的需要。\n\
    \n为了讨论起，假设保留链历史是一项要求，但不需要让两个不同的技术栈相互连接。在这种情况下，我认为某种重放程序（replay program）将是一个很好的实用的解决方案：\n\
    \n- 查询来自 1.x 版本的区块并遍历结果以检查每个交易。这在技术上是可行的，而且我们已经知道如何做到了，因为所有必要的技术步骤已作为之前的 `creditcoin-legacy-tests`\
    \ 测试套件的一部分在使用。Sawtooth REST API 实际上很好地暴露了这些信息。\n\n- 然后使用相同的输入参数将每个 1.x 交易重放到 2.0\
    \ 链上，重建历史。交易和区块哈希值将会不同；区块号也不会保持一致。为了透明起见，可以在每个数据结构中包含一个旧的 *hash field* 以引用来自 1.x\
    \ 的交易。\n\n- 出于测试目的，查询两条链，并在考虑到两者之间数据表示差异的情况下“确保状态匹配”！这在实际实现方面会稍微复杂一些，但应该是是可行的。\n\
    \n重放程序既可以作为测试和迁移准备的一部分，也可以用于生产环境本身的实际迁移。正如我们在书后半部分看到的，保留链历史已成为 2.3 版本的一项要求！\n\n\
    # 第 5 章 CREDITCOIN 2.0\n\n情况表明之前技术栈的二进制历史应该被保留，这意味着通过现有的哈希值和活动贷款历史查询区块和交易（这本质上跨越了两个不同的链）超本书的范围，因为我没有测试过任何此类内容。我设想实现的最简单方法是让\
    \ Substrate 节点和 Sawtooth 节点共同运行，并加上一个额外的 RPC 路由层，它可以根据区块号连接到相应的链。在这个虚想设置的一个版本中，你必须考虑\
    \ Hyperledger Sawtooth 和 Substrate 之间 RPC 用的差异，或为之提供一个兼容层。你可能需要在新链上生成虚拟区块，以补偿区块高度的差异。\n\
    \n另一种可能性是将 v1.8 的原始区块数据封装进 Substrate 区块中，并将这些区块作为 2.0 网络过程的一部分注入，并在 Substrate\
    \ 实现中提供某种兼容层。哪种方式更容易或更合适，我无法断言。\n\n## Creditcoin 2.0 的组件\n\n基于 Substrate 框架的区块链实现是一个单体代码库，编译后生成一个名为节点（node）的可执行二进制文件。节点有两个主要部分，称为客户端（client）和运行时（runtime）。定义区块链行为的应用逻辑、交易和存储项都定义在运行时内部。客户端部分负责标准化任务，例如点对点网络、暴露\
    \ RPC、共识、生成区块等。与 Creditcoin 2.0 之前的版本不同，所有内容都封装在一个单一运行的容器中。节点本身是一个多线程应用程序，它会产生区块链的各种组件并并行执行它们——如列表\
    \ 5-1 所示，大约有 50 个线程。\n\n## 列表 5-1. 从操作系统的角度看 Creditcoin-Node 进程的貌\n\n```\ncreditcoin3-nod-11*[{creditcoin3-nod]\n\
    \  |{futures-timer}\n  |{log-autoflush}\n    |-10*[offchain-worker]\n      |{rocksdb:high}\n\
    \      |-5*[rocksdb:low]\n      |-20*[tokio-runtime-w]\n```\n\nSubstrate 框架利用了灵活的模块化架构（如图\
    \ 5-1 所示），你可以相对容易地扩展和或替换其组件，允许你仅在需要的地方添加自定义功能。\n\n![](img/fdf35d2d28d1fdd7aff60f2490629a1b_89_0.png)\n\
    \n图 5-1 Substrate 框架的架构\n\nCreditcoin 2.0 使用 Rust 语言实现并以 Docker 镜像的形式发布，尽管为了测试目的，我们通常会编译代码并直接作为独立二进制文件运行。\n\
    \n源代码：https://github.com/gluwa/creditcoin\n\n## Extrinsics Pallets（外部交易插件）\n\n\
    定义区块链业务逻辑的函数称为 extrinsics（外部）。这是其他框架称为交易的内容。在 Creditcoin 2.0 中，这些函数组织在名为 pallets\
    \ 的模块中。Creditcoin 2.0 使用了一些现成的模块，例如 sudo pallet、system pallet、balances 等。它还使用了与主业务逻辑相关的自定义\
    \ pallets。请查看源码内部的 pallets/ 目录。\n\nExtrinsic 函数通过 RPC 自动导出，并可以使用客户端库从外部触发。这就是集成测试套件和客户端应用程序所做的。在编写单元测试时也可以直接调用\
    \ Extrinsic 函数。\n\n## Creditcoin Pallet（Creditcoin 插件）\n\n定义贷款周期如何记录在区块链上，这正是\
    \ Creditcoin 白皮书中详细描述的内容。它提供了与现有 Creditcoin 1.x 家族匹配的 RPC 调用。RPC 接口和函数签名在逻辑上是匹配的。它是集成器和外部应用程序的主要入口点。这也是大部分测试活动关注的地方。\n\
    \n## Difficulty Pallet（难度插件）\n\n难度调整是 POW 算法的重要组成部分。网络难度级别确保区块时间一致性，防止攻击并保持挖矿的盈利能力。该插件负责在每个区块上计算并调整难度。它不对外部使用也不暴露\
    \ extrinsics；但暴露了一些存储项。\n\n## Off-Chain Task Pallet（链链插件）\n\n负责执行需要与外部世界交互的任务，例如验证。链下调度器本质上是一个等待任务的队列。该插件对链上存储具有只读权限，以便组件间的通信。然而，它无法直接写入区块链。\n\
    \n## Rewards Pallet（奖励插件）\n\n在 Creditcoin 2.0 中，在区块链上运行节点的矿工获得 CTC 代币。基础奖励为每个区块\
    \ 28 个 CTC，在区块确认时存入链上。回想 PoW 区块链，多个节点竞争添加区块的机会。成功完成的人获得奖励。启动 Creditcoin 2.0 时，有一个选项\
    \ `--mining-key <SS58Address>`，指定接收奖励的账户地址。该插件负责计算实际奖励并将其存入相应的账户。\n\n## 费用\n\n\
    有一个公式定义了每笔交易的费用。费用可以是固定的，可以是动态的。在 Creditcoin 2.0 中，交易费用是动态的，主要部分是所谓的权重（weight）；见下一节。\n\
    \n- 已建立最小 0.01 CTC 的业务需求。实际价值和费用根据链的使用情况波动，在链不活跃期间可能会低于最低要求，在孤立的新链上进行测试时尤其如此。\n\
    \n- 其工作原理是我们的目标是区块填充率为 25%，因此如果区块填充率小于 25%，则下调费用；如果大于 25%，则上调费用。它源于代币经济学研究¹并与\
    \ Polkadot 区块链的方法相同。费用在 24 小时内的变化幅度最高可 30%。\n\n更多信息和细节请参阅 https://wiki.polkadot.network/docs/learn-transaction-fees\
    \ 和 https://github.com/paritytech/substrate/issues/2430。\n\n> ¹https://github.com/w3f/research/blob/master/docs/Polkadot/overview/2-token-economics.md\n\
    \n"
