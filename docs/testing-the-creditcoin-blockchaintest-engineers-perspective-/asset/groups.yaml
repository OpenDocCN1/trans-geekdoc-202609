  mdcn: "\n\n## 如何构建区块链实现\n\n区块链实现是一种复杂的、基础设施类型的软件，类似于操作系统或数据库管理引擎。你可以通过实现所有相关的组件和算法，来创建一个看起来和运行起来都像分布式账本的东西。\n\
    \n幸运的是，大多数软件公司并不是操作系统或数据库供应商。相反，这些公司从事的业务是为客户解决特定问题，例如，通过区块链技术安全地记录贷款交易，从而将区块链实现的重心转移到了其他地方。\n\
    \n目前看来，大多数实际的、基于区块链的赋能型应用，要么是构建在现有的区块链平台之上的，要么是使用区块链开发框架构建的独立网络，或者至少是作为另一个现有区块链实现的分叉（fork）。\n\
    \n作为与区块链打交道的测试人员和质量保证（QA）工程师，我们需要对基本原理有良好的理解，但大部分精力将花在测试利益相关者要求的业务功能和特定的区块链组件上。我们中只有极小部分人会从事底层算法和涉及的复杂性的测试。尽管我自己在直接测试\
    \ Creditcoin 区块链，但我需要深入研究 Substrate 框架的内部机制的情况相对少见，特别是为了测试某些东西的目的。\n\n下面是一个代码片段展示了使用\
    \ Substrate 框架构建的区块链实现（列表 2-4）。\n\n## 第 2 章 区块链开发框架\n\n### **列表 2-4.** Substrate\
    \ 框架中的区块链运行时实现示例\n\n```rust\n/// 具体的数据类型定义\npub type BlockNumber = u32;\npub type\
    \ Signature = MultiSignature;\npub type AccountId = <Signer as IdentifyAccount>::AccountId;\n\
    pub type Signer = <Signature as Verify>::Signer;\npub type AccountIndex = u32;\n\
    pub type Balance = u128;\npub type Nonce = u32;\npub type Hash = H256;\n\n///\
    \ runtime 中包含的各种 pallet 的配置\nimpl pallet_balances::Config for Runtime {\n  type\
    \ RuntimeEvent = RuntimeEvent;\n  type WeightInfo = pallet_balances::weights::SubstrateWeight<Self>;\n\
    \n  type Balance = Balance;\n  type DustRemoval = ();\n  type ExistentialDeposit\
    \ = ExistentialDeposit;\n  type AccountStore = System;\n  type ReserveIdentifier\
    \ = [u8; 8];\n  type RuntimeHoldReason = ();\n  type FreezeIdentifier = ();\n\
    \  type MaxLocks = MaxLocks;\n  type MaxReserves = ();\n  type MaxHolds = ();\n\
    \  type MaxFreezes = (();\n}\n```\n\n## 第 2 章 区块链开发框架\n\n```rust\nimpl pallet_sudo::Config\
    \ for Runtime {\n  type RuntimeEvent = RuntimeEvent;\n  type RuntimeCall = RuntimeCall;\n\
    \  type WeightInfo = pallet_sudo::weights::SubstrateWeight<Self>;\n}\nimpl pallet_evm_chain_id::Config\
    \ for Runtime { }\n\n// 实现 runtime APIs\nimpl_runtime_apis!\nimpl sp_api::Core<Block>\
    \ for Runtime {\n  fn version() -> RuntimeVersion {\n    VERSION\n  }\n\n  fn\
    \ execute_block(block: Block) {\n    Executive::execute_block(block)\n  }\n\n\
    \  fn initialize_block(header: &<Block as BlockT>::Header> {\n    Executive::initialize_block(header)\n\
    \  }\n}\n\nimpl sp_api::Metadata<Block> for Runtime {\n  fn metadata() -> OpaqueMetadata\
    \ {\n    OpaqueMetadata::new(Runtime::metadata().into())\n  }\n\n  fn metadata_at_version(version:\
    \ u32) -> Option<OpaqueMetadata> {\n    Runtime::metadata_at_version(version)\n\
    \  }\n}\n```\n\n```rust\nfn metadata_versions() -> Vec<u32> {\n  Runtime::metadata_versions()\n\
    }\n```\n\n完整版本可以在 https://github.com/gluwa/creditcoin3/blob/dev/runtime/src/lib.rs\
    \ 获取。\n\n## 关于开发与测试的思考\n\n对于任何软件，如何构建都会影响你如何测试。目前看来，大多数实际的、基于区块链的赋能型应用，要么是构建在现有的区块链平台之上的，要么是使用区块链开发框架构建的独立网络，或者至少是作为另一个现有区块链实现的分叉。\n\
    \n作为与区块链打交道的测试人员和质量保证（QA）工程师，我们需要对基本原理有良好的理解，但大部分精力将花在测试利益相关者要求的业务功能和特定的区块链组件上。我们中只有极小部分人会从事底层算法和涉及的复杂性的测试。尽管我自己在直接测试\
    \ Creditcoin 区块链，但我需要深入研究 Substrate 框架内部机制的情况相对少见，特别是为了测试某些东西的目的。\n\n在实际操作中，我并不关注通过输入测试数据并执行数百次贷款交易来发现\
    \ Bug，我更关注输入数据是否可以记录到区块链上而不崩溃，以及谁可以记录，例如贷款人或借款人。许多输入验证方面实际上是由底层编程语言处理的。例如，当为参数指定无符号整数数据类型时，我不需要显式地测试它是否允许负值——我的编译器会处理这一点，彻底的代码审查就足够了。\n\
    \n另一个需要考虑的因素是 Creditcoin 是一个平台，它最初是为了解决特定的业务问题，后来演变为一个通用的平台。在非常高的抽象层面上，它只是区块链参与者可以在上面记录数据的地方。这并不是说\
    \ Creditcoin 没有 Bug，很可能有很多；但当你倾向于构建一个通用平台时，数据是 100% 准确的，而你的软件是否允许用户自毁变成了次要考虑的问题，因此据此进行规划和排序。\n\
    \n同样重要的是，我的实践经验较少在共享环境中执行测试套件（在这种环境中，之前的状态和现有数据会影响结果和/或影响准备好的测试数据的可用性），更多是使用编程语言即时创建临时环境、注入数据并模拟我测试系统所需的任何先决条件，以断言特定的行为。\n\
    \n## 第 2 章 区块链开发框架\n\n如果读者来自不同的背景，不要担心。我认为了解我的出处是有重要的。\n\n在本书的初步评审阶段，我收到了 Jeroen\
    \ Rosink 关于使用数据集进行测试的主题的有趣反馈。我认为我们之间的差异很大。让我详细说明一下。\n\n在实际测试中，当我谈论“测试框架”时，通常指的是特定编程语言提供的实际功能和库。相比之下，Substrate\
    \ 框架本身提供了创建模拟运行时（mock runtime）以测试特定组件。\n\n## 总结\n\n在本章中，我介绍了我使用过的区块链开发框架，并简单讨论了它们之间的区别以及这对测试的影响。\n\
    \n在下一章中，我将向你介绍 Creditcoin 是什么以及它是如何工作的，这将成为后续章节与你分享测试旅程的基础。\n\n"
