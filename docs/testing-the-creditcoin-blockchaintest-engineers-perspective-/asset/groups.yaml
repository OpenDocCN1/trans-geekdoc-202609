    # 第 7 章 CREDITCOIN 3.0


    正如预期的那样，上游的 `polkadot-staking-dashboard` 基础也包含会对下游分支产生负面影响的问题和 Bug，例如 https://github.com/paritytech/polkadot-staking-dashboard/issues/2031。我自己发现的另一个问题是，一旦设置了提名池佣金，就无法显示当前的配置。下次打开相应的模态窗口组件时，会显示一个空白屏幕，仿佛什么都没有配置过一样。在深入研究了
    Substrate 源代码的相关部分后，在我看来这个功能区域尚未完全实现，而且我看到的一些提交表明，未来的版本中将实现一个围绕“谁可以配置提名池佣金”的访问控制模型。如果是这样的话，就能解释为什么为什么
    Staking Dashboard 中的这个组件看起来边缘粗糙了。


    虽然我们可以向上游报告问题、在下游进行补丁，甚至向上游贡献补丁，但我们应该意识到，没有任何保证能确保这些任何内容会被维护者接受。虽然他们慷慨地将其代码库开源，但必须认识到
    Polkadot 的业务是构建 Web3 平台，实际上他们是直接竞争对手。他们并不一定是软件供应商或传统的开源项目，对其代码库的更改只有在符合他们自己的长期愿景和目标时最可能被接受。正如本书其他部分多次演示的那样，这对比像
    Creditcoin 这样的下游消费者产生了影响。


    事实上，在编写这本书期间，上游发生了一些破坏性变更（breaking changes），Polkadot 生态系统中的一个重要部分——一个与 Staking
    Dashboard 类似的 UI 应用，其其中一个页面更新为：仅支持较新的兼容链。那是 Staking 页面。事实证明，该问题在使用 Poladex 时立即被报告，从附的截图来看，它似乎使用了
    Polkadot JS Apps 作为其用户界面的一部分；参见 https://github.com/polkadot-js/apps/issues/10505。在编写时，该上游问题正在寻求关于未来预期路径的指导，即是否会提供某种向后兼容性。目前，在编写本节期间，这一上游更改可能会影响
    Creditcoin 的几个下游组件。其他依赖于相同上游代码库的区块链也是如此！


    这种变化不仅对生产部署有影响，对测试也产生了影响——Polkadot JS Apps UI 是探索和监控区块链（特别是进行测试活动时的本地链）的便捷方式。该应用程序中整个页面的有效消失，特别是与所有质押活动相关的页面，使得无法观察该领域相关的任何内容，从而使下游测试变得更加困难。可能该应用的非开发实例（实际上是一个旧版本）在连接到不兼容的链（即旧旧链）时仍然显示
    Staking 页面，这对于测试目的来说是一个可行的替代方案，直到该旧版本从互联网上移除。它托管在 https://ipfs.io/ipfs/Qmd5YFZh6CqnJJyQ9Wff9SDSP2mmj8oTqBaQz8ukwV/#/staking。


    注意，此 URL 代表一个旧的生产版本，可能自那时起过期。


    你还记得 Subscan API 服务吗？虽然迁移到 SaaS 服务会将该组件任何关于质量和测试的担忧转移给供应商，但它引入了一个不太理想的副作用——你无法测试
    Staking Dashboard 应用的某些功能，因为它们依赖于消费 SaaS API，而这些 API 在所有环境中都是不可用的。在 localhost
    上运行开发区块链时显然不可用。例如，关于提名池成员的数据来自 Subscan API 服务。由于该服务对 127.0.0.1 不可用，Creditcoin
    Staking Dashboard 在相应的 UI 组件中显示零成员和空列表！


    虽然你可以使用连接到其他区块链环境的任意 Staking Dashboard 部署进行测试，例如 Devnet、Testnet 甚至 Mainnet（所有它们都有对应的
    Subscan SaaS API 端点），但你根本无法针对 Creditcoin 进行测试，因为它们依赖于消费并非所有环境都提供的 SaaS API。在 localhost
    上运行开发区块链时，这显然是不可用的。由于依赖于并非所有环境都可用的 API，这会导致一个问题。


    # 文档评审与第三方工具


    正如你想象的，Creditcoin v3 的文档最初是 Creditcoin 2 现有文档的分支，然后增加了关于 EVM 兼容层和智能合约部署指南的信息。文档内容的初始创建由开发团队完成，并由
    QA 进行了评审。文档的某些页面包含命令行或源码示例，特别是智能合约指南部分。这自然引出了一个问题：我们如何确保这些示例始终是最新的？我甚至会进一步提问：我们如何测试第三方工具，例如通过
    Remix（一个流行的 Ethereum IDE）或命令行工具 Hardhat 部署智能合约？记得 Creditcoin 2.0 上原始编程示例的类似用例导致了
    creditcoin-js 库的诞生。随后这个库独立发展。编写本书期间，我开始测试这些第三方工具，并发现对于 Hardhat 的情况下，该工具的演进非常快，以至于
    Creditcoin 文档中提供的某些命令已经过时。安装最新版本的 Hardhat 并字面遵循文档是不行的。这就是为什么所有这些示例都移动到了 git 下，并通过
    CI 任务执行命令。


    '
