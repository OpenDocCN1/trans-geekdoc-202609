    # 第 6 章


    # Creditcoin 2.3


    Creditcoin 2.3（技术版本号），公称为 Creditcoin 2.0+（二加），是 Creditcoin 2.x 家族中的下一个重大发布。它是
    v2.0 的自然继者，并构建在现有实现的基础上。最显著的变化是从工作量证明切换到提名权益证明（NPoS）共识算法。


    注意，在书中我将继续使用 2.3 版本号，以便在谈论 Creditcoin 2 的 NPoS 变体时更加明确！


    权益证明共识机制的参与者竞争向区块链添加新区块的机会，该机会与他们质押的加密货币代币数量成比例。通常情况下，假设代币数量越多，被算法选中的概率越大。提名权益证明（NPoS）是
    PoS 共识机制的变体，它允许其他区块链参与者对诚实工作的验证者进行投票。


    运行 Creditcoin 节点的节点仍被称为验证者（validators）。还有一组被称为提名者（nominators）的新类型参与者，他们可以使用自己的资金为验证者投票。也就是说，提名者在说：“我们信任这些验证者，把钱交给他们，因为他们过去表现得非常诚信。”请记住，通常所有这些参与者都是匿名的。


    # Creditcoin 2.3 的组件


    从操作角度来看，Creditcoin 2.3 为区块链引入了几个组件，但其他大部分内容保持不变！这些组件是 Polkadot 区块链用工具的分叉（forks），Polkadot
    是一个流行的权益证明区块链，也是 Substrate 区块链框架的创建者。


    # 质押相关的 Pallets


    该组件指的是 Substrate 的标准 pallet，它们开启了质押功能，例如质押资金的能力；为验证者投票的能力；PoS 参与者的惩罚和奖励；以及决定参与当前时代（era）的活跃验证者集的选举机制。在
    Creditcoin 2.3 及更高版本中，一个“时代”被定义为 24 小时，由 2 个被称为“周期”（epochs）的会话组成。


    这些 pallet 被包含在 Creditcoin Runtime中，并对 pallet 本身进行了微小的修改。然而，运行时为它们定义了一些值，例如预期的区块时间以及以区块为单位的周期时长。


    这不应与源码中的 `pallets/staking` 目录混淆。那是为了离链工作者（off-chain worker）努力的一部分，后来被删除了。可以说，该组件的命名并不好。


    # Creditcoin-cli


    提名权益证明区块链与工作量证明链相比，需要参与更多的交互。虽然提名者拥有 Creditcoin 质押面板 Web 应用，验证者并没有专门的界面。事实上，Substrate
    JS 应用可以用于配置任何 NPoS 验证者。与其使用这个第三方界面，`creditcoin-cli` 允许用户质押资金、成为验证者并执行维护操作。


    这是一个用 TypeScript 编写的命令行应用程序，被封装在 Docker 镜像中。默认情况下，它是 `ws://127.0.0.1:9944`，节点接受连接。这种封装的原因是某些
    RPC 调用是不安全的，不应通过互联网暴露——例如，轮密钥。Creditcoin 2 的标准 RPC URL 是 `ws://rpc.mainnet.creditcoin.network`，cli
    命令可以与之通信。由于 Creditcoin 是一个分布式系统，指向哪个 RPC 端点并不重要。只要交易经过签名并被任何节点接收，它就会进入区块。我能想唯一异常是上述的轮密钥操作，它直接与节点通信，不需要签名，并以某种方式绕过了区块链。


    # Switch_to_pos()


    这是一个位于同名专用 pallet 中的自定义 extrinsic。它的作用是存储从 PoW 切换到 PoS 的区块高度，将难度提高到最大以防止任何现有 PoW
    节点产生区块，并初始化第一个权益证明会话的验证者列表。


    该 extrinsic 旨在在生产环境迁移到权益证明的最后一步执行，之后不再使用。它需要 sudo 权限。


    这也是 Creditcoin 开发周期中生命周期最短的组件。在切换之后，它的大部分代码被移除，只留下了 `posSwitchBlockNumber` 项。


    对于好奇的人来说，切换发生在第 715,239 号区块，可以从 Creditcoin 主网直接查询；参见 https://creditcoin.subscan.io/block/715239
    和 https://polkadot.js.org/apps/rpc-wss://rpc.mainnet.creditcoin.network#/explorer/query/0xe0754be62367ba5b5c140a8603342736987b8cdfeac88819c8457d0a40d9。你也可以直接查询区块链存储并查看切换发生的时间，如图
    6-1 所示。


    img/fdf35d2d28d1fdd7aff60f2490629a1b_135_0.png


    图 6-1. Polkadot/Substrate 门户显示 Creditcoin 在区块切换到提名权益证明共识


    '
