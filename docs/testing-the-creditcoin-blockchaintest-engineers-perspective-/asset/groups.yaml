    # 第 8 章他人如何测试区块链


    **Filecoin** 是一个基于区块链去中心化存储网络。它由 Protocol Labs¹ 开发，并借鉴了星际文件系统（IPFS）²的一些理念，允许用户租用闲置磁盘空间。区块链基于复制证明（proof-of-replication）和时空证明（proof-of-spacetime）³共识算法。


    ## 测试产品


    我不会列出 ChainSafe 参与的所有项目，但这里按类别分类列出了几个值得关注的测试产品。请尽量记住这种多样性，因为它反映了测试是如何执行的。


    ## 协议客户端与桥接


    - *Lodestar*¹ 是用 TypeScript 语言实现的以太坊共识。它是一个以太坊的轻级客户端，并被认为是生产级的。

    - *Forest*⁶ 是 Filecoin 节点客户端的另一种实现，用 Rust 语言编写，而官方的 Filecoin 客户端和参考实现是用 Go 语言编写的。Forest
    已被认为已投入生产。


    ¹ https://en.wikipedia.org/wiki/Protocol_Labs

    ² https://en.wikipedia.org/wiki/InterPlanetary_File_System

    ³ https://en.wikipedia.org/wiki/Proof_of_space-time

    ⁴ https://github.com/ChainSafe/lodestar

    ⁵ https://github.com/ChainSafe/forest


    Gossamer⁶ 是 Polkadot 节点客户端的 Go 实现，尚未上线生产环境。这项工作在成功通过 Open Gov 提案后由 Polkadot 国库资助。


    需要注意的是，所有这些在本质上都是某人开源协议的第三方实现，而本书的其余部分讨论的是同一团队的协议（Creditcoin 贷款周期和数据结构）以及客户端实现（creditcoin-node）！客户端多样化的一个重要原因是增强生态系统的安全性，即防止攻击者利用客户端程序本身可能不存在的漏洞，例如逻辑错误或其所在编程语言固有的漏洞。


    Sygma⁷ 是一个模块化的、开源的跨链连接协议，允许应用程序在 EVM、Substrate 和其他链之间互操作性。你也可以将其称为跨链桥，例如一个能够连接不同区块链之间事件的软件组件。这些组件的确切范围取决于业务和功能需求。


    ## 库与 SDK


    - web3.js⁸ - 一个非常流行的用于在以太坊上构建的 JavaScript 库，我用过的 ethers.js 的替代品。ChainSafe 是该开源库的当前维护者。

    - web3.unity⁹ - 用于 Unity 框架的 SDK，允许游戏与区块链交互并提供管理面板。


    ⁶ https://github.com/ChainSafe/gossamer

    ⁷ https://github.com/sygmapprotocol

    ⁸ https://web3js.org/

    ⁹ https://github.com/ChainSafe/web3.unity


    你可以在 ChainSafe 的 GitHub 页面上找到更多库：


    https://github.com/orgs/ChainSafe/repositories?q=web3.


    ChainSafe 也对他们的 cypress-polkadot-wallet 插件感到自豪；然而，这不是核心产品，而是他们的测试工具之一，稍后会详细介绍。


    ## 浏览器扩展与分布式应用


    - 用于 MetaMask 的 Polkadot Snap¹⁰ 是一个用于与 Polkadot 等基于 Substrate 的链上的分布式应用的 MetaMask
    插件，因为原生 MetaMask 只能与兼容以太坊的工作。

    - Multix¹¹ 是一个用于在 Polkadot 区块链上轻松管理复杂多签名钱包的接口。


    ## 测试策略


    Andrew 和我一样，都是从传统的软件开发和测试背景进入区块链世界的。他的价值主张是将现有的专业知识引入区块链领域。在实践中，这意味着要平衡区块链开发对敏捷快速的需求，同时又要定义一些流程，如收集产品需求、建立
    pull request 评审流程、创建并执行测试计划、添加测试自动化等。


    虽然我最初的印象是，由于分布式系统的固有复杂性以及相对不熟悉的编程语言，区块链领域的工程师并不多，但 Andrew 带来了一个稍微不同的观点：


    ¹⁰ https://github.com/ChainSafe/metamask-snap-polkadot

    ¹¹ https://github.com/ChainSafe/Multix


    - 区块链开发在软件开发领域仍然是一个非常小众的领域。它主要由小型团队组成，技术栈仍然很新，因此寻找人才（特别是测试人员）通常可能很困难。

    - 部分是因为不可篡改性因素，我也认为部分是因为分布式系统的性质，区块链开发者的测试经验似乎比 IT 行业其他领域更高。或者可能他们只是更经验丰富的开发者，因为要在这一领域工作，他们必须具备这些经验。

    - 在单元和集成层的测试方面，我们看到了很多；但是，这是由开发人员作为许多职责之一完成的，而不是专门的投入。

    - 有一个真正专注于质量流程和风险缓解的人至关重要，因为构建高质量的产品比仅仅创建和执行测试要困难得多。


    我还会补充，一些区块链相关的初创公司为了投机和寻求快速退出，并没有遵循传统的软件开发流程构建高质量产品。


    # 第 8 章 他人如何测试区块链


    由于项目和团队的多样性，而且通常情况下，每个人对“高质量”的定义都是不同的。这个通用模型遵循 ISO 25010 标准²。


    根据 Andrew 的说法，区块链工作方面的挑战如下：


    - **数据不可变性**：区块链状态记录后无法更改，如果你的测试需要链上状态，你可以通过使用本地或共享测试网来缓解这一点。

    - **最终性 (Finality)**：这是对最近添加的区块不会从链删除移除的程度。挑战在于存在多个独立运行的节点，可能你的交易在节点 A 上进入区块的同时，节点
    B 产生了另一个区块。我们称之为分叉，健康的区块链能够解决这些分叉，最终所有节点将保持一致。测试（特别是对于桥这类产品）的在于当你检查链上状态时，你可能正在查看一个稍会被回滚的链分叉，即它尚未完成。解决此问题的方法是等待一定数量的区块（例如
    12 个），然后对最新区块进行断言。这种宽限时间的长取决于你对底层区块链的深入了解。

    - **延迟**：系统中原因与结果之间的延迟，这并不是区块链特有的，但根据 Andrew 的说法，在区块链测试场景中是一个因素。对于某些项目，ChainSafe
    通过将他们的发布候选客户端部署到共享环境（例如测试网），并在特定范围内（通常为两周）在 Grafana 中记录性能统计来解决这个问题。你可以将其视为浸泡测试。测试结束后，将当前基准与之前的版本或竞争对手客户端的基准进行比较。外部资源


    ² www.iso.org/standard/78176.html


