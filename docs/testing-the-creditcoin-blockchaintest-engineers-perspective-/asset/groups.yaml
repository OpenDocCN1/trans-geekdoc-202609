    # # Troubleshooting Guides and Sos-Report Command


    Another interesting challenge I''ve come across has to do with community interactions.
    For whatever reasons somebody will end up having troubles – either didn''t read
    the documentation, or didn''t pay enough attention or tried doing something that
    was never expected – users are good at this, perhaps even better than our testers.
    It could be the case that has genuinely been some sort of a technical problem
    at the time when the user was trying to perform an operation or the user wasn''t
    tech savvy enough to understand the documentation or that they simply made a mistake.
    When that happens, they will reach out to available communication and support
    channels and complain about their problem.'
  - '[PAGE 207]


    # CHAPTER 7 CREDITCOIN 3.0


    Because of everything that happens in a blockchain, the long periods involved
    and also because your user base isn''t necessarily technical, the initial problem
    report will always be missing important information. Sometimes it will be easier
    for engineering to guess what the actual problem was and offer a solution to be
    communicated back; other times it may be entirely impossible. To clear this is
    much more likely to happen in the event someone wants to become an active validator
    than trying to become a validator via the Creditcoin Staking Dashboard.

    To combat this situation, I am proposing a two-step approach:


    +   1. Curating a list of common questions and requests for additional information
    - this is to make sure you collect as much initial data from the user as possible
    and also cover commonly pitfalls and edge cases. Whenever the user contacts your
    support team, they will be asked to provide answers to these questions. The sooner
    this happens the better - for example, if a user shuts off their computer and
    retries on the next morning, chain-state will have changed so their actions result
    in a slightly different outcome. Ideally this list of questions is publicly available
    in the documentation, and users are aware what sort of information they should
    provide when contacting support.


    +   2. Logs, local results, computer uptime, process uptime, and many other data
    are actually possible to be queried directly from the blockchain and the host
    running creditcoin3-node process.

    Listing open ports, trying to reach out well-known Creditcoin URLs across the
    Internet, measuring networking speed, etc. are also possible. I call this'
