    \ 和集成测试有关，因为它们是用 TypeScript 编写且更新频繁。然而，即使在 Rust 侧，我们也希望尽可能更新。这从远来看减少了维护负担，让你知道测试软件是否与新库兼容，并对提高整体安全性做出微贡献。如果\
    \ CI 作通过，则合并更新的版本，通常由 QA 工程师进行评审。\n\n一个例外是 Substrate 框架本身，它是通过 git 仓库使用的。Substrate\
    \ 的各种组件很少通过 crates.io（Rust 包仓库）发布，并且需要手动更新。该过程在 Creditcoin 2.0 中尚未实现自动化。从技术上说，很容易创建自己的机器人来为\
    \ Substrate 框架的新版本提出更新，即使是通过 git fork 使用的。我的印象是 Substrate 仍在频繁变化，需要手动工作来检查和评估任何不兼容性，因此自动化此过程可能没有太大收益。\n\
    \n# 使用 Gluwa-bot 进行类型定义\n\n任何基于 Substrate 的链都会以 SCALE 格式（二进制编码）序列化数据类型和错误消息，并通过\
