    # 迁移 (Migrations)


    为了让实际的区块链应用根据业务需求进行演进，开发者需要能够修改数据结构。例如，在我们的井棋示例中，我们可能想要记录是在哪一步赢得了比赛，或者我们可能想要允许第三个玩家加入。


    类似于 ORM 框架，迁移组件允许开发者转换存储在区块链上的数据，甚至删除其中的某些数据。所有这些转换都将在特定的区块高度保留在区块链历史记录中。如果查询较旧的区块，可能会检索到旧数据，但无法保证客户端应用程序具有向后兼容性。


    迁移失败可能导致区块产生受损，这可能是致命的。


    # 运行时升级 (Runtime Upgrades)


    由于区块链应用需要根据业务需求进行演进，因此会有不同版本的实现方案。假设我们希望在我们的井棋区块链中引入三个玩家同时相互竞争的能力。


    运行时升级组件负责此。在某些区块链实现中，业务逻辑（交易）可能与实际客户端程序分开存放。在使用 Substrate 区块链框架时就是如此情况。一种流行的选择是
    WebAssembly 格式。如果运行时是分离的，它也可以被记录在区块链本身。


    在其他实现中，交易可能与客户端程序的其余部分紧耦合，要求用户在访问区块链的新功能之前进行软件升级并重启。


    该组件引发了关于不同客户端和运行时版本之间兼容性/互操作性测试的问题。


    # 指标与遥测 (Metrics and Telemetry)


    由于区块链应用是分布式的，并且出于安全考虑鼓励大量节点参与，因此通常需要暴露区块链软件内部运行的信息。这些信息可以被聚合到 Grafana 等工具中进行进一步分析。


    遥测组件是定义此类指标并可以通过 HTTP 等推送到外部服务的地方。


    # 离链节点或预言机 (Off-Chain Worker or Oracle)


    在区块链上下文中，所有的计算和状态都存储在链本身。然而，实际应用需要与外部世界通信并在链内外安全传输信息。这就是所谓的预言机（oracle）或离链节点组件领域。


    这里一个重要的点是，离链节点能够读取链上数据，但不应该能够直接修改它。该组件将向区块链发送交易，因为它需要反映外部世界的状态。这可以在内部发生，例如调用源代码中的交易函数，或者通过现有的
    RPC 接口外部路由到区块链。这些交易调用将由其他组件处理，如果成功，将进入区块。也可能由于各种原因交易失败和/未能进入区块。


    # 智能合约 (Smart Contracts)


    智能合约是存储在区块链网络上的计算机程序。一旦智能合约部署到区块链上，它就可以存储任意状态并执行任意计算或调用区块链上的其他合约。


    # 第 1 章 绪言 (INTRODUCTION)


    每个智能合约都有与其关联的地址，该地址作为合约的入口点，类似于 REST API 函数的 URL 地址。终端客户端通过某种客户端库（一种流行的选择是 ethers.js）使用其地址发送交易来与智能合约交互。


    一旦部署，智能合约就无法被修改。不过，新版本的合约可以部署到不同的地址。


    智能合约创建者铸造一个新的加密代币是非常流行的做法，即凭空创建一个代币，并将其用作某些区块链网络上价值的表示。然而，智能合约也可以实现其他功能，例如自动和透明的投票。


    智能合约的实际应用不在本节的范围内。


    # 共识机制 (Consensus Mechanisms)


    共识引擎是区块链最重要的组件之一，目前有许多正在开发或使用的机制。例如证明工作、证明权益、证明时间、证明容量、证明位置等。它们的属性会影响谁可以参与、参与的难易程度、维护成本、网络支持的节点数量以及区块链的安全性。


    你可以参考此列表进一步了解：https://medium.com/consensusedia-an-encyclopedia-of


    # 证明工作 (Proof of Work, PoW)


    PoW 共识的参与者消耗计算资源来获得添加新区块的机会。他们需要解决计算密集型的难题并将解决方案提交给其他参与者，其他人可以轻松计算出是否正确。每个区块的数据部分作为难题的输入。第一个找到正确解决方案的矿工将获得将其添加到区块链的机会。因此，我们说他们挖掘了一个区块。矿工拥有的
    CPU 资源越多，解决难题并添加区块的机会越大，从而获得奖励。


    # 证明权益 (Proof of Stake, PoS)


    PoS 共识机制的参与者根据其质押的加密代币数量竞争添加区块的机会。通常认为，投入更多的代币增加了被算法中的概率，从而获得更大的回报。PoS 避免了 PoW
    的高计算成本。这里没有真正的挖掘，因为计算要少得多；但在这种情况下，我们通常将验证者称为矿工。质押资金被区块链实现作为质押，如果验证者被举报并发现过错，资金可能会从验证者处没收。这一过程是自动化的，目的是限制人为参与并促进区块链网络的健康行为。例如，当验证节点长时间离线时，他们将受到惩罚。


    这种应用惩罚并没收参与者现有资金的过程称为削减（slashing）。


    # 证明权威 (Proof of Authority, PoA)


    证明权威是一种通过身份作为质押或声誉质押的共识机制提供较快区块时间的算法。在 POA 网络中，个人获得成为验证者的权利，因此他们有动力维持其所获得的地位。PoA
    共识通常出现在私有许可区块链中。


    '
