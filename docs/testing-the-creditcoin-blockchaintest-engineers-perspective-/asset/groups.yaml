    \ = [&new_pallet_prefix, &twox_128(storage_prefix)].concat();\n\n        let new_pallet_prefix_iter\
    \ = frame_support::storage::KeyPrefixIterator::new(\n            authorities_prefix.clone(),\n\
    \            authorities_prefix,\n            |key| Ok(key.to_vec()),\n      \
    \  );\n\n        assert!(new_pallet_prefix_iter.count() == 0,\n            \"\
    Expected new authorities storage to be empty\"\n        );\n\n        assert!((crate::Pallet<T>\
