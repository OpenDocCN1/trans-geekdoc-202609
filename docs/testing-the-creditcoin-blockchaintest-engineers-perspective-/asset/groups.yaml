    \ git 仓库中的库。对于 Rust，优先使用 package crates。\n\n- - 某些静态分析工具是为了提高质量。在健全性范畴内，我们正在构建集群并确保它不会崩溃，容器暴露\
    \ /health 端点供 DevOps 使用——确保代码看起来很漂亮。\n\n# 机器人测试\n\n在 Creditcoin 2.0 的开发过程中发生了许多自动化操作。我将它们称为“机器人测试”，但严格来说它们大多数与开发过程有关。无论如何，将其自动化都有其优势：\n\
