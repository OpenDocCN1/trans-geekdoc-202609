  - '[PAGE 75]


    At the same time I''ve been trying to figure out what each component does and
    what are the testing requirements toward them. I can outline several major areas
    below.


    The private **creditcoin-legacy-tests** test suite and work items related to it
    which probably consumed the majority of my efforts.


    For each individual repository, generally try to figure out where we stand in
    terms of existing test coverage, and make sure that it has common testing and
    static analysis tools enabled:


    +   - Enable CI execution for every PR using GitHub Actions.

    - Deprecate older Azure Pipelines which were not kept under git.


    +   - Execute any obvious unit tests (e.g., cargo test), and start collecting
    coverage metrics where possible to inform further decisions.


    +   - Enable static analysis tools aka linters and code formatters (e.g., cargo
    check, cargo fmt), and see where we stand. Work on fixing reported issues.


    +   - Start using Dependabot for keeping dependencies up to date.


    +   - Build docker container for the component, and run sanity checks against
    it because that''s how it is supposed to be delivered.


    +   - Experiment with other static analysis tools to see what can be helpful (e.g.,
    SonarQube), and fix some code smells as initial improvements.


    For all forks of upstream repositories, try doing the same where possible wasn''t
    always successful. Keep in mind that for the better part of the first few months,
    I still don''t have a good understanding of how blockchain works in general, much
    less how the individual components of Creditcoin and their upstream repositories
    fit together!'
