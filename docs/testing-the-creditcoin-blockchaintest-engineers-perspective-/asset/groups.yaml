    \  type WeightInfo = pallet_sudo::weights::SubstrateWeight<Self>;\n}\n\\impl pallet_evm_chain_id::Config\
    \ for Runtime { }\n\n// implement runtime APIs\nimpl_runtime_apis!\nimpl sp_api::Core<Block>\
    \ for Runtime {\n  fn version() -> RuntimeVersion {\n    VERSION\n  }\n\n  fn\
    \ execute_block(block: Block) {\n    Executive::execute_block(block)\n  }\n\n\
    \  fn initialize_block(header: &<Block as BlockT>::Header> {\n    Executive::initialize_block(header)\n\
    \  }\n}\n\nim sp_api::Metadata<Block> for Runtime {\n  fn metadata() -> OpaqueMetadata\
    \ {\n    OpaqueMetadata::new(Runtime::metadata().into())\n  }\n\n  fn metadata_at_version(version:\
    \ u32) -> Option<OpaqueMetadata> {\n    Runtime::metadata_at_version(version)\n\
    \  }\n}\n```"
  - "[PAGE 50]\n\n```\nfn metadata_versions() -> Vec<u32> {\n  Runtime::metadata_versions()\n\
    }\n\n```\n\nThe full version is available at https://github.com/gluwa/creditcoin3/blob/dev/runtime/src/lib.rs.\n\
    \n# Thoughts on Development and Testing\n\nAs with any piece of software, how\
    \ you build stuff has an effect on how you test it.\n\nFor example, when working\
    \ with Hyperledger Sawtooth, it felt like there were too many layers of abstractions,\
    \ and it was hard for me to wrap my head around all of them. The major drawback\
    \ in terms of testing is that all components live as separate repositories/docker\
    \ containers, and it was difficult to test certain functionality in isolation.\
    \ The obvious choice was to treat everything as one large system and test it from\
    \ the outside.\n\nIn contrast a Substrate-based implementation is more like a\
    \ monolithic application where everything is bundled up together. I found it much\
    \ easier to get started and to be productive. The Substrate framework itself also\
    \ provides facilities for creating a mock runtime in order to test specific components\
    \ in isolation. This was a huge driver behind building an extensive unit test\
    \ suite for Creditcoin.\n\nI need to point out that when I talk about \"testing\
