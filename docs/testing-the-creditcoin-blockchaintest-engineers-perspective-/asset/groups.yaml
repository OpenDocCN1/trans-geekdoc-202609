    # CHAPTER 2


    # Blockchain

    Development

    Frameworks


    Searching the Internet for “blockchain development frameworks” yields multiple
    results, and it is entirely possible that preferences will have changed by the
    time you read this book. Actual details will vary, but basic concepts should be
    similar. In this chapter, I will list the frameworks I’ve used personally in order
    to provide more context for the upcoming chapters.


    # Hyperledger Sawtooth


    Hyperledger Sawtooth is a blockchain development framework by Hyperledger and
    the Linux Foundation with contributions by IBM, Intel, and others. It is a framework
    with modular architecture that separates the core system from the application
    domain, so developers can specify the business rules for applications without
    needing to know the underlying design of the entire system. Sawtooth supports
    a variety of consensus algorithms.'
  - '[PAGE 42]


    # CHAPTER 2 BLOCKCHAIN DEVELOPMENT FRAMEWORKS


    Originally contributed by Intel, Sawtooth is a blockchain suite designed for versatility
    and scalability. Transaction business logic is decoupled from the consensus layer
    into the so-called Transaction Families that allow for restricted or unrestricted
    semantics. Original website: https://wiki.hyperledger.org/display/sawtooth.


    Initial versions of Sawtooth were implemented in Python, and later some components
    were subsequently reimplemented in Rust.


    Note The original Hyperledger Sawtooth repository on GitHub was archived at the
    request of its maintainers on Feb 1, 2024, during the writing of this book. Ongoing
    maintenance releases of this code base have since moved under the Splinter community
    at https://www.splinter.dev.


    Hyperledger Sawtooth was the development framework of choice for the Creditcoin
    1.x blockchain which I experienced toward the end of its life cycle.


    # Substrate


    Substrate, https://substrate.io, is a blockchain framework which claims to be
    the most powerful framework to quickly build customized future-proof blockchains.
    It is a framework which allows developers to build specialized blockchain applications.
    Substrate is spearheaded by the Polkadot network and Parity Technologies which
    are led by Gawin Wood, the first CTO of Ethereum.


    Building your own blockchain using Substrate is surprisingly easy, and you can
    get started in no time by following their tutorial. See https://docs.substrate.io/tutorials/build-a-blockchain/build-local-blockchain/.
    The core concept here is composability – your blockchain implementation is composed
    of multiple components called pallets, which are glued together in a runtime.'
  - '[PAGE 43]


    Substrate is built with the Rust programming language, while the rest of the Polkadot
    tooling uses TypeScript – these are usually client libraries and front-end applications.


    Creditcoin versions 2.x and later are built using Substrate.


    # # Ethereum


    I have not done any development and testing on Ethereum personally but mentioning
    it because it is quite popular. Geeth seems to be the main Ethereum client implemented
    in the Go programming language; see https://github.com/ethereum/go-ethereum. Because
    this implementation is open source, it is entirely possible to fork it and then
    modify the code in order to create a custom blockchain of your flavor. This is
    apparently what the Muscoin chain had. On the other hand, you are probably far
    more likely to implement a smart contract deployed on Ethereum main network instead
    of building a custom chain.


    In either case, there are lots of development tools available for Ethereum; see
    https://ethereum.org/en/developers/docs/frameworks/ if you are interested.


    # # Programming Languages


    The programming languages discussed in this book are a colorful mix between Python,
    C++, and C#.NET during the Creditcoin 1.x timeframe and later primarily Rust and
    TypeScript for version 2.0 and later.


    **Rust** is a general-purpose programming language that emphasizes performance,
    type safety, and concurrency. It enforces memory safety without a garbage collector.
    Rust is a statically typed and strongly typed functional language and is a popular
    language for systems programming, including distributed systems like blockchain
    and also the Linux kernel.'
