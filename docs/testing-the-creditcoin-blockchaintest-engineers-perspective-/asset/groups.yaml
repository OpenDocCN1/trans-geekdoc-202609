    # Challenge: How to Analyze and Keep Track of Changes to On-Chain Settings


    There is an interesting challenge related to modifying various on-chain, and possibly
    runtime, configuration settings. If you recall, many of the blockchain parameters
    are hard-coded in source code under runtime/, and there are many which can also
    be changed afterward. For example, using the Polkadot JS Apps web interface, it
    is very easy to send a nominationPools.setConfig transaction and modify existing
    configuration – for example, change minimum bond amount required to create a nomination
    pool. This poses two main challenges:


    +   How to keep track of such changes; in other words if I am to wipe out an existing
    environment and redeploy with the latest Creditcoin version, how do I make sure
    its operational parameters will be the same as before?


    +   How do I analyze such changes in order to figure out are the possible risks
    of modifying a value on-chain? In https://github.com/paritytech/polkadot-sdk/issues/3739,
    the upstream


    193'
  - '[PAGE 200]


    maintainers of polkadot-sdk recommend that blockchain developers be careful when
    changing values on existing chains to avoid shooting themselves in the foot. Reason
    being is that existing tests and checks upstream are also not perfect and they
    could have missed a scenario which would have a negative impact.


    The first challenge is relatively easy to solve. Substrate already contains the
    storage migration sub-component, and I''ve outlined several testing activities
    related to migrations. While enabling the whole migrations machinery and testing
    infrastructure around it just so you can change a single value: see, for example,
    https://github.com/gluwa/creditcoin3/pull/120. I believe this is an important
    first step in solving challenges.


    Having all on-chain storage changes as part of a migration yields several benefits:


    +   Everything is in git so history and traceability is preserved.


    +   Any new environment launched from future code versions will take care to configure
    itself as needed.


    +   You can test against mock and production data in order to find edge cases.


    +   Assuming you know how to solve challenge #2, then you can use the migrations
    machinery and implement pre-conditions into the source code which will alert you
    when a migration is about to break, for example, when testing against a production
    environment before release.'
  - '[PAGE 201]


    On to the bigger challenge - how can you analyze a proposed change in order to
    gain confidence nothing would break or that it would not cause unforeseen side
    effects? For example, we already know that changing block time is a no-go, and
    there are assertions in place in order to catch such a situation before it makes
    through the entire release pipeline. What about other settings, which appear to
    be benign?


    At the time of writing this book, I''ve been thinking about how to solve this
    challenge but still don''t have the full answer. The entirety of Creditcoin comprises
    several layers and applications I believe whatever analysis you do must encompass
    all of them. I am a firm believer that in the face of unknown technology, we should
    first strive to understand how it works in its core before trying to search edge
    cases and possible risks. Without in-depth understanding, we''re just guessing
    and that is not good enough in my opinion. The overall process will probably be
    something like this:


    +   Find all places, in all applications, or libraries, where a particular storage
    item/setting value is used.


    +   Create a list of the different functional areas where it is used, for example,
    https://github.com/gluwa/creditcoin3/pull/283#issuecomment-2015201729, because
    it not be immediately obvious or because other developers may have decided to
    add additional checks in unexpected places.


    +   Try to understand what all of the areas on your list are doing and how they
    work.


    +   Trace conditional expressions, and macros, for example, if statements and
    macros, which assert on the value you are analyzing, especially when they yield
    errors and panics. This is a clear indication something will go wrong under specific
    conditions.'
