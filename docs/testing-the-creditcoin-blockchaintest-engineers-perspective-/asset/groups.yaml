    # 其他有趣的测试


    **提示** 你使用的任何第三方工具和依赖项，即使只是作为开发、测试和/或发布流水线的一部分，如果你采取激进的升级策略，它们也可能会失败。


    在 Creditcoin 和 Rust 编程语言的情况下，某些工具和包需要更高版本的编译器，例如，https://github.com/gluwa/creditcoin3/pull/159。如果你知道这一点并可以等待所有相关部分升级，那么那是没问题的。但当你有额外的依赖项时——这些项没有直接指定在
    `Cargo.toml`（Rust 包管理器文件）中，而是使用固定版本直接安装到 CI 任务中——这就变成了一个问题。更糟糕的是，失败的 CI 任务是条件执行的，如果它不是更新编译器版本的拉请求（pull
    request），它就不会运行！更糟糕的是，导致失败的罪魁祸首 `subsum` 包在 crates.io（Rust 软件包仓库）上已经发布了 3 年；其新版本仅以
    git tag 的形式发布，无法从自动化的 dependabot 升级中受益。


    总之，这是一个关于测试的教训——你使用的每一个东西都需要经过测试。如果它没有包含在现有的 CI/测试套文中，那么你需要确保它被显式地执行！否则，它会在你最万意不到的时候失败，例如
    https://github.com/gluwa/creditcoin3/pull/332。在写作此时，我不得不从 v0.17.1 升级到 v0.19.0
    以避免编译器错误。即使这个版本也不是 100% 完美的。它产生了一个编译器警告：


    warning: ambiguous glob-exports

    ```rust

    --> lib/src/lib.rs:19:9

    19 | pub use chain_info::*;

    ^^^^^^^^^^ the name `Error` in the type namespace is first re-exported here

    24 | pub use types::;

    but the name `Error` in the type namespace is also re-exported here

    ```


    ## 挑战：如何分析并跟踪链上设置的变化


    关于修改各种链上以及可能的运行时设置，有一个有趣的挑战。如果你还记得，许多区块链参数被硬编码在 `runtime/` 目录下，并且许多参数在之后也可以更改。例如，使用
    Polkadot JS Web 界面可以很容易地发送交易并修改现有配置——更改创建质押池所需的最小金额。这带来了两个主要挑战：


    - 如何跟踪此类更改；换句话说，如果我要擦除现有环境并重新部署最新版本，我如何确保其参数与之前相同？

    - 我如何分析此类更改，以找出在链上修改某个值可能带来的风险？https://github.com/paritytech/polkadot-sdk/issues/3739。


    第一个挑战相对容易解决。Substrate 已经包含了迁移（migration）子组件，而且测试也不完美，可能会漏掉产生负面影响的场景。虽然为了更改一个单一的值而启用整套机制和周围的测试基础设施并不划算，但将所有链上存储更改作为迁移的一部分有以下几处好处：


    - 所有内容都在 git 中，因此历史被保留了。

    - 从未来版本启动的任何新环境将根据需要自行处理。

    - 你可以针对模拟数据和生产数据进行测试，以发现边缘情况。


    假设你知道如何解决挑战 #2，那么你可以使用迁移机制并在源代码中实现先决条件，当迁移可能会破坏时它会提醒你，例如在发布前对生产环境进行测试时。


    ## 生产环境测试的资源管理


    我已经提到过我如何针对多个环境进行测试，并且在可能的情况下，我想针对生产环境运行测试套件，包括任何第三方组件的测试套件。那么挑战变成了，当你在步骤之间有很长一段时间时，你如何清理现场，见图
    7-7？


    任何与质押（staking）相关的操作都需要紧跟一个解绑交易（unbound transaction），然后等待停机期，然后提取资金。在这种情况下，可能会涉及更多步骤、更多参与者和等待。该周期基于区块产生时间和时代（eras）的数量，例如一个验证周期。在本地或
    CI 中执行所有这些操作时速度非常快，而且你对值和环境有完全控制。在生产环境中执行相同的操作，差异是巨大的——一个时代是 24 小时。解绑期为 7 天。某些操作还取决于你具体在这
    24 小时的什么时候发布交易，这导致了更长的等待时间。这是一个滚动窗口，效果可能需要 12 到 36 小时才能生效。


    在写本文时，我一直在思考如何解决这个挑战，但还没有完整的答案。Creditcoin 的整体由几个层和应用程序组成，我相信无论你做什么分析，都必须涵盖所有它们。我坚信，面对未知技术时，我们应该首先努力理解它的核心是如何运作的，然后再尝试寻找边缘情况和可能的风险。如果没有深入的理解，我们只是在猜测，在我看来这并不好。整个过程可能会是这样的：


    - 在所有应用程序或库中找到所有使用特定存储项/设置值的地方。

    - 创建一个使用该值的不同功能区域的列表，例如 https://github.com/gluwa/creditcoin3/pull/283#issuecomment-2015，因为这可能不是一而易见的，或者其他开发者可能决定在意料之外的地方添加额外的检查。

    - 尝试理解你列表上的所有区域在做什么以及是如何运作的。

    - 追踪条件表达式和宏，例如 `if` 语句和宏，如果它们对你正在分析的值进行断言（assert），特别是当它们产生错误和崩溃（panic）时。这清楚表明在特定条件下会发生问题。

    - 对于代表最小、最大等值，检查你当前的链上数据以查看是否存在离群值。例如，如果我要重新配置与最小金额相关的设置，链上是否已经有质押金额少于拟议新金额的参与者？这是一种针对现有数据的边界值分析。

    - 这些“特定条件”成为你在应用迁移并将设置更新为新所需值之前的先决条件。这就是进一步测试该领域的开始。


    上述列表只是一个粗略的轮纲。重要的是，它必须被编码成一个更正式的流程，供工程师和利益相关者遵循，并在该过程中有几个地方可以让我们停下来、评估优缺点并做出决策。另一个重要的事项是，这种流程和评估不能花费太长时间，或者至少是可预测的，以便你能够及时交付软件更改。这就是所有软件开发和测试的噩梦——当你完全不知道所有小部件是如何运作的，而且你依赖于成千上万个小部件时，你该如何估算未知，该如何管理风险？


    '
