    \ That's enforced in every migration as well as a static analysis script – the\
    \ number of the last migration file must match the value of STORAGE_VERSION defined\
    \ in the pallet. Here is an example of how a migration moves a storage item between\
    \ two pallets looks:\n\n```rust\nimpl<T: Migrate> Migration<T> {\n\n    fn pre_upgrade(&self)\
    \ -> Vec<u8> {\n        let count: u32 = Authorities::<T>::iter().count();\n\n\
    \        assert!(count != 0, \"Authorities not found during migration\");\n\n\
