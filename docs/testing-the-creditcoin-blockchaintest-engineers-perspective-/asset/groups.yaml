  - '[PAGE 193]


    # CHAPTER 7 CREDITCOIN 3.0


    As can be expected, the upstream polkadot-staking-dashboard base also contains
    issues and bugs that negatively affect downstream forks, for example, https://github.com/paritytech/polkadot-staking-dashboard/issues/2031.
    Another one I found myself is the inability to display current configuration for
    nomination pool commission once set. Opening the corresponding modal widget the
    next time shows a blank screen as if nothing had been configured. After digging
    through the relevant sections of Substrate''s source code, it looks to me like
    this functional area isn''t feature complete, and there were some commits to me
    indicate that an access control model around who can configure nomination pools
    commission will be implemented in future versions. If that''s the case, it would
    explain why this widget in Staking Dashboard looks rough around the edges.


    While we can report issues upstream, patch them downstream, and even contribute
    patches upstream, we should recognize the fact that there is zero guarantee any
    of this will be accepted by the maintainers. While graciously providing their
    code base as open source, it is to recognize that Polkadot is in the business
    of building a Web3 platform and are in fact a direct competitor. They are not
    necessarily a software vendor or a traditional open source project, and changes
    to their code base are most likely accepted if they align with their own long-term
    vision and goals. As demonstrated several times in other parts of this book, this
    has impact on downstream consumers as Creditcoin.


    Indeed during the writing of this book, there were some breaking changes upstream,
    and an important piece from the Polkadot ecosystem, a UI application similar to
    Staking Dashboard, how one of their pages updated that it only works with newer
    compatible chains. That was the Staking page. As it turns out, the issue was reported
    immediately by using Poladex which, from the attached screenshots, appear to be
