    # CHAPTER 6 CREDITCOIN 2.3


    The other part of “testing the documentation” is actually following all of the
    technical steps listed and making sure they are correct; the order is the correct
    one, and the commands shown will result in the documented outcome, making sure
    that version numbers, URLs, etc. are also the correct ones.


    Some sections of the documentation contain examples for platforms different from
    Linux, so need someone to verify that they are actually correct. After a while
    working with this document, one becomes fairly biased and starts skipping sections
    from the docs or already anticipates which commands you need to type, so double-checking
    every thing diligently becomes a chore. This is when you have to bring in other
    members, preferably ones who have less experience and/or are unfamiliar with the
    documentation and the overall “become a validator” workflow so they can spot more
    edge cases and improve the documentation.


    Documentation URL: https://docs.creditcoin.org/cc2 (different from the Creditcoin
    3.0 docs).


    # Load and Performance Testing


    In the context of nominated proof of stake, the questions around performance of
    the blockchain became important again. There are multiple items happening at the
    same time:


    +   The algorithm selecting validators for the next era is effectively traversing
    a graph. The bigger the number of validators, the bigger the graph which takes
    time to solve. If I remember correctly, Web3 research documents a practical limit
    around 300 validators, and other Substrate chains like Kusama and Polkadot are
    already running at this limit. For Creditcoin it''s important to find out what
    is our practical limit.'
  - '[PAGE 153]


    # CHAPTER 6 CREDITCOIN 2.3


    +   - There is also a setting which limits the number of nominators for validator.
    It''s unclear to how this number influences the graph algorithm from the previous
    item if at all.


    +   - All validators are sending an i-am-online ping throughout the current era;
    otherwise, they will be penalized.


    +   - The penalty subsystem is monitoring online pings and calculating penalties
    when necessary, chilling off validator nodes if need be.


    +   - Based on the number of blocks produced by each validator during the current
    era, the rewards subsystem is calculating rewards for the validator and all of
    their nominators.


    +   - There are the regular Creditcoin loan-cycle transactions.


    The entire blockchain is far more chattier compared to its proof-of-work predecessor.


    Looking at all of this for Creditcoin 2.3, we needed to establish a performance
    baseline and a toolset/methodology of doing “performance testing.\ Using quotes
    here because I''m merely scratching the surface in this area, not going deep as
    you''ll see.


    The first tool in the arsenal is called Zombienet, https://github.com/paritytech/zombienet
    uses templates and will launch a stand-alone ephemeral blockchain network. Using
    the template files, it is possible to configure a different number of nodes and
    parameters. You may also use the Zombienet DSL language to assert against the
    spawned network!'
  - '[PAGE 154]


    # CHAPTER 6 CREDITCOIN 2.3


    I used Zombienet to launch networks of 100 to 300 validators and adjust Creditcoin
    settings, to establish a baseline of hardware requirements for testing and a baseline
    of behavior for the network. The entrypoint for Creditcoin Zombien is the zombienet/
    directory inside the main git repository.


    The next important question was “if we switch to nominated proof of stake, can
    Creditcoin supports a minimum number of loan transactions” or rather “how many
    loan transactions can it support?” In other words, does the switch to a proof
    of stake have any impact on blockchain throughput from a business point of view?
    Initially we looked at https://github.com/paritytech/polkadot-stps which is a
    generic tool for Substrate-based chain. Polkadot-STPS sends balance transfers
    which are virtually guaranteed to exist in every blockchain implementation using
    the Substrate framework; however, they are fairly lightweight compared to loan
    cycle transactions so not the best.


    I didn’t go deeper into this rabbit hole because the data that found out initially
    answered the most important questions towards the expected blockchain performance
    in the near to mid-term future. There is also the tool creditcoin-transaction-producer
    created by another team member whose job is to send hundreds and thousands of
    transactions and actually answer the questions around throughput.


    # Security Bounty Program


    Security has been and is an ongoing concern for Creditcoin. And in my personal
    opinion, as we engineers should always strive to create software and be thinking
    along those lines.


    For example, as part of the development of creditcoin-cli, I’ve successfully advocated
    for removing the ability to directly specify secrets in plain text or display
    them as in the terminal. This functionality poses a security concern because these
    plain text values may end up in a terminal history file or copy-pasted to a wider
    audience with command


    147'
  - '[PAGE 155]


    # CHAPTER 6 CREDITCOIN 2.3


    output while trying to report a problem, I''ve been working in the industry long
    enough to have firsthand experience of experienced teams leaking their credentials
    on the Internet via a number of different means. Having your software expose secrets
    in plain text without a minimum precaution is a sure way for less security-cautious/tech-savvy
    users to leak their secrets. You are just asking for it!


    In creditcoin-cli secrets are either read interactively via a terminal prompt
    which masks the input characters and doesn''t allow the value to be copied, or
    they need to be specified as environment variables! These values are never stored
    on disk by the application itself.


    Aside from Creditcoin engineers doing internal assessment on the risks from a
    security point of view and the already mentioned static analysis tools, following
    best practices, and keeping third-party dependencies up-to-date, the team made
    some work on our security bounty program.


    It is a low-key bounty program originally hosted at the Hunter.dev platform which
    had changed focus since and documents the steps to responsibly disclose security
    vulnerabilities inside a SECURITY.md file in each repository. The goal is to allow
    the community to discover any low hanging fruits and for the team to establish
    a workflow around patching and responding to security vulnerabilities. For testing
    that means validating the reported entries, most importantly making steps to reproduce
    and issue description are accurate to the point where an engineer can work on
    them.


    The next step in this security journey will be a dedicated security bounty program
    with high monetary or crypto rewards which is hosted on a higher profile platform
    dedicated to Web3 security research. At the time of writing, the team is not there
    yet.


    Note that during the writing of this book, the huntr.dev platform itself changed
    ownership and shifted its focus from a general-purpose security bounty platform
    into one targeting AI/ML. Thus the original bounty program is no more! Security
    vulnerabilities can still be disclosed'
