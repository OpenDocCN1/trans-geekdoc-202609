    # CHAPTER 7 CREDITCOIN 3.0


    newly provisioned runners with their respective labels according to the test matrix,
    and then use the same labels in the integration-test-cli job definition to select
    the appropriate runner. That guarantees six unique runners each one of which will
    be assigned to only one integration test job. Then destroy them when finished!


    This effort lead to shaving off 30 minutes from the longest running test jobs
    in this matrix. My speculation is that even though there is a lot of waiting for
    blockchain-related operations, using these self-hosted runners is still faster
    than GitHub shared runners because they are a dedicated resource which isn''t
    oversubscribed. I/O and most likely CPU operations will take less time because
    the underlying operating system is giving its full attention to your testing indent
    hundreds or thousands of other processes. I don''t have a definitive proof if
    that''s the actual reason, but it does make sense, and empirical results show
    that using these self-hosted runners is faster than the shared ones


    **Caution** Besides the limits of how many virtual machines you can provision
    at the same time in your hosting environment, there is another more subtle factor
    which may be imposing unexpected limitations on your CI. This is the API request
    limit rates set by your chosen cloud provider in relation to how often you need
    to provision resources on-demand. With Creditcoin 3, I''ve seen the underlying
    provisioning API respond with **429 Too Many Requests** enough to be annoying
    and my CI setup failing!


    This also tells me that the overall number of virtual machines that I can have
    at any given time has nothing to do with the number of how many API requests I
    am allowed per hour/minute, etc. This is something that needs to be evaluated
    in more details if your testing depends heavily on self-hosted runners.


    All of this isn''t very difficult to do with the existing syntax in GitHub Actions;
    however, it brings an unwanted side effect – you now have a matrix test job which
    depends on another matrix test job, see Figure 7-9. If one of the integration
    test jobs fails, or times out, there is no easy way to restart it. I mean you
    could click the restart button in the GitHub interface for that specific job which
    has failed, but it will lead to unwanted results. The best you can do is restart
    all jobs part of the matrix together – and that''s simply not possible via the
    current GitHub interface – you have to restart all jobs defined in the same yaml
    file.


    At the time of writing this book, this was a fairly recent problem, but I think
    I know what the solution should be. If there is one more CI, before the dependency-github-runner
    one, that is, to the left of the dependency chain, it could serve as the entrypoint.
    Let''s call it integration-test-cli-entrypoint. If any of the subsequent jobs
    needs to be restarted, a tester could restart the integration-test-cli-entrypoint
    job and everything else that comes after it. Still not very optimal, but it doesn''t
    trigger a restart for other CI job defined in the same yaml file. I''m instinctively
    trying this out!


    ![](img/fdf35d2d28d1fdd7aff60f2490629a1b_211_0.png)


    Figure 7-9. Dependent matrix jobs


    # Summary


    As you have seen by now, testing Creditcoin 3 is very similar to its predecessors
    from the v2 family. That is to be expected because the underlying technology stack
    and development practices are roughly the same. On the other hand, there are new
    testing challenges that came up same which I guess is also to be expected.


    Unfortunately there is no more testing that I can share for now. As I am writing
    the book, the next phase of Creditcoin 3 is not there yet, and I haven''t worked
    on it, not am I aware of the practical details related to its implementation.


    In the next chapter, I will talk about how I approach testing in general and what
    I think a test engineer’s job is. Please stick around a bit more.


    # CHAPTER 8


    # How Others Test Blockchain


    My motivation for for writing this book was to share my personal experience in
    blockchain testing in the hope that it could be useful to others. During the process
    of writing it, I actually came to know other testers who were working in the blockchain
    domain. And of course they were working on products which are different than mine,
    and their approach is also different.


    This chapter outlines the experience of Andrew Snaith and Sebastian Viquezo who
    kindly agreed to talk to me. As you will see, there is even more to test in blockchain
    than I have already covered in all the previous chapters.


    ## My Blockchain Testing Approach


    As with any other kind of testing, I start by trying to understand what we''re
    trying to do and the limitations of the environment I am working in:


    - What are all of the components of the blockchain under test?

    - How does each component work, and what is its complexity?

    - What are the risks involved; what are the business requirements?

    - What parts can be exercised via unit, integration, and/ or other types of testing?

    - How do I actually write these types of tests - for example, syntax, available
    tools, and examples?


    This helps me build my understanding of all moving parts from business point of
    view and also from a technical point of view. I tend to start from the technical
    side first and gradually expand my understanding. Whenever possible, I will opt-in
    for testing early in the development cycle and automating as much as possible.
    That also helps codify the behavior of a complex system which has been handy on
    numerous occasions.


    For Creditcoin that means I was focusing on testing logic and covering additional
    scenarios as they arise and we gain more understanding of how the entire blockchain
    is used and how it works in detail. Constantly participating in code review on
    pull requests, raising questions and opening tickets for missing tests or the
    need for refactoring so that they aren''t forgotten has contributed more for quality
    over time than any particular test scenario I''ve automated or any individual
    bug I''ve found.


    This is a bottom-up approach and is also a very organic one – testing from day
    one and testing every minimal bit of product that you can lay your hands on. This
    is also a personal bias that I have because of how my professional career has
    taken place over the years – I’ve always worked in product companies, always on
    products which are highly technical in nature and always on the same level as
    my developer counterparts. That is the nature of infrastructure-type software
    products anyway.


    I’m not sure I am even qualified to offer advice for even not being in the same
    situation as I am in. I guess just “give it a try” is good enough advice.


    # Testing Across the Blockchain Stack

    with Andrew Snaith


    Testing a blockchain protocol and client implementation is one side of the puzzle
    and arguably the fact that Gluwa, Inc. controls both makes testing Creditcoin
    relatively easy. I talked to Andrew Snaith, Quality Engineering Lead at ChainSafe,
    about his point of view around blockchain testing and discovered even more nuances
    than I had thought about.


    ChainSafe is a multi-chain blockchain research and development company with an
    on open source software. They offer development services for external clients
    and also develop their own products.


    In terms of organization, the company has multiple engineering teams which for
    the majority part work on what they call streams. Some engineers are dedicated
    to a single stream, while others are working on multiple streams in parallel.
    Similarly some teams have a dedicated quality engineer, while others do not, more
    on this later. The work itself is spanning across multiple chains as well as across
    the entire stack: host client development, cross-chain bridges, web3 tooling libraries
    and SDKs, distributed applications, smart contracts, and browser extensions.


    Note A bridge is a computer program that connects two or more blockchains together

