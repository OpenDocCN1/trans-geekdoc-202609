    \ us to execute a local chain whose storage items match the production version\
    \ but still inject development accounts into it and execute it independently.\
    \ When the newly created local chain is up and running, perform the runtime upgrade\
    \ which triggers the storage migrations. When that passes, execute the integration\
    \ test suite against the fork to make sure the fork is still functionally to the\
    \ origin.\n\nFor upgrade and migrations testing, we're using self-hosted GitHub\
    \ runners which are deployed on-demand in Azure. This is because the upgrade and\
    \ migration workflows require lots of memory – 16 GB at the very least. Block\
    \ import process is also computationally intensive.\n\nStorage migration hooks\
    \ are instrumented in two ways in order to facilitate these testing activities:\n\
    \n- A pre and post hook for every migration which allows us to share state before\
    \ and after the migration for the purposes of assertions. Since storage migrations\
    \ are executed at runtime, we're making use of the fact that the assert! macro\
    \ in Rust will cause a runtime panic, that is, it will cause the process to crash\
    \ if the assertion fails. A non-zero exit code will cause the CI job to report\
    \ a failure.\n\n# CHAPTER 5 CREDITCOIN 2.0\n\n- A warn_or_panic! macro used around\
    \ statements whenever an edge case may be present. In a production node, this\
    \ macro will only produce a warning; however, during testing it will also cause\
    \ a crash. This behavior is controlled via compiler flags configured explicitly\
    \ during testing. You can think of this as a last line of defense which you want\
    \ to crashing during testing in order to alert you about existing corner cases\
    \ in production data, but you don't want this to be crashing in production or\
    \ not to bring the blockchain down accidentally. The macro does what its name\
    \ says – either logs a warning or causes a panic.\n- A helper static analysis\
    \ script which fails when migration sources use the log:warn! macro directly.\
    \ This helps ensure that we always use the warn_or_panic! macro and don't remove\
    \ it or circumnavigate accidentally. Otherwise edge-case branches triggered by\
    \ actual production data will not fail during testing, and the team may not become\
    \ aware of that.\n\nIn addition to all of this, the creditcoin pallet defines\
