    # 第 5 章 CREDITCOIN 2.0


    ## 安全相关测试


    工程团队内部有一种产生一个安全的 Creditcoin 实现的共识，但这种定义非常模糊。Creditcoin 2.0 的目标是解决安全光谱中最容易处理的问题。这些工作通常围绕建立安全实践的基准、安全相关工具的基准以及社区安全参与的基准展开。这些事项没有特定顺序如下：


    - 保持所有依赖都是最新版本。

    - 开始使用 `rustc stable` 版本代替 `nightly`。

    - 启用流行的静态分析工具，以确定哪些工具适用于 Rust 生态和 Creditcoin，并修复这些工具报告的任何代码异味和问题。

    - 启动一个低调的安全赏金计划，以便外部研究人员发现更多漏洞并进行跟进。


    我已经启用的工具：


    - Dependabot：将第三方依赖更新到最新版本并开启拉取请求（pull requests）。此外，在 GitHub 界面内提供影响任何第三方库的安全问题报告。

    - GitHub 的 CodeQL：静态分析器，支持 JavaScript 但不支持 Rust，因此用不大。

    - Cargo audit：一种 Rust 原生工具。报告 CVE 和未维护的依赖。我们通过一级依赖过滤掉了报告，因为我们对 Substrate 框架及其带来的整个依赖栈的控制较少。随着时间的推移，该工具开始报告除非升级
    Substrate 框架版本否则无法修复的问题。

    - MegaLinter 的 Rust 版本：更大的 lint（代码检查）工具集合，其中某些与安全有关。它帮助我们收紧了 GitHub actions 的权限并改进了
    Dockerfile 实践。强制升级了某些报告过 CVE 的依赖项。


    在保持更新方面，我们不允许通过 git 仓库使用 Rust 软件包，因为这会破坏 Dependabot 和大多数其他工具——这一点通过静态分析脚本强制执行。值得说明的例外是
    Substrate 框架本身，它不在 crates.io 上发布包。相反，我们正在跟踪 Substrate 的特定 git tag。在写本文时，关于新版本
    Substrate 版本的提醒不是自动的，但实现起来相当简单。


    启用 `rustc stable` 编译需要对 Substrate 本身进行多次升级，这是由于 WASM 运行时的功能。我们必须一次升级一个版本并解决 Substrate
    新版本引入的不兼容问题，但最终实现了目标。这样做并不特别困难，但它会带来巨大的维护负担，任何试图跟上流行框架更新的人都能证明这一点——所以如果没有要求，你可能不想频繁地这么做。


    # 第 5 章 CREDITCOIN 2.0


    ## 测试 Creditcoin-squid


    作为一种索引代理，creditcoin-squid 的主要挑战是维护数据完整性。为了测试目的，可以将其总结为“导出的数据始终与区块链一致！”


    次要测试目标与从区块链上的多个事件聚合数据的能力有关——例如，累积事件是否运行正常，是否正确地累加了所有交易！


    最初考虑过属性测试（property testing），我尝试寻找类似于“跨数据记录的属性进行断言”。最后我发现了 Slack 的一致性检查框架 https://slack.engineering/data-consistency-checks/，它提供了一些初步启发。


    第三大挑战是 GraphQL API 应该为构建分层应用提供稳定的接口。因此，API 端点的任何向后兼容的更改都有破坏现有应用程序的风险，这是不受希望的。


    你可以发挥想象力为这些挑战寻找创造性的解决方案。遗憾的是，我无法在这里分享源代码更多细节。


    # 我们如何在第 100 万区块发现一个 Bug


    我们有一个不属于常规开发生命周期的环境；它被用于性能测试，其中网络被涌入数千次交易，并最终达到了第 100 万区块。


    这暴露了一个 Bug，许多记录（DealOrders）被设置为在区块 1000000 到期（来自测试脚本的硬编码值）。Creditcoin 过滤已期条目的方法是从存储中获取所有条目，移除未资金的项，然后将剩余部分写回存储。这段代码在名为
    `on_initialize()` 的函数内每个区块执行一次。幼稚的实现是从存储中读取所有内容、遍历、过滤项目并写回剩余部分。这导致内存分配超过特定边界并引发崩溃。


    # 第 5 章 CREDITCOIN 2.0


    这个 Bug 的技术背景位于 Substrate 内部。它有一个32 MB 的最大限制，而 Creditcoin 已经有 10 个月的历史了。团队想要的解决方案是保持磁盘空间
    https://github.com/parity/substrate/issues/11132 和 https://github.com/parity/substrate/pull/1120。在问题出现时，团队没有简单的解决方案，而且这是额外工作，不在范围之内，因此测试被放弃了。


    可能可以通过 Promise 所有以及 Creditcoin RPC 的异步/并行特性、TypeScript 客户端库来调度这数千次交易。我们随后需要解决的是
    nonce 管理——即客户端应用程序需要生成唯一的数字标识符，并随每笔交易一起发送，而不是依赖区块链像默认那样自己去计算。这在简单来说是不可行的。


    这表明，你的实现中可能隐藏着 Bug，它们会在几个月甚至几年后出现，取决于使用量。每一部分测试基础设施都应该受到与生产环境同样的关注！


    # 其他有趣的事实


    如之前提到的，交易费用不是固定的，它们根据使用情况而波动。在 Creditcoin v2.0 生命周期的早期，我想通过集成测试来练习这一点，并断言当区块链被“重度使用”时交易费用会增加。由于当时我不知道“重度使用”的精确定义，我选择了一个简单的场景：提交
    10 笔交易，并预计最后一笔费用大于第一笔。https://github.com/gluwa/creditcoin/pull/142/files。


    这实际上如预期那样起了，因为测试场景是不正确的。我需要生成更多的交易，以便在一段时间（若干区块）内达到 25% 或更高的区块填充率，这样我们看到内部费用调整开始生效。团队快速估计我们需要每秒生成数千笔交易。如果我没记错，我们讨论的是
    4000 左右，但我对这个数字可能错了。


    大约 6 个月后，团队再次面临生成大量交易的挑战。背景是我们希望向测试网环境中填充大量记录，使其更像生产环境。这很重要，例如为了测试迁移以模拟真实的升级场景和性能基准测试。解决方案是创建一个名为
    `creditcoin-transaction-producer` 的自定义工具，它能够产生数千笔并行交易并实现适当的 nonce 管理。


    另一个被简要探索的测试领域是在 Creditcoin 运行时中启用所谓的“混沌（chaos）”调理（pallet）；见 https://


    '
