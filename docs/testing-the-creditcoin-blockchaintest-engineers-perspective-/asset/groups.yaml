    \ to execute them against multiple environments, even against production. In mainnet\
    \ this serves as a sanity test that loan cycle functionality is still working\
    \ and that transaction fees meet a minimum requirement.\n\n# Sanity Testing and\
    \ Static Analysis\n\nIn this category, I classify most of what doesn't fit elsewhere:\
    \ linters, code formatters, and custom scripts – I like to follow the best practices\
    \ set by the language and write clean code. Some of the tools used for testing\
    \ Creditcoin, cargo fmt, Clippy, eslint, and prettier.\n\nIn certain cases, static\
    \ analysis tools can detect patterns which may be known to cause bugs, I make\
    \ sure to create customized tools to check for such patterns in the source code.\
    \ In some language ecosystems that effort has taken the form of linter plugins,\
    \ while in the case of Creditcoin these are mostly stand-alone bash scripts. These\
    \ scripts will inspect the source code, for example, using grep, and alert us\
    \ about common mistakes which may lead to errors. For example:\n\n+ - Remember\
    \ that there are native and on-chain runtimes and which one is used is dependent\
    \ on the runtime version number? Now imagine the situation where runtime behavior\
    \ changes but the version number doesn't – this can lead to nodes running code\
    \ that has different versions. There are a number of situations where the version\
    \ number needs to be increased so this script takes a preemptive approach and\
    \ requires version number bump based on a simplified heuristic. Sometimes this\
    \ version number increase is not strictly necessary but better safe than sorry.\
    \ It also fits well with the rest of the development process.\n\n- - The order\
    \ in which extrinsic functions are defined inside their pallets source code directly\
    \ translates to their internal index in the chain metadata. These indices translate\
    \ directly to error messages visible to the end user, as resolved by the polkadot-js\
    \ API library, so we need to make sure that extrinsics order did not change. The\
    \ bash script is a wrapper around the polkadot-js-metadata-cmp tool.\n\n- - In\
    \ order for transaction fees to be accurate, each extrinsic needs an associated\
    \ weight which is generated by an associated benchmark function. So make sure\
    \ that all in-house defined pallets have benchmarks and these benchmarks are hooked\
    \ into CI for automatic weight generation. Also make sure extrinsic name, benchmark\
    \ function, and weight function match to avoid copy-paste errors as much as possible.\n\
    \n- - We want to keep up-to-date dependencies and use various security-related\
    \ tools which generally operate on scanning package versions and matching against\
    \ popular third-party package repositories. Therefore, using libraries from git\
    \ repositories, instead of packages, is not preferred. For Rust, prefer package\
    \ crates.\n\n- - Some of these static analysis tools are for quality gain. On\
    \ the sanity spectrum, we are building cluster and making sure it doesn’t crash\
    \ that containers expose /health endpoint to be used by DevOps - make sure the\
    \ code looks nice.\n\n# Testing with Bots\n\nA number of automatic operations\
    \ take place during development of Creditcoin 2.0. I call them “testing with bots,”\
    \ but strictly speaking most of these are related to the development process.\
    \ In any case having them automated has its benefits:\n\n- Menial tasks require\
    \ less human involvement.\n- They happen on a regular basis.\n- Pull requests\
    \ will be opened automatically which in turns kicks off the CI/CD pipeline.\n\n\
    # Dependabot\n\nAutomatic upgrades of third-party dependencies are an integral\
    \ part of Creditcoin 2.0 and something I’ve personally been using for a number\
    \ of years. This service runs on a schedule and opens pull requests whenever a\
    \ new version of a dependency is available. The majority of these are related\
    \ to creditcoin-js and integration-tests as they are written in TypeScript and\
    \ receive updates much frequently. However, even on the Rust side of things, we\
    \ want to keep as up to date as possible. This reduces maintenance burden over\
    \ the long run, lets you know whether the software under test is still compatible\
    \ with newer libraries or not, and contributes a tiny bit to improved overall\
    \ security of your software. If CI jobs are passing, then merge the updated version,\
    \ usually with only the QA engineer providing review.\n\nA notable exception here\
    \ is the Substrate framework itself, which is consumed via a git repository. The\
    \ various components of Substrate framework rarely published by crates.io, the\
    \ Rust package repository, and require manual upgrades. That process isn’t automated\
    \ in Creditcoin 2.0. Technically speaking, it is relatively easy to create your\
    \ own bot that would propose upgrades for newer versions of the Substrate framework,\
    \ even when consumed via a git fork. It is my impression that Substrate is still\
    \ actively changing frequently which would require manual work to inspect and\
    \ assess any incompatibilities so probably not much benefit to be gained by automating\
    \ this process\n\n# Pre-commit CI\n\nA popular service with Python developers\
    \ which can modify the source code and create a new commit. Creditcoin 2.0 doesn’t\
    \ use the full capabilities of this service - mainly it uses pre-commit CI to\
    \ correct missing newline at the end of files, trailing white space and some types.\
    \ The service itself has not been designed with a Rust or TypeScript code base\
    \ in mind and the benefit you can get out of it is limited. My main motivation\
    \ for introducing it - annoying missing newline characters to just everything\
    \ look ugly when displaying file contents in a terminal. Just make the code look\
    \ nice.\n\n# Type Definitions with Gluwa-bot\n\nAny Substrate-based chain serializes\
    \ its data types and error messages in the SCALE format (binary encoding) and\
    \ exposes this metadata via RPC. Clients built with the Polkadot JS library can\
    \ use this to refresh\n"
