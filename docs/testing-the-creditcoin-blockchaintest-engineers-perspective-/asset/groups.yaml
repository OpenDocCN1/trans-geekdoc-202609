    Creditcoin 部署的容器镜像是一个自定义构建，包含了覆盖原始工作量证明相关 Python 文件的热补丁！


    请注意，在 Creditcoin 1.x 生命周期结束之时，曾尝试切换到 `hyperledger/sawtooth-validator:1.2`，其本身是用
    Rust 实现的，Creditcoin 团队在此过程中发现了一些小问题。由于书中讨论的原因，这一尝试非常短暂。


