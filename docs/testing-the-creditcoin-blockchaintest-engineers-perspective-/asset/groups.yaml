    As it happens, I''ve also worked on crafting a couple of security advisories for
    Creditcoin that were eventually published under https://github.com/gluwa/creditcoin/security/advisories.
    One more for test engineers to add under their tools!


    # Other Interesting Testing and Some Bugs


    As part of v2.3 development, a number of interesting failures happened. They happened
    on dedicated testing environments and prompted testing to be added to the existing
    suite.


    Once you switch to nominated proof of stake, you can''t change values inside your
    blockchain implementation. Most importantly you can''t change duration of staking
    epoch - the period for which validators are chosen to produce blocks! Changing
    this bricks the blockchain so I''ve added static analysis checks and integration
    tests to catch this! Which also highlights how important choosing the actual values
    here is.


    Another issue related to upgrading infrastructure is how latest releases are discovered
    based on git tags. The CI jobs expect a certain naming convention, for example,
    -devnet for intended for Devnet, -testnet for Testnet, and so on. Remember how
    the runtime upgrading CI jobs intros the target branch for a pull request in order
    to figure out which chain to synchronize to? In a similar fashion, they need to
    know how to find the previous release which is used in different places as part
