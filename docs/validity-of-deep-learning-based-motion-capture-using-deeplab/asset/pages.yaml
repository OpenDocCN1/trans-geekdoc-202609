    Introduction: Sensory deficits are common in neurological disorders

    Proprioception is an example of a system that could

    be impaired. In clinical cases, proprioception is preferably

    assessed as early as possible. Based on deep learning to

    track body landmarks in video recordings we

    performed the experiment in the laboratory without the

    need to attach markers. This study aims to

    validate deep learning based motion capture (DeepCut)

    with gold standard 3D optical motion capture (repro)

    duction Error (JRE) during a knee joint sense test.


