    Research question: Can deep learning based motion capture

    (DeepCut) provide valid assessment of proprioception that

    is comparable to gold standard 3D optical motion-

    ctronic capture?


    Methods: Proprioception was assessed with the eyes

    during 45 knee sense tests of 11 typically developing

    children with cerebral palsy (mean 8.5 ± 1.0°, mean JRE

    17.0 ± 2.6°) by measuring the difference between the

    contraction and requested angle (JRE, in degrees). The joint

    were measured with two tests: 1) 3d optical motion capture

    (gold standard markerless motion model)

    2) 2d deep learning based motion capture (Deep-

    Cut) using the pre-trained neural model (with)

    MP55 manually labeled frames from videos of children,

    who were then analyzed using statistical analysis. Linear regression

    produced unchanged angle compared to the requested angle. DeepCut

    and Vision.


