  mdcn: '


    # 基于深度学习的动作捕捉的有效性

    ## 使用 DeepCut 评估本体感觉


    DeepCut 在测量其他关节（如踝关节和髋关节）关节重复误差（JRE）方面的有效性，以及使用 DeepCut 评估 JRE 的可靠性。此外，我们正致力于验证
    DeepCut，通过基于关节感觉测试的动作捕捉技术评估本体感觉，这有助于在没有标记物和没有实验室环境的情况下实施本体感觉评估。


    Maud Van Den Berg¹, Naomi Jacobs²

    Gooy Meyers¹, Anne Hamlemans³, Peter Myers¹


    ¹ 哈塞尔特大学，康复研究中心，Discrete，比利时

    ² 鲁文大学发育与再生系，鲁文，比利时

    ³ 安特卫普大学神经内科，安特卫普，比利时


    # 参考文献


    引言：感觉障碍在神经系统中很常见

    本体感觉是一个可能受损的系统。在临床病例中，应尽早评估本体感觉。基于深度学习跟踪视频记录中的人体标志点，我们在实验室中进行了实验，无需连接标记物。本研究旨在验证在关节感觉测试期间，基于深度学习的动作捕捉（DeepCut）与金标准
    3D 光学动作捕捉重复误差（JRE）的一致性。


    - 1. Baert IA 患有膝骨关节炎女性的本体感觉准确性与其功能能力、姿势控制和肌肉力量的关系。Clin Rheumatol. 2013;39(6):735-74.
    doi:10.1007/s00164-013-2285-x

    - 2. Gärtner M, Terbeek MA. 国际生物力学学会（ISB）正交关节坐标系定义和同源人体关节位置功能的可靠性。踝关节、髋和脊柱。J Biomech.
    2002;35:977-85

    - 3. Mathis A et al. 基于深度学习的 DeepCut 估计深度本体感觉标记。Nat Neurics 2021; (9):1281-1290.
    doi:10.1038/s41593-021-0289-y

    - 4. Chen X et al. DeepCut 在非人类动物和宠物多姿态估计中的验证。Nat Rep. 2019;47(7):2152-217. doi:10.1038/s41567-019-0176-0


    研究问题：基于深度学习的动作捕捉（DeepCut）是否能提供与金标准 3D 光学动作捕捉相当的有效本体感觉评估？


    方法：在对 11 名发育正常的脑性麻痹儿童（平均 8.5 ± 1.0°，平均 JRE 17.0 ± 2.6°）进行 45 次关节感觉测试期间，通过测量收缩角与请求角之间的差异（JRE，单位：度）来评估本体感觉。通过两种测试测量关节：1）3D
    光学动作捕捉（金标准无标记动作模型）2）使用预训练神经模型的 2D 深度学习动作捕捉（DeepCut），使用儿童视频中手动标记的 MP55 帧，然后使用统计分析进行分析。线性回归显示产生的角度与请求角度相比没有变化。DeepCut
    和 Vision。


    > https://doi.org/10.1016/j.jbcp.2023.05.025


    结果：使用 Vision 测量的 JRE (-4.18) 与使用 DeepCut 测量的 JRE (-0.43) 之间没有显著差异（F=0.1, p=0.91）。每个受试者的重复平均值与
    DeepCut 确定的 JRE 之间没有显著差异（t(10) = -0.11, p=0.92）。


    ![](img/fbadb9efa08281b703f5386550811887_0_0.png)


    讨论：在发育正常的儿童中，使用 DeepCut 测量 JRE 似乎是有效的。需要进一步的研究以及评估...


