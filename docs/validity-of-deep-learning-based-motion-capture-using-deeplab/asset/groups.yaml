    引言：脑性麻痹（CP）儿童通常会出现上肢缺陷 (1)，导致疼痛和步态问题。此类缺陷之一是足部肌肉力量的不平衡 [2]。相反，这些缺陷也会影响踝关节的功能和力矩。基于通用骨骼几何结构的肌肉骨骼模型用于力矩以表示缺陷的准确性。负重
    CT（WECT）能够在特定条件下评估骨矿 [3]。


    研究问题：主要内翻肌和伸肌（踝关节和胫骨）力矩长度的变化


