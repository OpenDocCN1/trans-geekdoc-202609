  md: '# Editors


    Qurban A. Memon has contributed at levels of teaching, research, and community
    service in the area of electrical and computer engineering. He has authored/coauthored
    approximately 100 publications over 18 years of his academic career. Additionally,
    he has written five book chapters: 1. “Intelligent Network System for Process
    Control: Applications, Challenges, Approaches” in Robotics, Automation and Control,
    2009; 2. “RFID for Smarter Healthcare Collaborative Network” in Building Next-Generation
    Converged Networks: Theory and Practice, CRC Press, 2012; 3. “Secured and Networked
    Emergency Notification without GPS Enabled Devices,” in Bio-inspiring Cyber Security
    and Cloud Services: Trends and Innovations, Springer, 2014; 4. “Authentication
    and Error Resilience in Images Transmitted through Open Environment” in Handbook
    of Research on Security Considerations in Cloud Computing, 2015; 5. “JPEG2000
    Compatible Layered Block Cipher” in Multimedia Forensics and Security: Foundations,
    Innovations, and Applications, 2017. He has also edited a book titled Distributed
    Network Intelligence, Security and Applications, published by CRC press, 2013.
    His research project undertaken by UAE-U students won CURA-2009 and CURA-2018
    awards.


    Shakeel Ahmed Khoja is a professor at Faculty of Computer Science, IBA Karachi,
    and is a Commonwealth Academic Fellow. He did his PhD and post-doc at the School
    of Electronics and Computer Science, University of Southampton, UK. His research
    work includes development of e-learning frameworks, digital libraries, content
    and concept-based browsing and information retrieval over the Internet.


    He has worked as a lead researcher and project manager for two European projects
    based at Southampton, for using learning technologies to develop web-based tools
    and to make educational videos easier to access, search, manage, and exploit for
    students, teachers, and other users through developing and deploying technologies
    that support the creation of synchronized notes, bookmarks, tags, images, videos,
    and text captions. He has also carried out a number of data analysis projects
    at the State Bank of Pakistan and has been involved in developing consumer confidence
    and business confidence surveys for the bank.


    Dr. Khoja has taught computer science courses at the University of Southampton,
    Karachi Institute of Information Technology, and Bahria University. He has more
    than 18 years of professional experience and more than 50 research publications
    to his credit. He is also a reviewer of number of journals and conferences in
    the field of computer science.'
