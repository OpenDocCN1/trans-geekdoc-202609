    # 13.4.4 PLANNED APPROACH


    The implementation of SA analysis in analyzing the reviews in the Movielens data
    consisted of several preprocessing activities, such as handling of missing data
    or sparsity, removal of special characters applied, such as "!", "@,", and blank
    spaces needed, and creation of a corpus based on unsupervised learning to label
    the data. Other phrases such as "wow" and "ooh" as well as repetitive characters
    were also removed. The dataset consists of numerical attributes and string attributes.
    The numerical attributes consist of five-star ratings, while string attribute
    contains the comments and reviews on the movies. Studies that have used SA to
