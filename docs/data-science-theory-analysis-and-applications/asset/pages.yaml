    # 12.1 INTRODUCTION


    The digital revolution has resulted in the transformation of many businesses to
    online mode. Digitalization has modified the operational strategy of online firms
    due to advantages such as cost-effectiveness, 24 × 7 availability, no geographical
    limitations, and low entry and exit barriers, to name a few [1–2]. The upward
    trend in online marketing is especially noticed in the service sector. Few popular
    categories under the service sector are retails, banks, hotels, airlines, healthcare,
    and education, to name a few. Automation in conducting business practices has
