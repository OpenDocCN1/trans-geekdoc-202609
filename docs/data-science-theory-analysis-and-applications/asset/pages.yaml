  md: '# Penguin Search Optimization Algorithm


    get depleted. Each penguin has to return back to the surface after each trip.
    The duration of the trip is measured by the amount of oxygen reserves of the penguins,
    the speed at which they use it up, or their metabolism rate. This behavior of
    the penguins has given us motivation for the development of a new optimization
    method based on this strategy of penguins. Penguins are sea birds, and they are
    unable to fly [10]. Metaheuristics is mainly used for the development of new artificial
    systems, and it is effective in solving NP-hard problems. It can be classified
    in various ways. The first work in the field of optimization commenced in 1952
    based on the use of a stochastic manner. Rechenberg diagrammed the first algorithm
    using evolution strategies in the optimization in 1965 [10]. Most of the methods
    utilize the thought of population, in which a set of solutions are calculated
    in parallel at each iteration, such as genetic algorithms (GAs), particle swarm
    optimization (PSO) algorithm, and ant colony optimization algorithm (ACO) [11–12].
    Other metaheuristic algorithms use the search results based on their past experiences
    to guide the optimization in following the iterations by putting a learning stage
    of intermediate results that will conduct to an optimal solution. The work reported
    in this chapter is an example of it. It mainly depends on the collaborative hunting
    strategy of penguins. The catholic optimization process starts based on the individual
    hunting process of each penguin, who must share information to his group related
    to the number of fish found of their individual hunting area. The main objective
    of the group conversation is to achieve a global solution (the area having abundant
    amount of food). The universal solution is chosen by a selection of the best group
    of penguins who ate the maximum number of fish. Comparative studies based on other
    metaheuristics have proved that PeSOA accomplishes better answers related to new
    optimization strategy of collaborative and dynamic research of space solutions.


    This rest of the book chapter is organized as follows. A brief literature review
    has been done in Section 3.2. In Section 3.3, we have described our proposed work
