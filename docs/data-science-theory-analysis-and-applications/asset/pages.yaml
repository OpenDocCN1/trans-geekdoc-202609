  md: '(positive, negative, depressed, and harmony). After classifying the emotions
    completely, we proceed for the transition of different emotional states from the
    neutral state at a fixed time interval using state-transition machine. In this
    chapter, we use support vector machine (SVM), k-nearest neighbors (KNN) and random
    forest for classification. We are trying to recognize the emotional state and
    predict the next state with some time interval. To recognize emotions defined
    by an accepted psychological model, in EEG, by the use of any classification algorithm
    (KNNs). This entails an investigation of the problems areas (emotions, EEG, and
    BCIs), i.e., commonly used computational methods in these areas; this should result
    in a method and an implementation that accomplish the goal of recognizing different
    emotions in EEG. The main motivation of this work is to classify emotions in such
    a way that helps in rational decision-making, perception, human interaction, and
    human intelligence processes. Hence, emotions are fundamental components of being
    human, as they motivate action and add meaning and richness to virtually all human
    experience. They hold a great potential for people who are paralyzed or otherwise
    unable to use their hands or who cannot talk.


    This rest of the book chapter is organized as follows. A brief literature review
    has been done in Section 10.2. In Section 10.3, we have described our proposed
    work with a suitable flow chart diagram, which includes emotion classification
    and transition function for the state-transition system. Besides that, we have
    also analyzed a state-transition system based on the increased or decreased activity
    of specific cortex of the brain in Section 10.3. Then, we have done a detailed
    performance analysis of our approach in Section 10.4. We have compared our proposed
    work with previous studies related to different parameters of classification in
    Section 10.4, and finally, Section 10.5 describes the conclusion of this work.


    # 10.2 LITERATURE REVIEW


    The research activities on human emotions have been existing for a long time in
    psychology and psychophysiology. But in engineering, research in that field is
    relatively new. However, many efforts have been made to recognize human emotions
    using audiovisual channels of emotion expression like speech, facial expression,
    and gestures till now. These audiovisual techniques help in noncontact detection
    of emotions, and so the subject is always in comfort. These techniques are however
    deception prone. Some of the audiovisual recognition techniques are elaborately
    discussed in [1–3]. However, the attention is now gradually moving towards using
    physiological measures [4–7] and, most recently, towards EEG signal. Recent theories
    on emotion [16,17] explains that physiological activity is an important aspect
    of emotion, or rather, we can say that physiological activities help to construct
    a certain emotion. Several previous works show the associativity of increased
    activity of certain parts of our brain with basic emotions, which can be captured
    through an EEG signal. Yazdani et al. [18] proposed using a BCI based on P300
    evoked potential to emotionally tag videos with basic emotions. This book chapter
    proposes an effective algorithm to classify EEG signals, explains the activities
    of different parts of the brain based on values measured with electrodes, and
    demonstrates how the transition of emotion can happen for a human. In Bhardwaj,
    Gupta, Jain,'
