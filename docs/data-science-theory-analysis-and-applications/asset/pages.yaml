    of structural disorder named intrinsically disordered (unfolded) and partially
    folded proteins, taken from the work of Oldfield and coworkers [10]. This group
    is particularly important because it is used as a reference on the degree of disorder
    [11] for other protein groups; and (vi) a set of 557,713 “reviewed” proteins from
    UniProt database [5] that includes all the proteins whose annotation is confirmed
    as correct. This group was not used in the calibration of the Polarity Index Method®
    (PIM), but in the search of proteins with a “polar profile” similar to that of
    BrS mutated proteins.


    To obtain the “polar profile” of BrS mutated proteins, a computational system
    called PIM [7] was used. It was designed and programmed to perform two functions:
    to obtain the BrS “polar profile” of the mutated proteins and to compare that
    profile with the polar profiles of other protein groups. The PIM is a nonsupervised
    system, with a set of programs written in Fortran 77 [12] and scripts in Linux
    [13] that extensively evaluate a single physicochemical property, the “polar profile.”
    The PIM system is trained in evaluating different groups of proteins and making
    automatic changes on the “polar profile” of the target protein group, to reach
    the “polar profile” that best characterizes this target. The process is independent
    of the number of protein groups participating. Its metric only uses the linear
    representation of the protein, in FASTA format, reading one pair of amino acids
    at a time from one end to the other to find the polarity type that represents
    each pair.


    The discriminatory efficiency of the PIM system was verified by comparison of
    the proportion of accepted/rejected proteins from the BrS mutated protein group
    and BrS protein group with respect to the real proportion of proteins in the same
    protein groups. This analysis was performed using the nonparametric two-sided
    Kolmogorov–Smirnov test (Section 8.4.4). An analysis of the same protein groups
    was carried out to obtain the characterization of their “degree of disorder” using
    the set of supervised per-residue disorder predictors, such as PONDR® FIT, PONDR®
    VLXT, PONDR® VSL2, PONDR® VL3, FoldIndex, IUPred, and TopIDP (Section 8.4.2).
    This analysis was aimed at verifying the efficiency of PIM when identifying and
    discriminating the “polar profile” of the set of BrS mutated proteins and getting
    a “fingerprint” of the degree of disorder of this group.


    This article comprises three sections: (i) A computational analysis of the degree
    of disorder of each BrS mutated protein as well as its association with other
    diseases, (ii) A bioinformatic characterization (through the PIM®) of the BrS
    mutated proteins, and their contrast with a large and diverse set of protein groups
    of different structural and functional types, with the objective to obtain a “fingerprint”
    of the BrS mutated protein set, and (iii) the use of this “fingerprint” on all
    of the reviewed proteins listed in the largest known public primary database UniProt
    containing protein sequence and functional information. We speculate that this
    characterization could be used for the rapid identification of this syndrome at
    early stages, potentially even before the development of major symptoms.


    # 8.2 RESULTS


    We provide a workflow of the PIM® (see Figure 8.1) to clarify and make the results
    and procedures of this nonsupervised computational algorithm understandable.'
