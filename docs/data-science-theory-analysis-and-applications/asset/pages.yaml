  md: 'and the lack of machines with computational power to train with. It became
    more popular in 2010 with the availability of a large database of annotated images
    comprising about 1,000 categories of different classes of images and were made
    publicly available to researchers who are willing to train and test their proposed
    models [30].


    All the ConvNet models are composed of similar architectural layers, such as input
    layers, convolutional layers, pooling layers, and output layers or fully connected
    layers, but may differ in the layout they are presented. Input layer is the first
    layer that interfaces the outside world responsible for receiving input to be
    processed. However, input layer is not counted as part of the layer of a ConvNet
    model.


    # 9.3.1.1 Convolution Layer


    Convolutional layer in neural network is the most crucial part of the network.
    It is a layer of the CNN architecture that serves as a learning layer. It is a
    special layer of ConvNet architecture described in [32], and it consists of numerous
    neurons grouped together as filters. This layer performs the convolution (learning)
    operation on every portion of the input (usually image) and learns each pixel
    value [33], and the convolution operation means sliding a filter over an image
    while learning every single part of an input image.


    A good way to understand the filter is by introducing a torchlight analogy. Assuming
    one is looking for a needle that falls in a room, say on a carpet in a sitting
    room that is very dim and makes searching a difficult task. One of the best means
    to look for it is to get a bright light into the searching environment. One might
    decide to use torchlight for the search, although the torchlight may not provide
    the desired brightness that can illuminate the entire region in the room. One
    may realize that the torchlight is brighter in a single focused area, and in ConvNet,
    this focused area is called receptive field. However, the filter size can be of
    different sizes: 3 × 3 filter, 5 × 5 filter, 7 × 7 filter, etc., depending on
    the required architecture defined by the developer. The operation is performed
    by a convolving (sliding) filter over the input image, where on every receptive
    field covered by the filter, the elements of the filter are multiplied with the
    receptive field’s elements. The output of this operation is called feature map,
    and that should serve as the input to the next layer in the network. In addition,
    the convolving or sliding operation is guided by how many pixels a filter can
    move on at a time. This operation is called stride. For example, a stride of 1
    means a filter moves from one receptive field to another by one pixel, a stride
    of 2 means moving a filter from a receptive field position onto another by skipping
    two pixels.


    # 9.3.1.2 Pooling Layer


    Thereafter, pooling layers are used to reduce the number of feature outputted
    by convolution layers so as to minimize computational cost and increase efficiency
    [34]. Pooling operations are performed similar to convolution operation by convolving
    against the features extracted by a convolution layer, and the operation is either
    maximum pooling operation or average pooling operation. Pooling operation reduces
    the number of features obtained through convolution operations into specific,
    small features. This is much like discarding unnecessary features, thereby minimizing
    the cost of computation and increasing the efficiency [34]. Examples of pooling'
