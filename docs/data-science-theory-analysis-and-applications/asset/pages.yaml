- pgno: 234
  md: '# 9.4.1 IMAGE ACQUISITION AND PREPROCESSING


    The burn images were directly captured from patients in Plastic Surgery and Burns
    Research Unit, Bradford Teaching Hospitals, with full consent, where a total of
    34 images of different burn categories were obtained, which were subsequently
    augmented by flipping, zooming, and rotating, giving a total of 660 full-thickness
    burn images. Additionally, the superficial burn injuries (first-degree burns)
    were obtained via search on the internet, comprising mainly sunburn images. A
    total of 46 superficial burn images were successfully generated and then augmented
    to 660 images. Similarly, 660 healthy skin images were incorporated in the investigation,
    making a total of 1,980 images. All images were resized to 224 × 224 before feature
    extraction and classification, and in this way, all images will be of same size
    and correspond to a standard image size required by ResNet101. The samples of
    burn and healthy skin images were depicted in Figure 9.7.


    # 9.4.2 FEATURE EXTRACTION AND CLASSIFICATION


    The work presented here is inspired by the performance of ConvNet model (ResNet)
    during the ILSVRC challenge in 2015, and the choice of using a pretrained model
    is based on research conducted by researchers [37,42] who helped to achieve outstanding
    results. It was shown that, using a pretrained model to extract features from
    images, instead of training a ConvNet model from scratch with limited dataset,
    yields a remarkable result [37]. As such, to extract useful discriminatory features
    from images, lower layers (convolutional layers) of ResNet101 were used (excluding
    the topmost layer) as learning layers. These layers were convolved against the
    2D images to extract features. In a nutshell, the approach is simple, yet powerful
    filters of fully trained state-of-the-art neural network are used to convert raw
    image pixels into dense features, and then, an SVM classifies the features into
    nonburns and burns of different degrees.


    ![](img/5025594f89449de2a74e5b325b1e84ef_234_0.png)


    FIGURE 9.7 A sample of healthy and burn images.'
