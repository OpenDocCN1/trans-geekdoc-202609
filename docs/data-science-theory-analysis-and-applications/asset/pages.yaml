- pgno: 137
  md: 'As the limitations of our current study, we assume that the pieces of data
    are not so different from each other. In the real world, however, various types
    of data are published at the same time, such as texts, images, and audio. Those
    pieces of data have different sizes and loads to be processed. We can clear this
    limitation by considering not only the number of data pieces (or transmission/reception)
    but also the types of them. Similar to the inconsideration of data types, the
    inconsideration of nodes’ performances is another limitation of this study. We
    can clear this limitation by considering the nodes’ performance, such as processing
    power, memory size, and network environment. In addition, this study has a limitation
    in a viewpoint of security or privacy. For example, private data are preferred
    to be sent to the subscriber via fewer nodes. Encryption of the data or communication
    is one of the common approaches, and arrangement of the data forwarding paths
    considering security/privacy is another solution to clear this limitation, e.g.,
    the forwarding paths are directly connected to those valid subscribers for private
    data.


    # 5.5 RELATED WORK


    Related to the distributed stream data collection, various techniques have been
    proposed to disperse the communication loads for stream delivery [19].


    P2P stream delivery techniques have been proposed to use a P2P architecture and
    disperse the communication loads among the processing computers (nodes) [20–24].
    The P2P stream delivery techniques are divided into pull type and push type. In
    the pull-type technique such as PPLive, DONet [20], and SopCast, the reception
    nodes request data from other nodes and receive them. The reception nodes find
    the nodes that have not yet been receiving the requested data, and hence redundant
    communications do not occur. In the push-type techniques such as AnySee, data
    are sent from the transmission node to other nodes [21]. The transmission nodes
    find the nodes that have not yet received the requested data, and redundant communications
    do not occur. Also, the techniques combining pull type and push type have been
    proposed, such as PRIME [22].


    Data delivery path construction techniques been proposed, as a multicast tree
    has to prevent the concentration of communication loads to the specific node [25–29].
    In the ZIGZAG method, nodes construct clusters, and the multicast tree is constructed
    by the clusters [25]. The number of clusters included in each depth of a multicast
    tree is made the same, and thus, the loads are dispersed. Multicast trees are
    constructed only from information gained in the application layer, and it is not
    necessary to understand the physical network structure.


    In the MSMT (Mean Scheduled Maintenance Time)/MBST (Main Board Sleep Time) method,
    the concentrations of the communication loads are more prevented than the ZIGZAG
    method by considering the physical network structure [27]. However, the implementability
    of the MSMT/MBST method was poor because it is necessary to understand all the
    network structures between the nodes. In locality aware clustering (LAC), the
    loads are more dispersed than the ZIGZAG method by considering part of the nodes,
    though the physical network structure cannot be understood [28].'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'In the aforedescribed P2P stream delivery technique, the same data streams
    are assumed to be sent to a number of reception nodes. In the delivery of sensor
    data streams, however, the same sensor data stream is assumed to have different
    delivery cycles to be delivered. In this case, those sensor data streams are delivered
    as different data streams for each delivery cycle. Thus, the communication loads
    cannot be efficiently dispersed. On the other hand, our proposed methods consider
    the different frequencies or cycles of each data stream and construct delivery
    paths to efficiently collect them.


    As distributed stream data collection systems, an existing method to reduce the
    number of messages to receive data from large-scale nodes is to execute a range
    query on key order-preserving overlays. For example, “ SFB” [30] is an efficient
    way to construct tree structures for range queries. The data collection from publishers
    on a subscriber in TBPS corresponds to the execution of range query for nodes
    that have keys with a topic. It can reduce the number of messages by merging responses
    from nodes along the reverse path of the query delivery tree structure. However,
    this method loses the asynchronous real-time feature of TBPS. The latest sensor
    data is not delivered until the subscriber executes a range query. Once the tree
    structure is constructed, it can be reused, but the periodic execution of range
    queries is needed to catch up with the joins/leaves of publishers and subscribers.


    Some existing works address the “aggregation problem” on structured overlays.
    DAT [31] constructs a tree to aggregate data from distributed nodes using the
    Chord [32] overlay structure. DAT computes the aggregated value of all the local
    values, applying a given aggregation function on the distributed nodes. DAT can
    be used for data collections if the nodes execute the message merging function
    as an aggregation function. However, to merge and collect published messages,
    the publishers need to publish messages at exactly the same time, which is not
    a realistic assumption. Moreover, the aforementioned methods cause path concentration
    of data being forwarded on the nodes that are located close to the subscriber
    nodes on the overlay. In addition, once the tree structure is decided, it cannot
    be changed dynamically. As a result, a network process overload tends to occur
    on these nodes. On the other hand, our proposed ADCT method can construct a flexible
    collection tree and adaptively adjust the maximum overhead for the nodes to merge
    and forward messages.


    # 5.6 CONCLUSION


    The chapter gives information about the latest techniques of large-scale data
    collection schemes to the readers. We define continuous sensor data with different
    intervals (cycles) as a sensor data stream and described the techniques for TBPS
    systems called “CSF,” “ADCT,” and “PS.” Our experiment results show that our proposed
    method can reduce the loads of nodes and realize highly scalable systems to periodically
    collect distributed sensor data. The scalability of the data collection systems
    is significantly important to accommodate a huge number of objects and encourage
    the growth of the data science field.


    In future, we will try to clear the current limitations described in Section 5.4.
    More specifically, we will consider other information to determine the data forwarding
    paths such as data types, node performances, and security/privacy.'
