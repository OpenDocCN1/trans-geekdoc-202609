    scalability. Each broker corresponds to the network entity located physically
    close to each end device. The end devices correspond to IoT entities such as sensors,
    smartphones, and appliances.


    The broker can run on any networked computer that is located close to the end
    device. The computer can be a server at the distributed data center, a Wi-Fi access
    point with computing power, and a personal desktop computer. The model is compatible
    with the hierarchical cloud architectures recently proposed for IoT (the so-called
    “edge computing” architecture).


    A broker contains a subscriber or a publisher of a topic when one of the devices
    accommodated on the broker attempts to subscribe/publish to the topic. The brokers
    then construct an overlay network for message delivery on each topic. Each broker
    joins the overlay network to handle distributed message deliveries. The end device
    can be a broker if it is able to handle an overlay function. Hereafter, an entity
    that joins the overlay is referred to as a “node.” The node can be a publisher,
    a subscriber, or both. Brokers can contain multiple publishers or subscribers
    across different topics.


    # 5.2.1.2 Assumed Overlay for Distributed TBPS


    The article [10] proposed an SG-based TBPS (hereafter ST) method. ST constructs
    a “strong relay-free” topology on a key order-preserving structured overlay SG
    [9] to deliver pub/sub messages.


    The basic overlay structure for the distributed TBPS that we use in this study
    is the same as the existing ST method. The ST method can be applied to any key
    order-preserving structured overlay. As a key order-preserving structured overlay,
    we assume Chord# [14] is used. Figure 5.2 shows an example structure of Chord#
    and TBPS on it created by the ST method. In Chord#, each node is connected by
    bidirectional pointers at “level 0” in the order of the keys owned by nodes. The
    node with the minimum/maximum key has pointers to the node with the maximum/minimum
    key. Thus, the level 0 becomes a ring structure. Each node has multiple levels
    of pointers. The pointer on level 1 becomes a unidirectional pointer to the'
