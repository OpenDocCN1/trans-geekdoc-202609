    # 5.1 INTRODUCTION


    The Internet of Things (IoT) [1] has attracted greater interest and attention
    with the spread of network-connected small devices such as sensors, smartphones,
    and wearable devices. In the data science field, stream data generated from IoT
    devices are analyzed to get various information. A larger amount of data can lead
    to high-quality information as faster stream data collection is one of the main
    techniques in the data science field, and various schemes have been proposed.
    To enable IoT applications for data collection, pub/sub messaging [2] is considered
    to be a promising event delivery method that can achieve asynchronous dissemination
    and collection of information in real time in a loosely coupled environment. For
    example, sensor devices correspond to publishers, and IoT application corresponds
    to a subscriber. Topic-Based Pub/Sub (TBPS) protocols such as MQTT (Message Queuing
    Telemetry Transport) [3] and AMQP (Advanced Message Queuing Protocol) [4] are
    widely used by many IoT applications. These systems have a broker server for managing
    topics. The broker gathers all the published messages and forwards them to the
    corresponding subscribers.


    In IoT and Big Data applications, collecting all of the raw (unfiltered) sensor
    data is important for conducting various forms of analysis [5]. In this case,
    the larger the number of sensors treated on the application for analysis, the
    larger the number of messages that need to be received per time unit on the broker
    and subscribers in TBPS. For example, when there are publishers corresponding
    to a certain kind of sensor that publishes sensor data every 10s, the number of
    target sensors in an application is 10,000, and the broker must receive 1,000
    messages per second on an average. Thus, the number of messages received by the
    broker and subscribers tends to explode in IoT and Big Data applications. In general,
    the number of messages sent and received per unit time affect the network process
    load, because tasks such as adding/removing headers and serializing/deserializing
    payloads are required for each message. Therefore, even though the size of each
    sensor data is small, the increase in the number of publishers can cause network
    process overloads on the broker and subscribers. This leads to a loss of data
    or unusual increases in delivery latency problems that have an adverse effect
    on IoT and Big Data applications.


    Many existing studies tackle the problem of scalability in TBPS systems. The approach
    of these studies is based on distributed brokers in which brokers are run as peers
    in a peer-to-peer system. The brokers construct an overlay network among themselves.
    For example, there are Distributed Hash Table (DHT)-based'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'approaches [6,7], hybrid overlay approaches [8], and Skip Graph (SG)-based
    [9] approaches. These approaches can keep the number of connections that each
    broker needs to accept small by multihop message forwarding on overlays. However,
    the aim of these existing methods is to deliver messages from one publisher to
    multiple subscribers in a scalable manner. Thus, they are unable to avoid network
    process overloads caused by collection, such as when messages are received from
    a large number of publishers. In addition, the existing techniques do not assume
    different intervals at the same time to periodically collect data from publishers.


    Therefore, we define continuous sensor data with different intervals (cycles)
    as a sensor data stream and have proposed collection methods for distributed sensor
    data streams as a TBPS system [12,13]. Especially in [12], we have proposed a
    message forwarding scheme on overlays called “Collective Store and Forwarding”
    (CSF). The scheme can reduce a load of network processes dramatically when there
    are a large number of publishers (nodes), maintaining the delivery time constraints
    given for the messages. In addition, we have also proposed a flexible tree construction
    method called “Adaptive Data Collection Tree” (ADCT) on Chord# [14] that can adjust
    the maximum load of network processes on distributed brokers to avoid overloads
    caused by CSF. Moreover, we have proposed an expanded method assigning phase differences
    to balance the collection time among the same or specific collection cycle nodes
    [15]. We call this novel approach “phase shifting (PS).” The PS approach enables
    the SG method to decrease the probability of load concentration to the specific
    time or node. Assigning phase differences at random to the nodes, the collection
    times are distributed evenly if there are same collection cycle nodes.


    We have evaluated our proposed methods in simulation. Our experimental results
    show that our proposed method can reduce the loads of nodes and realize highly
    scalable systems to periodically collect distributed sensor data. The scalability
    of the data collection systems is significantly important to accommodate a huge
    number of objects and encourage the growth of the data science field.


    In the following, the data collection scheme for distributed TBPS is described
    in Section 5.2. The data collection scheme considering phase differences is described
    in Section 5.3. We describe the discussion and related work in Sections 5.4 and
    5.5, respectively. Finally, the conclusion of the chapter is presented in Section
    5.6.


