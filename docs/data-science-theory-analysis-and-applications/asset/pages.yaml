    \ which is described as follows.\n+   - $F$: $(q_1 * \\Sigma^* * \\Gamma_{old}\
    \ * \\Gamma_{new} * T) \\rightarrow q_2$, where $q_1, q_2 \\subset Q$ and Presentstate\
    \ = $q_1$ and Nextstate = $q_2$.\n+   - $T$ = Fixed time interval for changing\
    \ the states.\n\nIn the model of emotional state-transition machine, the “Neutral”\
