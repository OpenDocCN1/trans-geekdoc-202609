    making purchase decisions. However, in this new digital age where communication
    of individual’s opinions knows no bounds, the UGCs have dethroned the hoteliers
    from the role of travel opinion leaders [13]. Purchase involvement and service
    experience have also been identified as vital antecedents of review, providing
    motivation. A travel trip whether for recreational or work purpose is always followed
    by an experience felt or encountered'
