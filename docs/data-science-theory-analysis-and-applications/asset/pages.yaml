    # 9.3.1.3 Output/Classification Layer


    The last layer of ConvNet model is the output layer, which outputs the information
    regarding the class to which each instance learned by the previous belongs. In
    a nutshell, the output layer is a classification layer.


    # 9.3.2 TRAINING A CONVNET


    Training a ConvNet model requires a huge amount of data of very good quality.
    The presence of noise in the training dataset may hamper the performance effectiveness
    of the learning model and failed to achieve the desired expected output. Machines
    with high computational power are also a prerequisite for training deep learning
    models, as the emergence of a graphics processor unit greatly aids in wide popularity
    of deep learning. Training is normally performed by dividing the data into three
    subsets: training set used for the training; validation set used during the training
    to examine how accurate the model is on the unseen sample; and lastly, the testing
    set used after training to inspect the performance of the model. Thanks to the
    ImageNet Large Scale Visual Recognition Task (ILSVRC) introduced as an object
    recognition and classification benchmark in 2010 [35,36]. However, with limited
    database of images, it is now possible to train pretrained models via a concept'
