    # 10.4.6 COMPUTATIONAL COMPLEXITY


    In case of classification, training of dataset using SVM will execute with time
    complexity, which depends on both training set and support vector, and can be
    bounded by function n³ approximately, hence, O(n³). For state-transition process,
    the algorithm will run with linear time complexity O(n), for n input size, each
    input takes a constant time for execution.


    # 10.5 CONCLUSION


    In this chapter, we have done a comprehensive survey of various classification
    methods used in BCI research as well as investigated different emotional states
    of humans. SVM, KNN, and random forest are the techniques that we have been specifically
    interested in and worked on. The classification accuracy has been computed using
    the confusion matrix and different statistical parameters (sensitivity, specificity,
    prevalence, and precision). After comparing with other well-known models, we can
    conclude that our proposed model outperforms others. The classification process
    for a large number of nonlinear data using different SVM kernels and figures shows
    that the efficient kernel for emotion classification is the polynomial kernel.
    After achieving 90% accuracy in classification, we use the state-transition model
    for different emotional states. For performance analysis of the classifier, we
    have used a confusion matrix, and based on different parameters (sensitivity,
    specificity, prevalence, precision), we measure the accuracy and prediction of
    the classification'
