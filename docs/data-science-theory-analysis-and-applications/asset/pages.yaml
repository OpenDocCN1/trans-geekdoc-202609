    # 14.1 INTRODUCTION


    Understanding human emotions is a key area of research, since recognizing emotions
    may provide a plethora of opportunities and applications; for instance, friendlier
    human–computer interactions with an enhanced communication among humans, by refining
    emotional intelligence [1]. Recent research on experimental psychology'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'demonstrated that emotions are important in decision-making and rational thinking.
    In day-to-day communication, human beings express different types of emotions.
    The human communication includes verbal and nonverbal communication. Sharing of
    wordless clues or information is called as nonverbal communication. This includes
    visual cues such as body language (kinesics) and physical appearance [2]. Human
    emotion can be identified using body language and posture. Posture gives information
    that is not present in speech and facial expression. For example, the emotional
    state of a person from a long distance can be identified using human posture.
    Hence, human emotion recognition (HER) through nonverbal communication can be
    achieved by capturing body movements [3]. The experimental psychology demonstrated
    how qualities of movement are related to specific emotions: for example, body
    turning towards is typical of happiness, anger, surprise; the fear brings to contract
    the body; joy may bring movements of openness and acceleration of forearms; fear
    and sadness make the body to turn away [4]. Emerging studies show that people
    can accurately decode emotions and cues from other nonverbal communications and
    can make inference about the emotional states of others. A certain group of body
    actions is called as gestures. The action can be performed mostly by the head,
    hands, and arm. These cues together convey information of emotional states and
    the content of interactions. With the support from psychological studies, identifying
    emotions from human body movement has plenty of applications. Suspicious action
    recognition to alarm security personnel, human–computer interaction, healthcare,
    and to help autism patients are few of the application areas of automatic emotion
    recognition through body cues [5–6]. However, in the surveillance environment,
    facial view is not clear when the camera is too far from humans. This type of
    issue can be rectified by capturing body movements (head, hands, legs, center
    body) for recognizing human emotion. The emotions are hard to identify from complex
    body-motion patterns. The challenge is based on the cultural habit that humans
    can express different expressions for the same emotion. With the help of deep
    features, the human emotion can be predicted easily using feedforward deep convolution
    neural network (FDCNN).


    The following chapter is designed as follows. Section 14.2 briefly summarizes
    the related works. Section 14.3 explains the proposed work. Section 14.4 provides
    the experimental results. Finally, conclusions and future work are given.


