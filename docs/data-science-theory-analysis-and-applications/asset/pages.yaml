  md: 'support vector machine (SVM), and artificial neural networks (ANN). NB is a
    set of algorithms using Bayes’ theorem at grass-root level. It considers all the
    features to be independent of each other. DT organizes the testing conditions
    in a tree structure, where root and internal nodes represent different test conditions
    and their characteristics. RF is an ensemble model that considers many DTs at
    one time. The result from this model is usually better than the result from one
    of the individual models. SVM makes use of hyperplanes in a multidimensional space
    that divides cases of diverse class labels. It consists of regression and classification
    by making use of continuous and categorical variables. ANN comprises of layers
    of neurons, which convert an input vector into some output. Each unit takes an
