- pgno: 27
  md: 'a system behavior statistics on the interface. Usage of grid and list data
    structures to store the data may cause memory wastage. Also, processing the grid
    data structures requires more amount of time. The identification of object moment
    is very important in system, and variations may lead to major differences. Distributed
    profitable-area query (DISPAQ) is described in [12]. It identifies profitable
    areas from raw taxi trip data using PQ-index. Z-skyline algorithm prunes multiple
    blocks during query processing. But usage of predictive function increases the
    computation overhead, though it reduces the processing time for executing frequent
    queries. Performance can be improved by dividing the places into zones. Data mining
    is used to increase marketing of an educational organization in [13]. Authors
    used k-means algorithm to cluster the locations. Student residential address is
    calculated using latitude and longitude and visualized minimum, maximum, and average
    distance. Such visualization helps to improve the admission rate. Haversine formula
    is used to calculate the distance between the two locations. Their application
    can be used for 1,000–2,000 students. Authors of [14] used open shape-based strategy
    (OSS) to eliminate the computation related to the world boundary. It also reduces
    I/O (Input-Output) and CPU (Central Processing Unit) costs when compared with
    range query strategies (RQS) and is scalable than RQS for large datasets. However,
    OSS is more expensive than the filter operations in RQS. Direction of object plays
    an important role in the evaluation of queries. Surrounding join query, that retrieves,
    for each point in Q, all its surrounding points in P, is described in [15]. Even
    though the surrounding join query enriches the semantics of the conventional distance-based
    spatial join query, creating a VD (Visitor Database) requires a lot of processing
    time. Also, the pruning of unnecessary nodes in hierarchical algorithm requires
    more time, which can be avoided by starting only with necessary nodes.


    To summarize, the main drawback of the existing system is time complexity for
    processing large datasets. Our work mainly focuses on reducing the query response
    time by using hashed indexing and zones. Also, existing system has high time complexity
    for processing large geospatial datasets and usage of intermediate data. The usage
    of complex data structures to hold data leads to large processing times and requires
    complex infrastructures to handle. Visualization alone cannot help to perform
    analytics on the data that is handled by the system. Visualizing can be made fast
    and efficient using Tableau, as it handles different types of data and supports
    business analytics operations for generating automatic reports. Sharding techniques
    can be treated as an alternative to partitioning techniques, as such Range Sharding
    and Zone Sharding are used in our framework. We also made an attempt to determine
    which sharding performs well for geospatial query processing.


    # 1.3 PROPOSED SYSTEM


    This section presents a detailed architecture of GeoMongoSpark along with algorithms.
    Figure 1.12 presents the proposed GeoMongoSpark Architecture to perform geospatial
    querying, aiming at optimized query response time for spatial data analysis.


    Figure 1.13 presents a detailed flow chart of the sequence of steps for the Visualization
    of Geospatial Data. Initially, data is stored by passing the data to Zone Sharding
    and Range Sharding. The output of a geospatial can be converted to JSON format
    and can be given as input to a tableau for visualization.'
