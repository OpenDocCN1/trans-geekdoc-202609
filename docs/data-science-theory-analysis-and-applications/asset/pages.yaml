  md: '# 8.4.2 EVALUATION OF INTRINSIC DISORDER PREDISPOSITION


    The peculiarities of intrinsic disorder distribution within the amino acid sequences
    of proteins associated with BrS were analyzed by a set of commonly used per-residue
    disorder predictors, such as PONDR® FIT [30], PONDR® VLXT [31], PONDR® VSL2 [32],
    PONDR® VL3 [33], and two forms of IUPred suitable for prediction of short and
    long intrinsically disordered regions, IUPred_short and IUPred_long, respectively
    [34]. These predictors were selected based on their specific sensitivities to
    different features associated with intrinsic disorder. PONDR® VSL2 is one of the
    more accurate stand-alone disorder predictors [35–37], PONDR® VL3 is characterized
    by high accuracy for predicting long intrinsically disordered regions [33], PONDR®
    VLXT is known to have high sensitivity to local sequence peculiarities and can
    be used for identifying disorder-based interaction sites [37], whereas a metapredictor
    PONDR® FIT is moderately more accurate than each of the component predictors [30],
    PONDR® VLXT [31], PONDR® VSL2 [32], PONDR® VL3 [33], FoldIndex [37], IUPred [38],
    and TopIDP [39]. IUPred was designed to recognize intrinsically disordered protein
    regions (IDPRs) from the amino acid sequence alone, based on the estimated pairwise
    energy content [38]. We also analyzed mean disorder propensity for these proteins,
    calculated by averaging disorder profiles of individual predictors. Use of the
    consensus for evaluation of intrinsic disorder is based on the empirical observations,
    showing that such approach usually increases the predictive performance compared
    with the use of a single predictor [30,36,40]. In these analyses, predicted disorder
    scores above 0.5 are considered to correspond to the disordered residues and regions.


    # 8.4.3 DATA FILES


    The files were formed based on the different groups of proteins. There are proteins
    and mutated proteins associated with BrS located in the UniProt database [5] that
    are duplicated. In each case (Table 8.6), they are highlighted in the “duplicated
    protein” column and in the mutated proteins evaluated by the PIM system. The PIM
    losses sensitivity when identical sequences are input, for that reason, the identical
    sequences were eliminated from all protein groups described here.


    The sets of proteins, with which the BrS mutated proteins will be compared (Tables
    8.8 and 8.9), intend to establish (or discard) their functional similarity with
    respect to these groups, in order to characterize (by association) the BrS mutated
    proteins. The PIM system automatically measures the similarity between the target
    protein set and each of the proteins that is part of the other groups, and for
    this reason, it is important to know the preponderant function of proteins in
    the groups used for comparison. We think that it is logical to consider possible
    associations of BrS mutated proteins with the group of lipoproteins, and in addition,
    to establish, in a similar manner, some similarity with proteins from fungi, virus,
    and bacteria groups. Particularly, the bacteria group contains the SCAAP group,
    which, together with the lipoprotein group, has a similar mechanism of action
    to the BrS mutated proteins.'
