  md: 'Traditionally, solutions were in the form of strings of 0 and 1, but today
    they are implemented in other ways. The hypothesis begins with a completely randomized
    unique population and continues in generations. In each generation, the capacity
    of the whole population is evaluated; several individuals are selected in the
    random process of the current generation (based on competencies) and modified
    to form the new generation (fraction or recombination), and in the next repetition
    of the algorithm is converted to the current generation. The structure of the
    GA is as follows:


    A. Chromosome: A string or sequence of bits, encoded as a form, is a possible
    (appropriate or inappropriate) solution to the problem [9]. If binary coding is
    used, each bit can be one of the values of zero and one each of the bits of the
    chromosome of the recent problem is a potential solution to the problem variables.
    The basis of GA is to encode each set of solutions. This coding is called a chromosome.
    In fact, the encrypted form is a probable solution to the problem. In this case,
    each chromosome is a solution to a problem that can be justified or unjustified.


    B. Objective (fitness) function: A function whose value of the problem variable
    is placed, thus, the desirability of each solution is determined. In optimization
    problems, the objective function is used as a fitness function. The objective
    function is used to determine how people act in the problem boundary, and the
    fitness function is usually used to convert the value of the objective function
    into a dependent fitness value. In other words:


    F(n) = G(F(x)) (2.5)


    where f is an objective function, and the function G converts the value of the
    objective function to a nonnegative number, and F is the amount of fitness it
    relates to.


    The suitability or not of the solution is measured by the amount of the obtained
    objective function.


    C. The population size and the number of production: the number of chromosomes
    is called population size. One of the advantages of GA is that it uses parallel
    searches rather than traditional search methods. By definition, population size
    is the size of parallel searches [68,69].


    Genetic operators should be used to find a point in the search space. Two of these
    operators to generate children are Crossover and Mutation. Crossover operator
    is the main operator for generating new chromosomes in GA [70]. Like its counterpart
    in nature, this operator produces new people whose components (genes) are composed
    of their parents. Some types of intersecting operators are one-point crossover,
    two-point crossover, uniform crossover, etc. Mutation operator is a random process
    in which the content of a gene is replaced by another gene to produce a new genetic
    structure. Note that each repetition of the algorithm that leads to the creation
    of a new population is called a generation [71]. The flow chart of the GA is given
