    # ### 3.3 PROPOSED WORK


    In our algorithm, each location where the penguin jumps into is considered a feature
    or a dimension, and as the penguins dive to find the food, the penguins dive deep
    into the feature to check whether that particular feature is important or not
    or the amount of food or fish is ample or not. The results are shared among the
    other penguins once they come to the surface, and this search for finding the
    optimum result or the minimum number of features by which classification gives
    good results continues till the oxygen level depletes or the best features or
    best positions are found out by the penguins, i.e. [16], in terms of penguins
    places with the highest amount of fish or food. On the basis of these things,
    we have designed our algorithm.'
