    # 12.5 DISCUSSIONS AND CONCLUSION


    The series of experiments and findings gives strong empirical support to our quest.
    Our findings are robust and consistent across one real-life dataset, 20 extracted
    features, and three evaluation metrics (f-measure, recall, and precision). First,
    this chapter proposes a novel technique to extract features related to guest satisfaction
    or dissatisfaction from a big hotel review dataset of Tripadvisor.com. For feature
    extraction, the LSA of hotel reviews revealed sensible topics along with their
    relative weight determined through conversational power.


    Second, this study suggested a new guest satisfaction prediction model that utilized
    20 types of features, namely nightlife, value, amenities, natural beauty, guest
    experience (critique), recommendation, staff, guest experience (praise), the location
    of hotel, accessibility, car parking, visitor suitability (critique), satisficing,
    style and décor, bathroom, deals, visitor suitability (praise), hybrid, room experience,
    and high standards related to hotel guest satisfaction. The most exciting add
