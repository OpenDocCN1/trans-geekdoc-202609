    evaluation, thermal imaging, and LDI. Clinical evaluation that was characterized
    by nonuniformity when conducted with different surgeons/dermatologists relied
    heavily on the physical characteristics of the wound and sensitivity to touch,
    and hence it is the easiest and costless means of burn assessment. However, with
    clinical evaluation, diagnosing superficial burns and very deep dermal burn wounds
    is reported to be optimal but imprecise for intermediate burns. In total, clinical
    evaluation is only accurate in two-thirds of all evaluations. In addition, the
    authors lamented that biopsy is more accurate than clinical assessment and is
    the most accepted means in determining burn depth. However, it has its own disadvantages
    such as sampling error, where the biopsied wound might not be an actual representation
    of the burn site, it leaves scar on the body due to specimen extraction, it is
    painful, and the interpretation of the result is subjective (nonuniformity) by
    different histopathologists. As such, biopsy is considered to be more of a research
    technique. Furthermore, the authors [22] highlighted the use of tissue perfusion
    measurement in burn care units, starting with thermal imaging. Thermal imaging
    operates based on the idea that deeper wounds are cooler than shallow wounds.
    it is stated that deeper burn wounds are more than 2°C cooler than normal/healthy
    skin. Despite being simple and efficient with up to 90% accuracy, thermal imaging
    technique is carried out by directly in contact with the wound area, and this
    makes it inefficient to measure the whole burn area, as it only assesses a sample
    portion and remains painful due to contact with burn wounds.


