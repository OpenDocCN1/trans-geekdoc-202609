  md: 'until they stop to find out the food that they have. We have a predefined value
    of oxygen that is same for all the penguins in the beginning and end of each iteration,
    and the amount of oxygen gets reduced to a fixed value so that after a definite
    amount of time is complete, it brings an end to the series of iterations. This
    can also be considered as the number of generations our iteration will go on until
    an optimal solution is reached.


    # ### 3.4 RESULT ANALYSIS


    The implementation of the algorithm has been done on Python programming language
    using Anaconda as the software and on Jupiter notebook, and the experiments are
    tested on a computer with system specifications of 4 GB RAM, Intel i3 core Processor,
    and 500 GB hard disk memory. Seven real-world “UCI Machine Learning Repository”-approved
    datasets are used to assess the efficiency of our proposed algorithm [18]. Some
    of them have about 4–5 features and some have about 30–40 features, which make
    it appropriate for us to perform the feature subset selection. These datasets
    are also diverse in the context of number of classes and samples. These datasets
    have been represented in Table 3.1.


    These datasets include Ion, Pima, Iris, Vehicle, Wisconsin, Glass, and Wine. Using
    our proposed algorithm, i.e., FS-PeSOA, we have performed the feature subset selection,
    and then used KNN, Random Forest, and SVM classifiers to perform the classification.
    We have also tested the datasets using other algorithms like PCA and LDA, and
    then we compared the results hoping to get better performance.


    These are the UCI-approved datasets that have been used to check the efficiency
    of our algorithm. According to the UCI repository of machine learning [18], Iris
    is the flower dataset that is perhaps the best-known database to be found in the
    pattern recognition field. It has three classes and four attributes, and the attributes
    include sepal length, petal length, sepal width, and petal width. The classes
    are Iris Setosa, Iris Versicolour, and Iris Virginica.


    Ion dataset or ionosphere dataset is a collection of radar data collected in Goose
    Bay, Labrador. The system has a phased array of 16 high-frequency antennas with
    a transmitting power on the order of 6.4 kW, and the targets are free electrons
    that are present in the ionosphere. This dataset consists of 33 attributes and
    two classes, namely good radar and bad radar.


