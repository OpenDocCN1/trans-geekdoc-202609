- pgno: 273
  md: '# 11.3.4 Pixel Density


    Density features are calculated by applying a uniform grid over document images
    (see Figure 11.5). This consists of dividing the document images into a predefined
    number of cells having the same size as much as possible. For each cell, the pixel
    density corresponds to the ratio between the number of text pixels and the cell
    size.


    Density = \frac{Number of text pixels}{Number of pixels in the cell} \quad (11.9)


    In this respect, each cell is substituted by the density value. Then, the size
    of the density feature vector is equal to the number of cells.


    # 11.3.5 Run Length Feature


    RLF has been introduced for writer identification to approximate the shape of
    handwritten text [21]. Basically, RLF seeks text and background pixel sequences
    along the horizontal, vertical, and diagonal directions. For each direction, a
    (N×M) matrix is calculated, where N is the number of pixel values and M is the
    maximum possible run length in the corresponding image. Presently, all document
    images undergo a binarization step using Otsu method [22]. Thereby, P (N×M) is
    a two-line matrix. Figure 11.6 shows an example of an RLF calculation.


    To get the final feature vector, matrices are reshaped into normalized vectors
    that are subsequently concatenated to form the RLF vector.


    ![](img/5025594f89449de2a74e5b325b1e84ef_273_0.png)


    FIGURE 11.5 Pixel density features calculation using a uniform grid.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '![](img/5025594f89449de2a74e5b325b1e84ef_274_0.png)


    FIGURE 11.6 RLF feature calculation.


    # 11.4 MATCHING STEP


    The matching step consists in evaluating the similarity between the feature vector
    of the query document with feature vectors of all documents of a given database.
    In this stage, dissimilarity or similarity measures can be used. To calculate
    retrieval accuracies, similarities obtained for all referential documents are
    sorted from the largest to the smallest value, and in case of dissimilarities,
    from the smallest to the largest value. Table 11.1 reports the similarity and
    dissimilarity measures adopted in this work


    The matching process is carried out by calculating the dissimilarity between the
    query and all documents available in the reference dataset. Then, documents expressing
    highest similarities with the query are supposed to belong to the query writer.


    # 11.5 EXPERIMENTAL EVALUATION


    Experiments were conducted on a public dataset, which was proposed for writer
    identification contest organized in International Conference on Document Analysis
    and Recognition (ICDAR 2011). The original version of this dataset consists of
    208 documents written by 26 writers. Each writer contributed eight documents containing
    text in four languages (English, French, German, and Greek).1 A cropped corpus
    has been extracted by considering the first two lines'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# TABLE 11.1


    # Adopted Similarity and Dissimilarity Measures


    | Dissimilarity/Similarity Measure | Equation |

    |---|---|

    | Euclidean distance | $D_{Euclidean}(a,b)=\left(\sum_{i=1}^{n}|a_i-b_i|^2\right)^{1/2}$
    |

    | Manhattan distance | $D_{Manhattan}(a,b)=\sum_{i=1}^{n}|a_i-b_i|$ |

    | Canberra distance | $D_{Canberra}(a,b)=\sum_{i=1}^{n}\frac{|a_i-b_i|}{|a_i+b_i|}$
    |

    | Chi-square distance | $D_{\chi^2}(a,b)=\sum_{i=1}^{n}\frac{(a_i-b_i)^2}{b_i}$
    |

    | Cosine similarity | $D_{Cosine}(a,b)=\frac{a\cdot b}{||a||\,||b||}$ |

    | Jaccard distance | $D_{Jaccard}(a,b)=\frac{\sum_{i=1}^{n}(a_i*b_i)}{\sum_{i=1}^{n}a_i+\sum_{i=1}^{n}b_i-\sum_{i=1}^{n}(a_i*b_i)}$
    |


    a and b are two feature vectors, and n is the size of these vectors.


    of each document [23]. Figure 11.7 shows the samples from the original and cropped
    corpuses.


    # 11.5.1 EVALUATION CRITERIA


    Two typical performance measures for information retrieval systems are used. The
    first is the TOP-N precision, which is the most commonly used criterion [3,5,6].
    It corresponds to the percentage of correct documents among the N most similar
    documents to the query. Since each writer is represented by eight documents, we
    consider the retrieval from TOP-2 to TOP-7.


    The second criterion is the mean average precision (MAP). It allows a global evaluation
    of the Writer Retrieval system, since it considers the mean of the average precision
    (AP), which is calculated for all query documents. Considering only the ranks
    where documents are relevant, the AP is calculated as follows:


    AP = $\frac{\sum_{k=1}^{M}[P@k]\times rel(k)}{M}$ (11.10)'
