  md: '# 8.2.4 Kolmogorov–Smirnov Test


    **Motivation:** There are several statistical tests (parametric and nonparametric)
    that respond to the correlation between two or more samples. In particular, nonparametric
    tests do not presuppose a normal distribution. This is an advantage for the analysis,
    where it is not known what distribution would follow the "polar profile" of a
    protein. Within the nonparametric tests, two tests are equivalent and robust:
    Mann–Whitney U test and Kolmogorov–Smirnov test, but the last one is less demanding.
    The statistical two-sided test confirmed (with alpha = 0.01) that the proportion
    of proteins accepted/rejected by the PIM system correlates with the actual proportion
    of the groups of BrS proteins and BrS mutated proteins. This also provided support
    to the conclusion that the "polar profile" of each one of these groups contains
    group-specific features.


    # 8.3 DISCUSSION


    The nonsupervised PIM® can be implemented in parallel mode. Since it uses the
    master-slaves scheme, its processing time is drastically reduced to one-tenth
    of the corresponding CPU time of the methods utilizing the monopprocessor scheme.
    We were able to implement a version in CUDA (Compute Unified Device Architecture)
    language to be executed on NVIDIA microprocessors. This implementation is viable
    because the only element that resides in memory is the representative vector of
    the polar profile of the target protein and the protein whose function and/or
    structure is known from experimental studies. We believe that the PIM system constitutes
    a fortunate computational innovation, because its high-performance computing scheme
    corresponds to master-slaves, which substantially reduces the processing time,
    and from a biological point of view, its metrics use only a linear representation
    of the protein and not its three-dimensional structure, which effectively reduces
    the complexity in the programming in comparison with the metrics that acts in
    three-dimensional space. Another important consideration is the physicochemical
    nature of the only property assessed by the PIM system, the polarity, which represents
    the electromagnetic balance of a protein. This is one of the four major forces
    that affect matter.


    A distinctive "polar profile" was obtained for the set of BrS mutated proteins
    that discriminated the other protein groups analyzed in this study, including
    a set of 36 BrS proteins the BrS mutated proteins came from. When comparing the
    "polar profile" of BrS mutated proteins with the "reviewed" proteins from the
    UniProt database [5], it was identified that 6.4% of them share the same "polar
    profile".


    The metrics of the PIM system named "polar profile" only takes the polarity of
    a peptide or a protein and expresses that measure with 16 numbers as an incidence
    matrix, equivalent to the 16 possible polar interactions from {P+, P-, N, NP}
    × {P+, P-, N, NP}. A typical algorithm evaluating protein polarity (which is not
    PIM-based) generates a single real number to characterize the polarity status
    of a query protein. However, we assume that it is more precise when the algorithm
    uses 16 real numbers instead of a single one. It is possible that this particularity
    is what makes the PIM system effective; using the polar interaction with 16 values
    gives more representability to the amino acids and its physical properties at
    the molecular level. Therefore, our method can effectively identify a specific
    protein or find'
