- pgno: 233
  md: '![](img/5025594f89449de2a74e5b325b1e84ef_233_0.png)


    FIGURE 9.6 Description of a ResNet model.


    network. This provides the possibility of a stacking network with more layers,
    with increasing accuracy as shown in Figure 9.6.


    Skip connection was adopted after every few stacked convolution layers, which
    is represented by a shortcut path as shown in Figure 9.6. Mathematically, the
    resulting operation is represented by the following equation:


    y = f(z) + (z) = f(z) + z (9.1)


    The (z) function, which is a shortcut presented in Figure 9.6, allows the gradient
    to be maintained and gives an opportunity to train the network quicker and with
    more layers stacked, and f(z) is the output of the convolution layer (weight layer).
    The convolution layers may vary depending on the number of hyperparameters contained
    in each layer.


    Figure 9.6 shows that ResNet has two parts: the main part and the shortcut part.
    The main part comprises the regular convolution (weight layer) and activation
    (ReLU) layers, while the shortcut path is the input of the previous layer directly
    concatenated to the output of the subsequent layers. After concatenation, nonlinearity
    is applied as represented in the following equation: y′ = σ(f(z) + z), where σ
    is the activation operation (nonlinearity) after the elementwise operation, as
    depicted in Figure 9.6, and y′ is the output of the nonlinearity operation.


    # 9.4 GOALS AND METHODOLOGY


    The main goal is to investigate the use of ML techniques for recognition of burn
    wounds via the application of off-the-shelf learning model. The learning model
    is a pretrained model on objects classification, and it is proposed in this work
    to apply a particular model as feature extractor to extract discriminatory features
    contained in the images and classify them into healthy skin, superficial burn
    (first-degree burn), or full-thickness burn (third-degree burn) via the utilization
    of a classification algorithm.'
