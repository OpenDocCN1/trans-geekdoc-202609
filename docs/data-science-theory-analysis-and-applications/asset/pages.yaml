    This chapter aims to evaluate the satisfaction level of guests from a hotel review
    dataset obtained from Tripadvisor. We make use of overall star ratings as a proxy
    variable for guest satisfaction level of labeled data. First, topic modeling is
    applied with the help of LSA, which results in topics that represent the whole
    useful review information. Then, for measuring the satisfaction level, we make
    use of classifiers such as NB, DT, RF, SVM, and ANN, to check their accuracy using
