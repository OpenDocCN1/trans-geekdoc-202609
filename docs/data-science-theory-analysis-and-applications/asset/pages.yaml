  md: "# 11.3.1 **LOCAL BINARY PATTERN**\n\nThe term LBP was introduced by Ojala et\
    \ al. [10], which helps to determine the gray level distribution in the neighborhood\
    \ of each pixel. This is carried out by comparing the gray level value of the\
    \ central pixel with the neighboring gray levels. Precisely, the value of each\
    \ neighboring pixel is substituted by 1 or 0, as expressed in Equations (11.1)\
    \ and (11.2).\n\n$$\\mathrm{LBP}_{(P,R)}(x,y)=\\sum_{p=0}^{P}s(g_p-g_c)\\times\
    \ 2^p \\tag{11.1}$$\n\nWith\n\n$$s(l)=\\begin{cases}1 & l\\geq 0\\\\0 & l<0\\\
    end{cases} \\tag{11.2}$$\n\n$g_c$: Gray level value of the central pixel $P(x,y)$.\
    \  \n$g_p$: Gray value of the $p$th neighbor.\n\nThe LBP code is obtained by multiplying\
    \ the thresholded values with weights given by the corresponding pixels and summing\
    \ up the result, which replaces the central pixel value, as shown in Figure 11.2.\n\
    \nA major drawback of LBP is related to its variability towards small rotation\
    \ or illumination changes. To get rotation invariance within LBP, the rotation\
    \ invariant uniform LBP $\\mathrm{LBP}^{\\mathrm{riu}}$ was introduced in [11,12].\
    \ It is calculated according to the following equation:\n\n$$\\mathrm{LBP}^{\\\
    mathrm{riu}}(x,y)=\\begin{cases}\\displaystyle\\sum_{p=0}^{P}s(g_p-g_c), & U(P)\\\
    leq 2\\\\P+1, & \\text{otherwise}\\end{cases} \\tag{11.3}$$\n\n$U(P)$ is a uniformity\
    \ measure calculated as\n\n![](img/5025594f89449de2a74e5b325b1e84ef_270_0.png)\n\
    \n**FIGURE 11.2** LBP calculation in a 3 × 3 neighborhood."
  merge: -1
  img_proc: true
