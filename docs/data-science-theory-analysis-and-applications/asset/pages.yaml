- pgno: 232
  md: '# 9.3.3.2 GoogleNet


    GoogleNet by Szegedy et al. [40] from Google achieved a top five error rate of
    6.67% in 2014. The GoogleNet model has multiple convolution layers in each layer
    arranged in parallel, which was proposed and incorporated as inception layers,
    as shown in Figure 9.5. These convolution layers are equipped with variable sizes,
    and the outputs are concatenated to form a single input to the next layer. GoogleNet
    has 22 layers, which makes it a deeper network than any model proposed before
    it.


    # 9.3.3.3 VGGNet


    Similarly, the Visual Geometry Group (VGG) at the University of Oxford proposed
    a model and won a second place in the ILSVRC challenge in 2014 [31]. Two variants
    of this network (VGG-16 and VGG-19) were the best performing models and are very
    deep with a similar architectural design but different numbers of layers and uses
    smaller convolution filters (i.e., 3 × 3) compared with 11 × 11 filter sizes in
    AlexNet. VGGNet differs with AlexNet in the placement of pooling layers—AlexNet
    is stacked with pooling layer every convolution, while VGGNet uses a pooling layer
    after two or three convolution layers.


    # 9.3.3.4 Residual Network


    In 2015, Microsoft proposed a deep network called Residual Network (ResNet) [41],
    which is almost eight times deeper than VGGNet and won the first position on the
    ImageNet ILSVRC challenge, with an error rate of 3.57%. The unique feature of
    this network is the residual connection (shortcut connection). In a nutshell,
    shortcut connection (or rather in some context, skip connection) is the addition
    of input of the previous layer with an output of a lower layer, and the resulting
    value then passes through an activation function that serves as the input for
    the next layer down the


    ![](img/5025594f89449de2a74e5b325b1e84ef_232_0.png)


    FIGURE 9.5 Inception layer.'
