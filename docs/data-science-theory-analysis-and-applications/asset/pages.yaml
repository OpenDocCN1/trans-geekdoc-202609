  md: '# Metaheuristic-Based Neural Networks




    One of the differences between RBF and other ordinary network is their inputs.
    In the RBF network, the inputs of the transfer function are equal to the distance
    vector between weights and inputs multiplied by bias. The input values are sent
    to the hidden layer nodes by the input layers. Each node in the hidden layer is
    described by a transmission function f that transmits the input signals; in Figure
    2.3, the radial transfer function example is shown.


    For the pth input pattern, i.e., X^p, the Jth hidden node’s response, which means
    y_j, is equal to


    ```

    y_j = f{ ||X^p - U_j|| / (2 σ_j^2) }

    ```


    where |·| describes the Euclidean norm, σ is the RBF range, and U_j is the center
    of the jth RBF.


    The network output is achieved using the weighted linear sum of the hidden layer
    responses in each of the output nodes. The following equation illustrates how
    to obtain the output of the kth node in the output layer:


    ```

    Z_pk = \sum_{j=1}^L y_j w_kj

    ```


    In all of these models, there is a mathematical structure that can be graphically
    displayed and has a set of parameters and adjusting parameters. This general structure
    is adjusted and optimized by an algorithm of learning algorithms, which can display
    a proper behavior.


    ![](img/5025594f89449de2a74e5b325b1e84ef_49_0.png)'
