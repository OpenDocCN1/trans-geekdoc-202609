    # 5.4 DISCUSSION


    We described the data collection scheme for distributed TBPS and PS approach in
    Sections 2 and 3, respectively. Our experimental results show that our proposed
    method can reduce the loads of nodes and realize highly scalable systems to periodically
    collect distributed sensor data.'
