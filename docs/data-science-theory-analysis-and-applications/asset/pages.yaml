    CF is a group of model-based and memory-based algorithms used in recommender frameworks.
    The framework has provisions for using the rating matrix of a training data subset
    that consists of binary values. It is the binary options that are likened to sentiments
    gathered on products or services [16]. Besides the rating matrix commonly associated
    with collaborative filters, the comments that accompany the ratings often go unnoticed,
    because the emphasis is on the rating. At the same time, most of the CF techniques
    are beyond laboratory work, as most of them are already integrated into live systems
    to complete different recommendations tasks. As such, using CF to improve SA is
    a mutually benefiting prospect, because CF recommenders can use SA techniques
    for polarity classification, while SA can leverage the robust CF framework to
    improve its framework and applicability. In particular, CF systems grapple with
    cold start problem, because new users require some reference similarity index
    to generate recommendation, while SA can search, index, and annotate the information
    in the database using polarity classifiers, without requiring the historical information
    about the user [17].


