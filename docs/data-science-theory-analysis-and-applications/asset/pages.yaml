    The advantage of using LDI instead of visual assessment and histological means
    are as follows:


    +   - highly experienced personnel can diagnose superficial burns and full-thickness
    burns, but there are burns in between, such as burns at the dermis layer, which
    are very challenging to diagnose. LDI can do that more accurately than humans.

    +   - LDI can diagnose burns without any contact with the wound surface, thereby
    avoiding traumatic pains experienced by patients.


    # 9.2.4.2.2 Challenges of Using LDI for Burn Assessment


    However, despite the advantages offered by LDI over other techniques of burns
    assessment as highlighted in the previous sections, LDI has some underpinning
    factors. Some of these factors are summarized as follows:


    +   i. Studies have shown that, in the first 24-h postburn, the LDI assessment
    is very poor, which is found to be good after 2–5 days. Late assessment of burn
    wounds is inaccurate due to the healing process and the formation of new tissue
    (also known as granulation tissue).

    +   ii. The penetration power of laser light is limited by certain factors, such
    as blisters, cream, unremoved dead tissues, and coverings. Other factors that
    make burn evaluation so challenging include tattoos that were found absorb laser
    light [1,26] and natural skin pigment in a situation where it is bound to the
    dermis. However, natural skin pigmentation, in some cases, was found to be a noninfluencing
    factor because the pigment is detached along with the epidermis.

    +   iii. Patient sickness and some vasoactive medications have been discovered
    to affect LDI measurement. Vasoactive medications reduce blood flow and as such
    affect burn wound assessment using LDI. Similarly, sickness affects skin blood
    flow.'
