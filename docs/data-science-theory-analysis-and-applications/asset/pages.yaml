- pgno: 12
  md: '# WHAT TO EXPECT FROM THIS BOOK


    This book can prove useful to researchers, professors, research students, and
    practitioners as it will report novel research work on challenging topics in the
    area of data science as well as data analysis techniques. This book is useful
    to professors, research students, and practitioners, as it reports issues in data
    science theory and novel research work on challenging topics in the area of information
    design. It enhances the understanding of concepts and technologies in data science
    and discusses solutions and recent applications such as robotics, business intelligence,
    bioinformatics, marketing and operation analytics, text and sentiment analysis,
    healthcare analytics, etc.


    # WHAT NOT TO EXPECT FROM THIS BOOK


    This book is written with the objective to collect latest and focused research
    works in data science field in mind. The book does not provide detailed introductory
    information on the basic topics in this field, as it is not written in textbook
    style. However, it can be used as a good reference to help graduate students and
    researchers in providing latest concepts, tools, and advancements in data science
    field and related applications. The readers are required to have at least some
    basic knowledge about the field.


    # SPECIAL THANKS


    First of all, we would like thank our employer who gave us the time and encouragement
    in completing this book. We would also like to thank all the authors who contributed
    to this book by authoring read and focused chapters in the data science field.
    Their prompt responses, adhering to guidelines, and timely submission of chapters
    helped us in meeting the book preparation deadlines. A total of 47 authors from
    13 countries contributed to the development of this book. We hope that this book
    will prove beneficial to professionals and researchers, and at the same time,
    encourage in generating new algorithms, applications, and case studies in this
    multidisciplinary field.'
  merge: -1
  img_proc: true
