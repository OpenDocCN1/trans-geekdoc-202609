    +   - heartrate: Heart rate (beats/minute) (44–143)

    +   - glucose: Blood glucose level (mg/dL) (40–394)


    Ten-Year CHD: Currently have CHD (15%)


    After performing a frequency count analysis, we identified which risk factors
    were significant using chi-square tests for categorical variables and independent
    two-sample T-test for the continuous variables.


    There were eight continuous risk factors. Using the two-sample T-test, seven (totchol,
    sysBP, diaBP, BMI, glucose, cigsPerDay, age) of the eight risk factors were identified
    as significant factors for CHD. Only heart rate was not a significant factor for
    CHD in this dataset.


    Of the seven categorical variables, six (male, education, BPMeds, prevalentStroke,
    prevelentHyp, diabetes) were significant factors for CHD. Only currentSmoker was
    not a significant factor for CHD.


    Next, we checked to see if multicollinearity existed amongst continuous variables
    and found that diaBP and sysBP are highly correlated with a correlation value
    of 0.787 and a p-value of 0.000. This means that we need to exclude one of these
    two variables before running our predictive model. It does not matter which one
    we exclude. We have decided to exclude the diaBP variable.


    To overcome the imbalance (85:15) of the presence of CHD in the target classes,
    we will adjust the threshold from 0.5 (the default) to 0.85.


    # 7.5 MACHINE-LEARNING MODEL APPLICATION


    The logistic regression model was selected for use in this study because it is
    the most basic and robust classification algorithm. The logistic regression is
    a special type of regression where the binary response variable is related to
    a set of explanatory predictor variables that can be continuous or discrete. The
    logistic regression model is perfect for situations where the aim is to predict
    the presence or absence of a characteristic or outcome based on the values of
    a set of predictor variables [10]. The relationship between the target and input
    variables is not always a straight line, and so a nonlinear or logistic regression
    model is used. Furthermore, the logistic regression model was chosen as it required
    little running time compared with other complicated machine-learning algorithms
    and its output is also easy to interpret. As the dependent variable of the logistic
    regression model is binary, the dependent variable selected was “TenYearCHD” and
    was used to classify the patients.


    The main assumption for building a logistic regression model is that the independent
    variables do not have significant multicollinearity [11]. Initially, there were
    15 input variables. After multicollinearity was handled, we were left with 14
    input variables for our logistic regression model. As “diaBP” was highly correlated
    with “sysBP,” with a correlation value of 0.787 and a p-value of 0.000, it was
    necessary to remove one of the two variables (“diaBP,” “sysBP”), the diaBP variable
    was removed to overcome multicollinearity.'
