    There exist some latent dimensional variables that are a representation of large
    number of attributes, but the consumers might not explicitly mention. There occurs
    a need to introduce techniques to evaluate these collections (termed as documents)
    by sorting, probing, tagging, and searching by using computers. With the help
    of machine learning (ML), extant researchers have successfully proposed a model
    that finds a pattern of words in these documents under hierarchical probabilistic
    models. This is referred to as topic modeling. The rationale behind topic modeling
    is to identify the word-use pattern and how the documents portraying similar pattern
    should be connected. Under text analytics, the model makes use of bag-of-words
    concept and ignores the word ordering [23]. The topic modeling generally depends
    on the four methods, namely latent semantic analysis (LSA), probabilistic LSA
    (PLSA), latent Dirichlet allocation (LDA), and correlated topic model (CTM). The
    LSA, earlier known as latent semantic indexing (LSI), creates vector-based representation
    of texts to make semantic content, by making use of a predefined dictionary [24].
    PLSA automates document indexing based on a statistical model for factor analysis
    of count data, without referring to a predefined dictionary [25]. LDA is a Bayesian-based
    unsupervised technique for topic discovery in abundant documents, without considering
    any parental distribution [24]. CTM helps in discovering the topics in a group
    of documents, underlined by a logistic normal distribution [26].


    Another term that has gained popularity with the widespread use of internet technology
    is ML. ML is an algorithm that enables the systems to learn and predict automatically
    from previous experiments, without using any programming [27]. It is divided into
    two categories, namely supervised and unsupervised. Under supervised learning,
    the future events can be predicted with the help of labeled past data, whereas
    unsupervised learning does not require a labeled dataset [28]. However, if both
    types of data are available, then semisupervised learning is a good option. A
    key characteristic of ML is classification algorithms. Few popular classifiers
    adopted in this study are naïve Bayes (NB), decision tree (DT), random forest
    (RF),'
