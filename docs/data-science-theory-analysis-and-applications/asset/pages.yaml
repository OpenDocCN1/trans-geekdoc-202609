    \ of LDI is the expensive modality reported by [6].\n\n# 9.3 MACHINE LEARNING\n\
    \nML is a subset of artificial intelligence (AI) that provides how to make machines\
    \ intelligent and enable them to act like humans [27–29]. The terms AI and ML\
    \ are sometimes used interchangeably; however, the terms differ but with a strong\
    \ relationship. AI is a concept of making machines intelligent, while ML is a\
    \ technique of how to achieve AI. ML basically can be grouped into two main categories:\
    \ supervised ML and unsupervised ML. In supervised learning technique, machines\
    \ are trained with labeled data so as to learn to map an input data with the corresponding\
    \ output. The labeled data means a known data (i.e., a problem at hand with the\
    \ known solution), and the idea is to enable machines to learn the relationship\
    \ between data and output by learning unique representations that associated the\
    \ input with the output. The goal is to enable accurate prediction of unseen data\
    \ when presented to the machine without human intervention. The process of learning\
    \ that involves only input data with no output information is called unsupervised\
    \ learning. In this type of learning, machines are allowed to figure out and group\
    \ data based on the similarity of representations. Unsupervised learning is considered\
    \ more of true AI by some researchers than supervised learning approach, because\
    \ during the learning process, there is complete absence of human intervention\
    \ to guide the learning process. Some examples of supervised ML algorithms are\
    \ support vector machines (SVMs) and artificial neural networks, while clustering\
    \ is an example of unsupervised learning strategy.\n\nNeural network has remained\
