    # 2.5 OPTIMIZATION


    The main purpose of optimization is to find the best acceptable solution, given
    the constraints and requirements of the problem [58,59]. For a problem, there
    may be several different answers that are defined to compare them and select an
    optimal answer, a function called a fitness (cost) function.


    How to choose a fitness function depends on the nature of the problem. For instance,
    consumed time or cost is one of the common goals of optimizing transportation
    networks. However, selecting an appropriate fitness function is one of the most
    important steps in optimization.


    Sometimes, in optimization, multiple objective functions are considered simultaneously,
    which are called multiobjective optimization problems [60,61].


    The simplest way to deal with these problems is to form a new objective (fitness)
    function as a linear combination of main objective functions, in which the effect
    of each function is determined by the weight assigned to it. Each optimization
    problem has a number of independent variables, which are called design variables,
    which are represented by n dimensions of vector x. The purpose of optimization
    is to determine the design variables in such a way that the objective function
    is minimized or maximized.


    Optimization problems are divided into two main categories:


    +   1. Unconstrained optimization problems: In these problems, the maximization
    or minimization of objective function is without any constraints on the design
    variables.

    +   2. Constrained optimization problems: Optimization in most applications is
    subject to limitations; constraints on the behavior and function of a system,
    and the behavioral limitations and constraints that exist in the physics and geometry
    of the problem are called geometric or lateral constraints.


    Equations representing constraints may be equal or unequal, and in each case,
    the optimization method is different. However, constraints determine the acceptable
    design area. The optimization process can be considered in the following stages:


    Problem formulation: At this stage, a decision problem is defined along with a
    general structure of it. This general structure may not be very accurate but states
    the general state of the problem, which includes the input and the output factors
    and the objectives of the problem. Clarifying and structuring the problem may
    be complicated for many optimization problems [62–64].


    Problem modeling: At this stage, a general mathematical model for the problem
    is constructed. Modeling may help with similar models in the subject’s history.
    This step resolves the problem to one or more optimization models.'
