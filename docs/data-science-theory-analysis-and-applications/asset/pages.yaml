- pgno: 59
  md: '![](img/5025594f89449de2a74e5b325b1e84ef_59_0.png)


    # FIGURE 2.7 Schematic diagram of how to adjust an MLP by metaheuristics.


    Generally, the gradient descent algorithm is utilized for obtaining the minimum
    value for the BP network. This algorithm includes a very important problem: trapping
    into the local minimum. This drawback is totally dependent on initial (weight)
    settings. One of the advantages of the metaheuristic algorithms is to escape from
    the local minimum based on its exploration characteristics.


    For optimizing the weights of the network, ANN is first trained using a metaheuristic
    algorithm to find the optimal initial weights. Afterward, the neural network is
    trained by using a BP algorithm that includes an optimal BP network.


    The mean squared error of the network (MSE) that should be minimized using metaheuristics
    is given later:


    $$MSE = \frac{1}{2}\sum_{k=1}^{g}\sum_{j=1}^{m}\left(Y_{j}(k)-T_{j}(k)\right)^{2}\tag{2.8}$$


    where m describes the number of nodes in the output, g is the number of training
    samples, Yj(k) is the desired output, and Tj(k) defines the real output.


    The main purpose of image segmentation based on the optimized neural network in
    different input images is to categorize all of their pixels into some considered
    classes for simplifying the feature extraction, classification, etc. into the
    next level.


    In the image segmentation based on supervised techniques, we have to first network
    based on several different samples with their solutions (subject with its label).
    After this learning, the neural network starts the optimal learning process based
    on adjusting its weights according to the illustrated methodology. Afterward,
    the neural network has the ability to classify an input image based on its learning.
    Figure 2.8 shows the steps of image segmentation based on a supervised technique.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '![](img/5025594f89449de2a74e5b325b1e84ef_60_0.png)


    FIGURE 2.8 Steps in supervised image segmentation.


    # 2.8 EXPERIMENTAL SETUP AND METHOD ANALYSIS


    In this research, two-fold image segmentation (binarization) is considered for
    testifying. For analyzing this technique, based on pixel classification, two different
    databases are analyzed:


    +   1. Australian Cancer Database (ACD), a well-known and widely used skin cancer
    database [79].

    +   2. United State Department of Agriculture (USDA) [80] and the Canadian Food
    Inspection Agency (CFIA) [81] are the two more popular datasets used for the quality
    inspection of potatoes.


    The purpose of the proposed method for the first database is to detect cancer-like
    pixels from its healthy pixels, and the purpose of the proposed method for the
    second and third database is to separate the defected parts of potatoes from its
    healthy parts.


    The input layer of the network considered three neurons from each image as either
    cancer (defected) or noncancer (healthy). In this analysis, a sigmoid function
    is utilized as an activation function for the optimized MLP network. The output
    generated a pixel with intensity between 0 and 255. Because of using sigmoid function
    and for achieving a two-fold output, a single threshold value is applied to the
    image. In the following, some examples of the proposed technique based on ICA
    algorithm are shown in Figure 2.9.


    As it is clear, using the proposed technique can generate a strong method for
    image segmentation. It is important to know that, in this part, there is no postprocessing
    (like morphology) for it.


    For analyzing the accuracy of three optimization algorithms, CDR, FAR, and FRR
    are evaluated. CDR defines the correct detection rate, and FAR defines the false
    acceptance rate which is the percentage of identification moments in which false
    acceptance happens, and FRR is the false rejection rate that describes the percentage
    of identification moments in which false rejection happens. In the following,
    the formula for achieving each of this index is given.


    CDR = No. of pixels correctly classified / Total pixels in the test dataset (2.9)'
  merge: -1
  img_proc: true
