    For whatever purpose the healthcare analytics is applied, the key outcome is the
    same: The process of solving a healthcare problem using relevant data and turning
    it into insights is by providing the clinician with the knowledge he or she needs
    to make clinical decisions. So what is healthcare analytics? Essentially, healthcare
    analytics is a seven-step process, outlined as follows.


    # 7.3.1 Step 1. Defining the Healthcare Problem


    This stage involves understanding what the clinician would like to improve or
    investigate. Sometimes, the goal is broken down into smaller goals. Relevant data
    needed to solve these healthcare goals are decided by the hospital stakeholders,
    expert clinicians, and healthcare analysts. At this stage, key questions such
    as, “which patients are at high risk of dying?,” “how can we reduce patient mortality?,”
    “what are the factors that contribute to patient mortality?,” “what healthcare
    and patient data are available?,” “how can we use this healthcare and patient
    data?,” and “do we have sufficient patient data?” are considered.


    # 7.3.2 Step 2. Explore the Healthcare Data


    This stage involves cleaning the healthcare and patient data, making statistical
    computations for handling missing healthcare and patient data, removing outliers,
    and transforming combinations of input data variables to form new data variables.
    We usually plot time-series graphs, as they are able to indicate any patterns
    or outliers in the data. The removal of outliers from the healthcare dataset is
    a very important task as outliers often affect the accuracy of the model results.
    If the analyst does not remove the outliers, we may have a case of “Garbage in,
    garbage out (GIGO)”! Once the analyst has cleaned the healthcare data, the analyst
    will then visualize the data as data visualizations that make it easy to understand
    the results of the patient profiles and treatments. Data visualization also helps
    the analyst to identify outliers and patterns in the patient data that can point
    to appropriate data analytics techniques for analysis and patient risk modeling.
    Next, the analyst will summarize the patient data using descriptive statistics
    (such as mean, standard deviation, range, mode, and median) that will help provide
    a basic understanding of the patient data and the different patient profile groups.
