  md: 'Finally, the queries BI 3 and BI 21 slightly worsened. Rewriting these queries
    included aggregation functions like SUM or additional structures like lists in
    order to force Neo4j to execute them on main memory instead of processing them
    on hard disk. We think that our strategy cannot decrease the runtime because all
    the operations could be easily performed on the main memory.


    To statistically validate our results, statistical tests were performed to determine
    whether the execution times of the queries on a database in which we apply physical
    design represent a significant improvement with respect to execution times on
    a database without physical design. First, we determine whether the resulting
    execution times for both possibilities (with or without physical design) follow
    a normal distribution performing a Shapiro–Wilk test [15]. According to Shapiro–Wilk
    test [15], the execution times obtained in our experiments (samples) can be considered
    to follow a normal distribution when their p-value is greater than α = 0.05. The
    p-value is a measure of statistical significance that represents the probability
    of obtaining, by likelihood or chance, a difference as large or greater than that
    observed, meeting that there is no real difference in the population from which
    the samples come. It is usually established that if this probability value is
    less than 5% (0.05), it is sufficiently unlikely to be due to the chance to reject
    with reasonable certainty our initial hypothesis, and thus, it affirms that the
    difference is real. If it is greater than 5%, we will not have the necessary confidence
    to deny that the difference observed is the work of chance.


    According to the results obtained from the Shapiro–Wilk test, there is at least
    one of the execution times whose p-value is lower than α = 0.05, and therefore,
    there is a statistical significant evidence that the execution times (samples)
    do not follow a normal distribution.


    As a consequence of not having data that follow a normal distribution, we proceed
    to apply a test that does not require this condition. The Wilcoxon signed-rank
    paired test [16] is a nonparametric test that allows to compare the means of the
    two related samples, i.e., average of the query execution times on the initial
    database without physical design and the average of the query execution times
    on the database with physical design. After performing this test, the resulting
    p-value is 0.006836, and thus, we can statistically conclude that, with a significance
    level of 0.05, the mean of the query execution time on a 1 GB database without
    physical design is significantly higher than the mean of the query execution time
    on a 1 GB database with physical design.


    In addition to runtime, we also report the DB Hits in Figure 4.11. The X axis
    contains the query identifiers, and the Y axis corresponds to the DB Hits normalized
    in the range (0, 1). Also, Table 4.2 includes the percentage of improvements in
    DB Hits for each query.


    We do not apply statistical tests because the DB Hits are invariant. It can be
    noted in Figure 4.11 and Table 4.2 that the results of the DB Hits are similar
    to the execution time. However, we can observe that the DB Hits improve for the
    queries BI 3 and BI 21. Since a DB Hit is an abstract unit, it is possible that
    the execution time has been impacted by the computer configuration instead of
    the actual design strategy applied to improve the query performance.'
