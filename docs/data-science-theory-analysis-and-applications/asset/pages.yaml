- pgno: 58
  md: '![](img/5025594f89449de2a74e5b325b1e84ef_58_0.png)


    FIGURE 2.6 Flow chart of the ICA.


    where K is a predefined function like the sigmoid function. A good vision for
    simplifying the collection of functions g_i is to assign them as a vector of g
    = (g_1...g_n).


    As explained earlier, BP method is one of the widely used methods for solving
    feedforward networks. It calculates the error on all training pairs and adjusts
    its weights to achieve an optimal solution for the desired output. It will be
    performed in several iterations to achieve the optimal solution and the minimum
    value of error for the training set.


    After the training step, the network with optimal values of weights is prepared
    for validation test and utilization. A schematic diagram of how to adjust an MLP
    by metaheuristics is shown in Figure 2.7.'
