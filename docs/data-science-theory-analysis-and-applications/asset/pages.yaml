  md: '# 10.1 INTRODUCTION


    In the human world, emotion plays a vital role for successful communication. Ability
    to understand the emotional states of a person whom we are communicating with
    comes to humans naturally. But that is not the case with machines. Whenever we
    think about machine communication, we assume its artificial machine tone and lack
    of mutual rapport. However, considering the explosion of machines in our recent
    lives, there should be no hesitation to admit that any interface that disregards
    human affective states in the interaction will appear cold and socially inept
    to users. To approach the effective human–machine interaction, one of the most
    important prerequisites is a reliable emotion recognition system that stands tall
    in some parameters like recognition accuracy, robustness against any artifacts,
    and adaptability to practical applications. Emotion recognition is performed by
    classifying emotional features measured from the implicit emotion channels of
    human communication, such as speech, facial expression, gesture, pose, physiological
    response, etc. The first kind of approach revolves around the analysis of facial
    expression or speech [1–3]. However, these techniques can be made a victim of
    deception. Peripheral physiological signals provide the basis for another kind
    of approach. Changes in the autonomic nervous system in the periphery, such as
    electrocardiography (ECG), skin conductance (SC), respiration, and pulse can help
    us in detecting changes in the emotional state [4–6]. This is a more detailed
    and complex technique than audiovisual-based techniques.


    The second kind of approach focuses on brain signals captured from the central
    nervous system (CNS), such as electroencephalography (EEG), where electrodes are
    placed at different regions on the skull, which measure how active the part of
    the brain is using voltage fluctuation (Figure 10.1), electrocorticography (ECoG),
    and functional magnetic resonance imaging (fMRI). Among these, EEG signals have
    proven to be more informative about emotional states.


    ![](img/5025594f89449de2a74e5b325b1e84ef_244_0.png)


    FIGURE 10.1 Electrode placement.'
