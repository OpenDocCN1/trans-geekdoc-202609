    public datasets. Learning the features continuously without any labels from the
    streaming video is a challenging task. Hasan and Roy-Chowdhury [57] addressed
    this type of problem using an unsupervised deep learning model. Most of the action
    datasets have been recorded under a controlled environment; besides, action recognition
    from unconstrained videos is a challenging task. A method for human action recognition
    from unconstrained video sequences was proposed by Ballan et al. [58] using DBNs.
    Unsupervised learning played a pivotal role in reviving the interests of researchers
    in deep learning.


    # 14.3.2.2 Discriminative/Supervised Approaches


    The CNN is the most frequently used model from the supervised category. CNN [56]
    is a type of deep learning model that has shown better performance at tasks such
    as image classification, pattern recognition, human action recognition, handwritten
    digit classification, and HER. The multiple hidden layers present in the hierarchical
    learning model are used to transform the input data into output categories. Its
    architecture consists of three main types of layers:


    +   a. Convolutional layer

    +   b. Pooling layer

    +   c. Fully connected layer


    The mapping back of different layers of CNN is called as Deconvnets. The objects
    in the images are represented and recognized using deep CNN models [59]. This
    author proposed spatial and temporal streams of CNN for action and emotion recognition.
    These two streams combined and outperformed better results than the other methods.
    RNN is the other popular model among the supervised category. The skeleton-based
    action and emotion recognition using RNNs are developed by this author [60]. The
    five parts of the human skeleton were separately fed into five subnets. The output
    from the subnets were combined and fed into a single layer for final demonstration.
    For the training process, deep learning-based model need a large size of video
    data. Collecting and annotating large size of video data require enormous computational
    resources. An outstanding accuracy has been achieved in many application fields.


    # 14.3.3 CONVOLUTIONAL NEURAL NETWORK


    The CNN has six components [27]:


    # 14.3.3.1 Convolutional Layer


    The process of convolution has four Steps. Figure 14.2 shows the architecture
    of an FDCNN model.


    +   - Line up the feature and image.

    +   - Multiply each image pixel by its corresponding feature pixel.

    +   - Add the values and find the sum.

    +   - Divide the sum by the total number of pixels in the feature.'
