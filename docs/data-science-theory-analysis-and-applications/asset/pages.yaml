    between Person and Movie. Not all nodes of a given type have to be in any of the
    relationships shown in the schema of Figure 4.1.


    In addition, consider a query to find information about the matrix movie. We can
    specify this query in Cypher language, as is shown in Figure 4.2.


    The query in Figure 4.2 was executed and its execution plan retrieved by Neo4j
    is presented in Figure 4.3. We can observe in Figure 4.3 that the first operator,'
