    # 1.5 CONCLUSION


    GeoMongoSpark added geospatial query processing that works as an effective storage
    and retrieval system. Using shard key during storage and retrieval helped in faster
    data access. Integrating Spark and MongoDB made us to process spatial query data
    stored in MongoDB without having to move data into Spark environment. Geohash
    helped to shard data, thereby improving query performance. When the shard key
    is appended with a geospatial query, mongos routes the query to a subset of shards
    in the cluster. Three benchmark datasets are used for experimenting on a variety
    of queries and two sharding techniques. GeoMongoSpark performance is compared
    with GeoSpark, SpatialSpark and Stark. Performance is also compared for different
    k values (10, 20, 30) for k-NN and k-NN join query. Results of geospatial queries
    are visualized using tableau. Zone sharding proved to be better than Range sharding.


    The future work is to setup multinode configurations for Spark, which can produce
    the best results for processing large spatial datasets. An effective searching
    technique such as geoIntersect, geoWithin, and nearSphere is still required to
    perform join on fuzzy domains (when a search point belongs to more than one domain).
    Such searching technique can be used in applications such as Telecom industry
    to implant cell towers and also in tourism and development industries. Our future
    work also concentrates on building machine learning model using Scala. Sharding
    technique can be treated as an alternative to partitioning techniques, but it
    poses several drawbacks such as operational complexity, single point of failure,
    etc.'
