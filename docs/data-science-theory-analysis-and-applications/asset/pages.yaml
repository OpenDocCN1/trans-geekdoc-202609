    # 7.7 CONCLUSION


    The logistic regression model was used to identify which patients are likely to
    be at high risk of CHD. The outcome from this study confirms first that machine-learning
    techniques, such as logistic regression technique, can be used to classify patients
    as high-risk CHD patients.


    Further, from 15 risk factors, five risk factors were identified as CHD indicators.
    Age was the most important risk factor, the older the patient, the more likely
    they were at risk of a CHD. Male patients were found to have a higher risk of
    CHD than females. Systolic blood pressure was a significant factor, indicating
    that diastolic blood pressure can also be seen as a significant factor as systolic
    blood pressure and diastolic blood pressure were highly correlated. So, patients
    with high blood pressure (hypertension) have a high risk for CHD. Lastly, cigsPerDay
    was also a significant risk factor for CHD, the more cigarettes a patient smoked,
    the more likely they were at risk of CHD.


    # 7.8 FUTURE DIRECTION


    Data analytical techniques, particularly machine-learning techniques, can be very
    valuable for clinicians, as these techniques can accurately identify which patients
    are high-risk CHD patients and require treatment that can reduce their risk of
    CHD or prevent them from getting a heart attack. The coronary risk factor model
    can be used by clinicians as a CDS tool (CDST). The CDST can serve as a good guide
    for the clinicians when diagnosing patients by providing the required support
    and confidence to the clinician when decisions about the patient’s risk of a heart
    attack have to be made.'
