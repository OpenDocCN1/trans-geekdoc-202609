    The analyst will also perform simple regression analysis to see whether simple
    predictions can assist with clinical decision-making. At this stage, the analyst
    is already looking for general patterns and actionable insights to achieve the
    healthcare analytics goal.


    Two very important checks that need to be done before the modeling stage are as
    follows:


    +   1. Check whether two or more variables are highly correlated with each other
    (multicollinearity). If there are two or more variables highly correlated with
    each other, only one of these variables need to be included in the model. If the
    highly correlated variables are not removed, some of the model coefficients will
    have the wrong coefficient sign or extremely high values or extremely low values.
    In other words, some of the model coefficients will likely be unreliable if multicollinearity
    is not removed.

    +   2. Check whether the target variable classes are balanced. Class imbalance
    problems are quite common in clinical applications. Let us consider an example
    that demonstrates the class imbalance problem where the clinical dataset has 5%
    of patients with heart disease and 95% of patients without heart disease. The
    model may have an overall accuracy of close to 100% and the specificity () metric
    close to 100%, while the sensitivity (measures the ratio of the number of actual
    heart disease patients that are correctly identified) metric is less than 20%.
    This clearly demonstrates that the clinical model is not good because we are more
    interested in a model that can accurately predict the heart disease cases (which
    is the minority class in this example).


    To overcome the imbalance problem, the bagging and oversampling techniques may
    be used.


    Once the multicollinearity and imbalance have been removed, depending on the healthcare
    analytics goal, the analyst may choose to perform predictive or classification
    modeling.


    # 7.3.3 Step 3. Predict What Is Likely to Happen; or Perform Classification Analysis


    Healthcare analytics is about being proactive in decision-making. At this stage,
    the analyst will model the healthcare data using machine-learning techniques that
    include decision trees, neural networks, and logistic regression. These techniques
    will uncover insights and patterns that highlight relationships and “hidden evidences”
    of the most influential variables.'
