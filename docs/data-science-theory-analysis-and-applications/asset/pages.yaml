  md: 'all metaheuristic optimization algorithms. But in this algorithm, in addition
    to the initial random location of particles, a value is also allocated for the
    initial particle velocity. The initial propagation range for particle velocity
    can be extracted from the following equation.


    $\frac{X_{\min} - X_{\max}}{2} \le V \le \frac{X_{\max} - X_{\min}}{2}$ (2.6)


    Step 2: Selecting the number of primary particles: increasing the number of primary
    particles reduces the number of iterations needed to converge the algorithm. But,
    sometimes, it is observed that users of the optimization algorithms assume that
    this reduction in the number of iterations means reducing the program execution
    time to achieve convergence, while such an idea is completely wrong.


    However, an increase in the primary number reduces the number of iterations. However,
    an increase in the number of particles makes the algorithm to spend more time
    in the particle evaluation stage, which increases the time of evaluation so that
    the algorithm''s execution time does not decrease, until the convergence progresses
    despite a decrease in the number of iterations.


    Step 3: Evaluate the objective function of particles: at this stage, we must evaluate
    each particle, which represents a solution to the problem under consideration.
    Depending on the problem under consideration, the evaluation method will be different.
    For example, if it is possible to define a mathematical function for a target,
    by simply inserting the input parameters (extracted from the particle position
    vector) in this mathematical function, the cost of this particle will be easily
    calculated. Note that each particle contains complete information about the input
    parameters of the problem, which is extracted from this information and is in
    the objective function.


    Step 4: Convergence test: the convergence test in this algorithm is similar to
    other optimization algorithms. There are different methods for examining the algorithm.
    For instance, it is possible to determine the exact number of repetitions from
    the beginning, and at each step, it was checked whether the number of iterations
    reached the specified value or not. If the number of iteration is smaller than
    the initial value, then you must go back to Step 2. Otherwise, the algorithm ends.


    Another method that is often used in the convergence test of the algorithm is
    that, if in the successive iteration, for example, 15 or 20 iterations, no change
    in the cost of the best particle is created, then the algorithm ends; otherwise,
    you need to return to Step 2.


