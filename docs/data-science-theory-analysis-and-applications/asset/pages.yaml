  md: '# 8.4.4 Kolmogorov–Smirnov Test


    The Kolmogorov–Smirnov two-sided test (alpha = 0.01) [58] was applied to the BrS
    proteins (36 proteins) and the BrS mutated proteins (4,388 proteins), counting
    the number of matches and rejections produced by the PIM system. The Excel file
    and Kolmogorov–Smirnov test related to these proteins can be found in the Supplementary
    Materials section.


    # 8.4.5 Test Plan


    # 8.4.5.1 Polar Profile


    The PIM system implements two procedures to characterize the mutated proteins
    associated with BrS. It registers the number of similarities (see Section 8.4.1.2)
    to identify the BrS protein group (Table 8.6) and compares it with the other groups
    (Tables 8.7 and 8.8). For instance, if the PIM system is calibrated with the unique
    BrS mutated proteins, it is tested with the unique groups of BrS proteins (Table
    8.6), antimicrobial proteins (Table 8.8), disordered proteins, and lipoproteins
    (Table 8.9). This computational test generates false positives and false negatives.
    In addition, the “polar profiles” of unique proteins and mutated proteins associated
    with BrS are also compared (Figure 8.2). At this stage, the “polar profile” representative
    of the unique mutated proteins associated with BrS is obtained and, with this
    information, the PIM system looks for the coincidences of this “polar profile”
    with the “polar profiles” generated for the total reviewed proteins registered
    in the UniProt database [5].


