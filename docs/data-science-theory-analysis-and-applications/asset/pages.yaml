    # 14.3 LEARNING


    Artificial intelligence is executed by machine learning technique. Learning is
    considered to be an important aspect for intelligent machines. In artificial intelligence
    research, a machine teaches to detect various patterns using machine learning
    patterns. Conventional machine learning techniques have the expertise to design
    a feature extractor that transformed the raw data into a feature vector to detect
    or classify patterns in the input data. Deep learning is a dedicated form of machine
    learning. The technique that instructs computers to do some operation and behave
    like humans is done by machine learning. From the input data, a machine learning
    task starts the feature extraction process. The features are fed to a model that
    classifies the objects in the image. Learning feature hierarchies are produced
    by combining low-level and high-level features [36]. In the deep learning model,
    features are automatically extracted from input data. Learning features are automatically
    set by several levels of abstraction. The numerous applications to machine learning
    techniques are increasing at an enormous rate. Figure 14.1 explains the learning-based
    approaches. It has the following two types of approaches.


    Deep learning has emerged as a popular approach within machine learning. The traditional
    handcrafted feature-based approach and deep learning-based


