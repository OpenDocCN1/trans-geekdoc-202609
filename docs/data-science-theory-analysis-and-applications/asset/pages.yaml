  md: '# 7.3.4 Step 4. Check the Modeling Results


    At this stage, the analyst will then evaluate how good the machine-learning model
    is, using metrics such as overall accuracy, recall, specificity, and AUC. Usually,
    the analyst will explore several machine-learning models and then select the best
    performing model based on the model evaluation results.


    Check the modeling results stage involves checking that the model results are
    reasonable and then to evaluate the performance of the clinical prediction models.
    This is an important stage because if the following checks are not performed,
    it is highly likely that the model coefficients are not at all acceptable, and
    taking action using incorrect model coefficients can result in grouping patients
    in wrong patient profile groups, and therefore, treating patients with the wrong
    treatment.


    +   1. To check whether the model results are reasonable, we need to check the
    following:

    +      - Are all the input variables statistically significant? The input variables
    are statistically significant when their p-values are less than 0.05.

    +      - Do the model coefficients have the right signs? If a coefficient has
    a positive sign and the expected sign should be negative, further investigation
    needs to be made. For example, the analyst needs to check whether there are outliers
    in the data or whether there are variables in the model that are highly correlated.

    +      - Is the size of the coefficients realistic? For example, if some coefficients
    are extremely small, almost zero, and some coefficients are extremely large, this
    will indicate that the input data needs to be scaled. This can be done by standardizing
    the data to z-scores (rescale the data to have a mean of 0 and standard deviation
    of 1 (unit variance). Another method is to normalize the data (rescales the values
    into a range of [0, 1]).

    +      - Is the standard deviation of the model coefficient acceptable? We sometimes
    find that the standard deviation of some model coefficients is extremely large.
    When we have this situation, it indicates that there are probably a few outliers
    for that variable, and we may need to remove the outliers so that the coefficient
    estimate of the variable is more accurate and reliable because the standard deviation
    will reduce and will not be so large.

    +   2. To check whether the model performs well, we need to use the confusion
    matrix. The confusion matrix is a tool that is commonly used to evaluate the accuracy
    of the prediction model.


    Once the clinical prediction model is built, it is important for the analyst to
    evaluate how good the prediction model is by testing the prediction model on unseen
    data (validation dataset). Using the validation dataset, the analyst needs to
    compute the overall accuracy, sensitivity, and specificity of the prediction model.


    As a rule of thumb, the overall accuracy should be at least 70%.


    From the confusion matrix, the analyst computes the sensitivity of the model,
    also known as the true positive rate (TPR) or recall. The sensitivity of the model'
