    The objective of the Framingham Heart Study is to unravel the underlying causes
    of heart disease using patient blood cholesterol, blood pressure, smoking, and
    obesity information to identify high-risk heart attack patients.


    The R programming software was used to perform our statistical analysis. R is
    a programming language and free software environment for statistical computing
    and graphics supported by the R Foundation for Statistical Computing. The R language
    is widely used among statisticians and data miners for developing statistical
    software and data analysis.'
