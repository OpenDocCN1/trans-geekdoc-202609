    # 2.6.2 PARTICLE SWARM OPTIMIZATION ALGORITHM


    The PSO Algorithm is first introduced by James C. Kennedy and Russell Eberhart.
    The PSO algorithm is a group of optimization algorithms that operate on the basis
    of random population generation [12,72]. This algorithm is based on the modeling
    and simulation of the collective flying (grouping) of birds or collective movement
    (grouping) of fish.


    Each member in this group is defined by the vector of velocity and position vector
    in the search space. In each repetition, the new particle position is defined
    due to the velocity vector and position vector in the search space [73,74].


    At each time interval, the new particle position is updated according to the current
    velocity vector, the best position found by that particle, and the best position
    found by the best particle in the group.


    Sometimes, differences can be seen in different ways of implementing the PSO algorithm.
    But this does not cause a problem in programming, because what matters is the
    execution of program steps in the sequence that follows, and how these steps are
    separated. For example, in some references, they combined the update phase of
    the particle velocity and the transfer of particles to new locations as a stage.
    This change will not cause a problem in the implementation of the algorithm.


    General steps of applying the PSO algorithm are given later:


    +   - Step 1: Generate a random initial particle population: Random generation
    of the initial population is simply a random determination of the initial site
    of the particles with uniform distribution in the space of space (search space).
    The randomized generation of the initial population exists in almost'
  merge: -1
