    et al. [50] proposed another method for action detection using dynamic conditional
    Bayesian network, which also achieved the state-of-the-art results. In Park et
    al. [51], MEBN was used for predictive situation awareness (PSAW) using multiple
    sensors. These networks are robust for reasoning the uncertainty in the complex
    domains for predicting and estimating the temporally evolving situations.


    # ## 14.3.2 Deep Learning-Based Approaches


    For all types of datasets, there are no excellent handcrafted feature descriptors.
    To overcome this problem, the features are directly learning from raw data. Learning
    multiple levels of representation in data, such as speech, images/videos, and
    text is more advantageous in deep learning. These models do automated feature
    extraction, classification and process the images as raw data. These models have
    multiple processing layers in this work. There are three types of approaches in
    deep learning models [52,53]:


    +   1. Generative/unsupervised approach (restricted Boltzmann machines (RBMs),
    DBNs, deep Boltzmann machines (DBMs), and regularized autoencoders);

    +   2. Discriminative/supervised approach (CNNs, deep neural networks (DNNs) and
    RNNs);

    +   3. Hybrid models (a characteristic combination of both approaches)


    # ### 14.3.2.1 Generative/Unsupervised Approaches


    In an unsupervised deep learning approach, the class labels are not required for
    the learning process. These types of approaches are specifically useful when labeled
    data are relatively unavailable. A remarkable surge in the history of deep models
    was triggered by the work of Hinton et al. [54], who developed a feature reduction
    technique and highly efficient DBN. In an unsupervised pretraining learning stage,
    a backpropagation method is used for fine-tuning. These types of deep learning
    approaches are used for many applications like object identification, image classification,
    speech classification, activity, and emotion recognition.


    An unsupervised feature learning model from video data was proposed in the work
    of Le et al. [55] for human action recognition. The authors used an independent
    subspace analysis algorithm to learn spatiotemporal features, combining them with
    deep learning techniques such as convolutional and staking for action representation
    and recognition. DBNs trained with RBMs were used for HER [56]. This'
