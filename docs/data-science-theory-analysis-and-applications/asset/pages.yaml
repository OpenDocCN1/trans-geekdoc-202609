  md: "```\nfunction RandomForest(S, F)\n    H ← ∅\n    for i ∈ 1, . . . , B do\n\
    \        S (i) ← A bootstrap sample from S\n        hi ← RandomizedTreeLearn(S\
    \ (i), F)\n        H ← H ∪ {hi}\n    end for\n    return H\nend function\nfunction\
    \ RandomizedTreeLearn (S, F)\n    At each node:\n        f ← very small subset\
    \ of F\n        Split on best feature in f\n    return The learned tree\nend function\n\
    ```\n\nThe algorithm works as follows: for each tree in the forest, we select\
    \ a bootstrap sample from S, where S(i) denotes the ith bootstrap. We then learn\
    \ a decision-tree using a modified decision-tree learning algorithm. The algorithm\
    \ is modified as follows: at each node of the tree, instead of examining all possible\
    \ feature splits, we randomly select some subset of features f ⊆ F, where F is\
    \ the set of features. The node then splits on the best feature in f rather than\
    \ F. In practice, f is much smaller than F. Deciding on which feature to split\
    \ is oftentimes the most computationally expensive aspect of decision-tree learning.\
    \ By narrowing the set of features, we drastically speed up the learning of the\
    \ tree.\n\nIn KNN, the predicted output of the input feature vector is the average\
    \ output value of all the “K” neighbors within the feature space. KNN is used\
    \ to classify the spectrogram image using brainwave balancing application in BCI.\
    \ It is also used to classify normal brain activity through EEG signal. This algorithm\
    \ was used to classify chronic mental stress and performs satisfactory accuracy\
    \ and sensitivity analysis. KNN algorithm is also used to classify the features\
    \ of left- and right-hand motor imagery from EEG signals.\n\nSVM uses optimal\
    \ hyperplane to separate feature vectors between two classes. Different types\
    \ of kernel functions are available for feature classification. The Gaussian kernel\
    \ function in SVM has been applied in BCIs to classify P300 evoked potentials.\
    \ SVM has implemented in multiclass channel analyzed EEG signal. In a similar\
    \ work, a semisupervised SVM has significantly reduced the training effort of\
    \ P300-based BCI speller. Often in data science, we have hundreds or even millions\
    \ of features, and we want a way to create a model that only includes the most\
    \ important features. This has three benefits. First, we make our model simpler\
    \ to interpret. Second, we can reduce the variance of the model, and therefore\
    \ overfitting. Finally, we can reduce the computational cost (and time) of training\
    \ a model. The process of identifying only the most relevant features is called\
    \ “feature selection.” Random forests are often used for feature selection in\
    \ a data science workflow. The reason is that the tree-based strategies used by\
    \ random forests naturally ranks by how well they improve the purity of the node.\
    \ This mean decreases in impurity over all trees. Nodes with the greatest decrease\
    \ in impurity happen at the start of the trees, while notes with the least decrease"
