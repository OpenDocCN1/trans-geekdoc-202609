  md: '# TABLE 7.2


    # Confusion Matrix for Test Data


    | Reference | Prediction |  |  |

    |---|---|---|---|

    |  | 0 | 1 | Total |

    | 0 | 654 | 276 | 930 |

    | 1 | 58 | 109 | 167 |

    | Total | 712 | 385 | 1,097 |


    From the confusion matrix, 654 plus 109 patients were classified correctly as
    not having a risk of CHD or having a risk of CHD, respectively. Hence, from Table
    7.2, the overall accuracy of the CHD risk factor model is 70%. However, 276 patients
    who did not have CHD were classified as having CHD, and 58 patients who were classified
    as having CHD were predicted as having no CHD.


    The “True Positive Rate/Recall/Sensitivity” value = True positive / (True positive
    + False negative) = 109 / (109 + 58) is 65%, which means for every 100 patients
    who have a TenYearCHD risk, the model is able to classify 65 of them correctly.


    The “Specificity” value = True positive / (True positive + False negative) = 654
    / (654 + 276) is 70%, which means for every 100 patients without TenYearCHD, the
    model is able to classify 70 of them correctly.


    Sensitivity and specificity are inversely proportional to each other. So, when
    we increase sensitivity, specificity decreases and vice versa.


    The False Positive Rate = 1 – Specificity.


    The AUC is plotted with the TPR on the y-axis against the false positive rate
    on the x-axis [12]. See Figure 7.1 later. The AUC is a performance measurement
    for a classification problem at various threshold settings. Our classification
    problem was to classify patients who were at risk of a “TenYearCHD” and those
    who were not at risk. The AUC tells us how much our model is capable of distinguishing
    between the “TenYearCHD” class and the “Non-TenYearCHD” class. The higher the
    AUC value, the better the model is at distinguishing between patients with disease
    and without disease. An excellent model has an AUC value near to 1, which means
    it has good measure of separability. A poor model has AUC near to 0, which means
    it has a poor measure of separability.'
