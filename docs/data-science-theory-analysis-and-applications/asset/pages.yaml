  md: 'called transfer earning. Transfer learning is a good strategy to train a ConvNet
    model with limited datasets, where the model that was trained on a large database
    can be employed to reuse the lower layers as feature extractors. This approach
    has been reported in many literatures [37,38] to be a good practice when dealing
    with insufficient data. A good example of the application of this strategy is
    in the health sector, not because the data is limited, but because the availability
    is hampered by ethical issues [33]. Therefore, the experiment provided in section
    4 utilizes the concept of reusing a pretrained ConvNet model as a feature extractor
    while applying a classification algorithm for the classification task.


    # 9.3.3 Common ConvNet Models


    The illustrations of some ConvNet models that were trained on a huge database
    of annotated images containing 1,000 different categories are given as follows.


    # 9.3.3.1 AlexNet


    AlexNet is the first popular ConvNet architecture developed by Alex Krizhevsky
    et al. [39], which in 2012 participated in the ILSVRC and outperformed all other
    models presented in that year by achieving a top five error rate of 16%. The AlexNet
    has a total of eight layers, which consists of five convolutional layers (both
    convolution and pooling layers) and three fully connected layers. Convolution
    is performed using a 11 × 11 filter size, while the pooling operation is performed
    using 3 × 3 filters in the first layer with a stride of 2. In the second layer,
    the same operation is repeated but with a filter of size 5 × 5, while in all the
    remaining three layers (third, fourth, and fifth), 3 × 3 filters were used. Figure
    9.4 gives a graphical view of the AlexNet model.


    ![](img/5025594f89449de2a74e5b325b1e84ef_231_0.png)


    **FIGURE 9.4** Graphical representation of AlexNet.'
