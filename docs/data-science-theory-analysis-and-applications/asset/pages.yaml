  md: '# 3.5 CONCLUSIONS


    In this chapter, a new supervised feature selection approach based on penguin
    search optimization has been presented. In this chapter, we have summarized the
    workflow of penguins to an algorithm and tried to use them in a manner that has
    been beneficial to the task of feature selection for different datasets. In terms
    of performance of the proposed FS-PeSOA algorithm, experiments using seven publicly
    available datasets have shown that it has given better results than the full feature
    set and the benchmark algorithms of feature selection. It has been compared against
    PCA and LDA for supervised feature selection. As a future work, this proposed
    algorithm can be used for science and development purposes and also in biomedical
    research areas where data analysis is required for the identification of various
