    # 2.6.1 GENETIC ALGORITHM


    GA is one of the most important algorithm that is used to optimize for defined
    functions on a limited domain. In this algorithm, the past information is extracted
    according to the inheritance of the algorithm and is used in the search process.
    The concept of GA was developed in 1989 by John Holland [66,67].


    GAs are usually implemented as a computer simulator in which the population of
    an abstract sample (chromosomes) of the candidates for the solution of an optimization
    problem leads to a better solution.'
