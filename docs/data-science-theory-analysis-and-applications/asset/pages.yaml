    Computer vision applications like action recognition and image and video classification
    can be experimented using dictionary learning-based approaches [41]. From a large
    number of samples, the representative vectors are learned and used in this concept.
    Guha and Ward [42] developed a framework for human action recognition using dictionary
    learning methods. Based on the hierarchical descriptor, the proposed method [43]
    for human activity recognition outperforms the state-of-the-art methods. For visual
    recognition, a cross-domain dictionary learning-based method was developed [44].
    An unsupervised model was developed by Zhu and Shao for cross-view human action
    recognition [45] without any label information. The coding descriptors of LLC
    [46] are generated by a set of low-level trajectory features for each action.


