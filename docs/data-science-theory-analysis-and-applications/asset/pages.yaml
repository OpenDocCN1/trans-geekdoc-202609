    # 9.6 CONCLUSIONS


    The conclusive objective of diagnosing burns is to provide immediate assessment,
    reduce length of hospital delays, avoid complications that are likely to be acquired
    due to the long hospitalization, and prevent loss of lives as a result of unavailability
    of medical facilities. Thus, ML algorithm is used to discriminate healthy skin,
    superficial burns, and full-thickness burns. The extraction of image features
    was conducted using a pretrained model (ResNet101) and a subsequently utilized
    SVM classifier for the classification task. The result shows a performance accuracy
    of up to 99. An interesting part of this investigation is that the future extraction
    model was trained on object recognition and classification task, but it seems
    good when applied to medical images for the feature extraction. Application of
    ML can be utilized to tackle the unavailability of medical personnel in some remote
    locations where access to health facility and experienced health practitioners
    is subjecting patients to difficult situations.


    One of the limitations of the investigation in this work is noninclusion of intermediate
    burns. This was due to unavailability of such data at our disposal. Second, the
    investigation was conducted on Caucasian patients (people with white skin), as
    it is worth to include data from people of different ethnicities, such as burn
    images from skin of color ethnicities. Therefore, these provide the room for further
    investigation.


