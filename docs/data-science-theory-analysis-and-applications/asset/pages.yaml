    # 11.1 INTRODUCTION


    In the past years, numerous handwriting analysis systems were developed for real-life
    purposes, such as identity verification and bank check reading. Such systems are
    commonly based on the recognition of handwritten signatures, words, or digits.
    More recently, new applications have emerged in this field. For instance, the
    requirement of navigation and indexing tools dealing with the huge amount of digitized'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'handwritten documents promoted the use of word spotting and Writer Retrieval.
    Introduced by Atanasiu et al. in 2011 [1], the Writer Retrieval aims to find all
    documents belonging to the same writer, despite of being written at different
    moments, in different languages, and so, having different textual contents. The
    retrieval is achieved without the need of any prior knowledge about the writer’s
    identity. In fact, the system tries to select all documents sharing the same writing
    traits with the query. Conventionally, Writer Retrieval systems are composed of
    feature generation and matching steps (see Figure 11.1).


    To generate features, all descriptors employed for handwriting recognition, such
    as gradient features, textural features, and topological features can be used
    [1]. The matching step is performed through simple dissimilarity measures. Thereby,
    to improve retrieval scores, researchers focused on developing robust features.


    Presently, we investigate the performance of different kinds of feature generation
    schemes for solving Writer Retrieval. Precisely, local binary patterns (LBP) and
    the rotation invariance LBP are used for texture characterization. As gradient
    feature, we propose the use of histogram of oriented gradients (HOG) and gradient
    LBPs (GLBP). Finally, pixel density and run length feature (RLF) are used as topological
    features. To achieve the retrieval stage, various similarity and dissimilarity
    measures are used. Experiments are conducted on the two versions of ICDAR (International
    Conference on Document Analysis and Recognition)-2011 writer identification dataset.


    The remaining chapter is organized as follows: Section 11.2 reviews the state
    of the art. Section 11.3 describes the methods adopted for feature generation,
    while Section 11.4 presents the similarity measures employed in the retrieval
    step. Experiments and discussion are reported in Sections 11.5 and 11.6, respectively.
    The last section gives the conclusion of this work.


    # 11.2  LITERATURE REVIEW


    Writer Retrieval is a new topic in the handwriting recognition field introduced
    in 2011 [1]. For this reason, there are few research works dealing with this topic
    that is commonly overlapped with writer identification. Since the retrieval step
    is carried out through distance-based matching, the performance is controlled
    using the feature generation step. Therefore, the state of the art reveals the
    research efforts to find robust features for characterizing handwritten documents.
    Roughly, various kinds of features such as statistical, topological, as well as
    trainable features have


