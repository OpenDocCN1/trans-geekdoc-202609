    Intuitively, a small sample of physical design strategies has been introduced
    in this section as an example in Neo4j [3]. A physical design produces an implementation-level
    description of a database: the storage structures and methods used for efficient
    access to the data [4]. An adequate physical design is the key for quickly accessing
    the information. It depends on specific aspects of the DBMS on which it needs
    to be implemented and important clues must be followed to design an optimal physical
    database. Thus, we must know the internal workings of our DBMS well in order to
    understand what is happening and how we can optimize a query. In our motivating
    example, a rewritten query improved its performance; however, not all classic
    physical design strategies are successful in Neo4j. Particularly, Neo4j offers
    a native index version whose implementation is not clearly specified by Neo4j
    and is limited for certain data types such as spatial, temporal, and numeric.
    For the other data types, Neo4j uses Lucene which supports inverted indexing.
