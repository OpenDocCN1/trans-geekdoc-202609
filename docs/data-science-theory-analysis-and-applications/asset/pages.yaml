    # 5.3.2 PROPOSED METHOD


    In this section, we present our SG-based method considering phase differences.


    # 5.3.2.1 Skip Graphs


    In this study, we assume an overlay network for the SG-based TBPS, such as Banno
    et al. [10].


    SGs are overlay networks where the skip lists are applied in the P2P model [9].
    Figure 5.16 shows the structure of an SG. In Figure 5.16, squares show entries
    of routing tables on peers (nodes), and the number inside each square shows a
    key of the peer. The peers are sorted in ascending order by those keys, and bidirectional
    links are created among the peers. The numbers below the entries are called


    ![](img/5025594f89449de2a74e5b325b1e84ef_129_0.png)


    FIGURE 5.16 A structure of an SG.'
