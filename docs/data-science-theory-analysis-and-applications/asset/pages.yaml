    nodes and requires a sensor data stream with those collection cycles in the P2P
    network. Upon reception of the query from the sink node, the source node starts
    to deliver the sensor data stream via other nodes in the P2P network. The intermediate
    nodes relay the sensor data stream to the sink node based on their routing tables.


