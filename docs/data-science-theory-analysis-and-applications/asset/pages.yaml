- pgno: 9
  md: '# Preface


    Data Science is an interdisciplinary scientific and technical field that combines
    techniques and approaches for efficient and effective data management, integration,
    analysis, visualization, and interaction with vast amounts of data, all as a critical
    prerequisite for a successful digitized economy. Currently, this science stands
    at the forefront of new scientific discoveries and is playing a pivotal role largely
    in our everyday lives.


    Availability of multidisciplinary data is due to hyperconnectivity, and is heterogeneous,
    online, cheap, and ubiquitous. Old data is being digitized and collecting new
    data from web logs is being added to generate business intelligence. Essentially,
    the increasing availability of vast libraries of digitized information influences
    the way in which we comprehend and analyze our environment and realize businesses
    for our societal benefit. In this situation, data science creates a transformational
    force with an impact on current innovation potential in industry and academia.
    Nowadays, people are aware that this data can make a huge difference in business
    and engineering fields. It promises to revolutionize industries—from business
    to academics.


    Currently, every sector of the economy has access to huge data and accumulates
    this data at a rate that exceeds their capacity to extract meaningful intelligence
    from it. The data exists in the form of text, audio, video, images, sensor, blog
    data, etc., but is unstructured, incomplete in form, and messy. New technologies,
    for example “big data” have emerged to organize and make sense of this data to
    create commercial and social value. It seems that every sector of the economy
    has access to this huge avalanche of data to extract relevant information. The
    question that still remains is how to use it effectively.


    # THE OBJECTIVE OF THIS BOOK


    The aim of this book is to provide an internationally respected collection of
    scientific research methods, technologies, and applications in the area of data
    science. This book enhances the understanding of concepts and technologies in
    data science and discusses intelligent methods, solutions, and applications in
    data science. This book can prove useful to researchers, professors, research
    students, and practitioners as it reports novel research work on challenging topics
    in the area surrounding data science. In this book, some of the chapters are written
    in tutorial style concerning machine learning algorithms, data analysis, etc.


    # THE STRUCTURE


    The book is a collection of fourteen chapters written by scholars and experts
    in this field and organized into three parts. Each part consists of a set of chapters
    addressing the respective subject outline to provide readers an in-depth and focused'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'understanding of concept and technology related to that part of the book. Some
    of the chapters in each part are written in tutorial style in chapters concerning
    the development process of data science and its emerging applications.


    The book is structured as follows:


    +   - Part I: Data Science: Theory, Concepts, and Algorithms

    +   - Part II: Data Design and Analysis

    +   - Part III: Applications and New Trends in Data Science


    Part I comprises five chapters on data science theory, concepts, techniques, and
    algorithms.


    The first chapter extends the earlier work on Cassandra integrated with Hadoop
    to a system called GeoMongoSpark and investigates on storage and retrieval of
    geo-spatial data using various sharding techniques. Hashed indexing is used to
    improve the processing performance with less memory.


    The purpose of Chapter 2 is to study the different evolutionary algorithms for
    optimizing neural networks in different ways for image segmentation purposes.


    Chapter 3 introduces a new adaptive algorithm called Feature Selection Penguin
    Search optimization algorithm, which is a metaheuristic feature subset selection
    method. It is adapted from the natural hunting strategy of penguins, in which
    a group of penguins take jumps at random depths and come back and share the status
    of food availability with other penguins, and in this way, the global optimum
    solution is found, namely Penguin Search Optimization Algorithm. It is combined
    with different classifiers to find an optimal feature subset.


    Currently, graph technology is becoming increasingly important, and graphs are
    used to model dynamic and complex relationships of data order to generate knowledge.
    Particularly, Neo4j is a database management system that currently leads the NoSQL
    system on graph databases. In Chapter 4, the main objective is to propose physical
    design guidelines that improve query execution time on graph databases in terms
    of a specific workload in Neo4j. In this work, indexes, path materialization,
    and query rewriting are considered as guidelines for the physical design on Neo4j
    databases.


    Chapter 5 provides information about the latest techniques of large-scale data
    collection schemes to readers. A continuous sensor data with different intervals
    (cycles) as sensor data stream is defined, and the collection methods for distributed
    sensor data streams as a topic-based pub/sub (TBPS) system are proposed.


    Part II comprises five chapters on data design and analysis.


    The objective of Chapter 6 in this part is to explain and impart solution for
    the effective analysis and management of big data in healthcare with four main
    parts, namely (i) collection of healthcare data; (ii) analysis of healthcare data;
    (iii) management of Big Data; and (iv) Big Data in healthcare. Then, the ability
    to query data is primary for reporting and analytics to generate a report that
    is clear, crisp, and accessible to the target audience when it is offered. This
    chapter discusses the effective utilization of big data analysis and management
    in healthcare.'
