  md: '![](img/5025594f89449de2a74e5b325b1e84ef_272_0.png)


    **FIGURE 11.3** Summary of the HOG calculation.


    +   1. Compute LBP code.

    +   2. Compute width and angle values from the uniform patterns as follows:

    +      - The width value corresponds to the number of “1” in LBP code.

    +      - The angle value corresponds to the Freeman direction of the middle pixel
    within the “1” area in LBP code [20].

    +   3. Compute the gradient at the 1 to 0 (or 0 to 1) transitions in uniform patterns.

    +   4. Width and angle values define the position within the GLBP matrix, which
    is filled by gradient information.


    The size of the GLBP matrix is defined by all possible angle and width values.
    Specifically, there are eight possible Freeman directions for angle values, while
    the number of “1”s in uniform patterns can go from 1 to 7 (see Figure 11.4). This
    yields a 7 × 8 GLBP matrix, in which gradient features are accumulated. Finally,
    the L2 normalization is applied to scale features in the range [0, 1].


    ![](img/5025594f89449de2a74e5b325b1e84ef_272_1.png)


    **FIGURE 11.4** Summary of the GLBP calculation for a central pixel from [19].'
