    # ## 8.2.2 PIM-BASED ANALYSIS OF THE UNIQUE BrS-RELATED PROTEINS


    When the PIM system was calibrated with the unique BrS mutated protein group,
    the method was able to identify 70% of them (Table 8.1). The graphic interpretation
    of the “polar profiles” (Figure 8.2) of the unique BrS proteins and the unique
    BrS mutated proteins showed that these profiles differ in all interactions in
    less than 15%, except for the polar interaction [NP, NP], whose difference was
    greater than 70% (Figure 8.2a).


    In addition, when the PIM system was calibrated with the unique BrS mutated proteins
    (MutBRGDA), its “polar profile” was compared with the 557,713 “polar profiles”
    of the “reviewed” proteins from UniProt database, and it was found that 35,944
    (35,944/557,713≈6.4%) of the “reviewed” proteins from the UniProt database have
    their “polar profiles” similar to the “polar profile” of the unique BrS mutated
    proteins.


    From these results, it can be concluded that the “polar profile” of BrS mutated
    proteins is *not* similar to any of the “polar profiles” studied here, indicating
    that BrS mutated proteins are characterized by a highly specific “polar profile”
    according to the percentages mentioned in these tables.


    # ## 8.2.3 Intrinsic Disorder Analysis of the BrS-Related Proteins


    This important observation indicates that the peculiarities of the “polar profile”
    of the BrS proteins and their mutated proteins can be used for computational identification
    and differentiation of the BrS mutations in large protein datasets. To further
    illustrate the power of the polar profile approach in discriminating the proteins
    of interest, we analyzed 20 unique BrS-related proteins with a set of commonly
    used algorithms for prediction of protein intrinsic disorder predisposition, such
    as PONDR® VLXT, PONDR® VSL2, PONDR® VL3, PONDR® FIT, IUPred_short, and IPred_long.
    Table 8.2 represents an overview of the results of this analysis, showing for
    each query protein a mean disorder score evaluated by averaging the per-residue
    disorder profiles generated by the individual disorder predictors as well as a
    mean predicted percentage of intrinsic disorder (PPID, which is a content of residues
    predicted to be disordered; i.e., those with the disorder scores 0.5 threshold)
    calculated using the mean per-residue disorder profile generated for each query'
