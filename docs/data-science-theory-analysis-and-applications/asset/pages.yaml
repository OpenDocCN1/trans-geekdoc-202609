    # 12.3 METHODOLOGY


    # 12.3.1 Data Description and Analysis


    A text analytics research was conducted with the aim to analyze the hotel guest
    satisfaction represented through EWOM and its influence on overall hotel ratings
    available at TripAdvisor.com. We used the data of Tripadvisor.com, because it
    is world’s biggest social media platform specific to e-services and also has more
    than 460 million EWOMs related to hotels, restaurants, and other e-services. We
    used TripAdvisor.com EWOMs dataset due to [44]. A total of 5,69,861 reviews were
    downloaded in 2015.'
