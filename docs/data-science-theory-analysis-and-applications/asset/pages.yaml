  md: 'approach are the two major approaches in HER problem [37]. Several limitations
    of handcrafted approach fail to learn features automatically from the input data,
    as well as deep representation of data in classifiers. Alternatively, deep learning-based
    approach plays the concept of end-to-end learning by using the trainable feature
    extractor followed by a trainable classifier. The multiple layers of features
    are automatically extracted from raw data. This algorithm develops a multilayer
    representation of different patterns in the input data, where each successive
    layer is responsible for learning increasingly complex features [38]. The lower
    layers extract high-level features from the input data; thus, the representation
    increased the abstraction level at each consecutive layer. The need of handcrafted
    feature detectors and descriptors are eliminated by this automatic learning ability
    of deep learning models. In many visual categorization tasks, deep learning models
    have shown higher performance than traditional handcrafted feature-based techniques
    [39].


    Deep learning models such as CNNs, deep belief networks (DBNs), deep RNNs, and
    deep Boltzmann machines have been successfully employed for many visual categorization
    tasks. Among these models, DBN is an unsupervised probabilistic graphical model
    capable of learning from the input data without prior knowledge. This model can
    also be trained in a semisupervised or unsupervised fashion, which is quite helpful
    for labeling data or dealing with unlabeled data. Learning-based approaches are
    divided into two approaches: nondeep learning approach and deep learning approach
    [40].


    # ### 14.3.1 Nondeep Learning-Based Approaches


    Dictionary learning method and genetic programming approach belong to nondeep
    learning-based methods.


