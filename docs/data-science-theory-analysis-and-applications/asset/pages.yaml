- pgno: 184
  md: 'Every year, the clinical model may need to be modified because patient group’s
    lifestyles have changed over the years, and so the clinical model needs to adapt
    accordingly with more relevant input variables.


    If the CDS tool is not monitored over time, it is possible that newer important
    input variables for clinical decision-making become available over time, and if
    these variables are not used for clinical modeling, the CDS tool will become less
    accurate over time, and eventually clinical treatment will become ineffective
    over time.


    For example, if the initial accuracy of the clinical model is 95% over time, this
    accuracy reduces to 85%, and the analyst should get a serious message to investigate
    whether the model needs to be revamped completely and built from scratch.


    It may happen that every 3 years, a fresh clinical model may need to be built
    as the number of changes in the patient lifestyle is much greater, and the accuracy
    of the clinical model has decreased considerably where a small modification to
    the model is not sufficient.


    It is highly recommended that the analyst builds a data-driven clinical decision-making
    system that includes trigger alerts to the analyst when unacceptable changes to
    the model accuracy occur. Changes to the clinical model accuracy must be communicated
    to all clinicians and healthcare professionals. The clinicians and healthcare
    professionals need to consult with their patients to better understand the patient
    lifestyle changes and health changes so that the analyst has better insights on
    how to modify or revamp the clinical model. This communication will likely improve
    the clinical model and patient treatment, resulting in better patient health.


    The benefit of monitoring the CDS system is that it allows the analyst to be proactive
    in investigating the clinical models when the accuracy of the model reduces considerably.
    This way, the patients will receive the right treatment when their lifestyle and
    health conditions change.


    So, in a nutshell, an automated CDS system will enable clinicians and healthcare
    professional to be proactive and to enlighten the analyst through the decision
    support system when patient lifestyle changes take place. The automated CDS system
    will improve the communication between the analyst and clinicians, resulting in
    a more effective patient care system. Analysts will receive patient treatment
    and health condition updates in a timely manner, allowing the CDS system to automatically
    trigger to the clinician the right treatment for the patient, at the right time,
    resulting in an effective patient care system.


