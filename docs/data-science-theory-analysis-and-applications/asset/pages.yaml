  md: '# 14.3.4 FEEDFORWARD DEEP CONVOLUTIONAL NEURAL NETWORK


    The input videos are converted into frames and saved in a separate folder as training
    and validation sets. Now, the raw images are the input for the first layer. An
    FDCNN consists of multiple convolutional layers, each of which performs the function
    that is discussed earlier. Figure 14.5 shows an FDCNN model. The input image is
    of size 150 × 150 × 3; where 3 represents the color channel. In this network,
    the size of the filter is 3 × 3 for all layers, and the filter is called the weight.
    Multiplying the original pixel value with weight value is called sliding or convolving.
    These multiplications are summed to produce a single number called receptive field.
    Each receptive field produces a number. Finally, get the feature map with a size
    of (150 × 150 × 3). In the first layer, 32 filters are applied and have 32 stacked
    feature maps in this stage. Then, the subsampling (or max pooling) layer reduces
    the spatial (feature) size of the representation with a size of (75 × 75 × 32).
    In the second layer, 64 filters are applied and have 64 stacked feature maps.
    Then, the max pooling layer reduces the feature dimension to (37 × 37 × 64). In
    the third convolutional layer, 128 numbers of filters are applied and have 128
    stacked feature maps. Then, the output of the maxpooling layer reduces the feature
    dimensions to (18 × 18 × 128). All max pooling layers are located with a size
    of 2 × 2. Finally, fully connected layers with 512 hidden units are placed, and
    the output classes have 15 neurons as per classes and show predicted emotions.


    # 14.3.5 VGG16 MODEL


    Figure 14.6 describes the architecture of the Visual Geometric Group (VGG)16 model.
    The VGG16 model consists of five blocks with 16 layers. The first two blocks have
    two convolution layers and one maxpooling layer. The remaining blocks have three
    convolution layers and one maxpooling layer. Finally, fully connected layer has
    one flatten layer and three dense layers. The sequences of an RGB (red, green,
    blue) image with size 256 × 256 are the inputs for this model. After each block,
    the size of the input image is different, which is defined in the architecture
    diagram.


