    # 12.6 IMPLICATIONS


    # 12.6.1 THEORETICAL IMPLICATIONS


    Much of the previous studies in the hospitality sector focusing on customer (guest)
    satisfaction were conducted empirically or through econometric modeling. Compared
    with the earlier studies that made use of primary datasets obtained from survey
    questionnaires and focus groups (in case of empirical studies) or using technical
    aspects of UGC, such as length, sentiments, valence, and many more, this study
    uses topic model to gain insights into what guests talk about in their reviews,
    and based on the obtained topics, we judge the satisfaction level with the help
    of ML classifiers.


    One of the research findings are extracting the topics that represent the collection
    of buzzwords that reviewers talk about. The topic modeling technique adopted in
    this chapter is LSA. The 20 most important features (topics) extracted from 2,39,859
    hotel reviews were nightlife, value, amenities, natural beauty, guest experience
    (critique), recommendation, staff, guest experience (praise), the location of
    hotel, accessibility, car parking, visitor suitability (critique), satisficing,
    style and décor, bathroom, deals, visitor suitability (praise), hybrid, room experience,
    and high standards. These are consistent with previous works in tourism literature.


    Since the online reviews are available in abundance and represent information
    in open structural form, it becomes complex to analyze them. This study tackles
    these shortcomings by using five supervised ML techniques, namely RF, DTs, NB,
    SVM, and ANNs to classify the reviews into satisfiers and dissatisfiers. The RF
    classifier delivers the best performance when compared with other four classifiers,
    with performance values having 91.94% accuracy, 88.8% f-measure, 92.75% recall,
    and 85.18% precision. This is consistent with recent studies conducted using ML.


