    # ## 3.1 INTRODUCTION


    Machine learning is a branch of artificial intelligence (AI), which allows applications
    to become more authentic in anticipating to which class a particular data resides.
    Various applications of machine learning are spread over the areas like healthcare,
    finance, retail, travel, social media, advertisements, and most importantly, data
    mining [1]. There are two types of learning: supervised learning and unsupervised
    learning. In machine learning, feature alone is a measurable property or trait
    of a phenomenon being observed. Feature subset selection is one of the important
    tasks in'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'data mining. To perform effective data mining and pattern recognition tasks,
    we need the help of an efficient feature selection technique. However, due to
    a large number of features present in high-dimensional datasets, there is a chance
    of unnecessary overfitting, which increases the overall computational complexity
    and reduces the prediction accuracy of the procedure. This feature selection problem
    belongs to a set of NP (non-deterministic polynomial)-hard problems, where the
    complexity increases exponentially if the number of features along with the size
    of datasets is increasing. Feature subset selection not only helps us to get rid
    of the curse of dimensionality but also helps us to shorten the training time
    and simplifying the model, making it easier for the analysts to interpret it.
    There are various approaches that deal with both supervised and unsupervised ways
    of feature subset selection [2–5]. There are two classes of feature selection
    methods, such as (i) filter-based feature selection and (ii) wrapper-based feature
    selection.


    Filter methods are generally a part of the preprocessing step. Here, each feature
    is selected on the basis of their scores in various statistical tests, some of
    which are Pearson’s correlation (PCA), linear discriminant analysis (LDA), analysis
    of variance (ANOVA), and chi-square. The other methods are wrapper methods, where
    a set of a subset is randomly chosen and then the efficiency is checked, and after
    that, other features apart from the subset are chosen, and the results are checked
    again, or some irrelevant or less important features are removed from the subset.
    This continues until we find an ideal subset. In wrapper methods, the problem
    is reduced to a search problem. Using wrapper methods are quite expensive [6].
    Some of the examples of wrapper methods are forward selection, backward elimination,
    and recursive feature elimination. Apart from these two methods, we can also use
    an embedded method that includes the qualities of both wrapper methods and filter
    methods. It is used by those algorithms that have built-in feature subset selection
    methods [7].


    After feature subset selection, we use classifiers to classify which class the
    particular data belongs to. However, we have tested our algorithm using K-nearest
    neighbors (KNN), support vector machine (SVM), and Random Forest classifiers [8].
    KNN is a very simple nonparametric decision procedure that is used to assign unclassified
    observations a class with the use of a training dataset [9].


    In this chapter, we have worked upon feature subset selection using “penguin search
    algorithm,” inspired by the hunting strategy of the penguins [10]. Also, we have
    tested our algorithm on some popular UCI (unique client identifier) datasets,
    including Iris, Pima, Wisconsin, etc. Then, we have compared our work with the
    existing feature subset algorithm. We have also used three different types of
    classifiers and checked how good our algorithm works in terms of parameters such
    as accuracy, precision, recall, and F1 score. There are several existing algorithms
    or approaches for “feature subset selection,” which are inspired by nature like
    ant, bee colony, whale, etc., and so we are using “penguin search optimization
    algorithm (PeSOA)” in our work, which is based on the way penguins hunt for food
    [10]. Penguins take random jumps in different places and random depths to find
    out fish, and after they find fish, they come back and communicate about the food
    availability with the other penguins, and this continues till the penguins find
    the best place or the place where maximum fish are present or the global maxima.
    The goal of finding the global maxima continues until the oxygen level of penguins
    does not'
  merge: -1
  img_proc: true
