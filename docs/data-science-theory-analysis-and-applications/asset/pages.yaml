  md: 'computable differences to identify specific proteins, e.g., mutations associated
    with BrS, as shown in this work. On the other hand, it is important to differentiate
    such mutants from other protein groups and search for other proteins that can
    possibly be associated with the syndrome by extensively checking different databases
    and individually evaluating all the proteins found in the UniProt database. A
    special feature of the PIM system is its sensitivity in the detection of differences
    when comparing two “polar profiles”. Although the graphs of the “polar profile”
    (Figure 8.2a) of the BrS protein and BrS mutated protein groups are very similar,
    except for the polar interaction [NP, NP], the PIM system maximizes the differences
    that at first sight would not be possible to recognize.


    An alternative approach would be the construction and analysis of the 20^n proteins
    of “n” length, yet this approach would be extremely expensive computationally.
    For instance, to analyze proteins with a length of 11 residues, the number of
    possible combinations would be 20^11 ≈ 204 trillions of proteins. This would require
    parallel computing with a computational power of tera- or petaFLOPS (Floating
    point operations). Fortunately, current computational resources make both approaches
    feasible. Knowledge of the “polar profile” of this group of mutated proteins enables
    the construction of synthetic peptides that could be used for the neutralization
    of the ion channel imbalance. It could also be used in biochips that identify
    and measure the presence of BrS mutated proteins in the blood. Having a proved
    computational method will make the implementation of a biochip much compact and
    relatively straightforward, compared with a processor-based implementation. These
    biological microdevices would have a very low cost for the consumer and will enable
    the population to use it massively as a preventive measure. It would not be necessary
    to program the PIM system in the biochip, rather only the “polar profile” of the
    BrS mutated proteins may be needed, unlike other bioinformatics methods with several
    metrics that require the program directly in the biochip.


    # 8.4 MATERIALS AND METHODS


    The computational nonsupervised PIM system [7] has been used to identify different
    protein groups and its metrics named “polar profile” has been previously explained
    in detail [7]. However, it will be useful to illustrate the metrics with the next
    example, and by adding some considerations related to the computational scheme.


    The PIM system only stores the polar profile of the representative protein group
    that is to be characterized (target protein set), and the polar profile of one
    of the proteins that comes from the set (or sets), whose function and/or structure
    are defined by experimental methods (Figure 8.1). This approach substantially
    reduces the memory demand, thus reducing processing time, but more importantly,
    it allows to take advantage of supercomputer resources, whose computational scheme
    is master-slave.


