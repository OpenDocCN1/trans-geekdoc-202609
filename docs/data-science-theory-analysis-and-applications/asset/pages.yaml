    The performance evaluation of the proposed work can be calculated using Accuracy,
    Recall, F-Score, Specificity, and Precision. Accuracy in classification problems
    is the number of correct prediction made by the model over all kinds of prediction
    made, which can be calculated using Equation (14.7).


    Accuracy = (TP + TN) / (TN + FP + TP + FN) (14.7)


    Recall specifies how extraordinary an emotion is recognized accurately.


    Recall = TP / (TP + FN) (14.8)


    The symphonies mean of Precision and Recall is called as F-score.'
