    # 7.3.5 Step 5. Optimize (Find the Best Solution)


    At this stage, the analyst will work with the clinician and apply the machine-learning
    model coefficients and outcomes and run “what-if” scenarios, to determine the
    best solution, with the given constraints and limitations. The analyst will select
    the optimal solution and model based on the lowest error, clinical targets, and
    his intuitive recognition of the model coefficients that are most aligned to the
    clinical goal.


    # 7.3.6 Step 6. Derive a Clinical Strategy for Patient Care and Measure the Outcome


    The clinician will apply the machine-learning tool to guide his clinical diagnosis/
    strategy and the appropriate treatment for his patients. After an appropriate
    time period, the patient’s health condition is assessed to determine whether the
    machine-learning model and the clinical decision was effective or not, and whether
    the clinician should continue to be guided by the machine-learning tool and continue
    to use the clinical decision-making system.


    # 7.3.7 Step 7. Update the CDS System


    In the final stage, the analyst updates the patient outcome results in the CDS
    system, and the machine-learning tool derives new insights in real time. Information
    such as, “was the clinical decision and patient treatment effective?,” “how did
    the patient treatment group compare with the control group?,” and “what was the
    accuracy of the machine-learning tool?” are uploaded into the clinical database.


    Over time, the clinic’s database is continuously evolving with new patient treatment
    allocations, new patient outcomes, and real-time machine-learning tool accuracy
    information. It is important that the analyst reviews and monitors the CDS system
    to determine when the machine-learning tool is no longer accurate or to determine
    when the clinical treatment is no longer effective, so that steps can be taken
    to modify the CDS system appropriately.


    For example, if the initial accuracy of the clinical model is 95%, over time this
    accuracy gets reduced to 90% (assuming a reduction of more than 5% indicates that
    action needs to be taken), the analyst should get an alert to investigate whether
    the model needs to be modified due to patient clinical changes and model coefficient
    changes.'
