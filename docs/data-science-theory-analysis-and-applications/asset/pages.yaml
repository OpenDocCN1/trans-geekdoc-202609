  md: '# 2.1 INTRODUCTION


    Digital images that are generated from smaller elements are called pixels. By
    considering an image as function f, with two independent dimensional including
    x, and y, f(x, y), where −∞ < x, y < ∞ can be illustrated on a page by taking
    a value for its intensity or brightness. Here, the point (x, y) is called the
    point of a pixel.


    The process of applying different methods on these images is called image processing.
    The applications of image processing and machine vision in different industries
    and fields are increasing day by day. There are two principal limitations that
    make the digital image processing methods interesting:


    +   1. Enhancing the visual information for human interpretation

    +   2. Scene data processing for machine perception independently


    By increasing the awareness of human life and by complicating their demand, the
    utilization of new machine vision systems in the real world is inevitable [1].
    The visual perception of the human can be easily mistaken; this disadvantage increases
    the instability of the human, the inspecting cost, and changing of such assessments,
    which made it necessary to have a machine vision system in industrial and sensitive
    works.


    One of the main parts of image processing is image segmentation. The main idea
    behind image segmentation is to classify a considered image into its main components.
    In other words, the main purpose of image segmentation is to simplify the next
    process steps by turning the image into a more meaningful data. Image segmentation
    uses assigning labels to all pixels of the image, where pixels with similar features
    are labeled in the same class [2]. This process includes an important part of
    most computer vision applications [3]. Image segmentation can be classified into
    four principal categories: histogram-based thresholding methods, methods based
    on classification and clustering techniques, texture analysis based methods, and
    region-based split and merge methods [4].


    Among the different types of image segmentation, classification is a useful technique
    that separates the main components of an image, whereas the pixels with the same
    features include a special range of gray levels. In simple terms, classification-based
    segmentation has been given considerable attention in the last few years [5–10].
    Furthermore, due to their ability to achieve near-optimal solutions for many applications,
    heuristic algorithms have been recently utilized to achieve proper solutions for
    the problem of image segmentation [5,10–12].


    Recently, the neural network is turned into one of the most popular methods for
    image segmentation in different applications. Multilayer perceptron (MLP) is one
    of the most widely used neural network models in which the connection weight training
    is normally completed by a backpropagation (BP) learning algorithm [13–15].


    BP learning algorithm uses a gradient descent method for minimizing the error
    between the desired and the output for classification. One of the main drawbacks
    of the gradient descent method is getting stuck in the local trap.


    Using metaheuristic algorithms can minimize error in the neural network by optimizing
    the value of its parameters like weight training, architecture adaptation'
