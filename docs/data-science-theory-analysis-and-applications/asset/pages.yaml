  img_proc: true
- pgno: 51
  md: 'Problem optimization: After modeling the problem, the solution routine produces
    a good solution to the problem. This solution may be optimal or almost optimal.
    The point to be taken into consideration is that the obtained result is a solution
    to the model, not to the real problem. During formulation and modeling, there
    may be some changes in the real problem, and the new problem is far from the actual
    one.


    Problem deployment: The solution obtained by the decision maker is examined, and,
    if acceptable, is used, and, if the solution is not acceptable, the optimization
    model or the algorithm should be developed and the optimization process repeated.


    A general description of the optimization problem is given in the following:


    minimize

    x ∈ ℜ^n f_i(x), (i = 1, 2, ..., M).

    s.t. h_j(x) = 0, (j = 1, 2, ..., J)

    g_k(x) ≤ 0, (k = 1, 2, ..., K) (2.4)


    where f_i(x), h_j(x), and g_k(x) are functions of the vector. Each x_i member
    of x is called the decision variable that can be continuous, real, discrete, or
    a combination of them.


    While using the optimization algorithms, a few cases should be considered:


    +   - The functions f_i(x) in which i = 1, 2, ..., M are called fitness, objective,
    or cost function.

    +   - If the optimization is a single objective, then M = 1.

    +   - Search space (ℜ^n) is divided by the decision variables.

    +   - Solution (response) space is a space that can be formed by the values of
    the objective function.

    +   - Problem constraints can be considered as equations (h_j) and inequalities
    (g_k).

    +   - All inequalities can be rewritten as more than zero.

    +   - The problem function can be rewritten as the maximization problem.


    # 2.6 METAHEURISTIC ALGORITHMS


    The goal of metaheuristic algorithms is to provide a solution within a reasonable
    time frame that is appropriate to solve the problem, and the exploratory algorithm
    may not be the best solution to solve the problem, but can be the closest to the
    solution.


    Metaheuristic algorithms can be combined with optimization algorithms to improve
    the efficiency of the algorithm. A metaheuristic algorithm is a combination of
    heuristic algorithms that are designed to find, generate, or select each exploration
    in each step, and provide a good solution to problems that are optimizing. Metaheuristic
    algorithms consider some of the hypotheses of the optimization problems to be
    solved.


    Metaheuristic algorithms are some kinds of algorithms that are generally inspired
    by nature, physics, and human life and are used to solve many of the optimization
    problems. Metaheuristic algorithms are usually used in combination with other
    algorithms to reach the optimal solution or escape from the local optimal solution
    [65].'
  merge: -1
  img_proc: true
