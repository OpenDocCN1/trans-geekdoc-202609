- pgno: 91
  md: 'several types of indexes including B-Trees. In consequence, Neo4j does not
    have a simple way of improving range comparisons, because the B-Tree use is usually
    a recommended strategy for this purpose; Neo4j supports a limited use of indices
    on range comparisons [5]. In addition, Neo4j lacks collection operators, and it
    only has UNION and UNION ALL operators that reduce the possibilities of rewriting
    a query to avoid a certain operator.


    Despite some limitations of Neo4j, it also presents a different way to manipulate
    the data, e.g., it introduces a list data structure in order to manipulate data
    in several ways. In this sense, a new challenge is created for database administrators
    that have to adapt themselves to new technologies including NoSQL DBMSs. Additionally,
    the physical database design is a fundamental phase to ensure a good performance
    for database applications. When a database application grows in scale, the need
    for improving query performance also increases. If the queries begin to worse
    their performance, it is necessary to adequately handle significant amounts of
    information and efficiently execute different operations on the data.


    Our goal in this chapter is to propose a physical database design strategy that
    improves the query performance for Linked Data Benchmark Council (LDBC) Social
    Network Benchmark (SNB) [6] using a graph NoSQL DBMS, Neo4j. Neo4j is one of the
    main NoSQL DBMSs on graph databases that are being widely used because they are
    the most natural way to understand any system that surrounds us and to represent
    its connections through graphs. For example, Facebook and Google support their
    business by means of graphs. Facebook is built on the value of relationships between
    people by capturing all these connections in a social graph [7] while Google improves
    its searches using a Knowledge Graph [1].


    # 4.3 NEO4J


    Neo4j is an open-source, native graph DBMS that provides an ACID (Atomicity, Consistency,
    Isolation, Durability)-compliant transactional backend [8]; its source code is
    written in Java and Scala. Particularly, Neo4j efficiently implements a property
    graph model. A property graph is built using nodes and edges, but it has two additional
    definitions: properties and labels. A property is an attribute of a node or a
    relationship. A label is used to tag a group of nodes or relationships in order
    to represent its role on the model. An example of a property graph can be observed
    in [8].


    Additionally, Neo4j is able to generate a physical or execution plan for a query.
    An execution plan is a tree-like structure composed of operators [9]. These operators
    can be classified into the following five categories:


    +   - Expanding operators: They are those used to traverse the graph. Given a
    set nodes, it will traverse the relationships, outgoing or ingoing, and retrieve
    the end nodes.

    +   - Node-retrieving operators: They retrieve the starting point of a search
    in a graph. If an index is not specified, a scan over all nodes will be performed,
    else an index will be used. These operators are leaf nodes in an execution plan.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '+   • Filter operators: They select a subset of data. For example, removing
    all the first X nodes. These operators are usually found between operators.

    +   • Join operators: They integrate the result of two branches with already expanded
    paths. These operators are performed when the execution plan has to merge two
    branches to produce one result.

    +   • Aggregation operators: These operators correspond to usual aggregation operations
    such as count, sum, average, etc.


    It can be noted that there are other types of operators for writing, such as create,
    update, or delete, but they are not considered in this chapter; additional details
    of Neo4j operators can be found in [9].


    To generate an execution plan, Neo4j requires knowing certain statistics to determine
    which is the best plan according to the planner. These statistics are the number
    of nodes having a certain label; the number of relationships by type; selectivity
    per index; the number of relationships by type, and the number of relationships
    grouped by the label of the ending and starting node [9]. Then, these statistics
    are applied to estimate the number of records that is expected to be produced
    by each operator. Once the best plan is built by the planner, then it is executed.
    In addition, the execution plan is stored in cache to prevent any unnecessary
    recalcalculation. However, the execution plan is generated again if the computed
    statistics change.


    Once a plan is executed, Neo4j shows actual records for each operator and an abstract
    unit called DB (Database) Hits. A DB Hit is an abstract unit of storage engine
    work and could correspond to looking up a node, property, or relationship. Since
    the amount of DB Hits is somewhat proportional to the amount of time it takes
    to execute the query, it is obvious why one of the main objectives should minimize
    the DB Hits.


    Finally, it is important to note that some considerations must be taken into account
    to improve the execution time of a query. The operators of an execution plan,
    the amount of records each operator process and its outputs, and the amount of
    DB Hits generated while executing a plan are clues for a database administrator
    on how he/she can make physical design, reduce the processing time of a query.


    # 4.4 DESIGN GUIDELINES


    A good physical design can be achieved if the designer understands how the DBSM
    works, especially what are the query processing techniques offered by it. The
    following guidelines for a physical design in Neo4j summarize techniques that
    can be applied by a database designer:


    +   • Guideline 1 (Query Rewriting): A designer may improve the query performance
    if he appropriately modifies the current query text. During this work, we found
    out some patterns in a query text that usually lead to improvements on the query
    performance. These patterns are as follows:


    +   • Path redundancy: A same path or part of it can be repeated in a query text,
    and therefore, there is a path redundancy in a query text. If the'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'designer detects a path redundancy in the query text, he can simplify the query
    through other constructions that the query language provides. For example, a designer
    can group repeated paths using a case expression to avoid unnecessary calculations
    or relationship expansions. Additionally, if the path has at least three nodes,
    the designer can consider materialize it by means of relationship creation, and
    then, he/she can rewrite the query replacing the repeated path with the new materialized
    relationship.


    +   - **Minimal query:** A path is not minimal if the designer identifies unnecessary
    paths. If the designer eliminates a part of a path in the query text and the resulting
    query is still correct, then the query is not minimal. This part of a path is
    not really required since it does not contribute in the query result.

    +   - **Guideline 2 (Path Materialization):** A designer can also decide to create
    a materialized path. The first step is to identify a path with the highest amount
    of DB Hits. The second step is to materialize a relationship to create a shorter
    alternative path. Since Neo4j does not manage materialized views, the third step
    is to rewrite the query replacing the path identified in the first step by an
    alternative path. For example, consider the nodes A, B, and C, and the relationships
    r and q, if a path s with the highest amount of DB Hits in a query is (A)-[r]-(B)-[q]-(C),
    then a new relationship p can be created as (A)-[p]-(C), and the query can be
    rewritten replacing the path composed of r and q by p. In consequence, the DB
    Hits are reduced because the path was precomputed and materialized, and the cost
    of computing the path is avoided. Finally, when we create a materialized path,
    additional space is required to be stored. Moreover, if the memory is not enough,
    then the path cannot be created.

    +   - **Guideline 3 (Index Creation):** The designer must analyze each query and
    decide the creation of an index on those nodes where a high selectivity condition
    has been defined. An index can reduce the number of nodes to be explored, since
    a scan on all nodes is avoided, and in consequence, a smaller number of paths
    are expanded. Moreover, if an index needs to be created, the designer must select
    the type of index to be defined. The Neo4j index is simple or composite. A simple
    index corresponds to an index on a single property, and a composite index defines
    an index on several properties. The composite indexes have certain limitations.
    For example, a composite index cannot be used for range conditions or substring
    searches using the CONTAINS operator. Additionally, Neo4j implements two types
    of indexes. The first type is the native index that uses an unknown implementation
    and is limited to certain types of values (spatial, temporal, numeric, etc.).
    The second type of index is based on Lucene, and it uses inverted indexing for
    the remaining data types that are not supported by the native index [10]. Finally,
    although indices can improve the performance of queries, they require additional
    space to be stored, and if the database is highly updatable, the index update
    will impact into the database performance since the DBMS must update the index
    entries removing the old ones and inserting the new ones.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# 4.5 PHYSICAL DESIGN


    Before starting a physical design of a database, its data must be analyzed in
    conjunction with the queries that are frequently executed, in order to propose
    strategies and structures that can improve the processing time of its queries.
    Thus, the dataset selected for our physical design was generated from the SNB
    [11] of the LDBC. An SNB is a data generator that produces synthetic social network
    datasets. In this experimental study, we work with the Interactive Workload and
    Business Intelligence Workload (BIW), which is the only workload of this benchmark,
    developed for Cypher and consists of analytical queries. The specification for
    each of the queries of this workload can be found in [12,13].


    Based on the choke points, we selected 13 from 25 queries of the Interactive Workload
    and BIW. A choke point is an aspect observed during the evaluation of queries
    and corresponds to an opportunity of physical design to improve the query processing
    time [13]. Moreover, the choke points may be classified in terms of aggregation
    performance, join performance, data access locality, expression calculation, correlated
    subqueries, parallelism and concurrency, and RDF (Resource Description Framework)
    and Graph specifics.


    Each of the queries of the Interactive Workload and BIW is associated with at
    least one choke point. In this work, we will only consider 22 choke points, although
    the benchmark subsequently changed, adding six additional check points.


    The process for selecting 13 queries from the Interactive Workload and BIW consisted
    of randomly choosing a reduced number of 13 combinations from a set of 25 queries.
    It is noteworthy that 25 choose 13 =5,200,300 is a very large number. In this
    sense, we applied two criteria to reduce the total number of combinations. These
    criteria are the following: (i) For each choke point, there must be at least one
    query associated with it; (ii) There cannot be a choke point that is associated
    with all of the queries in each combination.


    Since we want to test the design guidelines against all the choke points available,
    we defined the first criterion. Thus, we decided that the final combination must
    associate each choke point with at least one query. Figure 4.6 illustrates a table
    that contains the choke points for each query in combination with the queries:
    BI 3, BI 4, BI 6, BI 7, BI 9, BI 12, BI 14, BI 16, BI 18, BI 19, BI 21, BI 22,
    and BI 23, where the BI acronym means business intelligence that is assigned by
    SNB. In Figure 4.6, each row represents a query, and each column corresponds to
    a choke point. It can be noted that each of the columns has at least one dot,
    i.e., each choke point is in this combination.


    The second criterion was defined to avoid having one choke point shared between
    all of the queries in a combination. To prove the physical design guidelines in
    several situations, we avoided having a common characteristic between all of the
    queries in a combination. We can observe in Figure 4.6 that no column is completely
    filled with dots.


    With these two criteria, the total amount of combinations was reduced to 276,194.
    At last, for our experimental study, we randomly chose one of these combinations'
