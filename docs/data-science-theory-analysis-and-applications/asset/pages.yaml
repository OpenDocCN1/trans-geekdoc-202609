    how much our classification model gets “confused” during predictions. It gives
    us insight not only on the errors being made by a classifier but also, more importantly,
    on the types of errors that are being made. Each row of the table represents the
    instances in a predicted class versus the instances in an actual class in the
    column. The name is taken from the fact that it makes it easy to see whether the
    system is confusing two classes (i.e., commonly mislabeling one as another).


    Here, we have evaluated the classification accuracy of our proposed work using
    the confusion matrix. Sensitivity/recall refers to the true prediction of each
    class (emotional state) when it is actually true. Specificity refers false prediction
    of each class (emotional state) when it is actually false. Precision means how
    many of the truly classified samples are relevant in each class. F-measure computes
    the accuracy of the multiclass problem, and it is calculated using precision and
    recall values.


    From Table 10.3 and Figure 10.8, we can conclude that emotional state “Harmony”
    (class 4) has the maximum sensitivity, so the classifier shows the maximum true
    prediction rate for that class, whereas emotional states “Positive emotion” (class
    1), “Angry” (class 3), and “Harmony” (class 4) have specificity in the same range
    with least specificity for state “Negative emotion” (class 2). “Negative emotion”
    (class 2) also has the least precision value, indicating the minimum number of
    correctly classified samples that belong to a given class. Class 4 has the highest
    accuracy based on maximum F-measure, with class 2 giving us the least. We also
    observe that class 3 also has the least sensitivity and hence produces the least
    positive outcome when it is actually positive(True).


