  md: '(for determining the number of hidden layers, number of hidden neurons, and
    node transfer functions), and learning rules [10,13,16].


    This chapter focuses on a study about how metaheuristic algorithms can optimize
    the performance of a neural network and how they can be employed for image segmentation
    purposes. The main idea is to optimize the initial weights of a feedforward neural
    network.


    # 2.2 SUPERVISED IMAGE SEGMENTATION


    The main idea in the supervised classification in image processing is to divide
    all the pixels of the input image into two predefined classes. By using supervised
    classification, we categorize examples of the information classes of interest
    in the image.


    Color is one of the considered cases that can become a classification issue. Furthermore,
    the purpose of color pixel classification is to decide what class a color pixel
    belongs to. Good image color pixel segmentation should give coverage for all complicated
    types. Such mentioned problem can be evaluated by artificial neural networks (ANNs),
    which have been proven as an efficient tool for pattern classification purposes,
    where decision rules are hidden in highly complex data and can be learned only
    from examples. The image is then classified by attempting to change the performance
    of each pixel and decide which of the signatures are the most similar.


    ANNs are computational models that are inspired by natural neurons. Natural neurons
    receive signals through synapses located on the dendrites or membrane of the neuron.
    When the received signals get strong enough, the neuron is activated and emits
    a signal through the axon. This signal might be sent to another synapse and might
    activate other neurons.


    From a practical point of view, ANNs are just parallel computational systems that
    include many simple processing elements connected together in a special way to
    perform a considered task. ANNs are strong computational devices that can learn
    and generalize from training data since there is no requirement for complicated
    feats of programming.


    From a practical point of view, image segmentation can be performed within two
    different concepts: supervised (classification) methods and unsupervised (clustering)
    methods [1,17,18].


    # 2.3 LITERATURE REVIEW


    In the recent years, applications of automated computer-aided assessment systems
    increased from industrial quality inspection [1], agricultural systems [19], aerial
    imaging [20], to medical imaging [5]. These processes have been applied to the
    input of digital images from the camera.


    The main purpose of supervised methods is to classify all the pixels of a digital
    image into one of several classes; the main idea behind supervised methods is
    that the main groups are first determined by a supervisor (expert), and then,
    the method classifies the data based on a given class [8,9,21,22].


    In contrast, in unsupervised methods, the groups are not defined by en expert.
    So, these methods have two main works to do; first, identify some optimal groups,
    and second, classifying the given data among these groups.'
