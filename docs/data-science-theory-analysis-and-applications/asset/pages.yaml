    \ single value, represented in binary format) is applied for each tuple in the\
    \ dataset, which takes <Latitude, Longitude> pair as input and produces “Geohash”\
    \ value as output (with a precision of 12 bits). Thus, Geohash values are added\
    \ as an additional column.\n+   \n+   c. Hashed indexes support sharding using\
    \ hashed shard keys. Hashed-based sharding uses a hashed index of a field as the\
    \ shard key to partition data across the sharded cluster. Same data is sharded\
    \ by applying Range and Zone Sharding and is stored in MongoDB.\n\n+   ii. Spatial\
    \ querying\n+   \ta. User submits a spatial query.\n+   \tb. Compute Geohash value\
    \ for the queried area using Geohashing technique. Master-Slave framework is used\
    \ for parallel implementation of the input query. The input query logic is executed\
    \ in parallel on the in-memory chunks and over different mappers.\n+   \tc. Spark\
    \ Master-Slave framework performs Map and Reduce task.\n+   \td. The output of\
    \ the geospatial query is given as input to the tableau for visualization.\n+\
    \   \te. Visualize the output.\n\n# ## 1.3.2 Spark Master-Slave Framework\n\n\
    Data processing using Spark framework is divided into two daemons:\n\n+   i. Master\
