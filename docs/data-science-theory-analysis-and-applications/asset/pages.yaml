- pgno: 26
  md: 'Our previous work [16,18] is on geospatial querying by integrating Cassandra
    with Hadoop. Geospatial querying within Hadoop environment faced significant data
    moments because of no proper scheduling mechanism for job execution. We extended
    the same framework for integrating MongoDB with Spark with visualization. The
    main objective of this chapter is to propose “GeoMongoSpark Architecture” for
    efficient processing of spatial queries in a distributed environment that takes
    advantage of integrating MongoDB with Spark for geospatial querying by using geospatial
    indexing and sharding techniques and visualizing the geospatial query processing.
    The main objectives are listed as follows:


    +   1. To understand the need for integrating MongoDB and Spark and propose a
    new architecture for the integration.

    +   2. Collect benchmark datasets for testing the proposed architecture.

    +   3. Apply various sharding techniques to partition the data.

    +   4. Compare the performance evaluation of various sharding techniques.

    +   5. Use Tableau for visualization.


    # 1.2 LITERATURE SURVEY


    Query processing in a centralized database system has more response time and slower
    data access when compared with a decentralized database. Location-based services
    use voluminous spatial data to answer end user queries. Hence, scalable techniques
    that operate on distributed computing platforms and technologies are required
    for efficient processing of spatial queries. Spatial data processing based on
    Hadoop, and Spark comparison based on query language, spatial partitioning, indexing,
    and data analysis operators are reported in [5]. The STARK system provides a number
    of spatial predicates for filters and joins. The drawback with this framework
    is that filters can delay the processing time, irrespective of any kind of data,
    and persistent indexing causes memory wastage. The processing performance can
    be improved with the use of hashed indexing that uses less memory. The work reported
    in [6] presents a distributed query scheduler for spatial query processing and
    optimization. It generates query execution plans using spatial indexing techniques.
    Experiments are performed on real datasets and are compared with other works.
    Although the query execution performance is improved and communication cost is
    reduced, this architecture is costly to implement, and the use of filters can
    increase the processing time of a query. Spatial-Hadoop and GeoSpark are discussed
    in [7], where authors proved that GeoSpark is faster than Spatial-Hadoop for geospatial
    big data analytics. Spatial data processing system that schedules and executes
    range search is described in [10]. k-NN (k nearest neighbor), spatiotemporal operation,
    spatial-join, and k-NN-join queries are described. Bloom filters are used to reduce
    network communication. Experiments are carried out using sample data. Hashed indexing
    can improve the query processing time by reducing the use of memory for storing
    global and local indexing, even though frequently accessed data is cached in Location
    Spark and less frequently used data is stored into disk. The usage of filters
    on the spatial data increases the implementation cost of this architecture. Authors
    in [11] described Panda architecture for spatial predictive queries, such as predictive
    range, k-NN, and aggregate queries. Panda System will display'
  merge: -1
