  md: '# 13.6 CONCLUSION AND FUTURE WORKS


    Of the two algorithms, SVM algorithm outperforms other classifiers, since it is
    competent in predicting the reaction of a review. In addition to the automation
    of feature extraction, SA can also aid in a variety of predictive activities.
    For instance, the deployment of either a deep learning or ML algorithm in the
    classification movie reviews unveils patterns and sentiments that can benefit
    the movie industry. However, the implementation of such an algorithm is dependent
    on the computing power and size of the data. For Big Data, the process of learning
    can be quite long. Most ML algorithms isolate and learn only influential attributes
    for predictive decision-making. For instance, decision trees identify the most
    promising feature to form the node and build branches around. Theoretically, irrelevant
    attributes reduce the performance of the model. As established in the literature,
    in most cases, both SVM and naïve Bayes algorithms are the most commonly implemented
    algorithms. SVM method is probably the most efficient SA classification algorithm
    today. However, future research prospects should consider the influence of impacts
    of NLP on SA techniques. Additionally, it would be prudent to appraise the performance
    of the models under different feature selection models. Given the existence of
    Big Data, feature selections will increasingly become as important as SA classification.
    Finally, studies should investigate the feasibility of developing a hybrid recommender
    model that uses model-based, memory-based, SA algorithm to help deal with data
    sparsity and cold start problems.


