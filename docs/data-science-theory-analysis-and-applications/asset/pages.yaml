    # 4.6 EXPERIMENTAL STUDY


    In this section, the experimental study is reported. First, it begins by describing
    the metrics and the configuration that were considered in this experimental study.
    Second, it continues by comparing the physical design strategy following the guidelines
    proposed in this work against the default strategy of Neo4j.


    # 4.6.1 EXPERIMENTAL DESIGN


    Datasets: This study was conducted on synthetic datasets. Synthetic datasets consist
    of data produced by a data generator of SNB called DATAGEN [14]. DATAGEN generates
    data based on a scheme of a social network, and it extracts some data collected
    from DBpedia [2], which allows the data to be realistic and correlated; the posts
    constitute the largest amount of data in the generated dataset and contain textual
    data extracted from DBpedia. The database schema contains people who live in a
    city, which is part of a country or continent. These people know others and write
    messages that are tagged according to a tag class. Also, people are members of
    forums that contain messages, they can work in a company, or they can study in
    a university. Additionally, the nodes in the schema have a degree of distribution
    similar to a power law. Thus, to generate the data, DATAGEN creates all relationships
    from an amount of people to ensure that data and link distribution are generated
    as in a real social network like Facebook [2]. According to the documentation
    [12], the DATAGEN is able to generate datasets at scales of 1 GB, 3 GB, 10 GB,
    30 GB, etc. Even though DATAGEN allows any scale factor, its documentation also
    specifies that the maximum recommended factor for a dataset should be 1 TB. In
    our experimental, the dataset size was set to 1, 10, and 100 GB. We limited the
    dataset size because of space requirements. First, the DATAGEN runs on Hadoop,
    which needs a lot of disk space to execute MapReduce jobs. Second, the DATAGEN
    generates CSV (comma separated values) files with considerable sizes. For example,
    1.2 GB of space is required for a 1 GB dataset. Third, our physical design involves
    materialized paths increasing the database size to 2.7 GB for a 1 GB dataset.


    Queries: Besides DATAGEN, benchmark provides a BIW. This workload was designed
