    # FIGURE 9.1 Architecture of an LDI.


    The investigation was conducted by the authors in [19], where patients were recruited
    following their willingness and acceptance to participate, all of which sustained
    burns that are challenging to diagnose with visual assessment. Most of the burns
    sustained by these patients were within 24h and were suspected to be deep dermal
    burns with less than 12% body surface area. To compare the effectiveness of this
    new technique, samples were collected using punch biopsies at 72h after injury.
    The scanning was conducted, which captures images of the burn wounds lying 1.6m
    from the scanner in a controlled room temperature of 25°C, and the scan images
    were generated by the computer. The result of the study shows that there was a
    77% correlation in the assessment by both LDI and clinical assessment. Superficial
    dermal or epidermal depth that was correctly assessed clinically indicated high
    perfusion rate using LDI, where deep dermal and full-thickness burns indicate
    a low perfusion rate. However, 15.3% were assessed clinically as deep dermal wounds,
    but with LDI, there was an indication of high perfusion rate. This shows the overestimation
    by clinicians. Studies were conducted later by different scholars, ranging from
    its ability to predict healing times at early hours after injuries and assessment
    of burns in children.


    Using LDI to diagnose burns in children was described as a challenging task, because
    scanning is expected to be carried out while the patient is still [21], and the
    restlessness is believed to affect the scanning process and render inaccurate
    outcome. As such, the study did investigate the prediction of burn wounds outcome
