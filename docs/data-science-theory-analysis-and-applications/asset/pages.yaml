    # 4.8 DISCUSSION


    In this section, some limitations of our proposed guidelines are discussed. The
    first limitation is that the proposed guidelines assume that all designers own
    basic physical database design skills. With no basic knowledge of physical database
    design, it will be a challenge to start designing with the proposed guidelines.
    In this sense, path materialization can be difficult to apply because Neo4j does
    not provide support for materialized views. It is the designer’s responsibility
    to create and update materialized paths, in addition to rewriting the query by
    replacing the portion of the path to be materialized with the materialized relationship.
    However, a designer can effectively apply the guidelines through experimentation
    and determine which one is the best guideline according to the query characteristics.
    Also, our proposed guideline may be the basis for automating the physical design
    process on graph-oriented NoSQL databases from scratch, which may not require
    further technical training. The optimizer can automatically select the best materialized
    path for a query, and the database engine can keep updated all the materialized
    paths.


