  md: 'Classification of the extracted feature was conducted by training a SVM. SVM
    is a supervised learning algorithm that is primarily used for classification,
    regression, and outlier detection tasks on both simple and complicated data [43].
    It works by finding an optimum separating hyperplane (OSH) that acts as a boundary
    that separates classes of data; this is achieved by solving an optimization problem
    [44]. As a supervised learning algorithm, it learns to classify unseen data based
    on a set of labeled training data. Thus, the training phase is used to build a
    model; thereafter, new unseen data is mapped to one of those learned classes by
    computing the dot product of the model (weights) and image-data features [44].


    Moreover, the evaluation was conducted via k-fold cross-validation (CV) techniques,
    where data is subsampled into k parts equally. CV is a statistical means of evaluating
    learning algorithms [45] that help to avoid sampling error. A special case of
    K-fold (where k=10) CV is used, where k−1 is used for training, and the remaining
    split is used for validation (testing). The iteration continues until all the
    subsamples are exhausted in such a way that each subsample is used for both training
    and testing, and finally, the average of all the tests gives the result as expressed
    mathematically in Equation (9.2) later


    Accuracy = 1/n Σ_{i=1}^{n} A_i  (9.2)


    where n is the number of folds and A_i is the accuracy obtained in each iteration.


