    analysis of our proposed approach in Section 3.4. We have also compared our proposed
    work with some previous studies related to different parameters of classification
    in Section 3.4, and finally, Section 3.5 describes the conclusion of this chapter.




    In the last decade, various researchers adopted various optimization methods for
    solving the feature selection problem. In one of the earliest works, a novel marker
    gene feature selection approach was introduced. In this approach, a few high-graded
    informative genes were elected by the signal–noise ratio estimation process. Then,
    a novel discrete PSO algorithm was used to choose a few marker genes, and SVM
    was used as an evaluator for getting excellent prediction performance on colon
    tumor dataset. The authors have introduced an algorithm called swarm intelligence
    feature selection algorithm, which is mainly based on the initialization and update
    of the swarm particles. In their learning process, they had tested the algorithm
    in 11 microarray datasets for brain, leukemia, lung, prostate, etc. And they have
    noticed that the proposed algorithm was successfully increasing the classification
    accuracy and reducing the number of chosen features compared with other swarm
    intelligence process. The authors have'
