    on a set of test data for which true values are already known, and hence is typically
    used for supervised learning (in case of unsupervised, it is called matching matrix).
    For each class, the confusion matrix gives a summarized form of the number of
    correct and incorrect predictions. With the help of the confusion matrix, we can
