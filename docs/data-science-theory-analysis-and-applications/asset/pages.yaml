  md: '![](img/5025594f89449de2a74e5b325b1e84ef_331_0.png)


    FIGURE 14.4 Rectified linear unit.


    It can be calculated using Equation (14.2):


    $M(x_i) = \text{Max}\left\{ x_{i+k, i+l} \big| |k| \le \frac{m}{2}, |l| \le \frac{n}{2}
    \, k,k \in N \right\}$ (14.2)


    # 14.3.3.3 Rectified Linear Unit


    A rectified linear unit is an activation function, while the input is below zero,
    and the output is zero. Figure 14.4 shows an example of a rectified linear unit.
    It is calculated as follows:


    $R(x) = \max(0,x)$ (14.3)


    # 14.3.3.4 Fully Connected Layer


    Fully connected layer is the same as a neural network in which all neurons in
    this layer are connected with each neuron in the previous layer. It can be calculated
    as


    $F(x) = \sigma(W * x)$ (14.4)


    # 14.3.3.5 Softmax Layer


    Backpropagation can be done in this layer. The networks backpropagate the error
    and increase the performance. If N is a size of the input vector, S(x): R → [0,
    1]^N. It is calculated by


    $S(x)_j = \frac{e^{x_i}}{\sum_{i=0}^{N} e^{x_i}}$ (14.5)


    where 1 ≤ j ≤ N


    # 14.3.3.6 Output Layer


    The size of the output layer is equal to the number of classes. It represents
    the class of the input image.


    $C(x) = \{ i \mid \exists i \forall j \ne i : x_j \le x_i \}$ (14.6)'
