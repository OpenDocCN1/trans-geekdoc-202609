  md: '# 1 Framework for Visualization of GeoSpatial Query Processing by Integrating
    MongoDB with Spark


    S. Vasavi and P. Vamsi Krishna

    VR Siddhartha Engineering College


    Anu A. Gokhale

    Illinois State University


    # CONTENTS


    +   1.1 Introduction .........................................................
    3

    +   1.1.1 Integration of Spark and MongoDB ...................................
    4

    +   1.2 Literature Survey ....................................................
    8

    +   1.3 Proposed System ......................................................
    9

    +   1.3.1 Methodology for Processing Spatial Queries ..........................
    10

    +   1.3.2 Spark Master-Slave Framework .......................................
    11

    +   1.3.3 Algorithms for Sharding ............................................
    12

    +   1.3.3.1 Algorithm for Range Sharding .....................................
    12

    +   1.3.3.2 Algorithms for Zone Sharding .....................................
    17

    +   1.3.4 Dataset and Statistics .............................................
    19

    +   1.4 Results and Performance Evaluation ...................................
    20

    +   1.5 Conclusion ...........................................................
    23

    +   References ..............................................................
    24


    # 1.1 INTRODUCTION


    Companies that use big data for business challenges can gain advantages by integrating
    MongoDB with Spark. The Spark framework provides support for analytics, where
    process execution is fast because of in-memory optimization. Out of various NoSQL
    databases, MongoDB provides a document data model that suits to variety and voluminous
    amounts of data. As such, when integrated, MongoDB and Spark together can index
    data efficiently and help in analytics of data-driven applications.'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Geospatial data can be analyzed to serve the needs of various applications
    such as tourism, healthcare, geomarketing, and intelligent transportation systems.
    Spatial data occurs in two forms: vector and raster that store latitude and longitude
    of objects. Keyhole markup language (KML) is a tag-based structure and can be
    used to display geographic data.


    Tableau uses various file formats such as KML, ERSI shape files, GeoJSON (JavaScript
    Object Notation) files, and MapInfo Interchange formats for geographic data analysis,
    and display. Traditional databases process on structured data that guarantees
    ACID (Atomicity, Consistency, Isolation, and Durability) properties. NoSQL databases
    are developed to store and process unstructured data that guarantees CAP (Consistency,
    Availability and Partition Tolerance) properties with less response time. MongoDB
    has no query language support, but data can be indexed as in relational databases,
    structured as JSON fragments and can process social networking applications, where
    latency has to be optimized. Cassandra monitors nodes, handles redundancy, and
    avoids lazy nodes, whereas MongoDB monitors these activities at a higher granular
    level. Even though some works are reported for labeling and retrieving data from
    MongoDB, they are inefficient either at indexing or at retrieval. This chapter
    aims at adding the functionality of spatial querying for MongoDB database by integrating
    it with Spark.


    Every location on this globe is a representation of intersection of latitude and
    longitude coordinates. Spatial operations are classified by the authors of [1]:
    proximity analysis queries such as “Which parcels are within 100 meters of the
    subway?”, contiguity analysis queries such as “Which states share a border with
    Coorg?”, and neighborhood analysis queries such as “Calculate an output value
    at a location from the values at nearby locations?” Geohashing techniques are
    used to find the nearest location of a specified source location with high precision
    values. Latitude and longitude are used to calculate geohash value: the higher
    the precision value, the more the length of geohash value. Instead of sequential
    processing of the database, a parallel search process must be done for a required
    destination using this geohash. To achieve this, MongoDB is integrated with Spark,
    which is an efficient distributed parallel processing.


    # 1.1.1 INTEGRATION OF SPARK AND MONGODB


    Spark is a distributed system for processing variety of data, and MongoDB aims
    for high availability. By combining both Spark and MongoDB, spatial operations
    on geospatial data can be processed effectively [2]. The MongoDB Connector to
    Hadoop and Spark provides read/write data to MongoDB using Scala. When client
    submits a geospatial query, the master node initially chooses an executor. This
    executor selects sharding based on the shard key. This shard key is used to store
    and retrieve similar keys from the in-memory document collection with high precision
    and optimized processing time. Sharding techniques (horizontal scaling) distribute
    geospatial data into various nodes [3]. Figure 1.1 presents sharding at collection
    level.


    A MongoDB shard cluster consists of shard, mongos, and config servers. Mongos
    acts as an interface where the application layer determines a particular sharded
    cluster for geospatial data. Hashed sharding computes a hash value for each of
    the shard keys.'
