- pgno: 57
  md: 'Like other evolutionary algorithms, this algorithm also begins with a number
    of random initial populations; each member is called a “country.” Some of the
    best members of the population (the equivalent of elites in the GA) are selected
    as imperialists.


    The remaining population is considered as colonies. Imperialists, depending on
    their strength, are pulling their colonies with a specific process. The power
    of all empires depends on both the imperialist country (as the core) and its colonies.
    In mathematical terms, this dependence is modeled on the definition of imperial
    power, in particular, the power of the imperialist country, in addition to its
    average colonial power.


    With the formation of early empires, colonial competition begins among them. Any
    empire that fails to succeed in colonial competition and adds to its power (or
    at least minimizes its influence) will be eliminated from the imperialist competition,
    so the survival of an empire is dependent on its power to capture the colonies
    of competing empires and to control them.


    Consequently, during colonial struggles, the power of the empires will be gradually
    increased, and the weaker empires will be eliminated. Empires will have to advance
    their own colonies to boost their power.


    In brief, this algorithm considered colonialism as an inseparable part of the
    evolution of human history, and its impact on imperial and colonial countries
    and the entire history has been used as the source of inspiration for an efficient
    and innovative algorithm for evolutionary computing.


    In this study, two parameters of ICA, including colony assimilation coefficient
    and revolution probability, are defined by Beta and pRevolution.


    The flow chart of the ICA is shown in Figure 2.6.


    # 2.7 OPTIMIZATION OF THE NEURAL NETWORKS WEIGHTS USING OPTIMIZATION ALGORITHMS


    One of the proper methodologies for optimizing of ANNs is to find the optimal
    values for networks’ weights. This technique can reduce the drawback of the BP
    algorithm based on metaheuristic algorithms’ exploration search technique and
    its improvements on the neural network architecture for reconstructing and fixing
    it during the evolution.


    The numerical value of the weights can be determined based on minimizing an error
    function for training the network from the best position [5,10,24,29].


    Mathematically, a network function f(x) of a neuron can be considered as a combination
    of other functions g_i(x), which can be easily considered as a structure for a
    network, with arrows representing the dependencies among variables.


    A traditional model for forming the nonlinear weighted sum is given in the following:


    f(x) = K( Σ_i ω_i g_i(x) + b_i ) (2.7)'
