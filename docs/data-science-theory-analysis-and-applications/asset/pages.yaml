  md: 'as described in [17]. The eigenvalue works on the principle of calculating
    the variance of the particular feature with the total number of records for the
    particular feature. The basic idea is that the more the values of a particular
    feature scattered in a more varied range, the feature is fit for being used for
    the purpose of classification. Whenever a penguin goes to a particular feature,
    the eigenvalue function is used to get the variance of the feature, and this is
    the fitness. Based on this fitness value, the features are selected based on the
    cut-off criteria. Now, suppose we have a dataset of {x(i), i = 1, 2, 3, ..., m}
    of m different features. So the data lies in an m-dimensional subspace and the
    data basically lies between the diagonal of this m dimensional subspace. Now,
    we find the mean of the data using Equation (3.1) as follows [17].


    $$\mu = \frac{1}{m} \sum_{i=1}^{m} x^{(i)}\tag{3.1}$$


    Replace the x^{(i)} data with x^{(i)} - μ, and from this, we get the mean of the
    data normalized. However, the data with zero and no mean is omitted and normalized.
    Now, we find the variance of the data using Equation (3.2).


    $$\sigma_{j}^{2} = \frac{1}{m} \sum_{i} \left(x_{j}^{(i)}\right)^{2}\tag{3.2}$$


    Replace x^{(i)} with X^{(i)}/σ, and from this, we get the data scaled in a particular
    range, and this normalizes the data with respect to the whole dataset and all
    features. This is the final step of normalization. This way, we get the variance
    of the data [17]


    This resultant variance is the score of the feature with a set of all data records.
    This represents how the data is scattered in the maximum to minimum scale for
    the feature, which will determine the features that should be suitable for classification.


    # 3.3.2.3 Position Update Logic


    The penguins will usually go towards the location that has a better food quantity
    than the others. Here, the penguins would initially go to a feature respective
    to that fitness value acquired f(x^{(i)}), which is in a scale of 0 to 1. This
    fitness value is multiplied with m, where m is the total number of features, and
    we get the new position for our penguin for the next iteration.


    $$\text{Position,}(n+1) = f(x(i))*m\tag{3.3}$$


    Based on this position update logic, the penguins will keep updating their position
    until they find the optimal amount of food.


    # 3.3.2.4 Oxygen Update Logic


    For the penguins, the quantity of oxygen is a limiting factor that restricts them
    to continue the whole searching procedure for an infinite amount of time. The
    oxygen is a physical quantity that is basically limited to all beings. Whenever
    their oxygen reserve is depleted, they return back and end the search for food.
    In our approach of PeSOA, we have used the idea of oxygen to limit the number
    of iterations the penguins will go,'
  merge: -1
  img_proc: true
