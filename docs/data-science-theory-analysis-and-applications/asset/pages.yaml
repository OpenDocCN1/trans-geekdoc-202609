- pgno: 281
  md: '+   - Topological features are the most adequate for Writer Retrieval in handwritten
    documents. RLF descriptor shows the best accuracy for the two datasets. Actually,
    even with two lines of text, the system can achieve a high precision with small
    loss at farther ranks. In fact, when testing cropped ICDAR-2011, the MAP reaches
    83.16%, and the loss of accuracy from TOP-2 to TOP-7 is about 13.7%, which is
    small compared with all other systems.

    +   - The pixel density descriptor provides insufficient information, since it
    replaces each cell by a single density measure. Such characterization cannot reflect
    the writing style of each individual, the reason for which retrieval scores were
    substantially weak. Compared with RLF, there is a loss of accuracy of about 24%
    at TOP-2 and 45% at TOP-7.

    +   - Furthermore, classical LBP outperforms LBPriu with a gain of 7.69% and 12%
    at TOP-2, with original and cropped sets, respectively. However, this descriptor
    seams to need more than two lines of text, since its performance drops significantly
    with the cropped dataset. Actually, the MAP loses 37.41%.

    +   - Gradient descriptors show competitive performance, especially GLBP, for
    which the precision reaches 97.6% for the original set and 89.2% for the cropped
    set. HOG feature requires a local calculation using uniform grid to enhance retrieval
    accuracies. However, it scores still lower than those collected using GLBP, RLF,
    and LBP16x2.


    # 11.7 CONCLUSION


    Currently, libraries contain a huge number of digitized documents, including historical
    manuscripts and other archives. Since the manual handling of these data is not
    trivial, researchers tried to develop automatic navigation tools such as spotting
    and retrieval techniques. In this respect, Writer Retrieval systems are developed
    to find all documents belonging to the same person. Specifically, such systems
    should recognize the handwriting of the same individual, whatever the language
    and textual content. In return, they should differentiate handwritings of different
    individuals. This can be done by using features that reduce the intrawriter variability
    while increasing the interwriter variability. To find suitable features for the
    Writer Retrieval task, this work evaluates various kinds of features. Specifically,
    we used LBPs and its uniform versions LBPriu, HOGs, and GLBP as gradient descriptors.
    Besides, two topological features such as RLF and pixel density are used. To make
    a straightforward evaluation, several similarity and dissimilarity measures, including
    Manhattan, Euclidean, Canberra, Chi-square, Jaccard distance, and Cosine similarity
    are employed in experiments. Experiments conducted on the two ICDAR-2011 datasets
    showed that RLF descriptor outperforms all other descriptors as well as the state
    of the art. These findings reveal that pixel run length provides a pertinent characterization
    of the writing style. On the other hand, textural and gradient features, such
    as LBP16x2, GLBP, and HOG provide a satisfactory retrieval, especially when associated
    with a suitable dissimilarity measure.'
