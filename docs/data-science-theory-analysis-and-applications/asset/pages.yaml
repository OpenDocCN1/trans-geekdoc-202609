    # 11.5.3 Retrieval Results


    Writer Retrieval test is carried out by considering each document from the dataset
    as a query. Specifically, a vector containing dissimilarities between the query
    and all existing documents in the dataset is calculated and ranked to select the
    most similar documents. Tables 11.3 and 11.4 jointly report the retrieval results
    obtained at different ranks and MAP scores using all descriptors with their suitable
    dissimilarities. For both datasets, RLF-based system outperforms all other systems.
    In fact, the precision reaches 99.03% at TOP-2 for the original ICDAR-2011 and
    96.15% for the cropped version. The MAP scores are about 92.22% and 83.16%, respectively.
    On the other hand, GLBP and LBP16x2 show competitive performance. However, the
