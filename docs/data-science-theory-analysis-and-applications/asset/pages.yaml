    # 8.1 INTRODUCTION


    This work illustrates a possible physicochemical trait that is unique to mutated
    proteins that underlie a malignant disease known as Brugada syndrome (BrS). We
    speculate that this information could be incorporated into a bionanosensor to
    identify the related proteins by this notorious physicochemical trait.


    The electrical activity of the heart is based on the proper function of ion channels.
    There are specific pores located mainly on their cytoplasmic membranes that permit
    the passage of ions through it. In subjects who have BrS [1], specific defects
    in some of these channels have been reported, resulting in a characteristic electrocardiographic
    phenotype and the possibility to generate malignant ventricular arrhythmias [2].
    Mutations in BrS-related proteins affect the physical form of these ion channels.
    Currently, the only treatment that can effectively prevent this syndrome is the
    insertion of an automatic implantable cardiac defibrillator, or, in subjects who
    already have such a device, the recurrence of ventricular arrhythmias can be prevented
    with a quinidine treatment [3].


    Medical studies on close relatives of subjects diagnosed with BrS have determined
    that this syndrome can be inherited [4], as some of these relatives also have
    mutations in BrS-related proteins. In the UniProt database [5], there are 4,388
    overrepresented (redundant) BrS mutated proteins from 36 proteins [2] that underlie
    this abnormality. This overrepresentation or duplicity is not exclusive of this
    database, since it often comes from the multiple functions found for the same
    protein.


    To develop a new method for the molecular diagnosis of the syndrome, based on
    parameters other than the detection of the mutation, this work introduces a highly
    discriminating metric based on the concept of electronegativity in Pauling’s work
    [6] called “polar profile” [7]. Several protein groups were used in the evaluation
    of the BrS mutated proteins that were selected based on one of the following factors:
    (i) they are peptides or proteins previously used by this team to carry out analysis
    of functional identification, (ii) there is a large number of corresponding proteins
    found in nature, (iii) they have a leading role in diseases that affect humans,
    and (iv) they are closely related to the BrS mutated protein, as it is the case
    of BrS proteins. These protein groups are (i) a set of BrS proteins from which
    the BrS-related mutated proteins derive; (ii) a set of antibacterial peptides
    named selective cationic amphipathic antibacterial peptides (SCAAP) [8], and this
    group stands out for being highly toxic to bacteria but causes almost no harm
    to human cells; (iii) three sets of antimicrobial proteins: bacteria, fungi, and
    viruses extracted from UniProt and APD2 [9] databases; (iv) six sets of lipoproteins
    extracted from UniProt database [5] and associated with'
