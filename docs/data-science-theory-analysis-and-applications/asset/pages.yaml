  md: "U(P)=|s(g_{p-1}-g_c)-s(g_0-g_c)|+ sum_{p=1}^{p-1}|s(g_p-g_c)-s(g_{p-1}-g_c)|\
    \ (11.4)\n\nWith g0 = g_p\n\n# 11.3.2 Histogram of Oriented Gradients\n\nThis\
    \ descriptor was introduced by Dalal and Triggs for human detection [13]. It aims\
    \ to describe local shape orientation through the distribution of gradient intensities.\
    \ HOG was successfully employed in several handwritten analysis applications,\
    \ such as signature verification [14], writer soft-biometrics prediction [15],\
    \ and word spotting [16]. Basically, HOG is calculated by applying a dense grid\
    \ over images where a local histogram is computed for each region. Obtained histograms\
    \ are concatenated to form a HOG descriptor [17]. More specifically, the HOG calculation\
    \ in a given cell is summarized in Algorithm 1.\n\n# Algorithm 1. HOG Calculation\n\
    \n+   1. For each pixel, calculate horizontal and vertical gradients G_x and G_y.\n\
    +   \n+   G_x(x,y)=I(x+1,y)-I(x-1,y) (11.5)\n+   G_y(x,y)=I(x,y+1)-I(x,y-1) (11.6)\n\
    +   \n+   2. Calculate the gradient magnitude and phase by using Equations (11.7)\
    \ and (11.8), respectively:\n+   \n+   |G(x,y)||= sqrt(G_x^2(x,y)+G_y^2(x,y))\
    \ (11.7)\n+   θ(x,y)=tan^{-1}(G_y(x,y)/G_x(x,y)) (11.8)\n+   \n+   3. Histogram\
    \ calculation: Accumulate magnitude values for each range of orientations that\
    \ are taken in the interval [0°, 360°] (see Figure 11.3), according to [13].\n\
    \n# 11.3.3 Gradient Local Binary Pattern\n\nGLBP was introduced for human detection\
    \ [17]. Recently, it has been successfully employed for handwritten signature\
    \ verification and soft biometrics prediction [8,16,18,19]. GLBP consists of computing\
