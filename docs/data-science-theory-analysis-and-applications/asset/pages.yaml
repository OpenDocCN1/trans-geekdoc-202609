- pgno: 221
  md: 'Due to proliferation of technology and the increase in imaging capturing devices,
    such devices are very expensive [8] and not user-friendly, and a huge volume of
    clinical burn images has been accumulating every day and are processed by human
    visual system. However, interpretation of such images by humans is prone to errors
    due to the fatigue nature, and above all, the assessment is highly subjective
    [6,7]. The subjectivity of this method has been identified with two common problems—overestimation
    and underestimation. Overestimation of burn may subject a patient to unnecessary
    skin grafting/surgery, whereas an increase in hospital delay and possibility of
    subjecting patient to a high risk of infection is associated with underestimation
    of burns [8].


    Towards this end, this work is primarily intended to determine whether ML can
    be used to discriminate between burn and normal skin. The skin burn images comprise
    of superficial and full-thickness injuries. The rest of the chapter is organized
    as follows: Section 9.2 presents related literatures; Section 9.3 presents the
    overview of Convolutional Neural Network (ConvNet); goals and methodology are
    presented in Section 9.4; experimental result and discussion are presented in
    Section 9.4 while Section 9.5 concludes the work.


    # 9.2 LITERATURE REVIEW


    In this section, various causes of burn injuries and its classification are presented.
    Additionally, the section presented a review on some effective diagnostic procedure
    of addressing burn injuries and highlighted some associated limitations.


    # 9.2.1 Skin Burns


    According to WHO “burn is an injury caused by heat (hot objects, gases, or flames),
    chemicals, electricity and lightening, friction, or radiation” [9]. It is an injury
    that damages the body tissues, affecting people of different ages. It is one of
    the most disturbing injuries in the world affecting children and adults, though
    children are affected in most cases.


    # 9.2.2 Causes of Burn Injuries


    Burns are caused via various processes such as thermal, chemical, friction, and
    radiation [10]. Burns that are caused by flames, hot objects, hot liquid, and
    steams are referred to as thermal burns. Burns caused by hot liquid and steams
    are sometimes referred to as scald burns. Corrosive substances such as acid are
    also known to cause severe damage to the skin when they come in contact, and this
    category of injury caused by such substances are called chemical burns, mostly
    occurring due to accidental spillage in industries/workplaces. Frictional forces
    relative to each other generate heat and leads to mechanical commotion of the
    skin resulting in friction burn injury. Burns caused by radiation are mostly due
    to exposure to ultraviolet sun radiation. This is in addition caused to prolong
    exposure to therapeutic radiations in hospitals as well as industry workers dealing
    with radiation substances. The severity of the burn depends on how long the body
    gets exposed to any of the causes mentioned.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# 9.2.3 BURNS CATEGORY


    A burn is categorized into three stages depending on the severity or how deep
    the body tissue is affected:


    +   - First-degree burn

    +   - Second-degree burn

    +   - Third-degree burn


    First-degree burn is a situation where burn affects only the uppermost layer of
    the skin (epidermis) [11]. This type of burn is mostly common in Caucasian people,
    where sunlight is usually the causative agent. This category of burn does not
    raise much concern due to its ability to heal spontaneously within the first 7
    days after injury. The most common feature that identifies this type of burn is
    reddish color, absence of swelling with no blistering, but slightly painful. Burn
    does more harm when its impact reaches the layer beneath the epidermis (dermis).
    This is because the demise housed most of the essentials organs that keep the
    skin in good shape. Most of the nutrients and oxygen supplied to the epidermis
    are contained in the dermis. Therefore, when burn affects this layer, this means
    that the body won’t be able to regulate body temperature as well as vitamin D
    synthesis. In a nutshell, when burn destroyed the epidermis and affects the dermis
    layer, this category of burn is referred to as second-degree burn [12]. Burns
    extending deep to the subcutis layer, destroying the whole dermis, thereby exposing
    the subcutaneous layer including muscles and tendons is called third-stage (degree)
    burns [10,12]. In other words, this category of burn is called full-thickness
    burn since all the three layers of the skin are affected.


    # 9.2.4 BURN ASSESSMENT TECHNIQUES


    This section presents a succinct review of burn evaluation techniques.


    # 9.2.4.1 Clinical Assessment


    Clinically, burn assessment begins by capturing the history of injury, such as
    mode of injury, contact duration with the heat, and the type of first aid given
    to the patient. Afterwards, burn is assessed based on the physical appearance
    of the wound by considering color appearance, sensitivity to pain, and capillary
    refill. The features observation is conducted by human expert, and diagnosis is
    based on human judgment, which depends on the level of experience. Color is the
    most considered characteristic used by medical personnel when assessing burns
    visually and during blister formation. Burns that only affect the upper layer
    of skin (superficial) is known to be reddish, dry, and with no blistering. If
    the skin disruption and the reddish appearance of the burn wound is considered
    as a criterion to identify burn injury, there exist skin injuries that share similar
    physical characteristics with burn, such as bruises, as such a potential misdiagnosis
    may occur. Therefore, in a situation that involves similar characteristics shared
    by different skin injuries, probability of misdiagnosis is very high [13]. Misdiagnosis
    in this context can be likely of assessing and categorizing'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'burns as something different, which eventually will lead to unwanted complications
    as a result of wrong treatment.


    Additional means of diagnosing burns is through histological means (biopsy), which
    involves extracting sample from the patient’s body and then analysing to determine
    the extent of injury. This technique is being used in hospitals as a gold standard;
    however, its invasive nature causes pains and leaves patients with scary marks.
    Moreover, a biopsy only covers a limited portion of the burn site, and in most
    cases, biopsy misses the most critical site due to the sampling variation [14].


    Pain experienced by individuals who sustained burn injury are only a fraction
    of the total pains. Pains are experienced during the diagnostic processes such
    as identification of burn severity. Therapeutic procedures in assessing burn,
    especially those that affected dermal layer and subcutaneous tissues required
    pharmacological techniques such as administration of pain relievers (e.g., opioid
    analgesics). However, it is reported that, some individuals do not react to opioid,
    as such patients are subjected to experience unquantified pains during the debridement
    process [15]. In addition, there is likely that even those that react to opioid
    administration experience little pains. Unfortunately, the procedure of recognizing
    the burn severity is also questionable. Most of the diagnostic procedures in hospitals
    adopt visual inspection to determine the nature of burn.


    # 9.2.4.2 Blood Perfusion Measurement


    Within the tissue of living organisms, circulatory channels are responsible for
    transporting important materials such as oxygen, hormones, and other nutrients
    needed to keep the living tissues in perfect working condition. However, those
    substances are carried out by blood, and the flow of blood through the circulatory
    system is referred to as blood perfusion [16,17]. Measurement of blood flow by
    using noninvasive techniques, such as laser Doppler flowmetry and laser Doppler
    imaging (LDI), has provided a good and reliable procedure for assessing burn wounds
    [18] and has been recommended by the United States Food and Drug Administration
    (FDA).


    # 9.2.4.2.1 Laser Doppler Imaging


    The first study to propose the usage of LDI in burn assessment was in 1993 [19],
    even though the idea of using noninvasive method was coined since 1970s [20].
    This new device was proposed to provide an efficient means of diagnosing tissue
    injuries such as burn wounds without contact, thereby minimizing pains experienced
    by patients. It works based on the principle that light traveling undergoes frequency
    shift when colliding with a moving object. What is the moving object in the body
    tissue? The moving objects in the body tissue are blood and its constituents.
    The architecture of this device is depicted in Figure 9.1, and it consists of
    a laser tube, four assembled arrays of photodiodes, scanning mirror, and a computer
    device. The laser tube that transmits laser light is mounted behind the photodiodes,
    the beam of light passes through the assembled photodiodes that is then reflected
    by the scanning mirror. The mirror directs the light on to the scanning area where
    the burn wound to be assessed is expected to be positioned. The mirror increases
    the total coverage area by the reflected light on the body surface. Light reflected
    by the scanned object is collected again by the mirror and back to the photodiodes.'
