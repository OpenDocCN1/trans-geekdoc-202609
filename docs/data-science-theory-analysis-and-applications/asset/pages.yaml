    # 13.3.1 Naïve Bayes Classifier


    The classifier is of probabilistic nature, and it relies on Bayesian probability
    theory. It is the simplest and easiest algorithm to implement. The classification
    model probability is based on the distribution of features of the reviews. The
    posterior probability is based on the distribution of features that Equations
    (13.1) and (13.2) illustrate. In application, naïve Bayes implements an algorithm
    that omits the position of the tag in the rating matrix. The Bayes theorem for
    predicting the classes in which each tag belongs is as follows [37]:


    ```

    P(tab|feature) = P(tag)×P(feature|tag) / P(feature)   (13.3)

    ```


    P(tag) refers to the probability of the tag in the rating matrix, and it shows
    the likelihood of a random user giving the review. P(feature | tag) refers to
    the prior probability for the algorithm, which classifies a feature as tag [37].
    However, the naïve algorithm must meet the requirement of independence among the
    features so that Equation (13.3) becomes [37]


    ```

    P(tab | feature) = P(tag)×P(f1 | tag)×...×P(fn | tag) / P(feature)   (13.4)

    ```


    Equation (13.4) and the improved version of Equation (13.3) solve the problem
    of the prediction of positive classes, which is being higher than that of negative
    classes [37]. Despite the improvement, the average accuracy of the model reduces,
    but both precision and recall improve using the new model.


    # 13.3.2 Support Vector Machine


    SVM is a nonprobabilistic positional notation additive classifier represented
    in this research paper by every evaluation in the form of a variable information
    component in the space. The process utilized in the analysis of full vectorized
    data and the major design behind training the representation is to search for
    a hyperplane denoted by w. The SVM algorithm selects smaller numbers of important
    boundary instances (support vectors) from each tag and creates linear discriminant
    functions that separate the features [38,39]. Such an approach overcomes the limitations
    of linear boundaries and allows for the inclusion of additional nonlinear terms
    in the LDF, and hence the possibility of developing quadratic, cubic, or any higher-order
    decision-making boundaries in the model. Collecting textual information vectors
    defined as being optimally split up by the hyperplane is simply referenced when
    there is no fault and when the detachment between the nearest points of every
    class and hyperplane is complete. Following the preparation of the model, experimental
    evaluation can be mapped into a similar space and can be expected to be assigned
