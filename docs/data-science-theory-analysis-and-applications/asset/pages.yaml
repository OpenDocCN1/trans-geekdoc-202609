    # 14.6 CONCLUSION


    In this chapter, an FDCNN and VGG16 model for recognizing human emotions from
    body movements on sequence of frames were proposed. This model is representing
    deep features to extract saliency information at multiple scales. The proposed
    method is evaluated on a challenging benchmark emotion dataset (University of
    York). The emotions such as Angry Jump, Angry Sit, Angry Walk, Fear Jump, Fear
    Sit, Fear Walk, Happy Jump, Happy Sit, Happy Walk, Sad Jump, Sad Sit, Sad Walk,
    Untrustworthy Jump, Untrustworthy Sit, and Untrustworthy Walk are used in this
    work. Among the two models, VGG16 performed better recognition of emotions. The
    performance of this model is better than the baseline models. Future work aims
    at developing research applications to recognize the emotions of children with
    autism spectrum disorder (ASD). The autism children express their'
