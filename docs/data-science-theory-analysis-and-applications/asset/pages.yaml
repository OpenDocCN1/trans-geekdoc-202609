    # 8.5  CONCLUSIONS


    In this work, a bioinformatics algorithm PIM was tested and validated; its “fingerprint”
    enables the rapid identification of BrS mutated proteins. The polar profile of
    the BrS mutated proteins analyzed in this study is different from the polar profiles
    of proteins from the structural groups: intrinsically disordered proteins, or
    those of proteins from the functional groups: lipoproteins, or fungi, virus, or
    bacteria. On the other hand, the polar profile of each protein group associated
    with BrS mutated proteins serves as an effective discriminator. Therefore, it
    is concluded that it is possible to use the polar profile as a “fingerprint” that
    identifies, with high efficiency, those mutated proteins. The polar profile constitutes
    a metric that only'
