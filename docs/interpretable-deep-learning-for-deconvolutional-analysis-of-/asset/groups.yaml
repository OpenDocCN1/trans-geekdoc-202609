    # SUMMARY


    The widespread adoption of deep learning to neural activity relies on "black-box"
    approaches that lack an interpretable connection between neural activity and network
    parameters. We propose using algorithm unrolling, a method for interpretable deep
    learning, to design the architecture of deconvolutional neural networks and obtain
    a direct interpretation of neural weights in stimulus-driven single-neuron activity
    through a generative model. We introduce deconvolutional neural network (DUNL),
    and demonstrate its versatility by applying it to deconvolve single-trial signals
    across multiple areas and recording modalities. We uncovered multiple salience
    and prediction error signals in dopamine neurons in the somatosensory thalamus
    and characterize the heterogeneity of neural responses in the motor cortex and
    striatum under unstructured, naturalistic experiments. Our work leverages advantages
    in interpretable deep learning to provide a mechanistic understanding of neural
    activity.


    # INTRODUCTION


    Understanding neural activity at both the single-neuron and population levels,
    and their relationship to behavior and environmental factors, is a key goal in
    neuroscience. Recent advances allow for long recordings of neurons during complex
    tasks. When neural signals vary over time or subsets of neurons exhibit complex
    codes with varying levels of selectivity—for example, neurons in the visual hierarchy
    select tasks (5-9) and neuromodulatory pathways, such as dopamine neurons, respond
    to various environmental and internal stimuli.


    To understand how single neurons support multiple representations, scalable methods
    are needed to deconvolve neuronal activity and non-overlapping components that
    capture heterogeneity in the population. We present a deep learning-based deconvolution
    method to address this.


    A reasonable deconvolution method should first handle single data inputs without
    requiring trials or assemblies. It should work for both natural and artificial
    tasks, with minimal or no trial length (11-12).


    Second, the method should relate to the signal source, whether spike count or
    point signals such as calcium levels measured via fluorescent channels.


    Third, the method should employ expressive mappings from layers to capture neural
    data complexity.


    Fourth, it should be interpretable (supplemental discussion), addressed here in
    two contexts: (1) within the network, where architecture, weights, and representations
    are linked to the optimization process and a generative model, (2) providing a
    mapping between stimuli (internal or external) and latent variables. For instance,
    a probabilistic model adaptable to various data types can capture neural response
    logic and temporal sparsity, through neural impulses. This interpretability relies
    on domain knowledge, which structure data or hypotheses. The method should be
    scalable and practical for analyzing large-scale neuroscience datasets.


    Most statistical neural data methods are primarily designed for dimensionality
    reduction to find a low-rank structure that governs the neural data, which makes
    them suitable for deconvolution. Examples include principal-component analysis
    (PCA)$^{25-27}$, non-negative matrix factorization (NMF)$^{28-30}$, sparse component
    analysis (SCA)$^{31}$, v-MIF$^{32}$, and ICA deconvolution methods which recover
    low-rank structures with the data methods. Generalized linear model (GLM)$^{36}$
    and point processes for neural sequences$^{37}$ point out data with low-rank structures
    and offer interpretability by separating data activity from noise. However, none
    of these methods fully meet all of the discussed requirements, such as scalability
    or adherence to the statistics of the signal.


    The limitations of methods and the scalability of deep learning have motivated
    the exploration of approaches for neural data. Prior work has many desiderata—extracting
    high-dimensional latent spaces from neural data using non-deep architectures$^{38}$.
    However, these methods lack a direct link between latent variables and neural
    counts, making deconvolution difficult due to the "black-box" nature of such models$^{39-41}$.


    Here, we propose a novel framework, deconvolutional neural learning (DUNL), combining
    convolutional sparse coding (dictionary learning), which provides a flexible framework
    to deconvolve single-trial activity into interpretable, local components. This
    is enabled by the use of sparse coding as our generative model. To showcase DUNL''s
    versatility, we applied it to five experiments. First, we decoded stable and reward
    prediction (RPE) events from multiplexed signals. Second, we deconvolved outcomes
    from associative learning. Third, we performed simulations of decoding and prediction
    in the thalamus. Fourth, we extracted neural responses from the piriform with
    low SNR conditions. Fifth, we characterized dopamine activity in the striatum
    during a realistic experiment. Finally, we evaluated DUNL, highlighting its strengths:
    local interpretability, scalability, and generalization in data-limited scenarios.


    # RESULTS


    ## Sparse deconvolution learns structures in single-trial activity


    We aim to decompose single-trial activity into pulse-like responses, to recurring
    events, by identifying low-rank structures in neural data. Observed neural activity
    is represented as convolution of sparse codes and a dictionary with varying shapes
    and magnitudes. Our goal is to reconstruct data by learning these kernels through
    optimization. We want to account for the sparsity of spikes by modeling the mean
    activity through a passed function like the nonparametric exponential (Gaussian,
    Binomial, or Poisson) (see Table S1) for spiking activity and Gaussian with mean
    $\mu$.


    Neural activity $y_t$ is modeled as the convolution of kernels $h_k$ and sparse
    codes $x_{ki}$, with a baseline activity $b_t$ (Figure 1B). Deconvolution identifies
    local temporal patterns and discovers low-rank structures (but can only capture
    long-term features). Kernel learning goes beyond the pre-defined methods by learning
    them automatically. The learned kernels and sparse codes are interpretable: kernels
    represent shared characteristics across trials, and sparse codes represent individual
    responses.


    Indices indicate time events associated with kernel $k$, with amplitudes $x_{ki}$
    representing neural response strength. In functional system identification, this
    method captures cause-effect relationships: sparse codes represent the timing
    of the effect, while kernels represent the response strength. However, the kernels
    in the model are non-parametric and fully learned from data, without adhering
    to a user-parametric form, and codes are sparse. We learn the kernels and $x_{ki}$
    by minimizing the loss $\sum (y - \hat{y})^2$, regularized by desired properties
    in the kernels and codes. Specifically, we use a sparsity prior to promote a few
    activations in time, and optionally, a second-order covariance structure to capture
    dependencies among kernels (e.g., discouraging simulating).

