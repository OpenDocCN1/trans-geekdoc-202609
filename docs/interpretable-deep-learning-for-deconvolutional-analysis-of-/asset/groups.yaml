    值得注意的是，DUNL 只有当输入是稀疏的或为每个应用提供时才能找到解码的位置。如下所示$^{49}$（图 1），我们将优化映射到编码解码器架构。编码器是一个与生成式模型（解码器）共享相同参数的深度结构卷积网络。它接收单个神经元的观测值
    $y_{i}$ 并将其编码为稀疏表示 $x_{i}^{j}$，通过局部解释（对于代码和内核；参见补充信息），并且可以跨神经元和试验进行并行化。


    为了证明 DUNL 的能力，我们首先尝试合成脉冲数据。实验由局部内核特征的两类事件组成。在单个试验中，事件随机发生。我们估计底层速率、事件的时间幅度——无论是稀疏还是稠密的（由多个内核组成）。DUNL
    成功地将数据合成内核和代码（图 1），并在此实现。我们引入了一种新框架，将时间序列恢复为内核的稀疏叠加，且内核和代码都是可训练的—与 GLMs 不同，我们基于二元函数定义它。


    Neuron 17, 1151–1168, 2025年4月16日


