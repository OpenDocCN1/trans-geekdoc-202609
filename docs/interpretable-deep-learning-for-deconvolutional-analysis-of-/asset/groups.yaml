  mdcn: "\n\n# CellPress\n\n# Neuron（神经元）\n\n深度学习架构为单次试验神经数据分析提供了一种高效且可扩展的工具。美国研究基金\
    \ (NARSAD) 年轻研究员补助第 305 号资助 S.M.；哈佛大脑行为倡议资助 P.M.；本研究部分工作得益于加拿大研究卓越基金，该基金通过麦吉尔大学的“健康大脑生活倡议”授予了\
    \ P.M.。\n\n我们的框架具有灵活性，需要选择几个超参数（例如：稀疏正则化因子、展开迭代次数、平滑正则化和卷积核数量）。我们为参数选择提供了指导。例如，合适的卷积核数量可以通过识别和量化层与层之间的交叉相关性来确定。重要的是，必须指定卷积核的数量和核时间窗口——不需要额外的参数化。之前的方法³\
    \ DUNL 可以学习任何卷积核（另见下文）。当条目数量已知时，DUNL 具有其展开架构的 k-稀疏操作对参数的选择具有鲁棒性。\n\n# 作者贡献\n\n\
    - 概念构化：B.T., S.M., P.M., 和 D.B.\n- 方法论：B.T. 和 D.B.\n- 形式分析：B.T. 和 S.M.\n- 可视化（体内实验）：S.M.,\
    \ H.W., 和 S.T.\n- 研究：N.U., V.N., 和 D.B.\n- 数据整理：B.T., S.M., H.W., 和 S.T.\n- B.T.,\
    \ S.M., V.N., V.A., P.M., 和 D.B. \n- 项目管理：P.M. 和 D.B.\n- 资金获取：S.M., N.U., V.A.,\
    \ P.M., 和 D.B.\n\n\n\n通过 k-稀疏操作，可以使用变分集对 `j` 进行调优。关于 DUNL 局限性的详细讨论，请参见补充材料。\n\n\
    # 利益声明\n\n作者声明无竞争性利益。\n\n为了证明我们模型的通用性，我们将其应用于不同的实验设置，突出了现有工具的功能。我们的框架可以扩展到稀疏区域之外，提供可解释的表示。对于更复杂的模型，例如基于卡尔曼滤波的神经网络或具有自适应常数的\
    \ 2D 滤波器，我们的工作迈出了通过卷积字典学习利用深度学习优势的第一步，以获得对神经动力学及其计算过程的机制性见解。\n\n# AI 及 AI 辅助方法声明\n\
    \n在准备本项工作期间，作者没有使用任何推理或内容生成技术。作者对出版内容承担全部责任。\n\n# STAR*\n\n详细方法见论文的在线版本，包括以下内容：\n\
    \n- 关键资源表\n- 方法详述\n- 体内实验\n- 符号说明\n- 数据分布\n- 生成式模型\n- 平滑稀疏卷积学习\n- 可解释的展开神经网络 (DUNL)\n\
    - 评估\n- 深度学习中的可解释性\n- DUNL 局限性\n- D.U.N.L. 用于神经信号分析的前期工作\n- 量化与统计分析\n- 模拟细节\n\
    - 实验细节\n- 模型比较\n- 模型训练细节\n\n# 资源可用性\n\n# 主要联系人\n\n更多信息和资源的请求请联系主要联系人 Dean Baamba\
    \ (baamba@seas.harvard.edu)。\n\n# 可用材料\n\n本研究未产生新的试剂。\n\n# 数据和代码可用性\n\n- 所有代码和模型已存储在\
    \ GitHub 仓库：https://github.com/debaamba/dunl-model。\n- 本研究的部分数据已存储在数据仓库：https://doi.org/10.1763/zenodo.39253\n\
    - 使用这些数据所需的任何额外信息可根据要求向主要联系人获取。\n\n# 致谢\n\n我们感谢评审员提出的建设性反馈。感谢 Ignacio Sanchez-Sánchez\
    \ 在多巴胺区域的概念和技术性合作。感谢实验室的所有成员、Murthy 以及其他人提供的有帮助的讨论，特别是 Carlos Janevatin-Zadeh、Adam\
    \ S. Lowell 和 Henry S. Ford 在统计分析方面提供的帮助 (https://doi.org/10.5291/zenodo.392953)。我们感谢支持本工作的资助机构：美国英国国防\
    \ (US UK DO)、MOQ 以及欧洲研究委员会 (ERC) 的 ERCPIERC (资助号 11-WFF-1516-8) 以及加拿大科学基金计划 (L10000/2018)\
    \ 资助 S.M.；大脑与行为基金。\n\n# 补充信息\n\n补充信息可以在 https://doi.org/10.1016/j.neuron.2022.05.006找到。\n\
