    # ## METHOD DETAILS


    # ### In vivo experiments


    A total of 4 C5BL/6J mice (Jackson Laboratory) were used in the new experiments
    to measure dopaminergic activity. Two Dat-Cre mice created by crossing with C5BL/6J-GCAG-ITAG2/+
    (B6.Cg-Igstn148-tm148-GCAG-ITAG2/j) (Jackson Laboratory) and one transgenic Dat-Cre:Ai148
    (F6 background) were used for behavior and electrophysiology in the offspring
    experiments with C5BL/6J mice obtained from Jackson Laboratory, aged two months
    at the start of experiments. After the completion of all experiments, mice were
    euthanized, and post-mortem histology performed to confirm the location of electrophysiological
    recordings. Animals were housed on a 12h/dark 12h light cycle and performed the
    tasks during the day. Ambient temperature was kept at 75 ± 5 F, and humidity was
    kept below 50%. Animals were house-grouped (2–5 animals)/cage until individually
    housed for training and testing. Procedures were performed in accordance with
    the National Institutes of Health Code for the Care and Use of Animals and approved
    by the Harvard Institutional Animal Care and Use Committee (IACUC).


    # ### Two-photon calcium imaging


    Surgeries were performed with GREN lens injection under anesthetic conditions.
    Mice were anesthetized with isoflurane (1–2 at 0.5 L·min⁻¹) and local anesthetic
    (lidocaine (2%) (0.5s) 1 minute;'
