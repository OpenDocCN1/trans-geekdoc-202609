    # CellPress


    # Neuron


    deep-learning architectures, providing an efficient and scalable tool for single-trial
    neural data analysis. Research Foundation (NARSAD) Young Investigator grant no.
    305 to S.M.; and the Harvard Brain Behavior Initiative to P.M.; This research
    was carried out in part thanks to the Canada Research Excellence Fund, awarded
    to P.M. through the Healthy Brains Lives Initiative at McGill University.


    Our framework is flexible, requiring the selection of a few hyperparameters (e.g.,
    sparsity regularizer, number of unrolling iterations, smoothing regularization,
    and number of kernels). We provide guidance for parameter selection. For example,
    the appropriate number of kernels can be determined by identifying and quantifying
    the cross-correlation between layers. Importantly the number of kernels and kernel
    time window must be specified—no additional parameterization is needed. Previous
    methods³ DUNL can learn any kernel (also see). When the amount of entries is known,
    DUNL''s k-sparse operation with its unrolling architecture is robust to the choice
    of parameters.


    # AUTHOR CONTRIBUTIONS


    Conceptualization, B.T., S.M., P.M., and D.B.; methodology, B.T. and D.B.; formal
    analysis, B.T. and S.M.; visualization (in vivo experiments), S.M., H.W., and
    S.T.; research, N.U., V.N., and D.B.; data curation, B.T., S.M., H.W., and S.T.;
    B.T., S.M., V.N., V.A., P.M., and D.B.; project administration, P.M. and D.B.;
    funding acquisition, S.M., N.U., V.A., P.M., and D.B..


    With the k-sparse operation, j can be tuned using a variational set. For a detailed
    discussion on DUNL''s limitations, see the supplementary material.


    # DECLARATION OF INTEREST


    The authors declare no competing of interests.


    To demonstrate our model''s versatility, we applied it to different experimental
    settings, highlighting functionalities in existing tools. Our framework can extend
    beyond the sparsity regime to provide interpretable representations. For more
    complex models, such as Kalman-based neural networks, or 2D filters with adaptive
    constants, our work makes a first step toward leveraging advantages in deep learning
    via convolutional dictionary learning to gain mechanistic insights into neural
    dynamics and their computations.


