    方法中的 DUNL 偏移属性）。


    DUNL 使用概率模型将核与发放率连接起来，而 LFADS 依赖于具有编码器和解码器的循环网络，在脉冲与数据之间提供了更好的连接。要进一步比较 DUNL 与
    SCA 及其学习时间低秩迹线的能力，请参见图 7K。


    DUNL 通过其卷积、批处理的方法处理变长度。它使用 Adam 等基于梯度的优化器，并具有可扩展性，可以在 GPU 上处理批数据。为了证明可扩展性，我们将
    DUNL 的训练时间与 SeNMF 进行了比较（图 7N）。SeNMF 使用神经元 $\times$ 试验长度矩阵，限制了它在不进行拼接的情况下处理变长或多次试验的能力。


    ### 分解属性


    ### 基的选择

    最后，我们解释了 DUNL 如何允许用户学习表征神经反应的稀疏表示。我们讨论了两个关键点：(1) 它消除了学习基函数的需求；(2) 它提供了一组高度灵活的核（例如每个事件一个或两个），增强了可解释性。参见图
    S8E–S8N 中使用一组基函数的 DUNL。


