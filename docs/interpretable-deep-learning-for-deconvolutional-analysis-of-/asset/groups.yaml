    # Notation


    Scalars are denoted by non-bold lowercase letters. Vectors and matrices are denoted
    by bold lowercase and uppercase letters. $n=1..N$ neurons, and $i=1..M$ indices.
    The time series represent the activity of neuron $n$ during trial $i$. We denote
    these $X$ and $Y$ in time (min/mean minutes, number of trials, number of neurons).
    For ease of note, we assume a structure for the data $Y$ with varying sizes along
    the time dimension $T$ on a batch basis. The convolution operator is denoted by
    $*$, and its transpose operator (correlation) is denoted by $\star$. The superscript
    $T$ indicates the transpose of a matrix $A^T$.


    # Data Distribution


    For spiking data, spikes are binned at $B$-ms resolution. Thus each $y^{n,i}$
    represents the spike count from $0$ to $B$. We model the occurrences using the
    exponential family $\mu^{n,i}_{45}$, where $y^{n,i} \sim \text{Poisson}(\mu^{n,i})$
    or $y^{n,i} \sim \text{Binomial}(B, \mu^{n,i})$, where $\mu^{n,i}$ is the mean
    activity for neuron $n$ in trial $i$. For continuous-valued data, such as calcium
    fluorescence signals, we model the time series $y^{n,i} \sim G$ with a Gaussian
    distribution with mean activity $\mu$. The data-likelihood for the exponential
    family is constructed as


