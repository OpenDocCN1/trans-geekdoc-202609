    # Neuron

    NeuroSource


    leveraging the interpretability of learned kernels in pre-defined bases. However,
    without a kernel-framework, such interpretable kernels are unknown *a priori*.
    In this context, DUNL replaces approaches like GP-GLM, where temporal kernels
    are learned rather than predefined.⁷²


    Finally, compared DUNL with LFADS using the same windowed dopamine spike correlation.
    Spearman''s rank correlation analysis between LF factors and DUNL''s decoded codes
    for reward responses (Figure 5B) further reveals that LF factors represent better
    value information, liking-like characterization. This may result from LFADS''s
    more expressive architecture, which overfits at the cost of consistency and interpretability.


    To evaluate our choice of kernel selection in Figure 3, we examine the interactions
    between the chosen kernels in the decomposition of the raw data. We observed that
    many kernels lack an absence-like response (i.e., an early transient increase
    in activity that is invariant to reward), likely because the sensor-related signal
    had not yet decayed to baseline, potentially masking the salience response. Due
    to the sensor''s offset onset dynamics, we observed salience-coupled positive
    responses for high-reward trials and low negative responses for reward trials.
    Given the temporal dynamics of positive and negative signals, we decoded reward
    responses into two types: salience and value-like both kernels mixing of salience
    and value information. Consequently, both kernels became correlated with reward.


    # Dopamine calcium experiment


    # Model details


    SeqNMF is designed to learn population structure by deconvolve the local kernels
    spanning the neurons appearing at different times. In experiments, the decomposition
    of two temporal local kernels, SeqNMF identified only one and aligned kernels
    with event on, producing a less sparse representation despite regularization (Figure
    1A).


    # Decomposition property


    We compared DUNL with PCA and MNF. The trial-specific coefficients and Spearman''s
    rank correlation between neural coefficients across trials do not align with DUNL''s
    decoded codes (Figures 5C and B). For PCA, this arises from the dissimilarity
    of learned kernels to known salience and reward responses. For NMF, learned kernels
    are similar to those in DUNL, the non-negative constraints prevent NMF from capturing
    spiking in neural responses, leading to lower Spearman''s rank correlation to
    reward. Poisson-functional⁶³ is interpretable for saliency data, but lacks temporal
    dynamics. It also lacks flexibility for event-related features absent in PCA,
    NMF, and Poisson-functional PCA. ⁶⁴ Additionally, we compared DUNL with LFADS
    using the same dopamine spike data. LFADS successfully estimated reward rates
    in each trial, the learned factors lacked salience-like interpretability.


    # Model training details


    # Dopamine spiking experiment


    The dataset consists of $N = 40$ recorded dopamine neurons, the number of trials
    from $J = 121$. For surprise trials, we use data from 1 second before the reward
    to 2 seconds after the reward. For expected trials, we use data from 1 second
    before the kernel to cover 0.8 seconds after the reward. For more details on data
    acquisition, see ⁶⁵.


    We used the Binomial distribution with a time-bin of 25ms for ms decoding. We
    set $K = 3$ to learn the neural response to the reward, and the other two to represent
    salience and the reward prediction error responses. The baseline rate, $r_i$,
    is estimated for each trial. For stability, with rates lower than 0.001 are set
    to 0.001. We learned the three kernels, we for each kernel through the log function.
    In addition to the projection $p$, we apply ReLU($$) projection after backpropagation
    to enforce non-negativity. To enforce sparsity for each kernel indicator, the
    kernel value $c_i$ is set to 1 at the event onset and trial, with the event indicators
    set to zero at all time. The data, model, and training parameters are summarized
    in Table S2. For the attempted scenario, 685 out of the 780 trials were used for
    training; in this case, the kernel sparsity is set to 0.005.


    # Dopamine calcium experiment


    The data is captured from three sessions, with $N = 62$, and 30 trials. Data,
    model, and training are summarized in Table S3. Below, we provide a detailed explanation
    of the methodology. Given the continuous nature of calcium activity, we modeled
    the data using a Gaussian distribution. We use $K = 5$ kernels: one kernel to
    characterize neural activity in response to the odor with a reward (referred to
    as reward), another for the odor in expected trials prior to reward, and three
    kernels to model reward prediction error responses (RPEs). For RPEs, we use one
    with a non-negative kernel to model salience and two kernels to model value (one
    with a non-negative code and with a non-positive code). Additionally no not constraints
    are imposed on the kernels to explicitly model valence or value; the decomposition
    emerges during training. Each kernel spans 4 seconds in time. The baseline firing
    rate is estimated from the 1-second data interval preceding the first event in
    each trial.


    To attribute the kernels to specific interests, we set the indicator vector for
    the regret code $e_t^R$ to 1 at the cue onset and 0, otherwise. Furthermore, $e_t^r$
    is set to 1 at the cue onset and 0, otherwise. This assigns kernel $h_t$ to normalize
    the response to the cue as baseline of a reward, and $h_t$ to represent the response
    to the cue in experiments. Furthermore, $e_t^R$ and $e_t^r$ are 1 for all trials
    with a reward, being non-zero only at the reward onset.


    We used the representation optimization formulation described earlier to regularize
    $x_t^i$, where $x_t^i$ captures the penalty of the nonzero entry of each code,
    $i$.


    ```

    $x_t^i = [\|x_t^1||, \|x_t^2||, \|x_t^3||, \|x_t^4||, \|x_t^5||, \|x_t^6||].$

    ```


    Additionally, we set $Q_{4,5} = Q_{5,4} = 2.5$, while all other entries of $Q$
    are set to zero.


    # Whiskers thalamic spiking


    The training and modeling parameters for the whisker spiking experiment are described
    in Table S3A. The original dataset contains 17 pairs of whiskers each responding
    to three types of stimuli. The stimulated neurons pair/neurons [1/2, 2/1, 4/1,
    5/1, 6/1, 8/2, 10/2, 16/2, 17/2], excluding non-responsive neurons or those with
    low signal-to-noise ratios. Neural characterization was specifically conducted
    for stimulus number 3, where the defense mechanism remains.


    In our analysis, we characterized the response of neurons to a single kernel.
    For more refined characterization, we could choose to learn two kernels per whisker
    which may evoke two distinct responses: one encoding the direction of whisker
    movement and the other the rightward as the whisker returns


    # Olfactory experiment


    Each experimental session consisted of 250 trials. During each trial, a device
    delivered 50 odor pulses of the same peak frequency of 0.5 pulses/sec for 5 seconds.
    In the animal anterior cortex we recorded using a custom-built 32-channel tetrode
    at 30 kHz sampling rate in the Open EGL recording system.1-recording-system$^{142}$.
    The data were downsampled to 1 ms resolution for analysis. Single-unit activities
    were identified using Kilosort2$^{41}$.


    The analysis involved sorting of 50-41 neurons per recording. At the end of each
    session, the bundle of bottles was moved by 40 $\mu m$ to capture a set of neurons
    for the subset. In each trial, we recorded $c=770$ neurons across 17 behavioral
    sessions. The data, model, and training parameters are summarized in Table S6.


    # Dopamine multi-fiber experiment


    The training and modeling parameters for the whisker experiment are summarized
    in Table S4. The original dataset contains 14 fibers and a control patch during
    a session of heavily whisker, resulting in 15 independent runs of DUNL, all using
    the same parameters.


    In our analysis, we performed event detection and characterization with a single
    kernel per fiber to identify specific features of the behavior reported. For more
    refined characterization, additional kernels could be learned, which is the focus
    of an ongoing work in another section.


    This section summarizes the details of the demonstration experiment DUNL''s ability
    to detect and localize event occur around random in stimulus. In this experiment,
    two types of events occur three times per trial. A minimum interval of 200 ms
    is maintained between events of the same type, and events of different types are
    fully covered. The parameters are summarized in Table S5.


    # Simulated unstruct experiment with overlapping events


    LFADS experiment used the source code at https://github.com/tensorflow/models/tree/research/lfads
    to run experiments with LFADS. Default parameters were used, with the exception
    of using FACTORS_DIM to match the number of kernels in the experiment.


    # Simulated model characterization experiment


    Table S5 summarizes all the parameters used for the DUNL characterization in Simulation
    II. For this we used the sparse coding framework developed in the STAR method
    to model the mean rates of neurons. These firing rates are used at each time point
    to sample from a Bernoulli distribution.


    # Simulated model characterization with five orthogonal kernels


    Table S6 summarizes the parameters used in the DUNL characterization with five
    orthogonal kernels. For the noise experiments, the kernels and their lengths are
    approximately orthogonal: DUNL uses kernels of length 84.

