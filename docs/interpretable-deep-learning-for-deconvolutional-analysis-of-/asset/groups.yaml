    subcutaneously (s.c.) was applied at the injection site. Analgesia (buprenorphine
    for pre-operative treatment, 1 mg/kg; i.p.; ketoprofen for post-operative treatment,
    5 mg; i.p.) was administered for 3 days after surgery. Custom-made head was placed
    on the well-cleaned and dried skull with adhesive cement (Cell Metabond) containing
    a small amount of charcoal. To ensure delivery of inducible GCaMPa in dopamine
    neurons, the injection was initiated into the VTA (0 mm, 3.0 mm - 0.3 AP, 0.5
    mm, 4.6 mm from dura) using UnoVector Control, position map [24]; Jackson Laboratory
    (60660). A third mouse was used for transgenetic surgery using DAT-CRE with Ail14d
    (B6-SBL/J7751-GCaMP7i-I2H4); Jackson Laboratory (063039) for injection of GCaMPa
    was performed at a rate of 0.2 $\mu$L/min using a manual injector (30G). For both
    DAT-CRE and Ail14d, striatum-specific injection (0.6 mm in lateral, 7.3 mm depth)
    was performed after the insertion of a 25-gauge needle. The implants were secured
    with Cell Metabond adhesive cement (Parkell) and dental acrylic (Lang Dental).


    Behavioral training and testing protocol: Mice were dewatered in their home cage
    for 1-2 days before the start of training, or two weeks after surgery. During
    water deprivation, each mouse was weighed and maintained at 85% of its body weight.
    Mice were habituated to the head-fixed setup by receiving water every 4 hours
    (6 days), for which association behavioral training was completed. All training
    and testing sessions were recorded using a high-resolution top-facing camera.


    Waters (LHDA123111A, The Lee Company) were used with a custom-made head-fixed
    apparatus based on a motorized slider (10145) and water pump. Water was delivered
    in saline (osmol) via a manifold (LMF50052B and LHDA121111A). The Lee Company
    was used for order delivery. All components were constructed from a 3D-printed
    base. Waters were stored in saline (osmol) during immersion (SDA9-Aldrich-110),
    and 30 mL of each was filled using a pipette syringe (7 $\mu$L pore size, 623-1237,
    Ge Heocaler; Order-91). Water was delivered at 10 $\mu$L/min. Each session consisted
    of one of the following lists:


    acetate, p-methylene, butyrate, (-,carve), (+)-limonene, (-, α)-lflavonone. One
    of these orders were associated with a delivery of reward such as with other;
    a reward was delivered randomly from a uniform distribution of the sizes 0.3,
    0.5, 1.0, 2.5, 5.0, 6.0, and 10 mL. Variable-size rewards were taken from the
    reward session after the session was completed.


    Image acquisition was performed using a custom-built head-fixed microscope. The
    microscope was equipped with a diode-pumped, mode-locked laser (Mai-Tai, Spectra).
    All imaging was done with the laser tuned to 920 nm. Acquisition was achieved
    using a galvanometer and an 8 kHz resonant mirror (confocal head, Thorlabs). Laser
    power was controlled by a CellScope (CoMP2-500). Imaging was performed at 40 fps
    using a 10x objective lens (with 0.45 NA, Nikon). Excitation light was reflected
    using a dichroic mirror (FF775-25) and a bandpass filter (FF465-50/25). Emission
    light was filtered using a bandpass filter (FF525-50/25) and detected using two-channel
    GCaMP-photomultiplier tubes (HT22P-A40, Hamamatsu), which was sampled using high
    impedance amplifiers (TIAS80, Microscope). Control and image acquisition were
    done using ScalingCam (4/Video) Technologies. With 512x512 pixels, the temporal
    and spatial resolution of imaging were achieved by high-speed grayscale acquisition
    to eliminate motion using a mechanical shutter (SC10).


    Pre-data processing: Images were processed using MATLAB for image registration
    registration. Motion correction was performed manually in Fiji. Region-of-interest
    (ROI) selection was performed manually in Fiji using the mean and standard deviation
    of a subset of frames. as the movement of the head introduced projections. De-contaminations
    were performed using FSA around each ROI. The dopaminergic fluorescent signal
    was fitted with a 12-point Gaussian kernel with 0.875 ms drift correction. The
    baseline was corrected using a linear fit of the maximum running of the 120 s
    time window. $\Delta F/F_0$ was calculated as $\Delta F/F_0$ using a fit to the
    6th running average of a 40 s window. This fluorescence was used for data processing
    and analysis in the network.


    Multi-photon imaging


    Fluorescence surgery: Implants were performed as described above for two-photon
    imaging. One Dat-CRE:Ail14d:tdTomato transgenic mice, which expresses GCaMP and
    tdTomato in dopamine neurons, were implanted with a custom-made head plate and
    optical fiber inserted. The implants were secured with Cell Metabond adhesive
    cement (Parkell) and dental acrylic (Lang Dental).


    Behavioral testing protocol: After performing other tasks not reported in this
    manuscript, which is the set of separate injections, the mouse was put in the
    head-fixed setup with a stimulus by the experimenter at random times. The duration
    of each session was 30 minutes.


    Fluorescence absence and presence: To collect fluorescence signals across the
    axons then we used a dual-binding imaging photometry system with two integrated
    CMOS cameras and three light-emitting LEDs (LEDs) (BFMC-LED410-420, LED-460-490,
    CAM-500-550, LED-555-570, CAM-580-680, Doric Optics). Sequential image acquisition
    was performed in the cameras so that camera 1 collected the fluorescence by GCaMP
    was excited by LED 1 (410-420 nm, isob wavelength) and 2 (460-490 nm, calcium-detection
    mode), while camera 2 collected fluorescence from tdTomato (excited by LED 555-570
    nm). Each wavelength was acquired at 26 Hz in a 640x640 pixel


