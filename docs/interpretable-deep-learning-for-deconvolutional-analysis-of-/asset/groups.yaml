    # 迭代卷积展开神经学习 (DUNL)


    # 推理方法


    上述交替最小化过程可以映射到编码器/解码器神经网络。我们使用算法 $^{60}$ 将稀疏编码步 (3) 映射到编码器。这种方法类似于 $^{14,49}$
    中提出的字典学习架构。在这种架构中，每个稀疏编码 (14) 都被解释为具有循环卷积结构和 ReLU 非线性的神经网络层。我们将此编码器称为推理网络，它将稀疏起始的单类型时间序列
    $y^k$ 映射到时间序列稀疏代码的估计 $x_i^k$。这些共同起始对其解释数据的贡献（见图 S1）。


    给定推理网络提供的代码，我们基于生成模型 (1)（见图 S1B）构建一个生成解码器。它将给定神经元的稀疏代码估计时间集解码为脉冲数据的时间序列估计（例如，代表发放率的时间序列）。


    我们将推理网络和生成解码器相结合，构建了一个可以通过反向传播进行训练的可解释神经神经网络。传播允许我们学习核 $\{h_i^k\}$，这些核刻画了神经对由
    $\{x_i^k\}$ 编码事件的响应。正如详细所述，该网络的框架是双重的：神经参数与核 $\{h_i^k\}$ 直接相关，而编码器的潜表示对应于权重及其强度。该模型涉及两组用于学习字典的可训练参数，这两者在神经元和试验之间都是高度可并行的。稀疏编码和字典更新步在
    SSSL 中的工作原理如下：我们在稀疏编码和字典更新之间交替进行。这在之前的工作（如脉冲学习 $^{70}$）中已经证明，并且对于单隐藏层的二项分布情况存在理论分析
    $^{44}$。此外，DUNL 受益于丰富的稀疏编码文献，这些文献提供了模型不匹配下的见解 $^{111, 76–78}$，虽然不匹配增加了误差，但学习到的参数仍然与真实值呈正相关。


