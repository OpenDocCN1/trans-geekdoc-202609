    (D) 示例神经元的周围感觉直方图（黑色）以及带有 DUN 估计的发电率（蓝色）。


    (E) 须毛运动的核化（蓝色）以及描述刺激运动的灰色正弦波拟合。


    (F) 编码器和解码器在检测单次试验事件方面性能的定量评估。曲线显示了应用于跨试验平滑栅状图的峰值查找算法的性能。使用 10 ms（2-ms 容差）来计算误报/漏检。峰值查找来自
    Python 的信号处理包。


    (G) 示例试验：脉冲（spikes）、平滑的须毛速率（黑色）、DUN 估计的脉冲率（蓝色）以及时间上 16 + 2 个事件的推断代码（底部）。每个事件都有一个核幅度，与以往的方法不同（关于神经元、刺激和来自
    Terérica 的数据的详情见补充信息）。


    1158 神经元 713, 1151–1168, 2025年4月16日


    （图例继续见下一页）


    (50) 小鼠在试验中随机时间产生脉冲，从 Gamma 分布中采样，模拟了自然口腔脉冲的统计特性¹。我们记录了小鼠前皮层的 770 个神经元（图 4A 和
    5B）。


    形状皮层显示对口腔脉冲的神经响应序列在很大程度上是不相关的，我们使用 DUNL 来表征这些共振。


    在第二种方案中，单个神经元对单一事件类型做出反应，以评估 DUNL 根据通用发射模式识别核和代码的有效性（模拟研究，STAR 方法）。这种表征有助于用户评估
    DUNL 在特定统计数据下的性能。


    为了对神经元响应进行建模，我们将响应元素与脉冲时间对齐，并使用泊松过程对其进行建模（图 5C）。每个神经元通过单个核幅和代码幅度来表征。


    DUNL 性能随结合率（2, 5, 11, 14 和 17 Hz）和试验次数（5, 25, 50 和 500；图 5A）以及核学习（10, 25, 500
    和 1000 次试验；图 6B）的变化。


    我们学习了所有记录的核和代码幅度，捕捉了跨先皮层响应的时间动态。对测量的核进行 K-means 聚类揭示了三个主要成分（图 5D）。


    结果（图 6C–6E）显示了 DUNL 通过更多试验、更高精度和更大尺寸学习核并推断叠加事件的能力（STAR 方法模拟细节）。


    三个簇代表随脉冲的活动，具有不同的动力学，而第四个对应于被脉冲抑制的神经元。


    在第三种方案中，我们测试了 DUNL 在 1000 个神经元和 1000 次试验的大规模设置下，从跨试验的 5 个不同事件恢复核的能力。我们使用此数据集来指导在信息未知时如何选择合适的核数量。


    此应用证明了 DUNL 如何学习任何形状的核，而不依赖于对其结构的假设。结果是，DUNL 可以捕捉响应的多样性，而不需要手工设计的函数。


    为了评估结果的稳健性并指导 DUNL 的使用，我们表征了其在三种场景下的性能。在第一个场景中，单个神经元对两个不同事件做出反应（模拟细节，STAR 方法）。DUNL
    在此数据集上的性能也用于展示其在群体中共享核的能力，其中组稀疏性优于群组。


    DUNL 指标直方图：跨记录神经元在单次试验中每个事件一个代码幅度。具有组稀疏性的 DUNL 在所有记录的单次试验中更为稳健。另见图 S4–S4。


