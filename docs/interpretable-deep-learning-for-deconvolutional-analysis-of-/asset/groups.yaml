    代码 (rew) 与单个神经元和群体平均的尺寸高度相关（图 2D）。值代码带有奖励大小的信息，通过跨试验平均（图 2F 和 2G）结合内核提高了奖励的表示，证实了显著性代码不包含值信息。


    # DUNL 从多巴胺神经元提取显著性和值信号


    我们应用 DUNL 解码多巴胺神经元中的多路复用信号。中脑多巴胺神经元，尤其是腹侧盖区，对于强化学习期间的行为调节至关重要$^{54–59}$。信号 是意外值的增加。奖励神经元被识别出两种表示：一个代表显著性，另一个代表主观值（效用）。这是非常有意义的，因为显著性组件与奖励驱动一致。使用
    DUNL，我们调查了奖励可以分解为这两个成分，以及它们是否受到值的不同调制。使用特定窗口来排除显著性，然而，即使通过这种检查，DUNL 的代码仍然包含奖励大小的信息。


    DUNL 对噪声响应的成功反卷积表明，内核的幅度是转向奖励大小的有力衡量。我们在不同初始条件下推断的奖励大小与图 2 中的结果一致（图 S1D、S1E 和
    S1F）。总体，DUNL 提供了一种强大的工具，以无偏的方法量化显著性组件与单个神经元响应之间的关系。


    我们对 40 个识别的多巴胺神经元进行了电生理学实验$^{62}$，这是之前研究任务的一部分。在可变尺寸的“意外”试验中，奖励在没有提示的情况下递送。在“预期”试验中，气味提前
    1 秒递送奖励（图 2A 和 2B）。我们使用值代码或 rew 响应来对奖励进行建模（图 2C 和 2D）。通过跨神经元对齐奖励和群体对内核。DUNL 是根据提示和预期事件的时间构建的，而不是试验（除了奖励）。


    # DUNL 解码显著性


    为了证明 DUNL 在脉冲多巴胺神经元之外模态的灵活性，将其应用于双光钙成像。在分类任务期间，我们使用分级反馈间隔（GRI）排序的钙成像记录了 55 个多巴胺神经元的数据（图
    3A）。该任务显示了感觉行为的结构$^{64}$。在意外试验中，不同尺寸的奖励（0.3-1 s）是预期的。预期试验在提示和奖励递送之间有更延迟。我们显示对提示和不同尺寸的响应受到预期和奖励大小的影响（图
    3B）。


    我们使用钙离子表征神经活动（图 3C），并观察了三种不同奖励尺寸的预期变化。蓝色自由奖励与正代码相关，而红色和绿色神经元是耦合的，其约束分别为正和负。与 PCA
    和负矩阵分解（NMF）等非耦合方法不同，4 决策是基于奖励活动的（图 3B），活动在基线后（提示 3 秒后，奖励 4 秒后）重新测试。每个试验只有一个激活，捕获了神经元放电增加或减少的不同钙离子信号，通过表示学习实现（参见补充信息—STAR
    方法）。


