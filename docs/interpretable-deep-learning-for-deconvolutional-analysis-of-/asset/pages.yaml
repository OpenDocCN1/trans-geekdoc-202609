    ### DUNL Limitations


    One limitation of convolutional sparse coding is that two kernels may become indistinguishable
    if they are perfectly active and have similar shapes; Occam''s razor suggests
    a single kernel.¹³⁵ In addition, convolutional dictionary learning, higher kernel
    correlation increases the difficulty of recovery.¹ While kernels do not need to
    be orthogonal, greater orthogonality facilitates the learning and inference process.¹
    Although DUNL can recover coherent kernels with random initialization, theoretical
    analyses of dictionary learning rely on an assumption and a relatively accurate
    kernel estimate.¹³⁸,¹³⁶}


    The current design of DUNL has several limitations. It restricts using kernels
    of the same size for a single modality or time-series prediction. Additionally,
    DUNL cannot yet handle multiple modalities simultaneously, although this extension
    is feasible in future. Work could expand DUNL to learn shared kernels across multiple
    modalities using multi-scale kernels or apply the pruning technique to handle
    more iterative algorithms¹⁹ While prior literature addresses dictionary learning
    on incomplete datasets¹³⁷, and recent work explores unlabeled dictionary learning
    DUNL does not support sharing kernels. This weakness could be incorporated into
    future features.


