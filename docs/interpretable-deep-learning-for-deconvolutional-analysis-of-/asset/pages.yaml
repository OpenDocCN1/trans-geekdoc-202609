    # Data Distribution


    For spiking data, spikes are binned at $B$-ms resolution. Thus each $y^{n,i}$
    represents the spike count from $0$ to $B$. We model the occurrences using the
    exponential family $\mu^{n,i}_{45}$, where $y^{n,i} \sim \text{Poisson}(\mu^{n,i})$
    or $y^{n,i} \sim \text{Binomial}(B, \mu^{n,i})$, where $\mu^{n,i}$ is the mean
    activity for neuron $n$ in trial $i$. For continuous-valued data, such as calcium
    fluorescence signals, we model the time series $y^{n,i} \sim G$ with a Gaussian
    distribution with mean activity $\mu$. The data-likelihood for the exponential
