    # ## In brief


    Recent methods applying deep learning to model neural activity often rely on "black-box"
    approaches that lack an interpretable connection between neural activity and network
    parameters. Here, building on advances in interpretable AI, Toloosham et al. propose
    a new method, deconvolutional unrolled neural learning (DUNL), and apply it to
    seven datasets.


    # ## Highlights


    +   - DUNL is a method for designing interpretable AI algorithms to analyze neural
    data

    - It deconvol neural data into a sparse set of interpretable, local components

    - It performs single-trial analysis across brain areas and recording modalities

    - It is scalable with dataset size in both trial-based and naturalistic settings


