    Comparison with other decomposition methods


    DUNL is a versatile decomposition method that extracts interpretable representations
    from time series data. Its strength is learning multiple scales within single
    tracks (locality), effectiveness in limited datasets, and scalability. To address
    gaps in functionality left by other methods, we evaluate DUNL''s performance against
    them, with each comparison focusing on a specific aspect.


    DUNL''s ability to learn local features was demonstrated using a synthetic dataset.
    While LFDS performs population-level analysis of recorded neurons, DUNL decomposes
    asynchronously, local activity within strings of individual neurons. To illustrate
    this, we conducted a simulation with experiment-trained trials, clustering containing
    two non-overlapping pairs to recover local activity. We used DUNL to decompose
    neural activity into two tracks corresponding to an event type. Trials were generated
    for both training and test data (Figure 8).


