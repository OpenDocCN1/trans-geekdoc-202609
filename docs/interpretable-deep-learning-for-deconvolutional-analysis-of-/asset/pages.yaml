    # Whiskers thalamic spiking


    The training and modeling parameters for the whisker spiking experiment are described
    in Table S3A. The original dataset contains 17 pairs of whiskers each responding
    to three types of stimuli. The stimulated neurons pair/neurons [1/2, 2/1, 4/1,
    5/1, 6/1, 8/2, 10/2, 16/2, 17/2], excluding non-responsive neurons or those with
    low signal-to-noise ratios. Neural characterization was specifically conducted
    for stimulus number 3, where the defense mechanism remains.


    In our analysis, we characterized the response of neurons to a single kernel.
    For more refined characterization, we could choose to learn two kernels per whisker
    which may evoke two distinct responses: one encoding the direction of whisker
    movement and the other the rightward as the whisker returns


    # Olfactory experiment


    Each experimental session consisted of 250 trials. During each trial, a device
    delivered 50 odor pulses of the same peak frequency of 0.5 pulses/sec for 5 seconds.
    In the animal anterior cortex we recorded using a custom-built 32-channel tetrode
    at 30 kHz sampling rate in the Open EGL recording system.1-recording-system$^{142}$.
    The data were downsampled to 1 ms resolution for analysis. Single-unit activities
    were identified using Kilosort2$^{41}.


    The analysis involved sorting of 50-41 neurons per recording. At the end of each
    session, the bundle of bottles was moved by 40 $\mu m$ to capture a set of neurons
    for the subset. In each trial, we recorded $c=770$ neurons across 17 behavioral
    sessions. The data and modeling parameters for this experiment are summarized
    in Table S6.


    Table S6: Details of the experimental parameters for the olfactory experiment.


    The clustering analysis was performed k-means. Figure S7 illustrates k-means clustering
    results with 3, 4, 5, and 6 kernels. We randomly sampled 90% of the neurons (400
    times) to compute clustering using random index (ARI). The ARI values were 0.94,
    0.96, 0.93, and 0.77 for 3, 4, 5, and 6 kernels, respectively. Hence, the suggested
    number of clusters is 3 or 4. A similar clustering was also observed with the
    whisker kernel.


    # Dopamine multi-fiber experiment


    The training and modeling parameters for the multi-fiber experiment are summarized
    in Table S4. The original dataset contains simultaneously recorded traces from
    14 fibers and a control patch during a session of heavily beating whisker, resulting
    in 15 independent runs of DUNL, all using the same parameters.


    In our analysis, we performed event detection and characterization with a single
    kernel per fiber to identify specific features of the behavior reported. For more
    refined characterization, additional kernels could be learned, which is the focus
    of an ongoing work in another section of this manuscript.


    This section summarizes the details of the demonstration experiment DUNL''s ability
    to detect and localize event occur around random in stimulus. In this experiment,
    two types of events occur three times per trial. A minimum interval of 200 ms
    is maintained between events of the same type, and events of different types are
    fully covered. The parameters are summarized in Table S5.


    # Simulated unstruct experiment with overlapping events


    LFADS experiment used the source code at https://github.com/tensorflow/models/tree/research/lfads
    to run experiments with LFADS. Default parameters were used, with the exception
    of using FACTORS_DIM to match the number of kernels in the experiment.


    # Simulated model characterization experiment


    Table S5 summarizes all the parameters used for the DUNL characterization in Simulation
    II. For this we used the sparse coding framework developed in the STAR method
    to model the mean rates of neurons. These firing rates are used at each time point
    to sample from a Bernoulli distribution.


    # Simulated model characterization with five orthogonal kernels


    Table S6 summarizes the parameters used in the DUNL characterization with five
    orthogonal kernels. For the noise experiments, the kernels and their lengths are
    approximately orthogonal: DUNL uses kernels of length 84.


