    **Alternating minimizing**

    A bi-convex optimization problem can be solved using an alternating-minimization
    algorithm$^{108}$ / In each iteration $n$, the algorithm alternates between two
    steps: sparse coding, which computes an estimate of the codes $\mathbf{x}_k^j^{(n)}$,
    given the current dictionary estimate $\mathbf{D}^{(n-1)}$, and a *dictionary*-update
    step, that uses the current codes to refine the kernel elements. Mathematically,
    these two steps can be expressed as:


    ```

    $$\mathbf{x}_k^j^{(n)} = \arg \min_{\{\mathbf{x}_k^j\}_{k=1}^K} \sum_{j=1}^J -\log
    p\left(\mathbf{y}^j |\{\mathbf{x}_k^j\}_{k=1}^K\right) + \sum_{k=1}^K ||\mathbf{x}_k^j^{(n)}\|_2^2$

    ```


