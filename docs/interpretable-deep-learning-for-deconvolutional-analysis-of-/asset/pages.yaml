    DUNL learns non-parametric kernels, enabling it to capture a broader range of
    impulses beyond Gaussian forms. DUNL also learns in its latent representation
    by modifying the activity and activation functions during training. For example,
    in Figure 4 (whisker data), we applied group sparsity regularization to encourage
    neurons to fire, a feature missing in prior work.


    DUNL vs. SCA


    Sparse component analysis (SCA) is a newly released method that decomposes activity
    into components, and there are differences between SCA and DUNL. First, SCA enforces
    orthogonal architecture allows it to learn correlated kernels, making them difficult
    to decompose, but it can also be effective. SCA is not a convolutional constructor—it
    focuses over the full trial, limiting it to low-dimensional tasks in time-aligned
    or windowed data. Third, SCA handles trials of the same length, whereas DUNL can
    perform trials of varying lengths. Fourth, SCA uses a data matrix rather than
    a forcing term, to select kernels in the same trial. SCA is not scalable, as shown
    in this manuscript.


    DUNL vs. GFFA


    Gaussian Process Factor Analysis (GFFA) was developed for spiking, and it may
    not easily adapt to other recording modalities, such as calcium or sensors might
    benefit from the square-root transform. GFFA focuses on identifying factors in
    population activity, discerning single-neuron activity as independent variable.
    In contrast, DUNL provides single-neuron, single-event codes, which are useful
    for decoding multiple events in a single trial. GFFA does not scale well—fitting
    a kernel for each neuron impractical in large datasets. A related method, variational
    Gaussian Process (vGP), is faster and provide better quality estimates for spiking
    data.


    DUNL vs. mDR


    Model-based dimensionality reduction (mDR) identifies neuron coding of task variables
    by mapping stimulus to activity, with weights specific to each neuron. In contrast,
    DUNL estimates a code per neuron per trial, even when kernels are shared. mDR
    requires the support (task variable) to be provided, similar to GLMs, where DUNL
    can infer- or accept it as input. Additionally, DUNL can handle varying trial
    lengths and does not rely on a global linear mapping between task variables and
    neurons.


