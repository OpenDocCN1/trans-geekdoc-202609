    # DISCUSSION


    We introduced unbiased learning-based neural networks$^{20,31}$ to recover local-rule
    structures and deplexed neural activity in human-interpretable latent variables.
    Based on algorithm$^{49,50}$ this approach enables the design of deep neural networks.
    For this test, we apply temporal sparse coding to neural recordings, detecting,
    and characterizing sparse events in latent space. Our approach shows that DUNL
    meets criteria for a decomposition method: it supports neural input data, operates
    on limited datasets, and adapts to various signals. Unlike other methods, which
    span entire trials for dimensionality reduction (5), DUNL and LFADS$^{39}$ scales
    well in scalability and stability across neurons, time, and trials. It outperforms
    methods like convNM$^{25,36}$ and seqNM$^{37}$ (see supplemental discussion for
    details).


