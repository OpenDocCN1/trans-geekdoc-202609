  - **结果**：AI 助手和研究团队协作产生了对数据集的全面且详细的分析。\n\n## 结论\n\n\n\n\n协作 AI 系统代表了人类与 AI 交互的未来，双方共同工作以实现卓越的结果。通过设计促进有效协作、透明度和信任的提示词（prompts），从业人员可以在利用人类专业知识的同时充分发挥\
