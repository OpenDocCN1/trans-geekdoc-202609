    def \_\_init\_\_(self):


    super(PromptModel, self).\_\_init\_\_()


    self.fc1 = nn.Linear(10, 20)


    self.fc2 = nn.Linear(20, 1)


    def forward(self, x):


    x = torch.relu(self.fc1(x))


    x = self.fc2(x)


    return x


    model = PromptModel()


