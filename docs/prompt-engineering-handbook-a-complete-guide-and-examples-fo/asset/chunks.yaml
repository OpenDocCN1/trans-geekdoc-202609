    \   else:\n        return \"抱歉，我不理解。你可以提供更多上下文吗？\"\n```\n\n2. **交互式对话循环**:\n```python\n\
    user_inputs = [\n    \"告诉我关于光合作用的信息。\",\n    \"绿素的作用是什么？\",\n    \"阳光是如何影响这个过程的？\"\
    \n]\nfor user_input in user_inputs:\n    prompt = generate_dynamic_prompt(user_input)\n\
