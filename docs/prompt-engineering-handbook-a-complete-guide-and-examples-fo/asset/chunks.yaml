  trans: "\n\n- 示例：使用提示词链（prompt chaining）进行详细的市场分析，为数据收集、趋势识别和建议生成分别设置提示词。\n\n##\
    \ 2. 迭代优化\n\n- 通过链接基于之前响应的提示词来迭代优化输出，从而提高准确性和相关性。\n- 示例：通过链接数据提取、初始总结和详细分析的提示词来开发研究总结。\n\
    \n### 实现\n\n```python\n# 针对市场分析任务实现提示词链的示例\ninitial_prompt = \"Collect data on\
    \ the latest market trends in the technology sector.\"\ninput_ids = tokenizer.encode(initial_prompt,\
    \ return_tensors='pt')\noutput = model.generate(input_ids, max_length=150, num_return_sequences=1)\n\
