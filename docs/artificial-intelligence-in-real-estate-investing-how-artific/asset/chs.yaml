  ## 房产融资中的 AI


  ![image](img/chapter_title_below.png)


  在房产融资中引入人工智能是一个令人振奋的前景。它涉及确保最合适的房产申请人被房东看到。虽然传统上使用信用评分和当前收入来衡量申请人支付房东的能力；但它们忽略了许多根本问题，例如申请人的债务、信用额度、未来就业前景和情境感知能力。这是一个令人振奋的发展，因为它确保房东能获得最有可能偿还租金的客户；同时也不会给无力偿还的人强加不必要的债务。


