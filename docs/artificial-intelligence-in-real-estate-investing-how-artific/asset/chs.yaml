  ## Rex


  ![image](img/chapter_title_below.png)


  Rex 是一款主要处理自我组装的 AI。REx 是我们迄今为止最接近通用人工智能（General AI）的成果。通用人工智能这一形式的 AI，其名称源于过去最初的计算机。最初，计算机被赋予的任务仅限于做一件事，而且只能做这一件事。或许最能代表这一点的机器，就是那台破解希特勒“恩尼格玛”密码机的计算机，后者是负责加密信息的机器。这台机器无法玩电子游戏，甚至无法进行基本的数学运算。它是一台单一用途的机器，通过比人类更快地轮转字母来解密信息。


  人类花了几十年时间和更小的部件，才将各项任务整合在一起。这就是我们常知晓的那些曾用于商业用途的大型昂贵计算机的时代。你需要在纸带上打孔来编写程序。最终，这演变为使用打字机将自然语言（如
  for 循环）转换为机器能理解的指令。随着更多部件的出现和更好的编码方案的采用，我们开始看到如今服务器大小的计算机，随后是台式机，最后是笔记本电脑。现在我们已经做了半个世纪（½
  a decade），口袋里的计算机性能足以碾压那台第一台机器。


  AI 的演进方式非常相似。第一个 AI 建立在斜截式（Slope-Intercept Form）基础之上，从此人们开始创建具有“是”与“否”主题的场景。他们最终发现，如果将两个此类模型结合，它们就能处理不同的场景。这就像从单一用途的计算机进化为组合任务的计算机。这一演进发展至今，能够分解语言，为我们带来语音输入、电子游戏中的
  AI，以及我们所熟知的所有 AI 技术。


  然而，仅仅因为计算机能做多件事，并不意味着它能自主思考。我在这里略过了大量信息，但你在计算机上进行的每一项操作，在用户输入之前都已经被预编程好了。我们利用巧妙的技巧让人误以为计算机在同时做不止一件事。正如
  AI 最初只有单个神经节点，计算机中也一切都在单核上运行。此外，随着神经网络的出现，我们创造了真正能同时做多件事的多核系统。然而，操作系统（OS）主要仍是单核进程。它无法自主思考，必须经过预编程。


  通用人工智能，如 REx，能够定义自己的流程并自主思考。是的，REx 是第一个通用人工智能。并非因为它能为自己做选择（像许多著名的 AI 机器人那样），而是因为它能在无需人工输入的情况下做到这一点。


  另一方面，房地产公司 REX 与我们之前讨论过的公司非常相似。我可以解释他们的业务，但那大多是在重复自己。不过，他们确实做了一些不同于其他公司的事。具体来说，在匹配卖家和买家时，他们通过在其他网站上匹配来实现。因此，如果卖家在
  Zillow 上，买家在 Facebook 上，机器学习算法会将两者连接起来。这使得在线销售涵盖了所有主流的在线房地产网站，而不再将卖家和买家局限于单一平台。此外，REX
  的经纪人是领薪员工，这通常意味着更好的客户服务。


