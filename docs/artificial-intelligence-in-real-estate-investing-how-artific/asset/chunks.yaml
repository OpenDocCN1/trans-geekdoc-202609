    ![image](Images/chapter_title_above.png)


    # Why This Environment is Worth Investing In


    ![image](Images/chapter_title_below.png)


    It’s Still a Small Environment


    The benefit about all of what we''re talking about here is that it''s still a
    relatively small market. There aren''t a lot of people in this market because
    it doesn''t receive a lot of notoriety. The real estate market has had a very
    slow overtake when it comes to technology.


    This means that there''s plenty of opportunities to grow because real estate agents
    often love these tools. The best part is that you can actually help out another
    industry in the process. You see, there are tons of Junior programmers left jobless
    because most programming positions need a higher level. However, many of these
    applications are something that a low-level programmer can handle.


    The artificial program needed to run the chat box and filtering system can be
    handled by early programmers. This means that you can hire them at lower rates
    than otherwise expected and still receive a mostly adequate product. So not only
    can you use these tools yourself but, if you make them, you can also sell these
    tools rather quickly.


    It’s Useful and Saves Time


    The reason why this is an investment opportunity in both the consumer and the
    producer side is that it''s useful and saves time. It requires no long-term liability
    to start because all you need to do is hire a programmer. A programmer is responsible
    for the artificial intelligence, the websites, the applications, and even the
    product design if you have one. This opens up the opportunity for not only a hurting
    industry but also a new industry.


    I imagine the new industry would be underneath IT Room and Board Maintenance or
    something similar in nature. These would be positions where maintenance people
    are combined with IT professionals. Therefore, since once the application is made
    and all you need to do is maintenance it, it becomes a two-in-one job. In fact,
    most real estate agents hired somebody to do their website and now they can rehire
    that person to make this. That doesn''t necessarily mean that you need to hire
    someone to do this because there are products, but this is an opportunity to sell
    a product with a low entry bar.


    It''s perfect right now because it''s useful, it saves time, and it''s relatively
    new. Being relatively new means that there''s not much you have to do to become
    a sellable product. For instance, simply providing a platform where emails are
    filtered by artificial intelligence and then sorted is a sellable product. Creating
    an application that allows you to expand security (facial recognition cameras)
    is a sellable product. It''s also not as difficult as it sounds.


    There is a ton of documentation on facial recognition and plenty of companies
    that will rent the service out. You simply combine that with a monitoring program
    that looks at all the different cameras and you have a product. It''s a really
    easy product to make yet no one is making it because there''s not a lot of attention.
    You provide jobs for programmers, maintenance people, and are able to sell real
    estate properties faster.


    Long and Sustainable Growth


    The beauty about this is that once the application is up-and-running, it usually
    doesn''t require a lot of costs to keep running. If you think about it, you might
    have to hire a developer for a couple of months. You are likely looking at a cost
    of about $10,000. This is a standard investment when making any sort of web application
    so it''s really not that much. Once the application is made, not only can you
    use it, but you can also sell it. You can have user accounts, limited subscriptions,
    and offer it as a service.


    The cost of upkeeping such a website is relatively small. It''s relatively small
    depending on how it''s built. However, you are not exchanging that much data,
    so it wouldn''t chew through bandwidth like videos do. Artificial intelligence
    would work on the server, so the server might need to be a little beefy, but not
    at first. Especially if you are renting artificial intelligence from someone like
    Google. So, what you have is a monthly bill for the server, an annual bill for
    the web address, and an investment in a programmer for a couple of months.


    After that, you only have a bill for the server and an annual bill for the website.
    The cost of running the website would probably run you between $50 to $100. Yet,
    if you sell it as a service then you''re likely going to make maybe $20 per client.
    Perhaps more depending on how effective your software is. Your upkeep is not only
    paid for by a handful of customers but you''re making a profit off of a relatively
    small product. This means that over time you can add additions that you want and
    then pass the cost of making those additions to your customer. Therefore, you
    get a better product for yourself that you then get reimbursed for by the customer.


    Because the cost is so low, nearly anyone can do it if they''re in the real estate
    business already. This is because $10,000 is practically nothing when it comes
    to investing in real estate.'
