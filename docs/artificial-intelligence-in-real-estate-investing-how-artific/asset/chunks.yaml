    # 利用 AI 实现更优定价


    ![image](Images/chapter_title_below.png)


    你还能获得利用人工智能实现更优定价的额外好处。不仅如此，买卖定价也更优。因为人工智能可用于相同方式，仅有细微差别。


    买新房时，你往往关注不少细节。这些细节以心理清单形式呈现，列出你偏好的项目和厌恶的项目。因此，若你是寻找外观破旧但仅有表面问题房屋的买家，你可能厌恶标注“需安装供水”的房源。某些城市要求房地产必须铺设通往市政供水的水管，这强加给居民，通常花费
    2 万到 4 万美元。这是你必须预先承担的成本，直到卖掉房子，有时并不理想。所以，虽然你找状况较差的房子，但不一定想彻底拆除重建。


    另一方面，人工智能卖房时也能帮忙。你买房卖房关注的指标相同：学区质量、犯罪统计、平均收入、材料实际成本。这些是买卖房时的标准考量。买房时关注这些，因意味着房子更保值。因此，若能在好社区、低犯罪率区以好价格买房，转手能赚大钱。同样，卖房时这些也是宣传重点。


    你可能是房地产新手，想借人工智能多赚钱。若属实，你可能纳闷为何我说卖房时也要看这些指标。翻新房子需时。通常若在均价 20 万以上社区买入 9 万房子，你会投入大量时间。一年内，优质学校可能变中等，犯罪率可能因新法或商业项目上升，邻居可能搬离。因此，重复买前的研究以获取试图出售房屋的实际估值很合理。


    既然变量相同但意图不同，人工智能可处理部分工作。可让人工智能依据你调查的因素判断房屋价值。买房时，输出告诉你房子是否值得买；卖房时，输出告诉你要价是否合理。既然人工智能是编程，不必用两个相同流程得两种结果。而是用同一流程，在代码末尾或近末尾设置买卖的不同分支。因为编程是模块化的，组件可复用。


    | ![image](Images/chapter_title_corner_decoration_left.png) ||  || ![image](Images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](Images/chapter_title_above.png)


    # 拥抱 AI


    ![image](Images/chapter_title_below.png)


    人工智能不新鲜，但用法新。你可能担心它取代房地产经纪人，甚至担心买卖房全靠 AI。事实是你无法逃避。即使你不用，竞争对手会用。最终你只能加入使用 AI 的阵营。


    人工智能不可怕。它只是是非题。若房子在有两所学校的区域，AI 这样看：运行搜索算法，确定一定半径内学校数量；询问州政府给学校的字母等级；若等级高于预设值，向下一变量传递“通过”状态。同时另一神经节点看另一所校，发送是或否。神经节点通常发
    1 代表是，0 代表否。若链中下一节点收到是和否，最终结果 0.5。结合区内学校数量，可能得 0.3、0.6 甚至 0.9。最终汇总得分给出总体平均分，决定该区域学校质量。

    '
