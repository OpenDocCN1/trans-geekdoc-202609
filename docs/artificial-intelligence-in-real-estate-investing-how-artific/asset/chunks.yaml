- raw: 'By doing a skills reliability test, you determine quite a few things. The
    first thing you determine is the likelihood of how high their income is going
    to be. The second thing you determine is how hard it is for them to be able to
    find a job should they be fired. The third thing you determine is if there is
    a progressive path in their field of skills.


    Understanding how high their income is going to be will help you determine how
    high your financing rate can go in the future. Determining how difficult it would
    be for them to find a job given their skills determines whether they are going
    to default more likely or not. Lastly, understanding if there''s a path for progression
    in their field allows you to know if they are pursuing a “learning” based field.
    As I’ve mentioned before, learners will always tend to climb the financial ladder.


