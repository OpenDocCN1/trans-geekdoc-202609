    # AI in Marketing of Real Estate Property


    ## Email Targeting


    ### Email Lists Are a Thing of the Past: Chatbots


    If you are still doing an email list, you are likely hitting the oldest Generations
    there are. Ironically, the way of the email list is going away. Instead, what
    you have now is the instant messenger list. This list is on Twitter, Facebook,
    Instagram, and pretty much any social media website you might think of. This is
    because most of the younger generation deal with instant messenger and email is
    not really a priority on their list. That being said, professionals still use
    the email list but you''re going to reach a far lesser audience.


    Therefore, while it isn''t ideal to constantly focus your attention on the email
    list, it''s a good idea to probably keep them around. The reason why the shift
    has been going over to the instant messenger is that it opens the possibility
    of a chatbot. Essentially, people use the instant messenger to sign up to your
    chatbot list. Every time you have a real estate listing, you simply blast this
    out to everyone in the list. Then what happens is that the interested party chats
    back.


    This is where new clients or potential clients encounter artificial intelligence.
    The chatbot can respond to them and ask them for information. It would be very
    similar to the chatbot system you would have to pad out the details you might
    need to sell them a house. Therefore, if they are interested in buying a house
    the common facts can be listed and if the client is still interested, you can
    directly connect to them via instant messenger. This means the client can go from
    being engaged with the artificial intelligence to being engaged with you on the
    selling end.


    ### Always Keeping Clients Engaged


    The purpose of this chatbot is to keep a constant engagement with your client.
    And an email list, your user is very likely to just sit through hundreds of emails
    a day. On a constant basis, even I receive about 100 emails from every which way
    under Sunday. There’s only so much you can interact with via email and it is quickly
    overloaded by password changes, commercial website deals, and generally the bulk
    of email is buying stuff from websites.


    With a chatbot, since you''re selling singular items like a house, you''re not
    going to be messaging them constantly. Instead, if you collect an income level
    you can assign them to a specific bracket of your broadcast.


    ### Average User Willing Purchase Range


    By being able to put them inside of this bracket, you effectively create your
    average willing price. People who are actively searching for houses that give
    you their income level can also have an asking price. This asking price can determine
    what houses you should be really looking to sell to your clients. Rarely do people
    want to buy $300,000 to $500,000 houses. The most common range to sell within
    is between $90,000 houses and $250,000 houses. This is because much of the United
    States population is either middle class or poor. Very few people live in the
    high enough bracket to afford a half a million-dollar house.


    By creating this bracket and determining your average price, you don''t accidentally
    buy houses that rarely sell. Instead, you begin cycling through houses every week
    because you''re constantly selling them. In fact, the benefit of a chatbot is
    that it is so easy to spread the word of mouth. You can have them share a post
    that says they bought a house from your chatbot. Since someone reliable participated
    in your chatbot and shared it with their friends, those friends know you have
    your friends. So long as you keep selling houses to satisfy customers, the word
    of mouth advertising becomes instantaneous.


    ## Finding A Group


    ### Click funnels


    A click funnel is a concept that’s been around for quite a while, but not the
    artificially intelligent click funnel. These funnels take information about how
    successful your attempts have been to generate customers and build a profile of
    what will likely work. Therefore, say you built five pages where only two of the
    pages have done well. You can then run Artificial Intelligence on this to determine
    how successful a new page would be and what should go in that new page.


    However, engaging consumers is a huge topic and there''s simply not enough room
    to talk about how you can use artificial intelligence to do market strategy engagement.
    I do have a book on market strategy engagement that does cover click funnels as
    well as other artificially intelligent marketing strategies that will keep your
    customers engaged.


