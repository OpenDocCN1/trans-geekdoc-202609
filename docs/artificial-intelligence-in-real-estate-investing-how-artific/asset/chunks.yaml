    # Situational Awareness


    ![image](Images/chapter_title_below.png)


    Disability Compensation


    Situational awareness is important when you''re considering financing someone.
    Sometimes, you run into some unique scenarios that benefit you and your customer.
    Someone is looking to purchase real estate, but they don''t quite meet the qualifications
    yet. Essentially, they don''t exactly have the money to do it. However, they do
    have a unique ability that sets them apart from others.


    For instance, if a person is disabled then they can get money for being disabled.
    Normally, the person who is disabled will get a monthly paycheck from the Social
    Security office. This represents a stable income that is not likely to go away.
    In some instances, the type of job that this person does could be classified as
    a hobby. You can make money from a hobby and collect disability in certain situations.


    You do get taxed a lot more for hobbies than your regular line of work. However,
    a hobby can be classified as non-reliant income. Therefore, someone may make near
    $24,000 annually from a hobby and still collect disability. It''s a very interesting
    loophole that very few people take advantage of and even fewer people I have available
    to them. However, if you have artificial intelligence looking for these types
    of people, then you can take advantage of that. Since the rules are laid out by
    tax law, that means you have a definition of the type of person that would fit
    that scenario.


    Essentially, tax law defines what machine learning you need to take advantage
    of this type of person. Now, it''s important to also understand that taking on
    this type of person might mean they die and you don''t get paid. However, if you
    are looking to invest into a retired couple, they are very likely to stay healthy.
    In this situation, you might even be able to take advantage of owner financing.


    First Home Bonus Help


    You could also use artificial intelligence to find first home buyers. In the United
    States, many states allow the first home incentive. This incentive was utilized
    to increase the number of young adults buying home. In other words, it was meant
    to increase the amount of tax revenue the state could claim. However, many young
    adults don''t even know this law exists. In fact, many young adults rent for the
    better part of their lives. This is because they tend to not know anything else
    and don''t realize how cheap owning a house can be.


    However, just because you have the first home incentive, doesn''t mean every young
    adult is eligible to it. There are requirements that a young adult must meet in
    order to purchase a home using the first home incentive. This is a repetitive
    task that can be handled by artificial intelligence. Since there are already rules
    in place, it defines what you need the machine learning algorithm to detect.


    Incentivizing Home Improvement


    Sometimes you have clients that can''t pay the average price. Let''s say that
    you have a family that is on state benefits. In other words, combined they make
    about $3,000 a month. This would be about $1,500 a month for each of them. This
    would qualify them in most states as being below the poverty level. Now, let''s
    also say that you have a home that isn''t in the best of shapes. If the family
    is trying to get the lowest monthly bill you can use artificial intelligence to
    detect that. Odds are is they are trying to go after low-end homes. Artificial
    intelligence might ask them what their income is, how much they''re looking to
    pay and if they are on assistance.


    Contractors can be rather expensive, but you don''t need contractors unless you
    are doing specialized work. If you''re doing anything electrical, you need a contractor.
    However, if you are just repairing what''s there then it can be handled by a person
    willing to watch YouTube. Therefore, artificial intelligence can begin asking
    about skills that they might have. Therefore, if they have an understanding of
    how to put down tile and there''s a lot of cracked tiles, that''s a bonus. As
    you can see, this could go for nearly every skill. This provides you with a situation
    where you don''t charge them as much for financing in exchange for improving the
    house. This would be ideal for sellers who just acquired a house and people are
    looking to buy it. You don''t have to give up your house right away because they''ll
    enter a contract where you owner finance them, but if they ever default or become
    unable to pay then you then you can re-obtain the house with improvements.


    You might do this for a few reasons. It’s too costly for you to do the repair,
    they are likely going to end up giving the house back, or you haven’t been able
    to sell the house for a very lengthy time.


