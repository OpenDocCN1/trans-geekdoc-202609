- raw: 'Likewise, you can offer help to go through different job industries. If a
    person is seeking finance, they usually do so because they cannot handle the upfront
    cost. This means that their job doesn''t adequately support what they want to
    finance for. Knowing this, many companies still financed clients. This is because
    usually, the financing is just to get over the hump of getting into a place. Once
    they are in that place, they tend to do very well. The problem comes when you
    want them to pay that financing off faster.


    You always want ambitious people to be the target for your financing. An ambitious
    person will try to get the highest paid job that they can when they can. Therefore,
    if you have an artificial intelligence design to find the most profitable jobs,
    you can then entice them for a better future. If a person denies this type of
    offer, it means that they are more comfortable where they are and not ambitious.
    That means that if they are fired, they are not likely going to be able to adapt
    to another job quickly. That means that should something happen to their source
    of pay, they are very likely to not be able to finish paying off what they owe.
    I''ve known several people who can pay their bills by working at McDonald''s,
    constantly complain about how they don''t ever have any money, and yet I see tons
    of job opportunities that they could fill that they don''t bother. Years later,
    while I write this book I still see them at their same jobs. They still owe money
    and they still complain yet their pay level hasn''t really changed. They are essentially
    stuck in that position because they are comfortable in it. You want to avoid these
    types of people because these types of people, when they lose their job, they''re
    not going to be able to easily transition into another. This is because they don''t
    bother learning new skills as a result of being comfortable.


