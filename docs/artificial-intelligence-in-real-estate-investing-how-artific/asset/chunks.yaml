- raw: 'It is rather easy to build artificial intelligence because artificial intelligence
    is simple. Artificial intelligence is a combination of binary choices. In other
    words, if you can break a problem down into yes or no answers, you can use artificial
    intelligence on it. This means it can handle a lot of the work.


    However, that doesn''t mean it can handle all the work. For instance, writing
    this book cannot be done by artificial intelligence. The reason it can''t be done
    is that of narrative. You might have heard of an artificial intelligence that
    was sold as an article rewriter. Specifically, companies like BuzzFeed produced
    artificial intelligence to write articles. Rather, they used artificial intelligence
    to find trending articles.


    If you use artificial intelligence to talk to other humans, it won''t be able
    to understand context. Narrative drives a story, it goes from A to B and therefore
    it needs context. The way that humans learn is that we learn the first item and
    then build on the first item we learn. The way a neural network learns is by making
    a combinatorial pattern of decisions that are optimized. Therefore, humans and
    neural networks learn very differently.


    There is some similarity to humans and neural networks because to expand our knowledge,
    we must make decisions. In fact, a combinatorial pattern of decisions is how we
    humans’ practice what we learn. Rules are defined ahead of time, we make decisions
    based off those rules, and then someone else corrects us. This is very similar
    to how a neural network works but we have a linguistic advantage.


    The linguistic advantage allows us to instantly translate input into context and
    vice versa. Artificial intelligence needs humans to translate context into input
    and output into context. Until artificial intelligence can translate context on
    its own and turn the output into context, it cannot do a job like this. Our language,
    by default, is a narrative language. It is a descriptive language whereas the
    machine learning language is a numerical language.


    This is the primary reason why humans have advanced so quickly, we can create
    associations by default. Machines must be told what associations should be made.
    We tell these machines how the associations can be made with mathematics. Sometimes
    the mathematics is simple, sometimes the mathematics is on the level of quantum
    physics. However, in all cases, humans must translate context from a linguistic
    standpoint to a numerical standpoint.


    This has its downsides and its upside. On the upside, so long as we can translate
    the context into numerical language, machine learning can do the job for us. The
    downside is that there are some things that machines will simply never understand.
    This means that there are some jobs that are truly irreplaceable by artificial
    intelligence. Specifically, the job that requires invention is the most impervious
    to artificial intelligence.


    It was thought long ago that if we could create artificial intelligence, that
    artificial intelligence would advance on it. In other words, artificial intelligence
    could create new mathematics. The problem is that mathematics almost always comes
    from curiosity. The curiosity about light, gravity, physics, and the whole lot
    use a contextual event that is not numerical. Yes, artificial intelligence can
    certainly become very advanced. However, it cannot pursue curiosity. We have yet
    to define curiosity into numerical terms. Once we manage to define curiosity into
    the numerical language, that is when General AI will exist. That is when all jobs
    will be replaceable.


