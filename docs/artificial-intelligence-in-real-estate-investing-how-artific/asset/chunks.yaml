    \ to become the input. By having ways of telling the machine what is correct and\
    \ not correct, you provide a continuous method of optimization. This forms what\
    \ is known as the gradient descent.\n\nMore Data Is Useful \n\nObviously, the\
    \ ultimate conclusion is that the more data you have the more accurate the machine\
