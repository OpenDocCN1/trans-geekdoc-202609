- raw: 'This led to a small market of people that would buy houses that were not up
    to date or in good condition. These people would then begin preparing them and
    selling them, much like the way we do it now. However, buying and fixing them
    usually didn''t take as long as it does now. There are a lot more standards that
    one must follow when repairing run-down houses such as Florida requiring water.
    Therefore, one, back then, would expect to buy a house and be able to sell it
    by the end of the month. This created a rapid expansion in real estate.


    Where There’s a Will There’s a Way


    The sale of houses was primarily designated for the banks and the individual person
    still. There was a small collective of people that were individually selling houses
    as a form of extra income. However, due to the price of houses, this was primarily
    a practice of the rich. The rich were able to buy lands outright, build smaller
    housing to fit the usually large land, and sell individual houses. It was the
    rich that was able to divide the land into smaller housing, which is why you often
    see very cramped big cities. These cities weren''t cramped in the beginning, but
    because of the real estate market, they became that way.


    The price of a house went down significantly with a lack of land. You could buy
    a plot of land that could fit 10 houses on it, but the incentive of the land was
    usually that there was land. Therefore, if you were selling each house for $10
    you would have expected to buy the land for maybe $50. Thus, buyers thought they
    were saving money when they were given the house for cheap (without the land).
    But sellers made a lot of money on the exchange. Buyers thought they were buying
    a significantly cheaper house in exchange for a loss of land.


    This is because building these houses usually required quite a bit of personal
    labor or hired hands. If you were a cashier, you are not likely built with the
    ability to make a house. In fact, one could say it be quite dangerous to do so.
    Instead, people began specializing in building houses and they would be hired
    to do so. They built houses fast and with the cheapest materials they could find.


    This is unlike the materials found in homes prior to this area. This is because
    homes prior to this era were built by the individual so they were often quite
    sturdy and they were overbuilt in most cases. These building companies would use
    math and building knowledge to lower the cost, time, and materials needed to construct
    the building. These are the people responsible for creating the numerous health
    hazards that come with older buildings.


    The average person didn''t know about this type of business unless they dealt
    with it directly because it wasn''t widespread for quite a while. Many of the
    cities in the 13 colonies were the first adopters of such practices. This is because
    these areas had the largest population.


    The Real Estate Era Began


    Eventually, the cities got bigger and the populations became unwieldy for these
    individual sellers. Therefore, since multiple sellers got a reputation, people
    wanted to learn from them so they could earn more money. This led to rich individuals
    hiring friends or family at first and strangers later to participate. These were
    the first real estate companies as many employees were located in one building.


    Running it as a business afforded these companies an additional opportunity where
    some skills were used more than others. Some of the employees were focused on
    solely finding houses. Some of the employees were focused solely on selling houses.
    And some of the employees were solely focused on the paperwork involved. In other
    words, by having multiple employees for the Real Estate Company, these companies
    could sell far more than they could all do individually.


    These companies expanded to begin selling in different states and that is pretty
    much the story from there for companies. These companies have been around for
    a very long time and it''s not going to stop soon. However, while companies have
    existed, that doesn''t delineate the fact that the individual person can also
    still sell houses.


    | ![image](Images/chapter_title_corner_decoration_left.png) ||  || ![image](Images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](Images/chapter_title_above.png)


    # The Individual Agent


    ![image](Images/chapter_title_below.png)


    The Individual Sale Never Went Away


    The truth of the matter is that the individual sale never truly left. The only
    benefit that companies had was that you could sell more at a faster rate. However,
    this is only achieved when people are selectively tasked. These companies designated
    jobs that people were faster at. Therefore, the work was divided. A person''s
    work was divided three ways. One for looking, one for filing, and one for selling.


    This primarily was used to save time because by dividing it into three, one-third
    of the overall time was spent. This gave companies an advantage over the individual
    meaning they could make more money. However, that didn''t stop people from trying
    to sell their own houses. There was plenty of real estate on the market for individuals
    to sell houses, but companies had a leg up on them.


    When a person goes to sell a house, they want to get the most out of their deal.
    This means that they usually choose a company because there is more safety. It''s
    much more likely that a company is going to be able to sell a house for the maximum
    value than an individual. This may not be true, but this is generally what the
    perception of a company versus the individual is.


    Companies might have the power to get all the houses from individual sellers.
    There are houses that companies don''t want to sell for various reasons. They
    may not have real estate agents in that area. That house might not make them a
    lot of money. That area is not favorable to selling houses such as high crime
    rate or low-quality schools. There are many reasons why companies don''t take
    all of the houses on the market. However, the individual didn''t really have access
    to these houses until something was made.


    The Classified Ad


    Most transactions either happened as a company or as a close neighbor. In other
    words, if you didn''t live near the person you wanted to take part in selling
    the house, you couldn''t sell houses. It was not a very convenient business to
    venture in. Companies had the ability to push their name out to people whereas
    the average individual did not. This meant that getting a hold of houses as an
    individual was incredibly difficult.


    The invention of the classified ad was born because people wanted to sell items
    their neighbors didn''t want to buy and companies didn''t want. The classified
    ad was an exchange section, like the old version of Craigslist. It was an area
    of the newspaper where one could find work, furniture, and bargains. This allowed
    the average person to go about selling houses and it was also word-of-mouth.


    You see, even though the classified ad section made it possible to find houses,
    it was often the place where you would see individual sellers. This would be the
    section where small-time real estate agents would sell houses on behalf of other
    people. These other people would hire them based off family and friend connections.
    Additionally, these real estate agents would go out and try their best to entice
    other people. What ended up happening was that the individual seller had a market,
    but it was small. This led to people selling houses in their free time rather
    than relying at on it as a job in it of itself.


    The Phone Line and Adverts'
