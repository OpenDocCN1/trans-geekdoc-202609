    # 情境感知


    ![image](Images/chapter_title_below.png)


    ## 残疾补偿


    在考虑为某人提供融资时，情境感知非常重要。有时，您会遇到一些对您和客户都有利的独特场景。有人想购买房地产，但尚不符合资格。本质上，他们没有足够的钱来完成购买。然而，他们拥有使其与众不同的独特能力。


    例如，如果一个人残疾，他们可以领取残疾金。通常，残疾人会从社会保障办公室获得每月工资。这代表了一种不太可能消失的稳定收入。在某些情况下，此人从事的工作类型可能被归类为爱好。在特定情况下，您可以从爱好中赚钱并同时领取残疾金。


    爱好的税率比正职工作高得多。然而，爱好可以被归类为非依赖性收入。因此，某人每年可能从爱好中赚取近 24,000 美元，同时仍领取残疾金。这是一个非常有趣的漏洞，极少有人利用，甚至极少有人知晓。然而，如果您有
    AI 在寻找这类人，您就可以利用这一点。既然规则由税法规定，这意味着您有了符合该场景人群的定义。


    本质上，税法定义了您需要利用哪种机器学习来挖掘这类人群。现在，重要的是要理解，接纳这类人可能意味着他们去世导致您收不到款。然而，如果您打算投资给一对退休夫妇，他们很有可能保持健康。在这种情况下，您甚至可能利用“业主融资”。


    ## 首套房奖励援助


    您还可以利用 AI 寻找首次购房者。在美国，许多州允许首套房激励政策。该激励政策旨在增加购房的年轻成年人数量。换句话说，目的是增加州政府可征收的税收。然而，许多年轻成年人甚至不知道这项法律的存在。事实上，许多年轻成年人大半辈子都在租房。这是因为他们往往不了解其他选择，也没意识到买房可以有多便宜。


    然而，拥有首套房激励政策并不意味着每个年轻成年人都符合资格。年轻成年人必须满足特定要求才能利用首套房激励购房。这是一项重复性任务，可由 AI 处理。既然已有规则，这就定义了您需要机器学习算法检测的内容。


    ## 激励房屋装修


    有时您会遇到无法支付平均价格的客户。假设有一个家庭依靠州救济金生活。换句话说，他们合计每月收入约 3,000 美元。这意味着每人每月约 1,500 美元。在大多数州，这符合贫困线以下的标准。现在，假设您有一套状况不佳的房子。如果该家庭正在寻找最低的月供，您可以用
    AI 来检测这一点。他们大概率在追求低端房产。AI 可能会询问他们的收入、预期支付额以及是否在领取救助。


    承包商费用可能很高，但除非您在做专业工作，否则不需要承包商。如果涉及电气工作，您需要承包商。然而，如果只是修缮现有设施，则可以由愿意看 YouTube 学习的人处理。因此，AI
    可以开始询问他们可能拥有的技能。因此，如果他们懂得如何铺瓷砖，而房子有很多裂开的瓷砖，这就是一个加分项。正如您所见，这适用于几乎所有技能。这为您提供了这样一种情境：您降低融资成本，以换取他们改善房屋。这对于刚获得房产的卖方和想买房的人来说是理想的。您不必立即放弃房子，因为他们会签订业主融资合同，但如果他们违约或无力支付，您可以收回一座已改良的房子。


    您可能出于几个原因这样做：维修对您来说成本太高；他们很可能最终会把房子还回去；或者您很长时间都卖不出去这套房子。


