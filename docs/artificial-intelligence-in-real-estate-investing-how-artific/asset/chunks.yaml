    ![image](Images/chapter_title_above.png)


    # Machines Learning to Evaluate


    ![image](Images/chapter_title_below.png)


    ## A Machine Needs Only Numbers


    Now, as I said, you need to translate context for a machine. However, we''ve already
    done this ourselves. In order to look at crime statistics and compare them, we
    have already put a numerical value on murder, thievery, and fraud. In order to
    look at the median income of a city, we''ve collected the income of everyone.
    To improve specific neighborhoods, we have taken the time to assign income to
    quadrants.


    What this means is that most of the information that we needed to translate context
    has already been done. It''s just a matter of getting access to that information
    and compiling the information into a machine learning network.


    ## Numbering Context Over Years


    This also hasn''t been an easy process and it''s taken many decades. In fact,
    we didn''t have a really good consensus until about the 1960s when computers began
    to get involved. The simple truth of the matter is that humans are slow compared
    to machines when it comes to numerical equations. So, by the 1960s we had a population
    so huge that we couldn''t keep track of it. Not by human hand at least, which
    meant that we needed to hand it over to machines.


    Therefore, since the 1960s, we have quantified these contextual items into numerical
    form for computers. This has bequeathed us a huge library of information that
    real estate agents can use to make machine learning products.


    ## Quality of Life Now Measurable


    Perhaps the most advanced measurement is the quality of life measurement. It is
    only in the past 100 years that we have been able to adequately measure population
    among other things. It is only in the past 50 years we have been able to measure
    the quality of life. The quality of life includes things like life expectancy,
    income levels, poverty levels, and many other variables. This is useful for machine
    learning algorithms when it comes to selling houses.


    Selling a house is really a combination of two different things. The first item
    is that you need to measure the cost of the house. Then you need to measure the
    cost of the environment. A million-dollar house built-in the poorest area of the
    neighborhood will have the poorest environment, so it is likely not going to be
    a million dollars.


    ## Compensating Other Context


    This creates a compensatory area where there is now competitiveness between the
    cost of the environment for the cost of the house. For instance, you may have
    a poor house, but it might be nice to live next to some of the fanciest restaurants
    there are. You might have a house on the water, but the house is rundown.


    In other words, you might have a gray house in a very bad environment. You might
    have a horrible house with an environment that doesn''t just include the basic
    necessities like crime and school quality. Being able to say that your house,
    that you''re selling, is near a grocery store or high-end restaurant gives you
    an additional selling point. This can be referred to as compensatory cost or the
    benefits of living in the area that are not necessary.


    | ![image](Images/chapter_title_corner_decoration_left.png) ||  || ![image](Images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](Images/chapter_title_above.png)


    # Faster Faster Faster


    ![image](Images/chapter_title_below.png)


    ## Selecting Potential Houses


    By having a machine learning algorithm keep track of all this, you''re able to
    move much faster in the market. You''re able to find the right houses with the
    right environments and buy them at the right times.


    In the past decade, the average way of buying a house was looking at what was
    available at different times in the day. You would go over the same process and
    waste an hour to an hour and a half a day. This was simply to look at what was
    available.


    A machine learning algorithm that understands what you''re looking for and can
    do this for you. It can also do much more than that. We can find the right house
    for the right price but also do the three to four hours of research. Should you
    find a successful house, you have to do additional research.


    This research included crime statistics, quality of life, and school quality.
    A machine learning algorithm will find the right house for you and look at all
    those variables automatically presenting you with the best house to buy.


    ## Viewing Those Houses


    On top of this, if you mix virtual reality into this selling process you don''t
    actually have to meet with your clients. The more likely case is that you''ll
    bring a client into a viewing area where they put on a headset and look at the
    inside of the house along with other clients looking at the same house.


    This cuts down on the amount of time wasted on driving from house to house. Instead
    of having to negotiate times with clients to go look at houses at different times,
    you can simply bring them into a room where they put on a headset and look around
    the house as much as they want. Almost 90% of a real-estate agent''s wasted time
    comes from driving.


    ## Filtering Applicants


    You can also begin to filter out applicants based on things like relative income.
    In the past, someone would apply to get a house and you would request information
    from them. You would then go through the process of getting that information,
    doing a background report on that person, and getting a credit report.


    This process actually takes quite a while. In fact, while the house may be up
    for sale at the beginning of the month, it may not be sold until the end of the
    third month. This is because this communication between humans is rather slow.


    You might send a request for information and wait another week to two weeks to
    get that information. You could then run a background check, which requires them
    to pay you to compensate for the cost of a background check. You then need to
    wait for the background check to get back to you, which has increased in speed
    over the years. You then also need to get a credit history, which can take some
    time.


    Then, once you have done this for every applicant you then begin going through
    the applicants you want. If the list is somewhere around 10 to 20 people, you''re
    looking at around 10 to 20 people that you have to repeat this process for. Even
    worse, this process is manual and so you have to personally spend time.


    Knowing this, machine learning and the internet can make this process a whole
    lot quicker. A person can sign up to your website, submit all their information,
    and process a fee for a background check and a credit check.


    The best part about this is that this ecosystem is all online and automatic on
    your side. This means you no longer have to waste time of your own to go through
    every manual step listed out before. Essentially, you can automatically filter
    out the applicants you don''t want without ever having to deal with them.


    ## Even Dotting the Lines


    The best part is that it doesn''t stop there because you can use online services
    and machine learning to formulate contracts. You can use the past history of the
    person to create a contract that better fits them and you rather than use a one-contact-fits-all
    solution. A person might have a disability or a cat or some special circumstance.
    You can use background information of a person to generate a contract that specifically
    aligns with the needs of yourself and the person.


    Additionally, you can have that contract signed in a more secure way. By having
    the contract online, you can record the signing of the contract. This allows you
    to progress with the contract without the need of a notary. Setting up a notary
    can take time if you don''t have one in your pocket. By being able to record what
    you''re both doing you don''t need a notary to confirm a contract in most situations.

