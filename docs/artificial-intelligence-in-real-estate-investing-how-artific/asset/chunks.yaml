    # Debt


    ![image](Images/chapter_title_below.png)


    Paid Vs Unpaid


    It is very important to understand if a client is willing to pay off their debt.
    The number one thing you don''t want to see as a person who finances is a customer
    who never seems to pay off their debt. A credit report will tell you how many
    accounts they have open as well as how full those accounts are. The credit score
    is a bit ambiguous, but he usually represents how often they pay off their credit
    cards.


    Therefore, the first step is almost always to check whether the customer usually
    pays off their debt. Additionally, there is something unique about certain debtors.
    Some of them will completely max out but never be late on a payment. They will
    continue to max out, but they will keep up with payments. This is a debtor you
    do not want to have.


    Revenue Vs Credit Line


    This is where understanding their overall revenue versus the amount of credit
    line they have is important. Really, a person should only have enough credit line
    to take up half of their annual paycheck. If they have more than that, they run
    into a situation where no matter how much they work, it will take years for them
    to pay off their debt.


    In such a situation, if you finance them, you run into the situation where they
    prioritize debt. Yours will likely be the debt that they prioritize but some of
    their debt is like Care Credit. Care Credit is a service where the credit line
    is specifically dedicated to those who need help paying medical bills. This means
    that they could easily rack this credit card up without even meaning to. If they
    get annual checkups like most people are supposed to, this credit card will have
    around $500 on it every year at the minimum. If they go into the emergency room
    even once, that balance suddenly shoots up to $2,000. I''m not saying that all
    emergency room visits will be that price, but they generally tend to be within
    that range. I remember a couple of years ago being charged $500 for just entering
    the emergency room.


    Essentially, if they have more credit line than they do revenue, they are in a
    situation where they max out their credit then there''s no more revenue to offset
    the cost. Let''s say that our potential tenant earns about $24,000 annually. That
    tenant has $24,000 of a credit line. Most cards will have either a $40 minimum
    or a 2% minimum. This means that if they max out their credit line then the minimum
    they would pay is $480 for the entire year. If they are a customer of yours and
    you charge them $1,000 monthly, they have plenty of money to spend towards paying
    off that credit card and then paying off the finance. This is because it''s one
    credit card. However, interest plays a funny role in this.


    Let us say that the interest rate on this credit line is 5%, a very nice healthy
    5% (not realistic). That’s an extra $100 a month on top of $40 a month. Now, it
    doesn’t matter if you split that amongst multiple cards. However, if the cardholder
    only ever pays the bare minimum then that’s really $60 a month. That means they
    will pay their card off in 400 months versus 171. Thus 33 years versus 17 years
    of debt.


    Deferred interest is the nasty bug here, which Care Credit has. Deferred interest
    is more likely to be 30% of the original balance the deferred payment is on. So,
    let’s say something horrible happened and The Deferred interest is on the $24,000.
    A person who’s going to take 33 years to pay of the regular balance is no match
    for paying off $24,000 in a single year let alone $31,200 when that interest hits.
    Their annual bill goes up to $624 with interest hitting $1,560. If they’re making
    $24,000 then they will never get out of debt.


    Before we hit Deferred debt, the client had a possibility of paying off the debt.
    Once the special clause of Care Credit hit, the client no longer had the ability
    to pay off their debt. This would lead to bankruptcy and you would be outed the
    money you financed. Therefore, paying attention to the types of credit line they
    have is very important. It’s a hassle to do this every time, but, with AI, you
    can predefine rates. You can skip this hassle and the AI will just tell you the
    risk of the client you’re looking at.


    Intended Future Investments


    Another trick that you can do that is very similar to a personality test is determined
    by their future Investments. Let''s say that you might be financing a college
    student. A future investment would be the type of job that the college student
    is going to college for. Therefore, you can have artificial intelligence investigate
    the success rate of that job and degree. So, if a college student is going in
    for computer science and they are looking to become a web developer, you can look
    at the hire rate for web developers. More importantly, you can look at the hire
    rate of that job for the area of the house you''re financing.


    Since its web development, odds are high that they are likely to find a job. This
    means that they will get higher pay and they will be able to pay off what you
    finance them for much faster. On the other hand, if they took a course for gender
    studies, this would be a different matter. Gender studies do not have a fantastic
    job score when it comes to a hire rate. While the current generation of college
    students may think that such a job is important, there aren''t a lot of job roles
    those people can fill. This means they will often find themselves jobless. This
    also means that they are a risky investment. However, this kind of has to be handled
    by artificial intelligence.


    Job rates change a lot. For instance, with web development, front end development
    was exploding nearly two years ago. Now, you''ll find that most companies that
    look for front end development are in the bigger cities. This is because a lot
    of people rushed to fulfill this role. Likewise, the job rate fell significantly.
    This is just one industry with one specific type of job. If you think of all the
    industries that are out there and their specific jobs, you begin to understand
    why you need artificial intelligence. A single human simply can''t go through
    all those different jobs and keep a consistent job rate available for comparison.
    Instead, a single human would do it on a per basis average. Therefore, time would
    be wasted every time a client sought out funding. Therefore, artificial intelligence,
    which can do it all the time and much faster than humans, is perfect for this
    type of job.


