    ![image](Images/chapter_title_above.png)


    # AI Became the New Frontline


    ![image](Images/chapter_title_below.png)


    ## AI Filters Applicants


    In the past, applicants would send an email or postal mail to try and buy a house.
    In the postal mail days, this would often take weeks at a time. It would take
    weeks because even if you sent out the mail in your city, you likely wouldn''t
    see it in the mailbox it was going to until about 2 to 3 days later. Trying to
    send that out to another city, you could expect about a week or two before it
    got there. Emails made this whole process significantly faster.


    However, both had the same problem attached to them. Let''s say that you got 50
    applicants in a single week. It takes you about 10 minutes to look at the application
    that sent it. From opening it, to reading it, and to deciding on it, all of that
    took 10 minutes. That means that mail wasted 500 minutes of your time. That means
    that nearly 9 hours of your time was wasted on just mail.


    On the other hand, email wasn''t as efficient as everyone perceived it to be.
    Yes, you are likely to send and receive the application faster but going through
    it is the same speed. It also gave you an additional problem; more people. By
    receiving the mail faster, you received more applications faster. Therefore, instead
    of 50 applicants in a single week, you might have gotten somewhere near a hundred.


    So, you have more customers but you''re wasting almost double the amount of time.
    You''re wasting 17 hours on just reading mail. Now, that may not have been the
    experience for all real estate agents, with some being worse and some being better,
    but it''s an example. This highlights a huge problem.


    The problem is that there''s simply not enough time to look at everyone''s application
    in a single week. This is why even though communicating that application has been
    faster, going through that application as not really improved until recently.
    This is because artificial intelligence can be used to sort through those applications.


    Artificial intelligence allows you to select parameters for what you look at in
    your applications. For instance, if you want people of a certain level of income
    for specific houses, artificial intelligence can sort through the email. You simply
    request the annual income when they try to buy a house. The artificial intelligence
    looks through all of the emails and associates that income to the house to see
    if it meets the requirements. If not, that applicant is automatically filtered
    out or is put in a separate folder for later consulting.

