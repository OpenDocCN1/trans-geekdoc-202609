    # BOOK DESCRIPTION


    Congrats on purchasing this book. You are about to delve deep into the future
    of real estate investing, property management, real estate financing and marketing.
    If you are excited about the industry or even just curious about the future of
    the real estate industry, then this book is for you.


    The book starts off with the history of Real Estate Investing in the United States.
    From the days of early colonization to modern use of online rental applications,
    it goes through every stage in the process; so, you know how we got to where we
    are today.


    Then the book talks about how we can use advanced artificial intelligence tools
    like machine learning and neural networks to evaluate property prices; in addition
    to using tools like VR (virtual reality) to improve the customer experience.


    The book then talks about how the role of real estate agents will change with
    introduction of high efficiency algorithms to filter applications, complete paperwork
    and properly evaluate property rates. There will also be a significant increase
    in security with facial recognition systems and reduction in maintenance costs
    with use of home sensors.


    While the real estate industry has been slow in adapting digital marketing tools
    compared to other industries, research indicates that use of these tools will
    significantly reduce customer acquisition costs. It’s just a matter of time before
    it is used all across the real estate industry.


    Then, the book looks at how artificial intelligence will significantly improve
    the way landlords pick the best rental applicant. While credit score and current
    income are reasonably good factors; they miss out on a lot of critical factors
    that artificial intelligence can easily capture.


