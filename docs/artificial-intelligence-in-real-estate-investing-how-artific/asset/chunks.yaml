    VR is a fantastic addition to the real estate space. You no longer have to worry
    about meeting clients at houses if you can do it in VR. The way the VR works in
    real estate is between two different devices. You have a house scanner, which
    you bring into a house and it scans the house itself. This scan produces a 3D
    model that can then be used in a virtual reality environment. You then use Virtual
    Reality tools like the `Oculus Rift` and the `HTC Vive` to look at the house as
    a 3D model.


    This investment is extremely low cost because you only need to buy a computer
    that''s powerful enough to run VR. There is a software company that is currently
    the only known one on the market that provides scanning. The scanner is extremely
    expensive to do it yourself, but you can hire someone to do this for you. These
    scans usually run a couple of hundred dollars. However, you can then reuse the
    3D model however much you want and never have to force a meeting with your clients.


    The reason why this is a fantastic addition is that not only do you cut down on
    driving time, but you also cut down on viewing time. Normally, real estate agents
    give their clients about an hour to a half an hour to look at a house. There are
    only so many hours in a day. With VR, as many VR systems as you have you will
    be able to show off a house. That means if you have 12 clients, normally a full
    day of viewing, with six machines you could be done in 2 hours. This saves a lot
    of time, time that can be spent on getting and selling more houses.


    ## AI: Worth and Management


    AI has done a lot of things since its conception. In the world of Real Estate,
    artificial intelligence can do a number of things. While we will get into this
    deeper a little later on, artificial intelligence can tell you the worth of your
    house and a potential selling price. In the past, you would have to look up selling
    prices of local houses, the features of your house, and the quality of the environment
    around the house. If you really wanted to get the most money, this process would
    normally take a couple of weeks.


    Artificial intelligence can take all of the data found online and give you the
    most optimal numbers within a few minutes. Now that we have the quality of school
    measurements, crime statistics, online selling databases, and a lot more data,
    artificial intelligence can be quite the useful tool. Instead of eyeballing a
    number, the artificial intelligence will find the most optimal number given the
    data, which usually results in a higher price.


    However, that''s not all that artificial intelligence can do. For instance, `Zenplace`
    is an application that allows landlords and property managers to be more effective.
    The website offers services such as being able to find new tenants, keep optimize
    schedules of maintenance and repairs, and even allows tenants to pay through the
    chat system. An additional benefit to artificial intelligence is how much information
    it can memorize.


    When a tenant comes to buy a house, they ask for things like square footage, the
    terms that the tenant will be agreeing to, and many complex things that are not
    easy for a human to remember.


    ## Safety on All Sides


    As for the laws surrounding real estate, most of it is just protection. There
    are a few different ways to utilize a piece of land, but it''s usually the government''s
    choice. Not only that, but you have the fact that different states have different
    real estate laws. The problem is that there is so much law concerning the buying
    and selling of a home that it can''t fit in a single book less than a hundred
    pages.


    A good example of this is the real estate licensing that occurs. In some states,
    you have to be licensed in order to sell houses. In other states, it''s an optional
    item that adds to your credibility. A real estate license is a far more complex
    process than getting a regular license. You have to sign up for a pre-course and
    then take a licensing exam, both of which are state approved. This brings you
    on board to becoming a real estate agent that is licensed.


    However, the benefits of being a real estate agent that''s licensed sometimes
    negatively impacts your business. You have to disclose that you are a real estate
    agent, which some people prefer not to work with. You often are required to work
    with a broker, which represents a bigger business. This is to protect the consumer
    because if you don''t have the money, the broker will probably be insured. This
    allows consumers that have been victims of fraud to go after someone that has
    money.


    The beauty about the internet is that it has taken these laws and simplified them.
    For instance, one could use a website like `Trulia`. This website allows you to
    look for houses in your local area. It then provides many of the benefits that
    have come with the internet. You can understand the school area, crime statistics,
    and even get a virtual tour of the house and neighborhood. Once you''ve decided
    on a house, you can then get a pre-qualified mortgage loan to cover that house
    through the website. You can then contact the owner of the house and try to get
    the house.


    The reason why I point this out is because of how much time it used to take doing
    all of this. It''s only recently that we have graded schools. It was really only
    since the 1960s that we started having a robust crime statistics system. It is
    only within the past decade that you could get a mortgage loan and a house on
    the same website.


    Therefore, some of the information was never available to you. You would have
    to travel to each house and area to do research. It might take you a week or more
    to do research on an area. You would then have to go to a bank and get a mortgage
    loan but only after you had chosen a home. You would have to look at advertisements
    or, further in the past, just walk around the town you wanted to be in to hopefully
    find a house.


    Thus, taking the jump to purchase a house was usually a month to a three-month-long
    endeavor. Now, you can spend a few hours of your day looking at residences to
    find your perfect house. You can then spend maybe another 30 minutes filling out
    a mortgage loan application. Finally, you can then start the process of buying
    the house you wanted without investing anything ahead of time. All because websites
    and companies have simplified the laws around buying and selling real estate.


    ## Filtering Out Time Waste both Client and Agent Side


    As you can tell there''s actually a common theme running through all of the evolutions
    of real estate. Almost all of the evolutions happened because it saved time for
    either the client or the agent or both. Companies formed as a way of selling faster,
    thus saving time for real estate agents. Advertisements came out that saved time
    for customers trying to find homes elsewhere in the country. The online world
    came into existence and it saved time for both of them by having the services
    online. Websites simplified the barrier for getting homes and expedited communication
    between buyer and seller.


    The rules around real estate haven''t really evolved that much beyond the standards.
    There are standards in place that real estate agents must follow. These real estate
    standards have been put in place to prevent fraud and protect customers. However,
    they depend on the state you plan to sell in.


