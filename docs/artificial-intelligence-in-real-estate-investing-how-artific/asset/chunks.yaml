    ![image](Images/chapter_title_above.png)


    # A New Frontier


    ![image](Images/chapter_title_below.png)


    ## Skyline


    Skyline is a company that helps to lower the cost and mayhem that comes with asset
    and property management. It primarily focuses on predicting trends in pricing
    and quality of property you might want to buy in a specific area. Additionally,
    it also schedules pricing rental values with renovation choices so that you get
    the optimal return on investment.


    You act as a member in their program and they make money when you make money (take
    a percentage of your revenue). Having said that, they tend to throw around the
    word "AI" like it turns everything into gold. After all, you can predict the growth
    of population and neighborhood value if you watch a few factors. These items will
    increase if the following happens. More jobs often means that more people want
    to live there. Tourist attraction count going up or improving often means that
    seasonals will want to be there more. Tech innovation in the city and in commercial
    areas mean that business value goes up, meaning it''s worth more to work in that
    area. Lastly, city populations are calculated per year. You can compare that with
    how many children were born each year to find out how many people moved to that
    city. This will tell you how much the population is organically growing versus
    economically growing. When it is economically growing more than organically growing,
    that means the city has a lot of value in it.


    Now, if it just seemed like I threw variable after variable up there, it''s because
    that is ultimately what the artificial intelligence usually looks at. There may
    have been variables I did not account for, but most of this can be done by hand.
    Then you can evaluate the value of neighborhoods in the city to come to an optimal
    price for rentals and selling.


    The important thing to note is that AI does all of this for you, which means you
    have more time on your hands to make money. That is the ultimate point of this
    type of software.


    ## Proportunity


    The primary goal of the company is to lend money to then sell homes they have
    their hands on. They do have an option to add real estate from other websites,
    but they need to be on popular websites that they approve of. This creates a bigger
    version of landlord and tenant in reality, but with much higher rates. Since this
    is a loan, interest rates can be charged on top so it''s far more expensive. They''ll
    talk day and night about the discounts, but what they really try to hide is their
    "smart platform".


    AI is very similar to what the average "Gaming PC" was in 2016, very confusing
    for the average person. Unless you have someone explain it to you (it can still
    be confusing in some cases), AI is a tangled mess of foreign words. The only paddle
    you get to wade into the AI pond are the mathematical expressions... and those
    are unwieldy, to say the least.


    While one cannot say exactly what their AI is doing, one can certainly speculate.
    There are many factors that identify growth areas and undervalued houses. The
    percentage of available job listings is a good way to see city growth. The percentage
    areas of bought homes during certain times also help with determining neighborhood
    growth. Undervalued houses could simply be houses that are sold by small-time
    sellers or independent owners that didn''t do some easy math. If you take each
    house on a block and determine the optimal percentage those houses are sold at.
    Then you do this with the existing real estate in the city, you get a percentage
    range. This is a basic range at which you can mark up the value on a house. If
    you''re below this range, you''d be undervaluing a house.


    Now, this isn''t to say that there isn''t something more complicated behind the
    scenes. It is just very easy (as an AI programmer) to see how one could make such
    a system. However, if one looks at the Terms and Conditions, they make it so that
    no one is allowed to show anyone how their website works. That''s right, they
    have legal terminology specifically designed to try to curtail Fair Use law. According
    to these guidelines, I can''t even citation them. Make of that what you will.


    ## Enodo Score


    Although the website is a little broken, it is quite the impressive tool. Enodo
    is a beta website (as of writing this book) that allows you to consolidate a lot
    of information. The artificial intelligence seems to come in the form of a web
    crawler and statistical mathematics. A web crawler is a programmatic mechanism
    that searches the internet to discover information. This one seems to target key
    search terms, pre-storing the results in a database.


    In the case of Enodo Score, they provide you with both the information and analysis
    of neighborhoods in a given area. This is actually quite expensive if you try
    to hire someone for this. If you do it yourself, it''s also very time-consuming.
    Therefore, the website is really built around the concept of saving time.


    ## Companies Like These


    Companies like these are really the first of their kind because of the AI implementation,
    but the implementation is light. This is because the bar for entry is exceedingly
    low right now for this market. These can be useful tools, but you could create
    such a system with improvements rather easily.


    I see a few more things happening before this industry becomes noticeable by the
    average person. The average person won''t use the search terms "AI" and "Real
    Estate" together. Here''s what I see happening.


    The first thing that will likely happen, since AI has already started its incorporation,
    is Blockchain incorporation. The Blockchain would be extremely useful for the
    real estate industry, especially for record keeping. Since the Blockchain is nearly
    impervious to tampering, it serves well in cases where a notary would play a role.


    The second thing that I see happening is that real estate companies will act more
    like software companies. AI can handle helping people find a house, sell the house,
    and a human is only involved in transaction completion. Therefore, with things
    like viewing, it''ll be done through the browser or on the phone. As such, the
    tools will eventually become the company front. However, the days where a real
    estate agent walks you through a house are slipping away quickly.


    The final thing that I see happening is something we see from the tech community:
    material reuse. There are a lot of homes being constructed, even though the birth
    rate has actually slowed down and the death rate sped up. This means that real
    estate building will inevitably decline. Even more, many are now opting for the
    RV life, a real estate opportunity of its own.


    It is not only cheaper to update an older house to newer standards, but it''s
    less taxing on the environment. It''s less expensive and it''s easier to do, thus
    recycling houses will become even more common. As there are fewer new families,
    there will be a natural decline in new houses once the market figures this out.
    As of right now, the market has yet to figure this out on a wide scale so only
    small companies are doing this. However, those companies are quickly growing while
    "new house" companies are flopping quicker.


    With applications like Airbnb taking advantage of this overall trend, they''ve
    quickly become one of the biggest markets in real estate rentals. There will be
    similar companies climbing that ladder using different methods; AI methods. Thus,
    it is only natural that once Blockchain is incorporated and real estate becomes
    more like software that real estate will become a reused resource like t-shirts.


