- raw: As you can tell, it's not really that difficult and that's because what you're
    looking at is not that complex. If you're looking to buy a house, you look at
    crime statistics and school quality or whether something exists in an area. School
    quality is often determined by letter grades and crime statistics are already
    numbered. Therefore, all you do as a real estate agent is look at the number to
    see how high it is for crime statistics. In fact, you do the same thing with schools.
    The only difference is that with schools, you're looking for a higher number.
    Meanwhile, with crime statistics, you're looking for a lower number. That means
    the average calculation that you must do is simplistic and repetitive, which means
    that artificial intelligence can do it. As you can tell, it's not like you're
    dealing with a thinking, breathing machine. You're just dealing with a very fancy
    calculator and there's honestly no reason to fear a calculator. Over time, we
    might create something known as general AI and that is something to be wary about,
    but not a calculator. So, you can either embrace artificial intelligence and make
    it part of your workflow or you can retire when it's part of everybody else's
    workflow. The choice is up to you.
  fmt: '

    ## AI 与房地产决策：拥抱工具而非恐惧


    正如你所见，这并不困难，因为问题本身并不复杂。如果你想买房，你会查看犯罪统计数据、学校质量或某区域是否具备特定条件。学校质量通常由字母等级决定，而犯罪统计数据本身就是数字化的。因此，房地产经纪人所做的只是查看数字，看犯罪统计数据的数值有多高。事实上，学校评估也是同理。唯一的区别在于：学校评分越高越好，而犯罪数据越低越好。这意味着你必须进行的平均值计算既简单又重复，因此人工智能完全可以胜任。


    正如你所见，你面对的不是一个会思考、会呼吸的机器，而只是一个功能强大的计算器，诚实地说，没有理由恐惧计算器。随着时间的推移，我们可能会创造出所谓的通用人工智能（AGI），那才是需要警惕的，但计算器不是。所以，你可以选择拥抱人工智能，将其融入你的工作流；也可以等到它成为所有人工作流一部分时再选择退休。选择权在你手中。

    '
