    # AI Filters Agents


    As you can see, this allows you to automatically sort through the applicants you
    would have naturally rejected. Therefore, you likely saw 100 emails a day that
    got shortened down into maybe 20. This saves a significant amount of time, especially
    since it''s automatically sorted for you for the best candidates.


    Knowing that you''re getting the best candidates for your houses doesn''t mean
    you''re going to get the best sales. After all, artificial intelligence hasn''t
    quite made it to a level where it can sell the house. Sure, you can definitely
    sell the house with artificial intelligence, but you won''t get the most money
    out of it. The reason behind this is because artificial intelligence chooses the
    optimal value for the house. Real estate agents go for the highest number. That
    means that while the house is based in some reality, the price doesn''t necessarily
    match it.


    However, if your artificial intelligence creates a personality report of your
    consumer, you can have the most optimal real estate agent. When you have an artificial
    intelligence like a chatbot converse with a customer, they give away a little
    bit of their personality. Normally, when you ask for life goals or the job that
    they do, they''ll accompany it with descriptions. Those descriptions can create
    assumptions about the type of character that person is.


    There are cases where you do have the ability to have them take a personality
    test. However, that''s a little bit more intrusive than some companies would like.
    Therefore, if someone''s life goal is to enjoy time with family and they are particularly
    old, they are very likely going to pay attention to details. If the person is
    wanting to move down there just for tourist-like reasons, they''re not likely
    going to pay attention to the key details. The key details are what ultimately
    decide how high the price can go. Therefore, if an older person is looking in
    the market, they are likely to have had several different houses with benefits.
    If the person is a tourist that is looking for a permanent residence, they''re
    likely looking for the easiest and most outwardly beneficial place. This means
    that the real estate agent can sell higher to the tourist.


    There are many situations where you would want to create personality profiles
    on the fly, but you wouldn''t have a lot of information. This is why chatbots
    are useful because a chatbot is a lot less intrusive than a personality quiz.
    You can also word the questions much like a real estate agent might ask a question,
    which hides the true purpose of the chat box system. Using artificial intelligence,
    none of your company''s time is taken up by assessing the personality that this
    person has.


    ## AI is Faster and Can Do More


    Lastly, artificial intelligence is extremely good at doing things really fast.
    It can look through hundreds of records of history to find the best houses. It
    can look at the income levels of an area versus the crime statistics to choose
    the best environments. It can throw you forecasts of how much the house might
    be worth in about a year and do so much more. The point about this is that it
    is much faster for artificial intelligence to do.


    Now, you might be thinking about how you can easily just go online and look up
    the level of income for the county. This is quite easy and many real estate agents
    do it. You might also be realizing that most of the steps are repetitive and easy.
    If something is repetitive and it comes in numbers, it can be done by artificial
    intelligence.


    Let''s say that your company has 10 houses a week to go through. Each house must
    have a profile attached to it, which means school quality, environmental quality,
    and structure quality. Environment quality is broken up into crime statistics,
    job availability, and convenience availability. Structure quality is broken up
    into assessments, appraisals, and improvements. These all take time and almost
    always follow the same steps. Artificial intelligence can do all of this. If you''re
    spending somewhere around a work week just to maintain this, you can put an artificial
    intelligence to task. This is where you can minimize the amount of work done by
    humans, thus saving you money.


    # Where to Minimize Work


    ## On Application


    The first way that you can minimize work with artificial intelligence is in the
    application process. The application process is the slowest of all the processes
    in terms of bulk work. You might have to wait a bit longer with background checks
    and credit reports, but the application takes the longest physically.


    The first bonus is that we can have these applications online. That means somebody
    goes to a website and fills in their information to apply. This saves a ton of
    time because it used to be that you mailed your application in, sometimes still
    do.


    The second bonus is that these applications are often stored as email. This has
    worked well for a long time but sifting through those applications takes a long
    time. Therefore, while we don''t have to wait for postal mail, we still waste
    a lot of time during the review process. This is where artificial intelligence
    can minimize the work. Artificial intelligence can take the application, review
    it, and sort it. This means customers hear back almost instantly if they are pre-qualified.


    On top of that, artificial intelligence can take what''s inside of the application
    and use it to find available houses. This would mean that the artificial intelligence
    provides you with houses alongside current applications. On top of this, artificial
    intelligence can submit background checks and credit reports. Since most of the
    information on an application is the same information on background checks and
    credit reports, that information can be reused.


    This means that a customer can apply, pay a fee, and you receive everything you
    need without having to manually review anything. You get the background checks,
    credit report, the application, and the houses that this person can participate
    in a transaction with. This saves a real estate agent a lot of time. However,
    there are other aspects of the transaction that time can be saved on.


    ## Initial Interview


    This is where the initial interview comes in because once all the information
    is in, it''s time to meet the client. The problem is is that this is more of an
    introductory interview than anything else. Most real estate agents have a transcript
    of questions they want to ask their prospective clients. This means that they
    are going to ask the same questions to all the clients with only some of them
    having additional questions because of certain elements.


    An artificially intelligent chatbot system can handle this interview for you.
    In fact, right after they put in their application, they can continue right into
    a chat box. This chat box will ask the questions you plan on asking them. Likewise,
    the prospective customer can ask the chat box commonly asked questions. This saves
    you the time from having the initial interview and the time used for them to ask
    questions.


    In addition to saving time during the initial interview, this area can actually
    be optimized to include personality reports. Personality reports provide you with
    a way of figuring out how to sell to the person. Half of the battle of selling
    a product is selling yourself to the person you''re selling the product too. Therefore,
    most of the sale pitch is built upon how you can figure out their personality
    to figure out what they want. This is because that is how most sales are done,
    regardless of what numbers are in front of a person.

