- raw: 'The third element is in the form of an advertisement. People like knowing
    that they live in a secure neighborhood and a secure house. In fact, some people
    need security for their jobs so even though they rent, they wind up putting a
    security system in place. Having additional security with the backing of artificial
    intelligence becomes a huge selling point for real estate. It can justify a doubling
    of a price tag for rent or increasing the real estate value by a third of the
    price.


    If you take everything I just mentioned and included with a rental or a community
    home, it serves as its own advertisement. Knowing that people''s stuff is safe
    while they are out and knowing that it''s difficult to get in the home, people
    will be enticed by these two facts alone. If a person buys a 70-inch television,
    they do not want to think it will be stolen. if a person buys the newest $2,000
    gaming rig, they don''t want to think that a maintenance worker will walk in and
    lift it. Understanding this allows you to advertise to people with bigger pockets
    that are willing to spend a lot of money. The ironic part is that such an investment
    is usually not that very high. The cameras may cost somewhere around $50 to $100
    a piece. The computer that controls the artificial intelligence May wind up being
    a $10,000 investment. However, if you live in a 50-apartment complex and you use
    a $1000 security fee, you''re looking at $5,000 a month. In a year, because you
    probably made a $30,000 investment for security, you''re making nearly $60,000
    a year. It''s a relatively low investment that benefits you significantly and
    justifies a higher price.


    | ![image](Images/chapter_title_corner_decoration_left.png) ||  || ![image](Images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](Images/chapter_title_above.png)


    # Better Pricing with AI


    ![image](Images/chapter_title_below.png)


    You also have the added benefit of better pricing with artificial intelligence.
    Not only that, but it''s better pricing with buying and selling. This is because
    artificial intelligence can be used in the same way with slight differences.


    When buying a new house, you tend to pay attention to quite a few details. These
    details come in the form of a mental checklist of items you prefer over items
    you detest. Therefore, if you are the type of buyer that looks for homes that
    are run down but only have cosmetic issues, you might detest a listing that says
    water needs to be installed. In some cities, real estate is often required to
    have water pipes leading to city water. This is forced on the residents of the
    city and usually cost about $20,000 to $40,000. this is a cost you basically must
    absorb up front until you can sell the house, which is sometimes not ideal. So,
    while you may look for houses that are in a worse for wear shape, that does not
    necessarily mean that you want a gut the house apart.


    On the other hand, artificial intelligence can help when it comes to selling.
    You look for the same things about buying a house that you do selling a house.
    You look for the quality of the school. You look for crime statistics. You look
    for the average revenue. You look for the actual cost of the materials. These
    are all standard things that you look for whenever you are trying to buy a house
    or sell a house. In terms of buying a house, you want to look for these things
    because it means that house is likely to be worth more. Therefore, if you can
    get a house for a good price in a good neighborhood with low crime, you can turn
    it over for a lot of money. Likewise, when you go to sell a house these are the
    things that you advertise.


    Now, you may be new to the real estate industry and you may be looking at artificial
    intelligence to make more money. If this is true, you''re likely wondering why
    I say you look for these things when you''re selling. When you fix up a house,
    it takes time for that house to be fixed. Usually, if you''re going to find a
    house that''s about a $90,000 buy in a neighborhood of houses where the average
    house is over $200,000, you''re going to spend a lot of time there. Within a single
    year, you can see a high-quality school become a medium-quality school. You can
    also see crime statistics go up if a new law is passed or if a certain commercial
    market came into place. Likewise, those in the neighborhood might have moved out
    of the neighborhood. Therefore, it makes sense to do a repeat of the research
    you did before to get an actual estimated value of the house that you are trying
    to sell.


    Since the variables are the same but the outcome is a different intention, artificial
    intelligence can be made to handle part of it. Artificial intelligence can be
    made to judge a house''s value based on the factors you investigate. If you are
    buying a house, you can have the output tell you whether the house is worth buying.
    If you are selling a house, you can have the output tell you whether the price
    you want to sell it for is reasonable. Since artificial intelligence is programming,
    you don''t have to have two of the same process to get two different results.
    Instead, you can have the same process but, at the end or near the end of the
    code, you can set up the different cases for buying and selling. This is because
    programming is modular and components can be reused.


    | ![image](Images/chapter_title_corner_decoration_left.png) ||  || ![image](Images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](Images/chapter_title_above.png)


    # Embrace The AI


    ![image](Images/chapter_title_below.png)


    Artificial intelligence is not new but the way it''s being used is new. You might
    wonder whether it''s going to replace you as a real estate agent. You might even
    wonder about whether buying and selling houses will become artificial intelligence
    only. The truth of the matter is that you can''t escape it. Even if you don''t
    want to use artificial intelligence, your competitor real estate agents will.
    This means that, ultimately, all you can do is join the side that uses artificial
    intelligence.


    Artificial intelligence is not that scary. It''s simply a matter of yes or no.
    If a house is in an area with two schools, here''s how the artificial intelligence
    is going to look at it. It''s going to run a search algorithm that determines
    how many schools are within a certain mile radius. It''s going to ask what letter
    grade the school has been given by the state. If that letter grade is above a
    preset value, it then passes on a yes state to the next variable. While that neural
    node does that, another neural node is looking at another school and either sends
    a yes or no. What the neural node sends is usually a one for yes and a zero for
    no. If the next neural node in the chain after those two neural nodes is receiving
    a yes and a no, the ultimate result is a 0.5. If you combine that with however
    many schools are in the area, you might end up with a 0.3 or a 0.6 or even a 0.9.
    Ultimately, it looks through and just adds in the scores together to give you
    an average overall score. This overall score determines the quality of schools
    in that area.'
