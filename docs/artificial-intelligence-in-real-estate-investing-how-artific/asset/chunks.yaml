    \ | --- |\n\n![image](Images/chapter_title_above.png)\n\n# Keep Becomes Easier\n\
    \n![image](Images/chapter_title_below.png)\n\nThe Roombas of the World \n\nIt\
    \ doesn't happen very often but there are some rather nasty tenants out there.\
    \ There was a couple that rented an apartment once and by the time they left,\
    \ the entire apartment was covered in cockroaches. This was because they would\
