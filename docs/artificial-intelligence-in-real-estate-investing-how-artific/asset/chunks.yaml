    # Rex


    ![image](Images/chapter_title_below.png)


    Rex is an AI that primarily deals with self-assembly. REx is as close to General
    AI as we’ve reached so far. General AI is a form of AI that gets its name from
    the original computers in the past. In the beginning, computers were tasked at
    doing one thing and one thing only. Perhaps the best machine to represent this
    is the computer that broke Hitler’s Enigma, the machine responsible for encrypting
    messages. This machine couldn’t play video games, it couldn’t even do basic mathematics.
    It was a one-purpose machine, the rotate through letters faster than a human to
    decrypt messages.


    It took a couple of decades and smaller parts for humans to put tasks together.
    This is when the computers we often know as those big expensive ones that used
    to be used as businesses. You would make a program by punching holes into sheets
    of paper. Eventually, it was consolidated into using typewriters to translated
    natural language (like a for loop) into something the machine could understand.
    As more parts came out and better coding schemes were adopted, we started to see
    computers the size of today’s servers, then desktop computers, and, finally, laptops.
    Now that we’ve been doing this for ½ a decade, we have computers in our pockets
    that could trounce that first machine.


    AI has evolved in a very similar way. The first AI was built on Slope-Intercept
    Form and from there, people started creating scenarios with yes and no themes.
    They eventually found that if you combine two of them, they could handle different
    scenarios. This would be like going from the single-purpose computer to the combined
    task computer. This has evolved to break down language to give us voice typing,
    AI in video games, and all the things we know as AI.


    However, just because a computer can do multiple things, that does not mean that
    it can think on its own. There’s a ton of information I am glossing over when
    I say this, but everything you do on the computer has been pre-programmed before
    User Input. We use clever tricks to make a person think the computer is doing
    more than one thing at once. Just as in AI, we had a single neural node so too
    in computers did everything run a single core. Additionally, with a neural network,
    we created multi-core systems that truly do more than one thing at once. However,
    the OS is still, primarily, a single-core process. It cannot think on its own,
    it has to be pre-programmed.


    General AI, like REx, is capable of defining its’ own process and thinks on its
    own. Yes, REx is the first General AI. Not because it can make choices for itself
    (like many famous AI robots) but because it can do so without human input.


    REX, the real estate company, on the other hand, is very similar to companies
    we’ve talked about before. I could explain what they do, but I’d be mostly repeating
    myself. However, they do do something different than the others. Specifically,
    when they match sellers and buyers, they do so by matching them on other websites.
    Therefore, if a seller is on Zillow and a buyer is on Facebook, the machine learning
    algorithm will connect the two together. This opens up online selling to include
    all of the popular online real estate websites rather than confining sellers and
    buyers to one. In addition to this, the REX agents are salaried stuff, which generally
    means much better customer service.


