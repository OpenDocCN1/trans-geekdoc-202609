- raw: "| ![image](Images/chapter_title_corner_decoration_left.png) ||  || ![image](Images/chapter_title_corner_decoration_right.png)\
    \ |\n\n| --- | --- | --- |\n\n![image](Images/chapter_title_above.png)\n\n# Rex\n\
    \n![image](Images/chapter_title_below.png)\n\nRex is an AI that primarily deals\
    \ with self-assembly. REx is as close to General AI as we’ve reached so far. General\
    \ AI is a form of AI that gets its name from the original computers in the past.\
    \ In the beginning, computers were tasked at doing one thing and one thing only.\
    \ Perhaps the best machine to represent this is the computer that broke Hitler’s\
    \ Enigma, the machine responsible for encrypting messages. This machine couldn’t\
    \ play video games, it couldn’t even do basic mathematics. It was a one-purpose\
    \ machine, the rotate through letters faster than a human to decrypt messages.\n\
    \nIt took a couple of decades and smaller parts for humans to put tasks together.\
    \ This is when the computers we often know as those big expensive ones that used\
    \ to be used as businesses. You would make a program by punching holes into sheets\
    \ of paper. Eventually, it was consolidated into using typewriters to translated\
    \ natural language (like a for loop) into something the machine could understand.\
    \ As more parts came out and better coding schemes were adopted, we started to\
    \ see computers the size of today’s servers, then desktop computers, and, finally,\
    \ laptops. Now that we’ve been doing this for ½ a decade, we have computers in\
    \ our pockets that could trounce that first machine.\n\nAI has evolved in a very\
    \ similar way. The first AI was built on Slope-Intercept Form and from there,\
    \ people started creating scenarios with yes and no themes. They eventually found\
    \ that if you combine two of them, they could handle different scenarios. This\
    \ would be like going from the single-purpose computer to the combined task computer.\
    \ This has evolved to break down language to give us voice typing, AI in video\
    \ games, and all the things we know as AI.\n\nHowever, just because a computer\
    \ can do multiple things, that does not mean that it can think on its own. There’s\
    \ a ton of information I am glossing over when I say this, but everything you\
    \ do on the computer has been pre-programmed before User Input. We use clever\
    \ tricks to make a person think the computer is doing more than one thing at once.\
    \ Just as in AI, we had a single neural node so too in computers did everything\
    \ run a single core. Additionally, with a neural network, we created multi-core\
    \ systems that truly do more than one thing at once. However, the OS is still,\
    \ primarily, a single-core process. It cannot think on its own, it has to be pre-programmed.\n\
    \nGeneral AI, like REx, is capable of defining its’ own process and thinks on\
    \ its own. Yes, REx is the first General AI. Not because it can make choices for\
    \ itself (like many famous AI robots) but because it can do so without human input.\n\
    \nREX, the real estate company, on the other hand, is very similar to companies\
    \ we’ve talked about before. I could explain what they do, but I’d be mostly repeating\
    \ myself. However, they do do something different than the others. Specifically,\
    \ when they match sellers and buyers, they do so by matching them on other websites.\
    \ Therefore, if a seller is on Zillow and a buyer is on Facebook, the machine\
    \ learning algorithm will connect the two together. This opens up online selling\
    \ to include all of the popular online real estate websites rather than confining\
    \ sellers and buyers to one. In addition to this, the REX agents are salaried\
    \ stuff, which generally means much better customer service.\n\n| ![image](Images/chapter_title_corner_decoration_left.png)\
    \ ||  || ![image](Images/chapter_title_corner_decoration_right.png) |\n\n| ---\
    \ | --- | --- |\n\n![image](Images/chapter_title_above.png)\n\n# How Real Estate\
    \ Owners can Use AI\n\n![image](Images/chapter_title_below.png)\n\n| ![image](Images/chapter_title_corner_decoration_left.png)\
    \ ||  || ![image](Images/chapter_title_corner_decoration_right.png) |\n\n| ---\
    \ | --- | --- |\n\n![image](Images/chapter_title_above.png)\n\n# An Entry Barrier\n\
    \n![image](Images/chapter_title_below.png)\n\nRemove High Debtors\n\nDebt can\
    \ be calculated by a few different things. It can be a past history of debt, a\
    \ current timeline of net revenue, or it can be future debt like a student loan.\
    \ We all know it is important to know about debt so as to prevent ourselves from\
    \ getting into bad contracts.\n\nThe problem is that people generally don't like\
    \ giving out this information. They want to keep tricking people into contracts\
    \ as it is financially beneficial for them. People like this have common elements\
    \ to them though, such as having multiple credit cards and subpar credit history.\n\
    \nArtificial intelligence can look at a credit report for you and simply spit\
    \ out a score for the person. Therefore, if the person has a lot of accounts open\
    \ but all of them are empty, they probably deserve a good score. However, if they\
    \ are empty and there's a bankruptcy on the credit report, then they probably\
    \ deserve a low score. Looking through and understanding a credit report beyond\
    \ the score can be done by a human. However, artificial intelligence can do it\
    \ faster and this is important. It's important because you will likely have far\
    \ more than just one person's credit report to decipher.\n\nThis really depends\
    \ on how invested you are in credit reports and background checks. Some people\
    \ like to look at a credit history with a glance and some people really dive in.\
    \ Artificial intelligence would be able to save time for the people who really\
    \ like to dive in.\n\nRemove Risky Behavior \n\nNow, it's very easy to remove\
    \ people based on their smoking habits, their choices of cars, and similar decisions\
    \ they make. In fact, it's kind of binary in that way.\n\nHowever, the real estate\
    \ industry could benefit from a tool companies use to hire people. Giving people\
    \ a personality test off of your own biases, you can assess whether a person is\
    \ going to be a risky investment according to your criteria.\n\nEveryone has their\
    \ own unique way of deciding their investments, but usually even if you're looking\
    \ at a company you look at the character. The character of a company will often\
    \ tell you the likelihood of success, especially in failures.\n\nReal estate agents\
    \ get a lot of sway about what they can do when it comes to judging who they want\
    \ to sell a house too. This benefits them when it comes to personality tests,\
    \ which can be taken online.\n\nA personality test not only judges the character\
    \ of a person but also tricks people. You see, companies know that people will\
    \ sometimes lie in order to get that job. Therefore, as a defensive mechanism,\
    \ companies use lures to bait people into choosing what they want them to choose.\
    \ For instance, if you have an employee that secretly takes brakes to smoke, what\
    \ would you do? In this situation, a company will give you about five different\
    \ ways you can answer. However, the important bit is that you pay attention to\
    \ the two answers that sound most like each other. One will sound like what the\
    \ applicant thinks the company wants to hear. The other will be what the company\
    \ wants the applicant to do.\n\nYou can have red herrings in a personality test\
    \ and they help determine whether that person is going to lie to you or not. Knowing\
    \ the percentage at which a person is likely to lie to you, you can then remove\
    \ that risky behavior from a contract.\n\nThis percentage is calculated by not\
    \ only using the ratio of lure answers to the correct answers to the wrong answers\
    \ but by other answers. There will be more than one person who takes this personality\
    \ test. Comparing the rate which lure answers are answered, you can determine\
    \ which candidates are more likely to lie to you. You want to remove the common\
    \ answers that act like lures because that means the applicant doesn't see it\
    \ as the “obvious” answer most of the time. Instead, you want to pay attention\
    \ to the ones who mostly answer using lures because those are the ones not being\
    \ truly honest."
