    # AI Replaces Repetitive Tasks


    ![image](Images/chapter_title_below.png)


    Artificial intelligence can be used for several things, but it''s primarily used
    for repetitive tasks. Things like filing documents, doing taxes, finding homes,
    researching neighborhoods, and all of this can be done by artificial intelligence.
    When you save time on things that don''t make money, it makes you eligible to
    use that time on things that do make money. 


    However, that isn''t all that artificial intelligence can do. With artificial
    intelligence, you can have a customer support channel that you might have not
    had beforehand. This customer support channel would help save you time by answering
    customer questions.'
