    \ counties, and even streets.\n\nIt's important to understand the level of crime\
    \ that happens in a place because a tenant will actually value their safety over\
    \ the value of their purchase. You might have a tenant that doesn't care about\
    \ a high crime area if it's only theft and they tend to not have anything they\
    \ think is worth stealing.\n\nHowever, someone like a software developer with\
    \ a higher-paying position than an individual that lives a minimalist life, they\
    \ are likely to have a lot of money they want to spend. This means that they will\
    \ often have items in their household that they don't want to be stolen. In addition\
    \ to this, you might have a family who generally wants to make sure that their\
    \ house is not going to be broken into. This is not only for the safety of their\
    \ items but also for the safety of their family.\n\nQuality of Schools \n\nWith\
    \ families, a new item is added on to the list because families tend to look at\
    \ just one more criteria. Families are concerned about the quality of the schools\
    \ in the area.\n\nEven though most public schools are considered governmental\
    \ facilities, they are not operated like a government. The school in a high-class\
    \ environment will often benefit from higher taxes in the surrounding area. This\
    \ is because most schools are dependent on the taxes collected in that area by\
    \ law.\n\nThis creates a rich vs poor school and family. Families who have a slightly\
    \ higher amount of pay want the best for their children. Therefore, what tends\
    \ to happen is people with higher pay go towards higher schools and rich schools\
    \ remain rich schools. Vice versa for poor schools.\n\nMedian Income of Surrounding\
    \ Residents \n\nThis is actually a secondary cause for something else that many\
    \ advanced tenants will look for. The average cost of the house will often be\
    \ determined by the average median income of people in the neighborhood. This\
    \ is important because knowing that average, one can guess at the likelihood of\
    \ crime and quality of the school.\n\nIf a neighborhood has a high median income,\
    \ that means that they're less likely to steal or break into the other houses.\
    \ Since school quality is often determined by how much taxpayer money is available,\
    \ the median income of neighborhoods often determines this. This means if you\
    \ really want to be looking for houses you need to start looking at medium incomes\
    \ of areas. This becomes similar to an algebraic problem where if you have any\
    \ two of the variables, such as median income and crime statistics, you can figure\
    \ out the third.\n\nMaterial Cost of the House \n\nThe last item on the list that\
