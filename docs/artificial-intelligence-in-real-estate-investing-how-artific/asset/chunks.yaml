    ![image](Images/chapter_title_below.png)


    One concern with the inception of Artificial Intelligence is that we will replace
    all real estate agents and contractors with robots. While this is very unlikely
    to happen in the future, there will definitely be a change in the role that real
    estate agents play in the process; and those who fail to adapt to new processes
    might be rendered irrelevant. We investigate this issue more in this chapter;
    looking into the role AI will play in the process, and also check out a few exciting
    new companies in the space.


    | ![image](Images/chapter_title_corner_decoration_left.png) ||  || ![image](Images/chapter_title_corner_decoration_right.png)
    |


    | --- | --- | --- |


    ![image](Images/chapter_title_above.png)


    # Real Estate Agents Will Never Fully Go Away


    ![image](Images/chapter_title_below.png)


    ## People Always Get People


    When people talk about artificial intelligence taking over a specific position,
    they tend to forget that people like talking to people. The average real estate
    agent''s job may change, but there''s always going to be a need for people.


    The best example of this is actually McDonald''s. McDonald''s has quite a few
    locations where you can use a screen to order the food yourself. Yet, even though
    this option is available, they''re usually quite a few people at the cashier counter
    to take people''s orders. This is because people like communicating with people.


    The internet itself is a recognition of this because it''s one giant machine used
    for communication. Literally, the internet is nothing but a communication tool.
    It''s just that through communication, we can order items internationally, we
    can talk to people in different languages in other parts of the world, and we
    can collaborate on projects better.


    ## Machines Cannot Understand Context


    Real estate agents will always be needed because sometimes a computer doesn''t
    understand the full situation. As I mentioned before, an artificial intelligence
    that is capable of understanding context will replace every single person''s job.
    We simply don''t have that, we have a clever mix of mathematics with people who
    translate context into numerical values.


    This means that if a person recently came into some money, but they were previously
    poor, it would skew the data. You could have a rich millionaire that was poor
    for 20 years of their life that wants to buy a house from you. If you solely relied
    on machine learning, this would be an opportunity that you have missed.


    The example of what can go wrong might be to the extreme, but there are many situations
    like this where human eyes are needed. Machine learning doesn''t replace work,
    it minimizes work. It gets rid of the manual labor that most of us experience.
    Therefore, while you don''t necessarily want to fully rely on machine learning,
    machine learning is still very beneficial.


    ## People Play People Better


    In addition, people upsell to other people more efficiently than machines. Machines
    have gotten incredibly good at selling certain items to people, like loot boxes.
    However, a salesman will always be able to outsell a machine because the salesman
    gets the context. There are certain situations where machines can do better, but
    overall, people can''t read other people.


    Let''s say that you have a young person escorting their disabled grandparent to
    buy a house. The machine learning algorithm would try to sell the house to them
    based off of both of their wages, but a human might try to sell a house based
    off of the young person''s worth. You might be thinking, why not go after the
    older person? The older person is likely to have more money, why not go after
    them?


    A real estate agent will look at the finances of both of them and come to a conclusion.
    The healthy young person is more equipped at continuing the sale past death. Instead
    of trying to sell the house to the grandparents, a real estate agent might suggest
    putting the house underneath the younger person''s name to ensure that the house
    isn''t put on the market should something horrible happen.


    This would be a situation where the younger person makes more than the older person
    but has less financial responsibility. Therefore, the real estate agent might
    want to try to lease to the younger person in a situation like a rent-to-own.
    Instead of selling the house, the context of the situation calls for a much longer-term
    relationship to ensure that the real estate agent gets the most money out of the
    deal.


    If the younger person fails to pay rent, they don''t have to claim bankruptcy.
    If the younger person owns the house, to get rid of the house they have to claim
    bankruptcy. In this situation, it is more ideal for the younger person to go with
    a renter situation. For the real estate agent, if the younger person takes the
    deal, then not only do they still get money towards what they would have made
    of the house, but they get something more, potentially. If a person fails to pay
    rent, the real estate agent made tons of money while they were renting and now
    they can resell the house. So, given the contextual situation, the real estate
    agent has an opportunity to make more money in the long term.


    | ![image](Images/chapter_title_corner_decoration_left.png) ||  || ![image](Images/chapter_title_corner_decoration_right.png)
    |


