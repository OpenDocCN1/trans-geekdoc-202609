    # An Entry Barrier


    ![image](Images/chapter_title_below.png)


    ## Remove High Debtors


    Debt can be calculated by a few different things. It can be a past history of
    debt, a current timeline of net revenue, or it can be future debt like a student
    loan. We all know it is important to know about debt so as to prevent ourselves
    from getting into bad contracts.


    The problem is that people generally don''t like giving out this information.
    They want to keep tricking people into contracts as it is financially beneficial
    for them. People like this have common elements to them though, such as having
    multiple credit cards and subpar credit history.


    Artificial intelligence can look at a credit report for you and simply spit out
    a score for the person. Therefore, if the person has a lot of accounts open but
    all of them are empty, they probably deserve a good score. However, if they are
    empty and there''s a bankruptcy on the credit report, then they probably deserve
    a low score. Looking through and understanding a credit report beyond the score
    can be done by a human. However, artificial intelligence can do it faster and
    this is important. It''s important because you will likely have far more than
    just one person''s credit report to decipher.


    This really depends on how invested you are in credit reports and background checks.
    Some people like to look at a credit history with a glance and some people really
    dive in. Artificial intelligence would be able to save time for the people who
    really like to dive in.


    ## Remove Risky Behavior


    Now, it''s very easy to remove people based on their smoking habits, their choices
    of cars, and similar decisions they make. In fact, it''s kind of binary in that
    way.


    However, the real estate industry could benefit from a tool companies use to hire
    people. Giving people a personality test off of your own biases, you can assess
    whether a person is going to be a risky investment according to your criteria.


    Everyone has their own unique way of deciding their investments, but usually even
    if you''re looking at a company you look at the character. The character of a
    company will often tell you the likelihood of success, especially in failures.


    Real estate agents get a lot of sway about what they can do when it comes to judging
    who they want to sell a house too. This benefits them when it comes to personality
    tests, which can be taken online.


    A personality test not only judges the character of a person but also tricks people.
    You see, companies know that people will sometimes lie in order to get that job.
    Therefore, as a defensive mechanism, companies use lures to bait people into choosing
    what they want them to choose. For instance, if you have an employee that secretly
    takes brakes to smoke, what would you do? In this situation, a company will give
    you about five different ways you can answer. However, the important bit is that
    you pay attention to the two answers that sound most like each other. One will
    sound like what the applicant thinks the company wants to hear. The other will
    be what the company wants the applicant to do.


    You can have red herrings in a personality test and they help determine whether
    that person is going to lie to you or not. Knowing the percentage at which a person
    is likely to lie to you, you can then remove that risky behavior from a contract.


    This percentage is calculated by not only using the ratio of lure answers to the
    correct answers to the wrong answers but by other answers. There will be more
    than one person who takes this personality test. Comparing the rate which lure
    answers are answered, you can determine which candidates are more likely to lie
    to you. You want to remove the common answers that act like lures because that
    means the applicant doesn''t see it as the “obvious” answer most of the time.
    Instead, you want to pay attention to the ones who mostly answer using lures because
    those are the ones not being truly honest.

