    # The History of Real Estate Investing Technology


    # Early History of US Real Estate


    ## Real Estate Evolved Differently Depending on Region


    Real estate in the United States was very different during the founding days of
    the nation. In fact, most of the land that was sold was sold in huge quantities.
    Most people were farming back then as that was the only way to truly live.


    Essentially, settlers would first come to the land and just build a house there.
    Over time, more and more of the land was owned by settlers. The safer regions
    were owned by someone else a good portion of the time.


    The solution was to sell part of the land to the newcomers or to allow children
    to inherit parts of the land. For a very long time, new houses were not often
    built because the local lifespan of the individual meant that the child would
    often inherit the house.


    However, this presented a unique situation where real estate laws evolved based
    on areas that were settled first. Laws around selling homes in Pennsylvania were
    different than laws about selling homes in Missouri because they were settled
    at different times.


    ## Rapid Evolution Brings Historical Difficulty


    This uniqueness is intriguing which means that pretty much anything was possible.
    It is very difficult to historically define the early beginnings of real estate
    beyond the general sense. The laws of the past have been changed and edited for
    the future with little to no record keeping.


    However, it does present a unique case. Real estate evolved as more people entered
    an area. This is true even to this day. Real estate evolves every time that the
    previous rules can no longer adequately serve the new area''s population. Just
    as we originally started out by just setting up houses wherever we stopped, we
    also started selling the chunks of our land to whoever might happen to be interested.

