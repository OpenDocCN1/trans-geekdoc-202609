    The best part is that such an investment is an investment that improves over time.
    Not only that, but you can place it as a security fee as part of the rent. Odds
    are, such as facial recognition technology is going to have a monthly cost. You
    can pass that cost off onto the tenants as either a separate charge or keep it
    as part of the rent and just say that security is part of the rent. This allows
    you to make the investment, save money on the investment, and improve the security
    of your complex while creating an advertisement point.


    This isn''t only technology for apartment complexes but also for houses. Having
    facial recognition for a house means that a little kid won''t get locked out of
    their house and they don''t have to worry about losing a key. Having a camera
    that works as a key and as a security camera has many benefits in many applications
    for real estate.


    ## Tenants Enticed by Live-in Tech


    If you say that you have an Internet of things residence, it is a natural enticement.


    People love things that make their lives easier but cannot often afford them.
    If you combine the current prices as of writing this book of Alexa, Nest, internet
    cameras, smart plugs, smart lights, and smart appliances you''re likely looking
    at an investment of around $10,000. However, if you''re selling a house this can
    be a bonus edition for $30,000. However, the true incentive comes with renting
    real estate.


    With renting a real estate, these investments justify normally unreasonable rent.
    Allowing a consumer to set up with these Internet of Things appliances will save
    them money. You can then take that money as additional rent. So, smart lights,
    smart plugs, Nest, and smart appliances save on electricity. They save a lot on
    electricity, which means the money from that electricity can go towards additional
    rent. If renting an apartment in your place cost $800 a month plus utilities,
    you can then justify $1,000 a month plus utilities. Essentially, so long as you
    tack on between $300 to $500 to the current rent, you will have paid off this
    investment in 3 years and have it permanently with improvements.


    As mentioned previously, if you have a smart security system you can now charge
    for that as well. Additionally, a smart security system will always receive improvements
    to be better at security.


    ## AI Keeps Track of Keys


    If you don''t want to go the route of using facial recognition as a key, you can
    have smart keys. Instead of having a key on a ring, this key can be easily replaceable
    and be even more secure. RFID chips have improved over the years and smart keys
    can now allow people to access more than one room.


    Therefore, if you really want to get some money out of your real estate, you can
    begin monetizing your real estate amenities. If your real estate features a gym,
    the smart key will allow them access for a fee. If there''s a pool, there''s a
    fee. You can even get wild with it by setting up subscriptions so that people
    don''t pay individual fees and have a certain amount of times they can do things.


    This can be used to create incentives from the maintenance people working on your
    place. If you have a pool or a game room, you can say that the person who cleans
    the most amount of rooms will get one free token to enter. This creates a reward
    system where your maintenance people work as hard as possible to get the reward.
    This also allows you to filter out maintenance people who want to do the bare
    minimum.


    There''s a lot of stuff that you can do with a smart house and an Internet of
    Things ecosystem. People are enticed by these systems because these are items
    that normal people don''t buy every day. It also entices them to stay longer because
    maybe you don''t have the cheapest rent in town, but you do save them on electricity
    because of these appliances. So, you may charge $200 more than the average rent
    but your tenant pays $60 in electricity versus the previous $150. It creates a
    system where leaving is tough to financially justify.


