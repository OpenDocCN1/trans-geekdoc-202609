- raw: "As you can see, this allows you to automatically sort through the applicants\
    \ you would have naturally rejected. Therefore, you likely saw 100 emails a day\
    \ that got shortened down into maybe 20. This saves a significant amount of time\
    \ especially since it's automatically sorted for you for the best candidates.\n\
    \nAI Filters Agents \n\nKnowing that you're getting the best candidates for your\
    \ houses doesn't mean you're going to get the best sales. After all, artificial\
    \ intelligence hasn't quite made it to a level where it can sell the house. Sure,\
    \ you can definitely sell the house with artificial intelligence, but you won't\
    \ get the most money out of it. The reason behind this is because artificial intelligence\
    \ chooses the optimal value for the house. Real estate agents go for the highest\
    \ number. That means that while the house is based in some reality, the price\
    \ doesn't necessarily match it.\n\nHowever, if your artificial intelligence creates\
    \ a personality report of your consumer, you can have the most optimal real estate\
    \ agent. When you have an artificial intelligence like a chatbot converse with\
    \ a customer, they give away a little bit of their personality. Normally, when\
    \ you ask for life goals or the job that they do, they'll accompany it with descriptions.\
    \ Those descriptions can create assumptions about the type of character that person\
    \ is.\n\nThere are cases where you do have the ability to have them take a personality\
    \ test. However, that's a little bit more intrusive than some companies would\
    \ like. Therefore, if someone's life goal is to enjoy time with family and they\
    \ are particularly old, they are very likely going to pay attention to details.\
    \ If the person is wanting to move down there just for tourist-like reasons, they're\
    \ not likely going to pay attention to the key details. The key details are what\
    \ ultimately decide how high the price can go. Therefore, if an older person is\
    \ looking in the market, they are likely to have had several different houses\
    \ with benefits. If the person is a tourist that is looking for a permanent residence,\
    \ they're likely looking for the easiest and most outwardly beneficial place.\
    \ This means that the real estate agent can sell higher to the tourist.\n\nThere\
    \ are many situations where you would want to create personality profiles on the\
    \ fly, but you wouldn't have a lot of information. This is why chatbots are useful\
    \ because a chatbot is a lot less intrusive than a personality quiz. You can also\
    \ word the questions much like a real estate agent might ask a question, which\
    \ hides the true purpose of the chat box system. Using artificial intelligence,\
    \ none of your company's time is taken up by assessing the personality that this\
    \ person has.\n\nAI is Faster and Can Do More\n\nLastly, artificial intelligence\
    \ is extremely good at doing things really fast. It can look through hundreds\
