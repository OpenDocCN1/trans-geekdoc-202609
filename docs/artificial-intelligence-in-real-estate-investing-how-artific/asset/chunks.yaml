- raw: "Eventually, we began to face scrutiny by the government. The colonies, as\
    \ American cities and areas were first referred to, faced higher taxes on property\
    \ and items than the country of origin. This eventually, along with other factors,\
    \ led to the revolutionary war.\n\nThe Government Began a Mass Land Collection\
    \ \n\nWhat started to happen was the people in an area began to form their own\
    \ laws to keep them safe. These people would enact local governments that would\
    \ represent them. These local governments would then employ people to keep the\
    \ security of the land.\n\nLocal governments were very small in the beginning.\
    \ However, when the government begins enacting services, those services needed\
    \ payment. The services are provided by people who need to live, thus they need\
    \ a reason to do the job. The government didn't really have many options to bring\
    \ in money. Being able to collect land, on the other hand, provided them with\
    \ a way to collect money. In addition to this, sales tax and other taxes persisted\
    \ in the original 13 colonies. Sheriffs in outward communities were often paid\
    \ by bigger cities that sent them there.\n\n| ![image](Images/chapter_title_corner_decoration_left.png)\
    \ ||  || ![image](Images/chapter_title_corner_decoration_right.png) |\n\n| ---\
    \ | --- | --- |\n\n![image](Images/chapter_title_above.png)\n\n# Banks\n\n![image](Images/chapter_title_below.png)\n\
    \nBanks Acquired Quickly\n\nBanks were relatively localized and just as real estate\
    \ evolved with the area, so too did the practice of protecting money. People needed\
    \ protection from outlaws when it came to their money, which meant banks had an\
    \ opportunity. A bank back then only meant that your money was in a safe. This\
    \ is where the old cowboy trope of breaking into safes comes in.\n\nHowever, banks\
    \ had to make money somehow and they couldn't just take their customers money’\
    \ although some did and still do. The primary way that Banks made money in the\
    \ past was by the owning and selling of property. Essentially, some lone farmer\
    \ would fail to get a family. That farmer would die and the town would designate\
    \ the new residence to the bank.\n\nThe bank would then go through the process\
    \ of selling the house to those that needed it. After all, if some person dies\
    \ they can't sell you a house. Banks would often play finders keepers in such\
    \ a situation. This allowed Banks to grow in more populated cities and eventually\
    \ they were known for selling houses and holding money. Specifically, they held\
    \ deeds and money.\n\nDeeds Were A Thing\n\nIt is very rare for the average person\
    \ to see a real-life deed. There are a few spots of land in America that still\
    \ have their deeds held by private citizens. A deed represented that you fully\
    \ owned the land and that you didn't owe anybody anything. In fact, income tax\
    \ and things of this nature weren't around back then. This is because there was\
    \ no official government that needed funding except in the colonies. However,\
    \ those banks often held land they made money from.\n\nAs the government got bigger\
    \ and we progressed through the Civil War, the government started collecting the\
    \ deeds. Essentially, the government became a huge bank and started obtaining\
    \ land. They would get the deeds of people who died and then get the deeds of\
    \ people who were in financial trouble. Essentially, they started targeting the\
    \ lesser-known people before they went after the bigger people. Eventually, the\
    \ class of rich tended to cleanse itself, with the government obtaining huge amounts\
    \ of land during the Civil War. Civil War represented the national government\
    \ trying to get control of state governments.\n\nThose who participated and lost\
    \ or died on the wrong side in the Civil War often found themselves losing their\
    \ land. This would be referred to as the spoils of war. This allowed the government\
    \ to amass a huge amount of land very quickly by simply winning the war. There\
    \ are still some spots in America that have deeds attached to them but most of\
    \ the deeds that are in existence for America are held by the government. These\
    \ deeds represent claims that the government owns the land, which allows them\
    \ to operate on the land.\n\nA deed represented a document that said that you\
    \ were kind of your own nation. By having the government take the deeds of nearly\
    \ everyone, the government wrested control from the people. This allowed banks\
    \ to rent houses and land to people as a form of revenue rather than solely relying\
    \ on selling houses and growing interest on money.\n\nBanks Acted as a Local Real\
    \ Estate Agent\n\nHowever, that is a lot of property to manage and the Government\
    \ had a lot of trouble with communication and management. This was still during\
    \ an era where the phone and electronics were new. In fact, there weren't many\
    \ institutions dedicated to something like the news. Such news magazines were\
    \ only seen as viable items for the rich or the almost rich.\n\nThis meant that\
    \ the government had to find a way to sell land and houses so that it could begin\
    \ getting money. Therefore, Banks primarily became the representatives of the\
    \ government when it came to selling and maintaining the land. Banks had already\
    \ spread through most of the United States and represented areas of control. This\
    \ would allow the government to sell the land it needed and Banks could join in\
    \ on the money to be made. Therefore, the first local real estate agent could\
    \ really be considered to be the banks of America.\n\n| ![image](Images/chapter_title_corner_decoration_left.png)\
    \ ||  || ![image](Images/chapter_title_corner_decoration_right.png) |\n\n| ---\
    \ | --- | --- |\n\n![image](Images/chapter_title_above.png)\n\n# Bankruptcy, Crimes,\
    \ and Real Estate Companies\n\n![image](Images/chapter_title_below.png)\n\nBankruptcy\
    \ and Rundown Homes\n\nWhile it was possible to obtain run-down homes in the past\
    \ and obtain homes through bankruptcy, it wasn't prevalent. Once Banks started\
    \ acting as real estate agents and landlords for the government, it became prevalent.\
    \ The standard process was that if you couldn't pay land taxes, the land would\
    \ be taken away from you even if you could pay property taxes. Essentially, it\
    \ was a very easy way to justify taking land away from families who had been there\
    \ for generations.\n\nThese events made it possible for the selling of land to\
    \ become more commonplace. Run-down homes were usually left alone because it would\
    \ be miles before you saw anyone else. Therefore, it might be years before somebody\
    \ managed to find your house and it was almost always assumed that someone owns\
    \ the house. Therefore, if someone died in that house then no one really knew\
    \ about it for a long time.\n\nWhat would happen is if you missed a monthly payment\
    \ then the bank would investigate. This shortened the amount of time that property\
    \ would be found and sold. Either you were bankrupt or you were dead. In either\
    \ case, the bank could go about selling the property once more and generate even\
    \ more revenue.\n\nCrimes and Auctions\n\nHowever, this didn't really solve all\
    \ the problems because you still had criminals that took people's houses. If a\
    \ bank obtained a house that was previously owned by a criminal, they didn't want\
    \ to bother with any of the repairs. When we refer to a run-down home, we're talking\
    \ about places with missing roofs, windows, and other items. In modern day terms,\
    \ it would be a house that didn't have water or electrical wiring. It was a massive\
    \ pain to try to maintain these houses. To save on cost, they simply sold the\
    \ land for less hoping the owners would create a good house."
  fmt: '

    # 政府审查与革命战争


    最终，我们开始面临政府的审查。殖民地（美国城市和地区最初的称呼）面临的财产和物品税率高于母国。这最终与其他因素一起，导致了独立战争的爆发。


    # 政府开始大规模征收土地


    发生的情况是，某地区的人们开始制定自己的法律以保障安全。这些人会建立代表他们的地方政府。这些地方政府随后会雇佣人员来维护土地安全。


    地方政府最初规模很小。然而，当政府开始推行服务时，这些服务需要资金支持。服务由需要生存的人提供，因此他们需要工作的理由。政府并没有太多筹集资金的选项。相比之下，征收土地为他们提供了一种收取资金的方式。此外，销售税和其他税收在最初的
    13 个殖民地持续存在。外围社区的治安官通常由派遣他们的大城市支付薪酬。


    ---


    # 银行


    ## 银行迅速崛起


    银行在当时相对局限于本地，正如房地产随地区发展而演变，保护资金的做法也随之演变。人们需要保护资金免受歹徒侵害，这给了银行机会。那时的银行仅意味着你的钱存放在保险箱里。这也是老式牛仔片中闯入保险箱这一桥段的由来。


    然而，银行必须以某种方式盈利，不能直接拿走客户的钱——尽管有些银行那样做了，现在依然如此。过去银行盈利的主要方式是拥有和出售房产。本质上，某个孤独的农民无法组建家庭，农民去世后，城镇会将新住所指定给银行。


    银行随后会将房子出售给需要的人。毕竟，死人无法卖房给你。银行在这种情况中常扮演“拾得者所有者”的角色。这使得银行得以在人口更稠密的城市发展，并最终以卖房和存钱而闻名。具体来说，它们持有地契和资金。


    ## 地契的作用


    普通人在现实生活中见到真实地契的机会非常少。美国仍有少数土地的地契由私人公民持有。地契代表你完全拥有这块土地，不欠任何人任何东西。事实上，当时并没有所得税之类的东西。这是因为除了殖民地外，没有需要资金的官方政府。然而，那些银行往往持有它们从中获利的土地。


    随着政府壮大，我们经历了内战，政府开始征收地契。本质上，政府变成了一个巨大的银行，开始获取土地。他们会获得去世之人的地契，以及陷入财务困境之人的地契。本质上，他们先针对不为人知的小人物，然后才追究大人物。最终，富裕阶层倾向于自我净化，政府在内战期间获得了大量土地。内战代表了联邦政府试图控制州政府。


    那些在内战中参战失败或站错队死去的人，往往会失去土地。这被称为战利品。这使政府能够通过赢得战争迅速积累大量土地。美国仍有一些地点附带地契，但现存的大多数美国地契由政府持有。这些地契代表政府对土地的所有权主张，允许他们在土地上运作。


    地契代表一份文件，表明你某种程度上是自己的国家。通过接管几乎所有人的地契，政府从人民手中夺取了控制权。这使得银行能够通过出租房屋和土地来获得收入，而不再仅仅依赖卖房和资金利息增长。


    ## 银行充当地方房地产代理


    然而，这是大量的房产需要管理，政府在沟通和管理上遇到了很多麻烦。这仍处于电话和电子设备刚出现的时代。事实上，没有多少机构专门从事类似新闻的工作。这种新闻杂志只被视为富人或准富人的可行消费品。


    这意味着政府必须找到一种出售土地和房屋的方式以开始获取资金。因此，银行在出售和维护土地方面主要成为了政府的代表。银行已经遍布美国大部分地区，代表了控制区域。这将允许政府出售所需土地，银行也能分一杯羹。因此，美国第一位地方房地产代理实际上可以被认为是美国的银行。


    ---


    # 破产、犯罪与房地产公司


    ## 破产与破败房屋


    虽然过去有可能获得破败房屋并通过破产获得房屋，但并不普遍。一旦银行开始作为政府的房地产代理和房东，这种情况变得普遍起来。标准流程是：如果你无法支付土地税，土地就会被收走，即使你能支付房产税。本质上，这是一个非常容易找理由将世代居住的家庭赶走的方式。


    这些事件使得土地买卖变得更普遍。破败房屋通常被置之不理，因为你可能要走几英里才能见到别人。因此，可能要过几年才有人设法找到你的房子，而且几乎总是假设有人拥有这所房子。因此，如果有人死在屋里，很长一段时间没人知道。


    会发生的情况是：如果你错过月供，银行就会调查。这缩短了房产被发现和出售的时间。要么你破产了，要么你死了。无论哪种情况，银行都可以再次出售房产并产生更多收入。


    ## 犯罪与拍卖


    然而，这并没有真正解决所有问题，因为你仍然有犯罪分子抢占房屋。如果银行获得了一所之前由罪犯拥有的房子，他们不想费心进行任何维修。当我们提到破败房屋时，指的是缺屋顶、窗户和其他设施的地方。用现代术语来说，就是没有水电的房子。维护这些房子是巨大的麻烦。为了节省成本，他们只是低价出售土地，希望买家能建起好房子。

    '
