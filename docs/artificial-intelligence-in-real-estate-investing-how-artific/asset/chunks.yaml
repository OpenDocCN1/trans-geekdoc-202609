    ![image](Images/chapter_title_above.png)


    # Security Bonus with AI


    ![image](Images/chapter_title_below.png)


    Artificial intelligence is very good for handling multiple things at once. So
    long as you can define what is supposed to happen and what is supposed to not
    happen, you can generally secure a place very easily with artificial intelligence.


    The first element of security that you can ensure with artificial intelligence
    is property damage. Whether it''s caused by the tenant, an outside force, or a
    problem in the utilities, artificial intelligence can detect it. Not only can
    artificial intelligence detect an issue has occurred, but it can identify what''s
    occurring and let the owners know. Therefore, if a tenant has broken something
    then artificial intelligence can identify an oddity. If someone has broken into
    the house, both the tenant and the owner can be notified.


    This allows for the opportunity for the tenant to inform the owner not to call
    the cops. The tenant or the owner can call the cops if they need to. The alarm
    does not need to go off for the entire house while the cops are on their way.
    In fact, one could say that an alarm goes off in the bedroom because of something
    like Amazon Echo. Lastly, utilities inside of a house can have The Internet of
    Things sensors on them to prevent problems from cascading. You can detect abnormal
    moisture, increased or lowered pressure thresholds, and even the amount of times
    the house needs to be cleaned. This will prevent water damage and potential bug
    infested homes.


    The second element of security is holding people accountable for what has taken
    place. Maintenance workers are often accused of stealing out of people''s homes.
    However, it''s very hard to prove it unless the place they are living in has cameras.
    Even then, it doesn''t always provide one with the ability to determine who that
    maintenance worker is on the video footage. Artificial intelligence can associate
    the key of the maintenance worker, whether it be an RFID chip or facial recognition,
    with the video footage. This means that the incident can be recorded to match
    the time slot.


    The average method for determining whether a maintenance worker stole from a resident
    is tedious. First, the resident places a complaint and then potentially calls
    the cops. Then, the security team goes back through footage over the entire, potentially,
    week to find out if anyone entered that residency. This means that the resident
    must wait a ridiculous amount of time before they find the criminal. By then,
    the criminal would have likely sold whatever they stole. The only evidence to
    say they ever took anything would be video. With artificial intelligence, the
    time the maintenance worker entered and left could be recorded. Artificial intelligence
    would segregate video footage by room. Then security would look up the room it
    was stolen from and maybe review an hour and a half of footage. I say an hour
    and a half given 30 minutes for each cleaning session three times a week. By the
    time they were done, security would be catching the criminal an hour and a half
    after the resident found out that something was stolen. In that time frame, it
    would be very difficult for the criminal to sell the item.


    Another weird but very doable circumstance is to make sure people are doing their
    jobs. The most common way of a workplace keeping track of whether a person is
    doing their job or not is a checklist on a board. People fake this all the time,
    but artificial intelligence can do something more. You see, if a maintenance person
    uses their key then artificial intelligence can begin assessing that person''s
    job. The artificial intelligence has memorized the motions needed to do specific
    jobs like dusting or sweeping. This way, the artificial intelligence might checklist
    sweeping off from the kitchen camera. Furthermore, the kitchen may be attached
    to the dining room but the difference in flooring allows the artificial intelligence
    to segregate it into different rooms. This would be far more effective than a
    checklist. It would also make sure that the job is done right and footage is recorded.
    This could prove the maintenance worker wrong or catch when the artificial intelligence
    makes a mistake.'
  fmt: '

    人工智能的构建相对容易，因为人工智能本质简单。人工智能是二元选择的组合。换言之，若能将问题拆解为是或否的答案，便可应用人工智能。这意味着它能处理大量工作。


    然而，这不代表它能胜任所有工作。例如，撰写本书无法由人工智能完成。原因在于叙事。你可能听说过被作为文章重写工具出售的人工智能。具体而言，BuzzFeed 等公司生产人工智能撰写文章。更准确地说，它们利用人工智能寻找热门文章。


    若用人工智能与人类对话，它无法理解语境。叙事驱动故事，从 A 发展到 B，因此需要语境。人类的学习方式是先学习第一项，再以此为基础构建后续知识。神经网络的学习方式是通过组合决策模式进行优化。因此，人类与神经网络的学习方式截然不同。


    人类与神经网络存在某些相似性，因为扩展知识都需要做决策。实际上，组合决策模式正是人类实践所学的方式。规则预先定义，我们据此决策，他人再予以纠正。这与神经网络运作颇为相似，但人类拥有语言优势。


    语言优势使我们能瞬间将输入转化为语境，反之亦然。人工智能需要人类将语境转为输入、将输出转为语境。除非人工智能能自主转换语境并将输出转化为语境，否则无法胜任此类工作。我们的语言天然是叙事性、描述性的，而机器学习语言是数值性的。


    这是人类迅速进步的主因：我们天然能创建关联。机器必须被告知应建立何种关联。我们用数学指导机器如何建立关联。数学有时简单，有时达到量子物理层面。但在所有情况下，人类都必须将语境从语言视角转译为数值视角。


    这有利有弊。利在于：只要能将语境转为数值语言，机器学习便能代劳。弊在于：机器永远无法理解某些事物，故有些工作真正不可被人工智能取代。具体而言，需要发明创造的工作最不受人工智能威胁。


    早年曾认为：若能创造人工智能，它将自我进化，甚至创造新数学。问题在于数学几乎总源于好奇心。对光、引力、物理等的好奇源于非数值的语境事件。人工智能固能高度发达，却无法追求好奇心。我们尚未将好奇心定义为数值术语。一旦我们实现将好奇心转译为数值语言，通用人工智能（General
    AI）将诞生，届时所有工作皆可被取代。


