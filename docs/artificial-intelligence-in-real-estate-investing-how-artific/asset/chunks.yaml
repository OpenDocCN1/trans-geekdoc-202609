    # Keep Becomes Easier


    ![image](Images/chapter_title_below.png)


    ## The Roombas of the World


    It doesn''t happen very often but there are some rather nasty tenants out there.
    There was a couple that rented an apartment once and by the time they left, the
    entire apartment was covered in cockroaches. This was because they would never
    bother to sweep or vacuum the apartment. They had all the counters clean, all
    the furniture clean, the walls were fine, but they had no tools for cleaning the
    floor. They never bothered to get those tools either so when they left, it was
    a nasty surprise.


    Relying on tenants to keep the apartment clean is not a habit that some landlords
    like to keep. However, with the cost associated with hiring a cleaning team, many
    cannot afford to do it and have reasonable rents. However, artificial intelligence
    can step in once again with the fantastic Roombas. A Roomba is a robotic vacuum
    cleaner.


    A Roomba can vacuum on both carpet and tile flooring. It uses several different
    types of sensors to ensure that it doesn''t get stuck and that it vacuums everything.
    The investment is about $200 to $300. Compare this investment to the cockroach
    filled house and getting it back to living conditions was nearly $1,000. This
    very simple investment can save you tons of money with rentals and it can be an
    advertising feature.


    ## Trash Recognition


    Another feature that comes with the Roomba is the number of times it encounters
    some dirt. It keeps track of the number of times that it must clean up something,
    which means it is a measurable amount. This measurable amount can inform you as
    to whether you need to keep an eye on certain tenants within your real estate.


    Therefore, if someone is being dirty you''re likely to see dirt events in the
    hundreds on a weekly basis. This means that they are not cleaning up after themselves
    and they''re dropping a lot of crumbs onto the ground. In addition to this, it
    also records when it gets stuck on items. Therefore, if they tend to leave their
    clothing around or other items, it will get stuck and report that. These are all
    measurable items to help you monitor those that do not do a good job of staying
    clean. This is all to avoid your house becoming a bug-infested haven.


    ## Flexible Maintenance Monitoring


    Instead of hiring a cleaning team every day to keep basic maintenance, these devices
    allow you to allocate that time to maybe a weekend. Perhaps every Monday a cleaning
    team comes in to do a better job than the Roomba can. The most likely case is
    that you don''t even need to bother with a cleaning team but rather a single person
    going around. This person would be responsible for keeping maintenance on the
    Roombas and inspecting the homes or apartments.


    What this does is it allows you the never before obtained ability of monitoring
    maintenance flexibly. By knowing which houses are problem houses, you can begin
    the process of evicting those tenants that do not obtain better habits. In addition
    to this, problems with inside homes become prevalent a lot quicker. This is because
    you have someone going into homes whenever the Roombas have difficulty and it
    could be clothing or it could be a leak.


    ## Spotting Leaks Faster


    Besides bugs, the other biggest problem that happens in rentals is a leak. For
    instance, I remember a specific townhouse that had a water heater bust. The wall
    along the back side of the water heater had a hollow bottom. This meant that when
    the water heater busted, the water went from the water heater room to the bathroom
    on the other side and into the laundry room. In addition to this, the tiles in
    the living room area raised a good foot above the rest of the tiles.

    '
  trans: '


    最棒的是，这种投资是一项随时间推移而增值的投资。不仅如此，你还可以将其作为押金费用计入租金的一部分。很有可能，例如面部识别技术将会产生每月费用。你可以将这笔费用作为单独收费转嫁给租户，或者将其保留为租金的一部分，只需说明安保包含在租金内即可。这让你能够进行投资、节省投资成本、提升公寓楼的安全性，同时创造一个广告卖点。


    这不仅适用于公寓楼的技术，也适用于住宅。住宅安装面部识别意味着小孩不会被锁在门外，也不必担心丢钥匙。一个既能当钥匙又能当监控摄像头的摄像头，在房地产的许多应用场景中都有诸多益处。


    ## 租户因宅家科技而心动


    如果你说你拥有物联网住宅，这本身就是一种天然的吸引力。


    人们喜欢让生活更轻松的事物，但往往买不起。如果你按撰写本书时的价格，将 Alexa、Nest、网络摄像头、智能插座、智能灯泡和智能家电的费用加在一起，你可能面临约
    10,000 美元的投资。然而，如果你在卖房，这可以作为一个 30,000 美元的增值选项。不过，真正的激励在于出租房地产。


    在出租房地产时，这些投资能让原本不合理的租金变得合理。允许租户使用这些物联网家电能为他们省钱。你随后可以将这笔省下的钱作为额外租金收回。因此，智能灯泡、智能插座、Nest
    和智能家电能节省电费。它们能大幅节省电费，这意味着这笔省下的电费可以用于支付额外租金。如果在你这里租公寓每月 800 美元加水电费，你就可以合理地定为每月
    1,000 美元加水电费。本质上，只要你在现有租金基础上增加 300 到 500 美元，你将在 3 年内收回这笔投资，并永久拥有它（且功能会持续改进）。


    如前所述，如果你有智能安防系统，现在也可以为此收费。此外，智能安防系统将持续接收更新，变得更擅长安防。


    ## AI 管钥匙


    如果你不想走面部识别当钥匙这条路，可以使用智能钥匙。这种钥匙不挂在钥匙圈上，易于更换，且更安全。RFID 芯片多年来已大幅改进，智能钥匙现在允许人们进入不止一个房间。


    因此，如果你真的想从房地产中赚钱，可以开始将房地产配套设施货币化。如果你的房产设有健身房，智能钥匙可允许付费进入。如果有游泳池，也可收费。你甚至可以玩得更花哨，设置订阅制，让人们不支付单次费用，而是在一定次数内使用设施。


    这可用于为维护你房产的人员创造激励。如果你有游泳池或游戏室，可以规定打扫房间最多的人获得一张免费入场券。这创造了一个奖励机制，让你的维护人员为了奖励而尽可能努力工作。这也能让你筛选出只想做最低限度工作的维护人员。


    利用智能家居和物联网生态系统，你能做很多事。人们被这些系统吸引，是因为这些是普通人平时不常买的东西。这也诱使他们住得更久，因为也许你的租金不是镇上最便宜的，但你因这些家电帮他们省了电费。所以，你可能比平均租金贵
    200 美元，但你的租户电费只付 60 美元，而之前是 150 美元。这创造了一个体系，让搬离在经济上难以合理化。


