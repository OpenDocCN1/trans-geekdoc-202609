- raw: 'There is one strategy that I don''t talk about inside of the book however
    and that''s because this only applies to certain use cases. You see, you really
    want customer engagement in real estate with a single customer. This means that
    the user will come to your website or service to engage with you to buy a house.
    Once that process is done, you are not really interested in constantly engaging
    them. You want to entice them, and you want them to hear your deals so that they
    will buy them, but you don''t need to retain customers after you''ve already sold
    the house. This is where affiliate sourcing comes in.


    We often hear about affiliate links whenever we are dealing with YouTube videos
    or even standard blog websites. It''s another avenue to make money for these creators.
    What is rarely talked about is the real estate affiliate market because it''s
    rather small, but it does exist. If you are interested in selling run-down homes
    that you get off the auction, this could be an option for you. If you are looking
    for cheap contract labor that''s always moving, this may also be a market for
    you. It really depends on how you use it. Essentially, you would just offer to
    pay a percentage of the commission you get for selling a house. For each house
    sold, the YouTuber would get an amount of money to justify putting your affiliate
    link in their description. Since YouTubers are currently undervalued at this point
    and they reach millions of people, it''s cheaper to do this than to go to an actual
    advertising firm or even a Blog website.


    Getting in The Real Estate E-Circle


    The true goal here is to get into the Real Estate Circle in the online world.
    This is more of an abstract concept rather than an official thing. The Real Estate
    Circle refers to a gathering of people using the same tools to sell multiple houses
    at a time. It''s very similar to a company but you can utilize the same platform
    to sell houses. Instead of a company where everyone gets assigned houses or assigned
    specific tasks, the marketing and engagement is done by you with shared tools.
    This prevents other real estate agents from taking your clients, but it also allows
    you to share clients depending on what houses you''re selling.


    Let''s say that you''re having a hard time selling a house that''s worth $120,000.
    Of the customers you have been engaging, they are looking for houses within the
    ranges of $140,000 to $180,000. For weeks on end, you have not engaged a customer
    looking for that low of a price range. However, because you use a platform where
    you share tools with others and clients with others, one of the other real estate
    agents who might have found someone like that can share that client with you.
    This allows you to sell the house while still focusing on the proper range that
    you are in and not messing up that range from refocusing your efforts. This allows
    for better sales figures and faster sales figures.


