- raw: 'A person could very well who wants to buy a less expensive house, but you
    could convince them otherwise. You could tell them that the less expensive house
    has problems with it. You could also tell them that the less expensive house is
    not in a safe neighborhood if they have children. These are personality traits
    that can be manipulated to ensure a higher price tag comes with each transaction
    most of the time.


    Setting Up Meetings with Potentials


    So, you''ve selected your candidates, they''ve chosen the houses, and now it''s
    time to set up meetings. Well, artificial intelligence can handle this too. It
    used to be that if you had too many clients you would hire a secretary to handle
    meetings. Now, you can have artificial intelligence set up the meetings for you.


    You simply give the artificial intelligence the standard routine that you follow.
    You add any item that you need to do in addition to that meeting. Then the artificial
    intelligence takes all of the timetables and provides the client with available
    times to have the meeting. There’s no need to interact with the client and everything
    can be done with a chatbot.


    Not only that, but you can also have artificial intelligence reschedule meetings.
    If you have to insert something or another meeting took too long, it is a button
    press to reschedule. The chatbot contacts the client and renegotiates a new meeting
    time with them.


    Paperwork and Auto Filing


    Let''s say that you finally finish getting your customer to by the house, what
    about the paperwork? Well, artificial intelligence can help with this too. Most
    of the agreements that come with the real estate agencies are repetitive in practice.
    You have a party that is buying, a party that is selling, and a party acting as
    an intermediary. This means that you can turn artificial intelligence on to this.


    Otherwise known as smart contracts, not to be confused with contracts made with
    blockchain, these contracts are developed by artificial intelligence. Therefore,
    you simply enter the information of the client by simply clicking on their profile.
    You click on the seller of the house. You then auto-generate a contract based
    off of the house’s details. You, of course, review the contract to make sure that
    it is a contract that fits your needs.


    This is very important because contracts can either be cookie cutter formatted
    from lawyers or specially tailored. Needless to say, these contracts usually require
    the cost of a lawyer. Hiring a lawyer for every single contract that you need
    is not ideal. By having artificial intelligence auto-generate the contract, you
    save time and money. You can then just send the contract off to whoever needs
    to sign it. You can even do this from your phone in most cases.


    | ![image](Images/chapter_title_corner_decoration_left.png) ||  || ![image](Images/chapter_title_corner_decoration_right.png)
    |


