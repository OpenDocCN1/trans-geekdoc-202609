    # Security Bonus with AI


    ![image](Images/chapter_title_below.png)


    人工智能擅长并行处理多项任务。只需定义何为应发生、何为不应发生，便能轻松借助人工智能保障场所安全。


    人工智能可保障的首要安全要素是财产损失。无论由租户、外力还是公用设施故障引起，人工智能皆可检测。它不仅能发现问题发生，还能识别具体问题并通知业主。因此，若租户损坏物品，人工智能可识别异常；若有人闯入，租户与业主均会收到通知。


    这使租户有机会告知业主无需报警。视情况，租户或业主可自行报警。警报无需在警察赶到前全屋响起。事实上，可类比 `Amazon Echo` 仅在卧室触发警报。此外，屋内公用设施可装配
    `Internet of Things` 传感器，防止问题连锁升级。可检测异常湿度、压力阈值增减，甚至房屋清洁频次，从而预防水损和潜在虫害。


    第二要素是追究责任。维修工常被指控在住户家中盗窃，但除非住所装有摄像头，否则难以取证。即便有录像，也未必能辨认维修工身份。人工智能可将维修工钥匙（无论是 `RFID`
    芯片还是人脸识别）与视频录像关联，使事件记录与时段匹配。


    判断维修工是否盗窃的常规流程繁琐：住户投诉、报警，安保团队回溯长达一周的录像查找入室记录。住户需漫长等待才能锁定罪犯，届时赃物多已售出，仅余视频为证。引入人工智能后，维修工进出时间可被记录，录像按房间分类。安保仅需调取失窃房间的录像，约审查
    1.5 小时（按每周 3 次、每次 30 分钟清洁估算）。住户发现失窃后 1.5 小时内即可抓捕罪犯，此时赃物极难变卖。


    另一可行场景是监督履职。职场常用核对表督促工作，但造假屡见不鲜。人工智能可做得更多：维修人员使用钥匙时，人工智能即开始评估其工作。它已记住除尘、扫地等特定工作所需动作，可从厨房摄像头自动核对“扫地”任务。厨房虽连餐厅，但地面材质差异使人工智能能将其划分为不同房间。这比核对表有效得多，既能确保工作质量、留存录像，也能证伪维修工或发现人工智能误判。

    '
