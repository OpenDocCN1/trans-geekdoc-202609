    \ and get the results you want. However, the problem lies in the fact that it's\
    \ just that neighborhood.\n\nIf you're talking about data from a single neighborhood,\
    \ you, a human, could do the calculations faster than it would take to build a\
    \ neural network. Building a neural network for a small amount of data is pointless.\
    \ This is why products have been made because products allow access to more data.\n\
    \nIf you are a single real estate agent, you might sell a hundred homes in your\
    \ lifetime, maybe even a thousand. In the most optimal case, you're looking at\
    \ a thousand different neighborhoods over your lifetime. That means the data changes\
    \ over time, the data is old, and the data is still relatively small in the scope\
    \ of real estate marketing. By having a product, real estate agents could combine\
    \ this information to produce a machine learning algorithm that is much quicker."
