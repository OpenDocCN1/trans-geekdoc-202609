  df.dropna(inplace=True)\n```\n\n## 7. 数据的分组与聚合\n\n分组和聚合对于汇总数据至关重要。\n\n### 7.1 数据分组\n\
  \n你可以使用 `groupby()` 按一或多个列对数据分组：\n\n```python\n# 按 'City' 分组并计算平均 'Age'\ndf.groupby('City')['Age'].mean()\n\
  ```\n\n### 7.2 数据聚合\n\n你可以对分组后的数据执行多次聚合：\n\n```python\n# 按 'City' 分组并计算多个统计值（平均值、最小值、最大值）\n\
  df.groupby('City')['Age'].agg(['mean', 'min', 'max'])\n```\n\n## 8. 合并与连接\n\nPandas\
