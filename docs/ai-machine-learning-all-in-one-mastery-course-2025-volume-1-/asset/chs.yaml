  \n## 1. Matplotlib 简介\n\nMatplotlib 是 Python 中最常用的数据可视化库之一。它提供了从简单的折线图到复杂的热图的广泛绘制功能。Matplotlib\
  \ 中的主要对象是 `Figure`，它包含一个或多个 `Axes`（实际的图表）。Matplotlib 具有可定制，允许你精细调整图表的几乎每一个方面。\n\n\
  ### 1.1 安装 Matplotlib\n\n要开始使用 Matplotlib，首先需要安装它。你可以使用 Python 的包管理器 `pip` 来完成：\n\
  \n```bash\npip install matplotlib\n```\n\n安装完成后，你可以在代码中导入 `Matplotlib` 并开始使用它：\n\
  \n```python\nimport matplotlib.pyplot as plt\n```\n\n### 1.2 使用 Matplotlib 基础绘图\n\
  \nMatplotlib 允许你创建各种类型的图表。让我们从创建一个简单的折线图开始。\n\n```python\nimport matplotlib.pyplot\
  \ as plt\n\n# 数据\nx = [0, 1, 2, 3, 4, 5]\ny = [0, 1, 4, 9, 16, 25]\n\n# 创建折线图\n\
