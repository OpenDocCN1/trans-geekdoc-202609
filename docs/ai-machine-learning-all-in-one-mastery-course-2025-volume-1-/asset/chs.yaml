  \n```python\n# 过滤 Age 大于 25 且 City 为 'Miami' 的行\ndf[(df['Age'] > 25) & (df['City']\
  \ == 'Miami')]\n```\n\n## 6. 处理缺失数据\n\n数据数据是真实数据集中的常见问题。Pandas 提供了几种处理缺失数据的方法。\n\
  \n### 6.1 检查缺失数据\n\n你可以使用以下方法检查缺失数据：\n\n```python\n# 检查缺失值\ndf.isnull().sum()\n\
