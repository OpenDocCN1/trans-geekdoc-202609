  \n## AI 和机器学习的基础\n\n我们从深入探讨人工智能（AI）和机器学习（ML）的基础开始。AI 是一项广泛的研究领域，旨在创建能够执行通常需要人类智能才能完成机器，例如解决问题、决策制定和学习。机器学习是\
  \ AI 的子集，专门专注于允许计算机从数据中学习而无需显式编程的算法。理解这种区别至关重要，因为它帮助你理解 AI 如何利用 ML 根据学习到的数据做出决策。\n\
  \n我们讨论的关键点之一是 AI 的历史和演变。从 20 世纪 50 年代的概念起源到近期的突破，AI 经历了变革性的转变，机器学习和深度学习的重大里程碑推向了可能的边界。随着\
  \ AI 的不断演进，它正日益融入我们的日常生活，影响着各行业、医疗保健、交通甚至娱乐业。\n\n## 机器学习的类型和关键技术\n\n我们探索了机器学习的三种主要类型：\n\
  \n- **监督学习**：这种技术使用标记数据来训练模型，系统学习从输入到输出的映射。我们涵盖了基本算法，如 `linear regression`（线性回归）、`logistic\
  \ regression`（逻辑回归）和 `decision trees`（决策树），所有这些在根据历史数据预测结果方面起着关键作用。\n- **无监督学习**：与监督学习不同，无监督学习使用未标记数据来发现隐藏模式。如\
  \ `K-means clustering`（K 均聚类）、`hierarchical clustering`（层次聚类）、`PCA` 和用于可视化的 `t-SNE`\
  \ 让机器发现数据中的自然分组。这些技术对于客户细分、异常检测和数据压缩等任务非常有价值。\n- **强化学习**：虽然在本卷中没有深入涵盖，但我们提到了它在开发通过试错学习的智能系统中的重要性。这种学习对于机器人、游戏和自动驾驶车辆等应用至关重要。\n\
