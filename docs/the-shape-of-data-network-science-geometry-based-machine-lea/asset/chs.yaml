  \ Farrelly 社交网络数据子集中，它是日记条目提及最一致的预测因子。我们样本中的卡方检验值范围从 `p` < 0.01 到 `p` = 0.25。当我们检查与线性回归相关的图表时，可以看到大多数样本都很好地拟合了回归方程。图\
  \ 3-2 显示了列表 3-2 生成的两个图表（包括 `V3`、`V7` 和 `V13` 作为离群值）。\n\n样本量较小可能是样本间差异产生，但总的来说，我们有一个良好的预测模型。事实上，这反映了\
  \ Farrelly 自己的直觉：她网络中的桥梁往往协调记忆深刻的事件和活动，这些活动在该学期将她网络的各个部分聚集在一起。我们将在第 6 章和第 8 章中讨论带有离群值的小样本量下回归模型的不稳定性，并介绍你可以用于这些情况的更稳定的模型，以获得一致的模型结果。\n\
