  \ 233\n\n# 对《数据的形状》的赞誉\n\n“书名说明了一切。数据被复杂的关系所约束，这些关系在充满电子表格的二维世界中很难体现。《数据的形状》带你领略了更丰富的视角，并展示了如何付诸实践。”——Stephanie\
  \ Thompson，数据科学家、演讲师\n\n“《数据的形状》是几何学应用于机器学习的一项新颖视角和卓越成就。它的涵盖范围广泛，包含了大量的具体示例和编码技巧，还有极其清晰的文字来拆解这些概念。即使作为一名在行业多年的多年的资深数据科学家，读完这本书后，我对该领域有了更深层的联系和新的理解。”——Kurt\
  \ Schuefer，博士，麦当劳公司\n\n“《数据的形状》是数据科学中应用拓扑学和几何学的绝佳来源。拓扑学和几何推动了机器学习领域的发展，而《数据的形状》很好地向新读者介绍了这个主题。”——Uchenna\
  \ “Ike”，高级开发者\n\n\n\n\n\n**室内设计：** Octopod Studios\n**技术评审：** Franck Kalala Mutombo\n\
