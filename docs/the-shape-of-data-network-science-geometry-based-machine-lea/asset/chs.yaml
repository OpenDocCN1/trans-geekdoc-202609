  \n因变量与个人社交网络联系更紧密的较大网络（如政治观点强度、锻炼习惯等）在此类分析中往往效果更好。在生物网络中，中心性衡量标准可以用于预测疾病的严重程度、对临床试验药物反应的可能性，或在基于社交网络的行为健康干预六个月后的疾病风险。分析网络的几何结构通常为预测与顶点相关的某些属性产生实用的独立变量。\n\
  \n### 预测社交媒体中的链接\n\n网络中另一种重要的监督学习形式是`链接预测`（link prediction），即从网络结构或元数据中推断潜在的新边。预测链接的一种是利用网络的先验增长模式来预测哪些边最可能出现。这有许多现实应用，其中最著名的是社交媒体。每当\
  \ Facebook 或另一个平台向你推荐添加好友时，算法已在后台对其网络运行了链接预测，并为你与这位潜在朋友之间的缺失边赋予了高分。执行链接预测有许多复杂的方法，但一种通用的通用策略是将问题转换为传统的监督学习任务。让我们以\
  \ Farrelly 的社交网络为例，从概念上进行探索。\n\n想象这个网络随时间演变，并用二值指示器表示自上一个时期以来形成的边。如果我们能根据网络在过去时间段的几何形状来预测某段时间内的边形成，那不是很酷吗？或者如果我们可以使用顶点标签（如课程表或志愿者日）来预测下一个时期的边形成，那又会怎样？\n\
  \n对于独立变量，我们可以使用任何与两个顶点相关的特征集合。这些特征可以是基于网络的内部特征，也可以是外部特征（例如社交网络中的用户人口统计数据）。基于网络的预测器有两种类型。我们可以通过选择一个函数将每对中两个顶点的分聚合为单个数字来使用顶点指标（常用选择包括\
  \ `sum`、`max`、`mean` 和差值的绝对值）。例如，我们可以计算每对中两个顶点的 PageRank 分数，然后取这两个分数的平均值来分配给该顶点对。\n\
  \n另一类基于网络的特征使用两个顶点之间网络关系的度量；这里最自然的选择是两个顶点之间的网络距离，尽管你可以尝试其他选项，例如两个顶点之间的最短路径数量，或者随机游走从一个到另一个花费的平均时间。所有这些基于网络的预测器都应该针对当前版本的网络计算，而不是之前的快照，并且这些基于网络的预测器可以与任何非网络特征集合相结合。（在实践中，大多数非网络特征是附加到单个顶点而非对的，因此仍然必须聚合它们以获得每个顶点对的单个分数。）\n\
  \n\n\n\n一旦为感兴趣的时间段计算出独立预测变量，并且该时间段存在一个指示变量，就可以使用监督分类器来预测感兴趣时间段内的边形成。边形成的概率得分越高，这种关系在下一个时间段内存在的可能性就越大。在\
  \ Farrelly 的社交网络中，介数中心性可能是主要的基于网络的预测指标，社交活动数据或医学院第一学期的日记条目也可能可能是预测指标。在那个学期结束时，她原始社交网络中的每个人都与她相连（且大多数人彼此之间也相连）。\n\
  \n## 使用网络数据进行无监督学习\n\n正如我们可以使用第 2 章中的顶点指标作为监督学习任务的预测变变量一样，我们也可以将它们作为无监督学习任务中的特征。在聚类情况下，这会将顶点划分为网络中具有相似功能的顶点集合（枢纽、桥梁等）。在网络科学中，顶点聚类被称为`社区挖掘`（community\
  \ mining），因此，当使用顶点指标来实现此目的时，我们获得由它们在网络中所处的结构性角色定义的社区。\n\n### 将聚类应用于社交媒体数据集\n\n在列表\
  \ 3-3 中，我们将 k-means 聚类应用于 Farrelly 的社交网络数据集，该数据集是我们第 2 章中的主要运行示例。\n\n```python\n\
  #重新缩放顶点指标矩阵并应用 k=3 的 k-means\nclust<-kmeans(scale(vertdata),3)\n\n#用顶点颜色和标签表示聚类绘制网络\n\
  plot(g,vertex.size=6,vertex.color=clust$cluster,vertex.label=clust$cluster)\n```\n\
  \n列表 3-3：一个使用 k-means 对顶点指标将图 3-1 中网络中的顶点聚分为 `k` = 3 组的脚本。\n\n使用 `k` = 3 的 k-means，并将\
  \ PageRank、度、枢纽中心性、介数传递性作为我们的特征（我们首先对其进行了重新缩放），我们得到了表 3-1 所示的聚类均值和大小，这些值是从原始未预缩放值计算得出的。\n\
  \n表 3-1：对 Farrelly 社交网络的少量顶点指标运行 k-Means 聚类（`k` = 3）的聚类均值和大小\n\n| **聚类 (Cluster)**\
  \ | **PageRank** | **度 (Degree)** | **枢纽得分 (Hub score)** | **介数 (Betweenness)**\
  \ | **传递性 (Transitivity)** | **聚类大小 (Cluster size)** |\n| --- | --- | --- | ---\
  \ | --- | --- | --- |\n| 1 | 0.05 | 3.14 | 0.54 | 3.21 | 0.80 | 7 |\n| 2 | 0.11\
  \ | 8.00 | 1.00 | 100.50 | 0.25 | 1 |\n| 3 | 0.05 | 2.50 | 0.08 | 25.75 | 0.097\
  \ | 12 |\n\n由于 k-means 涉及初始化，你每次尝试时可能会得到不同的聚类结果。对于这种特定的聚类，我们看到一个顶点被分配了自己的单独聚类（Farrelly\
  \ 的顶点，`V7`）；该顶点除传递性以外的所有得分都异常高，因此它在许多指标上都是离群值。所有剩余顶点被分在另外两个聚类中，这两个聚类的主要区别在于，其中一个聚类具有较高的枢纽和传递性得分，而另一个聚类具有较高的介数。让我们按聚类标记顶点并绘制此网络（这样做是对列表\
  \ 3-3\n\n图 3-3：Farrelly 的社交网络，根据表 3-1 总结的 k-means 聚类进行着色和标记\n\n我们看到 Farrelly 确实是一个单独的聚类，而且非常显著，聚类\
  \ 1 几乎是剩下的医学院人员，而聚类 2 是退军人群体。有趣的是，有一个医学院的人被放在聚类 3 中，因为他们是孤立的（传递性分零），并且不是医学院人员主要枢纽的一部分。\n\
  \n### 网络中的社区挖掘\n\n到为止，我们利用网络几何结构来提取特征，然后在它们上运行了传统的欧几里得机器学习聚类算法。在网络中聚类顶点另一种方法（称为`社区挖掘`）是直接依赖网络的几何结构。我们将简要介绍实现此点的几种方法。\n\
  \n#### 使用随机游走探索网络\n\n`walktrap algorithm` 使用随机游走来探索网络并寻找随机游走被“困住”的社区。如果随机游走频繁留在某个顶点集合中，那么该集合就是聚类的良好候选。例如，在\
  \ Farrelly 的社交网络中，从医学院人员中开始的随机游走很有概率留在他们中很多步之后，因为唯一的出口是跨越 Farrelly 顶点的桥梁。事实上，要离开随机游走必须到达\
  \ Farrelly 的顶点，然后我们才会选择那座桥作为下一步（这在该顶点发生的概率只有八分之一）。同样，从退军人群体中开始的随机游走很有概率留在他们中。通过这种方式，walktrap\
  \ 算法擅长发现被桥梁隔开的社区。这种方法的缺点是这样探索大型网络计算量巨大。\n\n#### 评估聚类结果质量\n\n在传统的欧几里得聚类中，评估聚类结果质量的典型方法是比较每个聚类内部的距离与其他聚类之间的距离。这种想法有一个广泛使用的网络变体适用于顶点聚类：顶点聚类的`模块性`（modularity）是随机选择的连接到同一聚类中两个顶点的概率减去网络中的边随机分布时这种情况发生的概率。直观地说，这比较了社区内部边与社区间边的数量。它是是一种“提升”衡量标准，因为它比较了聚类（在边留在类内的意义上）比随机基准好出多少。在前一章介绍的\
  \ Watts–Strogatz 网络的重要小世界属性之一是，它们倾向于具有高模块性。\n\n模块性还允许你将顶点聚类视为一个优化问题：我们寻找模块性得分最高的聚类划分。尝试所有可能的聚类划分是不切行的，因此引入了各种算法来尝试寻找高模块性的聚类，但不保证能找到全局最优解。解决问题的两种流行方法是`贪心算法`（greedy\
  \ algorithms），贪心意味着在每一步中都向最增加模块性的方向移动，而不是在短期内采取次优步骤以在长期获得更大的值。\n\n\n\n\n`Louvain\
  \ clustering` 是这类贪心算法之一。它最初将每个顶点视为自己的一个簇，然后每当合并相邻簇能够增加模块度（modularity）时，就迭代地进行合并。一旦这个迭代局部优化过程终止，算法将通过合并所有分配到同一个簇的顶点创建一个新的、更小的网络。这产生了一个网络，其中每个顶点都是自己的一个簇，因此可以在这个较小的图上再次运行相同的迭代局部优化过程。该算法在实践中非常快，且通常表现良好，但在寻找大型网络中的较小社区时往往很吃力。通常常用一种更快的贪心算法，方便称为\
  \ `fast greedy clustering`，但它往往无法达到更高的模块度分数。\n\n### 理解自旋玻璃聚类（Spinglass Clustering）另一种聚类方法不涉及随机游走或局部优化。相反，它源于统计力学——物理学中研究粒子相互作用的分支。`Spinglass\
  \ algorithms` 基于粒子系统（正负荷）内部的磁耦合；它们试图优化电荷跨整个系统的对齐方式。这可以应用于顶点聚类，被称为 `spinglass clustering`。基本思想是定义一个与聚类相关的能量，然后尝试最小化这种能量。这种能量最小化过程通常通过\
  \ `simulated annealing`（模拟退火）完成，这是一种优化算法方法，其根源也同样统计力学。在模拟退火中，并不是总是朝着能量减少最多的方向移动（正如贪心算法所做的那样，后者有陷入局部最优的风险），而是有一个温度参数来决定向相反的“错误”方向移动的概率。随着算法的进行，温度会逐渐降低。这有助于算法在后期稳定下来并锁定特定解决方案之前，探索能量景观的大部分区域。它模拟了冶金术中金属净化的冷却过程。\n\
  \n### 在社交网络上运行聚类算法\n\n让我们尝试在 Farrelly 的社交网络上运行这四种顶点聚类算法。列出的 3-4 执行了这一操作，然后绘制了结果并计算了模块度分数（要运行此操作，请确保你已经像\
  \ 列表 2-4 所示加载了该网络数据）。\n\n```\n#run walktrap, louvain, fast greedy, and spinglass\
  \ clustering algorithms\ncw<-cluster_walktrap(g_social)\nmodularity(cw) #0.505\n\
  plot(cw,g_social,vertex.size=15,vertex.label.cex=0.6,main=\"Walktrap\")\n\nlo<-cluster_louvain(g_social)\n\
  modularity(lo) #0.476\nplot(lo,g_social,vertex.size=15,vertex.label.cex=0.6,main=\"\
  Louvain\")\n\nfg<-cluster_fast_greedy(g_social)\nmodularity(fg) #0.467\nplot(fg,g_social,vertex.size=15,vertex.label.cex=0.6,main=\"\
  Fast Greedy\")\n\nsg<-cluster_spinglass(g_social)\nmodularity(sg) #0.505\nplot(sg,g_social,vertex.size=15,vertex.label.cex=0.6,main=\"\
  Spinglass\")\n```\n\n列表 3-4：一个在 Farrelly 的社交网络上运行之前讨论的四种顶点聚类算法、绘制结果并为每个算法计算模块度分数的脚本\n\
  \n图 3-4 显示了生成的图表。\n\n![图 3-4：四种不同算法提供的 Farrelly 社交网络聚类](img/f03004_m.png)\n\n图 3-4：四种不同算法提供的\
  \ Farrelly 社交网络聚类\n\n请注意，对于所有这些函数，簇的数量并不是像 k-means 那样由用户指定的。这些算法在寻找最优解的过程中作为一部分确定了簇的数量。在这个例子中，`walktrap`\
  \ 和 `spinglass` 找到了相同的三个簇，即医学院的个人（包括 Farrelly 的顶点 `V7`）以及将退伍军人组分为两部分。这种三路聚类在这些算法找到的解决方案产生了最高的模块度分数。\n\
  \nLouvain 找到了次优分，结果与上一个相似，但它以略有不同的方式划分了退伍军人组（将两个顶点从一个簇重新分配到另一个）。模块度分数略低于此，fast greedy\
  \ 算法最终只得到了两个簇（包含 Farrelly 的医学院社区和退伍军人社区）。显然，该算法中的贪婪性阻止了它发现通过划分退伍军人社区可以获得更高的模块度。尽管如此，由\
  \ fast greedy 算法找到的这个双簇解决方案描述了数据的原始背景，即 Farrelly 将她的两个独立社区合并在了一起。\n\n如果你感兴趣，可以探索\
  \ `igraph` 中实现的其他几种顶点聚类算法。例如，`cluster_edge_betweenness()` 函数使用介数性指标（betweenness\
  \ metric）不是作为特征，而是以一种更直接的方式。介数性分数高的顶点被视为 `bridges`（桥梁），该函数发现的社区是那些被这些桥隔开的社区。另一个有趣的方法由\
  \ `cluster_infomap()` 函数提供，它利用信息论寻找信息流流畅的社区；这也可以从网络上随机游走的行为来解释。\n\n到为止，我们讨论了单个网络内顶点之间的有监督和无监督学习。现在，让我们考虑比较网络的情况。\n\
  \n## 比较网络\n\n有时，一个网络并不是整个数据集。它只是包含许多网络的数据集中的单个实例。例如，在社交媒体平台上检测机器人账户通常涉及有监督分类，即将真实用户的朋友或粉丝网络与虚假用户进行比较。在第\
  \ 2 章中提到的宾夕法尼亚州杰利分螈案中，选区地图被转换为网络，旧地图被显示为网络分布中可疑的离群值。神经科学提供了另一个需要比较网络的重要例子。事实上，通常将功能磁共振成像（fMRI）和正子发射断层扫描（PET）数据转换为网络结构，顶点代表大脑的不同区域，边基于活动模式（例如一个区域的顺序激活，或在某个任务期间多个区域的协同激活）。通常需要比较两组患者——健康患者与患特定神经或心理疾病的患者，或者两个不同的疾病组。翻译成数据科学，这意味着我们正在查看一个二分类网络数据集，以查看两类之间是否存在统计学上的显著差异（以理解结构差异）。我们可能还会训练一个监督分类器，根据网络结构预测类别。\n\
  \n为了生成一些合成数据，让我们为第 2 章末尾描述的每种类型创建 100 个网络：Erdös–Renyi、无标度（scale-free）和 Watts–Strogatz。在列表\
  \ 3-5 中，我们执行了这一操作，并绘制了网络直径的直方图，以观察它在不同类型网络内部以及之间的变化。\n\n\n\n\n\n```\n#initiate vectors/lists\n\
  n<-100\ner<-list()\nsf<-list()\nws<-list()\ner_d<-rep(NA,n)\nsf_d<-rep(NA,n)\nws_d<-rep(NA,n)\n\
  \n#loop to create and store random graphs and compute their diameters\nfor (i in\
  \ 1:n){\n  er[[i]]<-sample_gnp(100,0.02)\n  sf[[i]]<-sample_pa(100,power=2.5,directed=F)\n\
  \  ws[[i]]<-sample_smallworld(1,100,1,0.1)\n  er_d[i]<-diameter(er[[i]])\n  sf_d[i]<-diameter(sf[[i]])\n\
  \  ws_d[i]<-diameter(ws[[i]])\n}\n\n#plot combined histogram\nhist(er_d,col=rgb(0,0,1,0.2),xlim=c(0,max(max(ws_d),max(ws_d),max(ws_d))),ylim=c(0,40),xlab=\"\
  Diameter\",main=\"\")\nhist(sf_d, col=rgb(0,0,1,0.5), add=T)\nhist(ws_d, col=rgb(0,0,1,0.8),\
  \ add=T)\nbox()\n```\n\n列表 3-5：该脚本生成了 `300` 个网络并将其平均分为三种不同类型；计算它们的网络直径；然后为每种类型的网络绘制直方图：Erdös–Renyi\
  \ 网络、无标度网络和 Watts–Strogatz 网络。\n\n此处选择的参数是为了确保所有随机网络具有相同数量的顶点（任意选择为 100）以及大致相同的边密度（约\
  \ 2%）；这确保了网络结构是区分这三组的因素，而不是顶点或边的数量等更简单的因素。图 3-5 显示了生成的直方图结果。\n\n![图 3-5：三种不同类型随机网络直径的直方图：Erdös–Renyi（浅灰色）、无标度（中灰色）和\
  \ Watts–Strogatz（深灰色）](img/f03005.png)\n\n图 3-5：三种不同类型随机网络直径的直方图：Erdös–Renyi（浅灰色）、无标度（中灰色）和\
  \ Watts–Strogatz（深灰色）\n\n我们看到这三个直方图是不相交的。Erdös–Renyi 网络具有中等直径。无标度网络的直径值较小。Watts–Strogatz\
  \ 网络具有较大的直径。如果你感兴趣，可以尝试修改列表 3-5 来计算第 2 章中讨论的其他全局网络指标（如效率、传递系数和谱半径），以观察它们在不同类型的随机图结构中的表现。\n\
  \n利用到目前为止开发的工具，你现在可以在网络数据集上执行许多机器学习任务。对于分类（例如，根据其朋友网络将社交媒体账户标记为机器人还是真实用户）或回归（例如，根据引文网络预测学术出版物的期刊排名），你可以计算一组全局网络指标，然后将其作为传统监督学习算法的特征。同样，为了将一组网络聚类为不同的类型（例如，根据个人的\
  \ fMRI 脑网络结构对个人进行分组），你可以计算全局网络指标并将其输入传统的聚类算法。你还可以进行统计分析，例如离群值检测和置信区间估计。事实上，通过用全局网络指标值的向量来表示每个网络，你“结构化”了你的网络数据，并为我们在数据科学中传统依赖的所有统计和机器学习方法打开了大门。\n\
  \n## 分析网络中的传播\n\n网络分析的另一个重要主题是各种实体在网络中的传播（或 `propagation`）。这在现实世界中有许多实例，包括接触网络中的传染病和社交媒体网络中的病毒式内容。理解网络的几何结构有助于预测实体在网络中传播的方式，我们可以利用这一见解改变网络的几何结构，从而影响传播。\n\
  \n### 跟踪城镇间的疾病传播\n\n让我们回到上一章图 2-3 中包含四个城镇的加权网络。我们将取列表 2-3 中的邻接矩阵，并用它创建一个加权网络，其边权重是原始距离的倒数；这把距离转换为接近性评分，其中较短道路的边权重比长路更大。列表\
  \ 3-6（它依赖于首先运行列表 2-3,function(x) 1/x)\ntownprox[which(townprox == Inf)]<-0\n\n#从这个新邻接矩阵创建加权网络\n\
  g_townprox<-graph_from_adjacency_matrix(townprox,mode=\"undirected\",weighted=T)\n\
  \n# 绘制由权重标记边的网络\nplot(g_townprox,edge.label=round(E(g_townprox)$weight,3),vertex.color=2,vertex.size=15,vertex.label.cex=0.8)\n\
  ```\n\n 列表 3-6：该脚本创建并绘制了来自第 2 章的四个城镇网络，但边权重由距离的倒数给出。图 3-6 显示了结果图。\n\n![图 3-6：城镇之间的接近性（距离倒数）](img/f03006.png)\n\
  \n图 3-6：城镇之间的接近性（距离倒数）\n\n让我们考虑一个跨网络中传播疾病的简单流行病模型，其中疾病从感染城镇传播到每个邻近城镇的概率由边接近性给出。如果疾病从城镇\
  \ `V1` 开始，那么它有 25% 的概率传播到 `V4`。如果发生了，它会有 16.7% 的概率进一步从 `V4` 传播到 `V3`。但这两个概率相乘（约\
  \ 4.2%）并不是疾病从 `V1` 传播到 `V3` 的概率；它只是沿着传播路径 `V1→V4→V3` 传播的概率。另一个传播路径是 `V1→V4→V2→V3`，其发生的概率为\
  \ 1%。\n\n对于较大的网络，基于网络路径的潜在传播路径计算所有条件概率显然太难以通过手动完成，因此我们需要这些计算是自动化。此外，这个流行病模型太简单了，没有太大实用价值；我们在这里讨论它只是为了让加权网络结构如何影响各种实体（疾病、信息等）跨越顶点的传播，并引导我们转向下一个更复杂的流行病模型。\n\
  \n`SIR 模型`，或`易感-感染-抵抗模型`（另一种说是`易感-感染-恢复模型`），是一种通过假设每个个人处于三种疾病状态之一的模型来预测疾病在人群中的传播：易感（可能被感染）、感染（患病并可以传播）或恢复或抵抗（对疾病具有免疫力）。该模型有许多变体，包括易感-感染-易感模型、易感-感染-恢复-易感模型、包含部分免疫的模型、个体在流行病期间出生或死亡的模型，以及人口混合速率不同的分区域模型或地理模型。所有这些模型的基础都是偏微分方程组，其参数与人口混合（如接触率或时间）以及疾病特征（单个感染者预计产生的新感染数）有关。通常这些微分方程难以显式求解，因此我们运行计算机模拟来量化不同可能结果的范围和概率。\n\
  \n\n\n为了考虑到群体中个体之间的社会交互，`SIR` 模型已被引入到网络中。这为疾病可能如何传播提供了更详细的预测，并帮助人们找到减轻这种传播的方法：我们可以运行模型来查看删除节点或边、或者以其他方式重构网络对疾病传播的影响。\n\
  \n来自第 2 章的许多网络几何概念在这里起了作用。枢纽节点（Hubs）是高传播区域，可能需要关闭或缩小规模；桥梁（bridges）和具有高中介中心评分（betweenness\
  \ scores）的节点暗示了切断疾病主要传播途径的针对方法；而高中心性评分（centrality scores）的节点可能指示了最需要接种或隔离的个体。此外，网络上的\
  \ `SIR` 模型以及用于探索它们的计算机模拟技术，应用范围远超流行病学，因为它们为研究网络结构与网络传播之间更一般的复杂关系提供了一种强大的实证方法。例如，社交媒体上虚假信息的传播是近期引起广泛关注的问题，并驱动了对更好地理解网络结构如何影响社交媒体病毒式传播的需求——而\
  \ `SIR` 型模型已证明在该领域非常有价值。\n\n### 跟踪风浪板运动员之间的疾病传播\n\n让我们直接进入一个示例。列表 3-7 加载了一个流行的网络数据集——`KONECT\
  \ Windsurfer Network`。这是一个加权网络，代表了 1986 年秋季南加州 43 名风浪板运动员及其交互水平。邻接矩阵中几乎所有的非角线元素均为非零——这意味着网络中几乎所有可能的边都存在——所以真正重要的是权重。这使得网络可视化变得困难，因此让我们创建两个密度较低的网络版本：一个是删除所有权重不在前四分数的边，另一个是删除低于中位的边。（这是过滤加权网络的一种简单形式，我们将在第\
  \ 4 章中深入讨论这一概念）。列表 3-7 执行了此操作并绘制了结果。\n\n```\n#加载数据集，计算四分位数，并转换为加权网络\nwind<-as.matrix(read.csv(\"\
  beachdata.csv\",header=F))\nq<-quantile(wind,prob=c(.25,.5,.75))\ng_wind<-graph_from_adjacency_matrix(wind,mode=\"\
  undirected\",weighted=T)\n\n#新网络，仅保留权重在前两个和四分位数的边\nwind_top<-wind\nwind_top[which(wind\
  \ < q[3])]<-0\ng_wind_top<-graph_from_adjacency_matrix(wind_top,mode=\"undirected\"\
  ,weighted=T)\nwind_mid<-wind\nwind_mid[which(wind < q[2])]<-0\ng_wind_mid<-graph_from_adjacency_matrix(wind_mid,mode=\"\
  undirected\",weighted=T)\n\n#使用权重² 作为边宽绘制这两个稀疏的网络\n#(对权重平方只是为了增加视觉区分） plot(g_wind_top,vertex.size=10,vertex.label.cex=0.4,vertex.color=2,edge.width=E(g_wind_top)$weight²)\n\
  plot(g_wind_mid,vertex.size=10,vertex.label.cex=0.4,vertex.color=2,edge.width=E(g_wind_mid)$weight²)\n\
  ```\n\n列表 3-7：一个加载 `KONECT Windsurfer Network` 数据集并通过删除权重不在前一个或两个四分位数的边来创建其两个低密度版本的脚本，然后绘制结果。\n\
  \n使用 `edge_density()` 函数，我们发现原始网络的密度为 99.3%，前四分位数的网络密度为 25.8%，而中位数以上的网络密度为 51.4%。图\
  \ 3-7 中的图表展示了风浪板运动员网络的这两个稀疏版本。边的厚度代表边的权重，但为了增加它们之间的视觉视觉区分度，我们将厚度设置为边权重的平方。\n\n![图\
  \ 3-7：风浪板网络的两个稀疏版本，其中删除了所有权重不在前四分之一（左侧）或前两个四分之一（右侧）的边](img/f03007_m.png)\n\n图 3-7：风浪板网络的两个稀疏版本，其中删除了所有权重不在前四分之一（左侧）或前两个四分之一（右侧）的边。\n\
  \n在 R 中运行 `SIR` 模拟非常简单。使用 `igraph` 的 `sir()` 函数，你只需要指定网络、感染率（称为 `beta`）和恢复率（称为 `gamma`），然后（可选地）指定要执行的模拟试验次数（默认值为\
  \ 100）。感染率决定了每个时间步中易感节点被受感染邻居感染的概率（传染性越强的疾病速率越高）；有两个受感染邻居会使感染的几率增加一倍。恢复率决定了感染持续时间的概率分布；较高的恢复率意味着每个时间步感染节点转移到恢复状态的概率更高。较高的恢复率表明感染持续时间较短。\n\
  \n在绘制 `sir()` 的结果时，你会看到活动感染人数以及中位数值。对 `sir()` 的输出应用 `median()` 函数可以提供三个时间序列：易感人数的中位数、感染人数的中位数和康复人数的中位数。让我们试一下。在列表\
  \ 3-8 中，我们在完整数据集集上模拟了一种疾病，感染率为 3，恢复率为 2。\n\n```\n#在风浪板网络上进行 SIR 模拟\nsim<-sir(g_wind,beta=3,gamma=2)\n\
  \n#绘制结果\nplot(sim,main=\"Number of Infected Over Time, Including Confidence Intervals\"\
  )\n\n# 显示每个桶的感染人数中位数\nmedian(sim)$NI\n```\n\n列表 3-8：一个脚本在 `KONECT Windsurfer Network`\
  \ 上运行 100 次 `SIR` 模型的模拟试验，感染率为 `beta=3`，恢复率为 `gamma=2`，然后绘制结果并显示随时间变化的感染人数中位数。\n\
  \n图 3-8 显示了生成的图。\n\n![图 3-8：在原始 KONECT Windsurfer Network 上进行 SIR 模拟（100 次），显示了随时间变化的感染人数（包含平均值和置信区间），感染率为\
  \ 3，恢复率为 2 的疾病](img/f03008.png)\n\n图 3-8：在原始 KONECT Windsurfer Network 上进行 SIR 模拟（100\
  \ 次），显示了随时间变化的感染人数（包含平均值和置信区间），感染率为 3，恢复率为 2 的疾病。\n\n在峰值时期，感染人数的中位数为 28 人——这是整个网络的\
  \ 65%。这是一种在稠密网络中传播的高传染性疾病。运行与列表 3-4 相同的代码，但将感染率降低到 `beta=1` 并将恢复率提高到 `gamma=10`，即可图\
  \ 3-9 中的图。\n\n![图 3-9：在原始 KONECT Windsurfer Network 数据集上进行 SIR 模拟（包含置信水平），现在感染率为\
  \ 1，恢复率为 10](img/f03009.png)\n\n图 3-9：在原始 KONECT Windsurfer Network 数据集上进行 SIR 模拟（包含置信水平），现在感染率为\
  \ 1，恢复率为 10。\n\n\n\n\n不出所料，这次新的疫情模拟显示在更短的时间内，感染的人数更少。现在，活跃感染人数的中位数峰值为 17，而这次疫情的持续时间仅为之前参数四分之一。在利用\
  \ `SIR` 模型研究现实世界的疫情时，如果感染率和恢复率参数已知的，流行病学家会从科学文献中查阅这些参数；如果未知，则可以根据疾病到目前为止传播的数据进行估算。通常，此类估计会涉及某种程度的不确定性，因此我们可以在一系列参数上运行\
  \ `SIR` 模拟，以观察可能的结果范围。\n\n### 中断通信与疾病传播\n\n顶点福曼-瑞西曲率（vertex Forman–Ricci curvature）的一个有趣提议用途是对顶点进行排序并将其移除，以中断网络上的通信和疾病传播。在通信网络中，中断通信可能涉及针对特定的基站或隔离网络中的某个重要节点。在\
  \ 2020 年，我们看到通过社交距离和隔离来隔离 COVID 感染者或接触者，如何帮助阻止 COVID 在大城市中的传播。回想作者网络中的顶点 `7` 具有较大的福曼-瑞西曲率。让我们在包含和不包含顶点\
  \ `7` 的作者网络上运行 `SIR` 模型以比较结果：\n\n``````\n#在完整的作者网络上运行并绘制 SIR 疫情\nsim1<-sir(g_social,beta=3,gamma=2)\n\
  plot(sim1,main=\"Epidemic on Full Author's Network\")\n\n#从作者网络中删除顶点 7 并重新运行 SIR\
  \ 疫情\n\ng2<-delete_vertices(g_social,v=7)\nsim2<-sir(g2,beta=3,gamma=2)\nplot(sim2,main=\"\
  Epidemic on Author's Network with Vertex 7 Removed\")\n```\n\n该脚本在原始网络和删除了顶点 `7`\
  \ 的修改后网络上运行疫情，以比较模拟疫情的严重程度。这应该产生一个与图 3-10 相似的初始图，显示疫情在整个网络中传播。\n\n![图 3-10：作者完整网络上的\
  \ SIR 疫情](img/f03010.png)\n\n图 3-10：作者完整网络上的 SIR 疫情\n\n图 3-10 显示了 `SIR` 疫情导致了五个时间周期的感染传播，感染人数的中位数为\
  \ `5`。某些模拟表明，在最初 `2` 个时间周期内，可能同时有高达 12 人感染。这是一场相当严重的疫情，预计在感染耗尽所有易感人群之前，一次会影响超过 25%\
  \ 的人口。\n\n让我们看看当顶点 `7` 被移除时会发生什么，如图图 3-11 所示。\n\n![图 3-11：作者编辑后网络上的 SIR 疫情（已删除顶点\
  \ 7）](img/f03011.png)\n\n图 3-11：作者编辑后网络上的 SIR 疫情（已删除顶点 7）\n\n图 3-11 显示了在较短时间范围内较轻微的疫情。只有四个时期发生了感染，疫情高峰期感染人数的中位数仅为\
  \ `2`，最大估计值为 `8`。虽然疫情仍然影响了人口，但它被限制在较少的人群并很快结束。到第二个时间周期结束时，大多数模型表明疫情已经结束。\n\n存在许多允许我们针对目标顶点以中断网络的应用。我们不仅可以通过移除网络部分来缓解潜在的疫情，还可以通过移除具有高度负值福曼-瑞西曲率的目标，来中断恐怖分子细胞或敌对政府内部的通信，或者通过移除生物网络骨干中的蛋白质或基因来中断疾病过程。福曼-瑞西曲率随网络演化的变化也有助于网络相关的分析能力。\n\
  \n*福曼-瑞西流*（*Forman–Ricci flow*）是一种与网络上曲率随时间变化相关的几何流（微分方程），类似于热量从定义的起始点在整个网络中消散。跟踪曲率的变化可以识别网络内的变化区域。福曼-瑞西流提供了一种量化网络内部连接增长或收缩区域的方法，例如恐怖细胞成员的快速扩张、癌症基因网络中突变的积累，或疫情中疾病传播风险的增加。例如，在\
  \ COVID 隔离期间，某些地区大型聚会或活动的增加，导致了该地区社交网络内 COVID 传播的增加。图像数据集上的福曼-瑞西流还提供将医学图像数据从原始文件映射到标准表面（如平面、球体甚至是煎锅）的方法，以便结果可以在患者组内及组之间汇总和比较。\n\
  \n## 总结\n\n在本章中，我们首先看到了第 2 章中涵盖的顶点指标如何作为网络内监督学习的预测器（包括链路预测）以及顶点聚类（即社区挖掘）的特征。这种机器学习方法将网络转换回结构化数据集，并应用欧几里得机器学习算法。然后，我们研究了一些直接在网络内运行的社区挖掘算法。接下来，我们从分析网络内的数据转向分析每个数据点本身都是网络的数据集。与我们之前在之前的设置中使用顶点指标类似，在这里我们使用了全局网络指标作为预测器或特征。最后，在本章的最后一节中，我们探索了\
  \ `SIR` 疾病传播模型。这里的重点是网络几何与传播的交汇；特别是，我们讨论了基于网络几何的针对性中断策略。\n\n# 4 网络过滤\n\n![](img/chapterart.png)\n\
  \n我们探索了通过测量几何属性来分析网络数据的许多方法。在本章中，我们将引入加权网络过滤，它通过施加在网络上的阈值来跟踪几何属性和网络指标。然后我们将研究如何将网络数据转换为称为*单纯复形*的高维拓扑对象，并探索我们之前考虑的网络指标的高维版本。从这里开始，我们将使用与过滤相关的拓扑工具进行图比较。\n\
  \n## 图过滤\n\n在之前的章节中，我们回顾了不同的网络指标，包括不同的中心性度量、熵、谱半径、直径等。理解加权网络拓扑属性的一种有趣方法是*图过滤*，这通过迭代移除低于特定阈值的边来创建一系列加权网络的方法（例如，移除所有权重低于\
  \ `0.2`、`0.4` 或 `0.6` 的边）。\n\n\n\n为了进一步探讨这一点，假设我们正在根据青少年在社区内的友谊或非正式社交关系，研究其长期教育或风险行为结果。假设我们有加权社交网络，每个顶点都有较高的度指标（degree\
  \ metrics），边的权重根据正常一周内与朋友相处的小时决定。第一组朋友可能在周末在一起踢几小时足球。第二组朋友可能每周一起学习一次或两次，并在课上见面。第三组朋友可能经常一起运动，晚餐后或早晨上学前一起做作业，并经常在对方家里留宿。当我们过滤共处的小时时，网络中前两组朋友的度指标将随之下降。最后一组在过滤过程中将保持保持较高的度指标，因为他们待在一起的时间更长。这种度的持续性可能会揭示我们在研究中正在考察的任何社交纽带的强度。\n\
  \n让我们通过分解和探索两个小型示例社交网络——`Graph 1` 和 `Graph 2`——来观察如何实现图过滤（graph filtrations）。首先，我们将这两个网络加载到\
  \ `R` 中，并使用 Listing 4-1 中的脚本探索完整网络的结构。\n\n```\n#在 R 中加载两个网络\nmydata1<-as.matrix(read.csv(\"\
  Graph1w.csv\",header=F))\nmydata2<-as.matrix(read.csv(\"Graph2w.csv\",header=F))\n\
  \n# 加载 igraph 并转换为图对象\nlibrary(igraph)\ng1<-graph_from_adjacency_matrix(mydata1,mode=\"\
  undirected\",weighted=T)\ng2<-graph_from_adjacency_matrix(mydata2,mode=\"undirected\"\
  ,weighted=T)\n\n# 绘制两个图\nplot(g1,edge.label=E(g1)$weight,main=\"Graph 1\")\nplot(g2,edge.label=E(g2)$weight,main=\"\
  Graph 2\")\n```\n\nListing 4-1：用于过滤的两个不同网络结构的脚本\n\nListing 4-1 中的脚本应该加载两个不同的网络——`Graph\
  \ 1` 和 `Graph 2`，它们具有不同的连接模式，但顶点数量相同。它还应该绘制这两个网络，并在图中给出边权重。让我们比较 Figure 4-1 所示的网络。\n\
  \n![Figure 4-1: 两个示例网络的图](img/f04001_m.png)\n\n图 4-1：两个示例网络的图\n\nFigure 4-1 表明 `Graph\
  \ 1` 是一个稀疏连接的网络，具有大部分较大的边权重（可能是同班学生在周末参加某项服务活动的样本），而 `Graph 2` 是一个密集连接的网络，混合了不同的边权重（可能是运动队内部的友谊网络）。我们预计\
  \ `Graph 2` 中会有更高的中心得分（hub scores）和其他中心性指标，但过滤可能会这些指标可能会比我们预期的在 `Graph 1` 中的变化更快。\n\
  \n让我们为网络创建过滤；这将允许我们探索这些网络上的一些中心性指标。我们可以通过向 Listing 4-1 中的脚本中添加以下代码来实现：\n\n```\n\
  #过滤 Graph 1\nmydata1[mydata1<0.2]<-0\ng12<-graph_from_adjacency_matrix(mydata1,mode=\"\
  undirected\",weighted=T)\nmydata1[mydata1<0.4]<-0\ng14<-graph_from_adjacency_matrix(mydata1,mode=\"\
  undirected\",weighted=T)\nmydata1[mydata1<0.6]<-0\ng16<-graph_from_adjacency_matrix(mydata1,mode=\"\
  undirected\",weighted=T)\nmydata1[mydata1<0.8]<-0\ng18<-graph_from_adjacency_matrix(mydata1,mode=\"\
  undirected\",weighted=T)\n\n#过滤 Graph 2\nmydata2[mydata2<0.2]<-0\ng22<-graph_from_adjacency_matrix(mydata2,mode=\"\
  undirected\",weighted=T)\nmydata2[mydata2<0.4]<-0\ng24<-graph_from_adjacency_matrix(mydata2,mode=\"\
  undirected\",weighted=T)\nmydata2[mydata2<0.6]<-0\ng26<-graph_from_adjacency_matrix(mydata2,mode=\"\
  undirected\",weighted=T)\nmydata2[mydata2<0.8]<-0\ng28<-graph_from_adjacency_matrix(mydata2,mode=\"\
  undirected\",weighted=T)\n```\n\n之前的代码通过 0.2 的递增间隔按边权重过滤了 `Graph 1` 和 `Graph 2`。这在每个图过滤中产生了一系列五个网络，通过对每个过滤后的图序列应用网络指标可以进一步检查。\n\
  \n让我们通过向脚本中添加以下内容，检查 `Graph 1` 过滤过程中每个顶点的度中心性（degree centrality）：\n\n```\n#计算 Graph\
  \ 1 过滤序列的度中心性\nd1<-degree(g1)\nd12<-degree(g12)\nd14<-degree(g14)\n```\n（此处补充后续代码）\n\
  ```\nd16<-degree(g16)\nd18<-degree(g18)\n\n#创建一个一个跟踪度中心性的数据集\ng1deg<-cbind(d1,d12,d14,d16,d18)\n\
  ```\n\n此代码计算 `Graph 1` 过滤的度中心性，应产生包含 Table 4-1 信息的数据集。\n\n表 4-1：过滤的度中心性\n\n| Column1\
  \ | d1 | d12 | d14 | d16 | d18 |\n| --- | --- | --- | --- | --- | --- |\n| V1 |\
  \ 3 | 2 | 2 | 1 | 0 |\n| V2 | 2 | 1 | 1 | 1 | 0 |\n| V3 | 3 | 3 | 3 | 2 | 1 |\n\
  | V4 | 3 | 3 | 3 | 2 | 1 |\n| V5 | 3 | 3 | 2 | 2 | 1 |\n| V6 | 1 | 1 | 1 | 1 | 0\
  \ |\n\nTable 4-1 显示顶点 `1`、`3` 和 `4` 具有较高的中心性；然而，过滤开始后模式发生了变化。现在，让我们添加一些代码来计算 `Graph\
  \ 2` 的度中心性：\n\n```\n#计算 Graph 2 过滤序列的度中心性\nd2<-degree(g2)\nd22<-degree(g22)\nd24<-degree(g24)\n\
  d26<-degree(g26)\nd28<-degree(g28)\n\n#创建一个跟踪度中心性的数据集\ng2deg<-cbind(d2,d22,d24,d26,d28)\n\
  ```\n\n此代码计算 `Graph 2` 过滤的度中心性，产生与 `Graph 1` 类似的表格。Table 4-2 总结了来自 `Graph 2` 的结果。\n\
  \n表 4-2：过滤的度中心性\n\n| Column1 | d2 | d22 | d24 | d26 | d28 |\n| --- | --- | --- |\
  \ --- | --- | --- |\n| V1 | 4 | 3 | 3 | 3 | 3 |\n| V2 | 4 | 4 | 3 | 2 | 1 |\n| V3\
  \ | 4 | 4 | 3 | 2 | 1 |\n| V4 | 5 | 4 | 3 | 0 | 0 |\n| V5 | 3 | 3 | 1 | 1 | 0 |\n\
  | V6 | 4 | 4 | 3 | 2 | 1 |\n\n度中心性只是我们可以在过滤过程中计算的指标的一个示例；我们还可以计算其他局部指标，如中介中心性（betweenness\
  \ centrality）或三元闭合（triadic closure）。此外，我们还可以在过滤过程中计算全局指标，例如谱半径或欧拉示数。让我们向 Listing\
  \ 4-1 中添加以下内容，以计算 `Graph 1` 每次过滤的直径：\n\n```\n#计算 Graph 1 过滤的图直径\ndi1<-diameter(g1)\n\
  di12<-diameter(g12)\ndi14<-diameter(g14)\ndi16<-diameter(g16)\ndi18<-diameter(g18)\n\
  ```\n\n\n\n\n通过此代码对图 1 进行过滤时计算出的直径序列为 2.1, 2.9, 2.9, 1.6 和 0.9。让我们计算图 2 过滤过程的直径：\n\
  \n```bash\n#calculate graph diameter of Graph 2's filtration\ndi2<-diameter(g2)\n\
  di22<-diameter(g22)\ndi24<-diameter(g24)\ndi26<-diameter(g26)\ndi28<-diameter(g28)\n\
  ```\n\n通过此代码对图 2 进行过滤时计算出的直径序列为 0.9, 1.2, 1.6, 2.4 和 1.7。这与图 1 的直径序列不同，表明在过滤序列的后期，其直径通常是较小的。该指标的过滤可能有助于评估社区非正式社会关系的整体水平和深度，这是衡量为有需要的的居民所提供的可用社区资源的一项指标。图\
  \ 4-2 显示了两次过滤过程中的直径图，以比较这两个网络。\n\n![Figure 4-2: 图 1 和图 2 过滤的图直径指标图](img/f04002.png)\n\
  \n图 4-2: 图 1 和图 2 过滤的图直径指标图\n\n正如我们在图 4-2 中所示，图 1 在过滤早期的图直径大于图 2，但在过滤值达到 0.4 之后这种关系发生了反转。这表明图\
  \ 1 在过滤早期具有更大的离心性，而图 2 在过滤后期具有更大的离心性。请记住，离心性是网络中从一点到另一点的最大距离。\n\n我们在图 4-2 中绘制的图过滤跟踪有助于区分具有不同连接模式或权重的相似图。权重随时间变化的动态网络可以是图过滤的一个用用例。此外，它们在比较具有相同顶点但权重可能不同的网络（例如脑成像研究中的患者组）时非常有用；事实上，脑成像研究是开发图过滤的应用之一。较高的离心值意味着中继神经信号的路径较长；更边缘权重代表大脑两个区域之间的连接较强。低离心性的强边表明在执行成像的患者组所被特定任务中激活了功能模块。\n\
  \n尽管图过滤是一个相对新的概念，但它主要仍局限于生物网络数据，包括基于脑成像研究的网络。然而，图过滤方法广泛适用于加权网络数据，其工具集也适用于其他领域的进一步开发。如果你想更深入地探索这个主题，请查看此书末尾的参考文献，并在他们自己的数据上尝试图过滤。现在，让我们关注图的拓扑视图，它允许我们将图中捕获的关系扩展到人与事物之间其他类型的相互作用。\n\
  \n## 从图到单纯复形\n\n图可以被视为具有定义全局属性的拓扑对象，我们可以在分析中利用这些属性，而且通过考虑图中个人和顶点之间的三方、四方和 `n` 方交互，可以将图转换为图的高维版本，称为\
  \ `simplicial complex`（单纯复形）。让我们考虑三位经常合作学术论文、但从未以三个人共同名义发表过论文的同事。我们将为这三位同事创建一个简单的图，所示于图\
  \ 4-3。\n\n![Figure 4-3: 显示三位同事之间双向交互的单纯复形](img/f04003.png)\n\n图 4-3: 显示三位同事之间双向交互的单纯复形\n\
  \n现在让我们想象一篇三位同事都参与且名字都在上面的上的论文。这是一个三方交互，而不是三次双向交互，我们将得到一个填充的三角形，而不是三组双向箭头，如图 4-4\
  \ 所示。\n\n![Figure 4-4: 显示三位同事之间三方交互的单纯复形](img/f04004.png)\n\n图 4-4: 显示三位同事之间三方交互的单纯复形\n\
  \n图 4-4 使用三角形来代表同事之间的三方连接，就像两个同事之间的箭头代表双向连接一样。这可以推广到代表四方交互的四面体以及代表更高阶 `n` 方交互的更奇特的形状。数字\
  \ `n` 的大小没有限制，但当我们向单纯复形中的 `n` 方交互迈进时，某些将会会出现计算问题。涉及邮件链、论文共同作者或会议电话的分析是常见的应用，它们将社交网络分析和图扩展到了单纯复形分析。取决于网络的大小和\
  \ `n` 方交互的大小，个人及其相互作用的单纯复形表示在不同的 `n` 值可能会变得非常复杂。分析这些结构可能涉及大量的计算力和扩展网络指标的工具。然而，由于图是拓扑对象，拓扑学的许多定理和工具可以成功应用于它们。这反过来允许数学的其他领域（包括偏微分方程和概率论）在图上应用和发展。\n\
  \n正如我们可以过滤加权图一样，也可以过滤单纯复形。单纯复形的过滤过程取决于单纯复形构建的方式。在大多数拓扑数据分析算法中，我们从可以定义距离度量的空间内的数据云开始。如果点之间共享相互的\
  \ `n` 方重叠集（`Čech complex`）或成对重叠集（`Vietoris–Rips complex`），则将这些点包含在单纯复形中。通过增加或减少距离度量的值，我们得到了单纯复形的过滤。在实践中，Vietoris–Rips\
  \ 复形更容易计算，并且许多拓扑数据分析包的基础。这引导我们进入网络分析中一个非常新且新兴的部分：网络工具向单纯复形的扩展。\n\n在前几章中引入的许多工具都有单纯复形的对应物，包括离心性、最短路径算法、中心性指标（K\
  \ 中心性、特征向量中心性、紧密中心性等）、三元闭合等。通常，网络数据的单纯复形是通过计算网络内部的极大团（maximal cliques）来构建的（尽管也可以定义距离度量并应用上段定义的流程从网络数据构建单纯复形）。网络中的\
  \ `maximal cliques` 包含了顶点组之间最高级的 `n` 方相互边。这些极大团对应于 (`n` – 1) 单纯复形。图的 `flag complex`（标记复形）涉及通过计算图的最大团来构建图的单纯复形。从复形中，可以在每个单纯复形层级定义量，并将它们组合成跨层级的总指标。这意味着我们可以从单纯复形不同层级中获取关于网络整体结构及其组件的更多信息。\n\
  \n\n\n\n\n让我们回到之前章节介绍的 Farrelly 社交网络，查看度中心性的一种扩展，被称为 `topological dimension`（拓扑维度）。我们可以将拓扑维度定义为加权度中心性，通过每个顶点所属的团（cliques）的维度对其进行加权，这涉及到对顶点不同维度的团进行求和。例如，网络中一个位于最大二元团和一个最大三元团中的顶点，其拓扑维度为\
  \ 5。一个位于最大五元团且不属于其他团的顶点，其拓扑维度也为 5。然而，前者的度可能为 3，连接到二元团中的另一个顶点和三元团中的两个顶点；后者的度为 4，连接到五元团中的其他四个顶点。\n\
  \n在 Listing 4-2 中，我们有一个脚本可以计算 Farrelly 社交网络中最大团和顶点的拓扑维度。\n\n```\n#load the author's\
  \ network\ng_social<-read.csv(\"SocialNetwork.csv\")\n\n#create the graph\nlibrary(igraph)\n\
  g1<-graph_from_adjacency_matrix(g_social,mode=\"undirected\",weighted=F)\n\n#compute\
  \ the maximal cliques in the author's network data\ncl<-maximal.cliques(g1)\n\n\
  #create array\ncl<-as.array(cl)\n\n#get clique size from maximal clique array\n\
  d<-dim(cl)\nl<-rep(NA,d)\nfor (i in 1:d){\n  l[i]<-length(as.vector(cl[[i]]))\n\
  }\n\n#create matrix of vertices in maximal cliques\nav<-matrix(rep(NA,d*20),20)\n\
  for (i in 1:20){\n  for (j in 1:d){\n    av[i,j]<-i%in%cl[[j]]\n  }\n}\n\n#convert\
  \ to binary indicators\navind<-ifelse(av==TRUE,1,0)\n\n#multiply out to calculate\
  \ each vertex's topological dimension\ntopmat<-t(avind)*l\ntopdim<-colSums(topmat)\n\
  ```\n\nListing 4-2: 计算 Farrelly 社交网络中顶点拓扑维度的脚本\n\n该脚本根据图的标志复形（flag complex）计算拓扑维度。它首先从最大团计算标志复形；然后存储每个团的信息，以便我们可以遍历每个团以查看哪些顶点属于每个团。将这些信息转换为二值指示矩阵，允许我们将团的维度与指示矩阵相乘，得到一个包含每个顶点拓扑维度的向量。Table\
  \ 4-3 显示了作者网络数据集中每个顶点的拓扑维度度和。\n\n表 4-3: Farrelly 社交网络中顶点拓扑维度与度的汇总\n\n| 顶点 | 度 |\
  \ 拓扑维度 |\n| --- | --- | --- |\n| 1 | 2 | 3 |\n| 2 | 1 | 2 |\n| 3 | 5 | 11 |\n| 4\
  \ | 2 | 3 |\n| 5 | 4 | 7 |\n| 6 | 3 | 6 |\n| 7 | 8 | 18 |\n| 8 | 3 | 4 |\n| 9 |\
  \ 3 | 4 |\n| 10 | 3 | 6 |\n| 11 | 3 | 5 |\n| 12 | 1 | 2 |\n| 13 | 4 | 8 |\n| 14\
  \ | 4 | 7 |\n| 15 | 4 | 8 |\n| 16 | 2 | 4 |\n| 17 | 2 | 4 |\n| 18 | 3 | 6 |\n| 19\
  \ | 2 | 4 |\n| 20 | 1 | 2 |\n\nTable 4-3 显示了度（其计算中仅包含作者网络中的顶点和边）与拓扑维度（包含高阶相互作用）之间的显著差异。例如，顶点\
  \ 9 和 10 的度均为 3，但它们的拓扑维度分别为 4 和 6。\n\n\n\n\n从拓扑角度来看，它们是完全不同的。这两个球在二阶 Betti 数（second\
  \ Betti numbers）上有所不同，该数值统计对象中的三维空洞。Betti 数向量是一个无限数字序列，表示每个维度中洞的数量，从零阶位置的连通分量开始，移动到圆（第一阶位置）、空洞（二阶位置）以及更高维空洞（从第三个位置开始到无限位置）。\n\
  \n在实践中，大多数数据集在第一阶 Betti 数之后不会有很多洞，因此我们可以用零填充向量的其余部分。空心的篮球在第一阶 Betti 数之后有一个洞，因为它包含一个空洞，这给出的\
  \ Betti 数向量为 `(1, 0, 1, 0)`；而实心的棒球在任何维形维度上都没有洞，对应的 Betti 数向量为 `(1, 0, 0, 0)`。\n\n\
  某些对象在给定的维度上具有多个洞。例如，想象在图 4-5 所示的篮球的外表面上粘上第二个篮球。这个对象显然会有另一个空洞，产生 Betti 数向量为 `(1,\
  \ 0, 2, 0)`。甜甜圈（或 `torus`）的向量为 `(1, 2, 1, 0)`，因为它有两个定义管状末端的开口圆，当它们在末端连接时会形成一个空洞。图\
  \ 4-6 展示了从一张纸片构造环面的经典方法。\n\n![Figure 4-6: 从在边缘连接的纸片中构造环面的方法](img/f04006.png)\n\n\
  图 4-6：从在边缘连接的纸片中构造环面的方法便于分类那些在三维中易于可视化的对象和空间。然而，工业中使用的许多数据集涉及三个以上的维度，对这些对象的比较需要能够识别与这些对象相关的\
  \ Betti 数的算法；其中包括基因组数据集和多变量时间序列。\n\n### 欧拉性数 (Euler Characteristic)\n\n一种基于拓扑的指标同时出现在网络分析及其高维单纯复形中，并且它回到了之前章节引入的曲率概念。欧拉性数通常记作\
  \ `χ`，提供了一个单一数值来总结拓扑空间，并且是一个拓扑不变性，这意味着所计算的拓扑量不会随着空间的连续变形（拉伸、扭曲或在不撕裂空间的情况下进行其他操作）而改变。\n\
  \n欧拉性数可以使用 Betti 数来定义；从技术上讲，计算欧拉性数涉及 Betti 数的交错和（零阶 Betti 数 - 第一阶 Betti 数 + 第二阶\
  \ Betti 数 - 三阶 Betti 数 + 四阶 Betti 数 ... 直到存在的最高 Betti 数）。欧拉性数也可以通过单纯复形的维度来定义（顶点数\
  \ - 边数 + 三角形数 - 四元交互数 + ...）。然而，包含在边中的顶点是不被计入的。构成交互部分的三角形也不会被计入。\n\n然而，有一种简单的方法，可以使用与极大团相关的\
  \ `igraph` 函数（如前所述）获取网络或其高维单纯复形的最大部分。极大 `k` 团表示并计算了从网络派出的完整单纯复形的 `k` 单纯形。它们是构建完整单纯复形并跟踪每个\
  \ `n` 路交互中涉及部分的方便方法。让我们添加列表 4-2 中的脚本，以统计作者网络中的极大团：\n\n```\n# 创建一个表格，统计单纯复形中 k+1\
  \ 单纯形的数量\nsumm<-as.numeric(summary(cl)[,1])\njjj<-table(summ)\n```\n\n这段代码创建了一个总结网络中极大团的表格。我们之前计算了网络中的极大团。结果应该产生\
  \ 1 个四元交互（一元单纯形）、6 个边（二元单纯形）和 1 个三角形（三元单纯形）。我们可以将这些值代入欧拉性数公式：\n\n`χ = 0 顶点 - 1 边\
  \ + 6 三角形 - 1 四面体`\n\n这得到的 `χ` 为 `-6`。最近的研究表明，大多数真实世界网络倾向于负欧拉性数。这是一个非常有趣的现象，与网络曲率有关。图中负曲率与网络的鲁棒性有关；具有高度负曲率的网络可以承受部分功能的损失而不会对生物产生不利影响。\n\
  \n高斯-波内特定理（Gauss–Bonnet theorem）将通过同调定义的欧拉性数与对象的曲率（包括流形的曲率和边界的曲率）联系起来。最近有一些尝试将网络分析工具如同调和福曼\
  \ Ricci 曲率（Forman–Ricci curvature）联系起来，以深入研究网络属性。这是微分几何分支的一个深度结果，它将对象的局部几何与其全局拓扑连接起来，它是网络科学的一个新领域。现在我们知道网络拓扑和几何是相互相关的，让我们来看看一种名为持续同调的拓扑工具。\n\
  \n### 持续同调 (Persistent Homology)\n\n今天数据分析中最常用的基于拓扑的算法之一是持续同调，它应用于基因组学、医疗、经济、能量、心理测量等许多领域。从本质上说，持续同调算法是从数据构建点云，根据数据的不同阈值（类似于\
  \ MRI）将其过滤为一系列单纯复形，并跟踪每个切片中出现和消失的拓扑特征（如洞或空洞）。\n\n例如，考虑图 4-7 中的三块奶酪，每个都有圆形的洞；这些圆影响了数据集的第一阶\
  \ Betti 数。\n\n![Figure 4-7: 在不同位置有洞的奶酪片](img/f04007.png)\n\n图 4-7：在不同位置有洞的奶酪片 在图\
  \ 4-7 中，一个洞出现在三个切片中，另一个洞只出现在中间切片中，还有一个洞出现在两个切片中。假设我们要比较两个数据集，以查看它们是否来自相同的分布或形状。这在匹配图像数据时很常见。虽然图像数据很少带有奶酪洞，但圆经常眼睛的形式出现在图像数据中。让我们揭开这种直觉。\n\
  \n\n\n\n从技术上讲，通过改变用于从点云数据（或过滤后的数据）构建单纯复形 get 距离，你可以在过滤过程中跟踪各种 Betti 数，并为数据中的每个空洞分配一个重要性评分，重要的特征会持续更长的过滤距离（用持续同态术语来说称为更长的\
  \ `persistence`）。在图 4-7 中，出现在三个切片中的空洞被认为是最重要的特征，而仅出现在第二个切片中的空洞可能是数据噪声的结果。这些特征可以绘制在`barcode`（条形图）或`persistence\
  \ diagram`（持续图）上，用于跟踪特征的寿命（它们在过滤中存在的距离尺度）。我们将在接下来的示例分析中探索条形图和持续图。\n\n在实践中，由于计算问题，数据集通常只检查低维空洞和特征，除非你在显式计算高维形状数据，否则最常用的是零阶（连通分量）和一阶（环）Betti\
  \ 数。图 4-7 中的示例在所有三个切片中都是连通的，因此它在所有切片中的零 Betti 数均为 1。然而，环在过滤过程中出现又消失，产生了一个类似于图 4-8\
  \ 的条形图。\n\n![Figure 4-8: 绘制图 4-7 框内捕获的特征（空洞）持续性的图](img/f04008.png)\n\n图 4-8: 绘制图\
  \ 4-7 框内捕获的特征（空洞）持续性的图。\n\n条形图显示了特征出现和消失的时间。例如，在图 4-8 中，我们可以看到一个特征在时间 2 出现并在时间 3\
  \ 消失（这是我们在图 4-7 中底部的奶酪块空洞）。跨越数据切片的连通分量序列与另一种机器学习方法——单链层次聚类具有奇妙的关系，在那种方法中，每个高度层上的簇对应于特定切片上的连通分量。当两种技术使用相同的距离度量时，结果实际上是相同的；然而，关于数据结构，持续同态方法提供的信息比单链层次聚类的聚类图（dendrogram）更多。这意味着机器学习从业者可以选择最适合问题的技术，因为这两个选项都有它们自己的图表和统计检验。例如，对于非技术观众，单链层次聚类可能更合意，因为聚类图和热图对生物学家或社会科学家来说更为熟悉。\n\
  \n## 使用持续同态对网络进行比较\n\n在网络分析领域，持续同态可以是一种比较网络结构的有用方法，以查看不同网络是否具有相同的几何结构。让我们通过对模拟网络进行应用来进一步探索。在神经科学中，将\
  \ fMRI 或 PET 数据转换为网络结构是常见的，其中大脑的不同区域被转换为顶点，并根据活动模式（例如，一个区域的顺序激活，或在一项任务期间多个区域的共同激活）与大脑的其他区域连接。通常，感兴趣的结果涉及比较患者组，例如健康患者与患有特定神经或心理疾病的患者组，或者两个疾病组之间，以理解跨疾病的大脑激活模式的差异。\n\
  \n我们将探索使用持续同态比较此类两个网络。由于 fMRI 数据无法以开源形式轻松获取，我们将在 `igraph` 中模拟与大脑成像网络规模相近的网络；这将演示如何将这种方法应用于已转换为网络数据的成像数据。\n\
  \n`igraph` 包允许你模拟许多类型的网络数据，包括 Erdös–Renyi 图、无标度图和 Watts–Strogatz 图。我们将使用列表 4-3 中的脚本创建这些每种图。\n\
  \n```\n#simulate three graphs using the igraph package for further comparison\n\
  ```-library(igraph)\n\n#create an Erdos-Renyi graph\ng1<-erdos.renyi.game(30,0.3)\n\
  \n#create a scale-free graph\ng2<-sample_pa(30,power=2.5,directed=F)\n\n#create\
  \ a Watts-Strogatz graph\ng3<-sample_smallworld(2,5,3,0.3)\n\n#plot the three graphs\
  \ created\nplot(g1,main=\"Erdos-Renyi Graph\")\nplot(g2,main=\"Scale-Free Graph\"\
  )\nplot(g3,main=\"Watts-Strogatz Graph\")\n```\n\n列表 4-3: 用于统计比较的三种不同类型网络结构的脚本\n\
  \n列表 4-3 创建了三种不同类型的网络，稍后可以通过持续同态进行比较；它还可视化了网络，这应该产生与图 4-9 相似（但可能不完全相同）的结果。\n\n![Figure\
  \ 4-9: 三种模拟网络类型的绘图](img/f04009_m.png)\n\n图 4-9: 三种模拟网络类型的绘图。\n\n图 4-9 显示了非常不同类型的图。中间的无标度图包含一个枢纽，许多顶点与该枢纽连接但不与其他顶点连接。左侧的\
  \ Erdös–Renyi 图和右侧的 Watts–Strogatz 图有更多的相互连接，但 Watts–Strogatz 模型似乎具有更多将顶点连接成团的结构，而不是随机连接顶点。\n\
  \n让我们将持续同态应用于这些网络，并通过向列表 4-3 中添加以下内容来比较这些网络之间持续图的距离；再次，由于每个网络的仿真，你的结果可能会有所不同：\n\n\
  ```\n#load TDA package\nlibrary(TDA)\n\n#get adjacency matrices\nm1<-as.matrix(get.adjacency(g1))\n\
  m2<-as.matrix(get.adjacency(g2))\nm3<-as.matrix(get.adjacency(g3))\n\n#compute persistent\
  \ homology\nd1<-calculate_homology(m1,dim=2,format=\"cloud\")\nd2<-calculate_homology(m2,dim=2,format=\"\
  cloud\")\nd3<-calculate_homology(m3,dim=2,format=\"cloud\")\n\n#plot persistence\
  \ diagrams\nplot_persist(d1)\nplot_persist(d2)\nplot_persist(d3)\n\n#compute distances\
  \ among graphs\nw1<-phom.dist(d1,d2,limit.num=0)\nw2<-phom.dist(d1,d3,limit.num=0)\n\
  w3<-phom.dist(d2,d3,limit.num=0)\n```\n\n此添加从每个模拟图派生邻接矩阵并从该邻接矩阵计算持续图，然后通过零阶同调群之间的距离进行比较。此脚本应该产生类似于图\
  \ 4-10 的三个持续图（注意它们不会相同，因为每次运行都会产生略有不同的结果）。\n\n![Figure 4-10: 三种模拟网络类型的持续图绘制（从上到下：Erdös–Renyi、无标度和\
  \ Watts–Strogatz）](img/f04010_m.png)\n\n图 4-10: 三种模拟网络类型的持续图绘制（从上到下：Erdös–Renyi、无标度和\
  \ Watts–Strogatz）。\n\n\n\n\n\n图 4-10 显示了每种网络类型中发现的不同拓扑特征。Watts–Strogatz 网络和 Erdös–Renyi\
  \ 图都产生了许多较大的零阶同调特征（点），而无标度图具有各种尺寸的零阶同调特征。无标度图没有高阶同调特征，而另外两幅图具有一阶同调特征（三角形），尽管它们非常接近对角线（这表明它们可能是噪声）。直接位于对角线上的点是仅出现在数据切片中的特征；点离对角线越远，它在数据中存在的时间越长。对于我们的这三个模拟网络，仅通过持久性图很难判断无标度图和\
  \ Watts–Strogatz 图与 Erdös–Renyi 图是否存在显著差异。\n\n我们可以向脚本中添加内容，为 Erdös–Renyi 持久性图推出一个零分布，并使用特殊的距离度量\
  \ `Wasserstein distance`，对 Erdös–Renyi 持久性图与无标度图、以及 Watts–Strogatz 持久性图之间的结构差异进行统计检验：\n\
  \n```\n#get Wasserstein distance between random graphs with the same structure\n\
  ww<-rep(NA,100)\n\nfor (i in 1:100){\n  g1<-erdos.renyi.game(30,0.3)\n  g2<-erdos.renyi.game(30,0.3)\n\
  \  m1<-as.matrix(get.adjacency(g1))\n  m2<-as.matrix(get.adjacency(g2))\n  d1<-calculate_homology(m1,dim=2,format=\"\
  cloud\")\n  d2<-calculate_homology(m2,dim=2,format=\"cloud\")\n  ww[i]<-phom.dist(d1,d2,limit.num=0)\n\
  }\n\n#compute 95% confidence intervals from the simulated null distribution\nquantile(ww,c(0.025,0.975))\n\
  ```\n\n该脚本从构建原始持久性图的相同分布创建了 Erdös–Renyi 持久性图的零分布；由于模拟部分的随机性，你的结果可能会有所不同。我们零分布的分位数提供了\
  \ `(0.91, 8.36)` 的置信区间，这包含了许多小于 Erdös–Renyi 图与 Watts–Strogatz 图持久性图之间距离（`23.59`）以及\
  \ Erdös–Renyi 图与无标度图持久性图之间距离（`39.78`）的距离。因此，我们可以得出 Watts–Strogatz 图和无标度图的结构不是随机的。每个图中都存在显著的结构成分。\n\
  \n这种类型的模拟在测试来自 fMRI 和 PET 研究的脑网络持久性图之间的差异时非常有用，而且在 `R` 中很容易实现。这种方法也适用于具有假设底层结构的其他网络，例如社交网络或电网。许多其他类型的网络分析工具也可用于比较图结构，例如局部和全局指标（包括图半径和直径、度分布、聚类图系数等），而其中许多比较目前尚未被充分探索。\n\
  \n## 总结\n\n在本章中，我们过滤了加权网络，以理解网络指标如何根据权重的删除而发生变化。然后，我们从网络数据构建了单纯复形，以利用多种拓扑工具，包括度指标的扩展、欧拉示数以及一种名为持久同调的基于过滤的算法，它可以比较网络。在下一章中，我们将从网络科学转向距离几何，探索不同的测量选择如何影响监督和无监督学习算法。\n\
  \n# 5 数据科学中的几何\n\n![](img/chapterart.png)\n\n在本章中，我们将探索几何的几种工具：我们将研究距离度量及其在 `k`-最近邻算法中的应用；我们将讨论将高维数据映射到可能弯曲的低维流形的流形学习算法；我们还将看到将分形几何应用于股市数据。本章的动机之一源于\
  \ `流形假设`，该假设认为真实数据的自然维度低于采集数据的维度。也就是说，一个具有 20 个变量的数据集（即具有 20 个变量）。\n\n## 数据中的距离度量简介\n\
  \n许多机器学习算法依赖距离度量，正如我们之后将看到的。`距离度量`提供了点或对象之间的测量。在平整的纸上使用尺子这相对简单，如图 5-1 所示。\n\n```\n\
  (Figure 5-1: A plot of points on a sheet of paper)\n```\n\n然而，在其他情况下，两点之间的距离要复杂一些。考虑在社区中从一栋房子走到另一栋房子，如图\
  \ 5-2 所示。\n\n```\n(Figure 5-2: A plot of points on a sphere)\n```\n\n除非能够穿过邻居房屋而不遇到外墙和内墙（更不用说不满的邻居了），否则无法在房屋之间绘制给出直接路线的直线或测地线，如你在图\
  \ 5-3 中所示。\n\n```\n(Figure 5-3: A plot of houses in a neighborhood, where one is\
  \ walking between two houses)\n```\n\n相反，更实际的做法是沿着人道道（图 5-5）。\n\n\n\n\n\n![图 5-5:\
  \ 社区中房屋的图，人们在房屋之间的人行道上行走](img/f05005.png)\n\n图 5-5: 社区中房屋的图，人们在房屋之间的人行道上行走\n\n距离通常是离散的，而不是连续的，或者位于具有曲率的流形上。理解数据点所处空间的几何结构，可以很好地指示何种距离度量适用于这些数据。在下一节中，我们将介绍机器学习中一些常见的距离度量，然后在随后的章节中，将这些距离应用于\
  \ `k`-NN 算法和降维算法。\n\n## 常见距离度量\n\n考虑到测量距离的细微差别，理解机器学习中用到的一些常用距离度量是非常重要的，包括我们在第 4\
  \ 章中简要遇到的一种（Wasserstein 距离，用于比较持续同调结果）。距离度量有无限多个，且某些距离度量带有参数可以产生无限种变体。因此，我们无法涵盖机器学习中可能遇到的所有距离度量。我们省略了一些在推荐系统中很有用的度量（例如余弦距离），因为它们在拓扑数据分析或网络分析应用中是不常见的指标。我们将探索一些更常用的指标；如果你感兴趣进一步探索，建议你研究`度量几何`（metric\
  \ geometry）领域。\n\n### 模拟小型数据集\n\n在开始探索常见距离度量之前，让我们通过列表 5-1 模拟一些数据。\n\n```r\n#创建数据\n\
  a<-rbinom(5,4,0.2)\nb<-rbinom(5,1,0.5)\nc<-rbinom(5,2,0.1)\nmydata<-as.data.frame(cbind(a,b,c))\n\
  \n#创建绘图\nlibrary(scatterplot3d)\nscatterplot3d(a,b,c,main=\"Scatterplot of 3-Dimensional\
  \ Data\")\n```\n\n列表 5-1: 模拟并绘制小型数据集的脚本\n\n该脚本创建一个包含三个变量的数据集，并在三维空间中绘制点。这应该产生一个点位于三个轴上的图（图\
  \ 5-6）。\n\n![图 5-6: 五个点的图，所有点都在变量 a、b 和 c 定义的轴上](img/f05006.png)\n\n图 5-6: 五个点的图，所有点都在变量\
  \ `a`、`b` 和 `c` 定义的轴上\n\n该数据集包含了列表 5-2 所示的点，我们将用它们来计算点之间的距离。\n\n```r\n> mydata\n\
  \  a b c\n1 2 1 0\n2 0 0 1\n3 1 0 0\n4 0 0 0\n5 3 0 0\n```\n\n列表 5-2: 模拟数据集中五个点的矩阵，带有随机变量\
  \ `a`、`b` 和 `c`\n\n现在我们已经生成了一个数据集，让我们来看看一些可以用于数据集中点对之间距离的标准距离度量。R 自带了一个实用的包，称为 `stats`（随\
  \ R 基础安装提供），可以通过 `dist()` 函数计算用于数据的一些常用距离度量。\n\n### 使用基于范数的距离度量\n\n我们将考虑的第一类距离是相关的。函数或向量的`范数`（norm）是该函数或向量“长度”的测量。范数涉及将距离差进行幂，然后对结果应用该幂的根。。例如，对于点之间的`欧几里得距离`（Euclidean\
  \ distance），在对结果取平方根之前会对差异的平方求和。对于单个向量（即单个数据点），范数是到原点的加权距离，其中轴相互交叉。你可以将其想为从原点到被测点的直线的长度。回到我们的点散点图，这可能会像图\
  \ 5-7 所示绘制。\n\n![图 5-7: 五个点的图，有一条直线指向集合中的一个点](img/f05007.png)\n\n图 5-7: 五个点的图，有一条直线指向集合中的一个点\n\
  \n用于测量点之间度量距离的最常用的范数可能是前面提到的欧几里得距离，由 L² 范数给出，定义为点之间平方距离的平方根，其中 `L` 是向量（或向量）的占位符，指数是范数的幂（此处为\
  \ 2）。这是高中几何课上通常的距离，也被称为`勾股距离`（Pythagorean distance）。我们在图 5-4 中见过它，它显示了房屋之间最短距离的直线（像鸟在房屋上方飞行）。统计学家在回归算法中计算平方误差时通常使用欧几里得距离度量的平方；由于我们在这里不深入探讨的原因，使用欧几里得距离的平方是非常自然的。\n\
  \n与 L² 范数相关的是 L¹ 范数或`曼哈顿距离`（Manhattan distance）。曼哈顿距离的计算与图 5-5 所示的社区示例非常相似。曼哈顿距离定义为沿轴点差异之和。假设我们有两个点\
  \ (0, 1) 和 (1, 0)，这可能代表患者在疾病模型中感兴趣的基因中是否存在突变。曼哈顿距离是 (0 + 1) + (1 + 0)，即所有轴点差异的总和。在这个例子中，我们发现曼哈顿距离为\
  \ 2。\n\n这种度量在处理计数数据或其他离散数据格式时非常有用，例如本节早些生成的数据集。图 5-5 展示了这种距离计算，其中人需要沿着南北和东西方向的街道行走。\n\
  \n曼哈顿距离和 L¹ 范数经常出现在 Lasso 和弹性网回归的应用中，它被用于将位于原点一定距离内的系数 系设置为 0，从而执行变量选择并创建稀疏模型。这在独立变量集维度很高的情况下（例如基因组数据）非常有用。\n\
  \nL¹ 范数和 L² 范数的推广是`闵可夫斯距离`（Minkowski distance），它将范数从 L³ 范数推广到 L∞ 范数。L∞ 范数是基于范数的距离另一个特例，被称为`切比雪夫距离`（Chebyshev\
  \ distance）。在数学上，切比雪夫距离是沿任何轴的最大距离。它通常用于涉及机械或自主系统（如无人机）规划移动的问题。\n\n随着范数维度的增加，闵可夫斯距离值通常减少并稳定。因此，高维范数的闵可夫斯距离可以作为距离平滑器，限制曼哈顿或欧几里得距离计算中出现的异常或巨大的距离计算。闵可夫斯距离确实实施了几个条件，包括零向量的长度为零、对向量应用正标量不会改变向量的方向，以及两点之间的最短距离是直线（称为*三角形不等式条件*）。在\
  \ R 的 `dist()` 函数中，范数的维度由参数 `p` 给出，其中 `p=1` 对应曼哈顿距离，`p=2` 对应欧几里得距离，以此此类推。\n\n\n\n\
  \n曼顿距离的一种特殊扩展是`Canberra distance`，它是 $L¹$ 范数的加权和。从技术上说，Canberra 距离的计算方法是：找到点对之间距离的绝对值，并除以该点对绝对值之和，然后对所有点对的结果进行求和。在处理离群值、入侵检测或混合类型预测变量（连续和离散测量值）时，它可以是一个非常有用的距离度量标准。图\
  \ 5-7 中的示例点可能不是统计学上的离群值，但它确实位于数据空间中与其他模拟点不同的部分。\n\n让我们运行这些距离计算，并在我们在在本节早些模拟的数据集上比较结果；将以下内容添加到代码列表\
  \ 5-1 中的代码中：\n\n```R\n#run distance metrics on example dataset\nd1<-dist(mydata,\"\
  euclidean\",upper=T,diag=T)\nd2<-dist(mydata,\"manhattan\",upper=T,diag=T)\nd3<-dist(mydata,\"\
  canberra\",upper=T,diag=T)\nd4<-dist(mydata,\"minkowski\",p=1,upper=T,diag=T)\n\
  d5<-dist(mydata,\"minkowski\",p=2,upper=T,diag=T)\nd6<-dist(mydata,\"minkowski\"\
  ,p=10,upper=T,diag=T)\n```\n\n这段代码为我们的示例数据集计算了欧几里得距离、曼顿距离、Canberra 距离和 Minkowski\
  \ 距离的指标。观察表 5-1 所示模拟数据集中点对之间的欧几里得测量值，由于计算欧几里得距离涉及平方根，我们看到许多点对的值具有许多小数位。\n\n表 5-1：代码列表\
  \ 5-2 矩阵中点对之间的欧几里得距离计算\n\n| **Euclidean** | **1** | **2** | **3** | **4** | **5**\
  \ |\n| --- | --- | --- | --- | --- | --- |\n| **1** | 0 | 2.44949 | 1.414214 | 2.236068\
  \ | 1.414214 |\n| **2** | 2.44949 | 0 | 1.414214 | 1 | 3.162278 |\n| **3** | 1.414214\
  \ | 1.414214 | 0 | 1 | 2 |\n| **4** | 2.236068 | 1 | 1 | 0 | 3 |\n| **5** | 1.414214\
  \ | 3.162278 | 2 | 3 | 0 |\n\n转向曼顿距离（表 5-2），点对之间的距离变成了整数，因为计算涉及沿分离点之间每个轴的离散步长。\n\
  \n表 5-2：代码列表 5-2 矩阵中点对之间的曼顿距离计算\n\n| **Manhattan** | **1** | **2** | **3** | **4**\
  \ | **5** |\n| --- | --- | --- | --- | --- | --- |\n| **1** | 0 | 4 | 2 | 3 | 2\
  \ |\n| **2** | 4 | 0 | 2 | 1 | 4 |\n| **3** | 2 | 2 | 0 | 1 | 2 |\n| **4** | 3 |\
  \ 1 | 1 | 0 | 3 |\n| **5** | 2 | 4 | 2 | 3 | 0 |\n\n正如预期的，Minkowski 距离计算在 `p=1`\
  \ 时匹配曼顿距离，在 `p=2` 时匹配欧几里得距离。在表 5-3 中，你可以看到 `p=1` 的 Minkowski 距离。\n\n表 5-3：代码列表 5-2\
  \ 矩阵中点对之间的 Minkowski 距离计算\n\n| **Minkowski `p=1`** | **1** | **2** | **3** | **4**\
  \ | **5** |\n| --- | --- | --- | --- | --- | --- |\n| **1** | 0 | 4 | 2 | 3 | 2\
  \ |\n| **2** | 4 | 0 | 2 | 1 | 4 |\n| **3** | 2 | 2 | 0 | 1 | 2 |\n| **4** | 3 |\
  \ 1 | 1 | 0 | 3 |\n| **5** | 2 | 4 | 2 | 3 | 0 |\n\nCanberra 距离与曼顿距离产生了一些相似且重叠的值。然而，由于表\
  \ 5-4 所示，由于距离计算中的加权部分，某些距离是不同的（特别是涉及点 2 或点 3 的点对）。\n\n表 5-4：代码列表 5-2 矩阵中点对之间的 Canberra\
  \ 距离计算\n\n| **Canberra** | **1** | **2** | **3** | **4** | **5** |\n| --- | ---\
  \ | --- | --- | --- | --- |\n| **1** | 0 | 4 | 2 | 3 | 2 |\n| **2** | 4 | 0 | 2\
  \ | 1 | 4 |\n| **3** | 2 | 2 | 0 | 1 | 2 |\n| **4** | 3 | 1 | 1 | 0 | 3 |\n| **5**\
  \ | 2 | 4 | 2 | 3 | 0 |\n\n\n\n这段代码将列平均值点添加到原始数据集中，以检查数据的“中间”在三维空间中应该位于哪里；代码生成的图应与图\
  \ 5-8 类似。\n\n检查图 5-8 并将其与图 5-6 进行比较，我们可以看到有一个点被放置在轴之外，该点似乎在五个点中占据了中心位置。寻找数据集的中心位置有助于许多数据科学任务，包括寻找隐性离群值（即在任何单个变量上没有极端值，但距离多变量数据集中大多数点的离群值）以及计算多变量统计量。正如我们的马拉诺比（Mahalanobis）结果所示，某些点比其他点更接近这个中心位置；这些是我们数据集中的第\
  \ 3 点和第 4 点，它们距离原点较近。\n\n![Figure 5-8: 列表 5-2 矩阵中单个点以列平均值为中心点的马拉诺比距离图，其中列平均值点显示在轴外](img/f05008.png)\n\
  \n图 5-8: 列表 5-2 矩阵中单个点以列平均值为中心点的马拉诺比距离图，其中列平均值点显示在轴外\n\n这些距离差异出现在许多机器学习应用中，我们将在本章稍后部分通过将这些距离应用于\
  \ `k`-最近邻问题，来看看距离是如何影响机器学习的性能和结果的。性能可能会随着度量指标选择的不同而发生巨大变化，使用错误的指标可能会误导模型结果和解释。\n\
  \n## 比较图表、形状和概率分布\n\n基于范数的距离度量不是机器学习中可能的一类度量。正如我们在第 4 章中看到的，可以计算点以外的对象之间的距离，例如持久性图。简而言之，这些类型的度量衡量的是概率分布之间的差异。我们已经简要地使用了其中一种，即沃瑟斯坦距离（Wasserstein\
  \ distance），来比较持久性图分布。现在让我们仔细观察。\n\n### 沃瑟斯坦距离\n\n通俗来说，`Wasserstein distance` 比较堆叠在两个分布中的概率权重堆。它通常被称为“推土距离”（earth-mover\
  \ distance），因为沃瑟斯坦距离衡量了将一个分布的概率堆移动以转换为比较分布所需的成本和努力。对于具有更高数学水平的读者，`p` 次沃瑟斯坦距离可以通过对联合分布的边际分布的\
  \ `p` 次方取期望值、在这些随机变量的所有联合概率分布中寻找下界，并对结果开 `p` 次方来计算。然而，这些细节超出了读者的预期，我们在探索这一指标时将坚持使用推土距离的直觉。让我们可视化两个土堆的分布，以建立关于这一指标背后的直直觉（图\
  \ 5-9）。\n\n![Figure 5-9: 两个土堆的分布，类似于可以使用沃瑟斯坦距离度量比较的概率密度函数类型](img/f05009.png)\n\n\
  图 5-9: 两个土堆的分布，类似于可以使用沃瑟斯坦距离度量比较的概率密度函数类型\n\n图 5-9 中的堆 1 在左侧有一大堆土，如果我们想把堆 1 的土堆分布转换为堆\
  \ 2，就需要将这些土铲到右侧的土堆中。我们的推土机必须移动大量的土才能将堆 1 转换为堆 2。然而，如果我们的堆 2 的土堆分布更接近堆 1，如图 5-10\
  \ 所示，我们的推土机将堆 1 转换为堆 2 所需的工作将会更少。\n\n![Figure 5-10: 两个土堆的分布，类似于可以使用沃瑟斯坦距离度量比较的概率密度函数类型，衡量了我们的推土机将堆\
  \ 1 转换为堆 2 所需的工作量](img/f05010.png)\n\n图 5-10: 两个土堆的分布，类似于可以使用沃瑟斯坦距离度量比较的概率密度函数类型，衡量了我们的推土机将堆\
  \ 1 转换为堆 2 所需的工作量\n\n从分布 1 到分布 2，你可以想象有人在铲土。铲土的量对应于沃瑟斯坦距离。非常相似的概率密度函数将具有较小的沃瑟斯坦距离；非常不相似的将具有较大的沃瑟斯坦距离。\n\
  \n因此，沃瑟斯坦距离可以是比较概率分布的一个很好的指标——比较理论分布与样本分布以查看它们是否匹配，比较多个样本分布以查看它们是否匹配。虽然我们不会在这里深入，但某些分布——包括计数数据、是/否数据甚至是机器学习输出的结构——可以通过其他度量进行比较。现在，让我们看看另一种比较概率分布的方法，这次是针对离散分布。\n\
  \n### 熵\n\n一类常见的距离度量涉及一种被称为 `entropy` 的属性。信息熵由概率密度函数的负对数定义，衡量了每个点的非随机性。通过理解分布每个值包含多少信息，可以比较分布之间的差异。这对于比较概率函数或机器学习算法的输出是一个实用的工具，还可以推导出非参数统计检验。\n\
  \n二项分布经常出现在数据科学中。我们可能认为随机客户对两个界面设计没有偏好（在 A/B 测试中 50% 偏好 A，50% 偏好 B）。我们可以估计有多少 10\
  \ 个、20 个或 1 万客户偏好 A，并将其与提供反馈的实际客户进行比较。一种假设可能是我们有不同的客户群体，其中一个非常小。当然，在实践中，我们不知道客户群体的实际偏好分布，并且可能没有足够的数据通过比例检验来比较分布。利用指标有助于推检验。\n\
  \n为了更直观地理解这一点，让我们用列表 5-3 中的代码模拟两个二项概率分布。\n\n```r\n# 从不同的二项概率分布中采样\na<-rbinom(1000,5,0.1)\n\
  b<-rbinom(1000,5,0.4)\n\n# 创建概率密度图\nplot(density(b),ylim=c(0,2),main=\"概率分布比较\"\
  )\nlines(density(a),col=\"blue\")\n```\n\n列表 5-3: 模拟不同二项概率分布的脚本\n\n图 5-11 显示这些二项分布具有非常不同的密度函数，信息存储在分布的不同部分。\n\
  \n![Figure 5-11: 两个二项分布的密度图](img/f05011.png)\n\n图 5-11: 两个二项分布的密度图\n\n\n\n黑色曲线分布\
  \ `b` 相比于分布 `a` 在更多数值上包含了更广泛的信息，而分布 `a` 将其信息集中在接近零的地方（浅灰色曲线）。基于熵的指标可以量化分布 `a` 和\
  \ `b` 之间信息存储的差异。R 提供了许多工具和包，用于量化和比较信息熵。让我们进一步探索。\n\nR 中的 `philentropy` 包包含 46 种用于比较概率分布的不同指标，其中包含许多基于熵的指标。最流行的熵指标之一是\
  \ `Kullback–Leibler divergence`（ Kullback-Leibler 散度），它衡量两个概率分布之间的相对熵。从技术上说，`Kullback–Leibler\
  \ divergence` 衡量的是两个概率分布之间对数差异的期望（离散分布为求和，连续分布为积分）。因此，它是信息增益或损失的度量。这允许我们把信息熵转换为分布比较工具，当我们尝试比较未知或复杂的概率分布之间的差异时（而这些分布可能不适用于常用的统计工具），这种方法非常有用。\n\
  \n让我们通过回到两个二项分布 `a` 和 `b` 来培养直觉。我们将向 Listing 5-3 中添加以下内容，以计算两个分布之间的 `Kullback–Leibler\
  \ divergence`：\n\n```r\n#load package\nlibrary(philentropy)\n\n#calculate Kullback-Leibler\
  \ divergence\nkullback_leibler_distance(P=a,Q=b,testNA=T,unit=\"log2\",epsilon=1e-05)\n\
  ```\n\n此代码计算了 Listing 5-3 中生成的两个二项分布样本的 `Kullback–Leibler divergence`。在这组模拟数据中，Kullback–Leibler\
  \ divergence` 为 398.5428；这些分布的另一个模拟可能会产生不同的散度。然而，通过非参数检验，可以将此散度值与一个分布的随机误差进行比较，以查看分布\
  \ `a` 和 `b` 之间是否存在统计学显著差异。我们可以向脚本中添加以下内容，使用熵差异创建非参数检验：\n\n```r\n#create a nonparametric\
  \ test\n#create a vector to hold results from the simulation\ntest<-rep(NA,1000)\n\
  \n#loop to draw from one of the binomial distributions to generate\n#a null distribution\
  \ for one of our samples\nfor (i in 1:1000){\n  new<-rbinom(1000,5,0.1)\n  test[i]<-kullback_leibler_distance(P=a,Q=new,testNA=T,unit=\"\
  log2\",epsilon=1e-05)\n}\n\n#obtain the cut-off score for 95% confidence intervals,\
  \ corresponding\n#to values above/below which a sample would be considered\n#different\
  \ than the null distribution\nquantile(test,c(0.025,0.975))\n```\n\n该测试的置信区间为 427–475，这是预期的，因为分布\
  \ `a` 和 `b` 具有不同的值和范围。绘制 Figure 5-12 中的最后一个分布显示，新分布与 `a` 的匹配度远高于 `b`。\n\n![Figure\
  \ 5-12: Three binomial distributions’ density functions plotted for comparison,\
  \ with two coming from samples of the same distribution](img/f05012.png)\n\nFigure\
  \ 5-12: Three binomial distributions’ density functions plotted for comparison,\
  \ with two coming from samples of the same distribution 使用 `Kullback–Leibler divergence`，我们确定\
  \ `a` 和 `b` 在统计上是不同的。如果我们看到的置信范围包含 422，我们将认为 `a` 和 `b` 可能来自同一个总体分布。实践中存在比例检验等统计检验来比较二项分布，但某些离散分布或样本没有简单的比较方法（例如卷积神经网络分类器的预测分布比较）。\n\
  \n### 形状比较\n\n正如我们在 Chapter 4 中所示，点集和形状（如持久性图）可能是重要的。接下来的将处理这个问题。让我们从 Figure 5-13\
  \ 中的示例开始。\n\n![Figure 5-13: Two circles with radii](img/f05013.png)\n\nFigure 5-13:\
  \ Two circles with radii 现在，让我们想象一下公园里的这两条路径；你可以在 Figure 5-14 中看到。\n\n![Figure 5-14:\
  \ Dog following a path](img/f05014.png)\n\nFigure 5-14: Dog following a path 在某些点，主人和狗很近，一根短绳足以连接他们。然而，随着他们逆时针移动，主人和狗之间的距离在增大；你可以在\
  \ Figure 5-15 中看到这一点。\n\n![Figure 5-15: Dog and owner with increasing leash](img/f05015.png)\n\
  \nFigure 5-15: Dog and owner with increasing leash 比较形状点之间距离的历史性重要指标是 `Fréchet distance`（Fréchet\
  \ 距离）。从多边形构建网格图，并计算 minmax 路径以找到两条路径可能之间的最大距离。最严格的要求产生了所谓的 `homotopic` Fréchet distance，它在许多机器人问题中都有应用。我们将在\
  \ Chapter 8 中回到同调理论。\n\n目前，用更通俗的话来说，Fréchet distance 被称为“遛狗距离”，它在分析中有许多用途。它不仅可以用于测量曲线上点之间的最大距离，还可以用于测量形状点之间的总距离。许多\
  \ R 包包含了计算 Fréchet 距离现有版本的函数，包括在以下示例中使用的 `TSdist` 时间序列包。在这个包中，两个时间序列由 `ARMA(3, 2)`\
  \ 分布生成，其中 Series 3 包含 100 个时间点，Series 4 包含 120 个时间点。时间序列对于追踪患者组的疾病进展、跟踪股市随时间的变化以及跟踪买家行为非常重要。\n\
  \n让我们使用 Listing 5-4 中的代码加载这些由包生成的时间序列并绘制它们，以可视化潜在的差异。\n\n```r\n#load package and\
  \ time series contained in the TSdist package\nlibrary(TSdist)\ndata(example.series4)\n\
  data(example.series3)\nmy1<-example.series4\nmy2<-example.series3\n\n#plot both\
  \ time series\nplot(my1,main=\"Time Series Plots of Series 4\")\nplot(my2,main=\"\
  Time Series Plots of Series 3\")\n```\n\nListing 5-4: A script that loads and examines\
  \ two time-series datasets Figure 5-16 显示了两个随时间变化的具有明显高低点的时间序列。\n\n![Figure 5-16:\
  \ Plots of the two example time series](img/f05016.png)\n\nFigure 5-16: Plots of\
  \ the two example time series\n\n\n\n\n注意时间序列之间的重叠并不完美，我们预计比较结果会显示这些时间序列之间存在某些差异。通过\
  \ `Fréchet` 距离，可以测量时间序列之间的最大/最小偏差（最大/最小引线长度）以及整个比较集上的偏差总和。我们将通过在脚本中添加以下代码，对序列 3\
  \ 和序列 4 检查这两项指标：\n\n```r\n#calculate Frechet distance\ndis1<-FrechetDistance(my1,my2,FrechetSumOrMax=\"\
  sum\")\ndis2<-FrechetDistance(my1,my2,FrechetSumOrMax=\"min\")\ndis3<-FrechetDistance(my1,my2,FrechetSumOrMax=\"\
  max\")\n```\n\n这段代码计算了时间序列之间 Fréchet 距离的最小值、最大值总和。对于时间序列曲线之间的距离之和，结果应该是 402.0；时间序列曲线点之间的最大距离为\
  \ 13.7；时间序列曲线点之间的最小距离为 0.03。这表明时间序列在某些比较点上的值大致相同，而在另一些点上的值差异巨大。时间序列曲线之间的距离之和将收敛于跨越序列的连续时间积分；这种计算可以作为使用离散且相当快速近似计算函数之间面积的良好工具。\n\
  \n然而，除了 `Fréchet` 距离外，还有其他比较形状的方法，这些方法有时更好。让我们再次回到那两个圆，移动它们使其相交，如图 5-17 所示。\n\n\
  ![图 5-17：两个相交圆的绘图](img/f05017r.png)\n\n图 5-17：两个相交圆的绘图\n\n我们可以考虑每个圆上的点，就像我们测量 `Fréchet`\
  \ 距离那样。考虑圆 B 上的一个点以及它在圆 A 上最近的点（如图 5-17 所示）。圆 B 上的每个点在圆 A 上都有一个最近的点，这些点构成了一个最近点集。在图\
  \ 5-17 中选中的点是一组特殊的点。它们是我们最近点集中距离最远的任意两个点。这意味着我们从一个圆跳到另一个圆时需要经过的最远距离就发生在这两个点上。这种距离被称为\
  \ `Hausdorff distance`（豪斯夫距离），在早期计算机视觉和图像匹配任务中有许多应用。如今，它主要用于序列匹配、图匹配和其他离散对象匹配任务。\n\
  \n然而，`Hausdorff distance` 的局限性之一是被比较的集合必须存在相同的度量空间中。因此，虽然我们可以比较圆上的点，但无法直接用 `Hausdorff`\
  \ 距离比较圆上的点与球面上的点，或者比较欧几里得平面上的点与正曲率球面上的点。被比较的两个对象必须处于同一个度量空间中。\n\n幸运的是，这种难题有一个解决方案。当两个度量空间映射到单个度量空间，同时保留每个空间内点之间的原始距离（称为`等距嵌入`）时，我们可以简单测量这两个度量空间的最远最短距离。因此，我们可以球面及其点投影到切空间，以便与其他欧几里得空间进行比较。或者我们可以将两个对象嵌入到高维空间，类似于内核应用中的做法。这种\
  \ `Hausdorff distance` 的扩展被称为 `Gromov–Hausdorff distance`（格罗莫-豪斯夫距离）。\n\n让我们对这种度量建立一些直觉。假设我们有一个三角形和一个四面体，如图\
  \ 5-18 所示。\n\n![图 5-18：存在不同维度欧几里得空间中的三角形和四面体](img/f05018r.png)\n\n图 5-18：存在不同维度欧几里得空间中的三角形和四面体\n\
  \n图 5-18 中描述的问题的一个解决方案是将三角形带入三维欧几里得空间，并计算三维欧几里得空间中对象之间的距离。当三角形嵌入三维空间时，它的部分可能与四面体重叠，如图\
  \ 5-19 所示。\n\n![图 5-19：三角形和四面体都映射到三维欧几里得空间](img/f05019r.png)\n\n图 5-19：三角形和四面体都映射到三维欧几里得空间\n\
  \n现在我们可以计算这两个对象最近点集中的最远点集，在这个例子中，这可能发生在三角形或四面体的一个远端。\n\nR 有一个很好的包用于计算 `Gromov–Hausdorff\
  \ distances`（`gromovlab`），因此我们可以轻松地在 R 中实现这种距离度量。首先，让我们用列表 5-5 中的代码从二维圆盘模拟一个小样本。\n\
  \n```r\n#create two-dimensional disc sample\na<-runif(100,min=-1,max=1)\nb<-runif(100,min=-1,max=1)\n\
  \n#create two-dimensional disc sample\na<-runif(100,min=-1,max=1)\nb<-runif(100,min=-1,max=1)\n\
  \n#create two-dimensional disc sample\na<-runif(100,min=-1,max=1)\nb<-runif(100,min=-1,max=1)\n\
  \n#create two-dimensional disc sample\na<-runif(100,min=-1,max=1)\nb<-runif(100,min=-1,max=1)\n\
  \n#create two-dimensional disc sample\na<-runif(100,min=-1,max=1)\nb<-runif(100,min=-1,max=1)\n\
  \n#create two-dimensional disc sample\na<-runif(100,min=-1,max=1)\nb<-runif(100,min=-1,max=1)\n\
  \n#create circle from uniform distribution and restrict points within the#circle\n\
  d<-a²+b²\nw<-which(d>1)\nmydata<-cbind(a,b)\nmydata<-mydata[-w]\n\n#plot sample\n\
  plot(mydata,main=\"2-Dimensional Disc\",ylab=\"y\",xlab=\"x\")\n```\n列表 5-5：从二维圆盘以检查\
  \ Gromov–Hausdorff 距离的脚本\n\n这在绘图时应该给出一个大致的圆形状；查看图 5-20。\n\n![图 5-20：取二维圆的样本](img/f05020.png)\n\
  \n图 5-20：取二维圆的样本\n\n现在，让我们向列表 5-5 添加代码，从生成我们二维圆盘的相同分布中模拟一个相同大小的样本：\n\n```r\n#create\
  \ a uniform sample from a line segment\nx<-sort(runif(dim(as.data.frame(mydata))[[1]],min=-1,max=1))\n\
  ```\n\n我们添加的代码提供了一个线段。这给了我们两个不同维度的欧几里得空间。现在，我们可以计算每个样本原生空间中点之间的距离（圆的二维欧几里得空间，线的一维欧几里得空间）。然后，通过添加以下代码，我们可以计算样本之间的\
  \ `Gromov–Hausdorff distance`：\n\n```r\n#load the package and calculate the distance\
  \ matrices for use in calculations\nlibrary(gromovlab)\nm1<-dist(as.matrix(mydata))\n\
  m2<-dist(as.matrix(x))\n\n#calculate distance metric and compare distances with\
  \ Gromov-Hausdorff\ngromovdist(m1,m2,\"lp\",p=2)\n```\n\n这段代码允许我们比较样本点之间的距离矩阵。对于这个随机样本，`Gromov–Hausdorff\
  \ distance`为 5.8。我们可以像列表 5-3 所示，基于我们的度量模拟非参数检验，以帮助我们判断圆和线的嵌入在统计学上是否相同。改变度量可能会可能会嵌入之间的显著差异或嵌入的质量，正如我们在本章早期比较\
  \ `Canberra`、`Manhattan` 和 `Euclidean` 距离时看到的。感兴趣的读者鼓励尝试调整参数，建立自己的非参数检验，并观察圆和线样本的\
  \ `Gromov–Hausdorff distances` 结果的变化。\n\n\n\n\n`lp` 参数允许人们使用在本节之前检查的基于范数的指标。对于这次特定的比较，我们使用了欧几里得范数，因为两个样本都位于欧几里得空间，且摄入的距离矩阵是由欧几里得范数定义的。其他范数（如曼哈顿或切比雪夫范数）也是可能的，并且对于其他问题可能更好，该包能够处理图、树以及距离矩阵。关于此软件包需要注意的一点是算法会搜索所有可能的等距嵌入，因此对于某些问题，所需的计算时间和内存可能很大。\n\
  \n### 度量几何与 k-最近邻\n\n度量几何出现在许多算法中，包括 `k`-最近邻（``k`-`NN`）分析，该分析根据附近对象的分类来对观测值进行分类。理解这种方法的一种是考虑一个拥有不同学生圈子的高中食堂，如图\
  \ 5-21 所示。\n\n![图 5-21：具有三个不同学生圈子的高中食堂](img/f05021.png)\n\n图 5-21：具有三个不同学生圈子的高中食堂\n\
  \n在图 5-21 所示的食堂中，存在三个学生圈子：深灰色圈子、灰色圈子和浅灰色圈子。学生倾向于留在朋友附近，正如学生 A、B 和 C 所示。这些学生被他们的朋友围绕着，如果根据距离度量（如欧几里得距离或学生之间的地板砖数量）使用任意数量的离他们最近的学生对他们进行分类，将很准确地划分成学生圈子。\n\
  \n然而，有少数学生（例如学生 D 和 E）位于其他圈子附近或处于三个圈子之间。学生 E 可能是人气圈子（底部中央）的一部分，也是校队运动员圈子（左上）的一部分，而学生\
  \ D 可能是人气、校队运动员以及数学小组成员（右上）。取决于在将他们归类为圈子时考虑了多少位于 D 和 E 附近的学生，他们可能属于自己的主圈子，也被错误地重新分配到一个新圈子（他们可能符合该圈子，但没有考虑到他们的主圈子）。例如，最近的\
  \ 10 个学生可能会将学生 E 正确分配到人气组，而最近的 2 个学生则不会。\n\n因此，`k`-`NN` 方法依赖于邻域大小（在本例中，距离目标学生最近的学生数量）和定义哪些学生离目标学生最近的距离度量。让我们更仔细地观察距离度量如何影响\
  \ `k`-`NN` 分类的准确性。在一个具有三个影响分类的变量和三个噪声变量的模拟数据集（见列表 5-6\ninstall_local(\"~/Downloads/knnGarden.tar\"\
  )\n\n#创建数据\na<-rbinom(500,4,0.2)\nb<-rbinom(500,1,0.5)\nc<-rbinom(500,2,0.1)\nd<-rbinom(500,2,0.2)\n\
  e<-rbinom(500,1,0.3)\nf<-rbinom(500,1,0.8)\nclass<-a+e-d-rbinom(500,2,0.3)\nclass[class>=0]<-1\n\
  class[class<0]<-0\nmydata<-as.data.frame(cbind(a,b,c,d,e,f,class))\n\n#将数据划分为训练集和测试集（60%训练，40%测试）\n\
  s<-sample(1:500,300)\ntrain<-mydata[s,]\ntest<-mydata[-s,]\n\n#使用不同的距离和五个最近邻创建 KNN\
  \ 模型\nlibrary(knnGarden)\n\n# 欧几里得\nke<-knnVCN(TrnX=train[,-7],OrigTrnG=train[,7],TstX=test[,-7],\n\
  K=5,method=\"euclidean\")\naccke<-length(which(ke==test[,7]))/length(test[,7])\n\
  \n# 加伯拉\nkc<-knnVCN(TrnX=train[,-7],OrigTrnG=train[,7],TstX=test[,-7],\nK=5,method=\"\
  canberra\")\nacckc<-length(which(kc==test[,7]))/length(test[,7])\n\n# 曼哈顿\nkm<-knnVCN(TrnX=train[,-7],OrigTrnG=train[,7],TstX=test[,-7],\n\
  K=5,method=\"manhattan\")\nacckm<-length(which(km==test[,7]))/length(test[,7])\n\
  ```\n\n列表 5-6：一个通过不同距离指标和五个邻居通过 `k`-`NN` 分类生成并分类样本的脚本\n\n列表 5-6 创建了一个样本，然后通过不同的距离度量运行\
  \ `k`-`NN` 算法对点进行分类，包括曼哈顿、欧几里得和加伯拉距离。在这个特定的模拟中，所有距离都产生了相似的准确率（欧几里得距离 81%，曼哈顿距离 81%，加伯拉距离\
  \ 82%）。我们可以通过修改列表 5-6 包含 20 个最近邻居来扩大邻域：\n\n```bash\n#使用不同的距离指标和五个最近邻创建 KNN 模型\n\n\
  # 欧几里得\nke<-knnVCN(TrnX=train[,-7],OrigTrnG=train[,7],TstX=test[,-7],\nK=20,method=\"\
  euclidean\")\naccke<-length(which(ke==test[,7]))/length(test[,7])\n\n# 加伯拉\nkc<-knnVCN(TrnX=train[,-7],OrigTrnG=train[,7],TstX=test[,-7],\n\
  K=20,method=\"canberra\")\nacckc<-length(which(kc==test[,7]))/length(test[,7])\n\
  \n# 曼哈顿\nkm<-knnVCN(TrnX=train[,-7],OrigTrnG=train[,7],TstX=test[,-7],\nK=20,method=\"\
  manhattan\")\nacckm<-length(which(km==test[,7]))/length(test[,7])\n```\n\n此脚本修改了计算\
  \ `k`-`NN` 模型的函数，更改部分已**加粗**；我们将参数更改为 `K=20`。在这个特定的模拟数据集中，考虑 20 个最近邻时，分类准确率存在巨大差异。欧几里得和曼哈顿距离的准确率略低为\
  \ 78.5%，而加伯拉距离的准确率远为 57%。邻域大小对加伯拉距离的准确率影响很大，但对欧几里得和曼哈顿距离的影响较小。通常情况下，使用较大的邻居数量会平滑数据，类似于加权平均。然而，我们的曼哈顿和欧几里得运行并没有显示出这种平滑效应，并保持了原始的高性能。正如我们的示例所示，距离指标的选择对算法性能可能有很大影响，也可能影响很小。\n\
  \n`k`-`NN` 模型是与度量几何和邻域关系最紧密的模型之一，尽管许多其他方法依赖于距离指标或邻域大小。许多近期论文建议算法邻域定义的多尺度方法可以提高算法性能，包括在\
  \ `k`-`NN` 回归、深度学习图像分类以及持久图和单纯形算法（包括持久同调）中的应用，这一新兴领域近年来增长很大。\n\n# 流形学习\n\n\n\n\n\
  \n许多降维算法也涉及距离度量和 `k`-NN 计算。最常见的降维算法之一是`主成分分析`（`PCA`），它通过原始高维空间与低维目标空间之间的线性映射，帮助将高维数据处理到低维空间中。本质上，`PCA`\
  \ 寻找一组理想的线性基，以最少量的线性基来解释最大的方差（即尽可能包含与我们数据相关的大部分相关信息）；这允许我们丢弃数据空间中许多不包含太多相关信息的基。这有助于我们可视化存在于三维以上的数据；还能消除输入到模型中的预测变量之间的相关性。\n\
  \n然而，如前所述，`PCA` 假设数据存在于几何平坦的空间中并被映射到低维平坦空间。正如我们看到的，情况并非总是如此，`Euclidean` 度量得出的距离结果可能与其他距离度量不同。最近，许多尝试放宽假设并将降维推广到流形的尝试提供了一类新的降维技术，被称为`流形学习（`manifold\
  \ learning`）。`流形学习`允许映射到可能是弯曲的低维空间，并将 `PCA` 推广到包含除`Euclidean` 距离以外的其他度量。`流形（`manifold`）是一个局部欧几里得的空间，`Euclidean`\
  \ 空间是流形的一个例子，因此一些人将`流形学习`称为这种更通用框架的伞括。\n\n### 使用多尺度分析\n\n较老的流形学习算法之一是`多尺度分析`（`MDS`）。`MDS`\
  \ 考虑将点嵌入 `Euclidean` 空间中，使得点与点之间的距离（可以是 `Euclidean` 距离）尽可能地保持不变；这是通过最小化用户定义的代价函数来实现的。通过\
  \ `Euclidean` 定义距离和代价函数产生的结果与 `PCA` 相同。然而，在使用 `MDS` 时没有必要将自己限制在 `Euclidean` 距离上，许多其他度量可能更适合特定问题。让我们通过一个小型数据集和不同的距离矩阵作为我们\
  \ `MDS` 算法的输入来进一步探索此；请查看 Listing 5-7 中的代码。\n\n```\n#create data\na<-rbinom(100,4,0.2)\n\
  b<-rbinom(100,1,0.5)\nc<-rbinom(100,2,0.1)\nd<-rbinom(100,2,0.2)\ne<-rbinom(100,1,0.3)\n\
  f<-rbinom(100,1,0.8)\nmydata<-as.data.frame(cbind(a,b,c,d,e,f))\n\n#create distance\
  \ matrices using different distance metrics\nm1<-dist(mydata,upper=T,diag=T)\nm2<-dist(mydata,\"\
  minkowski\",p=10,upper=T,diag=T) \nm3<-dist(mydata,\"manhattan\",upper=T,diag=T)\n\
  ```\n\nListing 5-7: 一个生成示例数据集并从数据计算距离矩阵的脚本\n\n现在我们已经生成了一些数据并计算了三种不同的距离度量，让我们看看距离度量的选择如何影响\
  \ `MDS` 嵌入。让我们计算 `MDS` 嵌入并通过向 Listing 5-7 中添加内容来绘制结果。\n\n```\n#reduce dimensionality\
  \ with MDS to two dimensions\nc1<-cmdscale(m1,k=2)\nc2<-cmdscale(m2,k=2)\nc3<-cmdscale(m3,k=2)\n\
  \n#plot results\nplot(c1,xlab=\"Coordinate 1\",ylab=\"Coordinate 2\",\nmain=\"Euclidean\
  \ Distance MDS Results\")\nplot(c2,xlab=\"Coordinate 1\",ylab=\"Coordinate 2\",\n\
  main=\"Minkowski p=10 Distance MDS Results\")\nplot(c3,xlab=\"Coordinate 1\",ylab=\"\
  Coordinate 2\",\nmain=\"Manhattan Distance MDS Results\")\n```\n\n我们对 Listing 5-7\
  \ 的添加应该产生彼此看起来不同的图。在这个例中，图表（显示在 Figure 5-22 中）根据所使用的度量发生了剧烈变化，表明不同的距离度量会导致嵌入到不同的空间。\n\
  \n![Figure 5-22: MDS 结果并视图，随所选的距离度量而变化](img/f05022.png)\n\nFigure 5-22: MDS 结果并视图，随所选的距离度量而变化\n\
  \nFigure 5-22 中的图结果表明，`Minkowski` 距离产生的结果与 `Euclidean` 或 `Manhattan` 距离截然不同；许多点在\
  \ `Minkowski` own `MDS` 结果中聚集在一起，这表明它可能不像其他度量那样能区分点对。然而，`Euclidean` 和 `Manhattan`\
  \ 距离 `MDS` 结果之间的差异不那么显著，点分布得比我们的 `Minkowski` 距离情况分散得多。\n\n### 使用 Isomap 扩展多尺度分析\n\
  \n某些流形学习算法将 `MDS` 扩展到其他类型的空间和距离计算。`Isomap` 通过将距离矩阵替换为点之间的地线距离（geodesic distances）之一来扩展\
  \ `MDS`。这种用地线距离替换距离计算的方法允许使用除 `Euclidean` 距离以外的度量，并将 `PCA` 推广到允许可能是弯曲的低维空间。`流形`是一个局部欧几里得的空间，`Euclidean`\
  \ 空间是流形的一个例子，因此一些人将`流形学习`称为这种更通用框架的伞括。\n\n为了理解邻域的大小，我们将创建 5、10 和 20 个邻域：\n\n```\n\
  #create Isomap projections of the data in 5-6\nlibrary(vegan)\n\ni1<-scores(isomap(dist(mydata),ndim=2,k=5))\n\
  i2<-scores(isomap(dist(mydata),ndim=2,k=10))\ni3<-scores(isomap(dist(mydata),ndim=2,k=20))\n\
  \n#plot results\nplot(i1,xlab=\"Coordinate 1\",ylab=\"Coordinate 2\",main=\"K=5\
  \ Isomap Results\")\nplot(i2,xlab=\"Coordinate 1\",ylab=\"Coordinate 2\",main=\"\
  K=10 Isomap Results\")\nplot(i3,xlab=\"Coordinate 1\",ylab=\"Coordinate 2\",main=\"\
  K=20 Isomap Results\")\n```\n\n这段代码片段对 Listing 5-7 中的生成数据使用 `Euclidean` 距离应用 `Isomap`。可以使用其他距离度量并可能产生不同的结果，如\
  \ `MDS` 分析所示。`Isomap` 分析的结果表明，邻域的大小对决定结果起的作用很大，如 Figure 5-23 中每个坐标的刻度所示。\n\n![Figure\
  \ 5-23: Isomap 结果并视图，随所选的邻域数量而变化](img/f05023.png)\n\nFigure 5-23: Isomap 结果并视图，随所选的邻域数量而变化\n\
  \n\n\n\n\n`Locally linear embedding` (`LLE`) 是这种局部流形学习算法之一，也是最常用的流形学习算法之一。粗略来说，`LLE`\
  \ 从一个最近邻图开始，然后根据每个点的最近邻为每个点创建权重集。从那里开始，算法根据代价函数以及每个点最近邻权重集的保持性来计算映射。这使其能够保留数据中重要的几何信息，而这些信息存在于流形上相互相邻的点之间。\n\
  \n回到我们在 Listing 5-7 中的代码，让我们扩展代码并探索在不同邻居数量的情况下将 `LLE` 映射到二维空间。对于此包，你需要下载该包（[`mran.microsoft.com/snapshot/2016-08-05/web/packages/TDAmapper/README.html`](https://mran.microsoft.com/snapshot/2016-08-05/web/packages/TDAmapper/README.html））并本地安装它：\n\
  \n```\n#install package\nlibrary(devtools)\ninstall_local(\"~/Downloads/lle.tar\"\
  )\n\n#create LLE projections of the data generated in Listing 5-6\nlibrary(lle)\n\
  \nl1<-lle(mydata,m=2,k=5)\nl2<-lle(mydata,m=2,k=10)\nl3<-lle(mydata,m=2,k=20)\n\n\
  #plot results\nplot(l1$Y,xlab=\"Coordinate 1\",ylab=\"Coordinate 2\",main=\"K=5\
  \ LLE Results\")\nplot(l2$Y,xlab=\"Coordinate 1\",ylab=\"Coordinate 2\",main=\"\
  K=10 LLE Results\")\nplot(l3$Y,xlab=\"Coordinate 1\",ylab=\"Coordinate 2\",main=\"\
  K=20 LLE Results\")\n```\n\n这段代码将 `LLE` 算法应用于我们的数据集，并改变了算法计算中考虑的最近邻数量。让我们查看此数据集的图表，以理解最近邻在这个局部算法中的作用（Figure\
  \ 5-24）。\n\n![Figure 5-24: A side-by-side view of LLE results, which vary by number\
  \ of nearest neighbors](img/f05024.png)\n\n图 5-24: LLE 结果的并排视图，随最近邻数量的变化而变化\n\n\
  如图 Figure 5-24 所示，邻域大小极大地影响了 `LLE` 的结果以及新二维空间中点的分布。鉴于最近邻的数量影响了所保留邻域的大小，较高的值会导致局部性较低的\
  \ `LLE` 版本，将算法转换为更类似于全局类型的流形学习算法。在 `K=20` 时似乎出现了良好的分离，这比 `K=5` 的局部性小，但对于具有 100 个点的数据集来说，仍然是一个相当小的邻域。如果我们将\
  \ `K` 设置为 100，则存在一个完全全局算法，给出一个具有良好分离且点在整个新空间中分布的二维图；你可以在 Figure 5-25 中看到这一点。\n\n\
  \ ![Figure 5-25: A plot of LLE results using the entire sample as nearest neighbors](img/f05025.png)\n\
  \n图 5-25: 使用整个样本作为最近邻的 LLE 结果图\n\n其他局部流形学习算法也，其中一些允许像 `LLE` 的邻域大小那比例参数。如果你感兴趣，可以探索拉普拉斯特征映射（Laplacian\
  \ eigenmaps）、Hessian `LLE` 和局部切空间分析（local tangent space analysis）。\n\n## 使用 t 分布随机邻嵌入进行可视化\n\
  \n我们现在看到了局部算法如何通过定义邻域大小来捕捉全局属性。存在一些显式捕捉局部和全局属性的流形学习算法。其中最著名的算法之一是名为 `t-distributed\
  \ stochastic neighbor embedding` (`t-SNE`）的可视化工具。该算法有两个主要阶段：在高维空间点上创建概率分布，然后通过最小化两组分布之间的\
  \ Kullback–Leibler 散度，将这些分布与低维空间中的分布匹配。因此，该算法不是从点与之间的距离计算开始，而是侧重于匹配分布距离以找到最优空间。\n\
  \n`t-SNE` 并不是通过点的 `k` 个最近邻来定义邻域，而是通过内核对数据的带宽来定义邻域；这产生了一个名为 `perplexity`（困惑度）的参数，也可以改变它来理解邻域大小的作用。让我们回到\
  \ Listing 5-7 中生成的数据，看看它在实践中如何运作。添加以下代码：\n\n```\n#create t-SNE projections of the\
  \ data generated in Listing 5-7\nlibrary(Rtsne)\nlibrary(dimRed)\n\nt1<-getDimRedData(embed(mydata,\"\
  tSNE\",ndim=2,perplexity=5))\nt2<-getDimRedData(embed(mydata,\"tSNE\",ndim=2,perplexity=15))\n\
  t3<-getDimRedData(embed(mydata,\"tSNE\",ndim=2,perplexity=25))\n\n#plot results\n\
  plot(as.data.frame(t1),xlab=\"Coordinate 1\",ylab=\"Coordinate2\",\nplot(as.data.frame(t1),xlab=\"\
  Coordinate 1\",ylab=\"Coordinate2\",\nmain=\"Perplexity=5 t-SNE Results\")\nplot(as.data.frame(t2),xlab=\"\
  Coordinate 1\",ylab=\"Coordinate2\",\nmain=\"Perplexity=15 t-SNE Results\")\nplot(as.data.frame(t3),xlab=\"\
  Coordinate 1\",ylab=\"Coordinate2\",\nmain=\"Perplexity=25 t-SNE Results\")\n```\n\
  \n这段代码在数据集上运行 `t-SNE`，并改变 `perplexity` 参数。图表应该产生类似于 Figure 5-26 所示的结果，显示在低维空间中有更明显的聚集。\n\
  \n![Figure 5-26: A side-by-side view of LLE results, which vary by numberity](img/f05026.png)\n\
  \n图 5-26: LLE 结果的并排视图，随数量的变化而变化\n\n困 plexity 为 15 和 25 的图看起来非常相似，随着我们增加困惑度，低维空间中坐标的范围下降。在某些项目中，数据的更分散分布可能是很有用的。\n\
  \n总结，本章中的距离度量在机器学习应用中经常出现。特别是流形学习，可能涉及不同的度量选择、邻域大小以及数据映射到的空间类型。目前有许多优秀的教科书和论文详细涵盖了这些算法以及其他算法。然而，我们希望你已经对降维方法有了一个概述——特别是那些与度量几何紧密相关的方法。在继续之前，让我们考虑度量几何的最后一个用途。\n\
  \n## 分形\n\n另一种与度量几何相关的工具涉及几何对象中的一种自相似性，称为 `fractals`（分形）。本质上，分形在相同模式内具有相同模式内的模式，以此此类推。[Figure\
  \ 5-27 提供了一个示例。\n\n ![Figure 5-27: An example of a fractal. Note the self-similarity\
  \ of the patterns at different scales.](img/f05027.png)\n\n图 5-27: 分形的一个示例。注意不同尺度下模式的自相似性。\n\
  \n分形经常出现在自然和人造系统中。例如，海岸线、血管、音乐尺度、封闭空间内的流行传播、股市行为以及词频和排名，在不同尺度上都具有自相似属性。能够测量分形维允许我们更好地理解这些现象的自相似程度。现在有很多分形维估计器，但大多数依赖于通过某种迭代方法比较相邻点集的面积，来测量分形曲线下方面积的变化。\n\
  \n回到 Figure 5-27 中的分形，我们可以考虑添加方框来找到每次迭代曲线下的面积，然后比较所考虑尺度的相对值，如 Figure 5-28 所示。\n\n\
  ![Figure 5-28: An example of measuring area under a series of fractal curves at\
  \ scale](img/f05028.png)\n\n图 5-28: 在尺度下测量一系列分形曲线下方面积的示例\n\n\n\n\n\n既然我们已经对分形有了直观的理解，让我们让我们考虑分形维度指标的应用。股票市场以在一段时间内表现出某种程度的自相似性而闻名。理解市场波动性是明智投资的一个重要方面，而预测未来市场反转点（如崩盘）的方法之一就是观察自相似性的变化。琼斯工业平均指数（美国股市指数之一）或\
  \ `DJIA` 的收盘价可以免费免费下载。在这里，我们将考虑 2019 年 6 月至 2020 年 5 月期间的模拟每日收盘价（例如 `DJIA` 数据），这段期间正发生了新冠疫情的跌落。图\
  \ 5-29 显示了该期间的收盘价图表。\n\n![图 5-29：2019 年 6 月至 2020 年 5 月模拟 DJIA 收盘价图。注意从 2020 年 2\
  \ 月底开始的大幅跌落，此时新冠已成为全球性问题。](img/f05029new.png)\n\n图 5-29：2019 年 6 月至 2020 年 5 月模拟\
  \ DJIA 收盘价图。注意从 2020 年 2 月底开始的大幅跌落，此时新冠已成为全球性问题。\n\n如果我们正在预测未来的市场行为，我们将希望使用时间序列数据分析的工具进行分形分析，这超出了本书的范围。然而，通过将数据解析为每月序列并计算每个每月序列的分形维度，我们可以轻松地感受自相似性的变化。从那里，我们可以检查分形维度如何与其他波动性指标（如一个月内的收盘价范围）相关；我们应该能看到正相关性。列表\
  \ 5-8 加载数据、解析数据、计算分形维度、计算收盘价范围，并运行分形维度与范围之间的相关性测试。\n\n```Rr\n#load and parse stock\
  \ market data\nstocks<-read.csv(\"Example_Stock_Data.csv\")\nJune2019<-stocks[stocks$Month==\"\
  June\",]\nJuly2019<-stocks[stocks$Month==\"July\",]\nAugust2019<-stocks[stocks$Month==\"\
  August\",]\nSeptember2019<-stocks[stocks$Month==\"September\",]\nOctober2019<-stocks[stocks$Month==\"\
  October\",]\nNovember2019<-stocks[stocks$Month==\"November\",]\nDecember2019<-stocks[stocks$Month==\"\
  December\",]\nJanuary2020<-stocks[stocks$Month==\"January\",]\nFebruary2020<-stocks[stocks$Month==\"\
  February\",]\nMarch2020<-stocks[stocks$Month==\"March\",]\nApril2020<-stocks[stocks$Month==\"\
  April\",]\nMay2020<-stocks[stocks$Month==\"May\",]\n\n#calculate fractal dimension\
  \ for each series\nlibrary(fractaldim)\njunedim<-fd.estimate(June2019[,2],methods=\"\
  hallwood\")$fd\njulydim<-fd.estimate(July2019[,2],methods=\"hallwood\")$fd\naugustdim<-fd.estimate(August2019[,2],methods=\"\
  hallwood\")$fd\nSeptemberdim<-fd.estimate(September2019[,2],methods=\"hallwood\"\
  )$fd\nOctoberdim<-fd.estimate(October2019[,2],methods=\"hallwood\")$fd\nNovemberdim<-fd.estimate(November2019[,2],methods=\"\
  hallwood\")$fd\nDecemberdim<-fd.estimate(December2019[,2],methods=\"hallwood\")$fd\n\
  Januarydim<-fd.estimate(January2020[,2],methods=\"hallwood\")$fd\nFebruarydim<-fd.estimate(February2020[,2],methods=\"\
  hallwood\")$fd\nMarchdim<-fd.estimate(March2020[,2],methods=\"hallwood\")$fd\nAprildim<-fd.estimate(April2020[,2],methods=\"\
  hallwood\")$fd\nMaydim<-fd.estimate(May2020[,2],methods=\"hallwood\")$fd\n\n#combine\
  \ fractal dimension results into a vector\nmonthlyfd<-c(junedim,julydim, augustdim,Septemberdim,Octoberdim,Novemberdim,Decemberdim,Januarydim,Februarydim,Marchdim,Aprildim,Maydim)\n\
  \n#examine correlation between fractal dimension and range\nmonthlyrange<-c(range(June2019[,2]),range(July2019[,2]),range(August2019[,2]),range(September2019[,2]),range(October2019[,2]),range(November2019[,2]),range(December2019[,2]),range(January2020[,2]),range(February2020[,2]),range(March2020[,2]),range(April2020[,2]),range(May2020[,2]))\n\
  \n#run correlation test between fractal dimension and range\ncor(monthlyfd,monthlyrange)\n\
  ```\n\n\n\n\n\n这种切线在二维空间中效果良好。然而，尝试定义曲面上一点的切线会变得复杂，因为许多（无限多条）直线都可以切于给定点（参见图 6-2\n\
  \n图 6-2：通过 A 点且有多个可能切线的椭圆\n\n事实上，图 6-2 中的直线形成了一个切于 A 点的二维切平面，类似于一张在 A 点接触椭圆的纸。我们可以做的是如图\
  \ 6-3 所示，将这个`tangent plane` 胶在 A 点上。\n\n![图 6-3: 包含 A 点以及与 A 点相关的切平面的椭圆，切线扩展到切平面和切切空间](img/f06003r.png)\n\
  \n图 6-3：包含 A 点以及与 A 点相关的切平面的椭圆，切线扩展到切平面和切切空间\n\n对于高维对象，切空间可能会增长到涉及更多维度（它可以是 3 维、100\
  \ 维，甚至是无限维的立方）。这些切空间与线性代数有很好的联系。记住，向量空间可以由一组收集成矩阵的独立向量来定义，这被称为空间的`basis`，技术上称为 `Hamel\
  \ basis`。事实上，对象在某一点的切空间的`basis`实际上是该点偏导数的集合。如前提到的，在一维空间中，这恰好就是切线的斜率。这为流形上的每个点都提供了一个良好的欧几里得空间，可用于推导点之间的单位距离、提供从流形到欧几里得空间的映射，并理解多共线性。多共线性发生在变量之间强相关时，会导致矩阵的列或行相同或几乎相同（导致奇异矩阵）。多共线性对于基于回归的算法是一个问题，因为它会导致冗余的预测因子和奇异矩阵。方差完全重叠的变量（高度共线的预测因子）具有相同的切空间，或至少共享一些重叠的切空间。\n\
  \n### 引入 dgLARS\n\n基于切空间的实用机器学习算法是 `dgLARS` 算法（dgLARS 代表“微分几何最小角回归”）。dgLARS 将传统的最小角回归（LARS）扩展为一种拟合给定模型误差切空间的算法。LARS\
  \ 算法通常从回归模型中的每个系数设为 0 开始，根据预测因子与结果的相关性高低逐步添加预测因子；通过最小二乘计算调整系数，直到具有更高相关性的因子进入模型。当多个预测因子进入模型时，系数在联合最小二乘方向上增加。\n\
  \ndgLARS 考虑了模型的切空间，缩放了用于优化系数的得分函数。模型的每次更新都使用一种名为 `conditional Fisher information`\
  \ 的工具的平方根完成。条件 Fisher 信息粗略地衡量了给定变量相对于目标（如结果变量）所包含的信息量。对于对技术感兴趣的读者，参数的 Fisher 信息是该参数得分的方差，该得分是该参数对似然函数自然对数的偏导数。\n\
  \n让我们通过一个例子来将其具体化。假设我们正在创建一个模型，以理解影响青少年风险行为的因素，如药物使用或轻微犯罪。我们可能已经测量了许多已知因素（如家庭社会经济地位、中学成绩以及之前的学校或法律事件记录）。然而，我们想将我们设计的用于衡量青少年风险倾向的问卷指数（索引\
  \ 1）与衡量成年人风险行为的已知指数（索引 2）进行比较。两项调查都可能捕捉到不同类型的信息，以及相对于我们风险结果的不同水平的相关信息（图 6-4）。\n\n\
  ![图 6-4: 载入到风险指数的问题数量对比](img/f06004.png)\n\n图 6-4：载入到风险指数的问题数量对比\n\n在图 6-5 的示例中，调查\
  \ 1 的索引包含更多的信息。然而，调查 2 的索引中变量之间可能存在某些重叠或无关信息，如果有一个能够捕捉此类信息的测量就太好了。也许每项调查中问的问题之间也存在某些信息重叠和一些无关信息。让我们考虑每个风险倾向调查中包含的独有且相关的信息（图\
  \ 6-5）。\n\n![图 6-5: 索引问题中捕捉到的两种相关信息的调整测量](img/f06005r.png)\n\n图 6-5：索引问题中捕捉到的两种相关信息的调整测量\n\
  \n从图 6-5 中，我们看到索引 1 和索引 2 包含一些无关信息和重叠信息。索引 1 包含的信息似乎比索引 2 多一点，如果我们必须选择选择对更大规模的风险青少年群体进行哪项调查，那么从索引\
  \ 1 开始会比较好。\n\n这就是 Fisher 信息和变量选择在 dgLARS 中发生的方式。技术上，通过模型似然函数的偏导数计算 `score`，而该得分的方差就是\
  \ Fisher 信息，它可以进入矩阵以捕捉跨越模型偏导数的信息。有趣的是，这个矩阵也可以推导为相对熵（Kullback–Leiber 散度）的海森矩阵，在这种情况下，Fisher\
  \ 信息提供了相对熵的曲率。在不那么技术层面，用于选择变量的 Fisher 信息与统计度量（对数似然函数）以及所考虑自变量的信息几何有关。\n\n对于广义线性模型，Fisher\
  \ 信息矩阵可以用于推导出称为 `conditional Rao score` 的得分，它可以测试给定变量的系数在统计上是否显著于 0。如果得分在统计上不显著，则从模型中删除该变量。在\
  \ dgLARS 算法中，这些计算是通过在模型误差切空间中搜索系数向量完成的，从零模型开始。\n\n\n\n\n\n`dgLARS` 在处理预测变量多于观测值的问题上取得了成功，关于该算法的许多论文都关注基因组学应用，在这些应用中，患者数量可能只有\
  \ 300，而基因序列的数量可能达到 1,000,000 级。R 提供了一个名为 `dglars` 的包，为广义线性模型实现了该算法，包括逻辑回归、泊松回归、线性回归和\
  \ Gamma 回归的链接函数。对于不熟悉广义线性回归的人，`link function`（链接函数）本质上是因变量的一种特殊变换，它使得回归分析在数学上适用于计数变量、二分类变量和其他类型的非正态分布因变量（但对分布的几何形状有某些限制）。\n\
  \n既然我们已经涵盖了一些理论，现在让我们付诸实践。\n\n## 使用 dgLARS 预测抑郁症\n\n我们想根据学校问题和 `IQ` 来预测自述的抑郁情况。我们将使用的数据是来自自选极高天赋\
  \ Quora 用户（`IQ` 在 155 以上）样本的自述学校问题，包括七个主要的学校问题（欺凌、教师敌意、无聊、抑郁、缺乏动力、校外学习、被安排补习课程）。这些数据来自\
  \ 22 个个人的报告，他们提供了极高天赋范围内的评分，并讨论了学校系统中的至少一个感兴趣的问题，且偏向于美国的用户。该数据集从该平台收集并经过手动处理，获得了一个包含符合\
  \ `IQ` 标准的贴帖者学校问题类别的最终数据集。你可以在书的文件中找到该数据集。让我们先用 Listing 6-1 中的代码加载数据。\n\n```r\n\
  #load data\nmydata<-read.csv(\"QuoraSample.csv\")\nset.seed(1)\n```\n\nListing 6-1:\
  \ 加载 Quora 数据集的脚本\n\nListing 6-1 中的代码加载了一个研究教育干预和自尊心理指标的数据集。现在，让我们修改脚本在数据集上运行 `dgLARS`\
  \ 算法。该 R 包为我们提供了交叉验证或在不进行交叉验证的情况下运行算法的选择。让我们修改 Listing 6-1 以运行两种模型选项：\n\n```r\n\
  #run analysis\nlibrary(dglars)\ndg<-dglars(factor(Depression)~.,data=mydata,family=\"\
  binomial\")\ndg1<-cvdglars(factor(Depression)~.,data=mydata,\nfamily=\"binomial\"\
  ,control=list(nfold=2))\n```\n\n这在全学生数据上运行了交叉验证和非交叉验证的 `dgLARS` 算法。交叉验证版本在预测变量稀疏的小数据集上表现并不好，因此如果你遇到错误，请尝试运行交叉验证版本，因为某些分区可能会产生与划分以及对划分进行拟合模型相关的错误。两个\
  \ `dgLARS` 算法的输出在许多预测变量上应该是一致的，尽管由于数据是随机划分的，算法的交叉划分版本可能会有不同。让我们添加脚本来查看第一个模型的摘要：\n\
  \n```r\n#examine results of non-cross-validated model\n>summary(dg)\nSummary of\
  \ the Selected Model\n\n    Formula: factor(Depression) ~ 1\n     Family: 'binomial'\n\
  \       Link: 'logit'\n\nCoefficients:\n     Estimate\nInt.  -1.5041\n---\n\n  \
  \               g: 1.265\n     Null deviance: 20.86\n Residual deviance: 20.86\n\
  \               AIC: 22.86\n\nAlgorithm 'pc' (method='dgLASSO')\n```\n\n该模型没有因素被选为重要预测变量。模型没有选择因素有几个主要原因，包括存在相反效应的亚群体（它们“抵消”了亚群体的角度）、存在扭曲几何形状的离群值，或者预测变量存在真实的零效应。模型拟合合理，赤池信息准则\
  \ (`AIC`) 为 20.86，且在模型未添加任何项的情况下，残差离差远小于零离差。离散参数告诉我们数据与二项分布拟合得良好（看 `g` 如何接近 1），没有出现真实世界数据中偶尔出现的分布问题。\n\
  \n现在让我们在脚本中添加以查看交叉验证试验的结果：\n\n```r\n#examine cross-validated model\n>summary(dg1)\n\
  Call:  cvdglars(formula=factor(Depression) ~ ., family=\"binomial\",\n    data=mydata,\
  \ control=list(nfold=2))\n\nCoefficients:\n                       Estimate\nInt.\
  \                    -1.6768\nBullying                 0.3066\nPut.in.Remedial.Course\
  \   0.2292\n\ndispersion parameter for binomial family taken to be 1\n\nDetails:\n\
  \   number of non-zero estimates: 3\n      cross-validation deviance: 12.33\n  \
  \                            g: 0.9838\n                        n. fold: 2\n\nAlgorithm\
  \ 'pc' (method='dgLASSO')\n```\n\n交叉验证模型的结果与非交叉验证模型略有不同，表明模型发现了一些一致性，但在折叠之间并没有完全重叠。在交叉验证模型中，被安排补习课程的极高天赋儿童倾向于有更高的抑郁率。\n\
  \n## 使用 dgLARS 预测信用卡违约\n\n为了理解 `dgLARS` 在具有更多观测值和变量的二分类数据集上如何工作，让我们考虑另一个数据集。UCI\
  \ 违约数据集包含 30,000 个台湾案例（2005 年）以及 23 个违约预测变量，包括人口统计学（年龄、婚姻状况、教育状况和性别）、信用额度以及之前的使用和支付信息。我们的分析目标是确定哪些预测变量与违约有关，并评估\
  \ `dgLARS` 模型的拟合情况。让我们用 Listing 6-2 中的代码开始。\n\n```r\n#load data\nmydata<-read.csv(\"\
  UCIDefaultData.csv\")\n\n#load library\nlibrary(dglars)\n\n#run analysis, scaling\
  \ the predictors such that big numbers\n#result in large differences in coefficient\
  \ values\n#scale the predictor data\nmydata1<-scale(mydata[,-c(1,25)])\nmydata1<-cbind(mydata1,mydata$default.payment.next.month)\n\
  colnames(mydata1)[24]<-default.payment.next.month\"\n\n#run the dglars function\
  \ with and without cross-validation\ndg<-dglars(factor(default.payment.next.month)~.,\n\
  data=as.data.frame(mydata1),family=\"binomial\")\ndg1<-cvdglars(factor(default.payment.next.month)~.,\n\
  data=as.data.frame(mydata1),family=\"binomial\")\nsummary(dg)\nsummary(dg1)\n```\n\
  \nListing 6-2: 使用 dgLARS 和交叉验证 dgLARS 加载、处理并分析 UCI 违约数据集脚本\n\n这应该产生具有大多数预测变量系数的模型。第一个模型是非交叉验证模型版本\
  \ (`DG`)，第二个模型是交叉验证版本 (`DG1`)。Table 6-1 显示了我们运行代码的结果。\n\n表 6-1: UCI 违约 dgLARS 模型中的项系数\n\
  \n| **Column1** || **DG estimate** | **DG1 estimate** |\n| --- | --- | --- |\n\n\
  \n\n\n\n| Int. || –1.47 || –1.45 |\n| --- | --- | --- |\n| LIMIT\\_BAL || –0.10\
  \ || –0.09 |\n| SEX || –0.05 || –0.04 |\n| EDUCATION || –0.08 || –0.07 |\n| MARRIAGE\
  \ || –0.08 || –0.07 |\n| AGE || 0.07 || 0.06 |\n| PAY\\_0 || 0.65 || 0.65 |\n| PAY\\\
  _2 || 0.10 || 0.09 |\n| PAY\\_3 || 0.09 || 0.09 |\n| PAY\\_4 || 0.03 || 0.03 |\n\
  | PAY\\_5 || 0.04 || 0.04 |\n| PAY\\_6 || 0.01 || 0.01 |\n| BILL\\_AMT1 || –0.39\
  \ || –0.15 |\n| BILL\\_AMT2 || 0.16 || 0.02 |\n| BILL\\_AMT3 || 0.09 || 0.02 |\n\
  | BILL\\_AMT5 || 0.03 || 0.00 |\n| BILL\\_AMT6 || 0.02 || 0.00 |\n| PAY\\_AMT1 ||\
  \ –0.22 || –0.17 |\n| PAY\\_AMT2 || –0.22 || –0.19 |\n| PAY\\_AMT3 || –0.05 || –0.05\
  \ |\n| PAY\\_AMT4 || –0.06 || –0.06 |\n| PAY\\_AMT5 || –0.05 || –0.05 |\n| PAY\\\
  _AMT6 || –0.04 || –0.03 |\n\n违约最大的预测因素之一包括上月的账单和还款历史。使用量较低（`BILL_AMT1`）、还款金额较低（`PAY_AMT1`）以及按时还款（`PAY_0`）的人，下个月发生违约的可能性较低。这非常合理，因为大多数贷款指标都优先向债务负担低且有按时还款记录的人群提供最优利率的贷款。\n\
  \n交叉验证的 dgLARS 模型对上月使用量和还款总额惩罚比非交叉验证模型小，这表明上月的按时还款比具体的数字更重要。第一个模型的 `AIC` 分数相当大（27,924），但它比空模型的\
  \ `AIC` 分数（31,705）要小得多，表明即使包含了几个预测变量，其拟合效果也优于空模型。\n\n现在让我们将此模型与逻辑回归进行比较，并比较 AIC\
  \ 拟合统计量，在我们的脚本中添加以下内容：\n\n```\n#run logistic regression\ngl<-glm(factor(default.payment.next.month)~.,\n\
  data=as.data.frame(mydata1),family=\"binomial\"(link=\"logit\"))\n\n#calculate AIC\
  \ of the model\nAIC(gl)\n```\n\n这段代码在数据集上运行逻辑回归并计算模型的 `AIC`。在这个示例中，`AIC` 应该在 27,925\
  \ 左右，与 dgLARS 模型几乎完全一致。这表明逻辑回归与 dgLARS 算法是收敛的；在如此大的样本量下，这种结果是预期的。逻辑回归是处理大样本量的典型工具，在这种情况下我们似乎没有通过使用\
  \ dgLARS 获得收益。然而，考虑到在大样本量上的收敛性，dgLARS 很可能在较小样本量上提供逻辑回归无法处理的高质量结果。\n\n## 应用离散外微分\n\
  \n微分几何产生的另一个有用工具是离散外微分。离散外微分涉及从低维形状构建离散形状。离散外微分涉及从低维形状构建离散形状。在之前的章节中，我们检查了同调，这在技术上是通过识别边界完成的。例如，考虑[的形\
  \ 6](https://wiki.example.org/figure_6) 的边界。\n\n我们可以更进一步，将[边界的形 7](https://wiki.example.org/figure_7)\
  \ 拆解为线。\n\n正如我们可以通过识别边界来拆解形状，也可以通过组合那些边界从低维边界来构建形状，例如在[边界的形 8](https://wiki.example.org/figure_8)\
  \ 中所示的连接方式。技术上，这被称为上同调，是离散外积分的领域。\n\n对于更具技术背景的读者，我们正在观察微分形式的离散版本，即单纯形形复链。这些微分形式与其相关的场。然后我们可以定义算子来改变这些场、组合它们，或者计算形链内部的内容。这允许我们处理某些类型的数据，以理解电网中的资源能力或社交网络中的疾病负担（甚至是计算机屏幕上像素组的渲染）。\n\
  \n这种情况可以持续到任意维度，从线到三角形，三角形到四面体。我们也可以通过离散外微分跳跃级别，从点到三角形或四面体。因此，离散数据（如像素数据或工程数据）可以进行分组和连接以供进一步研究。\n\
  \n\n\n\n\n# 列表 6-3：一个生成连通城镇示例图、绘制该图、为每个城镇添加资源、将这些资源可视化，并分析相互连通城镇的资源的脚本\n\n`列表 6-3`\
  \ 创建了一个由道路连接的城镇矩阵，然后将其转换为加权图。一旦变成图的形式，我们就可以添加有关每个城镇可用资源的信息，并绘制一张包含这些信息的图片，同时包含由道路连接的城镇之间的距离。然后，我们可以计算城镇之间的互通资源，以及从给定城镇到另一个城镇的最小旅行距离。这将帮助我们评估灾害期间的可用资源以及派遣物资的最佳路线。\n\
  \n`列表 6-3` 的第一个图表应该输出一个显示哪些城镇相互连通以及城镇之间英数的图，如 `图 6-10` 所示。\n\n![图 6-10: 城镇连通性图及连通城镇之间的道路里程数](img/f06010.png)\n\
  \n图 6-10: 城镇连通性图及连通城镇之间的道路里程数\n\n`图 6-10` 显示城镇 2、3 和 4 通过多条道路相连，因此如果某条路被封锁，仍然可以通过绕道另一个城镇到达该城镇。然而，尽管城镇\
  \ 1 距离最近的城镇只有 4 英里，但它仍然相对孤立。连接城镇 2 和 3 的道路非常长（这可能是一条穿过茂密森林或绕过几条运河的乡路）。\n\n`列表 6-3`\
  \ 中的第二个 `plot` 应该输出一个为每个城镇添加了总资源的图，如 `图 6-11` 所示。\n\n![图 6-11: 城镇连通性图、连通城镇之间的道路里程数以及每个城镇内的资源图](img/F06011r.png)\n\
  \n图 6-11: 城镇连通性图、连通城镇之间的道路里程数以及每个城镇内的资源图\n\n`图 6-11`让我们对四个城镇之间的连通性和潜在的共享资源有了更深入的理解。注意，城镇\
  \ 1 为灾害储备的水相对较少（每位居民 10 升）。然而，如果城镇 1 和 4 之间的道路在灾害期间保持完好，很容易从城镇 4（每位居民 200 升）移动一些水到城镇\
  \ 1，使得城镇 1 有足够的水。只要直接连接这些城镇的道路在灾害中保持完好，在城镇 4 和城镇 2（储备每位居民 500 升）之间移动水也很容易。\n\n极大团计算得出了相互连通的城镇（具有相互\
  \ `n` 路连接的城镇）。这建立了城镇 1 和 4 之间（通过单条道路）以及城镇 2、3 和 4 之间的连接，它们是相互连通的。根据这些信息，如果城镇之间的道路保持完好，我们可以计算每个城镇可支配的资源。城镇\
  \ 1 和 4 相互包含 210 居民-升；三元团（城镇 2、3 和 4）包含 780 居民-升。\n\n使用最短路径算法，我们可以计算任何两个城镇之间的最短路线，以理解当某个城镇物资短缺且道路未受灾害损坏时，物资可以多快地在城镇之间传输。`表\
  \ 6-2` 给出了在这种情况下城镇之间需要行驶的英数。\n\n表 6-2：城镇对之间的最短距离\n\n|   | **城镇 1** | **城镇 2** |\
  \ **城镇 3** | **城镇 4** |\n| --- | --- | --- | --- | --- |\n| **城镇 1** | 0 | 6 | 10\
  \ | 4 |\n| --- | --- | --- | --- | --- |\n| **城镇 2** | 6 | 0 | 8 | 2 |\n| **城镇 3**\
  \ | 10 | 8 | 0 | 6 |\n| **城镇 4** | 4 | 2 | 6 | 0 |\n\n在这种情况下最长的路线（10 英里）是城镇 1 缺水时尝试从城镇\
  \ 3 向城镇 1 运物资。注意，绕过最长路在城镇 2 和 3 之间传输物资反而更短（8 英里对比 12 英里）。\n\n我们可以通过向 `列表 6-3` 中添加移除连接城镇道路的操作，来检查灾害中一条或多条道路损坏的情况，并重新检查互通物资和最短路径：\n\
  \n```R\n#删除顶点 2 和 4 之间的链接，提供高效的物资\n#传输路线\ng2<-delete_edges(g1,edges=\"2|4\")\nV(g2)$number<-c(10,500,80,200)\n\
  plot(g2,edge.label=E(g2)$weight,vertex.label=V(g2)$number,vertex.size=40,\nmain=\"\
  Situation 2\")\n\n#寻找极大团\nmc2<-max_cliques(g2)\n\n#寻找城镇间的资源\nc1<-V(g2)$number[mc2[1]]+V(g2)$number[mc2[2]]\n\
  c2<-V(g2)$number[mc2[1]]+V(g2)$number[mc2[3]]\nc3<-V(g2)$number[mc2[2]]+V(g2)$number[mc2[3]]\n\
  \n#使用最短路径检查传输所需时间\ndis2<-distances(g2,v=V(g2),mode=\"all\",weights=E(g2),\nalgorithm=\"\
  dijkstra\")\n```\n\n此脚本删除了城镇 2 和 4 之间的链接，重新计算指标以帮助我们评估城镇 2 和 4 道路阻塞后局势发生的变化。这将产生一个类似于\
  \ `图 6-12` 的图。\n\n![图 6-12: 道路损坏后的城镇 1 修改图](img/F06012r.png)\n\n图 6-12: 道路损坏后的城镇\
  \ 1 修改图\n\n正如 `图 6-12` 所示，这种情况打破了情况 1 中的三角形，使城镇 2 孤立。如果城镇 1 的水供应不足，则必须在城镇 1 和 2\
  \ 之间共享水。\n\n如果我们观察团，可以看到城镇之间的双向连接，互通物资比情况 1 更分散。此外，旅行所需的英数增加了，正如我们在 `表 6-3` 中所示所示。\n\
  \n表 6-3：城镇对之间的最短距离\n\n|    | **城镇 1** | **城镇 2** | **城镇 3** | **城镇 4** |\n| ---\
  \ | --- | --- | --- | --- |\n| **城镇 1** | 0 | 22 | 10 | 4 |\n| --- | --- | --- |\
  \ --- | --- |\n| **城镇 2** | 22 | 0 | 12 | 18 |\n| **城镇 3** | 10 | 12 | 0 | 6 |\n\
  | **城镇 4** | 4 | 18 | 6 | 0 |\n\n离散外微分还有其他应用。图形渲染和工程问题一直是离散外微分（以及广义的离散外积分）中特别感兴趣的领域。工程中一些常见的应用是离散对象上的通量和流计算，或过程的计算机建模。在图形渲染中，图通常被网格取代。\n\
  \n在某些情况下，使用上调研究点云比使用持续同调更容易，因为最终结果会发现相同的边界和对象。然而，在开发将离散外微分应用于数据的显式 R 软件包方面进展有限，且代码必须像\
  \ `列表 6-3` 那样组合解析。自动化和对象操作代码将有助于离散外微分在数据科学及其他领域的采用。\n\n\n\n\n\n机器学习中几何领域的另一个引人入胜的近期进展是机器学习算法中的`nonlinear\
  \ algebra`（非线性代数）概念。许多机器学习算法严重依赖线性代数来计算梯度、最小二法估计器等。然而，在非平坦或不涉及直线的关系和空间中，线性代数只能为计算出的数值提供近似值。请看图\
  \ 6-13，它显示了一条直线（线性代数工具，如回归中所使用的工具所假设的）和一条曲线（可能会导致线性代数工具产生估算问题）。\n\n![图 6-13: 直线和曲线](img/f06013r.png)\n\
  \n图 6-13: 直线和曲线\n\n当使用线性工具估算曲线和非线性空间时，非线性会为算法的计算和最终结果引入误差。想象用尺子测量图 6-13 中下方的线条。很难获得该线相对于上方直线的精确长度。如果这条线的长度是算法需要最小化或最大化的数值，那么这种测量可能会找到一个非全局解，或者扭曲数值以至于导致预测准确性或模型拟合统计量（如平方误差或贝叶斯信息准则）出现问题。\n\
  \n机器学习算法中线性代数计算的一种替代方案是使用`numerical algebraic geometry`（数值代数几何），这是处理曲线交点的非线性代数分支。例如，考虑被一维曲线交叉的二维椭圆，如图\
  \ 6-14 所示。\n\n![图 6-14: 曲线交叉椭圆的图](img/f06014r.png)\n\n图 6-14: 曲线交叉椭圆的图\n\n可以使用不同类型的矩阵和矩阵操作，类似于线性代数求解线性组的方法求解非线性系统；矩阵中的数字只需替换为多项式方程。其中一些曲线交点问题是非凸问题，它们通常会对机器学习算法及其支撑的线性代数产生问题。\n\
  \n`Convex optimization problems`（凸优化问题）是指优化函数创建一个区域，在该区域中，通过该区域的直线连续位于区域内（而不是穿过对象内的多个区域和非区域），如图\
  \ 6-15 所示。\n\n![图 6-15: 凸对象](img/f06015r.png)\n\n图 6-15: 凸对象\n\n然而，如果区域包含空洞或凹陷，情况就不再如此，该区域被定义为`nonconvex`（非凸），如图\
  \ 6-16 所示，区域内部的空洞将内部集分为区域内的集和空洞内的集。\n\n![图 6-16: 非凸对象](img/f06016r.png)\n\n图 6-16:\
  \ 非凸对象\n\n优化算法通常对优化函数中的非凸函数和区域感到困扰，因为通常用于解决这些问题的线性规划并不适用于非凸优化问题，而且步进法可能会陷入区域内空洞或凹陷周围的局部最优。遗憾的是，许多真实世界数据集以及用于它们的优化函数涉及非凸区域。数值代数几何为非凸优化问题提供了准确的解决方案，这类问题在现实数据情况下经常出现。一旦以矩阵形式建立多项式组，许多软件平台和程序可以计算，包括`Bertini`和`Macauley`软件，它们可以连接到`R`和`Python`。这使得求解器能够在非凸优化问题中良好运行。\n\
  \n数值代数几何的近期出版和工作坊表明，非线性代数是其他可能是凸问题的当前算法机制的可行替代方案，它可以放宽数学假设并提高准确性。最近的一篇论文（Evans,\
  \ 2018）发现，对于许多类型的统计模型（包括`Lasso`、用于时间序列数据的`ARIMA`模型和贝叶斯网络），许多可能解的局部几何重叠的。这意味着算法无法很好地区分模型空间中的潜在预测集或参数值，特别是对于这些问题常用和建议的样本量而言。人们可以通过在切空间中拟合模型（正如我们在上一节中看到的），或者使用数值代数几何代替线性代数进行优化来解决这个问题。这表明数值代数几何和其他非线性方法在机器学习算法中有直接应用，以提高算法性能和模型拟合效果。\n\
  \n遗憾的是，目前`R` 中不存在实现这些算法的包，因此我们不会在示例中进一步探讨此。\n\n## 与 HodgeRank 比较选择排名\n\n在客户群体中辨别选择偏好是一项常见的机器学习任务。例如，公司可能希望客户对软件潜在新功能列表上的项目进行比较，以便安排工程团队在未来一年中的工作优先级。比较选择排名也有助于公司向现有用户推销新产品和服务，并为可能在现有客户中畅销的项目开发新的营销活动。\n\
  \n让我们来看一个关于海滩一天活动偏好排名的简单例子。也许我们正在查看酒店从近期住客收集的数据，关于他们在入住期间偏好哪些活动；这将允许他们优先考虑海滩的使用和员工招聘，以满足对主要活动的需求。这里我们有三个选择（海滩、游泳或冲浪），其中一种偏好是明确的（冲浪）。图\
  \ 6-17\n\n图 6-17: 曲线交叉椭圆的图\n\n我们可以通过增加一个优于其他三个项目的潜在活动：风浪板来增加这个问题。排名仍然相对容易计算，因为所有活动都优于海滩，一个活动仅优于海滩（游泳），一个活动优于除风浪板以外的所有（冲浪），一个活动优于其他三个（风浪板），如图\
  \ 6-18 所示。\n\n![图 6-18: 在偏好数据中增加另一个活动](img/f06018r.png)\n\n图 6-18: 在偏好数据中增加另一个活动\n\
  \n所有信息都在图中，这个特定个人完成了与其他项目之间的所有选择。这在真实世界的数据中很少见，如图 6-19 所示。\n\n![图 6-19: 四个活动的不完整偏好图](img/f06019r.png)\n\
  \n图 6-19: 非凸对象（上下文）\n\n然而，这些信息仍然显示了对风浪板的强烈偏好，所有风浪板对都有排名，且所有成对排名都指向风浪板作为最受喜的活动。在真实世界的数据中，不仅会有信息缺失，数据中经常会出现偏好环，例如图\
  \ 6-20 所示，其中冲浪优于游泳，而风浪板优于冲浪但并不优于游泳。\n\n\n\n\n\n![图 6-20: 不完整且不一致的排名偏好示例](img/f06020.png)\n\
  图 6-20: 不完整且不一致的排名偏好示例\n\n这导致了局部不一致性，即在有其他选项的情况下，风浪板和游泳的相对排名可能会发生变化。然而，冲浪和风浪板优于另外两项活动，表明它们的排名处于所有可能选项的前端，而风浪板又优于冲浪（这形成了一种平局机制）。\n\
  \n当全局不存在一致的偏好时，情况会变得更加模糊，每项活动都优于另一项活动，如图 6-21 所示。\n\n![图 6-21: 无一致偏好的不完整偏好数据图](img/f06021.png)\n\
  图 6-21: 无一致偏好的不完整偏好数据图\n\n在图 6-21 的情况下，无法判断哪项活动优于其他活动，分析结果将是不确定的。这在客户被要求对金融应用中的功能进行排名，或者客人被要求对偏好活动进行排名时非常常见。大多数客户存在于具有独特需求的子群体中，而这些需求可能是另一个重要客户子群体的相反。为开发功能进行优先级排序或为客人提供尽可能满足大多数客户的选择是一项挑战。\n\
  \n存在许多算法可以进行两两排名比较，以获得相互相关的偏好排名列表（`SVMRank`、`PageRank` 等）；然而，通常情况下，它们不提供关于排名中局部和全局不一致性的信息，而这些信息可能会影响某项或选择相对于其他项的位置。代数几何最近在两两排名算法集中增加了一个工具，它可以分解排名结果，以包含关于项目局部和全局不一致性的信息；那就是\
  \ `HodgeRank`，它可以通过利用工程中常用的基于代数几何的定理：Hodge–Helmholtz 分解来推导出这些信息。\n\n`Hodge–Helmholtz\
  \ decomposition` 将向量流（或图上的流）划分为三个不同的部分，如图图 6-22 所示：局部和全局均一致的 `gradient flow`（梯度流）；局部一致但全局不一致的\
  \ `curl flow`（旋度流）；以及局部不一致但全局一致的 `harmonic flow`（调和流）。\n\n![图 6-22: 显示由 Hodge–Helmholtz\
  \ 分解分解的流图](img/f06022.png)\n图 6-22: 显示由 Hodge–Helmholtz 分解分解的流图\n\n在海滩示例中，图 6-20\
  \ 包含一个涉及游泳、冲浪和风浪板的旋度流（如果此处未排名另一活动，则也是调和流）。图 6-21 是全局调和流的示例（也是局部旋度流）。\n\n`HodgeRank`\
  \ 算法本质是将 `PageRank` 扩展到两两排名问题；其数学原理归结为图数据上的最小二乘问题，从而允许对全局排名和局部排名一致性进行评估。因此，可以标记可疑排名以便人工分析师审查。该算法还允许原始两两排名集中存在大量缺失数据，使其能够广泛应用于现实世界排名问题中经常不完整的数据（用户不会去点击三百万个视频选项来将它们与其他所有选项进行排名！）。虽然\
  \ R 语言中没有相应的包，因此我们不会演示示例，但在 Matlab 中已经存在实现，鼓励对该算法感兴趣的熟悉 Matlab 的读者使用列出的 `HodgeRank`\
  \ 资源。\n\n## 总结\n\n在本章中，我们学习了源自微分几何和代数几何的新型算法，并探索了在数据分析问题中同时使用 `dgLARS` 和离散外微积分（discrete\
  \ exterior calculus）的方法，包括 Quora 赠送样本、信贷贷款样本和灾害规划场景。许多更多算法正在开发中，我们概述了非线性代数和 Hodge\
  \ 理论近年来对机器学习的贡献，这些贡献影响了重要的行业问题类型（例如偏好排名和参数化模型估计）。\n\n在下一章中，我们将回到持续同调，并检查另一种代数拓扑学工具，即\
  \ `Mapper` 算法。这两个工具都将用于在本章中介绍的学生样本。\n\n# 7 拓扑数据分析工具\n\n![](img/chapterart.png)\n\
  \n在本章中，我们将探索以拓扑学为直接基础的算法，并利用它们来理解第 6 章中遇到的自报告教育数据数据集。包含基于拓扑的算法的机器学习分支被称为 `拓扑数据分析\
  \ (TDA)`。你已经在第 4 章中见过一些 TDA，在其中我们使用持续同调来探索网络差异。持续同调最近在机器学习社区引起了大量关注，并被用于心理测量数据验证、图像比较分析、卷积神经网络的池化步骤以及小样本数据的比较。在本章中，我们将重新审视持续同调并查看\
  \ `Mapper` 算法（现由 Ayasdi 商业化）。\n\n## 寻找具有独特行为的区分性群体\n\n之前，我们使用持续同调来区分不同类型的图。回想第 4\
  \ 章，持续同调从点云数据创建单纯复形，对这些单纯复形应用一系列阈值，并计算与每个单纯复形内部特征相关的数字。为了比较对象，我们可以使用 Wasserstein\
  \ 距离。\n\n持续同调在今天的行业中有许多用途。`子群体挖掘`（即寻找具有独特行为的群体）是其中的主要用途。特别是，我们经常寻找零阶同调分量，即在几何上连接的群体（例如层次聚类中的类）。例如，在心理调查验证中，子群体挖掘允许我们发现调查中的不同群体，例如抑郁的不同亚型。\n\
  \n让我们通过一个与社交网站自报告教育数据相关的持续同调子群体挖掘示例。我们将模拟数据，并使用 R 中的 `TDAstats` 包比较持续同调结果，使用 R 中的\
  \ `hclust()` 函数进行单链层次聚类（见列表 7-1）。我们将回到第 6 章中 Quora 用户自报告学校经历的示例数据集（参见该数据集的文件）。在示例中，我们将样本分成\
  \ 11 个人一组，以便通过统计学方法比较持续同调结果，以确保我们的测量在样本之间没有变化。这为我们的测量在人群中具有一致性提供了验证。\n\n```\n# 加载数据并设置种子\n\
  mydata<-read.csv(\"QuoraSample.csv\")\nset.seed(1)\n\n# 采样数据以分为两个数据集；移除 IQ 分\ns<-sample(1:22,11)\n\
  set1<-mydata[s,-1]\nset2<-mydata[-s,-1]\n```\n\n列表 7-1: 加载教育数据集并将其分为两个用于用于持续同调探索的脚本\n\
  \n\n\n\n现在我们已经有了数据集，可以应用持续同调（persistent homology）来理解聚类。具体而言，我们正在观察第 0 阶 Betti 数（对应于连通组）以及数据的其他拓扑特征——复习内容请参阅第\
  \ 4 章。\n\n首先，我们需要计算社交网络中每个学生之间的曼哈顿距离（Manhattan distances）；我们将用它们来定义过滤（filtration）。曼哈顿距离通常是离散数据的常用距离量。在你的脚本中添加以下内容：\n\
  \n```r\n#calculate 得分对之间的曼哈顿距离\nmm1<-dist(set1,\"manhattan\",diag=T,upper=T)\n```\n\
  \n接下来，我们希望对基于距离的数据应用持续同调算法，以揭示持续特征。使用 `TDAstats` 包，我们可以添加代码来计算该数据集的第 0 阶和第 1 阶 Betti\
  \ 数，并将较低过滤设置作为近似的最大尺度（这将给我们更大的聚类）。最后，我们可以在持续性图（persistence diagram）和层次聚类图中绘制这些结果：\n\
  \n```r\n#创建 Vietoris-Rips 复形（将数据转换为单纯复形）\nlibrary(TDAstats)\nd1<-calculate_homology(mm1,dim=1,format=\"\
  cloud\")\n#绘制持续性图，其中圆=连通分量，三角形=环\nplot_persist(d1)\n#层次聚类\nplot(hclust(mm1),main=\"\
  Hierarchical Clustering Results, Distance Data\")\n```\n\n`calculate_homology()`\
  \ 函数将距离数据集中的点云数据转换为单纯复形；然后我们可以应用过滤来识别在过滤过程中出现和消失的拓扑特征。其他方法也可以从数据创建单纯复形，但此包中的 Rips\
  \ 复形是最容易计算的方法之一。\n\n使用之前的代码，我们绘制了两个图。调用 `plot_persist()` 应该会产生类似于图 7-1 的结果。你可以看到那里存在一个主组，在较低的过滤水平下可能还有一个或两个子组；然而，由于子组接近对角线，它可能是一个显著特征。\n\
  \n![图 7-1: 第一组教育经验数据的持续性图](img/f07001.png)\n\n图 7-1: 第一组教育经验数据的持续性图\n\n在使用层次聚类结果（图\
  \ 7-2）时，很容易看到一个主组以及在较小距离阈值下的几次分裂。\n\n![图 7-2: 模拟数据的聚类图](img/f07002.png)\n\n图 7-2:\
  \ 模拟数据的聚类图\n\n如果你在高度 5 处切割聚类，聚类图的结果存在两个主子组。让我们通过向列表 7-1 添加内容，根据层次聚类发现的两个主类来划分 `set1`\
  \ 数据，首先检查较小的类，然后检查较大的类：\n\n```r\n#较小的聚类\nmydata[c(1,9,10,17),]\n```\n\n这应该输出以下内容：\n\
  \n```r\n> mydata[c(1,9,10,17),]\n    IQ      Bullying Teacher.Hostility Boredom\
  \ Depression Lack.of.Motivation\n1  187             0                 1       0\
