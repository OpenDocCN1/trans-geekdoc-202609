  \ centrality）` 衡量它接收了多少知识，而`枢纽中心性（hub centrality）` 衡量一个顶点了解多少知识。\n\n## 在示例社交网络中衡量中心性\n\
  \n为了更好地理解所有中心性指标，考虑一个比我们目前考虑过的更有趣的例子会有帮助。列表 2-4 中的脚本加载并绘制了来自此作者之一的网络。你可以在书的网页上找到数据集以及其他文件：`https://nostarch.com/shapeofdata`。\n\
  \n```python\n#load data including no header\nmydata<-as.matrix(read.csv(\"SocialNetwork.csv\"\
  ,header=F))\n\n#convert data to graph\ng_social<-graph_from_adjacency_matrix(mydata,mode=\"\
  undirected\",weighted=T)\n\n#plot graph\nplot(g_social,main=\"Farrelly's Social\
  \ Network\",vertex.size=15,vertex.label.cex=0.5,vertex.color=2)\n```\n\n列表 2-4:\
  \ 一个脚本加载社交网络数据集，将其转换为图对象，然后绘制它。\n\n图 2-5 显示了生成的网络图（每次运行此脚本时，看起来都略有不同）。\n\n\n\n\n\
  \n```python\n# 中介性\nplot(g_social,vertex.size=20*betweenness(g_social)/max(betweenness(g_social)),vertex.label.cex=0.8,vertex.color=2)\n\
  \n# 接近性\nplot(g_social,vertex.size=20*closeness(g_social)/max(closeness(g_social)),vertex.label.cex=0.8,vertex.color=2)\n\
  \n# 特征向量中心性\nplot(g_social,vertex.size=20*eigen_centrality(g_social)$vector,vertex.label.cex=0.8,vertex.color=2)\n\
  \n# PageRank 中心性\nplot(g_social,vertex.size=20*page_rank(g_social)$vector/max(page_rank(g_social)$vector),vertex.label.cex=0.8,vertex.color=2)\n\
  \n# Katz 中心性（alpha 参数设置为 0.2）\nplot(g_social,vertex.size=20*alpha_centrality(g_social,alpha=0.2)/max(alpha_centrality(g_social,alpha=0.2)),vertex.label.cex=0.8,vertex.color=2)\n\
  ```\n\n列表 2-5：一个为 Farrelly 社交网络数据集上的每种中心性度量创建气泡图网络图的脚本\n\n让我们从接近性和中介性开始，如图 2-6 所示。\n\
  \n![图 2-6：Farrelly 社交网络数据上接近性中心性（左）和中介性中心性（右）的气泡图](img/f02006_m.png)\n\n图 2-6：Farrelly\
  \ 社交网络数据上接近性中心性（左）和中介性中心性（右）的气泡图\n\n这里的接近性评分似乎捕捉到了我们希望看到的内容。位于网络越中心位置的顶点越大，而越靠边缘的顶点越小。请注意，这种中心性概念是基于网络的全局几何形状的。例如，`V10`\
  \ 具有最高的接近性中心性评分，因为它在整个网络中处于中心，尽管在两个主要簇（医学院朋友和退伍军人朋友）中的每一个簇都处于边缘。\n\n中介中心性（正如你所记得的，其目的是捕捉那些移除后会对跨越网络的流造成最大破坏的位置）为\
  \ `V7` 和 `V10` 提供了比所有其他顶点大得多的评分——这两个顶点是连接该网络中两个主要簇的。`V14` 也有一个较小但仍然相对较大的中介性评分，表明在两个主要簇之间的许多（但不是所有）最短路径都通过了该顶点。\n\
  \n接下来，让我们看看图 2-7 所示的特征向量中心性和 PageRank 中心性评分。\n\n![图 2-7：Farrelly 社交网络数据上特征向量中心性（左）和\
  \ PageRank 中心性（右）的气泡图](img/f02007_m.png)\n\n图 2-7：Farrelly 社交网络数据上特征向量中心性（左）和 PageRank\
  \ 中心性（右）的气泡图\n\n对于这两个度量，`V7`（代表 Farrelly 本人）具有最高值，且这些值在医学院簇中的分布方式——至少从直觉上看——似乎捕捉到了中心性或重要性的概念。此图中最引人注目的也许是这两个紧密相关的基于特征向量的度量之间的对比。对于特征向量中心性，医学院簇中的值完全压倒了退伍军人组织簇的值，而\
  \ PageRank 中心性似乎能更好地反映每个簇内部单独的中心性和重要性。这种差异的原因是，在随机游走中，人们仅仅以相等的概率选择邻居顶点进行遍历，倾向于在高度互密的医学院簇周围徘徊，并且采取那条通往该簇之外（从\
  \ `V7` 到 `V10`）的的概率很低。而使用 PageRank 中心性时，随机游走包含了跳转到网络中任何位置的固定概率，这有助于它们到达退伍军人组簇。\n\
  \n在图 2-8 中我们有 Katz 中心性，正如你所记得的，它是度的一种高阶版本，不仅考虑邻居的数量，还考虑邻居的邻居的数量，以此此类推。我们通过指定来自高阶连接影响的衰减率，计算了两个不同衰减参数\
  \ `alpha` 下的值。\n\n![图 2-8：Farrelly 社交网络数据上衰减参数 alpha = 0.2（左）和 alpha = 0.1（右）的 Katz\
  \ 中心性气泡图](img/f02008_m.png)\n\n图 2-8：Farrelly 社交网络数据上衰减参数 alpha = 0.2（左）和 alpha\
  \ = 0.1（右）的 Katz 中心性气泡图\n\n事实证明该网络的谱半径约为 4，因此我们需要选择小于 0.25 的 `alpha` 值（这里是 `0.2`\
  \ 和 `0.1`）。我们在这里看到，两种选择都将 Farrelly 的 `V7` 识别为中心顶点，但对于这两个 `alpha` 参数中较高的一个（左图），评分在\
  \ `V7` 附近仍保持较高水平，然后迅速消散。对于较小的 `alpha`（右），消散得不那么快。Katz 中心性在整个网络中更有效地捕捉了我们通常认为的中心性或重要性，并且通常建议选择一个接近谱半径倒数的\
  \ `alpha` 值。在无向网络中，这两个度量是重合的，所以让我们首先将网络转换为有向网络。正如你所看到的，对于网络中的每条边，例如 `i` 和 `j`，以三分之一的概率将其转换为单向边从\
  \ `i` 到 `j`；以三分之一的概率将其转换为单向边从 `j` 到 `i`；以三分之一的概率保持为双向边。\n\n```python\n# 随机移除接接矩阵中的某些项\n\
  mydata_directed<-mydata\nfor (i in 1:20){\n  for (j in i:20){\n      rand<-runif(1)\n\
  \      if(rand < 0.33){mydata_directed[i,j]<-0}\n      if( >= >= 0333 rand rand\
  \ < 0.6){mydata_directed[jjii<-0}\n  }\n}\n\n# 使用此接接矩阵创建有向网络\ng_directed<-graph_from_adjacency_matrix(mydata_directed,mode=\"\
  directed\",weighted=T)\n\n# 绘制该网络的枢心性和权威性\nplot(g_directed,vertex.size=20*hub_score(g_directed)$vector,vertex.label.cex=0.8,vertex.color=2,edge.arrow.size=0.4)\n\
  plot(g_directed,vertex.size=20*authority_score(g_directed)$vector,vertex.label.cex=0.8,vertex.color=2,edge.arrow.size=0.4)\n\
  ```\n\n（上述代码对应的是列表 2-6：一个将 Farrelly 社交网络转换为有向网络并然后绘制结果枢心性和权威性的脚本）\n\n*注：由于原文代码块存在部分逻辑混乱/重复（如\
  \ `if( >= >= 0333 rand rand rand < 0.6)`），在翻译时遵循“代码块不需要翻译”的原则，保留了其原样。*\n\n\n\n\n\
  \n现在我们已经通过视觉化探索了所有的中心性指标，让我们用其中几个指标对 Farrelly 社交网络中的顶点进行排名和比较（回到原始的无图版本）。Listing\
