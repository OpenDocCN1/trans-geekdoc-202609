  \ 的 hub score 较高，因为它靠近一个连接非常紧密的微子社区。\n\n## 网络的其他数量\n\n网络几何提供的不仅仅是顶点的中心性指标。在本节中，我们将引入与网络顶点相关的其他一些感兴趣的数量。例如包括衡量朋友之间相互性的传递性得分（transitivity\
  \ scores）、衡量效率的效率得分（efficiency scores）以及衡量曲率的（curvature scores）\n\n### 顶点的多样性\n\n\
  虽然 hub 和 authority 关注的是有向网络，但与顶点相关的另一个指标是 `diversity`（多样性）。顶点的*diversity* 是权重香农熵（一种比例量）的缩放版本。在加权网络中，当权重相等时最大，并随着权重多样化而减少。\n\
  \n### 三元闭合\n\n网络理论中一个很有用的概念是三角闭合（triadic closure），即朋友之间形成三角形的倾向。考虑图 2-10 所示的朋友网络。在这里，Justin\
  \ 和 Jason 是朋友，Justin 和 Mick 也是。问题是 Jason 和 Mick 是否也是。这种情况被称为以 Justin 为中心的三角形。如果\
  \ Jason 和 Mick 不是朋友，则被称为*开*三角形（open triangle），而如果他们是朋友，则被称为*闭*三角形（closed triangle）。大多数闭三角形的网络具有高度的凝聚力。在社交网络中，这意味着有共同朋友的人可能彼此认识。相反，具有许多开三角形的网络可能表明凝聚力不强，但也表明数据不完整：人们可能没有在社交媒体上添加所有现实中的朋友，情报数据可能不包含恐怖分子小组之间的所有通信形式，等等。在任何现实环境中，都可能存在尚未被记录的关系。\n\
  \n量化三元闭合的一种方法是通过传递性（transitivity），它为每个顶点分配以其为中心的三角形中闭三角形的比例。在社交网络中，你的传递性是你的两个朋友彼此认识的概率。让我们将以下添加到\
  \ Listing 2-6 的绘图集中：\n\n```\n#compute and plot transitivity for each vertex in Farrelly's\
  \ social network\nplot(g_social,vertex.size=20*transitivity(g_social,type=\"local\"\
  ,isolates=\"zero\"),vertex.label.cex=0.8,vertex.color=2)\n```\n\n将参数 `type` 设置为\
  \ `local` 让 igraph 计算每个顶点周围的传递性，并将参数 `isolates` 设置为 `zero` 强制度为 1 的顶点得分为 0（否则将为\
  \ NaN，因为度为 1 的顶点没有以其中心的三角形）。图 2-11 显示了生成的图。\n\n\n\n\n这从另一个角度显示，医学院社区比退伍军人社区更具凝聚力、联系更紧密。在同一课程中参加同类课外活动的医学生可能彼此认识并交流。然而，请注意，Farrelly\
  \ 的 `V7` 在医学院人员中的传递性得分较低，这意味着尽管该群体整体关系紧密，但 Farrelly 的几位医学院朋友之间并不互相认识。（`V7` 的传递性还因为\
  \ Farrelly 的医学院朋友中没有与退伍军人组的朋友 `V10` 认识而被降低。）\n\n### 顶点的效率与离心率\n回想我们过的两个中心性指标——紧密性（closeness）和中介性（betweenness），是根据网络中最短路径（或\
  \ `geodesics`）的长度定义的。另一个基于最短路径的有趣指标称为效率（efficiency），它对每个顶点的定义如下：移除目标顶点，然后计算该顶点所有邻居节点之间产生的网络距离。然后，取这些距离的倒数的平均值。移除顶点就像制造了一个路障，而邻居节点之间的距离衡量了由于路障而必须绕行的额外路程长度。这些距离的倒数意味着路程越长，效率越低，反之亦然。效率衡量了流量绕过网络中每个顶点的难易程度。\n\
  \n效率是探测网络局部几何结构的一种有用方法。这里的“局部”（local）一词意味着我们正在探索每个顶点附近的网络几何结构；这与紧密性和中介性不同，后者更具全局性，因为它们涉及跨越整个网络的路径。我们将效率的计算添加到\
  \ Listing 2-6 中。我们需要一个额外的库来完成此操作：\n\n```python\n# 加载 igraph 的 brainGraph 库\nlibrary(brainGraph)\n\
  \n# 计算 Farrelly 社会网络中每个顶点的效率\nefficiency(g_social,type=\"local\")\n```\n\n我们没有展示此图的气泡图，因为它看起来与图\
  \ 2-11 中的传递性图极其相似。事实上，该网络传递性得分与效率得分之间的相关性为 0.96。在其他网络中，尤其是更大、更复杂的网络，情况可能如此。需要注意的是，传递性是一个极局部的指标，因为它只考虑邻居顶点以及它们之间的边。相比之下，效率在本质上是局部的，但它可以访问网络较大的部分，因为路障造成的绕行可能会延伸到直接邻居集合之外。\n\
  \n另一个基于路径的顶点指标——像紧密性和中介性一样能看到网络的全局几何结构——离心率（eccentricity），它为每个顶点分配从该顶点到网络中任何其他顶点的最大距离。这衡量了每个顶点的边缘性，因此较低的离心率得分通常表示顶点更中心。我们稍后会回到这个指标。\n\
  \n### Forman–Ricci 曲率\n里奇曲率（Ricci curvature）是几何学中的一个概念，用于衡量曲面上表面直线的畸变程度以及这种畸变增长或收缩的速率。你可以将其想象为某种力，将直线扭曲成弯曲路径（就像在湿纸巾上压一个小手力器）。请参见图\
  \ 2-12，图中展示了图中从左到右里奇曲率增加的概念性插图。\n\n![图 2-12: 直线的中点通过通过里奇曲率增加的空间（从左到右）滑动而发生变形](img/f02012.png)\n\
  \n图 2-12: 直线的中点通过通过里奇曲率增加的空间（从左到右）滑动而发生变形\n\n该概念从连续几何到网络领域的一种适配被称为 Forman–Ricci\
  \ 曲率。计算 Forman–Ricci 曲率的第一步是为网络中的每条边分配一个数字，衡量该边紧邻区域内网络的离散程度。使用的数字是 2 减去连接该边的两个顶点的度之和；这是与该边相邻的边的负数。例如，在\
  \ Farrelly 的社会网络（图 2-5）中，`V7` 和 `V10` 之间的边 Forman–Ricci 曲率为 –8（源于 `V7` 的六个非 V10\
  \ 邻居和 `V10` 的两个非 V7 邻居）。\n\n接下来，我们使用这些边得分为顶点分配得分，如下：顶点的 Forman–Ricci 曲率是连接到该顶点的边的\
  \ Forman–Ricci 曲率之和。Forman–Ricci 曲率几乎负的，因此在可视化时，我们通常使用它的相反数。在 Listing 2-8 中，我们计算了\
  \ Farrelly 社会网络的 Forman–Ricci 曲率，并使用其相反数作为顶点大小和边宽进行绘图。\n\n```python\n# 计算所有顶点的度\n\
  d<-degree(g_social)\n\n# 计算边并初始化曲率值向量\nl<-length(E(g_social))\nfrc<-rep(NA,l)\n\n\
  # 循环计算并存储 Forman-Ricci 边曲率\nfor (I in 1:l){\n  w<-as.vector(ends(g_social,E(g_social)[i],names=F))\n\
  \  frc[i]<-2-d[w]]\n}\n```\n\n\n\n最简单的全局指标是网络中的顶点数和边数。与这些指标密切相关（但通常更有用）的是`density`（密度），它是网络中的边数除以该顶点集上可能出现的最大边数。一个具有\
  \ `n` 个顶点的无向网络最多有\n\n![c02eq001](img/c02eq001.png)\n\n条边（不允许有自环或重边），而有向网络的最大边数是该数量的两倍。密度提供了一个衡量网络互连程度的粗略度量；它在\
  \ igraph 中通过 `edge_density()` 函数进行计算。图 2-14 展示了具有不同密度的某些网络。\n\n![图 2-14：顶行的三个网络密度均为\
  \ 25%，而左下角和右角的网络密度分别为 50% 和 75%。](img/f02014_m.png)\n\n图 2-14：顶行的三个网络密度均为 25%，而左下角和右角的网络密度分别为\
  \ 50% 和 75%。\n\n网络中的平均度（average degree）也可以是一个非常有用的全局指标，但它包含与密度完全相同的信息，并与之完全相关。事实上，平均度是所有顶点度之和除以顶点数，而所有顶点度之和始终是边数的两倍。因此，平均度和边密度之间的差异取决于一个仅取决于网络中顶点数量的常数。因此，你可以使用其中一种指标，但同时使用两者并不会获得额外收益。\n\
  \n在前节中讨论的传递性（transitivity）概念（量化三元闭合）也有其全局对应概念。在 igraph 的 `transitivity()` 函数中将 `type`\
  \ 参数设置为 `global` 时，会计算出一个数值，表示网络中闭合三角形的比例。这提供了另一种不同于边密度的方法，来衡量网络的整体互连性。\n\n### 网络上的传播过程\n\
  \n更分散的网络的行为往往与更紧凑的网络不同。例如，考虑三个朋友——Amara、Imani 和 Taraji，她们在午餐桌上互相分享新闻。我们预想这些女孩在桌子上交换信息会比她们在不同的教室里互相发短信或在走廊里相遇时聊天要容易。让我们来看几种量化网络传播的不同方法。\n\
  \n在 igraph 的 `efficiency()` 函数中将 `type` 参数设置为 `global`，可以得到该指标的全局版本，它计算网络中所有顶点对之间距离的倒数的平均值。这种效率的全局变体不涉及任何道路阻碍。高度互连的网络往往具有较高的全局效率，因为高互连性意味着顶点之间有许多直接路径，但从总的来说，最好将全局效率视为衡量网络紧凑性的度量。网络越分散，其全局效率就越低。\n\
  \n我们还可以计算网络的 `diameter`（直径）。`diameter` 是网络中任意两个顶点之间最短路径长度的最大值。可以在 igraph 中使用 `distances()`\
  \ 函数计算 `diameter`。\n\n### 网络的谱度量\n\n我们已经看到邻接矩阵的特征向量在连接性中起着重要作用。谱度量（spectral measures）基于邻接矩阵的特征值。令\
  \ `lambda_1`、`lambda_2`, ..., `lambda_n` 为非递减排序的邻接矩阵特征值。由于 igraph 的 `spectrum()`\
  \ 函数可选地返回邻接矩阵的所有特征值和特征向量，“谱隙”（spectral gap，即最大特征值 `lambda_1` 与 `lambda_2` 之差）控制了网络上某些算法和随机过程的收敛时间。其他有谱度量基于邻接矩阵的变体，称为\
  \ `graph Laplacian`（图拉普拉斯），通过对邻接矩阵取反并将每个顶点的度添加到相应的对角元素中得到。图拉普拉斯特征值 0 的重数是连通分量的数量。图拉普拉斯最小非零特征值被称为\
  \ `algebraic connectivity`（代数连接性）；这是网络连接性的度量，反映了将网络碎片成更小片段的难度。Farrelly 的社交网络代数连接性较低，因为删除一个顶点就会将网络分为退军人组和医学院组。\n\
  \n列表 2-9 显示了如何计算图拉普拉斯矩阵并从中提取连通分量的数量和代数连接性。\n\n```\n#计算网络 g 的图拉普拉斯矩阵\nlap<-laplacian_matrix(g)\n\
  \n#计算特征值并四舍五入以避免数值问题\nevals<-round(eigen(lap)$values,digits=5)\n\n#计算连通分量的数量\nsum(evals\
  \ == 0)\n\n#计算代数连接性\nunique(evals)length(unique(evals))-1\n```\n\n列表 2-9：计算网络 `g`\
  \ 图拉普拉斯矩阵并从中提取连通分量数量和代数连接性的脚本。\n\n例如，在[图 2-15 所示的两个网络上运行此代码，可以得到七个连通分量，左侧网络的代数连接性为\
  \ 0.062，右侧网络的代数连接性为 0.09。\n\n\n\n\n\n如果你想比较不同规模网络之间的得分，最好使用归一化拉普拉斯矩阵；要做到这一点，只需在列表\
  \ 2-9 第一行计算图拉普拉斯矩阵时设置 `normalized=T` 即可。\n\n## 真实世界行为的网络模型\n\n有几种类型的网络是真实世界行为的重要模型；这些模型为比较真实世界网络和数据提供了有用的基准。让我们从构建最简单的一种类型开始。\n\
  \n### Erdös–Renyi 图\n\n`Erdös–Renyi graphs`（Erdös–Renyi 图）是根据顶点对集合均匀分布随机生成边的网络。这些网络在\
  \ `igraph` 中通过 `sample_gnp()` 函数创建。图 2-15 中的两个网络都是通过使用 `sample_gnp(50,0.05)` 生成的，它创建了一个具有\
  \ 50 个顶点和 5% 边概率的网络。通过这种方式创建的图密度将接近指定的边概率，但不一定等于它——就像反复抛掷均匀硬币并不总是得到恰好的一半正面和一半反面一样。图\
  \ 2-14 中的网络也是用 `sample_gnp()` 创建的。\n\nErdös–Renyi 图提供非常有用的零假设。如果你认为你的网络高度结构化，那么它的边应该非常远离均匀分布，因此网络看起来或表现起来不像\
  \ `Erdös–Renyi` 网络。在接下来的两个章节中，我们将看到如何实现这一想法。Erdös–Renyi 图在自然界并不常见，特别是在社会驱动的环境中。真实网络总是比这种纯随机边的网络更具结构性。\n\
  \n### 无标度图\n\n`scale-free graph`（无标度图）是指度分布渐近遵循幂律的网络，这意味着存在一个常数 `c`，使得度为 `2*d` 的顶点比例是度为\
  \ `d` 的顶点比例的 `1/2^(*c*)` 倍（至少近似如此，且近似值随着 `d` 的增加变得越来越准确）。常数 `c`（称为 `power`）通常位于\
  \ 2 和 3 之间。这种幂律特性导致存在许多顶点的度远高于网络中的平均度。因此，无标度网络通常具有松散连接的枢纽组成的“辐辐”形状，就像连接中央安检口的机场航楼楼。网络中的枢纽倾向于缩短顶点之间的距离，赋予这些网络某些“小世界”属性。\n\
  \n这些网络拥有迷人的历史和完善的理论，我们没有空间深入探讨。该领域一个有趣的争论是，许多自然产生的网络是否是无标度的——包括互联网页面、社交网络、生物网络，甚至航空旅行网络——如果是的话，原因可能是什么。\n\
  \n生成无标度网络有多种方法；其中比较流行的选项是在 `igraph` 中通过 `sample_pa()` 函数方便地实现。它依赖于著名的 Barabási–Albert\
  \ 模型。\n\n### Watts–Strogatz 图\n\n`Watts–Strogatz graphs`（Watts–Strogatz 图）是由 1998\
  \ 年引入的一种随机图模型生成的网络，它倾向于比无标度图产生更多的小世界特性，例如紧密连接的社区和许多顶点之间较小的网络距离。这些网络经常包含由冗余和替代路线强化的路径。它们在生物学和社会过程中很常见。例如，神经元水平和功能区域层面的大脑连接网络、选民网络、社交媒体平台上的影响者网络以及食物网通常形成\
  \ Watts–Strogatz 网络。\n\n由于我们已经看到了一些 Erdös–Renyi 图的示例（见图 2-14 和图 2-15），让我们创建一些其他类型的网络。在图\
  \ 2-16 中，我们使用 `sample_pa(100,power=2.5,directed=F)` 生成了无标度网络，并使用 `sample_smallworld(1,100,2,0.05)`\
  \ 生成了两个 Watts–Strogatz 网络。我们留给感兴趣的读者查阅 `igraph` 文档来学习后一个函数的参数选择。\n\n![图 2-16: 两个无标度网络（顶部）和两个\
  \ Watts–Strogatz 网络（底部）](img/f02016_m.png)\n\n图 2-16：两个无标度网络（顶部）和两个 Watts–Strogatz\
  \ 网络（底部）\n\n第一行的无标度网络每个都有一个显著的枢纽，左侧的网络还有一个不那么明显的次级枢纽。想象这些是电网连接，那么摧毁主枢纽的风暴对无标度网络影响的客户将远比对\
  \ Watts–Strogatz 网络的影响得多。这就是为什么许多计划中的真实网络符合富冗余的结构。Watts–Strogatz 网络没有像无标度图那样的强枢纽，但它们具有纯随机\
  \ Erdös–Renyi 图中未看到的结构。例如，之前提到的长强化路径结构在这些底部图中很容易。\n\n## 总结\n\n本章以一个简短的章节开头，解释了数据科学中对网络的需求以及网络科学中对几何的需求。接下来，我们介绍了网络以及涉及其中的对象——顶点、边、路径等。然后，我们定义并探索了一系列用于量化网络和顶点各种属性的指标。本章以几个常用的随机图模型结束，这些模型用于生成合成网络数据，以便与真实网络数据进行比较。\n\
  \n# 3 网络分析\n\n![](img/chapterart.png)\n\n在第 2 章中，我们考虑了一些网络几何指标；在本章中，我们将使用它们。首先，我们将解释顶点指标如何允许你在网络内进行监督学习，即预测与顶点相关的值以及预测网络中的新边；我们还将查看顶点指标如何使你对网络中的顶点进行聚类。然后，我们将讨论一些直接在网络几何结构中运行的聚类算法。接下来，我们将解释如何使用全局网络指标对由网络组成的数据集进行机器学习和统计分析。随后，我们将探索流行病学中易感、感染和康复（SIR）模型的网络变体。通过这个模型，我们可以看到实体（从疾病到虚假信息）是如何通过网络传播的，以及网络几何如何影响这种传播。最后，我们将研究如何使用顶点指标来制定针对性策略以破坏这种传播。\n\
  \n## 使用网络数据进行监督学习\n\n网络数据通常伴随着一个传统的结构化数据集，其中行与网络中的顶点对应。例如，你可能有一个社交网络数据集，它由个人列表（顶点）、他们之间的朋友关系（网络中的边）以及一个或多个数值或类别列组成，提供每个人的额外的非网络信息——例如年龄、性别或薪水。我们可能想将此视为一个监督学习问题，即训练机器学习算法来预测其中一个数据列。这种的方法是使用顶点指标作为自变量（连同任何其他数据列），这让算法在做出预测时考虑每个顶点的网络角色。让我们尝试一下。\n\
  \n### 使用社交媒体网络指标进行预测\n\n\n\n\n\n让我们回到 Farrelly 的社交网络，我们在上一章节中分析了该网络，用以说明不同的顶点中心性衡量标准。网络不同部分之间的桥梁，或紧密连接几位医学院朋友的枢纽，如何影响\
  \ Farrelly 在医学院第一学期在日记中提到这些人的频率？让我们来看看网络指标如何与该社交网络中的日记提及相关。\n\n我们将选择几个顶点中心性指标，并将\
  \ Farrelly 的日记数据作为集合中的因变量。让我们加载数据，并参考列表 3-1 检查因变量的分布。\n\n```r\n#import dataset\n\
  g<-read.csv(\"SocialNetworkModel.csv\")\n\n#create a histogram of the data\nhist(g$Diary.Entries,main=\"\
  Diary Entry Histogram\",xlab=\"Diary Entries\")\n```\n\n列表 3-1：用于进一步分析导入相关 `*.csv`\
  \ 文件的脚本\n\n图 3-1 显示了因变量分布的直方图（泊松分布）。\n\n![图 3-1：Farrelly 社交网络日记条数据的直方图](img/f03001.png)\n\
  \n图 3-1：Farrelly 社交网络日记条数据的直方图\n\n通常，计数变量（如符合泊松分布的变量）包含大量的零和接近零的值，以及一些大值。我们可以从图\
  \ 3-1 看出这种结果符合泊松分布。泊松分布变量可能会给机器学习算法带来问题，因为它们涉及大量的零和一些离群值，例如涉及 `V10` 的日记条目）。这表明与其他机器学习算法相比，广义线性模型（泊松回归）作为监督学习模型可能更合适。网络中的大多数人在整个学期内被提到的次数很少（如果根本没有被提到）。然而，存在少数离群值，包括\
  \ Farrelly 和她在网络中最密切的朋友（`V3`、`V10` 和 `V14`）。让我们深入研究，看看中心性衡量标准如何预测日记提及情况。在列表 3-2\
  \ 中，我们对 Farrelly 社交网络的感兴趣指标进行采样，并将其作为泊松回归模型中的独立变量。\n\n```r\n#create a training sample\
  \ from Farrelly's social network metrics\nn<-dim(g)[1]\nset.seed(10)\ntrain.index=sample(1:n,15)\n\
  train<-g[train.index,]\n\n#build a Poisson regression model\ngl<-glm(Diary.Entries~.,data=train,family=\"\
