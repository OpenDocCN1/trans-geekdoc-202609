  \               0\n```\n\n在这个个人聚类中，没有报告抑郁症或校外学习。一些个人报告了校园欺凌、教师敌意、无聊、补习课程或缺乏动力。让我们将其与聚类图中发现的较大类进行对比：\n\
  \n```r\n#较大的聚类\nmydata[c(3,4,6,8,12,16,18),]\n```\n\n这应该输出类似所示的内容：\n\n```r\n> mydata[c(3,4,6,8,12,16,18),]\n\
  \    IQ Bullying Teacher.Hostility Boredom Depression Lack.of.Motivation\n3  155\
  \        0                 0       0          0                  0\n4  155     \
  \   0                 0       0          0                  0\n6  174        0 \
  \                0       1          1                  1\n8  170        0      \
  \           0       0          0                  0\n12 175        0           \
  \      1       0          0                  0\n16 160        0                \
  \ 1       0          0                  0\n18 185        0                 0   \
  \    0          0                  1\n   Outside.Learning Put.in.Remedial.Course\n\
  3                 1                      0\n4                 1                \
  \      0\n6                 1                      1\n8                 0      \
  \                1\n12                1                      1\n16             \
  \   1                      1\n18                1                      0\n```\n\n\
  与第一个聚类相比，这些人个人大多报告了校外学习且没有欺凌。这似乎区分了学校内的学习经历。在校外学习和不处理欺凌可能与学生的学习成果和整体学校体验有关。\n\n\n\
  \n\n```python\n#compute Manhattan distance for set 2\nmm2<-dist(set2,\"manhattan\"\
  ,diag=T,upper=T)\n\n#create the Vietoris-Rips complex\nd2<-calculate_homology(mm2,dim=1,format=\"\
  cloud\")\n\n#plot persistence diagrams—circles=connected components, triangles=loops\n\
  plot_persist(d2)\n```\n\n请注意，我们已经将分析的数据集更改为完整样本中的第二组个体。这创建了一个在理论上应属于同一人群的比较集；在例例中，分析中得出了更多潜在的子群体。图表看起来类似于图\
  \ 7-3 所示。\n\n![Figure 7-3: 模拟数据的另一个持久性图，这次使用了不同的参数来模拟数据](img/f07003.png)\n\n图 7-3:\
  \ 模拟数据的另一个持久性图，这次使用了不同的参数来模拟数据\n\n在图 7-3 中，我们看到了几个与图 7-1 样本相似的独特群体。我们还看到了一些对应于 Betti\
  \ 数 1 的点；然而，考虑到它们离线条非常近，这些点很可能是噪声。点离对角线越远，它越是数据集中的真实特征的可能性就越大。这些新的 Betti 数特征与我们之前的样本不同，但可能不是真实特征。\n\
  \n使用 `TDAstats` 包计算图与图之间的距离很容易。将以下几行添加到你的脚本中：\n\n```python\n#calculate distance\
  \ between diagrams\nw<-phom.dist(d1,d2,limit.num=0)\nw\n```\n\n这计算了图 7-1 和图 7-3\
  \ 所示的 0 阶和 1 阶同调持久性图之间的距离，得到的距离约为 10.73（0 阶调）和 0.44（1 阶调），尽管这些值可能会根据你使用的 `R` 版本而变化。现在可以计算从原始样本中抽取的随机样本之间的距离了。`TDAstats`\
  \ 包提供了一种方便的方法在函数内部进行计算，这样我们不需要自己编写整个测试。让我们把这些部分添加到脚本中：\n\n```python\n#compute permutation\
  \ test and examine p-values from output\npermutation_test(d1,d2,iterations=25)\n\
  ```\n\n该脚本现在将在两个样本的特征之间进行置换检验，为每个计算出的同调层产生测试统计量和 p 值。正如预期的那样，我们的 0 阶同调差异在 95% 的置信水平下显著（`p`\
  \ = 0.08）。鉴于我们的第一个样本中没有任何 1 阶同调特征，我们确实看到样本之间的 1 阶同调差异存在显著性；然而，统计量本身为 0，这表明这是一个人为的结果。\n\
  \n虽然这个例子涉及一个没有进行实际问调查的便利样本，但它确实与跨人群样本实施的真实心理测量工具如何通过持久同调进行验证有关。我们也可以使用这种方法来比较差异。\n\
  \n## 使用 Mapper 算法进行子群体挖掘\n\n在数据科学中，我们经常面临数据具有极端值的聚类问题。Mapper 算法——将持久同调、分箱和聚类的某些概念结合起来生成图或单纯复——是子群体挖掘的另一个有用工具。\n\
  \n### 逐步理解 Mapper 算法\n\nMapper 算法的基本步骤涉及使用标量值函数过滤点云；然后我们将数据分离到重叠的箱（bins），在每个箱内进行聚类，并将簇连接成一个图。为了可视化这一点，让我们考虑一个简单的点云。查看图\
  \ 7-4 中的结果。\n\n![Figure 7-4: 一个由梯度定义的 Morse 函数的多态对象](img/f07004.png)\n\n图 7-4: 一个由梯度定义的\
  \ Morse 函数的多态对象\n\n现在，这个形状可以被分成重叠的箱。这允许我们看到函数值略有不同的区域之间潜在的有趣关系，这些关系在我们应用聚类算法时（如图\
  \ 7-5 所示）将变得相关。\n\n![Figure 7-5: 通过梯度对图 7-4 进行分箱的结果](img/f07005.png)\n\n图 7-5: 通过梯度对图\
  \ 7-4 进行分箱的结果\n\n现在我们对函数进行了分箱（图 7-5），我们可以开始聚类。跨箱的聚类可能会比简单应用聚类算法复杂一点。这种聚类是为了定义复形以及跨箱簇的重叠。在每个箱中进行聚类并结合结果以理解跨箱簇的连接性将给出最终结果。Mapper\
  \ 算法的优势是结果可以很容易地可视化为图或单纯形；我们示例的最终结果可能会输出类似于图 7-6，两个两个群体从一个连接它们的点演化出来。\n\n![Figure\
  \ 7-6: 通过对图 7-4 的结果进行分箱定义的簇](img/f07006.png)\n\n图 7-6: 通过对图 7-4](#c07.xhtml#figure7-4)\
  \ 的结果进行分箱定义的簇\n\n\n\n\n\n`Mapper` 算法相比其他聚类方法具有若干优势，而拓扑数据分析（TDA）相比于其他方法也具有优势。对数据中微小扰动（噪声）的不不变性使得\
  \ `Mapper` 比 `k-means` 更健健性，后者对不同的起始种子非常敏感，且每次运行可能会产生截然不同的结果。（注意：`Mapper` 对参数变化敏感，但对添加噪声的重复运行相当健壮）。结果的压缩或可视化使得高维数据的聚类结果变得易于可视化。由于不依赖于坐标系，我们能够比较来自不同标度或从不同平台收集的数据。此外，`Mapper`\
  \ 可以处理聚类重叠，这给 `k-means` 算法及其变体带来了巨大挑战。最后，`Mapper` 处理稀疏性和离群值的能力使其优于 `DBSCAN`。这使得它非常适用于小型数据集、预测变量可能多于观测值的数据集或可能包含大量噪声的杂乱数据。\n\
  \n### 使用 TDAmapper 寻找数据中的聚类结构\n\n`TDAmapper` R 包提供了 `Mapper` 算法的实现，可以处理许多类型的处理后数据。在本示例中，我们将再次回到来自天赋型\
  \ Quora 用户样本的自报告教育数据集。该数据集包含七个主要的学校问题（欺凌、教师敌意、无聊、抑郁、缺乏动力、课外学习、参加补习课程），涵盖了 22 个人，这些个人在天赋范围内评分，并讨论了至少一个感兴趣的问题。目标是理解该样本内部问题之间的关系（类似于在测量中创建子量表）。这是二值数据，因此我们将使用反向汉明距离（inverse\
  \ Hamming distance）来获取距离矩阵。`Hamming distance` 通过衡量二进制字符串的逐位差异来获取不相似性测量。其他距离也可以用于二值数据，但\
  \ `Hamming distance` 能够地比较在二值变量上评分的个体之间的整体差异。\n\n让我们在 Listing 7-2 中加载数据并做好分析准备：\n\
  \n```\n\n# 加载数据并清洗\nmydata<-read.csv(\"QuoraSample.csv\")\nmydata<-mydata[,-1]\n\
  \n# 加载 Mapper, igraph 和距离包\nlibrary(TDAmapper)\nlibrary(igraph)\nlibrary(e1071)\n\
  \n# 处理数据以转换为距离矩阵\ndf<-data.frame()\nfor (j in 1:7){\n  for (i in 1:7){\n    df[i,j]<-1/(hamming.distance(mydata[,i],mydata[,j]))\n\
  \  }\n}\ndf[df>1]<-1\n```\n\nListing 7-2：加载并处理数据以获取距离矩阵的脚本\n\nListing 7-2 中的代码加载了我们的数据集以及分析所需的包，然后处理数据以获得距离矩阵，以输入\
  \ `Mapper` 算法。其他距离也可以用于二值数据，但 `Hamming distance` 能够很好地比较在二值变量上评分的个体之间的整体差异。\n\n\
  现在让我们应用 `Mapper` 算法。我们将 `Mapper` 设置为使用具有 70% 重叠率的三个区间来处理距离矩阵，并设置三个箱（bins）进行聚类。在小型数据集上，较高的重叠参数会促进跨箱的聚类之间的连通性；在实践中，30%\
  \ 到 70% 之间的设置通常会产生良好的结果。此外，区间和箱的小数量对应于该数据集中待聚类实例的大半，这在实践中通常效果良好。通常，使用不同的参数设置是有用的，因为结果会取决于起始参数；最近的几篇论文表明，使用固定参数的\
  \ `Mapper` 算法在结果方面并不完全稳定。我们还将根据最小和最大汉明距离设置 `Filter` 值。我们可以通过在 Listing 7-2 的脚本中添加这些行来实现这两点：\n\
  \n```\n## 应用 mapper\nj<-mapper1D(as.matrix(df),num_intervals=3,percent_overlap=70,\
  \ num_bins_when_clustering=3,\nfilter_values=c(0.025,0.05,0.075,0.1,0.125,0.15,0.2))\n\
  summary(j)\nj$points_in_vertex\n```\n\n此代码按照之前设置参数在数据上运行 `Mapper` 算法。`summary` 给出了\
  \ `Mapper` 对象中关于结果的对象列表。顶点（vertex）内点的摘要为我们提供了这些变量如何分离成聚类的信息。\n\n探索 `Mapper` 对象可以让我们对哪些问题聚类在一起产生洞察。我们可以从\
  \ `Mapper` 对象中收集大量信息，但这种探索将限于理解数据集中的哪些点最终进入 `Mapper` 对象中的哪个聚类（顶点）。让我们查看我们向 Listing\
  \ 7-2 中最后添加的内容的输出：\n\n```\n$points_in_vertex\n$points_in_vertex [[1]]\n[1] 1\n\n\
  $points_in_vertex [[2]]\n[1] 2\n\n$points_in_vertex [[3]]\n[1] 3\n\n$points_in_vertex\
  \ [[4]]\n[1] 4\n\n$points_in_vertex [[5]]\n[1] 5\n\n$points_in_vertex [[6]]\n[1]\
  \ 3 4 5 6\n\n$points_in_vertex [[7]]\n[1] 4 5\n```\n\n通过探索 `Mapper` 对象可以让我们对哪些问题聚类在一起产生洞察。我们可以从\
  \ `Mapper` 对象中收集大量信息，但这种探索将限于理解数据集中的哪些点最终进入 `Mapper` 对象中的哪个聚类（顶点）。让我们查看我们向 Listing\
  \ 7-2 中最后添加的内容的输出：\n\n（注：此处原文最后一行有截断，已按逻辑对齐）\n\n\n\n\n\n在本章中，我们将探索与同伦（homotopy）相关的算法，同伦是一种基于物体周围路径类型对拓扑对象进行分类的方法，包括基于同伦的回归参数计算。局部最小值和极大值经常困扰数据集：它们为在局部范围内探索解空间的算法提供了次优的停止点。在接下来的几页中，我们将看到同伦如何解决这个问题。\n\
  \n## 介绍同伦\n\n如果两条路径或函数可以在感兴趣的空间内连续地变形为彼此，那么它们就是相互同伦的（homotopic）。想象一个高尔夫球场和两个高尔夫球员，其中人的推杆比另更好。球可以通过许多不同的路径到达球洞。想象用绳子在果岭上勒出每一杆球的路径。一条路径可能非常直接；另一条在找到球洞之前可能会绕很多圈，特别是当果岭有起伏时。糟糕的高尔夫球员可能需要击多次，导致一条长而曲折的路径。但无论有多少个丘，或者高尔夫球进入球洞需要多少杆，我们都可以通过变形绳子来缩短这些路径中的每一条，如图\
  \ 8-1 所示。\n\n![Figure 8-1: 高尔夫球场通往球洞的长路径（左）变形为通往球洞的短路径（右）](img/f08001_m.png)\n\n\
  图 8-1：高尔夫球场通往球洞的长路径（左）变形为通往球洞的短路径（右）\n\n让我们稍微扩大一下类比，想象高尔夫球场出现了一个洞。带有洞的拓扑对象和空间会使这种变形过程复杂化，导致从一点到一点产生许多可能的路径。路径可以连接对象上的两点。根据对象的属性，这些路径有时可以足够“波动”到与另一条路径重叠，而无需将路径切断来绕过障碍（通常是洞）。绕过洞的路径为一条路径向另一条路径的连续变形带来了问题。路径无法绕过洞旋转或波动，以至于点与之间的路径必然与另一条路径重叠。随着洞以及洞周围路径的增加，不同类型的路径开始出现。一条路径在连接两点之前可能只绕洞转了一圈；另一条在连接两点之前可能绕洞转了好几圈。再次想象打高尔夫。假设果岭中间有一个障碍物（如岩石或水障），形成了一个环绕着复杂丘陵的圆环，这可能迫使糟糕的击球需要绕过岩石才能回到球洞，如图\
  \ 8-2 所示。\n\n![Figure 8-2: 环形球场（甜甜圈）上具有相同起点和终点的两条路径，在不切断或不移除内部洞的情况下无法相互变形](img/f08002_m.png)\n\
  \n图 8-2：环形球场（甜甜圈）上具有相同起点和终点的两条路径，在不切断或不移除内部洞的情况下无法相互变形\n\n在这种情况下，我们无法无法在不切断线条或不移除洞的情况下将路径变形为彼此。随着更多洞或更高维度洞的增加，更多等价路径类开始出现，等价路径绕过一个或多个洞的圈数相同。二维球场的发球台到球洞的可能路径比三维球场少，因为球场中可能的障碍和洞的类型较少。在许多不同维度上具有许多洞或障碍的空间提供了许多路径可以绕过的障碍。这意味着该空间存在许多独特的路径。\n\
  \n鉴于数据集通常包含不同维度的洞，数据中可能存在许多不同类的路径。在贝叶斯分析和机器人导航路径查找任务中常见的数据随机游走可能是不等价的。这在导航问题中可能是一个优势，允许系统从一组具有与长度、资源分配和移动易用性相关的不同代价权重路径中进行选择。例如，在图\
  \ 8-3 的路径查找中，可能障碍物 2 有尖锐端，如果系统靠得太可能会损坏，使得左侧的路径成为系统采取的理想路径。\n\n![Figure 8-3: 一个障碍赛示例，包含从起点到终点的导航，具有多个可能的解决方案](img/f08003.png)\n\
  \n图 8-3：一个障碍赛示例，包含从起点到终点的导航，具有多个可能的解决方案\n\n图 8-3 显示了三条路径，其中没有任何路径可以在不移动障碍物或切断路径的情况下变形为其他路径。这些是空间中的唯一路径。通过计算唯一路径的总数，我们可以从拓扑上对空间进行分类。\n\
  \n## 介绍基于同伦的回归\n\n如所述，数据集通常包含局部最优形式的障碍，即局部极大值最小值。梯度下降算法和其他逐步优化算法可能会卡在那里。你可以将这视为山山山谷的高维版本（鞍点，即高维拐点，也会带来优化问题）。卡在局部最优中为优化问题提供了不理想的解。\n\
  \n基于同伦的算法有助于估计包含许多局部最优值的高维数据中的参数，在这些情况下，梯度下降等许多常用算法可能会遇到困难。为了提供更深入的见解，考虑一个蒙眼的人试图通过图\
  \ 8-4。在没有绳的情况下，他们一定会撞到障碍物，并在被一个较大的障碍物挡住时可能认为自己已经击中了目标。\n\n![Figure 8-4: 蒙眼的人在障碍赛中导航](img/f0804.png)\n\
  \n图 8-4：蒙眼的人在障碍赛中导航\n\n然而，如果给他们一根连接起点和终点的绳子，他们可以在点之间导航得好一点，并知道他们遇到的任何障碍都可能不是真正的终点。连接起点和终点有许多方法。图\
  \ 8-5 显示了种可能的绳子配置。\n\n![Figure 8-5: 带有引导绳的蒙眼的人在障碍赛中导航](img/f08005.png)\n\n图 8-5：带有引导绳的蒙眼的人在障碍赛中导航\n\
  \n蒙眼的人努力避免物理障碍类似于机器学习算法避免局部最优。例如，让我们考虑一个列表 8-1 中导出的具有全局最小值和极大值但许多其他局部最优值的二变量函数。\n\
  \n```\n#load plot library and create the function\nlibrary(scatterplot3d)\nx<-seq(-10,10,0.01)\n\
  y<-seq(-10,10,0.01)\nz<-2*sin(y)-cos(x)\nwhich(z==min(z))\nwhich(z==max(z))\nscatterplot3d(x,y,z,main=\"\
  Scatterplot of 3-Dimensional Data\")\n```\n\n列表 8-1：创建一个具有全局最小值和极大值但许多其他局部最优值的二变量脚本\n\
  \n列表 8-1 中的代码产生了图 8-6 中的图，从图中我们可以许多许多和极大值。其他的最优值是局部最优，其中一些非常接近全局最小值或极大值。\n\n![Figure\
  \ 8-6: 三维数据的散点图，即具有许多局部最优值的函数](img/f08006.png)\n\n\n\n\n\n# 图 8-6：三维数据的散点图，即一个具有多个局部最优值的函数\n\
  \n试图优化此函数的算法可能会陷入其中一个局部最优值中，因为局部最优值附近的值相对于该最优值在增加或减少。某些已知在处理此类优化时存在困难的算法包括`gradient\
  \ descent` 和 `expectation-maximization (EM)` 算法等。诸如`evolutionary algorithms` 等优化策略也可能需要很长时间才能找到全局解决方案，使得它们对于这类数据来说并不理想。\n\
  \n基于同伦（Homotopy-based）的计算为局部最优陷阱问题提供了一个有效的解决方案；使用同伦计算的算法可以在局部最优值周围移动或跳出局部最优。本质上，这些算法从一个不存在局部最优值的简单优化问题开始，根据数据集及其几何结构缓慢地变形解，在变形过程中避开局部最优值。\n\
  \n如今机器学习中常用的基于同伦的优化方法包括支持向量机、`Lasso` 甚至神经网络。`R`语言的 `lasso2` 包是实现基于同伦模型的包之一；在这种情况下，`lasso2`\
  \ 为 `Lasso` 算法实现了一个基于同伦的模型。让我们首先探索 Listing 8-1 中生成的数据的模型拟合和解，其中结果具有许多局部最优值，且预测因子共线性，这是许多机器学习算法面临的问题。在\
  \ Listing 8-1 的代码中添加以下内容：\n\n```\n#partition into training and test samples\nmydata<-as.data.frame(cbind(x,y,z))\n\
  set.seed(10)\ns<-sample(1:2001,0.7*2001)\ntrain<-mydata[s,]\ntest<-mydata[-s,]\n\
  ```\n\n现在，模型已准备好构建和测试。我们关注的结果（我们的变量 `z`）不符合正态分布，但高斯分布是模型可用的最接近的分布。在 Listing 8-1\
  \ 脚本的后续部分，在开始模型迭代之前需要将 `etastart` 参数设置为 null，并且需要设置一个边界来引导同伦参数搜索。通常情况下，设置较低值最好：\n\
  \n```\n#load package and create model\nlibrary(lasso2)\netastart<-NULL\nlas1<-gl1ce(z~.,train,family=gaussian(),bound=0.5,standardize=F)\n\
  lpred1<-predict(las1,test)\nsum((lpred1-test$z)²)/601\n```\n\n该脚本现在对训练数据拟合基于同伦的\
  \ `Lasso` 模型，然后根据该模型预测测试数据结果，从而允许我们评估模型拟合情况。最后一行计算的该样本均方误差应接近 2.30。（再次，结果可能随 `R`\
  \ 版本而异，因为种子设定和采样算法发生了变化。）模型结果表明一项主导了函数的行为：\n\n```\n> las1\nCall:\ngl1ce(formula=z\
  \ ~ .,data=train,family=gaussian(),standardize=F,\n    bound=0.5)\n\nCoefficients:\n\
  (Intercept)           x           y\n 0.05068903  0.04355682  0.00000000\n\nFamily:\n\
  \nFamily: gaussian\nLink function: identity\n\n\nThe absolute L1 bound was     \
  \  :  0.5\nThe Lagrangian for the bound is :  1.305622e-13\n```\n\n这些结果（对于不同版本 `R`\
  \ 的读者来说可能会不同）显示只有一个变量被选为模型的重要变量。根据我们的模型，`x` 对 `z` 预测的贡献比 `y` 更大。鉴于 `x` 或 `y` 与 `z`\
  \ 之间存在非线性关系，线性回归并不是处理此问题的理想工具，但它确实在关系中发现了一些一致性。\n\n为了与另一种方法进行比较，让我们创建一个线性回归模型并添加到\
  \ Listing 8-1 中：\n\n```\n#create linear model\nl<-lm(z~.,train)\nsummary(l)\nlpred<-predict(l,test)\n\
  sum((lpred1-test$z)²)/601\n```\n\n最后一行计算的该样本均方误差应接近 2.30。（再次，结果可能随 `R` 版本而异，因为种子设定和采样算法发生了变化。）模型结果表明一项主导了函数的行为：\n\
  \n```\n> las1\nCall:\ngl1ce(formula=z ~ .,data=train,family=gaussian(),standardize=F,\n\
  \    bound=0.5)\n\nCoefficients:\n(Intercept)           x           y\n 0.05068903\
  \  0.04355682  0.00000000\n\nFamily:\n\nFamily: gaussian\nLink function: identity\n\
  \n\nThe absolute L1 bound was       :  0.5\nThe Lagrangian for the bound is :  1.305622e-13\n\
  ```\n\n这些结果（对于不同版本 `R` 的读者来说可能会不同）显示只有一个变量被选为模型的重要变量。根据我们的模型，`x` 对 `z` 预测的贡献比 `y`\
  \ 更大。鉴于 `x` 或 `y` 与 `z` 之间存在非线性关系，线性回归并不是处理此问题的理想工具，但它确实在关系中发现了一些一致性。\n\n## 样本结果比较\n\
  \n让我们回到教育数据集，探索学校、IQ 和自报告抑郁之间的关系。由于我们不知道这些预测因子与抑郁之间的函数应该是怎样的，因此不知道可能存在什么样的局部最优值。然而，我们知道具有\
  \ 7 个预测因子和 16 个人（数据的 70%）的数据集是稀疏的，局部最优可能是个问题。让我们创建 Listing 8-2 并数据划分为训练集和测试集。\n\n\
  ```\n#load data and set seed\nmydata<-read.csv(\"QuoraSample.csv\")\nset.seed(1)\n\
  \n#sample data to split into two datasets with stratified sampling\n#ensure more\
  \ balance in the training set with respect to depression\nm1<-mydata[mydata$Depression==1,]\n\
  m2<-mydata[mydata$Depression==0,]\ns1<-sample(1:4,3)\ns2<-sample(1:18,6)\ntrain<-rbind(m1[s1,],m2[s2,])\n\
  test<-rbind(m1[-s1,],m2[-s2,])\n```\n\n现在，让我们运行同伦 Lasso 模型和逻辑回归模型，以比较这个小型真实世界数据集的结果：\n\
  \n```\n#run the homotopy-based Lasso model\nlas1<-gl1ce(factor(Depression)~.,train,family=binomial(),bound=2,standardize=F)\n\
  lpred1<-round(predict(las1,test,type=\"response\"))\nlength(which(lpred1==test$Depression))/length(test)\n\
  \n#run the logistic regression model\ngl<-glm(factor(Depression)~.,train,family=binomial(link=\"\
  logit\"))\nglpred<-round(predict(gl,test,type=\"response\"))\nlength(which(glpred==test$Depression))/length(test)\n\
  ```\n\n\n\n\n通过运行之前脚本中添加的模型，我们应该看到基于同调连续（homotopy）的 Lasso 模型准确率（~85%）高于逻辑回归（~70%）；此外，逻辑回归模型输出了一条关于拟合概率出现\
  \ 0 或 1 的警告信息。这意味着数据被明显分成了几组，这在与结果有强关联的小型数据被拆分时可能会发生。取决于你使用的 `R` 版本或 GUI，你可能会得到不同的样本，从而导致略有不同的拟合统计数据和结果。由于初始样本量较小，你得到的可能会可能与此处展示的略有不同。某些样本在集中可能不包含给定预测变量的实例。更大的样本可以在跨样本的情况下创建更稳定的模型。\n\
  \n让我们更仔细地观察基于同调连续的 Lasso 模型及其系数：\n\n```\n> las1\nCall:\ngl1ce(formula=factor(Depression)\
  \ ~ .,data=train,family=binomial(),\n    standardize=F,bound=2)\n\nCoefficients:\n\
  \           (Intercept)                     IQ               Bullying\n        \
  \   -8.31322182             0.04551602             0.00000000\n     Teacher.Hostility\
  \                Boredom     Lack.of.Motivation\n            0.00000000        \
  \     0.51213722             0.00000000\n      Outside.Learning Put.in.Remedial.Course\n\
  \           -1.01281345             0.42953330\n\nFamily:\n\nFamily: binomial\n\
  Link function: logit\n\n\nThe absolute L1 bound was       :  2\nThe Lagrangian for\
  \ the bound is :  0.4815216\n```\n\n从之前的输出中我们可以看到，对于这个样本，较高的 IQ、产生无聊感以及被安排补习班增加了自述抑郁的概率。然而，校外学习具有很强的保护作用。事实上，校外学习可以完全抵消无聊和进入补习班带来的风险。这表明，对于经历学校问题的资赋儿童的父母，可以通过提供校外学习机会（例如晚间大学课程、校外辅导或其他学习机会）来缓解一些潜在的负面结果，如抑郁。\n\
  \n校外学习机会的作用在资赋文献中已在程度上得到了探索，结果相似，但关于这个主题还需要更多的研究。\n\n现在，让我们这些结果与逻辑回归模型的结果进行比较：\n\
  \n```\n> summary(gl)\nCALL:\nglm(formula=factor(Depression) ~ .,family=binomial(link=\"\
  logit\"),\n    data=train)\n\nDeviance Residuals:\n        20          21      \
  \     6          16          18           4\n 3.971e-06   1.060e-05    -3.971e-06\
  \  -3.971e-06  -2.110e-08\n        11           2          19\n-8.521e-06  -1.060e-05\
  \  -1.060e-05\n\nCoefficients:\n                         Estimate Std. Error z value\
  \ Pr(>|z|)\n(Intercept)            -7.297e+02  1.229e+06  -0.001        1\nIQ  \
  \                    3.934e+00  6.742e+03   0.001        1\nBullying           \
  \    -1.421e+01  5.193e+05   0.000        1\nTeacher.Hostility       2.798e+01 \
  \ 3.424e+05   0.000        1\nBoredom                -1.967e+01  8.765e+04   0.000\
  \        1\nLack.of.Motivation      4.174e+01  2.496e+05   0.000        1\nOutside.Learning\
  \       -6.535e+01  2.765e+05   0.000        1\nPut.in.Remedial.Course  1.121e+02\
  \  2.712e+05   0.000        1\n\n(Dispersion parameter for binomial family taken\
  \ to be 1)\n\n    Null deviance: 1.1457e+01  on 8  degrees of freedom\nResidual\
  \ deviance: 5.6954e-10  on 1  degrees of freedom\nAIC: 16\nNumber of Fisher Scoring\
  \ iterations: 24\n```\n\n检查之前的输出，似乎逻辑回归模型无法处理该数据集，产生了错误并输出了非常大的系数。这可能与数据量较小有关，导致线性系统是欠定的；然而，这并不是预测变量数量超过样本人数的情况，因此这可能是数据本身属性，而非仅仅是样本量的问题。\n\
  \n注意，模型未能找到任何自述抑郁的显著预测变量。线性回归无法很好地处理该数据集，结果不可靠。对于某些样本，某些变量在线性回归模型中可能无法计算。基于同调连续的模型（以及其他类型的模型）在小数据集上通常效果更好。\n\
  \n## 总结\n\n在本章中，我们概述了同调连续及其在机器学习中的应用，包括一个在模拟问题和真实数据集上的应用示例。同调连续可以帮助回归算法避免局部最优。同调连续在人工智能领域的其他用途还包括导航问题。例如，自动小车可能需要通过加权从当前位置到目的地的路径来导航医院的走廊和障碍。也可以设置边界以避免生成明显不可或不希望的路径（例如通过手术室）。拓扑数据分析这一分支在未来几年可能会增长，我们鼓励你探索同调连续在机器学习、机器人、微分方程和工程中的其他用途。\n\
  \n# 9 最终项目：分析文本数据\n\n![](img/chapter_art.png)\n\n在本章中，我们将通过一个与语言学和心理学相关的项目，整合之前章节开发的工具。今天许多重要的数据项目涉及文本数据，从文本匹配到机器人、客户情感分析以及作者鉴别和语言分析。我们将查看一个来自不同创意写作样本的语言特征小型数据集，观察语言使用如何随体裁变化；某些体裁鼓励不同的写作过程，反映了不同的作者心态，例如写随笔与随手创作俳句。\n\
  \n具体来说，我们将使用 `k-NN` 和我们选择的距离量来观察类重叠，然后通过减少数据集的维度来可视化特征空间，接着使用 `dgLARS` 创建根据特征区分诗类型的交叉验证模型，最后检查基于语言嵌入的预测模型。通过完成整个项目，我们将看到这些工具如何结合以从数据中得出见解。\n\
  \n## 构建自然语言处理流水线\n\n在第 1 章中，我们简要讨论了文本数据的重要性以及自然语言处理（NLP）流水线如何将文本数据转换为适合监督学习方法的模型特征。这是我们即将项目采取的方法。我们将使用\
  \ Python 将文本数据转换为特征，然后使用 R 分析这些特征。\n\n\n\n第一步是 `parse` 数据；我们必须将文本块分解为更易管理的单元——无论是段落内的句子，还是句子内的单词和标点符号。这允许我们分析短文本片段，并将结果组合成句子、文档，甚至一组文档。例如，在本章中，你可能想\
  \ `parse` 每个章节，然后每个段落，最后每个段落中的每个单词，以理解语言用法在介绍材料和应用示例之间是如何变化的。\n\n有时，你想要提取标点、某些类型的填充词或词根的后缀。`Root\
  \ words` 排除如 `ing` 等结尾，这些结尾会改变动词态或将一个词性转换为另一个。考虑一下篮球练习中 `dribble`、`dribbled` 和 `dribbling`\
  \ 之间的区别。如果控卫正在 `dribbling` 球，这个动作正在发生。如果他们已经 `dribbled` 了整场比赛，他们可能已经累了并把球放回了架上。然而，控卫的动作无论是过去还是现在都是相同的。他们现在正在做还是昨天做的并不重要。`Stemming`\
  \ 和 `lemmatizing` 是两种将单词分解为词根的方法：`stemming` 通过将单词还原为词根（无论该词根是否仍是一个单词）来实现；而 `lemmatizing`\
  \ 则以确保词根仍然单词的方式将单词还原为词根。\n\n一旦文本 `parsed` 到你特定应用所需的程度，你就可以开始分析每个片段。`Sentiment analysis`\
  \ 旨在理解给定文本中单词和短语背后的情感。例如，与“某些用户可能不喜欢该产品的气味”相比，““terrible product!!! never buy”的语调相当负面。情感分析通过统计文本中每种情绪的总数来量化文本中的情感，使每种情绪得到一个分数，并根据需要汇总成最终得分。\n\
  \n解析完成后，我们就可以应用 `named entity recognition`，它将单词与重要人物、地点或某个领域感兴趣的术语列表进行匹配。例如，在处理与患者出院和结果相关的医疗记录时，你可能想将单词与诊断列表进行匹配。\n\
  \n在其他应用中，标记词性（包括代词、动词、介词、形容词等）可能非常重要。有些人使用某些词性的频率可能比其他人更高，理解这些模式可以洞察文本来源的个性、临时心情，甚至是真实性。对于某些\
  \ NLP 应用，可以将这些因素加载到给定的结果或一组结果中，从文本数据中创建完全全新的指标。\n\n这些分析类型的每一种都可以集成到关系数据库中，作为下游模型的额外特征。例如，正如我们在章稍后部分看到的，我们可以标记词性，根据特定文档的长度对其进行归一化，并将这些特征输入模型。你还可以对文档或一组文档中存在的单词进行向量化，以计算给定文档在文档集中存在的每个单词的频率。这通常出现在\
  \ NLP 应用中的深度学习模型和可视化方法之前。\n\n再次，由于 `R` 与 `Python` 相比其 NLP 能力有限，我们在 Python 中完成了这第一步——将文本数据解析为特征——并在书中的文件中提供了结果数据。随后我们将使用\
  \ `R` 进行分析。我们使用 Python 的 `NLTK` 工具包来解析文本数据，虽然这些步骤超出了本书的范围，但我们已将脚本包含在 Python 下载仓库（`https://nostarch.com/download/ShapeofData_PythonCode.zip`）中，并鼓励你利用提供的原始数据，看看是否可以构建出类似的\
  \ NLP 流水线。\n\n## 项目：分析诗歌中的语言\n\n现代诗歌包含许多类型的诗，具有不同的结构、文学修辞和主题。例如，格律诗（如十四行诗或村庄歌曲）每行都有固定的重音节和总音节数，并有定义的韵脚。这些类型的诗歌通常大量使用其他文学手法，如典用（allusion）、奇喻（conceit，通过并置思想引用其他作品）、头韵或押韵（特定声音的重复）或格律（诗行中重音音节的模式）。这是一个格律诗（首十四行诗）的示例：\n\
  \n> Ever After\n> Her glass slipper turns to his M-16,\n> her elegant dress to faded\
  \ fatigues.\n> He’s a shell of the man from their intrigues,\n> served five months\
  \ patrol away from his queen.\n> Cinders to palace, her dreams now rubble,\n> she\
  \ watches her carriage morph to Abrams tank,\n> as if her fairy tale were some cruel\
  \ prank.\n> He shouts, “Hurry, men! March on the double!”\n> Her clock strikes twelve,\
  \ his tank an IED,\n> and widower’s daughter is left widow.\n> She has but memories,\
  \ now as shadows,\n> to comfort her dark days of misery.\n> Her ever after has no\
  \ tomorrow,\n> leaving Cinderella grief and sorrow.\n\n相比之下，自由诗的每行结尾没有定义的韵脚，行长可能不一（或者保持一致的长、短或中等），并且倾向于使用格律或韵脚等文学手法来强调特定篇目。这是一个短句自由诗的示例：\n\
  \n> Anya\n> Gaunt,\n> made-up,\n> wobbling in heels\n> too big for tiny feet,\n\
  > heels\n> that sparkle and clack\n> against cold concrete\n> as wind\n> whips her\
  \ teased hair\n> like a lasso\n> roping a steer\n> as snow\n> binds to tight jeans\n\
  > like the shackles\n> she wore on the ship to Shangri La\n> as streetlight\n> catches\
  \ a gleam in her eyes,\n> a glimpse as she stares into\n> tonight\n> her fifteenth\
  \ birthday.\n\n有些诗歌并不整齐地归入自由诗或格律诗，例如散文诗（没有换行）或俳句文（一种将散文诗与不同类型的俳句相结合的日本形式）。现代俳句及其相关形式通过转折（如破折号）并置两个图像或思想，从而连接它们。通常，现代俳句不符合日语的音节数规定，但它们通常包含对季节和自然的引用（对于相关形式川柳，则是对人性的引用）。俳句文通过诗歌标题、俳句和散文部分将故事编织在一起。这是一个现代俳句的示例：\n\
  \n> shooting stars—\n> the dash between\n> born and died\n\n\n\n在开始可视化之前，让我们先深入了解一下数据集。数据集中包含了八首俳句（haiku）、八首俳文（haibun）、八首自由诗和八首格律诗。我们将它们分为基于俳句的诗和其他诗，以便根据诗歌典型的生成方式（自由联想与人工创作）来简化分析。我们将考虑的特征包括标点符号比例、名词比例、动词比例、人称代词比例、形容词比例、副词比例以及介词/连词比例。考虑到每种诗歌类型的构造方式，这些因素可能会有所不同。如果有更大的诗歌样本，你可以使用其他词性或将动词等类别拆分为各个具体的组成部分。\n\
  \n我们将在 `Python` 中完成这些步骤，因此我们只概述用到的步骤，而不深入探讨代码。你可以在本书的文件中找到处理后的数据。\n\n### 文本数据分词\n\
  \n处理诗歌以分析的第一步是对文本数据进行分词（`tokenizing），这意味着我们需要将诗歌解析为单个单词和标点符号。`Treebank tokenizer`\
  \ 使用正则表达式解析句子中的单词，处理缩写以及单词与标点的其他组合，并拼接引号。这些是解析诗歌文本数据的重要步骤，因为标点符号在单词和短语中出现频率较高。特别是俳句，往往使用标点符号在诗中创建一个“切”（cut），以连接两个不同的图像或思想。\n\
  \n由于 `Treebank tokenizer` 经常拆分缩写和其他与其他标点连接的单词，使用 `regex tokenizer` 来统计文本中实际单词的数量并将其解析为包含标点的单词，是很有用的。鉴于某些诗歌非常短，我们希望确保不会夸大词数。`regex\
  \ tokenizer` 的结果为我们提供了准确的词数，用于归一化词性或标点符号的比例。\n\n获取分词结果的长度后，我们可以从标记（tokens）数量减去单词数量，从而得出文本中标点的长度。这允许我们比较不同诗歌类型的单词比例和标点符号比例，这可能随诗歌类型而异（根据之前对作者文本语言差异的研究，也可能取决于作者）。\n\
  \n### 词性标注\n\n为了标记相关的词性，我们将使用 `averaged perceptron tagger`，这是一种监督学习算法，在不同文本类型上通常具有很好的率，并且已经为\
  \ `NLTK` 包进行了预训练。虽然它在处理大量文本时速度较慢，但我们的文本样本相当小，允许该程序在不需要过多处理能力的情况下标记单词。通过我们将在下一章中考虑的大数据技术，将\
  \ `NLTK` 的平均感知器标注器应用扩展到非常大的数据集是可能的。\n\n我们将解析出名词、动词、人称代词、副词、形容词以及介词和连词，并统计每个文本样本中每个类别的数量。\n\
  \n名词包括单数、复数、普通名词和专有名词组合。动词包括所有类型和时态组合。人称代词包括代词和物主代词。副词和形容词包括副词和形容词的比较级和最高级。介词和并连也被标记并计数。\n\
  \n`averaged perceptron tagger` 中还存在其他标记词性，其他标注器可能包含更细的词性划分。如果你想探索如何使用词性来区分文本类型、作者或文本作者的人口统计特征，你可能希望使用另一个标注器，或者将名词、动词等拆分为其各个组成部分。然而，这将导致数据集中的列更多，因此如果你正在对文本属性和词性分析进行此类细致分析，我们建议你收集更多样本。\n\
  \n### 向量归一化\n\n由于我们的文本样本根据诗歌类型包含一些短样本和长样本，我们在处理数据之前想要对词性计数进行标准化。我们的方法包括通过标记计数（标点和单词总数）对标点进行归一化，以及通过单词数对词性计数进行归一化，总结在本章的文件。这应该提供足够的特征来展示诗歌类型的差异，并允许通过良好的降维结果来可视化我们的数据集。\n\
  \n对于一种解析动词、名词等类型的更细致的方法，你可以推导出词性类别的比例，或拆分词性内部的比例，为你的分析构建更详细的特征。如果你熟悉 `Python`，我们鼓励你尝试\
  \ `NLP pipeline` 并自定义你的分析，以便对诗歌类型的语言差异有更深的见解。\n\n现在，让我们进入 `R` 分析。\n\n# 在 R 中分析诗歌数据集\n\
  \n我们将从加载处理后的诗歌数据集开始，使用 `Listing 9-1` 中的代码探索我们派生的特征。\n\n```\n# 加载诗歌数据并设置会话种子\nmydata<-read.csv(\"\
  PoemData.csv\")\nsummary(mydata)\n```\n\nListing 9-1：读取处理后诗歌数据的脚本。\n\n副词往往是代表性最低的特征，仅占任何给定诗歌中所用单词的\
  \ 0–10.5%。名词往往是这组诗歌中出现频率最高的单词，占某首诗歌中单词的 12.5–53.5%。人称代词很罕见，超过四分之一的诗歌不包含人称代词（可能是由于俳句，它们倾向于不使用这些）。标点符号的使用差异很大，从俳句中没有任何表示到自由诗中近一半的内容由标点组成（一首关于医院医疗诊断的列表诗）。鉴于这种变化，我们很可能拥有良好的特征用于我们的分析中。\n\
  \n让我们为分析设置种子，并使用 `t-SNE` 可视化词性特征，使用每个可视化点的形状作为诗歌类型的指定；将以下代码添加到 `Listing 9-1`。\n\n\
  ```\n# 提取相关数据片段\nmydata1<-mydata[,-1]\nhaiku<-which(mydata1$Type==\"haiku\")\nmydata1$Type[haiku]<-1\n\
  mydata1$Type[-haiku]<-2\nset.seed(1)\n\n# 创建并绘制诗歌数据的 t-SNE 投影\nlibrary(dimRed)\n\
  t1<-getDimData(embed(mydata1[,-1],\"tSNE\",ndim=2,perplexity=5))\nplot(as.data.frame(t1),xlab=\"\
  Coordinate 1\",ylab=\"Coordinate 2\",main=\"Perplexity=5 t-SNE Results\",pch=ifelse(mydata1$Type==1,1,2))\n\
  ```\n\n![图 9-1：不同诗歌类型的特征 t-SNE 图，用圆圈或三角形表示](img/f09001.png)\n\n图 9-1：不同诗歌类型的特征 t-SNE\
  \ 图，用圆圈或三角形表示（`perplexity=5`）。\n\n从图 9-1 的图中，我们可以看到我们的诗歌倾向于聚类，其中大多数点属于同一类型。这意味着基于内核的模型或最近邻模型可能足够通过特征对诗歌类型进行分类。\n\
  \n考虑到点在特征上存在分离，我们很可能应用算法对数据进行聚类，并使用监督学习来理解俳句类诗与其他诗之间的差异。\n\n让我们样本划分为训练和测试部分，然后应用基于欧几里距离的\
  \ `k-NN` 算法，根据诗歌的五个最近邻来分类诗歌类型，在我们目前的代码基础上添加：\n\n```\n# 创建不同距离和五个最近邻居的 Canberra KNN\
  \ 模型\nlibrary(knnGarden)\ns<-sample(1:32,24)\ntrain<-mydata1[s,]\ntest<-mydata1[-s,]\n\
  kc<-knnVCN(TrnX=train[,-1],OrigTrnG=train[,1],TstX=test[,-1],\nK=5,method=\"euclidean\"\
  )\n```\n\n\n\n由于我们的 t-SNE 图（图 9-1）显示出某些分离，且点通常位于相似类型的诗歌附近，该模型可能运行良好。让我们通过在代码中添加以下内容，查看\
  \ `k`-NN 模型在测试集上的预测标签和真实标签：\n\n```r\n#examine performance\nwhich(kc==test$Type)\n\
  > 1, 2, 3, 4, 5, 6, 7, 8\n```\n\n看起来该模型正确分类了所有测试诗歌，这说明这是一个高质量的模型，可以根据特征区分不同类型的诗歌。\n\
  \n我们将通过在代码中增加一个步骤，使用 10 折交叉验证的 `dgLARS` 模型进一步通过特征检查这些潜在的类型差异：\n\n```r\n#create a\
  \ cross-validated dgLARS model\nlibrary(dglars)\ndg1<-cvdglars(factor(Type)~.,data=mydata1,\n\
  family=\"binomial\",control=list(nfold=10))\ndg1\n```\n\n由于我们处理的是较小的数据集，可能会一个一个或多个折出现问题，导致产生的结果与此处显示的模型略有不同：\n\
  \n```r\n#examine the dgLARS model\n> dg1\n\nCall:  cvdglars(formula=factor(Type)\
  \ ~ .,family=\"binomial\",data=mydata1,\n    control=list(nfold=10))\n\nCoefficients:\n\
  \                   Estimate\nInt.                -1.4782\nPunctuation_Length  \
  \ 0.3113\nAdverb_Count        -0.2767\n\ndispersion parameter for binomial family\
  \ taken to be 1\n\nDetails:\n   number of non-zero estimates: 3\n      cross-validation\
  \ deviance: 2.687\n                              g: 0.4573\n                   \
  \     n. fold: 10\n```\n\n你的模型应该显示出标点符号比例和副词比例的差异。自由诗和格律诗的标点使用率较高。考虑到这类诗歌更有可能使用完整句子而非连接的短语，标点使用的差异与预期差异一致。\n\
  \n副词比例的差异并不符合预期。然而，副词的使用与许多不同的瞬态和固定人格特征有关。俳句可能触及不同的瞬态情绪或特征，从而产生反映在副词使用上的风格差异。主题也可能影响这种差异。\n\
  \n重要的是，这项分析表明，在同一作者的同一类型写作（诗歌）的样本中，词性和标点符号模式是存在差异的。鉴于之前的研究表明，某些这些输入特征可用于识别文本的可能作者，因此，基于词性分析重新思考作者预测可能是明智的。不同的主题、不同的写作类型以及作者不同的生活阶段都可能影响词汇选择、句式结构和标点符号的使用。\n\
  \n为了观察诗歌如何在每种诗歌类型内部聚集，让我们通过添加以下代码来可视化每种诗歌类型的持续图：\n\n```r\n#create the Vietoris-Rips\
  \ complexes\nlibrary(TDAstats)\nset1<-mydata1[mydata1$Type==1,-1]\nset2<-mydata1[mydata1$Type==2,-1]\n\
  ```\n\n\n\n\n# 列表 9-2：一个加载严肃和幽默诗歌 BERT 数据、使用 t-SNE 进行数据嵌入并绘制结果的脚本\n\n图 9-3 显示了嵌入情况，这表明诗歌按类型分成了不同的簇。这与我们在图\
  \ 9-1 中看到的俳句与非俳句诗的结果相似，在那里，我们在 `t-SNE` 嵌入中看到特征按类型分离。再次，这表明机器学习分类器在我们的数据集上可能会表现。\n\
  \n![图 9-3：t-SNE 嵌入结果图，其中严肃或幽默类型的诗歌分别用圆和三角形表示（perplexity=5）](img/f09003.png)\n\n\
  图 9-3：t-SNE` 嵌入结果图，其中严肃或幽默类型的诗歌分别用圆和三角形表示（`perplexity=5`）\n\n既然我们已经知道机器学习模型在这些数据的分类上可能表现，让我们通过添加列表\
  \ 9-3 使用同调延续拟合 `Lasso` 模型来处理小样本量：\n\n```\n#获取划分后的训练数据\nset.seed(1)\ns<-sample(1:25,0.85*25)\n\
  train<-mydata[s,]\ntest<-mydata[-s,]\n\n#构建 Lasso 模型\nlibrary(lasso2)\netastart<-NULL\n\
  las1<-gl1ce(factor(Type)~.,train,family=binomial(link=probit),bound=5,standardize=F)\n\
  lpred1<-round(predict(las1,test,type=\"response\"))\n\n#检查结果\nlpred1\n> 1 1 1 0\
  \ 1\ntest$Type\n> [1] serious serious humor serious\n```\n\n列表 9-3：一个加载严肃和幽默诗歌 BERT\
  \ 数据、将数据划分为训练集和测试集、使用同调延续拟合构建 `Lasso` 模型，并显示测试数据预测值和实际值的脚本\n\n该数据集包含来自嵌入 `BERT`\
  \ 模型的 384 个分量和 25 首诗歌。你的 `R` 版本可能会不同的划分数据和拟合模型，但在我们的 `R` 版本中，测试数据有三首严肃诗歌，接着是一首幽默诗歌，最后是一首严肃诗歌。模型预测为一首严肃、一首严肃、一首严肃、一首幽默和一首严肃（给出模型准确率为\
  \ 100%）。考虑到该训练集与输入我们模型的 384 个预测变量相比如此之，这种性能是非常出色的。请注意，所选特征在语义上意义不大，因为它们仅仅是嵌入。将基于拓扑的方法整合到流水线中以处理和建模小型数据集，可以在其他模型完全失效的地方提供不错的预测。\n\
  \n## 总结\n\n在本章中，我们应用了书中概述的几种方法来解决一个涉及语言学的问题，该问题涉及一个源自经 `NLP` 处理诗歌的特征数据集；我们还对数据进行了嵌入，并创建了一个模型来预测诗歌集中语调的差异。\n\
  \n对于第一个问题，我们降低了数据集的维度以可视化分组差异，应用了两个监督学习模型来理解分类准确率和区分诗歌类型的重要特征，并可视化了于两组诗歌中的拓扑特征。这告诉我们语言的使用（特别是标点符号）在不同诗歌类型之间存在差异。\n\
  \n我们查看了上下文嵌入，并使用基于拓扑的嵌入方法和基于拓扑的分类模型预测诗集的语调，这表明我们可以通过 384 个嵌入分量和 21 首诗歌的训练集构建模型，获得相当准确的预测。\n\
  \n在下一章中，我们将通过研究分布式和量子计算方法扩展拓扑数据分析算法的方法来结束本书。\n\n# 10 多核与量子计算\n\n![](img/chapterart.png)\n\
  \n在之前的章节中，我们概述了许多来自几何和拓扑学领域的工具。我们看到了这些算法如何影响网络分析、自然语言处理、监督学习、时间序列分析、可视化和无监督学习。存在更多根于拓扑的算法，包括改进现有模型（如卷积或循环神经网络）的混合算法，该领域具有向机器学习领域贡献数千算法的潜力。\n\
  \n然而，拓扑和几何机器学习算法开发和应用所面临的主要问题之一是计算成本。虽然大多数情况下不会，但某些网络指标的计算可能会随网络规模而扩展。存在更多根于拓扑的算法，包括改进现有模型（如卷积或循环神经网络）的混合算法，该领域具有向机器学习领域贡献数千算法的潜力。\n\
  \n然而，拓扑和几何机器学习算法开发和应用所面临的主要问题之一是计算成本。虽然大多数情况下不会，但某些网络指标的计算可能会随网络规模而扩展。存在更多根于拓扑的算法，包括改进现有模型（如卷积或循环神经网络）的混合算法，该领域具有向机器学习领域贡献数千算法的潜力。\n\
  \n## 拓扑分析的多核方法\n\n算法缩放的一种方法是将数据片段映射到不同的核心上，在每个核心上计算所需的数量，并在所有核心计算完解决方案后重新组装。例如，假设我们要计算每个顶的介数中心性。即使这是一个稀疏网络，每个介数中心性的计算也将花费很长时间。然而，如果我们能够访问百万个核心，我们可以将网络映射到每个核心并计算一个顶的介数中心性。虽然计算时间可能仍然很，但计算所有顶点介数中心性的总时间将远少于循环中逐一个计算介数中心性所需（我们在之前的章节中针对较小网络是这样做的）。虽然大多数组织无法实现百万级核心，但\
  \ 10 个或 30 个核心带来的时间节省是巨大的。\n\n还可以将数据集的一部分映射到每个核心上以计算某种指标。例如，假设我们有一个包含 30 万名完成在线调查的人的数据集。计算所有\
  \ 30 万个人响应之间的距离将消耗大量的计算资源。然而，距离矩阵在许多流学习和拓扑数据分析算法中是必要的；最好有一种更快的方法来计算它。我们可以将不同的数据映射到不同的核心以计算较小的距离矩阵，在核心计算完每个部分后将其组装成完整的\
  \ 30 万乘 30 万的距离矩阵。再次，我们将看到巨大的时间节省。\n\n总的来说，这些多核方法属于分布式计算的范畴，利用多个核心来计算问题的一部分，并在所有核心计算完解决方案后进行组装。大多数云计算资源将支持分布式计算，某些可以在云端运行的\
  \ `R` 和 `Python` 包也支持分布式计算选项。然而，通常由机器学习工程师或数据工程师将分布式计算步骤定义到所使用的算法中。图 10-1：将数据的三个部分映射到三个核心，这些核心将在机器学习流水线中执行数学或算法步骤\n\
  \n\n\n\n\n# 图 10-1：将三部分数据映射到三个核心，这些核心将在机器学习流水线中执行数学或算法步骤\n\n在图 10-1 中，我们将数据集解析为三部分，映射到三个将计算我们所需数值的核心上。在简单的大数据案例中，这可能涉及计算数据集每列中找到最小值和最大值。然后我们计算跨核心的最小值和最大值，保存该值，并从完整数据集中输出每列的最小值和最大值。如果数据集只有几百万行，这可能帮助意义不大，但如果我们处理的是数万行数据，这将极大地加快计算过程。\n\
  \n多核方法适用于网络算法，例如在第 2 到第 4 章节中遇到的算法，并且它们在持续同调（persistent homology）和离散外微分几何方面取得了一些成功。只要问题本质上是局部的，或者在某些步骤可以分解为更小的部分，多核方法就是行的。例如，在机器人路径规划的同伦类算法中，我们可以分解障碍周围的潜在路径，并为每条路径计算某些最优性。\n\
  \n遗憾的是，目前 R 或 Python 中很少有书中这些算法的多核版本。然而，这是一个研究领域正在积极探索的领域，如果你熟悉大数据平台上的多核框架，鼓励你尝试将这种方法应用于持续同调、流形学习或其他基于几何的算法。\n\
  \n## 量子计算方法\n\n扩展基于几何算法的另一种方法是将它们实现在一种可以原生利用分布式计算的不同类型的计算机上。`Quantum computing`\
  \ 是最近的流行词，即使在数据科学和软件工程领域，该领域仍然环绕着许多谜和神话。进展比预期快，但该技术仍处于早期阶段，目前的系统具有明显的局限性，公司正在向硬件研发投入大量资金。然而，一些人质疑网络算法已经存在，而网络科学是机器学习中可能从量子计算中受益最大的领域之一。在本节中，我们将介绍量子计算的基本知识，并列出截至\
  \ 2023 年存在的一些与图论和网络科学相关的量子算法。\n\n首先，量子计算硬件可以采取几种不同的形式，每种形式都有其优缺点。计算机电路的类型决定了机器上可以开发何种算法，某些类型的电路更适用于网络分析。如今两种类型的硬件似乎是大多数研究开发的重点，它们也将是我们讨论的重点。\n\
  \n目前的系统具有许多局限性，包括需要冷却电路、量子尺度产生的影响（穿过能量垒、相互作用粒子产生的场等）以及量子比特（qubits）固有的随机误差。尽管如此，研究人员已经能够通过现有的量子计算机和\
  \ `Python` 中的模拟包探索潜在的新算法以及现有算法的量子版本。特别是图论和网络算法似乎非常适合量子计算，而且通过量子比特同时搜索组合解决方案的能力表明，当量子计算扩展到更大的电路时，网络科学将得到提升。\n\
  \n### 使用基于比特的模型\n\n我们将从最像经典计算机的量子硬件版本开始：`qubit-based model`，它用量子版本的比特——`qubits`\
  \ 替换了经典比特，量子比特是经典电路基础的 0 和 1 比特的量子版本。量子比特在给定时间内不是只取 0 或 1 的值，而是同时存在于 1 和 0 状态中，直到量子比特被观测到（此时它将坍缩为\
  \ 0 或 1 状态），它们还可以通过计算门旋转以获取分数值。这意味着量子比特可以存在许多不同的状态，并通过量子门演化为最终的、优化状态。这使得它们非常灵活。图\
  \ 10-2 显示了比特和量子比特之间的区别。\n\n![图 10-2：经典比特与量子比特的对比图](img/f010002r.png)\n\n图 10-2：经典比特与量子比特的对比图\n\
  \n让我们快速浏览使用量子比特的两种主要硬件。如果你不这里的每一个术语，不要担心；只需记住高级思想。有两种类型的芯片组使用量子比特。它们都依赖量子比特的量子原理（如叠加）来加速计算并提高准确性。第一种\
  \ `gate-based circuit`，类似于经典硬件，其中门操作作用于量子比特状态（例如旋转门）。基于门的电路是最常见的，一些示例包括 IBM 的机器和\
  \ Rigetti 的机器；通常情况下，基于门的算法可以加速算法并提供易于算法的基准测试。另一种选择（目前 D-Wave 在其机器上使用）依赖于量子退火（通过改变磁场的物理加热和冷却过程）作用于量子比特状态，而不是通过门操作量子比特。通常，这种类型的系统性能和准确性保证或边界没有基于门的量子硬件那么多。\n\
  \n### 使用基于量子模式的模型\n\n除了量子比特模型，另一种主导模型是基于 `qumodes` 的电路模型，这是由加拿大公司 Xanadu 开发的基于光子的电路。目前，基于光子计算（使用光子代替量子比特）的软件和算法只是机器的模拟，但这种模拟允许开发一些有趣的应用程序。这种类型的电路使用波函数（即连续分布）来代替量子比特（量子比特在测量时会坍缩为\
  \ 1 或 0）。波函数然后可以进行压缩、映射，或通过其他类型的函数几何变换对其进行操作，而不会坍缩为 1 或 0。这种计算机还不存在，但 `Python` 中已经存在模拟程序（截至\
  \ 2023 年），类似于适用于比特电路的模拟程序。\n\n### 使用量子网络算法\n\n存在几种与图的属性相关的量子网络科学算法。团发现算法在网络科学中特别有用，量子团发现算法已经存在。极大团算法在它们所测试的极小问题上似乎享有加速。\n\
  \n量子算法的一个重要警告是它们的概率性质。量子算法不是在输出中得到（例如）团列表，而是会运行多次，创建团列表数组，这些数组可以组合成网络中团存在的概率评分。这对于项目的其他部分优先考虑团，或者在非常大的网络中锁定最感兴趣的团非常有帮助，尽管后者需要比现在大得多的电路。\n\
  \n\n\n\n使用 R 软件包 `QuantumOps` 确实存在基础量子最大流和最小切算法，尽管该功能仅限于小规模稀疏图。使用量子比特方法，问题首先被转换为`量子近似优化算法`，或\
  \ `QAOA`。`QAOA` 这种建模是一种组合算法，它依赖于量子比特态的叠加和被称为`酉算子`的算子来解决优化问题。酉算子是一种线性代数算子，具有特殊属性，与量子比特电路的底层量子力学非常契合。由于解决方案的概率性质，最好多次运行算法以获得更准确的答案。在这种情况下，让我们运行算法\
  \ 10 次（一个足够大的任意数字，足以通过概率解生成可用结果），并使用列表 10-1 中的脚本更深入地探索此函数，该脚本重新加载了来自列表 4-1 的图 1。\n\
  \n```\n#load QuantumOps package\nlibrary(QuantumOps)\n\n#transform Graph 1 from\
  \ Listing 4-1 to unweighted graph\nmydata1<-as.matrix(read.csv(\"Graph1w.csv\",header=F))\n\
  mydata1[mydata1>0]<-1\n\n#run the quantum approximation optimization algorithm maximum\
  \ cut algorithm\nq<-QAOA_maxcut(mydata1,p=10)\n\n#explore the results\nq\n```\n\n\
  列表 10-1：在图 1 上运行最大切算法（首次见于第 4 章），运行 10 次\n\n注意，该算法的输出包含 2⁷ 个项，而我们的原始图包含六个顶点。通常情况下，这种版本的量子最大切算法在输出中将包含\
  \ `2^((*n*+1))` 项，且问题会扩展到更大的图。该算法的输出也是原始格式，留给用户将输出翻译为最可能的切分。现有的几个 Python 包提供了更具实用性的输出，但此软件包提供了一种在\
  \ R 中探索某些基于量子比特的计算模拟的方法。\n\n除了最大流和最小切算法外，还有随机游走算法的量子版本，并且可以使用它们构建社区发现算法或 PageRank\
  \ 类型的算法。事实上，过去几年里已经提出了一些量子 PageRank 算法并对其进行了理论研究。然而，到目前这类应用在实践中尚未得到充分探索。它为未来网络科学的进一步研究和潜在应用提供了一条途径。\n\
  \n其他与图论而非网络科学更密切相关的例子还包括图着色算法和专注于测试图属性（如同构和连通性）的算法。图上的量子查询以及 Dijkstra 算法或其他最短路径算法的量子版本仍处于起步阶段，但它们在量子图论算法和量子网络科学算法的未来中展现了前景。\n\
  \n尽管量子计算是一项新兴技术，但图论和网络科学已经看到了量子算法带来的潜在收益，未来可能会开发出更多算法。目前现有算法通常在 Python 中运行，但随着更多公司开发量子计算机并向研究人员提供访问，未来可能会存在量子计算机的新接口。\n\
  \n### 使用量子计算加速算法\n\n大多数算法还没有可用的量子计算或模拟量子计算软件包。但是，可以利用量子计算和模拟量子计算软件包中已存在的基础数学工具，逐步组装如书中的这些算法。R\
  \ 软件包 `QuantumOps` 提供了其中一些工具供我们探索，让我们深入一个量子系统上基础数学计算的示例。请注意，此软件包仅模拟将在量子计算机上运行的算法，因此在你经典笔记本电脑上的速度提升将不是你在真实量子计算机上看到的。然而，接下来的示例将展示量子算法如何被开发以运行在量子计算机上，以便随着复杂性的增长，为需要大量计算能力的问题加速计算。\n\
  \n有很多算法可以找到两个数之间的最大公约数，可以在量子计算框架内实现这一点。`最大公约数`指的是能够整除两个目标数字的最大数字；例如，同时整除 12 和 20\
  \ 的最大数字是 4。我们可以将 12 分解为它的因数（1, 2, 3, 4, 6, 12），并将 20 分解为它的因数（1, 2, 4, 5, 10, 20）。然后我们可以看到\
  \ 4 是两组因子共同出现的最大数字。对于数字较小的情况，这是我们手动完成的简单问题；然而在许多加密应用中，需要分解或确定为质数的数字可能涉及 12 位或更多位。分解这些数字需要计算机。\n\
  \n`QuantumOps` 中的 `gcd()` 函数以在量子计算机上寻找的方式找到两个数之间的最大公约数。让我们用 12 和 20 作为输入数字尝试示例，看看\
  \ `gcd()` 函数如何工作；参见列表 10-2。\n\n```\n#load QuantumOps package\nlibrary(QuantumOps)\n\
  \ngcd(12,20)\n```\n\n列表 10-2：寻找 12 和 20 的最大公约数\n\n你应该能从列表 10-2 的代码中看到 `4` 的输出，这对应于我们手动找到的\
  \ 12 和 20 的最大公约数。该函数可以计算大数字的公约数，而数字手动计算是不可能的。让我们输入两个新的较大的数字（例如 14267 和 11345），通过修改列表\
  \ 10-2 中的 `gcd()` 函数，使用该函数找到它们的最大公约数：\n\n```\ngcd(14267,11345)\n```\n\n根据我们的输出，这两个数字之间的最大公约数是\
  \ 1。这两个数字都不是质数，但它们没有共同的因子。该算法对于如此大的数字运行速度很快，如果你对分解算法的网络安全应用感兴趣，鼓励你尝试在应用程序中使用规模更大的数字以进一步探索此函数及其功能。在量子系统中，可以在合理的计算时间内为更大的数字运行此算法。这意味着，一旦量子计算在研究环境之外变得更加普及，基于分解的安全算法将表现不佳。\n\
  \n`QuantumOps` 软件包尚未包含构建算法的一些更高级数学工具，但可以定义对于距离度量设计重要的点积、范数和其他线性代数工具，也可以定义常见机器学习任务底层的线性代数工具。在真实的量子计算机上，我们能够比目前考虑的问题更快地针对更大规模的问题运行算法。然而，`QuantumOps`\
  \ 软件包允许我们探索一些在量子计算机上进行的量子算法研究中的内容。\n\n### 在量子计算机上使用图像分类器\n\n\n\n\n今天机器学习领域的热门话题之一是`image\
  \ classification`（图像分类），其中机器学习被用于根据给定的类别标签对输入图像进行分类。通常，你会有一组关联了类别标签的图像，这些图像可以用于训练机器学习算法，以识别某些特征（如颜色、线条、圆形或更复杂的模式），这些特征标志着图像属于某一类。例如，考虑根据图片对某些类型的植物或动物进行标记的问题，这些图片可能包含也可能不包含我们希望自动标记的某个或多个类别。请看图\
  \ 10-3，它描绘了火弹树的花部分。\n\n![图 10-3: 费尔尔德热带花园一棵盛开的火弹树（原产于中美和南洲）](img/f010003.png)\n\n\
  图 10-3: 费尔尔德热带花园一棵盛开的火弹树（原产于中美和南洲）\n\n现在看图 10-4，它描绘了一只大象。\n\n![图 10-4: 南非克鲁格国家公园一只在道路上行走的大象](img/f010004.png)\n\
  \n图 10-4: 南非克鲁格国家公园一只在道路上行走的大象\n\n对像这样的图像进行分类面临着许多挑战。例如，在图 10-3 中，我们没有在图像中看到整棵树（这使得很难将其识别为树而不是灌木或藤蔓），而且树正处于花期（这意味着火弹树的其他照片中可能没有花）。在图\
  \ 10-4 中，大象正在远离摄像头（这意味着没有动物的脸部），图像应用了镜镜滤镜（改变了自然颜色），并且图像包含了其他类型的物体（植物、道路等）。大多数现实世界的图像集并不包含只有感兴趣类别的完整图像，且它们在相同的色调下清晰可见（想一下当你在\
  \ Google 图片搜索中搜索猫时出现的所有关于猫的图像）。一个良好的分类器需要泛化到许多不同光照下、图像中包含其他物体的许多类型的猫。\n\n我们可能还会面临用于训练算法的图像集中的类别不平衡问题。我们可能有很多兰花、郁金香、美洲豹袋鼠的照片，但关于黑蝙蝠花、加蓬蝰或非洲矮矮锯鲨的照片可能较少。例如，我们可能拥有一种在大自然中完全不存在的新植物，或者一种没有许多图像的稀有植物或花，如图\
  \ 10-5 所示的杂交种。\n\n![图 10-5: 费尔尔德热带花园一株基因工程新物种植物](img/f010005.png)\n\n图 10-5: 费尔尔德热带花园一株基因工程新物种植物\n\
  \n通常，图像分类算法涉及预训练或自定义的卷积神经网络，这些在第 1 章中讨论过。为了快速回顾，卷积神经网络（`CNNs`）作为深度学习算法的一种，通过优化从输入图像层到一系列不同类型的层再到包含类别标签的输出层的映射来寻找相关特征。在\
  \ `CNN` 架构中，某些层在图像类别中寻找显著特征，这些特征在其他层中进行池化，以从先层找到最佳特征集并将其馈到下一层特征。\n\n\n\n\nListing\
  \ 10-3 创建了一个目标类别设置为数字 0（即将 0 与任何其他数字进行分类）的图像样本，学习参数为 1，每次迭代学习率不衰减，低偏置（允许其他参数更新得更快），以及一次训练迭代。根据你的机器配置，运行可能可能需要一段时间，因为该算法正在模拟一个量子系统；它甚至可能需要计算能力更强的机器。如果使用\
  \ CNN，我们需要更多与网络相关的参数（更不用说还需要针对隐藏层的数量和类型对架构进行调优）、更长的训练时间以及更多的计算能力。通过这段代码，我们优化了 33\
  \ 个量子门，并找到了整个优化后的分类器电路的矩阵。这代表了将解析 0 与其他所有数字的手写数字的量子架构。我们可以重复这一过程，直到找到 MNIST 中每个数字类别的量子分类器。在真实的量子计算机上，这种实现将要快得多，因为任何电路都不需要将在经典电路上进行模拟。\n\
  \n虽然存在其他形式的量子神经网络，但大多数还没有开源实现。我们鼓励你探索现有的论文，并在现有的量子系统上尝试量子神经网络的可能实现。大多数量子计算公司都为学术界和工业界的研究人员提供了合作机会，以加速量子算法的设计。如果你可以使用量子计算机，你可以在真实的量子计算机上运行本章的算法（以及其他模拟包），以利用计算速度的提升。\n\
  \n## Summary\n\n在本章中，我们探索了用于扩展算法的分布式计算解决方案，例如我们计算密集型和 TDA 算法。我们还引入了量子计算框架，模拟了寻找最小流和最大切解的量子图算法，运行了量子最大公约数算法的模拟，并以\
  \ CNN 的精神探索了模拟量子分类器，以探索量子的潜力。随着量子计算机规模的扩大以及研究人员和工业数据科学家可用性的提高，未来你可能会访问量子计算机，并在真实系统中实现此类算法，其性能将优于经典算法。\n\
  \n考虑到目前电路的设计速度，未来可能会开发其他解决方案，帮助扩展书中在当前计算基础设施下处理大数据较为困难的算法，我们希望扩展算法的工具将有助于几何和拓扑学领域新工具的开发。拓扑数据分析领域正在快速增长。该领域的更多研究可能会带来新颖算法，解决机器学习和数据分析中的通用或特定问题。\n\
