  \n\n\n\n\n\n致 Jeff Sanders，我称他为“学术之父”的人。\n\n—Yaé Ulrich Gaba\n\n## 关于作者\n\n`Colleen\
  \ M. Farrelly` 是一位高级数据科学家，她的学术和工业研究重点关注拓扑数据分析、量子机器学习、基于几何的机器学习、网络科学、分层建模和自然语言处理。从迈阿密大学获得生物统计学硕士学位后，Colleen\
  \ 曾在多个行业担任数据科学家，包括医疗保健、消费包装品、生物技术、核能工程、营销和教育。Colleen 经常在各类技术会议上演讲，包括 PyData、SAS\
  \ Global、WiDS、Data Science Africa 和 DataScience SALON。在不工作时，可以发现她在创作俳逸/俳（haibun/haiga）或游泳。\n\
  \n`Yaé Ulrich Gaba` 在开普敦大学（UCT，南非）完成博士学业，专攻拓扑学，目前是 Quantum Leap Africa（QLA，卢旺达）的研究助理。他的研究兴趣包括计算几何、应用代数拓扑学（拓扑数据分析）和几何机器学习（图和点云表示学习）。他目前的重点是数据分析中的几何方法，其工作旨在利用几何和拓扑理念及方法，为数据和形状分析开发有效且具有理论依据的算法。\n\
  \n## 关于技术评审\n\n`Franck Kalala Mutombo` 是卢班巴希大学的数学教授，曾任 AIMS 塞内加尔学术总监。他曾在斯特拉斯克莱德大学担任研究职位，并在\
  \ AIMS 南非与开普敦大学共同任职。他在英国苏格兰的格拉斯哥的斯特拉斯克莱德大学获得数学科学博士学位。他是复杂网络结构及其应用研究的专家。他最近的研究考虑了网络结构对远程相互作用的影响，并应用于流行病、扩散和对象聚类。他的其他研究兴趣还包括流形的微分几何、偏微分方程的有限元法以及数据科学。\n\
  \n# 前言\n\n`Colleen M. Farrelly` 和 `Yaé Ulrich Gaba` 著作《数据之形状》（*The Shape of Data*）的标题，正如作者邀请我们体验的旅程一样贴切且美丽，当我们发现那些描绘出我们分析数据洞察深层含义的几何形状时。\n\
  \n通过利用拓扑和几何数据分析，启用并结合常用的机器学习、数据科学和统计解决方案（包括监督/无监督或深度学习方法的组合），为底层数据问题提供了新的见解。它提醒了我们作为数据科学家的责任：在使用任何算法方法时，特定的数据偏差可能会极大扭曲我们的预期结果。例如，数据科学家需要很好地理解底层数据背景，以避免在底层数据需要考虑三维细微差别时进行基于二维欧几里得的距离分析，就像环球旅行时的路由分析所需要的那样。\n\
  \n在本书的数学数据分析之旅中，我们遇到了结构化数据数据分析的起源，以及许多可以转换为结构化数据的看似非结构化的数据场景，使得标准的机器学习算法能够执行预测性和规范性分析洞察。当我们穿过数据山谷和山峰时，我们学会了沿路收集特征，这些特征成为其他数据层的关键输入，形成了包括网络数据、图像和文本数据在内的各种非结构化数据源的几何解释。此外，`Farrelly`\
  \ 和 `Gaba` 精地详细介绍了由 `R` 和 `Python` 中定义的示例所支持的基础和高级概念，这些示例可以从书的网页下载。\n\n在过去的几年里，通过与\
  \ `Farrelly` 和 `Gaba` 合作几个令人兴奋的项目，我一直希望能出现这样一本书，能够像《数据之形状》这样清晰且雄辩地解释从拓扑数据分析空间演变到利用分布式和量子计算解决方案的整个过程。\n\
  \n在我担任 `Cypher Genomics` 的 CTO 期间，`Farrelly` 领导着我们的基因组数据分析倡议。她对如何最好地建立疾病本体与症状本体之间相关性的敏锐理解立即启发了我，同时她还利用模拟来理解图谱中缺失链接的影响。`Farrelly`\
  \ 的务实方法帮助我们通过创建一种跨越基因、症状和疾病本体的算法，根据基因或症状数据预测疾病，从而成功解决了关键问题。她对用于诊断的基于拓扑的网络挖掘的关注，帮助我们使用图摘要和统计检验定义了底层的数据网络形状、属性和链路分布。我们在本体映射（ontology\
  \ mapping）、基于图的预测以及网络挖掘和分解方面的共同努力，导致了与代谢组学、蛋白质组、基因调节网络、患者相似性网络和变量相关网络的关键数据网络发现。\n\
  \n从我们共同开展基因组及相关生命科学分析的日子，到我们最近的量子计算倡议，`Farrelly` 和 `Gaba` 一直表现出对所有相关复杂性的热情和独特理解，以及如何将他们的见解应用于多个日常问题。加入他们的数据之形状之旅，将是一段宝贵的时光，因为你将开启一场精心编写的\
  \ `R` 和 `Python` 算法冒险，利用几何模式来解决机器学习和数据分析中的通用或小众问题，从而帮助塑造出预期的结果。\n\n这本书对于初学者和资深专家来说都具有意义且迷人。初次旅行者可以轻松进入用于分析数据的算法示例，包括社交网络和地理网络，以及局部和全局指标，以理解网络结构和个人在网络中的作用。讨论涵盖了用于网络数据的聚类方法、用于建议网络新边的链路预测算法，以及理解例如过程或流行病如何在网络中传播的工具。\n\
  \n高级读者会发现探索最近开发的话题非常有趣，例如在机器学习算法中使用线性代数代替线性代数，以及使用外积分来量化灾害规划的需求。《数据之形状》让我想要卷起袖子面对许多新挑战，因为有了\
  \ `Farrelly` 巨大的宝藏地图和深刻的洞察探索工作，我感觉自己就像《古墓丽战士》中的劳拉·克罗特一样装备良好。他们之间是否存在某种隐藏的纽带或“隐藏层”？\n\
