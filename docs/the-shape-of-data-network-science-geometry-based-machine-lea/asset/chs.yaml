  \n---\n\n**由于你提供的待翻译文本中存在严重的文本重复（大量段落完全相同循环出现），为了保证翻译质量和逻辑性，以下是针对结构部分的翻译：**\n\n\
  原文：\n[content]\n# 1\n\n## The Geometric Structure of Data\n\n![](img/chapterart.png)\n\
  [/content]\n\n译文：\n\n[content]\n# 第 1\n\n## 数据的几何结构\n\n![](img/chapterart.png)\n\
  \n你可能会疑惑，既然传统数据科学方法已经如此流行且强大，为什么还需要基于拓扑和几何的数据科学方法？这个问题的答案包含两个部分。首先，今天的数据格式多种多样，比普通的电子表格要奇得多，例如社交网络或文本文档。虽然这类奇特数据以前被称为非结构化数据，但我们现在意识到它们通常是有结构的，只是其几何结构比关系型数据库中的电子表格要复杂。拓扑和几何数据科学允许我们直接在这些奇特领域工作，并将其转换为熟悉的表格领域。其次，最近的一个发现表明，几何甚至隐藏在电子表格结构化的数据之后。通过拓扑和几何数据科学，我们可以利用这种隐藏几何的力量。\n\
  \n\n\n\n本章将从快速回顾传统机器学习中的主要概念开始，讨论数据的“结构化”意味着什么，以及机器学习算法通常如何使用这些数据。接着，我们将从几何角度回顾监督学习、过拟合和维度灾难。随后，我们将预告几种其他常见类型的数据——网络数据、图像数据和文本数据——并简要介绍我们如何如何在机器学习中使用它们的几何特性。如果你已经熟悉传统的机器学习以及将其应用于现代形式数据所面临的挑战，欢迎直接跳到第\
  \ 2 章，技术内容将从该章节正式开始，尽管无论如何，你可能都会发现本章提供的传统机器学习主题的几何视角很有趣。\n\n## 机器学习分类\n\n存在许多类型的机器学习算法，而且每天都有新算法出现。要跟踪所有最新进展可能很困难，但将机器学习算法归为几类基本类别是有帮助的。\n\
  \n### 监督学习\n\n监督学习算法通常旨在预测某些内容，例如在新医院方案下的治疗效果，或者客户在未来六个月内流失的概率。我们预测的变量被称为`因变量`（dependent\
  \ variable）或`目标变量`（target），而用于预测它的变量则被称为`自变量`（independent variables）或`预测变量`（predictors）。当我们预测一个数值变量（如症状严重程度量表）时，这被称为`回归`；当我们预测一个分类变量（如存活或死亡类别）时，这被称为`分类`。\n\
  \n一些最流行的监督学习算法包括`k`-最近邻（`k`-NN）、朴素贝叶斯分类器、支持向量机、随机森林、梯度提升和神经网络。阅读本书不需要了解其中任何一个主题，但熟悉至少一种回归方法和一种分类方法（例如线性回归和逻辑回归）将是有帮助的。尽管如此，如果你不确定是否熟悉它们，也不要担心——本章将涵盖你需要的概念。\n\
  \n每个监督学习算法都是一种特定类型的函数，其输入变量的数量与数据中自变量的数量相同。我们将这个函数看作是对于自变量的任何取值组合，预测因变量的值（参见图 1-1）。对于自变量为\
  \ `x[1]`、`x[2]`、`. . . `、`x[n]` 的线性回归，这是一个线性函数：`f(x[1], x[2], . . . , x[n]) = a[1]x[1]\
  \ + a[2] * x[2] + . . . + []`。对于其他方法，它是一个复杂的非线性函数。对于许多方法，该函数是非参数的，这意味着我们可以通过算法计算它，但无法用公式将其写出来。\n\
  \n![图 1-1：自变量的流向、监督机器学习算法（视为函数）以及因变量的预测](img/f01001.png)\n\n图 1-1：自变量的流向、监督机器学习算法（视为函数）以及因变量的预测\n\
  \n使用监督学习算法通常涉及将数据分为两组。有一组是`训练`数据（training data），算法在此尝试调整函数中的参数，使得预测值尽可能接近真实值。在之前的线性回归示例中，参数是系数\
  \ `a[i]`。还有一组是`测试`数据（testing data），我们在此衡量算法的效果如何。`超参数`（hyperparameter）是用户必须指定的任何参数（与训练过程中直接从数据中学习的参数不同）。`k`-NN\
  \ 中指定最近邻数量的 `k` 就是超参数的一个示例。\n\n在监督学习算法训练完成后，我们可以使用它来做出新预测，并估计每个自变量对因变量的影响（称为`特征重要性`feature\
  \ importance）。特征重要性对于做出干预决策很有帮助。例如，知道哪些因素最影响患者死于疾病，可以在疫苗供应有限的情况下为接种策略提供参考。\n\n###\
  \ 无监督学习\n\n无监督学习算法倾向于关注数据探索——例如，减少数据集的维度以便更好地可视化、发现数据点之间的关系，或检测异常数据点。在无监督学习中，没有因变量——只有自变量。因此，我们不将数据分为训练集和测试集；我们把无监督方法应用于所有数据。无监督学习的应用包括市场细分和基于数百万遗传标记的祖谱可视化。无监督学习算法的示例包括\
  \ k 均聚类、层次聚类和主成分分析（PCA），但再次，阅读本书不需要了解其中任何一个主题。\n\n无监督学习和监督学习可以有效结合。例如，你可能会使用无监督学习来发现关于数据的新问题，并使用监督学习来回答这些问题。你可能将无监督学习作为降维的预处理步骤，以提高监督学习算法的性能。\n\
  \n### 匹配算法与其他机器学习\n\n机器学习的另一个常见应用涉及`匹配算法`matching algorithms，它通过计算点之间的距离来寻找数据集中的相似个体。这些算法通常用于向用户推荐产品；它们也被用于数据完整性检查，以确保在允许机器学习算法创建模型之前，某些群体中存在足够的数据。\n\
  \n随着机器学习和人工智能的兴起，数据完整性变得越来越重要。如果人口中的重要子群体在数据中没有被很好地捕捉，算法将向多数群体倾斜。例如，如果语言识别系统没有足够的非洲或亚洲语言组数据，系统将很难学习这些语言组特有的人声，例如科桑语的点击声或普通话声调。匹配算法还用于在无法进行随机对照试验的情况下从经验证据中推导出因果关系，因为它们允许我们对相似的参与者，就像他们被分配到治疗组和安慰剂组一样。\n\
  \n我们可以提到许多其他类型的算法，在实践中，算法类别之间往往存在重叠。例如，YouTube 的推荐算法以监督和无监督的方式使用了`深度学习`（涉及基于多个“隐藏层”神经网络的机器学习），还使用了匹配算法以及机器学习的另一个支柱——`强化学习`（算法通过探索真实或模拟环境自主开发策略——这超出了本书的涉及范围）。然而，之前提供的机器学习基础路线图将指导我们本书。\n\
  \n接下来，让我们仔细观察这些算法所期望的数据格式格式。\n\n## 结构化数据\n\n\n\n\n机器学习算法，以及更广泛的数据科学和统计方法，通常运行在`structured\
  \ data`（也称为`tabular data`，表格数据）上。这意味着一种电子表格类型的对象（数据帧或矩阵），其中列是变量，行是`data points`（也称为`instances`\
  \ 或`observations`）。这些数据通常与其他结构化数据一起存储在关系型数据库中。表格化结构使我们能够讨论自变量、因变量和数据点。本书的一个大重点是如何处理并非以这种整齐格式呈现的数据。但即使对于表格化数据，几何视角也可能有用。\n\
  \n首先，让我们深入一个示例，该示例将展示几何学如何帮助我们更好地理解和处理结构化数据中的分类变量。\n\n### 虚拟变量的几何结构\n\n图 1-2 显示了作为\
  \ Microsoft Excel 工作簿存储的电子表格的一部分。这里的最后一列是 `Outcome`（结果），因此我们将其视为因变量；其他三列是自变量。如果我们使用这些数据进行监督学习算法，它将是一个回归任务（因为因变量是数值型的）。第一个自变量是二值数值型（值为\
  \ 0 和 1），第二个自变量是离散数值型（取整数值），第三个自变量是分类型（有三个性别类别）。某些算法接受分类变量，而另一些则要求所有变量都是数值型。除非类别是有序的（例如带有“非常不满意”、“不满意”、“满意”和“非常满意”等值的调查数据），否则将分类变量转换为数值型的方法是将其替换为一组二值`dummy\
  \ variables`（虚拟变量），这些虚拟变量用值 `1` 和 `0` 表示的“是/否”格式编码每个类别。在图 1-3 中，我们用两个虚拟变量列替换了性别变量列。\n\
  \n![图 1-2：Microsoft Excel 工作簿中的结构化数据示例](img/f01002.png)\n\n图 1-2：Microsoft Excel\
  \ 工作簿中的结构化数据示例\n\n即使是对于这种常见且简单的过程，几何意义的考虑也有助于阐明正在发生的情况。如果分类变量的值是有序的，那么我们就可以通过在一维轴上放置这些值，并以反映这些值的顺序的方式，将它们转换为单个数值变量。例如，调查值“满意”、“非常满意”和“极其满意”可以被编码为\
  \ `1`、`2` 和 `3`；或者如果你想让“满意”和“非常满意”之间的差异小于“非常满意”和“极其满意”之间的差异，那么你可以将这些编码为例如 `1`、`2`\
  \ 和 `4`。\n\n![图 1-3：转换后的结构化数据集，其中分类变量已被替换为两个二值虚拟变量](img/f01003.png)\n\n图 1-3：转换后的结构化数据集，其中分类变量已被替换为两个二值虚拟变量\n\
  \n如果类别无序——例如男性、女性和非二元性别——我们就不希望将它们强行放入一个维度中，因为那样会人为地给它们施加顺序，并使其中某些类别比其他类别更（参见图 1-4）。\n\
  \n![图 1-4：将分类变量的值放在单维度中会导致某些值比其他值更接近。](img/f01004.png)\n\n图 1-4：将分类变量的值放在单维度中会导致某些值比其他值更接近。\n\
  \n从几何角度来看，当我们创建虚拟变量时，是在为不同的类别创建新的轴。这样做有两种方法。有时，你会看到人们为分类变量的每个值使用一个虚拟变量，而在另另，你会看到人们对除一个值以外的所有值使用虚拟变量（正如我们在图\
  \ 1-3 中所做的那样）。为了理解其中的区别，让我们来看看三分类性别变量。\n\n使用三个虚拟变量将类别放置在等边三角形的顶点上：男性坐标为 `(1,0,0)`，女性坐标为\
  \ `(0,1,0)`，非二元性别坐标为 `(0,0,1)`。这确保了所有类别之间的距离都相等。仅使用两个虚拟变量意味着男性的坐标为 `(1,0)`，女性的坐标为\
  \ `(0,1)`，非二元性别的坐标为 `(0,0)`。这把我们在三维空间中的等边三角形投影到二维平面上的直角三角形，并在过程中扭曲了距离。现在，男性和女性离非二元性别比它们彼此更近，因为在这个边长为\
  \ `1` 的等腰直角三角形中，它们被长度为 `√2 ≈ 1.4` 的斜边分开（参见图 1-5）。因此，某些机器学习算法会错误地认为男性和女性类别与非二元性别类别的相似性高于它们彼此之间。\n\
  \n![图 1-5：创建性别虚拟变量的两种方法。左侧，为每个类别提供一个轴，确保类别等距。右侧，我们只使用两个轴，导致某些类别比其他类别更接近。](img/f01005.png)\n\
  \n图 1-5：创建性别虚拟变量的两种方法。左侧，为每个类别提供一个轴，确保类别等距。右侧，我们只使用两个轴，导致某些类别比其他类别更接近。\n\n\n\n\n\
  我们可以将数值表格看作是描述了一个点集（每行一个点），位于*欧几里得向量空间* `R^(*d*)` 中。这个几何空间在二维下看起来像一张平的纸，在三维下像一个实心砖，但它在所有方向上无限延伸，可以是任何维度。在这里，`d`\
  \ 是列数，也是该空间的维度。数值数据集中的每一列都代表该空间中的一个轴。具体而言，每个数据点的 `d` 维坐标就是该行中的值。\n\n当 `d` = 1 时，这个欧几里得向量空间\
  \ `R^(*d*)` 是一条直线。当 `d` = 2 时，它是一个平面。当 `d` = 3 时，它是我们习惯思考的普通三维空间。虽然人类无法真正视觉化三个以上的垂直轴，但无论如何，都可以用数学和计算工具对高维几何进行分析。这里重要的一点是，正如在平面之外还有许多二维形状（例如球体表面或甜甜圈表面，甚至是更奇特的莫比乌斯环）一样，在熟悉的欧几里得空间之外，许多三维几何空间（如三维空间的球体内部或四维空间的球体表面）。对于高维空间也是如此。处理结构化数据传统上意味着从\
  \ `R^(*d*)` 的视角观察数据，而不是其他任何类型的几何空间。\n\n`R^(*d*)` 的欧几里得向量空间结构是强大的；它允许我们计算各种有用信息。我们可以计算任意两个数据点之间的距离，这对于许多机器学习算法都是必要的。我们可以计算连接任意两点的线段，用于合成少数类过采样技术（SMOTE）利用此来调整类别不平衡的训练样本。我们可以计算数据中每个坐标的平均值，这有助于*填补*缺失值（即根据已知数据对真实值进行最佳猜测以填充缺失值）。\n\
  \n然而，这种优良的欧几里得向量空间结构也具有特定性和刚性。幸运的是，我们可以在更通用的设置下（在这些设置中没有全局欧几里得坐标）计算点之间的距离、连接点的最短路径以及各种形式的插值，包括*流形*（如球体之类的几何对象，放大后看起来像普通的欧几里得空间，但在全局范围内可以具有更有趣的形状和结构——参见第\
  \ 5 章）和*网络*（在第 2 章中正式引入的关系型结构）。\n\n作为一个具体的例子，假设你正在处理大规模地理数据，例如基于邮政编码的犯罪统计。你如何对数据点进行聚类或建立任何预测模型？最直接的方法是将纬度和经度作为变量来传递数据的地理特征。但问题很快出现了，因为这种方法将圆形的地球投影到平面上，会极大地扭曲距离。例如，经度范围从\
  \ –180° 到 +180°，因此主子午线两侧的两个点在英里上可能非常接近，但在经度上可能极其遥远（参见图 1-6）。拥有一种不需要将数据映射到平面表面即可在球面数据上工作的机器学习算法是有帮助的。\n\
  \n![图 1-6: 使用纬度和经度（左）作为地理数据的变量会扭曲数据点之间的距离。图中所示，主子午线两侧非常接近的点在经纬平面上（右）被表示为非常相远的点。](img/f01006.png)\n\
  \n图 1-6: 使用纬度和经度（左）作为地理数据的变量会扭曲数据点之间的距离。图中所示，主子午线两侧非常接近的点在经纬平面上（右）被表示为非常相远的点。\n\n\
  \n\n\n逻辑回归产生线性决策边界。（尽管通过向模型中添加高阶项，你也可以实现非线性决策边界。）决策树通过用单个不等式划分自变量来构建的，这导致决策边界由水平和垂直线段组成。在高维空间中，我们拥有的不是水平和垂直线，而是与坐标轴对齐的平面。随机森林是决策树的集成，它们仍然产生这种形式的决策边界，但它们往往涉及更多的片段，产生看起来像曲线的形状，但实际上是由许多微小的水平和垂直线段组成的。`k`-NN\
  \ 分类器产生多边形决策边界，因为它们根据有限训练数据点的远近程度来划分空间。神经网络可以产生复杂的、弯曲的决策边界；这种高度的灵活性既是祝福也是诅咒，因为如果不小心，它会导致过拟合（我们稍后会讨论过拟合）。\n\
  \n学习不同分类器算法产生的决策边界可以帮助你更好地理解每个算法的工作原理；它还可以帮助你根据数据特征来选择使用哪种算法（对于 `d` > 2 的高维数据，你可以通过绘制不同的变量对来获取数据的二维快照）。只需记住，这涉及到许多选择——使用哪些变量、是否包含高阶项、为超参数设置什么值等等——所有这些选择都影响了可能的决策边界类型。每当你遇到一个尚不熟悉的分类算法时，培养直觉的最佳方法之一就是画出它产生的决策边界，并观察它们随着你调整超参数是如何变化的。\n\
  \n### 回归\n\n监督回归也可以从几何角度来看，尽管它稍微更难直观化。回归算法不是根据类别预测将空间划分为有限的区域，而是为空间中的每个点分配一个数值；当\
  \ `d` = 2 时，这可以绘制成热力图或三维表面。图 1-8 显示了这样一个示例，其中，我们首先创建了 10 个具有随机因变量值的随机点（在顶部的图中，用圆圈的大小表示该值），然后我们对密集的点网格进行预测值进行\
  \ 3D 散点图，最后在使用 `k` = 3 的 `k`-NN（左下））和随机森林（右下）时根据高度进行着色。\n\n![图 1-8：训练数据通过圆圈大小指示因变量值（顶部图），以及两种非线性回归算法的三维预测表面：3-NN（左下）和随机森林（右下）](img/f01008_m.png)\n\
  \n图 1-8：训练数据通过圆圈大小指示因变量值（顶部图），以及两种非线性回归算法的三维预测表面：3-NN（左下）和随机森林（右下）\n\n线性回归的预测表面（此处未显示）是一个巨大的倾斜平面，而对于这里所示的两种方法，表面是有限个预测值保持不变的平面区域集合。注意，这些区域对于\
  \ `k`-NN 是多边形，而对于随机森林是矩形；情况将始终如此。此外，对于本示例中使用的特定超参数选择，随机森林的区域比 `k`-NN 的小。换句话说，与 `k`-NN\
  \ 算法相比，这里的随机森林以手术般的精度切割了数据空间；后者则更像是用用菜刀刻南瓜。但情况并非总是如此——这种粗糙程度的比较取决于随机森林中使用的树的数量以及\
  \ `k`-NN 中使用的邻居数量。重要的是，回归中更细的划分就像分类中更灵活的决策边界：它通常在训练数据上表现良好，但对新数据的泛化能力很差。这引出了我们的下一个主题。\n\
  \n### 过拟合\n\n回到图 1-7 中的决策边界图。初看起来看起来，边界越灵活，算法性能就越好。在考虑训练数据时这是真的，但真正重要的是算法在测试数据上的表现。预测分析中一个众为人知的问题是过拟合，即预测算法过于灵活，以至于学习了训练数据的特定细节，从而最终导致在未见过的新数据上表现更差。\n\
  \n在图 1-7 中，逻辑回归算法错误分类了最左侧的圆圈，而决策树创建了一个长长的条形区域来正确分类那个单独的点。如果圆圈倾向于落在左侧而加号倾向于落在右侧，那么在使用新数据时，创建这个条形区域很可能会损害整体分类性能——如果是这样，这就是决策树过拟合训练数据的例子。\n\
  \n通常情况下，随着预测算法灵活性的增加，训练误差倾向于持续下降直到最终稳定，而测试误差倾向于首先下降，然后达到最小值最后增加（参见图 1-9）。我们想要测试误差曲线的底部：那是我们能够实现的最佳预测性能。它发生在算法足够灵活以拟合数据分布的真实形状，但又足够僵硬，至于不会学习特定于训练数据的虚假细节。\n\
  \n![图 1-9：以预测算法的灵活性为函数的训练误差与测试误差的散点图，说明了过拟合的概念](img/f0109.png)\n\n图 1-9：以预测算法的灵活性为函数的训练误差与测试误差的散点图，说明了过拟合的概念\n\
  \n在图 1-9 中所示的通用的行为通常在改变超参数时发生：随着神经网络中神经元数量的增加，分类器的决策边界变得更加灵活；随着 `k`-NN 中邻居数量 `k`\
  \ 的减少；随着决策树中分支数量的增加，依此类推。\n\n# 维度灾难\n\n有时，将图 1-9 中的 x 轴视为复杂度而非灵活性会有帮助。更灵活的算法往往更复杂，反之亦然。算法复杂度最简单但最重要的标准之一是它使用的自变量数量。这被称为数据的维度。如果自变量的数量为\
  \ `d`，那么我们可以认为算法输入的是 `d` 维欧几里得向量空间 **R**^(*d*) 中的点。对于固定数量的数据点，使用过少的自变量倾向于导致欠拟合，而使用过多的则倾向于导致过拟合。因此，图\
  \ 1-9 也可以被解释为显示了在不增加数据集大小的情况下，随着数据维度增加，预测算法误差得分发生的情况。\n\n\n\n# 维度灾难\n\n随着维度的增加，测试误差最终会增加，这是被称为`维度灾难`的通用现象的一种实例。在处理列数相对于行数较大的结构化数据（这在基因组学等领域是一个常见情况）时，预测算法很容易发生过拟合，而且驱动许多机器学习方法的数值线性代数也会失效。这是一个巨大的问题，人们已经开发了许多技术来帮助应对——其中一些技术将在本书后面部分介绍。现在，让我们看看几何如何为维度灾难提供一些启示。\n\
  \n## 理解欧几里距离\n\n理解维度灾难的一种方法是将欧几里距离理解为在存在任意数量维度的空间中“鸟飞直达”的直线距离。想象在正正方形纸上画了两个对点，其中一组点彼此靠近，而另一组点彼此很远，如图图\
  \ 1-10 所示。\n\n![图 1-10: 二维空间中两对点的图](img/f01010r.png)\n\n图 1-10: 二维空间中两对点的图\n\n让我们通过添加一些高斯噪声来稍微扰动这些点；也就是说，我们将从二元正态分布中抽取四个向量，并将添加到四个点的坐标中。这样做会让点在随机方向上略微移动。让我们多次这样做，每次都记录扰动后左侧点对之间的欧几里距离，以及右侧点对之间的欧几里距离。如果扰动足够大，我们可能会导致左侧点之间的距离比右侧点更远，但总的来说，左侧扰动的欧几里距离将比右侧扰动的距离小，正如我们在图\
  \ 1-11 的直方图中所示。\n\n![图 1-11: 图 1-10 左侧临近点（浅灰色显示）和右侧远端点（深灰色显示）在随机微小扰动后的欧几里距离直方图](img/f01011.png)\n\
  \n图 1-11: 图 1-10 左侧临近点（浅灰色显示）和右侧远端点（深灰色显示）在随机微小扰动后的欧几里距离直方图\n\n## 嵌入高维\n\n接下来，我们将我们的正方形纸作为一个二维平面嵌入高维欧几里空间\
  \ `R^(*d*)` 中，然后重复扰动点并计算距离的实验。在高维中，这些扰动发生在更多的方向上。具体来说，你可以将其理解为为点的 `x` 和 `y` 坐标填充\
  \ `d-2` 个零，然后对这 `d` 个坐标中的每一个坐标添加少量的噪声。图 1-12 显示了当 `d = 10` 和 `d = 100` 时执行此过程得到的欧几里距离直方图。\n\
  \n\n\n\n如今存在的大多数数据并非自然地以电子表格的形式存在。示例包括文本数据、网络数据、图像数据，甚至是视频或音频片段数据。每种格式都有其独特的几何结构和分析挑战。让我们开始探索其中的一些非结构化数据类型，看看几何结构如何帮助我们理解和建模这些数据。\n\
  \n## 网络数据\n\n在下一章中，你将学习与网络相关的正式定义，但你在处理社交媒体时可能已经对网络有了初步认识。Facebook 好友关系构成了一个无向网络（节点是\
  \ Facebook 用户，边是他们之间的好友关系），而 Twitter 账户构成了一个有向网络（有向边是因为你既有关注者，也有你关注的账号）。网络数据本质上并没有任何欧几里得特征或电子表格的结构。近年来，深度学习已从常用的欧几里得电子表格设置扩展到了更通用的`Riemannian\
  \ manifolds`（黎曼流形，我们将在第 5 章）。\n\n![图 1-14：克鲁格国家公园的一只象（左）和一只母狮子（右）](img/f01014_m.png)\n\
  \n图 1-14：克鲁格国家公园的一只象（左）和一只母狮子（右）\n\n动物显示在自然环境中，那里的叶子、树枝和光线各不相同。它们的分辨率不同。每只动物的颜色也不同。与动物以及动物周围其他物体相关的形状也不同。手动推导出有意义的独立变量来对这些图像进行分类是非常的。幸运的是，CNN\
  \ 的设计是为了处理此类图像数据并自动创建有用的独立变量。\n\n基本思想是将每幅图像视为一个数学表面（见图 1-15），然后走过这个表面，创建其显著特征的地图——峰、谷，然后输入到下一层，依此类推。最后，CNN\
  \ 将图像转换为一系列层次编码图像内容的地图，而底层是实际用于分类的地图。对于这些动物图像，第一张地图可能会识别图像中的高对比区域。下一张地图可能会将这些区域组合成轮廓。随后的地图可能会指示哪些形状是动物。\n\
  \nCNN 构建这些地图的精确方式是通过训练过程内部学习的：随着算法被输入标记数据，每层神经元之间的连接会形成、断开并重新形成，直到最后层尽可能有利于分类任务。我们将在第\
  \ 10 章](#c10.xhtml）进一步探讨 CNN 及其量子版本。\n\n![图 1-15：从几何角度看作是 3D 数学表面的图 1-14 中的母狮头部](img/f01015.png)\n\
  \n图 1-15：从几何角度看作是 3D 数学表面的图 1-14 中的母狮头部\n\n使用计算几何方法量化峰和谷的应用不仅限于识别和分类。科学家可能想理解科学现象的动态过程或结构，例如物体上的水流或光流。物体的峰、谷和轮廓影响光物体时的散射方式，也会决定液体如何在物体上流动。我们将在书中后面介绍如何挖掘数据的峰、谷和轮廓。\n\
  \n## 文本数据\n\n近年来流行的另一种“非结构化”数据形式是文本数据。在这里，随数据存在的结构并不像图像那样具有空间性；而是语言性的。尖端文本处理（例如，Google\
  \ 处理搜索词，以及 Facebook 和 Twitter 检测违反平台政策的帖子）利用深度学习创建所谓的`vector embeddings`（向量嵌入），它将文本转换为\
  \ `Rd`，其中每个单词或句子都表示为欧几里得向量空间中的点。每个单词或句子的坐标通过阅读大量文本从数据中学习，深度学习算法选择这些坐标的方式本质上是将语言意义转化为几何意义。我们将在第\
  \ 9 章](#c09.xhtml）探讨深度学习文本嵌入。\n\n\n\n\n例如，我们可能想要可视化与文本文档的不同变量集。由于这些变量构成了一个高维空间，我们无法以人类可以可视化的方式对其绘图。在随后的章节中，我们将学习如何通过几何方法将高维数据映射到低维空间，以便在图表中轻松地可视化数据。我们可以根据文档类型或其他相关的文档属性，用颜色或不同的形状对这些图表进行装饰。如果相似的文档在这些图表中聚集在一起，那么涉及的某些变量很可能帮助我们区分不同的文档。对于具有未知属性但这些变量具有已测量值的新文档，则可以通过分类算法进行分组。我们将在第\
  \ 9 章中进一步探讨这一点。\n\n## 总结\n\n本章对传统机器学习的主要概念进行了简要回顾，但为这些概念引入了几何视角，这对于大多数读者来说可能是新颖的。在这一回顾中，还穿插了关于数据“结构化”意味着什么的讨论。主要的结论是，基本上所有数据都具有意义的结构，但这种结构通常是几何性质的，需要几何工具来将数据转化为更传统的电子表格格式。这是我们在贯本书书中将深入探讨的主题。本章还暗示了电子表格数据中隐藏的一些重要的几何结构。本书的主要目标之一是展示如何利用这种隐藏的几何结构来提高机器学习的性能。\n\
  \n我们将在第 2 和 3 章开始深入研究用于分析网络数据的算法，包括社交网络和地理网络。这包括理解网络结构和个人在网络中作用的局部和全局指标、为网络数据开发的聚类方法、用于建议网络中新边缘的链路预测算法，以及理解过程或流行病如何在网络中传播的工具。\n\
  \n# 2 网络的几何结构\n\n![](img/chapterart.png)\n\n我们在第 1 章中简单接触过网络，它们在我们的生活中扮演着日益重要的角色；相应的，网络数据在数据科学中发挥着日益重要的作用。我们如何衡量用户在社交媒体上的影响力？或者如何判断计算机网络应对黑客的健壮性？或者识别桥接不同社会群体的人？这些都是关于网络几何结构的问题，并且都是我们在本章中将探索的概念示例。\n\
  \n我们将从一个简短的激励章节开始，论证为什么网络数据是现代数据科学中的一个重要课题，并且从几何推理中极大受益。随后我们将介绍网络理论中的基本概念和定义，网络理论植根于图论的数学语言。本章的大部分将是对网络及其顶点相关数量的引导式之旅。我们将通过查看几种不同类型的随机网络作为结束，这些网络在文献中已被广泛研究，并且在\
  \ `R` 语言中容易生成。\n\n## 网络科学引论\n\n*网络科学*通过实体之间的相互关系研究实体，是一门重要的跨学科学科，自社交网络兴起以来，它在数据科学中获得了巨大的动力。正如我们在第\
  \ 1 章中所示，网络数据在通常意义上是“非结构化的”，但在其他方面它们是高度结构化的。从数学上说，网络植根于称为图论的学科，它将实体和关系提炼为它们的抽象本质。网络在几何上是丰富的，但它们的几何结构与通常的角度和直线的欧几里得几何不同。为了从网络中提取洞察，我们必须离开电子表格的欧几里得世界，拥抱更奇异的几何世界，在那里，球体看起来不像我们习惯看到的圆形物体。\n\
  \n让我们考虑一个社交媒体的例子。Facebook 等平台上的用户形成一个网络，距离可以由连接两个人的最小友谊数量来定义。这种距离的概念支撑了衡量用户在网络中中心性的几种方法，我们可以用它以各种方式量化“影响力”。例如，我们可以统计直接连接的朋友的数量，以此来量化各种方式的“影响力领袖”。我们可以统计直接连接到用户的的朋友数量，我们可以统计有多少朋友的朋友。换句话说，一个用户可能没有许多直接连接，但可能拥有巨大的影响力范围。网络的几何结构允许我们通过衡量用户网络与其他网络相比的概率来检测异常值；这有助于社交媒体平台自动检测虚假账号。\n\
  \n一个基于网络的异常检测的迷人应用出现在最近一起关于选区划分州法院诉讼中。2018 年之前宾夕法尼亚州的一张选区地图被广泛认为是有利于共和党的党派选区划分的结果，但直到一个专家团队引入了网络科学，法院才被说服。他们展示了可以将选区地图视为网络，通过在地图空间中进行随机游走并在统计上探测这些网络的几何结构，他们发现宾夕法尼亚州的地图距离平均值几个标准差。当时考虑的新地图正处于正态曲线的中心。他们得出结论，旧地图极不可能自然产生；它是如此异常，以至于是地图绘制者（他们受控于当时的共和党人）故意设计的，以增加共和党的席位数量。相比之下，新地图要典型得多（且是公平的）。法院被这种网络分析说服了，并在\
  \ 2018 年废弃了旧地图，采用了新地图。\n\n即使在表面上看起来不是关于网络的场景中，有时也有一种将数据视为网络数据的方法——这样做可以利用一组源自网络卓越几何结构的丰富工具。\n\
  \n本章侧重于网络的几何结构以及如何利用它来定义一系列指标，以量化网络形状和结构的各个方面。在下一章中，我们将应用这些指标来探索网络数据上的机器学习和其他形式的数据分析。让我们正式开始旅程。\n\
  \n## 网络理论基础\n\n网络传达了实体（可以是个人、物体、项目等）之间的两两关系。实体由*顶点*（也称为*节点*）表示，而一对实体之间的关系由连接这对顶点的*边*表示。以下是作为网络研究的一些实体和关系的示例：人与人之间的电话和短信、生物通路中相互作用的蛋白质、通过道路连接的城镇、通过页面链接连接的网站、在同一任务期间激活的大脑部分、语言中词汇或词性之间的连接——这只是流行示例的一个冰角。\n\
  \n\n\n在绘制网络时，顶点被描绘为点，有时会装饰有符号以便我们识别哪个顶点是哪个；边通常是直线线段，但有时（例如为了避免人为的边相交）将某些边画为圆弧是有帮助的。所有重要的是顶点集合以及它们之间的边——而不是边在图中的长度、它们之间的角度，或顶点的位置。事实上，如图\
  \ 2-1 所示，同一个网络可以用相当不同的方式进行绘制。\n\n它们具有相同的顶点和连接顶点的相同边，但这些关系的绘制方式各不相同。无论我们如何视觉化这些关系，它们的底层结构都不会改变。\n\
  \n![图 2-1: 同一个网络的两种不同绘图。它们具有相同的顶点和连接顶点的相同边，但这些关系的绘制方式各不相同。无论我们如何视觉化这些关系，它们的底层结构都不会改变。](img/f02001_m.png)\n\
  \n图 2-1: 同一个网络的两种不同绘图。它们具有相同的顶点和连接顶点的相同边，但这些关系的绘制方式各不相同。无论我们如何视觉化这些关系，它们的底层结构都不会改变。\n\
  \n### 有向网络\n\n如果边代表单向关系（意味着它们从一个称为`source`的顶点指向另一个称为`target`的顶点），则网络是`directed`（有向的）；否则，边表示相互关系，网络是`undirected`（无向的）。例如，对于电话对话，我们可以为任何两个通过过电话的人创建一个带边的无向网络，或者我们可以创建一个有向网络，用边表示从源点人到目标人的拨出电话。\n\
  \n具体来说，假设我们有三个同事：Sadako、Pedro 和 Georg。Sadako 是项目负责人，因此她给 Pedro 和 Georg 打了电话。Pedro\
  \ 就项目工程方面的问题给 Georg 打了电话，但 Georg 没有给 Pedro 或 Sadako 打电话。Pedro 没有给 Sadako 打电话，因为当她给他打电话时，他已经收到了指令。图\
  \ 2-2(a)显示了这些同事的无向网络，而图 2-2(b)显示了有向网络。\n\n![图 2-2: 三个同事之间的电话网络，(a)无向的，(b)有向的](img/f02002.png)\n\
  \n图 2-2: 三个同事之间的电话网络，(a)无向的，(b)有向的\n\n有向网络的示例包括旅行路线、机器和社会过程、追踪疫情的针头共享以及生物过程模型。从数学上说，Facebook\
  \ 和 Twitter 之间最大的区别是 Facebook 是无向网络（好友是相互的），而 Twitter 是有向网络（用户既有粉丝，也有被关注的账号）。\n\n\
  ### R 中的网络\n\n在计算机中表示网络有两种主要方法。`edge list`（边列表）以任意顺序列出网络中所有的边，命名每条边的两个顶点（如果网络是有向的，则第一个顶点被视为源，第二个顶点视为目标）。在\
  \ R 中处理网络数据的有用包是 `igraph` 库（它在 Python 中也存在，具有相似的命令和语法）。要从边列表创建图 2-2(b) 中的有向网络，你可以使用\
  \ Listing 2-1 中的代码。\n\n```r\nlibrary(igraph)\nedges<-rbind(c(\"Sadako\",\"Pedro\"\
  ),c(\"Sadako\",\"Georg\"),c(\"Pedro\",\"Georg\"))\ng_colleagues<-graph.edge(edges,directed=T)\n\
  ```\n\nListing 2-1: 从边列表生成图 2-2(b) 中有向网络的脚本\n\n网络的另一种表示方法是电子表格。如果一个网络有 `n` 个顶点，其`adjacency\
  \ matrix`（邻接矩阵）是一个 `n`×`n` 矩阵，其行和列由顶点索引，其中 `(i, j)` 中的 `0` 表示从顶点 `i` 到顶点 `j` 没有边，而该项中的\
  \ `1` 表示存在这样的边。如果网络是无向的，则邻接矩阵是对称的（等于其转置，意味着交换行和列时它保持不变），因为在这种情况下，从顶点 `i` 到顶点 `j`\
  \ 有边等同于从顶点 `j` 到顶点 `i` 有边。Listing 2-2 提供了从邻接矩阵而非边列表构建上述有向网络的 R 代码。\n\n```r\nlibrary(igraph)\n\
  adjmat<-matrix(c(0,0,0,1,0,0,1,1,0),nrow=3)\nrownames(adjmat)<-c(\"Sadako\",\"Pedro\"\
  ,\"Georg\")\ncolnames(adjmat)<-c(\"Sadako\",\"Pedro\",\"Georg\")\ng_colleagues<-graph_from_adjacency_matrix(adjmat,mode=\"\
  directed\",weighted=T)\n```\n\nListing 2-2: 从邻接矩阵生成图 2-2(b) 中有向网络的脚本\n\n邻接矩阵方法的一个主要优势是它将网络置于线性代数的框架中，在那里可以使用许多强大的工具。例如，我们可以使用邻接矩阵的谱理论（特征值和特征向量）来衡量网络中的中心性。邻接矩阵还可以推广到`weighted\
  \ networks`（加权网络）；通过允许任意数字作为条目（而不只是目前讨论的二进制 0 和 1），我们可以为每条边分配一个实数权重。在实践中，这可以表示许多不同的概念：同事之间的通话量、交通网络中的距离。\n\
  \n### 网络中的路径和距离\n\n如果两个顶点由边连接，则称为`neighbors`（邻居）。网络中的两条边如果有一个公共顶点，则它们是`adjacent`（相邻的）。网络中的`path`（路径）是相邻边的序列。如果网络是有向的，则路径中的所有边必须方向一致。例如，在图\
  \ 2-2(b) 中，我们有一条从 Sadako 到 Pedro 再到 Georg 的双边路径，以及一条从 Pedro 到 Georg 的单边路径，但从 Pedro\
  \ 到 Sadako 再到 Georg 不是路径，因为边的方向并不是这样的。\n\n路径的`length`（长度）有两种含义，取决于网络是加权的还是无权的。在无权网络中，路径的长度是路径中边的数量；在加权网络中，长度是路径中边的权重和。两个顶点之间的`network\
  \ distance`（网络距离）是连接它们的最小路径的长度，假设从一个点到另一个点有路径（如果没有路径，则网络距离未定义）。人们（包括在我们内）通常说“最短”路径而不是“最小长度”路径，因为听起来更自然。这对于加权网络来说有些误导性，因为最小长度路径实际上是权重最低的路径，它在边数意义上可能并不是最短。\n\
  \n作为一个例子，让我们考虑图 2-3 中的加权无向网络，它代表四个城镇以及它们之间道路的长度（英里）。\n\n![图 2-3: 城镇连通性和连接城镇的道路里程](img/f02003.png)\n\
  \n图 2-3: 城镇连通性和连接城镇的道路里程\n\n\n\n`V2` 与 `V3` 之间的最短路径是经过 `V4` 的 8 英里路径，而不是直接连接这两个城镇的\
  \ 12 英里路。因此，`V2` 和 `V3` 之间的网络距离是 8 英里，而不是 12 英里。请注意，此图中边和路径的物理长度在任何意义上都不代表由权重定义的长度；换句话说，网络图中的欧几里得距离与网络距离毫无关系！由\
  \ `igraph` 绘制的网络图中，顶点的的位置是基于美学考虑选择的（例如，为了尽可能减少边交叉次数），而不是为了反映边权重。这在刚开始可能很难适应，但随着时间的推移，会开始变得很自然。列表\
  \ 2-3 提供了创建和绘制此示例中网络的 R 代码。\n\n```r\n# 创建城镇之间连接关系及每个城镇之间里数的对称矩阵\ntowns<-matrix(c(0,0,0,4,0,0,12,2,0,12,0,6,4,2,6,0),nrow=4)\n\
  \n# 为行和列标记，以便城镇拥有名称\nrownames(towns)<-c(\"V1\",\"V2\",\"V3\",\"V4\")\ncolnames(towns)<-c(\"\
  V1\",\"V2\",\"V3\",\"V4\")\n\n# 从此邻接矩阵创建一个加权无向网络\nlibrary(igraph)\ng_towns<-graph_from_adjacency_matrix(towns,mode=\"\
  undirected\",weighted=T)\n\n# 绘制城镇图，并用权重标记边\nplot(g_towns,edge.label=E(g_towns)$weight,main=\"\
  按路里程连接的城镇图\",vertex.color=2,vertex.size=20)\n```\n\n列表 2-3：一个从图 2-3 生成并绘制连接城镇网络的脚本\n\
  \n网络距离在现实世界问题中可能起着重要作用。在 2018 年刚果民主共和国东爆发埃拉病毒疫情期间，城镇之间有限的物理路线影响了疫情传播、移动医疗物资和人员的供应链物流，以及受影响城镇与当时没有活跃病例的城镇之间的人口混合。\n\
  \n关于加权网络的一点警告：我们倾向于将彼此靠近（由网络距离定义）的顶点认为彼此关系最紧密或连接最强。这意味着边的权重越小，它所代表的关系就越强。由于这个原因，在设置网络权重时，你通常希望使用倒数。例如，在一个加权电话网络中，与其将\
  \ A 人和 B 人之间的权重设为他们之间的的通话次数 `c[AB]`，不如将其设置为倒数 `1/c[AB]`，这样通话得更频繁的人在加权网络中彼此更近（而不是更远）。在第\
  \ 3 章中，我们将重新回顾图 2-3 中的城镇网络，并对权重取倒数，使其代表邻近性而非距离。\n\n为了开始探索由网络距离建立的几何结构，我们现在转向网络中的中心性概念（也可以被视为重要性或影响力）。由于我们在整个章节中将依赖\
  \ `igraph`，我们以后不再在代码段中包含 `library(igraph)`；因此，在运行以下任何代码示例之前，请务必加载此库。\n\n## 网络中心性指标\n\
  \n衡量网络中每个顶点的中心性（`centrality`）或重要性可以让你手动分析网络的结构和功能行为。它也经常被用于特征提取，因为中心性指标提供了数值特征，可以输入到传统的监督和无监督机器学习算法中，正如我们在[第\
  \ 3 章]中所看到的。\n\n\n\n\n# 顶点的紧密性 (Closeness)\n\n如何确定一个顶点位于网络中心附近还是边缘区域？顶点的 `closeness`（紧密性）定义为该顶点与网络中其他每个顶点之间距离之和的倒数，其设计目的是捕捉这种区别。靠近网络中心的顶点到网络中其他顶点的距离相对较小，而边缘边缘顶点到某些顶点的距离较小，但到网络“对侧”顶点的距离则很大。这意味着中心顶点的距离之和小于边缘顶点的距离之和；对这个总和取倒数就会反转过来，使得中心顶点的紧密性得分高于边缘顶点。\n\
  \n在图 2-3 中，你可能会直观地判断 `V4` 是最中心的，`V2` 和 `V3` 居中，而 `V1` 是最外边缘的。事实上，如果我们忽略边权重并作为无权网络计算紧密性得分，我们得到\
  \ `V1`、`V2`、`V3` 和 `V4` 的紧密性得分分别为 0.20、0.25、0.25 和 0.33。例如，`V2` 的紧密性为 `1/(1 + 1\
  \ + 2)`。当使用边权重时，我们得到的紧密性得分为 0.05、0.06、0.04 和 0.08，因此 `V4` 仍然是最中心的，但现在 `V3` 变成了最边缘的；这是因为边权重使得\
  \ `V3` 与其他顶点之间的网络距离相对较大。\n\n# 顶点的介数 (Betweenness)\n\n顶点的 `betweenness`（介数）通过计算网络中有多少条路径通过该顶点来衡量中心性；更准确地说，它是网络中所有其他顶点对之间，通过该顶点的最短路径占该对最短路径总比例的和。当将图\
  \ 2-3 视为无权网络时，`V1` 的介数为 0，因为其余顶点之间没有最短路径通过 `V1`。`V2` 和 `V3` 的情况也是如此。然而，`V4` 的介数为\
  \ `2 = 1 + 1 + 0`，因为 `V1` 和 `V2` 之间有一条通过 `V4` 的最短路径，`V1` 和 `V3` 之间有一条通过 `V4` 的最短路径，而\
  \ `V2` 和 `V3` 之间的最短路径不通过 `V4`。\n\n在图 2-4 中，每个顶点的介数得分均为 0.5。例如，对于 `V1` ，`V2` 和 `V4`\
  \ 之间的单边路径不通过 `V1`，`V3` 和 `V4` 之间的单边路径不通过 `V1`，而 `V2` 和 `V3` 之间有两条最短路径，其中一条通过 `V1`，组合得出\
  \ `0 + 0 + 1/2` 的介数得分。\n\n![Figure 2-4: 以正方形连接的四个顶点的网络](img/f02004.png)\n\n图 2-4:\
  \ 以正方形连接的四个顶点的网络\n\n# 特征向量中心性 (Eigenvector Centrality)\n\n基于邻接矩阵的中心性旨在捕捉一个基本思想：顶点的重要性由与其连接的顶点的重要性决定。这就是之前提到的网络深度概念所在。例如，在社交媒体上，重要的不仅是你的粉丝数量，还有你的粉丝数量。\n\
  \n让我们让这个想法精确化。假设我们要为每个顶点 `i` 分配一个重要性得分 `x[i]`。一个简单的模型是假设每个顶点的重要性与其相邻顶点的加权和成正比：\n\
  \n`x[i] = c∑()a[ij]x[j]`\n\n其中求和针对是顶点 `i` 的邻顶点 `j`，`a[ij]` 是顶点 `i` 与顶点 `j` 之间边的权重，`c`\
  \ 是比例常数（我们假设它与 `i` 无关）。该公式可以表示为矩阵方程：\n\n`xoverrightarrow = cAxoverrightarrow`\n\n\
  其中 `A` 是网络的邻接矩阵。你可能从线性代数中记得，该方程规定顶点的重要性向量 `xoverrightarrow` 是邻接矩阵的*特征向量*（eigenvector），而\
  \ `1/c` 是对应的*特征值*（eigenvalue）。当把矩阵视为线性变换时，特征向量是那些被拉伸但没有旋转的方向，而特征值衡量了这些方向被拉伸了多少。\n\
  \n\n\n\n\n在图 2-3 中，当被视为无权网络时，`V1`、`V2`、`V3` 和 `V4` 的特征向量中心性得分（四舍五入到百分位）分别为 0.46、0.85、0.85\
  \ 和 1。这符合我们的直觉，即 `V4` 是最中心的，而 `V1` 最不中心。当使用图中所示的权重作为加权网络计算时，得分则变为 0.16、0.91、1 和\
  \ 0.59。因此，在加权网络中，`V1` 仍然是最不中心的，但最中心的是 `V3`。\n\n特征向量中心性的核心点在于：对于邻具有较高特征向量中心性得分的顶点，其中心性更高。在社交网络术语中，这意味着你的重要性取决于你朋友的重要性。\n\
  \n我们可以通过随机游走的角度更精确地解释特征向量中心性。想象你从一个随机顶点开始，通过随机选择当前顶点连接的一条边来重复移动。如果网络是无权的，那么你以等概率选择这些边；而如果网络是加权的，则选择边的概率与边的权重成正比。特征向量中心性得分与你在进行这些随机游走时在每个顶点上花费的时间成正比。例如，如果网络代表全球维网（顶点是网站，边是链接），那么特征向量中心性就传达了用户仅随机点击链接时，每个网站获得的流量大小。\n\
  \n特征向量中心性的缺点是，如果没有路径连接两个不同的部分，随机游者永远无法在网络的两个部分之间旅行。换句话说，每个随机游者都受限于它起始所在的“岛屿”（或者用更数学化的术语，即`连通分量`）。这对于有向网络尤其特别有问题，因为边只能沿着一个方向遍历：如果随机游者到达死胡同，它将永远被困在那里。帮助随机游者越过岛屿和死胡同的一种方法是允许他们随机跳转到网络中的不同位置。这是我们将看到的下一个指标的核心思想。\n\
  \n# PageRank 中心性\n\nGoogle 的 `PageRank 中心性` 只是特征向量中心性的微小修改；它在计算特征向量之前，将邻接矩阵替换为缩放后的版本。在图\
  \ 2-3 中，作为无权网络计算的 `V1`、`V2`、`V3` 和 `V4` 的 PageRank 得分分别为 0.13、0.25、0.25 和 0.37。\n\
  \n理解 PageRank 的最佳方法是基于随机游走概率。我们和计算特征向量中心性时玩同样的游戏，但现在每一步有两种可能：随机游者要么像以前一样跨越连接的一条边，要么直接跳转到网络中的一个随机顶点。在全球维网的例子中，这意味着人们可以点击链接，也可以直接在网络浏览器中输入\
  \ URL。这种跳转的能力帮助随机游者探索网络的更大范围，与特征向量中心性相比，这有助于增加该中心性得分捕获的信息。\n\n### Katz 中心性\n\n另一个同样从网络邻接矩阵的光谱理论计算出的有用中心性指标是\
  \ `Katz 中心性`。\n\n### 枢纽与权威性\n\n泛化特征向量中心性的另一种方法是为每个顶点提供两个独立的得分而不是一个。从概念上讲，`权威中心性（authority\
  \ centrality）` 衡量它接收了多少知识，而`枢纽中心性（hub centrality）` 衡量一个顶点了解多少知识。\n\n## 在示例社交网络中衡量中心性\n\
  \n为了更好地理解所有中心性指标，考虑一个比我们目前考虑过的更有趣的例子会有帮助。列表 2-4 中的脚本加载并绘制了来自此作者之一的网络。你可以在书的网页上找到数据集以及其他文件：`https://nostarch.com/shapeofdata`。由于不同中心性指标的范围不同，在后续我们将重新缩放每个指标，使其最大值为\
