  - 理解自旋玻璃聚类（Spinglass Clustering）另一种聚类方法不涉及随机游走或局部优化。相反，它源于统计力学——物理学中研究粒子相互作用的分支。`Spinglass
    algorithms` 基于粒子系统（正负荷）内部的磁耦合；它们试图优化电荷跨整个系统的对齐方式。这可以应用于顶点聚类，被称为 `spinglass clustering`。基本思想是定义一个与聚类相关的能量，然后尝试最小化这种能量。这种能量最小化过程通常通过
    `simulated annealing`（模拟退火）完成，这是一种优化算法方法，其根源也同样统计力学。在模拟退火中，并不是总是朝着能量最多的方向移动（正如贪心算法所做的那样，后者有陷入局部最优的风险），而是有一个温度参数来决定向相反的“错误”方向移动的概率。随着算法的进行，温度会逐渐降低。这有助于算法在后期稳定下来并锁定特定解决方案之前，探索能量景观的大部分区域。它模拟了冶金术中金属净化的冷却过程。
