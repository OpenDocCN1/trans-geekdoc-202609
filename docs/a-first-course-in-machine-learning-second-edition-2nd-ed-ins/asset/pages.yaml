    \ \\propto \\left(\\sum_{m\\neq n} z_{mk}\\right) \\prod_{d=1}^{D} \\int P(x_{nd}|z_{nk}=1,p_{kd})p(p_{kd}|\\\
    dots) dp_{kd}.$\n\nBecause of the conjugacy of the Beta prior and the binomial\
    \ likelihood, we can analytically evaluate the integral:\n\n$= \\int p_{kd}^{x_{nd}}(1-p_{kd})^{1-x_{nd}}\
    \ \\frac{\\Gamma(\\alpha^*+\\beta^*)}{\\Gamma(\\alpha^*)\\Gamma(\\beta^*)}p_{kd}^{\\\
    alpha^*-1}(1-p_{kd})^{\\beta^*-1} dp_{kd}$\n$= \\frac{\\Gamma(\\alpha^*+\\beta^*)}{\\\
    Gamma(\\alpha^*)\\Gamma(\\beta^*)} \\int p_{kd}^{\\alpha^*+x_{nd}-1}(1-p_{kd})^{\\\
