  md: 'EX 5.4. The data consists of $N_c$ $M$-dimensional vectors of integer counts.
    The multinomial likelihood for the $N_c$ data objects is:


    $p(\mathbf{x}_1,\dots,\mathbf{x}_{N_c}|q_{c1},\dots,q_{cM}) = \mathcal{L} \propto
    \prod_{n=1}^{N_c} \prod_{m=1}^{M} q_{cm}^{x_{nm}}$


    (where the constant that does not depend on $q_{cm}$ has been omitted for brevity).
    Once again, we work with the log likelihood and take partial derivatives with
    respect to $q_{cm}$. We must also add a Lagrangian term due to the constraining
    that $\sum_m q_{cm}=1$. Calling this new objective function $g$ gives:


    $\log \mathcal{L} = \sum_{n=1}^{N_c} \sum_{m=1}^{M} x_{nm} \log q_{cm}$

    $g = \sum_{n=1}^{N_c} \sum_{m=1}^{M} x_{nm} \log q_{cm} - \lambda \left(\sum_m
    q_{cm} -1\right)$

    $\frac{\partial \log \mathcal{L}}{\partial q_{cm}} =0 = \sum_{n=1}^{N_c} \frac{x_{nm}}{q_{cm}}
    - \lambda$

    $q_{cm} = \frac{\sum_{n=1}^{N_c} x_{nm}}{\lambda}$


    To compute $\lambda$ we sum both sides over $m$:


    $\sum_m q_{cm} = \frac{1}{\lambda} \sum_{m,n} x_{nm}$

    $1 = \frac{1}{\lambda} \sum_{m,n} x_{nm}$

    $\lambda = \frac{1}{\sum_{n,m} x_{nm}}$


    Therefore, the maximum likelihood estimate of $q_{cm}$ is:


    $q_{cm} = \frac{\sum_n x_{nm}}{\sum_{n,m''} x_{nm''}}$


    EX 5.5. The likelihood (ignoring terms not involving $q_{cm}$) is:


    $p(\mathbf{x}_1,\dots,\mathbf{x}_{N_c}|\mathbf{q}_c) \propto \prod_{n=1}^{N_c}
    \prod_{m=1}^{M} q_{cm}^{x_{nm}}$


    The prior over $\mathbf{q}_c$ is a Dirichlet with constant parameter $\alpha$
    (again, ignoring terms not involving $q_{cm}$):


    $p(\mathbf{q}_c|\alpha) \propto \prod_{m=1}^{M} q_{cm}^{\alpha-1}$'
