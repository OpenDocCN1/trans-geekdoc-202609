  md: "Multiplying this by **w** gives:\n\n$$x_nx_n^{\\mathsf T}\\mathbf{w}=\\begin{bmatrix}w_0x_{n1}^2+w_1x_{n1}x_{n2}\\\
    \\w_0x_{n2}x_{n1}+w_1x_{n2}^2\\end{bmatrix}$$\n\nSumming over the $N$ terms leads\
    \ us to the matrix we derived previously.\n\n**EX 1.6.** Code below:\n\n```\n\
    ```matlab\n%% Women's 100m data\n% Load all Olympic data\nload olympics;\n% Copy\
    \ the necessary variables\nx = female100(:,1); % Olympic year\nt = female100(:,2);\
    \ % Winning time\n% Augment x\nX = [repmat(1,size(x)) x];\n% Get solution\nw =\
    \ inv(X'*X)*X'*t;\n```\n```\n\nThe fitted model is:\n\n$$t=40.9242-0.0151x$$\n\
    \n**EX 1.7.** Plugging 2012 and 2016 into the above expression yields winning\
    \ times of 10.5997 and 10.5394 respectively.\n\n**EX 1.8.** The men's model is:\n\
    \n$$t=36.4165-0.0133x$$\n\nThe women's model is:\n\n$$t=40.9242-0.0151x$$\n\n\
