  md: 'This has the form of a Gaussian, $Q_{\mathbf{x}_n}(\mathbf{x}_n)=\mathcal{N}(\boldsymbol{\mu}_{\mathbf{x}_n},\boldsymbol{\Sigma}_{\mathbf{x}_n})$.
