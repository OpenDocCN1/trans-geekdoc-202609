- pgno: 10
  md: '# Chapter 2


    EX 2.1. The errors are real valued and hence a continuous random variable would
    be more appropriate.


    EX 2.2. If all outcomes are equally likely, they have the same probability of
    occurring. Defining $Y$ to be the random variable taking the value shown on a
    die, we can state the following:


    $$P(Y=y)=r,$$


    where $r$ is a constant. From the definition of probabilities, we know that:


    $$\sum_{y=1}^{6}P(Y=y)=1.$$


    Substituting $r$ into this gives us the following:


    $$\sum_{y=1}^{6}r=1,\quad 6r=1,\quad r=1/6.$$


    EX 2.3. (a) $Y$ is a discrete random variable that can take any value from 0 to
    inf. The probability that $Y\leq 4$ is equal to the sum of all of the probabilities
    that satisfy $Y\leq 4$, $Y=0$, $Y=1$, $Y=2$, $Y=3$, $Y=4$:


    $$P(Y\leq 4)=\sum_{y=0}^{4}P(Y=y).$$


    When $\lambda=5$, we can compute these probabilities as:


    $$P(Y\leq 4)=0.0067379+0.0336897+0.0842243+0.1403739+0.1754674=0.44049.$$


    (b) Because $Y$ has to satisfy either $P(Y\leq 4)$ or $P(Y>4)$, we know that $P(Y>4)=1-P(Y\leq
    4)$:


    $$P(Y>4)=0.5591.$$


    EX 2.4. We require $\mathbb{E}_{p(y)}\{\sin(y)\}$ where $p(y)=u(a,b)$. The uniform
    density is given by:


    $$p(y)=\begin{cases}\frac{1}{b-a}, & a\leq y\leq b\\ 0, & \text{otherwise}\end{cases}$$'
