    $$\xi_n \ge 0,\quad t_n(\mathbf{w}^\mathsf{T}\mathbf{x}_n + b) \ge 1 - \xi_n.$$


    Adding the constraints as Lagrangian terms gives:


    $$\frac{1}{2}\mathbf{w}^\mathsf{T}\mathbf{w} + C\sum_n \xi_n - \sum_n \alpha_n\left(t_n(\mathbf{w}^\mathsf{T}\mathbf{x}_n
    + b) - 1 + \xi_n\right) - \sum_n \xi_n\gamma_n$$


    subject to $\alpha_n \ge 0$, $\gamma_n \ge 0$, which must be minimised with respect
    to $\mathbf{w}$, $b$ and $\xi_n$ and maximised with respect to $\alpha_n$ and
    $\gamma_n$. At the solution:


    $$\frac{\partial}{\partial\mathbf{w}} = \mathbf{w} - \sum_n \alpha_n t_n = 0$$


    $$\frac{\partial}{\partial b} = - \sum_n \alpha_n t_n = 0$$


    $$\frac{\partial}{\partial\xi_n} = C - \alpha_n - \gamma_n = 0.$$


    Substituting the first and third of these expressions back into the objective
    function and re-arranging gives:


    $$-\frac{1}{2}\sum_{n,m} \alpha_n\alpha_m t_n t_m \mathbf{x}_n^\mathsf{T}\mathbf{x}_m
    + \sum_n \alpha_n$$


    which must be maximised with respect to $\alpha$ subject to:


    $$\sum_n \alpha_n t_n = 0,\quad 0 \le \alpha_n \le C.$$


    Where the first constraint comes from the partial derivative with respect to $b$
    and the second from the partial derivative with respect to $\xi_n$ and the fact
    that $\gamma_n \ge 0$.'
