- pgno: 12
  md: 'Where $w_d$ and $\mu_d$ are the $d$th elements of **w** and **μ** respectively.
    The exponential of a sum is the same as a product of exponentials. Hence,


    $$\begin{aligned} p(\mathbf{w}) &= \frac{1}{(2\pi)^{D/2}(\sigma^2)^{D/2}}\prod_{d=1}^{D}\exp\left\{-\frac{1}{2\sigma^2}(w_d-\mu_d)^2\right\}
    \\ &= \prod_{d=1}^{D}\frac{1}{(2\pi)^{1/2}\sigma}\exp\left\{-\frac{1}{2\sigma^2}(w_d-\mu_d)^2\right\}
    \\ &= \prod_{d=1}^{D}p(w_d\mid\mu_d,\sigma^2). \end{aligned}$$


    where $p(w_d\mid\mu_d,\sigma^2)=\mathcal{N}(\mu_d,\sigma^2)$. Hence, the diagonal
    covariance is equivalent to assuming that the elements of **w** are distributed
    as independent, univariate Gaussians with mean $\mu_d$ and variance $\sigma^2$.


    **EX 2.6.** Using the same methods as in the previous exercise, we see that the
    determinant of the covariance matrix is given by $\prod_{d=1}^{D}\sigma_d^2$ and
    we have the following:


    $$p(\mathbf{w})=\frac{1}{(2\pi)^{D/2}\left(\prod_{d=1}^{D}\sigma_d^2\right)^{1/2}}\exp\left\{-\frac{1}{2}\sum_{d=1}^{D}\frac{(w_d-\mu_d)^2}{\sigma_d^2}\right\}$$


    Changing the sum to a product leaves us with


    $$\begin{aligned} p(\mathbf{w}) &= \frac{1}{(2\pi)^{D/2}\left(\prod_{d=1}^{D}\sigma_d^2\right)^{1/2}}\prod_{d=1}^{D}\exp\left\{-\frac{1}{2\sigma_d^2}(w_d-\mu_d)^2\right\}
    \\ &= \prod_{d=1}^{D}\frac{1}{(2\pi)^{1/2}\sigma_d}\exp\left\{-\frac{1}{2\sigma_d^2}(w_d-\mu_d)^2\right\}.
    \end{aligned}$$


    This is the product of $D$ independent univariate Gaussian densities.


    **EX 2.7.** The Hessian for a general model of our form is given by:


    $$-\frac{1}{\sigma^2}\mathbf{X}^{\mathsf{T}}\mathbf{X}$$


    For the linear model, **X** is defined as:


    $$\mathbf{X}=\begin{bmatrix}1 & x_1\\1 & x_2\\\vdots & \vdots\\1 & x_N\end{bmatrix}$$


    Therefore $-\frac{1}{\sigma^2}\mathbf{X}^{\mathsf{T}}\mathbf{X}$ is:


    $$\mathbf{X}^{\mathsf{T}}\mathbf{X}=\begin{bmatrix}N & \sum_{n=1}^{N}x_n\\\sum_{n=1}^{N}x_n
    & \sum_{n=1}^{N}x_n^2\end{bmatrix}$$'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'The diagonal elements are $-N/\sigma^2$ and $-(1/\text{sigma}^2)\sum_{n=1}^{N}x_n^2$
    which are equivalent (they differ only by multiplication with a negative constant)
    the expressions obtained in Chapter 1.


    **EX 2.8.** We have $N$ values, $x_1,\ldots,x_N$. Assuming that these values came
    from a Gaussian, we want to find the maximum likelihood estimate of the G and
    want to find the maximum likelihood estimates of the mean and variance of the
    Gaussian. The Gaussian pdf is:


    $$\frac{1}{\sqrt{2\pi\sigma}}\exp\left\{-\frac{1}{2\sigma^2}(x_n-\mu)^2\right\}$$


    Assuming the IID assumption, the likelihood of all $N$ points is given by a product
    over the $N$ objects:


    $$\prod_{n=1}^{N}\frac{1}{\sqrt{2\pi\sigma}}\exp\left\{-\frac{1}{2\sigma^2}(x_n-\mu)^2\right\}.$$


    We’ll work with the log of the likelihood:


    $$\log L=\sum_{n=1}^{N}\left(-\frac{1}{2}\log(2\pi)-\frac{1}{2}\log(\sigma^2)-\frac{1}{2\sigma^2}(x_n-\mu)^2\right)$$


    To find the maximum likelihood estimate for $\mu$, we differentiate with respect
    to $\mu$, equate to zero and solve:


    $$\begin{aligned}\frac{\partial\log L}{\partial\mu}&=\sum_{n=1}^{N}\frac{1}{\sigma^2}(x_n-\mu)\\[4pt]0&=\frac{1}{\sigma^2}\sum_{n=1}^{N}(x_n-\mu)\\[4pt]0&=\sum_{n=1}^{N}x_n-\sum_{n=1}^{N}\mu\\[4pt]&=\sum_{n=1}^{N}x_n-N\mu\\[4pt]\mu&=\frac{1}{N}\sum_{n=1}^{N}x_n\end{aligned}$$


    Similarly, for $\sigma^2$,


    $$\frac{\partial\log L}{\partial\sigma^2}=\sum_{n=1}^{N}\left(-\frac{1}{2\sigma^2}+\frac{1}{2(\sigma^2)^2}(x_n-\mu)^2\right)=0$$


    $$N\sigma^2=\sum_{n=1}^{N}(x_n-\mu)^2\tag{2.1}$$


    $$\sigma^2=\frac{1}{N}\sum_{n=1}^{N}(x_n-\mu)^2\tag{2.2}$$'
