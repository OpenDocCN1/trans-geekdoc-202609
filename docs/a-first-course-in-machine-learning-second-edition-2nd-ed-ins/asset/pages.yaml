- pgno: 14
  md: '# EX 2.9. The Bernoulli distribution is defined as:


    $$P(X_n=x\mid r)=r^x(1-r)^{1-x}$$


    where $x$ is either 0 or 1. Using the IID assumption, we have:


    $$L=\prod_{n=1}^{N}r^{x_n}(1-r)^{1-x_n}$$


    and the log likelihood is:


    $$\log L=\sum_{n=1}^{N}x_n\log r+(1-x_n)\log(1-r)$$


    Differentiating with respect to $r$ gives us:


    $$\begin{aligned}

    \frac{\partial\log L}{\partial r}&=\sum_{n=1}^{N}\left(\frac{x_n}{r}-\frac{1-x_n}{1-r}\right)=0\\

    \sum_{n=1}^{N}\frac{x_n}{r}&=\sum_{n=1}^{N}\frac{1-x_n}{1-r}\\

    \sum_{n=1}^{N}x_n-r\sum_{n=1}^{N}x_n&=rN-r\sum_{n=1}^{N}x_n\\

    r&=\frac{1}{N}\sum_{n=1}^{N}x_n.

    \end{aligned}$$


    # EX 2.10. The Fisher information is defined as the expectation of the negative
    second derivative. From the above expression, we can see that the second derivative
    of the Gaussian likelihood (assuming $N$ observations, $x_1,\ldots,x_N$ is:


    $$\frac{\partial^2\log L}{\partial\mu^2}=-\frac{N}{\sigma^2}.$$


    Hence the Fisher information is equal to $N/\sigma^2$.


