  md: 'EX 4.4. This is a nice example to illustrate the power of sampling. Imagine
    sampling pairs of values from uniform distributions between -0.5 and 0.5. These
    values would be uniformly distributed in the square shown below:


    The probability that one of these points lies within the circle must be equal
    to the ratio of the area of the circle to the area of the square. We can obtain
    an empirical estimate of this value by say generating N pairs (i.e. points) and
    then computing the number of pairs that lie within the circle (s). Then:


    ```

    $$\frac{s}{N} \approx \frac{\pi r^{2}}{1 \times 1} = 0.5^{2}\pi.$$

    ```


    Re-arranging this expression will give an approximate value of π:


    ```

    $$\pi \approx \frac{s}{0.5^{2}N}.$$

    ```


    For example, one random sample of 100 points yields a value of:


    ```

    $$\pi \approx 3.240.$$

    ```


    As we would expect, this approximation will, on average, get better as we take
    more samples. An example after 10000 is:


    ```

    $$\pi \approx 3.129.$$

    ```


