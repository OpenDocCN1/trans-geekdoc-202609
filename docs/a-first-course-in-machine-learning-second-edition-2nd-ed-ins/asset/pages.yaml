- pgno: 33
  md: "We now make use of the following standard result:\n\n$\\mathcal{N}_x(\\mathbf{a},\\\
    mathbf{A})\\mathcal{N}_x(\\mathbf{b},\\mathbf{B}) = K\\mathcal{N}_x(\\mathbf{d},\\\
    mathbf{D})$, \n\nwhere:\n\n$K = \\mathcal{N}_a(\\mathbf{b},\\mathbf{A} + \\mathbf{B})$.\n\
    \nThe quantities $\\mathbf{d}$ and $\\mathbf{D}$ are not important as this density\
    \ will disappear in our integral. Therefore, our expectation becomes:\n\n$p(\\\
    mathbf{x}_{new} | T_{new} = c, \\mathbf{X}, \\mathbf{t}) = \\mathcal{N}_{x_{new}}(\\\
    mathbf{m}, \\mathbf{S} + \\mathbf{\\Sigma}_c)$.\n\nEX 5.3. The total likelihood\
    \ for class $c$ is:\n\n$\\mathcal{L} = \\prod_{n=1}^{N_c} \\frac{1}{(2\\pi)^{D/2}\
    \ |\\mathbf{\\Sigma}_c|^{1/2}} \\exp\\left\\{ -\\frac{1}{2} (\\mathbf{x}_n - \\\
    boldsymbol{\\mu}_c)^\\top \\mathbf{\\Sigma}_c^{-1} (\\mathbf{x}_n - \\boldsymbol{\\\
    mu}_c) \\right\\}$.\n\nAs normal, it is easiest to maximise the log likelihood.\
    \ Logging and multiplying out gives:\n\n$\\log \\mathcal{L} = -\\frac{D N_c}{2}\
    \ \\log(2\\pi) - \\frac{N_c}{2} \\log |\\mathbf{\\Sigma}_c| - \\frac{1}{2} \\\
    sum_{n=1}^{N_c} (\\mathbf{x}_n^\\top \\mathbf{\\Sigma}_c^{-1} \\mathbf{x}_n -\
    \ 2 \\boldsymbol{\\mu}_c^\\top \\mathbf{\\Sigma}_c^{-1} \\mathbf{x}_n + \\boldsymbol{\\\
    mu}_c^\\top \\mathbf{\\Sigma}_c^{-1} \\boldsymbol{\\mu}_c)$.\n\nTaking the partial\
    \ derivative with respect to $\\boldsymbol{\\mu}_c$, equating to zero and solving\
    \ gives a solution for $\\boldsymbol{\\mu}_c$:\n\n$\\frac{\\partial \\log \\mathcal{L}}{\\\
    partial \\boldsymbol{\\mu}_c} = 0 = \\mathbf{\\Sigma}_c^{-1} \\sum_{n=1}^{N_c}\
    \ \\mathbf{x}_n - N_c \\mathbf{\\Sigma}_c^{-1} \\boldsymbol{\\mu}_c$\n\n$\\mathbf{\\\
    Sigma}_c^{-1} \\sum_{n=1}^{N_c} \\mathbf{x}_n = N_c \\mathbf{\\Sigma}_c^{-1} \\\
    boldsymbol{\\mu}_c$\n\n$\\boldsymbol{\\mu}_c = \\frac{1}{N_c} \\sum_{n=1}^{N_c}\
    \ \\mathbf{x}_n$.\n\nSimilarly, for $\\mathbf{\\Sigma}_c$:\n\n$\\frac{\\partial\
    \ \\log \\mathcal{L}}{\\partial \\mathbf{\\Sigma}_c} = 0 = -\\frac{N_c}{2} \\\
    mathbf{\\Sigma}_c^{-1} + \\frac{1}{2} \\mathbf{\\Sigma}_c^{-1} \\sum_{n=1}^{N_c}\
    \ (\\mathbf{x}_n - \\boldsymbol{\\mu}_c)(\\mathbf{x}_n - \\boldsymbol{\\mu}_c)^\\\
    top \\mathbf{\\Sigma}_c^{-1}$\n\nwhere we have used the following two results\
    \ (for symmetric $\\mathbf{A}$):\n\n$\\frac{\\partial \\log |\\mathbf{A}|}{\\\
    partial \\mathbf{A}} = \\mathbf{A}^{-1}$\n\n$\\frac{\\partial \\mathbf{a}^\\top\
    \ \\mathbf{A}^{-1} \\mathbf{a}}{\\partial \\mathbf{A}} = -\\mathbf{A}^{-1} \\\
    mathbf{a} \\mathbf{a}^\\top \\mathbf{A}^{-1}$.\n\nRe-arranging gives the expression\
    \ for $\\mathbf{\\Sigma}_c$:\n\n$\\mathbf{\\Sigma}_c = \\frac{1}{N_c} \\sum_{n=1}^{N_c}\
    \ (\\mathbf{x}_n - \\mu_c)(\\mathbf{x}_n - \\mu_c)^\\top$\n\nwhere $\\boldsymbol{\\\
    mu}_c$ is the maximum likelihood estimate derived above."
