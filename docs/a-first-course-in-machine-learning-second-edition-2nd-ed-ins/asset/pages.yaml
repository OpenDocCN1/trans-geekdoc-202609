  md: 'parameter divided by the sum of the parameters. We also know that the posterior
    Dirichlet for a Dirichlet prior and multinomial likelihood has parameters equal
    to the prior parameters plus the observation counts. Therefore, defining $c_{nk}^{-i}$
    as the count of the number of words (excluding the $i$th one) in the $n$th document
    currently assigned to topic $k$, we know that the term associated with the marginalisation
    of $\boldsymbol{\theta}_n$ is:


    $$\frac{c_{nk}^{-i} + \alpha_k}{\sum_j c_{nj}^{-i} + \alpha_j}$$


    and the term associated with the marginalisation of $\boldsymbol{\beta}_k$ is:


    $$\frac{v_{kw} + \gamma_w}{\sum_{w''} v_{kw''} + \gamma_{w''}}$$


    Multiplying the two together gives the update given in the text.'
