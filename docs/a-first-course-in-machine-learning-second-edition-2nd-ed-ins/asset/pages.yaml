  md: "# Chapter 5\n\nEX 5.1. The class conditional density is given by:\n\n$p(\\\
    mathbf{x}_n|t_n = c, \\boldsymbol{\\mu}_c, \\boldsymbol{\\Sigma}_c) = \\mathcal{N}(\\\
    boldsymbol{\\mu}_c, \\boldsymbol{\\Sigma}_c)$.\n\nAssuming a Gaussian prior on\
    \ $\\boldsymbol{\\mu}_c$:\n\n$p(\\boldsymbol{\\mu}_c|\\boldsymbol{\\mu}_0, \\\
    boldsymbol{\\Sigma}_0)$,\n\nthe posterior density for $\\boldsymbol{\\mu}$ is\
    \ given by:\n\n$p(\\boldsymbol{\\mu}_c|\\mathbf{x}_1, \\dots, \\mathbf{x}_{N_c},\
    \ \\boldsymbol{\\mu}_0, \\boldsymbol{\\Sigma}_0, \\boldsymbol{\\Sigma}_c) \\propto\
    \ \\mathcal{N}(\\boldsymbol{\\mu}_0, \\boldsymbol{\\Sigma}_0) \\prod_{n=1}^{N_c}\
    \ p(\\mathbf{x}_n|t_n = c, \\boldsymbol{\\mu}_c, \\boldsymbol{\\Sigma}_c)$.\n\n\
    Removing constant terms and re-arranging:\n\n$p(\\boldsymbol{\\mu}_c|\\dots) \\\
    propto \\exp\\left\\{-\\frac{1}{2}(\\boldsymbol{\\mu}_c - \\boldsymbol{\\mu}_0)^\\\
    top \\boldsymbol{\\Sigma}_0^{-1} (\\boldsymbol{\\mu}_c - \\boldsymbol{\\mu}_0)\\\
    right\\} \\exp\\left\\{-\\frac{1}{2} \\sum_{n=1}^{N_c} (\\mathbf{x}_n - \\boldsymbol{\\\
    mu}_c)^\\top (\\mathbf{x}_n - \\boldsymbol{\\mu}_c)\\right\\}$.\n\nKeeping only\
    \ terms dependent on $\\boldsymbol{\\mu}_c$:\n\n$p(\\boldsymbol{\\mu}_c|\\dots)\
    \ \\propto \\exp\\left\\{\\frac{1}{2}\\left(\\boldsymbol{\\mu}_c^\\top \\boldsymbol{\\\
    Sigma}_0^{-1} \\boldsymbol{\\mu}_c + N_c \\boldsymbol{\\mu}_c^\\top \\boldsymbol{\\\
    mu}_c - 2 \\boldsymbol{\\mu}_c^\\top \\boldsymbol{\\Sigma}_0^{-1} \\boldsymbol{\\\
    mu}_0 - 2 \\boldsymbol{\\mu}_c^\\top \\sum_{n=1}^{N_c} \\mathbf{x}_n\\right)\\\
    right\\}$.\n\nTherefore, the posterior is a Gaussian:\n\n$p(\\boldsymbol{\\mu}_c|\\\
    dots) = \\mathcal{N}(\\mathbf{m}, \\mathbf{S})$, \n\nwhere:\n\n$\\mathbf{S} =\
    \ (\\boldsymbol{\\Sigma}_0^{-1} + N_c \\mathbf{I})^{-1}$\n\n$\\mathbf{m} = \\\
    mathbf{S}\\left(\\boldsymbol{\\Sigma}_0^{-1} \\boldsymbol{\\mu}_0 + \\sum_{n=1}^{N_c}\
    \ \\mathbf{x}_n\\right)$.\n\nEX 5.2. This requires the expectation of a Gaussian\
    \ with respect to another Gaussian:\n\n$p(\\mathbf{x}_{\\text{new}}|T_{\\text{new}}\
    \ = c, \\mathbf{X}, \\mathbf{t}) = \\mathbf{E}_{p(\\boldsymbol{\\mu}_c|\\mathbf{m},\\\
    mathbf{S})}\\{p(\\mathbf{x}_{\\text{new}}|\\boldsymbol{\\mu}_c, \\boldsymbol{\\\
    Sigma}_c)\\}$\n\n$= \\int \\mathcal{N}_{\\boldsymbol{\\mu}_c}(\\mathbf{m},\\mathbf{S})\
    \ \\mathcal{N}_{\\mathbf{x}_{\\text{new}}}(\\boldsymbol{\\mu}_c, \\boldsymbol{\\\
    Sigma}_c) \\, d\\boldsymbol{\\mu}_c$\n\n$= \\int \\mathcal{N}_{\\boldsymbol{\\\
    mu}_c}(\\mathbf{m},\\mathbf{S}) \\mathcal{N}_{\\boldsymbol{\\mu}_c}(\\mathbf{x}_n,\
    \ \\boldsymbol{\\Sigma}_c) \\, d\\boldsymbol{\\mu}_c.$"
