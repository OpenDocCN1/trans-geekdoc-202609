  img_proc: true
- pgno: 11
  md: "The required expectation is given by:\n\n$$\\begin{aligned}\n\\mathbb{E}_{p(y)}\\\
    {\\sin(y)\\} &= \\int \\sin(y)p(y)\\,dy \\\\\n&= \\int_{y=a}^{b} \\sin(y)\\frac{1}{b-a}\\\
    ,dy \\\\\n&= \\frac{1}{b-a}[-\\cos(y)]_a^b \\\\\n&= \\frac{\\cos(a)-\\cos(b)}{b-a}.\n\
    \\end{aligned}$$\n\nWhen $a=0$, $b=1$, this is equal to\n\n$$\\mathbb{E}_{p(y)}\\\
    {\\sin(y)\\}=\\frac{\\cos(0)-\\cos(1)}{1}=0.45970.$$\n\nCode to compute a sample-based\
    \ approximation below (`sampleexpect.m`):\n\n```\n```matlab\nclear all;\nclose\
    \ all;\n% Compute a sample based approximation to the required expectation\nu\
    \ = rand(10000,1); % Take 10000 samples\nsu = sin(u);\n% Plot how the approximation\
    \ changes as more samples are used\nns = 10:100:10000;\nstages = zeros(size(ns));\n\
    for i = 1:length(ns)\n    stages(i) = mean(su(1:ns(i)));\nend\nplot(ns,stages)\n\
    % Plot the true value\nhold on\nplot([0 ns(end)],[0.4597 0.4597],'k--')\n```\n\
    ```\n\n# EX 2.5. The multivariate Gaussian pdf is given by:\n\n$$p(\\mathbf{w})=\\\
    frac{1}{(2\\pi)^{D/2}|\\boldsymbol{\\Sigma}|^{1/2}}\\exp\\left\\{-\\frac{1}{2}(\\\
    mathbf{w}-\\boldsymbol{\\mu})^\\mathsf{T}\\boldsymbol{\\Sigma}^{-1}(\\mathbf{w}-\\\
    boldsymbol{\\mu})\\right\\}.$$\n\nSetting $\\boldsymbol{\\Sigma}=\\sigma^2\\mathbf{I}$\
    \ gives:\n\n$$p(\\mathbf{w})=\\frac{1}{(2\\pi)^{D/2}|\\sigma^2\\mathbf{I}|^{1/2}}\\\
    exp\\left\\{-\\frac{1}{2\\sigma^2}(\\mathbf{w}-\\boldsymbol{\\mu})^\\mathsf{T}\\\
    mathbf{I}^{-1}(\\mathbf{w}-\\boldsymbol{\\mu})\\right\\}.$$\n\nBecause it only\
    \ has elements on the diagonal, the determinant of $\\sigma^2\\mathbf{I}$ is given\
    \ by the product of these diagonal elements. As they are all the same, $|\\sigma^2\\\
    mathbf{I}|^{1/2}=\\left(\\prod_{d=1}^{D}\\sigma^2\\right)^{1/2}=(\\sigma^2)^{D/2}$.\
    \ $\\mathbf{I}^{-1}=\\mathbf{I}$ and multiplying a vector/matrix by $\\mathbf{I}$\
    \ leaves the matrix/vector unchanged. Therefore, the argument within the expectation\
    \ can be written as $-\\frac{1}{2\\sigma^2}(\\mathbf{w}-\\boldsymbol{\\mu})^\\\
    mathsf{T}(\\mathbf{w}-\\boldsymbol{\\mu})$ and recalling that $\\mathbf{b}^{\\\
    mathsf{T}}\\mathbf{b}=\\sum_i b_i^2$, we can rewrite the pdf as:\n\n$$p(\\mathbf{w})=\\\
    frac{1}{(2\\pi)^{D/2}(\\sigma^2)^{D/2}}\\exp\\left\\{-\\frac{1}{2\\sigma^2}\\\
    sum_{d=1}^{D}(w_d-\\mu_d)^2\\right\\}.$$"
