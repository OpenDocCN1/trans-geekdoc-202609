    \ g}{\\partial r^2} \\right)^{-1} = - \\left( - \\frac{\\alpha + y - 1}{r^2} -\
    \ \\frac{\\beta + N - y - 1}{(1 - r)^2} \\right)^{-1}$$\n\n### 练习 4.3.\n下图展示了一个示例，其中\
    \ $\\alpha = \\beta = 2$，$y = 2$，$N = 10$。\n\n![](img/4c6eb9ed1cdfcf169bfa1a2b6a72e99a_27_0.png)\n\
    \n### 练习 4.4.\n这是一个很好的例子，用以说明采样的威力。想象从 -0.5 到 0.5 之间的均匀分布中抽取成对的值。这些值将均匀分布在下图所示的正方形内：\n\
    \n这些点之一落在圆内的概率一定等于圆面积与正方形面积之比。我们可以通过生成 N 对（即 N 个点），然后计算落在圆内的对数（s），得到该值的经验估计。于是：\n\
    \n$$\\frac{s}{N} \\approx \\frac{\\pi r^{2}}{1 \\times 1} = 0.5^{2}\\pi.$$\n\n\
    整理该表达式即可得到 π 的近似值：\n\n$$\\pi \\approx \\frac{s}{0.5^{2}N}.$$\n\n例如，对 100 个点进行一次随机抽样得到的值为：\n\
    \n$$\\pi \\approx 3.240.$$\n\n正如我们所预期，平均而言，随着抽样次数增多，该近似会变得更加准确。10000 次抽样后的一个例子是：\n\
    \n$$\\pi \\approx 3.129.$$\n\n### 练习 4.5.\n按如下方式重新整理：\n\n$$P(T_{\\text{new}}=1|\\\
    mathbf{x}_{\\text{new}},\\widehat{\\mathbf{w}}) = \\frac{1}{1+\\exp(-\\widehat{\\\
    mathbf{w}}^{\\mathsf{T}}\\mathbf{x}_{\\text{new}})}$$\n$$0.5 = \\frac{1}{2}=\\\
    frac{1}{1+\\exp(-\\widehat{\\mathbf{w}}^{\\mathsf{T}}\\mathbf{x}_{\\text{new}})}$$\n\
    $$2 = 1+\\exp(-\\widehat{\\mathbf{w}}^{\\mathsf{T}}\\mathbf{x}_{\\text{new}})$$\n\
    $$1 = \\exp(0)=\\exp(-\\widehat{\\mathbf{w}}^{\\mathsf{T}}\\mathbf{x}_{\\text{new}})$$\n\
    \n因此 $\\widehat{\\mathbf{w}}^{\\mathsf{T}}\\mathbf{x}_{\\text{new}}=0.$\n\n###\
    \ 练习 4.6.\n假设一个高斯先验：\n\n$$p(\\mathbf{w}) = \\mathcal{N}(\\mathbf{0},\\mathbf{I}_{D}),$$\n\
    \n并且：\n\n$$v_{n}=\\exp\\{\\mathbf{w}^{\\mathsf{T}}\\mathbf{x}_{n}\\}$$\n\n对数后验正比于：\n\
    \n$$g = -\\frac{1}{2}\\mathbf{w}^{\\mathsf{T}}\\mathbf{w} + \\sum_{n}(t_{n}\\\
    log v_{n} - v_{n}).$$\n\n对 $\\mathbf{w}$ 求偏导即可得到梯度：\n\n$$\\frac{\\partial g}{\\\
    partial \\mathbf{w}} = -\\mathbf{w} + \\sum_{n}\\frac{t_{n}}{v_{n}}\\frac{\\partial\
    \ v_{n}}{\\partial \\mathbf{w}} - \\frac{\\partial v_{n}}{\\partial \\mathbf{w}}.$$\n\
    \n现在，\n\n$$\\frac{\\partial v_n}{\\partial \\mathbf{w}}=\\mathbf{x}_n v_n$$\n\n\
    因此：\n\n$$\\frac{\\partial g}{\\partial \\mathbf{w}}=-\\mathbf{w}+\\sum_n\\mathbf{x}_n(t_n-v_n).$$\n\
    \nHessian 矩阵通过再次求导得到。如果这一步看起来有困难，你不妨以（比如）$D=2$ 为例，逐个计算矩阵的每个元素：\n\n$$\\frac{\\\
    partial^2 g}{\\partial\\mathbf{w}\\partial\\mathbf{w}^{\\mathsf T}}=-\\mathbf{I}-\\\
    sum_n v_n\\mathbf{x}_n\\mathbf{x}_n^{\\mathsf T}$$\n\n给定 $\\mathbf{w}$ 的某个初始值，优化方案按如下方式反复更新\
    \ $\\hat{\\mathbf{w}}$，直到它收敛到最大值：\n\n$$\\mathbf{w}\\leftarrow\\mathbf{w}-\\left(-\\\
    mathbf{I}-\\sum_n v_n\\mathbf{x}_n\\mathbf{x}_n^{\\mathsf T}\\right)^{-1}\\left(-\\\
    mathbf{w}+\\sum_n\\mathbf{x}_n(t_n-v_n)\\right)$$\n\n### 练习 4.7.\n根据上一练习的结果，这一题很直接。拉普拉斯近似是一个高斯分布，其均值\
    \ $\\boldsymbol{\\mu}$ 和协方差 $\\boldsymbol{\\Sigma}$ 分别为：$\\boldsymbol{\\mu}=\\\
    hat{\\mathbf{w}}$，即上一练习中用 Newton-Raphson 方案得到的最大值；协方差为：\n\n$$\\boldsymbol{\\Sigma}=-\\\
    left(-\\mathbf{I}-\\sum_n\\hat{v}_n\\mathbf{x}_n\\mathbf{x}_n^{\\mathsf T}\\right)^{-1},$$\n\
    \n其中：\n\n$$\\hat{v}_n=\\exp\\{\\hat{\\mathbf{w}}^{\\mathsf T}\\mathbf{x}_n\\}.$$\n\
    \n### 练习 4.8.\n示例代码如下（`poisscount.m`）：\n\n```matlab\n%% Laplace and Metropolis-Hastings\
