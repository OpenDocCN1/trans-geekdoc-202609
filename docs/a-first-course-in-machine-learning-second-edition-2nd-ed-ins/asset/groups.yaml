  - '[PAGE 35]


    The Dirichlet is the conjugate prior to the multinomial likelihood. Therefore,
    we know the posterior will be another Dirichlet. Multiplying the prior and likelihood
    together and combing q_cm terms gives:


    p(q_c|α, x_1, ..., x_{N_c}) ∝ ∏_{m=1}^M q_{cm}^{α-1+∑_n x_{nm}}


    This is the form of a Dirichlet, where the mth parameter is β_m = α + ∑_n x_{nm}.


    # EX 5.6. The required expectation is:


    p(x_new|T_new = c, X, t) = E_{p(q_c|X^c,α)} { p(x_new|q_c) }.


    Writing out the expectation in full gives:


    p(x_new|T_new = c, X, t) = ∫ [ Γ(∑_m β_m) / (∏_m Γ(β_m)) ∏_m q_{cm}^{β_m-1} ]
    [ (∑_m x_{new,m})! / (∏_m (x_{new,m})!) ∏_m q_{cm}^{x_{new,m}} ] d q_c = (∑_m
    x_{new,m})! Γ(∑_m β_m) / [∏_m (x_{new,m})! ∏_m Γ(β_m)] ∫ ∏_m q_{cm}^{β_m + x_{new,m}
    -1} d q_c = (∑_m x_{new,m})! Γ(∑_m β_m) ∏_m Γ(β_m + x_{new,m}) / [∏_m (x_{new,m})!
    ∏_m Γ(β_m) Γ(∑_m β_m + ∑_m x_{new,m})].


    # EX 5.7. The MAP estimate is obtained by maximising the likelihood multiplied
    by the prior. Extracting only the terms that include q_cm, and logging give us:


    log L ∝ ∑_m (α - 1) log q_{cm} + ∑_m (∑_n x_{nm}) log q_{cm}.


    Introducing the necessary Lagrangian (to ensure ∑_m q_{cm} = 1) we end up with
    the following objective function:


    g = ∑_m (∑_n x_{nm} + α - 1) log q_{cm} - λ (∑_m q_{cm} - 1).


    Taking partial derivatives, equating to zero and solving gives:


    ∂g/∂q_{cm} = 0 = (α - 1 + ∑_n x_{nm}) / q_{cm} - λ

    q_{cm} = (α - 1 + ∑_n x_{nm}) / [ M(α - 1) + ∑_{n,m''} x_{nm''} ]


    where we summed both sides over m to obtain the value for λ.


    # EX 5.8. The starting point is:


    argmin_w ½ w^T w + C ∑_n ξ_n'
