    # Chapter 10


    EX 10.1. We have N observations, x1, ..., xN. Our model is defined as a set of
    K Gaussian components, with means μk and unit variances (σk² = 1). At any point
    within the Gibbs sampling procedure, each of the N observations is assigned to
    one of these components (z nk = 1, z nj = 0 ∀j ≠ k). Each mean value has a Gaussian
    prior density with its own mean and variance μ0, σ0². The conditional density
    for μk can therefore be computed as:


    p(μk|...) ∝ p(μk|μ0,σ0²) ∏_{n=1}^N [p(xn|μk)]^{z nk}


    ∝ exp{ -1/(2σ0²) (μk - μ0)² } exp{ -1/2 ∑_{n=1}^N z nk (xn - μk)² }


    = N(a, b²)


    μk² / b² = μk² / σ0² + μk² ∑_n z nk


    b² = (σ0^{-2} + ∑_n z nk)^{-1}


    a μk / b² = μk μ0 / σ0² + μk ∑_{n=1}^N z nk x_n


    a = b² ( μ0 / σ0² + ∑_{n=1}^N z nk x_n )


    EX 10.2. The following code performs Gibbs sampling for the one-dimensional Gaussian
    mixture with fixed known variance:


    ```

    % 1D Gaussian mixture

    x = [randn(20,1);randn(20,1)+3];

    x = sort(x);


    N = length(x);


    % Define the prior parameters

