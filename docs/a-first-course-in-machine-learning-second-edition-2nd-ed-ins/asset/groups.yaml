    第一项计算如下：


    $$\begin{aligned}

    \mathbf{E}_{p(r)}\{r^2\}&=\int_{r=0}^{r=1}r^2p(r)\,dr\\

    &=\frac{\Gamma(\alpha+\beta)}{\Gamma(\alpha)\Gamma(\beta)}\int_{r=0}^{r=1}r^2\times
