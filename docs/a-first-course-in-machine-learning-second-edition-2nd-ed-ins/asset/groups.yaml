    Therefore,


    $$\hat{\sigma}^{2}=\frac{1}{N}\left[\sum_{n=1}^{N}t_n^2-\sum_{n=1}^{N}t_n\mathbf{x}_n^{\mathrm
    T}\hat{\mathbf w}\right].$$


    Now, $\sum_{n=1}^{N}t_n^2=\mathbf{t}^{\mathrm T}\mathbf{t}$ and we already know
    that $\sum_{n=1}^{N}t_n\mathbf{x}_n^{\mathrm T}\hat{\mathbf w}=\mathbf{t}^{\mathrm
    T}\mathbf{X}\hat{\mathbf w}$. So,


    $$\hat{\sigma}^{2}=\frac{1}{N}\left[\mathbf{t}^{\mathrm T}\mathbf{t}-\mathbf{t}^{\mathrm
    T}\mathbf{X}\hat{\mathbf w}\right],$$


    as required.


