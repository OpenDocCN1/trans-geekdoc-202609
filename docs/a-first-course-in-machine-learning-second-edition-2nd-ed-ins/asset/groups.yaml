    # EX 3.3. Using the same steps as the previous exercise:


    p(r|Y,N) ∝ p(Y = y|r,N)p(r)

    ∝ r^y(1 − r)^{N−y} × 3r^2

    ∝ r^{y+2}(1 − r)^{N−y}

    = r^{α′−1}(1 − r)^{β′−1}


    which suggests a Beta density with parameters α′ = y + 3 and β′ = N − y + 1.


    To find the prior parameters corresponding to the prior p(r) = 3r^2, consider
    the form of the Beta density (ignoring the constant term):


    p(r) ∝ r^{α−1}(1 − r)^{β−1} ∝ 3r^2

    ∝ r^2(1 − r)^0


    From this, it is clear that the parameters are α = 3, β = 1.


    # EX 3.4.


    The effective sample size is α − 1 heads and β − 1 tails. In the first example,
    this is 0 of each. In the second, we have 1 head and 0 tails and in the third,
    2 heads and 0 tails.


    # EX 3.5. From the definition of expectations,


    E_{p(r)}{r} = ∫_{r=0}^{r=1} r p(r) dr

    = Γ(α+β)/[Γ(α)Γ(β)] ∫_{r=0}^{r=1} r × r^{α−1}(1−r)^{β−1} dr

    = Γ(α+β)/[Γ(α)Γ(β)] ∫_{r=0}^{r=1} r^{α}(1−r)^{β−1} dr

    = Γ(α+β)/[Γ(α)Γ(β)] ∫_{r=0}^{r=1} r^{α′−1}(1−r)^{β−1} dr

    where α′ = α + 1.


    Now, the integrand is an unnormalised Beta density so its integral must be the
    inverse of the Beta normalisation constant. Therefore,


    E_{p(r)}{r} = Γ(α+β)/[Γ(α)Γ(β)] · Γ(α′)Γ(β)/Γ(α′+β)

    = Γ(α+β)/[Γ(α)Γ(β)] · Γ(α+1)Γ(β)/Γ(α+β+1).


    Now we require the following Gamma identity, Γ(n+1) = nΓ(n).


    E_{p(r)}{r} = Γ(α+β)/[Γ(α)Γ(β)] · Γ(α)Γ(β)/[Γ(α+β)] · α/(α+β)

    = α/(α+β).'
