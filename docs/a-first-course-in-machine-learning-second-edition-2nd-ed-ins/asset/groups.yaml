    subject to:


    $$\xi_n \ge 0,\quad t_n(\mathbf{w}^\mathsf{T}\mathbf{x}_n + b) \ge 1 - \xi_n.$$


    Adding the constraints as Lagrangian terms gives:


    $$\frac{1}{2}\mathbf{w}^\mathsf{T}\mathbf{w} + C\sum_n \xi_n - \sum_n \alpha_n\left(t_n(\mathbf{w}^\mathsf{T}\mathbf{x}_n
    + b) - 1 + \xi_n\right) - \sum_n \xi_n\gamma_n$$


    subject to $\alpha_n \ge 0$, $\gamma_n \ge 0$, which must be minimised with respect
