  - "[PAGE 32]\n\n# Chapter 5\n\nEX 5.1. The class conditional density is given by:\n\
    \n$p(\\mathbf{x}_n|t_n = c, \\boldsymbol{\\mu}_c, \\boldsymbol{\\Sigma}_c) = \\\
    mathcal{N}(\\boldsymbol{\\mu}_c, \\boldsymbol{\\Sigma}_c)$.\n\nAssuming a Gaussian\
