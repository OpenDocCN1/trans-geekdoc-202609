    &=\frac{\Gamma(\alpha+\beta)}{\Gamma(\alpha)\Gamma(\beta)}\int_{r=0}^{r=1}r^{\alpha+1}(1-r)^{\beta-1}\,dr\\

    &=\frac{\Gamma(\alpha+\beta)}{\Gamma(\alpha)\Gamma(\beta)}\int_{r=0}^{r=1}r^{\alpha''-1}(1-r)^{\beta-1}\,dr

    \end{aligned}$$


