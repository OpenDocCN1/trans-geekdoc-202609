    # Chapter 1


    EX 1.1. A high positive value of w0 and a small negative value for w1. These reflect
    the high intercept on the t axis (corresponding to the theoretical time winning
    time at x = 0 and the small decre se in winning time over the years.


    EX 1.2. The following would do the job:


    ```

    % Attributes are stored in Nx1 vector x

    % Targets are stored in Nx1 vector t

    xb = mean(x);

    tb = mean(t);

    x2b = mean(x.*x);

    xtb = mean(x.*t);

    w1 = (xtb - xt*xb) / (x2b-xb^2);

    w0 = tb-w1*xb;

    % Plot the data

    plot(x,t,''b.'',''markersize'',25);

    % Plot the model

    hold on;

    plot(x,w0+w1*x,''r'',''linewidth'',2);

    ```


    EX 1.3. We need to find w^T X^T w. We''ll start with X^T X. Multiplying X^T by
    X gives:


    X^T X = [ sum_{n=1}^N x_{n1}^2   sum_{n=1}^N x_{n1} x_{n2} ; sum_{n=1}^N x_{n2}
    x_{n1}   sum_{n=1}^N x_{n2}^2 ]


    Multiplying this by w gives:


    X^T X w = [ w0 sum_{n=1}^N x_{n1}^2 + w1 sum_{n=1}^N x_{n1} x_{n2} ; w0 sum_{n=1}^N
    x_{n2} x_{n1} + w1 sum_{n=1}^N x_{n2}^2 ]'
  - '[PAGE 5]


    Finally, pre-multiplying this by $\mathbf{w}^{\mathrm{T}}$ gives:


    $$\mathbf{w}^{\mathrm{T}}\mathbf{X}^{\mathrm{T}}\mathbf{X}\mathbf{w}=w_0\left(w_0\sum_{n=1}^{N}x_{n1}^{2}+w_1\sum_{n=1}^{N}x_{n1}x_{n2}\right)+w_1\left(w_0\sum_{n=1}^{N}x_{n2}x_{n1}+w_1\sum_{n=1}^{N}x_{n2}^{2}\right)$$


    $$=w_0^2\sum_{n=1}^{N}x_{n1}^{2}+2w_0w_1\sum_{n=1}^{N}x_{n1}x_{n2}+w_1^2\sum_{n=1}^{N}x_{n2}^{2}$$


    as required.


    **EX 1.4.** Let’s first work out $\mathbf{X}\mathbf{w}$:


    $$\mathbf{X}\mathbf{w}=\begin{bmatrix}w_0x_{11}+w_1x_{12}\\w_0x_{21}+w_1x_{22}\\\vdots\\w_0x_{N1}+w_1x_{N2}\end{bmatrix}$$


    Therefore


    $$(\mathbf{X}\mathbf{w})^{\mathrm{T}}=[w_0x_{11}+w_1x_{12},\;w_0x_{21}+w_1x_{22},\;\ldots,\;w_0x_{N1}+w_1x_{N2}]$$


    Finally, work out $\mathbf{w}^{\mathrm{T}}\mathbf{X}^{\mathrm{T}}$:


    $$\mathbf{w}^{\mathrm{T}}\mathbf{X}^{\mathrm{T}}=[w_0x_{11}+w_1x_{12},\;w_0x_{21}+w_1x_{22},\;\ldots,\;w_0x_{N1}+w_1x_{N2}]$$


    as required.


    **EX 1.5.** Starting with $\sum_n x_nt_n$. The result of this is a column vector
    of the same size as $\mathbf{x}$ (2 × 1). Now, using the definition of $\mathbf{X}$,


    $$\mathbf{X}^{\mathrm{T}}=\begin{bmatrix}x_{11},x_{21},\ldots,x_{N1}\\x_{12},x_{22},\ldots,x_{N2}\end{bmatrix}$$


    (which is a 2 × $N$ vector). Multiplying this by $\mathbf{t}$ gives a 2 × 1 vector
    that looks like this:


    $$\mathbf{X}^{\mathrm{T}}\mathbf{t}=\begin{bmatrix}\sum_{n=1}^{N}x_{n1}t_n\\\sum_{n=1}^{N}x_{n2}t_n\end{bmatrix}$$


    which is $\sum_n\mathbf{x}_nt_n$ as required. The second example, $\mathbf{X}^{\mathrm{T}}\mathbf{X}\mathbf{w}$.
    We already know what $\mathbf{X}^{\mathrm{T}}\mathbf{X}\mathbf{w}$ is (Exercise
    1.3)


    $$\mathbf{X}^{\mathrm{T}}\mathbf{X}\mathbf{w}=\begin{bmatrix}w_0\sum_{n=1}^{N}x_{n1}^{2}+w_1\sum_{n=1}^{N}x_{n1}x_{n2}\\w_0\sum_{n=1}^{N}x_{n2}x_{n1}+w_1\sum_{n=1}^{N}x_{n2}^{2}\end{bmatrix}$$


    Now, $\mathbf{x}_n\mathbf{x}_n^{\mathrm{T}}$ is the following matrix:


    $$\mathbf{x}_n\mathbf{x}_n^{\mathrm{T}}=\begin{bmatrix}x_{n1}^{2}&x_{n1}x_{n2}\\x_{n2}x_{n1}&x_{n2}^{2}\end{bmatrix}$$'
  - "[PAGE 6]\n\nMultiplying this by **w** gives:\n\n$$x_nx_n^{\\mathsf T}\\mathbf{w}=\\\
    begin{bmatrix}w_0x_{n1}^2+w_1x_{n1}x_{n2}\\\\w_0x_{n2}x_{n1}+w_1x_{n2}^2\\end{bmatrix}$$\n\
    \nSumming over the $N$ terms leads us to the matrix we derived previously.\n\n\
    **EX 1.6.** Code below:\n\n```\n```matlab\n%% Women's 100m data\n% Load all Olympic\
    \ data\nload olympics;\n% Copy the necessary variables\nx = female100(:,1); %\
    \ Olympic year\nt = female100(:,2); % Winning time\n% Augment x\nX = [repmat(1,size(x))\
    \ x];\n% Get solution\nw = inv(X'*X)*X'*t;\n```\n```\n\nThe fitted model is:\n\
    \n$$t=40.9242-0.0151x$$\n\n**EX 1.7.** Plugging 2012 and 2016 into the above expression\
    \ yields winning times of 10.5997 and 10.5394 respectively.\n\n**EX 1.8.** The\
    \ men's model is:\n\n$$t=36.4165-0.0133x$$\n\nThe women's model is:\n\n$$t=40.9242-0.0151x$$\n\
    \nThe women's time is decreasing faster than the men's. Therefore, the women will\
    \ be faster at the first Olympics after the $x$ that gives identical winning times:\n\
    \n$$\\begin{aligned}40.9242-0.0151x&=36.4165-0.0133x\\\\x&=2589\\end{aligned}$$\n\
    \nThe next Olympic year after 2589 is (assuming they continue to be held every\
    \ four years) is the year 2592. The winning times are the unrealistically fast\
    \ 1.8580 seconds and 1.8628 seconds for women and men respectively.\n\n**EX 1.9.**\
    \ Code below (synthdata_cv.m):\n\n```\n```matlab\nclear all;close all;\nload synthdata\n\
    \n% Augment x\nX = repmat(1,size(x));\nfor k = 1:4\n    X = [X x.^k];\nend\n```\n\
    ```"
  - "[PAGE 7]\n\n```\n% Fit the model\nw = inv(X'*X)*X'*t;\n\n% Randomise the data\
    \ order\nN = size(X,1);\norder = randperm(N);\nsizes = repmat(floor(N/10),1,10);\n\
    sizes(end) = sizes(end) + N-sum(sizes);\nsizes = [0 cumsum(sizes)];\n\nX = repmat(1,size(x));\n\
    \nloss = zeros(4,10);\nfor poly_order = 1:4\n    % Augment x\n    X = [X x.^poly_order];\n\
    \    for k = 1:10 % 10-fold CV\n        % Extract the train and test data\n  \
    \      traindata = X(order,:);\n        traint = t(order);\n        testdata =\
    \ X(order(sizes(k)+1:sizes(k+1)),:);\n        testt = t(order(sizes(k)+1:sizes(k+1)));\n\
    \        traindata(sizes(k)+1:sizes(k+1),:) = [];\n        traint(sizes(k)+1:sizes(k+1))\
    \ = [];\n        \n        % Fit the model\n        w = inv(traindata'*traindata)*traindata'*traint;\n\
    \        \n        % Compute loss on test data\n        predictions = testdata*w;\n\
    \        loss(poly_order,k) = sum((predictions - testt).^2);\n    end\nend\n\n\
    % Plot the loss\nplot([1:4],mean(loss,2));\n```\n\nEX 1.10. The total loss is\n\
    \n\\mathcal{L} = \\sum_{n=1}^{N} (t_n - \\mathbf{w}^T \\mathbf{x}_n)^2.\n\nWriting\
    \ this in matrix form, differentiating and solving gives us:\n\n\\mathcal{L} =\
    \ (\\mathbf{t} - \\mathbf{X w})^T (\\mathbf{t} - \\mathbf{X w})\n= \\mathbf{t}^T\
    \ \\mathbf{t} - 2 \\mathbf{w}^T \\mathbf{X}^T \\mathbf{t} + \\mathbf{w}^T \\mathbf{X}^T\
    \ \\mathbf{X} \\mathbf{w}\n\\frac{\\partial \\mathcal{L}}{\\partial \\mathbf{w}}\
    \ = -2 \\mathbf{X}^T \\mathbf{t} + 2 \\mathbf{X}^T \\mathbf{X} \\mathbf{w} = 0\n\
    \\mathbf{w} = (\\mathbf{X}^T \\mathbf{X})^{-1} \\mathbf{X}^T \\mathbf{t}.\n\n\
    This is identical to the value obtained for the average loss. It is not surprising\
    \ as all we are doing is multiplying the loss by a constant and this will not\
    \ change the value of w at the minimum."
