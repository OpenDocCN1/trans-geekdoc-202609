    p(r|Y,N) ∝ p(Y = y|r,N)p(r)

    ∝ r^y(1 − r)^{N−y} × 3r^2

    ∝ r^{y+2}(1 − r)^{N−y}

    = r^{α′−1}(1 − r)^{β′−1}


