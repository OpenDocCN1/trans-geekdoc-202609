    T}(\mathbf{t}-\mathbf{Xw})\right)\right\}.$$


    This is another inverse gamma with parameters α* and β* given by:


    $$\alpha^*=\alpha+\frac{N}{2}$$

    $$\beta^*=\beta+\frac{1}{2}(\mathbf{t}-\mathbf{Xw})^{\mathsf T}(\mathbf{t}-\mathbf{Xw}).$$'
