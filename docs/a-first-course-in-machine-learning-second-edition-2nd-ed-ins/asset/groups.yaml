    mu}_c,\n\\]\n\n\\[\n\\boldsymbol{\\Sigma}_c^{-1} \\sum_{n=1}^{N_c} \\mathbf{x}_n\
    \ = N_c \\boldsymbol{\\Sigma}_c^{-1} \\boldsymbol{\\mu}_c,\n\\]\n\n\\[\n\\boldsymbol{\\\
    mu}_c = \\frac{1}{N_c} \\sum_{n=1}^{N_c} \\mathbf{x}_n.\n\\]\n\nSimilarly, for\
    \ \\(\\boldsymbol{\\Sigma}_c\\):\n\n\\[\n\\frac{\\partial \\log \\mathcal{L}}{\\\
    partial \\boldsymbol{\\Sigma}_c} = 0 = -\\frac{N_c}{2} \\boldsymbol{\\Sigma}_c^{-1}\
    \ + \\frac{1}{2} \\boldsymbol{\\Sigma}_c^{-1} \\sum_{n=1}^{N_c} (\\mathbf{x}_n\
    \ - \\boldsymbol{\\mu}_c)(\\mathbf{x}_n - \\boldsymbol{\\mu}_c)^\\top \\boldsymbol{\\\
    Sigma}_c^{-1},\n\\]\n\nwhere we have used the following two results (for symmetric\
    \ \\(\\mathbf{A}\\)):\n\n\\[\n\\frac{\\partial \\log |\\mathbf{A}|}{\\partial\
    \ \\mathbf{A}} = \\mathbf{A}^{-1},\n\\]\n\n\\[\n\\frac{\\partial \\mathbf{a}^\\\
    top \\mathbf{A}^{-1} \\mathbf{a}}{\\partial \\mathbf{A}} = -\\mathbf{A}^{-1} \\\
    mathbf{a} \\mathbf{a}^\\top \\mathbf{A}^{-1}.\n\\]\n\nRe-arranging gives the expression\
    \ for \\(\\boldsymbol{\\Sigma}_c\\):\n\n\\[\n\\boldsymbol{\\Sigma}_c = \\frac{1}{N_c}\
    \ \\sum_{n=1}^{N_c} (\\mathbf{x}_n - \\boldsymbol{\\mu}_c)(\\mathbf{x}_n - \\\
    boldsymbol{\\mu}_c)^\\top,\n\\]\n\nwhere \\(\\boldsymbol{\\mu}_c\\) is the maximum\
    \ likelihood estimate derived above.\n\n### EX 5.4.\n\nThe data consists of \\\
    (N_c\\) \\(M\\)-dimensional vectors of integer counts. The multinomial likelihood\
    \ for the \\(N_c\\) data objects is:\n\n\\[\np(\\mathbf{x}_1,\\dots,\\mathbf{x}_{N_c}|q_{c1},\\\
    dots,q_{cM}) = \\mathcal{L} \\propto \\prod_{n=1}^{N_c} \\prod_{m=1}^{M} q_{cm}^{x_{nm}}\n\
    \\]\n\n(where the constant that does not depend on \\(q_{cm}\\) has been omitted\
    \ for brevity). Once again, we work with the log likelihood and take partial derivatives\
    \ with respect to \\(q_{cm}\\). We must also add a Lagrangian term due to the\
    \ constraint that \\(\\sum_m q_{cm}=1\\). Calling this new objective function\
    \ \\(g\\) gives:\n\n\\[\n\\log \\mathcal{L} = \\sum_{n=1}^{N_c} \\sum_{m=1}^{M}\
    \ x_{nm} \\log q_{cm},\n\\]\n\n\\[\ng = \\sum_{n=1}^{N_c} \\sum_{m=1}^{M} x_{nm}\
    \ \\log q_{cm} - \\lambda \\left(\\sum_m q_{cm} -1\\right),\n\\]\n\n\\[\n\\frac{\\\
    partial g}{\\partial q_{cm}} = 0 = \\sum_{n=1}^{N_c} \\frac{x_{nm}}{q_{cm}} -\
    \ \\lambda,\n\\]\n\n\\[\nq_{cm} = \\frac{\\sum_{n=1}^{N_c} x_{nm}}{\\lambda}.\n\
    \\]\n\nTo compute \\(\\lambda\\) we sum both sides over \\(m\\):\n\n\\[\n\\sum_m\
    \ q_{cm} = \\frac{1}{\\lambda} \\sum_{m,n} x_{nm},\n\\]\n\n\\[\n1 = \\frac{1}{\\\
    lambda} \\sum_{m,n} x_{nm},\n\\]\n\n\\[\n\\lambda = \\frac{1}{\\sum_{n,m} x_{nm}}.\n\
    \\]\n\nTherefore, the maximum likelihood estimate of \\(q_{cm}\\) is:\n\n\\[\n\
    q_{cm} = \\frac{\\sum_n x_{nm}}{\\sum_{n,m'} x_{nm'}}.\n\\]\n\n### EX 5.5.\n\n\
    The likelihood (ignoring terms not involving \\(q_{cm}\\)) is:\n\n\\[\np(\\mathbf{x}_1,\\\
    dots,\\mathbf{x}_{N_c}|\\mathbf{q}_c) \\propto \\prod_{n=1}^{N_c} \\prod_{m=1}^{M}\
    \ q_{cm}^{x_{nm}}\n\\]\n\nThe prior over \\(\\mathbf{q}_c\\) is a Dirichlet with\
    \ constant parameter \\(\\alpha\\) (again, ignoring terms not involving \\(q_{cm}\\\
    )):\n\n\\[\np(\\mathbf{q}_c|\\alpha) \\propto \\prod_{m=1}^{M} q_{cm}^{\\alpha-1}.\n\
    \\]\n"
