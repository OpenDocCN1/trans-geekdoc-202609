    # Chapter 7


    EX 7.1. The bound is given by:


    $$\log p(Y) \ge \int Q(\theta)\log\frac{p(Y,\theta)}{Q(\theta)}\,d\theta.$$


    To show that the bound is maximised if $Q(\theta)$ is the true posterior, we will
    substitute the posterior $p(\theta|Y)$ for $Q(\theta)$ and re-arrange the right
    hand side such that the inequality becomes an equality. Firstly, substituting
    and expanding:


    $$\log p(Y) \ge \int p(\theta|Y)\log p(Y,\theta)\,d\theta - \int p(\theta|Y)\log
    p(\theta|Y)\,d\theta.$$


    Next we expand the joint density: $p(Y,\theta)=p(\theta|Y)p(Y)$:


    $$\log p(Y) \ge \int p(\theta|Y)\log p(\theta|Y)\,d\theta + \int p(\theta|Y)\log
    p(Y)\,d\theta - \int p(\theta|Y)\log p(\theta|Y)\,d\theta.$$


    The first and third terms cancel. The second term is an expectation of a constant
    and hence the expectation disappears:


    $$\int p(\theta|Y)\log p(Y)\,d\theta = \log p(Y)\int p(\theta|Y)\,d\theta = \log
    p(Y).$$


    EX 7.2. We shall go through each term in the order they are given in Section 7.5.5
    starting with $\mathbf{E}_{Q_{\tau}(\tau)}\{\log p(\tau|a,b)\}$:


    $$\mathbf{E}_{Q_{\tau}(\tau)}\{\log p(\tau|a,b)\} = \mathbf{E}_{Q_{\tau}(\tau)}\{a\log
    b - \log\Gamma(a) + (a-1)\log\tau - b\tau\}\\ = a\log b - \log\Gamma(a) + (a-1)\langle\log\tau\rangle
    - b\langle\tau\rangle.$$


    Now $\sum_n \mathbf{E}_{Q_{\mathbf{x}_n}(\mathbf{x}_n)}\{\log p(\mathbf{x}_n)\}$.
    Recall that $p(\mathbf{x}_n)=\mathcal{N}(\mathbf{0},\mathbf{I})$ and $Q_{\mathbf{x}_n}(\mathbf{x}_n)=\mathcal{N}(\boldsymbol{\mu}_{\mathbf{x}_n},\boldsymbol{\Sigma}_{\mathbf{x}_n})$:


    $$\sum_n \mathbf{E}_{Q_{\mathbf{x}_n}(\mathbf{x}_n)}\{\log p(\mathbf{x}_n)\} =
    \sum_n \mathbf{E}_{Q_{\mathbf{x}_n}(\mathbf{x}_n)}\left\{-\frac{D}{2}\log 2\pi
    - \frac{1}{2}(\mathbf{x}_n^{\mathsf{T}}\mathbf{x}_n)\right\}\\ = -\frac{ND}{2}\log
    2\pi - \frac{1}{2}\sum_n\left(\mathrm{Tr}(\boldsymbol{\Sigma}_{\mathbf{x}_n})
    + \boldsymbol{\mu}_{\mathbf{x}_n}^{\mathsf{T}}\boldsymbol{\mu}_{\mathbf{x}_n}\right).$$


    (Note that $\mathbf{E}_{\mathcal{N}_a(\mathbf{m},\mathbf{S})}\{\mathbf{a}^{\mathsf{T}}\mathbf{B}\mathbf{a}\}=\mathrm{Tr}(\mathbf{S}\mathbf{B})+\mathbf{m}^{\mathsf{T}}\mathbf{B}\mathbf{m}$).'
