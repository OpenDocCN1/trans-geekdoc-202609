    ## EX 2.9. 伯努利分布定义为：


    $$P(X_n=x\mid r)=r^x(1-r)^{1-x}$$


    其中 $x$ 为 0 或 1。在 IID 假设下，我们有：


    $$L=\prod_{n=1}^{N}r^{x_n}(1-r)^{1-x_n}$$


    且对数似然为：


    $$\log L=\sum_{n=1}^{N}x_n\log r+(1-x_n)\log(1-r)$$


    对 $r$ 求导得到：


    $$\begin{aligned}

    \frac{\partial\log L}{\partial r}&=\sum_{n=1}^{N}\left(\frac{x_n}{r}-\frac{1-x_n}{1-r}\right)=0\\

    \sum_{n=1}^{N}\frac{x_n}{r}&=\sum_{n=1}^{N}\frac{1-x_n}{1-r}\\

    \sum_{n=1}^{N}x_n-r\sum_{n=1}^{N}x_n&=rN-r\sum_{n=1}^{N}x_n\\

    r&=\frac{1}{N}\sum_{n=1}^{N}x_n.

    \end{aligned}$$


    ## EX 2.10. Fisher 信息定义为负二阶导数的期望。从上述表达式可以看出，高斯似然的二阶导数（假设有 $N$ 个观测值，$x_1,\ldots,x_N$）为：


    $$\frac{\partial^2\log L}{\partial\mu^2}=-\frac{N}{\sigma^2}.$$


    因此 Fisher 信息等于 $N/\sigma^2$。


    ## EX 2.11. 从第二个表达式出发，我们有


    $$\hat{\sigma}^{2}=\frac{1}{N}\left[\sum_{n=1}^{N}t_n^2-2\sum_{n=1}^{N}t_n\mathbf{x}_n^{\mathsf
    T}\hat{\mathbf w}+\sum_{n=1}^{N}(\mathbf{x}_n\hat{\mathbf w})^2\right].$$


    集中于最后一项，


    $$\begin{aligned}

    \sum_{n=1}^{N}(\mathbf{x}_n^{\mathrm T}\hat{\mathbf w})^2

    &=\sum_{n=1}^{N}\mathbf{x}_n^{\mathrm T}\hat{\mathbf w}\hat{\mathbf w}^{\mathrm
    T}\mathbf{x}_n\\

    &=\operatorname{Tr}(\mathbf{X}\hat{\mathbf w}\hat{\mathbf w}^{\mathrm T}\mathbf{X}^{\mathrm
    T})\\

    &=\operatorname{Tr}\left(\mathbf{X}(\mathbf{X}^{\mathrm T}\mathbf{X})^{-1}\mathbf{X}^{\mathrm
    T}\mathbf{t}\mathbf{t}^{\mathrm T}\mathbf{X}(\mathbf{X}^{\mathrm T}\mathbf{X})^{-1}\mathbf{X}^{\mathrm
    T}\right)\\

    &=\operatorname{Tr}\left(\mathbf{X}^{\mathrm T}\mathbf{X}(\mathbf{X}^{\mathrm
    T}\mathbf{X})^{-1}\mathbf{X}^{\mathrm T}\mathbf{t}\mathbf{t}^{\mathrm T}(\mathbf{X}^{\mathrm
    T}\mathbf{X})^{-1}\right)\\

    &=\operatorname{Tr}\left(\mathbf{X}^{\mathrm T}\mathbf{t}\mathbf{t}^{\mathrm T}\mathbf{X}(\mathbf{X}^{\mathrm
    T}\mathbf{X})^{-1}\right)\\

    &=\operatorname{Tr}\left(\mathbf{t}\mathbf{t}^{\mathrm T}\mathbf{X}(\mathbf{X}^{\mathrm
    T}\mathbf{X})^{-1}\mathbf{X}^{\mathrm T}\right)\\

    &=\operatorname{Tr}\left(\mathbf{t}^{\mathrm T}\mathbf{X}(\mathbf{X}^{\mathrm
    T}\mathbf{X})^{-1}\mathbf{X}^{\mathrm T}\mathbf{t}\right)\\

    &=\mathbf{t}^{\mathrm T}\mathbf{X}(\mathbf{X}^{\mathrm T}\mathbf{X})^{-1}\mathbf{X}^{\mathrm
    T}\mathbf{t}\\

    &=\mathbf{t}^{\mathrm T}\mathbf{X}\hat{\mathbf w}\\

    &=\sum_{n=1}^{N}t_n\mathbf{x}_n^{\mathrm T}\hat{\mathbf w}.

    \end{aligned}$$


    因此，


    $$\hat{\sigma}^{2}=\frac{1}{N}\left[\sum_{n=1}^{N}t_n^2-\sum_{n=1}^{N}t_n\mathbf{x}_n^{\mathrm
