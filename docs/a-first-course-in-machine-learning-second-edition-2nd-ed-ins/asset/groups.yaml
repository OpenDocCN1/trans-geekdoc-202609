    EX 1.11. The loss is given by


    \mathcal{L} = \frac{1}{N} \sum_{n=1}^{N} \alpha_n (t_n - \mathbf{w}^\top \mathbf{x}_n)^2


    If we define the matrix:


    \mathbf{A} = \begin{bmatrix} \alpha_1 & 0 & \dots & 0 \\ 0 & \alpha_2 & \dots
    & 0 \\ \vdots & \vdots & \ddots & \vdots \\ 0 & 0 & \dots & \alpha_N \end{bmatrix}


    we can write the loss in vector/matrix form as:


    \mathcal{L} = \frac{1}{N} \sum_{n=1}^{N} (\mathbf{t} - \mathbf{X}\mathbf{w})^\top
    \mathbf{A} (\mathbf{t} - \mathbf{X}\mathbf{w})


    Multiplying out, differentiating, equating to zero and solving:


    \mathcal{L} = \frac{1}{N} \left( \mathbf{t}^\top \mathbf{A} \mathbf{t} - 2 \mathbf{w}^\top
    \mathbf{X}^\top \mathbf{A} \mathbf{t} + \mathbf{w}^\top \mathbf{X}^\top \mathbf{A}
    \mathbf{X} \mathbf{w} \right)

    \frac{\partial \mathcal{L}}{\partial \mathbf{w}} = -\frac{2}{N} \mathbf{X}^\top
    \mathbf{A} \mathbf{t} + \frac{2}{N} \mathbf{X}^\top \mathbf{A} \mathbf{X} \mathbf{w}
    = \mathbf{0}

    \mathbf{w} = (\mathbf{X}^\top \mathbf{A} \mathbf{X})^{-1} \mathbf{X}^\top \mathbf{A}
    \mathbf{t}.


    Try this out in Matlab (set some \alpha_n very low and some very high) to see
    the effect on the solution.


