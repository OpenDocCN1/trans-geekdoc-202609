    \ = k \\mid x_{ni} = w, \\beta_{kw}, \\theta_{nk}) = \\theta_{nk}\\beta_{kw}$.\n\
    \nTo obtain the collapsed version, we need to marginalise the parameters $\\theta_n$\
    \ and $\\beta_k$. Both are multinomials and have Dirichlet priors with parameters\
    \ $\\alpha$ and $\\gamma$ respectively. We know from our work in mixture models\
    \ that if we have one sample from a multinomial (say the $k$th value has been\
    \ sampled) whose parameters are Dirichlet distributed, the probability of that\
    \ sample is equal to the $k$th Dirichlet parameter divided by the sum of the parameters.\
    \ We also know that the posterior Dirichlet for a Dirichlet prior and multinomial\
    \ likelihood has parameters equal to the prior parameters plus the observation\
    \ counts. Therefore, defining $c_{nk}^{-i}$ as the count of the number of words\
    \ (excluding the $i$th one) in the $n$th document currently assigned to topic\
    \ $k$, we know that the term associated with the marginalisation of $\\boldsymbol{\\\
    theta}_n$ is:\n\n$$\\frac{c_{nk}^{-i} + \\alpha_k}{\\sum_j c_{nj}^{-i} + \\alpha_j}$$\n\
    \nand the term associated with the marginalisation of $\\boldsymbol{\\beta}_k$\
    \ is:\n\n$$\\frac{v_{kw} + \\gamma_w}{\\sum_{w'} v_{kw'} + \\gamma_{w'}}$$\n\n\
    Multiplying the two together gives the update given in the text.\n"
