    \n采用折叠吉布斯采样（collapsed Gibbs sampling）方案将会最高效，方法是对概率 $p_{kd}$ 进行边缘化。如上所示，这些参数的条件后验密度是\
    \ Beta 分布，参数为：\n\n$\\alpha^* = \\alpha + \\sum_n z_{nk}x_{nd},\\quad \\beta^*\
    \ = \\beta + \\sum_n z_{nk}(1 - x_{nd}).$\n\n（请记住，在考虑对第 $n$ 个观测进行折叠更新时，我们需要从求和中省略第\
    \ $n$ 个数据点）。对 $z_{nk}$ 的更新为：\n\n$P(z_{nk}=1|\\dots) \\propto \\left(\\sum_{m\\\
    neq n} z_{mk}\\right) \\prod_{d=1}^{D} \\int P(x_{nd}|z_{nk}=1,p_{kd})p(p_{kd}|\\\
    dots) dp_{kd}.$\n\n由于 Beta 先验与二项式似然具有共轭性，我们可以解析地计算该积分：\n\n$= \\int p_{kd}^{x_{nd}}(1-p_{kd})^{1-x_{nd}}\
    \ \\frac{\\Gamma(\\alpha^*+\\beta^*)}{\\Gamma(\\alpha^*)\\Gamma(\\beta^*)}p_{kd}^{\\\
    alpha^*-1}(1-p_{kd})^{\\beta^*-1} dp_{kd}$\n\n$= \\frac{\\Gamma(\\alpha^*+\\beta^*)}{\\\
    Gamma(\\alpha^*)\\Gamma(\\beta^*)} \\int p_{kd}^{\\alpha^*+x_{nd}-1}(1-p_{kd})^{\\\
    beta^*+(1-x_{nd})-1} dp_{kd}$\n\n$= \\frac{\\Gamma(\\alpha^*+\\beta^*)}{\\Gamma(\\\
    alpha^*)\\Gamma(\\beta^*)} \\frac{\\Gamma(\\alpha^*+x_{nd})\\Gamma(\\beta^*+(1-x_{nd}))}{\\\
    Gamma(\\alpha^*+\\beta^*+1)}$\n\n$= \\frac{(\\alpha^*)^{x_{nd}}(\\beta^*)^{1-x_{nd}}}{\\\
    alpha^*+\\beta^*}.$\n\n在最后一步中，我们使用了恒等式 $\\Gamma(z+1)=z\\Gamma(z)$。这就完成了采样器的定义。$z_{nk}$\
    \ 的更新与这些项在维度 $(D)$ 上的乘积再乘以簇 $k$ 中对象的数量成正比。新簇的概率与浓度参数乘以这些项的乘积成正比，此时 $\\alpha^*=\\\
    alpha$ 且 $\\beta^*=\\beta$。\n\n### 练习 10.8.\n\n以下代码从一个具有高斯基分布的 DP（狄利克雷过程）中采样：\n\
    \n```matlab\n% DP sample\nbasemu = 0;\nbasess = 1;\nalp = 10; % Concentration\
    \ parameter\n\nN = 100; % Number of samples to draw\n\nsamples = [];\n\nfor n\
    \ = 1:N\n    if n==1\n        samples = randn.*sqrt(basess) + basemu;\n    else\n\
    \        if rand < alp/(alp + n-1)\n            % Sample a new value\n       \
    \     samples(end+1) = randn.*sqrt(basess) + basemu;\n        else\n         \
    \   % Copy a previous one\n            samples(end+1) = samples(randi(length(samples)));\n\
    \        end\n    end\nend\n```\n\n### 练习 10.9.\n\n见随附网页上的脚本。\n\n### 练习 10.10.\n\
    \n我们将推导折叠采样器。假设我们观察到 $m = 1\\ldots M$ 个数据集，其中每个数据集有 $n = 1\\ldots N_m$ 个观测值 $x_n^m$。共有\
    \ $k = 1\\ldots K$ 个顶层成分，顶层浓度参数为 $\\alpha$。第 $m$ 个文件中的浓度参数为 $\\gamma_m$。在第 $m$\
    \ 个文件中有 $v = 1\\ldots V_m$ 个成分，每个成分与一个顶层成分相关联。若第 $m$ 个文件中的第 $n$ 个观测与该文件中的第 $v$\
    \ 个成分相关联，则令 $z_{nv}^m = 1$。若第 $m$ 个文件中的第 $v$ 个成分与第 $k$ 个顶层成分相关联，则令 $w_{vk}^m =\
    \ 1$。\n\n对于折叠采样器，我们需要用于重新采样 $z_{nv}^m$ 的分布。当我们重新采样这一指派时，有三种可能。1：将其放入文件 $m$ 中当前的一个成分。2：将其放入一个使用现有顶层成分的新成分。3：将其放入一个具有新顶层成分的新成分。我们将依次考虑每一种情况。不过，首先我们需要\
    \ $\\mu_k$（第 $k$ 个顶层成分的均值）的后验密度。该密度是高斯分布，由下式给出：\n\n$$\\begin{aligned}\np(\\mu_k\\\
    mid\\ldots) &\\propto \\mathcal{N}(\\mu_0,\\sigma_0^2)\\prod_{m=1}^{M}\\prod_{n=1}^{N_m}\\\
    prod_{v=1}^{V_m}\\mathcal{N}(x_n^m\\mid\\mu_k,\\sigma^2)^{z_{nv}^m w_{vk}^m} \\\
    qquad (10.1)\\\\\n&= \\mathcal{N}(a,b^2)\\\\\nb^2 &= \\left[\\frac{1}{\\sigma_0^2}+\\\
    frac{1}{\\sigma^2}\\sum_{m,n,v}z_{nv}^m w_{vk}^m\\right]^{-1}\\\\\na &= b^2\\\
    left[\\frac{\\sum_{m,n,v}z_{nv}^m w_{vk}^m x_n^m}{\\sigma^2}+\\frac{\\mu_0}{\\\
    sigma_0^2}\\right]\n\\end{aligned}$$\n\n因此预测密度为（其中求和不包含所考虑的数据点）：\n\n$p(x_n^m \\\
    mid z_{nv}^m = 1, w_{vk}^m = 1) = \\mathcal{N}(a, b^2 + \\sigma^2) = L(x_n^m \\\
    mid k)$\n\n注意，对于一个全新的顶层成分，其表达式完全相同，但所有求和都将等于零。\n\n因此，将该对象放入成分 $v$ 的概率正比于：\n\n\
    $P(z_{nv}^m = 1 \\mid w_{vk}^m = 1, \\ldots) \\propto L(x_n^m \\mid k) \\left(\\\
    sum_n z_{nv}^m\\right)$\n\n为了计算将该点放入文件 $m$ 中一个新成分的概率，我们必须对顶层成分进行边缘化（并允许出现新成分的可能性）。设\
    \ $s_k$ 为在所有文件中被指派给顶层成分 $k$ 的成分数量：\n\n$P(z_{nv}^m = 1 \\mid \\ldots) \\propto\
    \ \\gamma_m \\left(\\frac{\\alpha L(x_n^m \\mid k^*) + \\sum_l s_l L(x_n^m \\\
    mid l)}{\\alpha + \\sum_j s_j}\\right)$\n\n因此，我们可以使用这两个概率来决定第 $n$ 个对象应当放入第 $m$\
    \ 个文件中当前的某个成分，还是放入一个新成分。如果我们选择新成分，那么还需要选择它应当与哪个顶层成分（或一个新的顶层成分）相关联。它与当前顶层成分相关联的概率正比于\
    \ $s_l L(x_n^m \\mid l)$，而与新顶层成分相关联的概率正比于 $\\alpha L(x_n^m \\mid k^*)$。\n\n到此采样器就完成了，不过它的效率可能不是特别高。为了提高效率，可以对每个文件级成分的\
    \ $w_{vk}^m$ 重新采样。计算所需的分布是相当直接的，但要小心：如果像本例这样，均值参数都已被边缘化，则被指派到该成分的所有对象的联合密度不能按标准方式假设为相互独立（它们通过均值参数的边缘化而相互依赖）。这可以通过例如计算\
    \ $p(x_1, x_2, x_3, \\ldots \\mid \\ldots) = p(x_1 \\mid \\ldots)p(x_2 \\mid x_1,\
    \ \\ldots)p(x_3 \\mid x_1, x_2, \\ldots)$ 等方式来克服。\n\n### 练习 10.11.\n\n我们要得到的方程是：第\
    \ $n$ 篇文档中的第 $i$ 个单词来自主题 $k$ 的概率。这将是两个分量的乘积：主题 $k$ 在文档 $n$ 中的概率，乘以单词 $w$（假设第 $i$\
    \ 个单词是单词 $w$）在主题 $k$ 中的概率。根据文中的定义，在未折叠的情况下，该概率由下式给出：\n\n$P(z_{ni} = k \\mid x_{ni}\
    \ = w, \\beta_{kw}, \\theta_{nk}) = \\theta_{nk}\\beta_{kw}$.\n\n要得到折叠版本，我们需要对参数\
    \ $\\theta_n$ 和 $\\beta_k$ 进行边缘化。两者都是多项式分布，并且分别具有参数为 $\\alpha$ 和 $\\gamma$ 的 Dirichlet\
    \ 先验。我们从混合模型的工作中知道，如果我们从多项式分布中取一个样本（比如说采样到了第 $k$ 个值），其参数服从 Dirichlet 分布，那么该样本的概率等于第\
    \ $k$ 个 Dirichlet 参数除以参数之和。我们还知道，对于 Dirichlet 先验和多项式似然，后验 Dirichlet 的参数等于先验参数加上观测计数。因此，将\
    \ $c_{nk}^{-i}$ 定义为第 $n$ 篇文档中当前被指派给主题 $k$ 的单词数（不包括第 $i$ 个），我们知道与 $\\boldsymbol{\\\
    theta}_n$ 的边缘化相关的项为：\n\n$$\\frac{c_{nk}^{-i} + \\alpha_k}{\\sum_j c_{nj}^{-i}\
    \ + \\alpha_j}$$\n\n与 $\\boldsymbol{\\beta}_k$ 的边缘化相关的项为：\n\n$$\\frac{v_{kw} +\
    \ \\gamma_w}{\\sum_{w'} v_{kw'} + \\gamma_{w'}}$$\n\n将两者相乘即得到文中给出的更新式。\n\n"
