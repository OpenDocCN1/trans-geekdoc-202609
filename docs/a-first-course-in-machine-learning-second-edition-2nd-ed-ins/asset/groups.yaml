    mu}_c}(\\mathbf{m},\\mathbf{S}) \\mathcal{N}_{\\boldsymbol{\\mu}_c}(\\mathbf{x}_{\\\
    text{new}}, \\boldsymbol{\\Sigma}_c) \\, d\\boldsymbol{\\mu}_c.\n\\]\n\nWe now\
    \ make use of the following standard result:\n\n\\[\n\\mathcal{N}_x(\\mathbf{a},\\\
    mathbf{A})\\mathcal{N}_x(\\mathbf{b},\\mathbf{B}) = K\\mathcal{N}_x(\\mathbf{d},\\\
    mathbf{D}),\n\\]\n\nwhere:\n\n\\[\nK = \\mathcal{N}_{\\mathbf{a}}(\\mathbf{b},\\\
    mathbf{A} + \\mathbf{B}).\n\\]\n\nThe quantities \\(\\mathbf{d}\\) and \\(\\mathbf{D}\\\
    ) are not important as this density will disappear in our integral. Therefore,\
    \ our expectation becomes:\n\n\\[\np(\\mathbf{x}_{\\text{new}} | T_{\\text{new}}\
    \ = c, \\mathbf{X}, \\mathbf{t}) = \\mathcal{N}_{\\mathbf{x}_{\\text{new}}}(\\\
    mathbf{m}, \\mathbf{S} + \\boldsymbol{\\Sigma}_c).\n\\]\n\n### EX 5.3.\n\nThe\
    \ total likelihood for class \\(c\\) is:\n\n\\[\n\\mathcal{L} = \\prod_{n=1}^{N_c}\
    \ \\frac{1}{(2\\pi)^{D/2} |\\boldsymbol{\\Sigma}_c|^{1/2}} \\exp\\left\\{ -\\\
    frac{1}{2} (\\mathbf{x}_n - \\boldsymbol{\\mu}_c)^\\top \\boldsymbol{\\Sigma}_c^{-1}\
    \ (\\mathbf{x}_n - \\boldsymbol{\\mu}_c) \\right\\}.\n\\]\n\nAs normal, it is\
    \ easiest to maximise the log likelihood. Logging and multiplying out gives:\n\
    \n\\[\n\\log \\mathcal{L} = -\\frac{D N_c}{2} \\log(2\\pi) - \\frac{N_c}{2} \\\
    log |\\boldsymbol{\\Sigma}_c| - \\frac{1}{2} \\sum_{n=1}^{N_c} \\left(\\mathbf{x}_n^\\\
    top \\boldsymbol{\\Sigma}_c^{-1} \\mathbf{x}_n - 2 \\boldsymbol{\\mu}_c^\\top\
    \ \\boldsymbol{\\Sigma}_c^{-1} \\mathbf{x}_n + \\boldsymbol{\\mu}_c^\\top \\boldsymbol{\\\
    Sigma}_c^{-1} \\boldsymbol{\\mu}_c\\right).\n\\]\n\nTaking the partial derivative\
    \ with respect to \\(\\boldsymbol{\\mu}_c\\), equating to zero and solving gives\
    \ a solution for \\(\\boldsymbol{\\mu}_c\\):\n\n\\[\n\\frac{\\partial \\log \\\
