    ## 第 7 章


    ### 习题 7.1  下界由下式给出：


    $$\log p(Y) \ge \int Q(\theta)\log\frac{p(Y,\theta)}{Q(\theta)}\,d\theta.$$


    为了证明当 Q(θ) 为真实后验时该下界达到最大，我们将后验 p(θ|Y) 代入 Q(θ)，并重新整理右端，使不等式变为等式。首先进行代入和展开：


    $$\log p(Y) \ge \int p(\theta|Y)\log p(Y,\theta)\,d\theta - \int p(\theta|Y)\log
    p(\theta|Y)\,d\theta.$$


    接下来展开联合密度：$p(Y,\theta)=p(\theta|Y)p(Y)$：


    $$\log p(Y) \ge \int p(\theta|Y)\log p(\theta|Y)\,d\theta + \int p(\theta|Y)\log
    p(Y)\,d\theta - \int p(\theta|Y)\log p(\theta|Y)\,d\theta.$$


    第一项和第三项相互抵消。第二项是常数的期望，因此期望符号消失：


    $$\int p(\theta|Y)\log p(Y)\,d\theta = \log p(Y)\int p(\theta|Y)\,d\theta = \log
    p(Y).$$


    ### 习题 7.2  我们按照第 7.5.5 节中给出的顺序逐项讨论，从 $\mathbf{E}_{Q_{\tau}(\tau)}\{\log p(\tau|a,b)\}$
    开始：


    $$\mathbf{E}_{Q_{\tau}(\tau)}\{\log p(\tau|a,b)\} = \mathbf{E}_{Q_{\tau}(\tau)}\{a\log
    b - \log\Gamma(a) + (a-1)\log\tau - b\tau\}\\ = a\log b - \log\Gamma(a) + (a-1)\langle\log\tau\rangle
    - b\langle\tau\rangle.$$


    接下来计算 $\sum_n \mathbf{E}_{Q_{\mathbf{x}_n}(\mathbf{x}_n)}\{\log p(\mathbf{x}_n)\}$。回顾
    $p(\mathbf{x}_n)=\mathcal{N}(\mathbf{0},\mathbf{I})$，且 $Q_{\mathbf{x}_n}(\mathbf{x}_n)=\mathcal{N}(\boldsymbol{\mu}_{\mathbf{x}_n},\boldsymbol{\Sigma}_{\mathbf{x}_n})$：


    $$\sum_n \mathbf{E}_{Q_{\mathbf{x}_n}(\mathbf{x}_n)}\{\log p(\mathbf{x}_n)\} =
    \sum_n \mathbf{E}_{Q_{\mathbf{x}_n}(\mathbf{x}_n)}\left\{-\frac{D}{2}\log 2\pi
    - \frac{1}{2}(\mathbf{x}_n^{\mathsf{T}}\mathbf{x}_n)\right\}\\ = -\frac{ND}{2}\log
    2\pi - \frac{1}{2}\sum_n\left(\mathrm{Tr}(\boldsymbol{\Sigma}_{\mathbf{x}_n})
    + \boldsymbol{\mu}_{\mathbf{x}_n}^{\mathsf{T}}\boldsymbol{\mu}_{\mathbf{x}_n}\right).$$


    （注意：$\mathbf{E}_{\mathcal{N}_a(\mathbf{m},\mathbf{S})}\{\mathbf{a}^{\mathsf{T}}\mathbf{B}\mathbf{a}\}=\mathrm{Tr}(\mathbf{S}\mathbf{B})+\mathbf{m}^{\mathsf{T}}\mathbf{B}\mathbf{m}$。）


    这具有高斯分布 $Q_{\mathbf{x}_n}(\mathbf{x}_n)=\mathcal{N}(\boldsymbol{\mu}_{\mathbf{x}_n},\boldsymbol{\Sigma}_{\mathbf{x}_n})$
    的形式。比较系数，我们得到如下结果：


    $$\boldsymbol{\Sigma}_{\mathbf{x}_n} = \left(\mathbf{I} + \langle\tau\rangle \sum_m
    z_{nm} \langle\mathbf{w}_m\mathbf{w}_m^{\mathsf{T}}\rangle\right)^{-1}$$

    $$\boldsymbol{\mu}_{\mathbf{x}_n} = \langle\tau\rangle \boldsymbol{\Sigma}_{\mathbf{x}_n}
    \sum_m z_{nm} y_{nm} \langle\mathbf{w}_m\rangle.$$


    关于 $Q_{\mathbf{w}_m}(\mathbf{w}_m)$ 的表达式可以通过几乎相同的推导得到，因此此处省略。最后，$Q_{\tau}(\tau)$
    的表达式为：


    $Q_{\tau}(\tau) \propto \exp\left(\mathbf{E}_{Q_{\mathbf{W}}(\mathbf{W})Q_{\mathbf{X}}(\mathbf{X})}\{\log
    p(\mathbf{Y},\mathbf{W},\mathbf{X},\tau|\mathbf{Z})\}\right)$

    $\propto \exp\left(\mathbf{E}_{Q_{\mathbf{W}}(\mathbf{W})Q_{\mathbf{X}}(\mathbf{X})}\left\{\log
    p(\tau|a,b)+\sum_{n,m}z_{nm}\log p(y_{nm}|\mathbf{x}_n,\mathbf{w}_m,\tau)\right\}\right)$

    $\propto \exp\left(-b\tau+(a-1)\log\tau-\frac{\sum_{n,m}z_{nm}}{2}\log\tau-\frac{1}{2}\tau\sum_{n,m}z_{nm}\mathbf{E}_{Q_{\mathbf{W}}(\mathbf{W})Q_{\mathbf{X}}(\mathbf{X})}\left\{(y_{nm}-\mathbf{w}_m^{\mathsf{T}}\mathbf{x}_n)^2\right\}\right)$

    $\propto \exp\left(-b\tau+(a-1)\log\tau-\frac{\sum_{n,m}z_{nm}}{2}\log\tau-\frac{1}{2}\tau\sum_{n,m}z_{nm}\left\langle(y_{nm}-\mathbf{w}_m^{\mathsf{T}}\mathbf{x}_n)^2\right\rangle\right).$


    这具有另一个 Gamma 分布的形式，其参数为：


    $e = a + \frac{1}{2}\sum_{n,m}z_{nm}$

    $f = b + \frac{1}{2}\sum_{n,m}z_{nm}\left\langle(y_{nm}-\mathbf{w}_m^{\mathsf{T}}\mathbf{x}_n)^2\right\rangle.$


