  \ [JB]。Journal of Intelligent & Fuzzy Systems, *1-15。\n\n# 第 6 章 智能交通系统中的统计 AI 模型\n\
  \nA. KODIESWARI^(⁴)\n\n## 摘要\n\n在过去的二十里，由于世界人口增长，车辆使用量增加，导致了交通拥堵、旅行延迟、道路事故和能量消耗。为了解决这一问题，需要开发智能交通系统。本章侧重于解决交通预测和驾驶行为的智能\
  \ AI 模型。人工神经网络（ANN）对设计产生了影响。深度卷积神经网络用于检测加速度、节门和每分钟转数（`RPM`）等特征，以减少事故风险并确保交通系统。\n\
  \n## 6.1 神经网络引言\n\n在构建神经网络时，节点的组织方式与人脑中神经元的相互作用方式相似。此外，它被称为人工神经网络（SNN）或人工神经网络（ANN），它是机器学习（ML）应用的关键组件。ANN\
  \ 包含三层：\n\n### 输入层\n\n神经网络的第一层是输入层。输入层由输入节点组成，这些节点将数据传递到后续节点进行进一步处理。\n\n### 隐藏层\n\
  \n隐藏层位于算法的输入和输出之间，对输入分配权重并使用激活函数作为输出，以引导网络所需的方向。总之，隐藏层以非线性方式改变输入。隐藏层的数量对神经网络的性能有影响，分配给这些层的权重也可能有影响。隐藏层允许将神经网络的功能分解为特定的信息转换。隐藏层中的每个函数都针对实现特定结果进行了优化。考虑一个需要执行脸识别的神经网络，隐藏层在该特定网络中的作用是分解脸识别过程以使其更有效。它可以对过程进行分割，例如一个隐藏层预测眼睛，另一层预测鼻子，它们可以独立地识别对象，然后可以在神经网络中共同工作以预测整个对象（脸）。\n\
  \n### 输出层\n\n输出层可能由输出节点组成。该层的主要责任是计算并将信息从网络传输到外部世界。该层的输出会被提供给用户。该层的信息将以用户可以理解的形式呈现。\n\
  \n## 6.2 神经网络的工作原理\n\n\n\n\n\n人工神经网络被广泛认为是神经网络，ANN 和 neural networks 是指代同一概念的两个词。人工神经网络使用节点，可以分为若干层，例如输入层、隐藏层和输出层，这些层随后相互连接形成网络。网络中每个与网络中另一个神经元连接的每个人工神经元都被分配一个权重和一个阈值。每当节点的输出达到特定阈值时，网络认为该节点处于激活状态，并将数据传输到下一个网络层。当输出节点小于阈值时，则不允许数据移动到下一层。通过使用特定任务的可用数据集对模型进行训练，可以在神经网络中执行预测、分类和聚类算法。因此，神经网络将从训练数据集中学习，这可能有助于提高网络的性能和准确性。训练数据是神经网络用于学习的过程，旨在提高其在预测过程中的准确性。然而，当这些学习算法针对准确性进行调优时，它们成为计算机科学和人工智能（AI）领域极其强大的工具，允许任何人轻松地对数据进行分类和组织。与人类专家手动分类相比，语音识别和图像识别操作可以在几分钟内完成，而不是几小时。谷歌搜索结果是使用世界上最著名的神经网络之一创建的（图\
  \ 6.1）。\n\n![图 6.1 神经网络的工作。](img/fig6_1_B.jpg)\n\n图 6.1 神经网络的工作。\n\n神经网络的每一个节点都有其自己的输入数据、权重、偏置和输出。可以使用以下公式进行估计：\n\
  \n$$\\\\begin{array}{l} {\\\\sum\\_{i = l}^{m}{wixi + bias = w\\_{1}x\\_{1} + w\\\
  _{2}x\\_{2} + w\\_{3}x\\_{3} + bias}} \\\\\\\\ {Output = f\\\\left( x \\\\right)\
  \ = \\\\left\\\\{ \\\\begin{array}{l} {1if{\\\\sum{w1x1 + b \\\\geq 0}}} \\\\\\\\\
  \ {0if{\\\\sum{w1x1 + b < 0}}} \\\\\\\\ \\\\end{array} \\\\right.\\\\\\} \\\\\\\\\
  \ \\\\end{array}$$\n\n下面讨论了神经网络每个节点中执行的过程：\n\n*   一旦输入层接收到输入数据，就会为其分配权重。\n*   输入数据将与分配的权重相乘，然后与偏置值相加。\n\
  *   得到的节点输出应该通过激活函数，该函数将决定输出是否能够通过。\n*   初始阈值将固定在激活函数中。如果得到的输出值超过阈值，则节点数据将触发；如果得到的值低于阈值，则节点数据将不会触发。\n\
  *   因此，从一个节点获得的输出将作为下一层结的输入。\n*   神经网络将通过将数据从一个节点传递到下一个节点来构建。\n\n让我们在一个实时示例中应用此点——Sheela\
  \ 想买一件连衣裙。她应该做一个决定，结果可能是“是”（1）或“否”（0）。为了做出决定，Sheela 需要关注影响决策的几个因素。这些因素是：\n\n*  \
  \ 连衣裙是否完美契合她的身型？\n*   连衣裙的面料好吗？\n*   颜色适合她吗？\n\n网络将在做出决定之前检查这些条件。让我们假设这些是输入。现在，我们现在有三个输入参数，输入为：\n\
  \n*   `X[1] = 1`，因为连衣裙完美契合她的身型。\n*   `X[2] = 0`，连衣裙的面料很好。\n*   `X[3] = 1`，颜色很合适。\n\
  \n然后，将根据特定因素对决策的影响为这些输入分配权重：\n\n*   `W1–5`，由于合合度是主要因素，它具有较高的权重。\n*   `W2–2`，面料是\
  \ Sheela 考虑的最小因素。\n*   `W3–3`，连衣裙的颜色。\n\n其中权重根据 Sheela 偏好的优先级来决定。在公式中应用这些值：\n\n\
  $$\\\\begin{array}{l} {Y = \\\\left( {1 \\\\times 5} \\\\right) + \\\\left( {0 \\\
  \\times 2} \\\\right) + \\\\left( {1 \\\\times 3} \\\\right) - 3} \\\\\\\\ {Y =\
  \ 8 - 3} \\\\\\\\ {Y = 6} \\\\\\\\ \\\\end{array}$$\n\n因此，得到的输出值大于阈值（1）。这表明神经元现在可以触发到下一层。如果该值较小，则允许神经元触发到下一层。\n\
  \n为了构建神经网络，需要以下构建构建块来处理人工神经网络：\n\n*   网络拓扑结构；\n*   权重调整或学习；\n*   激活函数。\n\n### 6.2.1\
  \ 网络拓扑结构\n\n网络节点及其互连链路的组织被称为其拓扑结构。ANN 可根据其拓扑结构进一步分类为：\n\n*   前馈神经网络；以及\n*   反馈神经网络。\n\
  \n### 6.2.2 前馈网络\n\n这是一个具有层级的网络，所有层都可以相互连接。信号只能从一个方向传输，即从输入到输出，因为没有反馈回路（图 6.2）。\n\
  \n![图 6.2 前馈网络类型](img/fig6_2_B.jpg)\n\n图 6.2 前馈网络类型\n\n### 6.2.3 单层前馈网络\n\n单层前馈网络是一种简单的神经网络类型，它可以连接到下一层。在这种网络中数据只能向前传输。单层网络中只有输入层和输出层，在它们之间没有任何隐藏层（图\
  \ 6.3）。\n\n![图 6.3 单层前馈网络架构](img/fig6_3_B.jpg)\n\n图 6.3 单层前馈网络架构\n\n### 6.2.4 多层前馈网络\n\
  \n多层神经网络主要用于非线性数据集的分类问题。在多层神经网络中，隐藏层位于输入层和输出层之间。输入层的输出作为隐藏层的输入，然后数据处理到输出层。没有反馈连接，网络的输出将再次作为下一次迭代的输入（图\
  \ 6.4）。\n\n![图 6.4 多层神经网络架构](img/fig6_4_B.jpg)\n\n图 6.4 多层神经网络架构\n\n### 6.2.5 反馈神经网络\n\
  \n在反馈神经网络中，数据可以同时向前和反向传输。其执行过程与前馈神经网络类似，例如输入数据将与分配的权重相乘并与偏置相加。在这里，网络将输出作为下一次迭代的输入，该过程将一直持续直到网络达到平衡点。因此，我们通常认为反馈神经网络处于动态状态。这些网络可以用于寻址存储（图\
  \ 6.5）。\n\n![图 6.5 反向传播神经网络架构](img/fig6_5_B.jpg)\n\n图 6.5 反向传播神经网络架构\n\n\n\n反馈神经网络，也称为循环神经网络（`RNN`），可以是一种用于序列类型数据或时间序列数据的强大且稳健的类型网络。`RNNs`\
  \ 是前馈神经网络的扩展模型。通常，`RNN` 会识别数据的序列化特征，然后利用识别出的模式来预测下一次的可能性。它被广泛应用于预测困难的场景。处理后的输出数据将通过反馈循环作为前一个状态的输入。这种反馈循环使其具有持久性，并通常被描述为记忆。\n\
  \n### 6.2.6 权重调整\n\n神经网络中的权重证明了两个不同神经元之间连接的强度。它通过适当的输入参数影响系统。这些权重被分配给网络中的每个节点。`Bias`（偏置）是与给定输入数据最拟合模型的常数值。一旦模型用数据完成训练，就应对其准确性进行进一步测试。模型中的误差是实际值与预测值之间的差异。基于这些误差，系统执行权重调整并将其向后传播到网络。这个过程被称为误差的反向传播。\n\
  \n## 6.2.7 激活函数\n\n激活函数通过计算加权和并对其加上偏置来决定神经元是否应该受到刺激。通过使用激活函数，神经元的输出引入了非线性。根据输出的不准确性，我们会调整神经网络中神经元的权重和偏置。这个过程被称为反向传播。激活函数能够实现反向传播，因为梯度和误差同时提供用于更新权重和偏置。神经网络无非只是一个没有激活函数的线性回归模型。非线性激活函数改变输入，使其能够学习并执行更困难的任务。有五种重要的激活函数，它们是：\n\
  \n*   线性激活函数；\n*   Sigmoid 激活函数；\n*   Tanh 激活函数；\n*   ReLu 激活函数；\n*   SoftMax 激活函数。\n\
  \n### 6.2.7.1 线性激活函数\n\n该函数由方程 `y = mx + c` 表示，它类似于直线的方程。线性激活函数 `f(x)` 可以表示为：\n\n\
  ```\nf(x) = x\n```\n\n如果所有层层在性质上都是线性的，那么最后一层的最终激活函数仅仅是第一层输入的线性函数。\n\n### 6.2.7.2\
  \ Sigmoid 激活函数\n\n该函数接收任何实值作为输入，并提供 0 到 1 之间的任何值作为结果。Sigmoid 激活函数所示：\n\n```\nf\\\
  left( x \\right) = \\frac{1}{1 + e^{- x}}\n```\n\n输出值越接近 1.0，输入值越大（越正），输出值越接近 0.0，输入值越小（越负）。输出为概率预测的模型通常采用这种。这是因为概率处于\
  \ 0 和 1 之间的某处。该函数适用于 3 到 –3 的范围，之后图形变得平滑至零 [15]。\n\n### 6.2.7.3 Tanh 激活函数\n\n该函数与\
  \ sigmoid/logistic 激活函数几乎相同，因为它们具有相当的 –1 到 1 的输出范围，甚至具有相同的 S 形状。`Tanh` 函数表示为：\n\n\
  ```\nf\\left( x \\right) = \\frac{\\left( {e^{x} - e^{- x}} \\right)}{\\left( {e^{x}\
  \ - e^{- x}} \\right)}\n```\n\n如果输入较大（越正），输出将更接近 1.0；如果输入较小（越负），输出将更接近 –1.0。因为 `tanh`\
  \ 激活函数的输出是中心化的（Zero-centered），我们可以很容易地将输出值翻译为高度负、中性或非常正。\n\n### 6.2.7.4 Relu 激活函数\n\
  \n`ReLu` 是整流线性单元（Rectified Linear Unit）的缩写。它是作为导函数而非线性函数实现的。它表示为：\n\n```\nf(x) =\
  \ max(0,x)\n```\n\n它允许反馈网络模型将系统转换为高效模型。`ReLU` 函数不会同时刺激所有的神经元。当传递函数的输出小于 0 时，这些神经元会变为非激活。它比\
  \ sigmoid 和 tanh 激活函数更高效。Leaky `ReLu` 是改进版本。\n\n### 6.2.7.5 SoftMax 激活函数\n\nsoftmax\
  \ 激活函数计算相对概率。该函数表示为：\n\n```\nsoftmax\\left( z_{i} \\right) = \\frac{\\exp\\left(\
  \ z_{i} \\right)}{\\sum_{j}\\exp\\left( z_{j} \\right)}\n```\n\n`SoftMax` 函数适用于多分类分类。它返回列表中最大的值。`SoftMax`\
  \ 为每个类别标签返回一个类别成员的概率，并尝试尽可能精确地近似给定输入的预测目标。\n\n## 6.3 交通研究的数学模型\n\n交通研究技术开发于 20 世纪\
  \ 60 年代初。这些方法是在样本或数据极少的情况下发明的。在当今的计算时代，可以收集、检索大量的样本。主要的挑战将是处理数据中可见的非线性。大多数模型是线性统计模型。现在交通研究领域在效率方面正朝着剧烈发展的方向移动。现代，丰富的数据可以用于识别其中的模式。它还能够处理噪声甚至不确定性。最重要的目标之一是在交通领域收集大量数据。通信系统和传感器技术在从现实世界提取数据方面起着关重要的作用。这些技术的有效性有助于系统识别数据中的适当模式。神经网络为发现交通研究中的各种热点铺平了道路。\n\
  \n\n\n\n神经网络的主要目标是将输入转换为重要的输出。网络由人工神经元组成，这些神经元接收多个输入并对其进行处理，以从系统中产生有价值的结果。每个神经元对其他神经元都有影响。它能够观测具有复杂模式的数据。神经网络有许多层。每一层独立地提议执行特定的功能。因此，神经网络中的神经元模型被称为感知器。感知器接收几个输入并对其进行处理以产生单个的二进制输出。一个神经元通常由输入值、权重、传递函数、激活函数和输出值组成。权重是描述输入特征重要性的实数。图\
  \ 6.6 显示了神经元的结构。\n\n![图 6.6 描述人类大脑的神经元结构。](img/fig6_6_B.jpg)\n\n图 6.6 描述人类大脑的神经元结构。\n\
  \n在给图中，输入值（`X[i]`）表示馈到模型的输入特征值，用于训练模型以获得更好的准确性。这些特征应当被恰当地选择，以便它们与要完成的任务密切相关。最重要的特征被赋予更多的权重（`W[i]`），以增加它们对学习过程的贡献。某些特征在决定任务结果方面产生巨大影响。例如，对于任何旅行者来说，路况对给定地点之间的旅行时间产生巨大影响。整个过程设置了一个阈值。输出由所有输入特征与其对应权重之间的点积的加权之和决定。当加权之和小于选定的阈值时，目标输出为\
  \ 0。同样，当加权之和大于给定的阈值时，目标输出为 1。\n\n$$Output,Y = \\\\left\\{ \\\\begin{matrix} {0,f{\\\
  \\sum{X\\_{i}W\\_{i} < threshold}}} \\\\\\\\ {1,{\\\\sum{X\\_{i}W\\_{i} > threshold}}}\
  \ \\\\\\\\ \\\\end{matrix} \\right.$$  \n\n## 6.4 交通研究的算法神经网络模型\n\n在神经网络中，节点层的排列方式类似于人脑中的神经元相互通信的方式。神经网络也被称为人工神经网络（ANN）和刺激神经网络（SNN），并且它是机器学习和深度学习算法的子集。ANN\
  \ 有三种类型的节点层：输入层、隐藏层和输出层。\n\n连接到另一个人工神经元的每个人工神经元的权重和阈值是相同的。当单个节点的输出超过预定的阈值时，该节点被激活，数据发送到网络的下一层。当输出节点小于阈值时，则不发送数据。分类、聚类、函数近似、时间序列分析和预测等问题都可以通过神经网络解决。\n\
  \n*   交通预测与控制；\n*   交通参数评估；\n*   交通基础设施的维护；\n*   交通政策；\n*   驾驶员行为和自动驾驶车辆 (AVs)。\n\
  \n各小节讨论了满足交通研究挑战的最佳神经网络技术。\n\n### 6.4.1 用于交通基础设施系统的人工神经网络 (ANNs)\n\nANN 具有从数据中提取复杂模式的卓越能力，用于交通基础设施。ANN\
  \ 的概念由 `Zhang & Zhang (1999)` 提出，并用于模拟功能。ANN 由大量的神经元组成，这些神经元并行连接以解决医学、交通、优化等各种问题。输入和目标数据用于训练\
  \ ANN。因此，ANN 被认为是一个强大且灵活的工具。\n\n#### 6.4.1.1 人工神经网络的优势\n\n*   适用于大型数据集；\n*   检测依赖和独立变量之间复杂的非线性相互作用；\n\
  *   指示变量之间的潜在联系；\n\n#### 6.4.1.2 交通基础设施的设计 (Tis)\n\n交通基础设施被定义为维持和发展必要的物理资产。Tis 的设计是一个关键组成。土地利用规划、建筑施工和土地划分都是各级政府监管的部分。目标是在城市和农村地区产生高质量的长期成果。为了有效开发\
  \ TIS，高度需要系统工程方法。交通基础设施工程由四个核心要素组成，见图 6.7：\n\n![图 6.7 TIS 参数](img/fig6_6_B.jpg)\n\
  \n图 6.7 TIS 参数\n\n*   基础设施资产修复和更新；\n*   结构性能与运行；\n*   可持续和实体材料；\n*   新兴的稳健技术和创新工具。\n\
  \n通用的系统工程方法涉及：\n\n```\n*TX*[n] = ∑*W**Q*[n] = *OX*[nq]\n```\n\n其中 `TX[n]` 是交通系统参数输入；`W`\
  \ 是 TIMS 权重；`Q[n]` 是函数；`OX[nq]` 是 TIMS 函数的输出。\n\n#### 6.4.1.3 交通基础设施管理系统 (Tims)\n\
  \n提高交通基础设施系统性能的直接方法是交通基础设施管理系统 (TIMS)。TIMS 是一种高度专业的方法，适用于各种交通特征。TIMS 由两个子系统组成，分别是道路管理系统\
  \ (PMS) 和桥梁管理系统 (BMS)。TIMS 的目标是收集与交通基础设施相关的各种大数据。为了提高 TIMS 的性能，使用了增强方法。基础设施损坏检测和监测是\
  \ TIMS 的另一个挑战性任务，因为传统上使用视觉评估策略，这消耗更多时间，并且在状态诊断方面困难。这影响了 TIMS 的性能。为了克服这一点，使用了 ANN\
  \ 方法，其中涉及用于检测的结构参数缩减和用于监测过程的组成材料状态诊断。\n\n\n\n\n\n### 6.4.1.4 交通基础设施系统的架构设计\n\n涉及数据挖掘预测和分类时，`ANNs`\
  \ 是一种数据驱动工具（图 6.8）。\n\n![图 6.8 神经网络功能或交通基础设施系统。](img/fig6_8_B.jpg)\n\n图 6.8 神经网络功能或交通基础设施系统。\n\
  \n此外，`ANNs` 提供了独特的工具和应用，例如控制设备，这些设备在实施得当的情况下，可能会在交通基础设施等领域提供巨大的优势。建议的模型是一个可靠的原型，具有额外的益处，特别是在过程控制和系统性能预测方面。由于过程控制和系统性能被视为\
  \ `TIS` 的核心组件，因此 `TIS` 和 `TIMS` 必须包含在任何人工神经网络协作中。`TIS ANN` 是一种多层通用系统工程解决方案。该方法包括输入、处理和输出阶段。为了辅助优先事项的整体发展，必须持续改进和维护该模型的整体性能。此外，在评估系统性能增强时，必须对三个主要的系统阶段进行适当的研究和整体化整合。\n\
  \n### 6.4.2 使用图神经网络 (Gnn) 进行交通预测\n\n交通预测和预计到达时间（`ETA`）是克服交通拥堵和避免晚到的重要因素。交通预测有助于朋友或家人告知晚到信息，并帮助服务提供者传递接送或送达时间变化的信息。Google\
  \ Map 通过使用 `ML` 算法分析来自路段的交通数据来计算 `ETA`。`ML` 算法通过将实时交通数据与历史道路交通模式对比来分析未来交通。但由于高峰时段不可避免的波动，计算道路的精确交通状况是复杂的。此外，预测模型面临的其他挑战还包括道路质量、速度限制、事故和道路关闭。\n\
  \n#### 6.4.2.1 图神经网络 (GNNS) 在 Google Maps 中的工作原理\n\n现有的交通预测 `ML` 模型的工作原理基于“超级路段”（super\
  \ segments），但发现通过超级路段估计旅行时间是困难的。共享大量交通流量的多个相邻路段被称为“超级路段”。超级路段覆盖一组路段，每条路段都有自己的长度和速度特征。为了实现高准确率，最近的研究利用了\
  \ `ML` 模型 `GNNs`。`GNNs` 结合了用于时空推理的关系学习偏置，以模拟现实道路网络的连接结构。`GNN` 将设计一种交通模型，描述汽车如何流过道路网络（图\
  \ 6.9、6.10 和 6.11）。\n\n超级路段覆盖一组路段，每个路段具有特定的长度和速度特征。最初使用 `RNN` 处理变长度的超级路段序列，但发现从道路网络形成结构存在困难。`RNN`\
  \ 通过“接近性”概念部署，允许通过复杂的连接来处理我们前方、后面、相邻和交叉口的道路。推荐使用 `GNN` 进行交通建模，它是 `CNN`（卷积神经网络）的扩展学习倾向（图\
  \ 6.12）。\n\n![图 6.12 深度神经网络的工作原理。](img/fig6_12_B.jpg)\n\n图 6.12 深度神经网络的工作原理。\n\n\
  ![图 6.9 确定最优路线及其旅行时间的模型架构。](img/fig6_9_B.jpg)\n\n图 6.9 确定最优路线及其旅行时间的模型架构。\n\n![图\
  \ 6.10 Google Maps 中高级图神经网络的工作原理。](img/fig6_10_B.jpg)\n\n图 6.10 Google Maps 中高级图神经网络的工作原理。\n\
  \n在 `GNN` 中，超级路段覆盖一组路段，每个路段具有特定的长度速度特征。最初使用 `RNN` 处理变长度的超级路段序列，发现难以从道路网络中构建结构。`RNN`\
  \ 通过“接近性”概念部署，允许通过复杂的连接来处理我们前方、后面、相邻和交叉口的道路。推荐使用 `GNN` 进行交通建模，它是 `CNN`（卷积神经网络）的扩展学习倾向（图\
  \ 6.12）。\n\n在 `GNN` 中，局部路网络被视为图。它还包含了路段的节点以及通过交叉口的边。在我们的模型中，当执行消息传递算法时，节点状态和边的结果被确定。因此，理解超级路段被视为路网络子图，并根据交通密度进行随机采样。这些采样的子图使用单一模型进行训练并部署。在\
  \ `GNN` 模型中，相邻节点相互发送消息，通过分配局部偏置，节点将发现相邻节点。该系统使 `GNN` 能够为有效道路网络开发连接结构。实验证明，准确预测与主路连接的相邻道路使得\
  \ `GNN` 更强大。无论是单路线还是长路线，`GNN` 都会根据变化的长度和复杂度执行相同的过程。\n\n![图 6.11 循环神经网络的功能。](img/fig6_11_B.jpg)\n\
  \n图 6.11 循环神经网络的功能。\n\n#### 6.4.2.2 构建泛化模型\n\n由于训练期间使用的图拓扑结构非常多样，当模型投入生产时，它对训练课程的变化极其敏感。单个批次可以从两个节点的微型网络到包含\
  \ 100 多个节点的巨型图[11）。`GNN` 的限制通过利用一种被称为监督学习的革命性强化学习技术得到了解决。当 `ML` 模型学习新知识时，它会忘记已经学会的特征。因此，人员随着时间推移降低了学习率。\n\
  \n为了克服运行过程中的学习率误差，使用 `MetaGradients` 算法在运行过程中动态获取最优学习率。Meta Gradients 在运行过程中调整学习率，能够降低学习率并以更快的速度自动提高质量。因此这种方法在生产中被广泛使用。\n\
  \n具有减少旅行估计误差巨大潜力的泛化模型是通过多个损失函数的线性组合构建的。我们对模型权重使用了正则因子，对总旅行时间使用了 `L2` 和 `L1` 损失，并对图中每个节点使用了独立的\
  \ Huber 损失和负对数似然（`NLL`）损失以产生多损失目标[12）。我们通过将这些损失包含在模型中避免了对训练数据集的过拟合。尽管我们对训练质量的判断没有变化，但训练进展更快地传输到了留存测试集和端到端测试中。\n\
  \n\n\n\n卷积神经网络（CNNs）是一种使用深度学习技术和具有一个以上隐藏层的神经网络架构的常用方法。深度神经网络是具有多个隐藏层的模型。卷积神经网络也被称为深度神经网络。交通是任何发展中国家经济影响的主要模式，最近道路上的车辆数量剧增。由于车辆增加，道路安全成为全球性的严重问题。因此，为了减少事故风险，利用智能交通系统（ITS）检测驾驶员行为是非常必要的。传统的计算机视觉技术受到欺骗和隐私侵犯问题的影响。通过深度学习算法，可以利用各种特征（包括加速度、重力、节门和每分钟转数\
  \ RPM）来检查驾驶行为。使用这些标准时，该方法可以判断驾驶员在驾驶时是安全、激进还是分心。还可以判断驾驶员在驾驶时是否醉酒。深度神经网络在图片上的价值可以通过在图像上使用\
  \ CNN，并利用递归图（RP）方法从驾驶信号中构建模型（图 6.13）。\n\n![图 6.13 驾驶行为检测过程。](img/fig6_13_B.jpg)\n\
  \n图 6.13 驾驶行为检测过程。\n\n用于驾驶行为检测的深度 CNN 技术涉及：\n\n*   数据采集；\n*   实现时间窗口和递归图技术；\n* \
  \  卷积神经网络。\n\n时间窗口被应用于采集的 9 个信号上以区分驾驶员行为。窗口数据然后通过 RP 技术转换为图像。转换后的图像能够将时间依赖转换为空间依赖。生成的图像将作为\
  \ CNN 的输入，以对不同的驾驶风格进行分类，例如正常、激进、分心、疲劳和醉驾。高效且低成本的计算模型将根据卷积层数量、滤波器数量和滤波器的大小进行设计（图\
  \ 6.14）。\n\n![图 6.14 来自 SEU 数据集的不同驾驶风格。](img/fig6_14_B.jpg)\n\n图 6.14 来自 SEU 数据集的不同驾驶风格。\n\
  \n### 6.5.1 数据采集\n\n我们需要车辆的线性加速度（无论车辆方向如何）来检查其运动情况。线性加速度是施加在车辆三个轴（x、y 和 z）上的压力测量值，重力除外。为了计算线性加速度，我们需要三个方向（x、y\
  \ 和 z）的加速度和重力输入。我们将加速度和重力视为深度神经网络负责评估并学习其表示的两个属性。\n\n每分钟转数（RPM）是发动机每分钟绕固定轴旋转次数的单位。必须通过\
  \ OBDII 适配器访问 ECU 参数以获取准确的 RPM 值。根据油门板踩下的力度程度，节门位置传感器决定了节门阀的开启程度。OBDII 适配器从 ECU\
  \ 获取此值。在大多数但并非所有情况下（例如上坡或下坡路段），RPM 与节门成比例变化。这在手动（非自动）汽车中尤为如此。因此，在预测驾驶行为时，这些特征被考虑在内。\n\
  \n模拟了一个驾驶员，采取了激进行为，如超速、跟车、过度加速以及在启动或刹车时减速。使用虚假活动将驾驶员的注意力从道路吸引 1 到 2 秒，模拟分心驾驶。\n\n\
  为了模仿睡眠驾驶，参与者随机闭上眼睛 1 到 2 秒，很少采取刹车，转向迟缓，行驶速度低于限速，且加速度或挡位变化极小。现实中，睡眠的驾驶员最终会醒来，要么修正车辆位置，要么导致事故。\n\
  \n### 6.5.2 实现时间窗口和递归图（RP）技术\n\n我们记录每个时间槽内的驾驶员行为，并将其分类为正常、激进、不注意、疲劳或醉酒。5 秒的时间帧被用于检测醉驾，20\
  \ 秒的时间窗口用于检测激进驾驶，1.8 秒的时间窗口用于识别分心驾驶。数据在时域中采集并依赖于时间。递归图（RP）是一种时间序列可视化工具，用于可视化递归工具。\n\
  \n递归图的数学模型为：\n\n```\nRi, j = θ(ϵ - ||X[i] - X[j]||)\n```\n\n其中；`||.` 是范数；`x` 是时间序列；`θ`\
  \ 是海维赛德函数；`ϵ` 是递归阈值。\n\n### 6.5.3 卷积神经网络（CNNs）架构\n\n发动机的每分钟转数（RPM）是一个测量单位。必须使用 OBDII\
  \ 适配器检索 ECU 参数。通过节门位置传感器，当你完全踩下油门板时，可以精确控制节门阀的开启程度。OBDII 适配器从 ECU 收集数据并发送到计算机。\n\
  \n然而，情况并非总是如此。例如，在上坡或下坡路段，RPM 的数量随节门波动，特别是在手动（非自动）汽车中。正因如此，在对驾驶员进行预测时考虑了这些特性。\n\n\
  CNN 架构被认为是检测驾驶行为最准确且计算效率最高的模型。采用新型 CNN 架构消除了在极深全连接网络中需要大量学习参数的需求。相反，在 CNN 的末端，我们使用了带有全局池化的极全连接网络。这些新的\
  \ CNN 趋势在许多应用程序中展示了出色的效率，而且不容易过拟合。使用了 leaky ReLU 激活函数的高效和快速收敛特征（图 6.15）。\n\n![图\
  \ 6.15 卷积神经网络架构。](img/fig6_15_B.jpg)\n\n图 6.15 卷积神经网络架构\n\nCNN 三通道的所有图像大小为 150 ×\
  \ 50 像素。在 CNN 的初始层，卷积层和最大池化层作为特征提取器，同时 SoftMax 分类器在最后一层将输入图像分为五类之一。Dropout 是一种通过随机忽略某些神经元来减少过拟合的泛化技术。\n\
  \n## 6.6 结论\n\n本章讨论了用于解决交通系统问题的 AI 模型。解释了用于基础设施管理、交通预测和驾驶行为检测的统计 AI 模型 [13]。根据性能分析，AI\
  \ 被认为是设计和开发优化运输网络的有效模型。此外，它有助于预测旅行需求、基于天气的旅行计划以及当前交通状况和事故期间的交通调度。本章提供了 CO2 排放、安全旅行、污染控制报警和高效燃料利用的展望。\n\
