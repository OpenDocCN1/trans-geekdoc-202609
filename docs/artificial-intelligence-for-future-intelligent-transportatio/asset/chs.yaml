  \ `MLP` 等深度学习技术被用于识别这些因素。\n\n## 9.5 航空与公共交通的 AI 应用\n\n由于计算机科学的进步，现场数据收集变得更加可靠和易于实现。由于公共交通数据海量且无结构化，必须对其进行正确建模才能充分利用。航空\
  \ AI 已被证明可以提高飞机行程的效率。技术（`ML`）、软件/硬件以及应用程序都可能受益于 AI（智能维护、飞行路线优化）。当飞机着陆时，无监督 `ML`\
  \ 方法在增加安全性方面是可靠的 [10]。\n\n简而言之，通过利用 `Probabilistic neural network` 验证机发动机 (`PNN`)\
  \ 分析了飞机安全性。`PNN` 的网络训练与 `MLP` 相同，但它使用反向传播算法而不是线性函数，且 `RBN` 的隐藏层需要更多的神经元。\n\n为了更好地识别飞机气流，他们开发了一种自动监督的\
  \ `Random Forest` 方法。这项技术可以帮助飞行员保持航线、节省燃料费用并改善空中控制管理。在飞行期间，使用 `ANN` 改进燃气轮监控系统至关重要。出行领域的共享经济在拥堵的城市中心已被证明是理想的，因为它能够提供解决方案来消除单人或少人数私家车对道路的占用，特别是它有助于减少市中心的交通问题。\n\
  \n通过采用新举措来减少交通拥堵和环境影响，这实现了一种双赢的方法，既提供了快速的经济优势，又提供了高效的长期可持续解决方案。根据协作消费的定义，“基于 ICT\
  \ 的网络用于产品和服务的传输，利用了诸如托管、租赁、捐赠和交换等非市场逻辑，以及经济逻辑；租赁和销售。” `Uber` 和 `Airbnb` 正共享经济市场中的先驱，这种经济模式很大程度上在交通和住宿业中日益流行。\n\
  \n它正变得越来越成为一种共享经济，企业正尝试为新的共享出行服务开发业务模式，以创建更优的大众运输系统并更有效地弥补供需差距。大多数客户对按需自行车、汽车和交通共享特别感兴趣。此外，这些共享出行解决方案解决了“第一公里、最后一公里”交通中的主要弱点。\n\
  \n### 9.5.1 智能城市出行\n\n基于实时数据的更智能决策以及通过有效利用基础设施进行网络优化，是未来智能城市交通的目标之一。重要的是，倡导更好、更安全、更健康的交通系统，促进智能连接，以建立一个长期、无缝且环保的网络\
  \ [11]。自动驾驶汽车 (`AVs`)，即可以在没有人类驾驶员帮助或监督的情况下行驶的汽车，已处于远景。\n\n### 9.5.2 执法\n\n沿路放置的传感器和摄像头收集了大量的交通趋势数据。这些数据使用大数据和\
  \ AI 技术进行分析以发现交通模式。得益于这些见解，通勤者可以获得交通预报、事故和道路关闭的信息，以及到达所在地的最快路径建议。例如，`Siemens Transportation`\
  \ 开发了一种基于交通传感器的概念 AI 监控系统，可以实时更改交通灯以缓解交通拥堵。通过这种方式，AI 将能够减少无效交通、提高交通安全并缩短等待时间。\n\n\
  ### 9.5.3 延迟预测\n\n交通延误，特别是航空旅行，是另一个挑战。图 9.6 描绘了航班延误，这在美国可能花费高达 3900 万美元 [12]。根据加州大学伯克利分校发布的一项研究，美国是世界上最富国家。AI\
  \ 向航空运输寻求帮助，以避免航班延误的成本以及乘客的糟糕体验。AI 可以利用其数据分析和机器视觉预测从不雅到可能导致航班延误的精确技术故障数量的任何情况，协助并减少乘客长时间等待。当\
  \ AI 和 `ML` 使用并检查真实的飞机数据、记录和气象数据时，计算机视觉系统可以对飞机进行监控。计算可以发现某些趋势，让该行业获得潜在延迟或取消的重要见解。\n\
  \n### 9.5.4 无人机出租\n\n无人机已用于交付方法，但很快也可能纳入车辆。无人机 (`UAVs`) 是一项独特的技术。降低二氧化碳排放、交通拥堵和基础设施的策略\
  \ [13]。无人机将受益，因为它们将更快到达目的地，行程时间将缩短到最短。当涉及到城市空间改造和结构基础设施开发时，无人机出租车经常成为现实。中国的一项无人驾驶飞行器演示让\
  \ 17 名乘客首次享受了高效的空中出行，这是无人机出租车最近的案例之一 [14, 15]。`Uber` 多年前宣布与 `NASA` 合作，以构建用于运行自动“飞行出租车”（图\
  \ 9.7）的技术。预计未来基于这些用例的应用将类似的。\n\n\n\nAI 方法已经受到了许多批评。他们向这些人员展示了运输部门的概述。AI 的主要缺陷之一是将人工神经网络（ANNs）视为“黑箱”。在对系统的基础数学没有任何先验理解的情况下，输入与输出之间的联系形成了\
  \ `[16]`。ANN 在数据集中缺失部分信息时的泛化能力遭到了质疑。他们通过使用混合方法克服了这一限制，该方法将神经网络与其他传统技术及 AI 技术相结合以解决问题。这种为了增强性能（特别是在多场景下）而对混合化的需求被视为一个通用的缺陷。\n\
  \n由于机械智能的增加以及对人类信息的妥当解释，开发基于 AI 的行效交通系统是极其困难的。AI 在交通行业中的应用仅限于特定的智能交通系统（ITS）功能，如数据处理和交通预测。如果有能够管理整个运营的\
  \ AI 程序将更高效。当 AI 技术依赖于通过传感器设备、检测器和控制器等传统方法获得的数据时，预测的准确性和及时性就会下降。\n\n利用 AI 发现位图算法（例如\
  \ GA 和 ACO）最优解决方案的能力。与 AI 栅格算法不同，这些技术除了数学计算外，还能提供问题基础结构和答案本质的真实知识。在标准数学方法不可行的困难优化情况下，由于这些算法提供的快速分析答案比没有解决方案要优。。由于其复杂性和持续的维护，构建智能技术是昂贵的，而且\
  \ AI 驱动的系统缺乏用户隐私和透明度，这只是其中的几个例子。\n\n我们将在下一节中查看一些 AI 计算复杂度限制。在基础算法场景中，数据数量随着操作数量的增加以恒速度增长。在复杂的算法设置中，操作和计算的数量表示为时间复杂度\
  \ `(X2)`、对数时间 `(2X)` 和指数时间 `(X!)`。算法复杂度表示为 `P` 问题或 `NP` 问题。为了处理不断增长的数据密度带来的复杂性，需要快速处理设备。为了解决这个问题，雇用了非确定性转向机，并使用多项式时间方法进行验证。\n\
  \n该概念是使用大量计算机同时对同一个问题提出所有可能的解决方案，并在多项式时间内得出最佳解决方案。NP 有两种类型：`NP-hard` 和 `NP-complete`。当尝试创建一个适用于所有输入的算法时，会出现\
  \ `NP-hard` 问题，而 `NP-complete` 问题在恒定时间内无法修复且在优化问题中难以近似。\n\n交通流、速度、占用率和乘客行为是这些属性的示例。初始数据集被分成若干小组，并分布在许多并行处理器上。结果是计算将需要更长时间才能完成。`map-reduce`\
  \ 方法可以在具有多核心或多个 CPU 的单机上使用。每个 `CPU` 或核心将处理海量数据集中的一部分，以生成最佳响应并加速 AI 学习算法。\n\n他们证明了在识别大型数据集中交通发生的异常时，这是一种用于适应的成功方法。这是通过将数据分成小组并单独分析每个集合进行并行处理来实现的。要找到公交到达时间，请使用\
  \ `map-reduce`。为了拆分公交的运行时长，他们利用了 `Clustering K-Mean`（K 均值聚类）方法。\n\n使用 `K-Mean` 方法可以将数据可能聚类为\
  \ `k` 组。它运行多次以识别多个合适的配置。深度学习被用于医疗行业的图像识别工作，以及 Facebook 的人脸识别功能，得出这一数字。`ML [17]`\
  \ AI 技术正在帮助汽车、银行和数据挖掘行业改进其运营。除了检测数据中的模式供未来研究外，深度学习的价值将大幅增加，到 2025 年将达到 102 亿美元。\n\
  \n他们讨论了从公司、经济和社会角度如何扩大 AI 在旅游和运输行业中的价值。AI 目前的深度学习神经网络（如 `Figure 9.8` 所示）可以比以前的技术提供更大的价值。在两个重要领域可以节省大量的成本：旅游和交通相关服务。AI\
  \ 技术可以用于为交通模式和交付业务的便利寻找最佳且最快的路线。\n\n![图 9.8 AI 辅助性能的益处。](img/fig9_8_C.jpg)\n\n图\
  \ 9.8 AI 辅助性能的益处\n\n一家欧洲公司能够通过分析来自道路传感器的数据识别实时卡车性能和驾驶员行为 `[20]`。这导致汽油成本降低了 15%，交付时间缩短了\
  \ 15 分钟。通过使用 AI 算法分析天气和交通拥堵，航空公司可以减少取消成本。\n\n交通拥堵的减少、为消费者提供的最优公共交通调度、自动驾驶汽车的用户安全以及空气质量的改善是额外的优点\
  \ `[18]`。旅游业价值平均从 62% 增长到 128%，而运输和物流增加了 89%。随着 `AVs`（自动驾驶车辆）变得越来越普遍，深度学习价值将上升。根据估计，如果到\
  \ 2030 年澳大利亚城市 30% 的车辆是自动驾驶的，那么拥堵成本将从 380 亿美元下降到 260 亿美元。在道路上部署 30% `AVs` 后，澳大利亚的交通拥堵成本正如\
  \ `Figure 9.9` 所示。\n\n![图 9.9 在道路上部署 30% 自动驾驶车辆后澳大利亚的交通拥堵成本。](img/fig9_9_C.jpg)\n\
  \n图 9.9 在道路上部署 30% 自动驾驶车辆后澳大利亚的交通拥堵成本\n\n## 9.7 在运输中使用 AI 的优点\n\n尽管 AI 的使用在不同之间存在差异，但\
  \ AI 与运输的完美融合是自然的。这些技术的采用可能整个行业产生巨大影响 `[17]`。AI 的增加将导致劳动力成本降低和利润提高，全自动车队解决了长工时和休息站的问题。AI\
  \ 还可能对道路事故和安全产生重大影响。夜间可能是一个危险的问题，但聪明的无人车辆可以很有帮助。自动驾驶汽车可以在避免事故的情况下让司机睡觉。AI 技术允许我们利用旅行信息和当前城市活动数据估计交通，并自动建议其他路线，使交通管理更高效。AI\
  \ 可能有利于复杂的基础设施和协作链的许多元素，例如最优旅行计划、减少等待时间、路线变化的实时交通检测等。数据分析还有助于改进物流运输系统和安全性。还有许多值得提到的优点，但由于\
  \ AI 仍在发展，优点将继续演变（`Figure 9.10`）。\n\n![图 9.10 使用 AI 的益处。](img/fig9_10_B.jpg)\n\n\
  图 9.10 使用 AI 的益处\n\n## 9.8 AI 在运输中的缺点\n\n\n\n\n尽管 AI 对每个领域都有许多优势，但也存在一些需要考虑的缺点，例如\
  \ AI 决策透明度的日益提高，或自动驾驶汽车的安全隐患。工作流的变化是缺点之一，因为它已成为卡车司机、出租车司机以及其他行业参与者的巨大关注点 [19]。尽管社会专家努力解释就业能力可以转移到其他行业，但冲突依然存在。所有的实施都可能产生副作用，因为发展中国家在实施此类解决方案时将面临困难，因为它们的基础设施无法提供维护。运输公司也面临潜在的\
  \ AI 劣势，如图图 9.11 所示，因为运输费用占了公司收入的达 10%。为了在行业中保持竞争力，所有现有企业将需要开发并实施 AI 技术，而制造、维修和维持此类复杂机器的巨额成本可能过于昂贵。向交通领域引入\
  \ AI 的公司 [21\\] 如果想赢得消费者的信任，必须认真对待 AI 的伦理问题。AI 技术在接近人类智力之前还有很长的路要走\n\n![图 9.11 AI\
  \ 在交通中的缺点。](img/fig9_11_B.jpg)\n\n图 9.11 AI 在交通中的缺点。\n\n## 9.9 结论\n\nAI 已经从一个未来的概念演变为我们日常生活的一部分，我们甚至在没有察觉的情况下在使用它。我们的移动应用程序、社交网络动态，以及\
  \ Grammarly 评估我们语法错误的方式都包含 AI。一段时间以来，运输部门已经采用了某些 AI 解决方案，但 AI 在交通和物流中更广泛的使用将指日可待。见证\
  \ AI 所创造的光明未来只是时间问题，它会随着时间的推移变得更加微妙。\n\n## 关键词\n\n## 参考文献\n\n1. Weinan, Z., Haiming,\
