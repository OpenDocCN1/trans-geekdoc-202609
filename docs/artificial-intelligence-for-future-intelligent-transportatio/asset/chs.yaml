  \n# 第 10 章 面向智能交通的 AI 技术\n\nS. ANBUKKARASI 和 C. R. DHIVYAA\n\n印度泰米尔纳德德邦，Kongu 工程学院，计算机科学与工程系助理教授\n\
  \n## 摘要\n\n智能交通系统（STS）是一个新兴的研究领域，引起了学术界和工业界的关注。它为终端用户提供各种服务，包括道路安全和事故预测、交通预测与控制以及车辆控制与监控。环境污染、交通拥堵和不可预测的拥堵增加了\
  \ STS 的复杂性。因此，未来的 STS 有能力为这些问题提供解决方案。它作为交通服务的一部分，为增强拥堵控制、CO2 排放控制、用户安全等铺平了道路。人口的增长和个人交通需求使得智能交通系统采用了各种人工智能（AI）技术。在本章中，我们主要关注用于未来智能交通管理系统的各种人工智能技术。第一节讨论了现有的基础交通系统及其问题。第二节讨论了处理智能交通的不同类型的\
  \ AI 技术。第三节讨论了用于未来智能交通服务的新兴 AI 技术。最后一节讨论了处理未来智能交通服务的一些新型 AI 技术。\n\n## 10.1 现有交通系统\n\
  \n将货物、人员或其他物品从一个地方运输到另一个地方的过程被称为运输。人口的增长使得交通问题变成了一个复杂的问题。在全球范围内，每天有数十亿人使用汽车进行运输。这些车辆的大量使用在高效管理交通方面产生了许多问题。在本节中，我们讨论了现有的交通系统以及我们因该系统而面临的问题。现有的交通系统和我们因该系统而面临的问题如下：\n\
  \n*   污染控制；\n*   交通管理系统；\n*   驾驶辅助系统；\n*   车辆控制。\n\n为了解决这些问题，智能交通系统（STS）应涉及许多技术，如实时数据、通信、AI\
  \ 和数据库管理。STS 的应用可以分为以下大类：\n\n*   事故预测；\n*   车辆控制；\n\nSTS 的功能分为图 10.1 所示。它从各种传感器收集实时数据。\n\
  \n![10.1 STS 的任务]\n\n### 10.1.1 交通预测与控制\n\n到目前为止，在交通领域已经进行了许多工作，以处理多个问题。遗传算法（GA）通过控制交通流量来调整信号灯计时。仿真结果表明，污染评估可以自动化\
  \ [20]。通过预测车辆在交叉路口停止的时间来实现交通控制 [8]。车辆与基础设施（V2I）通信有助于确定车辆到达交叉路口的时间。一种智能交通系统在文献 [11]\
  \ 中提出，并使用了射频识别（RFID）。RFID 标签放置在车辆上，可以被移除，并由 RFID 读取器统计特定时间内的车辆数量，从而网络拥堵。作者声称使用 RFID\
  \ 在交通控制中效果良好。智能交通监控方法的基本架构如图 10.2 所示，见文献 [4。\n\n![10.2 智能交通预测的设计模型]\n\n 另一种被称为专家系统（ES）的技术用于控制交通\
  \ [12]。改进的算法被称为基于规则的专家系统（B-RBES），用于根据不确定性处理交通信号。手工定义的规则用于做出控制交通信号的决策。这类基于规则的系统的主要缺点是预测需要配备大量的规则列表。\n\
  \n### 10.1.2 车辆控制\n\n车辆控制系统（VCS）从外部环境变量、车辆定位和传感器信息获取输入参数。它处理所有输入变量并控制车辆的刹车、转向和加速。VCS\
  \ 主要关注乘客和驾驶员舒适度、车辆安全以及燃料高效利用等。VCS 的通用结构见图 10.3。GA 被提出用于电动汽车充电 [13]。这项工作主要关注充电控制系统的效率。该系统是考虑到功率限制设计的。对于车辆监控系统，提出了一种系统提供精确的\
  \ GPS 信息 [18]。\n\n\n\n\n\n![图 10.3 车辆控制系统。](img/fig10_3_B.jpg)\n\n图 10.3 车辆控制系统\n\
  \n专家系统（ES）应用于车辆驾驶模拟器（VDS）中，用户可以通过升级名为知识库（KB）的数据库来感受驾驶体验。\n\n### 10.1.3 事故预测与道路安全\n\
  \n`STS` 的事故预测和道路安全系统涵盖以下标准：\n\n*   预防交通事故；\n*   分析事故原因；\n*   缓解事故原因，以提高车内驾驶员和乘客的生存率。\n\
  \n事故由多种原因引起，包括驾驶员疏忽、路况、其他驾驶员驾驶不等。为了避免此类严重事故，有必要从车载传感器收集输入值并处理这些值以缓解事故、预测事故等。\n\n\
  利用事故的外部因素，文献 `[24]` 预测了驾驶员和乘客的受伤程度。一种名为人工神经网络的机器学习（ML）技术被用于预测严重程度。文献 `[14]` 通过引入智能决策支持系统改进了灾害管理。该系统从各种传感器网络收集实时数据。它整合了交通、路网和气象等多种数据，通过实施智能模型和算法提供智能交通平台。当事故发生时，文献\
  \ `[17]` 使用多目标遗传算法（GAs）以最优方式分配现有资源。工作的主要目标是减少受伤严重程度。\n\n`STS` 用于事故预测和道路安全的通用工作流程如图图\
  \ 10.4\n\n图 10.4 用于事故预测和道路安全的交通系统\n\n了一种基于 Web 的专家系统被以减少行人与车辆之间的碰撞。以工具箱形式的模糊逻辑系统嵌入到\
  \ `MATLAB` 中，其中考虑了许多参数，包括人口密度、交通密度和车速。开发了基于 Web 的图形用户界面（GUI）来评估该系统。许多算法（如 `ES`、模糊系统）用于识别驾驶员的疲劳程度以预测事故。因此，系统会警示驾驶员并避免事故。\n\
  \n## 10.2 用于智能交通系统 (STS) 的各种 AI 技术\n\n全球范围内导致死亡的主要原因之一是交通事故。交通事故是公共健康问题的主要威胁，也给国家造成经济损失。道路事故的原因是人口增长、整个地区车辆数量增加，这增加了交通事故中的受伤人数。因此，技术进步对于通过避免可能的道路事故来提高道路安全至关重要。新兴技术之一是\
  \ `AI`，它已应用于提高工业和商业各种应用的性能。近期，需要 `AI` 技术来解决交通问题，如改善出行需求、环境退化、CO[2] 排放、安全措施，`AI`\
  \ 技术被用于增强智能交通系统（ITS）。有各种人工智能技术可以解决交通领域的问题和挑战，如安全管理、交通管理、移动性管理、事故预测和公共交通管理。多种 `AI`\
  \ 技术被应用于智能交通系统中，如图图 10.5 所示。\n\n![图 10.5 用于智能交通系统的基于 AI 的技术。](img/fig10_5_B.jpg)\n\
  \n图 10.5 用于智能交通系统的基于 AI 的技术\n\n### 10.2.1 人工神经网络\n\n网络包含神经元层，分为三层：输入层、输出层和隐藏层。输入层从用户处获取输入数据，隐藏层作为输入层和输出层之间的中间层，执行所有的数学计算，最后由输出层为给定的用户输入数据提供适当的结果。在智能交通系统中，`ANN`\
  \ 模型用于分类拥堵程度、预测城市区域交通流量、检测事故、检测车辆位置、估计道路车辆速度等。它通过分析道路交通的拥堵程度，为公共 `ITS` 的交通信号规划、调度和开发提供了更好的解决方案。\n\
  \n`ANN` 模型由数据采集、转换和信息处理单元组成。在数据采集单元中，通过传感器捕获道路上的车辆数量和速度来收集所有交通数据。收集到的数据被聚合并发送到远程数据分析。使用从不同领域收集的交通原始数据计算车辆平均速度和道路密度。最后，信息处理单元将处理后的交通数据发送到\
  \ `ANN` 模型中，以预测道路交通的拥堵程度。图 10.6 描述了智能交通系统的基础人工神经网络模型。\n\n![图 10.6 用于智能交通系统的 ANN\
  \ 模型。](img/fig10_6_B.jpg)\n\n图 10.6 用于智能交通系统的 ANN 模型\n\n### 10.2.2 模糊逻辑\n\n模糊逻辑是一种人工智能方法，它像人类决策一样做出判断，并基于“如果-那么（If-Then）”规则提供中间可能值。在智能交通系统中，模糊逻辑\
  \ `[19]` 适用于解决交通预测、交通控制、寻找替代路线和捕捉驾驶行为等交通问题。模糊逻辑的基本如图图 10.7\n\n图 10.7 模糊逻辑的基本模型\n\
  \n\n\n\n\n-   准备种群的初始值。每个染色体包含多个基因；\n-   评估种群中每个染色体的适应度函数；\n-   交叉操作负责在染色体的基因之间交换信息，并产生新的后代；\n\
  -   变异用于维持代与代之间的遗传多样性，同时也产生新信息；\n-   通过计算交叉和变异过程计算新一代的适应度函数；\n-   在其他染色体中选择最好的染色体并传递到下一代；\n\
  -   重复该过程直到满足条件。\n\n`GA` 能够有效地产生解决智能交通系统问题的近似解。\n\n### 10.2.4 专家系统 (Ess)\n\n在人工智能中，`ES`\
  \ 是一种根据预定义知识模拟人类专家决策能力的程序。它利用知识程序通过利用人类知识进行分析来解决复杂问题。这是一种基于规则的方法。`ES` [6] 是车辆维护、途中外部车辆控制、车辆调度和交通信号控制的关键技术。`ES`\
  \ 的基本架构如图图 10.9 所示。\n\n![图 10.9 专家系统的基本模型。](img/fig10_9_B.jpg)\n\n图 10.9 专家系统的基本模型。\n\
  \n`ES` 由下面列出的几个组件组成：\n\n1. **推理引擎 (Inference Engine)：** 它执行知识的实际推理过程，通过结合从 `KB`\
  \ 和用户获得的信息来解决问题。它是 `ES` 的核心。\n2. **知识库 (Knowledge Base (KB)):** 它是通过获取模块从专家那里收集的领域特定知识的库。它由规则、事实和其他知识组成，利用人工智能概念提供解决问题的解决方案。\n\
  3. **知识库获取模块 (Knowledge Base Acquisition Module)：** 它为知识数据库提供知识。专家可以在 `ES` 中输入和编辑规则集（知识）。它从人类专家那里收集智能信息并将其存储在\
  \ `KB` 中。\n4. **解释模块 (Explanation Module)：** 它解释推理过程，为客户提供解决方案和其他信息。它还帮助专家找到系统的推理能力，以实现目标。\n\
  5. **客户端界面 (Client Interface)：** 用户可以通过客户端界面访问系统。它充当中介工具，提供用户与系统之间的连接。\n\n### 10.2.5\
  \ 群体智能系统 (Swarm Intelligence System)\n\n这是一种人工智能系统，由在环境中相互进行局部交互的智能体组成。蚁群优化算法 (ACO)\
  \ [10] 和蜂群优化算法 (BCO) [9] 是群智能系统的例子。`ACO` 是一种人工智能算法，包含一组人工蚂，根据蚂的觅食行为为给定问题识别最优解。`BCO`\
  \ 也是一种根据蜜蜂行为为问题寻找良好解决方案的人智能技术。`ACO` 和 `BCO` 是交通控制系统的合适模型，可以最小时间延迟、平均等待时间和拥堵。\n\n\
  ### 10.2.6 智能系统中使用的 AI 技术\n\n不同的人工智能技术已用于 `ITS` 的安全和预测。10.10、10.11 和 10.12 展示了交通控制的实现。\n\
