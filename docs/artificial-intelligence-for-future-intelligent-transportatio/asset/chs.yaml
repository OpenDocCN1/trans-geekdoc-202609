  \n\n\n### 4.3.1 海污染\n\n在各种由于多种因素导致的运输事故中，油泄漏是环境产生巨大影响的主要因素。例如油轮、油产品以及海上平台。海洋生命运输过程中的油泄漏也是一种污染形式。这影响了海洋物种、海中植物以及海洋动物。\n\
  \n### 4.3.2 压载水污染\n\n船舶使用大量的压载水在没有货物运输时保持稳定。货船在装载货物时是稳定的，空货船在卸下货物后使用压载水来平衡重量并保持稳定。海洋运输是一个不断增长的行业，预计未来几年将快速增长。船舶每年排放\
  \ 3-5 吨压载水。排放的水受到压载舱内油和其他杂质的污染。\n\n\n\n\n\n空气污染由多种来源引起，海洋运输也是导致空气污染的因素之一。世界卫生组织（WHO）表示，空气污染每年导致约\
  \ 420 万死亡。大多数船只由内燃机驱动，在运行过程中排放有害气体。这些气体进入空气中，导致生物体产生各种健康问题。与道路车辆类似，船舶上使用的柴油发动机和其他油机通过船舶的排气管排放不理想的有毒空气。排放物的主要成分是\
  \ `GHG`（`CO[2]`）。尽管是小型客轮，但货轮、散货船和油轮也向环境贡献了大量的毒气排放 [12]]。\n\n## 4.3.4 噪声污染\n噪声污染也由船舶引起。船舶使用响亮的汽笛来告知其他航行船舶的存在，并与港口进行通信。柴油发动机和其他油机也会产生噪声。即使是船舶上使用的发电机也会产生噪声。其设计使得声音可以传播很远。这影响了利用声波进行通信的海洋生物，也影响了飞往海外其他利用声波进行导航的鸟类。\n\
  \n## 4.3.5 污水污染\n大型邮轮可以容纳超过 7,000 名乘客，并长时间旅行。它们每周还向海洋倾倒数百万吨废水。洗涤船舶的污垢、淋浴水和含有毒物质的洗衣水是污水的来源之一，这被称为\
  \ `灰水`。邮轮还会排放来自电池的有害化学物质、清洁日常用品的化学物质以及过期药物的化学物质。这对海洋生物体构成了巨大威胁。来自厕所的人类排物也由邮轮排入大海。这种形式的废物处理被分类为\
  \ `黑水`。这影响了海洋生态系统。从船发动机泄漏出的高浓度油性水也污染了海水。\n\n## 4.3.6 固体废物污染\n塑料袋、钢罐、包装垃圾、玻璃等固体废物在航行期间被丢入海中。它们漂浮在海面上或作为海洋垃圾沉积在海中。如果在航行期间发生任何事故，船舶在中海触毁，船上的材料将作为固体废物沉积在海中。船只破碎也是海洋污染的一种。鲸鱼和海豚等海洋动物受到沉积在海中固体废物的影响。\n\
  \n## 4.3.7 对海洋的物理破坏\n高速行驶的邮轮会对海洋物种造成破坏和伤害。巨鲸撞击巨大的船舶会导致海洋损害。锡罐和罐罐被丢入海中，沉积在珊瑚礁上方并将其破坏。船舶的锚泊和船事故也会干扰珊瑚礁的生长。\n\
  \n## 4.4 航空业对环境的影响\n由于乘客需求和航空货运的增加，航空业正在不断扩张。电子商务领域的巨头提供的当日达送服务通过空运成为可能。空运是人类迄今为止发明的的最快的运输系统。航空运输可以在一天内将货物从国家的一端运送到另一端。如果使用其他交通工具（公路或船运），则需要更长时间。\n\
  \n航空是运输行业中最难去碳的部门。航空业已采取许多行动使航空业走向绿色。目前正在进行许多研究，使用生物燃料作为飞机燃料，并已在某些航空公司实施。大多数航空公司正在使用\
  \ `Biofuel blends`（生物燃料与喷气燃料的混合物），并已应用于`维珍航空`、`美国航空`和`澳洲航空`等许多商业飞机上。无论如何，只有部分飞机在使用生物燃料。由于行业规模和巨额投资，实施需要时间，并且需要政府的支持才能在航空公司中实施。这间接导致了票价上涨。商业飞机的\
  \ `CO[2]` 排放量增加了 32%。由于航空业的增长比预期快，`CO[2]` 排放将在几年内增加三倍。2019 年有约 50 亿乘客乘坐飞机。\n\n英国、德国、美国、日本和中国是世界上\
  \ `CO[2]` 排放最多的前五个国家。飞机行业的大玩家已经开始制造燃油效率高的飞机，以减少 `CO[2]` 的排放。与普通喷气燃料相比，生产生物燃料的成本很高，这为生物燃料的实施带来了障碍。生物燃料是一个解决方案，还有许多有趣且高效的解决方案。氢动力电动飞机使用氢气驱动电动机。氢动力飞机只向环境排放水蒸。另一个新兴解决方案是使用\
  \ `Lithium-Ion batteries`（锂离子电池）驱动飞机电机的电动飞机。但由于电池重量燃料燃料，限制了飞机的续航能力。\n\n未来的飞机技术如超音速飞机，其燃油量将是传统飞机的\
  \ 5 到 7 倍以上，属于超污染技术。航空业也影响气候变化。除了 `CO[2]`，飞机还排放氧化亚氮、水蒸气、烟尘、硫酸、微颗粒，这些因素导致了气候变化、臭氧形成、甲烷减少、阳光遮挡、凝迹云形成以及冰卷云的产生。\n\
  \n航空业引起了两种主要污染，将在后续小节中讨论。\n\n### 4.4.1 空气污染\n空气通过飞机发动机的进气口进入，然后进入燃烧室燃烧燃料。在燃烧过程中，它会排放一些毒气，如\
  \ `CO[2]`、`氮氧化物`、`NO[2]` 和硫。这些气体通过飞机发动机出口排放到环境中，污染了空气。飞机起飞时，发动机在高效率运行，污染了机场周围地区的空气。这里的主要问题是飞机在高空排放\
  \ `CO[2]` 和其他毒气，会对气候变化产生更大、更直接的影响。航空业的加速增长导致每年向环境排放 12 亿吨 `CO[2]`，如果情况持续且不采取行动，这一数字将增加三倍。\n\
  \n### 4.4.2 噪声污染\n\n\n\n\n飞机发动机内部有较大的叶片以较高的每分钟转数（RPM）旋转，这产生了噪音。在飞机的压缩腔内，空气被压缩并以高压和高速释放，产生大量的噪音。这会扰扰访问机场附近的人，并导致一些严重的健康问题，如睡眠问题、心理和心脏问题。这完全是机场运营者的责任。为了减少飞行期间的噪音，已经采取了许多措施。实施了许多夜间飞行限制和飞行路径限制。每个机场都应该具备监测声音并遵守限制的机制。对位于市内的某些机场设定了噪声限制，这些机场将受到严格监控。任何超出限制的操作都会被机场当局识别，运营者将受到严厉处罚。由于航空流量的增加，控制和监控导致噪音污染的活动变得困难。\n\
  \n## 4.5 人工智能 (AI)\n\n技术的进步比以往任何时候都快，被广泛采纳的时间也更短。人工智能（AI）是新兴技术之一，在各个领域都产生了巨大影响。`ML`、计算机视觉、`Algorithms`、大数据和\
  \ `AI` 不仅仅是词汇，更是未来。人们认为 AI 正在取代人类，但它增强了人类。存在一个人类无法到达或可以解释为人类无法做到的局限性。\n\nAI 突破了所有限制，它具有超越限制的力量。\n\
  \nAI 使用计算机视觉来感知环境，并使用 `ML` 创建可能行的模式。AI 结合 `ML` 和计算机视觉，可以应用于多个领域的许多场景，这将使“不可能”变为可能。AI\
  \ 还用于检测和减少环境污染，这在运输领域也尤为常用。交通部门对环境贡献了超过 30% 的 `GHGs` 排放。如果这种情况持续且找不到减少该比例的补偿措施，将对人类和环境造成严重影响。\n\
  \nAI 正在各个领域发展，即使在运输领域，汽油和柴油汽车正在被电动汽车取代。汽车现在可以在现实环境中没有人类帮助的情况下自动驾驶，这是通过使用 `AI`、`ML`、计算机视觉、神经网络等实现的，这些技术现在正被用于减少各种形式交通带来的污染。这项技术在传感器和物联网（IoT）的帮助下对环境进行完全监控，然后将其转换为模型并引入\
  \ `ML` 中，这可以提高预测报告的质量，当它与 `AI` 结合时，就可以提前准确预测特定环境的状况 [18]。根据这些预测数据，可以提前采取行动规避风险。\n\
  \n除了收集传感器数据、卫星数据、交通数据和其他特定参数外，AI 结合物理化学模型被用于融合来自不同源的数据并与过去的数据进行比较和结合。这将提前预测未来的环境。智能机器可以设计为以人类智能执行任务。通过对机器和模仿人类行为，在机器中模拟人类的智能。\n\
  \n### 4.5.1 人工智能 (AI) 的优势\n\n现在可以使用 `AI` 监测实时数据，当被利用时，可以为警察人员提供可操作的信息，他们可以预测并震慑非法活动。这提高了乘客的安全。同样，监控来自自动驾驶车辆\
  \ (`AVs`) 的实时数据允许进行及时干预，以避免碰撞并确保乘客安全。通过提供替代路线和估计交通信号灯等待时间，收集行人和车辆数据的智能道路有助于减少交通拥堵并缓解事故。\n\
  \n下班后，很多人发现驾驶很有挑战。在这种情况下，`AVs` 可以为疲惫的司机提供休息站，让他们可以在车里小睡，而不会危及自己或道路上的任何其他人。同样，由 `AI`\
  \ 驱动的 `AVs` 对于发现夜间驾驶困难的人很有用。`AI` 还有助于检测和逮捕违规司机，例如酒驾或开车时发短信的人，使道路对所有人更安全 [10]。\n\n\
  ### 4.5.2 交通污染中的人工智能 (Ai)\n\n通过专门的技术和算法，`AI` 正在解决各种交通问题。空气质量指数 (`AQI`) 是污染的有效方法。为了保护公民，政府收集数据对汽车实施限制。每年有数百万人因呼吸大量有毒空气而死亡，另一些人则遭受严重的健康问题。`ML`\
  \ 技术在许多领域引发了革命，通过其分类和回归方法对空气质量进行分类和预测。\n\n## 4.6 空气质量指数 (Aqi)\n\n了解我们呼吸的空气质量对每一个人来说都是重要的。它也有助于人们和政府做出各种决策。人们可以通过\
  \ `AQI` 的测量结果了解当前的空气质量状况。它像例行一样为我们提供空气质量报告。空气污染正成为德里等大都市的新闻，空气质量每刻都在变化 [1]。当人们呼吸污染的空气时，会导致各种严重的健康问题，甚至导致死亡。这时\
  \ `AQI` 就派场了，人们可以通过一些移动应用程序和网站即时检查他们呼吸的空气质量。\n\n`AQI` 是根据特定时间间隔的两种主要污染物资源浓度来衡量的\
  \ [8]。政府通过 `AQI` 向人们通报空气污染的现状。如果 `AQI` 增加，对公共健康的威胁也会随之增加。`AQIs` 根据污染物的排放随国家而异（见图\
  \ 4.4](#ch4.xhtml#fig4_4)）。\n\n| 空气质量 | AQI 值 |\n| --- | --- |\n| 安全 | 0–50 |\n\
  | --- | |\n| 平均 | 51–100 |\n| 健康不安全 | 101–150 |\n| 对健康人士不安全 | 151–200 |\n| 高度危险\
  \ | 201+ |\n\n空气质量是大气中的主要属性。在某些技术中，确定空气质量是一个昂贵的过程，发展中国家负担不起寻找空气质量的成本。`AQI` 通过更具成本效益和资源效率\
  \ `ML` 技术进行测量 [10]。空气中的颗粒物浓度通过 `ML` 技术进行预测和分类。多种回归模型具有不同且独特的特征来预测空气质量。预测值应该是准确的，以便采取适当措施。\n\
  \n### 4.6.1 线性回归\n\n\n\n两个连续变量之间的交互可以通过线性回归进行审查和修正。这使得能够通过线性方法对标量因变量与解释变量之间的关系建模\
  \ `[7]`。简单线性回归有一个描述性不一致值；当有多个一个值时，我们就有了多元线性回归。线性回归数据集必须在带有 `x` 和 `y` 轴的图中绘制。基于最小二乘法构建拟合线或回归线。一旦构建了拟合线，就会通过最小化垂直距离的过程来减少误差（图\
  \ 4.5）。\n\n![图 4.5 线性回归的工作过程](img/fig4_5_B.jpg)\n\n图 4.5 线性回归的工作过程\n\n### 4.6.2\
  \ 支持向量回归\n\n支持向量机（`SVM`）是一种解决分类和回归问题的监督学习方法。支持向量回归使用了与 `SVM` 相同的特征。支持向量机主要解决分类问题，但仍为回归问题识别稳健且可靠的值\
  \ `[6]`。\n\n支持向量回归为给定的类别构建具有两个决策边界的超平面。超平面通过分析类别并提供解决问题的最佳位置来构建，其定位完全取决于极值点和向量。空气质量的输出将是一个连续数值变量，此类问题可以使用回归分析高效解决。非线性可分数据作为输入寻找\
  \ `AQI`，这些数据必须使用核技巧转换为高维线性可分数据 `[4]`。支持向量回归的目标是最小化 `AQI` 预测中的误差（图 4.6）。\n\n![图 4.6\
  \ 支持向量回归的工作过程](img/fig4_6_B.jpg)\n\n图 4.6 支持向量回归的工作过程\n\n### 4.6.3 随机森林回归\n\n随机森林算法是自助法（bagging）的自助聚合（bootstrap\
  \ aggregation）。bagging 方法通过样本数据集创建多个基模型，并从这些基模型中得出结论。每个基模型在给定的样本数据上进行训练。自助聚合意味着在每个基模型中单独训练数据集，最后通过使用投票分类器方法结合每个基模型的结果来聚合结果。\n\
  \n随机森林回归收集空气质量数据集作为输入数据，并将数据视为 `m` 行 `n` 列。基学习器模型设计用于构建决策树来执行预测过程。每个决策树提供一个样本数据集，样本数据集按行并以带放回的方式抽取\
  \ `[19]`。决策树以带放回的行采样和特征采样作为输入并行训练。单个决策树使用输入的数据集将空气质量预测为最终输出。决策树的预测必须通过分析每个决策树的所有决策来聚合（图\
  \ 4.7）。\n\n![图 4.7 随机森林回归的工作过程](img/fig4_7_B.jpg)\n\n图 4.7 随机森林回归的工作过程\n\n### 4.6.4\
  \ Adaboost 回归器\n\nAdaBoost 算法顾如其名，它提高了机器学习技术的准确性，因此它被称为机器学习集成学习（`EL`）算法。弱学生通过权重获得帮助，并要求它们在开发最终模型时投票。`AdaBoost\
  \ Regressor` 类用于解决空气质量预测的回归问题 `[6]`。`AdaBoost Regressor` 从拟合回归器到数据集开始，然后根据错误率调整权重。\n\
  \nBoosting 根据分类器在预测随机输入案例时的准确性为其分配权重，并逐一训练基模型。结果是更准确的分类器对最终响应的贡献更大。通常根据所有分类器预测该实例的平均难度为每个输入对象分配权重。权重越高，估计实例真实值就越困难，因此该对象更有可能成为下次迭代的训练子集（图\
  \ 4.8）。\n\n![图 4.8 AdaBoost 回归的工作过程](img/fig4_8_B.jpg)\n\n图 4.8 AdaBoost 回归的工作过程\n\
  \n### 4.6.5 岭回归\n\n岭回归是一种模型调优技术，用于分析具有多共线性的数据。通过这种方法实现了 `L2` 正则化。在存在多共线性问题时，最小二乘法是无偏的，方差很高，期望值远离实际值（图\
  \ 4.9）。\n\n![图 4.9 岭回归的工作过程](img/fig4_9_B.jpg)\n\n图 4.9 岭回归的工作过程\n\n## 4.7 基于 AI\
  \ 的交通监控系统\n\n技术每天变得越来越智能。这导致为社会许多问题找到了实用的解决方案，交通部门消耗了 69% 的燃料，但它们没有被有效消耗。在信号灯前空闲的车辆对环境贡献了\
  \ `CO[2]` 而没有任何益处。每年由于交通怠速浪费约 600 亿加仑燃料 `[5]`。世界上正在进行许多研究，以设计一种能够减少信号灯和高峰时期等待时间的交通系统。这是通过结合和使用\
  \ `AI` 和 `ML` 实现的。一些技术人员使用某些技术来检测受影响严重的交通区域并向人们指示，同时也建议替代路线。车辆跟踪 AI 系统由研究人员在某些国家测试，准确率达到\
  \ 95% `[9]`。\n\n### 4.7.1 智能交通监控和管理的基于 AI 的解决方案\n\n许多城市正在使用预定的信号方案，但它有许多缺点。它没有考虑当前的交通流量，并按照之前的定义运行。但通过使用智能交通控制系统将分析实时交通并相应引导信号。以下是一些智能交通管理系统\
  \ `[11]`：\n\n\n\n\n*   人工智能驱动的智能通信与交通监控系统。\n*   交通标志、智能高速公路、公共交通、智能停车和地理空间交通引导系统是构成智能交通管理系统的技术元素。\n\
  *   通过提供用户友好界面来自动化传统票务系统的应用程序。\n*   如 `GPS` 等车辆跟踪系统，用于追踪通勤者的位置。\n*   分析安装在车辆、道路和高速公路上的传感器数据，并在发生任何交通违规时通知车主。\n\
  *   用于定位特定位置空闲停车位的移动应用程序。\n*   结合 `GPS` 和传感器的人工智能用于识别前往目的地流量最少且距离最短的路线。\n*   结合\
  \ `LIDAR`、`AI` 和 `ML` 技术来检测车辆周围的障碍，从而避免许多事故。\n*   3D 可视化、`RTK` 和地理数据可用于特定位置的情况，使用户户更准确地了解状况。\n\
  *   可以使用视觉传感器和 `GIS` 确定交通队队长度，并引导后续车辆选择不同的路线。\n\n### 4.7.1.1 卷积神经网络 (`Cnn`)\n\n\
  实施了许多高效技术以提高旅行质量，并减少各种运输因素造成的环境污染。所有交通灯都配备了摄像头，但它们仅用于手动监控交通。而 `CNN` 的实施将有助于监控和检测过程自动化。卷积神经网络\
  \ (`CNN`) 是一种高精度的算法，它使用视频数据对对象进行分类，可用于道路交通分类。与其他分类算法相比，`CNN` 最小化了预处理。在训练 `CNN` 之后进行评估。评估过程后的训练模型现在已可以使用，它可以处理流媒体视频并将其转换为帧，然后显示交通评级（图\
  \ 4.10）。\n\n![Figure 4.10 卷积神经网络的工作过程。](img/fig4_10_B.jpg)\n\n图 4.10 卷积神经网络的工作过程。\n\
  \n`CNN` 由具有可学习权重和偏的神经元组成。视频是帧或图像的组合，每张图像是像素的组合，每个像素 `RGB` 图像包含某些被称为 `tensors` 的值，这些值用作神经网络的输入\
  \ [13]。`CNN` 由多个层组成，由支持层隔开。每层由神经元组成，并连接到上一层的神经元，连接一直持续到层的末尾。分类由输出层完成，并给出一个 0 到 10\
  \ 的评分。池化层是充当滤波器的分离层，它修改每帧的分辨率以及输出。实时视频流取自交通摄像头并被转换为帧，使用 `CNN` 分析图像中的每个像素，移除背景并仅分离出车辆，处理后它给出一个\
  \ 0–10 之间的评分作为输出，这是使用该技术对不同车道的交通水平进行的分类。通过这种技术，可以识别每个车道的交通水平，并相应相应地引导信号以减少拥堵，并减少在交通中闲置的车辆造成的污染。\n\
  \n### 4.7.1.2 人工神经网络\n\n使用了多种技术和方法来管理交通。在智能方法中，人工智能是高效方法之一。`ANN` 结合 `IoT`、`ML` 为交通拥堵问题提供了完全可靠的解决方案。还涉及一些传感器和无线网络。交通密度和车辆平均速度是考虑的主要参数。使用这些数据，人工神经网络对每个车道的交通水平进行分类。\n\
  \n整个过程分为三个主要部分：\n\n*   数据收集；\n*   数据传输；\n*   以及数据处理。\n\n在此过程中，在第三部分实施了 `ANN` 以确定每个拥堵的状态。`ANN`\
  \ 有助于智能处理数据 [14]。人工神经网络 (`ANNs`) 由通过权重连接的多个神经元组成。输入层、输出层和隐藏层是神经网络的三个主要层。车辆速度和交通密度等交通数据作为输入输入输入层，该层不任何处理。它将值作为数值传输到隐藏层（在这种情况下由\
  \ 5 个神经元组成），然后将值作为数值传输到输出层。显示输出 [12]。\n\n\n\n\n\n4. Leong, W., Kelani, R., & Ahmad,\
