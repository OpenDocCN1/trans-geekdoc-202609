  \ Analysis & Prevention, *38*(3), 434–444。\n\n# 第 11 章 基于人工智能的绿色交通：一种可持续方法\n\nKABEER\
  \ TIJJANI SALEH^(⁸)\n\n## 摘要\n\n当前城市社会的特征是，由于城市化活动、工业化和交通运输的增加，每天都遭受污染。为了获得清洁、健康、可持续且无污染的城市环境，本章讨论了绿色建筑、绿色交通或更说是可持续交通的概念。绿色交通揭示了我们环境中现有交通模式产生可再生能源的能力，这种能源是清洁、安全的且对居民没有害影响的。这种绿色交通旨在通过人工智能（AI）的支持，在城市交通、城市气候、社会生活方式和整体环境管理方面实现可持续。人工智能是绿色交通的组成部分之一，因为它指的是人类智能在机器中的再创造和应用，这些机器经过编程，并能够以更简单、快速、可持续且对城市环境产生极小或无害的方式执行任务。在本章中，讨论了此类智能在绿色交通中的应用、人工智能在绿色交通中的作用以及相关的挑战。同时，还介绍了了土耳其伊斯坦布尔大都会案例研究。\n\
  \n## 11.1 引言\n\n很久以前，社会通过利用交通系统来分享他们的思想、文化并将其产品商业化。因此，事实证明了，交通与我们的日常基本活动密不可分。也许，这是我们古代文化的一部分。目前世界上大多数发达城市依赖于综合交通系统。而发展中，城市增长迅速，它们无法避免各种阻碍其可持续性并给居民带来困难的各种挑战。这些挑战包括空气和水污染、土壤退化以及对健康和财务的影响，这些影响已知源于对可用化石能源的过度使用，大多数传统交通正在利用这种能源\
  \ [1]。\n\n城市环境面临着与污染相关的持续问题，使其暴露在不同的挑战之中[2] 最近进行的一项研究提出，在全球范围内，城市环境空气污染中细颗粒物（PM2.5）的\
  \ 25% 是由于交通运输活动中化石燃料的燃烧造成的。在这种情况下，应该清楚地理解，道路运输对我们城市和城镇的城市环境污染占了很大比例。在大多数情况下，空气污染会导致严重问题，如一氧化碳（CO）过度增加、全球变暖、臭氧层耗尽等。\n\
  \n由于目前城市化活动的增加，《世界城市化展望》[3] 一份报告指出，世界上 54% 的人口居住在城市地区，这一数字预计到 2050 年将增加 66%。城市化进程的普遍增长是可以预测的，全球人口将在\
  \ 2025 年达到 80 亿，并在 2040 年达到 90 亿。因此，这种普遍增长的显然被认为发生在城市地区，而总农村人口预计到 2035 年将保持在约 33\
  \ 亿不变，然后在 2050 年略微下降至 32 亿。因此，未来所有的人口增长都是城市人口增长 [4]。这些发展与汽车拥有量的增加有关。目前，世界上有 12 亿辆工作车辆（轻型车、摩托车、货运车和公共交通工具）。正如\
  \ [5] 报告所示，这些估计到 2050 年将达到 31 亿。明确迹象表明，上述预测中较大比例将来自欠发达和发展中国家，因为发达城市正在尝试多样化并鼓励绿色交通任务，并控制其人口。\n\
  \n根据《世界能源展望》[6]，交通通过排放二氧化碳气体的贡献高达全球总量的的 30%。此外，[7] 声称，交通活动是仅于能源部门温室气体（GHG）排放的第二大来源，贡献了整个欧洲温室气体排放总量的\
  \ 25%。这一数字正以惊人的速度增长，如果不加控制可能会对剩余的生态系统造成破坏性损害。尽管有这些证明的统计数据表明交通活动如何通过利用相当规模化石燃料形式的世界能源来污染环境，但交通部门在能源消耗方面变得越来越大、越来越快。遗憾的是，决策者对减轻这种能源消耗的技术手段的关注较少。这是由于缺乏可靠且替代的非化石能源来源（煤、水、天然气、核能、太阳能和风能以外来源），由于超过\
  \ 90% 的交通活动依赖化石能源，这已成为一个问题 [8]。\n\n绿色交通的想法鼓励人们取代目前的交通工具，其中大多数工具完全依赖化石燃料作为能源来源。这些化石燃料产生大量的有毒气体（二氧化碳、CO、氮氧化物和其他部分燃烧的重碳烃\
  \ (HCs)），其中这些有毒气体的 23% 是交通部门贡献的 [9]。Roberts & Patterson [10] 发现，生物燃料是传统交通燃料的较好替代品，但在采用时会有副作用，因为它对粮食安全构成了主要威胁。因此，这些生物燃料在不久的未来可能无法很好地发挥作用。\n\
  \n\n\n\n全球每个地区的一个共同目标是提供适度能耗、高效、环保且可靠的交通系统 [11]。开发将人工智能（`AI`）与通用交通活动（包括设计、分析、建设、运营或维护）相结合的想法，可能是当前飞速发展的数字世界所需要的关键点。因此，为了拥有一致且持续的经济、社会和无污染环境，深入理解\
  \ `AI` 如何实施以影响更绿色的交通是本世纪的先决条件。然而，为了对该概念有更广泛的理解，需要明确绿色交通的概念及其与整体可持续性及环境的关系。\n\n可持续性是一个开发系统的过程，使其能够满足当前的社会需求，而不损害这些系统交付的结果所预期的未来基本需求\
  \ [12]。上述定义可能是可持续性最可靠且最接受的定义，因为它涵盖了可见和虚拟的差异，例如社会的社会、经济、环境、文化设定、信仰和伦理 [13]。尽管有人认为它涵盖了极其广泛的生存范围，仅仅复杂难以遵循。尽管如此，它至少捕捉了可持续发展的三个三重底线要素\
  \ [14]。然而，考虑到可持续性对社会的社会、经济和环境的影响，通过这一定义可以准确表明，如果没有对交通活动进行恰当和周密的考虑，可持续性将是不完整的。\n\n\
  正如 [15] 定义的绿色环境是自然环境与部分人工或经修改的自然环境的结合，通过设计、控制和管理，提供类似于自然生态系统提供的无中断服务，例如灾害风险管理、水质和空气污染缓解、气候变化控制。此外，它还包括其他独特特征，如陆地、海洋区域等。这种结合的主要目标是为居民提供并促进更优质的环境，作为防止生物多样性退化的屏障，并帮助生态系统提供社会、经济和环境效益。绿色城市或可持续城市的设计旨在具有标准、更安全、可靠且无污染的环境，并具有事故发生率极低的额外优势。毫无疑问，可持续交通是绿色城市发展的先决条件，因为它对世界上任何发达城市都起着至关重要的作用。因此，将可持续交通恰当地整合到形成绿色城市的其他部门是必要的。这种协同方法需要通过公私合作伙伴关系进行整体性的理解。\n\
  \n此外，绿色交通可能有一个更清晰、更好的理解，它是另一个与可持续交通互替使用的术语，指的是所有对环境污染排放负面影响较小、保持最佳燃料消耗、并在居民与环境之间保持良好平衡的交通系统。它还包括根据城市总体规划预测的、良好且无约束的城市未来，这些规划涵盖了经济可行性、社会公平性以及与长期未来计划一致的环境效益方面的实践和政策，且不留下任何交通缺口\
  \ [16]。绿色/可持续交通系统通常强调社会规划、现代技术和政治。\n\n\n\n\n除了大多数发达国家记录的交通活动对城市快速发展所做出的贡献外，这些活动对与城市发展相关的其他挑战也产生了巨大影响。这些挑战包括相对较高的交通增长、人口密集地区交通扰民的增加、转化后的化石燃料过度排放有毒气体到环境中，这反过来导致了空气污染，在增加通勤者旅行时间的同时，增加了能源消耗和持续性的环境恶化。其中，这些是可持续交通旨在解决的少数挑战。上述挑战的解决方案可以通过采取适当且连贯的环境评估、乐观且具韧性的基础设施融资，并通过鼓励使用其他替代交通工具来减少\
  \ `CO2` 的产生来付诸实践[23]。\n\n毫无疑问，交通系统在本质上是社会技术的，因此考虑到其包含的许多具有变异性的因素，处理这种非自主、复杂且多样化的系统仅仅是困难的[24]。因此，一些地区已经开始让当地社区对根据其初始目的误用这些系统的后果产生适当的防意识[25]。因此，绿色交通的正确实施不仅有助于降低碳排放并提供环保的交通手段，还有助于提高空气质量水平和减少能源消耗来促进健康。\n\
  \n值得注意的是，全球每年有数百万人因交通事故丧生，其中大部分是由汽车造成的。根据 2007 年的这一数据，中国已通过提供以公共交通为导向的开发（TOD）建立并实施了果断的决策，该方案通过吸引社区向旨在实现高质量生活的公共交通倾拢，阻碍了在城市地区持续将汽车作为最常用出行工具的做法[26]。该方案对实现绿色交通发展的预期目标产生了巨大影响。因此，鼓励采用可持续交通将从局部减少此类危害的发生率并达到最低水平。\n\
  \n作为温气体排放的第二大贡献者，交通对环境产生了负面影响[27]。通过可能的缓解措施（如采用一贯的可持续措施）将交通与 `CO2` 解耦是必要的[28]。当然，考虑到可持续发展的其他参数，实施绿色交通以减少有毒气体排放水平的速度相对较慢[29]。无论在实现生活质量、人人的基本自由、人人都能受到的教育、粮食安全、良好医疗和其他社会能力等大多数可持续目标方面做出了哪些努力，尽管可持续交通是国家发展的关键驱动力之一，但它获得的决策者的关注很少。因此，需要对可持续交通实施特殊且独立的关注。这是因为人类流动和发展是两个不可分割的现象，而且如果不控制在一定范围内，过度流动将成为对发展的破坏[30]。\n\
  \n关于[31]的参与者对可持续发展组成部分的争论，得出结论认为应该特别关注交通和流动性，因为它们正在启动并作为可持续发展的中心系统。它们还连接了城乡地区，提高了生产力水平并提供了经济和社会进步。因此，在那次历史性的会议上，大家同意在治理的每个上上采用新的政策制定体系，以遵循会议关于可持续交通的建议[32]。\n\
  \n## 11.4 传统交通系统的局限性\n\n所有的尝试都是为了保护和改善环境，免受交通负面影响。这些影响被[33]分为三类：\n\n1. **直接影响：**\
  \ 这些是可以容易被看到、注意到并理解的主要影响，例如噪音和 `CO2` 排放。\n2. **间接影响：** 这些影响的后果不太可能被轻易理解，它们可能与呼吸系统问题和其他心血管疾病有直接联系，此类影响大多由于内燃机气体燃烧不完全而导致。\n\
  3. **累积或三次影响：** 这些对气候变化、全球变暖和其他自然后果（如二氧化碳排放）产生直接影响。\n\n从更广泛的来说，以下是传统交通系统的一些挑战：\n\
  \n1. **降低环境空气质量：** 自正式交通系统存在一个多世纪以来，车辆释放的有毒气体严重影响了人类健康和自然建筑环境。呼吸系统疾病正在增加，如哮喘、支气管炎、心脏发作等，被认为与交通排放的气体有关，[34]的流行病学报告了这一点，这些呼吸系统疾病每年导致超过五十万死亡。[35]的报告还称，全球因空气污染疾病死亡人数约\
  \ 200 万。除了上述影响外，过度使用化石燃料作为能源导致了自然资源的枯竭、全球变暖和环境恶化。\n2. **噪音和震动：** 人类神经系统的部分受到过度噪音的密集影响。在车辆运行声音、喇叭和其他车辆相关声音噪音和震动引起的问题包括疼痛和听力疲劳、睡眠扰乱、心血管影响、免疫系统损害等。它还影响了青少年的速度和稳定吸收[36]。\n\
  3. **事故发生：** 据估计全球每年有超过 120 万人死于事故，造成 5000 万人受伤。这些估算大部分来自欠发达和发展中国家[37]。预计到 2030\
  \ 年，交通事故将成为第五大死因[38]。\n4. **全球气候变化：** 正如之前提到的，释放到大气中的化石燃料二氧化碳中超过四分之一来源于车辆。2009 年，交通占全球化石燃料源二氧化碳排放的\
  \ 23%，而能源部门占这些排放的 41%[39]。然而，到 2035 年，预计交通将成为最大的温室气体排放源，占全球温室气体的 46%[40]。\n5. **破坏自然建筑环境：**\
  \ 道路和其他相关交通系统的建设与自然建筑环境的枯竭有关。\n\n\n\n\n\n## 6. 交通拥堵\n道路用者日常活动的延迟是不可避免的。根据[41]的估计，截至\
  \ 2010 年，美国因交通拥堵损失了约 1010 亿美元，这主要是由于延迟期间的燃料浪费和乘客花费的时间造成的。此外，曼谷主要干道的拥堵导致泰国的 GDP 萎缩了约\
  \ 6% \\[42\\]。根据[43]开展的研究，中国城市交通拥堵造成的损失约占其 GDP 的 2%。\n\n## 7. 化石能源安全\n特定国家持续使用汽基燃料可能导致其自然资源的枯竭，从长远来看，这可能会使国家陷入能源不安全状态。而对于依赖进口燃料相关产品的国家，可能会面临价格上涨的威胁，并不可避免地对其国库产生影响和短缺。\n\
  \n## 11.5 可能的解决方案\n为了遏制上述挑战，许多发达城市引入了技术跨越式发展，即通过一系列鼓励使用替代交通工具的计划来实现可持续交通，这包括电动汽车、提高商业公交的使用以替代普通私家车（私家车旨在高油耗成本、高维护成本并加剧环境污染）。此外，[44\\\
  ]声称，一个城市要实施绿色交通理念，必须遵循一系列不可跳过的活动，这些是：基础准入阶段（提供当地/接入道路）、非公共交通主导阶段（公共交通的可用性）、早期机化阶段（提供交通工具）、完全机化阶段（提供公共和私家交通工具）、生活质量阶段（整合且高效的公共交通系统）。然而，[45\\\
  ]指出，自 1992 年里约地球峰会以来，《议程 21》将可持续交通视为包容性内容，许多城市如荷兰阿姆斯特丹、哥伦比亚波哥大老化、澳大利亚布里斯班、丹麦哥本哈根、巴西库里蒂巴、中国广州、美国波特兰和韩国首尔都已接纳并实施了这一理念。\n\
  \n### 11.5.1 电动汽车 (EVs)\n近期最具挑战性且被接受的事实是，世界石油储量将继续下降，而由于上述因素，其消耗率将相对上升。因此，为了避免严重依赖石油生产的交通部门出现必要的中断，必须实施其他创新技术，以替代对石油作为能源来源的过度依赖。这可以通过引入和采用建议的绿色交通方案（如电动汽车和混合动力汽车）来实现，正如[46]所示。这些车辆（电动汽车、混合动力汽车、插电式混合动力汽车）能够减少由传统车辆造成的负面影响\
  \ \\[21\\]。尽管`EVs`的理念从诞生以来面临着许多挑战。\n\n为了通过替代手段（如大规模部署公共交通、自行车、步行）降低传统交通工具的使用水平，也有必要重塑当前的公共交通系统，以吸引公众关注，并缩小通勤者与私家车主之间的竞争差距。\n\
  \n![图 11.2 电动汽车的典型充电过程。来源：采用自 48。](img/fig11_2.jpg)\n\n\n\n\n城市道路策略可以按照拟议的策略实施：它们包括快速公交（BRT）非正规公共交通升级、城市轨道交通（包括街道有电车、地面轻轨交通（LRT）、高架轻轨交通（ELRT）、地铁），以及对票务系统进行合理考虑（可以通过在线预订完成），并致力于推广智能票务的使用，以允许乘客在不同出行模式之间无缝切换\
  \ [50]。另一种吸引公众关注低能耗交通方式的方法是，政府必须准备好通过提高服务水平、提供适当的停车设施以及为通勤者提供负担得起的票价来改进公共交通系统。为公共交通提供整合路线网络，从舒适性、安全性、便利性方面对车站进行重组，优化税收系统，并在市场等主要拥挤场所提供枢纽以便货物和服务的简单装卸，并将这些路线和枢纽与货运路线、接驳服务以及其他相关的大众交通系统（如连接到城市发展所需的机场、海港和火运枢纽）相起来\
  \ [51]。\n\n### 11.5.5 智慧城市建设\n\n虽然整个可持续交通系统是智慧城市议程的一部分，但尽管如此，智慧城市的快速演进将共同为良好的绿色交通系统提供保障。\n\
  \n### 11.5.6 环保城市方案\n\n世界上大多数发达城市都面临着移动源和固定源大量有毒气体排放的威胁。因此，减少这种危害的先进手段是鼓励环保创新。这包括提供自行车道、快速公交系统（BRT）、智能交通系统、城市货运管理以及化石燃料与非化石燃料车辆的混合。\n\
  \n### 11.5.7 绿色出行意识与倡导\n\n尽管政府提供了支持，但世界上大多数城市已经实施的积极绿色交通缺乏公众参与。因此，需要通过采用功能性宣传计划来积极推广绿色出行，这些计划可以在学校、当地社区、倡导团体、环保组织、交通参与者以及专门针对绿色交通的志愿组织的支持下实施。这些计划应通过采取灵活的行政、经济和技术手段获得政府的全支持，并使系统与引导和更新的科学研究进一步整合。这种倡导可以与非政府组织（NGO）的迅速倡议以及与所有相关机构的合作相结合\
  \ [52]。\n\n### 11.5.8 长期韧性系统的提供\n\n大多数已开发模型中存在的问题是在初始实施短段时间后缺乏韧性。长期可持续机制的合理设计将有助于绿色交通成为公共文化。这可以通过采用智能交通系统、综合道路网络、无障碍移动、节能节约和环境保护政策来实现\
  \ [18]。此外，良好规划的以交通为导向的规划和分区、制定有利于土地利用的可靠政策、开发土地带和城市边界将有助于该方案的长久发展。\n\n### 11.5.9\
  \ 远程移动（Tele-Mobility）\n\n使用实施绿色交通的新范式来避免或减少不必要的旅行是另一种方法，即通过采用 TOD（交通导向开发）利用信息技术替代某些可管理的活动。这专注于采用用于远程移动的复杂组件，包括远程办公、远程工作、远程会议、远程购物和远程医疗。从更广泛的范围内，远程移动是人工智能的组成部分，它抑制了过度的旅行需求\
  \ [53]。\n\n### 11.5.10 气候修复\n\n可持续交通系统对改善更清洁的环境贡献巨大。最近，大多数国家通过公私合作伙伴关系对该领域给予了关注，这现在已成为经济和社会发展的必然趋势。\n\
  \n全球变暖远非个人或社区的问题，而是世界性的问题。尽管它可以根据法律和区域文化背景划分为不同层次。这些倡议中全球经济倡议（GFEI） [54]。其最近的报告之一声称，二氧化将在未来几十年内减少一半，同时可以节省超过\
  \ 500 万桶石油。GFEI 是由联合国环境规划署 [55]、国际交通论坛和汽车基金会合作形成的。\n\n1. **移动模型伙伴关系 (The Mobility\
  \ Model Partnership)**：俗称为 MoMo，该模型的开发是为了建立一个区域性的世界交通数据库，模型包含交通模式、燃料消耗、地区、该地区之前的运输记录作为输入变量，并根据这些参数的定量分析，对未来十年交通活动消耗的能量提供预测。\n\
  \n2. **电动汽车（EVs）倡议 (The Electric Vehicles Initiative)**：虽然很久以前由不同国家通过公私合作伙伴关系发起，但由于缺乏支持的环境，它在一些国家经历了挫折。\n\
  \n3. **可持续低碳运输伙伴关系 (Sustainable and Low Carbon Transport Partnership)**：发展中国家实施最可持续交通政策的缺点已被记录和经历。由于这个问题，建立了该伙伴关系，作为这些国家宣传和知识共享的媒介。该伙伴关系包括\
  \ 50 多个组织，其中包括联合国、非政府组织、研究机构、开发银行和私人机构。\n\n4. **城市可持续性框架 (Urban Sustainability Framework)**：最初由\
  \ [56] 开发，作为战略性的交通规划措施，专注于根据可持续性的三重底线（经济可行性、社会公平性和环境可维持性）评估绿色交通绩效，使用家庭、市场接入点、土地利用和当地道路作为参数输入衡量来监控绿色交通轨迹。\n\
  \n## 11.6 实施绿色交通对社会经济的影响\n\n\n\n\n\n考虑到经济效益，绿色交通由于其借鉴了自然属性，极大地节约并降低了建设和维护成本。例如，从路面流出的雨水径通常会污染水体，给居民带来健康和财务困扰。用绿色交通系统直接替代这些传统道路以及公路的其他结构部分，有助于大幅降低此类成本。此外，正如[57]\\\
  ]所述，发现如果将渗透路面替换为传统路面，可以减少近 25%的成本。尽管在采取适当维护的情况下，标准透水铺的使用寿命可能长达 25 工作年。\n\n绿色交通需要考虑的另一个重要点是通过创建旅游景点来复兴社会经济部门。相关的设计和施工方法，如频繁使用透水路面（反过来减少了管理成本和环境污染），并在景观中维持生态建设，并大幅减少了交通拥堵。此外，整个运输系统和其他基础设施容易受到极端天气条件以及不可见的自然灾害（如洪水、滑坡）的破坏，这些灾害每年都会造成人员伤和数百万美元的损失。减少此类破坏性现象的建议解决方案之一是提供绿色桥梁和生态隧道[58]]。沿路集成的绿色护堤也作为高效的隔音屏，通过过滤雨水流帮助减少污染。\n\
  \n此外，绿色建设通过将植被排水、多孔材料、渗透性铺路整合到街道或停车场中[59]]。因此，将绿色交通整合到可持续环境中将有助于减少碳足迹，中和其对土地、水域和其他环境内特征造成的影响。绿色交通的提供也有助于提高对灾害的韧性（见图\
  \ 11.3 和 11.4）。）。\n\n![图 11.3 透水路面。来源：采用自[60]。](images/fig11_3_B.jpg)\n\n图 11.3\
  \ 透水路面。 *来源：*采用自[60]]。\n\n![图 11.4 绿色桥梁和生态隧道。来源：采用自[60]。](images/fig11_4_B.jpg)\n\
  \n图 11.4 绿色桥梁和生态隧道。 *来源：*采用自[60]]。\n\n## 11.7 引入和实施更绿色物流概念\n\n在总结传统交通挑战的解决方案之前，引入绿色物流概念至关重要，因为它对经济具有功能性影响并有助于友好环境的发展。大多数物流活动所依赖的货运运输对污染环境贡献巨大，通过耗尽化石燃料资源对保护自然资源造成损害[61]]。绿色物流涵盖了配送、能源消耗、制造、生产和原材料开采[62]]。因此，将智能运输系统与其重叠，将通过提供安全、低能耗且负担得起的系统来改善物流过程的整个活动。\n\
  \n## 11.8 人工智能（Ai）在绿色/可持续运输中的作用\n\n不可避免的是，需要将绿色交通与`AI`结合，因为 21 世纪前二十年里 `AI` 在许多领域的快速增长再次证实了这一点。`AI`\
  \ 在可持续运输中的唯一目标是避免人工或人为维护。\n\n\n\n\n\n## 2. 智能换电站的缺失\n绿色车辆与充电站是不可分割的整体，在设计系统时，应当考虑充电站的丰富程度和充电速度。在大多数情况下，电动和混合动力车辆受此影响很大。此类充电站的设置应基于用户的偏好，以便于吸引公众进入系统。\n\
  \n## 3. 能量储能\n电动和混合动力车辆的动力源都是电池，这些电池具有一些局限性。它们重量重、价格昂贵、充电周期长，且具有天然毒性（因为含有重元素，如果处理不当会污染环境）。缺乏对电池过充电和欠充电的检测控制系统也是挑战之一。\n\
  \n## 4. 不安全的步行道设施\n尽管非机动交通（NMT）（步行和自行车）对低收入者有优势，但这种方式的安全性较低，且在便利性上缺乏吸引力。由于与附近机动道路产生的极端噪音和空气污染之间的屏障较少，暴露在危险的高速交通中，缺乏适当且设计良好的过路设施，某些路段不安全甚至导致了抢劫等犯罪行为。\n\
  \n## 5. 资金及其他政治支持\n资金缺乏是绿色交通进程面临的另一个挑战。因此，如何提供必要的必需资金（事实证明与采用的传统方法相比，资金较短缺）以及实际实施将是所有负责绿色交通适配的决策者的首要考虑问题。\n\
  \n## 11.10 基于人工智能的可持续交通（土耳其伊斯坦布尔大都市案例研究）\n\n### 11.10.1 案例研究框架\n为了实现本研究的目标，建立了一份包含\
  \ 307 份回复的问卷样本，用于评估和衡量市民参与绿色交通系统使用的情况，以及他们在使环境变得更安全方面所重视的价值。本研究选择了土耳其伊斯坦布尔作为主要案例研究对象，以获取研究所需的答案和信息。回复和结果经过分析，并以图片的形式呈现，代表受访者在不同领域的意见。\n\
  \n问卷包含两个主要部分——第一部分调查了受访者的人口统计、社会和经济特征。这样做是为了评估受访者的社会和人口统计价值水平，将其作为评估他们对可持续交通系统需求的基本指标。第二部分询问并审查了受访者对“绿色交通”术语的理解、受访者的生活质量以及绿色交通设施对受访者的接触程度，这些指标可以提供关于使用绿色形式交通系统重要性的信息。\n\
  \n### 11.10.2 第二部分：社会经济背景（可持续发展的三重底线）（图 11.5, 图 11.6, 图 11.7, 图 11.8, 图 11.9 以及\
  \ 图 11.10）\n\n![图 11.5 受访者的性别。](img/fig11_5_B.jpg)\n图 11.5 受访者的性别。\n\n![图 11.6 受访者的年龄。](img/fig11_6_B.jpg)\n\
  图 11.6 受访者的年龄。\n\n![图 11.7 受访者的私有车拥有情况。](img/fig11_7_B.jpg)\n图 11.7 受访者的私有车拥有情况。\n\
  \n![图 11.8 受访者的就业状态。](img/fig11_8_B.jpg)\n图 11.8 受访者的就业状态。\n\n![图 11.9 受访者的婚姻状况。](img/fig11_9_B.jpg)\n\
  图 11.9 受访者的婚姻状况。\n\n![图 11.10 受访者的教育水平。](img/fig11_10_B.jpg)\n图 11.10 受访者的教育水平。\n\
  \n### 11.10.3 第三部分：适配人工智能（Ai）的绿色交通的适用性\n根据记录的数据和进行的分析可以得出结论：大多数现有交通模式在使用气体、石油、煤炭等化石燃料来驱动发动机运行。但当考虑基于人工智能的绿色交通系统时，它是实现人类日常活动损害最小的可持续绿色环境的关键因素之一。这种智能交通系统（STS）使环境免受由于人类活动可能引起的任何未来损害，并与自然友好。使用绿色交通系统的重要性从受访者对使用这些绿色形式交通的意见中可以看出。例如，使用不需要燃烧燃料的电动汽车将使环境免受汽车尾气过度排放到大气中的影响，减少污染水平（图\
  \ 11.11, 图 11.12, 图 11.13, 图 11.14, 图 11.15, 图 11.16, 图 11.17, 图 11.18, 图 11.19\
  \ 以及 图 11.20）。\n\n![图 11.11 受访者。](img/fig11_11_B.jpg)\n图 11.11 受访者。\n\n![图 11.12\
  \ 受访者。](img/fig11_12_B.jpg)\n图 11.12 受访者。\n\n![图 11.13 受访者对人工智能应用的认知。](img/fig11_13_B.jpg)\n\
  图 11.13 受访者对人工智能应用的认知。\n\n![图 11.14 受访者对缓解污染的认知。](img/fig11_14_B.jpg)\n图 11.14 受访者对缓解污染的认知。\n\
  \n![图 11.15 传统交通模式造成的污染感知。](img/fig11_15_B.jpg)\n图 11.15 传统交通模式造成的污染感知。\n\n![图 11.16\
  \ 受访者常用的交通模式。](img/fig11_16_B.jpg)\n图 11.16 受访者常用的交通模式。\n\n![图 11.17 受访者利用的绿色系统。](img/fig11_17_B.jpg)\n\
  图 11.17 受访者利用的绿色系统。\n\n![图 11.18 受访者使用绿色交通的情况。](img/fig11_18_B.jpg)\n图 11.18 受访者使用绿色交通的情况。\n\
  \n![图 11.19 受访者使用绿色车辆的状况。](img/fig11_19_B.jpg)\n图 11.19 受访者使用绿色车辆的状况。\n\n![图 11.20\
  \ 受访者对实施绿色交通的感知。](img/fig11_20_B.jpg)\n\n\n\n\n\n图 11.20 受者对绿色交通实施的感知\n\n城市地区的人使用自行车而不是驾驶私车上班、上学或前往市场既能提高人们的健康状况，也能改善环境。使用绿色火车取代煤炭列车，在步行范围内到达学校、杂货店或市场，也能改善人们及其环境的健康。总而言，这些绿色交通系统的使用对可持续环境具有巨大影响，它们能创造一个无污染的城市环境，改善人们的健康状况，并通过使用成本更低的绿色设施等手段促进经济和个人资源。\n\
  \n## 11.11 结论\n\n城市地区的人应致力于发展可持续交通体系。这将使他们能够在经济、社会和环境领域实现适当的增长水平。因为绿色交通倡导减少私家机动汽车、增加步行、自行车和公共交通的使用，以及使用清洁能源和车辆。它还是一种低成本、无污染、节省土地资源和空间的交通系统，适用于各种旅行者。\n\
  \n缺乏妥善实施是实现可持续交通目标的最具挑战性的任务，这些挑战受限于区域、文化，在大多数情况下受政治原因的阻碍。因此，更好地了解导致这些退的因素非常重要，可以通过对相关社区进行公众咨询、监管现行的交通政策、定价和管理以适应目标可持续性需求，以及考虑相关社区的文化背景来实现。这些拟定的实施措施可能需要时间和资源，而这反过来将避免导致系统整体崩溃的不合理延迟。政治支持对于将可持续交通理念落实到所需的理想水平可能至关重要，而有效且持续的执法是实施过程中不可或缺的一部分。尽管有时执法执行会被发现存在问题，在执行遇到困难时，可以使用修改法规、收费等手段来使执行得以落实\
