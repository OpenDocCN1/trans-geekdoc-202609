  \ IoT 网络的 ITS 中的 AI 功能。对安全、交通管理、停车管理、电子收费、自动费用收缴等方面的关注，正以更好的方式提升城市及其路侧交通设施。速度警报系统、紧急车辆通知、司机疲劳检测等是确保各方面公共安全的辅助系统。作为一个示例，实施并测试了一种使用眼动频率传感器作为体载传感器的模型，用以智能地检测驾驶员的疲劳。此外，通过传感器的输出，使用如\
  \ `CNN` 算法的 AI 技术来准确分类并判断驾驶员的状态。这有助于根据决策采取进一步行动来警报驾驶员。这一实施确保了乘客的安全并防止了事故发生。\n\n\
  ## 2.1 引言\n\n得益于智能技术及其各种进步，整个世界正在发生变革。实时场景反映在交通、医疗系统、基础设施、无障碍环境等智能城市项目的实施中，在所有领域中，交通管理系统在开发智能城市方面发挥着重要作用。根据国土、基础设施和交通部的规定，政府政策在桥梁建设方面经历了更具包容性的增长，以智能方式实现交通，这直接支持国家的经济增长和全球化。从另一个角度看，这反映在交通部门的就业机会，如汽车、出租车、面包车和巴士司机、乘务、铁路工人、道路施工工人、主管、公共交通检查员、电车操作员、物流师、交通主管、交通经理、交通规划师、旅行协调员、旅游等。在发展中国家，人们为了日常工作、购物和许多社会原因出行，需要高水平的流动性。通常，交通分为两类：私有和公共。从一个地点到另一个地点到达目的地，乘客会选择自行车、汽车、摩托车、巴士、火车等交通工具。由于交通对经济增长的依赖，可达的城市由于巨大的流量将显示出更高的交通成本，这限制了社会福利，并体现在空气污染和使用大量土地出行方面。抢劫、扒窃、大规模杀戮（恐怖主义影响的一部分）等待解决的问题共同威胁着旅行中的人们，为了应对这些情况并提高安全水平，建议使用智能交通系统（STS）。约\
  \ 60% 的人口住在城市中，到 2040 年将增加到 65%。城市中约 130 万人驾驶车辆并在路边区域漫游，在无线网络无线电技术和传感器的支持下，带来了许多智能城市项目及其实施。由于道路交通事故，总人口正在缩短，这反映了国家\
  \ GDP 3% 的成本。必须考虑管理自然环境并减少事故。需要一个现实的解决方案。其中一种性的解决方案是智能交通系统。\n\n## 2.2 概述\n\n海量操作的快速计算在日常生活中至关重要。今天的通信技术已证明了交通在安全和智能移动方面的智能化。道路事故正在减少，并即使在交通拥堵区域也提供了一种智能的移动方式\
  \ [2]`。由于智能交通系统和交通管理，车辆移动像水流一样。运营和管理交通系统的安全和保障是一项巨大挑战，但在车辆数量快速增长的世界仍然是可以实现的。通过管理道路交通和由于收费站，停车系统对于在紧急情况下报告时避免高速行驶非常有用。如果道路上四轮车和两轮车数量爆炸式增长，则必须关注交通系统的结构及其效率。如果发生这种情况，车辆的移动速度将从\
  \ 15% 增加到 20%，并且存在燃料消耗的可能性。这进一步降低了死亡率。道路碰撞导致的严重伤害主要是由于手机的使用、未戴头盔、超速等。根据全球状况报告，道路安全基于道路基础设施和交通管理系统。\n\
  \n### 2.2.1 ITS 实施的近期研究\n\n1. 想乘坐公交的乘客可以获得所有公共公交信息，如发车时间、当前位置、座位可用性等信息。这位于属于苏格兰的格拉斯哥市。\n\
  2. 最近的一种设计中，将根据可用用户的手机位置确定夜间巴士服务的路线，并根据需求水平提供服务。该方案已由首尔政府发布。\n3. 基于新奥尔良市紧急呼叫模式的救救护车位置优化。\n\
  4. 无人驾驶汽车进入街道，由悉尼地铁自主规划并进行，到达目的地。\n\n### 2.2.2 ITS 的应用\n\n人口的增长和道路上车辆的使用导致了速度变慢、行程时间延长和车辆排队增加。总体而言，车辆的大幅增加导致严重的交通拥堵。在城市地区，主要的道路设施是任何交通模式发生碰撞的原因。ITS\
  \ 是一个支持增强质量并以控制的方式结果的平台。智能交通系统（ITS）的一些应用包括高效停车障碍管理、电子收费、紧急车辆通知系统、动态交通灯序列、碰撞回避系统、速度警报和交通管理。物联网（IoT）等信息通信技术通过传感器获取、处理和传输实时数据，为高效交通管理铺平了道路。此外，它有助于农村和城市地区的自动停车位识别，并优化公共交通的使用。\n\
  \n#### 2.2.2.1 交通控制与管理\n智能交通系统最重要的应用是交通控制和管理。交通拥堵有很多原因。施工区域、特殊场合、天气状况等交通事件是影响人们时间的主要因素。\n\
  \n\n\n交通管理的关键环节提升了特定城市的质量。因此，基础基础设施问题通过规划和实施得以解决。`IoT` 的成功及其交通控制机器设计完全取决于 `Sensors`\
  \ 和云平台。通过 `IoT` 设备可以对收集的数据进行检查、采集和挖掘。Mohammed 等人 [5] 提出了一种基于 `IoT` 的系统模型，该模型可以观测实时交通场景。系统架构由四层组成，即感知层、网络层、服务层和应用层。感知层由传感器和许多活动设备组成，用于感知车辆数据，安装的基于\
  \ `wi-fi` 的微控制器将数据转发到服务层。开源 `IoT` 平台用于通过存储和管理过程连接通信的设备。设备系统安装在道路交叉口，那里设有消息显示单元，以便向终端用户即时传达交通信息。异常的道路状况也会被通知，并提供道路清理或替代路线的建议。\n\
  \n#### 2.2.2.2 紧急车辆通知\n\n一种用于通知紧急车辆交通场景的方法是在道路上安装了多个路警报单元 [6]。从救护车等紧急车辆发射单元发出的信号由道路上的探测单元接收，该单元将接收到的信号与接近阈值进行比较，如果超过阈值，则通过灯闪通知非紧急车辆。因此，这使得其他车辆知道道路上有紧急车辆。灯光向紧急车辆方向闪烁。通信通过将警报信号传输到道路上的下一个警报单元和中继单元继续进行。这种通过信号传播获得的车辆优先信息有助于降低死亡率。通过这种技术给驾驶员提供的警觉有助于清理道路，并在紧急情况下营救堵在交通中的生命。道路上配备的灯光和警报器通过提醒非紧急车辆帮助车辆及时导航。另一种方法是\
  \ `e-call`，将车辆的自动位置和方位通知到欧洲国家的紧急救援中心。这是通过发生事故时激活的气囊传感器等车载传感器实现的。设有一个按钮，可以让车内人员使用\
  \ `112` 手动拨打电话。在通话期间，使用卫星识别被困位置。通过这些数据，救援队将到达被困位置营救车内人员。事实证明芬兰使用这种方法使死亡率降低了 4–8%。\n\
  \n#### 2.2.2.3 高效停车管理系统\n\n根据调查报告，30% 的交通是因为驾驶员和机动者寻找停车位花费的时间导致的。大多数人认为这是城市中处理车辆时最令人沮丧且耗时的活动。通过智能停车系统的帮助，这可以变得自动化且简单，该系统显然属于智能交通系统类别\
  \ [4]。传感器和摄像头是实时收集数据以测量停车占用率及其状态的主要仪器。人工智能（`AI`）功能用于分析各种数据，如未来车辆流量的频率、高峰期流量、车辆类型等。高级导航服务、行车位置知识、交通场景等服务及其数据更新，导致了可以通过\
  \ `AI` 实现的简化功能。基于 `AI` 的系统之一是 `ALPR`（自动车牌识别）[9]，它利用 `360°` 摄像头和光学字符识别模式检测车辆车牌号，然后自动为该车辆释放停车空间，而无需人工干预。它是用户友好的，并应用于车载软件中，整合了车辆位置、停留时间以及所有其他细节信息。这些车辆停车的详细数据有助于在车辆被盗时找到车辆。此方法的主要优势是消除了通勤者的不便、加强安全执法、通过避免寻找空位时的不必要时间浪费减少油耗，并支持停车运营商为驶入车辆提供高效空间。人类辅助结合机器智能提供了高效的停车管理系统。未来停车管理的重点是，当用户靠近目的地时使用基于\
  \ `AI` 的机器人进行车辆停车。尽管技术在不断扩展，这已被证明是限制停车经理、停车巡逻和停车用户运营成本及人类工作量的有效解决方案。\n\n`IoT` 设备和多种传感器有助于云端位置信息的更新。如\
  \ `Raspberry Pi`、`Arduino` 等 `IoT` 设备用于基于摄像头的 `IoT` 系统进行停车占用检测。交通监控通过多种算法以在线方式进行云数据处理，将数据传输到服务器数据库，以便进行路边和路外的停车分配。为了快速计算，使用了磁性、超声波、红外和线圈传感器等多个传感器来检测多个停车位。使用基于\
  \ `IoT` 的系统高效判断停车占用状态。\n\n### 2.2.2.3.1 停车管理\n\n利用道路上的各种传感器，通过无线通信向车辆告知实时情况，以最大限地减少交通。通过这种方式，利用传感器网络通信也可以预先获停车场的情况\
  \ [4]。\n\n#### 2.2.2.4 电子收费系统\n\n电子收费系统是手动收费的最快替代方案 [3]；当车辆通过收费公路、收费桥梁或收费隧道时，它会自动收取通行费。在传统的收费方法中，驾驶员需要停下来，并用现金或卡手动支付通行费。电子收费按顺序执行各种自动化任务：车辆检测、车辆分类、交易处理和违规执法。自动车辆检测系统识别通过过收费站的车辆。一旦检测到车辆，车辆分类系统会识别车辆类别（如轿车、公交车、卡车等），然后交易处理系统执行支付程序。如果交易成功，则允许车辆通过收费站。此外，如果缴费存在违规，违规执法系统将检测车辆的车牌。\n\
  \n### 2.2.2.4.1 高速公路交通管理系统\n\n使用车辆检测传感器 `CCTV` 收集各种信息，计算并记录周围移动的车辆数量。通过被称为“快速通行系统”的快速现金转账，收费站交通管理正在加速\
  \ [3]。因此，它有助于减少收费站的等待时间。\n\n#### 2.2.2.5 公交信息系统\n\n\n\n\n它收集公交的位置信息，并通过信息管理系统进行处理。站在公交站的人可以通过该系统查看关于公交、路线和到达时间的集中化信息，这显然减轻了赶公交的紧张感，并带给个人一种满足感\
  \ [1]。这是在韩国实施的一种系统。\n\n#### 2.2.2.6 自动售费系统\n\n一种卡片设计用于整合所有公共交通工具，如火车、出租车、公交等，并包含其信息\
  \ [[11]]。售费过程通过该卡片的帮助自动完成，让乘客对支付过程感到愉快和满意。\n\n#### 2.2.2.7 速度告警系统\n\n如今，由于车辆数量增加和超速，道路交通事故日益增加。每年有近\
  \ 125 万人死于道路交通事故 [8]；但通过控制车辆速度可以避免这种情况。当车辆速度超过预设限制时，速度告警系统会向乘客和司机发出警报。车辆的速度和 `GPS`\
  \ 坐标被频繁计算，并可以从交通控制室轻松监控 [7]。如果速度达到异常限制，则会向司机发出蜂鸣报警以恢复到正常速度。当速度未控制在指定范围内时，车辆的速度、`GPS`\
  \ 位置、车牌号、颜色等车辆信息将通过短信（SMS）发送给交通执法。\n\n#### 2.2.2.8 温度监控\n\n对于携带大量货物的控温货物，有必要进行温度监控。携带肉类、食品和药物的容器现在必须保持在特定的温度。在某些情况下，客户在产品交付时需要温度历史记录。这种控制通过在工业前更新温度偏差，避免了完全取决于温度的货物腐烂。`EN\
  \ 12830:1999` 记录仪定义了温度监控的标准。\n\n温度监控装置由两个传感器组成：一个用于监测进气温度，另一个用于监测回气温度。进气侧重于向货物添加什么温度，而回气侧重于在温度波动的情况下能维持多少温度。冷链运输通过告警系统得到了良好监管。运输产品中设置的最小最大阈值有助于识别可疑的温度偏差，并立即通知监控单元，以避免损坏和处罚。追踪货物温度的关键组件包括：温度传感器、冷却单元中的记录仪，以及用于从传感器读取数值的车载计算机。除了向网页办公室更新温度外，它还可以通过手机上的驱动程序界面应用程序直接更新给司机。通过这种高效的物联网温度监控系统的帮助，敏感货物是否得到了保护呢\
  \ [12]。\n\n## 2.3 物联网在交通领域的角色\n\n智能交通系统（STS）正以更强的方式与物联网集成，而物联网为智能交通领域出现的问题提供了解决方案和新方向。在关键情况下，物联网使\
  \ STS 能够找到更优化、更安全的旅行路线。交通部门的大部分收入依赖于这种智能交通。适应物联网的 STS 有助于交通监控、交通控制、智能停车、自动收费等。所有这些应用都使用了各种传感器，并为交通监视和监控铺平了道路。在考虑传感器时，需要讨论两个主要因素：准确性和可靠性。准确性通过被重复计数的车辆数量以及漏计的车辆数量来衡量，可靠性则涉及稳定的平均车辆计数。传感器正被部署在道路上、车内以及司机的身上。\n\
  \n### 2.3.1 道路传感器\n\n道路传感器被部署在路面上，它捕捉交通流信息并有助于旅行路线预测。它具有高的车辆检测准确率，并且使用了有效的容错机制 [13]。如果任何传感器在工作期间失效，为了管理这种情况，在道路上部署了“备用传感器”。有多种道路传感器，如气动路面传感器、感应线圈探测器、磁传感器、压电传感器、雷达传感器、红外传感器、超声传感器和路面状况传感器。道路传感器的作用如：(i)\
  \ 气动路面传感器用于跟踪和计数数量；(ii) 感应线圈探测器用于吸收车辆的存在及其移动；(iii) 磁传感器用于识别停止和行驶车辆的状态；(iv) 压电传感器用于车辆分类并测量车辆的速度和重量；(v)\
  \ 雷达传感器帮助测量车辆的体积、速度及其运动方向；(vi) 传感器用于检测人行道上的行人；(vii) 超声传感器通过感知附近的车辆来检测交通拥堵；(viii)\
  \ 路面状况传感器感知道路建设的强度。此外，道路传感器也有安装成本高以及在维修、维护、安装等期间交通中断的缺点。\n\n#### 2.3.1.1 气动路面传感器\n\
  \n气动路面传感器在车辆传感技术中非常流行，是因为其便携性，它可以以简单的方式跟踪并计算道路上的车辆数量。它安装在路面下方 [14]。在交通繁忙的情况下，这有助于感知和计算车辆数量、车辆速度、移动方向、车辆间距等。路管由合成聚合物材料或天然橡胶制成。合成聚合物材料更坚固，适用于所有环境，而天然橡胶仅用于寒冷气候。气动路面传感器在\
  \ 15C 到 60°C 的温度范围内运行，处理 3 到 8 barg 之间的压力。气动路管以两种形式使用：\n\n1.  **单路气动路管**：计算通过橡胶管的车辆数量以及车辆之间的间距。\n\
  2.  **双路气动路管组合**：寻找交通方向和车辆行驶速度。\n\n在图 2.1 中，单路气动路管放置在路面上，收集车辆信息。\n\n![图 2.1 单路气动路管](img/fig2_1_B.jpg)\n\
  \n图 2.1 单路气动路管\n\n\n\n将充气橡胶管横跨在路面上，橡胶管的一端完全密封，另一端连接到信息处理单元。在橡胶管内部放置的气动压力传感器用于感应车辆，当一对车轮胎越过橡胶管时，橡胶管内的气压会增加。这会关闭气动开关并产生电能，并将车辆数量、速度、行驶方向等车辆信息发送到信息处理单元。路面管能够适应各种天气条件，其使用寿命取决于因素的位置、安装情况和交通流量。此外，它存在一个问题，即每个方向都需要一个独立的路面管，且收集到的信息需要在路边的计算机中进行处理或存储。路面管不适用于高流量道路，仅在低流量道路的较短持续时间内运行良好。\n\
  \n### 2.3.1.2 用于交通管理的感应线圈检测器\n\n感应线圈检测器是一种用于用于交通管理的电磁车辆检测传感器，用于检测跨越或到达指定安装区域的车辆\
  \ [15]。交流电或移动磁铁在线圈线中感应出电流，从而检测到车辆。通过线圈的车辆通过线圈检测器传输的信号被检测到。线圈放置在道路路面中，电子放大器连接在线的两端。图\
  \ 2.2(a) 和 2.2(b) 分别显示了感应线圈检测器的安装表面和工作原理，如果车辆通过线圈的磁场，其磁场将受到影响，这种扰动被放大器感知，从而检测到车辆。\n\
  \n![图 2.2a 感应线圈检测器安装表面。](img/fig2_2a_B.jpg)\n\n图 2.2a 感应线圈检测器安装表面。\n\n![图 2.2b 感应线圈检测器工作原理。](img/fig2_2b_B.jpg)\n\
  \n图 2.2b 感应线圈检测器工作原理。\n\n电子线圈检测器单元以 10 kHz 到 200 kHz 之间的频率将能量传输到感应线圈中。当车辆越过线圈时，电感减小，从而检测到车辆。与其他相比，它的制造和运输成本也较低。感应线圈检测器的尺寸在\
  \ 5 英尺到 6 英尺之间，根据路况，安装时间在最短 10 分钟到一小时之间。大多数传统的线圈检测器用于寻找车辆是否存在、统计越过线圈的车辆数量、速度以及车辆间隔。如今，感应线圈检测器采用了先进技术来对车辆进行分类。这种传感器的主要缺点是，道路维护的每个阶段都需要重新安装。此外，安装时会发生交通干扰。\n\
  \n### 2.3.1.3 用于检测车辆存在的磁性传感器\n\n磁性传感器感知并检测传感器安装表面的车辆存在。它能区分车辆并允许我们做出交通灯控制的决策 [16]。此外，它根据感应数据为交通拥堵提供了改进方案。磁性传感器可以放置在道路中间或侧，当车辆或金属物体越过传感器时，它会影响地球磁场，从而检测到金属物体或车辆。图\
  \ 2.3 描述了磁性传感器嵌入集成电路 (IC)，显示了车辆引起的磁场畸变。磁性传感器尺寸非常小，因此减少了安装问题和成本。\n\n![图 2.3 磁性传感器感应到的车辆引起的磁场畸变。](img/fig2_3_B.jpg)\n\
  \n图 2.3 磁性传感器感应到的车辆引起的磁场畸变。\n\n### 2.3.1.4 用于统计路边车辆数量的压电传感器\n\n压电传感器利用压电效应并识别传感器环境中压力、温度和力的变化。压电传感器以对角位置放置在路面下方\
  \ [16]。一旦机械应力施加在传感器上，压电效应就会产生电能。当每个轮胎越过传感器安装区域时，会改变电压脉冲。通过电压的变化来统计越过传感器的车辆数量。为了统计这种电压，一个变化计数设备连接到传感器并放置在路边。压电传感器由石英材料制成，具有高灵活性且尺寸小。这种传感器在\
  \ 20°C 到 60°C 的温度之间工作，灵敏度为 5 V/µƐ。压电传感器不需要任何外部电压。一旦施加压力，它就会产生电荷并检测以 112 km/h 速度通过的重量车辆。\n\
  \n### 2.3.1.5 用于测量车辆速度的雷达传感器\n\n图 2.4 所示雷达传感器利用微波辐射识别物体。发射的低能微波击中车辆并被物体反射；在反射时它还会返回车辆的位置和速度，有助于交通监控并防止车辆碰撞\
  \ [16]。雷达传感器有助于测量车辆的流量、速度以及其运动方向。这种传感器根据范围主要分为 24 GHz 和 60 GHz 等不同类别。24 GHz 和 60\
  \ GHz 的物体检测技术分别探测 100 米和 10 米范围内的物体。自动驾驶汽车的速度由这种雷达传感器控制；在变化的环境条件下，速度会减慢但传感器仍能有效工作。雷达传感器不受雨、风、雾等天气条件的影响。它更适用于户外应用，且具有良好的物理硬度。\n\
  \n![图 2.4 雷达传感器物体检测。](img/fig2_4_B.jpg)\n\n图 2.4 雷达传感器物体检测。\n\n### 2.3.1.6 用于行人检测的红外传感器\
  \ (Ir)\n\n\n\n\n\n超声波传感器用于通过感知附近的车辆来检测交通拥堵；它测量自身与声波线线上其他物体之间的距离 [[16]]。通过物体的回声，距离的估算如图\
  \ 2.6 所示。超声波传感器的最大探测范围为 4 米。路面被视为固定静止的物体，而车辆则被视为移动物体。传感器被部署在距离路面 4 米处，并周期性地沿垂直轴线放置。如果有任何车辆穿过该区域，传感器与路面之间的距离就会缩小，从而确保车辆的存在及其占用时间，以估计交通流量。在这里，车辆长度被相应作为输入，以计算沿超声波传感器声波线移动车辆的速度，并获取其计数以用于智能交通系统。通过这种方式使用超声波传感器可以估计交通信息。\n\
  \n![图 2.6 用于车辆检测的超声波传感器。](img/fig2_6_B.jpg)\n\n图 2.6 用于车辆检测的超声波传感器。\n\n安装在道路两侧的传感器将提高单侧安装设备检测车辆的效率。对于道路基础设施糟糕的情况，传感器网络配置非常具有挑战性。传感器的水平放置会将非车辆记录在车辆类别中，并以不的方式提供数据。这种情况有时会发生，可以通过将传感器放置在道路边缘来消除。路面必须平整，以避免超声波传感器发射的声信号被吸收和色散。为了准确估计交通流量并避免拥堵，传感器采用架空安装，以覆盖更广泛的道路网。`HCSR04`\
  \ 适用于测量距离 2 cm 到 400 cm 的物体。超声波传感器可以安装在停车位上检测车辆以确保车位空闲；从而实现高效的停车管理。超声波传感器用于根据超声波反射强度的衰减检测道路异常。在危险路况下，它会产生警报声。由于其配置简单且易于获取，它了更多生命\
  \ [[17]]。\n\n### 2.3.1.8 路面状况传感器\n\n路面状况传感器感知天气状况和道路建设强度 [[16]]。驾驶员在行驶时并非总能观察到道路异常，特别是在夜间。这导致了驾驶端出现许多事故和复杂情况。路面状况传感器用于感知和评估路面表面、道路、公路、桥梁和停车区域。它还帮助老年人和视障人士通过预先提醒了解路面状况。\n\
  \n有三种配置。\n\n* 传感器安装在带有钻孔空腔的路面表面，尽管其工作需要实时面对巨大的交通场景；\n*   非侵入式立柱式安装，用于测量路面；以及\n*\
  \   通过安装在车辆上的传感器进行远程传感的实时表面状况感知。\n\n积水、沥青、草坪或土壤是路况的类型。可接受的路况状况是沥青，因为对于老年人和视受影响的人来说，在积水中更容易发生滑倒事故。这种区分方式对于乘坐轮椅的身体残障人士也非常有帮助和支持。\n\
  \n上述所有道路传感器的 AI 功能将观察路况并准确收集数据，这些数据将经过驱动和分析，以更好的方式改善地面交通。\n\n### 2.3.2 车载传感器\n\n\
  车载传感器用于在驾驶时观察周围环境，有助于驾驶员确保安全。各种车载传感器如图图 2.7 所示。物联网的复杂性通过传感器及其集成单元得到了估算。\n\n![图 2.7\
  \ 放置在汽车内的传感器。](img/fig2_7_B.jpg)\n\n图 2.7 放置在汽车内的传感器。\n\n#### 2.3.2.1 夜视传感器\n\n\
  重大事故是因为驾驶员视线不足而在无意中发生的。与动物视觉相比，人类视觉在夜间非常糟糕。这通过适当的光电磁光谱和光强度得以。为了即使在远处也能看到人的图像，使用了热摄像\
  \ [[19]]。这是先进车辆嵌入的一种附加选项。`IR` 和热传感器安装在车辆上，并由中控台上的车载计算机控制。通过 `IR` 感知物体及其距离，并显示在显示设备中，有助于在到达前方障碍之前尽早避让。传感器可以放在车辆的任何位置，如挡风玻璃、大灯等。\n\
  \n夜视传感器涉及两个类别。它们是：\n\n1. **主动夜视传感器：** 这种传感器通过 `IR` 传感器支持感知 600 英尺范围内可见的物体。其一个明显的缺点是，天气状况会影响传感器的可视化能力。\n\
  2. **被动夜视传感器：** 在被动夜视传感器中，虽然没有前方物体的清晰图像，但仍支持 1,000 英尺的延伸范围。它完全取决于热摄像机，如果温度高则不可靠。\n\
  \n#### 2.3.2.2 速度传感器\n\n速度传感器是利用轮子旋转读取车辆速度的传感器。它通常是光学传感器，考虑光信号及其反射 [[20]]；感应传感器，其中磁脉冲以波的形式产生；\n\
  \n使用速度传感器反映了汽车运行功能的效率。\n\n有几个方面需要考虑以提高实用性。一些包括：\n\n* 传感器输入有助于控制助力转向压力，以便在停车区域减速。\n\
  * 防锁死制动系统（简单称为 `ABS`）利用速度传感器数据，帮助识别轮子锁死时并释放一定压力，以保持行驶方向的稳定性。\n* 电子发动机控制系统也利用车辆速度传感器数据。\n\
  \n整体而言，它有助于发现由于速度传感器信号异常导致的速度不受控故障。它被部署在轮子上以测量和比较轮子旋转，并根据感知数据采取必要行动。数据提供给 `ECU`\
  \ 单元，以指示换挡的精确时机。由于自动变速箱挡传感器和速度传感器具有关联功能，车辆故障也容易确定。\n\n#### 2.3.2.3 接近传感器\n\n\n\n\
  \n通过接近传感器可以检测到附近最近的物体。感应到的测量值对于自动巡航（Automatic Cruise Control）非常有用。车辆的速度完全取决于其前方和后方的车辆\
  \ [20]。这对于无人驾驶根据检测到的信号采取必要行动非常有帮助。接近传感器有不同类型，包括电感应式、电容式和光电式。(i) 当金属目标进入场中时，电感应型接近传感器产生的电磁场会发生变化，因为它会反射出不同比例的场强。(ii)\
  \ 电容型不仅用于金属目标，还用于玻璃、液体等其他形式。(iii) 通过通过发送器和接收器之间光束的断开，利用光电接近传感器检测目标及其的存在。\n\n最常见的形式是磁性接近传感器和超声波接近传感器。\n\
  \n### 2.3.2.4 气囊传感器\n\n气囊传感器是一种被动保护装置，不需要人工干预，且仅为汽车设计，不适用于摩托车。气囊传感器的信号来自 `MEMS`\
  \ 加速计，依赖于控制单元，以便在面临风险时启用安全功能 [21]。气囊传感器有两种常见形式：一种是完全由电池供电的电气，另一种是独立于电源工作的机械式。通用的球管机构是一种电机械结构，描述了汽车在面对碰撞时的反应。管由一个小型电路开关和球体/滚子型加重线圈与磁铁连接在一起。如果发生事故，球体会被发射并向前滚动，撞击开关使电路闭合，从而激活安全带锁和自动车锁等。同时，充气系统接收到信号并开始通过化学充电填充氮气，并将其爆炸作为辅助。感测数据的影响通过\
  \ `AI` 碰撞算法进行分析。专为气囊电子控制单元设计的碰撞算法通过允许在特定时间弹出规定数量的气囊来保护车辆乘客。其就绪状态和响应时间仅为几毫秒。\n\n\
  ### 2.3.2.5 压力传感器\n\n压力传感器用于感知有车辆液体，如变速箱油、发动机油、刹动系统液油、冷却单元中的油以及燃料系统油。它基于压阻效应，电阻的变化会导致由于流体压力引起的偏移。目标特征使得传感器只有在承受极端的高温度、压力、粉尘空气环境时才能执行设计任务\
  \ [22]。压力传感器的传感能力从 `0 bar` 到 `600 bar`，工作温度为 –40°C 至 +125°C。压力传感器的最新发明对于规避行人撞击的情况非常有用，当他们撞击车辆正面时，通过提供强力空气屏障使其恢复正常。这是在行人滑过保险杠时立即感应保险杠的变形，并通过激活舱内预留的压缩空气启用汽车安全系统实现的。\n\
  \n### 2.3.2.6 气体成分传感器\n\n通过气体成分传感器观察空气质量 [23]。通过气体传感器检测一氧化碳 (`CO`) 和氧气等气体。如果危险气体浓度达到极限，则将通过警报声提醒驾驶员。通过持续监测车辆周围环境循环空气中存在的气体，可以维持通风和空调的均匀性。传感器应防漏且防水，以便在\
  \ –40°C 到 85°C 之间工作。它有助于提高车辆的燃油效率。\n\n### 2.3.2.7 温度传感器\n\n温度传感器用于冷链运输系统，例如使用集装箱运输牛奶、肉类和药品；所有都需要维持在特定温度以防止物品腐烂。车内温度传感器是负温度系数传感器，温度升高时电阻值会减小\
  \ [18]。该温度传感器接受的信号电压为 `0 volt` 和 `5 volts`。它将车辆分为两个垂直：一个是乘客舱，另一个是车外空气温度。温度传感器作为汽车内许多单元的输入，例如风扇速度、冷却负载、太阳热负载，这些负载可以根据温度的变化进行调整。这里使用的温度传感器是\
  \ `LM35`，它有三个引脚（电源、地和输出电压）用于测量环境温度。`ESP 8266` Wi-Fi 模块用于将温度传感器的数据传输到网页。传感器的电池寿命对于传感器的工作至关重要。有一种名为\
  \ `RFM 3200` 的无线无电池传感器，与其他相比，寿命更长。其优点是完全消除了非线性温度问题，从而确保了高准确性。\n\n### 2.3.2.8 位置传感器\n\
  \n高端车辆的安全需求通过传感器技术快速方式检测异常情况来确保。助力转向电动汽车需要计算位置以减少燃料消耗和 CO[2] 排放。为了检测方向盘的角旋转并控制电机，位置传感器被部署在车辆中\
  \ [24]。通过在电磁换向电机中固定位置传感器，可以在启动和高速运行期间对扭矩进行精确控制。\n\n位置传感器有三种类型。它们分别是霍尔效应传感器、光学传感器和感应式位置传感器：\n\
  \n1. **霍尔效应传感器**：用于感知踏板位置。它检测相对于施加磁场的电流载体对电阻的影响。基于 IC 的 `AS5262` 是一种基于霍尔的位置传感器，可精确产生\
  \ `360°` 角度测量。其工作温度为 – 40°C 至 150°C。通过适当表面磁化，它能够抵抗不必要的杂散场。\n\n2. **光学传感器**：由光电晶体组成，用于感知光学标记的移动。它是曲轴位置传感器，用于感知从旋转轴表面反射的光。这种变化可以通过光束的明亮和黑暗标记来感知。\n\
  \n3. **感应式踏板位置传感器**：数字组件用于用大电流驱动线圈。通过磁场的连续产生及其相对电流相位，利用加速踏板位置传感器确定旋转线圈的位置。\n\n####\
  \ 2.3.2.9 湿度传感器\n\n\n\n\n这种被称为传感器的电子设备能够感知周围环境的空气湿度，湿度可能会形成雾气`[25]`。如果感知到的空气中水气（雾）在车辆玻璃上的聚集量超过一定值，人们将难以看清车辆前的物体。通过将一个传感器的数据与其他传感器结合，从而实现优化，证明了物联网的智能性。湿度传感器的数据被传递给温度传感器，以测量湿度浓度较高时的温度。因此，在气候控制单元的帮助下，可以计算出雾气形成的露点，并通过车内空调单元的冷凝器进行调节。这种电池供电传感器的主要优势是由于其具有\
  \ 15 年耐用性、小尺寸、可靠性等功能，让车内的人员驾驶得更加舒适。这进一步有效地避免了在山地地区发生事故。\n\n### ### ### 2.3.2.10\
  \ 雾天预测传感器\n\n自动驾驶车辆和人类驾驶的车辆在晨雾等恶劣天气条件下都面临着困难。雾传感器感知车内玻璃表面的水分含量水平`[26]`。这种尺寸很小的雾传感器会产生红外光来检测雾的存在。这种检测是通过光束的散射现象完成的。如果内层玻璃形成雾，发射的`IR`散射光束将再次被雾传感器接收。来自传感器的观测数据被输入到车内的气候控制单元，并利用任何加热效应进行除雾。雾传感器非常准确，能够在人类视觉到之前将其检测出来。\n\
  \n### ### ### 2.3.2.11 车辆碰撞传感器\n\n如果坐在驾驶位上，会有许多驾驶员无法看到的盲区。有各种传感器可以在事故发生前检测到障碍物`[27]`。电磁传感器、超声波传感器是用于检测障碍物并在车辆行驶时提醒驾驶员的少数传感器。\n\
  \n- 使用安装在保险杠上的电磁传感器将发射信号以指示车辆附近的障碍物。如果车辆在没有注意到传感器发射信号指示的情况下持续保持相同速度，则会产生声信号警告驾驶员。这个过程被认为是一个平稳且缓慢的过程。\n\
  \n- 使用无线超声波传感器，通过从障碍物产生的无线信号的回声来检测障碍物的距离。它可以放置在车辆的前部和后部。\n\n- 倒车停车传感器会在车辆处于倒档模式时被激活。传感器将产生超声波无线电波以传输并接收来自障碍物的反射信号。\n\
  \n### 2.3.3 车身传感器\n\n驾驶员一生大部分时间都在车辆内度过，他们的驾驶方式为许多人准时到达目的地带来了快乐。尽管如此，持续的工作负载和及时驾驶车辆的能力使他们不断奔波，并引发了某种攻击性。饮酒、注射药物、嗜睡、注意力不集中、行驶快速是事故的主要原因。\n\
  \n\n\n\n在交通人工智能（AI）技术中，它主要涉及自动驾驶车辆、交通灯控制和行人路径识别 [29]。在城市地区，它可以根据之前学习的数据来预测决策，从而在很大程度上避免事故。在决策不可预测的关键情况下，可以使用神经网络、遗传算法（`GAs`）等\
  \ AI 方法进行预测。在交通领域，会预先识别优化路线。这降低了运输成本并提供了安全保障。\n\n### 1. 公共交通中的 AI\n在人口众多的国家，公共交通成为了最大的礼物。在\
  \ AI 领域，机器以人类智能行动 [29]。AI 的部署和需求被归分为学习、预测和自动化等不同类别。在学习阶段，从公共环境中收集意见/反馈。在预测期间，交通模型会识别拥堵路线并提供安全的替代路径。一旦学习和预测完成，整个过程将实现自动化，以解决即将出现的问题。\n\
  \n### 2. 自主飞行器\n在自主飞机的登机期间，为了验证乘客身份，AI 使用人脸识别技术。扫描过程是自动化的，乘客可以扫描脸部，系统会在无需人工干预的情况下自动完成验证。此外，在爬升阶段，飞机燃油率最高。为了测量燃料消耗水平，会根据飞行信息创建飞行员爬升配置文件。AI\
  \ 模型会分析飞行员配置并预先预测预计油耗。\n\n### 3. 货物交付\n为了避免货物运输和交付中的问题，部署了带有 AI 技术的无人机；它避免了人为错误。无人机用于将产品送到客户门口。图像处理和神经网络技术被用于检测飞行环境中的丘陵、建筑等物体/障碍。传感器和摄像头用于捕捉图像。一旦捕捉图像，就会进行处理，并根据这些处理后的信息做出有用决策。\n\
  \n### 4. 交通管理\n在交通管理中，AI 为顺畅交通创建了环保方法。交通灯根据交通拥堵嵌入了 AI 技术，并将自动做出决策 [29]。AI 识别环境并采取相应行动做出决策。\n\
  \n## 2.4.1 用于员监测的集成物联网与 AI 技术实现\n这种安全增强技术通过测试模型成功实现，模型中配置了支持物联网的传感器网络，并在 AI 技术的帮助下分析输出数据。眨眼传感器由一个红外发射器和接收器组成，通过眼睛反射的光线检测眨眼次数。从眨眼传感器感到的数据作为测试数据，并被输入到训练模型中以识别驾驶员是否处于疲劳状态。如果驾驶员的眼睛因嗜睡而在特定时间内保持闭合，则可能导致事故；可以通过在发生嗜睡驾驶时立即向司机发出警报来防止。\n\
  \n在图 2.9(a)和 2.9(b)中显示了眼睛一段时间的开闭。图 2.9(b) 说明了有意的闭眼，并表明疲劳感直接导致注意力集中。\n\n![图 2.9 (a)\
  \ 驾驶员睁的眼睛；以及 (b) 驾驶员闭的眼睛。](img/fig2_9_B.jpg)\n\n图 2.9 (a) 驾驶员睁的眼睛；以及 (b) 驾驶员闭的眼睛。\n\
  \n使用该模型，通过检测到的脸部帮助创建感兴趣区域（`RoI`），然后将其输入到 `CNN` 分类器。它根据获得的值基于开闭状态对眼睛进行分类。正常人每分钟眨眼\
  \ 10 次。根据此，基于 15 秒的时间设定了阈值。如果获得的值超过了阈值值，则确认驾驶员处于疲劳状态，并通过警报信号和向司机显示通知来发出警告。\n\n该模型即使在深夜条件下也能提供准确的检测和分类。因此，模型的效性保护了乘客并确保了始终的安全驾驶。\n\
  \n## 2.5 结论\n本文通过多种物联网传感器和 AI 技术回顾了智能交通系统（ITS）中物联网与 AI 的革命。并将交通管理方法分为三个维度：道路上、车内和司机身上。强调了\
  \ AI 和物联网在 ITS 中的详细作用和意义，并将其作为一个模型进行实现。它拥有 `CNN` 分类器，显示出其分类驾驶员疲劳感的能力，这对于使用物联网的传感器网络来说是一个巨大的优势。因此，实现的模型、检测效率和估计时间证明了它们对于\
  \ ITS 的智能化。同样，对交通中每一样事物的探索导致了其更好的自主管理。\n\n## 关键词\n\n## 参考文献\n1. Boshita, T., Suzuki,\
