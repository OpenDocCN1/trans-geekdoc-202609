  \n# 第 8 章 人工与物联网在智能交通中的作用\n\nPAWAN WHIG^(⁶)\n\n## 摘要\n\n运输业正面临人工智能（AI）的变革。它现在已被应用于各个交通领域，从帮助车辆、火车、船只和飞机自主运行，到使交通流更加顺畅。除了改善我们的生活之外，它还将帮助其他形式的旅行变得更简单、更安全、高效且智能。例如，人工智能驱动的自主运输可以帮助减少许多交通事故中的人为错误。然而，这些前景也带来了现实障碍，包括不可预见的影响和误用，例如网络攻击和偏斜的运输决策。此外，还存在与人工智能对人类现场行为责任相关的职业影响和法律问题。社会已经接受了智能交通的概念并广泛实施。与此同时，智能交通的挑战正在出现，物联网（IoT）为其增长提供了新路径。基于物联网的运输网络已经实现了使用强大复杂的连接技术的智能城市管理结构的梦想。在本章中，我们将关注智能交通物联网系统以及在智能交通管理系统中发挥关键作用的创新。此外，我们将探讨物联网和人工智能在运输业中的作用，并突出可以实施物联网架构的不同应用场景。\n\
  \n## 8.1 引言\n\n根据分析师的数据，到 2020 年，75%的新汽车将具备物联网连接功能 [1]。虽然网络安全与物联网的集成解决了许多挑战，但交通研究的发展非常迅速\
  \ [2]。交通研究中的深度强化学习为现代方法提供了综述 [3]。智能交通的前景带来了网络攻击和决策偏斜等障碍 [4]。基于物联网的运输网络实现了智能城市的管理梦想\
  \ [5]。FlexPool 为 [6] 提供了一种分布式无模型深度强化学习算法。智能交通物联网系统和创新是管理系统的关键 [7]。网络安全与物联网的安全集成至关重要\
  \ [8]。物联网架构可以实现在各种应用中，以改进运输业 [9]。智能交通的挑战正在出现，为增长提供了路径 [10]。物联网和人工智能在交通中的作用是意义足足的\
  \ [11]。\n\n## 8.2 背景\n\n在亨利·福特于 1908 年发明汽车之前，所有货物都通过马车运输，如图 8.1]。自 20 世纪末以来，物流的重大变化通过软件改变了流程\
  \ [13]。技术不断颠覆物流领域，并改变货运、销售、材料、货物和库存的管理 [14]。企业始终寻找降低成本的解决方案 [15]。\n\n## 8.3 物流与运输\n\
  \n物流与运输管理领域需要分析和准确性。它监控向客户交付货物或材料 [16]。物流和运输管理系统主要处理内容如下，其主要功能在图 8.2 中所示：\n\n* \
  \  收送请求\n*   承运人管理取货优化\n*   仓库管理\n*   中转交付\n*   报告与商业智能 (BI)\n\n## 8.4 收送请求\n\n\
  客户的角色是向承运人提供取货和交付需求。这就是如何开发一个接口，让客户发送收送请求 [17]。\n\n\n\n\n\n无法从零开发一套管理货品取货和供应的新解决方案。市场上已有许多物流软件，包括\
  \ `NetSuite` 和 `McLeod`，它们可用于高效地管理运营。客户的角色是为承运商提供取货和交付需求 [18]。\n\n### 8.4.1 Netsuite\n\
  \nNetSuite 是一种用于企业决策与规划、库存网络与库存、财务执行、客户关系和业务洞察的主流协调平台 [19]。它是 `Oracle` 的产品，其 UI\
  \ 界面如图图 8.3 所示。\n\n![图 8.3 NetSuite 界面。](img/fig8_3_B.jpg)\n\n图 8.3 NetSuite 界面。\n\
  \nNetSuite 是一种在线服务，为公司提供在单一系统中管理每个重要业务流程的能力 [20]。它没有硬件，没有高昂的早期许可费用，没有硬件或软件维护费用，也没有复杂的设置。\n\
  \n公司使用 NetSuite 进行企业资源规划（ERP）和库存管理、财务追踪、电子商务购物和客户关系管理（CRM）。这个灵活的平台适用于各种业务应用 [21]。\n\
  \n为了降低运营成本并提高竞争力，许多公司转向云端来交付其业务系统。NetSuite 作为云 ERP，提供了一套云端财务和企业资源规划（ERP）以及监察交易软件，在\
  \ 200 多个国家和地区运营，拥有超过 18,000 名客户 [22]。\n\n### 8.4.2 McLeod\n\nMcLeod 提供卡车软件和运输管理解决方案，管理卡车运营、文档成像、车队管理、自动化流程和\
  \ EDI。为了管理取货和交付请求，可以使用上述解决方案。McLeod 的 UI（用户界面）如图图 8.4 所示。当客户订购取货或运输时，请求被发送到调度中心，由调度中心将货物分配给不同的驱动程序。承运商应决定取货或运输是否按时完成，就像司机偏离预定路线的频率一样。通过将\
  \ AI 和 IoT 引入协调应用，这种做法是可行的 [23]。\n\n![图 8.4 NetSuite 界面。](img/fig8_4_B.jpg)\n\n\
  图 8.4 NetSuite 界面。\n\nMcLeod Software 专门服务于运输业，在北美拥有稳固的客户基础，基数涵盖了超过 1,000 名活跃客户。这意味着他们完全理解所有类型的承运商、货运代理商和货运管理公司的需求和复杂的细节\
  \ [23]。\n\n他们还于犹他州盐湖市和伊利诺伊州唐纳斯格罗夫设有带有培训设施的区域办事处，并在阿拉拉巴马州伯明哈明的国家总部拥有 McLeod Software。他们雇佣了\
  \ 500 多名专业人士，其中大多数是软件开发人员 [24]。\n\nMcLeod Software 在卡车和经纪行业中起着关键作用。他们是超过 20 个州级和区域组织的成员，此外还是国家组织\
  \ `ATA`、`TCA`、`TIA`、`AFTC`、`NTTC` 和 `NPTC` 的成员 [25, 26, 27]。\n\n在供应链运营中，Gartner\
  \ 预测高达 50% 的全球主要公司将使用先进分析、IoT 和 AI [28]。\n\n## 8.5 承运管理取货优化\n\n承运商可以使用预测分析算法来识别交付是否高效。不同类型的分析汇总在图\
  \ 8.5 中。\n\n![图 8.5 McLeod 界面。](img/fig8_5_B.jpg)\n\n图 8.5 McLeod 界面。\n\n### 8.5.1\
  \ 预测分析\n\n有效的预测性物流分析可确保车队按时接收和转移，从而根据客户意愿提供货运 [29]。\n\n安装在卡车中的设备准备或交付馈流信息（如发动机执行和速度），传感器触发的资源或\
  \ IoT 设备会将评估后的预计到达时间和发动机故障发送给承运商。例如，来自车辆的远程测量信息可以显示其超速、位置、状态以及到达目标的时间 [30]。记录的信息可用于告知受益人延迟情况、卸载、前往相似目标的卡车以及物品运输的需求。这确保了延误和客户预期被降至最低\
  \ [31]。\n\n智能 AI 和 IoT 物流有助于港口、发货人、供应商和代理优化资源的使用和计划。\n\n### 8.5.2 基于库存的预测\n\n公司可以根据库存数据预测整个供应链中货运和商品的需求。为了根据历史数据（包括库存数据和订单数据）评估需求，物流公司需要建立预测模型\
  \ [32]。\n\n库存预测的基本实践如图图 8.6 所示。\n\n![图 8.6 库存预测的基本实践。](img/fig8_6_B.jpg)\n\n图 8.6\
  \ 库存预测的基本实践。\n\n*来源*：重自 [`www.netsuite.com.au/portal/au/articles/inventorymanagement/inventory-forecasting/`](https://www.netsuite.com.au/portal/au/articles/inventorymanagement/inventory-forecasting/)\n\
  \n通过自定义兴趣确定模型，组织可以实现精确估计，帮助他们获得额外的限额，减少空驶里程，并提高货运车辆的容量和利用率 [33]。\n\n由于协调项目可以精确预测请求和运输，它们可以建立负载限制并按时交付客户。\n\
  \n### 8.5.3 IoT 与人工智能（AI）驱动\n\nIoT 物流的应用使得货物追踪更加容易。数据的收集和交换通过传感器完成。IoT 允许在网络基础设施上处理数据\
  \ [34]。基本结构如图图 8.7 所示。\n\n![图 8.7 IoT 与人工智能驱动的基本结构。](img/fig8_7_B.jpg)\n\n图 8.7\
  \ IoT 与人工智能驱动的基本结构。\n\n在货物的承运过程中集成了传感器。传感器采集的数据可以转换为 AI 使用以提供价值洞察。AI 赋能的调查实现了从飞行中心到目的地的持续跟踪\
  \ [35]。有效的产品监控提供了信息，包括：\n\n*   运输期间的篡改或盗窃；\n*   出发和到达时间；\n*   实时运输位置；\n*   与计划路线的任何偏差。\n\
  \n从存储网络收集的信息可以考虑有助于产品开发和市场规划的未来需求。当产品到达目的地时，制造公司可以继续优化生产。\n\n以加工食品为例。食品生产状态、存储温度和交付时间可以使用不同类型的传感器进行监控。为了确保食品质量不受损害，在生产和交付过程中使用了检查清单来分析危害和关键点\
  \ [36]。\n\n\n\n\n\n为了使企业能够实施食品安全解决方案，`IoT` 传感器发送与供应链中食品相关的有用信息。这不仅有助于遵守食品安全法规，还能通过完全透明化来维护客户的忠诚度和信任。\n\
  \n承运人的角色还包括为货物的组织化交付提供优化路线，并与仓库所有者进行交互 [[37]]。\n\n通过包括 `AI` 和 `IOT` 在内的精明进阶，可以升级协调能力，并缩短产品分拣和运输所需的时间。\n\
  \n`IoT` 提供了可以实时监控和报告的信息。通过远程监控能力，可以更容易判断延迟是由于恶劣天气条件还是卡车维护问题导致的。因此，供应链可以有效监控承运人。\n\
  \n### 8.5.3.1 AI/IOT 在规划中的作用\n\n可以根据司机的负责取货区域将货物分配给他们。取货工作被分配给位于收集点附近的司机，并通知他们前往仓库的优化路线\
  \ [[38]]。\n\n对于交换或交付，应根据（例如）收集的货物类型选择卡车和仓库。\n\n配备 `IoT` 传感器的卡车提供实时的路线优化分析、可靠性和时间缩短。物流服务提供商接收由传感器捕获的数据和警报。\n\
  \n`IoT` 传感器信息包括：\n* 货物类型；\n* 承运人的实时位置；\n* 与预期路线的偏离；\n* 仓库取货/交付；\n* 湿度/温度。\n\n影响物流和车队管理的前五路线规划初创公司如图图\
  \ 8.8 所示。\n\n![图 8.8 前五路线规划初创公司。来源：重自 StartUs Magazine, 2019 年 5 月。https://www.startus-insights.com/innovators-guide/5-top-route-planning-startups-out-of-548-in-logistics/](img/fig8_8_C.jpg)\n\
  \n图 8.8 前五路线规划初创公司。 *来源：* 重自 StartUs Magazine, 2019 年 5 月。[`www.startus-insights.com/`](https://www.startus-insights.com)\
  \ innovators-guide/5-top-route-planning-startups-out-of-548-in-logistics/\n\n对收集的信息进行人工智能处理可以帮助您预测伴随因素：\n\
  * 可能的供货时间；\n* 司机行为的调查；\n* 产品质量（如易腐质产品）；\n* 计划路线与实际路线之间的差异。\n\n信息的分拣和调查将帮助协调组织减少多余费用，提高收集和交付货物的机会，并提供优化的路线。可以观察实际路线与计划路线的差异，以及为什么会发生偏离计划路线的情况。这种\
  \ `AI` 和 `IoT` 的预测使得未来的交付和取货路线更加优化。\n\n可以通过优化路线规划规划运输和交换。由于分拨中心可以获取有关司机预计到达时间的数据，它们可以有效地设计产品车辆。例如，可以提前安排倾卸产品所需的设备和工作，以实现快速旅行/交易。\n\
  \n订单取货必须经过优化，以确保产品不受任何方式的影响。可以保证 `AI` 和 `IoT` 等技术的优化取货。\n\n根据要运输的负载类型选择取货卡车。`AI`\
  \ 让承运人能够准确决策并学习历史模式。`AI` 模型根据传输的货物类型预测用于收集货物的正确卡车 [[39]]。\n\n可以计划将货物装入支持 `IoT` 的卡车中，例如，如果必须收集需要额外照顾的易腐或敏感货物。\n\
  \n由 `IoT` 驱动的卡车可以收集以下产品信息：\n* 货物存储温度；\n* 实时位置；\n* 运输卡车水分暴露数据，包括燃料成本和速度。\n\n信息传递给协调组织和物品所有者，以对整个库存网络周期维持质量控制控制。\n\
  \n## 8.6 仓库管理\n\n### 8.6.1 准备货物\n\n通过将 `AI` 和 `IoT` 结合在一起，承运人和仓库可以增强协作。例如，配备 `IoT`\
  \ 传感器的卡车会向仓库经理发送实时位置。经理可以利用传感器提供的信息，提前留出空闲空间并准备卸货产品 [[40]]。这有助于仓库高效准确地管理其进度。使用 `AI`\
  \ 进行智能预测可以及时用于装卸货的准备。结果是物流公司和仓库操作者的等待时间都减少了。仓库管理流程图如图图 8.9 所示。\n\n![图 8.9 仓库管理流程图。](img/fig8_9)\n\
  \n图 8.9 仓库管理流程图。\n\n### 8.6.2 门户规划\n\n位于商店区域的传感器将根据其 `GPS` 信息发送门户相关数据。这有助于承运人缩短进入时间。`AI`\
  \ 和 `IoT` 因此更便于物流公司和仓库之间规划门户。\n\n### 8.6.3 合规与安全\n\n必须避免从卡车上卸货/装货（这是必要的）。为了提供安全性，可以使用支持\
  \ `IoT` 的锁将其与空气制动器联动。只有在卸货完成后，货车才能离开仓库。这可以安全地维护您的设备和员工。\n\n使用电脑屏幕是另一种增强仓库安全的方法。您可以在堆场区域引入\
  \ `IoT` 摄像头。边缘计算可以应用于监控任务期间发现任何关键情况。\n\n如果在倾卸期间发生任何敏感问题，例如由于糟糕的行为，仓库经理可以获得相关通知。\n\
  \n### 8.6.4 运输交付\n\n可以使用 `AI` 和支持 `IoT` 的传感器转换运输业务。安装在卡车上的 `GPS` 传感器基于 `AI` 模型对到达时间的实时评估。\n\
  \n物流公司利用 `IoT` 设备收集的实时数据实时监控运输业务。运输交付的流程图如图图 8.10 所示。\n\n![图 8.10 运输交付流程图。](img/fig8_10)\n\
  \n图 8.10 运输交付流程图。\n\n实施预测性分析将将帮助公司了解卡车需要多长时间到达目的地。\n\n### 8.6.5 货物交换优化\n\n\n\n\n\
  \n例如，如果卡车发生事故，IoT 传感器将收集这些数据，随后会指派另一辆车辆来替换货物并将其发送至最终目标。卡车的 `GPS` 提供经纬度、卡车实时位置以及卡车移动等详细信息。因此，承运人员可以快速确定事故或误操作期间的车辆状况，并采取相应的安排。\n\
  \n通过这种方式，新的进步确保了产品的顺畅运输和供应。后续阶段是将货物交付给终端客户。运输工具正前往仓库向最终客户提供货物。与上述类似，车辆将收到空入口的货物安排通知，以便提取货物，仓库管理员也会收到通知。\n\
  \n在完全的安全下，将使用支持 IoT 的锁和计算机视觉摄像头将货物转移到承运工具。一旦完成加载并将货物交付客户，承运工具将出发。\n\n## 8.7 报告与分析\n\
  \n每当货物被收集和运输时，机构将拥有一份报告，其中包含货物运输过程中的负面正面执行模式。\n\n由于公司需要对运输成本进行细粒度的透明化以便有效管理和控制，物流和运输领域对商业智能的需求日益增长（图\
  \ 8.11）。\n\n![图 8.11 显示商业智能和报告的示例。¶ ：重自 https://insightsoftware.com/blog/business-intelligence-vs-reporting-finding-your-bread-and-butter/](img/fig8_11_B.jpg)\n\
  \n图 8.11 显示商业智能和报告的示例。 ¶ *来源*: 重自 [`insightsoftware.com/blog/business-intelligence-vs-reporting-finding-your-bread-and-butter/`](https://insightsoftware.com)\n\
  \n商业智能能够将数据转换为有价值的信息。在过去，报告局限于从平板电脑或数据库中的系统进行数据提取、收集和传输。\n\n但商业智能现在达到了下一个水平，公司能够生成有价值的报告，以计分卡格式显示所有物流提供商的数据。确定承运商性能的标准被分配给如取货和交付准时性、能力承诺和司机行为等因素。\n\
  \n董事会同样可以利用持续仪表板提供实时数据，并帮助客户在问题出现时进行处理。他们需要对发生的情况进行每日和快速概述。仪表板允许组织从快速响应中获益，因为客户不需要等待某人制作报告并发送。\n\
  \n可以预测库存网络/运输网络中问题和未来风险的信息被机构用于 BI 和报告。\n\n让我们看看供应商如何以其为例，通过商业信息来改进物流和供应链运营。\n\n\
  假设某发货人在交付时间上的准时率为 89%，但希望从根源上再吸引 10% 的货物运输成功率。是否是因为车道损坏导致了延迟？设备或承运商是否存在任何问题？\n\n\
  通过商业智能可以限制延迟因素。例如，发货人由于某种原因迟到，商业智能可以发现问题并采取行动。\n\nBI 数据促进了物流公司及其团队运营决策的效率。因此，在货物运输中实施\
  \ BI 可以实现端端的取货和交付时间。\n\n## 8.8 总结\n\n人工智能和 IoT 通过使协调任务逐步变得智能化，从而改变了协调和运输。当 AI 和\
  \ IoT 出现时，取货/交付延迟和卡车容量问题将成为过去。\n\n## 关键词\n\n## 参考文献\n\n1. Sadek, A., (2007). Artificial\
