  \n# 第 5 章 交通领域的神经网络方法\n\n# 第 5 章 交通领域的神经网络方法\n\nN. R. GAYATHRI(³)\n\n## 摘要\n\n在当前，神经网络已应用于教育、金融、语音识别、人脸检测、航空航天、汽车、交通预测等领域。交通系统对经济发展至关重要。可持续且可接受的人工神经网络（ANNs）技术被用于交通智能化系统。我们使用神经网络方法处理交通预测、路线规划、车牌号识别、停车位识别、车辆密度、旅行时间、自动驾驶车辆、车辆位置、车辆速度、驾驶行为等交通问题。神经网络算法可以像人类一样做出决策。因此，本章通过高效的神经网络实现了交通智能化。神经网络简化的设计是智能交通系统的优势。\n\
  \n## 5.1 引言\n\n神经网络是一种具有人类神经元特征的关联计算机模型。神经网络可以从原始事实中提取隐藏模式和相关性，对数据进行分组和分类，并随着时间的推移不断学习和改进。\n\
  \n神经网络的基本功能：\n\n- **分类**：将模式或数据集放入定义的类别中。\n- **预测**：根据给定的输入生成预期的输出。\n- **聚类**：在没有先验知识的情况下识别数据的独特特征并进行分类。\n\
  - **关联**：神经网络经过训练以记忆模式和模型。当我们展示一个未知模型时，网络会将其与其记忆中最相似的版本建立关联。\n\n## 5.2 神经网络是如何运作的？\n\
  \n\n\n\n神经网络由大量的人工神经元组成，这些神经元被称为节点，并按层顺序组织。输入层是接收程序员提供的多种不同格式输入的起始层。在输入层和输出层之间还有一层被称为隐藏层。隐藏层用于执行所有计算，以寻找隐藏的特征和模式。通过隐藏层，输入数据经过一系列变换，最终通过输出层显示输出结果。\n\
  \n来自输入层的输入数据移动到隐藏层进行处理。在处理阶段，每条输入数据都会被赋予相应的权重。每条输入数据与其权重相乘。然后进行输入与权重的求和。偏置（Bias）是随输入加权和添加的额外参数，用于调整输出。加上偏置的输入加和被传递到激活函数。激活函数根据输入数据决定节点将生成的输出。最后，从输出层获取输出。如果没有生成预期的输出，则必须进行反向传播。\n\
  \n神经网络是监督学习算法的一种示例，旨在近似数据所代表函数。这通过在训练阶段计算投影输出与预期输出之间的误差并最小化来实现（图 5.1）。\n\n![图 5.1\
  \ 神经网络的工作流程。](img/fig5_1_B.jpg)\n\n图 5.1 神经网络的工作流程。\n\n## 5.3 单节点的工作过程\n\n在这里，输入层的乘积输入（`X[1]`、`X[2]`、`X[3]`、……`X[n]`）和隐藏层的权重（`W[1]`、`Wn]`）与偏置（`b`）求和，然后通过激活函数\
  \ `f(y)` 作用。在神经网络中，激活函数是决定网络中的神经元是否激活并传输到下一层最重要的方面。这本质上意味着它将决定神经网络的输入对预测过程是否重要。激活函数也被称为阈值或变换。由于其可微的性质，它有助于在反向传播过程中将输出在\
  \ 0 到 1 之间或 -1 到 1 之间进行归一化（图 5.2）。\n\n![图 5.2 神经网络中单节点的工作流程。](img/fig5_2_B.jpg)\n\
  \n图 5.2 神经网络中单节点的工作流程。\n\n激活函数的不同类型：\n\n*   二值阶进；\n*   Leaky ReLU；\n*   Softsign；\n\
  *   SoftMax；\n*   Swish；\n*   ReLU；\n*   参数化 ReLU；\n*   Tanh；\n*   指数线性单元；• Sigmoid；\n\
  *   线性。\n\n## 5.4 优化算法\n\n执行学习过程的方法被称为训练（或学习）策略。为了产生最好的结果，使用训练技术对神经网络进行训练。神经网络参数调整的方式决定了训练的类型。神经网络从过去的经验中学习。学习过程通过优化算法进行。优化算法根据内存、处理速度和其他特征分为不同的类型：\n\
  \n*   梯度下降；\n*   Adam；\n*   带动量的 SGD；\n*   自适应梯度 (AdaGrad)；\n*   牛顿法；\n*   AdaDelta；\n\
  *   拟牛顿法；\n*   共轭梯度；\n*   Levenberg-Marquardt 算法；\n*   Nesterov 加速梯度 (NAG)；\n* \
  \  随机梯度下降 (SGD)；\n*   小批量随机梯度下降 (MB-SGD)。\n\n## 5.5 智能交通系统应用\n\n本章介绍了神经网络在智能交通系统中的各种类型应用\
  \ [2]：\n\n*   交通灯识别；\n*   交通标志识别；\n*   交通预测与控制；\n*   交通参数评估；\n*   交通信号定时检测；\n* \
  \  车辆分类；\n*   驾驶行为识别；\n*   道路损坏检测；\n*   车道/转弯识别；\n*   交通场景预测/理解；\n*   车辆属性检测；\n\
  *   交通基础设施维护；\n*   自动驾驶车辆；\n*   车辆停车；\n*   预测公交到达时间；\n*   行程时间预测；\n*   检测车辆位置并估计道路速度；\n\
  *   车牌检测；\n*   行人检测。\n\n## 5.6 神经网络的分类\n\n根据数学模型、原理和参数对神经网络进行分类。每个神经网络都有不同的学习过程，也有自己的优缺点。本文讨论了目前最常用的神经网络类型及其用途。\n\
  \n### 5.6.1 前馈神经网络\n\n在此类神经网络中，数据仅沿正向通过隐藏层（如果有）从输入层传输到输出层。数据只在前向传递，绝不反向传递，因此网络中不会形成循环。前馈神经网络不记忆过去，因为没有输入记忆。因此它不预测未来。它只记住训练。\n\
  \n#### 5.6.1.1 应用：人脸识别和计算机视觉（图 5.3 和 5.4）\n\n![图 5.3 神经网络中单节点的工作流程。](img/fig5_3_B.jpg)\n\
  \n图 5.3 神经网络中单节点的工作流程。\n\n![图 5.4 前馈神经网络（隐藏层）。](img/fig5_4_B.jpg)\n\n图 5.4 前馈神经网络（隐藏层）。\n\
  \n#### 5.6.1.2 单层感知机\n\n如果前馈神经网络不存在隐藏层，则它被称为单层感知机。由于没有过去的知识，输入数据被赋予随机权重。输入与权重的乘积被求和。每个感知机都有固定的阈值。只有当输入的求和值高于阈值时，感知机才会被激活。如果收到的输出与预测输出不一致，则更改分配给输入的权重以获得所需的输出（图\
  \ 5.5）。\n\n![图 5.5 单层感知机。](img/fig5_5_B.jpg)\n\n图 5.5 单层感知机\n\n#### 5.6.1.3 多层感知机\n\
  \n如果前馈神经网络中存在任意数量的隐藏层，则它被称为多层感知机。来自输入层的数据通过许多隐藏层进行处理。从隐藏层处理后的数据进入输出层显示输出。在这个过程中，隐藏层是计算引擎。多层感知机通过训练来建立输入与输出的关联。为了获得预测输出参数，会调整偏置和权重。调整通过反向传播方法进行（图\
  \ 5.6）。\n\n![图 5.6 多层感知机。](img/fig5_6_B.jpg)\n\n图 5.6 多层感知机。\n\n### 5.6.2 卷积神经网络\
  \ (CNN)\n\n另一种类型的神经网络是卷积神经网络 (`CNN`)，由不同的层组成。每层解释如下（图 5.7）：\n\n![图 5.7 卷积神经网络。](img/fig5_7_B.jpg)\n\
  \n图 5.7 卷积神经网络。\n\n1.  **输入层**：将输入（图像）数据馈入模型进行处理。\n2.  **卷积层**：从图像数据中挖掘不同的特征。\n\
  3.  **池化层**：用于减少计算因子，存在于连续的卷积层之间。\n\n\n\n\n## 4. `ReLU 层`: 它的作用是通过置零消除负像素（非线性化）。\n\
  \n## 5. `全连接层`: 用于通过多层感知器将前一层中的神经元连接到下一层。每个神经元都从过去的经验中学习，而这种学习有助于预测输出。\n\n`CNN`\
  \ 的最主要应用领域是图像识别和图像分类。如果没有达到预期的输出，则通过调整权重和偏置进行反向传播，以获得预测输出。预处理较少是卷积神经网络的主要优势。减少预处理是通过卷积核（过滤器组）实现的。\n\
  \n### 5.6.3 循环神经网络 (`Rnn`)\n\n循环神经网络 (`RNN`) 中的每个节点都充当记忆单元单元，用于存储上一层的输出。现在，下一层的输入将是前一层的输出。`RNN`\
  \ 使用上述方法来预测某层的结果。这种类型的神经网络首先使用前向传播，并存储所有处理后的信息以备后用。如果预测输出与接收到的输出不一致，那么我们希望让神经网络通过反向传播方法自我学习以纠正错误。`RNNs`\
  \ 的主要应用是文本转语音（图 5.8）。\n\n![图 5.8 循环神经网络 (RNN)。](img/fig5_8_B.jpg)\n\n图 5.8 循环神经网络\
  \ (RNN)。\n\n### 5.6.4 图神经网络 (`Gnn`)\n\n图神经网络 (`GNNs`) 类似于图数据结构。如果两个节点之间相互关联，那么这两个节点就应该维护它们的邻居节点信息（嵌入）。`GNNs`\
  \ 通过边连接节点来实现这一点。这种邻域信息用于解决节点预测和边预测等许多问题。`GNN` 广泛应用于日常生活。它的重要性是显而易见的。社交网络、Google\
  \ 地、化学化合物链接、推荐系统和交通中的路线图都是 `GNNs` 的应用场景。\n\n### 5.6.5 图神经网络 (`GNNs`) 的工作原理\n\n`GNN`\
  \ 的目标是每个节点都应该学习网络中的其他节点。在上面的图中，`Node A` 和 `Node C` 是 `Node B` 的邻居节点。`Node B` 收集\
  \ `Node A` 和 `Node C` 的信息。之后，`Node B` 加上自己的信息并将整个嵌入 `(A, B, C)` 传递给主节点 `Node A`。上述过程持续到网络中的所有节点都了解其他节点。`Node\
  \ C` 和 `Node D` 重复相同的过程。现在主节点 `Node A` 包含了整个图嵌入（图 5.9）。\n\n![图 5.9 图神经网络 (GNN)。](img/fig5_9_B.jpg)\n\
  \n图 5.9 图神经网络 (GNN)。\n\n## 5.7 交通中的卷积神经网络 (`Cnn`)\n\n### 5.7.1 交通特征预测\n\n交通是运输中的主要问题。利用交通智能化，通过预测交通特征可以减少拥堵。这种预测将帮助司机更高效地选择路线。车速、交通密度、流量和状况是主要的交通特征\
  \ [1]。\n\n交通预测的主要问题是交通密度的不规则。我们无法准确预测交通拥堵的时间。它随时间变化。但使用深度学习方法可以高精度地预测不规则的交通。与其使用参数化和统计方法，近期非参数方法为交通流量提供了更高的预测值。\n\
  \n### 5.7.2 交通事件推断\n\n由于交通拥堵，某些地区的事故非常常见。交通拥堵会导致交通事故风险。我们希望根据该区域的交通参数预测交通事故风险。司机速度、天气、车辆流量、人员流动、该地的地理位置、交通流量是考虑交通事故风险的某些参数。但上述参数对于同一地点会随地点和时间而变化。所有的模型步骤都必须存储在数据池中，以预测未来的事故严重性。\n\
  \n### 5.7.3 车辆识别\n\n自动车辆识别在收费站和车辆停车中起着至关重要的作用。车辆通过每辆车唯一的车牌进行识别。\n\n由于摄像头质量差、光线不足、车辆移动模糊以及车牌被其他车辆遮挡等参数，车牌识别变得困难。为了克服上述缺点，使用了深度学习视觉模型。读取车牌通过支持向量机\
  \ (`SVM`) 和 `CNN` 的组合自动识别。在情况下，对于相似的车牌，使用了孪生神经网络 [1]。`CNNs` 在识别车牌、车辆颜色和车辆类型分类中起着至关重要的作用。\n\
  \n### 5.7.4 交通信号计时\n\n自动交通信号对于减少交通和事故非常重要。根据时间改变信号灯。为了降低风险，必须根据交通密度改变信号灯。这可以通过 `CNNs`\
  \ 完成。在第一阶段，`CNN` 提取车辆当前位置、速度和其他物体移动等原始数据。在第二阶段，将原始数据给出深度强化学习 (`RL`) 网络。该强化网络负责预测信号灯（红、绿、黄）、等待时间和安全左转。通过这种方式，信号灯根据车辆密度进行变化\
  \ [1]。\n\n### 5.7.5 共享出行与公共交通\n\n在需求较大的地区提供频繁的公共交通。同样，在没有需求时，必须减少公共交通的频率。车辆路线根据客流量进行。`CNN`\
  \ 用于预测出行模式、客流量和需求预测 [1]。\n\n### 5.7.6 视觉识别任务\n\n自动驾驶汽车 (`AVs`) 是交通领域蓬勃的技术。无驾驶车辆主要依赖于视觉识别。基于摄像头的系统结合传感器用于目标检测，如障碍检测\
  \ [1]。\n\n### 5.7.7 根据进入流量对车道评分\n\n`CNN` 用于根据进入流量对车道评分。交通信号灯根据车道分类速率（拥堵、中等、畅通）进行改变，这对交通管理非常有用。从\
  \ 360 度摄像头拍摄的车道视频以视频帧的形式输入 `CNN`。交通摄像头捕捉大量的视频帧，并作为训练数据传递给神经网络以进行更好的预测。`CNN` 的输出与交通信号进行分析，高值的车道将分配更多的信号灯时间\
  \ [12]。\n\n### 5.7.8 车牌识别\n\n由于各种形状、字体、颜色和光效应，车牌识别是一项困难的任务。车牌中的字母和数字使用聚类算法进行分割。然后，使用\
  \ `CNN` 寻找车牌中的字母和数字 [11]。\n\n## 5.8 卷积神经网络 (`CNNS`) 的其他应用\n\n\n\n\n\n障碍检测、车牌识别、车辆颜色和型号检测、交通标志识别与自动切换、交通灯识别、空闲道检测、周围场景标注、交通场景分割、路面裂缝检测都是\
  \ `CNN` 用于智能交通的应用。\n\n## 5.9 自动驾驶汽车中的卷积神经网络 (CNN)\n\n自动驾驶车辆的决策过程是自主的。自动决策背后的概念是深度学习算法。这些算法处理从\
  \ `RADAR`、`GPS`、`LiDAR` 等传感器收集的数据。在深度学习算法中，`CNN` 是图像识别和分类最重要的算法。自动驾驶汽车使用 `CNN` 来对道路的不同部分进行识别和分类，并做出正确的决策\
  \ [3]。各节将介绍无人驾驶汽车的主要组件。\n\n### 5.9.1 感知\n\n为了安全驾驶，司机必须识别并分类周围环境中的事物。事物的识别和分类通过司者的眼睛进行。在无人驾驶汽车中，摄像头和传感器被用于识别和分类行人、停车场、交通信号灯、道路标志、道路转弯和并行车辆等物体。为了避免事故，必须自动计算无人驾驶汽车与周围物体之间的精确距离。根据距离计算，汽车必须自动减速。\n\
  \n对于自动驾驶汽车，`LiDAR`、`Camera` 和 `RADAR` 等传感器充当人类眼睛以实现良好的感知。图 5.10 显示了 AI 驱动的自动汽车感知-规划-执行流程，以做出驾驶决策。\n\
  \n![图 5.10 AI 驱动的自动汽车感知-规划-执行。](img/fig5_10_B.jpg)\n\n图 5.10 AI 驱动的自动汽车感知-规划-执行。\n\
  \n### 5.9.2 摄像头\n\n高质量摄像头是无人驾驶汽车的人眼。摄像头用于分割、分类和定位。高分辨率 `Camera` 能更准确地捕捉汽车周围的环境图像\
  \ [5]。\n\n### 5.9.3 激光雷达\n\n`LiDAR` 的缩写是光检测和测距。从 `Lidar Sensor` 发出激光。无人驾驶汽车与其他物体之间的距离是通过激光束被周围物体反射的距离来衡量的。摄像头捕捉周围图像。摄像头和\
  \ `LiDAR` 传感器的结合提供了汽车周围物物的详细信息。这些详细信息作为输入给深度神经网络，以做出最安全的决策。这在多出口的行驶条件下非常有用。\n\n\
  ### 5.9.4 雷达\n\n在 `LiDAR` 传感器中，无人驾驶汽车与其他物体之间的距离是通过激光束测量的。但无线电探测和测距 (`RADAR`) 使用无线信号计算无人驾驶汽车与其他物体之间的距离。即使是高质量摄像头也无法捕捉某些物体，但未捕捉到的物体可以通过无线信号检测\
  \ [5]。\n\n### 5.9.5 定位\n\n汽车的位置和倾角随车辆移动而变化。`Localization` 算法利用连续的视频帧计算汽车的位置和倾角，这被称为视觉里程\
  \ (`VO`)。同步定位与地图构建 (`SLAM`) 算法通过上一帧来寻找附近车辆的位置和倾角。\n\n### 5.9.6 预测\n\n自动驾驶汽车中的高质量摄像头提供\
  \ 360 度视图。所有摄像头图像、来自 `LiDAR` 和 `RADAR` 传感器的数据都作为输入数据提供深度神经网络，然后它处理输入数据进行决策。不同格式的处理数据用于物体检测、分类、定位和预测\
  \ [5]。\n\n由于深度学习网络中具有更多的隐藏层，来自不同源的数据被准确处理以做出正确的决策。深层有助于汽车通过减速行驶、停止、刹车和采取不同路线等行动对更改路线做出准确的推理。深度学习用于计算机视觉和感知\
  \ [5]。\n\n### 5.9.7 决策制定\n\n即使在意外情况下，无人驾驶汽车也应该像人类一样做出决策。当人突然穿过马路时，无人驾驶汽车应该做出减速、改变路线和转弯等准确决策。传感器被用于收集来自不同源的数据以做出正确决策。汽车的位置和移动由深度学习算法决定\
  \ [5]。\n\n深度 RL 用于决策过程。马尔可夫决策过程用于未来的决策和路线规划。网络从过去的信息中学习以预测未来的行为。路线规划、行为仲裁、运动规划和车辆控制是自动驾驶汽车用于决策的不同组件\
  \ [5]。\n\n### 5.9.8 路线规划\n\n乘客将目的地输入汽车。无人驾驶汽车应该采取交通较少、路况良好且耗时最短的最路线。如果存在障碍，汽车必须通过停止车辆或改变车辆倾角来做出决策。\n\
  \n### 5.9.9 行为仲裁\n\n马尔可夫决策过程决定路线规划。但如果存在不确定性，如车辆横穿或自然灾害，则必须更改路线计划 [5]。\n\n### 5.9.10\
  \ 运动规划\n\n乘客通过路线改变和速度改变等运动规划活动到达目的地。运动规划根据汽车的当前环境动态变化 [5]。自动驾驶汽车架构见图 5.11。\n\n![图\
  \ 5.11 自动驾驶汽车架构。](img/fig5_11_B.jpg)\n\n图 5.11 自动驾驶汽车架构。\n\n### 5.9.11 车辆控制\n\n\
  乘客必须以最大的安全性到达目的地。当汽车速度突然增加或减少时，车辆速度应受控制以确保周围安全。\n\n`CNN` 从高质量摄像头和传感器收集的数据中提取隐藏特征/模式。神经网络通过增加更多隐藏层来加深，以提取轮胎形状和周围物体等复杂特征。由于上述原因，`CNN`\
  \ 了主要算法 [4]。Nvidia、Tesla、Google Waymo 是使用 `CNN` 制造自动驾驶汽车的大巨头公司。\n\n## 5.10 用于交通预测的图神经网络\
  \ (GNN)\n\n图注意力和图卷积网络是用于交通预测问题的重要 `GNN` 类型。速度、交通流量、需求和客流量预测是主要的交通预测问题 [6]。\n\n`GNN`\
  \ 捕捉交通预测问题中的空间依赖性和时间依赖性（路况变化）。\n\n\n\n\n道路图像通过摄像头采集，包含车辆、人、商店、动物等许多对象。这些道路图像被传递到\
  \ `GNNs` 模型以描述对象之间的关系。假设两辆车相互靠近，我们计算它们之间的距离，并将流量预测传递给驾驶员以避免事故。我们还可以对相似类型的对象进行分组，并估计同类车辆的总数。\n\
  \n交通信息经过处理，将路网划分为 `Super-segments`（超路段）。`Super-segments` 由一组路段组成。每条路段都有特定的长度和速度。针对不同长度的\
  \ `Super-segments` 训练了不同的神经网络模型。因此，我们需要为每个超路段单独训练神经网络模型，以处理道路基础设施的挑战 [7]。\n\nGoogle\
  \ 地图使用 `GNN` 确定最佳路线和旅行时间的情况所示图 5.12 [7]。\n\n![图 5.12 图神经网络在 Google 地图中的应用。](img/fig5_12_B.jpg)\n\
  \n图 5.12 图神经网络在 Google 地图中的应用。\n\n### 5.10.1 轨迹预测\n\n为了根据过去的轨迹预测移动对象的轨迹。轨迹预测对于自动驾驶车辆做出决策至关重要。移动智能体的轨迹可以通过\
  \ `GNN` 进行轨迹预测 [15]。\n\n### 5.10.2 用于驾驶风格分析和车辆需求预测的循环神经网络 (Rnns)\n\n`RNN` 是一种适用于可变长度时间序列问题的深度神经网络类型，允许利用过去的信息来预测未来信息。\n\
  \n#### 5.10.2.1 驾驶风格分析\n\n`RNN` 用于根据 GPS 数据分析驾驶风格和 GPS 误差，例如车辆在某处不动、内部传感器误差以及时间间隔\
  \ [9]。\n\n首先，使用预处理的过去 GPS 数据（加速度和速度）训练 `RNN` 模型。根据上一层的输出，由模型学习安全驾驶风格评估。然后，使用训练后的数据来预测用于安全驾驶风格的未来加速度、速度因子和\
  \ GPS 误差数据。通过 `RNN` 驾驶风格评估，我们可以指导驾驶员改进驾驶风格，以获得最佳性能和高效的个人驾驶 [9]。\n\n安全驾驶风格考虑以下参数：\n\
  \n1. 防护性驾驶；\n2. 绝不疲劳驾驶；\n3. 避免分散注意力；\n4. 保持警惕；\n5. 观察前方道路；\n6. 维持最优速度；\n7. 系好安全带；\n\
  8. 了解盲区。\n\n不同的人有不同的驾驶风格。因此，不同驾驶风格的风险水平不同。根据驾驶风格对驾驶员进行识别和评分。\n\n### 5.10.3 车辆需求预测\n\
  \n双向门控 `RNNs` 用于需求车辆预测。每次都会计算所有站的目的地出发需求。将目的地和出发值相加并输入激活函数以计算预测输出。模型从当前的过去数据（过去的小时数据）中学习。\n\
  \n## 5.11 RNN 的应用\n\n使用 `LSTM` 和门控 `RNNs` 预测交通速度、拥堵流和预测。\n\n### 5.11.1 交通中的多层感知器\n\
  \n1. **流量预测：** 使用三层多层感知器估计交通量和可用停车位。这两个因素在智能城市交通系统中起着重要作用。\n2. **交通标志识别：** 这些系统在降低交通风险方面起着重要作用。交通标志检测和检测标志识别是视频交通序列的理想步骤。\n\
  3. **多层感知器：** 用于交通标志识别。车辆流量在不同时间和地点是不相同的。因此，使用大量数据集训练多层感知器是关重要的。如果接收到的输出与预测输出不一致，应用反向传播算法从过去学习。多层感知器模型降低了错误率，即使在不同的交通标志和光照条件下也能准确预测。\n\
  \n### 5.11.2 车辆分类\n\n使用多层感知器分类车辆。车辆分类的第一步是通过实时摄像头捕捉车辆，然后是从分割中提取特征，最后一步是根据模式识别（不变特征）对车辆进行分类。\n\
  \n使用 `Viola-Jones` 算法检测车辆。`Viola-Jones` 检测算法的组件包括级联分类器、`AdaBoost`、`Haar-Like` 特征和积分图像。`Haar-Like`\
  \ 是一种作为级联分类器输入的矩形特征。在 `AdaBoost` 的每个循环中，从所有其他潜在特征中选择一个特征进行增强，最终的分类将是初始弱分类的线性组合。`Integral\
  \ image` 是计算 `Haar-Like` 特征的快速方法。为了提高处理速度并快速拒绝错误窗口，使用了 `Cascaded classifier` [10]。\n\
  \n## 5.12 交通中的自动编码器和长短期记忆 (LSTM)\n\n### 5.12.1 需求预测和稀有事件\n\n应该增加车辆需求量的地方。使用 `Convolutional-LSTM`\
  \ 根据来自不同输入的时空特征进行需求预测。事故报告在发生后编写。但如果我们能通过 `autoencoder` 预测事故特征并使用 `long, term memory\
  \ (LSTM)` 对流量进行建模，就可以在未来避免事故 [13]。\n\n## 5.13 总结\n\n神经网络的工作类似于人类大脑。人工神经元可以与其他神经元通信，并从过去的数据中学习，以提高预测和决策的准确性。交通影响国家经济。神经网络在使交通智能化方面发挥着至关重要的作用。在本章中，探讨了神经网络的计算能力以及如何在不同的交通应用中实现智能。交通中的问题通过使用不同的神经网络来解决。\n\
  \n以下神经网络方法可用于交通应用，如流量预测、路线规划、车牌检测、停车位识别、车辆密度、旅行时间、自动驾驶车辆、车辆位置、车辆速度、驾驶行为、交通管理等。\n\
  \n1. **卷积神经网络 (CNNs)：** 用于交通应用，如交通特征和交通事件风险预测、车辆识别、交通信号定时、基于需求的交通、自动驾驶车辆 (AVs)、根据交通变化的交通信号灯、车牌识别。\n\
  2. **图神经网络 (GNN)：** 应用预测交通和轨迹。\n3. **循环神经网络 (RNNs)：** 用于驾驶风格分析和车辆需求预测。\n4. **多层感知器：**\
  \ 用于流量预测、交通标志识别、车辆分类。\n5. **需求预测和稀有事件：** 通过自动编码器和 `LSTM` 完成。\n\n\n\n\n\n2. Deepika,\
