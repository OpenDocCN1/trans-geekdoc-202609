  - `VPN`: 虚拟网络\n- `WHO`: 世界卫生组织\n- `WLAN`: 无线局域网\n\n# 前言\n\n人工智能 (`AI`) 正以惊人的速度发展，为提高包括交通领域在内的各行业和企业的性能提供了前所未有的前景。模仿人类大脑运行方式的高级计算方法是\
  \ AI 进展的手段。在交通中使用人工智能旨在解决日益增长的出行需求、`CO[2]` 排放、安全忧虑和环境恶化带来的难题。在这个数字时代，由于大量定量和定性数据以及\
  \ AI 的可用，以更高效有效的方式解决这些挑战已变得可行。\n\n人工神经网络 (`ANN`)、遗传算法 (`GAs`)、模拟退火 (`SA`)、人工免疫系统\
  \ (`AIS`)、蚁群优化算法 (`ACO`)、蜂群优化算法 (`BCO`) 和模糊逻辑模型都是正在进入交通领域 (`FLM`) 的 AI 方法示例。要成功实施\
  \ AI，需要良好掌握 AI 与数据、以及交通系统特征与因素之间的联系。此外，希望交通部门能够建立如何利用这些技术来快速缓解拥堵、使消费者的出行时间更具预测性，并提高其关键资产的经济效益和效率。\n\
  \n在 `21` 世纪初，交通专家和专业人士面临着更复杂的问题。他们面临如何在减少对环境和社区影响的同时，提供安全、高效且可靠的交通。近年来，交通研究人员和从业者越来越关注使用\
  \ AI 范式解决上述某些问题的可行性，以提高交通系统的效率、安全性和环境兼容性。在 `1950s` 代和 `1960s` 代，AI 研究人员经常为该领域设定宏大的目标，例如开发通用问题求解器。相反，作为交通研究人员和专业人士，我们研究交通\
  \ AI 应用的目标要谦虚得多。\n\n本书对涵盖技术、算法和社会要素的智能出行和交通主题的困点和最新进展进行了全面的综述。它研究了面向未来出行的创新服务和平台概念。研究了人工智能原理，以及其在现代硬件架构中的实现。在人工智能的框架下，研究了针对自动驾驶汽车\
  \ (`AVs`) 和车队的新型机器学习 (`ML`) 问题。此外，本书还探究了未来出行概念的人类动力学和社会影响。本书的目的是提供一种智能交通的全面方法。\n\
  \n本书概述了用于解决全球交通挑战的 AI 策略，重点关注交通管理、交通安全、公共交通和城市出行。最后，概述讨论了 AI 在交通应用中的挑战和局限性。本书在满足居民要求的完全原子化交通背景下，研究了云计算、机器学习和通信等现代技术。这将导致交通概念的彻底转变。本书强调了当今安全时代的大多数研究方向，更适合网络安全、机器学习分析、数据分析师、AI\
  \ 研究人员、伦理黑客、学生和学者阅读。\n\n# 第 1 章 智能交通中的人工智能简介\n\n`GAURAV DHUURIYA`, `SHUBHANG SINHA`,\
  \ `DEV AROA`, `TANUL PRABHAT RAI`, `PRASHANT JOHRI`, 和 `DEVANSH ARORA`\n\nGalgotias\
  \ 大学 计算机科学与工程学院，Greater Noida, Uttar Pradesh, India\n\n## 摘要\n\n人工智能 (`AI`) 已经影响了我们生活的世界方式，其影响并没有减缓，反而正在以极快的速度在增加。它创造了一个技术集帮助人类非常轻松地解决问题的世界。AI\
  \ 在几个领域有大量的应用。其中一个领域就是交通，它已经对我们从一个点移动货物到另一个点的方式产生了重大影响。AI 在许多方面帮助了我们的交通，从减少事故数量到交通监控。AI\
  \ 帮助我们提供了更安全、可靠和高效的交通。不仅如此，AI 还让我们能够提供更具经济效益和可持续性的交通，这不仅导致了经济繁荣，还带来了更清洁的环境。它的学习行为不仅带来了计算和监控的改进，也改进了通信。\n\
  \n它处理事物和学习新方法的方式是卓越的，并导致了许多进步。自从引入以来，过去的几十年里见证了它的爆发式增长，其改进目标提升了十倍。AI 引导创新，创新带来更好的处理某事的方法，交通也是如此，无论是\
  \ `tesla` 自驾汽车，还是未来可能充当交通执法并降低人力成本的 AI 驱动机器人，在本章中，我们将详细介绍各种变化的因素和参数下 AI 在交通世界的细节和一些已存在的应用。AI\
  \ 有一套强大的子集，可以进一步阐述它的力量，其中一个子集是机器学习 (`ML`)，它是通过向系统输入数据并让其工作来编程的艺术。这也可以应用于交通领域。用通俗的话说，AI\
  \ 的可能性是无限的，我们必须利用它取得优势。\n\n## 1.1 引言\n\n每天，我们生活的世界都在以快速的速度变化，无论在哪个领域或行业，都有许多新的创新让我们的工作变得更简单。AI\
  \ 在这个不断变化的世界中扮演着巨大的作用，无论是体育、医疗领域还是其他任何领域，AI 都是其变革的核心。交通并不比这些领域，AI 能够使其比以往任何时候都更好。\n\
  \n交通中的人工智能 (`AI`) 帮助我们完成许多任务，例如自动驾驶汽车、引导人员到达目的地、为旅程提供最合适的路径，它导致了事故减少、时间浪费减少、防止了我的事故、提供了天气和交通预报，并主要防止了人为错误。现在我们不再需要处理不可预测性了，因为几乎每个预测现在都可以通过\
  \ AI 的帮助实现。\n\n\n\n\nAI 对全球安全产生了重大影响，这使得城市和社区变得更加安全。交通安全得到了提升，犯罪追踪也变得更加容易，这增强了公众对公共交通工具的认知。\n\
  \nAI 已经开始应用于固定轨道交通工具中，例如铁路和地铁。AI 正在以多种方式为这类交通工具提供协助，例如在互联网上提供座位可用性、路线和其他功能，甚至通过\
  \ App 等设备提供信息。AI 还可以帮助就乘客的目的地向他们提供适当的指导，并在他们到达站点或车站时通知他们。这可以带来进步，即列车或地铁不再由人工操控，而是由\
  \ AI 驱动这些交通工具，这将更加方便，因为可以减少人为失误。在未来，我们可以想象整个交通部门从为人员提供运输等各个方面都由 AI 管理。\n\n航空和海运运输也受益于\
  \ AI，但没有道路运输那么大，尽管它对这一领域产生了重大影响。航空运输就是如此，AI 在安全方面提供了帮助，通过 `facial Recognition` 和其他\
  \ AI 应用帮助追踪正在逃跑的罪犯。它还帮助了追踪非法走私。这些只是提到的几处好处，但 AI 在这些运输领域带来了数以亿计的好处，并在该领域拥有光明的未来，例如在水路运输中，AI\
  \ 可以帮助我们管理导航部分，包括整个路线，甚至帮助在没有人类帮助的情况下传输位置，甚至可能自动锚定船只。AI 正在航空运输领域开辟一条道路，整个飞行将由 AI\
  \ 独立驾驶或由单一飞行员驾驶，因为 AI 现在就可以以自动驾驶模式驾驶飞机。\n\n道路运输是 AI 拥有最稳固地位的地方，在过去的二十年里一直在工作，其工作涵盖了提供无数事务的协助，从提供路线到监控流量。AI\
  \ 对道路交通的影响是巨大的，它改变了人们看待 AI 的方式。AI 在该领域有很多应用，例如最基础的应用是为驾驶员提供协助，引导他们到达目的地，节省他们的时间和精力，因为他们为他们提供了最可靠、最近且高效的路径，防止他们遭遇不必要的拥堵。AI\
  \ 还帮助管理部门监控车辆，因此如果他们违反了任何规则，就可以进行处理。该领域最有前景的应用之一是自动驾驶汽车，这在过去的十年中一直是亮点，是 AI 在交通领域中最具前景的事物，无需驾驶即可旅行一直是一个梦想，现在这个梦想即将变为现实。这不仅可以帮助个人交通，还可以帮助公共交通。自动驾驶车辆正向我们走来，并在短期内为我们提供。\n\
  \nAI 在交通领域有许多有用用处，例如为发生事故的任何人提供协助和医疗急救，AI 在紧急情况下警报当局。AI 还可以以非常容易的速度引导人们，使他们能够应对，从而减少人类时间的浪费。它甚至可以帮助维修，从而避免人类生命的损失（图\
  \ 1.1）。\n\n![图 1.1 智能交通中的人工智能。](img/fig1_1_B.jpg)\n\n图 1.1 智能交通中的人工智能。\n\n## 1.2\
  \ 交通工具中的 AI\n\n### 1.2.1 全球市场\nAI 极大地影响了世界，预计明年还将增长，其中美国的影响力最大。预计在下十年中期将达到 5 万亿美元。\n\
  \n### 1.2.2 通过 AI 干预创造的机会\n在应用程序和互联网的帮助下，AI 可以通过 `Google Maps`、`Apple Map` 等为我们提供最佳路线和旅行路径。因此，这增加了用户的许多满意度。通过基于\
  \ AI 的应用程序如 `Uber`、`Ola` 和 `Rapido`，只需点击一下，交通工具就可以到达家中将您送往目的地。这更安全、更经济，并可以在全球范围内帮助公共交通\
  \ 1。在许多地方都在使用它，其中是美国的经济枢纽纽约，他们计划铺设智能公交轨道，使公共交通更加方便和可靠 15。\n\n### 1.2.3 效率\nAI 最实用的应用之一是安全，道路交通死亡每年导致近\
  \ 200 万人死亡。这在 2011 年还是半数，但在十年内增加了一倍。因此，我们需要 AI 应用的工作来拯救人们免受这些死亡，这些死亡是由于基础设施糟糕和人为失误造成的，并可能由于由于事故的数据未能及时传达而在期间导致不必要的死亡，但在\
  \ AI 的帮助下，我们正在克服这些问题，因为 AI 应用在发生异常情况时会向最近的当局发送信息。最后，自动驾驶汽车正在被开发和测试，它们将以风暴之势席卷世界，据说在下十年中期，每四辆汽车中就有一辆是自动驾驶车辆，气体排放也将减少\
  \ 16。\n\nAI 可以通过提供最合适的路径或路线在很大范围内减少排放，这提高了燃油效率，从而减少了毒气体的排放，防止全球变暖 2。\n\n有很多环保的 AI\
  \ 卡车不仅对交通管理有益，而且帮助我们的环境保持绿色健康。\n\n## 1.3 道路交通中的人工智能 (Ai)\n\n\n\n\n# AI 在道路运输是 AI\
  \ 应用程度最高的领域之一，从路径引导到车辆监控无不包。在单辆车辆中，AI 的应用数不胜数，旨在帮助人类减轻负担。道路运输中的 AI 正处于蓬勃发展阶段，每个人都在探索这一领域，这产生了巨大的经济效益。汽车、技术和研究公司正试图开发利用该领域\
  \ AI 的应用、传感器、控制单元和软件。这导致了市场上交通应用数量的增加，增加了收入并改善了人们的生活 [6]。\n\n## AI 在道路运输中的应用\n\n\
  ### 自动驾驶车辆与卡车编队\n道路运输中有许多 AI 应用，其中之一是用于商业目的的自动车辆。与自主驾驶汽车不同，这些车辆以集群方式工作，即卡车组进行协作，并被称为`卡车编队`\
  \ (truck platooning)。在这种情况下，一组卡车由 `AI` 操控，并保持一定的距离以确保货物安全运输。这正在全球范围内进行测试，以增加一次性运输的货物量。这些`卡车编队`可以在\
  \ `AI` 的帮助由单一司机处理。在这种情况下，司机不需要一直开车，但驾驶可以由 `AI` 独立处理，有时司机需要介入，剩下的行程只需监控情况以确保安全(图\
  \ 1.2)。\n\n![图 1.2 道路控制中的人工智能](img/fig1_2_B.jpg)\n\n图 1.2 道路控制中的人工智能\n\n### 约车与共享出行\n\
  AI 在运输中也可能有许多益处，例如 `Ola`、`Uber`、`Rapido` 等约车服务，这不仅帮助用户无需担心从某处上车，还帮助服务送上门到达他们任何想去的地方\
  \ [15]。人们现在可以拼车，甚至根据他们对所需车辆类型的多种可能性来预订自己的私人车辆。这帮助了那些没有自己车的人，或者不需要在当地乘坐自己的车的人。由于该应用提供了共享功能选项，它还减少了由于许多汽车行驶而产生的排放，导致了路面车辆数量的减少\
  \ [8]。\n\n### 自主移动车辆 (AMVs)\nAI 在道路运输中的其中一种应用是自主移动车辆，简称 `AMVs`。`AMVs` 借助 `AI` 的帮助提供自动驾驶汽车，这些汽车不需要人类的协助，而是独立运行并将乘客运送到目的地。`AMVs`\
  \ 不仅可以应用于个人交通工具，还可以帮助公共交通工具，使其可以在没有驾驶员的情况下运行并同时运载大量人员。这将减少人力投入，并可以防止由于人类驾驶员失误导致的意外事故，同时减少排放并有助于防止全球变暖。目前正在公共道路上进行\
  \ `AMVs` 的测试，它们正处于在独立道路上行驶之前需要通过的各个案例阶段。之一是在大城市中的 `AMVs`，那里的流量很大，且与畅通的高速公路相比，道路更加拥堵。目前仍需进行测试来监控这些街道上的\
  \ `AI` 行为以及它们在这些拥堵街道上的工作情况。\n\n### 路线优化\n为车辆提供到达目的地的路径和方法是道路运输中最常用且被低估的应用之一。它们基于\
  \ `AI` 的原理工作，通过防止交通拥堵并提供最佳路线，帮助人类驾驶员以最短的时间到达位置。它们的目标是通过防止交通拥堵来提供最佳路径，这些拥堵可以通过互联网收集，其他\
  \ `AI` 设备会向其发送信息。它们汇总数据并为司机重新规划路线，以便他们尽可能快到达目的地。\n\n### 交通监控\nAI 还可以通过机器学习 (`ML`)、物联网\
  \ (`IoT`) 等许多技术帮助进行交通监控。道路和高速公路上以等间距设置了摄像头来监控交通流量。在这种情况下，数据由摄像头收集并发送到云端，`AI` 在云端进行过滤处理并跟踪每辆车辆的移动。这可以帮助通过图像识别功能跟踪车辆和人员，并帮助部门在不浪费时间的情况下找到他们。他们甚至可以监控车辆的速度和移动，甚至直接开具罚单并通知司机他们的错误，以便他们不再反复犯同样的错误。它还可以通过这些手段监控交通，并在合适时间派遣部门清理拥堵。它还可能监控人员活动，如果发生任何可疑情况，它可以提醒部门以便其采取相应行动。如果发生事故，它还可以提醒医疗机构，AI\
  \ 在随时提供安全保障方面非常有用。\n\n### 停车与安全\nAI 可以帮助预订停车位，甚至帮助引导驾驶员进入停车位而不浪费时间，并通过随时停止交通来帮助行人和自行车骑手过马路。\n\
  \n## 缺点与担忧\n\nAI 在道路运输中有很多许多益处，但也有许多需要注意的缺点和预防措施。之一是隐私侵犯，如果你汽车上的应用使用 `AI` 被黑，它可能会导致隐私泄露，甚至在未经你同意、甚至在你不知情的情况下监控你的整个活动。\n\
  \n安保是 AI 在道路运输中最大的缺点之一，如果任何公共监控设备或机构数据库被黑入，他们就可以操纵任何人并据此跟踪任何人。这可能导致大规模事故并侵犯每个人的权利。\n\
  \n工作流失是最受关注的话题之一，它影响了人类，并在过程中正在发生。如果 AI 接管了这个世界，将出现一个不再需要大量人类帮助的时代，这让人们不确定是否还能拥有工作。\n\
  \n最后，一个需求的话题是将驾驶权完全交给 AI 是否安全？我们应该切换到无人驾驶车辆吗？是非常令人担忧的话题，因为如果我们把所有权利交给 AI 并移除任何形式的支持，如果发生事故并导致生命和财产损失，谁来负责？由于\
  \ `AMVs` 的主要目标是让司机放松并让 AI 处理一切，仅在紧急情况下才寻求乘客的帮助 [15]。如果紧急情况发生且没有时间浪费该怎么办？这是一个主要的担忧，因为如果司机正在放松，他如何能如此快速地控制任何东西，如果没有时间采取任何行动怎么办？科学家们对此进行辩论，他们仍然没有理由指责某个特定的人，他们应该指责车主、制造这些车辆的公司主，还是采取该行动的\
  \ AI？\n\n\n\n\n曾经进行过一项调查，以探讨在汽车事故时应该保护谁的安全，是救救车司机还是 10 英尺外的步行者。在 във调查中，10 人中有 9\
  \ 人认为应该保护那 10 名乘客，因为牺牲一个人的代价可以挽救 10 条生命。但 AI 在这种情况下或任何类似情况下会做什么？我们对这些问题没有答案，因为我们不知道\
  \ AI 在这种情况下会做什么，在此时会保障谁的安全，以及如果发生这种情况，应该由谁来承担责任。\n\n尽管 AI 在道路交通中非常有用，但我们不应忽视它可能犯任何不必要的错误，这可能会对社会造成危害。人们担心\
  \ AI 算法会自主地自动化伦理决策，或者其中是否应该有人为干预。只要我们能够对其控制并持续监控，直到它每次都能做出正确的决策，AI 在交通领域就是非常有用的。\n\
  \n## 1.4 智能地铁站中的人工智能 (Ai)\n\n阿拉伯联酋负责交通的部门已鼓励在迪拜的地铁服务中大量使用 `ML` 和 `AI`。这些新先进的 `AI`\
  \ 和 `ML` 将在大多数车站的高峰时段支持人流管理，特别是在音乐会等大型公共活动之后 [19]]。\n\n该项目的意是建立一个带有 `AI` 的交互式地铁系统，轻松高效地满足乘客的日常需求。此外，该项目旨在通过为列车引入某些模式来控制调度中的拥堵和其他重要因素，从而改变地铁乘客的旅行时间。该子项目需要一个扩展的地铁副本/模型来控制全天的地铁车运行。它考虑了票务数据、地铁访问和请求的\
  \ `Algorithms`、显示屏以及关于用户行程的深度信息。\n\n该方案的结果意味着，在工作高峰期和大型公共活动/场合期间，地铁在特定或固定位置服务了约\
  \ 40% 到 80% 的乘客，这在人群和更频繁的运行中有所体现 [21]]。\n\n该模型的演示复制品显示，用户在繁忙时段的移动会导致交通拥堵间隔，并增加用户/乘客在登乘地铁前的等待时间。幸运的是，`AI`\
  \ 和 `ML` 的广泛且智能的使用将这种堵塞减少了 40–60%，并将站立时间缩短至半小时（图 1.3）。\n\n![Figure 1.3 智能地铁系统中的人工智能](img/fig1_3_B.jpg)\n\
  \n图 1.3 智能地铁系统中的人工智能\n\n`AI` 技术提供了特定的时段，并通过允许用户特定的乘车时间重塑了增强消费者便利性的愿望，使他们能够在需要的时间到达目的地。尽管如此，这些用户利益正在调查中，同时也在确认其实用性以及短期实施项目的可行性\
  \ [21]]。\n\n这归功于统一的技术基础，因为现在 `RTA` 完全有能力针对反对找到智能的解释。\n\n## 1.5 智能轨道交通中的人工智能 (Ai)\n\
  \n`AI` 和 `ML` 正在强烈影响着我们的私人和...\n\n... (此处文本省略，根据指令要求排版，后续逻辑将遵循上述规则) ...\n\n## 1.6\
  \ 自动列车运行系统\n\n在铁路部门和领域实施 `AI` 的主要说明是使其列车功能/运行变得自动化 [12]]。\n\n\n\n\n列车运行自动化将控制权的责任交给了铁路调度系统的操作员，但独立性的水平/程度是非恒定且不一致的。`IEC`（国际电工委员会）发现了四种传统的轨道机械化水平：`3^(rd)`\
  \ 级对应于全自动功能/操作，不需要驾驶员；而 `4^(th)` 级对应于离散（自动化）列车运行。上述水平已在组合列车系统和城市轨道交通系统中投入使用。迪拜的穆马克图姆国际机场采用一种独特的轨道模型，作为乘客在航站楼之间往的完全专属轨道。这利用了\
  \ `SelTrac`，这是一种自动化列车信号技术，被设计为自动控制轨道 [12]。\n\n`SMRTL`（新加坡地铁系统）作为全球最大的自动化地铁系统，是`4^(th)`\
  \ 级机械化铁路运输系统的极佳范例。\n\n在欧洲，启动列车运行自动化和 AI 辅助铁路的主要理念是部署 `ERTMS`（欧洲铁路交通管理系统），该系统配备了自动驾驶员补偿技术的列车。\n\
  \n如今，先进的 AI 技术产生了一个强大的单元，用以改进并助力 AI 驱动铁路的进步前景。随着汽车、轨道等多式联运的预期增加，相关模型/项目正在启动，以更好地规划轨道网络上的船器移动并改进实时数据信息的交换。AI\
  \ 在其中可能发挥至关重要的作用。\n\n## 1.7 智能交通控制中的 AI\n\n一个国家的经济直接受到改善旅行道路安排的影响。网络管理和交通监控也是政府必须关注的问题。信号系统设计不当，且交通规则被规避。这涉及到交通侵入导致交通管理资源的堵塞和故障，导致错误的人被指控违法。各种交叉路口的交通拥堵导致全球变暖和污染，引起城市空气污染，由于燃料大量燃烧，对于必须在车内等待数小时的乘客来说，变得非常有挑战性。今天的交通管理系统缺乏计划且容易产生人为错误。人口日益增长，每日乘客增加，道路狭窄且存在全球贸易，由于这些原因，交通流监控在许多国家变得至关重要。\n\
  \n在技术爆炸之后，带有智能计算机的软件接管了常规运行方案。范围内，智能交通管理系统通过票务自动化、严格的交通违规监管、安全的公共空间以及许多大城市交通拥堵的先进解决方案提供了改进\
  \ [13]。AI、控制的 `ML`、计算机视觉、先进的 IoT 技术和大数据使用了实时解决方案解决交通管理问题。智能交通管理系统包括路灯、主动公路、高分辨率\
  \ 3D 监控摄像头、主动道路和计算机辅助运输显示系统。根据统计报告，到 2030 年，智能交通管理计划预计达到`250 亿美元`，增长`8.6%`。为了提供更好的产品，智能交通管理的研究正在进行。\n\
  \n系统的其他目标是：\n\n*   通过电子账单支付系统创建标准票务；\n*   使用速度传感器在限速时警告乘客和司机；\n*   地理交通系统提供拥堵的实时信息；\n\
  *   AI 驱动的监控有助于改善交通流；\n*   大数据和 IoT 技术增强交通管理；\n*   先进的传感器和摄像头减少了交通事故；\n*   标准化票务和电子支付集成；\n\
  *   车辆的实时数据交换。\n\n### 1.7.1 智能交通控制\n\n许多城市都有预定义的交通方法，但这种系统的缺点是产生了对智能交通控制的需求。智能交通控制的组件包括智能路灯、主动公路和计算机辅助运输显示系统。这些组件定义如下：\n\
  \n1.  **智能路灯**：智能信号通过使用传感器监控交通位置来减少空闲时间。\n2.  **中央控制中心**：中央控制系统与信号、交通辐射和摄像头集成。基于\
  \ AI 的系统从交通状况收集实时数据，有助于信号的操作(图 1.5)。\n\n    ![图 1.5 智能交通控制系统。](img/fig1_5.jpg)\n\
  \n    图 1.5 智能交通控制系统。\n3.  **AI 驱动的摄像头和线路系统**：线路系统和摄像头在调度系统中更新实时交通状态。调度系统随后有助于克服污染\
  \ [3]。\n\n### 1.7.2 智能交通监控系统\n\n智能交通监控系统的重要组件是 IoT 驱动的智能通信系统大数据工具。定义该系统的技术组件是智能道路、智能停车、交通灯和公共交通。这些系统通过通过\
  \ IoT 启的信息提供卓越支持，通过自动化改变了票务的正常功能。集成传感器服务、汽车信息系统和用于定位的私车辆跟踪设备。数据通过停车位相关的应用程序访问。\n\
  \n\n\n\n交通控制灯是历史交通管理系统处理的唯一对象。算法在解决这一问题方面非常有限，而专家系统（`ES`）解决方案也并非最佳，因为它们仅在小规模信号网络中显示出有效结果。结果，州际公路管理、应急响应、天桥系统和公共交通的管理需求一直被忽视了。为了实现先进的交通管理，佐治亚理工学院开发了一套分布式黑板系统，用于大型城市地区。为了解决出现在黑板各种数据结构上的个人车辆控制问题，利用了如帧、神经网络表示、法律和脚本\
  \ `[4]` 等资源。交通的控制、监控、拥堵、事件管理以及动态通信方面存在问题，系统中的资源也处理这些问题。随后形成交通管理决策，并在稍后通过仿真进行评估。\n\
  \n某些 `ATMS` 活动包括以下内容：\n\n*   上述路灯的联动显示；\n*   拥堵高速公路上的匝道流量控制；\n*   交通流建模并预测；\n* \
  \  进行交通监控；\n*   执行交通法规；\n*   检测事件的算法；\n*   开启可逆向和反向路线；\n*   道路的控制与监控；\n*   需求管理；\n\
  *   自动收费的集合；\n*   应急/警察车辆的应用。\n\n先进交通管理系统（`ATMS`）通过有效管理可用交通资源来响应动态交通状况。所有运输模式必须包含在先进车辆控制系统（`VCS`）中，以便提供如出租车、卡车和其他各种车辆的管理解决方案。先进旅客信息系统（`ATIS`）为旅客提供任何给定区域的选项、信息和特殊事件。住宿详情和服务也将提供给旅客。因此，`ATIS`\
  \ 被视为 `ATMS` 构建的支持系统。交通拥堵报告、警察或社区安全报告、车辆管理决策、模型预测、船期时刻表和状态、卡车交易、活动时间表、参与者、旅行和状态日程、机场时刻表和状态、紧急电话、事故报告、道路路段、贸易交通报告、天气预报、街道传感器、视频摄像头、手机、景点、住宿指南、服务目录都是包含在\
  \ `ATIS` 中的输入。`ATIS` 还向旅客提供有关服务存在和可用性的信息、车祸警告和路标志、你可以采取的最佳路线、最佳可用旅行、停车可用性以及白天预测的拥密区域信息\
  \ `[5]`。\n\n控制决策利用 `ATIS` 数据库应用于所有交通方面，通过 `ATMs` 管理交通。环境方面也得到了考虑（如果有的话交通污染），并通过所做出的决策使交通变得更容易。交通控制、事故管理和驾驶信息系统是\
  \ `ATM` 用于维持交通顺畅的基本元素。`ATMS` 使用许多方法管理交通。它们包括：\n\n*   可逆路线；\n*   信号灯；\n*   对车辆的危险警示；\n\
  *   灵活路标；\n*   交通标志；\n*   测量表；以及\n*   应急车辆信号。\n\n为了维持交通流，这些子系统必须协同工作。如果交通控制系统无法提醒驾驶员避开问题区域并响应事故，它将毫无用\
  \ `[23]`。许多国家仍在努力实施管理系统的基础，而许多国家已经完成。这显示了 `ATMS` 的部署阶段。许多现代系统具有灵活的控制能力，交通控制算法不仅仅是日常信号系统的简单时间线，它们远不止于。为了评估停止时间、减少平均队列并确定对交通的负面影响，使用了控制算法，即\
  \ `SCOOT` 和 `TRANSYT`。英国和中国目前使用 `SCOOT` 系统。然而，`SCOOT` 系统需要调整初始系统参数，以确保其模型符合交通可见性。为了确保系统性能，还需要定期的更新。台湾国立成功大学开发了控制动态交通的计算机系统。\n\
  \n存在一些现有的街道模式和预设表格。基于此，`COMDYCS-I` 在其第一个程序中设置信号时间表。而 `COMDYCS-III` 则通过步进调整信号定时并使用预定义的交通模型，从逻辑上确定信号时间程序。洛杉矶自动化交通监控与控制系统是一个响应极快的控制系统，用于控制信号灯。通过将实际数据与可用数据比较来选择信号时间系统。`ATSAC`\
  \ 的未来计划是开发一个专门的程序，协助识别非经常性拥堵，并为减少各类非经常性事件的流量提供帮助 `[23]`。悉尼自适应交通系统在澳大利亚开发，但在香港和新加坡发行，是世界上最先进的系统之一。从本地计算机收集实时交通数据，然后传输到中央区域计算机。这是通过\
  \ `SCATS` 系统完成的。然后中央计算机根据先前的收集的信息选择信号定时计划。\n\n然而，这些系统中的参数由中央计算机根据局部的实时响应进行优化，以优化交通流。`TERMINUS`\
  \ 使用神经网络来扩展系统哲学，创建实时交通流数据并确定使流量高度高效的信号灯设置。它使用在本地收集的实时数据来确定信号灯配置，就像 `SCATS` 那样。然而，在\
  \ `TERMINUS` 中，根据当前状态实时确定不同的配置。因此，系统获得了更大的灵活性，因为日常交通中发生的不同情况无法通过非常复杂的系统进行跟踪。\n\n\
  \n\n在城市中，交通拥堵且异常繁忙；例如波士顿，那里的驾驶员目睹了该国最严重的州际高速网堵锁。这座英国城市的人口平均在道路上闲散地等待交通状态不变的时间高达\
  \ 174 小时，这导致了至少 2,291 美元的损失。因此，拥堵的交通管理可能会导致金钱和时间的损失。莫斯科的通勤者每年因交通/道路管理不当损失约 210 小时。作为回应，相关部门和机构正准备实施\
  \ AI 和 ML 来解决/减少交通拥堵和堵锁。在大型活动（特别是节日）期间，也会出现类似的交通拥堵情况。每个城市都有自己独特的挑战，但解决这些挑战的方案可以是相同的。利用\
  \ AI 和 ML 解决这些挑战可以产生极高的效率，因为我们可以预测节日期间的交通状况，并根据预测的交通状态进行实际管理，类似于灾害管理 [18]..。\n\n\
  各国正在研究 AI 和 ML 来解决这些交通相关的问题。AI 和 ML 有与云技术相关的策略，可以有效地连接政府、汽车或任何运输资产、人口，然后通过相互协调来优化或减少交通拥堵的可能性\
  \ [11]。为了更好地理解，云平台可以比作军队的指挥塔，它提供指令以实现更好的协调并避免混乱。这些基于云的 AI 层级确保提供者通过为异质运输资产提供大量的准备、管理、协议、预知和市场科学理解，来确保运输功能/目标的实现。\n\
  \n整个过程需要消除城市中单一的责任机构，这将导致第三方的干预并产生良好影响，因为它可以将整个系统塑成一个更具责任感和更可持续的计划，这比现在拥有独立的运输辅助品牌要好得多。\n\
  \n这种节日控制系统需要考虑非节日期间发生的实时情况并进行处理。例如，在迈阿密的高速公路桥上，如果司机和乘客陷入高于平均水平的交通状况，等待时间为 10 到 20\
  \ 分钟，现在这可以作为一个建模问题来解决节日相关问题，因为我们可以为算法提供学习数据，然后预测未来的交通状态并据此开展。\n\n在全球范围内，先进交通解决方案的应用正在投入使用。虽然其中一些重点非常关注可持续的自动驾驶运输资产技术，这些由\
  \ AI 和 ML 驱动的平台正导致运输领域领域前所未有的进步。\n\n这些资产正被按照前面提到的主塔连接方法，用于与市政公司和个人相关的自动驾驶、人工驾驶相结合使用。通过对此进行增强，我们实际上可以使用这些基于\
  \ AI 的资产进行节日交通控制，例如，我们可以利用这些自动驾驶资产在节日期间进行额外工作，这实际上将节省我们在特定日期的个人时间和空间，这些资产还有其他实际用途。\n\
  \n在这种实施方法中，受 AI 和 ML 启发的平台允许使用任何类型的车辆资产来规划、建立和控制服务的管理。这允许提供者之间具有流动性，以提供运输人员所需的交付物，例如叫车。\n\
  \n\n\n\n幸运的是，预测自然灾害的技术和过程不断向更先进、更准确的系统进化，使得像 `FEMA`、`NASA` 和 `NOAA` 等国家技术机构能够设计协议和解决方案。这些机构利用来自卫星图像、传感器等各种来源的数据来预测自然灾害，并提前找到它们的解决方案。例如，自然应急部门可以利用\
  \ `AI` 和云端软件轻松查看状况，并对警报塔和相关政府部门就台风和热带灾害等灾害发出警报。此外，还可以利用树木上的传感器收集并使用数据，以应对在世界某些地区非常常见的阵风（气流）。另一个例子是\
  \ `SkyAlert`，这是一款在墨西哥用于相同目的的高级功能应用程序。它利用了手机、电脑等设备；此外还有另一个极佳的例子是在微软的云平台 `Azure` 上使用\
  \ `IoT` 技术，在地震或任何此类事件发生之前警报数百万万人，这最终让用户能够在灾害来袭前迅速逃离并撤离 [17]。\n\n### 1.9.2 细粒度准备\n\
  \n`AI` 和 `IoT` 等先进技术被安装在公路、道路、建筑上，以获取数据和实时案例，然后这些数据被发送到一个机构，该机构从捕获的数据中提取有意义的信息，并用其改进整体体验\
  \ [18]。这些运营技术可以成为强大的防御屏障，在自然灾害期间为人们提供快速的即时服务，而不会产生恐慌和人力损失。与目前一些基于模拟信号的运行模型相比，这些基于\
  \ `AI` 的模型是对当前系统的惊人升级，并将持续不断增长。\n\n代表城镇或小城市的较小级别委员会也可以利用 `AI` 和 `IoT` 来预测其区域的自然灾害，并向民众发出应对计划警告，通过警报和疏散受影响区域来确保他们的安全。在现实世界的灾害场景中，`AI`\
  \ 和 `ML` 可以根据每个个人或群体的相对位置，不断向大众告知逃生或避免损坏的安全路线，从而大显用场。如果民众愿意理解其像 `WhatsApp` 那样的工作原理，`AI`\
  \ 可以告诉他们走哪条路线而不会引起任何拥堵或混乱。这里有一个使用相对定位进行疏散的好例子。如果体育场或购物中心发生爆炸或自然灾害，基于 `AI` 的模型实际上可以帮助人们找到最佳出口，并告知避开哪些出口，这将是该领域的巨大进步。\n\
  \n### 1.9.3 更高效地响应\n\n任何自然灾害发生后的头三天至关重要。不同的组织或相关机构应该制定协议，建立援助功能，寻找任何可以被营救或帮助的人员，并启动计划以确保不会因灾害产生或尽可能减少环境变化。`AI`\
  \ 和物联网（`IoT`）可以在提供深度洞察方面提供巨大帮助，这些洞察可用于改进灾害交通，例如 [19]：\n\n* 来自政府的航空视角和空间设备的图像；\n\
  * 物联网和基于 `AI` 的数据；\n* 人工智能驱动的聊天机器人；\n* 与云相关的社交媒体。\n\n以下方法将协助相关部门预测所需的救援物资、规划疏散协议，并避免消耗时间和资源的无意义步骤，但前提是这些信息是可以解析的。如果给\
  \ `AI` 反馈过去灾害的数据，它就能在灾害实际到达之前检测到它们，而且随着时间的推移也可以生成新数据，因此针对自然灾害的 `AI` 预测模型将不断改进。基于\
  \ `ML` 的模型也是如此，它们可以极高准确地预测任何类型的灾害 [20]。\n\n例如，一座大型公共建筑受到自然灾害影响，他们可以获得基于 `AI` 的帮助。使用基于\
  \ `AI` 技术，安全团队可以为被困或受影响的人们制定援助计划，该计划将考虑受影响建筑的设计和整体并据此行动，扫描附近区域并查看有多少人需要帮助，从而为救援小组提供更好的思路。它还可以确定受影响的交通资产，并利用\
  \ `google maps` 或类似工具帮助他们找到离开红区的更好方法；最后但同样重要的一点是，它可以在灾害期间或之后协助交通，从而减少拥堵并以更顺畅的方式确保人的安全。将\
  \ `AI`、`IoT` 与结合使用手机等设备的云端模型相结合，可以在灾害期间实现更快的交通管理。在未来，当我们拥有足够的知识和资源时，基于 `AI` 的机器人也是可能的，它将在灾害导致的拥堵交通情况下提供快速且安全的护理\
  \ [18]。\n\n### 1.9.4 通过分析进行进规划和援助工作\n\n`AI` 和 `ML` 在为交通官员提供援助方面也将非常重要，它们将允许他们在灾害发生时优先帮助受影响和需要帮助的人，并缩短援助阈值时间，证明这对双方都是至关重要的。可以实施\
  \ `AI` 通过考虑季节历史、灾害历史、常规交通趋势等许多参数，搜索或预测受自然灾害影响最大的（将要）区域，通过这种方式，部门可以制定帮助该区域车辆的计划以及一份应急蓝图。这些发现和数据还可以用于在预测为受影响较严重的区域建造更具抗灾能力的建筑或公路，这样就可以很容易地避免自然财产损失\
  \ [19]。\n\n某些灾害是不可避免的，但大多数灾害可以在道路上避免，或者至少可以减少影响，因为我们拥有 `AI` 能力在灾害演变成更大问题之前进行预防和预判，现在历史数据在处理交通问题时被证明是至关重要的，我们可以准备并管理道路交通疏散计划，这将减少受人数和交通资产损失\
  \ [19]。\n\n在自然灾害期间，`AI` 将作为一个监督者和非常负责任的角色，因为 `AI` 的潜力在某种程度上取决于数据，而我们有足够的数据源来创建一个基于\
  \ `AI` 的终极灾害交通管理器，就在未来。\n\n## 1.10 与社交媒体相关的交通控制\n\n目前，全球各城市面临许多与交通拥堵相关的问题。车辆（无论是私人还是公共交通）的增加是拥堵期间的大问题。因此，各国家的收入正在减少。这一原因导致在拥堵期间浪费了大量时间。然而，拥堵还引发了巨大的风险，包括拥堵期间的车辆盗窃。\n\
  \n根据上述原因，交通拥堵每年浪费浪费 50 亿单位电力和 20 亿加仑燃烧燃料。\n\n\n\n\n\n城市中的警察和医疗服务等紧急服务部门，由于驾驶员鲁莽驾驶和违反交通规则，导致车辆冲突日益增加。车辆数量的增加是道路拥堵的另一个原因。据此，道路维护不力、交通规划不合理、公共交通也缺乏管理，所有这一切为交通拥堵造成了巨大问题，由于交通管理不当，人们在城市中面临着严峻的情况。为了管理交通拥堵，人们需要了解道路上事件发生的实际时间。交通拥堵有两种类型：周期性拥堵和非周期性拥堵。\n\
  \n### 周期性交通\n这指的是每次都有大量车辆使用有限的道路空间。\n\n### 非周期性交通\n这指的是如天气状况、事故、车辆故障等事件，以及节假日庆典等，这些都是随机且无计划的事件。\n\
  \n据此，非周期性交通是由周期性事件复合而成的。因此，作为传统交通控制方法的交通灯在适用的各种道路上无法发挥作用。然而，这对交通的顺畅运行产生了负面影响。根据情况，交通警察应该控制和管理交通，以便我们能够在拥堵期间解决问题\
  \ [7]。现在，社交网络在我们的日常生活中非常重要。社交媒体将数据与图片或视频相结合，对任何情况进行良好的解释。它提供了由研究支持的实时信息。\n\n应该减轻交通拥堵的影响，并使政策选择更有据可。如果发生任何类似的危机，应该借鉴其经验来应对此类危机。道路交通管理受到社交媒体的广泛且深入的影响。道路封锁、事故以及道路上的其他类似情况也通过社交媒体进行发布\
  \ [7]。\n\n为了管理道路上巨大的堵塞，利用了社交媒体的意见和建议。城市的交通拥堵引发了社交媒体的批评，这通过文学性的建议表现出来。这种讨论的激活清楚地表明，这些信息是通过网络开发和获取的。个人在各种平台的多个群组中也非常活跃。因此，`Facebook`\
  \ 是全球范围内引导和控制道路交通管理最流行的平台。另一个社交媒体平台是 `Twitter`，它在控制和引导城市交通管理方面发挥了非常重要的作用。据此，不同国家采取了与控制道路交通问题相关的策略。因此，小群是社交媒体的基本组成部分，成员在那里体验各种选择。这些非周期性交通不仅导致了对权威的一一会话式批评，还出现在各种网络站点和社交媒体账号上\
  \ [9]。\n\n## 自动驾驶交通工具\n自动驾驶车辆是正在发生的交通领域大事，正处于进行阶段。自动驾驶车辆测试正在全球范围内，甚至有些车辆已经在高速公路上自主运行。`ATVs`\
  \ 进入道路将改变我们看待交通的方式，并将在整个运输行业内创造巨大的转额 [21]。`ATVs` 将开启一个新时代，车辆的控制权将从用户转移到 `AI`，这将\
  \ `AI` 首次接管整个车辆，而人类只是在场观察。在 `AI` 传感器、应用程序、追踪器的帮助下，`ATVs` 的工作非常简单，它们将监控周围环境并此移动。它们甚至可以对其他汽车的突然移动做出反应，并相应改变路线。`AI`\
  \ 在 `ATVs` 中发挥着至关重要的作用，没有 `AI` `ATVs` 就无法在道路上运行。许多私人公司正致力于制造第一种可以在道路上轻松运行的安全 `ATV`。许多公司正在高速公路上测试它们的\
  \ `ATVs`，有些甚至准备好在大都市街道上运行。如果他们成功完成了测试，他们将席卷整个运输系统，但他们可以产生不可估量的收入。`ATVs` 不仅影响私人，还将对公共部门产生巨大影响。随着它们进入公共部门，它们不仅可以接管道路运输，还可以接管航空和海运。不可否认，`ATVs`\
  \ 中的 `AI` 反应更快、更负责任、更有效、更方便且更经济。与人类感官相比，它的反应更快 [10]。\n\n但 `ATVs` 的出现也带来了一些担忧，我们对这些担忧还没有任何解决方案。首先，如果\
  \ `AI` 犯了错误并导致了严重事故，甚至对财产和生命造成损害，谁来承担责任？是车主、制造该车辆的公司，还是操作车辆的 `AI`？由于 `ATVs` 的主要目标是在无人干预的情况下运行，仅在需要时咨询人类，如果人类在给定时间内无法接管会发生什么？这是很有可能的，正如测试所示，当你前一秒还在休息时，在一秒内无法处理巨大的压力，人类大脑反应需要时间，所以我们不能指怪用户的任何事情，甚至不能指怪那些经过全面测试和政府批准后投放运行的公司。对于\
  \ `AI` 来说，你不能指责或控告一个非生物。这种担忧是巨大的，而且由于没有关于 `AI` 的法律，我们无法保证在发生此类事件时我们是安全的。因此，应该有一些涵盖\
  \ `AI` 参与 `ATVs` 的规则和法规 [22]。\n\n## 风险与挑战\n无疑，`AI` 可以显著提高效率和生产力，但它也可能产生需要管理的和社会经济后果。以下提到了一些最严重的后果：\n\
  \n1. **失业**：根据全球政策解决方案中心的一份报告，看到在美国向 `AVs` 过渡的过程中，可能会失去超过 400 万份工作，包括公交司机、出租车司机等。`Ai`\
  \ 可以通过促进已经建立的经济模型的发展，加速运输等领域低技能工人的失业，因为这促进了向服务经济的转型。\n2. **监管要求**：当 `AI` 系统像人类一样犯错时，很难预测监管要求应该是什么。尽管研究表明\
  \ `AVs` 减少了交通事故导致的死亡人数，但要理解如果 `AV` 发生任何意外或伤害，谁可能负责并不是容易的。\n3. **隐私担忧**：对于 `ML` 必须有强大的隐私法，要求用户选择并提供个人数据。社交网络上的过量信息应该与隐私法律之间取得平衡。\n\
  4. **技能和教育缺乏**：在发达国家，对 `AI` 的投资正在增长，因此过去几年来 `AI` 专家的需求很大，但采用 `AI` 的最大障碍是技能 `AI`\
  \ 人才的短缺。`AI` 是一种具有社会经济影响的技术，这就是为什么发达国家很难成功利用它的。为了从 `AI` 中获得最大的利益，发达国家需要时间培养人才并建立有效的业务战略。\n\
  \n\n\n\n\n### 5. 成本\n在运输行业中，看来 AI 的进展并不顺利。主要原因是 AI 系统的价格过高。低成本和欠发达的国家未能充分利用 AI 在运输行业中的应用，因为它们尚未准备好实施\
  \ AI 系统，也无法为这些系统提供服务。为了充分利用运输领域 AI 系统的力量，各国必须对 AI 进行投资，而那些不投资这些系统的国家可能可能难以充分利用 AI\
  \ 的力量。\n\n## 1.13 结论\nAI 及其子集（如机器学习等）具有指数级增加许多公共和私营部门（包括运输业）积极输出和利润的潜力。这些变化并没有某些人想象的那么遥远，人们在日常生活中就能观察到这些变化。AI\
  \ 正在让普通大众的交通变得更安全、更快、更便利，而且这种趋势将持续增长。例如，AI 驱动的无人机正在阿富汗和非洲农村地区运送药品和其他必需品；日本有 AI 驱动的交通管理系统可以减少排放、交通拥堵和污染；还有像特斯拉这样的自动汽车以及中国的货运穿梭机，其中一些先进到甚至不需要驾驶员。在提高性能和耐用性并带来更多积极影响的同时，也存在一些与社会、人口、工业和政治挑战相关的负面影响，必须解决这些问题以实现\
  \ AI 演进在社会各领域的和平利用以及广大民众的普遍利益，这也包括运输业 [14]。\n\n## 关键词\n\n## 参考文献\n1. Zhang, Y.,\
