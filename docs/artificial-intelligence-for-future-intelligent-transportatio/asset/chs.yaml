  图 10.13 AI 技术比较。\n\n### 10.3 未来智能服务的兴起 AI 技术\n\n#### 10.3.1 深度学习技术\n\n深度学习是 `ML`\
  \ 的一个子类，它深度分析设备产生的海量数据，并为复杂问题提供更好的解决方案。因此，深度学习技术适用于交通、车道检测、识别最佳路线、防止事故以及寻找附近的物体。\n\
  \n* 卷积神经网络；\n* 神经网络；\n* 长记忆；\n* 双向长记忆；\n* 门控循环单元 (`GRU`)；\n* 基于注意的 `GRU`。\n\n###\
  \ 10.3.2 卷积神经网络 (Cnn)\n\n网络 [2], 3] 包含 5 层，即输入层、卷积层、池化层、全连接层和输出层。输入层用于接受用户的输入，卷积层和池化层用于从给定输入中检测特征，最后全连接层和输出层作为分类器根据特征预测类别。在智能交通系统中，卷积神经网络\
  \ (`CNN`) 适用于交通标志识别、车辆分类、交通拥堵程度检测以及道路上的行人检测。图 10.14 展示了 `CNN` 的基本架构。\n\n![图 10.14\
  \ CNN 的架构。](img/fig10_14_B.jpg)\n\n图 10.14 CNN 的架构。\n\n在 `CNN` 中，激活函数是重要因素之一，它决定了哪些神经元将被激活并传递到后续层。各种激活函数如图图\
  \ 10.15 所示。\n\n![图 10.15 激活函数。](img/fig10_15_B.jpg)\n\n图 10.15 激活函数。\n\n有多种 `CNN`\
  \ 模型可用于升级系统性能。将根据有效预测输出类别的性能来选择最佳模型。不同的 `CNN` 架构列在图 10.16 中。\n\n\n\n\n\n![图 10.16\
  \ 卷积神经网络的不同模型。](img/fig10_16_B.jpg)\n\n图 10.16 卷积神经网络的不同模型\n\n### 10.3.3 循环神经网络\
  \ (Rnn)\n\n循环神经网络 (`RNN`) 是一种监督深度学习技术，用于动态捕捉数据序列。在 `RNN` [1] 中，当前输入的输出取决于上一步的计算；它将输出复制并传回给\
  \ `RNN`。\n\n循环网络具有内部记忆，可以记住过去的计算结果，它使用两个输入，例如当前输入和最近的前一次输入。`RNN` 包含一个网络序列，通过反向传播逐个训练每个神经元。在智能交通系统中，`RNN`\
  \ 对于处理顺序交通数据以进行交通预测、路径预测以及监控道路车辆速度至关重要。`RNN` 的基本结构如图图 10.17 所示。\n\n![图 10.17 RNN\
  \ 的结构。](img/fig10_17_B.jpg)\n\n图 10.17 RNN 的结构\n\n### 10.3.4 长短期记忆\n\n`LSTM` [2,\
  \ 3] 是 `RNNs` 的扩展，它扩展了内部记忆以存储过去的计算结果，并能长时间记住输入数据。它可以执行所有操作，如从内部记忆中读取信息、写入信息和删除信息。`RNN`\
  \ 受到梯度消失点的影响，这会降低网络性能。因此，引入 `LSTM` 是为梯度消失问题提供合适的解决方案。\n\n在隐藏层的每个单元中，`LSTM` 网络展示了\
  \ 3 个门。这些门用于控制在神经网络中寻找输出所需的信息流。这些门列举如下：\n\n- 输入门：确定新的输入；\n- 遗忘门：如果不需要则删除细节；\n- 输出门：显示当前时间戳的输出。\n\
  \n在智能交通系统 (ITS) 中，`LSTM` 对于预测道路交通流、提供交通信息服务和拥堵预测具有重要意义。\n\n### 10.3.5 Bi-Lstm (双向长短期记忆)\n\
  \n`RNN` 通过在传统神经网络中引入隐藏层来记住过去的信息。对于时间序列问题，`Bi-LSTM`（双向长短期记忆）非常有用。它根据过去的输入预测下一个输出。它通过在网络系统中引入门来实现这一点。在\
  \ `Bi-LSTM` 中，两个独立的 `RNNs` 连接在一起形成一个网络。通过这种方式，它可以记住每个时间步上关于给定输入的正向和反向信息（图 10.18）。\n\
  \n![图 10.18 Bi-LSTM 网络。](img/fig10_18_B.jpg)\n\n图 10.18 Bi-LSTM 网络\n\n`Bi-LSTM`\
  \ 的基础是长短期记忆 (`LSTM`)，它由 3 个不同的门组成：输入门、输出门和遗忘门。它在处理输入值时不仅使用候选值，还使用激活值。它产生两个输出值，即激活值和候选值。\n\
  \n候选值的计算公式为：\n\n*C*^(*N*) = tanh (*W*[*c*]\\[*a*^( < *t* − 1>),*x*^( < *t*\\>)\\\
  ]+*b*[*c*]) \n\n其中；`W` 是输入的权重值；`a` 是激活值；`x` 是输入；`b` 是偏置。\n\n在给定时间 `t` 下 `Bi-LSTM`\
  \ 网络的输出 `ŷ` 是通过正向和反向两个激活得到的：\n\n$$\n{\\\\hat{y}}^{< t >} = g\\left( W_{y}\\left\\\
  \\lbrack {\\\\overset{\\\\rightarrow}{a}}^{< t >},{\\\\overset{\\\\leftarrow}{a}}^{<\
  \ t >} \\\\right]\\\\rbrack + b_{y} \\right)\n$$ \n\n在该方程中：\n\n$$\n\\begin{array}{l}\
  \ \\\\ \\\\ \\\\left. {\\\\overset{\\\\rightarrow}{a}}^{< t >}\\\\rightarrow Forward\\\
  \\, Activation \\\\right. \\\\ \\\\ \\\\ \\\\ \\\\left. {\\\\overset{\\\\leftarrow}{a}}^{<\
  \ t >}\\\\rightarrow Backward\\\\, Activation \\\\right. \\\\ \\\\ \\\\end{array}\n\
  $$\n\n由于 `Bi-LSTM` 有两个循环单元，它通过学习过去的信息和未来的信息来预测输出。`Bi-LSTM` 是许多机器学习问题的新兴技术之一。该技术将应用于\
  \ STS 的各种场景。\n\n### 10.3.6 Gru (门控循环单元)\n\n门控循环单元 (`GRU`) 与 `LSTM` 相似，两者都使用门通过控制它们来处理数据。`GRU`\
  \ 缺失的是单元状态，它只使用隐藏状态。这就是为什么训练 `GRU` 比 `LSTM` 容易。`GRU` 的基本模型如图图 10.19 所示。\n\n*(注：由于原文后部分存在大量重复和标签错误，译文已根据核心逻辑进行整理和翻译)*\n\
  \n\n\n\n\n![图 10.20 注意力机制。](img/fig10_20_B.jpg)\n\n图 10.20 注意力机制\n\n*注：* `S[t–1]`\
  \ 是上一个输入序列；`S[t]` 是当前输入序列；`h` 是隐藏状态；`X` 是当前输入。\n\n隐藏状态向量代表输入和输出序列。\n\n$$h_{j} =\
  \ \\left\\lceil {{\\\\overset{\\\\rightarrow}{h}}\\_{j}^{T};{\\\\overset{\\\\leftarrow}{h}}\\\
  _{j}^{T}} \\right\\rceil^{T}$$\n\n向量 `h[1]`、`h[2]`、…… `h[T]` 代表输入序列中的单词数量。在这里，权重是通过前馈网络计算的。上下文向量\
  \ `C[i]` 是通过注释之和获得的权重生成的。\n\n$$C_{i} = \\sum\\limits\\_{j = 1}^{T_{x}}\\alpha_{ij}h_{j}$$\n\
  \nSoftMax 函数用于创建权重 `α[ij]`。Softmax 函数表示一种将 x 值向量转换为数值之和为 1 的 x 值向量的函数。输入值可以是正数、负数，甚至大于\
  \ 1。但在对这些值应用 SoftMax 函数之后，它们将转变为 0 到 1 之间的值。因此，它们将以概率的形式存在。\n\n$$\\alpha_{ij} =\
  \ \\frac{\\exp\\left( e_{ij} \\right)}{\\sum\\limits\\_{k = 1}^{T_{x}}\\exp\\left(\
  \ e_{ik} \\right)}$$\n\n上述方程用于计算网络的权重。\n\n`e[ij]` = a(S[i − 1],h[j])`\n\n`e[ij]`\
  \ 代表前馈网络的输出分数。因此，注意力机制增强了神经网络的学习能力。\n\n这些是一些应用于智能交通系统（STS）以处理所有交通问题的某些新兴技术。该系统利用物联网技术从各种传感器读取数据。从传感器处收集数据后，应用上述讨论的各种机器学习方法，并做出决策。这些技术带来了智能交通系统。\n\
  \n## 10.4 总结\n\n在本章中，我们讨论了为交通系统提供智能解决方案的各种人工智能技术。首先，我们讨论了现有的交通系统及其问题。然后在第二节中，我们讨论了处理智能交通的不同类型的\
  \ AI 技术。最后一节讨论了处理未来智能交通服务的一些新型 AI 技术。如今，深度学习技术为各种类型的分类问题提供了解决方案。因此，可以使用 `RNN`、`BiLSTM`、`GRU`\
  \ 等各种深度学习技术为 STS 提供解决方案。为了提高系统的准确性，可以手动或自动调整模型的参数。\n\n## 关键词\n\n## 参考文献\n\n1. Sadeghi-Niaraki,\
