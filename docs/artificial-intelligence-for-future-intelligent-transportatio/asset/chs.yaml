  \n28. 网站\n\n29. 网站\n\n# 3 基于深度学习的空气污染监测与预测系统\n\nK. KARTHICK RAGUNATH\n\n## 摘要\n\
  现代发动机的一系列问题正以惊人的速度增长。深度学习的进步使得创建基于事实（实时）的预测系统成为可能。在本章中，通过物联网（IoT）跟踪车辆排放。车辆配备了传感器。交通管理者可以了解污染状况，并利用集成学习（EL）监控车辆的影响。集成学习使用多个基分类器来提高准确性。在预测负载时，集成学习模型使用历史数据结合传感器最新数据进行预测。\n\
  \n## 3.1 引言\n空气污染是现代文明的一个大问题，尤其是人口向城市迁移。因此，大量的精力集中在开发可行的监测系统上，这些系统包含了收集数据的传感器和摄像头。在工业发展发达国家，如果缺乏监测或监管基础设施，空气污染被发现对人类健康有重大影响。根据最近的研究，空气污染与肺部疾病之间存在密切联系。\n\
  \n\n\n然而，这些站点在三个方面仍然落后：(i) 基础设施，由于体积巨大，安装需要此类设施；(ii) 运行需求相当复杂；以及(iii) 设置、日常维护和校准的持续成本。由于这些缺陷，安装数量有所减少，导致离散的空气质量监测（AQM）网络缺乏关于空气污染的数据。由于近期嵌入式电子技术的改进，允许使用无线网络技术监测温度、压力和空气污染等多种实时传感器数据。设备数据通过无线方式传输到远程服务器上的数据库，以便进行进一步的分析和处理。由于无线数据传输的应用，使用小型、廉价的\
  \ AQM 节点（motes）的概念无疑日益流行。本研究的目的是发现一种良好的预测方法，并针对某些空气污染物（如 `CO`、`O[3]`、`SO[2]` 和 `NO[2]`）的增减预测原型或模型，这些污染物都被世界卫生组织（WHO）认为是有害的。对于时间序列预测，利用并测试了三种机器学习（ML）方法：`Linear\
  \ Regression`、`Random Forest`、`XGBoost` 和 `ARIMA`。所有模型都具有广泛的应用范围，并具有高预测能力和泛化能力。\n\
  \n到 2050 年，全球至少有 70%的人口将居住在城市，这需要高效的系统来监测和预测空气污染。污染最少的地区是北美和澳洲，其次是中欧，而污染严重的地区是印度和亚洲。尽管非洲和南美地区的数据不多，但可用数据表明这些地区的空气污染水平也很高。根据世界卫生组织的研究，每年有\
  \ 6,00,000 名 15 岁以下的儿童死于空气污染。根据研究，空气污染每年导致 690 万至 710 万人死亡，全球 91%的人口呼吸着有毒空气。在欠发达国家，98%的五岁以下儿童呼吸着肮脏的空气。全球经济因空气污染导致的过早死亡损失了\
  \ 5 万亿美元的福利。\n\n物联网（IoT）范式在过去几年中脱颖起，数字通信收发器、微控制器和适当的协议栈，允许它们相互连接并与用户连接，使其成为互联网至关重要的组成部分。得于这一特性，家用电器、监控摄像头、传感器和汽车等设备现在可以产生海量数据，这些数据可以被评估并用于开发新应用程序。物联网技术领域的进展使人们能够创建有效的方法，通过许多无线连接的传感器来监测不同位置的各种空气污染物，可以通过\
  \ `Wi-Fi` 或 `Bluetooth` 连接相邻移动网络或区域，也可以通过卫星连接遥远或孤立地区。为了评估发展趋势并实现近实时监测，这些大量的不同数据可能需要采用大数据和云计算技术进行并行处理\
  \ [2]。监测系统使我们能够获得高质量的数据，随后可用于加深对污染的理解。\n\n### 预计空气污染预测系统将使用 `AQI`，它描述每种污染物的数值，例如颗粒物（PM）或二氧化碳浓度（即\
  \ `CO[2]`、`PM10`、`PM2.5` 等），以识别污染严重的地点。政府可以使用空气污染预测技术来帮助他们制定开发对策。\n\n### 空气质量评估是该任务最重要的部分\n\
  \n标准污染物是广泛分布于美国的一类污染物。这些污染物可能是损害人类居住区、环境及其财产的原因。以下污染物被指定为标准污染物：\n\n*   `O[3]`\n\
  *   `SO[2]`\n*   `NO[2]`\n*   `CO`\n*   `PM`\n*   `Pb`\n\n`EPA`、地方、部落空气污染控制机构、州政府使用空气质量系统（`AQS`）从数千个传感器收集环境空气污染数据。`AQS`\
  \ 还包含关于每个监测站的描述性信息（如操作员及其地理位置）、天气数据以及质量/保证控制信息。来自 `AQS`的数据用于辅助判定达标或未达标、监测空气质量、为许可审查进行建模、分析该地区的州实施计划，并执行其他空气质量管理职责\
  \ [4]。《清洁空气法案》要求利用 `AQS` 数据为国会生成报告。\n\n\n\n\n\n| 范围 | 影响 | 颜色 | 描述 |\n| :--- | :---\
  \ | :--- | :--- |\n| 151–200 | 对健康有害 | 红色 | 活跃的成年人、儿童以及患有哮喘等呼吸道疾病的人员必须避免长时间户外活动；其他人必须限制在户外长时间逗留的时间。\
  \ |\n| 201–300 | 危险且不健康状态 | 紫色 | 活跃的成年人、儿童以及患有哮喘等呼吸道疾病的人员必须避免户外活动；其他人必须限制在户外长时间停留的时间。\
  \ |\n| 301–500 | 对人体健康极危险 | 栗色 | 所有人都必须避免户外活动。 |\n\n车辆排放的二氧化碳 (`CO[2]`)、氮氧化物 (`NOx`)、氢烃\
  \ (`HCs`) 或挥发性有机化合物 (`VOCs`)、`PM` 和一氧化碳 (`CO`) 已经成为许多地区空气污染的主要原因。交通拥堵的加剧，尤其是沿主要道路的）是导致空气质量大幅下降和污染物排放增加的原因。根据流行病学研究、拟议车辆排放标准\
  \ (`VES`) 的估计以及世界卫生组织 (WHO) 特定道路项目的环境影响评估 (`EIA`)，这些排放增加了驾驶员、通勤者以及居住在公路旁的人的患病和死亡风险。\n\
  \n本研究探索了反复交通拥堵（如工作日高峰时段，周一至周五）可能对近路及道路居民造成的健康风险数量和空气污染程度。反复的拥堵会导致更具慢性且更频繁的暴露，并增加长期健康风险\
  \ [5]。尽管此类事件可能对某些急性健康结果（如哮喘发作）产生重大影响，但本文并未探讨由车辆故障（由于事故）引发的“拥挤发生”问题。本研究使用了预测性风险评估方法，包括排放、交通模拟模型、污染物扩散及其风险，以及分析与拥堵相关和无拥堵结果的增量研究或分析。为了研究重要因素对预测额外风险的影响，进行了简要的敏感性分析。\n\
  \n大多数空气污染监测方法依赖于未处理或已处理的数据，例如过去的污染物传感器监测数据。我们研究的创新之处在于使用了由传感器测量值和相机图片组成的多模态数据，将我们的研究与文献中的早期方法区分来。结合所有特征有助于解决与预测任务相关的问题，例如类别不平衡数据的可用性、来自单一数据源的不完整且可能噪声的信息，以及对对抗攻击的脆弱性。因此，生成的预测模型看起来比以前发布的解决方案更稳健、更准确。\n\
  \n### 3.1.1 背景与研究动机\n\n当大气中引入危险且未经许可/授权的特定数量特定化学物质（如气体、颗粒物和生物分子）时，通常发生空气污染。过度排放会产生明显的影响，例如人群和其他生物物种的疾病和死亡，以及作物受损。液滴、硬质颗粒和烟雾都是空气污染的类型，其分类如下。车辆的化石燃料燃烧以及工业、家庭和农业来源，都是空气污染的共同贡献者。关键关注的空气污染物是氮氧化物、`SO[2]`\
  \ 和 `CO`。它们由于直接排放到大气中，因此都被描述为“初级”污染物。二次污染物在大气中产生，主要是由于初级污染物暴露在紫外线下。臭氧和二次有机气溶胶 (`SOA`)\
  \ 是常见的二次污染物。当 `NOx` 和氢烃暴露在紫外光下时，臭氧 (`O[3]`) 是在环境中形成的二次污染物 [6]。尽管化石燃料燃烧产生 `SOA` 的方法尚不清楚，它是北京冬季霾污染的主要组成部分。\n\
  \n空气污染导致广泛的负面健康影响。对于六种最常见的污染物，美国环保保护署 (EPA) 设定了国家环境空气质量标准 (`NAAQS`)。`PM`、`CO`、地面臭氧、`NO[2]`、雾霾和\
  \ `SO[2]` 是问题中的污染物，`NAAQS` 已建立保护公众健康。这些污染的发生源于广泛的排放源。由于研究关注交通拥堵，导致了拥堵相关和无拥堵结果的增量研究。此外，EPA\
  \ 建立了国家环境空气质量标准 (`NAAQS`) 以识别影响人类安全的污染物。有关这些污染物可能影响人类的每日空气质量指数 (AQI) 见表 3。\n\n###\
  \ 3.1.2 回顾方法与问题\n\n根据 Kitchenham 的工作 [8] 和 PRISMA 指南 [9]，我们进行了本综述。因此，回顾的方法在下述章节中。因此，我们通过参考登热疾病监测\
  \ [10] 为回顾的设计寻求灵感。以下是本文关注的主要问题：\n\n*   **Q1：数据挖掘技术和方法在空气污染流行病学中的应用如何？** 为了回答这个问题，我们对空气污染流行病学以及与数据挖掘工具、技术相关的研究进行了文献综述。我们对本回顾没有设定时间限制，但对最近的工作给予更多关注。我们在回顾期间也考虑了数据挖掘工具、技术和方法的增长趋势。\n\
  \n*   **Q2：研究领域是否存在热点？** 我们的回顾重点是涵盖所有方面、地区、国家和研究机构的综述。我们也更多地关注了在我们的研究方面更有进展的国家。\n\
  \n*   **Q3：识别以前使用数据挖掘的空气污染关注领域。** 为了解决基于问题 Q3 的问题，我们筛选了与空气污染及其应用领域各种流行病学工作。最终，综述显示数据挖掘工具、技术和程序显示了三种空气污染流行病学调查。\n\
  \n\n\n\n\n### Q4: 使用了哪些数据挖掘技术？\n\n为了解决寻找涉及的数据挖掘技术和算法的问题，我们进行了广泛的综述，发现了各种与空气污染预测相关的数据挖掘技术，并发现了四个大类，我们将在后文中进行讨论。\n\
  \n### Q5: 当前工作的局限性是什么？\n\n为了克服局限性并专注于解决问题，我们将所有与空气污染预测相关的问题技术归类为几类，并策略性地尝试解决现有系统中出现的所有主要问题。\n\
  \n### Q6: 还有哪些高价值的方向尚未被探索？\n\n最后，在 Q6 中，我们讨论了可能的未来行动。\n\n本章的结构如下：第 3.1 节提供了交通导致的空气污染和健康风险概述。第\
  \ 3.2 节讨论了应对空气污染预测和预测挑战而开展的相关工作。第 3.3 节介绍了所提模型的架构和数据预处理技术。第 3.4 节涉及基于集成学习（EL）的预测。在第\
  \ 3.5 节中，我们提供了模型的评估结果并进行了讨论。最后，第 3.6 节](#ch3.xhtml#sec3_6)总结本章。\n\n## 3.2 文献综述\n\
  \nYi 等人 \\[11\\]提出大量的研究致力于空气污染预测，并考虑了标准技术和深度学习技术。尽管开发了许多替代模型，但它们在某种程度上都依赖于从特定时间和位置传感器获取污染数据。具有\
  \ `PM-2.5` 和 `PM-10` 数值的气体种类和颗粒物被视为污染物，通常如下：`CO`、`SO[2]`、`O[3]` 和 `NO[2]`。系统还集成了温度、降水量、湿度和风速等气象数据，某些系统甚至结合了天气预报指标信息。Fan\
  \ 等人 \\[12\\]讨论了建模和预处理阶段通常在不同的步骤中进行。数据准备流水线中的一个重要阶段是特征提取。经常使用的策略包括判别检验、因子调查、分组检验和主成分分析（`PCA`）。通过位置和时间的匹配与聚合，结合外推和插值技术，实现了数据融合。\n\
  \nQi 等人 \\[13\\]解释了特征分析或插值阶段是单独进行的，而某些方法将此阶段直接纳入模型设计中。文献中已发表了数百种技术，它们可以被分为两大类。第一类技术关注于预测所存在污染物的数量（如\
  \ `NO[2]`、`PM-2.5`、`PM-10` 等）。Kalajdjieski 等人 \\[14\\]提出将毒素和污染物方法分为两个基本类别。在策略的主类中，通过确定多少毒素和污染物的数量（例如\
  \ `NO[2]`、`PM-2.5`、`PM-10` 等）来预测污染。由于此类监管和空气质量建议，欧盟和其他公共生态协会已为这些毒物制定了它们自己的原则和规则。空气质量通过\
  \ `AQI` 进行估计，它反映了空气的洁净程度，正如任何相关的健康危险，特别是对于易危人群。暴露在污染空气几天后可能产生的健康影响是本研究的主题。为了得到这个数字，使用了之前指定的每种标准污染物的最高\
  \ `AQI` 值。\n\nLi 等人 \\[15\\]提出了 `AQI` 或空气污染指数技术，这些技术被包含在预测污染水平的第二类方法中。污染物数据的标记是这两类技术之间最显著的区别。涉及监督分类算法时，第一类方法不需要标记，因为目标是预测实际污染物水平。然而，第二类方法需要对细粒度数据进行标记，因为它将用于监督算法。\n\
  \nCorizzo 等人 \\[16\\]提出了自编码器模型、序列到排列模型、神经组织（将直接指标作为组）、）、贝叶斯组织和多名分类器，这些都是近年来已使用的不同策略的一部分。如果能开发出基于某些污染物百分比并能够按小时预测空气质量的预测系统，`AQI`\
  \ 将更具响应性且对社区健康更有利；因为 `AQM` 系统对社区至关重要。通过让环境监管能够在“按需”减排、运营规划甚至应急行动之间进行选择，他们可以在污染水平接近规定阈值时在健康警报中发挥至关重要的作用。\n\
  \nLiu 等人 \\[17\\]讨论了基于注意力的模型，这是另一种迷人的方法。由于这种方法的注意力机制，仅使用风力测量值生成编码结果，然后在主框架中使用。使用基于注意力的方法，我们将其应用于所有气象和污染信息。Wen\
  \ 等人 \\[18\\]讨论了采用多种评估的方法。它们都使用了相对预测误差 (`RPE`）、平均预测误差 (`MPE`）、平均绝对误差 (`MAE`）、平均绝对百分比误差\
  \ (`MAPE`）和均方根误差 (`RMSE`）。\n\n`ARIMA` 是自回归移动平均模型的缩写。对于时间序列预测，它是最重要且最常用的模型之一。由于其事实属性、对广泛周期的灵活性以及扩展性，这种最初由\
  \ Box & Pierce \\[19\\]提出的模型已获得研究人员的关键支持。自从公众关注城市地区空气质量和生活质量以来，像 `ARIMA` 这样的统计技术在预测城市地区空气污染水平方面变得极其流行。数据的质量和代表性是确保有效构建预测模型的关键因素。数据准备阶段经常影响\
  \ `ML` 算法的泛化能力。缺失数据通常进行插值，离群值被删除，数据转换（如归一化和标准化）以及特征提取都是数据预处理的一部分。\n\n\n\n根据 Siew\
  \ \\[20\\] 的研究，对所提模型估计此类 AQI 结果的能力进行了调查，结果表明该模型能够创建低于 95% 置信水平的图表。Siew \\[21\\]\
  \ 提出，近年来 `ARIMA` 的成功程度尤其令人印象深刻。根据研究结果，使用了指数平滑模型来预测每日 AQI 水平。虽然经典统计模型已用于时间序列预测，但\
  \ `ML` 模型作为一种可能用于许多科学领域和活动领域进行精确预测的解决方案已引起了广泛关注。特别是在预测空气质量方面，`ML` 算法已被广泛应用。\n\n\
  D’az Robles 等人 \\[22\\] 对一种结合 `ARIMA` 和 `ANN` 的混合模型部署进行了调查，并利用 `ANNs` 和 `ARIMA`\
  \ 预测了智利的空气质量，特别是 P-10 数据。`ANNs` 用于反映在 `ARIMA` 回归中观察到的非线性，从而对数据集的线性进行更准确的表示。研究人员认为，该模型具有不可思议的预测能力，且在独立使用\
  \ `ANNs` 和 `ARIMA` 时其性能均优于两者。通过使用其他污染物浓度的数据集，Castelli 等人 \\[23\\] 设计了一个演进框架系统，利用\
  \ `GPS` 提前多一小时估计臭氧浓度。该策略产生了准确的结果，性能优于最先进的 `ML` 方法的结果。这种方法已被许多研究人员用于预测空气质量和污染水平。\n\
  \nMuller 等人 \\[24\\] 在的一项研究中考察了 `SVR` 与人工神经网络（`ANNs`）。总体，作者得出结论认为 `SVR` 的性能更优。一种结合了\
  \ `ANN` 和支持向量机（`SVMs`）的时间序列预测方法将输入空间划分为可管理的区块。研究结果显示，这种混合技术在提供极佳预测性能的同时，还允许高效学习。Anikender\
  \ & Pramila \\[25\\] 采用了多线性回归技术和主成分回归，根据 AQI 的历史数据和气象指标预测了印度德里的日常常性 AQI 值。该研究工作由印度政府资助。通过使用\
  \ 2000–2005 年的历史数据和多次计算，他们预测了 2006 年的每日 AQI。使用多线性回归将 2006 年的 AQI 预测值与四个季节（夏季、季风后季节和冬季）的\
  \ 2006 年 AQI 观测值进行了比较。主成分分析（`PCA`）是一种用于确定独立变量之间是否存在关联的技术。在进行多线性回归时，使用主成分来最小化数据集的数量，并消除预测变量之间的协方差。在冬季，使用主成分回归来预测\
  \ AQI。AQI 预测仅基于气象数据，没有考虑可能对人类健康产生负面影响的细颗粒物。\n\nHuixiang 等人 \\[26\\] 识别了两个不同的城镇，一个在北京，一个在意大利。他们根据两个公开的数据集，预测了北京的\
  \ AQI 和意大利的 `NO[2]` 数量。截至 2018 年 8 月，北京市环保监测中心发布了其第一个数据集，其中包括北京持续聚合的 AQI、`NO[2]`、`PM-2.5`、`PM-10`、`O[3]`\
  \ 和 `SO[2]` 浓度等特征。在 2018 年 12 月至 8 月之间，该数据集有 1738 条记录。第二个数据集包含 9358 条记录，是出于研究目的从\
  \ 2004 年 3 月到 2005 年 2 月采集自意大利城市。该数据集包含了下列属性：每小时的 `CO`、非甲烷烃、苯、`NO[2]` 和 `NO[2]`\
  \ 浓度。然而，他们将精力主要集中在 `NO[2]` 预测上，因为它是空气质量评估最重要的变量。利用 `Random Forest Regression` 和支持向量回归方法来预测\
  \ AQI 和 `NO[2]` 浓度。在预测 AQI 的准确性方面，`SVR` 优于 `RFR`，而在预测 `NO[2]` 浓度的准确性方面，`RFR` 优于\
  \ `SVR`。\n\nNidhi 等人 \\[27\\] 检查了 2009 年至 2017 年期间空气污染的信息，他们还对印度德里 2016 年至 2017\
  \ 年的空气污染趋势进行了性评估。他们的预测包括 `SO[2]`、臭氧（`O[3]`）、苯、`NO[2]`、`PM-2.5`、`CO` 以及一系列污染物。通过利用早期的执行数据和时间序列回归预测，他们预测了指示污染物的未来水平。由于该研究结果，德里\
  \ AnandVihar 和 Shadipur 地区的监测站正在接受调查。`PM-10` 浓度显著增加，同时 `NO[2]` 和 `PM-2.5` 值也上升，表明德里的污染程度加剧。预测今年\
  \ `CO` 将下降、`NO[2]` 将上升、臭氧增加、苯减少以及 `SO[2]` 上升。\n\nMohamed & Rakesh \\[28\\] 通过按天和周评估了多种空气污染物（`SO`、`NO[2]`、`CO`、`PM-10`\
  \ 和 `NO`）的比例，并利用 `WEKA` 工具分析了风速、温度和湿度等气候因素对记录空气污染的影响。卡纳塔克邦污染控制小组收集了这些信息。调查发现，当利用\
  \ `WEKA` 工具进行 `ZeroR` 计算时，空气毒素的浓度在工作时间内增加，而在周末和假期期间下降。该研究利用简单的 `K-means Clustering`\
  \ 方法说明了环境变量（如湿度、风速和温度）与空气污染物（如 `SO[2]`、`NO`、`PM-10`、`CO` 和 `NO[2]`）之间的关联或依赖关系。在时间序列分析中，滞后用于量化序列自相关，对于预测而言，选择合适的滞后和消除冗余信息至关重要。将此方法与其他预测技术结合使用，可能会对过程有更深入的理解。这项研究通过利用自相关能力和部分自相关来决定每种毒素和分子的滞后因子。第一阶和二阶部分自相关图分别显示了增长和下降。在\
  \ 80% 的置信水平下，第一阶和二阶被认为对所有污染序列都是重要的，从而创建了 10 个额外变量。最后，突出的变量与每个污染序列在 24 小时窗口内的滚动平均值有关。\n\
  \n\n\n\nKazem 等人 `[29]` 使用了世界卫生组织推荐的 AirQ 软件，该软件提供了关于伊朗德黑兰居民健康状况的可量化数据，如 `SO[2]`、`O[3]`、`PM-10`\
  \ 和 `NO[2]`。在健康影响方面，考虑了全因死亡率、心血管疾病和呼吸系统疾病。根据研究结论，此前对该市人口影响最大的污染物 `PM-10` 为 8,700,000\
  \ 人，并在一年内导致了 47,284 人数中的 2,194 例死亡。归于臭氧、`NO[2]` 和 `SO[2]` 导致的总额外死亡病例分别为 819 例、1,050\
  \ 例和 1,458 例。结果表明，该市面临着严重的空气污染问题，必须减少空气污染带来的城市健康负担。\n\nGunasekaran 等人 `[30]` 进行了一项研究，分析了印度泰米尔纳德邦萨莱姆市\
  \ 2010 年 4 月至 2011 年 3 月期间的空气质量。研究结果显示，该地区二氧化硫、氮氧化物和 `PM` 等毒物的年度浓度处于指南范围内。然而，年度平均\
  \ `PM-10` 值高于国家标准。此外，除 7 月至 10 月外，每月平均 `PM-10` 浓度超过了标准值。\n\n## 3.3 系统架构\n\n所提系统的框架通过架构布局定义，展示了确定所需软件、硬件及相关接口组件的实践。它从多个角度建立了系统的结构和行为以及其他几个方面。设计的系统小巧轻便，足以适应任何车辆。因此，通过进一步的预测过程减轻了移动车辆产生的有害气体浓度。它确保了空气质量管理和控制策略的重大转变。整个物理系统分为两个段模块。各模块的详细描述见于小节。\n\
  \n### 3.3.1 模块 1：数据感知\n\n在该研究中，`SO[2]`、`O[3]`、`NO[2]`、`CO` 和颗粒物（`PM10`）是车辆排放的五种特定空气污染物。使用传感器检测车辆的污染物排放。实验中使用的传感器包括\
  \ `MQ7`、`MQ131`、`Mic 2714`、`SO[2]` 和 `PMS5003`。众周知，`MQ7` 对 `CO` 具有高敏感性，`Mics 2714`\
  \ 检测 `NO[2]`，`MQ131` 感应 `O[3]`，`SO[2]` 传感器用于追踪 `SO[2]` 排放，最后利用 `PMS5003` 监测 `PM10`。\n\
  \n`Raspberry PI 4 modal B` 板收集并处理传感数据。`Raspberry PI` 已配置为从多个传感器采集数据，并将其与预定标准关联以评估准确性。集成五个\
  \ `LEDs` 用于显示各种污染物的当前状态。如果检测值高于预设值，`LED` 指示灯变为红色；否则显示绿色，表示读数在接受范围内。如果排放水平继续高于阈值，`Raspberry\
  \ PI` 将信息发送到连接的 `GSM module` 进行进一步处理。\n\n`GSM module` 以消息的形式向用户和交通管理员提供详细信息和通知。架构模型的插图如图图\
  \ 3.1](#ch3.xhtml#fig3_1）所示。`Raspberry PI` 板与传感器连接。传感器数据持续发送到 `Raspberry PI` 设备。电路连接微型计算机和\
  \ `LED` 指示灯。接口连接 `GSM module` 到板卡。`GSM` 组件包含一张 SIM 卡。\n\n![图 3.1 系统架构](img/fig3_1.jpg)\n\
  \n图 3.1 系统架构\n\n### 数据处理\n\n我们对全球最污染城市之一的新里污染站点进行了研究。空气质量中央控制室（CCRAQM）提供实际数据。数据准备是分析这些读数的第一步。学习阶段之前会有若干处理过程。如果发现某个变量错误，将不会影响整个数据集。相反，该参数将被标记为空，或者在可行的情况下，用\
  \ `CCRAQM` 计算的结果替换，以避免删除整行。当存在缺失值时使用插值法获取合适值。有关污染物的缺失数据根据实际观测点进行插值。对于剩余的错误或不完整信息，采用\
  \ `k-NN` 技术利用先前的插值程序进行插值。所有考虑的数据集缺失值/不完整信息率均低于 1.3%。\n\n结果，因子相关性不会受到范围或单位的影响。然后对输入和目标数据进行调整以消除偏差。所有原始数据的数值范围设定在\
  \ 0 到 1 之间。\n\n\n\n\n\n图 3.2 中的插描述了 GCN 的总体思想。绿色节点首先对其邻居的平均值及其节点 ID 取平均值。该值随后被用于在新的信息上训练神经网络。重要的是，GCN\
  \ 使用了全连接层。第二维度的向量倾向于产生所需的结果。\n\n![图 3.2 GCN 的整体概念](img/fig3_2_B.jpg)\n\n图 3.2 GCN\
  \ 的整体概念\n\n### 3.4.2 随机森林\n\n随机森林使用了另一种流行的机器学习方法——自助聚集法（bagging），它通过混合许多决策树来创建一个森林，并将随机性引入概念模型中。单棵树使用随机特征集进行划分，同时使用随机样本分布为每棵树结构创建训练样本子集。一旦决策树中的节点针对随机计数的特征考虑最佳划分点时，如果特征是类别的，算法将选择最常见的结果；而对于数值型，则将使用总结果的平均值。\n\
  \n回归和分类问题都可以使用随机森林技术处理。首先，每个测试数据样本通过森林中的决策树运行多次以增强预测。然后使用树通过对结果投票来做出预测。预测结果通过树之间的共识多数决定生成，从而产生一个改进的唯一学习器。正如预期的那样，随机森林优于选择树，因为预测平均值在分类（回归）上更接近实际真值。图\
  \ 3.3 描述了一个由 N 棵随机树组成的随机森林。\n\n![图 3.3 随机森林的整体概念](img/fig3_3_B.jpg)\n\n图 3.3 随机森林的整体概念\n\
  \n### 3.4.3 集成学习 (El)\n\n本研究使用了 EL，它通过结合多种学习和优化模型来获得比任何单一模型都更好的结果。这些类型的训练和学习主要使用依赖注入和并行处理。它表明小组数据集之间存在高度依赖关系，这些数据集使用提升（boosting）等策略顺序创建结果。\n\
  \nEL 的核心思想是使用各种学习方法对结果进行分类或创建。投票和平均评估均可用于结合多个分类算法的结果。在线性或非线性回归中，通常使用数据分割和平均评估技术，而投票方法最常用于数据标记和分类。投票有两种类型：软投票（soft\
  \ voting）和硬投票（hard voting）。分类器独立投票，在“硬投票”（也称为“合格多数决”）的思想下，大多数票数获得授权。\n\n每个分类器为每个数据点提供一个特定类别标签的概率估计；因此，软投票可以被视为特殊的软分类器。对这些概率取平均值，以确定哪个目标类别标签获得最多票。许多不同的基于机器学习的模型可以组合到单一\
  \ EL 平台中。混合学习可能会提高某些学习策略的准确性和鲁棒性，并克服特定方法的某些局性。基础学习器（有时被称为“弱学习器”）属于能力有限的那些。“强学习器”是指那些已经实现基准结果并在此基础上构建的学习者。\n\
  \n本节的目标是查看并对比之前描述的三种不同方法。本提出了一种基于软投票的 EL 策略。可以使用分类器的预测概率 `p` 而不是严格的硬投票方法来推断类标签。基准学习器\
  \ GCN 和随机森林用于数据处理的初始阶段。一旦确定每个数据点基准学习器的准确性，将对这些结果的方差取平均。EL 预测评估基于软投票结果。图 3.4 描述了整个过程。\n\
  \n![图 3.4 EL 策略的完整过程](img/fig3_4_B.jpg)\n\n图 3.4 EL 策略的完整过程\n\n### 3.5 结果分析与讨论\n\
