  \ AI 应用，其目标是通过减少伤亡人数来提高生产力能力。\n\n## 9.2 AI 中的交通网络结构：规划、设计与控制\n\n道路网络设计问题（`NDP`）涉及为交通规划创建有效的道路策略。如果现有基础设施的容量发生变化，它可能变成一个持续性的难题；如果增加了额外的基础设施，将是一个重大问题；如果引入了新基础设施，则成为连续与离散挑战的混合。在\
  \ 20 世纪 90 年代，用于交通规划、设计和模拟的 `NNs` 已成为研究课题。\n\n并行神经网络方法也被用于评估交通与土地规划之间的几何分布。2019\
  \ 年环境的大多数研究中，24 项研究中有 11 项在信息方面更有效地利用机器人技术，因为海量数据与强大算法的结合已成为大多数研究的焦点。多年来，基于模拟的经济土地利用和土地覆盖，这为中国的城市扩张提供了预测性的推动。它聚焦于开发一种交通系统管理和安全策略，以平衡移动需求与适当的道路、铁路和航路分布\
  \ [2]。他们利用 `ANN` 预测伊斯坦布尔与安卡拉之间频繁使用道路上的事故和伤害。此外，车辆路径规划对于避免拥堵和旅行时间延迟是必要的。许多人得出结论，蚁群算法是解决车辆路径问题最有效的方法之一。他们专注于应用\
  \ `BCO` 算法来解决路径和波长挑战。\n\n该任务包括在内网内部选择路径，并为每个链路终端为该路径分配波长，以增加系统中设备之间的链路数量。他们还关注利用微观交通数据进行建模和识别安全违规，以及交通控制系统和公路管理策略。他们开发并改进了依赖旅行者选择的实时路线生成系统，并公共交通客户确定最佳路线。\n\
  \n一种机器学习（`ML`）系统已被创建，用于为 `ITS` 设备提供信号处理和快速计算分析能力。随着 `IT` 的演进，数据的复杂性将增加，这需要使用 `ML`\
  \ 技术来发现这些数据中的模式和特征，以创建一个更具集成性的交通系统。例如，在交叉路口，`ML` 模型和模糊方法被用于手动控制交通灯系统。\n\n所提出的 `ITS`\
  \ 解决方案命名为“永不停止（Never Stop）”，利用 `RFID` 芯片并被证明减少了平均车辆等待时间。此外，还建立了两个基于微型模拟数据的 `NNs`\
  \ 系统以更好地控制道路。第一个模块包含交通灯，而第二个模块预测未来的交通拥堵。它展示了一个在多个互连网络中进行评估的交互 `NNs` 系统，展示了隐藏层如何被用于调节交通。`ANNs`\
  \ 也可以帮助信号交通控制。基于微型模拟数据，他们构建了两个 `NNs` 算法以更好地控制道路。`AI` 是一个不断变化的领域，定期发布新的应用以利用 `AI`\
  \ 的技能来改进规划、决策和领导力。\n\n## 9.3 交通与人工智能 (Ai)\n\n`AI` 已经应用于交通行业。随着 `AI` 的发展和成熟，`AI`\
  \ 占有重要部分的职业种类无疑会增加。`AI` 通常以不同的方式用于交通领域，这些方式将在各小节中讨论。\n\n### 9.3.1 自动驾驶车辆 (AVS)\n\
  \n在交通行业内，自动汽车已成为现实。它们是向自动运输替代模式的第一步，这种模式以前看起来像是一个遥远的概念 [3]。这些自动驾驶汽车由 `AI` 的处理、控制和优化能力驱动。实时数据传输和处理在自动驾驶汽车中至关重要，这些程序中的任何模糊性都可能导致灾难性的结果。自动驾驶出租车在中国开始运营，但出于安全考虑，操作员留在车内，准备在紧急情况下接管车辆操作。2018\
  \ 年，美国开始采用自动驾驶卡车。考虑到卡车运输了全球 65%的货物，自动运输预计还将节省约 45%的维护和管理支出。`Waymo` 已在少数几个公共道路上开始测试自动驾驶多功能迷你和卡车。此类倡议目前处于开发的早期阶段，目标是开发让乘客安全的自动汽车。随着技术的进步，无人车辆将变得更加可靠和普及。\n\
  \n一项关于使认知自动驾驶汽车对乘客吸引力的一个方面的全球研究已经进行。这些方面包括：\n\n*   自愈合；\n*   自社交；\n*   自学习；\n* \
  \  自驾驶；\n*   自配置；\n*   自集成。\n\n### 9.3.2 公共交通\n\n乘客、工人和驾驶员的安全长期以来交通行业的首要任务。`AI`\
  \ 的应用是自动系统，该系统目前存在几乎每架商用喷气式飞机上，是航空旅行必不可少的组件 [4]。根据《纽约时报》，普通飞机的只有 7 分钟由飞行员引导，其余部分由自动驾驶处理。由于目前已有使用传感器、摄像头和\
  \ `GPS` 运人的自动巴士，`AI` 对公共交通的影响见图 9.2。\n\n![图 9.2 自动巴士](img/fig9_2_B.jpg)\n\n图 9.2\
  \ 自动巴士\n\n`AI` 技术可以通过多种方式帮助我们，包括减少交通人为错误、监控合规性、审查车辆维护日志以及以此类方式管理交通。\n\n### 9.3.3\
  \ 手机应用程序\n\n现在已经有相应的应用程序，其中一种是通过 `AI` 驱动的实际交通数据工具，如图 9.3 中的谷歌导航或 `Radar` [5]。这些应用程序利用手机的位置信息分析社区的交通状况，并为用户提供更好的交通信息。如果汽车可以为你做一切，你还需要应用程序吗？这些应用程序很快将在自动驾驶领域面临竞争。\n\
  \n![图 9.3 谷歌导航](img/fig9_3_B.jpg)\n\n图 9.3 谷歌导航\n\n### 9.3.4 交通管理\n\n由于其处理、控制和优化的能力，`AI`\
  \ 可用于管理交通系统 [6]。`AI` 可用于交通管理，使道路更智能、交通更顺畅。另一个重大优势是预测物理问题的能力。这可能导致交通拥堵或阻塞（图 9.4。\n\
  \n![图 9.4 交通模式](img/fig9_4_B.jpg)\n\n图 9.4 交通模式\n\n\n\n\n安装在道路上的传感器和摄像头捕捉了大量的交通模式数据（图\
  \ 9.4）。大数据和人工智能技术分析这些数据以揭示交通趋势。相关的见解为通勤提供了交通预测、事故和道路关闭的信息，以及通往目的地最快路线的建议。例如，西门子交通（Siemens\
  \ Mobility）开发了一种人工智能监控系统原型，该系统利用交通摄像头根据实际拥堵修改交通信号，从而减少交通问题。人工智能将通过这种方式减少重复交通、提高道路安全并缩短等待时间。\n\
  \n### 9.3.5 事故检测\n\n许多人已尝试确定事件的时间、地点和强度，以协助交通管理减少交通拥堵。在这些工作中，人工报告、自动算法和神经网络均被采用。人工编写的手工报告可能会导致发现问题的延迟，并且成本高昂\
  \ `[7]`。相反，算法可以使用从沿途传感器获取的信息来估算事故前后的流量参数。由于街道道路和交通信号的影响，在高速公路上使用算法较为困难，因此开发了神经网络技术。为了确定高速公路上事件的发生情况，使用神经网络方法对其进行分类。他们发现了一个用于实时检测所有车辆对象的优异软件包。\n\
  \n统计技术（如 `California Algorithm`）已用于构建检测算法，然而，由于街道路边停车和交通信号的影响，在主干道上使用算法非常困难，因此开发了神经网络方法。为了确定高速公路上事件的发生，使用了分类神经网络方法。他们发现了一个用于实时检测所有车辆对象的良好软件程序。\n\
  \n通过结合虚拟和真实数据，开发了一种名为“高效多模型粒子滤波（`EMMPF`）”的特定方法来识别交通状况。Facebook 和 Twitter 可用于直播活动。这意味着使用\
  \ Facebook 报告高速公路和主干道的交通事故是一种开支，并鼓励了创新。\n\n## 9.4 预测模型\n\n随着智能交通系统（ITS）的不断扩大，预测交通数据的新方法变得越来越重要。这些技术对于复杂的乘客数据系统、现代道路环境、复杂的交通网络以及重型卡车运营的成功至关重要。从部署在公路上的传感器获取的历史数据被用于构建预测系统。深度学习和人工智能技术利用这些信息构建实时、短期和长期预测。该算法以\
