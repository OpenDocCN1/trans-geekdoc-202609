  \n### 7.3.4 基于值和奖励做出决策的重要性\n\n- 奖励是强化学习（RL）中在执行动作后立即获得的首要价值；\n- 值是跟在所获得奖励之后的次要投影。\n\
  \n每个奖励都与值相关。计算值的唯一目的是获得额外的奖励。尽管如此，在做出和评估决策时会考虑值。价值判断最终被用于指导动作决策。智能体将选择能够带来最高价值状态的活动，而不是带来最高奖励的活动，因为这些状态将启动在长远范围内获得最多奖励的动作。\n\
  \n### 7.3.5 环境\n\n环境直接提供奖励，但值是根据追踪智能体在每一次遭遇中完成的观测序列不断逼近的。因此，强化学习算法中最重要的部分将是有效估计值的方法。\n\
  \n### 7.3.6 环境模型\n\n环境模型是某些强化学习系统的另一个关键组件。它是一个复制环境行为并对环境行为提供假设的东西。这种模型将帮助智能体预测在采取特定动作时产生的下一个奖励，允许智能体根据未来的环境反应来做出当前动作选择。\n\
  \n## 7.4 强化学习（RL）的关键原理\n\n图 7.2 展示了强化学习的关键原理。\n\n![图 7.2 强化学习的关键原理。](img/fig7_2_B.jpg)\n\
  \n图 7.2 强化学习的关键原理。\n\n### 7.4.1 环境与智能体\n\n- 智能体被定义为一个通过传感器感知周围环境并通过执行器对其做出反应的对象。\n\
  - 传感器包括眼睛、耳朵和其他器官，而执行器包括腿、翅膀和其他身体部位。\n- 软件智能体接受感知输入，并通过创建文件、在屏幕上显示信息以及通过网络发送数据包来做出响应。\n\
  - 在任何时刻，智能体的动作选择取决于它目前为止感知或已感知到的东西，而不是取决于它尚未感知到的东西。\n\n### 7.4.2 智能体函数\n\n- 智能体的行为由一个函数表示，该函数包含动作到状况的映射。\n\
  - 通过将智能体的反应映射到每个序列，定义了将每个序列翻译为动作的智能体函数。\n\n### 7.4.3 开发与探索的关系\n\n为了提高整体性能，强化学习智能体会根据头脑风暴，并考虑与环境随机交互的反应，逐渐学习最优（或近优）的策略。智能体可以通过以下两种方式实现这一点：\n\
  \n1. **探索（Exploration）：** 学习更好的策略。\n2. **利用（Exploitation）：** 利用当前状况，意味着贪婪地使用可用的最佳策略。\n\
  \n在资源 [6]、机会和时间方面，探索是昂贵的；强化学习中的一个核心问题是如何探索未知领域与使用当前证明有效的战术之间取得平衡。特别是，智能体必须在它目前为止通过贪婪利用所学到的知识并选择当前提供最高奖励的活动，与不断探索状况以获取更多信息（从而可能获得更高的长期价值）之间取得平衡。\n\
  \n- **示例 1：**\n\n假设待清理区域被分为 9 个坐标为 `G` 和 `H` 的正方形网格，其中 `G` = 1, 2, 3，`H` = 1, 2,\
  \ 3。如图 7.3 所示，智能体可以判断当前所在的网格是否脏。它有向上、向下、向左、向右、吸尘或闲置的选项。\n\n图 7.3 真空器清理问题的网格视图。\n\
  \n| (1,1) | (1,2) | (1,3) |\n| --- | --- | --- |\n| (2,1) | (2,2) | (2,3) |\n| (3,1)\
  \ | (3,2) | (3,3) |\n\n- **智能体函数：** 以下是函数的表示：\n    - 如果当前网格不干净，智能体必须启动吸尘动作；\n  \
  \  - 否则，它必须移动到下一个网格。\n- **奖励：** 规定智能体何时获得奖励以及奖励的正负是至关重要的。每当智能体清理所有网格时都给予建设性奖励是一种天真的方法。然而，因为智能体是随机探索的，通过清理所有网格获得奖励的概率非常小。\n\
  - **值函数：** 通过利用值函数可以解决真空器清理问题。每个数字代表完成该状态的概率的最新近似值。这种估计被称为状态值，而整个表格被称为学习的或信息的值函数。\n\
  \n如果从状态 A 获胜的估计高于状态 B，则判定状态 A 的值更大（更好）。因为如果所有空间都已清理，所有网格已清理的情景概率均为 1。\n\n为了选择下一个动作，智能体从每个可能的动作中查找当前值：\n\
  \n- **函数 1：** 表示四个方向之一；\n- **函数 2 和 3：** 智能体清理灰尘或不清理。\n\n\n\n\n\n- 学习者和决策者是 `agent`。\n\
  - `agent` 的环境（environment）是其观察、倾听并决定下一步采取何种动作的地方。\n- `agent` 可以执行的动作集合。\n- `agent`\
  \ 在 `environment` 中的当前状态。\n- `environment` 对 `agent` 执行的每一个动作都提供奖励（reward）。通常使用标量值。\n\
  - `Policy`（策略）是 `agent` 的监督函数（决策控制策略），它将各种情况映射到动作。\n- 状态的价值是从起始状态开始执行特定 `policy`\
  \ 所获得的持续奖励。\n\n### 7.5.2 强化学习 (RL) 算法的分类\n\n- 从训练样本中诱导函数的挑战被称为 `function approximator`。常见逼近器的示例如下：\n\
  \    - 神经网络；\n    - 最近邻算法；\n    - 决策树算法。\n- 概率模型：\n    - 这种方法存在精确数量的状态。\n    - 当前状态和选择的动作将有助于估计未来状态的概率分布。\n\
  - 动态规划 (DP)：\n    - 它是一组针对具有复合成本结构的连续决策问题的解决技术。\n- 蒙特卡洛方法：\n    - 它是一种价值函数学习方法。\n\
  \    - 它通过从起始状态开始多次尝试，并对这些尝试中获得的所有奖励取平均值来评估状态价值。\n- 时差分算法：\n    - 它是一种通过比较时间序列预测的学习算法。这可能是整个强化学习中最基础的概念。\n\
  - `agent` 对世界的感知由模型表示，该模型将状态-动作对映射到状态的概率估计。\n\n**示例 2：**\n\n我们有一个 `agent` 和一个奖品，但沿途中有很多障碍。`agent`\
  \ 的工作是找到通往奖励的最有效路线。其难度可以通过以下问题得到更好的解释。\n\n机器的目标是在避开火障碍的同时获得钻石奖品。机器人通过尝试所有可能的路径来学习，然后选择一条能提供最佳奖励且障碍最少的路径。每一步正确的步骤都会奖励机器人，而每一步错误的步骤都会扣除机器人的报酬。当你接近最终奖品——钻石时，将计算整个奖励。\n\
  \n强化学习最重要的方面如图 7.5 所示。\n\n![图 7.5 强化学习的方面。](img/fig7_5_B.jpg)\n\n图 7.5 强化学习的方面\n\
  \n1. **输入：**\n    - 输入应该是模型赖运行的起始状态。\n2. **训练：**\n    - 根据输入，模型将建议一个状态；用户将根据输出和从以往经验中学到的决定给予奖励还是惩罚；\n\
  \    - 模型不断演进；\n    - 优解由最高可能的支付金额决定。\n3. **输出：**\n    - 有许多可能的输出，就像给定的问题有很多解决方案一样。\n\
  \n有许多可能的输出，就像给定的问题有很多解决方案一样。\n\n`RL` 的目标是在以下方面做出 `decisions`：\n\n- **`RL` 的益处：**\n\
  \    - 增强性能；\n    - 持续性；\n    - 提高质量。\n- **`RL` 的缺点：**\n    - 过度应用可能导致；\n    - 它提供的足够了。\n\
  - **`RL` 的应用：**\n    - 机器人；\n    - 工业；\n    - 数据处理。\n\n### 7.5.3 智慧城市中的智能交通\n\n\
  智慧城市的智能交通设计将通过将 `STS` 与 `automation` 结合来处理城市。`5G` 通信技术与 `IoT` 设备的普及是 `STS` 的重要因素。下文智能交通。\n\
  \n### 7.6 智能交通管理\n\n“智能和智慧交通系统利用多种技术不仅进行管理，而且进行评估，反过来将提高`safety` 以及`efficiency`\
  \ 水平”，如图 7.6 所示。\n\n![图 7.6 智能交通管理及其参数。](img/fig7_6_B.jpg)\n\n图 7.6 智能交通管理及其参数\n\
  \n这些系统基于：\n\n- 管理；\n- 效率；\n- 安全。\n\n换句话说，智能交通让城市移动变得：\n\n- 成本效益；\n- 更安全；\n- 更方便。\n\
  \n### 7.6.1 哪些新技术开启了这些新可能性？\n\n`5G` 技术与 `IoT` 设备的普及是 `STS` 的重要因素。`IoT` 设备由物理机器上的廉价控制器和传感器组成，这些机器进行远程维护。`5G`\
  \ 技术提供了智能和感性交通网络控制所需的低延迟和高速连接。\n\n智能交通已经在许多地方实施，从它们的成功和失败中汲取的经验被应用于新系统。下面列出了几个示例：\n\
  \n- 纽约等主要枢纽已将智能交通创新作为其向智慧城市持续转型的一部分。\n- 另一方面，怀俄明州州是联网汽车的显著测试平台，这不仅提高了供应链的效率，还减少了长途货车司机的需求，他们必须在满载计划表和剩余人力之间取得平衡。\n\
  \n## 7.7 交通技术最重要的优势\n\n### 7.7.1 来自智能交通管理系统的信息\n\n数据收集是负责任的基础管理的关键组成部分。它不仅为智能交通系统的每个组件提供完整数据，还帮助管理者改进跟踪维护需求，识别问题的关键来源并监控必须处理的操作。\n\
  \n等等，当智慧城市通过智能交通丰富时，会实现各种优势，如图 7.7 所示。\n\n![图 7.7 智能交通的优势。](img/fig7_7_B.jpg)\n\n\
  图 7.7 智能交通的优势\n\n#### 7.7.1.1 更安全\n\n自动交通系统通过结合 `IoT`、`5G` 和 `ML` 等技术，具有消除事故中“人为因素”的潜力。计算机不容易疲劳、分心或产生情绪。\n\
  \n#### 7.7.1.2 更好的跟踪能力\n\n#### 7.7.1.3 增强的效率\n\n\n\n\n更有效的管理意味着更高效的利用。高质量数据不仅有助于识别区域，还能提高效率。也许列车时刻表的微调就会导致满员率的提升，而如果公交站分布得合理，公交路线将能够更好地服务于社区。\n\
  \n## 7.7.1.4 成本效益\n\n由于智能交通系统对可用资源进行了高效利用，结果是能源消耗和成本的减少、预防性维护的增加以及分配给交通事故资源的最小化。当公共交通负担得起时，乘客可以节省资金，而与努力拥有私家车的行为相比，这是高效的。\n\
  \n## 7.7.2 交通管理组件\n\n它们可以针对影响公共安全的易发事故和拥挤区域接收快速的突出显示和通知，包括应急响应系统、城市街道交通 [10]，并允许他们与应急响应人员和其他机构进行更有效的互动。\n\
  \n除了上述提到的管理、安全和效率提高提高外，地方政府、普通公众以及全球范围内还有许多其他优势 [8]，列举如下：\n\n* 安全；\n* 供应链的韧性；\n\
  * 环境考虑因素。\n\n### 7.7.2.1 安全\n\n智能城市对网络攻击的敏感性是怀疑论者关注的重点。毕竟，随着全球变得日益紧密，针对连接互联网的银行系统和电网等关键基础设施的网络攻击在犯罪分子甚至国家之间已在事实上成为常态\
  \ [12]]。\n\n远在计算机、电网和银行出现之前，其他基本基础设施（如交通）就受到物理攻击的影响。当网络基础设施和车辆整合时，自动特性得到了提高，这增加了物理风险，如汽车盗窃、恐怖分子利用车辆作为武器以及将公共交通作为人质的意图，都可以通过加密技术予以消除\
  \ [9]]。\n\n另一方面，网络攻击比应对上述物理威胁要容易得多。网络攻击可以通过图 7.8 中所示的技术来缓解。\n\n![图 7.8 参与缓解网络攻击的技术。](img/fig7_8_B.jpg)\n\
  \n图 7.8 参与缓解网络攻击的技术。\n\n* 加密通信；\n* 多层安全技术；\n* 虚拟专用网络 (VPN) 隧道；\n* 软件更新。\n\n这意味着，当智能交通融入智能城市时，可以通过最大限度减少物理攻击和网络攻击的风险，使当前的公共交通更加安全\
  \ [13]]。\n\n### 7.7.2.2 供应链韧性\n\n新冠肺炎等全球性灾难证明了世界供应链一旦中断是多么敏感。当重型和轻型车辆司机不适时，他们在从一个地方到另一个地方的过程中公共健康面临高风险。在这种情况下，可以使用自动货物运输来拯救生命。\n\
  \n像怀俄明州的联动车辆项目这样的项目可以为自动供应链铺平道路。它设计为智能城市间的交通与物流联合系统，用于运输食物和应急物资等关键产品，而不会让人类驾驶员面临风险。自动化、人工智能\
  \ (AI) 和机器人技术可以增强人类劳动力和供应链，提高安全性和保障。\n\n### 7.7.2.3 环境考虑因素\n\n交通运输与环境密不可分。从消耗煤炭的蒸汽机到如今的燃气内燃机，运输对地球的资源和大气产生了负面影响。\n\
  \n科学进步每天都在取得，以识别电力运输所需的替代能源资源。智能交通也有助于社区更负责任地利用其现有资源。\n\n虽然公共或集体的交通比使用私家车对社会更健康，但由于在某些地区极不方便，私家车在美国和少数其他国家不会被广泛使用。另一方面，智能交通解决方案可以提高现代公共交通的效率，使其对更广泛的人群更有力。随着城市交通技术的进步，成功的方法可以复制并扩展到希望获得基于智能交通城市收益的地区。\n\
  \n## 7.7.3 智能城市交通系统的缺点\n\n尽管具有所有优点，但在采用智能和智能化城市交通系统时可能会出现一些缺点。这些问题主要围绕两个因素：\n\n\
  * 电力消耗；以及\n* 数据管理。\n\n### 7.7.3.1 传感器与电力消耗\n\n智能城市的设计采用了传感器，而所有这些传感器都需要电力。这将导致连接到移动对象的传感器需要使用电池。虽然固定或不可移动的传感器足以依靠太阳能运行，但它们几乎总是连接到智能城市的电力系统。要将整个世界转变为智能城市，为所需的大量的传感器（例如万亿个传感器）供电在实践上是不可能的。\n\
  \n即使传感器连接到电网，其所需的原材料（例如：铜）的数量也远大于全球人口习惯的生产量。\n\n### 7.7.3.2 数据管理\n\n除了电力，现在还有关于大量人口使用互联网的讨论，这导致如今在线产生了大量的个人数据。\n\
  \n数据充当着智能城市的基石或骨干。没有数据，它们就无法运行。与在线数据相比，所需的大部分数据是非结构且未经过认证的。这将需要人们在行为和心态上的转变。汽车应该获取位置数据，而部署在城市各处的传感器则必须被动捕捉白天发射的信号。\n\
  \n如果集成智能交通的智能城市要在未来繁荣，就需要开发负责管理数据的规则和程序。\n\n## 7.8 智能交通的工作流程\n\n### 7.8.1 交通控制中的车车通信\n\
  \n公共基础设施和汽车部门是智能交通所属的两个主要类别。当网络中的传感器连接到基础设施和车辆上，以实现远程监控、车辆控制和个人安全的目标时，这两个领域就变得“智能”。\n\
  \n考虑一个拥挤的交叉路口。行人正在尝试过马路。交通流由信号灯控制。车辆司机正急于试图到达目的地。传统的交通系统使用定时器、路面压力板，或者在路缘处放置按钮让行人开启灯光。\n\
  \n注意（并遵守）信号灯是驾驶员和行人的责任。然而，如果网络中的任何一个节点故障，安全和效率都会受到影响。注意力不集司机会闯红灯。当行人忘记按过路按钮时，他们就错过了机会，必须等待更久。\n\
  \n\n\n然而，这一切在智能交汇处发生了变化。车辆可以结合`Bluetooth`（蓝牙）和`LiDAR`识别行人，并自动刹车以防止事故。压力板和计时器无法捕捉汽车传输的个体信号，因此路灯不仅可以识别道路上等待的车辆确切数量，还能更准确、有效地识别行驶方向。汽车和路灯之间甚至可以互动，到灯光变绿时汽车开始移动，灯变红时减速并停止。\n\
  \n这一切的实现得益于交通技术的应用，例如 `IoT` 和 `5G` 连接速度实现了实时活动和远程传感。\n\n# 7.9 城市交通技术实例\n\n## 7.9.1\
  \ 繁华的大都市\n\n无论智能城市的优缺点如何，这项技术现在已经可用并投入使用。智能传感器和自适应控制器正被应用于全球的客信息系统 [11]、公共交通调度系统以及铁路网络，并涵盖美国的大部分地区。以下是智能城市交通的一些实例。\n\
  \n### 7.9.1.1 迈阿密-戴德县的智能交通管理\n\n南部宾夕法尼亚交通局（`SEPTA`）是宾夕法尼亚州的一个公共交通机构，`SEPTA` 采用积极列控制（`PTC`）。\n\
  \n### 7.9.1.2 智能调度系统（郊区交通管理局）\n\n#### 7.9.1.2.1 迈阿密-戴德县先进交通管理系统 (ATMS)\n\n迈阿密-戴德县人口近\
  \ 250 万，是佛罗里达州人口最多的县。迈阿密-戴德县负责管理迈阿密市及其周边地区整个城市区域的交通流，包括接近 2700 个信号路口的运行。事实上，每年信号路口和路中过街道的数量都会增加几十个。\n\
  \n迈阿密-戴德 `ATMS` 将 `Digi 4G LTE cellular routers` 作为全县交通机箱通信结构的一部分，旨在减少交通拥堵和延迟，同时提高移动性。\n\
  \n### 7.9.1.3 Ptc Septa\n\n`SEPTA`（东南部宾夕法尼亚交通局）负责费城的轻轨、地铁和公交系统。由于每天有超过 100 万名乘客，这些服务在每次车辆离开车站时都必须可靠且安全。`SEPTA`\
  \ 创建了积极列控制（`PTC`）系统来发出信号、防止脱轨和碰撞，并跟踪速度和信号违规。\n\n通过 `Digi WR44-RR mobile access router`，`SEPTA`\
  \ 实现了这一点。该设备安装在火车上，能够通过无线链路与路侧传感器进行远程通信。该设备提供火车移动数据的信号的同时，还会接收道路关闭和其他可能迫使计划调整的信息。这防止了火车进入潜在的危险状况。\n\
  \n### 7.9.1.4 智能调度系统\n\n这是一个计算机辅助调度系统。在智能城市中，公共交通是连接技术创新的关键领域。`SMART`（郊区交通管理局）在特律管理并调度了\
  \ 300 多辆公交车。\n\n公交车是人们出行的重要组成部分，因此它们必须准时、安全且无故障。该市在模拟无线电网络中使用了三座无线电塔，遍布在整个地区，以便于公交调度和位置跟踪。\n\
  \n在需要升级时，他们使用了 `Digi WR44 R mobile cellular router`。从模拟到数字的转变实现了更好的跟踪和管理。一项新创新允许\
  \ `SMART` 不仅跟踪每辆车的位置，还能跟踪其速度和维护数据。\n\n对于社会而言，智能交通市场充满广阔。随着用于智能城市的智能交通系统（`ITS`）在全球范围内被广泛使用，人们将实现现代公共交通带来的效率、成本效益和安全性。鉴于不断出现的新技术，思考未来文明将如何与其城市互动是令人着迷的。\n\
  \n# 7.10 交通强化学习 (RL)\n\n`RL` 用于解决需要连续判断的问题。它通过随着时间推移的试错学习来运作。这种结构看起来简单，但实际上非常复杂，并且可能会产生意料之外的行为。在我的新书《RL》中，你可能会了解到更多关于\
  \ `RL` 的细节。\n\n交通运输面临着许多此类困难。例如无人驾驶车辆，这现在是一个独立的领域。将任何物体或人从一个地方移动到另一个地方本质上是一个大型顺序决策问题。\n\
  \n另一方面，`ML` 从数据中创建模型。`RL` 例外，它经常需要额外的输入，因为它必须通过探索来寻找最优解决方案，这意味着在除一种情况以外的所有情况下，行为都是次优的，有时甚至是灾难性的。有多种促进安全\
  \ `RL` 的技术，但大多数研究都从模拟开始。即使在现实世界中证明了，带着新数据返回模拟进行学习也是有益的。\n\n但正在解决的最普遍的交通问题是什么？\n\n\
  -   **自动驾驶汽车**：自动驾驶面临许多非常适合 `RL` 的挑战。感知环境、利用来自其他车辆的信息、决策、战略规划和任务执行都是共同职责。在直接车辆控制方面投入了大量工作，这通常用于有限的情况，如高速公路上或自动换道。除了直接控制外，一些最令人兴奋的研究还在关注其他主题。通过逆\
  \ `RL` 来学习普通人类驾驶员的奖励函数，而不是预先指定一个合理的奖励函数，这是困难的。\n\n-   **路线与电动汽车**：电动汽车（`EVs`）面临额外问题，因为它们需要频繁充电，而充电站点数量有限。研究人员探索了使用图论和\
  \ `RL` 来重新分配物流车队中的电动汽车。短期租租赁公司面临类似的挑战。\n\n-   **交通信号灯控制**：所有交通模式都受到信号路口的限制。其理念是控制优化交通流，但大多数现有实现依赖于静态逻辑和极简的交通分布假设。事实证明，`RL`\
  \ 优于传统的交通信号技术。优化整体交通流的 `RL agent` 将比目前的人技术有效得多。`RL` 为未来从辅路汇入车辆的低到无风险合并提供了可能，届所需的速度可以信号给单个汽车或驾驶员。即使在今天，辅路已有某些最小形式的监管（如交通灯），这也是可能的。\n\
  \n\n\n\n因此，另一个应用领域是空中交通控制这并不令人意外。其主要原因是，手动操作和控制如此大量的飞行物体变得越来越具有挑战性。随着低空无人机和垂直起降飞行器（VTOL）数量的增加，一种更复杂、更自动化的解决方案（如\
  \ `RL`）变得越来越重要。\n\n然而，你可能会惊讶地发现，另一个热门 `RL` 主题是船舶自动化。航运代表了两个关键 `RL` 应用——调度与控制的交汇点。由于航运是一项基于物流需求而存在的商业活动，优化货物到达目的地的时间和路线是有意义的。最近，人们对自动驾驶船舶进行了研究，以提高安全性、降低成本、减少环境影响并打击海盗。由于\
  \ `RL` 智能体具有管理复杂动态系统的能力，它们可以被信赖来负责这些船舶的控制和导航。\n\n# 7.11 关于交通平等的最后思考\n\n在引导交通方面存在许多问题，列举如下：\n\
  \n* 最小化延迟；\n* 最大化流量；\n* 安全性问题；\n* 缺乏实时数据更新。\n\n`RL` 为交通基础设施的优先级排序提供了一种完全不同的方法：\n\
  \n* 通往学校、医院、图书馆甚至市场等优质机构的交通便利性与教育和健康成果密切相关。\n* 不同种族和社会经济群体对大城市交通网络的可及性程度不同。\n* 政府机构可以干预以增强欠发达地区的设施，或改善交通连接。\n\
  \n在实施方面，通过 `RL` 优化公交路线来增加社会公平，可能仅仅简单地修改一条公交路线。`RL` 有潜力改善那些原本没有能力塑造自己命运的人的生活。\n\n\
  `RL` 是一种优化序列决策的尖端 `ML` 技术。它有潜力改变我们旅行、移动物品的方式，并希望改善那些不幸者的生活。如果你对学习更多关于 `RL` 的知识感兴趣，我强烈推荐我的书籍《强化学习：智能体的工业化应用》。智能体在\
  \ `RL` 中通过奖励和惩罚系统来实现。智能体会对良好的决策给予奖励，并对错误的决策进行惩罚。智能体寻求在增加正确移动次数的同时，减少错误移动的数量。\n\n\
  ### 7.11.1 自动驾驶汽车应用\n\n深度 `RL` 已在许多文章中被用于自动驾驶。自动驾驶汽车有几个需要考虑的因素，包括不同地点的速度限制、可行驶区域以及避免碰撞等。\n\
  \n运动规划、轨迹优化、基于场景的学习策略、控制器优化以及高速公路的动态路径规划是 `RL` 技术可以使用的自动驾驶活动。\n\n例如，学习自动停车策略可以帮助停车。`Q-Learning`\
  \ 可用于换道，而可以通过实施超车程序或策略完成超车，同时在避开碰撞后保持恒定速度。\n\n`AWS DeepRacer` 是一种自动驾驶赛车，其创建目的是在真实的赛道上对\
  \ `RL` 进行测试。它使用 `RL` 模型和摄像头来控制油门和方向，并使跑道可视化。\n\n`Wayve.ai` 已成功地使用 `RL` 在一天内教会了汽车驾驶。为了解决跟线问题，他们开发了一种深度\
  \ `RL` 算法。他们使用了一个具有四个卷积层和三个全连接层的深度卷积网络。\n\n### 7.11.2 用于工业的强化学习 (RL)\n\n基于学习的机器人被执行工业中的许多任务。除了比人类更高效外，这些机器人还能执行对人类危险的活动。`Deepmind`\
  \ 利用 `AI` 冷却 `Google Data Centers` 就是一个极好的例子。这导致能耗减少了 40%。目前 `AI` 系统完全控制这些数据中心，不需要人工参与。数据中心专家显然负责监督。以下是该系统的工作原理：\n\
  \n* 从数据中心获取每五分钟一次的快照并输入神经网络；\n* 然后预测各种组合对未来能源的影响；\n* 识别符合标准的最小使用量；\n* 将这些步骤发送到数据；\n\
  * 本地验证动作。\n\n## 关键词 参考文献\n\n1. Bellemare, M., Dabney, R., & Munos, R. (2017). 强化学习的分布视角。Proceedings\
