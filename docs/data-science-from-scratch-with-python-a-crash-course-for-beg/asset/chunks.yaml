    \ so that they can deal with anti-change agents and handle unrealistic expectations.\
    \ With the advent of agile  methodologies, most firms have turned to sprints.\
    \ However, innovation calls for both time and patience. Stories are an amazing\
    \ way that one can create the right focus over time and build patience for teams\
    \ to help in the execution. Demos, visualizations and other types of stories motivate\
    \ Data Science teams to wait, ask questions and concentrate on visions than planning\
    \ for a sprint. Narratives deliver the right chance to think deeply and consider\
    \ a given business via interactions, system dynamics as well as how the change\
    \ in analytical capability might affect an organization. The material generated\
    \ furthermore acts as a link to share knowledge outside the organization and across\
    \ disciplines. It champions for a positive and creative spirit. \n\n3.  Ethics\
    \ and not profits \n\nSince the practice of Data Science is popular, teams should\
    \ develop a moral direction and techniques that predict the limits of their discoveries.\
    \ In addition, it is part of their leadership duty to assist in determining a\
    \ social mission of the developed algorithm and analytics. It calls for collaboration\
    \ to ensure the use of Data Science. For instance, at the MIT, urban demos provided\
    \ a means where one has to explore whether the concepts are culturally or socially\
    \ acceptable before they were potentially profitable. By championing initiatives\
    \ that would result in social good and at the same time, align people before profit,\
    \ it helps enrich the  analytical capacities with members that may not have participated\
    \ in the commercial ventures. \n\n4.  Polymathy before expertise \n\nData Science\
    \ includes a multidisciplinary concept and cannot work in isolation. To ensure\
    \ that you can collaborate with other parties, specialists must learn beyond their\
    \ domain expertise. There are certain organizations that may fall into the trap\
    \ that it is a must to have a Ph.D. to do Data Science. This is not true because\
    \ this practice calls for one to have an enhanced sense of curiosity to help learn\
    \ the language of other disciplines and an in-depth appetite for collaborative\
    \ learning. These are some of the traits of a polymath that makes a team ready\
    \ to interact with people with diverse roles in the organization from design,\
    \ product management, communication, finance and many more. Of late, terms such\
    \ as AI Designer and Product Scientist have risen in the Industry to emphasize\
    \ the importance of connecting different disciplines with the scientific method. At\
    \ the same time, specific views from interdisciplinary domains such as Science,\
    \ Technology, data bias and algorithmic have become part of the major themes of\
    \ Data Science. A generalized specialist will deliver interdisciplinary knowledge\
    \ that champions creativity and a deeper understanding of what an organization\
    \ or society needs. A team made up of generalized  specialists presents a better\
    \ general perspective for complex, deep and unconventional areas compared to a\
    \ team of experts. \n\nChapter 5: Techniques of Data Science No matter what your\
    \ opinion is about the subject of Data Science, it is very hard to look down upon\
    \ the role of data and the ability to analyze, gather and contextualize data.\
    \ Not only that, but with the development of Machine Learning technology and the\
    \ emergence of fields such as Deep Learning that prove to be of importance to\
    \ researchers. Data Scientists continue to enjoy new innovations and technological\
    \ developments. Although a strong coding skill is critical, data science includes\
    \ software engineering concepts. Data Scientists should have a mixture of coding,\
    \ critical thinking, and statistical ability. He or she should be a good statistician\
    \ as well as good at programming. It is advised that one understands the ideas\
    \ behind different techniques so that they know how and when to use them. It is\
    \ critical for a person to understand simple methods so that they can understand\
    \ complex ones. Additionally, it is good to check the efficiency of a given method\
    \ to discover whether it is working well or bad. This is an interesting field\
    \ of research that has significant applications in science,  finance, and industry.\
    \ In general, statistics is a major component that any successful data scientist\
    \ must know. Examples of Statistical Learning problems include: \n\n*   Personalize\
    \ an email spam detection system. \n\n*   Find out whether an individual has a\
    \ heart attack depending on the clinical measurements, demographic data, diet,\
    \ and clinical measurement. \n\n*   Classify a sample of tissue into different\
    \ cancer classes. \n\n*   Identify the relationship between demographic variables\
    \ and salary in the population survey. "
