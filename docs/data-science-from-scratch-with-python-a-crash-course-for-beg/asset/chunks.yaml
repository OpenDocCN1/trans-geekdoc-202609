    # Chapter 1: Basics of Data Science


    The arrival of big data resulted in the expansion of storage space. As a result,
    storage became the biggest hurdle for most enterprises. Besides this, both organizations
    and enterprises required to build a framework and develop a solution to store
    data. Therefore, `Hadoop` and other frameworks were developed to solve this problem.
    Once this issue is resolved, the focus shifted to how data could be processed.
    When it comes to data processing, it is hard not to talk about Data Science. That
    is why it is essential to understand what Data Science is and how it can add value
    to a business. This chapter will take you through the definition of Data science
    and the role it plays in extracting essential insights from complex data.


    ## Why Data Science is Crucial


    Traditionally, data is structured in a small size. This means that there was no
    problem if you wanted to analyze data. Why? There were Simple `BI` tools that
    you could use to analyze data. But, recent data is unstructured and different
    from traditional data. Therefore, you need to have advanced methods of data analysis.
    The image below indicates that before the year 2020, more than eighty percent
    of the data will be unstructured.


    This data comes from different sources, such as text files, financial logs, sensors,
    multimedia forms, and instruments. Simple `BI` tools cannot be used to process
    this kind of data as a result of the massive nature of data. For this reason,
    complex and advanced analytical tools and processing algorithms are required.
    These types of devices help data scientists analyze and draw essential insights
    from data.


    There are still other reasons why Data Science has increasingly become popular.
    Let’s take a look at how Data Science is applied in different domains. Have you
    ever thought of having the ability to understand the exact requirements of your
    customers from existing data such as purchase history, past browsing history,
    income, and age? The truth is that it is now possible. There are different types
    of data that you can use to train models and accurately recommend several products
    to customers effectively.


    Let’s use a different example to demonstrate the role of Data Science in decision
    making. What if your car is intelligent enough to drive you home? That would be
    cool. Well, that is how the self-driving cars have been designed to work. These
    cars gather live data from sensors to build a map of its surroundings. Based on
    this data, the vehicle can make decisions such as when to speed down, when to
    overtake, and when to take a turn. These cars have complex machine learning algorithms
    that analyze the data collected to develop a meaningful result.


    Data Science is further applied in predictive analytics. This includes places
    such as weather forecasting, radars, and satellites. Models have been created
    that will not only forecast weather but also predict natural calamities. This
    helps an individual to take the right measures beforehand and save a lot of lives.


    ## Definition of Data Science


    The term Data Science is common nowadays, but what does it mean? What skills does
    a person need to have to be called a Data Scientist? How are predictions and decisions
    made in Data Science? Is there a difference between Data Science and Business
    Intelligence? These are some of the questions that you are going to find answers
    to in a short while.


    First, let’s define Data Science. Data Science refers to a combination of several
    tools, machine learning principles and algorithms whose purpose is to discover
    hidden patterns from raw data. One might wonder how different it is from statistics.


    ![](rsrc1FB.jpg)


    The figure above shows that a Data Analyst explains whatever is happening by processing
    the history of the data. On the other hand, a Data Scientist will explain how
    to extract insights from it, and they will also use different advanced machine
    learning algorithms to highlight the occurrence of a specific event in the future.
    A Data Scientist looks at the data from different perspectives and angles. Therefore,
    Data Science helps an individual predict and make decisions by taking advantage
    of prescriptive analytics, machine learning, and predictive causal analytics.


    *   **Prescriptive analytics** - If you need a model that has the intelligence
    and capability to make its own decisions, then prescriptive analytics is the best
    to use. This new field delivers advice, it doesn’t just predict, but it also recommends
    different prescribed actions and related outcomes. The best example to illustrate
    this is the Google self-driving car. Data that is collected by the vehicle is
    used to train cars. You can further mine this data by using algorithms to reveal
    intelligence. It will allow your vehicle to make decisions such as when to turn,
    which path to take, as well as when to speed up or slow down.

    *   **Machine learning for pattern discovery** - Let’s assume that you don’t have
    resources that you can apply to make predictions; it will require you to determine
    the hidden patterns in the data set to predict correctly. The most popular algorithm
    used in pattern discovery is `Clustering`. Assume that you work in a telephone
    company, and you want to determine a network by installing towers in the region.
    Therefore, you may use the clustering technique to determine the tower location
    that will make sure all users have the maximum signal strength.

    *   **Make predictions with machine learning** - If you want to build a model
    that can predict the future trend of a company, then machine learning algorithms
    are the best to go with. It falls under supervised learning; it is called supervised
    because data is already present that you can use to train machines.

    *   **Predictive causal analytics** - If you need a model that can help predict
    the chances of a given event happening in the future, you need to use predictive
    causal analytics.


    ## Requisite Skillset for a Data Scientist


    ### Mathematics Ability

    At the center of mining, data insight and developing a data product is the potential
    to see data through a quantitative lens. There are correlations, textures, and
    dimensions in data that one can represent mathematically. Developing solutions
    that make use of data involves heuristics and quantitative techniques. Answers
    to most business problems include building analytic models that are grounded in
    complicated math, where it is crucial to understand the principle behind the models.


    Another misconception spread by people is that data science is mainly statistics.
    Even though statistics are critical in data science, it is not the only type of
    math learned. There are two categories of Statistics-`Bayesian statistics` and
    `classical statistics`. Most people tend to refer to classical statistics when
    they speak about stats. However, one is required to know both types of statistics.
    For instance, a common method to determine hidden characteristics in a data set
    is the `SVD`. This method is rooted in matrix math and it is suitable for data
    scientists to have both breadth and depth of mathematics knowledge.


    ### Strong Business Acumen

    It is good for a data scientist to have the traits of a tactical business consultant.
    By working alone with data, they have the edge of discovering new concepts from
    data in ways that no one can. As a result, they have the task to translate observations
    that they see into shared knowledge and recommend strategies in which they can
    solve major business problems. Therefore, a data scientist should be able to use
    data to create a story. The story has to be a cohesive narrative of the problem
    and solution.


    ### Technology and Hacking

    Hacking, in this case, refers to the creativity and ingenuity in the application
    of technical skills to define solutions. The ability to hack is essential because
    data scientists make use of technology to amass massive data sets and work with
    advanced algorithms. The main languages linked with data science include `SAS`,
    `Python`, and `R`. Other languages include `Julia` and `Java`.


    ### Data Scientist – Curiosity and the Mindset

    A popular trait of most data scientists is that they think deeply and have an
    intense curiosity. Data science calls for one to be inquisitive. An individual
    has to regularly ask new questions, make discoveries, and learn new things. Extracting
    insights from data goes just beyond making observation; it is all about discovering
    the truth beneath the surface.


    ## Machine Learning


    The focus of Machine Learning is to learn the nature of data and apply it to specific
    models. Even though `ML` is a field in computer science, it is not the same as
    traditional computational methods. When you look at conventional computing, algorithms
    are described as a set of programmed instructions. Machine Learning allows computers
    to create a model from a data sample. Nowadays, this type of technology is applied
    in movies, shows, and e-commerce.


    ### Machine Learning Techniques

    When it comes to the field of machine learning, there are tasks that are categorized
    into different divisions. Most of these divisions depend on how knowledge is performed,
    or on the type of feedback delivered. The most popular machine learning methods
    include `supervised learning` and `unsupervised learning`.


    #### i) Supervised Learning

    For supervised learning, the computer has an example of input data to work on.
    The aim of this method is to allow the algorithm to “learn” by comparing actual
    output using a trained output to discover errors and alter the model. In other
    words, this method contains patterns that assist in predicting label values on
    extra data that is unlabeled. For example, you can feed an algorithm data with
    shark images and label them as `fish`. Also, you can supply it with pictures of
    oceans and mark it as `water`. One of the most popular use cases of supervised
    learning is the application of historical data to help forecast the statistical
    chance of an event to happen. It can use historical stock market data to predict
    future changes in the market. Additionally, it can help in the filtering of spam
    emails.


    #### ii) Unsupervised learning

    Unlike supervised learning where data is labeled, with unsupervised learning,
    you deal with unlabeled data. This means that it is the task of the learning algorithm
    to identify similar features in the data that it is supplied. Since unlabeled
    data is prevalent compared to labeled data, techniques of machine learning are
    among the most valuable in the industry. The most significant application of unsupervised
    learning is within the transactional data. There can be a massive data set made
    up of customers and the products they purchase, but since you are a human, you
    can’t manage to extract meaning and similarity from customer profile and their
    purchase history.


    ### Machine Learning Strategies

    Machine learning is highly linked to computational statistics. If you have some
    knowledge of statistics, it is essential to understand and apply machine learning
    algorithms.


    *   **Correlation**: This describes the association that exists between two variables
    said not to be independent or dependent.

    *   **Regression**: At the lowest level, it is helpful at determining the relationship
    between one independent and dependent variable.

    *   **The K-Nearest Neighbor**: This particular algorithm is applied to the pattern
    recognition model. The pattern recognition model is used in classification and
    regression. The `k` is a positive integer.

    *   **KNN classification**: When it comes to this method, its output belongs to
    a specific class. For example, when `k = 1`, the algorithm assigns a new object.
    When `k = 3`, the algorithm will have to pick three nearest neighbors.


    ### Decision Tree

    In general, decision trees are important when you want to create a visual representation
    of decisions. The diagram below describes this algorithm. The diagram has blue
    diamond and orange objects.


    ![](src1FC.jpg)

    ![](src1FD.jpg)

    ![](src1FE.jpg)

    ![](src1FF.jpg)


    ### Deep Learning

    With deep learning, it will always try to copy the human brain and how it succeeds
    in processing stimuli. Neural networks power the architecture of deep learning
    which contains many layers and is one of the best methods applied in AI.


    ### Programming Languages

    When a person wants to choose a language to learn with machine learning, there
    are few things that are available. Other languages include `C++`, `Java`, and
    `R`.


    ## Data Science and the Cloud


    To be a data scientist, you need to have solid programming skills. Even though
    you might not be well familiar with all programming concepts such as production
    architecture and infrastructure, you require to have some skills in computer science.


    ### What is the Cloud?

    While it sounds hypothetical and abstract, a cloud has a concrete meaning. Before
    moving on, here is a definition of a few concepts you need to know:


    *   **Network**: This refers to a collection of computers connected together that
    share resources. The internet is a good example. Home networks like `Wi-Fi Service
    Set` and `Local Area Network` have multiple computers connected. Computers in
    a network are referred to as `nodes`.

    *   **Shared Resources**: Includes media, web pages, app servers, data storage,
    and printers. Intercommunication between computers is through internet protocols
    such as `HTTP`, `TCP`, and `IP`.

    *   **Data Center**: It is hard for computers to be located on-premise. In other
    words, both data and applications are found on computers in the data center. A
    data center is useful because it has the necessary infrastructure to support security
    and protection.

    *   **Cluster**: Refers to a group of computers connected to the same network
    and all work to accomplish a similar task. You can consider it as a single computer
    that can improve performance, scalability, and availability.


    In simple terms, the cloud refers to the process where a single entity can have
    total control over a group of network computers and generate software solutions.
    Depending on how cloud is defined, the internet is said to be a network and not
    a cloud.


    ### Data Science in the Cloud

    Anyone who is familiar with data science is aware that the process takes place
    in the local machine of the data scientists. The computer is already installed
    with a programming language, which can be `R` or `Python`. The data scientist
    further installs relevant development packages using a manager such as `Anaconda`
    or installs individual packages manually. Once the development environment is
    ready, then the usual data science workflow starts, with data as the only element
    needed. Sometimes, it is not a must to carry out all the data science and big
    data-related tasks in a different local development environment. If such instances
    arise, people deploy the computing task to an on-premise machine or even a cloud-based
    virtual machine.

