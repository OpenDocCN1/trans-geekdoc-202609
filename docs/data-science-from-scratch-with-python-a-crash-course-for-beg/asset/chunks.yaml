    # Chapter 6: Big Data Analytics and Data Science


    Regardless of whether you are going to enhance the supply chains, monitor floor
    operations, measure consumer sentiment or any large scale analytic problems, big
    data has a huge effect on the enterprise. The size of business data produced has
    increased by a huge value each year and various types of information are stored
    in digital formats. One of the biggest challenges involves learning how you can
    handle new data types and discover the type of information that offers value to
    your business. It is not just about how you can access new data sources, but the
    inter-relationships among elements and patterns are also important. Gathering
    different types of data rapidly does not produce value. You must use analytics
    to discover insights that will support the business. Big data does not create
    new storage mechanisms and new data types, but it also develops new analyses.
    This chapter will define big data analysis, review different ways that one can
    analyze big data to develop patterns and relationships. In addition, you will
    learn how to make informed predictions and derive business insight from a huge
    influx of information. It is important to note that big data is not an independent
    set of activities. Therefore, you require a cohesive set of solutions to help
    in big data analysis, collect data and discover new insights to help make frequent
    decisions. Most organizations achieve their tasks by application of both commercial
    and open-source components. Building an integrated architecture for big data analysis
    enables a person to perform different types of activities and transfer data among
    components.


    ## How does Big Data matter?


    Big data describes datasets that have a size that surpass the normal function
    of database software tools such as storage, capturing and analyzing. It refers
    to a collection of datasets that are very large and complex such that one cannot
    process using simple database management tools.


    ### Big Data analytics


    The term Big Data analytics has widely been used in the market today. In most
    cases, it is used together with other related concepts such as data mining and
    Business Intelligence. While all these terms refer to how data is analyzed, Big
    data is not the same when several transactions, data volumes, and data sources
    become big and complex. In this situation, specific methods and technologies are
    required to extract insight from data. This leads to the general definition of
    big data, which includes the three V: Velocity, Variety, and Volume.


    *   **Volume**: This refers to a large data set.

    *   **Variety**: Describes data that comes from different data sources. It is
    possible to have data that originates from external and internal data sources.
    The most important thing is that data can be in any format. It can be log data
    or even structured data from database tables and semi-structured data such as
    `XML`.

    *   **Velocity**: Describes large sizes of data from transactions featuring higher
    refresh rates in data streams that have a higher speed and time.


    From the above description, Big Data can be considered as a high-velocity, high-volume
    and high variety information repository that requires a cost-effective and innovative
    means of information processing. This process leads to improved insight, better
    decision making, and improved process automation. Up to this point, it should
    be obvious that big data is not just about how large the data is volume, but the
    data should also arrive at a fast speed and in a complicated form. In addition,
    it should arrive from different sources. Most important, it is good to highlight
    that there could be a lot of value in attempting to define the elements that constitute
    big data. Every individual should know that the big data of today may not be the
    same as the big data of tomorrow because technologies keep changing. In short,
    it is relative.


    ## The kind of data we are talking about


    Organizations have a tradition of capturing transactional data. Besides that,
    organizations capture and store extra data from its operational environment at
    a fast speed. Some examples include:


    *   **Text data**: This is one of the biggest and most popular types of big data.
    The goal is all about developing major facts from a text and using the facts as
    inputs to the remaining analytic process.

    *   **Web data**: The data from web users, such as searches, reading, page views,
    purchasing can be captured. This can be used to improve performance in fields
    such as churn modeling, targeted advertisement, and customer segmentation.

    *   **Smart grid and sensor data**: Nowadays, sensor data is recorded from oil
    pipes, cars, and windmill turbines. This data is collected at an extremely higher
    frequency. The sensor data generates deep information related to the performance
    of machinery and engines. It facilitates the diagnosis of problems and faster
    development of mitigation mechanisms.

    *   **Time and location data**: The `GPS`, `WI-FI` connections and mobile phones
    make time and location a good source of data. As a result, most organizations
    have come to understand the importance of monitoring the movements of their customers.
    The organizations embrace the need to know where their customers are at any given
    time. Another important thing is being able to look at time and location data
    at an aggregate level. While more individuals continue to open their location
    data and time, many good applications arise. Therefore, time and location data
    becomes one of the most privacy-sensitive big data types that must be treated
    with a lot of caution.

    *   **Social network data**: Within the social network sites as `Facebook`, `Instagram`,
    and `LinkedIn`, it is possible for one to perform link analysis and discover the
    network of a given user. Social network analysis can present insights into what
    type of advertisements can appeal to users. This is achieved by taking into consideration
    the interests of customers and their circle of friends. With many of these big
    data sources, the advantage doesn’t lie in the type of data source but the value
    that it can generate in combination with other data sources. It is a combination
    that is very important.


    ## The different types of insight


    Besides data, there is something called paradigm shift based on the analytic focus.
    This refers to a change from descriptive analytics to predictive and prescriptive
    analytics. When it comes to descriptive analytics, it attempts to respond to questions
    about what happened in the past. Typically, this is all about reporting. Below
    are some examples of questions that are dealt with in descriptive analytics:


    *   Which is the most profitable customer or product?

    *   What amount of sales was generated in the first quarter of the year?

    *   How many customers did we lose or win in the first half?


    Predictive analytics focuses on something that may happen next. This is very difficult
    and involves trends and patterns of the future. Examples of questions include:


    *   What is the approximated number of call in the next quarter?

    *   What is the best offer for customer?

    *   Which customers are likely to churn?


    Prescriptive analysis attempts to respond to questions related to “how can I handle
    this.” This is the point when analytics becomes operational and dependent. With
    the arrival of big data, it is now possible to:


    1.  Derive forward-looking insight.

    2.  Increase the appetite and ability for quick and actionable insight.


    Forward-looking insight means that business had the ability to predict what may
    happen next. Traditionally, this was possible, but accuracy was limited. Therefore,
    big data changed the equation. For instance, a recommendation system can automatically
    generate personalized recommendations like the way another person wants to buy
    because of viewing history.


    ## Business value of data analytics


    Big data delivers a significant benefit to any business. It helps draw insights
    from data, make smart decisions depending on the insight and automate decisions.
    On a detailed level, every big data solution addresses a specific problem that
    exists. When developing big analytics project, one should begin with a business
    target instead of choosing to collect data or picking the right tool.


    ## New Web: Visual, Semantic and API


    Since the introduction of the new web, the web has greatly changed. The web of
    today become even more visual. To upload a photo on the web is just a click of
    button. But this was not the case 20 years ago. If you can go back to 1990s and
    think about how computers and the internet were, then you will realize how much
    effort been made to improve technology.


    ### Linked Data and Semantic Web


    It is not just that data has increased in size alone, but also the web grows and
    data silos continue to reduce, data also interconnected. Most data sets cannot
    be easily connected to each other. However, major steps have been achieved now.
    The web has continued to become semantic. Linked data refers to the practice of
    sharing, exposing and integrating pieces of data, and information on the same
    Web. Both computing devices and human beings gain when data is unconnected is
    connected. This is normally done through Web technologies such as `uniform resource
    identifiers` and `Resource Description Framework`.


    ### Ease of accessing data


    Yes, there is a lot of data more than you can imagine, and most organizations
    have a challenge when comes to drawing important insight from the data. Luckily,
    all hope is not lost. The available data management tools in organizations have
    never so good than today. Before the internet era, many large organizations transferred
    their data from many different databases, systems and data warehouses. Database
    experts and administrators create scripts and stored procedures which automate
    most of these processes. Batch procedures would run early.


    ### Better efficiency in the clouds


    It is true that the web cloud is causing a big impact on many organizations across
    the globe. The history of the web started as the mainframe era before it went
    to the client-server era and now we are in the mobile–cloud computing era. To
    move from one era to another called for a lot of developments and effort. This
    doesn’t happen overnight The dawn of Big Data and Open Data created a lot of opportunities
    and room for organizations to enhance their operations. As a result, there has
    been a huge improvement in business intelligence solutions and statistical packages.


    ### Level of measurement


    A decision tree has the ability to accommodate both quantitative and qualitative
    data. Quantitative data consists of weight and height, it describes quantities
    that one can modify using arithmetic operations such as subtraction, multiplication,
    and addition. On the other hand, qualitative may consist of gender and cannot
    be applied in arithmetic operations, but it is presented in decision trees. Other
    types of data, such as shoe size, may both be quantitative and qualitative. For
    instance, you may fail to perform meaningful arithmetic with shoe size although,
    the number sequence in shoe size is in order.


    ## Tools Used in Data Science


    There are a lot of Big Data tools that one can use for analysis. In simple terms,
    data analysis is defined as a process of inspecting, cleaning, transforming and
    modeling data with the sole reason to discover important information, conclusions
    and suggest the right decision. This Chapter will outline to you the best tools
    which Data Scientist use in the process of cleaning, modeling, transforming and
    analyzing data.


    ### Open Source Data Tools


    a) **OpenRefine**: Formerly called Google Refine. It is a great tool for one to
    use to work with data that is disorganized. This tool lets a data scientist clean
    and changes the format of data. Additionally, a data scientist can decide to integrate
    the data with external data. The tool helps an individual perform large scale
    data exploration and discover patterns in data easily.


    b) **Orange**: An open-source data visualization and analysis tool designed to
    be used by those people who are not experts in data scientists. It has a simple
    interactive workflow and an advanced toolbox to help a person build interactive
    workflows that they can analyze and visualize data. However, the type of visualization
    which Orange creates is different from scatter plots, bar charts, and dendrograms.


    c) **Knime**: `KNIME` is another open-source solution to use in data analysis.
    This tool allows an individual to explore and discover hidden insights in data.
    The tool has over 1000 modules and hundreds of examples that one can run to learn
    how to use it. In addition, there is advanced range of integrated tools any data
    scientist can use.


    d) **R-Programming**: This is considered as the standard tool among programming
    languages. Some people consider it as “golden boy” of data science. `R` is also
    open-source software that anyone can install and use, upgrade it, modify it, clone
    it. It is compatible with `Windows`, `macOS` and `UNIX`. It is a high-performance
    language that will help users deal with extensive data.


    e) **RapidMiner**: Similar to `KNIME`, `RapidMiner` deals with visual programming
    and is the best when it comes to modeling, analyzing and manipulation of data.
    It improves the productivity of data science teams. It is an open-source platform
    to support machine learning, model deployment, and data preparation.


    f) **Pentaho**: Deals with problems that affect the ability of organization to
    accept value from different data. The platform will simplify data blending as
    well as a collection of tools used in the analysis, visualization, reporting.


    g) **Weka**: Another open-source software designed with the capability to handle
    machine learning algorithms to use in data mining tasks. You can directly use
    the algorithm. Graphical Interface of `Weka` is simple and easy. It is fully implemented
    in `JAVA`. Anyone can invoke the library into code.


    h) **NodeXL**: A data visualization and analysis tool that shows relationships
    in a data set. Since it is open-source software, it is free to use to analyze
    and create visualizations. It has different modules such as social network importers
    and automation. With `NodeXL`, you will still analyze your data fast.


    i) **Gephi**: Written in `Java` language, `Gephi` comes as open-source visualization
    and network analysis tool.


    j) **Talend**: The leading open source integration provider to most data-driven
    enterprises. It allows customers from any place to connect with easy.


    k) **Datawrapper**: It is an online-visualization software that one can use to
    build interactive charts. A user will upload data from `CSV`, `Excel` or `PDF`
    file into the field, this tool processes the data and generates map, bar, and
    line. Graphs produced by `Datawrapper` can be installed into any website.


    l) **Tableau Public**: This tool will democratize visualization in a very elegant
    and simple way. It is a very powerful tool to use in any type of business. One
    is able to identify data insights with the help of `Tableau` visualization tools.
    `Tableau` allows a data scientist to explore data before moving into a complex
    process.


    m) **Infogram**: It has over 35 interactive charts and over 500 maps to allow
    an individual to visualize data in the most beautiful way. It creates different
    charts such as word cloud, pie, and bar chart. `Infogram` also supports a map
    that can capture the attention of the audience.


    n) **Google Fusion Tables**: This is one of the most interesting and powerful
    data analysis tools. The best to use when you have a large data-set that you want
    to visualize and map. With its powerful mapping software, `Google` plays an important
    role in creating this tool.


    o) **Solver**: Build with the ability to support effective financial reporting,
    budgeting and analysis. It has a push-button that will let anyone access and interact
    with data that generates more profit in a company.


    p) **OpenText**: This is a specialized classification engine applied in identification
    and evaluation of expressions and patterns in the textual content. The analysis
    takes place at the document, sentence and topic level.


    q) **Tracker**: An automated sentiment analysis software that highlights a particular
    keyword tracked by an individual. It monitors all social media and mainstream
    news to draw important insights through the discovery of trends.


    r) **Opinion Crawl**: Another online sentiment analysis software applied to the
    analysis of the latest news, products, and companies. It gives freedom to every
    visitor to access Web sentiment in a specific topic. Anyone can type, participate
    in a topic and receive ad-hoc sentiment assessment. For each topic, there is a
    pie chart to display the latest real-time sentiment and a list of current news
    headlines. Besides that, there are different thumbnail images and a cloud tag
    to include different concepts the public can easily relate with. This tool allows
    a person to see events which affect the sentiment in a positive or negative way.
    To create a comprehensive analysis, web crawlers search for the latest content
    published on common subjects and current public issues.


    ### Data Extraction Tools


    s) **Content Grabber**: This is a tool that is designed for enterprises. The tool
    is built with the function to support content mining from any website and save
    that in a structured format. This consists of `CSV`, `XML` and `Excel` reports.
    It is the best tool for an expert at programming because it has a scripting and
    editing module. Also, users can still use `C#`, `VB.NET` to debug and write a
    piece of script information to take of the crawling process.


    t) **IBM Cognos Analytics**: Before this tool was developed, `Cognos Business
    Intelligence` was the one used. It is designed with a web-based interface to support
    data visualization in the BI product. It has modules for data governance, self-service
    analytics, and management. This tool also supports the integration of data from
    different sources.


    u) **Sage**: An accounting platform that supports small and mid-sized companies.
    It allows for invoices and bills. Furthermore, if you want, this could be the
    right tool.


    v) **Gawk**: `GNU` `Gawk` is a programming language. It helps users handle simple
    data reformatting by writing a few lines of code. It has the following main features:

    *   It is data-driven instead of procedural.

    *   Makes it easy for one to read and write.


    w) **GraphLab**: Both data scientists and developers use this tool to build state
    of the art products using machine learning. It has the following:

    *   Integrates automatic feature engineering, machine learning, and model selection
    to the application.

    *   Identifies and links records both within and across.

    *   It simplifies the development of machine models.


    x) **Netlink Business Analytics**: This is one of the most comprehensive on-demand
    solutions. You can access it through a Web browser or any other device and apply
    it to full enterprise. Most of the features are tailored towards sales and complicated
    analytic capability.


    y) **Apache Spark**: The tool is designed to run-in memory and real-time. As a
    result, it facilitates faster real-time analytics.


    ## The Top 5 Data Analytics Tools and Techniques


    a) **Visual analytics**: There are different methods that one can use to analyze
    data. For instance, by building a graph and discovering unique spots. This method
    consists of other methods, such as human interaction, data analysis, and visualization.


    b) **Business Experiment**: `AB testing`, business experiments, the experimental
    design consists of all techniques applied in testing the validity of something.


    c) **Regression analysis**: This method will allow you to identify a relationship
    between two different variables and the strength of the relationship.


    d) **Correlation analysis**: This is a statistical technique that will let you
    identify whether a relationship exists between two different variables. This method
    is perfect when you have some suspicion that there is a special relationship between
    two variables.


    e) **Time series analysis**: Here, data is gathered at uniform time intervals.
    You can use it anytime you want to identify changes and predict future events,
    depending on what has happened in the past.

