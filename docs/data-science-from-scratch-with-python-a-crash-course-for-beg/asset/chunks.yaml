    # 多变量图表的设计实践

    应该提供图例来描述每个变量。


    ## 柱状图 (Bar Chart)

    柱子的长度编码了数值。柱状图有两种变体：垂直柱状图和水平柱状图。


    ### 用途

    虽然它们都用于比较不同类别之间的数值，但垂直柱状图有时用于显示随时间变化的单个变量。


    ### 柱状图的原则与禁

    - 不要将垂直柱状图与直方图（Histogram）混淆。柱状图比较的是不同的变量或类别，而直方图显示的是单个变量的分布。直方图将在本章的后续部分讨论。

    - 另一个常见错误是使用柱状图显示组或类别之间的中心趋势。在这些情况下，请使用箱线图或小琴图来显示统计量或分布。


    ### 示例

    下图展示了一个垂直柱状图。每个柱子显示了五名学生在一次测试中获得的成绩（满分 100）：图：使用学生测试数据的垂直柱状图 ![](img/rsrc1G4.jpg)


    下图显示了一个水平柱状图。每个柱子显示了五名学生在一次测试中获得的成绩（满分 100）：![](img/rsrc1G5.jpg) 图：使用学生测试数据的水平柱状图


    下图比较了电影评分，给出了两个分数。番茄指数（Tomatometer）是对该电影给出好评的批准影评人的百分比。观众分（Audience Score）是给 5
    分打 3.5 分及以上的用户的百分比。正如我们看到的，《火星》（The Martian）是唯一同时具有高番茄指数分和高观众分的电影。《霍比特人：意外之旅》（The
    Hobbit: An Unexpected Journey）与番茄指数分相比，观众分相对较高，这可能是因为其庞大的粉丝基础：![](img/rsrc1G6.jpg)


    ### 设计实践

    对应数值变量的轴应该从零开始。从其他值开始可能会产生误导，因为它会让使微小的数值差异看起来非常大。使用水平标签，前提是柱子的数量较少且图表看起来不会太拥挤。


    ## 雷达图 (Radar Chart)

    雷达图也被称为蜘蛛图或网图，它通过将每个变量绘制在自己的轴上来可视化多个变量，形成一个多边形。所有轴都呈径向排列，从中心开始，彼此距离相等，并具有相同的刻度。


    ### 用途

    雷达图非常适合比较单组或多组的多个定量变量。它们也适用于显示数据集中哪些变量得分高或低，使其成为性能可视化的理想选择。


    ### 示例

    下图显示了单一个变量的雷达图。该图表显示了学生在不同科目中得分的数据：![](img/rsrc1G7.jpg) 单变量（学生）的雷达图


    下图显示了两个变量/组的雷达图。在这里，图表解释了两个学生在不同科目中的得分：![](img/rsrc1G8.jpg) 图：两个变量（两个学生）的雷达图


    下图显示了多个变量/组的雷达图。每个图表显示了学生在不同科目中的表现数据：![](img/rsrc1G9.jpg) 图：多变量（多个科目）的分面雷达图


    ### 设计实践

    尽量尝试在一个雷达图上显示十个或更少的因素，以便于阅读。如前图所示，使用分面（Faceting）来处理多个变量/组，以保持清晰。


    ### 活动：员工技能比较

    给你提供了四名员工（A、B、C 和 D）在五个属性上的评分：效率、质量、投入度、责任心行为和合作。你的任务是比较员工及其技能：哪些图表适合这项任务？你被给了以下柱状图和雷达图。列出这两种图表的优缺点。在你看来，哪种图表更适合这项任务？为什么？![](img/rsrc1GA.jpg)
    图：使用柱状图的员工技能比较


    下图显示了员工技能的雷达图：![](img/rsrc1GB.jpg) 图：使用雷达图的员工技能比较


    各自的可视化可以在如何改进？


    ## 关系图 (Relation Plots)

    关系图非常适合显示变量之间的关系。散点图（Scatter plot）可视化了单组或多组两个变量之间的相关性。气泡图（Bubble plots）可以用于显示三个变量之间的关系，第三个变量由点的大小表示。热力图（Heatmaps）非常适合发现两个定性变量之间的模式或相关性。相关系数矩阵（Correlogram）是显示多个变量之间相关性的完美可视化。


    ## 散点图 (Scatter Plots)

    散点图显示两个数值变量的数据点，在两个轴上都显示一个变量。


    ### 用途

    你可以检测两个变量之间是否存在相关性（关系）。它们允许你使用不同的颜色绘制多个组或类别之间的关系。气泡图是散点图的一种变体，是可视化第三个变量相关性的极工具。


    ### 示例

    下图显示了单组人员身高和体重的散点图：![](img/rsrc1GC.jpg) 图：单变量（一组）散点图


    下图显示了与上一个图相同的数据，但对组进行了区分。在这种情况下，我们有不同的组：A、B 和 C：![](img/rsrc1GD.jpg) 图：多变量（三组）散点图


    下图显示了按类别分组的各种动物体重与最长寿之间的相关性。体重与最长寿之间存在正相关关系。![](img/rsrc1GE.jpg) 图：动物体重与最长寿的相关性


    ### 设计实践

    两个轴都从零开始以准确表示数据。对数据点使用对比色，并避免在多组或多类别的散点图中使用符号。


    ### 变体：带有边缘直方图的散点图

    除了可视化两个数值变量相关性的散点图外，你还可以以直方图的形式绘制每个变量的边缘分布，以便对每个变量的分布有更好的了解。


    ## 气泡图 (Bubble Plot)

    气泡图通过引入第三个数值变量扩展了散点图。变量的值由点的大小表示。点的面积与该值成正比。使用图例将点的大小与实际值联系起来。


    ### 用途

    显示三个变量之间的相关性


    ### 示例

    下图显示了一个气泡图，突出了人类身高和年龄之间的关系：![](img/rsrc1GG.jpg) 图：显示身高与年龄关系的气泡图


    ### 设计实践

    - 散点图的设计实践同样适用。

    - 不要将其用于大量数据，因为太多的气泡会让图表难以阅读。


    ## 相关矩阵 (Correlogram)

    相关系数矩阵是散点图和直方图的结合。直方图将在稍后讨论。相关系数矩阵或相关矩阵使用散点图可视化每对数值变量之间的关系。矩阵的对角线以直方图的形式表示每个变量的分布。你还可以使用不同的颜色绘制多个组或类别之间的关系。相关系数矩阵是显示多个变量之间相关性的极佳可视化工具。


    ### 示例

    下图显示了身高、体重和年龄的相关矩阵。对角线图显示每个变量的直方图。非对角线元素显示变量对之间的散点图：下图显示了按类别分组的数据的相关矩阵：![](img/rsrc1GH.jpg)
    图：按类别分组的相关矩阵


    ### 设计实践

    - 两个轴都从零开始以准确表示数据。

    - 对数据点使用对比色，避免在多组或多类别的散点图中使用符号。


    ## 热力图 (Heatmap)

    热力图是一种可视化，将矩阵中的值以颜色或饱和度表示。热力图非常适合可视化多变量数据，其中类别变量放在行和列中，数值或定性变量以颜色表示。


    ### 用途

    发现数据中的模式


    ### 示例

    下图显示了跨多个电子商务网站的最热门产品的热力图：![](img/rsrc1GJ.jpg) 图：电子类热门产品热力图


    ### 变体：注释热力图

    让我们看看之前看到的注释热力图：![](img/rsrc1GK.jpg) 图：电子类热门产品的注释热力图


    ### 活动：过去十年的道路交通事故

    给你一张图，提供了关于过去十年中一月、四月和十月发生的道路交通事故信息。识别哪一年的交通事故最少![](img/rsrc1GM.jpg) 图：20 年道路交通事故趋势


    ## 组合图 (Composition Plots)

    如果你将某些事物视为整体的一部分，那么组合图是理想的。对于静态数据，你可以使用饼图、堆叠柱图或面积图。饼图或面积图有助于显示组的百分比。如果你需要额外的维度，堆叠柱图是可视化重叠组的好方法，每个组由圆表示。对于随时间变化的数据，可以使用堆叠柱图或面积图。


    ### 饼图 (Pie Chart)

    饼图通过将圆分成切片来阐明数值比例。每个切片代表 100%。对于人类来说，比较切片比比较长度更容易，因此大多数情况下使用饼图或堆叠柱图。


    ### 用途

    比较整体的各个


    ### 示例

    下图显示了显示运动场位置的饼图：![](img/rsrc1GN.jpg) 图：显示运动场位置的饼图


    下图显示了世界周围水使用的饼图：![](img/rsrc1GP.jpg) 图：水使用的饼图


    ### 设计实践

    - 按大小增加/减少顺序排列切片，顺时针或逆时针。

    - 确保每个切片有不同的颜色


    ### 变体：环形图 (Donut chart)

    饼图的替代方案是环形图。与饼图相比，环形图更容易比较切片的大小，因为中心是挖空的，更加节省空间。环形图也可以用于显示信息或进一步划分组。下图显示了基础环形图：![](img/rsrc1GR.jpg)
    图：环形图


    # Matplotlib

    Matplotlib 可能是 Python 最流行的绘图库，用于数据科学和机器学习可视化。John Hunter 在 2003 年开发了 Matplotlib。它旨在模拟
    MATLAB 软件，这在当时是科学标准。MATLAB 的全局样式被引入 Matplotlib，以便于 MATLAB 用户进行过渡。在我们开始使用 Matplotlib
    创建我们的可视化图之前，我们将理解图表背后的概念


    ## Matplotlib 中的图表概述

    Matplotlib 中的图表具有分级结构，嵌套 Python 对象以创建树状结构。每个图表都封装在 `Figure` 对象中。该 `Figure` 是可视化的顶层容器。它可以有多个
    `axes`，基本上是顶层容器内的单个图表。再深入一层，我们再次找到控制轴、标记、图例、文本框、网格等许多对象。所有这些对象都可以自定义。


    图的两个主要组件如下：

    - `Figure`：`Figure` 是最外层的容器，用作绘制画布。它包含 `Axes` 对象但也有配置功能。

    - `Axes`：`Axes` 是实际图或子图，取决于你想绘制单个还是多个可视化。


    ### pyplot

    pyplot 包含一个用于可视化的简单接口，允许用户在不显式配置 `Figure` 和 `Axes` 的情况下绘制数据。它们被隐式配置以实现所需的输出。使用别名
    `plt` 来引用导入的模块非常方便：

    ```

    import matplotlib.pyplot as plt

    ```


    ### 创建 Figure

    使用 `plt.figure()` 创建一个新的 `Figure`。此函数返回一个 `Figure` 实例，但也传递给后端。随后的每个与 `Figure`相关的命令都应用于当前的
    `Figure`，不需要知道 `Figure` 实例。默认情况下，`Figure` 的宽度为 6.4 英寸，高度为 4.8 英寸，`dpi` 为 100。要更改
    `Figure` 的默认值，可以使用参数 `figsize` 和 `dpi`。以下代码片段显示了如何操作 `Figure`：

    ```

    plt.figure(figsize=(10, 5))

    plt.figure(dpi=300)

    ```


    ### 关闭 Figure

    不再使用的 Figure 应该通过显式调用 `plt.close()` 关闭，这也会清理内存。如果没有指定，将关闭当前的 `Figure`。要关闭特定的 `Figure`，你可以提供
    `Figure` 实例的引用，或提供 `Figure` 数字。要找到 figure 对象的数字，可以使用 `number` 属性，例如：`plt.gcf().number`。通过使用
    `plt.close(''all'')`，所有的 Figure 都关闭。示例显示了如何创建和关闭 Figure：

    ```

    plt.figure(num=10) # 创建编号为 10 的 Figure

    plt.close(10) # 关闭编号为 10 的 Figure

    ```


    ### 格式字符串

    在实际绘制某些内容之前，让我们快速讨论一下格式字符串。它们是指定颜色、标记类型和线条的整洁方式。格式字符串被指定为 `[color][marker][line]`，其中每个都是可选的。如果颜色是格式字符串的唯一参数，可以使用任何
    `matplotlib.colors`。Matplotlib 识别以下格式：

    - RGB 或 RGBA 浮点元，例如：`(0.2, 0.4, 0.3)` 或 `(0.2, 0.4, 0.5)`

    - RGB 或 RGBA 十进制字符串，例如：`#0F0F0F''` 或 `''#0F0F0F''`下图显示了带有颜色的圆盘：![](img/src1GT.jpg


    # 聚类 (CLUSTERING)

    聚类是将具有特征的实体聚集在一起。这种技术属于无监督学习，其目标是识别数据点中的相似性并将它们聚集在一起。


    ### 为什么应用聚类

    将类似的实体聚集在一个处可以识别组的属性。换句话说，这生成了各个组的底层模式。聚类有许多应用领域，例如你可能根据不同的组来选择最佳营销策略。此外，聚类还用于在处理大量变量时对数据降维。


    ### 聚类的类型

    #### a) 基于划分的聚类 (Partitioned-based clustering)

    聚类没有准确的定义。聚类描述一组点，其中任何点靠近其他点。有时使用阈值来定义组中的所有点。


    **K 均值聚类 (K-mean Clustering)**

    - 它以 `K` 作为输入。这指的是你想找到的组的数量。在随机位置分配质心。

    - 现在，如果你使用数据点之间的欧式距离，将每个点分配给靠近它的组。

    - 重新计算组的平均值。

    - 重复上述步骤直到没有更多变化。你可能会想如何选择 `K` 的值。一种方法是使用肘法（Elbow）来定义最佳组的数量。在这种情况下，查看 Y 轴上的解释方差和
    X 轴上的 `K`![](img/GU.jpg


    #### b) 层次聚类 (Hierarchical clustering)

    层次聚类通过将所有数据点分配给它们自己的类开始。正如名称所示，它创建了一个层级结构，并在下一步中将最近的对组合在一起。

    i) 将每个点分配给它的类。

    ii) 通过应用欧式距离确定最近的对并将其组合。

    iii) 确定项目之间的距离并将所有项目组合。在下一步中，你可以通过识别最大距离来选择最佳数量![](img/GV.jpg


    #### c) 基于密度的聚类 (Density-Based Clustering)

    基于密度的基本概念源于人类感知。例如，如果你看下面的图像，你应该能看到类以及噪声![](img/GW.jpg


    如图所示，数据空间中存在密度较低的区域。简而言之，位于类外的点密度高于类内。基于密度的聚类算法取决于“类”和“噪声”。对于每个类，特定的半径应该有一个。DBSCAN
    需要最重要的参数包括 (`eps`) 和最小点 (`MinPts`)。`eps` 参数决定周围的半径，`MinPts` 邻的数量。


    # 使用聚类分析进行客户细分 (Customer Segmentation with Cluster Analysis)

    公司的客户群可能有数千、百万的不同人员。对这些人大多数人进行营销是一个大问题，因为如果你试图向所有人营销，信息可能是模糊的。然而，制定一个吸引每个人的营销计划是不常的。


    ### 为什么客户细分很重要

    客户细分将帮助你理解区分客户的模式。以下是你通过细分分析获得的一些重要想法：

    - 加强对客户需求和愿的理解。这可以提高销售和客户满意度。

    - 创建吸引不同客户细分的产品。

    - 公司不能一直满足所有可能的客户。通过细分程序，公司有能力专注于他们认为是产品最佳吸引力的群体。


    ### 如何细分

    细分不需要非常复杂。对于小型组织或公司，它可以是关于发现你有二或三个不同需求的独特客户类型。用于划分客户的流行方法包括：

    - 人口统计

    - 行为

    - 心理

    - 地理


    在市场细分方面你有许多应用方法。一种准确且统计有效的方法是应用聚类分析。


    # 数据科学作为变革者 (Data Science as a Change Agent)

    数据科学是一个变革者。尽管它还没有实现，但现在应该是组织准备好的时机。计划在未来几年变化的公司应该通过收集正确的数据和投资分析能力来定位自己。在构建预测模型时要考虑的主要问题是建立你想预测什么，并收集允许你这样做的大型数据集。尽管通过应用预测模型来实现管理仍然很远，但组织可以通过采用正确的工具和收集准确的数据来保持正确的路径。


    ### 使用数字参与 (Use Digital Engagement)

    总有新系统创建以允许组织从员工那里收集实时反馈。目前，组织可以利用这些工具并增强他们的服务。这些工具大多数开发并安装了更多功能，以揭示有关员工每次想法的更多信息。这些工具为管理提供了相关的改变。通过与大型位置合作，有助于创建一个实时反馈系统。这意味着人们必须几天而不是几周就能学习。


    ### 社交媒体分析 (Social Media Analytics)

    变革经理另一个查看过去限制的选择。客户和供应商是变革计划的主要利益相关者。他们很有可能参与社交媒体并对变化发表评论。语言分析的进步意味着可以从人们使用的词中检测与行动和行为相关的线索。此外，使用某些单语和代词可以帮助个人。


    ### 数据在变革中的重要性 (How data is important in change)

    多年来，许多公司依赖数据技术来实现变革。现在，数据驱动的方法改进了性能。


