    # 汇报结果


    所有上述活动都发生在不同的场合。例如，你可能在一天内完成所有活动，但花费一个多月的时间详细处理其中的每一项。因此，让我们来看看这些活动中所采用的整体框架。虽然在进行数据分析时人们可以参与许多不同类型的活动，但整个过程的每个环节都可以通过交互过程完成。


    最重要的是，对于上述五个活动中的每一个，建议你包含以下步骤：

    * 定义或设定预期

    * 收集信息，并将数据与你的预期进行比较

    * 如果数据不符合你的预期，则修改或修复数据，使你的预期和数据相匹配。


    完成上述所有三个步骤被称为数据分析循环。当你穿过分析的每一个阶段时，你需要通过“本轮运动”（epicycle）来不断修正你的问题、形式化模型、解释和沟通。在这五项主要活动中反复循环构成了数据分析的最大部分部分。


    ## 定义预期


    在这一步中，你会在执行任何操作（如执行程序、检查数据或输入命令）之前，有意地设定好你的预期。对于经验丰富的数据分析师来说，创建预期可能是一个自动或无意识的过程。尽管如此，思考这一点仍然很重要。例如，如果你正打算和朋友去购物，并且必须停下
    ATM 提取一些钱。你需要对想要提取的金额做出决定；你对将购买的物品的价格有一些预期。如果你知道要购买的产品价格，这可能你来说没有问题。这就是先验知识的例子。


    另一个先验知识的例子是知道特定餐厅的营业时间。利用这些信息，你可以安排你的时间和活动，确保在闭门前吃晚餐。你还可以从朋友那里获得额外信息来帮助形成预期，或者
    Google 搜索餐厅以了解更多其工作时间。这种将先验信息用于建立预期或实施分析程序的方法，与分析过程中每项主要活动使用的方法是相同的。


    ## 信息收集


    这一步要求人们收集与问题或数据相关的信息。对于问题，通过文献研究或向专家请教来收集信息。对于数据，一旦你对检查数据时结果可能是什么样建立了一些预期，就可以继续执行操作。这项活动的结果包括你需要收集的数据，以及确定所收集的数据是否符合你的预期。


    ## 预期的比较


    一旦你拿到了数据，下一步就是将你的预期与数据进行比较。这里有两种可能的结果：

    * 你的成本估算与账单上的金额匹配。

    * 你的成本估算不匹配。


    如果成本估算和金额匹配，你就可以进入下一项活动。相反，如果你的预期成本是 60 美元，但账单是 30 美元，那么你的预期和数据就是不同的。在这种情况下，差异可能有两个原因：首先可能是你的可能是错误的，需要修正；其次，账单可能是错误的并包含错误。一个可以暗示你数据分析状态的关键指标是：你收集的数据与原始预期匹配的难易程度。


    ## 量、速、多样性


    大数据具有各种“V”。主要的特征包括速度（velocity）、多样性（variety）和量（volume）。大数据超过了普通数据库的存储能力。生成的数据规模是巨大的。截至今天，产生了海量的数据。其中一个原因是交互的增加。交互是除了数据交易之外的一种新现象。数据交互来自浏览器活动、个人数字记录器和地理位置。随着“物联网”的出现，产生了海量数据，人类花费整个时间试图分析它们。


    优秀的数据科学家应该知道如何控制量；他或她应该知道如何创建能够智能利用数据大小的算法。当你拥有海量数据时，事物会产生新的方向，因为每个相似性都变得重要，且人们很容易得出错误的结论。在大多数业务应用中，提取相关性就足够了；然而，正确的数据科学使用了基于这些相关性确定因果的技术。


    数据速度将不断加速。许多用户以更快的速度增加了 Facebook 帖子、推文和财务信息。速度增加了量并缩短了数据保留时间。例如，高频交易活动依赖数据流和快速信息。但数据的真实性会迅速下降。


    最后，数据多样性已经深入。由于计算能力的提高，仅依赖于少数变量的模型现在可以产生数百个变量。新的经济指标和各种工具目前可能发生变化。


    ## 机器学习


    机器学习指的是系统如何从其处理的各种类型的数据中学习。可以根据特定数据训练系统以做出决策。训练过程持续进行，以便系统进行更新并增强决策能力。使用垃圾邮件过滤系统是演示机器学习应用的极示例。这些系统使用贝叶斯过滤器来改变决策。因此，它将继续领先于垃圾邮件发送者。动态学习的能力非常重要，因为它有助于防止垃圾者利用过滤器。信用卡审批使用神经网络，是机器学习技术的绝佳例子。此外，与判断相比，机器学习更倾向于数据。因此，优秀的数据科学家应该同时具备两者。机器学习帮助找到了人们感兴趣的问题答案，并进一步证明它是游戏规则的改变者。机器学习之所以非常有趣，是因为具有机器智能的四个特征：


    * 它建立在理论突破的坚实基础之上。

    * 它重新定义了当前的经济范式。

    * 最终结果是商品化。

    * 它从数据科学中挖掘出新数据。

    '
- fmt: '

    # Supervised and unsupervised learning


    There are two broad ways that a system can learn, that is supervised and unsupervised
    learning.


    ## Supervised Learning

    Supervised learning is where a system makes decisions depending on the type of
    data entered. Automated credit card approvals and spam filters apply supervised
    learning to achieve their functions. The system is supplied with a historical
    data sample of outputs and inputs, based on this type of data; the system establishes
    the relationship between the two using machine learning techniques. You will need
    to use your judgment to choose the best technique to handle the task.


    ## Unsupervised Learning

    Unsupervised learning happens when you only have input data `X` without a corresponding
    output variable. The aim of unsupervised learning is to build a model of the underlying
    structure in the data order so that you can learn more about the data. It is called
    unsupervised learning because there is no correct answer and teacher. Algorithms
    are left to decide and discover interesting structure in the data.


    - **Cluster analysis** is an example of unsupervised learning. Cluster analysis
    selects a group of entities, each with a different attribute and divides the entity
    space based on how far or near the entities of the attributes are. This will rearrange
    and redefine data by labeling it using additional tags.

    - **Factor analysis** is part of the unsupervised learning technique.


    ## Predictions and Forecasts

    Data Science involves making forecasts and predictions. But, there is a distinction
    between the two.


    - **Predictions** focus on highlighting a single outcome. If a person says that
    “it will be cold tomorrow” he or she has predicted.

    - **Forecasts**: if they say that “the chance of tomorrow being cold is 40%” they
    shall have made a forecast. This is because a forecast provides outcomes in the
    form of probabilities.

    '
