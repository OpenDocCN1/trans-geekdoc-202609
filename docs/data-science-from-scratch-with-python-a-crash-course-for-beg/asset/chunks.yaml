    source of data. As a result, most organizations have come to understand the importance
    of monitoring the movements of their customers. The organizations embrace the
    need to know where their customers are at any given time. Another important thing
    is being able to look at time and location data at an aggregate level. While more
    individuals continue to open their location data and time, many good applications
    arise. Therefore, time and location data becomes one of the most privacy-sensitive
    big data types that must be treated with a lot of caution. •    Social network
    data. Within the social network sites such as Facebook, Instagram, and LinkedIn,
    it is possible for one to perform link analysis and discover the network of a
    given user. Social network analysis can present insights into what type of advertisements
    can appeal to users. This is achieved by taking into consideration the interests
    of customers and their circle of friends. With many of these big data sources,
    the advantage doesn’t lie in the type of data source but the value that it can
    generate in combination with other data sources. It is a combination that is very
    important . The different types of insight Besides data, there is something called
    paradigm shift based on the analytic focus. This refers to a change from descriptive
    analytics to predictive and prescriptive analytics. When it comes to descriptive
    analytics, it attempts to respond to questions about what happened in the past.
    Typically, this is all about reporting. Below are some examples of questions that
    are dealt with in descriptive analytics. •    Which is the most profitable customer
    or product? •    What amount of sales revenue was generated in the first quarter
    of the year? •    How many customers did we lose or win in the first half-year?
    •    How many customers did we win as a result of the promotional campaigns? Predictive
    analytics focuses on something that may happen next. This is very difficult and
    it involves extending trends and patterns of the future. Examples of questions
    include: •    What is the approximated number of a call center in the next quarter?
    •    What is the next best offer for this customer? •    Which customers are likely
    to churn ? The prescriptive analysis attempts to respond to questions related
    to “how can I handle this.” This is the point when analytics becomes operational.
    It is entirely business and uses case dependent. Some of the examples to demonstrate
    the point include: •    Knowing that an individual has a higher chance to churn,
    so he or she is presented with a value package. •    Determining the viewing history
    of a customer on the web, then suggesting articles that the customer can read
    next. All the above examples existed before big data; however, the major focus
    was entirely on reporting. But with the arrival of big data, it is now possible
    to: i.    Derive a forward-looking insight ii.    Increase the appetite and ability
    for quick and actionable insight. A forward-looking insight means that a business
    had the ability to predict what may happen next. Traditionally, this was possible,
    but the accuracy was very limited. Therefore, big data changed this equation.
    A fast and actionable insight meant that no matter what is derived from the data
    analysis, it has to have an effect on the business process and effect on the embedded
    process . For instance, a recommendation system can automatically generate personalized
    recommendations like the way Amazon recommends one to buy a different thing from
    what another person wants to buy because of the difference in viewing history.
    This doesn’t mean that descriptive analytics is not that important. In fact, reporting
    will continue to be an important element in business life. In practice, it is
    advised for an individual to be flexible and be able to apply different analytics.
    What will deliver the best results depends on the nature of the questions created
    and picking the correct tool for the right job. The business value of big data
    analytics Big data delivers a significant benefit to any business. It helps draw
    insights from data, make smart decisions depending on the insight and automate
    decisions. On a detailed level, every big data solution addresses a specific problem
    that exists in organizations. As a result, when developing a business case that
    should be applied in a big data analytics project, one should begin with a business
    problem instead of technology or data. Choosing to collect data or buy a given
    technology without having a clear business target is the wrong strategy. The New
    Web: Visual, Semantic and API-POWERE D Since the introduction of the new web,
    the web has greatly changed. The web has of today become even more visual. To
    upload a photo on the web is just a click of a button. But this was not the case
    20 years ago. If you can go back to the 1990s and think about how computers and
    the internet were, then you will realize how much effort has been made to improve
    and redefine technology.  Linked Data and Semantic Web It is not just that data
    has increased in size alone, but also the web grows and data silos continue to
    reduce, data has also continued to be interconnected. As of today, we are not
    close to connecting all the data. Most data sets cannot be easily connected to
    each other. However, major steps have been achieved now. The web has continued
    to become more semantic. Linked data refers to the practice of sharing, exposing
    and integrating pieces of data, knowledge, and information on the same semantic
    Web. Both computing devices and human beings gain when data that is unconnected
    is connected. This is normally done through Web technologies such as uniform resource
    identifiers and Resource Description Framework. The ease of accessing data Yes,
    there is a lot of data more than what you can imagine, and most organizations
    have a challenge when it comes to drawing  important insight from the data. Luckily,
    all hope is not lost. The available data management tools in organizations have
    never been so good and effective than today. Before the internet era, many large
    organizations transferred their data from many different databases, systems and
    data warehouses. Database experts and administrators create scripts and stored
    procedures which automate most of these processes. Batch procedures would run
    early in the morning. Better efficiency in the clouds It is true that the web
    cloud is causing a big impact on many organizations across the globe. The history
    of the web started as the mainframe era before it went to the client-server era
    and now we are in the mobile–cloud computing era. To move from one era to another
    called for a lot of developments and effort. This doesn’t happen overnight. The
    dawn of Big Data and Open Data created a lot of opportunities and room for organizations
    to enhance their operations. As a result, there has been a huge improvement in
    business intelligence solutions and statistical packages. Level of measurement
    A decision tree has the ability to accommodate both quantitative and qualitative
    data. Quantitative data consists of weight and height, it describes quantities
    that one can modify using  arithmetic operations such as subtraction, multiplication,
    and addition. On the other hand, qualitative may consist of gender and cannot
    be applied in arithmetic operations, but it is presented in decision trees. Other
    types of data, such as shoe size, may both be quantitative and qualitative. For
    instance, you may fail to perform meaningful arithmetic with shoe size although,
    the number sequence in shoe size is in order. Tools Used in Data Science There
    are a lot of Big Data tools that one can use for analysis. In simple terms, data
    analysis is defined as a process of inspecting, cleaning, transforming and modeling
    data with the sole reason to discover important information, conclusions and suggest
    the right decision. This Chapter will outline to you the best tools which Data
    Scientist use in the process of cleaning, modeling, transforming and analyzing
    data. Open Source Data Tools a)     OpenRefine This was formally called Google
    Refine. It is a great tool for one to use to work with data that is disorganized.
    This tool lets a data scientist clean and changes the format of data. Additionally,
    a data scientist can decide to integrate the data with external data.  The tool
    helps an individual perform large scale data exploration and discover patterns
    in data easily. b)     Orange An open-source data visualization and analysis tool
    designed to be used by those people who are not experts in data scientists. It
    has a simple interactive workflow and an advanced toolbox to help a person build
    interactive workflows that they can analyze and visualize data. However, the type
    of visualization which Orange creates is different from scatter plots, bar charts,
    and dendrograms. c)     Knime KNIME is another open-source solution to use in
    data analysis. This tool allows an individual to explore and discover hidden insights
    in data. The tool has over 1000 modules and hundreds of examples that one can
    run to learn how to use it. In addition, there is an advanced range of integrated
    tools and complex algorithms. KNIME offers some of the best toolboxes that any
    data scientist can use. d)     R-Programming This is considered as the standard
    tool among statistical programming languages. Some people consider it as the “golden
    boy” of data science. R is also open-source software that anyone can install and
    use in statistical computing and graphics. It is  compatible with Windows, macOS
    platforms and UNIX. It is useful in data science and it has many job opportunities
    if you are an expert. Since R is free, anybody can install it, use it, upgrade
    it, modify it, clone it and resell it. R will help one to save money on technological
    projects and offer regular updates that are useful for any statistical programming
    language. It is a high-performance language that will help users deal with an
    extensive data package and build a great tool to help manage big data. Also, it
    is best to use resource-intensive applications. Apart from data mining, using
    R–programming gives you the chance to apply a statistical and graphical technique.
    This includes linear and nonlinear modeling, time-series analysis, classical statistical
    tests and clustering, among many other methods. e)     RapidMiner Similar to KNIME,
    RapidMiner deals with visual programming and is the best when it comes to modeling,
    analyzing and manipulation of data. RapidMiner improves the productivity of data
    science teams. It has an open-source platform to support machine learning, model
    deployment, and data preparation. Since it is an integrated data science platform,
    it speeds the  development of a complete analytical workflow from model validation,
    machine learning, and deployment. f)       Pentaho Pentaho deals with problems
    that affect the ability of an organization to accept value from different data.
    The platform will simplify data preparation and data blending as well as a collection
    of tools used in the analysis, visualization, reporting, exploration, and prediction.
    Pentaho is designed to ensure that each member of a team has the ability to transform
    data into value. g)     Weka Another open-source software designed with the capability
    to handle machine learning algorithms to use in data mining tasks. You can directly
    use the algorithm to process a data set. It is also the best to use in developing
    a new machine learning scheme because it is implemented fully in JAVA programming.
    Since the Graphical User Interface of Weka is simple and easy to use, it facilitates
    an easy transition into the field of data science. Written in the Java language,
    anyone experienced in Java can invoke the library into their code . h)    The
    NodeXL A data visualization and analysis tool that shows relationships in a data
    set. Since it is open-source software, it is free to use to analyze and create
    visualizations from data. It is one of the best tools in statistics that you can
    use to analyze data. It has different modules, such as social network data importers
    and automation. With NodeXL, you will still analyze your data fast and easy. i)
          Gelphi Written in Java language, Gelphi comes as an open-source visualization
    and network analysis tool. j)       Talend It is the leading open source integration
    software provider to most data-driven enterprises. Talend allows customers from
    any place to connect with easy. Data Visualization k)     Datawrapper It is an
    online data-visualization software that one can use to build interactive charts.
    A user will upload data from CSV, Excel or PDF file into the field, this tool
    processes the data and generates a map, bar, and line. Graphs produced by Datawrapper
    can be installed into any website that is built with ready to use embed codes
    . l)       Tableau Public This tool will democratize visualization in a very elegant
    and simple way. It is a very powerful tool to use in any type of business. One
    is able to identify data insights with the help of Tableau data visualization
    tools. When it comes to analytics, visualization in Tableau allows a data scientist
    to explore data before moving into a complex statistical process. m)                         
    Infogram It has over 35 interactive charts and over 500 maps to allow an individual
    to visualize data in the most beautiful way. It creates different charts such
    as word cloud, pie, and bar chart. Infogram also supports a map module that can
    capture the attention of the audience. n)   Google Fusion Tables This is one of
    the most interesting and powerful data analysis tools. The best to use when you
    have a large data-set that you want to visualize and map. With its powerful mapping
    software, Google plays an important role in creating this tool. o)     Solver
    Build with the ability to support effective financial reporting, budgeting and
    analysis. It has a push-button that will let anyone  access and interact with
    data that generates more profit in a company. Sentiment Tools p)     OpenText
    This is a specialized classification engine applied in the identification and
    evaluation of expressions and patterns in the textual content. The analysis takes
    place at the document, sentence and topic level. q)     Trackur An automated sentiment
    analysis software that highlights a particular keyword tracked by an individual.
    Trackur has an algorithm that monitors all social media and mainstream news to
    draw important insights through the discovery of trends. r)      Opinion Crawl
    Another online sentiment analysis software applied in the analysis of the latest
    news, products, and companies. It gives freedom to every visitor to access Web
    sentiment in a specific topic. Anyone can type, participate in a topic and receive
    ad-hoc sentiment assessment. For each topic, there is a pie chart to display the
    latest real-time sentiment and a list of current news headlines. Besides that,
    there are different thumbnail images and a cloud tag to include different concepts
    that the public can easily  relate with. This tool allows a person to see events
    which affect the sentiment in a positive or negative way. To create a comprehensive
    analysis, web crawlers search for the latest content published on common subjects
    and current public issues. Data Extraction Tools s)      Content Grabber This
    is a tool that is designed for enterprises. The tool is built with the function
    to support content mining from any website and save that in a structured format.
    This consists of CSV, XML and Excel reports. It is the best tool for an expert
    at programming because it has a scripting and editing module. Also, users can
    still use C#, [VB.NET](http://VB.NET) to debug and write a piece of script information
    to take of the crawling process. t)       IBM Cognos Analytics Before this tool
    was developed, Cognos Business Intelligence was the one used. It is designed with
    a web-based interface to support data visualization in the BI product. It has
    modules for data governance, self-service analytics, and management. This tool
    also supports the integration of data from different sources to create reports
    and visualizations. u)     Sage Liv  e  A cloud-based accounting platform that
    supports both small and mid-sized types of businesses. It allows the creation
    of invoices, payment of bills and sales using a mobile device. Furthermore, if
    you want a data visualization tool that supports different companies, currencies,
    and banks, then this could be the right tool to use. v)      Gawk GNU lets one
    use a computer without software. Gawk is a tool that can interpret unique programming
    language. It helps users handle simple-data reformatting jobs by writing down
    a few lines of code. It has the following main features: •    It is data-driven
    instead of procedural •    Makes it easy for one to read and write programs •   
    Search for lines and other text units that have one or more patterns w) GraphLab
    Create Both data scientists and developers use this tool to build a state of the
    art data products using machine learning. This type of machine modeling tool will
    help users create smart applications. The major features of this tool include:
    •    Integrates automatic feature engineering, machine learning visualizations,
    and model selection to the application. •    Identifies and links records both
    within and across data sources that have the same real-world entity . •    It
    simplifies the development of machine learning models x)      Netlink Business
    Analytics It is one of the most comprehensive on-demand solutions. You can access
    it through a Web browser or any other device and apply it to a full enterprise.
    You can share the dashboards among teams using collaboration features. Most of
    the features are tailored towards sales and complicated analytic capability based
    on inventory forecasting, fraud detection, sentiment, and customer churn analysis.
    y)      Apache Spark The tool is designed to run-in memory and real-time. As a
    result, it facilitates faster real-time analytics. The Top 5 Data Analytics Tools
    and Techniques a)     Visual analytics There are different methods that one can
    use to analyze data. For instance, by building a graph and discovering unique
    spots. This method consists of other methods, such as human interaction, data
    analysis, and visualization. b)      Business Experiment  s  AB testing, business
    experiments, the experimental design consists of all techniques applied in testing
    the validity of something. c)     Regression analysis This method will allow you
    to identify a relationship between two different variables and the strength of
    the relationship. d)     Correlation analysis This is a statistical technique
    that will let you identify whether a relationship exists between two different
    variables. This method is perfect when you have some suspicion that there is a
    special relationship between two variables. e)     Time series analysis Here,
    data is gathered at uniform time intervals. You can use it anytime you want to
    identify changes and predict future events, depending on what has happened in
    the past. '
