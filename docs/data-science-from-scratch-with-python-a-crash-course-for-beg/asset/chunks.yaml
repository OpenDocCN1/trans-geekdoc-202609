    # 第 7 章：人工神经网络


    机器学习是计算机科学的一个分支，推动了人工智能的快速发展。机器学习通过研究算法，让机器能够学习来识别模式、开发模型并生成视频和图像。机器学习算法可以使用不同的方法创建，例如聚类、决策树、线性回归等。


    ## 人工神经网络


    人工神经网络的动力源于大脑生物模型和生物神经神经网络。简而言之，人工神经网络（`ANN`）是指人类神经网络的计算表示，它改变了人类的智能、记忆和推理能力。


    但是，为什么人类大脑系统需要开发有效的机器学习算法呢？`ANN` 背后的主要原理是神经网络在高级计算和知识的分层表征方面非常有效。神经元通过树突和轴突连接成复杂的神经网络，这些网络可以传递和交换信息，还可以存储中间计算结果。因此，这种系统的计算模型在类似于生物过程的学习过程中是可以行的。1957
    年创建的感知算法是构建生物神经神经网络计算模型的尝试。然而，具有多层、神经元和节点的高级神经网络最近才成为可能。`ANNs` 是近期计算机视觉和图像识别领域取得成功的原因。


    自然语言处理和机器学习的其他应用寻求从数据中提取复杂模式。当人们想要研究具有许多特征的非线性假设时，神经网络非常有用。为巨大的特征空间建立精确的假设可能需要使用多个高阶多项式，这不可避免地会导致过拟合。这种情况模型揭示了数据中的随机噪声，而不是潜在的关系模式。过拟合问题涉及图像识别问题。在这里，每个像素都代表一个特征。


    ## 带有单个神经元的简单神经网络


    所示，最简单的神经网络只有一个单个“神经元”。


    ![](img/rsrc1H3.jpg)


    通过应用生物类比，这个神经元代表了一个计算单元，它通过电输入接收输入，并使用轴突将其传输到下一个网络输出。在上面的简单神经网络中，树突指的是输入特征（`x1`、`X2`），输出是假设的结果（`hw,b(x)`）。除了输入特征外，神经网络的输入层包含一个等同于
    `1` 的偏置单元（bias unit）。在函数假设中应用常数项需要偏置单元。


    在机器学习中，上述网络包含一个输入层、一个隐藏层和一个输出层。为了实现该网络的学习过程，输入层接收每个训练样本的输入特征，并将其馈给激活函数，激活函数在隐藏层中计算假设。激活函数是应用于分类的逻辑回归。然而，其他选项也是可能的。在上述情况下，单个神经元类似于逻辑回归定义的输入-输出映射。


    ![](img/rsrc1H4.jpg)


    ## 多层神经网络


    为了理解神经网络如何运行，将模型形式化并在现实场景中解释它至关重要。下面的图像表示了一个具有三层和各种神经元的多层网络。在这种情况下，与单神经元网络一样，有一个输入层，具有三个输入（`x1`、`x2`、`x3`）并增加了一个偏置单元（`+1`）。


    第二个网络层是隐藏层，具有三个由激活函数表示的单元。之所以被称为隐藏层，是因为在其中计算的值是不被观测到的。基本上，神经网络包含多个隐藏层，从表面层到神经网络底部传递高级计算和函数。具有许多隐藏层的神经网络设计在深度学习中被不断使用。


    ![](img/rsrc1H5.jpg)


    隐藏层 2 有三个神经元（`a12`、`a22`、`a32`）。隐藏层的每个神经元都会激活层 `j`。在这种情况下；单元 `a1` 激活第二层的第一个神经元。激活意味着该层中通过函数
    `activation` 计算的值由同一个节点输出到下一层。第 3 层是输出层，接收来自隐藏层的结果并应用自身的激活函数。该层计算假设的最终值。接下来，循环继续，直到神经网络得出模型和权重，这些权重能最好地预测训练数据的值。


    ## 结论


    感谢你读到《Data Science from Scratch with Python》的最后，让我们希望它对你有益处，并能够为你提供实现目标所需的所有知识。数据科学通过利用规范性分析、机器学习和预测性因果分析帮助个人进行预测和做出决策。数据科学的重要性可以总结为以下几点：


    -   **规范性分析（Prescriptive analytics）**：如果你需要一个具有智能和能力做出自己决策的模型，那么规范性分析是最佳选择。这个新领域提供建议，而不是预测，还会推荐不同的规范性措施和相关结果。说明这一点的最佳例子是
    Google 自动驾驶汽车。车辆收集的数据用于训练汽车。你可以通过使用算法进一步挖掘这些数据以揭示智能。这将允许你的汽车做出决策，例如何时转弯、走哪条路径，以及何时加速或减速。

    -   **用于模式发现的机器学习**——假设你没有可以用于预测的资源，这将要求你确定数据集中的隐藏模式以进行正确预测。应用于模式发现中最流行的算法是聚类（`Clustering`）。假设你在一家电信公司工作，想要通过在该地区安装基站来确定网络。因此，你可以使用聚类技术来确定基站位置，以确保所有用户都有最大的信号强度。

    -   **使用机器学习进行预测**——如果你想建立一个预测公司未来趋势的模型，那么机器学习算法是最佳选择。这属于监督学习；之所以被称为监督学习，是因为已经存在你可以用来训练机器的数据了。

    -   **预测性因果分析（Predictive causal analytics）**：如果你需要一个可以帮助预测未来给定事件发生概率的模型，你需要使用预测性因果分析。本书讨论了数据科学中的重要概念，如人工神经网络、机器学习、决策树、聚类、大数据分析、机器学习的应用以及许多其他有趣的话题。最后，如果你发现这本书在任何方面都有帮助，我们将非常感谢你在
