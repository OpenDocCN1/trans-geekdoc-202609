    在你开始学习任何数据科学家应该掌握的技巧之前，为了让他们能够有效地处理大型数据集，了解统计学习与机器学习之间的区别至关重要。在接下来的章节中，你将了解到更多关于机器学习的知识。现在，这里它们的一些区别：


    *   统计学习起源于统计学的一个分支。

    *   机器学习起源于人工智能（AI）的一个分支。

    *   统计学习关注模型及其解释性、不确定性和精确度。

    *   机器学习在营销领域具有额外的优势。


    # 使用概率掌握你的数据

    如果没有概率知识，很难成为一名数据科学家。所有的数据科学家专家都拥有良好的概率和数学知识。将概率视为一种验证与从特定事件空间中选出的事件相关的不确定性的手段，是值得思考的。


    与其精通概率的术语，不如想象掷骰子。样本空间由所有结果组成。以下结果的任何子集都是一个事件。例如，“骰子出了 4”或“骰子出了奇数”。概率的数学符号为 `P(E)`，表示“事件
    `E` 的概率”。概率论有助于人们建立模型。在本章中，你将学习如何使用概率论来检验模型。


    ## 相关性与独立性

    基本上，如果通过了解 `E` 是否发生可以产生关于 `F` 是否发生的信息，则说两个事件 `E` 和 `F` 是相关性的。如果不是，则认为是独立的。例如，如果你掷两次双面硬币，第一次是正面，这并不意味着第二次你也会得到正面。换句话说，这两个事件是独立的。反之，如果通过掷第一个事件产生的信息可以帮助我们确定第二个事件的结果，那么这两个事件就被认为是相关性的。


    在数学中，如果事件 `E` 和 `F` 同时发生的概率是各自发生概率的乘积，则认为事件 `E` 和 `F` 是独立的。

    `P(E, F) = P(E)P(F)`


    在掷硬币的例子中，第一次掷出的概率是 `0.5`，两次都出的概率是 `0.25`。然而，第一次掷正面且两次都是反面的概率为 `0`。


    ## 条件概率

    当两个事件 `E` 和 `F` 独立时，定义为：

    `P(E, F) = P(E)P(F)`


    如果它们不独立且 `F` 的概率不零，则称 `E` 的概率是以 `F` 为条件的：

    `P(E/F) = P(E, F) / P(F)`


    这可以表述为在 `F` 发生的情况下 `E` 发生的概率。这可以重写为：

    `P(E, F) = P(E/ F) P(F)`


    如果 `E` 和 `F` 是独立的，那么你可以确认：

    `P(E / F) = P(E)` 这是一个数学表达式，意味着了解 `F` 的发生并不会提供关于 `E` 发生的额外信息。一个解释这个概念的流行例子是一个有两个未知小孩的家庭。如果是这个假设，那么：


    1.  每个孩子是女孩或男孩的概率相等。

    2.  第二个孩子的性别不依赖于第一个孩子的性别。


    因此，“没有女孩”事件的概率为 `0.25`，“一女孩一男孩”事件的概率为 `0.5`。最后，“两个女孩”事件的概率为 `0.25`。所以你可以通过应用条件概率，找出在“大孩子是女孩”这一事件条件下，“两个孩子都是女孩”的概率。


    ## 贝斯定理

    这是对数据科学家最好的定理之一。贝斯定理涉及条件概率的逆转。例如，你想计算在另一个事件 `F` 发生的情况下事件 `E` 发生的概率。然而，唯一可用的信息是在
    `E` 发生的情况下 `F` 发生的概率。


    贝斯定理通常用于说明为什么数据科学家比医生更聪明。例如，某种特定疾病影响 `10,000` 人中的 `1` 人。假设有一种针对这种特定疾病的检测，在你患病时有
    `99%` 的概率显示正确的结果“患病”，在你没病时显示“未患病”。那么，阳性检测结果会显示什么？根据贝斯定理，在检测呈阳性的情况下你患病的概率是 `0.98%`。如你所见，这小于检测性人数的
    `1%`。虽然贝斯定理给了我们这个结果，但许多医生会将其近似为 `2%`。


    另一种观察问题的方法是想象一个由 `100 万` 人组成的群体。你可能预计其中有 `100` 人患该病，并且这 `100` 人中有 `99` 人检测呈阳性。相反，你可能预计有
    `999,900` 人没有病，而有 `9,999` 人呈阳性。换句话说，你预计在 `(99 + 9999)` 个阳性者中只有 `99` 人患病。


    ## 随机变量

    随机变量描述了一个其正值与概率分布相关的变量。一个简单的随机变量在掷硬币显示正面时等于 `1`，显示反面时等于 `0`。

