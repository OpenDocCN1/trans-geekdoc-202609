    long as the number of bars is small and the chart doesn''t look too cluttered.
    Radar Chart Radar charts, also known as spiders or web charts, visualize multiple
    variables with each variable plotted on its own axis, resulting in a polygon.
    All axes are arranged radically, starting at the center with equal distances between
    one another and have the same scale. Uses: Radar charts are great for comparing
    multiple quantitative variables for a single group or multiple groups . They are
    also useful to show which variables score high or low within a dataset, making
    them ideal for visualizing performance. Examples: The following diagram shows
    a radar chart for a single variable. This chart displays data about a student
    scoring marks in different subjects: ![](rsrc1G7.jpg)Radar chart for one variable
    (student) The following diagram shows a radar chart for two variables/groups.
    Here, the chart explains the marks that were scored by two students in different
    subjects: ![](rsrc1G8.jpg)Figure: Radar chart for two variables (two students)
    The following diagram shows a radar chart for multiple variables/groups. Each
    chart displays data about a student''s performance in different subjects: ![](rsrc1G9.jpg)Figure:
    Radar chart with faceting for multiple variables (multiple subjects) Design practices:
    Try to display ten factors or fewer on one radar chart to make it easier to read.
    Use faceting for multiple variables/groups, as shown in the preceding diagram,
    to maintain clarity. Activity: Employee Skill Compariso n You are given scores
    of four employees (A, B, C, and D) for five attributes: Efficiency, Quality, Commitment,
    Responsible Conduct, and Cooperation. Your task is to compare the employees and
    their skills: Which charts are suitable for this task? You are given the following
    bar and radar charts. List the advantages and disadvantages of both charts. Which
    is the better chart for this task in your opinion and why? ![](rsrc1GA.jpg)Figure:
    Employee skills comparison with a bar char t The following figure shows a radar
    chart for employee skills: ![](rsrc1GB.jpg)Figure: Employee skills comparison
    with a radar chart What could be improved in the respective visualizations? Relation
    Plots Relation plots are perfectly suited to show relationships among variables.
    A scatter plot visualizes the correlation between two variables for one or multiple
    groups. Bubble plots can be used to show relationships between three variables.
    The additional third variable is represented by the dot size. Heatmaps are great
    for revealing patterns or correlating between two qualitative variables. A correlogram
    is a perfect visualization to show the correlation among multiple variables. Scatter
    Plots Scatter plots show data points for two numerical variables, displaying a
    variable on both axes . Uses: You can detect whether a correlation (relationship)
    exists between two variables. They allow you to plot the relationship between
    multiple groups or categories using different colors. A bubble plot, which is
    a variation of the scatter plot, is an excellent tool for visualizing the correlation
    of a third variable. Examples: The following diagram shows a scatter plot of height
    and weight of persons belonging to a single group: ![](rsrc1GC.jpg)Figure: Scatter
    plot with a single variable (one group ) The following diagram shows the same
    data as in the previous plot but differentiates between groups. In this case,
    we have different groups: A, B, and C: ![](rsrc1GD.jpg)Figure: Scatter plot with
    multiple variables (three groups) The following diagram shows the correlation
    between body mass and the maximum longevity for various animals grouped by their
    classes. There is a positive correlation between body mass and maximum longevity.
    ![](rsrc1GE.jpg)Figure: Correlation between body mass and maximum longevity for
    animals Design practices: Start both axes at zero to represent data accurately.
    Use contrasting colors for data points and avoid using symbols for scatter plots
    with multiple groups or categories. Variants: scatter plots with marginal histograms
    In addition to the scatter plot, which visualizes the correlation between two
    numerical variables, you can plot the marginal distribution for each variable
    in the form of histograms to give better insight into how each variable is distributed.
    Bubble Plot A bubble plot extends a scatter plot by introducing a third numerical
    variable. The value of the variable is represented by the size of the dots. The
    area of the dots is proportional to the value. A legend is used to link the size
    of the dot to an actual numerical value. Uses: To show a correlation between three
    variables ![](rsrc1GF.jpg)Example: The following diagram shows a bubble plot that
    highlights the relationship between heights and age of humans: ![](rsrc1GG.jpg)Figure:
    Bubble plot showing the relation between height and age of humans Design practices:
    ✓         Design practices for the scatter plot are also applicable to the bubble
    plot. ✓        Don''t use it for very large amounts of data, since too many bubbles
    make the chart hard to read. Correlogram A correlogram is a combination of scatter
    plots and histograms. Histograms will be discussed in detail later in this chapter.
    A correlogram or correlation matrix visualizes the relationship between each pair
    of numerical variables using a scatter plot . The diagonals of the correlation
    matrix represent the distribution of each variable in the form of a histogram.
    You can also plot the relationship between multiple groups or categories using
    different colors. A correlogram is a great chart for exploratory data analysis
    to get a feeling for your data, especially the correlation between variable pairs.
    Examples: The following diagram shows a correlogram for the height, weight, and
    age of humans. The diagonal plots show a histogram for each variable. The off-diagonal
    elements show scatter plots between variable pairs: The following diagram shows
    the correlogram with data samples separated by color into different groups: ![](rsrc1GH.jpg)Figure:
    Correlogram with multiple categorie s Design practices: ✓         Start both axes
    at zero to represent data accurately. ✓        Use contrasting colors for data
    points and avoid using symbols for scatter plots with multiple groups or categories.
    Heatmap A heatmap is a visualization where values contained in a matrix are represented
    as colors or color saturation. Heatmaps are great for visualizing multivariate
    data, where categorical variables are placed in the rows and columns and a numerical
    or categorical variable is represented as colors or color saturation. Uses: Visualization
    of multivariate data It is great for finding patterns in your data Examples: The
    following diagram shows a heatmap for the most popular products on the Electronics
    category page across various e-commerce websites: ![](rsrc1GJ.jpg)Figure: Heatmap
    for popular products in the Electronics category Variants: annotated heatmaps
    Let''s see the same example that we saw previously in an annotated heatmap: ![](rsrc1GK.jpg)Figure:
    Annotated heatmap for popular products in the Electronics category Activity: Road
    Accidents Occurring over Two Decades You are given a diagram that gives information
    about the road accidents that have occurred over the past two decades during the
    months of January, April, July, and October: Identify the year during which the
    number of road accidents occurred was the least. ![](rsrc1GM.jpg)For the past
    two decades, identify the month for which accidents show a marked decrease : Figure:
    Total accidents over 20 years Composition Plots Composition plots are ideal if
    you think about something as a part of a whole. For static data, you can use pie
    charts, stacked bar charts, or Venn diagrams. Pie charts or donut charts help
    show proportions and percentages for groups. If you need an additional dimension,
    stacked bar charts are great. Venn diagrams are the best way to visualize overlapping
    groups, where each group is represented by a circle. For data that changes over
    time, you can use either stacked bar charts or stacked area charts. Pie Chart
    Pie charts illustrate the numerical proportion by dividing a circle into slices.
    Each arc length represents a proportion of a category. The full circle equals
    to 100%. For humans, it is easier to compare bars than arc lengths; therefore,
    it is recommended to use bar charts or stacked bar charts most of the time. Uses:
    Compare items that are part of a whole. Examples: The following diagram shows
    a pie chart that shows different fielding positions of the cricket ground, such
    as long on, long off, third man, and fine leg: ![](rsrc1GN.jpg)Figure: Pie chart
    showing fielding positions in a cricket ground The following diagram shows water
    usage around the world: ![](rsrc1GP.jpg)Figure: Pie chart for global water usage
    Design practices: Arrange the slices according to their size in increasing/decreasing
    order, either in a clockwise or anticlockwise manner. Make sure that every slice
    has a different color. Variants: donut chart An alternative to a pie chart is
    a donut chart. In contrast to pie charts, it is easier to compare the size of
    slices, since the reader focuses more on reading the length of the arcs instead
    of the area. Donut charts are also more space-efficient because the center is
    cut out, so it can be used to display information or further divide groups into
    sub-groups . The following figure shows a basic donut chart: ![](rsrc1GR.jpg)Figure:
    Donut chart Matplotlib Matplotlib is probably the most popular plotting library
    for Python. It is used for data science and machine learning visualizations all
    around the world. John Hunter began developing Matplotlib in 2003. It aimed to
    emulate the commands of the MATLAB software, which was the scientific standard
    back then. Several features, such as the global style of MATLAB, were introduced
    into Matplotlib to make the transition to Matplotlib easier for MATLAB users .
    Before we start working with Matplotlib to create our first visualizations, we
    will understand and try to grasp the concepts behind the plots. Overview of Plots
    in Matplotlib Plots in Matplotlib have a hierarchical structure that nests Python
    objects to create a tree-like structure. Each plot is encapsulated in a Figure
    object. This Figure is the top-level container of the visualization. It can have
    multiple axes, which are basically individual plots inside this top-level container.
    Going a level deeper, we again find Python objects that control axes, tick marks,
    legend, title, textboxes, the grid, and many other objects. All of these objects
    can be customized. The two main components of a plot are as follows: Figure The
    Figure is an outermost container and is used as a canvas to draw on. It allows
    you to draw multiple plots within it. It not only holds the Axes object but also
    has the capability to configure the Title . Axes The Axes is an actual plot, or
    subplot, depending on whether you want to plot single or multiple visualizations.
    Its sub-objects include the x and y-axis, spines, and legends . Observing this
    design on a higher level, we can see that this hierarchical structure allows us
    to create a complex and customizable visualization. When looking at the "anatomy"
    of a Figure, which is shown in the following diagram, we get an idea about the
    complexity of an insightful visualization. Matplotlib gives us the ability not
    only to simply display data, but also design the whole Figure around it, by adjusting
    the Grid, x and y ticks, tick labels, and the Legend. This implies that we can
    modify every single bit of a plot, starting from the Title and Legend, right down
    to even the major and minor ticks on the spines to make it more expressive: The
    anatomy of a Matplotlib figure is shown below: ![](rsrc1GS.jpg)Taking a deeper
    look into the anatomy of a Figure object, we can observe the following components:
    Spines : Lines connecting the axis tick marks Title : Text label of the whole
    Figure object Legend : They describe the content of the plot Grid : Vertical and
    horizontal lines used as an extension of the tick marks X/Y axis label : Text
    label for the X/Y axis below the spines Minor tick : Small value indicators between
    the major tick marks Minor tick label : Text label that will be displayed at the
    minor ticks Major tick : Major value indicators on the spines Major tick label
    : Text label that will be displayed at the major ticks Line : Plotting type that
    connects data points with a line Markers : Plotting type that plots every data
    point with a defined marker In this book, we will focus on Matplotlib''s sub-module,
    pyplot , which provides MATLAB-like plotting. Pyplot Basics Pyplot contains a
    simpler interface for creating visualizations, which allows the users to plot
    the data without explicitly configuring the Figure and Axes themselves. They are
    implicitly  and automatically configured to achieve the desired output. It is
    handy to use the alias plt to reference the imported sub-module, as follows: import
    matplotlib.pyplot as plt The following sections describe some of the common operations
    that are performed when using pyplot. Creating Figures We use plt.figure() to
    create a new Figure. This function returns a Figure instance, but it is also passed
    to the backend. Every Figure-related command that follows is applied to the current
    Figure and does not need to know the Figure instance. By default, the Figure has
    a width of 6.4 inches and a height of 4.8 inches with a dpi of 100. To change
    the default values of the Figure, we can use the parameters figsize and dpi. The
    following code snippet shows how we can manipulate a Figure: plt.figure(figsize=(10,
    5)) #To change the width and the height plt.figure(dpi=300) #To change the dp
    i Closing Figures Figures that are not used anymore should be closed by explicitly
    calling plt.close(), which also cleans up memory efficiently. If nothing is specified,
    the current Figure will be closed. To close a specific Figure, you can either
    provide a reference to a Figure instance or provide the Figure number. To find
    the number of a figure object, we can make use of the number attribute, like so:
    plt.gcf().number By using plt.close(''all''), all Figures will be closed. The
    following example shows how a Figure can be created and closed: plt.figure(num=10)
    #Create Figure with Figure number 10 plt.close(10) #Close Figure with Figure number
    10 Format Strings Before we actually plot something, let''s quickly discuss format
    strings. They are a neat way to specify colors, marker types, and line styles.
    A format string is specified as "\[color\]\[marker\]\[line\],” where each item
    is optional. If the color is the only argument of the format string, you can use
    any matplotlib.colors. Matplotlib recognizes the following formats, among others:
    RGB or RGBA float tuples (for example, (0.2, 0.4, 0.3) or (0.2, 0.4, 0.3, 0.5)
    ) RGB or RGBA hex strings (for example, ''#0F0F0F'' or ''#0F0F0F0F'') The following
    diagram shows a color wheel with RGB pixels of the colors: ![](rsrc1GT.jpg)CLUSTERING
    Clustering is the process of gathering entities with similar characteristics together.
    This technique belongs to unsupervised machine learning, whose target is to identify
    similarities in the data point and group the same data points together. Why apply
    Clustering ? By grouping similar entities in one place allows one to identify
    the attributes of different groups. In other words, this generates insight into
    the underlying patterns of various groups. There are countless application areas
    of grouping unlabeled data. For example, it is possible to select different groups
    of customers and market every group differently to take advantage of the revenue.
    Another example may include grouping documents together that belong to similar
    topics. Additionally, clustering is used to reduce the dimensionality of the data
    when you handle various copious variables. Types of Clustering a)     Partitioned-based
    clustering The phrase cluster doesn’t have an accurate definition. A cluster describes
    a set of points whereby any point in the cluster is close to any other point in
    the cluster than a point absent in the cluster. Sometimes, a threshold is used
    to define all points in a cluster close to one another. K-mean Clustering ❖       
    It begins with K as the input. This refers to the number of clusters that you
    want to find. Assign K-centroids in random positions in your space. ❖           Now,
    if you use the Euclidean distance between data points and centroids, allocate
    each data point to the cluster close to it. ❖         Re-compute the cluster centers
    as a mean of data points allocated to it. ❖         Repeat 2 and 3 till there
    are no more changes to happen. You might be wondering how you can select the value
    of K. One method is the “Elbow” that is used to define an optimal number of clusters.
    In this case, you’ll run the range of K values and plot the “percentage of variance
    explained,” on Y-axis and “K” on the “X” axis. ![](rsrc1GU.jpg)In the diagram
    below, more clusters have been added after 3. These additional clusters affect
    the display of the model. The first cluster adds more information and at a certain
    point, the marginal gain will start to drop . b)     Hierarchical clustering With
    the Hierarchical clustering, it begins by assigning all data points to belong
    to its own cluster. Just as the name implies, it creates the hierarchy and in
    the next step, it integrates the two closest data points and combines it together
    into a single cluster. i)                     Allocate every data point to its
    cluster. ii)                  Determine the closest pair of the cluster by applying
    the Euclidean distance and combine it into a single cluster. iii)               
    Determine the distance between two nearest clusters and integrate them until when
    all items are grouped into a single cluster. In the next method, you can choose
    the best number of clusters by identifying which vertical lines are cut by a horizontal
    line without affecting a cluster and deals with the maximum distance. ![](rsrc1GV.jpg)c)
        Density-Based Clustering The basic concept underlying the density-based clustering
    technique is extracted from a human perception clustering method. For example,
    if you look at the images below, you should be able to see four clusters plus
    different points of noise. ![](rsrc1GW.jpg)As shown in the above image, the clusters
    are dense regions in the data space that are delineated by regions of a lower
    density point. In short, the density of points in a cluster is somehow higher
    compared to the density of points located outside the cluster. The density-based
    clustering algorithm depends on an intuitive perception of “clusters” and “noise.”
    The point is that for every cluster, the neighborhood of a particular radius should
    have at least a minimum. The most important parameters are needed for DBSCAN include
    (“eps”) and minimum points (“MinPts”). The parameter eps determine the radius
    of the neighborhood around close to a point x. The parameter MinPts describes
    the minimum number of neighbors in the “eps” radius. Any point x that exists in
    the dataset that has a count higher than or equal to MinPts is identified as a
    core point. Customer Segmentation with Cluster Analysis The customer base of a
    company can have thousands, if not millions, of different unique persons. Marketing,
    to most of these people, presents a big problem because if you attempt to market
    to everybody, the message can be ambiguous. However, building a marketing plan
    which attracts every individual is not normal . Why customer segments are important
    Customer segments will make you understand the patterns which distinguish your
    customers. Below are some important ideas that you can achieve with segmentation
    analysis. • Enhanced understanding of customer needs and wants. This can lead
    to improved sales and customer satisfaction. • Create products that appeal to
    different customer segments. • Companies cannot fulfill all possible customers
    all the time. By applying the segmentation procedure, companies have the ability
    to concentrate on fulfilling those segments which they examine to be the best
    attractions for their products. • Build loyal relationships. While you can analyze
    your own customer base, soon it shall be clear that there are different groups
    that have customized requirements. This allows you to build a deeper understanding
    of your customers and find out what makes them tick. It is no gem that a customer
    is always more profitable compared to others. However, to be profitable, businesses
    should have a better understanding of the way profitability relates to customer
    segmentation. Discovering the difference between customers will permit one to
    personalize your method to the desires of the customer segments . Customer segmentation
    describes the practice of categorizing a customer base into different groups of
    individuals similar in a given way. Customer segments are often determined based
    on similarities, such as personal characteristics, behaviors, and preferences.
    By understanding your customers and their differences, it becomes one of the most
    important stages of measuring the customers’ relationship. How to Segment Segmentation
    doesn’t need to be very complex. For a small organization or company, it can be
    about discovering that you have two or three unique customer types who have different
    needs. Some popular methods used to segment customers consist of: •    Demographic
    •    Behavioral •    Psychographic •    Geographic ![](rsrc1GX.jpg)There are different
    ways that you can apply when it comes to segmentation of a market. One of the
    methods that are accurate and statistically valid is the application of cluster
    analysis. Data Science as a Change Agent Data Science is a change agent. Even
    though it has not been realized yet, this should be the perfect time for organizations
    to be ready. Companies that plan to change in the next couple of years should
    position themselves by gathering the correct data and investing in analytics capacity.
    The main thing to consider while building a predictive model is to establish what
    it is that you want to predict and gather massive data sets that will permit you
    to do so. Even though it is still far  to realize the change in management by
    applying predictive models, organizations can still remain on the right path by
    adopting the right tools and collecting accurate data. Use Digital Engagement
    Tools There are always new systems created to allow organizations to collect real-time
    feedback from employees. As per now, organizations can take advantage of these
    tools and help enhance their services. Most of these tools have been developed
    and installed with more functionality to reveal more information about an employee.
    These are tools that will indicate more than just what employees think every time.
    Most of these tools provide a relevant change to the management and can further
    let one determine whether a change is received equally across many locations.
    By working with large travel tourism firms, it helps create a system for real-time
    employee feedback. This provides a chance to experiment with various change strategies
    in a particular population company. The real-time feedback implies that one has
    to learn quickly how communications and interaction tactics are received. Therefore,
    it optimizes the actions in days instead of weeks. This particular data is then
    fed into a predictive model that will help one to accurately identify actions
    that can improve the adoption of a new practice and behavior by a specific group
    of employees . Commercial tools that are available include IQ polls and sampling
    groups of employees through a smartphone app on a weekly basis to extract real-time
    insights. Many of these tools generate a big change, but the data stream produced
    is even more important. As a result, it is essential to deploy these tools to
    achieve the success that comes with a change in data-driven processes. Social
    Media Analytics and stakeholder Sentiment Managers of change have another option
    to see past the limits of an enterprise to draw insights related to the impact
    of change programs. Customers, investors, and supplies are major stakeholders
    in the change programs. They have a likely chance to participate in social media
    and comment about the changes which a company plans to make. Advances in linguistic
    text analysis imply that one can detect clues linked to actions and behavior from
    the choices of words that people use. Besides that, the use of certain phrases,
    articles, and pronouns can help an individual discover how the other party feels.
    By applying such tools to analyze emails of a company, it eases the process of
    finding out insights and reactions of employees to various changes implemented.
    Therefore, insights generated after analyzing the internal conversation in an  organization
    will be stronger when it is combined with external social media data. Recording
    reference data related to change in the current projects You will discover that
    most organizations focus so much on measuring fractional shifts in the inventory
    turns, operational performance, and manufacturing efficiency. However, issues
    dealing with change have a low track performance. Even if projects have unique
    characteristics, there are many similarities when it comes to changing a system,
    improving a process and reorganizing projects. There is a chance to record information
    related to the team, how long it takes to implement and the tactics applied. Building
    a reference data set similar to this may not generate an instant gain, but the
    entire data set increases. Therefore, it becomes easy for one to build an accurate
    predictive model that can be helpful in changing an organization. How data is
    important in change For many years, companies relied on data-driven techniques
    to select candidates fit for senior roles. Nowadays, retail businesses have also
    adopted predictive analytics to hire their employees . As a result, these tools
    have improved the performance of a project and helped develop a new dataset. Let’s
    assume that every leader and member of a team was subjected through psychometric
    testing and evaluation before a project, the data produced from this testing can
    be useful in the identification of a causal model that can generate the correct
    change project. Creation of a dashboard Each organization is imagined to have
    a bespoke dashboard, created together with the firm’s leadership team. This reflects
    the priorities of the organization, future plan, and competitive position. By
    doing this way, dashboards generate significant insights about a particular transformation
    investment created by the organization. Most data that contributes to these signs
    are already available but not collected. There are clients of Change Logic’s that
    have developed a dashboard to identify attrition and recruitment in a must-win
    talent. This is not hard, but it helps enlighten the managerial team on how to
    use data to make intuitive decisions. While it might take some time for such tools
    to be created, organizations need to begin to create dashboards, if possible,
    they should automate them. As of today, most of these dashboards are vulnerable
    to version control problems, internal politics, and human error. Computerizing
    the dashboards makes it objective and transparent . While companies gather data
    and use data scientists to build accurate models, all managers of change must
    be confident to call data scientists to come and interpret procedures that allow
    firms to meet their goals. The creation of metrics can’t be easy because metrics
    aren’t one-and-done installations. Instead, it is a commitment cycle to capture
    data, refine dashboards and create models. To develop a dependable data set, it
    takes time. Data quality is a critical problem that also calls for the presence
    of a shared data language that will make organizations realize that they are measuring
    the correct thing. This has been one of the major issues for data analytics in
    other fields. Even if it might end up taking a lot of time, it will finally end
    the causal loop and produce a reliable prediction about how an action can alter
    a given metric. This will increase investment and change from a particular action
    to another data-informed perception. Change management helps shift a struggling
    project and recommends significant business results and how you can realize them. 
    Innovation Mindset While organizations continue to shift to digital transformation
    methods, more teams that are knowledgeable about Data Science are being formed.
    So far, the major challenge for Chief Data  Scientists involves positioning the
    Data Science function properly where a given organization''s need is to increase
    its current and future activities. This means that there is a need to recruit
    Data Science teams to completely interact with the business and adopt the operational
    backbone of the firm. Data Science has no formal description. Its goal is to understand
    and analyze actual phenomena using data. This can highly vary from one industry
    to another. However, with experiences from both worlds, one can define Data Science
    as an integration of skills in programming, mathematics, and communication with
    the application of scientific methods to a particular domain of knowledge. This
    practice can be summarized into different strategies: Skillsets This requires
    an individual to measure the readiness of analytics, talent management, spreading
    evidence-based culture and application of Data Science processes. Datasets This
    often covers data governance, infrastructures, and strategic data sources. Toolset
    s This deals with the selection of the right Data Science tools and the use of
    the best practices in the company or firm. Mindset This will collect all the animating
    principles that support the ethos of a Data Science function to create value and
    innovate at the center of a digital transformation. Mindset is the main force
    that changes investments in Skillsets, Datasets, and Toolsets into a cultural
    and economic impact. Below is a set of principles that act as a blueprint for
    how one can develop the mindset of innovation in Data Science. '
