    ## Python 中的数据预处理技术


    以下是预处理数据的技术：


    ### 缩放


    当你处理不同尺度的数据时，你需要缩放属性以具有相同的尺度。属性被缩放到 `0` 到 `1` 的范围内，并将其称为归归一化。为了实现这一点，使用了 `Scikit-learn`
