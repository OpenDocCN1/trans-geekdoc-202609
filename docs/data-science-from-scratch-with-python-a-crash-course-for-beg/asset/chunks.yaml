    \ it is easy for anyone to be dragged into the technology trap. Some of these\
    \ tools may result in distractions and short-term cosmetic results. Similar to\
    \ other innovative teams, technology does not attract or retain talent in Data\
    \ Science. Instead, what drives people is the healthy culture which ensures everyone\
    \ is satisfied, supported and challenged in his or her jobs. \n\n# 2. Stories\
    \ and not Sprints\n\nIn the early stages, projects should have buy-in from the\
    \ leadership so that they can deal with anti-change agents and handle unrealistic\
    \ expectations. With the advent of agile methodologies, most firms have turned\
    \ to sprints. However, innovation calls for both time and patience. Stories are\
    \ an amazing way that one can create the right focus over time and build patience\
    \ for teams to help in the execution. Demos, visualizations and other types of\
    \ stories motivate Data Science teams to wait, ask questions and concentrate on\
    \ visions than planning for a sprint. Narratives deliver the right chance to think\
    \ deeply and consider a given business via interactions, system dynamics as well\
    \ as how the change in analytical capability might affect an organization. The\
    \ material generated furthermore acts as a link to share knowledge outside the\
    \ organization and across disciplines. It champions for a positive and creative\
    \ spirit. \n\n# 3. Ethics and not profits\n\nSince the practice of Data Science\
    \ is popular, teams should develop a moral direction and techniques that predict\
    \ the limits of their discoveries. In addition, it is part of their leadership\
    \ duty to assist in determining a social mission of the developed algorithm and\
    \ analytics. It calls for collaboration to ensure the use of Data Science. For\
    \ instance, at the MIT, urban demos provided a means where one has to explore\
    \ whether the concepts are culturally or socially acceptable before they were\
    \ potentially profitable. By championing initiatives that would result in social\
    \ good and at the same time, align people before profit, it helps enrich the analytical\
