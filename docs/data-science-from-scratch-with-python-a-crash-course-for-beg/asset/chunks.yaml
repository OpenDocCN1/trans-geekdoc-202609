    # 第一章：数据科学基础


    大数据的到来导致了存储空间的扩张。结果，存储成为了大多数企业面临的最大障碍。此外，许多机构和企业都需要构建一个框架并开发一种解决方案来存储数据。因此，`Hadoop`
    和其他框架被开发出来以解决这个问题。一旦这个问题得到解决，重点就转向了如何处理数据。谈到数据处理时，很难不提到数据科学。这就是为什么理解数据科学以及它如何为业务增加价值至关重要。本章将带你了解数据科学的定义以及它在从复杂数据中提取核心洞察方面发挥的作用。


    ## 为什么数据科学至关重要


    传统上，数据是以小规模结构化的。这意味着如果你想分析数据，并没有什么问题。为什么呢？因为可以使用简单的 `BI` 工具来分析数据。但，最近的数据是非结构化的，与传统数据不同。因此，你需要先进的数据分析方法。下面的图片显示，在
    2020 年之前，超过 80% 的数据将是非结构化的。


    这些数据来自不同的来源，例如文本文件、财务日志、传感器、多媒体形式和仪器。由于数据的海量性，简单的 `BI` 工具无法处理这类数据。因此，需要复杂且先进的分析工具和处理算法。这类设备帮助数据科学家从数据中分析并得出核心洞察。


    数据科学日益流行还有其他原因。让我们来看看数据科学在不同领域的应用。你是否想过能够根据购买历史、过去的浏览记录、收入和年龄等现有数据，理解客户的确切需求？事实是，这现在是可能的。你可以使用不同类型的数据来训练模型，并有效地向客户准确推荐多种产品。


    让我们用另一个例子来说明数据科学在决策中的作用。如果你的汽车足够智能，可以开车回家呢？那太酷了。嗯，自动驾驶汽车的设计就是这样工作的。这些汽车从传感器收集实时数据以构建周围地图。根据这些数据，车辆可以做出决策，例如何时减速、何时超车以及何时转弯。这些汽车拥有复杂的机器学习算法，通过分析收集的数据来得出有意义的结果。


    数据科学被进一步应用于预测性分析。这包括天气预报、雷达和卫星等领域。人们已经创建了模型不仅可以预测天气，还能预测自然灾害。这有助于个人提前采取正确的措施并拯救许多生命。


    ## 数据科学的定义


    “数据科学”一词现在很常见，但它意味着什么？一个人要被称为数据科学家需要具备什么技能？数据科学中是如何做出预测和决策的？数据科学与商业智能之间有区别吗？这些都是你将在不久后能找到答案的问题。


    首先，让我们定义数据科学。数据科学指的是多种工具、机器学习原理和算法的结合，其目的是从原始数据中发现隐藏模式。人们可能会想它与统计学有多大区别。


    ![](img/rsrc1FB.jpg)


    上面的图片显示，数据分析师通过处理历史数据来解释正在发生的事情。另一方面，数据科学家将解释如何从中提取洞察，他们还将使用不同的先进机器学习算法来突出未来某个特定事件的发生。数据科学家从不同的视角和角度观察数据。因此，数据科学帮助个人通过利用规范性分析、机器学习和预测性因果分析来做出预测并做出决策。


    *   **规范性分析 (Prescriptive analytics)** - 如果你需要一个具有智能和能力能够自己做出决策的模型，那么规范性分析是最佳用选择。这一新领域提供建议，而不仅仅是预测，它还推荐不同的规范性行动和相关的结果。说明这一点的最佳例子是谷歌自动驾驶汽车。车辆收集的数据被用于训练汽车。你可以通过算法进一步挖掘这些数据以揭智能。它允许你的车辆做出决策，例如何时转弯、走哪条路径，以及何时加速或减速。

    *   **模式发现的机器学习 (Machine learning for pattern discovery)** - 假设你没有可以用于预测的资源；这需要你确定数据集中的隐藏模式以进行正确预测。模式发现中最常用的算法是`聚类
    (Clustering)`。假设你在一家电信公司工作，想通过在该地区安装塔来确定一个网络。因此，你可以使用聚类技术来确定塔的位置，以确保所有用户都有最大的信号强度。

    *   **使用机器学习进行预测 (Make predictions with machine learning)** - 如果你想构建一个可以预测公司未来趋势的模型，那么机器学习算法是最佳选择。它属于监督学习；之所以称为监督学习，是因为已经存在你可以用来训练机器的数据。

    *   **预测性因果分析 (Predictive causal analytics)** - 如果你需要一个可以帮助预测给定事件在未来发生概率的模型，你需要使用预测性因果分析。


    ## 数据科学家所需的技能组合


    ### 数学能力

    数据挖掘、数据洞察和开发数据产品的核心是通过定量视角观察数据的潜力。数据中存在相关性、纹理和维度，人们可以用数学表示它们。开发利用数据的解决方案涉及启发式和定量技术。大多数业务问题的答案包括建立在复杂数学基础上的分析模型，其中理解模型背后的原理至关重要。


    人们传播的另一个误解是数据科学主要是统计学。虽然统计学在数据科学中至关重要，但它并不是唯一的数学类型。有两类统计：贝叶斯统计和经典统计。大多数人在谈论统计时倾向于经典统计。然而，人们需要了解这两种统计类型。例如，确定数据集中隐藏特征的常用方法是`SVD`。这种方法植根于矩阵，适合数据科学家同时具备数学的广度和深度。


    ### 敏锐的业务触觉

    对于数据科学家来说，良好的业务直觉是重要的。通过独立处理数据，他们可以将观察结果转化为共享知识和策略，解决主要的业务问题。因此，数据科学家应该能够使用数据来创造故事（叙述）。


    ### 技术与黑客能力 (Technology and Hacking)

    在这种情况下，黑客是指应用技术方面的创造力和技巧。这种能力至关重要，因为数据科学家利用技术来收集海量数据并与高级算法工作。与数据科学相关的主要的语言包括`SAS`、`Python`和`R`。其他语言包括`Julia`和`Java`。


    ### 数据科学家 – 好奇心与心态

    大多数数据科学家的流行特征是他们深度思考并具有强烈的好奇心。数据科学要求具有探究精神。个人必须经常提新问题、进行发现并学习新事物。从数据中提取洞察不仅仅是观察；它是关于发现表面之下的真相。


    ## 机器学习


    机器学习的重点是学习数据的性质并将其应用于特定模型。虽然`ML`是计算机科学的一个领域，但它与传统的计算方法不同。在计算中，算法被描述为一组指令。机器学习允许计算机从数据样本中创建模型。如今，这种技术应用于电影、电子商务。


    ### 机器学习技术

    在机器学习领域，任务被分为不同的类别。这些类别大部分取决于如何执行，或提供的反馈类型。最流行的机器学习方法包括`监督学习 (supervised learning)`和`无监督学习
    (unsupervised learning)`。


    #### i) 监督学习 (Supervised Learning)

    对于监督学习，计算机有输入数据可以工作。该方法的目的是通过比较实际输出和训练输出来“学习”，发现错误并更改模型。这种方法包含了帮助预测未标记数据标签值的模式。例如，你可以给算法输入鲨的照片并将其标记为`鱼`。你也可以给它提供海洋图片并标记为`水`。监督学习最流行的用例之一是应用历史数据来预测事件发生的统计概率。可以使用股市数据预测市场的未来变化。此外，它可以帮助过滤垃圾邮件。


    #### ii 无监督学习 (Unsupervised learning)

    与数据标记的监督学习不同，在无监督学习处理的是未标记数据。这意味着学习算法的任务是识别提供数据中的相似特征。由于未标记数据非常普遍，机器学习技术是行业中最具价值的。无监督学习最重要的应用是在交易数据中。存在由客户和他们购买的产品组成的庞数据集，但由于你是人类，你可以从客户画像和购买历史中提取意义和相似性。


    ### 机器学习策略

    机器学习与计算统计密切相关。如果你具备一些统计知识，理解并应用机器学习算法是非常关重要的。


    *   **相关性 (Correlation)**：这描述了两个非独立非依赖变量之间存在的关联。

    *   **回归 (Regression)**：在最低水平，它有助于确定一个自变量和一个因变量之间的关系。

    *   **K 近邻 (The K-Nearest Neighbor)**：这种特定算法应用于模式识别模型。模式识别模型用于分类和回归。`k`是一个正整数。

    *   **KNN 分类 (KNN classification)**：涉及这种方法时，它的输出属于特定类别。例如，当`k = 1`时，算法分配一个新对象；当`k
    = 3`时，算法必须选择三个最近的邻居。


    ### 决策树 (Decision Tree)

    通常，当你想要创建一个决策的视觉表示时，决策树是重要的。下面的图描述了这种算法。图中包含蓝色菱形和橙色对象。


    ![](img/src1FC.jpg)

    ![](img/src1FD.jpg)

    ![](img/src1FE.jpg)

    ![](img/src1FF.jpg)


    ### 深度学习 (Deep Learning)

    深度学习总是尝试模仿人类以及如何成功处理刺激。神经网络驱动深度学习的架构，它包含许多层，是应用于人工智能的最佳方法之一。


    ### 编程语言

    当一个人想选择一种语言来学习机器学习时，有几种选择。其他语言包括`C++`、`Java`和`R`。


    ## 数据科学与云


    要成为数据科学家，你需要具备扎实的编程技能。尽管你可能不熟悉所有生产架构和基础设施等编程概念，但你需要在计算机科学方面具备技能。


    ### 什么是云？

    虽然听起来是假设和抽象，但云有具体的含义。在继续之前，这里是你需要了解的一些概念的定义：


    *   **网络 (Network)**：指的是连接在一起并共享资源的计算机集合。互联网是一个很好的例子。像 Wi-Fi 服务集和局域网这样的家庭网络有许多台计算机连接。网络中的计算机被称为`节点
    (nodes)`。

    *   **共享资源 (Shared Resources)**：包括媒体、网页、应用服务器、数据存储和打印机。计算机之间的通信通过`HTTP`、`TCP`和`IP`等互联网协议进行。

    *   **数据中心 (Data Center)**：计算机位于本地。换句话说，数据和应用程序都位于数据中心的计算机上。数据中心有用，因为它具有支持安全和保护的基础设施。

    *   **集群 (Cluster)**：指的是连接到同一网络的一组计算机，它们共同工作完成相似的任务。你可以将其考虑为可以提高性能、扩展性和可用性的单一计算机。


    简单来说，云指的是单一实体可以完全控制一组网络计算机并生成软件解决方案的过程。根据云的定义，互联网被认为是网络而非云。


    ### 云端数据科学

    任何熟悉数据科学的人都知道，过程是在数据科学家的本地机器进行的。计算机已经安装了编程语言，可以是`R`或`Python`。数据科学家进一步使用如 Anaconda
    之类的包管理器安装相关的开发包，或手动安装单个包。一旦开发环境就绪，通常的数据科学工作流就开始了，数据是唯一的元素。有时，并非在不同的本地开发环境中执行所有的数据科学和大数据相关的任务。如果出现这种情况，人们会将计算任务部署到本地机器，甚至是云虚拟机上。


    '
- fmt: "\n# Chapter 2: Data Science Demystified\n\nWhen it comes to data analysis,\
    \ it is not as easy as it looks. One of the reasons why it is difficult is because\
    \ only a few people have mastered the art of data analysis. This means that only\
    \ a few people can explain how it is done. Surprisingly, many people try to analyze\
    \ data daily, but the majority fails in their efforts. This is because experts\
    \ in this field haven’t taken time to explain how they think while analyzing data.\n\
    \nData Science is an art; it is not a concept that one can teach a computer. Data\
    \ analysts use different tools to achieve their tasks, right from linear regression\
    \ to classification trees. Even though all these tools are known to the computer,\
    \ it is the role of the data analyst to figure out a way in which he or she can\
    \ gather all the tools and integrate them into data to develop the correct answer\
    \ to a question. \n\nHowever, the process of data analysis has not been written\
    \ down properly. While there are a lot of books written about statistics, none\
    \ of them tries to address how one can create a real-world data analysis solution.\
    \ On the other hand, coming up with an important framework involves classifying\
    \ elements of data analysis using an abstract language. In some cases, this language\
    \ might be mathematics. Conversely, the same details of the analysis are what\
    \ make each analysis complex and interesting.\n\n## The Cycle of Analysis\n\n\
    You might look at data analysis and think that it follows a linear, step by step\
    \ process that has a well-developed result. However, data analysis is an iterative\
    \ and non-linear approach that is depicted by a series of epicycles. In this approach,\
    \ information is learned at each step, which then decides whether to redo and\
    \ refine the next step that is already performed or proceed to the next step.\
    \ \n\nWhen it comes to analyzing data, the iterative process is used in all steps\
    \ of the data analysis. Besides this, certain data analysis might appear fixed\
    \ and linear because of the algorithms encapsulated in the different software.\
    \ Therefore, it is important that one understands what it means by the term “data\
    \ analysis.”\n\nAlthough a study of data involves creating and implementing a\
    \ plan for gathering data, data analysis assumes that data is already gathered.\
    \ Most importantly, a study will involve the creation of a hypothesis, designing\
    \ a data collection procedure, gathering of data and interpretation of the data.\
    \ However, since data analysis assumes that data should be collected already,\
    \ it involves the development and refinement of a question and process of analyzing\
    \ and interpreting data.\n\n## The Five Major Activities of Data Analysis\n\n\
    1. State and refine the question\n2. Explore the data\n3. Create formal statistical\
    \ models\n4. Interpret the results\n"
