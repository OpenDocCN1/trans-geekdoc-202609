    # 第 3 章：数据可视化与处理


    如果你从事数据工作，那么数据可视化就是你日常工作中的重要部分。如果你恰好使用 `Python` 编程语言进行分析，你可能会被数据可视化库的海量选择所目不应措。有些库，例如
    `Matplotlib`，用于初步探索，但在展示数据中复杂的关系时并不十分有用。有些库可以很好地处理大型数据集，而另一些则主要关注于 `3D` 渲染。并没有哪一个可视化库可以被认为是完美的。某个库的某些功能优于另一个，反之亦然。简而言之，有许多选择，你不可能学习并尝试所有的库，或者可能让它们全部协同工作。那么，我们该如何完成工作呢？PyViz
    绝对有答案。


    ## 理解数据处理


    数据处理是将数据的性质变为更有用、更符合要求的行为。换句话说，就是让数据更具意义和信息量。通过应用机器学习算法、统计知识和数学模型，可以实现整个过程的自动化。根据所执行的操作和机器的要求，整个过程的输出可以是任何形式，如表格、图表、图表、图像等。


    ![](img/rsrc1FG.jpg)


    这看起来可能很简单，但对于 `Facebook`、`Twitter`、`UNESCO` 以及健康部门组织等大型机构和公司，整个过程必须以结构化的方式进行。下面的图显示了遵循的一些步骤：让我们详细查看每个步骤：


    ### 收集


    开始机器学习时最重要的一步是确保可用数据具有高质量。你可以从真实的来源收集数据，如 `Kaggle`、`data.gov.in` 和 `UCI` 数据集仓库。请参考以下示例：当学生准备参加竞争考试时，他们总是寻找最好的资源来确保获得良好成绩。同样，准确且高质量的数据将简化模型的学习过程。这意味着在测试期间，模型将输出最好的结果。数据收集涉及大量的时间、资本和资源。这意味着机构和研究人员必须选择他们想要实施或研究的正确类型的数据。例如，`面部表情识别`需要大量不同人类表情的图像。良好的数据将确保模型的结果是正确且真实的。


    ### 准备


    收集的数据可能是原始形式。原始数据不能直接喂给机器。相反，必须先对数据进行一些处理。准备阶段涉及从广泛来源收集数据、分析数据集，然后构建一个新的数据集以供额外的处理和探索。准备可以手动或自动完成，并且数据应准备成数值形式，以提高模型的学习率。


    ### 输入


    有时，已经准备的数据可能是机器无法读取的格式，在这种情况下，它必须转换为可读的格式。为了进行转换，存在一个特定的算法至关重要。执行这项任务需要密集的计算和准确性。请参考以下示例；你可以通过
    `MNIST`、音频文件、`twitter comments` 和视频片段等来源收集数据。


    ### 处理


    在这一阶段，需要 `ML` 技术和算法来以准确性和更好的计算执行在海量数据上生成的指令。


    ### 输出


    在这一阶段，机器以一种合理的方式获取结果，使用户可以决定参考它。输出可以以视频、图表和报告的形式出现。


    ### 存储


    这是最后一个阶段，生成的输出、数据模型和任何其他重要信息都将被保存以供将来使用。


    ## Python 中的数据处理


    在学习如何使用 `Python` 处理和分析数据之前，让我们先学习一些 `python` 库。首先要的一件事是熟悉一些重要的库。你需要知道如何将它们导入到环境中。在
    `Python` 中有不同的方法实现这一点。


    ```python

    Import math as m

    From math import *

    ```


    在第一种方法中，你为库 `math` 定义了一个别名 `m`。然后你可以通过引用别名 `m` 使用 `math` 库中的不同函数 `factorial()`。在第二方法中，你导入
    `math` 中的整个命名空间。你可以选择直接应用 `factorial()` 而不需要引用 `math`。


    **注意**：Google 推荐第一种导入库的方法，因为它有助于你确定函数的来源。下面的列表了你需要了解函数来源的库。


    - **NumPy**: 代表 `Numerical Python`。`NumPy` 最先进的功能是 `n-dimensional array`。该库具有标准的线性代数函数、高级的随机数能力，以及与其他底层编程语言集成的工具。

    - **SciPy**: 是 `Scientific Python` 的缩写。`SciPy` 基于 `NumPy` 设计。它是不同高层科学和工程模块（如`线性代`、`稀疏矩阵`
    和`傅里叶变换`）最重要的库之一。

    - **Matplotlib**: 当你有许多需要绘制的图表时最适用。它从折线图到热图，你可以在 `IPython` 笔记本中使用 `Pylab` 功能以确保绘图功能是内联的。

    - **Pandas**: 最适用于结构化数据操作和处理。它被广泛用于数据准备和挖掘。`Pandas` 最近引入 `Python`，并且对增强 `Python`
    在数据科学家社区中的应用非常有用。

    - **Scikit-learn**: 它是为机器学习设计的。它是基于 `matplotlib`、`NumPy` 和 `SciPy` 创建的。这个特定库具有许多用于机器学习和统计建模的高效工具。这包括回归、分类、聚类和降维。

    - **StatsModels**: 该库专为统计建模设计。`Statsmodels` 是一个 `Python` 模块，允许用户探索数据、近似统计模型并实施统计检验。


    ### 其他库


    - `Requests`

    - `Blaze`

    - `Bokeh`

    - `Seaborn`

