    # 第 2 章：揭开数据科学的神秘纱


    谈到数据分析，它并没有看起来那么简单。之所以困难的原因之一是因为只有少数人精通数据分析的艺术。这意味着只有少数人能够解释具体是如何操作的。惊讶的是，每天都有很多人尝试分析数据，但大多数人的努力都告失败了。这是因为该领域的专家还没有花时间来解释他们在分析数据时是如何思考的。


    数据科学是一门艺术；它不是一个可以教给计算机的概念。数据分析师使用不同的工具来完成任务，从线性回归到分类树无一不是。尽管所有工具对计算机都是为人所知的，但数据分析师的角色是找到一种方法，使其能够收集所有工具并将它们整合到数据中，从而为问题得出正确的答案。


    然而，数据分析的过程并没有被妥善地记录下来。虽然有很多关于统计学的书籍，但没有哪一本书尝试解决如何创建一个真实世界的数据分析解决方案。另一方面，构建一个重要的框架涉及到使用抽象语言对数据分析的元素进行分类。在某些情况下，这种语言可能是数学。相反，正是分析中的相同细节使得每项分析变得复杂而有趣。


    ## 分析的循环


    你可能观察数据分析并认为它遵循一个线性的、逐步步进的过程，并有一个良好的结果。然而，数据分析是一种迭代且非线性的方法，由一系列本圆（epicycles）描述。在这种方法中，每一步都会学习信息，然后决定决定是重新执行并完善已经执行的下一步，还是继续进行下一个步骤。


    在分析数据时，迭代过程被应用于数据分析的每一个步骤中。此外，某些数据分析可能由于封装在不同软件中的算法而看起来是固定且线性的。因此，理解“数据分析”这一术语的真正含义是非常重要的。


    虽然数据研究涉及制定和实施数据收集计划，但数据分析假设数据已经收集完毕。最重要的是，一项研究将涉及假设的创建、数据收集程序的设计、数据的收集以及对数据的解释。然而，由于数据分析假设数据本应该已经收集好了，因此它涉及到问题的开发和完善，以及分析和解释数据的过程。


    ## 数据分析的五大主要活动


    1. 提出并完善问题

    2. 探索数据

    3. 创建正式统计模型

    4. 解释结果


    '
- fmt: '

    # Communicate the Results


    All the above activities happen on different occasions. For instance, it is possible
    to go through all of them in a day but handle each in detail in a period of more
    than one month. So let’s look at the overall framework applied in each of these
    activities. While there are many different types of activities that one can engage
    in while performing data analysis, each aspect of the whole process can be undertaken
    through an interactive process.


    Most importantly, for each of the above five activities, it is advised that you
    include the following steps:

    * Define or set the expectations

    * Collect information, compare the data to your expectation

    * If the data fails to match your expectations, revise or fix the data so that
    both your expectations and data match.


    Going through all the above three steps is what is referred to as the cycle of
    the data analysis. While you navigate through every stage of the analysis, you
    will require to go through the epicycle to constantly revise your question, formal
    models, interpretation, and communication. A repeated cycle through each of these
    five major activities forms the largest part of data analysis.


    ## Define the Expectations


    In this step, you intentionally lay down what you expect before you can do anything,
    such as performing a procedure, inspecting your data or typing a command. For
    the experienced data analysts, creating expectations might be automatic or a subconscious
    process. Despite this, it is important to think about it. For instance, if you
    are going to shop with friends and you have to stop by an ATM to withdraw some
    money. You need to make a decision about the amount of money that you want to
    withdraw; you need to have some expectations of the price of the things you are
    going to buy. This could be something that you have no problem if you know the
    prices of the product you are going to buy. This is an example of prior knowledge.


    Another example of prior knowledge would know the time that a specific restaurant
    closes. Using that information, you can schedule your time and activities so that
    you show up for dinner before it is closed. You can also find out additional information
    from your friends that will help you come up with expectations or Google a restaurant
    to learn more about their working hours. This procedure that you apply to prior
    information to develop expectation or implement an analysis procedure is the same
    used in every main activity of the analysis process.


    ## Information collection


    This step requires one to collect information related to the question or data.
    For questions, one collects information by doing literature research or finding
    out from experts. For the data, once you have developed some expectations about
    what the result can be when the data is inspected, it is okay to go ahead and
    carry out the operation. The results of this activity include data that you need
    to collect and determine whether the collected data matches your expectations.


    ## Comparison of Expectations


    Once you have the data in your hands, the next step is to compare your expectations
    to the data. Here, there are two possible results:

    * Your cost estimations match the amount on the check.

    * Your cost estimations fail to match.


    If both the cost estimations and amount match, then you can move onto the next
    activity. Alternatively, if your expectations cost 60 dollars, but the check is
    30 dollars, then your expectations and data are different. In this case, there
    could be two possible reasons for the difference: the first is that you may have
    wrong expectations and you need to revise it; secondly, the check may be wrong
    and contains errors. One key indicator that can hint on the status of your data
    analysis is the easiness or difficultness to match the data you collected to your
    original expectations.


    ## Volume, Velocity, and Variety


    Big data has various “V” s. The major ones include velocity, variety, and volume.
    Big data surpasses the storage capacity of normal databases. The scale of data
    generated is massive. As of today, a huge amount of data is generated. One reason
    for this is because of the increase in interaction. Interaction is a new phenomenon
    besides just the transaction of data. Data interaction comes from activities of
    the browser, personal digital recorders, and geo-location. With the advent of
    the “internet of things,” massive data is produced that humans spend their entire
    time trying to analyze.


    A good data scientist should know how to control volume; he or she should know
    how to create algorithms that can intelligently use the size of the data effectively.
    Things acquire a new direction when you have gargantuan data because each similarity
    becomes important, and one can easily make false conclusions. In most business
    applications, extraction of correlation is enough; however, the right data science
    uses techniques that determine the cause based on these correlations.


    Data velocity will always accelerate. There is an increase in Facebook posts,
    tweets and financial information generated by many users at a higher speed. Velocity
    increases the volume of data and reduces the time of data retention. For example,
    a high-frequency trading activity depends on data streams and fast information.
    But the authenticity of the data reduces rapidly.


    Lastly, data variety has gone deep. Models that depend on just a handful of variables
    can now produce hundreds of variables because of the increase in computing power.
    The rate of change in volume, velocity and data variety is currently possible
    for new economic-metrics and various tools.


    ## Machine Learning


    Machine learning refers to how systems learn from various types of data it processes.
    It is possible to train a system based on particular data to make decisions. The
    training process occurs continuously to enable systems to make updates and enhance
    decision-making ability. Systems that use spam filters are a great example to
    demonstrate how machine learning is applied. These systems use a Bayesian filter
    to change decisions. Therefore, it will continue to stay ahead of spammers. The
    ability to dynamically learn is important because it helps prevent spammers from
    gaming the filter. Credit approvals use neural-nets and are a great example of
    a machine learning technique. Besides that, machine learning prefers data compared
    to judgments. Hence, a good data scientist should have a variety of both. Machine
    learning has helped in finding answers to questions of interest, and it has further
    proved to be a game-changer. What makes machine learning very interesting is because
    of the four characteristics of machine intelligence:


    * It is built on a strong foundation of a theoretical breakthrough.

    * It redefines the current economic paradigm.

    * The final result is commoditization.

    * It unearths new data from data science.

    '
