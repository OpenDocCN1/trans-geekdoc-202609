    # Chapter 4: Plotting using Python Functions


    `NumPy` and `pandas` are essential tools for data wrangling. Their user-friendly
    interfaces and performant implementation make data handling easy. Even though
    they only provide a little insight into our datasets, they are absolutely valuable
    for wrangling, augmenting, and cleaning our datasets. Mastering these skills will
    improve the quality of your visualizations.


    In this chapter, we learned the basics of `NumPy`, `pandas` and statistics concepts.
    Even though the statistical concepts covered are fundamental, they are necessary
    to enrich our visualizations with information that, in most cases, is not directly
    provided in our datasets. This hands-on experience will help you implement exercises
    and activities in the following chapters.


    In the next chapter, we will focus on the different types of visualizations and
    how to decide which visualization would be best in your case. This will give you
    theoretical knowledge so that you know when to use a specific chart type and why.
    It will also lay down the fundamentals of the chapters, which will heavily focus
    on teaching you how to use `Matplotlib` and `seaborn` to create the plots discussed.
    After we have covered basic visualization techniques with `Matplotlib` and `seaborn`,
    we will dive deeper and explore the possibilities of interactive and animated
    charts, which will introduce the element of storytelling into our visualizations.


    ### What you should know about plots

    - Identify the best plot type for a given dataset and scenario

    - Explain the design practices of certain plots

    - Design outstanding, tangible visualizations


    Over time, we will look at types of charts, such as line charts, bar charts, and
    radar charts. Relation plots are handy to show relationships among variables.
    We will cover scatter plots for showing the relationship between two variables,
    bubble plots for three variables, correlograms for variable pairs, and, finally,
    heatmaps.


    Composition plots, which are used to visualize variables that are part of a whole,
    as well as pie charts, stacked bar charts, stacked area charts, and Venn diagrams,
    are going to be explained. To get a deeper insight into the distribution of variables,
    distribution plots are used. As a part of distribution plots, histograms, density
    plots, box plots, and violin plots will be covered. Finally, we will talk about
    dot maps, connection maps, and choropleth maps, which can be categorized into
    geo plots.


    ## Comparison Plots


    Comparison plots include charts that are well-suited for comparing multiple variables
    or variables over time. For comparison among items, bar charts (also called column
    charts) are the best way to go. Line charts are great for visualizing variables
    over time. For a certain time period (say, less than ten-time points), vertical
    bar charts can be used as well. Radar charts or spider plots are great for visualizing
    multiple variables for multiple groups.


    ## Line Chart


    Line charts are used to display quantitative values over a continuous time period
    and show information as a series. A line chart is ideal for a time series, which
    is connected by straight-line segments. The value is placed on the `y-axis`, while
    the `x-axis` is the timescale.


    ### Uses

    Line charts are great for comparing multiple variables and visualizing trends
    for both single as well as multiple variables, especially if your dataset has
    many time periods (roughly more than ten). For smaller time periods, vertical
    bar charts might be the better choice.


    The following diagram shows a trend of real-estate prices (in million US dollars)
    for two decades. Line charts are well-suited for showing data trends:


    ![](rsrc1G2.jpg)


    ### Line chart for a single variable

    Example: The following diagram is a multiple variable line chart that compares
    the stock-closing prices for Google, Facebook, Apple, Amazon, and Microsoft. A
    line chart is great for comparing values and visualizing the trend of the stock.
    As we can see, Amazon shows the highest growth:


    ![](rsrc1G3.jpg)


    Figure: Line chart showing stock trends for the five companies.


    ### Design practices

    - Avoid too many lines per chart

    - Adjust your scale so that the trend is clearly visible

    '
