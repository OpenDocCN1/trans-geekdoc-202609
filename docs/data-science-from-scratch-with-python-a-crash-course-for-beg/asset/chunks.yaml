    标签有时可以是单词或数字。如果你想对训练数据进行标记，则需要使用单词来增加其可读性。标签编码（Label encoding）将单词标签转换为数字，以便算法能够对它们进行操作。这里有一个示例：![](img/rsrc1FZ.jpg)


    # 机器学习的实际应用


    机器学习指的是一种数据分析方法，通过训练计算机来执行人类和动物都能自然而然地完成的任务。它的核心在于从经验中学习。机器学习算法具有计算方法，可以帮助个人从数据中发现信息，而无需等待预设的方程。当用于学习的样本数量增加时，这些算法会动态地提高数据性能。


    ## 为什么机器学习如此重要


    大数据的增长使得机器学习成为解决以下问题的必经方法：

    *   图像处理和计算机视觉。

    *   用于负载预测的能源生产。

    *   用于算法交易和信用评分的计算金融。

    *   帮助识别语音的自然语言处理。

    *   用于航空航天、汽车和制造业的预测性维护。


    机器学习算法识别数据中的自然模式，以得出洞察并做出智能决策。它被每天用于股票交易、医疗诊断和预测中的关键决策。机器学习应用的示例包括媒体网站，它们在建议用户可能下载或观看的电影之前，会先分析客户数据。此外，零售商还必须以从客户购买产品的方式中提取出重要信息。


    ## 何时适合应用机器学习


    当你正准备处理一项复杂任务或问题时，就是应用机器学习的最佳时机。


    ## 机器学习的真相


    机器学习有其局限性。构建出诸如《星际迷航》、《太空奥游》和 Hal 9000 那样的智能机器是不可能的。但在许多现实世界的处理应用中，机器学习的运行如得水鱼。以下是机器学习应用的热门类别：


    ### 图像处理

    它要求人们分析图像并获取数据或执行某些转换。示例包括：

    *   图像标记。这类似于 Facebook，算法可以自动识别照片中你的脸或你朋友的脸。基本上，机器学习算法将从手动标记的照片中进行学习。

    *   光学字符识别（OCR）。一旦算法学会了如何将扫描的文本文档转换为数字版本，算法就必须知道如何将图像转换为相应数字字母的手写字符。


    ### 文本分析

    这是从电子邮件、文档、聊天和推文中分类或提取信息的过程。热门示例包括：

    *   情感分析。这是文本分类的另一个应用领域。在这种分类中，算法必须知道如何根据作者表达的情绪将观点分类为中性、积极或消极。

    *   信息提取。它涉及学习提取特定的信息或数据。

    *   垃圾邮件过滤。这是最广泛使用的文本分类应用之一。垃圾邮件过滤器根据内容和主题将电子邮件分类为垃圾邮件。


    ### 数据挖掘

    这是一种从数据中确定预测的方法。这个定义看起来很通用，但人们可以将其看作是从数据库中的巨型表中提取重要信息。每一行由一个训练实例组成，每一列由一个特征组成。你可能对预测表格中依赖于其他列的新列。例如：

    *   关联规则。以超市或电子商务网站为例，通过观察一起购买的产品类型，可以确定客户的购买习惯。这类信息对营销目的很有用。

    *   异常检测。寻找异常值，例如在信用卡欺诈中，你可能从用户的正常购买模式中识别出交易类型和异常值。

    *   预测。这涉及根据其他变量预测一个变量。例如，你可以通过学习现有客户的信用评分来预测银行新客户的信用评分。


    ### 推荐系统

    大多数电子商务和零售公司都在利用数据的巨大潜力，通过在其网站上实施推荐系统来提高销量。这些系统侧重于向用户推荐他们可能喜欢或感兴趣的物品。推荐所需的数据来自显式的用户评分（观看电影或听歌曲）以及隐式的搜索历史和查询。`Spotify`、`Youtube`
    和 `Netflix` 等网站拥有可用于推荐播放列表的数据。


    #### 使用推荐系统的优点

    应用推荐算法的公司专注于通过个性化优惠和改进客户体验来提高销售额。推荐增加了搜索，并使用户能够访问他们感兴趣的内容，并用他们从未搜索过的优惠给他们带来惊喜。有趣的是，公司现在可以通过发送符合其画像兴趣的新优惠邮件链接，来获取并留住客户。通过建议产品和系统为用户创造额外优势，在买家中营造了极好的感觉。这是一件很好的事情，因为它将允许公司走在竞争对手面前。


    #### 推荐系统的类型

    推荐系统根据两类信息运行：

    i) 用户-物品交互

    ii) 特征信息。这帮助我们达到推荐系统的第一类分类。这包括具有特征信息的基于内容的系统，以及依赖用户-物品交互的协同过滤。混合系统应结合这两种信息，目标是避免仅使用一种类型工作时产生的问题。


    ## 基于内容的系统

    基于内容的系统建立在应用每个产品的内容用于推荐的想法之上。以下是基于内容的推荐系统的一些优缺点。


    ### 优点

    *   创建一个更透明的系统非常简单。你使用相同的内容来描述推荐。

    *   内容表示是不同的，它们开启了应用文本处理、推理和语义信息等独特方法的选项。

    *   在物品有足够描述的情况下，不需要出现“新物品问题”。


    ### 缺点

    *   基于内容的推荐系统似乎过于专门。它们会推荐与已消费相似的物品，导致产生“过滤泡”。

    *   另一个问题是新用户没有定义的画像，除非他们显式请求信息。尽管如此，向系统添加新物品是非常简单的。


    ### 主要组件

    *   内容分析器 - 使用给定的表示类型分类物品。

    *   过滤组件 - 接收所有输入并为每个用户创建推荐列表。

    *   学习器 - 创建代表每个用户偏好的画像。


    ### 如何表示内容

    特定物品的内容是抽象并提供更多选项。你可以使用许多变量。例如，对于一本书，你可以包括体裁、作者、书籍的内容以及许多其他因素。一旦知道哪些内容，你需要将所有数据转换为向量空间。通过使用词袋（Bag
    of Words）模型执行此操作，忽略单词顺序。在这个特定模型中，每个文档看起来像一个某些单词的包。词袋的精确实现是 `TF-IDF` 表示。在这里，`TF`
    代表词频，`IDF` 代表逆文档频率。这种特定模型将文档中单词的重要性与语料库中单词的重要性结合起来。这只是基于内容的推荐引擎的一个方面。重要的是，词袋表示在单词的语文中是不够的。如果需要，语义表示变得有用。以下是两个选项：

    *   显式语义表示

    *   `Wordnet`

    *   `ConceptNet`

    *   用于语义表示的本体论（Ontologies）

    *   推理语义表示

    *   隐含狄利克雷分配（Latent Dirichlet Allocation）

    *   隐含语义索引（Latent Semantic Indexing）


    ## 协同过滤系统

    这些推荐引擎执行用户交互来评估物品。你可以使用矩阵可视化交互，其中 `(i, j)` 代表用户 `i` 和物品 `j` 之间的交互。查看协同过滤的一种方法是将其视为回归和分类的推广。在以下情况下，目标是直接预测变量，这取决于其他变量。将问题可视化允许我们不仅预测唯一列，还帮助我们预测任何项。


    ### 应用于协同过滤的技术

    对协同过滤已经有很多研究，最常用的技术取决于低维因素。CF 技术分为两种：


    #### 基于内容的过滤

    该系统根据用户的历史向用户推荐物品。基于内容的过滤最大的优点是它可以立即推荐与物品相关的物品。基于内容的系统根据用户提供的信息（显式或隐式）工作。根据数据，创建了一个提供大量输入或采取推荐行动的用户画像。


    #### 推荐系统

    大多数电子商务和零售公司都在利用数据的巨大潜力，通过在其网站上实施推荐系统来提高销量。这些系统侧重于向用户推荐他们可能喜欢或感兴趣的物品。我非常希望 AI
    芯片的出现改变现状。此外，更廉价的云服务的出现加上对 AI 和 IoT 的巨大投资将改变 IoT 和 AI 之间的关系。许多公司将制造自动驾驶汽车和其他自动驾驶机器。今年让我们窥见了
    IoT 和人工智能如何让公司拥有巨大的梦想。


    ## 未来趋势与应用


    ### 1. 人工智能将增强 DevOps

    人工智能将增强 DevOps 基础设施和服务，是你确保业务顺利运行而必须承担的高级任务。尽管如此，许多由 DevOps 人员的操作可以通过机器完成。此类操作的示例包括扩展、调试和监控。DevOps
    开始逐渐让位于 `AOps`，这反过来将简化开发人员处理管道和流程的工作，而无需考虑维护和设置的挑战。网上有很多论文预测使用 `AOps` 的 DevOps
    未来。


    ### 2. 人工智能与 IoT 之间的关系

    IoT 和 AI 都发生了很多。然而，AI 与 IoT 的完美结合尚未发生。该项目的用案例示例是尝试使用传感器从车辆获取信息，并利用获取的信息对保险金额做出决策。到为止，还没有保险公司能够使用这种方法计算总保费金额。


    ### 3. 个性化药物

    你和邻居使用同一种睡药吗？大多数时候，你可能会发现剂量对你来说不够，或者你可能对制造药物的成分之一过敏。或者由于特定原因，睡药对你可能没有效果。为什么你不能拥有专门为你的身体制造的药物呢？个性化药物遵循严格的程序，通过考虑患者的习惯和生活方式对其进行分析。之后，推荐由特定物质组成的药片。


    ### 4. 基于机器学习的助手进化的增强

    去年，我们都被像 `Alexa` 这样先进且新的助手所印象深刻和震惊。没有发生的是它的商业应用。AI 芯片已经用于 `Honor Play`、`Galaxy
    Note 8` 和 `iPhone XR` 等手机。这些整个手机型号都有特定的 AI 芯片，在这些功能期间承担着重工作。

