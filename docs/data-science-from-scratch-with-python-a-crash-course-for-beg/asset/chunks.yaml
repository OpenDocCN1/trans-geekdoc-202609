    # 第 4 章：使用 Python 函数绘图


    `NumPy` 和 `pandas` 是数据清洗必不可少的工具。它们用户友好的接口和高效的实现使得数据处理变得简单易行。尽管它们对我们的数据集提供的洞察有限，但对于处理、增强和清理我们的数据集具有绝对价值。掌握这些技能将提高你可视化结果的质量。


    在本章中，我们学习了 `NumPy`、`pandas` 的基础知识以及统计学概念。尽管涵盖的统计概念是基础性的，但它们对于丰富我们的可视化信息至关重要，因为在大多数情况下，这些信息并非直接由数据集提供。这种实践经验将帮助你完成后续章节中的练习和活动。


    在下一章中，我们将重点关注不同类型的可视化方案，以及如何根据你的情况决定最佳的可视化方式。这将为你提供理论知识，让你知道何时以及为何使用特定的图表类型。它还将为后续章节奠定基础，后续章节将重点教你如何使用
    `Matplotlib` 和 `seaborn` 来创建讨论的图表。在涵盖了使用 `Matplotlib` 和 `seaborn` 的基础可视化技术后，我们将深入探索交互式和动画图表的可能性，这将为我们的可视化引入叙故事的元素。


    关于 你应该了解的图表知识

    - 针对给数据集和场景识别最佳图表类型

    - 解释某些图表的设计实践

    - 设计卓越且直观的可视化方案


    随着时间的推移，我们将查看各种类型的图表，例如折线图、柱状图和雷达图。关系图（Relation plots）有助于显示变量之间的关系。我们将涵盖显示两个变量之间关系的散点图、用于三个变量的气泡图、用于变量对的相关性矩阵（correlograms），最后是热力图。


    我们将解释组合图（Composition plots，用于可视化作为整体一部分的变量）以及饼图、堆叠柱状图、堆叠面积图和维恩图。为了更深入地了解变量的分布，将使用分布图。作为分布图的一部分，将涵盖直方图、密度图、箱线图和小提琴图。最后，我们将讨论点地图、连接地图和等值区域图，这些可以归类为地理图。


    ## 比较图


    比较图包括适用于比较多个变量或随时间变化的变量的图表。对于项目之间的比较，柱状图（也称为列图）是最佳选择。折线图非常适合可视化随时间变化的变量。对于特定的时间段（例如少于十个时间点），也可以使用垂直柱状图。雷达图或蜘蛛网图非常适合可视化多个组的多个变量。


    ## 折线图


    折线图用于显示连续时间段内的定量值，并以序列显示信息。折线图是时间序列的理想选择，它由直线段连接。值位于 `y-axis` 上，而 `x-axis` 是时间尺度。


    ### 用途

    折线图非常适合比较多个变量并可视化单个或多个变量的趋势，特别是当你的数据集有很多时间段（大约多于十个）时。对于较的时间段，垂直柱状图可能是更好的选择。


    下图显示了两个十年内房价（以百万美元计算）的趋势。折线图非常适合显示数据趋势：


    ![](img/rsrc1G2.jpg)


    ### 单变量折线图

    示例：下图是一个多变量折线图，比较了 Google、Facebook、Apple、Amazon 和 Microsoft 的收盘价。折线图非常适合比较数值和可视化股票趋势。正如我们所看到的，Amazon
    的增长最高：


    ![](img/rsrc1G3.jpg)


    图：显示五家公司股票趋势的折线图。


    ### 设计实践

    - 避免每个图表中线条过多

    - 调整你的比例，使趋势清晰可见


