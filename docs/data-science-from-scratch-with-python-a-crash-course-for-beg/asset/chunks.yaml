  trans: '


    # 1. 文化优先于技术


    在技术推动的现代，任何人都很容易掉入技术陷阱。其中某些工具可能会导致注意力分散并产生短期的表象效果。与其他创新团队类似，在数据科学领域中，技术本身并不能吸引或留住人才。相反，驱动人们的是健康的文化，这种文化确保了每个人在工作中都能获得满意、支持并面临挑战。


    # 2. 关注故事（Stories）而非冲刺（Sprints）


    在项目早期阶段，项目应该获得领导层的认可，以便他们应对反对变革的因素并处理不切实际的预期。随着敏捷方法的出现，大多数公司已转向冲刺模式（sprints）。然而，创新既需要时间也需要耐心。“故事”是一种极佳的方式，能够让人随着时间的推移建立正确的焦点，并培养团队的耐心以帮助执行。演示（Demos）、可视化和其他类型的故事能激励数据科学团队去等待、提问并专注于愿景，而不是仅仅为某一次冲刺进行计划。叙事提供了正确的深度思考的机会，通过交互、系统动力学以及分析能力的变化可能如何影响组织，来考虑特定的业务。此外，生成的材料还充当了在组织外部和跨学科共享知识的纽带。它倡导一种积极创新的精神。


    # 3. 伦理优于利润


    由于数据科学实践的日益流行，团队应该建立道德导向以及预测其发现局限的技术。此外，协助确定所开发的算法和分析的社会使命也是其领导职责的一部分。这需要协作来确保数据科学的合规使用。例如，在麻省理工学院（MIT），城市演示了一种手段，让人们在这些概念可能产生盈利之前，必须探索它们在文化或社会上是可接受的。通过倡导能够产生社会效益的倡议，并将人的利益置于利润之前，这有助于通过那些可能未参与商业运作的成员来丰富分析能力。


    # 4. 博学优于专精


    数据科学包含一个多学科的概念，不能孤立地工作。为了确保能够与其他方合作，专家必须学习其领域之外的知识。某些组织可能会陷入一种陷阱，认为必须拥有博士学位才能做数据科学。事实并非如此，因为这种实践要求人们具有更强的好奇心以帮助学习其他学科的语言，并对协作学习有深度的渴望。这些都是博学者的特征，使团队准备好与组织中从设计、产品管理、沟通、财务等许多不同角色的人进行互动。近期，`AI
    Designer`和`Product Scientist`等术语在行业内兴起，强调了用科学方法连接不同学科的重要性。同时，来自科学、技术、数据偏见和算法等跨学科领域的特定观点已成为数据科学的主要主题之一。一个通才型专家将提供跨学科知识，倡导创造力并对组织或社会的需求有更深入的理解。与专家团队相比，由通才专家组成的团队对于复杂、深层次且非常规的领域呈现出更全面的全局视角。


    # 第 5 章：数据科学技术


    无论你对数据科学主题持何观点，都很难低视数据的作用以及分析、收集和背景化数据的能力。不仅如此，随着机器学习技术的发展以及深度学习等领域的出现，这些已被证明对研究人员至关重要。数据科学家持续享受着新的创新和技术发展。尽管强大的编程技能至关重要，但数据科学包含了软件工程概念。数据科学家应该兼备编程、批判性思维和统计能力。他/她既应该是一个出色的统计学家，也要擅长编程。建议人们理解不同技术背后的原理，以便他们知道何时以及如何使用它们。对于一个人来说，理解简单的方法对于其理解复杂的方法至关重要。此外，检查给定方法的效率以发现其运行优坏也是好的。这是一个有趣的研究领域，在科学、金融和工业中具有显著的应用。总来说，统计学是任何成功的数据科学家必须掌握的要组成部分。统计学习问题的示例包括：


    *   个性化电子邮件垃圾邮件检测系统。

    *   根据临床测量、人口统计学数据、饮食和临床测量，找出个人是否患发过心脏病。

    *   将组织样本分类为不同的癌症类型。

    *   识别人口调查中人口统计变量与薪水之间的关系。


