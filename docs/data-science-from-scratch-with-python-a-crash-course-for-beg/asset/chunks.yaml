- fmt: "\n# Chapter 7: Artificial Neural Networks\n\nMachine learning is a branch\
    \ of computer science that powers the rapid development of Artificial Intelligence.\
    \ Machine learning will study an algorithm and let machines recognize patterns,\
    \ develop models and generate videos and images via learning. Machine learning\
    \ algorithms can be created using different methods such as clustering, decision\
    \ trees, linear regression and many more.\n\n## Artificial Neural Network\n\n\
    Artificial Neural Network is propelled by biological models of brain and biological\
    \ neural networks. In brief, Artificial Neural Network (`ANN`) refers to a computational\
    \ representation of the human neural network, which alters human intelligence,\
    \ memory, and reasoning. \n\nBut, why should the human brain system develop effective\
    \ ML algorithms? The major principle behind `ANN` is that neural networks are\
    \ effective in advanced computations and hierarchical representation of knowledge.\
    \ Neurons are connected by dendrites and axons into complex neural networks that\
    \ can pass and exchange information as well as store intermediary computation\
    \ results. Therefore, a computational model of such systems can, therefore, be\
    \ effective in learning processes that resemble biological ones. The perception\
    \ algorithm created in 1957 was the trial to build a computational model of a\
    \ biological neural network. However, advanced neural networks that have multiple\
    \ layers, neurons and nodes became possible just recently. `ANNs` are the reason\
    \ for the recent success in computer vision and image recognition.\n\nNatural\
    \ Language Processing and other applications of Machine language seek to extract\
    \ complex patterns from data. Neural networks are very useful when one wants to\
    \ study nonlinear hypothesis that has a lot of features. Building a precise hypothesis\
    \ for a massive feature space may need one to have multiple high order polynomials\
    \ that would inevitably result in overfitting. This is a situation where a model\
    \ reveals random noise in data instead of the underlying patterns of relationships.\
    \ The issue with overfitting involves image recognition problems. Here, each pixel\
    \ represents a feature.\n\n## A simple neural network with a single neuron\n\n\
    The simplest neural network has a single ‘neuron’ as shown below.\n\n![](rsrc1H3.jpg)\n\
    \nBy applying a biological analogy, this neuron represents a computational unit\
    \ that assumes inputs through electrical inputs and transfers them using axons\
    \ to the next network output. In the above simple neural network, dendrites refer\
    \ to input features (`x1`, `X2`) and the output is the result of the hypothesis\
    \ (`hw,b(x)`). Apart from the input features, the input layer of the neural network\
    \ contains a bias unit that is equivalent to `1`. A bias unit is required to apply\
    \ a constant term in the function hypothesis. \n\nIn machine learning, the above\
    \ network contains a single input layer, a hidden layer, and one output layer.\
    \ To implement the learning process for this network, the input layer accepts\
    \ input features for every training sample and feeds it to the activation function,\
    \ which computers the hypothesis in the hidden layer. An activation function is\
    \ a logistic regression applied in classification. However, other options are\
    \ also possible. In the above case, a single neuron is similar to the input-output\
    \ mapping defined by logistic regression.\n\n![](rsrc1H4.jpg)\n\n## Multi-layered\
    \ neural network\n\nTo understand how the neural network operates, it is important\
    \ to formalize the model and explain it in a real-world scenario. The image below\
    \ represents a multilayer network that has three layers and various neurons. In\
    \ this case, just like a single-neuron network, there is one input layer that\
    \ has three inputs (`x1`, `x2`, `x3`) that has an added bias unit (`+1`). \n\n\
    The second network layer is a hidden layer that has three units represented by\
    \ activation functions. This is called a hidden layer because the values that\
    \ are computed in it aren’t observed. Basically, a neural network contains multiple\
    \ hidden layers that pass advanced computations and functions from surface layers\
    \ to the bottom of the neural network. The design of a neural network that has\
    \ a lot of hidden layers is constantly used in Deep Learning.\n\n![](rsrc1H5.jpg)\n\
    \nThe hidden layer 2 has three neurons (`a12`, `a22`, `a32`). Each neuron of a\
    \ hidden layer activates layer `j`. in this case; a unit `a1` activates the first\
    \ neuron of the second layer. Activation means that the value that is computed\
    \ by function `activation` in this layer is output by the same node to the next\
    \ layer. Layer 3 is the output layer that receives results from the hidden layer\
    \ and applies its own activation function. This layer calculates the final value\
    \ of the hypothesis. Next, the cycle continues until that point when the neural\
    \ network comes up with the model and weights, which best predict the values of\
    \ the training data.\n\n## Conclusion\n\nThank you for making it through to the\
    \ end of `Data Science from Scratch with Python`, let us hope it was educative\
    \ and able to provide you with all of the knowledge you need to achieve your objectives.\
    \ Data Science helps an individual predict and make decisions by taking advantage\
    \ of prescriptive analytics, machine learning, and predictive causal analytics.\
    \ The importance of data science can be summarized using the following points:\n\
    \n- **Prescriptive analytics**: If you require a model that has the intelligence\
    \ and capability to make its own decisions, then prescriptive analytics is the\
    \ best to use. This new field delivers advice, it doesn’t just predict, but it\
    \ also recommends different prescribed actions and related outcomes. The best\
    \ example to illustrate this is the Google self-driving car. Data that is collected\
    \ by the vehicle is used to train cars. You can further mine this data by using\
    \ algorithms to reveal intelligence. This will allow your car to make decisions\
    \ such as when to turn, which path to take, as well as when to speed up or slow\
    \ down.\n- **Machine learning for pattern discovery** - Let us say that you don’t\
    \ have resources that you can apply to make predictions, it will require you to\
    \ determine the hidden patterns in the data set to predict correctly. The most\
    \ popular algorithm applied in pattern discovery is `Clustering`. Assume that\
    \ you work in a telephone company and you want to determine a network by installing\
    \ towers in the region. Therefore, you may use the clustering technique to determine\
    \ the tower location that will make sure all users have the maximum signal strength.\n\
    - **Make predictions with machine learning** - If you desire to build a model\
    \ that can predict the future trend of a company, then machine learning algorithms\
    \ are the best to go with. This falls under supervised learning; it is called\
    \ supervised because data is already present that you can use to train machines.\n\
    - **Predictive causal analytics** - If you require a model that can help predict\
    \ chances of a given event happening in the future, you need to use predictive\
    \ causal analytics. This book discusses important concepts in data science such\
    \ as artificial neural networks, machine learning, decision trees, clustering,\
    \ big data analytics, applications of machine learning, and many more interesting\
    \ topics. Finally, if you found this book useful in any way, a review on Amazon\
    \ will be highly appreciated!\n"
