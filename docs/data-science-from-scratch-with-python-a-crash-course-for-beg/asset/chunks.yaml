- fmt: "\n# Design practices for plots with multiple variables\nA legend should be\
    \ available to describe each variable.\n\n## Bar Chart\nThe bar length encodes\
    \ the value. There are two variants of bar charts: vertical bar charts and horizontal\
    \ bar charts.\n\n### Uses\nWhile they are both used to compare numerical values\
    \ across categories, vertical bar charts are sometimes used to show a single variable\
    \ over time.\n\n### The dos and the don'ts of bar charts\n- Don't confuse vertical\
    \ bar charts with histograms. Bar charts compare different variables or categories,\
    \ while histograms show the distribution for a single variable. Histograms will\
    \ be discussed later in this chapter.\n- Another common mistake is to use bar\
    \ charts to show central tendencies among groups or categories. Use box plots\
    \ or violin plots to show statistical measures or distributions in these cases.\n\
    \n### Examples\nThe following diagram shows a vertical bar chart. Each bar shows\
    \ the marks out of 100 that five students obtained in a test: Figure: Vertical\
    \ bar chart using student test data ![](rsrc1G4.jpg)\n\nThe following diagram\
    \ shows a horizontal bar chart. Each bar shows the marks out of 100 that five\
    \ students obtained in a test: ![](rsrc1G5.jpg) Figure: Horizontal bar chart using\
    \ student test data\n\nThe following diagram compares movie ratings, giving two\
    \ different scores. The Tomatometer is the percentage of approved critics who\
    \ have given a positive review for the movie. The Audience Score is the percentage\
    \ of users who have given a score of 3.5 or higher out of 5. As we can see, The\
    \ Martian is the only movie with both a high Tomatometer score and Audience Score.\
    \ The Hobbit: An Unexpected Journey has a relatively high Audience Score compared\
    \ to the Tomatometer score, which might be due to a huge fan base: ![](rsrc1G6.jpg)\n\
    \n### Design practices\nThe axis corresponding to the numerical variable should\
    \ start at zero. Starting with another value might be misleading, as it makes\
    \ a small value difference look like a big one. Use horizontal labels, that is,\
    \ as long as the number of bars is small and the chart doesn't look too cluttered.\n\
    \n## Radar Chart\nRadar charts, also known as spiders or web charts, visualize\
    \ multiple variables with each variable plotted on its own axis, resulting in\
    \ a polygon. All axes are arranged radically, starting at the center with equal\
    \ distances between one another and have the same scale.\n\n### Uses\nRadar charts\
    \ are great for comparing multiple quantitative variables for a single group or\
    \ multiple groups. They are also useful to show which variables score high or\
    \ low within a dataset, making them ideal for visualizing performance.\n\n###\
    \ Examples\nThe following diagram shows a radar chart for a single variable. This\
    \ chart displays data about a student scoring marks in different subjects: ![](rsrc1G7.jpg)\
    \ Radar chart for one variable (student)\n\nThe following diagram shows a radar\
    \ chart for two variables/groups. Here, the chart explains the marks that were\
    \ scored by two students in different subjects: ![](rsrc1G8.jpg) Figure: Radar\
    \ chart for two variables (two students)\n\nThe following diagram shows a radar\
    \ chart for multiple variables/groups. Each chart displays data about a student's\
    \ performance in different subjects: ![](rsrc1G9.jpg) Figure: Radar chart with\
    \ faceting for multiple variables (multiple subjects)\n\n### Design practices\n\
    Try to display ten factors or fewer on one radar chart to make it easier to read.\
    \ Use faceting for multiple variables/groups, as shown in the preceding diagram,\
    \ to maintain clarity.\n\n### Activity: Employee Skill Comparison\nYou are given\
    \ scores of four employees (A, B, C, and D) for five attributes: Efficiency, Quality,\
    \ Commitment, Responsible Conduct, and Cooperation. Your task is to compare the\
    \ employees and their skills: Which charts are suitable for this task? You are\
    \ given the following bar and radar charts. List the advantages and disadvantages\
    \ of both charts. Which is the better chart for this task in your opinion and\
    \ why? ![](rsrc1GA.jpg) Figure: Employee skills comparison with a bar chart\n\n\
    The following figure shows a radar chart for employee skills:![](rsrc1GB.jpg)\
    \ Figure: Employee skills comparison with a radar chart\n\nWhat could be improved\
    \ in the respective visualizations?\n\n## Relation Plots\nRelation plots are perfectly\
    \ suited to show relationships among variables. A scatter plot visualizes the\
    \ correlation between two variables for one or multiple groups. Bubble plots can\
    \ be used to show relationships between three variables. The additional third\
    \ variable is represented by the dot size. Heatmaps are great for revealing patterns\
    \ or correlating between two qualitative variables. A correlogram is a perfect\
    \ visualization to show the correlation among multiple variables.\n\n## Scatter\
    \ Plots\nScatter plots show data points for two numerical variables, displaying\
    \ a variable on both axes.\n\n### Uses\nYou can detect whether a correlation (relationship)\
    \ exists between two variables. They allow you to plot the relationship between\
    \ multiple groups or categories using different colors. A bubble plot, which is\
    \ a variation of the scatter plot, is an excellent tool for visualizing the correlation\
    \ of a third variable.\n\n### Examples\nThe following diagram shows a scatter\
    \ plot of height and weight of persons belonging to a single group:![](rsrc1GC.jpg)\
    \ Figure: Scatter plot with a single variable (one group)\n\nThe following diagram\
    \ shows the same data as in the previous plot but differentiates between groups.\
    \ In this case, we have different groups: A, B, and C:![](rsrc1GD.jpg) Figure:\
    \ Scatter plot with multiple variables (three groups)\n\nThe following diagram\
    \ shows the correlation between body mass and the maximum longevity for various\
    \ animals grouped by their classes. There is a positive correlation between body\
    \ mass and maximum longevity.![](rsrc1GE.jpg) Figure: Correlation between body\
    \ mass and maximum longevity for animals\n\n### Design practices\nStart both axes\
    \ at zero to represent data accurately. Use contrasting colors for data points\
    \ and avoid using symbols for scatter plots with multiple groups or categories.\n\
    \n### Variants: scatter plots with marginal histograms\nIn addition to the scatter\
    \ plot, which visualizes the correlation between two numerical variables, you\
    \ can plot the marginal distribution for each variable in the form of histograms\
    \ to give better insight into how each variable is distributed.\n\n## Bubble Plot\n\
    A bubble plot extends a scatter plot by introducing a third numerical variable.\
    \ The value of the variable is represented by the size of the dots. The area of\
    \ the dots is proportional to the value. A legend is used to link the size of\
    \ the dot to an actual value.\n\n### Uses\nTo show a correlation between three\
    \ variables\n\n### Example\nThe following diagram shows a bubble plot that highlights\
    \ the relationship between heights and age of humans:![](rsrc1GG.jpg) Figure:\
    \ Bubble plot showing the relation between height and age\n\n### Design practices\n\
    - Design practices for the scatter plot are also applicable.\n- Don't use it for\
    \ large amounts of data since too many bubbles make the chart hard to read.\n\n\
    ## Correlogram\nA correlogram is a combination of scatter plots and histograms.\
    \ Histograms will be discussed later. A correlogram or correlation matrix visualizes\
    \ the relationship between each pair of numerical variables using a scatter plot.\
    \ The diagonals of the matrix represent the distribution of each variable in the\
    \ form of a histogram. You can also plot the relationship between multiple groups\
    \ or categories using different colors. A correlogram is a great chart for exploratory\
    \ data analysis to get a feeling for your data.\n\n### Examples\nThe following\
    \ diagram shows a correlogram for the height, weight, and age of humans. The diagonal\
    \ plots show a histogram for each variable. The off-diagonal elements show scatter\
    \ plots between variable pairs: The following diagram shows a correlogram with\
    \ data samples separated by color into different groups![](rsrc1GH.jpg) Figure:\
    \ Correlogram with multiple categories\n\n### Design practices\n- Start both axes\
    \ at zero to represent data accurately.\n- Use contrasting colors for data points\
    \ and avoid using symbols for scatter plots with multiple groups or categories.\n\
    \n## Heatmap\nA heatmap is a visualization where values contained in a matrix\
    \ are represented as colors or saturation. Heatmaps are great for visualizing\
    \ multivariate data where categorical variables are placed in the rows and columns\
    \ and a numerical or categorical variable is represented as colors.\n\n### Uses\n\
    It is great for finding patterns in your data\n\n### Examples\nThe following diagram\
    \ shows a heatmap for the most popular products on the Electronics page across\
    \ various e-commerce websites:![](rsrc1GJ.jpg) Figure: Heatmap for popular products\
    \ in the Electronics category\n\n### Variants: annotated heatmaps\nLet's see the\
    \ same example we saw previously in an annotated heatmap:![](rsrc1GK.jpg) Figure:\
    \ Annotated heatmap for popular products in the Electronics category\n\n### Activity:\
    \ Road Accidents Occurring over Two Decades\nYou are given a diagram that gives\
    \ information about the road accidents that occurred over the past two decades\
    \ during the months of January, April, and October. Identify the year during which\
    \ the number of road accidents was the least![](rsrc1GM.jpg) For the past decades,\
    \ identify the month for which accidents show a marked decrease Figure: Total\
    \ accidents over 20 years\n\n## Composition Plots\nComposition plots are ideal\
    \ if you think about something as a part of a whole. For static data, you can\
    \ use pie charts, stacked bar charts, or Venn diagrams. Pie charts or donut charts\
    \ help show proportions and percentages for groups. If you need an additional\
    \ dimension, stacked bar charts are great. Venn diagrams are the best way to visualize\
    \ overlapping groups, where each group is represented by a circle. For data that\
    \ changes over time, you can use either stacked bar charts or stacked area charts.\n\
    \n Pie Chart\nPie charts illustrate the numerical proportion by dividing a circle\
    \ into slices. Each arc length represents a proportion of a category. The full\
    \ circle equals 100%. For humans, it is easier to compare bars than arc lengths;\
    \ therefore, it is recommended to use bar charts or stacked bar charts most of\
    \ the time.\n\n### Uses\nCompare items that are part of a whole.\n\n### Examples\n\
    The following diagram shows a pie chart that shows different fielding positions\
    \ of the cricket ground, such as long on, long off, third man, and fine leg:![](rsrc1GN.jpg)\
    \ Figure: Pie chart showing fielding positions in a cricket ground\n\nThe following\
    \ diagram shows water usage around the world:![](rsrc1GP.jpg) Figure: Pie chart\
    \ for global water usage\n\n### Design practices\n- Arrange the slices according\
    \ to their size in increasing/decreasing order, either in a clockwise or anticlockwise\
    \ manner.\n- Make sure that every slice has a different color\n\n### Variants:\
    \ donut chart\nAn alternative to a pie chart is a donut chart. In contrast to\
    \ pie charts, it is easier to compare the size of slices, since the reader focuses\
    \ more on reading the length of the arcs instead of the area. Donut charts are\
    \ also more space-efficient because the center is cut out, so it can be used to\
    \ display information or further divide groups into sub-groups. The following\
    \ figure shows a basic donut chart:![](rsrc1GR.jpg) Figure: Donut chart\n\n# Matplotlib\n\
    Matplotlib is probably the most popular plotting library for Python. It is used\
    \ for data science and machine learning visualizations all around the world. John\
    \ Hunter began developing Matplotlib in 2003. It aimed to emulate the commands\
    \ of the MATLAB software, which was the scientific standard back then. Several\
    \ features, such as the global style of MATLAB, were introduced into Matplotlib\
    \ to make the transition to Matplotlib easier for MATLAB users. Before we start\
    \ working with Matplotlib to create our first visualizations, we will understand\
    \ and try to grasp the concepts behind the plots\n\n## Overview of Plots in Matplotlib\n\
    Plots in Matplotlib have a hierarchical structure that nests Python objects to\
    \ create a tree-like structure. Each plot is encapsulated in a `Figure` object.\
    \ This `Figure` is the top-level container of the visualization. It can have multiple\
    \ `axes`, which are basically individual plots inside this top-level container.\
    \ Going a level deeper, we again find Python objects that control axes, tick marks,\
    \ legend, title, textboxes, the grid, and many other objects. All of these objects\
    \ can be customized.\n\nThe two main components of a plot are as follows:\n- `Figure`:\
    \ The `Figure` is the outermost container and is used as a canvas to draw on.\
    \ It allows you to draw multiple plots within it. It only holds the `Axes` object\
    \ but also has the capability to configure.\n- `Axes`: The `Axes` is an actual\
    \ plot, or subplot, depending on whether you want to plot single or multiple visualizations.\n\
    \n### Pyplot\npyplot contains a simpler interface for creating visualizations,\
    \ which allows the users to plot the data without explicitly configuring the `Figure`\
    \ and `Axes` themselves. They are implicitly configured to achieve the desired\
    \ output. It is handy to use the alias `plt` to reference the imported sub-module,\
    \ as follows:\n```\nimport matplotlib.pyplot as plt\n```\n\n### Creating Figures\n\
    We use `plt.figure()` to create a new `Figure`. This function returns a `Figure`\
    \ instance, but is also passed to the backend. Every `Figure`-related command\
    \ that follows is applied to the current `Figure` and does not need to know the\
    \ `Figure instance`. By default, the `Figure` has a width of 6.4 inches and a\
    \ height of 4.8 inches with a `dpi` of 100. To change the default values of the\
    \ `Figure`, we can use the parameters `figsize` and `dpi`. The following code\
    \ snippet shows how we can manipulate a `Figure`:\n```\nplt.figure(figsize=(10,\
    \ 5))\nplt.figure(dpi=300)\n```\n\n### Closing Figures\nFigures that are not used\
    \ anymore should be closed by explicitly calling `plt.close()`, which also cleans\
    \ up memory. If nothing is specified, the current `Figure` will be closed. To\
    \ close a specific `Figure`, you can either provide a reference to a `Figure`\
    \ instance or provide the `Figure` number. To find the number of a figure object,\
    \ we can make use of the `number` attribute, like so: `plt.gcf().number`. By using\
    \ `plt.close('all')`, all Figures will be closed. The example shows how a `Figure`\
    \ can be created and closed:\n```\nplt.figure(num=10) # Create Figure with number\
    \ 10\nplt.close(10) # Close Figure with number 10\n```\n\n### Format Strings\n\
    Before we actually plot something, let's quickly discuss format strings. They\
    \ are a neat way to specify colors, marker types, and line styles. A format string\
    \ is specified as `[color][marker][line]`, where each item is optional. If the\
    \ color is the only argument of the format string, you can use any `matplotlib.colors`.\
    \ Matplotlib recognizes the following formats, among others:\n- RGB or RGBA float\
    \ tuples (e.g., `(0.2, 0.4, 0.3)` or `(0.2, 0.4, 0.3, 0.5)`)\n- RGB or RGBA hex\
    \ strings (e.g., `'#0F0F0F'` or `'#0F0F0F0F'`) The following diagram shows a color\
    \ wheel with RGB pixels of the colors:![](src1GT.jpg\n\n# CLUSTERING\nClustering\
    \ is the process of gathering entities with similar characteristics together.\
    \ This technique belongs to unsupervised machine learning, whose target is to\
    \ identify similarities in the data point and group the same data points together.\n\
    \n### Why apply Clustering\nBy grouping similar entities in one place allows one\
    \ to identify the attributes of different groups. In other words, this generates\
    \ insight into the underlying patterns of various groups. There are countless\
    \ application areas of grouping unlabeled data. For example, it is possible to\
    \ select different groups of customers and market every group differently to take\
    \ advantage of the revenue. Another example may include grouping documents together\
    \ that belong to similar topics. Additionally, clustering is used to reduce the\
    \ dimensionality of the data when you handle various copious variables.\n\n###\
    \ Types of Clustering\n#### a) Partitioned-based clustering\nThe phrase cluster\
    \ doesn’t have an accurate definition. A cluster describes a set of points whereby\
    \ any point in the cluster is close to any other point in the cluster than a point\
    \ absent in the cluster. Sometimes, a threshold is used to define all points in\
    \ a cluster close to one another.\n\n**K-mean Clustering**\n- It begins with `K`\
    \ as the input. This refers to the number of clusters that you want to find. Assign\
    \ `K`-centroids in random positions in your space.\n- Now, if you use the Euclidean\
    \ distance between data points and centroids, allocate each point to the cluster\
    \ close to it.\n- Recompute the cluster centers as mean of points allocated to\
    \ it.\n- Repeat 2 and 3 until there are no more changes. You might be wondering\
    \ how you can select the value of `K`. One method is the \"Elbow\" that is used\
    \ to define an optimal number of clusters. In this case, you'run the range of\
    \ `K` values and plot the \"percentage of variance explained,\" on Y-axis and\
    \ \"K\" on the \"X\" axis![](GU.jpg)In the diagram below, more clusters have been\
    \ added after 3. These additional clusters affect the display of the model.\n\n\
    #### b) Hierarchical clustering\nWith Hierarchical clustering, it begins by assigning\
    \ all data points to belong to its own cluster. Just as the name implies, it creates\
    \ a hierarchy and in the next step, integrates the two closest points and combines\
    \ it into a single cluster.\ni) Allocate every point to its cluster.\nii) Determine\
    \ the closest pair of cluster by applying the Euclidean distance and combine into\
    \ a single cluster.\niii) Determine the distance between nearest clusters and\
    \ integrate them until all items are grouped into a single cluster. In the next\
    \ method, you can choose the best number of clusters by identifying which lines\
    \ are cut by a horizontal line without affecting a cluster and deals with maximum\
    \ distance.![](GV.jpg\n\n#### c) Density-Based Clustering\nThe basic concept underlying\
    \ density-based technique is extracted from human perception. For example, if\
    \ you look at the images below, you should be able to see four clusters plus different\
    \ points of noise.![](GW.jpgAs shown in the above image, the clusters are dense\
    \ regions in the data space that are delineated by regions of lower density. In\
    \ short, the density of points in a cluster is somehow higher compared to the\
    \ density of points located outside the cluster. The density-based clustering\
    \ algorithm depends on intuitive perception of \"clusters\" and \"noise.\" The\
    \ point is that for every cluster, the neighborhood of a particular radius should\
    \ have at least minimum. The most important parameters needed for DBSCAN include\
    \ (`eps`) and minimum points (`MinPts`). The parameter `eps` determine the radius\
    \ of the neighborhood around a point. The parameter `MinPts` describes the minimum\
    \ number of neighbors in the `eps` radius. Any point that exists in the dataset\
    \ that has a count higher or equal to `MinPts` is identified as a core point.\n\
    \n# Customer Segmentation with Cluster Analysis\nThe customer base of a company\
    \ can have thousands, if millions, of different persons. Marketing to most of\
    \ these people presents a big problem because if you attempt to market to everybody,\
    \ the message can be ambiguous. However, building a marketing plan which attracts\
    \ every individual is not normal.\n\n### Why customer segments are important\n\
    Customer segments will make you understand the patterns which distinguish your\
    \ customers. Below are some important ideas you can achieve with segmentation\
    \ analysis:\n- Enhanced understanding of customer needs and wants. This can lead\
    \ to improved sales and customer satisfaction.\n- Create products that appeal\
    \ to different customer segments.\n- Companies cannot fulfill all possible customers\
    \ all the time. By applying the segmentation procedure, companies have the ability\
    \ to concentrate on those segments they examine to be the best attractions for\
    \ their products.\n\n### How to Segment\nSegmentation doesn’t need to be very\
    \ complex. For a small organization or company, it can be about discovering that\
    \ you have two or three unique customer types who have different needs. Some popular\
    \ methods used to segment customers consist of:\n- Demographic\n- Behavioral\n\
    - Psychographic\n- Geographic\n\nThere are different ways that you can apply when\
    \ it comes to segmentation of a market. One of the methods that are accurate and\
    \ statistically valid is the application of cluster analysis.\n\n# Data Science\
    \ as a Change Agent\nData Science is a change agent. Even though it has not been\
    \ realized yet, this should be the perfect time for organizations to be ready.\
    \ Companies that plan to change in the next couple of years should position themselves\
    \ by gathering the correct data and investing in analytics capacity. The main\
    \ thing to consider while building a predictive model is to establish what it\
    \ is that you want to predict and gather massive data sets that will permit you\
    \ to do so. Even though it is still far to realize the change in management by\
    \ applying predictive models, organizations can still remain on the right path\
    \ by adopting the right tools and collecting accurate data.\n\n### Use Digital\
    \ Engagement\nThere are always new systems created to allow organizations to collect\
    \ real-time feedback from employees. As per now, organizations can take advantage\
    \ of these tools and enhance their services. Most of these tools have been developed\
    \ and installed with more functionality to reveal more information about what\
    \ employees think every time. These tools provide a relevant change to the management.\
    \ By working with large locations, it helps create a system for real-time feedback.\
    \ This implies that one has to learn in days instead of weeks.\n\n### Social Media\
    \ Analytics\nManagers of change have another option to see past limits. Customers\
    \ and supplies are major stakeholders in change programs. They have a likely chance\
    \ to participate in social media and comment about changes. Advances in linguistic\
    \ analysis imply that one can detect clues linked to actions and behavior from\
    \ words people use. Besides that, use of certain phrases and pronouns can help\
    \ individual.\n\n### How data is important in change\nFor many years, companies\
    \ relied on data-driven techniques to select candidates fit for senior roles.\
    \ Nowadays, retail businesses have also adopted predictive analytics to hire employees.\
    \ As a result, these tools have improved the performance of a project and helped\
    \ develop a new dataset.\n\n### Recording data related to change\nYou will discover\
    \ that most organizations focus so much on measuring shifts in inventory, operational\
    \ performance, and manufacturing efficiency. However, issues dealing with change\
    \ have low performance. Even if projects have unique characteristics, there are\
    \ many similarities when it comes to changing a system and reorganizing projects.\n\
    \n### Creation of a dashboard\nEach organization is imagined to have a bespoke\
    \ dashboard, created together with the firm’s leadership team. This reflects the\
    \ priorities of the organization, future plan, and competitive position. By doing\
    \ this way, dashboards generate significant insights about a transformation investment\
    \ created by the organization. Most data that contributes to these signs are already\
    \ available but not collected. There are clients of logic that have developed\
    \ a dashboard to identify attrition and recruitment in a must-win talent. This\
    \ is not hard, but it helps enlighten the managerial team on how to use data to\
    \ make intuitive decisions. While it might take some time for such tools to be\
    \ created, organizations need to begin to create dashboards, if possible, they\
    \ should automate them. Computerizing the dashboards makes it objective and transparent.\n\
    \nWhile companies gather data and use data scientists to build accurate models,\
    \ all managers of change must be confident to call data scientists to come and\
    \ interpret procedures that allow firms to meet their goals. The creation of metrics\
    \ can’t be easy because metrics aren’t one-and-done installations. Instead, it\
    \ is a commitment cycle to capture data, refine dashboards and create models.\
    \ To develop a dependable dataset, it takes time. Data quality is a critical problem\
    \ that also calls for the presence of a shared data language that will make organizations\
    \ realize they are measuring the correct thing. This has been one of the major\
    \ issues for data analytics in other fields. Even if it might end up taking a\
    \ lot of time, it will finally end the causal loop and produce a reliable prediction\
    \ about how an action can alter a given metric. This will increase investment\
    \ and change from a action to another data-informed perception. Change management\
    \ helps shift a struggling project and recommends significant business results\
    \ and how you can realize them.\n\n# Innovation Mindset\nWhile organizations continue\
    \ to shift to digital transformation methods, more teams that are knowledgeable\
    \ about Data Science are being formed. So far, the major challenge for Chief Data\
    \ Scientists involves positioning the Data Science function properly where a given\
    \ organization's need is to increase its current and future activities. This means\
    \ there is a need to recruit Data Science teams to completely interact with the\
    \ business and adopt the operational backbone of the firm. Data Science has no\
    \ formal description. Its goal is to understand and analyze actual phenomena using\
    \ data. This can highly vary from one industry to another. However, with experiences\
    \ from both worlds, one can define Data Science as an integration of skills in\
    \ programming, mathematics, and communication with the application of scientific\
    \ methods to a particular domain of knowledge. This practice can be summarized\
    \ into different strategies:\n- Skillsets: This requires an individual to measure\
    \ the readiness of analytics, talent management, spreading evidence-based culture\
    \ and application of Data Science processes.\n- Datasets: This often covers data\
    \ governance, infrastructures, and strategic data sources.\n- Toolsets: This deals\
    \ with the selection of the right Data Science tools and the use of the best practices\
    \ in the company or firm.\n"
