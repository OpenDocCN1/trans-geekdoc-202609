    # 第 6 章：大数据分析与数据科学


    无论你是准备增强供应链、监控车间运营、衡量消费者情绪还是处理任何大规模分析问题，大数据都对企业产生了巨大影响。企业产生的业务数据规模每年都在大幅增长，各种类型的信息都以数字格式存储。最大的挑战之一在于学习如何处理新的数据类型，并发现能为业务提供价值的信息类型。这不仅关乎你如何访问新数据源，元素和模式之间的相互关系也同样重要。快速收集不同类型的数据并不能产生价值。你必须利用分析来发现支持业务的洞察。大数据并没有创造新的存储机制和新的数据类型，但它开发了新的分析方法。本章将定义大数据分析，回顾人们分析大数据以开发模式和关系的不同方法。此外，你将学习如何从海量信息中做出明预测并推导出业务洞察。需要注意的是，大数据并不是一组独立的活动。因此，你需要一套凝聚性的解决方案来帮助进行大数据分析、收集数据并发现新洞察，以帮助频繁决策。大多数组织通过应用商业组件和开源组件来完成任务。构建集成的大数据分析架构可以使人们执行不同类型的活动，并在组件之间传输数据。


    ## 大数据为何重要？


    大数据描述的是规模超过了数据库软件工具（如存储、捕获和分析）正常功能的数据集。它指的是规模巨大且复杂的数据集，以至于无法使用简单的数据库管理工具进行处理。


    ### 大数据分析


    “大数据分析”（Big Data analytics）一词在当今市场被广泛使用。在大多数情况下，它与数据挖掘和商业智能等其他相关概念一起使用。虽然这些术语都是指的是如何分析数据，但当多个交易、数据量和数据源变得巨大且复杂时，大数据就不一样了。在这种情况下，需要特定的方法和技术从数据中提取洞察。这引出了大数据的通用定义，包括三个
    V：速度（Velocity）、多样性（Variety）和数量（Volume）。


    *   **数量 (Volume)**：指的是大型数据集。

    *   **多样性 (Variety)**：描述来自不同数据源的数据。数据可能来自外部和内部数据源。最重要的是，数据可以是任何格式。它可以是日志数据，甚至是来自数据库表的结构化数据，以及如
    `XML` 等半结构化数据。

    *   **速度 (Velocity)**：描述来自交易的大规模数据，其特征是数据流具有更高的刷新率、速度和时间。


    根据上述描述，大数据可以被视为一个高速度、高数量和高性的性的库，需要成本效益且创新的信息处理手段。这一过程导致洞察力的提高、更好的决策以及流程自动化的改进。到目前为止显而易见，大数据不仅关乎数据量有多大，数据还应该快速以复杂的的形式到达。此外，它应该来自不同的来源。最重要的是，要强调尝试定义构成大数据的元素可能具有巨大价值。每个人应该知道，今天的大数据可能与明天的大数据不同，因为技术在不断变化。简而言之，它是相对的。


    ## 我们所说的数据类型


    组织具有捕获交易数据的传统。此外，组织还从其运行环境中快速捕并存储额外数据。示例包括：


    *   **文本数据 (Text data)**：这是最大且最流行的大数据类型之一。目标是从文本中开发主要事实，并将这些事实作为剩余分析过程的输入。

    *   **网络数据 (Web data)**：可以捕获网络用户的数据，如搜索、阅读、页面浏览、购买。这可以用于改进流失建模、定向广告和客户细分等领域的性能。

    *   **智能电网和传感器数据 (Smart grid and sensor data)**：如今，从油管、汽车和风力涡轮记录传感器数据。这些数据以极高的频率收集。传感器数据产生与机械和引擎性能相关的深度信息。它有助于诊断问题并更快地开发缓解机制。

    *   **时间和位置数据 (Time and location data)**：`GPS`、`WI-FI` 连接和手机使得时间和位置成为良好的数据源。因此，大多数组织已经理解了监控客户移动的重要性。组织接受了在任何给定时间客户所在地的需求。另一个重点是能够在聚合级别查看时间和位置数据。虽然更多个人继续开放他们的位置数据和时间，但许多良好的应用随之产生。因此，时间和位置数据成为最隐私敏感的大数据类型之一，必须谨慎对待。

    *   **社交网络数据 (Social network data)**：在 `Facebook`、`Instagram` 和 `LinkedIn` 等社交网站内部，人们可以进行链路分析并发现给定用户的网络。社交网络分析可以提供关于什么样的广告吸引用户的洞察。这是通过考虑客户的兴趣及其朋友圈实现的。拥有许多此类大数据源，优势不在于数据源类型，而在于它与其他数据源结合时能产生的价值。这种组合是非常重要的。


    ## 不同的洞察类型


    除了数据，还有根据分析重点而不同的“范式转移”（paradigm shift）。指的是从描述性分析向预测性和规范性分析的转变。当涉及描述性分析时，它试图回答关于过去发生了什么的问题。通常，这都是关于报告报告的。以下是描述性分析处理的问题示例：


    *   哪个客户或产品最有利润？

    *   第一季度产生了多少销售额？

    *   在上半年我们损失了多少客户？


    预测性分析（Predictive analytics）关注未来可能发生的事情。这非常困难，涉及未来的趋势和模式。示例包括：


    *   下季度大约有多少？

    *   对客户最好的建议是什么？

    *   哪些客户可能会流失？


    规范性分析（Prescriptive analysis）试图回答与“我如何处理这些”相关的问题。这是分析变得业务化和依赖的这一点。随着大数据的到来，现在可以：


    1. 推导出前瞻洞察。

    2. 增加对快速和可执行洞察的需求。


    前瞻洞察（Forward-looking insight）意味着业务有了预测可能发生的事情的能力。传统上这是可能的，但准确性受限。因此，大数据改变了方程式。例如，推荐系统可以自动生成个性化推荐，因为某人想要购买。


    数据的业务价值（Business value of data）


    大数据对任何业务都带来了巨大的收益。它帮助从数据中得出洞察，做出智能决策并自动化决策。在详细层，每个大数据解决方案都解决一个特定问题。在开发分析时，应该从收集数据或选择正确的工具开始。


    ### 新网页：可视化、语义和 API（New Web: Visual, Semantic and API）


    自从引入新网页以来，网页发生了今天变得更加可视化。在网页上上传照片只需点击一下，但在 20 年前不是这样的。如果你能回到 1990 年并思考计算机和互联网，就会意识到为了改进技术付出了多少努力。


    ### 链接数据和语义（Linked Data and Semantic Web）


    不仅数据规模增加了，网页还继续减少数据孤岛。大多数数据集无法很容易相互连接。然而，重大步骤已经实现。网页继续变为语义。链接数据指的是共享、暴露和整合数据的实践。计算设备和人类在数据连接时同时都获益。这通常通过统一资源标识符（`uniform
    resource identifiers`）和描述框架（`Resource Description Framework`）等技术完成。


    ### 访问数据的便利（Ease of accessing data）


    是的，数据比你想象的得多，大多数组织的数据管理工具从未如此良好。在互联网时代之前，许多组织从不同的数据库、系统和数据仓库传输数据。数据库专家和管理员创建了脚本和存储过程来自动化这些过程。批处理过程运行得很早。


    ### 云端的更好效率（Better efficiency in the clouds）


    事实上，云对全球许多组织产生了巨大影响。网页的历史从大型机时代开始，到了客户端-服务器时代，现在我们处于移动云计算时代。从一个时代移动另一个时代需要大量的开发和努力。这不是一夜之间发生的。大数据的黎明为组织增强运营创造了许多机会。结果是商业智能解决方案和统计包有了巨大的改进。


    ### 测量水平（Level of measurement）


    决策树能够适应定量和定性数据。定量数据包括重量和高度，它描述可以使用减法、乘法和加法修改的数量。另一方面，定性数据可能包括性别，不能应用于算术运算，但在决策树中呈现。其他类型的数据，如鞋码，既可能是定量的也是定性的。例如，你可能无法对鞋码执行有意义的算术，尽管鞋码的数字是有序的。


    ### 数据科学使用的工具（Tools Used in Data Science）


    有很多大数据工具可以用于分析。简单来说，数据分析被定义为对数据进行检查、清洗、转换和建模的过程，目的是发现重要信息、结论并建议正确的决策。本章将概述数据科学家在清洗、建模、转换和分析数据过程中使用的工具。


    ### 开源数据（Open Source Data Tools）


    a) **OpenRefine**：以前被称为 Google Refine。它是处理杂乱数据的工具。该工具让数据科学家清洗并更改数据格式。此外，数据科学家可以决定将数据与外部数据集成。工具帮助个人进行大规模数据探索并轻松发现数据中的模式。


    b) **Orange**：一种开源数据可视化和分析工具，旨在供非数据科学家使用。它具有简单的交互式工作流和高级工具箱，帮助人们构建分析和可视化数据的交互式工作流。然而，Orange
    创建的可视化类型与散点图、柱状图和树图不同。


    c) **Knime**：`KNIME` 是另一个用于数据分析的开源解决方案。该工具允许个人探索和发现数据中的隐藏洞察。该工具拥有超过 1000 个模块和数百个示例，人们可以运行它们学习如何使用。此外，还有任何数据科学家可以使用高级集成工具。


    d) **R 语言编程**：这被认为是编程语言中的标准工具。一些人认为它是数据科学的“黄金小子”。`R` 也是开源软件，任何人都可以安装、使用、升级、修改和克隆。它兼容
    `Windows`、`macOS` 和 `UNIX`。它是一种高性能语言，将帮助用户处理大量数据。


    e) **RapidMiner**：与 `KNIME` 类似，`RapidMiner` 是另一种用于数据分析的开源解决方案。它专注于建模、分析和数据处理。


    f) **Pentaho**：处理来自不同来源的数据并进行可视化。该平台支持机器学习、模型部署和报告。它处理了数据混合问题。


    g) **Weka**：另一种设计用于机器学习任务并使用算法的开源软件。`Weka` 的图形界面简单易用。它完全用 `JAVA` 实现。任何人都可以调用它。


    h) **NodeXL**：一种可视化和分析工具，显示数据集中的关系。它是开源软件，监控所有社交媒体和主流新闻以通过趋势发现重要洞察。通过 `NodeXL`
    可以实现自动化。


    i) **Gephi**：用 `Java` 语言编写，`Gephi` 作为开源可视化和分析工具出现。它允许处理数据集中的网络。


    j) **Talend**：领先的集成提供商，数据驱动企业。它允许从任何地方连接并交互数据。


    k) **Datawrapper**：一种在线可视化软件，可以构建交互式图表。用户可以上传 `CSV`、`Excel` 或 `PDF` 文件，`Datawrapper`
    生成图表和折线图。


    l) **Tableau Public**：该工具以非常优雅的方式使可视化民主化。它是一个强大的工具，帮助从数据中得出业务洞察。`Tableau` 允许数据科学家在进入复杂过程之前探索数据。


    m) **Infogram**：拥有超过 35 种交互式图表和 500 多种地图，以最美的方式可视化数据。它创建词云、饼图和条形图。`Infogram` 捕捉观众的注意力。


    n) **Google Fusion Tables**：这是最有趣的按需解决方案之一。当你有一个想要可视化和映射的大数据集时，可以使用它。通过强大的映射软件，`Google`
    在创建工具方面起着重要作用。


    o) **Solver**：支持有效的财务报告、预算和分析。它的按钮可以让任何人访问并交互数据，为公司产生更多利润。


    p) **OpenText**：这是一个分类分类引擎，用于识别文本内容中的表达式和模式。分析发生在文档、句子和主题级别。


    q) **Tracker**：一种自动化情感分析软件，突出特定的关键词。它监控所有社交媒体和主流新闻以通过趋势发现重要洞察。


    r) **Opinion Crawl**：另一种用于分析最新新闻、产品和公司的在线情感分析软件。它让每个访问者访问特定主题的情感。任何人都可以参与并接收即时评估。对于每个主题，都有饼图来显示最新的实时情感和新闻标题。此外，还有不同的缩略图和云标签，公众可以轻松关联。该工具允许人们看到以积极或负面方式影响的事件。为了创建一个全面的分析，爬虫搜索常见主题上发布的最新内容和公共问题。


    ### 数据提取工具（Data Extraction Tools）


    s) **Content Grabber**：一种为企业设计的工具。该工具具有从任何网站挖掘内容并将其保存为结构化格式的功能。由 `CSV`、`XML` 和
    `Excel` 报告。它是编程专家最好的工具，因为它有脚本和编辑模块。此外，用户仍然可以使用 `C#`, `VB.NET` 来调试和编写脚本。


    t) **IBM Cognos Analytics**：在该工具开发之前，使用的是 `Cognos Business Intelligence`。它设计有基于网络的界面以支持
    BI 产品中的数据可视化。它具有数据治理、自助分析和管理模块。该工具还支持从不同源集成数据。


    u) **Sage**：一个支持中小企业的会计平台。它允许发票和账单。此外，如果你需要，这可能是正确的工具。


    v) **Gawk**：`GNU` `Gawk` 是一种编程语言。它帮助用户通过编写几行代码处理简单的数据重格式。它具有以下主要特征：

    *   它是数据驱动的，而不是过程的。

    *   便于人们读写。


    w) **GraphLab**：数据科学家和开发者都使用该工具利用机器学习构建领先产品。它具有：

    *   将自动特征工程、机器学习和模型选择集成到应用程序中。

    *   识别并链接内部及跨的记录。

    *   简化了机器模型的开发。


    x) **Netlink Business Analytics**：这是最全面的按需解决方案之一。你可以通过网络浏览器或任何设备访问它，并将其应用于整个企业。大部分功能针对销售和复杂的分析能力定制。


    y) **Apache Spark**：该工具设计为在内存中实时运行。因此，它促进了更快的实时分析。


    ## 五大数据分析工具和技术（Top 5 Data Analytics Tools and Techniques）


    a) **可视化分析 (Visual analytics)**：有很多大数据工具可以用于分析。例如，通过构建图表发现独特之处。这种方法包含其他方法，如人类交互、数据分析和可视化。


    b) **业务实验 (Business Experiment)**：`AB 测试`、业务实验，其实验设计包含了用于验证有效性的技术。


    c) **回归分析 (Regression analysis)**：这种方法允许你识别两个不同变量之间的关系。


    d) **相关性分析 (Correlation analysis)**：这是一种统计技术，将让你识别两个不同变量之间是否存在关系。当你怀疑两个变量之间存在特殊关系时，这种方法是完美的。


    e) **时间序列分析 (Time series analysis)**：在这里，数据在均匀的时间间隔内收集。当你想要识别变化并预测未来事件时，可以使用它，这取决于过去过的事情。


