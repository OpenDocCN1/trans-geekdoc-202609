- fmt: '

    An underappreciated security notion: an encryption scheme is nonmalleable if an
    attacker cannot turn a ciphertext `Enc(*K*, *M*)` into another valid ciphertext
    `Enc(*K*, *f*(*M))` for some specified function `f()`. A nonmalleable scheme is
    therefore more secure than a malleable one. In the chosen-ciphertext model, nonmalleability
    is equivalent to indistinguishability (the strongest security notion).


    ## Manger attack


    A padding oracle attack on RSA encryption in OAEP mode. The `Manger` attack is
    less well known than the `Bleichenbacher` attack on older RSA encryption, because
    it’s generally harder to exploit. Indeed, as `Manger`’s original paper noted,
    the `PKCS` standard already described a partial mitigation against his attack
    when saying that “it is important that the error messages output in steps 4 [integer-to-octets
    conversion] and 5 [OAEP decoding] be the same.” But as with `Bleichenbacher`’s
    attack, `Manger`’s attack also works if the attacker exploits timing leaks instead
    of error messages.


    ## Man-in-the-middle


    A class of attacks where the attacker surreptitiously captures and modifies traffic
    from two or more correspondents. The `FREAK` (Factoring RSA Export Keys) attack
    on `TLS` implementations is an example of a man-in-the-middle attack in which
    the attacker modifies session initiation-tion data to force the use of a weak
    cipher suite.


    A See *Meet-in-the-middle*.


    ## MASH (Modular Arithmetic Secure Hash)


    An early attempt at a hash function relying on the same operations as `RSA`.


    A See *VSH (Very Smooth Hash)*.


    ## McEliece encryption scheme


    A See *Code-based cryptography*.


    ## MD4


    Hash function even weaker than `MD5`.


    ## MD5


    Previously a synonym of *checksum* and *hash function*, now a sign of poor cryptography
    design because it isn’t collision resistant. But `MD5` is still secure against
    preimage attacks.


    ## MDC (Message Digest Cipher)


    Old-fashioned name for hash functions.


    ## MDC-2 (Modification Detection Code 2)


    A construction that turns an *n*-bit block cipher into a hash function with 2
    *n*-bit output. The resulting hash is less secure than an ideal 2 *n*-bit hash
    but more secure than an *n*-bit hash. `MDC-2` was mainly used with `DES` as `MDC-2DES`
    except when `IBM`’s patent was a concern.


    ## Meet-in-the-middle


    A folklore cryptanalysis technique mainly known for its application in attacking
    symmetric primitives. A meet-in-the-middle is applicable when consecutive encryption
    layers (also called *rounds* or *cipher* instances) work with independent keys.
    For example, when encrypting a message *M* as *C = Enc2(*K* 2, Enc1(*K* 1, *M*))*
    with two *n*-bit keys *K* 1 and *K* 2 and two distinct ciphers `Enc1` and `Enc2`,
    you might expect a security of *M*^{2n} bits (as if it were equivalent to encrypting
    with a 2 *n*-bit key). But the actual security is closer to *n* bits: the reason
    is that, given a pair (*C*, *M*) `Meet-in-the-middle`, you can compute `X = Dec2(*K*,
    *C*)` for all the 2 *n* values of `K`, and then compute `Y = Enc1(*K*'', *M*)`
    for all 2 *n* values of `K''`. The pair (*K*'', *K*) for which `X = Y` is then
    likely to be (*K* 1, *K* 2).


    You can view this trick as one instance of a more general optimization technique
    found in many cryptanalytic attacks. Those attacks include the baby-step giant-step
    algorithm (to compute discrete logarithms), the `GHS` isogeny-based attack on
    `ECDLP`, or attacks on isogeny-based schemes.


    A See *Man-in-the-middle*.


    ## Merkle puzzle


    The closest thing to public-key cryptography before (secure) public-key cryptography
    was invented.


    ## Merkle tree


    A solution to many problems in cryptography and computing. Essentially, a hash
    tree. It can, for example, be used to demonstrate the knowledge of some large
    set of data in a compact and efficient way: you can prove that a piece of data
    is in the tree by showing the list of nodes required to compute the root node
    from the said data’s node (usually a leaf). This list of values has been called
    the *authentication path*, *inclusion proof*, and *Merkle proof*.


    Merkle trees are the main components of hash-based signatures.


    ## Merkle–Damgård construction


    A straightforward technique for hashing messages of any length when using a hash
    function that hashes only short messages. It does this in such a way that, if
    the short-length hash is secure, the resulting hash of any length is secure as
    well. This is one of the earliest security proofs in symmetric cryptography. But
    this proof is only about collision resistance and preimage resistance, not about
    security in the most absolute sense. For example, Merkle–Damgård hash functions,
    such as `SHA-256`, are vulnerable to length extension attacks.


    ## Mersenne twister


    Not a cryptographic pseudorandom generator.


    ## Message franking


    A protocol to allow the reporting of abusive messages in an end-to-end encryption
    conversation while maintaining an acceptable level of security. Motivated by `Facebook`’s
    problem of deploying end-to-end encryption.


    ## Miller–Rabin


    The most common probabilistic primality test. Under certain conditions, you can
    fool the test into declaring a composite number is prime.


    ## *PRIMES*


    ## MINERVA


    A See *Crypto*.


    ## Mining


    Hashing for money.


    ## Misuse resistance


    Defense-in-depth applied to cryptography. Misuse resistance counters the fact
    that some ciphers, such as `AES-GCM`, are secure only if you never call them twice
    with the same nonce. Misuse-resistant ciphers attempt to eliminate this problem.
    Their only limitation is that if you encrypt the same message twice, the output
    will be the same. `SIV-AES` is an example of such a cipher.


    Misuse resistance can extend to cases other than symmetric *M* encryption.


    ## THEOREM: REPEATING NONCE IS INSECURE


    In the case of `AES-GCM`, reusing a nonce allows an attacker to learn the XOR
    difference between the two plaintext messages, even if they don’t know either
    of the messages. Proof: `AES-GCM` encrypts a message by using the CTR mode, which,
    given a key and a nonce, generates a pseudorandom sequence, called the *keystream*,
    XORed to the message. So if you generate the keystream `S` and create the ciphertext
    `C 1 = M 1 ⊕ S` from the message `M 1` by reusing the same key and nonce, you’ll
    also use the same `S` to encrypt a second message `M 2` to `C 2 = M 2 ⊕ S`. In
    that case, an attacker can compute `C 1 ⊕ C 2 = M 1 ⊕ M 2`. This is bad. QED.


    ## Mixnet


    A multi-party protocol that provides anonymity by shuffling a sequence of ciphertexts
    *C* 1, . . .* , *Cn* into another sequence *C''* 1, . . .* , *Cn*, so that for
    each *Ci* there exists a *C''j* whose value is distinct but decrypts to the same
    plaintext. The protocol might also include a zero-knowledge proof that shows that
    the criterion is satisfied without leaking any information about the permutation
    or plaintexts.


    ## MIXNETS IN PRACTICE


    Most often, mixnets are used to route data in anonymous communication networks.
    Here, an observer shouldn’t be able to associate a post-mix value *C''i* to its
    pre-mix counterpart *Cj*. After one or more rounds of mixing, this prevents an
    attacker from associating a message’s source with its final recipient.

