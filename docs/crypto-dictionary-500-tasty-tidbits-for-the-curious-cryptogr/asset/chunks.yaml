- fmt: '

    Today, stream ciphers are no longer a niche market, and many of the encryption
    modes used in modern applications are technically stream ciphers because they
    run in `CTR` mode.


    ### STREAM CIPHER MODES

    Historical y, stream ciphers could have two modes:


    - Synchronous, also known as autonomous or key auto key (`KAK`). The more wel-known
    mode whereby a pseudorandom keystream is generated and XORed to the message.

    - Self-synchronizing, also known as autoclave or ciphertext auto key (`CTAK`),
    where the output depends on the message encryption.


    ### Substitution-permutation network (SPN)

    Construction of permutations, as used in block ciphers and hash functions, in
    which a round includes two layers:


    - Substitution, typically via `S-boxes`, to transform chunks of blocks into other
    chunks in a nonlinear manner (that is, with a complex input–output relation).
    This strong but very local transformation is sometimes said to bring `confusion`.


    Substitution-permutation network (SPN) **123**


    - Permutation, typically via shuffling of bits or a matrix operation to make sure
    that each output bit will eventually depend on all input bits. This is weak, but
    block-wise transformation is said to provide `diffusion`.


    In an SPN, these two layers are complementary, and this separation of duties often
    simplifies the analysis of the cipher and the calculation of bounds on the success
    rate of certain attack techniques. `AES`, `Serpent`, and `PRESENT` are examples
    of SPNs.


    ### Suck

    As defined by cryptographer Matthew Green: “In cryptography `suck` is a purely
    technical term meaning `slow`, `complex`, and `probably insecure`.”


    ### Sugar beet auctions

    For many years, the only known real-world application of multi-party computation
    (`MPC`). Sugar beet auctions occurred in Denmark in 2008 with the support of Aarhus
    University researchers. They were described in detail in the paper “Secure Multiparty
    Computation Goes Live” and cited in numerous other papers as evidence that `MPC`
    isn’t useless. Thanks to blockchain protocols, there are now many more `MPC` applications.


    ### Suite A

    The NSA’s suite of classified cryptographic algorithms and techniques.


    `Suite A` is used, for example, in military secure communication devices. It’s
    not available to the public. A See `NSA (National Security Agency)`.


    ### A PEEK INTO SUITE A

    `Suite A` seems to include a number of interesting ciphers, such as the following:
    `BATON`, a block cipher developed by the NSA around 1995. It has a 128-bit-long
    block and a key of 320 bits, 160 of which are checksum bits (which means that
    `BATON`’s key only has 160 secret bits). `BATON` is supported by the `PKCS#11`
    cryptography interface standard; thus `BATON`’s parameters and supported modes
    are publicly documented. These modes include an undocumented `SHUFFLE` mode as
    well as a key wrapping mode. `BATON` is one of the fastest NSA ciphers.


    #### **124** Suck

    - `SAVILLE`, a stream cipher developed by the NSA jointly with the British `GCHQ`
    in the late 1960s. It was used notably in encryption devices during the Vietnam
    War. `SAVILLE` is based on a nonlinear feedback shift register and uses a 128-bit
    key whose last eight bits are a checksum of the first 120 bits. `SAVILLE` has
    the interesting property of being able to run in synchronous or self-synchronizing
    mode.


    `Suite A` also includes algorithms such as `ACCORDION`, `CRAYON`, `JUNIPER`, and
    `PHALANX`.


    ### SUPERCOP

    System for Unified Performance Evaluation Related to Cryptographic Operations
    and Primitives. It’s a successor of `BATMAN` and `eBASH`.


    #### S

    `SUPERCOP` estimates the optimal speed of an algorithm by trying out many different
    implementations of it. It also compiles each implementation with many different
    compiler options and then runs the compiled program multiple times to reliably
    measure its execution time. As of May 2020, `SUPERCOP` has benchmarked more than
    1,000 different algorithms and more than 2,800 implementations of them, as well
    as multiple compilers and compiler options.


    In terms of CPU usage, running `SUPERCOP` is to cryptography implementers what
    Bitcoin mining is to cryptocurrency people.


    ### Superpolynomial complexity

    Practically impossible complexity, according to Cobham’s thesis (and empirical
    observation).


    ### SVP (shortest vector problem)

    The main computational problem in lattice-based cryptography. `SVP` involves finding
    a combination of multidimensional vectors whose length (with respect to a given
    norm) is the smallest.


    Many lattice-based cryptosystems indirectly leverage the worst-case hardness of
    an `SVP`-like problem, such as `GapSVP`, due to results relating the learning
    with errors (`LWE`) problem to `SVP` problems.


    ### Symmetric-key cryptography

    The oldest form of post-quantum cryptography.


    Symmetric-key cryptography **125**


    ### T

    ### TCC

    The Theory of Cryptography Conference “focuses on paradigms, approaches, and techniques
    used to conceptualize, define, and provide solutions to natural cryptographic
    problems.”


    `TCC` indeed covers both theoretical cryptography—an intellectually interesting
    topic but of low practical relevance, for example, when concerned with concepts
    such as quantum random oracles—and the theoretical aspects of applied cryptography,
    where fundamental results can be of high practical interest.


    Researchers present peer-reviewed research papers with titles such as “Obfuscated
    Fuzzy Hamming Distance and Conjunctions from Subset Product Problems” and “Fully
    Homomorphic NIZK and NIWI Proofs.”


    A See `Asiacrypt`, `CHES`, `CRYPTO`, `Eurocrypt`, `FSE`, `PKC`, `Real World Crypto`.


    ### Test vectors

    Alas, often the only tests found in cryptosystems’ implementations.


    ### Threefish

    The third member of Blowfish family but very different from `Blowfish` and `Twofish`.
    It has no Feistel network, no MDS matrices, no S-box, but just an ARX construction
    allegedly inspired by `ChaCha` and later inspired `SipHash`.


    ### Threshold encryption

    Strictly speaking, doesn’t exist. But threshold decryption does exist. It’s where
    the decryption key is threshold-shared among `N` parties, `t ≤ N` of which must
    collaborate to decrypt a ciphertext.


    ### Threshold secret-sharing

    Or just secret sharing. A mechanism whereby a secret is split into `N` shares
    so that `t ≤ N` are required to recover the secret, and fewer than `t` don’t reveal
    information about the secret. `Shamir’s method`, based on polynomial interpolation,
    is the standard way to realize secret sharing.


    #### **126** TCC

    Verifiable secret-sharing (`VSS`) is a variant wherein parties can cryptographically
    verify that the correct secret has been recovered and that each party provided
    their correct share.


    ### Threshold signature

    A signature scheme where signing capabilities (that is, keys) are distributed
    across `N` potential signers and where a signature requires at least `t ≤ N` signatures
    from distinct signers. It’s notably used for custody of cryptocurrency in cold
    storage systems of certain exchanges.


    ### Time AI™

    The Fyre Festival of cryptography.


    ### Time-lock encryption

    A cryptographic time capsule. Time-lock encryption attempts to make decryption
    impossible—even with the decryption key—until a certain date, when the algorithm
    authorizes noninteractive decryption. Like T-many cryptographic functionalities,
    you can achieve it using a trusted execution environment under fairly realistic
    assumptions. It’s also possible to create time-locked ciphertexts by leveraging
    so-called computational reference clocks, like those obtained from blockchains.


    ### Time-lock puzzle

    The first instance of *timed-release crypto*. It was defined in 1996 as a way
    to “send information into the future” by creating a problem whose solution is
    known by its creator but the recovery of which otherwise requires a large amount
    of computation. It later inspired time-lock encryption.


    A See *Proof of sequential work,* *Verifiable delay function (VDF)*.


    ### THE FAILURE OF THE TIME-LOCK PUZZLE

