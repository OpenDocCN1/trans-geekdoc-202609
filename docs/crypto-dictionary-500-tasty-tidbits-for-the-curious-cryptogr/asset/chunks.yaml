    The most promising class of post-quantum cryptography schemes, as far as real
    applications are concerned. Lattice-based cryptography usually relies on some
    version of the `learning with errors (LWE)` problem and in particular its relation
    to lattice problems. It can provide encryption/KEM and signature schemes. It’s
    generally considered the most promising type of post-quantum scheme due to its
    combination of acceptable security assurance, performance, and diversity of constructions.


    Lattice-based schemes represent 39 percent of round one submissions to NIST’s
    post-quantum competition, 46 percent of submissions selected in round two, and
    71 percent of the finalists.


    A See `Learning with errors (LWE)`.


    ### Le Chiffre

    A character in an Ian Fleming spy book. Anyone whose name means `The Cipher` can
    only be a villain:


    Mostly expensive, but discreet. Large sexual appetites. Flagellant.


    Expert driver of fast cars. Adept with small arms and other forms of personal
    combat, including knives. Carries three `Eversharp` razor blades, in hatband,
    heel of left shoe, and cigarette case. Knowledge of accountancy and mathematics.
    Fine gambler.


    ### Leakage-resilient cryptography

    An attempt to model side-channel information leaks using abstract models of computation
    and memory leakage. Such models include the `Bounded Retrieval Model`, `Continual
    Memory Leakage`, `Auxiliary Memory Leakage`, and `Only Computation Leaks`, among
    others. Building secure schemes within these models has proved an interesting
    exercise, yet of questionable practical interest, because the models largely fail
    to capture the complex reality of side channels and physical attacks.


    ### Learning with errors (LWE)

    The problem of solving a system of linear equations when the equations have errors
    in them. `LWE` generalizes the `learning parity with noise (LPN)` problem so it
    has arbitrary dimensions and numbers greater than 0 and 1.


    ### 68** Lattice-based cryptography

    Lattice-based cryptography schemes often rely on the hardness of some `LWE` problem.
    The reason is that, on average, `LWE` is as hard as the hardest instances of a
    lattice problem, such as `GapSVP`. The resulting cryptographic constructions should
    be, in turn, at least as hard to break as `LWE`.


    ### Length extension attack

    The property of certain hash functions that given `Hash(X)`, and without knowing
    `X`, it’s trivial to find the value of `Hash(X || pad || Y)` for any `Y`, where
    `pad` is padding bits followed by the encoding of `X`’s length. Hash functions
    vulnerable to length extension include all those built with the `Merkle–Damgård`
    construction, such as `SHA-256` and `RIPEMD-160`.


    More recent hash functions, such as `SHA-3` or `BLAKE3`, aren’t vulnerable to
    length extension.


    ### Length-preserving encryption

    Encryption that creates ciphertexts of exactly the same bit size as their corresponding
    plaintext; for example, encrypting any 16-byte plaintext into a 16-byte ciphertext,
    any 1-byte plaintext into a 1-byte ciphertext, any 2-bit plaintext into a 2-bit
    ciphertext, and so on. In applications where the payload length is fixed, length-preserving
    encryption is necessary to encrypt payload data.


    Length-preserving encryption shouldn’t be confused with `format-preserving encryption`.


    ### PRESERVING PLAINTEXT LENGTH

    Length-preserving encryption might sound simple, but it’s not. First, public-key
    encryption schemes cannot directly offer length-preserving encryption, because
    ciphertext expansion is intrinsic to how they work. For example, `RSA` encryption
    requires additional padding and randomness to achieve `L` secure encryption (`IND-CPA`).


    When it comes to symmetric encryption, the only way to achieve `IND-CPA`-secure
    length-preserving encryption is if the `nonce` or `IV` is not seen as a part of
    the ciphertext.


    Stream ciphers are trivial y length-preserving, because they `XOR` pseudorandom
    bits with the plaintext and thus preserve its length through encryption. Likewise,
    the `CTR-mode` creates ciphertexts of identical length as their plaintext.


    ### Length-preserving encryption 69

    What about a block cipher mode like `CBC`? If you use the standard `PKCS#7` padding
    scheme, the ciphertext will inevitably be longer than the plaintext. But there’s
    a technique cal `ciphertext stealing` that shuffles the bytes in the last blocks
    to obtain a ciphertext of the same length as its plaintext.


    ### LFSR (linear feedback shift register)

    A See `Feedback shift register`.


    ### Lightweight cryptography

    Cryptography optimized for IoT devices and other platforms that have memory and
    logic constraints. But these constrained platforms usually have unique limitations.
    Consequently, academic research about lightweight cryptography has been of disappointing
    relevance.


    ### Linear cryptanalysis

    A cryptanalysis technique for symmetric ciphers that exploits patterns described
    in linear equations. Linear cryptanalysis might look totally different from differential
    cryptanalysis, but it’s actually closely related to it. The most successful attack
    is on DES.


    ### Linkability

    A property of signature scheme that allows an attacker to determine whether two
    signatures were issued by the same signer. Of course, standard signatures, such
    as `ECDSA`, are linkable by design, which is fine.


    ### LM hash

    Short for `LAN Manager hash`, the function that hashes users in earlier Windows
    versions. `LM hash` is the predecessor of `NT hash`, which is a stronger hash.


    A See `NT hash`.


    ### 70** LFSR (linear feedback shift register)

    ### THE IMPFECTION OF LM HASH

    In hindsight, `LM hash` is laughably weak: you can recover the original password
    easily. To hash a password with `LM hash`, follow these steps:


    1. Convert lowercase letters to uppercase letters. This makes collisions frequent,
    which is bad, while making the recovery of the initial password impossible.

    2. If the password is longer than 14 characters, truncate it to its first 14 characters;
    otherwise, pad it with null bytes to get a 14-byte string.

    3. Encrypt the string `KGS!#$%*` using two `DES` instances, one with the first
    seven bytes of the padded password and another with the last seven bytes (remember
    that `DES`’s key is 56 bits).

    4. The hash is the concatenation of two ciphertexts.


    ### Luby–Rackoff

    A See `Feistel network`.


    ### Lucifer

    The block cipher designed by Horst Feistel at IBM that led to the `DES`. It wasn’t
    originally a Feistel network, but a substitution-permutation network like `AES`,
    with blocks of 32, 48, or 128 bits. `Lucifer` was initially implemented in `APL`
    (A Programming Language) and codenamed `Demonstration`. But the `APL` workspace
    restricted projects’ name length, so `Demonstration` became `Demon` and later
    `Lucifer`.


    ### M

    ### M

    ### MAC (message authentication code)

    Not a signature, but very close: like a public-key signature a `MAC`


    should be unforgeable without the key, but unlike a public-key signature a `MAC`
    doesn’t provide nonrepudiation.


    ### MAC (message authentication code) 71

    In theory, a `MAC` can be unforgeable yet leak information about the message,
    but in practice most `MACs` don’t.


    ### MAGENTA

    An unfortunate candidate at the `AES` competition, broken literally minutes after
    it was presented at the first `AES` conference. A conference participant commented:
    “It got so bad that a few of the participants started real-time cryptanalysis
    and suggesting attacks that would break the algorithm right there and then. I
    marvelled that the German guy managed to keep his composure. The whole spectacle
    was rather shameful.”


    ### Malleability

