- fmt: '

    The most important future application for encryption will be for video communications,
    on stock hardware, which will be 64-bit machines. The `Hasty Pudding Cipher` is
    the fastest cipher for bulk encryption on 64-bit machines.


    (. . .) Performance in video applications is so important that `HPC` should be
    the primary `AES` choice.


    ### Although

    Although it remains unbroken—only equivalent keys were found—`HPC` wasn’t selected
    as `AES` and didn’t even make it to the second round. Its unorthodox design and
    lack of formal security arguments probably didn’t play in favor.


    ### HSM (hardware security module)

    Hardware equipment dedicated to running cryptographic operations and other tasks.
    `HSMs` can come in different factors, such as rack servers or USB dongles. `HSMs`
    don’t necessarily run cryptographic operations using dedicated hardware (as in
    dedicated silicon circuit). Actually, most of the time, they run all in software,
    executed by some general-purpose processor. The `S` in `HSM (hardware security
    module)` refers to the functionality it implements; it doesn’t necessarily mean
    `HSM` is more secure than a normal computer.


    ### HTTP/3

    See `QUIC (Quick UDP Connections)`.


    ### Hyperelliptic-curve cryptography

    Like `elliptic-curve cryptography` but using a higher-dimensional object: the
    `Jacobian` of `hyperelliptic curve`. We can’t explain what `Jacobian` is in terms
    of anything else that is familiar to readers, to paraphrase. The main advantage
    of `hyperelliptic curves` is that, owing to the additional dimensions, the same
    finite field generates larger groups than it would with elliptic curve. This strength
    is also a weakness: when the number of dimensions becomes too high (usually more
    than three), discrete logarithms become easier.


    ### IACR (International Association for Cryptologic Research)

    Cryptographers’ union, a nonprofit that organizes the largest academic conferences
    and manages the reference platform.


    ### IDEA (International Data Encryption Algorithm)

    A 64-bit block cipher from the early 1990s. Uses a Feistel-permutation network.
    Despite a rather heuristic design approach, `IDEA` resisted cryptanalysis for
    years. The first attack against it that proved potentially faster than brute force
    didn’t appear until 2012. (This was a biclique attack.) `IDEA` is one of the few
    ciphers that uses integer multiplication, which has some security benefits but
    makes protecting against side-channel attacks difficult.


    ### IDEA NXT

    A block cipher with little similarity to `IDEA` except for their shared Massey
    construction. Initially named and published as `FOX`, `IDEA NXT` proved very useful
    in antipiracy initiatives, not only because of its cryptographic merits.


    ### Identity-based encryption

    A means of sending an encrypted message without knowing someone’s public key.
    For instance, when Alice wants to send an encrypted message to Bob but doesn’t
    know his public key, identity-based encryption (`IBE`) allows her to compute it
    using his public key. The only caveat is that `IBE` requires a trusted third party,
    called `key server`, which knows some master private key and uses it to generate
    users’ private keys. Bob therefore needs to authenticate to the `key server`,
    proving that he’s the real, to receive his private key.


    ### IES (Integrated Encryption Scheme)

    A public-key encryption scheme that doesn’t involve a public-key encryption primitive.
    Instead, the sender chooses a random key pair, computes `Diffie-Hellman` shared
    secret between the fresh private key and the recipient’s public key, derives a
    symmetric key from it, and encrypts the message with some authenticated cipher.
    Neither party performs a public-key operation to encrypt the data.


    ### Impatient saboteur

    In the `Dolev–Yao` model, an archetypal attacker who can transmit data but not
    receive it. Or in Dolev and Yao’s own words, “one who only initiates conversations
    (and does not rely on being spoken to.)”


    ### Impossibility

    Cryptographer Moti Yung once said, “When a software engineer says a security engineering
    problem is impossible, that really just means it’s cryptographically interesting.”


    ### Impossible differential attack

    A differential attack that exploits abnormally unlikely events rather than abnormally
    likely ones. Differential cryptanalysis generally exploits patterns of unusually
    high probability that occur between outputs and inputs with a specific difference.
    Impossible differential attacks exploit the opposite type of pattern, namely those
    that have zero chance of being observed under certain conditions. If cryptanalysts
    notice these patterns, they can deduce that the condition doesn’t hold. This information
    could help recover a cipher’s secret key or subkey.


    ### IND-CCA

    Indistinguishability of ciphertexts under chosen-ciphertext attacks. The strongest
    security notion for encryption schemes (both public-key and symmetric-key schemes).
    The chosen-ciphertext might intuitively make little sense in practice. The reason
    is that you’ll rarely find systems where attackers can decrypt any ciphertexts
    they want, but encryption that can do more can do less. In addition, there are
    cases in which you do have a decryption oracle, such as some `DRM` systems.


    ### IND-CPA

    Indistinguishability of ciphertexts under chosen-plaintext attacks. Also known
    as semantic security. It’s the idea that a ciphertext shouldn’t reveal anything
    about a plaintext other than its approximate length, even to an active attacker
    capable of retrieving the ciphertext corresponding to the plaintexts of their
    choice. `IND-CPA` is the standard security notion for symmetric encryption. For
    example, block ciphers in `CTR` or in `CBC` mode are secure if the underlying
    block cipher is secure, and if `CTR` nonces are unique or `CBC` initial values
    are unpredictable. That’s a lot of ifs, which in practice can lead to security
    flaws in otherwise `IND-CPA` schemes.


    ### Indelibility

    Property belonging to a transaction, or series thereof, that is timestamped implicitly
    or explicitly and cannot be backdated or otherwise altered. Cryptographic ledger
    mechanisms, such as blockchains, can often address this.


    ### Indifferentiability

    Property of a construction, such as a hash function, that is guaranteed to lead
    to a secure primitive if the building blocks have no security flaw. In the context
    of hash functions, we talk of indifferentiability from a `random oracle`, meaning
    that if the underlying compression function or permutation is ideal, the hash
    function has as many structural properties as a random oracle: that is, none.


    ### Indistinguishability

    The property in which something that isn’t random appears the same as something
    that is actually random. If the two are indistinguishable, you cannot extract
    information from the not-really-random thing. In the case of encryption, the not-really-random
    thing is the ciphertext, and the information you’re unable to extract is about
    the plaintext.


    ### Indistinguishability obfuscation (iO)

    The mathematization of the intuitive concept of software obfuscation. In cryptography,
    as in software security, the obfuscation process takes as input a program and
    produces a second program that in some sense hides how the first program works:
    its internal variables, secret arguments, and so on. Unlike in software security,
    cryptography sees a program as one of the possible abstract representations, most
    commonly a Boolean circuit with AND, OR, and NOT gates.

