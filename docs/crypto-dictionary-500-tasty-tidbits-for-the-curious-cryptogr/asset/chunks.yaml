    今天，流密码已不再是一个小众市场，现代应用程序中使用的许多加密模式在技术上都是流密码，因为它们在 `CTR` 模式下运行。


    ### 流密码模式

    从历史上看，流密码有两种模式：


    - 同步（Synchronous），也称为自同步或密钥自动密钥 (`KAK`)。这是一种广为人知的模式，通过生成伪随机密钥流并与明文进行异或运算来实现。

    - 自同步（Self-synchronizing），也称为自动或密文自动密钥 (`CTAK`)，其输出取决于消息的加密结果。


    ### 置换扩散网络 (SPN)

    用于分组密码和哈希函数的置换构造，其中每一轮包含两个层：


    - 置换（Substitution），通常通过 `S-boxes`，以非线性方式将数据块转换为其他数据块（即具有复杂的输入-输出关系）。这种强大但非常局部的变换有时被认为带来了`confusion`（混）。


    置换扩散网络 (SPN) **123**


    - 扩散（Permutation），通常通过位洗牌或矩阵运算，以确保每个输出位最终都依赖于所有输入位。这种变换很弱，但基于分组的变换被认为提供了`diffusion`（扩散）。


    在 SPN 中，这两层是互补的，这种职责分工通常简化了密码分析以及对某些攻击技术成功率边界的计算。`AES`、`Serpent` 和 `PRESENT` 都是
    SPN 的示例。


    ### Suck（糟糕）

    正如密码学家 Matthew Green 所定义：“在密码学中，`suck` 是一个纯技术术语，意味着`慢`、`复杂`且可能不安全`。”


    ### 甜菜拍卖

    多年来，这是多方计算 (`MPC`) 唯一已知的现实世界应用。2008 年丹麦在奥胡胡大学人员的支持下进行了甜菜拍卖。它们在论文《Secure Multiparty
    Computation Goes Live》中得到了详细描述，并被许多其他论文引用作为 `MPC` 并非无用的证据。得益于区块链协议，现在有了更多的 `MPC`
    应用。


    ### Suite A

    美国国家安全局（NSA）的一系列机密加密算法和技术。


    `Suite A` 用于军事安全通信设备等。它不对公开放。请参阅 `NSA (National Security Agency)`。


    ### 窥视 Suite A

    `Suite A` 似乎包含一些有趣的密码，例如：`BATON`，由 NSA 在 1995 年左右开发的分组密码。它具有 128 位的数据块长度和 320
    位的密钥，其中 160 位是校验位（这意味着 `BATON` 的密钥只有 160 位秘密位）。`BATON` 由 `PKCS#11` 加密接口标准支持；因此
    `BATON` 的参数和支持的模式是公开的。这些模式包括一个未记录的 `SHUFFLE` 模式以及一种密钥封装模式。`BATON` 是 NSA 最快的密码之一。


    #### **124** Suck（糟糕）

    - `SAVILLE`，由 NSA 与英国 `GCHQ` 在 20 世纪 60 年代联合开发的流密码。它曾用于越南战争期间的加密设备。`SAVILLE` 基于非线性反馈移位寄存器，使用
    128 位密钥，最后 8 位是前 120 位的校验和。`SAVILLE` 具有可以在同步或自同步模式下的有趣特性。


    `Suite A` 还包含如 `ACCORDION`、`CRAYON`、`JUNIPER` 和 `PHALANX` 等算法。


    ### SUPERCOP

    加密操作与原语相关的统一性能评估系统。它是 `BATMAN` 和 `eBASH` 的继者。


    #### S

    `SUPERCOP` 通过尝试算法的许多不同实现来估计其最优速度。它还使用许多不同的编译器选项编译每个实现，然后多次运行编译后的程序以可靠地测量其执行时间。截至
    2020 年 5 月，`SUPERCOP` 已对超过 1000 种不同的算法、2800 多种实现以及多个编译器和编译器选项进行了测试。


    在 CPU 使用率方面，运行 `SUPERCOP` 之于密码实现者，就像比特币挖掘之于加密货币爱好者。


    ### 超多项式复杂度

    根据 Cobham 定理（以及经验观察），这在实践上是不可能的复杂度。


    ### SVP (最短向量问题)

    基于格的密码学的主要计算问题。`SVP` 涉及寻找一组多维向量组合，其长度（相对于给定的范数）是最小的。


    由于误差学习 (`LWE`) 问题与 `SVP` 问题之间的关系，许多基于格的密码系统间接利用了类似于 `SVP` 问题（如 `GapSVP`）的最坏情况硬性。


    ### 对称加密

    后量子密码学中最古老的形式。


    对称加密 **125**


    ### T

    ### TCC

    密码学理论会议（Theory of Cryptography Conference）“专注于概念化、定义和解决自然密码学问题的范式、方法和技术。”


    `TCC` 确实涵盖了理论密码学——一个智力上有趣的课题，但实际相关性较低，例如涉及量子随机预言机等概念时——以及应用密码学的理论方面，后者的基本结果具有很高的实际价值。


    研究人员提交了经过同行评审的研究论文，标题如“模糊海明距离与来自子集乘积问题的逻辑取或”以及“全同态 NIZK 和 NIWI 证明”。


    请参阅 `Asiacrypt`、`CHES`、`CRYPTO`、`Eurocrypt`、`FSE`、`PKC`、`Real World Crypto`。


    ### 测试向量

    遗憾的是，这通常是加密系统中发现的唯一测试。


    ### Threefish

    Blowfish 家族的第三成员，但与 `Blowfish` 和 `Twofish` 非常不同。它没有费斯特网络，没有 MDS 矩阵，没有 S 盒，只有受
    `Cha` 启发的 ARX 结构，启发了 `SipHash`。


    ### 阈值加密

    严格来说，不存在。但阈值解密存在。它是指解密密钥在 `N` 个方之间进行阈值共享，其中 `t ≤ N` 方必须协作才能解密。


    ### 阈值秘密共享

    或简称秘密共享。一种机制将秘密分成 `N` 份，使得需要 `t ≤ N` 份才能恢复，而少于 `t` 份不会泄露秘密信息。基于多项式插值的 Shamir 方法是实现秘密共享的标准方法。


    #### **126** TCC

    验证秘密共享 (`VSS`) 是一种变体，参与方可以通过加密验证是否恢复了正确的秘密，以及每个参与方是否提供了正确的份额。


    ### 阈值签名

    一种签名方案，其中签名能力（即密钥）分布在 `N` 个潜在签名者中，签名需要至少 `t ≤ N` 个不同签名者的签名。它被著名用于某些交易所冷钱包系统中的加密货币托管。


    ### Time AI™

    密码学界的 Fyre 节事件。


    ### 时间锁加密

    一种加密时间胶囊。时间锁加密试图在特定日期之前即使有解密密钥也无法解密，直到该日期算法允许非交互式解密。与许多密码学功能一样，在合理的假设下，你可以使用可信执行环境来实现。也可以通过利用所谓的计算参考时（例如从区块链获取）来创建时间锁密文。


    ### 时间锁谜题

    *定时发布密码*的第一个实例。它在 1996 年被定义为一种“向未来发送信息”的方法，通过创建一个创建者已知其解，但其他人需要大量计算才能恢复的问题来实现。它后来启发了时间锁加密。


    请参阅 *顺序工作证明*、*可验证延迟函数 (VDF)*。


    ### 时间锁谜题的失败


