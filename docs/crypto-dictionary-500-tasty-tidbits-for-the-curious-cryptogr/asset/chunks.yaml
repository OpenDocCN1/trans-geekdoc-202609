    ### Quantum cryptography


    Cryptographic operations that rely on quantum phenomena and don’t necessarily
    need a quantum computer, such as quantum key distribution. Quantum cryptography
    happens to be post-quantum but doesn’t belong to the field of post-quantum cryptography.


    ### Quantum encryption


    Encryption of quantum states as opposed to strings of classical bits.


    The most basic form of this is the quantum one-time pad, which you can think of
    as a combination of quantum teleportation (to transmit the encrypted state) and
    a classical one-time pad (the bits required to read the decrypted state).


    The quantum one-time pad looks less efficient than its classical counterpart,
    requiring two classical bits of key for each bit of information encrypted. But
    it’s also more powerful, because it can be leveraged to build secure homomorphic
    and multi-party computation schemes.


    ### Quantum key distribution


    Sometimes confused with post-quantum cryptography, but different and of lower
    practical value. The best known is the `BB84` key agreement protocol.


    ### Quantum signature


    An impossible scheme, because the classical notion of a signature doesn’t apply
    to quantum states. Intuitively, you should see why: any party that can learn information
    about a quantum state can also modify it. In particular, it’s impossible to attach
    a signature to a quantum state, as you would do with a classical message. More
    generally, quantum quantum states cannot be authenticated unless they’re also
    encrypted, so that only the intended recipient can decrypt them. But although
    quantum signing isn’t possible, quantum signcryption is.


