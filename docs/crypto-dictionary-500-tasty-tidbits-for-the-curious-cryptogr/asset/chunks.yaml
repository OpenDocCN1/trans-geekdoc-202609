    ## 关于作者

    Jean-Philippe (JP) Aumasson 是 Taurus Group 的首席安全官兼联合创始人，这是一家专注于数字资产基础设施的瑞士金融科技公司。自
    2006 年以来，他在密码学领域发表了 60 多篇研究论文，并设计了广泛使用的加密算法 `BLAKE2` 和 `SipHash`。他是广誉之作《严肃的密码学》（No
    Starch Press, 2017）的作者，经常在信息安全和技术会议上演讲。


    ## 关于技术评审员

    Pascal Junod 自 1999 年以来一直从事应用（以及较少应用的）密码学工作，涵盖了学术界和工业界。他拥有苏黎世联邦理工学院（ETH Zurich）计算机科学硕士学位和洛桑联邦理工学院（EPF
    Lausanne）密码学博士学位。在空余时间，他喜欢越野跑、白水皮艇、阅读书籍以及照顾家庭。


    ## 前言

    *我并不承诺任何完整的东西；因为任何被认为是完整的人类事物正因如此而必然是有缺陷的。我不会假装对各种物种进行细致的解剖学描述，或者至少在这个空间内进行过多的描述。我在这里的目标仅仅是勾勒鲸类学系统化的草案。我是建筑师，而非建造者。*
    ——赫尔曼·梅尔维尔，《白鲸记》（第 32 章）


    《加密字典》与我之前的书非常不同。它的格式和较轻松的语气可能让它看起来不那么严肃，但它的严肃性在于其涵盖的广度。


    《严肃的密码学》涵盖了应用密码学的基础知识，或者说不到该领域全部知识的 10%，而本字典自称涵盖了密码学领域至少 75% 的内容。


    《严肃的密码学》中那种不紧不慢、渐进且相对深层的阐述被一种不那么头疼的结构所取代，这种结构充满了简洁直接的定义。这种咖啡书的形式旨在展示密码学的丰富性，包括其奇特和被忽视的角落，以分享知识并作为通往更好地理解秘密科学的门径。


    正如题辞所暗示的，《加密字典》并非试图提供一本能够全面且一致地涵盖密码学不同领域的真实字典。你可能找不到你喜欢的协议或密码，并可能会对我刻意忽略或只是没想到的某些术语的缺失感到惊讶。但你会发现今天密码学家经常许多许多主要概念和算法，以及我认为在实务、理论、历史或轶闻方面具有趣味的、带有个人偏好的术语精选。


    资深密码学家可能会注意到，这本书并不平等。尽管我试图均匀地涵盖密码学的所有街条小巷，但由于我的偏见、经验、兴趣和多变的灵感，某些领域不可避免地比其他领域得到了更平等的对待。我希望这种异质性不会被视为不公平，因为这绝对不是我的意图。


    例如，我选择不列出个人或软件组件；相反，书侧于人们创建和工程师实现的概念及加密对象，我认为这些具有更大的吸引力。根据“不包含软件”的规则，我没有包含 `Signal`
    应用，但我包含了 `Signal` 协议。但这一规则有一个例外，你可以在 N 和 P 之间找到它。


    本字典并不自称提供对各种协议、算法和其他密码学概念的精确描述。《加密字典》并非百科全书，也不旨在成为古老的《应用密码学手册》的现代版本。例如，寻求基于属性的密码学的正式定义或
    `AES` 详细规范的读者可以在网上找到大量的参考。


    大多数定义都是真实的定义，但它们在信息量上各不相同。我没有追求统一的细节水平，而是刻意简要解释了某些术语——包括一些最基本的术语——或只添加了一些幽默的评论。


    《加密字典》中的加密代表了最广义上的密码学，包含了所谓的加密货币领地。但坦诚地说，本字典远不是一本区块链字典，因为许多特定的区块链应用术语被省略了。


