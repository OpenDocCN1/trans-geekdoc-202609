    \ math; its implementation logic doesn’t stray too far from the specification;\
    \ and it poses no risk of cache-timing attacks. But its security margin (in other\
    \ words, number of rounds) involved perhaps too much crypto compared to Rijndael.\n\
    \nA See *PRESENT.*\n\n**SHA-0**\n\n**S**\n\nFirst draft of SHA-1.\n\n**SHA-1**\n\
    \nA secure hash function if the only security you need is preimage resistance.\
    \ It took approximately 12 years to progress from the collision attack described\
    \ in a 2005 paper to a demonstrable collision in 2017.\n\n**SHA-2**\n\nNot one\
    \ but four hash functions:\n\n³ SHA-256 looks like SHA-1 but with more rounds\
    \ and more complex internals.\n\n³ SHA-224 is SHA-256 with 224-bit output instead\
    \ of 256-bit output.\n\n³ SHA-512 looks like SHA-256 with 64-bit words instead\
    \ of 32-bit words.\n\n³ SHA-384 is SHA-512 with 384-bit output instead of 512-bit\
    \ output.\n\nUnlike SHA-1, SHA-2 algorithms aren’t broken and are unlikely to\
    \ ever be.\n\n**SHA-3**\n\nWhen someone tells you they use SHA-3, you should ask\
    \ which version of SHA-3 they use: it could be SHA3-224, SHA3-256, SHA3-384, SHA3-512,\
    \ SHAKE128, or SHAKE256. If it’s one of the latter two, you might want to know\
    \ what output length they use, because these aren’t simple hash functions but\
    \ XOF (extendable-output functions).\n\nA See *Keccak.*\n\nSHA-3 **113**\n\n**SHA-3\
    \ competition**\n\nOfficially the *NIST hash function competition*. The 2008 to\
    \ 2012 selection process for SHA-3 eventually settled on Keccak after a final\
    \ round that included BLAKE, Grøstl, JH, and Skein. Of 64 submissions received\
    \ by NIST, 51 were accepted as valid.\n\n**SHA-3 PANDEMONIUM**\n\nThe first few\
    \ months of the SHA-3 competition were a rampage. Most submissions by amateurs\
    \ were broken, sometimes within minutes of reading their specification.\n\nNoteworthy\
    \ submissions included:\n\n³ MD6: Tree-based hash having nothing to do with MD5\
    \ but its designer ³ CubeHash: Minimalist ChaCha-like permutation-based\n\n³ ECOH,\
    \ FSB, SWIFFTX: Attempts of provably secure hashes using a reduction to a hard\
    \ computational problem\n\n**SHACAL**"
