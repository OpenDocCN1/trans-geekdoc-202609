  raw: 'AES in Galois counter mode, the most common authenticated encryption primitive
    at the time of writing. Also the primitive that ended the reign of HMAC authenticators.
    In GCM mode, a message is encrypted in CTR mode and the Galois MAC (GMAC, aka
    GHASH) generates an authentication tag from the ciphertext and associated data
    blocks. The carry-less multiplication instruction PCLMULQDQ was introduced in
    Intel CPUs in the 2010s to speed up GMAC computations.


    **AES-GCM’S ACHILLES’ HEEL**


    AES-GCM is secure except when cal ed twice with the same nonce on distinct messages,
    which can leak plaintext data and reveal the authentication key GMAC uses. This
    unfortunate fragility hasn’t stopped AES-GCM from being used in countless protocols
    (including TLS, IPSec, and SSH) and from being standardized by IEEE, ISO, and
    NIST. AES-GCM’s cousin AES-GCM-SIV eliminates the nonce-reuse problem but isn’t
    yet widely supported and is a bit slower.


    **AES-GCM-SIV**


    A variant of AES-GCM where the encryption nonce is determined from the tag computed
    by authenticating the plaintext (and any associated data). AES-GCM-SIV’s MAC,
    called *POLYVAL*, is slightly different from GCM’s GMAC: whereas AES-GCM is of
    the encrypt-then-MAC form, AES-GCM-SIV is a MAC-and-encrypt construction.


    The main benefit of AES-GCM-SIV compared to AES-GCM is that the former remains
    secure if a same nonce is reused—a property called *misuse resistance*.


    **AES-NI**


    Officially AES New Instructions but often called native instructions, which might
    be a better term. AES-NIs are CPU instructions that compute AES using hardware
    logic in the chip’s silicon as opposed to AES-NI **5**


    a combination of arithmetic operations using the chip’s ALU. When introduced by
    Intel in 2008, AES-NIs made AES software about 10 times faster, and as a by-product,
    immune to cache-timing attacks.


    **AES-SIV**


    A See *SIV-AES*.


    **AIM (Advanced INFOSEC Machine)**


    A chipset designed by Motorola in the late 1990s that includes separate FPGAs
    for red and black operations. Pompously advertised as *one of* *the most revolutionary
    advances in cryptography, ever*. The NSA uses it to protect classified and sensitive
    national security information. The off-the-shelf AIM didn’t include classified
    (Suite A) algorithms, but users could program the FPGAs to support algorithms,
    such as ACCORDION


    or BATON.


    **AKA**


    In 3GPP standards parlance, the authenticated key agreement operation between
    users of a cellular network and the user’s home network, which might be different
    from the serving network.


    **AKA IN 3GPP STANDARDS**


    The AKA is very similar in 3G UMTS, 4G LTE, and 5G standards, and unlike many
    other key agreement protocols doesn’t use public key primitives; instead, it relies
    on a shared symmetric key and pseudorandom functions (except in 5G where public-key
    encryption is added).


    The AKA looks like a straightforward protocol, taking a master key and a sequence
    number to derive session keys (encryption, authentication, and anonymity keys)
    while ensuring mutual authentication, or more precisely mutual knowledge of the
    shared key. But despite its cryptographic boringness, AKA aims to achieve other,
    nontrivial goals specific to its unique environment.


    These goals include confidentiality of the user identity (IMSI), unlinkability
    of the user, authentication of the serving network (by the user and home network),
    and strong unreliability guarantees and resilience to unsafe pseudorandom generators.


    **6** AES-SIV


    **AKS (Agrawal–Kayal–Saxena)**


    **A**


    The first deterministic primality test, as opposed to randomized ones.


    The 2002 research paper presenting the AKS algorithm, “PRIMES is in P,” was the
    first proof that the problem of primality testing is in the P complexity class,
    or the class of problems for which a nonrandomized polynomial-time algorithm exists.


    A See *PRIMES*.


    **Algebraic cryptanalysis**


    A form of cryptanalysis where the target problem (typically key recovery, but
    also forgery, distinguishing, and so on) is modeled as a system of multivariate
    equations to which a solution is found by generic or ad hoc techniques. Algebraic
    cryptanalysis has been used to attack symmetric and asymmetric cryptosystems.
    An example target is stream ciphers based on feedback shift registers with low
    algebraic degree logic, giving rise to underlying equations exploitable by algebraic
    attacks.


    A See *Gröbner basis*.


