    ### 等级 2：在等级 1 的基础上增加某些篡改证据——例如，通过观察箱上破损的密封来检测已发生的物理攻击。


    ### 等级 3：在等级 2 的基础上增加某些篡改检测——例如，平台具备实时检测物理攻击的能力，并在认为自己正受到攻击时将自身重置为出厂 `F` 模式。此级别还包括一些物理隔离和更强的身份验证。


    ### 等级 4：在等级 3 的基础上增加某些更强的篡改检测，并保证模块能够检测大多数物理攻击尝试，并在受到攻击时进行重置（例如，通过清零密钥）。


    值得注意的是，`FIPS 140-2` 与其说是衡量系统对物理攻击的韧性，不如说是衡量系统检测攻击的能力。这承认了在拥有适当设备的情况下，大多数系统都容易受到物理攻击的侵害。


    此外，系统通过了 `FIPS 140-2` 认证并不意味着它是绝对安全的。原因是：1) `FIPS 140-2` 受限于其范围以及每个级别安全需求的定义，且
    2) 即使在通过认证的产品中，认证通常也适用于加密模块（有时仅适用于部分模块）。换句话说，如果某个应用程序调用 `FIPS 140-2` 等级 3 模块来加密某些消息，而该应用程序的软件存在泄露该明文的漏洞，不要归咎于认证。


    ## FIPS 140-3


    2019 年发布的 `FIPS 140-2` 新版本。它引入了针对非侵入式攻击的要求，以及“正常运行”（Normal Operation）和“降级运行”（Degraded
    Operation）等概念。


    另参见 *FIPS 140-2*。


    `FIPS 140-3 47`


    ## 伪造


    一种攻击目标不是恢复某些密钥，而是在不知道某些密钥的情况下，创建一个看似难以生成的数值。


    不可伪造性（Unforgeability）是相应的安全概念，通常与签名和消息认证码（MACs）相关。更广泛地说，不可伪造性适用于任何攻击者都难以创建有效输出的方案。这包括身份认证加密中的密文以及零知识证明协议的轨迹。


    有时，可伪造性是一种理想的属性（例如为了实现可否认性）。


    ## 形式验证


    一种依赖数学保证的测试形式。应用于安全协议时，形式验证包括符号验证和计算验证技术，它们用于评估协议是否满足机密性和身份验证等属性。另一个例子是编程语言，它们可以证明实现在功能上相对于规范是正确的，或者不存在某些类的侧信道攻击。


    高安全性应用通常会接受某种形式的形式验证，例如通用标准（Common Criteria）安全评估框架的 `EAL7` 保证级别。尽管如此，不要被误导认为形式验证意味着证明了加密实现的所有方面都是安全的。


    ## 格式保留加密


    一种产生的密文与原始消息格式相同的加密类型。例如，16 位信用卡号的格式保留加密会产生另一个 16 位数字。格式保留加密通常用于加密字段必须具有特定格式的数据库条目，例如社会安全号码码、IP
    地址和邮政编码。尽管该问题听起来简单，但它需要复杂的技术，特别是对于从任意值域创建密码的更具通用性的问题。


    ## 前向安全性


    指如果某物在稍后被破解，它仍然保持安全的概念。什么被视为*某物*、*其他物*以及*稍后的时间*取决于上下文。前向安全性通常是密钥协商协议、安全消息协议（及其棘轮机制）、伪随机数生成器、伪随机函数、MACs
    以及其他状态对象中相关的 `48 Forgery`（伪造性）安全概念。


    实现前向安全性通常比实现后向安全性更容易，因为删除过去比让未来变得不可预测更容易（至少在密码学中是如此）。


    另参见 *Backward secrecy*。


    ## FOX


    另参见 *IDEA NXT*。


    ## FSE (快速软件加密)


    一个专注于对称密码原语设计和密码分析的会议，包括慢速面向硬件的哈希函数。`FSE` 有时被视为应用密码学会议，尽管它很少关注真实世界的算法，更不用说真实世界的攻击了。


    研究人员展示经过评审的论文，标题例如：


    “使用分治法改进针对差分/线性分析的基于 MILP 安全评估算法”以及“低 AND 与高效逆序：低延迟掩码 S 盒指南”。


    另参见 *Asiacrypt*、*CHES*、*CRYPTO*、*Eurocrypt*、*PKC*、*Real World Crypto*、*TCC*。


    ## 全同态加密


    另参见 *Homomorphic encryption*。


    ## 功能加密


    一种看起来像魔法的加密方案：当为某个函数 `f()` 设计时，解密 `Enc(M)` 得到的不是 `M` 而是 `f(M)`。但像许多魔法加密方案一样，它在实践中的用途有限，因为它只能高效支持简单的功能。


    为了构建功能加密方案，密码学家可以使用利用不可区分性混淆（indistinguishability obfuscation）的技巧：换句话说，寻找 `f(M)`
    的解密过程由一个混淆程序组成，该程序首先检索 `M`，然后计算 `f(M)` 而永远不会暴露 `M`。


    `Functional encryption 49`


    ## 未来安全性


    Signal 协议背景下提出的术语，指与后向安全性类似的概念。与入侵后恢复不可区分。


    另参见 *Backward secrecy*。


    ## 模糊提取器


    一种从具有随机错误的多次读取中提取某些熵值以派生密钥的方案。这听起来很像纠错码，但不同之处在于：首先，读取的值不是字码（具有冗余，因此熵次优），而是可能是极大熵的值；其次，该值不是读取一次而是多次；最后，用于解码密钥的注册数据不能泄露关于该密钥的信息。因此，你可以存储它而不产生隐私泄露。


    你可能会在生物识别应用中发现提取器，这些应用必须提取一个能够唯一识别个体的值。相反，在传统的认证方法中，你会将新的测量值与注册值进行对比以识别身份。


