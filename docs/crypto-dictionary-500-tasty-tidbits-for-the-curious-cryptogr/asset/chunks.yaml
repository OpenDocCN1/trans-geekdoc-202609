    ## Homomorphic encryption


    An encryption that satisfies `Dec(Enc(M1) ⊙ Enc(M2)) = M1 ⊙ M2` for some operators
    `⊙` that might be identical or distinct, and are usually some type of addition
    or multiplication. For example, encrypting a message with textbook `RSA` by doing
    `Md mod n` for some message `M` is homomorphic with respect to multiplication:
    the product of two ciphertexts is the ciphertext of the plaintexts.


    Homomorphism can be a security issue and a feature, depending on the context.
    For example, certain e-voting systems leverage the homomorphic property of `Paillier’s`
    cryptosystem to aggregate ballots without decrypting them.


    Fully homomorphic encryption is a more general and powerful property but is also
    harder to realize: a fully homomorphic encryption can be homomorphic with respect
    to any operation performed on the ciphertext instead of just a single group operation.


