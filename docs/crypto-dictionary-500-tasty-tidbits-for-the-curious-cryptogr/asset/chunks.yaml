    在 CAESAR 竞赛定义的三个用例中，深度防御对读者来说可能是最不直观的。它在密码学工程方面也是最有趣的，因为它被定义为解决以下需求：


    ³ 尽管密文重复也能保持真实性


    ³ 密文重复导致的隐私损害有限


