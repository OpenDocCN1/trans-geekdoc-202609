- fmt: '

    A block cipher extracted from the compression function used in `SHA-1`. More precisely,
    `SHACAL` is the keyed permutation in `SHA-1`’s instance of a Davies–Meyer construction.
    Likewise, `SHACAL-2` is `SHA-256`’s block cipher; it was submitted to the NESSIE
    project and was selected.


    `SHACAL` is pronounced like the French `chacal`, meaning jackal.


    ### Shamir’s secret database


    A list of all prime numbers—and therefore all RSA private keys—that Adi Shamir
    is rumored to have created to instantaneously break RSA. To the best of our knowledge,
    this rumor has never been confirmed or denied.


    ### Shor’s algorithm


    A quantum algorithm that solves factoring and discrete logarithms with practical
    complexity. Shor’s algorithm is the reason the field of post-quantum cryptography
    exists.


    ### 114 SHA-3 competition


    ### SHS (Secure Hash Standard)


    The `FIPS 180-4` document specifies the `SHA-1` and `SHA-2` algorithms, “for computing
    a condensed representation of electronic data (message).”


    `SHA-3` is specified in a separate document titled “SHA-3 Standard: Permutation-Based
    Hash and Extendable-Output Functions” (`FIPS 202`).


    ### Side channel


    Any way to obtain information about a cryptographic operation other than the specified
    output values.


    ### Side-channel attack


    An attack that leverages some side-channel information, either passively or actively,
    locally or remotely, based on physical or logical properties. A side-channel attack
    doesn’t necessarily require physical access to the module attacked.


    ### KINDS OF SIDE CHANNELS


    Here is an incomplete list of classes of side-channel attacks:

    - Timing attacks when the execution time depends on sensitive data

    - Fault attacks, such as CPU overclocking, power glitching, and laser fault injection

    - Simple measurement of differential analysis of physical phenomena: acoustic
    waves, electromagnetic emanations, and heat

    - Operating system leaks, via `procfs`, `dmesg` entries, race conditions, and
    various `ASLR` leaks

    - Traffic analysis over encrypted communications

    - Micro-architectural attacks, such as cache attacks

    - Shoulder surfing and observation of users’ movements


    ### Sigaba


    The American Enigma, designed in the 1930s. It was never officially broken.


    Sigaba 115


    ### Signal protocol


    The combination of the `X3DH` session initialization protocol and the double ratchet
    state update and key update protocol, as used by the `Signal` application. A similar
    protocol was integrated in `WhatsApp` and `Facebook Messenger`, reusing libraries
    developed for `Signal`. The cryptographic research and engineering behind the
    `Signal` protocol had a major impact on secure messaging applications.


    A See `Double ratchet`, `X3DH`.


    ### Signature


    Public-key signature, or digital signature, but different from electronic signature,
    e-signature, or electromagnetic signature. It’s sometimes sac-rilegiously defined
    as `encrypting with the private key`.


    ### WHAT IS THE SECURITY GOAL OF A SIGNATURE?


    A brilliant CS master’s student once defended his master’s thesis project (on
    post-quantum cryptography). In the Q&A part of his defense, after questions about
    his work, his cryptography professor asked him, “What’s the security goal of a
    signature?”


    The student was confused by this deceptively simple question.


    Signatures should be unforgeable under adaptive chosen-message attacks. An attacker
    who can query a valid signer for a signature of any message of their choice shouldn’t
    be able to compute a signature for any other message.


    The student thus unconvincingly answered, “Existential unforgeability under adaptive
    chosen-message attacks.”


    The professor said that no, this wasn’t the unique goal of public-key signatures
    because, after all, `MACs` attempt to achieve a similar goal.


    The professor had expected the answer `nonrepudiation`, or the property that a
    signer cannot claim that someone else issued the signature on their behalf, because
    nobody else knows the private signing key. The same isn’t true for `MACs`. This
    notion is intuitively the opposite of deniability, although in `MACs` can effectively
    provide nonrepudiation if a signature was demonstrably transmitted by some entity
    or computer.


    A more flexible form of nonrepudiation is provided by undeniable signatures, which
    are defined in this book, along with many other signature variants (blind, group,
    ring, threshold, and so on).


    ### 116 Signal protocol


    ### Signcryption


    To public-key cryptography what authenticated encryption is to symmetric cryptography.
    In other words, signcryption is signature and encryption within a single primitive.


    ### SIKE (Supersingular Isogeny Key Encapsulation)


    Sounds like `BIKE`. `SIKE` is also a post-quantum `KEM` but is based on an isogeny
    problem rather than a decoding problem.


    `SIKE` is based on `SIDH` (Supersingular Isogeny Diffie–Hellman), the main isogeny-based
    key agreement scheme, and is a candidate in `NIST`’s post-quantum project.


    A See `BIKE (Bit Flipping Key Encapsulation)`, `Isogeny-based cryptography.`


    ### S


    ### SIMECK


    `SIMON + SPECK = SIMECK`. It’s a block cipher that borrows from the `SIMON` and
    `SPECK` NSA-designed ciphers to create an algorithm suitable for software- and
    hardware-constrained implementations.


    `SIMECK` is not from the `NSA`.


    ### SIMON


    Along with its brother `SPECK`, block ciphers designed to qualify as lightweight,
    optimized for hardware and software, respectively. `SIMON` would likely be used
    in many projects if it wasn’t designed by the `NSA`.


    Indeed, arguing that Caesar’s wife must be above suspicion, many cryptographers
    objected to the use of `SIMON` and `SPECK` after `Snowden` publicly questioned
    the `NSA`.


    ### SipHash


    Not a hash but a pseudorandom function. `SipHash` is used as a secure `MAC` and
    is optimized for short input values. It was designed to prevent hash-flooding
    attacks against hash tables.


    ### SIV-AES


    `AES` in `SIV` mode. For some reason, it’s not called `AES-SIV`. Instead, it goes
    by the official name `Synthetic Initialization Vector` (`SIV`).


    SIV-AES 117


    ### USES OF SIV-AES


    As with `AES-GCM-SIV`, `SIV-AES` avoids the hazard of exposing plaintext if the
    same nonce is used than once. `SIV-AES` also uses the trick of deriv-ing the nonce
    from the message, thus leading to different nonces for different messages.


    Unlike `AES-GCM-SIV`, the MAC used in `SIV-AES` isn’t based on binary polynomial
    multiplication. Instead, it uses the `AES`-based `CMAC`, a variant of `CBC-MAC`.
    (Perhaps you remember `AES-CCM`?) This contributes to making `SIV-AES` simpler
    than `AES-GCM-SIV` but also slightly less fast.


    ### Skipjack


    A block cipher designed by the `NSA` in the late 1980s. It’s famous for its role
    in the `Clipper` fiasco and is currently often used as a toy cipher in cryptanalysis
    classes. `Skipjack` hasn’t been fully broken or shown to include a backdoor.


    A See `Clipper.`


    ### Slide attack


    An attack introduced in a 1999 paper that began as follows: “It is a general belief
    among the designers of block-ciphers that even a relatively weak cipher may become
    very strong if its number of rounds is made very large.”


    The paper then goes on to describe a type of attack on block-ciphers that works
    regardless of the number of rounds used.


    ### MORE CRYPTO, SAME INSECURITY?


    Slide attacks work as follows:


    Assume that the encryption function `E(*)` works by iterating a round function
    `R()`, such that `E(X) = R(R(. . . R(X) . . . )))`. The attack first looks for
    one or more *slid pairs*, which are pairs of plaintext blocks `X` and `Y` such
    that `R(X) = Y, and therefore `E(X) = R−¹(E(Y))`. You can use several tricks to
    identify these pairs.


    Once you have such pairs, breaking the cipher is equivalent to just breaking one
    round, which is usual y easy.


    118 Skipjack


