    一个缩写，指仅执行整数加法、字位位移或旋转以及异或运算的加密算法（与之相对，例如使用 S 盒的算法）。由密码学和安全研究人员 `Ralf-Philipp Weinmann`
    于 2009 年提出。


    ### ASIACRYPT

    亚洲顶尖学术密码学会议，自 1990 年以来每年秋在亚太地区的不同地点举行。它是唯一一个名称中包含 `IACR` 子字符串的 IACR 会议。研究人员展示经过同行评审的研究论文，标题如“结构保持且可重随机化的
    RCCA 安全公钥加密及其应用”以及“2G/3G 网络中无彩虹表的 GSM 加密密码分析”。


    参见 `CHES`、`CRYPTO`、`Eurocrypt`、`FSE`、`PKC`、`Real World Crypto`、`TCC`。


    ### 非对称加密

    参见 公钥加密。


    ### 攻击

    在密码分析背景下，指一种描述为算法的技术演示，该技术违反了被攻击原语或协议设计者所提出的安全声明。


    ### 并非所有攻击都是攻击

    如果 Alice 设计了一个密码，她可以声称：在 2) 被给定十亿对明文或密文对的情况下，没人能 1) 确定地恢复密钥。在这里，点 1 是安全目标，点 2
    是攻击者模型。


    所以，如果你确定了如何通过百万对 `9` 明文或密文对确定地恢复密钥，它就符合攻击的定义。如果你需要百亿对，它就不符合攻击的定义。如果恢复密钥的概率仅为 1/10，同样也不符合。


    攻击的存在并不意味着被攻击的原语在某些上是不安全的。例如，如果一种攻击在 `2200` 次操作中有效，而安全声明是 `2256`，那么你不需要担心，因为在现实中
    `2200` 和 `2256` 一样不可能。


    研究人员通常以研究论文的形式展示攻击。当攻击可行时，可能会提供实际的实现作为其有效的证据。


    ### 基于属性的加密 (ABE)

    基于身份的加密从单一属性（身份）到多个属性的泛化。它允许你将消息不是发送给特定的接收者，而是发送给一组属性，使得只有满足属性有效组合的方才能解密消息。


    ABE 起来很强大，但尚未发现许多实际应用。


    据报道，原因是其相对复杂的构造（使用椭圆曲线对）以及需要一个信任的第三方（持有生成私钥所需的主密钥）。


    参见 基于身份的加密。


    ### 用于访问控制的 ABE

    ABE 有时被认为适用于细粒度访问控制。例如，你可以想象一个组织部署 ABE，使用部门、权限级别和项目等属性来加密敏感文档，通过加密手段强制执行多级安全和基于角色的访问。例如，一个文档可以使用带有属性
    `{department=ENGINEERING, clearance=SECRET, project=LABRADOR}` 的公钥进行加密。


    此时，ABE 就可以保证，如果你只满足这些属性中的两个（例如，你的部门是 `ENGINEERING` 且权限级别是 `SECRET`，但你在负责 `HUSKY`
    项目），你将无法解密该文档。更有趣的是，ABE 保证如果你与 `ENGINEERING` 部门中 `LABRADOR` 项目的某人重合，但他们只有 `CONFIDENTIAL`
    权限，你仍然无法解密该文档。


    ### 10 基于属性的加密 (ABE)

    ### 认证密码文

    参见 `AEAD`。


    ### Axolotl

    ### B

    Signal 应用端到端消息协议的原名。


    参见 Signal 协议。


    ### B

    ### 后门

    一种绕过算法或协议安全性的隐蔽特性。陷门（Trapdoors）是用户为人知的存在；而后门通常不为人知。后门曾被定义为一种允许秘密访问数据的特征或缺陷。一个良好的后门必须是是不可检测的、`NOBUS`（除我们之外无人知道，或仅由其架构师专门利用）、可重用的、不可修改的且可否认的。


    由于这些原因，加密算法中的后门很难设计，而在实现中更容易被添加，特别是当内部逻辑不透明且难以去混淆时。`Dual_EC_DRBG` 中的 `NSA` 后门是一个显著的例外。遗憾的是，关于后门最有趣的研究并没有在
    IACR 会议上发表。


    ### 回溯抗性

    NIST 特别使用的一个术语，指代类似于前向安全性的概念。它是预测抗性的对立面。


    参见 前向安全性。


    ### 后向安全性

    前向安全性的对立面：后向安全性是一种属性，即如果攻击者破解了某些值，未来的消息仍然受到保护。如果整个系统的状态被破解——包括长期和短期密钥——后向安全性通常是不可能的。一个例外是伪随机生成器，通过从可靠源重新种子将不确定性引入系统，防止攻击者从过去的快照确定未来的位。在安全消息的背景下，某些模型假设攻击者会破解某些密钥集，而不一定是整个状态：在这种情况下，可能保证某种形式的后向安全性。


    参见 前向安全性。


    ### 后向安全性

    通常以临时方式定义，后向安全性概念也出现在`妥后安全性`（在安全消息语境下）、`入侵后恢复`（Signal 协议）、`未来安全性`（Signal 协议）、`自愈`（ZRTP）以及`预测抗性`（NIST）等术语中。


    ### Base64

    不是加密。


    ### Bassomatic

    由 PGP 创建者 Phil Zimmermann 设计用于加密 PGP 数据的密码。它在 1991 年被发现不而被 `IDEA` 取代。正如 Zimmermann
    在源代码中注释道：“BassOmatic 的名字源自一个周六夜晚现场的老剧段，其中涉及一台搅拌机和整条鱼。Bassomatic 算法对数据所做的，就像原始的
    Bassomatic 对鱼做的那样。”


    ### BB84

    第一个量子密钥分发（QKD）构造。它由 `Bennett` 和 `Brassard` 于 1984 年描述，基于一年前引入量子货币的概念。


    ### bcrypt

    一种哈希算法：它不加密。旨在通过 1999 年论文《未来适应 Base64 密码方案》解决 1976 年 `crypt` 工具过时的问题。在这篇论文中，作者做了如下预测：“在复杂度理论没有重大突破的情况下，这些算法应允许基于密码的系统适应硬件改进，并在未来的
    20 年内保持安全。”


    ### B

    你可以主张这一预言是准确的，因为你可以调整 bcrypt 使其足够慢以击败密码破解。另一方面，bcrypt 4KB 的内存使用现在太低了，无法防止有效的破解。


    ### 双立图密码分析

    一种通过搜索双立图（bicliques）来加密算法的攻击。在图论中，团（clique）是节点之间互为连接的子集。双立图由两个节点子集组成；第一个子集中的每个节点都与第二个子集中的所有节点连接。


