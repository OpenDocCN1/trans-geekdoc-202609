- fmt: '

    An abbreviation that denotes cryptographic algorithms only doing integer additions,
    word bit shifts or rotations, and XORs (as opposed to, for example, algorithms
    using S-boxes). It was coined by cryptography and security researcher `Ralf-Philipp
    Weinmann` in 2009.


    ### ASIACRYPT

    Asia’s top academic cryptography conference, held every autumn in a different
    location in the Asia-Pacific region since 1990. The only IACR conference that
    includes `IACR` as a substring of its name. Researchers present peer-reviewed
    research papers with titles such as “Structure-Preserving and Re-Randomizable
    RCCA-Secure Public Key Encryption and Its Applications” and “Cryptanalysis of
    GSM Encryption in 2G/3G Networks Without Rainbow Tables.”


    A See `CHES`, `CRYPTO`, `Eurocrypt`, `FSE`, `PKC`, `Real World Crypto`, `TCC`.


    ### Asymmetric cryptography

    A See `Public-key cryptography`.


    ### Attack

    In the context of cryptanalysis, the demonstration of a technique, described as
    an algorithm, that violates a security claim made by the designers of the primitive
    or protocol attacked.


    ### NOT ALL ATTACKS ARE ATTACKS

    If Alice designs a cipher, she could claim that nobody can 1) recover the secret
    key with certainty if 2) they’re given a list of one billion pairs of plaintext
    or ciphertext. Here, point 1 is the security goal and point 2 is the attacker
    model.


    So if you determine how to recover the key with certainty with one million Attack
    `9` plaintext or ciphertext pairs, it qualifies as an attack. If you need 10 billion
    pairs, it doesn’t qualify as an attack. If the chance to recover the key is only
    1/10, it doesn’t qualify either.


    The existence of an attack doesn’t necessarily imply that the attacked primitive
    isn’t safe to use. For example, if an attack works in `2200` operations and the
    security claim was `2256`, you don’t have to worry because in reality `2200` is
    as practically impossible as `2256`.


    Researchers often present attacks in the form of a research paper. When the attack
    is feasible, an actual implementation might be provided as evidence that it works.


    ### Attribute-based encryption (ABE)

    A generalization of identity-based encryption from one attribute (the identity)
    to more than one. It allows you to encrypt a message not to a given recipient,
    but to a set of attributes in such a way that only parties satisfying a valid
    combination of attributes can decrypt the message.


    ABE sounds powerful but hasn’t found many real applications.


    Allegedly, the reason is due to its relatively complex construction (using elliptic-curve
    pairings) and the need for a trusted third party (holding the master key needed
    to generate private keys).


    A See `Identity-based encryption`.


    ### ABE FOR ACCESS CONTROL

    ABE is sometimes pitched as suitable for fine-grained access control. For example,
    you can imagine an organization deploying ABE to encrypt sensitive documents by
    using attributes such as department, clearance level, and project to cryptographically
    enforce multilevel security and role-based access. For instance, a document might
    be encrypted by using a public key with the attributes `{department=ENGINEERING,
    clearance=SECRET, project=LABRADOR}`.


    ABE could then guarantee that if you satisfy only two of these attributes (say,
    your department is `ENGINEERING` and your clearance is `SECRET` but you work on
    the project `HUSKY`), you won’t be able to decrypt the document. More interestingly,
    ABE guarantees that you won’t be able to decrypt the document by colliding with
    someone on the project `LABRADOR` in the `ENGINEERING` department if they only
    have `CONFIDENTIAL` clearance.


    ### 10 Attribute-based encryption (ABE)

    ### Authenticated cipher

    A See `AEAD`.


    ### Axolotl

    ### B

    The original name of the Signal application’s end-to-end messaging protocol.


    A See `Signal protocol`.


    ### B

    ### Backdoor

    A covert feature to bypass an algorithm or protocol’s security. Trapdoors are
    known by users to exist; backdoors usually are not. A backdoor was once defined
    as a feature or defect that allows surreptitious access to data. A good backdoor
    must be undetectable, `NOBUS` (no-one-but-us, or exclusively exploitable by its
    architects), reusable, unmodifiable, and deniable.


    For these reasons, backdoors in cryptographic algorithms are difficult to design
    and are more easily added in implementations, especially when the internal logic
    isn’t open and hard to deobfuscate. The `NSA` backdoor in `Dual_EC_DRBG` is a
    notable exception. Unfortunately, the most interesting research about backdoors
    isn’t presented at IACR conferences.


    ### Backtracking resistance

    Term notably used by NIST to refer to a notion similar to forward secrecy. The
    opposite of prediction resistance.


    A See `Forward secrecy`.


    ### Backward secrecy

    The opposite of forward secrecy: backward secrecy is the property that if an attacker
    compromises some values, future messages remain protected. If an entire system’s
    state is compromised—including long-term and short-term keys—backward secrecy
    is often impossible. An exception is pseudorandom generators, where uncertainty
    can be brought into the system via reseeding from reliable sources, preventing
    an attacker from determining future bits from a past snapshot. In the context
    of secure messaging, some models assume that an attacker would compromise certain
    sets of keys, not necessarily the entire state: in this case, some form of backward
    secrecy might be guaranteed.


    A See `Forward secrecy`.


    ### BACKWARD SECRECIES

    Often defined in an ad hoc manner, the concept of backward secrecy also appeared
    under the terms `post-compromise security` (in the context of secure messaging),
    `break-in recovery` (Signal protocol), `future secrecy` (Signal protocol), `healing`
    (ZRTP), and `prediction resistance` (NIST).


    ### Base64

    Not encryption.


    ### BassOmatic

    A cipher initially designed by Phil Zimmermann, the creator of PGP, to encrypt
    data in PGP. It was found to be insecure and replaced by `IDEA` in 1991. As Zimmermann
    commented in the source code, “BassOmatic gets its name from an old Dan Ayroyd
    Saturday Night Live skit involving a blender and a whole fish. The BassOmatic
    algorithm does to data what the original BassOmatic did to the fish.”


    ### BB84

    The first quantum key distribution (QKD) construction. It was described `Bennett`
    and `Brassard` in 1984 and was based on ideas from the concept of quantum money,
    introduced a year earlier.


    ### bcrypt

    A hash algorithm: it doesn’t encrypt. Defined to address the obsolescence of the
    1976 `crypt` utility in the 1999 paper “A Future-Adaptable 12 Base64 Password
    Scheme.” In this paper, the authors made the following prediction: “Failing a
    major breakthrough in complexity theory, these algorithms should allow password-based
    systems to adapt to hardware improvements and remain secure 20 years into the
    future.”


    ### B

    You can argue that this prophecy was accurate, because you can tune bcrypt to
    be slow enough to defeat password cracking. On the other hand, bcrypt’s 4KB memory
    usage is now too low to prevent efficient cracking.


    ### Biclique cryptanalysis

    An attack against cryptographic algorithms that works by searching for bicliques.
    In graph theory, a clique is a subset of nodes that are all connected to each
    other. A biclique is composed of two subsets of nodes; each node from the first
    subset is connected to all nodes from the second.

