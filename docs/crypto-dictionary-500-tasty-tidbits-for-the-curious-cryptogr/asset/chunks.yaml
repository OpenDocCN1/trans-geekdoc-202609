    On paper, Poly1305 is simple, but its nonstandard arithmetic modulo $2^{130} -
    5$ and key generation mechanism have sometimes proved confusing to implementers.


    ## Polynomial complexity


    Practical complexity, most of the time.


    ## Post-compromise security


    A term used mostly in the context of secure messaging to denote a notion similar
    to backward secrecy.


    A See `Backward secrecy`.


    ## Post-quantum cryptography


    Cryptography schemes designed to remain unbreakable by quantum algorithms. Therefore,
    they can resist the hypothetical quantum computers of the future. Also termed
    quantum-safe and quantum-resilient.


    Post-quantum cryptography **93**


    ### DIGGING INTO POST-QUANTUM CRYPTO


    Post-quantum cryptography mainly targets public-key schemes (signature, encryption,
    key agreement) rather than symmetric schemes, because the latter are mostly immune
    to quantum attacks. For example, symmetric ciphers can thwart the asymptotical
    y quadratic speedup of `Grover’s algorithm` by simply doubling the key length,
    and superpolynomial speedups only occur in peculiar circumstances.


    To be post-quantum, an algorithm mustn’t rely on the factoring or discrete logarithm
    problems, both of which break when subjected to `Shor’s quantum algorithm`. Instead,
    they can rely on NP-hard problems. Most of the proposed post-quantum algorithms
    fall into one of the following categories, depending on the hard computational
    problems on which they build their security:


    * Code-based, relying on error-correcting codes’ decoding problems

    * Multivariate systems of equations

    * Lattice-based, with problems such as learning with errors (`LWE`)

    * Hash-based, or hash tree constructions using cryptographic hash functions

    * Isogenies of elliptic curves


    ## Post-quantum RSA


    RSA so big that it’s practically immune to quantum attacks as well as to any practical
    application. A public key of post-quantum RSA is of the order of one terabyte.
    Post-quantum RSA has been submitted to NIST’s post-quantum cryptography standardization
    project.


    ## Prediction resistance


    A term notably used by NIST to refer to a notion similar to backward secrecy.
    Prediction resistance is the opposite of backtracking resistance.


    A See `Backward secrecy`.


    ## Preimage


    The hash function problem of finding some `M` so that `Hash(M)` = `H` given the
    value `H`. If `H` was chosen by picking some `M₀` at random (among a large enough
    finite set of possible messages) and computing `H = Hash(M₀)`, then even with
    unlimited computational power, an **94** Post-quantum RSA attacker can never identify
    `M₀` with certainty unless `M₀` is the only value that hashes to `H`.


    But in practice, the message sets we deal with are much larger than the hash size;
    thus, any `H` will have many preimages. Also, nobody actually has unlimited computational
    power. Finding any preimage would **P** cost $2^n$, which is practically impossible,
    even if the hash values are as short as $n = 128$ bits.


    ## PRESENT


    Anagram of Serpent. A block cipher that works a lot like Serpent (surprise) but
    smaller. Marketed as an *ultra lightweight cipher*, `PRESENT` has 64-bit blocks
    like `DES` and supports 80-bit and 128-bit keys. According to some very academic
    understanding of *broken*, `PRESENT` is broken by biclique cryptanalysis, with
    respectively $2^{79.76}$.

