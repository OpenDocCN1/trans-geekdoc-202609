    给好奇密码学者的 500 个趣味小知识

    Jean-Philippe Aumasson


    ## 加密字典

    C R Y P T O D I C T I O N A R Y

    给好奇密码学者的 500 个趣味小知识

    Jean-Philippe Aumasson 著

    旧金山


