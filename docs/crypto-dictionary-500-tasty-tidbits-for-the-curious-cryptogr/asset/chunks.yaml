  raw: 'Proof that a number lies in a certain interval without having to reveal the
    number (the zero-knowledge part). Some cryptocurrencies use range proofs to hide
    the amounts transferred, and to ensure the correctness of a protocol’s execution,
    for example.


    **RC4**


    Rivest’s Cipher 4, designed in 1987. A stream cipher with a tumultu-ous history:
    initially, it was a proprietary algorithm from the firm RSA Security and was then
    reverse engineered and published in 1994. It with-stood cryptanalysis surprisingly
    well despite its extreme simplicity and lack of academic peer-review seal of approval—until
    it didn’t, and was found to be insecure (because of statistical biases in the
    first bytes it generates). Still, it was less insecure than most proprietary algorithms
    from that era. RC4 was the basis of WEP, the first Wi-Fi encryption scheme, which
    was broken in part because of RC4’s properties but in larger part because of WEP’s
    flawed design. RC4 was also used in TLS, where its statistical biases could be
    exploited to decrypt data that is encrypted under many different keys. Because
    of its small size, RC4 is also used in malware to obfuscate code or encrypt data
    sent to the malware’s server.


    **RC5**


    A cipher whose only commonality with RC4 is its designer Ronald Rivest; unlike
    RC4, RC5 is not a stream cipher but a block cipher. RC5


    RC5 **105**


    is one of the few ciphers to use data-dependent rotations, an idea that at first
    sounds like it makes the cipher more complicated. But it also turned out to facilitate
    cryptanalysis, because an attacker could then control the rotation values.


    **RC6**


    Similar to RC5. Also a block cipher that uses data-dependent rotations and was
    patented by RSA Security. Designed by Ronald Rivest (along with other people)
    as well, RC6 was one of the candidates in the AES


    competition. It wasn’t chosen by NIST to be the AES but was later used in a software
    implant allegedly designed by the NSA.


    **Real world**


    Academic cryptography’s term to refer to reality, as opposed to the *ideal* *world*
    of the security models needed to rigorously analyze the security of cryptographic
    schemes. If attackers in the real world are less powerful than in the ideal world,
    then security proofs on paper guarantee real security.


    The term is often the source of pleonasms, for example: *previous* *works don’t
    clarify how the code should be instantiated concretely in the* *real world*, *real-world
    applications*, and *practical real-world protocols*.


    **Real World Crypto (RWC)**


    A cryptography conference focused on current real applications of cryptography,
    as opposed to research conferences less concerned with direct applications. Attended
    by participants from academia and industry, it’s the largest cryptography conference
    in terms of participants.


    RWC is held alternately on the US West Coast, East Coast, in Europe, and in the
    Asia-Pacific region. Speakers present contributed talks (which aren’t necessarily
    from formal research papers) with titles such as “Privacy-Preserving Telemetry
    in Firefox” and “Weaknesses in the Moscow Internet Voting System.”


    A See *Asiacrypt,* *CHES,* *CRYPTO,* *Eurocrypt,* *FSE,* *PKC,* *TCC.*


    **Rectangle attack**


    An improvement of the boomerang attack, created to attack the block cipher Serpent.


    A See *Boomerang attack.*


    **106** RC6


    **Related-key attack**


    An attack that makes encryption or decryption queries for instances of the cipher
    whose key is a modified version of the original key, so the modification (as a
    function) is chosen by the attacker. For example, a related-key attack on a block
    cipher might make encryption queries Enc( *K* ⊕ *M*, *P*) where *M* is a fixed
    value defined by the attacker without knowing the key.


    You can only use this attack model against symmetric primitives, because it would
    be too powerful and effective against public-key schemes. Related-key attacks
    aren’t a very realistic threat when the **R**


    key is secret.


    **Research papers**


    What academic researchers must write to keep their jobs. The IACR’s ePrint server
    received 69 research papers in 2000, 661 in 2010, and 1,499


    in 2019. No one has time to read all these articles, which is why it’s cru-cial
    for researchers to write succinct, informative abstracts, as well as clear and
    appealing titles.


    **FUN WITH PAPER TITLES**


    Conventional paper titles are boring; they usual y fol ow the structure “New X


    for Solving Problem Y Using Technique Z.” But researchers sometimes get creative
    with titles, such as the fol owing:


    “Proof of Work Proves Not to Work”


    “Dumb Crypto in Smart Grids”


    “FourQ: Four-Dimensional Decompositions on a Q-curve over the Mersenne Prime”


    “Mining Your Ps and Qs: Detection of Widespread Weak Keys in Network Devices”


    “Prime and Prejudice: Primality Testing Under Adversarial Conditions”


    “The Hunting of the SNARK”


    Research papers **107**


    **Revocation**


    Problem solved in theory but rarely in practice.


    **Rijndael**


    The block cipher that became known as AES after winning the AES


    competition in 2000. The Rijndael name is a portmanteau of the last names of its
    designers, Belgian cryptographers Joan Daemen and Vincent Rijmen. The Google query
    *how do you say rijndael* returns about 100,000 results.


    A See *AES*.


    **Ring signature**


    First described in the paper “How to Leak a Secret” by Rivest, Shamir, and Tauman.
    Ring signatures involve a group of signers such that any signer can create a signature
    that is signer-ambiguous with respect to the subset of signers of their choice.
    In other words, verifiers have no way of identifying the signer; they can only
    know the group of potential signers that they’re in. Unlike with group signatures,
    there is no way to deanonymize the signer.


    A See *Group signature*.


    **RIPEMD-160**


    A hash function designed in 1992. RIPEMD-160 got a second life due to its use
    in Bitcoin and many other cryptocurrencies.


