    ### 密码学（Cryptonomicon）


    一部 1000 页的小说，每隔一页就会提到密码学。它由 Neal Stephenson 编写，并于 1999 年出版。尽管标题可能暗示的那样，但它并不非常克苏鲁风。与其他书中加密内容大多为虚构且荒谬现实不同，*Cryptonomicon*
    依赖于历史事实和真实的加密技术。读者可能记得 Solitaire（由 Bruce Schneier 为书中创建）和范艾克频率干扰（van Eck freaking）。


    ### 加密周期（Crypto period）


    某些管理系统（如 EKMS）中密钥的寿命。在付费电视系统中，加密周期是同一个控制字（即秘密密钥）用于加密音频和视频内容的时间。


    ### 加密变量（Crypto variable）


    NSA 中加密密钥的原始名称。在 NSA 局长决定使用该词之前一直在使用。


    ### 加密大战（Crypto wars）


    一个具有对抗性的术语，指的是美国政府（以及其他西方国家的政府）与活动人士（包括研究人员和隐私倡导者）之间的公开分歧和辩论。政府想要更多的控制和监控能力，通常通过专有算法、出口管制条例、密钥托管机制等；而后者则主张支持开发和使用任何加密机制以维护隐私权利。


    ### 生物悬浮（Cryptobiosis）


    与密码学无关，但同样迷人：这是某些生物在应对不利条件时可以进入的一种近死亡状态。当危险过去，这些生物可以回到原始的代谢状态。有时被用作强加密比喻的水熊，可以进入生物悬浮状态。


    ### 28 加密周期


    ### 加密货币（Cryptocurrency）


    参见 *Crypto*。


    ### 密文（Crypto-Gram）


    由 Bruce Schneier 自 1998 年起出版的月度密码学摘要。


    ### C


    ### 密码学（Cryptography）


    参见 *Cryptology*。


    ***密码学（Cryptologia）***


    可能是关于密码学最古老的学术期刊；自 1977 年以来出版。


    ### 密码学体系（Cryptology）


    参见 *Cryptography*。


    '
- fmt: '

    The *Cryptonomicon* is also a fictional book in the real book: *They know enough,
    in other words, to understand that the Cryptonomicon* *is terribly important,
    and they have the wit to take the measures necessary to keep it safe. Some of
    them actual y consult it from time to time,* *and use its wisdom to break Nipponese
    messages, or even solve whole cryptosystems.*


    *Cryptonomicon* **29**


    *(. . .)*


    the *Cryptonomicon* states that zeta functions are even today being used in cryptography,
    as sequence generators.


    ## Cryptorchidism


    A condition better kept confidential.


    ## Cryptovirology


    Popularized by the 2004 book *Malicious Cryptography: Exposing Cryptovirology*.
    The book describes cryptovirology as “the dark side of cryptography—that device
    developed to defeat Trojan horses, viruses, password theft, and other cyber-crime
    (. . ..) the art of turning the very methods designed to protect your data into
    a means of subverting it.”


    A See *Kleptography*.


    ## CRYPTREC


    The Japanese government’s Cryptography Research and Evaluation Committees in charge
    of establishing official cryptography recommendations.


    ### CRYPTREC’S RECOMMENDED CIPHERS


    As of 2020, CRYPTREC’s top tier is its *e-Government Recommended Ciphers* list,
    which includes the usual public-key schemes, `AES` and its usual modes, and the
    `SHA-2` hash functions. In addition to `AES`, it recommends the block cipher `Camellia`,
    as well as the stream cipher `Kipher-2`.


    The middle tier, or the *Candidate Recommended Ciphers* list, notably includes
    the five block ciphers `CIPHERUNICORN`, `CLEFIA`, `Hierocrypt`, `MISTY1`, and
    `SC2000`. It also includes the `SHA-3` hash functions and `XOFs`, as well as the
    `ChaCha20-Poly1305` authenticated cipher.


    The lower tier, the *Monitored Ciphers List*, is a polite way of referring to
    algorithms you should avoid and includes the usual suspects: `SHA-1` and `3DES`
    (but not `MD5`), as well as `RIPEMD160`.


    ## CSIDH (Commutative Supersingular Isogeny Diffie–Hell man) Pronounced *seaside*,
    the oldest isogeny-based scheme, revisited for efficiency. Also the only post-quantum
    scheme to have attracted some **30** Cryptorchidism interest despite a well-known
    subexponential quantum attack. The proposed parameters “provide relatively little
    quantum security,” in the words of its cryptanalysts; however, its defenders point
    to its unique applications in the post-quantum arena, such as static key exchange.


    It’s not the same as `SIDH`.


    A See *Diffie–Hellman*, *Post-quantum cryptography*.


    ## C


    ## CTF (capture the flag)


    A popular competition in the information security community. In the last 15 years,
    the crypto challenges presented in CTFs have evolved from Vigenère ciphers and
    visual puzzles to tasks involving state-of-the-art research. For example, participants
    in the 2020 edition of PlaidCTF had to break an isogeny-based cryptosystem (`SIDH`)
    and solve a multivariate system of equations.


    ## Cube attack


    A type of higher-order differential cryptanalysis technique, described in 2008.


    ### WHEN CUBE ATTACKS WORK


    In any cryptographic function, `cube` refers to 3D dimensions.

