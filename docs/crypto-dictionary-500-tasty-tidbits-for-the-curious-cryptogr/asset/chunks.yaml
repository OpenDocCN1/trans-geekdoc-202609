    encryption key. Signatures cannot be forged, and a signer cannot later deny the
    validity of his signature. This has obvious applications in *electronic mail*
    and *electronic funds transfer* systems.


    **ROBOT (Return Of Bleichenbacher’s Oracle Threat)**


    Bleichenbacher’s attack, 20 years later.


    A See *Bleichenbacher attack.*


    **ROS**


