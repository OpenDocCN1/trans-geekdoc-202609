    ## 广义生日问题


    寻找值 *X1, . . , Xk* 使得 `Hash(X1) ⊕ · · · ⊕ Hash(Xk) = 0` 的问题。经典碰撞的特例是寻找两个不同的值，使得
    `Hash(X1) ⊕ Hash(X2) = 0`。*生日攻击*通过 `O(2^n/2)` 次哈希函数查询找到此类对，其中 *n* 是输出位数。


    在广义生日问题中，很容易看出 *k* 的值越大，问题越容易。更精确地说，碰撞的代价变为 `O(k² * n/(1+log2 k))` 时间和空间，对于 *k*
    = 4，量级为 `2^n/3`。


