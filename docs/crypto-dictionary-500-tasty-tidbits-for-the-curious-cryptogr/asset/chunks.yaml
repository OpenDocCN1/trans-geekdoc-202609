    ## Homomorphic encryption


    一种满足 `Dec(Enc(M1) ⊙ Enc(M2)) = M1 ⊙ M2` 的加密方法，其中算子 `⊙` 是相同的也可能是不同的，通常是某种类型的加法或乘法。例如，通过教科书级的
    `RSA` 对某些消息 `M` 执行 `Md mod n` 来加密消息，这对于乘法是同态的。


    同态性可能是安全问题也可能是特性，取决于上下文。例如，某些电子投票系统利用 `Paillier` 密码系统的同态属性在不解密的情况下汇总选票。


    全同态加密是一种更通用、更强大的属性，但也更难实现：全同态加密对于密文执行的任何操作都是同态的，而不仅仅是单一组操作。


    ## Heartbleed


    `OpenSSL` 中的漏洞引发了人们对签名的关注。


    ## Hedged signature


    一种需要新鲜随机数的 `ECDSA` 类型。`Hedged signatures`旨在解决这个问题。


    ## HFE (Hidden Field Equations)


    一种多元密钥方案。


    ## HMAC (Hash-based MAC)


    `HMAC` 是一种涉及加密哈希函数的消息认证码（MAC）。记住，`HMAC` 并不是构造 `MAC` 的唯一或最优方法。


    ## H


    ## HPC (Hasty Pudding Cipher)


    一种在 1998 年参加 `AES` 竞赛的被遗忘的块密码。其设计者称之为“第一个全能密码：它可以加密任何块大小的任何密钥长度”。


    ### HASTY PUDDING CIPHER 的特殊特性


    `HPC` 不传统但具有创新，具有多个独特特性，因为它是：

    * 第一个可调优块密码（当时该调优被称为 `spice` 或辅助密钥）

    * 针对 64 位架构进行了优化，是所有 `AES` 候选算法中最快的

    * 支持任何密钥和块大小

    * 由五个子密码组成：`HPC-Tiny`、`-Short`、`-Medium`、`-Long` 和 `-Extended`


    这种所谓的 `spice` 预见了未来对调优的需求。`spice` 对于每个位字段都可以是不同的，从而防止字典攻击。


