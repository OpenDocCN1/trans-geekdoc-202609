    ### 完美前向安全性


    参见 *前向安全性 (Forward secrecy)*。完美前向安全性 89


    ### 基于排列的密码学


    利用单排列提供其他功能的密码学方案。它基于与 `Keccak` 哈希函数相关的研究。


    #### 基于排列的密码学百科


    来自 `Keccak` 扩展家族的基于排列的密码学包含许多构造、模式和原语，我们已尝试在下面的子字典中对其进行编目：


    * `SHAKE`，一种 XOF（是 `FIPS 202` 标准的一部分）

    * `cSHAKE`，`SHAKE` 的变体（是 `NIST SP 800-185` 的一部分）

    * `KMAC`，一种变长 MAC（是 `NIST SP 800-185` 的一部分）

    * `Par elHash`，一种并行的 XOF（是 `NIST SP 800-185` 的一部分）

    * `TupleHash`，一种设计用于哈希数据元组的 XOF（是 `NIST SP 800-185` 的一部分）

    * `Duplex`，海绵构造的扩展

    * `MonkeyDuplex`，`Duplex` 的变体，用于构建认证加密方案

    * `DonkeySponge`，`Duplex` 的变体，用于构建 MAC

    * `Keccup`，`Keccak` 的精轮版本

