  trans: '


    加密在未来最重要的应用将是视频通信，且运行在标准硬件（即 64 位机器）上。。`Hasty Pudding Cipher` 是 64 位机器上用于批量加密的最快算法。


    (. . .) 视频应用中的性能至关重要，因此 `HPC` 应该是 `AES` 的首选方案。


    ### Although

    尽管它仍然未被破解——目前仅发现了等效密钥——但 `HPC` 未被选为 `AES`，甚至没有进入第二轮。它非正规的设计以及缺乏形式的安全论证可能没有起什么积极作用。


    ### HSM (硬件安全模块)

    专门用于运行加密操作和其他任务的硬件设备。`HSMs` 可以有不同的形式，例如机架式服务器或 USB 令牌。`HSMs` 并不一定使用专用硬件（如专用硅电路）运行加密操作。实际上，在大多数情况下，它们完全在软件中运行，由某些通用处理器执行。`HSM
    (hardware security module)` 中的 `S` 指的是它实现的功能；它并不一定意味着 `HSM` 比普通电脑更安全。


    ### HTTP/3

    参见 `QUIC (Quick UDP Connections)`。


    ### 超椭曲线加密

    类似于 `elliptic-curve cryptography`（椭圆曲线加密），但使用了更高维的对象：`hyperelliptic curve`（超椭曲线）的
    `Jacobian`。换来说，我们无法用读者熟悉的其他概念来解释 `Jacobian` 是什么。`hyperelliptic curves` 主要优势在于，由于额外的维度，相同的有限域生成的群比椭圆曲线大。这种强度同时也是一种弱点：当维度过高时（通常超过三维），离散对数问题会变得更容易。


    ### IACR (国际密码学研究协会)

    密码学家的联盟，一家非营利组织，组织最大的学术会议并管理参考平台。


    ### IDEA (国际数据加密算法)

    一种 20 世纪 90 年代的 64 位分组加密算法。使用 Feistel 置换网络。尽管设计方法相当具有启发性，但 `IDEA` 仍抵御了多年的密码分析。针对它的第一个被证明可能比暴力破解更快的攻击直到
    2012 年才出现（这是一种双链攻击）。`IDEA` 是少数使用整数乘法的算法之一，这带来了一些安全益处，但也使得防御侧信道攻击变得困难。


    ### IDEA NXT

    一种与 `IDEA` 几乎没有相似之处的分组算法，除了它们共同使用了 Massey 结构。`IDEA NXT` 最初被命名并发布为 `FOX`，它在反盗版计划中被证明非常有用，不仅是因为它在密码学上的优点。


    ### 基于身份的加密

    一种在不知道某人公钥的情况下发送加密消息的方法。例如，当 Alice 给 Bob 发送加密消息但不知道他的公钥时，基于身份的加密 (`IBE`) 允许她使用
    Bob 的公钥进行计算。例外是 `IBE` 需要一个名为 `key server`（密钥服务器）的信任第三方，该服务器知道某些主私钥并用它生成用户的私钥。因此，Bob
    需要向 `key server` 进行身份验证，证明自己是本人以接收他的私钥。


    ### IES (集成加密方案)

    一种不涉及公钥加密原语公钥加密方案。相反，发送者选择随机密钥对，计算新私钥与接收者公钥之间的 `Diffie-Hellman` 共享密钥，派导出对称密钥，并使用某种认证加密文加密消息。双方均不执行用于加密数据的公钥操作。


    ### 不耐烦的破坏者

    在 `Dolev–Yao` 模型中，一种能够传输数据但无法接收数据的典型攻击者。或者用 Dolev 和 Yao 自己的话来说，“一个只发起对话的人（而不依赖于被说话）。”


    ### 不可能性

    密码学家 Moti Yung 曾说：“当一个软件工程师说某个安全工程问题是不可能的时，那实际上意味着它在密码学上很有趣。”


    ### 不可能差分攻击

    一种利用极不寻常事件而非异常高概率事件的差分攻击。差分分析通常利用在具有特定差值的输入和输出之间发生的具有异常高概率的模式。不可能差分攻击利用的是相反类型的模式，即那些在某些条件下零几概率被观察到的模式。如果密码分析学家注意到这些模式，他们就可以推导出该条件不成立。这些信息可以帮助恢复算法的秘密密钥或子密钥。


    ### IND-CCA

    在选择密文攻击下的密文不可区分性。这是加密方案（包括公钥和对称密钥方案）最强的安全概念。从直觉上看，选择密文在实践中可能意义不大。这是因为你很少能找到攻击者可以解密任何想要密文的系统，而功能更多的加密反而功能更少。此外，某些情况下你确实拥有解密
    Oracle，例如某些 `DRM` 系统。


    ### IND-CPA

    在选择明文攻击下的密文不可区分性。也称为语义安全。其核心思想是：密文不应泄露除长度之外的任何关于明文的信息，即使对于能够获取其选择明文对应的密文的活跃攻击者也是如此。`IND-CPA`
    是对称加密的标准安全概念。例如，`CTR` 或 `CBC` 模式下的分组加密，如果底层分组加密是安全的，且 `CTR` 随机数是唯一的或 `CBC` 初始值不可预测，那么它们就是安全的。这有很多“如果”条件，在实践中可能会导致原本符合
    `IND-CPA` 的方案出现安全漏洞。


    ### 不可消除性

    属于交易或系列交易的属性，具有隐式或显式的时间戳，且无法追溯或进行更改。加密账本机制（如区块链）通常可以解决这个问题。


    ### 区分性

    一种构造（如哈希函数）的属性，如果构建块没有安全缺陷，则该构造保证产生安全的原语。在哈希函数的上下文中，我们讨论与 `random oracle` 的区分性，意味着如果底层的压缩函数或置换是理想的，哈希函数就具有与随机
    Oracle 相同的结构：即没有任何。


    ### 不可区分性

    一种非随机事物看起来与真正的随机事物相同的属性。如果两者是不可区分的，你就无法从非随机事物中提取信息。在加密案例中，非随机事物是密文，你无法提取的信息是关于明文的。


    ### 不可区分混淆 (iO)

    对软件混淆直观概念的数学化。在密码学中，与软件安全一样，混淆过程以程序为输入，产生第二个在某种程度上隐藏了第一个程序工作方式（内部程序）的程序。与软件安全不同，密码学将程序视为可能的抽象表示之一，最常见的是带有
    AND、OR 和 NOT 门的布尔电路。


