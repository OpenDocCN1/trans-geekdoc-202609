    就实际应用而言，后量子加密方案中最具前景的类别。基于晶格的加密通常依赖于某种版本的 `学习误差问题 (LWE)` 问题，特别是它与晶格问题的联系。它可以提供加密/KEM
    和签名方案。由于其结合了可接受的安全保障、性能和构造的多样性，它被认为是最前景的后量子方案类型。


    基于晶格的方案占了 NIST 后量子竞赛第一轮提交方案的 39%，第二轮入选方案的 46%，以及决赛入围方案的 71%。


    参见 `学习误差问题 (LWE) `。


    ### 密信者 (Le Chiffre)

    伊恩·弗莱明间谍小说中的一个角色。任何名字名字意为“密码”的人只能是反派：


    大多昂贵，但为人低调。性欲旺盛。自虐主义者。


    快车专家级司机。精通小型武器和其他形式的格身斗，包括刀术。在帽子带、左鞋后跟和烟盒中各备有三片 `Eversharp` 剃刀片。精通会计和数学。高明赌徒。


    ### 抗泄露加密 (Leakage-resilient cryptography)

    一种尝试使用抽象计算和内存泄漏模型对侧信道信息泄露进行建模。此类模型包括`边界检索模型`、`持续内存泄漏`、`辅助内存泄漏`和`仅计算泄露`等。在这些模型中构建安全方案证明是一项有趣的练习，但实际意义存疑，因为这些模型很大程度上未能捕捉侧信道和物理攻击的复杂现实。


    ### 学习误差 (LWE)

    当线性方程组中的方程包含误差时求解该方程组的问题。`LWE` 推广了`带噪声奇偶校验 (LPN)` 问题，使其具有任意维度和大于 0 和 1 的数字。


    ### 68** 基于晶格的加密

    基于晶格的加密方案通常依赖于某些 `LWE` 问题的硬性。这是因为在平均情况下，`LWE` 的难度与晶格问题中最困难的实例（如 `GapSVP`）一样。生成的加密构造在破解难度上至少与
    `LWE` 一样困难。


    ### 长度扩展攻击 (Length extension attack)

    某些哈希函数的属性，即给定 `Hash(X)`，在不知道 `X` 的情况下，可以找到任何 `Y` 的 `Hash(X || pad || Y)` 的值，其中
    `pad` 是填充位后跟 `X` 长度的编码。易受长度扩展攻击的哈希函数包括所有基于 `Merkle–Damgård` 结构的，例如 `SHA-256` 和
    `RIPEMD-160`。


    较新的哈希函数，如 `SHA-3` 或 `BLAKE3`，不受长度扩展攻击的影响。


    ### 等长度加密 (Length-preserving encryption)

    生成的密文位与其对应的明文位相同的加密；例如，将任何 16 字节明文加密为 16 字节密文，将任何 1 字节明文加密为 1 字节密文，将任何 2 位明文加密为
    2 位密文，以此此类推。在有效负载长度固定的应用中，等长度加密加密加密负载数据。


    等长度加密不应与`格式保留加密 (format-preserving encryption)`混淆。


    ### 保持明文长度 (PRESERVING PLAINTEXT LENGTH)

    等长度加密听起来可能简单，但并非如此。首先，公钥加密方案无法直接提供等长度加密，因为密文扩展是其工作机制的固有属性。例如，`RSA` 加密需要额外的填充和随机性来实现
    `L` 级加密 (`IND-CPA`)。


    在对称加密方面，实现 `IND-CPA` 安全等长度加密的唯一方法是 `nonce` 或 `IV` 不被视为密文的一部分。


    流加密器在本质上是等长度的，因为它们将伪随机位与明文进行 `XOR` 操作，从而在加密过程中保持其长度。同样，`CTR-mode` 创建的密文长度与明文完全相同。


    ### 等长度加密 69

    像 `CBC` 这样的块加密模式呢？如果你使用标准的 `PKCS#7` 填充方案，密文不可避免地比明文长。但有一种名为`密文窃取 (ciphertext stealing)`
    的技术，通过打乱最后块中的字节来获得与明文长度相同的密文。


    ### LFSR (线性反馈移位寄存器)

    参见 `反馈移位寄存器`。


    ### 轻量级加密 (Lightweight cryptography)

    针对 IoT 设备和其他具有内存和逻辑限制平台的优化的加密。但这些受限平台通常有独特的局限性。因此，关于轻量级加密的学术研究的相关性令人失望。


    ### 线性密码分析 (Linear cryptanalysis)

    一种用于对称密码的密码分析技术，利用了线性方程中描述的模式。线性密码分析看起来与差异密码分析完全不同，但实际上与它密切相关。最成功的攻击是针对 DES 的。


    ### 相关性 (Linkability)

    签名方案的一种属性，允许攻击者确定两个签名是否由同一个签名者签发。当然，标准签名（如 `ECDSA`）在设计上就是关联的，这没有问题。


    ### LM hash

    `LAN Manager hash` 的缩写，用于对用户哈希的函数（早期 Windows 版本）。`LM hash` 是更强大的 `NT hash` 的前身。


    参见 `NT hash`。


    ### 70** LFSR (线性反馈移位寄存器)

    ### LM hash 的缺陷 (IMFECTION OF LM HASH)

    回顾过去，`LM hash` 非常脆弱：可以轻松恢复原始密码。使用 `LM hash` 哈希密码的步骤如下：


    1. 将小写字母转换为大写字母。

    2. 如果密码超过 14 个字符，则截取前 14 个字符；否则，用空字节填充至 14 字节。

    3. 使用两个 `DES` 实例加密字符串 `KGS!#$%*`，一个使用填充后密码的前 7 个字节，另一个使用后 7 个字节（记住 `DES` 的密钥是
    56 位）。

    4. 哈希值是两个密文的拼接。


    ### Luby–Rackoff

    参见 `Feistel network`。


    ### Lucifer

    由 IBM 的 Horst Feistel 设计的块加密，它导致了 `DES`。它最初并不是 Feistel 网络，而是类似于 `AES` 的替代置换网络，块大小为
    32、48 或 128 位。`Lucifer` 最初在 `APL`（一种语言）中实现，代号为 `Demonstration`。但由于 `APL` 工作空间限制了项目名称，`Demonstration`
    变成了 `Demon`，后变为 `Lucifer`。


    ### M

    ### M

    ### MAC (message authentication code)

    不是签名，但非常接近：就像公钥签名一样，`MAC`


    在没有密钥的情况下不可伪造的，但与公钥签名不同，`MAC` 不提供不可否认性。


    ### MAC (message authentication code) 71

    在理论上，`MAC` 可以在不可伪造的同时泄露关于明文的信息，但在实践中大多数 `MAC` 并不如此。


    ### MAGENTA

    `AES` 竞赛中一个不幸的候选方案，在第一次 `AES` 会议上展示后几分钟内就被破解了。一位参与者评论道：“情况非常糟糕，一些参与者开始进行实时密码分析，并提出了在现场破解该算法的攻击方法。我很惊讶那个德国人竟然能保持冷静。整个场面非常羞耻。”


    ### 延变性 (Malleability)


