    这是最重要的加密软件之一。首先它是一个命令行工具，支持多种加密操作（密钥生成、签名、加密、证书创建、各种格式的编码/解码等），适用于多种算法（块密码、哈希函数、椭圆曲线等，以及旧遗留算法）及其参数，并且可以运行在多种
    CPU 类型和操作系统上。


    如果这还不够，OpenSSL 还提供了两个库：加密库（`libcrypto`）和 SSL 及 TLS 协议的实现（`libssl`），后者使用了 `libcrypto`。


    # OPENSSL 的厨房 (OPENSSL’S KITCHEN)


    OpenSSL 就像一家 24 小时候营业的餐厅，提供汉堡、披萨，以及日本寿司、法国红酒鸡、墨西哥塔可和瑞士瑞士奶锅。要让所有的菜肴达到同样的质量水平是非常困难的。


    这意味着厨房里一定一团糟。正如密码学教授马修·格林（Matthew Green）曾所说：


    `OpenSSL 是加密库中的航天飞机。它能带你进入太空，前提是你有一支团队来按下操作所需的数万个按钮。`


    ## 预机 (Oracle)


    就像水晶球一样，一个响应你请求的抽象实体，密码学家称之为“预机查询”（oracle queries）。


    加密预机的概念源于复杂度理论中的“预机”（oracles），例如，你尝试使用一个 `oracle` 来解决问题 1，该预机在给定问题 2 描述的情况下，神奇地给出问题
    2 的解决方案。例如，给定一个分解预机，你可以破解 RSA。


    ### 预机 85 (Oracle 85)


    预机是研究论文中使用的一种抽象，作为简化安全论证、证明或密码分析攻击的设备。你可能会遇到加密预机、解密预机、分解预机等。随机预机（Random oracles）由于其在安全性证明中的独特作用而最为常见。


    参见 `随机预机` (Random oracle)。


    ## OTR (不记录加密 Off-the-Record)


    最初为同步通信设计的端到端加密协议。能够运行在消息协议（如 XMPP 或 IRC）之上。OTR 的一个独特之处是它的否认性（deniability），对方可以通过泄露用于签名消息的
    MAC 密钥来否认发送过该消息。OTR 是后来被称为 Signal 协议的基础。


    ## P


    ### 填充预机攻击 (Padding oracle attack)


    一类旁信道攻击，利用关于某些加密消息的填充（padding）是否有效的信息。攻击者可以通过测量解密执行时间来获取这些信息，而解密时间有时取决于填充的正确性。最常见的填充预机攻击是应用于
    CBC 块密码模式的攻击、针对 PKCS#1 v1.5 的 Bleichenbacher 攻击，以及针对 OAEP (PKCS#1 v2) 加密的 Manger
    攻击。填充预机的概念可以泛化为格式预机（format oracles），它们会揭示解密消息中是否存在某些已知模式（例如，特定的编码或字符集）。


    开发者有时会无意中部署（或缺乏）填充预机攻击的防御措施——即当某些实现没有正确检查填充时（但这会产生其他问题）。


    参见 `Bleichenbacher 攻击` (Bleichenbacher attack)、`CBC (密码块链)` (CBC (cipher block
    chaining))、`Manger 攻击` (Manger attack)。


    ### 86 OTR (不记录加密 Off-the-Record)


    ### Paillier 加密系统 (Paillier cryptosystem)


    一种在数学上比 RSA、ElGamal 和 IES 更有趣的公钥加密方案。Paillier 加密具有稀有的加法同态性属性，这意味着 `Dec(Enc(M 1)
    × Enc(M 2)) = M 1 + M 2`。它的安全性基于分解问题的困难性以及一个相关问题——判定复合剩余数问题（decisional composite
    residuosity problem），该问题随 Paillier 加密系统引入，关于在给定 `n` 和 `y` 的情况下，判断是否存在 `x` 使得 `y
    = xd mod n2`。


    ## 配对 (Pairing)


    与蓝牙的配对操作无关。配对是一个将两个群元素映射到另一个群元素的映射 `e()`，具有以下属性，对于任何 `R`，`S`, `T`：`e(R + S, T)
    = e(R, T) e(S, T)`。这被称为双线性（bilinearity），也是配对在密码学中有用的原因。这些属性也适用于双线性配对：`e(S, -T)
    = e(-S, T) = e(S, T)-1`，`e(aS, bT) = e(S, T) *ab`。配对的 Diffie–Hellman 问题的双对应形式如下：给定
    `P`, `aP`, `bP`, `cP`，找到 `e(P, P) *abc`。对于选择良好的配对类型和椭圆曲线，这个问题被认为与其经典版本一样困难。


    ## 基于配对的密码学 (Pairing-based cryptography)


    使用配对的密码学，废话。椭圆曲线上的配对允许创建双线性映射，这允许你在某些困难性假设下构建基于离散对数的经典椭圆曲线加密无法实现的功能。这些功能包括单轮三方密钥协商、基于身份的加密、基于属性的加密、短签名和可验证随机函数。


    ### 基于配对的密码学 87 (Pairing-based cryptography 87)


    ### 三方密钥协商 (TRIPARTITE KEY AGREEMENT)


    密码学家开始在密码学中使用配来实现仅需一轮通信的三方密钥协商。通过配对，工作原理如下，给定一个公共基点 `P`：


    1. Alice 生成一个整数 `a` 并广播 `aP`。

    2. Bob 生成一个整数 `b` 并广播 `bP`。

    3. Chris 生成一个整数 `c` 并广播 `cP`。


    然后 Alice 计算共享密钥为 `e(bP, cP) * a = e(P, P) * abc`。Bob 和 Chris 执行类似的操作以获得相同的值。


    ## PAKE (密码认证密钥交换 password-authenticated key exchange)


    一种认证密钥协商（或交换）协议，其客户端验证依赖于密码的知识。在大多数 PAKE 中，服务器不知道密码，只知道从中派出的数据。双方都知道密码的 PAKE 称为平衡
    PAKE（balanced PAKEs）。


    PAKE 防止在发送密码或哈希值的密钥交换方法中常见的密码猜测攻击。


    但这种微小的收益代价是巨大的：PAKE 增加了复杂性和部署成本，这就是它们很少被使用的原因。正如马修·格林所写的：“很多人根本不想运行`密钥交换`协议！他们只想验证用户是否知道密码。”


    ## 范式 (Paradigm)


    密码学中一个过度使用的词，特别是当它前面有 `new` 时。


    ## 密码哈希函数 (Password hash function)


    一种目标是慢而不是快的哈希函数。


    ### 为什么密码哈希是不安全的 (WHY PASSWORD HASHES ARE INSECURE)


    如果 `M` 是一个任意位字符串，那么给定一个哈希值 `H = Hash(M)`，你永远找不到 `M`。原因是：1) 如果 `H` 足够长，寻找 `H` 的任何原像在计算上是不可行的；2)
    即使具有无限计算能力，你也无法在所有映射到 `H` 的值中识别出 `M`，根据鸽巢原理，这是不可能的。


    但如果你知道 `M` 是由人类选择的密码，检索它就会变得容易得多。你可能找到一个哈希值为 `H` 的密码 `M`，并有理由相信它就是最初被哈希的密码，因为可记忆的密码远少于
    `H` 的可能值。换句话说，作为未知输入值，典型密码的熵远比任意字符串 **P**


    低。


    ### 88 PAKE (密码认证密钥交换 password-authenticated key exchange)


