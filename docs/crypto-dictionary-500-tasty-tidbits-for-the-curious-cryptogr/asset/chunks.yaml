    ## Grover’s algorithm


    A quantum algorithm that in theory can break symmetric ciphers in `O(2^n/2)` instead
    of `O(2^n)` complexity, where `n` is the key length.


    ### GROVER: READ THE FINE PRINT


    You might think that, as a result of `Grover’s algorithm`, ciphers with a 128-bit
    key would have only 64-bit security. But in reality, breaking a cipher wouldn’t
    become quadratical y more cost-efficient, because of various reasons, including
    the following:


    * Running `Grover’s algorithm` to break, say, `AES` would require a quantum implementation
    of `AES`, which is much slower and more costly than any conventional implementation.

    * `Grover’s algorithm` doesn’t appear to scale the way classical brute force does,
    in the sense that it can’t distribute computations across multiple units or attack
    multiple instances simultaneously.

    * The `O()` asymptotic notation hides constant factors that might prove non-negligible
    in reality.


