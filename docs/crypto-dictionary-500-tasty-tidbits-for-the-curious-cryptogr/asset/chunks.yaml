    听起来像是可否认加密（deniable encryption），但并不一定是可以否认的。使用非承诺加密（non-committing encryption），可以创建一个伪造密文，使其看起来像真实的密文。通过公开一个密钥对和连接密文与明文的随机位，可以证明密文是由任何明文生成的。


    ### 非可外包性 (Non-outsourceability)

    工作量证明方案的一种属性，其工作量在不泄露证明者私钥的情况下无法被外包。因此，它防止了池化挖矿（即第三方执行部分工作并理应获得部分挖矿奖励）。这种证明必须在不使用私钥的情况下可以被高效验证。


    ### 非诽谤性 (Non-slanderability)

    在环签名（ring signatures）中，这是一种安全属性，防止攻击者伪造可以链接到授权签名者组中特定成员的有效签名。虽然表达略有不同，但非诽谤性等同于不可伪造性（unforgeability）。


    ### NSA (国家安全局)

    密码学家们最喜欢的三个字母机构。NSA 雇用了许多密码学家，但从不在同行评审会议上发表论文。


    然而，它在密码学研究领域非常活跃，设计了已有的公共标准（如 `DSA`、`SHA-2` 和不幸的 `Dual_EC_DRBG`）、未分类的候选标准（块密码
    `SIMON` 和 `SPECK`）、解密系统（`Fortezza` 加密卡，包括 `Skipjack` 块密码）以及许多机密算法。NSA 的密码分析能力很大程度上未公开。


    参见 *Suite A*。


    ### NT hash

    俗称为 NTLM hash，是 MS Windows NT LAN Manager (NTLM) 协议族中使用的密码哈希函数，是对传统的 LAN Manager
    协议的升级。`NT hash` 只是 `N hash` 的 `MD4` 哈希。


    #### NT hash 81

    编码后的用户密码。它比 `LM hash` 好，但也容易被破解。


    参见 *LM hash*。


    ### NTRU (n 阶截断多项式环单元)

    最早的基于格的密码系统之一，设计于 1996 年。被研究了多年，也许因为它拥有专利并已商业化。


    人们对 NTRU 的兴趣重启在 2016 年 `NTRU Prime` 的设计中达到顶点，它是 NTRU 的变体，其作者简洁地定义为“一种高安全素数阶大伽罗瓦群不变模数理想格的加密密码学的高效实现”，其中“素数阶”等是三个
    (. . .）从攻击者手中夺走了多种数学工具的特征。`NTRU Prime` 已提交给 NIST 的后量子竞赛。


    ### 空密码 (Null cipher)

    当作为加密套件出现时，这是一个意味着`no encryption`（无加密）的术。例如，早期 TLS 版本支持 `null cipher`。`null cipher`
    不需要密钥，我想你可以认为它是最快的密码。


    ### O

    ### OAEP (最优非对称加密填充)

    在使用 `RSA` 或 Rabin 方案进行公钥加密之前，对消息进行安全填充的方法。计算 `me mod n` 确实不是一种使用 `RSA` 操作来加密消息
    `m` 的非常安全的方法。相反，`OAEP` 可以消息转换为随机字符串，从而破坏纯 `RSA` 的可变性性和同态性。根据 `PKCS#1 v2.2` 标准，`RSA-OAEP`
    现在是使用 `RSA` 加密的推荐方法。


    参见 *All-or-nothing transform (AONT)*，*Manger attack*。


    ### 盲知密钥管理系统 (OKMS)

    一种持有主密钥并与客户端交互以派生密钥的服务，由于使用了用于密钥派生的（部分）盲知 `PRFs`，该服务在不知道这些密钥的情况下进行操作。


    ### 82 NTRU (n 阶截断多项式环单元)

    ### 盲知 PRF (OPRF)

    ### O

    一种双方协议，其中服务器知道密钥 `K`，客户端为某些 `X` 计算 `PRF(K, X)`。


    ### 盲知 RAM (ORAM)

    一种安全的内存模型，使得攻击者在观察内存时无法获知内容或访问模式。


    ### 盲知传输 (Oblivious transfer)

    一种在两个参与者之间的协议，其中接收者选择一个想要的部分，但发送者不知道是哪一个。想象你想从大量书中购买一本，但发送者不知道是哪一本。盲知传输允许客户端在只知道两个值中的一个（其密码）的情况下计算这两个组合的哈希。


    ### 隐晦性 (Obscurity)

    密码学家眼中的异端。但在现实中，当密码学只是安全系统的一部分时，你有时需要隐藏其逻辑以满足安全目标。


    ### 隐晦性 83

    ### OCB (偏移密码本模式)

    块密码最简单高效的认证加密模式之一，也是密码学脆弱性的演示。尽管有安全证明和标准化，攻击者成功破解了 OCB 的第二个版本 OCB2。OCB1 和 OCB3
    虽然非常相似，但看起来是安全的。


    ### 一次扇 (One-time pad)

    通常被描述加密的典范或完美密码，因为它在数学上被证明是绝对安全的。但单独使用一次扇实际上是一种弱密码：它是轻易延变的、未认证的且不抗误用的。


    ### 单向函数 (One-way function)

    现代密码学的基石。易计算难反转：对于随机未知 `x` 的 `f(x)`，寻找一个值 `y` 使得 `f(y) = f(x)` 在计算上是困难的。（正式定义比这更严谨。）如果你只有一个单向函数，就可以构建大多数密码原语；在实践中，密码学中的许多函数（如哈希函数）看起来是单向的。但在理论上，我们并没有证明单向函数确实存在。事实上，单向函数的存在意味着
    P ≠ NP（证明留给你完成）。


    ### Onion-AE

    在 Tor 洋葱路由背景下，强认证加密的概念。在洋-AE 加密中，消息的真实性必须在最后一个（出口）节点检查，但它涵盖了从初始发送者的整个路径。


    ### OPAQUE

    发音为 *O-PAKE*。O 代表盲 PRF，它是 OPAQUE 密码认证密钥交换（PAKE）中最有趣的部分。它允许客户端在只知道两个值中的一个（其密码）的情况下计算这两个组合的哈希。存在一些注意事项：尽管认证是关于证明密码知识，但客户端还需要传统的公钥对，因此必须保护其私钥。此外，为了获得具有安全密钥共享的完整
    PAKE，它必须与另一种协议结合，例如 `HMQV`。


    参见 *盲知 PRF (OPRF)*。


    ### OpenSSL


