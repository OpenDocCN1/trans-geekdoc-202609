    ### Level 2: Level 1 plus some tamper evidence—for example, the ability to detect
    physical attacks after they occur by observing broken seals on the box.


    ### Level 3: Level 2 plus some tamper detection—for example, the platform’s ability
    to detect physical attacks in real time and reset itself to factory `F` mode if
    it believes it’s under attack. This level also includes some physical isolation
    and stronger authentication.


    ### Level 4: Level 3 plus some stronger tamper detection with the guarantee that
    the module will detect most physical attack attempts and reset itself when under
    attack (for instance, by zeroizing secrets).


    It’s worth noting that `FIPS 140-2` doesn’t measure a system’s resilience to physical
    attacks so much as the system’s ability to detect them. This acknowledges that
    most systems are vulnerable to physical attacks given the right equipment.


    Additional, the fact that a system is `FIPS 140-2` certified doesn’t mean that
    it’s perfectly secure. The reason is that 1) `FIPS 140-2` is limited by its scope
    and by the definition of the security requirements of each of its levels, and
    2) even in a certified product, the certification usually only applies the cryptographic
    module (and sometimes only parts of it). In other words, if some application calls
    a `FIPS 140-2` Level 3 module to encrypt some message, and the application’s software
    has a flaw that leaks said plaintext, don’t blame the certification.


    ## FIPS 140-3


    New version of `FIPS 140-2` since 2019. It introduces requirements against noninvasive
    attacks and the concepts of `Normal Operation` and `Degraded Operation`, among
    others.


    A See *FIPS 140-2*.


    `FIPS 140-3 47`


    ## Forgery


    An attack whose goal is not to recover some secret but to create a supposedly
    hard-to-generate value without the knowledge of some secret.


    Unforgeability is the corresponding security notion and is most commonly associated
    with signatures and MACs. More generally, unforgeability must apply to any scheme
    for which an attacker should have trouble creating a valid output. These include
    ciphertexts in authentication encryption and zero-knowledge proof protocol transcripts.


    Sometimes forgeability is a desirable property (for example, to achieve deniability.


    ## Formal verification


    A form of testing that relies on mathematical guarantees. Applied to security
    protocols, formal verification includes symbolic and computational verification
    techniques, which assess whether a protocol satisfies properties such as confidentiality
    and authentication. Another example is programming languages that can certify
    that an implementation is functionally correct with respect to a specification,
    or that it’s free of certain classes of side channels.


    High-assurance applications often receive some sort of formal verification, such
    as the Common Criteria security evaluation framework’s `EAL7` assurance level.
    Still, don’t be fooled into thinking formal verification means proof that everything
    about a crypto implementation is secure.


    ## Format-preserving encryption


    A type of encryption that produces a ciphertext with the same format as the original
    message. For example, the format-preserving encryption of a 16-digit credit card
    number would produce another 16-digit number. Format-preserving encryption is
    often useful for encrypting database entries whose field type must have a specific
    format, such as social security numbers, IP addresses, and ZIP codes. Although
    the problem sounds simple, it requires sophisticated techniques, especially for
    the more general problem of creating ciphers from arbitrary domains of values.


    ## Forward secrecy


    The notion that something remains secure if something else is compromised at a
    later time. What counts as *something*, *something else*, and *a* *later time*
    depends on the context. Forward secrecy is usually a relevant `48 Forgery` security
    notion for key agreement protocols, secure messaging protocols (and their ratchetting
    mechanisms), pseudorandom generators, pseudorandom functions, MACs, and other
    stateful objects.


    It’s usually easier to achieve forward secrecy than backward secrecy, because
    it’s easier to erase the past than to make the future unpredictable (in cryptography,
    at least).


    A See *Backward secrecy*.


    ## FOX


    A See *IDEA NXT*.


    ## FSE (Fast Software Encryption)


    A conference focused on the design and cryptanalysis of symmetric cryptography
    primitives, including slow and hardware-oriented hash functions. `FSE` is sometimes
    viewed as an applied cryptography conference, despite the fact that it rarely
    focuses on real-world algorithms, let alone real-world attacks.


    Researchers present peer-reviewed papers with titles such as


    “Improving the MILP-Based Security Evaluation Algorithm Against Differential/Linear
    Cryptanalysis Using a Divide-and-Conquer Approach” and “Low AND Depth and Efficient
    Inverses: A Guide on S-boxes for Low-Latency Masking.”


    A See *Asiacrypt*, *CHES*, *CRYPTO*, *Eurocrypt*, *PKC*, *Real World Crypto*,
    *TCC*.


    ## Fully homomorphic encryption


    A See *Homomorphic encryption*.


    ## Functional encryption


    A type of cryptographic scheme that looks like magic: when designed for some function
    `f()`, decrypting `Enc(M)` yields not `M` but `f(M)`. But like many of the magic
    cryptographic schemes, it’s of limited use in practice, because it can efficiently
    support only simple functionalities.


    To build functional encryption schemes, cryptographers can use the trick of leveraging
    indistinguishability obfuscation: in other words, the decryption process that
    finds `f(M)` would consist of an obfuscated program that first retrieves `M` and
    then computes `f(M)` without ever exposing `M`.


    `Functional encryption 49`


    ## Future secrecy


    A term coined in the context of the Signal protocol to refer to a notion similar
    to backward secrecy. Indistinguishable from break-in recovery.


    A See *Backward secrecy*.


    ## Fuzzy extractor


    A scheme for extracting the value of some-entropy secret from multiple noisy readings,
    each with random errors, to derive a key. This might sound a lot like an error-correcting
    code, but it’s different: first, the value read is not a codeword (which has redundancy
    in it and thus is suboptimal entropy), but instead a value of potentially maximal
    entropy; second, the value is not read once but multiple times; and third, the
    enrollment data used to decode the secret must not leak information about said
    secret. Therefore, you can store it without privacy leaks.


    You might find extractors used in biometric authentication applications, which
    have to extract a value that uniquely identifies an individual. These applications
    typically must extract this value from noisy measurements and without relying
    on a database of sensitive data, such as data about each individual. Conversely,
    in a traditional approach to authentication, you would compare a new measurement
    to a registered one to identify a person.


    ## G


    ## Generalized birthday problem


    The problem of finding values *X1, . . . , Xk* such that `Hash(X1) ⊕ · · · ⊕ Hash(Xk)
    = 0`. The special case of a classical collision is that of finding two distinct
    values, such that `Hash(X1) ⊕ Hash(X2) = 0`. The *birthday attack* finds such
    pairs in `O(2^n/2)` queries to the hash function, where *n* is the output bit
    size.


    In the generalized birthday problem, it’s easy to see that the larger the value
    *k*, the easier the problem. More precisely, the cost of a collision becomes `O(k^2
    * n/(1+log2 k))` time and space, or of the order of `2^n/3` for *k* = 4.


    `50 Future secrecy`


    ## GNFS (General Number Field Sieve)


    The best (nonquantum) algorithm for factoring large integers.


    ## GOST

