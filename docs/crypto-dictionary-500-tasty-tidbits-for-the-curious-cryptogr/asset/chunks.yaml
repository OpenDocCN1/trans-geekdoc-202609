    CSA3 is very different. Although its full design isn’t public, it’s known to combine
    `AES` with another (patented) block cipher running in some unusual operation mode.
    Additional y, it includes components designed to prevent software emulation. Per
    its design, `CSA3` should run in dedicated hardware circuits only, like those
    found in the systems-on-chip of set-top boxes.


    ## E


    ### E0

    A stream cipher used in Bluetooth. Broken in theory but not in practice. The more
    recent Bluetooth Low Energy standard uses `AES-CCM` instead.


    ## ECB (electronic codebook)

    The most obvious way to use a block cipher, where each block is processed independently
    of the others. `ECB` is the most robust mode against repeated IVs and nonces.
    But everybody knows ECB is insecure because you can see the penguin.


    ## ECC

    An acronym for either elliptic-curve cryptography or error-correcting code, depending
    on the context; confusion between the two can lead to unfortunate situations.

    A See *Elliptic-curve cryptography*.


    ## 38 DVB-CSA


    ### ECDLP (Elliptic-curve discrete logarithm problem)

    Arguably the most important computational problem as far as cryptographic security
    is concerned: given the points `P` and `xP`, find the number `x`, where multiplication
    happens in the group of an elliptic curve over a finite field.

    Elliptic-curve schemes have replaced many instances of `RSA` or classical Diffie–Hellman,
    for example, in the `TLS 1.3` standard.


    ### ECDSA (Elliptic-curve DSA)

    The elliptic-curve counterpart of `DSA`, whose security requires the hardness
    of `ECDLP`, but is not totally equivalent to it. As far as we know, `ECDLP`’s
    hardness only implies `ECDSA`’s security (unforgeability) in the generic group
    model, which is an abstraction of `ECDSA` but not E exactly `ECDSA`.

    A See *DSA (Digital Signature Algorithm)*.


    ### ECDSA IN THE PLAYSTATION 3

    Many people first learned about the `ECDSA` algorithm after attackers discovered
    that the PlayStation 3 used a weak implementation of it. The implementation’s
    nonce—an argument supposed to be unique for each signature, typical y by being
    chosen at random—remained the same, al owing the attackers to easily retrieve
    the private key.

    (Spoiler: the key was `46 DC EA D3 17 FE 45 D8 09 23 EB 97 E4 95 64 10 D4 CD B2
    C2`.)

    Those who missed the PS3 hack later discovered `ECDSA` as the signature algorithm
    in Bitcoin and Ethereum, where `ECDSA` keys were sometimes also compromised because
    of repeated or biased nonces in flawed wallet software.


    ### ECIES (Elliptic-curve IES)

    The elliptic-curve version of the `IES` public-key encryption scheme. Like `IES`,
    `ECIES` is a hybrid encryption scheme, therefore it needs a symmetric cipher to
    actually encrypt messages.

    A See *IES (Integrated Encryption Scheme)*.

    ECIES (Elliptic-curve IES) 39


    ## Ed25519

    `EdDSA` signatures using `Curve25519`’s Edwards representation rather than the
    Montgomery format used by `X25519`, which causes developers a lot of headaches.

    A See *Curve25519*, *EdDSA*.


    ## EdDSA

    A deterministic elliptic-curve signature scheme based on Schnorr’s scheme. The
    main alternative to the `ECDSA` standard. In its purest form, it’s resilient to
    non-collision-resistant hash functions and is famously used by `Ed25519`.


    ## EKMS (Electronic Key Management System)

    A legacy key management system designed by NSA to secure communications for the
    US Army and other organizations.


    ## TOO MANY KEYS

    If you thought key management for web applications was hard, wait until you have
    to do it in an environment with different classification levels, networks, device
    types, data management policies, and staff training.

    The following (incomplete) list of `EKMS` key abbreviations illustrates the complexity
    of managing keys in its target environments:

    - `AEK`: Algorithmic encryption key

    - `KEK`: Key encryption key

    - `KPK`: Key production key

    - `OWK`: Over the wire key

    - `TEK`: Traffic encryption key

    - `TrKEK`: Transmission key encryption key

    - `TSK`: Transmission security key

    The system classifies keys depending on their role (operational, maintenance,
    or test). Operational keys, in turn, can have a variety of different attributes:
    they can be emergency contingency keys, joint theater keys, or allied keys, among
    others.


    ## 40 Ed25519


    ### Electronic codebook

    A cipher, in archaic NSA parlance. For example: “Electronic codebooks, such as
    the Advanced Encryption Standard, are both widely used and difficult to attack
    cryptanalytically.”


    ### ElGamal

    For many years, the only public-key encryption scheme used and taught in crypto
    classes other than `RSA`. Introduced in the 1985 article “A Public Key Cryptosystem
    and a Signature Scheme Based on Discrete Logarithms,” which modestly started with
    the following abstract:

    A new signature scheme is proposed together with an implementation of the Diffie–Hellman
    key distribution scheme that achieves a public E key cryptosystem. The security
    of both systems relies on the difficulty of computing discrete logarithms over
    finite fields.

    `ECDSA` eventually overshadowed the signature scheme, and currently, ElGamal encryption
    is rarely used. Instead, cryptographers use `ECIES` except in applications in
    which the message must be directly public-key-encrypted (as in some e-voting systems).

    The in-the-exponent variant of `ElGamal` encryption has two interesting properties:
    it is additively homomorphic, and decryption is impossible (unless you solve a
    discrete logarithm). Despite the latter suboptimal property, this version proved
    useful in threshold signature schemes.


    ### Elligator

    A method of encoding elliptic-curve points as random-looking strings to make public
    keys indistinguishable from encrypted data.


    ### Elliptic curve

    Not an ellipsis, not a curved line. A set of points on the plane whose (x, y)
    coordinates satisfy the curve’s equation, which usually has the form `y^2 = x^3
    + ax + b`, where `a` and `b` are fixed parameters. Cryptographic applications
    only work with points whose coordinates belong to some finite field; therefore,
    the curve has a finite set of points.


    ## FROM MATH TO CRYPTO

    Elliptic curves were, of course, discovered before cryptography, and mathematicians
    studied them much earlier. For example, elliptic curves played a role in the proof
    of Fermat’s Last Theorem.

    Cryptography takes advantage of the fact that an elliptic curve’s points happen
    to form a group structure with respect to a geometrical defined group operation,
    denoted as point addition. For well-chosen curve types, the equivalent of the
    discrete logarithm problem becomes difficult in such groups, which is why these
    curves prove useful in public-key cryptography.


    ### Elliptic-curve cryptography

    Public-key cryptography relying on elliptic curves and related hardness problems
    (the discrete logarithm, or a variant thereof). Elliptic-curve cryptography can
    do almost everything that legacy public-key cryptography can do, in a way that
    is often faster and uses shorter keys. That includes encryption, key agreement,
    and signature. In addition, you can use it for more exotic cryptographic schemes
    due to its support of pairings.

    A See *Pairing-based cryptography*.


    ### Encipherment

    A synonym of encryption with emphasis on the act and operations carried out during
    the encryption process. To encipher, like the French verb *chiffrer*, comes from
    the Arabic رفص (*sifr*, the digit zero), whereas *to* *encrypt*, like the verb
    *crypter*, comes from the Greek *kryptos* (concealed, secret).


    ### End-to-end encryption (E2EE)

    Encryption is said to be end-to-end when only the dedicated recipient(s) can decrypt
    the messages. It sounds straightforward but is actually an arduous engineering
    problem.

