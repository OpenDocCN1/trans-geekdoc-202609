    在不泄露数字本身的情况下证明一个数字位于某个区间内（零知识部分）。某些加密货币使用范围证明（range proofs）来隐藏传输的金额，例如为了确保协议执行的正确性。


    ### RC4


    Rivest''s Cipher 4（RC4 算法），设计于 1987 年。这是一种有一段坎坷历史的流密码：最初，它是 `RSA Security` 公司的私有算法，随后在
    1994 年被逆向工程并发布。尽管其极其简单且缺乏学术同行评审的背书，但它出人意料地抵御了密码分析很久——直到它不再有效，并被发现是不安全的（因为其生成的第一个字节中存在统计学偏置）。尽管如此，它仍然比那个时代的大多数私有算法安全。`RC4`
    是第一个 Wi-Fi 加密方案 `WEP` 的基础，`WEP` 的破解部分是因为 `RC4` 的特性，但很大程度上是因为 `WEP` 的设计缺陷。`RC4`
    也用于 `TLS`，其统计学偏置可以被利用来解密使用许多不同密钥加密的数据。由于体积较小，`RC4` 也被用于恶意软件以混淆代码或加密发送到恶意软件服务器的数据。


    ### RC5


    这种密码与 `RC4` 的唯一共同点是设计师 `Ronald Rivest`；与 `RC4` 不同，`RC5` 不是流密码，而是块密码。`RC5`


    #### RC5 105


    `RC5` 是少数使用数据依赖旋转的密码之一，这个想法起初听起来让密码变得更复杂。但事实证明它也有助于密码分析，因为攻击者可以因此控制旋转值。


    ### RC6


    与 `RC5` 类似。也是一种使用数据依赖旋转的块密码，并由 `RSA Security` 获得专利。同样由 `Ronald Rivest`（与其他其他人）设计，`RC6`
    是 `AES` 竞赛的候选算法之一。它没有被 `NIST` 选中 `AES`，但后来被用于一种据称由 `NSA` 设计的软件植入。


    ### Real world (现实世界)


    学术密码学中指代现实世界的术语，以于严谨分析加密方案安全性所需的安全性模型“理想 `world`”。如果现实世界中的攻击者比理想世界中的者弱，那么纸上的安全性证明就能保证现实安全性。


    该术语通常是冗余表达的来源，例如：之前的 `works` 并没有说明代码应如何在现实 `world`、现实世界应用以及实际的现实世界协议中具体实例化。


    ### Real World Crypto (RWC) (现实世界密码学大会)


    一个关注密码学当前现实应用的密码学会议，而非那些不太关注直接应用的研究型会议。它由来自学术界和工业界的参与者参加，是按人数计算规模最大的密码学会议。


    `RWC` 交替在美国西岸、美国东岸、欧洲和亚洲地区举行。演讲者发表贡献性演讲（这些演讲并不一定源自正式的研究论文），标题如“Firefox 中的隐私保护遥测”和“莫斯科互联网投票系统中的弱点”等。


    参见 `Asiacrypt`，`CHES`, `CRYPTO`, `Eurocrypt`, `FSE`, `PKC`, `TCC`。


    ### Rectangle attack (矩形攻击)


    回镖攻击（boomerang attack）的改进版，用于攻击块密码 `Serpent`。


    参见 `Boomerang attack`（回镖攻击）。


    ### 106 RC6


    ### Related-key attack (相关密钥攻击)


    这种攻击对密码实例进行加密或解密查询，这些实例的密钥是原始密钥的修改版本，因此该修改（作为一个函数）是由攻击者选择的。例如，对块密码的相关密钥攻击可能会产生加密查询
    `Enc(K ⊕ M, P)`，其中 `M` 是攻击者在不知道密钥的情况下定义的固定值。


    你只能对对称原语使用这种攻击模型，因为...


    ### Research papers (研究论文)


    学术密码学中指代现实世界的术语... (注：此处部分翻译对应原始文本重复内容，按要求翻译)


    研究论文 `RSA` 证明保证了现实安全性。

