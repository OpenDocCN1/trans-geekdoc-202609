    iO can be seen as a raw encoding of the input–output relations that hides its
    implementation details, such as subprocedures or intermediate variables. The notion
    of indistinguishability is just a formal way to express the idea that, given obfuscations
    of two distinct yet equivalent programs, an attacker shouldn’t be able to identify
    which of the programs is which.


    Although iO sounds like the solution to many problems, in practice it’s not because
    of its high complexity and inefficiency.


    ### Information-theoretic security


    Security that even infinite computational power cannot compromise.


    For example, imagine that you encrypt some 128-bit secret key `K0` with `AES`
    by using another secret key `K` as the `AES` key. Let’s assume that the attacker
    has no way to verify whether or not they got the valid `K0`.


    In this case, even if the attacker could try all possible values of `K`, they
    would have no way of identifying the correct value of `K`, because they’d have
    no way of identifying the `K0` that they’re after. Information-theoretic security
    59


    ### INT-CTXT


    Integrity of ciphertexts. The security notion, applicable to authenticated encryption
    schemes, that it should be practically impossible for an attacker to create a
    valid ciphertext, even if they know many valid ciphertexts for messages of their
    choice.


    A related theorem: if an authenticated cipher is `IND-CPA` and `INT-CTXT`, it’s
    also `IND-CCA`. I leave it to you to Google the proof for this result.


    ### Invisible signature


    A public-key signature that cannot be identified as valid or invalid unless the
    signer has agreed to reveal that information. An invisible signature might appear
    to make the signature anonymous (that is, because the signature doesn’t reveal
    the signer’s identity or public key), but this isn’t necessarily the case. Consider
    this counterexample: if you additionally sign the signature with a noninvisible
    signature scheme, the scheme remains invisible but is clearly not anonymous.


    A See *Anonymous signature*, *Undeniable signature*.


    ### IOTA


    By its own definition, a blockchain with no blocks and no chain.


    Probably the most mocked blockchain platform, because it has made some unfortunate
    cryptographic choices, such as designing a new hash function. Cryptography enthusiasts
    and IOTA supporters have posted hundreds of inflammatory tweets about IOTA’s questionable
    design choices.


    Here is a very brief summary of the debate: the crypto enthusiasts yelled, “IOTA
    is broken because its signature scheme is broken.” In response, IOTA fans responded,
    “IOTA isn’t broken because it can’t be exploited.” There is some truth to both
    sides.


    ### IPES (Improved Proposed Encryption Standard)


    An alternative name for the IDEA block cipher. A See *IDEA*.


    ### IPSec


    One of the major open secure channel protocols along with `TLS` and `SSH`. Despite
    its widespread use, it remains much less known in the cryptography community and
    among engineers. Indeed, you don’t 60 INT-CTXT need to understand IPSec` if you’re
    developing mobile or web applications. Also, its design and subprotocols look
    cryptographically boring. A product of DARPA- and NSA-sponsored efforts that began
    in the 1970s, IPSec nonetheless remains the standard for network layer security.
    In addition, its design and implementations have proven more robust than early
    `SSL` and `TLS` versions except for the weak `IKEv1` subprotocol.


    ### ISO standard


    Buy this definition for $180. Please note that a paper format is currently unavailable.


    ### Isogeny-based cryptography


    The youngest class of post-quantum cryptography methods; initiated in the early
    2000s. An isogeny is a function that maps points of an elliptic curve to points
    of another elliptic curve and that satisfies specific mathematical properties.
    You can then draw a graph whose nodes are elliptic curves and whose edges are
    isogenies between them, and walk through this graph in a pseudorandom way. After
    throwing a lot of cool math at the study of these objects—graph theory, quaternion
    algebras, and so on—you end up with hard computational problems that you can use
    for crypto applications.


    ### J: Journal of Cryptology (JoC)


    ### K


    Cryptography’s *Nature* minus the publication fees.


    ### KASUMI


    A variant of the 1995 block cipher `MISTY1`; used in 3G telecommunications standards
    as the `A5/3` cipher. KASUMI is broken, because KASUMI 61 a practical key-recovery
    attack exists. KASUMI is also not broken, because said attack requires chosen-ciphertext
    queries in the related-key model, which isn’t realistic.


    ### Keccak


    The hash function family standardized as `SHA-3`; it is built from a single permutation
    according to the sponge function framework. Keccak’s permutation performs a clever
    combination of XORs and logical ANDs. It’s also optimized for efficiency and easily
    scales to different widths. The original Keccak design and its sponge mode have
    led to several other algorithms. A See *Permutation-based cryptography*.


    ### KeeLoq


    The most expensive broken cipher ever. One of the rare block ciphers to rely on
    a feedback shift register.


    ### KEM (key encapsulation mechanism)


    A public-key encryption scheme designed to encrypt and decrypt short, fixed-size
    chunks of data; commonly used to encapsulate a symmetric key. You can think of
    a KEM as a key agreement in which one party gets to choose the key; a `KEM`’s
    encryption function picks a random symmetric key and encrypts it, whereas the
    `KEM`’s decryption function decrypts it to recover the symmetric key. It can then
    continue to decrypt any data encrypted using that key with some symmetric primitives.


    ### Kerberos


    The ancestor of single sign-on systems, designed in the late 1980s to provide
    secure authentication and authorization to MIT’s distributed computing platform
    Athena. Admittedly an elder technology, Kerberos is one of the security protocols
    that relatively few people know despite its major impact and the fact that it’s
    still used in many places, such as in the Radius authentication protocol. Indeed,
    in spite of its old age, Kerberos remains a decently secure protocol. It implements
    often forgotten concepts, such as not trusting any party until 62 Keccak they’re
    authenticated and not exposing passwords in clear. It has some limitations; for
    instance, Kerberos must rely on a trusted third party. But then again, how many
    security protocols ultimately don’t?


    Sometimes known as a protocol that uses only symmetric cryptography, Kerberos
    can also support public-key crypto, as well as various authentication forms, such
    as one-time passwords, hardware tokens, and biometrics.


    ### HADES’ DOG


    The origin of the Kerberos protocol’s name is best explained by the goddess Athena
    in her conversation with Euripides (as reproduced on MIT’s Kerberos site):


    ```

    Euripides: (. . .) You know, I think we have a solid basis which to implement
    the Charon Authentication System.

    Athena: Perhaps. Anyway, I don’t like the name Charon.

    Euripides: Since when?

    Athena: I’ve never liked it, because the name doesn’t make sense. I was talking
    to Uncle Hades about it the other day, and he suggested another name, the name
    of his three-headed watchdog.

    Euripides: Oh, you mean Cerberus?

    Athena: Bite your tongue Rip! Cerberus indeed ....

    Euripides: Er, isn’t that the name?

    Athena: Yeah, if you happen to be a Roman! I’m a Greek goddess, he’s a Greek watchdog,
    and his name is Kerberos, with a K.

    Euripides: Okay, okay, don’t throw thunderbolts. I’ll buy the name. Actually,
    it has a nice ring to it. Adios Charon and hello to Kerberos.

    ```


    ### Kerckhoffs’ principles


    The six principles, or *desiderata*, of security established by the 19th-century
    Dutch cryptographer Auguste Kerckhoffs in his article “La cryptographie militaire”
    (in French).


    Kerckhoffs’ principles 63


