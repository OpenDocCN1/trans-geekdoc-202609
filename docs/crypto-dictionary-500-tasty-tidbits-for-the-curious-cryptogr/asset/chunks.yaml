  trans: '


    - Signal 应用的私有联系人发现技术，利用 `Intel SGX` 技术防止用户的联系人列表直接暴露给 Signal 服务器，同时允许用户发现其联系人中有谁正在使用该应用。

    - 同态加密和可搜索加密，它们可以在加密数据上进行操作，从而保持其机密性。

    - Tor 的洋葱路由，防止任何主机知道消息的源地和目的地。

    - 接触追踪协议，被用于识别 COVID-19 感染者，同时防止对用户活动、社交关系和地理位置的追踪。


    ## 隐私信息检索 (PIR)


    与不经传输（oblivious transfer）相似，不同之处在于检索量不受限制。PIR 和不经传输都试图向数据库主机隐藏客户端的活动，但 PIR 假设为“自服务”，而不经传输限制客户端只能进行“多选一”访问。


    参见 `Oblivious transfer`。


    ## . . . . . 的证明


    区块链交易的验证需要消耗或拥有某些资源。这防止了任意且高效地分叉为替代性历史，这将会导致双重花费和其他攻击。


    ### 隐私信息检索 (PIR) 97


    这种设计选择导致人们对工作证明（proof of work）产生了新的兴趣，我们可以将其追溯到至少 20 世纪 90 年初的反垃圾防御，以及其他工作不仅是
    CPU 使用的其他证明的创建。


    这些资源证明通常是为了区块链应用，但通常并非特定的区块链用例（与销毁证明不同）。


    关于某些建议方法的清单——除了工作证明和权益证明主要且通用的概念外——参见 `Proof of burn`、`Proof of catalytic space`、`Proof
    of human work`、`Proof of reserve`、`Proof of sequential work`、`Proof of space`、`Proof
    of spacetime`、`Proof of storage`、`Proof of useful work`。


    ### 销毁证明 (Proof of burn)


    可能是为共识协议提出的最直接的资源使用证明类型。销毁证明包括使与协议相关的代币或其他数字资产价值失效，例如通过将其发送到某些不可花费的地址（区块链中的 `/dev/null`）。这与权益证明不同，在后者中拥有的价值并没有被销毁。


    ### 催化空间证明 (Proof of catalytic space)


    空间证明的一种变体，其中空间并没有被完全浪费，而是可以存储与证明无关的数据。这利用了催化空间计算的概念，即程序可以使用某些内存区域，即使该区域已用于存储数据，并在完成任务后返回该区域的原始状态。


    ### 人力证明 (Proof of human work)


    工作证明的一种，其工作不是计算密集型任务，而是对人类相对容易、但对计算机和 AI 程序很难的任务。这种想法建议依赖于使用混淆程序生成的 CAPTCHA，以防止生成
    CAPTCHA 的机器解决掉它们。


    ### 复制证明 (Proof of replication)


    存储证明的扩展，用于证明存储了某数据的多个副本，而不是单个真实副本及其指针。实现复制证明的一种技术涉及深度鲁棒图，这是图论中的一个概念，在内存困难型密码哈希的背景下被重新发现。


    ### 98 销毁证明


    ### 储备金证明 (Proof of reserve)


    这不是与共识协议相关的资源证明，而是证明某个账户或组织拥有某些数量的币。储备金证明可以是公开验证的，例如通过从控制待验证资金的地址发布特殊交易。它也可以是私有的，和/或在私有账本上进行公证，例如通过签署审计师提供的带有时间戳的消息。


    储备金证明可以被看作没有抽奖机制且未绑定到任何去中心化协议的权益证明。


    ### 安全证明 (Proof of security)


    参见 `Security proof`。


    ### 顺序工作证明 (Proof of sequential work)


    一种并行化无效的工作证明，因为操作必须按顺序执行。与可并行的工作证明一样，谜题的解决方案必须能够被高效验证。


    与可验证延迟函数 (`VDFs`) 一样，顺序工作证明可以用于在去中心化应用中添加不可压缩的延迟。


    它们还面临相同的技术挑战，即将一系列操作与实际时间延迟关联。与 VDF 不同，顺序工作证明不接受唯一的预计算解法，这限制了它的应用数量。


    参见 `Time-lock puzzle`、`Verifiable delay function (VDF)`。


    ### 空间证明 (Proof of space)


    证明证明者拥有一定数量的可用内存。例如，证明者可能必须分配 1 TB 来说服验证者，而验证者不会接受任何分配少于 1 TB 的证明者的证明。与其使用工作证明浪费
    CPU 时间，认为使用空间证明浪费内存更具环保。


    ### 时空证明 (Proof of spacetime)


    存储证明的扩展，用于高效证明某条数据（或其多个副本）在给定的时间范围内一直被存储。时空证明可以通过结合复制证明来实现。Filecoin 项目使用时空证明来确保因存储数据而奖励的主机没有作弊。


    ### 时空证明 99


    ### 权益证明 (Proof of stake)


    工作证明的环保对应方案，其中持有更多代币的矿工有更大的概率验证交易；他们通过抽奖机制获得奖励。因此，富人只需通过质押（staking），即运行节点并保持在线，就能变得更富有。


    权益证明区块链通常需要特定的质押金额才能参与网络。


    ### 存储证明 (Proof of storage)


    证明某些数据正在被存储（或至少已知，或可以生成）。可证明数据拥有和检索证明等概念都是存储证明的示例。最直接的证明系统是验证者发送某个挑战 `c`，证明者返回
    `Hash(c||M*)`，其中 `M` 是要验证的数据。


    ### 有用工作证明 (Proof of useful work)


    当工作证明不是完全浪费时，计算时间被用于贡献解决某些计算问题。


    ### 工作证明 (Proof of work)


    密码学对环境问题的贡献。


    ### 可证明安全性 (Provable security)


    对于某些密码学家来说，这是唯一接受的安全——与不科学、风险不可接受的启发式安全性相比。


    这种简单的目标现在已不再常见，可证明安全性现在被认为是一种额外的保险，而不是通过一切手段要求的。


    例如，诸如 `AES` 的算法并不是可证明安全的，而公钥方案（如 `RSA` 或 `ECDSA`）仅在底层计算问题困难时才被证明是安全的。


    ### 可证明安全的 (Provably secure)


    “如果是可证明安全的，它可能就不安全，”引用密码学家 Lars Knudsen 的话（当时在块密码背景下）。这句俗语可能源于块密码 `COCONUT98`，它被证明对某类差分分析技术是安全的，但最终被一种未知的类型差分攻击（回旋攻击）破解了。


    ### 代理重加密 (Proxy re-encryption)


    一种公钥加密方案，其中发送给 Alice 的密文（创建 **


    '
- fmt: '

    using her public key) can be turned into a ciphertext for Bob without exposing
    the plaintext—in other words, without decrypting and re-encrypting. For example,
    proxy re-encryption can be realized (in theory) thanks to indistinguishability
    obfuscation by creating an obfuscated program that decrypts and re-encrypts a
    ciphertext without exposing the plaintext.


    ### Pseudo-random


    Hyphenated spelling of `pseudorandom`. But in English, compounds created by the
    addition of a prefix are usually not hyphenated (for example pseudoscience, cryptocommunist,
    and antisocial). Among research papers on the IACR ePrint archive, the use of
    `pseudorandom` is about twice as frequent as `pseudo-random`.


    ### Pseudorandom function (PRF)


    Not actually a single function but a family of many functions; each is indexed
    by its secret key. The security goal of a `PRF` is to be indistinguishable from
    a truly random function if you don’t know the key and only see input–output pairs,
    even when choosing input values.


    You can use `PRFs` as secure `MACs, but a secure `MAC` isn’t necessarily a secure
    `PRF`.


    ### Pseudorandom number generator (PRNG)


    A system generating random-looking data with the security guarantee that an attacker
    that knows any subset of the output bits cannot determine any other output bits.
    The theoretical definition of a `PRNG` differs from its colloquial usage.


    In theory, a `PRNG` is a (deterministic) algorithm that takes as input a value
    (`seed`) of fixed size and returns a longer output value. In practice, a `PRNG`
    often refers to all the components involved in the generation of pseudorandom
    bits, for example, in the context of an operating system’s `PRNG`. Such a `PRNG`
    usually includes the following components:

    - Entropy collectors from analog sources, such as user activity, temperature measurements,
    and on-chip sensors—sometimes referred to as true random generators, although
    their (digital) output is rarely guaranteed to be cryptographically safe, or even
    uniformly distributed.

    - A mechanism to store an internal state, such as `entropy pools`, including the
    logic to update it and perform `reseeding` operations from entropy collectors.

    - A deterministic random bit generator (`DRBG`), which produces an arbitrarily
    long output from a seed derived from the internal state.


    ### Pseudorandom permutation (PRP)


    To a permutation what a `PRF` is to a hash function. A block cipher is a `PRP`.


    ### Public-key cryptography


    All cryptography, excluding symmetric cryptography.


    ### PUF (physical y unclonable function)


    A physical component on semiconductor devices that leverages minute differences
    between each different platform to generate unpredictable values, such as identifiers.
    Although sometimes advertised as semi-magical technology, many `PUFs` have been
    shown to be cryptographically weaker than claimed.


    ### Puncturable encryption


    Public-key encryption augmented with a `puncture` operation. This operation creates
    a new private key to replace the current one to forever revoke the decryption
    capability for certain ciphertexts that the previous key could decrypt. One motivation
    for this is to be able to provide forward secrecy for certain messages, even though
    they were encrypted with the same public key.


    You can create puncturable symmetric encryption from puncturable `PRFs`.


