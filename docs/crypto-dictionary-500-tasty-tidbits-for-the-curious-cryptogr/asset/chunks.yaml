    \n**Cube attack**\n\nA type of higher-order differential cryptanalysis technique,\
    \ described in 2008 to attack lightweight stream ciphers. The *cube* refers to\
    \ the combination of bits over which to compute the higher-order differential,\
    \ extending the notion of a 3D cube to arbitrary dimensions.\n\n**WHEN CUBE ATTACKS\
    \ WORK**\n\nIn any cryptographic function, each output bit can be expressed as\
    \ the result of evaluating a polynomial whose input terms are the input bits.\
    \ If the function is cryptographical y strong—and indistinguishable from a random\
    \ function—this polynomial has exponential y more terms than the number of input\
    \ bits and so is practical y impossible to determine.\n\nBut if the function is\
    \ cryptographical y weak, that polynomial might be much simpler, with few terms,\
    \ and only terms of low algebraic degree (that is, a sum of values that are either\
    \ input bits or products of two or three input bits). In this case, attackers\
    \ could use a variant of differential cryptanalysis to determine these terms.\
    \ Eventual y, the attacker could solve the equations to determine the value of\
    \ secret key bits.\n\nThis is what cube attacks do. They were first applied to\
    \ stream ciphers, which often rely on operations with low algebraic complexity,\
