    The USSR national standard block cipher designed in the 1970s and included in
    the `GOST 28147-89` standard series. Whereas the American `DES` cipher, designed
    in the same era, uses keys that are only 64 bits long, `GOST` works with 256-bit
    keys and comes with customizable S-boxes. Constructed as a Feistel network like
    `DES`, `GOST` hasn’t been meaningfully broken, although research papers have described
    some attacks against it that perform fewer than `2^56` operations. Russian authorities
    officially deprecated `GOST` in 2019. Its successor is the block cipher `Кузнечик`
    (`Kuznyechik`).


    ## Grain


    A family of minimalistic hardware-oriented stream ciphers: `Grain` (80-bit key),
    `Grain 128`, and `Grain 128a` (128-bit key).


    ## Gröbner basis


    ### G


    A canonical representation of a system of multivariate equations. Computing a
    `Gröbner basis` for a multivariate system is one of the possible definitions of
    “solving” it, because it can be used, for example, to find its numeric solutions.


    The general problem of computing `Gröbner bases` is NP-hard. The actual time and
    memory required to compute one for a specific system of equations, as found in
    multivariate cryptography or in algebraic cryptanalysis, is usually large and
    hard to estimate: but when it’s not, it produces spectacular cryptanalyses.


    ## Group signature


    A signature scheme involving a group of potential signers. Any group member can
    issue a signature on behalf of the group, and a verifier can learn the identity
    of the group members but not of the actual signer.


    There’s an exception: groups must work with a trusted entity, called the `group
    manager`, which can trace signatures back to their original signer. `Ring signatures`
    don’t have this traceability property or the need for a `group manager`. See `Ring
    signature`.


