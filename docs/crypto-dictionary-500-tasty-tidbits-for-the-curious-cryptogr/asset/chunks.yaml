    Time-memory trade-off technique mostly applied to password cracking, such as Windows
    NTLM passwords. Rainbow tables are a specific, optimized type of look-up tables
    precomputed once, in the offline stage, to significantly speed up the cracking
    of passwords (the online stage). Rainbow tables are also successfully applied
    to crack pay-TV control words within short cryptoperiods (such as 10 seconds).
    They’re designed and often made in Switzerland.


