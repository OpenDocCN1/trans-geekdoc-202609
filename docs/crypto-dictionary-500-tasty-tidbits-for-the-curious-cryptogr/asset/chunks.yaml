- fmt: '

    A suite of Chinese national cryptographic standards, including publicly available
    algorithms that certain products in China are required to use.


    The `SM` suite includes elliptic-curve public-key cryptography (`SM2`), a hash
    function (`SM3`), a block cipher (`SM4`), and, interestingly, identity-based cryptography
    (`SM9`).


    ### Smart contract

    Programs running on blockchain platforms. Bugs in smart contracts tend to have
    catastrophic consequences.


    ### Snake-oil

    Bruce Schneier’s snake-oil warning signs from 1999 are still applicable `S` today:


    1. Pseudo-mathematical gobbledygook

    2. New mathematics

    3. Proprietary cryptography

    4. Extreme cluelessness

    5. Ridiculous key lengths

    6. One-time pads

    7. Unsubstantiated claims

    8. Security proofs

    9. Cracking contests


    ### SNARK (succinct non-interactive argument of knowledge)

    A powerful and efficient type of proof of knowledge. Introduced in the 2011 article
    “From Extractable Collision Resistance to Succinct NonInteractive Arguments of
    Knowledge, and Back Again.” It’s a variant of a `SNARG` (succinct non-interactive
    argument), because a `SNARK` is a `SNARG of knowledge`. `SNARKs` can, for example,
    be used for (noninteractive) delegation of computation, where a worker uses a
    `SNARK` to prove that they performed the correct computation.


    When a `SNARK` is zero-knowledge, we talk of `zk-SNARK`, which was famously used
    in the Zcash blockchain protocol to anonymize transactions via a proof that tokens
    have been transferred from a sender to a recipient without disclosing either’s
    identity or the amount transferred.


    `SNARK` (succinct non-interactive argument of knowledge) **119**


    Post-quantum `SNARKs` exist but are less efficient than pre-quantum ones.


    ### DISSECTING SNARKS

    The following explains `SNARK` word by word, starting from the end: An `argument
    of knowledge` is essential y a proof of knowledge that is practical y secure,
    whereas `proof of knowledge` is, strictly speaking, reserved for proofs that remain
    secure against computational unbounded adversaries. In the context of cryptographic
    applications, the `knowledge` proved can be that of a secret value or of the relation
    between values that must be kept secret.


    `Non-interactive` just means that the `SNARK` comes as a single message from a
    prover to a verifier rather than as a protocol involving multiple messages.


    `Succinct` means that the message is of a relatively small size, even if the argument
    covers large amounts of data, and that it’s efficiently verifiable.


    ### SNIP (secret-shared non-interactive proof)

    A zero-knowledge protocol with one prover and several verifiers that each holds
    a share of a proof of correctness. Each verifier holds a share of the secret value;
    the prover sends distinct proof strings to each verifier, allowing the verifiers
    to collaborate to check the validity of the secret according to some predefined
    predicate without leaking any information on said secret. `SNIPs` were introduced
    as a tool to build privacy-preserving aggregate statistics schemes.


    ### SNOW 3G

    A stream cipher used in 3G, 4G, and 5G communications to encrypt voice communications.
    Like its early predecessor `A5/1`, `SNOW 3G` works by updating a state composed
    of feedback shift registers, which makes it simple to implement and efficient.
    Unlike `A5/1`, `SNOW 3G` is secure. A new version of `SNOW 3G` for 5G networks
    called `SNOW-V` was proposed in 2020 to be faster in software, because 5G relies
    a lot more on software and virtualized environments than previous standards.


    A See *Feedback shift register*.


    **120** `SNIP` (secret-shared non-interactive proof)


    ### Solitaire

    A stream cipher created by Bruce Schneier for the novel *Cryptonomicon.*


    The novel’s characters use it without accessing a computer. As Schneier describes:


    ```

    Solitaire gets its security from the inherent randomness in a shuffled deck of
    cards. By manipulating this deck, a communicant can create a string of random
    letters that he then combines with his message. Of course Solitaire can be simulated
    on a computer, but it is designed to be implemented by hand.

    ```


    `Solitaire` is broken by today’s academic standards (it has a statistical bias),
    but it’s quite secure for a pen-and-paper cipher, and practically safe when used
    correctly.


    `S`

    A See *Cryptonomicon.*


    ### SPECK

    An NSA lightweight cipher.


    A See *SIMON.*


    ### SPEKE (Simple Password Exponential Key Exchange)

    PAKE invented long before PAKEs were cool (in 1996).


    ### SPHINCS

    A hash-based signature scheme that, unlike `XMSS`, is stateless. But it’s even
    more complicated than `XMSS`. `Gravity-SPHINCS` and `SPHINCS+` are `SPHINCS` variants
    that were submitted to NIST’s post-quantum competition. Not to be confused with
    the `SPHINX` mixnet.


    A See *XMSS.*


    ### Sponge function

    The simplest way to design a hash function. A sponge function uses only a permutation
    algorithm—as opposed to a keyed permutation—or a block cipher. Pioneered by `Keccak`,
    now `SHA-3`, it leads to a multitude of permutation-based schemes.


    A See *Keccak,* *Permutation-based cryptography.*


    Sponge function **121**


    ### SRP (Secure Remote Password)

    PAKE relying on the Diffie–Hellman problem. `SRP` can be combined with `TLS` and
    is notably used in `i Keychain`. But overall, it’s found in very few applications,
    most likely because of vulnerabilities in earlier versions of `SRP`, and because
    the minor security benefit is often not worth it.


    ### SSH (Secure Shell)

    A secure channel over `TCP`. `SSH` relies on neither `PKI` nor `X.509` certificates.
    Instead, it has trust-on-first-use (TOFU) trust model. Fewer security issues have
    been found in `SSH` than in `TLS`.


    ### SSL (Secure Socket Layer)

    Not `TLS`. `SSL` is the predecessor of that ubiquitous security protocol; it was
    designed in the 1990s and had three versions, the first of which was never released
    because it was too insecure.


    `v2` shipped with Netscape Navigator 1.1 in March 1995, and `SSL v3` was released
    shortly after to mitigate a man-in-the-middle attack (working by downgrading to
    a weak cipher suite). Nonetheless, many systems continued to support `SSL v2`,
    for backward compatibility. Twenty years later, the `DROWN` attack exploited such
    legacy support of `SSL v2` to attack recent `TLS` versions.


    A See *TLS.*


    ### STARK (scalable transparent arguments of knowledge)

    Variants of `SNARKs`. `STARKs` were motivated by applications requiring efficient
    and scalable zero-knowledge proofs with fewer constraints than `SNARKs`. Here
    are the main differences between `STARKs` and `SNARKs`:


    ³ `STARKs` don’t require a *trusted setup*—a process that must be performed by
    trusted parties so that subsequent proofs are secure.

    ³ `STARKs` can be safe against quantum algorithms, whereas known `SNARK` constructions
    usually aren’t (or with some constraints).

    ³ `STARKs` are a bit faster to create and a bit slower to verify.


    A See *SNARK (succinct non-interactive argument of knowledge).*


    **122** SRP (Secure Remote Password)


    ### Steganography

    Covert communication techniques that belong more to the field of signal processing
    than to cryptography.


    ### Stream cipher

    A type of cipher you can think of as a one-time pad cryptographically generated
    from a key and a (unique) nonce. The block cipher `DES` was designed in the 1970s
    with hardware implementations in mind; later the stream cipher `RC4` was designed
    to be software friendly due to its byte-oriented mechanism. Yet in the 1990s stream
    ciphers were often thought of as *hardware ciphers* and were frequently based
    on feedback shift registers with minimal surrounding logic, like `Grain` or `SNOW
    3G`. On the other hand, block ciphers are considered software ciphers, as the
    `AES` competition requirements made clear in 2000. Indeed, you’ll find stream
    ciphers used in niche, constrained applications, even before the term *lightweight
    cryptography* existed, when block ciphers were too costly.

