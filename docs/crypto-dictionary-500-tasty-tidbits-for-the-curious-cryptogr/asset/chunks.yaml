    （使用她的公钥）可以转换为针对 Bob 的密文而无需暴露明文——换句话说，无需解密再重新加密。例如，得益不可区分混淆（indistinguishability
    obfuscation），理论上可以实现代理重加密，即通过创建一个混淆程序，在不暴露明文的情况下解密并重新加密密文。


    ### 伪随机 (Pseudo-random)


    `pseudorandom` 的连字符写法。但在英语中，通过添加前缀创建复合词通常不使用连字符（例如 pseudoscience 伪科学，cryptocommunist
    密码共产主义和 antisocial 反社交）。在 IACR ePrint 存档的研究论文中，`pseudorandom` 的用法大约是 `pseudo-random`
    的倍。


    ### 伪随机函数 (PRF)


    并非单一函数，而是一个函数族；每个函数都由其密钥索引。`PRF` 的安全目标是：如果你不知道密钥且只能看到输入-输出对（即使在选择输入值的情况下），它与真正的随机函数是不可区分的。


    你可以将 `PRFs` 作为安全的 `MACs`，但安全的 `MAC` 并不一定是安全的 `PRF`。


    ### 伪随机数生成器 (PRNG)


    一种生成看似随机数据的系统，其安全保证是：已知输出位中任何子集的攻击者无法确定任何其他输出位。`PRNG` 的理论定义与其口语化用法不同。


    在理论上，`PRNG` 是一种（确定性的）算法，它接受固定大小的值（`seed`）作为输入并返回更长的输出值。在实践中，`PRNG` 通常指参与伪随机位生成的所有组件，例如在操作系统的
    `PRNG` 语文中。此类 `PRNG` 通常包含以下组件：

    - 来自模拟源的熵收集器，例如用户活动、温度测量和片上传感器——这些有时被称为真随机生成器，尽管它们的（数字）输出很少被保证在密码学上是安全的，甚至不是均匀分布的。

    - 一个存储内部状态的机制，例如 `entropy pools`（熵池），包括更新状态以及从熵收集器执行重种子（`reseeding`）操作的逻辑。

    - 一个确定性随机位生成器 (`DRBG`)），它根据源自内部状态的种子产生任意长度的输出。


    ### 伪随机置换 (PRP)


    对于置换而言，相当于 `PRF` 之哈希函数。块密码就是 `PRP`。


    ### 公钥加密


    排除对称加密之后的所有密码学。


    ### PUF (物理不可克隆函数)


    半导体设备上的物理组件，利用每个不同平台之间的微小差异来生成不可预测的数值（如标识符）。尽管有时被宣传为半魔法技术，但许多 `PUFs` 已证明其密码学强度比声称的弱。


    ### 穿刺加密 (Puncturable encryption)


    带有“穿刺”（puncture）操作的公钥加密。该操作创建一个新的私钥来替换当前密钥，从而永久撤销对之前密钥可以解密的某些密文的解密能力。其动机之一是为某些消息提供前向安全性，即使它们是用相同的公钥加密的。


    你可以从穿刺式 `PRFs` 创建穿刺式对称加密。


    ### 穿刺伪随机函数 (PPRF)


    类似于穿刺加密。`PRFs` 的密钥可以更新，以撤销处理某些值的能力。


    ### 量子计算机


    根据一些专家的说法，在 2026 年之前有 1/7 的概率破解 `RSA-2048`，在 2031 年之前有 1/2 的概率。事实上，没有人知道你一生中是否会看到量子计算机破解
    `RSA-2048`。


    ### 量子密码学


    依赖量子现象的加密操作，并不一定需要量子计算机，例如量子密钥交换。量子密码学恰好是后量子，但不属于后量子密码学领域。


    ### 量子加密


    对量子状态进行加密，相对于经典比特字符串的加密。


    量子加密的最基本形式是量子一次性密码（quantum one-time pad），它可以被看作是量子隐传和经典一次性密码的组合。


    这种量子一次性密码对于哈希函数是安全的，因为它需要每个量子比特来传输加密状态。量子一次性密码看起来比其对应部分效率较低，因为它每个加密比特都需要两个比特的密钥（注：此处正文逻辑可能略显跳跃，已按字面翻译以保持语境）。但它更强大，因为可以用于构建多方计算方案。


    ### 量子密钥分发 (Quantum key distribution)


    有时与后量子密码学混淆，但其实际价值较低。最著名的方案是 `BB84` 密钥协议。


    ### 量子签名 (Quantum signature)


    一种不可能的方案，因为经典的签名概念不适用于量子状态。直观上，任何可以获取量子状态信息的方都可以修改它。更一般地说，除非量子状态经过加密，否则无法进行身份验证，这样只有预期的接收者可以解密它们。尽管量子签名是不可能的，但量子签名加密（signcryption）是可能的。


    ### QUIC (Quick UDP Internet Connections)


    一种传输安全协议，旨在使糟糕状况（丢包、IP 漫游等）下的 HTTPS 连接更可靠，特别是通过运行在 UDP 而非 TCP。使用 UDP 避免了 TCP 握手的延迟代价。它还包含一种缓解
    UDP 不可靠问题的机制。基于 QUIC 的 HTTP 已由 IETF 标准化，并命名为 HTTP/3。


    ### Rabin 加系统 (Rabin cryptystem)


    公指数为 2 的 `RSA`。由于计算平方根被证明等同于因式分解，破解 Rabin 加密的难度等同于分解模数 `n = pq`。


    ### 彩虹表 (Rainbow tables)


    一种主要用于密码破解（如 Windows NTLM 密码）的时间内存权衡技术。彩虹表是一种特定的、优化的查找表，在离线阶段预计算，以显著加速密码破解（在线阶段）。彩虹表还成功用于破解短加密周期内（如
    10 秒）的电电视控制字。它们在瑞士设计并通常制造。


    ### 随机比特 (Random bits)


    随机生成的比特。当我们谈论随机比特时，严格来说它们通常只是被伪随机生成的。


    ### 随机预机 (Random oracle)


    一种用于在理论上证明协议安全的抽象概念：你可以将随机预机想象为一个函数 `f()`，每当你发送一个输入 `x` 时，它都会选择一个随机值 `y` 并返回，同时记录
    `f(x) = y`。这听起来类似于哈希函数的运行方式，但随机预机的假设与安全哈希函数的假设略有不同。假设哈希函数是随机预机会让编写安全证明变得更容易。但此类证明被认为可靠性较低，因为与安全的哈希函数不同，随机预机在实践中并不存在，但在实践中这并不担心。


    ### 随机性 (Randomness)


    密码学中最重要的东西。没有随机性，你就无法生成随机秘密值，因此没有秘密密钥，也就没有加密。即使你已经有了密钥，你需要随机性来实现最高的公钥加密安全级别（称为语义安全性，或
    IND-CPA）。


    ### 范围证明 (Range proof)

