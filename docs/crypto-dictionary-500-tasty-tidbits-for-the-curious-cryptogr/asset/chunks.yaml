  trans: "\n\n混合网络（Mixnets）也用于电子投票方案以提供投票者匿名性，并用于加密货币以隐藏发送者/接收者之间的关系，典型的做法是通过打乱 `UTXOs`\
    \ 实现。\n\n许多陷阱会破坏混合网络的安全性。例如，在匿名路由的情况下，混合路由器传输混合后值的顺序不能与接收到值的顺序相关联；否则，匿名性很容易被破坏。消息的大小也应该保持完全相同；否则置换顺序将易被识别。\n\
    \n## 76 混合网络\n\n### MQV (Menezes–Qu–Vanstone)\n加强版的 Diffie–Hellman。发明于 1995 年，但很少被使用，部分原因是存在相关专利保护。它是\
    \ `HMQV` 和 `ECMV` 的姐妹算法（曾包含在美国国家安全局的 Suite B 算法集中）。今天，`MQV` 最广为人知的可能是其在基于密码的密钥协商协议\
    \ `OPAQUE` 中的应用。\n\n### 多重碰撞 (Multicollision)\n对于哈希函数，两个以上消息之间的碰撞。在迭代哈希函数（如 `SHA-256`）上找到多重碰撞所需的时间比作为黑盒访问的哈希函数要短。如果迭代哈希的中间链值为\
    \ `n` 位，那么对于理想的黑盒哈希，可以在复杂度为 `⌈log2 k⌉ · 2*n*/2` 下找到 `k` 碰撞，而对应的复杂度为 `k!1/*k ·\
    \ 2*n*(k–1)`。\n\n### 多方计算 (MPC)\n一类在未知输入原始值的情况下计算函数输出的密码学技术。`MPC` 是一个丰富的研究领域，但在加密货币钱包之前很少有主要应用（钱包也使用了类似于\
    \ `MPC` 的门限签名）。预计会有更多现实世界的 `MPC` 应用。\n\n### 多变量密码学 (Multivariate cryptography)\n\
    一类基于求解多个变量非线性方程组之困难性的后量子方案。这类问题的困难性与多元二次 (`MQ`) 问题相关，`MQ` 问题是求解随机二次方程组的问题，已知是\
    \ `NP-完全` 的。\n\n大多数多变量方案都是签名方案，它们产生短签名（优点），但需要很长的公钥（不太如）。\n\n## N\n\n### NBS (国家标准局)\n\
    `NIST` 的旧称。\n\n### N\n参见 `NIST (美国国家标准与技术研究院)`。\n\n## NBS (国家标准局) 77\n\n### NESSIE\
    \ (欧洲签名、完整性与加密新方案)\n一个从 2000 年运行到 2003 年的项目，由七家欧洲机构领导。它在 42 份提交中选出了 17 个推荐算法。\n\
    \n`NESSIE` 选定的算法并未成为正式标准，仅是非正式建议，从回过来看来看这引起了很少的关注：还有人记得 `ACE Encrypt`、`SHACAL-2`\
    \ 或 `SFLASH` 吗？\n\n### “密码学的新方向”\n由 Whitfield Diffie 和 Martin Hellman 于 1976 年\
    \ 11 月发表在 `IEEE Transactions on Information Theory` 上的受邀研究论文。\n\n今天，Diffie–Hellman\
    \ 操作用于几乎每一个执行加密操作的软件或硬件系统。\n\n#### 迪菲-赫尔曼革命\nDiffie 和 Hellman 在写下以下引言后，可以毫无讽刺地被称为愿景家：\n\
    \n> 我们今天正站在密码学革命的边缘。廉价数字硬件的发展使其从机械计算的设计限制中解放出来，并将高等级加密设备的成本降低到可以在远程自动取款机和计算机终端等商业应用中使用的程度。反过来，这些应用产生了对新型加密系统的需求，这些系统可以尽量减少对安全密钥分发通道的依赖，并提供等同于手写签名的功能。同时，信息论和计算机科学的理论进展有望提供可证明安全的加密系统，将这门古老的艺术变成一门科学。\n\
    \n论文随后介绍了公钥密码学的概念以及一种新的*公钥分发系统*，现在称为 Diffie–Hellman 密钥协商。原始规范值得逐字复制：*每个用户生成一个独立的随机数*\
    \ `Xi`，其从整数集合 `{1, 2,* · · · *,* `q− 1}` 中均匀选择。每个人都对 `Xi` 保持秘密，但将 `Y` = `Xi` `α`\
    \ mod `q` `i` \n\n## 78 NESSIE (欧洲签名、完整性与加密新方案)\n*我们今天正站在密码学革命的边缘。廉价数字硬件的发展使其从机械计算的设计限制中解放出来，并将高等级加密设备的成本降低到可以在远程自动取款机和计算机终端等商业应用中使用的程度。反过来，这些应用产生了对新型加密系统的需求，这些系统可以尽量减少对安全密钥分发通道的依赖，并提供等同于手写签名的功能。同时，信息论和计算机科学的理论进展有望提供可证明安全的加密系统，将这门古老的艺术变成一门科学。*\n\
    \n论文随后介绍了公钥密码学的概念以及一种新的*公钥分发系统*，现在称为 Diffie–Hellman 密钥协商。原始规范值得逐字复制：*每个用户生成一个独立的随机数*\
    \ `Xi`，其从整数集合 `{1, 2,* · · · *,* `q− 1}` 中均匀选择。每个人都对 `Xi` 保持秘密，但将 `Y` = `Xi` `α`\
    \ mod `q` `i`\n\n`*我们今天正站在密码学革命的边缘。廉价数字硬件的发展使其从机械计算的设计限制中解放出来，并将高等级加密设备的成本降低到可以在远程自动取款机和计算机终端等商业应用中使用的程度。反过来，这些应用产生了对新型加密系统的需求，这些系统可以尽量减少对安全密钥分发通道的依赖，并提供等同于手写签名的功能。同时，信息论和计算机科学的理论进展有望提供可证明安全的加密系统，将这门古老的艺术变成一门科学。*\n\
    \n### NFSR (非线性反馈寄存)\n参见 *反馈寄存*。\n\n### NIST (美国国家标准与技术研究院)\n负责各种技术领域美国标准的机构。`NIST`\
    \ 77 项建议包括算法（如 `DSS`、`AES`、`SHA-2`、`SHA-3`）、分组密码模式、SHA3 变体（如 `cAKE`、`KMAC`、`TupleHash`）、密钥管理、随机数生成和统计测试。\n\
    \n`NIST` 标准（如 `AES` 和 `SHA-3`）的设计是通过公开透明的过程向全球密码学家进行众包。这种方法被认为比将密码设计委托给国家安全局更可靠。\n\
    \n### NIZK (非交互式零知识)\n`NIZK` 证明是条消息形式提供的零知识证明，而不是涉及证明者和验证者之间多次消息的交互式协议。`NIZK`\
    \ 证明通常使用 Fiat–Shamir 启发将交互式协议转换为非交互式。\n\n### Noekeon\n一种具有稀有属性的分密码：加密算法与解密算法相同。这在代码、硅片或开发时间有限的环境中非常方便。\n\
    \n### Noise\n一个使用 Diffie–Hellman 协议设计协议的框架。`Noise` 协议有时但并非总是可以替换 TLS 实现传输安全。这提供了许多潜在优势，包括更大的简单性、身份隐藏和更低的带宽消耗。\n\
    \n### Nonce (随机数)\n在密码学背景下，*仅使用一次的数字*。某些加密操作的额外输入，其值应该是唯一的。这确保了即使所有输入相同，操作也会产生不同的输出。在实践中，保证\
    \ nonce 的唯一性并不总是简单的，nonce 通常随机生成。认证加密通常会使用 nonce 来确保即使多次加密相同的消息，输出的密文也不同，从而防止攻击者注意到重复加密了相同的消息。\n\
    \n**80 NIZK (非交互式零知识)**\n\n**非承诺加密**\n\n"
- fmt: '

    Sounds like deniable encryption, but not necessarily deniable. Using non-committing
    encryption, a fake ciphertext can be created in such a way that it looks like
    a real one. It can be shown to have been created from any plaintext by revealing
    a key pair and random bits that connect the ciphertext to the plaintext.


    ### Non-outsourceability

    A property of a proof-of-work scheme whose work cannot be outsourced without revealing
    the private key of the prover. So it prevents pooled mining, where third parties
    perform a share of the work and are supposed to get a share of the mining reward.
    Such a proof must be efficiently verifiable without the private key.


    ### Non-slanderability

    In the context of ring signatures, a security property that prevents an attacker
    from forging a valid signature that can be linked to a specific member of the
    group of authorized signers. Although expressed in slightly different terms, non-slanderability
    is equivalent to unforgeability.


