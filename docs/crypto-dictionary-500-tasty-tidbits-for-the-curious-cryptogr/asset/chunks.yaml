    The only hash function from the `Salsa20` family. `Rumba20` was created in the
    context of new results regarding the generalized birthday problem.


    ## Rumba20 109


    ### S

    #### SAEP (Simplified OAEP)

    A variant of `OAEP` that is slightly simpler and achieves the same level of chosen-ciphertext
    security.


    A See `OAEP (Optimal Asymmetric Encryption Padding).`


    ### Salsa20

    Undoubtedly one of the most influential cryptographic algorithms. It led to the
    stream cipher `ChaCha20` (used in TLS, `SSH`, and many other places). This in
    turn was reused in the `BLAKE2` hash function, a component of the `Argon2` password
    hash and protocols such as `WireGuard`.


    More generally, `Salsa20` popularized simple, easy to implement add-rotate-xor
    (`ARX`) constructions. A few years earlier, NIST had standardized a more complicated
    cipher whose understanding required the knowledge of concepts such as polynomials,
    matrix inversion, and finite fields.


    The `20` in `Salsa20` is for its number of rounds, a conservative value initially
    chosen by its designer and later relaxed in some applications, decreasing to `12`
    or even `8`.


    ### Sandwich attack

    A refinement of the `boomerang attack` often used to cryptanalyze block ciphers.
    A `sandwich attack` relies on a distinguisher divided into three parts: “A thick
    slice (bread) at the top, a thin slice (meat) in the middle, and a thick slice
    (bread) at the bottom.” It was invented to find the first practical attack on
    the block cipher `KASUMI`.


    A See `Boomerang attack.`


    ### S-box

    A look-up table used in block ciphers to implement a nonlinear transformation
    with measurable security properties (such as nonlinearity or branch number), although
    S-boxes are not necessarily implemented as look-up tables. In the context of differential
    cryptanalysis, an active `S-box` is one for which the values from the two (different)
    inputs yield a different input value to the S-box, and thus a different output.


    ## 110 SAEP (Simplified OAEP)

    S-boxes are usually 4-bit (16 values, as in `Serpent`) or 8-bit (256 values, as
    in `Rijndael/AES`).


    ### Scalar

    A number, as opposed to a vector or group element, for example. When you hear
    `scalar multiplication` in cryptography, it often just means multiplication of
    a point on an elliptic curve by a number, according to the addition law defined
    on said curve.


    ### sci.crypt

    Along with `sci.crypt.research`, Usenet newsgroup where people discussed cryptography
    before Twitter and Slack. It’s notorious for its `can-you-break-my-cipher-here’s-a-ciphertext`
    posts.


    ### S

    #### Scrambler

    Former term for ciphers used in telecommunications and audio/video content processing.
    The first of these algorithms were cryptographically weak, because they didn’t
    really encrypt the signal but effectively just made it unintelligible. The later
    algorithms evolved into actual cryptography.


    A See `DVB-CSA.`


    ### scrypt

    A password hash function with configurable time memory usage, pronounced *ess-crypt*.
    `scrypt` pioneered memory-hard password hashing and inspired subsequent designs
    as well as the Password Hashing Competition.


    `scrypt` has a modular, if not outright minimalistic, design. It includes, as
    subcomponents, the `PBKDF2` construction based on `HMAC-SHA-256` as well as the
    `Salsa20/8` stream cipher.


    ### Searchable encryption

    Encryption of database records that allows a search on encrypted data. For example,
    it permits a search that given an encrypted keyword retrieves the encrypted items
    that, when decrypted, include the keyword.


    Searchable encryption schemes that are possibly practical and useful leak some
    information about the encrypted data. In contrast, those Searchable encryption
    111 with the highest security guarantees are severely limited functionality-and
    performance-wise (for example, those using functional encryption, homomorphic
    encryption, and oblivious RAMs).


    ### secp256k1

    The elliptic curve used by `Bitcoin`, `Ethereum`, and many other cryptocurrencies
    for their `ECDSA` signatures of transactions. The `k` indicates a Koblitz curve.
    Unlike other standard curves, and in particular unlike the ubiquitous `secp256r1`
    (also known as the `NIST p-256`), `secp256k1` doesn’t rely on pseudorandom parameters
    and is in principle less likely to have been manipulated. The actual reasons why
    Satoshi Nakamoto, or whoever, chose to use `secp256k1` remain unclear.


    ### Secret sharing

    A See `Searchable encryption.`


    ### Security

    The `Security` of a scheme doesn’t necessarily imply it’s secure. `Security` of
    a scheme is an important aspect of cryptography.


    ### Security proof

    The demonstration that an algorithm is secure. `Security proofs` of a scheme are
    often de toable.


    ### Semantic security

    A See `IND-CPA.`


    ## 112 secp256k1

    ### Serious Cryptography

    Yet another book about cryptography.


    ### Serpent

    In hindsight, would have been a good choice as the AES standard; its implementation
    doesn’t stray too far from specification.


    A See `PRESENT.`


    ### SHA-0

    ### S

    First draft of `SHA-1`.


    ### SHA-1

    A secure hash function if the only security you need is preimage resistance. It
    took 12 years to progress from the collision attack described in 2005 to a collision.


    ### SHA-2

    Not one but four hash functions:

    `SHA-256` looks like `SHA-1` but with more rounds.

    `SHA-224` is `SHA-256` with 224-bit output instead of 256-bit output.

    `SHA-512` looks like `SHA-256` with 64-bit words instead of 32-bit words.

    `SHA-384` is `SHA-512` with 384-bit output instead of 512-bit output.

    Unlike `SHA-1`, `SHA-2` algorithms aren’t broken and are unlikely to ever.


    ### SHA-3

    When someone tells you they use `SHA-3`, you should ask which version of `SHA-3`
    they use: it could be `SHA3-224`, `SHA3-256`, `SHA3-384`, `SHA3-512`, `SHAKE128`,
    or `SHAKE256`. If it’s one of the latter two, you might want to know what output
    length they use, because these aren’t simple hash functions but `XOF` (extendable-output
    functions).


    A See `Keccak.`


    ### SHA-3 competition

    Officially the *NIST hash function competition*. The 2008 to 2012 selection process
    for `SHA-3` eventually settled on `Keccak` after a final round that included `BLAKE`,
    `Grøstl`, `JH`, and `Skein`. Of 64 submissions received by NIST, 51 were accepted
    as valid.


    ### SHA-3 PANDEMONIUM

    The first few months of the SHA-3 competition were a rampage. Most submissions
    by amateurs were broken, sometimes within minutes of reading their specification.


    Noteworthy submissions included:

    `MD6`: Tree-based hash having nothing to do with `MD5` but its designer `CubeHash`:
    Minimalist ChaCha-like permutation-based


    `ECOH`, `FSB`, `SWIFFTX`: Attempts of provably secure hashes using a reduction
    to a hard computational problem.


    ### SHACAL

