- fmt: '

    Quoting from the Twofish paper, Twofish’s claims to fame included performance:

    - Encrypt data at 285 clock cycles per block on a Pentium Pro, after a 12,700
    clock-cycle key setup

    - Encrypt data at 860 clock cycles per block on a Pentium Pro, after a 1,250 clock-cycle
    key setup


    as well as cryptanalysis work:


    *And finally, we cryptanalyzed Twofish. We cryptanalyzed and cryptanalyzed and
    cryptanalyzed, right up to the morning of the submission dead-line. We’re still
    cryptanalyzing; there’s no stopping.*


    ## U


    ### Undeniable signature

    A signature that cannot be verified without the signer’s cooperation, whether
    or not the signature is valid. Verifiers shouldn’t be able to determine if a signature
    is valid without interacting with the signer, and the signer shouldn’t be able
    to convince a prover that a valid signature is invalid, or vice versa.


    A See `Invisible signature`.


    ### Universal composability

    A theoretical framework for analyzing the security of combining cryptographic
    components, seeing as combining two secure protocols doesn’t automatically result
    in a secure protocol. It’s rarely applied to real use cases.


    ### Universal hash function

    A hash function used in cryptography that isn’t the same as a cryptographic hash
    function. Unlike a general-purpose cryptographic hash, a universal hash function
    is parameterized by a secret key. Therefore, it’s actually a family of functions,
    like a pseudorandom function.


    #### 132 Undeniable signature

    But unlike a pseudorandom function, a universal hash function isn’t pseudorandom
    in the cryptographic sense, only in the statistical sense: there exist no two
    input values `M1` and `M2` such that `Hash(M1) = Hash(M2)` with abnormally high
    probability.


    This property shouldn’t be mistaken for collision resistance, however. Collisions
    are usually easy to find for universal hash functions.


    ### Updatable encryption

    An encryption scheme that can directly turn one ciphertext into another ciphertext,
    which can only be decrypted with a new, different key. A goal of updatable encryption
    is to perform key rotation on an untrusted system, as an alternative to the naive
    decrypt-encrypt approach.


    ## V


    ### Verifiable delay function (VDF)

    A function whose computation cannot be sped up by extra parallelism or storage;
    therefore, it must be computed sequentially, like a proof of sequential work.
    But unlike the latter, VDFs admit only one solution.


    A See `Proof of sequential work`, `Time-lock puzzle`.


    ### Verifiable random function (VRF)

    The public-key counterpart of a pseudorandom function, where the public key can
    be used to verify that the output has been computed correctly by verifying the
    proof of correctness generated along with the function’s output.


    VRFs sound similar to public-key signatures but differ in two main aspects: a
    VRF’s result is always deterministic (whereas a message can admit many valid ECDSA
    signatures, for example), and a VRF can generate a result and a proof (where the
    proof might be randomized).


    VRFs have been used to build (theoretical versions of) lottery systems and transaction
    escrow schemes, and are used in several blockchain platforms.


    #### Verifiable random function (VRF) 133

    #### Verifiable unpredictable function (VUF) A function that somehow occupies
    a niche between signatures and VRFs: a VUF is like a VRF but isn’t necessarily
    pseudorandom, only unpredictable. But unlike a signature, there must be only one
    valid output for a given message. A VUF scheme can thus be regarded as a unique
    signature.


    A See `Verifiable random function (VRF)`.


    ### Vigenère cipher

    A cipher more secure than Caesar’s.


    ### VSH (Very Smooth Hash)

    A hash function with provable collision resistance, based on the hardness of factoring
    integers. But VSH (second) preimage resistance doesn’t have as strong security
    guarantees.


    ## W


    ### Wallet

    In cryptocurrencies, a set of accounts managed by a single individual or organization.
    Each account consists of a private key used for signing and an address somehow
    derived from the public key. Typically, these accounts are organized hierarchically,
    from one or more seeds, using `BIP32` or a similar hierarchical derivation. This
    is convenient, because you can then manage a practically infinite number of accounts
    by storing only a single secret.


    By extension, a wallet refers to any application or device that implements account
    management functionalities. Hardware wallets offer the best feeling of security,
    and sometimes they really are more secure.


    That said, they don’t protect any better than software wallets against the most
    common risk: the lack of reliable backups.


    ### Watermarking

    The practice of embedding a value in some analog information (such as an image,
    video, or sound), usually during digital encoding, in such 134 Verifiable unpredictable
    function (VUF) a way that the value can’t be extracted or removed. In its most
    robust forms, it also survives noise, transcoding, and digital-analog-digital
    conversion.


    ### White-box cryptography

    Obfuscation at the algorithm level. Put otherwise, a means of implementing, say,
    `AES` in such a way that the implementation for a given key doesn’t reveal the
    key. This sounds like magic, and like real magic, it doesn’t actually exist, although
    advanced techniques give the illusion that it does. Most white-box techniques
    have indeed been broken, at least on paper. But in practice, they contribute to
    making reverse engineering harder, due to being supplemented by software-level
    defenses (such as software obfuscation, anti-tampering, anti-debugging, device
    binding, and so on).


    Fundamentally, white-box cryptography is about transforming a symmetric cipher
    into an asymmetric one. If that were feasible, it would mean we could create public-key
    encryption from a symmetric primitive (despite the fact that we can construct
    public-key signatures from hash functions.)


    ### Winternitz signature

    An extension of Lamport hash-based signatures that can hash values greater than
    one. For example, to hash 4-bit messages, `W` between 0 and 15, you would publish
    `Hash16(K)` as a public key, and then sign a message `M` ∈ [0, 15] by computing
    `HashM(K)`, where `M` is the number of hash iterations. This works better than
    Lamport’s binary scheme, but it still doesn’t scale—just imagine the work involved
    in signing a 64-bit value.


    ### WireGuard

    A network-layer protocol for peer-to-peer secure channels that grew out of a kernel
    rootkit project. WireGuard was designed for SSH-like usage and VPN functionality.
    As per creator’s words, WireGuard is “cryptographically opinionated,” which means
    it consists of a single suite of algorithms, as well as minimal cryptographic
    bureaucracy.


    Notably, it excludes certificates and thus `ASN.1` or `X.509` parsing. Unlike
    many projects, WireGuard has focused its efforts on cryptography and implementation
    quality with a much smaller code base than its alternatives.


    #### WireGuard 135

    Initially regarded with suspicion by the cryptographic intelligentsia, WireGuard’s
    success and security track record now speak for themselves.


    ## X


    ### X25519

    Diffie–Hellman with `Curve25519`.


    A See `Curve25519`.


    ### X3DH

    Extended triple Diffie–Hellman, a variant of Diffie–Hellman popularized by its
    use in the Signal protocol. X3DH combines multiple key pairs to compute one shared
    secret instead of using just one key pair per participant, as in basic Diffie–Hellman.


    #### HOW X3DH WORKS

    In its simplest setting, an X3DH operation between Alice and Bob works like this.


    First, it combines their long-term identity keys `IA` and `IB` and their ephemeral,
    one-time keys `EA` and `EB` by computing the shared secret `SK` as follows, where
    `DH()` is a Diffie–Hellman operation:


    ```

    DH1 = DH(IA, EB)

    DH2 = DH(EA, IB)

    DH3 = DH(EA, EB)

    SK = KDF(DH1, DH2, DH3)

    ```

