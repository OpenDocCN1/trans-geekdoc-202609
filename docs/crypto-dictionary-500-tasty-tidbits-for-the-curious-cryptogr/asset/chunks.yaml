    One of the initial motivations was to create a book that would briefly describe
    nontrivial cryptography concepts, including established ones, as well as some
    of the most recent research. Many cryptographers have heard these terms but routinely
    fail to remember what they’re about or how they differ from related notions. For
    example, what is the difference between group signatures and ring signatures?
    Between a `SNARK` and a `STARK`? Between `SRP` and `OPAQUE`? Between `BIKE` and
    `SIKE`? What are laconic proofs, puncturable encryption, or verifiable delay functions?
    Few other books will mention any of these concepts, and most likely, no other
    will mention all of them.


    I would like to issue multiple editions with updates and new definitions listed
    based on research’s progress. Therefore, I want to keep this book alive and make
    it a bit less incomplete as the years pass, which will require help from you,
    its readers. I encourage you to share any comment, error report, or additional
    suggestion by writing to the `@cryptolexicon` Twitter account (preferably publicly,
    but as a private DM if you want).


    I hope this book will be a pleasurable and valuable read, that it will help you
    appreciate the richness of the cryptographic landscape, and that, even if cryptography
    is a very serious topic, you won’t take it too seriously.


    *Lausanne, January 2021*


    ## Preface xi


    ## ACKNOWLEDGMENTS


    You might be tempted to think that this book is just the fruit of my erudition,
    but nothing could be further from the truth. Not only did I have to learn or rediscover
    many of the terms defined in the book, I also relied on peers and specialists
    to answer questions, review definitions for correctness and clarity, provide me
    with references, suggest additional definitions, and offer other valuable advice.


    I’m particularly indebted to the technical reviewer, `Pascal Junod`, who spotted
    numerous inaccuracies in the initial draft and identified important missing definitions.
    Special thanks also go to `Luca De Feo` for his review and help with explaining
    isogenies and hyperelliptic curves in simple terms. I also want to thank `Alon
    Rosen`, `Anastasiia Voitova`, `Arrigo Triulzi`, `Ben Fuller`, `Doug Henkins`,
    `Jason Donenfeld`, `Nadim Kobeissi`, `Samuel Neves`, and `Sofía Celi` for their
    help. Last but not least, I’m grateful to the `No Starch` team for their support,
    quality editing, and general professionalism.


    ## CRYPTO DICTIONARY


    ### 2013


    The year of `Edward Snowden`’s leaks about the `NSA`’s classified activities,
    a turning point in cryptography. End-to-end encryption suddenly becomes an appealing
    topic.


    ### 65537


    The most common `RSA` public exponent; large enough to not be insecure, small
    enough to make exponentiation fast, and of a form that optimizes implementations’
    speed (`65537 = 2^16 + 1`).


    ### A


    #### A5/0


    One of the three encryption modes in early mobile telephony standards (`GSM`).
    `A5/0` just means no encryption; therefore, the audio content from a mobile call
    would be received and transmitted in the clear between a mobile device and the
    nearest base station. It’s as secure as early `TLS` versions’ null cipher.


    #### A5/1


    The default `GSM` cipher in Western countries (prior to `3G` and `4G` technologies)
    that encrypts encoded audio mobile communications. A stream cipher based on a
    curious mechanism involving three linear feedback shift registers irregularly
    clocked; so the update of a register depends on the values of certain bits in
    the two other registers.


    Sophisticated cryptanalytic attacks have broken `A5/1`. But in practice, the most
    effective attack is relatively simple: it’s a time-memory trade-off that exploits
    the short state of `A5/1` (`64 bits`) and involves the precomputation of large
    rainbow tables. The `A5/1` specification was initially confidential and unavailable
    to the public until it was reverse engineered in the late 1990s.


    #### A5/2


    The export version of `A5/1`, a euphemism meaning its technical requirements include
    something like must be easy to break by Western nations’ intelligence agencies.
    Designed to be insecure, `A5/2` didn’t turn out to be outrageously insecure: after
    being reverse engineered around the same time as `A5/1`, academic researchers
    quickly found attacks on `A5/2`. But these attacks were more efficient on paper
    than in practice.


    #### A5/3


    At last, a real cipher in mobile phones. An upgrade to the do-it-yourself `A5/1`
    that applies an algorithm already public and vetted, namely the block cipher `KASUMI`.
    `KASUMI` was used in `2G` (along with `A5/1`), in `3G` as `A5/4` (along with `SNOW
    3G`), and was no longer supported in `4G`.


    See `KASUMI*.


    #### A5/4


    `A5/3` but with a key of `128 bits` instead of `64 bits`; `A5/4` is secure, whereas
    `A5/3` isn’t.


    #### Adaptive attack


    An attack in which the attacker’s actions depend on what they observe during the
    attack and the protocol’s execution. For example, in an adaptive chosen-plaintext
    attack, the attacker sends plaintext messages that depend on the responses to
    their previous queries. In a nonadaptive attack, the list of plaintexts for which
    the attacker queries the ciphertexts must be predetermined.


    #### AEAD (authenticated encryption with associated data)


    A type of symmetric cipher that encrypts and authenticates data by producing a
    ciphertext as well as an authentication tag. The decryption step then only succeeds
    if the tag is valid, which proves that the ciphertext was created by someone who
    knows the key.


    ## DIFFERENT AEAD CONSTRUCTIONS


    The `AD` in `AEAD` refers to associated data—also called *additional* or *auxiliary*—data
    that isn’t encrypted but is covered by the authentication mechanism, because it’s
    taken as an input when computing the authentication tag. AEAD can be realized
    in three ways:


    ³ With an established cipher and established MAC, such as `AES` in `CBC` mode
    as a cipher and `HMAC-SHA256` as a MAC. This is the traditional approach that
    is usually the least efficient. It’s also the most error prone because of the
    different ways to combine a cipher and MAC (so called encrypt-and-MAC, encrypt-then-MAC,
    and MAC-then-).


    ³ With an established cipher and ad hoc MAC or mode, such as `AES-GCM` and `ChaCha20-Poly1305`,
    which are currently the most popular AEADs of this type. For example, `TLS 1.3`.
    `AES-SIV` also belongs in this category, although it’s a bit different (a MAC-and-encrypt
    rather than encrypt-then-MAC construction).


    ³ With a custom 2-in-1 construction, such as `ACORN` and `AEGIS`, both ciphers
    selected by the `CAESAR` competition. In these algorithms, the same internal state
    and logic encrypts and generates the authentication tag.


    #### AES (Advanced Encryption Standard)


    The ubiquitous block cipher standardized by `NIST` in 2000. Designed by Belgian
    cryptographers `Joan Daemen` and `Vincent Rijmen`, and winner of the AES competition,
    its use is universal today under its various modes of operation, such as `CBC`,
    `GCM`, and `SIV`.


    See *Rijndael


    #### AES-CCM


    `AES` in counter-with-CBC-MAC mode, which combines the `CTR` encryption mode with
    `CBC-MAC` authentication. `AES-CCM` is a `NIST` standard and is supported in `TLS
    1.3` and several other protocols, including `Bluetooth Low Energy`. But it’s much
    less popular than its sibling `AES-GCM`. The reason is that `AES-CCM` is generally
    slower and less convenient to use than `AES-GCM`. A research paper titled “A Critique
    of CCM” describes the limitations of the `CCM` mode.


    #### AES-GCM


    `AES-CCM` sometimes fits better than `AES-GCM` in embedded platforms because it
    only needs an `AES` algorithm and no additional logic (unlike `GCM`’s `GMAC`).

