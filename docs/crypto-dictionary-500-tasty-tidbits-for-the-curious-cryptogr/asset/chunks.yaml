    A mode of operation for block ciphers that has nothing to do with blockchains.
    `CBC` encrypts a series of blocks `Pi` to ciphertext blocks `Ci` by computing
    `Ci = Enc( K, Pi ⊕ Ci–1)`, for `i = 1, . . . , n.`. The initial value of `(IV)`
    is `C 0`, which should be unpredictable to guarantee semantic security. `CBC`
    has the useful property that decryption is parallelizable (whereas encryption
    isn’t). Unfortunately, `CBC` is vulnerable to padding oracle attacks.


    ## CECPQ (combined elliptic-curve and post-quantum)


    A hybrid key agreement scheme including an elliptic-curve and a post-quantum scheme.
    `CECPQ` was developed by Google as a way to hedge `TLS` connections against the
    risks of quantum computing.


    The first version, `CECPQ1`, combined `X25519` with the lattice-based scheme `NewHope`,
    and was deployed in 2016 for a few months in the `Chrome Canary` browser. Announced
    in 2019, `CECPQ2` replaces `NewHope` with the `NTRU`-based scheme `HRSS`, and
    the variant `CECPQ2b` uses the isogeny-based scheme `SIKE`.


    ## Cellular automata


    Useless in cryptography. It’s a source of many bad papers.


    ## Ceremony


    A procedure during which important keys, secrets, or sensitive parameters are
    generated. A ceremony includes procedural and technical security controls to provide
    assurance about the keys’ secure generation **22** Caesar’s cipher


    and backup—and thus about the software, hardware, processes, and people involved.
    It’s more than picking an acceptable `PRNG`, which is actually the easiest part.
    For example, a ceremony involves participants with well-defined roles (such as
    auditors and operators), a predefined sequence of operations (known as a script
    or storybook), and the writing of detailed minutes.


    Ceremonies are typically held to generate root keys of certificate authorities
    or master keys (seeds) of blockchain wallets in financial **C**


    institutions. They are then called `key ceremonies`. Ceremonies can also be called
    `trusted setups` when they aim to generate parameters of a zero-knowledge proof
    system.


    ## Certificate


    The source of many troubles, including encoding formats, parsing bugs, unrenewed
    expired certificates, broken chains, untrusted authorities, self signatures, revocation
    lists, and so on. But often it’s the least-bad solution we.


    ## Certificate authority (CA)


    A trusted third party in public-key infrastructures, the entity that can issue
    certificates.


    ## Certificate transparency (CT)


    A Google initiative that reduces the risk from rogue or compromised CAs by creating
    a public log of certificates, making it easier to know whether certificates have
    been issued.


    ## ChaCha20


    A variant of `Salsa20` that is currently one of the most used ciphers.


    ## CHACHA20: BORN ON A FORUM


    `ChaCha20` was first proposed on the `eSTREAM` project’s discussion forum:


    *I have an idea for improving Salsa20. This short post, which did turn out to
    be slightly faster than Salsa20, thanks to a better use of SIMD instructions.*


    ## CHES (Cryptographic Hardware and Embedded Systems)


    The most *real-world* conference of all `IACR` conferences. It’s held every year
    in a different location. Researchers present peer-reviewed papers with titles
    such as “Electromagnetic Information Extortion from Electronic Devices Using Interceptor”
    and “Make Some Noise. Unleashing the Power of Convolutional Neural Networks for
    Profiled Side-Channel Analysis.”


    ## CIA


    The three cardinal principles of information security: confidentiality, integrity,
    and availability. The cryptographer’s version replaces *availability* with *authenticity*.


    ## Ciphertext stealing


    A technique to encrypt with a block cipher in `CBC` mode such that the ciphertext
    is of the same length as the plaintext. Instead of padding the last plaintext
    block with fixed values, as in `PKCS#7` padding, it appends ciphertext bytes from
    the previous blocks to obtain a full block. It strips off said bytes of the previous
    encrypted block to retain the original message size. This trick only works if
    the message **24** CHES (Cryptographic Hardware and Embedded Systems)


    is longer than one block. Standardized by `NIST` in three different versions (`CS1`,
    `CS2`, and `CS3`), it is rarely used in practice, because most of the time a small
    overhead is acceptable.


    ## Clipper


    A simple solution proposed for a complex problem: the Clipper chip aimed to enable
    encrypted communications for US citizens and busi-nesses while allowing full interception
    by authorized parties (namely, **C**


    government and law enforcement). Proposed in the early 1990s by the `NSA`, the
    Clipper chip was part of a key escrow architecture where each chip’s secret keys
    would also be shared with US Federal agencies. In addition to its questionable
    security architecture, the Clipper chip suffered from a poor technical execution
    and included a number of security flaws, which helped its opponents halt the project.


    ## CMVP (Cryptographic Module Validation Program)


    NIST’s process for validating cryptographic modules submitted to the `FIPS 140-2`
