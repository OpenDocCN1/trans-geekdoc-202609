    ### Related-key attack


    An attack that makes encryption or decryption queries for instances of the cipher
    whose key is a modified version of the original key, so the modification (as a
    function) is chosen by the attacker. For example, a related-key attack on a block
    cipher might make encryption queries `Enc(K ⊕ M, P)` where `M` is a fixed value
    defined by the attacker without knowing the key.


    You can only use this attack model against symmetric primitives, because it would
    be too powerful and effective against public-key schemes. Related-key attacks
    aren’t a very realistic threat when the `R` key is secret.


    ### Research papers


    What academic researchers must write to keep their jobs. The `IACR`’s ePrint`
    server received 69 research papers in 2000, 661 in 2010, and 1,499 in 2019. No
    one has time to read all these articles, which is why it’s cru-cial for researchers
    to write succinct, informative abstracts, as well as clear and appealing titles.


    ### FUN WITH PAPER TITLES


    Conventional paper titles are boring; they usual y follow the structure “New X
    for Solving Problem Y Using Technique Z.” But researchers sometimes get creative
    with titles, such as the following:


    “Proof of Work Proves Not to Work”

    “Dumb Crypto in Smart Grids”

    “FourQ: Four-Dimensional Decompositions on a Q-curve over the Mersenne Prime”

    “Mining Your Ps and Qs: Detection of Widespread Weak Keys in Network Devices”

    “Prime and Prejudice: Primality Testing Under Adversarial Conditions”

    “The Hunting of the SNARK”


    Research papers 107


    ### Revocation


    Problem solved in theory but rarely in practice.


    ### Rijndael


    The block cipher that became known as `AES` after winning the `AES` competition
    in 2000. The `Rijndael` name is a portmanteau of the last names of its designers,
    Belgian cryptographers `Joan Daemen` and `Vincent Rijmen`. The Google query `how
    do you say rijndael` returns about 100,000 results.


    A See `AES`.


    ### Ring signature


    First described in the paper “How to Leak a Secret” by `Rivest`, `Shamir`, and
    `Tauman`. Ring signatures involve a group of signers such that any signer can
    create a signature that is-ambiguous with respect to the subset of signers of
    their choice. In other words, verifiers have no way of identifying the signer;
    unlike with group signatures, there is no way to deanonymize the signer.


    A See `Group signature`.


    ### RIPEMD-160


    A hash function designed in 1992. `RIPEMD-160` got a second life due to its use
    in `Bitcoin` and many other cryptocurrencies.


    ### Rivest–Shamir–Adleman


    The authors of the 1978 paper “A Method for Obtaining Digital Signatures and Public-Key
    Cryptosystems” that described the `RSA` cryptystem. `RSA`’s the `RSA`’s then unique
    property was that the key used for encryption is different from the one used for
    decryption. `RSA` has evolved into standardized schemes to encrypt and sign securely
    (such as `OAEP` and `PSS`, respectively). But its market share has declined while
