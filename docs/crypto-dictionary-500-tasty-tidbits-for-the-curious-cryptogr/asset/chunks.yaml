    The *decisional* Diffie–Hellman problem (DDH) was called a “gold mine” by cryptographer
    Dan Boneh, and was leveraged to build encryption schemes (such as the Cramer–Shoup
    construction) as well as complex protocols such as threshold signature schemes.


    A See *New Directions in Cryptography*.


    **34** Dictionary


    **Disclosure**


    More effective when the vulnerability is named with a clever acronym and accompanied
    by a nifty website, including a Q&A and a logo.


    Researchers first took this approach to tell the world about Heartbleed; then
    they used it to describe subsequent attacks on SSL/TLS. This allowed them to better
    communicate the new vulnerability (and spend less time responding to emails from
    journalists). Notable examples include:


    BREACH  Browser Reconnaissance and Exfiltration via Adaptive Compression of Hypertext


    **D**


    CRIME  Compression Ratio Info-leak Made Easy


    DROWN  Decrypting RSA with Obsolete and Weakened


    eNcryption


    POODLE  Padding Oracle On Downgraded Legacy Encryption ROBOT  Return Of Bleichenbacher’s
    Oracle Threat


    **Discrete logarithm problem**


    The problem of finding *d* in *y* = *xd* mod *p* for a prime *p*, or in *dG* =
    *P* in elliptic-curve groups of points. The discrete logarithm problem is now
    the most important computational problem in cryptography, before factoring, because
    Diffie–Hellman–like protocols have become more common than RSA and Paillier cryptosystems.


    **Distinguisher**


    An algorithm used in attacks against a scheme’s indistinguishability.


    For example, if you find a statistical bias in the output of a pseudorandom generator,
    that bias would serve as a distinguisher, thereby breaking the PRNG.


    A See *Indistinguishability*.


    **Distributed randomness**


    Randomness generated by a group of parties that don’t necessarily trust each other;
    therefore, they don’t want any party to be capable of influ-encing the outcome.
    In this context, a simple protocol such as performing an XOR of each participant’s
    random contribution isn’t secure. The reason is that the last contributor can
    set their value to one that, when Distributed randomness **35**


    XORed with the combination of all previous values, produces the result they want
    to be returned. Publishing commitments in advance partially addresses the problem.


    **Dolev–Yao model**


    The first formal model for defining cryptographic protocols. Also a symbolic framework
    for describing and analyzing their security.


    Cryptographers sometimes refer to the Dolev–Yao model when they mean the *active
    attacker adversarial model*—that is, the model wherein the attacker can eavesdrop,
    intercept, and modify data transmitted.


    But the Dolev–Yao model is more than that: it’s a general symbolic framework to
    describe and analyze protocols’ security.


    **Double ratchet**


    A subprotocol of the Signal messaging protocol. It determines each message’s unique
    keys in such a way that an attacker who knows the message keys at a given time
    can determine neither past nor future message keys, thereby providing forward
    secrecy and some form of backward secrecy.


    A See *Signal protocol*.


    **ONE RATCHET, TWO RATCHETS**


    The double ratchet is a highly stateful protocol. It’s cal ed *double* because
    it combines two techniques:


    ³ The *symmetric-key ratchet*, which maintains a hash chain from which message
    keys are derived.


    ³ The *Diffie–Hellman ratchet*, which performs Diffie–Hel man key exchanges with
    ephemeral key pairs to make future states unpredictable.


    **Dragonfly**


    PAKE defined for the authentication standard EAP-pwd used in the Wi-Fi security
    suite WPA3. Attackers can bypass implementations of Dragonfly by exploiting the
    timing side channels in the hash-to-curve operations.


    A See *PAKE (password-authenticated key agreement).*


    **36** Dolev–Yao model


    **DRBG (deterministic random bit generator)** An oxymoronic-sounding term referring
    to a component that deterministically generates a long string of random-looking
    bits when given some actually random value (called a *seed*, a *key*, or sometimes
    just *entropy*). An operating system’s random generator usually includes an entropy
    extraction mechanism that generates some unpredictable bits from some analog source
    and pushes these bits to an entropy pool from which a DRBG takes its seed.


    A DRBG is different from a PRNG; the terms PRBG and DRNG are rarely used.


    **D**


    A See *Pseudorandom generator (PRNG)*.


    **DSA (Digital Signature Algorithm)**


    The public-key signature scheme designed and patented by the NSA.


    It was standardized as part of the DSS (Digital Signature Standard) in 1991. This
    choice drew some criticism to which NIST responded as follows in the magazine
    *Federal Computer Week*:


    NIST made the final choice. We obtained technical assistance from NSA, and we
    received technical inputs from others as well, but \[NIST\]


    made the final choice.


    At the time, the criticisms of DSA were about its efficiency, incompleteness (it
    didn’t specify a hash function), risk of patent infringement, and security.


    A See *DSS (Digital Signature Standard)*.


    **DSS (Digital Signature Standard)**


    The name of the NIST standard about digital signatures; not a single algorithm.


    In 1982, NIST (then called the NBS) published a “Solicitation for Public Key Cryptographic
    Algorithms.” NIST later did the same for block ciphers and hash functions, resulting
    in the AES and SHA-3 standards.


    In 1987, NIST cancelled the DSS project upon request from the NSA.


    The standardization effort later resumed, leading to several standards established
    in 1991, including the NSA-designed DSA.


    DSS is also the abbreviation of the sodium trimethylsilylpropane-sulfonate chemical
    compound, which is somehow related to cryptography.


    DSS (Digital Signature Standard) **37**


    **DVB-CSA**


    The Common Scrambling Algorithm: an algorithm standardized by the Digital Video
    Broadcasting consortium to protect video content in pay-TV systems, typically
    by encrypting MPEG transport stream packets.


    A See *Control word*.


    **VERSIONS OF DVB-CSA**


    The first version of the DVB-CSA standard, cal ed *CSA1*, combines a stream cipher
    and a block cipher, and has a 48-bit key. CSA2 is similar but has a longer key
    of 64 bits. If these key sizes sound short to you, keep in mind that for most
    live content, the key usual y changes every 5 or 10 seconds.'
