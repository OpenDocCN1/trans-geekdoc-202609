    ## About the Author

    Jean-Philippe (JP) Aumasson is the Chief Security Officer and cofounder of Taurus
    Group, a Swiss financial tech company specializing in digital assets infrastructure.
    Since 2006, he has authored more than 60 research articles in the field of cryptography
    and designed the widely used cryptographic algorithms `BLAKE2` and `SipHash`.
    The author of the acclaimed book *Serious Cryptography* (No Starch Press, 2017),
    he speaks regularly at information security and technology conferences.


    ## About the Technical Reviewer

    Pascal Junod has worked in applied (and less applied) cryptography for a living
    since 1999, both in the academic and industrial worlds. He holds a master’s in
    computer science from ETH Zurich and a PhD in cryptography from EPF Lausanne.
    In his spare time, he loves trail running, white-water kayaking, reading books,
    and caring about his family.


    ## PREFACE

    *I promise nothing complete; because any human thing supposed to be complete must
    for that very reason infallibly be faulty. I shall not pretend to a minute anatomical
    description of the various species, or—in this space at least—to much of any description.
    My object here is simply to project the draught of a systematization of cetology.
    I am the architect, not the builder.* —HERMAN MELVILLE, in Moby Dick (Chapter
    XXXII


    *Crypto Dictionary* is quite different from my previous book. Its format and lighter
    tone might make it look less serious, but its seriousness lies in its breadth
    of treatment.


    Whereas *Serious Cryptography* covered applied crypto’s fundamentals, or less
    than 10 percent of all there is to know in the field, this dictionary has the
    pretension of covering at least 75 percent of cryptography’s realm.


    The unhurried, gradual, and relatively deep exposition in *Serious Cryptography*
    is replaced with a less headache-inducing structure filled with concise, direct
    definitions. This coffee-table book form intends to expose the richness of cryptography,
    including its exotic and underappreciated corners, to share knowledge and be a
    gateway to a better appreciation of the science of secrecy.


    As the epigraph hints, *Crypto Dictionary* isn’t an attempt to deliver a real
    dictionary that would comprehensively and consistently cover cryptography’s diverse
    areas. You might not find your favorite protocol or cipher and will probably be
    surprised by the absence of certain terms that I purposefully omitted or just
    didn’t think of. But you’ll find many of the major notions and algorithms that
    cryptographers encounter today, as well as an opinionated selection of terms that
    I found of practical, theoretical, historical, or anecdotal interest.


    Seasoned cryptographers might observe that the book isn’t very egalitarian. Although
    I attempted to cover all streets and alleys of cryptography evenly, certain neighborhoods
    are inevitably more equally treated than others due to my biases, experience,
    interests, and variable inspiration. I hope this heterogeneity won’t be perceived
    as unfairness, because that was definitely not my intention.


    For example, I chose not to list individuals or software components; instead,
    the book focuses on the concepts and cryptographic objects that people created
    and that engineers implemented, which I believe are of greater interest. In accordance
    with the no-software rule, I didn’t include the `Signal` application, yet I did
    include the `Signal` protocol. But this rule suffered one exception, which you’ll
    find between the letters *N* and *P*.


    This dictionary doesn’t pretend to provide a precise description of the various
    protocols, algorithms, and other cryptologic notions. *Crypto Dictionary* isn’t
    an encyclopedia and doesn’t aim to be a modern version of the venerable *Handbook
    of Applied Cryptography*. Readers who seek, for example, a formal definition of
    attribute-based cryptography or a detailed specification of `AES` will find plenty
    of references online.


    Most definitions are actual definitions, but they vary in how informative they
    are. I didn’t strive for a consistent level of detail and deliberately just minimally
    explained certain terms—including some of the most established ones—or only added
    some humorous comment.


    Crypto in *Crypto Dictionary* represents cryptography in its most general sense,
    encompassing the supposed unholy territory of cryptocurrency. But admittedly,
    the dictionary is far from being a blockchain dictionary, because many of the
    terms specific to blockchain applications are omitted.


    *Crypto Dictionary* was written to be an entertaining read for every-one, from
    high school students and novice engineers to PhDs and retired researchers. The
    goal is that any reader can open the book at a random page and discover a yet
    unknown notion, excavate an obscure concept, or read an anecdote about a familiar
    term. Because modern cryptography is such a broad field, it’s impossible, even
    for professional practitioners and researchers, to be familiar with all its notions,
    let alone master them. For example, who will already be familiar with `CECPQ`,
    `EKMS`, fuzzy extractors, *and* the `MASH` hash function?

