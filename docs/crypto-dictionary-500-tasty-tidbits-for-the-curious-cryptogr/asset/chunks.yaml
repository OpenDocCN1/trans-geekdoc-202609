    当然，这段对话毫无意义，Blowfish（吹鱼算法）中并没有后门。


    Blowfish 是一种真正的安全的块密码，尽管其块大小限制为 64 位的，但它是 `bcrypt` 密码哈希方案的核心算法。


    ### BLS (Boneh-Lynn-Shacham) 签名


    一种利用椭圆曲线对的签名方案，使得签名比 `ECDSA` 和 Schnorr 签名更短。原因是每个签名都由单个群元素组成。也就是说，对于与 512 位 `ECDSA`
    签名相似的安全水平，BLS 签名的长度仅为 `256` 位。


    BLS 签名具有支持聚合的有用属性，可以将多个公钥和签名合并为单个公钥和单个签名，并高效地进行批量验证。


    #### BLS (Boneh-Lynn-Shacham) 签名 17


    结合分布式密钥生成，你可以使用 BLS 签名构建阈值签名方案，这在加密货币应用中分发交易签名被证明是很有用的。


    ### Bob


    颠覆性股票经纪，Alice 的同谋者。


    参见 *Alice*。


    ### 布尔函数


    一种参数为二进值（即 `0` 或 `1`）并返回单个 `0` 或 `1` 位的函数。例如，`f(a, b, c) = a + b + ac + bc + 1`，其中
    `a`、`b` 和 `c` 是二进值，就是一个布尔函数。在这里，加号的行为类似于异或（XOR）（因为布尔函数中只有 `0` 和 `1`），`ab` 表示 `a`
    乘以 `b`，这等同于逻辑与操作（当且仅当 `a = b = 1` 时结果为 `1`）。


    #### 为什么密码学家关注布尔函数


    布尔函数看起来很愚蠢，直到你注意到你可以仅用布尔函数来描述任何操作——例如哈希函数。


    例如，哈希函数输出中的每个位都是输入位的一个布尔函数。这类函数只存在于数学的以太中；它们在绝大多数时间时候都不是显式的。计算它们的多项式形式在实践中是不可能的，更不用说实现和计算它们了。


    尽管如此，关于布尔函数及其安全特性的研究论文数不胜数：原因是当你将加密哈希或块密码分解成部分（意味着轮及其子组件）时，你会遇到尺寸更易于管理的布尔函数——


    例如，与将 4 位块映射到 4 位块的 S 盒 相关的布尔函数。理解布尔函数及其属性（如非线性和代数免疫力）已被证明对于设计安全密码和破解弱密码至关重要。


    ### 回旋镖攻击 (Boomerang attack)


    一种差分分析技术，你首先将一对具有给定差异的明文*投入*密码中。然后你获得 Bob 两个密文，并在这些两个密文中设置另一个差异以获得两个新的密文。最后，你通过解密这些密文来*捕捉*明文。回旋镖攻击本质上是一种利用仅覆盖密码部分的差分特性的技巧。


    ### B


    ### BQP (有界误差量子多项式时间)


    量子算法（因此是假设的量子计算机）能够高效解决的问题类。BQP 包含经典计算机可以高效解决的问题，也包含今天计算机无法解决的问题。后者是存在超多项式量子加速的问题。


    #### 隐藏子群问题


    从密码学的角度来看，BQP 问题中最著名的问题被称为*隐藏子群问题* (`HSP`）。特别是，密码学家关注其在交换（或阿贝尔）有限群上的版本。如果对于阿贝尔群的
    HSP 是易的，我们就可以解决以下问题：³ 给定 `N = pq` 找到 `p` 和 `q` ³ 给定 `x`、`p` 和 `xe mod p` 找到 `e`。你认识这些问题——因数分解和离散对数。


    ### 辫群加密 (Braid group cryptography)


    尝试使用非交换群元素构建新型公钥加密。这类加密系统可以被视为具有固定数量股线的辫，且群操作是高效的。作为一种副作用，辫群加密被预期能够抵抗量子算法。


    ### Brainpool 曲线


    由德国联邦信息安全局**（*Bundesamt für Sicherheit der Informationstechnik*, 或 BSI）设计的椭圆曲线。Brainpool
    曲线具有某些安全属性，但与其他标准相比，它们提供了 512 位的（而不是 521 位的）。


    #### Brainpool 曲线 19


    ### 破解 (Break-in recovery)


    一种类似于后向安全的概念。该术语源于 Signal 协议。


    参见 *后向安全*。


    ### 广播加密 (Broadcast encryption)


    一种加密类型，其中相同的密文广播给一组接收者，只有授权的接收者可以解密，并且可以撤销使其不再解密。广播加密的挑战在于防止接收者共谋以及最小化密文和密钥的长度。


    #### 广播加密的应用


    尽管广播加密受付费电视内容保护，但它从未被部署：主要原因是密文或密钥过长，以及不适用于接收者的安全模型。


    但广播加密已用于蓝光光 AACS 内容保护方案。然而，它在防止盗版方面效果有限，因为内容密钥（受广播加密保护）可以从播放器中提取。


    ### 暴力攻击 (Brute-force attack)


    一种通过连续尝试所有可能的值来恢复密钥的攻击类型。你可以对大多数密码发起暴力攻击。但只要密钥足够长，攻击永远不会结束（除非你运气好到极），因为有太多的值需要尝试。


    ### 弹证明 (Bulletproof)


    一种作为加密货币高效范围证明的零知识证明。弹证明的主要优点是它们不需要受信设置。具体来说，它们不需要初始化 20 参数，或*游戏规则*，这些规则必须被信任才能确保协议安全。弹证明在
    Monero 中被应用。


    参见 *范围证明*。


    ### 拜庭容错 (Byzantine fault tolerance)


    一个通用术语，涵盖了一类不直接依赖挖掘和某种证明的共识协议。pBFT（及其变体）和 C Tendermint 是此类协议；它们通过让固定数量的主机共同工作来可靠地维护共同状态，同时在主机之间分配信任。


    ### C


    ### CAESAR


    认证加密竞赛：安全性、适用性和鲁棒性，这是一场在 2014 年到 2019 年进行的非 NIST 密码学竞赛。CAESAR 由 NIST 部分资助但不受其监管，它为多种用例识别了新的认证加密密码，包括*轻量级应用（资源受限环境）*、*高性能应用*和*深度防御*。


