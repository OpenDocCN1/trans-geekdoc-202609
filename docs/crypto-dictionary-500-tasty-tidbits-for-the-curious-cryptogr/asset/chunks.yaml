    ### Blind signature


    A scheme where the signer can sign a message without knowing its content.


    ### Block cipher


    A cipher that transforms a fixed-size block of data into another block of the
    same size using a key.


    ### Thanks, blockchain?


    If blockchain revolutionized anything, it’s probably the practice, funding, and
    deployment of cryptography. Thanks to blockchains, we acquired a wealth of:


    *   Innovative solutions being created not to be published at peer-reviewed conference
    and be later forgotten, but actual technologies being deployed at scale, challenged
    by real threats and engineering constraints rather than only abstract models.

    *   Large funding available with minimal bureaucracy and formalism, bypassing
    traditional grant application systems and its flaws (slowness, misplaced incentives,
    and work overhead for researchers).

    *   Passionate people, some without formal education let alone a PhD, learning
    advanced cryptography concepts and creating new solutions to new problems, and
    implementing them without caring about academic rewards.


    ### Blowfish in Hollywood


    The Blowfish cipher once made it into episodes of the television series *24*.


    Here’s an excerpt from the show’s script:


    ```

    Mr. O’Brian, a short time ago one of our agents was in touch with Jack Bauer.
    She sent a name and address that we assume is his next destination.

    Unfortunately, it’s encrypted with Blowfish 148 and no one here knows how to crack
    that. Therefore, we need your help, please. Show me the file.

    Where’s your information? 16- or 32-bit word length? 32.

    Native or modified data points? Native.

    The designer of this algorithm built a backdoor into his code. Decryption’s a
    piece of cake if you know the override codes.

    ```

