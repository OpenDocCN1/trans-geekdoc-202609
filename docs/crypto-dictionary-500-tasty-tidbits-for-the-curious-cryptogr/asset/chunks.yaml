    A one-time MAC best known as the authenticator component in the *ChaChaPoly* authenticated
    cipher, as well as ChaCha20-Poly1305. It’s supported in TLS, OpenSSH, and many
    other applications.


    **P**


    **FROM POLY1305 TO CHACHA20-POLY1305**


    In this context, *poly* refers to polynomial evaluation. To compute the MAC of
    a message, Poly1305 evaluates a polynomial


    *poly =* c1r *+* c2r2 *+* · · · *+* c *n* r *n mod* p where the *ci* coefficients
    are blocks of the message to be authenticated and *r* is a 16-byte secret key.
    The value poly is therefore a number less than *p* = 2130 – 5, or (1 << 130) −
    5 in pseudocode (don’t write this in a C program; it won’t work). The final value
    of the MAC is (poly + *s*) mod 2128, where *s* is another 16-byte secret key.


    In its initial form, Poly1305 took as input a 32-byte key *k* and a per-message
    nonce *n*. It then computed *s* by AES-encrypting *n* with the first 16 bytes
    of *k* as a key and using the last 16 bytes of *k* as *r*. *ChaChaPoly* computes
    *r* and *s* by instead hashing the key and nonce supplied to the authenticated
    cipher to a 32-byte string. AES is thus not used.'
