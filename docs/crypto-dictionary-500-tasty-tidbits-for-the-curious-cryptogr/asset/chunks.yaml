    US Army and other organizations.


    **TOO MANY KEYS**


    If you thought key management for web applications was hard, wait until you have
    to do it in an environment with different classification levels, networks, device
    types, data management policies, and staff training.


    The fol owing (incomplete) list of EKMS key abbreviations il ustrates the complexity
    of managing keys in its target environments:


    ³ AEK: Algorithmic encryption key


    ³ KEK: Key encryption key


    ³ KPK: Key production key


    ³ OWK: Over the wire key


    ³ TEK: Traffic encryption key


    ³ TrKEK: Transmission key encryption key


    ³ TSK: Transmission security key


    The system classifies keys depending on their role (operational, maintenance,
    or test). Operational keys, in turn, can have a variety of different attributes:
    they can be emergency contingency keys, joint theater keys, or allied keys, among
    others.


    **40** Ed25519


    **Electronic codebook**


    A cipher, in archaic NSA parlance. For example: “Electronic codebooks, such as
    the Advanced Encryption Standard, are both widely used and difficult to attack
    cryptanalytically.”


    **ElGamal**


    For many years, the only public-key encryption scheme used and taught in crypto
    classes other than RSA. Introduced in the 1985


    article “A Public Key Cryptosystem and a Signature Scheme Based on Discrete Logarithms,”
    which modestly started with the following abstract:


    A new signature scheme is proposed together with an implementation of the Diffie–Hellman
    key distribution scheme that achieves a public **E**


    key cryptosystem. The security of both systems relies on the difficulty of computing
    discrete logarithms over finite fields.


    ECDSA eventually overshadowed the signature scheme, and


    currently, ElGamal encryption is rarely used. Instead, cryptographers use ECIES
    except in applications in which the message must be directly public-key-encrypted
    (as in some e-voting systems).


    The in-the-exponent variant of ElGamal encryption has two interesting properties:
    it is additively homomorphic, and decryption is impossible (unless you solve a
    discrete logarithm problem). Despite the latter suboptimal property, this version
    proved useful in threshold signature schemes.


    **Elligator**


    A method of encoding elliptic-curve points as random-looking strings to make public
    keys indistinguishable from encrypted data.


    **Elliptic curve**


    Not an ellipsis, not a curved line. A set of points on the plane whose ( *x*,
    *y*) coordinates satisfy the curve’s equation, which usually has the form *y*
    2 = *x* 3 + *ax* + *b*, where *a* and *b* are fixed parameters. Cryptographic
    applications only work with points whose coordinates belong to some finite field;
    therefore, the curve has a finite set of points.


    Elliptic curve **41**


    **FROM MATH TO CRYPTO**


    Elliptic curves were, of course, discovered before cryptography, and mathema-ticians
    studied them much earlier. For example, elliptic curves played a role in the proof
    of Fermat’s Last Theorem.


    Cryptography takes advantage of the fact that an elliptic curve’s points happen
    to form a group structure with respect to a geometrical y defined group operation,
    denoted as point addition. For wel -chosen curve types, the equivalent of the
    discrete logarithm problem becomes difficult in such groups, which is why these
    curves prove useful in public-key cryptography.


    **El iptic-curve cryptography**


    Public-key cryptography relying on elliptic curves and related hardness problems
    (the discrete logarithm, or a variant thereof). Elliptic-curve cryptography can
    do almost everything that legacy public-key cryptography can do, in a way that
    is often faster and uses shorter keys. That includes encryption, key agreement,
    and signature. In addition, you can use it for more exotic cryptographic schemes
    due to its support of pairings.


    A See *Pairing-based cryptography*.


    **Encipherment**


    A synonym of encryption with emphasis on the act and operations carried out during
    the encryption process. *To encipher*, like the French verb *chiffrer*, comes
    from the Arabic رفص ( *sifr*, the digit zero), whereas *to* *encrypt*, like the
    verb *crypter*, comes from the Greek *kryptos* (concealed, secret).


    **End-to-end encryption (E2EE)**


    Encryption is said to be end-to-end when only the dedicated recipient(s) can decrypt
    the messages. It sounds straightforward but is actually an arduous engineering
    problem.'
