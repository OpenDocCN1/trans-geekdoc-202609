- fmt: '

    One of the most important pieces of cryptographic software. Foremost a command
    line utility that supports a multitude of cryptographic operations (key generation,
    signature, encryption, certificate creation, encoding/decoding of various formats,
    and so on) for a multitude of algorithms (block ciphers, hash functions, elliptic
    curves, and so on, as well as legacy algorithms) and their parameters, and that
    runs on numerous CPU types and operating systems.


    If that isn’t enough, OpenSSL also provides two libraries: a cryptographic library
    (`libcrypto`) and an implementation of the SSL and TLS protocols (`libssl`), which
    uses `libcrypto`.


    # OPENSSL’S KITCHEN


    OpenSSL is like a 24/7 restaurant that offers burgers and pizza, as well as Japanese
    sushi, French coq au vin, Mexican tacos, and Swiss fondue. It’s extremely difficult
    to serve all dishes with the same level of quality.


    It also means that the kitchen must be a real mess. As cryptography professor
    Matthew Green once said,


    `OpenSSL is the space shuttle of crypto libraries. It will get you to space, provided
    you have a team of people to push the ten thousand buttons required to do so.`


    ## Oracle


    Rather like a crystal ball, an abstract entity that will respond to your requests,
    which cryptographers call oracle queries.


    The idea of cryptographic oracles comes from the `oracles` of complexity theory,
    where, for example, you attempt to solve problem 1 using an `oracle` that magically
    gives you solutions to problem 2, given the description of an instance of problem
    2. Given a factoring oracle, for instance, you can break RSA.


    ### Oracle 85


    Oracles are an abstraction used in research papers as a device to simplify security
    arguments, proofs, or cryptanalytic attacks. You might encounter encryption oracles,
    decryption oracles, factorization oracles, and many more. Random oracles are the
    most common because of their unique role in proofs of security.


    A See `Random oracle`.


    ## OTR (Off-the-Record)


    The end-to-end encryption protocol initially designed for synchronous communications.
    Capable of running atop messaging protocols, such as XMPP or IRC. A unique aspect
    of OTR is its deniability property, whereby peers can deny having sent a message
    by leaking the MAC key used to sign it. OTR is the basis for what became known
    as the Signal protocol.


    ## P


    ### Padding oracle attack


    A class of side-channel attacks that exploit information about whether the padding
    of some encrypted message is valid. An attacker could learn that information by
    measuring the decryption execution time, which sometimes depends on the padding’s
    correctness. The most common padding oracle attacks are those applied to the CBC
    block cipher mode, the Bleichenbacher attack on PKCS#1 v1.5, and Manger attack
    on OAEP (PKCS#1 v2) encryption. The idea of padding oracles can be generalized
    to format oracles, which reveal the existence of some known pattern in the decrypted
    message (for example, a specific encoding or character set).


    Developers have sometimes deployed countermeasures to padding oracle attacks accidentally—namely,
    when certain implementations don’t check the padding correctly (but this creates
    other problems).


    A See `Bleichenbacher attack`, `CBC (cipher block chaining)`, `Manger attack`.


    ### 86 OTR (Off-the-Record)


    ### Paillier cryptosystem


    A public-key encryption scheme that is a bit more mathematically interesting than
    RSA, ElGamal, and IES. Paillier’s encryption has the rare property of additive
    homomorphism, meaning that `Dec(Enc(M 1) × Enc(M 2)) = M 1 + M 2`. Its security
    is based on the hardness of the factoring problem as well as that of a related
    problem—the decisional composite residuosity problem, introduced with Paillier’s
    cryptosystem, which is about deciding whether there exists `x` such that `y =
    xd mod n2` given `n` and `y`.


    ## Pairing


    In public-key cryptography, nothing to do with the Bluetooth pairing operation.
    A pairing is a map `e()` of two group elements to an element from another group,
    with the following property, for any `R`, `S`, `T`: `e(R + S, T) = e(R, T) e(S,
    T)`. This is called bilinearity and is what makes pairings useful in cryptography.
    These properties hold as well for a bilinear pairing: `e(S, -T) = e(-S, T) = e(S,
    T)-1`, `e(aS, bT) = e(S, T) *ab`. The bilinear counterpart of the Diffie–Hellman
    problem for pairings is the following: given `P`, `aP`, `bP`, `cP`, find `e(P,
    P) *abc`. For well-chosen types of pairing and elliptic curves, this problem is
    believed to be about as hard as its classical version.


    ## Pairing-based cryptography


    Cryptography that uses pairings, duh. Pairings on elliptic curves allow the creation
    of bilinear maps, which allow you to construct—under some hardness assumptions—secure
    functionalities that classical, discrete, logarithm-based elliptic-curve cryptography
    cannot. These functionalities include one-round three-party key agreement, identity-based
    encryption, attribute-based encryption, short signatures, and verifiable random
    functions.


    ### Pairing-based cryptography 87


    ### TRIPARTITE KEY AGREEMENT


    Cryptographers began using pairings in cryptography to achieve three-party key
    agreement in just one round of communication. With pairings, this works as follows,
    given a common base point `P`:


    1. Alice generates an integer `a` and broadcasts `aP`.

    2. Bob generates an integer `b` and broadcasts `bP`.

    3. Chris generates an integer `c` and broadcasts `cP`.


    Then Alice computes the shared secret as `e(bP, cP) * a = e(P, P) * abc`. Bob
    and Chris run a similar operation to obtain the same value.


    ## PAKE (password-authenticated key exchange)


    An authenticated key agreement (or exchange) protocol where the client’s authentication
    relies on the knowledge of a password. In most PAKEs, the server doesn’t know
    the password but only some data derived from it. PAKEs where both parties know
    the password are called balanced PAKEs.


    PAKEs try to prevent the straightforward password-guessing attacks possible in
    send-the-password-or-its-hash methods of key exchange.


    But this small benefit comes at a high cost: PAKEs add complexity and deployment
    cost, which is why they’re rarely used. As Matthew Green wrote, “Many people don’t
    want to run a `key exchange` protocol in the first place! They just want to verify
    that a user knows a password.”


    ## Paradigm


    An overused word in cryptography, especially when preceded by `new`.


    ## Password hash function


    A hash function whose goal is to be slow rather than fast.


    ### WHY PASSWORD HASHES ARE INSECURE


    If `M` is an arbitrary string of bits, then given a hash value `H = Hash(M)`,
    you’ll never find `M`. The reason is that 1) finding any preimage of `H` will
    be computationally infeasible if `H` is long enough, and 2) even with infinite
    computing power, you’d have no way of singling out `M` among all the values that
    map to `H`, which is impossible, according to the pigeon-hole principle.


    But if you know that `M` is a password chosen by a human, retrieving it becomes
    much easier. You might be able to find a password `M` that hashes to `H` and be
    reasonably sure that it was the password hashed in the first place, because there
    are way fewer rememberable passwords than possible values of `H`. In other words,
    as an unknown input value, a typical password has much **P**


    lower entropy than an arbitrary string.


    ### 88 PAKE (password-authenticated key exchange)

