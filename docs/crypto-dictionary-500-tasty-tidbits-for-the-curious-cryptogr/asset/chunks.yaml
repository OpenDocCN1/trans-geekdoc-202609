  trans: '


    《密码史密》（Cryptonomicon）*也是现实书籍中的一本虚构书籍：*他们拥有足够的知识，换句话说，他们理解《密码史密》极其重要，并且他们有智慧采取必要措施确保其安全。其中一些人实际上经常会咨询它，并利用其智慧破解日本人的电报，甚至破解整个加密系统。*


    《密码史密》**29**


    （. . .）


    《密码史密》指出，zeta 函数在今天仍被用作序列生成器用于密码学中。


    ## 隐睾丸症 (Cryptorchidism)


    一种最好保持保密的状况。


    ## 密码病毒学 (Cryptovirology)


    由 2004 年的书籍《恶意加密学：揭秘密码病毒学》（Malicious Cryptography: Exposing Cryptovirology）普及。该书将密码病毒学描述为“密码学的黑暗面——为了击败木洛马、病毒、密码盗取和其他网络犯罪而开发的设备（……）将设计用于保护数据的方法本身转化为颠覆数据手段的艺术。”


    参见*窃密密码学（Kleptography）。


    ## CRYPTREC


    日本政府负责制定官方密码建议的密码研究与评估委员会。


    ### CRYPTREC 推荐算法


    截至 2020 年，CRYPTREC 的最高层级是其*电子政府推荐算法*列表，其中包括常见的公钥方案、`AES` 及其常用模式，以及 `SHA-2` 哈希函数。除了
    `AES` 之外，它还推荐了块密码 `Camellia` 以及流密码 `Kipher-2`。


    中间层，或*候选推荐算法*列表，显著包括五种块密码 `CIPHERUNICORN`、`CLEFIA`、`Hierocrypt`、`MISTY1` 和 `SC2000`。它还包括
    `SHA-3` 哈希函数和 `XOFs`，以及 `ChaCha20-Poly1305` 认证加密。


    低层，即*监控算法列表*，是对你应该避免使用的算法的委婉说法，包含了常见的“嫌对象”：`SHA-1` 和 `3DES`（但不包括 `MD5`），以及 `RIPEMD160`。


    ## CSIDH（同源超奇异同映射迪菲-海尔曼）读音为 *seaside*，是最古老的基于同源的方案，为了效率被重新审。尽管存在众知的亚指数级量子攻击，它也是唯一吸引了大约
    **30** 个隐睾丸症关注的后量子方案。用密码分析学家的话，建议的参数“提供的量子安全性相对较低”；然而，支持者指出它在后量子领域的独特应用，例如静态密钥交换。


    它与 `SIDH` 不同。


    参见*迪菲-海尔曼（Diffie–Hellman）*，*后量子密码学*。


    ## C


    ## CTF (夺旗赛)


    信息安全社区的一项热门竞赛。在过去的 15 年里，CTF 中提出的密码挑战已经从维吉尼亚密码和视觉谜题，演变为涉及最前沿研究的任务。例如，2020 年 PlaidCTF
    的参赛者必须破解一种基于同源的加密系统（`SIDH`）并求解一个多元方程组。


    ## 立方体攻击 (Cube attack)


    一种高阶差分密码分析技术，于 2008 年描述。


    ### 立方体攻击何时有效


    在任何加密函数中，`cube` 指的是 3D 维度。


