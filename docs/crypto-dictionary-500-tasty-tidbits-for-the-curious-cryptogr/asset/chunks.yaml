    一种基于词列表猜测密码的攻击。密码的熵值较低，因为它们通常由字典单词和常见的专有名词组成。攻击者可以构建一个按流行程度排序的候选密码列表，并一个接一个或并行尝试这些密码，以找到与从某些密码哈希数据库获得的哈希值匹配的密码。


    ## 差分密码分析


    一类密码分析技术，它通过研究差异在内部计算过程中的传播，来利用输出中的某些模式或统计偏差。针对对称加密算法（分组密码、哈希函数等）的大多数攻击都是某种类型的差分密码分析。


    所利用的差异可以是两个输入值之间的，也可以是两个以上输入值之间的，例如高阶密码分析及其变体（积分密码分析、立方体攻击等）。另一种相关技术线性密码分析看起来略有不同，但最终与差分密码分析有关。此外，线性攻击通常意味着纯差分攻击的可能性。


    ## 迪菲-赫尔曼


    “在密码学领域的许多人对实际应用问题没有深入关注。他们正试图发现足够聪明到可以写论文的东西。”——怀特菲德·迪菲（Whitfield Diffie）


    大多数密钥协商协议背后的一种相当简单的数学技巧，并间接支持了许多更多的加密系统。


    你经常会发现安全证明依赖于迪菲-赫尔曼问题的困难性（给定 `ga` 和 `gb`，找到 `gab`）或其变体。


    判定迪菲-赫尔曼问题（DDH）被密码学家丹·博内赫（Dan Boneh）称为“金矿”，并被用于构建加密方案（如 Cramer–Shoup 构造）以及复杂的协议（如阈值签名方案）。


    参见 *密码学新方向 (New Directions in Cryptography)*。


    ## 披露


    当漏洞被赋予一个巧妙的缩写，并配有一个精美的网站（包括问答和 Logo）时，这种方法更为有效。


    研究人员首次通过这种方法向世界介绍了 Heartbleed 漏洞；随后他们利用这种方法描述了后续针对 SSL/TLS 的攻击。这让他们能够更好地交流新漏洞（并减少了回复记者邮件的时间）。著名的例子包括：


    - `BREACH`：通过超文本自适应压缩进行的浏览器侦察与数据外泄

    - `CRIME`：简单的压缩率信息泄露

    - `DROWN`：使用过时且弱化的加密解密 RSA

    - `POODLE`：降级旧版加密上的填充 Oracle 攻击

    - `ROBOT`：Bleichenbacher Oracle 威胁的回归


    ## 离散对数问题


    在 `y = xd mod p` 中寻找 `d`（对于质数 `p`），或在椭圆曲线群中寻找 `dG = P` 中的 `d` 问题。离散对数问题现在是密码学中最重要的计算问题，仅次于因子分解，因为类似于迪菲-赫尔曼的协议已比
    RSA 和 Paillier 加密系统更常见。


    ## 区分器


    一种用于针对方案不可区分性攻击的算法。


    例如，如果你在伪随机数生成器的输出中发现统计偏差，那么该偏差将充当 `distinguisher`，从而破坏 PRNG。


    参见 *不可区分性 (Indistinguishability)*。


    ## 分布式随机性


    由一组并不一定相互信任的参与生成的随机性；因此，他们不希望任何一方能够影响结果。在这种背景下，一种简单的协议（如对每个参与者的随机贡献进行 `XOR` 运算）是不安全的。原因是最后一个贡献者可以将其值设置为某个值，当该值与之前所有值的组合进行
    `XOR` 时，会产生他们希望返回的结果。提前发布承诺（commitments）部分解决了这个问题。


    ## Dolev–Yao 模型


    用于定义密码协议的第一个正式模型。也是一种用于描述和分析其安全性的符号框架。


    密码学家在指代主动攻击者对抗模型（即 active attacker adversarial model）时，有时会提到 Dolev–Yao 模型——即在该模型中，攻击者可以窃听、拦截和修改传输的数据。


    但 Dolev–Yao 模型不仅于此：它是一个用于描述和分析协议安全性的通用符号框架。


    ## 双棘轮


    Signal 消息协议的一个子协议。它确定每条消息的唯一密钥，使得已知某时刻消息密钥的攻击者既无法确定过去或未来的消息密钥，从而提供了前向安全性某种形式的后向安全性。


    参见 *Signal 协议 (Signal protocol)*。


    ## 单棘轮，双棘轮


    双棘轮是一种高度状态化的协议。它被称为“双”是因为它结合了两种技术：


    - 对称密钥棘轮 (`symmetric-key ratchet`)：维护一个从派生消息密钥的哈希链。

    - 迪菲-赫尔曼棘轮 (`Diffie–Hellman ratchet`)：使用临时密钥对执行迪菲-赫尔曼密钥交换，以使未来的状态不可预测。


    ## 龙鳞 (Dragonfly)


    为 Wi-Fi 安全套件 WPA3 中的认证标准 EAP-pwd 定义 PAKE。攻击者可以通过利用哈希曲线（hash-to-curve）操作中的计时侧信道来绕过
    Dragonfly 的实现。


    参见 *PAKE (密码认证密钥协商)*。


    ## DRBG (确定性随机位生成器)


    一个听起来像矛盾的术语，指一个在给定情况下确定性地生成长随机位字符串的组件（称为 `seed`、`key` 或有时称为 `entropy`）。操作系统的随机生成器通常包含一个熵提取机制，从模拟源生成这些不可预测位并推入熵池。


    DRBG 与 PRNG 不同；`PBG` 和 `DRNG` 术语很少使用。


    参见 *伪随机生成器 (PRNG)*。


    ## DSA (数字签名算法)


    由 NSA 设计并专利的公钥签名方案。


    它在 1991 年作为 `DSS`（数字签名标准）的一部分被标准化。这一选择引起了一些批评，NIST 在《联邦计算机周刊》杂志上回应：“NIST 做出了最终决定。我们获得了
    NSA 的技术协助，也收到了其他意见，但 [NIST] 做出了最终决定。”


    当时对 `DSA` 的批评在于其效率、不完整（未指定哈希函数）、专利侵权风险以及安全性。


    参见 *数字签名标准 (DSS)*。


    ## DSS (数字签名标准)


    NIST 关于数字签名的标准；并非单一算法。


    1982 年，NIST（当时称为 NBS）发布了“公钥加密算法征集”。NIST 后来对分组密码和哈希函数发布了类似的征集，产生了 AES 和 SHA-3 标准。1987
    年，NIST 在请求下取消了 DSS 项目。标准化工作随后重启，导致在 1991 年建立了多项标准，包括 NSA 设计的 `DSA`。


    `DSS` 也是三甲基丙烷磺钠化学化合物的缩写，它与密码学有某种联系。


    ## DVB-CSA


    常用扰乱算法（Common Scrambling Algorithm）：一种由数字节目联盟标准化的算法，用于保护电视系统中的视频内容，通常通过加密 MPEG
    传输流包。


    参见 *控制字 (Control word)*。


    ### DVB-CSA 版本


    DVB-CSA 标准的第一版本称为 `CSA1`，结合了流密码和分组密码，并具有 48 位密钥。`CSA2` 类似，但具有 64 位的密钥。如果你认为这些密钥长度太短，请记住，对于大多数直播内容，密钥通常每
    5 或 10 秒更改一次。


