    \ like to publish papers about but don’t like to see deployed in reality because\
    \ it’s perceived as unacceptably risky.\n\nE-voting is nonetheless cryptographically\
    \ fascinating. It involves nontrivial cryptography, such as homomorphic encryption\
    \ schemes used to encrypt ballots and aggregate them in a privacy-preserving way,\
    \ and noninteractive zero-knowledge proofs, which are used to prove a vote’s correctness.\n\
    \n**F**\n\n**Factoring problem**\n\nGiven *n* = *pq*, find the primes *p* and\
    \ *q*. Easy to solve if you have a large enough quantum computer.\n\nFactoring\
    \ problem **45**\n\n**Feedback shift register**\n\nAn array of values, usually\
    \ bits or bytes, that updates by shifting the values over and then filling the\
    \ empty slot with the result of some function of the previous state’s values.\
    \ Historically, this cipher mechanism came after electromechanical machines and\
    \ preceded modern ciphers.\n\nIt’s still used in some hardware-oriented algorithms\
    \ and in the mobile communication standard SNOW 3G.\n\nThere are two kinds of\
    \ feedback shift registers. In linear ones (LFSRs), this update function is linear,\
    \ which renders the output predictable but can also provide guarantees that the\
    \ period of LFSR is maximal. In nonlinear ones (NFSRs), after a few cycles of\
    \ updates, the output values are highly nonlinear functions of the initial state,\
    \ but guarantees on the period are difficult to compute. Concretely, linear update\
    \ functions only do additions, whereas nonlinear ones do additions and multiplications.\n\
    \nA good design strategy is to combine LFSRs and NFSRs.\n\nA See *Grain*, *SNOW\
    \ 3G*, *Trivium*.\n\n**Feistel network**\n\nA method of constructing a block cipher\
    \ from a smaller block cipher or hash function. It works by splitting the message\
    \ block in two halves, *L*\n\nand *R*,  and updating it by repeatedly replacing\
    \ ( *L*, *R*) with ( *R*, *L* ⊕ *f*( *R*)), where *f*() is the smaller function\
    \ and can take a secret value as a parameter. Feistel network is sometimes called\
    \ *Luby–Rackoff construction* after the researchers who formally analyzed its\
    \ security. The XOR operation can be replaced by another group operation.\n\n\
    A See *DES (Data Encryption Standard)*, *Lucifer*.\n\n**Fialka (Фиалка)**\n\n\
    The Soviet counterpart to the Enigma machine created after World War II. Unlike\
