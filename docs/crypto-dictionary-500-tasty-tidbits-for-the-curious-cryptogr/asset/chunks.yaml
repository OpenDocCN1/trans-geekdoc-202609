    一种从 `SHA-1` 使用的压缩函数提取的块密码。更准确地说，`SHACAL` 是 `SHA-1` 中 Davies–Meyer 构造实例的密钥置换。同样，`SHACAL-2`
    是 `SHA-256` 的块密码；它曾被提交给 NESSIE 项目并入选。


    `SHACAL` 的发音类似于法语单词 `chacal`，意为胡爪。


    ### Shamir 的秘密数据库


    据传阿迪·沙米（Adi Shamir）创建了一个包含所有质数（因此包含所有 RSA 私钥）的列表，用以瞬间破解 RSA。据我们所知，这一传闻从未被证实或否认。


    ### Shor 算法


    一种能够以实际复杂度解决因数分解和离散对数求解的量子算法。Shor 算法是后量子密码学领域存在的原因。


    ### 114 SHA-3 竞赛


    ### SHS (安全哈希标准)


    `FIPS 180-4` 文规定了 `SHA-1` 和 `SHA-2` 算法，“用于计算电子数据（消息）的压缩表示”。


    `SHA-3` 规范在标题为“SHA-3 标准：基于置换的哈希和可扩展输出函数”的独立文档中（`FIPS 202`）。


    ### 侧信道


    除指定的输出值外获取加密操作信息的方法。


    ### 侧信道攻击


    利用某些侧信道信息的攻击，可以是被动或主动、本地或远程、基于物理或逻辑属性。侧信道攻击并不一定需要物理访问被攻击的模块。


    ### 侧信道的种类


    以下侧信道攻击分类的不完全列表：

    - 执行时间取决于敏感数据时的计时攻击

    - 故障攻击，例如 CPU 超频、电压故障注入和激光故障注入

    - 对物理现象的简单测量或差异分析：声波、电磁辐射和热量

    - 通过 `procfs`、`dmesg` 条目、竞态条件和各种 `ASLR` 泄漏导致的操作系统泄露

    - 加密通信的流量分析

    - 微体系攻击，例如缓存攻击

    - 窥视和对用户动作的观察


    ### Sigaba


    设计于 20 世纪 30 年代的美国版 Enigma。它从未被正式破解。


    Sigaba 115


    ### Signal 协议


    `X3DH` 会话初始化协议与双轮迭代状态更新及密钥更新协议的结合，如 `Signal` 应用所用。类似的协议也被集成到 `WhatsApp` 和 `Facebook
    Messenger` 中，重用了为 `Signal` 开发的库。`Signal` 协议后的密码学研究和工程对安全即时应用产生了重大影响。


    参见 `Double ratchet`、`X3DH`。


    ### 签名


    公钥签名或数字签名，但区别于电子签名、e-签名或电磁签名。它有时被“大不敬”地定义为`使用私钥加密`。


    ### 签名的安全目标是什么？


    一位天才计算机科学硕士生曾辩护过他的硕士论文项目（关于后量子密码学）。在答辩的问答环节，在回答关于他工作的问题后，他的密码学教授问他：“签名的安全目标是什么？”


    该学生被这个看似简单的问题困扰了。


    签名在自适应选择消息攻击下应当是不可伪造的。如果攻击者可以请求合法签名者对其选择的任何消息进行签名，那么攻击者就不应该能够计算任何其他消息的签名。


    因此，该学生无力地回答道：“自适应选择消息攻击下的存在不可伪造性。”


    教授说不，这并不是公钥签名的唯一目标，因为毕竟，`MACs` 也试图达到类似的目标。


    教授预期的答案是`不可否认性`，即签名者不能声称签名是他人代表他们发出的，因为没有其他人知道私签名密钥。


