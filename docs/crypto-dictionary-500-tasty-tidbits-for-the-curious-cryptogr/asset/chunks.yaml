    secret messages over tapped telephones. (. . .) Alice and Bob have very powerful
    enemies. One of their enemies is the Tax Authority. Another is the Secret Police.
    This is a pity, since their favorite topics of discussion are tax frauds and overthrowing
    the government.”


    A See *Bob*.


    **Al -or-nothing transform (AONT)**


    A reversible transformation where you need every bit of the output to determine
    any bit of the input. When an encryption scheme is an AONT, the decryption key
    is useless to determine the plaintext if you miss some bits of the ciphertext
    (unless the missing bits are so few that they can be brute-forced). The OAEP construction
    used for RSA encryption is an example of AONT. CBC or GCM encryption modes aren’t
    AONTs.


    All-or-nothing transform (AONT) **7**


    **Anonymous signature**


    A signature that doesn’t reveal the identity (public key) of the signer and therefore
    needs some interaction with the signer to verify it. It implies invisibility.


    A See *Invisible signature*.


    ***Applied Cryptography***


    The 1996 book by Bruce Schneier that has been the main reference in the field
    for many years; it introduced many students and engineers to cryptography. Famous
    for its opening paragraph: “There are two kinds of cryptography in this world:
    cryptography that will stop your kid sister from reading your files, and cryptography
    that will stop major governments from reading your files. This book is about the
    latter.”


    Inevitably outdated 25 years after its publication, *Applied Cryptography* is  still
    worth keeping on your shelf as long as you don’t blindly follow all of its recommendations.
    It’s also much less outdated than Schneier’s two prior books, *E-Mail Security*
    and *Protect Your Macintosh*.


    **Applied cryptography**


    The part of cryptography that emphasizes direct applications. In contrast, theoretical
    cryptography is less about engineering and more about fundamental understanding
    and analysis. The term *applied* is deceiving; both applied and theoretical cryptography
    can (and ought to?) be equally relevant to real applications.


    **ARC4**


    The original name of the RC4 stream cipher; also written as ARCFOUR.


    Before the reverse engineered RC4 was confirmed to be the actual RC4, it was prudently
    referred to as *alleged RC4*, which was shortened to ARC4.


    **Argon2**


    A password hashing function developed during the Password Hashing Competition.
    Also, a de facto standard for processing passwords or any low-entropy secret to
    derive cryptographic keys or store a verifier in a way that prevents efficient
    cracking using GPUs, FPGAs, dedicated hardware, precomputed tables, or side-channel
    attacks.


    Unlike PBKDF2, Argon2 can enforce the use of a certain amount of memory in addition
    to a configurable number of iterations. Unlike **8** Anonymous signature


    bcrypt, this amount of memory can be an arbitrary value rather than fixed. Unlike
    scrypt and the two others, Argon2 offers a user-friendly **A**


    interface to easily pick time and memory parameters. It’s also a simple design
    that only uses the hash function BLAKE2 internally rather than a combination of
    all the cryptography ever designed.


    A See *bcrypt*, *scrypt*, *PBKDF2 (Password-Based Key Derivation Function 2)*.


    **ARX (Add-Rotate-XOR)**'
