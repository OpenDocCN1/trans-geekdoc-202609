  trans: '


    一套中国国家密码标准，包括中国某些产品强制使用的公开算法。


    `SM` 族包含了椭圆曲线公钥加密（`SM2`）、哈希函数（`SM3`）、分组密码（`SM4`），以及基于身份的加密（`SM9`）。


    ### 智能合约

    运行在区块链平台上的程序。智能合约中的漏洞往往会导致灾难性的后果。


    ### 蛇油（Snake-oil）

    布鲁斯·施奈尔（Bruce Schneier）在 1999 年提出的蛇油警告信号在今天 `S` 依然适用：


    1. 伪数学的胡言乱语

    2. 新数学

    3. 专有加密

    4. 极度的无知

    5. 荒谬的密钥长度

    6. 一次性密码

    7. 缺乏依据的陈声

    8. 安全证明

    9. 破解大赛


    ### SNARK（简洁非交互式知识证明）

    一种强大且高效的知识证明类型。于 2011 年的文章《从可提取碰撞抗性到简洁非交互式知识证明，及其反之》中引入。它是 `SNARG`（简洁非交互式证明）的变体，因为
    `SNARK` 是“关于知识的 SNARG”。例如，`SNARK` 可用于（非交互式）计算委托，工作者使用 `SNARK` 来证明他们执行了正确的计算。


    当 `SNARK` 是零知识时，我们称之为 `zk-SNARK`，它被著名地用于 Zcash 区块链协议，通过证明代币已从发送者传输到接收者（而不泄露任何人的身份或传输金额）来实现交易匿名化。


    `SNARK`（简洁非交互式知识证明）**119**


    后量子 `SNARKs` 已经存在，但效率低于前量子版本。


    ### 剖析 SNARKS

    以下从末尾开始逐词解释 `SNARK`：一个`知识论`（`argument of knowledge`）对于一个实用的且安全的知识证明至关重要，而严格来说，`知识证明`（`proof
    of knowledge`）留给对计算能力无限制攻击者保持安全的证明。在密码学应用背景下，所证明的“知识”可以是秘密值，也可以是必须保密的值之间的关系。


    `非交互`（`Non-interactive`）仅意味着 `SNARK` 是从证明者到验证者的单条消息，而不是涉及多条消息的协议。


    `简洁`（`Succinct`）意味着消息的大小较小，即使证明涵盖了大量数据，而且它是可以高效验证的。


    ### SNIP（秘密共享非交互式证明）

    一种具有一个证明者和多个验证者的零知识协议，每个验证者都持有正确性证明的一份份额。每个验证者持有秘密值的一份份额；证明者向每个验证者发送不同的证明字符串，允许验证者协作，根据某些预定义的谓词检查秘密的有效性，而不会泄露关于该秘密的任何信息。`SNIPs`
    被引入作为构建保护隐私的聚合统计方案的工具。


    ### SNOW 3G

    一种用于 3G、4G 和 5G 通信中加密语音通信的流密码。与其早期的前身 `A5/1`一样，`SNOW 3G` 通过更新由反馈移位寄存器组成的状态来工作，使其易于实现且高效。与
    `A5/1` 不同，`SNOW 3G` 是安全的。2020 年提出了一种用于 5G 网络的新版本 `SNOW 3G` 即 `SNOW-V`，以便在软件中运行更快，因为
    5G 比之前的标准更依赖软件和虚拟化环境。


    见*反馈移位寄存器*。


    **120** `SNIP`（秘密共享非交互式证明）


    ### 独行侠（Solitaire）

    布鲁斯·施奈尔为小说《加密狂》（*Cryptonomicon*）创建的一种流密码。


    小说中的人物在不使用计算机的情况下使用它。正如施奈尔描述的：


    ```

    Solitaire 的安全性来自于洗过的扑牌牌中固有的随机性。通过操纵这副牌牌，通信者可以创建一个随机字母字符串，然后将其与信息结合。当然，Solitaire
    可以在计算机上模拟，但它的设计是为了手动手工实现的。

    ```


    `Solitaire` 在今天的学术标准下已被破解（它具有统计偏向），但对于纸笔密码来说相当安全，在正确使用时在实践中是安全的。


    `S`

    见《加密狂》（*Cryptonomicon*）。


    ### SPECK

    一种美国国家安全局（NSA）轻量级密码。


    见*SIMON*。


    ### SPEKE（简单密码指数密钥交换）

    PAKE 在 PAKEs 流行很久以前发明了（1996 年）。


    ### SPHINCS

    一种基于哈希的签名方案，与 `XMSS` 不同，它是无状态的但它比 `XMSS` 更复杂。`Gravity-SPHINCS` 和 `SPHINCS+` 是提交给
    NIST 后量子竞赛的 `SPHINCS` 变体。不要与 `SPHINX` 混合网混淆。


    见*XMSS*。


    ### 海绵函数（Sponge function）

    设计哈希函数的简单方法。海绵函数仅使用排列算法——相对于密钥排列或分组密码。由 `Keccak` 开创（现为 `SHA-3`），它催生了许多基于排列的方案。


    见*Keccak*、*基于排列的密码学*。


    海绵函数 **121**


    ### SRP（安全远程密码）

    依赖 Diffie–Hellman 问题的 PAKE。`SRP` 可以与 `TLS` 结合，并显著用于 `i Keychain`。但总而言之，它的应用较少，可能是因为早期版本的
    `SRP` 存在漏洞。


    ### SSH（安全 Shell）

    基于 `TCP` 的安全通道。`SSH` 并不依赖 `PKI` 或 `X.509` 证书，而是信任首次信任模型。`SSH` 中发现的安全问题比 `TLS`
    少。


    ### SSL（安全套层）

    非 `TLS`。`SSL` 是该流行协议的前身；设计于 90 年代，第一个版本因不安全从未发布。


    `v2` 于 1995 年 3 月随 Netscape Navigator 1.1 发布，不久后发布了 `v3` 以缓解中间人攻击（通过降级到弱加密套件）。尽管如此，许多系统继续支持
    `SSL v2` 以于兼容。二十年后，`DROWN` 攻击利用了对 `SSL v2` 的这种支持来攻击最近的 `TLS` 版本。


    ### STARK（透明知识证明）

    `SNARK` 的变体。`STARK` 的出现源于需要高效且可扩展的知识证明的应用，其约束比 `SNARK` 更少。以下是 `STARK` 和 `SNARK`
    的主要区别：


    ³ `STARK` 不需要*可信设置*——这是一个必须由信任方执行以确保后续证明安全的过程。

    ³ `STARK` 可以防御量子算法，而已知的 `SNARK` 构造通常不能（除非有某些约束）。

    ³ `STARK` 创建速度快一点，但验证速度慢一点。


    见*SNARK（简洁非交互式知识证明)*。


    **122** SRP（安全远程密码）


    ### 隐写术

    更多属于信号处理而非密码学的隐蔽通信技术。


    ### 流密码

    一种加密类型，你可以将其看作是从密钥和（唯一的）随机数加密生成的的一次性密码。分组密码 `DES` 设计于 70 年代，时考虑了硬件实现；后来流密码 `RC4`
    因其面向字节的机制而设计设计得对软件友好。然而在 90 年代，流密码通常被认为是*硬件密码*，通常基于具有最小外围反馈移位寄存器，如 `Grain` 或 `SNOW
    3G`。相反，分组密码被认为是软件密码，正如 `AES` 竞赛在 2000 年的要求所明确的那样。确实，在*轻量级密码学*术语出现之前，就会发现流密码被受限的应用中。


