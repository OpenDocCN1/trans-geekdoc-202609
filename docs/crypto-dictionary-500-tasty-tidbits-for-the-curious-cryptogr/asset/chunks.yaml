    来自 `Salsa20` 系列的唯一哈希函数。`Rumba20` 在关于广义生日问题的新结果背景下创建的。


    ## Rumba20 109


    ### S

    #### SAEP (Simplified OAEP)

    `OAEP` 的变体，略为简单，且实现了相同水平的选择性密文攻击安全性。


    参见 `OAEP (Optimal Asymmetric Encryption Padding).`


    ### Salsa20

    无疑是最具影响力的加密算法之一。它催生了流密码 `ChaCha20`（用于 TLS、`SSH` 以及许多其他地方）。这随后被重用在 `BLAKE2` 哈希函数中，它是
    `Argon2` 密码哈希以及 `WireGuard` 等协议的组件。


    更广泛地说，`Salsa20` 普及了简单、易于实现的加-旋转-异或（`ARX`）结构。几年前，NIST 标准化了一种更复杂的算法，理解它需要掌握多项式、矩阵求逆和有限域等概念知识。


    `Salsa20` 中的 `20` 代表其轮数，这是最初由设计者选择的一个保守值，后来在某些应用中被简化，减少到 `12` 甚至 `8`。


    ### 三明治攻击 (Sandwich attack)

    `回弹攻击` (boomerang attack) 的改进版，常用于分析分组密码。`三明治攻击`依赖于分为三个部分的区分器：“顶部是一个厚片（面包），中间是一个薄片（肉），底部是一个厚片（面包）。”它的发明是为了找到对分组密码
    `KASUMI` 的首次实用攻击。


    参见 `Boomerang attack.`


    ### S 盒 (S-box)

    分组密码中使用的查找表，用于实现具有可测量安全属性（如非线性或分支数）的非线性变换，尽管 S 盒并不一定以查找表的形式实现。在差分密码分析背景下，活跃 `S-box`
    是指两个（不同）输入值产生不同的 S 盒输入值，从而产生不同输出的盒。


    ## 110 SAEP (Simplified OAEP)

    S 盒通常是 4 位的（16 个值，如 `Serpent`）或 8 位（256 个值，如 `Rijndael/AES`）。


    ### 标量 (Scalar)

    一个数字，相对于向量或群元素。例如，当你在加密中听到 `标量乘法` 时，它通常意味着根据该曲线定义的加法法则，将椭圆曲线上的点与一个数字相乘。


    ### sci.crypt

    与 `sci.crypt.research` 一起，这是一个 Usenet 新组，Twitter 和 Slack 出现之前人们在那里讨论密码学。它因发布“你能破解我的加密吗，这里是密文”之类的帖子而闻名。


    ### S

    #### 扰码器 (Scrambler)

    用于电信和音视频内容处理的加密器的旧称。这些算法中的第一个在密码学上是很弱的，因为它们并没有真正加密信号，而是有效地使其变得无法理解。后来的算法演变成了真正的加密技术。


    参见 `DVB-CSA.`


    ### scrypt

    一种可配置时间内存使用的密码哈希函数，发音为 *ess-crypt*。`scrypt` 开创了内存困难型密码哈希，并启发了随后的设计以及密码哈希竞赛 (Password
    Hashing Competition)。


    `scrypt` 具有模块化的设计，如果不是极简主义的话。它包含了子组件基于 `HMAC-SHA-256` 的 `PBKDF2` 结构以及 `Salsa20/8`
    流密码。


    ### 可搜索加密 (Searchable encryption)

    对数据库记录进行加密，允许对加密数据进行搜索。例如，它允许在给定加密关键词的情况下检索出加密项，这些条目在解密后包含该关键词。


    可能实用且有效的可搜索加密方案会泄露一些关于加密数据的信息。相比之下，那些具有最高安全保障的可搜索 111 在功能和性能方面受到严重限制（例如，那些使用函数加密、同态加密和忽略
    RAM 的方案）。


    ### secp256k1

    `Bitcoin`、`Ethereum` 以及许多其他加密货币用于交易 `ECDSA` 名的椭圆曲线。`k` 表示 Koblitz 曲线。与其他标准曲线不同，特别是与普及的
    `secp256r1`（也称为 `NIST p-256`）不同，`secp256k1` 不依赖伪随机参数，在原则上不太可能被操纵。中本·聪聪（Satoshi
    Nakamoto）或任何人选择使用 `secp256k1` 的实际原因尚不清楚。


    ### 秘密共享 (Secret sharing)

    参见 `Searchable encryption.`


    ### 安全性 (Security)

    方案的 `安全性` 并不意味着它是安全的。方案的 `安全性` 是密码学的一个重要方面。


    ### 安全性证明 (Security proof)

    证明算法是安全的。方案的 `安全性证明` 通常是可实现的。


    ### 语义安全性 (Semantic security)

    参见 `IND-CPA.`


    ## 112 secp256k1

    ### 严肃密码学 (Serious Cryptography)

    又一本关于密码学的书。


    ### Serpent

    事后看，它本可以是 AES 标准的一个很好的选择；它的实现没有偏离规范太远。


    参见 `PRESENT.`


    ### SHA-0

    ### S

    `SHA-1` 的初稿。


    ### SHA-1

    如果你需要的安全性只是抗原像性，那么它就是一个安全的哈希函数。从 2005 年描述的碰撞攻击到实现碰撞花费了 12 年时间。


    ### SHA-2

    不是一个而是四个哈希函数：

    `SHA-256` 看起来像 `SHA-1` 但轮数更多。

    `SHA-224` 是具有 224 位输出的 `SHA-256`。

    `SHA-512` 看起来像 `SHA-256` 但使用了 64 位字而不是 32 位。

    `SHA-384` 是具有 384 位输出的 `SHA-512`。

    与 `SHA-1` 不同，`SHA-2` 算法没有破解，未来也不会。


    ### SHA-3

    当有人告诉他们使用 `SHA-3` 时，你应该询问他们使用的是哪个版本的 `SHA-3`：可能是 `SHA3-224`、`SHA3-256`、`SHA3-384`、`SHA3-512`、`SHAKE128`
    或 `SHAKE256`。如果是后两者，你可能想知道他们的输出长度，因为这些不是简单的哈希函数，而是 `XOF`（扩展输出函数）。


    参见 `Keccak.`


    ### SHA-3 竞赛

    正式名称 *NIST 哈希函数竞赛*。2008 年到 2012 年的 `SHA-3` 选择过程最终在包含了 `BLAKE`、`Grøstl`、`JH` 和
    `Skein` 的决赛轮后确定了 `Keccak`。在 NIST 收到的 64 个提交中，51 个被接受为有效。


    ### SHA-3 混沌 (PANDEMONIUM)

    SHA-3 竞赛的前几个月是一场疯狂。大多数业余者的提交被破解，有时在阅读其规范后的几分钟内。


    值得关注的提交包括：

    `MD6`: 与 `MD5` 无关的树状哈希，设计者 `CubeHash`: 极简的 ChaCha 类置换


    `ECOH`、`FSB`、`SWIFFTX`: 通过归约到困难计算问题尝试实现的证明安全的哈希。


    ### SHACAL


