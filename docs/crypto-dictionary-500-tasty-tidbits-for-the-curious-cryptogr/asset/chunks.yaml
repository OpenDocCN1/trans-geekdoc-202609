  trans: '


    引用自 Twofish 论文，Twofish 的成名之处包括性能：

    - 在 Pentium Pro 上，经过 12,700 个时钟周期的密钥设置，每块数据加密 285 个时钟周期

    - 在 Pentium Pro 上，经过 1,250 个时钟周期的密钥设置，每块数据加密 860 个时钟周期


    以及密码分析工作：


    *最后，我们对 Twofish 进行了密码分析。我们分析、分析、再分析，一直持续到提交截止日的早上。我们仍在进行密码分析；永不停止。*


    ## U


    ### 不可否签名 (Undeniable signature)

    一种没有签名者配合就无法验证的签名，无论该签名是否有效。验证者不应能够在不与签名者交互的情况下判断签名有效，签名者也不应说服证明者有效签名是无效的，反之亦然。


    参见 `不可见签名（Invisible signature）`。


    ### 通用组合性 (Universal composability)

    一种用于分析组合加密组件安全性的理论框架，因为组合两个安全协议并不会自动导致一个安全协议。它很少应用于实际用例。


    ### 通用哈希函数 (Universal hash function)

    密码学中的哈希函数，与密码哈希函数不同。与通用密码哈希不同，通用哈希函数由密钥参数化。因此，它实际上是一个族，类似于伪随机函数。


    #### 132 不可否签名

    但与伪随机函数不同，通用哈希函数在密码学意义上并非伪随机，仅在统计学意义上如此：不存在两个输入值 `M1` 和 `M2` 使得 `Hash(M1) = Hash(M2)`
    的概率异常高。


    然而，这种属性不应被误认为是抗碰撞性。对于通用哈希函数，碰撞通常很容易找到。


    ### 可更新加密 (Updatable encryption)

    一种可以直接将一个密文转换为另一个密文的加密方案，后者只能用新的、不同的密钥解密。更新加密的目标是在不可信系统上执行密钥轮换，作为简单的“解密-加密”方法的替代方案。


    ## V


    ### 可验证延迟函数 (Verifiable delay function, VDF)

    一种其计算无法通过额外的并行或存储加速的函数；因此，它必须顺序计算，类似于顺序工作证明。但与后者不同，VDF 仅接受一个解。


    参见 `顺序工作证明（Proof of sequential work）`，`时间锁谜（Time-lock puzzle）`。


    ### 可验证随机函数 (Verifiable random function, VRF)

    伪随机函数的公钥对应物，可以通过验证与函数输出一起生成的正确性证明，验证输出是否已正确计算。


    VRF 听起来类似于公钥签名，但在两个方面不同：VRF 的结果始终是确定性的（例如，消息可以接受许多有效的 ECDSA 签名），而且 VRF 可以生成一个结果和一个证明（该证明可能是随机的）。


    VRF 已用于构建（理论版本的）彩票系统和交易托管方案，并被多个区块链平台使用。


    #### 可验证随机函数 (VRF) 133

    #### 可验证不可预测函数 (Verifiable unpredictable function, VUF) 一种以某种方式介于签名和 VRF 之间的特殊函数：VUF
    类似于 VRF 但但不是伪随机的，仅是不可预测的。但与签名不同，给定的消息必须只有一个有效输出。因此，VUF 方案可以被视为唯一的签名。


    参见 `可验证随机函数（VRF）`。


    ### 维吉尼亚密码 (Vigenère cipher)

    一种比凯撒密码更安全的密码。


    ### VSH (Very Smooth Hash)

    具有可证明抗碰撞性的哈希函数，基于整数分解的困难性。但 VSH 的二阶原像抗性没有那么强的安全保证。


    ## W


    ### 钱包 (Wallet)

    在加密货币中，由个人或组织管理的一组账户。每个账户由一个用于签名的私钥和一个从公钥推导出的地址组成。通常，这些账户通过一个或多个种子，使用 `BIP32`
    或类似的分级派生进行层次化组织。这非常方便，因为你只需要存储单个密钥即可管理几乎无限数量的账户。


    扩展来说，钱包是指任何实现了账户管理功能的应用程序或设备。硬件钱包提供了最好的安全感，有时它们确实更安全。


    尽管如此，对于最常见的风险——缺乏可靠的备份，它们提供的保护作用并不比软件钱包更好。


    ### 水印 (Watermarking)

    在某些模拟信息（如图像、视频或声音）中嵌入一个值的做法，通常在数字编码期间进行，使得该值无法被提取或移除。在最健壮的形式下，它还能抵抗噪声、转码和数字-模拟-数字转换。


    ### 白盒密码学 (White-box cryptography)

    算法层面的混淆。换句话说，一种实现例如 `AES` 的方法，使得针对给定密钥的实现不会泄露密钥。这听起来像魔法，而且像魔法一样，它实际上并不存在，尽管高级技术给了人们它存在的错觉。大多数白盒技术确实已被破解，至少在理论上是如此。但在实践中，由于辅助了软件层防御（如软件混淆、防篡改、防调试、设备绑定等），它们有助于使逆向工程变得更加困难。


    从根本上说，白盒密码学是将对称密码转换为非对称密码。如果这可行，就意味着我们可以从对称原语创建公钥加密（尽管我们可以从哈希函数构造公钥签名）。


    ### Winternitz 签名

    一种基于哈希的签名的扩展，可以哈希大于 1 的的值。例如，为了处理 4 位消息 `W` 在 0 到 15 之间，你会发布 `Hash16(K)` 作为公钥，然后通过计算
    `HashM(K)` 来签名消息 `M`，其中 `M` 是哈希迭代次数。这比 Lamport 的二进制方案更好，但仍然无法扩展——想象一下签名 64 位值所需的工作。


    ### WireGuard

    一种用于点点安全通道的网络层协议，源于一个内核根内核项目。WireGuard 设计用于 SSH 类用途和 VPN 功能。根据创建者的话，WireGuard
    是“密码学倾向的”，这意味着它由单一算法套组成，以及极少的密码行政工作。


    注意的是，它排除了证书，因此不需要解析 `ASN.1` 或 `X.509`。与许多项目不同，WireGuard 将精力专注于加密实现质量，代码库比替代方案小得多。


    #### WireGuard 135

    最初受到密码学知识界的怀疑，WireGuard 的成功和安全记录现在说明了一切。


    ## X


    ### X25519

    基于 `Curve25519` 的 Diffie–Hellman。


    参见 `Curve25519`。


    ### X3DH

    扩展三重 Diffie–Hellman，一种因在 Signal 协议中使用而流行的 Diffie–Hellman 变体。X3DH 结合多个密钥对来计算一个共享密钥，而不是像基础
    Diffie–Hellman 那样每个参与者只用一对密钥。


    #### X3DH 如何工作

    在最简单的设置中，Alice 和 Bob 之间的 X3DH 操作如下。


    首先，它结合他们的长期身份密钥 `IA` 和 `IB` 以及它们的临时一次密钥 `EA` 和 `EB`，通过以下方式计算共享密钥 `SK`，其中 `DH()`
    是 Diffie–Hellman 操作：


    ```

    DH1 = DH(IA, EB)

    DH2 = DH(EA, IB)

    DH3 = DH(EA, EB)

    SK = KDF(DH1, DH2, DH3)

    ```


    '
- fmt: '

    Here, `KDF()` is a key derivation function. Alice computes these operations using
    her private keys and Bob’s public keys, whereas Bob does the opposite.


    In practice, if Alice initiates the protocol, she’ll pick a random ephemeral key
    and fetch a precomputed ephemeral key for Bob from the message server, where such
    keys are called pre-keys. `X3DH` was designed for use in asynchronous communications;
    it attempts to fulfill several security requirements in a way that minimizes computations
    and trust assumptions.


    ### 136 X25519


    ### `XMSS (eXtended Merkle Signature Scheme)`

    A public-key signature scheme that uses only a hash function and a tree structure.
    `XMSS`’s statefulness—or obligation to keep track of a counter over signature
    operations—has been called a huge foot-cannon. Even so, `XMSS` has become an IETF
    standard and was experimentally integrated in `OpenSSH`.


    A See S *PHINCS*.


    ### `XOF (extendable output function)`

    A hash function whose output can be of variable size. The function can also extend
    the length of the output if needed. By contrast, in non-extendable, variable-size
    output functions, output values of different sizes are completely distinct, and
    the shorter ones aren’t prefixes of the longer.


    ### `XOR`

    The exclusive OR logical operation, written as `⊕`. `XOR` obeys the following
    rules: true XOR false equals true; true XOR true equals false; and false XOR false
    equal false. When viewed as a binary operator, the rules produce the following
    results: `1 ⊕ 1 = 0`, `0 ⊕ 0 = 0`, `0 ⊕ 1 = 1`, `0 ⊕ 0 = 1`.


    Extended to bit strings, you’d get `0111 ⊕ 1101 = 1010`, and so on.


    ### `XOR encryption`

    A straightforward form of encryption, sometimes used in malware as an obfuscation
    layer. It’s similar to a one-time pad except that the XORed value isn’t always
    secret or used only once.


    ### Z

    ### Z


    ### Zerocash

    Came after `Zerocoin` but before `Zcash`.


    ### `ZKP (zero-knowledge proof)` ownA protocol where a prover convinces a verifier
    that they know some mathematical statement (such as the solution to a hard problem)
    without revealing said statement.


    `ZKP (zero-knowledge proof)` 137


    Now a mainstream concept among crypto enthusiasts, `ZKPs` were once an obscure
    field at the intersection of cryptography and theoretical computer science.


    Zero-knowledge is a broad and rich discipline, arguably still in its infancy as
    far as applications are concerned. There have been a few `ZKPs` advancing from
    conference proceedings to the real world: these applications include e-voting
    and blockchain applications, wherein noninteractive `ZKPs` help protect the privacy
    of transactions. `ZKPs` are also a component of threshold signing schemes as used
    for certain cold storage systems.


    Cryptographic zero-knowledge shouldn’t be confused with the security engineering
    concept of zero-knowledge architecture or with the marketing term zero-knowledge
    referring to client-side encryption.


    A See *NIZK (non-interactive zero-knowledge)*.


    ### `ZRTP`

    A key agreement procedure for `RTP` connections and used in voice-over-IP connections
    between two peers. Initially present in the `Signal` application to enable end-to-end
    encrypted calls, `ZRTP` was later discarded in favor of keys derived from the
    text messaging session state, which turned out to be simpler and more secure.
    The `Z` in `ZRTP` represents Phil Zimmermann.


