    iO 可以被视为输入-输出关系的原始编码，它隐藏了实现细节，例如子程序或中间变量。不可区分性概念只是用形式化的方式来表达这样一个观点：在给定的两个不同但等价程序的混淆之后，攻击者不应该能够识别出哪个程序是哪一个。


    尽管 iO 听起来像是许多问题的解决方案，但在实践中并非如此，这是因为其高复杂性和低效率。


    ### 信息论安全


    即使是无限计算能力也无法破解的安全性。


    例如，假设你使用另一个密钥 `K` 作为 `AES` 密钥，通过 `AES` 加密了一个 128 位的秘密密钥 `K0`。假设攻击者没有办法验证他们是否获取了有效的
    `K0`。


    在这种情况下，即使攻击者可以尝试 `K` 的所有可能值，也无法识别出 `K` 的正确值，因为他们无法识别出他们想要的 `K0`。信息论安全 59


    ### INT-CTXT


    密文完整性。一种适用于认证加密方案的安全概念，指攻击者来说创建一个有效的密文在实践上是不可能的，即使他们知道许多他们所选消息的有效密文。


    一个相关的定理：如果一个认证密文是 `IND-CPA` 且 `INT-CTXT`，那么它也是 `IND-CCA`。我留给你去 Google 搜索这个结果的证明。


    ### 不可见签名


    除非签名者同意公开该信息，否则这种公钥签名无法被识别为有效或无效。不可见签名似乎使签名是匿名的（即因为签名没有泄露签名者的身份或公钥），但事实并不一定如此。考虑这个反例：如果你额外使用非不可见签名方案对该签名进行签名，该方案仍然保持不可见性，但显然不是匿名的。


    参见 *匿名签名*，*不可否认签名*。


    ### IOTA


    根据其自身的定义，一种没有区块也没有链的区块链。


    这可能是最受嘲笑的区块链平台，因为它做出了一些不幸的密码学选择，例如设计了一种新的哈希函数。密码学爱好者和 IOTA 支持者发布了数百条关于 IOTA 争议设计选择的煽动推文。


    以下是这场辩论的简要总结：加密爱好者大喊：“IOTA 坏了，因为它的签名方案坏了。”作为回应，IOTA 粉丝回答道：“IOTA 没坏，因为它无法被利用。”双方都有一定道理。


    ### IPES (改进的提议加密标准)


    IDEA 块密码器的另一种名称。参见 *IDEA*。


    ### IPSec


    与 `TLS` 和 `SSH` 一起主要的开放安全通道协议之一。尽管它被广泛使用，但在密码学界和工程师中仍然不为人知。事实上，如果你在开发移动或 Web 应用程序，不需要理解
    `IPSec`。此外，它的设计和子协议在密码学上看起来很乏味。尽管 IPS 是 DARPA 和 NSA 赞助的始于 20 世纪 70 年的作品，但它仍然是网络层安全的标准。此外，除了脆弱的
    `IKEv1` 子协议外，它的设计和实现已被证明比早期的 `SSL` 和 `TLS` 版本更健壮。


    ### ISO 标准


    花 $180 买这个定义。请注意，目前尚无论文格式。


    ### 基于同源的密码学


    最新的一类后量子密码学方法；始于 20 世纪初。同源是一种将椭圆曲线上的点映射到另一条椭圆曲线上的点的函数，并满足特定的数学属性。你可以画一个图，其节点是椭圆曲线，其边是它们之间的同源，并以伪随机的方式在图中漫游。在对这些对象的研究中投入了大量酷炫的数学——图论、四元代数等——之后，你得到了可以用于密码学应用的困难计算问题。


    ### J: 密码学杂志 (JoC)


    ### K


    密码学的《自然》杂志，减去版面费。


    ### KASUMI


    1995 年块密码 `MISTY1` 的变体；在 3G 通信标准中作为 `A5/3` 算法使用。KASUMI 被破解了，因为存在一种实用的密钥恢复攻击。KASUMI
    也没有被破解，因为该攻击需要在相关密钥模型下的选择密文查询，这是不符合现实的。


    ### Keccak


    被标准化为 `SHA-3` 的哈希函数族；它根据海绵函数框架由单一排列构建。Keccak 的排列对异或和逻辑与进行了巧妙的结合。它还针对效率进行了优化，并轻松扩展到不同的宽度。原始的
    Keccak 设计及其海绵模式导致了其他几种算法。参见 *基于排列的密码学*。


    ### KeeLoq


    有史以来最昂贵的破解密码。少数依赖反馈移位寄存器的块密码之一。


    ### KEM (密钥封装机制)


    一种用于加密和解密短固定大小数据块的公钥方案；通常用于封装对称密钥。你可以将 KEM 视为一种密钥协商，其中一方可以选择密钥；`KEM` 的加密函数选取随机对称密钥并对其加密，而
    `KEM` 的解密函数对其解密以恢复对称密钥。然后可以使用对称原语解密使用该密钥加密的任何数据。


    ### Kerberos


    单点登录系统的祖先，设计于 20 世纪 80 年代后期，为 MIT 的分布式计算平台 Athena 提供安全的身份验证和授权。诚承认，这是一种老技术，尽管其影响巨大且仍在许多地方使用（例如
    Radius 认证协议），但 Kerberos 是少数人知道的安全协议之一。事实上，尽管年代久远，Kerberos 仍然是一个相当安全的协议。它实现了经常被遗忘的概念，例如在验证任何方的身份之前不信任任何一方，并且不以明文形式暴露密码。它有一些局限性；例如，Kerberos
    必须依赖受信任的第三方。但话说回来，有多少安全协议最终是不依赖第三方的？


    有时被称为仅使用对称密码的协议，Kerberos 也支持公钥加密以及各种认证形式，如一次性密码、硬件令牌和生物识别。


    ### HADES’ DOG


    Kerberos 协议名称的来源最好的解释是雅典娜女神与欧里庇得的对话（转录自 MIT 的 Kerberos 网站）：


    ```

    Euripides: (. . .) 你知道的，我认为我们有一个坚实的基础来实现卡戎 认证系统。

    Athena: 也许吧。总之，我不喜欢卡洛 名字名字。

    Euripides: 从什么时候开始的？

    Athena: 我从没喜欢它，因为这个名字不通。我前几天在和哈德斯叔谈论这件事，他建议了另一个名字，他那三头看门犬的名字。

    Euripides: 噢，你是说刻耳鲁斯吗？

    Athena: 闭上嘴，Rip！刻耳鲁斯确实……

    Euripides: 呃，不不是那个名字吗？

    Athena: 是的，如果你碰巧是个罗马人！我是希腊女神，他是一个希腊看门犬，他的名字是 Kerberos，用 K 开头。

    Euripides: 好了，好了，别扔雷电。我接受这个名字。实际上，它听起来挺好听。再见卡戎，欢迎 Kerberos。

    ```


    ### 克克霍夫斯原则


    由 19 世纪荷兰密码学家奥古斯塔·克克霍夫斯在其文章《La cryptographie militaire》（法语）中确立的安全六项原则，或称*愿望*。


    克克霍夫斯原则 63


    **克克霍夫斯的六项原则**


