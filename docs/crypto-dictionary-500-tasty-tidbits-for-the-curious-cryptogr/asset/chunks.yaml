    正如加密学中的常一样，这类系统的困难部分在于密钥管理和分发，而不是实际加密，这就是为什么许多端到端加密（E2EE）系统需要中央服务器的原因。许多 E2EE
    系统还依赖于“信任但验证”机制，只有当参与者执行某些手动验证（例如检查对话指纹）时，它们才算是真正的端到端加密。


    ## 42 圆曲线密码学


    此外，E2EE 系统有时最终依赖于中央 `CA` 来启用可信的 `TLS` 连接（你可以简单地将其视为传输层上的端到端加密，而不是应用层）。


    ### Enigma


    纳粹在第二次世界大战期间使用的机电加密机。Enigma 曾由波兰和英国的密码分析学家（包括阿伦·图灵）进行分析，他们使用的技术后来被人员重新发现并命名为差分分析、相关密钥攻击和侧信道攻击。


    ### 熵


    由鲁道夫·克劳修斯（Rudolf Clausius）于 1865 年左右引入的概念，他被认为是现代热力学的 `E` 创始人。但在他首次形式化热力学第二定律（该定律规定，在微观层面，封闭系统的熵不能减少）三年后，它才被命名为熵。克劳德·香农（Claude
    Shannon）的信息熵概念出现得得多，出现在他著名的 1948 年论文中。加密学通过量化不确定性的程度来使用信息熵评估加密系统的安全性。


    ### 信息熵


    熵是概率分布的属性，而不是该分布中某个特定值的属性。这就是为什么询问某个看似随机的值的熵是没有意义的，除非你知道该值是如何被选择的以及来自哪种分布。


    在信息论语境下，香农对某个随机变量 `X` 的熵定义为：


    ```

    H(X) = −P log P

    n

    2 n

    Σ n

    ```


    在有限的可观测集 `n` 上，其中 `Pn` 是事件 `n` 的概率。


    对于连续随机变量，我们可以熵的定义扩展为：


    ```

    −P(x) log P(x) dx

    ∫ 2 S

    ```


    ### 熵 43


    其中 `P(x)` 是变量的密度函数，`S` 是随机变量的支持集。


    当一个对称密码具有 `n` 位密钥时，如果通过密钥生成使得所有 `n` 位的值都是有效且等概率的，那么一个随机密钥的熵值即为 `n`。


    在公钥方案中，私钥的熵很少等于其编码的位长度，因为该长度的所有值并不都是有效密钥。


    ### ePrint


    正式名称为密码学电子打印存档（Cryptology ePrint Archive），地址为 `https://eprint.iacr.org/`。这是一个加密学研究人员可以在正式的、双盲同行评审发表之前在网上发布论文，并确保会被关注的网站。大多数加密学研究人员每周至少检查一次
    ePrint 上发布的新论文。


    ### 埃拉斯托尼筛


    一种列举直到某个上限之前的所有质数的方法；这是一种具有 2000 年历史的算法，通常在高中教学。它在 2019 年的黑帽大会上被重新发现。


    ### eSTREAM


    一项密码学竞赛，由欧盟资助的 ECRYPT 项目在 2004 年至 2008 年间组织，正式身份为一个 `project`。在提交的 34 密码中，有 8
    个进入了最终组合，其中包括两个类别：软件（具有 128 位密钥的）和硬件（具有 80 位密钥的）。到为止，eSTREAM 最成功的设计是 `Salsa20`，这种密码后来演变为
    `ChaCha20`，后者成为了 `BLAKE` 系列哈希函数家族的核心。组合中的其他密码，`Trivium` 和 `Grain`（或其变体）用于小众应用，而
    `F-FCSR` 被破解了。


    参见 `Grain`、`Salsa20`、`Trivium`。


    ### 以太坊


    一个用于去中心化应用（如代币）的重要区块链平台。以太坊引发了一些有趣的密码学研究和开放性问题，这些基于其独特的去中心化部署、对抗模型和图灵完备功能所面临的新挑战。例如，考虑以下内容，所有这些
    ePrint 都承认比又一个新块密码要令人兴奋：权益证明安全性、智能合约形式验证、原子交换和分片。


    ### Eurocrypt


    欧洲最大的学术密码学会议，自 1987 年以来每年春春天在欧洲不同的地点举行。研究人员展示经过同行评审的研究论文，标题如“无多线性映射的不可区分混淆：引导和实例化的新方法”以及“一种用于主动量子对抗者隐私增强的抗量子不可变提取器”。


    参见 `Asiacrypt`、`CHES`、`CRYPTO`、`FSE`、`PKC`、`Real World Crypto`、`TCC`。


    ### Eve


    Alice 和 Bob 的宿敌。


    ### F


    参见 `Alice`、`Bob`。


    ### 电子投票


    密码学家喜欢发表论文的话题，但不希望它在现实中部署，因为它被认为风险高不可接受。


    尽管如此，电子投票在密码学上是非常迷人的。它涉及非平凡的加密技术，例如用于加密选票并以保护隐私的方式进行聚合的同态加密方案，以及用于证明选票正确性的非交互零知识证明。


    ### F / 因数分解问题


    给定 `n = pq`，找到质数 `p` 和 `q`。如果你有一个足够大的量子计算机，很容易解决。因数分解 45


    ### 反馈移位寄存器


    一组值（通常是位或字节），通过移位来更新，并在空位处填充某些函数的结果。历史上，这种加密机制出现在机电机器之后。它现在仍用于面向硬件的算法和移动通信标准 SNOW3G。


    有两种反馈移位寄存器。在线性的（LFSR）中，这种更新函数是线性的，使得输出是预测的，但可以保证 LFSR 的周期是最大的。在非性的（NFSR）中，经过几次循环，输出值是初始状态的高度非线性函数，但周期的计算很困难。线性更新函数只执行加法，而非线性的执行乘法。


    良好的设计策略是结合 LFSR 和 NFSR。


    参见 `Grain`、`SNOW3G`、`Trivium`。


    ### Feistel 网络


    一种利用较小的密码或哈希函数构造分组密码的方法。它通过将消息块分成两部分 `L` 和 `R`，并反复替换 (L, R) 为 (R, L ⊕ f(R)),其中
    f() 是较小的函数并可以接受秘密值作为参数。Feistel 网络有时被称为 Luby–Rackoff 构造，以形式分析其安全性的研究人员命名。XOR 操作可以被其他群运算替换。


    参见 `DES (Data Encryption Standard)`、`Lucifer`。


    ### Fialka (Фиалка)


    二战后创建的 Enigma 机的苏联对应品。与西方加密机不同，Fialka 支持西里尔字母。


    ### Fiat–Shamir


    一种利用哈希函数将交互证明（证明者和验证者之间涉及多轮的协议）转换为非交互式证明（证明者提供的单条消息）的技术。


    ### FIPS 140-2


    一套针对加密模块（软件或硬件）的安全要求，由 NIST 在 2001 年制定。自 2019 年以来它已被 FIPS 140-3 取代。


    ## FIPS 140-2 的真正含义


    当厂商说“我们通过了 FIPS 140-2 认证”时，这一陈述可能有两种含义：“我们已经申请了认证”，或者（在理想情况下）“我们已经获得了认证”。


    后一种也可以有不同的含义：


    ³ 等级 1：FIPS 批准算法的正确性。


