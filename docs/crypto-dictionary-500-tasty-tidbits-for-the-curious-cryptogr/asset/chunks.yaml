- fmt: "\nThe more you know about the person who chose the password, the easier this\
    \ is, and the lower the password’s entropy. For example, if you know the person\
    \ is a 65-year-old woman living in Tennessee, you’ll probably try a specific set\
    \ of passwords; you’d try a different set if the person is a 20-year-old Swiss\
    \ guy. The consequence of this is that passwords are fairly easy to find given\
    \ their hash values: you just repeatedly hash possible passwords and compare the\
    \ results with the given hash.\n\nThe mitigation we use is very dumb, but it works:\
    \ instead of using a secure and efficient hash function, we use a function that\
    \ is secure but inefficient—slow to compute and sometimes also uses large amounts\
    \ of memory (which makes password cracking even more difficult when using GPUs\
    \ or dedicated hardware).\n\n### PBKDF2 (Password-Based Key Derivation Function\
    \ 2)\n\nPassword-based key derivation function, second version of the standard.\
    \ `PBKDF2` is the poor man’s password hash. It’s good enough in most cases when\
    \ tuned with enough iterations, but it’s not as cool as `Argon2`.\n\n### PCT (Private\
    \ Communications Technology)\n\nMicrosoft’s secure communication protocol. `PCT`\
    \ competed with `SSL v3` in the mid-1990s. `PCT` intended to address `SSL v2`’s\
    \ flaws yet be somewhat compatible with it. But only Microsoft has used it, and\
    \ it was ultimately replaced by `SSL v3` or `TLS` everywhere.\n\n### PEP (Plaintext\
    \ equivalence proof)\n\nA protocol that checks whether two ciphertexts are encryptions\
    \ of the same value. Participants cannot cheat.\n\n### Perfect forward secrecy\n\
    \nA See *Forward secrecy*.\n\nPerfect forward secrecy 89\n\n### Permutation-based\
    \ cryptography\n\nCryptographic schemes that leverage a single permutation to\
    \ provide other functionalities. It’s based on research related to the `Keccak`\
    \ hash function.\n\n#### A BESTIARY OF PERMUTATION-BASED CRYPTO\n\nPermutation-based\
    \ cryptography from the `Keccak` extended family includes many constructions,\
    \ modes, and primitives, which we’ve tried to inventory in the following subdictionary:\n\
    \n* `SHAKE`, a XOF (part of the `FIPS 202` standard)\n* `cSHAKE`, variant of `SHAKE`\
    \ (part of `NIST SP 800-185`)\n* `KMAC`, a variable-length MAC (part of `NIST\
    \ SP 800-185`)\n* `Par elHash`, a parallelizable XOF (part of `NIST SP 800-185`)\n\
    * `TupleHash`, a XOF designed to hash tuples of data (part of `NIST SP 800-185`)\n\
    * `Duplex`, an extension of the sponge construction\n* `MonkeyDuplex`, a variant\
    \ of `Duplex` to build authentication encryption schemes\n* `DonkeySponge`, a\
    \ variant of `Duplex` to build MACs\n* `Keccup`, a reduced-round version of `Keccak`\n\
    * `Ketje` (and its versions `Ketje Jr`, `Ketje Sr`, `Ketje Minor`, and `Ketje\
    \ Major`), a lightweight authenticated cipher\n* `Keyak` (and its versions `River`,\
    \ `Lake`, `Sea`, `Ocean`, and `Lunar Keyak`), an authenticated cipher\n* `KangarooTwelve`,\
    \ a fast parallel XOF\n* `Dec` (doubly extendable cryptographic) functions\n*\
    \ `Deck` (doubly extendable cryptographic keyed) functions\n* `Kravatte`, a deck\
    \ function, coming with `KravatteModes`, modes on top of it\n* `Farfal`, a construction\
    \ to build a deck function\n* `Cyclist`, the mode of operation of `Xoodyak`\n\
    * `Motorist`, the mode of operation of `Keyak`\n* `Xoofff`, a deck function, coming\
    \ with `XoofffModes`, modes on top of it\n* `Xoofffie`, a variant of `Xoofff`\n\
    * `Xoodoo`, a family of permutations\n* `Xoodyak`, a lightweight scheme (performing\
    \ authenticated encryption, MAC, hashing, and so on)\n\n90 Permutation-based cryptography\n\
    \n* `Mixifer`, a 256-bit permutation\n* `Mr. Monster Burrito`, a variable-length\
    \ block cipher\n\nMost likely, this is an incomplete list of the `Keccak` bestiary,\
    \ but gives you an idea of the creativity and innovation of the `Keccak` designers.\n\
    \n### P\n\n### PES (Proposed Encryption Standard)\n\nA block cipher presented\
    \ at `Eurocrypt 1990`. It didn’t become a standard.\n\nA See *IDEA*, *IPES*.\n\
    \n### PET (Plaintext equivalence test)\n\nA protocol that checks whether two ciphertexts\
    \ are encryptions of the same value. But participants can cheat.\n\n### PFS\n\n\
    A secret advanced cryptography think tank.\n\nA See *Forward secrecy*.\n\n###\
    \ PGP (Pretty Good Privacy)\n\nThe first major, public cryptography software,\
    \ developed in the early 1990s. `PGP` later became an enterprise encryption product.\
    \ Currently, `pgp.com` redirects to `broadcom.com`, because `Symantec` acquired\
    \ the `PGP` company and `Broadcom` later acquired `Symantec`. The `OpenPGP` message\
    \ format and the `GnuPG` (`GPG`) software are the open source legacies of `PGP`.\
    \ In 2020, `PGP` remains the de facto standard for email encryption and is used\
    \ by major enterprise and open source email encryption software.\n\n`PGP` is often\
    \ called broken, mostly because the 1990s design didn’t anticipate security requirements\
    \ of the 2010s. Also, its software implementations turned out to have security\
    \ flaws—as pretty much all software does.\n\n### Photuris\n\nThe Latin name for\
    \ a genus of fireflies. Also, a session-key management protocol for `IPSec` that\
