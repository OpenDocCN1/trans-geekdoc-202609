    Gal 罗斯计数器模式下的 AES，是本文编写时最常用的认证加密原语。这也是终结了 HMAC 认证器时代的原语。在 GCM 模式下，消息通过 `CTR` 模式进行加密，而伽罗斯
    MAC（`GMAC`，又称 `GHASH`）根据密文和关联数据块生成认证标签。无位乘法指令 `PCLMULQDQ` 在 2010 年代引入 Intel 处理器，用以加速
    `GMAC` 的计算。


    ## AES-GCM 的阿喀斯之踵


    AES-GCM 是安全的，除非在不同的消息上两次使用相同的 `nonce` 运行它，这可能会泄露明文数据并暴露 `GMAC` 使用的认证密钥。这种不幸的脆弱性并没有阻止
    AES-GCM 被用于无数协议（包括 `TLS`、`IPSec` 和 `SSH`），也未阻止它被 IEEE、`ISO` 和 `NIST` 标准化。AES-GCM
    的表兄弟 `AES-GCM-SIV` 消除了 nonce 重用问题，但目前尚未获得广泛支持，且速度稍慢。


    ## AES-GCM-SIV


    `AES-GCM` 的变体，其加密 `nonce` 根据通过认证明文（以及任何关联数据）计算出的标签确定。`AES-GCM-SIV` 的 MAC 称为 `POLYVAL`，与
    `GCM` 的 `GMAC` 类似：`AES-GCM` 是“先加密后认证”（encrypt-then-MAC）的形式，而 `AES-GCM-SIV` 是“认证并加密”（MAC-and-encrypt）结构。


    与 `AES-GCM` 相比，`AES-GCM-SIV` 的主要优势是即使重复相同的 `nonce` 依然安全——这种属性被称为“误用抵抗”。


    ## AES-NI


    正式名为 `AES New Instructions`，但通常被称为原生指令，这可能是更好的术语。`AES-NIs` 是 CPU 指令，它们使用芯片硅片中的硬件逻辑计算
    `AES`，而不是像 AES-NI **5** 那样使用芯片 `ALU` 的算术运算组合。Intel 在 2008 年引入 `AES-NIs` 后，使 `AES`
    软件速度快了约 10 倍，并作为副产品，免疫了缓存定时计时攻击。


    ## AES-SIV


    参见 `SIV-AES`。


    ## AIM (高级信息安全机)


    摩托罗拉在 20 世纪 90 年代后期设计的芯片组包含了用于红操作（加密）和黑操作（明文）的独立 `FPGAs`。它被誉为“有以来密码学最具革命性的进展之一”。NSA
    使用它来保护机密和敏感的国家安全信息。现成的 `AIM` 不包含机密（`Suite A`）算法，但用户可以为 `FPGAs` 支持算法，例如 `ACCORDION`
    或 `BATON`。


    ## AKA


    在 `3GPP` 标准术语中，手机网络用户与用户主网络之间的认证密钥协商操作，该主网络可能与接入网络不同。


    ## 3GPP 标准中的 AKA


    `AKA` 在 `3G UMTS`、`4G LTE` 和 `5G` 标准中非常相似，与其他许多密钥协商协议不同，它不使用公钥原语；相反，它依赖于共享对称密钥和伪随机函数（`5G`
    除外，后者加入了公钥加密）。


    `AKA` 看起来是一个简单的协议，通过主密钥和序列号来派生会话密钥（加密、认证和匿名密钥），同时确保双向认证，更准确地说，是双方对共享密钥的认知。尽管在密码学上很枯燥，`AKA`
    旨在实现针对其独特环境的其他非凡性目标。


    这些目标包括用户身份（`IMSI`）的机密性、用户的不可关联性、接入网络的认证（由用户和主网络进行），以及强大的不可靠性保证和对不安全伪随机生成器的韧性。


    **6** AES-SIV**


    ## AKS (Agrawal–Kayal–Saxena)


    ## A


    第一个确定性素性测试，区别于随机性测试。


    2002 年介绍 `AKS` 算法的论文论文“`PRIMES is in P`”是首次证明了素性测试问题属于 `P` 复杂度类，即存在非随机多项式时间算法的问题所在类。


    参见 `PRIMES`。


    ## 代数密码分析


    密码分析的一种形式，其中目标问题（通常是密钥恢复，但也包括伪造、区分等）被建模为多元方程方程组，并通过通用技术或特定技术找到解。代数密码分析已用于攻击对称和非对称加密系统。一个目标示例是基于移位寄存器的具有低代数次数逻辑的流加密器，它产生了可被代数攻击利用的底层方程。


    参见 `Gröbner basis`。


    ## Alice


    `Bob` 的犯罪同伙，但从未在现实中见过过 `Bob`。根据 John Gordon 在 1984 年演讲中的官方传记：“`Alice` 和 `Bob`
    曾试图欺骗保险公司，他们通过邮件进行高额赌注扑克，并在被窃听的电话上交换秘密信息。（……）`Alice` 和 `Bob` 拥有非常强大的敌人。他们的敌人之一是税务局，另一个是秘密警察。这很遗憾，因为他们最喜欢讨论的话题是税务欺诈和推翻政府。”


    参见 `Bob`。


    ## 全或全无变换 (AONT)


    一种可逆变换，你需要输出的每一个位来确定输入的任何位。当加密方案是 `AONT` ，，如果丢失了密文的某些位，解密密钥对于明文将无用（除非丢失的位少到可以被破解）。用于
    `RSA` 加密的 `OAEP` 构造是一种 `AONT`。`CBC` 或 `GCM` 加密模式不是 `AONT`。全或变换 (AONT) **7**


    ## 匿名签名


    一种不会泄露签名者身份（公钥）的签名，因此需要与签名者交互。它意味着隐身。


    参见 `Invisible signature`。


    ## 应用密码学


    Bruce Schneier 于 1996 年著作，多年来一直是领域的主要参考；它让许多学生和工程师接触了密码学。因其开头而闻名：“世界上有两种密码学：一种防止你妹妹读你的文件，另一种是防止大政府读你的文件。这本书关于后者。”


    在出版 25 年后虽然不可避免地过时，只要你不盲目遵循它的建议，《应用密码学》仍然值得留在书架上。它比 Schneier 之前的两本书《邮件安全》和《保护你的
    Mac》要落后得多。


    ## 应用密码学


    强调直接应用的密码学部分。相比之下，理论密码学不那么侧重工程，而更侧重于基础理解和分析。“应用”一词具有欺骗性；应用和理论密码学可以（并且应该）对现实应用同样。


    ## ARC4


    `RC4` 流加密器的原始名称；也写作 `ARCFOUR`。


    在反向工程 `RC4` 被确认为真实的 `RC4` 之前，它被谨慎地称为 `疑似 RC4`，缩短为 `ARC4`。


    ## Argon2


    在密码哈希竞赛期间开发的密码哈希函数。此外，它是处理密码或任何低熵密钥以派生加密密钥或存储验证器的标准，防止使用 GPU、`FPGAs`、专用硬件、预计算表或侧信道攻击进行高效破解。


    与 `PBKDF2` 不同，`Arg2` 除了可配置迭代次数外，还可以强制使用特定内存。与 `scrypt` 以及其他两种不同，`Argon2` 提供了一个易于使用的
    **A** 接口，方便选择时间和内存参数。它的设计也非常简单，内部仅使用 `BLAKE2` 哈希函数，而不是所有设计的密码学的组合。


    **ARX (加-旋转-异或)**


