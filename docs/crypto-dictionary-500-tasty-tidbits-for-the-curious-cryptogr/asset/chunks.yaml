    As usual in cryptography, the hard part of such a system is key management and
    distribution, not the actual encryption, which is why many E2EE systems need a
    central server. Many E2EE systems also rely on trust-but-verify mechanisms and
    are only end-to-end as long as participants perform some manual verification,
    such as checking a conversation’s fingerprint.


    ## 42 Elliptic-curve cryptography


    In addition, E2EE systems sometimes ultimately rely on a central `CA` to enable
    trusted `TLS` connections (which you can think of as simply end-to-end encryption
    over the transport layer rather than the application layer).


    ### Enigma


    The electromechanical encryption machine used by the Nazis during World War II.
    Enigma was analyzed by Polish and British cryptanalysts, including Alan Turing,
    using techniques that researchers would later rediscover and call differential
    cryptanalysis, related-key attacks, and side-channel attacks.


    ### Entropy


    A notion introduced around 1865 by Rudolf Clausius, arguably the `E` founder of
    modern thermodynamics. But entropy wasn’t named until three years after his first
    formalization of the second law of thermodynamics (which states that entropy,
    at a microscopic level, cannot decrease in a closed system). Claude Shannon’s
    concept of information entropy came much later in his famous 1948 paper. Cryptography
    uses information entropy to assess a cryptosystem’s security by quantifying its
    amount of uncertainty.


    ### INFORMATION ENTROPY


    Entropy is a property of a probability distribution, not of any particular value
    in that distribution. That is why asking about the entropy of some random-looking
    value makes no sense unless you know how this value was chosen and from which
    distribution.


    In the context of information theory, Shannon’s entropy of some random variable
    `X` is defined as:


    ```

    H(X) = −P log P

    n

    2 n

    Σ n

    ```


    over a finite set of observables `n`, where `Pn` is the probability of the event
    `n`.


    In the case of a continuous random variable, we can extend the entropy definition
    to:


    ```

    −P(x) log P(x) dx

    ∫ 2 S

    ```


    ### Entropy 43


    where `P(x)` is the variable’s density function, and `S` is the support set of
    the random variable.


    When a symmetric cipher has an `n`-bit key, where all `n`-bit values are valid
    and equiprobable through key generation, a random key’s entropy is `n`.


    In public-key schemes, the entropy of a private key will rarely be equal to its
    encoding’s bit length, because not all values of that length might be valid keys.


    ### ePrint


    Officially the Cryptology ePrint Archive, at `https://eprint.iacr.org/`. A website
    where cryptography researchers can post their papers online prior to formal, double-blind,
    peer-reviewed publication and be sure they’ll be noticed. Most cryptography researchers
    check the new papers published on ePrint at least once a week.


    ### Erathosthenes’ sieve


    A method of enumerating all prime numbers up to some upper bound; a 2,000-year-old
    algorithm typically taught in high school. It was rediscovered during the Black
    Hat 2019 conference.


    ### eSTREAM


    A cryptography competition, officially a `project`, organized by the EU-funded
    ECRYPT project between 2004 and 2008. Of the 34 submitted ciphers, eight made
    it to the final portfolio, which included two categories: software (those with
    128-bit keys) and hardware (those with 80-bit keys). By far the most successful
    design from eSTREAM is `Salsa20`, a cipher that later evolved to `ChaCha20`, which
    became central to the `BLAKE` family of hash functions. Of the other portfolio
    ciphers, `Trivium` and `Grain` (or variants thereof) are used in niche applications,
    and `F-FCSR` was broken.


    A See `Grain`, `Salsa20`, `Trivium`.


    ### Ethereum


    An important blockchain platform for decentralized applications, such as tokens.
    Ethereum has led to some of the most interesting cryptography research and open
    problems, based on novel challenges faced by their unique decentralized deployment,
    adversarial model, and Turing-complete functionality. For example, consider the
    following, all of which 44 ePrint are admittedly more exciting than yet another
    new block cipher: proof-of-stake security, smart contract formal verification,
    atomic swaps, and sharding.


    ### Eurocrypt


    Europe’s largest academic cryptography conference, held every spring in a different
    European location since 1987. Researchers present peer-reviewed research papers
    with titles such as “Indistinguishability Obfuscation Without Multilinear Maps:
    New Methods for Bootstrapping and Instantiation” and “A Quantum-Proof Non-Malleable
    Extractor with Application to Privacy Amplification Against Active Quantum Adversaries.”


    A See `Asiacrypt`, `CHES`, `CRYPTO`, `FSE`, `PKC`, `Real World Crypto`, `TCC`.


    ### Eve


    Alice and Bob’s nemesis.


    ### F


    A See `Alice`, `Bob`.


    ### E-voting


    A topic that cryptographers like to publish papers about but don’t like to see
    deployed in reality because it’s perceived as unacceptably risky.


    E-voting is nonetheless cryptographically fascinating. It involves nontrivial
    cryptography, such as homomorphic encryption schemes used to encrypt ballots and
    aggregate them in a privacy-preserving way, and noninteractive zero-knowledge
    proofs, which are used to prove a vote’s correctness.


    ### F / Factoring problem


    Given `n = pq`, find the primes `p` and `q`. Easy to solve if you have a large
    enough quantum computer. Factoring problem 45


    ### Feedback shift register


    An array of values, usually bits or bytes, that updates by shifting the values
    over and then filling the empty slot with the result of some function of the previous
    state. Historically, this cipher mechanism came after electromechanical machines.
    It’s still used in hardware-oriented algorithms and in the mobile communication
    standard SNOW 3G.


    There are two kinds of feedback shift registers. In linear ones (LFSRs), this
    update function is linear, which renders the output predictable but can also provide
    guarantees that the period of LFSR is maximal. In nonlinear ones (NFSRs), after
    a few cycles of updates, the output values are highly nonlinear functions of the
    initial state, but guarantees on the period are difficult to compute. Conely,
    linear update functions only do additions, whereas nonlinear ones do multiplications.


    A good design strategy is to combine LFSRs and NFSRs.


    A See `Grain`, `SNOW 3G`, `Trivium`.


    ### Feistel network


    A method of constructing a block cipher from a smaller block cipher or hash function.
    It works by splitting the message block in two halves, `L` and `R`, and updating
    it by repeatedly replacing (L, R) with (R, L ⊕ f(R)), where f() is the smaller
    function and can take a secret value as a parameter. Feistel network is sometimes
    called Luby–Rackoff construction after the researchers who formally analyzed its
    security. The XOR operation can be replaced by another group operation.


    A See `DES (Data Encryption Standard)`, `Lucifer`.


    ### Fialka (Фиалка)


    The Soviet counterpart to the Enigma machine created after World War II. Unlike
    Western encryption machines, Filamentka supported Cyrillic characters.


    ### Fiat–Shamir


    A technique for turning an interactive proof (a protocol between a prover and
    a verifier that involves multiple rounds) into a noninteractive one (a single
    message from the prover) using hash functions.


    ### FIPS 140-2


    A set of security requirements for cryptographic modules (software or hardware),
    established by NIST in 2001. It’s been superseded by FIPS 140-3 since 2019.


    ## WHAT FIPS 140-2 REALLY MEANS


    When a vendor says “We are FIPS 140-2 certified,” the statement can have one of
    two meanings: “We have applied for the certification,” or, ideal y, “We have received
    the certification.”


    The latter case can also have different meanings:


    ³ Level 1: Correctness of the FIPS-approved algorithms.

