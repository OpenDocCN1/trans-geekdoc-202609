    \ 91\n\n### Picnic\n\nA post-quantum signature scheme that doesn’t fit in any\
    \ categories. `Picnic` achieves this by computing *s* by `AES-encrypting` *n*\
    \ with the first 16 bytes of *k* as a key and using the last 16 bytes of *k* as\
    \ *r*. The final value of the MAC is (poly + *s*) mod 2128, where *s* is another\
