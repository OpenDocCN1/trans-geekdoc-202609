    一个被低估的安全概念：如果攻击者无法将密文 `Enc(*K*, *M*)` 转换为某些特定函数 `f()` 的另一个有效密文 `Enc(*K*, *f*(*M))`，则称该加密方案为不可延变性的。因此，不可延变的方案比可延变的方案更安全。在选择密文模型中，不可延变性等同于不可区分性（最强的安全概念）。


    ## Manger 攻击


    针对 OAEP 模式下 RSA 加密的填充预言攻击。`Manger` 攻击相比于针对旧版 RSA 加密的 `Bleichenbacher` 攻击知名度较低，因为它通常更难利用。事实上，正如
    `Manger` 的原始论文所述，`PKCS` 标准已经描述了针对该攻击的一种部分缓解措施，即“第 4 步[整数到字节转换]和第 5 步[OAEP 解码]输出的错误信息保持相同至关重要”。但与
    `Bleichenbacher` 攻击一样，如果攻击者利用时间泄露而不是错误信息，`Manger` 攻击同样有效。


    ## 中人攻击


    一类攻击，攻击者秘密地捕获并修改两个或多个通信者之间的流量。针对 `TLS` 实现的 `FREAK`（分解 RSA 导出密钥）攻击就是中人攻击的一个示例，其中攻击者修改会话初始化数据以强制使用弱加密套件。


    参见 *中间相遇攻击 (Meet-in-the-middle)*。


    ## MASH (模算术安全哈希)


    早期尝试使用与 `RSA` 相同操作的哈希函数。


    参见 *VSH (非常平滑哈希)*。


    ## McEliece 加密方案


    参见 *基于代码的密码学 (Code-based cryptography)*。


    ## MD4


    比 `MD5` 更弱的哈希函数。


    ## MD5


    曾是*校验和*和*哈希函数*的同词，现在是加密设计糟糕的标志，因为它不抗碰撞性。但 `MD5` 对抗原像攻击仍然是安全的。


    ## MDC (消息摘要密码)


    哈希函数的旧称。


    ## MDC-2 (修改检测码 2)


    一种将 *n* 位块密码转换为输出为 2 *n* 位哈希函数的构造方法。生成的哈希不如理想的 2 *n* 位哈希安全，但比 *n* 位哈希安全。`MDC-2`
    主要与 `DES` 配合使用变为 `MDC-2DES`，除非涉及 `IBM` 的专利。


    ## 中间相遇


    一种密码分析技术，主要以其在攻击对称原语的应用而闻名。当连续的加密层（也称为*轮次*或密码实例）使用独立密钥工作时，即可应用中间相遇。例如，当使用两个 *n*
    位密钥 *K* 1 和 *K* 2 以及两个不同的加密器 `Enc1` 和 `Enc2` 将消息 *M* 加密为 *C = Enc2(*K* 2, Enc1(*K*
    1, *M*))* 时，你可能期望其具有 *M*^{2n} 位的安全性（仿佛等同于使用 2 *n* 位密钥加密）。但实际安全性接近 *n* 位：其原因是，给定一对通过`中间相遇攻击`处理的
    (*C*, *M*)，你可以为所有 2 *n* 个 `K` 值计算 `X = Dec2(*K*, *C*)`，然后为所有 2 *n* 个 `K''` 值计算
    `Y = Enc1(*K*'', *M*)`。对于 `X = Y` 的对 (*K*'', *K*) 很有可能是 (*K* 1, *K* 2)。


    你可以将这种技巧看作许多密码分析攻击中发现的更通用优化技术的一种实例。这些攻击包括婴儿步大步算法（用于计算离散对数）、基于 `ECDLP` 的 `GHS`
    同源攻击，或针对基于同源方案的攻击。


    参见 *中人攻击*。


    ## 梅克尔谜 (Merkle puzzle)


    在安全的公钥加密发明之前，最接近公钥加密的东西。


    ## 梅克尔树 (Merkle tree)


    密码学和计算领域许多问题的解决方案。本质上是一个哈希树。例如，它可以用紧凑且高效的方式证明对某些大数据集的认知：你可以通过展示从该数据节点（通常是叶子节点）计算根节点所需的节点列表，来证明某条数据在树中。这组值列表被称为*认证路径*、*包含证明*和*梅克尔证明*。


    梅克尔树是基于哈希签名的主要组件。


    ## 梅克尔-达姆格构造 (Merkle–Damgård construction)


    一种在使用仅处理短消息的哈希函数对任意长度消息进行哈的简单技术。其实现方式使得如果短长度哈希是安全的，那么生成的任何长度的哈希也是安全的。这是对称密码学中最早的安全证明之一。但该证明仅关于抗碰撞性和抗原像性，而不是最绝对意义上的安全性。例如，梅克尔-达姆格哈希函数（如
    `SHA-256`）容易受到长度扩展攻击。


    ## 森旋转旋转算法 (Mersenne twister)


    不是一种加密伪随机数生成器。


    ## 消息标记 (Message franking)


    一种允许在端到端加密对话中报告滥用消息的同时保持可接受安全水平的协议。源于 `Facebook` 部署端到端加密的问题。


    ## 米勒-拉宾 (Miller–Rabin)


    最常用的概率素性检验。在某些条件下，你可以欺骗测试使其将一个复合数判定为素数。


    ## *素数*


    ## MINERVA


    参见 *密码学 (Crypto)*。


    ## 挖矿


    为了钱而哈希。


    ## 抗滥用性


    应用于密码学的深度防御。抗滥用性应对了某些加密（如 `AES-GCM`）只有在不重复调用 nonce 时才是安全的现状。抗滥用加密试图消除这个问题。它们唯一的局限性是如果你加密相同的消息，输出将相同。`SIV-AES`
    是此类加密的一个示例。


    抗滥用性可以扩展到对称*M*加密的情况。


    ## 定理：重复 nonce 是安全的


    在 `AES-GCM` 的情况下，重复 nonce 允许攻击者获取两个明文之间的异或差，即使他们不知道任何一个消息。证明：`AES-GCM` 使用 CTR
    模式加密消息，给定密钥和 nonce 会生成一个伪随机序列（称为*密钥流*），并将其异或到消息。因此，如果你重用密钥和 nonce 生成密钥流 `S` 对消息
    `M 1` 生成密文 `C 1 = M 1 ⊕ S`，你也会使用相同的 `S` 加密第二个消息 `M 2` 得到 `C 2 = M 2 ⊕ S`。在这种情况下，攻击者可以计算
    `C 1 ⊕ C 2 = M 1 ⊕ M 2`。这是很糟糕的。证明。


    ## 混合网 (Mixnet)


    一种多方协议，通过洗乱密文序列 *C* 1, . . .* , *Cn* 为另一个序列 *C''* 1, . . .* , *Cn* 来提供匿名，使得对于每个
    *Ci* 都存在一个 *C''j*，其值不同但解密后明文相同。该协议可能还包含一个零知识证明，证明在满足标准的同时不泄露任何关于排列或明文的信息。


    ## 实践中的混合网


    混合网通常用于在匿名通信网络中路由数据。在这里，观察者不应能够将混合后的值 *C''i* 与其混合前的 *Cj* 关联。通过一轮或多轮混合，这防止了攻击者将消息来源与最终接收者相关联。


    '
- fmt: '

    Mixnets were also used in e-voting schemes to provide voter anonymity, as well
    as in cryptocurrencies to hide sender/recipient relations, typical `y` by shuffling
    `UTXOs`.


    A number of gotchas can defeat mixnets’ security. For example, in the case of
    anonymous routing, the mixing router must transmit the mixed values in an order
    not correlated with that of received values; otherwise, anonymity can be easily
    compromised. Messages should also all be of the same size; otherwise, the permutation
    is straightforward to identify.


    ## 76 Mixnet


    ### MQV (Menezes–Qu–Vanstone)

    Diffie–Hellman on steroids. Invented in 1995, yet rarely used, in part because
    of patents covering it. It’s the sister of `HMQV` and `ECMV` (once in NSA’s Suite
    B). Today, `MQV` is perhaps best known for its use in the password-based key agreement
    protocol `OPAQUE`.


    ### Multicollision

    For hash functions, a collision between more than two messages. It takes less
    time to find multicollisions on iterated hash functions (such as `SHA-256`) than
    for a hash function accessed as a black box. If intermediate chaining values of
    the iterated hash are `n`-bit, then a `k`-collision can be found in `⌈log2 k⌉
    · 2 *n*/2` against `k!1/ *k · 2 *n*( *k* – 1) *k` for an ideal, black-box hash.


    ### Multi-party computation (MPC)

    A class of cryptographic techniques for computing a function’s output without
    knowing the inputs’ original values. `MPC` is a rich field of research, yet with
    few major application until cryptocurrency wallets, which also use the `MPC`-like
    threshold signatures. Many more real-world `MPC` applications are expected.


    ### Multivariate cryptography

    A class of post-quantum schemes based on the hardness of solving systems of nonlinear
    equations in multiple variables. The hardness of such problems is related to that
    of Multivariate Quadratics (`MQ`), the problem of solving a random system of degree-2
    equations, known to be `NP-complete`.


    Most multivariate schemes are signature schemes that produce short signatures
