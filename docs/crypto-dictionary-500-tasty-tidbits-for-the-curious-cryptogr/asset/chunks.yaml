    \ 本质上是检查测试向量，而 `CMVP` 则涵盖了其他的 `FIPS 140-2` 评估标准。\n\n参见 `CMVP (加密模块验证计划)`，`FIPS\
    \ 140-2`。\n\n## CBC (密码块链接模式)\n\n块密码的一种工作模式，与区块链无关。`CBC` 通过计算 `Ci = Enc( K, Pi\
    \ ⊕ Ci–1)` 将一系列数据块 `Pi` 加密为密文块 `Ci`，其中 `i = 1, . . . , n.`。初始值 `(IV)` 为 `C 0`，它应该是不可预测的以保证语义安全。`CBC`\
    \ 有一个很有用的特性，即解密是可以并行的（而加密则不是）。遗憾的是，`CBC` 容易受到填充 Oracle 攻击（padding oracle attacks）。\n\
    \n## CECPQ (结合椭圆曲线与后量子算法)\n\n一种包含椭圆曲线和后量子算法的混合密钥交换方案。`CECPQ` 由 Google 开发，旨在保护\
    \ `TLS` 连接免受量子计算风险的威胁。\n\n第一个版本 `CECPQ1` 将 `X25519` 与基于格的方案 `NewHope` 结合，并于 2016\
    \ 年在 `Chrome Canary` 浏览器中部署了几个月。2019 年发布的 `CECPQ2` 将 `NewHope` 替换为基于 `NTRU` 的方案\
    \ `HRSS`，而变体 `CECPQ2b` 使用了基于同源的方案 `SIKE`。\n\n## 细胞自动机 (Cellular automata)\n\n\
    在密码学中毫无用处。它是许多劣质论文的来源。\n\n## 仪式 (Ceremony)\n\n在在此期间生成重要的密钥、秘密或敏感参数。仪式包括程序性和技术上的安全控制，以确保密钥的密钥生成和备份\
    \ **22** 凯撒加密\n\n以及其涉及的软件、硬件、流程和人员的安全性。这不仅仅是选择一个可以接受的 `PRNG`，那实际上是最容易的一部分。例如，一个仪式涉及具有明确定义角色的参与者（如审计员和操作员）、预定义的操作序列（称为脚本或故事书）以及详细纪要的编写。\n\
    \n仪式通常用于在金融 **C**\n\n机构中生成证书机构的根密钥或区块链钱包的主密钥（种子）。它们随后被称为 `密钥仪式` (key ceremonies)。当仪式目的是生成零知识证明系统的参数时，也可以称为\
    \ `信任设置` (trusted setups)。\n\n## 证书 (Certificate)\n\n许多麻烦的根源，包括编码格式、解析漏洞、未更新的到期证书、断裂的链、不可信的机构、自签名、撤销列表等。但它通常是我们能提供的最不差的解决方案。\n\
    \n## 证书机构 (CA)\n\n公钥基础设施中受信任的第三方，能够发布证书的实体。\n\n## 证书透明度 (CT)\n\nGoogle 的一项倡议，通过创建证书公开日志来降低恶意或受损\
    \ CA 带来的风险，使其更容易知道证书是否已经发布。\n\n## ChaCha20\n\n`Salsa20` 的变体，目前是最常用的加密算法之一。\n\n\
    ## CHACHA20：诞生论坛\n\n`ChaCha20` 最初在 `eSTREAM` 项目的论坛上提出：\n\n*我有一个改进 Salsa20 的想法。这篇短文事实证明比\
    \ Salsa20 快一点，得益于对 SIMD 指令的更好利用。*\n\n## CHES (密码学硬件与嵌入系统)\n\n所有 `IACR` 会议中最具*现实意义*的会议。它每年在不同的地点举行。研究人员展示经过评审的论文，标题诸如“使用拦截器从电子设备中勒索电磁信息”和“发出噪音：释放卷积神经网络用于剖面侧道分析的力量”。\n\
    \n## CIA\n\n信息安全的三大原则：机密性、完整性和可用性。密码学者的版本将*可用性*替换为*真实性*。\n\n## 密文窃取 (Ciphertext\
    \ stealing)\n\n一种使用 `CBC` 模式块密码进行加密的技术，使得密文长度与明文相同。它不像 `PKCS#7` 填充那样用固定值填充最后一个明文块，而是附加之前数据块的密文字节以获得一个完整的块。它剥离上述之前加密块的这些字节以保留原始消息的大小。这种技巧仅在消息\
    \ **24** CHES (密码学硬件与嵌入系统)\n\n大于一个块时才有效。它由 `NIST` 在三个不同的版本（`CS1`、`CS2` 和 `CS3`）标准化，但在实践中很少使用，因为大多数情况下较小的开销是可以接受的。\n\
    \n## Clipper \n\n一个针对复杂问题提出的简单解决方案：Clipper 芯片旨在允许美国公民和企业进行加密通信，同时允许授权方（即 **C**\n\
    \n政府和执法部门）进行完全拦截。Clipper 芯片由 `NSA` 在 20 世纪 90 年代初提出，是密钥托管架构的一部分，每个芯片的秘密密钥也将与美国联邦机构共享。除了其存在疑的安全架构外，Clipper\
    \ 芯片在技术执行上糟糕，并包含许多安全漏洞，这帮助其反对者停止了该项目。\n\n## CMVP (加密模块验证计划)\n\nNIST 用于验证提交 `FIPS\
    \ 140-2` 认证的加密模块的过程。为了在 `CMVP` 中接受评估，加密组件必须实现至少一种 `NIST` 标准算法。\n\n"
