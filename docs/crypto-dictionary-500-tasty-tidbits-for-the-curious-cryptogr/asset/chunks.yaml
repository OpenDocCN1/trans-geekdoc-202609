    最初的动力之一是编写一本书，简要描述非平凡的密码学概念，包括已有的概念以及一些最新的研究成果。许多密码学家听过这些术语，但往往无法记得它们的含义，或者不知道它们与相关概念有何区别。例如，群签名（group
    signatures）和环签名（ring signatures）有什么区别？`SNARK` 和 `STARK` 之间有什么区别？`SRP` 和 `OPAQUE`
    之间呢？`BIKE` 和 `SIKE` 呢？什么是简洁证明（laconic proofs）、可穿透加密（puncturable encryption）或可验证延迟函数（verifiable
    delay functions）？很少有书籍会提到这些概念中的任何一个，而且可能没有其他书会提到所有概念。


    我想根据研究进展发布带有更新和列出的新定义的多个版本。因此，我想让这本书保持活力，并随着时间的推移让它变得更加完整，这需要你们这些读者的帮助。我鼓励你通过
    Twitter 账号 `@cryptolexicon` 分享评论、错误报告或额外建议（最好公开发布，但如果你愿意，也可以发私信）。


    我希望这本书能是一次愉快且有价值的阅读体验，帮助你领略密码学领域的丰富性，并且尽管密码学是一个非常严肃的话题，你也不会把它想得太严肃。


    *洛桑，2021 年 1 月*


    ## 序言 xi


    ## 致谢


    你可能会认为这本书仅仅是我博学多结晶，但事实远非如此。我不仅必须学习或重新发现书中定义的许多术语，还依赖同仁和专家来回答问题、审阅定义的准确性和清晰度、提供参考文献、建议额外的定义，并提供其他宝贵的建议。


    我特别感谢技术评审员 `Pascal Junod`，他指出了初稿中的许多不准确之处，并识别了重要的缺失定义。特别感谢 `Luca De Feo` 对我的评审以及在用通俗易懂的解释同源（isogenies）和超椭曲线（hyperelliptic
    curves）方面提供的帮助。我还要感谢 `Alon Rosen`、`Anastasiia Voitova`、`Arrigo Triulzi`、`Ben Fuller`、`Doug
    Henkins`、`Jason Donenfeld`、`Nadim Kobeissi`、`Samuel Neves` 和 `Sofía Celi` 的帮助。最后，但同样重要的是，我感谢
    `No Starch` 团队的支持、高质量的编辑以及职业素养。


    ## 密码词典


    ### 2013


    `Edward Snowden` 泄露关于 `NSA` 机密活动的年份，这是密码学的一个转折点。端到端加密突然变成了一个吸引人的话题。


    ### 65537


    最常用的 `RSA` 公钥指数；足够大以保证不安全，足够小以使幂运算足够快，且其形式优化了实现速度（`65537 = 2¹⁶ + 1`）。


    ### A


    #### A5/0


    早期移动电话标准（`GSM`）中的三种加密模式之一。`A5/0` 意味着没有加密；因此，手机通话音频内容将在移动设备与最近基站之间以明文接收和传输。它的安全性与早期
    `TLS` 版本的空算法一样。


    #### A5/1


    西方国家（在 `3G` 和 `4G` 技术出现之前）的默认 `GSM` 算法，用于加密编码后的音频移动通信。这是一种基于奇特机制的流密码，该机制涉及三个不规则时钟的线性反馈位寄存器；因此，寄存器的更新取决于另外两个寄存器中某些位的值。


    复杂的密码分析已经破解了 `A5/1`。但在实践中，最有效的攻击相对简单：它是一种时间内存权衡，利用了 `A5/1` 的短状态（`64 bits`），并涉及大型彩虹链表的预计算。`A5/1`
    规范最初是机密的，直到 20 世纪 90 年代被反向工程破解后才公开。


    #### A5/2


    `A5/1` 的导出版本，这是一个委婉说法，意味着其技术要求类似于必须易于西方国家情报机构破解。`A5/2` 被设计为是不安全的，但事实证明它并没有极度不安全：在与
    `A5/1` 同时被反向工程破解后，学术研究人员很快发现了针对 `A5/2` 的攻击。但这些攻击在理论上的效率高于实际中的效率。


    #### A5/3


    终于，手机中出现了一种真正的算法。它是 DIY 版 `A5/1` 的升级，应用了一种已经公开并经过验证的算法，即块密码 `KASUMI`。`KASUMI`
    用于 `2G`（同 `A5/1` 一起），在 `3G` 中作为 `A5/4`（同 `SNOW 3G`），并在 `4G` 中不再被支持。


    查看 `KASUMI*`。


    #### A5/4


    `A5/3` 但密钥为 `128 bits` 而不是 `64 bits`；`A5/4` 是安全的，而 `A5/3` 则不是。


    #### 自适应攻击 (Adaptive attack)


    攻击者的行为取决于他们在攻击和协议执行期间观察到的内容。例如，在自适应选择明文攻击中，攻击者发送的明文取决于之前查询的响应。在非自适应攻击中，攻击者查询密文的明文列表必须预先确定。


    #### AEAD（关联数据的认证加密）


    一种通过生成密文以及认证标签对数据进行加密和认证的对称密码。解密步骤只有在标签有效时成功，证明密文是由知道密钥的人创建的。


    ## 不同的 AEAD 构造


    `AEAD` 中的 `AD` 指关联数据（associated data）——也称为*额外*或*辅助*数据——这些数据未加密但受认证机制覆盖，因为它们在计算认证标签时被视为输入。AEAD
    可以通过三种方式实现：


    ³   使用已有的密码和已有的 MAC，例如使用 `CBC` 模式下的 `AES` 作为密码，使用 `HMAC-SHA256` 作为 MAC。这是传统方法，通常效率最低。它最容易出错，因为组合密码和
    MAC 的方式有很多种（所谓的加密加 MAC、先加密后 MAC 和先 MAC 后加密）。


    ³   使用已有的密码和即时（ad hoc）MAC 或模式，例如 `AES-GCM` 和 `ChaCha20-Poly1305`，它们是目前此类类型中最流行的
    AEAD。例如，`TLS 1.3`。`AES-SIV` 也属于这一类，尽管它稍有不同（是 MAC 加密，而不是先加密后 MAC）。


    ³   使用自定义的二合一构造，例如 `ACORN` 和 `AEGIS`，都是 `CAESAR` 竞赛选的算法。在这些算法中，相同的内部状态和逻辑负责加密并生成认证标签。


    #### AES (高级加密标准)


    `NIST` 于 2000 年标准化的通用块密码。由比利时密码学家 `Joan Daemen` 和 `Vincent Rijmen` 设计，是 AES 竞赛的冠军，如今在各种工作模式下（如
    `CBC`、`GCM` 和 `SIV`）中被广泛应用。


    查看 *Rijndael*


    #### AES-CCM


    计数器加 CBC-MAC 模式下的 `AES`，将 `CTR` 加密模式与 `CBC-MAC` 认证相结合。`AES-CCM` 是 `NIST` 标准，并支持
    `TLS 1.3` 以及其他几种协议（包括低功耗蓝牙）。但它没有它的 `AES-GCM` 得多。原因是 `AES-CCM` 通常比 `AES-GCM` 慢且不方便使用。一篇名为《对
    CCM 的批判》的研究论文描述了 `CCM` 模式的局限性。


    #### AES-GCM


    在嵌入式平台上，`AES-CCM` 有时比 `AES-GCM` 更合适，因为它只需要 `AES` 算法而不需要额外的逻辑（不像 `GCM` 的 `GMAC`）。


