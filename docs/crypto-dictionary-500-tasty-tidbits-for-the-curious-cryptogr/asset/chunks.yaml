    \ encryption where the encrypting party, if coerced to reveal the plaintext and\
    \ randomness used, can choose different valid combinations of plaintext and randomness,\
    \ thus preventing self-incrimination.\n\nDeniable encryption can also loosely\
    \ refer to systems where different keys can decrypt to different legitimate-looking\
