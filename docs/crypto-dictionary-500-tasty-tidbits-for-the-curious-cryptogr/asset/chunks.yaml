  raw: 'The more you know about the person who chose the password, the easier this
    is, and the lower the password’s entropy. For example, if you know the person
    is a 65-year-old woman living in Tennessee, you’ll probably try a specific set
    of passwords; you’d try a different set if the person is a 20-year-old Swiss guy.
    The consequence of this is that passwords are fairly easy to find given their
    hash values: you just repeatedly hash possible passwords and compare the results
    with the given hash.


    The mitigation we use is very dumb, but it works: instead of using a secure and
    efficient hash function, we use a function that is secure but inefficient—


    slow to compute and sometimes also uses large amounts of memory (which makes password
    cracking even more difficult when using GPUs or dedicated hardware).


    **PBKDF2 (Password-Based Key Derivation Function 2)**


    Password-based key derivation function, second version of the standard. PBKDF2
    is the poor man’s password hash. It’s good enough in most cases when tuned with
    enough iterations, but it’s not as cool as Argon2.


    **PCT (Private Communications Technology)**


    Microsoft’s secure communication protocol. PCT competed with SSL v3


    in the mid-1990s. PCT intended to address SSL v2’s flaws yet be some-what compatible
    with it. But only Microsoft has used it, and it was ultimately replaced by SSL
    v3 or TLS everywhere.


    **PEP (Plaintext equivalence proof)**


    A protocol that checks whether two ciphertexts are encryptions of the same value.
    Participants cannot cheat.


    **Perfect forward secrecy**


    A See *Forward secrecy*.


    Perfect forward secrecy **89**


    **Permutation-based cryptography**


    Cryptographic schemes that leverage a single permutation to provide other functionalities.
    It’s based on research related to the Keccak hash function.


    **A BESTIARY OF PERMUTATION-BASED CRYPTO**


    Permutation-based cryptography from the Keccak extended family includes many constructions,
    modes, and primitives, which we’ve tried to inventory in the following subdictionary:


    ³ SHAKE, a XOF (part of the FIPS 202 standard)


    ³ cSHAKE, variant of SHAKE (part of NIST SP 800-185)


    ³ KMAC, a variable-length MAC (part of NIST SP 800-185)


    ³ Paral elHash, a paral elizable XOF (part of NIST SP 800-185) ³ TupleHash, a
    XOF designed to hash tuples of data (part of NIST SP 800-185) ³ Duplex, an extension
    of the sponge construction


    ³ MonkeyDuplex, a variant of Duplex to build authentication encryption schemes


    ³ DonkeySponge, a variant of Duplex to build MACs


    ³ Keccup, a reduced-round version of Keccak


    ³ Ketje (and its versions Ketje Jr, Ketje Sr, Ketje Minor, and Ketje Major), a
    lightweight authenticated cipher


    ³ Keyak (and its versions River, Lake, Sea, Ocean, and Lunar Keyak), an authenticated
    cipher


    ³ KangarooTwelve, a fast paral el XOF


    ³ Dec (doubly extendable cryptographic) functions


    ³ Deck (doubly extendable cryptographic keyed) functions


    ³ Kravatte, a deck function, coming with KravatteModes, modes on top of it ³ Farfal
    e, a construction to build a deck function


    ³ Cyclist, the mode of operation of Xoodyak


    ³ Motorist, the mode of operation of Keyak


    ³ Xoofff, a deck function, coming with XoofffModes, modes on top of it ³ Xoofffie,
    a variant of Xoofff


    ³ Xoodoo, a family of permutations


    ³ Xoodyak, a lightweight scheme (performing authenticated encryption, MAC, hashing,
    and so on)


    **90** Permutation-based cryptography


    ³ Mixifer, a 256-bit permutation


    ³ Mr. Monster Burrito, a variable-length block cipher


    Most likely, this is an incomplete list of the Keccak bestiary, but gives you
    an idea of the creativity and innovation of the Keccak designers.


    **P**


    **PES (Proposed Encryption Standard)**


    A block cipher presented at Eurocrypt 1990. It didn’t become a standard.


    A See *IDEA*, *IPES*.


    **PET (Plaintext equivalence test)**


    A protocol that checks whether two ciphertexts are encryptions of the same value.
    But participants can cheat.


    **PFS**


    A secret advanced cryptography think tank.


    A See *Forward secrecy*.


    **PGP (Pretty Good Privacy)**


    The first major, public cryptography software, developed in the early 1990s. PGP
    later became an enterprise encryption product. Currently, pgp.com redirects to
    broadcom.com, because Symantec acquired the PGP company and Broadcom later acquired
    Symantec. The OpenPGP


    message format and the GnuPG (GPG) software are the open source legacies of PGP.
    In 2020, PGP remains the de facto standard for email encryption and is used by
    major enterprise and open source email encryption software.


    PGP is often called broken, mostly because the 1990s design didn’t anticipate
    security requirements of the 2010s. Also, its software implementations turned
    out to have security flaws—as pretty much all software does.


    **Photuris**


    The Latin name for a genus of fireflies. Also, a session-key management protocol
    for IPSec that is, according to *informed speculation*, similar to NSA’s FIREFLY
    protocol (allegedly part of Suite A and used in EKMS).


    A See *Suite A*.


    Photuris **91**


    **Picnic**


    A post-quantum signature scheme that doesn’t fit in any of the established categories
    of post-quantum schemes. A Picnic signature proves the signer’s knowledge of the
    key to a block cipher, given a plaintext-ciphertext pair as a public key.


    Picnic achieves this by using a noninteractive proof of knowledge and a block
    cipher (lowMC) that lends itself to such proofs.


    **PKC**


    Officially, “The International Conference on Practice and Theory in Public Key
    Cryptography.” The PKC conference is to public-key cryptography what FSE is to
    symmetric cryptography, but it covers more diverse and mathematical topics.


    Researchers present peer-reviewed research papers with titles such as “Safety
    in Numbers: On the Need for Robust Diffie–Hellman Parameter Validation”  and “Committed
    MPC—Maliciously Secure Multiparty Computation from Homomorphic Commitments.”


    A See *Asiacrypt, CHES, CRYPTO, Eurocrypt, FSE, Real World* *Crypto, TCC.*


    **PKCS (Public Key Cryptography Standards)**


    A series of cryptographic standards issued by the RSA Security firm in the 1990s.
    Of the 15 PKCS standards, the best known are probably the following:


    ³ PKCS#1, also RFC 8017, is about RSA-based encryption and signature. An earlier
    version (1.5) defined an RSA encryption scheme vulnerable to Bleichenbacher’s
    padding oracle attack. Later versions, starting with 2.0, defined instead OAEP-based
    RSA encryption, which is less vulnerable to padding oracle attacks.


    ³ PKCS#7, also RFC 2315, is best known for its definition of the block cipher
    padding scheme but is mainly about data formatting and encoding.


    ³ PKCS#11 is a standard API to interact with a cryptographic module, such as that
    of an HSM.


