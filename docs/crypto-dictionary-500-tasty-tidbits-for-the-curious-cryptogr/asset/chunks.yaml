    1999 年，时间锁谜题论文的作者提出了一个实际挑战，并做出了以下预测：


    “我们估计解决该谜题需要连续计算 35 年，且每年都要更换为当时可用最快的计算机模型。”


    ### 时间锁谜题 127


    2019 年，人们证明了使用桌面级 `CPU` 或 `FPGA`（在这种情况下仅需两个月的计算时间）解决这一挑战其实比想象中要容易得多。


    尽管这是一个有趣的思想实验，且在实际应用中的意义微乎其微（至少在“时间旅行”方面），但最初的论文建议需要数月或数年的计算时间。


    ### 计时攻击 (Timing attack)


    一种利用时间差异来发现秘密，更广义地说是破坏加密系统安全的攻击。有时，算法的运行时间取决于秘密输入的值，这可能会触发诸如 `if–then` 模式或其他可变时间的操作。例如，某些处理器的算术单元如果一个输入值为零，则会在较少的周期内执行乘法指令。计时攻击的教科书级示例是针对平方幂幂（或倍增加乘法），其中私有指数（或标量）是逐位扫描的。


    攻击者还可以利用计时泄露来识别加密操作的结果（例如填充验证），或者在不返回详细错误代码时识别发生的错误类型（如针对 Manger 攻击的缓解措施）。


    ### TLS（传输层安全）


    一种在 `TCP` 上（以及通过 `DTLS` 在 `UDP` 上）建立安全通道的协议。在 `TLS 1.3` 之前，`TLS` 使用了 `PKI`、`X.509`
    证书以及大量的加密套件。


    参见 `SSL`、`Heartbleed`。


    ### 行业关注点


    2016 年 9 月，在 `TLS 1.3` 开发期间，一家金融服务机构的代表向负责 `TLS` 的 `IETF` 工作组发送了一封邮件，邮件主题为*行业界对
    TLS 1.3 的关注*。


    该邮件请求 `TLS 1.3` 考虑整合允许*监控员工通信*（如某些监管框架的要求）的功能，或者在某些情况下截获加密通信的能力。


    ### 128 计时攻击


    工作组主席 `Kenny Paterson` 回复道：*你好，Andrew,*


    *我对你请求的观点：不行。*


    *理由：我们试图构建一个更安全的互联网。元层面的评论：*


    *你来得有点晚了。打个比方，我们正处于清理烟灰和寻找还没喝光的啤酒罐的阶段。*


    *更准确地说，我们正处于第 15 版草稿，而 `RSA` 密钥传输在大约十个草稿前就从规范中消失了。我知道银行业通常反应比较慢，但这实在太过分了。*


    *祝好，Kenny*


    ### Tor


    ### T


    在所有加密应用中，`Tor` 的现实世界影响力与学术贡献及兴趣之间的比例是最高的之一。


    `Tor` 匿名网络（也称为*洋葱路由*）如果使用得当，可以提供不可追溯性保证。那些对这些特性至关重要的人（犯罪分子和执法人员，以及一些记者和政治活动人士）使用
    `Tor` 来延长寿命。你也可以使用 `Tor` 来绕过网络限制（如政府审查）并减轻追踪。


    ### 可微调块加密器 (Tweakable block cipher)


    一种通过接受额外的参数（称为*微调*）的块加密器，以确保在不同微调下产生不同的输出。与密钥不同，微调并不一定是保密的，且更改频率比密钥更高。更改微调值应该只会产生微乎其微的性能影响，与更改密钥不同，后者通常涉及昂贵的密钥调度操作。可微调块加密器已用于磁盘加密，以及某些需要额外输入的奇特专有结构。

