    计算 `Gröbner bases` 的通用问题是 NP-hard 的。对于多元变量密码学或代数密码分析中遇到的特定方程组，计算其所需的实际时间和内存通常非常大且难以估计：但在不需要这些的情况下，它能产生惊叹的密码分析结果。


    ## Group signature


    一种涉及一组潜在签名者的签名方案。小组中的任何成员都可以代表小组发布签名，而验证者可以获知小组成员的身份，但无法获知实际签名者的身份。


    有一个例外：小组必须与一个名为 `group manager`（组管理器）的信任实体合作，该实体可以将签名追溯到原始签名者。`Ring signatures`（环签名）不具备这种追溯属性，也不需要
    `group manager`。参见 `Ring signature`。


    组签名 **51**


    ## Grover’s algorithm


    一种量子算法，理论上可以用 `O(2^n/2)` 而非 `O(2^n)` 的复杂度破解对称密码，其中 `n` 是密钥长度。


    ### GROVER：注意字体细则


    你可能认为，由于 `Grover’s algorithm` 的存在，具有 128 位密钥的密码将只有 64 位的安全性。但实际上，由于各种原因（包括以下因素），破解密码的成本并变得平方级更具效益：


    * 运行 `Grover’s algorithm` 来破解例如 `AES` 需要 `AES` 的量子实现，这比任何传统实现都要慢得多且昂贵。

    * `Grover’s algorithm` 似乎并不像经典暴力破解那样扩展，从意义上说，它无法将计算分布在多个单元上，无法同时攻击多个实例。

    * `O()` 渐近符号隐藏了在现实中可能不可忽略的常数因子。


    ## H


    ### Hardcore predicate


    单向函数和置换理论定义中的关键概念：对于某些单向函数 `f()`，硬核谓词（hardcore predicate）是关于输入 `x` 的某些信息，这些信息从
    `x` 容易计算，但从 `f(x)` 很难计算。根据定义，你应该为任何给定的单向函数及其置换找到硬核谓词。


    ### Hash function


    单向函数和置换理论定义中的关键概念：对于某些单向函数 `f()`，硬核谓词是关于输入 `x` 的某些信息，这些信息从 `x` 容易计算，但从 `f(x)`
    很难计算。根据定义，你应该为任何给定的单向函数及其置换找到硬核谓词。


    `hash function` 接收输入并产生固定大小的输出。`hash function` 接收输入并产生固定大小的输出。`hash function`
