  trans: '


    在柯克霍夫斯论文的六项原则中，只有第二条广为人知的`柯克霍夫原则`。但所有六项都值得我们关注。让我们在这里审查它们：


    1. *该系统在实践上（即使在数学上）是不可破解的。*

    今天的等效概念还包括那些通过数学手段几乎无法破解的系统，例如安全证明在某些困难性假设下保证了实际安全性。


    2. *它不要求保密，而且即使落入敌手手中，也不会造成任何不便。* 所有严谨的密码学家都应该遵循这一条……除非他们不该遵循的时候。事实上，在少数例外情况下，将算法保密（通过自定义设计、秘密
    S 盒、秘密微调输入和/或秘密个性化值）会显著提高系统的安全性。


    3. *它的密钥必须在没有书面笔记帮助的情况下传输和保留，并根据通信双方的意愿进行更改或修改。* 密钥分配、撤销和轮换仍然密码学中最具挑战性的问题之一，也是许多危险的根源。


    4. *它必须适用于电报通信。* 抱歉了，柯克霍夫斯；邮件加密问题在实践上仍然未解决。


    5. *设备和文档必须是便携的，其使用和功能不需要多个人的参与。* 这一目标与分布式密钥生成和门限加密等协议的目标恰相反。


    6. *最后，鉴于其应用的特定环境，该系统必须易于使用，既不需要费脑，也不需要遵守一系列长长的规则。* 简单性在密码设计中很少成为主要考虑因素，尽管它本应是如此。


    ### 密钥派生函数 (KDF)


    一种通过对内容进行哈希处理以获取密钥的函数。简单的哈希函数并不总是能解决问题，因为要进行哈希的*内容*通常包含秘密值和非秘密值的组合。`KDF`的接口有助于安全地处理这些值，以避免不同内容集之间的碰撞。哈希函数不是`64`
    密钥派生函数 (KDF) 的另一个原因是：`KDF` 往往需要生成任意大小的密钥，而大多数哈希函数生成固定大小的值。


    当密钥不能是任意位字符串（例如对称密钥），而是公钥/私钥对时，就会出现特殊情况。在这些情况下，通常不会在 `KDF` 的过程中生成密钥对，而是使用第二个算法从种子（seed）确定性地创建一个密钥对。


    最后但同样重要的是，当内容的秘密是密码、密码短语或其他低熵值时，你需要一种特殊的 `KDF`，称为`密码哈希函数`。这些具有一些额外的安全要求。


    参见 *密码哈希函数*。


    ### 密钥托管 (Key escrow)


    将秘密密钥的托管交给机构或实体，以及与之相关的权利（例如解密通信）的想法。


    正如欧洲委员会在 1998 年 5 月的一次会议上所述：委员会 1995 年 1 月 17 日的决议承认，合法授权拦截通信是调查严重犯罪的重要工具。委员会注意到，执法机构可能要求在不通知加密服务用户的情况下，合规地访问加密密钥，以维持这种能力。为此，委员会承认，在其他方法中，一种可能满足执法部门利益的途径可能是推广涉及将加密密钥或其他信息存放在第三方那中的机密性服务。此类服务通常被称为“密钥托管”或“密钥
    `K` 恢复”服务。在必要解密作为刑事调查一部分的被捕材料时，执法机构也可能要求合法访问加密密钥。


    从原则上说，密钥托管听起来是现实问题的简单且公平的解决方案。但在实践中，密钥托管引发了许多程序、技术和政治问题，取决于你的标准，其收益可能并不值得额外的成本和风险。


    参见 *密钥管理*。


    密钥托管 65


    ### 密钥管理 (Key management)


    密码学中单一困难的问题。密钥管理无法通过量子计算机或 `NP` 预言来解决。


    ### 密钥封装 (Key wrapping)


    对于对称加密而言，就像 `KEMs` 之于公钥加密。


    ### 窃密密码学 (Kleptography)


    一个术语，指用于恶意软件和其他不道德应用中的密码学，特别是当其目标是以隐蔽方式窃取信息时；例如通过隐信道或混淆。


    参见 *病毒密码学 (Cryptovirology)*。


    ### 已密钥攻击 (Known-key attack)


    这种攻击模型假设攻击者已经知道了某些对称密码的秘密密钥。因此，攻击的目标不是恢复密钥，而是识别结构属性，当该密码被用于哈希函数或其他密钥可能不秘密的构造时，攻击者可能会利用这些属性。


    ### Kupyna (Купина)


    乌克兰国家哈希函数标准；建立于 2014 年，以植物重楼花（*Polygonatum multiflorum*）命名。Kupyna 基于一种相当奇特的压缩函数构造：给定消息块
    `M`。


    ### 简洁零知识证明 (Laconic zero-knowledge proof)


    一种交互式证明，证明者向验证者发送非常少的比特。


    66 密钥管理


    ### 赖西夫 (Lai–Massey)


    一种构建块密码的加密方法，尽管在 `IDEA` 和 `FOX` 中使用的频率远少于 Feistel 置换网络。


    #### 赖西夫轮 (A LAI–MASSEY ROUND)


    给定一个输入输出均为块大小两倍的函数 `f()`，赖西夫轮应用于分为两部分的状态 `L` 和 `R`。每一轮更新这些部分：首先计算 `X = f(L - R)`。然后设置
    `L = σ(L + X)` 和 `R = R + X`。


    在这里，`σ()` 是一个正换，即映射 `Y` ↦ `σ(Y) - Y` 也是一个正换。例如，FOX 的正换将 `L` 视为两部分 `LL||LR` 并返回
    `LR||(LL ⊕ LR)`。


    如果没有 `σ()`，`L - R` 在操作过程中保持不变，这会稍微降低方案的安全性（我把这个证明留给你作为一个练习）。


    ### 拉姆波签名 (Lamport signature)


    第一个基于哈希的签名方案，在原始形式下是最简单的签名方案：为了给单比特消息签名，你首先生成一个由两个随机值 `K 0` 和 `K 1` 组成的私钥。然后共享公钥
    `Hash(K 0), Hash(K 1)` 。为消息 `0` 签名，附加 `K 0` 作为签名，否则附加 `K 1`。


    这可行，但并不好用，因为 1) 一个密钥对只能签名一条消息，2) 密钥大小与消息大小成正比。


    ### 第一种公钥签名方案？ (THE FIRST PUBLIC-KEY SIGNATURE SCHEME?)


    尽管发表于 1979 年——在 Diffie–Hell man 和 RSA 论文之后——L


    拉姆波的方案可能是第一个使用公钥密码学的签名方案。用拉姆波自己的话说：


    *1975 年左右在伯克利的一家咖啡馆，Whitfield Diffie 向我描述了一个他一直试图解决的问题：为文档构建数字签名。我立即提出了一个解决方案。虽然并不实用——它可能需要
    64 位发布密钥来签名单个比特——它是第一个数字签名算法。*


    拉姆波签名 67


    **基于格密码学 (Lattice-based cryptography)**


