- fmt: '

    Of the six principles in Kerckhoffs’ paper, only the second is commonly known
    as `Kerckhoffs’ principle`. But all six deserve our attention. Let’s examine-
    them here:


    1. *The system must be practically, if not mathematically, indecipherable.*

    Today’s equivalent would also include systems that are virtually indecipherable
    by mathematical means, as when security proofs guarantee practical security under
    some hardness assumptions.


    2. *It must not be required to be secret, and it must be able to fall into the
    hands of the enemy without inconvenience*. All serious cryptographers should follow
    this . . except when they shouldn’t. Indeed, in rare exceptions, making the algorithm
    secret (via custom design, secret S-boxes, secret tweak input, and/or secret personalization
    values) contributes significantly to the security of a system.


    3. *Its key must be communicable and retainable without the help of written notes,
    and changeable or modifiable at the will of the correspondents*. Key distribution,
    revocation, and rotation remain among the most challenging problems in cryptography,
    and the source of many perils.


    4. *It must be applicable to telegraphic correspondence*. Sorry, Kerckhoffs; the
    problem of email encryption is still practically unsolved.


    5. *Apparatus and documents must be portable, and its usage and function must
    not require the concourse of several people.* This goal is the opposite of that
    of protocols, such as distributed key generation and threshold encryption.


    6. *Finally, it is necessary, given the circumstances that command its application,
    that the system be easy to use, requiring neither mental strain nor the knowledge
    of a long series of rules to observe.* Simplicity has rarely been a major concern
    in cryptographic designs, although it ought to be.


    ### Key derivation function (KDF)


    A function that hashes stuff to obtain a key. A simple hash function doesn’t always
    do the trick, because the *stuff* to be hashed typically includes a combination
    of secret and nonsecret values. A `KDF`’s interface helps process these values
    securely to avoid collisions between different sets of stuff. There is another
    reason hash functions aren’t `64` Key derivation function (KDF) sufficient: a
    `KDF` must often generate keys of arbitrary size, whereas most hash functions
    generate values of a fixed size.


    A special case arises whenever the key can’t be just any string of bits (as in
    the case of a symmetric key) but a public/private key pair. In those situations,
    rather than generating the key pair as part of the `KDF`, you would generally
    use a second algorithm to deterministically create a key pair from a seed.


    Last but not least, when the stuff’s secret is a password, pass-phrase, or other
    low-entropy value, you need a special kind of `KDF`, called a `password hash function`.
    These have some additional security requirements.


    A See *Password hash function*.


    ### Key escrow


    The idea of entrusting an organization or entity with the custody of secret keys
    and therefore the rights associated with them, for example, to decrypt communications.


    As told by the European Council in a meeting in May 1998: The Council Resolution
    of 17 January 1995 recognised that lawfully authorised interception of communications
    is an important tool for the investigation of serious crime. The Council notes
    that law enforcement agencies may require lawful access to encryption keys, without
    the knowledge of the user of the cryptographic service, in order to maintain this
    capability. To this end, the Council recognises that one possible approach amongst
    others, which might meet law enforcement interests, might be the promotion of
    confidentiality services which involve the depositing of an encryption key or
    other information with a third party. Such services are often known as “key escrow”
    or “key `K` recovery” services. Law enforcement agencies may also require lawful
    access to encryption keys where it is necessary to decrypt material which has
    been seized as part of a criminal investigation.


    In principle, key escrow sounds easy and a fair solution to real problems. But
    in practice, key escrow raises a lot of procedural, techno-ological, and political
    problems, and its benefits might not be worth the additional cost and risks, depending
    on your metric.


    A See *Key management*.


    Key escrow 65


    ### Key management


    The single hardest problem in cryptography. Key management won’t be solved by
    quantum computers or with an `NP` oracle.


    ### Key wrapping


    To symmetric cryptography, what `KEMs` are to public-key cryptography.


    ### Kleptography


    A term coined to refer to cryptography used in malware and other unholy applications,
    particularly when their aim is to steal information in a covert way; for example,
    via subliminal channels or obfuscation.


    A See *Cryptovirology*.


    ### Known-key attack


    An adversarial model that assumes the attacker already knows the secret key of
    some symmetric cipher. Therefore, the attack’s goal isn’t to recover a key but
    to identify structural properties that the attacker might exploit when the cipher
    is used in a hash function or some other construction where its key might not
    be secret.


    ### Kupyna (Купина)


    The Ukrainian national hash function standard; established in 2014 and named after
    the plant *Polygonatum multiflorum*. Kupyna is based on a fairly unusual compression
    function construction: given a message block `M` and an initial hash value `H`,
    the next hash value is computed as `H` ⊕ `Perm1(M)` ⊕ `Perm2(M ⊕ H)`, where `Perm1`
    and `Perm2` are permutations similar to `AES` with no key and a wider state.


    ### L


    ### Laconic zero-knowledge proof


    An interactive proof protocol where the prover sends very few bits to the verifier.


    66 Key management


    ### Lai–Massey


    A secure way to build a block cipher, although much less common than the Feistel
    substitution-permutation networks. The Lai–Massey construction is notably used
    by `IDEA` and `FOX`.


    #### A LAI–MASSEY ROUND


    Given a function `f()` whose input and output is of a length twice as short as
    the block size, a Lai–Massey round applies to an internal state split in two halves,
    `L` and `R`. Each round updates these halves as fol ow: First, compute `X = f(L
    - R)`. Then set `L = σ(L + X)` and `R = R + X`.


    Here, `σ()` is an orthomorphism, that is, a permutation so that the mapping `Y`
    ↦ `σ(Y) - Y` is also a permutation. For example, FOX’s orthomorphism sees `L`
    as two halves `L = LL||LR` and returns `LR||(LL ⊕ LR)`.


    Without `σ()`, the difference `L - R` remains the same through the round operation,
    slightly reducing the scheme’s security (I’ll leave the proof for this as a simple
    exercise for you to complete).


    ### Lamport signature


    The first hash-based signature scheme, and in its original form, the simplest
    signature scheme ever: to sign a one-bit message, you’d first generate a private
    key composed of two random values `K 0` and `K 1`. Then you’d share the public
    key `Hash(K 0), Hash(K 1)` . To sign the message `0`, you’d attach `K 0` as a
    signature, and you’d attach `K 1` otherwise.


    This works, but it’s not very useful, because 1) a key pair can sign only one
    message, and 2) the key size is proportional to that of the message.


    ### THE FIRST PUBLIC-KEY SIGNATURE SCHEME?


    Although published in 1979—after the Diffie–Hel man and RSA papers—L


    Lamport’s scheme might have been the signature scheme to use public-key cryptography.
    In Lamport’s own words:


    *At a coffee house in Berkeley around 1975, Whitfield Diffie described a problem
    to me that he been trying to solve: constructing a digital signature for a document.
    I immediately proposed a solution. Though not very practical—it required perhaps
    64 bits of published key to sign a single bit—it was the first digital signature
    algorithm.*


    Lamport signature 67


    **Lattice-based cryptography**

