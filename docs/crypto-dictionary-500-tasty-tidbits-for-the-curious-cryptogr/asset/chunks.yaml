    - The Signal application’s private contact discovery technique, leveraging the
    `Intel SGX` technology to prevent users’ contact lists to be directly exposed
    to the Signal servers, yet allowing users to find out who of their contacts are
    using the application.

    - Homomorphic encryption and searchable encryption, which can perform operations
    on encrypted data, thus keeping it confidential.

    - Tor’s onion routing, which prevents any host from knowing the source and destination
    of a message.

    - Contact tracing protocols considered to identify COVID-19–infected persons while
    preventing the tracking of users’ activity, social graph, and geolocation.


    ## Private information retrieval (PIR)


    Similar to oblivious transfer except the amount of information to be retrieved
    isn’t limited. Both PIR and oblivious transfer attempt to conceal the client’s
    activity to the database host, but PIR assumes `self-service`, whereas oblivious
    transfer restricts the client’s access to one-in-many access.


    A See `Oblivious transfer`.


    ## PROOFS OF . . . .


    The validation of blockchain transactions requires spending or owning some resource.
    This prevents arbitrary and efficient forking into alternative histories, which
    would enable double spending and other attacks.


    ### Private information retrieval (PIR) 97


    This design choice has led to a renewed interest in proofs of work, which we can
    trace back to at least anti-spam defense in the early 1990s and to the creation
    of other proofs where work is something other than just CPU usage.


    These proofs of resource often appear motivated by blockchain applications but
    usually aren’t specific to blockchain use cases (unlike the proof of burn).


    For an inventory of some of the proposed methods—besides the main and most general
    notions of proof of work and proof of stake—see `Proof of burn`, `Proof of catalytic
    space`, `Proof of human work`, `Proof of reserve`, `Proof of sequential work`,
    `Proof of space`, `Proof of spacetime`, `Proof of storage`, `Proof of useful work`.


    ### Proof of burn


    Perhaps the most straightforward type of resource usage proof proposed for a consensus
    protocol. Proof of burn consists of nullifying the value of tokens or other digital
    assets associated with the protocol, for example, by sending them to some unspendable
    address, the blockchain equivalent of `/dev/null`. This differs from proofs of
    stake, where the value owned isn’t destroyed.


    ### Proof of catalytic space


    A variant of proofs of space wherein the space isn’t completely wasted but can
    be used to store data unrelated to the proof. This leverages the concept of catalytic
    space computation, where a program can use some memory region even if it’s already
    used to store data, and return said region in its original state after completing
    its task.


    ### Proof of human work


    Proof of work whose work isn’t a computationally intensive task but one that is
    relatively easy for humans, yet hard for computers and AI programs. An idea proposed
    it to rely on CAPTCHAs generated using obfuscated programs to prevent the machine
    generating CAPTCHAs to solve them.


    ### Proof of replication


    An extension of proof of storage to prove that multiple replicas of a piece of
    data are being stored instead of a single real copy and pointers to it. One technique
    used to realize proof of replication involves depth-robust graphs, a notion from
    graph theory rediscovered in the context of memory-hard password hashing.


    ### 98 Proof of burn


    ### Proof of reserve


    Not a proof of resource associated to consensus protocols, but a proof that one
    account or organization owns a certain amount of coins. A proof of reserve can
    be publicly verifiable, for example, by issuing a special transaction from an
    address that controls the funds to be verified. It can also be private and/or
    notarized on a private ledger, for example, by signing a timestamped message provided
    by auditors.


    A proof of reserve can be considered a proof of stake without the lottery mechanism
    and without being tied to any decentralized protocol.


    ### Proof of security


    A See `Security proof`.


    ### Proof of sequential work


    Proof of work for which parallelism is useless, because operations must be carried
    out sequentially. As with parallelizable proofs of work, a solution to the puzzle
    must be verifiable efficiently.


    Like verifiable delay functions (`VDFs`), proofs of sequential work can be used
    to add an incompressible delay in decentralized applications.


    They also face the same technical challenges of associating an actual time latency
    to a series of operations. Unlike with VDFs, a proof of sequential work doesn’t
    admit a unique precomputable solution, which restricts its number of applications.


    A See `Time-lock puzzle`, `Verifiable delay function (VDF)`.


    ### Proof of space


    A demonstration that a prover has certain amount of memory at their disposal.
    For example, a prover might have to allocate one terabyte to convince a verifier,
    and the verifier won’t accept any proof from a prover that allocated less than
    a terabyte. Wasting memory with proofs of space is arguably more ecological than
    wasting CPU time with proofs of work.


    ### Proof of spacetime


    An extension of proof of storage to efficiently demonstrate that a piece of data
    (or multiple replicas thereof) has been stored throughout a given period of time.
    Proofs of spacetime can be realized by combining proofs of replication. Used by
    the Filecoin project, proofs of spacetime ensure that hosts rewarded to store
    data aren’t cheating.


    ### Proof of spacetime 99


    ### Proof of stake


    An environment-friendly counterpart of proofs of work where miners holding a greater
    amount of tokens have a greater chance to validate transactions; they receive
    the reward by a kind of lottery system. The richest thus get richer faster by
    doing nothing other than `staking`, by running a node and keeping it online.


    Proof of stake blockchains usually require a certain table stake amount to participate
    on the network.


    ### Proof of storage


    Proof that some piece of data is being stored (or at least known, or possible
    to be generated). Concepts such as provable data possession and proof of retrieveability
    are examples of proofs of storage. The most straightforward proof system is one
    where the verifier sends some challenge `c` and the prover returns `Hash(c||M*)`
    where `M` is the data whose storage is to be verified.


    ### Proof of useful work


    When the proof of work is not completely wasteful, but compute time is used to
    contribute to solving some computational problem.


    ### Proof of work


    Cryptography’s contribution to environmental problems.


    ### Provable security


    For some cryptographers, the only acceptable security—as opposed to unscientific,
    unacceptably risky heuristic security.


    This simplistic goal is now less common, and provable security is now considered
    more of an additional insurance than as something required by all means necessary.


    For example, an algorithm such as `AES` is not `provably secure`, and public-key
    schemes, such as `RSA` or `ECDSA`, are only proven secure insofar as their underlying
    computational problems are hard.


    ### Provably secure


    “If it’s provably secure, it’s probably not,” to quote cryptographer Lars Knudsen
    (then in the context of block ciphers). This folklore adage might come from the
    block cipher `COCONUT98`, which was proven to be secure against a class of differential
    cryptanalysis techniques but ended up being broken by a yet unknown type of differential
    attack (boomerang).


