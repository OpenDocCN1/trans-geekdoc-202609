    依赖于信息量不足的线性码解码困难性的后量子方案。许多基于码的方案是 1978 年 McEliece 构建的变体，其公钥描述了一个随机线性码。加密过程包括对消息进行编码的同时向码字中添加一些错误。由于存在陷门（trapdoor），可以将码字转换为另一种可以解码的代码，因此解密是可能的。


    2017 年向 NIST 后量子竞赛提交的 `Classic McEliece` 与 McEliece 在 1978 年的方案几乎相同。


    ### 承诺（Commitment）


    也称为比特承诺（bit commitment），这是一种协议，其中证明者临时隐藏一个不可更改的消息。证明者通过发布一个不泄露所承诺的值（这种特征被称为 `hiding
    property`）来实现这一点，并且必须防止证明者在承诺 `25` 时泄露与承诺值不同的值（称为 `binding` 属性）。`bit commitment`
    一词最初是指仅承诺一个比特的硬币抛掷协议。但它现在被用于任何大小的值。安全领域人士神秘神秘地发布在 Twitter 上的哈希值，以便他们声称先发现了某些 0-day
    漏洞，这些都是基础承诺。


    ### 并发零知识（Concurrent zero-knowledge）


    在并发环境下安全的零知识证明，即当攻击者可以观察并破坏多个独立的证明协议执行时的证明。


    ### 共识协议（Consensus protocol）


    分布式计算领域的一个旧概念，由于其在区块链系统中的作用而再次变得酷起来。


    ### 控制字（Control word）


    用于加密付费电视系统中音频和视频内容的密钥。在旧留系统中，该密钥长度为 48 位；在较旧的系统中为 64 位；在最新一代中为 128 位。虽然 48 位看起来短得离谱，但如果每
    5 或 10 秒更换一次密钥，它就足够了。


    ### COPACOBANA（成本优化并行密码破解器）


    一种基于 FPGA 的 DES 破解器的学术概念证明。COPACOBANA 创建于大约 2007 年，能够以一种成本效益的方式在一周内破解 56 位 DES
    密钥。


    ### 集体权威（Cothorority / collective authority）


    一种创建去中心化协议的框架，其中操作涉及多个方，使得没有一个人的权威高于其他人。


    你可以使用 cothorities 执行操作，例如阈值签名、共识或分布式公共随机数生成。尽管它听起来很有区块链味，但很少有区块链使用 cothorities。


    ### 密码学分析（Cryptanalysis）


    分析加密算法以破解它们——即违反其安全假设——或为了理解它们为何无法被破解的实践。


    ### 26 并发零知识


    ### 隐世生物（Cryptids）


    像大脚怪、独角兽、克拉肯怪物或蒙古死亡蠕虫之类的动物。就像优秀的加密软件一样稀有。


