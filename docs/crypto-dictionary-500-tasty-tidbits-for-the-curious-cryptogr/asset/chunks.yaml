  trans: '

    在理论上，Poly1305 显得简单，但其模 $2^{130} - 5$ 的非标准算术和密钥生成机制有时会令实现者感到困惑。


    ## 多项式复杂度


    在大多数情况下指的是实际复杂度。


    ## 破坏后安全性


    一个主要用于安全消息传输的术语，表示一种类似于向后秘密性（backward secrecy）的概念。


    参见 `Backward secrecy`。


    ## 后量子密码学


    旨在不被量子算法破解的加密方案。因此，它们能够抵抗未来假设的量子计算机。也被称为量子安全和量子抗性加密。


    后量子密码学 **93**


    ### 深入研究后量子加密


    后量子密码学主要针对公钥方案（签名、加密、密钥协商）而非对称方案，因为后者大多数对量子攻击具有免疫力。例如，对称加密通过简单地加倍密钥长度即可阻止 `Grover’s
    algorithm` 带来的渐近二次加速，而超多项式级加速只会在特殊情况下发生。


    要成为后量子算法，算法不能依赖于因数分解或离散对数问题，这两者在受到 `Shor’s quantum algorithm` 攻击时都会崩溃。相反，它们可以依赖于
    NP-hard 问题。大多数提出的后量子算法属于以下类别之一，取决于它们构建安全性时基于的计算问题：


    *   基于码，依赖于纠错码的解码问题

    *   多元方程组

    *   基于格，具有诸如误差学习 (`LWE`) 等问题

    *   基于哈希，或使用密码哈希函数的哈希树结构

    *   椭圆曲线同


    ## 后量子 RSA


    RSA 的规模巨大到在实践中对量子攻击免疫，同时也无法进行实际应用。后量子 RSA 的公钥规模达到太字节级。后量子 RSA 已提交给 NIST 的后量子密码学标准化项目。


    ## 预测抵抗


    NIST 特别使用的术语，指一种类似于向后秘密性的概念。预测抵抗是回溯抵抗（backtracking resistance）的立面。


    参见 `Backward secrecy`。


    ## 原像


    哈希函数中的在给定值 `H` 的情况下寻找某些 `M` 使得 `Hash(M)` = `H` 的问题。如果 `H` 是通过从足够大的有限可能消息集中随机选择某个
    `M₀` 并计算 `H = Hash(M₀)` 来得到的，那么即使拥有无限计算能力，**94** 后量子 RSA 攻击者也永远无法确定识别出 `M₀`，除非
    `M₀` 是唯一哈希值为 `H` 的值。


    但在实践中，我们处理的消息集比哈希值大得多；因此，任何 `H` 都有许多原像。此外，没有人实际上拥有无限的计算能力。寻找任何原像的 **P** 成本都是 $2^n$，这在实践中是不可能的，即使哈希值仅有
    $n = 128$ 位。


    ## PRESENT


    Serpent 的变位词。一种工作方式与 Serpent 非常相似（令人惊讶）但规模更小的分组密码。作为一种*超轻量级加密*，`PRESENT` 具有与 `DES`
    相同的 64 位块，并支持 80 位和 128 位密钥。根据对*破解*的某些非常学术的理解，`PRESENT` 被双双链密码分析破解破解，复杂度分别为 $2^{79.76}$。

