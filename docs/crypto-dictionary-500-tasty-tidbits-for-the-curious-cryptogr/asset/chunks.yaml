    在这里，`KDF()` 是一个密钥衍生函数。Alice 使用她的私钥和 Bob 的公钥计算这些操作，而 Bob 则反相反。


    在实践中，如果 Alice 发起协议，她会选择一个随机临时密钥，并从消息服务器获取一个 Bob 的预计算临时密钥，这些密钥被称为预签名（pre-keys）。`X3DH`
    设计用于异步通信；它试图以一种最小化计算和信任假设的方式来满足若干安全需求。


    ### 136 X25519


    ### `XMSS (eXtended Merkle Signature Scheme)`

    一种仅使用哈希函数和树形结构的公钥签名方案。`XMSS` 的状态性——或者说在签名操作期间跟踪计数器的义务——被认为是一个巨大的致命缺陷。尽管如此，`XMSS`
    已已成为 IETF 标准，并在 `OpenSSH` 中进行了实验性集成。


    参见 *PHINCS*。


    ### `XOF (extendable output function)`

    一种输出长度可变的哈希函数。该函数在需要时还可以扩展输出的长度。相比之下，在不可扩展的可变长度输出函数中，不同大小的输出值是完全不同的，较短的值不是较长值的前缀。


    ### `XOR`

    异或逻辑操作，写作 `⊕`。`XOR` 遵循以下规则：真异或假等于真；真异或真等于假；假异或假等于假。当被视为二进制运算符时，这些规则产生以下结果：`1 ⊕
    1 = 0`，`0 ⊕ 0 = 0`，`0 ⊕ 1 = 1`，`0 ⊕ 0 = 1`。


    扩展到位字符串，你会得到 `0111 ⊕ 1101 = 1010` 等。


    ### `XOR encryption`

    一种形式的加密形式，有时在恶意软件中用作混淆层。它与一次性密文类似，但异或后的值并不总是秘密，也不只使用一次。


    ### Z

    ### Z


    ### Zerocash

    于 `Zerocoin` 之后、`Zcash` 之前。


    ### `ZKP (zero-knowledge proof)` 一种协议，证明者说服验证者他们知道某个数学陈述（例如某个难题的解），而无需泄露该陈述。


    `ZKP (zero-knowledge proof)` 137


    现在它是加密爱好者中的一个主流概念，`ZKPs` 曾是密码学与理论计算机科学交叉领域中的一个冷门领域。


    零知识是一门广阔且丰富的学科，从应用角度来看，可以说仍处于婴儿阶段。已经有一些 `ZKPs` 从会议论文进展到了现实世界：这些应用包括电子投票和区块链应用，其中非交互式
    `ZKPs` 帮助保护交易隐私。`ZKPs` 也是门限签名方案的一部分，用于某些冷存储系统。


    密码学零知识不应与安全工程中的零知识架构概念，或指代客户端加密的营销术语“零知识”混淆。


    参见 *NIZK (non-interactive zero-knowledge)*。


    ### `ZRTP`

    一种用于 `RTP` 连接的密钥协商程序，用于两个节点之间的 VoIP 连接。`ZRTP` 最初出现在 `Signal` 应用中以启用端到端加密通话，后来被丢弃，转而使用从文本消息会话状态派生的密钥，事实证明后者更简单更安全。`ZRTP`
    中的 `Z` 代表 Phil Zimmermann。


    ### 138 ZRTP


