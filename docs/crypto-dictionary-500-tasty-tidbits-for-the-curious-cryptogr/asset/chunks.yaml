    This concept was applied to refine differential attacks on `AES` and lead to attacks
    that, in theory, perform fewer operations than a brute-force search (`2126` instead
    of `2127`). The bicliques used in this context are composed of a first set of
    bits from the internal state, a second set of bits from the ciphertext, and dependencies
    between these two sets conditioned by key bits. The idea of the attack is then
    to identify certain bits of the key as those for which the biclique conditions
    are satisfied (in terms of XOR differences).


    ### BIKE (Bit Flipping Key Encapsulation)


    Sounds like `SIKE`: also a `KEM`; also post-quantum, but based on a decoding problem
    rather than an isogeny problem.


    A See `SIKE (Supersingular Isogeny Key Encapsulation)`.


    ### BIP (Bitcoin improvement proposal)


    A misleading name, because the most famous `BIPs` are no longer just proposals
    but de facto standards that apply to more cryptocurrencies than just Bitcoin.
    These BIPs include:


    *   `BIP 32`, which defines a tree-based mechanism to derive key pairs and addresses
    from a secret seed to create wallets of multiple accounts from a single secret
    value.

    *   `BIP (Bitcoin improvement proposal) 13`

    *   `BIP 44`, which assigns semantics to `BIP 32` tree levels and defines a syntax
    for paths within this tree (consisting of purpose, coin type, account, address
    type, and address index).

    *   `BIP 39`, which defines a representation of a secret value as a high-entropy
    list of dictionary words, or mnemonic, which is then hashed to a seed that will
    be the root of a `BIP 32` hierarchy of accounts.


    ### Bit Gold


    The closest predecessor of Bitcoin.


    ### Bitcoin


    An experiment that went out of control, for better or for worse.


    ### Black


    NSA jargon referring to encrypted values. A black key is an encrypted key that
    uses, for example, a key wrapping mechanism so that it can be safely distributed
    on lower-security-level systems or networks. In the context of data-at-rest protection,
    black data is classified data that has been encrypted twice using appropriate
    encryption layers.


    A See `EKMS (Electronic Key Management System)`.


    ### BLAKE


    A hash function submitted to the `SHA-3` competition in 2008. It was one of five
    finalists but wasn’t selected (the winner was `Keccak`). `BLAKE` reuses the permutation
    of the `ChaCha` stream cipher with rotations done in the opposite directions.
    Some have suspected an advanced optimization, but in fact it originates from a
    typo in the original `BLAKE` specifications.


    ### BLAKE2


    An evolution of `BLAKE` proposed shortly after the end of the `SHA-3` competition
    in 2012. It was adopted in many software applications because it’s faster than
    `SHA-2` and `SHA-3`. Several cryptocurrencies’ proof-of-work systems use `BLAKE2`.


    ### BLAKE3


    A hash function that combines a reduced-round `BLAKE2` and a Merkle tree construction,
    making it significantly faster than `BLAKE2`. `BLAKE3` was announced at the Real
    World Crypto 2020 conference.


