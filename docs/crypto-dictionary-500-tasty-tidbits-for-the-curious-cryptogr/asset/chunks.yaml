    *N* = *pq* ³ Find *e* given *x*, *p*, and *xe* mod *p* You recognized these problems—factoring
    and discrete logarithm—whose hardness is necessary to the security of RSA and
    elliptic-curve cryptography.


    **Braid group cryptography**


    An attempt to build a new type of public-key cryptography using non-commutative
    groups of elements. Such elements can be viewed as braids with a fixed number
    of strands, and group operations are computationally efficient. As a side benefit,
    braid group cryptosystems were expected to be resistant to quantum algorithms.
    But none of the proposed key agreement schemes proved very cryptographically valuable
    due to their insufficient security.


    **Brainpool curves**


    Elliptic curves designed by the German Federal information security authority
    ( *Bundesamt für Sicherheit in der Informationstechnik,* or BSI).


    Brainpool curves have some suboptimal security properties, but unlike other standards,
    they provide a 512-bit curve (rather than a 521-bit one).


    Brainpool curves **19**


    **Break-in recovery**


    A notion similar to backward secrecy and indistinguishable from future secrecy.
    The term was coined in the context of the Signal protocol.


    A See *Backward secrecy*.


    **Broadcast encryption**


    A type of encryption where the same ciphertext is broadcast to a set of receivers
    so only authorized ones can decrypt it, and receivers can be revoked to no longer
    decrypt it. Challenges of broadcast encryption are to be secure against collusion
    of receivers and to minimize ciphertext and keys’ lengths.


    **APPLICATIONS OF BROADCAST ENCRYPTION**


    Although broadcast encryption was motivated by pay-TV content protection, it was
    never deployed: the reasons are mainly due to the prohibitive length of ciphertexts
    or keys and general unsuitability to receivers’ security model, where broadcast
    encryption only addresses a small part of the problems related to piracy.


    But broadcast encryption has been used in the AACS content protection scheme used
    for Blu-ray discs. However, it turned out to be of limited effectiveness against
    piracy, because the content decryption key (which was protected by broadcast encryption)
    could be extracted from software players.


    **Brute-force attack**


    A type of attack that attempts to recover a secret by consecutively trying all
    the possible values of that secret. You can start a brute-force attack against
    most ciphers. But as long as the secret is long enough, the attack will never
    terminate (unless you’re impossibly lucky), because there are too many values
    to try.


    **Bulletproof**


    A zero-knowledge proof proposed as an efficient range proof for cryptocurrencies.
    The major advantage of bulletproofs is that they don’t require a trusted setup.
    Specifically, they don’t need an initialization of **20** Break-in recovery


    the parameters, or *rules of the game*, which must be trusted for the protocol
    to be secure. Bulletproofs are notably used in Monero.


    A See *Range proof*.


    **Byzantine fault tolerance**


    An umbrella term for a class of consensus protocols that don’t directly rely on
    mining and proof-of-something. pBFT (and variants thereof) and **C**


    Tendermint are such protocols; they work by having a fixed number of hosts working
    together to reliably maintain a common state while distributing trust across hosts.


    **C**


    **CAESAR**


    The Competition for Authenticated Encryption: Security, Applicability, and Robustness,
    a non-NIST cryptographic competition that took place from 2014 to 2019. Partially
    funded by but not supervised by NIST, CAESAR identified new authenticated ciphers
    for several use cases, including *lightweight applications (resource constrained
    environments)*, *high-performance applications*, and *defense in depth*.


    **CAESAR’S DEFENSE IN DEPTH FOR AEAD**


    Of the three use cases defined in the CAESAR competition, defense in depth is
    probably the least obvious to readers. It was also the most interesting in terms
    of cryptographic engineering, because it was defined as addressing the fol owing
