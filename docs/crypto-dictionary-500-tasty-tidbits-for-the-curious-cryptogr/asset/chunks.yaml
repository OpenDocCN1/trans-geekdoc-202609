    ## HPC (Hasty Pudding Cipher)


    A mostly forgotten block cipher submitted in 1998 to the `AES` competition. Its
    designer called it “the first Omni-Cipher: It can encrypt any blocksize with any
    keysize.”


    ### SPECIAL FEATURES OF THE HASTY PUDDING CIPHER


    Unconventional yet innovative, `HPC` had several unique features as it was:

    * The first tweakable block cipher (the tweak was then called the `spice` or the
    `secondary key`)

    * Optimized for 64-bit architectures and the fastest of all `AES` candidates on
    these

    * Able to support any key and block size

    * Composed of five subciphers: `HPC-Tiny`, `-Short`, `-Medium`, `-Long`, and `-Extended`


    The so-called `spice` anticipated some of the future needs for a tweak. The `spice`
    can be different for every bit field, preventing dictionary attacks.

