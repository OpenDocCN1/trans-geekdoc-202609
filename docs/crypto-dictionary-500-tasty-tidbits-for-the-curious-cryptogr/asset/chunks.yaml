    CSA3 非常非常不同。尽管它的完整设计尚未公开，但众周知它将 `AES` 与另一种（专利）运行在某些异常操作模式下的分组密码算法结合。此外，它还包含了用于防止软件仿真的组件。根据其设计，`CSA3`
    应该仅运行在专用硬件电路中，例如位于机顶盒系统级芯片中的电路。


    ## E


    ### E0

    用于蓝牙的流加密算法。在理论上可以破解，但在实践中尚未破解。较新的蓝牙低功耗（Bluetooth Low Energy）标准已用 `AES-CCM` 代替。


    ## ECB (电子密码本)

    使用分组密码最直观的方法，每个数据块都与其他块独立进行处理。`ECB` 是抵抗重复初始化向量（IV）和随机数（nonces）最稳健的模式。但大家都知道 ECB
    是不安全的，因为你可以看到（企鹅。


    ## ECC

    根据上下文，它是椭圆曲线密码学（elliptic-curve cryptography）或纠错码的缩写；两者之间的混淆会导致不幸的后果。

    参见 *Elliptic-curve cryptography*。


    ## 38 DVB-CSA


    ### ECDLP (椭圆曲线离散对数问题)

    可以说是密码学安全领域最重要的计算问题：给定点 `P` 和 `xP`，找到数字 `x`，其中乘法运算发生在有限域上的椭圆曲线群上。

    椭圆曲线方案已经取代了许多 `RSA` 或经典的 Diffie–Hellman 算法实例，例如在 `TLS 1.3` 标准中。


    ### ECDSA (椭圆曲线数字签名算法)

    `DSA` 的椭圆曲线对应版本，其安全性依赖于 `ECDLP` 的困难性，但并非完全等同。据我们所知，`ECDLP` 的困难性仅在通用群模型下意味着 `ECDSA`
    的安全性（不可伪造性），该模型是 `ECDSA` 的一种抽象，但并不完全等于 `ECDSA`。

    参见 *DSA (Digital Signature Algorithm)*。


    ### PLAYSTATION 3 中的 ECDSA

    许多人是在攻击者发现 PlayStation 3 使用了 `ECDSA` 的弱实现版本后，首次了解到该算法。该实现中的随机数（nonce——一个本应对每个签名都是唯一的参数，通常通过随机选择选取）保持不变，导致攻击者能够轻易获取私钥。

    （剧透：密钥为 `46 DC EA D3 17 FE 45 D8 09 23 EB 97 E4 95 64 10 D4 CD B2 C2`。）

    错过 PS3 破解事件的人后来后来发现 `ECDSA` 是比特币和以太坊的签名算法，在这些系统中，`ECDSA` 密钥有时也会因为缺陷钱包软件中重复或偏斜的随机而被破解。


    ### ECIES (椭圆曲线集成加密方案)

    `IES` 公钥加密方案的椭圆曲线版本。像 `IES` 一样，`ECIES` 是混合加密方案，因此它需要对称加密来实际加密消息。

    参见 *IES (Integrated Encryption Scheme)*。

    ECIES (Elliptic-curve IES) 39


    ## Ed25519

    使用 `Curve25519` 的 Edwards 表示法进行 `EdDSA` 签名，而不是 `X25519` 使用的蒙哥利格式，这给开发者带来了很多麻烦。

    参见 *Curve25519*，*EdDSA*。


    ## EdDSA

    基于 Schnorr 方案的确定性椭圆曲线签名方案。它是 `ECDSA` 标准的主要替代方案。在最纯的形式下，它对非抗碰撞哈希函数具有免疫力，并被 `Ed25519`
    应用使用。


    ## EKMS (电子密钥管理系统)

    由美国安全局（NSA）设计的传统密钥管理系统，用于保护美国陆和其他和其他通信安全。


    ## 过多的密钥

    如果你认为 Web 应用程序的密钥管理很难，等你必须在一个具有不同分类级别、网络、设备类型、数据管理策略和员工培训的环境中执行它。

    以下（不完全的）`EKMS` 密钥缩写列表说明了在其目标环境中管理密钥复杂性：

    - `AEK`: 算法加密密钥

    - `KEK`: 密钥加密密钥

    - `KPK`: 密钥产生密钥

    - `OWK`: 传输密钥

    - `TEK`: 流量加密密钥

    - `TrKEK`: 传输密钥加密密钥

    - `TSK`: 传输安全密钥

    系统根据密钥的角色（业务、维护或测试）对其进行分类。业务密钥又具有多种不同的属性：它们可以是应急备用密钥、联合剧院密钥或联盟密钥等。


    ## 40 Ed25519


    ### 电子密码本

    在古老的 NSA 术语中指加密器。例如：“电子密码本，如高级加密标准，既被广泛使用，又难以通过密码分析法进行攻击。”


    ### ElGamal

    多年来，它是 `RSA` 之外加密课程中唯一使用和教授的公钥加密方案。它引入于 1985 年的文章《基于离散对数的公钥密码系统和签名方案》，该文章谦虚地以以下摘要开头：

    提出了一种新的签名方案以及 Diffie–Hellman 密钥分发方案的实现，实现了公钥加密系统。这两个系统的安全性都依赖于在有限域上计算离散对数的困难性。

    `ECDSA` 最终盖过了该签名方案，目前 ElGamal 加密很少被使用。相反，密码学家使用 `ECIES`，除非是在消息必须直接进行公钥加密的应用（例如某些电子投票系统）。

    指数变体 `ElGamal` 加密有两个有趣的属性：它是加法同态的，且除非解出离散对数，否则解密是不可能的。尽管有后者的缺陷，这种版本在门限签名方案中证明是有用的。


    ### Elligator

    一种将椭圆曲线点编码为看似随机字符串的方法，以使公钥与加密数据区分开。


    ### 椭圆曲线

    不是省略，不是直线。平面上 (x, y) 坐标满足曲线方程的点集，方程通常为 `y² = x³ + ax + b`，其中 `a` 和 `b` 是固定参数。密码应用仅适用于某些有限域上的点；因此曲线具有有限的点集。


    ## 从数学到密码学

    椭圆曲线在密码学出现之前就被发现了，数学家早已开始研究了它们。例如，椭圆曲线在费马大定理的证明中发挥了作用。

    密码学利用了这样一个事实：椭圆曲线点相对于几何定义的群运算（表示为点加）形成了一个群结构。对于良好的曲线类型，离散对数问题在这些群中变得困难，这就是为什么这些曲线在公钥密码学中非常有用。


    ### 椭圆曲线密码学

    依赖椭圆曲线及相关困难问题（离散对数或其变体）的公钥密码学。椭圆曲线密码学可以完成传统公钥密码学可以做的大部分事情，而且通常更快且使用的密钥更短。这包括加密、密钥交换和签名。此外，由于其对对的支持，你可以将其用于更奇特的密码方案。

    参见 *基于对的密码学*。


    ### 加密过程

    加密的同义词，强调在加密过程中执行的行为和操作。encipher（如法语动词 *chiffrer*）源于阿拉伯语 رفص (*sifr*，数字 0），而 encrypt（如动词
    *crypter*）源于希腊语 *kryptos*（隐藏的，秘密的）。


    ### 端到端加密 (E2EE)

    当只有指定的接收者可以解密消息时，加密被称为端到端加密。这听起来很简单，但实际上是一项艰巨的工程问题。

