  \ `SPHINCS` 变体。不要与 `SPHINX` 混合网混淆。\n\n见*XMSS*。\n\n### 海绵函数（Sponge function）\n设计哈希函数的简单方法。海绵函数仅使用排列算法——相对于密钥排列或分组密码。由\
  \ `Keccak` 开创（现为 `SHA-3`），它催生了许多基于排列的方案。\n\n见*Keccak*、*基于排列的密码学*。\n\n海绵函数 **121**\n\
  \n### SRP（安全远程密码）\n依赖 Diffie–Hellman 问题的 PAKE。`SRP` 可以与 `TLS` 结合，并显著用于 `i Keychain`。但总而言之，它的应用较少，可能是因为早期版本的\
  \ `SRP` 存在漏洞。\n\n### SSH（安全 Shell）\n基于 `TCP` 的安全通道。`SSH` 并不依赖 `PKI` 或 `X.509` 证书，而是信任首次信任模型。`SSH`\
  \ 中发现的安全问题比 `TLS` 少。\n\n### SSL（安全套层）\n非 `TLS`。`SSL` 是该流行协议的前身；设计于 90 年代，第一个版本因不安全从未发布。\n\
  \n`v2` 于 1995 年 3 月随 Netscape Navigator 1.1 发布，不久后发布了 `v3` 以缓解中间人攻击（通过降级到弱加密套件）。尽管如此，许多系统继续支持\
  \ `SSL v2` 以于兼容。二十年后，`DROWN` 攻击利用了对 `SSL v2` 的这种支持来攻击最近的 `TLS` 版本。\n\n### STARK（透明知识证明）\n\
  `SNARK` 的变体。`STARK` 的出现源于需要高效且可扩展的知识证明的应用，其约束比 `SNARK` 更少。以下是 `STARK` 和 `SNARK`\
  \ 的主要区别：\n\n³ `STARK` 不需要*可信设置*——这是一个必须由信任方执行以确保后续证明安全的过程。\n³ `STARK` 可以防御量子算法，而已知的\
  \ `SNARK` 构造通常不能（除非有某些约束）。\n³ `STARK` 创建速度快一点，但验证速度慢一点。\n\n见*SNARK（简洁非交互式知识证明)*。\n\
  \n**122** SRP（安全远程密码）\n\n### 隐写术\n更多属于信号处理而非密码学的隐蔽通信技术。\n\n### 流密码\n一种加密类型，你可以将其看作是从密钥和（唯一的）随机数加密生成的的一次性密码。分组密码\
  \ `DES` 设计于 70 年代，时考虑了硬件实现；后来流密码 `RC4` 因其面向字节的机制而设计设计得对软件友好。然而在 90 年代，流密码通常被认为是*硬件密码*，通常基于具有最小外围反馈移位寄存器，如\
  \ `Grain` 或 `SNOW 3G`。相反，分组密码被认为是软件密码，正如 `AES` 竞赛在 2000 年的要求所明确的那样。确实，在*轻量级密码学*术语出现之前，就会发现流密码被受限的应用中。\n\
  \n\n\n\n\n今天，流密码已不再是一个小众市场，现代应用程序中使用的许多加密模式在技术上都是流密码，因为它们在 `CTR` 模式下运行。\n\n### 流密码模式\n\
  从历史上看，流密码有两种模式：\n\n- 同步（Synchronous），也称为自同步或密钥自动密钥 (`KAK`)。这是一种广为人知的模式，通过生成伪随机密钥流并与明文进行异或运算来实现。\n\
  - 自同步（Self-synchronizing），也称为自动或密文自动密钥 (`CTAK`)，其输出取决于消息的加密结果。\n\n### 置换扩散网络 (SPN)\n\
  用于分组密码和哈希函数的置换构造，其中每一轮包含两个层：\n\n- 置换（Substitution），通常通过 `S-boxes`，以非线性方式将数据块转换为其他数据块（即具有复杂的输入-输出关系）。这种强大但非常局部的变换有时被认为带来了`confusion`（混）。\n\
  \n置换扩散网络 (SPN) **123**\n\n- 扩散（Permutation），通常通过位洗牌或矩阵运算，以确保每个输出位最终都依赖于所有输入位。这种变换很弱，但基于分组的变换被认为提供了`diffusion`（扩散）。\n\
  \n在 SPN 中，这两层是互补的，这种职责分工通常简化了密码分析以及对某些攻击技术成功率边界的计算。`AES`、`Serpent` 和 `PRESENT` 都是\
  \ SPN 的示例。\n\n### Suck（糟糕）\n正如密码学家 Matthew Green 所定义：“在密码学中，`suck` 是一个纯技术术语，意味着`慢`、`复杂`且可能不安全`。”\n\
  \n### 甜菜拍卖\n多年来，这是多方计算 (`MPC`) 唯一已知的现实世界应用。2008 年丹麦在奥胡胡大学人员的支持下进行了甜菜拍卖。它们在论文《Secure\
  \ Multiparty Computation Goes Live》中得到了详细描述，并被许多其他论文引用作为 `MPC` 并非无用的证据。得益于区块链协议，现在有了更多的\
  \ `MPC` 应用。\n\n### Suite A\n美国国家安全局（NSA）的一系列机密加密算法和技术。\n\n`Suite A` 用于军事安全通信设备等。它不对公开放。请参阅\
  \ `NSA (National Security Agency)`。\n\n### 窥视 Suite A\n`Suite A` 似乎包含一些有趣的密码，例如：`BATON`，由\
  \ NSA 在 1995 年左右开发的分组密码。它具有 128 位的数据块长度和 320 位的密钥，其中 160 位是校验位（这意味着 `BATON` 的密钥只有\
  \ 160 位秘密位）。`BATON` 由 `PKCS#11` 加密接口标准支持；因此 `BATON` 的参数和支持的模式是公开的。这些模式包括一个未记录的 `SHUFFLE`\
  \ 模式以及一种密钥封装模式。`BATON` 是 NSA 最快的密码之一。\n\n#### **124** Suck（糟糕）\n- `SAVILLE`，由 NSA\
  \ 与英国 `GCHQ` 在 20 世纪 60 年代联合开发的流密码。它曾用于越南战争期间的加密设备。`SAVILLE` 基于非线性反馈移位寄存器，使用 128\
  \ 位密钥，最后 8 位是前 120 位的校验和。`SAVILLE` 具有可以在同步或自同步模式下的有趣特性。\n\n`Suite A` 还包含如 `ACCORDION`、`CRAYON`、`JUNIPER`\
  \ 和 `PHALANX` 等算法。\n\n### SUPERCOP\n加密操作与原语相关的统一性能评估系统。它是 `BATMAN` 和 `eBASH` 的继者。\n\
  \n## S\n`SUPERCOP` 通过尝试算法的许多不同实现来估计其最优速度。它还使用许多不同的编译器选项编译每个实现，然后多次运行编译后的程序以可靠地测量其执行时间。截至\
  \ 2020 年 5 月，`SUPERCOP` 已对超过 1000 种不同的算法、2800 多种实现以及多个编译器和编译器选项进行了测试。\n\n在 CPU 使用率方面，运行\
  \ `SUPERCOP` 之于密码实现者，就像比特币挖掘之于加密货币爱好者。\n\n### 超多项式复杂度\n根据 Cobham 定理（以及经验观察），这在实践上是不可能的复杂度。\n\
  \n### SVP (最短向量问题)\n基于格的密码学的主要计算问题。`SVP` 涉及寻找一组多维向量组合，其长度（相对于给定的范数）是最小的。\n\n由于误差学习\
  \ (`LWE`) 问题与 `SVP` 问题之间的关系，许多基于格的密码系统间接利用了类似于 `SVP` 问题（如 `GapSVP`）的最坏情况硬性。\n\n\
  ### 对称加密\n后量子密码学中最古老的形式。\n\n对称加密 **125**\n\n## T\n### TCC\n密码学理论会议（Theory of Cryptography\
  \ Conference）“专注于概念化、定义和解决自然密码学问题的范式、方法和技术。”\n\n`TCC` 确实涵盖了理论密码学——一个智力上有趣的课题，但实际相关性较低，例如涉及量子随机预言机等概念时——以及应用密码学的理论方面，后者的基本结果具有很高的实际价值。\n\
  \n研究人员提交了经过同行评审的研究论文，标题如“模糊海明距离与来自子集乘积问题的逻辑取或”以及“全同态 NIZK 和 NIWI 证明”。\n\n请参阅 `Asiacrypt`、`CHES`、`CRYPTO`、`Eurocrypt`、`FSE`、`PKC`、`Real\
  \ World Crypto`。\n\n### 测试向量\n遗憾的是，这通常是加密系统中发现的唯一测试。\n\n### Threefish\nBlowfish\
  \ 家族的第三成员，但与 `Blowfish` 和 `Twofish` 非常不同。它没有费斯特网络，没有 MDS 矩阵，没有 S 盒，只有受 `Cha` 启发的\
  \ ARX 结构，启发了 `SipHash`。\n\n### 阈值加密\n严格来说，不存在。但阈值解密存在。它是指解密密钥在 `N` 个方之间进行阈值共享，其中\
  \ `t ≤ N` 方必须协作才能解密。\n\n### 阈值秘密共享\n或简称秘密共享。一种机制将秘密分成 `N` 份，使得需要 `t ≤ N` 份才能恢复，而少于\
  \ `t` 份不会泄露秘密信息。基于多项式插值的 Shamir 方法是实现秘密共享的标准方法。\n\n#### **126** TCC\n验证秘密共享 (`VSS`)\
  \ 是一种变体，参与方可以通过加密验证是否恢复了正确的秘密，以及每个参与方是否提供了正确的份额。\n\n### 阈值签名\n一种签名方案，其中签名能力（即密钥）分布在\
  \ `N` 个潜在签名者中，签名需要至少 `t ≤ N` 个不同签名者的签名。它被著名用于某些交易所冷钱包系统中的加密货币托管。\n\n### Time AI™\n\
  密码学界的 Fyre 节事件。\n\n### 时间锁加密\n一种加密时间胶囊。时间锁加密试图在特定日期之前即使有解密密钥也无法解密，直到该日期算法允许非交互式解密。与许多密码学功能一样，在合理的假设下，你可以使用可信执行环境来实现。也可以通过利用所谓的计算参考时（例如从区块链获取）来创建时间锁密文。\n\
  \n### 时间锁谜题\n*定时发布密码*的第一个实例。它在 1996 年被定义为一种“向未来发送信息”的方法，通过创建一个创建者已知其解，但其他人需要大量计算才能恢复的问题来实现。它后来启发了时间锁加密。\n\
  \n请参阅 *顺序工作证明*、*可验证延迟函数 (VDF)*。\n\n### 时间锁谜题的失败\n\n\n\n\n1999 年，时间锁谜题论文的作者提出了一个实际挑战，并做出了以下预测：\n\
  \n“我们估计解决该谜题需要连续计算 35 年，且每年都要更换为当时可用最快的计算机模型。”\n\n### 时间锁谜题 127\n\n2019 年，人们证明了使用桌面级\
  \ `CPU` 或 `FPGA`（在这种情况下仅需两个月的计算时间）解决这一挑战其实比想象中要容易得多。\n\n尽管这是一个有趣的思想实验，且在实际应用中的意义微乎其微（至少在“时间旅行”方面），但最初的论文建议需要数月或数年的计算时间。\n\
  \n### 计时攻击 (Timing attack)\n\n一种利用时间差异来发现秘密，更广义地说是破坏加密系统安全的攻击。有时，算法的运行时间取决于秘密输入的值，这可能会触发诸如\
  \ `if–then` 模式或其他可变时间的操作。例如，某些处理器的算术单元如果一个输入值为零，则会在较少的周期内执行乘法指令。计时攻击的教科书级示例是针对平方幂幂（或倍增加乘法），其中私有指数（或标量）是逐位扫描的。\n\
  \n攻击者还可以利用计时泄露来识别加密操作的结果（例如填充验证），或者在不返回详细错误代码时识别发生的错误类型（如针对 Manger 攻击的缓解措施）。\n\n\
  ### TLS（传输层安全）\n\n一种在 `TCP` 上（以及通过 `DTLS` 在 `UDP` 上）建立安全通道的协议。在 `TLS 1.3` 之前，`TLS`\
  \ 使用了 `PKI`、`X.509` 证书以及大量的加密套件。\n\n参见 `SSL`、`Heartbleed`。\n\n### 行业关注点\n\n2016\
  \ 年 9 月，在 `TLS 1.3` 开发期间，一家金融服务机构的代表向负责 `TLS` 的 `IETF` 工作组发送了一封邮件，邮件主题为*行业界对 TLS\
  \ 1.3 的关注*。\n\n该邮件请求 `TLS 1.3` 考虑整合允许*监控员工通信*（如某些监管框架的要求）的功能，或者在某些情况下截获加密通信的能力。\n\
  \n### 128 计时攻击\n\n工作组主席 `Kenny Paterson` 回复道：*你好，Andrew,*\n\n*我对你请求的观点：不行。*\n\n\
  *理由：我们试图构建一个更安全的互联网。元层面的评论：*\n\n*你来得有点晚了。打个比方，我们正处于清理烟灰和寻找还没喝光的啤酒罐的阶段。*\n\n*更准确地说，我们正处于第\
  \ 15 版草稿，而 `RSA` 密钥传输在大约十个草稿前就从规范中消失了。我知道银行业通常反应比较慢，但这实在太过分了。*\n\n*祝好，Kenny*\n\n\
  ### Tor\n\n## T\n\n在所有加密应用中，`Tor` 的现实世界影响力与学术贡献及兴趣之间的比例是最高的之一。\n\n`Tor` 匿名网络（也称为*洋葱路由*）如果使用得当，可以提供不可追溯性保证。那些对这些特性至关重要的人（犯罪分子和执法人员，以及一些记者和政治活动人士）使用\
  \ `Tor` 来延长寿命。你也可以使用 `Tor` 来绕过网络限制（如政府审查）并减轻追踪。\n\n### 可微调块加密器 (Tweakable block\
  \ cipher)\n\n一种通过接受额外的参数（称为*微调*）的块加密器，以确保在不同微调下产生不同的输出。与密钥不同，微调并不一定是保密的，且更改频率比密钥更高。更改微调值应该只会产生微乎其微的性能影响，与更改密钥不同，后者通常涉及昂贵的密钥调度操作。可微调块加密器已用于磁盘加密，以及某些需要额外输入的奇特专有结构。\n\
  \n\n\n\n引用自 Twofish 论文，Twofish 的成名之处包括性能：\n- 在 Pentium Pro 上，经过 12,700 个时钟周期的密钥设置，每块数据加密\
  \ 285 个时钟周期\n- 在 Pentium Pro 上，经过 1,250 个时钟周期的密钥设置，每块数据加密 860 个时钟周期\n\n以及密码分析工作：\n\
  \n*最后，我们对 Twofish 进行了密码分析。我们分析、分析、再分析，一直持续到提交截止日的早上。我们仍在进行密码分析；永不停止。*\n\n## U\n\n\
  ### 不可否签名 (Undeniable signature)\n一种没有签名者配合就无法验证的签名，无论该签名是否有效。验证者不应能够在不与签名者交互的情况下判断签名有效，签名者也不应说服证明者有效签名是无效的，反之亦然。\n\
  \n参见 `不可见签名（Invisible signature）`。\n\n### 通用组合性 (Universal composability)\n一种用于分析组合加密组件安全性的理论框架，因为组合两个安全协议并不会自动导致一个安全协议。它很少应用于实际用例。\n\
  \n### 通用哈希函数 (Universal hash function)\n密码学中的哈希函数，与密码哈希函数不同。与通用密码哈希不同，通用哈希函数由密钥参数化。因此，它实际上是一个族，类似于伪随机函数。\n\
  \n#### 132 不可否签名\n但与伪随机函数不同，通用哈希函数在密码学意义上并非伪随机，仅在统计学意义上如此：不存在两个输入值 `M1` 和 `M2` 使得\
  \ `Hash(M1) = Hash(M2)` 的概率异常高。\n\n然而，这种属性不应被误认为是抗碰撞性。对于通用哈希函数，碰撞通常很容易找到。\n\n###\
  \ 可更新加密 (Updatable encryption)\n一种可以直接将一个密文转换为另一个密文的加密方案，后者只能用新的、不同的密钥解密。更新加密的目标是在不可信系统上执行密钥轮换，作为简单的“解密-加密”方法的替代方案。\n\
  \n## V\n\n### 可验证延迟函数 (Verifiable delay function, VDF)\n一种其计算无法通过额外的并行或存储加速的函数；因此，它必须顺序计算，类似于顺序工作证明。但与后者不同，VDF\
  \ 仅接受一个解。\n\n参见 `顺序工作证明（Proof of sequential work）`，`时间锁谜（Time-lock puzzle）`。\n\n\
  ### 可验证随机函数 (Verifiable random function, VRF)\n伪随机函数的公钥对应物，可以通过验证与函数输出一起生成的正确性证明，验证输出是否已正确计算。\n\
  \nVRF 听起来类似于公钥签名，但在两个方面不同：VRF 的结果始终是确定性的（例如，消息可以接受许多有效的 ECDSA 签名），而且 VRF 可以生成一个结果和一个证明（该证明可能是随机的）。\n\
  \nVRF 已用于构建（理论版本的）彩票系统和交易托管方案，并被多个区块链平台使用。\n\n#### 可验证随机函数 (VRF) 133\n#### 可验证不可预测函数\
  \ (Verifiable unpredictable function, VUF) 一种以某种方式介于签名和 VRF 之间的特殊函数：VUF 类似于 VRF\
  \ 但但不是伪随机的，仅是不可预测的。但与签名不同，给定的消息必须只有一个有效输出。因此，VUF 方案可以被视为唯一的签名。\n\n参见 `可验证随机函数（VRF）`。\n\
  \n### 维吉尼亚密码 (Vigenère cipher)\n一种比凯撒密码更安全的密码。\n\n### VSH (Very Smooth Hash)\n具有可证明抗碰撞性的哈希函数，基于整数分解的困难性。但\
  \ VSH 的二阶原像抗性没有那么强的安全保证。\n\n## W\n\n### 钱包 (Wallet)\n在加密货币中，由个人或组织管理的一组账户。每个账户由一个用于签名的私钥和一个从公钥推导出的地址组成。通常，这些账户通过一个或多个种子，使用\
  \ `BIP32` 或类似的分级派生进行层次化组织。这非常方便，因为你只需要存储单个密钥即可管理几乎无限数量的账户。\n\n扩展来说，钱包是指任何实现了账户管理功能的应用程序或设备。硬件钱包提供了最好的安全感，有时它们确实更安全。\n\
  \n尽管如此，对于最常见的风险——缺乏可靠的备份，它们提供的保护作用并不比软件钱包更好。\n\n### 水印 (Watermarking)\n在某些模拟信息（如图像、视频或声音）中嵌入一个值的做法，通常在数字编码期间进行，使得该值无法被提取或移除。在最健壮的形式下，它还能抵抗噪声、转码和数字-模拟-数字转换。\n\
  \n### 白盒密码学 (White-box cryptography)\n算法层面的混淆。换句话说，一种实现例如 `AES` 的方法，使得针对给定密钥的实现不会泄露密钥。这听起来像魔法，而且像魔法一样，它实际上并不存在，尽管高级技术给了人们它存在的错觉。大多数白盒技术确实已被破解，至少在理论上是如此。但在实践中，由于辅助了软件层防御（如软件混淆、防篡改、防调试、设备绑定等），它们有助于使逆向工程变得更加困难。\n\
  \n从根本上说，白盒密码学是将对称密码转换为非对称密码。如果这可行，就意味着我们可以从对称原语创建公钥加密（尽管我们可以从哈希函数构造公钥签名）。\n\n###\
  \ Winternitz 签名\n一种基于哈希的签名的扩展，可以哈希大于 1 的的值。例如，为了处理 4 位消息 `W` 在 0 到 15 之间，你会发布 `Hash16(K)`\
  \ 作为公钥，然后通过计算 `HashM(K)` 来签名消息 `M`，其中 `M` 是哈希迭代次数。这比 Lamport 的二进制方案更好，但仍然无法扩展——想象一下签名\
  \ 64 位值所需的工作。\n\n### WireGuard\n一种用于点点安全通道的网络层协议，源于一个内核根内核项目。WireGuard 设计用于 SSH\
  \ 类用途和 VPN 功能。根据创建者的话，WireGuard 是“密码学倾向的”，这意味着它由单一算法套组成，以及极少的密码行政工作。\n\n注意的是，它排除了证书，因此不需要解析\
  \ `ASN.1` 或 `X.509`。与许多项目不同，WireGuard 将精力专注于加密实现质量，代码库比替代方案小得多。\n\n#### WireGuard\
  \ 135\n最初受到密码学知识界的怀疑，WireGuard 的成功和安全记录现在说明了一切。\n\n## X\n\n### X25519\n基于 `Curve25519`\
  \ 的 Diffie–Hellman。\n\n参见 `Curve25519`。\n\n### X3DH\n扩展三重 Diffie–Hellman，一种因在 Signal\
  \ 协议中使用而流行的 Diffie–Hellman 变体。X3DH 结合多个密钥对来计算一个共享密钥，而不是像基础 Diffie–Hellman 那样每个参与者只用一对密钥。\n\
  \n#### X3DH 如何工作\n在最简单的设置中，Alice 和 Bob 之间的 X3DH 操作如下。\n\n首先，它结合他们的长期身份密钥 `IA` 和\
  \ `IB` 以及它们的临时一次密钥 `EA` 和 `EB`，通过以下方式计算共享密钥 `SK`，其中 `DH()` 是 Diffie–Hellman 操作：\n\
  \n```\nDH1 = DH(IA, EB)\nDH2 = DH(EA, IB)\nDH3 = DH(EA, EB)\nSK = KDF(DH1, DH2,\
  \ DH3)\n```\n\n\n\n\n\n在这里，`KDF()` 是一个密钥衍生函数。Alice 使用她的私钥和 Bob 的公钥计算这些操作，而 Bob 则反相反。\n\
  \n在实践中，如果 Alice 发起协议，她会选择一个随机临时密钥，并从消息服务器获取一个 Bob 的预计算临时密钥，这些密钥被称为预签名（pre-keys）。`X3DH`\
  \ 设计用于异步通信；它试图以一种最小化计算和信任假设的方式来满足若干安全需求。\n\n### 136 X25519\n\n### `XMSS (eXtended\
  \ Merkle Signature Scheme)`\n一种仅使用哈希函数和树形结构的公钥签名方案。`XMSS` 的状态性——或者说在签名操作期间跟踪计数器的义务——被认为是一个巨大的致命缺陷。尽管如此，`XMSS`\
  \ 已已成为 IETF 标准，并在 `OpenSSH` 中进行了实验性集成。\n\n参见 *PHINCS*。\n\n### `XOF (extendable output\
  \ function)`\n一种输出长度可变的哈希函数。该函数在需要时还可以扩展输出的长度。相比之下，在不可扩展的可变长度输出函数中，不同大小的输出值是完全不同的，较短的值不是较长值的前缀。\n\
  \n### `XOR`\n异或逻辑操作，写作 `⊕`。`XOR` 遵循以下规则：真异或假等于真；真异或真等于假；假异或假等于假。当被视为二进制运算符时，这些规则产生以下结果：`1\
  \ ⊕ 1 = 0`，`0 ⊕ 0 = 0`，`0 ⊕ 1 = 1`，`0 ⊕ 0 = 1`。\n\n扩展到位字符串，你会得到 `0111 ⊕ 1101 = 1010`\
  \ 等。\n\n### `XOR encryption`\n一种形式的加密形式，有时在恶意软件中用作混淆层。它与一次性密文类似，但异或后的值并不总是秘密，也不只使用一次。\n\
  \n### Z\n### Z\n\n### Zerocash\n于 `Zerocoin` 之后、`Zcash` 之前。\n\n### `ZKP (zero-knowledge\
  \ proof)` 一种协议，证明者说服验证者他们知道某个数学陈述（例如某个难题的解），而无需泄露该陈述。\n\n`ZKP (zero-knowledge proof)`\
  \ 137\n\n现在它是加密爱好者中的一个主流概念，`ZKPs` 曾是密码学与理论计算机科学交叉领域中的一个冷门领域。\n\n零知识是一门广阔且丰富的学科，从应用角度来看，可以说仍处于婴儿阶段。已经有一些\
  \ `ZKPs` 从会议论文进展到了现实世界：这些应用包括电子投票和区块链应用，其中非交互式 `ZKPs` 帮助保护交易隐私。`ZKPs` 也是门限签名方案的一部分，用于某些冷存储系统。\n\
  \n密码学零知识不应与安全工程中的零知识架构概念，或指代客户端加密的营销术语“零知识”混淆。\n\n参见 *NIZK (non-interactive zero-knowledge)*。\n\
  \n### `ZRTP`\n一种用于 `RTP` 连接的密钥协商程序，用于两个节点之间的 VoIP 连接。`ZRTP` 最初出现在 `Signal` 应用中以启用端到端加密通话，后来被丢弃，转而使用从文本消息会话状态派生的密钥，事实证明后者更简单更安全。`ZRTP`\
  \ 中的 `Z` 代表 Phil Zimmermann。\n\n### 138 ZRTP\n\n### 术语索引\n- 2013, 2\n- Axolotl,\
