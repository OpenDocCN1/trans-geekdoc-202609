  \n参见 `DVB-CSA.`\n\n### scrypt\n一种可配置时间内存使用的密码哈希函数，发音为 *ess-crypt*。`scrypt` 开创了内存困难型密码哈希，并启发了随后的设计以及密码哈希竞赛\
