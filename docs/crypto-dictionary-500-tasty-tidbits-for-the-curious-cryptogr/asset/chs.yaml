  \n### sci.crypt\n与 `sci.crypt.research` 一起，这是一个 Usenet 新组，Twitter 和 Slack 出现之前人们在那里讨论密码学。它因发布“你能破解我的加密吗，这里是密文”之类的帖子而闻名。\n\
