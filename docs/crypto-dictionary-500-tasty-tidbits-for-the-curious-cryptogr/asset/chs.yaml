  \ secrecy）的概念。\n\n参见 `Backward secrecy`。\n\n## 后量子密码学\n\n旨在不被量子算法破解的加密方案。因此，它们能够抵抗未来假设的量子计算机。也被称为量子安全和量子抗性加密。\n\
  \n后量子密码学 **93**\n\n### 深入研究后量子加密\n\n后量子密码学主要针对公钥方案（签名、加密、密钥协商）而非对称方案，因为后者大多数对量子攻击具有免疫力。例如，对称加密通过简单地加倍密钥长度即可阻止\
  \ `Grover’s algorithm` 带来的渐近二次加速，而超多项式级加速只会在特殊情况下发生。\n\n要成为后量子算法，算法不能依赖于因数分解或离散对数问题，这两者在受到\
  \ `Shor’s quantum algorithm` 攻击时都会崩溃。相反，它们可以依赖于 NP-hard 问题。大多数提出的后量子算法属于以下类别之一，取决于它们构建安全性时基于的计算问题：\n\
  \n*   基于码，依赖于纠错码的解码问题\n*   多元方程组\n*   基于格，具有诸如误差学习 (`LWE`) 等问题\n*   基于哈希，或使用密码哈希函数的哈希树结构\n\
  *   椭圆曲线同\n\n### 后量子 RSA\n\nRSA 的规模巨大到在实践中对量子攻击免疫，同时也无法进行实际应用。后量子 RSA 的公钥规模达到太字节级。后量子\
  \ RSA 已提交给 NIST 的后量子密码学标准化项目。\n\n## 预测抵抗\n\nNIST 特别使用的术语，指一种类似于向后秘密性的概念。预测抵抗是回溯抵抗（backtracking\
  \ resistance）的立面。\n\n参见 `Backward secrecy`。\n\n## 原像\n\n哈希函数中的在给定值 `H` 的情况下寻找某些\
  \ `M` 使得 `Hash(M)` = `H` 的问题。如果 `H` 是通过从足够大的有限可能消息集中随机选择某个 `M₀` 并计算 `H = Hash(M₀)`\
  \ 来得到的，那么即使拥有无限计算能力，**94** 后量子 RSA 攻击者也永远无法确定识别出 `M₀`，除非 `M₀` 是唯一哈希值为 `H` 的值。\n\n\
  但在实践中，我们处理的消息集比哈希值大得多；因此，任何 `H` 都有许多原像。此外，没有人实际上拥有无限的计算能力。寻找任何原像的 **P** 成本都是 $2^n$，这在实践中是不可能的，即使哈希值仅有\
  \ $n = 128$ 位。\n\n## PRESENT\n\nSerpent 的变位词。一种工作方式与 Serpent 非常相似（令人惊讶）但规模更小的分组密码。作为一种*超轻量级加密*，`PRESENT`\
  \ 具有与 `DES` 相同的 64 位块，并支持 80 位和 128 位密钥。根据对*破解*的某些非常学术的理解，`PRESENT` 被双双链密码分析破解破解，复杂度分别为\
  \ $2^{79.76}$。\n\n\n\n\n- Signal 应用的私有联系人发现技术，利用 `Intel SGX` 技术防止用户的联系人列表直接暴露给 Signal\
  \ 服务器，同时允许用户发现其联系人中有谁正在使用该应用。\n- 同态加密和可搜索加密，它们可以在加密数据上进行操作，从而保持其机密性。\n- Tor 的洋葱路由，防止任何主机知道消息的源地和目的地。\n\
  - 接触追踪协议，被用于识别 COVID-19 感染者，同时防止对用户活动、社交关系和地理位置的追踪。\n\n## 隐私信息检索 (PIR)\n\n与不经传输（oblivious\
  \ transfer）相似，不同之处在于检索量不受限制。PIR 和不经传输都试图向数据库主机隐藏客户端的活动，但 PIR 假设为“自服务”，而不经传输限制客户端只能进行“多选一”访问。\n\
  \n参见 `Oblivious transfer`。\n\n## . . . . . 的证明\n\n区块链交易的验证需要消耗或拥有某些资源。这防止了任意且高效地分叉为替代性历史，这将会导致双重花费和其他攻击。\n\
  \n### 隐私信息检索 (PIR) 97\n\n这种设计选择导致人们对工作证明（proof of work）产生了新的兴趣，我们可以将其追溯到至少 20 世纪\
  \ 90 年初的反垃圾防御，以及其他工作不仅是 CPU 使用的其他证明的创建。\n\n这些资源证明通常是为了区块链应用，但通常并非特定的区块链用例（与销毁证明不同）。\n\
  \n关于某些建议方法的清单——除了工作证明和权益证明主要且通用的概念外——参见 `Proof of burn`、`Proof of catalytic space`、`Proof\
  \ of human work`、`Proof of reserve`、`Proof of sequential work`、`Proof of space`、`Proof\
  \ of spacetime`、`Proof of storage`、`Proof of useful work`。\n\n### 销毁证明 (Proof of\
  \ burn)\n\n可能是为共识协议提出的最直接的资源使用证明类型。销毁证明包括使与协议相关的代币或其他数字资产价值失效，例如通过将其发送到某些不可花费的地址（区块链中的\
  \ `/dev/null`）。这与权益证明不同，在后者中拥有的价值并没有被销毁。\n\n### 催化空间证明 (Proof of catalytic space)\n\
  \n空间证明的一种变体，其中空间并没有被完全浪费，而是可以存储与证明无关的数据。这利用了催化空间计算的概念，即程序可以使用某些内存区域，即使该区域已用于存储数据，并在完成任务后返回该区域的原始状态。\n\
  \n### 人力证明 (Proof of human work)\n\n工作证明的一种，其工作不是计算密集型任务，而是对人类相对容易、但对计算机和 AI 程序很难的任务。这种想法建议依赖于使用混淆程序生成的\
  \ CAPTCHA，以防止生成 CAPTCHA 的机器解决掉它们。\n\n### 复制证明 (Proof of replication)\n\n存储证明的扩展，用于证明存储了某数据的多个副本，而不是单个真实副本及其指针。实现复制证明的一种技术涉及深度鲁棒图，这是图论中的一个概念，在内存困难型密码哈希的背景下被重新发现。\n\
  \n### 98 销毁证明\n\n### 储备金证明 (Proof of reserve)\n\n这不是与共识协议相关的资源证明，而是证明某个账户或组织拥有某些数量的币。储备金证明可以是公开验证的，例如通过从控制待验证资金的地址发布特殊交易。它也可以是私有的，和/或在私有账本上进行公证，例如通过签署审计师提供的带有时间戳的消息。\n\
  \n储备金证明可以被看作没有抽奖机制且未绑定到任何去中心化协议的权益证明。\n\n### 安全证明 (Proof of security)\n\n参见 `Security\
  \ proof`。\n\n### 顺序工作证明 (Proof of sequential work)\n\n一种并行化无效的工作证明，因为操作必须按顺序执行。与可并行的工作证明一样，谜题的解决方案必须能够被高效验证。\n\
  \n与可验证延迟函数 (`VDFs`) 一样，顺序工作证明可以用于在去中心化应用中添加不可压缩的延迟。\n\n它们还面临相同的技术挑战，即将一系列操作与实际时间延迟关联。与\
  \ VDF 不同，顺序工作证明不接受唯一的预计算解法，这限制了它的应用数量。\n\n参见 `Time-lock puzzle`、`Verifiable delay\
  \ function (VDF)`。\n\n### 空间证明 (Proof of space)\n\n证明证明者拥有一定数量的可用内存。例如，证明者可能必须分配\
  \ 1 TB 来说服验证者，而验证者不会接受任何分配少于 1 TB 的证明者的证明。与其使用工作证明浪费 CPU 时间，认为使用空间证明浪费内存更具环保。\n\n\
  ### 时空证明 (Proof of spacetime)\n\n存储证明的扩展，用于高效证明某条数据（或其多个副本）在给定的时间范围内一直被存储。时空证明可以通过结合复制证明来实现。Filecoin\
  \ 项目使用时空证明来确保因存储数据而奖励的主机没有作弊。\n\n### 时空证明 99\n\n### 权益证明 (Proof of stake)\n\n工作证明的环保对应方案，其中持有更多代币的矿工有更大的概率验证交易；他们通过抽奖机制获得奖励。因此，富人只需通过质押（staking），即运行节点并保持在线，就能变得更富有。\n\
  \n权益证明区块链通常需要特定的质押金额才能参与网络。\n\n### 存储证明 (Proof of storage)\n\n证明某些数据正在被存储（或至少已知，或可以生成）。可证明数据拥有和检索证明等概念都是存储证明的示例。最直接的证明系统是验证者发送某个挑战\
  \ `c`，证明者返回 `Hash(c||M*)`，其中 `M` 是要验证的数据。\n\n### 有用工作证明 (Proof of useful work)\n\
  \n当工作证明不是完全浪费时，计算时间被用于贡献解决某些计算问题。\n\n### 工作证明 (Proof of work)\n\n密码学对环境问题的贡献。\n\n\
  ### 可证明安全性 (Provable security)\n\n对于某些密码学家来说，这是唯一接受的安全——与不科学、风险不可接受的启发式安全性相比。\n\n\
  这种简单的目标现在已不再常见，可证明安全性现在被认为是一种额外的保险，而不是通过一切手段要求的。\n\n例如，诸如 `AES` 的算法并不是可证明安全的，而公钥方案（如\
  \ `RSA` 或 `ECDSA`）仅在底层计算问题困难时才被证明是安全的。\n\n### 可证明安全的 (Provably secure)\n\n“如果是可证明安全的，它可能就不安全，”引用密码学家\
  \ Lars Knudsen 的话（当时在块密码背景下）。这句俗语可能源于块密码 `COCONUT98`，它被证明对某类差分分析技术是安全的，但最终被一种未知的类型差分攻击（回旋攻击）破解了。\n\
  \n### 代理重加密 (Proxy re-encryption)\n\n一种公钥加密方案，其中发送给 Alice 的密文（创建 **\n\n\n\n\n（使用她的公钥）可以转换为针对\
  \ Bob 的密文而无需暴露明文——换句话说，无需解密再重新加密。例如，得益不可区分混淆（indistinguishability obfuscation），理论上可以实现代理重加密，即通过创建一个混淆程序，在不暴露明文的情况下解密并重新加密密文。\n\
  \n### 伪随机 (Pseudo-random)\n\n`pseudorandom` 的连字符写法。但在英语中，通过添加前缀创建复合词通常不使用连字符（例如\
  \ pseudoscience 伪科学，cryptocommunist 密码共产主义和 antisocial 反社交）。在 IACR ePrint 存档的研究论文中，`pseudorandom`\
  \ 的用法大约是 `pseudo-random` 的倍。\n\n### 伪随机函数 (PRF)\n\n并非单一函数，而是一个函数族；每个函数都由其密钥索引。`PRF`\
  \ 的安全目标是：如果你不知道密钥且只能看到输入-输出对（即使在选择输入值的情况下），它与真正的随机函数是不可区分的。\n\n你可以将 `PRFs` 作为安全的\
  \ `MACs`，但安全的 `MAC` 并不一定是安全的 `PRF`。\n\n### 伪随机数生成器 (PRNG)\n\n一种生成看似随机数据的系统，其安全保证是：已知输出位中任何子集的攻击者无法确定任何其他输出位。`PRNG`\
  \ 的理论定义与其口语化用法不同。\n\n在理论上，`PRNG` 是一种（确定性的）算法，它接受固定大小的值（`seed`）作为输入并返回更长的输出值。在实践中，`PRNG`\
  \ 通常指参与伪随机位生成的所有组件，例如在操作系统的 `PRNG` 语文中。此类 `PRNG` 通常包含以下组件：\n- 来自模拟源的熵收集器，例如用户活动、温度测量和片上传感器——这些有时被称为真随机生成器，尽管它们的（数字）输出很少被保证在密码学上是安全的，甚至不是均匀分布的。\n\
  - 一个存储内部状态的机制，例如 `entropy pools`（熵池），包括更新状态以及从熵收集器执行重种子（`reseeding`）操作的逻辑。\n- 一个确定性随机位生成器\
  \ (`DRBG`)），它根据源自内部状态的种子产生任意长度的输出。\n\n### 伪随机置换 (PRP)\n\n对于置换而言，相当于 `PRF` 之哈希函数。块密码就是\
  \ `PRP`。\n\n### 公钥加密\n\n排除对称加密之后的所有密码学。\n\n### PUF (物理不可克隆函数)\n\n半导体设备上的物理组件，利用每个不同平台之间的微小差异来生成不可预测的数值（如标识符）。尽管有时被宣传为半魔法技术，但许多\
  \ `PUFs` 已证明其密码学强度比声称的弱。\n\n### 穿刺加密 (Puncturable encryption)\n\n带有“穿刺”（puncture）操作的公钥加密。该操作创建一个新的私钥来替换当前密钥，从而永久撤销对之前密钥可以解密的某些密文的解密能力。其动机之一是为某些消息提供前向安全性，即使它们是用相同的公钥加密的。\n\
  \n你可以从穿刺式 `PRFs` 创建穿刺式对称加密。\n\n### 穿刺伪随机函数 (PPRF)\n\n类似于穿刺加密。`PRFs` 的密钥可以更新，以撤销处理某些值的能力。\n\
  \n### 量子计算机\n\n根据一些专家的说法，在 2026 年之前有 1/7 的概率破解 `RSA-2048`，在 2031 年之前有 1/2 的概率。事实上，没有人知道你一生中是否会看到量子计算机破解\
  \ `RSA-2048`。\n\n### 量子密码学\n\n依赖量子现象的加密操作，并不一定需要量子计算机，例如量子密钥交换。量子密码学恰好是后量子，但不属于后量子密码学领域。\n\
  \n### 量子加密\n\n对量子状态进行加密，相对于经典比特字符串的加密。\n\n量子加密的最基本形式是量子一次性密码（quantum one-time pad），它可以被看作是量子隐传和经典一次性密码的组合。\n\
  \n这种量子一次性密码对于哈希函数是安全的，因为它需要每个量子比特来传输加密状态。量子一次性密码看起来比其对应部分效率较低，因为它每个加密比特都需要两个比特的密钥（注：此处正文逻辑可能略显跳跃，已按字面翻译以保持语境）。但它更强大，因为可以用于构建多方计算方案。\n\
  \n### 量子密钥分发 (Quantum key distribution)\n\n有时与后量子密码学混淆，但其实际价值较低。最著名的方案是 `BB84` 密钥协议。\n\
  \n### 量子签名 (Quantum signature)\n\n一种不可能的方案，因为经典的签名概念不适用于量子状态。直观上，任何可以获取量子状态信息的方都可以修改它。更一般地说，除非量子状态经过加密，否则无法进行身份验证，这样只有预期的接收者可以解密它们。尽管量子签名是不可能的，但量子签名加密（signcryption）是可能的。\n\
  \n### QUIC (Quick UDP Internet Connections)\n\n一种传输安全协议，旨在使糟糕状况（丢包、IP 漫游等）下的 HTTPS\
  \ 连接更可靠，特别是通过运行在 UDP 而非 TCP。使用 UDP 避免了 TCP 握手的延迟代价。它还包含一种缓解 UDP 不可靠问题的机制。基于 QUIC\
  \ 的 HTTP 已由 IETF 标准化，并命名为 HTTP/3。\n\n### Rabin 加系统 (Rabin cryptystem)\n\n公指数为 2\
  \ 的 `RSA`。由于计算平方根被证明等同于因式分解，破解 Rabin 加密的难度等同于分解模数 `n = pq`。\n\n### 彩虹表 (Rainbow\
  \ tables)\n\n一种主要用于密码破解（如 Windows NTLM 密码）的时间内存权衡技术。彩虹表是一种特定的、优化的查找表，在离线阶段预计算，以显著加速密码破解（在线阶段）。彩虹表还成功用于破解短加密周期内（如\
  \ 10 秒）的电电视控制字。它们在瑞士设计并通常制造。\n\n### 随机比特 (Random bits)\n\n随机生成的比特。当我们谈论随机比特时，严格来说它们通常只是被伪随机生成的。\n\
  \n### 随机预机 (Random oracle)\n\n一种用于在理论上证明协议安全的抽象概念：你可以将随机预机想象为一个函数 `f()`，每当你发送一个输入\
  \ `x` 时，它都会选择一个随机值 `y` 并返回，同时记录 `f(x) = y`。这听起来类似于哈希函数的运行方式，但随机预机的假设与安全哈希函数的假设略有不同。假设哈希函数是随机预机会让编写安全证明变得更容易。但此类证明被认为可靠性较低，因为与安全的哈希函数不同，随机预机在实践中并不存在，但在实践中这并不担心。\n\
  \n### 随机性 (Randomness)\n\n密码学中最重要的东西。没有随机性，你就无法生成随机秘密值，因此没有秘密密钥，也就没有加密。即使你已经有了密钥，你需要随机性来实现最高的公钥加密安全级别（称为语义安全性，或\
  \ IND-CPA）。\n\n### 范围证明 (Range proof)\n\n\n\n\n在不泄露数字本身的情况下证明一个数字位于某个区间内（零知识部分）。某些加密货币使用范围证明（range\
  \ proofs）来隐藏传输的金额，例如为了确保协议执行的正确性。\n\n### RC4\n\nRivest's Cipher 4（RC4 算法），设计于 1987\
  \ 年。这是一种有一段坎坷历史的流密码：最初，它是 `RSA Security` 公司的私有算法，随后在 1994 年被逆向工程并发布。尽管其极其简单且缺乏学术同行评审的背书，但它出人意料地抵御了密码分析很久——直到它不再有效，并被发现是不安全的（因为其生成的第一个字节中存在统计学偏置）。尽管如此，它仍然比那个时代的大多数私有算法安全。`RC4`\
  \ 是第一个 Wi-Fi 加密方案 `WEP` 的基础，`WEP` 的破解部分是因为 `RC4` 的特性，但很大程度上是因为 `WEP` 的设计缺陷。`RC4`\
  \ 也用于 `TLS`，其统计学偏置可以被利用来解密使用许多不同密钥加密的数据。由于体积较小，`RC4` 也被用于恶意软件以混淆代码或加密发送到恶意软件服务器的数据。\n\
  \n### RC5\n\n这种密码与 `RC4` 的唯一共同点是设计师 `Ronald Rivest`；与 `RC4` 不同，`RC5` 不是流密码，而是块密码。`RC5`\n\
  \n#### RC5 105\n\n`RC5` 是少数使用数据依赖旋转的密码之一，这个想法起初听起来让密码变得更复杂。但事实证明它也有助于密码分析，因为攻击者可以因此控制旋转值。\n\
  \n### RC6\n\n与 `RC5` 类似。也是一种使用数据依赖旋转的块密码，并由 `RSA Security` 获得专利。同样由 `Ronald Rivest`（与其他其他人）设计，`RC6`\
  \ 是 `AES` 竞赛的候选算法之一。它没有被 `NIST` 选中 `AES`，但后来被用于一种据称由 `NSA` 设计的软件植入。\n\n### Real\
  \ world (现实世界)\n\n学术密码学中指代现实世界的术语，以于严谨分析加密方案安全性所需的安全性模型“理想 `world`”。如果现实世界中的攻击者比理想世界中的者弱，那么纸上的安全性证明就能保证现实安全性。\n\
  \n该术语通常是冗余表达的来源，例如：之前的 `works` 并没有说明代码应如何在现实 `world`、现实世界应用以及实际的现实世界协议中具体实例化。\n\n\
  ### Real World Crypto (RWC) (现实世界密码学大会)\n\n一个关注密码学当前现实应用的密码学会议，而非那些不太关注直接应用的研究型会议。它由来自学术界和工业界的参与者参加，是按人数计算规模最大的密码学会议。\n\
  \n`RWC` 交替在美国西岸、美国东岸、欧洲和亚洲地区举行。演讲者发表贡献性演讲（这些演讲并不一定源自正式的研究论文），标题如“Firefox 中的隐私保护遥测”和“莫斯科互联网投票系统中的弱点”等。\n\
  \n参见 `Asiacrypt`，`CHES`, `CRYPTO`, `Eurocrypt`, `FSE`, `PKC`, `TCC`。\n\n### Rectangle\
  \ attack (矩形攻击)\n\n回镖攻击（boomerang attack）的改进版，用于攻击块密码 `Serpent`。\n\n参见 `Boomerang\
  \ attack`（回镖攻击）。\n\n### 106 RC6\n\n### Related-key attack (相关密钥攻击)\n\n这种攻击对密码实例进行加密或解密查询，这些实例的密钥是原始密钥的修改版本，因此该修改（作为一个函数）是由攻击者选择的。例如，对块密码的相关密钥攻击可能会产生加密查询\
  \ `Enc(K ⊕ M, P)`，其中 `M` 是攻击者在不知道密钥的情况下定义的固定值。\n\n你只能对对称原语使用这种攻击模型，因为...\n\n###\
  \ Research papers (研究论文)\n\n学术密码学中指代现实世界的术语... (注：此处部分翻译对应原始文本重复内容，按要求翻译)\n\n研究论文\
  \ `RSA` 证明保证了现实安全性。\n\n\n\n\n来自 `Salsa20` 系列的唯一哈希函数。`Rumba20` 在关于广义生日问题的新结果背景下创建的。\n\
  \n## Rumba20 109\n\n## S\n### SAEP (Simplified OAEP)\n`OAEP` 的变体，略为简单，且实现了相同水平的选择性密文攻击安全性。\n\
  \n参见 `OAEP (Optimal Asymmetric Encryption Padding).`\n\n### Salsa20\n无疑是最具影响力的加密算法之一。它催生了流密码\
  \ `ChaCha20`（用于 TLS、`SSH` 以及许多其他地方）。这随后被重用在 `BLAKE2` 哈希函数中，它是 `Argon2` 密码哈希以及 `WireGuard`\
  \ 等协议的组件。\n\n更广泛地说，`Salsa20` 普及了简单、易于实现的加-旋转-异或（`ARX`）结构。几年前，NIST 标准化了一种更复杂的算法，理解它需要掌握多项式、矩阵求逆和有限域等概念知识。\n\
  \n`Salsa20` 中的 `20` 代表其轮数，这是最初由设计者选择的一个保守值，后来在某些应用中被简化，减少到 `12` 甚至 `8`。\n\n### 三明治攻击\
  \ (Sandwich attack)\n`回弹攻击` (boomerang attack) 的改进版，常用于分析分组密码。`三明治攻击`依赖于分为三个部分的区分器：“顶部是一个厚片（面包），中间是一个薄片（肉），底部是一个厚片（面包）。”它的发明是为了找到对分组密码\
  \ `KASUMI` 的首次实用攻击。\n\n参见 `Boomerang attack.`\n\n### S 盒 (S-box)\n分组密码中使用的查找表，用于实现具有可测量安全属性（如非线性或分支数）的非线性变换，尽管\
  \ S 盒并不一定以查找表的形式实现。在差分密码分析背景下，活跃 `S-box` 是指两个（不同）输入值产生不同的 S 盒输入值，从而产生不同输出的盒。\n\n\
  ## 110 SAEP (Simplified OAEP)\nS 盒通常是 4 位的（16 个值，如 `Serpent`）或 8 位（256 个值，如 `Rijndael/AES`）。\n\
