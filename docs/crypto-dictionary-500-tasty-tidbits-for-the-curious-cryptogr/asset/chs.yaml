  \ 202`）。\n\n### 侧信道\n\n除指定的输出值外获取加密操作信息的方法。\n\n### 侧信道攻击\n\n利用某些侧信道信息的攻击，可以是被动或主动、本地或远程、基于物理或逻辑属性。侧信道攻击并不一定需要物理访问被攻击的模块。\n\
  \n### 侧信道的种类\n\n以下侧信道攻击分类的不完全列表：\n- 执行时间取决于敏感数据时的计时攻击\n- 故障攻击，例如 CPU 超频、电压故障注入和激光故障注入\n\
  - 对物理现象的简单测量或差异分析：声波、电磁辐射和热量\n- 通过 `procfs`、`dmesg` 条目、竞态条件和各种 `ASLR` 泄漏导致的操作系统泄露\n\
  - 加密通信的流量分析\n- 微体系攻击，例如缓存攻击\n- 窥视和对用户动作的观察\n\n### Sigaba\n\n设计于 20 世纪 30 年代的美国版\
  \ Enigma。它从未被正式破解。\n\nSigaba 115\n\n### Signal 协议\n\n`X3DH` 会话初始化协议与双轮迭代状态更新及密钥更新协议的结合，如\
  \ `Signal` 应用所用。类似的协议也被集成到 `WhatsApp` 和 `Facebook Messenger` 中，重用了为 `Signal` 开发的库。`Signal`\
  \ 协议后的密码学研究和工程对安全即时应用产生了重大影响。\n\n参见 `Double ratchet`、`X3DH`。\n\n### 签名\n\n公钥签名或数字签名，但区别于电子签名、e-签名或电磁签名。它有时被“大不敬”地定义为`使用私钥加密`。\n\
  \n### 签名的安全目标是什么？\n\n一位天才计算机科学硕士生曾辩护过他的硕士论文项目（关于后量子密码学）。在答辩的问答环节，在回答关于他工作的问题后，他的密码学教授问他：“签名的安全目标是什么？”\n\
  \n该学生被这个看似简单的问题困扰了。\n\n签名在自适应选择消息攻击下应当是不可伪造的。如果攻击者可以请求合法签名者对其选择的任何消息进行签名，那么攻击者就不应该能够计算任何其他消息的签名。\n\
  \n因此，该学生无力地回答道：“自适应选择消息攻击下的存在不可伪造性。”\n\n教授说不，这并不是公钥签名的唯一目标，因为毕竟，`MACs` 也试图达到类似的目标。\n\
  \n教授预期的答案是`不可否认性`，即签名者不能声称签名是他人代表他们发出的，因为没有其他人知道私签名密钥。\n\n\n\n\n\n一套中国国家密码标准，包括中国某些产品强制使用的公开算法。\n\
  \n`SM` 族包含了椭圆曲线公钥加密（`SM2`）、哈希函数（`SM3`）、分组密码（`SM4`），以及基于身份的加密（`SM9`）。\n\n### 智能合约\n\
  运行在区块链平台上的程序。智能合约中的漏洞往往会导致灾难性的后果。\n\n### 蛇油（Snake-oil）\n布鲁斯·施奈尔（Bruce Schneier）在\
  \ 1999 年提出的蛇油警告信号在今天 `S` 依然适用：\n\n1. 伪数学的胡言乱语\n2. 新数学\n3. 专有加密\n4. 极度的无知\n5. 荒谬的密钥长度\n\
  6. 一次性密码\n7. 缺乏依据的陈声\n8. 安全证明\n9. 破解大赛\n\n### SNARK（简洁非交互式知识证明）\n一种强大且高效的知识证明类型。于\
  \ 2011 年的文章《从可提取碰撞抗性到简洁非交互式知识证明，及其反之》中引入。它是 `SNARG`（简洁非交互式证明）的变体，因为 `SNARK` 是“关于知识的\
  \ SNARG”。例如，`SNARK` 可用于（非交互式）计算委托，工作者使用 `SNARK` 来证明他们执行了正确的计算。\n\n当 `SNARK` 是零知识时，我们称之为\
  \ `zk-SNARK`，它被著名地用于 Zcash 区块链协议，通过证明代币已从发送者传输到接收者（而不泄露任何人的身份或传输金额）来实现交易匿名化。\n\n\
  `SNARK`（简洁非交互式知识证明）**119**\n\n后量子 `SNARKs` 已经存在，但效率低于前量子版本。\n\n### 剖析 SNARKS\n以下从末尾开始逐词解释\
  \ `SNARK`：一个`知识论`（`argument of knowledge`）对于一个实用的且安全的知识证明至关重要，而严格来说，`知识证明`（`proof\
  \ of knowledge`）留给对计算能力无限制攻击者保持安全的证明。在密码学应用背景下，所证明的“知识”可以是秘密值，也可以是必须保密的值之间的关系。\n\
  \n`非交互`（`Non-interactive`）仅意味着 `SNARK` 是从证明者到验证者的单条消息，而不是涉及多条消息的协议。\n\n`简洁`（`Succinct`）意味着消息的大小较小，即使证明涵盖了大量数据，而且它是可以高效验证的。\n\
  \n### SNIP（秘密共享非交互式证明）\n一种具有一个证明者和多个验证者的零知识协议，每个验证者都持有正确性证明的一份份额。每个验证者持有秘密值的一份份额；证明者向每个验证者发送不同的证明字符串，允许验证者协作，根据某些预定义的谓词检查秘密的有效性，而不会泄露关于该秘密的任何信息。`SNIPs`\
  \ 被引入作为构建保护隐私的聚合统计方案的工具。\n\n### SNOW 3G\n一种用于 3G、4G 和 5G 通信中加密语音通信的流密码。与其早期的前身 `A5/1`一样，`SNOW\
  \ 3G` 通过更新由反馈移位寄存器组成的状态来工作，使其易于实现且高效。与 `A5/1` 不同，`SNOW 3G` 是安全的。2020 年提出了一种用于 5G\
  \ 网络的新版本 `SNOW 3G` 即 `SNOW-V`，以便在软件中运行更快，因为 5G 比之前的标准更依赖软件和虚拟化环境。\n\n见*反馈移位寄存器*。\n\
  \n**120** `SNIP`（秘密共享非交互式证明）\n\n### 独行侠（Solitaire）\n布鲁斯·施奈尔为小说《加密狂》（*Cryptonomicon*）创建的一种流密码。\n\
  \n小说中的人物在不使用计算机的情况下使用它。正如施奈尔描述的：\n\n```\nSolitaire 的安全性来自于洗过的扑牌牌中固有的随机性。通过操纵这副牌牌，通信者可以创建一个随机字母字符串，然后将其与信息结合。当然，Solitaire\
  \ 可以在计算机上模拟，但它的设计是为了手动手工实现的。\n```\n\n`Solitaire` 在今天的学术标准下已被破解（它具有统计偏向），但对于纸笔密码来说相当安全，在正确使用时在实践中是安全的。\n\
  \n`S`\n见《加密狂》（*Cryptonomicon*）。\n\n### SPECK\n一种美国国家安全局（NSA）轻量级密码。\n\n见*SIMON*。\n\
  \n### SPEKE（简单密码指数密钥交换）\nPAKE 在 PAKEs 流行很久以前发明了（1996 年）。\n\n### SPHINCS\n一种基于哈希的签名方案，与\
