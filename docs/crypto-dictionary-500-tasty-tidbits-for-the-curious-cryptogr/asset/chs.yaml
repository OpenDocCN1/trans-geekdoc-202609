  \n### 盲签名 (Blind signature)\n\n一种签名者可以在不知道消息内容的情况下对消息签名的方案。\n\n### 块密码 (Block cipher)\n\
  \n一种使用密钥将固定大小的数据块转换为相同大小块的密码。\n\n### 感谢，区块链？(Thanks, blockchain?)\n\n如果说区块链彻底改变了什么，那可能是密码学的实践、资金和部署。得益于区块链，我们获得了丰富的：\n\
  \n*   创新的解决方案，这些方案的创建不是为了在同行评审会议上发表后被遗忘，而是大规模部署的实际，面临真实威胁和工程限制的挑战，而不仅仅是抽象模型。\n*\
  \   大量的资金，官僚主义和形式主义极少，绕过了传统的资助申请系统及其缺陷（速度慢、激励错位以及研究人员的工作负担）。\n*   充满激情的人们，其中有些人没有受过正式教育，更不用说博士学位，他们学习高级密码学概念并为新问题创建新解决方案，并在实施时不考虑学术奖励。\n\
  \n### 好莱坞的 Blowfish (Blowfish in Hollywood)\n\nBlowfish 密码曾出现在剧集《24 小时》中。\n\n以下是该剧本的片段：\n\
  \n```\nO'Brian 先生，不久前我们的一个探员与杰克·鲍尔联系。她发送了一个名字和地址，我们认为那是他的下一个目的地。\n不幸的是，它是用 Blowfish\
  \ 148 加密的，这里没有人知道如何破解它。因此，我们需要你的帮助，请看文件。\n你的信息在哪里？16 位还是 32 位字长？32 位。\n原始数据还是修改后的数据点？原始。\n\
  该算法的设计者在代码中留了一个后门。如果你知道覆盖代码，解密就是轻而易举。\n```\n\n\n\n\n当然，这段对话毫无意义，Blowfish（吹鱼算法）中并没有后门。\n\
  \nBlowfish 是一种真正的安全的块密码，尽管其块大小限制为 64 位的，但它是 `bcrypt` 密码哈希方案的核心算法。\n\n### BLS (Boneh-Lynn-Shacham)\
  \ 签名\n\n一种利用椭圆曲线对的签名方案，使得签名比 `ECDSA` 和 Schnorr 签名更短。原因是每个签名都由单个群元素组成。也就是说，对于与 512\
  \ 位 `ECDSA` 签名相似的安全水平，BLS 签名的长度仅为 `256` 位。\n\nBLS 签名具有支持聚合的有用属性，可以将多个公钥和签名合并为单个公钥和单个签名，并高效地进行批量验证。\n\
  \n#### BLS (Boneh-Lynn-Shacham) 签名 17\n\n结合分布式密钥生成，你可以使用 BLS 签名构建阈值签名方案，这在加密货币应用中分发交易签名被证明是很有用的。\n\
  \n### Bob\n\n颠覆性股票经纪，Alice 的同谋者。\n\n参见 *Alice*。\n\n### 布尔函数\n\n一种参数为二进值（即 `0` 或\
  \ `1`）并返回单个 `0` 或 `1` 位的函数。例如，`f(a, b, c) = a + b + ac + bc + 1`，其中 `a`、`b` 和 `c`\
  \ 是二进值，就是一个布尔函数。在这里，加号的行为类似于异或（XOR）（因为布尔函数中只有 `0` 和 `1`），`ab` 表示 `a` 乘以 `b`，这等同于逻辑与操作（当且仅当\
  \ `a = b = 1` 时结果为 `1`）。\n\n#### 为什么密码学家关注布尔函数\n\n布尔函数看起来很愚蠢，直到你注意到你可以仅用布尔函数来描述任何操作——例如哈希函数。\n\
  \n例如，哈希函数输出中的每个位都是输入位的一个布尔函数。这类函数只存在于数学的以太中；它们在绝大多数时间时候都不是显式的。计算它们的多项式形式在实践中是不可能的，更不用说实现和计算它们了。\n\
  \n尽管如此，关于布尔函数及其安全特性的研究论文数不胜数：原因是当你将加密哈希或块密码分解成部分（意味着轮及其子组件）时，你会遇到尺寸更易于管理的布尔函数——\n\
  \n例如，与将 4 位块映射到 4 位块的 S 盒 相关的布尔函数。理解布尔函数及其属性（如非线性和代数免疫力）已被证明对于设计安全密码和破解弱密码至关重要。\n\
  \n### 回旋镖攻击 (Boomerang attack)\n\n一种差分分析技术，你首先将一对具有给定差异的明文*投入*密码中。然后你获得 Bob 两个密文，并在这些两个密文中设置另一个差异以获得两个新的密文。最后，你通过解密这些密文来*捕捉*明文。回旋镖攻击本质上是一种利用仅覆盖密码部分的差分特性的技巧。\n\
  \n### B\n\n### BQP (有界误差量子多项式时间)\n\n量子算法（因此是假设的量子计算机）能够高效解决的问题类。BQP 包含经典计算机可以高效解决的问题，也包含今天计算机无法解决的问题。后者是存在超多项式量子加速的问题。\n\
  \n#### 隐藏子群问题\n\n从密码学的角度来看，BQP 问题中最著名的问题被称为*隐藏子群问题* (`HSP`）。特别是，密码学家关注其在交换（或阿贝尔）有限群上的版本。如果对于阿贝尔群的\
  \ HSP 是易的，我们就可以解决以下问题：³ 给定 `N = pq` 找到 `p` 和 `q` ³ 给定 `x`、`p` 和 `xe mod p` 找到 `e`。你认识这些问题——因数分解和离散对数。\n\
  \n### 辫群加密 (Braid group cryptography)\n\n尝试使用非交换群元素构建新型公钥加密。这类加密系统可以被视为具有固定数量股线的辫，且群操作是高效的。作为一种副作用，辫群加密被预期能够抵抗量子算法。\n\
  \n### Brainpool 曲线\n\n由德国联邦信息安全局**（*Bundesamt für Sicherheit der Informationstechnik*,\
  \ 或 BSI）设计的椭圆曲线。Brainpool 曲线具有某些安全属性，但与其他标准相比，它们提供了 512 位的（而不是 521 位的）。\n\n####\
  \ Brainpool 曲线 19\n\n### 破解 (Break-in recovery)\n\n一种类似于后向安全的概念。该术语源于 Signal 协议。\n\
  \n参见 *后向安全*。\n\n### 广播加密 (Broadcast encryption)\n\n一种加密类型，其中相同的密文广播给一组接收者，只有授权的接收者可以解密，并且可以撤销使其不再解密。广播加密的挑战在于防止接收者共谋以及最小化密文和密钥的长度。\n\
  \n#### 广播加密的应用\n\n尽管广播加密受付费电视内容保护，但它从未被部署：主要原因是密文或密钥过长，以及不适用于接收者的安全模型。\n\n但广播加密已用于蓝光光\
  \ AACS 内容保护方案。然而，它在防止盗版方面效果有限，因为内容密钥（受广播加密保护）可以从播放器中提取。\n\n### 暴力攻击 (Brute-force\
  \ attack)\n\n一种通过连续尝试所有可能的值来恢复密钥的攻击类型。你可以对大多数密码发起暴力攻击。但只要密钥足够长，攻击永远不会结束（除非你运气好到极），因为有太多的值需要尝试。\n\
  \n### 弹证明 (Bulletproof)\n\n一种作为加密货币高效范围证明的零知识证明。弹证明的主要优点是它们不需要受信设置。具体来说，它们不需要初始化\
  \ 20 参数，或*游戏规则*，这些规则必须被信任才能确保协议安全。弹证明在 Monero 中被应用。\n\n参见 *范围证明*。\n\n### 拜庭容错 (Byzantine\
  \ fault tolerance)\n\n一个通用术语，涵盖了一类不直接依赖挖掘和某种证明的共识协议。pBFT（及其变体）和 C Tendermint 是此类协议；它们通过让固定数量的主机共同工作来可靠地维护共同状态，同时在主机之间分配信任。\n\
  \n## C\n\n### CAESAR\n\n认证加密竞赛：安全性、适用性和鲁棒性，这是一场在 2014 年到 2019 年进行的非 NIST 密码学竞赛。CAESAR\
  \ 由 NIST 部分资助但不受其监管，它为多种用例识别了新的认证加密密码，包括*轻量级应用（资源受限环境）*、*高性能应用*和*深度防御*。\n\n####\
  \ CAESAR 针对 AEAD 的深度防御\n\n在 CAESAR 竞赛定义的三个用例中，深度防御对读者来说可能是最不直观的。它在密码学工程方面也是最有趣的，因为它被定义为解决以下需求：\n\
  \n³ 尽管密文重复也能保持真实性\n\n³ 密文重复导致的隐私损害有限\n\n\n\n\n\n³ 尽管发布了未经证的明文仍具有真实性\n\n³ 发布未经证的明文造成的隐私损害有限\
  \ ³ 在更多场景下具有鲁棒性，例如海量数据 CAESAR **21**\n\n## 凯撒加密 (Caesar’s cipher)\n\n一种古老的加密方法，通过将每个字母移动三个位置来加密信息，因此\
  \ `ABC` 变成 `EFG`，`CAESAR` 变成 `FDHVDU`，以此此类推。不用说，凯撒加密并不安全。\n\n## CAVP (密码学算法验证计划)\n\
  \nNIST 用于评估算法的实现是否符合该算法标准规范的过程。在 `FIPS 140-2` 认证背景下，通过 `CMVP` 进行加密模块验证的前决条件。`CAVP`\
  \ 本质上是检查测试向量，而 `CMVP` 则涵盖了其他的 `FIPS 140-2` 评估标准。\n\n参见 `CMVP (加密模块验证计划)`，`FIPS 140-2`。\n\
  \n## CBC (密码块链接模式)\n\n块密码的一种工作模式，与区块链无关。`CBC` 通过计算 `Ci = Enc( K, Pi ⊕ Ci–1)` 将一系列数据块\
  \ `Pi` 加密为密文块 `Ci`，其中 `i = 1, . . . , n.`。初始值 `(IV)` 为 `C 0`，它应该是不可预测的以保证语义安全。`CBC`\
  \ 有一个很有用的特性，即解密是可以并行的（而加密则不是）。遗憾的是，`CBC` 容易受到填充 Oracle 攻击（padding oracle attacks）。\n\
  \n## CECPQ (结合椭圆曲线与后量子算法)\n\n一种包含椭圆曲线和后量子算法的混合密钥交换方案。`CECPQ` 由 Google 开发，旨在保护 `TLS`\
  \ 连接免受量子计算风险的威胁。\n\n第一个版本 `CECPQ1` 将 `X25519` 与基于格的方案 `NewHope` 结合，并于 2016 年在 `Chrome\
  \ Canary` 浏览器中部署了几个月。2019 年发布的 `CECPQ2` 将 `NewHope` 替换为基于 `NTRU` 的方案 `HRSS`，而变体\
  \ `CECPQ2b` 使用了基于同源的方案 `SIKE`。\n\n## 细胞自动机 (Cellular automata)\n\n在密码学中毫无用处。它是许多劣质论文的来源。\n\
  \n## 仪式 (Ceremony)\n\n在在此期间生成重要的密钥、秘密或敏感参数。仪式包括程序性和技术上的安全控制，以确保密钥的密钥生成和备份 **22**\
  \ 凯撒加密\n\n以及其涉及的软件、硬件、流程和人员的安全性。这不仅仅是选择一个可以接受的 `PRNG`，那实际上是最容易的一部分。例如，一个仪式涉及具有明确定义角色的参与者（如审计员和操作员）、预定义的操作序列（称为脚本或故事书）以及详细纪要的编写。\n\
  \n仪式通常用于在金融 **C**\n\n机构中生成证书机构的根密钥或区块链钱包的主密钥（种子）。它们随后被称为 `密钥仪式` (key ceremonies)。当仪式目的是生成零知识证明系统的参数时，也可以称为\
  \ `信任设置` (trusted setups)。\n\n## 证书 (Certificate)\n\n许多麻烦的根源，包括编码格式、解析漏洞、未更新的到期证书、断裂的链、不可信的机构、自签名、撤销列表等。但它通常是我们能提供的最不差的解决方案。\n\
  \n## 证书机构 (CA)\n\n公钥基础设施中受信任的第三方，能够发布证书的实体。\n\n## 证书透明度 (CT)\n\nGoogle 的一项倡议，通过创建证书公开日志来降低恶意或受损\
  \ CA 带来的风险，使其更容易知道证书是否已经发布。\n\n## ChaCha20\n\n`Salsa20` 的变体，目前是最常用的加密算法之一。\n\n##\
  \ CHACHA20：诞生论坛\n\n`ChaCha20` 最初在 `eSTREAM` 项目的论坛上提出：\n\n*我有一个改进 Salsa20 的想法。这篇短文事实证明比\
  \ Salsa20 快一点，得益于对 SIMD 指令的更好利用。*\n\n## CHES (密码学硬件与嵌入系统)\n\n所有 `IACR` 会议中最具*现实意义*的会议。它每年在不同的地点举行。研究人员展示经过评审的论文，标题诸如“使用拦截器从电子设备中勒索电磁信息”和“发出噪音：释放卷积神经网络用于剖面侧道分析的力量”。\n\
  \n## CIA\n\n信息安全的三大原则：机密性、完整性和可用性。密码学者的版本将*可用性*替换为*真实性*。\n\n## 密文窃取 (Ciphertext\
  \ stealing)\n\n一种使用 `CBC` 模式块密码进行加密的技术，使得密文长度与明文相同。它不像 `PKCS#7` 填充那样用固定值填充最后一个明文块，而是附加之前数据块的密文字节以获得一个完整的块。它剥离上述之前加密块的这些字节以保留原始消息的大小。这种技巧仅在消息\
  \ **24** CHES (密码学硬件与嵌入系统)\n\n大于一个块时才有效。它由 `NIST` 在三个不同的版本（`CS1`、`CS2` 和 `CS3`）标准化，但在实践中很少使用，因为大多数情况下较小的开销是可以接受的。\n\
  \n## Clipper \n\n一个针对复杂问题提出的简单解决方案：Clipper 芯片旨在允许美国公民和企业进行加密通信，同时允许授权方（即 **C**\n\
  \n政府和执法部门）进行完全拦截。Clipper 芯片由 `NSA` 在 20 世纪 90 年代初提出，是密钥托管架构的一部分，每个芯片的秘密密钥也将与美国联邦机构共享。除了其存在疑的安全架构外，Clipper\
  \ 芯片在技术执行上糟糕，并包含许多安全漏洞，这帮助其反对者停止了该项目。\n\n## CMVP (加密模块验证计划)\n\nNIST 用于验证提交 `FIPS\
  \ 140-2` 认证的加密模块的过程。为了在 `CMVP` 中接受评估，加密组件必须实现至少一种 `NIST` 标准算法。\n\n\n\n\n\n依赖于信息量不足的线性码解码困难性的后量子方案。许多基于码的方案是\
  \ 1978 年 McEliece 构建的变体，其公钥描述了一个随机线性码。加密过程包括对消息进行编码的同时向码字中添加一些错误。由于存在陷门（trapdoor），可以将码字转换为另一种可以解码的代码，因此解密是可能的。\n\
  \n2017 年向 NIST 后量子竞赛提交的 `Classic McEliece` 与 McEliece 在 1978 年的方案几乎相同。\n\n### 承诺（Commitment）\n\
  \n也称为比特承诺（bit commitment），这是一种协议，其中证明者临时隐藏一个不可更改的消息。证明者通过发布一个不泄露所承诺的值（这种特征被称为 `hiding\
  \ property`）来实现这一点，并且必须防止证明者在承诺 `25` 时泄露与承诺值不同的值（称为 `binding` 属性）。`bit commitment`\
  \ 一词最初是指仅承诺一个比特的硬币抛掷协议。但它现在被用于任何大小的值。安全领域人士神秘神秘地发布在 Twitter 上的哈希值，以便他们声称先发现了某些 0-day\
  \ 漏洞，这些都是基础承诺。\n\n### 并发零知识（Concurrent zero-knowledge）\n\n在并发环境下安全的零知识证明，即当攻击者可以观察并破坏多个独立的证明协议执行时的证明。\n\
  \n### 共识协议（Consensus protocol）\n\n分布式计算领域的一个旧概念，由于其在区块链系统中的作用而再次变得酷起来。\n\n### 控制字（Control\
  \ word）\n\n用于加密付费电视系统中音频和视频内容的密钥。在旧留系统中，该密钥长度为 48 位；在较旧的系统中为 64 位；在最新一代中为 128 位。虽然\
  \ 48 位看起来短得离谱，但如果每 5 或 10 秒更换一次密钥，它就足够了。\n\n### COPACOBANA（成本优化并行密码破解器）\n\n一种基于\
  \ FPGA 的 DES 破解器的学术概念证明。COPACOBANA 创建于大约 2007 年，能够以一种成本效益的方式在一周内破解 56 位 DES 密钥。\n\
  \n### 集体权威（Cothorority / collective authority）\n\n一种创建去中心化协议的框架，其中操作涉及多个方，使得没有一个人的权威高于其他人。\n\
  \n你可以使用 cothorities 执行操作，例如阈值签名、共识或分布式公共随机数生成。尽管它听起来很有区块链味，但很少有区块链使用 cothorities。\n\
  \n### 密码学分析（Cryptanalysis）\n\n分析加密算法以破解它们——即违反其安全假设——或为了理解它们为何无法被破解的实践。\n\n### 26\
  \ 并发零知识\n\n### 隐世生物（Cryptids）\n\n像大脚怪、独角兽、克拉肯怪物或蒙古死亡蠕虫之类的动物。就像优秀的加密软件一样稀有。\n\n###\
  \ Crypto\n\n密码学（cryptography）以及有时指加密货币（cryptocurrency）的缩写。在后者意义上的使用往往会引起正统密码学家的反感，他们打着\
  \ `C` 的旗号，响应“crypto 是为了密码学”的号。\n\n### CRYPTO\n\n自 1981 年以来每年夏天在加利福尼亚州圣巴巴芭拉举行的顶级学术密码学会议。研究人员展示经过同行评审的论文，标题如“无多线性映射的\
  \ iO：通过低阶弱伪随机生成器和安全增强的新范式”以及“无种子的水果是……”\n\n### Crypto AG\n\n一家以在 1970 年和 1994 年存在后门而闻名的瑞士公司。Crypto\
  \ AG 的故事非常迷人，从瑞典发明家 Hagelin 在 1952 年创立它，到其最近与 CIA 的关系。\n\n### 史上最强大的后门\n\n一家以在 1970\
  \ 年和 1994 年存在后门而闻名的瑞士公司。Crypto AG 的故事非常迷人，从瑞典发明家 Hagelin 在 1952 年创立它，到其最近与 CIA 的关系。\n\
  \n### Crypto AG\n\n一家以在 1970 年和 1994 年存在后门而闻名的瑞士公司。Crypto AG 的故事非常迷人，从瑞典发明家 Hagelin\
  \ 在 1952 年创立它，到其最近与 CIA 的关系。\n\n### 密码学（Cryptography）\n\n`crypto` 与 `cryptography`\
  \ 之间的关系。\n\n### 密码学（Cryptonomicon）\n\n一部 1000 页的小说，每隔一页就会提到密码学。它由 Neal Stephenson\
  \ 编写，并于 1999 年出版。尽管标题可能暗示的那样，但它并不非常克苏鲁风。与其他书中加密内容大多为虚构且荒谬现实不同，*Cryptonomicon* 依赖于历史事实和真实的加密技术。读者可能记得\
  \ Solitaire（由 Bruce Schneier 为书中创建）和范艾克频率干扰（van Eck freaking）。\n\n### 加密周期（Crypto\
  \ period）\n\n某些管理系统（如 EKMS）中密钥的寿命。在付费电视系统中，加密周期是同一个控制字（即秘密密钥）用于加密音频和视频内容的时间。\n\n\
  ### 加密变量（Crypto variable）\n\nNSA 中加密密钥的原始名称。在 NSA 局长决定使用该词之前一直在使用。\n\n### 加密大战（Crypto\
  \ wars）\n\n一个具有对抗性的术语，指的是美国政府（以及其他西方国家的政府）与活动人士（包括研究人员和隐私倡导者）之间的公开分歧和辩论。政府想要更多的控制和监控能力，通常通过专有算法、出口管制条例、密钥托管机制等；而后者则主张支持开发和使用任何加密机制以维护隐私权利。\n\
  \n### 生物悬浮（Cryptobiosis）\n\n与密码学无关，但同样迷人：这是某些生物在应对不利条件时可以进入的一种近死亡状态。当危险过去，这些生物可以回到原始的代谢状态。有时被用作强加密比喻的水熊，可以进入生物悬浮状态。\n\
  \n### 28 加密周期\n\n### 加密货币（Cryptocurrency）\n\n参见 *Crypto*。\n\n### 密文（Crypto-Gram）\n\
  \n由 Bruce Schneier 自 1998 年起出版的月度密码学摘要。\n\n## C\n\n### 密码学（Cryptography）\n\n参见 *Cryptology*。\n\
  \n***密码学（Cryptologia）***\n\n可能是关于密码学最古老的学术期刊；自 1977 年以来出版。\n\n### 密码学体系（Cryptology）\n\
  \n参见 *Cryptography*。\n\n\n\n\n\n《密码史密》（Cryptonomicon）*也是现实书籍中的一本虚构书籍：*他们拥有足够的知识，换句话说，他们理解《密码史密》极其重要，并且他们有智慧采取必要措施确保其安全。其中一些人实际上经常会咨询它，并利用其智慧破解日本人的电报，甚至破解整个加密系统。*\n\
  \n《密码史密》**29**\n\n（. . .）\n\n《密码史密》指出，zeta 函数在今天仍被用作序列生成器用于密码学中。\n\n## 隐睾丸症 (Cryptorchidism)\n\
  \n一种最好保持保密的状况。\n\n## 密码病毒学 (Cryptovirology)\n\n由 2004 年的书籍《恶意加密学：揭秘密码病毒学》（Malicious\
  \ Cryptography: Exposing Cryptovirology）普及。该书将密码病毒学描述为“密码学的黑暗面——为了击败木洛马、病毒、密码盗取和其他网络犯罪而开发的设备（……）将设计用于保护数据的方法本身转化为颠覆数据手段的艺术。”\n\
  \n参见*窃密密码学（Kleptography）。\n\n## CRYPTREC\n\n日本政府负责制定官方密码建议的密码研究与评估委员会。\n\n### CRYPTREC\
  \ 推荐算法\n\n截至 2020 年，CRYPTREC 的最高层级是其*电子政府推荐算法*列表，其中包括常见的公钥方案、`AES` 及其常用模式，以及 `SHA-2`\
  \ 哈希函数。除了 `AES` 之外，它还推荐了块密码 `Camellia` 以及流密码 `Kipher-2`。\n\n中间层，或*候选推荐算法*列表，显著包括五种块密码\
  \ `CIPHERUNICORN`、`CLEFIA`、`Hierocrypt`、`MISTY1` 和 `SC2000`。它还包括 `SHA-3` 哈希函数和 `XOFs`，以及\
  \ `ChaCha20-Poly1305` 认证加密。\n\n低层，即*监控算法列表*，是对你应该避免使用的算法的委婉说法，包含了常见的“嫌对象”：`SHA-1`\
  \ 和 `3DES`（但不包括 `MD5`），以及 `RIPEMD160`。\n\n## CSIDH（同源超奇异同映射迪菲-海尔曼）读音为 *seaside*，是最古老的基于同源的方案，为了效率被重新审。尽管存在众知的亚指数级量子攻击，它也是唯一吸引了大约\
  \ **30** 个隐睾丸症关注的后量子方案。用密码分析学家的话，建议的参数“提供的量子安全性相对较低”；然而，支持者指出它在后量子领域的独特应用，例如静态密钥交换。\n\
  \n它与 `SIDH` 不同。\n\n参见*迪菲-海尔曼（Diffie–Hellman）*，*后量子密码学*。\n\n## C\n\n## CTF (夺旗赛)\n\
  \n信息安全社区的一项热门竞赛。在过去的 15 年里，CTF 中提出的密码挑战已经从维吉尼亚密码和视觉谜题，演变为涉及最前沿研究的任务。例如，2020 年 PlaidCTF\
  \ 的参赛者必须破解一种基于同源的加密系统（`SIDH`）并求解一个多元方程组。\n\n## 立方体攻击 (Cube attack)\n\n一种高阶差分密码分析技术，于\
  \ 2008 年描述。\n\n#### 立方体攻击何时有效\n\n在任何加密函数中，`cube` 指的是 3D 维度。\n\n\n\n\n\n一种基于词列表猜测密码的攻击。密码的熵值较低，因为它们通常由字典单词和常见的专有名词组成。攻击者可以构建一个按流行程度排序的候选密码列表，并一个接一个或并行尝试这些密码，以找到与从某些密码哈希数据库获得的哈希值匹配的密码。\n\
  \n## 差分密码分析\n\n一类密码分析技术，它通过研究差异在内部计算过程中的传播，来利用输出中的某些模式或统计偏差。针对对称加密算法（分组密码、哈希函数等）的大多数攻击都是某种类型的差分密码分析。\n\
  \n所利用的差异可以是两个输入值之间的，也可以是两个以上输入值之间的，例如高阶密码分析及其变体（积分密码分析、立方体攻击等）。另一种相关技术线性密码分析看起来略有不同，但最终与差分密码分析有关。此外，线性攻击通常意味着纯差分攻击的可能性。\n\
  \n## 迪菲-赫尔曼\n\n“在密码学领域的许多人对实际应用问题没有深入关注。他们正试图发现足够聪明到可以写论文的东西。”——怀特菲德·迪菲（Whitfield\
  \ Diffie）\n\n大多数密钥协商协议背后的一种相当简单的数学技巧，并间接支持了许多更多的加密系统。\n\n你经常会发现安全证明依赖于迪菲-赫尔曼问题的困难性（给定\
  \ `ga` 和 `gb`，找到 `gab`）或其变体。\n\n判定迪菲-赫尔曼问题（DDH）被密码学家丹·博内赫（Dan Boneh）称为“金矿”，并被用于构建加密方案（如\
  \ Cramer–Shoup 构造）以及复杂的协议（如阈值签名方案）。\n\n参见 *密码学新方向 (New Directions in Cryptography)*。\n\
  \n## 披露\n\n当漏洞被赋予一个巧妙的缩写，并配有一个精美的网站（包括问答和 Logo）时，这种方法更为有效。\n\n研究人员首次通过这种方法向世界介绍了\
  \ Heartbleed 漏洞；随后他们利用这种方法描述了后续针对 SSL/TLS 的攻击。这让他们能够更好地交流新漏洞（并减少了回复记者邮件的时间）。著名的例子包括：\n\
  \n- `BREACH`：通过超文本自适应压缩进行的浏览器侦察与数据外泄\n- `CRIME`：简单的压缩率信息泄露\n- `DROWN`：使用过时且弱化的加密解密\
  \ RSA\n- `POODLE`：降级旧版加密上的填充 Oracle 攻击\n- `ROBOT`：Bleichenbacher Oracle 威胁的回归\n\n\
  ## 离散对数问题\n\n在 `y = xd mod p` 中寻找 `d`（对于质数 `p`），或在椭圆曲线群中寻找 `dG = P` 中的 `d` 问题。离散对数问题现在是密码学中最重要的计算问题，仅次于因子分解，因为类似于迪菲-赫尔曼的协议已比\
  \ RSA 和 Paillier 加密系统更常见。\n\n## 区分器\n\n一种用于针对方案不可区分性攻击的算法。\n\n例如，如果你在伪随机数生成器的输出中发现统计偏差，那么该偏差将充当\
  \ `distinguisher`，从而破坏 PRNG。\n\n参见 *不可区分性 (Indistinguishability)*。\n\n## 分布式随机性\n\
  \n由一组并不一定相互信任的参与生成的随机性；因此，他们不希望任何一方能够影响结果。在这种背景下，一种简单的协议（如对每个参与者的随机贡献进行 `XOR` 运算）是不安全的。原因是最后一个贡献者可以将其值设置为某个值，当该值与之前所有值的组合进行\
  \ `XOR` 时，会产生他们希望返回的结果。提前发布承诺（commitments）部分解决了这个问题。\n\n## Dolev–Yao 模型\n\n用于定义密码协议的第一个正式模型。也是一种用于描述和分析其安全性的符号框架。\n\
  \n密码学家在指代主动攻击者对抗模型（即 active attacker adversarial model）时，有时会提到 Dolev–Yao 模型——即在该模型中，攻击者可以窃听、拦截和修改传输的数据。\n\
  \n但 Dolev–Yao 模型不仅于此：它是一个用于描述和分析协议安全性的通用符号框架。\n\n## 双棘轮\n\nSignal 消息协议的一个子协议。它确定每条消息的唯一密钥，使得已知某时刻消息密钥的攻击者既无法确定过去或未来的消息密钥，从而提供了前向安全性某种形式的后向安全性。\n\
  \n参见 *Signal 协议 (Signal protocol)*。\n\n## 单棘轮，双棘轮\n\n双棘轮是一种高度状态化的协议。它被称为“双”是因为它结合了两种技术：\n\
  \n- 对称密钥棘轮 (`symmetric-key ratchet`)：维护一个从派生消息密钥的哈希链。\n- 迪菲-赫尔曼棘轮 (`Diffie–Hellman\
  \ ratchet`)：使用临时密钥对执行迪菲-赫尔曼密钥交换，以使未来的状态不可预测。\n\n### 龙鳞 (Dragonfly)\n\n为 Wi-Fi 安全套件\
  \ WPA3 中的认证标准 EAP-pwd 定义 PAKE。攻击者可以通过利用哈希曲线（hash-to-curve）操作中的计时侧信道来绕过 Dragonfly\
  \ 的实现。\n\n参见 *PAKE (密码认证密钥协商)*。\n\n## DRBG (确定性随机位生成器)\n\n一个听起来像矛盾的术语，指一个在给定情况下确定性地生成长随机位字符串的组件（称为\
  \ `seed`、`key` 或有时称为 `entropy`）。操作系统的随机生成器通常包含一个熵提取机制，从模拟源生成这些不可预测位并推入熵池。\n\nDRBG\
  \ 与 PRNG 不同；`PBG` 和 `DRNG` 术语很少使用。\n\n参见 *伪随机生成器 (PRNG)*。\n\n## DSA (数字签名算法)\n\n\
  由 NSA 设计并专利的公钥签名方案。\n\n它在 1991 年作为 `DSS`（数字签名标准）的一部分被标准化。这一选择引起了一些批评，NIST 在《联邦计算机周刊》杂志上回应：“NIST\
  \ 做出了最终决定。我们获得了 NSA 的技术协助，也收到了其他意见，但 [NIST] 做出了最终决定。”\n\n当时对 `DSA` 的批评在于其效率、不完整（未指定哈希函数）、专利侵权风险以及安全性。\n\
  \n参见 *数字签名标准 (DSS)*。\n\n## DSS (数字签名标准)\n\nNIST 关于数字签名的标准；并非单一算法。\n\n1982 年，NIST（当时称为\
  \ NBS）发布了“公钥加密算法征集”。NIST 后来对分组密码和哈希函数发布了类似的征集，产生了 AES 和 SHA-3 标准。1987 年，NIST 在请求下取消了\
  \ DSS 项目。标准化工作随后重启，导致在 1991 年建立了多项标准，包括 NSA 设计的 `DSA`。\n\n`DSS` 也是三甲基丙烷磺钠化学化合物的缩写，它与密码学有某种联系。\n\
  \n## DVB-CSA\n\n常用扰乱算法（Common Scrambling Algorithm）：一种由数字节目联盟标准化的算法，用于保护电视系统中的视频内容，通常通过加密\
  \ MPEG 传输流包。\n\n参见 *控制字 (Control word)*。\n\n### DVB-CSA 版本\n\nDVB-CSA 标准的第一版本称为\
  \ `CSA1`，结合了流密码和分组密码，并具有 48 位密钥。`CSA2` 类似，但具有 64 位的密钥。如果你认为这些密钥长度太短，请记住，对于大多数直播内容，密钥通常每\
  \ 5 或 10 秒更改一次。\n\n\n\n\nCSA3 非常非常不同。尽管它的完整设计尚未公开，但众周知它将 `AES` 与另一种（专利）运行在某些异常操作模式下的分组密码算法结合。此外，它还包含了用于防止软件仿真的组件。根据其设计，`CSA3`\
  \ 应该仅运行在专用硬件电路中，例如位于机顶盒系统级芯片中的电路。\n\n### E\n\n### E0\n用于蓝牙的流加密算法。在理论上可以破解，但在实践中尚未破解。较新的蓝牙低功耗（Bluetooth\
  \ Low Energy）标准已用 `AES-CCM` 代替。\n\n## ECB (电子密码本)\n使用分组密码最直观的方法，每个数据块都与其他块独立进行处理。`ECB`\
  \ 是抵抗重复初始化向量（IV）和随机数（nonces）最稳健的模式。但大家都知道 ECB 是不安全的，因为你可以看到（企鹅。\n\n## ECC\n根据上下文，它是椭圆曲线密码学（elliptic-curve\
  \ cryptography）或纠错码的缩写；两者之间的混淆会导致不幸的后果。\n参见 *Elliptic-curve cryptography*。\n\n###\
  \ 38 DVB-CSA\n\n### ECDLP (椭圆曲线离散对数问题)\n可以说是密码学安全领域最重要的计算问题：给定点 `P` 和 `xP`，找到数字\
  \ `x`，其中乘法运算发生在有限域上的椭圆曲线群上。\n椭圆曲线方案已经取代了许多 `RSA` 或经典的 Diffie–Hellman 算法实例，例如在 `TLS\
  \ 1.3` 标准中。\n\n### ECDSA (椭圆曲线数字签名算法)\n`DSA` 的椭圆曲线对应版本，其安全性依赖于 `ECDLP` 的困难性，但并非完全等同。据我们所知，`ECDLP`\
  \ 的困难性仅在通用群模型下意味着 `ECDSA` 的安全性（不可伪造性），该模型是 `ECDSA` 的一种抽象，但并不完全等于 `ECDSA`。\n参见 *DSA\
  \ (Digital Signature Algorithm)*。\n\n### PLAYSTATION 3 中的 ECDSA\n许多人是在攻击者发现 PlayStation\
  \ 3 使用了 `ECDSA` 的弱实现版本后，首次了解到该算法。该实现中的随机数（nonce——一个本应对每个签名都是唯一的参数，通常通过随机选择选取）保持不变，导致攻击者能够轻易获取私钥。\n\
  （剧透：密钥为 `46 DC EA D3 17 FE 45 D8 09 23 EB 97 E4 95 64 10 D4 CD B2 C2`。）\n错过 PS3\
  \ 破解事件的人后来后来发现 `ECDSA` 是比特币和以太坊的签名算法，在这些系统中，`ECDSA` 密钥有时也会因为缺陷钱包软件中重复或偏斜的随机而被破解。\n\
  \n### ECIES (椭圆曲线集成加密方案)\n`IES` 公钥加密方案的椭圆曲线版本。像 `IES` 一样，`ECIES` 是混合加密方案，因此它需要对称加密来实际加密消息。\n\
  参见 *IES (Integrated Encryption Scheme)*。\nECIES (Elliptic-curve IES) 39\n\n### Ed25519\n\
  使用 `Curve25519` 的 Edwards 表示法进行 `EdDSA` 签名，而不是 `X25519` 使用的蒙哥利格式，这给开发者带来了很多麻烦。\n\
  参见 *Curve25519*，*EdDSA*。\n\n### EdDSA\n基于 Schnorr 方案的确定性椭圆曲线签名方案。它是 `ECDSA` 标准的主要替代方案。在最纯的形式下，它对非抗碰撞哈希函数具有免疫力，并被\
  \ `Ed25519` 应用使用。\n\n## EKMS (电子密钥管理系统)\n由美国安全局（NSA）设计的传统密钥管理系统，用于保护美国陆和其他和其他通信安全。\n\
  \n## 过多的密钥\n如果你认为 Web 应用程序的密钥管理很难，等你必须在一个具有不同分类级别、网络、设备类型、数据管理策略和员工培训的环境中执行它。\n\
  以下（不完全的）`EKMS` 密钥缩写列表说明了在其目标环境中管理密钥复杂性：\n- `AEK`: 算法加密密钥\n- `KEK`: 密钥加密密钥\n- `KPK`:\
  \ 密钥产生密钥\n- `OWK`: 传输密钥\n- `TEK`: 流量加密密钥\n- `TrKEK`: 传输密钥加密密钥\n- `TSK`: 传输安全密钥\n\
  系统根据密钥的角色（业务、维护或测试）对其进行分类。业务密钥又具有多种不同的属性：它们可以是应急备用密钥、联合剧院密钥或联盟密钥等。\n\n### 40 Ed25519\n\
  \n### 电子密码本\n在古老的 NSA 术语中指加密器。例如：“电子密码本，如高级加密标准，既被广泛使用，又难以通过密码分析法进行攻击。”\n\n### ElGamal\n\
  多年来，它是 `RSA` 之外加密课程中唯一使用和教授的公钥加密方案。它引入于 1985 年的文章《基于离散对数的公钥密码系统和签名方案》，该文章谦虚地以以下摘要开头：\n\
  提出了一种新的签名方案以及 Diffie–Hellman 密钥分发方案的实现，实现了公钥加密系统。这两个系统的安全性都依赖于在有限域上计算离散对数的困难性。\n\
  `ECDSA` 最终盖过了该签名方案，目前 ElGamal 加密很少被使用。相反，密码学家使用 `ECIES`，除非是在消息必须直接进行公钥加密的应用（例如某些电子投票系统）。\n\
  指数变体 `ElGamal` 加密有两个有趣的属性：它是加法同态的，且除非解出离散对数，否则解密是不可能的。尽管有后者的缺陷，这种版本在门限签名方案中证明是有用的。\n\
  \n### Elligator\n一种将椭圆曲线点编码为看似随机字符串的方法，以使公钥与加密数据区分开。\n\n### 椭圆曲线\n不是省略，不是直线。平面上\
  \ (x, y) 坐标满足曲线方程的点集，方程通常为 `y² = x³ + ax + b`，其中 `a` 和 `b` 是固定参数。密码应用仅适用于某些有限域上的点；因此曲线具有有限的点集。\n\
  \n## 从数学到密码学\n椭圆曲线在密码学出现之前就被发现了，数学家早已开始研究了它们。例如，椭圆曲线在费马大定理的证明中发挥了作用。\n密码学利用了这样一个事实：椭圆曲线点相对于几何定义的群运算（表示为点加）形成了一个群结构。对于良好的曲线类型，离散对数问题在这些群中变得困难，这就是为什么这些曲线在公钥密码学中非常有用。\n\
  \n### 椭圆曲线密码学\n依赖椭圆曲线及相关困难问题（离散对数或其变体）的公钥密码学。椭圆曲线密码学可以完成传统公钥密码学可以做的大部分事情，而且通常更快且使用的密钥更短。这包括加密、密钥交换和签名。此外，由于其对对的支持，你可以将其用于更奇特的密码方案。\n\
  参见 *基于对的密码学*。\n\n### 加密过程\n加密的同义词，强调在加密过程中执行的行为和操作。encipher（如法语动词 *chiffrer*）源于阿拉伯语\
  \ رفص (*sifr*，数字 0），而 encrypt（如动词 *crypter*）源于希腊语 *kryptos*（隐藏的，秘密的）。\n\n### 端到端加密\
  \ (E2EE)\n当只有指定的接收者可以解密消息时，加密被称为端到端加密。这听起来很简单，但实际上是一项艰巨的工程问题。\n\n\n\n\n正如加密学中的常一样，这类系统的困难部分在于密钥管理和分发，而不是实际加密，这就是为什么许多端到端加密（E2EE）系统需要中央服务器的原因。许多\
  \ E2EE 系统还依赖于“信任但验证”机制，只有当参与者执行某些手动验证（例如检查对话指纹）时，它们才算是真正的端到端加密。\n\n## 42 圆曲线密码学\n\
  \n此外，E2EE 系统有时最终依赖于中央 `CA` 来启用可信的 `TLS` 连接（你可以简单地将其视为传输层上的端到端加密，而不是应用层）。\n\n###\
  \ Enigma\n\n纳粹在第二次世界大战期间使用的机电加密机。Enigma 曾由波兰和英国的密码分析学家（包括阿伦·图灵）进行分析，他们使用的技术后来被人员重新发现并命名为差分分析、相关密钥攻击和侧信道攻击。\n\
  \n### 熵\n\n由鲁道夫·克劳修斯（Rudolf Clausius）于 1865 年左右引入的概念，他被认为是现代热力学的 `E` 创始人。但在他首次形式化热力学第二定律（该定律规定，在微观层面，封闭系统的熵不能减少）三年后，它才被命名为熵。克劳德·香农（Claude\
  \ Shannon）的信息熵概念出现得得多，出现在他著名的 1948 年论文中。加密学通过量化不确定性的程度来使用信息熵评估加密系统的安全性。\n\n### 信息熵\n\
  \n熵是概率分布的属性，而不是该分布中某个特定值的属性。这就是为什么询问某个看似随机的值的熵是没有意义的，除非你知道该值是如何被选择的以及来自哪种分布。\n\n\
  在信息论语境下，香农对某个随机变量 `X` 的熵定义为：\n\n```\nH(X) = −P log P\nn\n2 n\nΣ n\n```\n\n在有限的可观测集\
  \ `n` 上，其中 `Pn` 是事件 `n` 的概率。\n\n对于连续随机变量，我们可以熵的定义扩展为：\n\n```\n−P(x) log P(x) dx\n\
  ∫ 2 S\n```\n\n### 熵 43\n\n其中 `P(x)` 是变量的密度函数，`S` 是随机变量的支持集。\n\n当一个对称密码具有 `n` 位密钥时，如果通过密钥生成使得所有\
  \ `n` 位的值都是有效且等概率的，那么一个随机密钥的熵值即为 `n`。\n\n在公钥方案中，私钥的熵很少等于其编码的位长度，因为该长度的所有值并不都是有效密钥。\n\
  \n### ePrint\n\n正式名称为密码学电子打印存档（Cryptology ePrint Archive），地址为 `https://eprint.iacr.org/`。这是一个加密学研究人员可以在正式的、双盲同行评审发表之前在网上发布论文，并确保会被关注的网站。大多数加密学研究人员每周至少检查一次\
  \ ePrint 上发布的新论文。\n\n### 埃拉斯托尼筛\n\n一种列举直到某个上限之前的所有质数的方法；这是一种具有 2000 年历史的算法，通常在高中教学。它在\
  \ 2019 年的黑帽大会上被重新发现。\n\n### eSTREAM\n\n一项密码学竞赛，由欧盟资助的 ECRYPT 项目在 2004 年至 2008 年间组织，正式身份为一个\
  \ `project`。在提交的 34 密码中，有 8 个进入了最终组合，其中包括两个类别：软件（具有 128 位密钥的）和硬件（具有 80 位密钥的）。到为止，eSTREAM\
  \ 最成功的设计是 `Salsa20`，这种密码后来演变为 `ChaCha20`，后者成为了 `BLAKE` 系列哈希函数家族的核心。组合中的其他密码，`Trivium`\
  \ 和 `Grain`（或其变体）用于小众应用，而 `F-FCSR` 被破解了。\n\n参见 `Grain`、`Salsa20`、`Trivium`。\n\n\
  ### 以太坊\n\n一个用于去中心化应用（如代币）的重要区块链平台。以太坊引发了一些有趣的密码学研究和开放性问题，这些基于其独特的去中心化部署、对抗模型和图灵完备功能所面临的新挑战。例如，考虑以下内容，所有这些\
  \ ePrint 都承认比又一个新块密码要令人兴奋：权益证明安全性、智能合约形式验证、原子交换和分片。\n\n### Eurocrypt\n\n欧洲最大的学术密码学会议，自\
  \ 1987 年以来每年春春天在欧洲不同的地点举行。研究人员展示经过同行评审的研究论文，标题如“无多线性映射的不可区分混淆：引导和实例化的新方法”以及“一种用于主动量子对抗者隐私增强的抗量子不可变提取器”。\n\
  \n参见 `Asiacrypt`、`CHES`、`CRYPTO`、`FSE`、`PKC`、`Real World Crypto`、`TCC`。\n\n### Eve\n\
  \nAlice 和 Bob 的宿敌。\n\n## F\n\n参见 `Alice`、`Bob`。\n\n### 电子投票\n\n密码学家喜欢发表论文的话题，但不希望它在现实中部署，因为它被认为风险高不可接受。\n\
  \n尽管如此，电子投票在密码学上是非常迷人的。它涉及非平凡的加密技术，例如用于加密选票并以保护隐私的方式进行聚合的同态加密方案，以及用于证明选票正确性的非交互零知识证明。\n\
  \n### F / 因数分解问题\n\n给定 `n = pq`，找到质数 `p` 和 `q`。如果你有一个足够大的量子计算机，很容易解决。因数分解 45\n\n\
  ### 反馈移位寄存器\n\n一组值（通常是位或字节），通过移位来更新，并在空位处填充某些函数的结果。历史上，这种加密机制出现在机电机器之后。它现在仍用于面向硬件的算法和移动通信标准\
  \ SNOW3G。\n\n有两种反馈移位寄存器。在线性的（LFSR）中，这种更新函数是线性的，使得输出是预测的，但可以保证 LFSR 的周期是最大的。在非性的（NFSR）中，经过几次循环，输出值是初始状态的高度非线性函数，但周期的计算很困难。线性更新函数只执行加法，而非线性的执行乘法。\n\
  \n良好的设计策略是结合 LFSR 和 NFSR。\n\n参见 `Grain`、`SNOW3G`、`Trivium`。\n\n### Feistel 网络\n\n\
  一种利用较小的密码或哈希函数构造分组密码的方法。它通过将消息块分成两部分 `L` 和 `R`，并反复替换 (L, R) 为 (R, L ⊕ f(R)),其中 f()\
  \ 是较小的函数并可以接受秘密值作为参数。Feistel 网络有时被称为 Luby–Rackoff 构造，以形式分析其安全性的研究人员命名。XOR 操作可以被其他群运算替换。\n\
  \n参见 `DES (Data Encryption Standard)`、`Lucifer`。\n\n### Fialka (Фиалка)\n\n二战后创建的\
  \ Enigma 机的苏联对应品。与西方加密机不同，Fialka 支持西里尔字母。\n\n### Fiat–Shamir\n\n一种利用哈希函数将交互证明（证明者和验证者之间涉及多轮的协议）转换为非交互式证明（证明者提供的单条消息）的技术。\n\
  \n### FIPS 140-2\n\n一套针对加密模块（软件或硬件）的安全要求，由 NIST 在 2001 年制定。自 2019 年以来它已被 FIPS 140-3\
  \ 取代。\n\n## FIPS 140-2 的真正含义\n\n当厂商说“我们通过了 FIPS 140-2 认证”时，这一陈述可能有两种含义：“我们已经申请了认证”，或者（在理想情况下）“我们已经获得了认证”。\n\
  \n后一种也可以有不同的含义：\n\n³ 等级 1：FIPS 批准算法的正确性。\n\n\n\n\n\n### 等级 2：在等级 1 的基础上增加某些篡改证据——例如，通过观察箱上破损的密封来检测已发生的物理攻击。\n\
  \n### 等级 3：在等级 2 的基础上增加某些篡改检测——例如，平台具备实时检测物理攻击的能力，并在认为自己正受到攻击时将自身重置为出厂 `F` 模式。此级别还包括一些物理隔离和更强的身份验证。\n\
  \n### 等级 4：在等级 3 的基础上增加某些更强的篡改检测，并保证模块能够检测大多数物理攻击尝试，并在受到攻击时进行重置（例如，通过清零密钥）。\n\n\
  值得注意的是，`FIPS 140-2` 与其说是衡量系统对物理攻击的韧性，不如说是衡量系统检测攻击的能力。这承认了在拥有适当设备的情况下，大多数系统都容易受到物理攻击的侵害。\n\
  \n此外，系统通过了 `FIPS 140-2` 认证并不意味着它是绝对安全的。原因是：1) `FIPS 140-2` 受限于其范围以及每个级别安全需求的定义，且\
  \ 2) 即使在通过认证的产品中，认证通常也适用于加密模块（有时仅适用于部分模块）。换句话说，如果某个应用程序调用 `FIPS 140-2` 等级 3 模块来加密某些消息，而该应用程序的软件存在泄露该明文的漏洞，不要归咎于认证。\n\
  \n### FIPS 140-3\n\n2019 年发布的 `FIPS 140-2` 新版本。它引入了针对非侵入式攻击的要求，以及“正常运行”（Normal Operation）和“降级运行”（Degraded\
  \ Operation）等概念。\n\n另参见 *FIPS 140-2*。\n\n`FIPS 140-3 47`\n\n## 伪造\n\n一种攻击目标不是恢复某些密钥，而是在不知道某些密钥的情况下，创建一个看似难以生成的数值。\n\
  \n不可伪造性（Unforgeability）是相应的安全概念，通常与签名和消息认证码（MACs）相关。更广泛地说，不可伪造性适用于任何攻击者都难以创建有效输出的方案。这包括身份认证加密中的密文以及零知识证明协议的轨迹。\n\
  \n有时，可伪造性是一种理想的属性（例如为了实现可否认性）。\n\n## 形式验证\n\n一种依赖数学保证的测试形式。应用于安全协议时，形式验证包括符号验证和计算验证技术，它们用于评估协议是否满足机密性和身份验证等属性。另一个例子是编程语言，它们可以证明实现在功能上相对于规范是正确的，或者不存在某些类的侧信道攻击。\n\
  \n高安全性应用通常会接受某种形式的形式验证，例如通用标准（Common Criteria）安全评估框架的 `EAL7` 保证级别。尽管如此，不要被误导认为形式验证意味着证明了加密实现的所有方面都是安全的。\n\
  \n## 格式保留加密\n\n一种产生的密文与原始消息格式相同的加密类型。例如，16 位信用卡号的格式保留加密会产生另一个 16 位数字。格式保留加密通常用于加密字段必须具有特定格式的数据库条目，例如社会安全号码码、IP\
  \ 地址和邮政编码。尽管该问题听起来简单，但它需要复杂的技术，特别是对于从任意值域创建密码的更具通用性的问题。\n\n## 前向安全性\n\n指如果某物在稍后被破解，它仍然保持安全的概念。什么被视为*某物*、*其他物*以及*稍后的时间*取决于上下文。前向安全性通常是密钥协商协议、安全消息协议（及其棘轮机制）、伪随机数生成器、伪随机函数、MACs\
  \ 以及其他状态对象中相关的 `48 Forgery`（伪造性）安全概念。\n\n实现前向安全性通常比实现后向安全性更容易，因为删除过去比让未来变得不可预测更容易（至少在密码学中是如此）。\n\
  \n另参见 *Backward secrecy*。\n\n### FOX\n\n另参见 *IDEA NXT*。\n\n## FSE (快速软件加密)\n\n一个专注于对称密码原语设计和密码分析的会议，包括慢速面向硬件的哈希函数。`FSE`\
  \ 有时被视为应用密码学会议，尽管它很少关注真实世界的算法，更不用说真实世界的攻击了。\n\n研究人员展示经过评审的论文，标题例如：\n\n“使用分治法改进针对差分/线性分析的基于\
  \ MILP 安全评估算法”以及“低 AND 与高效逆序：低延迟掩码 S 盒指南”。\n\n另参见 *Asiacrypt*、*CHES*、*CRYPTO*、*Eurocrypt*、*PKC*、*Real\
  \ World Crypto*、*TCC*。\n\n## 全同态加密\n\n另参见 *Homomorphic encryption*。\n\n## 功能加密\n\
  \n一种看起来像魔法的加密方案：当为某个函数 `f()` 设计时，解密 `Enc(M)` 得到的不是 `M` 而是 `f(M)`。但像许多魔法加密方案一样，它在实践中的用途有限，因为它只能高效支持简单的功能。\n\
  \n为了构建功能加密方案，密码学家可以使用利用不可区分性混淆（indistinguishability obfuscation）的技巧：换句话说，寻找 `f(M)`\
  \ 的解密过程由一个混淆程序组成，该程序首先检索 `M`，然后计算 `f(M)` 而永远不会暴露 `M`。\n\n`Functional encryption\
  \ 49`\n\n## 未来安全性\n\nSignal 协议背景下提出的术语，指与后向安全性类似的概念。与入侵后恢复不可区分。\n\n另参见 *Backward\
  \ secrecy*。\n\n## 模糊提取器\n\n一种从具有随机错误的多次读取中提取某些熵值以派生密钥的方案。这听起来很像纠错码，但不同之处在于：首先，读取的值不是字码（具有冗余，因此熵次优），而是可能是极大熵的值；其次，该值不是读取一次而是多次；最后，用于解码密钥的注册数据不能泄露关于该密钥的信息。因此，你可以存储它而不产生隐私泄露。\n\
  \n你可能会在生物识别应用中发现提取器，这些应用必须提取一个能够唯一识别个体的值。相反，在传统的认证方法中，你会将新的测量值与注册值进行对比以识别身份。\n\n\
  ## G\n\n## 广义生日问题\n\n寻找值 *X1, . . , Xk* 使得 `Hash(X1) ⊕ · · · ⊕ Hash(Xk) = 0` 的问题。经典碰撞的特例是寻找两个不同的值，使得\
  \ `Hash(X1) ⊕ Hash(X2) = 0`。*生日攻击*通过 `O(2^n/2)` 次哈希函数查询找到此类对，其中 *n* 是输出位数。\n\n在广义生日问题中，很容易看出\
  \ *k* 的值越大，问题越容易。更精确地说，碰撞的代价变为 `O(k² * n/(1+log2 k))` 时间和空间，对于 *k* = 4，量级为 `2^n/3`。\n\
  \n`50 Future secrecy`\n\n## GNFS (通用数域筛法)\n\n用于分解大整数的最佳（非量子）算法。\n\n## GOST\n\n\n\
  \n\n\n这种设计于 20 世纪 70 年代的苏联国家标准块密码包含在 `GOST 28147-89` 标准系列中。与同时设计的美国 `DES` 密码（其密钥仅为\
  \ 64 位）不同，`GOST` 使用 256 位密钥并带有可自定义的 S 盒。`GOST` 与 `DES` 一样构建为费斯尔网络，但它尚未被实质性地破解，尽管有些研究论文描述了针对它的操作次数少于\
  \ `2⁵⁶` 的攻击。俄罗斯当局于 2019 年正式废弃了 `GOST`。它的继任者是块密码 `Кузнечик` (`Kuznyechik`)。\n\n###\
  \ Grain\n\n一组极简主义的、面向硬件的流加密密码族：`Grain`（80 位密钥）、`Grain 128` 和 `Grain 128a`（128 位密钥）。\n\
  \n### Gröbner basis\n\n## G\n\n多元变量方程组的标准表示形式。为多元变量方程组计算 `Gröbner basis` 是“求解”该方程组的可能定义之一，因为例如它可以用于找到其数值解。\n\
  \n计算 `Gröbner bases` 的通用问题是 NP-hard 的。对于多元变量密码学或代数密码分析中遇到的特定方程组，计算其所需的实际时间和内存通常非常大且难以估计：但在不需要这些的情况下，它能产生惊叹的密码分析结果。\n\
  \n### Group signature\n\n一种涉及一组潜在签名者的签名方案。小组中的任何成员都可以代表小组发布签名，而验证者可以获知小组成员的身份，但无法获知实际签名者的身份。\n\
  \n有一个例外：小组必须与一个名为 `group manager`（组管理器）的信任实体合作，该实体可以将签名追溯到原始签名者。`Ring signatures`（环签名）不具备这种追溯属性，也不需要\
  \ `group manager`。参见 `Ring signature`。\n\n组签名 **51**\n\n### Grover’s algorithm\n\
  \n一种量子算法，理论上可以用 `O(2^n/2)` 而非 `O(2^n)` 的复杂度破解对称密码，其中 `n` 是密钥长度。\n\n### GROVER：注意字体细则\n\
  \n你可能认为，由于 `Grover’s algorithm` 的存在，具有 128 位密钥的密码将只有 64 位的安全性。但实际上，由于各种原因（包括以下因素），破解密码的成本并变得平方级更具效益：\n\
  \n* 运行 `Grover’s algorithm` 来破解例如 `AES` 需要 `AES` 的量子实现，这比任何传统实现都要慢得多且昂贵。\n* `Grover’s\
  \ algorithm` 似乎并不像经典暴力破解那样扩展，从意义上说，它无法将计算分布在多个单元上，无法同时攻击多个实例。\n* `O()` 渐近符号隐藏了在现实中可能不可忽略的常数因子。\n\
  \n## H\n\n### Hardcore predicate\n\n单向函数和置换理论定义中的关键概念：对于某些单向函数 `f()`，硬核谓词（hardcore\
  \ predicate）是关于输入 `x` 的某些信息，这些信息从 `x` 容易计算，但从 `f(x)` 很难计算。根据定义，你应该为任何给定的单向函数及其置换找到硬核谓词。\n\
  \n### Hash function\n\n单向函数和置换理论定义中的关键概念：对于某些单向函数 `f()`，硬核谓词是关于输入 `x` 的某些信息，这些信息从\
  \ `x` 容易计算，但从 `f(x)` 很难计算。根据定义，你应该为任何给定的单向函数及其置换找到硬核谓词。\n\n`hash function` 接收输入并产生固定大小的输出。`hash\
