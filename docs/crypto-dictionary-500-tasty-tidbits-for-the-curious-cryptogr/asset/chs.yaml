- "# 加密词典：好奇加密学者的 500 个趣味秘籍\n\n\n\n![](img/index-1_1.jpg)\n![](img/index-1_2.jpg)\n\
  ![](img/index-1_3.jpg)\n![](img/index-1_4.jpg)\n\n\n\n\n\n\n\n\n\n\n## 关于作者\nJean-Philippe\
  \ (JP) Aumasson 是 Taurus Group 的首席安全官兼联合创始人，这是一家专注于数字资产基础设施的瑞士金融科技公司。自 2006 年以来，他在密码学领域发表了\
  \ 60 多篇研究论文，并设计了广泛使用的加密算法 `BLAKE2` 和 `SipHash`。他是广誉之作《严肃的密码学》（No Starch Press, 2017）的作者，经常在信息安全和技术会议上演讲。\n\
  \n## 关于技术评审员\nPascal Junod 自 1999 年以来一直从事应用（以及较少应用的）密码学工作，涵盖了学术界和工业界。他拥有苏黎世联邦理工学院（ETH\
  \ Zurich）计算机科学硕士学位和洛桑联邦理工学院（EPF Lausanne）密码学博士学位。在空余时间，他喜欢越野跑、白水皮艇、阅读书籍以及照顾家庭。\n\
  \n## 前言\n*我并不承诺任何完整的东西；因为任何被认为是完整的人类事物正因如此而必然是有缺陷的。我不会假装对各种物种进行细致的解剖学描述，或者至少在这个空间内进行过多的描述。我在这里的目标仅仅是勾勒鲸类学系统化的草案。我是建筑师，而非建造者。*\
  \ ——赫尔曼·梅尔维尔，《白鲸记》（第 32 章）\n\n《加密字典》与我之前的书非常不同。它的格式和较轻松的语气可能让它看起来不那么严肃，但它的严肃性在于其涵盖的广度。\n\
  \n《严肃的密码学》涵盖了应用密码学的基础知识，或者说不到该领域全部知识的 10%，而本字典自称涵盖了密码学领域至少 75% 的内容。\n\n《严肃的密码学》中那种不紧不慢、渐进且相对深层的阐述被一种不那么头疼的结构所取代，这种结构充满了简洁直接的定义。这种咖啡书的形式旨在展示密码学的丰富性，包括其奇特和被忽视的角落，以分享知识并作为通往更好地理解秘密科学的门径。\n\
  \n正如题辞所暗示的，《加密字典》并非试图提供一本能够全面且一致地涵盖密码学不同领域的真实字典。你可能找不到你喜欢的协议或密码，并可能会对我刻意忽略或只是没想到的某些术语的缺失感到惊讶。但你会发现今天密码学家经常许多许多主要概念和算法，以及我认为在实务、理论、历史或轶闻方面具有趣味的、带有个人偏好的术语精选。\n\
  \n资深密码学家可能会注意到，这本书并不平等。尽管我试图均匀地涵盖密码学的所有街条小巷，但由于我的偏见、经验、兴趣和多变的灵感，某些领域不可避免地比其他领域得到了更平等的对待。我希望这种异质性不会被视为不公平，因为这绝对不是我的意图。\n\
  \n例如，我选择不列出个人或软件组件；相反，书侧于人们创建和工程师实现的概念及加密对象，我认为这些具有更大的吸引力。根据“不包含软件”的规则，我没有包含 `Signal`\
  \ 应用，但我包含了 `Signal` 协议。但这一规则有一个例外，你可以在 N 和 P 之间找到它。\n\n本字典并不自称提供对各种协议、算法和其他密码学概念的精确描述。《加密字典》并非百科全书，也不旨在成为古老的《应用密码学手册》的现代版本。例如，寻求基于属性的密码学的正式定义或\
  \ `AES` 详细规范的读者可以在网上找到大量的参考。\n\n大多数定义都是真实的定义，但它们在信息量上各不相同。我没有追求统一的细节水平，而是刻意简要解释了某些术语——包括一些最基本的术语——或只添加了一些幽默的评论。\n\
  \n《加密字典》中的加密代表了最广义上的密码学，包含了所谓的加密货币领地。但坦诚地说，本字典远不是一本区块链字典，因为许多特定的区块链应用术语被省略了。\n\n\
  \n\n\n\n最初的动力之一是编写一本书，简要描述非平凡的密码学概念，包括已有的概念以及一些最新的研究成果。许多密码学家听过这些术语，但往往无法记得它们的含义，或者不知道它们与相关概念有何区别。例如，群签名（group\
  \ signatures）和环签名（ring signatures）有什么区别？`SNARK` 和 `STARK` 之间有什么区别？`SRP` 和 `OPAQUE`\
  \ 之间呢？`BIKE` 和 `SIKE` 呢？什么是简洁证明（laconic proofs）、可穿透加密（puncturable encryption）或可验证延迟函数（verifiable\
  \ delay functions）？很少有书籍会提到这些概念中的任何一个，而且可能没有其他书会提到所有概念。\n\n我想根据研究进展发布带有更新和列出的新定义的多个版本。因此，我想让这本书保持活力，并随着时间的推移让它变得更加完整，这需要你们这些读者的帮助。我鼓励你通过\
  \ Twitter 账号 `@cryptolexicon` 分享评论、错误报告或额外建议（最好公开发布，但如果你愿意，也可以发私信）。\n\n我希望这本书能是一次愉快且有价值的阅读体验，帮助你领略密码学领域的丰富性，并且尽管密码学是一个非常严肃的话题，你也不会把它想得太严肃。\n\
  \n*洛桑，2021 年 1 月*\n\n## 序言 xi\n\n## 致谢\n\n你可能会认为这本书仅仅是我博学多结晶，但事实远非如此。我不仅必须学习或重新发现书中定义的许多术语，还依赖同仁和专家来回答问题、审阅定义的准确性和清晰度、提供参考文献、建议额外的定义，并提供其他宝贵的建议。\n\
  \n我特别感谢技术评审员 `Pascal Junod`，他指出了初稿中的许多不准确之处，并识别了重要的缺失定义。特别感谢 `Luca De Feo` 对我的评审以及在用通俗易懂的解释同源（isogenies）和超椭曲线（hyperelliptic\
  \ curves）方面提供的帮助。我还要感谢 `Alon Rosen`、`Anastasiia Voitova`、`Arrigo Triulzi`、`Ben Fuller`、`Doug\
  \ Henkins`、`Jason Donenfeld`、`Nadim Kobeissi`、`Samuel Neves` 和 `Sofía Celi` 的帮助。最后，但同样重要的是，我感谢\
  \ `No Starch` 团队的支持、高质量的编辑以及职业素养。\n\n## 密码词典\n\n### 2013\n\n`Edward Snowden` 泄露关于\
  \ `NSA` 机密活动的年份，这是密码学的一个转折点。端到端加密突然变成了一个吸引人的话题。\n\n### 65537\n\n最常用的 `RSA` 公钥指数；足够大以保证不安全，足够小以使幂运算足够快，且其形式优化了实现速度（`65537\
  \ = 2¹⁶ + 1`）。\n\n## A\n\n#### A5/0\n\n早期移动电话标准（`GSM`）中的三种加密模式之一。`A5/0` 意味着没有加密；因此，手机通话音频内容将在移动设备与最近基站之间以明文接收和传输。它的安全性与早期\
  \ `TLS` 版本的空算法一样。\n\n#### A5/1\n\n西方国家（在 `3G` 和 `4G` 技术出现之前）的默认 `GSM` 算法，用于加密编码后的音频移动通信。这是一种基于奇特机制的流密码，该机制涉及三个不规则时钟的线性反馈位寄存器；因此，寄存器的更新取决于另外两个寄存器中某些位的值。\n\
  \n复杂的密码分析已经破解了 `A5/1`。但在实践中，最有效的攻击相对简单：它是一种时间内存权衡，利用了 `A5/1` 的短状态（`64 bits`），并涉及大型彩虹链表的预计算。`A5/1`\
  \ 规范最初是机密的，直到 20 世纪 90 年代被反向工程破解后才公开。\n\n#### A5/2\n\n`A5/1` 的导出版本，这是一个委婉说法，意味着其技术要求类似于必须易于西方国家情报机构破解。`A5/2`\
  \ 被设计为是不安全的，但事实证明它并没有极度不安全：在与 `A5/1` 同时被反向工程破解后，学术研究人员很快发现了针对 `A5/2` 的攻击。但这些攻击在理论上的效率高于实际中的效率。\n\
  \n#### A5/3\n\n终于，手机中出现了一种真正的算法。它是 DIY 版 `A5/1` 的升级，应用了一种已经公开并经过验证的算法，即块密码 `KASUMI`。`KASUMI`\
  \ 用于 `2G`（同 `A5/1` 一起），在 `3G` 中作为 `A5/4`（同 `SNOW 3G`），并在 `4G` 中不再被支持。\n\n查看 `KASUMI*`。\n\
  \n#### A5/4\n\n`A5/3` 但密钥为 `128 bits` 而不是 `64 bits`；`A5/4` 是安全的，而 `A5/3` 则不是。\n\n\
  #### 自适应攻击 (Adaptive attack)\n\n攻击者的行为取决于他们在攻击和协议执行期间观察到的内容。例如，在自适应选择明文攻击中，攻击者发送的明文取决于之前查询的响应。在非自适应攻击中，攻击者查询密文的明文列表必须预先确定。\n\
  \n#### AEAD（关联数据的认证加密）\n\n一种通过生成密文以及认证标签对数据进行加密和认证的对称密码。解密步骤只有在标签有效时成功，证明密文是由知道密钥的人创建的。\n\
  \n## 不同的 AEAD 构造\n\n`AEAD` 中的 `AD` 指关联数据（associated data）——也称为*额外*或*辅助*数据——这些数据未加密但受认证机制覆盖，因为它们在计算认证标签时被视为输入。AEAD\
  \ 可以通过三种方式实现：\n\n³   使用已有的密码和已有的 MAC，例如使用 `CBC` 模式下的 `AES` 作为密码，使用 `HMAC-SHA256`\
  \ 作为 MAC。这是传统方法，通常效率最低。它最容易出错，因为组合密码和 MAC 的方式有很多种（所谓的加密加 MAC、先加密后 MAC 和先 MAC 后加密）。\n\
  \n³   使用已有的密码和即时（ad hoc）MAC 或模式，例如 `AES-GCM` 和 `ChaCha20-Poly1305`，它们是目前此类类型中最流行的\
  \ AEAD。例如，`TLS 1.3`。`AES-SIV` 也属于这一类，尽管它稍有不同（是 MAC 加密，而不是先加密后 MAC）。\n\n³   使用自定义的二合一构造，例如\
  \ `ACORN` 和 `AEGIS`，都是 `CAESAR` 竞赛选的算法。在这些算法中，相同的内部状态和逻辑负责加密并生成认证标签。\n\n#### AES\
  \ (高级加密标准)\n\n`NIST` 于 2000 年标准化的通用块密码。由比利时密码学家 `Joan Daemen` 和 `Vincent Rijmen`\
  \ 设计，是 AES 竞赛的冠军，如今在各种工作模式下（如 `CBC`、`GCM` 和 `SIV`）中被广泛应用。\n\n查看 *Rijndael*\n\n####\
  \ AES-CCM\n\n计数器加 CBC-MAC 模式下的 `AES`，将 `CTR` 加密模式与 `CBC-MAC` 认证相结合。`AES-CCM` 是 `NIST`\
  \ 标准，并支持 `TLS 1.3` 以及其他几种协议（包括低功耗蓝牙）。但它没有它的 `AES-GCM` 得多。原因是 `AES-CCM` 通常比 `AES-GCM`\
  \ 慢且不方便使用。一篇名为《对 CCM 的批判》的研究论文描述了 `CCM` 模式的局限性。\n\n#### AES-GCM\n\n在嵌入式平台上，`AES-CCM`\
  \ 有时比 `AES-GCM` 更合适，因为它只需要 `AES` 算法而不需要额外的逻辑（不像 `GCM` 的 `GMAC`）。\n\n\n\n\nGal 罗斯计数器模式下的\
  \ AES，是本文编写时最常用的认证加密原语。这也是终结了 HMAC 认证器时代的原语。在 GCM 模式下，消息通过 `CTR` 模式进行加密，而伽罗斯 MAC（`GMAC`，又称\
  \ `GHASH`）根据密文和关联数据块生成认证标签。无位乘法指令 `PCLMULQDQ` 在 2010 年代引入 Intel 处理器，用以加速 `GMAC`\
  \ 的计算。\n\n## AES-GCM 的阿喀斯之踵\n\nAES-GCM 是安全的，除非在不同的消息上两次使用相同的 `nonce` 运行它，这可能会泄露明文数据并暴露\
  \ `GMAC` 使用的认证密钥。这种不幸的脆弱性并没有阻止 AES-GCM 被用于无数协议（包括 `TLS`、`IPSec` 和 `SSH`），也未阻止它被\
  \ IEEE、`ISO` 和 `NIST` 标准化。AES-GCM 的表兄弟 `AES-GCM-SIV` 消除了 nonce 重用问题，但目前尚未获得广泛支持，且速度稍慢。\n\
  \n## AES-GCM-SIV\n\n`AES-GCM` 的变体，其加密 `nonce` 根据通过认证明文（以及任何关联数据）计算出的标签确定。`AES-GCM-SIV`\
  \ 的 MAC 称为 `POLYVAL`，与 `GCM` 的 `GMAC` 类似：`AES-GCM` 是“先加密后认证”（encrypt-then-MAC）的形式，而\
  \ `AES-GCM-SIV` 是“认证并加密”（MAC-and-encrypt）结构。\n\n与 `AES-GCM` 相比，`AES-GCM-SIV` 的主要优势是即使重复相同的\
  \ `nonce` 依然安全——这种属性被称为“误用抵抗”。\n\n## AES-NI\n\n正式名为 `AES New Instructions`，但通常被称为原生指令，这可能是更好的术语。`AES-NIs`\
  \ 是 CPU 指令，它们使用芯片硅片中的硬件逻辑计算 `AES`，而不是像 AES-NI **5** 那样使用芯片 `ALU` 的算术运算组合。Intel 在\
  \ 2008 年引入 `AES-NIs` 后，使 `AES` 软件速度快了约 10 倍，并作为副产品，免疫了缓存定时计时攻击。\n\n## AES-SIV\n\n\
  参见 `SIV-AES`。\n\n## AIM (高级信息安全机)\n\n摩托罗拉在 20 世纪 90 年代后期设计的芯片组包含了用于红操作（加密）和黑操作（明文）的独立\
  \ `FPGAs`。它被誉为“有以来密码学最具革命性的进展之一”。NSA 使用它来保护机密和敏感的国家安全信息。现成的 `AIM` 不包含机密（`Suite A`）算法，但用户可以为\
  \ `FPGAs` 支持算法，例如 `ACCORDION` 或 `BATON`。\n\n## AKA\n\n在 `3GPP` 标准术语中，手机网络用户与用户主网络之间的认证密钥协商操作，该主网络可能与接入网络不同。\n\
  \n## 3GPP 标准中的 AKA\n\n`AKA` 在 `3G UMTS`、`4G LTE` 和 `5G` 标准中非常相似，与其他许多密钥协商协议不同，它不使用公钥原语；相反，它依赖于共享对称密钥和伪随机函数（`5G`\
  \ 除外，后者加入了公钥加密）。\n\n`AKA` 看起来是一个简单的协议，通过主密钥和序列号来派生会话密钥（加密、认证和匿名密钥），同时确保双向认证，更准确地说，是双方对共享密钥的认知。尽管在密码学上很枯燥，`AKA`\
  \ 旨在实现针对其独特环境的其他非凡性目标。\n\n这些目标包括用户身份（`IMSI`）的机密性、用户的不可关联性、接入网络的认证（由用户和主网络进行），以及强大的不可靠性保证和对不安全伪随机生成器的韧性。\n\
  \n**6** AES-SIV**\n\n## AKS (Agrawal–Kayal–Saxena)\n\n## A\n\n第一个确定性素性测试，区别于随机性测试。\n\
  \n2002 年介绍 `AKS` 算法的论文论文“`PRIMES is in P`”是首次证明了素性测试问题属于 `P` 复杂度类，即存在非随机多项式时间算法的问题所在类。\n\
  \n参见 `PRIMES`。\n\n## 代数密码分析\n\n密码分析的一种形式，其中目标问题（通常是密钥恢复，但也包括伪造、区分等）被建模为多元方程方程组，并通过通用技术或特定技术找到解。代数密码分析已用于攻击对称和非对称加密系统。一个目标示例是基于移位寄存器的具有低代数次数逻辑的流加密器，它产生了可被代数攻击利用的底层方程。\n\
  \n参见 `Gröbner basis`。\n\n## Alice\n\n`Bob` 的犯罪同伙，但从未在现实中见过过 `Bob`。根据 John Gordon\
  \ 在 1984 年演讲中的官方传记：“`Alice` 和 `Bob` 曾试图欺骗保险公司，他们通过邮件进行高额赌注扑克，并在被窃听的电话上交换秘密信息。（……）`Alice`\
  \ 和 `Bob` 拥有非常强大的敌人。他们的敌人之一是税务局，另一个是秘密警察。这很遗憾，因为他们最喜欢讨论的话题是税务欺诈和推翻政府。”\n\n参见 `Bob`。\n\
  \n## 全或全无变换 (AONT)\n\n一种可逆变换，你需要输出的每一个位来确定输入的任何位。当加密方案是 `AONT` ，，如果丢失了密文的某些位，解密密钥对于明文将无用（除非丢失的位少到可以被破解）。用于\
  \ `RSA` 加密的 `OAEP` 构造是一种 `AONT`。`CBC` 或 `GCM` 加密模式不是 `AONT`。全或变换 (AONT) **7**\n\n\
  ## 匿名签名\n\n一种不会泄露签名者身份（公钥）的签名，因此需要与签名者交互。它意味着隐身。\n\n参见 `Invisible signature`。\n\n\
  ## 应用密码学\n\nBruce Schneier 于 1996 年著作，多年来一直是领域的主要参考；它让许多学生和工程师接触了密码学。因其开头而闻名：“世界上有两种密码学：一种防止你妹妹读你的文件，另一种是防止大政府读你的文件。这本书关于后者。”\n\
  \n在出版 25 年后虽然不可避免地过时，只要你不盲目遵循它的建议，《应用密码学》仍然值得留在书架上。它比 Schneier 之前的两本书《邮件安全》和《保护你的\
  \ Mac》要落后得多。\n\n## 应用密码学\n\n强调直接应用的密码学部分。相比之下，理论密码学不那么侧重工程，而更侧重于基础理解和分析。“应用”一词具有欺骗性；应用和理论密码学可以（并且应该）对现实应用同样。\n\
  \n## ARC4\n\n`RC4` 流加密器的原始名称；也写作 `ARCFOUR`。\n\n在反向工程 `RC4` 被确认为真实的 `RC4` 之前，它被谨慎地称为\
  \ `疑似 RC4`，缩短为 `ARC4`。\n\n## Argon2\n\n在密码哈希竞赛期间开发的密码哈希函数。此外，它是处理密码或任何低熵密钥以派生加密密钥或存储验证器的标准，防止使用\
  \ GPU、`FPGAs`、专用硬件、预计算表或侧信道攻击进行高效破解。\n\n与 `PBKDF2` 不同，`Arg2` 除了可配置迭代次数外，还可以强制使用特定内存。与\
  \ `scrypt` 以及其他两种不同，`Argon2` 提供了一个易于使用的 **A** 接口，方便选择时间和内存参数。它的设计也非常简单，内部仅使用 `BLAKE2`\
  \ 哈希函数，而不是所有设计的密码学的组合。\n\n**ARX (加-旋转-异或)**\n\n\n\n\n\n一个缩写，指仅执行整数加法、字位位移或旋转以及异或运算的加密算法（与之相对，例如使用\
  \ S 盒的算法）。由密码学和安全研究人员 `Ralf-Philipp Weinmann` 于 2009 年提出。\n\n### ASIACRYPT\n亚洲顶尖学术密码学会议，自\
  \ 1990 年以来每年秋在亚太地区的不同地点举行。它是唯一一个名称中包含 `IACR` 子字符串的 IACR 会议。研究人员展示经过同行评审的研究论文，标题如“结构保持且可重随机化的\
  \ RCCA 安全公钥加密及其应用”以及“2G/3G 网络中无彩虹表的 GSM 加密密码分析”。\n\n参见 `CHES`、`CRYPTO`、`Eurocrypt`、`FSE`、`PKC`、`Real\
  \ World Crypto`、`TCC`。\n\n### 非对称加密\n参见 公钥加密。\n\n### 攻击\n在密码分析背景下，指一种描述为算法的技术演示，该技术违反了被攻击原语或协议设计者所提出的安全声明。\n\
  \n### 并非所有攻击都是攻击\n如果 Alice 设计了一个密码，她可以声称：在 2) 被给定十亿对明文或密文对的情况下，没人能 1) 确定地恢复密钥。在这里，点\
  \ 1 是安全目标，点 2 是攻击者模型。\n\n所以，如果你确定了如何通过百万对 `9` 明文或密文对确定地恢复密钥，它就符合攻击的定义。如果你需要百亿对，它就不符合攻击的定义。如果恢复密钥的概率仅为\
  \ 1/10，同样也不符合。\n\n攻击的存在并不意味着被攻击的原语在某些上是不安全的。例如，如果一种攻击在 `2200` 次操作中有效，而安全声明是 `2256`，那么你不需要担心，因为在现实中\
  \ `2200` 和 `2256` 一样不可能。\n\n研究人员通常以研究论文的形式展示攻击。当攻击可行时，可能会提供实际的实现作为其有效的证据。\n\n###\
  \ 基于属性的加密 (ABE)\n基于身份的加密从单一属性（身份）到多个属性的泛化。它允许你将消息不是发送给特定的接收者，而是发送给一组属性，使得只有满足属性有效组合的方才能解密消息。\n\
  \nABE 起来很强大，但尚未发现许多实际应用。\n\n据报道，原因是其相对复杂的构造（使用椭圆曲线对）以及需要一个信任的第三方（持有生成私钥所需的主密钥）。\n\
  \n参见 基于身份的加密。\n\n#### 用于访问控制的 ABE\nABE 有时被认为适用于细粒度访问控制。例如，你可以想象一个组织部署 ABE，使用部门、权限级别和项目等属性来加密敏感文档，通过加密手段强制执行多级安全和基于角色的访问。例如，一个文档可以使用带有属性\
  \ `{department=ENGINEERING, clearance=SECRET, project=LABRADOR}` 的公钥进行加密。\n\n此时，ABE\
  \ 就可以保证，如果你只满足这些属性中的两个（例如，你的部门是 `ENGINEERING` 且权限级别是 `SECRET`，但你在负责 `HUSKY` 项目），你将无法解密该文档。更有趣的是，ABE\
  \ 保证如果你与 `ENGINEERING` 部门中 `LABRADOR` 项目的某人重合，但他们只有 `CONFIDENTIAL` 权限，你仍然无法解密该文档。\n\
  \n### 10 基于属性的加密 (ABE)\n### 认证密码文\n参见 `AEAD`。\n\n### Axolotl\n### B\nSignal 应用端到端消息协议的原名。\n\
  \n参见 Signal 协议。\n\n### B\n### 后门\n一种绕过算法或协议安全性的隐蔽特性。陷门（Trapdoors）是用户为人知的存在；而后门通常不为人知。后门曾被定义为一种允许秘密访问数据的特征或缺陷。一个良好的后门必须是是不可检测的、`NOBUS`（除我们之外无人知道，或仅由其架构师专门利用）、可重用的、不可修改的且可否认的。\n\
  \n由于这些原因，加密算法中的后门很难设计，而在实现中更容易被添加，特别是当内部逻辑不透明且难以去混淆时。`Dual_EC_DRBG` 中的 `NSA` 后门是一个显著的例外。遗憾的是，关于后门最有趣的研究并没有在\
  \ IACR 会议上发表。\n\n### 回溯抗性\nNIST 特别使用的一个术语，指代类似于前向安全性的概念。它是预测抗性的对立面。\n\n参见 前向安全性。\n\
  \n### 后向安全性\n前向安全性的对立面：后向安全性是一种属性，即如果攻击者破解了某些值，未来的消息仍然受到保护。如果整个系统的状态被破解——包括长期和短期密钥——后向安全性通常是不可能的。一个例外是伪随机生成器，通过从可靠源重新种子将不确定性引入系统，防止攻击者从过去的快照确定未来的位。在安全消息的背景下，某些模型假设攻击者会破解某些密钥集，而不一定是整个状态：在这种情况下，可能保证某种形式的后向安全性。\n\
  \n参见 前向安全性。\n\n### 后向安全性\n通常以临时方式定义，后向安全性概念也出现在`妥后安全性`（在安全消息语境下）、`入侵后恢复`（Signal\
  \ 协议）、`未来安全性`（Signal 协议）、`自愈`（ZRTP）以及`预测抗性`（NIST）等术语中。\n\n### Base64\n不是加密。\n\n\
  ### Bassomatic\n由 PGP 创建者 Phil Zimmermann 设计用于加密 PGP 数据的密码。它在 1991 年被发现不而被 `IDEA`\
  \ 取代。正如 Zimmermann 在源代码中注释道：“BassOmatic 的名字源自一个周六夜晚现场的老剧段，其中涉及一台搅拌机和整条鱼。Bassomatic\
  \ 算法对数据所做的，就像原始的 Bassomatic 对鱼做的那样。”\n\n### BB84\n第一个量子密钥分发（QKD）构造。它由 `Bennett`\
  \ 和 `Brassard` 于 1984 年描述，基于一年前引入量子货币的概念。\n\n### bcrypt\n一种哈希算法：它不加密。旨在通过 1999 年论文《未来适应\
  \ Base64 密码方案》解决 1976 年 `crypt` 工具过时的问题。在这篇论文中，作者做了如下预测：“在复杂度理论没有重大突破的情况下，这些算法应允许基于密码的系统适应硬件改进，并在未来的\
  \ 20 年内保持安全。”\n\n### B\n你可以主张这一预言是准确的，因为你可以调整 bcrypt 使其足够慢以击败密码破解。另一方面，bcrypt 4KB\
  \ 的内存使用现在太低了，无法防止有效的破解。\n\n### 双立图密码分析\n一种通过搜索双立图（bicliques）来加密算法的攻击。在图论中，团（clique）是节点之间互为连接的子集。双立图由两个节点子集组成；第一个子集中的每个节点都与第二个子集中的所有节点连接。\n\
  \n\n\n\n这一概念被用于改进对 `AES` 的差分攻击，并导致了理论上操作次数少于暴力搜索的攻击（`2126` 次而非 `2127` 次）。在此语境下使用的双仿结构（bicliques）由第一组内部状态位、第二组密文文位，以及由密钥位决定的这两组位之间的依赖关系组成。该攻击的想法是识别密钥的某些位，使这些位满足双仿结构条件（从异或差异来看）。\n\
  \n### BIKE (位翻转密钥封装)\n\n听起来像 `SIKE`：也是一种 `KEM`（密钥封装机制）；同样是后量子算法，但它基于解码问题而非同源问题。\n\
  \n参见 `SIKE (超奇异同源密钥封装)`。\n\n### BIP (比特币改进提议)\n\n一个具有误导性的名称，因为最著名的 `BIPs` 不再仅仅是提案，而是适用于比比特币更广泛的加密货币的事实标准。这些\
  \ BIP 包括：\n\n*   `BIP 32`，它定义了一种基于树的机制，从秘密种子派生密钥对和地址，从而从单个秘密值创建多个账户的钱包。\n*   `BIP\
  \ (Bitcoin improvement proposal) 13`\n*   `BIP 44`，它为 `BIP 32` 树层分配了语义，并定义了树内路径的语法（由用途、币种、账户、地址类型和地址索引组成）。\n\
  *   `BIP 39`，它将秘密值表示为高熵字典单词列表或助记词，然后将其哈希为种子，该种子将成为 `BIP 32` 账户层级的根。\n\n### 位金 (Bit\
  \ Gold)\n\n比特币最接近的前身。\n\n### 比特币 (Bitcoin)\n\n一个失控的实验，无论好坏。\n\n### 黑 (Black)\n\n\
  NSA（美国安全局）术语，指加密值。黑密钥是一种加密密钥，例如使用密钥封装机制，以便能够安全地分布在较低安全级别的系统或网络上。在静态数据保护的背景下，黑数据是指使用适当加密层经过两次加密的分类数据。\n\
  \n参见 `EKMS (电子密钥管理系统)`。\n\n### BLAKE\n\n2008 年提交给 `SHA-3` 竞赛的哈希函数。它是五决赛之一，但未被入选（获胜的是\
  \ `Keccak`）。`BLAKE` 重用了 `ChaCha` 流加密器的置换，但旋转方向相反。有些人怀疑这是某种高级优化，但实际上它源于原始 `BLAKE`\
  \ 规范中的一个拼写错误。\n\n### BLAKE2\n\n2012 年 `SHA-3` 竞赛结束后提出的 `BLAKE` 演进版本。它被许多软件应用采用，因为它比\
  \ `SHA-2` 和 `SHA-3` 快。若干加密货币的证明工作系统使用了 `BLAKE2`。\n\n### BLAKE3\n\n一种结合了简化轮 `BLAKE2`\
  \ 和 Merkle 树结构的哈希函数，使其比 `BLAKE2` 快得多。`BLAKE3` 在 Real World Crypto 2020 大会上发布。\n\n\
