  \n# 密码学：从 A5/0 到 ZRTP\n\n拓展你的视野和加密词汇表。探讨对抗性知识，以及终极桌面密码学技术，如回旋攻击和双链攻击。\n\n`Crypto\
  \ Dictionary` 由一位著名密码学家编写，既适合专家也初学者。其定义严谨，对密码学的讨论既通俗易读，又幽默风趣。书中还展望了未来量子计算对当前密码体系构成的威胁，并提到了后量子算法，例如基于格的加密方案。\n\
  \n翻到任何随机一页，都能发现新颖、有趣或令人震撼的内容，例如：一份按字母顺序排列的加密算法调查，包含数百条精辟条目，涵盖从 `RSA` 到 `USSR` 的广泛及小众领域。`Crypto\
