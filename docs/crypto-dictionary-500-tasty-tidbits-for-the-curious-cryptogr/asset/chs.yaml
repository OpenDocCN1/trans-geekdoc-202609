  \ mod `q` `i` \n\n## 78 NESSIE (欧洲签名、完整性与加密新方案)\n*我们今天正站在密码学革命的边缘。廉价数字硬件的发展使其从机械计算的设计限制中解放出来，并将高等级加密设备的成本降低到可以在远程自动取款机和计算机终端等商业应用中使用的程度。反过来，这些应用产生了对新型加密系统的需求，这些系统可以尽量减少对安全密钥分发通道的依赖，并提供等同于手写签名的功能。同时，信息论和计算机科学的理论进展有望提供可证明安全的加密系统，将这门古老的艺术变成一门科学。*\n\
