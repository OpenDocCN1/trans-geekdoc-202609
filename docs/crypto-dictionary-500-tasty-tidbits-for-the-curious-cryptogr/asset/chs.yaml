  \ 的 `PBKDF2` 结构以及 `Salsa20/8` 流密码。\n\n### 可搜索加密 (Searchable encryption)\n对数据库记录进行加密，允许对加密数据进行搜索。例如，它允许在给定加密关键词的情况下检索出加密项，这些条目在解密后包含该关键词。\n\
  \n可能实用且有效的可搜索加密方案会泄露一些关于加密数据的信息。相比之下，那些具有最高安全保障的可搜索 111 在功能和性能方面受到严重限制（例如，那些使用函数加密、同态加密和忽略\
  \ RAM 的方案）。\n\n### secp256k1\n`Bitcoin`、`Ethereum` 以及许多其他加密货币用于交易 `ECDSA` 名的椭圆曲线。`k`\
  \ 表示 Koblitz 曲线。与其他标准曲线不同，特别是与普及的 `secp256r1`（也称为 `NIST p-256`）不同，`secp256k1` 不依赖伪随机参数，在原则上不太可能被操纵。中本·聪聪（Satoshi\
