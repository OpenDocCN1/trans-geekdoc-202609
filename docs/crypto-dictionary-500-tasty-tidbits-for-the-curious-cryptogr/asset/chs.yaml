  \ function` 接收输入并产生固定大小的输出。\n\n### Homomorphic encryption\n\n一种满足 `Dec(Enc(M1) ⊙\
  \ Enc(M2)) = M1 ⊙ M2` 的加密方法，其中算子 `⊙` 是相同的也可能是不同的，通常是某种类型的加法或乘法。例如，通过教科书级的 `RSA`\
  \ 对某些消息 `M` 执行 `Md mod n` 来加密消息，这对于乘法是同态的。\n\n同态性可能是安全问题也可能是特性，取决于上下文。例如，某些电子投票系统利用\
  \ `Paillier` 密码系统的同态属性在不解密的情况下汇总选票。\n\n全同态加密是一种更通用、更强大的属性，但也更难实现：全同态加密对于密文执行的任何操作都是同态的，而不仅仅是单一组操作。\n\
  \n### Heartbleed\n\n`OpenSSL` 中的漏洞引发了人们对签名的关注。\n\n### Hedged signature\n\n一种需要新鲜随机数的\
  \ `ECDSA` 类型。`Hedged signatures`旨在解决这个问题。\n\n### HFE (Hidden Field Equations)\n\n\
  一种多元密钥方案。\n\n## HMAC (Hash-based MAC)\n\n`HMAC` 是一种涉及加密哈希函数的消息认证码（MAC）。记住，`HMAC`\
  \ 并不是构造 `MAC` 的唯一或最优方法。\n\n## H\n\n## HPC (Hasty Pudding Cipher)\n\n一种在 1998 年参加\
  \ `AES` 竞赛的被遗忘的块密码。其设计者称之为“第一个全能密码：它可以加密任何块大小的任何密钥长度”。\n\n### HASTY PUDDING CIPHER\
  \ 的特殊特性\n\n`HPC` 不传统但具有创新，具有多个独特特性，因为它是：\n* 第一个可调优块密码（当时该调优被称为 `spice` 或辅助密钥）\n\
  * 针对 64 位架构进行了优化，是所有 `AES` 候选算法中最快的\n* 支持任何密钥和块大小\n* 由五个子密码组成：`HPC-Tiny`、`-Short`、`-Medium`、`-Long`\
  \ 和 `-Extended`\n\n这种所谓的 `spice` 预见了未来对调优的需求。`spice` 对于每个位字段都可以是不同的，从而防止字典攻击。\n\n\
  \n\n\n\n加密在未来最重要的应用将是视频通信，且运行在标准硬件（即 64 位机器）上。。`Hasty Pudding Cipher` 是 64 位机器上用于批量加密的最快算法。\n\
  \n(. . .) 视频应用中的性能至关重要，因此 `HPC` 应该是 `AES` 的首选方案。\n\n### Although\n尽管它仍然未被破解——目前仅发现了等效密钥——但\
  \ `HPC` 未被选为 `AES`，甚至没有进入第二轮。它非正规的设计以及缺乏形式的安全论证可能没有起什么积极作用。\n\n### HSM (硬件安全模块)\n\
  专门用于运行加密操作和其他任务的硬件设备。`HSMs` 可以有不同的形式，例如机架式服务器或 USB 令牌。`HSMs` 并不一定使用专用硬件（如专用硅电路）运行加密操作。实际上，在大多数情况下，它们完全在软件中运行，由某些通用处理器执行。`HSM\
  \ (hardware security module)` 中的 `S` 指的是它实现的功能；它并不一定意味着 `HSM` 比普通电脑更安全。\n\n### HTTP/3\n\
  参见 `QUIC (Quick UDP Connections)`。\n\n### 超椭曲线加密\n类似于 `elliptic-curve cryptography`（椭圆曲线加密），但使用了更高维的对象：`hyperelliptic\
  \ curve`（超椭曲线）的 `Jacobian`。换来说，我们无法用读者熟悉的其他概念来解释 `Jacobian` 是什么。`hyperelliptic curves`\
  \ 主要优势在于，由于额外的维度，相同的有限域生成的群比椭圆曲线大。这种强度同时也是一种弱点：当维度过高时（通常超过三维），离散对数问题会变得更容易。\n\n\
  ### IACR (国际密码学研究协会)\n密码学家的联盟，一家非营利组织，组织最大的学术会议并管理参考平台。\n\n### IDEA (国际数据加密算法)\n\
  一种 20 世纪 90 年代的 64 位分组加密算法。使用 Feistel 置换网络。尽管设计方法相当具有启发性，但 `IDEA` 仍抵御了多年的密码分析。针对它的第一个被证明可能比暴力破解更快的攻击直到\
  \ 2012 年才出现（这是一种双链攻击）。`IDEA` 是少数使用整数乘法的算法之一，这带来了一些安全益处，但也使得防御侧信道攻击变得困难。\n\n### IDEA\
  \ NXT\n一种与 `IDEA` 几乎没有相似之处的分组算法，除了它们共同使用了 Massey 结构。`IDEA NXT` 最初被命名并发布为 `FOX`，它在反盗版计划中被证明非常有用，不仅是因为它在密码学上的优点。\n\
  \n### 基于身份的加密\n一种在不知道某人公钥的情况下发送加密消息的方法。例如，当 Alice 给 Bob 发送加密消息但不知道他的公钥时，基于身份的加密\
  \ (`IBE`) 允许她使用 Bob 的公钥进行计算。例外是 `IBE` 需要一个名为 `key server`（密钥服务器）的信任第三方，该服务器知道某些主私钥并用它生成用户的私钥。因此，Bob\
  \ 需要向 `key server` 进行身份验证，证明自己是本人以接收他的私钥。\n\n### IES (集成加密方案)\n一种不涉及公钥加密原语公钥加密方案。相反，发送者选择随机密钥对，计算新私钥与接收者公钥之间的\
  \ `Diffie-Hellman` 共享密钥，派导出对称密钥，并使用某种认证加密文加密消息。双方均不执行用于加密数据的公钥操作。\n\n### 不耐烦的破坏者\n\
  在 `Dolev–Yao` 模型中，一种能够传输数据但无法接收数据的典型攻击者。或者用 Dolev 和 Yao 自己的话来说，“一个只发起对话的人（而不依赖于被说话）。”\n\
  \n### 不可能性\n密码学家 Moti Yung 曾说：“当一个软件工程师说某个安全工程问题是不可能的时，那实际上意味着它在密码学上很有趣。”\n\n###\
  \ 不可能差分攻击\n一种利用极不寻常事件而非异常高概率事件的差分攻击。差分分析通常利用在具有特定差值的输入和输出之间发生的具有异常高概率的模式。不可能差分攻击利用的是相反类型的模式，即那些在某些条件下零几概率被观察到的模式。如果密码分析学家注意到这些模式，他们就可以推导出该条件不成立。这些信息可以帮助恢复算法的秘密密钥或子密钥。\n\
  \n### IND-CCA\n在选择密文攻击下的密文不可区分性。这是加密方案（包括公钥和对称密钥方案）最强的安全概念。从直觉上看，选择密文在实践中可能意义不大。这是因为你很少能找到攻击者可以解密任何想要密文的系统，而功能更多的加密反而功能更少。此外，某些情况下你确实拥有解密\
  \ Oracle，例如某些 `DRM` 系统。\n\n### IND-CPA\n在选择明文攻击下的密文不可区分性。也称为语义安全。其核心思想是：密文不应泄露除长度之外的任何关于明文的信息，即使对于能够获取其选择明文对应的密文的活跃攻击者也是如此。`IND-CPA`\
  \ 是对称加密的标准安全概念。例如，`CTR` 或 `CBC` 模式下的分组加密，如果底层分组加密是安全的，且 `CTR` 随机数是唯一的或 `CBC` 初始值不可预测，那么它们就是安全的。这有很多“如果”条件，在实践中可能会导致原本符合\
  \ `IND-CPA` 的方案出现安全漏洞。\n\n### 不可消除性\n属于交易或系列交易的属性，具有隐式或显式的时间戳，且无法追溯或进行更改。加密账本机制（如区块链）通常可以解决这个问题。\n\
  \n### 区分性\n一种构造（如哈希函数）的属性，如果构建块没有安全缺陷，则该构造保证产生安全的原语。在哈希函数的上下文中，我们讨论与 `random oracle`\
  \ 的区分性，意味着如果底层的压缩函数或置换是理想的，哈希函数就具有与随机 Oracle 相同的结构：即没有任何。\n\n### 不可区分性\n一种非随机事物看起来与真正的随机事物相同的属性。如果两者是不可区分的，你就无法从非随机事物中提取信息。在加密案例中，非随机事物是密文，你无法提取的信息是关于明文的。\n\
  \n### 不可区分混淆 (iO)\n对软件混淆直观概念的数学化。在密码学中，与软件安全一样，混淆过程以程序为输入，产生第二个在某种程度上隐藏了第一个程序工作方式（内部程序）的程序。与软件安全不同，密码学将程序视为可能的抽象表示之一，最常见的是带有\
  \ AND、OR 和 NOT 门的布尔电路。\n\n\n\n\n\niO 可以被视为输入-输出关系的原始编码，它隐藏了实现细节，例如子程序或中间变量。不可区分性概念只是用形式化的方式来表达这样一个观点：在给定的两个不同但等价程序的混淆之后，攻击者不应该能够识别出哪个程序是哪一个。\n\
  \n尽管 iO 听起来像是许多问题的解决方案，但在实践中并非如此，这是因为其高复杂性和低效率。\n\n### 信息论安全\n\n即使是无限计算能力也无法破解的安全性。\n\
  \n例如，假设你使用另一个密钥 `K` 作为 `AES` 密钥，通过 `AES` 加密了一个 128 位的秘密密钥 `K0`。假设攻击者没有办法验证他们是否获取了有效的\
  \ `K0`。\n\n在这种情况下，即使攻击者可以尝试 `K` 的所有可能值，也无法识别出 `K` 的正确值，因为他们无法识别出他们想要的 `K0`。信息论安全\
  \ 59\n\n### INT-CTXT\n\n密文完整性。一种适用于认证加密方案的安全概念，指攻击者来说创建一个有效的密文在实践上是不可能的，即使他们知道许多他们所选消息的有效密文。\n\
  \n一个相关的定理：如果一个认证密文是 `IND-CPA` 且 `INT-CTXT`，那么它也是 `IND-CCA`。我留给你去 Google 搜索这个结果的证明。\n\
  \n### 不可见签名\n\n除非签名者同意公开该信息，否则这种公钥签名无法被识别为有效或无效。不可见签名似乎使签名是匿名的（即因为签名没有泄露签名者的身份或公钥），但事实并不一定如此。考虑这个反例：如果你额外使用非不可见签名方案对该签名进行签名，该方案仍然保持不可见性，但显然不是匿名的。\n\
  \n参见 *匿名签名*，*不可否认签名*。\n\n### IOTA\n\n根据其自身的定义，一种没有区块也没有链的区块链。\n\n这可能是最受嘲笑的区块链平台，因为它做出了一些不幸的密码学选择，例如设计了一种新的哈希函数。密码学爱好者和\
  \ IOTA 支持者发布了数百条关于 IOTA 争议设计选择的煽动推文。\n\n以下是这场辩论的简要总结：加密爱好者大喊：“IOTA 坏了，因为它的签名方案坏了。”作为回应，IOTA\
  \ 粉丝回答道：“IOTA 没坏，因为它无法被利用。”双方都有一定道理。\n\n### IPES (改进的提议加密标准)\n\nIDEA 块密码器的另一种名称。参见\
  \ *IDEA*。\n\n### IPSec\n\n与 `TLS` 和 `SSH` 一起主要的开放安全通道协议之一。尽管它被广泛使用，但在密码学界和工程师中仍然不为人知。事实上，如果你在开发移动或\
  \ Web 应用程序，不需要理解 `IPSec`。此外，它的设计和子协议在密码学上看起来很乏味。尽管 IPS 是 DARPA 和 NSA 赞助的始于 20 世纪\
  \ 70 年的作品，但它仍然是网络层安全的标准。此外，除了脆弱的 `IKEv1` 子协议外，它的设计和实现已被证明比早期的 `SSL` 和 `TLS` 版本更健壮。\n\
  \n### ISO 标准\n\n花 $180 买这个定义。请注意，目前尚无论文格式。\n\n### 基于同源的密码学\n\n最新的一类后量子密码学方法；始于 20\
  \ 世纪初。同源是一种将椭圆曲线上的点映射到另一条椭圆曲线上的点的函数，并满足特定的数学属性。你可以画一个图，其节点是椭圆曲线，其边是它们之间的同源，并以伪随机的方式在图中漫游。在对这些对象的研究中投入了大量酷炫的数学——图论、四元代数等——之后，你得到了可以用于密码学应用的困难计算问题。\n\
  \n### J: 密码学杂志 (JoC)\n\n## K\n\n密码学的《自然》杂志，减去版面费。\n\n### KASUMI\n\n1995 年块密码 `MISTY1`\
  \ 的变体；在 3G 通信标准中作为 `A5/3` 算法使用。KASUMI 被破解了，因为存在一种实用的密钥恢复攻击。KASUMI 也没有被破解，因为该攻击需要在相关密钥模型下的选择密文查询，这是不符合现实的。\n\
  \n### Keccak\n\n被标准化为 `SHA-3` 的哈希函数族；它根据海绵函数框架由单一排列构建。Keccak 的排列对异或和逻辑与进行了巧妙的结合。它还针对效率进行了优化，并轻松扩展到不同的宽度。原始的\
  \ Keccak 设计及其海绵模式导致了其他几种算法。参见 *基于排列的密码学*。\n\n### KeeLoq\n\n有史以来最昂贵的破解密码。少数依赖反馈移位寄存器的块密码之一。\n\
  \n### KEM (密钥封装机制)\n\n一种用于加密和解密短固定大小数据块的公钥方案；通常用于封装对称密钥。你可以将 KEM 视为一种密钥协商，其中一方可以选择密钥；`KEM`\
  \ 的加密函数选取随机对称密钥并对其加密，而 `KEM` 的解密函数对其解密以恢复对称密钥。然后可以使用对称原语解密使用该密钥加密的任何数据。\n\n### Kerberos\n\
  \n单点登录系统的祖先，设计于 20 世纪 80 年代后期，为 MIT 的分布式计算平台 Athena 提供安全的身份验证和授权。诚承认，这是一种老技术，尽管其影响巨大且仍在许多地方使用（例如\
  \ Radius 认证协议），但 Kerberos 是少数人知道的安全协议之一。事实上，尽管年代久远，Kerberos 仍然是一个相当安全的协议。它实现了经常被遗忘的概念，例如在验证任何方的身份之前不信任任何一方，并且不以明文形式暴露密码。它有一些局限性；例如，Kerberos\
  \ 必须依赖受信任的第三方。但话说回来，有多少安全协议最终是不依赖第三方的？\n\n有时被称为仅使用对称密码的协议，Kerberos 也支持公钥加密以及各种认证形式，如一次性密码、硬件令牌和生物识别。\n\
  \n### HADES’ DOG\n\nKerberos 协议名称的来源最好的解释是雅典娜女神与欧里庇得的对话（转录自 MIT 的 Kerberos 网站）：\n\
  \n```\nEuripides: (. . .) 你知道的，我认为我们有一个坚实的基础来实现卡戎 认证系统。\nAthena: 也许吧。总之，我不喜欢卡洛 名字名字。\n\
  Euripides: 从什么时候开始的？\nAthena: 我从没喜欢它，因为这个名字不通。我前几天在和哈德斯叔谈论这件事，他建议了另一个名字，他那三头看门犬的名字。\n\
  Euripides: 噢，你是说刻耳鲁斯吗？\nAthena: 闭上嘴，Rip！刻耳鲁斯确实……\nEuripides: 呃，不不是那个名字吗？\nAthena:\
  \ 是的，如果你碰巧是个罗马人！我是希腊女神，他是一个希腊看门犬，他的名字是 Kerberos，用 K 开头。\nEuripides: 好了，好了，别扔雷电。我接受这个名字。实际上，它听起来挺好听。再见卡戎，欢迎\
  \ Kerberos。\n```\n\n### 克克霍夫斯原则\n\n由 19 世纪荷兰密码学家奥古斯塔·克克霍夫斯在其文章《La cryptographie\
  \ militaire》（法语）中确立的安全六项原则，或称*愿望*。\n\n克克霍夫斯原则 63\n\n**克克霍夫斯的六项原则**\n\n\n\n\n\n在柯克霍夫斯论文的六项原则中，只有第二条广为人知的`柯克霍夫原则`。但所有六项都值得我们关注。让我们在这里审查它们：\n\
  \n1. *该系统在实践上（即使在数学上）是不可破解的。*\n今天的等效概念还包括那些通过数学手段几乎无法破解的系统，例如安全证明在某些困难性假设下保证了实际安全性。\n\
  \n2. *它不要求保密，而且即使落入敌手手中，也不会造成任何不便。* 所有严谨的密码学家都应该遵循这一条……除非他们不该遵循的时候。事实上，在少数例外情况下，将算法保密（通过自定义设计、秘密\
  \ S 盒、秘密微调输入和/或秘密个性化值）会显著提高系统的安全性。\n\n3. *它的密钥必须在没有书面笔记帮助的情况下传输和保留，并根据通信双方的意愿进行更改或修改。*\
  \ 密钥分配、撤销和轮换仍然密码学中最具挑战性的问题之一，也是许多危险的根源。\n\n4. *它必须适用于电报通信。* 抱歉了，柯克霍夫斯；邮件加密问题在实践上仍然未解决。\n\
  \n5. *设备和文档必须是便携的，其使用和功能不需要多个人的参与。* 这一目标与分布式密钥生成和门限加密等协议的目标恰相反。\n\n6. *最后，鉴于其应用的特定环境，该系统必须易于使用，既不需要费脑，也不需要遵守一系列长长的规则。*\
  \ 简单性在密码设计中很少成为主要考虑因素，尽管它本应是如此。\n\n### 密钥派生函数 (KDF)\n\n一种通过对内容进行哈希处理以获取密钥的函数。简单的哈希函数并不总是能解决问题，因为要进行哈希的*内容*通常包含秘密值和非秘密值的组合。`KDF`的接口有助于安全地处理这些值，以避免不同内容集之间的碰撞。哈希函数不是`64`\
  \ 密钥派生函数 (KDF) 的另一个原因是：`KDF` 往往需要生成任意大小的密钥，而大多数哈希函数生成固定大小的值。\n\n当密钥不能是任意位字符串（例如对称密钥），而是公钥/私钥对时，就会出现特殊情况。在这些情况下，通常不会在\
  \ `KDF` 的过程中生成密钥对，而是使用第二个算法从种子（seed）确定性地创建一个密钥对。\n\n最后但同样重要的是，当内容的秘密是密码、密码短语或其他低熵值时，你需要一种特殊的\
  \ `KDF`，称为`密码哈希函数`。这些具有一些额外的安全要求。\n\n参见 *密码哈希函数*。\n\n### 密钥托管 (Key escrow)\n\n将秘密密钥的托管交给机构或实体，以及与之相关的权利（例如解密通信）的想法。\n\
  \n正如欧洲委员会在 1998 年 5 月的一次会议上所述：委员会 1995 年 1 月 17 日的决议承认，合法授权拦截通信是调查严重犯罪的重要工具。委员会注意到，执法机构可能要求在不通知加密服务用户的情况下，合规地访问加密密钥，以维持这种能力。为此，委员会承认，在其他方法中，一种可能满足执法部门利益的途径可能是推广涉及将加密密钥或其他信息存放在第三方那中的机密性服务。此类服务通常被称为“密钥托管”或“密钥\
  \ `K` 恢复”服务。在必要解密作为刑事调查一部分的被捕材料时，执法机构也可能要求合法访问加密密钥。\n\n从原则上说，密钥托管听起来是现实问题的简单且公平的解决方案。但在实践中，密钥托管引发了许多程序、技术和政治问题，取决于你的标准，其收益可能并不值得额外的成本和风险。\n\
  \n参见 *密钥管理*。\n\n密钥托管 65\n\n### 密钥管理 (Key management)\n\n密码学中单一困难的问题。密钥管理无法通过量子计算机或\
  \ `NP` 预言来解决。\n\n### 密钥封装 (Key wrapping)\n\n对于对称加密而言，就像 `KEMs` 之于公钥加密。\n\n### 窃密密码学\
  \ (Kleptography)\n\n一个术语，指用于恶意软件和其他不道德应用中的密码学，特别是当其目标是以隐蔽方式窃取信息时；例如通过隐信道或混淆。\n\n\
  参见 *病毒密码学 (Cryptovirology)*。\n\n### 已密钥攻击 (Known-key attack)\n\n这种攻击模型假设攻击者已经知道了某些对称密码的秘密密钥。因此，攻击的目标不是恢复密钥，而是识别结构属性，当该密码被用于哈希函数或其他密钥可能不秘密的构造时，攻击者可能会利用这些属性。\n\
  \n### Kupyna (Купина)\n\n乌克兰国家哈希函数标准；建立于 2014 年，以植物重楼花（*Polygonatum multiflorum*）命名。Kupyna\
  \ 基于一种相当奇特的压缩函数构造：给定消息块 `M`。\n\n### 简洁零知识证明 (Laconic zero-knowledge proof)\n\n一种交互式证明，证明者向验证者发送非常少的比特。\n\
  \n66 密钥管理\n\n### 赖西夫 (Lai–Massey)\n\n一种构建块密码的加密方法，尽管在 `IDEA` 和 `FOX` 中使用的频率远少于 Feistel\
  \ 置换网络。\n\n#### 赖西夫轮 (A LAI–MASSEY ROUND)\n\n给定一个输入输出均为块大小两倍的函数 `f()`，赖西夫轮应用于分为两部分的状态\
  \ `L` 和 `R`。每一轮更新这些部分：首先计算 `X = f(L - R)`。然后设置 `L = σ(L + X)` 和 `R = R + X`。\n\n\
  在这里，`σ()` 是一个正换，即映射 `Y` ↦ `σ(Y) - Y` 也是一个正换。例如，FOX 的正换将 `L` 视为两部分 `LL||LR` 并返回 `LR||(LL\
  \ ⊕ LR)`。\n\n如果没有 `σ()`，`L - R` 在操作过程中保持不变，这会稍微降低方案的安全性（我把这个证明留给你作为一个练习）。\n\n###\
  \ 拉姆波签名 (Lamport signature)\n\n第一个基于哈希的签名方案，在原始形式下是最简单的签名方案：为了给单比特消息签名，你首先生成一个由两个随机值\
  \ `K 0` 和 `K 1` 组成的私钥。然后共享公钥 `Hash(K 0), Hash(K 1)` 。为消息 `0` 签名，附加 `K 0` 作为签名，否则附加\
  \ `K 1`。\n\n这可行，但并不好用，因为 1) 一个密钥对只能签名一条消息，2) 密钥大小与消息大小成正比。\n\n### 第一种公钥签名方案？ (THE\
  \ FIRST PUBLIC-KEY SIGNATURE SCHEME?)\n\n尽管发表于 1979 年——在 Diffie–Hell man 和 RSA 论文之后——L\n\
  \n拉姆波的方案可能是第一个使用公钥密码学的签名方案。用拉姆波自己的话说：\n\n*1975 年左右在伯克利的一家咖啡馆，Whitfield Diffie 向我描述了一个他一直试图解决的问题：为文档构建数字签名。我立即提出了一个解决方案。虽然并不实用——它可能需要\
  \ 64 位发布密钥来签名单个比特——它是第一个数字签名算法。*\n\n拉姆波签名 67\n\n**基于格密码学 (Lattice-based cryptography)**\n\
  \n\n\n\n\n就实际应用而言，后量子加密方案中最具前景的类别。基于晶格的加密通常依赖于某种版本的 `学习误差问题 (LWE)` 问题，特别是它与晶格问题的联系。它可以提供加密/KEM\
  \ 和签名方案。由于其结合了可接受的安全保障、性能和构造的多样性，它被认为是最前景的后量子方案类型。\n\n基于晶格的方案占了 NIST 后量子竞赛第一轮提交方案的\
  \ 39%，第二轮入选方案的 46%，以及决赛入围方案的 71%。\n\n参见 `学习误差问题 (LWE) `。\n\n### 密信者 (Le Chiffre)\n\
  伊恩·弗莱明间谍小说中的一个角色。任何名字名字意为“密码”的人只能是反派：\n\n大多昂贵，但为人低调。性欲旺盛。自虐主义者。\n\n快车专家级司机。精通小型武器和其他形式的格身斗，包括刀术。在帽子带、左鞋后跟和烟盒中各备有三片\
  \ `Eversharp` 剃刀片。精通会计和数学。高明赌徒。\n\n### 抗泄露加密 (Leakage-resilient cryptography)\n\
  一种尝试使用抽象计算和内存泄漏模型对侧信道信息泄露进行建模。此类模型包括`边界检索模型`、`持续内存泄漏`、`辅助内存泄漏`和`仅计算泄露`等。在这些模型中构建安全方案证明是一项有趣的练习，但实际意义存疑，因为这些模型很大程度上未能捕捉侧信道和物理攻击的复杂现实。\n\
  \n### 学习误差 (LWE)\n当线性方程组中的方程包含误差时求解该方程组的问题。`LWE` 推广了`带噪声奇偶校验 (LPN)` 问题，使其具有任意维度和大于\
  \ 0 和 1 的数字。\n\n### 68** 基于晶格的加密\n基于晶格的加密方案通常依赖于某些 `LWE` 问题的硬性。这是因为在平均情况下，`LWE`\
  \ 的难度与晶格问题中最困难的实例（如 `GapSVP`）一样。生成的加密构造在破解难度上至少与 `LWE` 一样困难。\n\n### 长度扩展攻击 (Length\
  \ extension attack)\n某些哈希函数的属性，即给定 `Hash(X)`，在不知道 `X` 的情况下，可以找到任何 `Y` 的 `Hash(X\
  \ || pad || Y)` 的值，其中 `pad` 是填充位后跟 `X` 长度的编码。易受长度扩展攻击的哈希函数包括所有基于 `Merkle–Damgård`\
  \ 结构的，例如 `SHA-256` 和 `RIPEMD-160`。\n\n较新的哈希函数，如 `SHA-3` 或 `BLAKE3`，不受长度扩展攻击的影响。\n\
  \n### 等长度加密 (Length-preserving encryption)\n生成的密文位与其对应的明文位相同的加密；例如，将任何 16 字节明文加密为\
  \ 16 字节密文，将任何 1 字节明文加密为 1 字节密文，将任何 2 位明文加密为 2 位密文，以此此类推。在有效负载长度固定的应用中，等长度加密加密加密负载数据。\n\
  \n等长度加密不应与`格式保留加密 (format-preserving encryption)`混淆。\n\n### 保持明文长度 (PRESERVING PLAINTEXT\
  \ LENGTH)\n等长度加密听起来可能简单，但并非如此。首先，公钥加密方案无法直接提供等长度加密，因为密文扩展是其工作机制的固有属性。例如，`RSA` 加密需要额外的填充和随机性来实现\
  \ `L` 级加密 (`IND-CPA`)。\n\n在对称加密方面，实现 `IND-CPA` 安全等长度加密的唯一方法是 `nonce` 或 `IV` 不被视为密文的一部分。\n\
  \n流加密器在本质上是等长度的，因为它们将伪随机位与明文进行 `XOR` 操作，从而在加密过程中保持其长度。同样，`CTR-mode` 创建的密文长度与明文完全相同。\n\
  \n### 等长度加密 69\n像 `CBC` 这样的块加密模式呢？如果你使用标准的 `PKCS#7` 填充方案，密文不可避免地比明文长。但有一种名为`密文窃取\
  \ (ciphertext stealing)` 的技术，通过打乱最后块中的字节来获得与明文长度相同的密文。\n\n### LFSR (线性反馈移位寄存器)\n\
  参见 `反馈移位寄存器`。\n\n### 轻量级加密 (Lightweight cryptography)\n针对 IoT 设备和其他具有内存和逻辑限制平台的优化的加密。但这些受限平台通常有独特的局限性。因此，关于轻量级加密的学术研究的相关性令人失望。\n\
  \n### 线性密码分析 (Linear cryptanalysis)\n一种用于对称密码的密码分析技术，利用了线性方程中描述的模式。线性密码分析看起来与差异密码分析完全不同，但实际上与它密切相关。最成功的攻击是针对\
  \ DES 的。\n\n### 相关性 (Linkability)\n签名方案的一种属性，允许攻击者确定两个签名是否由同一个签名者签发。当然，标准签名（如 `ECDSA`）在设计上就是关联的，这没有问题。\n\
  \n### LM hash\n`LAN Manager hash` 的缩写，用于对用户哈希的函数（早期 Windows 版本）。`LM hash` 是更强大的\
  \ `NT hash` 的前身。\n\n参见 `NT hash`。\n\n### 70** LFSR (线性反馈移位寄存器)\n### LM hash 的缺陷\
  \ (IMFECTION OF LM HASH)\n回顾过去，`LM hash` 非常脆弱：可以轻松恢复原始密码。使用 `LM hash` 哈希密码的步骤如下：\n\
  \n1. 将小写字母转换为大写字母。\n2. 如果密码超过 14 个字符，则截取前 14 个字符；否则，用空字节填充至 14 字节。\n3. 使用两个 `DES`\
  \ 实例加密字符串 `KGS!#$%*`，一个使用填充后密码的前 7 个字节，另一个使用后 7 个字节（记住 `DES` 的密钥是 56 位）。\n4. 哈希值是两个密文的拼接。\n\
  \n### Luby–Rackoff\n参见 `Feistel network`。\n\n### Lucifer\n由 IBM 的 Horst Feistel\
  \ 设计的块加密，它导致了 `DES`。它最初并不是 Feistel 网络，而是类似于 `AES` 的替代置换网络，块大小为 32、48 或 128 位。`Lucifer`\
  \ 最初在 `APL`（一种语言）中实现，代号为 `Demonstration`。但由于 `APL` 工作空间限制了项目名称，`Demonstration` 变成了\
  \ `Demon`，后变为 `Lucifer`。\n\n## M\n## M\n### MAC (message authentication code)\n\
  不是签名，但非常接近：就像公钥签名一样，`MAC`\n\n在没有密钥的情况下不可伪造的，但与公钥签名不同，`MAC` 不提供不可否认性。\n\n### MAC\
  \ (message authentication code) 71\n在理论上，`MAC` 可以在不可伪造的同时泄露关于明文的信息，但在实践中大多数 `MAC`\
  \ 并不如此。\n\n### MAGENTA\n`AES` 竞赛中一个不幸的候选方案，在第一次 `AES` 会议上展示后几分钟内就被破解了。一位参与者评论道：“情况非常糟糕，一些参与者开始进行实时密码分析，并提出了在现场破解该算法的攻击方法。我很惊讶那个德国人竟然能保持冷静。整个场面非常羞耻。”\n\
  \n### 延变性 (Malleability)\n\n\n\n\n\n一个被低估的安全概念：如果攻击者无法将密文 `Enc(*K*, *M*)` 转换为某些特定函数\
  \ `f()` 的另一个有效密文 `Enc(*K*, *f*(*M))`，则称该加密方案为不可延变性的。因此，不可延变的方案比可延变的方案更安全。在选择密文模型中，不可延变性等同于不可区分性（最强的安全概念）。\n\
  \n## Manger 攻击\n\n针对 OAEP 模式下 RSA 加密的填充预言攻击。`Manger` 攻击相比于针对旧版 RSA 加密的 `Bleichenbacher`\
  \ 攻击知名度较低，因为它通常更难利用。事实上，正如 `Manger` 的原始论文所述，`PKCS` 标准已经描述了针对该攻击的一种部分缓解措施，即“第 4 步[整数到字节转换]和第\
  \ 5 步[OAEP 解码]输出的错误信息保持相同至关重要”。但与 `Bleichenbacher` 攻击一样，如果攻击者利用时间泄露而不是错误信息，`Manger`\
  \ 攻击同样有效。\n\n## 中人攻击\n\n一类攻击，攻击者秘密地捕获并修改两个或多个通信者之间的流量。针对 `TLS` 实现的 `FREAK`（分解 RSA\
  \ 导出密钥）攻击就是中人攻击的一个示例，其中攻击者修改会话初始化数据以强制使用弱加密套件。\n\n参见 *中间相遇攻击 (Meet-in-the-middle)*。\n\
  \n### MASH (模算术安全哈希)\n\n早期尝试使用与 `RSA` 相同操作的哈希函数。\n\n参见 *VSH (非常平滑哈希)*。\n\n### McEliece\
  \ 加密方案\n\n参见 *基于代码的密码学 (Code-based cryptography)*。\n\n### MD4\n\n比 `MD5` 更弱的哈希函数。\n\
  \n### MD5\n\n曾是*校验和*和*哈希函数*的同词，现在是加密设计糟糕的标志，因为它不抗碰撞性。但 `MD5` 对抗原像攻击仍然是安全的。\n\n##\
  \ MDC (消息摘要密码)\n\n哈希函数的旧称。\n\n## MDC-2 (修改检测码 2)\n\n一种将 *n* 位块密码转换为输出为 2 *n* 位哈希函数的构造方法。生成的哈希不如理想的\
  \ 2 *n* 位哈希安全，但比 *n* 位哈希安全。`MDC-2` 主要与 `DES` 配合使用变为 `MDC-2DES`，除非涉及 `IBM` 的专利。\n\
  \n## 中间相遇\n\n一种密码分析技术，主要以其在攻击对称原语的应用而闻名。当连续的加密层（也称为*轮次*或密码实例）使用独立密钥工作时，即可应用中间相遇。例如，当使用两个\
  \ *n* 位密钥 *K* 1 和 *K* 2 以及两个不同的加密器 `Enc1` 和 `Enc2` 将消息 *M* 加密为 *C = Enc2(*K* 2,\
  \ Enc1(*K* 1, *M*))* 时，你可能期望其具有 *M*^{2n} 位的安全性（仿佛等同于使用 2 *n* 位密钥加密）。但实际安全性接近 *n*\
  \ 位：其原因是，给定一对通过`中间相遇攻击`处理的 (*C*, *M*)，你可以为所有 2 *n* 个 `K` 值计算 `X = Dec2(*K*, *C*)`，然后为所有\
  \ 2 *n* 个 `K'` 值计算 `Y = Enc1(*K*', *M*)`。对于 `X = Y` 的对 (*K*', *K*) 很有可能是 (*K* 1,\
  \ *K* 2)。\n\n你可以将这种技巧看作许多密码分析攻击中发现的更通用优化技术的一种实例。这些攻击包括婴儿步大步算法（用于计算离散对数）、基于 `ECDLP`\
  \ 的 `GHS` 同源攻击，或针对基于同源方案的攻击。\n\n参见 *中人攻击*。\n\n## 梅克尔谜 (Merkle puzzle)\n\n在安全的公钥加密发明之前，最接近公钥加密的东西。\n\
  \n## 梅克尔树 (Merkle tree)\n\n密码学和计算领域许多问题的解决方案。本质上是一个哈希树。例如，它可以用紧凑且高效的方式证明对某些大数据集的认知：你可以通过展示从该数据节点（通常是叶子节点）计算根节点所需的节点列表，来证明某条数据在树中。这组值列表被称为*认证路径*、*包含证明*和*梅克尔证明*。\n\
  \n梅克尔树是基于哈希签名的主要组件。\n\n## 梅克尔-达姆格构造 (Merkle–Damgård construction)\n\n一种在使用仅处理短消息的哈希函数对任意长度消息进行哈的简单技术。其实现方式使得如果短长度哈希是安全的，那么生成的任何长度的哈希也是安全的。这是对称密码学中最早的安全证明之一。但该证明仅关于抗碰撞性和抗原像性，而不是最绝对意义上的安全性。例如，梅克尔-达姆格哈希函数（如\
  \ `SHA-256`）容易受到长度扩展攻击。\n\n## 森旋转旋转算法 (Mersenne twister)\n\n不是一种加密伪随机数生成器。\n\n##\
  \ 消息标记 (Message franking)\n\n一种允许在端到端加密对话中报告滥用消息的同时保持可接受安全水平的协议。源于 `Facebook` 部署端到端加密的问题。\n\
  \n## 米勒-拉宾 (Miller–Rabin)\n\n最常用的概率素性检验。在某些条件下，你可以欺骗测试使其将一个复合数判定为素数。\n\n## *素数*\n\
  \n### MINERVA\n\n参见 *密码学 (Crypto)*。\n\n## 挖矿\n\n为了钱而哈希。\n\n## 抗滥用性\n\n应用于密码学的深度防御。抗滥用性应对了某些加密（如\
  \ `AES-GCM`）只有在不重复调用 nonce 时才是安全的现状。抗滥用加密试图消除这个问题。它们唯一的局限性是如果你加密相同的消息，输出将相同。`SIV-AES`\
  \ 是此类加密的一个示例。\n\n抗滥用性可以扩展到对称*M*加密的情况。\n\n## 定理：重复 nonce 是安全的\n\n在 `AES-GCM` 的情况下，重复\
  \ nonce 允许攻击者获取两个明文之间的异或差，即使他们不知道任何一个消息。证明：`AES-GCM` 使用 CTR 模式加密消息，给定密钥和 nonce 会生成一个伪随机序列（称为*密钥流*），并将其异或到消息。因此，如果你重用密钥和\
  \ nonce 生成密钥流 `S` 对消息 `M 1` 生成密文 `C 1 = M 1 ⊕ S`，你也会使用相同的 `S` 加密第二个消息 `M 2` 得到 `C\
  \ 2 = M 2 ⊕ S`。在这种情况下，攻击者可以计算 `C 1 ⊕ C 2 = M 1 ⊕ M 2`。这是很糟糕的。证明。\n\n## 混合网 (Mixnet)\n\
  \n一种多方协议，通过洗乱密文序列 *C* 1, . . .* , *Cn* 为另一个序列 *C'* 1, . . .* , *Cn* 来提供匿名，使得对于每个\
  \ *Ci* 都存在一个 *C'j*，其值不同但解密后明文相同。该协议可能还包含一个零知识证明，证明在满足标准的同时不泄露任何关于排列或明文的信息。\n\n##\
  \ 实践中的混合网\n\n混合网通常用于在匿名通信网络中路由数据。在这里，观察者不应能够将混合后的值 *C'i* 与其混合前的 *Cj* 关联。通过一轮或多轮混合，这防止了攻击者将消息来源与最终接收者相关联。\n\
  \n\n\n\n\n混合网络（Mixnets）也用于电子投票方案以提供投票者匿名性，并用于加密货币以隐藏发送者/接收者之间的关系，典型的做法是通过打乱 `UTXOs`\
  \ 实现。\n\n许多陷阱会破坏混合网络的安全性。例如，在匿名路由的情况下，混合路由器传输混合后值的顺序不能与接收到值的顺序相关联；否则，匿名性很容易被破坏。消息的大小也应该保持完全相同；否则置换顺序将易被识别。\n\
  \n## 76 混合网络\n\n### MQV (Menezes–Qu–Vanstone)\n加强版的 Diffie–Hellman。发明于 1995 年，但很少被使用，部分原因是存在相关专利保护。它是\
  \ `HMQV` 和 `ECMV` 的姐妹算法（曾包含在美国国家安全局的 Suite B 算法集中）。今天，`MQV` 最广为人知的可能是其在基于密码的密钥协商协议\
  \ `OPAQUE` 中的应用。\n\n### 多重碰撞 (Multicollision)\n对于哈希函数，两个以上消息之间的碰撞。在迭代哈希函数（如 `SHA-256`）上找到多重碰撞所需的时间比作为黑盒访问的哈希函数要短。如果迭代哈希的中间链值为\
  \ `n` 位，那么对于理想的黑盒哈希，可以在复杂度为 `⌈log2 k⌉ · 2*n*/2` 下找到 `k` 碰撞，而对应的复杂度为 `k!1/*k · 2*n*(k–1)`。\n\
  \n### 多方计算 (MPC)\n一类在未知输入原始值的情况下计算函数输出的密码学技术。`MPC` 是一个丰富的研究领域，但在加密货币钱包之前很少有主要应用（钱包也使用了类似于\
  \ `MPC` 的门限签名）。预计会有更多现实世界的 `MPC` 应用。\n\n### 多变量密码学 (Multivariate cryptography)\n\
  一类基于求解多个变量非线性方程组之困难性的后量子方案。这类问题的困难性与多元二次 (`MQ`) 问题相关，`MQ` 问题是求解随机二次方程组的问题，已知是 `NP-完全`\
  \ 的。\n\n大多数多变量方案都是签名方案，它们产生短签名（优点），但需要很长的公钥（不太如）。\n\n## N\n\n### NBS (国家标准局)\n`NIST`\
  \ 的旧称。\n\n## N\n参见 `NIST (美国国家标准与技术研究院)`。\n\n## NBS (国家标准局) 77\n\n### NESSIE (欧洲签名、完整性与加密新方案)\n\
  一个从 2000 年运行到 2003 年的项目，由七家欧洲机构领导。它在 42 份提交中选出了 17 个推荐算法。\n\n`NESSIE` 选定的算法并未成为正式标准，仅是非正式建议，从回过来看来看这引起了很少的关注：还有人记得\
  \ `ACE Encrypt`、`SHACAL-2` 或 `SFLASH` 吗？\n\n### “密码学的新方向”\n由 Whitfield Diffie 和\
  \ Martin Hellman 于 1976 年 11 月发表在 `IEEE Transactions on Information Theory` 上的受邀研究论文。\n\
  \n今天，Diffie–Hellman 操作用于几乎每一个执行加密操作的软件或硬件系统。\n\n#### 迪菲-赫尔曼革命\nDiffie 和 Hellman\
  \ 在写下以下引言后，可以毫无讽刺地被称为愿景家：\n\n> 我们今天正站在密码学革命的边缘。廉价数字硬件的发展使其从机械计算的设计限制中解放出来，并将高等级加密设备的成本降低到可以在远程自动取款机和计算机终端等商业应用中使用的程度。反过来，这些应用产生了对新型加密系统的需求，这些系统可以尽量减少对安全密钥分发通道的依赖，并提供等同于手写签名的功能。同时，信息论和计算机科学的理论进展有望提供可证明安全的加密系统，将这门古老的艺术变成一门科学。\n\
  \n论文随后介绍了公钥密码学的概念以及一种新的*公钥分发系统*，现在称为 Diffie–Hellman 密钥协商。原始规范值得逐字复制：*每个用户生成一个独立的随机数*\
