  \n### NFSR (非线性反馈寄存)\n参见 *反馈寄存*。\n\n### NIST (美国国家标准与技术研究院)\n负责各种技术领域美国标准的机构。`NIST`\
  \ 77 项建议包括算法（如 `DSS`、`AES`、`SHA-2`、`SHA-3`）、分组密码模式、SHA3 变体（如 `cAKE`、`KMAC`、`TupleHash`）、密钥管理、随机数生成和统计测试。\n\
  \n`NIST` 标准（如 `AES` 和 `SHA-3`）的设计是通过公开透明的过程向全球密码学家进行众包。这种方法被认为比将密码设计委托给国家安全局更可靠。\n\
  \n### NIZK (非交互式零知识)\n`NIZK` 证明是条消息形式提供的零知识证明，而不是涉及证明者和验证者之间多次消息的交互式协议。`NIZK` 证明通常使用\
  \ Fiat–Shamir 启发将交互式协议转换为非交互式。\n\n### Noekeon\n一种具有稀有属性的分密码：加密算法与解密算法相同。这在代码、硅片或开发时间有限的环境中非常方便。\n\
  \n### Noise\n一个使用 Diffie–Hellman 协议设计协议的框架。`Noise` 协议有时但并非总是可以替换 TLS 实现传输安全。这提供了许多潜在优势，包括更大的简单性、身份隐藏和更低的带宽消耗。\n\
  \n### Nonce (随机数)\n在密码学背景下，*仅使用一次的数字*。某些加密操作的额外输入，其值应该是唯一的。这确保了即使所有输入相同，操作也会产生不同的输出。在实践中，保证\
  \ nonce 的唯一性并不总是简单的，nonce 通常随机生成。认证加密通常会使用 nonce 来确保即使多次加密相同的消息，输出的密文也不同，从而防止攻击者注意到重复加密了相同的消息。\n\
  \n**80 NIZK (非交互式零知识)**\n\n**非承诺加密**\n\n\n\n\n听起来像是可否认加密（deniable encryption），但并不一定是可以否认的。使用非承诺加密（non-committing\
  \ encryption），可以创建一个伪造密文，使其看起来像真实的密文。通过公开一个密钥对和连接密文与明文的随机位，可以证明密文是由任何明文生成的。\n\n\
  ### 非可外包性 (Non-outsourceability)\n工作量证明方案的一种属性，其工作量在不泄露证明者私钥的情况下无法被外包。因此，它防止了池化挖矿（即第三方执行部分工作并理应获得部分挖矿奖励）。这种证明必须在不使用私钥的情况下可以被高效验证。\n\
  \n### 非诽谤性 (Non-slanderability)\n在环签名（ring signatures）中，这是一种安全属性，防止攻击者伪造可以链接到授权签名者组中特定成员的有效签名。虽然表达略有不同，但非诽谤性等同于不可伪造性（unforgeability）。\n\
  \n### NSA (国家安全局)\n密码学家们最喜欢的三个字母机构。NSA 雇用了许多密码学家，但从不在同行评审会议上发表论文。\n\n然而，它在密码学研究领域非常活跃，设计了已有的公共标准（如\
  \ `DSA`、`SHA-2` 和不幸的 `Dual_EC_DRBG`）、未分类的候选标准（块密码 `SIMON` 和 `SPECK`）、解密系统（`Fortezza`\
  \ 加密卡，包括 `Skipjack` 块密码）以及许多机密算法。NSA 的密码分析能力很大程度上未公开。\n\n参见 *Suite A*。\n\n### NT\
  \ hash\n俗称为 NTLM hash，是 MS Windows NT LAN Manager (NTLM) 协议族中使用的密码哈希函数，是对传统的 LAN\
  \ Manager 协议的升级。`NT hash` 只是 `N hash` 的 `MD4` 哈希。\n\n#### NT hash 81\n编码后的用户密码。它比\
  \ `LM hash` 好，但也容易被破解。\n\n参见 *LM hash*。\n\n### NTRU (n 阶截断多项式环单元)\n最早的基于格的密码系统之一，设计于\
  \ 1996 年。被研究了多年，也许因为它拥有专利并已商业化。\n\n人们对 NTRU 的兴趣重启在 2016 年 `NTRU Prime` 的设计中达到顶点，它是\
  \ NTRU 的变体，其作者简洁地定义为“一种高安全素数阶大伽罗瓦群不变模数理想格的加密密码学的高效实现”，其中“素数阶”等是三个 (. . .）从攻击者手中夺走了多种数学工具的特征。`NTRU\
  \ Prime` 已提交给 NIST 的后量子竞赛。\n\n### 空密码 (Null cipher)\n当作为加密套件出现时，这是一个意味着`no encryption`（无加密）的术。例如，早期\
  \ TLS 版本支持 `null cipher`。`null cipher` 不需要密钥，我想你可以认为它是最快的密码。\n\n## O\n### OAEP (最优非对称加密填充)\n\
  在使用 `RSA` 或 Rabin 方案进行公钥加密之前，对消息进行安全填充的方法。计算 `me mod n` 确实不是一种使用 `RSA` 操作来加密消息 `m`\
  \ 的非常安全的方法。相反，`OAEP` 可以消息转换为随机字符串，从而破坏纯 `RSA` 的可变性性和同态性。根据 `PKCS#1 v2.2` 标准，`RSA-OAEP`\
  \ 现在是使用 `RSA` 加密的推荐方法。\n\n参见 *All-or-nothing transform (AONT)*，*Manger attack*。\n\
  \n### 盲知密钥管理系统 (OKMS)\n一种持有主密钥并与客户端交互以派生密钥的服务，由于使用了用于密钥派生的（部分）盲知 `PRFs`，该服务在不知道这些密钥的情况下进行操作。\n\
  \n### 82 NTRU (n 阶截断多项式环单元)\n### 盲知 PRF (OPRF)\n## O\n一种双方协议，其中服务器知道密钥 `K`，客户端为某些\
  \ `X` 计算 `PRF(K, X)`。\n\n### 盲知 RAM (ORAM)\n一种安全的内存模型，使得攻击者在观察内存时无法获知内容或访问模式。\n\n\
  ### 盲知传输 (Oblivious transfer)\n一种在两个参与者之间的协议，其中接收者选择一个想要的部分，但发送者不知道是哪一个。想象你想从大量书中购买一本，但发送者不知道是哪一本。盲知传输允许客户端在只知道两个值中的一个（其密码）的情况下计算这两个组合的哈希。\n\
  \n### 隐晦性 (Obscurity)\n密码学家眼中的异端。但在现实中，当密码学只是安全系统的一部分时，你有时需要隐藏其逻辑以满足安全目标。\n\n###\
  \ 隐晦性 83\n### OCB (偏移密码本模式)\n块密码最简单高效的认证加密模式之一，也是密码学脆弱性的演示。尽管有安全证明和标准化，攻击者成功破解了\
  \ OCB 的第二个版本 OCB2。OCB1 和 OCB3 虽然非常相似，但看起来是安全的。\n\n### 一次扇 (One-time pad)\n通常被描述加密的典范或完美密码，因为它在数学上被证明是绝对安全的。但单独使用一次扇实际上是一种弱密码：它是轻易延变的、未认证的且不抗误用的。\n\
  \n### 单向函数 (One-way function)\n现代密码学的基石。易计算难反转：对于随机未知 `x` 的 `f(x)`，寻找一个值 `y` 使得\
  \ `f(y) = f(x)` 在计算上是困难的。（正式定义比这更严谨。）如果你只有一个单向函数，就可以构建大多数密码原语；在实践中，密码学中的许多函数（如哈希函数）看起来是单向的。但在理论上，我们并没有证明单向函数确实存在。事实上，单向函数的存在意味着\
  \ P ≠ NP（证明留给你完成）。\n\n### Onion-AE\n在 Tor 洋葱路由背景下，强认证加密的概念。在洋-AE 加密中，消息的真实性必须在最后一个（出口）节点检查，但它涵盖了从初始发送者的整个路径。\n\
  \n### OPAQUE\n发音为 *O-PAKE*。O 代表盲 PRF，它是 OPAQUE 密码认证密钥交换（PAKE）中最有趣的部分。它允许客户端在只知道两个值中的一个（其密码）的情况下计算这两个组合的哈希。存在一些注意事项：尽管认证是关于证明密码知识，但客户端还需要传统的公钥对，因此必须保护其私钥。此外，为了获得具有安全密钥共享的完整\
  \ PAKE，它必须与另一种协议结合，例如 `HMQV`。\n\n参见 *盲知 PRF (OPRF)*。\n\n### OpenSSL\n\n\n\n\n这是最重要的加密软件之一。首先它是一个命令行工具，支持多种加密操作（密钥生成、签名、加密、证书创建、各种格式的编码/解码等），适用于多种算法（块密码、哈希函数、椭圆曲线等，以及旧遗留算法）及其参数，并且可以运行在多种\
  \ CPU 类型和操作系统上。\n\n如果这还不够，OpenSSL 还提供了两个库：加密库（`libcrypto`）和 SSL 及 TLS 协议的实现（`libssl`），后者使用了\
  \ `libcrypto`。\n\n# OPENSSL 的厨房 (OPENSSL’S KITCHEN)\n\nOpenSSL 就像一家 24 小时候营业的餐厅，提供汉堡、披萨，以及日本寿司、法国红酒鸡、墨西哥塔可和瑞士瑞士奶锅。要让所有的菜肴达到同样的质量水平是非常困难的。\n\
  \n这意味着厨房里一定一团糟。正如密码学教授马修·格林（Matthew Green）曾所说：\n\n`OpenSSL 是加密库中的航天飞机。它能带你进入太空，前提是你有一支团队来按下操作所需的数万个按钮。`\n\
  \n## 预机 (Oracle)\n\n就像水晶球一样，一个响应你请求的抽象实体，密码学家称之为“预机查询”（oracle queries）。\n\n加密预机的概念源于复杂度理论中的“预机”（oracles），例如，你尝试使用一个\
  \ `oracle` 来解决问题 1，该预机在给定问题 2 描述的情况下，神奇地给出问题 2 的解决方案。例如，给定一个分解预机，你可以破解 RSA。\n\n\
  ### 预机 85 (Oracle 85)\n\n预机是研究论文中使用的一种抽象，作为简化安全论证、证明或密码分析攻击的设备。你可能会遇到加密预机、解密预机、分解预机等。随机预机（Random\
  \ oracles）由于其在安全性证明中的独特作用而最为常见。\n\n参见 `随机预机` (Random oracle)。\n\n## OTR (不记录加密 Off-the-Record)\n\
  \n最初为同步通信设计的端到端加密协议。能够运行在消息协议（如 XMPP 或 IRC）之上。OTR 的一个独特之处是它的否认性（deniability），对方可以通过泄露用于签名消息的\
  \ MAC 密钥来否认发送过该消息。OTR 是后来被称为 Signal 协议的基础。\n\n## P\n\n### 填充预机攻击 (Padding oracle\
  \ attack)\n\n一类旁信道攻击，利用关于某些加密消息的填充（padding）是否有效的信息。攻击者可以通过测量解密执行时间来获取这些信息，而解密时间有时取决于填充的正确性。最常见的填充预机攻击是应用于\
  \ CBC 块密码模式的攻击、针对 PKCS#1 v1.5 的 Bleichenbacher 攻击，以及针对 OAEP (PKCS#1 v2) 加密的 Manger\
  \ 攻击。填充预机的概念可以泛化为格式预机（format oracles），它们会揭示解密消息中是否存在某些已知模式（例如，特定的编码或字符集）。\n\n开发者有时会无意中部署（或缺乏）填充预机攻击的防御措施——即当某些实现没有正确检查填充时（但这会产生其他问题）。\n\
  \n参见 `Bleichenbacher 攻击` (Bleichenbacher attack)、`CBC (密码块链)` (CBC (cipher block\
  \ chaining))、`Manger 攻击` (Manger attack)。\n\n### 86 OTR (不记录加密 Off-the-Record)\n\
  \n### Paillier 加密系统 (Paillier cryptosystem)\n\n一种在数学上比 RSA、ElGamal 和 IES 更有趣的公钥加密方案。Paillier\
  \ 加密具有稀有的加法同态性属性，这意味着 `Dec(Enc(M 1) × Enc(M 2)) = M 1 + M 2`。它的安全性基于分解问题的困难性以及一个相关问题——判定复合剩余数问题（decisional\
  \ composite residuosity problem），该问题随 Paillier 加密系统引入，关于在给定 `n` 和 `y` 的情况下，判断是否存在\
  \ `x` 使得 `y = xd mod n2`。\n\n## 配对 (Pairing)\n\n与蓝牙的配对操作无关。配对是一个将两个群元素映射到另一个群元素的映射\
  \ `e()`，具有以下属性，对于任何 `R`，`S`, `T`：`e(R + S, T) = e(R, T) e(S, T)`。这被称为双线性（bilinearity），也是配对在密码学中有用的原因。这些属性也适用于双线性配对：`e(S,\
  \ -T) = e(-S, T) = e(S, T)-1`，`e(aS, bT) = e(S, T) *ab`。配对的 Diffie–Hellman 问题的双对应形式如下：给定\
  \ `P`, `aP`, `bP`, `cP`，找到 `e(P, P) *abc`。对于选择良好的配对类型和椭圆曲线，这个问题被认为与其经典版本一样困难。\n\n\
  ## 基于配对的密码学 (Pairing-based cryptography)\n\n使用配对的密码学，废话。椭圆曲线上的配对允许创建双线性映射，这允许你在某些困难性假设下构建基于离散对数的经典椭圆曲线加密无法实现的功能。这些功能包括单轮三方密钥协商、基于身份的加密、基于属性的加密、短签名和可验证随机函数。\n\
  \n### 基于配对的密码学 87 (Pairing-based cryptography 87)\n\n### 三方密钥协商 (TRIPARTITE KEY\
  \ AGREEMENT)\n\n密码学家开始在密码学中使用配来实现仅需一轮通信的三方密钥协商。通过配对，工作原理如下，给定一个公共基点 `P`：\n\n1. Alice\
  \ 生成一个整数 `a` 并广播 `aP`。\n2. Bob 生成一个整数 `b` 并广播 `bP`。\n3. Chris 生成一个整数 `c` 并广播 `cP`。\n\
  \n然后 Alice 计算共享密钥为 `e(bP, cP) * a = e(P, P) * abc`。Bob 和 Chris 执行类似的操作以获得相同的值。\n\
  \n## PAKE (密码认证密钥交换 password-authenticated key exchange)\n\n一种认证密钥协商（或交换）协议，其客户端验证依赖于密码的知识。在大多数\
  \ PAKE 中，服务器不知道密码，只知道从中派出的数据。双方都知道密码的 PAKE 称为平衡 PAKE（balanced PAKEs）。\n\nPAKE 防止在发送密码或哈希值的密钥交换方法中常见的密码猜测攻击。\n\
  \n但这种微小的收益代价是巨大的：PAKE 增加了复杂性和部署成本，这就是它们很少被使用的原因。正如马修·格林所写的：“很多人根本不想运行`密钥交换`协议！他们只想验证用户是否知道密码。”\n\
  \n## 范式 (Paradigm)\n\n密码学中一个过度使用的词，特别是当它前面有 `new` 时。\n\n## 密码哈希函数 (Password hash\
  \ function)\n\n一种目标是慢而不是快的哈希函数。\n\n### 为什么密码哈希是不安全的 (WHY PASSWORD HASHES ARE INSECURE)\n\
  \n如果 `M` 是一个任意位字符串，那么给定一个哈希值 `H = Hash(M)`，你永远找不到 `M`。原因是：1) 如果 `H` 足够长，寻找 `H` 的任何原像在计算上是不可行的；2)\
  \ 即使具有无限计算能力，你也无法在所有映射到 `H` 的值中识别出 `M`，根据鸽巢原理，这是不可能的。\n\n但如果你知道 `M` 是由人类选择的密码，检索它就会变得容易得多。你可能找到一个哈希值为\
  \ `H` 的密码 `M`，并有理由相信它就是最初被哈希的密码，因为可记忆的密码远少于 `H` 的可能值。换句话说，作为未知输入值，典型密码的熵远比任意字符串\
  \ **P**\n\n低。\n\n### 88 PAKE (密码认证密钥交换 password-authenticated key exchange)\n\n\n\
  \n\n\n你对设置密码的人了解越多，这种操作就越容易，密码的熵也就越低。例如，如果你知道此人是一个住在田纳西州的 65 岁女性，你可能会尝试一组特定的密码；而如果此人是一个\
  \ 20 岁的瑞士男士，你会尝试另一组。结果是，在给定哈希值的情况下，密码非常容易破解：你只需要反复对可能的密码进行哈希计算，并将结果与给定的哈希值进行比较即可。\n\
  \n我们使用的缓解措施非常笨，，但有效：我们没有使用安全且高效的哈希函数，而是使用了一个安全但低效的函数——计算速度慢，有时还会消耗大量内存（这使得在使用 GPU\
  \ 或专用硬件时破解密码变得更加困难）。\n\n### PBKDF2 (基于密码的密钥派生函数 2)\n\n一种基于密码的密钥派生函数，该标准的第二个版本。`PBKDF2`\
  \ 是穷人的密码哈希。在经过足够迭代次数调优后，它在大多数情况下都是够用的，但它没有 `Argon2` 那么酷炫。\n\n### PCT (私有通信技术)\n\n\
  微软的安全通信协议。`PCT` 在 20 世纪 90 年代中期与 `SSL v3` 竞争。`PCT` 旨在解决 `SSL v2` 的缺陷，同时保持一定的兼容性。但只有微软使用了它，它最终在全球范围内被\
  \ `SSL v3` 或 `TLS` 取。\n\n### PEP (明文等效证明)\n\n一种检查两个密文是否为相同值的加密的协议。参与者无法作弊。\n\n###\
  \ 完美前向安全性\n\n参见 *前向安全性 (Forward secrecy)*。完美前向安全性 89\n\n### 基于排列的密码学\n\n利用单排列提供其他功能的密码学方案。它基于与\
  \ `Keccak` 哈希函数相关的研究。\n\n#### 基于排列的密码学百科\n\n来自 `Keccak` 扩展家族的基于排列的密码学包含许多构造、模式和原语，我们已尝试在下面的子字典中对其进行编目：\n\
