- pgno: 403
  md: '# Smarter, faster prep for the CCSP exam


    # Interactive learning environment


    (ISC) CCSP Certified Cloud Security Professional Official Practice Tests, Second
    Edition is your hands-on guide that boosts your confidence and gives you the opportunity
    to test your level of preparedness for the CCSP exam. Filled with nearly 1,000
    practice questions (complete with answers and explanations) the tests cover all
    the CCSP exam domains. Organized in a logical sequence by domain, the tests help
    you review only the areas you need to reconsider without spending time on the
    topics you clearly understand!


    Take your exam to the next level with Syb''s superior online study tools. Access
    our learning environment, simply visit www.wiley.com/go/sybextestprep, to register
    your unique PIN, and instantly gain one year of FREE access to the interactive
    test bank with nearly 1,000 total questions!


    Coverage of 100% of all exam objectives in these practice tests you''ll be ready
    for:


    +   - Cloud Concepts, Architecture, and Design

    - Cloud Data Security

    - Cloud Platform and Infrastructure Security

    - Cloud Application Security

    - Cloud Security Operations

    - Legal, Risk, and Compliance


    # ABOUT THE AUTHOR


    The CCSP is the premier cloud security certification from (ISC². This vendor-neutral
    certification validates IT and cloud security professionals'' knowledge and competency
    to apply best practices to cloud security architecture, design, and service orchestration.
    It shows you''re on the forefront of cloud security. (ISC)² is a global nonprofit
    nonprofit organization that maintains the Common Body of Knowledge for information
    security professionals. Candidates must have experience, adhere to the (ISC)²
    Code of Ethics and maintain continuing education requirements or certify every
    three years.


    Ben Malaisow, CCSP, SSCP, CISSP, CISM, Security+, has worked with INFOSEC and
    education for more than 20 years. He has taught computer classes to students from
    grade 6 through university level and delivered the CCSP prep course (among others)
    for Carnegie-Melon University''s CERT/SE. In addition, Malaisow built and ran
    DARPA''s internal INFOSEC training program, was the ISM for the FBI''s most-classified
    counterintelligence intelligence-sharing network and was a security architect
    for TSA. He also teaches exam prep courses for (ISC². You can find more of his
    writings at his blog: secureized.com.


    Visit www.isc2.org to learn more.


