    of dealing with the risk, if we use the formula for determining annualized loss
    expectancy (ALE).


    First, we need to determine the single loss expectancy (SLE) and annualized rate
    of occurrence (ARO). ARO can be assumed as 1; absent any other information about
    the plant, we don''t expect more than one fire per year (and perhaps less, but
    we don''t have that information, either). The SLE is $36 million ($24 million
    for the cost of rebuilding the plant, assuming no increase in costs over the previous
    construction, $2 million per month of lost revenue, for the six months it will
    take to rebuild).


    Therefore, the ALE is $36 million [SLE] x 1 [ARO].


    Either the fire suppression system or the insurance policy would be appealing,
    from a strictly financial standpoint, if we only compared the ALE to the annualized
    cost of the counter ($15 million for the suppression system, $12 million for the
    insurance policy).


    However, other factors have a bearing on this consideration too. For instance,
    fire poses a threat to life and human safety; avoiding such risks should be a
    paramount concern to senior management. An insurance policy doesn''t truly protect
