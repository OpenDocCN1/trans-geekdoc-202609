- pgno: 10
  md: '# About the Author


    Ben Malisow, CISP, CISM, CCSP, Security+, has been involved in INFOSEC and education
    for more than 20 years. At Carnegie Mellon University, he crafted and delivered
    the CISSP prep course for CMU''s CERT/SEU. Malisow was the ISM for the FBI''s
    most highly classified counterterror intelligence-sharing network, served as a
    U.S. Air Force officer, and taught grades 6-12 at a reform school in the Las Vegas
    public school district (probably his most dangerous employment to date). His latest
    work has included the CCSP (ISC)² Certified Cloud Security Professional Official
    Study Guide, Second Edition, also from Syex/Wiley 2017, and How to Pass Your INFOSEC
    Certification Test: A Guide to Passing the CISSP, CISA, CISM, Network+, Security+,
    available from Amazon Direct 2017. In addition to other consulting and teaching,
    Ben is a certified instructor for (ISC², delivering CISSP and CCSP courses. You
    can find more information about the CCSP and other INFOSEC-related topics at his
    blog, www.securityized.com.'
