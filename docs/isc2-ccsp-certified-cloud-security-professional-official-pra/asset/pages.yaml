- pgno: 16
  md: '# Introduction


    There is no magic formula for passing the Certified Cloud Security Professional
    (CCSP) certification exam, just as there is no single source that will prepare
    you sufficiently to pass the actual test. You can, however, prepare yourself for
    the challenge. This is all about preparation.


    We''ve included more than 1,000 questions related to the CCSP material in this
    book, which also includes access to the online database (the same questions in
    a point-and-click format). They were created in accordance with the (ISC)² CCSP
    Common Body of Knowledge (CBK), the CCSP Training Guide, the Official CCSP Study
    Guide, Second Edition, and the CCSP Exam Outline, which is also referred to as
    the CCSP Exam Outline (www.isc2.org/~/media/ISC2/Certifications/Exam-Outlines/CCSP-Exam-Outline.ashx),
    which lists all the elements of practice that the candidate is expected to know
    for certification.


    The questions in this book are not necessarily indicative of what you''ll see
    on the actual CCSP exam. Instead, these questions are intended for study purposes,
    to help you review and understand the concepts that you may be tested on when
    you take the certification exam. Be aware that some of these questions may be
    easier, and some may be harder, than what you''ll be faced with if you try to
    become a CCSP.


    # How This Book Is Organized


    The questions have been arranged in the order of the CBK, with varying amounts
    in proportion to the (ISC)² published matrix describing how the exam is constructed,
    as shown in Table I.1.


    | TABLE I.1 How the exam is constructed | |

    | Domains | Weight |

    | 1. Cloud Concepts, Architecture, and Design | 17% |

    | 2. Cloud Data Security | 19% |

    | 3. Cloud Platform and Infrastructure Security | 17% |

    | 4. Cloud Application Security | 17% |

    | 5. Cloud Security Operations | 17% |

    | 6. Legal, Risk, and Compliance | 13% |'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# Introduction


    There are six chapters, one for each of the CBK domains; each chapter contains
    a

    fraction of the hundreds of practice questions, reflecting the questions from
    the respective

    domain on the exam (for example, Chapter 1 reflects Domain 1 of the CBK and has
    over

    100 questions). There are also two full-length practice exams, 125 questions each,
    at

    end of the book (Chapters 7 and 8).


    # Who Should Read This Book


    This book is intended for CCSP candidates. To earn the CCSP, you are expected
    to have

    professional experience in the field of information security/IT security, particularly
    experii-

    related to cloud computing. Candidates will also need to provide evidence of their-

    fessional experience to (ISC)² in the event of passing the exam.


    The author has drawn on his own experience studying for and passing the exam as
    well

    as years of teaching the Certified Information Systems Professional (CISSP) and

    CCSP preparation courses for (ISC)². He also solicited feedback from colleagues
    and former

    students who have taken the prep course and the exam. The book should reflect
    the breadth

    d depth of question content you are likely to see on the exam. Some of the questions

    in this book are easier than what you will see on the exam; some of them may be
    harder.

    Hopefully, the book will prepare you for what you might encounter when you take
    the test.


    The one thing I chose not to simulate in the book is the "interactive" questions;
    (ISC)

    st that the current tests may go beyond the regular multiple-choice format and
    could

    include "matching" questions (a list of multiple questions and multiple terms,
    where the candi-

    ate to arrange them all in order), drag-and-drop questions (where the candidate
    uses the

    mouse to arrange items (on screen), and "hot spot" questions (where the candidate
    uses

    the to point at specific areas of the screen to indicate an answer). There will
    probably

    not be many of these on you take, but they are weighted more in your score than

    the multiple-choice questions, so pay attention and be careful answering those.


    # Tools You Will Need


    In addition to this book, I recommend the CCSP (ISC)² Certified Cloud Security

    Professional Official Study Guide, Second Edition, also from Wiley (2019). There,
    is,

    stated in this introduction, no magic formula for passing the exam. No single
    particular

    source or with all the answers to the exam exists. If someone claims to be able
    to pro-

    vide you with such a product, realize that they are mistaken or, worse, misleading
    you.


    However, you can augment your studying by reviewing a significant portion of the
    likely

    sources used by the professionals who created the test. The following is just
    a sampling of

    the possible professional resources the cloud practitioner should be familiar
    with:


    +   * The Security Alliance''s Notorious Nine

    https://downloads.cloudsecurityalliance.org/initiatives/top-threats/

    Theotorious_Nine_Cloud_Computing_Top_Threats_in_2013.pdf

    * Notorious Nine'
  merge: -1
  img_proc: true
