    # CCSP Certified Cloud Security Professional Objective Map


    Domain 1 Cloud Concepts, Architecture, and Design


    +   - 1.1 Understand cloud computing concepts


    +   - 1.1.1 Cloud computing definitions


    +   - 1.1.2 Cloud computing roles (e.g., cloud service customer, cloud service
    provider, cloud service partner, cloud service broker)


    +   - 1.1.3 Key cloud computing characteristics (e.g., on-demand self-service,
    broad network access, multitenancy, rapid elasticity and scalability, resource
    pooling, measured service)


    +   - 1.1.4 Building block technologies (e.g., virtualization, storage, networking,
    data-bases, orchestration)


    +   - 1.2 Describe cloud reference architecture


    +   - 1.2.1 Cloud computing activities


    +   - 1.2.2 Cloud service capabilities (e.g., application capability types, platform
    capabi-ility types, infrastructure capability types)'
  merge: -1
  img_proc: true
