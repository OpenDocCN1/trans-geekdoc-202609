    and personnel necessary to maintain the OSs would offset that, probably in a negative
    way. SaaS is not an option; Alice wants have her company to build software, not
    rent it or buy it. Backup as a Service (BaaS) would not be useful for creating,
    designing, or deploying Alice''s company''s software.


    +   2. Of these four options, multicancy poses the greatest risk to software developers
    in the cloud, because developers need (the software they''re making) to be concerned
    with two things: protecting their intellectual property and protecting resource
    makes to the underlying infrastructure (which, if detectable by other cloud customers,
    could provide information that constitutes a side-channel attack). Metered service
    doesn''t pose much of a security risk. The SLA might include some security aspects
    (such as response time), but it''s usually more of a performance-enhancing tool,
    and this is not as good as option A. Remote access, in this particular case, provides
    more benefit than risk: Alice can utilize work from developers located across
    the country or across the planet. Alice also has to consider the risks inherent
    in all remote access, those risks are not as significant as the risks due to multicancy,
    so option A is still preferable.


    +   3. Turnstiles are a physical security barrier to prevent piggybacking/tailgating
    (an unauthorized person coming through an entrance behind who is authorized),
    but they don''t really provide protection for intellectual property in this. Egress
    monitoring (often referred to as “DLP”) is a great way to reduce the likelihood
    of intellectual property leaving the owner''s control in an unexpected/unauthorized
    manner. Likewise, encryption is useful in the cloud to reduce the impact of either
    from leakage to other cloud tenants or from insider threats (such as malicious
    admins in the employ of the cloud provider). Finally, digital watermarks aid of
    intellectual property by proving original ownership, which is essential for enforcing
    intellectual property rights (in the case of software design, mainly copyright
    protections).


