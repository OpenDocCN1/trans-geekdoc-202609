- pgno: 122
  md: '# 106 Deep Learning in Computer Vision


    In this work, the architecture of the proposed CNN involves a combination of convolutional
    layers and sub-sampling max-pooling. The top layers in the proposed CNN are two
    fully connected layers for the multi-class classification purpose. Then, the output
    of the last connected layer is fed into the Softmax classifier, which produces
    a probability distribution over the N class labels. A cross-entropy loss function,
    a suitable loss for the classification task, is used to quantify the agreement
    between the predicted class scores and the target labels, and to calculate the
    cost for different configurations of CNN. On the other hand, the architecture
    of the proposed DBN stacks are more of RBMs (as hidden layers). The first N-1
    layers of the network can be seen as feature detection layers. The last layer
    of the network is trained as a discriminative model associated with Softmax classifier
    for the classification task. Finally, the hidden layers of the proposed DBN are
    trained using an unsupervised greedy-wise algorithm (e.g, the CD learning algorithm),
    in which the stacked RBMS are trained one at a time in a bottom-to-top manner.
    The proposed deep learning approaches (e.g., CNN and DBN) are trained using a
    powerful methodology equipped with a number of training strategies and techniques
    (e.g., Back-propagation, AdaGrad Data augmentation, etc.), to avoid overfitting
    and increase the generalization ability of the FaceDeepNet system. For more details
    on how the proposed CNN and DBN are trained, the reader is referred to [55, 7].
    Finally, as all the employed classifiers produce the same type of output (similarity
    score), and all of them have the same numeric range [0, 1], no normalization procedure
    is needed before applying the score fusion method. In this work, the weighted
    sum rule is used to fuse the matching scores produced by the proposed CNN and
    DBN.


    # 4.5 EXPERIMENTAL RESULTS


    In this section, the performances of the proposed unimodal approaches (e.g., using
    FDT-DRBM, DBN, and CNN) and multi-biometric approaches (e.g., using FaceDeepNet)
    are tested on the most challenging face datasets currently available in the public
    domain in order to demonstrate their effectiveness and compare the performances
    with other face recognition approaches. A brief description of the face datasets
    used in these experiments is given. Then, an elaborated evaluation and comparison
    with the state-of-the-art face recognition approaches in both face identification
    and verification tasks are presented. In addition, some insights and findings
    revealing learning additional and complementary feature representations by training
    the proposed deep learning approaches on top of local feature representations
    are presented. The system code was written to run in MATLAB R2018a and later versions.
    The recognition time of the proposed approaches was measured by implementing them
    on a personal computer with the Windows 10 operating system, a 3.60 GHz Core i17-4510U
    CPU, and 16 GB of RAM. It should be noted that the recognition times of the proposed
    approaches are proportional to the number of registered subjects and their images
    in the database. However, the test time is less than 4 seconds on average, which
    is fast enough to meet the demands of real-world applications. Finally, the matching
    scores obtained from the multi-biometric face recognition systems are combined
    using different fusion methods at the score level'
