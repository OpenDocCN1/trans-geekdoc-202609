    # 2.2.3 Faster R-CNN


    To increase the detection speed, researchers discover that the region proposal
    computation is the bottleneck of performance improvement. Before fast R-CNN, the
    time taken at the second stage is significantly more than at the proposal stage.
    Considering that selective search [40] works robustly and is a popular method,
    improving region proposal seems unnecessary. However, with the improvement in
    fast R-CNN, selective search is now an order slower compared to classification
    stage. Even with some proposal methods that are balanced between speed and quality,
    region proposal stage still costs much as the second stage. To solve this issue,
    Ren et al. [33] introduced a Region proposal network (RPN), which shares the feature
    map of the entire image with stage two.


    The first step in Faster R-CNN is a shared network. The RPN then takes the shared
    feature maps as input and generates region proposals with scores indicating how
    confident the network is that objects are in them. In the RPN, a small network
    will slide over the input feature map as indicated in Figure 2.3. Each sliding
    window will generate a lower-dimensional vector. This lower-dimensional vector
    will be the input of two sibling fully connected layers, a bounding-box regression
    layer (reg), and a bounding-box classification layer (cls). To increase the nonlinearity,
    Rectified Linear Units (ReLUs) are applied to the output of the CNN layer. k proposals
    will be generated. Correspondingly, the reg layer will have 4k outputs for bounding-box
    coordinates, and the cls layer will have 2k probabilities of object/not-object
    for each bounding-box proposals. k proposals are parameterized relative to k reference
    boxes, called anchors. The parameters include the scales and aspect ratio.'
