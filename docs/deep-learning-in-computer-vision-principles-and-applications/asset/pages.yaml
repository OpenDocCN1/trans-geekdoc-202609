- pgno: 43
  md: "# Accelerating the CNN Inference on FPGAs\n\nIn the simplest version of fixed-point\
    \ arithmetic, all the numbers are encoded with the same fractional and integer\
    \ bit-widths. This means that the position of the radix point is similar for all\
    \ the represented numbers. In this chapter, we refer to this representation as\
    \ static F×P.\n\nWhen comparing to floating-point, F×P is known to be more efficient\
    \ in terms of hardware utility and power consumption. This is especially true\
    \ in FPGAs [79], where – for instance – a single DSP block in Intel devices can\
    \ either implement one 32-bit floating-point multiplication or three concurrent\
    \ FP multiplications of 9 bits [8]. This motivated FPGA implementations such as\
    \ [61, 80] to employ fixed-point arithmetic in deriving CNN accelerators. These\
    \ implementations mainly use a 16-bit Q8.8 format, where 8 bits are allocated\
    \ to the integer parts, and 8 bits to the fractional part. Note that the same\
    \ Q8.8 format is used for representing the features and the weights of all the\
    \ layers.\n\nIn order to prevent overflow, the former implementations allow expand\
    \ the bandwidth when computing sums of convolutions. Equation 1.31 explains how\
    \ the bit-width is expanded; if $b_x$ bits are used to quantify the input FM and\
    \ $b_{\theta}$ bits are used to quantify the weights, an accumulator of $b_{acc}$\
    \ bits is required to represent a weighted sum of $C_iK_i^T$ elements, where:\n\
    \n```\n$b_{acc} = b_x + b_{\theta} + \\max_{\\log_2(C_iK_i^T)}$\n```\n\nIn practice,\
    \ most FPGA accelerators use 48-bit accumulators, such as in in [59, 60] (Figure\
    \ 1.9).\n\n![](img/be8864cedd9a2fb32f3521f7cd37aa21_43_0.png)\n\nFIGURE 1.9 Fixed-point\
    \ arithmetic for CNN accelerators."
  merge: -1
  img_proc: true
- pgno: 44
  md: '# 1.6.1.2 Dynamic Fixed Point for CNNs


    In deep topologies, it can be observed that distinct parts of a network have significantly
    different ranges of data. In particular, the features of the deep layers tend
    to have a much larger numerical range when compared to the features of the first
    CNN layers.


    The histograms of Figure 1.10a depict this phenomenon for AlexNet convolutional
    layers. While static inputs (data column) normalize their values between 0 and
    1, the outputs of the first convolutional layer (conv1 column) have a wider numerical
    range, between $2^{-7}$ and $2^7$. This is even more salient for the fifth convolutional
    layer, where most of the outputs take their values between $2^{-3}$ and $2^6$.
    The same problem appears when comparing the numerical ranges of the CNN weights,
    and CNN activations. In this case, the weights are numerically much smaller compared
    to the activations, as illustrated in Figure 1.10b.


    As a consequence, large bit-widths have to be allocated to the integer fractional
    parts in order to keep a uniform precision across the network while preventing
    overflow. This vastly expands the resource requirements of a given FPGA mapping.
    As a result, static FxP, with its unique shared exponent, is ill-suited to deep
    learning, as pointed out in [81]


    To address this problem, works in [77, 81, 82] advocate the use of dynamic FxP
    [83]. In dynamic FxP, scaling factors are used to process different parts of the
    network. In other words, the position of the radix point varies from one layer
    to


    ![](img/be8864cedd9a2fb32f3521f7cd37aa21_44_0.png)


    (a) Histogram of the layer outputs


    ![](img/be8864cedd9a2fb32f3521f7cd37aa21_44_1.png)


    (b) Histogram of weights and activations. Inputs and weights encoded in 8 bits


    Figure 1.10 Distribution of AlexNet activations and weights.


    * Code made available at github.com/KamelAbdelouah/CNN-Data-Distribution.

    † This deliberately multiplies the weights and activations by a scale factor of
    $2^7 - 1$ to emulate 8-bit quantization.

    † Another approach to address this problem is to use custom floating point representations,
    as detailed in [31].'
