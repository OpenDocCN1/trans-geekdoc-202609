    # 6.6.2 RESULTS ANALYSIS AND DISCUSSION


    # 6.6.2.1 Depth Experiments


    Table 6.1 shows that depth augmentation consistently improves results. There is
    an improvement of 5.7% in mean IoU. Although the overall improvement is incremental,
    there is a large improvement for certain classes; for example, trucks, vans, buildings,
    and traffic lights show improvements of 32%, 29%, and 8% respectively. Table 6.2
    shows quantitative evaluation of 1% in IoU. Results show that even noisy depth
    maps with invalid values lead to depth estimation errors which can improve semantic
    segmentation. Results on Virtual KITTI shows that concatenated feature maps provides
    better results on Virtual KITTI shows that concatenated feature maps provides
    better results using added feature maps. In Cityscapes, results for both approaches
    are quite close, the results from the monoDepth [69] estimator using concatenated
    feature maps show slightly higher performance than those from added feature maps,
    which leads to the same conclusion of the KITTI dataset.


    Figure 6.11 illustrates qualitative results for the Cityscapes dataset. Figure
    6.9 (g) shows better detection of the white van in the background, which has a
    uniform texture; depth augmentation has helped to detect it. Figure 6.11 (f) illustrates
    better detection of the bus compared to RGB-only detection and detection of vegetation
    compared to depth, while showing degraded performance for the poles in the background,
    due to the noise shown in the depth map; the image is shown in Figure 6.11 (b).
    Figure 6.11 (g) shows more immunity to noise regarding the background poles compared
    to Figure 6.11 (f) due to greater flexibility obtained from concatenated feature
    maps.


    Depth-only network is reported to study the performance of depth alone on semantic
    segmentation. Surprisingly, depth provides good results especially for road, vegetation,
    vehicle, and pedestrians. This is also consistent with the results obtained by
    [70], when depth-only is tested for indoor scenes. Although the depth-only network
    shows shows only incremental improvement. It is likely that using a simple network
    architecture does not effectively combine depth and RGB, as they are completely
    different modalities with different properties. Another possible reason is that
    the network trained on RGB has the ability to learn geometric scene structure
    only implicitly.


