  md: '# 4.2.2 Learning-Based Approaches


    Inspired by their ability to learn more discriminative feature representations,
    considerable attention has been paid recently to deep learning approaches, such
    as CNN. The main advantage of the deep learning approaches over handcrafted-descriptor
    approaches is their ability to learn from experience and their robustness in handling
    nonlinear variations of face images caused by pose variations, self-occlusion,
    etc. [29]. Moreover, in contrast to handcrafted-descriptor approaches, the applications
    using of deep learning approaches can generalize well to other fields. Some recent
    examples belonging to this category were proposed by Sun et al. A face recognition
    system, called Deep Identification-verification features (DeepIDD2), is presented
    in [28]. In this work, two supervisory signals (e.g., the face identification
    and verification signals) were combined simultaneously to boost the discriminative
    power of extracted features using CNNs. A verification rate of 99.15% was achieved
    using the “Unrestricted, Labeled Outside Data” evaluation protocol. The same group
    of researchers developed the deep CNNetRBM model based on a combination of a set
    of CNNs and a restricted Boltzmann model (RBM) model for face verification in
    the wild environment [30]. Verification rates of 91.75% and 92.52% were achieved
    on the LFW and CelebFaces databases.


    Taigan et al. [31] proposed the DeepFace framework for face verification using
    the frontal images generated from a 3D shape model of a large-scale face data
    signal to train the proposed framework. They proposed to use the Softmax function
    on the top of the CNN as the supervisory signal. Experiments on the LFW database
    using the “Unrestricted, Labeled Outside Data” setting yielded a verification
    rate of 97.35%. In the literature, several metric learning approaches have been
    proposed to address the face verification problem, including Multimodal Deep Face
    Representation (MM-DFR), Information-Theoretic Metric Learning (ITML), Discriminative
    Deep Metric Learning (DDML) [35], Pairwise-constrained Multiple Metric Learning
    (PPML), Logistic-based Metric Learning (LM), Large Scale Metric Learning (LSML)
    [37], and Cosine Similarity Metric Learning (CSML) [38]. The key limitations of
    deep learning approaches include requiring a large amount of training data to
    avoid the overfitting problem and increase the generalization ability of the neural
    network, and the number of hyper-parameters need to be set. The DNNs usually depend
    on a tedious iterative optimization procedure that can be computationally expensive
    for large-scale databases.


    Finally, a number of approaches have been proposed to address the problem of the
    multi-biometric face recognition system. For instance, Peng et al. [39] have proposed
    a novel graphical representation-based HFR method (G-HFR) to address the heterogeneous
    face recognition (HFR) problem. The HFR problem refers to identifying the person''s
    identity using face images captured from different sources (e.g., different sensors
    or wavelengths). The same research group has also added another face recognition
    task, known as cross-modality face recognition. This task aims to match face images
    across different modalities, including matching sketches with real photos, low-resolution
    face images with high-resolution images, and'
