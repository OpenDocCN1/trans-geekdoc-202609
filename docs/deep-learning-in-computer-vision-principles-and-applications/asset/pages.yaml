    represents the residual mapping to be learned. The dimensions of $x$ and $F$ must
    be equal.


    Because Resnet50 contains 177 layers and 192 × 2 connections, a detailed part
    of Resnet50 has been shown in Figure 11.3. Furthermore, Table 11.3 shows different
    layers with their associated output size and the building blocks.


    # 11.3.3 TRANSFER KNOWLEDGE FOR DEEP NEURAL NETWORK


    In traditional neural networks, utilization of these networks is restricted by
    the type of the trained data. In other words, the neural networks are not able
    to classify data if the tested and trained data are different. To overcome this
    problem, the transfer knowledge, also called transfer learning methodology, is
    used with the DCNN. Transfer learning was developed as an alternative learning
    system to solve this problem [34]. In transfer learning, we must inquire about
    the knowledge that could be transferred. For example, Alex-net [29] and Resnet50
    [44] were trained using the ImageNet [30] to classify images into 1000 classes.
    Transfer learning means the ability to use Alex-net and Resnet50 to classify different
    kinds of images with different training classes. To achieve this process, we need
    to define which knowledge or information could be transferred and learning algorithms
    should be used in the knowledge transfer. The relationship types of transfer learning
    and traditional machine learning are summarized in Table 11.4.'
