  md: '# Deep LSTM-Based Sequence Learning Approaches


    # 5.3 RESULTS AND DISCUSSION


    In this section, we compare the results achieved by different action and recognition
    methods on benchmark datasets. Detailed comparisons of state-the-art techniques
    are given in Table 5.2. The listed LSTM-based approaches are given in chronological
    order, starting with the most recent. As can seen from Table 5.2, the latest approach
    [36] used recurrent attention CNN, incorporating CNNs and LSTM with an attention
    mechanism. Using this method, the authors achieved 94.8% and 71.9% accuracy on
    UCF-101 [37] and HMDB-51 [38], respectively. The CNN-based temporal optical flow
    features followed by multi-layer LSTM [1] achieved scores of 94.45% and 72.1%
    on UCF-101 and HMDB51 datasets, respectively. This method improved the computational
    performance of the activity recognition system by the lightweight FlowNet2 CNN
    model for feature extraction. Another approach [29] uses relational LSTM, which
    captures long-short ranges among the objects in the video data. This work achieved
    scores of 94.8% and 71.9% on UCF-101 and HMDB-51, respectively. A list of popular
    action and activity datasets is given in Table 5.3, and sample categories are
    given in Figure 5.1. These datasets contain human actions collected from YouTube
    and other datasets representing real-life action categories.


