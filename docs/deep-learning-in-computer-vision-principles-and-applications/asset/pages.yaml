    sum_{j=1}^n c_jh_j \\quad (4.1)\n```\n\n $\\sigma_i$ is the standard deviation\
    \ of the Gaussian noise for the visible unit $v_i$, $w_{ij}$ represents the weights\
    \ for the visible unit $v_i$ and the hidden unit $h_j$, and $b_i$ and $c_j$ are\
    \ biases for the visible and hidden units, respectively. The conditional probabilities\
