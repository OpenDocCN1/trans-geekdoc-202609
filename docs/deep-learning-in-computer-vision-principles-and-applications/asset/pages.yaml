- pgno: 47
  md: "# Accelerating the CNN Inference on FPGAs\n\n# 1.6.2.1 Weight Pruning\n\nAs\
    \ highlighted in [94], CNNs as overparameterized networks and a large amount of\
    \ the weights can be removed – or pruned – without critically affecting the accuracy.\
    \ In its simplest form, pruning is performed according to the magnitude, such\
    \ that the lowest values of the weights are truncated to zero [95]. In a more\
    \ recent approach, weight removal is driven by energy consumption of a given node\
    \ of the graph, which is 1.74x more efficient than magnitude-based approaches\
    \ [96]. In cases, pruning is followed by a fine-tuning of the remaining weights\
    \ in order to improve the classification accuracy. This is for instance in [97],\
    \ where pruning removes respectively 53% and 85% of the weights in AlexNet conv\
    \ and FC layers for less than 0.5% accuracy loss (Figure 1.12).\n\n# 1.6.2.2 Low\
    \ Rank Approximation\n\nAnother way to reduce the computations in CNNs is to maximize\
    \ the number of separable filters. A 2D-separable filter, denoted $\theta^{sep}$,\
    \ has a unitary rank*, and can be expressed as two successive 1D filters ($\t\
    heta^{sep}_{1}$ and $\theta^{sep}_{2}$). Filter decomposition reduces the number\
    \ of multiplications from $J \\times K$ to $J+K$. This is illustrated in Figure\
    \ 1.13, where the $3 \\times 3$ averaging filter is separable, and can thus be\
    \ decomposed into two successive one-dimensional convolutions.\n\n![](img/be8864cedd9a2fb32f3521f7cd37aa21_47_0.png)\n\
    \nFIGURE 1.12 Histogram of conv weights in a compressed AlexNet model.\n\n![](img/be8864cedd9a2fb32f3521f7cd37aa21_47_1.png)\n\
    \nFIGURE 1.13 Example of a separable filter.\n\n> * Meaning that rank($\theta^{sep}$)\
    \ = 1.\n\n> † Pruned filters treated as zero-valued weights."
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Deep Learning in Computer Vision


    The same concept expands to deep convolutions, where a separable filter requires
    C+J+K multiplications instead of C×J×K multiplications.


    Nonetheless, only a small proportion of CNN filters are separable. To increase
    this proportion, a first approach is to focus the convolution kernels to be separable
    by penalizing high-rank filters when training the network [98]. Alternatively,
    or after the training, the weights Θ of a given layer can be approximated into
    a small set of r low-rank filters. In this case, r×(C+J+K) multiplications are
    required to process a single double convolution.


    Finally, CNN convolutions can be reduced further by decomposing the weight matrix
    Θ through single-value decomposition (SVD). As demonstrated in the early works
    of [99], SVD greatly reduces the resource utilization of a given 2D-filter implantation.
    Moreover, SVD finds its interest when processing FC layers and convolutions that
    employ the im2col method (cf Section 1.4.1). In a similar way to pruning, low-rank
    approximation or SVD is followed by a fine-tuning to counterbalance the drift
    in classification accuracy.


    # 1.6.2 FPGA Implementations


    In FPGA implementations, SVD is applied on FPGA to significantly reduce the number
    of weights, as seen in [28], where the authors develop a VGG16-SVD model that
    achieves 86.9% accuracy on ImageNet with 63% fewer parameters.


    Alternatively, one can take advantage of the numerous research efforts to accelerate
    Sparse GEMM on FPGA [100]. In this case, the challenge is to determine the optimal
    format of matrices that maximizes the chance to detect and skip zero computations,
    using sparse column (CSC) or compressed row (CSR) formats. Based*, Sze et al.
    [22] advocate the use of the CSR to process CNN. This format requires lower memory
    bandwidth when the output matrix is smaller than the input, which is typically
    the case in CNNs where N<CJK, as in Figure 1.3b.


    However, this efficiency of CSR format is valid only for extremely sparse matrices
    (typically ≤1% of non-zeros), but in practice, pruned CNN matrices are not sparse
    (typically, 24%–80% of non-zeros). Works in [7] propose a zero skip scheduler
    that identifies zero elements and skips them in the scheduling of the MAC process.
    As a consequence, the number of cycles required to compute the sparse GEMM is
    reduced. For AlexNet layers, the zero skip scheduler results in a 4x speed. The
    authors project a throughput of 12 TOPs for pruned CNN in the next Intel Stratix10
    FPGAs, which outperforms the computational throughput of state-of-the-art GPU
    implementations.


    # 1.7 CONCLUSIONS


    In this chapter, a method of methods and tools have been compared that aim at
    porting convolutional neural networks onto onto FPGAs. At the network level, computing
    and data-path optimization methods have been covered, while


