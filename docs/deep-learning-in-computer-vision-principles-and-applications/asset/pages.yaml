    # 5.1.5 GATED RECURRENT UNIT


    Two dominant variants of RNNs have been introduced by researchers: LSTM [22] and
    GRU [24]. The LSTM contains gated recurrent units, including the input, forget,
    output gates, and memory cell, while the GRU consists of the reset gate, update
    gate, and activation unit. The structure of LSTM is more complex and contains
    gates and memory cell, resulting in more computation to process a sequence. On
    the other hand, GRU involves only two gates, which makes it applicable for processing
    real-time sequential data. However, many researchers have reported LSTM as more
    effective than GRU [24].


    # 5.2 ACTION AND ACTIVITY RECOGNITION METHODS


    Over the last decade, researchers have presented many handcrafted and deep-based
    approaches for action recognition. The earlier work was based on handcrafted features
    for non-realistic actions, where an actor did perform some actions in a scene
    with a background. Such systems extract low-level features from the video data
    and feed them to a classifier such as SVM, decision tree, and k-Nearest Neighbors
    (KNN) for action recognition. Current methods utilize video data for action and
    activity recognition. For instance, action recognition framework is proposed by
    Ull et al. [22], where they used CNN features followed by bidirectional LSTM (DB-LSTM)
    for sequence learning. They extracted features from every frame of the video input
    to reduce the time complexity and redundancy. The sequential information extracted
    from these frames is inputted to the DB-LSTM network. Multiple layers are stacked
    in both forward and backward pass in order to increase the network depth and make
    it capable of learning long-term sequences. The framework of DB-LSTM is shown
    in Figure 5.4.


    Another method proposed by Ullah et al. [1] is for action recognition in industrial
    surveillance environments. Their framework is visualized in Figure 5.5. First,
    they divided the continuous surveillance video stream into important shots using
    the proposed CNN-based salient features. The next, temporal features of activity
    in the sequence of frames are extracted by utilizing the convolutional layers
    of a FlowNet2 CNN model. Finally, a multi-layer LSTM is presented for learning
    long-term sequences in the temporal optical flow features for activity recognition.


    The method proposed by Li et al. [25] selected discriminative parts in spatial
    dimension, as they split the videos into multiple clips with fixed-length frames
    in the temporal direction and used the sliding windows to generate cubes in the
    spatial direction. The cubes are extracted using the C3D network, then they designed
    the part method to select useful cubes and utilized the max-pooling function to
    generate the representation of clips. Finally, the representation of clips was
    fed into two layers of the LSTM network to train the multiple LSTM and the Softmax
    layer, which yielded the prediction by using the feature vector generated from
    the LSTM network.'
