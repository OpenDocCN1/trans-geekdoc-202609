    arithmetic. Works in [68] follow the same unrolling scheme and feature a 16-bit
    fixed-point arithmetic, resulting in a $x2.2$ improvement in terms of computational
    throughput. Finally, the same unrolling and tiling scheme is employed in recent
    work [48], where authors report a de-coupled pipelined FPGA cluster of four Virtex-7-VX960
