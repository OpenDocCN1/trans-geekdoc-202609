- pgno: 9
  md: '# Preface


    Simply put, computer vision is an interdisciplinary field of artificial intelligence
    that aims to guide computers and machines toward understanding the contents of
    digital data (i.e., images or video). According to computer vision achievements,
    the future generation of computers may understand human actions, behaviors, and
    languages similarly to humans, carry out some missions on their behalf, or even
    communicate with them in an intelligent manner. One aspect of computer vision
    that makes it an interesting topic of study and active research field is the amazing
    diversity of daily-life applications such as pedestrian protection systems, autonomous
    driving, biometric systems, the movie industry, driver assistance systems, video
    surveillance, and robotics as well as medical devices and other healthcare applications.
    For instance, in healthcare, computer vision algorithms may assist healthcare
    professionals to precisely classify illnesses and cases; this can potentially
    save patients'' lives through excluding inaccurate medical diagnoses and avoiding
    erroneous treatment. With this wide variety of applications, there is a significant
    overlap between computer vision and other fields such as machine vision and image
    processing. Scarcely a month passes where we do not hear from the research and
    industry communities with an announcement of new technological breakthrough in
    the areas of intelligent systems related to the computer vision field.


    With the recent progress on convolutional neural networks, deep learning has achieved
    remarkable performance in various fields. In particular, it has brought a revolution
    to the computer vision community, non-traditional and efficient solutions to several
    problems that had long remained. Due to this promising, it is gaining more and
    attention and is being applied widely in computer vision for various tasks such
    as object detection and recognition, object segmentation, pedestrian detection,
    aerial imagery registration, video processing, scene classification, autonomous
    driving, and robot localization as well medical related applications. If the phrase
    "deep learning for computer vision" is searched in Google, millions of search
    results will be obtained. Under these circumstances, a book titled Deep Learning
    in Computer Vision that covers recent progress and achievements in utilizing deep
    learning for computer vision tasks will be extremely useful.


    The purpose of this comprehensive volume is to fill the existing gap in the literature
    for the applications of deep learning in computer vision and to provide a bird''s
    eye view of recent state-of-the-art models designed for problems in computer vision.
    The book presents a collection of high-quality chapters written by renowned experts
    in the field. Each chapter provides the principles and fundamentals of a specific
    topic, introduces reviews of up-to-date techniques, presents outcomes, and points
    out challenges and future directions. In each chapter, figures, tables, and examples
    are used to improve the presentation and analysis of covered topics. Furthermore,
    bibliographic references are included in each chapter, providing a good starting
    point for deeper research and further exploration of the topics considered in
    this book. Further, this book is structured such that each chapter can be read
    independently from the others as follows:'
