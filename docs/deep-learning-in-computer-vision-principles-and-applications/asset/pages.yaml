    # 8.3.4 SPATIOTEMPORAL VISION


    The processing of video and other spatiotemporal sources of information is of
    importance in robotics. Classical methods related to spatiotemporal vision require
    engineering subtasks such as motion detection, optical flow, local feature extraction,
    or image segmentation. Deep learning has the potential to change the current paradigm
    of spatiotemporal vision from hand-engineering complex subtasks to solving tasks
    as a whole. The increment in video datasets and computational power will enable
    the analysis of spatiotemporal data at real time, but only in the future. Then,
    spatiotemporal vision will be a goal of robot vision as well as computer vision
    research.


    The use of short video sequences for object recognition is an alternative for
    improving image-based techniques. In [84], a convolutional LSTM is proposed for
    processing video sequences containing about frames, for robotic perception. The
    system is shown to improve on the baseline (smoothing CNN results from individual
    video images), and it is able to run at 0.87 fps when using a GPU.


    Human recognition is an area that can be greatly benefit from using video sequences
    instead of isolated images. Research dealing with recognition of human actions
    includes [85–93], which driver activity anticipation is performed. In various
    studies, information from multiple frames is integrated by several CNNs for each
    frame, by using LSTM or Dynamic Time Warping. The C3D method [90] is able to run
