    # 5.1 INTRODUCTION


    Human action and activity recognition is one of the challenging areas in computer
    vision due to the increasing number of cameras installed everywhere, which enables
    its numerous applications in various domains. The enormous amount of data generated
    through these cameras requires human monitoring for identification of different
    events and activities. Smart surveillance, through which normal and abnormal activities
    can be automatically identified using artificial intelligence and computer vision
    technologies, is needed in this era. It has vast demand due to its importance
    in real-life problems like detection of abnormal and suspicious activities, intelligent
    video surveillance, elderly care, patient monitoring in healthcare centers,'
