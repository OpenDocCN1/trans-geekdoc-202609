    # 5.1.3 Multi-LAYER LSTM


    The performance of most deep neural networks can be boosted in terms of accuracy
    by increasing the number of layers in the neural models. The same strategy is
    followed by LSTM by stacking multiple LSTM layers to the network. By adding deep
    layers, it captures a higher level of sequence information [16]. In standard RNN,
    data is fed to a single layer for activation and processing before output, but
    in time sequence problems, we need to process data on several layers to capture
    hierarchical patterns. By stacking LSTM layers, each layer in the network is a
    hierarchy that receives the hidden state of the previous layer as input. Figure
    5.3 shows a two-layer LSTM. Layer 1 receives input from data $x_t$, while the
    input of layer 2 is its previous time step $s_{t-1}^{(2)}$, the output of the
    current time step of layer 1, $s_t^{(1)}$. The computation of the multi-layer
    LSTM is the same as single LSTM cell, but each layer''s information is added to
    the superscript of each $i$, $h_i, f_o, c_o$, and $s_o$. The procedure for calculating
    the state of the layer is as follows:


    > $s_t'' = \tanh(c_t'') \cdot o_t''$


    # 5.1.4 Bidirectional LSTM


    In bidirectional LSTM, the output at time $t$ is dependent not only on the previous
    frames in the sequence, but also on the upcoming frames [23]. Bidirectional LSTMs
    are quite simple, having two recurrent units, one stacked on top of the other.
    One recurrent unit goes in the forward direction and the other goes in the backward
    direction. The combined output is then computed based on the hidden state of both
    recurrent units. The input data is fed to the bidirectional LSTM, and the hidden
    states of forward pass and backward pass are combined in the output layer. The
    cost'
