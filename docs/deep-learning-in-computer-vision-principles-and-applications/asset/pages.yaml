- pgno: 161
  md: '# Deep LSTM-Based Sequence Learning Approaches


    summarization [54], etc. The dominance of these models is that they are trained
    on large-scale image datasets, which helps to learn discriminative hidden local
    and global representations from visual data.


    # 5.4.2 Multiple Actions and Activity Recognition


    Several action recognition methods exist, but we can see that these methods are
    applicable for processing single-person action data effectively. The existing
    methods are trained on UCF101, UCF sports, and HMDB51 datasets; in these datasets,
    only one person is performing an activity in sample videos. From Table 5.1, we
    can see that only one LSTM-based method addresses the problem of multiple activity
    recognition in video data. In CCTV, multiple activities are performed in a single
    scene. So in the future, this task needs to be tackled by detecting and localizing
    the individual in the video data and then further processing for activity recognition.
    Localization and tracking are very challenging tasks in group activity recognition,
    for which we can use deep learning-based object detection and localization models
    such as YOLO [55], faster RCNN [56], MobileNet SSD [48], etc.


    # 5.4.3 Utilization of Large-Scale Datasets


    The existing datasets utilized by researchers are very small and not sufficient
    for deep learning models from scratch, although there exist several large-scale
    video action and activity recognition datasets that can be utilized for effective
    recognition. Table 5.3 shows some of the popular datasets in the action and activity
    recognition literature. The first three datasets are already used by many researchers
    and have achieved good results, shown as utilizing ActivityNet [41], Kinetics
    [42], AVA [43], YouTube [44], Sports-IM [45], and Moments in Time [46], we can
    recognize a larger number of activities and actions through a single recognition
    model.


    # 5.5 CONCLUSION


    Human action and activity recognition is the problem of analyzing and predicting
    the movements of human body parts in sequence of video frames. In this chapter,
    we have described the concept of sequence learning for action and activity recognition
    using LSTM and its variants such as multi-layer or deep LSTM and bidirectional
    LSTM networks. Moreover, recent LSTM-based methods for action and activity recognition
    are surveyed, and its achievements and drawbacks are discussed. We also explained
    the working of traditional RNNs and their limitations, along with why LSTM is
    better than RNN. Finally, the chapter concluded with recommendations for future
    directions that may help overcome the present challenges of action and activity
    recognition using LSTM.


