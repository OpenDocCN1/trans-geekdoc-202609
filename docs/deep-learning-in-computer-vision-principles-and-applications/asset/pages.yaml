  md: '# Applications of Deep Learning in Robot Vision


    real time and be responsive; and (iii) several processes robot vision must be
    executed in parallel. These conditions are needed for robot to behave and complete
    tasks autonomously in the real world, as these tasks commonly involve time constraints
    for being solved successfully. Then, the computational workload is a crucial component
    that must be considered when designing solutions for robot vision tasks.


    In the following sections, recent advances based on deep learning related to robot
    vision and future challenges are described. As stated before, deep neural networks
    require a considerable amount of computational power, which currently limits their
    usability in robotics applications. However, the development of new processing
    platforms for massive parallel computing with low power consumption will enable
    the adoption of a wide variety of deep learning algorithms in robotic applications.


    # 8.3 ROBOT VISION METHODS


    In this section, recently published studies presented at flagship journeys, robotics
    conferences, and symposium are described and analyzed. The works have been categorized
    in four areas: *Object Detection and Categorization*, *Object Grasping and Manipulation*,
    *Scene Representation and Classification*, and *Spatiotemporal Vision*. The most
    representative works and the observed tendencies related to the use of deep learning
    for addressing robot vision problems in each area are described in the next sections.
    It is important to note that many of the described works have not been validated
    in real robots operating under real-world conditions, but only in databases corresponding
    to robot applications. In these cases it is not clear whether the proposed methods
    can work in real time using a real robot platform.


    # 8.3.1 OBJECT DETECTION AND CATEGORIZATION


    Object detection and categorization is a fundamental ability in robotics. It enables
    a robot to execute tasks that require interaction with object instances in the
    real world. Deep learning is already being used for general-purpose object detection
    and categorization, as well as for pedestrian detection, and for detecting objects
    in robotics soccer. State-of-the-art methods used for object detection and categorization
    are based on generating object proposals, and then classifying them using a deep
    neural network (DNN), enabling systems to detect thousands of different object
    categories. As will show, one of the main challenges for the application of DNNs
    for object detection and characterization in robotics is real-time operation.
    It must be stressed that obtaining the required object proposals for feeding the
    DNNs is not real time in the general case, and on the other hand, general-purpose
    object detection and categorization methods based on DNNs are not able to run
    in real time in robotics platforms. These challenges are addressed by using task-dependent
    methods for generating few, fast, and high-quality proposals for a limited number
    of possible object categories. These methods are based on using other sources
    for segmenting the objects (depth information, motion, color, etc.), and by using
    object-specific, non-general-purpose, weak detectors for generating the required'
