  md: '# 11.5 EXPERIMENTAL RESULTS


    The experiments are performed with IBM-compatible computer equipped with a Core
    i5 processor. Two datasets with color images defined in RGB space are used. The
    datasets are divided into two classes, melanoma and nevus. Parallelization of
    the implemented code in CUDA and using the GPU allowed use of a larger number
    of examples for the training process, consequently provided a large gain in the
    generalization error of the models. The classification layer has been replaced
    by the multiclass SVM, where a fast-linear solver is compatible with the two classes
    of skin images: melanoma and nevus. Two types of experiments were performed. The
    first type was performed with high-quality microscopic images from the dataset
    [14], while the second type was performed with low-quality images acquired by
    the camera with unconstrained and varying environmental factors, which include
    such noise as harsh and other factors.


    Each experiment consisted of a number of runs where the batch size, number of
    training epochs (a measure of the number of times to use all trainers to update
    the weights), and the initial learning rate were 10, 40, and 0.001, respectively;
    these values were fixed for all experiments. The images were randomly divided:
    85% of the images were for training and 15% of the images were for testing. All
    images from the two datasets were preprocessed to segment the region [39]. The
    proposed model was evaluated using three metrics, namely, accuracy, sensitivity,
    and specificity [40], as follows:


    Accuracy = \frac{t_p + t_n}{t_p + f_p + f_n + t_n}


    Sensitivity = \frac{t_p}{t_p + f_n}


    Specificity = \frac{t_n}{f_p + t_n}


    Where, $t_p, f_p, f_n$, and $t_n$ refer to true positive, false positive, false
    negative, and true negative, respectively. The false-positive rate should be relatively
    small and the true negative rate should be large, resulting in most points falling
    in the left part of the receiver operating characteristic (ROC) curve [41].


