  md: 'Moreover, data augmentation is applied to patches after training. The patches
    are rotated randomly, which helps the model to distinguish different objects with
    different orientations. They are also flipped horizontally and vertically. On
    the whole, these techniques create more data to be used in training, which increases
    the model accuracy.


    # Optimization Algorithm: The optimization algorithm chosen was the Adaptive Moment
    Estimator (ADAM) [29]. It''s known to be an update to RMSProp [30] and is widely
    acknowledged to be superior to. By keeping the exponentially decaying average
    of all past gradients, ADAM is able to create an adaptive learning rate for all
    network parameters. In early experiments, ADAM converged much faster than stochastic
    gradient descent and ADAM [31].


    Loss Function: The loss function used Dice''s coefficient, which is also known
    as the Sørennsen index [32]. Basically, Dice''s coefficient finds the similarity
    of objects in image segmentation by finding the overlap between a ground-truth
    and the output provided by a method.


    ```

    Dicescore = \frac{2TP}{2TP + FP + FN} \(7.5)

    ```


    Where

    TP: True Positive

    FP: False Positive, and

    FN: False Negative.


    As shown in Equation 7.2.3, the Dice score is calculated by finding the positives
    and penalizing the false positives as well as positives the method could not find.
    Dice is similar to the Jaccard index [33], which is another commonly used loss
    function for image segmentation. Dice is currently favored over being more intuitive,
    which only counts positives once in both the numerator and denominator.


    Regularization and Normalization: To avoid overfitting, regularization using dropout
    layers was added after every convolutional layer with a value of 0.05. After every
    dropout layer, a batch normalization layer was also added to normalize the activation
    of each batch.


    Network Initialization Using Transfer Learning: Training from scratch is computationally
    expensive in terms of processing and time. Transfer learning is especially relied
    upon to reduce the training time and in case of small datasets. In fact, it is
    difficult to have a dataset that be capable of truly deep networks. Models trained
    on large datasets, such as ImageNet [27], contain generic weights that can be
    used in different tasks. The pre-trained model is trained using a random image
    generator that also creates the ground-truth for those images.


