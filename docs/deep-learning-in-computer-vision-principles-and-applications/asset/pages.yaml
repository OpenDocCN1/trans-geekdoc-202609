    # 10.3.4 TRAINING AND TESTING


    Biomedical deep learning applications suffer from the lack of medical data [62].
    One reason is the cost and complexity of the labeling procedure during data acquisition
    [72]. To overcome the challenge of insufficient training data in the field of
    skin lesion dermatology, we employed two mechanisms, data augmentation as described
    above and transfer learning [54, 57, 62, 72–75]. For transfer learning, we utilized
    the pre-trained network weights from VGG-16 [67] using the public ImageNet database
    [76]. Subsequently, the FrCN segmentation technique was fine-tuned or retrained
    using the augmented training data of the dermoscopy images. Regarding the optimization
    of the FrCN, a separate validation dataset consisting of 150 dermoscopy images
    was utilized. Therefore, the evaluations of the optimization network and the final
    network performance were performed independently utilizing the validation and
    test datasets, respectively. This procedure is called an unbiased double cross-validation
    scheme, and is more commonly used and reliable than the trial-and-error process
    in the most recent deep learning methods [77, 78].


    To ensure generalization of deep learning architectures and avoid overfitting
    to training data, deep learning networks must be trained, validated, and tested
    using'
