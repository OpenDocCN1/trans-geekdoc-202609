    (RIDER) [86]. The dataset consists of 109 normal images and 240 abnormal images.
    We show a sample image of the specifications of the training and testing subsets
    developed in the experimental work in Figure 9.4. Table 9.3 provides the specifications
    of the training and testing subsets. We proposed the DCNN code in a Jupyter notebook
    using Keras and TensorFlow tools. The machine is equipped with an Intel Core i7
    processor that works at 3.2 GHz with 24 GB of RAM and the Ubuntu desktop 64-bit
    experimental environment.


    # 9.8.2.2 Evaluation Criteria


    Several metrics test classification algorithms. These metrics can be categorized
    as scalar metrics, such as accuracy (ACC), geometric mean (GM), sensitivity (or
    recall), specificity (or inverse recall), and positive prediction value (PPV)
    (precision), and graphical metrics, such as detection error trade-off (DET), precision-recall,
    and receiver operating characteristics (ROC) curves. We present most of these
    metrics in this section with details.


