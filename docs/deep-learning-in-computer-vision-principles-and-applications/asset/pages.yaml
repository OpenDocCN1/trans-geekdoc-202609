    Deep Learning with Computer Vision


    # 6.4.1 Depth ESTIMATION


    Depth is a very important cue that implies the distance between surrounding objects
    and the vehicle, and it is critical for autonomous driving applications. Knowing
    only semantics without depth is not enough for full environment perception [65].
    In addition to depth sensors that have their own pros and cons, depth can be estimated
    using several approaches utilizing cameras without further more expensive sensors
    (e.g., LiDAR). The most common method for camera-based depth estimation is based
    on stereo images using the SGM algorithm [58], where pixels from the left image
    are searched for the right image across the epipolar lines. Disparity is calculated
    using a cost function that also guarantees the smoothness of the output. Disparity
    is the difference between positions of a feature that is viewed from two different
    cameras looking the same scene with different viewpoints. Depth has a nonlinear
    relationship with disparity and the absolute value can be calculated if camera
    information is available. However, disparity maps using classical approaches are
    usually noisy; depth estimation itself is topic of research and deep learning
    has been used extensively through multiple architectures for the purpose of of
    providing better depth estimation.


    Depth estimation using deep learning has been tackled through several approaches
    [66, 67], which can be classified as supervised, semi-supervised, and unsupervised
    methods. Each approach has its pros and cons. For example, supervised approaches
    generally provide better performance than unsupervised ones. Unsupervised approaches
    have the feasibility to be trained without explicit depth annotations; however,
    they usually provide less accuracy than unsupervised ones. Generally, supervised
    approaches require depth annotation, which requires use of semantic datasets.
    In [68], ego-motion fusion is used to exploit temporal information. The depth
    network takes only the target view as input and a pixel-wise depth map is generated.
    The pose network takes the target view and the source views as input and generates
    relative camera poses. The outputs are used to inverse-warp the source views to
    reconstruct the target view in an unsupervised manner. View synthesis is used
    for task, where a target image can be synthesized given a pixel-wise depth map
    of image, in addition to pose and visibility in a nearby view. Hence, unsupervised
    training is performed. Goddard et al. [69] formulated depth estimation as an unsupervised
    learning problem where epipolar constraints are exploited to generate disparity
    by training the network for image reconstruction loss. This approach has the advantage
    of using only stereo information for training in the unsupervised manner, while
    in cases of inference, only monochromatic images are needed.


    Apart from color, depth is another dimension for which the impact on semantic
    segmentation has not been explored extensively. Most of the previous work using
    depth for semantic segmentation made using RGB-D cameras for indoor scenes. Hazrabiras
    et al. [70] investigated incorporating depth into semantic segmentation for indoor
    use using only RGB-D cameras on the SUN RGB-D dataset. In [71], depth and RGB
    were combined for multi-view semantic segmentation where the previous work was
    leveraged to rewarp different views. Lin et al. [72] used a fully convolutional
    network (FCN) with branch predictors to process layered discretized depth maps
    to match'
