  md: '# 54 Deep Learning in Computer Vision


    be easily classified as background, which means little information will be added
    to the model. Since the number of them is dominating, it will overpower other
    foreground candidates, resulting in degenerating models. A regular cross-entropy
    (CE) loss for binary classification is shown in Equation 2.2.


    ```

    CE(p,y) = -log(p_y), \text{where } p_y = \begin{cases} p, & \text{if } y=1 \ 1-p,
    & \text{otherwise} \end{cases} (2.2)

    ```


    To reduce the imbalance between the easy background and hard foreground samples,
    Lin et al. [36] introduced the focal loss.


    ```

    FL(p) = -(1-p_y)''log(p_y) (2.3)

    ```


    When a sample is misclassified with a high score, $p$ will have small value. Therefore,
    the loss is not affected that much. But when a sample is correctly classified
    with a high confidence, $p$ is close to 1, which will significantly weigh down
    its effect. In addition, a weighting factor $a$ is employed to balance the importance
    of positive/negative examples.


    ```

    FL(p,y) = -a(1-p_y)''log(p_y) (2.4)

    ```


    Both models in this section address the problems encountered during experiments.
    ResNet [35] has become one of the most widely used backbone networks. Its model
    is provided in most of the deep learning frameworks, such as Caffe, PyTorch, Keras,
    MXNet, RetinaNet [36] achieves remarkable performance improvement with minimal
    addition in computational complexity by designing a new loss. More importantly,
    it shows a new direction in optimizing the detector. Modifying evaluation metrics
    could result in significant accuracy increase. Rezatofighi et al. [57] in 2019
    proposed Generalized Intersection-over-Union (GIoU) to replace the current IoU
    and used GIU as the loss function. Before the study of Rezatofighi et al. [57],
    all CNN detectors calculate IoU to evaluate the result, employing other metrics
    as loss function during training to optimize. Other detectors proposed after 2017
    mainly focus on detecting objects at various scales, especially at small scale
    [52, 58, 60]. Among them, the trend in design is refinement based on previous
    successful detectors [59, 37].


    # 2.5 PERFORMANCE COMPARISON ON DIFFERENT DATASETS


    In this section, we will present some evaluation results for different models
    on three benchmark datasets: PASCAL VOC [25], MS COCO [26], and VisDrone-DET2018
    [61].


    # 2.5.1 PASCAL VOC


    The PASCAL VOC [25] dataset is one of the pioneering works in generic object detection,
    which is designed to provide a standardized testbed for object detection,'
