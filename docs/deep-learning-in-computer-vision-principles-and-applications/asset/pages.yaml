    # Loop Tiling


    In general, the capacity of on-chip memory in current FPGA is not large enough
    to store the weights and intermediate FM of all CNN layers*. For example, AlexNet''s
    convolutional layers resort to 18.6 Mbits of weights, and generate a total 70.7
    Mbits of intermediate feature maps. In particular, the highest-end Stratix V FPGA
    provides a maximum of 52 Mbits of on-chip ram.


    As a consequence, FPGA-based accelerators resort to external DRAM to store these
    data. As mentioned in Section 1.2.4.3, DRAM access is costly in terms of energy
    and latency, and data caches must be implemented by means of on-chip buffers and
    local registers. The challenge is to build a path in every way that data transferred
    from DRAM is reused as much as possible.


    For conv layers, this challenge can be addressed by tiling the nested loops of
    Listing 1.1. Loop tiling [66] divides the FM and weights of each layer into multiple
    groups that can fit into the on-chip buffers. For the configuration in Figure
    1.5c, the size of the buffers containing input FM, and output FM is set according
    to the tiling factors listed in Table 1.4.


