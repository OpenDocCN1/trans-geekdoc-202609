  md: '# 212 Deep Learning in Computer Vision


    recognition, just to name a few, most of the competitive methods are now based
    on the use of deep neural networks. In addition, most recent presentations at
    the flagship conferences in this area use methods that incorporate deep learning.


    Deep learning has already attracted the attention of the robot vision community.
    However, given that new methods and algorithms are usually developed within the
    computer vision world and then transferred to the robot vision one, the question
    is whether or not deep learning solutions to computer vision and recognition problems
    can be directly transferred to robotics applications. This transfer is not straightforward
    considering the multiple requirements of current solutions based on deep neural
    networks in terms of memory and computational resources, furthermore, following
    [12] it may be considered that robot vision applications have different requirements
    from standard computer vision applications, such as real-time operation with limited
    on-board computational resources, and the constraining observational conditions
    derived from the robot geometry, limited camera resolution, and sensor/object
    relative position.


    Currently, there are several reviews and surveys related to deep learning [1–7].
    However, they are not focused on robotic applications, and they do not consider
    their specific requirements. In this context, the main motivation of this chapter
    is to address the use of new algorithms in robotics applications. This chapter
    is intended to be a guide for developers of robot vision systems. The focus is
    on the practical aspects of the use of deep neural networks rather than theoretical
    issues. It is also important to note that convolutional neural networks (CNNs)
    [7–13] are the most commonly used deep neural networks in vision applications,
    the analysis provided in this chapter will be focused on them.


    This chapter is organized as follows: In Section 2, requirements for robot vision
    applications are described. In Section 3, relevant papers related to robot vision
    are analyzed. In Section 4, current and future challenges of deep learning in
    robotic applications are discussed. Finally, in Section 5, conclusions related
    to current robot vision systems and their usability are drawn.


    # 8.2 REQUIREMENTS IN ROBOT VISION


    The aim of robotics is to build machines that can behave, i.e., execute tasks
    autonomously while interacting with their environment. For reaching autonomy,
    a robot must be able to perceive the environment using sensors, and to process
    the sensorial information relevant to the task to be solved. Robot vision encompasses
    algorithms that use data acquired from cameras for performing several tasks, such
    as object detection and categorization, object grasping and manipulation, representation
    and classification of scenes, and spatiotemporal vision, among others. These capabilities
    are needed for performing complex tasks in applications pick-and-place robots,
    3D mapping, automated harvesting, service robotics, and self-driving cars, just
    to name a few.


    Robotics imposes significant restrictions in the algorithms that can be used:
    (i) most autonomous robots use batteries as power sources, so hardware capabilities
    must be adapted for increasing available operation time; (ii) robots must operate
    in'
  merge: -1
  img_proc: true
