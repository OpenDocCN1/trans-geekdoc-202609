    # 2.1 INTRODUCTION


    Deep learning was first proposed in 2006 [1]; however, it did not attract much
    until 2012. With the development of computational power and a large number of
    labeled datasets [2, 3], deep learning has proven to be very effective in extracting
    intrinsic structural and high-level features. Significant progress has been made
    in solving various problems in the artificial intelligence community [4], especially
    in areas where the data are multidimensional and the features are difficult to'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'hand-engineer, including speech recognition [5, 6, 7], natural language processing
    [8, 9, 10], and computer vision [11, 12, 13, 14]. Deep learning also shows dominance
    on areas like business analysis [15], medical diagnostic [16, 17], art creation
    [18], and image translation [19, 20]. Since little human input is required, deep
    learning will continue to make more and more impact in the future with the increase
    of computing power and growing data demand.


    Among these areas, computer vision has witnessed remarkably successful applications
    of deep learning [21, 22, 23]. Vision, the most important sense in terms of navigation
    and recognition for humans, provides the information about the surroundings. Thanks
    to the rapid development of digital cameras in the 10th century, images have become
    one of the most accessible types of hardware. Researchers tend to explore the
    possibility of using computer vision in applications like autonomous driving,
    visual surveillance, facial recognition [24], etc. The demand in these areas,
    in return, demands tremendous attention and huge resources to the computer vision
    field. As a result, it is developing at a speed that has been rarely seen in other
    research fields. Every month, sometimes even a week, we have seen record performance
    on datasets like ImageNet [11], PASCAL VOC [25], and COCO [26].


    Object detection is a functional step for many computer vision applications [23,
    27, 28, 29]. The architecture of convolutional neural networks (CNN) designed
    for object detection is usually used as the first step to extract objects'' spatial
    and classification information. More modules are added for specific applications.
    For example, tracking shares a similar task to object detection with the addition
    of a temporal module. Therefore, the performance of object detection will affect
    almost all other computer vision research. A huge amount of effort has been put
    into its development [30, 31, 32].


    In this chapter, we present a brief overview of the recent developments in object
    detection using convolutional neural networks (CNNs). Several CNN-based detectors
    are presented. Some developments are based on the detector architectures [33,
    34], while others are focused on solving certain problems, like model degradation
    and small-scale object detection [35, 36, 37]. The chapter also presents performance
    comparison results of different models on several benchmark datasets. Through
    a discussion of these models, we hope to give readers a general idea about the
    developments of CNN-based object detection.


    # 2.1.1 MAJOR EVOLUTION


    To talk about object detection, we have to mention image classification. Image
    classification is the task of assigning a label to an input image from a fixed
    set of categories. The assigned label usually corresponds to the most salient
    object in the image. It works best when the object is centered and dominating
    the frame. However, many images contain multiple objects, scattering in different
    scales. One label is far enough to describe the contextual meaning of images.
    Therefore, object detection is introduced not only to output labels corresponding
    to an image but also to generate the spatial region associated with each label.'
