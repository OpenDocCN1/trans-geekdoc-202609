  md: '# Deep Learning for UAV Geolocation


    use to navigate by comparing two aerial or satellite images together trying to
    find matching structures to correct position. The second reason is to avail more
    information to the UAV, hence making aware of the types of objects it is flying
    over, which could be beneficial in route planning or decision making. This component
    builds upon the previous steps to increase the accuracy of localization and reduce
    the deviation or drift of the UAV from its planned trajectory. In this section,
    the setup of the experiment will be presented with all the different components
    and choices made for the network including the training process. Afterward, the
    metrics chosen for evaluation are presented along with a discussion of the results
    and the outcome of the experiments.


    **The Semantic Segmentation Experiment:** As a result of hardware constraints,
    many models were pre-trained for this experiment. Each region (Famagusta, Potsdam)
    has its separate model, and each class (buildings, roads, etc.) was trained separately
    using U-Net (check Section 7.2.3). The pre-trained model was trained with a random
    image generator [38] that was used to initially start the different models. The
    data was split into 224×224 pixel patches, and the patches were augmented using
    vertical, horizontal, and random rotation and fed to the U-Net.


    **Training:** Many configurations and runs have been performed for each model
    with different hyperparameters. The training is stopped when the average F1-score
    on the validation dataset stopping better scores. The average number of epochs
    for each model was 6 and each epoch took almost 3.5 hours to train.


    **Metrics:** To evaluate the semantic segmentation method, the average F1-score
    is used as an error metric on each trained class. Precision is the outcome of
    how many positive predictions were predicted in fact positive. Recall is the measure
    of how many positive predictions are predicted correctly. The F1-score is the
    average or the harmonic mean of both precision and recall.


    ```

    F1 = \frac{precision \times recall}{precision + recall} \quad (7.6)

    ```


    ```

    Precision = \frac{TP}{TP + FP} \quad (7.7)

    ```


    ```

    Recall = \frac{TP}{TP + FN} \quad (7.8)

    ```


    **Semantic Segmentation Results:** The experiment run over two regions, Potsdam
    and Famagusta. The performance of this step was evaluated experimentally using
    two ground-truth values since each city has its UAV image sequence and its satellite
    or aerial reference map as presented in Section 7.3.2. The performance of the
    semantic segmentation in our pipeline was evaluated in terms of localization.


    To evaluate the model fairly, the ISPRS Potsdam 2D Semantic Labeling Challenge
    was used as a benchmark to compare how our model performs against other work.'
