    # 10.4 RESULTS OF SKIN LESION SEGMENTATION


    # 10.4.1 SEGMENTATION PERFORMANCE ON THE ISIC 2017 TEST DATASET


    This section presents the skin segmentation performance of the FrCN against the
    latest deep learning methods, utilizing 600 dermoscopy images from the ISIC 2017
    test dataset. Quantitatively, Tables 10.4 and 10.5 summarize the performance results
    of the FrCN against FCN, U-Net, and SegNet. In this work, the segmentation of
    FCN was performed utilizing a stride of 32. Table 10.4 explores the performances
    in terms of specificity, sensitivity, and overall pixel-wise segmentation accuracy,
    while the measurements in Table 10.5 are reported in terms of the dice, Jaccard,
    and Matthew correlation indices for benign, SK, melanoma, and overall cases. The
    FrCN outperformed the FCN, U-Net, and SegNet, with overall dice, Jaccard, and
    accuracy indices of 78.08%, 77.11%, and 94.03%, respectively. The highest specificity
    for overall skin lesion segmentation was achieved by U-Net, with 97.24%.


    An analysis of the segmentation performance on the diagnostic categories of the
    skin lesion including benign, seborrheic (SK), and melanoma cases are shown in
    Tables 10.4 and 10.5. The segmentation accuracies of the benign, SK, and melanoma
    cases in the ISIC 2017 test dataset for the FrCN were 95.62%, 91.29%, and 90.78%,
    respectively. Finally, the ROC curves with the AUCs of the FrCN versus FCN, U-Net,
    and SegNet are illustrated in Figure 10.8 for each diagnostic class. The overall
    AUCs of FCN, U-Net, SegNet, and FrCN were 88.32%, 82.19%, 87.71%, and 91.04%,
    respectively. For qualitative evaluation, Figure 10.9 (a), (b), and (c) present
    exemplar segmentation results of the FrCN compared to the ground-truths for the
    benign, SK, and melanoma cases from the ISIC 2017 test dataset. The relevant bars
    in Figure 10.9 indicate the sensitivity, Jaccard index, and accuracy for each
    image. Obviously, the FrCN segmentation method provides promising results as compared
    against other methods.


