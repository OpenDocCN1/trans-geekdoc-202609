    # 4.3.4 CONVOLUTIONAL NEURAL NETWORK


    A convolutional neural network (CNN) is a feed-forward multi-layer neural network,
    which differs from traditional fully connected networks by combining a number
    of locally connected layers at automated feature recognition, followed by a number
    of fully connected layers at classification [51]. As shown in Figure 4.3, the
    CNN architecture is composed of several distinct layers, sets of locally connected
    layers (each layer contains a number of learnable kernels), sub-sampling pooling
    layers, and one or more connected layers. The internal structure of the CNN is
    associated with three architectural concepts, which make the CNN successful in
    resolving different problems in image processing, computer vision, and pattern
    recognition. The first concept is applied in both convolutional and pooling layers,
    in which each neuron receives input from a small region of the previous layer
    called the local receptive field, which is equal in size to a convolution kernel
    [53]. This local connectivity scheme ensures that the CNN produces responses to
    capture local dependencies and extracts elementary features in the input image
    (e.g., edges, curves, etc.), which can play a significant role in minimizing the
    intra-class variations and inter-class similarities and enhancing the discriminative
    power of the learned facial feature representations. Secondly, the convolutional
    layer applies the sharing parameters (weights) in order to control the model capacity
    and


