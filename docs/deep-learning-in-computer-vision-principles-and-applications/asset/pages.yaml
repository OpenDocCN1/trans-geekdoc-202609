    # 10.3.3 Full-RESOLUTION CONVOLUTIONAL NETWORKS


    In general, CNN contains two essential parts to obtain pixel-wise classification
    for segmentation: the first includes convolutional and subsampling layers and
    the second upsampling layers. Convolutional and subsampling layers represent the
    first part of these networks. The convolutional layers are in charge of extracting
    deep feature representations from the input image utilizing different filter types
    of various sizes. The subsampling layers are utilized to reduce the dimensionality
    of the extracted feature maps, but they also reduce the resolution of the feature
    maps [65, 66]. In image-wise classification tasks (i.e., image classification
    via CNNs), the'
  merge: -1
  img_proc: true
