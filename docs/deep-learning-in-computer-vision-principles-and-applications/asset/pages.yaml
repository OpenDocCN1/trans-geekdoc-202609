    Furthermore, two different sets of evaluation metrics were employed to evaluate
    the performance of each method from all perspectives. The first set of metrics
    contains true positives (accuracy), false positives, and false negatives as identified
    by Muhammad et al. [49]. Dividing the number of images identified as fire by the
    system by the number of actual fire images provides the “true positive” (TP) rate.
    “False negatives” (FN) are calculated by dividing the number of fire images identified
    as non-fire by the system by the number of actual fire images. The “false positives”
    (FP) or false alarm rate is achieved by dividing the number of non-fire images
    predicted as fire by the system by the total number of non-fire images. For better
    evaluation of the performance, another set of metrics including precision [4],
    recall, and F-measure [50] is also employed as follows:


    ```

    $Precision = \frac{TP}{(TP + FP)}$ (3.1)

    ```


    ```

    $Recall = \frac{TP}{(TP + FN)}$ (3.2)

    ```


    ```

    $F - Measure = 2 * \frac{(Precision * Recall)}{(Precision + Recall)}$ (3.3)

    ```


