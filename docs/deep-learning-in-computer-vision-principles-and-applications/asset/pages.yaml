    image classification, object segmentation, person layout, and action classification
    [62]. The latest version is PASCAL VOC 2012. It has 20 classes and 11,530 images
    in the trainval dataset with 27,450 ROI annotated objects. The initial 2007 version
    was the first with 20 classes of objects.


    To compare the performance of different networks on this dataset, we choose the
    PASCAL VOC 2007 testing results from models trained on PASCAL VOC 2007 + 2012.
    The comparison results of different models are shown in Table 2.2.


    **Link between one-stage and two-stage models.** From Table 2.2, we can tell that
    the speed advantage of the one-stage detector is obvious. The first version of
    YOLO is almost three times faster than the R-CNN detector. Looking back at the
    evolution of these detectors, we can see that every modification from R-CNN leading
    to one-stage detectors actually fits in a trend. R-CNN has two stages, with each
    having its own computations. The improvements are made by eliminating duplicate
    calculations and combining features. The final version of R-CNN could be viewed
    as one CNN network doing most of the work and some small regressors and CNN layers
    generating predictions. This architecture has become very similar to the one-stage
    model.


    **Speed and accuracy.** For the same model, if we want to achieve higher accuracy,
    speed usually needs to be compared. So it is important to find the balance for
    specific applications. The test results show two ways to modify. A more complex
    classifier or a higher-resolution image usually yields higher accuracy. At the
    same time, more time will be needed to detect the objects.


    # 2.5.2 MS COCO


    MS COCO [26] is a large-scale object detection, segmentation, and captioning dataset
    with 330,000 images. It aims at addressing three core problems under scene understanding:
    detection of non-iconic views (or non-canonical perspectives) of objects, contextual
    reasoning between objects, and 2D localization of objects. COCO defines 12 metrics
    to evaluate the performance of a detector, which gives a more detailed and insightful
    look. Since MS COCO is a relatively new dataset, not all detectors have official
    features. We only compare the performance of YOLO3 and RetinaNet in Table 2.3.
    Although the two models were tested under different GPUs, M40 and Titan X, their
    performances are almost identical [43].


    From Table 2.3, we can see that YOLO3 performs better than RetinaNet when the
    IoU threshold is 50%, at 75% IoU, RetinaNet has better performance, which indicates
    that RetinaNet has higher localization accuracy. This aligns with the effort by
    Lin et al. [36]. The focal loss is designed to put more weight on learning hard
    examples.


