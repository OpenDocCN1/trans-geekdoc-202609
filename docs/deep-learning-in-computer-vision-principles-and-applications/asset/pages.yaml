    # 1.2.4.2 Parallelism in CNNs


    The computational workload of CNNs makes their inference a challenging task, especially
    on low-energy embedded devices. The key solution to this challenge is to leverage
    the extensive extenscurrency they exhibit. This parallelism opportunities can
    be formalized as follows:


    +   * Batch Parallelism: CNN implementations simultaneously classify multiple
    frames grouped as a batch $B$ in order to reuse the filters in each layer, minimizing
    the number the memory accesses. However, and as shown in [10], batch parallelism
    quickly reaches its limits. This is due to the fact that most of the memory transactions
    result from storing intermediate results and not loading CNN parameters. Consequently,
    reusing the filters only impacts the overall processing time per image.


    +   * Inter-layer Pipeline Parallelism: CNNs have a feed-forward hierarchical
    structure consisting of a succession of data-dependent layers. These layers can
    be executed in a pipelined fashion by launching layer $(\ell)$ before ending the
    execution of layer $(\ell-1)$. This pipelining costs latency but increases


    Moreover, the execution of the most computationally intensive parts (i.e., conv
    layers), exhibits the four following types of concurrency:


    +   * Inter-FM Parallelism: Each two-dimensional plane of an FM can be processed
    separately from the others, meaning that $P_n$ of $Y^{conv}$ can be computed in
    parallel ($0<P_n<N$).'
