  md: '# Accelerating the CNN Inference on FPGAs


    # 1.2 BACKGROUND ON CNNS AND THEIR COMPUTATIONAL WORKLOAD


    In this section, we review the main features of CNNs, mainly focusing on the computations
    and parallelism patterns involved during their inference.


    # 1.2.1 GENERAL OVERVIEW


    Deep* CNNs are feed-forward, sparsely connected† neural networks. A typical CNN
    structure consists of a pipeline of layers. Each layer input is a set of data,
    known as a feature map (FM), and produces a new set of FMs with higher-level semantics.


    # 1.2.2 INFERENCE VERSUS TRAINING


    As typical learning algorithms, CNNs are deployed in two phases. First, the training
    stage uses a known set of annotated data samples to create a model with a modeling
    power (which semantics extrapolates to data outside the training set). This phase
    implements the back-propagation algorithm [11], which iteratively updates CNN
    parameters as convolution weights to improve the predictive power of the model.
    A special case of CNN training is fine-tuning. When fine-tuning a model, weights
    of a previously trained network are used to initialize the parameters of a new
    training. These weights are adjusted for a new constraint, such as a different
    dataset or reduced precision.


    The second phase, known as inference, uses the learned model to classify new data
    samples (i.e., inputs that were not seen by the model). In a typical setup, CNNs
    are trained/fine-tuned on one, large clusters of GPUs. By contrast, the inference
    is implemented each time a new data sample has to be classified. As a consequence,
    the literature mostly focuses on accelerating the inference phase. Moreover, our
    survey covers the methods employed to accelerate the inference. Since most of
    the CNN accelerators benchmark their performance on models trained for image classification,
    we focus on this chapter. Nonetheless, the methods detailed in this survey can
    be employed to accelerate CNNs for other applications such as object detection,
    image segmentation, and speech recognition.


    # 1.2.3 INFERENCE, LAYERS, AND CNN MODELS


    CNN inference refers to the feed-forward propagation of B input images across
    L layers. This section details the computations involved in the main types of
    these layers. A common practice is to manipulate layers, parameters, and FMs as
    multidimensional arrays, as seen in Table 1.1. Note that when it will be relevant,
    the type of the layer will be denoted with superscript, and the position of the
    layer will be denoted with subscript.


    * Includes a large number of layers, typically above three.


    † The information flows from the neurons of a layer l towards the neurons of a
    layer. l + I


    ‡ CNNs implement the weight sharing technique, applying a small number of weights
    across all the input pixels (i.e., image convolution).'
