    detection (CAD) is very important for medical image diagnosis. The main goal is
    to maximize the detection rate. Typically, the traditional pipeline of CAD is
    as follows:


    +   Image processing techniques are applied to the input images.

    A set of features presents the preprocessed images, such as statistical or morphological
    information.'
