- pgno: 279
  md: '# Lossless Deep Learning FrCN


    ![](img/be8864cedd9a2fb32f3521f7cd37aa21_279_0.png)


    FIGURE 10.1 Examples of challenging cases of skin lesions such as (a) low contrast,
    (b) irregular fuzzy boundaries, (c) color illumination, (d) blood vessels, (e)
    ruler mark artifact, (f) bubbles, (g) frame artifact, and (h) hair artifact. White
    line contours indicate the segmentation of the lesions by expert dermatologists.


    ruler marks, ebony frames, air bubbles, and color illumination, and natural artifacts
    such as hair and blood vessels.


    This chapter presents a new deep learning method for skin lesion segmentation
    called full-resolution convolutional networks (FrCN) [12]; this method produces
    very accurate segmentation. The FrCN method is a resolution-preserving model that
    leads to learning high-level features and improved segmentation performance. It
    directly learns the full-resolution attributes of each individual pixel of the
    input image. This is achieved by removing all the subsampling layers from the
    network. Evaluation of the efficiency and effectiveness of the FrCN segmentation
    method is performed using the well-established public International Skin Imaging
    Collaboration (ISIC) 2017 challenge dataset. In addition, the performance of the
    FrCN method is compared against well-known deep learning techniques such as U-Net,
    SegNet, and fully convolutional network (FCN) methods under the same experimental
    conditions.


    # 10.2 RELATED WORKS


    # 10.2.1 CONVENTIONAL SEGMENTATION METHODS


    In general, conventional segmentation methods for the skin lesion boundaries can
    be categorized into the following five groups:


    +   * Thresholding methods assign one or more appropriate threshold values to
    distinguish the skin lesions from the surrounding normal tissues. Pixel values
    greater than a particular threshold are placed as the foreground class, while
