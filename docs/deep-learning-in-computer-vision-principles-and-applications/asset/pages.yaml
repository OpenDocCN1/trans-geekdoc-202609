    # 11.1 INTRODUCTION


    Computer-supported skin lesion inspection and dermal investigation have been extended
    over the past decade to classify and model dermatological diseases and human skin
    [1]. Automated systems for analyzing and synthesizing human skin face different
    difficulties and complexities such as humidity and seasonal variation in temperature,
    geographically based differences in diseases, environmental factors, and hair
    presences [2]. Computerized assessment of skin lesions is an active research'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# 292


    # Deep Learning in Computer Vision


    area. The main target of this field is to create systems to analyze images of
    pigmented skin lesions for automated diagnosis of cancerous lesions or to assist
    dermatologists in this task [3]. The most important challenge in this context
    is classifying the color images of the skin lesions with highly accurate classifiers
    [4]. In terms of dermoscopic images, skin lesions fall into different categories
    based on the disease type, severity, and stage [5]. There are many algorithms
    used to extract skin lesion features [6]. The “ABCD” rule is the most known algorithm,
    where A, B, D, and C refer to lesion asymmetry, irregularity of the Border, Color
    variation, and lesion Diameter. COLOR is the most prevalent content that can be
    easily observed when retrieving images. This is due to its value in isolating
    skin lesions from wholesome [7]. However, color-based features are highly influenced
    by the condition of the patient and his/her external environment as variations
    in natural skin complexion, lighting, and camera specifications [8].


    During the last decade, there have been many studies on classifying non-melanocytic
    and melanotic lesions. These studies using statistical methods, traditional feature
    extraction, and classification methods [11–15]. Recently, deep learning has been
    raised as a promising tool for feature extraction of different models. In these
    models, many layers of neurons have been used to fill different layers to extract
    the fine details of the image, where the new layer combines the characteristics
    of the previous one. This provides the newest generic of such models, which are
    convolutional neural networks (CNNs) [16]. Applying deep learning techniques in
    healthcare research area has had positive results, as suggested by Dubal et al.
    and Kumar et al. [17, 18]. There are many studies using different learning techniques,
    as can be found in Nas-Esfan et al., Premalah and Ravichandran, and Kostopoulos
    et al. [19–22]. Various kinds of skin tumor have been found, squamous cell carcinoma,
    basal cell carcinoma, and melanoma; the last of these is the most unpredictable.
    Jain et al. [23] suggested that detecting melanoma at an early stage is helpful
    for curing it. Precisely analyzing each patient sample is a tedious task for dermatologists;
    therefore, an automated system with a high classification rate is necessary to
    assess the dangers associated with the given samples [24].


    Martin et al. [25] showed that melanoma is a highly invasive and malignant tumor
    that can reach the bloodstream easily and cause metastasis in areas. Azuly [26]
    reported that one of the hardest challenges in dermatology is to distinguish malignant
    melanotic lesions (melanoma) from non-malignant melanotic lesions (nevi), since
    both share share morphological characteristics. Melanomas may also take on features
    that may not be common to their morphology, which can lead to confused with a
    completely different disease. Goodfellow et al. [16] concluded that CNNs are the
    best tool for recognizing patterns in digital images. In this chapter, we assessed
    the existing methods for skin lesion classification, especially deep learning-based
    methods. It was observed that existing learning-based methods encounter two major
    problems that negatively affect their performance and significantly reduce their
    classification rates. First, color images of skin lesions are associated with
    complicated backgrounds. Second, the available skin lesion datasets contain a
    limited'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# Skin Melanoma Classification Using Deep CNNs


    number of images, while deep learning classification methods need a large number
    of images for good training.


    These challenges motivated us to present a new method that significantly improves
    the skin cancer classification rate and outperforms all previous methods. High
    skin lesion detection and classification rates enable dermatologists and physicians
    to make the right decisions at an earlier stage, which generally improves patients''
    health and saves their lives. The proposed method is a pretrained deep convolutional
    network-based classification system. The well-known datasets of color images of
    skin, MED-NODE, Dermatology Information System (DermIS), & DermQuest, are used
    to prove the validity of the proposed method and evaluate its performance against
    the other existing methods. The obtained results clearly show that the proposed
    method achieves the best classification rate.


    # 11.2 LITERATURE REVIEW


    This section summarizes the state of the art. By the end of this section, a table
    is presented to compare all the listed methods. Bunte et al. [7] proposed a classifying
    system. In addition to second, and third moment orders, Bunte and his coauthors
    used correlograms, coherence vectors, and histograms for the representation of
    color image analysis. A binary mask has been used by Chang et al. [9] to perform
    principal component analysis (PCA) for the classification of conventional photographs.
    They achieved a classification rate of 82.30%. In order to improve the performance
    of their system, they extracted gray-level co-occurrencebased features and used
    these features for classifying different skin lesions. Their system achieve an
    accuracy of 90.86%; Kundu et al. [10] used the local binary pattern (LBP) for
    feature extraction and developed another classification system that utilized multilayer
    perceptor, naive Bayes, and a support vector machine (SVM) for skin disease classification.
    Amerald et al. [11] proposed extracting a set of morphological high-level intuitive
    features (HLFs) of lesion border. They incorporated the HIFLs into a set of low-level
    features to get the more semantic meaning of the feature set and allow the system
    to provide an intuitive narrative for the classification decision. Their system
    achieved the classification rate of 87.38%. An automated method for skin cancer
    classification has been developed by Karabulut and Ibrikci [12]. They used the
    convolutional neural networks (CNNs) and the SVM. Texture analysis of block difference
    inverse probabilities and LBP have been used as a preprocessing step. They achieved
    a classification rate of 71.4%.


    A computer-aided (CAD) system has been proposed by Almaraz Damian et al. [13],
    where the ABCD rule is used to extract the features and SVM is used in classification.
    Their system achieved a classification rate of 75.1%. Giotis et al. [14] proposed
    a system that extracts the regions of the lesion by using the descriptors of the
    texture and the color. Jafari et al. [15] describes a guided filtering method
    in which the noise of the input images is reduced. Then, the features of skin
    lesions are extracted using the ABCD rule. This method achieved a classification
    rate of 79%. Implementation of deep learning with clinical images'
  merge: -1
  img_proc: true
