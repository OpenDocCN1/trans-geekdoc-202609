    area of research, especially in surgery-related applications. The use of deep
    learning in this application area has already begun. For instance, in [94], a
    system that is able to segment video and kinematic data for unsupervised trajectory
    segmentation of multimodal surgical demonstrations is implemented (Figure 8.4).
    The system is able to segment video-kinematic descriptions of surgical demonstrations
    successfully, corresponding to stages as “position,” “push needle,” “pull needle,”
    and “hand-off.” The system is based on a switching dynamic system, which considers
    both continuous and discrete states composed of kinematic and visual features.
    Visual features are extracted from the fifth convolutional layer of a VGG CNN
    and then reduced to 10 dimensions using PCA. Clustering on the state space is
    enabled by the system and is able to learn transitions between clusters, enabling
    trajectory segmentation. The system uses a video source with 10 frames per second;
    however, the frame rate of the full method is not reported.


    # 8.4 FUTURE CHALLENGES


    The current requirements of large computational power and memory needed for most
    CNN models used in vision applications are relevant to their adoption in resource-constrained
    robotic applications such as UAVs, humanoid robots, or autonomous vehicles. Efforts
    are already made to develop CNN architectures that can be compressed and quantized
    for resource-constrained'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Applications of Deep Learning in Robot Vision


    platforms [95, 96]. For instance, in [38] a CNN-based robot detector is presented
    that is able to run in real time, in Nao robots playing soccer. In addition, companies
    such as Intel, NVIDIA, and Samsung, to name a few, are developing CNN chips that
    will NVIDIA Tegra K1 enable efficient implementation of deep learning algorithms
    with low power consumption, which is relevant for mobile robotics [27]. It is
    expected that these methodologies will consolidate in the next few years and will
    be available to the developers of robot vision applications.


    The ability of deep learning models to achieve spatial invariance respect to the
    input data in a computationally efficient manner is another issue. Order to address
    this, the spatial transformer module (STM) was recently introduced. A self-contained
    module that can be incorporated into DNNs, and is able to perform explicit spatial
    transformation of the features. The most important characteristics of STM is that
    its transformations (i.e., the transformations of the spatial transformation)
    can be learned together with the other parameters of the network using the backpropagation
    of the loss. The further development of the STM concept will allow the required
    invariance to the observational conditions from the robot geometry, limited camera
    resolution, and sensor/object relative pose. STMs are able to deal with rotations,
    translations, and scaling [97], and STMs are already being extended to 3D transformations
    [98]. Further development of STM-inspired techniques is expected to in the next
    few years.


    Unsupervised learning is another relevant area of development for deep learning-based
    vision systems. Biological learning humans discover the structure of the world
    by exploring and observing it. Therefore, one would expect that similar mechanisms
    can be used in robotics and other computer-based systems. Until now, the success
    of purely supervised learning, which is based largely on the availability of massive
    labeled data, overshadowed the application of unsupervised learning in the development
    of vision systems. However, when considering the increasing availability of non-labeled
    data needs to be addressed, one would expect further development of unsupervised
    learning strategies for DNN models [4, 7]. In the case of robotics applications,
    a natural way of addressing this is using deep learning and reinforcement learning
    learning. This has already been applied for the learning of games (Atari, Go,
    etc.) [99, 100], for solving simple tasks like pushing a box [47], and for solving
    more complex tasks as navigating in simulated environments [77, 78], but it has
    not been used for robots learning in the wild. The visual system of most animals
    is active, it., animals in a robotics system having a similar vision approach,
    reinforcement learning can be used for deciding where to look according to the
    results of the interaction of the robot with the environment.


    A related issue is that of open-world learning [101], i.e., to learn detect new
    classes incrementally, or to learn distinguish subclasses incrementally after
    the main one has been learned. If this can be done without supervision, new classifiers
    can be built on that already exist, greatly reducing the effort required to learn
    new object classes. Note that humans are continuously'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'new objects, fashion changes, etc., and therefore robot vision systems will
    need to be updated continuously, adding new classes and/or existing ones [101].
    Some recent work has addressed these issues, based mainly on the joint use of
    deep learning and transfer learning methods [102, 103].


    Classification using a large number of classes is an important challenge to address.
    AlexNet, like most CNN networks, was developed for solving problems that contain
    ~1000 classes (e.g., ILSVRC 2012). It uses fully connected units and a softmax
    output for classification. However, when working on problems with a large number
    of classes (10,000+) in which dense data sampling is available, nearest neighbors
    could work better than other classifiers [104]. Also, the use of a hierarchy-aware
    cost function (based on WordNet) can provide more detailed information when the
    classes have redundancy [104]. However, in current object recognition benchmarks
    (like ILSVRC 2016), the number of classes has increased, and no hierarchical function
    has been used. The ability of learning systems to deal with a high number of classes
    is an important challenge that needs to be addressed for open-world learning.


    Another important area of research is the combination of new methods based on
    deep learning with classical vision methods based on geometry, which is very successful
    in robotics (e.g., visual SLAM). This topic has been addressed at recent workshops
    [105] and conferences [106]. There are several ways in which these important and
    complementary paradigms can be combined. On one hand, geometry-based methods as
    Structure from Motion and Visual SLAM can be used for the training of deep learning
    to control the visual odometry sequences; geometry-based methods can extract model
    the structure of the environment, and this structure can be used for assisting
    the learning process of a DNN. On the other hand, DNNs can be used for learning
    to control the visual odometry automatically, and eventually to learn the parameters
    of a visual SLAM system. In a very recent study, STMs were extended to 3D spatial
    transformations [98], allowing end-to-end learning of DNNs for computing visual
    odometry. It is expected that STM-based techniques will enable end-to-end tracking
    for optical flow, depth estimation, place recognition with metric invariance,
    small-scale bundle adjustment, [98].


    A final relevant topic is the direct analysis of video sequences in robotics applications.
    The analysis of video sequences using current techniques based on deep learning
    is very demanding of computational resources. It is expected that the increase
    of computing capabilities will enable the analysis of video sequences in real
    time in the future. Also, the availability of labeled datasets for learning tasks,
    such as action recognition, will enable the improvement of robot perception tasks,
    which are currently addressed by independent CNNs for individual video frames.


    # 8.5 CONCLUSIONS


    In this chapter, several approaches based on deep learning that are related to
    robot applications are described and analyzed. They are classified into four categories
    of methods: (i) object detection and categorization, (ii) object grasping and
    manipulation, (iii) scene representation and classification, and (iv) spatiotemporal'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# Applications of Deep Learning in Robot Vision


    vision. (i) Object detection and categorization has been transferred successfully
    into robot vision. While the best-performing detectors are mainly variants of
    Faster-RCNN, methods derived from YOLO offer a better runtime. (ii) Object grasping,
    manipulation, and visual serving are currently being improved by the adoption
    of deep learning. Real-time processing is needed for hand-eye coordination and
    visual servo to work, it is not needed for open-loop object detection. (iii) Methods
    for representing, cognition, or classifying scenes as a whole (not pixel-wise)
    images directly into a single CNN, and then real-time processing can be achieved.
    However, pixel-wise methods on FCNs require a GPU for running in real time. (iv)
    Spatiotemporal vision applications need real-time processing capability to be
    useful in robotics. Current research using deep learning is experimental, and
    the frame rates for most of the methods are not reported. For most of the methods
    at a useful frame rate. The adoption of deep learning in robot vision applications
    requires addressing several problems: (i) Deep neural networks require large amounts
    of data for training. Obtaining large amounts of data for specific robotic applications
    is a challenge to address each problem. (ii) Deep learning is able to deal with
    problems. However cannot generalize to conditions that are not represented by
    the available data. (iii) The need of low power consumption is a critical condition
    to be considered. However, the availability of specialized hardware for algorithms
    based on CNNs with low power consumption would make it possible to broaden the
    use of deep neural networks in robotics.


