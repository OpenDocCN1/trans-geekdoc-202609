    among research groups. The uses of machine learning include feature extraction,
    feature classification, forecasting, clustering, regression, and ensembles with
    different algorithms. Classical algorithms and techniques are optimized to provide
    effective self-learning [1]. Since machine learning is applied in a wide range
    of stages, many techniques have been provided, such as Bayesian network, clustering,
    decision tree learning, and deep learning deeep as shown in Figure 9.1. Meanwhile,
    a few analysts in the machine learning field have attempted to learn models that
    combine the learning of features. These models normally consist of different layers
    of nonlinearity. This led to the generation of the first generation of deep models.
    Early models use deep belief networks [2], stacked autoencoders (SAEs) [3], and
    restricted Boltzmann machines [4] indicated guarantees on small datasets. This
    was known as the “unsupervised pretraining” phase. It was believed that pretrained
    models would be a good initialization for supervised tasks, such as classification.


    Deep learning appeared in 2006 as a new field of machine learning. In Mosavi and
