    # 3.2.2 Vision-Based Fire Detection


    The conventional fire alerting systems are based on optical sensors, needing close
    proximity to the fire, thus failing to providing additional information, e.g.,
    burning degree, fire location, and size. In addition to this, such systems involve
    much human intervention such as visiting the location for confirming the fire
    in case of any fire. To cope with these limitations, many visual sensor-based
    fire detection systems have been presented. Visual sensor-based fire detection
    systems are motivated by several encouraging advantages, including the: 1) low
    cost due to setup of installed cameras for surveillance, 2) monitoring of large
    regions, 3) comparatively fast response time due to elimination of waiting time
    for heat diffusion, 4) fire confirmation without visiting the fire location, 5)
    flexibility for detection of smoke and flames by adjustment of certain parameters,
    and 6) availability of fire details such as size, location, and burning degree.
    Due to these characteristics, such systems have attracted the attention of many
    researchers and as a result, many fire detection methods have been investigated
    under numerous visual features, achieving reasonable performance with specifications.


    # 3.2.2.1 Color- and Motion-Based Fire Detection


    Color is one of the important clues for determining fire or flame in a video frame.
    Researchers have presented several methods for detection of fire by exploring
    color features in numerical color models. Chen et al. [8] investigated the dynamic
    behavior and irregularity of flames in both RGB and HSV color spaces for fire
    detection. Their method considers the fire difference between prediction, it fails
    to differentiate real fire from fire-like moving objects. Another method is presented
    by Celik et al. [14], who used YCbCr with specific rules for separating the chromin
    component. The method has the potential to detect flames with good accuracy but
    only at short distances and larger sizes. Summarizing the color-based methods,
    it can be noted that such methods are sensitive to brightness and shadows. As
    a result, the number of false alarms produced by these methods is high. Because
    of this, such methods may interpret red vehicles or people wearing red clothes
    as fire due to the predominance of red. Later on, possible solutions were introduced
    on the fact that fire changes its shape continuously which can differentiate it
    from moving objects. Kolesov et al. [18] used optimal transport optical flow as
    a low-dimensional descriptor along RGB color channels and neural networks for
    differentiating smoke and a similarly colored white wall, as well from a similarly
    colored background.


