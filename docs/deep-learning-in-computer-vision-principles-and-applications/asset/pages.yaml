  md: "# 74 Deep Learning in Computer Vision\n\n# 3.3.3.3 Contextual Information Extraction\
    \ Mechanism\n\nThe fire detection methods presented so far in the literature can\
    \ either detect fire or localize fire regions with reasonable accuracy. To the\
    \ best of our knowledge, there is no published work that can extract contextual\
    \ information from the fire scenes. \"Contextual information\" refers to anything\
    \ that is of interest to fire brigades and disaster management systems. Whenever\
    \ a person reports to a fire brigade, the following information is collected by\
    \ them:\n\n+   1. What is on fire?\n2. Are there any people in the building?\n\
    3. What type of building is on fire?\n4. Are there any hazards in or around the\
    \ building?\n5. Is evacuation in progress?\n6. What is the address of the premises?\n\
    7. What is your phone number?\n8. Other information as relevant.\n\n```\nAlgorithm\
    \ 2. Fire Localization Algorithm\nInput: Image I of the video sequence and the\
    \ deep CNN CNN model (CNN-M)\n1. Select a frame from the video sequence and propagate\
    \ it through CNN-M\n2. If predicted label=non-fire THEN\n   No action\nELSE\n\
    \   a) Extract maps 8, 26, and 32 ($F_8$, $F_{26}$, $F_{32}$) from the “Fire/Concat”\
    \ layer of CNN-M\n   b) Calculate activation maps ($F_{MA}$) for $F_8$, $F_{26}$,\
    \ and $F_{32}$\n   c) Binarization on $F_{MA}$ through threshold T follows:\n\
    $$F_{Localize} = \\begin{cases}1, & F_{MA}>T\\\\0, & \\text{Otherwise}\\end{cases}$$\n\
    \   d) Segment fire regions from $F_{MA}$\nEND\nOutput: Binary image with segmented\
    \ fire $I_{Localize}$\n```\n\nThe proposed method can extract similar contextual\
    \ information as well as useful information (such as size and expansion of fire)\
    \ automatically by processing the video stream of surveillance cameras. To achieve\
    \ such information, the segmented fire regions of Algorithm 2 are further processed\
    \ to determine the severity level/burning degree of the scene under observation\
    \ and find the zone of influence (ZOI) from the input fire. The burning degree\
    \ can be determined by the number of pixels in the segmented fire.\n\nThe zone\
    \ of influence can be calculated by subtracting the segmented fire regions from\
    \ the original input image. The resultant zone of influence is then passed through\
    \ the original SqueezeNet model [44], which predicts its label from 1,000 objects.\
    \ The object information can be used to determine the situation in the scene,\
    \ such as a fire in a house, a forest, or a vehicle. This information along with\
    \ the severity of the fire can be reported to the fire brigade to take appropriate\
    \ action."
