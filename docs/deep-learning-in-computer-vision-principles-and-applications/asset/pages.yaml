    [50]. The (h,w) dimension of Ro is divided into H×W grid, where H and W are layer-parameters.
    Standard max pooling is connected to each grid cell in each feature map channel.


    With similar mAP (mean average precision levels), fast R-CNN is very successful
    in improving the training/testing speed. For large-scale objects defined in He
