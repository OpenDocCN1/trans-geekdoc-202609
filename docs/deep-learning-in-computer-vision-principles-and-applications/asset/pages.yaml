    # 7.2.5 DETECTION BY SEMANTIC SEGMENTATION


    An additional feature that semantic segmentation adds to this work is that it
    provides contextual knowledge of the UAV surroundings. Knowing if the UAV is flying
    above a building or road is very beneficial in surveillance, delivery, and search
    and rescue missions. For instance, building and road detection is achieved by
    using the classified image with a box draw around each contour; having defined
    the pixel values of each class, each contour can be identified.


    # 7.2.6 REGISTRATION OF SEMANTIC FRAMES


    Seeking a real-time motion estimation technique for S, the same method performed
    in the calibration component (Section 7.2.2). Different, the image registration
    process is done in-between frames between S and Sₙ, with f being the frame rate.
    The frame rate is used to skip in-between frames since it will be exhausting to
    register all consecutive frames with insignificant changes. In fact, registering
    two consecutive images from the same domain can exploit the fact given smooth
    motion, the difference between the frames is insignificant, as seen in Figure
    7.12. Therefore, ORB features were an appropriate choice for this task since they
    are efficient alternatives to SURF and SIFT. It is important to note that ORB
    cannot deal with scale invariance effectively, and thus SIFT is used in the intermittent
    calibration step (check Section 7.2.2) for updating UAV scale and height. As shown
    in Figure 7.11, the UAV location is updated depending on the homography estimated
    from consecutive frames.


    Likewise, ORB produces a homography that is used to apply a translation that is
    added to the current pixel location to calculate the final UAV coordinate using
    Equations 7.3 and 7.4. It is important to note that in case of insufficient matches,
    the calibration step, discussed in Section 7.2.2, is called upon for enhanced
    reliability.


    ![](img/be8864cedd9a2fb32f3521f7cd37aa21_209_0.png)


    FIGURE 7.11 Two consecutive images from the UAV footage are taken and a homography
    is estimated from them to update the current UAV location.'
