  md: '# viii


    # Foreword


    of the others. Chapters of the book cover the following topics: accelerating the
    CNN inference on field-programmable gate arrays, fire detection in surveillance
    applications, face recognition, action and activity recognition, semantic segmentation
    for autonomous driving, aerial imagery registration, robot vision, tumor detection,
    and skin lesion segmentation as well as skin melanoma classification.


    From the assortment of approaches and applications in the eleven chapters, the
    common thread is deep learning for identification of CNN provides accuracy over
    traditional approaches. This accuracy is attributed to the flexibility of CNN
    and the availability of large data to enable identification through the deep learning
    strategy. I would expect the content of this book to be welcomed worldwide by
    graduate and postgraduate students and workers in computer vision, including practitioners
    in academia and industry. Additionally, professionals who want to explore the
    advances in concepts and implementation of deep learning algorithms will find
    in this book an excellent guide for such purpose. Finally, I hope that readers
    would find the presented chapters in the book interesting and inspiring to future
    research, from both theoretical and practical viewpoints, spur further advances
    in discovering the secrets of deep learning.


    Prof Aly Farag, PhD, Life Fellow, Fellow, IAPR

    Professor of Electrical and Computer Engineering

    University of Louisville, Kentucky'
