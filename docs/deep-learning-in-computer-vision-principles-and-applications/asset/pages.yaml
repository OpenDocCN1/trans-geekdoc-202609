    # 6.5 PROPOSED FUSION ARCHITECTURES


    The objective of this study is to experimentally investigate the impact of fusion
    of both depth and optical flow with RGB images for enhanced semantic segmentation
    of typical autonomous driving scenes. For this purpose, we implement three different
    segmentation network architectures: Single-Input network, Early-Fusion network,
    and Mid-Fusion network.


    # 6.5.1 SINGLE-INPUT NETWORK


    An encoder-decoder architecture is employed to perform semantic segmentation.
    For the encoder, the commonly used VGG-16 network [81] is used with the pretrained
    weights to initialize the encoder weights. A fully convolutional network architecture,
    FCN8 [42], is adopted for semantic segmentation, and the four fully connected
    layers of VGG16 are transformed into fully convolutional layers to learn the upsampling
    weights and restore the original image size. The fully convolutional network is
    exploited for its flexibility with any input image size. In contrast to fully
    connected networks, the fully convolutional ones preserve spatial relationships
    between pixels at lower computational cost. Additionally, FCN8 skips combine deep
    semantic information with shallow ones to improve accuracy as reported in [42].


    In the proposed architecture, the convolutional layers are used for feature extraction.
    Feature downsampling is performed using max-pooling layers, and layer activation
    is done using rectified linear unit (ReLU) activation function. Afterwards, the
    segmentation decoder follows the FCN architecture and I x I convolutional layers
    are used to adapt depth channels, followed by three transposed convolution layers
    to perform upsampling. In order to benefit from high-resolution features, skip
    connections are utilized to add features from the shallow layers to benefit from
    the high-resolution appearance. The architecture of this network illustrated in
    Figure 6.4 is used to conduct experiments for evaluation of a single information
    could on semantic segmentation. The same architecture is used for a single input
    of RGB-only, depth-only, and DOF-only, which refers to dense optical flow.


    ![](img/be8864cedd9a2fb32f3521f7cd37aa21_180_0.png)


    FIGURE 6.4 Single-Input network utilized for semantic segmentation given only
    one piece of information (e.g., RGB-only, depth-only, or DOF-only).'
