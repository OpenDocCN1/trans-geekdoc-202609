    used different kinds of features for sequence representations followed by RNN
    or LSTM. For instance, some researchers use deep features for sequence representation;
    however, the time complexity of these methods is very high. So, there is a need
    for state-of-the-art techniques that can make tradeoffs between accuracy and time
    complexity. Recommendations and future directions about actions and activity recognition
    are as follows.


    # 5.4.1 BENEFITING FROM IMAGE MODELS


    Image classification has achieved state-of-the-art results using CNN and beaten
    human error rates in recent deep models [47]. These existing image models can
    be utilized for frame-level representation in sequential video data. There are
    many lightweight CNN models, such as MobileNet [48], SqueezeNet [49], and ShuffleNet
    [50], that can help in real-time processing for action and activity recognition.
    CNN models have already achieved state-of-the-art results in other tasks such
    as object detection and localization [51, 52], image and video retrieval [53],
    video'
