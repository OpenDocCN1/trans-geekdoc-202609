    # 10.6 CONCLUSIONS


    In this chapter, we presented a full-resolution convolutional networks (FrCN)
    method for skin lesion segmentation. Unlike the previous well-known segmentation
    approaches, the FrCN method is able to utilize full spatial features for the case
    of dermoscopy images, improving the performance of pixel-wise segmentation. We
    evaluated the FrCN method utilizing the ISIC 2017 challenge dataset. The results
    show that the FrCN method outperformed the FCN, U-Net, and SegNet techniques.
    In future, a larger number of training dermoscopy images should be used to improve
    the segmentation performance of each class. Developing a computer-aided diagnostic
    system using segmented lesions is also necessary to distinguish between benign,
    melanoma, and normal skin lesions.


