- pgno: 256
  md: '# 9.3.1 GRADIENT-BASED OPTIMIZATION


    The backpropagation algorithm is generally used to train neural networks [25],
    which speeds up the gradient descent (GD) computation by the chain rule. However,
    for large datasets with (at least thousands) images, utilizing GD is unfeasible.
    In such cases, the stochastic gradient descent (SGD) is regularly utilized, where
    one calculates gradients for individual images instead of the whole dataset. It
    has been discovered that training with SGD is superior to training with GD. The
    main disadvantage of SGD is that it converges slowly [26]. To overcome this disadvantage,
    SGD is commonly utilized with a minibatch, where the minibatch generally contains
    a few points (≈ 100) of all data points.


    Momentum [27] has a place with a group of techniques that aim to accelerate the
    SGD convergence. This technique is mainly used in deep network training and is
    regularly considered a basic component. Augmentations such as Adam [28], Nesterov''s
    accelerated GD [29], Adagrad [30], and Adadelta [31] are known to work similarly
    well. For a point-by-point discussion on how these techniques function, more details
    can be found in [32].


    # 9.3.2 DROPOUT PROPERTY


    This occurs when the model network has more terms than necessary or uses more
    complicated techniques with numerous training parameters, especially with a small
    amount of training data or limited data, to combat this effective regularization
    technique. It has been observed that traditional regularizers such as /l1 or /l2
    regularization on the weights of the neural network are inadequate in this view.


    Another piece of technique is named "dropout", which is a simple regularization
    technique to solve the overfitting problem. Dropout is a strong regularization
    method [33], and it has been shown to enhance generalization for extensive neural
    networks. In dropout, we arbitrarily drop neurons in training with a probability
    p. Therefore, only an irregular subset of neurons in SGD iterations are trained.
    Applying dropout properties is valuable only in the training stage. At test time,
    utilize all neurons, and every neuron activation is multiplied by p to represent
    the scaling. Hinton et al. [33] demonstrated that this strategy was equivalent
    to training a large range of neural networks with shared parameters and then utilizing
    their geometry, intending to obtain a single expectation. Numerical augmentations
    to dropout, such as DropConnect [34] and Fast Dropout [35], have appeared to work
    better in specific cases. Maxout [36] is a nonlinearity that enhances the execution
    of a network that utilizes dropout.


    # 9.3.3 BATCH NORMALIZATION


    generalization and that also definitely accelerates convergence. This system handles
    the issue of inward covariate shift, where the circulation of each layer''s data
    sources changes persistently amid the training phase. This is the result of variable
    weights for each layer, which results in a changing output activation distribution.
    This ability'
