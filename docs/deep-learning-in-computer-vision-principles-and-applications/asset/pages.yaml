  md: '# Skin Melanoma Classification Using Deep CNNs


    # 11.5.2 PERFORMANCE OF THE RESNET50


    The modified Resnet50 architecture was tested using the MED-NODE dataset. The
    dataset was randomly divided into 85% for training and the remaining 15% for testing.
    Because Resnet50 is deeper than Alex-net, it has the ability to classify images
    better than Alex-net with a smaller number of images. Only three experiments were
    done with modified Resnet50 architecture. The first experiments were performed
    using the modified Resnet50 architecture and the original images from MED-NODE
    without segmentation and without augmentation. Images in the dataset were segmented
    to extract foreground important features (ROI) and discarding background, keeping
    segmented images in the same RGB color space. The performance measures were greatly
    improved compared with using a dataset without segmentation. Finally, the segmented
    images in the dataset were augmented by rotating images from 0° to 90° with a
    fixed angle of 5°. To the impact of augmentation in performance measures, a third
    experiment was performed. Table 11.6 shows the performance of modified Resnet50
    with the three experiments.


    The same experiments have been repeated using low-quality color-skin images from
    DermIS [36] and DermQuest [37]. As mentioned before to reduce the noise, the images
    of dataset were segmented to isolate the ROI from the background. The previous
    three experiments were repeated using the DermIS & DermQuest dataset by dividing
    it into 85% for training and the remaining 15% for testing randomly. The acquired
    results proved that the modified Resnet50 architecture is better than the modified
    Alex-net architecture.


    # 11.6 DISCUSSION


    It is noted that the results obtained from the second dataset are smaller than
    the results obtained from the first dataset. This is normal and predictable according
    to the nature of the images in each dataset. The images of the first dataset are
    highquality microscopic images acquired by specialized devices. On the other side,
    the images of the second dataset are low-quality images acquired by a common camera
    in a noisy environment.


    By comparing the performance measures of proposed Alex-net against proposed Resnet50
    using different datasets, we found that the best performance measures were for
    the modified Resnet50. The performance of Resnet50 is the best because it contains
    many more layers than Alex-net. As discussed before, Resnet50 is enforced to learn
    how to map some of the input to the output and while Alex-net tried to map some
    of the input to the output. Based on “skip connection”, Resnet50 passes the input
    from one layer to a far layer by skipping two layers.


    We could say that DCNN works with any dataset of different resolutions. The performance
    increased with high-quality images, high resolution, and low levels of noise.
    The performance of the proposed methods was compared with the well-known existing
    methods [11–21, 42] and the comparison is summarized in Tables 11.7 and 11.8.
    The accuracy and the ROC curves were used to measure the performance of the proposed
    methods against the performance of the existing methods. For the'
