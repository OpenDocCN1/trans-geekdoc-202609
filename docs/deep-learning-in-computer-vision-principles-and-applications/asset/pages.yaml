- pgno: 10
  md: '# x


    # Preface


    Chapter 1 presents a state-of-the-art CNN inference accelerators over FPGAs. Computational
    workloads, parallelism opportunities, and the involved accesses are analyzed.
    At the level of neurons, optimizations of the convolutional and fully connected
    layers are explained and the performances of the different methods compared, while
    at the network level, approximate computing and data-path optimizations are covered
    and state-of-the-art approaches compared. The methods and tools investigated in
    this chapter represent the recent trends in FPGA CNN accelerators and will fuel
    future advances in efficient hardware deep learning.


    Chapter 2 concerns object detection problem using deep CNN (DCNN): the recent
    developments of classical CNN-based object detectors are discussed. These detectors
    significantly improve detection performance through either new architectures or
    through solving practical issues like degradation, gradient vanishing, and class
    imbalance. Background information is provided to show the progress and improvements
    of different models. Some evaluation results and comparisons are reported on three
    datasets with distinctive characteristics.


    Chapter 3 proposes three methods for fire detection using CNNs. The first method
    focuses on early fire detection with an adaptive prioritization mechanism for
    surveillance cameras. The second CNN-based method improves fire detection accuracy
    by considering new architectures. The third method uses an efficient CNN for fire
    detection. For localization of fire regions, a feature map selection algorithm
    that intelligently selects appropriate feature maps sensitive to fire is proposed.


    Chapter 4 presents an accurate and real-time biometric system for identifying
    a person''s identity using a combination of two deep learning approaches to address
    the problem of uncontrolled face recognition: CNN and deep belief (DBN). The proposed
    system is tested on four large-scale challenging datasets with high diversity
    in facial expressions—SDUMIA-HMT, FRGC V 2, UFI, and LFW—and state-of-the-art
    recognition rates on all the employed datasets are achieved.


    Chapter 5 introduces a study of the concept of sequence learning using RNN, LSTM,
    and its variants as multilayer LSTM and bidirectional LSTM for action and activity
    recognition. The chapter concludes with major issues of sequence learning for
    action and activity recognition and highlights recommendations for future research.


    Chapter 6 discusses semantic segmentation in autonomous driving applications,
    where it focuses on constructing efficient and simple architectures to demonstrate
    the benefit of flow and depth augmentation to CNN-based semantic segmentation
    networks. The impact is experimentally using four simple network architectures.
    Results of experiments on two public datasets—Virtual-KITTI and CityScopes—show
    reasonable improvement in overall accuracy.


    Chapter 7 presents a method based on deep learning for geolocizing drones using
    only onboard camera. A pipeline has been implemented that makes use of the availability
    of satellite imagery and traditional computer vision feature detectors and descriptors,
    with renewed deep learning methods (semantic segmentation), to be able to locate
    the aerial image captured from the drone within the satellite imagery. The method
    enables the drone to be autonomously aware of its surroundings and navigate without
    using GPS.'
