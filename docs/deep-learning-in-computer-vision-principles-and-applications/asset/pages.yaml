- pgno: 258
  md: '# 9.4.1.2 CNN Activations as Features


    As mentioned previously, the later layers in AlexNet appear to learn visually
    semantic characteristics. These representations are essential in making 1,000-class
    classifications. Because these demonstrate a large number of classes, the FC7
    layer can be used as a global identifier. The provided features are better than
    the traditional features, such as SIFT or HOG, for different computer vision tasks.
    Donahue et al. [43] first presented the use of CNNs as features and performed
    tests to decide their proportionality for different errands. Fully connected layers
    are additionally utilized for image recovery [44]. Indeed, these are used as generic
    features and can be utilized in many tasks [45].


    # 9.4.2 Deep Learning Difficulties


    # 9.4.2.1 Overfitting Reduction


    Training a deep learning model with a limited number of training images is a challenging
    task due to the number of learnable parameters. Various strategies have been developed
    by researchers, including the following:


    +   1. Applying a nonlinear activation function such as ReLU [46].n2. Using a
    good initialization and increasing the momentum slowly [47].n3. Applying dropout
    to randomly deactivate connections on each iteration [48].n4. Performing normalization
    by using batch normalization layers [37].n5. Using denoising autoencoder layers
    to reconstruct the corrupted inputs [49].


    # 9.5 COMMONLY USED DEEP NEURAL NETWORKS


    Deep learning uses considerable amounts of computational energy and acquires advanced
    results in multiple difficult tasks. Among the various learning strategies, methods
    based on convolutional neural networks (CNNs) are more appropriate for tasks related
    to images. The main goal of this section is to provide an overview of the commonly
    used CNN methods, such as AlexNet, VGG-19, deep residual networks, and as reported
    in Table 9.1.


    # TABLE 9.1

    Comparison among Well-Known Convolutional Neural Networks Using ImageNet Dataset


    | Year | CNN | No. of layers | No. of parameters | Error rate |

    |---|---|---|---|--|

    | 2012 | AlexNet [8] | 7 | 60 million | 15.3% |

