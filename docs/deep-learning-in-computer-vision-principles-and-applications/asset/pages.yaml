    # 6.4.2 OPTICAL FLOW ESTIMATION


    In addition to geometry, there is a very important information prior that can
    be used in autonomous driving applications (i.e., the motion information) [74].
    In a normal driving scenario, there are lot of moving objects including cars,
    buses, and pedestrians as well as the vehicle ego-motion. Optical flow provides
    a visualization for the motion vectors of features in both x and y directions
    of the image. Moreover, optical flow is already computed within the automotive
    vision platform and has a standard module for more than ten years. Due to hardware
    restrictions, sparse optical flow was used, but recently it has been replaced
    by dense optical flow.


    In classical approaches, the most common way to generate sparse optical flow is
    the Lucas-Kanade method [75], which assumes similar motion vectors on a small
    window of 3x3 size as an example for every pixel at be able to solve the optical
    flow equation:


    ```

    $f_u,u + f_v,v + f_i = 0$

    ```


    Where $u$ and $v$ change in the pixels'' x and y positions with respect to time,
    which implies the motion of a pixel in both directions; $f_u$ and $f_v$, dense
    image derivatives along x and y directions; and $f_i$ is the image difference
    over time. The Lucas-Kanade method is computed over previously selected features
    where the output will be sparse and dense output provides computationally efficient
    solution. The contrary, Farneback''s method [76] computes optical flow, for every
    pixel in the image, and provides dense output where every pixel in the source
    frame is associated with a 2D vector values for pixel motion in x and y directions
    called $u$ and $v$. Both Lucas-Kanade and Farneback methods provide good performance
    only when there is little motion between corresponding pixels in both images,
    and fail when the displacement is large.


    On the other hand, deep learning has been used to formulate flow estimation as
    a learning problem where temporal sequences are used as input to the network and
    the output is a dense optical flow. FlowNet [77] used a large-scale synthetic
    dataset, "Flying Chairs", as a ground truth for dense optical flow. Two architectures
    were proposed. The first one accepts an input of six channels for a Mid-Fusion
    in which each image is processed separately on one stream and 2D correlation is
    done to output a DOF map. This work has been later extended to FlowNet v2 [78]
    focusing on small displacement motion, where an additional specialized subnet
    is added to learn small displacements. Results are then fused with the original
    architecture using another network to learn the best fusion. [79], the estimated
    flow is used to warp one of the two sequentially images to the other, and the
    loss function is implemented to minimize the error between the'
