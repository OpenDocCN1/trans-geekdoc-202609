  md: '# Accelerating the CNN Inference on FPGAs


    to another. More particularly, weights, weighted sums, and outputs of each layer
    are assigned distinct integer and fractional bit-widths.


    The optimal values of these bit-widths (i.e., the ones that deliver the best trade-off
    between accuracy loss and computational load) for each layer can be derived after
    a profiling process performed by developed frameworks that support FXP. Among
    these frameworks, Ristretto [81] and FixCaffe [84] are compatible with Caffe,
    TensorFlow natively supports 8-bit computations. Many of these tools can fine-tune
    a given model to improve the accuracy of the quantized network.


    In particular, the works [85] demonstrate the efficiency of FXP, pointing out
    how inference of AlexNet is possible using 6 bits in dynamic FXP instead of 16
    bits with a conventional fixed-point format.


    # 1.6.1.3 FPGA Implementations


    The FPGA-based CNN accelerator proposed in [29] is built upon this quantization
    scheme and employs different precisions to represent the FM, convolution kernels,
    and FC weights with 16, 8, and 10 bits, respectively. Without fine-tuning, the
    authors report a drop of 1% in the classification accuracy of AlexNet. In a similar
    way, Qiu et al. employ FXP to quantify the VGG network with 8 bits for weights,
    8 bits for activations, and 4 bits for FC, resulting in an accuracy drop of 2%.
    In all dynamic quantization is supported by data shift modules [28, 82]. Finally,
    the accelerator in [41] relies on the Ristretto framework where the AlexNet model
    is quantized in 16 bits with distinct integer bit-widths per layer.


    # 1.6.1.4 Extreme Quantization and Binary Networks


    Training and inferring CNNs with extremely compact data representations is an
    area that has gained lot of research interest. Early works of Courbariaux et al.
    in [86] demonstrate the feasibility of neural networks using binary weights, weights
    with either a value of -θ or θ encoded in 1 bit. BinaryConnect lowers the bandwidth
    requirements of a network by a factor of x32 at the cost of an accuracy loss,
    evaluated at 19.2% on ImageNet. The authors go further in their investigations
    in [15] and propose BNNs that represent both feature maps and weights with only
    1 bit. In these networks, negative values are represented as 0, while positive
    values are represented as 1. BNNs simplify the processing of convolutions, boiling
    the computations of MACs into XNOR operations by a pop-count (see, the authors
    use the sign function as activation and apply batch normalization before applying
    the activation, which reduces the information loss during binarization (see Figure
    1.11a). In turn, a higher drop in classification accuracy occurs when using BNNs,
    evaluated at 29.8% on ImageNet. This accuracy drop is then lowered to 11% by Rastegari
    et al., using different scale factors for binary weights (i.e., -w or +w).


    * Since the PEs are reused to process different layers, the bit width is used
    with a variable radix point for each layer.


    † Compared to an exact 32-bit implementation of AlexNet.'
