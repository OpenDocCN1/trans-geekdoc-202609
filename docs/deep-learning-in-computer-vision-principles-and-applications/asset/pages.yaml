  md: '# Applications of Deep Learning in Robot Vision


    217


    command. The system computes the probability that a given motor command will produce
    a successful grasp, conditioned on the image, which enables the system to control
    the robot. The network is composed by seven convolutional layers, whose output
    is concatenated with the motor command. The concatenation layer is further processed
    by an additional convolutional layers and two fully connected layers. The system
    achieve effective real-time control; the robot can grasp novel objects successfully
    and correct mistakes by continuous servoing. It lowers the failure rate from 35%
    (hand designed) to 20%. However, learned eye-hand coordination depends on the
    particular robot used for training the system. The computing hardware used in
    this work is not fully described. It must be noted that these kinds of solutions
    are able to run successfully in real time using GPUs.


    Systems to inform manipulation trajectories for object-task pairs using DNNs have
    been developed recently. This task is difficult because generalization over different
    objects and manipulators is needed. Proposed solutions include [46, 47]. These
    systems are able to learn from manipulation demonstrations and generalize over
    new objects. In Robobrista [46], the input of the system is composed of a point
    cloud, a trajectory, and a natural language space, which is mapped to a joint
    space. Once, the trajectory generating the best similarity to a point cloud and
    natural language instruction is selected. Computational hardware (GPU) and runtime
    are not reported in this work. In [47], the proposed system is able to learn new
    tasks using image-based reinforcement learning. That system is composed by an
    encoder and decoder. The encoder is formed by three convolutional layers and two
    fully connected layers. Computational hardware and runtime are not reported in
    this work.


    Visual systems have also benefited from the use of deep learning techniques. In
    Saxena et al. [48], a system is able to perform image-based visual serving by
    feeding data into convolutional networks. The system does not require the 3D geometry
    of the scene or the intrinsic parameters of the camera. The CNN takes a pair of
    monocular images as input, representing the current and desired pose, and processes
    them using four convolutional layers and a fully connected layer. The system is
    trained for computing the transformation in 3D space (position and orientation)
    needed for moving the camera from its current pose to the desired one. The estimated
    relative motion is used for generating linear and angular commands for moving
    the camera to the desired pose. The system is trained on synthetic data and tested
    both in simulated environments and by using a real quadrotor. The system takes
    20 msec for processing each frame when using an NVIDIA Titan X GPU, and 65 msec
    when using a Quadro M2000 GPU. A connection was used for transferring data from
    the drone and a hot PC.


    Multimodal data delivers valuable information for object grasping. In [49], a
    haptic classifier delivers the outputs of a visual CNN and a haptic CNN are formed
    by a fusion layer, followed by a loss function for haptic adjectives. The visual
    CNN is based on the (5a) layer of GoogleNet, while the haptic CNN is based on
    one-dimensional convolutional layers followed by a fully connected layer. Examples
    of haptic adjectives are “absorbent,” “bumpy,” and “compressible.” The trained
    system is able to estimate haptic adjectives of objects by using visual data and
    it is shown to over perform systems based on classical features. Computing hardware
    and runtime of the method are not reported.'
