    one layer, and as we increase the number of layers, this significantly increases
    more quickly. Moreover, image vectorization ignores the spatial structure. How
    can we develop a network that overcomes these disadvantages?


    Two-dimensional convolutions are used instead of matrix multiplications. Additionally,
    normally considers the 2D structure of the image. Meanwhile, convolutions can
