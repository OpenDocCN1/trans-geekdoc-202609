    # 9.7.1 DEEP LEARNING FOR FEATURE EXTRACTION


    The methods for medical image processing mainly characterize the local anatomical
    characteristics based on representations of the morphological features designed
    by experts. Moreover, the represented features of an image for a specific problem
    are hard ever reusable for others. For instance, the methods of MR image segmentation
    designed for 1.5-Tesla T1-weighted images are not viable for 7.0-Tesla T1-weighted
    or T2-weighted images, or for different modalities or distinct organs [61, 62].
    Supervised learning methods require large amounts of training data that are manually
    labeled by experts to find the most essential and relevant features for specific
    tasks, while the extracted features may deviate due to the complexity of the anatomical
    structures. Therefore, a change in image makes the training process start over.


    Wu et al. [61, 62] presented a general framework for feature extraction that detects
    the essential characteristics for the accurate segmentation and detection of brain
    regions and anatomical structures. Furthermore, this framework can be used for
    various types of medical images. A stacked autoencoder (SAE) is used with a sparsity
    constraint to learn extracted features hierarchically from layer to layer, which
    contains hierarchical encoding and decoding systems. A nonlinear mapping is used
    to map the input to an activation vector y. This procedure is repeated by using
    the vector y as input for the next layer until the high-level feature presentations
    are obtained. The decoding system is used to minimize the reconstruction errors
    between the reconstructed path from the decoder and the input path. From the application
    mentioned above, we found that


    +   Feature extraction by deep learning represents the local characteristics of
    the image very well.

    Deep learning can learn the intrinsic features of new medical imaging modalities
    for new image analysis methods.

    It is fully adaptive to understand the data of the image and apply to different
    medical imaging applications, such as prostate localization [63, 64], hippocampus-campus
    segmentation [65], and brain tumor detection [17].


