  md: '# Deep Convolutional Neural Networks


    # 9.5.1 AlexNet


    AlexNet has been discussed previously. 9.2 shows max-pooling grouped with layers
    1, 2, and 5, while the last two fully connected layers are combined with dropout
    because they contain the most parameters. Local response normalization has been
    provided to layers 1 and 2, which does not affect the network performance as in
    [50]. The ILSVRC 2012 database, which has 1.2 million images for 1,000 classes,
    is used to train the network. Two GPUs are used to train the network for one month.
    With more powerful GPUs, the network can be trained in a few days [50]. Learning
    algorithms for hyperparameters such as dropout, weight decay, momentum, and learning
    rate were manually tuned. Blob-like features and Gabor-oriented edges are learned
    in the prior layers. The highest-order features, such as shapes, are are learned
    by the last layers.


    # 9.5.2 GoogleNet


    For GoogleNet [40], the best method at ILSVRC-2014; the classification performance
    is significantly improved with very deep networks. The number of parameters has
    increased due to the large number of layers, and a number of design tricks are
    used, such as using a 1×1 convolutional layer after the traditional convolutional
    layer, which reduces the number of parameters and increases the expressive power
    of the CNN. It is believed that having at least one 1×1 convolutional layer is
    much the same as having a multilayer perceptron network preparing the convolutional
    layer output that goes before it. Another trick used by the authors is to involve
    the internal layers of the network in the calculation of the target function rather
    than the final softmax layer (as in Alex).


    # 9.5.3 VGG-19


    The VGG-19 [39] network design is one of the highest-performing deep CNN (DCCN)
    networks. The VGG design presents a fascinating feature in that it divides the
    large convolutional filters into small ones. The small filters are carefully selected
    with a number of parameters approximately the same as the parameters in the larger
    convolutional filters, which they replace. The net impact of this design choice
    is productivity and regularization-like impact on parameters because of the smaller
    size of the filters.


    # 9.5.4 Deep Residual Networks (ResNet)


    Deep residual networks (ResNet) [24] increase the number of trained layers to
    the highest depth with 152–200 layers. The network used residual connections between
    layers that were used to train network residual map instead of adapting to the
    underlying map. In other words, the layers did not learn a mapping of $h(x)$ directly,
    but it will learn $f(x)=h(x)-x$ and then add $x$ to be $f(x)+x$. This straightforward
    method was observed to be helpful for learning networks with several layers, providing
    sophisticated accuracy in many tasks.'
  merge: -1
  img_proc: true
