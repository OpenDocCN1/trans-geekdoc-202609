    # 2.6 CONCLUSION


    In this chapter, we have a brief review of CNN-based object detection by presenting
    some of the most typical detectors and network architectures. The detector starts
    with a two-stage multi-step architecture and evolves to a simpler one-stage model.
    In the latest models, even two-stage ones employ an architecture that shares a
    single CNN feature map to reduce the computational load [52]. Some models accuracy
    increase by fusing different ideas into one detector [47, 59]. In addition to
    the direct effect on detection, training strategy is also an important factor
    to produce high-quality results [41, 63]. With recent developments, most detectors
    have decent performance in both accuracy and efficiency. In practical applications,
    we need to make a trade-off between the accuracy and the speed by choosing a proper
    set of parameters and network structures. Although great progress has been made
    in object detection in past, some challenges still need to be addressed, occlusion
    [64] and truncation. In addition, better-designed datasets, like VisDrone, needed
    for specific practical applications.


