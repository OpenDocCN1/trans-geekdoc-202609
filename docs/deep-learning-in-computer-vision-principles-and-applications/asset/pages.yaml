    # ## 10.5 DISCUSSION


    Automatic delineation of skin lesion boundaries is highly demanded as a prerequisite
    for melanoma recognition. Accurate segmentation of skin lesions enables the classical
    CNNs to extract more specific and representative features from only skin lesion
    areas instead of deep dermoscopy images. Generally, the overall segmentation performance
    of deep learning approaches improves as the size of the training datasets. The
    impact of varying training dataset sizes is presented in [31, 62, 84], in which
    the work showed the significance of using larger training sets. First, HSV images
    are generated from the original RGB images. Second, the dermoscopy images are
    augmented by rotating the RGB and HSV images with four rotation angles. Furthermore,
    the images are flipped by applying horizontal and vertical flipping. The augmented
    training data should support the network to learn better features of the skin
    lesion characteristics. The results present the capability of the FrCN technique
    to segment skin lesions with accuracies higher than those obtained with the conventional
    methods. This is because the FrCN method is trained with the full spatial resolution
    of the input images. In our experiments, the segmentation performance of the FrCN
    technique was compared against three well-known segmentation approaches, namely
    FCN, U-Net, and SegNet, under the same test conditions. Quantitative evaluations
    with different indices of the recent deep learning methods are reported in Tables
    10.4 and 10.5 for the ISIC 2017 test dataset. The FrCN method outperformed other
    skin lesion segmentation approaches. The MCC index showed how the segmented skin
    lesions were correlated with the annotated ground-truths. The FrCN architecture
    obtained overall results of 3.92%, 11.99%, and 6.43% in MCC compared to FCN, U-Net,
    and SegNet, respectively. These promising segmentation results indicate the consistency
    and capability of the FrCN method.


    In this work, further analysis was done to show the segmentation performance for
    clinical diagnosis cases. In the ISIC 2017 test dataset, the benign cases achieved
    a higher segmentation performance than the melanoma and SK cases, with Jaccard
    indices of 81.28%, 72.44%, and 69.25%, respectively, as shown in Table 10.4. Significant
    improvement for the benign cases is due to the larger existing percentage of the
    cases in the training dataset (i.e., 1,372/2000 cases) and in the test dataset
    (i.e., 393/600), as numbered in the database distribution in Table 10.1. Note
    that due to the inequality of the numbers of each diagnostic type, the segmentation
    results of the overall indices shown in Tables 10.4 and 10.5 were not computed
    as direct averages of all cases, but were computed as percentages of their presence.'
