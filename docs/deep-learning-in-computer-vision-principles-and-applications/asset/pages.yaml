    lost support. This loss of support was to a great extent because of memory and
    equipment limitations and the inaccessibility of large amounts of training data.
    With the expansion in computational power due to the wide accessibility of GPUs
    and the emergence of extensive datasets such as ImageNet [7], it became possible
    to train larger and more complex models. This ability first appeared with the
    mainstream AlexNet model, which was discussed previously and the start of using
    the deep neural network in computer vision.


