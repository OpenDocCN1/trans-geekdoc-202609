    # 9.5.5 TOOLS AND SOFTWARE


    In this section, we will discuss different software programs that are available
    for deep neural network learning. Table 9.2 includes the commonly used packages.
    Caffe is the most utilized software among computer vision applications. It is
    composed with C++ and is frequently utilized by the Python and command line interfaces.
    The structure of this system makes it simple to utilize pretrained neural systems
    for different tasks. In general, Theano, Torch, and TensorFlow appear to be more
    prominent. These structures are intended to make it simpler to alter lower-level
    subtle elements of neural systems. Theano and TensorFlow are utilized in Python,
    while Torch is utilized in Lua. Likewise, a couple of wrapper libraries exist
    for Theano, for Lasagne [51] and Keras [52], which provide normally utilized functionalities
    and some help for pretrained models.


    In this specific situation, automatic differentiation (AutoDiff) [53] is an essential
    feature to have in such a structure. When determining layers and regularizers
    for neural systems, one also needs to indicate what the gradient through that
    layer would resemble. AutoDiff calculates the derivative of complex functions
    automatically in a closely shaped space using derivative definitions of primitives.


    # 9.6 CONVOLUTIONAL NEURAL NETWORK TYPES


    # 9.6.1 REGION-BASED CONVOLUTIONAL NEURAL NETWORKS (R-CNN)


    Most CNN networks are trained to classify images using images that include multiple
    objects, but the CNN network can recognize a single object. The main problem with
    CNN network design is the need to cover more tasks than classification, such as
    localization and detection. The major aim of object detection is to detect different
    objects in each image of various sizes. Meanwhile, a group of object-like regions
    is detected in a specific image, named region proposals, which have gained much
    attention [54]. Region proposal methods work at a low level and produce hundreds
    of objects such as image patches at multiple levels. To appoint a network classification
    to cover the'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Deep Convolutional Neural Networks


    task of localizing objects, the network must search for image regions with different
    scales simultaneously.


    Girshick et al. [55] used region proposals to solve the problem of object localization.
    The method obtained the best results on the PASCAL VOC 2012 detection dataset.
    The method is region-based CNN (R-CNN) because it uses regions of the images followed
    by a CNN. Different works have used the R-CNN method to extract features in small
    regions to solve many target applications in computer vision.


    # 9.6.2 FULL CONVOLUTION NETWORKS (FCNs)


    The achievements of convolutional networks in object detection [55] and classification
    tasks [8, 40] have motivated specialists to utilize deep neural networks for more
    difficult tasks, such as scene parsing and semantic segmentation. Scene parsing
    and semantic segmentation assign a label for each pixel in the image to which
    it belongs (e.g., tea, sofa, road, and so forth), which is called per-pixel classification.
    The region features are extracted to a support vector machine (SVM) to classify
    them into.


    Long et al. [56] provided a fully convolutional network (FCN) structure to learn
    per-pixel tasks, such as semantic segmentation, in a comprehensive manner. FCN
    layer does not have any inner product or densely connected layers, as in CNN networks
    that are used for classification. The CNN networks have a restriction on input
    size because the inner layers have a limitation on the input size. However, FCN
    does not include any of the inner products; it can basically work with any input
    size. Long et al. [56] introduced a deconvolution layer that obtains the spatial
    resolution back to the upsampling operation from the output of the sub-sampled
    image. They performed the upsampling operation at intermediate layers, which are
    concatenated to acquire features at the pixel level.


    # 9.6.3 HYBRID LEARNING NETWORKS


    Multitask is basically a machine learning model, wherein the goal is to prepare
    the learning network to perform well on numerous tasks. Multitask learning systems
    will generally explore portrays that exist among the functions to obtain a superior
    generalization execution over their counterparts created for one task. In CNNs,
    multitask learning is acknowledged utilizing distinctive methodologies. One of
    methodologies uses a multitask loss with hyperparameters normally controlling
    the losses. For instance, Girshik et al. [57] utilize a multitask loss to train
    the network for bounding-box and classification regression functions along these
    lines, enhancing execution for object recognition.


    # 9.7 DEEP LEARNING APPLICATIONS IN MEDICAL IMAGING


    Over the past decades, we have seen the significance of medical imaging, e.g.,
    magnetic resonance (MR), mammography, computed tomography (CT), X-ray, ultrasound,
    positron emission tomography (PET), and so forth, for early treatment,'
