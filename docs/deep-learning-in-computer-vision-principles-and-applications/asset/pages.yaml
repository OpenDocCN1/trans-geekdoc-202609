    shifted from being used for military operations to being available for the public
    market. This conception came through the advancement and availability of mature
    hardware components such as Bluetooth, Wi-Fi, radio communication, accelerometers,
    gyroscopes, high-performance processors with low consumption, and efficient battery
    technologies. This rise can be attributed to the increasing smartphone demand,
    which led to the race of manufacturing better hardware components, which brought
    benefits to other sectors such as UAVs [1]. The smartphone market has led to the'
