    \ understanding the context of an action. In long-term sequences, RNNs can interpret\
    \ such sequences but forget the earlier inputs of the sequence.\n\n# 5.1.2 LONG\
    \ SHORT-TERM MEMORY (LSTM)\n\nThe vanishing gradient problem can be solved by\
    \ utilizing a special type of RNN known as LSTM [15]. It is capable of learning\
    \ long-sequential dependencies. With special structure, with input, output, and\
    \ forget gates, controls the long-sequential pattern identification in time series\
    \ data. The gates are adjusted by a sigmoid function connected to each unit, which\
    \ learns during training to states in which it needs to be open and in which it\
    \ should be closed. Eq.(1.1) to Eq.(1.7) [16] explain the operations performed\
    \ in the LSTM unit, where $x_t$ is the input at time $t$, where input is fed in\
    \ form of chunks from the long sequence. $f_t$ is the forget gate at time $t$,\
    \ which clears information from the memory when needed and keeps a record of a\
    \ previous frame, whose information needs to be cleared from the memory. The output\
    \ gate $o$ keeps information about the upcoming step, where $g$ is the recurrent\
    \ unit with activation function “tanh” and is computed from the input of the current\
    \ frame and the state of the previous frame $s_{t-1}$. The hidden state of RNN\
    \ step is constructed through tanh activation and memory cell $c_t$. The output\
    \ of each state can be used in other tasks; however, action recognition does not\
    \ need the intermediate output of the LSTM, so the final decision is made by applying\
    \ the Softmax classifier to the final state of the LSTM network, which gives probabilities\
    \ for the predicted activity.\n\n```\n$i_t = \\sigma((x_t + s_{t-1})W^i + b_i)$\n\
    ```\n\n```\n$f_t = \\sigma((x_t + s_{t-1})W^f + b_f)$\n```\n\n```\n$o_t = \\sigma((x_t\
    \ + s_{t-1})W^o + b_o)$\n```\n\n```\n$g = \tanh((x_t + s_{t-1})W^g + b_g)$\n```\n\
    \n```\n$c_t = c_{t-1} \\cdot f_t + g \\cdot i_t$\n```\n\n```\n$s_t = \tanh(c_t)\
    \ \\cdot o_t$\n```\n\n```\nPredictions = soft max($V_s$)\n```\n\nRecent studies\
    \ have proven [17–22] that huge amounts of data increase the accuracy of a machine\
    \ learning task. Therefore, learning complex sequential patterns in video data\
    \ of large-scale datasets is very challenging, and a single LSTM is not effective\
    \ enough to do it. Therefore, researchers have utilized multi-layer LSTM, which\
    \ is constructed by stacking multiple LSTM cells to learn long-term dependencies\
    \ in video data."
