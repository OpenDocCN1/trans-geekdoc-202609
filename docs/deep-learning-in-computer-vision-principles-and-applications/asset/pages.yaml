    # 4.4.1 THE PROPOSED FDT-DRBM APPROACH


    The proposed face recognition algorithm starts by detecting the face region using
    a Viola-Jones face detector [56]. Then, after rescaling the input image f(x, y)
    to the range of [0, 1], a simple pre-processing algorithm using a sigmoid function
    is applied as:


    ```

    g(x,y) = \frac{1}{1+e^{(Th-f(x,y))}} (4.10)

    ```


    g(x, y) is the enhanced image. The contrast factor (c) and the threshold value
    (Th) are empirically set to be 5 and 0.3, respectively. As shown in Figure 4.5,
    the advantage of the sigmoid function is to reduce the effect of lighting changes
    by expanding and compressing the range of values of the dark and bright pixels
    in the face image, respectively. This is followed by estimating the fractal dimension
    value of each pixel in the enhanced face image using the proposed FDT approach.
    As mentioned above, the fractal dimension has many important characteristics,
    for instance its ability to reflect the roughness and fluctuations of a face image''s
    surface, and to represent the facial features under different environmental conditions
    (e.g., illumination changes).


    However, fractal estimation approaches are very time consuming and cannot meet
    real-time requirements [7]. Thus the face image is rescaled to (64x64) pixel after
    detecting the face region in order to speed up the experiments and meet the real-time
    system demands. The result is reshaped into a row feature vector FDTVector which
    is used as an input to a nonlinear classifier using DRBM to efficiently model
