    # 12.4.4 Hardware, Libraries, and Frameworks


    In order to catch the parallelism of CNNs, nowadays hardware accelerators are
    developed. Most of them are based on GPUs, which are known to perform well on
    regular parallelism thanks to simd and simd execution models, a dense collection
    of floating-point computing elements at 12 TFLOPS, and high capacity/bandwidth
    on off-chip memories [23]. To support these hardware accelerators, specialized
    libraries for deep learning are developed to provide the necessary programming
    abstraction, such as CuDNN on Nvidia GPU [24]. Built upon these libraries, dedicated
    frameworks for deep learning are proposed to improve productivity of conceiving,
    training, and deploying CNNs, such as Caffe [25] and TensorFlow [26].


    Beyond GPU implementations, numerous FPGA accelerators for CNNs have been proposed.
    FPGAs are fine-grained programmable devices that can catch the CNN parallelism
    with no memory bottleneck, thanks to the following:


    +   1. A high density of hard-wired digital signal processor (DSP) blocks that
    are able to achieve up to 20 (8 TFLOPS) TMacs [8].

    2. A collection of in situ on-chip memories, located next to DSPs, that can be
    exploited to significantly reduce the number of external memory accesses.


    As a consequence, CNNs can benefit from a significant acceleration when running
    on reconfigurable hardware. This has caused numerous research efforts to study
    FPGA-based CNN acceleration, targeting high performance computing (HPC) applications
    [27] and embedded devices [28].


    In the remaining parts of this chapter, we conduct a survey on methods and hardware
    architectures to accelerate the execution of CNN on FPGA. The next section lists
    the evaluation metrics used, then Sections 1.4 and 1.5 respectively study the
    computational transforms and the data-path optimization used in recent CNN accelerators.
    Finally, the last section of this chapter details how approximate computing is
    a key in FPGA-based deep learning, and overviews the main contributions implementing
    these techniques.'
