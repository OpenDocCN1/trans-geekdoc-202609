- pgno: 262
  md: '# 246 Deep Learning in Computer Vision


    diagnosis, and detection of diseases [58]. In medical centers, the interpretation
    of medical images has generally been performed by human specialists, for example,
    radiologists and doctors. Because of vast varieties in pathology and the potential
    exhaustion of human specialists, the use of computer-aided diagnosis systems has
    increased. As medical imaging technologies improve, medical image analysis will
    improve with the support of machine learning methods. Feature representation or
    meaningful feature extraction is important for machine learning prosperity to
    achieve the target tasks. Including radiologists and physicians, use their knowledge
    about the object domains in designing task-related and meaningful features, making
    it difficult for non-specialists to exploit automated learning systems for their
    own examinations [59].


    However, deep learning has mitigated these obstacles by retaining the feature
    extraction step in a learning step [60]. Deep learning requires only the input
    dataset. Thus, feature extraction enables non-specialists in machine learning
    to adequately utilize deep learning for their own applications. Deep learning
    strategies are very successful due to the following:


    +   - Developments in learning algorithms.

    - Advancements in graphics processing units (GPUs) and central processing units
    (CPUs).

    - Dataset availability.


    Generally, deep learning strategies are very successful when the available number
    of image samples in the training stage is very large. For instance, 1 million
    images were given in the ILSVRC competition. However, the medical field has a
    limited number of samples in the dataset, less than 1,000. This increases the
    challenge of developing a deep learning model with a low number of training samples
    without experiencing overfitting. Various strategies have been developed by researchers
    [59], as follows as:


    +   - Reducing the dimension of the input using 2D or 3D patches rather than the
    full images.

    - Using data augmentation to train the network from scratch.

    - Using a pretrained model as a feature extractor and retraining it with the target
    task.

    - Using pretrained model parameters and fine-tuning them with the related medical
    images.

    - Transforming the fully connected layer weights of a pretrained model into convolutional
    kernels.


    There are several medical imaging applications that depend on the type of medical
    images. Medical imaging applications can be categorized based on the human parts
    (such as brain tumor, heart, organ/body part, cell, pulmonary nodes, lymph nodes,
    interstitial lung disease, cerebral microbubbles, and noticeably sclerosis lesion),
    medical image type (MRI, CT, X-ray, ultrasound, and PET), and application'
