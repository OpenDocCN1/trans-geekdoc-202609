    # 11.3.2 Resnet50


    Resnet50 [44] is one of the deep residual neural network (FFNN) with extra connections.
    A model of deep learning based on the residual network passes the input from one
    layer to a far layer by escaping 2 to 5 layers; this method is called "skip connection".
    Some models like Alexnet try to find a solution by mapping some of the input to
    meet the same characteristics as the output, but there is an enforcement in the
    residual network to learn how to map some of the input to some of the output and
    output.


    Resnet50 is a pretrained model consisting of 177 layers and containing a number
    of connections equaling $192\times2$ to connect layers with each other. The input
    layer restricts the size of the input images. The input must be resized to $224\times224\times3$,
    where the width is 224, the height is 224, and the depth is 3. The depth number
    refers to the color space red, green, and blue channels. Resnet50 consists of'
