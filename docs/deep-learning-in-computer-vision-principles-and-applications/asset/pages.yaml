    $(V_1)$, and all second elements will compose $(V_2)$, as follows:


    ```

    $$\begin{pmatrix} P_{11} & P_{12} & \ & & & P_{11rmax} \ P_{121} & P_{122} & &
    P_{12rmax} \ & \vdots & \vdots & \vdots \ P_{MN1} & P_{MN2} & & P_{MNrmax} \end{pmatrix}
    = \begin{pmatrix} V_1 \ V_2 \ \vdots \ V_{M \times N} \end{pmatrix}$ $$ (4.13)$

    ```


    Finally, the fractal dimension value at each pixel $(x, y)$ is computed as the
    fractal slope of the least square linear regression line as follows:


    ```

    $$FD(x, y) = \frac{S_t(x, y)}{S_r}$ $$ (4.14)$

    ```


    Here, $(S_t)$ and $(S_r)$ are the sums of squares and can be computed as follows:


    ```

    $$S_t(x, y) = \sum_{r=1}^{j} \log(r)(V_{(x,y),r}) \left( \sum_{r=1}^{j} V_{(x,y),r}
    \right)^j$ $$ (4.15)$

    ```


    ```

    $$S_r(x, y) = \sum_{r=1}^{j} (log(r))^2$ $$ (4.16)$

    ```


