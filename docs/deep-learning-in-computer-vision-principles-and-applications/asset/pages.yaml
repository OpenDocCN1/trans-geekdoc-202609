    and vertical flipping. Table 11.1 summarizes and compares state-of-the-art methods.


    Innyny et. [42], transfer learning has been applied to a CNN model. To extract
    ROI from images, images have been segmented to discard the background. To overcome
    the limitation of low numbers of images, different methods of augmentation have
    been carried on the segmented images. They achieved 97.70% accuracy. In [43],
    the last layers are replaced in a pretrained CNN model, with different ways of
    augmentation, and fine-tuned; an accuracy of 98.61% is achieved.


    # 11.3 BACKGROUND


    During the last few years, deep neural networks have gained researchers'' attention
    around the world as an alternative approach to extracting features. The core idea
    of deep networks is that these networks automatically select the most important
    features without performing feature extraction [31]. This is a powerful step in
    machine intelligence [33]. Through the following subsections, a brief description
    of the convolutional neural networks is given.


    # 11.3.1 PREPROCESSING


    In machine vision and image-processing applications, segmenting the ROI is a crucial
    task. Image segmentation usually improves the accuracy of classification, since
    this allows the background of the original image to be ignored. We utilized the
    segmentation method of Basavarprasad and Heg [39] to segment the ROIs from the
    color images of skin. In this method, a number of bins is used to coarsely represent
    the input color image. The spatial information is used by coarse representation
    from a histogram-based windowing process, and then the coarse data of the image
    is clustered by hierarchical clustering.'
