    To be able to accomplish this as seen in Figure 7.6, $S_s$ and $r$ are fed into
    a U-Net network and the segmented outputs are subsequently matched.


    **The Segmentation Network:** The task to segment input images $(r, S)$ provides
    classification of input image pixels and is accomplished by U-Net network whose
    architecture is yet another encoding and decoding model that follows the network
    architecture Ronneberger et al. [26]. The segmentation network is able to classify
    images into buildings, roads, and vegetation. Due to the size of images and number,
    each class was trained separately, resulting in a model for each class in each
    dataset.


    **Data Pre-processing:** The images that are used to train the network, presented
    in Figure 7.3,2, each have a large size exceeding $2000\times 2000$ pixels per
    image. Therefore, the images are split into smaller patches of size $224\times
    224$ pixels, similar to the sizes used by VGG [27] or ResNet [28]. Simple normalization
    is applied on each patch by dividing the pixel value by its channel''s highest
    value. After that, the patches are stitched to form the full image. Consequently,
    the same is applied to the ground-true images $(M, L)$.


