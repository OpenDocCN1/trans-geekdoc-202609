- pgno: 7
  md: '# Foreword


    Deep learning, while it has multiple definitions in the literature, can be defined
    as “inference of model parameters for decision making in a process mimicking the
    understanding process in the human brain”; or, in short: “brain-like model identification”.
    We can say that deep learning is a way of data inference in machine learning,
    and the two together are among the main tools of modern artificial intelligence.
    Novel technologies from traditional academic research have fueled R&D in convolutional
    neural networks (CNNs); companies like Google, Microsoft, and Facebook ignited
    the “cracking the code” of data perception, and the term “deep learning” became
    synonymous with decision making.


    Various CNN structures have been introduced and invoked in many computer vision-related
    applications, with greatest success in face recognition, autonomous driving, and
    text processing. The reality is: deep learning is an art, not a science. This
    state of affairs will remain until its developers develop the theory behind its
    functionality, which would lead to “cracking its code” and explaining why it works,
    and how it can be structured as a function of the information gained with data.
    With deep learning, there is good and bad news. The good news is the industry—not
    necessarily academia has adopted and is pushing its envelope. The bad news is
    that the industry does not share its secrets. Industries, are increasingly interested
    in practical and textbook-style descriptions of knowledge.


    This book, Deep Learning in Computer Vision: Principles and Applications—a journey
    in the progress made through deep learning by academia—confines itself to deep
    learning for computer vision, a domain that studies sensory information used by
    computers for decision making, and has its impacts and drawbacks for nearly 60
    years. Computer vision has been and continues to be a system: sensors, computer,
    analysis, decision making, and action. This system takes various forms and the
    flow of information within its components, not necessarily in tandem. The linkages
    between computer vision and machine learning, and between it and artificial intelligence,
    are very fuzzy, is the linkage between computer vision and deep learning. Computer
    vision has moved forward, showing amazing progress in its short history. During
    the sixties and seventies, computer vision dealt mainly with capturing and intercepting
    optical data. In the eighties and nineties, geometric computer vision (geometry
    plus algorithms) to computer vision. During the first decade of the millennium,
    modern computing contributed to the evolution of object modeling with multimodality
    and multiple imaging. By the end of that decade, a lot of data became available,
    and so the term “deep learning” crept into computer vision, as it did into machine
    learning, artificial intelligence, and other domains.


    This book shows that traditional applications in computer vision can be seen through
    invoking deep learning. The applications addressed and described in the eleven
    different chapters have been selected in order to demonstrate the capabilities
    of deep learning algorithms to solve various issues in computer vision. The content
    of this book has been organized such that each chapter can be read'
  merge: -1
  img_proc: true
