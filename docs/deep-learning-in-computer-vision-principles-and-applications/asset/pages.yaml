    # Deep Learning in Computer Vision


    pooling or subsampling layer does promote the robustness of the classifier, since
    it reduces overfitting, eliminates the redundancy of features, and minimizes computation
    [45, 54]. This is because all the reduced attributes represent a single label
    of the input image. However, in the pixel-wise segmentation tasks, the subsampling
    layers cause loss of spatial resolution in the features of input images.


    The second part of the segmentation networks is the upsampling layers followed
    by the softmax classifier, which exploits the extracted features of each individual
    pixel to distinguish it as a tissue or lesion. Recent deep learning segmentation
    approaches have used complicated procedures to compensate for the missing features
    of pixels [45, 47, 48, 50, 51]. Furthermore, these mechanisms require the reduced
    image size, via upsampling, deconvolution, bilinear interpolation, decoding, and
    Atrous convolution, increasing the number of hyper-parameters. Further PI or CRF
    operations to refine boundaries of the segmented objects [51, 54]. These deep
    learning segmentation networks suffer from reduced spatial resolution and loss
    of details. Because pixel-wise dependency is not adequately addressed throughout
    the deep network the previous deep learning segmentation methods such as FCN,
    U-Net, and SegNet, important information about some pixels is left out and is
    not easy to retrieve.


    The full-resolution convolutional networks (FrCN) [12] is an end-to-end supervised
    deep network that is trained via mapping the entire input image to its correct
    ground-truth maps with no resolution loss, leading to better segmentation performance
    of skin lesion boundaries. In fact, the FrCN method is a resolution-preserving
    method that leads to high-level feature learning and improves the segmentation
    performance. The full-resolution feature maps of the input pixels are reserved
    by removing all subsampling layers in the architecture. Figure 10.4 illustrates
    the architecture of the FrCN segmentation method. The FrCN allows each pixel in
    the input dermoscopy to extract its own features utilizing the convolutional layers.


