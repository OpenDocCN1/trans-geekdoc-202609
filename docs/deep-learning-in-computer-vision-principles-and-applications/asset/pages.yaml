- pgno: 265
  md: '# Deep Convolutional Neural Networks


    # 9.8.1 DCNN DESIGN


    A CNN architecture is proposed for brain tumor detection using MRI images. A block
    diagram of the proposed architecture is shown in Figure 9.3 The sequence of processes
    occurs through the proposed structure as follows: brain MRI images are fed to
    the network’s input, and preprocessing is performed to reduce the calculation
    complexity and hence reduce the processing time. Because the database contains
    2D slices, the images are resized to 96×96 pixels because of the varying MRI image
    sizes.


    Later, the network, which contains convolutional layers and fully connected layers,
    is used to classify the input image as normal or abnormal (contains tumor) image.
    The convolutional layers are used to extract features in the feature extraction
    path. Moreover, it contains 7 convolutional layers with a ReLU activation function
    and 7 max-pooling layers. The convolutional layers use a small filter size of
    5×5 pixels to provide features in the images. The max-pooling layer is used after
    each convolutional layer to downsample the convolutional layer output.


    Furthermore, the output path contains a BN layer connected to a ReLU layer and
    a fully connected layer that is followed by a dropout layer. Dropout with different
    values was tested, and we found that a ratio of 0.88 performed with slightly better
    outcomes. At the final stage, another fully connected layer with the softmax function
    is used for the image classification process.


    ![](img/be8864cedd9a2fb32f3521f7cd37aa21_265_0.png)


    FIGURE 9.3 A block diagram of the proposed DCNN architecture for brain tumor detection.'
  merge: -1
  img_proc: true
