  md: '# 8.3.3 SCENE REPRESENTATION AND CLASSIFICATION


    Scene representation is an important topic since it is recognized by mobile robots
    for performing a variety of tasks that depend on semantic and/or geometric information
    from the current scene. In particular, visual navigation is an important ability
    that is needed by autonomous robots for performing general tasks that involve
    autonomously. Classical approaches for representing monochromatic images are based
    on extraction of hand-crafted features, while visual navigation requires the robot
    to have a metric or topological map of its environment, alongside an estimation
    of the depth of the obstacles/objects in the current frame. Deep learning has
    enabled solving a variety of scene-related tasks directly, ranging from encoding
    scene information to performing navigation from raw monochromatic data, without
    the need of hand-craftedbing processes like feature extraction, map estimation,
    or localization. These novel task-oriented algorithms are able to solve difficult
    problems successfully that were not directly affordable. In the following paragraphs
    the use of deep learning in applications such as place recognition, semantic segmentation,
    visual navigation, and 3D geometry estimation is analyzed.


    Place recognition is a task that has been solved successfully using deep learning-based
    approaches. Studies related to this problem are [50, 55]. These methods are able
    to recognize places under severe appearance caused by weather, illumination, and
    changes in viewpoint. Also, in [52], that of LiDAR is used alongside a CNN for
    building a traditional semantic map. The CNN used is based on AlexNet and recognize
    30 msec on an NVIDIA Quadro K4000 GPU. There are several datasets for testing
    algorithms, such as Sun [56] and Places [57, 58], and also several variants derived
    from them. As there is no benchmark for place recognition, different datasets
    use different datasets, customized, and thus most methodologies cannot be compared
    directly. Also, the best-performing methods in detail, but achieve an impressive
