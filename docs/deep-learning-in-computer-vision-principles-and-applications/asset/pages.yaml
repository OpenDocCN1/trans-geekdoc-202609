    Although the results of EFD and BEA are good compared to other existing methods,
    there are certain limitations. Firstly, the size of this model is comparatively
    large, thereby restricting its implementation in CCTV networks. Secondly, the
    accuracy is low and would be problematic for fire brigades and disaster management
    teams.


    With these strong motivations, SqueezeNet, a lightweight architecture, was explored
    for this problem in FLCIE. The experiments for this new architecture were repeated,
    and an improvement of 0.11% in accuracy was achieved. Furthermore, the rate of
    false alarms was reduced from 9.07% to 8.87%. The rate of false negatives remained
    almost the same. Finally, the major achievement of the proposed framework was
    the reduction of the model size from 238 MB to 3 MB, saving an extra 235 MB, which
    can minimize the cost of CCTV surveillance systems.


    For further experimentation, Dataset2 was considered and compared with the results
    from other fire detection algorithms in terms of their relevancy, datasets, and
    years of publication as shown in Table 3.2.


    To ensure a fair evaluation and a full overview of the performance of our approach,
    we considered another set of metrics (precision, recall, and F-measure) as used
    by Chino et al. [47]. In a similar way to the experiments on Dataset1, we tested
    Dataset2 using EFD, BEA, and FLCIE. For the fine-tuned models in EFD and BEA,
    F-measure scores of 0.89 and 0.86, respectively, were achieved. Further improvement
    was achieved using FLCIE, increasing the F-measure score to 0.91 and the precision
    to 0.86. It is evident from Table 3.2 that FLCIE achieved better results than
    the state-of-the-art methods, confirming the effectiveness of the proposed deep
    CNN framework.


