    # 11.4.3 DROPOUT LAYER


    Overfitting is one of CNN''s problems, particularly when using a small dataset
    for the learning model. A powerful tool used for CNN regularization is the dropout
    of layers. Alex-net contains enough fully connected layers; the last fully connected
    layer, FC8, outputs 1000 class scores for different tasks. In this chapter, the
    last fully connected layer (FC8), the SoftMax layer, and the classification layer
    have been dropped out and replaced with a new fully connected layer (for two classes:
