- pgno: 59
  md: '# Object Detection with Convolutional Neural Networks


    **Two-stage models.** Inspired by image classification, it is natural for researchers
    to detect objects by exploring a two-stage approach. In two-stage models, the
    first stage is for region proposal, followed by image classification on the proposed
    regions. With this modification, additional work is done on localization, with
    changes to previous classification models. For the region proposal, some systems
    employ sliding window technique, Deformable Parts Models (DPM) [38] and OverFeat
    [39]. With certain strategies, these methods use apply classifiers on windows
    at different locations with different scales. Another region proposal is selective
    search [40], which is adopted by regions with CNN features (R-CNN) [41]. It selectively
    extracts around 2000 bottom-up region proposals [41], which greatly reduces the
    regions needed in sliding window methods.


    The two-stage models, generally speaking, yield high accuracy. With each stage
    doing its specific task, these models perform better on objects with various sizes.
    However, with the demands for real-time detection, two-stage models show their
    weakness in processing speed.


    **One-stage models.** With more and more powerful computing ability, CNN layers
    are becoming deeper and deeper. Researchers are able to utilize one-stage methods,
    like YOLO (You Only Look Once) [34] and SSD (single-shot multil detector) [42],
    with faster detection speed and similar or sometimes even higher accuracy. One-stage
    models usually divide the image into $N \times N$ grids. Each grid cell is responsible
    for the object whose center falls into that grid. Thus, the output is $N \times
    N \times S$ tensor. With each $S$ feature maps is an $N \times N$ matrix, with
    each element describing the feature on its corresponding grid cell. A common design
    of features for one object consists of the following $S=(5+C)$ values:


    +   - Four values for the bounding-box dimensions (x coordinate, y coordinate,
    height, and width);

    - One value for the possibility of this grid cell containing the object;

    - C values indicating which class object belongs to.


    One-stage models, thanks to their simpler architecture, usually require less computational
    resource. Some recent networks could access more than 150 frames per second (fps)
    [43]. However, the trade-off is accuracy, especially for small-scale objects as
    shown in Table 2.2 in Section 2.5.1. Another drawback is the imbalance during
    training. In order to detect $B$ objects in a grid, the output tensor mentioned
    above contains information for $N \times N \times B$ number of anchor boxes. Among
    them, only a few contain objects. The ratio of the most is about 1000:1 [36].
    This results in low efficiency during training.


