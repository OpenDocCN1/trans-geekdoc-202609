  md: 'This chapter provides a comprehensive foundation for deep convolutional networks.
    The basic components of CNNs are summarized. Then, we present some later developments
    in various aspects of CNNs, including the convolutional layer, pooling layer,
    activation function, fully connected layers (FCLs), regularization, optimization,
    normalization, and network depth, we present the advances in each phase. Next,
    some network activations are discussed, fine-tuning, reducing overfitting, and
    using CNN activations as features. Then commonly used networks, such as AlexNet,
    GoogleNet, VGG-19, and ResNet, are presented. The theoretical knowledge of CNN
    types along with the three common architectures and learning algorithms is provided.
    Moreover, these networks are called region-based CNNs (R-CNNs), fully convolutional
    networks (FCNs), and hybrid learning networks.


    CNNs are widely applied in different domains because of their outstanding performance,
    such as image classification, object detection, speech recognition, face detection,
    vehicle recognition, facial expression recognition, segmentation of MR brain images,
    and many more. This chapter also introduces various processing applications of
    deep convolutional networks in medical imaging, as feature extraction, tumor detection,
    and tumor segmentation. This study will serve as a reference and resource for
    researchers who are interested in this field.


    This chapter is arranged as follows: It presents the general foundations of CNN
    (Section 9.2). Section 9.3 is devoted to efficient learning approaches. The network
    operations and a brief introduction to the current programming tools available
