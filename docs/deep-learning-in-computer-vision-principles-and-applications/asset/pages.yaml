  md: '# Editors Bio


    Mahmoud Hassaballah was born in 1974, Qena, Egypt. He received his BSc degree
    in Mathematics in 1997 and his MSc degree in Computer Science in 2003, both from
    South Valley University, Egypt, and his Doctor of Engineering (D Eng) in computer
    science from Ehime University, Japan in 2011. He was a visiting scholar with the
    department of computer & communication science, Wakayama University, Japan in
    2013 and GREAH laboratory, Le Havre Normandy University, France in 2019. He is
    currently an associate professor of computer science at the faculty of computers
    and information, South Valley University, Egypt. He served as a reviewer for several
    journals such as IEEE Transactions on Image Processing, IEEE Transactions on Fuzzy
    Systems, Pattern Recognition, Pattern Recognition Letters, IET Image Processing,
    Journal of Real-Time Image Processing, and Journal of Electronic Imaging. He has
    published over 50 research papers in refereed international journals and conferences.
    His research interests include feature extraction, detection/recognition, artificial
    intelligence, biometrics, image processing, computer vision, machine learning,
    and data hiding.


    ![](img/be8864cedd9a2fb32f3521f7cd37aa21_13_0.png)


    Ali Ismail Awad (IEEE, PhD, MSc, BSc) is currently an Associate Professor (Docent)
    with the Department of Computer Science, Electrical, and Space Engineering, Luleå
    University of Technology, Luleå, Sweden, where he also serves as a Coordinator
    of the Master Program in Information Security. He is a Visiting Researcher with
    the University of Plymouth, United Kingdom. He is also an Associate Professor
    with the Electrical Engineering Department, Faculty of Engineering, Al-Azhar University
    at Qena, Qena, Egypt. His research interests include information security, Internet-of-Things
    security, image analysis with applications in biometrics and medical imaging,
    and network security. He has edited or co-edited five books and authored or co-authored
    several journal articles and conference papers in these areas. He is an Editorial
    Board Member of the following journals: Future Generation Computer Systems, Computers
    & Security, Internet of Things: Engineering Physical Human Systems, and Health
    Information Science and Systems. Dr Awad is currently an IEEE senior member.


