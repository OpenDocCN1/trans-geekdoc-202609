    # 6.2 CONVOLUTIONAL NEURAL NETWORKS


    Recently, convolutional neural networks (CNNs) and in particular deep learning
    have played a great role in computer vision, and they are exploited in various
    applications for AD. In this section, a brief introduction about deep CNN is presented,
    i.e., how neural networks are used in machine learning, and the idea behind it.
    Afterwards, semantic segmentation, which is one of the main applications of deep
    learning in AD, is discussed.


    # 6.2.1 OVERVIEW OF DEEP CNN


    Deep learning is a specialized form of machine learning. Generally, a machine
    learning algorithm starts after the phase of machine control in a given input,
    whether it is an image or any type of input. The features are then used to create
    a model that performs the classification task to the input data [25]. In the deep
    learning workflow, relevant features are automatically extracted from images.
    From this comes the power of deep learning, as it has the capacity to extract
    relationships and features that cannot be perceived by humans. In addition, deep
    learning performs end-to-end learning, where a network is given raw data and a
    task to perform, such as classification, and it learns how to do this automatically
    [26].


    There are several types of deep neural networks; each of one, built to deal with
    input images, In CNN algorithms, each level in the deep network learns to transform
    its input into a more abstract and composite representation [27]. For example,
    in an image recognition application, the raw input is a matrix of pixels. The
    first layer may abstract the features and encode them; the second layer may encode
    arrangements of edges. The third layer may encode specific features like a nose
    or eye, and the fourth layer may recognize that the image contains a face. The
    whole pipeline takes without manual feature selection as opposed to conventional
    algorithms, where specific characteristics are searched in order to recognize
    which images contains faces. For, deep learning has gained great attention in
    the 2010s over the development of AlexNet [28] in the ImageNet challenge, where
    an error of 16% was achieved for the classification task in the ImageNet challenge.


    The CNNs are used for various tasks, depth estimation, object detection, localization,
    classification, semantic segmentation, and several others. The goal of a CNN is
    to learn higher-order features in the data by using convolutions. In a convolutional
    neural network, an input 3-RGB channel image of 300×300 pixels would create 270,000
    connection weights per hidden neuron if it is fully connected, which'
