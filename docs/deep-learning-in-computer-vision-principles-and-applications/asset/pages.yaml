    # 2.4.1 DEEP RESIDUAL LEARNING (RESNET)


    Degradation is the detection accuracy drop when the network depth increases. Theoretically,
    this should not happen. If we assume the optimal network for a problem domain
    consists of a certain number of layers, an even deeper network should be as good
    as the optimal at one. The reason is that the added layers can be trained as identity
    mappings, which simply take the input and pass it to the next layer. The fact
    that degradation exists in practice implies some systems are more difficult to
    learn the network to find the desired mappings. The key block diagram for ResNets
    was published in December 2015. The effort evolves [35]. The effort around assisting
    the network for ResNets is shown in Figure 2.5.


    The desired mapping without a skip connection is denoted as $\mathcal{H}(x) =
    \mathcal{F}(x) + x$. By introducing the skip connection, which is an identity
    connection, the layers are forced to fit the new mapping, $\mathcal{F}(x) = \mathcal{H}(x)
    - x$ is defined as the residual mapping. In addition, the paper hypothesizes that
    optimizing the residual mapping is easier than the original mapping. For example,
