    # 7.2.2 CALIBRATION


    Calibration is an integral part of the framework and is called upon $S_{(i)}$
    and every five iterations $(S_{(i5)})$ frames. It is responsible for finding the
    initial location, the difference in scale, and orientation between the $S_s$ and
    its corresponding field of view in $r$, and to autocorrect any drift that may
    occur. To accomplish this task, SIFT is used to make sure that the localization
    estimation is checked and updated every period. That is, under the condition of
    being the first frame, or the third sequence frame, $S$ and $r$ are related to
    the SIFT registration, which gives out a homography that is applied to $r$ and
    also updates the drone location as shown in Figure 7.4. SIFT is robust; however,
    it is time consuming and is not used frequently for computational overhead.


    As stated before, knowing the initial GPS coordinates, a region of $r$ is cropped
    from $r$ around the coordinate, that $r=R(i, w_{isp})$ where $i$ is the coordinate
    at the center and the width is determined by $w_{isp}$, which is equal to the
    width of $S$ plus a margin $b$. This is for the purpose of searching for the features
    extracted from $S_s$ from $r$. As seen in Figure 7.5, $r$ covers a wider region
    than the one in $S$. Furthermore, to get the pixel location $i$ from the coordinate,
    this conversion is calculated by Equations 7.1 and 7.2, which maps the GPS bounds
    of $R$ to its pixel size, which returns for each pixel its GPS location. This
    process results in reducing the search space and eliminates the possibility for
    the matching to go astray.


    ```

    $pix_x = \frac{(width_{max} - width_{min})(lon - lon_w)}{(lon_{max} - lon_w)}$

    ```


    ```

    $pix_y = \frac{(height_{max} - height_{min})(lat - lat_n)}{(lat_{max} - lat_n)}$

    ```


    ```

    $lat = \frac{lat_n + (lat - lat_n)(pix_x - height_{min})}{(height_{max} - height_{min})}$

    ```


    ```

    $lon = \frac{lon_w + (lon - lon_w)(pix_y - width_{min})}{(width_{max} - width_{min})}$

    ```


