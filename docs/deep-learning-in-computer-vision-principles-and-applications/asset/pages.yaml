  md: '# 4.4.1.2 Discriminative Restricted Boltzmann Machines


    In the classification stage, a single RBM with two sets of units is trained as
    a nonlinear classifier to efficiently model the joint distribution of inputs and
    target classes. In addition to the visible units that represent a data vector,
    there is a softmax label unit that represents the predicted classes. After training,
    each possible label is tried and the one that gives lowest energy is chosen as
    the most likely class. As reported in the literature, it is intractable to compute
    the $v_jmodel$ in Eq. 4.4. Therefore, the contrast divergence (CD) algorithm [59]
    has become the standard learning method to update the RBM by sampling $k$ steps
    from the RBM to approximate the second term in Eq. 4.4. Efficient training requires
    optimized training parameters (e.g., learning rate, weight-cost, the momentum,
    the initial values of the weights, the size of each mini-batch, the number of
    hidden units, etc.). Other decisions need to be made, including the types of hidden
    units to be used, how many times to update the binary states of the hidden units
    for each epoch, how to monitor the progress of learning, and how to terminate
    the training process. One step of a CD algorithm for a single sample can be implemented
    as follows:


    +   1. Visible units ($v_i$) are initialized using training data, and the probabilities
    of hidden units are computed with Eq. 4.2. Then, a hidden activation vector ($h_j$)
    is sampled from this probability distribution.

    2. Compute the outer product of $(v_i)$ and $(h_j)$, which refers to the positive
    phase.

    3. Sample a reconstruction ($v''_i$) of the visible units from $(h_j)$ with Eq.
    4.3, and from $(v''_i)$ sample the hidden units activations ($h''_j$). (One Gibbs
    sampling.)

    4. Compute the outer product of $(v''_i)$ and $(h''_j)$, which refers to the negative
    phase.

    5. Update weights matrix and biases with Eq. 4.4, Eq. 4.5, and Eq. 4.6.


