  md: '# 10.3.5 EVALUATION METRICS


    To quantitatively evaluate the efficiency and capability of the deep FrCN method
    on skin lesion boundary segmentation, the following statistical evaluation measures
    were utilized. Sensitivity (a.k.a., recall, or true positive rate) measures the
    ratio of the skin pixels that are correctly segmented, while the specificity (a.k.a.,
    the true negative rate) indicates the proportion of the non-skin lesion pixels
    that are not correctly segmented [57, 83, 84]. The dice coefficient, also known
    as the F-score, was also utilized to quantify the efficiency of the FrCN segmentation
    method. This measures the similarity between the segmented lesions and the delineated
    ground-truths [85, 86]. The Jaccard index (JAC) is an intersection over union
    of the ground-truth masks with the segmented lesions [87]. Accuracy is also provided
    to show the overall pixel-wise segmentation performance. The Matthew correlation
    coefficient (MCC) measures the correlation between the segmented and annotated
    skin lesion pixels produces values in a range from -1 to +1 [87]. A higher MCC
    value implies a better segmentation performance. All of these metrics were computed
    in relation to the elements of the confusion matrix as.


    ```

    Sensitivity (SEN) = \frac{TP}{TP + FN} (10.4)

    ```


    ```

    Specificity (SPE) = \frac{TN}{TN + FP} (10.5)

    ```


    ```

    Dice Index (JAC) = \frac{2 \cdot TP}{(2 \cdot TP) + FP + FN} (10.6)

    ```


    ```

    Jaccard Index (JAC) = \frac{TP}{TP + FN + FP} (10.7)

    ```


    ```

    Accuracy (ACC) = \frac{TP + TN}{TP + FN + TN + FP} (10.8)

    ```


    ```

    MCC = \frac{TP \cdot TN - FP \cdot FN}{\sqrt{(TP + FP)(TP + FN)(TN + FP)(TN +
    FN)}} (10.9)

    ```


    TP and FP denote the true and false positives, while TN indicate the true and
    false negatives, respectively. If the lesion pixels were correctly segmented,
    they were considered as TPs; otherwise, they were FNs. On the contrary, the non-skin
    pixels were considered as TNs if their segmentation was classified as non-lesion;
    otherwise, they were FPs. An illustration of the sensitivity and specificity concept
    with a dermoscopy image for classification is shown in Figure 10.6. Moreover,
    the curve of the receiver operator characteristic (ROC) with its area under the
    curve (AUC) was used for further segmentation evaluation.'
