    added to bias. The convolution input can be raw pixels or an output feature map
    from the previous layer. The convolution is known in deep learning as a feature
    detector for the CNN where the values in kernels define an operation for feature
    detection. A kernel with ones in the middle columns is used to detect vertical
    edges within the input patch. The output of each convolution operation is called
    a feature map. Stacking the output feature maps for different kernels generates
    a 3D output volume.


    Convolution filters define a small bounded region to output activation maps from
    the input volume through connection with only a subset of the input volume. This
    allows us to handle high-quality feature extraction utilizing the spatial correlation
    between pixels reduces the number of parameters per layer compared to fully connected
    neurons [31]. Since depth of the input volume is 3, the convolution layer as well
    should have a depth of 3. Convolution kernels connect to the bounded region on
    the image in terms of width and height; however, the depth always has to be the
    same. CNN use parameter sharing using a certain filter while the filters scale
    the image or feature map instead of defining new parameters. There are several
    parameters to control a filter in CNN such as receptive field, depth, stride,
    and zero-padding.


    **Receptive field:** This term refers to the spatial filter size, in terms of
    width and height. A receptive field of 5x5x3 means that it has a 5-pixel width,
    a 5-pixel height, and 3 channels of depth. Usually, filters of the first convolutional
    layer have depths of 3 to accept an RGB image volume of 3 channels.


    **Output depth:** The neuron count in the convolutional layer connected to the
    same region of the input volume, meaning that it refers to the number of filters
    used in the convolutional layer.


    **Stride:** This refers to the step used by the filter to scan through the input
    volume. A stride of 1 means the filter moves horizontally and vertically with
    one-pixel steps, resulting in a dense output volume of a large number of depth
    columns, as there is a overlap between receptive fields.


    **Zero-padding:** This is very helpful to control the spatial size of the output
    volume. This is required to be the output volume the same as the input volume.
    Additionally, if convolutions are done without zero-padding and the size is reduced,
    the information at boundaries will be lost quickly.


    **Batch normalization:** This layer is used in deep learning to speed up the training
    by making normalization part of the network. If example, input values are in a
    range from 1 to 1,000 and from 1 to 10, the change from 1 to 2 in the section
    represents a 10% change in the input value, but actually represents only 0.1%
    change in the first. Normalizing the inputs will help the network faster and more
    accurately without biasing certain dimensions over the others. Batch normalization
    uses a very similar approach, however, for the hidden layers changing the outputs
    all the time. Since the activations of a previous layer are the inputs of the
    next layer, each layer in the neural network faces a problem due to input distribution
    change with each step. This problem is termed "covariate shift". The basic idea
    behind batch normalization is to limit covariate shift by normalizing the activations
    of each layer through transforming the inputs to be 0 and unit variance. This'
