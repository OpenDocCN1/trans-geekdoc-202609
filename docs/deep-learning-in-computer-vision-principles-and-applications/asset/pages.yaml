    for the testing set. In these experiments, the parameter optimization process
    is performed on the training set using the 10-fold cross-validation procedure
    that divides the training set into k subsets of equal size. Consequently, one
    subset is used to assess the performance of the DRBM classifier trained on the
    remaining k-1 subsets. Then, the average error rate (AER) over 10 trials is computed
    as:


