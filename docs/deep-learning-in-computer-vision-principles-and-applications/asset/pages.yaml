    modules in many various applications, such as photography, mapping, agriculture,
    surveillance, rescue operations, and the recently famous delivery systems. The
    UAV applications mentioned previously and the ones available in the current market
    are currently controlled by radio communications through a controller, a software
    that plans the route, or using the on-board camera.


    Conventionally, UAV navigation has relied on inertial sensors, at altitude meters,
    and sometimes on feed commands to their motor controller. The latter modality
    uses the Global Navigation Satellite System (GNSS) composed of different regional
    systems such as GPS (which is owned by the United States), GLONASS, Galileo, Beidou,
    and others located at the Medium Earth Orbit with the purpose of providing autonomous
    geo-spatial positioning [2]. This is provided in latitude, longitude, and altitude
    data. Both terms, “GPS” and “GNSS”; are commonly used interchangeably in UAV navigation
    literature. The signal transmitted from the GPS satellites could be affected by
    the distance and the ambient/background noise enabling in numerous places with
    higher vulnerability to entry/orblock in urban areas causing loss of light (LOS)
    to navigational satellites. However, as GPS is denied, meaning that the GPS signal
    is not available or weak, and this necessitates finding alternative approaches
    to UAV guidance.


    A plethora of work has been proposed for UAV localization using inertial measurement
    unit (IMU) readings and on-board camera to acquire features that are stored in
    a feature database. Scaramuzzi et al. [3], Chowdhury et al. [4], and Ray et al.
    [5] offer examples of these methods. During UAV flight, information in the pre-acquired
    feature database is used to acquire UAV location based on matching extracted features
    with those in the database. Similar work [6] uses online mapping services and
    feature extraction to be a UAV as well as terrain classification. Mantelli et
    al. [7] used abBRIEF for global localization and estimated the UAV pose in 4 degrees
    of freedom.


    Currently, the abundance of satellite and aerial high-resolution imagery [8] covering
    most of the globe has facilitated the emergence of new applications such as autonomous
    vision-only UAV navigation. In this case, UAV images are compared with aerial/satellite
