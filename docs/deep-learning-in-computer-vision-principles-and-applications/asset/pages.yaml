    # 6.5.2 Early-Fusion Network


    Using this network, we investigate early fusion for pixel-level fusion, where
    the raw inputs are fused together before extracting any features using the deep
    network. The input to the network in this case is a 3D volume containing the original
    RGB image concatenated with the DOF image, or the depth map. The RGB image consists
    of 3 layers, and the DOF map consists of 1 layers. Concatenation is performed
    across the input volume''s depth axis, so after concatenation we obtain an input
    3D volume with the same image resolution, and with a depth of 4 layers. In this
    network, the architecture of the Single-Input network is used and the VGG pre-trained
    weights are utilized to initialize the network. However, the first layer is adapted
    that it accepts an input of four layers, and the weights are initialized randomly.
    Figure 6.5 shows the concatenation of the 3-layer RGB with a 1-layer depth map
    for a 4-layer-3D volume to be fed to. The same network is used to investigate
    the effect of early fusion with DOF, where several optical flow representations
    have been studied experimentally to find the best-performing input, namely, color
    wheel representation in 3 channels, magnitude and direction in 2 channels, and
    magnitude only in 1 channel.


    # 6.5.3 Mid-Fusion Network


    In this architecture, a two-stream network of two parallel VGG16 encoders for
    extracting information from two different cues is implemented by the works [82–84].
    The feature maps from both streams are fused together using a fusion junction
    producing both features of the same dimensions as the output from the Single-Input
    network encoder. The same decoder described in the Single-Input network, which
    consists of three transposed convolution layers, is used to perform upsampling.
    Figure 6.6 illustrates an example of a mid-level feature fusion approach where
    the information from both streams is fused together using a summation junction
    after feature extraction. Following the same approach as the singlestnetwork,
    skip connections are utilized to benefit from high-resolution feature maps. This
    approach provides more flexibility for each stream to learn separately. Accordingly,
    the outputs of both are then fused, which has the advantage of the ability to
    initialize both encoders with the VGG pre-trained weights. However, the model
    is computationally more complex than the Early-Fusion single-stream network.'
