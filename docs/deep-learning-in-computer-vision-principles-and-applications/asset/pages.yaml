    using Haversine Distance Formula, as illustrated in Figure 7.18.


    The UAV Sequence Experiment: As explained in Section 7.2.6, the registration of
    S is using ORB features due to their efficiency. Carrying over from the calibration
    step, the image registration process between S_n and S_nv yields a translation
    that is added to the location estimated from the calibration step. Therefore,
    the registration of S is called for the same number of frames. In fact, since
    the UAV is not likely to travel far in one second, S_n and S_nv are likely to
    cover nearly identical scenes.


    In our experiment, these steps are taken to ensure that a registration is satisfactory
    before taking it into account:


    +   - A path is created from the center points of the UAV sequence frames to set
