    # 3.5 CONCLUSIONS


    Recently, convolutional neural networks (CNNs) have shown substantial progress
    in surveillance applications; their key roles in early fire detection, localization,
    and fire scene analysis have not been investigated. With this motivation, CNNs
    were investigated for addressing the aforementioned problems in this chapter for
    fire detection and localization, achieving better detection accuracy with a minimum
    false alarm rate compared to existing methods. Several highly efficient and intelligent
    methods that selected deep features for fire scene analysis in both indoor and
    outdoor surveillance have been presented.


    In this chapter, a total of three CNN-based frameworks have been proposed. The
    first framework was proposed for early fire detection using CNNs in surveillance'
