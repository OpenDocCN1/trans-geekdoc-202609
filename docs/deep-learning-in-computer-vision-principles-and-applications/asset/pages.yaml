  md: '# 11.3.2 CONVOLUTIONAL NEURAL NETWORKS


    A convolutional neural network (CNN) consists of stacked layers in a given layer
    has learned from the previous layer in a linear or nonlinear way [27]. Any CNN
    model contains building blocks consisting of the following:


    +   1. Convolutional layer: Applies a convolution operation to the input image
    by passing the result to the next layer.

    2. Pooling layer (also called subsampling or down-sampling): Reduces the dimensionality
    of feature map but retains the most important information. Spatial pooling can
    be of different types: max, average, sum, etc.

    3. Nonlinear rectified unit (ReLU): Element-wise operation (applied per pixel)
    that replaces all negative pixel values in the feature map with zero and that
    is connected to a regular multilayer neural network a fully connected layer.

    4. Connected layer: A traditional multilayer perceptron that uses a SoftMax activation
    function in the output layer and every neuron in the previous layer is connected
    to every neuron on the next layer.

    5. Loss layer: Specifies how training penalizes the deviation between the predicted
    and true labels, being at the backend.


    CNNs have been used successfully with significant improvement in different applications
    such as natural language processing [28] and visual tasks [29]. Many deep convolutional
    networks (DCNNs) are available, including LeNet, Alex-net, ZFNet, GoogLeNet, VGGNet,
    and ResNet, [30, 31].


    # 11.3.2.1 Alex-Net CNN Model


    Alex-net was developed by Krizhevsky et al. [29] as a DCNN model. It is used for
    the ImageNet large-scale visual recognition challenge (ILSVRC) [30]. The input
    image of Alex-net must be resized to the specific size 227×227×3, where the width
    (W) is 227, the height (H) is 227, and the depth (D) is 3. The depth number refers
    to the red, green, and blue channels. The input image is filtered by using the
    first convolutional layer with a number of kernels (K) equal to 96, with a filter
    (F) size of 11×11, and a stride (S) equal to 4 pixels. The stride is defined as
    the distance between responsive field centers of neighboring neurons. The size
    of the convolution layer output is computed using the mathematical form (W-F+2P)/S+1,
    where P refers to the number of padded pixels, here for input size of 227×227×3,
    the W=227, F=11, S=4, K=96, and the size of the convolution layer output is (227-11+0)/4+1
    = 55. The size of the convolution layer output is


    The computational load for the second convolutional layer is distributed to two
    GPUs; therefore, the load for each GPU is 55×54×48. The output of the first convolutional
    layer is the input to the second convolutional layer, which consists of max pooling
    followed by convolution. The max pooling is 55/2×54/2≈27×27×96. The input in this
    layer is filtered using 256 filters. The size of each filter is 5×5×48'
