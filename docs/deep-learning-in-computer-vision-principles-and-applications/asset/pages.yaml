  md: '2. An efficient and real-time multi-biometric face recognition system based
    on building deep learning representations and fusing the results obtained from
    two discriminative deep learning approaches (i.e., CNN and DBN) is proposed and
    termed the FaceDeepNet system. To the best of our knowledge, this is the first
    work that investigates the potential use of the CNN and the DBN for fusing the
    face-matching scores in a unified biometric system. In this chapter, a parallel
    architecture is considered, which allows a high degree of flexibility to use different
    approaches for encoding the face features depending on the required security level
    and the users'' convenience.


    3. Discriminative training schemes equipped with a number of training strategies
    (e.g., Dropout method, AdaGrad algorithm, Data augmentation, etc.) are also employed
    in order to prevent overfitting during the learning process and increase the generalization
    ability of the proposed DNNs.


    4. Another contribution of this work is to further examine and validate the current
    findings for improving the generalization ability and reducing the computational
    complexity of the DNNs (e.g., CNN and DBN) by assigning the handcrafted features
    (e.g., feature representations obtained from the FDT approach) to the visible
    units of the DNNs instead of the pixel intensity representations to learn additional
    and complementary representations. We demonstrate that the proposed FaceDeepNet
    system can represent large-scale face datasets, with less time required to obtain
    the final model compared to the direct use of raw data. In addition, the proposed
    FaceDeepNet system is able to efficiently handle nonlinear variations of face
    images and is unlikely to overfit the training data due to the high nonlinearity
    of the proposed DNNs.


    5. The performance of the proposed approaches has been tested and evaluated in
    both face identification and verification tasks by conducting a number of extensive
    experiments on four large-scale unconstrained face datasets: SDUMLA-HMT, FRGC
    V 2.0, UFI, and LFW. Recognition rates compared to those of state-of-the-art methods
    have been achieved using only the proposed FDT-DRBM approach. New state-of-the-art
    recognition rates were achieved using the FaceDeepNet system on all the employed
    datasets, in particular when it is trained on top of the output feature representations
    of the FDT approach.


    # 4.2 RELATED WORK


    Generally, a number of approaches have been proposed and developed to overcome
    all/some of the aforementioned drawbacks and problems in the face recognition
    system. However, very few of them were capable of working in fully unconstrained
    environments. These approaches can be broadly divided into two categories: handcrafted-descriptor
    approaches, and learning-based approaches [17]. The next sections are devoted
    to outlining these approaches and their usage to address the face recognition
    problem, before discussing their respective strengths and limitations.'
