    \ optimization, the CNN execution can be accelerated when employing approximate\
    \ computing, which is known to perform efficiently on FPGAs [73].\n\nIn the methods\
    \ detailed in this section, a minimal amount of the CNN accuracy is traded to\
    \ improve the computational throughput or energy efficiency of the accelerator.\
    \ Two main strategies are employed. The first implements approximate *arithmetic*\
    \ to reduce precision. The second aims at reducing the number of operations occurring\
    \ in CNN models without critically affecting the modeling performance. Note that\
    \ both approaches resort to *fine-tuning* in order to compensate the accuracy\
    \ loss introduced by approximate computing.\n\n# 1.6.1 APPROXIMATE ARITHMET FOR\
    \ CNNs\n\nSeveral studies have demonstrated that the precision of both operations\
    \ and operands in CNN, and more generally in neural networks, can be reduced without\
    \ critically affecting their predictive performance. This reduction can be achieved\
    \ by *quantizing* either or of the CNN inputs, weights, and or FM using a fixed-point\
    \ numerical representation.\n\n# 1.6.1.1 Fixed-Point Arithmetic\n\nIn a general\
    \ way, CNN models are deployed in CPU and GPU using the same precision they were\
    \ trained, with the *single-precision floating-point* representation. This format\
    \ employs 32 bits, arranged according to the IEEE754 standard. As FPGAs support\
    \ floating operations, various implementations [39, 62, 67] employ such data representation.\n\
    \nNonetheless, numerous studies [74–76] demonstrate that the inference of CNNs\
    \ can be achieved with a reduced precision of operands. More particularly, works\
    \ in [77, 78] demonstrate the application of fixed-point $(F\times P)$ arithmetic\
    \ to train and infer CNNs. The $F\times P$ representation encodes numbers with\
    \ a given width $b$, using $i$ bits for the integer part, and $f$ bits for the\
    \ *fractional* part ($b=i+f$). Note that the value of $i$ is selected according\
    \ to the desired *numerical range*,"
