    # 1.4.3 FAST FOURIER TRANSFORM


    Fast Fourier Transform (FFT) is a well known algorithm to transform the 2D convolutions
    emw in the frequency domain, as shown in Equation 1.26:


    ```

    conv2D(X[c],Θ[n,c]) = FFT(X[c]) * FFT(Θ[n,c]) (1.26)

    ```


    Using FFT to process 2D convolutions reduces the complexity from $O(W^2 \times
    K^2)$ to $O(W^2log(W))$, which is exploited to derive FPGA-based accelerators
    and to infer CNN [34]. When compared to standard filtering and Winograd algorithm,
    FFT has its contents over large kernel size ($K>5$), as demonstrated in [53, 55].
    The computational complexity of FFT convolutions can be further reduced to $O(Wlog(K))$
    using the overlap-and-add method [56], which can be applied when the signal size
    is much larger than the filter size, which is typically the case in conv layers
    ($W >> K$). Systolic leverage of the overlap-and-add to implement frequency domain
    acceleration for conv layers on FPGA, which results in a computational throughput
    of 88 GOPs for AlexNet (Table 1.3).


    # 1.5 DATA-PATH OPTIMIZATIONS


    As highlighted in Section 2.4.2, the execution of CNN exhibits numerous sources
    of parallelism. However, due to the resource limits of FPGAs, it might be impossible
    to fully exploit all patterns, especially with the sheer volume of operations
    involved in deep topologies. In other words, the execution of recent CNN models
    cannot fully be unsettled, not even for a single conv layer.


    To address this problem, the general approach, advocated in state-of-the-art implementations,
    is to map a limited number of processing elements (PEs) on the FPGA. These PEs
    are reused by temporally interleaving data through them.


    # 1.5.1 SYSTOLIC ARRAYS


    Early FPGA-based accelerators for CNN implemented systolic arrays to accelerate
    the 2D filtering in convolutions [58—61]. As illustrated in Figure 1.5a, systolic
    arrays employ a static collection of PE, typically in a 2-dimensional grid. This
    PE operate as a co-processor under the control of a central processing unit. The
    inefficient of systolic arrays is agnostic to the CNN model, making them insufficient
    to process large-scale networks for the reasons:


    First, the static collection of PE can support convolutions only to a given filter
    size $K_m$, where typical values of $K$ range from [59] to 10 in [61]. Therefore,
    in convolutional layer ($l$), $K_i > K_m$ is not supported by the accelerator.
    Second, systolic arrays suffer from under-utilization when processing layers in
    the kernel size $K_i$ is much smaller than $K_m$. This is for instance in [61],
    where the processing of $3\times 3$ convolutions uses only 9% of DSP blocks, while
    the processing of layers can be further parallelized and thus accelerated. Third
    and finally, PE in systolic arrays do not usually include memory caches and have
    to fetch their inputs from'
