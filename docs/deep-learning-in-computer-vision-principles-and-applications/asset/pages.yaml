    # 4.5.3 FACE VERIFICATION EXPERIMENTS


    In this section, LFW datasets were used to evaluate the robustness and effectiveness
    of the proposed face recognition approaches to address the unconstrained face
    verification problem. The face images in the LFW dataset were separated into two
    distinct views. "View-1" is used for selecting and fine-tuning the parameters
    of the face recognition model, "View-2" is used to report the final performance
    of the selected recognition model. In "View-2", the face images are paired to
    6,000 pairs, with 3,000 pairs labeled as positive pairs, and the negative as pairs.
    As described in [63], the final performance is reported by the mean accuracy rate
    (â) and the standard error of the mean accuracy (SE) over 10-fold cross-validation,
    with 300 positive and 300 negative images per fold. For a fair comparison between
    all face recognition approaches, evaluation protocols were pre-defined by the
    creators of the LFW dataset, as described in [73]


    In these experiments, the “Image-Restricted, Label-Free Outside Data” protocol
    was followed, where only the data is used to train the proposed deep learning
    approaches. Additionally, the aligned LFW-fa* dataset is used, and the face images
    were resized to (64x64) pixels after the face region has been detected using pre-trained
    Viola-Jones* face detector or outside data (e.g.,


    > * http://www.opencv.ac/home/hassner/data/lfwa/

    † Incorrect face detection results were assessed manually to ensure that all the
    subjects were included in the subsequent evaluation of the proposed approaches.'
