  md: '# Deep Learning in Computer Vision


    Therefore, the subsequent consequent initiation after convolution has 96 channels,
    and we are now able to apply another arrangement of multichannel features for
    these features as well. The 2D convolution can be defined as in Equation 9.1 [17].


    ```

    y(i,j) = x(i,j) * w(i,j) = \sum_{m,n} x(m,n)w(i-m, j-n). \quad (9.1)

    ```


    where x is the input and w is the weight that is proved from the previous layer.
    The convolutional matrix size is m×n, and the convolutional layer output is y.
    The input of the CNN and the convolutional kernel dimensions should be the same.
    A multidimensional kernel should be used if the CNN is a multidimensional array
    [17].


    # 9.2.1.2 Max-Pooling Layer


    The Neocognitron displayed the consideration of basic cells as convolutions. Proceeding
    in a similar way, the complex cells can be considered as a max-pooling task. This
    task can be thought of as a maximum filter, where every nx area is planted with
    its maximum value [18]. The max-pooling task requires the following:


    +   1. Selection of the most astounding activity in a region, which by providing
    a low level of spatial invariance. This is comparable to the task of complex cells.

    2. Size reduction of the pooling layer by a factor of n². Fewer parameters should
    be learned in the following layers when the activation size is reduced.


    Different types of pooling including stochastic pooling [19], average pooling,
    and winner-takes-all pooling [20]. However, these types of pooling are not commonly
    utilized as max-pooling. Other pooling types typically cannot extract good features;
    for example, average pooling provides an average value by taking all features
    into account, which is a very generalized computation. Therefore, poor accuracy
    will be obtained with average pooling when the systems do not require features
    from the convolutional layer. Another example, winner-takes-all pooling is similar
    to max-pooling; however, it keeps the feature dimension fixed, and no downsampling
    occurs. However, some classification tasks used different pooling or mixed pooling
    and outperform max-pooling. Thus, the selection of pooling type depends on the
    database type.


    # 9.2.1.3 Nonlinearity and ReLU


    Nonlinearities are necessary between layers to ensure that the network is more
    expressive than a linear one. This makes the network power useful and includes
    the capability to learn complicated and complex features from data. The nonlinearity
    enables the network to generate nonlinear mappings from inputs to output; further,
    cut-off or adjust the output layer is employed to reduce the generated output
    or saturate the output [21]. Thus, the convolutional layers are followed by a
    nonlinear layer. Customary feedforward neural networks utilize the sigmoid or
    tanh nonlinearities, as shown in Equations 9.2 and 9.3, respectively. Therefore,
    the new convolutional systems utilize a nonlinear activation function the.'
