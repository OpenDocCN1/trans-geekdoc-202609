    of the transfer learning methodology is described in the second subsection for
    Alex-net and Resnet50. The last subsection is devoted to describing the process
    of dropping out the last three layers for Alex-net and Resnet50 and how authors
    replaced these layers in order to adapt the process to the required task here.


