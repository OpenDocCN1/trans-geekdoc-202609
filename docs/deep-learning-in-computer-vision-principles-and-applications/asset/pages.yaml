    The FrCN architecture contains 16 convolutional layers, which are inspired by
    the VGG-16 network [67].


    It has multiple stacks of convolutional layers with different sizes of feature,
    where each stack learns distinctive representations and causes an increase over
    the network complexity. The last three FC-NN layers in Block-6 were substituted
    with the convolutional layers to allow the network to process images with arbitrary
    sizes as well as to generate pixel-wise maps of dense prediction with the same
    sizes as the input images. Details of the number of maps and the convolutional
    filter sizes in each layer are given in Table 10.2. The early layers of FrCN learn
    localization information, while the late layers learn subtle and fine representations
    of lesion boundaries.


    A convolutional network is originally translation invariant, which its main role
    is to extract different features from the entropy images and produce feature maps
    using convolution operations [68]. In the deep learning network, the filter kernels
    of the convolutional layers are represented by weights, which are automatically
    updated during the training process. The basic components of this convolutional
    network are the filter kernels $W$, convolution operator $*$, and activation function
    $\phi$. Therefore, the $k$-th feature map of layer $L$ is computed as


    ```

    $F_k^L = \phi(W_k^L * F_{k-1}^L + b_k^L)$,

    ```


    $b_k^L$ is the bias applied to each feature map for each layer.

