    \ accuracy on ImageNet, within 0.7% of full-precision.\n\nIn FPGAs, BNNs benefit\
    \ from a significant acceleration, as the processing of “binary” convolutions\
    \ can be mapped to XNOR gates followed by a pop-count operation, as depicted in\
    \ Figure 1.11b. Furthermore, and as suggested in [7], a pop-count operation can\
    \ be implemented using lookup tables when convolutions are processed with only\
    \ logic. Thus, the DSP blocks can be used to process the batch norm correction\
    \ (Equation 1.7, which can be formulated as a linear transform in order to reduce\
    \ the number of operations). This approach is followed in the implementation of\
    \ [90] to derive an FPGA-based accelerator for BNNs that achieves 207.8 GOPS while\
    \ only consuming 4.7 W and 3 DSP blocks to classify the Cifar10 dataset.\n\nFor\
    \ the same task, binary network implementation of [92] delivers an overall throughput\
    \ of 1.9 TOPS on a Stratix V GSD. In all these works, the first layer is not binarized\
    \ to better classification accuracy. As pointed out in [92], the performance in\
    \ this layer can be improved using a higher number of DSP blocks. Finally, an\
    \ accelerator for TTQ proposed in [93] achieves a peak performance of 8.36 TMACS\
    \ when classifying the Cifar10 dataset with a 2-bit precision.\n\n# 1.6.2 REDUCED\
    \ COMPUTATIONS\n\nIn addition approximate arithmetic, several studies attempt\
    \ to reduce the number of operations involved in CNNs. For FPGA-based implementations,\
    \ two main strategies are investigated: *weight pruning*, which increases the\
    \ *sparsity* of the model, and *low-rank approximation* of filters, which reduces\
    \ the number of multiplications occurring in the inference.\n\n+   * The network\
    \ topology used in this work involves 90% fewer computations and achieves 7% less\
