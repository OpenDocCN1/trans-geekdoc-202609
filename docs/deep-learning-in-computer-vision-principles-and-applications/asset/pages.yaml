  md: '# Deep Convolutional Neural Networks


    requires careful preparation and generally slows training. To overcome this issue,
    the layer output activations are normalized by BN to guarantee that its value
    is inside a small interval. In particular, minibatch normalization is performed
    with BN, which applies the average of the mean-variance statistics. Extra move
    and scale parameters are additionally learned to frustrate the normalization effect
    if necessary. Recently, BN has been observed to be a fundamental part of extra
    deep network training.


    # 9.3.4 Network Depth


    The universal approximation hypothesis [38] states that one hidden layer is adequate
    to display any continuous function. However, it has been reported [6] that such
    systems require an exponentially extensive number of neurons compared to using
    many hidden layers. Although the inspiration for making deep neural networks was
    clear, for quite a while researchers did not have a method that could proficient
    train deep neural networks (greater than 3 layers). Training deeper networks became
    possible for researchers after the introduction of greedywise pretraining [2],
    which made deep neural networks the mainstream in machine learning.


    Recently, many deep networks have appeared; for example, AlexNet [8] has 7 layers.
    Recent models such as VGGNet [19] and GoogleNet [40] have 19 and 22 layers, respectively,
    and appeared to much better than AlexNet. The main disadvantage of the much deeper
    networks is that such networks are very hard to train. Srivastava et al. [41]
    used deep neural networks with 100 layers to present highway systems. He et al.
    [24] utilized an adaptation of this method with 152 layers to obtain cutting-edge
    results from the ILSVRC 2015 database.


    # 9.4 Operational Properties


    # 9.4.1 Using Trained CNNs


    The main advantage of the AlexNet network is that it can be used for different
    tasks for which it was not originally intended. It is very easy to download a
    pretrained model and then adjust the model to suit the current application. We
    explain two approaches to utilize networks in this way [18].


    # 9.4.1.1 Fine-tuning


    This process refers to modifying a pretrained network that is used for image classification
    for an alternate task that is performed by utilizing the trained weights as an
    initial condition and starting SGD for the other task. The learning rate will
    be much lower than for the original network. When the new task is the same as
    the original task, we can make the earlier layers fixed, and only the later semantic
    layers should be relearn. However, if the new task is completely different, we
    should either retrain all or train the network from scratch. The number of layers
    to retrain also depends on the quantity of information available for learning
    the new task. The larger the dataset, the higher is the number of layers that
    can be retrained. The reader is referred to Yosinski et al. [42] for more information.'
