  md: '# 72 Deep Learning in Computer Vision


    # 3.3.3 FLCIE: FIRE LOCALIZATION AND CONTEXTUAL INFORMATION EXTRACTION


    In this section, an energy-friendly and computationally CNN architecture is proposed,
    inspired by the SqueezeNet [44] architecture for fire detection, localization,
    and semantic understanding of the scene of the fire. It uses smaller convolutional
    kernels and contains no fully connected layers, which helps keep the computational
    requirements to a minimum. Despite its low computational needs, the proposed solution
    achieves accuracies that are comparable to other, more complex models, namely
    due to its increased depth. Moreover, this work shows how a trade-off can be reached
    between fire detection accuracy and efficiency, by considering the specific characteristics
    of the fire interest and the variety of fire data.


    # 3.3.3.1 FLCIE Architecture


    Details of the proposed architecture are described in this section. A model with
    an architecture similar to that of SqueezeNet is modified in accordance with our
    target problem of fire detection. The original model was trained on the ImageNet
    dataset and is capable of classifying 1,000 different objects. In the fire detection
    case, however, this architecture is used to detect fire and non-fire images. This
    was achieved by reducing the number of neurons in the final layer from 1,000 to
    2. Keeping the rest of the architecture similar to the original was done in an
    attempt to reuse the parameters to solve the fire detection problem more effectively.
    During the experiments, a transfer learning strategy was also explored in an attempt
    to improve the accuracy. Interestingly, an improvement in classification accuracy
    of approximately 5% for the test data after fine-tuning was achieved. A set of
    sample images with their predicted class labels and probability scores is given
    in Figure 3.8.


    # 3.3.3.2 Feature Map Selection for Localization


    In this section, the process of localizing fire regions in video frames is described.
