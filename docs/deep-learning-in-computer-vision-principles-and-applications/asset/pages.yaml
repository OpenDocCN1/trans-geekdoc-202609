    # 6.2.2 TYPES OF CNN LAYERS


    The term “deep” in CNN refers to the number of hidden layers through which the
    data representation is transformed [30]. The common types of layers used in a
    typical deep CNN can be summarized as follows:


    +   - Input layers: This is where we load the raw input data of the image be processed
    by the network. The input is a 3D volume of image width, height, and depth. Usually
    the depth represents the three RGB layers of an image.


    +   - Convolutional layers: These are the core building blocks of a CNN architecture.
    Convolutional layers transform the input data using a patch of locally connected
    neurons from the previous layer. Generally, convolution is defined as a mathematical
    operation describing how to merge two sets of information. It computes a dot product
    between the region of neurons in the previous layer and the weights to which they
    are locally connected in the output layer. Figure 6.1 shows a visualization for
    neuron activation function, where each neuron holds a set of parameters that form
    a filter to be multiplied with the input volume as a dot product and


