    #  6.6 EXPERIMENTS


    #  6.6.1 EXPERIMENTAL SETTINGS


    This section discusses experimental settings. For all experiments, the Adam optimizer
    is used with a learning rate of value $e^{-5}$. The L2 regularization is used
    in the loss function, with a factor of value $5e^{-4}$ to overcome overfitting
    the data. VGG pre-trained weights are used for initialization. Dropout with probability
    0.5 is used for $1\times1$ convolution layers. Intersection over Union (IoU) is
    used to evaluate class-accuracy, and the mean IoU is computed over all classes.
    In this work, the TensorFlow—an open-source library developed by Google—is used.
    TensorFlow can run on CPUs as well as GPUs, and it is available for Windows, Linux,
    and macOS. In our experiments, we used TensorFlow v1.0.0 on a Python 2.7 platform
    under a Linux Ubuntu v14.04 operating system, and the implemented networks are
    executed on TitanX GPU architecture.


    The datasets used in this work are chosen based on three factors: First, they
    are used for automotive datasets containing road scenes, Second, the datasets
    should consist of video sequences to allow us to use motion information for semantic
    segmentation. Third, there should be a value to calculate depth information from
    the chosen dataset. Two well-known automotive datasets fulfilling the requirements,
    namely, Virtual KITTI [61] and Cityscapes [57], are used in the experiments. For
    Virtual KITTI, we shuffled the dataset and split it with 80% training data, and
    20% for test. In Cityscapes, we used the split provided by the dataset, which
    is 3,474 images for training and 1,525 images for testing. The optical flow annotation
    is not provided with the Cityscapes dataset; however, there are video sequences
    containing temporal information about the scenes. Thus, we exploit these sequences
    to generate different representations of dense optical flow using two methods.
    We train the network to output all of the classes provided in dataset; however,
    evaluation is on 19 classes only, as mentioned by the Cityscapes team where the
    official evaluation script for the dataset is exploited to report results.'
  merge: -1
