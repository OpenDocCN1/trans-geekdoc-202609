    # 1.4 COMPUTATIONAL TRANSFORMS


    In order to accelerate the execution of *conv* and FC layers, numerous implementations
    rely on computational transforms. These transforms, which operate on the FM and
    weight arrays, aim at vectorizing the implementations and reducing the number
    of operations occurring during inference.


    Three main transforms can be distinguished. The *im2col* method reshapes the feature
    and weight arrays in a way to transform convolutions into matrix multiplications.
