    Recently, convolutional neural network (CNN) outperformed state-of-the-art techniques
    in various domains such as image classification, object detection, and localization.
    However, an activity is recorded in sequences of images, processing a single image
    rarely gives good results to capture the whole idea of the activity. Furthermore,
    the whole activity can be recognized by analyzing the motions and other visual
    changes of body body like hands and legs in a sequence of frames. For instance,
    jumping for a headshot in football and skipping rope have the same action pose
    in the initial frame. The difference between these actions can also be recognized
    in a sequence of frames. Another challenge for analyzing long-term activities
    in video data is that each activity has parts that overlap with other activities;
    for example, swimming is one activity, but whenever the swimmer dives into the
    pool he also jumps in the air, which is another activity. So, when two activities
    like jumping and appear in the same sequence, it can lead to false predictions
    because the sequence is interrupted. To address these issues, many researchers
    [6, 7] have introduced different kinds of techniques to represent sequences and
    learn those sequences for activity recognition. For instance, the current literature
    on human activity recognition highlights some popular methods


