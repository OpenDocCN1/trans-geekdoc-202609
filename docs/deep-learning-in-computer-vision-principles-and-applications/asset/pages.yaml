    # 9.7.3 DEEP LEARNING FOR TUMOR SEGMENTATION


    Automatic segmentation is used for quantitative assessment of the brain at all
    ages. Removing non-brain regions such as the skull is the main preprocessing step.
    Kiesiek et al. [75] used 3D convolutional neural networks for skull extraction
    in T1-weighted MRI images. Moeks et al. [76] presented an accurate segmentation
    method. They used a multiscale CNN with convolution sizes and patch sizes, which
    provided very good segmentation results with an Average ratio from 0.2 to 0.9.
    The brain MRI segmentation of infants is more difficult than that of adults due
    to partial volume effects, reduced contrast, ongoing white matter (WM) myelination,
    and increased noise in the infant''s brain [77].


    Zhang et al. demonstrated multimod MR segmentation using four CNN architectures
    for infant brain tissues. Three convolutional layers were applied, followed by
    a fully connected layer and a softmax layer for tissue classification [78]. More
    recently, in [79], the isointense-phase brain image was segmented by multiple
    fully convolutional networks (MFCFNs); the Average Dice ratios were 0.873 for
    brain matter (GM), 0.852 for cerebrospinal fluid (CSF), and 0.887 for WM. Moreover,
    several methods for brain tumor segmentation can be found in the literature [73,
    80, 81, 82, 83, 84, 85].


    # 9.8 BRAIN TUMOR DETECTION USING DEEP CONVOLUTIONAL NEURAL NETWORK


    The combination of machine learning approaches and brain magnetic resonance imaging
    (MRI) is crucial for the tumor diagnosis process by clinicians and radiologists.
    Although most diagnosis studies have focused on segmentation and localization
    operations, few studies have focused on tumor detection as a time- effort-saving
    operation in which normal images can be discarded early. This study introduces
    a new structure for accurate brain tumor detection using a deep convolutional
    neural network (DCNN). The proposed structure is designed to identify the presence
    or absence of a brain tumor in MRI images.'
