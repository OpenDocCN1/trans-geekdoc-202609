    # 3.4.3.3 Experiments for Contextual Information Extraction


    Along with fire detection, the proposed approach is able to determine the intensity
    of the fire detected in an input image accurately. To achieve this, the zone of
    interest (ZOI) inside the input image along the segmented fire regions is extended.
