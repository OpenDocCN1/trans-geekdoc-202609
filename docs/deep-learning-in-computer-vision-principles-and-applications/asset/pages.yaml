    # 4.4.1.1 Fractal Dimension Transformation


    Using the proposed FDT approach, the face image of size $I(M \times N)$ is transformed
    into its fractal dimension using the density boxing-counting (DBC) algorithm where
    a kernel function $f(p, q)$ of size $(nx \ ny)$ is applied on the entire face
    image to produce a 3D matrix that represents the number of boxes necessary to
    cover the whole face image at each pixel as follows:


    ```

    $N_d(x

    ```


    Here, $d = (1, 2, 3, \dots, r_{max})$ is the dimension of $N_d(x, y, d)$, which
    represents the number of the produced feature maps obtained from applying the
    kernel function $f(p, q)$ with different values of the scaling factor $(r)$. Here,
    the values of the scaling factor $(r)$ are empirically chosen to be in the range
    between 2 and 9. The kernel function $f(p, q)$ operates by block processing on
    $(7 \times 7)$ neighboring pixels of the face image, calculating the fractal dimension
    value of each pixel from its surrounding neighbors, as follows:


    ```

    $f(p, q) = \sum_{p=a}^b \sum_{q=a}^b \text{floor} \left[ \frac{P_{max} - P_{min}}{r}
    \right] + 1 \quad (4.12)$

    ```


    Here, $a$ and $b$ are non-negative integer variables, which are used to center
    the kernel function on each pixel in the face image, and are defined as $a$ and
    $b = \text{ceil}((n - 1)/2)$. $P_{max}$ and $P_{min}$ are the highest and lowest-intensity
    values of neighboring pixels in the processing block. The size of the kernel function
    was determined empirically, noting that increasing its size can affect the accuracy
    of the calculated fractal dimension, causing the obtained image to become less
    distinct, while decreasing its size can result in an insufficient number of surrounding
    pixels to calculate the fractal dimension value accurately. Once the $N_d(x, y,
    d)$ matrix is obtained, each element'
