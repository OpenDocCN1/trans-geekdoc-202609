    # 4.4.2 The Proposed FaceDeepNet System


    An efficient deep learning system is employed. This system, whose architecture
    is based on a combination of a CNN and a DBN to extract discriminative features
    from the image of the same person, will be referred to FaceDeepNet. To the best
    of our knowledge, this is the first work that investigates the potential of the
    CNN and DBN together in a unified multi-biometric face recognition system operating
    in both the identification and verification modes. Here, we argue that using the
    local feature representations obtained from a powerful-descriptor instead of the
    pixel intensity representations as the proposed deep learning approaches can significantly
    improve the ability of the proposed FaceDeepNet system to learn more discriminative
    features, with a shorter time required to obtain the final trained model. As depicted
    in Figure 4.4, the local facial features are firstly extracted using the proposed
    FDT approach. Then, the extracted local features are assigned to the feature extraction
    units of the proposed deep learning approaches (e.g., CNN and DBN) to learn additional
    and complementary feature representations.'
