  md: '# A Multi-biometric Face Recognition System


    # 4.2.1 HANDCRAFTED-DESCRIPTOR APPROACHES


    The majority of previous face recognition systems depend on feature representations
    produced by local/global handcrafted-descriptor approaches, such as scale-invariant
    feature transform (SIFT), local binary patterns (LBP), 2D Gabor Wavelet, etc.
    Handcrafted-descriptor approaches can be further divided into three groups: feature-based,
    holistic-based, and hybrid-based approaches. In the first category, a vector of
    geometric facial features is extracted by measuring and calculating the geometric
    relationships among the facial features (e.g., the mouth, eyes, and nose). For
    instance, Biswas al. [18] developed a face recognition system based on feature
    representations using SIFT-based descriptors [19] at fiducial locations on the
    image, and then the SIFT features of all landmarks were formed into a single vector
    representing the face. A well Rank-1 identification rate of 91% was achieved on
    the CMU Multi-PIE face database containing a total of 337 subjects. Unlike the
    feature-based approaches, the holistic-based approaches (e.g., Eigenface methods)
    operate on the whole face image. The major limitation of these approaches is caused
    by the need to perform the matching in high dimensionality space. Thus, a number
    of face recognition algorithms have been developed that employ dimensionality
    reduction methods to handle the issue of high dimensionality The first well-known
    face recognition system based on the Eigenface methods was proposed by Sirovich
    and Kirby [20].


    The hybrid-based approaches use a combination of both feature and holistic approaches
    to address the face recognition problems. For example, one can argue that hybrid
    approaches use both local and global features (e.g., obtained from both feature
    and holistic approaches, respectively) can be an efficient way to make use of
    their generalization ability. However, the main challenges that can increase the
    complexity of influence the performance of such approaches lie in the identification
    of the features to be fused, and the fusion method [21]. For example, local features
    are very sensitive to the illumination changes, which changes have more influence
    on global features. Some of the recent examples belonging to this category were
    proposed by Fischer et al. [22], Berg and Belhumeur [23], Annu et al. [24], Zhu
    et al. [25], and Al-Waisy [26, 27], and other examples can be found in Meethongjan
    and Mohamad. Although previous research has demonstrated the efficiency of handcrafted-descriptor
    approaches used to solve the face recognition problem, their performance declines
    dramatically in unconstrained environments. The decline in performance is caused
    by the fact that constructed facial feature representations are very sensitive
    to highly nonlinear intrapersonal variations such as illumination, expression,
    pose, and occlusion [28]. In addition, this approach requires significantly more
    effort and domain knowledge from the researcher to find the most compact and discriminative
    feature set for a given problem. Therefore, they are considered to be challenging
    and time demanding.'
