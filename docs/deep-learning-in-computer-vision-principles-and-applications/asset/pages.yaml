  md: '# INTRODUCTION


    # 4.1


    A reliable and efficient identity administration system is a vital component in
    many governmental and civilian high-security applications that provide services
    to legitimately registered users [1]. Many pattern recognition systems have been
    used for establishing the identity of an individual based on different biometric
    traits (e.g., physiological, behavioral, and/or soft biometric traits) [2–3].
    In a biometric system, these traits establish a substantial and strong connection
    between the users and their identities [4]. Face recognition has received considerably
    more attention in the research community than other biometric traits, due to its
    wide range of commercial and governmental applications, its low cost, and the
    ease of capturing the face image in a non-invasive manner. This is unlike other
    biometric systems (e.g., fingerprint recognition), which can cause some health
    risks by transferring viruses and/or infectious diseases from one user to the
    other by the same sensor device to capture the biometric trait from multiple users
    [5]. Despite these advantages, designing and implementing a face recognition system
    is considered a challenging task in the image processing, computer vision, and
    pattern recognition fields. Therefore, different factors and problems need to
    be addressed when developing any biometric system based on the face image, especially
    when faces are in unconstrained environments. Such environments are challenging
    due to the large interpersonal variations, as changes in facial expression, multiple
    views, aging from wearing glasses and hats, and the small interpersonal differences
    [6]. Basically, the performance of the face recognition system depends on two
    features: feature extraction and classification. The correct identification of
    a person''s identity in the latter stage is dependent on the discriminative power
    of the extracted features in the former stage. Thus, extracting and learning powerfully
    and highly discriminating features to minimize intrapersonal variations and interpersonal
    similarities remains a challenging task [7].


    Recently, considerable attention has been paid to employing multi-biometric systems
    in many governmental and private sectors due to their ability to significantly
    improve the recognition performance of biometric systems. Moreover, multimodal
    systems have the following advantages [8–11]: (i) improving population coverage;
    (ii) improving the biometric system''s throughput; (iii) deterring spoof attacks;
    (iv) maximizing the similarities and minimizing the intrapersonal variations;
    and (v) providing a high degree of flexibility allowing people to choose either
    a subset or all of their traits depending on the nature of the implemented application
    and the user''s convenience. As illustrated in Figure 4.1, to satisfy the multi-biometric
    system concept, the face trait can be engaged in four out of five different types
    of multi-biometric systems.


    In this chapter, a novel multi-biometric system for identifying a person''s identity
    using two deep learning approaches is proposed based on the combination of a convolutional
    neural network (CNN) and deep belief network (DBN) to address the problem of unconstrained
    face recognition. CNN is one of the most powerful supervised neural networks (DNNs),
    which is widely used to resolve many tasks in image processing, computer vision,
    and pattern recognition with high ability to automatically extract discriminative
    features from input images.'
