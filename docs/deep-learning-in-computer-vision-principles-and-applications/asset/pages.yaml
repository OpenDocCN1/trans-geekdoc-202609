    applications. The main goal is to construct simple architectures to demonstrate
    the benefit of flow and depth augmentation to standard CNN-based semantic segmentation
    networks. The impact of both motion and depth information on semantic segmentation
    was experimentally studied based on a simple network architecture. Results of
    experiments on public datasets demonstrate reasonable improvement in overall accuracy.
    From the conducted experiments, it is shown that CNN can generalize well even
    using noisy maps such as SGM and Farneback; however, the quality of the input
    map in terms of object structure largely affects the output. Furthermore, the
    obtained experimental results show that there is still a lot of'
