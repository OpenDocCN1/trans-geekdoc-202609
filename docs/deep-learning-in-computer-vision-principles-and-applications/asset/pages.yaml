    # 4.3 THE PROPOSED APPROACHES


    This section provides a brief description of the proposed approaches, including
    the FDT and DRBM approaches, which are used in the proposed local feature-based
    extraction approach. In addition, a brief description of the proposed deep learning
    approaches is given, including the CNN and DBN. The main goal here is to review
    and identify their strengths and shortcomings to empower the proposal of a novel
    multi-biometric face recognition system that consolidates the strengths of these
    approaches.


    # 4.3.1 FRACTAL DIMENSION


    The term “fractal dimension” was first introduced by the mathematician Benoit
    Mandelbrot as a geometrical quantity to describe the complexity of objects that
    show self-similarity at different scales [44]. The most important characteristic
    of the fractal dimension is self-similarity, which means an object has a similar
    representation to the original under different magnifications. This property has
    been efficiently used in reflecting the roughness and fluctuation of the surface
    of an image, where increasing the scale of magnification provides more and details
    of the imaged surface. Moreover, the non-integer value of the fractal dimension
    provides a quantitative measure of objects that have complex geometry, and cannot
    be described by an integral dimension (e.g., the length of a coastline) [45–46].
    The fractal dimension has widely employed to resolve many problems in image processing
    and computer vision (e.g., texture segmentation, texture classification, medical
    imaging, etc.), due to its stability and robustness in reflecting the roughness
    and fluctuations of the imaged surface. However, not much has been done to explore
    and address the potential of using the fractal dimension to resolve recognition
    problems. Lin et al. [47] developed an algorithm for human eye detection by exploiting
    the fractal dimension as an efficient approach for representing the texture of
    features. Farhan et al. [48] developed a personal identification system based
    on fingerprint images using the fractal dimension as a feature extraction method.
    Therefore, it appears that the texture of the facial image can be efficiently
    described using the fractal dimension. Various methods have been proposed in the
    literature to estimate fractal dimension [44], e.g., box counting (BC), differential
    box counting (FBM), and others. In this work, the fractal dimension for each pixel
    over the whole face image is calculated using an improved differential box counting
    (IDBC) algorithm, which could be used as a powerful edge enhancement technique
    to enhance the edge representations for the face image without increasing the
    noise level.'
