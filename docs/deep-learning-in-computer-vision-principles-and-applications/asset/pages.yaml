    Habublu et al. [16] performs best and dominates the other methods. However, its
    false-negative rate is 14.29%, the accuracy of the other four methods is also
    better than this, with the most recent method [10] being the best. However, the
    false positive score of 11.67% is still high, and the accuracy could be further
    improved. To achieve a high accuracy and a low positive rate, the use of deep
    features for fire detection is explored. For this reason, three methods, i.e.,
    EFD, BEA, and FLCIE, are proposed. In EFD, we used the AlexNet architecture without
    fine-tuning, which resulted in an accuracy of 90.06% and reduced false positives
    from 11.67% to 9.22%. In the baseline AlexNet architecture, the weights of kernels
    are initialized randomly and modified during the training process considering
    the error rate and accuracy. The strategy of transfer learning [52] is also applied,
    whereby the weights from a pre-trained AlexNet model are initialized with a low
    rate of 0.001 and modified the last fully connected layer according to the problem
    of fire detection. Interestingly, an improvement in accuracy of 4.33% and reductions
    in false negatives and false positives up to 8.52% and 0.15%, respectively, are
    obtained.


    The false alarm score is still high and needs improvement. Therefore, for this
    purpose in BEA, a GoogleNet model is trained with its default kernel weights,
    which resulted in an accuracy of 88.41% and a false positive score of 0.11%. The
    baseline GoogleNet architecture randomly initializes the kernel weights, which
    are tuned according to the accuracy and error rate during the training process.
    In an attempt to improve the accuracy, transfer learning [52] by initializing
    the weights from pre-trained GoogleNet model and keeping the learning rate threshold
    to 0.001 is explored. Further, the last fully connected layer as per the nature
    of the intended problem is changed. With this fine-tuning process, the false alarm
    rate is reduced from 0.11% and the false-negative score from 5.5% to 1.5%.'
