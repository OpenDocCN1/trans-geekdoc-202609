    increased by preprocessing to correlate the illumination and the segmentation
    of the region of interest (ROI). The proposed system sends the image to the CNN
    after segmentation for feature extraction. The system achieved a classification
    rate of 81%. Premaladh and Ravichandran [20] proposed a CAD system that combines
