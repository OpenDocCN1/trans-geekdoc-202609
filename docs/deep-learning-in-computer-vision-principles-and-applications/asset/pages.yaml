- pgno: 267
  md: '# Deep Convolutional Neural Networks


    The accuracy (ACC) is a widely used metric for the classification performance,
    which is the ratio between the correctly classified samples to the total number
    of samples, as shown in Equation 9.6.


    ```

    ACC = \frac{TP + TN}{TP + TN + FP + FN} \quad (9.6)

    ```


    TP, TN, FP, and FN indicate the true positive, true negative, false positive,
    and false negative, respectively referred [66]

    Sensitivity (SV), recall, hit, and true positive rate (TPR) represent the true
    positive samples to the total number of positive samples, as shown in Equation
    9.7.

    Specificity (SP), inverse recall, and true negative rate (TNR) express the correctly
    classified negative samples to the total number of negative samples, as shown
    in Equation 9.8 [67].


    ```

    SV = \frac{TP}{TP + FN} \quad (9.7)

    ```


    ```

    SP = \frac{TN}{TN + FP} \quad (9.8)

    ```


    The precision or predictive value (PPV) reflects the ratio of correctly classified
    samples to all positive samples, as shown in Equation 9.9.

    Negative predictive value (NPV) or inverse precision represents the ratio of correctly
    classified negative samples to the entire negative samples, as shown in Equation
    9.10. Equation 9.11 refers to the balanced classification rate (BCR) or balanced
    accuracy (BA), which combines the sensitivity and specificity metrics [17].


    ```

    Precision = \frac{TP}{TP + FP} \quad (9.9)

    ```


    ```

    NPV = \frac{TN}{TN + FN} \quad (9.10)

    ```


    ```

    BCR = BA = \frac{1}{2} \left( \frac{TP}{TP + FN} + \frac{TN}{TN + FP} \right)
    \quad (9.11)

    ```


    The false positive rate (FPR) represents the ratio between the false positive
    classified samples to all negative samples, as shown in Equation 9.12. However,
    the false negative rate (FNR) expresses the false negative classified samples
    to all positive samples, as shown in Equation 9.13.


    ```

    FPR = \frac{FP}{TN + FP} \quad (9.12)

    ```'
  merge: -1
  img_proc: true
