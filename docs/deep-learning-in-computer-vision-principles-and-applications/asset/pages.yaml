  md: '# INTRODUCTION


    # 10.1


    Skin cancer is one of the most dangerous cancers in the world. Indeed, melanoma
    (i.e., malignant skin tumor) usually starts when melanocyte cells begin to grow
    out of control [1]. Among different types of skin cancer, melanoma is the most
    aggressive type due to its greater capability of spreading into other organs and
    its higher death rate [2]. According to the annual report of the American Cancer
    Society (ACS), in the United States in 2018, it is estimated that about 99,550
    cases were diagnosed as new cases of skin cancer (excluding basal and squamous
    cells skin cancers), and the estimated deaths from this disease reached up to
    13,460 [3]. Melanoma makes up the majority among skin cancer types, with estimated
    new cases and expected deaths of 91.7% and 62.2%, respectively. Moreover, it is
    reported that melanoma is the most fatal skin cancer, with deaths making 1.53%
    of total cancer deaths, and it represents 5.3% of all new cases [3, 4]. Regarding
    the survival statistics from the Surveillance, Epidemiology, and End Results (SEER)
    Cancer Statistics Review (CSR) report [5], the survival rate of patients diagnosed
    early with melanoma over five years is about 91.8%. However, this rate decreases
    to 63% when the disease spreads into lymph nodes. Therefore, a skin lesion detected
    and correctly diagnosed in its earliest stage is highly curable, and such detection
    reduces the mortality rate. This


    Visual inspection via the naked eye during the medical examination of skin cancer
    is hindered by the similarity among normal tissues and skin lesions, which may
    produce an incorrect diagnosis [6, 7]. In order to allow better visualization
    of skin lesions non-invasive modalities have been developed. Dermoscopy (also
    known as dermoscopy or epuminescence microscopy) has become a gold standard imaging
    technology that allows dermatologists to perform the screening of skin lesions
    through visualizing prominent features present under the skin surface. The key
    idea of dermoscopy is that it acquires a magnified high-resolution image while
    reducing or filtering out surface reflections, utilizing polarized light. In clinical
    practice, skin lesion diagnosis is based on visual assessment of dermoscopy images.
    Although dermoscopy images provide diagnostic precision, examination of dermoscopy
    by dermatologists via visual inspection is still tedious, time consuming, complex,
    subjective, and fault prone [6, 7]. Hence, automated computerized diagnostic systems
    for skin lesions are highly demanded to support and assist dermatologists in clinical
    decision-making.


    Indeed, automated segmentation of skin lesion boundaries from surrounding tissue
    is a key prerequisite in any computerized diagnostic system of skin cancer. Accurate
    segmentation of the lesion boundaries plays a critical role in obtaining more
    prominent, specific, and representative features, which are utilized to distinguish
    between different skin lesion diseases [8–11]. However, automatic segmentation
    of skin lesions is still a challenging task due to their large variations in size,
    shape, texture, color, and location in the dermoscopy images. Some challenging
    examples of skin lesion dermoscopy images are shown in Figure 10.1. These examples
    show the presence of artifacts for screening: artificial segmentation such as'
