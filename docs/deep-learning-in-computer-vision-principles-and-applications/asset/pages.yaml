    \ units of the same layer. The first layer consists of $m$ visible units $v =\
    \ (v_1, v_2, \\dots, v_m)$, representing observed data, while the second layer\
    \ consists of $n$ hidden units $h = (h_1, h_2, \\dots, h_n)$, which can be nonlinear\
    \ feature detectors to capture higher-order correlations in the observed data.\
    \ In addition, $W = \\{w_{ij}, w_{i2}, \\dots, w_{mn}\\}$ is the connecting weights\
    \ matrix between the visible and hidden units. A typical RBM structure is shown\
    \ in Figure 4-2 (a). The standard RBM was designed to be used only with binary\
    \ stochastic units (BRBM). However, using binary units is not suitable for real-valued\
    \ data (e.g., pixel intensity values in images). Therefore, a new model has been\
    \ developed called the Gaussian RBM (GRBM) to address this limitation of the standard\
    \ RBM [49]. The energy function of the GRBM is defined as\n\n```\n$E(v,h) = -\\\
