- pgno: 192
  md: '# Deep Learning in Computer Vision


    ![](img/be8864cedd9a2fb32f3521f7cd37aa21_192_0.png)


    FIGURE 6.12 Depth augmentation: qualitative comparison of semantic segmentation
    outputs using the monoDepth estimator on the Cityscapes dataset.


    scope for improvement, as depth, flow, and color are different modalities, so
    more research should be conducted to construct better fusion networks. Future
    research aims to


    +   * Conduct deeper investigation to implement more robust multimodal networks
    to combine valuable pieces of information.

    * Understand the effect of different network architectures with varying complexities
    in the multimodal fusion task.

    * Incorporate sparsity invariant metrics to handle missing flow and depth estimates.

    * Migrate from pixel-level to object-level classification and make use of depth
    per object, as is more practical than pixel-wise depth, especially in an AD application
    where the objective is to avoid collision with full objects.

    * Investigate multimodal fusion for different tasks such as moving and static
    object detection, especially those employing structural constraints [85] and compressive
    sensing techniques [86], which will be very helpful in the driving scenarios.

    * Train the network with fewer classes than the total number provided by the dataset.
    In a normal driving scenario, information about all classes is not critical for
    a vehicle to move. Dataset classes can be minimized to the ones that are needed
    only by an AC.

    * Train on multiple real and synthetic datasets with fine-tuning to solve the
    problem of limited numbers of annotated images.'
