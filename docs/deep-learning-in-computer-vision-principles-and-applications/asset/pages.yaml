- pgno: 11
  md: '# Preface


    xi


    Chapter 8 is intended to be a guide for the developers of robot vision systems,
    focusing on the practical aspects of the use of deep neural networks rather than
    on theoretical issues.


    The last three chapters are devoted to deep learning in medical applications.
    Chapter 9 covers basic information about CNNs in medical applications. CNN developments
    are discussed from different perspectives, specifically CNN design, activation
    function, loss, regularization, optimization, normalization, and network depth.
    Also a deep convolutional neural network (DCNN) is designed for brain tumor detection
    using MRI images. The proposed DCNN architecture is evaluated on the RIDER dataset,
    achieving accurate detection within a time of 0.24 seconds per MRI.


    Chapter 10 discusses automatic segmentation of skin lesion boundaries from surrounding
    tissue and presents a novel deep learning methodology via full-resolution convolutional
    network (FrCN). Experimental results show the great promise of the FrCN method
    compared to state-of-the-art deep learning approaches such as fully convolutional
    networks (FCN), U-Net, and SegNet with overall segmentation.


    Chapter 11 is about the automatic classification of color skin images, where a
    highly accurate method is proposed for skin melanoma classification utilizing
    two modified convolutional neural networks and consisting of three main steps.
    The proposed method is tested using the well-known MED-NOTE and Dermis & DermQuery
    datasets.


    It is very necessary to mention here that the book is a small piece in the puzzle
    of computer vision and its applications. We hope that our readers find the presented
    chapters in the book interesting and that the chapters inspire future research
    both from theoretical and practical viewpoints to spur further advances in the
    computer vision field.


    The editors would like to take this opportunity to express their sincere gratitude
    to the contributors for extending their wholehearted support in sharing some of
    their latest results and findings. Without their significant contribution, this
    book could not have fulfilled its mission. The reviewers deserve our thanks for
    their constructive and timely input. Special profound thanks go to Prof Aly Farag,
    Professor of Electrical and Computer Engineering, University of Louisville, Kentucky
    for writing the Foreword for this book. Finally, the editors acknowledge the efforts
    of the CRC Press Taylor & Francis for giving us the opportunity to edit a book
    on deep learning for computer vision. In particular, we would like thank Dr Rastislav
    Lukac, the editor of the Digital Imaging and Computer Vision book series, and
