    # 10.2.3 DEEP LEARNING SEGMENTATION METHODS


    Lately, novel approaches utilizing CNN methods to improve the performance of challenging
    segmentation tasks have been under development. The first end-to-end pixel-wise
    semantic segmentation approach was developed by Long et al. [44, 45]. Their segmentation
    method was inspired from the convolutional neural recognizer, in which the authors
    adapted well-known classification models such as GoogNet, AlexNet, and Visual
    Geometry Group (VGG)Net into CNN by replacing the fully connected neural network
    (FC-NN) with convolutional layers to produce spatial maps instead of prediction
    scores. Their model was named fully convolutional networks (FCN). FCN is robust
    and has the capability of yielding hierarchies of attributes. However, the subsampling
    operations after each convolutional layer cause the loss of the spatial resolution
    of the input pixels. Due to this, upsampling deconvolution and bilinear interpolation
    process was applied in the last convolutional layer in order to produce a map
    that contains dense prediction with the same size as the original image. FCN produces
    a significant enhancement of the pattern analysis, statistical modeling, and computational
    learning in the visual object classes from the PASCAL VOC dataset as compared
    to traditional techniques [46].


    Another architecture, called U-Net, was developed to convert the CNN classification
    models to a suitable segmentation network [47]. U-Net was an extension and amendment
    of the FCN architecture [45], in which it performed well with fewer training images
    and produced more accurate segmentations on the stacks of electron microscopy
    images. In, U-Net consisted of consecutive and symmetric paths generating a U-shaped
    model. The contracting path, which is typical in the FCN architecture, is responsible
    for extracting the relevant representations and patterns using the convolution
    and upsampling operations. In the expansive path, the upsampling process followed
    by a convolution operator was applied opposite the contracting path to produce
    large number of feature channels. In each convolutional layer, the feature map
    in the contracting path was concatenated with the corresponding features in the
    expansive path in order to provide high-resolution features. Similar to the FCN
    architecture, U-Net did not utilize fully connected layers to segment the pixels
    of the image. Apart from the FCN technique, a deep convolutional encoder-decoder
    architecture for image segmentation was proposed by Badrinararayanan et al. in
    2015 and was named SegNet. The SegNet architecture consisted of an encoder network
    that produces low-resolution feature maps, a corresponding decoder network that
    transforms the features into a full resolution of the input using a combination
    of convolution and upsampling layers. The encoder network used the VGG16 classification
    model, which involves 13 convolutional layers. However, the same layers were mirrored
    in the decoder network. The novelty of this segmentation method lies in the way
    that the decoder upsamples the lower-resolution feature maps. Each upsampling
    layer in the'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# Deep Learning in Computer Vision


    decoder network matched to the corresponding subsampling layer in the encoder
    network, preserving the locations of the feature maps in an input image during
    the upsampling process. The softmax classifier was utilized to generate predictions
    for the input pixels, which represented the segmentation map.


    Noh et al evolved a deep learning segmentation technique called Deconvolution
    Network (DeConvNet) as an extension of FCN [50]. Analogous to the SegNet architecture,
    DeConvNet contained convolution networks that retrieved representations from the
    input image with higher resolution as the dimension of the input image. DeConvNet
    was also a shape generator that produced a probability map of all input pixels
    and thus, the final output of DeConvNet is the segmentation masks of the objects
    in the input images. Furthermore, an image segmentation technique via deep convolutional
    nets called DeepLab was introduced by Chen et al. [51, 52]. This method was proposed
    to provide a solution to some of the challenges faced in the semantic segmentation
    models. First, the authors replaced the last few subsampling layers in the network
    by Atrous convolution, which is a dilated convolution that extends the filter
    size and fills the hole locations with zeros to maintain the feature resolution.
    Second, they used the Atrous spatial pyramid pooling for multi-scale image representations.
    Then, they appended the DeepLab network with the fully connected random field
    (CRF) to recover more precise boundaries of the segmented objects. Arguably, all
    the aforementioned segmentation methods take the well-known classification networks
    and eliminate their FC-NN layers. Along with the encoder network, which extracts
    low-resolution feature maps, these methods build a corresponding decoder network
    to compensate for the loss of features and generate dense pixel-wise predictions.
    More details of these segmentation architectures are explained in a review paper
    [46].


