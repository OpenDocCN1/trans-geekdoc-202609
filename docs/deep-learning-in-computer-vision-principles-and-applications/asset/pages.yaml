  md: '# Deep LSTM-Based Sequence Learning Approaches


    including volume motion templates [6], spatio-temporal features [7], motion history
    volume [8], interest point descriptors [9], bag-of-words [10], optical flow trajectories
    [11], and CNN-based learned features [12, 13] for sequence representation followed
    by some machine learning algorithms as support vector machine (SVM), decision
    tree, recurrent neural network (RNN), and LSTM. However, these methods are not
    enough for sequence representation and learning. Recent studies prove that the
    LSTM is one of the most effective sources of sequence learning. Therefore in this
    chapter, we explore sequence learning concepts integrated with LSTM for action
    and activity recognition.


    # 5.1.1 Recurrent Neural Network (RNN)


    RNNs are a type of artificial neural network that has turned out to be popular
    in recent years because of its power to learn time series data. The RNN is a special
    network that consists of recurrent connections, unlike feedforward neural networks.
    The major benefit is that its network of recurrent connections, it is able to
    process arbitrary time sequences of input data. RNNs are presented for investigating
    hidden patterns in both temporal sequential and spatial data. A standard RNN is
    shown in Figure 5.2 (a). It processes data by taking input at different times
    over time. At each time step, it has two inputs: the first comes from the hidden
    state of the previous RNN, and the second is from the time series data.


    From Figure 5.2 (a) it can be seen that RNN is taking input at each time step
    and giving as output. The process of taking input at each recurrent step disturbs
    the patterns for sequences in time series data, because the neural network performs
    multiplication of weights with data and addition with bias terms. Therefore, multiplication
    of data many times with several hidden states causes the early effect of sequential
    data in the series to be forgotten. This issue, known as the vanishing gradient
    problem, is shown in Figure 5.2 (b), where the effect of data is shown as gray
    shading, which decreases when the sequence is longer. In practice, the range of
    sequential information that standard RNNs access is limited to approximately ten
    time steps between the relevant input and target output.


    ![](img/be8864cedd9a2fb32f3521f7cd37aa21_145_0.png)


    FIGURE 5.2 (a) A standard unrolled RNN; (b) vanishing gradient problem in RNN.'
