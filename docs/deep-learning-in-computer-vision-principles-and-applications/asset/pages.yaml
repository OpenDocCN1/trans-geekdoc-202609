    # ## 8.1 INTRODUCTION


    Deep learning is a hot topic in the pattern recognition, machine learning, and
    computer vision research communities. This fact can be seen clearly in the large
    number of reviews, surveys, special issues, and workshops that are being organized,
    and the special sessions in conferences that address this topic (e.g., [1–9]).
    Indeed, the explosive growth of computational power and training datasets, as
    well as technical improvements in the training of neural networks, has allowed
    a paradigm shift in pattern recognition, from using hand-crafted features (e.g.,
    Histograms of Oriented Gradients, Scale Invariant Transform, and Local Binary
    Patterns) [10] together with statistical classifiers to the use of data-driven
    representations, in which features and classifiers are learned together. Thus,
    the success of this new paradigm is that "it requires little engineering by hand"
    [4], because most of the parameters are learned from data, using general-purpose
    learning procedures. Moreover, the existence of public repositories with source
    code and parameters of trained deep neural networks (DNNs), as well as that of
    specific deep learning frameworks/tools such as Tensorflow [11], has promoted
    the use of deep learning methods.


    The use of the deep learning paradigm has facilitated addressing some vision problems
    in a more successful way than with traditional approaches. In fact, in several
    computer vision benchmarks, as the ones addressing image classification, object
    detection and recognition, semantic segmentation, and action'
