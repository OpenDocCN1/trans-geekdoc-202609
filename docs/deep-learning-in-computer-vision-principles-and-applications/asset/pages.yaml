    # 3.2.1 TRADITIONAL SENSOR-BASED FIRE DETECTION


    The recent advancements in technology have resulted in a variety of sensors for
    different applications such as wireless sensors for visualization of the interior
    of a human body [3], vehicle sensors for obstacle detection [18], and fire alarm
    sensors [1]. The current fire alarm sensors such as infrared, ion, and optical
    sensors need close proximity of the heat, fire, radiation, or smoke for activation;
    hence, such sensors are not considered as good candidates for environments of
    a critical nature. Among fire deaths, 78% occurred only due to home fires [19].
    One of the main reasons is the delayed escape for disabled people, as traditional
    fire alarm systems need strong fires or close proximity, failing to generate an
    alarm on time for such people.


