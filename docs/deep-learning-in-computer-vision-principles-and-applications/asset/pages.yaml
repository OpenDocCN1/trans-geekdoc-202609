    . . . . . 33


    # 1.1 INTRODUCTION


    The exponential growth of big data since the last decade motivates innovative
    methods to extract high semantic information from raw data such as videos, images,
    and speech sequences. Among the proposed methods, convolutional neural networks
    (CNNs) [1] have become de facto standard by delivering near-human accuracy in
    many applications related to machine vision (e.g., classification [2], detection
    [3], segmentation [4] and speech recognition [5]).


    This performance comes at the price of a large computational cost as CNNs require
    up to 38 GOPs to classify a single frame [6]. As a result, dedicated hardware
    is required to accelerate their execution. Graphics processing units are the most
    widely used platform to implement CNNs as they offer the best performance in terms
    of throughput, reaching up to 11 TFLOPS [7]. Nevertheless, in terms of power consumption,
    field-programmable gate array (FPGA) are known to be more efficient (vs. GPU).
    While GPU implementations have demonstrated state-of-the-art computational performance,
    CNN acceleration will soon be moving towards FPGAs for two reasons. First, recent
    improvements in FPGA technology with a reported performance of 9.2 TFLOPS for
    the latter [8]. Second, recent trends in CNN increase the sparsity of CNNs and
    use extremely custom data types. These trends favor FPGA devices, which are designed
    to handle irregular parallelism and custom data. As a result, nextgeneration CNN
    accelerators are expected to deliver up to 5.4x computational throughput than
    GPUs [7].


    As an inflection point in the development of CNN accelerators might be near, we
    conduct a survey on what is found in [9], we focus in this chapter on the recent
    techniques that were not covered in the previous works. In addition to this chapter,
    we refer the reader to the works of Venieris et al. [10], and to the works of
    Sze et al., which focus on ASICs for deep learning acceleration.


    The amount and diversity of research on the subject of CNN FPGA acceleration within
    the last 3 years demonstrates the tremendous and academic interest. This chapter
    presents a state-of-the-art review of CNN inference accelerators over FPGAs. The
    computational workloads, their parallelism, and the involved memory accesses are
    analyzed. At the level of neurons, optimizations of the convolutional and fully
    connected (FC) layers are explained and the performances of different methods
    compared. At the network level, approximate computing and data-path optimization
    methods are covered and state-of-the-art approaches compared. The methods and
    tools investigated in this survey represent the recent trends in FPGA CNN accelerators
    and will fuel the future advances on efficient hardware deep learning.'
