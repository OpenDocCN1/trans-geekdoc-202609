    # Deep Learning in Computer Vision


    Robotics soccer is an interesting area because it requires real-time vision algorithms
    that are able to work with limited computational resources. Deep learning techniques
    developed in robot soccer can therefore be transferred to other resource-constrained
    platforms, such as smartphones and Unmanned Aerial Vehicles (UAVs). Current applications
    for robotics soccer include soccer player detection [22, 38], ball detection [39],
    and visual navigation [40]. State-of-the-art soccer player detection [38] uses
    a model based on SqueezeNet using only convolutional layers, an extended connected
    layer, with processing regions of 28x28. This method requires only 1 msec on a
    Nano robot for processing a region, using only an Intel Atom CPU. Another application
    is ball detection, which is addressed in [39]. This method uses an architecture
    based on three convolutional layers and two fully connected layers. However, its
    runtime is not reported. Finally, in [40] a system based on image processing and
    DNNs is able to detect players, balls, and the orientation of the robot inside
    the playing field is. The system is able to work in real time inside robots, without
    using any color information. Currently, CNNs have been used for solving very specific
    tasks in robotics soccer successfully, and it is expected that new algorithms
    (and hardware) will enable the use of deep learning in global, high-level tasks.


    # 8.3.2 Object Grasping and Manipulation


    The ability to grasp objects is of paramount importance for autonomous robots.
    Classical algorithms for grasping and manipulating objects require detecting both
    the gripper and the object in the image, and using graph-based or Jacobian-based
    algorithms for computing the movements for the gripper. Deep learning has generated
    a paradigm change since tasks like grasping, manipulation, and visual serving
    can be solved directly, without the need of hand-crafting intermediate processes
    like detecting features, detecting objects, the gripper, or performing graph-based
    optimizations. As problems are solved as a whole from raw data, the performance
    limit imposed by inaccuracies of intermediate processes can be surpassed, and,
    therefore, new approaches for tasks related to grasping, manipulation, and visual
    serving are being developed. Also, the new algorithms are able to generalize to
    novel objects and situations. The performance of this new generation of methods
    is limited by the size of the training datasets and the computing capabilities,
    which becomes relevant when using hardware-robotic platforms.


    Grasping objects directly, without the need of detecting specific objects, is
    a difficult problem because it must generalize over different kinds of objects,
    including those not available when training the system. This problem has recently
    been addressed successfully by deep learning. Studies are that based on learning
    grasp locations [41–43] and [44], which used self-supervision during 700 hours
    of trial and error in a Baxter robot. What has been extended for learning eye-hand
    coordination in [45], which is the state of the art. The latter system is trained
    without supervision by using over 800 and 14,000 samples collected over the course
    of two months, using between 6 and 14 manipulators at any given time. The proposed
    network processes two inputs: an image (size 512×512), and a motor'
  merge: -1
  img_proc: true
