  md: '# 7.3.3 EARTH OBSERVATION IMAGE REGISTRATION


    The calibration component is responsible for registering two images from two sources
    (S, r) to obtain the transformation describing UAV motion. The registration component
    that is trying to register consecutive images S from the onboard camera has a
    much easier job, since the images are from the same source with minor differences.
    It is important to note that this experiment is carried out without the corrective
    assistance of the semantic segmentation registration. Furthermore, the experiment
    is evaluated on a ground-truth manually created.


    The Calibration Component Experiment: The calibration step starts on first S(1)
    where the GPS location is known, the source, and goes through the registration
    process with cropped from r. After every five frames processed by the framework,
    this process is set to action. The Fumagata Sequence is 1374 frames in total.
    After every 32 frames (video captured at 32 fps), a frame is processed, since
    it is inefficient and time consuming to process every frame. On the other hand,
    the Potsdam Sequence is composed of 10,800 frames, and so the calibration component
    is called every 60 frames (video captured at 60 fps). As explained before, since
    ground-truth does not exist, the registration was performed using the following
    algorithm:


    +   - Manually, another path is created from the center points of the UAV sequence
    frames, which provides our ground-truth.

    - Features are extracted from the S_n and r.

    - If 70% of the matches are found a distance of 0.2 or less, results then a homotopy
    is created in a warped image.

    - Apply homology to the reference map ROI, which yields a warped frame using the
