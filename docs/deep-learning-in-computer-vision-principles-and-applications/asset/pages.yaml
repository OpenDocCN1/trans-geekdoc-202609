    # 4.5.2.2 Testing the Generalization Ability of the Proposed Approaches


    To further examine the robustness of the proposed face recognition approaches,
    a number of comprehensive experiments were conducted on the FRGC V 2.0, and UFI
    datasets, and the results obtained were compared with the current state-of-the-art
    approaches. For a fair comparison, the performance of the FDT-DRBM approach was
    evaluated using the standard evaluation protocols of FRGC V 2.0 and UFI datasets,
    were described in [6, 62], respectively. It is worth noting that DNNs need to
    be trained on a massive amount of training data to achieve satisfactory performance
    and prevent overfitting. Thus, to increase the generalization ability of the proposed
    deep learning approaches (e.g., CNN and DBN), the data augmentation procedure
    as described in [7] was applied to the gallery set of these datasets. Then, their
    performances during the learning process were observed on a separate validation
    set from the fully augmented gallery set. According to the standard evaluation
    protocol, the FRGC V 2.0 dataset consists of six experiments. The experiments
    used to evaluate the performance of the 3D face recognition systems are not relevant
    to the objectives of this work. Hence, the focus will be on experiments 1, 2,
    and 4. In experiment 1, both the gallery and testing sets consist of a single
    controlled still image of each person. Experiment 2 addresses the effect of using
    multiple images per person on performance. The gallery in this experiment consists
    of four images for each person, in the same subject session. Likewise, the testing
    set is composed of four images per person. Experiment 4 addresses the problem
    of uncontrolled face recognition. and the testing set is composed of a single
    uncontrolled still image. In the standard UFI evaluation protocol, both partitions
    (CI and LI) were divided into training and testing sets. For comparison purposes,
    the faces in the cropped images were kept at the same size: (128x128) pixels.


    Firstly, matching scores are combined using different fusion methods at the score
