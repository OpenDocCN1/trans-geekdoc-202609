    # ICS


    # A Brief History of Industrial Computer Systems Malware


    2010: Stuxnet


    Analyzing the professional activities of the first organizations to fall victim
    to Stuxnet gives us a better understanding of how the whole operation was planned.
    At the end of the day this is an example of a supply-chain attack vector, where
    the malware is delivered to the target organization indirectly via networks of
    partners that the target organization may work with.


    > —Alexander Gostev (Kaspersky Lab)


    Kaspersky Lab found Foolad Technic Engineering Co., Beh Pajoh Co. Elec and Comp.
    Engineering, Neda Industrial Group, Control-Gastar Jahed Company and Kala Electric
    (Kalaye Electric Co.) among the organizations identified after examining more
    than 2,000 Stuxnet files collected over a two-year period.


    Stuxnet was the first malware to specifically target SCADA systems and programmable
    logic controllers (PLCs). The main responsible for Iran''s nuclear program sabotage,
    and probably the best example "where the malware is delivered to the target organization
    indirectly via networks of partners that the target organization may work with.


    Kaspersky Lab''s Global Research and Analysis Team (GReAT) labeled Stuxnet as
    the digital equivalent of the atomic attacks on Nagasaki and Hiroshima. Due to
    design flaws and bugs, Stuxnet ended behaving like a virus and propagate over
    the Internet infecting over one hundred thousand systems on top of the systems
    initially designated as part of the attack.'
  - '[PAGE 126]


    The origins of Stuxnet have been the subject of speculation since it started to
    get media coverage in Spring 2010.


    According to a New York Times article released during 2012, anonymous sources
    are quoted saying that Western governments have taken part in facilitating a cyber-attack
    against Iran. The effort involved the National Security Agency (NSA) and an undisclosed
    Israeli military unit known as Unit 8200, The New York Times reported.


    Primarily designed to compromise software used at nuclear facilities to control
    data acquisition, Stuxnet targets frequency converters. Stuxnet target is to sabotage
    the system of controls in charge of power supplied to motors.


    Stuxnet used zero-day vulnerabilities targeting Microsoft products to infect computers.


    # 2013: Havex


    The Havex remote access tool (or RAT for short) has been linked to the Russian
    group known as "Energetic Bear." Identified in spring 2014 after a series of attacks
    aimed at industrial control systems covered by security firm F-Secure, the Havex
    RAT family was already featured in the 2013 Global Threat Report by cybersecurity
    firm CrowdStrike.


    Trojanized software was being planted on ICS/SCADA hacked websites: a total of
    more than 80 variants of the RAT and 140 plus command and control servers (C&C)
    have been identified as responsible for illegal data acquisition operations.


    F-Secure has analyzed the Havex components and found out standards that provide
    linked bridge for Windows-based software to collect data and sensitive information
    on compromised devices and send it back to C&C servers via Object Linking and
    Embedding (OLE) for Process Control (OPC).


    Havex can be described as a family of remote access trojans used for espionage
    campaigns targeting ICS environments. If first scans for SCADA or ICS devices
    on compromised networks, and forward information back to the attacker. The core
    mission of the Haex intelligence extraction tool is not to disrupt or damage an
    industrial system.'
  - '[PAGE 127]


    # 2014: BlackEnergy


    The BlackEnergy malware is crimeware turned APT tool and is used in significant
    geopolitical operations lightly documented over the years.


    > —Kurt Baumgartner and Maria Garnaeva (Kaspersky Lab)


    Anomalies detected during 2013 in the BlackEnergy configuration files, led to
    unusual activity on one of the BlackEnergy CnC (command-and-control) servers.
    At first, BlackEnergy’s plugins were used to run distributed denial-of-service
    attacks (DDoS). The Sandworm team was one of the earlier adopters of the Malware,
    the Malware later on adopted in several geopolitical operations involving APT
    tools.


    A series of studies have led to the conclusion that Sandworm might keep their
    non-Windows hacker tools in separate servers and folders to protect their servers.


    Some of the Windows plugins include:


    +   * “Fs”—searches for given file types

    * “Rd”—remote desktop access

    * “Dstr”—overwrites hard drives with random data until they become unusable


    After collecting plugins over an extended period, researchers have linked the
    attacks to Russia, Poland and Ukraine among countries.


    # 2014–2015: BlackEnergy 2


    A variant of the already existing malware BlackEnergy, BlackEnergy 2 was designed
    to target HMI software (human-machine interfaces) from General Electric, Siemens,
    Advantech/Broadwind and several other vendors. BlackEnergy 2 is famously known
    for the 2015 attack that took down the Ukrainian power grid.'
  - '[PAGE 128]


    # 2016: Industroyer/Crash Override


    Known for the winter 2016 attack on transmission substations in Ukraine


    A real-life scenario would involve coordinated attacks on multiple sites where
    breakers open and close until the substation goes offline. Industroyer/CrashOverride
    is made of several components:


    +   - A backdoor that allows the attackers to execute commands on the compromised
    systems. It would initiate a time-based communication over the Tor network via
    command and control (C&C) servers.

    "- A launcher.

    "- A data wiper that involves clearing registry keys


    The in-depth understanding of the technology used in the energy sector suggests
    that some of the malware''s developers might have ties or previously worked for
    companies involved in running power grid operations and industrial network communications.'
  - '[PAGE 129]


    # 2017: Triton


    The TRITON family is compromised of main modules trilog.exe (Main executable leveraging
    libraries.zip) and library.zip (custom communication library for interaction with
    Triconex controllers). The TRITON can be used to modify allocation memory on Triconex
    Safety Instrumented System (SIS, the autonomous control system that independently
    monitors the status of processes) controllers, which prevents controllers from
    functioning, increasing the chances of failure.


    Some of the real-life scenarios include the use of the SIS to shut down a process
    (for example, triggering a false positive), reprogram the SIS (redesign the logic
    to allow unsafe conditions are impacting equipment and human safety) and use the
    Distributed Control System to create a hazard.


    How ICS malware attacks.


    +   - A remote connection may be used to infiltrate the industrial network

    - Once inside the network, the adversary can scan the network to identify ICS
    devices

    - Since ICS networks do not use authentication or encryption, an adversary can
    access any system—including operator or engineering workstations, HMIs, Windows
    Servers, or controllers (PLC, RTU or DCS controller)—to identify assets in the
    target

    - The attacker extracts information gathered via reconnaissance to an off-site
    location. This could be accomplished by passing the information internally from
    different systems to a single location from which it can be extracted.

    - Malware is installed on a workstation with access to the targeted ICS system(s)
    using knowledge gathered in steps one and two, mentioned earlier. This can be
    accomplished via the network, or by using an infected USB drive.

    - The malware replaces existing logic and uploads new ladder logic to the controller
    (PLC, RTU or DCS controller). Since this logic determines how automated processes
    are executed, changing or replacing it with malicious payloads can result'
  - '[PAGE 130]


    from a wide range of operational disruptions and even physical damage to systems,
    the environment and humans.


    # ICS Facts Versus Myth


    with Robert M. Lee


    Robert is the CEO and founder of his own company, Dragos, Inc., that provides
    cyber security solutions for industrial control system networks. Consider the
    2015 attack on the Ukraine power grid when for the first time in history a power
    grid went down due to intense cyberattack. He joined the United States Air Force
    and became a cyberspace operations officer in the U.S. intelligence community.
    In that role, he created and led a mission examining nations targeting ICS, the
    first mission of its kind in the U.S. intelligence community. Robert has a master’s
    degree in cybersecurity and computer forensics from Utica College as well as cyber
    warfare training through the U.S. Air Force, and he’s pursuing his doctorate in
    war studies from King’s College London. He was named one of Forbes’30 under 30
    in Enterprise Technology in 2016, was awarded Energy Sec’s 2015 Cyber Security
    Professional of the Year and named one of Passcode’s “Influencers.”


