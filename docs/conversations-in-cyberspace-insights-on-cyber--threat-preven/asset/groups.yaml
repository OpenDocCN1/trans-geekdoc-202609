    # CONVERSATIONS IN CYBERSPACE


    Q. During July 2015 a group called themselves “3301” and claimed to have hacked
    Planet Parenthood, creating confusion between the real Cicada 3301 and false actors.
    The use of PGP encrypted messages also increased the confusion in relation to
    secrecy around Cicada 3301. Could you tell me more in relation to the misinformation
    around Cicada 3301?


    A. That was not the first time, we deny any relation to them.


    Q. We live in a time when technology is evolving faster than us, technology is
    directly influencing us in the way we communicate, think and behave. When people
    think technology they think about knowledge; considering the dichotomies between
    concepts like chaos and noise, knowledge and imagination ... how would you envision
    a time when people associate technology with imagination?


    A. If you take obesity in the first world, many people would blame food. They
    are not completely incorrect, food is one of the root causes, but also improper
    use of technology is in the list of causes.


    Technology and its results are meant to help us and somehow “augment our senses,”
    but if we do not know how to use technology we will have technology owning. We
    have grown obese in part because we sit and expect technology to do our jobs for
    us, so the actual functionality of our bodies grows less important and you see
    weight gain as a result.


    Q. It seems that in the Western world “technology owns people,” while places like
    Japan, people and technology are one thing (and sometimes vice versa). Do you
    think we will enter a “technological renaissance?”


    A. I think that there will be new renissances. The Bonfire of the Vanities (February
    7, 1497) was a attack by controllers to crush an enlightenment movement. The world
    is made up of those who wish to control us, and those who wish to be free ...
    the contributions of the de Medici family to the Renaissance in Italy spray a
    fire no priest could stop ... however, history repeats itself in cycles and this
    relates to periods of creative flowering.'
