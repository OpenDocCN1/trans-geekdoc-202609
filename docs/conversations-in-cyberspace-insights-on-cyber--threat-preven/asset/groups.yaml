    ## Q. 深网（Deep Web）和暗网（Dark Net）？它们有什么区别？


    - A. 深网是一个特定的概念。暗网是指特定的 Tor 或特定的产品或服务。这些都是模糊地涵盖同一领域的不同事物。这一点对你来说非常重要。所以，当我们在深网课程的介绍中提到时，深网是指由于任何原因未被搜索引擎索引的任何网页，无论是是因为
    `robots.txt` 文件告诉某个爬虫你不希望网站被索引，还是因为该网站是某种内容管理系统，需要登录用户名和凭据才能通过初始屏幕（因此，小 Google
    爬虫无法通过），或者它是所谓的“暗网”的一部分。


    当我们谈论暗网时，基本上这是一组相互连接的计算机以创建一个网络，而为了访问这些计算机或服务，你必须在你的计算机上安装特殊的软件。基本上，对于这些存在的网络服务，Google
    无法简单地访问或通过 Yahoo 访问，暗网是深网这一大领域内一个非常特定的概念。所以，当我们谈论暗网时，基本上我们说的是两种产品之一，尽管那里还有其他选择。


    通常我们说的是 Tor。更重要的是，或者更具体地说是 Tor 服务。


    还有一种被称为 Freetenet 的东西，它允许你完成我们今天要讨论的相同事情。基本上，这些服务构成了所谓的暗网；很多时候当人们谈论暗网时，他们实际上是在讨论
    Tor 服务。他们交替使用这些词，但实际上它们并不一样。Tor 服务是一个特定的产品。


    暗网本身更多地是一个概念或想法。所以当我们我们谈论暗网时，暗网的核心定义是：为了访问暗网，你必须在计算机上安装某种特殊软件，因此暗网——任何构成暗网的内容必须使用
    TCP/IP 协议，它在理论上是可以访问的，但你必须做一些特殊操作才能获取。所以首先，尽管你使用互联网技术来维护自身并进行通信，你必须添加其他东西才能访问该暗网内部的信息。


    暗网的主要概念是它试图维护你的匿名性。所以当你进入那里时，它应该尝试维持你保持匿名的能力。在普通的 IP 流量或网络流量中，没有人不在乎你是否匿名，你可能在乎，但互联网
    TCP/IP 的原始创造者并不在乎。往来通信越多，对他们就越好。当我们谈论 TCP/IP 数据包、TCP/IP 头部时。


    重要的是要理解到，它包含了许多可以追溯到你身上的身份识别信息。所以任何人获取了那个数据包，都可以收集信息并追溯到你身上。现代世界，你知道，匿名人士的现代世界想要保持他们的匿名性，所以他们不希望被追溯。


    暗网的大概念是，当你进入暗网或使用暗网时，你应该能够保持你的匿名性。所以，重要的部分是你可以使用普通的互联网 IP 等所有技术，但你必须安装软件才能访问它。这是为了维持你的匿名性。再次，这可以通过多种方式实现。有多种不同的产品可以创建暗网。再次，最流行的被称为
    TOR。同样，还有许多人额外使用的 Freetenet。


    现在当你谈论 Tor 时，基本上 Tor 的最初想法是你能够将你的数据流量路由到连接到这个 Tor 网络的多个不同计算机上。这样你就可以绕过所在国家的过滤器，例如，如果你在一个不想看《CNN》或《Daily
    Show》的独裁国家，你可以连接到 TOR 网络，它会通过上百台或任意数量的计算机对你的通信进行路由，以便你可以访问被屏蔽之外的网络。此外，通过通过这个庞大的网络路由信息会保持你的匿名性。所以，如果你访问
    CNN.com 或访问某个网站，该网站能够从你身上获取的信息将是无法进行个人识别的，而是这整个 Tor 网格的一部分。


    所以，TOR 的原始想法应该是让你在访问普通网站时保持匿名性，如果你去访问家里的 CNN，去访问 BankofAmerica.com，去访问 Wikipedia，去访问
    Anonymous.loveanonymous.com。如果你尝试访问这些网站，原始想法是它在那里保持你的匿名性。好吧，然后他们想出了一个叫做 Tor 服务的点子。现在非常重要的是理解，当我们谈论
    Tor 内部的网站时，这些被称为“服务（Services）”。所以他们决定，不再总是将所有流量路由到普通互联网上的网站，而是你可以在自己的计算机上创建并托管网站，然后通过
    Tor 的力量，人们只需被重定向到你这里。所以基本上你可以使用网络浏览器，连接到 Tor，然后使用地址去访问你想去的那个特定网站。


