    GitHub link: https://github.com/DanWin/onion-link-list


    I actually think these are pretty good improvements to discovering darknets, in
    addition to DARPA''s memex search tool. Web hosts need to be aware of what''s
    in their robots.txt file and act accordingly. There may be some privacy concerns
    this MAY be used for relation attacks, so I''ll definitely be looking more into
    it. It''s a hard-off to make: I don''t want Tor to be anonymous (more darknets
    will appear), but at the same time, there are some disgusting sites/services out
    there I wish could be taken down.


    What is your take on Penetration Testing Linux distributions such as Kali, BlackArch
    or ParrotSec?


    My take is that these are very specialized operating systems designed to be used
    by a skilled pentester who understands how to use the tools. I have seen many,
    cases where someone with almost no Linux experience downloads Kali, thinking it
    will make him/her a hacker. Obviously, this isn''t the case, since the (mostly
    command-line) tools require some knowledge before use. Clearly, you can install
    the same tools on Arch or a basic debian install, but the benefit of something
    like Kali (especially a live boot) is the fact that everything comes pre-installed
    and is ready to be used in an attack (whether for good or bad).


    Do you support/support compartmentalized OS like Qubes?

    Absolutely. I''ve used it myself and I think it''s a great solution to many of
    today''s security concerns. I''ve never seen an OS that''s so secure, yet so easy
    to use. As Micah Lee from the Freedom of the Press Foundation once said, it really
    makes you feel like a god. With Qubes, you''re in control of the software; not
    the other way around!'
