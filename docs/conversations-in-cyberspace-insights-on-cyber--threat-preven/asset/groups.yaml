    # 112 CONVERSATIONS IN CYBERSPACE


    In your opinion, what are some of the key features to improve technologies already
    existing in the DW such as search engines, hosting and communication in general?


    What I dont want to see is a powerful, centralized search engine for the dark
    web with tons of algorithms and tracking features. What I want to see is an improved
    directory system that makes it easier to search for keywords, doesn''t mine the
    data to look for patterns and correlations. A company like Google does a wonderful
    job of providing a usable search engine, but I choose to use Startpage or DuckDuckGo
    because privacy is more important to me than ever-so-slightly better search results.
    Google is not the only one who does this, but they are certainly one of the biggest.
    I noticed the “fight or flight” response is sort of nonexistent when it comes
    to the cyber world (often due to users'' unaware or lack of understanding of technology),
    but if the thought “I wonder what they do with my data” crosses your mind, then
    it''s looking into it if you ask me.


    When it comes to hosting, I think there should be more free hosting services.
    I know a couple people who were thinking about doing this, myself included. I
    dont have a lot of money at the moment a poor student, but when I do, I think
    this is a nice way of giving back to this community. This will make it easier
    for people to have their own hidden service without much administrative overhead
    or requiring too much experience. Of course, there would be certain types of content
    I wouldn''t allow (such as child abuse or zoophilia), but for the most part it
    would be completely uncensored.


    Communication is not currently an issue in my eyes. It is not difficult to communicate
    and find secure ways to do so. The more educate people on the importance of encryption
    and authentication, the safer everyone will be. I like Tor because it takes you
    back in time to the earlier days of the Internet with less automation, less javascript,
    and more simplicity. It''s like an old school, yet futuristic breath of fresh
    air away from the chaos of the clearnet, and I hope it stays that way.


    Thanks for the interesting questions, some of which really made me think. No one
    has asked me that activist question before, so that'
