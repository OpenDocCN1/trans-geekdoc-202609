    年，研究小组使用 Grams 在一次大宗货物运送后找到了 Pappy Van Winkle 威士忌……


    相关性的缺失凸显了 Grams 给调查人员带来的问题。


    Grams 在引导研究人员找到暗网网站上完整的免费书籍方面做得非常出色。


    该服务对药物相关网站的索引非常好。得益于 Flow 服务的加入，只要调查人员知道网站标题，就能轻松定位特定的暗网网站。


    我发现 Grams 能够产生有用的结果，但它包含了无关的、离题的结果，使得必须对结果页面进行人工检查。与其他暗网搜索系统配合使用时，Grams 是可以的。


    # Not Evil


    Not Evil 位于 https://hss3uro2hsxfogfq.onion，是 TorSearch 和 Evil Wiki 的重新品牌。链接经过了过滤。相关性算法会考虑用户点击的内容。Not
    Evil 的运营者保持低调。该服务不接受暗网广告。该系统允许用户通过名为“Ned”的聊天机器人与另一个 not Evil 用户开始安全对话，“Ned”是 Evil
    Drone 的缩写。not Evil 系统在 Tor 内部包含一个“聊天”功能。可以使用聊天机器人或匿名用户开始有关查询的对话。此外，not Evil 会显示索引中匹配查询的目数量。除了搜索外，系统还提供了
    not Evil 系统索引的链接数量。最后，not Evil 提供了一个应用程序编程接口（API），以便将 not Evil 的性能集成到其他应用程序中。


    # Onion Link


    Onion Link 可以在 http://onion.city 找到。这个暗网搜索系统之所以引人入胜，是因为它似乎使用了谷歌自定义搜索功能以及 Ahmia
    索引来创建结果。根据对 Onion Link 搜索结果的研究分析，索引包含约 20,000 个暗网网站。大约六年前，谷歌曾运营过暗网网站，但随后该网站下线了。从那时起，谷歌没有披露过有关其暗网活动的信息。谷歌的确投资了
    Recorded Future，这是一家索引暗网内容的公司。研究小组提出的一个假设是，谷歌可能会为了其研究并支持其谷歌支持的 Recorded Future
    工作而索引某些暗网内容。在 2016 年底，根据我们的评估查询，谷歌对胶水网站（glue websites）的索引有所减少。


    # Torch


    Torch 搜索系统提供了一个搜索框、暗网广告以及一个想要在 Torch 系统上投放广告的链接。请注意，在该截图中，Torch 报告其索引包含约 500,000
    个暗网页面，比其他引擎少约三分之一。Torch 是低调的暗网搜索程序之一。该系统的一个有用功能是词汇高亮。搜索系统产生的相关性评分使其能够发现索引网站中词汇出现的频率。列表条目显示了
    Torch 索引子系统访问网站的日期。Torch 暗网搜索非常有用。我们建议在沙箱内部使用它。


    # 免费搜索方法


    免费暗网搜索方法为访问许多暗网网站提供了便捷、简单的途径。然而，没有任何一个系统是没有严重缺陷的。我开发的方法涉及编写查询，然后在本章讨论的五个搜索系统运行该查询。我下载了前五组结果并将它们合并。然后我访问了与我们正在调查的特定问题最相关的暗网网站。显而易见的是，执行手动查询和结果分析所需的时间和精力是一种负担。


    # 深网工具


    操作系统或应用程序等软件存在缺陷。软件可以通过文档到达。


