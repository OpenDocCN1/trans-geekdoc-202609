    # 赛空间对话 127


    让我们来看关于“炒作”的第二个案例研究。2015年1月15日，土耳其发生了一次持续10小时的停电。


    我认为这个案例中最有趣的是是，在停电发生的最初几个小时内，任何人都对根本原因分析或发生了什么还没有任何了解。我们看到全球范围内从彭博社（Bloomberg）到
    CNN（CNN）的各大主要新闻来源都在说：“根据诺斯（报告，我们知道伊朗对工业控制系统（ICS）发起了网络攻击；根据彭博社关于 BTC 管道的报告，我们知道土耳其成为了目标。我们认为，土耳其管道或土耳其停电可能是伊朗的网络攻击，是不恰当的。”


    在任何基础设施停电的初期，州政府和国家官员会非常担心，尤其是对于电网这样的设施。当国家领导人被主流媒体告知这可能是网络攻击时——特别是当这种说法基于之前被拆穿的煽动故事时——你可以想象这增加了当时某种程度的地缘政治紧张局势。在停电后的几天里，由于调查需要时间，我们发现停电是因为是因为有记录以来最炎热的一天导致的。是变压器过热导致故障在几个站点之间发生了连锁反应；这是完全合理的现象。那是基础设施老化的结果。这就是为什么我们必须确保对基础设施进行投资并保持更新，但这与网络攻击无关。接着在去年
    Bluebells 发生的最后一次事件中，一位部长站起来说：“看，我们在这里举行这次会议，”那是以色列的能源和资源部长，他说：“看这一刻——我在这里是转述他的话——看这一刻，我们的电网正经历着历史上最严重的网络攻击之一。”


    这是来自一位政府官员，如果这具有足够的权威性，那么 CNN 和其他几家媒体就跑了头条新闻。这是其中一篇文章的截图：“以色列电网遭受大规模网络攻击。”原文是这么说的。遗憾的是，部长本想说的是：“噢，那是监管机构，与我们的电网无关。只是一个有大约
    30 台电脑和一些人的小办公室。而且，发生的情况是有人打开了一封带有勒索软件的钓鱼邮件。”这和之前的说法有些不同：“电网正遭受大规模网络攻击”对比于“一个与电网完全无关的办公室有人中了勒索软件”。


    你必须表现得更细致一些。当然，这正是重点所在。我们不断看到，无论发生什么，无论是旧金山和纽约同时发生小规模停电，还是某列火车脱轨，人们的第一反应都是跳到“网络攻击”，而这甚至不是最可能的情景。我们必须担心我们在演示后半部分将讨论的威胁。然而，我们必须比这更细致一些。很多时候，媒体有时捕捉到的情况是，州长办公室拒绝说“这不是网络攻击”，因为他们没有信息。我的意思是，我并不是拒绝说那不是巧合，但它确实不是。那可能就是发生的情况，但我不知道哪些不是。我们不知道到底是什么。这很诚实。


    关于我们这种针对外国政府的下一代软件技术，为什么我们要跳出你需要一个被动系统？我稍后会谈到。此外，我在这里的观点是，我们想要很多内容都建立在安全之上，并使我们拥有非常有防御性的环境。我在演示开始时提到的简单内容是，在我职业生涯的巅峰时期，我一直处于进攻状态——不是红队，而是其他人的
    APT（高级持续性威胁）。我要指出的是，在我那个日子里，我们从未想过：“当防御者发现我时，我该如何给他们留下深刻印象。”我想并不是重点。重点是你有的一堆任务，而世界上每个人都在管理
    PPT 演示稿。甚至你的进攻人员也是如此。此外，这就是关于我们如何进入他们的生活的想法。


    # 我们如何继续执行任务？


    此外，标新立异存在操作风险。如果你利用了酷炫的工具、酷炫的漏洞和交易手段，你会招来一些高级响应人员，这会引起关注，并且在防御端或在进攻端，这会让情况变得非常困难。


    然而，如果我针对一个已经存在五年的漏洞编写了一些基础恶意软件，它并不是……（文本继续）

