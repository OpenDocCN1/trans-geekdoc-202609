  - '[PAGE 33]


    # CONVERSATIONS IN CYBERSPACE 25


    media in Central Asia are specifically targeted online by other actors by dint
    of their professional activities. Our initial threat model referenced a growing
    literature on targeted digital threats to civil society actors.


    Over the past decade, NGOs have become targets of spear phishing or social malware
    attacks, and have found it difficult to mitigate these threats.


    In contrast to their under-resourced targets, the adversaries are often well-resourced
    and well-trained. Documented attacks on NGOs have often revealed a relatively
    high level of sophistication when the overall complexity of the attack is considered,
    particularly in the social engineering methods used, if not always in the code
    itself. In light of this observation Seth Hardy has proposed a metric that attempts
    to quantify the relative complexity of both the social engineering and the malicious
    code employed in a targeted malware attack.


    It is argued that such a Targeted Threat Index (TTI) is a superior heuristic for
    assessing the sophistication of a threat—in comparison to technical analysis in
    isolation of the social context. A consequence of research analyzing targeted
    digital threats has been an increase in donor resources to modify user behavior
    among targeted populations through training programs, rather than relying on strategies
    that over-emphasize technical risk mitigation through the deployment of software
    and hardware.


    A significant motivation for the deployment of the DNS firewall was to mitigate
    the risk of targeted malware attacks by identifying the malicious domains associated
    with C2 infrastructure and blocking those domains. If one NGO in the research
    population was targeted, all the NGOs would be protected from malicious infrastructure.
    This approach has worked to great effect in the Tibetan diaspora.


    The digital security environment that we have observed so far, however, suggests
    that NGOs in the Central Asian region are more likely to be exposed to commodity
    threats, such as browser-based crypto jacking than to APTs.'
  - '[PAGE 34]


    Q. You work with NGOs or non-profit organizations for the most part. Are there
    significant differences between cybersecurity practices in the third sector as
    opposed to the corporate or government sectors?


    A. Yes, NGOs often operate in challenging environments with constrained resources.
    Donors expect that beneficiaries will manage projects that are sustainable beyond
    a given funding cycle, and will have visible impact.


    The participants of the CyberSAR experiment are typical of small scale civil society
    organization I am researching at other field sites, notably in Dharamsala, India,
    and Hong Kong, in that they face a wide range of cyber security threats that they
    are often ill-equipped to defend against.


    The lack of both technical resources and training leaves many organizations vulnerable
    to even basic Internet attacks. Breaches can have serious consequences for high
    risk, low capacity civil society organizations.


    The exfiltration of confidential data introduces extreme risk into an already
    challenging operational environment. For example, outside the Central Asian region
    there are cases where members of compromised organizations have been detained,
    interrogated, and torture a direct consequence of a data breach.


    Furthermore, the loss of confidential data can have effects beyond the compromised
    organization, leading to cascading effects throughout the donor-beneficiary ecosystem.
    It may be ironic, but the very same computer-mediated communications systems and
    information sharing practices have been shown to empower civil society networks
    that are increasingly channeling significant cyber risk.


    At the same time, our field researchers'' assessment at the sites in Central Asia,
    is that digital security behavior are prevalent, and that poor digital hygiene
    is a more significant organizational risk factor than APTs or other targeted campaigns.


    With the applied research dimension of the CyberSAR project we aim to test this
    hypothesis, and quantify the impact that the improvement of digital hygiene through
    training has on the cybersecurity preparedness of an organization.'
