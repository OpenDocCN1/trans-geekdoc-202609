    你好，


    我叫 MrSecurity。

    我是一名研究员、安全专家以及隐私支持者。

    我决定对你在 Atlayo 上发的消息进行回复，分享我对 Podesta 案件的看法，以及在 2016 年发生的种种事件。


    首先，你必须理解，自从人们意识到他们有一种跨越时区联系的方法并建立了异步发送信息的方法后，电子邮件已成为互联网通信的命脉。30 岁以上的人无法理解如何用电子方式组织任何工作。电子邮件的缺点、缺乏加密、难以验证发件人身份、在传输过程中的某个阶段可能被窃听的风险，以及无法确认接收者是否收到或阅读的问题，已经通过其他提供加密、确认和送达/回读回执的系统得到了解决。尽管如此，电子邮件依然是互联网上的“蟑螂”。


    然而，如果你正在进行美国总统竞选，你难道不需要一封电子邮件吗？


    竞选活动是一项极其复杂的工程。全美各地都有地方团队，而且需要针对不同的国家和社区定制信息，同时还要为报纸和电视准备相关信息。此外，在第一阶段，斗争不是针对另一个政党，而是针对同党的竞争对手，这样就可以微妙地调整信息和演讲稿，以吸引现有选民，而不是更广泛范围内的摇摆选民。协调提到什么以及何时提到至关重要。保密也是如此：在宣布倡议时，让对方知道你的计划，以便他们准备应对措施，或者只是抢占先机。全球范围内为了这项工作投入了数百万美元。这不是业余者的游戏。2015
    年 1 月，希拉里·克林顿聘用了年仅 66 岁的 John Podesta 作为她的竞选经理，并在宣布参选后担任其活动的首席幕僚。他们非常默契：Podesta
