    35 Mbps，但第一个中继节点的上下行速度可能只有 1 Mbps，而下一个中继节点可能只有 756 kbps，接着的下一个中继节点的速度可能就没区别。所以基本上，你的速度取决于最慢的那条链路，而且会比那个速度还要慢得多。所以当你再次尝试使用
    Tor 浏览互联网时，如果你正试图保护隐私，如果你出于某种原因试图做一些秘密工作——嘿，面条怪物兽，尽管去干吧——对于我这种普通人来说，美国国家安全局（NSA）可以查出我在哪里。


