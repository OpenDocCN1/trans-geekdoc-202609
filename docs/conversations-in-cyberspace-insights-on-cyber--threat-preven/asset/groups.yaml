    \nANRG 研究了技术网络与社会网络之间的联系，以及其对全球安全、政治、发展和冲突转型的影响。ANRG 项目共享一种共同的方法论，该方法结合了利用技术方法对网络进行审视和制图，同时在语境化、实地民族志方面培养了成熟的专业知识。\n\
