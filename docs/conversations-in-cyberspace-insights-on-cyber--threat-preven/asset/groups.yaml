    150 个以多种形式存在的网站列表。被捕获的网站可以使用不同的暗网地址在网上存在。一种策略是要求执法部门为通过该网站的订单请求次要和主电子邮件地址、电话号码，或主和备用收货地址。更复杂的方法涉及创建看起来像暗网应用程序的移动应用程序。


    “多重利用法”利用了受调查小组控制的暗网网站、不同的感染向量（表单、应用程序、电子邮件等）以及可能从坏分子的计算机迁移到该坏分子所知的其他人员计算机的病毒。


    混合方法可以使用通过网络传播的应用程序。这种方法可能将对坏分子计算设备的远程访问管理与特定的软件相结合，当受感染设备的用户使用 Signal（一种加密消息程序）或制作用于分发和销售的视频时，该软件会执行特定操作。


    如果受感染的计算机用于维护暗网网站，恶意软件可以插入到主机服务器中并在该远程服务器上执行特定操作。结合方法使得调查人员能够访问网络上的一个或多个服务器，并获取与跨两个或多个计算设备及其网络的违法行为有关的信息。


    # Citadel


    Citadel 是一个软件包的示例，它包含了许多破解暗网计算机的功能。2012年，根据 SecuLert.com 的，Citadel 的开发者提供了 Zeus
    木马的一个变体作为软件即服务（SaaS）。Citadel 是至关重要的，因为它是从云端运行的漏洞示例。向云端工具的转变带来了许多优势。这些包括在漏洞成功利用数字货币帮助模糊漏洞利用者身份时的快速扩展。Citadel
    还包含一个社交网络组件。


    Citadel 的用户可以贡献新的代码模块、提交漏洞报告，并与其他 Citadel 用户讨论技术问题。对于执法部门和情报专家利用 Citadel Citadel，技术知识和对该软件的经验至关重要。Citadel
    提供了不同的加密选择。


    该软件需要特定的僵尸密钥来下载恶意软件更新和配置文件，以便不被跟踪器发现。Citadel 阻止了下载防病毒和防恶意软件工具的选择。


    # ElcomSoft


    ElcomSoft 有限公司成立于 1990 年，是一家总部位于俄罗斯莫斯科的私有公司。自 1997 年以来，ElcomSoft 一直积极为数字取证和 IT
    安全业务开发解决方案。


    如今，该公司维护着广泛的手机和计算机取证工具、企业安全产品以及 IT 审计产品。ElcomSoft 产品被几家富富 500 强公司、全球各地的多个军事分支机构、警察部门、政府以及大型会计业务公司使用。全套的
    ElcomSoft 密码恢复工具能够让企业和政府客户保护磁盘和系统，并使用常用的软件解密文档。ElcomSoft 的密码恢复应用程序速度很快，但速度取决于计算机本身和其他因素。


    密码恢复软件使得访问 Microsoft Office、Adobe PDF、Zip 和 RAR 格式的受保护文件变得更容易。与高端视频处理和游戏应用程序一样，ElcomSoft
    使用显卡处理单元进行速率计算。通过在 CPU 和 GPU 之间分计算负载，恢复保护文件密码的时间被缩短。除了密码恢复工具外，ElcomSoft 还提供取证磁盘解密器（Forensic
    Disk Decryptor），为调查人员提供了一种快速、方便访问存储在 BitLocker、PGP 和 TrueCrypt（现已停用）创建的容器中的加密数据的方法。ElcomSoft
    可以通过在解锁未加密模式下挂载为驱动器号来解密加密卷的所有内容。


    # EnCase


    EnCase 已成为被捕设备或计算机的首选取证解决方案之一。该程序使调查人员能够从各种设备获取数据并创建报告。取证包含搜索功能，可以轻松确定特定信息是否存在于设备上。取证可以从多种来源收集信息；例如，网页邮箱、聊天会话、备份文件、加密文件以及智能手机和平板。


    程序员可以使用取证脚本语言 EnScript 来自动化处理过程。搜索、调查或其他耗费精力的任务可以使用 EnScript 进行自定义，EnScript 类似于
    Java 或 C++。取证程序生成美国法院接受的文件格式，以验证所收集证据的完整性。该系统支持大多数基础文件系统和操作系统。取证与可选模块集成，用于处理虚拟文件系统和执行解密任务。


    # Kali Linux


    Kali 包含超过 300 预装工具。结合下文讨论的 Metasploit，具备适当计算机技能的调查人员可以破解暗网，然后进一步进入嫌疑计算机、存储设备或移动设备。


    适用于执法和情报工作的应用程序包括 SQL 注入、拒绝服务攻击等。


    SQL 注入是一种 Web 应用程序漏洞，攻击者可以在其中提交数据库 SQL 命令，从而暴露后端数据库。Kali 允许在可以访问用户计算机或服务器时使用手动方法。Kali
    允许使用 SQLMap（另一个开源工具）发动攻击。SQLMap 简化了检测和利用 SQL 注入漏洞以及渗透服务器的过程。


    Kali 支持从数据库检索数据并访问底层文件系统。Kali 也可用于盲注。在这种方法中，判断网站是否易受到 SQL 注入。如果是，程序员可以探测网站以查找数据库的表、列和记录。一旦探测返回积极结果，程序员就可以编写脚本遍历各种可能性。提供的代码示例帮助程序员将
    Kali 作为针对单个网站或一组感兴趣的网站进行盲注的阶段。


    # Maltego


    Maltego 分析并显示关系，提供了一个对个人、公司、事件和其他实体的俯瞰视角。核心概念是关系的可视化让调查人员或分析师查看信息及其关联。


    # Metasploit


    Metasploit 是黑客软件的集合，最初是基于 Metasploit 框架的开源黑客工具。

