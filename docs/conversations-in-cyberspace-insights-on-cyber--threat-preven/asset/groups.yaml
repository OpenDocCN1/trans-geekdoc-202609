  - '[PAGE 105]


    CONVERSATIONS IN CYBERSPACE 97


    There are several ways to categorize encryption, but for our purposes here, I
    have broken them down into four main areas.


    # Symmetric Encryption


    Symmetric cryptography is where we have the identical key in the sender and recipient.
    It''s most likely the most common type of cryptography. You''ve got a password
    or key which deletes a message, and I have the same password to decrypt the message.
    Anyone else cannot read our message or information.


    Symmetric cryptography is extremely fast, so it''s well-suited for bulk storage
    or streaming software. The disadvantage to symmetric cryptography is the key exchange.
    If both ends need the same key, they will need to utilize the third channel to
    exchange the key and therein lies the weakness. Whether two people wish to reestablish
    their communication and they''re 12,000 miles apart, how can they swap the key?
    This key exchange afterwards is fraught with all the issues of the confidentiality
    of the medium they choose, whether it be phone, mail, e-mail, face-to-face, and
    so on. The key exchange can be intercepted and leave the confidentiality of the
    encryption moot. Some of the standard symmetric algorithms That You need to be
    familiar with:


    DES—This was one of the original and oldest encryption schemes developed by IBM.
    It was found to be flawed and breakable and was used in the original hashing system
    of LANMAN hashes in early (pre-2000) Windows systems.


    3DES—This encryption algorithm was developed in response to the flaws in DES.
    3DES applies the DES algorithm three times (hence the name “triple DES”) making
    it slightly more secure than DES.


    AES—Advanced Encryption Standard is not an encryption algorithm but rather a standard
    developed by NIST. Presently, it is considered the most robust encryption, uses
    a 128-, 196-, or 256-bit key and is occupied by the Rijndael algorithm since 2001.
    Used in WPA2, SSL/TLS, and many other protocols where confidentiality and speed
    are essential.'
  - '[PAGE 106]


    RC4—This is streaming (it encrypts each bit or byte rather than a block of information)
    cipher and developed by Ronald Rivest of RSA fame. Used in VoIP and WEP.


    Blowfish—The first of Bruce Schneier''s encryption algorithms. It uses a key length
    and is very secure. It is not patented so that anyone can use it without a license.

    Twofish—A stronger version of Blowfish using a 128- or 256-bit key and was a contender
    for AES. Used in Cryptcat and Open-PGP, among other places. It is also in the
    public domain without a patent.


    # Asymmetric Encryption


    Asymmetric cryptography uses different keys on the end of the communication channel.
    Asymmetric cryptography is extremely slow, about 1000 times slower than symmetric
    cryptography; therefore we do not wish to use it for bulk encryption or streaming
    communication. It will, however, solve the key exchange issue. Since we do not
    have to have the same key on both ends of communication, we do not have the dilemma
    of key exchange.


    Asymmetric cryptography is used primarily if we have two things unknown to each
    other to exchange a little bit of data, including a secret or other identifying
    data, like a certificate. It''s not used for streaming or bulk encryption because
    of its speed limitations.


    Some of the common asymmetric encryption schemes should be familiar with are:


    Diffie-Hellman—Many people in the field of cryptography regard the Diffie-Hellman
    key exchange to be the most significant development in cryptography (I would have
    to agree). Without going deep into the mathematics, Diffie and Hellman developed
    a way to generate keys without having to exchange the keys, thereby solving the
    critical exchange problem that plagues crucial asymmetric encryption.


    RSA—Rivest, Shamir, and Adleman is a scheme of asymmetric encryption that uses
    factorization of vast prime numbers as the relationship between the two keys.'
  - '[PAGE 107]


    # CONVERSATIONS IN CYBERSPACE 99


    PKI—Public essential infrastructure is the widely used asymmetric system for exchanging
    confidential information using a private key and a public key.

    ECC—Elliptic curve cryptography is becoming increasingly popular in mobile computing
    as it is efficient, requiring less computing power and energy consumption for
    the same level of security. ECC relies on the shared relationship of two functions
    being on the same elliptical curve.


    PGP—Pretty Good Privacy uses asymmetric encryption to assure the privacy and integrity
    of e-mail messages.


    # Hashes


    Hashes are one-way encryption. A password or message is encrypted in a manner
    it cannot be reversed or unencrypted. You may wonder, “What would good it do us
    to have something encrypted and not have the ability to decrypt it?” Fantastic
    question! After the message is encrypted it generates a “hash” that becomes a
    distinctive, but indecipherable signature to the underlying message. Every message
    is encrypted in a manner that it creates a unique hash. Ordinarily, these hashes
    are a fixed length (MD5 hash is always 32 characters). In this way, the attacker
    can decipher any information regarding the underlying message in the amount of
    the hash.


    For this reason, we need not to be aware of the original message; we must find
    out some text generates an identical hash to confirm its integrity. This is the
    reason hashes can be used to store passwords. The passwords are stored as hashes
    and then when someone attempts to log in; the system hashes the password and checks
    to determine if the hash created matches the hash that has been stored.


    Additionally, hashes are helpful for integrity checking, for example with file
    downloads or program files. In the realm of encryption and hashing, a “crash”
    is where two separate input texts create the same hash.


    To put it differently, the hash isn’t unique. This may be an issue we assume that
    all of the hashes are unique as in certification exchanges in SSL. NSA used this
    land of collisions from the Stuxnet malware to give what seemed to be a valid
    Microsoft certificate. Hash algorithms which make collisions, as you might guess,
    are flawed and insecure.'
  - '[PAGE 108]


    These are the hashes you should be familiar with.


    MD4—This was an old hash by Ron Rivest and has mostly been continued in use due
    to collisions.


    MD5—The most widely used hashing system. It''s 128-bit and produces a 32-character
    message digest.


    SHA1—Developed by the NSA, it is more secure than MD5. It has 160-bit digest which
    is usually rendered in 40-character hexadecimal. Usually used for certificate
    exchanges in SSL, but because of recently discovered flaws, is being deprecated
    for that purpose.


    # Wireless


    Wireless cryptography has been a favorite of Null Byte readers as so many are
    here trying to crack wireless access points. As you might guess, wireless cryptography
    is symmetric (for speed), and as all symmetric cryptography, key exchange is critical.


    WEP—This was the original encryption scheme for wireless and was quickly discovered
    to be flawed. It used RC4, but because of the small key size (24-bit), it repeated
    the IV about every 5,000 packets enabling easy cracking on a busy network.


    WPA—This was a quick fix for the flaws of WEP, adding a larger key and TKIP to
    make it slightly more difficult to crack.


    WPA2-PSK—This was the first of the more secure wireless encryption schemes. It
    then salts the hashes with the AP name or SSID. The hash is exchanged during authentication
    in a four-way handshake between the client and AP.


    WPA2-Enterprise—This wireless encryption is one of the most secure. It uses a
    128-bit key, AES, and a remote authentication server (RADIUS).


    In the realm of cryptography, size does matter! Generally speaking, the bigger
    the key, the more secure the encryption. This means that AES using a 256-bit key
    is stronger than AES having a 128-bit key and probably will be more challenging
    to break. Within the same encryption algorithm, the'
  - '[PAGE 109]


    # CONVERSATIONS IN CYBERSPACE 101


    bigger the key, the stronger the encryption. It doesn''t necessarily indicate
    that bigger keys imply stronger encryption involving encryption algorithms. Between
    algorithms, the strength of the encryption depends on both the particulars of
    the algorithm and the critical dimensions.


    Encryption algorithms are based on the transformation and permutation of information.
    The classic case of transformation from substitution is the Caesar cypher and
    its descendant, Vigenere. For instance, we could have the next sentence.


    The quick brown fox jumped over the lazy dog.


    This sentence can be encrypted with a Caesar cypher with a key of "b..."...


    VJKS WKEM DTQY PHQZ LWOR GFXQ GTVJ KNCB AFQI


    Note that the letters have been incremented by two and the formatting removed.
    Vigenere works similarly, but instead of one letter or number key, it uses several
    letters and numbers. For example, the same sentence is now encrypted with the
    keyword "Disney"...


    XQE ZHGT UFTV ROHL OTQY XRTU IAMV JKEI LRT


    We could use a transposition cypher. A transposition cipher doesn''t alter the
    letter''s distributions. Instead, it merely scrambles their purchase. A rail fence
    cipher is among the most famous of the easy transpositions. First, you choose
    the sentence you would like to encode and write it in staggered formations like
    this...


    ```

    teucbonojmeoeteayo

    hqiqrwfxupdvrhlzdg

    ```


    Then, copy the following row:


    TEUC BONO JMEO ETEA YOHQ IKRW FXUP DVRH LZDG


    In each case, the sentence is encoded. What if someone wishes to read it enough
    to try and break it?'
