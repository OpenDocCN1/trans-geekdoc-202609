    # Q. How do you detect malware incidents at these NGOs?


    +   A. The CyberSAR project has deployed 20+ Zeroint installations (a SaaS solutions
    that apply an intelligence-led approach and security heuristics to actively defend
    the enterprise against advanced cyber threats—including malware and ransomware—inside
    the perimeter, and out in the cloud) at NGOs in Central Asia, and is planning
    to deploy further instances at other NGOs and media entities in Caucasus and Eastern
    Europe.

    Zeropoint is a SecDev Group-developed passive DNS system that detects digital
    threats including malware. Using Zeropoint can see active malware connections
    on the NGO’s networks and halt its communication with its command and control
    infrastructure.


    # Q. Tell me more about your big data methods?


    +   A. Well, using the data Zeropoint collects we are performing a quasiexperiment
    to measure the efficacy of the CyberSAR intervention using a robust methodology
    that applies time series analysis to DNS requests to track post-intervention digital
    behavioral change in a sample of the beneficiary organizations. At the suggestion
    of my main supervisor, and deputy director of the training centre at Oxford, Dr.
    Joss Wright, the methodology draws on best practices from epidemiology studies
    and public health interventions. The hypothesis underlying the experiment is that
    the CyberSAR intervention strengthens the overall digital security posture of
    the NGOs, as measured by number of malware attacks intercepted by Zeropoint, the
    cloud-based DNS firewall installed on the NGOs networks.

