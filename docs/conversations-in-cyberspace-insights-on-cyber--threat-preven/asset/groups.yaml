    # THE BUSINESS EXPERT DIGITAL LIBRARIES


    # Conversations in Cyberspace


    # Giulio D’Agostino


    # EBOOKS FOR BUSINESS STUDENTS


    Curriculum-oriented, born-digital books for advanced business students, written
    by academic leaders who translate real-world business experience into course readings
    and reference materials for students expecting to tackle management and leadership
    challenges during their careers.


    Conversations in Cyberspace is a collection of insights on the current state of
    security and privacy in the Internet world. The book contains a brief introduction
    to some of the most used open-source intelligence (OSINT) tools and a series of
    interviews with some of the key figures in industrial control systems (ICS), advanced
    persistent threat (APT) and online/deep web members organizations.


    It aims to introduce to the relationships between security, OSINT and the vast
    and complex world hiding in the deep web. The information provided will be beneficial
    to security professionals and system administrators interested in exploring today''s
    concerns in database design, privacy and security-by-design, and deep web members
    organizations, Cicada 3301, the Unknowns, Anonymous, and more.


    # POLICIES BUILT BY LIBRARIES


    +   - Unlimited simultaneous usage

    - Unrestricted downloading and printing

    - Perpetual access for a one-time fee

    - No platform or maintenance fees

    - Free MARC records to execute

    - No license to execute


    Giulio D’Agostino is a system administrator, author, and technologist with more
    than 20 years of experience in the cloud computing, software as a service, and
    publishing. Previously worked for Google, Apple, Hewlett Packard, and Salesforce.com.
    Giulio has lectured the Technical University of Denmark-DTU, Web Summit 2016/2017
    and is currently the system administrator for the software as a service and cloud-based
    provider company LogMeInc.


    The Digital Libraries are comprehensive, cost-effective way to deliver practical
    treatments of important business issues to every student and faculty member.


