    operating out of China, and penetrating the United Nations, NATO, governments,
    diplomatic missions, and civil society computers all the world. Greg is a Fellow
    at the SecDev Foundation, having formerly been the SecDev Fellow at the Citizen
    Lab based at the Munk Centre, University of Toronto, and is a graduate of the
    Department of Peace Studies, University of Bradford (International Relations and
    Security Studies).


    During May 2018 I had the chance to meet Gregory at Trinity College in Dublin,
    Ireland. We had a brief chat about the current state of Tibetan NGO, Dharamsala
    and the ShadowNet investigations. Here, is the transcript of the conversation
    we kept over e-mail during the month following our meeting in Dublin.


    Q. You are researching malware in Central Asian NGOs with the SecDev Foundation,
    can you tell me a bit about SecDev and provide an overview of the “CyberSAR” project?


    A. The SecDev Foundation is a not-for-profit “think-do tank” that works to promote
    digital safety and opportunity for civil society globally.


    The Foundation directly executes programming in support of CSOs, women, youth
    and vulnerable groups in Eurasia, Middle East and North Africa, and Southeast
    Asia.


    The CyberSAR project is one of these efforts. Interestingly, the technical research
    component of the CyberSAR project draws on cross-disciplinary methodologies first
    developed at the University of Cambridge by the Advanced Network Research Group.
    Founded just six months after the tragic events of 9/11, ANRG was a response to
    the demands to find an answer to the compelling need for new ways to address the
    instability and uncertainties that characterize the current climate of global
    insecurity.


    The ANRG conducted research into the nexus between technical and social networks,
    and their consequences for global security, politics, development, and conflict
    transformation. ANRG projects shared a common methodology, which blended the use
    of technical methods for interrogating and mapping networks, while developing
    a proven expertise in contextual, in-field ethnography.


    In 2006, the ANRG moved to Canada and became the SecDev Group, a digital risk
    consultancy. I worked with the SecDev Group at the Citizen Lab in 2008 where we
    uncovered a base espionage network operating out of a signals intelligence base
    in southern China that had infiltrated machines in the United Nations, NATO, government
    departments, diplomatic missions, and civil society around the world.


    In 2011, SecDev Group co-founders Rafal Rohozinski and Deirdre Collings established
    the SecDev Foundation as an independent not-for-profit organization.


    ## Q. and the “CyberSAR project”?


    A. Right...well, CyberSAR is typical of the Foundation’s programming, and based
    on work in Syria, recently commended by the British Council (A new report from
    British Council and Build Up consider peacetech initiatives responding to the
    Syrian crisis as well as options for future work using technology for peace building
    and development).


    The research focused on three key areas:


    - 1. Mapping existing peatech responses to the Syrian crisis

    - 2. Identifying key areas of British Council peacebuilding and development work
    where greater utilization of technology could enhance impact

    - 3. Defining the different roles the British Council could play in this space
    and recommending a variety of strategies for future British Council investment
    in peace tech programmes.

    - 4. CyberSAR is short for Cyber Security Assessment and Response project. CyberSAR
    is a multi-year effort that offers digital safety research and support for NGOs
    and media across the Eurasia region. CyberSAR strives to measurably reduce the
    cyber vulnerabilities of selected organizations through a combination of security
    assessments, real-time remediation of threats and risks to communication devices,
    extended training, and internal policy development. The CyberSAR project includes
    a research component that measures the efficacy of the intervention and seeks
    to understand and map the malware ecosystem in the post-Soviet space, that’s where
    my work comes in.


    Q. Are you doing this research while you complete your PhD at Oxford?


    A. Yes, one of the most innovative features of Oxford’s Cyber Security CDT programme
    is the emphasis placed on working with industry partners to tackle real world
    security problems.


    From the first year onwards, I worked with organizations in industry and the civil
    society such as iSIGHT Partners (subsequently acquired by FireEye), and the others
    on “wicked problems” in digital security, as diverse as tracking Advanced Persistent
    Threats from the PRC and Russia, predictive policing surveillance platforms in
    Xinjiang, Marxist complex systems engineering methodologies and governance in
    China.


    Each of these engagements contributed to my understanding of the targeted digital
    threats civil society organizations face when they connect to the Internet, how
    they adapt to those threats, and provided quantitative and ethnographic data that
    informs my central Phil thesis on the cyber security practices of NGOs: “Digital
    Insecurity in Context”


    ## Q. How do you detect malware incidents at these NGOs?


    A. The CyberSAR project has deployed 20+ Zeroint installations (a SaaS solutions
    that apply an intelligence-led approach and security heuristics to actively defend
    the enterprise against advanced cyber threats—including malware and ransomware—inside
    the perimeter, and out in the cloud) at NGOs in Central Asia, and is planning
    to deploy further instances at other NGOs and media entities in Caucasus and Eastern
    Europe.

    Zeropoint is a SecDev Group-developed passive DNS system that detects digital
    threats including malware. Using Zeropoint can see active malware connections
    on the NGO’s networks and halt its communication with its command and control
    infrastructure.


    ## Q. Tell me more about your big data methods?


    A. Well, using the data Zeropoint collects we are performing a quasiexperiment
    to measure the efficacy of the CyberSAR intervention using a robust methodology
    that applies time series analysis to DNS requests to track post-intervention digital
    behavioral change in a sample of the beneficiary organizations. At the suggestion
    of my main supervisor, and deputy director of the training centre at Oxford, Dr.
    Joss Wright, the methodology draws on best practices from epidemiology studies
    and public health interventions. The hypothesis underlying the experiment is that
    the CyberSAR intervention strengthens the overall digital security posture of
    the NGOs, as measured by number of malware attacks intercepted by Zeropoint, the
    cloud-based DNS firewall installed on the NGOs networks.

