    # 网络空间中的对话


    ……了。这是一种让停电持续一小时的能力，但它正处于可扩展性与破坏性之间的那个平衡点。当你考虑到越复杂的系统（比如非常复杂的电网），系统越复杂，可靠地攻击所需的资源就越多，你想要产生的影响就越大。也许是让停电持续几天而不是几小时。你投入的资源越多，你想产生的影响就越大，而停电时间越长也意味着其可扩展性越低。我开发了一种扩散到整个电网的能力。我可以获得一小时的停电，但如果我开发的一种能力，它将是破坏设备并像
    Stuxnet 那样摧毁一个设施。它只会在纳坦兹（Natanz）起。我确定，这些经验法则在多年后将会演变。然而，作为一个普遍的差异，可扩展性越高，影响力就越大；可扩展性、影响力越大，所需的资源也越多。


    如果我愿意，我想象这里有一个隐形的旋钮，从 1 到 10，如果我在可扩展性这一块调到 10，将需要我指数级的资源来实现。我还希望这种中断和影响持续时间迅速上升。如果它是可扩展的，那会更加困难。简而言之，可扩展性越高，破坏性越小；可扩展性越高，影响力越大，你可以尝试增加它，但这需要大量的资源。因此，这种关于电力线、油气管道、汽油所有这些东西都会迅速崩溃的想法，以及通过亚马逊之类的说法，完全是误导性的。


    我们面临着真实的威胁和真正的担忧。我们必须严肃对待，但我们应该有一些细微的差别。我们看到的很多情况是对手访问了工业控制系统（ICS），这听起来很可怕。但这只有
    20% 的精力——获取访问权限并不是难点，而是综合所有这些数据并知道如何处理它们，以便对 ICS 进行可靠的、可扩展的攻击。我看到四个模块中的一个崩溃了，好了。刚才显示的示例
    ICF 是给你们准备的。发生的是，一个通过 HDMI 与你通信的负载，这是一种控制断路器的物理基础设施。只需打开断路器，所以实际上，整个攻击只是通过发送合法的命令来打开断路器，利用了系统的漏洞。再次，


