    # ICS


    # 工业控制系统恶意软件简史


    ## 2010: Stuxnet


    分析首批受 Stuxnet 影响组织的专业活动，可以让我们更好地了解整个行动是如何规划的。归结底，这是一个供应链攻击向量的案例，恶意软件通过目标组织可能合作的合作伙伴网络间接输送给目标组织。


    > —Alexander Gostev (卡巴斯基)


    在检查了两年内收集的 2000 多个 Stuxnet 文件后，卡巴斯基识别出了 Foolad Technic Engineering Co.、Beh Pajoh
    Co. Elec and Comp. Engineering、Neda Industrial Group、Control-Gastar Jahed Company
    以及 Kala Electric (Kalaye Electric Co.) 等组织。


    Stuxnet 是第一个专门针对 SCADA 系统和可编程逻辑控制器（PLC）的恶意软件。它是破坏伊朗核计划的主要罪后祸首，而且可能是“恶意软件通过目标组织可能合作的合作伙伴网络间接输送给目标组织”的最典型案例。


    卡巴斯基全球研究与分析小组（GReAT）将 Stuxnet 标记为长崎和广岛原子攻击的数字对应物。由于设计缺陷和漏洞，Stuxnet 开始像病毒一样运行并在互联网上传播，感染了除最初指定为攻击目标的系统外的十万多个系统。


    自 2010 年春天开始受到媒体关注以来，Stuxnet 的起源一直是推测的话题。


    根据《纽约时报》2012 年发表的一篇文章，引用匿名来源的话，西方政府参与了协助针对伊朗的网络攻击。《纽约时报》报道道，该行动涉及国家安全局（NSA）和一个被称为“8200
    部队”的未公开以色列军事单位。


    Stuxnet 主要设计用于破坏核设施用于数据采集的软件，其目标是变频器。Stuxnet 的目标是破坏负责电机供电的控制系统。


    Stuxnet 利用针对微软产品的零日漏洞来感染计算机。


    ## 2013: Havex


    Havex 远程访问工具（简称 RAT）被与名为“能量熊”（Energetic Bear）的俄罗斯小组联系在一起。在 2014 年春天，安全公司 F-Secure
    涵盖了一系列针对工业控制系统的攻击后将其识别出来，而 Havex RAT 家族已经在网络安全公司 CrowdStrike 的 2013 年《全球威胁报告》中出现。


    被木马化的软件被植入黑黑客的 ICS/SCADA 网站中：已识别出超过 80 种 RAT 变体和 140 多个命令与控制服务器（C&C）负责非法数据获取操作。


    F-Secure 分析了 Havex 组件，并发现了一些标准，为基于 Windows 的软件提供了链接桥接，以便在受感染的设备上收集数据和敏感信息，并通过对象链接与嵌入（OLE）过程控制（OPC）将其传回
    C&C 服务器。


    Havex 可以描述为一组用于针对 ICS 环境间谍行动的远程访问木马家族。它首先在受感染的网络上对 SCADA 或 ICS 设备进行扫描，并将信息传回给攻击者。Haex
    情报提取工具的核心任务不是破坏或损坏工业系统。


    ## 2014: BlackEnergy


    BlackEnergy 恶意软件是犯罪软件转变为 APT（高级持续性威胁）工具，被用于多年来少有记载的重大地缘政治行动。


    > —Kurt Baumgartner 和 Maria Garnaeva (卡巴斯基)


    2013 年在 BlackEnergy 配置文件中检测到的异常导致了一个 BlackEnergy CnC（命令与控制）服务器上的异常活动。起初，BlackEnergy
    的插件被用于分布式拒绝服务攻击（DDoS）。Sandworm 团队是早期采用该软件的团队之一，随后用于涉及 APT 工具的多次地缘政治行动。


    一系列研究得出结论，Sandworm 将其非 Windows 工具放在不同的服务器和文件夹中以保护服务器。


    某些 Windows 插件包括：


    - “Fs”搜索特定的文件类型

    - “Rd”远程桌面访问

    - “Dstr”用随机数据覆盖硬盘


    在收集了长时间的插件后，研究人员将这些攻击指向俄罗斯、波兰和乌克兰。


    ## 2014–2015: BlackEnergy 2


    BlackEnergy 2 是现有恶意软件 BlackEnergy 的变体，旨在针对通用电气（General Electric）、西门子（Siemens）、安勤/Broadwind
    以及其他其他供应商的 HMI（人机界面）软件。BlackEnergy 2 以因 2015 年导致乌克兰电网崩溃的攻击而闻名。


    ## 2016: Industroyer/Crash Override


    以2016 年冬季对乌克兰变电站的攻击而闻名


    现实场景将涉及对多个站点的协调攻击，使断路器开启和关闭直到变电站离线。Industroyer/CrashOverride 由组件组成：


    - 一个允许攻击者在受感染系统上执行命令的后门。它通过 Tor 网络通过命令与控制（C&C）服务器启动基于时间的通信。

    - 一个启动器。

    - 一个清除注册表的擦除器。


    对能源领域技术的深入了解表明，恶意软件的一些开发者可能与运行电网运营和工业网络通信的公司有关或曾工作过。


    ## 2017: Triton


    Triton 家族由主模块 trilog.exe（利用 libraries.zip 的执行文件）和 library.zip（用于与 Triconex 控制器交互的自定义通信库）组成。Triton
    可用于修改 Triconex 安全仪表系统（SIS，独立监控过程状态的自主控制系统）控制器的分配内存，导致控制器无法运行，增加故障概率。


    一些现实场景包括使用 SIS 停止过程（例如触发虚假警报）、重新编写 SIS（重新设计逻辑以允许影响设备和人类安全的不安全状态发生）以及使用分布式控制系统制造危害。


    ICS 恶意软件如何攻击。


    - 可能使用远程连接渗透工业网络

    - 进入网络后， 攻击者可以扫描网络以识别 ICS 设备

    - 由于 ICS 网络不使用身份验证或加密，攻击者可以访问任何系统——包括操作员或工程师工作站、HMI、Windows 服务器或控制器（PLC、RTU 或
    DCS 控制器）以进行识别


