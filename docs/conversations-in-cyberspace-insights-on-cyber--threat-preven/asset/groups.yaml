    # Basic Cryptanalysis and Theory


    Information isn''t the letters nor the collections of pieces. The information
    is that the patterns these letters and pieces make. Cryptanalysis is all about
    trying to find patterns that may give clues to what the key is (or what the key
    is not).


    In nature, a cryptanalyst is seeking information from a set of data that''s been
    encrypted, or meta information having to do with the encrypted data. Much of this
    is from the scope of this guide, but I will likely cover it later.


    Before I discuss the concept behind the power of encryption algorithms, I will
    first use an illustration. Look at my example using the Caesar cypher. Suppose
    the attacker (often named Oscar in many cases) understood that the words were
    encoded using a Caesar cypher. He might attempt to brute force the answer by imagining
    loads of decryption keys.


    ```

    “a” uifr vjdl scop opgy kvnp fswsi fmba zeph

    “b” theq uick brnof jump end erath ydog

    “c” sgdp thbj aqnv metlo dtlc dqsq dkky xcnf

    ...

    ```


    The Caesar cypher is very vulnerable to some brute-force attack as it has a tiny
    key space. An integral part is the range of possible keys, usually represented
    by a capital K, subscript l, to denote the number of values a piece'' of this
    key could hold, and a superscript n to represent the number of pieces each key.
    Frequent values for l are 2, 10, and 26. In the event of the Caesar cypher, its
    key space is K sub 26, which is equivalent to 26. That amount is small enough
    that Caesar can be brute forced by hand with no computer.


    Other methods to gather information regarding the key are to examine patterns
    in the letters by counting the number of occurrences of individual letters and
    bigrams. Most languages have basic patterns which are conserved through the encryption
    procedure. Indeed there are lots of ways to discover patterns, but for this guide,
    the main thing to consider isn''t the how, but how this is true.'
