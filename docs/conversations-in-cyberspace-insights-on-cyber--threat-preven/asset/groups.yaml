    Grams 位于 http://grams7enuf7jmdl.onion。一位爱好者将 Grams 解释为“暗网上的谷歌”。在 2014 年的一次采访中，Grams
    的系统管理员表示，Grams 利用了一种专利搜索技术，该技术可以显示来自电子商务网站以及其他类型暗网网站的结果。


    用户可以将网站添加到 Grams 系统中进行索引并纳入系统。


