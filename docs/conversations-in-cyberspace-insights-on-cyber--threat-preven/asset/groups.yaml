    # Atlayo


    # A Conversation with Mr. Security


    This chapter is the result of a random e-mail I have received on my Tor2Box account
    after posting the following comment on the dark web social network Atlayo (at
    the time, accessible both on the deep and clear net):


    > Looking for white, grey, red or black hats to interview on topics of privacy,
    security and deep web for my upcoming book. DM me or e-mail for details. PGP details
    below.


    The e-mail (sent from "Mr@TheUnknowns.xyz") was signed by a user called "Security."
    Up until then, I was not sure about the link between "Security@TheUnknowns.xyz"
    and the ethical hacking group "The Unknowns," which came to attention in 2012
    after a series of cyber attacks to NASA, CIA, White House, the European Space
    Agency, Harvard University, and several ministries of defence. The whole content
    of the e-mail is centred on the Podesta Case, and the techniques used during the
    infamous spear-phishing attack initially attribute to cyber espionage group Fancy
    Bear (also known as APT28, Pawn Storm, Sofacy Group, Sednit and STRONTIUM).

