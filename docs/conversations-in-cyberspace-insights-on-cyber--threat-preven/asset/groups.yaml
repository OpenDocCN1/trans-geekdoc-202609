    of the late middle ages, when the Church forced philosophy and alchemy underground.
    For example, books written during the period of Inquisitions.


    I also enjoy Ralph Vonnegut, Orson Welles and also enjoy the works of Philip K.
    Dick.


    - Other books I might have mentioned as sort of inspiration for Cicada 3301 are
    the Book of Enoch by John Dee and Simulacra and Simulation by Jean Baudrillard.
    Do you think the common pattern between these books is to find freedom by transcending
    reality? Do you think there is a common pattern?


    - I do.


    - You mentioned John Dee and Edward Kelley and Kelly, also known as Edward Talbot,
    who we don’t know a lot about, supposedly purchased several magic books and helped
    John Dee in rituals and esoteric works. If we take Dee''s works, for example “Monas
    Hieroglyphica,” those books are about “incantations.” Incantations with a common
    goal, which is enlightenment.


    - I read a lot about awakening: we have lost touch with Mother Nature. We need
    to embrace the path to allow us bypass our blockages.


    - You mentioned about a “block.” Some people have speculated we have blocks wired
    in our genetic code. The ancient Sumerian myth of Enuma Elish, inscribed in cuneiform
    tablets, the legendary Anunaki, the Sumerian deities, whom genuinely altered the
    human race with a pre-programmed block to limit the “human hybrid” access ESP
    and SSP perception. A similar link is present in the “original sin” in the Bible
    and in many Eastern philosophies where enlightenment can only be achieved by breaking
    through an “invisible veil.” Do you think the work of Cicada 3301 would allow
    people to bypass this block, or do you think there is no block at all?


    A. I do think there is a block. I also think that the information to access solution
    to bypass those blockages is freely available around us but we need to be open
    to “see it.” There is a pilgrimage in seeking enlightenment. When you first find
    truth, it troubles and vexes you, until you realize the same truth dormant inside
    of you for longer than you realize.


    Q. It comes to the mind the work of two very different scientists: Richard Dawkins
    and Rupert Sheldrake. Dawkins fascination with the study of how cultural information
    spreads (who coined the name “meme” to describe a unit of information residing
    in the brain and that mutates and replicates in human cultural evolution) and
    Sheldrake'' concept of “morphogenetic fields” (the phenomenon where a group of
    cells able to respond to discrete, localized biochemical signals leading to the
    development of specific morphological structures or organs.) when studying the
    evidence that as and more people learn or do something it becomes easier for others
    to learn or do. Both concepts mention the universal law of feedback.


    Do you think forms of communications and cultural growth via “memes” or through
    “resonance” are blocked or badly influenced by the human ego? I have noticed several
    mentions to “ego-death” in relation to Cicada 3301 online. What is yours in relation
    to “transcend the ego”? Should we transcend our own egos?


    A hundred percent yes. Although transcend the ego is only possible temporally.
    Ego is a component of survival; however, ego is what all institutions use against
    you by both appealing to it and crushing it when they find it necessary.


    Think of propaganda and prison. Both speak to ego no?


    Q. What is the current stage of Cicada? Will we see more puzzles or will you focus
    on open education messages?


    A. There will be more challenges.


    # CONVERSATIONS IN CYBERSPACE


    Q. During July 2015 a group called themselves “3301” and claimed to have hacked
    Planet Parenthood, creating confusion between the real Cicada 3301 and false actors.
    The use of PGP encrypted messages also increased the confusion in relation to
    secrecy around Cicada 3301. Could you tell me more in relation to the misinformation
    around Cicada 3301?


    A. That was not the first time, we deny any relation to them.


    Q. We live in a time when technology is evolving faster than us, technology is
    directly influencing us in the way we communicate, think and behave. When people
    think technology they think about knowledge; considering the dichotomies between
    concepts like chaos and noise, knowledge and imagination ... how would you envision
    a time when people associate technology with imagination?


    A. If you take obesity in the first world, many people would blame food. They
    are not completely incorrect, food is one of the root causes, but also improper
    use of technology is in the list of causes.


    Technology and its results are meant to help us and somehow “augment our senses,”
    but if we do not know how to use technology we will have technology owning. We
    have grown obese in part because we sit and expect technology to do our jobs.


    Q. It seems that technology owns people, and we see it in the world places like
    Japan, people and technology are one thing. Do you think we will enter technological
    renaissance?


    A. I think that there will be new renissances. We believe that music transcends
    reality and allows to higher level. The world is made up of those who wish to
    control, we see this in different cultures, we see it in Native Americans, and
    so on, a fire.


    # CONVERSATIONS IN CYBERSPACE


    I do think we will have many renaissances ahead. The advent of technology brought
    a massive plague upon Europe and Asia. We see this in the infancy of us. I do
    not agree with claims humankind is fully evolved, I think that humans will constantly
    evolve through time, we might have to figure out to manage AI and when it would
    get close to resemble biological organisms. AI will bite the hand that feeds it.


    Q. How important is the music aspect in the Cicada 3301 language? The language
