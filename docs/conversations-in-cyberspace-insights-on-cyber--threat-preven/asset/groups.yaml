    # 网络空间中的 112 场对话


    在你看来，改进暗网（DW）中已有的技术（如搜索引擎、托管和通用通信）的一些关键特征有哪些？


    我不希望看到的是一个强大的、集中的、拥有大量算法和跟踪功能的暗网中心化搜索引擎。我希望看到的是一个改进后的目录系统，它可以让关键词搜索变得更容易，并且不会挖掘数据来寻找模式和相关性。像
    Google 这样的公司在提供易用搜索引擎方面做得非常出色，但我选择使用 Startpage 或 DuckDuckGo，因为对我来说，隐私比那些稍微好一点的搜索结果更重要。Google
    并不是唯一这么做的公司，但他们无疑是最大的者之一。我注意到，当涉及到网络世界时，“战斗或逃跑”反应几乎不存在（通常是因为用户对技术缺乏意识或缺乏理解），但如果你的脑海中闪过“我想知道他们用我的数据做了什么”这个念头，那么在我看来，你应该去研究一下。


    关于托管，我认为应该有更多免费的托管服务。我认识几个人想过做这件事，也包括我在内。我现在没有多少钱，一个穷学生，但等我有钱了，我觉得这是一个回馈这个社区的好方法。这会让人们更容易拥有自己的隐藏服务，而不需要太多的行政开销或过多的经验。当然，会有某些我不会允许的类型的内容（例如虐待儿童或恋物癖），但在大多数情况下，它将是完全不受审查的。


    在我的看来，通信目前并不是一个问题。进行通信以及寻找安全的方法并不困难。人们对加密和身份验证的重要性接受的教育越多，每个人就会越安全。我喜欢 Tor，因为它带你回到了了更早期的时代，那里有更少的自动化、更少的
    JavaScript 和更多的简单。它像是一股老派但又具有未来感的清风，远离了明网（clearnet）的混乱，我希望它一直保持下去。


    感谢这些有趣的问题，其中一些确实引发了我的思考。以前没有人问过我那个关于活动主义的问题，所以这非常酷。如果你想让我对我的任何回答进行澄清，请告诉我，我等不及要看到你的书了！
    :)


    诚诚地，

    -A1d3n


    嘿，

    是的，我愿意。你认为使用网桥（bridges）或 VPN 来隐藏对 Tor 的使用怎么样？我认为应该更多地实施安全隔离！我之前不知道 KIST 算法和 onioniprobe
    项目，所以这非常酷。很高兴看到扩展 Tor 项目途径而所做的工作。


    在我看来，大规模采用 Tor 将绝非易事。当我遇到使用 Tor 的新用户时，他们往往对这个地方有先入为主的想法。他们通常来自 YouTube 的世界，那里充满了关于暗网的“都市传说”（通常涉及他和红房间），并且他们信了许多神话。我同意，对这以及
