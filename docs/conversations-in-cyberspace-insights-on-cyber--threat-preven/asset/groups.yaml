    a second group in which the intervention has not yet taken place. Analysis of
    results will be based on a comparison interrupted time series (C/ITS) analysis
    of DNS traffic to measure the volume of detected anomalies associated with known
    or unknown cyber threat behaviors in the treatment and control groups. Interrupted
    time series (ITS) analysis is a “quasi-experimental” design with to evaluate the
    longitudinal effects of interventions through regression modeling, where randomization
    is not an available option.


    This project adds a control group to an ITS design to produce a C/ITS analysis.
    This approach is important in real-world evaluations, as the quasi-experiment
    is taking place in a complex and dynamic socio-technical environment where a range
    of time-varying confounders will be either unmeasured or unknown. Furthermore,
    we use a multiple baseline design where the intervention happens at different
    field sites at different times.


    Q. What results have you found?


    +   A. Actually, the experiment is ongoing, with data collection underway at a
    number of Central Asian fieldsites.


    +   Reports focusing on the experimental design of the project, and early findings
    from the process of designing and running the experiment, have been shared with
    trusted partners, and a paper submitted to an academic workshop focused on the
    cybersecurity of civil society organizations, where we highlight several challenges
    and considerations in designing and evaluating real-world cyber security interventions.


    Q. You mentioned that you have borrowed methods from public health interventions.
    Is that an approach that you think has value for other cybersecurity problems?


