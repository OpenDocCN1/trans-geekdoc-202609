    Q. I have recently had a quick exchange of e-mails with Joseph Cox

    (Journalist, VICE and Motherboard Contributor) on the nature of

    Deep Web, Dark Net and also law enforcement tracking measures.

    What are your observations on the following definitions?


    > The deep web is all content that is not indexed by search engines;

    so closed databases, e-mail inboxes, whatever it may be.

    dark web is the small, almost tiny, collection of sites and services

    hosted via anonymity networks, such as Tor.


    +   - I agree with Joseph definition. The deep web is its web pages that

    are not indexed by search engines. So when you go to Google, and

    type in a search query, all the usual websites pop up or have

    the ability to pop up in that organic search. Now, if you are

    searching for whatever it is a Web site pop up there with the

    deep web is all of the web pages that are out there on the

    Internet that for whatever reason are not indexed by the search

    engine. So, if you searched they not show up in Google, they

    would not show up and be would not show up on Yahoo or

    AltaVista or whatever else. That is all the deep web the deep web

    are the web pages that are not indexed by search engines.


    +   - Search engines index all web pages. So what are they trying to

    hide that circumstances do not index them? Well in the modern era

    y know 2013 and so forth. Many Web pages are not indexed by

    search engines such as Google and Yahoo. Because they are behind

    login walls.'
