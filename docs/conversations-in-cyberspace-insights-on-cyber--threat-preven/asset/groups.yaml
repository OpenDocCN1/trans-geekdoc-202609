    Up until then, I was not sure about the link between "Security@TheUnknowns.xyz"
    and the ethical hacking group "The Unknowns," which came to attention in 2012
    after a series of cyber attacks to NASA, CIA, White House, the European Space
    Agency, Harvard University, and several ministries of defence. The whole content
    of the e-mail is centred on the Podesta Case, and the techniques used during the
