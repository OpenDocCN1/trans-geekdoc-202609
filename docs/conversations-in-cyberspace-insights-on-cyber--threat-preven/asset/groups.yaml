    # 网络空间中的对话 93


    来自非 Google 地址的邮件可能会被拦截。Fancy Bear（野性熊）小组可能已经进行过这种实验；当一个奇特的字符失效时，有许多其他人员可以切换，以尝试新的方法绕过过滤器并钩住受害者。然而，由于黑客的目标不仅是民主党国家委员会（DNC），还包括竞选小组，他们也被观测到了。Bitly
    允许用户设置账户，以便通过其链接跟踪点击次数。然而，此外，它允许任何人监控有多少人点击了链接，最初的 URL 到底是什么，以及该考虑还为哪些额外的 URL
    生成了短链接。SecureWorks 成功识别了精确由该团队建立的建立的大部分连接。


    “有人在使用你的密码”部分是白色文字显示在绝望的背景上；方框内的“更改密码”链接。尽管 URL 发生了变化，但设计是一致的。根据美联社对 Fancy Bear
    在 2015 年 10 月至 2016 年 5 月期间涉及的 19,000 多个恶意链接的调查，初始小组在 3 月 10 日向大量个人发送了邮件，似乎他们曾为
    2008 年克林顿竞选活动工作过。其中大多数尝试失败了：这并不意味着是否输入了凭据，但许多链接被点击了。在每个情况下，使用递送给波斯塔（Podesta）的钓鱼邮件，第一个
    URL 都是使用目标个人的电子邮件地址进行预编码的，这些细节将填充在虚假的登录页面中。第二天又进行了一轮攻击。然而，来自 hillaryclinton.com
    域名的邮件使用了 Google 的邮件系统并开启了双重身份验证（2FA），因此员工们理解关于有人使用他们密码的警告可能会被忽略。许多来自员工成员的尝试试图获取他们的密码信息。


    员工们注意这些持续的努力，他们的目标是 DNC。钓鱼尝试持续了整个 3 月并一直到 5 月，期间克林顿竞选活动和 DNC 有数十人成为目标，尽管后者已被黑入；分析师猜测当时上有两类任务，目标相同但操作分离。


    这种鱼叉式钓鱼攻击的目标范围负责旅行的员工。然而，竞选的安全是首要任务。只有 20 个链接被点击了；这本身并不意味着他们输入了资证。有些链接被点击了，这可能信号着某种感觉。


    我与竞选团队交谈的人坚称：他们已经意识到了钓鱼攻击，并且不会落入圈。然而，Fancy Bear 并没有将其钓鱼局限于基础小组。例如，它的邮件选择捕获了几个，在小组中。DNC
    选民保护总监普拉特·怀利（Pratt Wiley）在 2016 年 3 月至 2015 年 10 月之间被针对 15 次。在我交谈过的与活动工作密切的人中，波斯塔的账户在
    3 月的邮件之前可能就已经被破解；没有办法知道更早的钓鱼邮件是否出现在随后的数据泄露中。克林顿竞选活动成为目标并不意外。


    小组成员并没有对哪项特定的任务感到沮丧。尽管有许多员工。该小组的 IT 部门有四个人，没有专人负责该角色。从 2016 年 4 月开始，DNC 的几个人意识到它被入侵了，可能持续了一段时间；FBI
    警告了他们六个月，期间一直有针对其服务器的黑客攻击。5 月中旬，克林顿竞选工作人员采取了关键一步，告诉员工使用 Signal，一种端到端加密程序，该程序可以提供文本、视频和语音通话以恢复电话号码。它不保存任何内容，也能抵御伪装。


    员工被建议不要通过电子邮件讨论任何敏感内容；无论多么有争议，特别是涉及唐纳德·特朗普的内容，都需要通过 Signal 进行。6 月 10 日周五，DNC 管理层建议其
    100 多名员工上交他们的笔记本。尽管他们当时没有说明原因，但 Crowdstrike 证实了 DNC 服务器曾遭入侵，该公司在对黑客攻击的怀疑大到无法忽视后聘请了他们。Crowdstrike
    认为 Fancy Bear 实现了入侵，即 APT28（一个他们正在观测的与俄罗斯政府相关的团队），并且由另一个他们称为 Cozy Bear 的团队实施了更多攻击。


    Wikileaks 在……之前过了极好的一年……我们有一些关于希拉里·克林顿的邮件等待成书。回想起来，谈论甚至是波斯塔的邮件，或者是 DNC 的邮件？


    他担心从瑞典被引渡到美国受审。


    希拉里或她的愿景遭受的任何损害都由他限制。在发布后，邮件和 Wikileaks 一直受到关注。Crowdstrike 解释说有两个俄罗斯阶层破解了 .13。在
    24 小时内，一个被称为“Gucifer 2.0”的互联网人物向多个新闻网站交付了一些邮件和文件，并声称“就是我杀害了民主党国家委员会。”（标题的选择是一个趣的引用：第一个
    Guzifer 是一个罗马尼亚出租车司机，他曾于 2013 年和 2014 年杀害并倾倒了各种美国和罗马尼亚政客的邮件内容。他在 2016 年 5 月发牢了牢骚，并被引渡到了美国。他声称自己破解了希拉里·克林顿的服务器，但没有提供证据。那年的
    9 月，他被拘留了四十年多年。）


    Gucifer 2.0 建立了一个网站并声称，尽管 Crowdstrike 记录有“高级黑客阶层”破解了 DNC，但这并不困难，“Gucifer 可能是说出希拉里和其他民主党人邮件服务器的第一个。”


    然而，我们没有……


