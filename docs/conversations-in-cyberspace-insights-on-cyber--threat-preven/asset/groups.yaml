    “b” theq uick brnof jump end erath ydog

    “c” sgdp thbj aqnv metlo dtlc dqsq dkky xcnf

    ...

    ```


    凯撒密码非常容易受到暴力攻击，因为它的密钥空间很小。其中一个重要的组成部分是可能密钥的范围，通常用大字母 $K$ 的下标 $l$ 表示该密钥的某个片段可以持有的值的数量，并用上标
    $n$ 表示每个密钥的片段数量。$l$ 的常见值为 2、10 和 26。在凯撒密码的情况下，它的密钥空间是 $K_{26}$，等同于 26。这个数值小到不需要计算机，手工就能暴力破解凯撒密码。


    收集有关密钥信息的其他方法是通过统计单个字母和双字母组合（bigrams）的出现次数来检查字母中的模式。大多数语言都有在加密过程中保留的基础模式。诚然，发现模式的方法有很多，但对于本指南来说，考虑的重点不是“如何做”，而是“为什么真实的”。


    ## 替换置换网络 (Substitution-Permutation Networks)


    这是目前最流行的对称密码形式之一（Feistel 是另一种）。正如其名，这种密码同时使用替换和置换来将明文转换为密文。要理解它们的工作原理，你必须首先理解这些密码会将信息分成若干块。每个块由特定数量的字节组成，称为一个“字”（word）。例如，我将虚构一个包含替换段、置换段和白化段的
    SPN。假设我有一个十六进制代码：0xa258fe1b1，我将字大小定义为 4 个片段（1/2 字节），那么我会这样划分它……


    a 2 5 8 f e 1 b


    在替换阶段，我将所有人都加 3……


    D 5 8 B 2 4 E


    然后，我将通过将每个字右移，并将第二个字与第三个字、第四个与第五个字、以此类推，直到第八个换到第一个来置换信息。


    1 D E 8 2 B 4


    最后，我将取密钥（0x01234567）并与当前数据进行异或（XOR）。这种做法被称为白化（whitening）。


    1 C C 6 1 7 D 3


    这看起来可能是结果，但并不是！不。在现代的 SPNs 中，我们会在完成之前进行多次操作。Rijndael（即 AES）使用了更复杂的替换和置换组合，添加了一个为每个循环生成密钥的密钥器，并将密钥重复
    12 次！这些过程足够复杂且任意，密钥或明文的任何变化都会影响块中的每一个位。


    加密并不能为你做一切。但它确实可以做很多事情。例如，显然，加密可以用来保护信息安全。


    有了足够强的加密方案和足够强的密钥，即使是政府也无法破解加密。


    密码学每天、每小时、每秒（谢我那该死的英语老师！）都用于在线交易。你意识到每次在新网站购物时你的信用卡号都会被保存，对吧？没有公钥密码学，我们无法在有任何安全性的情况下进行在线购物。密码学还可以用于完整性保障。通过哈希算法（hashes），我们可以确定信息没有被篡改，因此它是真实的。

    '
