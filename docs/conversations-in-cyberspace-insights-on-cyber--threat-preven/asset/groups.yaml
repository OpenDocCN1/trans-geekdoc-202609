    # CHAPTER 2


    # Conversations in Cyberspace


    # A Conversation with Greg Walton


    A D.Phil. candidate at Oxford''s new Centre for Doctoral Training in Cyber Security,
    Greg Walton has recently joined the OII for his main research project. In the
    past Greg investigated complex adaptive threats targeting civil society networks,
    and worked extensively with Tibetan NGOs in the field in South Asia. Greg coordinated
    the primary field-based research for the GhostNet and the ShadowNet investigations
    in the Dalai Lama''s Office and the Tibetan Government-in-Exile in Dharamsala,
    India, where he worked with a team that uncovered global cyber espionage botnets
    operating out of China, and penetrating the United Nations, NATO, governments,
    diplomatic missions, and civil society computers all the world. Greg is a Fellow
    at the SecDev Foundation, having formerly been the SecDev Fellow at the Citizen
    Lab based at the Munk Centre, University of Toronto, and is a graduate of the
    Department of Peace Studies, University of Bradford (International Relations and
    Security Studies).


    During May 2018 I had the chance to meet Gregory at Trinity College in Dublin,
    Ireland. We had a brief chat about the current state of Tibetan NGO, Dharamsala
    and the ShadowNet investigations. Here, is the transcript of the conversation
    we kept over e-mail during the month following our meeting in Dublin.


    Q. You are researching malware in Central Asian NGOs with the SecDev Foundation,
    can you tell me a bit about SecDev and provide an overview of the “CyberSAR” project?


    A. The SecDev Foundation is a not-for-profit “think-do tank” that works to promote
    digital safety and opportunity for civil society globally.'
  - '[PAGE 28]


    The Foundation directly executes programming in support of CSOs, women, youth
    and vulnerable groups in Eurasia, Middle East and North Africa, and Southeast
    Asia.


    The CyberSAR project is one of these efforts. Interestingly, the technical research
    component of the CyberSAR project draws on cross-disciplinary methodologies first
    developed at the University of Cambridge by the Advanced Network Research Group.
    Foundeded just six months after the tragic events of 9/11, ANRG was a response
    to the demands to find an answer to the compelling need for new ways to address
    the instability and uncertainties that characterize the current climate of global
    insecurity.


    The ANRG conducted research into the nexus between technical and social networks,
    and their consequences for global security, politics, development, and conflict
    transformation. ANRG projects shared a common methodology, which blended the use
    of technical methods for interrogating and mapping networks, while developing
    a proven expertise in contextual, in-field ethnography.


    In 2006, the ANRG moved to Canada and became the SecDev Group, a digital risk
    consultancy. I worked with the SecDev Group at the Citizen Lab in 2008 where we
    uncovered a base espionage network operating out of a signals intelligence base
    in southern China that had infiltrated machines in the United Nations, NATO, government
    departments, diplomatic missions, and civil society around the world.


    In 2011, SecDev Group co-founders Rafal Rohozinski and Deirdre Collings established
    the SecDev Foundation as an independent not-for-profit organization.


    # Q. . and the “CyberSAR project”?


    A. Right...well, CyberSAR is typical of the Foundation’s programming, and based
    on work in Syria, recently commended by the British Council (A new report from
    British Council and Build Up consider peacetech initiatives responding to the
    Syrian crisis as well as options for future work using technology for peace building
    and development).'
