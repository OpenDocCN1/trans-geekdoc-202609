    网络空间对话 27


    问：我们现在可以转向中国的网络间谍活动吗，特别是针对西藏人的当前 APT 攻击活动？


    ## Galaxy9


    ### 与 DeadWarrior420 的对话


    问：我最近与 Joseph Cox（VICE 记者及 Motherboard 贡献者）就深网（Deep Web）、暗网（Dark Net）的性质以及法律执法部门的追踪措施进行了一次简短的邮件交流。你对以下定义有何观察？


    > 深网是指所有未被搜索引擎索引的内容；例如封闭的数据库、电子邮件收件箱等。暗网是指通过匿名网络（如 Tor）托管的规模很小、几乎是微小的网站和服务集合。


    - 我同意 Joseph 的定义。深网是指所有未被搜索引擎索引的网页。所以当你访问 Google 并输入搜索查询词时，所有常规网站都会弹出来，或者有能力在有机搜索中弹出来。现在，如果你在搜索某个东西，那里弹出的网站是深网之外的，深网就是互联网上由于某种原因未被搜索引擎索引的所有网页。所以，如果你搜索它们，它们不会显示在
    Google 上，不会显示在 Yahoo、AltaVista 或其他任何地方上。这就是整个深网；深网就是未被搜索引擎索引的网页。


    - 搜索引擎索引所有网页。那么它们试图隐藏什么，以至于某些情况下不索引它们呢？嗯，在现代，你知道，比如 2013 年等等。许多网页没有被 Google 和
    Yahoo 等搜索引擎索引，因为它们位于登录墙之后。


    ## 网络空间对话 29


    如果你访问一个网站，比方你访问一个 WordPress 站点或某个社区网站，并且你必须登录。访问该网站内容的唯一方法就是登录。现在，我们所有的搜索引擎都有这些运行的小型算法，它们要么是爬虫（spiders），要么是机器人（robots）。这些爬虫出去浏览网页。所以，基本上就是让它们自由活动。此外，这些爬虫和机器人出去后会发生什么？它们记录它们找到的所有网页。


    它们记录所有链接到其他网页的网页。然后它们会顺着线索过去，抓取信息并索引那里存在的所有不同网页。嗯，问题在于，想象它们正带着它们的索引移动。而且，它们正准备一个网站。然而，当它们到达该网站时，它要求用户名和密码。


    嗯，那个机器人无法通过，因为它不是真实用户，所以它没有用户名和密码。像 Facebook 这样的网站被直接视为深网，因为 Google 不索引它们。现在正在发生一场激烈的争论，Google
    说它们应该能够索引更多的 Facebook 内容，而 Facebook 允许它们访问整个庞大的系统。


    然而，你需要理解的是，Facebook 内部有许多页面无法被 Google 或任何其他人索引。因此，那些会被认为是深网。如果你建立了一个社区网站，比方你把它封闭起来，这样它是私有的，只有私有成员才能访问信息。所以你设置了一个公告板，但你不希望它是公开的，你只想让你的用户能够访问。


    当来自 Google 或 Yahoo 的这些爬虫之一去扫描你的网页时，情况也是一样。它们会被用户名和密码阻挡，这就是为什么那里有很多深网网页的第一个原因——你需要登录凭据。这是另一个原因，即你可以通过代码要求这些搜索引擎由于某种原因不索引你的网页。所以有一个叫作
    `robots.txt` 的文件。你把它放在你网站的根目录下。基本上就在你索引 T.M.（可能指索引.txt）、邮件或任何东西的相同地方，你放一个叫作 `robots.txt`
    的文件，你可以要求这些搜索引擎不要索引你。


    你知道，我们中的很多人并不担心把信息发布到互联网上，但我们不想做得过头。对吧。所以假设你有一个俱乐部或一个组织，你想要能够把一些东西发布到网上。比方董事会成员的名字。如果其他成员需要联系某人，或者有人需要查看董事会成员的列表，你希望这些内容在网上输出。所以这是你那种不在乎公众是否看到的事情之一，但另一方面，你并不非要这些东西出现在
    Google 搜索中。你知道的，如果有人访问该网页，如果有人知道这些网页在哪里，如果他们看到了，他们就看到了。


    如果他们不知道这个网页是什么，你就不希望他们知道它。那么，这就是你可能放在 `robots.txt` 文件中的内容，声明你不希望搜索引擎索引这些页面，因为再次，你不希望它出现在
    Google 或 Yahoo 上，诸此类推。


    再次，这并不是什么恶意的行为。这不酷。这不性感。这可能是你当地艾尔克斯俱乐部（Elks Club）或扶轮社之类的组织的成员名单，从根本上说，我们不在乎它是否是公开的，你倾向于让它完全、彻底地暴露在外面。所以，`robots.txt`
    文件已经使用了很久。当你回到像 10 年前构建的网站时，很多人发布了页面，他们不希望它们被 Google 之类的索引，所以他们使用这些 `robots.txt`
    文件。现在关于 `robots.txt` 需要理解的关键点是，它只是对网络爬虫的一种建议。对于 Google 和 Yahoo 发出的去访问你网站的爬虫和机器人，它们会寻找
    `robots.txt`。如果它们读取 `robots.txt` 文件，文件告诉它们你倾向于网站不被索引，但它们仍然可以继续索引它。


    这不像你使用 `robots.txt` 就会强制。这不像某种强制性的联邦法律之类的，它只像是一种礼貌。这就是我们得到所谓的深网的主要原因，即这些是未被 Google、Yahoo
    或任何这些搜索引擎索引的网站。


    此外，再次，这通常是因为有某些登录凭据，或者有 `robots.txt` 文件。所以让我们看一眼电脑。是的，你可以看到几点，也许这会让你更清楚一点。我刚把这个网页调到这里。


    如果你进入 `robots.txt`，你可以获得关于 `robots.txt` 文件的更多信息。基本上再次，所有这些文件你可以在记事本中创建。


    它不是女性的，也不是那什么，只是写上：

    ```

    user-agent: *

    disallow: /

    ```

    此外基本上它对那些爬虫和机器人说请不要索引这个网站。而且，这就是你需要做的全部。此外，然后你就有了深网网站。不仅如此，在像 WordPress 这样的东西上也是。我的净网是用
    WordPress 构建的。如果你进入那里，你会看到如果你进入设置->->搜索引擎可见性，你可以阻止搜索引擎索引此站点。这取决于搜索引擎是否遵守此请求，但通常它们这样做，如果我勾选了这个框，它们就会告诉搜索引擎不要索引站点，即使它是一个完整的站点，即使它是一个大站点。所有这些基本上都会从
    Google 和 Yahoo 等处消失。这就是你创建深网的全部。

