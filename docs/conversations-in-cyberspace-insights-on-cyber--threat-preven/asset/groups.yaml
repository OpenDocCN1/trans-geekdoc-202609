    # CONVERSATIONS IN CYBERSPACE 111


    Can you share a technology relevant story related to your current involvement
    with DW chats /IRCs?


    This may come across as obvious to some tech people and web developers, but there
    was recently an issue where screenshots were being faked on a PHP-based chat.
    It turns out it''s entirely easy to right click, inspect element, alter a message,
    and then take a screenshot. Simple things like this can cause confusion in some
    people, so it''s always important to keep in mind the security structure of the
    chat you''re talking on and know when to take it with a grain of salt.


    From my perspective, an encrypted and signed message can be trusted, and even
    then, only to a reasonable degree (as opposed to absolute 100 percent trust).
    Just like the Qubes philosophy says, we should "distrust the infrastructure" whenever
    our data is not fully in our control. This doesn''t mean use things like CloudFlare,
    but having a signed website repo that can be cloned and its signatures verified
    is a good start.


