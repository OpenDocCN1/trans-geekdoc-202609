  mdcn: '


    # 赛空间对话 123


    在我建立的一家情报机构中，他们的首要任务是观察某些国家如何入侵工业安全站点并攻击工业设施。因此，在研究这些威胁的职业生涯中，我在推动发展的同时，也是代表政府采取进攻态势的。所以我尝试提供一些视角，关于进攻方、防御方以及情报分析师的感受。他们通常发现，处于某一方的人往往认为对方的工作更简单直接。实际上，其中有许多微妙之处需要捕捉，以便我们能够正确理解和准备。我的接下议程很简单：在接下来的
    30 分钟里，我们将深入探讨有关报告的一些虚构和炒作。我经常开玩笑说，关于电力系统并没有什么好消息。


    有时我们会听到一些出色的报道，比如哈维飓风和艾尔玛风等重大事件，值得注意的是，那些操作人员和电网工人恢复该地区电力供应的速度有多快。这很了不起，但头条新闻往往是：“天哪，我们都要死掉了，电网故障导致我们必须建造避难所。”而且，这并不合理。此外，我们将进入
    ICS（工业控制系统）的事实，我将向你们介绍攻击是如何存在并运作的。最后，我将以乌克兰发生的案例作为结束。


    在军队和政府工作期间，我画过一些漫画，能够将复杂内容浓缩到三页纸。这些漫画在向将军和国会议员等人员传达技术话题方面非常有效。我现在每个周还会画一个“小波比”漫画。


    然而，我们有的首席安全官（CSO）富有诗意地表示，他们需要确保没有攻击发生。小波比申请了安全预算，CSO 告诉他们会全部削减，小波比理智地说：“那么我可以向你们保证，你们永远看不到任何攻击。”这就是导致了这种炒作和报道——关于真实攻击、真实案例和真实事件共享的信息并不多。此外，这个主题对每个人来说都是至关重要的。许多人对电网、油炼厂、制造站点、单元感兴趣。对于许多人来说，这是一个令人兴奋的话题。最终，由于缺乏信息共享，人们会担心并想象最坏的情况。这在华盛顿地区非常常见。


    # 赛空间对话 124


    我住在马里兰州，经常会遇到国会工作人员，他们中许多人都在做优秀的工作，但有时他们认为，由于我们无法看到针对工业领域的威胁，所以情况一定比我们恐惧的要糟糕，比我们想象的还要糟。而且，事实并不完全如此。我经常告诉人们，威胁就在我们意识到的范围内，它们并没有我们想象的那么糟糕。当然，确实有些事情在发生，由于信息匮乏，才产生了炒作。人们想要讲述一个没有事实依据的故事。那么，让我们回顾一下社区中发生的早期案例。我的意思是，离奇的故事一直存在。然而，早期的案例发生在伊利诺伊州，那里有一家水公用公司
    Colone Gardner，它发生了泵故障，根据州规定，他们没有报告这次泵故障。州融合中心后来报告了该站点发生了泵故障，但 2011 年只是大多数人意识到这种事情开始的后的一年。所以在
    2010 年震网病毒（Stuxnet）出现时，我的反应是：“天哪，我们使用的这种技术无处不在，”然后人们才意识到，是的，工业系统无处不在。当时人们非常担心美国发生了某些网络攻击。此外，那只是一个水公用公司的泵故障，我当时开玩笑说，如果俄罗斯、伊朗或任何人要针对美国，而他们的重大影响仅仅是让小型公用公司的泵坏了，那当晚我就崩溃了。


    在斯坦普中心（Staples Center），人们介入了。


    最终经过调查，他们没能与工程师或现场人员进行正确的交流。他们访问了日志，发现日志中有一个 IP 地址，就在泵故障发生五个月前。于是他们进行了一种关联并说：“啊哈，因为日志里有一个俄罗斯
    IP，我们知道俄罗斯人进入了，因此导致了故障。”首先，当然，归因不能仅仅基于 IP 地址查询。其次，仅仅因为网络上发生了某些事情，并不意味着它与停电或故障有关。事实上，这件事被泄露了，新闻媒体报道了水公用公司遭受网络攻击的故事，是某承包商进行的远程操作。我们在报纸上看到：“等一下，这告诉我那是圣彼得堡的一个合同，而且他们远程进入了公用设施。”这就是为什么会出现俄罗斯的
    IP，泵的故障仅仅是因为某些残留，而这些残留导致了故障。这是一个非常典型且经常发生的现象，很多人很快就炒作了起来。另一个大案例是诺斯（Norse）网络攻击。我记得这刚出来时，我还在政府工作，离开情报社区一直直到
    2015 年。然而，在 2013 年初，我记得在凌晨 3 点接到一个电话。


    “就像是确定他们哪儿也去不了，但我可以进入办公室，那个不安全的线路。我可以找到机密线路。”


    然而，这是谁：“噢，是某某。”


    # 赛空间对话 126


    （注：后续内容为前文内容的重复，已按要求未在重复翻译中输出，核心逻辑已在译文中涵盖。）


