    ## PGP


    “优越隐私”（Pretty Good Privacy）是一种数据加密方法，通常情况下任何截获数据的人只会看到乱码。PGP 使用非对称加密，这意味着发送消息的个人使用“公钥”加密对其进行扰乱，而接收者则使用“私钥”对其进行解码。尽管已经有了两多年的历史，PGP
    仍然是一种强大的加密技术，尽管对于经验丰富的用户来说，它在实践中可能非常难使用。


    ## 网络钓鱼 (Phishing)


    网络钓鱼更多是一种社会工程，而不是黑客攻击或破解。在网络钓鱼过程中，攻击者通常会联系受害者以提取特定信息，这些信息可用于后续攻击。例如，可能伪装成 Google、Facebook
    或受者的手机号码的用户服务，要求受害者点击恶意链接——或者只是要求受害者在电子邮件中发送密码等信息。攻击者通常会发起数以千计的钓鱼行动，但偶尔也会采用更集中的攻击方式，被称为“叉式网络钓鱼”（见下文）。


    ## 明文 (Plaintext)


    顾如其名——未经过加密扰乱的文本。这个定义可以被视为明文。你也可以听过明文被称为“清晰文本”（cleartext），因为它指的是公开的或“明文状态”的文本。


    ## Pwned


    Pwned 是计算机术语（或“黑客语”），对应动词“own”（拥有/击败）。在视频游戏世界中，击败另一个玩家的玩家可以说他 pwned 了对方。在黑客中，这个表达有类似的含义，并不是指在比赛中击败某人，而是获得另一个用户计算机访问权的黑客可以说他
    pwned 了对方。


    ## RAT


    RAT 代表远程访问工具（Remote Access Tool）或远程访问木马。RAT 被用作恶意软件时非常可怕。成功在你的电脑上安装 RAT 的攻击者可以获得对你系统的完全控制权。RAT
    也有合法的业务用途，供想要从家里访问办公室电脑的男女等。RAT 最糟糕的部分是什么？许多恶意 RAT 可以在网络地下找到甚至免费获取，因此攻击者可以完全没有技能却使用这种复杂的工具。


    ## 勒索软件 (Ransomware)


    勒索软件是一种恶意软件，它可以保护你的个人电脑并不允许你访问文件。你会看到一条消息，告知你赎金金额以及向哪里发送付款（通常要求使用比特币）以取回你的文件。这对黑客来说是一个极佳的工具，这也是为什么许多人认为它是一种“爆发”现象，因为个人通常愿意支付几百美元来挽回自己的损失。不仅是个体。在遥过去的
    2016 年，洛杉矶的好莱坞卫理公会医疗中心在遭受勒索软件攻击后支付了约 17,000 美元。


    ## 彩虹表 (Rainbow Table)


    彩虹表是一种复杂的技术，使黑客能够简化想象“哈希”值（如前所示）背后是什么密码的过程。


    ## 红队 (Red Team)


    为了确保计算机系统的安全并探测出任何未知的漏洞，企业可以雇佣黑客组成一个“红队”，他们能够对系统发起对等攻击并尝试完全接管它。在这些情况下，被黑入是一件好事，因为组织可以在非本籍人员入侵之前修复漏洞。红队测试是一个应用于多个领域（包括军事计划）的通用概念。


    ## 根 (Root)


    在大多数计算机中，“root”是赋予机器最基础（因此也是最强大）的访问权限的通常名称，或者是拥有这些权限的账户名称。这意味着“root”可以安装软件、删除和创建文件。如果黑客“获得根权限”（earnings
    root），他们可以在受侵害的系统或计算机上任何任何想做的事。这是黑客攻击的圣杯。


    ## Rootkit


    Rootkit 是一种特定的恶意软件，它驻留在你的系统深处，并在每当你启动它时都会被触发，甚至在操作系统启动之前。这使得 rootkit 难以检测、具有持久性，并可以捕获感染计算机上几乎所有的信息。


    ## 加盐 (Salting)


    在保护文本或密码时，“哈希”（如前所示）是一个将明文转换为乱码的基本过程。为了让哈希更加成功，个人或公司可以在哈希处理之前在密码中添加一组随机字节，称为“盐”（salt）。这增加了一层保护。


    ## 脚本小子 (Script Kiddies)


    这是一个对那些只有一点点计算机知识且只会利用成品工具的贬义称呼，他们只能够利用现成的应用程序来执行诸如让网站离线或在未保护的 Wi-Fi 访问点内嗅探密码等事情。这无疑是一个用来贬低自称是精通黑客的人的术语。


    ## Shodan


    它被众所知为“黑客的 Google”和一个“令人恐惧”的搜索引擎。将其看作是 Google，但针对的是连接设备而非网站。利用 Shodan 可以发现未保护的摄像头、婴儿监视器、打印机、医疗设备、加油泵，甚至是风力涡轮机。虽然这听起来很可怕，但
    Shodan 的价值恰在于它帮助研究人员定位这些设备并提醒所有者以便他们进行安全防护。


    ## 签名 (Signature)


    PGP 的另一个用途是你结合你的加密密钥对消息进行“签名”。因为这个密钥只有个人知道，并存储在他们的计算机上而不是其他地方，所以加密签名应该确认你认为正在交谈的人正是那个人。这是在网络上证明你的身份的极佳方式。


    ## 侧信道攻击 (Side Channel Attack)


    你的计算机硬件始终发射连续的难以察觉的电信号。侧信道攻击试图识别这些信号中的模式，以了解机器正在执行哪些计算。例如，黑客通过“监听”正在创建密钥密钥的硬盘，可能重建该密钥，从而在你的不知情的情况下窃取它。


    ## 嗅探 (Sniffing)


    嗅探是一种在不被察觉的情况下拦截网络传输数据的手段。一旦收集到信息，黑客可以对其进行筛选以寻找有用信息，如密码。它被认为是一种特别危险的攻击，因为可以在网络内部或外部进行。


    ## 社会工程学 (Social Engineering)


    并不是所有的攻击都是通过盯着像黑客帝国绿色文字显示来执行的。有时，进入受保护的系统只需拨打电话或发送电子邮件并伪装成其他人——特别是经常访问该系统但忘记了密码的人。


    ## 叉式网络钓鱼 (Spear-Phishing)


    网络钓鱼和叉式网络钓鱼经常被混用，但后者是一种更简单、更有针对性的网络钓鱼（如前所示），黑客试图欺骗受害者点击恶意附件或链接，伪装成发送者，例如社交网络或公司。如果操作当，叉式网络钓鱼可能非常有用且强大。


    ## 伪装 (Spoofing)


    黑客可以通过操纵电子邮件地址等方式欺骗人们落入钓鱼攻击（前文提到），使其看起来像是目标所理解的人说话。这就是伪装。它也可以用于电话诈骗，或制作假的网站地址。


    ## 间谍软件 (Spyware)


    一种特殊的恶意软件，旨在监视、跟踪和窃取目标信息。


    ## 国家级攻击者 (State Actor)


    国家级攻击者是由政府支持的黑客或黑客群体，可能是美国、俄罗斯或中国。这些黑客通常是最强大的，因为他们拥有国家提供的几乎无限的法律和财政资源作为支持。例如，国家级攻击者也可能是获得政府默许支持（或至少对公众隐藏的支持）的黑客群体，如叙利亚电子军。


    '
