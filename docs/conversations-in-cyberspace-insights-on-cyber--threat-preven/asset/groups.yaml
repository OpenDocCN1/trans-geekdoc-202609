    I''ve had a lot of luck with Ahmia, but more luck by using .onion ndirectories:


    Fresh Onions: http://zl32teptf4tvi.onion/

    DeepLink: http://deeplinkdebeatml7.onion/index.php

    Daniel''s Link List: http://onionsnajkm5g.onion/onions.php

    Some have great advanced search options and Daniel Winzen''s onion link list script
