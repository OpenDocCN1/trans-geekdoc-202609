    # CHAPTER 1


    # Introduction


    Conversations in Cyberspace is a collection of insights and online conversations
    (both on IRC chats and encrypted e-mails) on the current state of security and
    privacy in the online world with a focus on the Deep Web. I have also included
    a brief introduction to some of the most used opensource intelligence (OSINT)
    tools and a selection of interviews with some of the key figures in industrial
    control systems (ICS), advanced persistent threat (APT) and hackers/hacktivists
    groups.


    During the making of this short book, I have quickly realized I had to include
    interviews and insights from both people involved in the defense side of security
    and hackers/“crackers” who enjoy the intellectual challenge of creatively overcoming
    limitations and restrictions of software systems to achieve novel and unexpected
    outcomes.


    The picture that comes out is a fascinating scenario where the cyberspace is becoming
    remarkably similar to the "physical space"; an increasing amount of people, groups
    and organizations are getting concerned about privacy, trust and information shared
    and promote both in the "clearnet and the so-called "deep web.".


    This book aims to be an introduction to the relationships between security, open
    source intelligence and the vast and complex world hiding in the deep web for
    the security professional and the system administrator interested in exploring
    the today''s concerns in database design, privacy and security-by-design.


    Offensive security, the team that developed the Kali Linux OPS, one of the most
    popular pen testing operation systems, summarizes the hacking spirit with the
    quote “the quieter you become, the more you can hear” borrowed from the 13th-century
    Persian poet, Jalāl ad-Din Muhammad Rumi.


    October 31, 2018, Europe'
  - '[PAGE 10]


    # Search Engines


    Finding information on the Dark Web is not difficult. There are lists of Dark
    Web sites, and you will find Dark search engines. The Onion sites provided in
    search results present challenges not found in a Bing or Google search results
    list.


    The websites may be temporarily offline, a frequent problem with Dark Web websites.
    Latency can make entering a query, obtaining results, and visiting the site in
    a results list time-consuming. Google-like response time is the exception.


    The rule is to allocate sufficient time for Tor sluggishness. Additionally, the
    sites in the results list may be operated by law enforcement or an intelligence
    entity.


    If a Dark Website looks too good to be true, approach with caution, registering
    or downloading content can allow malware in your computer.


    We reiterate these warnings because Bing and Google users are conditioned to enter
    a question, scan results list, and see websites that problematic destinations
    are filtered out.


    Searching the Dark Web requires a more careful mindset. Keep in mind that you
    can use your sandboxed computing device to access Surface Web and Dark Internet
    websites.


    # Hidden Wiki


    Among those easy-to-find “navigator” services for the Dark Web is the Hidden Wiki.
    With Tor and running, enter the URL http://thehidden-denwiki.org/ and click on
    a link. The selected Dark Web site will appear in the Tor browser.


    If you are using the Tor software package, you can click on a link. The site will
    display if it is online. Delays for a few Tor functions may 50 seconds or more.


    The Hidden Wiki provides Onion links to chosen Dark Web sites in various categories.


    The Hidden Wiki is another starting point for Dark Internet surfing. If a website
    does not resolve, you will have to try again later. You may'
  - '[PAGE 11]


    # INTRODUCTION


    also use the Paste-bin lookup methods described in the previous chapter to find
    out if a new Onion speech was posted. If the Hidden Wiki does not respond, an
    alternate supply of directory list is TorLinks in https://torlinkb6saabns.onion.


    This website features similar categories and a similar number of listings. If
    your curiosity is participating in Dark Web forums, you may use the list of discussion
    groups to learn more about the conventions of Dark Internet services. The study
    team discovered that one has to build a relationship with the community of every
    forum. Some forums have a crowd-sourced score, like the consumer ratings on eBay
    or Amazon. The methods vary by Dark Web forum.


    # Ahmia


    The Ahmia search system can be queried without the Tor software installed; however,
    to access a site, you will need to use your Tor-equipped computing device. The
    Surface Web URL is https://ahmia.fi; the Onion speech was #msydqltz2kerzdg.onion.
    The Ahmia code is an open source project with a repository on GitHub.


    Ahmia, operated from Finland, bills itself as a “search engine for residents on
    the Tor anonymity network.”


    The system does not maintain Internet Protocol filters and logs results to knock
    out child abuse hyperlinks.


    The system is integrated with GlobalLeaks and Tor2Web.

    The system was created by JuhaNurmi, who is the chief executive of the Finnish
    company Dignify Ltd. (https://dignify.fi). Dignify offers data mining and cyber
    security research providing information about drug markets and other law enforcement
    issues.


    At the top of the splash screen is a link to “Statistics.” The information, when
    it is available, is helpful. The index contains links to about 5,000 DarkWeb sites.
    Ahmia was a 2014 Google Summer of Code project. The goal was to improve the Ahmia
    system.


    In July 2015, Ahmia published a list of Websites which were made to collect traffic
    from “real” Dark Web sites. In the summer of 2016, Ahmia has been offline more
    than it has been online.'
