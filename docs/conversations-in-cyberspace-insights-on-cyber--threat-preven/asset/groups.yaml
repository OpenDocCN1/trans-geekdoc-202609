    # Substitution-Permutation Networks


    This is among the most popular forms of symmetric ciphers in use today (Feistel
    is another). Just as the name says, this sort of cipher uses both substitution
    and permutation to change the plaintext into cipher-text. To understand how these
    work, you must first understand that these ciphers first break up the information
    into chunks. Each chunk is composed of a particular number of bytes called a word.
    For an example, I will make up a SPN that has a substitution section, a permutation
    section, and a whitening segment. Suppose I have the hexadecimal code:0xa258fe1b1
    I defined my word size to be 4 pieces (1/2 byte), then I would divide it up like
    this...


    a 2 5 8 f e 1 b


    For the substigation stage, I will add three to everyone...


    D 5 8 B 2 4 E


    Then I will permute the information by transferring each word to the right and
    shifting the next word with the third, the fourth with the fifth, and so on until
    the eighth is switched to the first.


    1 D E 8 2 B 4


    Ultimately, I will take my key (0x01234567) and I will XOR it to the current data.
    This practice is called whitening.


    1 C C 6 1 7 D 3


    This may look the result, but it''s not! No. In the modern SPNs, we would do this
    several days before we were done. Rijndael, aka AES, uses a more complex set of
    substitutions and permutations, adds in a key generator that generates a key for
    each cycle and repeats the key 12 times! These processes are sufficiently complex
    and arbitrary that any change in the key or the plaintext will impact each and
    every bit in the block.


    Encryption cannot do everything for you. There are a lot of things can do though.
    By way of example, encryption can be used to keep messages safe, obviously.'
  - '[PAGE 112]


    104 CONVERSATIONS IN CYBERSPACE


    With a sufficiently strong encryption scheme and a sufficiently strong key, even
    a government can''t break encryption.


    Cryptography is used daily, hourly, secondly (my English teacher de damned!) for
    online transactions. You''re aware that your credit number is saved every time
    you shop at a new site, right? Without public-key cryptography, we couldn''t shop
    online with any semblance of security. Cryptography can also be used for integrity
    assurance. Using hashes, we can be sure that because the last time a file was
    “hashed,” the file hasn''t been altered. Finally, using hashes and signature schemes,
    we can confirm a person''s identity with no meeting them. However encryption cannot
    do everything.


    As I said, a sufficiently good encryption scheme can''t broken even by a government.
    However, if the government in question is really interested in your information,
    they can only give them the password whatever means are available to them.


    This brings to my second point. Encryption does not guarantee secrecy of communication,
    only the content. In fact, the fact that something is encrypted is so apparent
    that a strong entity can use it to tag your communication across the Internet.


    This practice is called traffic analysis and is, once more, outside the scope
    of this article. If you would like to avoid traffic analysis, you want to obfuscate
    the endpoint with proxies (such as a TOR route), or you need to conceal the fact
    that you are communicating secretly with steganography.


