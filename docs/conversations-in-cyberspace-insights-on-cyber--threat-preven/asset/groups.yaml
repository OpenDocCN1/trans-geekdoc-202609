    # BUSINESS EXPERT 数字图书馆


    # 网络空间中的对话 (Conversations in Cyberspace)


    # Giulio D’Agostino


    # 面商科学生的电子书


    本系列是面向高级商科学生的课程导向型数字化书籍，由学术领袖撰写。他们将真实的商业经验转化为课程读物和参考资料，旨在帮助在职业生涯中应对管理和领导力挑战的学生。


    《网络空间中的对话》是关于当前互联网世界安全与隐私现状的见解合集。书中包含了对一些最常用的开源情报（OSINT）工具的简要介绍，并对来自工业控制系统（ICS）、高级持续性威胁（APT）以及在线/深网成员组织的关键人物进行了系列采访。


    本书旨在介绍安全、开源情报（OSINT）与隐藏在深网中庞大且复杂的世界之间的关系。书中提供的信息对于对数据库设计、隐私与设计安全，以及深网成员组织（如 Cicada
    3301、The Unknowns、Anonymous 等）等关注感兴趣的安全专业人士和系统管理员将大有裨益。


    # 图书馆定制政策


    - 无限制同时使用

    - 无限制下载和打印

    - 一次性付费永久访问

    - 无平台费或维护费

    - 提供免费 MARC 记录供执行

    - 无需许可执行


    Giulio D’Agostino 是一位系统管理员、作者和技术专家，在云计算、软件服务（SaaS）和出版领域拥有 20 多年的经验。曾任职于 Google、Apple、Hewlett
    Packard 和 Salesforce.com。Giulio 曾在丹麦技术大学（DTU）、Web Summit 2016/2017 授课，目前担任软件服务及云端提供商公司
    LogMeInc 的系统管理员。


    数字图书馆是向每位学生和教职员工提供重要商业问题实用解决方案的一种全面且高效益的方式。


