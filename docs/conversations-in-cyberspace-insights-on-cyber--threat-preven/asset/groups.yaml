    Q. You mentioned that you have borrowed methods from public health interventions.
    Is that an approach that you think has value for other cybersecurity problems?


    - A. The ITS study design is increasingly being used in epidemiology to evaluate
    the efficacy of public health interventions.


    - The turn toward analogical reasoning in contemporary academic cybersecurity
    discourse has seen the rise of modalities that challenge the logic of continuously
    prioritizing national security concerns in cyberspace, including seeing a global
    public health model being applied to digital safety, particularly when the focus
    is on mitigating unsafe user behavior that puts others in their community at risk.


    The epidemiology paradigm is also prevalent in the cybersecurity literature that
    deals with the theory of malware ecosystems, while a notable example of the practical
    application of a public health model by civil society organizations in response
    to systemic targeted malware attacks can be seen at another one of my field sites
    in the Tibetan exile diaspora.


    - Q. Your research focuses on DNS as the best place to stop malware for this case
    study, why is that?


    - A. The CyberSAR intervention, like many digital safety projects in the civil
    society sector, operates with constrained resources, and focusing on detecting
    malicious DNS traffic, is seen as among the more cost-effective technical interventions.


    - The Domain Name Service (DNS) is a foundational substrate of the global Internet,
    the lowest layer of the Internet, with the exception of the routing protocols
    themselves, and the most pervasive protocol. Malicious actors use DNS to propagate
    networks of compromised machines, such as bots.


    - A recent survey by Cisco showed that 91.3 percent of malware uses DNS in attacks,
    to receive instructions from Command and Control (C2) servers or for data exfiltration.


    - The same survey indicated that 67 percent of organizations do not monitor recursive
    (passive) DNS to detect anomalies associated with known or unknown cyber threat
    behaviors. Increasingly, however, network defenders are monitoring DNS traffic
    and applying static blacklists of malicious domains to block communications with
    botnets.


    - Q. Can you characterize the sort of malware families you are detecting in Central
    Asia?


    - A. We had hypothesized, prior to the experiment''s pilot installations and initial
    site visits, that high-profile NGOs and independent media in Central Asia are
    specifically targeted online by other actors by dint of their professional activities.
