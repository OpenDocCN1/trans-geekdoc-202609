    # CONVERSATIONS IN CYBERSPACE 83


    I do think we will have many technological renaissances ahead, as we already have.
    The advent of gunpowder brought a massive plague upon Europe and Asia. It''s always
    prosperity followed by complacency by war. Look at the new generations, they will
    undergo physical mutations in the coming centuries because of the influence of
    technology in our everyday life; it reminds me of speculative theories such as
    the aquatic ape theory of Toffler where human have lost their hair swimming the
    oceans after having to climb down from the trees of a vanishing forest.


    I do not agree with claims that humankind is fully evolved now, I think that humans
    will constantly evolve through time, and we are at the beginning of our infancy
    of how we will think and look in a million of years.


    Right now, there is a bit of a race between AI and humankind, we might have to
    figure out how to manage technology if and when it would get close to resemble
    or mimic biological organisms and potentially become a physical threat for us.
    As you pointed out, we program a survival instinct into AI, AI will bite the hand
    that feeds it.


