    past Greg investigated complex adaptive threats targeting civil society networks,
    and worked extensively with Tibetan NGOs in the field in South Asia. Greg coordinated
    the primary field-based research for the GhostNet and the ShadowNet investigations
    in the Dalai Lama''s Office and the Tibetan Government-in-Exile in Dharamsala,
    India, where he worked with a team that uncovered global cyber espionage botnets
    operating out of China, and penetrating the United Nations, NATO, governments,
