  md: '# CONVERSATIONS IN CYBERSPACE 101


    bigger the key, the stronger the encryption. It doesn''t necessarily indicate
    that bigger keys imply stronger encryption involving encryption algorithms. Between
    algorithms, the strength of the encryption depends on both the particulars of
    the algorithm and the critical dimensions.


    Encryption algorithms are based on the transformation and permutation of information.
    The classic case of transformation from substitution is the Caesar cypher and
    its descendant, Vigenere. For instance, we could have the next sentence.


    The quick brown fox jumped over the lazy dog.


    This sentence can be encrypted with a Caesar cypher with a key of "b..."...


    VJKS WKEM DTQY PHQZ LWOR GFXQ GTVJ KNCB AFQI


    Note that the letters have been incremented by two and the formatting removed.
    Vigenere works similarly, but instead of one letter or number key, it uses several
    letters and numbers. For example, the same sentence is now encrypted with the
    keyword "Disney"...


    XQE ZHGT UFTV ROHL OTQY XRTU IAMV JKEI LRT


    We could use a transposition cypher. A transposition cipher doesn''t alter the
    letter''s distributions. Instead, it merely scrambles their purchase. A rail fence
    cipher is among the most famous of the easy transpositions. First, you choose
    the sentence you would like to encode and write it in staggered formations like
    this...


    ```

    teucbonojmeoeteayo

    hqiqrwfxupdvrhlzdg

    ```


    Then, copy the following row:


    TEUC BONO JMEO ETEA YOHQ IKRW FXUP DVRH LZDG


    In each case, the sentence is encoded. What if someone wishes to read it enough
    to try and break it?'
