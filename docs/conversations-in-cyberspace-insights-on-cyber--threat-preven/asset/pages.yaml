    free software.


    # White Hat


    A white hat hacker is a person who hacks with the objective of fixing and shielding
    systems. Rather than black hat hackers (shown earlier), rather than taking advantage
    of the hacks or the bugs they find to create money illegally, they alert the firms
    and even fix them the problem.


    # Worm


    A particular type of malware that propagates and reproduces itself, spreading
    from computer to computer. The net’s history is littered with worms, from the
    Morris worm, the first of its type, and the renowned Samy worm, which infected
    more than a million people on MySpace.


    # Zero-Day


    A zero-day or “0 day” is a bug that is unknown to the software vendor, or at least
    it is not patched yet. The title stems from the notion that there have been zero
    days involving the discovery of this bug or flaw and the first attack using it.
    Zero-days would be the most prized bugs and exploits for hackers since a fix has
    not yet been set up for them, so they are almost certain to work.'
