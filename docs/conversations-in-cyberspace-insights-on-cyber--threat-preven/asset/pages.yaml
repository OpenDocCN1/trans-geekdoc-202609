    Q. What is one attribute from a Straight and a Crossover cable?


    A. Straight, for example:


    +   1. Connect a computer to a switch/hub''s standard port.

    2. Connect a computer to a cable/DSL modem''s LAN port.

    3. Connect a router''s WAN port to a cable/DSL modem''s LAN port.

    4. Connect a router''s LAN port to a switch/hub''s uplink port (generally used
    for expanding network).

    5. Connect 2 switches/hubs with one of the switch/hub using an uplink port and
    the other one using a standard port.


    alternatively, Crossover:


    +   1. Connect 2 computers directly.

    2. Connect a router''s LAN port to a switch/hub''s standard port (generally used
    for expanding network).

    3. Connect 2 switches/hubs by using a standard port in both switches/hubs.'
