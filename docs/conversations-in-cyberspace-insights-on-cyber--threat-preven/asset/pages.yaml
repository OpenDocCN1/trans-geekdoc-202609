- pgno: 73
  md: '# CONVERSATIONS IN CYBERSPACE 65


    A. The most common technique is called Least Significant Bit or LSB for short.
    The LSB process alters the last few bits in a byte to encode a message, which
    is especially useful in something like an image, where the red, green, and blue
    values of each pixel are represented by bits (one byte) ranging from 0 to 255
    in decimal or 00000000 to 11111111 in binary. For example changing the last two
    bits in a completely red pixel from 11111111 to 11111101 only changes the red
    value from 255 to 253, which to the naked eye creates a nearly imperceptible change
    in color but still allows us to encode data inside of the picture. You can also
    design your own algorithm if you already have good coding and math foundations.


    Q. What are the foundations of good digital steganography?


    +   A. Encryption and Compression. Data encryption adds an extra layer of security,
    compression will allow you to fit more information in your "hidden file."


    Q. Easier way to hide data in a file?


    +   A. Use Steghide.


    Q. Could you go into steps on how to install it? For example if a user is running
    Kali Linux, how would it work?


    A. Ok, open the terminal and type:


    ```

    apt-get install steghide

    then type:

    steghide embed -ef secretFile -cf outputFile -sf outputFile -z compressionLevel
    -e scheme

    ```


    remember to use the correct arguments, here is a recent updated list for steghide
    arguments:

    -ef specifies the path of the file that you want to hide. You can embed any kind
    of file inside of the cover file, including Python scripts or shell files.'
