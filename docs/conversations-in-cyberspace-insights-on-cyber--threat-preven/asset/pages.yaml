- pgno: 5
  md: '# Abstract


    Conversations in Cyberspace is a collection of insights on the current state of
    security and privacy in the Internet world, a brief introduction to some of the
    most used OSINT (open-source intelligence) tools and a selection of interviews
    with some of the key figures in ICS (industrial control systems), APT (advanced
    persistent threat) and online/deep web members organizations. This book aims to
    be an introduction to the relationships between security, OSINT and the vast and
    complex world hiding in the deep web for both the security professional and the
    system administrator interested in exploring the today''s concerns in database
    design, privacy and security-by-design, and deep web members organizations including
    Cicada 3301, the Unknowns, Anonymous, and more.


    # Keywords


    Deepweb; Dark Web; Hacker; Hacktivist; Cybersecurity; Cicada 3301; The Unknowns;
    Anonymous; Atlayo; Grams; Torch; Hidden Wiki; Tor; Podesta emails; Greg Walton;
    Cyberspace; Security; Privacy; Cryptography; GCHQ; GDPR; Debian; Linux; Maltego;
    AI'
