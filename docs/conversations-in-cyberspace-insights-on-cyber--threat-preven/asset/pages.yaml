- pgno: 105
  md: 'CONVERSATIONS IN CYBERSPACE 97


    There are several ways to categorize encryption, but for our purposes here, I
    have broken them down into four main areas.


    # Symmetric Encryption


    Symmetric cryptography is where we have the identical key in the sender and recipient.
    It''s most likely the most common type of cryptography. You''ve got a password
    or key which deletes a message, and I have the same password to decrypt the message.
    Anyone else cannot read our message or information.


    Symmetric cryptography is extremely fast, so it''s well-suited for bulk storage
    or streaming software. The disadvantage to symmetric cryptography is the key exchange.
    If both ends need the same key, they will need to utilize the third channel to
    exchange the key and therein lies the weakness. Whether two people wish to reestablish
    their communication and they''re 12,000 miles apart, how can they swap the key?
    This key exchange afterwards is fraught with all the issues of the confidentiality
    of the medium they choose, whether it be phone, mail, e-mail, face-to-face, and
    so on. The key exchange can be intercepted and leave the confidentiality of the
    encryption moot. Some of the standard symmetric algorithms That You need to be
    familiar with:


    DES—This was one of the original and oldest encryption schemes developed by IBM.
    It was found to be flawed and breakable and was used in the original hashing system
    of LANMAN hashes in early (pre-2000) Windows systems.


    3DES—This encryption algorithm was developed in response to the flaws in DES.
    3DES applies the DES algorithm three times (hence the name “triple DES”) making
    it slightly more secure than DES.


    AES—Advanced Encryption Standard is not an encryption algorithm but rather a standard
    developed by NIST. Presently, it is considered the most robust encryption, uses
    a 128-, 196-, or 256-bit key and is occupied by the Rijndael algorithm since 2001.
    Used in WPA2, SSL/TLS, and many other protocols where confidentiality and speed
    are essential.'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'RC4—This is streaming (it encrypts each bit or byte rather than a block of
    information) cipher and developed by Ronald Rivest of RSA fame. Used in VoIP and
    WEP.


    Blowfish—The first of Bruce Schneier''s encryption algorithms. It uses a key length
    and is very secure. It is not patented so that anyone can use it without a license.

    Twofish—A stronger version of Blowfish using a 128- or 256-bit key and was a contender
    for AES. Used in Cryptcat and Open-PGP, among other places. It is also in the
    public domain without a patent.


    # Asymmetric Encryption


    Asymmetric cryptography uses different keys on the end of the communication channel.
    Asymmetric cryptography is extremely slow, about 1000 times slower than symmetric
    cryptography; therefore we do not wish to use it for bulk encryption or streaming
    communication. It will, however, solve the key exchange issue. Since we do not
    have to have the same key on both ends of communication, we do not have the dilemma
    of key exchange.


    Asymmetric cryptography is used primarily if we have two things unknown to each
    other to exchange a little bit of data, including a secret or other identifying
    data, like a certificate. It''s not used for streaming or bulk encryption because
    of its speed limitations.


    Some of the common asymmetric encryption schemes should be familiar with are:


    Diffie-Hellman—Many people in the field of cryptography regard the Diffie-Hellman
    key exchange to be the most significant development in cryptography (I would have
    to agree). Without going deep into the mathematics, Diffie and Hellman developed
    a way to generate keys without having to exchange the keys, thereby solving the
    critical exchange problem that plagues crucial asymmetric encryption.


    RSA—Rivest, Shamir, and Adleman is a scheme of asymmetric encryption that uses
    factorization of vast prime numbers as the relationship between the two keys.'
