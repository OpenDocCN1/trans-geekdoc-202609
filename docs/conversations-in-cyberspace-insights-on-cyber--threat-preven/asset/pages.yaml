  md: '# CONVERSATIONS IN CYBERSPACE 25


    media in Central Asia are specifically targeted online by other actors by dint
    of their professional activities. Our initial threat model referenced a growing
    literature on targeted digital threats to civil society actors.


    Over the past decade, NGOs have become targets of spear phishing or social malware
    attacks, and have found it difficult to mitigate these threats.


    In contrast to their under-resourced targets, the adversaries are often well-resourced
    and well-trained. Documented attacks on NGOs have often revealed a relatively
    high level of sophistication when the overall complexity of the attack is considered,
    particularly in the social engineering methods used, if not always in the code
    itself. In light of this observation Seth Hardy has proposed a metric that attempts
    to quantify the relative complexity of both the social engineering and the malicious
    code employed in a targeted malware attack.


    It is argued that such a Targeted Threat Index (TTI) is a superior heuristic for
    assessing the sophistication of a threat—in comparison to technical analysis in
    isolation of the social context. A consequence of research analyzing targeted
    digital threats has been an increase in donor resources to modify user behavior
    among targeted populations through training programs, rather than relying on strategies
    that over-emphasize technical risk mitigation through the deployment of software
    and hardware.


    A significant motivation for the deployment of the DNS firewall was to mitigate
    the risk of targeted malware attacks by identifying the malicious domains associated
    with C2 infrastructure and blocking those domains. If one NGO in the research
    population was targeted, all the NGOs would be protected from malicious infrastructure.
    This approach has worked to great effect in the Tibetan diaspora.


    The digital security environment that we have observed so far, however, suggests
    that NGOs in the Central Asian region are more likely to be exposed to commodity
    threats, such as browser-based crypto jacking than to APTs.'
