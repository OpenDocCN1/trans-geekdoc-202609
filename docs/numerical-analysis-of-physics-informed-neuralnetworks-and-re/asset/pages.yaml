  md: 'Moreover, performing gradient descent using the transformed parameters $\hat{\theta}_k
    := \mathsf{P}\theta_k$ yields


    $$\hat{\theta}_{k+1}=\mathsf{P}\theta_{k+1}=\mathsf{P}\theta_k-\eta\mathsf{P}\mathsf{P}^{\mathsf
    T}\nabla_{\theta}L(\mathsf{P}\theta_k)=\hat{\theta}_k-\eta\mathsf{P}\mathsf{P}^{\mathsf
    T}\nabla_{\theta}L(\hat{\theta}_k). \tag{7.26}$$


    Given that any positive definite matrix can be written as $\mathsf{P}\mathsf{P}^{\mathsf
    T}$, this shows that linearly transforming the parameters is equivalent to preconditioning
    the gradient of the loss by multiplying by a positive definite matrix. Hence,
    parameter transformations are all we need in this context.


    # 7.4.2. *Preconditioning linear physics-informed machine learning models*


    We now rigorously analyse the effect of preconditioning linear parametrized models
    of the form $u_{\theta}(x)=\sum_k\theta_k\phi_k(x)$, where $\phi_1,\ldots,\phi_n$
    are any smooth functions, as introduced in Section 2.2.1. A preconditioned model,
    as explained above, would have the form $\tilde{u}_{\theta}(x)=\sum_k(\mathsf{P}\theta)_k\phi_k(x)$,
    where $\mathsf{P}\in\mathbb{R}^{n\times n}$ is the preconditioner. We motivate
    the choice of this preconditioner with a simple, yet widely used example.


    Our differential operator is the one-dimensional Laplacian $\mathcal{L}=\mathrm{d}^2/\mathrm{d}x^2$,
    defined on the domain $(-\pi,\pi)$, for simplicity with periodic zero boundary
    conditions. Consequently, the corresponding PDE is the Poisson equation (Example
    2.4). As the machine learning model, we choose $u_{\theta}(x)=\sum_{k=-K}^{K}\theta_k\phi_k(x)$
    with


    $$\phi_0(x)=\frac{1}{\sqrt{2\pi}},\qquad \phi_{-k}(x)=\frac{1}{\sqrt{\pi}}\cos(kx),\qquad
    \phi_k(x)=\frac{1}{\sqrt{\pi}}\sin(kx) \tag{7.27}$$


    for $1\leq k\leq K$. This model corresponds to the widely used *learnable Fourier
    features* in the machine learning literature (Tancik *et al.* 2020) or *spectral
    methods* in numerical analysis (Hesthaven *et al.* 2007). We can readily verify
    that the resulting matrix $\mathsf{A}$ (7.13) is given by


    $$\mathsf{A}=\mathsf{D}+\lambda vv^{\mathsf T}, \tag{7.28}$$


    where $\mathsf{D}$ is a diagonal matrix with $\mathsf{D}_{kk}=k^4$ and $v:=\phi(\pi)$,
    that is, $v$ is a vector with $v_{-k}=(-1)^k/\sqrt{\pi}$, $v_0=1/\sqrt{2\pi}$,
    $v_k=0$ for $1\leq k\leq K$. Preconditioning solely based on $\mathcal{L}^*\mathcal{L}$
    would correspond to finding a matrix $\mathsf{P}$ such that $\mathsf{P}\mathsf{D}\mathsf{P}^{\mathsf
    T}=\mathsf{Id}$. However, given that $\mathsf{D}_{00}=0$, this is not possible.
    We therefore set $\mathsf{P}_{kk}=1/k^2$ for $k\neq 0$ and $\mathsf{P}_{00}=\gamma\in\mathbb{R}$.
    The preconditioned matrix is therefore


    $$\widetilde{\mathsf{A}}(\lambda,\gamma)=\mathsf{P}\mathsf{D}\mathsf{P}^{\mathsf
    T}+\lambda\mathsf{P}v(\mathsf{P}v)^{\mathsf T}. \tag{7.29}$$


    The conditioning of the unpreconditioned and preconditioned matrices considered
    above are summarized in the following theorem (De Ryck *et al.* 2023).


    # **Theorem 7.12.**


    The following statements hold for all $K\in\mathbb{N}$.


    +   1. The condition number of the unpreconditioned matrix above satisfies


    $$\kappa(\mathsf{A}(\lambda))\geq K^4. \tag{7.30}$$'
