  md: '# 7.5.3. Second-order optimizers


    There are many empirical studies which demonstrate that first-order optimizers
    such as (stochastic) gradient descent or ADAM are not suitable for physics-informed
    machine learning, and we need to use second-order (quasi-) Newton-type optimizers
    such as L-BGFS in order to make training of physics-informed machine learning
    models feasible. As it turns out, one can prove that for linear physics-informed
    models the Hessian of the loss is identical to the matrix $\mathbb{A}$ (7.13).
    Given any loss $\mathcal{J}(\theta)$, the gradient flow of Newton''s method is
    given by


    $$\frac{\mathrm{d}\theta(t)}{\mathrm{d}t} = -\gamma H[\mathcal{J}(\theta(t))]^{-1}\nabla_{\theta}\mathcal{J}(\theta(t)),\qquad
    (7.42)$$


    where $H$ is the Hessian. In our case, we consider the physics-informed loss $L(\theta)
    = R(\theta) + \lambda B(\theta)$ and consider the model $u_\theta(x) = \sum_{\ell}
    \theta_\ell \phi_\ell(x)$, which corresponds to a linear model or a neural network
    in the NTK regime (e.g. Lemma 7.8). Using $\partial_{\theta_i}\partial_{\theta_j}
    u_\theta = 0$, we calculate


    $$\begin{aligned}

    \partial_{\theta_i}\partial_{\theta_j} L(\theta) &= \int_{\Omega} (\mathcal{L}\partial_{\theta_i}
    u_\theta(x)) \cdot \mathcal{L}\partial_{\theta_j} u_\theta(x)\,\mathrm{d}x + \lambda
    \int_{\partial\Omega} \partial_{\theta_i} u_{\theta(t)}(x) \cdot \partial_{\theta_j}
    u_\theta(x)\,\mathrm{d}x \\

    &= \int_{\Omega} \mathcal{L}\phi_i(x) \cdot \mathcal{L}\phi_j(x)\,\mathrm{d}x
    + \lambda \int_{\partial\Omega} \phi_i(x) \cdot \phi_j(x)\,\mathrm{d}x \\

    &= \mathbb{A}_{i j}.

    \end{aligned}\qquad (7.43)$$


    Therefore, in this case (quasi-) Newton methods automatically compute an (approximate)
    inverse of the Hessian and hence precondition the matrix $\mathbb{A}$, relating
    the use of (quasi-) Newton-type optimizers to preconditioning operators in this
    context. See Müller and Zeinhofer (2023) for further analysis of this connection.


    # 7.5.4. Domain decomposition


    Domain decomposition (DD) is a widely used technique in numerical analysis to
    precondition linear systems that arise out of classical methods such as finite
    elements (Dolean, Jolivet and Nataf 2015). Recently there have been attempts to
    use DD-inspired methods within physics-informed machine learning (see Moseley
    et al. 2023, Dolean et al. 2023 and references therein), although no explicit
    link with preconditioning the models was established. This link was established
    in De Ryck et al. (2023) for the linear advection equation, where they computed
    that the condition number of $\mathbb{A}$ depends quadratically on the advection
    speed $\beta$. They argued that considering $N$ identical submodels on subintervals
    of $[0, T]$ essentially comes down to rescaling $\beta$. Since the condition number
    scales as $\beta^2$, splitting the time domain in $N$ parts will then reduce the
    condition number of each individual submodel by a factor of $N^2$. This is also
    intrinsically connected to what happens in causal learning based training of PINNs
    (Wang, Sankaran and Perdikaris 2024), which therefore can also be viewed as a
    strategy for improving the condition number.'
