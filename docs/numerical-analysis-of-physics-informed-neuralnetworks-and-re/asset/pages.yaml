  md: '# 7.5.1. *Choice of* $\lambda$


    The parameter $\lambda$ in a physics-informed loss such as (2.46) plays a crucial
    role, as it balances the relative contributions of the physics-informed loss $R$
    and the supervised loss at the boundary $B$. Given the analysis of the previous
    sections, it is natural to suggest that this parameter should be chosen as


    $$\lambda^* := \underset{\lambda}{\min}\; \kappa(\mathbf{A}(\lambda)) \tag{7.33}$$


    in order to obtain the smallest condition number of $\mathbf{A}$ and accelerate
    convergence. Another strategy is suggested by Wang *et al.* (2021a), who suggest
    a learning rate annealing algorithm to iteratively update $\lambda$ throughout
    training as follows:


    $$\lambda_a^* := \frac{\max_k\left|(\nabla_\theta R(\theta))_k\right|}{(2K+1)^{-1}\sum_k\left|(\nabla_\theta
    B(\theta))_k\right|}. \tag{7.34}$$


    Similarly, Wang *et al.* (2022b) propose setting


    $$\lambda_b^* := \frac{\operatorname{Tr}(K_{rr}(n))}{\operatorname{Tr}(K_{uu}(n))}
    \approx \frac{\int_\Omega \nabla_\theta\mathcal{L}u_\theta^\top\nabla_\theta\mathcal{L}u_\theta}{\int_{\partial\Omega}\nabla_\theta
    u_\theta^\top\nabla_\theta u_\theta}. \tag{7.35}$$


    we refer to Wang *et al.* (2022b) for the exact definition of $K_{rr}$ and $K_{uu}$.


    In the below example, we compare $\lambda^*$ (7.33), $\lambda_a^*$ (7.34) and
    $\lambda_b^*$ (7.35) for the Poisson equation.


    **Example 7.13 (Poisson’s equation).** We compare the three proposed strategies
    above for the one-dimensional Poisson equation and a linear model using Fourier
    features up to frequency $K$. First of all, De Ryck *et al.* (2023) computed that
    $\lambda^* \sim K^2$. Next, to calculate $\lambda_a^*$ we observe that $(\nabla_\theta
    R(\theta))_k = k^4\theta_k$ for $k\ne \ell$ and $(\nabla_\theta R(\theta))_\ell
    = \ell^4(\theta_\ell-1)$. We find that $\max_k |(\nabla_\theta R(\theta))_k| \sim
    K^4$ at initialization. Next we calculate that (given that at initialization $\theta_m\sim\mathcal{N}(0,1)$
    i.i.d.)


    $$\mathbb{E}\sum_k\left|(\nabla_\theta B(\theta))_k\right| = \sum_{k=0}^{K}\mathbb{E}\left|\sum_{m=0}^{K}\theta_m(-1)^{k+m}\right|
    = \sum_{k=0}^{K}\mathbb{E}\left|\sum_{m=0}^{K}\theta_m\right| = (K+1)^{3/2}. \tag{7.36}$$


    This brings us to the rough estimate that


    $$(2K+1)^{-1}\sum_k\left|(\nabla_\theta B(\theta))_k\right|\sim\sqrt{K}.$$


    So in total we find that $\lambda_a^*\sim K^{3.5}$. Finally, for $\lambda_b^*$
    one can make the estimate that


    $$\lambda_b^*\approx \frac{2\pi\sum_{k=1}^{K}k^4}{K+1}\sim K^4. \tag{7.37}$$


    Hence it turns out that applying these different strategies leads to different
    scalings of $\lambda$ with respect to increasing $K$ for the Fourier features
    model. Despite these differences, it was observed that the resulting condition
    numbers $\kappa(\mathbf{A}(\lambda^*))$, $\kappa(\mathbf{A}(\lambda_a^*))$ and
    $\kappa(\mathbf{A}(\lambda_b^*))$ are actually very similar.'
