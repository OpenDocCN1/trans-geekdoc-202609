    X = L^p(\Omega)$ be a Banach space. For any $u, v \in \widehat{X}$, the differential
    operator $\mathcal{L}$ and restriction operator $\Psi$ satisfy


    $$\|u - v\|_{L^p(E)} \le C_{\mathrm{pd}}\big(\|\mathcal{L}(u) - \mathcal{L}(v)\|_Y^{\tau_p}
    + \|\Psi(u) - \Psi(v)\|_Z^{\tau_d}\big)\tag{5.28}$$


