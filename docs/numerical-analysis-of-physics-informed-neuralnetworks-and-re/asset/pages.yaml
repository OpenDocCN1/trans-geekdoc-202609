    function $g = 1$ is a valid choice. Note that this initialization has primarily
    been proposed with a supervised learning setting in mind, e.g. when using a square
    loss such as $\int_{\Omega}(u_\theta - u)$. For the different loss functions of
    Section 2.3, different initialization schemes might be better suited. This will
    be discussed in Section 7.


    Finally, it is customary to retrain neural network with different starting values
    $\theta_0$ (drawn from the same distribution) as the gradient-based optimizer
    might converge to a different local minimum for each $\theta_0$. One can then
    choose the ‘best’ neural network based on some suitable criterion, or combine
    the different neural networks if the setting allows. Also note that this task
    can be performed in parallel.


    # 2.6. Summary of algorithm


    We summarize the physics-informed learning algorithm as follows.


    +   (1) Choose a model class $\{u_\theta : \theta \in \Theta\}$ (Section 2.2).

    +   (2) Choose a loss function based on the classical, weak or variational formulation
    of the PDE (Section 2.3).

    +   (3) Generate a training set $\mathcal{S}$ based on a suitable quadrature rule
    to obtain a feasibly computable loss function $\mathcal{J}(\theta, \mathcal{S})$
    (Section 2.4).

    +   (4) Initialize the model parameters and run an optimization algorithm from
    Section 2.5 until an approximate local minimum $\theta^*(\mathcal{S})$ is reached.
    The resulting function $u^* := u_{\theta^*(\mathcal{S})}$ is the desired model
    for approximating the solution $u$ of the PDE (2.1).


    # 3. Analysis


    As intuitive as the physics-informed learning framework of Section 2.6 might seem,
    there is a priori little theoretical guarantee that it will actually work well.
    The aim of the next sections is therefore to theoretically analyse physics-informed
    machine learning and to give an overview of the available mathematical guarantees.


    One central element will be the development of error estimates for physics-informed
    machine learning. The relevant concept of error is the error emanating from approximating
    the solution $u$ of (2.1) by the model $u^* = u_{\theta^*(\mathcal{S})}$:


    $\mathcal{E}(\theta) := \|u - u_\theta\|_X, \quad \mathcal{E}^* := \mathcal{E}(\theta^*(\mathcal{S})).\tag{3.1}$'
