  md: 'In practice, however, this definition cannot be used, as evaluating the Fourier
    transform requires the exact computation of an integral. The practical implementation
    (i.e. discretization) of an FNO maps from and to the space of trigonometric polynomials
    of degree at most $N \in \mathbb{N}$, denoted by $L_N^2$, and can be identified
    with a finite-dimensional mapping that is a composition of affine maps and nonlinear
    layers of the form


    $$\mathcal{L}_\ell(z)_j = \sigma\left(W_\ell v_j + b_{\ell,j}\mathcal{F}_N^{-1}\left(P_\ell(k)\cdot\mathcal{F}_N(z)_{k,j}\right)\right).
    \tag{2.37}$$


    where the $P_\ell(k)$ are coefficients that define a non-local convolution operator
    via the discrete Fourier transform $\mathcal{F}_N$; see Kovachki *et al.* (2021).


    It has been observed that the proposed operator learning models above may not
    behave as operators when implemented on a computer, questioning the very essence
    of what operator learning should be. Bartolucci *et al.* (2023) contend that in
    addition to defining the operator at the continuous level, some form of continuous–discrete
    equivalence is necessary for an architecture to genuinely learn the underlying
    operator rather than just discretizations of it. To this end, they introduce the
    unifying mathematical framework of *representation-equivalent neural operators*
    (ReNOs) to ensure that operations at the continuous and discrete level are equivalent.
    Lack of this equivalence is quantified in terms of aliasing errors.


    # *Gaussian processes.*


    Deep neural networks and their operator versions are only one possible nonlinear
    surrogate model for the true solution $u$. Another popular class of nonlinear
    models is *Gaussian process regression* (Rasmussen 2003), which belongs to a larger
    class of so-called Bayesian models. Gaussian process regression (GPR) relies on
    the assumption that $u$ is drawn from a Gaussian measure on a suitable function
    space, parametrized by


    $$u_\theta(x) \sim \mathrm{GP}\bigl(m_\theta(x), k_\theta(x,x'')\bigr), \tag{2.38}$$


    where $m_\theta(x)=\mathbb{E}[u_\theta(x)]$ is the mean, and the underlying covariance
    function is given by $k_\theta(x,x'')=\mathbb{E}[(u_\theta(x)-m_\theta(x))(u_\theta(x'')-m_\theta(x''))]$.


    Popular choices for the covariance function in (2.38) are the squared exponential
    kernel (which is a radial function as for RBFs) and Matérn covariance functions:


    $$k_{\mathrm{SE}}(x,x'')=\exp\left(-\frac{\lVert x-x''\rVert^2}{2\ell^2}\right),
    \tag{2.39}$$


    $$k_{\mathrm{Matern}}(x,x'')=\frac{2^{1-\nu}}{\Gamma(\nu)}\left(\sqrt{2\nu}\frac{\lVert
    x-x''\rVert}{\ell}\right)^\nu K_\nu\left(\sqrt{2\nu}\frac{\lVert x-x''\rVert}{\ell}\right).
    \tag{2.40}$$


    Here $\lVert\cdot\rVert$ denotes the standard Euclidean norm, $K_\nu$ is the modified
    Bessel function of the second kind and $\ell$ the *characteristic length*, describing
    the length scale of the correlations between the points $x$ and $x''$. The parameter
    vector then consists of the hyperparameters of $m_\theta$ and $k_\theta$, such
    as $\nu$ and $\ell$.'
