    **Theorem 4.24.** For every $\sigma,\,\varepsilon>0$ and $d\in\mathbb{N}$, there
    is a tanh neural network $u_\theta$ of depth $O(\operatorname{depth}(u_0))$ and
    width


    $$O\left(\operatorname{poly}(d\rho_d)\varepsilon^{-(2+\beta)\frac{r+\sigma}{r-2}\frac{s+1}{s-1}\frac{1+\sigma}{s-1}}\right)$$


    such that


    $$\|\mathcal{L}(u_\theta)\|_{L^2([0,T]\times[0,1]^d)}+\|u_\theta-u\|_{L^2(\partial([0,T]\times[0,1]^d))}\leq\varepsilon.\tag{4.22}$$


    # **Example 4.25 (nonlinear parabolic PDEs).**


    Next, we consider nonlinear parabolic PDEs as in (4.23), which typically arise
    in the context of nonlinear diffusion–reaction equations that describe the change
    in space and time of some quantities, such as in the well-known Allen–Cahn equation
    (Allen and Cahn 1979). Let $s,r\in\mathbb{N}$, and for $u_0\in\mathcal{X}\subset
    C^r(\mathbb{T}^d)$ let $u\in C^{(s,r)}([0,T]\times\mathbb{T}^d)$ be the solution
    of


    $$\mathcal{L}(u)(x,t)=\partial_tu(t,x)-\Delta_xu(t,x)-F(u(t,x))=0,\qquad u(0,x)=u_0(x),\tag{4.23}$$


    for all $(t,x)\in[0,T]\times D$, with period boundary conditions, where $F:\mathbb{R}\to\mathbb{R}$
    is a polynomial. As in Example 4.23, we assume that $\|u\|_{C^{(s,2)}([0,T]\times\mathbb{T}^d)}$
    grows at most polynomially in $d$, and that for every $\varepsilon>0$ there is
    a neural network $\hat u_0$ of width $O(\operatorname{poly}(d)\varepsilon^{-\beta})$
    such that $\|u_0-\hat u_0\|_{L^\infty(\mathbb{T}^d)}<\varepsilon$.


    Hutzenthaler, Jentzen, Kruse and Nguyen (2020) have proved that ReLU neural networks
    overcome the CoD in the approximation of $u(T)$. Using Theorem 4.20 we can now
    prove that PINNs overcome the CoD for nonlinear parabolic PDEs (De Ryck and Mishra
    2022b, Theorem 4.4).


    **Theorem 4.26.** For every $\sigma,\,\varepsilon>0$ and $d\in\mathbb{N}$, there
    is a tanh neural network $u_\theta$ of depth $O(\operatorname{depth}(u_0)+\operatorname{poly}(d)\ln(1/\varepsilon))$
    and width


    $$O\left(\operatorname{poly}(d)\varepsilon^{-(2+\beta)\frac{r+\sigma}{r-2}\frac{s+1}{s-1}\frac{1+\sigma}{s-1}}\right)$$


    such that


    $$\|\mathcal{L}(u_\theta)\|_{L^2([0,T]\times\mathbb{T}^d)}+\|u-u_\theta\|_{L^2(\partial([0,T]\times\mathbb{T}^d))}\leq\varepsilon.\tag{4.24}$$


    Similarly, one can use the results of this section to obtain estimates for (physics-informed)
    DeepONets for nonlinear parabolic PDEs (4.23) such as the Allen–Cahn equation.
    In particular, a dimension-independent convergence rate can be obtained if the
    solution is smooth enough, improving upon the result of Lanthaler, Mishra and
    Karniadakis (2022), which incurred the CoD. For simplicity, we present results
    for $C^{(2,r)}$ functions, rather than $C^{(s,r)}$ functions, as we found that
    assuming more regularity did not necessarily improve the convergence rate further
    (De Ryck and Mishra 2022b, Theorem 4.5).


    **Theorem 4.27.** Let $\mathcal{G}:\mathcal{X}\to C^r(\mathbb{T}^d):u_0\mapsto
    u(T)$ and $\mathcal{G}^\star:\mathcal{X}\to C^{(2,r)}([0,T]\times\mathbb{T}^d):u_0\mapsto
    u$. For every $\sigma,\,\varepsilon>0$, there exists a DeepONet $\mathcal{G}_\theta^\star$
    such that


    $$\|\mathcal{L}(\mathcal{G}_\theta^\star)\|_{L^2([0,T]\times\mathbb{T}^d\times\mathcal{X})}\leq\varepsilon.\tag{4.25}$$'
