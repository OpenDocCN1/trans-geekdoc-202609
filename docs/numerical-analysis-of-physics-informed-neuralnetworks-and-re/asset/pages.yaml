  md: '# Example 2.3 (viscous and inviscid scalar conservation laws).


    We consider the following one-dimensional version of *viscous scalar conservation
    laws* as a model problem for quasilinear, convection-dominated diffusion equations:


    $\begin{cases} u_t + f(u)_x = \nu u_{xx} & \text{for all } x \in (0,1),\ t \in
    [0,T], \\ u(x,0)=u_0(x) & \text{for all } x \in (0,1), \\ u(0,t)=u(1,t)\equiv
    0 & \text{for all } t \in [0,T]. \end{cases}$ (2.9)


    Here, $u_0 \in C^k([0,1])$, for some $k \ge 1$, is the initial data and we consider
    zero Dirichlet boundary conditions. Note that $0 < \nu \ll 1$ is the viscosity
    coefficient. The flux function is denoted by $f \in C^k(\mathbb{R};\mathbb{R})$.
    One can follow standard textbooks such as that of Godlewski and Raviart (1991)
    to conclude that as long as $\nu > 0$, there exists a classical solution $u \in
    C^k([0,T)\times[0,1])$ of the viscous scalar conservation law (2.9).


    It is often interesting to set $\nu = 0$ and consider the *inviscid scalar conservation
    law*


    $u_t + f(u)_x = 0.$ (2.10)


    In this case, the solution might no longer be continuous, as it can develop shocks,
    even for smooth initial data (Holden and Risebro 2015).


    # Example 2.4 (Poisson’s equation).


    Finally, we consider a prototypical elliptic PDE. Let $\Omega \subset \mathbb{R}^d$
    be a bounded open set that satisfies the exterior sphere condition, let $f \in
    C^1(\Omega) \cap L^\infty(\Omega)$ and let $g \in C(\partial\Omega)$. Then there
    exists $u \in C^2(\Omega) \cap C(\overline{\Omega})$ that satisfies Poisson’s
    equation:


    $\begin{cases} -\Delta u = f & \text{in } \Omega, \\ u = g & \text{on } \partial\Omega.
    \end{cases}$ (2.11)


    Moreover, if $f$ is smooth then $u$ is smooth in $\Omega$.


    # 2.1.2. Inverse problems


    Secondly, we consider settings where we do not have complete information on the
    inputs to the PDE (2.1) (e.g. initial data, boundary conditions and parameter
    coefficients). As a result, the forward problem cannot be solved uniquely. However,
    when we have access to (noisy) data for (observables of) the underlying solution,
    we can attempt to determine the unknown inputs of the PDEs and consequently its
    solution. Problems with the aim of recovering the PDE input based on data are
    referred to as *inverse problems*.


    We will mainly consider one kind of inverse problem, namely the *unique continuation
    problem* (for time-dependent problems also known as the *data assimilation problem*).
    Recall the abstract PDE $\mathcal{L}[u] = f$ in $\Omega$ (2.1). Moreover, we adopt
    the assumptions (2.2) of the introduction to this subsection. The difference from
    the forward problem is that we now have incomplete information on the boundary
    conditions. As a result, a unique solution to the PDE does not exist. Instead,
    we assume'
