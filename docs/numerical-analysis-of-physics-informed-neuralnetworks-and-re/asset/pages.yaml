  md: 'Moreover, for $\mathcal{G}_\theta^*$ we have $O\left(\epsilon^{-\frac{(3+\sigma)d}{r-2}}\right)$
    sensors and


    $$\begin{aligned}

    \text{width}(\beta) &= O\left(\epsilon^{-1-\frac{(3+\sigma)(d+r+2\beta)}{r-2}}\right),
    & \text{depth}(\beta) &= O(\ln(1/\epsilon)),\\

    \text{width}(\tau) &= O\left(\epsilon^{-1-\frac{(3+\sigma)(d+1)}{r-2}}\right),
