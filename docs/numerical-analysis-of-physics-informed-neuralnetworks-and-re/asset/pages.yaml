    Let $m,n\in\mathbb{N}$, $1\le q<\infty$ and let $u:[0,1]\times[0,T]\to\mathbb{R}$
    be a function that is piecewise $C^m$-smooth and with a $C^n$-smooth discontinuity
    surface. Then there is a tanh neural network $\hat u$ with at most three hidden
    layers and $O(\epsilon^{-2/m+\epsilon^{-q/n}})$ neurons such that


    $$

    \|u-\hat u\|_{L^q([0,1]\times[0,T])}\le \epsilon. \tag{4.13}

