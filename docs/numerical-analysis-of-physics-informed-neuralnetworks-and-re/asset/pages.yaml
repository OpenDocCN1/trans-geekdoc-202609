- pgno: 6
  md: 'that we have access to (possibly noisy) measurements of a certain observable


    $$\Psi(u) = g \quad \text{in } \Omega'', \tag{2.12}$$


    where $\Omega'' \subset \Omega$ is the observation domain, $g$ is the measured
    data, and $\Psi: X^* \to Z^*$, where $Z^*$ is some Banach space. We make the assumption
    that


    $$\|\Psi(u)\|_{Z^*} < +\infty \quad \text{for all } u \in X^*, \text{ with } \|u\|_{X^*}
    < +\infty,$$

    $$\|g\|_{Z^*} < +\infty. \tag{2.13}$$


    If $\Omega''$ includes the boundary of $\Omega$, meaning that we have measurements
    on the boundary, then it is again feasible to just use the standard framework
    for forward problems. However, this is often not possible. In heat transfer problems,
    for example, the maximum temperature will be reached at the boundary. As a result,
    it might be too hot near the boundary to place a sensor there and we will only
    have measurements that are far enough away from the boundary. Fortunately, we
    can adapt the physics-informed framework to retrieve an approximation to $u$ based
    on $f$ and $g$.


    In analogy with operator learning for forward problems, we can also attempt to
    entirely learn the inverse operator


    $$\mathcal{G}^{-1}: Z^* \to X^*: \Psi[u] = g \mapsto \mathcal{G}^{-1}[g] = v,
    \tag{2.14}$$


    where $v$ could for instance be the boundary conditions, the parameter function
    $a$ or the input/source function $f$.


    # Example 2.5 (heat equation).


    We revisit the heat equation $u_t - \Delta u = f$ with zero Dirichlet boundary
    conditions and $f \in L^2(\Omega)$, where $\Omega = D \times (0,T)$. We assume
    that $u \in H^1((0,T); H^{-1}(D)) \cap L^2((0,T); H^1(D))$ will solve the heat
    equation in a weak sense. The heat equation would have been well-posed if the
    initial conditions, i.e. $u_0 = u(x,0)$, had been specified. Recall that the aim
    of the data assimilation problem is to infer the initial conditions and the entire
    solution field at later times from some measurements of the solution in time.
    To model this, we consider the following *observables*:


    $$\Psi[u] := u = g \quad \text{for all } (x,t) \in D'' \times (0,T) := \Omega'',
    \tag{2.15}$$


    for some open, simply connected observation domain $D'' \subset D$ and for $g
    \in L^2(\Omega'')$. Thus, solving the data assimilation problem for the heat equation
    amounts to finding the solution $u$ of the heat equation in the whole space–time
    domain $\Omega = D \times (0,T)$, given data on the observation subdomain $\Omega''
    = D'' \times (0,T)$.


    # Example 2.6 (Poisson equation).


    We revisit the Poisson equation (Example 2.4), but now with data on a subdomain
    of $\Omega$:


    $$- \Delta u = f \quad \text{in } \Omega \subset \mathbb{R}^d, \quad u|_{\Omega''}
    = g \quad \text{in } \Omega'' \subset \Omega. \tag{2.16}$$


    In this case the observable $\Psi$ introduced in (2.12) is the identity $\Psi[u]
    = u$.'
