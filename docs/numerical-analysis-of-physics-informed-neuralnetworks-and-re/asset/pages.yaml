    # Appendix: Sobolev spaces


    Let $d \in \mathbb{N}$, $k \in \mathbb{N}_0$, $1 \le p \le \infty$ and let $\Omega
    \subseteq \mathbb{R}^d$ be open. For a function $f : \Omega \to \mathbb{R}$ and
    a (multi-) index $\alpha \in \mathbb{N}_0^d$, we let


    $$D^{\alpha} f = \frac{\partial^{|\alpha|} f}{\partial x_1^{\alpha_1} \cdots \partial
    x_d^{\alpha_d}}\tag{A.1}$$


    denote the classical or distributional (i.e. weak) derivative of $f$. We let $L^p(\Omega)$
    denote the usual Lebesgue space, and we define the Sobolev space $W^{k,p}(\Omega)$
    as


    $$W^{k,p}(\Omega) = \{f \in L^p(\Omega) : D^{\alpha} f \in L^p(\Omega) \text{
    for all } \alpha \in \mathbb{N}_0^d \text{ with } |\alpha| \le k\}.\tag{A.2}$$


    We define the following seminorms on $W^{k,p}(\Omega)$: for $p < \infty$,


    $$|f|_{W^{m,p}(\Omega)} = \left(\sum_{|\alpha|=m} \|D^{\alpha} f\|_{L^p(\Omega)}^p\right)^{1/p}
    \quad \text{for } m = 0,\dots,k,\tag{A.3}$$


    and for $p = \infty$,


    $$|f|_{W^{m,\infty}(\Omega)} = \max_{|\alpha|=m} \|D^{\alpha} f\|_{L^{\infty}(\Omega)}
    \quad \text{for } m = 0,\dots,k.\tag{A.4}$$


    Based on these seminorms, we can define the following norms: for $p < \infty$,


    $$\|f\|_{W^{k,p}(\Omega)} = \left(\sum_{m=0}^{k} |f|_{W^{m,p}(\Omega)}^p\right)^{1/p},\tag{A.5}$$


    and for $p = \infty$,


    $$\|f\|_{W^{k,\infty}(\Omega)} = \max_{0 \le m \le k} |f|_{W^{m,\infty}(\Omega)}.\tag{A.6}$$


    The space $W^{k,p}(\Omega)$ equipped with the norm $\|\cdot\|_{W^{k,p}(\Omega)}$
    is a Banach space.


    We let $C^k(\Omega)$ denote the space of functions that are $k$ times continuously
    differentiable, and equip this space with the norm $\|f\|_{C^k(\Omega)} = \|f\|_{W^{k,\infty}(\Omega)}$.


