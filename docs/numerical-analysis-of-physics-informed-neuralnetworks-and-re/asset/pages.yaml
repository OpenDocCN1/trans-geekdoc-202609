    it holds that $\mathcal{E}_{G}(\widehat{\theta}) < \epsilon$? As minimizing the
    generalization error (i.e. the physics-informed loss) is the key pillar of physics-informed
    learning, obtaining a positive answer to this question is of the utmost importance.
    Moreover, it would be desirable to relate the size of the parameter space $\Theta$
    (or hypothesis class) to the accuracy $\epsilon$. For example, for linear models
