- pgno: 41
  md: '# 5. **Stability**


    Next, we investigate whether a small physics-informed loss implies a small total
    error, often the $L^2$-error, as formulated in the following question.


    **Question 2 (Q2).** Given that a model $\mu_\theta$ has a small generalization
    error $\mathcal{E}_G(\theta)$, will the corresponding total error $\mathcal{E}(\theta)$
    be small as well?


    In the general results we will focus on physics-informed loss functions based
    on the strong (classical) formulation of the PDE, but we also give some examples
    when the loss is based on the weak solution (Example 5.8) or the variational solution
    (Example 5.11). We first look at stability results for forward problems (Section
    5.1) and afterwards for inverse problems (Section 5.2).


    # 5.1. *Stability for forward problems*


    We investigate whether a small PDE residual implies that the total error (3.1)
    will be small as well (Question 2). Such a stability bound can be formulated as
    the requirement that for any $u,v\in X^*$, the differential operator $\mathcal{L}$
    satisfies


    $$\|u-v\|_X \le C_{\mathrm{PDE}}\|\mathcal{L}(u)-\mathcal{L}(v)\|_Y, \tag{5.1}$$


    where the constant $C_{\mathrm{PDE}}>0$ is allowed to depend on $\|u\|_{X^*}$
    and $\|v\|_{X^*}$.


    As a first example of a PDE with solutions satisfying (5.1), we consider a linear
    differential operator $\mathcal{L}:X\to Y$, i.e. $\mathcal{L}(\alpha u+\beta v)=\alpha\mathcal{L}(u)+\beta\mathcal{L}(v)$,
    for any $\alpha,\beta\in\mathbb{R}$. For simplicity, let $X^*=X$ and $Y^*=Y$.
    By (5.1) the existence and uniqueness of the underlying linear PDE (2.1), there
    exists an *inverse* operator $\mathcal{L}^{-1}:Y\to X$. Note that the assumption
    (5.1) is satisfied if the inverse is bounded i.e. $\|\mathcal{L}^{-1}\|_{\mathrm{op}}\le
    C<+\infty$, with respect to the natural norm on linear operators from $Y$ to $X$.
    Thus the assumption (5.1) on stability boils down to the boundedness of the inverse
    operator for linear PDEs. Many well-known linear PDEs possess such bounded inverses
    (Dautray and Lions, 1992).


    As a second example, we will consider a nonlinear PDE (2.1), but with a well-defined
    linearization, that is, there exists an operator $\overline{\mathcal{L}}:X^*\mapsto
    Y^*$, such that


    $$\mathcal{L}(u)-\mathcal{L}(v)=\overline{\mathcal{L}}_{(u,v)}(u-v)\quad\text{for
    all }u,v\in X^*. \tag{5.2}$$


    Again for simplicity, we will assume that $X^*=X$ and $Y^*=Y$. We further assume
    that the inverse of $\overline{\mathcal{L}}$ exists and is bounded in the following
    manner:


    $$\|\overline{\mathcal{L}}^{-1}_{(u,v)}\|_{\mathrm{op}}\le C(\|u\|_X,\|v\|_X)<+\infty\quad\text{for
    all }u,v\in X, \tag{5.3}$$


    with the norm of $\overline{\mathcal{L}}^{-1}$ being an operator norm, induced
    by linear operators from $Y$ to $X$. Then a straightforward calculation shows
    that (5.3) suffices to establish the stability bound (5.1).


    We summarize our findings with the following informal theorem.'
  merge: -1
