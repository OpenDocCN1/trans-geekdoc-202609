  md: 'defined for instance on $u\in H^1(\Omega)$; then the corresponding Hermitian
    square is $\mathcal{A}u=\Delta^2u$, identified as the *bi-Laplacian* that is well-defined
    on $u\in H^2(\Omega)$.


    Next, for notational simplicity, we consider a loss function that only consists
    of the integral of the squared PDE residual (2.41) and omit boundary terms in
    the following. Let $\mathcal{H}$ be the span of the functions $\phi_k=\partial_{\theta_k}u(\cdot;\theta)$.
    Define the maps $T:\mathbb{R}^n\to\mathcal{H}$, $v\mapsto\sum_{k=1}^n v_k\phi_k$
    and $T^*:L^2(\Omega)\to\mathbb{R}^n$, $f\mapsto\{\langle\phi_k,f\rangle\}_{k=1,\ldots,n}$.
    We define the following scalar product on $L^2(\Omega)$:


    $$\langle f,g\rangle_{\mathcal{H}}:=\langle f,TT^*g\rangle_{L^2(\Omega)}=\langle
    T^*f,T^*g\rangle_{\mathbb{R}^n}. \tag{7.23}$$


    Note that the maps $T,T^*$ provide a correspondence between the continuous space
    $(L^2)$ and discrete space $(\mathcal{H})$ spanned by the functions $\phi_k$.
    This continuous–discrete correspondence allows us to relate the conditioning of
    the matrix $\mathbf{A}$ in (7.13) to the conditioning of the Hermitian square
    operator $\mathcal{A}=\mathcal{L}^*\mathcal{L}$ via the following theorem (De
    Ryck *et al.* 2023).


    **Theorem 7.10.** It holds for the operator $\mathcal{A}\circ TT^*:L^2(\Omega)\to
    L^2(\Omega)$ that $\kappa(\mathcal{A})\geq\kappa(\mathcal{A}\circ TT^*)$. Moreover,
    if the Gram matrix $\langle\phi,\phi\rangle_{\mathcal{H}}$ is invertible then
    equality holds, i.e. $\kappa(\mathbf{A})=\kappa(\mathcal{A}\circ TT^*)$.


    Thus we show that the conditioning of the matrix $\mathbf{A}$ that determines
    the speed of convergence of the simplified gradient descent algorithm (7.16) for
    physics-informed machine learning is intimately tied to the conditioning of the
    operator $\mathcal{A}\circ TT^*$. This operator, in turn, composes the Hermitian
    square of the underlying differential operator of the PDE (2.1), with the so-called
    *kernel integral operator* $TT^*$, associated with the (neural) tangent kernel
    $\Theta[u_\theta]$. Theorem 7.10 implies in particular that if the operator $\mathcal{A}\circ
    TT^*$ is ill-conditioned, then the matrix $\mathbf{A}$ is ill-conditioned and
    the gradient descent algorithm (7.16) for physics-informed machine learning will
    converge very slowly.


    **Remark 7.11.** One can readily generalize Theorem 7.10 to the setting with boundary
    conditions, i.e. with $\lambda>0$ in the loss (7.10). In this case one can prove
    for the operator $\mathcal{A}=\mathbb{1}_{\Omega}\circ\mathcal{L}^*\mathcal{L}+\lambda\mathbb{1}_{\partial\Omega}\circ\mathrm{Id}$,
    and its corresponding matrix $\mathbf{A}$ (as in (7.13)) that $\kappa(\mathbf{A})\geq\kappa(\mathcal{A}\circ
    TT^*)$, where equality holds if the relevant Gram matrix is invertible. More details
    can be found in De Ryck *et al.* (2023, Appendix A.6).


    It is instructive to compare physics-informed machine learning with standard supervised
    learning through the prism of the analysis presented here. It is straightforward
    to see that for supervised learning, i.e. when the physics-informed loss is replaced
    by the supervised loss $\frac{1}{2}\|u-u_\theta\|_{L^2(\Omega)}^2$ by simply setting
    $\mathcal{L}=\mathrm{Id}$, the corresponding operator in Theorem 7.10 is simply
    the kernel integral operator $TT^*$, associated with the tangent kernel as $\mathcal{A}=\mathrm{Id}$.
    Thus the complexity in training physics-informed machine learning models is entirely
    due to the spectral properties of the Hermitian square $\mathcal{A}$ of the underlying
    differential operator $\mathcal{L}$.'
