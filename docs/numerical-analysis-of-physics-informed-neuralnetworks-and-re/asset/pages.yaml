  md: '+   - The first framework is tailored to time-dependent PDEs and considers
    initial conditions and PDE solutions that are Sobolev-regular (or continuously
    differentiable). The crucial assumption is that one must be able to approximate
    the initial condition $u_0$ with a neural network, without incurring the CoD,
    i.e. approximate it to accuracy $\epsilon$ with a network of size $O(d^{\alpha}
    \epsilon^{-\beta})$ with $\alpha,\beta > 0$ independent of $d$. This framework
    can also be used to prove results for (physics-informed) operator learning.

    +   - The second framework circumvents this assumption by considering PDE solutions
    that belong to a smaller space, namely the so-called *Barron space*. It can be
    proved that functions in this space can be approximated without the curse of dimensionality.
    Hence, in this case the challenge lies in proving that the PDE solution is indeed
    a *Barron function*.


    # 4.3.1. Results based on Sobolev- and $C^k$-regularity


    We initially direct our focus onto the first framework. To start with, we give
    particular attention to the case where it is known that a neural network can efficiently
    approximate the solution to a time-dependent PDE at a fixed time. Such neural
    networks are usually obtained by emulating a classical numerical method. Examples
    include finite difference schemes, finite volume schemes, finite element methods,
    iterative methods and Monte Carlo methods (e.g. Jentzen, Salimova and Welti 2021,
    Opschoor, Petersen and Schwab 2020, Chen, Lu and Lu 2021, Marwah, Lipton and Risteski
    2021). In these cases Theorem 4.11 cannot be directly applied, as there is no
    upper bound for $\|u - u_\theta\|_{L^q(D\times[0,T])}$. To allow for a further
    generalization to operator learning, we will write down the following assumption
    in terms of operators (see Section 2.1.1).


    More precisely, for $\epsilon > 0$, we assume that we have access to an operator
    $\mathcal{U}^\epsilon : \mathcal{X} \times [0,T] \to \mathcal{H}$ that, for any
    $t \in [0,T]$, maps any initial condition/parameter function $v \in \mathcal{X}$
    to a neural network $\mathcal{U}^\epsilon(v,t)$ that approximates the PDE solution
    $\mathcal{G}(v)(\cdot,t) = u(\cdot,t) \in L^q(D), q \in \{2,\infty\}$, at time
    $t$, as specified below. Moreover, we will assume that we know how its size depends
    on the accuracy $\epsilon$.


    **Assumption 4.19.** Let $q \in \{2,\infty\}$. For any $B, \epsilon > 0$, $\ell
    \in \mathbb{N}$, $t \in [0,T]$ and any $v \in \mathcal{X}$ with $\|v\|_{C^\ell}
    \le B$, there exist a neural network $\mathcal{U}^\epsilon(v,t): D \to \mathbb{R}$
    and a constant $C_{\epsilon,\ell}^B > 0$ such that


    $\|\mathcal{U}^\epsilon(v,t) - \mathcal{G}(v)(\cdot,t)\|_{L^q(D)} \le \epsilon
    \quad \text{and} \quad \max_{t \in [0,T]} \|\mathcal{U}^\epsilon(v,t)\|_{W^{\ell,q}(D)}
    \le C_{\epsilon,\ell}^B. \quad (4.15)$


    For vanilla neural networks and PINNs, however, we can always set $\mathcal{X}
    := \{v\}$, with $v := u_0$ or $v := a$ and $\mathcal{G}(v) := u$ in Assumption
    4.19 above.


    Under Assumption 4.19, the existence of space–time neural networks that minimize
    the generalization error $\mathcal{E}_G$ (i.e. the physics-informed loss) can
    be proved (De Ryck and Mishra 2022b).'
