- pgno: 4
  md: 'where $\mathcal{X}=W^*$ and $v = u_0$. Alternatively, one can also consider
    the mapping $u_0 \mapsto u(\cdot,T)$.


    A final example of operator learning can be found in parametric PDEs, where the
    differential operator, source function, initial condition or boundary condition
    depends on scalar parameters or a parameter function. Although solving parametric
    PDEs is usually not called operator learning, it is evident that it can be identified
    as such, the only difference being that the input space is not necessarily infinite-dimensional.


    In what follows we give examples of PDEs (2.1) for which we will consider the
    forward problem later on.


    # Example 2.1 (semilinear heat equation).


    We first consider the set-up of the semilinear heat equation. Let $D \subset \mathbb{R}^d$
    be an open connected bounded set with a continuously differentiable boundary $\partial
    D$. The semilinear parabolic equation is then given by


    $$\begin{cases} u_t = \Delta u + f(u) & \text{for all } x \in D,\ t \in (0,T),
    \\ u(x,0)=u_0(x) & \text{for all } x \in D, \\ u(x,t)=0 & \text{for all } x \in
    \partial D,\ t \in (0,T). \end{cases}\tag{2.6}$$


    Here, $u_0 \in C^k(D)$, $k \ge 2$, is the initial data, $u \in C^k([0,T] \times
    D)$ is the classical solution and $f : \mathbb{R} \times \mathbb{R}$ is the nonlinear
    source (reaction) term. We assume that the nonlinearity is globally Lipschitz,
    that is, there exists a constant $C_f > 0$ such that


    $$|f(v)-f(w)| \le C_f |v-w| \quad \text{for all } v,w \in \mathbb{R}.\tag{2.7}$$


    In particular, the homogeneous linear heat equation with $f(u) \equiv 0$ and the
    linear source term $f(u)=\alpha u$ are examples of (2.6). Semilinear heat equations
    with globally Lipschitz nonlinearities arise in several models in biology and
    finance (Beck et al. 2021). The existence, uniqueness and regularity of the semilinear
    parabolic equations with Lipschitz nonlinearities such as (2.6) can be found in
    classical textbooks such as that of Friedman (1964).


    # Example 2.2 (Navier–Stokes equations).


    We consider the well-known incompressible Navier–Stokes equations (Temam 2001
    and references therein)


    $$\begin{cases} u_t + u \cdot \nabla u + \nabla p = \nu \Delta u & \text{in }
    D \times [0,T], \\ \operatorname{div}(u)=0 & \text{in } D \times [0,T], \\ u(t=0)=u_0
    & \text{in } D. \end{cases}\tag{2.8}$$


    Here, $u: D \times [0,T] \to \mathbb{R}^d$ is the fluid velocity, $p: D \times
    [0,T] \to \mathbb{R}$ is the pressure and $u_0: D \to \mathbb{R}^d$ is the initial
    fluid velocity. The viscosity is denoted by $\nu \ge 0$. For the rest of the paper,
    we consider the Navier–Stokes equations (2.8) on the $d$-dimensional torus $D
    = \mathbb{T}^d = [0,1)^d$ with periodic boundary conditions.'
