- pgno: 3
  md: 'classes are introduced. In Section 2.3 we introduce variations of physics-informed
    learning based on different formulations of PDEs, of which the resulting residuals
    will constitute the physics-informed loss function by being discretized (Section
    2.4) and optimized (Section 2.5). Finally, a summary of the whole method is given
    in Section 2.6.


    # ## 2.1. PDE setting


    Throughout this article, we consider the following setting. Let $X$, $Y$, $W$
    be separable Banach spaces with norms $\|\cdot\|_X$, $\|\cdot\|_Y$ and $\|\cdot\|_W$,
    respectively, and analogously let $X^* \subset X$, $Y^* \subset Y$ and $W^* \subset
    W$ be closed subspaces with norms $\|\cdot\|_{X^*}$, $\|\cdot\|_{Y^*}$ and $\|\cdot\|_{W^*}$,
    respectively. Typical examples of such spaces include $L^p$ and Sobolev spaces.
    We consider PDEs of the abstract form


    $$\mathcal{L}[u] = f, \qquad \mathcal{B}[u] = g, \tag{2.1}$$


    where $\mathcal{L}: X^* \to Y^*$ is a *differential operator* and $f \in Y^*$
    is an *input* or *source function*. The boundary conditions (including the initial
    condition for time-dependent PDEs) are prescribed by the *boundary operator* $\mathcal{B}:
    X^* \to W^*$ and the boundary data $g \in W^*$. We assume that for all $f \in
    Y^*$ there exists a unique $u \in X^*$ such that (2.1) holds. Finally, we assume
    that for all $u \in X^*$ and $f \in Y^*$, we have


    $$\|\mathcal{L}[u]\|_{Y^*} < +\infty, \qquad \|f\|_{Y^*} < +\infty, \qquad \|\mathcal{B}[u]\|_{W^*}
    < +\infty. \tag{2.2}$$


    We will also denote the domain of $u$ as $\Omega$, where either $\Omega = D \subset
    \mathbb{R}^d$ for time-independent PDEs or $\Omega = D \times [0,T] \subset \mathbb{R}^{d+1}$
    for time-dependent PDEs.


    # ### 2.1.1. Forward problems


    The forward problem for the abstract PDE (2.1) amounts to the following: given
    a source $f$ and boundary conditions $g$ (and potentially another parameter function
    $a$ such that $\mathcal{L} := \mathcal{L}_a$), find the solution $u$ of the PDE.
    This can be summarized as finding an *operator* that maps an input function $v
    \in \{f,g,a\} \subset \mathcal{X}$ to the corresponding solution $u \in X^*$ of
    the PDE


    $$\mathcal{G}: \mathcal{X} \to X^*: v \mapsto \mathcal{G}[v] = u. \tag{2.3}$$


    Note that it can also be interesting to determine the whole operator $\mathcal{G}$
    rather than just the function $u$. Finding a good approximation of $\mathcal{G}$
    is referred to as *operator learning*. A first concrete example of an operator
    would be the mapping between the input or source function $f$ and the corresponding
    solution $u$, and hence $\mathcal{X} = Y^*$ and $v=f$:


    $$\mathcal{G}: Y^* \to X^*: f \mapsto \mathcal{G}[f] = u. \tag{2.4}$$


    Another common example for a time-dependent PDE, where $\mathcal{B}[u] = g$ entails
    the prescription of the initial condition $u(\cdot,0) = u_0$, is the *solution
    operator* that maps the initial condition $u_0$ to the solution of the PDE


    $$\mathcal{G}: W^* \to X^*: u_0 \mapsto \mathcal{G}[u_0] = u, \tag{2.5}$$'
