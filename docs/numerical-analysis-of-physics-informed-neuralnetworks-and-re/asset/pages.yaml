  md: 'given by


    $$\sum_{i=1}^n \theta_i \int_{\Omega} \psi_k \mathcal{L}(\phi_i) = \int_{\Omega}
    \psi_k f \quad \text{for } 1 \le k \le K, \tag{2.20}$$


    where either $\psi_k = \phi_k$, resulting in the *Galerkin method*, or $\psi_k
    = \delta_{x_k}$ with $x_k \in \Omega$, resulting in the *collocation method*,
    or the more general case where the $\psi_k$ and $\phi_k$ are distinct (and also
    not Dirac deltas), which is referred to as the *Petrov–Galerkin method*. In the
    collocation method, the choice of so-called collocation points $\{x_k\}_k$ depends
    on the functions $\phi_i$. Boundary conditions are implemented through the choice
    of the functions $\phi_i$ or by adding more equations to the above linear system.


    In marked contrast to the global basis functions of the spectral method stands
    the *finite element method* (FEM), where we consider locally defined polynomials.
    More precisely, we first divide $\Omega$ into (generally overlapping) subdomains
    $\Omega_i$ (subintervals in one dimension) of diameter at most $h$ and then consider
    on each $\Omega_i$ a piecewise defined polynomial $\phi_i$ of degree at most $p$
    that is zero outside $\Omega_i$. Much like with the spectral Galerkin method,
    we can then define a linear system of equations such as (2.20) that needs to be
    solved to find the optimal parameter vector $\theta^*$. As $\phi_i$ is now non-smooth
    on $\Omega$, we need to rewrite $\int_{\Omega} \phi_k \mathcal{L}(\phi_i)$ using
    integration by parts. Another key difference from the spectral method is that,
    due to the local support of the functions $\phi_i$, the linear system we have
    to solve will be sparse and have structural properties related to the choice of
    grid and polynomials. The accuracy of the approximation can be improved by reducing
    $h$ ($h$-FEM), increasing $p$ ($p$-FEM), or both ($hp$-FEM). Alternatively, the
    finite element method can also be used in combination with a squared loss, resulting
    in the *least-squares finite element method* (Bochev and Gunzburger 2009). The
    finite element method is ubiquitous in scientific computing and many variants
    can be found.


    Another choice for the functions $\phi_i$ is that of *radial basis functions*
    (RBFs); see e.g. Buhmann (2000). The key ingredient of RBFs is a radial function
    $\varphi : [0, \infty) \to \mathbb{R}$, for which it must hold for any choice
    of nodes $\{x_i\}_{1 \le i \le n} \subset \Omega$ that both (i) the functions
    $x \mapsto \phi_i(x) := \varphi(\|x - x_i\|)$ are linearly independent and (ii)
    the matrix $A$ with entries $A_{ij} = \varphi(\|x_i - x_j\|)$ is non-singular.
    Radial functions can be globally supported (e.g. Gaussians, polyharmonic splines)
    or compactly supported (e.g. bump functions). The optimal parameter $\theta^*$
    can then be determined in a Galerkin, collocation or least-squares fashion. RBFs
    are particularly advantageous as they are mesh-free (as opposed to FEM), which
    is useful for complex geometries, and straightforward to use in high-dimensional
    settings, as we can use randomly generated nodes, rather than nodes on a grid.


    Finally, RBFs with randomly generated nodes can be seen as an example of a more
    general *random feature model* (RFM), where the functions $\phi_i$ are randomly
    drawn from a chosen distribution over a function space (e.g. Rahimi and Recht
    2008). In practice we often choose the function space to be parametric itself,
    such that generating $\phi_i$ reduces to randomly drawing finite vectors $\alpha_i$
    and setting $\phi_i(x) := \phi(x; \alpha_i)$. Random feature models where $\phi_i$
    is a neural network with'
