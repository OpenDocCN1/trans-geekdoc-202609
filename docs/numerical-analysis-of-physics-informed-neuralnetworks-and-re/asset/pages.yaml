    \max_{c\in\mathcal{C}}\sup_{\varphi\in\Phi_\epsilon}\mathcal{R}(\hat u,\varphi,c)+\lambda_s\|\mathcal{R}_s[\hat
    u]\|_{L^2(\partial D\times[0,T])}^2+\lambda_t\|\mathcal{R}_t[\hat u]\|_{L^2(D)}^2\le\epsilon.
