  md: "randomly initialized weights and biases are closely connected to neural networks\
    \ of which only the outer layer is trained. When the network is large then the\
    \ latter model is often referred to as an extreme learning machine (ELM) (Huang,\
    \ Zhu and Siew 2006).\n\n# 2.2.2. Nonlinear models\n\nNeural networks. A first,\
    \ but very central, example of parametric models that depend nonlinearly on their\
    \ parameters is that of neural networks. The simplest form of a neural network\
    \ is a multilayer perceptron (MLP). MLPs get their name from their definition\
    \ as a concatenation of affine maps and activation functions. As a consequence\
    \ of this structure, the computational graph of an MLP is organized in layers.\
    \ At the kth layer, the activation function is applied component-wise to obtain\
    \ the value\n\n```\nz^k = σ(C_{k-1}(z^{k-1})) = σ(W_{k-1}z^{k-1} + b_{k-1}), (2.21)\n\
    ```\n\nwhere z^0 is the input of the network, W_k ∈ ℝ^{d_{k+1}×d_k}, b_k ∈ ℝ^{d_{k+1}}\
    \ and C_k: ℝ^{d_k} → ℝ^{d_{k+1}}: x ↦ W_k x + b_k for d_k ∈ ℕ is an affine map.\
    \ A multilayer perceptron (MLP) with L layers, activation function σ, output function\
    \ σ_o, input dimension d_in and output dimension d_out is then a function f_θ:\
    \ ℝ^{d_in} → ℝ^{d_out} of the form\n\n```\nf_θ(x) = (σ_o ∘ C_L ∘ σ ∘ ⋯ ∘ σ ∘ C_0)(x)\
    \ for all x ∈ ℝ^{d_in}, (2.22)\n```\n\nwhere σ is applied element-wise and θ =\
    \ ((W_0, b_0), …, (W_L, b_L)). The dimension d_k of each layer is also called\
    \ the width of that layer. The width of the MLP is defined as max_k d_k. Furthermore,\
    \ the matrices W_k are called the weights of the MLP and the vectors b_k are called\
    \ the biases of the MLP. Together, they constitute the (trainable) parameters\
    \ of the MLP, denoted by θ = ((W_0, b_0), …, (W_L, b_L)). Finally, an output function\
    \ σ_o can be employed to increase the interpretability of the output, but is often\
    \ equal to the identity in the setting of function approximation.\n\n# Remark\
    \ 2.8.\n\nIn some texts, the number of layers L corresponds to the number of affine\
    \ maps in the definition of f_θ. Of these L layers, the first L − 1 layers are\
    \ called hidden layers. An L-layer network in this alternative definition hence\
    \ corresponds to an (L − 1)-layer network in our definition.\n\nMany of the properties\
    \ of a neural network depend on the choice of activation function. We discuss\
