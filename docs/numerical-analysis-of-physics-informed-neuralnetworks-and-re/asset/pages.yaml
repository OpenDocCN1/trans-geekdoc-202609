    for all v. Moreover,


    width(β) = O(M(Zᵈ + Nᵈ width(ℒᵉ))), depth(β) = depth(ℒᵉ),

    width(τ) = O(M Nᵈ (N + ln(N))), depth(τ) = 3, (4.20)

    where width(ℒᵉ) = sup_{u₀∈𝒜} width(ℒᵉ)(u₀) and similarly for depth(ℒᵉ).


    Finally, we show how the results of this section can be applied to high-dimensional
    PDEs, for which it is not possible to obtain efficient approximation results using
    standard neural network approximation theory (see Theorem 4.4) as they will lead
    to convergence rates that suffer from the curse of dimensionality (CoD), meaning
    that the neural network size scales exponentially in the input dimension. In the
    literature it has been shown for some PDEs that their solution at a fixed time
    can be approximated to accuracy ε > 0 with a network that has size O(poly(d) ε^{-β}),
    with β > 0 independent of d, and therefore overcomes the CoD.


    # Example 4.23 (linear Kolmogorov PDEs).


