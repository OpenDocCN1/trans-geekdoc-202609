    **Q3. _Generalization._** Given a small training error \(\mathcal{E}_T^*\) and
    a sufficiently large training set \(\mathcal{S}\), will the corresponding generalization
    error \(\mathcal{E}_G^*\) also be small? This question is not uniquely tied to
    physics-informed machine learning and is closely tied to the accuracy of the chosen
    quadrature rule (Section 2.4). We will use standard arguments to answer this question
    in Section 6.


    **Q4. _Optimization._** Can \(\mathcal{E}_T^*\) be made sufficiently close to
    \(\min_{\theta}\mathcal{J}(\theta,\mathcal{S})\)? This final question acknowledges
    the fact that it might be very hard to solve the minimization problem (2.69),
    even approximately. Especially for physics-informed neural networks there is a
    growing literature on the settings in which the optimization problem is hard to
    solve, or even infeasible, and how to potentially overcome these training issues.
    We theoretically analyse these phenomena in Section 7.


    The above questions are of fundamental importance, as affirmative answers certify
    that the model that minimizes the optimization problem (2.69), denoted by \(u^*\),
    is a good approximation of \(u\) in the sense that the error \(\mathcal{E}^*\)
    is small. We show this by first proving an error decomposition for the generalization
    error \(\mathcal{E}_G^*\), for which we need the following auxiliary result.


    **Lemma 3.1.** For any \(\theta_1,\theta_2\in\Theta\) and training set \(\mathcal{S}\),
    we have


    \[\mathcal{E}_G(\theta_1)\leq \mathcal{E}_G(\theta_2)+2\sup_{\theta\in\Theta}\left|\mathcal{E}_T(\theta,\mathcal{S})-\mathcal{E}_G(\theta)\right|+\mathcal{E}_T(\theta_1,\mathcal{S})-\mathcal{E}_T(\theta_2,\mathcal{S}).\tag{3.5}\]


    **_Proof._** Fix \(\theta_1,\theta_2\in\Theta\) and generate a random training
    set \(\mathcal{S}\). The proof consists of the repeated adding, subtracting and
    removing of terms. We have


    \[\begin{aligned}

    \mathcal{E}_G(\theta_1) &= \mathcal{E}_G(\theta_2)+\mathcal{E}_G(\theta_1)-\mathcal{E}_G(\theta_2)\\

    &= \mathcal{E}_G(\theta_2)-\bigl(\mathcal{E}_T(\theta_1,\mathcal{S})-\mathcal{E}_G(\theta_1)\bigr)+\bigl(\mathcal{E}_T(\theta_2,\mathcal{S})-\mathcal{E}_G(\theta_2)\bigr)\\

    &\quad +\mathcal{E}_T(\theta_1,\mathcal{S})-\mathcal{E}_T(\theta_2,\mathcal{S})\\

    &\leq \mathcal{E}_G(\theta_2)+2\max_{\theta\in\{\theta_2,\theta_1\}}\left|\mathcal{E}_T(\theta,\mathcal{S})-\mathcal{E}_G(\theta)\right|\\

    &\quad +\mathcal{E}_T(\theta_1,\mathcal{S})-\mathcal{E}_T(\theta_2,\mathcal{S}).\tag{3.6}

    \end{aligned}\]


    Assuming that we can answer Q1 in the affirmative, we can now take \(\theta_1=\theta^*(\mathcal{S})\)
    and \(\theta_2=\hat{\theta}\) (as in Q1). Moreover, if we also assume that we
    can positively answer Q2, or more strongly we can find constants \(C,\alpha>0\)
    such that (3.4) holds, then we find the following error decomposition:


    \[\mathcal{E}^*\leq C\left(\underbrace{\mathcal{E}_G(\hat{\theta})}_{\text{approximation
    error}}+\underbrace{2\sup_{\theta\in\Theta}\left|\mathcal{E}_T(\theta,\mathcal{S})-\mathcal{E}_G(\theta)\right|}_{\text{generalization
    gap}}+\underbrace{\mathcal{E}_T^*-\mathcal{E}_T(\hat{\theta})}_{\text{optimization
    error}}\right)^\alpha.\tag{3.7}\]'
