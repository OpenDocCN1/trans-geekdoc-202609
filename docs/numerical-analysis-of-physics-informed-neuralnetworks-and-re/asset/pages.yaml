  md: 'For a mapping $g : \Omega \to \mathbb{R}^m$, $\Omega \subset \mathbb{R}^{\bar
    d}$, such that $g \in L^1(\Omega)$, we are interested in approximating the integral


    $\bar g := \int_{\Omega} g(y) \, dy$


    with $dy$ denoting the Lebesgue measure on $\Omega$. In order to approximate the
    above integral by a quadrature rule, we need the quadrature points $y_i \in \Omega$
    for $1 \le i \le N$, for some $N \in \mathbb{N}$ as well as weights $w_i$, with
    $w_i \in \mathbb{R}_+$. Then a quadrature is defined by


    $\mathcal{Q}_N^{\Omega}[g] := \sum_{i=1}^{N} w_i g(y_i), \quad (2.65)$


    for weights $w_i$ and quadrature points $y_i$. Depending on the choice of weights
    and quadrature points, as well as the regularity of $g$, the quadrature error
    is bounded by


    $\big|\bar g - \mathcal{Q}_N^{\Omega}[g]\big| \le C_{\text{quad}} N^{-\alpha},
    \quad (2.66)$


    for some $\alpha > 0$ and where $C_{\text{quad}}$ depends on $g$ and its properties.


    As an elementary example, we mention the *midpoint rule*. For $M \in \mathbb{N}$,
    we partition $\Omega$ into $N \sim M^d$ cubes of edge length $1/M$ and we let
    $\{y_i\}_{i=1}^N$ denote the midpoints of these cubes. The formula and accuracy
    of the midpoint rule $\mathcal{Q}_N^{\Omega}$ are then given by


    $\mathcal{Q}_N^{\Omega}[g] := \frac{1}{N} \sum_{i=1}^{N} g(y_i), \quad \big|\bar
    g - \mathcal{Q}_M^{\Omega}[g]\big| \le C_g N^{-2/d}, \quad (2.67)$


    where $C_g \lesssim \|g\|_{C^2}$.


    As long as the domain $\Omega$ is in reasonably low dimensions, i.e. $\bar d \le
    4$, we can use the midpoint rule and more general standard (composite) Gauss quadrature
    rules on an underlying grid. In this case, the quadrature points and weights depend
    on the order of the quadrature rule (Stoer and Bulirsch 2002) and the rate $\alpha$
    depends on the regularity of the underlying integrand. On the other hand, these
    grid-based quadrature rules are not suitable for domains in high dimensions. For
    moderately high dimensions, i.e. $4 \le \bar d \le 20$, we can use low-discrepancy
    sequences, such as the Sobol and Halton sequences, as quadrature points. As long
    as the integrand $g$ is of bounded Hardy–Krause variation, the error in (2.66)
    converges at a rate $(\log(N))^{\bar d} N^{-1}$ (Longo, Mishra, Rusch and Schwab
    2021). For problems in very high dimensions, $d \gg 20$, Monte Carlo quadrature
    is the numerical integration method of choice. In this case, the quadrature points
    are randomly chosen, independent and identically distributed (with respect to
    a scaled Lebesgue measure). As an example, we discuss how the physics-informed
    loss based on the classical formulation for a time-dependent PDE (2.46) can be
    discretized. As the loss function (2.46) contains integrals over three different
    domains ($D \times [0,T]$, $\partial D \times [0,T]$ and $D$), we must consider
    three different quadratures. We consider quadratures'
