  md: '# Example 2.7 (Stokes equation).


    Finally, we consider a simplified version of the Navier–Stokes equations, namely
    the stationary Stokes equation. Let $D \subset \mathbb{R}^d$ be an open, bounded,
    simply connected set with smooth boundary. We consider the Stokes equations as
    a model of stationary, highly viscous fluid:


    $$\begin{cases} \Delta u + \nabla p = f & \text{for all } x \in D, \\ \operatorname{div}(u)
    = f_d & \text{for all } x \in D. \end{cases}$$ (2.17)


    Here, $u: D \to \mathbb{R}^d$ is the velocity field, $p: D \to \mathbb{R}$ is
    the pressure and $f: D \to \mathbb{R}^d$, $f_d: D \to \mathbb{R}$ are source terms.


    Note that the Stokes equation (2.17) is not well-posed as we are not providing
    any boundary conditions. In the corresponding data assimilation problem (Burman
    and Hansbo 2018 and references therein), we provide the following data:


    $$\Psi[u] := u = g \quad \text{for all } x \in D'',$$ (2.18)


    for some open, simply connected set $D'' \subset D$. Thus the data assimilation
    inverse problem for the Stokes equation amounts to inferring the velocity field
    $u$ (and the pressure $p$), given $f, f_d$ and $g$.


    # 2.2. Ansatz spaces


    We give an overview of different classes of parametric functions $\{u_\theta\}_{\theta
    \in \Theta}$ that are often used to approximate the true solution $u$ of the PDE
    (2.1). We let $n$ be the number of (real) parameters, such that the parameter
    space $\Theta$ is a subset of $\mathbb{R}^n$.


    # 2.2.1. Linear models


    We first consider models that linearly depend on the parameter $\theta$, i.e.
    models that are a linear combination of a fixed set of functions $\{\phi_i : \Omega
    \to \mathbb{R}\}_{1 \le i \le n}$. For any $\theta \in \mathbb{R}^n$ the parametrized
    linear model $u_\theta$ is then defined as


    $$u_\theta(x) = \sum_{i=1}^n \theta_i \phi_i(x).$$ (2.19)


    This general model class constitutes the basis of many existing numerical methods
    for approximation solutions to PDEs, of which we give an overview below.'
