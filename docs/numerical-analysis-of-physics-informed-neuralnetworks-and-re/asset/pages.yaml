- pgno: 42
  md: '# Theorem 5.1.


    Let $\mathcal{L}$ be a linear operator or a nonlinear operator with linearization
    as in (5.3). If $\mathcal{L}$ has a bounded inverse operator, then equation (5.1)
    will hold, that is, a small physics-informed loss will imply a small total error.


    We give examples of the above theorem, with explicit stability constants, for
    the semilinear heat equation (strong formulation), Navier–Stokes equation (strong
    formulation), scalar conservation laws (strong and weak formulation) and the Poisson
    equation (variational formulation). Further examples can be found in Mishra and
    Molinaro (2023) and Lu et al. (2021c).


    # Example 5.2 (semilinear heat equation).


    We address the stability (Question 2) of the semilinear heat equation (see Example
    2.1). The following theorem (Mishra and Molinaro 2023, Theorem 3.1) ensures that
    one can indeed bound the total error $\mathcal{E}(\theta)$ in terms of the generalization
    error $\mathcal{E}_G(\theta)$. A generalization to linear Kolmogorov equations
    (including the Black–Scholes model) can be found in De Ryck and Mishra (2022a,
    Theorem 3.7).


    # Theorem 5.3.


    Let $u \in C^k(\overline{D} \times [0,T])$ be the unique classical solution of
    the semilinear parabolic equation (2.6) with the source $f$ satisfying (2.7),
    and let $v \in C^2(\overline{D} \times [0,T])$. Then the total error (3.1) can
    be estimated as


    $$\|u - v\|_{L^2(D\times[0,T])}^2 \le C_1 \big\|\mathcal{R}_{\text{PDE}}[v]\big\|_{L^2(D\times[0,T])}^2
    + \big\|\mathcal{R}_t[v]\big\|_{L^2(D)}^2 \big) + C_2 \big\|\mathcal{R}_s[v]\big\|_{L^2(\partial
    D\times[0,T])}, \tag{5.4}$$


    with constants given by


    $$C_1 = \sqrt{T + (1 + 2C_f) T^2 e^{(1+2C_f)T}},$$ $$C_2 = \sqrt{T^{1/2} |\partial
    D|^{1/2} \big( \|u\|_{C^1([0,T]\times\partial D)} + \|v\|_{C^1([0,T]\times\partial
