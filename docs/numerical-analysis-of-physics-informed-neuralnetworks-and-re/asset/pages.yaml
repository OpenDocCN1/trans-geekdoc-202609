    loss function (see Section 2.3) as the *generalization error* $\mathcal{E}_{G}$.


    $\mathcal{E}_{G}(\theta) := \mathcal{E}_{\text{PDE}}[u_{\theta}],\quad \mathcal{E}_{G}^{*}
    := \mathcal{E}_{G}(\theta^{*}(\mathcal{S}),\mathcal{S}),\tag{3.3}$


