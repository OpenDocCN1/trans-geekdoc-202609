  md: '(2.65) for which the weights are the inverse of the number of grid points,
    such as for the midpoint or Monte Carlo quadrature, and we denote the quadrature
    points by $\mathcal{S}_i = \{(z_i)\}_{1 \le i \le N_i} \subset D \times [0,T]$,
    $\mathcal{S}_s = \{y_i\}_{1 \le i \le N_s} \subset \partial D \times [0,T]$ and
    $\mathcal{S}_t = \{x_i\}_{1 \le i \le N_t} \subset D$. Following machine learning
    terminology, we refer to the set of all quadrature points $\mathcal{S} = (\mathcal{S}_i,
    \mathcal{S}_s, \mathcal{S}_t)$ as the *training set*. The resulting loss function
    $\mathcal{J}$ now depends not only on $u_\theta$ but also on $\mathcal{S}$, and
    is given by


    $\mathcal{J}(\theta,\mathcal{S}) = \mathcal{Q}_{N_i}^{D\times[0,T]}[\mathcal{R}_{\mathrm{PDE}}^2]
    + \lambda_s \mathcal{Q}_{N_s}^{\partial D\times[0,T]}[\mathcal{R}_s^2] + \lambda_t
    \mathcal{Q}_{N_t}^{D}[\mathcal{R}_t^2]$\n$= \frac{1}{N_i} \sum_{i=1}^{N_i} (\mathcal{L}[u_\theta](z_i)
    - f(z_i))^2 + \frac{\lambda_s}{N_s} \sum_{i=1}^{N_s} (u_\theta(y_i) - u(y_i))^2$\n$+
    \frac{\lambda_t}{N_t} \sum_{i=1}^{N_t} (u_\theta(x_i,0) - u(x_i,0))^2.$\n(2.68)


    For any of the other loss functions defined in Section 2.3, a similar discretization
    can be defined. In practice, physics-informed learning thus comes down to solving
    the minimization problem given by


    $\theta^*(\mathcal{S}) := \argmin_{\theta \in \Theta} \mathcal{J}(\theta,\mathcal{S}).$\n(2.69)


    The final optimized or *trained* model is then given by $u^* := u_{\theta^*(\mathcal{S})}$.


    # 2.5. Optimization


    Since $\Theta$ is high-dimensional and the map $\theta \mapsto \mathcal{J}(\theta,\mathcal{S})$
    is generally non-convex, solving the minimization problem (2.69) can be very challenging.
    Fortunately, the loss function $\mathcal{J}$ is almost everywhere differentiable,
    so gradient-based iterative optimization methods can be used.


    The simplest example of such an algorithm is *gradient descent*. Starting from
    an initial guess $\theta_0$, the idea is to take a small step in the parameter
    space $\Theta$ in the direction of the steepest descent of the loss function to
    obtain a new guess $\theta_1$. Note that this comes down to taking a small step
    in the opposite direction to the gradient evaluated in $\theta_0$. Repeating this
    procedure yields the iterative formula


    $\theta_{\ell+1} = \theta_{\ell} - \eta_{\ell} \nabla_{\theta} \mathcal{J}(\theta_{\ell},
    \mathcal{S}) \quad \text{for all } \ell \in \mathbb{N},$\n(2.70)


    where the learning rate $\eta_{\ell}$ controls the size of the step and is generally
    quite small. The gradient descent formula yields a sequence of parameters $\{\theta_{\ell}\}_{\ell
    \in \mathbb{N}}$ that converge to a local minimum of the loss function under very
    general conditions. Because of the non-convexity of the loss function, convergence
    to a global minimum cannot be ensured. Another issue lies in the computation of
    the gradient $\nabla_{\theta} \mathcal{J}(\theta_{\ell}, \mathcal{S})$. A simple
    rewriting of the definition of this gradient (up to regularization term),


    $\nabla_{\theta} \mathcal{J}(\theta_{\ell}, \mathcal{S}) = \frac{1}{N} \sum_{i=1}^{N}
    \nabla_{\theta} \mathcal{J}_i(\theta_{\ell}), \quad \text{where } \mathcal{J}_i(\theta_{\ell})
    = \mathcal{J}(\theta_{\ell}, \{(x_i, f(x_i))\}),$\n(2.71)'
