  md: 'a time-dependent PDE. This is usually translated as the minimization problem


    $$\min_{\theta\in\Theta}\mathcal{E}_{\text{PIL}}[u_\theta]^2,\tag{2.44}$$


    where for a time-independent PDE the physics-informed loss $\mathcal{E}_{\text{PIL}}$
    is given by


    $$\mathcal{E}_{\text{PIL}}[u_\theta]^2 = \int_{D\times[0,T]} \mathcal{R}_{\text{PDE}}[u_\theta]^2
    + \lambda_s \int_{\partial D} \mathcal{R}_s[u_\theta]^2,\tag{2.45}$$


    where $\lambda_s > 0$ is a weighting hyperparameter, and for a time-dependent
    PDE the quantity $\mathcal{E}_{\text{PIL}}$ is given by


    $$\mathcal{E}_{\text{PIL}}[u_\theta]^2 = \int_{D\times[0,T]} \mathcal{R}_{\text{PDE}}[u_\theta]^2
    + \lambda_s \int_{\partial D\times[0,T]} \mathcal{R}_s[u_\theta]^2 + \lambda_t
    \int_0^T \mathcal{R}_t[u_\theta]^2,\tag{2.46}$$


    where $\lambda_s, \lambda_t > 0$ are weighting hyperparameters. Since the boundary
    conditions (and initial condition) are enforced through an additional term in
    the loss function, we allow the possibility that the final model will only approximately
    satisfy the boundary conditions. This is generally referred to as having soft
    boundary conditions. On the other hand, if we choose the model class in such a
    way that all $u_\theta$ exactly satisfy the boundary conditions ($\mathcal{B}[u_\theta]
    = g$), we have implemented hard boundary conditions.


    # Remark 2.9.


    The residuals and loss functions defined above can readily be extended to systems
    of PDEs and more complicated boundary conditions. If the system of PDEs is given
    by $\mathcal{L}^{(i)}[u] = f^{(i)}$, then one can readily define multiple PDE
    residuals $\mathcal{R}_{\text{PDE}}^{(i)}$ and consider the sum of integrals of
    the square PDE residuals $\sum_i \int (\mathcal{R}_{\text{PDE}}^{(i)})^2$ in the
    physics-informed loss. The generalization to more complicated boundary conditions,
    including piecewise defined boundary conditions, proceeds in a completely analogous
    manner.


    The minimization problem (2.44), solely based on the physics-informed loss functions
    defined in (2.45) and (2.46), is the most basic version of physics-informed learning
    and can be extended by adding additional terms to the objective in (2.44). For
    example, in some settings one might have access to measurements $\Psi(u) = g$
    on a subdomain $\Omega''$, where $\Psi$ is a so-called observable. This case is
    particularly relevant for inverse problems (Section 2.1.2). In this case it makes
    sense to add a data term to the optimization objective, defined in terms of a
    data residual $\mathcal{R}_d$:


    $$\mathcal{R}_d[u_\theta](x) = \Psi[u](x) - g(x) \quad \text{for all } x \in \Omega''.\tag{2.47}$$


    Note that the boundary residual can be seen as a special case of the data residual
    with $\Psi = \mathcal{B}$ and $\Omega'' = \partial\Omega$. Additionally, it might
    happen in practice that we add a parameter regularization term, often the $L^q$-norm
    of the parameters $\theta$, to the loss function to either aid the minimization
    process or improve the (generalization) properties of the final model. A generalization
    of the physics-informed'
