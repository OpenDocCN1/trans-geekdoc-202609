  md: "# 7.5.2. Hard boundary conditions\n\nFrom the very advent of PINNs (Lagaris\
    \ et al. 1998, 2000), several authors have advocated modifying machine learning\
    \ models such that the boundary conditions in PDE (2.1) can be imposed exactly\
    \ and the boundary loss in (2.46) is zero. Such hard imposition of boundary conditions\
    \ (BCs) has been empirically shown to aid training; see e.g. Dong and Ni (2021),\
    \ Moseley et al. (2023), Dolean et al. (2023) and references therein. This can\
    \ be explained by saying that implementing hard boundary conditions leads to a\
    \ different matrix A, by changing the operator TT*.\n\nWe first consider a toy\
    \ model to demonstrate these phenomena in a straightforward way. We again consider\
    \ the Poisson equation −Δu = − sin with zero Dirichlet boundary conditions (see\
    \ Example 2.4). We choose as our model\n\n$$u_{\\theta}(x) = \\theta_{-1} \\cos(x)\
    \ + \\theta_{0} + \\theta_{1} \\sin(x), \\tag{7.38}$$\n\nand report the comparison\
    \ of the condition number between various variants of soft and hard boundary conditions\
    \ from De Ryck et al. (2023).\n\n+   - *Soft boundary conditions.* If we set the\
    \ optimal λ using (7.33), we find that the condition number for the optimal λ*\
    \ is given by 3 + 2√2 ≈ 5.83.\n+   - *Hard boundary conditions: variant 1.* A\
    \ first common method to implement hard boundary conditions is to multiply the\
    \ model by a function η(x) so that the product exactly satisfies the boundary\
    \ conditions, regardless of uθ. In our setting, we could consider η(x)uθ(x) with\
    \ η(±π) = 0. For η = sin the total model is given by\n+   \n+     $$\\eta(x)u_{\\\
    theta}(x) = -\\frac{\\theta_{-1}}{2}\\cos(2x) + \\frac{\\theta_{-1}}{2} + \\theta_{0}\
    \ \\sin(x) + \\frac{\\theta_{1}}{2} \\sin(2x), \\tag{7.39}$$\n+   \n+     and\
    \ gives rise to a condition number of 4. Different choices of η will inevitably\
    \ lead to different condition numbers.\n+   - *Hard boundary conditions: variant\
    \ 2.* Another option would be to subtract uθ(π) from the model so that the boundary\
    \ conditions are exactly satisfied. This corresponds to the model\n+   \n+   \
    \  $$u_{\\theta}(x) - u_{\\theta}(\\pi) = \\theta_{-1}(\\cos(x) + 1) + \\theta_{1}\
    \ \\sin(x). \\tag{7.40}$$\n+   \n+     Note that this implies that one can discard\
    \ θ0 as parameter, leaving only two trainable parameters. The corresponding condition\
    \ number is 1.\n\nHence, in this example the condition number for hard boundary\
    \ conditions is strictly smaller than for soft boundary conditions, that is,\n\
    \n$$\\kappa(\\mathbb{A}_{\\text{hard BC}}) < \\min_{\\lambda} \\kappa(\\mathbb{A}_{\\\
    text{soft BC}}(\\lambda)). \\tag{7.41}$$\n\nThis phenomenon can also be observed\
    \ for other PDEs such as the linear advection equation (De Ryck et al. 2023)."
