  md: '# 7. Training


    Despite the generally affirmative answers to our first three questions (Q1–Q3)
    in the previous sections, significant problems have been identified with physics-informed
    machine learning. Arguably, the foremost problem lies in *training* these frameworks
    with (variants of) gradient descent methods. It has been increasingly observed
    that PINNs and their variants are *slow, even infeasible*, to train even on certain
    model problems, with the training process either not converging, or converging
    to unacceptably large loss values (Krishnapriyan *et al.* 2021, Moseley, Markham
    and Nissen-Meyer 2023, Wang, Teng and Perdikaris 2021*a*, Wang, Yu and Perdikaris
    2022*b*). These observations highlight the relevance of our fourth question.


    # Question 4 (Q4). Can the training error $\mathcal{E}_T^*$ be made sufficiently
    close to the true minimum of the loss function $\min_\theta \mathcal{J}(\theta,
    \mathcal{S})$?


    To answer this question, we must find out the reason behind the issues observed
    with training physics-informed machine learning algorithms. Empirical studies
    such as that of Krishnapriyan *et al.* (2021) attribute failure modes to the non-convex
    loss landscape, which is much more complex when compared to the loss landscape
    of supervised learning. Others such as Moseley *et al.* (2023) and Dolean, Heinlein,
    Mishra and Moseley (2023) have implicated the well-known spectral bias (Rahaman
    *et al.* 2019) of neural networks as being a cause of poor training, whereas Wang
    *et al.* (2021*a*) and Wang, Wang and Perdikaris (2021*b*) used infinite-width
    NTK theory to propose that the subtle balance between the PDE residual and supervised
    components of the loss function could explain and possibly ameliorate training
    issues. Nevertheless, it is fair to say that there is still a paucity of principled
    analysis of the training process for gradient descent algorithms in the context
    of physics-informed machine learning.


    In what follows, we first demonstrate that when an affirmative answer to Question
    4 is available (or assumed), it becomes possible to provide *a priori error estimates*
    on the error of models learned by minimizing a physics-informed loss function
    (Section 7.1). Next, we derive precise conditions under which gradient descent
    for a physics-informed loss function can be approximated by a *simplified gradient
    descent* algorithm, which amounts to the gradient descent update for a *linearized*
    form of the training dynamics (Section 7.2). It will then turn out that the speed
    of convergence of the gradient descent is related to the *condition number* of
    an operator, which in turn is composed of the *Hermitian square* ($\mathcal{L}^*
    \mathcal{L}$) of the differential operator ($\mathcal{L}$) of the underlying PDE
    and a *kernel integral operator*, associated to the tangent kernel for the underlying
    model (Section 7.3). This analysis automatically suggests that *preconditioning*
    the resulting operator is necessary to alleviate training issues for physics-informed
    machine learning (Section 7.4). Finally, in Section 7.5, we discuss how different
    preconditioning strategies can overcome training bottlenecks, and also how existing
    techniques, proposed in the'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'literature for improving training, can be viewed from this operator preconditioning
    perspective.


    # 7.1. Global minimum of the loss is a good approximation to the PDE solution


    We demonstrate that the results of the previous sections can be used to prove
    *a priori error estimates* for physics-informed learning, provided that one can
    find a global minimum of the physics-informed loss function (2.69).


    We revisit the error decomposition (3.7) proposed in Section 3. There it was shown
    that if one can answer Question 2 in the affirmative, then, for any θ*, θ̂ ∈ Θ,


    $$\mathcal{E}(θ^*) ≤ C\mathcal{E}_G(θ^*)^α$$


    $$≤ C\left(\mathcal{E}_G(\hat{θ}) + 2\sup_{θ∈Θ} |\mathcal{E}_T(θ,\mathcal{S})
    - \mathcal{E}_G(θ)| + \mathcal{E}_T(θ^*,\mathcal{S}) - \mathcal{E}_T(\hat{θ},\mathcal{S})\right)^α.
    \tag{7.1}$$


    For any ε > 0, we can now let θ̂ be the parameter corresponding to the model from
    Question 1, and hence we find that \mathcal{E}_G(\hat{θ}) < ε if the model class
    is expressive enough. Next we can use the results of Section 6 to deduce a lower
    limit on the size of the training set \mathcal{S} (in terms of ε) such that also
    sup_{θ∈Θ} |\mathcal{E}_T(θ,\mathcal{S}) - \mathcal{E}_G(θ)| < ε. Finally, if we
    assume that θ* = θ*(\mathcal{S}) is the global minimizer of the loss function
    θ ↦ \mathcal{J}(θ,\mathcal{S}) = \mathcal{E}_T(θ,\mathcal{S}) (2.69), then it
    must hold that \mathcal{E}_T(θ*,\mathcal{S}) ≤ \mathcal{E}_T(\hat{θ},\mathcal{S})
    and hence \mathcal{E}_T(θ*,\mathcal{S}) - \mathcal{E}_T(\hat{θ},\mathcal{S}) ≤
    0. As a result, we can infer from (7.1) that


    $$\mathcal{E}^* ≤ C(3ε)^α. \tag{7.2}$$


    Alternatively, we note that many of the *a posteriori* error bounds in Section
    6 are of the form


    $$\mathcal{E}(θ^*) ≤ C(\mathcal{E}_T(θ^*,\mathcal{S}) + ε)^α \tag{7.3}$$


    if the training set is large enough (depending on ε). As before,


    $$\mathcal{E}_T(θ^*,\mathcal{S}) ≤ \mathcal{E}_T(\hat{θ},\mathcal{S}) ≤ \mathcal{E}_G(\hat{θ})
    + \sup_{θ∈Θ} |\mathcal{E}_T(θ,\mathcal{S}) - \mathcal{E}_G(θ)| ≤ 2ε, \tag{7.4}$$


    such that in total we again find that \mathcal{E}^* ≤ C(3ε)^α, in agreement with
    (7.2).


    We first demonstrate this argument for the Navier–Stokes equations, and then show
    a similar result for the Poisson equation in which the curse of dimensionality
    is overcome.


    # Example 7.1 (Navier–Stokes equations). In Sections 4, 5 and 6 we found affirmative
    answers to questions Q1–Q3, and hence we should be able to apply the above argument
    under the assumptions that an exact global minimizer to the loss function can
    be found.'
