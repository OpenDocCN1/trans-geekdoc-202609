  md: '*PINNs* (VPINNs) (Kharazmi *et al.* 2019) and used sine and cosine functions
    or polynomials as test functions. In analogy with *hp*-FEM, the method was later
    adapted to use localized test functions, leading to *hp*-VPINNs (Kharazmi, Zhang
    and Karniadakis 2021). In this case the model \(u\) is of limited regularity and
    might not be sufficiently many times differentiable for \(\mathcal{L}[u]\) to
    be well-defined.


    A second variant of a weak physics-informed loss function can be obtained by replacing
    \(\psi\) with a parametric model \(\psi_\vartheta\). In particular, we choose
    the \(\psi_\vartheta\) to be the function that maximizes the squared weak residual,
    leading to the loss function


    \[

    \mathcal{E}_{\mathrm{wPIL}}[u_\vartheta]^2 = \max_{\vartheta} \left( \int_{\Omega}
    u_\vartheta \mathcal{L}^*[\psi_\vartheta] - \int_{\Omega} f\psi_\vartheta \right)^2,
    \tag{2.51}

    \]


    where again additional terms can be added to take care of any boundary conditions.
    Using \(\mathcal{E}_{\mathrm{wPIL}}\) has the advantage over \(\mathcal{E}_{\mathrm{VPIL}}\)
    that we do not need a basis of test functions \(\{\psi_k\}_k\), which might be
    inconvenient in high-dimensional settings, and settings with complex geometries.
    On the other hand, minimizing \(\mathcal{E}_{\mathrm{wPIL}}\) corresponds to solving
    a min-max optimization problem where the maximum and minimum are taken with respect
    to neural network training parameters, which is considerably more challenging
    than a minimization problem.


    The weak physics-informed loss \(\mathcal{E}_{\mathrm{wPIL}}\) was originally
    proposed to approximate scalar conservation laws with neural networks under the
    name *weak PINNs* (wPINNs) (De Ryck *et al.* 2024c). As there might be infinitely
    many weak solutions for a given scalar conservation law, we need to impose further
    requirements other than (2.49) to guarantee that a scalar conservation law has
    a unique solution. This additional challenge is discussed in the next example.


    **Example 2.10 (wPINNs for scalar conservation laws).** We revisit Example 2.3
    and recall that weak solutions of scalar conservation laws need not be unique
    (Holden and Risebro 2015). To recover uniqueness, we need to impose additional
    admissibility criteria in the form of *entropy conditions*. To this end, we consider
    the so-called *Kruzkhkov entropy functions*, given by \(|u-c|\) for any \(c\in\mathbb{R}\),
    and the resulting entropy flux functions


    \[

    Q:\mathbb{R}^2\to\mathbb{R}: (u,c)\mapsto \operatorname{sgn}(u-c)\bigl(f(u)-f(c)\bigr).
    \tag{2.52}

    \]


    We then say that a function \(u\in L^\infty(\mathbb{R}\times\mathbb{R}_+)\) is
    an *entropy solution* of (2.10) with initial data \(u_0\in L^\infty(\mathbb{R})\)
    if \(u\) is a weak solution of (2.10) and if \(u\) satisfies


    \[

    \partial_t|u-c|+\partial_xQ[u;c]\le 0, \tag{2.53}

    \]


    in a distributional sense, or more precisely


    \[

    \int_0^T\int_{\mathbb{R}}\bigl(|u-c|\varphi_t+Q[u;c]\varphi_x\bigr)\,dx\,dt

    -\int_{\mathbb{R}}\bigl(|u(x,T)-c|\varphi(x,T)-|u_0(x)-c|\varphi(x,0)\bigr)\,dx\ge
    0. \tag{2.54}

    \]'
