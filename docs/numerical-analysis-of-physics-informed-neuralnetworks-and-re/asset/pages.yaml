    for advection equations is provided in Shin, Zhang and Karniadakis (2023).


    # 5.2. Stability for inverse problems


    Next, we extend our analysis to inverse problems, as introduced in Section 2.1.2.
    A crucial ingredient to answer Question 2 for inverse problems will be the assumption
    that solutions to the inverse problem, defined by (2.1) and (2.12), satisfy the
