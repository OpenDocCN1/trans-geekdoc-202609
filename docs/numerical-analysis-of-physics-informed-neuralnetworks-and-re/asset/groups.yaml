    explicitly defined in the proof and can depend on $k, d, T, u$ and $p$ but not
    on $N$. The weights of the networks can be bounded by $O(N^\gamma \ln(N))$, where
    $\gamma = \max\{1,\ d(2 + k^2 + d)/n\}$.


