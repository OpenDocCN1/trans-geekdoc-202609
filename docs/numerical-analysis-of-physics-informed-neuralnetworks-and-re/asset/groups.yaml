    对于时间相关偏微分方程，通常将其转化为如下极小化问题


    $$

    \min_{\theta\in\Theta}\mathcal{E}_{\text{PIL}}[u_\theta]^2,\tag{2.44}

    $$


    其中对于时间无关的偏微分方程，物理信息损失 \(\mathcal{E}_{\text{PIL}}\) 由下式给出


    $$

    \mathcal{E}_{\text{PIL}}[u_\theta]^2 = \int_{D} \mathcal{R}_{\text{PDE}}[u_\theta]^2
    + \lambda_s \int_{\partial D} \mathcal{R}_s[u_\theta]^2,\tag{2.45}

    $$


    其中 \(\lambda_s > 0\) 是加权超参数；对于时间相关的偏微分方程，量 \(\mathcal{E}_{\text{PIL}}\) 由下式给出


    $$

    \mathcal{E}_{\text{PIL}}[u_\theta]^2 = \int_{D\times[0,T]} \mathcal{R}_{\text{PDE}}[u_\theta]^2
    + \lambda_s \int_{\partial D\times[0,T]} \mathcal{R}_s[u_\theta]^2 + \lambda_t
    \int_D \mathcal{R}_t[u_\theta]^2,\tag{2.46}

    $$


    其中 \(\lambda_s, \lambda_t > 0\) 是加权超参数。由于边界条件（和初始条件）是通过损失函数中的一个额外项来施加的，我们允许最终模型只能近似满足边界条件。这通常被称为软边界条件。另一方面，如果我们选择的模型类使得所有
    \(u_\theta\) 都精确满足边界条件（\(\mathcal{B}[u_\theta] = g\)），那么我们就实现了硬边界条件。


    ### 注2.9


    上述定义的残差和损失函数可以很方便地推广到偏微分方程组和更复杂的边界条件。若偏微分方程组由 \(\mathcal{L}^{(i)}[u] = f^{(i)}\)
    给出，则我们可以方便地定义多个偏微分方程残差 \(\mathcal{R}_{\text{PDE}}^{(i)}\)，并在物理信息损失中考虑平方偏微分方程残差的积分和
    \(\sum_i \int (\mathcal{R}_{\text{PDE}}^{(i)})^2\)。对于更复杂的边界条件（包括分段定义的边界条件）的推广，完全以类似方式进行。


    极小化问题 (2.44) 仅基于 (2.45) 和 (2.46) 中定义的物理信息损失函数，是物理信息学习的最基本版本，可以通过在 (2.44) 的目标函数中添加额外项来进行扩展。例如，在某些情形下，我们或许可以在子域
    \(\Omega''\) 上获得测量数据 \(\Psi(u) = g\)，其中 \(\Psi\) 是一个所谓的可观测量。这种情况对反问题（第2.1.2节）尤其重要。在这种情况下，在优化目标中添加一个数据项是有意义的，该数据项用数据残差
    \(\mathcal{R}_d\) 定义：


    $$

    \mathcal{R}_d[u_\theta](x) = \Psi[u](x) - g(x) \quad \text{for all } x \in \Omega''.\tag{2.47}

    $$


    注意，边界残差可以看作是数据残差的一个特例，其中 \(\Psi = \mathcal{B}\) 且 \(\Omega'' = \partial\Omega\)。此外，在实践中我们可能还会在损失函数中添加一个参数正则化项（通常是参数
    \(\theta\) 的 \(L^q\) 范数），以帮助极小化过程或改善最终模型的（泛化）性质。因此，物理信息极小化问题 (2.44) 的一个推广形式可以是


    $$

    \min_{\theta\in\Theta}\left(\mathcal{E}_{\mathrm{PIL}}[u_\theta]^2+\lambda_d\int_{\Omega''}\mathcal{R}_d[u_\theta]^2+\lambda_r\|\theta\|_q^q\right).
    \tag{2.48}

    $$


    ## 2.3.2. 弱形式


    在上一小节中，我们考虑了基于偏微分方程强形式的偏微分方程残差和物理信息损失函数。然而，对于多类偏微分方程，可能不存在光滑的经典解 \(u\) 使得它对于每个
    \(x\in\Omega\) 都满足 \(\mathcal{L}[u](x)=f(x)\)。幸运的是，有时我们可以精确地推广“偏微分方程的解”的定义，使得毕竟存在一些函数满足这个推广后的定义。这样的函数被称为*弱解*。它们被称为满足偏微分方程的*弱形式*，弱形式可以通过将偏微分方程的强形式
    (2.1) 乘以一个光滑且具有紧支撑的测试函数 \(\psi\)，然后进行分部积分得到：


    $$

    \int_{\Omega}u\mathcal{L}^*[\psi]=\int_{\Omega}f\psi, \tag{2.49}

    $$


    其中 \(\mathcal{L}^*\) 是 \(\mathcal{L}\) 的（形式）伴随算子（如果存在）。因此，如果函数 \(u\) 对于某个预定义函数集中的所有（紧支撑）测试函数
    \(\psi\) 都满足 (2.49)，则称其为弱解。注意，\(u\) 不再需要可微，而只需要可积。


    诸如 (2.49) 的弱形式是许多经典数值方法的基础，特别是有限元方法（FEM：第2.2.1节）。然而，通常并不需要一直分部积分到 \(u\) 完全没有导数为止。在有限元方法中，二阶椭圆方程的弱形式通常只通过一次分部积分得到。对于拉普拉斯算子
    \(\mathcal{L}=\Delta\)，我们有


    $$

    \int_{\Omega}\Delta u\,\psi=-\int_{\Omega}\nabla u\cdot\nabla\psi

    $$


    （在合适的边界条件下），这是一个在实践中具有许多有用性质的形式。


    除了使用谱方法（如第2.2.1节所述），现在有几种不同的途径可以获得基于 (2.49) 的*弱物理信息损失函数*。第一种方法借鉴了彼得罗夫–伽辽金方法（Petrov–Galerkin
    method，第2.2.1节），考虑一个由 \(K\) 个测试函数 \(\psi_k\) 组成的有限集，对这些函数 (2.49) 必须成立。相应的损失函数定义为


    $$

    \mathcal{E}_{\mathrm{VPIL}}[u_\theta]=\sum_{k=1}^{K}\left(\int_{\Omega}u_\theta\mathcal{L}^*[\psi_k]-\int_{\Omega}f\psi_k\right)^2.
    \tag{2.50}

    $$


    其中可以添加额外项来处理任何边界条件。该方法最初以*变分PINN*（VPINN）的名称被引入神经网络（Kharazmi *et al.* 2019），并使用正弦和余弦函数或多项式作为测试函数。与*hp*-FEM
    类似，该方法后来被改进为使用局部测试函数，从而产生了*hp*-VPINN（Kharazmi, Zhang 和 Karniadakis，2021）。在这种情况下，模型
    \(u\) 的正则性有限，其可微次数可能不足以使 \(\mathcal{L}[u]\) 被良好定义。


    弱物理信息损失函数的第二个变体可以通过将 \(\psi\) 替换为参数化模型 \(\psi_\vartheta\) 来获得。特别地，我们选择 \(\psi_\vartheta\)
    为最大化平方弱残差的函数，从而得到损失函数


    $$

    \mathcal{E}_{\mathrm{wPIL}}[u_\theta]^2 = \max_{\vartheta} \left( \int_{\Omega}
    u_\theta \mathcal{L}^*[\psi_\vartheta] - \int_{\Omega} f\psi_\vartheta \right)^2,
    \tag{2.51}

    $$


    其中同样可以添加额外项来处理任何边界条件。使用 \(\mathcal{E}_{\mathrm{wPIL}}\) 相对于 \(\mathcal{E}_{\mathrm{VPIL}}\)
    的优势在于，我们不需要测试函数基 \(\{\psi_k\}_k\)，而这在高维情形和复杂几何情形下可能是不方便的。另一方面，极小化 \(\mathcal{E}_{\mathrm{wPIL}}\)
    相当于求解一个 min-max 优化问题，其中最大值和最小值是相对于神经网络训练参数来取的，这比单纯的极小化问题要困难得多。


    弱物理信息损失 \(\mathcal{E}_{\mathrm{wPIL}}\) 最初以*弱PINN*（wPINN）的名称被提出，用于借助神经网络近似标量守恒律（De
    Ryck *et al.* 2024c）。由于给定的标量守恒律可能存在无限多个弱解，除了 (2.49) 之外，我们还需要施加进一步的要求，以保证标量守恒律具有唯一解。这个额外的挑战将在下一个示例中讨论。


    ### 示例2.10（用于标量守恒律的wPINN）


    我们重新审视示例2.3，并回顾标量守恒律的弱解不一定是唯一的（Holden 和 Risebro，2015）。为了恢复唯一性，我们需要以*熵条件*的形式施加额外的可容许性准则。为此，我们考虑所谓的*Kružkov熵函数*，它由
    \(|u-c|\) 给出，其中 \(c\in\mathbb{R}\) 可取任意值，以及由此得到的熵通量函数


    $$

    Q:\mathbb{R}^2\to\mathbb{R}: (u,c)\mapsto \operatorname{sgn}(u-c)\bigl(f(u)-f(c)\bigr).
    \tag{2.52}

    $$


    然后，如果函数 \(u\in L^\infty(\mathbb{R}\times\mathbb{R}_+)\) 是 (2.10) 的一个弱解，并且 \(u\)
    满足


    $$

    \partial_t|u-c|+\partial_xQ[u;c]\le 0, \tag{2.53}

    $$


    （在分布意义下），或者更精确地满足


    $$

    \int_0^T\int_{\mathbb{R}}\bigl(|u-c|\varphi_t+Q[u;c]\varphi_x\bigr)\,dx\,dt

    -\int_{\mathbb{R}}\bigl(|u(x,T)-c|\varphi(x,T)-|u_0(x)-c|\varphi(x,0)\bigr)\,dx\ge
    0. \tag{2.54}

    $$


    则称 \(u\) 是 (2.10) 具有初始数据 \(u_0\in L^\infty(\mathbb{R})\) 的一个*熵解*。


