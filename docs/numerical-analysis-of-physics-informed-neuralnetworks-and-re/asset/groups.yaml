    ### 示例 2.3（黏性和无黏性标量守恒律）。


    我们考虑如下*黏性标量守恒律*的一维形式，将其作为拟线性、对流占主导的扩散方程的模型问题：


    $\begin{cases} u_t + f(u)_x = \nu u_{xx} & \text{for all } x \in (0,1),\ t \in
    [0,T], \\ u(x,0)=u_0(x) & \text{for all } x \in (0,1), \\ u(0,t)=u(1,t)\equiv
    0 & \text{for all } t \in [0,T]. \end{cases}$ (2.9)


    这里，$u_0 \in C^k([0,1])$，其中某个 $k \ge 1$，是初始数据；我们考虑零 Dirichlet 边界条件。注意，$0 < \nu
    \ll 1$ 是黏性系数。通量函数记为 $f \in C^k(\mathbb{R};\mathbb{R})$。按照 Godlewski 和 Raviart（1991）等标准教材中的方法，可以得出，只要
    $\nu > 0$，黏性标量守恒律（2.9）就存在一个经典解 $u \in C^k([0,T)\times[0,1])$。


    将 $\nu = 0$ 并考虑*无黏性标量守恒律*通常也很有意义：


    $u_t + f(u)_x = 0.$ (2.10)


    在这种情况下，即使初始数据是光滑的，解也可能不再连续，因为它可能会形成激波（Holden and Risebro 2015）。


    ### 示例 2.4（泊松方程）。


    最后，我们考虑一个典型的椭圆型 PDE。设 $\Omega \subset \mathbb{R}^d$ 是满足外部球条件的有界开集，$f \in C^1(\Omega)
    \cap L^\infty(\Omega)$，且 $g \in C(\partial\Omega)$。那么存在 $u \in C^2(\Omega) \cap
    C(\overline{\Omega})$，使其满足泊松方程：


    $\begin{cases} -\Delta u = f & \text{in } \Omega, \\ u = g & \text{on } \partial\Omega.
    \end{cases}$ (2.11)


    此外，如果 $f$ 是光滑的，那么 $u$ 在 $\Omega$ 中也是光滑的。


    ## 2.1.2. 逆问题


    其次，我们考虑这样一类情形：我们并不完全知道 PDE（2.1）的输入（例如初始数据、边界条件和参数系数）。因此，无法唯一地求解正问题。然而，当我们能够获得关于底层解的（带噪声）数据，即某些可观测量的数据时，就可以尝试确定
    PDE 的未知输入，进而确定其解。旨在基于数据恢复 PDE 输入的问题被称为*逆问题*。


    我们主要考虑一种逆问题，即*唯一延拓问题*（对于时变问题，也称为*数据同化问题*）。回顾抽象 PDE $\mathcal{L}[u] = f$ in $\Omega$（2.1）。此外，我们采用本小节引言中的假设（2.2）。与正问题的区别在于，现在我们对边界条件只有不完整的信息。因此，PDE
    不存在唯一解。相反，我们假设


    可以获得某个可观测量的（可能带噪声的）测量值


    $$\Psi(u) = g \quad \text{in } \Omega'', \tag{2.12}$$


    其中 $\Omega'' \subset \Omega$ 是观测区域，$g$ 是测量数据，且 $\Psi: X^* \to Z^*$，其中 $Z^*$ 是某个
    Banach 空间。我们作出如下假设：


    $$\|\Psi(u)\|_{Z^*} < +\infty \quad \text{for all } u \in X^*, \text{ with } \|u\|_{X^*}
    < +\infty,$$

    $$\|g\|_{Z^*} < +\infty. \tag{2.13}$$


    如果 $\Omega''$ 包含 $\Omega$ 的边界，也就是说我们拥有边界上的测量数据，那么再次使用正问题的标准框架是可行的。然而，这通常是不可能的。例如，在传热问题中，最高温度将在边界处达到。因此，边界附近的温度可能过高，无法在那里放置传感器，我们只能获得距离边界足够远处的测量数据。幸运的是，我们可以调整物理信息框架，根据
    $f$ 和 $g$ 恢复 $u$ 的一个近似。


    类比于正问题中的算子学习，我们也可以尝试完全学习逆算子


    $$\mathcal{G}^{-1}: Z^* \to X^*: \Psi[u] = g \mapsto \mathcal{G}^{-1}[g] = v,
    \tag{2.14}$$


    其中，$v$ 例如可以是边界条件、参数函数 $a$ 或输入/源函数 $f$。


    ### 示例 2.5（热方程）。


    我们重新考虑热方程 $u_t - \Delta u = f$，其中具有零 Dirichlet 边界条件，且 $f \in L^2(\Omega)$，其中 $\Omega
    = D \times (0,T)$。我们假设 $u \in H^1((0,T); H^{-1}(D)) \cap L^2((0,T); H^1(D))$，并且
    $u$ 将以弱意义满足热方程。如果给定了初始条件，即指定了 $u_0 = u(x,0)$，那么热方程将是适定的。回顾一下，数据同化问题的目标是：根据对解在时间上的一些测量，推断初始条件以及之后时刻的完整解场。为对此进行建模，我们考虑如下*可观测量*：


    $$\Psi[u] := u = g \quad \text{for all } (x,t) \in D'' \times (0,T) := \Omega'',
    \tag{2.15}$$


    其中，$D'' \subset D$ 是某个开且单连通的观测区域，$g \in L^2(\Omega'')$。因此，求解热方程的数据同化问题，就是在观测子区域
    $\Omega'' = D'' \times (0,T)$ 上给定数据的情况下，求出整个时空区域 $\Omega = D \times (0,T)$ 中的热方程解
    $u$。


    ### 示例 2.6（泊松方程）。


    我们重新考虑泊松方程（示例 2.4），但这次给定 $\Omega$ 的一个子区域上的数据：


    $$- \Delta u = f \quad \text{in } \Omega \subset \mathbb{R}^d, \quad u|_{\Omega''}
    = g \quad \text{in } \Omega'' \subset \Omega. \tag{2.16}$$


    在这种情况下，式（2.12）中引入的可观测量 $\Psi$ 就是恒等映射 $\Psi[u] = u$。


    ### 示例 2.7（斯托克斯方程）。


    最后，我们考虑 Navier–Stokes 方程的一个简化版本，即定常 Stokes 方程。设 $D \subset \mathbb{R}^d$ 是一个具有光滑边界的开、有界、单连通集合。我们将
    Stokes 方程作为定常高黏性流体的模型：


    $$\begin{cases} \Delta u + \nabla p = f & \text{for all } x \in D, \\ \operatorname{div}(u)
    = f_d & \text{for all } x \in D. \end{cases}$$ (2.17)


    这里，$u: D \to \mathbb{R}^d$ 是速度场，$p: D \to \mathbb{R}$ 是压力，$f: D \to \mathbb{R}^d$
    和 $f_d: D \to \mathbb{R}$ 是源项。


    注意，由于没有给出任何边界条件，Stokes 方程（2.17）不是适定的。在相应的数据同化问题中（Burman and Hansbo 2018 及其中的参考文献），我们给出如下数据：


    $$\Psi[u] := u = g \quad \text{for all } x \in D'',$$ (2.18)


    其中 $D'' \subset D$ 是某个开且单连通的集合。因此，Stokes 方程的数据同化逆问题就是：给定 $f$、$f_d$ 和 $g$，推断速度场
    $u$（以及压力 $p$）。


    ## 2.2. Ansatz 空间


    我们概述不同类别的参数函数 $\{u_\theta\}_{\theta \in \Theta}$，这些函数通常用于近似 PDE（2.1）的真实解 $u$。设
    $n$ 为（实）参数的数量，因此参数空间 $\Theta$ 是 $\mathbb{R}^n$ 的一个子集。


    ### 2.2.1. 线性模型


    我们首先考虑关于参数 $\theta$ 线性依赖的模型，即由一组固定函数 $\{\phi_i : \Omega \to \mathbb{R}\}_{1 \le
    i \le n}$ 的线性组合构成的模型。对于任意 $\theta \in \mathbb{R}^n$，参数化线性模型 $u_\theta$ 定义为


    $$u_\theta(x) = \sum_{i=1}^n \theta_i \phi_i(x).$$ (2.19)


    这一通用模型类构成了许多现有 PDE 解近似数值方法的基础，下面我们将对此进行概述。


    其形式为


    $$\sum_{i=1}^n \theta_i \int_{\Omega} \psi_k \mathcal{L}(\phi_i) = \int_{\Omega}
    \psi_k f \quad \text{for } 1 \le k \le K, \tag{2.20}$$


    其中，若 $\psi_k = \phi_k$，则得到*Galerkin 方法*；若 $\psi_k = \delta_{x_k}$ 且 $x_k \in \Omega$，则得到*配点法*；更一般地，当
    $\psi_k$ 和 $\phi_k$ 不同（并且也不是 Dirac delta 函数）时，则称为*Petrov–Galerkin 方法*。在配点法中，所谓配点
    $\{x_k\}_k$ 的选择取决于函数 $\phi_i$。边界条件可以通过选择函数 $\phi_i$ 来实现，也可以通过向上述线性系统中添加更多方程来实现。


    与谱方法的全局基函数形成鲜明对比的是*有限元方法*（FEM），在该方法中我们考虑局部定义的多项式。更准确地说，我们首先将 $\Omega$ 划分为直径至多为
    $h$ 的（通常相互重叠的）子区域 $\Omega_i$（一维情况下为子区间），然后在每个 $\Omega_i$ 上考虑一个分片定义的、次数至多为 $p$
    且在 $\Omega_i$ 外为零的多项式 $\phi_i$。与谱 Galerkin 方法非常类似，我们可以定义如（2.20）所示的线性方程组，并通过求解该方程组找到最优参数向量
    $\theta^*$。由于 $\phi_i$ 在 $\Omega$ 上不再光滑，我们需要利用分部积分重写 $\int_{\Omega} \phi_k \mathcal{L}(\phi_i)$。与谱方法的另一个关键区别在于，由于函数
    $\phi_i$ 具有局部支集，我们需要求解的线性系统将是稀疏的，并且具有与网格和多项式选择相关的结构性质。可以通过减小 $h$（$h$-FEM）、增大 $p$（$p$-FEM），或同时进行二者（$hp$-FEM）来提高近似精度。或者，有限元方法也可以与平方损失结合使用，从而得到*最小二乘有限元方法*（Bochev
    and Gunzburger 2009）。有限元方法在科学计算中无处不在，并且存在许多变体。


    函数 $\phi_i$ 的另一种选择是*径向基函数*（RBF）；例如参见 Buhmann（2000）。RBF 的关键要素是一个径向函数 $\varphi :
