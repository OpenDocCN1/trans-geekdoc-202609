    classes are introduced. In Section 2.3 we introduce variations of physics-informed
    learning based on different formulations of PDEs, of which the resulting residuals
    will constitute the physics-informed loss function by being discretized (Section
    2.4) and optimized (Section 2.5). Finally, a summary of the whole method is given
    in Section 2.6.


    # ## 2.1. PDE setting


    Throughout this article, we consider the following setting. Let $X$, $Y$, $W$
    be separable Banach spaces with norms $\|\cdot\|_X$, $\|\cdot\|_Y$ and $\|\cdot\|_W$,
    respectively, and analogously let $X^* \subset X$, $Y^* \subset Y$ and $W^* \subset
    W$ be closed subspaces with norms $\|\cdot\|_{X^*}$, $\|\cdot\|_{Y^*}$ and $\|\cdot\|_{W^*}$,
    respectively. Typical examples of such spaces include $L^p$ and Sobolev spaces.
    We consider PDEs of the abstract form


    $$\mathcal{L}[u] = f, \qquad \mathcal{B}[u] = g, \tag{2.1}$$


    where $\mathcal{L}: X^* \to Y^*$ is a *differential operator* and $f \in Y^*$
    is an *input* or *source function*. The boundary conditions (including the initial
    condition for time-dependent PDEs) are prescribed by the *boundary operator* $\mathcal{B}:
    X^* \to W^*$ and the boundary data $g \in W^*$. We assume that for all $f \in
    Y^*$ there exists a unique $u \in X^*$ such that (2.1) holds. Finally, we assume
    that for all $u \in X^*$ and $f \in Y^*$, we have


    $$\|\mathcal{L}[u]\|_{Y^*} < +\infty, \qquad \|f\|_{Y^*} < +\infty, \qquad \|\mathcal{B}[u]\|_{W^*}
    < +\infty. \tag{2.2}$$


    We will also denote the domain of $u$ as $\Omega$, where either $\Omega = D \subset
    \mathbb{R}^d$ for time-independent PDEs or $\Omega = D \times [0,T] \subset \mathbb{R}^{d+1}$
    for time-dependent PDEs.


    # ### 2.1.1. Forward problems


    The forward problem for the abstract PDE (2.1) amounts to the following: given
    a source $f$ and boundary conditions $g$ (and potentially another parameter function
    $a$ such that $\mathcal{L} := \mathcal{L}_a$), find the solution $u$ of the PDE.
    This can be summarized as finding an *operator* that maps an input function $v
    \in \{f,g,a\} \subset \mathcal{X}$ to the corresponding solution $u \in X^*$ of
    the PDE


    $$\mathcal{G}: \mathcal{X} \to X^*: v \mapsto \mathcal{G}[v] = u. \tag{2.3}$$


    Note that it can also be interesting to determine the whole operator $\mathcal{G}$
    rather than just the function $u$. Finding a good approximation of $\mathcal{G}$
    is referred to as *operator learning*. A first concrete example of an operator
    would be the mapping between the input or source function $f$ and the corresponding
    solution $u$, and hence $\mathcal{X} = Y^*$ and $v=f$:


    $$\mathcal{G}: Y^* \to X^*: f \mapsto \mathcal{G}[f] = u. \tag{2.4}$$


    Another common example for a time-dependent PDE, where $\mathcal{B}[u] = g$ entails
    the prescription of the initial condition $u(\cdot,0) = u_0$, is the *solution
    operator* that maps the initial condition $u_0$ to the solution of the PDE


    $$\mathcal{G}: W^* \to X^*: u_0 \mapsto \mathcal{G}[u_0] = u, \tag{2.5}$$'
  - '[PAGE 4]


    where $\mathcal{X}=W^*$ and $v = u_0$. Alternatively, one can also consider the
    mapping $u_0 \mapsto u(\cdot,T)$.


    A final example of operator learning can be found in parametric PDEs, where the
    differential operator, source function, initial condition or boundary condition
    depends on scalar parameters or a parameter function. Although solving parametric
    PDEs is usually not called operator learning, it is evident that it can be identified
    as such, the only difference being that the input space is not necessarily infinite-dimensional.


    In what follows we give examples of PDEs (2.1) for which we will consider the
    forward problem later on.


    # Example 2.1 (semilinear heat equation).


    We first consider the set-up of the semilinear heat equation. Let $D \subset \mathbb{R}^d$
    be an open connected bounded set with a continuously differentiable boundary $\partial
    D$. The semilinear parabolic equation is then given by


    $$\begin{cases} u_t = \Delta u + f(u) & \text{for all } x \in D,\ t \in (0,T),
    \\ u(x,0)=u_0(x) & \text{for all } x \in D, \\ u(x,t)=0 & \text{for all } x \in
    \partial D,\ t \in (0,T). \end{cases}\tag{2.6}$$


    Here, $u_0 \in C^k(D)$, $k \ge 2$, is the initial data, $u \in C^k([0,T] \times
    D)$ is the classical solution and $f : \mathbb{R} \times \mathbb{R}$ is the nonlinear
    source (reaction) term. We assume that the nonlinearity is globally Lipschitz,
    that is, there exists a constant $C_f > 0$ such that


    $$|f(v)-f(w)| \le C_f |v-w| \quad \text{for all } v,w \in \mathbb{R}.\tag{2.7}$$


    In particular, the homogeneous linear heat equation with $f(u) \equiv 0$ and the
    linear source term $f(u)=\alpha u$ are examples of (2.6). Semilinear heat equations
    with globally Lipschitz nonlinearities arise in several models in biology and
    finance (Beck et al. 2021). The existence, uniqueness and regularity of the semilinear
    parabolic equations with Lipschitz nonlinearities such as (2.6) can be found in
    classical textbooks such as that of Friedman (1964).


    # Example 2.2 (Navier–Stokes equations).


    We consider the well-known incompressible Navier–Stokes equations (Temam 2001
    and references therein)


    $$\begin{cases} u_t + u \cdot \nabla u + \nabla p = \nu \Delta u & \text{in }
    D \times [0,T], \\ \operatorname{div}(u)=0 & \text{in } D \times [0,T], \\ u(t=0)=u_0
    & \text{in } D. \end{cases}\tag{2.8}$$


    Here, $u: D \times [0,T] \to \mathbb{R}^d$ is the fluid velocity, $p: D \times
    [0,T] \to \mathbb{R}$ is the pressure and $u_0: D \to \mathbb{R}^d$ is the initial
    fluid velocity. The viscosity is denoted by $\nu \ge 0$. For the rest of the paper,
    we consider the Navier–Stokes equations (2.8) on the $d$-dimensional torus $D
    = \mathbb{T}^d = [0,1)^d$ with periodic boundary conditions.'
