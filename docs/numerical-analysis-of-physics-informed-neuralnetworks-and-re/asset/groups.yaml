  - '[PAGE 33]


    +   - The first framework is tailored to time-dependent PDEs and considers initial
    conditions and PDE solutions that are Sobolev-regular (or continuously differentiable).
    The crucial assumption is that one must be able to approximate the initial condition
    $u_0$ with a neural network, without incurring the CoD, i.e. approximate it to
    accuracy $\epsilon$ with a network of size $O(d^{\alpha} \epsilon^{-\beta})$ with
    $\alpha,\beta > 0$ independent of $d$. This framework can also be used to prove
    results for (physics-informed) operator learning.

    +   - The second framework circumvents this assumption by considering PDE solutions
    that belong to a smaller space, namely the so-called *Barron space*. It can be
    proved that functions in this space can be approximated without the curse of dimensionality.
    Hence, in this case the challenge lies in proving that the PDE solution is indeed
    a *Barron function*.


    # 4.3.1. Results based on Sobolev- and $C^k$-regularity


    We initially direct our focus onto the first framework. To start with, we give
    particular attention to the case where it is known that a neural network can efficiently
