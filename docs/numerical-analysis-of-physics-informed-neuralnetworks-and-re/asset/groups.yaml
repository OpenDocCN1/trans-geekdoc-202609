    error}}+\underbrace{2\sup_{\theta\in\Theta}\left|\mathcal{E}_T(\theta,\mathcal{S})-\mathcal{E}_G(\theta)\right|}_{\text{generalization
    gap}}+\underbrace{\mathcal{E}_T^*-\mathcal{E}_T(\hat{\theta})}_{\text{optimization
    error}}\right)^\alpha.\tag{3.7}

    $$

