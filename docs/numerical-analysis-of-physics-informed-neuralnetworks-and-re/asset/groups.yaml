    Should quantify how well the derivatives of the model approximate those of the
    function.


    For solutions of PDEs, a very natural norm that satisfies this criterion is the
    Sobolev norm. For $s \in \mathbb{N}$ and $q \in [1,\infty]$, the Sobolev space
    $W^{s,q}(\Omega;\mathbb{R}^m)$ is the space of all functions $f: \Omega \to \mathbb{R}^m$
    for which $f$, as well as the (weak) derivatives of $f$ up to order $s$, belong
    to $L^q(\Omega;\mathbb{R}^m)$. When more smoothness is available, one could replace
    the space $W^{s,\infty}(\Omega;\mathbb{R}^m)$ with the space of $s$ times continuously
    differentiable functions $C^s(\Omega;\mathbb{R}^m)$; for more information see
    the Appendix.


    Given an approximation result in some Sobolev (semi-)norm, we can derive the physics-informed
    loss of the model $\mathcal{E}_{\mathrm{PIL}}(u_\theta)$ if the following assumption
    holds true.


    When the physics-informed loss is based on the strong (classical) formulation
    of the PDE (see Section 2.3.1), we assume that it can be bounded in terms of the
    errors related to all relevant partial derivatives, denoted by $D^{(k,\alpha)}
    := D_t^k D_x^\alpha := \partial_t^k \partial_{x_1}^{\alpha_1} \cdots \partial_{x_d}^{\alpha_d}$,
    for $(k,\alpha) \in \mathbb{N}_0^{d+1}$ for time-dependent PDEs. This assumption
    is valid for many classical solutions of PDEs.


    ## Assumption 4.1.


    Let $k, \ell \in \mathbb{N}$, $q \in [1,+\infty]$, $C > 0$ be independent from
    $d$ and let $\mathcal{X} \subset \{u_\theta : \theta \in \Theta\}$ and $\Omega
    = [0,T] \times D$. It holds for every $u_\theta \in \mathcal{X}$ that


    $$

    \|\mathcal{L}[u_\theta]\|_{L^q(\Omega)} \le C \cdot \mathrm{poly}(d) \cdot \sum_{\substack{(k'',\alpha)\in\mathbb{N}_0^{d+1}
    \\ k'' \le k,\ \|\alpha\|_1 \le \ell}} \|D^{(k'',\alpha)}(u - u_\theta)\|_{L^q(\Omega)}.
    \tag{4.1}

    $$


    Note that the corresponding assumption for operator learning can be obtained by
    replacing $u$ with the operator $\mathcal{G}$ and $u_\theta$ with $\mathcal{G}_\theta$.
    We give a brief example to illustrate the assumption.


    ### Example 4.2 (heat equation).


    For the heat equation we have


    $$

    \|\mathcal{L}[u_\theta]\|_{L^q(\Omega)} = \|\mathcal{L}[u_\theta] - \mathcal{L}[u]\|_{L^q(\Omega)}

    \le \|\Delta(u_\theta - u)\|_{L^q(\Omega)} + \|\partial_t(u_\theta - u)\|_{L^q(\Omega)}.
    \tag{4.2}

