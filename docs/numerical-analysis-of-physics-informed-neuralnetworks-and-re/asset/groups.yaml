    Omega_0} \\operatorname{Var}\\Big(a\\sigma^{\\ell}(w^T x + b)\\prod_{j=1}^{d}\
    \ w_j^{\\alpha_j}\\Big) d\\mu$$\n\n$$\\le \\frac{1}{k} \\int_{\\Omega_0} \\mathbb{E}\\\
    Big[\\Big(a\\sigma^{\\ell}(w^T x + b)\\prod_{j=1}^{d} w_j^{\\alpha_j}\\Big)^2\\\
