    类似地，可以利用本节的结果为非线性抛物型 PDE (4.23) 的（物理信息）DeepONets 获得估计，例如 Allen–Cahn 方程。特别地，如果解足够光滑，则可以获得与维度无关的收敛速率，这改进了
