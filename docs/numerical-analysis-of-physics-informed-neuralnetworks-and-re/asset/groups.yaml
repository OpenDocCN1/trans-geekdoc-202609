    $g = \int a\sigma(w^{\top}x + b)\rho(da, dw, db),\qquad (4.30)$


    where $\rho$ is a probability distribution on the (now infinite) parameter space
    $\Theta$. In particular, the neural network


    $\displaystyle \frac{1}{k}\sum_{i=1}^{k} a_i\sigma(w_i^{\top}x + b_i)$


    is a Barron function.'
