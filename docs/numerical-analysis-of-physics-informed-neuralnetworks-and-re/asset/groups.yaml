    we see that the condition number of \(\mathsf{A}(\beta) \sim \beta^2\) grows quadratically
    with advection speed. On the other hand, the condition number of the preconditioned
    model remains constant. Consequently, as shown in Figure 7.2(b), the unpreconditioned
