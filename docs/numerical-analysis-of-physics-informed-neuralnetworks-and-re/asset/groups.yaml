    \tag{2.37}$$


    where the $P_\ell(k)$ are coefficients that define a non-local convolution operator
    via the discrete Fourier transform $\mathcal{F}_N$; see Kovachki *et al.* (2021).


    It has been observed that the proposed operator learning models above may not
    behave as operators when implemented on a computer, questioning the very essence
    of what operator learning should be. Bartolucci *et al.* (2023) contend that in
    addition to defining the operator at the continuous level, some form of continuous–discrete
    equivalence is necessary for an architecture to genuinely learn the underlying
    operator rather than just discretizations of it. To this end, they introduce the
    unifying mathematical framework of *representation-equivalent neural operators*
    (ReNOs) to ensure that operations at the continuous and discrete level are equivalent.
    Lack of this equivalence is quantified in terms of aliasing errors.


    # *Gaussian processes.*


    Deep neural networks and their operator versions are only one possible nonlinear
    surrogate model for the true solution $u$. Another popular class of nonlinear
    models is *Gaussian process regression* (Rasmussen 2003), which belongs to a larger
    class of so-called Bayesian models. Gaussian process regression (GPR) relies on
    the assumption that $u$ is drawn from a Gaussian measure on a suitable function
    space, parametrized by


    $$u_\theta(x) \sim \mathrm{GP}\bigl(m_\theta(x), k_\theta(x,x'')\bigr), \tag{2.38}$$


    where $m_\theta(x)=\mathbb{E}[u_\theta(x)]$ is the mean, and the underlying covariance
    function is given by $k_\theta(x,x'')=\mathbb{E}[(u_\theta(x)-m_\theta(x))(u_\theta(x'')-m_\theta(x''))]$.


    Popular choices for the covariance function in (2.38) are the squared exponential
    kernel (which is a radial function as for RBFs) and Matérn covariance functions:


    $$k_{\mathrm{SE}}(x,x'')=\exp\left(-\frac{\lVert x-x''\rVert^2}{2\ell^2}\right),
    \tag{2.39}$$


    $$k_{\mathrm{Matern}}(x,x'')=\frac{2^{1-\nu}}{\Gamma(\nu)}\left(\sqrt{2\nu}\frac{\lVert
    x-x''\rVert}{\ell}\right)^\nu K_\nu\left(\sqrt{2\nu}\frac{\lVert x-x''\rVert}{\ell}\right).
    \tag{2.40}$$


    Here $\lVert\cdot\rVert$ denotes the standard Euclidean norm, $K_\nu$ is the modified
    Bessel function of the second kind and $\ell$ the *characteristic length*, describing
    the length scale of the correlations between the points $x$ and $x''$. The parameter
    vector then consists of the hyperparameters of $m_\theta$ and $k_\theta$, such
    as $\nu$ and $\ell$.'
  md: "\nRandomly initialized weights and biases are closely connected to neural networks\
    \ of which only the outer layer is trained. When the network is large then the\
    \ latter model is often referred to as an extreme learning machine (ELM) (Huang,\
    \ Zhu and Siew 2006).\n\n## 2.2.2. Nonlinear models\n\nNeural networks. A first,\
    \ but very central, example of parametric models that depend nonlinearly on their\
    \ parameters is that of neural networks. The simplest form of a neural network\
    \ is a multilayer perceptron (MLP). MLPs get their name from their definition\
    \ as a concatenation of affine maps and activation functions. As a consequence\
    \ of this structure, the computational graph of an MLP is organized in layers.\
    \ At the kth layer, the activation function is applied component-wise to obtain\
    \ the value\n\n$$z^k = \\sigma(C_{k-1}(z^{k-1})) = \\sigma(W_{k-1}z^{k-1} + b_{k-1}),\
    \ \\tag{2.21}$$\n\nwhere $z^0$ is the input of the network, $W_k \\in \\mathbb{R}^{d_{k+1}\\\
    times d_k}$, $b_k \\in \\mathbb{R}^{d_{k+1}}$ and $C_k: \\mathbb{R}^{d_k} \\to\
    \ \\mathbb{R}^{d_{k+1}}: x \\mapsto W_k x + b_k$ for $d_k \\in \\mathbb{N}$ is\
    \ an affine map. A multilayer perceptron (MLP) with L layers, activation function\
    \ $\\sigma$, output function $\\sigma_o$, input dimension $d_{\\mathrm{in}}$ and\
    \ output dimension $d_{\\mathrm{out}}$ is then a function $f_\\theta: \\mathbb{R}^{d_{\\\
    mathrm{in}}} \\to \\mathbb{R}^{d_{\\mathrm{out}}}$ of the form\n\n$$f_\\theta(x)\
    \ = (\\sigma_o \\circ C_L \\circ \\sigma \\circ \\cdots \\circ \\sigma \\circ\
    \ C_0)(x) \\quad \\text{for all } x \\in \\mathbb{R}^{d_{\\mathrm{in}}}, \\tag{2.22}$$\n\
    \nwhere $\\sigma$ is applied element-wise and $\\theta = ((W_0, b_0), \\ldots,\
    \ (W_L, b_L))$. The dimension $d_k$ of each layer is also called the width of\
    \ that layer. The width of the MLP is defined as $\\max_k d_k$. Furthermore, the\
    \ matrices $W_k$ are called the weights of the MLP and the vectors $b_k$ are called\
    \ the biases of the MLP. Together, they constitute the (trainable) parameters\
    \ of the MLP, denoted by $\\theta = ((W_0, b_0), \\ldots, (W_L, b_L))$. Finally,\
    \ an output function $\\sigma_o$ can be employed to increase the interpretability\
    \ of the output, but is often equal to the identity in the setting of function\
    \ approximation.\n\n## Remark 2.8.\n\nIn some texts, the number of layers L corresponds\
    \ to the number of affine maps in the definition of $f_\\theta$. Of these L layers,\
    \ the first L − 1 layers are called hidden layers. An L-layer network in this\
    \ alternative definition hence corresponds to an (L − 1)-layer network in our\
    \ definition.\n\nMany of the properties of a neural network depend on the choice\
    \ of activation function. We discuss the most common activation functions below.\n\
    \n- The Heaviside function is the activation that was used in the McCulloch–Pitts\
    \ neuron and is defined as\n\n  $$H(x) = \\begin{cases} 0, & x < 0;\\\\ 1, & x\
    \ \\ge 0. \\end{cases} \\tag{2.23}$$\n\n  Because the gradient is zero wherever\
    \ it exists, it is not possible to train the network using a gradient-based approach.\
    \ For this reason, the Heaviside function is no longer used.\n\nare inspired by\
    \ the fact that under some general conditions the solution $u$ to the PDE (2.1)\
    \ can be represented in the form\n\n$$u(x) = \\int_D G(x,y) f(y) \\mathrm{d}y,\
    \ \\tag{2.29}$$\n\nwhere $G: D \\times D \\to \\mathbb{R}$ is the Green's function.\
    \ This kernel representation led Li et al. (2020) to propose replacing the formula\
    \ for a hidden layer of a standard neural network with the following operator:\n\
    \n$$\\mathcal{L}_\\ell(v)(x) = \\sigma\\Big(W_\\ell v(x) + \\int_D \\kappa_\\\
    phi(x,y,a(x),a(y)) v(y) \\mathrm{d}\\mu_x(y)\\Big), \\tag{2.30}$$\n\nwhere $W_\\\
    ell$ and $\\phi$ are to be learned from the data, $\\kappa_\\phi$ is a kernel\
    \ and $\\mu_x$ is a Borel measure for every $x \\in D$. Li et al. (2020) modelled\
    \ the kernel $\\kappa_\\phi$ as a neural network. More generally, neural operators\
    \ are mappings of the form (Li et al. 2020, Kovachki, Lanthaler and Mishra 2021)\n\
    \n$$\\mathcal{N}: \\mathcal{X} \\to \\mathcal{Y}: a \\mapsto \\mathcal{Q} \\circ\
    \ \\mathcal{L}_L \\circ \\mathcal{L}_{L-1} \\circ \\cdots \\circ \\mathcal{L}_1\
    \ \\circ \\mathcal{R}(a), \\tag{2.31}$$\n\nfor a given depth $L \\in \\mathbb{N}$,\
    \ where $\\mathcal{R}: \\mathcal{X}(D;\\mathbb{R}^{d_x}) \\to \\mathcal{U}(D;\\\
    mathbb{R}^{d_v})$, $d_v \\ge d_x$, is a lifting operator (acting locally), of\
    \ the form\n\n$$\\mathcal{R}(a)(x) = R a(x), \\quad R \\in \\mathbb{R}^{d_v \\\
    times d_x}, \\tag{2.32}$$\n\nand $\\mathcal{Q}: \\mathcal{U}(D;\\mathbb{R}^{d_v})\
    \ \\to \\mathcal{Y}(D;\\mathbb{R}^{d_y})$ is a local projection operator, of the\
    \ form\n\n$$\\mathcal{Q}(v)(x) = Q v(x), \\quad Q \\in \\mathbb{R}^{d_y \\times\
    \ d_v}. \\tag{2.33}$$\n\nIn analogy with canonical finite-dimensional neural networks,\
    \ the layers $\\mathcal{L}_1, \\dots, \\mathcal{L}_L$ are nonlinear operator layers,\
    \ $\\mathcal{L}_\\ell: \\mathcal{U}(D;\\mathbb{R}^{d_v}) \\to \\mathcal{U}(D;\\\
    mathbb{R}^{d_v})$, $v \\mapsto \\mathcal{L}_\\ell(v)$, which we assume to be of\
    \ the form\n\n$$\\mathcal{L}_\\ell(v)(x) = \\sigma\\big(W_\\ell v(x) + b_\\ell(x)\
    \ + (\\mathcal{K}(a;\\theta_\\ell)v)(x)\\big) \\quad \\text{for all } x \\in D.\
    \ \\tag{2.34}$$\n\nHere, the weight matrix $W_\\ell \\in \\mathbb{R}^{d_v \\times\
    \ d_v}$ and bias $b_\\ell(x) \\in \\mathcal{U}(D;\\mathbb{R}^{d_v})$ define an\
    \ affine pointwise mapping $W_\\ell v(x) + b_\\ell(x)$. We conclude the definition\
    \ of a neural operator by stating that $\\sigma: \\mathbb{R} \\to \\mathbb{R}$\
    \ is a nonlinear activation function that is applied component-wise, and $\\mathcal{K}$\
    \ is a non-local linear operator,\n\n$$\\mathcal{K}: \\mathcal{X} \\times \\Theta\
    \ \\to L(\\mathcal{U}(D;\\mathbb{R}^{d_v}),\\mathcal{U}(D;\\mathbb{R}^{d_v})),\
    \ \\tag{2.35}$$\n\nthat maps the input field $a$ and a parameter $\\theta \\in\
    \ \\Theta$ in the parameter set $\\Theta$ to a bounded linear operator $\\mathcal{K}(a,\\\
    theta): \\mathcal{U}(D;\\mathbb{R}^{d_v}) \\to \\mathcal{U}(D;\\mathbb{R}^{d_v})$.\
    \ When we define the linear operators $\\mathcal{K}(a,\\theta)$ through an integral\
    \ kernel, then (2.34) reduces again to (2.30). Fourier neural operators (FNOs)\
    \ (Li et al. 2021) are special cases of such general neural operators in which\
    \ this integral kernel corresponds to a convolution kernel, which on the periodic\
    \ domain $\\mathbb{T}^d$ leads to nonlinear layers $\\mathcal{L}_\\ell$ of the\
    \ form\n\n$$\\mathcal{L}_\\ell(v)(x) = \\sigma\\big(W_\\ell v(x) + b_\\ell(x)\
    \ + \\mathcal{F}^{-1}(P_\\ell(k) \\cdot \\mathcal{F}(v)(k))(x)\\big). \\tag{2.36}$$\n\
    \nIn practice, however, this definition cannot be used, as evaluating the Fourier\
    \ transform requires the exact computation of an integral. The practical implementation\
    \ (i.e. discretization) of an FNO maps from and to the space of trigonometric\
    \ polynomials of degree at most $N \\in \\mathbb{N}$, denoted by $L_N^2$, and\
    \ can be identified with a finite-dimensional mapping that is a composition of\
    \ affine maps and nonlinear layers of the form\n\n$$\\mathcal{L}_\\ell(z)_j =\
    \ \\sigma\\left(W_\\ell z_j + b_{\\ell,j} + \\mathcal{F}_N^{-1}\\left(P_\\ell(k)\\\
    cdot\\mathcal{F}_N(z)_{k,j}\\right)\\right). \\tag{2.37}$$\n\nwhere the $P_\\\
    ell(k)$ are coefficients that define a non-local convolution operator via the\
    \ discrete Fourier transform $\\mathcal{F}_N$; see Kovachki *et al.* (2021).\n\
    \nIt has been observed that the proposed operator learning models above may not\
    \ behave as operators when implemented on a computer, questioning the very essence\
    \ of what operator learning should be. Bartolucci *et al.* (2023) contend that\
    \ in addition to defining the operator at the continuous level, some form of continuous–discrete\
    \ equivalence is necessary for an architecture to genuinely learn the underlying\
    \ operator rather than just discretizations of it. To this end, they introduce\
    \ the unifying mathematical framework of *representation-equivalent neural operators*\
    \ (ReNOs) to ensure that operations at the continuous and discrete level are equivalent.\
    \ Lack of this equivalence is quantified in terms of aliasing errors.\n\n## *Gaussian\
    \ processes.*\n\nDeep neural networks and their operator versions are only one\
    \ possible nonlinear surrogate model for the true solution $u$. Another popular\
    \ class of nonlinear models is *Gaussian process regression* (Rasmussen 2003),\
    \ which belongs to a larger class of so-called Bayesian models. Gaussian process\
    \ regression (GPR) relies on the assumption that $u$ is drawn from a Gaussian\
    \ measure on a suitable function space, parametrized by\n\n$$u_\\theta(x) \\sim\
    \ \\mathrm{GP}\\bigl(m_\\theta(x), k_\\theta(x,x')\\bigr), \\tag{2.38}$$\n\nwhere\
    \ $m_\\theta(x)=\\mathbb{E}[u_\\theta(x)]$ is the mean, and the underlying covariance\
    \ function is given by $k_\\theta(x,x')=\\mathbb{E}[(u_\\theta(x)-m_\\theta(x))(u_\\\
    theta(x')-m_\\theta(x'))]$.\n\nPopular choices for the covariance function in\
    \ (2.38) are the squared exponential kernel (which is a radial function as for\
    \ RBFs) and Matérn covariance functions:\n\n$$k_{\\mathrm{SE}}(x,x')=\\exp\\left(-\\\
    frac{\\lVert x-x'\\rVert^2}{2\\ell^2}\\right), \\tag{2.39}$$\n\n$$k_{\\mathrm{Matern}}(x,x')=\\\
    frac{2^{1-\\nu}}{\\Gamma(\\nu)}\\left(\\sqrt{2\\nu}\\frac{\\lVert x-x'\\rVert}{\\\
    ell}\\right)^\\nu K_\\nu\\left(\\sqrt{2\\nu}\\frac{\\lVert x-x'\\rVert}{\\ell}\\\
    right). \\tag{2.40}$$\n\nHere $\\lVert\\cdot\\rVert$ denotes the standard Euclidean\
    \ norm, $K_\\nu$ is the modified Bessel function of the second kind and $\\ell$\
    \ is the *characteristic length*, describing the length scale of the correlations\
    \ between the points $x$ and $x'$. The parameter vector then consists of the hyperparameters\
    \ of $m_\\theta$ and $k_\\theta$, such as $\\nu$ and $\\ell$.\n"
  mdcn: "\n\n随机初始化的权重和偏置与仅训练外层的神经网络密切相关。当网络规模较大时，后一种模型通常被称为极限学习机（ELM）（Huang, Zhu and\
    \ Siew 2006）。\n\n## 2.2.2. 非线性模型\n\n神经网络。在对其参数呈非线性依赖的参数模型中，第一个但非常核心的例子是神经网络。神经网络最简单的形式是多层感知机（MLP）。MLP\
    \ 因其被定义为仿射映射和激活函数的串联而得名。由于这一结构，MLP 的计算图按层组织。在第 k 层，激活函数被逐分量地应用以获得值\n\n$$z^k =\
    \ \\sigma(C_{k-1}(z^{k-1})) = \\sigma(W_{k-1}z^{k-1} + b_{k-1}), \\tag{2.21}$$\n\
    \n其中 $z^0$ 是网络的输入，$W_k \\in \\mathbb{R}^{d_{k+1}\\times d_k}$，$b_k \\in \\mathbb{R}^{d_{k+1}}$，且\
    \ $C_k: \\mathbb{R}^{d_k} \\to \\mathbb{R}^{d_{k+1}}: x \\mapsto W_k x + b_k$（$d_k\
    \ \\in \\mathbb{N}$）是一个仿射映射。具有 L 层、激活函数 $\\sigma$、输出函数 $\\sigma_o$、输入维度 $d_{\\\
    mathrm{in}}$ 和输出维度 $d_{\\mathrm{out}}$ 的多层感知机（MLP）则是如下形式的函数 $f_\\theta: \\mathbb{R}^{d_{\\\
    mathrm{in}}} \\to \\mathbb{R}^{d_{\\mathrm{out}}}$：\n\n$$f_\\theta(x) = (\\sigma_o\
    \ \\circ C_L \\circ \\sigma \\circ \\cdots \\circ \\sigma \\circ C_0)(x) \\quad\
    \ \\text{for all } x \\in \\mathbb{R}^{d_{\\mathrm{in}}}, \\tag{2.22}$$\n\n其中\
    \ $\\sigma$ 被逐元素地应用，且 $\\theta = ((W_0, b_0), \\ldots, (W_L, b_L))$。每一层的维度 $d_k$\
    \ 也称为该层的宽度。MLP 的宽度定义为 $\\max_k d_k$。此外，矩阵 $W_k$ 称为 MLP 的权重，向量 $b_k$ 称为 MLP 的偏置。它们共同构成\
    \ MLP 的（可训练）参数，记为 $\\theta = ((W_0, b_0), \\ldots, (W_L, b_L))$。最后，可以使用输出函数 $\\\
    sigma_o$ 来提高输出的可解释性，但在函数逼近的场景中，它通常等于恒等函数。\n\n## 注 2.8.\n\n在一些文献中，层数 L 对应于 $f_\\\
    theta$ 定义中仿射映射的数量。在这 L 层中，前 L − 1 层称为隐藏层。因此，在这种替代定义下，L 层网络对应于我们定义中的 (L − 1) 层网络。\n\
    \n神经网络的许多性质取决于激活函数的选择。下面我们讨论最常见的激活函数。\n\n- 赫维赛德函数是 McCulloch–Pitts 神经元中使用的激活函数，其定义为\n\
    \n  $$H(x) = \\begin{cases} 0, & x < 0;\\\\ 1, & x \\ge 0. \\end{cases} \\tag{2.23}$$\n\
    \n  由于梯度在存在处均为零，因此无法使用基于梯度的方法训练网络。因此，赫维赛德函数已不再使用。\n\n受以下事实启发：在某些一般条件下，PDE (2.1)\
    \ 的解 $u$ 可以表示为\n\n$$u(x) = \\int_D G(x,y) f(y) \\mathrm{d}y, \\tag{2.29}$$\n\n\
    其中 $G: D \\times D \\to \\mathbb{R}$ 是格林函数。这种核表示促使 Li 等人 (2020) 提出用以下算子替换标准神经网络的隐藏层公式：\n\
    \n$$\\mathcal{L}_\\ell(v)(x) = \\sigma\\Big(W_\\ell v(x) + \\int_D \\kappa_\\\
    phi(x,y,a(x),a(y)) v(y) \\mathrm{d}\\mu_x(y)\\Big), \\tag{2.30}$$\n\n其中 $W_\\\
    ell$ 和 $\\phi$ 需要从数据中学习，$\\kappa_\\phi$ 是一个核，且对于每个 $x \\in D$，$\\mu_x$ 是一个 Borel\
    \ 测度。Li 等人 (2020) 将核 $\\kappa_\\phi$ 建模为神经网络。更一般地，神经算子是如下形式的映射（Li 等人 2020；Kovachki、Lanthaler\
    \ 和 Mishra 2021）\n\n$$\\mathcal{N}: \\mathcal{X} \\to \\mathcal{Y}: a \\mapsto\
    \ \\mathcal{Q} \\circ \\mathcal{L}_L \\circ \\mathcal{L}_{L-1} \\circ \\cdots\
    \ \\circ \\mathcal{L}_1 \\circ \\mathcal{R}(a), \\tag{2.31}$$\n\n对于给定的深度 $L \\\
    in \\mathbb{N}$，其中 $\\mathcal{R}: \\mathcal{X}(D;\\mathbb{R}^{d_x}) \\to \\mathcal{U}(D;\\\
    mathbb{R}^{d_v})$，$d_v \\ge d_x$，是一个（局部作用的）提升算子，其形式为\n\n$$\\mathcal{R}(a)(x) =\
    \ R a(x), \\quad R \\in \\mathbb{R}^{d_v \\times d_x}, \\tag{2.32}$$\n\n而 $\\\
    mathcal{Q}: \\mathcal{U}(D;\\mathbb{R}^{d_v}) \\to \\mathcal{Y}(D;\\mathbb{R}^{d_y})$\
    \ 是一个局部投影算子，其形式为\n\n$$\\mathcal{Q}(v)(x) = Q v(x), \\quad Q \\in \\mathbb{R}^{d_y\
    \ \\times d_v}. \\tag{2.33}$$\n\n与经典有限维神经网络类似，层 $\\mathcal{L}_1, \\dots, \\mathcal{L}_L$\
    \ 是非线性算子层，$\\mathcal{L}_\\ell: \\mathcal{U}(D;\\mathbb{R}^{d_v}) \\to \\mathcal{U}(D;\\\
    mathbb{R}^{d_v})$，$v \\mapsto \\mathcal{L}_\\ell(v)$，我们假设其形式为\n\n$$\\mathcal{L}_\\\
    ell(v)(x) = \\sigma\\big(W_\\ell v(x) + b_\\ell(x) + (\\mathcal{K}(a;\\theta_\\\
    ell)v)(x)\\big) \\quad \\text{for all } x \\in D. \\tag{2.34}$$\n\n这里，权重矩阵 $W_\\\
    ell \\in \\mathbb{R}^{d_v \\times d_v}$ 和偏置 $b_\\ell(x) \\in \\mathcal{U}(D;\\\
    mathbb{R}^{d_v})$ 定义了一个逐点仿射映射 $W_\\ell v(x) + b_\\ell(x)$。我们通过说明以下内容来结束神经算子的定义：$\\\
    sigma: \\mathbb{R} \\to \\mathbb{R}$ 是一个逐分量应用的非线性激活函数，而 $\\mathcal{K}$ 是一个非局部线性算子，\n\
    \n$$\\mathcal{K}: \\mathcal{X} \\times \\Theta \\to L(\\mathcal{U}(D;\\mathbb{R}^{d_v}),\\\
    mathcal{U}(D;\\mathbb{R}^{d_v})), \\tag{2.35}$$\n\n它将输入场 $a$ 和参数集 $\\Theta$ 中的参数\
    \ $\\theta \\in \\Theta$ 映射到有界线性算子 $\\mathcal{K}(a,\\theta): \\mathcal{U}(D;\\\
    mathbb{R}^{d_v}) \\to \\mathcal{U}(D;\\mathbb{R}^{d_v})$。当我们通过积分核定义线性算子 $\\mathcal{K}(a,\\\
    theta)$ 时，(2.34) 又简化为 (2.30)。傅里叶神经算子（FNO）（Li 等人 2021）是此类一般神经算子的特例，其中积分核对应于卷积核，在周期域\
    \ $\\mathbb{T}^d$ 上得到如下形式的非线性层 $\\mathcal{L}_\\ell$：\n\n$$\\mathcal{L}_\\ell(v)(x)\
    \ = \\sigma\\big(W_\\ell v(x) + b_\\ell(x) + \\mathcal{F}^{-1}(P_\\ell(k) \\cdot\
    \ \\mathcal{F}(v)(k))(x)\\big). \\tag{2.36}$$\n\n然而在实践中，这一定义无法使用，因为计算傅里叶变换需要精确计算积分。FNO\
    \ 的实际实现（即离散化）在次数至多为 $N \\in \\mathbb{N}$ 的三角多项式空间（记为 $L_N^2$）之间进行映射，并可等同于一个有限维映射，该映射是仿射映射和如下形式非线性层的复合：\n\
    \n$$\\mathcal{L}_\\ell(z)_j = \\sigma\\left(W_\\ell z_j + b_{\\ell,j} + \\mathcal{F}_N^{-1}\\\
    left(P_\\ell(k)\\cdot\\mathcal{F}_N(z)_{k,j}\\right)\\right). \\tag{2.37}$$\n\n\
    其中 $P_\\ell(k)$ 是通过离散傅里叶变换 $\\mathcal{F}_N$ 定义非局部卷积算子的系数；参见 Kovachki *等人* (2021)。\n\
    \n人们已经观察到，上述提出的算子学习模型在计算机上实现时可能不会像算子那样表现，这质疑了算子学习应该是什么的本质。Bartolucci *等人* (2023)\
    \ 认为，除了在连续层面定义算子之外，某种形式的连续–离散等价性对于架构真正学习底层算子、而不仅仅是其离散化是必要的。为此，他们引入了*表示等价神经算子*（ReNO）的统一数学框架，以确保连续和离散层面的操作等价。缺乏这种等价性可以用混叠误差来量化。\n\
    \n## *高斯过程。*\n\n深度神经网络及其算子版本只是真实解 $u$ 的一种可能的非线性替代模型。另一类流行的非线性模型是*高斯过程回归*（Rasmussen\
    \ 2003），它属于更大的一类所谓贝叶斯模型。高斯过程回归（GPR）依赖于这样的假设：$u$ 来自某个合适函数空间上的高斯测度，其参数化为\n\n$$u_\\\
    theta(x) \\sim \\mathrm{GP}\\bigl(m_\\theta(x), k_\\theta(x,x')\\bigr), \\tag{2.38}$$\n\
    \n其中 $m_\\theta(x)=\\mathbb{E}[u_\\theta(x)]$ 是均值，底层协方差函数由 $k_\\theta(x,x')=\\\
    mathbb{E}[(u_\\theta(x)-m_\\theta(x))(u_\\theta(x')-m_\\theta(x'))]$ 给出。\n\n(2.38)\
