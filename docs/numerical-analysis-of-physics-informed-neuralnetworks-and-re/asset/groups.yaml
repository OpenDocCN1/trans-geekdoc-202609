    # 4.3.2. Results based on Barron regularity


    A second framework that can be used to prove that neural networks can overcome
    the curse of dimensionality is that of Barron spaces. These spaces are named after
    the seminal work of Barron (1993), who showed that a function $f$ with Fourier
    transform $\widehat{f}$ can be approximated to accuracy $1/\sqrt{m}$ by a shallow
    neural network with $m$ neurons, as long as


    $$\int_{\mathbb{R}^d} |\widehat{f}(\xi)| \cdot |\xi| \, d\xi < \infty.\tag{4.27}$$


    Later, the space of functions satisfying condition (4.27) was named a Barron space,
    and its definition was generalized in many different ways. One notable generalization
    is that of spectral Barron spaces.


    # Definition 4.28.


    The spectral Barron space with index $s$, denoted $\mathcal{B}^s(\mathbb{R}^d)$,
    is defined as the collection of functions $f : \mathbb{R}^d \to \mathbb{R}$ for
    which the spectral Barron norm is finite:


    $$\|f\|_{\mathcal{B}^s(\mathbb{R}^d)} := \int_{\mathbb{R}^d} |\widehat{f}(\xi)|
    \cdot (1 + |\xi|^2)^{s/2} \, d\xi < \infty.\tag{4.28}$$


    First, notice how the initial condition (4.27) of Barron (1993) corresponds to
    the spectral Barron space $\mathcal{B}^1(\mathbb{R}^d)$. Second, from this definition
    the difference between Barron spaces and Sobolev spaces becomes apparent: whereas
    the spectral Barron norm is the $L^1$-norm of $|\widehat{f}(\xi)| \cdot (1 + |\xi|^2)^{s/2}$,
    the Sobolev $H^s(\mathbb{R}^d)$-norm is defined as the $L^2$-norm of that same
    quantity. Finally, it follows that $\mathcal{B}^r(\mathbb{R}^d) \subset \mathcal{B}^s(\mathbb{R}^d)$
    for $r \ge s$ and that $\mathcal{B}^0(\mathbb{R}^d) \subset L^\infty(\mathbb{R}^d)$;
    see e.g. Chen, Lu, Lu and Zhou (2023).


    An example of an approximation result for functions in spectral Barron spaces
    can be found in Lu, Lu and Wang (2021c) for functions with the softplus activation
    function.


    # Theorem 4.29.


    Let $\Omega = [0,1]^d$. For every $u \in \mathcal{B}^2(\Omega)$, there exists
    a shallow neural network $\widehat{u}$ with softplus activation function $(\sigma(x)
    = \ln(1 + \exp(x)))$, with width at most $m$, such that


    $$\|u - \widehat{u}\|_{H^1(\Omega)} \le \frac{\|u\|_{\mathcal{B}^2(\Omega)} (6
    \log(m) + 30)}{\sqrt{m}}.\tag{4.29}$$


    Moreover, an exact bound on the weights is given in Lu et al. (2021c, Theorem
    2.2).'
