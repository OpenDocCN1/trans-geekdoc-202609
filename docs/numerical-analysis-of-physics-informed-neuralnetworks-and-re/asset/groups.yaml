    函数 $x \mapsto \phi_i(x) := \varphi(\|x - x_i\|)$ 线性无关；(ii) 其元素为 $A_{ij} = \varphi(\|x_i
    - x_j\|)$ 的矩阵 $A$ 非奇异。径向函数可以具有全局支集（例如高斯函数、多调和样条），也可以具有紧支集（例如 bump 函数）。随后，可以通过
