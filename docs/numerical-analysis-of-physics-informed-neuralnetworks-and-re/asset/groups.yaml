    via (stochastic) gradient descent to obtain a neural network that approximates
    the solution of the underlying PDE. This framework was already considered in the
    1990s, in Dissanayake and Phan-Thien (1994), Lagaris, Likas and Fotiadis (1998),
    Lagaris, Likas and Papageorgiou (2000) and references therein, and these papers
    should be considered as the progenitors of PINNs. However, the modern version
    of PINNs was introduced, and named more recently in Raissi and Karniadakis (2018)
    and Raissi, Perdikaris and Karniadakis (2019). Since then, there has been an explosive
    growth in the literature on PINNs and they have been applied in numerous settings,
    in the solution of both forward and inverse problems for PDEs and related equations
    (SDEs, SPDEs); see Karniadakis et al. (2021) and Cuomo et al. (2022) for extensive
    reviews of the available literature on PINNs.


    However, PINNs are not the only models within the framework of physics-informed
    machine learning. One can consider other forms of the PDE residual such as the
    variational form resulting in VPINNs (Kharazmi, Zhang and Karniadakis 2019), the
    weak form resulting in wPINNs (De Ryck, Mishra and Molinaro 2024c), or minimizing
    the underlying energy resulting in the DeepRitz method (E and Yu 2018). Similarly,
    one can use Gaussian processes (Rasmussen 2003), DeepONets (Lu et al. 2021b) or
    neural operators (Kovachki et al. 2023) as ansatz spaces to realize alternative
    models for physics-informed machine learning.


    Given the exponentially growing literature on PINNs and related models in physics-informed
    machine learning, it is essential to ask whether these methods possess rigorous
    mathematical guarantees on their performance, and whether one can analyse these
    methods in a manner that is analogous to the huge literature on the analysis of
    traditional numerical methods such as finite differences, finite elements, finite
    volumes and spectral methods. Although the overwhelming focus of research has
    been on the widespread applications of PINNs and their variants in different domains
    in science and engineering, a significant number of papers rigorously analysing
    PINNs have emerged in recent years. The aim of this article is to review the available
    literature on the numerical analysis of PINNs and related models that constitute
    physics-informed machine learning. Our goal is to critically analyse PINNs and
    its variants with a view to ascertaining when they can be applied and what are
    the limits to their applicability. To this end, we start in Section 2 by presenting
    the formulation for physics-informed machine-learning in terms of the underlying
    PDEs, their different forms of residuals and the approximating ansatz spaces.
    In Section 3 we outline the main components of the underlying errors with physics-informed
    machine learning; the resulting approximation, stability, generalization and training
    errors are analysed in Sections 4, 5, 6 and 7, respectively.


    # 2. Physics-informed machine learning


    In this section we set the stage for the rest of the article. In Section 2.1 we
    introduce an abstract PDE setting and consider a number of important examples
    of PDEs that will be used in the numerical analysis later on. Next, in Section
    2.2, different model'
