    变差，(2.66) 中的误差以速率 $(\log(N))^{\bar d} N^{-1}$ 收敛（Longo, Mishra, Rusch and Schwab
    2021）。对于非常高维的问题，$d \gg 20$，蒙特卡洛求积是首选的数值积分方法。在这种情况下，求积点是随机选择的，独立同分布（相对于缩放的勒贝格测度）。作为例子，我们讨论如何离散化基于时变
    PDE (2.46) 的经典形式的物理信息损失。由于损失函数 (2.46) 包含三个不同区域 ($D \times [0,T]$、$\partial D \times
    [0,T]$ 和 $D$) 上的积分，我们必须考虑三种不同的求积。我们考虑求积


    (2.65) 其中权重为网格点数的倒数，如中点或蒙特卡洛求积的情况，并将求积点记为 $\mathcal{S}_i = \{(z_i)\}_{1 \le i
    \le N_i} \subset D \times [0,T]$，$\mathcal{S}_s = \{y_i\}_{1 \le i \le N_s} \subset
    \partial D \times [0,T]$ 和 $\mathcal{S}_t = \{x_i\}_{1 \le i \le N_t} \subset
    D$。遵循机器学习的术语，我们将所有求积点的集合 $\mathcal{S} = (\mathcal{S}_i, \mathcal{S}_s, \mathcal{S}_t)$
    称为 *训练集*。得到的损失函数 $\mathcal{J}$ 现在不仅依赖于 $u_\theta$，还依赖于 $\mathcal{S}$，由下式给出


    $\mathcal{J}(\theta,\mathcal{S}) = \mathcal{Q}_{N_i}^{D\times[0,T]}[\mathcal{R}_{\mathrm{PDE}}^2]
    + \lambda_s \mathcal{Q}_{N_s}^{\partial D\times[0,T]}[\mathcal{R}_s^2] + \lambda_t
    \mathcal{Q}_{N_t}^{D}[\mathcal{R}_t^2]$

    $= \frac{1}{N_i} \sum_{i=1}^{N_i} (\mathcal{L}[u_\theta](z_i) - f(z_i))^2 + \frac{\lambda_s}{N_s}
    \sum_{i=1}^{N_s} (u_\theta(y_i) - u(y_i))^2$

    $+ \frac{\lambda_t}{N_t} \sum_{i=1}^{N_t} (u_\theta(x_i,0) - u(x_i,0))^2.$

    (2.68)


    对于第 2.3 节中定义的任何其他损失函数，都可以定义类似的离散化。实际上，物理信息学习归结为求解由下式给出的最小化问题


    $\theta^*(\mathcal{S}) := \argmin_{\theta \in \Theta} \mathcal{J}(\theta,\mathcal{S}).$

    (2.69)


    最终优化的或 *训练好的* 模型则由 $u^* := u_{\theta^*(\mathcal{S})}$ 给出。


    ## 2.5. Optimization


    由于 $\Theta$ 是高维的且映射 $\theta \mapsto \mathcal{J}(\theta,\mathcal{S})$ 通常是非凸的，求解最小化问题
    (2.69) 可能非常具有挑战性。幸运的是，损失函数 $\mathcal{J}$ 在几乎处处可微，因此可以使用基于梯度的迭代优化方法。


    这类算法最简单的例子是 *梯度下降*。从初始猜测 $\theta_0$ 开始，思想是在参数空间 $\Theta$ 中沿损失函数最陡下降的方向迈出小步以得到新的猜测
    $\theta_1$。注意这相当于在 $\theta_0$ 处计算的梯度的反方向上迈出小步。重复此过程得到迭代公式


    $\theta_{\ell+1} = \theta_{\ell} - \eta_{\ell} \nabla_{\theta} \mathcal{J}(\theta_{\ell},
    \mathcal{S}) \quad \text{for all } \ell \in \mathbb{N},$

    (2.70)


    其中学习率 $\eta_{\ell}$ 控制步长的大小，通常相当小。梯度下降公式产生参数序列 $\{\theta_{\ell}\}_{\ell \in \mathbb{N}}$，在非常一般的条件下收敛到损失函数的局部最小值。由于损失函数是非凸的，无法保证收敛到全局最小值。另一个问题在于梯度
    $\nabla_{\theta} \mathcal{J}(\theta_{\ell}, \mathcal{S})$ 的计算。该梯度定义的一个简单重写（忽略正则化项），


    $\nabla_{\theta} \mathcal{J}(\theta_{\ell}, \mathcal{S}) = \frac{1}{N} \sum_{i=1}^{N}
    \nabla_{\theta} \mathcal{J}_i(\theta_{\ell}), \quad \text{where } \mathcal{J}_i(\theta_{\ell})
    = \mathcal{J}(\theta_{\ell}, \{(x_i, f(x_i))\}),$

    (2.71)

