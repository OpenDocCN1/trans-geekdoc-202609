    $\mathcal{Q}_N^{\Omega}[g] := \sum_{i=1}^{N} w_i g(y_i), \quad (2.65)$


    对于权重 $w_i$ 和求积点 $y_i$。根据权重和求积点的选择，以及 $g$ 的正则性，求积误差被限制为


    $\big|\bar g - \mathcal{Q}_N^{\Omega}[g]\big| \le C_{\text{quad}} N^{-\alpha},
    \quad (2.66)$


    对于某个 $\alpha > 0$，其中 $C_{\text{quad}}$ 依赖于 $g$ 及其性质。


