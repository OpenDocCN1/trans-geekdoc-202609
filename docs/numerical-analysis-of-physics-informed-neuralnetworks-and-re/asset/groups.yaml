    $$\mathsf{A}=\mathsf{D}+\lambda vv^{\mathsf T}, \tag{7.28}$$


    其中 $\mathsf{D}$ 是对角矩阵，且 $\mathsf{D}_{kk}=k^4$，$v:=\phi(\pi)$，即 $v$ 是一个满足 $v_{-k}=(-1)^k/\sqrt{\pi}$、$v_0=1/\sqrt{2\pi}$、$v_k=0$（对于
    $1\leq k\leq K$）的向量。仅基于 $\mathcal{L}^*\mathcal{L}$ 进行预处理将对应于寻找一个矩阵 $\mathsf{P}$，使得
    $\mathsf{P}\mathsf{D}\mathsf{P}^{\mathsf T}=\mathsf{Id}$。然而，由于 $\mathsf{D}_{00}=0$，这不可能实现。因此我们设置
    $\mathsf{P}_{kk}=1/k^2$（对于 $k\neq 0$）以及 $\mathsf{P}_{00}=\gamma\in\mathbb{R}$。因此预处理后的矩阵为


    $$\widetilde{\mathsf{A}}(\lambda,\gamma)=\mathsf{P}\mathsf{D}\mathsf{P}^{\mathsf
    T}+\lambda\mathsf{P}v(\mathsf{P}v)^{\mathsf T}。 \tag{7.29}$$


    上述未预处理和预处理矩阵的条件数总结在以下定理中（De Ryck *等人* 2023）。


