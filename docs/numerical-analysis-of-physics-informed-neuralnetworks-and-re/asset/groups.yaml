    是任意光滑函数，如第 2.2.1 节所引入。如上所述，预处理后的模型形式为 $\tilde{u}_{\theta}(x)=\sum_k(\mathsf{P}\theta)_k\phi_k(x)$，其中
    $\mathsf{P}\in\mathbb{R}^{n\times n}$ 是预处理器。我们用一个简单而广泛使用的例子来论证该预处理器的选择。


    我们的微分算子是一维拉普拉斯算子 $\mathcal{L}=\mathrm{d}^2/\mathrm{d}x^2$，定义在区域 $(-\pi,\pi)$ 上，为简单起见采用周期零边界条件。因此，相应的
