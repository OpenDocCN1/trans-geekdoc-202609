    There are two key questions that must be answered before this theorem can be used
    to argue that neural networks can overcome the CoD in the approximation of PDE
    solutions.


    +   - Under which conditions does it hold that $u \in \mathcal{B}^2(\Omega)$?

    +   - How does $\|u\|_{\mathcal{B}^2(\Omega)}$ depend on $d$?


    Answering these questions requires us to build a regularity theory for Barron
    spaces, which can be challenging as they are not Hilbert spaces such as the Sobolev
    spaces $H^s$. An important contribution for high-dimensional elliptic equations
    has been made in Lu et al. (2021c).


    # Example 4.30 (Poisson’s equation).


    Let $s \ge 0$, let $f \in \mathcal{B}^{s+2}(\Omega)$ satisfy


    $\displaystyle \int_{\Omega} f(x)\,dx = 0$


    and let $u$ be the unique solution to Poisson’s equation $-\Delta u = f$ with
    zero Neumann boundary conditions. Then we have $u \in \mathcal{B}^s(\Omega)$ and
    $\|u\|_{\mathcal{B}^s(\Omega)} \le d\|f\|_{\mathcal{B}^{s+2}(\Omega)}$ (Lu et
    al. 2021c, Theorem 2.6).


    # Example 4.31 (static Schrödinger equation).


    Let $s \ge 0$, let $V \in \mathcal{B}^{s+2}(\Omega)$ satisfy $V(x) \ge V_{\min}
    > 0$ for all $x \in \Omega$ and let $u$ be the unique solution to the static Schrödinger’s
    equation $-\Delta u + Vu = f$ with zero Neumann boundary conditions. Then we have
    $u \in \mathcal{B}^s(\Omega)$ and $\|u\|_{\mathcal{B}^s(\Omega)} \le C\|f\|_{\mathcal{B}^{s+2}(\Omega)}$
    (Chen et al. 2023, Theorem 2.3).


    Similar results for a slightly different definition of Barron spaces (E, Ma and
    Wu 2022) can be found in E and Wojtowytsch (2022b), for example. E et al. also
    showed that the Barron space is the right space for two-layer neural network models
    in the sense that optimal direct and inverse approximation theorems hold. Moreover,
    E and Wojtowytsch (2020, 2022a) explored the connection between Barron and Sobolev
    spaces and provided examples of functions that are and functions that (sometimes
    surprisingly) are not Barron functions.


    Another slightly different definition can be found in Chen et al. (2021), where
    a Barron function $g$ is defined as a function that can be written as an infinite-width
