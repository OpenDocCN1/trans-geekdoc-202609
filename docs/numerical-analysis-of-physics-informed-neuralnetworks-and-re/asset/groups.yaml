    problem for the Stokes equation (2.17)–(2.18) have been extensively investigated
    in Lin, Uhlmann and Wang (2010) and references therein. Using these results, we
    can state the following estimate on \(\mathcal{E}_R(\theta)\) (Mishra and Molinaro
    2022, Lemma 6.2). The physics-informed residuals \(\mathcal{R}_{\mathrm{PDE}}\)
    and \(\mathcal{R}_{\mathrm{div}}\) are defined analogously to those in Example
    5.6.


    ### Theorem 5.23.


    Let \(f\in C^{k-2}(D;\mathbb{R}^d)\), \(f_d\in C^{k-1}(D)\) and \(g\in C^k(D'')\),
    with \(k\ge2\). Further, let \(u\in H^1(D;\mathbb{R}^d)\) and \(p\in H^1(D)\)
    be the solution of the inverse problem corresponding to the Stokes equations (2.17),
    that is, they satisfy (5.35) for all test functions \(v\in H_0^1(D;\mathbb{R}^d)\),
