    ## 8. 结论


    在本文中，我们对物理信息机器学习模型（如 PINNs 及其变体）的数值分析的可用理论结果进行了详细综述，这些模型用于求解大量偏微分方程的前向和逆问题。


    我们将物理信息机器学习表述为在参数函数 Ansatz 空间的合适子空间内最小化底层偏微分方程残差的合适形式（强形式、弱形式、变分形式）。PINNs 是该一般表述的特例，对应于偏微分方程残差的强形式以及神经网络作为
    Ansatz 空间。残差通过（随机）梯度下降算法的变体进行最小化。


    我们的分析表明，只要偏微分方程的解在合适的意义下是稳定的，整体（总）误差——即精确偏微分方程解与物理信息机器学习模型（训练后）产生的近似之间的不匹配——就可以用以下组成部分来估计：（i）近似误差，它衡量
    Ansatz 空间（或假设类）内偏微分方程残差的大小，（ii）泛化差距，它衡量求积误差，以及（iii）优化误差，它量化优化问题被解决得有多好。对误差的每个组成部分都提供了详细的分析，既有一般性的，也有针对许多典型偏微分方程的示例。尽管大部分分析是偏微分方程特定的，但我们可以在偏微分方程和模型之间辨识出许多共同特征，下面予以总结。


    - 底层偏微分方程的（弱）稳定性在分析中起关键作用，这可能是偏微分方程特定的。一般而言，误差估计可能取决于底层偏微分方程的解相对于扰动的变化方式。这也与传统数值方法的分析一致。

    - 分析中通常需要底层偏微分方程解的充分正则性，尽管通过改变偏微分方程的形式可以降低这种正则性要求。

    - 物理信息机器学习中的关键瓶颈源于模型无法正确训练。一般而言，训练 PINNs 及其变体可能很困难，因为它取决于底层微分算子 Hermitian 平方的谱性质，尽管合适的预处理可能会改善训练问题。


    最后，理论确实为从业者提供了关于如何以及何时使用 PINNs 及其变体的一些指导。简而言之，正则性决定了形式（强形式与弱形式），并且预计物理信息机器学习模型在高维问题上会优于传统方法（见
    Mishra 和 Molinaro 2021 为例），或具有复杂几何的问题，其中网格生成成本过高，或逆问题，其中数据补充了物理信息。当物理信息机器学习与神经算子等算子学习模型相结合时将特别有吸引力，因为底层空间是无限维的。对物理信息算子学习模型的更多研究是高度期望的。


    ## 附录：Sobolev 空间


    设 $d \in \mathbb{N}$, $k \in \mathbb{N}_0$, $1 \le p \le \infty$ 且 $\Omega \subseteq
    \mathbb{R}^d$ 为开集。对于函数 $f : \Omega \to \mathbb{R}$ 和（多）指标 $\alpha \in \mathbb{N}_0^d$，我们令


    $$D^{\alpha} f = \frac{\partial^{|\alpha|} f}{\partial x_1^{\alpha_1} \cdots \partial
    x_d^{\alpha_d}}\tag{A.1}$$


    表示 $f$ 的经典或分布（即弱）导数。我们令 $L^p(\Omega)$ 表示通常的 Lebesgue 空间，并将 Sobolev 空间 $W^{k,p}(\Omega)$
    定义为


    $$W^{k,p}(\Omega) = \{f \in L^p(\Omega) : D^{\alpha} f \in L^p(\Omega) \text{
    for all } \alpha \in \mathbb{N}_0^d \text{ with } |\alpha| \le k\}.\tag{A.2}$$


    我们在 $W^{k,p}(\Omega)$ 上定义以下半范数：对于 $p < \infty$,


    $$|f|_{W^{m,p}(\Omega)} = \left(\sum_{|\alpha|=m} \|D^{\alpha} f\|_{L^p(\Omega)}^p\right)^{1/p}
    \quad \text{for } m = 0,\dots,k,\tag{A.3}$$


    对于 $p = \infty$,


    $$|f|_{W^{m,\infty}(\Omega)} = \max_{|\alpha|=m} \|D^{\alpha} f\|_{L^{\infty}(\Omega)}
    \quad \text{for } m = 0,\dots,k.\tag{A.4}$$


    基于这些半范数，我们可以定义以下范数：对于 $p < \infty$,


    $$\|f\|_{W^{k,p}(\Omega)} = \left(\sum_{m=0}^{k} |f|_{W^{m,p}(\Omega)}^p\right)^{1/p},\tag{A.5}$$


    对于 $p = \infty$,


    $$\|f\|_{W^{k,\infty}(\Omega)} = \max_{0 \le m \le k} |f|_{W^{m,\infty}(\Omega)}.\tag{A.6}$$


    赋予范数 $\|\cdot\|_{W^{k,p}(\Omega)}$ 的空间 $W^{k,p}(\Omega)$ 是一个 Banach 空间。


    我们令 $C^k(\Omega)$ 表示 $k$ 次连续可微的函数空间，并用范数 $\|f\|_{C^k(\Omega)} = \|f\|_{W^{k,\infty}(\Omega)}$
    装备该空间。


