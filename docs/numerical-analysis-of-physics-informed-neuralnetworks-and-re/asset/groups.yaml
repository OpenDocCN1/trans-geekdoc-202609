    in the whole space–time domain \(\Omega=D\times(0,T)\), given data on the observation
    subdomain \(\Omega''=D''\times(0,T)\). For any \(0\le\tau<T\), we define the error
    of interest for the model \(u_\theta\) as


    \[

    \mathcal{E}_\tau(\theta)=\|u-u_\theta\|_{C([\tau,T];L^2(D))}+\|u-u_\theta\|_{L^2((0,T);H^1(D))}.
    \tag{5.33}

    \]


