    $\mathcal{Q}_N^{\Omega}[g] := \frac{1}{N} \sum_{i=1}^{N} g(y_i), \quad \big|\bar
    g - \mathcal{Q}_M^{\Omega}[g]\big| \le C_g N^{-2/d}, \quad (2.67)$


    其中 $C_g \lesssim \|g\|_{C^2}$。


    只要区域 $\Omega$ 的维度足够低，即 $\bar d \le 4$，我们就可以在底层网格上使用中点法则和更一般的标准（复合）高斯求积规则。在这种情况下，求积点和权重取决于求积规则的阶数（Stoer
    and Bulirsch 2002），而速率 $\alpha$ 取决于底层被积函数的正则性。另一方面，这些基于网格的求积规则不适用于高维区域。对于中等高维，即
