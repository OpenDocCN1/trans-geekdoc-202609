    \[

    \mathcal{E}_R(\theta)^2\le C\cdot\max_{\gamma\in\{1,\tau\}}\left(\|\mathcal{R}_{\mathrm{PDE}}[u_\theta]\|_{L^2(D)}^2+\|\mathcal{R}_{\mathrm{div}}[u_\theta]\|_{L^2(D)}^2\right)^\gamma\left(1+\|\mathcal{R}_d[u_\theta]\|_{L^2(D)}^{2\tau}\right),
