    meaning that the number of parameters needed to reach an accuracy of $\varepsilon$
    scales exponentially with the input dimension $d$, namely as $\varepsilon^{-(s
    - k)/d}$. Unless $s \approx k + d$, this will mean that an infeasibly large number
    of parameters is needed to guarantee a sufficiently small generalization error.
    Experimentally, however, we have observed for many PDEs that the CoD can be overcome.
    This raises the following question: Can we improve upon the approximation results
