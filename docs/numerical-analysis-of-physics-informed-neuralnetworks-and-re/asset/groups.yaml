    ## 8. Conclusion


    In this article we have provided a detailed review of available theoretical results
    on the numerical analysis of physics-informed machine learning models, such as
    PINNs and its variants, for the solution of forward and inverse problems for large
    classes of PDEs. We formulated physics-informed machine learning in terms of minimizing
    suitable forms (strong, weak, variational) of the residual of the underlying PDE
    within suitable subspaces of Ansatz spaces of parametric functions. PINNs are
    a special case of this general formulation corresponding to the strong form of
    the PDE residual and neural networks as Ansatz spaces. The residual is minimized
    with variants of the (stochastic) gradient descent algorithm.


    Our analysis revealed that as long as the solutions to the PDE are stable in a
    suitable sense, the overall (total) error, which is the mismatch between the exact
    PDE solution and the approximation produced (after training) of the physics-informed
    machine learning model, can be estimated in terms of the following constituents:
    (i) the approximation error, which measures the smallness of the PDE residual
    within the Ansatz space (or hypothesis class), (ii) the generalization gap, which
    measures the quadrature error, and (iii) the optimization error, which quantifies
    how well the optimization problem is solved. Detailed analysis of each component
    of the error is provided, both in general terms as well as exemplified for many
    prototypical PDEs. Although a lot of the analysis is PDE-specific, we can discern
    many features that are shared across PDEs and models, which we summarize below.


    - The (weak) stability of the underlying PDE plays a key role in the analysis,
    and this can be PDE-specific. In general, error estimates can depend on how the
    solution of the underlying PDEs changes with respect to perturbations. This is
    also consistent with the analysis of traditional numerical methods.

    - Sufficient regularity of the underlying PDE solution is often required in the
    analysis, although this regularity can be lessened by changing the form of the
    PDE.

    - The key bottleneck in physics-informed machine learning is due to the inability
    of the models to train properly. Generically, training PINNs and their variants
    can be difficult, as it depends on the spectral properties of the Hermitian square
    of the underlying differential operator, although suitable preconditioning might
    ameliorate training issues.


    Finally, theory does provide some guidance to practitioners about how and when
    PINNs and their variants can be used. Succinctly, regularity dictates the form
    (strong vs. weak), and physics-informed machine learning models are expected to
    outperform traditional methods on high-dimensional problems (see Mishra and Molinaro
    2021 as an example) or problems with complex geometries, where grid generation
    is prohibitively expensive, or inverse problems, where data supplements the physics.
    Physics-informed machine learning will be particularly attractive when coupled
    with operator learning models such as neural operators, as the underlying space
    is infinite-dimensional. More research on physics-informed operator learning models
    is highly desirable.


