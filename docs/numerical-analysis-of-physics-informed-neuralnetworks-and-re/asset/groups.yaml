    # Numerical analysis of physics-informed neural networks and related models in
    physics-informed machine learning


    Tim De Ryck

    Seminar for Applied Mathematics, ETH Zürich,

    Rämistrasse 101, 8092 Zürich, Switzerland

    E-mail: tim.deryck@math.ethz.ch


    Siddhartha Mishra

    Seminar for Applied Mathematics & ETH AI Center, ETH Zürich,

    Rämistrasse 101, 8092 Zürich, Switzerland

    E-mail: siddhartha.mishra@math.ethz.ch


    Physics-informed neural networks (PINNs) and their variants have been very popular
    in recent years as algorithms for the numerical simulation of both forward and
    inverse problems for partial differential equations. This article aims to provide
    a comprehensive review of currently available results on the numerical analysis
    of PINNs and related models that constitute the backbone of physics-informed machine
    learning. We provide a unified framework in which analysis of the various components
    of the error incurred by PINNs in approximating PDEs can be effectively carried
    out. We present a detailed review of available results on approximation, generalization
    and training errors and their behaviour with respect to the type of the PDE and
    the dimension of the underlying domain. In particular, we elucidate the role of
    the regularity of the solutions and their stability to perturbations in the error
    analysis. Numerical results are also presented to illustrate the theory. We identify
    training errors as a key bottleneck which can adversely affect the overall performance
    of various models in physics-informed machine learning.


    2020 Mathematics Subject Classification: Primary 65M15

    Secondary 68T07, 35A35'
