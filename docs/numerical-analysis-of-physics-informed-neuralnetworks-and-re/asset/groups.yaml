    ## 7. 训练


    尽管在前几节中对我们前三个问题（Q1–Q3）的回答总体上是肯定的，但物理信息机器学习中已经发现了重大问题。可以说，最首要的问题在于使用（变体的）梯度下降方法来*训练*这些框架。越来越多的观察表明，PINN及其变体即使在某些模型问题上也*训练缓慢，甚至不可行*，训练过程要么不收敛，要么收敛到不可接受的大损失值（Krishnapriyan
