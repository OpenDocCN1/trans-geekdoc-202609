    \ 5. 稳定性\n\n接下来，我们研究较小的物理信息损失是否意味着较小的总误差（通常是 $L^2$ 误差），如下面的问题所述。\n\n**问题 2（Q2）。**\
    \ 给定一个模型 $\\mu_\\theta$ 具有较小的泛化误差 $\\mathcal{E}_G(\\theta)$，相应的总误差 $\\mathcal{E}(\\\
    theta)$ 是否也会较小？\n\n在一般性结果中，我们将重点研究基于 PDE 强（经典）形式的物理信息损失函数，但也会给出一些损失基于弱解（例 5.8）或变分解（例\
    \ 5.11）的例子。我们首先考察正问题的稳定性结果（第 5.1 节），之后再考察反问题的稳定性结果（第 5.2 节）。\n\n### 5.1. 正问题的稳定性\n\
    \n我们研究小的 PDE 残差是否也意味着总误差 (3.1) 较小（问题 2）。这样的稳定性界可以表述为如下要求：对任意 $u,v\\in X^*$，微分算子\
    \ $\\mathcal{L}$ 满足\n\n$$\\|u-v\\|_X \\le C_{\\mathrm{PDE}}\\|\\mathcal{L}(u)-\\\
    mathcal{L}(v)\\|_Y, \\tag{5.1}$$\n\n其中常数 $C_{\\mathrm{PDE}}>0$ 可以依赖于 $\\|u\\|_{X^*}$\
    \ 和 $\\|v\\|_{X^*}$。\n\n作为满足 (5.1) 的 PDE 解的第一个例子，我们考虑线性微分算子 $\\mathcal{L}:X\\\
    to Y$，即对任意 $\\alpha,\\beta\\in\\mathbb{R}$，有 $\\mathcal{L}(\\alpha u+\\beta v)=\\\
    alpha\\mathcal{L}(u)+\\beta\\mathcal{L}(v)$。为简单起见，令 $X^*=X$，$Y^*=Y$。由 (5.1) 以及底层线性\
    \ PDE (2.1) 解的存在唯一性，存在一个*逆*算子 $\\mathcal{L}^{-1}:Y\\to X$。注意，如果逆算子有界，即关于从 $Y$\
    \ 到 $X$ 的线性算子上的自然范数有 $\\|\\mathcal{L}^{-1}\\|_{\\mathrm{op}}\\le C<+\\infty$，则假设\
    \ (5.1) 成立。因此，对于线性 PDE，关于稳定性的假设 (5.1) 归结为逆算子的有界性。许多著名的线性 PDE 都具有这种有界逆算子（Dautray\
    \ 和 Lions，1992）。\n\n作为第二个例子，我们考虑非线性 PDE (2.1)，但其具有定义良好的线性化，即存在算子 $\\overline{\\\
    mathcal{L}}:X^*\\mapsto Y^*$，使得\n\n$$\\mathcal{L}(u)-\\mathcal{L}(v)=\\overline{\\\
    mathcal{L}}_{(u,v)}(u-v)\\quad\\text{for all }u,v\\in X^*. \\tag{5.2}$$\n\n同样为简单起见，我们假设\
    \ $X^*=X$ 和 $Y^*=Y$。我们进一步假设 $\\overline{\\mathcal{L}}$ 的逆存在，并且按如下方式有界：\n\n$$\\\
    |\\overline{\\mathcal{L}}^{-1}_{(u,v)}\\|_{\\mathrm{op}}\\le C(\\|u\\|_X,\\|v\\\
    |_X)<+\\infty\\quad\\text{for all }u,v\\in X, \\tag{5.3}$$\n\n其中 $\\overline{\\\
    mathcal{L}}^{-1}$ 的范数是由从 $Y$ 到 $X$ 的线性算子诱导的算子范数。那么直接计算即可表明，(5.3) 足以建立稳定性界 (5.1)。\n\
    \n我们用下面的非形式化定理来总结上述发现。\n\n## 定理 5.1。\n\n设 $\\mathcal{L}$ 是线性算子，或者是具有如 (5.3) 所示线性化的非线性算子。如果\
    \ $\\mathcal{L}$ 具有有界逆算子，则式 (5.1) 成立，即小的物理信息损失将意味着小的总误差。\n\n我们给出上述定理在以下方程中的例子，并带有显式的稳定性常数：半线性热方程（强形式）、Navier–Stokes\
    \ 方程（强形式）、标量守恒律（强形式和弱形式）以及 Poisson 方程（变分形式）。更多例子可参见 Mishra 和 Molinaro (2023) 以及\
    \ Lu 等人 (2021c)。\n\n## 例 5.2（半线性热方程）。\n\n我们讨论半线性热方程（见例 2.1）的稳定性（问题 2）。下面的定理（Mishra\
    \ 和 Molinaro 2023，定理 3.1）确保我们确实可以用泛化误差 $\\mathcal{E}_G(\\theta)$ 来界定总误差 $\\mathcal{E}(\\\
    theta)$。关于线性 Kolmogorov 方程（包括 Black–Scholes 模型）的推广可见 De Ryck 和 Mishra (2022a，定理\
    \ 3.7)。\n\n## 定理 5.3。\n\n设 $u \\in C^k(\\overline{D} \\times [0,T])$ 是半线性抛物方程\
    \ (2.6) 的唯一经典解，其中源项 $f$ 满足 (2.7)，并设 $v \\in C^2(\\overline{D} \\times [0,T])$。则总误差\
    \ (3.1) 可以估计为\n\n$$\\|u - v\\|_{L^2(D\\times[0,T])}^2 \\le C_1 \\big\\|\\mathcal{R}_{\\\
    text{PDE}}[v]\\big\\|_{L^2(D\\times[0,T])}^2 + \\big\\|\\mathcal{R}_t[v]\\big\\\
    |_{L^2(D)}^2 \\big) + C_2 \\big\\|\\mathcal{R}_s[v]\\big\\|_{L^2(\\partial D\\\
    times[0,T])}, \\tag{5.4}$$\n\n其中常数由下式给出\n\n$$C_1 = \\sqrt{T + (1 + 2C_f) T^2 e^{(1+2C_f)T}},$$\
    \ $$C_2 = \\sqrt{T^{1/2} |\\partial D|^{1/2} \\big( \\|u\\|_{C^1([0,T]\\times\\\
    partial D)} + \\|v\\|_{C^1([0,T]\\times\\partial D)} \\big)}. \\tag{5.5}$$\n\n\
    ### 证明。\n\n首先，注意到对于 $w = v - u$，我们有\n\n$$\\partial_t w = \\Delta w + f(v) - f(u)\
    \ + \\mathcal{R}_{\\text{PDE}}[v], \\quad w(x,0) = \\mathcal{R}_t[v](x), \\quad\
    \ v = \\mathcal{R}_s[v]. \\tag{5.6}$$\n\n将该 PDE 乘以 $w$，在 $D$ 上积分，并进行分部积分，即可得到不等式\n\
    \n$$\\frac{1}{2}\\frac{d}{dt}\\int_D |w|^2 \\le \\int_{\\partial D} \\mathcal{R}_s[v]\\\
    nabla w\\cdot \\hat{n}_D + \\int_D w\\big(f(v)-f(u)+\\mathcal{R}_{\\text{PDE}}[v]\\\
    big)$$ $$\\lesssim \\Big(\\int_{\\partial D} |\\mathcal{R}_s[v]|^2\\Big)^{1/2}\
    \ + \\int_D |w|^2 + \\int_D |\\mathcal{R}_{\\text{PDE}}[v]|^2. \\tag{5.7}$$\n\n\
    将上述不等式在 $[0,\\tau] \\subset [0,T]$ 上积分，应用 Grönwall 不等式，然后再次对时间积分，即得到所声称的结果。完整版本可见\
    \ Mishra 和 Molinaro (2023，定理 3.1)。\n\n## 例 5.4（辐射传输方程）。\n\n辐射传输的研究在科学和工程的许多领域中具有至关重要的意义，包括天体物理学、\n"
