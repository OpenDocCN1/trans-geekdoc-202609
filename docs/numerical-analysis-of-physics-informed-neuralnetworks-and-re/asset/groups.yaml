    = \sqrt{2}$，而对于 tanh 激活函数 $g = 1$ 是一个有效选择。注意该初始化主要是在监督学习设定下提出的，例如在使用平方损失时 $\int_{\Omega}(u_\theta
    - u)^2$。对于第 2.3 节的不同损失函数，可能更适合不同的初始化方案。这将在第 7 节中讨论。


    最后，通常会使用不同的初始值 $\theta_0$（从同一分布中抽取）重新训练神经网络，因为基于梯度的优化器可能对每个 $\theta_0$ 收敛到不同的局部最小值。然后可以根据某个合适的标准选择‘最佳’神经网络，或在设置允许的情况下组合不同的神经网络。另请注意，此任务可以并行执行。


    ### 2.6. 算法总结


    我们总结物理信息学习算法如下。


    - (1) 选择模型类 $\{u_\theta : \theta \in \Theta\}$（第 2.2 节）。

    - (2) 根据 PDE 的经典、弱或变分形式选择损失函数（第 2.3 节）。

    - (3) 基于合适的求积规则生成训练集 $\mathcal{S}$，以获得可可行计算的损失函数 $\mathcal{J}(\theta, \mathcal{S})$（第
    2.4 节）。

    - (4) 初始化模型参数并从第 2.5 节运行优化算法，直到达到近似局部最小值 $\theta^*(\mathcal{S})$。由此得到的函数 $u^*
    := u_{\theta^*(\mathcal{S})}$ 是用于逼近 PDE (2.1) 解 $u$ 的期望模型。


    ## 3. 分析


    尽管第 2.6 节的物理信息学习框架看起来很直观，但先验地几乎没有理论保证它实际上会表现良好。因此，下几节的目标是对物理信息机器学习进行理论分析并概述可用的数学保证。


    一个核心要素将是为物理信息机器学习开发误差估计。相关的误差概念是逼近 (2.1) 的解 $u$ 与模型 $u^* = u_{\theta^*(\mathcal{S})}$
    之间的误差：


    $$

    \mathcal{E}(\theta) := \|u - u_\theta\|_X, \quad \mathcal{E}^* := \mathcal{E}(\theta^*(\mathcal{S})).\tag{3.1}

    $$


    一般而言，我们将选择 $\|\cdot\|_{X}=\|\cdot\|_{L^{2}(\Omega)}$。请注意，在训练过程中无法计算 $\mathcal{E}$。另一方面，我们监控所谓的
    *训练误差* 给出


    $$

    \mathcal{E}_{T}(\theta,\mathcal{S})^{2} := \mathcal{J}(\theta,\mathcal{S}),\quad
    \mathcal{E}_{T}^{*} := \mathcal{E}_{T}(\theta^{*}(\mathcal{S}),\mathcal{S}),\tag{3.2}

    $$


    其中 $\mathcal{J}$ 是第 2.4 节中定义的损失函数，是第 2.3 节中（积分形式）损失函数的离散化版本。因此，训练误差 $\mathcal{E}_{T}^{*}$
    在训练完成后可以从损失函数直接计算。我们还将第 2.3 节中物理信息损失函数的积分形式称为 *泛化误差* $\mathcal{E}_{G}$。


    $$

    \mathcal{E}_{G}(\theta) := \mathcal{E}_{\text{PDE}}[u_{\theta}],\quad \mathcal{E}_{G}^{*}
    := \mathcal{E}_{G}(\theta^{*}(\mathcal{S}),\mathcal{S}),\tag{3.3}

    $$


    它衡量模型性能从训练集 $\mathcal{S}$ 转移或 *泛化* 到整个域 $\Omega$ 的程度。


    给定这些定义，一些基本的理论问题随即出现。


    **Q1. _存在性._ ** 是否存在假设类中的模型 $\widehat{u}$，使得泛化误差 $\mathcal{E}_{G}(\widehat{\theta})$
    很小？更精确地说，给定选择的误差容限 $\epsilon > 0$，是否存在假设类中的模型 $\widehat{u}=u_{\widehat{\theta}}$，其中
    $\widehat{\theta}\in\Theta$，使得对应的泛化误差 $\mathcal{E}_{G}(\widehat{\theta})$ 满足 $\mathcal{E}_{G}(\widehat{\theta})
    < \epsilon$？由于最小化泛化误差（即物理信息损失）是物理信息学习的关键支柱，得到对此问题的肯定回答至关重要。此外，希望将参数空间 $\Theta$（或假设类）的大小与精度
    $\epsilon$ 联系起来。例如，对于线性模型（第 2.2.1 节），我们希望知道需要多少个函数 $\phi_{i}$ 才能确保存在 $\widehat{\theta}\in\Theta$
    使得 $\mathcal{E}_{G}(\widehat{\theta}) < \epsilon$。同样，对于神经网络，我们希望找到神经网络应有多大（以深度、宽度和权重的模数衡量）（第
    2.2.2 节）以确保这一点。我们将在第 4 节中通过考虑模型类的 *逼近误差* 来回答这个问题。


    **Q2. _稳定性._ ** 给定模型 $u_{\theta}$ 的泛化误差 $\mathcal{E}_{G}(\theta)$ 很小，对应的总误差 $\mathcal{E}(\theta)$
    是否也会很小？换句话说，是否存在函数 $\delta:\mathbb{R}_{+}\to\mathbb{R}_{+}$ 满足 $\lim_{\epsilon\to0}\delta(\epsilon)=0$，使得
    $\mathcal{E}_{G}(\theta) < \epsilon$ 蕴含 $\mathcal{E}(\theta) < \delta(\epsilon)$
    对任意 $\epsilon > 0$ 成立？在实践中，我们会更雄心勃勃，希望找到常数 $C,\alpha > 0$（与 $\theta$ 无关）使得


    $$

    \mathcal{E}(\theta) \leq C\,\mathcal{E}_{G}(\theta)^{\alpha}.\tag{3.4}

    $$


    这同样是一个必不可少的要素，因为获得小的泛化误差 $\mathcal{E}_{G}^{*}$ 先验地毫无意义，因为我们只关心总误差 $\mathcal{E}^{*}$。对此问题的回答首先取决于底层
    PDE 的性质，而在较小的程度上取决于模型类。我们将在第 5 节讨论这个问题。


    **Q3. _泛化._ ** 给定小的训练误差 $\mathcal{E}_T^*$ 和足够大的训练集 $\mathcal{S}$，对应的泛化误差 $\mathcal{E}_G^*$
    是否也会很小？这个问题与物理信息机器学习并非唯一相关，且与所选求积规则的精度密切相关（第 2.4 节）。我们将在第 6 节中使用标准论证来回答这个问题。


    **Q4. _优化._ ** 能否使 $\mathcal{E}_T^*$ 足够接近 $\min_{\theta}\mathcal{J}(\theta,\mathcal{S})$？这个问题最后承认，即使近似地求解最小化问题
    (2.69) 也可能非常困难。尤其是对于物理信息神经网络，关于优化问题难以求解甚至不可行的设定，以及如何可能克服这些训练问题的文献正在增长。我们在第 7 节中对这些现象进行理论分析。


    上述问题至关重要，因为肯定的答案证明了最小化优化问题 (2.69) 的模型，记为 $u^*$，是 $u$ 的良好近似，即误差 $\mathcal{E}^*$
    很小。我们首先通过证明泛化误差 $\mathcal{E}_G^*$ 的误差分解来展示这一点，为此我们需要以下辅助结果。


    **Lemma 3.1.** 对任意 $\theta_1,\theta_2\in\Theta$ 和训练集 $\mathcal{S}$，我们有


    $$

    \mathcal{E}_G(\theta_1)\leq \mathcal{E}_G(\theta_2)+2\sup_{\theta\in\Theta}\left|\mathcal{E}_T(\theta,\mathcal{S})-\mathcal{E}_G(\theta)\right|+\mathcal{E}_T(\theta_1,\mathcal{S})-\mathcal{E}_T(\theta_2,\mathcal{S}).\tag{3.5}

    $$


    **Proof.** 固定 $\theta_1,\theta_2\in\Theta$ 并生成随机训练集 $\mathcal{S}$。证明由重复添加、减去和移除项组成。我们有


    $$

    \begin{aligned}

    \mathcal{E}_G(\theta_1) &= \mathcal{E}_G(\theta_2)+\mathcal{E}_G(\theta_1)-\mathcal{E}_G(\theta_2)\\

    &= \mathcal{E}_G(\theta_2)-\bigl(\mathcal{E}_T(\theta_1,\mathcal{S})-\mathcal{E}_G(\theta_1)\bigr)+\bigl(\mathcal{E}_T(\theta_2,\mathcal{S})-\mathcal{E}_G(\theta_2)\bigr)\\

    &\quad +\mathcal{E}_T(\theta_1,\mathcal{S})-\mathcal{E}_T(\theta_2,\mathcal{S})\\

    &\leq \mathcal{E}_G(\theta_2)+2\max_{\theta\in\{\theta_2,\theta_1\}}\left|\mathcal{E}_T(\theta,\mathcal{S})-\mathcal{E}_G(\theta)\right|\\

    &\quad +\mathcal{E}_T(\theta_1,\mathcal{S})-\mathcal{E}_T(\theta_2,\mathcal{S}).\tag{3.6}

    \end{aligned}

    $$


    假设我们可以肯定地回答 Q1，现在我们可以取 $\theta_1=\theta^*(\mathcal{S})$ 和 $\theta_2=\hat{\theta}$（如
    Q1 中）。此外，如果我们也能肯定地回答 Q2，或更强地找到常数 $C,\alpha>0$ 使得 (3.4) 成立，则我们得到以下误差分解：


    $$

    \mathcal{E}^*\leq C\left(\underbrace{\mathcal{E}_G(\hat{\theta})}_{\text{逼近误差}}+\underbrace{2\sup_{\theta\in\Theta}\left|\mathcal{E}_T(\theta,\mathcal{S})-\mathcal{E}_G(\theta)\right|}_{\text{泛化间隙}}+\underbrace{\mathcal{E}_T^*-\mathcal{E}_T(\hat{\theta})}_{\text{优化误差}}\right)^\alpha.\tag{3.7}

    $$

