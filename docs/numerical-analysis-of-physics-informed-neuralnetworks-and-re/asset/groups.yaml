    D\times(0,T))}\right) \tag{5.34}

    \]


    for some constant \(C\) depending on \(\tau\), \(u\) and \(u_\theta\).


    ### Example 5.22 (Stokes equation).


    The effectiveness of PINNs in approximating inverse problems was recently showcased
    by Raissi, Yazdani and Karniadakis (2018), who proposed PINNs for the data assimilation
    problem with the Navier–Stokes equations (Example 2.2). As a first step towards
    rigorously analysing this, we follow Mishra and Molinaro (2022) and focus on the
    stationary Stokes equation as introduced in Example 2.7.


    Recall that the data assimilation inverse problem for the Stokes equation amounts
    to inferring the velocity field \(u\) (and the pressure \(p\)), given \(f\), \(f_d\)
    and \(g\). In particular, we wish to find solutions \(u\in H_0^1(D;\mathbb{R}^d)\)
    and \(p\in L_0^2(D)\) (i.e. square-integrable functions with zero mean), such
    that the following holds:


    \[

    \begin{aligned}

    \int_D \nabla u\cdot\nabla v\,dx + \int_D p\,\operatorname{div}(v)\,dx &= \int_D
    f\cdot v\,dx,\\

    \int_D \operatorname{div}(u)w\,dx &= \int_D f_d w\,dx,

    \end{aligned} \tag{5.35}

    \]


    for all test functions \(v\in H_0^1(D;\mathbb{R}^d)\) and \(w\in L^2(D)\).


    Let \(B_{R_1}(x_0)\) be the largest ball inside the observation domain \(D''\subset
    D\). We will consider balls \(B_R(x_0)\subset D\) such that \(R>R_1\) and estimate
    the following error for the model \(u_\theta\):


    \[

    \mathcal{E}_R(\theta):=\|u-u_\theta\|_{L^2(B_R(x_0))}. \tag{5.36}

    \]


