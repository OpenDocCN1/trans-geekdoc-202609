    # **Example 2.12 (generalized Dirichlet’s principle).**


    Let $a^{ij}:\Omega\to\mathbb{R}$ be functions with $a^{ij}=a^{ji}$ and consider
    the elliptic PDE


    $$ -\sum_{i,j=1}^{d} \partial_{x_i}\big(a^{ij}\partial_{x_j}u\big)=f,\quad x\in\Omega.
    \tag{2.62} $$


    The above PDE is the Euler–Lagrange equation associated with the functional of
    the form (2.59) and the Lagrangian


    $$ L(p,z,x)=\frac12\sum_{i,j=1}^{d}a^{ij}(x)p_i p_j - z f(x). \tag{2.63} $$


    More examples and conditions under which $I[\cdot]$ has a (unique) minimizer can
    be found in Evans (2022), for example.


    Solving a PDE within the class of variational problems by minimizing its associated
    energy functional is known in the literature as the *Ritz (–Galerkin) method*,
    or as the *Rayleigh–Ritz method* for eigenvalue problems. More recently, E and
    Yu (2018) have proposed the *deep Ritz method*, which aims to minimize the energy
    functional over the set of deep neural networks:


    $$ \min_{\theta}\mathcal{E}_{\mathrm{DRM}}[u_{\theta}]^{2},\quad \mathcal{E}_{\mathrm{DRM}}[u_{\theta}]^{2}:=I[u_{\theta}]+\lambda\int_{\partial\Omega}\big(\mathcal{B}[u_{\theta}]-g\big)^{2},
    \tag{2.64} $$


    where the second term was added because the neural networks used do not automatically
    satisfy the boundary conditions of the PDE (2.1).


    # 2.4. *Quadrature rules*


    All the loss functions discussed in the previous subsections are formulated as
    integrals in terms of the model $u_{\theta}$. Very often it will not be feasible
    or computationally desirable to evaluate these integrals in an exact way. Instead,
    one can discretize the integral and approximate it using a sum. We recall some
    basic results on numerical quadrature rules for integral approximation.'
