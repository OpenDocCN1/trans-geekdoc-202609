    However, preconditioning A for nonlinear models such as neural networks can, in
    general, be hard. Here we consider a simple strategy by coupling the MLP with
    Fourier features φ_k defined above, i.e. setting


    $u_\theta = \Phi_\theta\left(\sum_k \alpha_k \phi_k\right)$.


    Intuitively, we must choose α_k carefully to control (d^{2n}/dx^{2n}) u_θ(x),
    as it will include terms such as


    $\left(\sum_{k\neq0} \alpha_k (-k)^{2n} \phi_k\right) \Phi_\theta^{(2n)}\left(\sum_k
    \alpha_k \phi_k\right)$.


    Hence, such rescaling could better condition the Hermitian square of the differential
    operator. To test this for Poisson’s equation, we choose α_k = 1/k^2 (for k ≠
    0) in this FF-MLP model and present the eigenvalues in Figure 7.3(a), which shows
    that although there are still quite a few (near-) zero eigenvalues, the number
    of non-zero eigenvalues is significantly increased, leading to a much more even
    spread in the spectrum when compared to the unpreconditioned MLP case. This possibly
    accounts for the fact that the resulting loss function decays much more rapidly,
    as shown in Figure 7.3(b), when compared to unpreconditioned MLP.


    ## 7.5. Strategies for improving training in physics-informed machine learning


    Given the difficulties encountered in training physics-informed machine learning
    models, several ad hoc strategies have been proposed in the recent literature
    to improve training. It turns out that many of these strategies can also be interpreted
    in terms of preconditioning.


    ### 7.5.1. *Choice of* $\lambda$


    The parameter $\lambda$ in a physics-informed loss such as (2.46) plays a crucial
    role, as it balances the relative contributions of the physics-informed loss $R$
    and the supervised loss at the boundary $B$. Given the analysis of the previous
    sections, it is natural to suggest that this parameter should be chosen as


    $$\lambda^* := \underset{\lambda}{\min}\; \kappa(\mathbf{A}(\lambda)) \tag{7.33}$$


    in order to obtain the smallest condition number of $\mathbf{A}$ and accelerate
    convergence. Another strategy is suggested by Wang *et al.* (2021a), who suggest
    a learning rate annealing algorithm to iteratively update $\lambda$ throughout
    training as follows:


    $$\lambda_a^* := \frac{\max_k\left|(\nabla_\theta R(\theta))_k\right|}{(2K+1)^{-1}\sum_k\left|(\nabla_\theta
    B(\theta))_k\right|}. \tag{7.34}$$


    Similarly, Wang *et al.* (2022b) propose setting


    $$\lambda_b^* := \frac{\operatorname{Tr}(K_{rr}(n))}{\operatorname{Tr}(K_{uu}(n))}
    \approx \frac{\int_\Omega \nabla_\theta\mathcal{L}u_\theta^\top\nabla_\theta\mathcal{L}u_\theta}{\int_{\partial\Omega}\nabla_\theta
    u_\theta^\top\nabla_\theta u_\theta}. \tag{7.35}$$


    We refer to Wang *et al.* (2022b) for the exact definition of $K_{rr}$ and $K_{uu}$.


    In the below example, we compare $\lambda^*$ (7.33), $\lambda_a^*$ (7.34) and
    $\lambda_b^*$ (7.35) for the Poisson equation.


    **Example 7.13 (Poisson’s equation).** We compare the three proposed strategies
    above for the one-dimensional Poisson equation and a linear model using Fourier
    features up to frequency $K$. First of all, De Ryck *et al.* (2023) computed that
    $\lambda^* \sim K^2$. Next, to calculate $\lambda_a^*$ we observe that $(\nabla_\theta
    R(\theta))_k = k^4\theta_k$ for $k\ne \ell$ and $(\nabla_\theta R(\theta))_\ell
    = \ell^4(\theta_\ell-1)$. We find that $\max_k |(\nabla_\theta R(\theta))_k| \sim
    K^4$ at initialization. Next we calculate that (given that at initialization $\theta_m\sim\mathcal{N}(0,1)$
    i.i.d.)


    $$\mathbb{E}\sum_k\left|(\nabla_\theta B(\theta))_k\right| = \sum_{k=0}^{K}\mathbb{E}\left|\sum_{m=0}^{K}\theta_m(-1)^{k+m}\right|
    = \sum_{k=0}^{K}\mathbb{E}\left|\sum_{m=0}^{K}\theta_m\right| = (K+1)^{3/2}. \tag{7.36}$$


    This brings us to the rough estimate that


    $$(2K+1)^{-1}\sum_k\left|(\nabla_\theta B(\theta))_k\right|\sim\sqrt{K}.$$


    So in total we find that $\lambda_a^*\sim K^{3.5}$. Finally, for $\lambda_b^*$
    one can make the estimate that


    $$\lambda_b^*\approx \frac{2\pi\sum_{k=1}^{K}k^4}{K+1}\sim K^4. \tag{7.37}$$


    Hence it turns out that applying these different strategies leads to different
    scalings of $\lambda$ with respect to increasing $K$ for the Fourier features
    model. Despite these differences, it was observed that the resulting condition
    numbers $\kappa(\mathbf{A}(\lambda^*))$, $\kappa(\mathbf{A}(\lambda_a^*))$ and
    $\kappa(\mathbf{A}(\lambda_b^*))$ are actually very similar.


    ### 7.5.2. Hard boundary conditions


    From the very advent of PINNs (Lagaris et al. 1998, 2000), several authors have
    advocated modifying machine learning models such that the boundary conditions
    in PDE (2.1) can be imposed exactly and the boundary loss in (2.46) is zero. Such
    hard imposition of boundary conditions (BCs) has been empirically shown to aid
    training; see e.g. Dong and Ni (2021), Moseley et al. (2023), Dolean et al. (2023)
    and references therein. This can be explained by saying that implementing hard
    boundary conditions leads to a different matrix A, by changing the operator TT*.


    We first consider a toy model to demonstrate these phenomena in a straightforward
    way. We again consider the Poisson equation −Δu = − sin with zero Dirichlet boundary
    conditions (see Example 2.4). We choose as our model


    $$u_{\theta}(x) = \theta_{-1} \cos(x) + \theta_{0} + \theta_{1} \sin(x), \tag{7.38}$$


    and report the comparison of the condition number between various variants of
    soft and hard boundary conditions from De Ryck et al. (2023).


    - *Soft boundary conditions.* If we set the optimal λ using (7.33), we find that
    the condition number for the optimal λ* is given by 3 + 2√2 ≈ 5.83.

    - *Hard boundary conditions: variant 1.* A first common method to implement hard
    boundary conditions is to multiply the model by a function η(x) so that the product
    exactly satisfies the boundary conditions, regardless of uθ. In our setting, we
    could consider η(x)uθ(x) with η(±π) = 0. For η = sin the total model is given
    by


    $$\eta(x)u_{\theta}(x) = -\frac{\theta_{-1}}{2}\cos(2x) + \frac{\theta_{-1}}{2}
    + \theta_{0} \sin(x) + \frac{\theta_{1}}{2} \sin(2x), \tag{7.39}$$


    and gives rise to a condition number of 4. Different choices of η will inevitably
    lead to different condition numbers.

    - *Hard boundary conditions: variant 2.* Another option would be to subtract uθ(π)
    from the model so that the boundary conditions are exactly satisfied. This corresponds
    to the model


    $$u_{\theta}(x) - u_{\theta}(\pi) = \theta_{-1}(\cos(x) + 1) + \theta_{1} \sin(x).
    \tag{7.40}$$


    Note that this implies that one can discard θ0 as parameter, leaving only two
    trainable parameters. The corresponding condition number is 1.


    Hence, in this example the condition number for hard boundary conditions is strictly
    smaller than for soft boundary conditions, that is,


    $$\kappa(\mathbb{A}_{\text{hard BC}}) < \min_{\lambda} \kappa(\mathbb{A}_{\text{soft
    BC}}(\lambda)). \tag{7.41}$$


    This phenomenon can also be observed for other PDEs such as the linear advection
    equation (De Ryck et al. 2023).


    ### 7.5.3. Second-order optimizers


    There are many empirical studies which demonstrate that first-order optimizers
    such as (stochastic) gradient descent or ADAM are not suitable for physics-informed
    machine learning, and we need to use second-order (quasi-) Newton-type optimizers
    such as L-BFGS in order to make training of physics-informed machine learning
    models feasible. As it turns out, one can prove that for linear physics-informed
    models the Hessian of the loss is identical to the matrix $\mathbb{A}$ (7.13).
    Given any loss $\mathcal{J}(\theta)$, the gradient flow of Newton''s method is
    given by


    $$\frac{\mathrm{d}\theta(t)}{\mathrm{d}t} = -\gamma H[\mathcal{J}(\theta(t))]^{-1}\nabla_{\theta}\mathcal{J}(\theta(t)),\qquad
    (7.42)$$


    where $H$ is the Hessian. In our case, we consider the physics-informed loss $L(\theta)
    = R(\theta) + \lambda B(\theta)$ and consider the model $u_\theta(x) = \sum_{\ell}
    \theta_\ell \phi_\ell(x)$, which corresponds to a linear model or a neural network
    in the NTK regime (e.g. Lemma 7.8). Using $\partial_{\theta_i}\partial_{\theta_j}
    u_\theta = 0$, we calculate


    $$\begin{aligned}

    \partial_{\theta_i}\partial_{\theta_j} L(\theta) &= \int_{\Omega} (\mathcal{L}\partial_{\theta_i}
    u_\theta(x)) \cdot \mathcal{L}\partial_{\theta_j} u_\theta(x)\,\mathrm{d}x + \lambda
    \int_{\partial\Omega} \partial_{\theta_i} u_{\theta}(x) \cdot \partial_{\theta_j}
    u_\theta(x)\,\mathrm{d}x \\

    &= \int_{\Omega} \mathcal{L}\phi_i(x) \cdot \mathcal{L}\phi_j(x)\,\mathrm{d}x
    + \lambda \int_{\partial\Omega} \phi_i(x) \cdot \phi_j(x)\,\mathrm{d}x \\

    &= \mathbb{A}_{i j}.

    \end{aligned}\qquad (7.43)$$


    Therefore, in this case (quasi-) Newton methods automatically compute an (approximate)
    inverse of the Hessian and hence precondition the matrix $\mathbb{A}$, relating
    the use of (quasi-) Newton-type optimizers to preconditioning operators in this
    context. See Müller and Zeinhofer (2023) for further analysis of this connection.


    ### 7.5.4. Domain decomposition


    Domain decomposition (DD) is a widely used technique in numerical analysis to
    precondition linear systems that arise out of classical methods such as finite
    elements (Dolean, Jolivet and Nataf 2015). Recently there have been attempts to
    use DD-inspired methods within physics-informed machine learning (see Moseley
    et al. 2023, Dolean et al. 2023 and references therein), although no explicit
    link with preconditioning the models was established. This link was established
    in De Ryck et al. (2023) for the linear advection equation, where they computed
    that the condition number of $\mathbb{A}$ depends quadratically on the advection
    speed $\beta$. They argued that considering $N$ identical submodels on subintervals
    of $[0, T]$ essentially comes down to rescaling $\beta$. Since the condition number
    scales as $\beta^2$, splitting the time domain in $N$ parts will then reduce the
    condition number of each individual submodel by a factor of $N^2$. This is also
    intrinsically connected to what happens in causal learning based training of PINNs
    (Wang, Sankaran and Perdikaris 2024), which therefore can also be viewed as a
    strategy for improving the condition number.

