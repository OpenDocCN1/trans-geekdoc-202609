    的零粘性极限导致具有间断解（激波）的标量守恒律，且残差是测度，在逐点意义下没有意义。因此估计式 (5.14) 也指出了 PINN 近似间断解的局限性。


    上述讨论也是对标量守恒律考虑弱残差而非强残差的完美动机。De Ryck *et al.* (2024c) 因此引入了标量守恒律的弱 PINN (wPINN)
    形式化。wPINN 损失函数也反映了 *物理上可容许* 的弱解应满足熵条件这一事实，从而产生熵残差。该弱残差及其对应损失函数的细节已在例 2.10 中讨论过。利用
    Kruzhkov 著名的变量倍增论证，可以证明关于 *wPINNs* 的 $L^1$ 误差的以下稳定性界 (De Ryck *et al.* 2024c,
    Theorem 3.7)。


    **Theorem 5.10.** 假设 $u$ 是 (2.9) 在 $\nu=0$ 时的分片光滑熵解，本质范围为 $\mathcal{C}$ 且对所有 $t\in[0,T]$
    有 $u(0,t)=u(1,t)$。存在常数 $C>0$，使得对任意 $\epsilon>0$ 和 $u_\theta\in C^1(D\times[0,T])$，有


    $$\begin{aligned}

    \int_0^1 |u_\theta(x,T)-u(x,T)|\,dx

    &\le C\Bigg(\int_0^1 |u_\theta(x,0)-u(x,0)|\,dx

    +\max_{c\in\mathcal{C},\,\varphi\in\Phi_\epsilon}\mathcal{R}(u_\theta,\varphi,c)\\

    &\qquad +(1+\|u_\theta\|_{C^1})\ln(1/\epsilon)\epsilon^3

    +\int_0^T |u_\theta(1,t)-u_\theta(0,t)|\,dt\Bigg). \tag{5.19}

    \end{aligned}$$


    而定理 5.9 的界在低粘性情形（ν ≪ 1）下变得不可用，定理 5.10 的界在解包含激波时仍然有效。


    因此我们可对标量守恒律给出问题 2 的肯定答案，既使用 PDE 残差（经典形式，仅适用于 ν > 0），也使用弱残差（适用于 ν = 0）。


    ### Example 5.11 (Poisson’s equation).


    我们重新审视 Poisson 方程（例 2.4）对 Ω = [0,1]^d，但现在采用零 Neumann 条件，即 ∂u/∂ν = 0 在 ∂Ω 上，且 f
    ∈ L²(Ω) 且 ∫_Ω f dx = 0。遵循第 2.3.3 节，Poisson 方程的解是以下损失函数的极小化子，该损失函数等于 PDE 的能量泛函或变分形式


    I[w] := ½ ∫_Ω |∇w|² dx + ½ (∫_Ω w dx)² − ∫_Ω f w dx. (5.20)


    现在定义 ũ = argmin_{w ∈ H¹(Ω)} I[w] 并定义


    ℰ_G(θ) := I[u_θ] − I[ũ]. (5.21)


    其中我们对泛化误差的定义做了轻微调整，以反映 I[·] 只需被最小化而无需为零即可产生良好近似这一事实。在此设定下，可以证明以下稳定性结果 (Lu et al.
    2021c)。


    ### Proposition 5.12.


    对任意 w ∈ H¹(Ω)，


    2(I[w] − I[ũ]) ≤ ‖w − ũ‖²_{H¹(Ω)} ≤ 2 max{2C_P + 1, 2}(I[w] − I[ũ]). (5.22)


    其中 C_P 是域 Ω 上的 Poincaré 常数，即对任意 v ∈ H¹(Ω)，‖v − ∫_Ω v dx‖²_{L²(Ω)} ≤ C_P ‖∇v‖²_{L²(Ω)}。
    (5.23)


    特别地，令 w = u_θ 可得 ℰ(θ)² := ‖u_θ − ũ‖²_{H¹(Ω)} ≤ 2 max{2C_P + 1, 2} ℰ_G(θ)。 (5.24)


    上述示例和定理可能给人留下稳定性对所有 PDE 和损失函数都成立的印象。必须强调这并非如此。下一个示例讨论了使用 L² 基损失函数时 Hamilton–Jacobi–Bellman
    (HJB) 方程对问题 2 的否定答案 (Wang, Li, He and Wang 2022a)。


    ### Example 5.13 (Hamilton–Jacobi–Bellman equation).


    Wang et al. (2022a) 考虑一类 HJB 方程，其中成本率函数表述为 r(x,m)=a₁|m₁|^{α₁}+⋯+a_n|m_n|^{α_n}−f(x,t)，从而产生形式为


    $$\left\{\begin{aligned}\mathcal{L}[u] &:= \partial_t u(x,t) + \frac{1}{2}\sigma^2
    \Delta u(x,t) - \sum_{i=1}^n A_i |\partial_{x_i} u|^{c_i} = f(x,t),\\ \mathcal{B}[u]
    &:= u(x,T) = g(x),\end{aligned}\right.$$ (5.25)


    的 HJB 方程


    对 $x \in \mathbb{R}^d$ 和 $t \in [0,T]$，其中 $A_i = (a_i \alpha_i)^{-1/(\alpha_i
    -1)} - a_i (a_i \alpha_i)^{-\alpha_i/(\alpha_i -1)} \in (0,+\infty)$ 且 $c_i =
    \alpha_i/(\alpha_i - 1) \in (1,\infty)$。他们选择的成本函数形式在最优控制中相关，例如金融中的最优执行问题。Wang
    et al. (2022a) 的主要结果之一是稳定性只能在物理信息损失基于 PDE 残差的 $L^p$-范数且 $p \sim d$ 时实现。他们在以下定理中证明了这种对
    $d$ 的线性依赖性不可放松 (Wang et al. 2022a, Theorem 4.3)。


    ### Theorem 5.14.


    存在 HJB 方程 (5.25) 的一个实例，其精确解为 $u$，使得对任意 $\varepsilon > 0$，$A > 0$，$r \ge 1$，$m
    \in \mathbb{N} \cup \{0\}$ 和 $p \in [1, d/4]$，存在函数 $w \in C^{\infty}(\mathbb{R}^n
    \times (0,T])$ 使得 $\operatorname{supp}(w - u)$ 是紧的且


    $$\|\mathcal{L}[w] - f\|_{L^p(\mathbb{R}^d \times [0,T])} < \varepsilon, \qquad
    \mathcal{B}[w] = \mathcal{B}[u],$$ (5.26)


    同时


    $$\|w - u\|_{W^{m,r}(\mathbb{R}^d \times [0,T])} > A.$$ (5.27)


    这表明对于高维 HJB 方程，如果使用基于经典残差的 $L^2$ 基物理启发损失，则学习到的解可能与真实解 $u$ 任意远。


    另一个表明物理信息学习的稳定性并非 guaranteed 的例子可以在以下两种物理信息神经网络变体中找到。


    ### Example 5.15 (XPINNs and cPINNs).


    Jagtap and Karniadakis (2020) 和 Jagtap, Kharazmi and Karniadakis (2020) 提出了两种受域分解技术启发的
    PINN 变体，其中在不同子域上训练单独的神经网络。为了确保不同子网络在子域边界上的连续性，两种方法都在损失函数中添加第一项以强制子网络的函数值在边界上（近似）相等。扩展
    PINN (XPINNs) (Jagtap and Karniadakis 2020) 随后提出添加另一项以确保强 PDE 残差在子域边界上（近似）连续。相比之下，保守
    PINN (cPINNs) (Jagtap et al. 2020) 关注形式为 $u_t + \nabla_x f(u) = 0$（即守恒律）的 PDE
    并添加一项以确保基于 $f$ 的通量在边界上（近似）相等。De Ryck, Jagtap and Mishra (2024b) 已对 cPINNs 在 Navier–Stokes
    方程、平流-扩散方程和标量守恒律上给出了问题 2 的肯定答案。另一方面，XPINNs 在 Poisson 方程和热方程等原型 PDE 上未被发现是稳定的（问题
    2 的意义上）。


    最后，我们强调一些已证明物理信息机器学习稳定性结果的其他工作。Shin (2020) 证明了 PINN 的一致性结果，针对线性椭圆和抛物 PDE，其中他们表明如果神经网络序列
    $\{u_{\theta_m}\}_{m\in\mathbb{N}}$ 的 $\mathcal{E}_G(\theta_m) \to 0$，则 $\|u_{\theta_m}
    - u\|_{L^\infty} \to 0$，在假设我们向损失函数添加特定 $C^{k,\alpha}$ 正则化项的条件下，从而部分解决了这些 PDE 的问题
    2。然而，该结果未提供底层误差的定量估计。对平流方程的更定量估计的类似结果由 Shin, Zhang and Karniadakis (2023) 给出。


