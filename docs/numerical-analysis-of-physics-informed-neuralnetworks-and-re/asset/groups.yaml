    $C^{(s,r)}$ 函数，因为我们发现假设更高的正则性并不一定会进一步改善收敛速率（De Ryck and Mishra 2022b, Theorem
    4.5）。


    ## Theorem 4.27


    设 $\mathcal{G}:\mathcal{X}\to C^r(\mathbb{T}^d):u_0\mapsto u(T)$ 和 $\mathcal{G}^\star:\mathcal{X}\to
    C^{(2,r)}([0,T]\times\mathbb{T}^d):u_0\mapsto u$。对任意 $\sigma,\,\varepsilon>0$，存在一个
    DeepONet $\mathcal{G}_\theta^\star$ 使得


    $$\|\mathcal{L}(\mathcal{G}_\theta^\star)\|_{L^2([0,T]\times\mathbb{T}^d\times\mathcal{X})}\leq\varepsilon.\tag{4.25}$$


    此外，对于 $\mathcal{G}_\theta^\star$ 我们有 $O\left(\varepsilon^{-\frac{(3+\sigma)d}{r-2}}\right)$
    个传感器和


    $$\begin{aligned}

    \text{width}(\beta) &= O\left(\varepsilon^{-1-\frac{(3+\sigma)(d+r+2\beta)}{r-2}}\right),
    & \text{depth}(\beta) &= O(\ln(1/\varepsilon)),\\

    \text{width}(\tau) &= O\left(\varepsilon^{-1-\frac{(3+\sigma)(d+1)}{r-2}}\right),
    & \text{depth}(\tau) &= 3.

    \end{aligned}\tag{4.26}$$


    ## 4.3.2. Results based on Barron regularity


    证明神经网络可以克服维度灾难的第二个框架是 Barron 空间。这些空间以 Barron (1993) 的开创性工作命名，他表明具有傅里叶变换 $\widehat{f}$
    的函数 $f$ 可以用具有 $m$ 个神经元的浅层神经网络以 $1/\sqrt{m}$ 的精度逼近，只要


    $$\int_{\mathbb{R}^d} |\widehat{f}(\xi)| \cdot |\xi| \, d\xi < \infty.\tag{4.27}$$


    后来，满足条件 (4.27) 的函数空间被命名为 Barron 空间，并且其定义被以多种不同的方式推广。一个值得注意的推广是谱 Barron 空间。


    ## Definition 4.28


    谱 Barron 空间，其指标为 $s$，记作 $\mathcal{B}^s(\mathbb{R}^d)$，定义为谱 Barron 范数有限的函数 $f :
    \mathbb{R}^d \to \mathbb{R}$ 的集合：


    $$\|f\|_{\mathcal{B}^s(\mathbb{R}^d)} := \int_{\mathbb{R}^d} |\widehat{f}(\xi)|
    \cdot (1 + |\xi|^2)^{s/2} \, d\xi < \infty.\tag{4.28}$$


    首先，注意 Barron (1993) 的初始条件 (4.27) 对应于谱 Barron 空间 $\mathcal{B}^1(\mathbb{R}^d)$。其次，从该定义可以看出
    Barron 空间与 Sobolev 空间之间的差异：而谱 Barron 范数是 $|\widehat{f}(\xi)| \cdot (1 + |\xi|^2)^{s/2}$
    的 $L^1$-范数，Sobolev $H^s(\mathbb{R}^d)$-范数定义为同一量的 $L^2$-范数。最后，可以得出 $\mathcal{B}^r(\mathbb{R}^d)
    \subset \mathcal{B}^s(\mathbb{R}^d)$ 对于 $r \ge s$ 成立，且 $\mathcal{B}^0(\mathbb{R}^d)
    \subset L^\infty(\mathbb{R}^d)$；参见例如 Chen, Lu, Lu 和 Zhou (2023)。


    谱 Barron 空间中函数的一个逼近结果的例子可在 Lu, Lu 和 Wang (2021c) 中找到，用于具有 softplus 激活函数的函数。


    ## Theorem 4.29


    设 $\Omega = [0,1]^d$。对于每个 $u \in \mathcal{B}^2(\Omega)$，存在一个具有 softplus 激活函数 $(\sigma(x)
    = \ln(1 + \exp(x)))$ 的浅层神经网络 $\widehat{u}$，其宽度至多为 $m$，使得


    $$\|u - \widehat{u}\|_{H^1(\Omega)} \le \frac{\|u\|_{\mathcal{B}^2(\Omega)} (6
    \log(m) + 30)}{\sqrt{m}}.\tag{4.29}$$


    此外，权重上的精确界限在 Lu et al. (2021c, Theorem 2.2) 中给出。


    在利用该定理论证神经网络可以在 PDE 解的逼近中克服 CoD 之前，必须回答两个关键问题。


    - 在什么条件下有 $u \in \mathcal{B}^2(\Omega)$？

    - $\|u\|_{\mathcal{B}^2(\Omega)}$ 如何依赖于 $d$？


    回答这些问题需要我们为 Barron 空间建立正则性理论，这可能具有挑战性，因为它们不是像 Sobolev 空间 $H^s$ 那样的希尔伯特空间。对于高维椭圆方程，一个重要的贡献在
    Lu et al. (2021c) 中做出。


    ### Example 4.30 (Poisson’s equation)


    设 $s \ge 0$，设 $f \in \mathcal{B}^{s+2}(\Omega)$ 满足


    $$\int_{\Omega} f(x)\,dx = 0$$


    并且设 $u$ 是 Poisson 方程 $-\Delta u = f$ 在零 Neumann 边界条件下的唯一解。则我们有 $u \in \mathcal{B}^s(\Omega)$
    且 $\|u\|_{\mathcal{B}^s(\Omega)} \le d\|f\|_{\mathcal{B}^{s+2}(\Omega)}$（Lu et
    al. 2021c, Theorem 2.6）。


    ### Example 4.31 (static Schrödinger equation)


    设 $s \ge 0$，设 $V \in \mathcal{B}^{s+2}(\Omega)$ 满足 $V(x) \ge V_{\min} > 0$ 对所有
    $x \in \Omega$ 成立，并且设 $u$ 是静态 Schrödinger 方程 $-\Delta u + Vu = f$ 在零 Neumann 边界条件下的唯一解。则我们有
    $u \in \mathcal{B}^s(\Omega)$ 且 $\|u\|_{\mathcal{B}^s(\Omega)} \le C\|f\|_{\mathcal{B}^{s+2}(\Omega)}$（Chen
    et al. 2023, Theorem 2.3）。


    对于 Barron 空间的略有不同定义（E, Ma 和 Wu 2022）的类似结果，例如可在 E 和 Wojtowytsch (2022b) 中找到。E 等人还表明
    Barron 空间是两层神经网络模型的正确空间，因为最优的直接和逆逼近定理成立。此外，E 和 Wojtowytsch (2020, 2022a) 探索了 Barron
    空间与 Sobolev 空间之间的联系，并提供了是 Barron 函数的函数以及（有时令人惊讶地）不是 Barron 函数的函数的例子。


    另一个略有不同的定义可在 Chen et al. (2021) 中找到，其中 Barron 函数 $g$ 定义为可以写成无限宽神经网络的函数，


    $$g = \int a\sigma(w^{\top}x + b)\rho(da, dw, db),\qquad (4.30)$$


    其中 $\rho$ 是在（现在无限的）参数空间 $\Theta$ 上的概率分布。特别地，神经网络


    $$\frac{1}{k}\sum_{i=1}^{k} a_i\sigma(w_i^{\top}x + b_i)$$


    是一个 Barron 函数。

