    \ of Section 4.1. More related works can be found in Bach (2017), Hong, Siegel\
    \ and Xu (2021) and references therein.\n\n## 5. Stability\nNext, we investigate\
    \ whether a small physics-informed loss implies a small total error, often the\
    \ $L^2$-error, as formulated in the following question.\n\n**Question 2 (Q2).**\
    \ Given that a model $\\mu_\\theta$ has a small generalization error $\\mathcal{E}_G(\\\
    theta)$, will the corresponding total error $\\mathcal{E}(\\theta)$ be small as\
    \ well?\n\nIn the general results we will focus on physics-informed loss functions\
    \ based on the strong (classical) formulation of the PDE, but we also give some\
    \ examples when the loss is based on the weak solution (Example 5.8) or the variational\
    \ solution (Example 5.11). We first look at stability results for forward problems\
    \ (Section 5.1) and afterwards for inverse problems (Section 5.2).\n\n### 5.1.\
    \ Stability for forward problems\nWe investigate whether a small PDE residual\
    \ implies that the total error (3.1) will be small as well (Question 2). Such\
    \ a stability bound can be formulated as the requirement that for any $u,v\\in\
    \ X^*$, the differential operator $\\mathcal{L}$ satisfies\n\n$$\\|u-v\\|_X \\\
    le C_{\\mathrm{PDE}}\\|\\mathcal{L}(u)-\\mathcal{L}(v)\\|_Y, \\tag{5.1}$$\n\n\
    where the constant $C_{\\mathrm{PDE}}>0$ is allowed to depend on $\\|u\\|_{X^*}$\
    \ and $\\|v\\|_{X^*}$.\n\nAs a first example of a PDE with solutions satisfying\
    \ (5.1), we consider a linear differential operator $\\mathcal{L}:X\\to Y$, i.e.\
    \ $\\mathcal{L}(\\alpha u+\\beta v)=\\alpha\\mathcal{L}(u)+\\beta\\mathcal{L}(v)$,\
    \ for any $\\alpha,\\beta\\in\\mathbb{R}$. For simplicity, let $X^*=X$ and $Y^*=Y$.\
    \ By (5.1) the existence and uniqueness of the underlying linear PDE (2.1), there\
    \ exists an *inverse* operator $\\mathcal{L}^{-1}:Y\\to X$. Note that the assumption\
    \ (5.1) is satisfied if the inverse is bounded i.e. $\\|\\mathcal{L}^{-1}\\|_{\\\
    mathrm{op}}\\le C<+\\infty$, with respect to the natural norm on linear operators\
    \ from $Y$ to $X$. Thus the assumption (5.1) on stability boils down to the boundedness\
    \ of the inverse operator for linear PDEs. Many well-known linear PDEs possess\
    \ such bounded inverses (Dautray and Lions, 1992).\n\nAs a second example, we\
    \ will consider a nonlinear PDE (2.1), but with a well-defined linearization,\
    \ that is, there exists an operator $\\overline{\\mathcal{L}}:X^*\\mapsto Y^*$,\
    \ such that\n\n$$\\mathcal{L}(u)-\\mathcal{L}(v)=\\overline{\\mathcal{L}}_{(u,v)}(u-v)\\\
    quad\\text{for all }u,v\\in X^*. \\tag{5.2}$$\n\nAgain for simplicity, we will\
    \ assume that $X^*=X$ and $Y^*=Y$. We further assume that the inverse of $\\overline{\\\
    mathcal{L}}$ exists and is bounded in the following manner:\n\n$$\\|\\overline{\\\
    mathcal{L}}^{-1}_{(u,v)}\\|_{\\mathrm{op}}\\le C(\\|u\\|_X,\\|v\\|_X)<+\\infty\\\
    quad\\text{for all }u,v\\in X, \\tag{5.3}$$\n\nwith the norm of $\\overline{\\\
    mathcal{L}}^{-1}$ being an operator norm, induced by linear operators from $Y$\
    \ to $X$. Then a straightforward calculation shows that (5.3) suffices to establish\
    \ the stability bound (5.1).\n\nWe summarize our findings with the following informal\
    \ theorem.\n\n## Theorem 5.1.\nLet $\\mathcal{L}$ be a linear operator or a nonlinear\
    \ operator with linearization as in (5.3). If $\\mathcal{L}$ has a bounded inverse\
    \ operator, then equation (5.1) will hold, that is, a small physics-informed loss\
    \ will imply a small total error.\n\nWe give examples of the above theorem, with\
    \ explicit stability constants, for the semilinear heat equation (strong formulation),\
    \ Navier–Stokes equation (strong formulation), scalar conservation laws (strong\
    \ and weak formulation) and the Poisson equation (variational formulation). Further\
    \ examples can be found in Mishra and Molinaro (2023) and Lu et al. (2021c).\n\
    \n## Example 5.2 (semilinear heat equation).\nWe address the stability (Question\
    \ 2) of the semilinear heat equation (see Example 2.1). The following theorem\
    \ (Mishra and Molinaro 2023, Theorem 3.1) ensures that one can indeed bound the\
    \ total error $\\mathcal{E}(\\theta)$ in terms of the generalization error $\\\
    mathcal{E}_G(\\theta)$. A generalization to linear Kolmogorov equations (including\
    \ the Black–Scholes model) can be found in De Ryck and Mishra (2022a, Theorem\
    \ 3.7).\n\n## Theorem 5.3.\nLet $u \\in C^k(\\overline{D} \\times [0,T])$ be the\
    \ unique classical solution of the semilinear parabolic equation (2.6) with the\
    \ source $f$ satisfying (2.7), and let $v \\in C^2(\\overline{D} \\times [0,T])$.\
    \ Then the total error (3.1) can be estimated as\n\n$$\\|u - v\\|_{L^2(D\\times[0,T])}^2\
    \ \\le C_1 \\big\\|\\mathcal{R}_{\\text{PDE}}[v]\\big\\|_{L^2(D\\times[0,T])}^2\
    \ + \\big\\|\\mathcal{R}_t[v]\\big\\|_{L^2(D)}^2 \\big) + C_2 \\big\\|\\mathcal{R}_s[v]\\\
    big\\|_{L^2(\\partial D\\times[0,T])}, \\tag{5.4}$$\n\nwith constants given by\n\
    \n$$C_1 = \\sqrt{T + (1 + 2C_f) T^2 e^{(1+2C_f)T}},$$ $$C_2 = \\sqrt{T^{1/2} |\\\
    partial D|^{1/2} \\big( \\|u\\|_{C^1([0,T]\\times\\partial D)} + \\|v\\|_{C^1([0,T]\\\
    times\\partial D)} \\big)}. \\tag{5.5}$$\n\n### Proof.\nFirst, note that for $w\
    \ = v - u$ we have\n\n$$\\partial_t w = \\Delta w + f(v) - f(u) + \\mathcal{R}_{\\\
    text{PDE}}[v], \\quad w(x,0) = \\mathcal{R}_t[v](x), \\quad v = \\mathcal{R}_s[v].\
