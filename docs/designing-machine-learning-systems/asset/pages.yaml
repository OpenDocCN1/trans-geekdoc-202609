  md: 'equal to 0.5, it''s a negative label. This means that you can tune the threshold
    to increase the *true positive rate* (also known as *recall*) while decreasing
    the *false positive rate* (also known as the *probability of false alarm*), and
    vice versa. We can plot the true positive rate against the false positive rate
    for different thresholds. This plot is known as the *ROC curve* (receiver operating
    characteristics). When your model is perfect, the recall is 1.0, and the curve
    is just a line at the top. This curve shows you how your model''s performance
    changes depending on the threshold, and helps you choose the threshold that works
    best for you. The closer to the perfect line, the better your model''s performance.


    The area under the curve (AUC) measures the area under the ROC curve. Since the
    closer to the perfect line the better, the larger this area the better, as shown
    in Figure 4-9.


    ![](img/bde3d1ed5ea7825115c846be3467945f_126_0.png)


    Figure 4-9. ROC curve


    Like F1 and recall, the ROC curve focuses only on the positive class and doesn''t
    show how well your model does on the negative class. Davis and Goadrich suggested
    that we should plot precision against recall instead, in what they termed the
    Precision-Recall Curve. They argued that this curve gives a more informative picture
    of an algorithm''s performance on tasks with heavy class imbalance.36


    36 Jesse Davis and Mark Goadrich, “The Relationship Between Precision-Recall and
    ROC Curves,” Proceedings of the 23rd International Conference on Machine Learning,
    2006, https://oreil.ly/s40F3.'
