- pgno: 286
  md: '# Terminology Ambiguity


    I use the term “continual learning” instead of “online learning” because when
    I say “online learning,” people usually think of online education. If you enter
    “online learning” on Google, the top results will likely be about online courses.


    Some people use “online learning” to refer to the specific setting where a model
    learns from each incoming new sample. In this setting, continual learning is a
    generalization of online learning.


    I also use the term “continual learning” instead of “continuous learning.” Continuous
    learning refers to the regime in which your model continuously learns with each
    incoming sample, whereas with continual learning, the learning is done in a series
    of batches or micro-batches.


    Continuous learning is sometimes used to refer to continuous delivery of ML, which
    is closely related to continual learning as both help companies to speed up the
    iteration cycle of their ML models. However, the difference is that “continuous
    learning,” when used in this sense, is from the DevOps perspective about setting
    up the pipeline for continuous delivery, whereas “continual learning” is from
    the ML perspective.


    Due to the ambiguity of the term “continuous learning,” I hope that the community
    can stay away from this term altogether.


    # Why Continual Learning?


    We discussed that continual learning is about setting up infrastructure so that
    you can update your models and deploy these changes as fast as you want. But why
    would you need the ability to update your models as fast as you want?


    The first use case of continual learning is to combat data distribution shifts,
    especially when the shifts happen suddenly. Imagine you’re building a model to
    determine the prices for a ride-sharing service like Lyft.6 Historically, the
    ride demand on a Thursday evening in this particular neighborhood is slow, so
    the model predicts low ride prices, which makes it less appealing for drivers
    to get on the road. However, on this Thursday evening, there’s a big event in
    the neighborhood, and suddenly the ride demand surges. If your model can’t respond
    to this change quickly enough by increasing its price prediction and mobilizing
    more drivers to that neighborhood, riders will have to wait a long time for a
    ride, which causes negative user experience. They might even switch to a competitor,
    which causes you to lose revenue.


    Another use case of continual learning is to adapt to rare events. Imagine you
    work for an ecommerce website like Amazon. Black Friday is an important shopping
    event


    6 This type of problem is also called “dynamic pricing.”'
