- pgno: 52
  md: 'Later chapters will dive deeper into what each of these steps requires in practice.
    Here, let''s take a brief look at what they mean:


    # Step 1. Project scoping


    A project starts with scoping the project, laying out goals, objectives, and constraints.
    Stakeholders should be identified and involved. Resources should be estimated
    and allocated. We already discussed different stakeholders and some of the foci
    for ML projects in production in Chapter 1. We also already discussed how to scope
    an ML project in the context of a business earlier in this chapter. We''ll discuss
    how to organize teams to ensure the success of an ML project in Chapter 11.


    # Step 2. Data engineering


    A vast majority of ML models today learn from data, so developing ML models starts
    with engineering data. In Chapter 3, we''ll discuss the fundamentals of data engineering,
    which covers handling data from different sources and formats. With access to
    raw data, we''ll want to curate training data out of it by sampling and generating
    labels, which is discussed in Chapter 4.


    # Step 3. ML model development


    With the initial set of training data, we''ll need to extract features and develop
    initial models leveraging these features. This is the stage that requires the
    most ML knowledge and is most often covered in ML courses. In Chapter 5, we''ll
    discuss feature engineering. In Chapter 6, we''ll discuss model selection, training,
    and evaluation.


    # Step 4. Deployment


    After a model is developed, it needs to be made accessible to users. Developing
    an ML system is like writing—you will never reach the point when your system is
    done. But you do reach the point when you have to put your system out there. We''ll
    discuss different ways to deploy an ML model in Chapter 7.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Step 5. Monitoring and continual learning


    Once in production, models need to be monitored for performance decay and maintained
    to be adaptive to changing environments and changing requirements. This step will
    be discussed in Chapters 8 and 9.


    # Step 6. Business analysis


    Model performance needs to be evaluated against business goals and analyzed to
    generate business insights. These insights can then be used to eliminate unproductive
    projects or scope out new projects. This step is closely related to the first
    step.


    # Framing ML Problems


    Imagine you''re an ML engineering tech lead at a bank that targets millennial
    users. One day, your boss hears about a rival bank that uses ML to speed up their
    customer service support that supposedly helps the rival bank process their customer
    requests two times faster. He orders your team to look into using ML to speed
    up your customer service support too.


    Slow customer support is a problem, but it''s not an ML problem. An ML problem
    is defined by inputs, outputs, and the objective function that guides the learning
    process—none of these three components are obvious from your boss''s request.
    It''s your job, as a seasoned ML engineer, to use your knowledge of what problems
    ML can solve to frame this request as an ML problem.


    Upon investigation, you discover that the bottleneck in responding to customer
    requests lies in routing customer requests to the right department among four
    departments: accounting, inventory, HR (human resources), and IT. You can alleviate
    this bottleneck by developing an ML model to predict which of these four departments
    a request should go to. This makes it a classification problem. The input is the
    customer request. The output is the department the request should go to. The objective
    function is to minimize the difference between the predicted department and the
    actual department.


    We''ll discuss extensively how to extract features from raw data to input into
    your ML model in Chapter 5. In this section, we''ll focus on two aspects: the
    output of your model and the objective function that guides the learning process.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Types of ML Tasks


    The output of your model dictates the task type of your ML problem. The most general
    types of ML tasks are classification and regression. Within classification, there
    are more subtypes, as shown in Figure 2-3. We''ll go over each of these task types.


    ![](img/bde3d1ed5ea7825115c846be3467945f_54_0.png)


    Figure 2-3. Common task types in ML


    # Classification versus regression


    Classification models classify inputs into different categories. For example,
    you want to classify each email to be either spam or not spam. Regression models
    output a continuous value. An example is a house prediction model that outputs
    the price of a given house.


    A regression model can easily be framed as a classification model and vice versa.
    For example, house prediction can become a classification task if we quantize
    the house prices into buckets such as under $100,000, $100,000–$200,000, $200,000–$500,000,
    and so forth and predict the bucket the house should be in.


    The email classification model can become a regression model if we make it output
    values between 0 and 1, and decide on a threshold to determine which values should
    be SPAM (for example, if the value is above 0.5, the email is spam), as shown
    in Figure 2-4.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '![](img/bde3d1ed5ea7825115c846be3467945f_55_0.png)


    Figure 2-4. The email classification task can also be framed as a regression task


    # Binary versus multiclass classification


    Within classification problems, the fewer classes there are to classify, the simpler
    the problem is. The simplest is binary classification, where there are only two
    possible classes. Examples of binary classification include classifying whether
    a comment is toxic, whether a lung scan shows signs of cancer, whether a transaction
    is fraudulent. It’s unclear whether this type of problem is common in the industry
    because they are common in nature or simply because ML practitioners are most
    comfortable handling them.


    When there are more than two classes, the problem becomes multiclass classification.
    Dealing with binary classification problems is much easier than dealing with multi-class
    problems. For example, calculating F1 and visualizing confusion matrices are a
    lot more intuitive when there are only two classes.


    When the number of classes is high, such as disease diagnosis where the number
    of diseases can go up to thousands or product classifications where the number
    of products can go up to tens of thousands, we say the classification task has
    high cardinality. High cardinality problems can be very challenging. The first
    challenge is in data collection. In my experience, ML models typically need at
    least 100 examples for each class to learn to classify that class. So if you have
    1,000 classes, you already need at least 100,000 examples. The data collection
    can be especially difficult for rare classes. When you have thousands of classes,
    it’s likely that some of them are rare.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'When the number of classes is large, hierarchical classification might be useful.
    In hierarchical classification, you have a classifier to first classify each example
    into one of the large groups. Then you have another classifier to classify this
    example into one of the subgroups. For example, for product classification, you
    can first classify each product into one of the four main categories: electronics,
    home and kitchen, fashion, or pet supplies. After a product has been classified
    into a category, say fashion, you can use another classifier to put this product
    into one of the subgroups: shoes, shirts, jeans, or accessories.


    # Multiclass versus multilabel classification


    In both binary and multiclass classification, each example belongs to exactly
    one class. When an example can belong to multiple classes, we have a multilabel
    classification problem. For example, when building a model to classify articles
    into four topics—tech, entertainment, finance, and politics—an article can be
    in both tech and finance.


    There are two major approaches to multilabel classification problems. The first
    is to treat it as you would a multiclass classification. In multiclass classification,
    if there are four possible classes [tech, entertainment, finance, politics] and
    the label for an example is entertainment, you represent this label with the vector
    [0, 1, 0, 0]. In multilabel classification, if an example has both labels entertainment
    and finance, its label will be represented as [0, 1, 1, 0].


    The second approach is to turn it into a set of binary classification problems.
    For the article classification problem, you can have four models corresponding
    to four topics, each model outputting whether an article is in that topic or not.


    Out of all task types, multilabel classification is usually the one that I’ve
    seen companies having the most problems with. Multilabel means that the number
    of classes an example can have varies from example to example. First, this makes
    it difficult for label annotation since it increases the label multiplicity problem
    that we discuss in Chapter 4. For example, an annotator might believe an example
    belongs to two classes while another annotator might believe the same example
    to belong in only one class, and it might be difficult resolving their disagreements.


    Second, this varying number of classes makes it hard to extract predictions from
    raw probability. Consider the same task of classifying articles into four topics.
    Imagine that, given an article, your model outputs this raw probability distribution:
    [0.45, 0.2, 0.02, 0.33]. In the multiclass setting, when you know that an example
    can belong to only one category, you simply pick the category with the highest
    probability, which is 0.45 in this case. In the multilabel setting, because you
    don’t know how many categories an example can belong to, you might pick the two
    highest probability categories (corresponding to 0.45 and 0.33) or three highest
    probability categories (corresponding to 0.45, 0.2, and 0.33).'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Multiple ways to frame a problem


    Changing the way you frame your problem might make your problem significantly
    harder or easier. Consider the task of predicting what app a phone user wants
    to use next. A naive setup would be to frame this as a multiclass classification
    task—use the user''s and environment''s features (user demographic information,
    time, location, previous apps used) as input, and output a probability distribution
    for every single app on the user''s phone. Let N be the number of apps you want
    to consider recommending to a user. In this framing, for a given user at a given
    time, there is only one prediction to make, and the prediction is a vector of
    the size N. This setup is visualized in Figure 2-5.


    ![](img/bde3d1ed5ea7825115c846be3467945f_57_0.png)


    *Figure 2-5. Given the problem of predicting the app a user will most likely open
    next, you can frame it as a classification problem. The input is the user''s features
    and environment''s features. The output is a distribution over all apps on the
    phone.*


    This is a bad approach because whenever a new app is added, you might have to
    retrain your model from scratch, or at least retrain all the components of your
    model whose number of parameters depends on N. A better approach is to frame this
    as a regression task. The input is the user''s, the environment''s, and the app''s
    features. The output is a single value between 0 and 1; the higher the value,
    the more likely the user will open the app given the context. In this framing,
    for a given user at a given time, there are N predictions to make, one for each
    app, but each prediction is just a number. This improved setup is visualized in
    Figure 2-6.'
  merge: -1
  img_proc: true
