- pgno: 191
  md: '![](img/bde3d1ed5ea7825115c846be3467945f_191_0.png)


    Figure 6-9. Jeff Dean unveiling Google''s AutoML at TensorFlow Dev Summit 2018


    # Soft AutoML: Hyperparameter tuning


    AutoML refers to automating the process of finding ML algorithms to solve real-world
    problems. One mild form, and the most popular form, of AutoML in production is
    hyperparameter tuning. A hyperparameter is a parameter supplied by users whose
    value is used to control the learning process, e.g., learning rate, batch size,
    number of hidden layers, number of hidden units, dropout probability, β₁ and β₂
    in Adam optimizer, etc. Even quantization—e.g., whether to use 32 bits, 16 bits,
    or 8 bits to represent a number or a mixture of these representations—can be considered
    a hyperparameter to tune.²³


    With different sets of hyperparameters, the same model can give drastically different
    performances on the same dataset. Melis et al. showed in their 2018 paper “On
    the State of the Art of Evaluation in Neural Language Models” that weaker models
    with well-tuned hyperparameters can outperform stronger, fancier models. The goal
    of hyperparameter tuning is to find the optimal set of hyperparameters for a given
    model within a search space—the performance of each set evaluated on a validation
    set.


    23 We''ll cover quantization in Chapter 7.'
