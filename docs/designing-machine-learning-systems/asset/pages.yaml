- pgno: 177
  md: '![](img/bde3d1ed5ea7825115c846be3467945f_177_0.png)


    Figure 6-3. Bagging illustration. Source: Adapted from an image by Sirakorn


    If the problem is classification, the final prediction is decided by the majority
    vote of all models. For example, if 10 classifiers vote SPAM and 6 models vote
    NOT SPAM, the final prediction is SPAM.


    If the problem is regression, the final prediction is the average of all models’
    predictions.


    Bagging generally improves unstable methods, such as neural networks, classification
    and regression trees, and subset selection in linear regression. However, it can
    mildly degrade the performance of stable methods such as k-nearest neighbors.⁵


    A random forest is an example of bagging. A random forest is a collection of decision
    trees constructed by both bagging and feature randomness, where each tree can
    pick only from a random subset of features to use.


    # Boosting


    Boosting is a family of iterative ensemble algorithms that convert weak learners
    to strong ones. Each learner in this ensemble is trained on the same set of samples,
    but the samples are weighted differently among iterations. As a result, future
    weak learners focus more on the examples that previous weak learners misclassified.
    Figure 6-4 shows an illustration of boosting, which involves the steps that follow.


    5 Leo Breiman, “Bagging Predictors,” Machine Learning 24 (1996): 123–40, https://oreil.ly/adzju.'
