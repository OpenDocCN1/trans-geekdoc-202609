- pgno: 120
  md: 'Another common heuristic is based on disagreement among multiple candidate
    models. This method is called query-by-committee, an example of an ensemble method.23
    You need a committee of several candidate models, which are usually the same model
    trained with different sets of hyperparameters or the same model trained on different
    slices of data. Each model can make one vote for which samples to label next,
    and it might vote based on how uncertain it is about the prediction. You then
    label the samples that the committee disagrees on the most.


    There are other heuristics such as choosing samples that, if trained on them,
    will give the highest gradient updates or will reduce the loss the most. For a
    comprehensive review of active learning methods, check out “Active Learning Literature
    Survey” (Settles 2010).


    The samples to be labeled can come from different data regimes. They can be synthesized
    where your model generates samples in the region of the input space that it’s
    most uncertain about.24 They can come from a stationary distribution where you’ve
    already collected a lot of unlabeled data and your model chooses samples from
    this pool to label. They can come from the real-world distribution where you have
    a stream of data coming in, as in production, and your model chooses samples from
    this stream of data to label.


    I’m most excited about active learning when a system works with real-time data.
    Data changes all the time, a phenomenon we briefly touched on in Chapter 1 and
    will further detail in Chapter 8. Active learning in this data regime will allow
    your model to learn more effectively in real time and adapt faster to changing
    environments.


    # Class Imbalance


    Class imbalance typically refers to a problem in classification tasks where there
    is a substantial difference in the number of samples in each class of the training
    data. For example, in a training dataset for the task of detecting lung cancer
    from X-ray images, 99.99% of the X-rays might be of normal lungs, and only 0.01%
    might contain cancerous cells.


    Class imbalance can also happen with regression tasks where the labels are continuous.
    Consider the task of estimating health-care bills.25 Health-care bills are highly
    skewed—the median bill is low, but the 95th percentile bill is astronomical. When
    predicting hospital bills, it might be more important to predict accurately the
    bills at the 95th percentile than the median bills. A 100% difference in a $250
    bill is acceptable (actual $500, predicted $250), but a 100% difference on a $10k
    bill is not


    23 We’ll cover ensembles in Chapter 6.


    24 Dana Angluin, “Queries and Concept Learning,” Machine Learning 2 (1988): 319–42,
    https://oreil.ly/0uKs4.


    25 Thanks to Eugene Yan for this wonderful example!'
