- pgno: 386
  md: '# About the Author


    Chip Huyen (https://huyenchip.com) is co-founder and CEO of Claypot AI, developing
    infrastructure for real-time machine learning. Previously, she was at NVIDIA,
    Snorkel AI, and Netflix, where she helped some of the world''s largest organizations
    develop and deploy machine learning systems.


    When a student at Stanford, she created and taught the course TensorFlow for Deep
    Learning Research. She is currently teaching CS 329S: Machine Learning Systems
    Design at Stanford. This book is based on the course''s lecture notes.


    She is also the author of four bestselling Vietnamese books, including the series
    Xách ba lô lên và Đi (Quảng Văn 2012, 2013). The series was among FAHASA''s Top
    10 Readers Choice Books in 2014.


    Chip''s expertise is in the intersection of software engineering and machine learning.
    LinkedIn included her among the 10 Top Voices in Software Development in 2019,
    and Top Voices in Data Science & AI in 2020.


    # Colophon


    The animal on the cover of *Designing Machine Learning Systems* is a red-legged
    partridge (*Alectoris rufa*), also known as a French partridge.


    Bred for centuries as a gamebird, this economically important, largely nonmigratory
    member of the pheasant family is native to western continental Europe, though
    populations have been introduced elsewhere, including England, Ireland, and New
    Zealand.


    Relatively small but stout bodied, the red-legged partridge boasts ornate coloration
    and feather patterning, with light brown to gray plumage along its back, a light
    pink belly, a cream-colored throat, a brilliant red bill, and rufous or black
    barring on its flanks.


    Feeding primarily on seeds, leaves, grasses, and roots, but also on insects, red-legged
    partridges breed each year in dry lowland areas, such as farmland, laying their
    eggs in ground nests. Though they continue to be bred in large numbers, these
    birds are now considered near threatened due to steep population declines attributed,
    in part, to overhunting and disappearance of habitat. Like all animals on O''Reilly
    covers, they''re vitally important to our world.


    The cover illustration is by Karen Montgomery, based on an antique line engraving
    from *The Riverside Natural History*. The cover fonts are Gilroy Semibold and
    Guardian Sans. The text font is Adobe Minion Pro; the heading font is Adobe Myriad
    Condensed; and the code font is Dalton Maag''s Ubuntu Mono.'
