  md: 'This problem could have been avoided if you versioned your ML experiments.
    ML systems are part code, part data, so you need to not only version your code
    but your data as well. Code versioning has more or less become a standard in the
    industry. However, at this point, data versioning is like flossing. Everyone agrees
    it''s a good thing to do, but few do it.


    There are a few reasons why data versioning is challenging. One reason is that
    because data is often much larger than code, we can''t use the same strategy that
    people usually use to version code to version data.


    For example, code versioning is done by keeping track of all the changes made
    to a codebase. A change is known as a diff, short for difference. Each change
    is measured by line-by-line comparison. A line of code is usually short enough
    for line-by-line comparison to make sense. However, a line of your data, especially
    if it''s stored in a binary format, can be indefinitely long. Saying that this
    line of 1,000,000 characters is different from the other line of 1,000,000 characters
    isn''t going to be that helpful.


    Code versioning tools allow users to revert to a previous version of the codebase
    by keeping copies of all the old files. However, a dataset used might be so large
    that duplicating it multiple times might be unfeasible.


    Code versioning tools allow for multiple people to work on the same codebase at
    the same time by duplicating the codebase on each person''s local machine. However,
    a dataset might not fit into a local machine.


    Second, there''s still confusion in what exactly constitutes a diff when we version
    data. Would diffs mean changes in the content of any file in your data repository,
    only when a file is removed or added, or when the checksum of the whole repository
    has changed?


    As of 2021, data versioning tools like DVC only register a diff if the checksum
    of the total directory has changed and if a file is removed or added.


    Another confusion is in how to resolve merge conflicts: if developer 1 uses data
    version X to train model A and developer 2 uses data version Y to train model
    B, it doesn''t make sense to merge data versions X and Y to create Z, since there''s
    no model corresponding with Z.


    Third, if you use user data to train your model, regulations like General Data
    Protection Regulation (GDPR) might make versioning this data complicated. For
    example, regulations might mandate that you delete user data if requested, making
    it legally impossible to recover older versions of your data.


    Aggressive experiment tracking and versioning helps with reproducibility, but
    it doesn''t ensure reproducibility. The frameworks and hardware you use might'
