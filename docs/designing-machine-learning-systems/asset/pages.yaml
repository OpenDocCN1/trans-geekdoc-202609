- pgno: 277
  md: '# Alerts


    When our monitoring system detects something suspicious, it’s necessary to alert
    the right people about it. An alert consists of the following three components:


    # An alert policy


    This describes the condition for an alert. You might want to create an alert when
    a metric breaches a threshold, optionally over a certain duration. For example,
    you might want to be notified when a model’s accuracy is under 90%, or that the
    HTTP response latency is higher than a second for at least 10 minutes.


    # Notification channels


    These describe who is to be notified when the condition is met. The alerts will
    be shown in the monitoring service you employ, such as Amazon CloudWatch or GCP
    Cloud Monitoring, but you also want to reach responsible people when they’re not
    on these monitoring services. For example, you might configure your alerts to
    be sent to an email address such as mlops-monitoring@[your company email domain],
    or to post to a Slack channel such as #mlops-monitoring or to PagerDuty.


    # A description of the alert


    This helps the alerted person understand what’s going on. The description should
    be as detailed as possible, such as:


    ```

    ## Recommender model accuracy below 90%


    ${timestamp}: This alert originated from the service ${service-name}

    ```


    Depending on the audience of the alert, it’s often necessary to make the alert
    actionable by providing mitigation instructions or a runbook, a compilation of
    routine procedures and operations that might help with handling the alert.


    Alert fatigue is a real phenomenon, as discussed previously in this chapter. Alert
    fatigue can be demoralizing—nobody likes to be awakened in the middle of the night
    for something outside of their responsibilities. It’s also dangerous—being exposed
    to trivial alerts can desensitize people to critical alerts. It’s important to
    set meaningful conditions so that only critical alerts are sent out.


    # Observability


    Since the mid-2010s, the industry has started embracing the term “observability”
    instead of “monitoring.” Monitoring makes no assumption about the relationship
    between the internal state of a system and its outputs. You monitor the external
    outputs of the system to figure out when something goes wrong inside the system—there’s
    no guarantee that the external outputs will help you figure out what goes wrong.'
