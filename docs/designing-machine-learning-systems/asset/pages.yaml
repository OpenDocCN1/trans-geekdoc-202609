- pgno: 176
  md: 'Table 6-1. Possible outcomes of the ensemble that takes the majority vote from
    three classifiers


    | Outputs of three models | Probability | Ensemble''s output |

    |---|---|---|

    | All three are correct | 0.7 * 0.7 * 0.7 = 0.343 | Correct |

    | Only two are correct | (0.7 * 0.7 * 0.3) * 3 = 0.441 | Correct |

    | Only one is correct | (0.3 * 0.3 * 0.7) * 3 = 0.189 | Wrong |

    | None are correct | 0.3 * 0.3 * 0.3 = 0.027 | Wrong |


    This calculation only holds if the classifiers in an ensemble are uncorrelated.
    If all classifiers are perfectly correlated—all three of them make the same prediction
    for every email—the ensemble will have the same accuracy as each individual classifier.
    When creating an ensemble, the less correlation there is among base learners,
    the better the ensemble will be. Therefore, it''s common to choose very different
    types of models for an ensemble. For example, you might create an ensemble that
    consists of one transformer model, one recurrent neural network, and one gradient-boosted
    tree.


    There are three ways to create an ensemble: bagging, boosting, and stacking. In
    addition to helping boost performance, according to several survey papers, ensemble
    methods such as boosting and bagging, together with resampling, have shown to
    help with imbalanced datasets.³ We''ll go over each of these three methods, starting
    with bagging.


    # Bagging


    Bagging, shortened from *bootstrap aggregating*, is designed to improve both the
    training stability and accuracy of ML algorithms.⁴ It reduces variance and helps
    to avoid overfitting.


    Given a dataset, instead of training one classifier on the entire dataset, you
    sample with replacement to create different datasets, called bootstraps, and train
    a classification or regression model on each of these bootstraps. Sampling with
    replacement ensures that each bootstrap is created independently from its peers.
    Figure 6-3 shows an illustration of bagging.


    3 Mikel Galar, Alberto Fernandez, Edurne Barrenechea, Humberto Bustince, and Francisco
    Herrera, “A Review on Ensembles for the Class Imbalance Problem: Bagging-, Boosting-,
    and Hybrid-Based Approaches,” IEEE Transactions on Systems, Man, and Cybernetics,
    Part C (Applications and Reviews) 42, no. 4 (July 2012): 463–84, https://oreil.ly/ZBlgE;
    G. Rekha, Amit Kumar Tyagi, and V. Krishna Reddy, “Solving Class Imbalance Problem
    Using Bagging, Boosting Techniques, With and Without Using Noise Filtering Method,”
    International Journal of Hybrid Intelligent Systems 15, no. 2 (January 2019):
    67–76, https://oreil.ly/hchzU.


    4 Training stability here means less fluctuation in the training loss.'
