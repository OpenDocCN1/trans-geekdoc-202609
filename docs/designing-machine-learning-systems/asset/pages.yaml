- pgno: 282
  md: 'automate the update. All of these concepts allow us to design an ML system
    that is maintainable and adaptable to changing environments.


    This is the chapter I’m most excited to write about, and I hope that I can get
    you excited about it too!


    # Continual Learning


    When hearing “continual learning,” many people think of the training paradigm
    where a model updates itself with every incoming sample in production. Very few
    companies actually do that. First, if your model is a neural network, learning
    with every incoming sample makes it susceptible to catastrophic forgetting. Catastrophic
    forgetting refers to the tendency of a neural network to completely and abruptly
    forget previously learned information upon learning new information.¹


    Second, it can make training more expensive—most hardware backends today were
    designed for batch processing, so processing only one sample at a time causes
    a huge waste of compute power and is unable to exploit data parallelism.


    Companies that employ continual learning in production update their models in
    micro-batches. For example, they might update the existing model after every 512
    or 1,024 examples—the optimal number of examples in each micro-batch is task dependent.


    The updated model shouldn’t be deployed until it’s been evaluated. This means
    that you shouldn’t make changes to the existing model directly. Instead, you create
    a replica of the existing model and update this replica on new data, and only
    replace the existing model with the updated replica if the updated replica proves
    to be better. The existing model is called the champion model, and the updated
    replica, the challenger. This process is shown in Figure 9-1. This is an oversimplification
    of the process for the sake of understanding. In reality, a company might have
    multiple challengers at the same time, and handling the failed challenger is a
    lot more sophisticated than simply discarding it.


    1 Joan Serrà, Dídac Surís, Marius Miron, and Alexandros Karatzoglou, “Overcoming
    Catastrophic Forgetting with Hard Attention to the Task,” arXiv, January 4, 2018,
    https://oreil.ly/P95EZ.'
