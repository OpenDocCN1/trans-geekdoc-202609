- pgno: 19
  md: '# Overview of Machine Learning Systems


    In November 2016, Google announced that it had incorporated its multilingual neural
    machine translation system into Google Translate, marking one of the first success
    stories of deep artificial neural networks in production at scale.¹ According
    to Google, with this update, the quality of translation improved more in a single
    leap than they had seen in the previous 10 years combined.


    This success of deep learning renewed the interest in machine learning (ML) at
    large. Since then, more and more companies have turned toward ML for solutions
    to their most challenging problems. In just five years, ML has found its way into
    almost every aspect of our lives: how we access information, how we communicate,
    how we work, how we find love. The spread of ML has been so rapid that it’s already
    hard to imagine life without it. Yet there are still many more use cases for ML
    waiting to be explored in fields such as health care, transportation, farming,
    and even in helping us understand the universe.²


    Many people, when they hear “machine learning system,” think of just the ML algorithms
    being used such as logistic regression or different types of neural networks.
    However, the algorithm is only a small part of an ML system in production. The
    system also includes the business requirements that gave birth to the ML project
    in the first place, the interface where users and developers interact with your
    system, the data stack, and the logic for developing, monitoring, and updating
    your models, as well as the infrastructure that enables the delivery of that logic.
    Figure 1-1 shows you the different components of an ML system and in which chapters
    of this book they will be covered.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# The Relationship Between MLOps and ML Systems Design


    ![](img/bde3d1ed5ea7825115c846be3467945f_20_0.png)


    Ops in MLOps comes from DevOps, short for Developments and Operations. To operationalize
    something means to bring it into production, which includes deploying, monitoring,
    and maintaining it. MLOps is a set of tools and best practices for bringing ML
    into production.


    ML systems design takes a system approach to MLOps, which means that it considers
    an ML system holistically to ensure that all the components and their stakeholders
    can work together to satisfy the specified objectives and requirements.


    ![](img/bde3d1ed5ea7825115c846be3467945f_20_1.png)


    Figure 1-1. Different components of an ML system. “ML algorithms” is usually what
    people think of when they say machine learning, but it’s only a small part of
    the entire system.


    There are many excellent books about various ML algorithms. This book doesn’t
    cover any specific algorithms in detail but rather helps readers understand the
    entire ML system as a whole. In other words, this book’s goal is to provide you
    with a framework to develop a solution that best works for your problem, regardless
    of which algorithm you might end up using. Algorithms might become outdated quickly
    as new algorithms are constantly being developed, but the framework proposed in
    this book should still work with new algorithms.


    The first chapter of the book aims to give you an overview of what it takes to
    bring an ML model to production. Before discussing how to develop an ML system,
    it’s'
  merge: -1
  img_proc: true
