- pgno: 321
  md: 'underrated and underinvested in at most companies. According to Ville Tuulos
    in his book *Effective Data Science Infrastructure*, “you would be surprised to
    know how many companies have well-tuned, scalable production infrastructure but
    the question of how the code is developed, debugged, and tested in the first place
    is solved in an ad-hoc manner.”22


    He suggested that “if you have time to set up only one piece of infrastructure
    well, make it the development environment for data scientists.” Because the dev
    environment is where engineers work, improvements in the dev environment translate
    directly into improvements in engineering productivity.


    In this section, we’ll first cover different components of the dev environment,
    then we’ll discuss the standardization of the dev environment before we discuss
    how to bring your changes from the dev environment to the production environment
    with containers.


    # Dev Environment Setup


    The dev environment should be set up to contain all the tools that can make it
    easier for engineers to do their job. It should also consist of tools for *versioning*.
    As of this writing, companies use an ad hoc set of tools to version their ML workflows,
    such as Git to version control code, DVC to version data, Weights & Biases or
    Comet.ml to track experiments during development, and MLflow to track artifacts
    of models when deploying them. Claypot AI is working on a platform that can help
    you version and track all your ML workflows in one place. Versioning is important
    for any software engineering projects, but even more so for ML projects because
    of both the sheer number of things you can change (code, parameters, the data
    itself, etc.) and the need to keep track of prior runs to reproduce later on.
    We’ve covered this in the section “Experiment Tracking and Versioning” on page
    162.


    The dev environment should also be set up with a *CI/CD* test suite to test your
    code before pushing it to the staging or production environment. Examples of tools
    to orchestrate your CI/CD test suite are GitHub Actions and CircleCI. Because
    CI/CD is a software engineering concern, it’s beyond the scope of this book.


    In this section, we’ll focus on the place where engineers write code: the IDE.


    # IDE


    The *IDE* is the editor where you write your code. IDEs tend to support multiple
    programming languages. IDEs can be native apps like VS Code or Vim. IDEs can be
    browser-based, which means they run in browsers, such as AWS Cloud9.'
