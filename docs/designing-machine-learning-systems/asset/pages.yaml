- pgno: 39
  md: 'that cannot explain how it works but has a 90% cure rate and a human surgeon
    with an 80% cure rate. Do you want the AI surgeon to be illegal?[^28]


    A couple of weeks later, when I asked this question to a group of 30 technology
    executives at public nontech companies, only half of them would want the highly
    effective but unable-to-explain AI surgeon to operate on them. The other half
    wanted the human surgeon.


    While most of us are comfortable with using a microwave without understanding
    how it works, many don’t feel the same way about AI yet, especially if that AI
    makes important decisions about their lives.


    Since most ML research is still evaluated on a single objective, model performance,
    researchers aren’t incentivized to work on model interpretability. However, interpretability
    isn’t just optional for most ML use cases in the industry, but a requirement.


    First, interpretability is important for users, both business leaders and end
    users, to understand why a decision is made so that they can trust a model and
    detect potential biases mentioned previously.[^29] Second, it’s important for
    developers to be able to debug and improve a model.


    Just because interpretability is a requirement doesn’t mean everyone is doing
    it. As of 2019, only 19% of large companies are working to improve the explainability
    of their algorithms.[^30]


    # Discussion


    Some might argue that it’s OK to know only the academic side of ML because there
    are plenty of jobs in research. The first part—it’s OK to know only the academic
    side of ML—is true. The second part is false.


    While it’s important to pursue pure research, most companies can’t afford it unless
    it leads to short-term business applications. This is especially true now that
    the research community took the “bigger, better” approach. Oftentimes, new models
    require a massive amount of data and tens of millions of dollars in compute alone.


    As ML research and off-the-shelf models become more accessible, more people and
    organizations would want to find applications for them, which increases the demand
    for ML in production.


    The vast majority of ML-related jobs will be, and already are, in productionizing
    ML.


    [^28]: Tweet by Geoffrey Hinton (@geoffreyhinton), February 20, 2020. *https://oreil.ly/KdfD8.*


    [^29]: For certain use cases in certain countries, users have a “right to explanation”:
    a right to be given an explanation for an output of the algorithm.


    [^30]: Stanford HAI, *The 2019 AI Index Report.*'
