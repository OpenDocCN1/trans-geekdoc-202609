  md: 'row duplicates, whereas true relations can’t contain duplicates. However, this
    subtle difference has been safely ignored by most people.


    The most important thing to note about SQL is that it’s a declarative language,
    as opposed to Python, which is an imperative language. In the imperative paradigm,
    you specify the steps needed for an action and the computer executes these steps
    to return the outputs. In the declarative paradigm, you specify the outputs you
    want, and the computer figures out the steps needed to get you the queried outputs.


    With an SQL database, you specify the pattern of data you want—the tables you
    want the data from, the conditions the results must meet, the basic data transformations
    such as join, sort, group, aggregate, etc.—but not how to retrieve the data. It
    is up to the database system to decide how to break the query into different parts,
    what methods to use to execute each part of the query, and the order in which
    different parts of the query should be executed.


    With certain added features, SQL can be Turing-complete, which means that, in
    theory, SQL can be used to solve any computation problem (without making any guarantee
    about the time or memory required). However, in practice, it’s not always easy
    to write a query to solve a specific task, and it’s not always feasible or tractable
    to execute a query. Anyone working with SQL databases might have nightmarish memories
    of painfully long SQL queries that are impossible to understand and nobody dares
    to touch for fear that things might break.12


    Figuring out how to execute an arbitrary query is the hard part, which is the
    job of query optimizers. A query optimizer examines all possible ways to execute
    a query and finds the fastest way to do so.13 It’s possible to use ML to improve
    query optimizers based on learning from incoming queries.14 Query optimization
    is one of the most challenging problems in database systems, and normalization
    means that data is spread out on multiple relations, which makes joining it together
    even harder. Even though developing a query optimizer is hard, the good news is
    that you generally only need one query optimizer and all your applications can
    leverage it.


    12 Greg Kemnitz, a coauthor of the original Postgres paper, shared on Quora that
    he once wrote a reporting SQL query that was 700 lines long and visited 27 different
    tables in lookups or joins. The query had about 1,000 lines of comments to help
    him remember what he was doing. It took him three days to compose, debug, and
    tune.


    13 Yannis E. Ioannidis, “Query Optimization,” ACM Computing Surveys (CSUR) 28,
    no. 1 (1996): 121–23, https://oreil.ly/omXMg


    14 Ryan Marcus et al., “Neo: A Learned Query Optimizer,” arXiv preprint arXiv:1904.03711
    (2019), https://oreil.ly/wHy6p.'
