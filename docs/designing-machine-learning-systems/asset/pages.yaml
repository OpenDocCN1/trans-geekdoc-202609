  md: '# Natural Labels


    Hand-labeling isn’t the only source for labels. You might be lucky enough to work
    on tasks with natural ground truth labels. Tasks with natural labels are tasks
    where the model’s predictions can be automatically evaluated or partially evaluated
    by the system. An example is the model that estimates time of arrival for a certain
    route on Google Maps. If you take that route, by the end of your trip, Google
    Maps knows how long the trip actually took, and thus can evaluate the accuracy
    of the predicted time of arrival. Another example is stock price prediction. If
    your model predicts a stock’s price in the next two minutes, then after two minutes,
    you can compare the predicted price with the actual price.


    The canonical example of tasks with natural labels is recommender systems. The
    goal of a recommender system is to recommend to users items relevant to them.
    Whether a user clicks on the recommended item or not can be seen as the feedback
    for that recommendation. A recommendation that gets clicked on can be presumed
    to be good (i.e., the label is POSITIVE) and a recommendation that doesn’t get
    clicked on after a period of time, say 10 minutes, can be presumed to be bad (i.e.,
    the label is NEGATIVE).


    Many tasks can be framed as recommendation tasks. For example, you can frame the
    task of predicting ads’ click-through rates as recommending the most relevant
    ads to users based on their activity histories and profiles. Natural labels that
    are inferred from user behaviors like clicks and ratings are also known as behavioral
    labels.


    Even if your task doesn’t inherently have natural labels, it might be possible
    to set up your system in a way that allows you to collect some feedback on your
    model. For example, if you’re building a machine translation system like Google
    Translate, you can have the option for the community to submit alternative translations
    for bad translations—these alternative translations can be used to train the next
    iteration of your models (though you might want to review these suggested translations
    first). Newsfeed ranking is not a task with inherent labels, but by adding the
    Like button and other reactions to each newsfeed item, Facebook is able to collect
    feedback on their ranking algorithm.


    Tasks with natural labels are fairly common in the industry. In a survey of 86
    companies in my network, I found that 63% of them work with tasks with natural
    labels, as shown in Figure 4-3. This doesn’t mean that 63% of tasks that can benefit
    from ML solutions have natural labels. What is more likely is that companies find
    it easier and cheaper to first start on tasks that have natural labels.'
