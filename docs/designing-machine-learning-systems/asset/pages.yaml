  md: "The main drawback of Argo, other than its messy YAML files, is that it can\
    \ only run on K8s clusters, which are only available in production. If you want\
    \ to test the same workflow locally, you'll have to use minikube to simulate a\
    \ K8s on your laptop, which can get messy.\n\nEnter Kubeflow and Metaflow, the\
    \ two tools that aim to help you run the workflow in both dev and prod environments\
    \ by abstracting away infrastructure boilerplate code usually needed to run Airflow\
    \ or Argo. They promise to give data scientists access to the full compute power\
    \ of the prod environment from local notebooks, which effectively allows data\
    \ scientists to use the same code in both dev and prod environments.\n\nEven though\
    \ both tools have some scheduling capacity, they are meant to be used with a bona\
    \ fide scheduler and orchestrator. One component of Kubeflow is Kubeflow Pipelines,\
    \ which is built on top of Argo, and it's meant to be used on top of K8s. Metaflow\
    \ can be used with AWS Batch or K8s.\n\nBoth tools are fully parameterized and\
    \ dynamic. Currently, Kubeflow is the more popular one. However, from a user experience\
    \ perspective, Metaflow is superior, in my opinion. In Kubeflow, while you can\
    \ define your workflow in Python, you still have to write a Dockerfile and a YAML\
    \ file to specify the specs of each component (e.g., process data, train, deploy)\
    \ before you can stitch them together in a Python workflow. Basically, Kubeflow\
    \ helps you abstract away other tools' boilerplate by making you write Kubeflow\
    \ boilerplate.\n\nIn Metaflow, you can use a Python decorator @conda to specify\
    \ the requirements for each step—required libraries, memory and compute requirements—and\
    \ Metaflow will automatically create a container with all these requirements to\
    \ execute the step. You save on Dockerfiles or YAML files.\n\nMetaflow allows\
    \ you to work seamlessly with both dev and prod environments from the same notebook/script.\
    \ You can run experiments with small datasets on local machines, and when you're\
    \ ready to run with the large dataset on the cloud, simply add @batch decorator\
    \ to execute it on AWS Batch. You can even run different steps in the same workflow\
    \ in different environments. For example, if a step requires a small memory footprint,\
    \ it can run on your local machine. But if the next step requires a large memory\
    \ footprint, you can just add @batch to execute it on the cloud.\n\n```\n# Example:\
    \ sketch of a recommender system that uses an ensemble of two models.\n# Model\
    \ A will be run on your local machine and model B will be run on AWS.\n\nclass\
    \ RecSysFlow(FlowSpec):\n    @step\n    def start(self):\n        self.data =\
    \ load_data()\n        self.next(self.fitA, self.fitB)\n```"
