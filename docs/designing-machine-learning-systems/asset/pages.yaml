- pgno: 256
  md: 'P(Y|X) denotes the conditional probability of an output given an input—for
    example, the probability of an email being spam given the content of the email.
    P(X) denotes the probability density of the input. P(Y) denotes the probability
    density of the output. Label shift, covariate shift, and concept drift are defined
    as follows:


    # Covariate shift


    When P(X) changes but P(Y|X) remains the same. This refers to the first decomposition
    of the joint distribution.


    # Label shift


    When P(Y) changes but P(X|Y) remains the same. This refers to the second decomposition
    of the joint distribution.


    # Concept drift


    When P(Y|X) changes but P(X) remains the same. This refers to the first decomposition
    of the joint distribution.21


    If you find this confusing, don’t panic. We’ll go over examples in the following
    section to illustrate their differences.


    # Covariate shift


    Covariate shift is one of the most widely studied forms of data distribution shift.22
    In statistics, a covariate is an independent variable that can influence the outcome
    of a given statistical trial but which is not of direct interest. Consider that
    you are running an experiment to determine how locations affect the housing prices.
    The housing price variable is your direct interest, but you know the square footage
    affects the price, so the square footage is a covariate. In supervised ML, the
    label is the variable of direct interest, and the input features are covariate
    variables.


    Mathematically, covariate shift is when P(X) changes, but P(Y|X) remains the same,
    which means that the distribution of the input changes, but the conditional probability
    of an output given an input remains the same.


    To make this concrete, consider the task of detecting breast cancer. You know
    that the risk of breast cancer is higher for women over the age of 40,23 so you
    have a variable “age” as your input. You might have more women over the age of
    40 in your training data than in your inference data, so the input distributions
    differ for your training and inference data. However, for an example with a given
    age, such as above 40, the


    21 You might wonder what about the case when P(X|Y) changes but P(Y) remains the
    same, as in the second decomposition. I’ve never encountered any research in this
    setting. I asked a couple of researchers who specialize in data shifts about it,
    and they also told me that setting would be too difficult to study.


    22 Wouter M. Kouw and Marco Loog, “An Introduction to Domain Adaptation and Transfer
    Learning,” arXiv, December 31, 2018, https://oreil.ly/VKSVP.


    23 “Breast Cancer Risk in American Women,” National Cancer Institute, https://oreil.ly/BFP3U.'
