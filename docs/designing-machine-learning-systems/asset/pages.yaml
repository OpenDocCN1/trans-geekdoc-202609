- pgno: 144
  md: 'One common practice is to fill in missing values with their defaults. For example,
    if the job is missing, you might fill it with an empty string “”. Another common
    practice is to fill in missing values with the mean, median, or mode (the most
    common value). For example, if the temperature value is missing for a data sample
    whose month value is July, it’s not a bad idea to fill it with the median temperature
    of July.


    Both practices work well in many cases, but sometimes they can cause hair-pulling
    bugs. One time, in one of the projects I was helping with, we discovered that
    the model was spitting out garbage because the app’s frontend no longer asked
    users to enter their age, so age values were missing, and the model filled them
    with 0. But the model never saw the age value of 0 during training, so it couldn’t
    make reasonable predictions.


    In general, you want to avoid filling missing values with possible values, such
    as filling the missing number of children with 0—0 is a possible value for the
    number of children. It makes it hard to distinguish between people whose information
    is missing and people who don’t have children.


    Multiple techniques might be used at the same time or in sequence to handle missing
    values for a particular set of data. Regardless of what techniques you use, one
    thing is certain: there is no perfect way to handle missing values. With deletion,
    you risk losing important information or accentuating biases. With imputation,
    you risk injecting your own bias into and adding noise to your data, or worse,
    data leakage. If you don’t know what data leakage is, don’t panic, we’ll cover
    it in the section “Data Leakage” on page 135.


    # Scaling


    Consider the task of predicting whether someone will buy a house in the next 12
    months, and the data shown in Table 5-2. The values of the variable Age in our
    data range from 20 to 40, whereas the values of the variable Annual Income range
    from 10,000 to 150,000. When we input these two variables into an ML model, it
    won’t understand that 150,000 and 40 represent different things. It will just
    see them both as numbers, and because the number 150,000 is much bigger than 40,
    it might give it more importance, regardless of which variable is actually more
    useful for generating predictions.


    Before inputting features into models, it’s important to scale them to be similar
    ranges. This process is called feature scaling. This is one of the simplest things
    you can do that often results in a performance boost for your model. Neglecting
    to do so can cause your model to make gibberish predictions, especially with classical
    algorithms like gradient-boosted trees and logistic regression.⁴


    4 Feature scaling once boosted my model’s performance by almost 10%.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'An intuitive way to scale your features is to get them to be in the range [0,
    1]. Given a variable $x$, its values can be rescaled to be in this range using
    the following formula:


    $x'' = \frac{x - \min(x)}{\max(x) - \min(x)}$


    You can validate that if $x$ is the maximum value, the scaled value $x''$ will
    be 1. If $x$ is the minimum value, the scaled value $x''$ will be 0.


    If you want your feature to be in an arbitrary range $[a, b]$—empirically, I find
    the range $[-1, 1]$ to work better than the range $[0, 1]$—you can use the following
    formula:


    $x'' = a + \frac{(x - \min(x))(b - a)}{\max(x) - \min(x)}$


    Scaling to an arbitrary range works well when you don’t want to make any assumptions
    about your variables. If you think that your variables might follow a normal distribution,
    it might be helpful to normalize them so that they have zero mean and unit variance.
    This process is called *standardization*:


    $x'' = \frac{x - \bar{x}}{\sigma},$


    with $\bar{x}$ being the mean of variable $x$, and $\sigma$ being its standard
    deviation.


    In practice, ML models tend to struggle with features that follow a skewed distribution.
    To help mitigate the skewness, a technique commonly used is log transformation:
    apply the log function to your feature. An example of how the log transformation
    can make your data less skewed is shown in Figure 5-3. While this technique can
    yield performance gain in many cases, it doesn’t work for all cases, and you should
    be wary of the analysis performed on log-transformed data instead of the original
    data.⁵


    5 Changyong Feng, Hongyue Wang, Naiji Lu, Tian Chen, Hua He, Ying Lu, and Xin
    M. Tu, “Log-Transformation and Its Implications for Data Analysis,” *Shanghai
    Archives of Psychiatry* 26, no. 2 (April 2014): 105–9, https://oreil.ly/hHJft.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '![](img/bde3d1ed5ea7825115c846be3467945f_146_0.png)


    Figure 5-3. In many cases, the log transformation can help reduce the skewness
    of your data


    There are two important things to note about scaling. One is that it’s a common
    source of data leakage (this will be covered in greater detail in the section
    “Data Leakage” on page 135). Another is that it often requires global statistics—you
    have to look at the entire or a subset of training data to calculate its min,
    max, or mean. During inference, you reuse the statistics you had obtained during
    training to scale new data. If the new data has changed significantly compared
    to the training, these statistics won’t be very useful. Therefore, it’s important
    to retrain your model often to account for these changes.


    # Discretization


    This technique is included in this book for completeness, though in practice,
    I’ve rarely found discretization to help. Imagine that we’ve built a model with
    the data in Table 5-2. During training, our model has seen the annual income values
    of “150,000,” “50,000,” “100,000,” and so on. During inference, our model encounters
    an example with an annual income of “9,000.50.”


    Intuitively, we know that $9,000.50 a year isn’t much different from $10,000/year,
    and we want our model to treat both of them the same way. But the model doesn’t
    know that. Our model only knows that 9,000.50 is different from 10,000, and it
    will treat them differently.


    Discretization is the process of turning a continuous feature into a discrete
    feature. This process is also known as quantization or binning. This is done by
    creating buckets for the given values. For annual income, you might want to group
    them into three buckets as follows:'
