  md: '+   - Lower income: less than $35,000/year

    +   - Middle income: between $35,000 and $100,000/year

    +   - Upper income: more than $100,000/year


    Instead of having to learn an infinite number of possible incomes, our model can
    focus on learning only three categories, which is a much easier task to learn.
    This technique is supposed to be more helpful with limited training data.


    Even though, by definition, discretization is meant for continuous features, it
    can be used for discrete features too. The age variable is discrete, but it might
    still be useful to group the values into buckets such as follows:


    +   - Less than 18

    +   - Between 18 and 22

    +   - Between 22 and 30

    +   - Between 30 and 40

    +   - Between 40 and 65

    +   - Over 65


    The downside is that this categorization introduces discontinuities at the category
    boundaries—$34,999 is now treated as completely different from $35,000, which
    is treated the same as $100,000. Choosing the boundaries of categories might not
    be all that easy. You can try to plot the histograms of the values and choose
    the boundaries that make sense. In general, common sense, basic quantiles, and
    sometimes subject matter expertise can help.


    # Encoding Categorical Features


    We’ve talked about how to turn continuous features into categorical features.
    In this section, we’ll discuss how to best handle categorical features.


    People who haven’t worked with data in production tend to assume that categories
    are static, which means the categories don’t change over time. This is true for
    many categories. For example, age brackets and income brackets are unlikely to
    change, and you know exactly how many categories there are in advance. Handling
    these categories is straightforward. You can just give each category a number
    and you’re done.


    However, in production, categories change. Imagine you’re building a recommender
    system to predict what products users might want to buy from Amazon. One of the
    features you want to use is the product brand. When looking at Amazon’s historical'
