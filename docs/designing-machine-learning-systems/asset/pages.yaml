- pgno: 69
  md: 'Logs can record the state and significant events of the system, such as memory
    usage, number of instances, services called, packages used, etc. They can record
    the results of different jobs, including large batch jobs for data processing
    and model training. These types of logs provide visibility into how the system
    is doing. The main purpose of this visibility is for debugging and potentially
    improving the application. Most of the time, you don’t have to look at these types
    of logs, but they are essential when something is on fire.


    Because logs are system generated, they are much less likely to be malformatted
    the way user input data is. Overall, logs don’t need to be processed as soon as
    they arrive, the way you would want to process user input data. For many use cases,
    it’s acceptable to process logs periodically, such as hourly or even daily. However,
    you might still want to process your logs fast to be able to detect and be notified
    whenever something interesting happens.¹


    Because debugging ML systems is hard, it’s a common practice to log everything
    you can. This means that your volume of logs can grow very, very quickly. This
    leads to two problems. The first is that it can be hard to know where to look
    because signals are lost in the noise. There have been many services that process
    and analyze logs, such as Logstash, Datadog, Logz.io, etc. Many of them use ML
    models to help you process and make sense of your massive number of logs.


    The second problem is how to store a rapidly growing number of logs. Luckily,
    in most cases, you only have to store logs for as long as they are useful and
    can discard them when they are no longer relevant for you to debug your current
    system. If you don’t have to access your logs frequently, they can also be stored
    in low-access storage that costs much less than higher-frequency-access storage.²


    The system also generates data to record users’ behaviors, such as clicking, choosing
    a suggestion, scrolling, zooming, ignoring a pop-up, or spending an unusual amount
    of time on certain pages. Even though this is system-generated data, it’s still
    considered part of user data and might be subject to privacy regulations.³


    1 “Interesting” in production usually means catastrophic, such as a crash or when
    your cloud bill hits an astronomical amount.


    2 As of November 2021, AWS S3 Standard, the storage option that allows you to
    access your data with the latency of milliseconds, costs about five times more
    per GB than S3 Glacier, the storage option that allows you to retrieve your data
    with a latency from between 1 minute to 12 hours.


    3 An ML engineer once mentioned to me that his team only used users’ historical
    product browsing and purchases to make recommendations on what they might like
    to see next. I responded: “So you don’t use personal data at all?” He looked at
    me, confused. “If you meant demographic data like users’ age, location, then no,
    we don’t. But I’d say that a person’s browsing and purchasing activities are extremely
    personal.”'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'There are also *internal databases*, generated by various services and enterprise
    applications in a company. These databases manage their assets such as inventory,
    customer relationship, users, and more. This kind of data can be used by ML models
    directly or by various components of an ML system. For example, when users enter
    a search query on Amazon, one or more ML models process that query to detect its
    intention—if someone types in “frozen,” are they looking for frozen foods or Disney’s
    *Frozen* franchise?—then Amazon needs to check its internal databases for the
    availability of these products before ranking them and showing them to users.


    Then there’s the wonderfully weird world of *third-party data*. First-party data
    is the data that your company already collects about your users or customers.
    Second-party data is the data collected by another company on their own customers
    that they make available to you, though you’ll probably have to pay for it. Third-party
    data companies collect data on the public who aren’t their direct customers.


    The rise of the internet and smartphones has made it much easier for all types
    of data to be collected. It used to be especially easy with smartphones since
    each phone used to have a unique advertiser ID—iPhones with Apple’s Identifier
    for Advertisers (IDFA) and Android phones with their Android Advertising ID (AAID)—which
    acted as a unique ID to aggregate all activities on a phone. Data from apps, websites,
    check-in services, etc. are collected and (hopefully) anonymized to generate activity
    history for each person.


    Data of all kinds can be bought, such as social media activities, purchase history,
    web browsing habits, car rentals, and political leaning for different demographic
    groups getting as granular as men, age 25–34, working in tech, living in the Bay
    Area. From this data, you can infer information such as people who like brand
    A also like brand B. This data can be especially helpful for systems such as recommender
    systems to generate results relevant to users’ interests. Third-party data is
    usually sold after being cleaned and processed by vendors.


    However, as users demand more data privacy, companies have been taking steps to
    curb the usage of advertiser IDs. In early 2021, Apple made their IDFA opt-in.
    This change has reduced significantly the amount of third-party data available
    on iPhones, forcing many companies to focus more on first-party data.⁴ To fight
    back this change, advertisers have been investing in workarounds. For example,
    the China Advertising Association, a state-supported trade association for China’s
    advertising industry, invested in a device fingerprinting system called CAID that
    allowed apps like TikTok and Tencent to keep tracking iPhone users.⁵


    4 John Koetsier, “Apple Just Crippled IDFA, Sending an $80 Billion Industry Into
    Upheaval,” *Forbes*, June 24, 2020, https://oreil.ly/rqPX9.


    5 Patrick McGee and Yuan Yang, “TikTok Wants to Keep Tracking iPhone Users with
    State-Backed Workaround,” *Ars Technica*, March 16, 2021, https://oreil.ly/54pkg.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Data Formats


    Once you have data, you might want to store it (or “persist” it, in technical
    terms). Since your data comes from multiple sources with different access patterns,°
    storing your data isn’t always straightforward and, for some cases, can be costly.
    It’s important to think about how the data will be used in the future so that
    the format you use will make sense. Here are some of the questions you might want
    to consider:


    +   - How do I store multimodal data, e.g., a sample that might contain both images
    and texts?

    +   - Where do I store my data so that it’s cheap and still fast to access?

    +   - How do I store complex models so that they can be loaded and run correctly
    on different hardware?


    The process of converting a data structure or object state into a format that
    can be stored or transmitted and reconstructed later is data serialization. There
    are many, many data serialization formats. When considering a format to work with,
    you might want to consider different characteristics such as human readability,
    access patterns, and whether it’s based on text or binary, which influences the
    size of its files. Table 3-1 consists of just a few of the common formats that
    you might encounter in your work. For a more comprehensive list, check out the
    wonderful Wikipedia page “Comparison of Data-Serialization Formats”.


    Table 3-1. Common data formats and where they are used


    | Format | Binary/Text | Human-readable | Example use cases |

    |---|---|---|---|

    | JSON | Text | Yes | Everywhere |

    | CSV | Text | Yes | Everywhere |

    | Parquet | Binary | No | Hadoop, Amazon Redshift |

    | Avro | Binary primary | No | Hadoop |

    | Protobuf | Binary primary | No | Google, TensorFlow (TFRecord) |

    | Pickle | Binary | No | Python, PyTorch serialization |


    We’ll go over a few of these formats, starting with JSON. We’ll also go over the
    two formats that are common and represent two distinct paradigms: CSV and Parquet.'
