  md: '# Model Deployment and Prediction Service


    In Chapters 4 through 6, we have discussed the considerations for developing an
    ML model, from creating training data, extracting features, and developing the
    model to crafting metrics to evaluate this model. These considerations constitute
    the logic of the model—instructions on how to go from raw data into an ML model,
    as shown in Figure 7-1. Developing this logic requires both ML knowledge and subject
    matter expertise. In many companies, this is the part of the process that is done
    by the ML or data science teams.


    ![](img/bde3d1ed5ea7825115c846be3467945f_209_0.png)


    Figure 7-1. Different aspects that make up the ML model logic


    In this chapter, we’ll discuss another part in the iterative process: deploying
    your model. “Deploy” is a loose term that generally means making your model running
    and accessible. During model development, your model usually runs in a'
