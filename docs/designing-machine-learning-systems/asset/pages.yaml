- pgno: 64
  md: '![](img/bde3d1ed5ea7825115c846be3467945f_64_0.png)


    Figure 2-8. The size of the datasets (log scale) used for language models over
    time


    Even though much of the progress in deep learning in the last decade was fueled
    by an increasingly large amount of data, more data doesn’t always lead to better
    performance for your model. More data at lower quality, such as data that is outdated
    or data with incorrect labels, might even hurt your model’s performance.


    # Summary


    I hope that this chapter has given you an introduction to ML systems design and
    the considerations we need to take into account when designing an ML system.


    Every project must start with why this project needs to happen, and ML projects
    are no exception. We started the chapter with an assumption that most businesses
    don’t care about ML metrics unless they can move business metrics. Therefore,
    if an ML system is built for a business, it must be motivated by business objectives,
    which need to be translated into ML objectives to guide the development of ML
    models.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'Before building an ML system, we need to understand the requirements that the
    system needs to meet to be considered a good system. The exact requirements vary
    from use case to use case, and in this chapter, we focused on the four most general
    requirements: reliability, scalability, maintainability, and adaptability. Techniques
    to satisfy each of these requirements will be covered throughout the book.


    Building an ML system isn''t a one-off task but an iterative process. In this
    chapter, we discussed the iterative process to develop an ML system that met those
    preceding requirements.


    We ended the chapter on a philosophical discussion of the role of data in ML systems.
    There are still many people who believe that having intelligent algorithms will
    eventually trump having a large amount of data. However, the success of systems
    including AlexNet, BERT, and GPT showed that the progress of ML in the last decade
    relies on having access to a large amount of data.24 Regardless of whether data
    can overpower intelligent design, no one can deny the importance of data in ML.
    A nontrivial part of this book will be devoted to shedding light on various data
    questions.


    Complex ML systems are made up of simpler building blocks. Now that we''ve covered
    the high-level overview of an ML system in production, we''ll zoom in to its building
    blocks in the following chapters, starting with the fundamentals of data engineering
    in the next chapter. If any of the challenges mentioned in this chapter seem abstract
    to you, I hope that specific examples in the following chapters will make them
    more concrete.


    24 Alex Krizhevsky, Ilya Sutskever, and Geoffrey E Hinton, “ImageNet Classification
    with Deep Convolutional Neural Networks,” in Advances in Neural Information Processing
    Systems, vol. 25, ed. F. Pereira, C.J. Burges, L. Bottou, and K.Q. Weinberger
    (Curran Associates, 2012), https://oreil.ly/MFYp9; Jacob Devlin, Ming-Wei Chang,
    Kenton Lee, and Kristina Toutanova, “BERT: Pre-training of Deep Bidirectional
    Transformers for Language Understanding,” arXiv, 2019, https://oreil.ly/TN8fN;
    “Better Language Models and Their Implications,” OpenAI blog, February 14, 2019,
    https://oreil.ly/SGV7g.'
