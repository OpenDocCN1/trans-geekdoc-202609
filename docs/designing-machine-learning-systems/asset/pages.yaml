- pgno: 220
  md: 'Because the predictions are precomputed, you don’t have to worry about how
    long it’ll take your models to generate predictions. For this reason, batch prediction
    can also be seen as a trick to reduce the inference latency of more complex models—the
    time it takes to retrieve a prediction is usually less than the time it takes
    to generate it.


    Batch prediction is good for when you want to generate a lot of predictions and
    don’t need the results immediately. You don’t have to use all the predictions
    generated. For example, you can make predictions for all customers on how likely
    they are to buy a new product, and reach out to the top 10%.


    However, the problem with batch prediction is that it makes your model less responsive
    to users’ change preferences. This limitation can be seen even in more technologically
    progressive companies like Netflix. Say you’ve been watching a lot of horror movies
    lately, so when you first log in to Netflix, horror movies dominate recommendations.
    But you’re feeling bright today, so you search “comedy” and start browsing the
    comedy category. Netflix should learn and show you more comedy in your list of
    their recommendations, right? As of writing this book, it can’t update the list
    until the next batch of recommendations is generated, but I have no doubt that
    this limitation will be addressed in the near future.


    Another problem with batch prediction is that you need to know what requests to
    generate predictions for in advance. In the case of recommending movies for users,
    you know in advance how many users to generate recommendations for.17 However,
    for cases when you have unpredictable queries—if you have a system to translate
    from English to French, it might be impossible to anticipate every possible English
    text to be translated—you need to use online prediction to generate predictions
    as requests arrive.


    In the Netflix example, batch prediction causes mild inconvenience (which is tightly
    coupled with user engagement and retention), not catastrophic failures. There
    are many applications where batch prediction would lead to catastrophic failures
    or just wouldn’t work. Examples where online prediction is crucial include high-frequency
    trading, autonomous vehicles, voice assistants, unlocking your phone using face
    or fingerprints, fall detection for elderly care, and fraud detection. Being able
    to detect a fraudulent transaction that happened three hours ago is still better
    than not detecting it at all, but being able to detect it in real time can prevent
    the fraudulent transaction from going through.'
