  md: 'engineering effort. More and more companies are following a hybrid approach:
    keeping most of their workloads on the cloud but slowly increasing their investment
    in data centers.


    # On Multicloud Strategy


    Another way for companies to reduce their dependence on any single cloud provider
    is to follow a multicloud strategy: spreading their workloads on multiple cloud
    providers.20 This allows companies to architect their systems so that they can
    be compatible with multiple clouds, enabling them to leverage the best and most
    cost-effective technologies available instead of being stuck with the services
    provided by a single cloud provider, a situation known as vendor lock-in. A 2019
    study by Gartner shows that 81% of organizations are working with two or more
    public cloud providers.21 A common pattern that I’ve seen for ML workloads is
    to do training on GCP or Azure, and deployment on AWS.


    The multicloud strategy doesn’t usually happen by choice. As Josh Wills, one of
    our early reviewers, put it: “Nobody in their right mind intends to use multicloud.”
    It’s incredibly hard to move data and orchestrate workloads across clouds.


    Often, multicloud just happens because different parts of the organization operate
    independently, and each part makes their own cloud decision. It can also happen
    following an acquisition—the acquired team is already on a cloud different from
    the host organization, and migrating hasn’t happened yet.


    In my work, I’ve seen multicloud happen due to strategic investments. Microsoft
    and Google are big investors in the startup ecosystem, and several companies that
    I work with that were previously on AWS have moved to Azure/GCP after Microsoft/Google
    invested in them.


    # Development Environment


    The dev environment is where ML engineers write code, run experiments, and interact
    with the production environment where champion models are deployed and challenger
    models evaluated. The dev environment consists of the following components: IDE
    (integrated development environment), versioning, and CI/CD.


    If you’re a data scientist or ML engineer who writes code daily, you’re probably
    very familiar with all these tools and might wonder what there is to say about
    them. In my experience, outside of a handful of tech companies, the dev environment
    is severely


    20 Laurence Goasduff, “Why Organizations Choose a Multicloud Strategy,” Gartner,
    May 7, 2019, https://oreil.ly/ZiqQ.


    21 Goasduff, “Why Organizations Choose a Multicloud Strategy.”'
