    We’ll go over an example to give you the intuition of why ensembling works. Imagine
    you have three email spam classifiers, each with an accuracy of 70%. Assuming
    that each classifier has an equal probability of making a correct prediction for
    each email, and that these three classifiers are not correlated, we’ll show that
    by taking the majority vote of these three classifiers, we can get an accuracy
    of 78.4%.


    For each email, each classifier has a 70% chance of being correct. The ensemble
    will be correct if at least two classifiers are correct. Table 6-1 shows the probabilities
    of different possible outcomes of the ensemble given an email. This ensemble will
    have an accuracy of 0.343 + 0.441 = 0.784, or 78.4%.'
