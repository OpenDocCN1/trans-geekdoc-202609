- pgno: 232
  md: 'hardware backend. In the process, we’ll introduce important concepts that you
    might encounter when handling models on the edge, including intermediate representations
    (IRs) and compilers.


    # Compiling and Optimizing Models for Edge Devices


    For a model built with a certain framework, such as TensorFlow or PyTorch, to
    run on a hardware backend, that framework has to be supported by the hardware
    vendor. For example, even though TPUs were released publicly in February 2018,
    it wasn’t until September 2020 that PyTorch was supported on TPUs. Before then,
    if you wanted to use a TPU, you’d have to use a framework that TPUs supported.


    Providing support for a framework on a hardware backend is time-consuming and
    engineering-intensive. Mapping from ML workloads to a hardware backend requires
    understanding and taking advantage of that hardware’s design, and different hardware
    backends have different memory layouts and compute primitives, as shown in Figure
    7-11.


    ![](img/bde3d1ed5ea7825115c846be3467945f_232_0.png)


    Figure 7-11. Different compute primitives and memory layouts for CPU, GPU, and
    TPU. Source: Adapted from an image by Chen et al. 43


    43 Tianqi Chen, Thierry Moreau, Ziheng Jiang, Lianmin Zheng, Eddie Yan, Meghan
    Cowan, Haichen Shen, et al., “TVM: An Automated End-to-End Optimizing Compiler
    for Deep Learning,” arXiv, February 12, 2018, https://oreil.ly/vGnkW.'
