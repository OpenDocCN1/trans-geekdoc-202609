- pgno: 73
  md: 'Imagine we have a dataset of 1,000 examples, and each example has 10 features.
    If we consider each example as a row and each feature as a column, as is often
    the case in ML, then the row-major formats like CSV are better for accessing examples,
    e.g., accessing all the examples collected today. Column-major formats like Parquet
    are better for accessing features, e.g., accessing the timestamps of all your
    examples. See Figure 3-1.


    ![](img/bde3d1ed5ea7825115c846be3467945f_73_0.png)


    Figure 3-1. Row-major versus column-major formats


    Column-major formats allow flexible column-based reads, especially if your data
    is large with thousands, if not millions, of features. Consider if you have data
    about ride-sharing transactions that has 1,000 features but you only want 4 features:
    time, location, distance, price. With column-major formats, you can read the four
    columns corresponding to these four features directly. However, with row-major
    formats, if you don''t know the sizes of the rows, you will have to read in all
    columns then filter down to these four columns. Even if you know the sizes of
    the rows, it can still be slow as you''ll have to jump around the memory, unable
    to take advantage of caching.


    Row-major formats allow faster data writes. Consider the situation when you have
    to keep adding new individual examples to your data. For each individual example,
    it''d be much faster to write it to a file where your data is already in a row-major
    format.


    Overall, row-major formats are better when you have to do a lot of writes, whereas
    column-major ones are better when you have to do a lot of column-based reads.'
  merge: -1
  img_proc: true
