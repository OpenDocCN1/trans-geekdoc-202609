- pgno: 311
  md: '# Infrastructure and Tooling for MLOps


    In Chapters 4 to 6, we discussed the logic for developing ML systems. In Chapters
    7 to 9, we discussed the considerations for deploying, monitoring, and continually
    updating an ML system. Up until now, we’ve assumed that ML practitioners have
    access to all the tools and infrastructure they need to implement that logic and
    carry out these considerations. However, that assumption is far from being true.
    Many data scientists have told me that they know the right things to do for their
    ML systems, but they can’t do them because their infrastructure isn’t set up in
    a way that enables them to do so.


    ML systems are complex. The more complex a system, the more it can benefit from
    good infrastructure. Infrastructure, when set up right, can help automate processes,
    reducing the need for specialized knowledge and engineering time. This, in turn,
    can speed up the development and delivery of ML applications, reduce the surface
    area for bugs, and enable new use cases. When set up wrong, however, infrastructure
    is painful to use and expensive to replace. In this chapter, we’ll discuss how
    to set up infrastructure right for ML systems.


    Before we dive in, it’s important to note that every company’s infrastructure
    needs are different. The infrastructure required for you depends on the number
    of applications you develop and how specialized the applications are. At one end
    of the spectrum, you have companies that use ML for ad hoc business analytics
    such as to project the number of new users they’ll have next year to present at
    their quarterly planning meeting. These companies probably won’t need to invest
    in any infrastructure—Jupyter Notebooks, Python, and Pandas would be their best
    friends. If you have only one simple ML use case, such as an Android app for object
    detection to show your friends, you probably won’t need any infrastructure either—you
    just need an Android-compatible ML framework like TensorFlow Lite.'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'At the other end of the spectrum, there are companies that work on applications
    with unique requirements. For example, self-driving cars have unique accuracy
    and latency requirements—the algorithm must be able to respond within milliseconds
    and its accuracy must be near-perfect since a wrong prediction can lead to serious
    accidents. Similarly, Google Search has a unique scale requirement since most
    companies don’t process 63,000 search queries a second, which translates to 234
    million search queries an hour, like Google does.¹ These companies will likely
    need to develop their own highly specialized infrastructure. Google developed
    a large part of their internal infrastructure for search; so did self-driving
    car companies like Tesla and Waymo.² It’s common that part of specialized infrastructure
    is later made public and adopted by other companies. For example, Google extended
    their internal cloud infrastructure to the public, resulting in Google Cloud Platform.


    In the middle of the spectrum are the majority of companies, those who use ML
    for multiple common applications—a fraud detection model, a price optimization
    model, a churn prediction model, a recommender system, etc.—at reasonable scale.
    “Reasonable scale” refers to companies that work with data in the order of gigabytes
    and terabytes, instead of petabytes, a day. Their data science team might range
    from 10 to hundreds of engineers.³ This category might include any company from
    a 20-person startup to a company at Zillow’s scale, but not at FAAAM scale.⁴ For
    example, back in 2018, Uber was adding tens of terabytes of data a day to their
    data lake, and Zillow’s biggest dataset was bringing in 2 terabytes of uncompressed
    data a day.⁵ In contrast, even back in 2014, Facebook was generating 4 petabytes
    of data a day.⁶


    +   1. Kunal Shah, “This Is What Makes SEO Important for Every Business,” Entrepreneur
    India, May 11, 2020, https://oreil.ly/teQlX.

    +   2. For a sneak peek into Tesla’s compute infrastructure for ML, I highly recommend
    watching the recording of Tesla AI Day 2021 on YouTube.

    +   3. The definition for “reasonable scale” was inspired by Jacopo Tagliabue
    in his paper “You Do Not Need a Bigger Boat: Recommendations at Reasonable Scale
    in a (Mostly) Serverless and Open Stack,” arXiv, July 15, 2021, https://oreil.ly/YNRZQ.
    For more discussion on reasonable scale, see “ML and MLOps at a Reasonable Scale”
    by Ciro Greco (October 2021).

    +   4. FAAAM is short for Facebook, Apple, Amazon, Alphabet, Microsoft.

    +   5. Reza Shiftehfar, “Uber’s Big Data Platform: 100+ Petabytes with Minute
    Latency,” Uber Engineering, October 17, 2018, https://oreil.ly/6Ykd3; Kaushik
    Krishnamurthi, “Building a Big Data Pipeline to Process Clickstream Data,” Zillow,
    April 6, 2018, https://oreil.ly/SGmNe.

    +   6. Nathan Bronson and Janet Wiener, “Facebook’s Top Open Data Problems,” Meta,
    October 21, 2014, https://oreil.ly/p6QjX.'
