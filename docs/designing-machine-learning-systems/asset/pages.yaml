- pgno: 228
  md: 'Quantization not only reduces memory footprint but also improves the computation
    speed. First, it allows us to increase our batch size. Second, less precision
    speeds up computation, which further reduces training time and inference latency.
    Consider the addition of two numbers. If we perform the addition bit by bit, and
    each takes x nanoseconds, it''ll take 32x nanoseconds for 32-bit numbers but only
    16x nanoseconds for 16-bit numbers.


    There are downsides to quantization. Reducing the number of bits to represent
    your numbers means that you can represent a smaller range of values. For values
    outside that range, you''ll have to round them up and/or scale them to be in range.
    Rounding numbers leads to rounding errors, and small rounding errors can lead
    to big performance changes. You also run the risk of rounding/scaling your numbers
    to under-/overflow and rendering it to 0. Efficient rounding and scaling is nontrivial
    to implement at a low level, but luckily, major frameworks have this built in.


    Quantization can either happen during training (quantization aware training),32
    where models are trained in lower precision, or post-training, where models are
    trained in single-precision floating point and then quantized for inference. Using
    quantization during training means that you can use less memory for each parameter,
    which allows you to train larger models on the same hardware.


    Recently, low-precision training has become increasingly popular, with support
    from most modern training hardware. NVIDIA introduced Tensor Cores, processing
    units that support mixed-precision training.33 Google TPUs (tensor processing
    units) also support training with Bfloat16 (16-bit Brain Floating Point Format),
    which the company dubbed “the secret to high performance on Cloud TPUs.”34 Training
    in fixed-point is not yet as popular but has had a lot of promising results.35


    Fixed-point inference has become a standard in the industry. Some edge devices
    only support fixed-point inference. Most popular frameworks for on-device ML inference—Google’s
    TensorFlow Lite, Facebook’s PyTorch Mobile, NVIDIA’s TensorRT—offer post-training
    quantization for free with a few lines of code.


    32 As of October 2020, TensorFlow''s quantization aware training doesn''t actually
    train models with weights in lower bits, but collects statistics to use for post-training
    quantization.


    33 Chip Huyen, Igor Gitman, Oleksii Kuchaiev, Boris Ginsburg, Vitaly Lavrukhin,
    Jason Li, Vahid Noroozi, and Ravi Gadde, “Mixed Precision Training for NLP and
    Speech Recognition with OpenSeq2Seq,” NVIDIA Devblogs, October 9, 2018, https://oreil.ly/WDTl1.
    It''s my post!


    34 Shibo Wang and Pankaj Kanwar, “BFloat16: The Secret to High Performance on
    Cloud TPUs,” Google Cloud Blog, August 23, 2019, https://oreil.ly/ZG5p0.


    35 Itay Hubara, Matthieu Courbariaux, Daniel Soudry, Ran El-Yaniv, and Yoshua
    Bengio, “Quantized Neural Networks: Training Neural Networks with Low Precision
    Weights and Activations,” Journal of Machine Learning Research 18 (2018): 1–30;
    Benoit Jacob, Skirmantas Kligys, Bo Chen, Menglong Zhu, Matthew Tang, Andrew Howard,
    Hartwig Adam, and Dmitry Kalenichenko, “Quantization and Training of Neural Networks
    for Efficient Integer-Arithmetic-Only Inference,” arXiv, December 15, 2017, https://oreil.ly/sUuMT.'
