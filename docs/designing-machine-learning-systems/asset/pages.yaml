- pgno: 344
  md: 'transformation, and feature consistency. A feature store solution might address
    one or a combination of these problems:


    # Feature management


    A company might have multiple ML models, each model using a lot of features. Back
    in 2017, Uber had about 10,000 features across teams!31 It''s often the case that
    features used for one model can be useful for another model. For example, team
    A might have a model to predict how likely a user will churn, and team B has a
    model to predict how likely a free user will convert into a paid user. There are
    many features that these two models can share. If team A discovers that feature
    X is super useful, team B might be able to leverage that too.


    A feature store can help teams share and discover features, as well as manage
    roles and sharing settings for each feature. For example, you might not want everyone
    in the company to have access to sensitive financial information of either the
    company or its users. In this capacity, a feature store can be thought of as a
    feature catalog. Examples of tools for feature management are Amundsen (developed
    at Lyft) and DataHub (developed at LinkedIn).


    # Feature computation32


    Feature engineering logic, after being defined, needs to be computed. For example,
    the feature logic might be: use the average meal preparation time from yesterday.
    The computation part involves actually looking into your data and computing this
    average.


    In the previous point, we discussed how multiple models might share a feature.
    If the computation of this feature isn''t too expensive, it might be acceptable
    computing this feature each time it is required by a model. However, if the computation
    is expensive, you might want to execute it only once the first time it is required,
    then store it for feature uses.


    A feature store can help with both performing feature computation and storing
    the results of this computation. In this capacity, a feature store acts like a
    data warehouse.


    # Feature consistency


    In Chapter 7, we talked about the problem of having two separate pipelines for
    the same model: the training pipeline extracts batch features from historical
    data and the inference pipeline extracts streaming features. During development,
    data scientists might define features and create models using Python. Production'
