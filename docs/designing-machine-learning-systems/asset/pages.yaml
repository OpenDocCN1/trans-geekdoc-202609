  md: 'wrong model version, or bugs in the app interface that force users to change
    their behaviors.


    Since this is an error mode that affects almost all ML models, we’ll cover this
    in detail in the section “Data Distribution Shifts” on page 237.


    # Edge cases


    Imagine there existed a self-driving car that can drive you safely 99.99% of the
    time, but the other 0.01% of the time, it might get into a catastrophic accident
    that can leave you permanently injured or even dead.¹⁰ Would you use that car?


    If you’re tempted to say no, you’re not alone. An ML model that performs well
    on most cases but fails on a small number of cases might not be usable if these
    failures cause catastrophic consequences. For this reason, major self-driving
    car companies are focusing on making their systems work on edge cases.¹¹


    Edge cases are the data samples so extreme that they cause the model to make catastrophic
    mistakes. Even though edge cases generally refer to data samples drawn from the
    same distribution, if there is a sudden increase in the number of data samples
    in which your model doesn’t perform well, it could be an indication that the underlying
    data distribution has shifted.


    Autonomous vehicles are often used to illustrate how edge cases can prevent an
    ML system from being deployed. But this is also true for any safety-critical application
    such as medical diagnosis, traffic control, e-discovery,¹² etc. It can also be
    true for non-safety-critical applications. Imagine a customer service chatbot
    that gives reasonable responses to most of the requests, but sometimes, it spits
    out outrageously racist or sexist content. This chatbot will be a brand risk for
    any company that wants to use it, thus rendering it unusable.


    10 This means the self-driving car is a bit safer than an average human driver.
    As of 2019, the ratio of traffic-related fatalities per 100,000 licensed drivers
    was 15.8, or 0.0158% (“Fatality Rate per 100,000 Licensed Drivers in the U.S.
    from 1990 to 2019,” Statista, 2021, https://oreil.ly/w3wYh).


    11 Rodney Brooks, “Edge Cases for Self Driving Cars,” Robots, AI, and Other Stuff,
    June 17, 2017, https://oreil.ly/Nyp4F; Lance Eliot, “Whether Those Endless Edge
    or Corner Cases Are the Long-Tail Doom for AI Self-Driving Cars,” Forbes, July
    13, 2021, https://oreil.ly/L2Sbp; Kevin McAllister, “Self-Driving Cars Will Be
    Shaped by Simulated, Location Data,” Protocol, March 25, 2021, https://oreil.ly/tu8hs.


    12 e-discovery, or electronic discovery, refers to discovery in legal proceedings,
    such as litigation, government investigations, or Freedom of Information Act requests,
    where the information sought is in electronic format.'
