- pgno: 154
  md: 'In some other cases, models were “found to be picking up on the text font that
    certain hospitals used to label the scans. As a result, fonts from hospitals with
    more serious caseloads became predictors of covid risk.”12


    Both of these are examples of data leakage. Data leakage refers to the phenomenon
    when a form of the label “leaks” into the set of features used for making predictions,
    and this same information is not available during inference.


    Data leakage is challenging because often the leakage is nonobvious. It’s dangerous
    because it can cause your models to fail in an unexpected and spectacular way,
    even after extensive evaluation and testing. Let’s go over another example to
    demonstrate what data leakage is.


    Suppose you want to build an ML model to predict whether a CT scan of a lung shows
    signs of cancer. You obtained the data from hospital A, removed the doctors’ diagnosis
    from the data, and trained your model. It did really well on the test data from
    hospital A, but poorly on the data from hospital B.


    After extensive investigation, you learned that at hospital A, when doctors think
    that a patient has lung cancer, they send that patient to a more advanced scan
    machine, which outputs slightly different CT scan images. Your model learned to
    rely on the information on the scan machine used to make predictions on whether
    a scan image shows signs of lung cancer. Hospital B sends the patients to different
    CT scan machines at random, so your model has no information to rely on. We say
    that labels are leaked into the features during training.


    Data leakage can happen not only with newcomers to the field, but has also happened
    to several experienced researchers whose work I admire, and in one of my own projects.
    Despite its prevalence, data leakage is rarely covered in ML curricula.


    # Cautionary Tale: Data Leakage with Kaggle Competition


    In 2020, the University of Liverpool launched an Ion Switching competition on
    Kaggle. The task was to identify the number of ion channels open at each time
    point. They synthesized test data from training data, and some people were able
    to reverse engineer and obtain test labels from the leak.13 The two winning teams
    in this competition are the two teams that were able to exploit the leak, though
    they might have still been able to win without exploiting the leak.14


    12 Will Douglas Heaven, “Hundreds of AI Tools Have Been Built to Catch Covid.
    None of Them Helped,” MIT Technology Review, July 30, 2021, https://oreil.ly/lg1b1.


    13 Zidmie, “The leak explained!” Kaggle, https://oreil.ly/1lgLj.


    14 Addison Howard, “Competition Recap—Congratulations to our Winners!” Kaggle,
    https://oreil.ly/wVUU4.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Common Causes for Data Leakage


    In this section, we’ll go over some common causes for data leakage and how to
    avoid them.


    # Splitting time-correlated data randomly instead of by time


    When I learned ML in college, I was taught to randomly split my data into train,
    validation, and test splits. This is also how data is often reportedly split in
    ML research papers. However, this is also one common cause for data leakage.


    In many cases, data is time-correlated, which means that the time the data is
    generated affects its label distribution. Sometimes, the correlation is obvious,
    as in the case of stock prices. To oversimplify it, the prices of similar stocks
    tend to move together. If 90% of the tech stocks go down today, it’s very likely
    the other 10% of the tech stocks go down too. When building models to predict
    the future stock prices, you want to split your training data by time, such as
    training your model on data from the first six days and evaluating it on data
    from the seventh day. If you randomly split your data, prices from the seventh
    day will be included in your train split and leak into your model the condition
    of the market on that day. We say that the information from the future is leaked
    into the training process.


    However, in many cases, the correlation is nonobvious. Consider the task of predicting
    whether someone will click on a song recommendation. Whether someone will listen
    to a song depends not only on their music taste but also on the general music
    trend that day. If an artist passes away one day, people will be much more likely
    to listen to that artist. By including samples from a certain day in the train
    split, information about the music trend that day will be passed into your model,
    making it easier for it to make predictions on other samples on that same day.


    To prevent future information from leaking into the training process and allowing
    models to cheat during evaluation, split your data by time, instead of splitting
    randomly, whenever possible. For example, if you have data from five weeks, use
    the first four weeks for the train split, then randomly split week 5 into validation
    and test splits as shown in Figure 5-7.'
