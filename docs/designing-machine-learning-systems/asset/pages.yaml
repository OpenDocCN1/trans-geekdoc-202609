    | Regressor Uncertainty | ✓ | ✓ | ✓ | ✓ | ✓ |  |  |


    Figure 8-2. Some drift detection algorithms implemented by Alibi Detect. Source:
    Screenshot of the project''s GitHub repository


    # Time scale windows for detecting shifts


    Not all types of shifts are equal—some are harder to detect than others. For example,
    shifts happen at different rates, and abrupt changes are easier to detect than
    slow, gradual changes.37 Shifts can also happen across two dimensions: spatial
    or temporal. Spatial shifts are shifts that happen across access points, such
    as your application gets a new group of users or your application is now served
    on a different type of device. Temporal shifts are shifts that happen over time.
    To detect temporal shifts, a common approach is to treat input data to ML applications
    as time-series data.38


    37 Manuel Baena-García, José del Campo-Ávila, Raúl Fidalgo, Albert Bifet, Ricard
    Gavaldà, and Rafael Morales-Bueno, “Early Drift Detection Method,” 2006, https://oreil.ly/Dnv0s.


    38 Nandini Ramanan, Rasool Tahmasbi, Marjorie Sayer, Deokwoo Jung, Shalini Hemachandran,
    and Clau-dionor Nunes Coelho Jr., “Real-time Drift Detection on Time-series Data,”
    arXiv, October 12, 2021, https://oreil.ly/xmdqW.'
