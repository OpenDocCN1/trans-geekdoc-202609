  md: '# Enterprise spending on cloud and data centers


    ![](img/bde3d1ed5ea7825115c846be3467945f_319_0.png)


    Figure 10-4. In 2020, enterprise spending on cloud infrastructure services grew
    by 35% while spending on data centers dropped by 6%. Source: Adapted from an image
    by Synergy Research Group


    While leveraging the cloud tends to give companies higher returns than building
    their own storage and compute layers early on, this becomes less defensible as
    a company grows. Based on disclosed cloud infrastructure spending by public software
    companies, the venture capital firm a16z shows that cloud spending accounts for
    approximately 50% cost of revenue of these companies.18


    The high cost of the cloud has prompted companies to start moving their workloads
    back to their own data centers, a process called “cloud repatriation.” Dropbox’s
    S-1 filing in 2018 shows that the company was able to save $75M over the two years
    prior to IPO due to their infrastructure optimization overhaul—a large chunk of
    it consisted of moving their workloads from public cloud to their own data centers.
    Is the high cost of cloud unique to Dropbox because Dropbox is in the data storage
    business? Not quite. In the aforementioned analysis, a16z estimated that “across
    50 of the top public software companies currently utilizing cloud infrastructure,
    an estimated $100B of market value is being lost among them due to cloud impact
    on margins—relative to running the infrastructure themselves.”19


    While getting started with the cloud is easy, moving away from the cloud is hard.
    Cloud repatriation requires nontrivial up-front investment in both commodities
    and


    18 Sarah Wang and Martin Casado, “The Cost of Cloud, a Trillion Dollar Paradox,”
    a16z, https://oreil.ly/3nWU3.


    19 Wang and Casado, “The Cost of Cloud.”'
  merge: -1
  img_proc: true
