    cores, which varies according to instance type. For example, an m5.xlarge instance
    type has two CPU cores and two threads per core by default—four vCPUs in total”
    (“Optimize CPU Options,” Amazon Web Services, last accessed April 2020, https://oreil.ly/eeOtd).'
