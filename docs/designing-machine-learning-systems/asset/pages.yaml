- pgno: 184
  md: 'Here are some of the things that might cause an ML model to fail:


    # *Theoretical constraints*


    As discussed previously, each model comes with its own assumptions about the data
    and the features it uses. A model might fail because the data it learns from doesn''t
    conform to its assumptions. For example, you use a linear model for the data whose
    decision boundaries aren''t linear.


    # *Poor implementation of model*


    The model might be a good fit for the data, but the bugs are in the implementation
    of the model. For example, if you use PyTorch, you might have forgotten to stop
    gradient updates during evaluation when you should. The more components a model
    has, the more things that can go wrong, and the harder it is to figure out which
    goes wrong. However, with models being increasingly commoditized and more and
    more companies using off-the-shelf models, this is becoming less of a problem.


    # *Poor choice of hyperparameters*


    With the same model, one set of hyperparameters can give you the state-of-the-art
    result but another set of hyperparameters might cause the model to never converge.
    The model is a great fit for your data, and its implementation is correct, but
    a poor set of hyperparameters might render your model useless.


    # *Data problems*


    There are many things that could go wrong in data collection and preprocessing
    that might cause your models to perform poorly, such as data samples and labels
    being incorrectly paired, noisy labels, features normalized using outdated statistics,
    and more.


    # *Poor choice of features*


    There might be many possible features for your models to learn from. Too many
    features might cause your models to overfit to the training data or cause data
    leakage. Too few features might lack predictive power to allow your models to
    make good predictions.


    Debugging should be both preventive and curative. You should have healthy practices
    to minimize the opportunities for bugs to proliferate as well as a procedure for
    detecting, locating, and fixing bugs. Having the discipline to follow both the
    best practices and the debugging procedure is crucial in developing, implementing,
    and deploying ML models.'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'There is, unfortunately, still no scientific approach to debugging in ML. However,
    there have been a number of tried-and-true debugging techniques published by experienced
    ML engineers and researchers. The following are three of them. Readers interested
    in learning more might want to check out Andrej Karpathy’s awesome post “A Recipe
    for Training Neural Networks”.


    # *Start simple and gradually add more components*


    Start with the simplest model and then slowly add more components to see if it
    helps or hurts the performance. For example, if you want to build a recurrent
    neural network (RNN), start with just one level of RNN cell before stacking multiple
    together or adding more regularization. If you want to use a BERT-like model (Devlin
    et al. 2018), which uses both a masked language model (MLM) and next sentence
    prediction (NSP) loss, you might want to use only the MLM loss before adding NSP
    loss.


    Currently, many people start out by cloning an open source implementation of a
    state-of-the-art model and plugging in their own data. On the off-chance that
    it works, it’s great. But if it doesn’t, it’s very hard to debug the system because
    the problem could have been caused by any of the many components in the model.


    # *Overfit a single batch*


    After you have a simple implementation of your model, try to overfit a small amount
    of training data and run evaluation on the same data to make sure that it gets
    to the smallest possible loss. If it’s for image recognition, overfit on 10 images
    and see if you can get the accuracy to be 100%, or if it’s for machine translation,
    overfit on 100 sentence pairs and see if you can get to a BLEU score of near 100.
    If it can’t overfit a small amount of data, there might be something wrong with
    your implementation.


    # *Set a random seed*


    There are so many factors that contribute to the randomness of your model: weight
    initialization, dropout, data shuffling, etc. Randomness makes it hard to compare
    results across different experiments—you have no idea if the change in performance
    is due to a change in the model or a different random seed. Setting a random seed
    ensures consistency between different runs. It also allows you to reproduce errors
    and other people to reproduce your results.'
  merge: -1
  img_proc: true
