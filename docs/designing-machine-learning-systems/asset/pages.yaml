  md: 'F1, precision, and recall are metrics that measure your model’s performance
    with respect to the positive class in binary classification problems, as they
    rely on true positive—an outcome where the model correctly predicts the positive
    class.[35]


    # Precision, Recall, and F1


    For readers needing a refresh, precision, recall, and F1 scores, for binary tasks,
    are calculated using the count of true positives, true negatives, false positives,
    and false negatives. Definitions for these terms are shown in Table 4-6.


    *Table 4-6. Definitions of True Positive, False Positive, False Negative, and
    True Negative in a binary classification task*


    |  | Predicted Positive | Predicted Negative |

    |---|---|---|

    | Positive label | True Positive (hit) | False Negative (type II error, miss)
    |

    | Negative label | False Positive (type I error, false alarm) | True Negative
    (correct rejection) |


    Precision = True Positive / (True Positive + False Positive)


    Recall = True Positive / (True Positive + False Negative)


    F1 = 2 × Precision × Recall / (Precision + Recall)


    F1, precision, and recall are asymmetric metrics, which means that their values
    change depending on which class is considered the positive class. In our case,
    if we consider CANCER the positive class, model A’s F1 is 0.17. However, if we
    consider NORMAL the positive class, model A’s F1 is 0.95. Accuracy, precision,
    recall, and F1 scores of model A and model B when CANCER is the positive class
    are shown in Table 4-7.


    *Table 4-7. Both models have the same accuracy even though one model is clearly
    superior*


    |  | CANCER (1) | NORMAL (0) | Accuracy | Precision | Recall | F1 |

    |---|---:|---:|---:|---:|---:|---:|

    | Model A | 10/100 | 890/900 | 0.9 | 0.5 | 0.1 | 0.17 |

    | Model B | 90/100 | 810/900 | 0.9 | 0.5 | 0.9 | 0.64 |


    Many classification problems can be modeled as regression problems. Your model
    can output a probability, and based on that probability, you classify the sample.
    For example, if the value is greater than 0.5, it’s a positive label, and if it’s
    less than or


    [35] As of July 2021, when you use `scikit-learn.metrics.f1_score`, `pos_label`
    is set to 1 by default, but you can change it to 0 if you want 0 to be your positive
    label.'
