  md: '![](img/bde3d1ed5ea7825115c846be3467945f_93_0.png)


    Figure 3-8. In the request-driven architecture, each service needs to send requests
    to two other services


    With only three services, data passing is already getting complicated. Imagine
    having hundreds, if not thousands of services like what major internet companies
    have. Interservice data passing can blow up and become a bottleneck, slowing down
    the entire system.


    Request-driven data passing is synchronous: the target service has to listen to
    the request for the request to go through. If the price optimization service requests
    data from the driver management service and the driver management service is down,
    the price optimization service will keep resending the request until it times
    out. And if the price optimization service is down before it receives a response,
    the response will be lost. A service that is down can cause all services that
    require data from it to be down.


    What if there''s a broker that coordinates data passing among services? Instead
    of having services request data directly from each other and creating a web of
    complex interservice data passing, each service only has to communicate with the
    broker, as shown in Figure 3-9. For example, instead of having other services
    request the driver management services for the predicted number of drivers for
    the next minute, what if whenever the driver management service makes a prediction,
    this prediction is broadcast to a broker? Whichever service wants data from the
    driver management service can check that broker for the most recent predicted
    number of drivers. Similarly, whenever the price optimization service makes a
    prediction about the surge charge for the next minute, this prediction is broadcast
    to the broker.'
