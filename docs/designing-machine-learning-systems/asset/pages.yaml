  md: '# Training Data


    In Chapter 3, we covered how to handle data from the systems perspective. In this
    chapter, we’ll go over how to handle data from the data science perspective. Despite
    the importance of training data in developing and improving ML models, ML curricula
    are heavily skewed toward modeling, which is considered by many practitioners
    the “fun” part of the process. Building a state-of-the-art model is interesting.
    Spending days wrangling with a massive amount of malformatted data that doesn’t
    even fit into your machine’s memory is frustrating.


    Data is messy, complex, unpredictable, and potentially treacherous. If not handled
    properly, it can easily sink your entire ML operation. But this is precisely the
    reason why data scientists and ML engineers should learn how to handle data well,
    saving us time and headache down the road.


    In this chapter, we will go over techniques to obtain or create good training
    data. Training data, in this chapter, encompasses all the data used in the developing
    phase of ML models, including the different splits used for training, validation,
    and testing (the train, validation, test splits). This chapter starts with different
    sampling techniques to select data for training. We’ll then address common challenges
    in creating training data, including the label multiplicity problem, the lack
    of labels problem, the class imbalance problem, and techniques in data augmentation
    to address the lack of data problem.


    We use the term “training data” instead of “training dataset” because “dataset”
    denotes a set that is finite and stationary. Data in production is neither finite
    nor stationary, a phenomenon that we will cover in the section “Data Distribution
    Shifts” on page 237. Like other steps in building ML systems, creating training
    data is an iterative process. As your model evolves through a project lifecycle,
    your training data will likely also evolve.'
