  md: '5% of the time, your estimated number of clicks will be way off. If you have
    another model that gives the same ranking but is better calibrated, you might
    want to consider the better calibrated one.


    To measure a model''s calibration, a simple method is counting: you count the
    number of times your model outputs the probability X and the frequency Y of that
    prediction coming true, and plot X against Y. The graph for a perfectly calibrated
    model will have X equal Y at all data points. In scikit-learn, you can plot the
    calibration curve of a binary classifier with the method sklearn.calibration.calibration_curve,
    as shown in Figure 6-11.


    ![](img/bde3d1ed5ea7825115c846be3467945f_202_0.png)


    Figure 6-11. The calibration curves of different models on a toy task. The logistic
    regression model is the best calibrated model because it directly optimizes logistic
    loss. Source: scikit-learn


    To calibrate your models, a common method is Platt scaling, which is implemented
    in scikit-learn with sklearn.calibration.CalibratedClassifierCV. Another good
    open source implementation by Geoff Pleiss can be found on GitHub. For readers
    who want to learn more about the importance of model calibration and how to calibrate
    neural networks, Lee Richardson and Taylor Pospisil have an excellent blog post
    based on their work at Google.'
