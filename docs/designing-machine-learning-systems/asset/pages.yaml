- pgno: 296
  md: 'So in this stage, you reconfigure your automatic updating script so that, when
    the model update is kicked off, it first locates the previous checkpoint and loads
    it into memory before continuing training on this checkpoint.


    **Requirements.** The main thing you need in this stage is a change in the mindset:
    retraining from scratch is such a norm—many companies are so used to data scientists
    handing off a model to engineers to deploy from scratch each time—that many companies
    don’t think about setting up their infrastructure to enable stateful training.


    Once you’re committed to stateful training, reconfiguring the updating script
    is straightforward. The main thing you need at this stage is a way to track your
    data and model lineage. Imagine you first upload model version 1.0. This model
    is updated with new data to create model version 1.1, and so on to create model
    1.2. Then another model is uploaded and called model version 2.0. This model is
    updated with new data to create model version 2.1. After a while, you might have
    model version 3.32, model version 2.11, model version 1.64. You might want to
    know how these models evolve over time, which model was used as its base model,
    and which data was used to update it so that you can reproduce and debug it. As
    far as I know, no existing model store has this model lineage capacity, so you’ll
    likely have to build the solution in-house.


    If you want to pull fresh data from the real-time transports instead of from data
    warehouses, as discussed in the section [“Fresh data access challenge” on page
    270], and your streaming infrastructure isn’t mature enough, you might need to
    revamp your streaming pipeline.


    # Stage 4: Continual learning


    At stage 3, your models are still updated based on a fixed schedule set out by
    developers. Finding the optimal schedule isn’t straightforward and can be situation-dependent.
    For example, last week, nothing much happened in the market, so your models didn’t
    decay that fast. However, this week, a lot of events happen, so your models decay
    much faster and require a much faster retraining schedule.


    Instead of relying on a fixed schedule, you might want your models to be automatically
    updated whenever data distributions shift and the model’s performance plummets.


    The holy grail is when you combine continual learning with edge deployment. Imagine
    you can ship a base model with a new device—a phone, a watch, a drone, etc.—and
    the model on that device will continually update and adapt to its environment
    as needed without having to sync with a centralized server. There will be no need
    for a centralized server, which means no centralized server cost. There will also
    be no need to transfer data back and forth between device and cloud, which means
    better data security and privacy!'
  merge: -1
  img_proc: true
- pgno: 297
  md: '**Requirements.** The move from stage 3 to stage 4 is steep. You''ll first
    need a mechanism to trigger model updates. This trigger can be:


    +   *Time-based*

    +       For example, every five minutes

    +   *Performance-based*

    +       For example, whenever model performance plummets

    +   *Volume-based*

    +       For example, whenever the total amount of labeled data increases by 5%

    +   *Drift-based*

    +       For example, whenever a major data distribution shift is detected


    For this trigger mechanism to work, you''ll need a solid monitoring solution.
    We discussed in the section “Monitoring and Observability” on page 250 that the
    hard part is not to detect the changes, but to determine which of these changes
    matter. If your monitoring solution gives a lot of false alerts, your model will
    end up being updated much more frequently than it needs to be.


    You''ll also need a solid pipeline to continually evaluate your model updates.
    Writing a function to update your models isn''t much different from what you''d
    do in stage 3. The hard part is to ensure that the updated model is working properly.
    We''ll go over various testing techniques you can use in the section “Test in
    Production” on page 281.


    # How Often to Update Your Models


    Now that your infrastructure has been set up to update a model quickly, you started
    asking the question that has been haunting ML engineers at companies of all shapes
    and sizes: “How often should I update my models?” Before attempting to answer
    that question, we first need to figure out how much gain your model will get from
    being updated with fresh data. The more gain your model can get from fresher data,
    the more frequently it should be retrained.


    # Value of data freshness


    The question of how often to update a model becomes a lot easier if we know how
    much the model performance will improve with updating. For example, if we switch
    from retraining our model every month to every week, how much performance gain
    can we get? What if we switch to daily retraining? People keep saying that data
    distributions shift, so fresher data is better, but how much better is fresher
    data?'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'One way to figure out the gain is by training your model on the data from different
    time windows in the past and evaluating it on the data from today to see how the
    performance changes. For example, consider that you have data from the year 2020.
    To measure the value of data freshness, you can experiment with training model
    version A on the data from January to June 2020, model version B on the data from
    April to September, and model version C on the data from June to November, then
    test each of these model versions on the data from December, as shown in Figure
    9-5. The difference in the performance of these versions will give you a sense
    of the performance gain your model can get from fresher data. If the model trained
    on data from a quarter ago is much worse than the model trained on data from a
    month ago, you know that you shouldn''t wait a quarter to retrain your model.


    ![](img/bde3d1ed5ea7825115c846be3467945f_298_0.png)


    Figure 9-5. To get a sense of the performance gain you can get from fresher data,
    train your model on data from different time windows in the past and test on data
    from today to see how the performance changes


    This is a simple example to illustrate how the data freshness experiment works.
    In practice, you might want your experiments to be much more fine-grained, operating
    not in months but in weeks, days, even hours or minutes. In 2014, Facebook did
    a similar experiment for ad click-through-rate prediction and found out that they
    could reduce the model''s loss by 1% by going from retraining weekly to retraining
    daily, and this performance gain was significant enough for them to switch their
    retraining pipeline from weekly to daily.25 Given that online contents today are
    so much more diverse and users'' attention online changes much faster, we can
    imagine that the value of data freshness for ad click-through rate is even higher.
    Some of the companies with sophisticated ML infrastructure have found enough performance
    gain to switch their retraining pipeline to every few minutes.26


    25 Xinran He, Junfeng Pan, Ou Jin, Tianbing Xu, Bo Liu, Tao Xu, Tanxin Shi, et
    al., Practical Lessons from Predicting Clicks on Ads at Facebook, in ADKDD ''14:
    Proceedings of the Eighth International Workshop on Data Mining for Online Advertising
    (August 2014): 1-9, https://oreil.ly/oS16J.


    26 Qian Yu, Machine Learning with Flink in Weibo, QCon 2019, video, 17:57, https://oreil.ly/Yia6v.'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Model iteration versus data iteration


    We discussed earlier in this chapter that not all model updates are the same.
    We differentiated between model iteration (adding a new feature to an existing
    model architecture or changing the model architecture) and data iteration (same
    model architecture and features but you refresh this model with new data). You
    might wonder not only how often to update your model, but also what kind of model
    updates to perform.


    In theory, you can do both types of updates, and in practice, you should do both
    from time to time. However, the more resources you spend in one approach, the
    fewer resources you can spend in another.


    On the one hand, if you find that iterating on your data doesn’t give you much
    performance gain, then you should spend your resources on finding a better model.
    On the other hand, if finding a better model architecture requires 100X compute
    for training and gives you 1% performance whereas updating the same model on data
    from the last three hours requires only 1X compute and also gives 1% performance
    gain, you’ll be better off iterating on data.


    Maybe in the near future, we’ll get more theoretical understanding to know in
    what situation an approach will work better (cue “call for research”), but as
    of today, no book can give you the answer on which approach will work better for
    your specific model on your specific task. You’ll have to do experiments to find
    out.


    The question on how often to update your model is a difficult one to answer, and
    I hope that this section has sufficiently explained its nuances. In the beginning,
    when your infrastructure is nascent and the process of updating a model is manual
    and slow, the answer is: as often as you can.


    However, as your infrastructure matures and the process of updating a model is
    partially automated and can be done in a matter of hours, if not minutes, the
    answer to this question is contingent on the answer to the following question:
    “How much performance gain would I get from fresher data?” It’s important to run
    experiments to quantify the value of data freshness to your models.


    # Test in Production


    Throughout this book, including this chapter, we’ve talked about the danger of
    deploying models that haven’t been sufficiently evaluated. To sufficiently evaluate
    your models, you first need a mixture of offline evaluation discussed in Chapter
    6 and online evaluation discussed in this section. To understand why offline evaluation
    isn’t enough, let’s go over two major test types for offline evaluation: test
    splits and backtests.'
