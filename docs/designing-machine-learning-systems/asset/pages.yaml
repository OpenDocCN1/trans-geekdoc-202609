- pgno: 231
  md: 'Second, when your models are already on consumers’ devices, you can worry less
    about network latency. Requiring data transfer over the network (sending data
    to the model on the cloud to make predictions then sending predictions back to
    the users) might make some use cases impossible. In many cases, network latency
    is a bigger bottleneck than inference latency. For example, you might be able
    to reduce the inference latency of ResNet-50 from 30 ms to 20 ms, but the network
    latency can go up to seconds, depending on where you are and what services you’re
    trying to use.


    Putting your models on the edge is also appealing when handling sensitive user
    data. ML on the cloud means that your systems might have to send user data over
    networks, making it susceptible to being intercepted. Cloud computing also often
    means storing data of many users in the same place, which means a breach can affect
    many people. “Nearly 80% of companies experienced a cloud data breach in [the]
    past 18 months,” according to Security magazine.40


    Edge computing makes it easier to comply with regulations, like GDPR, about how
    user data can be transferred or stored. While edge computing might reduce privacy
    concerns, it doesn’t eliminate them altogether. In some cases, edge computing
    might make it easier for attackers to steal user data, such as they can just take
    the device with them.


    To move computation to the edge, the edge devices have to be powerful enough to
    handle the computation, have enough memory to store ML models and load them into
    memory, as well as have enough battery or be connected to an energy source to
    power the application for a reasonable amount of time. Running a full-sized BERT
    on your phone, if your phone is capable of running BERT, is a very quick way to
    kill its battery.


    Because of the many benefits that edge computing has over cloud computing, companies
    are in a race to develop edge devices optimized for different ML use cases. Established
    companies including Google, Apple, and Tesla have all announced their plans to
    make their own chips. Meanwhile, ML hardware startups have raised billions of
    dollars to develop better AI chips.41 It’s projected that by 2025 the number of
    active edge devices worldwide will be over 30 billion.42


    With so many new offerings for hardware to run ML models on, one question arises:
    how do we make our model run on arbitrary hardware efficiently? In the following
    section, we’ll discuss how to compile and optimize a model to run it on a certain


    40 “Nearly 80% of Companies Experienced a Cloud Data Breach in Past 18 Months,”
    Security, June 5, 2020, https://oreil.ly/gA1am.


    41 See slide #53, CS 329S’s Lecture 8: Deployment - Prediction Service, 2022,
    https://oreil.ly/cXTou.


    42 “Internet of Things (IoT) and Non-IoT Active Device Connections Worldwide from
    2010 to 2025,” Statista, https://oreil.ly/BChLN.'
