- pgno: 339
  md: 'services, doing batch prediction is usually trickier.29 Some tools allow you
    to batch requests together for online prediction, which is different from batch
    prediction. Many companies have separate deployment pipelines for online prediction
    and batch prediction. For example, they might use Seldon for online prediction
    but leverage Databricks for batch prediction.


    An open problem with model deployment is how to ensure the quality of a model
    before it''s deployed. In Chapter 9, we talked about different techniques for
    test in production such as shadow deployment, canary release, A/B testing, and
    so on. When choosing a deployment service, you might want to check whether this
    service makes it easy for you to perform the tests that you want.


    # Model Store


    Many companies dismiss model stores because they sound simple. In the section
    “Model Deployment” on page 320, we talked about how, to deploy a model, you have
    to package your model and upload it to a location accessible in production. Model
    store suggests that it stores models—you can do so by uploading your models to
    storage like S3. However, it''s not quite that simple. Imagine now that your model''s
    performance dropped for a group of inputs. The person who was alerted to the problem
    is a DevOps engineer, who, after looking into the problem, decided that she needed
    to inform the data scientist who created this model. But there might be 20 data
    scientists in the company; who should she ping?


    Imagine now that the right data scientist is looped in. The data scientist first
    wants to reproduce the problems locally. She still has the notebook she used to
    generate this model and the final model, so she starts the notebook and uses the
    model with the problematic sets of inputs. To her surprise, the outputs the model
    produces locally are different from the outputs produced in production. Many things
    could have caused this discrepancy; here are just a few examples:


    +   - The model being used in production right now is not the same model that
    she has locally. Perhaps she uploaded the wrong model binary to production?

    +   - The model being used in production is correct, but the list of features
    used is wrong. Perhaps she forgot to rebuild the code locally before pushing it
    to production?'
  merge: -1
  img_proc: true
- pgno: 340
  md: '+   - The model is correct, the feature list is correct, but the featurization
    code is outdated.

    +   - The model is correct, the feature list is correct, the featurization code
    is correct, but something is wrong with the data processing pipeline.


    Without knowing the cause of the problem, it’ll be very difficult to fix it. In
    this simple example, we assume that the data scientist responsible still has access
    to the code used to generate the model. What if that data scientist no longer
    has access to that notebook, or she has already quit or is on vacation?


    Many companies have realized that storing the model alone in blob storage isn’t
    enough. To help with debugging and maintenance, it’s important to track as much
    information associated with a model as possible. Here are eight types of artifacts
    that you might want to store. Note that many artifacts mentioned here are information
    that should be included in the model card, as discussed in the section “Create
    model cards” on page 351.


    # Model definition


    This is the information needed to create the shape of the model, e.g., what loss
    function it uses. If it’s a neural network, this includes how many hidden layers
    it has and how many parameters are in each layer.


    # Model parameters


    These are the actual values of the parameters of your model. These values are
    then combined with the model’s shape to re-create a model that can be used to
    make predictions. Some frameworks allow you to export both the parameters and
    the model definition together.


    # Featurize and predict functions


    Given a prediction request, how do you extract features and input these features
    into the model to get back a prediction? The featurize and predict functions provide
    the instruction to do so. These functions are usually wrapped in endpoints.


    # Dependencies


    The dependencies—e.g., Python version, Python packages—needed to run your model
    are usually packaged together into a container.


    # Data


    The data used to train this model might be pointers to the location where the
    data is stored or the name/version of your data. If you use tools like DVC to
    version your data, this can be the DVC commit that generated the data.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# Model generation code


    This is the code that specifies how your model was created, such as:


    +   - What frameworks it used

    +   - How it was trained

    +   - The details on how the train/valid/test splits were created

    +   - The number of experiments run

    +   - The range of hyperparameters considered

    +   - The actual set of hyperparameters that final model used


    Very often, data scientists generate models by writing code in notebooks. Companies
    with more mature pipelines make their data scientists commit the model generation
    code into their Git repos on GitHub or GitLab. However, in many companies, this
    process is ad hoc, and data scientists don’t even check in their notebooks. If
    the data scientist responsible for the model loses the notebook or quits or goes
    on vacation, there’s no way to map a model in production to the code that generated
    it for debugging or maintenance.


    # Experiment artifacts


    These are the artifacts generated during the model development process, as discussed
    in the section “Experiment Tracking and Versioning” on page 162. These artifacts
    can be graphs like the loss curve. These artifacts can be raw numbers like the
    model’s performance on the test set.


    # Tags


    This includes tags to help with model discovery and filtering, such as owner (the
    person or the team who is the owner of this model) or task (the business problem
    this model solves, like fraud detection).


    Most companies store a subset, but not all, of these artifacts. The artifacts
    a company stores might not be in the same place but scattered. For example, model
    definitions and model parameters might be in S3. Containers that contain dependencies
    might be in ECS (Elastic Container Service). Data might be in Snowflake. Experiment
    artifacts might be in Weights & Biases. Featurize and prediction functions might
    be in AWS Lambda. Some data scientists might manually keep track of these locations
    in, say, a README, but this file can be easily lost.'
  merge: -1
