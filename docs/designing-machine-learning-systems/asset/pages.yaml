  md: '# Table 5-2. Example data for predicting house buying in the next 12 months


    | ID | Age | Gender | Annual income | Marital status | Number of children | Job
    | Buy? |

    |---|---|---|---|---|---|---|---|

    | 1 |  | A | 150,000 |  | 1 | Engineer | No |

    | 2 | 27 | B | 50,000 |  |  | Teacher | No |

    | 3 |  | A | 100,000 | Married | 2 |  | Yes |

    | 4 | 40 | B |  |  | 2 | Engineer | Yes |

    | 5 | 35 | B |  | Single | 0 | Doctor | Yes |

    | 6 |  | A | 50,000 |  | 0 | Teacher | No |

    | 7 | 33 | B | 60,000 | Single |  | Teacher | No |

    | 8 | 20 | B | 10,000 |  |  | Student | No |


    There are three types of missing values. The official names for these types are
    a little bit confusing, so we''ll go into detailed examples to mitigate the confusion.


    # Missing not at random (MNAR)


    This is when the reason a value is missing is because of the true value itself.
    In this example, we might notice that some respondents didn''t disclose their
    income. Upon investigation it may turn out that the income of respondents who
    failed to report tends to be higher than that of those who did disclose. *The
    income values are missing for reasons related to the values themselves.*


    # Missing at random (MAR)


    This is when the reason a value is missing *is not due to the value itself, but
    due to another observed variable.* In this example, we might notice that age values
    are often missing for respondents of the gender “A,” which might be because the
    people of gender A in this survey don''t like disclosing their age.


    # Missing completely at random (MCAR)


    This is when *there''s no pattern in when the value is missing.* In this example,
    we might think that the missing values for the column “Job” might be completely
    random, not because of the job itself and not because of any other variable. People
    just forget to fill in that value sometimes for no particular reason. However,
    this type of missing is very rare. There are usually reasons why certain values
    are missing, and you should investigate.


    When encountering missing values, you can either fill in the missing values with
    certain values (imputation) or remove the missing values (deletion). We''ll go
    over both.'
