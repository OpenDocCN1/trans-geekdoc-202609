- pgno: 238
  md: '# Using ML to optimize ML models


    As hinted by the previous section with the vertical and horizontal fusion for
    a convolutional neural network, there are many possible ways to execute a given
    computation graph. For example, given three operators A, B, and C, you can fuse
    A with B, fuse B with C, or fuse A, B, and C all together.


    Traditionally, framework and hardware vendors hire optimization engineers who,
    based on their experience, come up with heuristics on how to best execute the
    computation graph of a model. For example, NVIDIA might have an engineer or a
    team of engineers who focus exclusively on how to make ResNet-50 run really fast
    on their DGX A100 server.49


    There are a couple of drawbacks to hand-designed heuristics. First, they’re nonoptimal.
    There’s no guarantee that the heuristics an engineer comes up with are the best
    possible solution. Second, they are nonadaptive. Repeating the process on a new
    framework or a new hardware architecture requires an enormous amount of effort.


    This is complicated by the fact that model optimization is dependent on the operators
    its computation graph consists of. Optimizing a convolution neural network is
    different from optimizing a recurrent neural network, which is different from
    optimizing a transformer. Hardware vendors like NVIDIA and Google focus on optimizing
    popular models like ResNet-50 and BERT for their hardware. But what if you, as
    an ML researcher, come up with a new model architecture? You might need to optimize
    it yourself to show that it’s fast first before it’s adopted and optimized by
    hardware vendors.


    If you don’t have ideas for good heuristics, one possible solution might be to
    try all possible ways to execute a computation graph, record the time they need
    to run, then pick the best one. However, given a combinatorial number of possible
    paths, exploring them all would be intractable. Luckily, approximating the solutions
    to intractable problems is what ML is good at. What if we use ML to narrow down
    the search space so we don’t have to explore that many paths, and predict how
    long a path will take so that we don’t have to wait for the entire computation
    graph to finish executing?


    To estimate how much time a path through a computation graph will take to run
    turns out to be difficult, as it requires making a lot of assumptions about that
    graph. It’s much easier to focus on a small part of the graph.


    49 This is also why you shouldn’t read too much into benchmarking results, such
    as MLPerf’s results. A popular model running really fast on a type of hardware
    doesn’t mean an arbitrary model will run really fast on that hardware. It might
    just be that this model is over-optimized.'
