  md: '# Epilogue


    Wow, you made it! You’ve just finished a pretty technical book of 100,000 words
    and over 100 illustrations written by a writer who speaks English as her second
    language. With the help of many colleagues and mentors, I worked really hard on
    this book, and I’m grateful that you chose to read it out of so many books out
    there. I hope that the takeaways you can get from this book will make your work
    a little bit easier.


    With the best practices and tooling that we have now, there are already many incredible
    ML use cases influencing our everyday life. I have no doubt that the number of
    impactful use cases will grow over time as tooling matures, and you might be among
    the people who will make this happen. I’m looking forward to seeing what you build!


    ML systems have a lot of challenges. Not all of them are fun, but all of them
    are opportunities for growth and impact. If you want to talk about these challenges
    and opportunities, don’t hesitate to reach out. I can be found on Twitter at @chip
    ro via email at chip@claypot.ai.'
