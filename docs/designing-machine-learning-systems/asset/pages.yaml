  md: '![](img/bde3d1ed5ea7825115c846be3467945f_47_0.png)


    Figure 2-1. How long it takes for a company to bring a model to production is
    proportional to how long it has used ML. Source: Adapted from an image by Algorithmia


    # Requirements for ML Systems


    We can’t say that we’ve successfully built an ML system without knowing what requirements
    the system has to satisfy. The specified requirements for an ML system vary from
    use case to use case. However, most systems should have these four characteristics:
    reliability, scalability, maintainability, and adaptability. We’ll walk through
    each of these concepts in detail. Let’s take a closer look at reliability first.


    # Reliability


    The system should continue to perform the correct function at the desired level
    of performance even in the face of adversity (hardware or software faults, and
    even human error).


    “Correctness” might be difficult to determine for ML systems. For example, your
    system might call the predict function—e.g., `model.predict()`—correctly, but
    the predictions are wrong. How do we know if a prediction is wrong if we don’t
    have ground truth labels to compare it with?


    With traditional software systems, you often get a warning, such as a system crash
    or runtime error or 404. However, ML systems can fail silently. End users don’t
    even know that the system has failed and might have kept on using it as if it
    were working. For example, if you use Google Translate to translate a sentence
    into a language you don’t know, it might be very hard for you to tell even if
    the translation is wrong. We’ll discuss how ML systems fail in production in Chapter
    8.'
