  md: 'data movements, and data processing engines, tend to be sparsely covered in
    ML coursework, and therefore many data scientists might think of them as low level
    or irrelevant. After consulting with many of my colleagues, I decided that because
    ML systems depend on data, covering the basics of data systems early will help
    us get on the same page to discuss data matters in the rest of the book.


    While we cover many technical aspects of an ML system in this book, ML systems
    are built by people, for people, and can have outsized impact on the life of many.
    It''d be remiss to write a book on ML production without a chapter on the human
    side of it, which is the focus of Chapter 11, the last chapter.


    Note that “data scientist” is a role that has evolved a lot in the last few years,
    and there have been many discussions to determine what this role should entail—we’ll
    go into some of these discussions in Chapter 10. In this book, we use “data scientist”
    as an umbrella term to include anyone who works developing and deploying ML models,
    including people whose job titles might be ML engineers, data engineers, data
    analysts, etc.


    # GitHub Repository and Community


    This book is accompanied by a GitHub repository that contains:


