- pgno: 211
  md: 'In many companies, the responsibility of deploying models falls into the hands
    of the same people who developed those models. In many other companies, once a
    model is ready to be deployed, it will be exported and handed off to another team
    to deploy it. However, this separation of responsibilities can cause high overhead
    communications across teams and make it slow to update your model. It also can
    make it hard to debug should something go wrong. We’ll discuss more on team structures
    in Chapter 11.


    ![](img/bde3d1ed5ea7825115c846be3467945f_211_0.png)


    Exporting a model means converting this model into a format that can be used by
    another application. Some people call this process “serialization.”⁴ There are
    two parts of a model that you can export: the model definition and the model’s
    parameter values. The model definition defines the structure of your model, such
    as how many hidden layers it has and how many units in each layer. The parameter
    values provide the values for these units and layers. Usually, these two parts
    are exported together.


    In TensorFlow 2, you might use `tf.keras.Model.save()` to export your model into
    TensorFlow’s SavedModel format. In PyTorch, you might use `torch.onnx.export()`
    to export your model into ONNX format.


    Regardless of whether your job involves deploying ML models, being cognizant of
    how your models are used can give you an understanding of their constraints and
    help you tailor them to their purposes.


    In this chapter, we’ll start off with some common myths about ML deployment that
    I’ve often heard from people who haven’t deployed ML models. We’ll then discuss
    the two main ways a model generates and serves its predictions to users: online
    prediction and batch prediction. The process of generating predictions is called
    *inference*.


    We’ll continue with where the computation for generating predictions should be
    done: on the device (also referred to as the edge) and the cloud. How a model
    serves and computes the predictions influences how it should be designed, the
    infrastructure it requires, and the behaviors that users encounter.'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'If you come from an academic background, some of the topics discussed in this
    chapter might be outside your comfort zone. If an unfamiliar term comes up, take
    a moment to look it up. If a section becomes too dense, feel free to skip it.
    This chapter is modular, so skipping a section shouldn''t affect your understanding
    of another section.


    # Machine Learning Deployment Myths


    As discussed in Chapter 1, deploying an ML model can be very different from deploying
    a traditional software program. This difference might cause people who have never
    deployed a model before to either dread the process or underestimate how much
    time and effort it will take. In this section, we''ll debunk some of the common
    myths about the deployment process, which will, hopefully, put you in a good state
    of mind to begin the process. This section will be most helpful to people with
    little to no deploying experience.


    # Myth 1: You Only Deploy One or Two ML Models at a Time


    When doing academic projects, I was advised to choose a small problem to focus
    on, which usually led to a single model. Many people from academic backgrounds
    I''ve talked to tend to also think of ML production in the context of a single
    model. Subsequently, the infrastructure they have in mind doesn''t work for actual
    applications, because it can only support one or two models.


    In reality, companies have many, many ML models. An application might have many
    different features, and each feature might require its own model. Consider a ride-sharing
    app like Uber. It needs a model to predict each of the following elements: ride
    demand, driver availability, estimated time of arrival, dynamic pricing, fraudulent
    transaction, customer churn, and more. Additionally, if this app operates in 20
    countries, until you can have models that generalize across different user-profiles,
    cultures, and languages, each country would need its own set of models. So with
    20 countries and 10 models for each country, you already have 200 models. Figure
    7-2 shows a wide range of the tasks that leverage ML at Netflix.'
