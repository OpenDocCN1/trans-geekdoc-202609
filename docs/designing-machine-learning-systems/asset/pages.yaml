  md: 'A more promising approach is WebAssembly (WASM). WASM is an open standard that
    allows you to run executable programs in browsers. After you''ve built your models
    in scikit-learn, PyTorch, TensorFlow, or whatever frameworks you''ve used, instead
    of compiling your models to run on specific hardware, you can compile your model
    to WASM. You get back an executable file that you can just use with JavaScript.


    WASM is one of the most exciting technological trends I''ve seen in the last couple
    of years. It''s performant, easy to use, and has an ecosystem that is growing
    like wildfire.51 As of September 2021, it''s supported by 93% of devices worldwide.52


    The main drawback of WASM is that because WASM runs in browsers, it''s slow. Even
    though WASM is already much faster than JavaScript, it''s still slow compared
    to running code natively on devices (such as iOS or Android apps). A study by
    Jangda et al. showed that applications compiled to WASM run slower than native
    applications by an average of 45% (on Firefox) to 55% (on Chrome).53


    # Summary


    Congratulations, you''ve finished possibly one of the most technical chapters
    in this book! The chapter is technical because deploying ML models is an engineering
    challenge, not an ML challenge.


    We''ve discussed different ways to deploy a model, comparing online prediction
    with batch prediction, and ML on the edge with ML on the cloud. Each way has its
    own challenges. Online prediction makes your model more responsive to users''
    changing preferences, but you have to worry about inference latency. Batch prediction
    is a workaround for when your models take too long to generate predictions, but
    it makes your model less flexible.


    Similarly, doing inference on the cloud is easy to set up, but it becomes impractical
    with network latency and cloud cost. Doing inference on the edge requires having
    edge devices with sufficient compute power, memory, and battery.


    However, I believe that most of these challenges are due to the limitations of
    the hardware that ML models run on. As hardware becomes more powerful and optimized
    for ML, I believe that ML systems will transition to making online prediction
    on-device, illustrated in Figure 7-16.


    51 Wasmer, https://oreil.ly/dTRxr; Awesome Wasm, https://oreil.ly/hlIFb.


    52 Can I Use ____?, https://oreil.ly/sli05.


    53 Abhinav Jangda, Bobby Powers, Emery D. Berger, and Arjun Guha, “Not So Fast:
    Analyzing the Performance of WebAssembly vs. Native Code,” USENIX, https://oreil.ly/uVzrX.'
