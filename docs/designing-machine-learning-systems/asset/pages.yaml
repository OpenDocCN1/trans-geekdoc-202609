  md: 'slower to make predictions or harder to interpret the results. We’ll discuss
    ensembling further in the section “Ensembles” on page 156.


    For many tasks, a small improvement in performance can result in a huge boost
    in revenue or cost savings. For example, a 0.2% improvement in the click-through
    rate for a product recommender system can result in millions of dollars increase
    in revenue for an ecommerce site. However, for many tasks, a small improvement
    might not be noticeable for users. For the second type of task, if a simple model
    can do a reasonable job, complex models must perform significantly better to justify
    the complexity.


    # Criticism of ML Leaderboards


    In recent years, there have been many critics of ML leaderboards, both competitions
    such as Kaggle and research leaderboards such as ImageNet or GLUE.


    An obvious argument is that in these competitions many of the hard steps needed
    for building ML systems are already done for you.16


    A less obvious argument is that due to the multiple-hypothesis testing scenario
    that happens when you have multiple teams testing on the same hold-out test set,
    a model can do better than the rest just by chance.17


    The misalignment of interests between research and production has been noticed
    by researchers. In an EMNLP 2020 paper, Ethayarajh and Jurafsky argued that benchmarks
    have helped drive advances in natural language processing (NLP) by incentivizing
    the creation of more accurate models at the expense of other qualities valued
    by practitioners such as compactness, fairness, and energy efficiency.18


    # Computational priorities


    When designing an ML system, people who haven’t deployed an ML system often make
    the mistake of focusing too much on the model development part and not enough
    on the model deployment and maintenance part.


    During the model development process, you might train many different models, and
    each model does multiple passes over the training data. Each trained model then
    generates predictions on the validation data once to report the scores. The validation
    data is usually much smaller than the training data. During model development,


    16 Julia Evans, “Machine Learning Isn’t Kaggle Competitions,” 2014, https://oreil.ly/p8mZq.


    17 Lauren Oakden-Rayner, “AI Competitions Don’t Produce Useful Models,” September
    19, 2019, https://oreil.ly/X6RIT.


    18 Kawin Ethayarajh and Dan Jurafsky, “Utility Is in the Eye of the User: A Critique
    of NLP Leaderboards,” EMNLP, 2020, https://oreil.ly/4Ud8P.'
