- pgno: 137
  md: '# Feature Engineering


    In 2014, the paper “Practical Lessons from Predicting Clicks on Ads at Facebook”
    claimed that having the right features is the most important thing in developing
    their ML models. Since then, many of the companies that I’ve worked with have
    discovered time and time again that once they have a workable model, having the
    right features tends to give them the biggest performance boost compared to clever
    algorithmic techniques such as hyperparameter tuning. State-of-the-art model architectures
    can still perform poorly if they don’t use a good set of features.


    Due to its importance, a large part of many ML engineering and data science jobs
    is to come up with new useful features. In this chapter, we will go over common
    techniques and important considerations with respect to feature engineering. We
    will dedicate a section to go into detail about a subtle yet disastrous problem
    that has derailed many ML systems in production: data leakage and how to detect
    and avoid it.


    We will end the chapter discussing how to engineer good features, taking into
    account both the feature importance and feature generalization. Talking about
    feature engineering, some people might think of feature stores. Since feature
    stores are closer to infrastructure to support multiple ML applications, we’ll
    cover feature stores in Chapter 10.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# Learned Features Versus Engineered Features


    When I cover this topic in class, my students frequently ask: “Why do we have
    to worry about feature engineering? Doesn’t deep learning promise us that we no
    longer have to engineer features?”


    They are right. The promise of deep learning is that we won’t have to handcraft
    features. For this reason, deep learning is sometimes called feature learning.¹
    Many features can be automatically learned and extracted by algorithms. However,
    we’re still far from the point where all features can be automated. This is not
    to mention that, as of this writing, the majority of ML applications in production
    aren’t deep learning. Let’s go over an example to understand what features can
    be automatically extracted and what features still need to be handcrafted.


    Imagine that you want to build a sentiment analysis classifier to classify whether
    a comment is spam or not. Before deep learning, when given a piece of text, you
    would have to manually apply classical text processing techniques such as lemmatization,
    expanding contractions, removing punctuation, and lowercasing everything. After
    that, you might want to split your text into n-grams with n values of your choice.


    For those unfamiliar, an n-gram is a contiguous sequence of n items from a given
    sample of text. The items can be phonemes, syllables, letters, or words. For example,
    given the post “I like food,” its word-level 1-grams are [“I”, “like”, “food”]
    and its word-level 2-grams are [“I like”, “like food”]. This sentence’s set of
    n-gram features, if we want n to be 1 and 2, is: [“I”, “like”, “food”, “I like”,
    “like food”].


    Figure 5-1 shows an example of classical text processing techniques you can use
    to handcraft n-gram features for your text.


    1 Loris Nanni, Stefano Ghidoni, and Sheryl Brahnam, “Handcrafted vs. Non-handcrafted
    Features for Computer Vision Classification,” Pattern Recognition 71 (November
    2017): 158–72, https://oreil.ly/CGfYQ; Wikipedia, s.v. “Feature learning,” https://oreil.ly/fjmwN.'
