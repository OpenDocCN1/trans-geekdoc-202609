- pgno: 315
  md: 'Even if two companies have the exact same infrastructure needs, their resulting
    infrastructure might look different depending on their approaches to build versus
    buy decisions—i.e., what they want to build in-house versus what they want to
    outsource to other companies. We''ll discuss the build versus buy decisions in
    the last part of this chapter, where we''ll also discuss the hope for standardized
    and unified abstractions for ML infrastructure.


    Let''s dive in!


    # Storage and Compute


    ML systems work with a lot of data, and this data needs to be stored somewhere.
    The storage layer is where data is collected and stored. At its simplest form,
    the storage layer can be a hard drive disk (HDD) or a solid state disk (SSD).
    The storage layer can be in one place, e.g., you might have all your data in Amazon
    S3 or in Snowflake, or spread out over multiple locations.8 Your storage layer
    can be on-prem in a private data center or on the cloud. In the past, companies
    might have tried to manage their own storage layer. However, in the last decade,
    the storage layer has been mostly commoditized and moved to the cloud. Data storage
    has become so cheap that most companies just store all the data they have without
    the cost.9 We''ve covered the data layer intensively in Chapter 3, so in this
    chapter, we''ll focus on the compute layer.


    The compute layer refers to all the compute resources a company has access to
    and the mechanism to determine how these resources can be used. The amount of
    compute resources available determines the scalability of your workloads. You
    can think of the compute layer as the engine to execute your jobs. At its simplest
    form, the compute layer can just be a single CPU core or a GPU core that does
    all your computation. Its most common form is cloud compute managed by a cloud
    provider such as AWS Elastic Compute Cloud (EC2) or GCP.


    The compute layer can usually be sliced into smaller compute units to be used
    concurrently. For example, a CPU core might support two concurrent threads; each
    thread is used as a compute unit to execute its own job. Or multiple CPU cores
    might be joined together to form a larger compute unit to execute a larger job.
    A compute unit can be created for a specific short-lived job such as an AWS Step
    Function or a GCP Cloud Run—the unit will be eliminated after the job finishes.
    A compute unit can also be created to be more “permanent,” aka without being tied
    to a job, like a virtual machine. A more permanent compute unit is sometimes called
    an “instance.”


    8 I''ve seen a company whose data is spread over Amazon Redshift and GCP BigQuery,
    and their engineers are not very happy about it.


    9 We only discuss data storage here since we''ve discussed data systems in Chapter
    2.'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'However, the compute layer doesn’t always use threads or cores as compute units.
    There are compute layers that abstract away the notions of cores and use other
    units of computation. For example, computation engines like Spark and Ray use
    “job” as their unit, and Kubernetes uses “pod,” a wrapper around containers, as
    its smallest deployable unit. While you can have multiple containers in a pod,
    you can’t independently start or stop different containers in the same pod.


    To execute a job, you first need to load the required data into your compute unit’s
    memory, then execute the required operations—addition, multiplication, division,
    convolution, etc.—on that data. For example, to add two arrays, you will first
    need to load these two arrays into memory, and then perform addition on the two
    arrays. If the compute unit doesn’t have enough memory to load these two arrays,
    the operation will be impossible without an algorithm to handle out-of-memory
    computation. Therefore, a compute unit is mainly characterized by two metrics:
    how much memory it has and how fast it runs an operation.


    The memory metric can be specified using units like GB, and it’s generally straightforward
    to evaluate: a compute unit with 8 GB of memory can handle more data in memory
    than a compute unit with only 2 GB, and it is generally more expensive.10 Some
    companies care not only how much memory a compute unit has but also how fast it
    is to load data in and out of memory, so some cloud providers advertise their
    instances as having “high bandwidth memory” or specify their instances’ I/O bandwidth.


    The operation speed is more contentious. The most common metric is FLOPS—floating
    point operations per second. As the name suggests, this metric denotes the number
    of float point operations a compute unit can run per second. You might see a hardware
    vendor advertising that their GPUs or TPUs or IPUs (intelligence processing units)
    have teraFLOPS (one trillion FLOPS) or another massive number of FLOPS.


    However, this metric is contentious because, first, companies that measure this
    metric might have different ideas on what is counted as an operation. For example,
    if a machine fuses two operations into one and executes this fused operation,11
    does this count as one operation or two? Second, just because a compute unit is
    capable of doing a trillion FLOPS doesn’t mean you’ll be able to execute your
    job at the speed of a trillion FLOPS. The ratio of the number of FLOPS a job can
    run to the number of FLOPS a compute unit is capable of handling is called utilization.12
    If an instance


    10 As of writing this book, an ML workload typically requires between 4 GB and
    8 GB of memory; 16 GB of memory is enough to handle most ML workloads.


    11 See operation fusion in the section “Model optimization” on page 216.


    12 “What Is FLOPS/s and Is It a Good Measure of Performance?,” Stack Overflow,
    last updated October 7, 2020, https://oreil.ly/M8jPP.'
  merge: -1
  img_proc: true
- pgno: 317
  md: 'is capable of doing a million FLOPs and your job runs with 0.3 million FLOPS,
    that’s a 30% utilization rate. Of course, you’d want to have your utilization
    rate as high as possible. However, it’s near impossible to achieve 100% utilization
    rate. Depending on the hardware backend and the application, the utilization rate
    of 50% might be considered good or bad. Utilization also depends on how fast you
    can load data into memory to perform the next operations—hence the importance
    of I/O bandwidth.¹³


    When evaluating a new compute unit, it’s important to evaluate how long it will
    take this compute unit to do common workloads. For example, MLPerf is a popular
    benchmark for hardware vendors to measure their hardware performance by showing
    how long it will take their hardware to train a ResNet-50 model on the ImageNet
    dataset or use a BERT-large model to generate predictions for the SQuAD dataset.


    Because thinking about FLOPS is not very useful, to make things easier, when evaluating
    compute performance, many people just look into the number of cores a compute
    unit has. So you might use an instance with 4 CPU cores and 8 GB of memory. Keep
    in mind that AWS uses the concept of vCPU, which stands for virtual CPU and which,
    for practical purposes, can be thought of as half a physical core.¹⁴ You can see
    the number of cores and memory offered by some AWS EC2 and GCP instances in Figure
    10-3.


