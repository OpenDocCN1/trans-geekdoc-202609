- pgno: 365
  md: 'However, privacy settings and users’ choices only address the problem at a
    surface level. The underlying problem is that the devices we use today are constantly
    collecting and reporting data on us. This data has to be moved and stored somewhere,
    creating opportunities for it to be intercepted and misused. The data that Strava
    has is small compared to much more widely used applications like Amazon, Facebook,
    Google, etc. Strava’s blunder might have exposed military bases’ activities, but
    other privacy failures might cause even more dangers not only to individuals but
    also to society at large.


    Collecting and sharing data is essential for the development of data-driven technologies
    like AI. However, this case study shows the hidden danger of collecting and sharing
    data, even when data is supposedly anonymized and was released with good intention.
    Developers of applications that gather user data must understand that their users
    might not have the technical know-how and privacy awareness to choose the right
    privacy settings for themselves, and so developers must proactively work to make
    the right settings the default, even at the cost of gathering less data.


    # A Framework for Responsible AI


    In this section, we will lay down the foundations for you, as an ML practitioner,
    to audit model behavior and set out guidelines that best help you meet the needs
    of your projects. This framework is not sufficient for every use case. There are
    certain applications where the use of AI might altogether be inappropriate or
    unethical (e.g., criminal sentencing decisions, predictive policing), regardless
    of which framework you follow.


    # Discover sources for model biases


    As someone who has been following the discussions around ML systems design, you
    know that biases can creep in your system through the entire workflow. Your first
    step is to discover how these biases can creep in. The following are some examples
    of the sources of data, but keep in mind that this list is far from being exhaustive.
    One of the reasons why biases are so hard to combat is that biases can come from
    any step during a project lifecycle.'
