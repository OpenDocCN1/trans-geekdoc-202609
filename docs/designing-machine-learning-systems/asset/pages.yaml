- pgno: 150
  md: 'Because it''s a trick, it''s often considered hacky by academics and excluded
    from ML curricula. But its wide adoption in the industry is a testimonial to how
    effective the trick is. It''s essential to Vowpal Wabbit and it''s part of the
    frameworks of scikit-learn, TensorFlow, and gensim. It can be especially useful
    in continual learning settings where your model learns from incoming examples
    in production. We''ll cover continual learning in Chapter 9.


    # Feature Crossing


    Feature crossing is the technique to combine two or more features to generate
    new features. This technique is useful to model the nonlinear relationships between
    features. For example, for the task of predicting whether someone will want to
    buy a house in the next 12 months, you suspect that there might be a nonlinear
    relationship between marital status and number of children, so you combine them
    to create a new feature “marriage and children” as in Table 5-3.


    Table 5-3. Example of how two features can be combined to create a new feature


    | Marriage | Single | Married | Single | Single | Married |

    |---|---|---|---|---|---|

    | Children | 0 | 2 | 1 | 0 | 1 |

    | Marriage and children | Single, 0 | Married, 2 | Single, 1 | Single, 0 | Married,
    1 |


    Because feature crossing helps model nonlinear relationships between variables,
    it''s essential for models that can''t learn or are bad at learning nonlinear
    relationships, such as linear regression, logistic regression, and tree-based
    models. It''s less important in neural networks, but it can still be useful because
    explicit feature crossing occasionally helps neural networks learn nonlinear relationships
    faster. DeepFM and xDeepFM are the family of models that have successfully leveraged
    explicit feature interactions for recommender systems and click-through-rate prediction.⁹


    A caveat of feature crossing is that it can make your feature space blow up. Imagine
    feature A has 100 possible values and feature B has 100 possible features; crossing
    these two features will result in a feature with 100 × 100 = 10,000 possible values.
    You will need a lot more data for models to learn all these possible values. Another
    caveat is that because feature crossing increases the number of features models
    use, it can make models overfit to the training data.


    9 Huifeng Guo, Ruiming Tang, Yunming Ye, Zhenguo Li, and Xiuqiang He, “DeepFM:
    A Factorization-Machine Based Neural Network for CTR Prediction,” Proceedings
    of the Twenty-Sixth International Joint Conference on Artificial Intelligence
    (IJCAI, 2017), https://oreil.ly/1Vs3v; Jianxun Lian, Xiaohuan Zhou, Fuzheng Zhang,
    Zhongxia Chen, Xing Xie, and Guangzhong Sun, “xDeepFM: Combining Explicit and
    Implicit Feature Interactions for Recommender Systems,” arXiv, 2018, https://oreil.ly/WFmFt.'
  merge: -1
