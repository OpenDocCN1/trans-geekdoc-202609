    ![](img/bde3d1ed5ea7825115c846be3467945f_305_0.png)


    Figure 9-7. Interleaving video recommendations from two ranking algorithms using
    team draft. Source: Parks et al.32


    # Bandits


    For those unfamiliar, bandit algorithms originated in gambling. A casino has multiple
    slot machines with different payouts. A slot machine is also known as a one-armed
    bandit, hence the name. You don’t know which slot machine gives the highest payout.
    You can experiment over time to find out which slot machine is the best while
    maximizing your payout. Multi-armed bandits are algorithms that allow you to balance
    between exploitation (choosing the slot machine that has paid the most in the
    past) and exploration (choosing other slot machines that may pay off even more).


    31 Olivier Chapelle, Thorsten Joachims, Filip Radlinski, and Yisong Yue, “Large-Scale
    Validation and Analysis of Interleaved Search Evaluation,” ACM Transactions on
    Information Systems 30, no. 1 (February 2012): 6, https://oreil.by/lccvK.


    32 Parks et al., “Innovating Faster on Personalization Algorithms.”'
