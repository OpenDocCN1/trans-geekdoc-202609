- pgno: 129
  md: 'Because the loss function (or the cost function) guides the learning process,
    many algorithm-level methods involve adjustment to the loss function. The key
    idea is that if there are two instances, x₁ and x₂, and the loss resulting from
    making the wrong prediction on x₁ is higher than x₂, the model will prioritize
    making the correct prediction on x₁ over making the correct prediction on x₂.
    By giving the training instances we care about higher weight, we can make the
    model focus more on learning these instances.


    Let L(x; θ) be the loss caused by the instance x for the model with the parameter
    set θ. The model''s loss is often defined as the average loss caused by all instances.
    N denotes the total number of training samples.


    $L(X; \theta) = \sum_x \frac{1}{N} L(x; \theta)$


    This loss function values the loss caused by all instances equally, even though
    wrong predictions on some instances might be much costlier than wrong predictions
    on other instances. There are many ways to modify this cost function. In this
    section, we will focus on three of them, starting with cost-sensitive learning.


    # Cost-sensitive learning.


    Back in 2001, based on the insight that misclassification of different classes
    incurs different costs, Elkan proposed cost-sensitive learning in which the individual
    loss function is modified to take into account this varying cost.⁴⁴ The method
    started by using a cost matrix to specify Cᵢⱼ: the cost if class i is classified
    as class j. If i = j, it''s a correct classification, and the cost is usually
    0. If not, it''s a misclassification. If classifying POSITIVE examples as NEGATIVE
    is twice as costly as the other way around, you can make C₁₀ twice as high as
    C₀₁.


    For example, if you have two classes, POSITIVE and NEGATIVE, the cost matrix can
    look like that in Table 4-8.


    # Table 4-8. Example of a cost matrix


    | | Actual NEGATIVE | Actual POSITIVE |

    |---|---|---|

    | Predicted NEGATIVE | C(0,0)=C₀₀ | C(1,0)=C₁₀ |

    | Predicted POSITIVE | C(0,1)=C₀₁ | C(1,1)=C₁₁ |


    44 Charles Elkan, “The Foundations of Cost-Sensitive Learning,” Proceedings of
    the Seventeenth International Joint Conference on Artificial Intelligence (IJCAI''01),
    2001, https://oreil.ly/WGq5M.'
