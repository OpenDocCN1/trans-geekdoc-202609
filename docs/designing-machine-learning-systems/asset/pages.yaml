  md: '# Irresponsible AI: Case Studies


    We’ll start this section off by looking at two failures of AI systems that led
    to severe harm for not only the users of these systems but also to the organizations
    who developed the systems. We’ll trace some of the places where the organizations
    went wrong and what the practitioners could have done to potentially anticipate
    these points of failure. These highlights will serve as background as we dive
    into the engineering framework for responsible AI.


    There are other interesting examples of “AI incidents” logged at the AI Incident
    Database. Keep in mind that while the following two examples and the ones logged
    at AI Incident Database are the ones that caught attention, there are many more
    instances of irresponsible AI that happen silently.


    # Case study I: Automated grader’s biases


    In the summer of 2020, the United Kingdom canceled A levels, the high-stakes exams
    that determine college placement, due to the COVID-19 pandemic. Ofqual, the regulatory
    body for education and examinations in the UK, sanctioned the use of an automated
    system to assign final A-level grades to students—without them taking the test.
    According to Jones and Safak from Ada Lovelace Institute, “Awarding students’
    grades based on teacher assessment was originally rejected by Ofqual on the grounds
    of unfairness between schools, incompatibility across generations and devaluing
    of results because of grade inflation. The fairer option, Ofqual surmised, was
    to combine previous attainment data and teacher assessment to assign grades, using
    a particular statistical model—an ‘algorithm.’”


    The results published by this algorithm, however, turned out to be unjust and
    untrustworthy. They quickly led to public outcries to get rid of it, with hundreds
    of students chanting in protest.⁸


    What caused the public outcries? The first glance seems to point at the algorithm’s
    poor performance. Ofqual stated that their model, tested on 2019 data, had about
    60% average accuracy across A-level subjects.⁹ This means that they expected 40%
    of the grades assigned by this model to be different from the students’ actual
    grades.


    7 Elliot Jones and Cansu Safak, “Can Algorithms Ever Make the Grade?” Ada Lovelace
    Institute Blog, 2020, https://oreil.ly/zTxR.


    8 Tom Simonite, “Skewed Grading Algorithms Fuel Backlash Beyond the Classroom,”
    Wired, August 19, 2020, https://oreil.ly/GFRet.


    9 Ofqual, “Awarding GCSE, AS & A Levels in Summer 2020: Interim Report,” Gov.uk,
    August 13, 2020, https://oreil.ly/r22iz.'
