    # Semi-supervision


    If weak supervision leverages heuristics to obtain noisy labels, semi-supervision
    leverages structural assumptions to generate new labels based on a small set of
    initial labels. Unlike weak supervision, semi-supervision requires an initial
    set of labels.


    Semi-supervised learning is a technique that was used back in the 90s,¹⁶ and since
    then many semi-supervision methods have been developed. A comprehensive review
    of semi-supervised learning is out of the scope of this book. We''ll go over a
    small subset of these methods to give readers a sense of how they are used. For
    a comprehensive review, I recommend “Semi-Supervised Learning Literature Survey”
    (Xiaojin Zhu, 2008) and “A Survey on Semi-Supervised Learning” (Engelen and Hoos,
    2018).


    A classic semi-supervision method is *self-training*. You start by training a
    model on your existing set of labeled data and use this model to make predictions
    for unlabeled samples. Assuming that predictions with high raw probability scores
    are correct, you add the labels predicted with high probability to your training
    set and train a new model on this expanded training set. This goes on until you’re
    happy with your model performance.


    Another semi-supervision method assumes that data samples that share similar characteristics
    share the same labels. The similarity might be obvious, such as in the task of
    classifying the topic of Twitter hashtags. You can start by labeling the hashtag
    “#AI” as Computer Science. Assuming that hashtags that appear in the same tweet
    or profile are likely about the same topic, given the profile of MIT CSAIL in
    Figure 4-6, you can also label the hashtags “#ML” and “#BigData” as Computer Science.


    ![](img/bde3d1ed5ea7825115c846be3467945f_116_0.png)


    *Figure 4-6. Because #ML and #BigData appear in the same Twitter profile as #AI,
    we can assume that they belong to the same topic*


    16 Avrim Blum and Tom Mitchell, “Combining Labeled and Unlabeled Data with Co-Training,”
    in *Proceedings of the Eleventh Annual Conference on Computational Learning Theory*
    (July 1998): 92–100, https://oreil.ly/T79AE.'
