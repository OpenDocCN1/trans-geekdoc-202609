  md: "# JSON\n\nJSON, Javascript Object Notation, is everywhere. Even though it was\
    \ derived from JavaScript, it's language-independent—most modern programming languages\
    \ can generate and parse JSON. It's human-readable. Its key-value pair paradigm\
    \ is simple but powerful, capable of handling data of different levels of structuredness.\
    \ For example, your data can be stored in a structured format like the following:\n\
    \n```\n{\n  \"firstName\": \"Boatie\",\n  \"lastName\": \"McBoatFace\",\n  \"\
    isVibing\": true,\n  \"age\": 12,\n  \"address\": {\n    \"streetAddress\": \"\
    12 Ocean Drive\",\n    \"city\": \"Port Royal\",\n    \"postalCode\": \"10021-3100\"\
    \n  }\n}\n```\n\nThe same data can also be stored in an unstructured blob of text\
    \ like the following:\n\n```\n{\n  \"text\": \"Boatie McBoatFace, aged 12, is\
    \ vibing, at 12 Ocean Drive, Port Royal, 10021-3100\"\n}\n```\n\nBecause JSON\
    \ is ubiquitous, the pain it causes can also be felt everywhere. Once you've committed\
    \ the data in your JSON files to a schema, it's pretty painful to retrospectively\
    \ go back to change the schema. JSON files are text files, which means they take\
    \ up a lot of space, as we'll see in the section “Text Versus Binary Format” on\
    \ page 57.\n\n# Row-Major Versus Column-Major Format\n\nThe two formats that are\
    \ common and represent two distinct paradigms are CSV and Parquet. CSV (comma-separated\
    \ values) is row-major, which means consecutive elements in a row are stored next\
    \ to each other in memory. Parquet is column-major, which means consecutive elements\
    \ in a column are stored next to each other.\n\nBecause modern computers process\
    \ sequential data more efficiently than nonsequential data, if a table is row-major,\
    \ accessing its rows will be faster than accessing its columns in expectation.\
    \ This means that for row-major formats, accessing data by rows is expected to\
    \ be faster than accessing data by columns."
