- pgno: 195
  md: '# Four Phases of ML Model Development


    Before we transition to model training, let’s take a look at the four phases of
    ML model development. Once you’ve decided to explore ML, your strategy depends
    on which phase of ML adoption you are in. There are four phases of adopting ML.
    The solutions from a phase can be used as baselines to evaluate the solutions
    from the next phase:


    *Phase 1. Before machine learning*


    If this is your first time trying to make this type of prediction from this type
    of data, start with non-ML solutions. Your first stab at the problem can be the
    simplest heuristics. For example, to predict what letter users are going to type
    next in English, you can show the top three most common English letters, “e,”
    “t,” and “a,” which might get your accuracy to be 30%.


    Facebook newsfeed was introduced in 2006 without any intelligent algorithms—posts
    were shown in chronological order, as shown in Figure 6-10.33 It wasn’t until
    2011 that Facebook started displaying news updates you were most interested in
    at the top of the feed.


    ![](img/bde3d1ed5ea7825115c846be3467945f_195_0.png)


    Figure 6-10. Facebook newsfeed circa 2006. Source: Iveta Ryšavá34


    33 Samantha Murphy, “The Evolution of Facebook News Feed,” Mashable, March 12,
    2013, https://oreil.ly/1HMXh.


    34 Iveta Ryšavá, “What Mark Zuckerberg’s News Feed Looked Like in 2006,” Newsfeed.org,
    January 14, 2016, https://oreil.ly/XZT6Q.'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'According to Martin Zinkevich in his magnificent “Rules of Machine Learning:
    Best Practices for ML Engineering”: “If you think that machine learning will give
    you a 100% boost, then a heuristic will get you 50% of the way there.”35 You might
    even find that non-ML solutions work fine and you don’t need ML yet.


    # Phase 2. Simplest machine learning models


    For your first ML model, you want to start with a simple algorithm, something
    that gives you visibility into its working to allow you to validate the usefulness
    of your problem framing and your data. Logistic regression, gradient-boosted trees,
    k-nearest neighbors can be great for that. They are also easier to implement and
    deploy, which allows you to quickly build out a framework from data engineering
    to development to deployment that you can test out and gain confidence on.


    # Phase 3. Optimizing simple models


    Once you have your ML framework in place, you can focus on optimizing the simple
    ML models with different objective functions, hyperparameter search, feature engineering,
    more data, and ensembles.


    # Phase 4. Complex models


    Once you’ve reached the limit of your simple models and your use case demands
    significant model improvement, experiment with more complex models.


    You’ll also want to experiment to figure out how quickly your model decays in
    production (e.g., how often it’ll need to be retrained) so that you can build
    out your infrastructure to support this retraining requirement.36


    # Model Offline Evaluation


    One common but quite difficult question I often encounter when helping companies
    with their ML strategies is: “How do I know that our ML models are any good?”
    In one case, a company deployed ML to detect intrusions to 100 surveillance drones,
    but they had no way of measuring how many intrusions their system failed to detect,
    and they couldn’t decide if one ML algorithm was better than another for their
    needs.


    Lacking a clear understanding of how to evaluate your ML systems is not necessarily
    a reason for your ML project to fail, but it might make it impossible to find
    the best solution for your need, and make it harder to convince your managers
    to adopt ML. You might want to partner with the business team to develop metrics
    for model evaluation that are more relevant to your company’s business.37


    35 Martin Zinkevich, “Rules of Machine Learning: Best Practices for ML Engineering,”
    Google, 2019, https://oreil.ly/YIEsN.


    36 We’ll go in depth about how often to update your models in Chapter 9.


    37 See the section “Business and ML Objectives” on page 26.'
