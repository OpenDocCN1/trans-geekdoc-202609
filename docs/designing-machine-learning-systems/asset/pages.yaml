    For tasks with long feedback loops, natural labels might not arrive for weeks
    or even months. Fraud detection is an example of a task with long feedback loops.
    For a certain period of time after a transaction, users can dispute whether that
    transaction is fraudulent or not. For example, when a customer read their credit
    card statement and saw a transaction they didn’t recognize, they might dispute
    it with their bank, giving the bank the feedback to label that transaction as
    fraudulent. A typical dispute window is one to three months. After the dispute
    window has passed, if there’s no dispute from the user, you might presume the
    transaction to be legitimate.


    Labels with long feedback loops are helpful for reporting a model’s performance
    on quarterly or yearly business reports. However, they are not very helpful if
    you want to detect issues with your models as soon as possible. If there’s a problem
    with your fraud detection model and it takes you months to catch, by the time
    the problem is fixed, all the fraudulent transactions your faulty model let through
    might have caused a small business to go bankrupt.


    # Handling the Lack of Labels


    Because of the challenges in acquiring sufficient high-quality labels, many techniques
    have been developed to address the problems that result. In this section, we will
    cover four of them: weak supervision, semi-supervision, transfer learning, and
    active learning. A summary of these methods is shown in Table 4-2.


    Table 4-2. Summaries of four techniques for handling the lack of hand-labeled
    data


    | Method | How | Ground truths required? |

    |---|---|---|

    | Weak supervision | Leverages (often noisy) heuristics to generate labels | No,
    but a small number of labels are recommended to guide the development of heuristics
    |

    | Semi-supervision | Leverages structural assumptions to generate labels | Yes,
    a small number of initial labels as seeds to generate more labels |

    | Transfer learning | Leverages models pretrained on another task for your new
    task | No for zero-shot learning Yes for fine-tuning, though the number of ground
    truths required is often much smaller than what would be needed if you train the
    model from scratch |

    | Active learning | Labels data samples that are most useful to your model | Yes
    |


