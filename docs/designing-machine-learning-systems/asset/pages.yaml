- pgno: 61
  md: 'You can combine the models’ outputs and rank posts by their combined scores:


    α quality_score + β engagement_score


    Now you can tweak α and β without retraining your models!


    In general, when there are multiple objectives, it’s a good idea to decouple them
    first because it makes model development and maintenance easier. First, it’s easier
    to tweak your system without retraining models, as previously explained. Second,
    it’s easier for maintenance since different objectives might need different maintenance
    schedules. Spamming techniques evolve much faster than the way post quality is
    perceived, so spam filtering systems need updates at a much higher frequency than
    quality-ranking systems.


    # Mind Versus Data


    Progress in the last decade shows that the success of an ML system depends largely
    on the data it was trained on. Instead of focusing on improving ML algorithms,
    most companies focus on managing and improving their data.¹⁶


    Despite the success of models using massive amounts of data, many are skeptical
    of the emphasis on data as the way forward. In the last five years, at every academic
    conference I attended, there were always some public debates on the power of mind
    versus data. Mind might be disguised as inductive biases or intelligent architectural
    designs. Data might be grouped together with computation since more data tends
    to require more computation.


    In theory, you can both pursue architectural designs and leverage large data and
    computation, but spending time on one often takes time away from another.¹⁷


    In the mind-over-data camp, there’s Dr. Judea Pearl, a Turing Award winner best
    known for his work on causal inference and Bayesian networks. The introduction
    to his book The Book of Why is entitled “Mind over Data,” in which he emphasizes:
    “Data is profoundly dumb.” In one of his more controversial posts on Twitter in
    2020, he expressed his strong opinion against ML approaches that rely heavily
    on data and warned that data-centric ML people might be out of a job in three
    to five years: “ML will not be the same in 3–5 years, and ML folks who continue
    to follow the current data-centric paradigm will find themselves outdated, if
    not jobless. Take note.”¹⁸


    16 Anand Rajaraman, “More Data Usually Beats Better Algorithms,” Datawocky, March
    24, 2008, https://oreil.ly/wNwhV.


    17 Rich Sutton, “The Bitter Lesson,” March 13, 2019, https://oreil.ly/RhOp9.


    18 Tweet by Dr. Judea Pearl (@yudapearl), September 27, 2020, https://oreil.ly/wFbHb.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'There’s also a milder opinion from Professor Christopher Manning, director
    of the Stanford Artificial Intelligence Laboratory, who argued that huge computation
    and a massive amount of data with a simple learning algorithm create incredibly
    bad learners. The structure allows us to design systems that can learn more from
    less data.19


    Many people in ML today are in the data-over-mind camp. Professor Richard Sutton,
    a professor of computing science at the University of Alberta and a distinguished
    research scientist at DeepMind, wrote a great blog post in which he claimed that
    researchers who chose to pursue intelligent designs over methods that leverage
    computation will eventually learn a bitter lesson: “The biggest lesson that can
    be read from 70 years of AI research is that general methods that leverage computation
    are ultimately the most effective, and by a large margin.... Seeking an improvement
    that makes a difference in the shorter term, researchers seek to leverage their
    human knowledge of the domain, but the only thing that matters in the long run
    is the leveraging of computation.”20


    When asked how Google Search was doing so well, Peter Norvig, Google’s director
    of search quality, emphasized the importance of having a large amount of data
    over intelligent algorithms in their success: “We don’t have better algorithms.
    We just have more data.”21


    Dr. Monica Rogati, former VP of data at Jawbone, argued that data lies at the
    foundation of data science, as shown in Figure 2-7. If you want to use data science,
    a discipline of which ML is a part of, to improve your products or processes,
    you need to start with building out your data, both in terms of quality and quantity.
    Without data, there’s no data science.


    The debate isn’t about whether finite data is necessary, but whether it’s sufficient.
    The term finite here is important, because if we had infinite data, it might be
    possible for us to look up the answer. Having a lot of data is different from
    having infinite data.


    19 “Deep Learning and Innate Priors” (Chris Manning versus Yann LeCun debate),
    February 2, 2018, video, 1:02:55, https://oreil.ly/b3hb1.


    20 Sutton, “The Bitter Lesson.”


    21 Alon Halevy, Peter Norvig, and Fernando Pereira, “The Unreasonable Effectiveness
    of Data,” IEEE Computer Society, March/April 2009, https://oreil.ly/WkN6p.'
  merge: -1
  img_proc: true
