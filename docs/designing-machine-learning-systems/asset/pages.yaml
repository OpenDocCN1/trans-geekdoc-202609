  md: 'If a company focuses only on overall metrics, they might go with model A. They
    might be very happy with this model’s high accuracy until, one day, their end
    users discover that this model is biased against the minority subgroup because
    the minority subgroup happens to correspond to an underrepresented demographic
    group.45 The focus on overall performance is harmful not only because of the potential
    public backlash, but also because it blinds the company to huge potential model
    improvements. If the company sees the two models’ slice-based performance, they
    might follow different strategies. For example, they might decide to improve model
    A’s performance on the minority subgroup, which leads to improving this model’s
    performance overall. Or they might keep both models the same but now have more
    information to make a better-informed decision on which model to deploy.


    Another problem is that their model performs the same on different slices of data
    when the model should perform differently. Some subsets of data are more critical.
    For example, when you build a model for user churn prediction (predicting when
    a user will cancel a subscription or a service), paid users are more critical
    than nonpaid users. Focusing on a model’s overall performance might hurt its performance
    on these critical slices.


    A fascinating and seemingly counterintuitive reason why slice-based evaluation
    is crucial is Simpson’s paradox, a phenomenon in which a trend appears in several
    groups of data but disappears or reverses when the groups are combined. This means
    that model B can perform better than model A on all data together, but model A
    performs better than model B on each subgroup separately. Consider model A’s and
    model B’s performance on group A and group B as shown in Table 6-4. Model A outperforms
    model B for both group A and B, but when combined, model B outperforms model A.


    # Table 6-4. An example of Simpson’s paradoxᵃ


    |  | Group A | Group B | Overall |

    |---|---|---|---|

    | Model A | 93% (81/87) | 73% (192/263) | 78% (273/350) |

    | Model B | 87% (234/270) | 69% (55/80) | 83% (289/350) |


    ᵃ Numbers from Charig et al.’s kidney stone treatment study in 1986: C. R. Charig,
    D. R. Webb, S. R. Payne, and J. E. Wickham, “Comparison of Treatment of Renal
    Calculi by Open Surgery, Percutaneous Nephrolithotomy, and Extracorporeal Shockwave
    Lithotripsy,” British Medical Journal (Clinical Research Edition) 292, no. 6524
    (March 1986): 879–82, https://oreil.ly/X8oWr.'
