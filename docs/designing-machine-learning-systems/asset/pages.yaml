  md: '# 4. Predictions: it''s a predictive problem


    ML models make predictions, so they can only solve problems that require predictive
    answers. ML can be especially appealing when you can benefit from a large quantity
    of cheap but approximate predictions. In English, “predict” means “estimate a
    value in the future.” For example, what will the weather be like tomorrow? Who
    will win the Super Bowl this year? What movie will a user want to watch next?


    As predictive machines (e.g., ML models) are becoming more effective, more and
    more problems are being reframed as predictive problems. Whatever question you
    might have, you can always frame it as: “What would the answer to this question
    be?” regardless of whether this question is about something in the future, the
    present, or even the past.


    Compute-intensive problems are one class of problems that have been very successfully
    reframed as predictive. Instead of computing the exact outcome of a process, which
    might be even more computationally costly and time-consuming than ML, you can
    frame the problem as: “What would the outcome of this process look like?” and
    approximate it using an ML model. The output will be an approximation of the exact
    output, but often, it’s good enough. You can see a lot of it in graphic renderings,
    such as image denoising and screen-space shading.7


    # 5. Unseen data: unseen data shares patterns with the training data


    The patterns your model learns from existing data are only useful if unseen data
    also share these patterns. A model to predict whether an app will get downloaded
    on Christmas 2020 won’t perform very well if it’s trained on data from 2008, when
    the most popular app on the App Store was Koi Pond. What’s Koi Pond? Exactly.


    In technical terms, it means your unseen data and training data should come from
    similar distributions. You might ask: “If the data is unseen, how do we know what
    distribution it comes from?” We don’t, but we can make assumptions—such as we
    can assume that users’ behaviors tomorrow won’t be too different from users’ behaviors
    today—and hope that our assumptions hold. If they don’t, we’ll have a model that
    performs poorly, which we might be able to find out with monitoring, as covered
    in Chapter 8, and test in production, as covered in Chapter 9.


    7 Steke Bako, Thijs Vogels, Brian McWilliams, Mark Meyer, Jan Novák, Alex Harvill,
    Pradeep Sen, Tony Derose, and Fabrice Rousselle, “Kernel-Predicting Convolutional
    Networks for Denoising Monte Carlo Renderings,” ACM Transactions on Graphics 36,
    no. 4 (2017): 97, https://oreil.ly/EeI3j; Oliver Nalbach, Elena Arabadzhiyska,
    Dushyant Mehta, Hans-Peter Seidel, and Tobias Ritschel, “Deep Shading: Convolutional
    Neural Networks for Screen-Space Shading,” arXiv, 2016, https://oreil.ly/dSspz.'
