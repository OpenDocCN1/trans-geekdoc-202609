- pgno: 197
  md: 'Ideally, the evaluation methods should be the same during both development
    and production. But in many cases, the ideal is impossible because during development,
    you have ground truth labels, but in production, you don''t.


    For certain tasks, it''s possible to infer or approximate labels in production
    based on users’ feedback, as covered in the section “Natural Labels” on page 91.
    For example, for the recommendation task, it''s possible to infer if a recommendation
    is good by whether users click on it. However, there are many biases associated
    with this.


    For other tasks, you might not be able to evaluate your model’s performance in
    production directly and might have to rely on extensive monitoring to detect changes
    and failures in your ML system’s performance. We’ll cover monitoring in Chapter
    8.


    Once your model is deployed, you’ll need to continue monitoring and testing your
    model in production. In this section, we’ll discuss methods to evaluate your model’s
    performance before it’s deployed. We’ll start with the baselines against which
    we will evaluate our models. Then we’ll cover some of the common methods to evaluate
    your model beyond overall accuracy metrics.


    # Baselines


    Someone once told me that her new generative model achieved the FID score of 10.3
    on ImageNet.38 I had no idea what this number meant or whether her model would
    be useful for my problem.


    Another time, I helped a company implement a classification model where the positive
    class appears 90% of the time. An ML engineer on the team told me, all excited,
    that their initial model achieved an F1 score of 0.90. I asked him how it was
    compared to random. He had no idea. It turned out that because for his task the
    POSITIVE class accounts for 90% of the labels, if his model randomly outputs the
    positive class 90% of the time, its F1 score would also be around 0.90.39 His
    model might as well be making predictions at random.40


    38 Fréchet inception distance, a common metric for measuring the quality of synthesized
    images. The smaller the value, the higher the quality is supposed to be.


    39 The accuracy, in this case, would be around 0.80.


    40 Revisit the section “Using the right evaluation metrics” on page 106 for a
    refresh on the asymmetry of F1.'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'Evaluation metrics, by themselves, mean little. When evaluating your model,
    it’s essential to know the baseline you’re evaluating it against. The exact baselines
    should vary from one use case to another, but here are the five baselines that
    might be useful across use cases:


    # Random baseline


    If our model just predicts at random, what’s the expected performance? The predictions
    are generated at random following a specific distribution, which can be the uniform
    distribution or the task’s label distribution.


    For example, consider the task that has two labels, NEGATIVE that appears 90%
    of the time and POSITIVE that appears 10% of the time. Table 6-2 shows the F1
    and accuracy scores of baseline models making predictions at random. However,
    as an exercise to see how challenging it is for most people to have an intuition
    for these values, try to calculate these raw numbers in your head before looking
    at the table.


    # Table 6-2. F1 and accuracy scores of a baseline model predicting at random


    | Random distribution | Meaning | F1 | Accuracy |

    |---|---|---|---|

    | Uniform random | Predicting each label with equal probability (50%) | 0.167
    | 0.5 |

    | Task''s label distribution | Predicting NEGATIVE 90% of the time, and POSITIVE
    10% of the time | 0.1 | 0.82 |


    # Simple heuristic


    Forget ML. If you just make predictions based on simple heuristics, what performance
    would you expect? For example, if you want to build a ranking system to rank items
    on a user’s newsfeed with the goal of getting that user to spend more time on
    the newsfeed, how much time would a user spend if you just rank all the items
    in reverse chronological order, showing the latest one first?


    # Zero rule baseline


    The zero rule baseline is a special case of the simple heuristic baseline when
    your baseline model always predicts the most common class.


    For example, for the task of recommending the app a user is most likely to use
    next on their phone, the simplest model would be to recommend their most frequently
    used app. If this simple heuristic can predict the next app accurately 70% of
    the time, any model you build has to outperform it significantly to justify the
    added complexity.


    # Human baseline


    In many cases, the goal of ML is to automate what would have been otherwise done
    by humans, so it’s useful to know how your model performs compared to human experts.
    For example, if you work on a self-driving system, it’s crucial to measure your
    system’s progress compared to human drivers, because otherwise'
