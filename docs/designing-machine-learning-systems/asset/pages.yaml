  md: '![](img/bde3d1ed5ea7825115c846be3467945f_75_0.png)


    I use CSV as an example of the row-major format because it''s popular and generally
    recognizable by everyone I''ve talked to in tech. However, some of the early reviewers
    of this book pointed out that they believe CSV to be a horrible data format. It
    serializes nontext characters poorly. For example, when you write float values
    to a CSV file, some precision might be lost—0.12345678901232323 could be arbitrarily
    rounded up as “0.12345678901”—as complained about in a Stack Overflow thread and
    Microsoft Community thread. People on Hacker News have passionately argued against
    using CSV.


    # Text Versus Binary Format


    CSV and JSON are text files, whereas Parquet files are binary files. Text files
    are files that are in plain text, which usually means they are human-readable.
    Binary files are the catchall that refers to all nontext files. As the name suggests,
    binary files are typically files that contain only 0s and 1s, and are meant to
    be read or used by programs that know how to interpret the raw bytes. A program
    has to know exactly how the data inside the binary file is laid out to make use
    of the file. If you open text files in your text editor (e.g., VS Code, Notepad),
    you''ll be able to read the texts in them. If you open a binary file in your text
    editor, you''ll see blocks of numbers, likely in hexadecimal values, for corresponding
    bytes of the file.


    Binary files are more compact. Here''s a simple example to show how binary files
    can save space compared to text files. Consider that you want to store the number
    1000000. If you store it in a text file, it''ll require 7 characters, and if each
    character is 1 byte, it''ll require 7 bytes. If you store it in a binary file
    as int32, it''ll take only 32 bits or 4 bytes.


    As an illustration, I use interviews.csv, which is a CSV file (text format) of
    17,654 rows and 10 columns. When I converted it to a binary format (Parquet),
    the file size went from 14 MB to 6 MB, as shown in Figure 3-3.


    AWS recommends using the Parquet format because “the Parquet format is up to 2x
    faster to unload and consumes up to 6x less storage in Amazon S3, compared to
    text formats.”⁸


    8 “Announcing Amazon Redshift Data Lake Export: Share Data in Apache Parquet Format,”
    Amazon AWS, December 3, 2019, https://oreil.ly/ilDb6.'
