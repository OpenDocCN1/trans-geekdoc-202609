- pgno: 151
  md: '# Discrete and Continuous Positional Embeddings


    First introduced to the deep learning community in the paper “Attention Is All
    You Need” (Vaswani et al. 2017), positional embedding has become a standard data
    engineering technique for many applications in both computer vision and NLP. We''ll
    walk through an example to show why positional embedding is necessary and how
    to do it.


    Consider the task of language modeling where you want to predict the next token
    (e.g., a word, character, or subword) based on the previous sequence of tokens.
    In practice, a sequence length can be up to 512, if not larger. However, for simplicity,
    let''s use words as our tokens and use the sequence length of 8. Given an arbitrary
    sequence of 8 words, such as “Sometimes all I really want to do is,” we want to
    predict the next word.


    # Embeddings


    An embedding is a vector that represents a piece of data. We call the set of all
    possible embeddings generated by the same algorithm for a type of data “an embedding
    space.” All embedding vectors in the same space are of the same size.


    One of the most common uses of embeddings is word embeddings, where you can represent
    each word with a vector. However, embeddings for other types of data are increasingly
    popular. For example, ecommerce solutions like Criteo and Coveo have embeddings
    for products.¹⁰ Pinterest has embeddings for images, graphs, queries, and even
    users.¹¹ Given that there are so many types of data with embeddings, there has
    been a lot of interest in creating universal embeddings for multimodal data.


    If we use a recurrent neural network, it will process words in sequential order,
    which means the order of words is implicitly inputted. However, if we use a model
    like a transformer, words are processed in parallel, so words’ positions need
    to be explicitly inputted so that our model knows the order of these words (“a
    dog bites a child” is very different from “a child bites a dog”). We don’t want
    to input the absolute positions, 0, 1, 2, …, 7, into our model empirically, neural
    networks don’t work well with inputs that aren’t unit-variance (that’s why we
    scale our features, as discussed previously in the section “Scaling” on page 126).


    10 Flavian Vasile, Elena Smirnova, and Alexis Conneau, “Meta-Prod2Vec—Product
    Embeddings Using Side-Information for Recommendation,” arXiv, July 25, 2016, https://oreil.ly/KDaEd;
    “Product Embeddings and Vectors,” Coveo, https://oreil.ly/ShaSY.


    11 Andrew Zhai, “Representation Learning for Recommender Systems,” August 15,
    2021, https://oreil.ly/OchiL.'
  merge: -1
