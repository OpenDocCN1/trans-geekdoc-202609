  md: '*Fraud detection* is among the oldest applications of ML in the enterprise
    world. If your product or service involves transactions of any value, it''ll be
    susceptible to fraud. By leveraging ML solutions for anomaly detection, you can
    have systems that learn from historical fraud transactions and predict whether
    a future transaction is fraudulent.


    Deciding how much to charge for your product or service is probably one of the
    hardest business decisions; why not let ML do it for you? *Price optimization*
    is the process of estimating a price at a certain time period to maximize a defined
    objective function, such as the company''s margin, revenue, or growth rate. ML-based
    pricing optimization is most suitable for cases with a large number of transactions
    where demand fluctuates and consumers are willing to pay a dynamic price—for example,
    internet ads, flight tickets, accommodation bookings, ride-sharing, and events.


    To run a business, it''s important to be able to forecast customer demand so that
    you can prepare a budget, stock inventory, allocate resources, and update pricing
    strategy. For example, if you run a grocery store, you want to stock enough so
    that customers find what they''re looking for, but you don''t want to overstock,
    because if you do, your groceries might go bad and you lose money.


    Acquiring a new user is expensive. As of 2019, the average cost for an app to
    acquire a user who''ll make an in-app purchase is $86.6⁹. The acquisition cost
    for Lyft is estimated at $158/rider.¹⁰ This cost is so much higher for enterprise
    customers. Customer acquisition cost is hailed by investors as a startup killer.¹¹
    Reducing customer acquisition costs by a small amount can result in a large increase
    in profit. This can be done through better identifying potential customers, showing
    better-targeted ads, giving discounts at the right time, etc.—all of which are
    suitable tasks for ML.


    After you''ve spent so much money acquiring a customer, it''d be a shame if they
    leave. The cost of acquiring a new user is approximated to be 5 to 25 times more
    expensive than retaining an existing one.¹² *Churn prediction* is predicting when
    a specific customer is about to stop using your products or services so that you
    can take appropriate actions to win them back. Churn prediction can be used not
    only for customers but also for employees.


    9 “Average Mobile App User Acquisition Costs Worldwide from September 2018 to
    August 2019, by User Action and Operating System,” Statista, 2019, https://oreil.ly/2pTCH.


    10 Jeff Henriksen, “Valuing Lyft Requires a Deep Look into Unit Economics,” Forbes,
    May 17, 2019, https://oreil.ly/VeSt4.


    11 David Skok, “Startup Killer: The Cost of Customer Acquisition,” For Entrepreneurs,
    2018, https://oreil.ly/L3tQ7.


    12 Amy Gallo, “The Value of Keeping the Right Customers,” Harvard Business Review,
    October 29, 2014, https://oreil.ly/OINkI.'
