- pgno: 45
  md: 'Imagine that you work for an ecommerce site that cares about purchase-through
    rate and you want to move your recommender system from batch prediction to online
    prediction.³ You might reason that online prediction will enable recommendations
    more relevant to users right now, which can lead to a higher purchase-through
    rate. You can even do an experiment to show that online prediction can improve
    your recommender system’s predictive accuracy by X% and, historically on your
    site, each percent increase in the recommender system’s predictive accuracy led
    to a certain increase in purchase-through rate.


    One of the reasons why predicting ad click-through rates and fraud detection are
    among the most popular use cases for ML today is that it’s easy to map ML models’
    performance to business metrics: every increase in click-through rate results
    in actual ad revenue, and every fraudulent transaction stopped results in actual
    money saved.


    Many companies create their own metrics to map business metrics to ML metrics.
    For example, Netflix measures the performance of their recommender system using
    *take-rate*: the number of quality plays divided by the number of recommendations
    a user sees.⁴ The higher the take-rate, the better the recommender system. Netflix
    also put a recommender system’s take-rate in the context of their other business
    metrics like total streaming hours and subscription cancellation rate. They found
    that a higher take-rate also results in higher total streaming hours and lower
    subscription cancellation rates.⁵


    The effect of an ML project on business objectives can be hard to reason about.
    For example, an ML model that gives customers more personalized solutions can
    make them happier, which makes them spend more money on your services. The same
    ML model can also solve their problems faster, which makes them spend less money
    on your services.


    To gain a definite answer on the question of how ML metrics influence business
    metrics, experiments are often needed. Many companies do that with experiments
    like A/B testing and choose the model that leads to better business metrics, regardless
    of whether this model has better ML metrics.


    3 We’ll cover batch prediction and online prediction in Chapter 7.


    4 Ashok Chandrashekar, Fernando Amat, Justin Basilico, and Tony Jebara, “Artwork
    Personalization at Netflix,” *Netflix Technology Blog*, December 7, 2017, https://oreil.ly/UEDmw.


    5 Carlos A. Gomez-Urib e and Neil Hunt, “The Netflix Recommender System: Algorithms,
    Business Value, and Innovation,” *ACM Transactions on Management Information Systems*
    6, no. 4 (January 2016): 13, https://oreil.ly/JkEPB.'
