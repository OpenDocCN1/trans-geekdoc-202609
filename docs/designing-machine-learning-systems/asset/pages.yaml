  md: 'previous stage has grown into a pain point too big to be ignored. Your team
    decides to write a script to automatically execute all the retraining steps. This
    script is then run periodically using a batch process such as Spark.


    Most companies with somewhat mature ML infrastructure are in this stage. Some
    sophisticated companies run experiments to determine the optimal retraining frequency.
    However, for most companies in this stage, the retraining frequency is set based
    on gut feeling—e.g., “once a day seems about right” or “let’s kick off the retraining
    process each night when we have idle compute.”


    When creating scripts to automate the retraining process for your system, you
    need to take into account that different models in your system might require different
    retraining schedules. For example, consider a recommender system that consists
    of two models: one model to generate embeddings for all products, and another
    model to rank the relevance of each product given a query. The embedding model
    might need to be retrained a lot less frequently than the ranking model. Because
    products’ characteristics don’t change that often, you might be able to get away
    with retraining your embeddings once a week,24 whereas your ranking models might
    need to be retrained once a day.


    The automating script might get even more complicated if there are dependencies
    among your models. For example, because the ranking model depends on the embeddings,
    when the embeddings change, the ranking model should be updated too.


    # Requirements.


    If your company has ML models in production, it’s likely that your company already
    has most of the infrastructure pieces needed for automated retraining. The feasibility
    of this stage revolves around the feasibility of writing a script to automate
    your workflow and configure your infrastructure to automatically:


    +   1. Pull data.

    +   2. Downsample or upsample this data if necessary.

    +   3. Extract features.

    +   4. Process and/or annotate labels to create training data.

    +   5. Kick off the training process.

    +   6. Evaluate the newly trained model.

    +   7. Deploy it.


    How long it will take to write this script depends on many factors, including
    the script writer’s competency. However, in general, the three major factors that
    will affect the feasibility of this script are: scheduler, data, and model store.


    24 You might need to train your embedding model more frequently if you have a
    lot of new items each day.'
