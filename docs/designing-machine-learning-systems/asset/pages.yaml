  md: 'new usage of ML in the real world, how ML systems affect user experience is
    still not well studied. In this section, we''ll discuss three challenges that
    ML systems pose to good user experience and how to address them.


    # Ensuring User Experience Consistency


    When using an app or a website, users expect a certain level of consistency. For
    example, I''m used to Chrome having their “minimize” button on the top left corner
    on my MacBook. If Chrome moved this button to the right, I''d be confused, even
    frustrated.


    ML predictions are probabilistic and inconsistent, which means that predictions
    generated for one user today might be different from what will be generated for
    the same user the next day, depending on the context of the predictions. For tasks
    that want to leverage ML to improve users’ experience, the inconsistency in ML
    predictions can be a hindrance.


    To make this concrete, consider a case study published by Booking.com in 2020.
    When you book accommodations on Booking.com, there are about 200 filters you can
    use to specify your preferences, such as “breakfast included,” “pet friendly,”
    and “non-smoking rooms.” There are so many filters that it takes time for users
    to find the filters that they want. The applied ML team at Booking.com wanted
    to use ML to automatically suggest filters that a user might want, based on the
    filters they’ve used in a given browsing session.


    The challenge they encountered is that if their ML model kept suggesting different
    filters each time, users could get confused, especially if they couldn’t find
    a filter that they had already applied before. The team resolved this challenge
    by creating a rule to specify the conditions in which the system must return the
    same filter recommendations (e.g., when the user has applied a filter) and the
    conditions in which the system can return new recommendations (e.g., when the
    user changes their destination). This is known as the consistency–accuracy trade-off,
    since the recommendations deemed most accurate by the system might not be the
    recommendations that can provide user consistency.


    # Combatting “Mostly Correct” Predictions


    In the previous section, we talked about the importance of ensuring the consistency
    of a model''s predictions. In this section, we’ll talk about how, in some cases,
    we want less consistency and more diversity in a model''s predictions.


