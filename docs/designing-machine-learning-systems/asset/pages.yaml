  md: 'However, not all recommender systems have minute-long feedback loops. If you
    work with longer content types like blog posts or articles or YouTube videos,
    the feedback loop can be hours. If you build a system to recommend clothes for
    users like the one Stitch Fix has, you wouldn''t get feedback until users have
    received the items and tried them on, which could be weeks later.


    # Different Types of User Feedback


    If you want to extract labels from user feedback, it''s important to note that
    there are different types of user feedback. They can occur at different stages
    during a user journey on your app and differ by volume, strength of signal, and
    feedback loop length.


    For example, consider an ecommerce application similar to what Amazon has. Types
    of feedback a user on this application can provide might include clicking on a
    product recommendation, adding a product to cart, buying a product, rating, leaving
    a review, and returning a previously bought product.


    Clicking on a product happens much faster and more frequently (and therefore incurs
    a higher volume) than purchasing a product. However, buying a product is a much
    stronger signal on whether a user likes that product compared to just clicking
    on it.


    When building a product recommender system, many companies focus on optimizing
    for clicks, which give them a higher volume of feedback to evaluate their models.
    However, some companies focus on purchases, which gives them a stronger signal
    that is also more correlated to their business metrics (e.g., revenue from product
    sales). Both approaches are valid. There''s no definite answer to what type of
    feedback you should optimize for your use case, and it merits serious discussions
    between all stakeholders involved.


    Choosing the right window length requires thorough consideration, as it involves
    the speed and accuracy trade-off. A short window length means that you can capture
    labels faster, which allows you to use these labels to detect issues with your
    model and address those issues as soon as possible. However, a short window length
    also means that you might prematurely label a recommendation as bad before it''s
    clicked on.


    No matter how long you set your window length to be, there might still be premature
    negative labels. In early 2021, a study by the Ads team at Twitter found that
    even though the majority of clicks on ads happen within the first five minutes,
    some clicks'
