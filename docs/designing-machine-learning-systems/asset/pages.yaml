- pgno: 199
  md: 'you might never be able to convince your users to trust this system. Even if
    your system isn''t meant to replace human experts and only to aid them in improving
    their productivity, it''s still important to know in what scenarios this system
    would be useful to humans.


    # Existing solutions


    In many cases, ML systems are designed to replace existing solutions, which might
    be business logic with a lot of if/else statements or third-party solutions. It''s
    crucial to compare your new model to these existing solutions. Your ML model doesn''t
    always have to be better than existing solutions to be useful. A model whose performance
    is a little bit inferior can still be useful if it''s much easier or cheaper to
    use.


    When evaluating a model, it''s important to differentiate between “a good system”
    and “a useful system.” A good system isn''t necessarily useful, and a bad system
    isn''t necessarily useless. A self-driving vehicle might be good if it''s a significant
    improvement from previous self-driving systems, but it might not be useful if
    it doesn''t perform at least as well as human drivers. In some cases, even if
    an ML system drives better than an average human, people might still not trust
    it, which renders it not useful. On the other hand, a system that predicts what
    word a user will type next on their phone might be considered bad if it''s much
    worse than a native speaker. However, it might still be useful if its predictions
    can help users type faster some of the time.


    # Evaluation Methods


    In academic settings, when evaluating ML models, people tend to fixate on their
    performance metrics. However, in production, we also want our models to be robust,
    fair, calibrated, and overall make sense. We''ll introduce some evaluation methods
    that help with measuring these characteristics of a model.


    # Perturbation tests


    A group of my students wanted to build an app to predict whether someone has COVID-19
    through their cough. Their best model worked great on the training data, which
    consisted of two-second long cough segments collected by hospitals. However, when
    they deployed it to actual users, this model''s predictions were close to random.


    One of the reasons is that actual users’ coughs contain a lot of noise compared
    to the coughs collected in hospitals. Users’ recordings might contain background
    music or nearby chatter. The microphones they use are of varying quality. They
    might start recording their coughs as soon as recording is enabled or wait for
    a fraction of a second.


    Ideally, the inputs used to develop your model should be similar to the inputs
    your model will have to work with in production, but it''s not possible in many
    cases. This'
