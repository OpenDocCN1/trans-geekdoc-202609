- pgno: 117
  md: 'In most cases, the similarity can only be discovered by more complex methods.
    For example, you might need to use a clustering method or a k-nearest neighbors
    algorithm to discover samples that belong to the same cluster.


    A semi-supervision method that has gained popularity in recent years is the perturbation-based
    method. It’s based on the assumption that small perturbations to a sample shouldn’t
    change its label. So you apply small perturbations to your training instances
    to obtain new training instances. The perturbations might be applied directly
    to the samples (e.g., adding white noise to images) or to their representations
    (e.g., adding small random values to embeddings of words). The perturbed samples
    have the same labels as the unperturbed samples. We’ll discuss more about this
    in the section “Perturbation” on page 114.


    In some cases, semi-supervision approaches have reached the performance of purely
    supervised learning, even when a substantial portion of the labels in a given
    dataset has been discarded.¹⁷


    Semi-supervision is the most useful when the number of training labels is limited.
    One thing to consider when doing semi-supervision with limited data is how much
    of this limited data should be used to evaluate multiple candidate models and
    select the best one. If you use a small amount, the best performing model on this
    small evaluation set might be the one that overfits the most to this set. On the
    other hand, if you use a large amount of data for evaluation, the performance
    boost gained by selecting the best model based on this evaluation set might be
    less than the boost gained by adding the evaluation set to the limited training
    set. Many companies overcome this trade-off by using a reasonably large evaluation
    set to select the best model, then continuing training the champion model on the
    evaluation set.


    # Transfer learning


    Transfer learning refers to the family of methods where a model developed for
    a task is reused as the starting point for a model on a second task. First, the
    base model is trained for a base task. The base task is usually a task that has
    cheap and abundant training data. Language modeling is a great candidate because
    it doesn’t require labeled data. Language models can be trained on any body of
    text—books, Wikipedia articles, chat histories—and the task is: given a sequence
    of tokens,¹⁸ predict the next token. When given the sequence “I bought NVIDIA
    shares because I believe in the importance of,” a language model might output
    “hardware” or “GPU” as the next token.


    17 Avital Oliver, Augustus Odena, Colin Raffel, Ekin D. Cubuk, and Ian J. Goodfellow,
    “Realistic Evaluation of Deep Semi-Supervised Learning Algorithms,” NeurIPS 2018
    Proceedings, https://oreil.ly/dRmPV.


    18 A token can be a word, a character, or part of a word.'
