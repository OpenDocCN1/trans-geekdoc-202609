  md: 'algorithms to beat because a small amount of randomness added to this heuristic
    might lead to worse accuracy.


    The third reason is that class imbalance leads to asymmetric costs of error—the
    cost of a wrong prediction on a sample of the rare class might be much higher
    than a wrong prediction on a sample of the majority class.


    For example, misclassification on an X-ray with cancerous cells is much more dangerous
    than misclassification on an X-ray of a normal lung. If your loss function isn’t
    configured to address this asymmetry, your model will treat all samples the same
    way. As a result, you might obtain a model that performs equally well on both
    majority and minority classes, while you much prefer a model that performs less
    well on the majority class but much better on the minority one.


    When I was in school, most datasets I was given had more or less balanced classes.28
    It was a shock for me to start working and realize that class imbalance is the
    norm. In real-world settings, rare events are often more interesting (or more
    dangerous) than regular events, and many tasks focus on detecting those rare events.


    The classical example of tasks with class imbalance is fraud detection. Most credit
    card transactions are not fraudulent. As of 2018, 6.8¢ for every $100 in cardholder
    spending is fraudulent.29 Another is churn prediction. The majority of your customers
    are probably not planning on canceling their subscription. If they are, your business
    has more to worry about than churn prediction algorithms. Other examples include
    disease screening (most people, fortunately, don’t have terminal illness) and
    resume screening (98% of job seekers are eliminated at the initial resume screening30).


    A less obvious example of a task with class imbalance is object detection. Object
    detection algorithms currently work by generating a large number of bounding boxes
    over an image then predicting which boxes are most likely to have objects in them.
    Most bounding boxes do not contain a relevant object.


    Outside the cases where class imbalance is inherent in the problem, class imbalance
    can also be caused by biases during the sampling process. Consider the case when
    you want to create training data to detect whether an email is spam or not. You
    decide to use all the anonymized emails from your company’s email database. According
    to Talos Intelligence, as of May 2021, nearly 85% of all emails are spam.31 But
    most spam


