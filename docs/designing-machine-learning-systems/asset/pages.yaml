  md: "development environment.¹ To be deployed, your model will have to leave the\
    \ development environment. Your model can be deployed to a staging environment\
    \ for testing or to a production environment to be used by your end users. In\
    \ this chapter, we focus on deploying models to production environments.\n\nBefore\
    \ we move forward, I want to emphasize that production is a spectrum. For some\
    \ teams, production means generating nice plots in notebooks to show to the business\
    \ team. For other teams, production means keeping your models up and running for\
    \ millions of users a day. If your work is in the first scenario, your production\
    \ environment is similar to the development environment, and this chapter is less\
    \ relevant for you. If your work is closer to the second scenario, read on.\n\n\
    I once read somewhere on the internet: deploying is easy if you ignore all the\
    \ hard parts. If you want to deploy a model for your friends to play with, all\
    \ you have to do is to wrap your predict function in a POST request endpoint using\
    \ Flask or FastAPI, put the dependencies this predict function needs to run in\
    \ a container,² and push your model and its associated container to a cloud service\
    \ like AWS or GCP to expose the endpoint:\n\n```\n# Example of how to use FastAPI\
    \ to turn your predict function\n# into a POST endpoint\n@app.route('/predict',\
    \ methods=['POST'])\ndef predict():\n    X = request.get_json()['X']\n    y =\
    \ MODEL.predict(X).tolist()\n    return json.dumps({'y': y}), 200\n```\n\nYou\
    \ can use this exposed endpoint for downstream applications: e.g., when an application\
    \ receives a prediction request from a user, this request is sent to the exposed\
    \ endpoint, which returns a prediction. If you're familiar with the necessary\
    \ tools, you can have a functional deployment in an hour. My students, after a\
    \ 10-week course, were all able to deploy an ML application as their final projects\
    \ even though few have had deployment experience before.³\n\nThe hard parts include\
    \ making your model available to millions of users with a latency of milliseconds\
    \ and 99% uptime, setting up the infrastructure so that the right person can be\
    \ immediately notified when something goes wrong, figuring out what went wrong,\
    \ and seamlessly deploying the updates to fix what's wrong.\n\n1 We'll cover development\
    \ environments in detail in Chapter 10.\n\n2 We'll go more into containers in\
    \ Chapter 9.\n\n3 CS 329S: Machine Learning Systems Design at Stanford; you can\
