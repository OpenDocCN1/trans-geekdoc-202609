  md: 'noises”; and data synthesis. In each type, we’ll go over examples for both
    computer vision and NLP.


    # Simple Label-Preserving Transformations


    In computer vision, the simplest data augmentation technique is to randomly modify
    an image while preserving its label. You can modify the image by cropping, flipping,
    rotating, inverting (horizontally or vertically), erasing part of the image, and
    more. This makes sense because a rotated image of a dog is still a dog. Common
    ML frameworks like PyTorch, TensorFlow, and Keras all have support for image augmentation.
    According to Krizhevsky et al. in their legendary AlexNet paper, “The transformed
    images are generated in Python code on the CPU while the GPU is training on the
    previous batch of images. So these data augmentation schemes are, in effect, computationally
    free.”48


    In NLP, you can randomly replace a word with a similar word, assuming that this
    replacement wouldn’t change the meaning or the sentiment of the sentence, as shown
    in Table 4-9. Similar words can be found either with a dictionary of synonymous
    words or by finding words whose embeddings are close to each other in a word embedding
    space.


    *Table 4-9. Three sentences generated from an original sentence*


    | Original sentence | I''m so happy to see you. |

    |---|---|

    | Generated sentences | I''m so glad to see you. |

    | | I''m so happy to see y''all. |

    | | I''m very happy to see you. |


    This type of data augmentation is a quick way to double or triple your training
    data.


    # Perturbation


    Perturbation is also a label-preserving operation, but because sometimes it’s
    used to trick models into making wrong predictions, I thought it deserves its
    own section.


    Neural networks, in general, are sensitive to noise. In the case of computer vision,
    this means that adding a small amount of noise to an image can cause a neural
    network to misclassify it. Su et al. showed that 67.97% of the natural images
    in the Kaggle CIFAR-10 test dataset and 16.04% of the ImageNet test images can
    be misclassified by changing just one pixel (see Figure 4-12).49


    48 Alex Krizhevsky, Ilya Sutskever, and Geoffrey E. Hinton, “ImageNet Classification
    with Deep Convolutional Neural Networks, 2012, https://oreil.ly/aphZA.


    49 Jiawei Su, Danilo Vasconcellos Vargas, and Sakurai Kouichi, “One Pixel Attack
    for Fooling Deep Neural Networks,” IEEE Transactions on Evolutionary Computation
    23, no. 5 (2019): 828–41, https://oreil.ly/LzN9D.'
