- pgno: 227
  md: 'techniques can reduce the nonzero parameter counts of trained networks by over
    90%, decreasing storage requirements and improving computational performance of
    inference without compromising overall accuracy.26 In Chapter 11, we’ll discuss
    how pruning can introduce biases into your model.


    While it’s generally agreed that pruning works,27 there have been many discussions
    on the actual value of pruning. Liu et al. argued that the main value of pruning
    isn’t in the inherited “important weights” but in the pruned architecture itself.28
    In some cases, pruning can be useful as an architecture search paradigm, and the
    pruned architecture should be retrained from scratch as a dense model. However,
    Zhu et al. showed that the large sparse model after pruning outperformed the retrained
    dense counterpart.29


    # Quantization


    *Quantization* is the most general and commonly used model compression method.
    It’s straightforward to do and generalizes over tasks and architectures.


    Quantization reduces a model’s size by using fewer bits to represent its parameters.
    By default, most software packages use 32 bits to represent a float number (single
    precision floating point). If a model has 100M parameters and each requires 32
    bits to store, it’ll take up 400 MB. If we use 16 bits to represent a number,
    we’ll reduce the memory footprint by half. Using 16 bits to represent a float
    is called half precision.


    Instead of using floats, you can have a model entirely in integers; each integer
    takes only 8 bits to represent. This method is also known as “fixed point.” In
    the extreme case, some have attempted the 1-bit representation of each weight
    (binary weight neural networks), e.g., BinaryConnect and XNOR-Net.30 The authors
    of the XNOR-Net paper spun off Xnor.ai, a startup that focused on model compression.
    In early 2020, it was acquired by Apple for a reported $200M.31


    26 Jonathan Frankle and Michael Carbin, “The Lottery Ticket Hypothesis: Finding
    Sparse, Trainable Neural Networks,” ICLR 2019, https://oreil.ly/chdl.


    27 Davis Blalock, Jose Javier Gonzalez Ortiz, Jonathan Frankle, and John Guttag,
    “What Is the State of Neural Network Pruning?” arXiv, March 6, 2020, https://oreil.ly/VQsC3.


    28 Zhuang Liu, Mingjie Sun, Tinghui Zhou, Gao Huang, and Trevor Darrell, “Rethinking
    the Value of Network Pruning,” arXiv, March 5, 2019, https://oreil.ly/mB4IZ.


    29 Michael Zhu and Suyog Gupta, “To Prune, or Not to Prune: Exploring the Efficacy
    of Pruning for Model Compression,” arXiv, November 13, 2017, https://oreil.ly/KBRjy.


    30 Matthieu Courbariaux, Yoshua Bengio, and Jean-Pierre David, “BinaryConnect:
    Training Deep Neural Networks with Binary Weights During Propagations,” arXiv,
    November 2, 2015, https://oreil.ly/Fwp2G; Mohammad Rastegari, Vicente Ordonez,
    Joseph Redmon, and Ali Farhadi, “XNOR-Net: ImageNet Classification Using Binary
    Convolutional Neural Networks,” arXiv, August 2, 2016, https://oreil.ly/gr3Ay.


    31 Alan Boyle, Taylor Soper, and Todd Bishop, “Exclusive: Apple Acquires Xnor.ai,
    Edge AI Spin-out from Paul Allen’s AI2, for Price in $200M Range,” GeekWire, January
    15, 2020, https://oreil.ly/HgaxC.'
