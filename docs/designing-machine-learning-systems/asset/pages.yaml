- pgno: 135
  md: 'In NLP, templates can be a cheap way to bootstrap your model. One team I worked
    with used templates to bootstrap training data for their conversational AI (chatbot).
    A template might look like: “Find me a [CUISINE] restaurant within [NUMBER] miles
    of [LOCATION]” (see Table 4-10). With lists of all possible cuisines, reasonable
    numbers (you would probably never want to search for restaurants beyond 1,000
    miles), and locations (home, office, landmarks, exact addresses) for each city,
    you can generate thousands of training queries from a template.


    # Table 4-10. Three sentences generated from a template


    | Template | Find me a [CUISINE] restaurant within [NUMBER] miles of [LOCATION].
    |

    | Generated queries | Find me a Vietnamese restaurant within 2 miles of my office.
    |

    |  | Find me a Thai restaurant within 5 miles of my home. |

    |  | Find me a Mexican restaurant within 3 miles of Google headquarters. |


    In computer vision, a straightforward way to synthesize new data is to combine
    existing examples with discrete labels to generate continuous labels. Consider
    a task of classifying images with two possible labels: DOG (encoded as 0) and
    CAT (encoded as 1). From example x₁ of label DOG and example x₂ of label CAT,
    you can generate x′ such as:


    ```

    x′ = γx₁ + (1 − γ)x₂

    ```


    The label of x′ is a combination of the labels of x₁ and x₂: γ × 0 + (1 − γ) ×
    1. This method is called mixup. The authors showed that mixup improves models’
    generalization, reduces their memorization of corrupt labels, increases their
    robustness to adversarial examples, and stabilizes the training of generative
    adversarial networks.⁵⁵


    Using neural networks to synthesize training data is an exciting approach that
    is actively being researched but not yet popular in production. Sandfort et al.
    showed that by adding images generated using CycleGAN to their original training
    data, they were able to improve their model’s performance significantly on computed
    tomography (CT) segmentation tasks.⁵⁶


    If you’re interested in learning more about data augmentation for computer vision,
    “A Survey on Image Data Augmentation for Deep Learning” (Shorten and Khoshgoftaar
    2019) is a comprehensive review.


    55 Hongyi Zhang, Moustapha Cisse, Yann N. Dauphin, and David Lopez-Paz, “mixup:
    Beyond Empirical Risk Minimization,” ICLR 2018, https://oreil.ly/IlM5E.


    56 Veit Sandfort, Ke Yan, Perry J. Pickhardt, and Ronald M. Summers, “Data Augmentation
    Using Generative Adversarial Networks (CycleGAN) to Improve Generalizability in
    CT Segmentation Tasks,” Scientific Reports 9, no. 1 (2019): 16884, https://oreil.ly/TDUwm.'
