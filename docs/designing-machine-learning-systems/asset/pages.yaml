- pgno: 124
  md: '# Using the right evaluation metrics


    The most important thing to do when facing a task with class imbalance is to choose
    the appropriate evaluation metrics. Wrong metrics will give you the wrong ideas
    of how your models are doing and, subsequently, won’t be able to help you develop
    or choose models good enough for your task.


    The overall accuracy and error rate are the most frequently used metrics to report
    the performance of ML models. However, these are insufficient metrics for tasks
    with class imbalance because they treat all classes equally, which means the performance
    of your model on the majority class will dominate these metrics. This is especially
    bad when the majority class isn’t what you care about.


    Consider a task with two labels: CANCER (the positive class) and NORMAL (the negative
    class), where 90% of the labeled data is NORMAL. Consider two models, A and B,
    with the confusion matrices shown in Tables 4-4 and 4-5.


    Table 4-4. Model A’s confusion matrix; model A can detect 10 out of 100 CANCER
    cases


    | Model A | Actual CANCER | Actual NORMAL |

    |---|---|---|

    | Predicted CANCER | 10 | 10 |

    | Predicted NORMAL | 90 | 890 |


    Table 4-5. Model B’s confusion matrix; model B can detect 90 out of 100 CANCER
    cases


    | Model B | Actual CANCER | Actual NORMAL |

    |---|---|---|

    | Predicted CANCER | 90 | 90 |

    | Predicted NORMAL | 10 | 810 |


    If you’re like most people, you’d probably prefer model B to make predictions
    for you since it has a better chance of telling you if you actually have cancer.
    However, they both have the same accuracy of 0.9.


    Metrics that help you understand your model’s performance with respect to specific
    classes would be better choices. Accuracy can still be a good metric if you use
    it for each class individually. The accuracy of model A on the CANCER class is
    10% and the accuracy of model B on the CANCER class is 90%.'
