  md: '# Data-level methods: Resampling


    Data-level methods modify the distribution of the training data to reduce the
    level of imbalance to make it easier for the model to learn. A common family of
    techniques is resampling. Resampling includes oversampling, adding more instances
    from the minority classes, and undersampling, removing instances of the majority
    classes. The simplest way to undersample is to randomly remove instances from
    the majority class, whereas the simplest way to oversample is to randomly make
    copies of the minority class until you have a ratio that you’re happy with. Figure
    4-10 shows a visualization of oversampling and undersampling.


    ![](img/bde3d1ed5ea7825115c846be3467945f_127_0.png)


    Figure 4-10. Illustrations of how undersampling and oversampling work. Source:
    Adapted from an image by Rafael Alencar37


    A popular method of undersampling low-dimensional data that was developed back
    in 1976 is Tomek links.38 With this technique, you find pairs of samples from
    opposite classes that are close in proximity and remove the sample of the majority
    class in each pair.


    While this makes the decision boundary more clear and arguably helps models learn
    the boundary better, it may make the model less robust because the model doesn’t
    get to learn from the subtleties of the true decision boundary.


    A popular method of oversampling low-dimensional data is SMOTE (synthetic minority
    oversampling technique).39 It synthesizes novel samples of the minority class


    37 Rafael Alencar, “Resampling Strategies for Imbalanced Datasets,” Kaggle, https://oreil.ly/p8Whs.


    38 Ivan Tomek, “An Experiment with the Edited Nearest-Neighbor Rule,” IEEE Transactions
    on Systems, Man, and Cybernetics (June 1976): 448–52, https://oreil.ly/JCxHZ.


    39 N.V. Chawla, K.W. Bowyer, L.O. Hall, and W.P. Kegelmeyer, “SMOTE: Synthetic
    Minority Over-sampling Technique, Journal of Artificial Intelligence Research
    16 (2002): 341–78, https://oreil.ly/f6y46.'
  merge: -1
