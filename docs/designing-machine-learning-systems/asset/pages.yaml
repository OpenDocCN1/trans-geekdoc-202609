  md: 'However, collecting and sharing datasets might violate the privacy and security
    of the users whose data is part of these datasets. To protect users, there have
    been calls for anonymization of personally identifiable information (PII). According
    to the US Department of Labor, PII is defined as “any representation of information
    that permits the identity of an individual to whom the information applies to
    be reasonably inferred by either direct or indirect means” such as name, address,
    or telephone number.16


    However, anonymization may not be a sufficient guarantee for preventing data misuse
    and erosion of privacy expectations. In 2018, online fitness tracker Strava published
    a heatmap showing the paths it records of its users around the world as they exercise,
    e.g., running, jogging, or swimming. The heatmap was aggregated from one billion
    activities recorded between 2015 and September 2017, covering 27 billion kilometers
    of distance. Strava stated that the data used had been anonymized, and “excludes
    activities that have been marked as private and user-defined privacy zones.”17


    Since Strava was used by military personnel, their public data, despite anonymization,
    allowed people to discover patterns that expose activities of US military bases
    overseas, including the “forward operating bases in Afghanistan, Turkish military
    patrols in Syria, and a possible guard patrol in the Russian operating area of
    Syria.”18 An example of these discriminating patterns is shown in Figure 11-4.
    Some analysts even suggested that the data could reveal the names and heart rates
    of individual Strava users.19


    So where did the anonymization go wrong? First, Strava’s default privacy setting
    was “opt-out,” meaning that it requires users to manually opt out if they don’t
    want their data to be collected. However, users have pointed out that these privacy
    settings aren’t always clear and can cause surprises to users.20 Some of the privacy
    settings can only be changed through the Strava website rather than in its mobile
    app. This shows the importance of educating users about your privacy settings.
    Better, data opt-in (data collecting isn’t by default), not opt-out, should be
    the default.


    16 “Guidance on the Protection of Personal Identifiable Information,” US Department
    of Labor, https://oreil.ly/FokAV


    17 Sasha Lekach, “Strava’s Fitness Heatmap Has a Major Security Problem for the
    Military,” Mashable, January 28, 2018, https://oreil.ly/9ogYx.


    18 Jeremy Hsu, “The Strava Heat Map and the End of Secrets,” Wired, January 29,
    2018, https://oreil.ly/mB0GD.


    19 Matt Burgess, “Strava’s Heatmap Data Lets Anyone See the Names of People Exercising
    on Military Bases,” Wired, January 30, 2018, https://oreil.ly/eJPdj.


    20 Matt Burgess, “Strava’s Heatmap Data Lets Anyone See”; Rosie Spinks, “Using
    a Fitness App Taught Me the Scary Truth About Why Privacy Settings Are a Feminist
    Issue,” Quartz, August 1, 2017, https://oreil.ly/DO3WR.'
