- pgno: 187
  md: 'A challenging problem is how to accurately and effectively accumulate gradients
    from different machines. As each machine produces its own gradient, if your model
    waits for all of them to finish a run—synchronous stochastic gradient descent
    (SGD)—stragglers will cause the entire system to slow down, wasting time and resources.14
    The straggler problem grows with the number of machines, as the more workers,
    the more likely that at least one worker will run unusually slowly in a given
    iteration. However, there have been many algorithms that effectively address this
    problem.15


    If your model updates the weight using the gradient from each machine separately—
    asynchronous SGD—gradient staleness might become a problem because the gradients
    from one machine have caused the weights to change before the gradients from another
    machine have come in.16


    The difference between synchronous SGD and asynchronous SGD is illustrated in
    Figure 6-6.


    ![](img/bde3d1ed5ea7825115c846be3467945f_187_0.png)


    Figure 6-6. Synchronous SGD versus asynchronous SGD for data parallelism. Source:
    Adapted from an image by Jim Dowling17


    14 Dipankar Das, Sasikanth Avancha, Dheevatsa Mudigere, Karthikeyan Vaidynathan,
    Srinivas Sridharan, Dhiraj Kalamkar, Bharat Kaul, and Pradeep Dubey, “Distributed
    Deep Learning Using Synchronous Stochastic Gradient Descent,” arXiv, February
    22, 2016, https://oreil.ly/ma8Y6.


    15 Jianmin Chen, Xinghao Pan, Rajat Monga, Samy Bengio, and Rafal Jozefowicz,
    “Revisiting Distributed Synchronous SGD,” ICLR 2017, https://oreil.ly/dzVZ5; Matei
    Zaharia, Andy Konwinski, Anthony D. Joseph, Randy Katz, and Ion Stoica, “Improving
    MapReduce Performance in Heterogeneous Environments,” 8th USENIX Symposium on
    Operating Systems Design and Implementation, https://oreil.ly/FWswd; Aaron Harlap,
    Henggang Cui, Wei Dai, Jinliang Wei, Gregory R. Ganger, Phillip B. Gibbons, Garth
    A. Gibson, and Eric P. Xing, “Addressing the Straggler Problem for Iterative Convergent
    Parallel ML” (SoCC ’16, Santa Clara, CA, October 5–7, 2016), https://oreil.ly/wZgOO.


    16 Jeffrey Dean, Greg Corrado, Rajat Monga, Kai Chen, Matthieu Devin, Mark Mao,
    Marc’aurelio Ranzato, et al., “Large Scale Distributed Deep Networks,” NIPS 2012,
    https://oreil.ly/EWPun.


    17 Jim Dowling, “Distributed TensorFlow,” O’Reilly Media, December 19, 2017, https://oreil.ly/VYIOP.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'In theory, asynchronous SGD converges but requires more steps than synchronous
    SGD. However, in practice, when the number of weights is large, gradient updates
    tend to be sparse, meaning most gradient updates only modify small fractions of
    the parameters, and it''s less likely that two gradient updates from different
    machines will modify the same weights. When gradient updates are sparse, gradient
    staleness becomes less of a problem and the model converges similarly for both
    synchronous and asynchronous SGD.18


    Another problem is that spreading your model on multiple machines can cause your
    batch size to be very big. If a machine processes a batch size of 1,000, then
    1,000 machines process a batch size of 1M (OpenAI''s GPT-3 175B uses a batch size
    of 3.2M in 2020).19 To oversimplify the calculation, if training an epoch on a
    machine takes 1M steps, training on 1,000 machines might take only 1,000 steps.
    An intuitive approach is to scale up the learning rate to account for more learning
    at each step, but we also can''t make the learning rate too big as it will lead
    to unstable convergence. In practice, increasing the batch size past a certain
    point yields diminishing returns.20


    Last but not least, with the same model setup, the main worker sometimes uses
    a lot more resources than other workers. If that''s the case, to make the most
    use out of all machines, you need to figure out a way to balance out the workload
    among them. The easiest way, but not the most effective way, is to use a smaller
    batch size on the main worker and a larger batch size on other workers.


    # Model parallelism


    With data parallelism, each worker has its own copy of the whole model and does
    all the computation necessary for its copy of the model. Model parallelism is
    when different components of your model are trained on different machines, as
    shown in Figure 6-7. For example, machine 0 handles the computation for the first
    two layers while machine 1 handles the next two layers, or some machines can handle
    the forward pass while several others handle the backward pass.


    18 Feng Niu, Benjamin Recht, Christopher Ré, and Stephen J. Wright, “Hogwild!:
    A Lock-Free Approach to Parallelizing Stochastic Gradient Descent,” 2011, https://oreil.ly/sAEbv.


    19 Tom B. Brown, Benjamin Mann, Nick Ryder, Melanie Subbiah, Jared Kaplan, Prafulla
    Dhariwal, Arvind Neelakantan, et al., “Language Models Are Few-Shot Learners,”
    arXiv, May 28, 2020, https://oreil.ly/qjg2S.


    20 Sam McCandlish, Jared Kaplan, Dario Amodei, and OpenAI Dota Team, “An Empirical
    Model of Large-Batch Training,” arXiv, December 14, 2018, https://oreil.ly/mcjbV;
    Christopher J. Shallue, Jaehoon Lee, Joseph Antognini, Jascha Sohl-Dickstein,
    Roy Frostig, and George E. Dahl, “Measuring the Effects of Data Parallelism on
    Neural Network Training,” Journal of Machine Learning Research 20 (2019): 1–49,
    https://oreil.ly/YAEOM.'
