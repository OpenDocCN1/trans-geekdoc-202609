- pgno: 140
  md: 'Feature engineering requires knowledge of domain-specific techniques—in this
    case, the domain is natural language processing (NLP) and the native language
    of the text. It tends to be an iterative process, which can be brittle. When I
    followed this method for one of my early NLP projects, I kept having to restart
    my process either because I had forgotten to apply one technique or because one
    technique I used turned out to be working poorly and I had to undo it.


    However, much of this pain has been alleviated since the rise of deep learning.
    Instead of having to worry about lemmatization, punctuation, or stopword removal,
    you can just split your raw text into words (i.e., tokenization), create a vocabulary
    out of those words, and convert each of your words into one-shot vectors using
    this vocabulary. Your model will hopefully learn to extract useful features from
    this. In this new method, much of feature engineering for text has been automated.
    Similar progress has been made for images too. Instead of having to manually extract
    features from raw images and input those features into your ML models, you can
    just input raw images directly into your deep learning models.


    However, an ML system will likely need data beyond just text and images. For example,
    when detecting whether a comment is spam or not, on top of the text in the comment
    itself, you might want to use other information about:


    +   - *The comment*

    +     - How many upvotes/downvotes does it have?

    +   - *The user who posted this comment*

    +     - When was this account created, how often do they post, and how many upvotes/downvotes
    do they have?

    +   - *The thread in which the comment was posted*

    +     - How many views does it have? Popular threads tend to attract more spam.


    There are many possible features to use in your model. Some of them are shown
    in Figure 5-2. The process of choosing what information to use and how to extract
    this information into a format usable by your ML models is feature engineering.
    For complex tasks such as recommending videos for users to watch next on TikTok,
    the number of features used can go up to millions. For domain-specific tasks such
    as predicting whether a transaction is fraudulent, you might need subject matter
    expertise with banking and frauds to be able to come up with useful features.'
