- pgno: 274
  md: 'So far, we’ve discussed different types of metrics to monitor, from operational
    metrics generally used for software systems to ML-specific metrics that help you
    keep track of the health of your ML models. In the next section, we’ll discuss
    the toolbox you can use to help with metrics monitoring.


    # Monitoring Toolbox


    Measuring, tracking, and interpreting metrics for complex systems is a nontrivial
    task, and engineers rely on a set of tools to help them do so. It’s common for
    the industry to herald metrics, logs, and traces as the three pillars of monitoring.
    However, I find their differentiations murky. They seem to be generated from the
    perspective of people who develop monitoring systems: traces are a form of logs
    and metrics can be computed from logs. In this section, I’d like to focus on the
    set of tools from the perspective of users of the monitoring systems: logs, dashboards,
    and alerts.


    # Logs


    Traditional software systems rely on logs to record events produced at runtime.
    An event is anything that can be of interest to the system developers, either
    at the time the event happens or later for debugging and analysis purposes. Examples
    of events are when a container starts, the amount of memory it takes, when a function
    is called, when that function finishes running, the other functions that this
    function calls, the input and output of that function, etc. Also, don’t forget
    to log crashes, stack traces, error codes, and more. In the words of Ian Malpass
    at Etsy, “If it moves, we track it.”⁴⁹ They also track things that haven’t changed
    yet, in case they’ll move later.


    The number of logs can grow very large very quickly. For example, back in 2019,
    the dating app Badoo was handling 20 billion events a day.⁵⁰ When something goes
    wrong, you’ll need to query your logs for the sequence of events that caused it,
    a process that can feel like searching for a needle in a haystack.


    In the early days of software deployment, an application might be one single service.
    When something happened, you knew where that happened. But today, a system might
    consist of many different components: containers, schedulers, microservices, polyglot
    persistence, mesh routing, ephemeral auto-scaling instances, serverless Lambda
    functions. A request may do 20–30 hops from when it’s sent until when a response
    is received. The hard part might not be in detecting when something happened,
    but where the problem was.⁵¹


    49 Ian Malpass, “Measure Anything, Measure Everything,” Code as Craft, February
    15, 2011, https://oreil.ly/3KF1K.


    50 Andrew Morgan, “Data Engineering in Badoo: Handling 20 Billion Events Per Day,”
    InfoQ, August 9, 2019, https://oreil.ly/qnnuV.


    51 Charity Majors, “Observability—A 3-Year Retrospective,” The New Stack, August
    6, 2019, https://oreil.ly/Logby.'
