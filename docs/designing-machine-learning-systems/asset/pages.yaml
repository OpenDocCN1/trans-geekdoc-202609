- pgno: 22
  md: '# 2. Complex patterns: there are patterns to learn, and they are complex


    ML solutions are only useful when there are patterns to learn. Sane people don''t
    invest money into building an ML system to predict the next outcome of a fair
    die because there''s no pattern in how these outcomes are generated.⁴ However,
    there are patterns in how stocks are priced, and therefore companies have invested
    billions of dollars in building ML systems to learn those patterns.


    Whether a pattern exists might not be obvious, or if patterns exist, your dataset
    or ML algorithms might not be sufficient to capture them. For example, there might
    be a pattern in how Elon Musk''s tweets affect cryptocurrency prices. However,
    you wouldn''t know until you''ve rigorously trained and evaluated your ML models
    on his tweets. Even if all your models fail to make reasonable predictions of
    cryptocurrency prices, it doesn''t mean there''s no pattern.


    Consider a website like Airbnb with a lot of house listings; each listing comes
    with a zip code. If you want to sort listings into the states they are located
    in, you wouldn''t need an ML system. Since the pattern is simple—each zip code
    corresponds to a known state—you can just use a lookup table.


    The relationship between a rental price and all its characteristics follows a
    much more complex pattern, which would be very challenging to manually specify.
    ML is a good solution for this. Instead of telling your system how to calculate
    the price from a list of characteristics, you can provide prices and characteristics,
    and let your ML system figure out the pattern. The difference between ML solutions
    and the lookup table solution as well as general traditional software solutions
    is shown in Figure 1-2. For this reason, ML is also called Software 2.0.⁵


    ML has been very successful with tasks with complex patterns such as object detection
    and speech recognition. What is complex to machines is different from what is
    complex to humans. Many tasks that are hard for humans to do are easy for machines—for
    example, raising a number of the power of 10. On the other hand, many tasks that
    are easy for humans can be hard for machines—for example, deciding whether there''s
    a cat in a picture.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '![](img/bde3d1ed5ea7825115c846be3467945f_23_0.png)


    Figure 1-2. Instead of requiring hand-specified patterns to calculate outputs,
    ML solutions learn patterns from inputs and outputs


    # 3. Existing data: data is available, or it''s possible to collect data


    Because ML learns from data, there must be data for it to learn from. It''s amusing
    to think about building a model to predict how much tax a person should pay a
    year, but it''s not possible unless you have access to tax and income data of
    a large population.


    In the zero-shot learning (sometimes known as zero-data learning) context, it''s
    possible for an ML system to make good predictions for a task without having been
    trained on data for that task. However, this ML system was previously trained
    on data for other tasks, often related to the task in consideration. So even though
    the system doesn''t require data for the task at hand to learn from, it still
    requires data to learn.


    It''s also possible to launch an ML system without data. For example, in the context
    of continual learning, ML models can be deployed without having been trained on
    any data, but they will learn from incoming data in production.⁶ However, serving
    insufficiently trained models to users comes with certain risks, such as poor
    customer experience.


    Without data and without continual learning, many companies follow a “fake-it-til-you
    make it” approach: launching a product that serves predictions made by humans,
    instead of ML models, with the hope of using the generated data to train ML models
    later.


    6 We''ll go over online learning in Chapter 9.'
  merge: -1
