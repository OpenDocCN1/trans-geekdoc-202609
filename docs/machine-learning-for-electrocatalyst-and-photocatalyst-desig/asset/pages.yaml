- pgno: 4
  md: 'measured and because some potentially relevant factors may be neglected (e.g.,
    shape of reactor, stirring speed, different solvent). Close cooperation among
    materials scientists, catalyst scientists, and computer scientists on the use
    of a standard format for data recording and evaluation of the reliability of published
    data is very important for generating high-quality ML models.


    Materials data sets can also be built from experimental and simulation data, where
    all the data are acquired under similar conditions. Typically, high throughput
    experiments generate large quantities of data for a specific system.21,22,24,25,65–68
    Conspicuously, all experiments contribute to data set construction, as failed
    experiments contain valuable information identifying the molecular determinants
    of success and failure.69 A web-accessible public database (http://darkreactions.haverford.edu)
    has been developed to extract data from laboratory notebooks and ongoing experimental
    data.70 These data from failed experiments have been beneficial for the design
    of chemical syntheses.


    High throughput computation is also a viable way to accumulate materials data.22,71–75
    Using thermodynamic and electronic structure methods, data sets of virtual materials
    or local properties of materials can be generated that are useful for materials
    analysis and discovery using ML tools.30,74 ML can predict the results of electronic
    structure calculations when trained on previous calculation results, effectively
    leveraging these expensive and resource-intensive first principle calculations
    much more broadly across materials space.76,77 High throughput calculations accelerate
    the growth of computed materials databases such as AFLOWLIB and Materials Project.
    These databases also provide open-source platforms for researchers to implement
    high throughput calculations.78,79


    # 2.2. Featurization


    After data collection, materials must be transformed into an appropriate mathematical
    form used to train ML models.80 This involves describing key attributes of molecules,
    compounds, clusters on surfaces of compounds, materials etc., by a series of numbers
    of numbers (vectors or tensors).80,81 These numbers are materials attributes called
    descriptors, features, or fingerprints in the literature. The process of generating
    these mathematical representations of material objects is called featurization
    or feature engineering and it is of critical importance to the quality and interpretability
    of the models trained using them. This step required the most human intuition
    and intervention but recent development in automatic featurization of molecular
    objects using specific types of deep neural networks promises paradigm shifts
    in this process.82–84 Featurization consists of two steps: descriptor generation
    and descriptor selection.


    # 2.2.1. Descriptor Generation.


    Effective descriptors must discriminate between objects in the data space and
    encode attributes that are relevant to the property being modeled and predicted.31,34
    Despite the large number of descriptors that can be generated for molecules and
    materials, the choice of these descriptors is strongly dependent on the scientific
    problem to be solved.31 Although descriptor generation is context dependent, there
    are still some common rules. First, the descriptor set must provide unique information,
    such as structure, composition, and physicochemical properties of the materials
    to ensure they are distinct for each material. Second, the number of descriptors
    used should not be very large to avoid overfitting models and compromising their
    ability to predict properties of new data. Redundant or correlated descriptors
    should be removed to minimize the size of the descriptor set to avoid overfitting,
    especially in electro/photocatalyst research where the data sets tend to be small.
    It has been shown that as additional irrelevant descriptors are added to descriptor
    sets, the quality of a partial least-squares model, for example, is degraded.85
    Redundant descriptors include those having high correlation with other descriptors
    in the set, those whose values do not change much across the data set (low variance),
    and those that have very low correlation with the property being modeled. To avoid
    overfitting, the number of fitted variables in a model should be much less than
    half of the number of the training examples.16,86


    In general, descriptors can be divided into different classes depending on the
    information they encode. As well as encoding structural, compositional, and physicochemical
    properties of materials, they can also include provenance information of how the
    material was synthesized or subsequently processed. Experimentally derived descriptors
    may include temperature, pH value, pressure, reaction time, and the amount of
    the reactants. Compositional descriptors relate to the composition of each component
    in complex materials. Topographical descriptors pertain to the texture of a material
    (pore size, volume, surface area, topological shape), while topological descriptors
    encode the connectivity of atoms in materials. Some descriptors can be readily
    extracted from physicochemical handbooks or material databases. For example, atomic
    descriptors refer to the atomic attributes like atomic radii, masses, the number
    of protons and valence electrons, etc., physical descriptors are mainly related
    to the macroscopic attributes of materials such as melting point, boiling point,
    density and solubility, and some electronic descriptors encode microscopic attributes
    (electronegativity, ionization energy, etc.).87 Many types of descriptors can
    be obtained by calculation, such as structural descriptors and some electronic
    descriptors (bandgap, dipole moment, highest occupied molecular orbital (HOMO),
    lowest occupied molecular orbital (LUMO), d-band characteristics, etc.).88,89
    Spectra-based descriptors are derived from experimental measurements (e.g., X-ray
    diffraction, extended X-ray absorption fine structure (EXAFS), etc.).90 The acquisition
    of these descriptors may be relatively costly and time-consuming. Clearly, computational
    descriptors are preferred because they do not require experiments to derive them.
    Apart from cost and time considerations, more importantly, they are the only way
    to predict properties of materials not yet synthesized.


    Table 2 summarizes typical descriptors used in a variety of electrocatalysis and
    photocatalysis models. Although the relevance of descriptors is assessed by the
    performance of the model, experience and intuition are useful in descriptor selection.
    For example, experimental descriptors would be used in the case of synthesis optimization,91
    while compositional descriptors would be better suited to describe the materials
    undergoing composition optimization.92 When texture–property relationships or
    structure–property relationships are interpreted, topographical and topological
    descriptors, atomic descriptors, and electronic descriptors would be used collectively.87,93–96
    For instance, electronegativity and ion radii are commonly used as descriptors
    for different perovskite catalysts,97–99 these features play pivotal roles in
    Pauling''s Rule and tolerance factor that are useful in understanding and predicting
    the stability of perovskites.100,101'
