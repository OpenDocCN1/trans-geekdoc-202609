  md: '![](img/385acff8214d70e1094d2d47342cdb40_7_0.png)


    **Figure 3.** Overview of the popular ML algorithms in materials science and their
    selection (only exemplary techniques are noted in the figure). The selection of
    ML algorithms depends on the structure of the data set and type of target. Dimension
    reduction is applied if the number of features for each data entry is too large.
    Unsupervised learning is employed if the data are unlabeled, and supervised learning
    if it is labeled. Regression algorithms model continuous data, while classification
