  md: '# 2.4. Model Validation


    Models must be validated by determining how accurately they predict the properties
    of the training set and, more importantly, unknown data. The coefficient of determination
    (r²), root-mean-square error (RMSE), and mean average error (MAE), are common
    metrics used to assess model quality. For a data set of size n, with measured
    properties ⟨y₁, y₂, ..., yₙ⟩, property average ȳ, and predicted values ⟨ŷ₁, ŷ₂,
    ..., ŷₙ⟩, these and other metrics are calculated by


    r² = 1 − [Σᵢ₌₁ⁿ(yᵢ − ŷᵢ)² / Σᵢ₌₁ⁿ(yᵢ − ȳ)²] = [Σᵢ₌₁ⁿ(ŷᵢ − ȳ)² / Σᵢ₌₁ⁿ(yᵢ − ȳ)²]  (5)


    RMSE = √[Σᵢ₌₁ⁿ(ŷᵢ − yᵢ)² / n]  (6)


    MAE = Σᵢ₌₁ⁿ|yᵢ − ŷᵢ| / n  (7)


    Good models have a r² value close to 1 and RMSE and MAE values close to 0. The
    r² value depends on the size of the training set and number of parameters in the
    model, while the RMSE or MAE values do not. MAE is less affected by large outliers
    than RMSE. Therefore, the use of RMSE or MAE to assess model predictivity is preferred.


    For classification models, precision, recall, and accuracy metrics are widely
    used:


    precision = TP / (TP + FP)  (8)


    recall = TP / (TP + FN) = TP / P  (9)


    accuracy = (TP + TN) / (TP + TN + FP + FN)  (10)


    where TP refers to true positive, which means the positive cases are correctly
    labeled by the classifier; TN refers to true negative, the negative cases which
    are correctly labeled; FP to the false positive, the positive cases which are
    incorrectly labeled; FN to the false negative, the negative cases which are incorrectly
    labeled; and P is the number of positive cases. Precision and recall can be combined
    as a single metric, the F1 score:


    F1 = 2 × precision × recall / (precision + recall)  (11)


    The F1-score and related G-mean (geometric mean of recall and precision) are common
    in the literature. They are more useful in cases where the classes are unbalanced
    in the data set (many more data points of one class than the other) because accuracy
    is misleading. For a good classifier, the precision, recall, accuracy, F1 score,
    and G-mean should all be close to 1.


    The causes of poor model metrics include use of low relevance descriptors; underfitting
    because of too simple a model (e.g., linear vs nonlinear model); overfitting because
    of too many descriptors; or data sets in which some features are not well represented
    because of their small size or high diversity and the model cannot learn the features
    of the data properly. Underfitting can be avoided by comparing both linear and
    nonlinear ML methods, descriptors should be studied for their relevance (e.g.,
    using correlation), and those


    not well represented in the data set excluded. If possible, the size of the data
    set should be expanded, in some cases by imputation where data are missing.


    When models are too complex or have too many descriptors, they may suffer from
    overfitting. Overfitted models make very good predictions of the training data
    but poor predictions for new data. Overfitting can be detected by use of training
    and test sets. The original data set is partitioned into two sets, a training
    set used to construct the model, and a test set for model validation. Typically,
    60–90% of data are allocated to the training set and the remainder to the test
    set. Because the training set and the test set are completely independent, this
    method provides a least optimistic estimate of model predictive power than cross-validation
    of bootstrapping methods. Models are considered robust if the training and test
    set metrics are good and similar. This method is simple and practical, but it
    requires a sufficiently large data set for training and test set portioning, otherwise
    the results may be problematic.


    Cross-validation is a good alternative to evaluate the model accuracy for small
    data sets. Here, the original data set is portioned into k subsets, with training
    and testing performed k times. In each iteration, one set forms a test set while
    the remaining sets are used for training. This is called k-fold cross-validation.
    Unlike the train-and-test method, each data point will be used k − 1 times for
    training and once for testing in the cross validation. The “leave-one-out” (LOO)
    method is a special case of cross-validation where one data point is left out
    in turn for testing, while the other data are used for training. LOO is one of
    the commonly used cross-validation methods. The estimate given by LOO is repeatable,
    but LOO is time-consuming and computationally expensive. To reduce this computation
    overhead, a 10-fold cross-validation can be used. Note that cross-validation gives
    a more optimistic estimate of the prediction ability of the model than the train-and-test
    method because the training and test set are not independent.


    Overfitting can be minimized by increasing the size of the data set, reducing
    the number of descriptors a priori, reducing the model complexity with the same
    number of descriptors, or by adding regularization terms to remove the descriptors
    of low relevance to the property being modeled.


    The primary steps in constructing ML models to solve the electro/photocatalysis
    problems have been summarized. We stress that data quality plays a key role in
    ML model construction. Therefore, data reliability must be carefully evaluated,
    especially when the data are from different sources. This requires close collaboration
    among data scientists, catalyst scientists, and materials scientists to build
    a standard format for electro/photocatalysis data recording. Featurization ensures
    the number of descriptors is just sufficient for describing the input data, as
    excessive features may result in model overfitting. Despite a variety of descriptors
    being developed, the measurement of some descriptors (such as d-band center and
    intermediate adsorption free energy), is very difficult in catalytic reactions,
    thus simple and accessible descriptors with interpretable feature–property relationships
    are preferred. ML model selection depends on the problems to be solved and data
    structure. In other words, the quality, quantity and diversity of training data,
    as well as the relevance of descriptors determine which ML model to be used. Model
    predictivity and transparency should be balanced, and model predictivity must
    be evaluated before used. Models with good interpretability are'
