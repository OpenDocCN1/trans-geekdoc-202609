    significantly higher accuracy than a single model trained on the data set, and
    bagged models can minimize overfitting and noise effects. One of the most frequently
    used bagging ensemble models is RF, which combines results from a series of decision
    trees. RF has significant advantages, such as robustness to outliers and errors,
    high efficiency, good performance, and provides estimates of the variable importance.
    As a result, the RF model is robust for predictions of catalysts properties such
    as electrocatalytic activities, gas adsorption free energy, and photocatalytic
    properties, and uncovering the impactful factors for these properties. For example,
    Ying et al. built an RF model to study the bifunctional oxygen evolution/reduction
    reaction activity for single-atom catalysts on C₂N, and identified that the outer
    electron number and the oxide formation enthalpy of single-atom catalysts were
    two of the most important factors determining their activity. This work indicated
    that RF could not only save calculation time and cost but also provide deeper
    insight into the electrocatalytic activity of single-atom catalysts. Despite the
    good transparency, the complexity of RF can be high especially when the number
    of decision trees is large, and thus the training time will be significantly extended.


    While bagging treats all training data points equally and simply combines the
    outputs of each individual model (weak learner), boosting assigns weights to each
    data point and each weak learner. After a model Mᵢ is trained, the weights of
    the data points exhibiting larger errors will be increased and those having smaller
    errors decreased. This emphasizes poorly predicted data points with weights of
    each weak learner


    being estimated by the errors as well. AdaBoost is one of the popular boosting
    algorithms. Compared to bagging methods, AdaBoost may overfit the data because
    it focuses more on poorly predicted data points, but it may achieve a higher degree
    of precision than bagging methods. Instead of focusing on the data points having
    large prediction errors, gradient boosting uses the residual error between the
    predicted value from the current model and the true value. Like the gradient descent
    algorithm discussed in Section 2.3.1, gradient boosting minimizes the loss function
    by gradually imposing a new model into the current model that reduces the loss
    function to the largest extent. This process is iterated until an optimal loss
    value is found. Because of the high accuracy and versatility, gradient boosting
    algorithms, such as gradient boosting tree (GBT) and gradient boosting regression
    (GBR), are widely used in materials screening, discovery, and property prediction.


    # **2.3.6. Clustering.**


    Clustering is an unsupervised learning method that partitions a set of data into
    subsets in which all members are similar to each other. Unlike classification,
    the clustered data are unlabeled, and their similarity is determined by mathematical
    descriptors. Clustering is useful for discovering previously unknown patterns
    in data.


    Several clustering algorithms are commonly used in materials science. The best
    known is *k*-means clustering that partitions data into *k* clusters (*k* is preset
    by a human operator) based on the Euclidean distance between the data points in
    the feature space (Figure 7a). It is computationally efficient and can be applied
    to data in continuous *n*-dimensional space, but it is sensitive to noise and
    outliers. Hierarchical clustering presents the data points as a hierarchy (Figure
    7b). Although there is no limit to cluster numbers in this algorithm, which hierarchy
    is adopted as the ultimate clustering metric still relies on human input. The
    results are also sensitive to noise. To overcome noise sensitivity and discover
    data clusters of arbitrary shape, Density-Based Spatial Clustering of Applications
    with Noise (DBSCAN) was developed. Here, rather than using distances between data
    points, DBSCAN uses the similarity of the density around the data points, and
    thus it can easily distinguish noise from information. It is suitable for clustering
    of both convex and nonconvex data sets (Figure 7c). However, DBSCAN is more complex
    than *k*-means and hierarchical clustering, requiring longer computation time
    to cluster large data sets. Clustering algorithms have been applied to spectral
    analysis and catalyst discovery in catalysis research.


    ![](img/385acff8214d70e1094d2d47342cdb40_11_1.png)


    **Figure 7.** Schematic representation of some cluster algorithms. (a) *k*-means
    clustering; the data points are partitioned into three clusters (presented as
    green, blue, and pink dots). The black dots denote the means of these clusters.
    (b) Hierarchical clustering, in which five data points are partitioned hierarchically.
    (c) DBSCAN, the data points that are successfully clustered are represented by
    triangles with various color, the noise data are represented by black circle,
    and the uncertain data are represented by circles with the color of the cluster
    that they may be grouped in.'
