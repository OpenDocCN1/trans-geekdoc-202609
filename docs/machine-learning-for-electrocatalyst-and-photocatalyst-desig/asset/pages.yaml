    In principle, machine learning algorithms are universal approximators, able to
    model any complex relationship in physical systems, given sufficient data. This
    approach is quite different to traditional computational methods such as DFT,
    which require the laws of quantum mechanics and chemistry to be explicitly coded
    into the software. In contrast, ML algorithms learn the underlying rules and patterns
    in a data set to generate a model capable of making predictions about new molecules
    or materials (objects).46,56,57 The basic steps in constructing a ML model are
    the following (Figure 1): collect data to form a training data set; generate and
    select relevant mathematical descriptors that encode the properties of the relevant
    materials; choose a suitable algorithm and build the model; and evaluate the quality
    and predictive power of the model. These steps are described in detail in the
    following sections.




    The key challenge for material informatics is obtaining sufficient, reliable materials
    data. This data set must contain well-defined input variables for the model (microscopic
    structures, properties, or synthesis conditions of the material) and macroscopic
    properties of interest that the model is trained to predict.16,57 There are three
    main sources of materials data: structure and property databases; materials properties
    acquired from experimental measurements or computation; and the literature base.
    Table 1 summarizes


    These steps are described in detail in the following sections.


    Despite strict quality checks, errors and bias from human perception and measurement
    can exist in these databases.58 Moreover, variability may be introduced when experiments
    are carried out under different conditions (in different laboratories) or the
    properties are characterized by different methods (e.g., nanoparticle sizes determined
    by electron microscopy or dynamic light scattering).


    Another important data source is the literature.59 The near exponential rise in
    numbers of papers published provides a huge resource materials scientists can
    access to build data sets. The structures and properties of the materials contained
    in these papers, synthesis and processing conditions, and other provenance data
    are extremely valuable for elucidating materials structure–property relationships.
    The literature often contains analyses of the connections and relationships between
    the relevant properties. This deeper knowledge, in contrast to the purely quantitative
    property and structure data in databases, can give materials scientists deeper
    insights into structure–property relationships and identify the most useful descriptors
    used to represent the materials.60 Traditionally, publication databases are searched
    by keywords and the relevant information extracted manually; this is inefficient
    because of the number of publications. Chemical information is being mined from
    the literature using ML-based text extraction methods (natural language processing).60–64
    These methods are robust for batch extraction of chemical information from publications.
    However, the reliability of the published data from literature must be carefully
    assessed. Data from different sources, especially for catalysts, may not be compatible
    because the different ways catalytic reactions are'
