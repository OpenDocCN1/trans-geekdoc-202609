- pgno: 5
  md: 'Descriptors must be chosen with care to ensure they are relevant to the property
    or process being modeled. For example, electronic and atomic descriptors are not
    able to differentiate between allotropes, isomers, conformers, and polymorphs
    that have very similar descriptors for each form. Techniques such as radial distribution
    functions (density distributions as a function of distance) and Voronoi tessellations
    (partition the crystal lattice into subregions close to each of a given set of
    objects) are useful in encoding the crystal lattice. The Coulomb matrix is a global
    descriptor mimicking the electrostatic interaction between the nuclei and is widely
    used in structure featurization, especially in adsorption research. Structures
    of molecules can be described by the simplified molecular-input line-entry system
    (SMILES), a string of characters composed of letters and symbols that can be converted
    into numbers using the ASCII values of the characters. More refined implementations
    have been developed based on SMILES. For example, PaDEL and RDKit codes describe
    the molecular structure by an array of real numbers. Molecular fingerprints encode
    the presence or absence of particular substructures/patterns in molecules (these
    differ in various implementations, e.g., MACCS, FP2, daylight, and hybridization)
    using 1s and 0s. More generally, so-called one-hot descriptors denote the presence
    or absence of any feature or attribute in a molecule, or process.


    Generation of structural descriptors can also start from the local environment
    of each atom and extend to the crystal level. Atom-Centred Symmetry Functions
    (ACSFs) descriptors account for the local environment of atoms by using multiple
    two-body and three-body symmetry functions. The Smooth Overlap of Atomic Positions
    (SOAP) likewise uses a local expansion of a Gaussian smoothed atomic density with
    orthonormal functions, based on spherical harmonics and radial basis functions,
    to encode regions of atomic geometries. Note that both ACSFs and SOAP are local
    descriptors that do not represent the entire structure, but information from multiple
    local sites can be simply averaged or combined by kernel functions. Frequently,
    d-band center descriptors and p-band center descriptors are used to describe the
    local activities of metal and anion sites of catalysts, respectively. Moreover,
    structural descriptors can be built from the molecular graph, in which the nodes
    correspond to atoms and edges to bonds in crystal and molecular frameworks. These
    graph-based structural descriptors are widely used in materials systems because
    they are consistent with conventional representations of a unit cell or a molecule.
    Models trained on graph-based descriptors generally have good predictive performance
    for materials properties such as formation energy and bandgap. They are simple
    to calculate, store, and interpret as only atomic symbols required, but their
    ability to model complex interactions within materials is limited. Recently, chemical
    and physical properties were introduced into graph-based descriptors by the property-labeled
    materials fragments (PMF) technique. Models built using PMF fragments exhibited
    excellent predictive ability for many important properties.


    We stress that descriptors for catalysis research should not be restricted to
    one type. Multiple families of descriptors are required to capture all attributes
    of catalysts and reactions, leading to robust ML models (Table 2). Wang et al.
    combined elemental descriptors and structural descriptors of oxide perovskite
    surfaces to build a surface center environment


    model to predict the adsorption energies of the intermediates (HO*, O*, HOO*)
    and their overpotentials. They found that the adsorption energies and overpotentials
    would be low when the B-site was occupied by a series of specific elements and
    accordingly, new oxide perovskites with good catalytic performance for the oxygen
    evolution reaction (OER) could be designed. Xu et al. noted that catalytic activity
    of single-atom catalysts was highly correlated with the coordination number and
    the electronegativity of the nearest atoms. They therefore created a universal
    descriptor based on these descriptors, with which highly active single-atom catalysts
    lacking precious metals were designed. More recently, the use of state-of-the-art
    ML techniques, such as symbolic learning, have been shown to generate sets of
    descriptors that allow materials scientists to create more accurate ML models
    and uncover deep feature–property relations.


    # 2.2.2. Descriptor Selection.


    Because there are a myriad of ways to construct descriptors for a material based
    on chemical and physical knowledge, it is crucial to choose the subset of the
    most appropriate descriptors for modeling. This is because using too many descriptors
    increases model complexity, resulting in overfitting and compromising the predictivity
    of models, while optimally sparse subsets of descriptors generate models with
    the best predictivity and make interpretation of models easier. There are two
    main strategies to select descriptors, down-selection and dimensional reduction.
    In down selection (also called sparse feature selection), a large number of possible
    material descriptors are reduced to a smaller number using a range of statistical
    methods. In regression models, an L₁ regularization term is introduced to penalize
    terms with a lower relevance to the model by shrinking them to zero, this is called
    the least absolute shrinkage and selection operator, LASSO (this will be discussed
    further in Section 2.3.1). More recently, the sure independence screening and
    sparsifying operator (SISSO) has proven to tackle immense and correlated feature
    spaces to converge on an optimal combination of features relevant to the materials
    property of interest. Tree algorithms, such as random forest (RF), are also commonly
    used to determine importance of each descriptor after training. Wexler et al.
    used a regularized (model complexity penalizing) RF model to study hydrogen evolution
    activity of Ni₂P. Twenty nine descriptors were input to the model, and the relative
    importance of each was estimated by calculating its normalized ability to separate
    the data based on the free energy for hydrogen adsorption. The ten most important
    descriptors were selected from the descriptor set. This identified the Ni–Ni bond
    length, the geometry of the Ni₃ sites, and the dopant charge as having the most
    significant effects on the hydrogen adsorption ability. Although down-selection
    methods are effective in reducing the number of descriptors, they can sometimes
    discard useful materials information. Some down-selection algorithms may display
    instability, especially if some descriptors are categorical rather than continuous,
    depending on how well the hyperparameters have been chosen.


    Another strategy for optimizing descriptors is dimensional reduction. The principle
    of this strategy is to project the descriptors from a high dimensional space into
    a lower dimensional space. The new descriptors are generated by linear combinations
    of the original descriptors, with principal component analysis (PCA) being the
    most common. In brief, PCA determines the principal components, or a series of'
