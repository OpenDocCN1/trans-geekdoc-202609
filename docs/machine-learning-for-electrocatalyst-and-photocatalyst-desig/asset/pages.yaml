    # 3.2.3. Photocatalytic Oxides for Pollutant Degradation.


    ML approaches have also been used to study the kinetics of photocatalytic pollutant
    degradation and to optimize the parameters for product synthesis and photocatalytic
    reactions. Jiang et al. trained a NN model to decode the factors affecting the
    degradation of 78 organic pollutants by a TiO₂ photocatalyst. The ultraviolet
    intensity, TiO₂ dosage, the concentration of organic pollutants in water, pH value
    and temperature, and the structure of organics (described by molecular fingerprint)
    were used to train the model, using 446 data points from the literature. They
    concluded that the structure of organic pollutants had the primary influence on
    degradation rate. Fathinia et al. studied the photocatalytic degradation of phenazopyridine
    hydrochloride by TiO₂ using a NN model. Experimental parameters were used as descriptors,
    and the model was trained, validated, and tested on data sets of 128, 28, and
    28 samples, respectively. A NN model with one hidden layer (5-14-1) was trained
    to predict the removal efficiency of phenazopyridine hydrochloride. The prediction
    accuracy of the model was high, similar to that of a kinetic model, suggesting
    that the reaction mechanism used in the kinetic model was correct. However, this
    model may be overtrained as the number of weights (84) is close to the number
    of data points. With the help of ML, Pellegrino et al. studied the effects of
    experimental parameters on TiO₂


    nanoparticle sizes and aspect ratio in hydrothermal synthesis. According to the
    NN models, the length and the aspect ratio of the TiO₂ particles could be precisely
    controlled in the range from 20 to 140 nm and 1.4 to 6, respectively. Yang et
    al. also attempted to use NN to build models for the photocatalytic performance
    of TiO₂ nanoparticles, but their results may also be overfitted as the training
    set was very small. Such ML approaches may be extended to the design and analysis
    of more complex systems, such as ZnO, CuO, Fe₂O₃, CoBi₂O₄, and some high entropy
    oxides. ML techniques are also used to study the photodegradation of doped oxides.
    In a study of the photocatalytic degradation of methylene blue by the N,S-codoped
    Fe₂O₃, a genetic algorithm was used to find optimal initial weights and biases
    for a NN model. The study identified the importance of the amount of nanoparticles,
    concentration of dye, pH value, and the incident light wavelength on dye removal
    efficiency. Gao et al. used a NN-based active learning approach to screen the
    most active C/N-doped (001) TiO₂ for pollutant degradation. In this synthesis,
    titanium carbide and titanium nitride served as the Ti, C, and N sources and hydrogen
    fluoride (HF) was the capping agent. The first NN model was built to link the
    synthesis parameters to photocatalytic performance based on the results of the
    experiments in the first round. Experiments were then carried out according to
    the best synthesis parameters given by the model, and the experimental photocatalytic
    activities of the pristine TiO₂ were added into the training set for the second
    NN model. This process was repeated until all the experimental results were accommodated
    by the model. Consequently, optimized C/N-doped TiO₂ was synthesized that showed
    good degradation performance toward three organic pollutants.


    As well as catalysts composed of one metal oxide, ML methods are also useful for
    modeling and predicting the performance of catalysts containing two or more oxides.
    The formation of a heterojunction can potentially extend the electron–hole pair
    lifetime and modify the charge transfer during the reactions. Badiei et al. reported
    a NN modeling approach to study the reaction rate constant of the photocatalytic
    degradation of acid fuchsin by a TiO₂/NiO heterojunction with various ions mixed
    in the reaction solution. The NN model successfully ranked the effect of the ions
    on the reaction rate constant, recapitulating experimental results. Thus, this
    model can guide the optimization of experimental conditions in photocatalytic
    pollutant degradation. Kassahun et al. employed NN models to optimize the synthesis
    conditions of the N-doped TiO₂/SiO₂ heterojunction to get an optimum ciprofloxacin
    degradation efficiency under visible light. Similar NN approaches were extended
    to other systems such as S-doped g-C₃N₄/ZnO, g-C₃N₄/Ce-doped ZnO/Ti, and a CdS/g-C₃N₄/Fe₂O₄
    Z-scheme system. These studies showed that NNs had considerable promise for optimization
    of the synthesis of photocatalysts containing two materials, but that some of
    these models might be overfitted as the training sets were small.


    We have summarized the applications of ML techniques to electro/photocatalysis.
    ML techniques have been useful in leveraging expensive DFT calculations and for
    material screening, revealing feature–property relationships, and optimizing experimental
    parameters. SVM, NN, RF, and gradient boosting models appear to be the most frequently
