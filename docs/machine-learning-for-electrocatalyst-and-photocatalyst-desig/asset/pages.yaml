    Electrochemical reactions involve two half reactions occurring at the anode (e.g.,
    OER) and cathode (e.g., HER, the oxygen reduction reaction (ORR), carbon dioxide
    reduction, nitrogen reduction), respectively, powered by electrons.5,6 Active
    catalysts are required to improve the efficiency and minimize the overpotential
    in these reactions. Among these reactions, the HER and ORR are widely applied
    in the production of clean energy. The HER is a typical example of a two-electron
    transfer reaction, and the hydrogen adsorption free energy ΔG_H is key for determining
    activity. The ORR involves a four-electron transfer to reduce oxygen to water,
    or a two-electron and two-proton pathway to form hydrogen peroxide. Active electrocatalysts
    for these reactions possess a ΔG_H close to zero, while having moderate binding
    energies for the reaction intermediates (H*, OH*, O*, etc.). Platinum is the best
    performing electrocatalyst for the HER and ORR because of its thermoneutral ΔG_H.
    However, Ooka et al. reported that thermoneutrality did not yield maximum electrocatalytic
    activity.289 They fitted a microkinetic rate equation to the experimental results
    via a genetic algorithm and found that the binding energy of H on a polycrystalline
    Pt surface of 0.094 eV, gave maximum catalytic activity. They proposed that a
    positive ΔG_H was preferred in the HER because of the electrical driving force
    in this reaction. Despite the high activity, the scarcity and high cost of Pt
    limit its commercial use. More catalysts,


    including Pt-free intermetallics, oxides, single-atom catalysts, chalcogenides,
    and MXenes, have been developed to replace Pt.


