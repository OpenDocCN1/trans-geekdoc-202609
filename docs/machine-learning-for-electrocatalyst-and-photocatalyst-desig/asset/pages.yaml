    Figure 1. Workflow for applying ML techniques in the development of catalytic
    materials. It starts with data collection, featurization, model training, model
    evaluation, and eventually exploring the unknown materials space by using the
    ML models. The results of exploration will feed into the original data set for
    model improvement, and the materials with good properties will proceed to practical
    application.




    The development of globally sustainable energy systems and environmental protection
    are two critical challenges for this century, as population and industrialization
    expand. In particular, the generation of high-purity fuels from clean sources
    is a major research and development focus. Producing chemical fuels from earth-abundant
    resources such as water, carbon dioxide, and nitrogen requires next-generation
    electrocatalysts and photocatalysts.5–10 Removal of pollutants, bacteria, and
    heavy metals from water using cheap, efficient processes is also essential for
    maintaining an inhabitable planet, where photocatalytic and electrocatalytic reactions
    play important roles.10–15 Clearly, the discovery of higher efficiency, nontoxic
    electrocatalysts and photocatalysts synthesized from abundant elements is critical
    to realizing this future. However, the number of catalysts that can be synthesized
    in principle is vast, much too large to be explored through laboratory experimentation
    alone.16–18 To accelerate catalyst discovery, first-principles computational chemistry,
    especially density functional theory (DFT), is being increasingly employed.19,20
    In particular, the recent development of high throughput DFT calculations enables
    in silico catalyst screening and exploration of unknown material spaces.21–25
    However, because of the complexity of catalytic materials and the breadth of their
    applications, computationally expensive and time-consuming DFT calculations are
    still unable to explore the whole catalyst composition space. Catalyst researchers
    are putting intensive effort into understanding structure–property relationships,
    interpreting data patterns, and extracting knowledge from high volume, multidimensional
    material databases.26 More effective strategies are therefore needed to tackle
    these complex issues.


    be used to make predictions.27–29 ML algorithms have recently been shown to accelerate
    discovery and the optimization of functional materials for real world applications
    such as catalysts, photovoltaics, optoelectronic materials, and thermoelectrics.26,30–36
    ML algorithms complement expensive, time- and resource-intensive first-principles
    electronic structure calculations to provide insight into complex, multidimensional
    structure–property relations.31,37–46 ML techniques can interpret and model a
    wide range of data and are useful for de novo discovery of important physical
    and chemical principles.47–51 The application of ML to materials science will
    result in a step-change in theory and methods for the discovery of next-generation
    functional materials. Here we review recent progress (2016 onward) in the application
    of ML to the discovery, development, and design of electrocatalysts and photocatalysts.
    Excellent reviews exist that summarize the impact of ML in general catalysis informatics
    for a wide range of catalytic processes or for one or two specific reactions (e.g.,
    the electrolytic hydrogen evolution reaction (HER)).35,52–55 Recent, comprehensive,
    critical reviews of cutting-edge ML algorithms and their applications to electrocatalysts
    and photocatalysts are lacking. To address this deficiency, we summarize ML methods
    commonly used for electrocatalyst and photocatalyst discovery, critically review
    the literature in this field, and provide a perspective into the future evolution
    of AI and ML technology and its impact on electro/photocatalyst research and development.
    This review consists of four sections. Section 1 introduces ML and its application
    to materials science. In Section 2, the process of implementing ML methods for
    electro/photocatalytic systems is described and a concise summary of ML algorithms
    and their advantages and limitations is provided. Section 3 reviews the literature
    on ML-based electro/photocatalyst design, discovery, and development, and exemplifies
    this method for materials, such as metals and oxides. Section 4 provides conclusions
    and a perspective on current challenges and future aims in ML and ML-based catalyst
    design. This review aims to guide materials scientists in the selection of ML
    methods for electro/'
