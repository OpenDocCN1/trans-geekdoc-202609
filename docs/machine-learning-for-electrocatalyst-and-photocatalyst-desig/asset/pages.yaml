  md: 'The most popular NN algorithm is the backpropagation NN in which, during training,
    the error between the output value and the target value is propagated back through
    the network to adjust the weights and bias in the different layers (Figure 5b).
    It comprises one input layer, one output layer, and one or a few hidden layers,
    each of which contains one or more nodes or neurons. Figure 5a depicts a typical
    three-layer backpropagation NN, in which the inputs corresponding to the descriptors
    of a training data set are fed through to the hidden layer where they are processed
    by a transfer function and the outputs passed to the output layer to generate
    predictions for the outputs data point. The number of input nodes is equal to
    the descriptors, while one output unit is commonly used for binary classification
    or continuous value prediction. Multiple output units can also be used to represent
    different classes for a multiclass problem or multiple continuous properties for
    multiobjective models. There is no rule about the optimal number of hidden layers
    to be used, and therefore the design of a backpropagation NN requires trial and
    variation. However, Bayesian regularization of neural networks can automatically
    optimize the architecture and number of adjustable weights to yield robust and
    predictive models of a wide range of properties.


    Deep learning is a class of ML that extracts the knowledge via a multiple layer
    NN. The deep learning neural networks (DNNs) have several hidden layers and many
    nodes per layer, with which features or patterns are progressively abstracted
    from inputs layer by layer. As DNNs do not rely on human decision (e.g., selections
    of polynomial degree or kernel function), they can learn relationships of arbitrary
    complexity given sufficient training data. Their main advantage over “shallow”
    (3-layer) neural networks is in the representation of data. Instead of manual
    feature engineering according to domain knowledge, deep learning enables models
    to learn the underlying structure of the input data and extract useful features,
    by which the input format becomes more flexible (e.g., images, videos, sounds),
    and model performance can be improved. Deep learning has become a very useful
    tool in materials exploration, catalytic reactivity prediction, and experimental
    condition optimization. Kim et al. applied DNNs to model 31 713 known zeolites
    using atomic information and local methane adsorption energy as inputs. The model
    could identify novel zeolites with improved adsorption properties. Moreover, this
    model could be extended to more complex porous materials, such as metal organic
    frameworks and covalent organic frameworks, provided these materials lay near
    the domain of applicability of the model. Ding et al. studied the electrocatalytic
    oxygen reduction activity of ZIF-based materials with DNN as well as another 8
    ML models. The summarized results showed pyrolysis time was a decisive factor
    in the electrocatalytic reactions, in which a moderate pyrolysis time could lead
    to the best electrocatalytic performance because of the balance of Zn–N evaporation,
    Fe–N formation, and graphitic N conversion. Yang et al. employed DNN to optimize
    the experimental parameters for photocatalytic treatment of oily wastewater. Because
    of the high accuracy of the model prediction, optimal operating parameters could
    be acquired promptly from past data, thereby saving time and cost on trial-and-error
    experiments.


    Convolutional neural networks (CNNs) are a type of DNN mostly used in image analysis.
    A CNN consists of several convolutional and pooling layers, with a fully connected
    layer. Figure 5c illustrates the principle of the CNN. When an image is the input,
    the convolutional layer extracts features from the image by scanning with one
    or more filters and generates a feature map by convolution. An activation function
    is applied to the feature map to introduce nonlinearity and to simulate higher
    level features. After a few convolution and activation cycles, the pooling layer
    is used to reduce the dimensions of the data before further convolution. Finally,
    data is transmitted into the fully connected layer, a multilayer NN, and values
    or class labels are predicted. For materials science, CNN models are often trained
    on images of materials features. Back et al. successfully predicted the CO and
    H binding energies on the pure metals, alloys and intermetallic structures using
    a CNN, thus expediting high throughput catalyst discovery. Wang et al. used a
    CNN to map the crystal structures to the Heyd–Scuseria–Ernzerhof (HSE06) bandgaps,
    and identified 33 materials from 1503 candidates with bandgaps less than 0.9 eV,
    which were considered as promising electrodes and electrocatalytic materials.
    In addition, a CNN is capable of determining physical insights of electro/photocatalysis.
    Wang et al. developed a theory-infused neural network model consisting of a CNN
    module and a d-band theory module to predict the adsorption energy of OH* on {111}-terminated
    intermetallics. Using graphic features of OH* on {111}-terminated intermetallics,
    229 Using graphic features to represent the information on atom, bonding, and
    neighbor environment as input, a CNN model was constructed to determine parameters
    for the module built on d-band theory of chemisorption, and the adsorption energy
    was then calculated by the d-band theory module. The combination of ML and chemisorption
