    The SVM, a nonlinear algorithm, provides a global solution to the feature–property
    relation, shows good generalization ability, and is insensitive to outliers. Nevertheless,
    training of the SVM model is very slow on a large data set, and there is no general
    rule for the selection of kernel functions. Distinct from the linear algorithms,
    the transparency of the SVM model is low, and the SVM classifiers are only available
    for the binary classification, which restricts their applications.


    # ### 2.3.3. Decision Trees.


    Decision tree (DT) models generate a tree-like model that classifies the output
    values by imposing sets of rules on the input features. It is composed of internal
    nodes, representing tests on a descriptor, branches which are the outcomes of
    the tests, and leaf nodes that hold


    class labels or continuous values. Tree models with discrete outputs are called
    classification trees, and those with continuous outputs regression trees. DT models
    can discover new knowledge de novo and handle multidimensional data. They are
    fast and simple to train, can generate high accuracy, and are easier to interpret
    than some ML methods. However, DT models are prone to overfitting and can be biased
    and unstable. Small changes in the training data may cause a dramatic change in
    the structure of the optimal tree. This issue is common to most regression methods
    as regression is inherently an ill-posed problem. Regularization converts ill-posed
    problems into well-posed problems. For DTs, this is achieved by pruning the size
    of the tree. In some cases, it can be difficult for DT models to learn very complex
    relationships. Despite these disadvantages, DT is still considered one of the
    most versatile algorithms because of their excellent interpretability. Consequently,
    DTs have been used in many areas of materials science, such as optimization of
    catalysts, compound classification, spectra analysis, and toxic prediction.


    # ### 2.3.4. Neural Networks.


    The neural network (NN) is a bioinspired algorithm where numerous connected units
    send signals to other units, similar to the function of neurons in the brain.
    The NN consists of a series of connected input/output units in which each connection
    can transmit a weighted signal to other units (Figure 5a). During the learning
    phase, the NN adjusts the weights and bias on each connection to reduce the errors
    between the predicted values and the target values until the errors are acceptable
    or no improvement is obtained. NNs can have long training times and work best
    with large training data sets. Although NNs are considered difficult to interpret,
    they have high noise tolerance, can model any complex relationships given enough
    data, and can make predictions for both continuous and discrete data. As a result,
    NNs are useful in providing solutions to many problems, not only in electro/photocatalytic
    science but also in molecular dynamics simulations, synthesis route design, pattern
    recognition,'
