    measured and because some potentially relevant factors may be neglected (e.g.,
    shape of reactor, stirring speed, different solvent). Close cooperation among
    materials scientists, catalyst scientists, and computer scientists on the use
    of a standard format for data recording and evaluation of the reliability of published
    data is very important for generating high-quality ML models.


    Materials data sets can also be built from experimental and simulation data, where
    all the data are acquired under similar conditions. Typically, high throughput
    experiments generate large quantities of data for a specific system.21,22,24,25,65–68
    Conspicuously, all experiments contribute to data set construction, as failed
    experiments contain valuable information identifying the molecular determinants
    of success and failure.69 A web-accessible public database (http://darkreactions.haverford.edu)
    has been developed to extract data from laboratory notebooks and ongoing experimental
    data.70 These data from failed experiments have been beneficial for the design
    of chemical syntheses.


    High throughput computation is also a viable way to accumulate materials data.22,71–75
    Using thermodynamic and electronic structure methods, data sets of virtual materials
    or local properties of materials can be generated that are useful for materials
    analysis and discovery using ML tools.30,74 ML can predict the results of electronic
    structure calculations when trained on previous calculation results, effectively
    leveraging these expensive and resource-intensive first principle calculations
    much more broadly across materials space.76,77 High throughput calculations accelerate
    the growth of computed materials databases such as AFLOWLIB and Materials Project.
    These databases also provide open-source platforms for researchers to implement
    high throughput calculations.78,79


    ## 2.2. Featurization


    After data collection, materials must be transformed into an appropriate mathematical
    form used to train ML models.80 This involves describing key attributes of molecules,
    compounds, clusters on surfaces of compounds, materials etc., by a series of numbers
    (vectors or tensors).80,81 These numbers are materials attributes called descriptors,
    features, or fingerprints in the literature. The process of generating these mathematical
    representations of material objects is called featurization or feature engineering
    and it is of critical importance to the quality and interpretability of the models
    trained using them. This step requires the most human intuition and intervention
    but recent development in automatic featurization of molecular objects using specific
    types of deep neural networks promises paradigm shifts in this process.82–84 Featurization
    consists of two steps: descriptor generation and descriptor selection.


    ### 2.2.1. Descriptor Generation


    Effective descriptors must discriminate between objects in the data space and
    encode attributes that are relevant to the property being modeled and predicted.31,34
    Despite the large number of descriptors that can be generated for molecules and
    materials, the choice of these descriptors is strongly dependent on the scientific
    problem to be solved.31 Although descriptor generation is context dependent, there
    are still some common rules. First, the descriptor set must provide unique information,
    such as structure, composition, and physicochemical properties of the materials
    to ensure they are distinct for each material. Second, the number of descriptors
    used should not be very large to avoid overfitting models and compromising their
    ability to predict properties of new data. Redundant or correlated descriptors
    should be removed to minimize the size of the descriptor set to avoid overfitting,
    especially in electro/photocatalyst research where the data sets tend to be small.
    It has been shown that as additional irrelevant descriptors are added to descriptor
    sets, the quality of a partial least-squares model, for example, is degraded.85
    Redundant descriptors include those having high correlation with other descriptors
    in the set, those whose values do not change much across the data set (low variance),
    and those that have very low correlation with the property being modeled. To avoid
    overfitting, the number of fitted variables in a model should be much less than
    half of the number of the training examples.16,86


    In general, descriptors can be divided into different classes depending on the
    information they encode. As well as encoding structural, compositional, and physicochemical
    properties of materials, they can also include provenance information of how the
    material was synthesized or subsequently processed. Experimentally derived descriptors
    may include temperature, pH value, pressure, reaction time, and the amount of
    the reactants. Compositional descriptors relate to the composition of each component
    in complex materials. Topographical descriptors pertain to the texture of a material
    (pore size, volume, surface area, topological shape), while topological descriptors
    encode the connectivity of atoms in materials. Some descriptors can be readily
    extracted from physicochemical handbooks or material databases. For example, atomic
    descriptors refer to the atomic attributes like atomic radii, masses, the number
    of protons and valence electrons, etc., physical descriptors are mainly related
    to the macroscopic attributes of materials such as melting point, boiling point,
    density and solubility, and some electronic descriptors encode microscopic attributes
    (electronegativity, ionization energy, etc.).87 Many types of descriptors can
    be obtained by calculation, such as structural descriptors and some electronic
    descriptors (bandgap, dipole moment, highest occupied molecular orbital (HOMO),
    lowest occupied molecular orbital (LUMO), d-band characteristics, etc.).88,89
    Spectra-based descriptors are derived from experimental measurements (e.g., X-ray
    diffraction, extended X-ray absorption fine structure (EXAFS), etc.).90 The acquisition
    of these descriptors may be relatively costly and time-consuming. Clearly, computational
    descriptors are preferred because they do not require experiments to derive them.
    Apart from cost and time considerations, more importantly, they are the only way
    to predict properties of materials not yet synthesized.


    Table 2 summarizes typical descriptors used in a variety of electrocatalysis and
    photocatalysis models. Although the relevance of descriptors is assessed by the
    performance of the model, experience and intuition are useful in descriptor selection.
    For example, experimental descriptors would be used in the case of synthesis optimization,91
    while compositional descriptors would be better suited to describe the materials
    undergoing composition optimization.92 When texture–property relationships or
    structure–property relationships are interpreted, topographical and topological
    descriptors, atomic descriptors, and electronic descriptors would be used collectively.87,93–96
    For instance, electronegativity and ion radii are commonly used as descriptors
    for different perovskite catalysts,97–99 these features play pivotal roles in
    Pauling''s Rule and tolerance factor that are useful in understanding and predicting
    the stability of perovskites.100,101


    Descriptors must be chosen with care to ensure they are relevant to the property
    or process being modeled. For example, electronic and atomic descriptors are not
    able to differentiate between allotropes, isomers, conformers, and polymorphs
    that have very similar descriptors for each form. Techniques such as radial distribution
    functions (density distributions as a function of distance) and Voronoi tessellations
    (partition the crystal lattice into subregions close to each of a given set of
    objects) are useful in encoding the crystal lattice. The Coulomb matrix is a global
    descriptor mimicking the electrostatic interaction between the nuclei and is widely
    used in structure featurization, especially in adsorption research. Structures
    of molecules can be described by the simplified molecular-input line-entry system
    (SMILES), a string of characters composed of letters and symbols that can be converted
    into numbers using the ASCII values of the characters. More refined implementations
    have been developed based on SMILES. For example, PaDEL and RDKit codes describe
    the molecular structure by an array of real numbers. Molecular fingerprints encode
    the presence or absence of particular substructures/patterns in molecules (these
    differ in various implementations, e.g., MACCS, FP2, Daylight, and hybridization)
    using 1s and 0s. More generally, so-called one-hot descriptors denote the presence
    or absence of any feature or attribute in a molecule, or process.


    Generation of structural descriptors can also start from the local environment
    of each atom and extend to the crystal level. Atom-Centred Symmetry Functions
    (ACSFs) descriptors account for the local environment of atoms by using multiple
    two-body and three-body symmetry functions. The Smooth Overlap of Atomic Positions
    (SOAP) likewise uses a local expansion of a Gaussian smoothed atomic density with
    orthonormal functions, based on spherical harmonics and radial basis functions,
    to encode regions of atomic geometries. Note that both ACSFs and SOAP are local
    descriptors that do not represent the entire structure, but information from multiple
    local sites can be simply averaged or combined by kernel functions. Frequently,
    d-band center descriptors and p-band center descriptors are used to describe the
    local activities of metal and anion sites of catalysts, respectively. Moreover,
    structural descriptors can be built from the molecular graph, in which the nodes
    correspond to atoms and edges to bonds in crystal and molecular frameworks. These
    graph-based structural descriptors are widely used in materials systems because
    they are consistent with conventional representations of a unit cell or a molecule.
    Models trained on graph-based descriptors generally have good predictive performance
    for materials properties such as formation energy and bandgap. They are simple
    to calculate, store, and interpret as only atomic symbols required, but their
    ability to model complex interactions within materials is limited. Recently, chemical
    and physical properties were introduced into graph-based descriptors by the property-labeled
    materials fragments (PMF) technique. Models built using PMF fragments exhibited
    excellent predictive ability for many important properties.


    We stress that descriptors for catalysis research should not be restricted to
    one type. Multiple families of descriptors are required to capture all attributes
    of catalysts and reactions, leading to robust ML models (Table 2). Wang et al.
    combined elemental descriptors and structural descriptors of oxide perovskite
    surfaces to build a surface center environment model to predict the adsorption
    energies of the intermediates (HO*, O*, HOO*) and their overpotentials. They found
    that the adsorption energies and overpotentials would be low when the B-site was
    occupied by a series of specific elements and accordingly, new oxide perovskites
    with good catalytic performance for the oxygen evolution reaction (OER) could
    be designed. Xu et al. noted that catalytic activity of single-atom catalysts
    was highly correlated with the coordination number and the electronegativity of
    the nearest atoms. They therefore created a universal descriptor based on these
    descriptors, with which highly active single-atom catalysts lacking precious metals
    were designed. More recently, the use of state-of-the-art ML techniques, such
    as symbolic learning, have been shown to generate sets of descriptors that allow
    materials scientists to create more accurate ML models and uncover deep feature–property
    relations.


    ### 2.2.2. Descriptor Selection


    Because there are a myriad of ways to construct descriptors for a material based
    on chemical and physical knowledge, it is crucial to choose the subset of the
    most appropriate descriptors for modeling. This is because using too many descriptors
    increases model complexity, resulting in overfitting and compromising the predictivity
    of models, while optimally sparse subsets of descriptors generate models with
    the best predictivity and make interpretation of models easier. There are two
    main strategies to select descriptors, down-selection and dimensional reduction.
    In down-selection (also called sparse feature selection), a large number of possible
    material descriptors are reduced to a smaller number using a range of statistical
    methods. In regression models, an L₁ regularization term is introduced to penalize
    terms with a lower relevance to the model by shrinking them to zero, this is called
    the least absolute shrinkage and selection operator, LASSO (this will be discussed
    further in Section 2.3.1). More recently, the sure independence screening and
    sparsifying operator (SISSO) has proven to tackle immense and correlated feature
    spaces to converge on an optimal combination of features relevant to the materials
    property of interest. Tree algorithms, such as random forest (RF), are also commonly
    used to determine importance of each descriptor after training. Wexler et al.
    used a regularized (model complexity penalizing) RF model to study hydrogen evolution
    activity of Ni₂P. Twenty-nine descriptors were input to the model, and the relative
    importance of each was estimated by calculating its normalized ability to separate
    the data based on the free energy for hydrogen adsorption. The ten most important
    descriptors were selected from the descriptor set. This identified the Ni–Ni bond
    length, the geometry of the Ni₃ sites, and the dopant charge as having the most
    significant effects on the hydrogen adsorption ability. Although down-selection
    methods are effective in reducing the number of descriptors, they can sometimes
    discard useful materials information. Some down-selection algorithms may display
    instability, especially if some descriptors are categorical rather than continuous,
    depending on how well the hyperparameters have been chosen.


    Another strategy for optimizing descriptors is dimensional reduction. The principle
    of this strategy is to project the descriptors from a high dimensional space into
    a lower dimensional space. The new descriptors are generated by linear combinations
    of the original descriptors, with principal component analysis (PCA) being the
    most common. In brief, PCA determines the principal components, or a series of


