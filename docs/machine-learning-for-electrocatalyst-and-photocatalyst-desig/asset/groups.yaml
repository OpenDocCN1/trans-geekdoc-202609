    TiO₂ 纳米颗粒的光催化性能建立模型，但他们的结果也可能过拟合，因为训练集非常小。这类机器学习方法可扩展到更复杂体系的设计和分析，如 ZnO、CuO、Fe₂O₃、CoBi₂O₄
