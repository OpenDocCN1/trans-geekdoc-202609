    # 3.1.4. Other Electrocatalysts.


    2D materials possess large surface area–volume ratios and superior catalytic properties
    that make them useful for energy storage and conversion. Transition metal dichalcogenides
    (TMDCS) are typical 2D materials used as HER catalysts because of their excellent
    electron transfer efficiency.⁹⁰ Ge et al. studied the electrocatalytic performance
    of the heterojunction of two single-layer MX₂ (M = Mo and W; X = S, Se, Te).¹⁴¹
    LASSO was employed to train ML models with rotational angle, bond length, distance
    between layers, and the ratio of the bandgaps of two MX₂ as descriptors and HER/OER
    overpotentials as targets. According to the model, a MoTe₂/WTe₂ heterojunction
    with a rotation of 300° was identified as the best electrocatalyst for the HER
    in this system.


    MXenes are another type of 2D material.³²⁴ They conform to the general formula
    Mₙ₊₁Xₙ, where M is an element from group IIIB to VIB, X is C or N, and n is typically
    1–3. Because of their abundant surface charges, surface functionalization is facile
    for MXenes. An almost infinite number of MXenes can be generated by combining
    transition metals, carbon/nitrogen atoms, and a large variety of surface functional
    groups. This provides a rich palette of potential new materials for optical, electronic,
    catalytic, and energy applications. ML methods are essential to explore this vast
    materials landscape. Wang et al. used a series of ML algorithms to map the intrinsic
    features of 2D MXene ordered binary alloys to their hydrogen adsorption energy
    (Figure 13).¹⁴² An Adaboost model showed that the HER performance could be predicted
    by five descriptors: the bond length of oxygen and surface metal atoms, the distance
    between the nearest neighbor O atoms, the ionization energy difference and the
    average affinity energy of the alloy elements, and the valence electrons of X.
    Zheng et al. used a RF model to screen 299 MXenes and identified a set of Os₂B-
    and S-terminated materials as potential HER catalysts in which the S-


    functional groups are critical for HER performance.³²⁵ These results showed the
    promise of ensemble learning for discovering highly efficient MXene catalysts.


    When element X in MXenes is replaced by boron, a different type of 2D material,
    MBenes, is generated. Experiments and theoretical computations found that M₂B₁-
    and M₂B₂-type MBenes are promising catalysts in the HER because of their metallic
    electrical conductivity. To efficiently identify useful MBenes as HER catalysts,
    Sun et al. first built a data set of 110 pristine MBenes and 70 single-atom-doped
    MBenes and used the DFT-calculated ΔG_H as the model target.¹⁴³ Easily accessible
    descriptors (elemental descriptors, structural energies, and lattice parameters)
    were used to describe the compounds, and four ML algorithms (LASSO, KRR, SVR,
    and RF) were used to train models. The LASSO regression showed that Bader charge
    transfer of the surface metal was the most important descriptor affecting ΔG_H,
    while the d-band center of the surface metal was also important. The SVR had the
    best performance, and Co₂B₂ and Mn-doped Co₂B₂ MBenes were discovered with predicted
    superior HER catalyst performance.


