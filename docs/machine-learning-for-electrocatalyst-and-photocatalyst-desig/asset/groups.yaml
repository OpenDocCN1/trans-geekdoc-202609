    ## 2.3.7. 其他算法


    ### 2.3.7.1 k 最近邻（KNN）


    KNN 因其简单性而被广泛应用于模式识别。给定一个包含 n 个描述符的训练集和一个未知样本，KNN 在 n 维空间中识别未知样本的 k 个最近邻。参数 k
    由用户定义，每对未知数据点与训练集数据点之间的距离通过 n 维空间中的欧氏距离计算。该算法速度很快，因为它仅存储训练集而不对其进行建模，因此新数据可以无缝添加到模型中。然而，当训练集非常大或数据点处于高维空间时，KNN
    的效率较低。它还对噪声、缺失值和异常值敏感，因此对数据进行深度预处理至关重要。此外，所有描述符必须归一化或标准化，以平衡各自的贡献。由于其简单性和可解释性，KNN
    被应用于材料科学的许多领域，例如分子原子化能的预测和催化剂筛选。


    ### 2.3.7.2. 核岭回归（KRR）


    KRR 是岭回归的扩展，用于处理非线性问题。KRR 与 SVR 类似，但 KRR 使用平方误差惩罚，而 SVR 的损失函数是 ε-不敏感损失。在中等规模数据集（<1000
    个样本）上拟合 KRR 模型比拟合 SVR 模型更快，但在大型数据集上拟合数据和预测时，KRR 比 SVR 慢。目前，KRR 模型已被用于材料机器学习建模，例如分析晶体结构、优化催化剂以及学习分子的量子化学性质。261-263


    ### 2.3.7.3. 遗传算法


    遗传算法的灵感来自自然进化。材料被表示为基因组（编码为位串），其中包含成分、结构、合成条件等信息。给定一个随机选择或根据先验经验确定的初始材料池，并评估其适应度后，池中最适应的成员通过交叉和突变等遗传算子进行变异，形成下一代（后代）材料。适应度函数取决于具体应用，例如催化活性、生物活性或量子效率。在遗传优化过程的每次迭代中，通过实验来确定材料池的适应度。


    ### 2.3.7.4 主动学习


    主动学习（有时称为自适应实验设计）是一种迭代式的监督学习，非常适合输出值（目标属性值）稀缺或获取成本高的大型数据集。首先用带标签的数据子集训练一个模型（M₀）。M₀
    提供少量预测不确定性高或多样性高的未标记数据，然后通过实验或计算来确定这些数据的输出值（分类中的离散值，或回归中的连续值）。随后，使用所有标记数据训练一个新模型（M₁）。此过程可以迭代，直到所有数据都被标记或预测误差可接受地低。主动学习的目标是尽可能使用少量标记数据实现高精度。例如，基于由精确
    DFT 计算标记的小型训练集构建的贝叶斯神经网络模型，准确预测了约 220 万个二维异质结构的带隙。276 主动学习在电/光催化剂发现和优化以及数据有限条件下的电/光催化机理研究中具有鲁棒性。129,148,277,278


