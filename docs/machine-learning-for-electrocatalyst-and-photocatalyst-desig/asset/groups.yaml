    Reducing the number of descriptors (via down-selecting or dimension reduction),
    expanding the training set, regularization, or including physical prior knowledge
    is effective. As a useful rule, overfitting is likely to be avoided when the number
    of model variables is less than half of the number of training data. In Section
    2.4, common methods of overfitting control were summarized. Cross-validation is
    effective for small data sets, while validating model predictivity by an independent
    test set is the most reliable method. In addition, it is essential to be aware
    of the domain of applicability of models when using them to screen for new materials
    in unknown material space. The further outside the model domain, the higher the
    prediction uncertainty and the lower the prediction confidence. Some dimension
    reduction techniques, such as t-SNE and UMAP, can be used to illustrate the domain
    of applicability of models. Applying Bayesian regularization to NNs, in which
    the weights are replaced by the distribution of weights, can also estimate the
    uncertainties of model predictions.


    Models may sometimes have good performance for most data but perform poorly on
    a small number of materials (outliers). It is unwise to exclude outliers without
    careful analysis. In some cases, outliers may be the result of experimental error,
    identifiable when relevant measurements are repeated. Outliers may also be the
    result of features that have low occurrences in the training data. Therefore,
    the structure of the outliers, the descriptors, and the model parameters must
    be carefully analyzed, as useful information may be extracted therefrom.


    ## 4.3. Challenges and Opportunities of Machine Learning in Electro/Photocatalytic
    Applications


    Although significant progress has been made in the application of ML to automated
    discovery and development of electrocatalysts and photocatalysts, numerous challenges
    remain. First, the construction of accurate and broadly applicable ML models relies
    on large, high-quality data sets, but acquiring these data sets can be difficult
    or expensive. Published data from the literature could be an important data source
    for ML model construction. However, catalytic reactions are not only strongly
    dependent on experimental parameters such as temperature, concentration, pressure,
    and flow rate but are also sensitive to other conditions that might be overlooked
    (e.g., shape of reactor, stirring speed). This can render different published
    results incomparable. More rigorous recording of all relevant metadata in experiments
    will overcome this issue as will the use of positive control materials in experiments.
    The reliability of the published data is another issue. For example, while sacrificial
    reagents are widely used in photocatalytic water splitting to capture holes and
    thus improve the hydrogen generation rate, it was found that hydrogen could be
    generated from sacrificial reagent oxidation. Das et al. revealed that some solvents
    are extremely sensitive to UV light, degrading into CO, CH₄, and C₂H₄, causing
    biased results in photocatalytic CO₂ reduction. Even under identical conditions,
    some experimental results are difficult to repeat by other laboratories. Such
    critical analysis of the published data by catalyst experts prior to adding them
    to training sets is important. In addition, ML models can be biased because only
    successful results tend to be reported, while low-performing or inactive materials
    also provide useful information to ML models. Instead of using published data,
    widespread adoption of high-throughput synthesis and characterization methods
    should alleviate these issues in the future. Also, collaborations


    Second, despite some successful structure–electro/photocatalytic reactions by
    ML modeling are rarely performed. We exemplified this using an ML-molecular dynamics
    study of PCET on an ultrafast time frame. However, the application of ML to the
    investigation of other important kinetic processes, such as single or multielectron
    oxidation/reduction, charge transfer between solid–solid or solid–liquid interfaces,
    separation, and recombination of carriers, is still rare. This is probably because
    of the difficulty of probing the excited state of the molecules via computation
    and experiments, resulting in insufficient data for ML model training. Recently,
    some cutting-edge experimental technologies, such as Kelvin probe force microscopy,
    femtosecond-resolved transient absorption spectroscopy, and time-resolved transient
    photoluminescence, have been developed to study carrier mobility. Time-dependent
    DFT has been used to study the dynamics of electrons at excited states in photocatalysts,
    and ML techniques have found a role in accelerating and increasing the accuracy
    of the time-dependent DFT calculation. It is expected that ML will contribute
    further to the electro/photocatalytic mechanisms when it is combined with the
    in situ investigation data and molecular dynamics simulations.


    Third, as experimental or first-principles computational data will continue to
    be scarce, it is important to develop techniques for generating reliable ML models
    from smaller data sets. Cutting-edge solutions, such as reinforcement, active,
    and transfer learning, have been developed to address the learning problem with
    limited data. More recently, meta-learning is proposed to be another promising
    solution to the issues of small data sets. Meta-learning generates models that
    can adapt and generalize to new tasks and new environments through the learning
    experiences from other models. In other words, a meta-learning model will first
    learn relationships from the other relevant models trained on large data sets,
    and use this prior knowledge to solve the problems on smaller data sets. As an
    example, stacking-based meta-learning has been used to learn the predictions from
    various base models, on which accurate models are constructed to predict the bandgap
    and hydrogen evolution activity of oxide photocatalysts with a wide range of structures.
    Transformational ML is another meta-learning algorithm promising to be the solution
    to small data sets. Unlike stacking that learns knowledge from multiple base models,
    transformational ML extracts knowledge across a set of related tasks. Currently,
    transformational ML is robust in drug discovery, and we expect that it will find
    its application in electro/photocatalytic development (e.g., a mapping of structure
    to catalytic activities for different molecules). It is anticipated that meta-learning
    can accelerate the research of electro/photocatalytic materials with insufficient
    data. Ultimately, there is a limit to how much information an ML model can extract
    from limited amounts of data.


    Fourthly, it is challenging to describe the complex catalytic mechanisms via simple
    and interpretable descriptors. As descriptors not only bridge the gaps between
    features of catalysts and the dynamic events in catalysis but also have a major
    impact on ML model quality, feature selection from a pool of potential descriptors
    is essential. The most popular strategies are selecting descriptors based on the
