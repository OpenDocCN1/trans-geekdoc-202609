    78 种有机污染物的因素。使用紫外光强度、TiO₂ 投加量、水中有机污染物浓度、pH 值、温度以及有机物结构（以分子指纹描述）作为输入，利用文献中的 446
    个数据点训练模型。他们得出结论：有机污染物的结构对降解速率影响最大。Fathinia等人使用神经网络模型研究了 TiO₂ 对盐酸非那吡啶的光催化降解。实验参数作为描述符，模型分别在
