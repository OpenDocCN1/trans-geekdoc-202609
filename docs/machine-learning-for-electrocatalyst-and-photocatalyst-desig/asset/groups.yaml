    二维材料具有大的表面积-体积比和优异的催化性能，使其可用于能量存储和转换。过渡金属二硫属化物（TMDCs）因其优异的电子转移效率而成为典型的析氢反应催化剂。


    Ge等人研究了两个单层MX₂（M = Mo和W；X = S、Se、Te）异质结的电催化性能。¹⁴¹ 采用LASSO训练机器学习模型，以旋转角、键长、层间距离以及两个MX₂带隙之比作为描述符，以析氢反应/析氧反应过电位作为目标。根据该模型，旋转300°的MoTe₂/WTe₂异质结被确定为该体系中析氢反应的最佳电催化剂。


    MXenes是另一种二维材料。³²⁴ 它们符合通式Mₙ₊₁Xₙ，其中M是IIIB族至VIB族的元素，X是C或N，n通常为1–3。由于其丰富的表面电荷，MXenes的表面功能化很容易实现。通过组合过渡金属、碳/氮原子以及各种表面官能团，可以生成几乎无限数量的MXenes。这为光学、电子、催化和能源应用提供了丰富的新材料储备。机器学习方法是探索这一广阔材料景观所必需的。


    Wang等人使用一系列机器学习算法将二维MXene有序二元合金的内在特征映射到其氢吸附能（图13）。¹⁴² 一个AdaBoost模型表明，析氢反应性能可以通过五个描述符预测：氧与表面金属原子的键长、最近邻O原子之间的距离、合金元素的电离能差和平均亲和能，以及X的价电子。Zheng等人使用随机森林模型筛选了299种MXenes，并确定了一组以Os₂B和S结尾的材料作为潜在的析氢反应催化剂，其中S官能团对析氢反应性能至关重要。³²⁵
    这些结果表明集成学习在发现高效MXene催化剂方面的前景。


    当MXenes中的X元素被硼取代时，会产生另一种类型的二维材料——MBenes。实验和理论计算发现，M₂B₁型和M₂B₂型MBenes因其金属导电性而成为有前景的析氢反应催化剂。为了高效地识别有用的MBenes作为析氢反应催化剂，Sun等人首先构建了一个包含110种原始MBenes和70种单原子掺杂MBenes的数据集，并以DFT计算的ΔG_H作为模型目标。¹⁴³
    使用易于获取的描述符（元素描述符、结构能量和晶格参数）来描述化合物，并采用四种机器学习算法（LASSO、KRR、SVR和RF）来训练模型。LASSO回归表明，表面金属的Bader电荷转移是影响ΔG_H的最重要描述符，而表面金属的d带中心也很重要。SVR性能最佳，并发现了Co₂B₂和Mn掺杂的Co₂B₂
    MBenes具有预测的优异析氢反应催化剂性能。


    ## 3.2. 光催化

    光催化将太阳能转化为化学能。³²⁶ 有用的应用包括光催化水分解、水污染物降解和CO₂还原。⁸,⁹,³²⁶–³²⁸ 与电化学反应不同，光化学反应由光子驱动。光催化剂吸收能量大于其带隙的光子；当电子移动到导带（CB）时，产生电子-空穴对，在价带（VB）中留下空穴。这些光生电子和空穴随后要么复合，要么通过光催化剂移动到表面。一旦到达表面，只要光催化剂的带能与反应物匹配良好，它们就可以引发氧化还原反应。例如，电子和空穴可以分别触发H⁺还原（析氢）和H₂O氧化（析氧），或者产生自由基（如•OH、O₂•−）来氧化有机污染物。⁹,³²⁶,³²⁷
    光催化剂是从太阳能生产可持续燃料、减缓温室气体增加和净化污染水体的有前景材料。人们对具有高效率、低成本和化学稳定性的光催化剂需求很大。机器学习方法已被用于探索广阔的光催化剂空间，特别是考虑到光催化反应的特异性以及反应动力学和热力学的复杂性。它们旨在加速光催化剂筛选和光催化反应参数的优化，并有望大幅降低催化剂设计和发现的成本。


    水分解是光催化最重要的应用之一。虽然大多数光催化剂是无机的，但某些有机物已显示出光催化活性。在PubChem数据库中记录的1亿种独特化合物中，一个特殊的子集——共轭聚合物——引起了相当大的关注。³³¹
    共轭聚合物含有π共轭主链、离子功能化的烷基侧链和抗衡离子。主链中的π电子增强了电荷转移，赋予这些聚合物优异的光学性能，而离子功能性使它们能够分散到极性溶剂（如水）中。因此，一系列共轭聚合物已作为光催化剂出现，³³²–³³⁴
    但这些聚合物的结构组分（主链、侧链、离子基团和抗衡离子）如何影响光催化性能仍不清楚。为了研究结构-性能关系并帮助设计更好的光催化剂，Zwijnenburg等人使用GBR模型搜索了6354种共轭共聚物，以识别具有高牺牲析氢速率的新型光催化剂（图14）。¹⁴⁴
    这些共聚物通过将706种二溴单体与9种二硼酸或二硼酸酯连接而成。训练集共聚物由127种二溴化物与二苯并[b,d]噻吩砜偶联生成，并对其水分解能力进行了表征。每种共聚物通过四个描述符编码：LUMO；电子亲和能（EA，近似为LUMO能量）；电离能（IP，近似为HOMO能量）；光学带隙；以及透光率（衡量聚合物在反应介质中分散程度的指标）。研究发现，活性催化剂需要负电子亲和能、更正的电离能、更大的带隙和溶剂分散性的组合。Wan等人使用RF算法研究了1296种阴离子共聚物的带隙、HOMO和LUMO，因为这些性质对光催化活性很重要。他们推断，主链中供体和受体组分的前线轨道在决定这些聚合物的带隙和前线轨道位置方面起关键作用。因此，可以为光催化剂设计提出合理的标准。Li等人使用机器学习技术探究了聚合物结构与析氢反应活性之间的关系。¹⁶⁶
    使用k均值聚类，他们发现大多数高性能聚合物共享一个共同的结构特征，即至少存在一个芳基羰基部分。然而，具有该部分的聚合物的光催化活性可能不同。通过一系列监督学习方法发现了额外的结构-性能关系，并确定激子电子亲和能、电子亲和能、激子结合能、光学带隙和单重态-三重态能隙是最相关的特征。这些机器学习模型对于光催化剂的快速筛选具有潜在用途。


    TiO2是最广泛使用的光催化剂之一，因为它储量丰富、化学稳定性高且光催化活性高。⁸ 理解水分子在TiO2表面解离的机制对于基于TiO2的光催化剂设计至关重要。Selloni等人使用机器学习辅助的分子动力学模拟研究了这一过程。³³⁵
    代替传统的DFT计算，构建了一个DNN模型来预测体相锐钛矿TiO2、体相水以及锐钛矿{101}-水界面的原子能量。使用这三个系统中原子小簇的DFT计算性质来训练DNN模型。该模型预测了这些簇中其他几个原子的原子能量。


