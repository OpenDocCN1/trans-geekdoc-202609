    Tu Le is a lecturer at the School of Engineering, STEM College, RMIT University.
    Prior to joining RMIT University in 2017, she worked at the Commonwealth Scientific
    and Industrial Research Organisation. She completed her Ph.D. at Swinburne University
    of Technology in 2010. She is interested in material design and development using
    machine learning algorithms for a broad range of applications such as sustainable
    energy generation and storage, sensors, and therapeutics.


    Dehong Chen is a research fellow at Applied Chemistry & Environmental Science,
    RMIT University, Australia. He received his Ph.D. degree in Chemistry from Fudan
    University in 2006. Before joining RMIT University, he conducted research work
    at the University of Melbourne and the Australian National University. He currently
    has interests in the design and synthesis of diverse functional materials for
    a range of applications including clean energy utilization, energy storage, environmental
    remediation, and sensing.


    David Winkler is a professor at La Trobe Institute for Molecular Science at La
    Trobe University, a visiting professor at the University of Nottingham, and a
    Professor of Medicinal Chemistry, Monash Institute of Pharmaceutical Sciences,
    Monash University. His research on applying computational chemistry, AI, and machine
    learning methods to the design of drugs, agrochemicals, nanomaterials, and biomaterials
    has led to over 200 journal articles and book chapters as well as 25 patents.
    He has won prestigious awards including the CSIRO Medal for Business Excellence,
    RACI’s Adrien Albert award, and the ACS Herman Skolnik award. He is ranked 227th
    of 81 000 medicinal chemists, and 999th of 520 000 chemists worldwide (Mendeley
    2019).


    Rachel Caruso is a professor in the Applied Chemistry and Environmental Science
    discipline at RMIT University. She studied at The University of Melbourne before
    leading research teams at the Max Planck Institute of Colloids and Interfaces,
    The University of Melbourne, the Commonwealth Scientific and Industrial Research
    Organisation, and RMIT University. Her expertise in materials chemistry has been
    applied to investigating structural control of materials on the nanoscale, with
    a focus on porous metal oxides, perovskites, and carbon-based materials with potential
    for photocatalysis, adsorbents, and energy conversion and storage applications.


