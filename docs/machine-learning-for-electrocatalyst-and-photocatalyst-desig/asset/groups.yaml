    **图 6.** 集成学习的示意图。多个机器学习模型（模型 1 到 *n*，弱学习器）组合成一个集成模型，以获得更好的预测（强学习器）。


    其准确率显著高于在数据集上训练的单个模型，且袋装模型能够最小化过拟合和噪声影响。最常用的袋装集成模型之一是随机森林（RF），它结合了一系列决策树的结果。RF
    具有显著优势，例如对异常值和误差的鲁棒性、高效率、良好的性能，并能提供变量重要性的估计。因此，RF 模型适用于稳健地预测催化剂性质，如电催化活性、气体吸附自由能和光催化性能，以及揭示影响这些性质的关键因素。例如，Ying
    等人构建了一个 RF 模型来研究 C₂N 上单原子催化剂的双功能析氧/还原反应活性，并确定单原子催化剂的外层电子数和氧化物形成焓是决定其活性的两个最重要因素。这项工作表明，RF
    不仅能节省计算时间和成本，还能为单原子催化剂的电催化活性提供更深入的见解。尽管透明度良好，但当决策树数量较大时，RF 的复杂度可能很高，因此训练时间将显著延长。


    袋装方法平等地对待所有训练数据点，并简单地将每个单独模型（弱学习器）的输出组合起来；而提升方法则为每个数据点和每个弱学习器分配权重。在模型 Mᵢ 训练完成后，误差较大的数据点的权重会增加，而误差较小的数据点权重会降低。这强调了预测不佳的数据点，同时每个弱学习器的权重也根据误差进行估计。AdaBoost
    是流行的提升算法之一。与袋装方法相比，AdaBoost 可能过拟合数据，因为它更关注预测不佳的数据点，但它可能达到比袋装方法更高的精度。与关注具有较大预测误差的数据点不同，梯度提升使用当前模型预测值与真实值之间的残差误差。类似于第
    2.3.1 节讨论的梯度下降算法，梯度提升通过逐步将一个新模型引入当前模型中来最小化损失函数，该新模型能在最大程度上降低损失函数。这个过程不断迭代，直到找到最优损失值。由于高精度和通用性，梯度提升算法，如梯度提升树（GBT）和梯度提升回归（GBR），被广泛应用于材料筛选、发现和性能预测。


    ## 2.3.6. 聚类


    聚类是一种无监督学习方法，它将一组数据划分为若干子集，每个子集中的所有成员彼此相似。与分类不同，聚类的数据没有标签，其相似性由数学描述符确定。聚类有助于发现数据中先前未知的模式。


    材料科学中常用几种聚类算法。最著名的是 *k*-均值聚类，它基于特征空间中数据点之间的欧氏距离，将数据划分为 *k* 个簇（*k* 由操作者预先设定）（图
    7a）。该算法计算效率高，可应用于连续 *n* 维空间中的数据，但对噪声和异常值敏感。层次聚类将数据点呈现为层次结构（图 7b）。尽管该算法对簇的数量没有限制，但采用哪种层次作为最终的聚类度量仍依赖人工输入。其结果也对噪声敏感。为了克服噪声敏感性并发现任意形状的数据簇，开发了基于密度的噪声应用空间聚类（DBSCAN）。这里，DBSCAN
    不采用数据点之间的距离，而是利用数据点周围的密度相似性，因此可以很容易地将噪声与信息区分开。它适用于凸和非凸数据集的聚类（图 7c）。然而，DBSCAN 比
    *k*-均值和层次聚类更复杂，对大型数据集进行聚类需要更长的计算时间。聚类算法已应用于催化研究中的光谱分析和催化剂发现。


    ![](img/385acff8214d70e1094d2d47342cdb40_11_1.png)


    **图 7.** 一些聚类算法的示意图。(a) *k*-均值聚类；数据点被划分为三个簇（以绿色、蓝色和粉色点表示）。黑色点表示这些簇的均值。(b) 层次聚类，其中五个数据点被层次化划分。(c)
    DBSCAN，成功聚类的数据点用不同颜色的三角形表示，噪声数据用黑色圆圈表示，不确定数据用可能归入的簇颜色的圆圈表示。


