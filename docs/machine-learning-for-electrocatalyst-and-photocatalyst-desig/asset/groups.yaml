    ## 2.3.6. Clustering.


    Clustering is an unsupervised learning method that partitions a set of data into
    subsets in which all members are similar to each other. Unlike classification,
    the clustered data are unlabeled, and their similarity is determined by mathematical
    descriptors. Clustering is useful for discovering previously unknown patterns
    in data.


    Several clustering algorithms are commonly used in materials science. The best
    known is *k*-means clustering that partitions data into *k* clusters (*k* is preset
    by a human operator) based on the Euclidean distance between the data points in
    the feature space (Figure 7a). It is computationally efficient and can be applied
    to data in continuous *n*-dimensional space, but it is sensitive to noise and
    outliers. Hierarchical clustering presents the data points as a hierarchy (Figure
    7b). Although there is no limit to cluster numbers in this algorithm, which hierarchy
    is adopted as the ultimate clustering metric still relies on human input. The
    results are also sensitive to noise. To overcome noise sensitivity and discover
    data clusters of arbitrary shape, Density-Based Spatial Clustering of Applications
    with Noise (DBSCAN) was developed. Here, rather than using distances between data
    points, DBSCAN uses the similarity of the density around the data points, and
    thus it can easily distinguish noise from information. It is suitable for clustering
    of both convex and nonconvex data sets (Figure 7c). However, DBSCAN is more complex
    than *k*-means and hierarchical clustering, requiring longer computation time
    to cluster large data sets. Clustering algorithms have been applied to spectral
    analysis and catalyst discovery in catalysis research.


