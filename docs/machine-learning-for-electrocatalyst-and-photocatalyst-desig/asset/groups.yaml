    ### 2.4. 模型验证


    模型必须通过确定其在训练集上的属性预测精度以及更为重要的未知数据来进行验证。决定系数（r²）、均方根误差（RMSE）和平均绝对误差（MAE）是常用的评估模型质量的指标。对于大小为
    n 的数据集，具有测量属性 ⟨y₁, y₂, ..., yₙ⟩，平均属性 ȳ，以及预测值 ⟨ŷ₁, ŷ₂, ..., ŷₙ⟩ 时，这些及其他指标的计算如下：


    r² = 1 − [Σᵢ₌₁ⁿ(yᵢ − ŷᵢ)² / Σᵢ₌₁ⁿ(yᵢ − ȳ)²] = [Σᵢ₌₁ⁿ(ŷᵢ − ȳ)² / Σᵢ₌₁ⁿ(yᵢ − ȳ)²]  (5)


    RMSE = √[Σᵢ₌₁ⁿ(ŷᵢ − yᵢ)² / n]  (6)


    MAE = Σᵢ₌₁ⁿ|yᵢ − ŷᵢ| / n  (7)


    良好的模型的 r² 值接近 1，且 RMSE 和 MAE 值接近 0。r² 值取决于训练集的大小和模型参数的数量，而 RMSE 或 MAE 值则不取决于这些因素。MAE
    对大离群值的影响小于 RMSE。因此，使用 RMSE 或 MAE 来评估模型的预测能力更为合适。


    对于分类模型，精确率、召回率和准确率指标被广泛使用：


    precision = TP / (TP + FP)  (8)


    recall = TP / (TP + FN) = TP / P  (9)


    accuracy = (TP + TN) / (TP + TN + FP + FN)  (10)


    其中 TP 指真阳性，即正例被分类器正确标记；TN 指真阴性，即负例被正确标记；FP 指假阳性，即正例被错误标记；FN 指假阴性，即负例被错误标记；P 表示正例的数量。精确率和召回率可以合并为单一指标——F1
    分数：


    F1 = 2 × precision × recall / (precision + recall)  (11)


    F1 分数及相关的 G-mean（召回率与精确率的几何平均）在文献中很常见。它们在类别不平衡的数据集中更有用（一种类的数据点远多于另一种类），因为准确率会产生误导。对于一个好的分类器，精确率、召回率、准确率、F1
    分数和 G-mean 都应接近 1。


    导致模型指标差的原因包括使用低相关性描述符；由于模型过于简单（例如线性 vs 非线性模型）导致的欠拟合；由于描述符过多导致的过拟合；或数据集中某些特征因尺寸小或多样性高而表示不足，导致模型无法正确学习这些特征。可以通过比较线性和非线性机器学习方法来避免欠拟合，对描述符的相关性进行研究（例如使用相关性），并排除在数据集中表示不足的特征。如果可能，数据集的大小应扩大，必要时通过插补缺失数据来实现。


    当模型过于复杂或描述符过多时，可能会出现过拟合。过拟合模型对训练数据预测极好，但对新数据的预测较差。过拟合可以通过使用训练集和测试集来检测。原始数据集被划分为两个集合：一个训练集用于构建模型，一个测试集用于模型验证。通常，60–90%
    的数据被分配到训练集，其余部分分配到测试集。由于训练集和测试集完全独立，该方法提供的模型预测能力估计比交叉验证或引strap（bootstrapping）方法更为保守。如果训练集和测试集的指标良好且相似，则模型被认为是稳健的。该方法简单实用，但需要足够大的数据集用于训练和测试集划分，否则结果可能出现问题。


    交叉验证是评估小数据集模型准确性的良好替代方法。在此，原始数据集被划分为 k 个子集，进行 k 次训练和测试。在每次迭代中，一个子集作为测试集，其余子集用于训练。这称为
    k 折交叉验证。与 train-and-test 方法不同，交叉验证中每个数据点会在训练中被使用 k−1 次，在测试中被使用一次。“留出一例”（LOO）方法是交叉验证的一个特例，其中每次先将一个数据点留出用于测试，其余数据用于训练。LOO
    是常用的交叉验证方法之一。LOO 给出的估计是可重复的，但计算成本高且耗时。为降低计算开销，可以使用 10 折交叉验证。注意，交叉验证给出的模型预测能力估计比
    train-and-test 方法更为乐观，因为训练集和测试集并不独立。


    过拟合可以通过扩大数据集规模、事先减少描述符数量、在相同描述符数量下降低模型复杂度，或加入正则化项以剔除与被建模属性无关的描述符来最小化。


    构建用于解决电/光催化问题的机器学习模型的主要步骤已被概括。我们强调数据质量在机器学习模型构建中发挥关键作用。因此，尤其是当数据来源于不同来源时，数据可靠性必须被仔细评估。这需要数据科学家、催化剂科学家和材料科学家紧密合作，以建立电/光催化数据记录的标准格式。特征化（Featurization）确保描述符的数量恰当以描述输入数据，过多的特征可能导致模型过拟合。尽管开发了多种描述符，但某些描述符（如
    d-带中心和中间吸附自由能）在催化反应中测量非常困难，因此更倾向于使用简单且易于获取、具有可解释特征–属性关系的描述符。机器学习模型的选择取决于要解决的问题和数据结构。换句话说，训练数据的质量、数量和多样性，以及描述符的相关性，决定了应使用哪种机器学习模型。模型的预测能力和透明度应保持平衡，模型的预测能力在使用前必须被评估。在电/光催化科学的研究中，推荐使用可解释性良好的模型，因为它们可以加速催化剂发现、在更大时间尺度上模拟催化机理、增强表征并阐明底层结构–属性关系。


    ## 3. 机器学习在电催化剂和光催化剂中的应用


    ### 3.1. 电解


    #### 3.1.1. 中间合金。


    电化学反应在阳极（例如 OER）和阴极（例如 HER、氧 reduction 反应（ORR）、二氧化碳还原、氮还原）各进行一半反应，并由电子驱动。需要活性催化剂以提高效率并最小化这些反应的过电位。在这些反应中，HER
    和 ORR 广泛用于清洁能源的生产。HER 是典型的两电子转移反应，氢吸附自由能 ΔG_H 是决定活性的关键。ORR 涉及四电子转移将氧气还原为水，或两电子两质子途径生成过氧化氢。活性电催化剂在该反应中
    ΔG_H 接近零，同时对反应中间体（H*、OH*、O* 等）具有适度的结合能。铂是 HER 和 ORR 中表现最佳的电催化剂，因为其 ΔG_H 为热中性。然而，Ooka
    等人报告称热中性并未带来最大的电催化活性。289 他们通过遗传算法对实验结果进行微观动力学方程拟合，发现聚晶 Pt 表面 H 的结合能为 0.094 eV
    时活性最大。他们提出，在 HER 中正的 ΔG_H 更受欢迎，因为该反应具有电驱动力。尽管活性很高，铂的稀缺性和高成本限制了其商业应用。已开发了多种替代铂的催化剂，包括无铂中间合金、氧化物、单原子催化剂、硫化物和
    MXenes。


