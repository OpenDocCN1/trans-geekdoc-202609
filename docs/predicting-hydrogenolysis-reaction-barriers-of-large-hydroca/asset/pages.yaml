    # 3.1. BEP relations


    The reactions constitute a stable state for dehydrogenated hydrocarbons on three
    metals. BEPs for lighter hydrocarbons on Pates have been reported [46,57]. Here
    we use these BEP relations for large hydrocarbon C-C and C-H bond cracking. We
    used three data sets to construct the BEP relations for all types of carbon species.


    The correlations for each hydrocarbon state are depicted in Figure 1 and are listed
    in Table 1. The reaction energies are correlated with the activation energy to
    quantify the performance. The BEPs are better for C-C and C-H cracking with a
    MAE of 0.19 eV for metals. For C-C cracking the accuracy is higher (0.2 eV). C-C
    cracking reactions have larger activation energies than C-H cracking reactions
    respectively. The reaction barrier depends not only on the metal, but also on
    the ionic bond [59]. The C-C and C-H bonds bond differently on surfaces.


    The slope of a BEP correlation reveals the structure of the transition state;
