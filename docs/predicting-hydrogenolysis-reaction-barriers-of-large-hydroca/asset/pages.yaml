    # 4. Conclusions


    Accurate prediction of activation energies is crucial for the performance of catalysts.
    In this study, we compiled a dataset of 2083 calculated activation barriers for
    reactions on various metals. We developed two methods to estimate activation energies.
    The first is an extension of traditional BE relationship, which applied to larger
    hydrocarbon species. However, BE relationship shows limitations, with correlations
    being more accurate than predicted-C-C cracking results. This finding shows that
    with the structural change the barriers are more accurate on Pt and Ru. However,
    when aggregating all data, BE entropy results in limited results for the prediction.
    [76,47]. These correlations are better than predicted in previous studies.


    To address shortcomings of traditional BE, we developed ML models using easy descriptors
    for the catalyst, metal surface, and reaction type. The most effective method
    shows a mean absolute error of 0.19 eV and 0.6 eV when the reaction energy is
    a descriptor. Critical features include the homogeneous series (C-C vs. C-H reaction)
    and the metal atom''s electronegativity and atomic mass. We also analyzed its
    transferability, showing reasonable applicability in predicting activation barriers
    across transition metals.


