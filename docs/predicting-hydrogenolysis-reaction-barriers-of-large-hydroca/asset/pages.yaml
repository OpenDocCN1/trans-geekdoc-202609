    # 3.3. Model performance


    To predict the activation energies, we exploited several regression algorithms
    and tuned their hyperparameters. We tested linear, kernel, and boosting models,
    including support vector regression (SVR), random forest (RF), and extreme gradient
    boosting (XGB). We prioritized simpler models to improve interpretability. The
    MAE was chosen as the performance metric.


    To evaluate the performance, we used a test set of 50 reactions. The MAE of 0.24
    eV indicates that even basic models can be effective when using well-selected
    features. Among all tested, the XGBoost outperformed the others, with an MAE of
    0.16 eV on the test set. However, it also required much longer training time due
    to its optimization process by solving a complex function in a high-dimensional
    space.


