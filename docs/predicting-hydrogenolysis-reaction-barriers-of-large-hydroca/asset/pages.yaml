    | ARTICLE INFO | ABSTRACT |

    |---|---|

    | Keywords: | Calculating activation energies of chemical reactions for large
    reaction networks is computationally demanding. Brunsted-Evans-Polanyi (BEP) relations
    are used to predict activation energies, but they are prone to substantial errors.
    Here, machine learning is used to predict energies for reactions on metals, including
    Ru, Pt, and Rh. The dataset includes 380 DFT-calculated activation energies of
    C-C and C-H reactions from C1 to C65. The mean absolute error of BEP is 0.38 eV,
    providing predictions on hydrocarbons with much larger errors. In comparison,
    an XGBoost model achieves better accuracy for the DFT-calculated energies. The
    model selects the most features among reactions and the electronegativity and
    atomic mass of the metal atoms as keys. The model appears transferable across
    classes. This approach can provide rapid and accurate estimates of energies for
    recycling. We showcase the impact of hydrocarbon chain length and branching on
    barriers, discuss implications for the depolymerization rate of polypropylene
    and low-density polyethylene, and the feasibility of hydrolysis catalysis.


    # 1. Introduction


    Plastic waste accumulation in oceans and soils has become an environmental crisis
    [1]. This issue intensified during the recent pandemic [2], marked by a spike
    in plastic use. This surge has increased reliance on consumption, contributing
    to CO2 emissions [3], and landfilling of consumer packaging, forms, and products
    presents a major challenge for polyfins, like polypropylene and polyethylene,
    where recycling cycles are low. Chemical recycling [6–8], to provide high yields
    [9], is a promising approach to converting plastic waste into valuable products.


