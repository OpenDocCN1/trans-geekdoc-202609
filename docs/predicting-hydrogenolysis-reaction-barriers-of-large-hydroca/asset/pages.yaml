    # 3.6. Implications for hydrogen catalysis


    We demonstrate the utility of these ML models with examples. First, we provide
    insights into the transferability of hydrogen catalysis by cracking C-C bonds
    on the three catalysts (Rh, Pb, and Pt). Reactions of linear branched hydrocarbons
    exhibit different characteristics on different catalysts. On Rh, the reaction
    with the lowest barrier (0.14 eV) for C-C cracking of $CH_3CH_2CH(CH_3)CH_2CH_3
    \rightarrow CH_3CH_2CH(CH_3)_2 + CH_3$ and $CH_3CH_2CH(CH_3)CH_2CH_3 \rightarrow
    CH_3CH_2CH(CH_3)CH_3 + CH_3$ with a barrier of 0.28 eV. Pt and Pb show the highest
    barrier among the three catalysts for the cracking reaction.


