    2.3. Machine learning (ML) models


    In developing models, we included all reaction 380 of the DFT activation barriers.
    The software used was scikit-learn (version 1.0.2) which we used for this work.
    We tested all models, 80% of the data were randomly selected and used to train
    the model, while the remaining 20% was used to test the model. K-fold cross-validation
    (k=10) was used to avoid overfitting. The XGBoost regression [58] showed the best
    performance. The hyperparameters were optimized using Bayesian optimization as
    used by Lee [53]. The optimal hyperparameters for each model are summarized in
    Table S1.


    # 2. Methods


    # 2.1. DFT calculations


    All electronic and vibrational frequencies were calculated using the Vienna ab
    initio software [38,39] (VASP 5.4) and the Atomic Molecular Environment [40].
    We used the projected plane-wave (PAW) method [41,42] to describe the electrons
    and the Perdew-Burke-Ernzerhof generalized gradient approximation (GGA) to calculate
    the exchange-correlation energies. The D correction [43] was added to account
    for dispersion interactions. The Kohn-Sham electron-wave functions were expanded
    in a plane-wave basis. The convergence for the self-consistent electronic iteration
    was met with a threshold of $10^{-6}$ eV. The plane-wave mesh was converged with
    a force threshold of $10^{-2}$ eV/Å. The k-point mesh was constructed using the
    Monkhorst-Pack scheme [45]. The conjugate gradient algorithm with a force threshold
    of 0.02 eV/Å was used for ionic atoms.


    All structures were relaxed with four-layer slabs, and in the top layers were
    allowed to relax in all directions. We stopped until 15 eV of vacuum was added
    to minimize the interaction between slabs, and dipole moments were converged to
    a potential energy. The reaction energy was calculated as the difference between
    the final state energy $E_{final}$ and initial state $E_{initial}$. The activation
    energy was defined as the difference between the transition state (TS) energy
    $E_{TS}$ and initial state $E_{initial}$.


    The climbing dimer elastic band (CI-NEB method [47] was used with the dimer method
    [48] to search for the TS of reactions, and were verified by vibrational analysis
    searching for the existence of only one imaginary mode. The reaction path was
    determined and converged with a force below below 0.05 eV/Å. The TS determined
    by the CI-NE method was used as the input to the dimer method. The VIIST tools
    were used for CI-NE, dimer method, and frequency calculations [49].


