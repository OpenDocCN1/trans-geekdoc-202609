    # 3.4. Feature analysis


    Identifying the features that influence the activation energy is vital. For this
    purpose, we employed the SHAP (Shapley Additive exPlanations) method proposed
    by Lee et al. [51] to assess the performance of the XGBoost model. SHAP is an
    advanced machine learning technique grounded in game theory. We calculated Shapley
    values for predicting activation energies, displaying each feature''s importance
    and their average impact on model predictions. Notably, the reaction, specifically
    the C-C cracking has a higher feature value, consistent with correlation in Fig.
    3. The two most important features are electronegativity and the molecular weight
    of the reaction. Fig. 4d shows the features in terms of how important and how
    each feature affects the model output. For example, when the reaction, type-C
    has a higher value in the plot, the model output is larger, consistent with the
    C-C cracking reactions having higher activation energy.

    The cis/trans descriptor only has a minor effect. The model after this feature
    gives a set test size MAE of 0.20, close to the original model. A plausible explanation
    could be the limited number of cis/trans isomers in our dataset, potentially underrepresenting
    this feature''s significance. Considering, we opted to retain this feature in
    the model.


