    After training the machine learning model, it is important to evaluate its performance.
    Let''s first examine the confusion matrix before considering the accuracy score
    as seen in Figure 3-29.


    ![](OEBPS/image_rsrc55K.jpg)


    Figure 3-29.


    # Code Explanation


    The line `cm = confusion_matrix(y_test, y_pred)` involves using the `confusion_matrix`
    function from the `scikit-learn` library to evaluate the performance of a classification
    model. Here’s a detailed explanation:


    `confusion_matrix(y_test, y_pred)`:


    y_test: This is the array of true class labels for the test dataset. These are
    the actual values that you are trying to predict.


    y_pred: This is the array of predicted class labels that the model has generated
    for the test dataset. These predictions are made by the model and are based on
    the test features (`X_test`).


    Confusion Matrix:


    The confusion matrix is a table that is often used to describe the performance
    of a classification model. It shows the number of correct and incorrect predictions
    made by the model compared to the actual outcomes (ground truth).


    It is a 2x2 matrix for binary classification problems, which looks like this:


    [[TN, FP],


    [FN, TP]]


    Where:


    TN (True Negative): The number of correctly predicted negative class instances
    (actual negative and predicted negative).


    FP (False Positive): The number of incorrectly predicted positive class instances
    (actual negative but predicted positive).


    FN (False Negative): The number of incorrectly predicted negative class instances
    (actual positive but predicted negative).


    TP (True Positive): The number of correctly predicted positive class instances
    (actual positive and predicted positive).


    # Interpreting the Confusion Matrix


    The confusion matrix helps you understand how well your classification model is
    performing in terms of its ability to predict each class correctly.


    It provides detailed insight into the types of errors the model is making:


    High values on the diagonal (TN and TP) indicate good performance.


    High values off the diagonal (FP and FN) indicate areas where the model is making
    mistakes.


    By examining the confusion matrix, you can gain a deeper understanding of your
    model''s performance beyond what is provided by a single metric like accuracy.
    This can help you identify specific areas where the model needs improvement.


    # Confusion Matrix interpretation


    Figure 3-30 shows the confusion matrix from the logistic regression model.


    ![](OEBPS/image_rsrc55M.jpg)


    Figure 3-30.


    Let''s interpret this confusion matrix:


    True Negatives (TN): 74


    These are the instances where the actual class was negative (e.g., no heart disease)
    and the model correctly predicted it as negative.


    False Positives (FP): 24

