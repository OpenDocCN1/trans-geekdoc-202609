    \ scikit-learn 中，这可以通过 SVC() 创建，然后使用 cs.fit(X_train, y_train) 进行拟合。\n\n-   X_test：这是包含您希望预测目标变量特征的测试数据集。这些特征应该与训练数据（例如，标准化）处理方式相同。\n\
    \n-   predict(X_test)：该方法用于根据核心支持向量机模型 cs 对输入数据 (X_test) 预测类别标签。\n\n-   y_pred\
    \ 是一个包含 X_test 中每个观测的预测类别标签的数组。对于二分类问题，y_pred 中的值将是 0 或 1。\n\n# 模型评估\n\n-   在训练机器学习模型后，评估其性能很重要。让我们首先查看混淆矩阵（如图\
