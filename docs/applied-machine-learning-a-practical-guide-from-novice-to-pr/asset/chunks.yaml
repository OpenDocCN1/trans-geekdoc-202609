    Google Colab 数据文件夹（由橙色文件夹图标指示），如下图所示：


    ![](img/image_rsrc509.jpg)


    执行上述操作后，会弹出一个警告通知。下面的对话框会提示你保持数据集的副本，因为 Google Colab 经常会删除数据集。


