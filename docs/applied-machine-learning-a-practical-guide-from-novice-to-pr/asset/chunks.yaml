    df.isna().sum() is a chain of methods that calculates the total number of missing
    values (i.e., NaN values) in each column of the DataFrame df as seen in Figure
    4-3 .


    ![](OEBPS/image_rsrc56Z.jpg)


    Figure 4-3.


    Based on the problem statement, the target columns we will be working with are
    Annual\_Income and Spending\_Score respectively which can be accessed with index
    position of iloc at position 5 and 6 as seen in Figure 4-4 .


    ![](OEBPS/image_rsrc570.jpg)


    Figure 4-4.


    # Code Explanation


    ![](OEBPS/image_rsrc571.jpg)


    df.iloc\[:, \[5, 6\]\]: This selects specific columns from the DataFrame df.


    : selects all rows.


    \[5, 6\] selects columns at index positions 5 and 6.


    This operation retrieves data from columns 5 and 6 of the DataFrame.


    .values: This attribute returns the values of the selected data as a NumPy array.


    It converts the DataFrame slice into a two-dimensional NumPy array.


    X\[:10\]: This slices the NumPy array X to display the first 10 rows.


    It provides a preview of the selected data for the first 10 rows.


    # Get the number of clusters using the Elbow method.


    The get the number of clusters we will use the elbow method as seen in Figure
    4-5 .


    ![](OEBPS/image_rsrc572.jpg)


    Figure 4-5.


    # Code Explanation


    The code snippet performs KMeans clustering with varying numbers of clusters and
    uses the Elbow Method to determine the optimal number of clusters. It calculates
    and plots the Within-Cluster Sum of Squares (WCSS) values against the number of
    clusters, helping to identify the "elbow" point where the optimal number of clusters
    lies.


    wcss = \[\]: Initializes an empty list to store the Within-Cluster Sum of Squares
    (WCSS) values.


    WCSS is a measure of the compactness of the clusters formed by KMeans clustering.
    Lower WCSS values indicate tighter clusters.


    for i in range(1, 11): Loops through a range of numbers from 1 to 10, representing
    the candidate number of clusters to be evaluated.


    kmeans = KMeans(n\_clusters=i, init=''k-means++'', random\_state=42): Creates
    a KMeans clustering object with i clusters.


    n\_clusters=i: Specifies the number of clusters for the current iteration.


    init=''k-means++'': Uses the k-means++ initialization method to select initial
    cluster centroids, which can improve convergence.'
