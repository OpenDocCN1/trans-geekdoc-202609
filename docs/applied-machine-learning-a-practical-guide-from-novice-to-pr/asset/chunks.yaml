    \ model that can interpret heart test results based on patient input. This model\
    \ analyzes specific cardiac features, such as\n\nage: The age of the patient in\
    \ years.\n\nsex: The sex of the patient (1 = male; 0 = female).\n\ncp: Chest pain\
    \ type (0 = typical angina, 1 = atypical angina, 2 = non-anginal pain, 3 = asymptomatic).\n\
    \ntrestbps: Resting blood pressure (in mm Hg) on admission to the hospital.\n\n\
    chol: Serum cholesterol in mg/dl.\n\nfbs: Fasting blood sugar > 120 mg/dl (1 =\
    \ true; 0 = false).\n\nrestecg: Resting electrocardiographic results (0 = normal,\
    \ 1 = having ST-T wave abnormality, 2 = showing probable or definite left ventricular\
    \ hypertrophy by Estes' criteria).\n\nthalach: Maximum heart rate achieved.\n\n\
    exang: Exercise-induced angina (1 = yes; 0 = no).\n\noldpeak: ST depression induced\
    \ by exercise relative to rest.\n\nslope: The slope of the peak exercise ST segment\
    \ (0 = upsloping, 1 = flat, 2 = downsloping).\n"
