    \n- **F1 分数 (96.80%)**：将精确率和召回率结合为一个指标，提供了平衡的性能评估。96.80% 的 F1 分数表明模型在平衡精确率和召回率方面表现出色，能够有效分类实例。\n\
    \n# 模型评估\n\n训练机器学习模型后，评估其性能至关重要，通过检查准确率得分来进行评估。准确率得分展示了模型在训练数据上的拟合程度，如图 3-50 所示。\n\
