  trans: "\n我们选择使用 Pythonanywhere（[Pythonanywhere](https://www.google.com/url?q=https://www.pythonanywhere.com/&sa=D&source=editors&ust=1720099682040546&usg=AOvVaw1SAR9Jd7pT-ohjVTBx6gpe)）作为本应用的托管平台，因为其稳健性和灵活性，使其非常适合我们的测试部署。Aiven\
    \ 提供可靠的应用部署环境，并支持 Python 以及必要库的安装。然而，您可以自由选择任何支持 Python 并能够安装所需库或提供管理依赖关系的环境的部署平台。这种灵活性使您能够根据项目需求和运营偏好选择最合适的平台。\n\
    \n## Step 1: Access PythonAnywhere\n\n在浏览器中访问 [Pythonanywhere](https://www.google.com/url?q=https://www.pythonanywhere.com/&sa=D&source=editors&ust=1720099682041114&usg=AOvVaw0StOAWzfUfgmSVhQZUG3eO)\
    \ 以访问该平台。图 5-7 展示了 PythonAnywhere 的登陆页面。点击 **plans & pricing** 并点击“Create a Beginner\
    \ account”按钮，如图 5-8 所示。  \n\n![](img/image_rsrc57Y.jpg)Figure 5-7.\n\n## Step\
    \ 2: Start the onboarding process\n\n点击图 5-8 中所示的按钮，启动入职流程。完成入职后，继续登录。  \n\n![](img/image_rsrc57Z.jpg)Figure\
    \ 5-8.\n\n## Step 3: Login form\n\n图 5-9 展示了登录表单，您需要在此输入登录信息以进入仪表盘。  \n\n![](img/image_rsrc580.jpg)Figure\
    \ 5-9.\n\n## Step 4: Navigate to Files\n\n从仪表盘点击 **Files** 链接，如图 5-10 所示。  \n\n\
    ![](img/image_rsrc581.jpg)Figure 5-10.\n\n## Step 5: Create a directory\n\n为您的应用文件命名目录，点击\
    \ **New directory** 按钮创建它，如图 5-11 所示。  \n\n![](img/image_rsrc582.jpg)Figure 5-11.\n\
    \n## Step 6: Upload files\n\n进入您创建的 **mysite** 目录。点击 **Upload a file** 按钮，选择 `app.py`\
    \ 并提交。重复此过程上传 `model.pkl`。上传的文件将如图 5-12 所示。  \n\n![](img/image_rsrc583.jpg)Figure\
    \ 5-12.\n\n## Step 7: Access Web setup\n\n点击 **Web** 链接，如图 5-13 所示。这将引导您进入 API\
    \ 或应用的设置区域。  \n\n![](img/image_rsrc584.jpg)Figure 5-13.\n\n## Step 8: Add a new\
    \ web app\n\n点击“Add a new web app”按钮，然后选择默认域名的单选按钮，如图 5-14 所示。请注意，显示的名称会根据您的个人入职信息而变化，可能与示例不同。\
    \  \n\n![](img/image_rsrc585.jpg)Figure 5-14.\n\n## Step 9: Choose a web framework\n\
    \n选择与开发 API 所用的 Python Web 框架相匹配的框架，例如 Flask，如图 5-15 所示。  \n\n![](img/image_rsrc586.jpg)Figure\
    \ 5-15.\n\n## Step 10: Choose Python version\n\n选择您的解决方案所基于的 Python 版本。例如，如果您的\
    \ API 使用 Python 3.9 开发，请选择该版本，如图 5-16 所示。  \n\n![](img/image_rsrc587.jpg)Figure\
    \ 5-16.\n\n## Step 11: Set the WSGI configuration file\n\n图 5-17 显示了应用启动时执行的应用文件路径。保持默认设置并点击\
    \ **Next**。我们稍后会将路径从 `flask_app.py` 更改为 `app.py`（实际的应用文件名）。目前，点击“Next”按钮进入图 5-18\
    \ 所示的界面。  \n\n![](img/image_rsrc588.jpg)Figure 5-17.\n\nWeb 仪表盘显示我们的应用设置成功，如图\
    \ 5-18 中的浅绿色指示信息所示。  \n\n![](img/image_rsrc589.jpg)Figure 5-18.\n\n## Step 12:\
    \ Edit WSGI configuration\n\n向下滚动至图 5-19 所示区域。点击“WSGI configuration file”链接以编辑文件，并将其更新为启动\
    \ API 时应指向的文件。当前指向 PythonAnywhere 主机默认创建的文件，如图 5-20 所示。将图中高亮项更改为图 5-21 中的内容。 \
    \ \n\n![](img/image_rsrc58A.jpg)Figure 5-19.  \n\n![](img/image_rsrc58B.jpg)Figure\
