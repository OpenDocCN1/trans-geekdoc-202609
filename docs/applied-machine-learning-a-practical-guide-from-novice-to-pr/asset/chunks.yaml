    我们需要将我们的数据集分割为训练集和测试集。我们将使用 80:20 的比例进行分割，其中 80% 的数据用于训练模型，剩余的 20% 用于在未见过的数据上进行测试。图
    3-25 说明了这一过程。


    ![](img/image_rsrc55H.jpg)


    图 3-25.


    # 标准化数据


    在机器学习中，特别是使用对输入数据尺度敏感的算法时，标准化数据很常见。标准化将数据转换为均值为 0 且标准差为 1 的形式。图 3-26 展示了如何实现它。


    ![](img/image_rsrc54N.jpg)


    图 3-26.


    # 代码解释


    图 3-5 中的代码片段使用 `StandardScaler` 类（来自 `scikit-learn` 库）来标准化特征，通过去除均值并将其缩放到单位方差。这一过程对于许多机器学习算法的最佳性能至关重要。以下是每行代码的解释：


    `sc = StandardScaler()`：这行代码创建了一个 `StandardScaler` 类的实例。`StandardScaler` 用于标准化数据集的特征。


    `X_train = sc.fit_transform(X_train)`：


    `fit_transform`：该方法首先计算 `X_train` 数据的均值和标准差（这是 `fit` 部分）。


    随后，它利用这些统计量对 `X_train` 进行标准化，即对每个特征减去均值并除以标准差（这是 `transform` 部分）。


    结果是 `X_train` 变成了标准化后的原始训练数据，每个特征的均值为 0，标准差为 1。


    `X_test = sc.transform(X_test)`：


    `transform`：该方法使用从 `X_train` 数据中计算出的均值和标准差来标准化 `X_test`。


    这确保了测试数据以与训练数据相同的方式被转换，这对于模型性能的一致性至关重要。


    `X_test` 现在是标准化后的原始测试数据，与 `X_train` 具有相同的尺度。


    下面是关于为什么标准化很重要的更多细节：


    一致性：它确保训练数据和测试数据处于相同的尺度，这对于许多机器学习模型的性能至关重要。


    算法性能：像逻辑回归或神经网络中使用的梯度下降算法，在标准化数据上会更快收敛。


    改进准确率：一些算法，如支持向量机（SVM）和 k 最近邻（KNN），对数据尺度敏感，使用标准化数据时表现更好。


    通过使用 `StandardScaler`，我们有助于确保机器学习模型更有效、更一致地工作。


    # 训练模型


    图 3-27 展示了使用 `X_train` 和 `y_train` 数据集训练机器学习模型的过程。训练过程的执行表明模型训练成功。


    ![](img/image_rsrc55J.jpg)


    图 3-27.


    # 代码解释


    代码片段 `cs = SVC(kernel=''linear'', random_state=0); cs.fit(X_train, y_train)` 用于创建和训练一个使用线性核的支持向量分类器（SVC），该模型来自
    `scikit-learn` 库。


    `cs = SVC(kernel=''linear'', random_state=0)`：


    SVC 是用于创建支持向量分类器的类。


    `cs` 是存储 SVC 实例的变量。


    `kernel=''linear''` 指定 SVC 使用线性核。这意味着类别之间的决策边界是线性的。


    `random_state=0` 是一个参数，确保可重复性。它设置随机数生成器的种子，因此多次运行结果一致。


    `cs.fit(X_train, y_train)`：


    `fit` 是用于训练模型的方法。


    `X_train` 是包含特征（输入变量）的训练数据，模型从中学习。


    `y_train` 是包含目标标签（输出变量）的训练数据，与 `X_train` 中的特征对应。


    # 使用测试数据进行预测


    图 3-28 展示了如何使用训练好的模型（`cs`）和测试数据（`X_test`）进行预测。


    ![](img/image_rsrc54R.jpg)


    图 3-28.


    # 代码解释


    `y_pred = cs.predict(X_test)` 这一行专门用支持向量模型（`cs`）对测试数据集（`X_test`）进行预测。以下是针对 SVM
    的详细解释：


    `cs`：这是一个已在训练数据上训练的 SVM 模型实例。在 `scikit-learn` 中，可以通过 `SVC()` 创建该模型，然后使用 `cs.fit(X_train,
    y_train)` 进行训练。


    `X_test`：这是包含特征的测试数据集，用于预测目标变量。这些特征应与训练数据（如标准化）进行相同的预处理。


    `predict(X_test)`：该方法用于根据 SVM 模型 `cs` 对 `X_test` 中的输入数据预测目标变量的类别标签。


    `y_pred` 是一个包含 `X_test` 中每个观测的预测类别标签的数组。对于二分类问题，`y_pred` 中的值将是 0 或 1。


    # 模型评估


    在训练机器学习模型后，评估其性能很重要。让我们先查看混淆矩阵，如图 3-29 所示。


    ![](img/image_rsrc55K.jpg)


    图 3-29.


    # 代码解释


    `cm = confusion_matrix(y_test, y_pred)` 这一行使用 `scikit-learn` 库中的 `confusion_matrix`
    函数来评估分类模型的性能。以下是详细解释：


    `confusion_matrix(y_test, y_pred)`：


    `y_test`：这是测试数据集的真实类别标签数组。这些是我们试图预测的实际值。


    `y_pred`：这是模型为测试数据集生成的预测类别标签数组。这些预测是基于 `X_test` 的特征，由模型生成。


    混淆矩阵：


    混淆矩阵是一个表格，用于描述分类模型的性能。它显示了模型在实际值（地面真实）与预测值之间的正确和错误预测数量。


    对于二分类问题，混淆矩阵是一个 2x2 矩阵，形式如下：


    [[TN, FP],


    [FN, TP]]


    其中：


    TN（True Negative）：正确预测负类的实例数量（实际为负，预测为负）。


    FP（False Positive）：错误预测正类的实例数量（实际为负，但预测为正）。


    FN（False Negative）：错误预测负类的实例数量（实际为正，但预测为负）。


    TP（True Positive）：正确预测正类的实例数量（实际为正，预测为正）。


    # 解读混淆矩阵


    混淆矩阵帮助你理解分类模型在正确预测每个类别方面的表现。


    它提供了关于模型错误类型的详细洞察：


    矩阵对角线上的高值（TN 和 TP）表示模型表现良好。


    矩阵对角线外的高值（FP 和 FN）表示模型存在错误。


    通过查看混淆矩阵，你可以获得比单一指标（如准确率）更深入的模型性能理解，这有助于识别模型需要改进的具体领域。


    # 混淆矩阵解读


    图 3-30 展示了逻辑回归模型的混淆矩阵。


    ![](img/image_rsrc55M.jpg)


    图 3-30.


    让我们解读这个混淆矩阵：


    真负数（TN）：74


    这些是实际为负类（例如，无心脏病）的实例，模型正确预测为负类。


    假阳性（FP）：24


