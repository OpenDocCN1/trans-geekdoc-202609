    function from the `scikit-learn` library to evaluate the performance of a classification
    model. Here’s a detailed explanation:


    confusion_matrix(y_test, y_pred):


    y_test: 这是测试数据集的真实类别标签数组。这些是您正在尝试预测的实际值。


    y_pred: 这是模型为测试数据集生成的预测类别标签数组。这些预测是由模型根据测试特征 (X_test) 生成的。


    混淆矩阵：


    混淆矩阵是一个表格，常用于描述分类模型的性能。它显示模型相比实际结果（地面真实）正确和错误地进行了多少预测。


    对于二分类问题，混淆矩阵是一个 2x2 矩阵，形式如下：


    [[TN, FP],


    [FN, TP]]


