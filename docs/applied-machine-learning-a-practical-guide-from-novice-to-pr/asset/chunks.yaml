    LabelEncoder `是 scikit-learn (sklearn.preprocessing) 中的一个类，用于将目标分类标签编码为数值。`


    le `是一个已初始化的 LabelEncoder 实例，用于执行标签编码。`


    y = le.fit_transform(y)


    le.fit_transform(y) : 该方法会先对目标变量 y 进行拟合，学习 y 中的唯一类别（例如 "yes" 和 "no"），然后将 y 转换为编码的数值标签。


    fit_transform 方法首先在目标变量 y 上拟合 LabelEncoder，学习 y 中的唯一类别，然后通过为 y 中的每个唯一类别分配数字标签（0、1
    等）来转换 y。例如，"yes" 可能被编码为 1，"no" 为 0。


    # 数据分割


    为了准备数据进行模型训练，我们将使用 80:20 的比例将其分为两部分。这一分配设计为 80% 的数据用于训练模型，剩余的 20% 用于评估模型的性能。为了直观展示这一划分，请参考图
    1-32 。


    ![](img/image_rsrc51T.jpg)


    Figure 1-32.


    # 特征标准化


    为了实现正则化并提升模型性能，必须对年龄和工资等特征进行标准化。特征标准化将数值数据的范围调整到一致的尺度，有助于提高预测模型的准确性和有效性。通过标准化特征，模型能够更准确地解读每个特征的相对重要性，并避免因不同尺度而产生的偏见。


    这种标准化在支持向量机 (SVM)、k-最近邻 (KNN) 和神经网络等算法中尤为重要，因为这些模型依赖于距离度量或梯度下降优化技术，而不同尺度的特征会对这些技术产生不利影响。标准化通过确保所有特征在学习过程中均匀贡献，从而缓解这些问题。


    例如，在预测客户购买行为时，准确标准化年龄和工资等特征能帮助模型更有效地识别数据中的细微模式和关系。这将使模型能够基于这些变量做出可靠预测，从而提升其整体预测能力和实际应用的价值。


    图 1-32 显示年龄和工资特征未处于相同的尺度。为纠正这一点，我们将使用 StandardScaler，如图 1-33 所示。


    ![](img/image_rsrc51U.jpg)


    Figure 1-33. 可以看到数值已被缩放。年龄 80 缩放后为 1.52077076986837，工资 16388 缩放后为 -1.1599989214968063。


