    \  \n\n# Import Libraries\n\nFigure 2-37  展示了所有导入的必需库。\n\n![](img/image_rsrc533.jpg)\n\
    \nFigure 2-37.\n\nImport and View Data\n\nFigure 2-38   展示了数据的导入和查看过程，如下所示。\n\n\
    ![](img/image_rsrc534.jpg)\n\nFigure 2-38.\n\n# Calculating the frequency of unique\
    \ values in a DataFrame column named 'region'.\n\n代码 df.region.value`_`counts()\
    \  计算 DataFrame df 中 'region' 列的每个唯一值的频率，并显示每个 region 出现的次数。'smokers' 列的处理方式相同，如\
    \ Figure 2-39 所示。\n\n![](img/image_rsrc535.jpg)\n\nFigure 2-39.\n\n# Check for\
    \ missing values\n\n代码 df.isna().sum() 是一系列方法的组合，用于计算 DataFrame df 中每列的缺失值（NaN）总数，如\
    \ Figure 2-40 所示。\n\n![](img/image_rsrc536.jpg)\n\nFigure 2-40.\n\n# Assign values\
    \ to X and y\n\nX = df.iloc`[:, :-1]`.values:\n\n此行选择 df 中的所有行和除最后一列外的所有列，并将结果转换为\
    \ NumPy 数组。 resulting array X 通常包含特征或预测器，如 Figure 2-41 所示。\n\ny = df.iloc`[:,\
    \ -1]`.values:\n\n此行选择 df 中的所有行和仅最后一列，并将结果转换为 NumPy 数组。 resulting array y 通常包含目标或响应变量，如\
    \ Figure 2-41 所示。\n\n![](img/image_rsrc529.jpg)\n\nFigure 2-41\n\n# View data\
    \ in X\n\n在新的代码单元中输入 X 并运行代码，可以查看 X 中赋值的数据，如 Figure 2-42 所示。y 也可以同理处理。\n\n![](img/image_rsrc52T.jpg)\n\
    \nFigure 2-42 . 我已标记列及其对应的索引位置：第一列 Age 在索引位置 0；第二列 Sex 在索引位置 1；第三列 BMI 在索引位置 2；第四列\
    \ Number of Children 在索引位置 3；第五列 Smoker 在索引位置 4；第六列 Region 在索引位置 5。\n\n# Addressing\
    \ missing values (NaN)\n"
