    # 代码解释


    `SimpleImputer(missing_values=np.nan, strategy=''mean'')`


    `missing_values=np.nan`: 此参数指定要填补的缺失值用 `np.nan` 表示。


    `strategy=''mean''`: 此参数指定缺失值应被用列的均值替换。


    `imp.fit(X[:, [0, 2, 3]])`


    `X[:, [0, 2, 3]]`: 此操作选择数组 `X` 中的所有行和索引位置为 0、2、3 的列。这些列被假设为数值型。


    `.fit(...)`: 该方法基于非缺失值计算所选列的平均值，并将这些平均值存储以供后续使用。


    `np.set_printoptions(precision=2)`


    此函数用于配置 NumPy 数组的显示方式。这里将打印输出的精度设置为 2 位小数。


    `X[:, [0, 2, 3]] = imp.transform(X[:, [0, 2, 3]])`


    `X[:, [0, 2, 3]]`: 再次选择数组 `X` 中的所有行和索引位置为 0、2、3 的列。


    `imp.transform(...)`: 该方法在 `.fit(...)` 步骤中计算出的平均值替换选定列中的缺失值。


    `X[:, [0, 2, 3]] = ...`: 此赋值将变换后的数据（缺失值已被替换）更新到原始数组 `X` 的选定列中。


    # ColumnTransformer 和 OneHotEncoder()


    机器学习模型本质上不理解文本或类别特征，因此需要将这些特征转换为数值形式以便模型处理。这就是为什么我们需要将图 2-57 中索引位置 1（Sex）、4（Smoker）和
    5（Region）的类别变量进行转换。为此，我们将使用 `ColumnTransformer` 和 `OneHotEncoder`，如图 2-60 所示。


    ![](img/image_rsrc53X.jpg)


    Figure 2-60.


    # 代码解释。


    `ColumnTransformer`: 来自 `sklearn.compose` 模块的类，用于对数据集的不同列应用不同的预处理转换。


    `OneHotEncoder`: 来自 `sklearn.preprocessing` 模块的类，用于将类别特征转换为机器学习算法可以用于预测的数值格式。


    `np`: 这是 NumPy 库的常用别名，用于进行数组操作。


    ## 创建 ColumnTransformer 实例


    ![](img/image_rsrc52X.jpg)


    `ColumnTransformer(...)`:


    初始化一个 `ColumnTransformer` 对象，用于对指定列应用特定的转换。


    `transformers=[(''encoder'', OneHotEncoder(), [1, 4, 5])]`:


    `''encoder''`: 为该转换器分配的名称，可以是任意字符串。


    `OneHotEncoder()`: 指定使用 `OneHotEncoder` 进行转换。


    `[1, 4, 5]`: 指定要转换的列的索引位置列表。这里，索引为 1、4、5 的列将被一热编码。


    `remainder=''passthrough''`:


    此参数指定未明确转换的列应如何处理。`''passthrough''` 表示这些列保持不变并随输出一起包含。


    # 将数据划分为训练集和测试集


    我们需要将数据集划分为训练集和测试集。我们将使用 80:20 的比例，即 80% 的数据用于训练模型，剩余 20% 用于在未见数据上进行测试。图 2-61
    说明了这一过程。


    ![](img/image_rsrc53Y.jpg)


    Figure 2-61.


    ## 代码解释


    `train_test_split`: 来自 `sklearn.model_selection` 模块的函数，用于将数据集划分为训练集和测试集。`X_train`
    和 `y_train` 用于训练模型，`X_test` 和 `y_test` 用于在未见数据上评估模型的性能。


    ### 函数调用的组成部分：


    `X`: 特征矩阵（输入变量），包含自变量或预测器。


    `y`: 目标向量（输出变量），包含因变量或响应变量。


    `test_size=0.2`: 指定划分到测试集的数据比例。这里 0.2 表示 20% 的数据用于测试，剩余 80% 用于训练。


    `random_state=0`: 控制在划分前对数据进行打乱的参数。传入整数可确保结果可重现，即每次运行代码时使用相同的 `random_state` 值，数据划分结果一致。


    ### 函数调用的输出：


    `X_train`: 训练子集的特征矩阵，包含 `X` 中 80% 的行。


    `X_test`: 测试子集的特征矩阵，包含 `X` 中剩余的 20% 的行。


    `y_train`: 训练子集的目标向量，包含与 `X_train` 中行对应的 `y` 的 80% 数据。


    `y_test`: 测试子集的目标向量，包含与 `X_test` 中行对应的 `y` 的 20% 数据。


    通过使用 `test_size` 为 0.2，我们确保 20% 的数据被保留用于测试，这有助于评估模型在新数据上的泛化能力。`random_state` 确保数据划分可重复，从而在多次运行时结果保持一致。


    # 训练模型


    图 2-62 说明了如何使用 `X_train` 和 `y_train` 数据集训练机器学习模型。执行结果表明模型已成功训练。


    ![](img/image_rsrc53Z.jpg)


    Figure 2-62.


    ## 代码解释


    `DecisionTreeRegressor(random_state=0)`: 创建 `DecisionTreeRegressor` 类的实例。


    `random_state=0`: 设置随机种子以确保可重现性。固定随机状态可保证每次运行代码时结果一致，这对于测试和调试很有用。


    `dt.fit(X_train, y_train)`: 将决策树回归模型拟合到训练数据上。


    `X_train`: 代表训练数据的特征（输入变量）。


    `y_train`: 代表训练数据的目标（输出变量或标签）。


    # 使用测试数据进行预测


    图 2-63 说明了如何使用训练好的模型（`dt`）和测试数据（`X_test`）进行预测。


    ![](img/image_rsrc541.jpg)


    Figure 2-63.


    ## 代码解释


    `dt.predict(X_test)`: 使用训练好的决策树回归模型（`dt`）对测试数据（`X_test`）进行预测。


    `X_test`: 代表测试数据的特征（输入变量），用于生成预测。


    预测得到的目标值存储在变量 `y_pred` 中。


    # 模型评估


    在训练机器学习模型后，有必要通过检查 R² 分数来评估其性能。R² 分数表示模型在训练数据上的拟合程度，如图 2-64 所示。


    ![](img/image_rsrc542.jpg)


    Figure 2-64.


    ## 代码解释


    `r2_score` 是 `sklearn.metrics` 模块中的函数，用于通过计算 R 平方（R²）指标来评估回归模型的性能。


    `y_test`: 代表测试数据集的实际目标值。这些是模型试图预测的真实值。


    `y_pred`: 代表模型在测试数据集上生成的预测目标值。


    # 模型结果解释


    R² 值为 0.7142644756791616，表明回归模型捕获了目标变量的大部分变异。这意味着约 71.43% 的目标变量的变异可以通过模型中使用的输入特征来解释。


    尽管模型表现相当不错，但仍有改进空间。进一步的分析和优化可能有助于增强其预测能力，捕获目标变量的更多变异。


    # 让我们进行预测

