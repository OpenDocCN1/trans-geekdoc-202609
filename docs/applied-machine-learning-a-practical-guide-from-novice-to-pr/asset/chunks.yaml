    # ColumnTransformer 和 OneHotEncoder()


    机器学习模型不理解文本，因此需要将文本特征转换为数值形式，以便模型能够理解并进行预测。这就是我们需要对索引位置 1（性别）、4（吸烟状态）和 5（地区）的分类变量进行处理的原因，如
    Figure 2-71 所示。为此，我们将使用 ColumnTransformer 和 OneHotEncoder，如 Figure 2-74 所示。


