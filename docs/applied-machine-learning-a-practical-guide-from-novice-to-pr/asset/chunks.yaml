    y_test：测试数据集的真实类别标签数组。这些是我们想要预测的实际值。


    y_pred：模型为测试数据集生成的预测类别标签数组。预测是基于测试特征（X_test）得到的。


    混淆矩阵：


    混淆矩阵是一张表格，用于描述分类模型的表现，展示模型在实际结果（地面真实）与预测结果之间的匹配情况。


    二分类问题的混淆矩阵为 2×2 矩阵，形式如下：


    [["TN", "FP"],


    ["FN", "TP"]]


    其中：


    TN（True Negative）：模型正确预测负类（实际为负且预测为负）的实例数量。


    FP（False Positive）：模型错误预测正类（实际为负但预测为正）的实例数量。


    FN（False Negative）：模型错误预测负类（实际为正但预测为负）的实例数量。


    TP（True Positive）：模型正确预测正类（实际为正且预测为正）的实例数量。


    # 对混淆矩阵的解读


    混淆矩阵帮助你了解模型在正确预测每个类别方面的表现。


    它提供了模型错误类型的详细洞察：


    矩阵对角线（TN 和 TP）数值越高，表示模型在各自类别上的预测越准确。


    矩阵非对角线（FP 和 FN）数值越高，表示模型在特定错误上的表现越差。


    通过查看混淆矩阵，你可以获得比单一指标（如准确率）更深入的模型性能理解，从而识别模型需要改进的具体方面。


