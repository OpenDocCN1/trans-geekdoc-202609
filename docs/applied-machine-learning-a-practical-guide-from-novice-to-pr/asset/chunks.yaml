    \ that first fits the scaler to the data (calculates the mean and standard deviation\
    \ for each feature in X_train) and then transforms the data based on these statistics.\n\
    \nAfter this transformation, each feature in X_train will have a mean of zero\
    \ and a standard deviation of one.\n\n![](OEBPS/image_rsrc53B.jpg)\n\nSimilarly,\
    \ fit_transform is applied to the target variable y_train.\n\nThis is less common\
    \ in some machine learning contexts but can be important for algorithms like SVR,\
    \ which can benefit from having the target variable on a similar scale to the\
    \ input features.\n\n# Training the Model\n\nFigure 2-48 illustrates the process\
    \ of using the X_train and y_train datasets to train the machine learning model.\
    \ The execution of the training process indicates that the model was successfully\
    \ trained.\n\n![](OEBPS/image_rsrc53C.jpg)\n\nFigure 2-48.\n\n# Code Explanation\n\
