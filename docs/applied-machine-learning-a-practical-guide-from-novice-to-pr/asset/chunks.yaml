    \npredict(X_test): 该方法用于根据逻辑回归模型 cs 对输入数据（X_test）进行类别标签的预测。\n\ny_pred 是 X_test\
    \ 中每条记录的预测类别标签数组。二分类问题中，y_pred 的值要么是 0，要么是 1。\n\n# 模型评估\n\n在训练机器学习模型后，评估其性能非常重要。让我们先查看混淆矩阵（如图\
    \ 3-8 所示），再考虑准确率。\n\n![](img/image_rsrc54R.jpg)\n\nFigure 3-8.\n\n# 代码解释\n\n`cm\
    \ = confusion_matrix(y_test, y_pred)` 这行代码使用 scikit-learn 库中的 `confusion_matrix`\
    \ 函数来评估分类模型的性能。具体解释如下：\n\nconfusion_matrix(y_test, y_pred):\n\n- y_test：测试数据集的真实类别标签数组，即实际需要预测的值。\n\
    \n- y_pred：模型为测试数据集生成的预测类别标签数组，基于测试特征（X_test）。\n\n混淆矩阵：\n\n混淆矩阵是一个表格，用于描述分类模型的表现，展示模型相对于真实结果（地面真实）所作的正确和错误预测数量。\n\
    \n二分类问题中，混淆矩阵为 2×2 矩阵，形式如下：\n\n```python\n[[TN, FP],\n [FN, TP]]\n```\n\n其中：\n\
    \n- TN（True Negative）：模型正确预测的负类实例数量（实际为负且预测为负）。\n\n- FP（False Positive）：模型错误预测的阳性实例数量（实际为负但预测为正）。\n\
    \n- FN（False Negative）：模型错误预测的负类实例数量（实际为正但预测为负）。\n\n- TP（True Positive）：模型正确预测的阳性实例数量（实际为正且预测为正）。\n\
    \n# 混淆矩阵解读\n\n图 3-9 展示了物流回归模型的混淆矩阵。\n\n![](img/image_rsrc54S.jpg)\n\nFigure 3-9.\n\
    \n下面对该混淆矩阵进行解读：\n\n- True Negatives (TN)：77\n\n  这些是实际为负类（例如，无心脏病）且模型正确预测为负的实例。\n\
    \n- False Positives (FP)：21\n\n  这些是实际为负类，但模型错误地预测为正类的实例（例如，预测患有心脏病但实际上没有）。\n\n\
    - False Negatives (FN)：7\n\n  这些是实际为正类（例如，有心脏病）但模型错误地预测为负类的实例（例如，预测无心脏病但实际上有）。\n\
    \n- True Positives (TP)：100\n\n  这些是实际为正类，且模型正确预测为正的实例。\n\n基于此混淆矩阵，可以计算多个性能指标（准确率、精确率、召回率和\
    \ F1 分数）：\n\nAccuracy：\n\n准确率的公式如下：\n\n![](img/image_rsrc54T.jpg)   \n\n在提供的示例中：\n\
    \nTN = 77\n\nTP = 100\n\nFP = 21\n\nFN = 7\n\n将这些值代入公式：\n\n![](img/image_rsrc54U.jpg)\n\
    \n这意味着模型大约正确分类了 86.3% 的实例。\n\nPrecision：\n\n精确率的公式如下：\n\n![](img/image_rsrc54V.jpg)\n\
    \n在提供的示例中：\n\nTP = 100\n\nFP = 21\n\n将这些值代入公式：\n\n![](img/image_rsrc54W.jpg)\n\
    \n这意味着大约 82.6% 的模型预测为正的实例实际上是正的。\n\nRecall：\n\n召回率的公式如下：\n\n![](img/image_rsrc54X.jpg)\n\
    \n在提供的示例中：\n\nTP = 100\n\nFN = 7\n\n将这些值代入公式：\n\n![](img/image_rsrc54Y.jpg)\n\n\
    这意味着大约 93.5% 的实际正类实例被模型正确识别。\n\nF1 Score：\n\nF1 分数的公式如下：\n\n![](img/image_rsrc54Z.jpg)\n\
    \n在提供的示例中：\n\nPrecision = 0.826\n\nRecall = 0.935\n\n将这些值代入公式：\n\n![](img/image_rsrc550.jpg)\n\
    \n# 解读\n\nAccuracy (86.3%)：表示模型正确预测了 86.3% 的实例。\n\nPrecision (82.6%)：在模型预测为正的所有实例中，82.6%\
    \ 实际上是正的，表明存在一定的假阳性。\n\nRecall (93.5%)：模型正确识别了 93.5% 的实际正类实例，表明假阴性较少。\n\nF1 Score\
    \ (87.8%)：结合精确率和召回率的一个综合指标，表明模型在平衡两者方面表现良好。\n\n# 模型评估\n\n在训练机器学习模型后，评估其性能时，需要检查准确率得分。如图\
    \ 3-10 所示，准确率反映了模型在训练数据上的拟合情况。\n\n![](img/image_rsrc551.jpg)\n\nFigure 3-10.\n\
    \n# 代码解释\n\n`accuracy_score(y_test, y_pred)` 是 scikit-learn 库中的函数，用于计算分类模型的准确率。具体解释如下：\n\
    \n输入：\n\n- y_test：测试数据集的真实标签数组，即实际需要预测的值。\n\n- y_pred：模型为测试数据集生成的预测标签数组，基于测试特征（X_test）。\n\
    \n# 模型结果解读\n\n准确率为 0.8634146341463415，表示模型正确预测了 86.34% 的实例。换句话说，每 100 次预测中，模型大约准确预测了\
    \ 86 次，体现了整体良好的性能。\n\n# 让我们进行预测\n\n图 3-11 展示了使用已训练的机器学习模型进行预测的过程。它要求我们提供以下特征：\n\
    \n- age：患者的年龄（以年为单位）。\n\n- sex：患者的性别（1 = 男性；0 = 女性）。\n\n- cp：胸痛类型（0 = 典型心绞痛，1\
    \ = 不典型心绞痛，2 = 非心绞痛，3 = 无症状）。\n\n- trestbps：入院时的静息血压（单位：mm Hg）。\n\n- chol：血浆胆固醇（单位：mg/dl）。\n\
    \n- fbs：空腹血糖 > 120 mg/dl（1 = 是；0 = 否）。\n\n- restecg：静息心电图结果（0 = 正常，1 = 有 ST-T\
    \ 波异常，2 = 根据 Estes 标准显示可能或肯定的左心室肥厚）。\n\n- thalach：达到的最大心率。\n\n- exang：运动诱发心绞痛（1\
    \ = 有；0 = 无）。\n\n- oldpeak：运动时相对于休息的 ST 段下降。\n\n- slope：运动时 ST 段的斜率（0 = 上升，1 =\
    \ 平直，2 = 下降）。\n\n- ca：由血管造影显示染色的主要血管数量（0-3）。\n\n- thal：地塞米亚（1 = 正常；2 = 固定缺陷；3\
    \ = 可逆缺陷）。\n"
