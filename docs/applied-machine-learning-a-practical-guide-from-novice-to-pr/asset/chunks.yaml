    导航到屏幕左上角的“文件”选项卡。


    点击“文件”以打开下拉菜单。


    从菜单中选择“新建笔记本”。


    这将打开一个新笔记本，供你开始项目或做笔记，如下图所示：


    ![](img/image_rsrc507.jpg)


    如上图所示，你点击文件，然后选择新笔记本。


    要将笔记本的标题从“Untitled”更改为“Getting Pumped”，请执行以下操作：


    点击笔记本界面顶部当前标题“Untitled”。


    会出现一个文本框，用于编辑标题。


    在文本框中输入“Getting Pumped”。


    按回车键或点击文本框外部以保存新名称。


