    \ number of children（子女数量），这些特征与训练时使用的相同。将这些特征作为输入传递给 predict 方法，模型会根据这些特征返回预测的目标变量值。\n\
    \n![](img/image_rsrc54G.jpg)\n\nFigure 2-79.\n\n# 结论\n\n我们将保险数据用于训练和评估多个机器学习模型，包括多项式回归、线性回归、支持向量回归、决策树回归和随机森林回归。以下是这些模型的性能结果：\n\
    \n| # | Model Name | Model R² Score (%) |\n|---|------------|-------------------|\n\
    | 1 | Polynomial regression | 85.12% |\n| 2 | Multiple linear regression | 80%\
