    # Convert the Unsupervised Learning Model in chapter 4 to API


    We will be converting the machine learning model in [Chapter 4](#part0001_split_001.xhtml#a4FZ)
    to an API by following the steps below:


    Convert the machine learning model to API


    Figure 5-4 shows the code on how to export our machine learning model, which in
