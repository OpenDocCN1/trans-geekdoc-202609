    ColumnTransformer：来自 sklearn.compose 模块的类，用于对数据集的不同列应用不同的预处理转换。


    OneHotEncoder：来自 sklearn.preprocessing 模块的类，用于将分类特征转换为可以供机器学习算法使用的格式，以提高预测性能。


    np：通常用于表示 NumPy 库的别名，用于数组操作。


