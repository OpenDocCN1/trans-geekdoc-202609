    3-14 所示。


    y = df.iloc[:, -1].values：


    此行选择 DataFrame df 的所有行和仅最后一列，并将结果转换为 NumPy 数组。生成的数组 y 通常包含目标变量或响应变量，如 Figure 3-14
    所示。


