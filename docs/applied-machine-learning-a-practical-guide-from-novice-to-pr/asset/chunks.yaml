    X_test：这是包含待预测目标变量特征的测试数据集。这些特征应与训练数据进行相同的预处理（例如标准化）。


    predict(X_test)：该方法用于根据 Naive Bayes 模型 cs 对输入数据（X_test）进行类别标签的预测。


    y_pred 是一个包含 X_test 中每条记录预测类别标签的数组。对于二分类问题，y_pred 中的值只能是 0 或 1。


