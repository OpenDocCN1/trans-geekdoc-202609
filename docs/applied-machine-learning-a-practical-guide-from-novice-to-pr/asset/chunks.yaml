- raw: "![](OEBPS/image_rsrc552.jpg)\n\nFigure 3-11.\n\n# K-Nearest Neighbour (K-NN)\n\
    \nK-Nearest Neighbors (K-NN) is a supervised machine learning algorithm that is\
    \ used for both classification and regression tasks. In classification, it identifies\
    \ the class of a given data point by examining the classes of its nearest neighbors.\
    \ In regression, it predicts the value of a data point by averaging the values\
    \ of its nearest neighbors.\n\nThe source code is available here: [KNN](https://www.google.com/url?q=https://github.com/anyasorc/appliedml/blob/main/Classification_KNN.ipynb&sa=D&source=editors&ust=1720099681856543&usg=AOvVaw08NazI4n392YBuznNNYIms)\
    \  \n\n# Import Libraries\n\nFigure 3-12  shows all the imported required libraries\n\
    \n![](OEBPS/image_rsrc553.jpg)\n\nFigure 3-12.\n\n# Import and View Data\n\nFigure\
    \ 3-13  shows how data was imported and viewed as seen below\n\n![](OEBPS/image_rsrc554.jpg)\n\
    \nFigure 3-13.\n\n# Assign values to X and y\n\nX = df.iloc\\[:, :-1\\].values:\n\
    \nThis line selects all rows and all columns except the last one from the DataFrame\
    \ df and converts the result into a NumPy array. The resulting array X typically\
    \ contains the features or predictors as seen in Figure 3-14 .\n\ny = df.iloc\\\
    [:, -1\\].values:\n\nThis line selects all rows and only the last column from\
    \ the DataFrame df and converts the result into a NumPy array. The resulting array\
    \ y typically contains the target or response variable as seen in Figure 3-14\
    \ .\n\n![](OEBPS/image_rsrc54K.jpg)\n\nFigure 3-14.\n\n# Splitting into train\
    \ and test set\n\nWe need to split our dataset into training and testing sets.\
    \ We will use an 80:20 split, where 80% of the data will be used to train the\
    \ model, and the remaining 20% will be used to test it on unseen data. Figure\
    \ 3-15  illustrates this process.\n\n![](OEBPS/image_rsrc555.jpg)\n\nFigure 3-15.\n\
    \n# Standardizing the data\n\nIn the context of machine learning, particularly\
    \ when using algorithms that are sensitive to the scale of the input data, it\
    \ is common to standardize the data. Standardization transforms the data such\
    \ that it has a mean of zero and a standard deviation of one.  Figure 3-16 illustrates\
    \ how to implement it.\n\n![](OEBPS/image_rsrc54N.jpg)\n\nFigure 3-16.\n\n# Code\
    \ Explanation\n\nThe code snippet in Figure 3-16  uses the \\`StandardScaler\\\
    ` class from the \\`scikit-learn\\` library to standardize features by removing\
    \ the mean and scaling to unit variance. This process is essential for many machine\
    \ learning algorithms to perform optimally. Here's an explanation of each line:\n\
    \nsc = StandardScaler(): This line creates an instance of the \\`StandardScaler\\\
    ` class. The \\`StandardScaler\\` is used to standardize the features of the dataset.\n\
    \nX\\_train = sc.fit\\_transform(X\\_train):\n\nfit\\_transform: This method first\
    \ calculates the mean and standard deviation of the \\`X\\_train\\` data (this\
    \ is the \\`fit\\` part).\n\nIt then uses these statistics to standardize \\`X\\\
    _train\\` by subtracting the mean and dividing by the standard deviation for each\
    \ feature (this is the \\`transform\\` part).\n\nThe result is that \\`X\\_train\\\
    ` is now a standardized version of the original training data, where each feature\
    \ has a mean of 0 and a standard deviation of 1.\n\nX\\_test = sc.transform(X\\\
    _test):\n\ntransform: This method uses the mean and standard deviation calculated\
    \ from the \\`X\\_train\\` data to standardize \\`X\\_test\\`.\n\nThis ensures\
    \ that the test data is transformed in the same way as the training data, which\
    \ is crucial for the consistency of the model's performance.\n\nX\\_test\\` is\
    \ now a standardized version of the original test data, following the same scale\
    \ as \\`X\\_train\\`.\n\nHere's a bit more detail on why standardization is important:\n\
    \nConsistency: It ensures that the training and test data are on the same scale,\
    \ which is crucial for the performance of many machine learning models.\n\nAlgorithm\
    \ Performance: Algorithms like gradient descent used in logistic regression or\
    \ neural networks converge faster with standardized data.\n\nImproved Accuracy:\
    \ Some algorithms, like support vector machines (SVM) and k-nearest neighbors\
    \ (KNN), are sensitive to the scale of the data and perform better with standardized\
    \ data.\n\nBy using \\`StandardScaler\\`, you help ensure that your machine learning\
    \ model works more effectively and consistently.\n\n# Training the Model\n\nFigure\
    \ 3-17  illustrates the process of using the X\\_train and y\\_train datasets\
    \ to train the machine learning model. The execution of the training process indicates\
    \ that the model was successfully trained.\n\n![](OEBPS/image_rsrc556.jpg)\n\n\
    Figure 3-17.\n\n# Code Explanation\n\nReferring to the code snippet in Figure\
    \ 3-17,\n\ncs = KNeighborsClassifier(n\\_neighbors=5, metric='minkowski', p=2);\
    \ cs.fit(X\\_train, y\\_train)\\` is used to create and train a k-nearest neighbors\
    \ (K-NN) classifier with the scikit-learn library in Python.\n\ncs = KNeighborsClassifier(n\\\
    _neighbors=5, metric='minkowski', p=2):\n\nKNeighborsClassifier is the class for\
    \ creating a k-nearest neighbors classifier.\n\ncs is the variable that will store\
    \ the instance of the K-NN classifier.\n\nn\\_neighbors=5 specifies the number\
    \ of neighbors to use. In this case, the algorithm will consider the 5 nearest\
    \ neighbors to make a prediction.\n\nmetric='minkowski' specifies the distance\
    \ metric to use for finding the nearest neighbors. The Minkowski distance is a\
    \ generalized distance metric that includes several other distance metrics as\
    \ special cases.\n\np=2 sets the parameter for the Minkowski metric. When p=2,\
    \ the Minkowski distance is equivalent to the Euclidean distance.\n\ncs.fit(X\\\
    _train, y\\_train):\n\nfit is a method used to train the model.\n\nX\\_train is\
    \ the training data containing the features (input variables) that the model will\
    \ learn from.\n\ny\\_train is the training data containing the target labels (output\
    \ variables) that correspond to the features in X\\_train\n\n# Predicting with\
    \ the test data\n\nFigure 3-18  below illustrates how we made predictions using\
    \ the trained model (cs) and the test data (X\\_test).\n\n![](OEBPS/image_rsrc557.jpg)\n\
    \nFigure 3-18.\n\n# Code Explanation\n\nThe line y\\_pred = cs.predict(X\\_test)\
    \ where cs is a k-nearest neighbors (K-NN) classifier:\n\ncs is an instance of\
    \ the KNeighborsClassifier that has been trained on a dataset using the fit method.\
    \ This instance now contains the training data and is ready to make predictions.\n\
    \nX\\_test is the test dataset consisting of feature values (input variables)\
    \ for which you want to predict the class labels. These are new data points that\
    \ the model has not seen during training.\n\nThe predict method is used to make\
    \ predictions on new data. When you call cs.predict(X\\_test), the classifier\
    \ uses the K-NN algorithm to determine the class labels for the instances in X\\\
    _test.  \n\nThe predicted class labels for all instances in X\\_test are stored\
    \ in the array y\\_pred.\n\n# Model Evaluation\n\nAfter training the machine learning\
    \ model, it is important to evaluate its performance. Let's first examine the\
    \ confusion matrix before considering the accuracy score as seen in Figure 3-19\
    \ .\n\n![](OEBPS/image_rsrc557.jpg)\n\nFigure 3-19.\n\n# Code Explanation\n\n\
    The line \\`cm = confusion\\_matrix(y\\_test, y\\_pred)\\` involves using the\
    \ \\`confusion\\_matrix\\` function from the \\`scikit-learn\\` library to evaluate\
    \ the performance of a classification model. Here’s a detailed explanation:\n\n\
    confusion\\_matrix(y\\_test, y\\_pred):\n\ny\\_test: This is the array of true\
    \ class labels for the test dataset. These are the actual values that you are\
    \ trying to predict.\n\ny\\_pred: This is the array of predicted class labels\
    \ that the model has generated for the test dataset. These predictions are made\
    \ by the model and are based on the test features (\\`X\\_test\\`).\n\nConfusion\
    \ Matrix:\n\nThe confusion matrix is a table that is often used to describe the\
    \ performance of a classification model. It shows the number of correct and incorrect\
    \ predictions made by the model compared to the actual outcomes (ground truth).\n\
    \nIt is a 2x2 matrix for binary classification problems, which looks like this:\n\
    \n\\[\\[TN, FP\\],\n\n\\[FN, TP\\]\\]\n\nWhere:"
