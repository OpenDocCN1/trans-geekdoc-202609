    \ || Decision Tree || 100% |\n| 7 || Random Forest || 100% |\n\n决策树和随机森林模型的完美准确率体现了它们在学习和概括心脏数据中的模式方面的强大能力。这些高准确率意味着这些模型在对心脏数据集进行分类时很可能非常可靠，使它们成为心脏数据分类任务的优秀候选者。它们能够捕捉特征之间的复杂关系和交互作用，这可能是其卓越性能的关键因素。\n\
    \n这些模型在诊断心脏疾病或预测心血管风险因素等应用中具有巨大的潜力。在这些任务中，精确分类对于做出明智决策和实施有效干预至关重要，这凸显了利用具有如此强大性能和精度的模型的重要性。\n\
    \n# Chapter 4\n\n# Clustering\n\n聚类就像整理你凌乱的房间。你会把相似的事物放在一起，比如衣服放一堆，书放一堆，玩具放一堆。在机器学习中，情况类似，但针对的是数据。我们将相似的数据点聚在一起，以发现模式和关系，从而更好地理解信息。例如，我们可能会把购买相似商品的客户聚为一组，帮助企业了解客户的偏好。下面是不同行业中聚类应用的简化示例：\n\
    \nRetail（零售）：在零售业，聚类用于客户细分，根据购买行为将客户分组。这有助于零售商针对特定客户细分群体定制营销策略和促销活动。\n\nHealthcare（医疗）：在医疗领域，聚类可用于患者细分，根据医疗史或症状相似的患者进行分组。这有助于医疗提供者个性化治疗方案并预测疾病结果。\n\
    \nFinance（金融）：在金融领域，聚类用于欺诈检测，通过相似性将交易分组以识别潜在欺诈行为。它也用于组合优化，将风险和回报相似的金融资产分组，以优化投资策略。\n\
    \nManufacturing（制造业）：在制造业，聚类可用于质量控制，根据产品特性将产品分组以识别缺陷或异常。它也用于供应链优化，将供应商或生产流程分组，以提高生产效率。\n\
    \nMarketing（营销）：在营销领域，聚类用于市场细分，根据人口统计或行为相似的消费者分组，以更有效地定位营销活动。它也用于趋势分析，识别消费者偏好或市场行为中的模式和趋势。\n\
    \nTelecommunications（电信）：在电信领域，聚类用于网络优化，根据使用模式将网络用户分组，以优化网络容量和性能。它也用于客户流失预测，根据相似特征将客户分组，以识别有流失风险的客户。\n\
    \n# K-means clustering\n\nK-means 聚类是一种流行的非监督机器学习技术，它根据相似性将数据点分组为不同的簇。算法将每个数据点分配到预先确定的\
    \ K 个簇之一中。随后，它迭代调整每个簇的中心，直到簇中心与数据点之间的距离最小化。结果是 K 个包含相似特征的数据点的簇集合。\n\nK-means 聚类广泛应用于图像分割、客户细分和异常检测等领域。它是识别大数据集中模式和结构的有效方式，有助于做出数据驱动的决策。\n\
    \n# Problem statement\n\nKelly，一家商业银行的新产品经理，希望提升交易量。她邀请数据团队协助开展针对性广告活动。Kelly 的计划是根据年收入和评分对客户进行排序，并将其分组。这种细分能够实现针对性广告投放，利用每个群体的消费习惯。通过以此方式最大化营销努力，银行旨在提高营销参与度，最终增加收入。\n\
