    To address missing values in numerical features, we need to replace them with
    their mean values. This ensures that our dataset remains complete and accurate
    for analysis.


    First, we identify the numeric features. Referring to [Figure 2-10](#part0001_split_000.xhtml#a4YB)
    , the numeric features are indexed as 0 (age), 2 (BMI), and 3 (children).


    We can select these features by specifying all rows (:) and the column indices
    \[0, 2, 3\], as demonstrated in Figure 2-16 .


    ![](OEBPS/image_rsrc52B.jpg)


    Figure 2-16.


    # Handling Missing Data


    Now that we have identified the index positions of our numerical features (age,
    BMI, and number of children), we will use SimpleImputer to handle the missing
    values. We will set the missing values to NaN and employ a strategy of replacing
    them with the mean, as shown in Figure 2-17 .


    ![](OEBPS/image_rsrc52C.jpg)


    Figure 2-17: I created an instance of SimpleImputer and assigned it to a variable
    named imp . We then fit the imputer to the data in X  for all rows and the specified
    columns. To ensure the transformed values are displayed with two decimal places,
    we used np.set\_printoptions(precision=2) . Finally, we transformed the data using
    imp.transform . This method checks for NaN values in the target columns \[0, 2,
    3\] and replaces any found with the mean value of that column.


    # Encoding Categorical variable


    We also need to encode the categorical data in the dataset. These features are
    essential for our machine learning model, hence the need for encoding. The categorical
    data includes: sex at index position 1, smoker at index position 4, and region
    at index position 5, as shown in [Figure 2-10](#part0001_split_000.xhtml#a4YB)
    .


    To achieve this, we will use ColumnTransformer with OneHotEncoder() as one of
    the parameters, as depicted in Figure 2-18 . The parameter remainder=''passthrough''
     indicates that the other columns should be ignored, and focus should be on columns
    at index positions 1, 4, and 5.


    ![](OEBPS/image_rsrc52D.jpg)


    Figure 2-18: This is a standard implementation that works regardless of column
    or feature positions. You simply need to provide the index positions of the features
    to be encoded.


    In this example, I instantiated the ColumnTransformer and assigned it to a variable
    named ct . Follow the parameter pattern shown here with your own dataset, and
    you will achieve similar results.


    I then fit and transformed X , assigning the transformed data back to X . This
    means that the ColumnTransformer processes all features in X , focusing specifically
    on the columns at index positions 1, 4, and 5. It fits the data to ct , transforms
    it, and reassigns it to X .


    Let''s examine the impact of the column transformation and one-hot encoding. You
    can do this by viewing the first five records in X , as shown in Figure 2-19 .


    ![](OEBPS/image_rsrc52E.jpg)


    Figure 2-19.


    # Splitting the data into test train


    Using the train\_test\_split  function, we will split the data with an 80:20 ratio,
    where 80% of the data is used for training and 20% is reserved for testing. This
    means that 80% of the data will be assigned to X\_train  and y\_train , while
    the remaining 20% will be assigned to X\_test  and y\_test , as shown in Figure
    2-20 .


    ![](OEBPS/image_rsrc52F.jpg)


    Figure 2-20.


    Now that we have completed data preprocessing, it is time to train our model.
    Before doing so, we need to transform our data into polynomial form, as illustrated
    in Figure 2-21 .


    The line Poly\_reg = PolynomialFeatures(degree=4)  creates an instance of the
    PolynomialFeatures  class. This instance generates polynomial features up to the
    4th degree, which will be used to transform the original features for polynomial
    regression modeling.


    ![](OEBPS/image_rsrc52G.jpg)


    Figure 2-21. The model was trained successfully without any error.


    Figure 2-22  shows an R-squared score of 0.85122 for the model, indicating that
    approximately 85.12% (0.85122 \* 100)  of the variability in the dependent variable
    can be explained by the independent variables in your model. This high R-squared
    value suggests that your model fits the data well and can explain a large portion
    of the variance in the dependent variable.


    ![](OEBPS/image_rsrc52H.jpg)


    Figure 2-22.


    # Interpretation of the r2\_score for Polynomial Regression Model


    The  R 2   (pronounced "R-squared") score, also referred to as the coefficient
    of determination, is a statistical metric that quantifies the proportion of the
    variance in the dependent variable that can be explained by the independent variable(s).


    An R 2   score of 0.851227 indicates that approximately 85.12% of the variance
    in the dependent variable is predictable from the independent variable(s) in the
    model. In other words, the model explains about 85.12% of the variability in the
    data. This suggests that the model fits the data quite well, as a high R 2 score
    indicates that the observed outcomes are well-represented by the model predictions.


    # To make predictions using Polynomial Regression


    To make predictions using polynomial regression, you can use the predict  function
    on the trained model, providing the necessary input parameters, as demonstrated
    in Figure 2-23 .


    ![](OEBPS/image_rsrc52J.jpg)


    Figure 2-23.


    ![](OEBPS/image_rsrc52K.jpg)


    In this example, \`sex\`, \`smoker\`, \`region\`, \`age\`, \`bmi\`, and \`children\`
    are the input features used for the prediction.


    # Code Explanation


    In the context of polynomial regression, the model needs the input features to
    be transformed into polynomial features before making a prediction. The code snippet
