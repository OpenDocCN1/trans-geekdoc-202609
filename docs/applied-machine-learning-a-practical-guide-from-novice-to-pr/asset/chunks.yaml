    # Code explanation


    The `import pickle` statement imports the `pickle` module, which provides functions
    for serializing and deserializing Python objects.


    The `open(''model.pkl'', ''wb'')` statement opens a file named `model.pkl` in
    write binary mode (`''wb''`). This file will be used to save the serialized object.


    The `with` statement is used as a context manager to automatically close the file
    after the block of code is executed.


    Inside the `with` block, `pickle.dump(kmeans, f)` serializes the `kmeans` object
    using the `pickle.dump()` function. This function takes two arguments: the object
    to be serialized (`kmeans`) and the file object (`f`) where the serialized data
    will be written.


    After executing this code, the `kmeans` object will be serialized and saved to
    the file `model.pkl`, ready to be loaded later using `pickle.load()`.


    The next step is to bring the copy of the `model.pkl` file to your preferred directory
    and reference it. In my case, the model is dropped in the root directory of my
    application as seen in Figure 5-5.


    ![](OEBPS/image_rsrc57V.jpg)


    Figure 5-5.


    Here is the complete code below:


    ![](OEBPS/image_rsrc57W.jpg)


    Code explanation


    This code defines a Flask API with a single endpoint `/api/custype` that accepts
    POST requests. Let''s break down the code step by step:


    Imports :


    `from flask import Flask, jsonify, request` : Imports the Flask framework and
    necessary modules for handling JSON responses and HTTP requests.


    `import pickle` : Imports the `pickle` module for serializing and deserializing
    Python objects.


    `import numpy as np` : Imports the `numpy` library, commonly used for numerical
    computations in Python.


    Flask Application Setup :


    `app = Flask(__name__)` : Creates a Flask application instance.


    API Endpoint `/api/custype` :


    `@app.route(''/api/custype'', methods=[''POST''])` : Decorates the `Custype()`
    function as the endpoint handler for POST requests to `/api/custype`.


    `def Custype():` Defines the `Custype()` function to handle requests to the `/api/custype`
    endpoint.


    Inside the function:


    `data = request.get_json():` Retrieves the JSON data from the request payload.


    `Annual_Income = data.get(''Annual_Income'') and Spending_Score = data.get(''Spending_Score''):`
    Extracts the `''Annual_Income''` and `''Spending_Score''` values from the JSON
    data.


    `filename = ''model.pkl''` : Specifies the filename of the pickled machine learning
    model.


    Deserializes the machine learning model from the file `''model.pkl''` using `pickle.load(f)`.


    Uses the loaded model to make predictions on the provided `''Annual_Income''`
    and `''Spending_Score''` values.


    Constructs a message containing the prediction outcome and returns it as a JSON
    response.


    The `try-except` block ensures that any exceptions that occur during the prediction
    process are caught, and an appropriate error response is returned.


    Run the Flask Application :


    `if __name__ == ''__main__'':` Checks if the script is being run directly.


    `app.run(debug=True)` : Starts the Flask development server with debug mode enabled.


    # Explanation of the Prediction Message


    The prediction message returned in the JSON response indicates which cluster the
    customer belongs to based on their annual income and spending score, as predicted
    by the machine learning model. The message includes the customer''s annual income,
    spending score, and the cluster number to which they belong.


    Overall, this Flask API endpoint demonstrates how to use a trained machine learning
    model to make predictions on incoming data provided via a POST request, and return
    the prediction result as a JSON response.


