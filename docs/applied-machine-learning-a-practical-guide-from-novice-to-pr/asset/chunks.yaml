    `OneHotEncoder`: A class from the `sklearn.preprocessing` module that converts
    categorical features into a format that can be provided to machine learning algorithms
    to do a better job in prediction.


    `np`: This is the commonly used alias for the NumPy library, which is useful for
    array operations.


