    )。


    # 第 2 章


    回归


    # 回归


    回归分析是一种受监督的机器学习方法，用于预测一个或多个连续数值，例如工资，基于数据集中的关系和模式。该方法可用于识别一个或多个自变量与因变量之间的关系，从而生成对未来数据点的准确预测。


    回归分析常用于金融、经济和社会科学中，用于建模变量之间的关系，例如收入与受教育程度，并预测未来趋势。生成回归模型需要选择合适的算法、验证准确性并调整模型以提升预测效果。


    数据科学中使用了多种回归模型，每种都有其自身的假设和应用场景。其中最常用的回归类型之一是线性回归，它假设自变量和因变量之间存在线性关系。


    在我们对回归的探讨中，我们将涵盖以下类型：


    -   简单线性回归

    -   多元线性回归

    -   多项式回归

    -   支持向量回归 (SVR)

    -   决策树回归

    -   随机森林回归


    # 简单线性回归


    简单线性回归是一种基本的机器学习算法，用于预测连续的因变量（也称为响应或结果变量）。该预测基于单个自变量，称为预测器或解释变量。


    该算法假设两个变量之间存在线性关系，即关系可以用直线表示。此外，模型假设自变量 X 和因变量 Y 之间存在直接比例关系。


    该关系可以通过以下数学公式表示：


    Y=β0+β1\* X+ϵ


    Y 是因变量。


    X 是自变量。


    β0 是截距（常数项）。


    β1 是斜率，表示 X 每增加一个单位时 Y 的变化量。


    ϵ 是误差项，表示影响 Y 但未包含在模型中的未观测因素。


    注意：简单线性回归数据集包含一个自变量和一个因变量。


    # 适用于银行、零售、制造等领域的问题陈述


    Kunle 是一位才华横溢的数据科学家，他刚刚加入 XYZ 食品有限公司，这是一家知名的食品行业企业。他的机器学习专业知识使他被指派开发一个基于历史销售数据的模型，以提升销售业绩。公司提供了一个包含过去销售数据的详尽数据集，主要受电视广告驱动。


    Kunle 的主要目标是构建一个预测模型，帮助组织在电视广告投资上做出明智决策，从而提高销售。他仔细分析数据集，运用机器学习专业知识，找出电视广告活动成功的关键因素。凭借对机器学习算法的了解，Kunle
    旨在开发一个稳健的模型，能够准确预测电视广告对销售的影响。


    他的工作对 XYZ 食品有限公司的营销策略至关重要。Kunle 投入大量时间进行数据分析和模型开发，致力于提供电视广告与销售之间的有价值洞察。通过他的工作，他希望帮助
    XYZ 食品有限公司优化销售并有效实现业务目标。


    您可以通过下载链接获取该数据集：[adv_data.csv](https://www.google.com/url?q=https://github.com/anyasorc/appliedml/blob/main/adv_data.csv&sa=D&source=editors&ust=1720099681717744&usg=AOvVaw10ecD8CFVW9tMp9bDzkemH)
    。


    # 解决方案


    Kunle 首先在 Excel 中预览数据，以获得其结构的初步了解，如图 2-1 所示。


    ![](img/image_rsrc51V.jpg)


