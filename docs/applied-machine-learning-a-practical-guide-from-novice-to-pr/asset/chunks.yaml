    \n# 模型评估\n\n在训练机器学习模型后，评估其性能非常重要，通过查看准确率得分来判断模型在训练数据上的拟合情况，如图 3-31 所示。\n\n![](img/image_rsrc55T.jpg)\n\
    \n图 3-31。\n\n# 代码解释\n\n`accuracy_score(y_test, y_pred)` 是 scikit-learn 库中的函数，用于计算分类模型的准确率。详细说明如下：\n\
