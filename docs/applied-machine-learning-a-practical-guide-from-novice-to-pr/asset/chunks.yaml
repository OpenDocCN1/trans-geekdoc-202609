    # Convert Machine learning model to API


    After training a model, you can serialize it to save its state and load it later
    for making predictions, and this can be achieved using the Pickle library. Pickle
    is a module in Python used for serializing and deserializing Python object structures,
    also known as marshalling or flattening. Serialization is the process of converting
    a Python object into a byte stream so it can be saved to a file or database, or
    sent over a network. Deserialization is the reverse process, converting the byte
    stream back into a Python object.


    ### How to Use Pickle


