  trans: "\n-   [核心参数 `kernel='rbf'`：该参数指定算法使用的核函数类型。`'rbf'` 代表径向基函数（Radial Basis\
    \ Function），是一种常用于处理特征与目标变量之间非线性关系的核。RBF 核会将输入特征映射到更高维空间，从而在该空间中可以找到线性分离，使其能够有效捕获复杂模式。]\n\
    \n![](img/image_rsrc53E.jpg)\n\n-   [fit(X_train, y_train)：该方法用于使用训练数据训练 SVR 模型。`X_train`\
    \ 包含输入特征，`y_train` 包含对应的目标值。  \n\n    在拟合过程中，SVR 算法通过寻找最佳超平面（或决策边界），在指定的容差（epsilon-insensitive\
    \ 区间）内使数据最佳拟合，从而学习输入特征与目标变量之间的关系。]\n\n![](img/image_rsrc53F.jpg)\n\n# 使用测试数据进行预测\n\
    \nFigure 2-49  下面的图示了如何使用已训练好的模型（回归器）和测试数据（X_test）进行预测。\n\n![](img/image_rsrc53F.jpg)\n\
    \nFigure 2-49.\n\n# 代码说明\n\n![](img/image_rsrc53G.jpg)\n\n-   [sc_X.transform(X_test)：将与训练数据\
    \ X_train 相同的标准化过程应用于测试数据 X_test。  \n\n    `sc_X` 是一个 `StandardScaler` 实例，之前已在\
    \ X_train 上拟合。这样可以确保 X_test 使用与训练数据相同的均值和标准差进行标准化，使特征保持相同的尺度。]\n\n![](img/image_rsrc53H.jpg)\n\
    \n-   [regressor.predict(...)：使用已训练好的 SVR 模型对标准化后的测试数据进行预测。  \n\n    这一步的输出是一个一维数组，包含预测的目标值，但这些预测仍然处于训练时使用的标准化尺度。]\n\
    \n![](img/image_rsrc53J.jpg)\n\n-   [.reshape(-1, 1)：将预测值数组 reshape 为二维数组，列数为\
