    X[:, [0, 2, 3]]: This selects all rows and the columns at index positions 0, 2,
    and 3 from the array X. These columns are assumed to be numerical.


    .fit(...): This method calculates the mean value of each selected column based
    on the non-missing values and stores these mean values for later use.


    np.set_printoptions(precision=2)


    This function configures how NumPy arrays are displayed. Here, it sets the precision
    of the printed output to 2 decimal places.


    X[:, [0, 2, 3]] = imp.transform(X[:, [0, 2, 3]])


    X[:, [0, 2, 3]]: Again, this selects all rows and the columns at index positions
    0, 2, and 3 from the array X.


    imp.transform(...): This method replaces the missing values in the selected columns
    with the mean values calculated during the .fit(...) step.


    X[:, [0, 2, 3]] = ...: This assignment updates the selected columns in the original
    array X with the transformed data where missing values have been replaced.


    # ColumnTransformer and OneHotEncoder()


    Machine learning models does not understand text and hence there is a need to
    convert them to numerical representations that the models could understand and
    that’s the reason we need to convert the categorical variables in index position
    1 (sex), 4 (smoker), and 5 (Region) as seen in Figure 2-71 . To achieve that,
    we will be working with ColumnTransformer and OneHotEncoder as seen in Figure 2-74 .


    ![](OEBPS/image_rsrc549.jpg)


    Figure 2-74.


    # Code Explanation.


    ColumnTransformer : A class from the sklearn.compose module that applies different
    preprocessing transformations to different columns of a dataset.


    OneHotEncoder : A class from the sklearn.preprocessing module that converts categorical
    features into a format that can be provided to machine learning algorithms to
    do a better job in prediction.


    np : This is the commonly used alias for the NumPy library, which is useful for
    array operations.


    Creating an Instance of ColumnTransformer


    ![](OEBPS/image_rsrc52X.jpg)


    ColumnTransformer(...):


    This initializes a ColumnTransformer object to apply specified transformations
    to specific columns.


    transformers=[(''encoder'', OneHotEncoder(), [1, 4, 5])]:


    ''encoder'': The name given to this transformer. It can be any string.


    OneHotEncoder(): This specifies that we are using the OneHotEncoder for the transformation.


    [1, 4, 5]: This list specifies the indices of the columns to be transformed. Here,
    columns at index positions 1, 4, and 5 will be one-hot encoded.


    remainder=''passthrough'':


    This parameter specifies what should be done with the columns that are not explicitly
    transformed. ''passthrough'' means that these columns will be left unchanged and
    included in the output.


