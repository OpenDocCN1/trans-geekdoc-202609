- raw: "Addressing missing values is relevant for numerical features/columns, as shown\
    \ in Figure 2-43 . We have selected the features/columns with index positions\
    \ 0, 2, and 3, which correspond to Age, BMI, and Number of Children, respectively,\
    \ as illustrated in Figure 2-42 .\n\n![](OEBPS/image_rsrc52U.jpg)\n\nFigure 2-43\
    \ . X\\[:, \\[0, 2, 3\\]\\]  means \"select all rows and the columns at index\
    \ positions 0, 2, and 3. So, X\\[:, \\[0, 2, 3\\]\\]  effectively extracts the\
    \ Age, BMI, and Number of Children columns for all rows in the dataset.\n\nAfter\
    \ identifying the numerical columns, we will use the SimpleImputer class to calculate\
    \ the mean value for each column and replace any missing values with these means,\
    \ as demonstrated in Figure 2-44 .\n\n![](OEBPS/image_rsrc52V.jpg)\n\nFigure 2-44.  \n\
    \n# Code Explanation\n\nSimpleImputer(missing\\_values=np.nan, strategy='mean')\n\
    \nmissing\\_values=np.nan: This parameter specifies that the missing values to\
    \ be imputed are represented by np.nan\n\nstrategy='mean': This parameter specifies\
    \ that the missing values should be replaced with the mean value of the respective\
    \ column.\n\nimp.fit(X\\[:, \\[0, 2, 3\\]\\])\n\nX\\[:, \\[0, 2, 3\\]\\]: This\
    \ selects all rows and the columns at index positions 0, 2, and 3 from the array\
    \ X. These columns are assumed to be numerical.\n\n.fit(...): This method calculates\
    \ the mean value of each selected column based on the non-missing values and stores\
    \ these mean values for later use.\n\nnp.set\\_printoptions(precision=2)\n\nThis\
    \ function configures how NumPy arrays are displayed. Here, it sets the precision\
    \ of the printed output to 2 decimal places.\n\nX\\[:, \\[0, 2, 3\\]\\] = imp.transform(X\\\
    [:, \\[0, 2, 3\\]\\])\n\nX\\[:, \\[0, 2, 3\\]\\]: Again, this selects all rows\
    \ and the columns at index positions 0, 2, and 3 from the array X.\n\nimp.transform(...):\
    \ This method replaces the missing values in the selected columns with the mean\
    \ values calculated during the .fit(...) step.\n\nX\\[:, \\[0, 2, 3\\]\\] = ...:\
    \ This assignment updates the selected columns in the original array X with the\
    \ transformed data where missing values have been replaced.\n\n# ColumTransformer\
    \ and OneHotEncoder()\n\nMachine learning models does not understand text and\
    \ hence there is a need to convert them to numerical representations that the\
    \ models could understand and that’s the reason we need to convert the categorical\
    \ variables in index position 1 (sex), 4 (smoker), and 5 (Region) as seen in Figure\
    \ 2-42 .  To achieve that, we will be working with COlumnTransformer and OneHotEncoder\
    \ as seen in  Figure 2-45 .\n\n![](OEBPS/image_rsrc52W.jpg)\n\nFigure 2-45.\n\n\
    ColumnTransformer : A class from the sklearn.compose module that applies different\
    \ preprocessing transformations to different columns of a dataset.\n\nOneHotEncoder\
    \ : A class from the sklearn.preprocessing module that converts categorical features\
    \ into a format that can be provided to machine learning algorithms to do a better\
    \ job in prediction.\n\nnp : This is the commonly used alias for the NumPy library,\
    \ which is useful for array operations.\n\nCreating an Instance of ColumnTransformer\n\
    \n![](OEBPS/image_rsrc52X.jpg)\n\nColumnTransformer(...) :\n\nThis initializes\
    \ a ColumnTransformer object to apply specified transformations to specific columns.\n\
    \ntransformers=\\[('encoder', OneHotEncoder(), \\[1, 4, 5\\])\\] :\n\n'encoder':\
    \ The name given to this transformer. It can be any string.  \n\nOneHotEncoder():\
    \ This specifies that we are using the OneHotEncoder for the transformation.\n\
    \n\\[1, 4, 5\\]: This list specifies the indices of the columns to be transformed.\
    \ Here, columns at index positions 1, 4, and 5 will be one-hot encoded.\n\nremainder='passthrough'\
    \ :\n\nThis parameter specifies what should be done with the columns that are\
    \ not explicitly transformed. 'passthrough' means that these columns will be left\
    \ unchanged and included in the output.\n\n# Splitting into train and test set\n\
    \nWe need to split our dataset into training and testing sets. We will use an\
    \ 80:20 split, where 80% of the data will be used to train the model, and the\
    \ remaining 20% will be used to test it on unseen data. Figure 2-46  illustrates\
    \ this process.\n\n![](OEBPS/image_rsrc537.jpg)\n\nFigure 2-46.\n\n# Code Explanation\n\
    \ntrain\\_test\\_split : This is a function from the sklearn.model\\_selection\
    \ module in the scikit-learn library. The function is used to split the dataset\
    \ into training and testing sets. X\\_train and y\\_train are used to train the\
    \ model. X\\_test and y\\_test are used to evaluate the model's performance on\
    \ unseen data\n\nComponents of the Function Call :\n\nX: This is the feature matrix\
    \ (input variables). It contains the independent variables or predictors.\n\n\
    y: This is the target vector (output variable). It contains the dependent variable\
    \ or response.\n\ntest\\_size=0.2: This parameter specifies the proportion of\
    \ the dataset to include in the test split. Here, 0.2 means 20% of the data will\
    \ be used for testing, and the remaining 80% will be used for training.\n\nrandom\\\
    _state=0: This parameter controls the shuffling applied to the data before splitting.\
    \ Passing an integer ensures reproducibility of the split, meaning the same data\
    \ split will occur every time you run the code with this random\\_state value.\n\
    \nOutput of the Function Call :\n\nX\\_train: This is the training subset of the\
    \ feature matrix. It contains 80% of the rows from X.\n\nX\\_test: This is the\
    \ testing subset of the feature matrix. It contains the remaining 20% of the rows\
    \ from X.\n\ny\\_train: This is the training subset of the target vector. It contains\
    \ the corresponding 80% of the rows from y that match the rows in X\\_train.\n\
    \ny\\_test: This is the testing subset of the target vector. It contains the corresponding\
    \ 20% of the rows from y that match the rows in X\\_test.\n\nBy using a test\\\
    _size of 0.2, we ensure that 20% of the data is reserved for testing, which helps\
    \ in assessing how well the model generalizes to new data. The random\\_state\
    \ ensures that the data split is reproducible, providing consistency in results\
    \ across multiple runs.\n\n# Standardizing the data for SVR\n\nIn the context\
    \ of machine learning, particularly when using algorithms that are sensitive to\
    \ the scale of the input data, it is common to standardize the data. Standardization\
    \ transforms the data such that it has a mean of zero and a standard deviation\
    \ of one. This is particularly important for Support Vector Regression (SVR),\
    \ which is sensitive to the scales of the input features.  Figure 2-47 illustrates\
    \ how to implement it.\n\n![](OEBPS/image_rsrc538.jpg)\n\nFigure 2-47.\n\n# Code\
    \ Explanation\n\n![](OEBPS/image_rsrc539.jpg)\n\nTwo instances of StandardScaler\
    \ are created: sc\\_X for the input features X and sc\\_y for the target variable\
    \ y\n\n![](OEBPS/image_rsrc53A.jpg)\n\nfit\\_transform is a method that first\
    \ fits the scaler to the data (calculates the mean and standard deviation for\
    \ each feature in X\\_train) and then transforms the data based on these statistics.\n\
    \nAfter this transformation, each feature in X\\_train will have a mean of zero\
    \ and a standard deviation of one.\n\n![](OEBPS/image_rsrc53B.jpg)\n\nSimilarly,\
    \ fit\\_transform is applied to the target variable y\\_train.\n\nThis is less\
    \ common in some machine learning contexts but can be important for algorithms\
    \ like SVR, which can benefit from having the target variable on a similar scale\
    \ to the input features.\n\n# Training the Model\n\nFigure 2-48  illustrates the\
    \ process of using the X\\_train and y\\_train datasets to train the machine learning\
    \ model. The execution of the training process indicates that the model was successfully\
    \ trained.\n\n![](OEBPS/image_rsrc53C.jpg)\n\nFigure 2-48.\n\n# Code Explanation\n\
    \n![](OEBPS/image_rsrc53D.jpg)\n\nSVR : This stands for Support Vector Regression,\
    \ a type of Support Vector Machine (SVM) used for regression tasks.  "
