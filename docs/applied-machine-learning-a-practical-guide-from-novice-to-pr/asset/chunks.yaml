    \n`y_train`：表示包含训练数据对应标签的目标向量。\n\n# 使用测试数据进行预测\n\n下面的 Figure 3-65 展示了我们如何使用已训练好的模型（`cs`）和测试数据（`X_test`）来进行预测。\n\
    \n![](img/image_rsrc557.jpg)\n\nFigure 3-65.\n\n# 代码解释\n\n`y_pred = cs.predict(X_test)`\
    \ 这一行专门用随机森林模型（`cs`）在测试数据集（`X_test`）上进行预测。下面是针对 `RandomForestClassifier` 模型的详细说明：\n\
    \n`cs`：这是一个 `RandomForestClassifier` 实例，已在训练数据上进行了拟合。在 scikit-learn 中，它可以通过 `RandomForestClassifier()`\
    \ 创建，然后使用 `cs.fit(X_train, y_train)` 进行训练。\n\n`X_test`：这是包含待预测特征的测试数据集。这些特征应与训练数据同样预处理（例如标准化）。\n\
    \n`predict(X_test)`：该方法用于根据随机森林模型 `cs` 对输入数据（`X_test`）进行类别标签的预测。\n\n`y_pred` 是一个数组，包含\
    \ `X_test` 中每个观测的预测类别标签。对于二分类问题，`y_pred` 中的值要么是 0，要么是 1。\n\n# 模型评估\n\n在训练机器学习模型后，评估其性能非常重要。我们先查看混淆矩阵（如\
    \ Figure 3-66 所示），再考虑准确率得分。\n\n![](img/image_rsrc56V.jpg)\n\nFigure 3-66.\n\n\
    # 代码解释\n\n`cm = confusion_matrix(y_test, y_pred)` 这一行使用 scikit-learn 库中的 `confusion_matrix`\
    \ 函数来评估分类模型的性能。具体说明如下：\n\n`confusion_matrix(y_test, y_pred)`：\n\n- `y_test`：测试数据集的真实类别标签数组。这些是我们想要预测的实际值。\n\
    - `y_pred`：模型为测试数据集生成的预测类别标签数组。模型基于测试特征（`X_test`）生成这些预测。\n\n混淆矩阵：\n\n混淆矩阵是一张表，用于描述分类模型的表现，显示模型在实际结果（地面真实）与预测结果之间的正确和错误数量。\n\
    \n二分类问题的混淆矩阵如下：\n\n```\n[[TN, FP],\n [FN, TP]]\n```\n\n其中：\n\n- TN（True Negative）：模型正确预测负类的实例数量（实际为负且预测为负）。\n\
    - FP（False Positive）：模型错误预测正类的实例数量（实际为负但预测为正）。\n- FN（False Negative）：模型错误预测负类的实例数量（实际为正但预测为负）。\n\
    - TP（True Positive）：模型正确预测正类的实例数量（实际为正且预测为正）。\n\n# 混淆矩阵解读\n\nFigure 3-67 展示了逻辑回归模型的混淆矩阵。\n\
