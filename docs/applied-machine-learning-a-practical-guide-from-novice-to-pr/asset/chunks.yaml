  trans: "\ntrain`_`test`_`split : 这是 sklearn.model`_`selection 模块中的一个函数，用于将数据集划分为训练集和测试集。X`_`train\
    \ 和 y`_`train 用于训练模型，X`_`test 和 y`_`test 用于在未见数据上评估模型的性能。\n\nComponents of the\
    \ Function Call :\n\nX: 这是特征矩阵（输入变量）。它包含独立变量或预测器。\n\ny: 这是目标向量（输出变量）。它包含因变量或响应变量。\n\
    \ntest`_`size=0.2: 该参数指定要包含在测试集中的数据集比例。这里，0.2 表示 20% 的数据将用于测试，剩余 80% 用于训练。\n\n\
    random`_`state=0: 该参数控制在将数据划分前对数据进行洗牌的操作。传入整数可确保分割的可重复性，即每次使用相同的 random`_`state\
    \ 值运行代码时，数据划分结果相同。\n\nOutput of the Function Call :\n\nX`_`train: 这是特征矩阵的训练子集。包含\
    \ X 中 80% 的行。\n\nX`_`test: 这是特征矩阵的测试子集。包含 X 中剩余的 20% 的行。\n\ny`_`train: 这是目标向量的训练子集。包含与\
    \ X`_`train 中行对应的 y 中 80% 的行。\n\ny`_`test: 这是目标向量的测试子集。包含与 X`_`test 中行对应的 y 中\
    \ 20% 的行。\n\n通过使用 test`_`size=0.2，我们确保 20% 的数据被保留用于测试，这有助于评估模型在新数据上的泛化能力。random`_`state\
    \ 确保数据划分是可重复的，从而在多次运行代码时保持结果一致。\n\n# Training the model\n\nFigure 2-33  说明了如何使用\
    \ X`_`train 和 y`_`train 数据集训练机器学习模型。执行结果表明模型已成功训练。\n\n![](img/image_rsrc52Z.jpg)\n\
    \nFigure 2-33 .\n\n# Code Explanation\n\nlr = LinearRegression()\n\n这一行创建 LinearRegression\
    \ 类的实例并将其赋值给变量 lr。\n\n实例 lr 将用于将模型拟合到训练数据并进行预测。\n\nlr.fit(X`_`train, y`_`train)\n\
    \nfit: 该方法在训练数据上训练线性回归模型。\n\nX`_`train: 训练数据的特征矩阵，包含独立变量。\n\ny`_`train: 训练数据的目标向量，包含因变量。\n\
    \n运行此代码后，lr 实例包含已训练好的线性回归模型，可通过 predict 方法对新数据进行预测。\n\n# Predicting with the test\
    \ data\n\nFigure 2-34  展示了如何使用已训练好的模型 (lr) 和测试数据 (X`_`test) 进行预测。\n\n![](img/image_rsrc530.jpg)\n\
    \nFigure 2-34\n\n# Code Explanation\n\ny`_`pred = lr.predict(X`_`test) :\n\n此代码使用已训练好的线性回归模型\
    \ (lr) 对测试数据 (X`_`test) 的因变量值进行预测。预测结果存储在变量 y`_`pred 中。\n\npredict 方法将在训练阶段学习到的关系应用于测试数据，生成这些预测，从而提供模型在未见数据上的性能估计。\n\
    \n# Model Evaluation\n\n在训练机器学习模型后，通过检查 R² 分数来评估其性能是很重要的。R² 分数表示模型在训练数据上的拟合程度，如\
