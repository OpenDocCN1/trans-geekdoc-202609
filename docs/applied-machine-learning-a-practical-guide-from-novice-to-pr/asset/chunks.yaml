    \ (TN)：98  \n  这些是实际为负类（例如，无心脏病）且模型正确预测为负的实例。\n\n- False Positives (FP)：0  \n\
    \  这些是实际为负类，但模型错误地预测为正类（例如，预测有心脏病但实际上没有）。\n\n- False Negatives (FN)：0  \n  这些是实际为正类（例如，恶性肿瘤）但模型错误地预测为负类（例如，预测无心脏病但实际上有心脏病）。\n\
    \n- True Positives (TP)：107  \n  这些是实际为正类，且模型正确预测为正的实例。\n\n从这张混淆矩阵可以计算出多个性能指标（准确率、精确率、召回率和\
    \ F1 分数）：\n\n准确率：\n\n准确率的公式为：\n\n![](img/image_rsrc54T.jpg)  \n\n在提供的示例中：\n\n\
    TN = 98  \nTP = 107  \nFP = 0  \nFN = 0  \n\n代入公式：\n\n![](img/image_rsrc56K.jpg)\n\
    \n这意味着模型正确分类了约 86.3% 的实例。\n\n精确率：\n\n精确率的公式为：\n\n![](img/image_rsrc54V.jpg)\n\n\
    在提供的示例中：\n\nTP = 107  \nFP = 0  \n\n代入公式：\n\n![](img/image_rsrc56M.jpg)\n\n这意味着约\
    \ 82.6% 的模型预测为正的实例实际上是正的。\n\n召回率：\n\n召回率的公式为：\n\n![](img/image_rsrc54X.jpg)\n\n\
    在提供的示例中：\n\nTP = 107  \nFN = 0  \n\n代入公式：\n\n![](img/image_rsrc56N.jpg)\n\n这意味着约\
    \ 93.5% 的实际正例被模型正确识别。\n\nF1 分数：\n\nF1 分数的公式为：\n\n![](img/image_rsrc54Z.jpg)\n\n\
    在提供的示例中：\n\nPrecision = 1.0  \nRecall = 1.0  \n\n代入公式：\n\n![](img/image_rsrc56P.jpg)\n\
    \n# 解读\n\n准确率 (100%)：表明模型正确预测了 100% 的实例，整体预测完美无误。\n\n精确率 (100%)：在所有被模型预测为正的实例中，100%\
    \ 实际为正，说明没有假阳性，模型在做出正预测时完全可靠。\n\n召回率 (100%)：模型正确识别了 100% 的实际正例，说明没有假阴性，模型能够捕获所有正例。\n\
    \nF1 分数 (100%)：结合精确率和召回率的加权平均，F1 分数为 100%，表明精确率与召回率之间达到完美平衡，模型在分类任务上表现 flawless。\n\
    \n# 模型评估\n\n在训练机器学习模型后，评估其性能时，需要检查准确率得分。准确率得分展示了模型在训练数据上的拟合情况，如 Figure 3-68 所示。\n\
    \n![](img/image_rsrc56R.jpg)\n\nFigure 3-68.\n\n# 模型结果解释\n\n准确率 (100%)：准确率得分为\
