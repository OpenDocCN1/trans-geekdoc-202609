- raw: "# Interpreting the Confusion Matrix\n\nThe confusion matrix helps you understand\
    \ how well your classification model is performing in terms of its ability to\
    \ predict each class correctly.\n\nIt provides detailed insight into the types\
    \ of errors the model is making:\n\nHigh values on the diagonal (TN and TP) indicate\
    \ good performance.\n\nHigh values off the diagonal (FP and FN) indicate areas\
    \ where the model is making mistakes.\n\nBy examining the confusion matrix, you\
    \ can gain a deeper understanding of your model's performance beyond what is provided\
    \ by a single metric like accuracy. This can help you identify specific areas\
    \ where the model needs improvement.\n\n# Confusion Matrix interpretation\n\n\
    Figure 3-49  shows the confusion matrix from the logistic regression model.\n\n\
    ![](OEBPS/image_rsrc568.jpg)\n\nFigure 3-49.\n\nLet's interpret this confusion\
    \ matrix:\n\nTrue Negatives (TN): 92\n\nThese are the instances where the actual\
    \ class was negative (e.g., no heart disease) and the model correctly predicted\
    \ it as negative.\n\nFalse Positives (FP): 6\n\nThese are the instances where\
    \ the actual class was negative, but the model incorrectly predicted it as positive\
    \ (e.g., predicted heart disease when there was actually none).\n\nFalse Negatives\
    \ (FN): 1\n\nThese are the instances where the actual class was positive (e.g.,\
    \ malignant tumor), but the model incorrectly predicted it as negative (e.g.,\
    \ predicted no heart disease when there was actually heart disease).\n\nTrue Positives\
    \ (TP): 106\n\nThese are the instances where the actual class was positive, and\
    \ the model correctly predicted it as positive.\n\nFrom this confusion matrix,\
    \ we can calculate several performance metrics (Accuracy, Precision, Recall, and\
    \ F1 Score)\n\nAccuracy :\n\nThe formula for accuracy is given by:\n\n![](OEBPS/image_rsrc54T.jpg)  \
    \ \n\nIn the provided example:\n\nTN = 92\n\nTP = 106\n\nFP = 6\n\nFN = 1\n\n\
    Plugging these values into the formula:\n\n![](OEBPS/image_rsrc569.jpg)\n\nThis\
    \ means the model correctly classified approximately 86.3% of the instances.\n\
    \nPrecision :\n\nThe formula for Precision is given by:\n\n![](OEBPS/image_rsrc54V.jpg)\n\
    \nIn the provided example:\n\nTP = 106\n\nFP = 6\n\nPlugging these values into\
    \ the formula:\n\n![](OEBPS/image_rsrc56A.jpg)\n\nThis means that approximately\
    \ 82.6% of the instances predicted as positive by the model were actually positive.\n\
    \nRecall :\n\nThe formula for recall is given by:\n\n![](OEBPS/image_rsrc54X.jpg)\n\
    \nIn the provided example:\n\nTP =  106\n\nFN = 1\n\nPlugging these values into\
    \ the formula:  \n\n![](OEBPS/image_rsrc56B.jpg)\n\nThis means that approximately\
    \ 93.5% of the actual positive instances were correctly identified by the model.\n\
    \nF1 Score:\n\nThe formula for F1 Score is given by:\n\n![](OEBPS/image_rsrc54Z.jpg)\n\
    \nIn the provided example:\n\nPrecision=0.9464\n\nRecall=0.9907\n\nPlugging these\
    \ values into the formula:\n\n![](OEBPS/image_rsrc56C.jpg)\n\n# Interpretation\n\
    \nAccuracy (96.59%) : Indicates that the model correctly predicted 96.59% of the\
    \ instances, reflecting a high overall correctness in its predictions.\n\nPrecision\
    \ (94.64%) : Of all the instances predicted as positive, 94.64% were actually\
    \ positive. This indicates a very low level of false positives, highlighting the\
    \ model's high reliability in making positive predictions.\n\nRecall (99.07%)\
    \ : The model correctly identified 99.07% of the actual positive instances. This\
    \ suggests a very low level of false negatives, indicating that the model effectively\
    \ captures the vast majority of positive instances.\n\nF1 Score (96.80%) : Combines\
    \ precision and recall into a single metric, providing a balanced assessment of\
    \ the model's performance. The F1 Score of 96.80% suggests a high level of performance\
    \ in balancing precision and recall, indicating the model's effectiveness in classifying\
    \ instances into their respective classes.\n\n# Model Evaluation\n\nAfter training\
    \ the machine learning model, it is important to evaluate its performance by checking\
    \ the accuracy score. The accuracy score shows how well the model fits the data\
    \ it was trained on, as illustrated in Figure 3-50.\n\n![](OEBPS/image_rsrc56D.jpg)\n\
    \nFigure 3-50.\n\n# Code Explanation\n\nThe function accuracy\\_score(y\\_test,\
    \ y\\_pred) from the scikit-learn library is used to calculate the accuracy of\
    \ a classification model. Here’s a detailed explanation:\n\nInputs:\n\ny\\_test:\
    \ This is the array of true labels for the test dataset. These labels are the\
    \ actual values that you are trying to predict.\n\ny\\_pred: This is the array\
    \ of predicted labels that the model has generated for the test dataset. These\
    \ predictions are based on the test features (X\\_test).\n\n# Model Result Interpretation\n\
    \nThe accuracy score of 0.9658536585365853 means that the model correctly predicted\
    \ the class labels for approximately 96.59%  of the instances in the dataset.\n\
    \nThis indicates that out of all the predictions made by the model, about 96.59%\
    \ were correct\n\n# Decision Tree Classification Model\n\nA Decision Tree is a\
    \ robust supervised machine learning algorithm capable of handling both classification\
    \ and regression tasks effectively. It functions by dividing the dataset into\
    \ subsets based on specific features, aiming to construct a tree-like structure\
    \ comprising decision nodes and leaf nodes. At each decision node, the algorithm\
    \ assesses a feature and determines the optimal split to either maximize information\
    \ gain or minimize impurity. This recursive process continues until the data is\
    \ appropriately segmented or a predefined stopping criterion is satisfied.\n\n\
    Decision Trees are favored for their simplicity, interpretability, and versatility\
    \ in handling both numerical and categorical data. They find widespread application\
    \ across diverse domains such as finance, healthcare, marketing, and more. Typical\
    \ uses include customer segmentation, risk assessment, and predictive modeling,\
    \ making Decision Trees a valuable tool in data-driven decision-making processes.\n\
    \nThe source code is available here: [Decision Tree Classification](https://www.google.com/url?q=https://github.com/anyasorc/appliedml/blob/main/Classification_DecisionTree.ipynb&sa=D&source=editors&ust=1720099681951804&usg=AOvVaw1jUlR3t_ElIjiug6Ky6kuw)\
    \  \n\n# Import Libraries\n\nFigure 3-51  shows all the imported required libraries\n\
    \n![](OEBPS/image_rsrc56E.jpg)\n\nFigure 3-51.\n\n# Import and View Data\n\nFigure\
    \ 3-52  shows how data was imported and viewed as seen below\n\n![](OEBPS/image_rsrc56F.jpg)\n\
    \nFigure 3-52.\n\n# Assign values to X and y\n\nX = df.iloc\\[:, :-1\\].values:\n\
    \nThis line selects all rows and all columns except the last one from the DataFrame\
    \ df and converts the result into a NumPy array. The resulting array X typically\
    \ contains the features or predictors as seen in Figure 3-52 .\n\ny = df.iloc\\\
    [:, -1\\].values:\n\nThis line selects all rows and only the last column from\
    \ the DataFrame df and converts the result into a NumPy array. The resulting array\
    \ y typically contains the target or response variable as seen in Figure 3-52\
    \ .\n\n![](OEBPS/image_rsrc54K.jpg)\n\nFigure 3-52.\n\n# Splitting into train\
    \ and test set\n\nWe need to split our dataset into training and testing sets.\
    \ We will use an 80:20 split, where 80% of the data will be used to train the\
    \ model, and the remaining 20% will be used to test it on unseen data. Figure\
    \ 3-53  illustrates this process.\n\n![](OEBPS/image_rsrc555.jpg)\n\nFigure 3-53.\n\
    \n# Standardizing the data\n\nIn the context of machine learning, particularly\
    \ when using algorithms that are sensitive to the scale of the input data, it\
    \ is common to standardize the data. Standardization transforms the data such\
    \ that it has a mean of zero and a standard deviation of one.  Figure 3-54 illustrates\
    \ how to implement it.\n\n![](OEBPS/image_rsrc54N.jpg)\n\nFigure 3-54.\n\n# Code\
    \ Explanation\n\nThe code snippet in Figure 3-54 uses the \\`StandardScaler\\\
    ` class from the \\`scikit-learn\\` library to standardize features by removing\
    \ the mean and scaling to unit variance. This process is essential for many machine\
    \ learning algorithms to perform optimally. Here's an explanation of each line:"
