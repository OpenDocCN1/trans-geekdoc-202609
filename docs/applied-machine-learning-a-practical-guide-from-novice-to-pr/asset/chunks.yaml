    \ | 71.43% |\n| 5 | Random Forest Regression | 86.12% |\n\n基于 R² 分数，支持向量回归（SVR）因其最高的\
    \ R² 值 88.70% 而被推荐，表明其性能最佳。该高 R² 值意味着 SVR 解释了 88.70% 的目标变量变异，说明 SVR 在提供准确可靠预测方面优于其他模型。\n\
    \n# 第 3 章  \n\n分类\n\n# 分类\n\n在机器学习中，分类问题涉及将数据分类到预定义的类别或类别中。主要目标是构建一个模型，从标记的训练数据中学习，并预测新的、未识别的数据点的类别或类别。这一任务在医学、金融和营销等多个领域都至关重要，因为将数据分类为不同类别有助于分析和决策。\n\
    \n分类问题可以是二分类，即只有两个类别（例如，垃圾邮件 vs. 非垃圾邮件邮件），也可以是多类分类，即有三个或更多类别（例如，在动物园中分类动物种类）。\n\
    \n# 分类模型类型\n\nLogistic Regression Model（逻辑回归模型）\n\nK-Nearest Neighbour (K-NN)\
    \ Model（k 最近邻模型）\n\nSupport Vector Machine (SVM) Model（支持向量机模型）\n\nNaïve Bayes\
    \ Model（朴素贝叶斯模型）\n\nKernel SVM Model（核支持向量机模型）\n\nDecision Tree Classification\
    \ Model（决策树分类模型）\n\nRandom Forest Classification Model（随机森林分类模型）\n\n# 分类问题描述\n\
    \n阿隆佐医院（Alonzo Hospital），一家本地医疗机构，已利用技术提升其所有部门的效率。最近，管理层决定聘请数据科学家，开发一个机器学习模型，根据患者输入解读心脏检测结果。该模型分析特定的心脏特征，例如：\n\
    \nage：患者的年龄（以年为单位）。\n\nsex：患者的性别（1 = 男性；0 = 女性）。\n\ncp：胸痛类型（0 = 典型心绞痛，1 = 不典型心绞痛，2\
    \ = 非心绞痛，3 = 无症状）。\n\ntrestbps：入院时的静息血压（mm Hg）。\n\nchol：血清胆固醇（mg/dl）。\n\nfbs：空腹血糖\
    \ > 120 mg/dl（1 = 真；0 = 假）。\n\nrestecg：静息心电图结果（0 = 正常，1 = 有 ST-T 波异常，2 = 根据 Estes\
    \ 标准显示可能或确定性左心室肥厚）。\n\nthalach：达到的最大心率。\n\nexang：运动诱发心绞痛（1 = 是；0 = 否）。\n\noldpeak：运动时相对于休息的\
    \ ST 段下降。\n\nslope：运动时 ST 段的斜率（0 = 上升，1 = 平坦，2 = 下降）。\n\n"
