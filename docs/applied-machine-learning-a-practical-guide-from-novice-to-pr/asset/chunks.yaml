- raw: 'We need to split our dataset into training and testing sets. We will use an
    80:20 split, where 80% of the data will be used to train the model, and the remaining
    20% will be used to test it on unseen data. Figure 3-25  illustrates this process.


    ![](OEBPS/image_rsrc55H.jpg)


    Figure 3-25.


    # Standardizing the data


    In the context of machine learning, particularly when using algorithms that are
    sensitive to the scale of the input data, it is common to standardize the data.
    Standardization transforms the data such that it has a mean of zero and a standard
    deviation of one. Figure 3-26 illustrates how to implement it.


    ![](OEBPS/image_rsrc54N.jpg)


    Figure 3-26.


    # Code Explanation


    The code snippet in Figure 3-5 uses the \`StandardScaler\` class from the \`scikit-learn\`
    library to standardize features by removing the mean and scaling to unit variance.
    This process is essential for many machine learning algorithms to perform optimally.
    Here''s an explanation of each line:


    sc = StandardScaler(): This line creates an instance of the \`StandardScaler\`
    class. The \`StandardScaler\` is used to standardize the features of the dataset.


    X\_train = sc.fit\_transform(X\_train):


    fit\_transform: This method first calculates the mean and standard deviation of
    the \`X\_train\` data (this is the \`fit\` part).


    It then uses these statistics to standardize \`X\_train\` by subtracting the mean
    and dividing by the standard deviation for each feature (this is the \`transform\`
    part).


    The result is that \`X\_train\` is now a standardized version of the original
    training data, where each feature has a mean of 0 and a standard deviation of
    1.


    X\_test = sc.transform(X\_test):


    transform: This method uses the mean and standard deviation calculated from the
    \`X\_train\` data to standardize \`X\_test\`.


    This ensures that the test data is transformed in the same way as the training
    data, which is crucial for the consistency of the model''s performance.


    X\_test\` is now a standardized version of the original test data, following the
    same scale as \`X\_train\`.


    Here''s a bit more detail on why standardization is important:


    Consistency: It ensures that the training and test data are on the same scale,
    which is crucial for the performance of many machine learning models.


    Algorithm Performance: Algorithms like gradient descent used in logistic regression
    or neural networks converge faster with standardized data.


    Improved Accuracy: Some algorithms, like support vector machines (SVM) and k-nearest
    neighbors (KNN), are sensitive to the scale of the data and perform better with
    standardized data.


    By using \`StandardScaler\`, you help ensure that your machine learning model
    works more effectively and consistently.


    # Training the Model


    Figure 3-27  illustrates the process of using the X\_train and y\_train datasets
    to train the machine learning model. The execution of the training process indicates
    that the model was successfully trained.


    ![](OEBPS/image_rsrc55J.jpg)


    Figure 3-27.


    # Code Explanation


    The code snippet cs = SVC(kernel=''linear'', random\_state=0); cs.fit(X\_train,
    y\_train) is used to create and train a Support Vector Classifier (SVC) with a
    linear kernel using the scikit-learn library in Python.


    cs = SVC(kernel=''linear'', random\_state=0):


    SVC is the class for creating a Support Vector Classifier.


    cs is the variable that will store the instance of the SVC.


    kernel=''linear'' specifies that the SVC should use a linear kernel. This means
    that the decision boundary between classes will be linear.


    random\_state=0 is a parameter that ensures reproducibility. It sets the seed
    for the random number generator, so the results are consistent across multiple
    runs.


    cs.fit(X\_train, y\_train):


    fit is a method used to train the model.


    X\_train is the training data containing the features (input variables) that the
    model will learn from.


    y\_train is the training data containing the target labels (output variables)
    that correspond to the features in X\_train.


    # Predicting with the test data


    Figure 3-28  below illustrates how we made predictions using the trained model
    (cs) and the test data (X\_test).


    ![](OEBPS/image_rsrc54R.jpg)


    Figure 3-28.


    # Code Explanation


    The line y\_pred = cs.predict(X\_test) is specifically using a SVM model (cs)
    to make predictions on a test dataset (X\_test). Here''s a detailed explanation
    tailored to SVM:


    cs: This is an instance of a SVM model that has been trained on your training
    data. In scikit-learn, this could be created using SVC() and then fitted to the
    training data using cs.fit(X\_train, y\_train).


    X\_test: This is the test dataset containing the features for which you want to
    predict the target variable. These features should be preprocessed similarly to
    the training data (e.g., standardized).


    predict(X\_test): This method is used to predict the class labels for the input
    data (X\_test) based on the SVM model cs.


    y\_pred is an array of predicted class labels for each observation in X\_test.
    For a binary classification problem, the values in y\_pred will be either 0 or
    1.


    # Model Evaluation


    After training the machine learning model, it is important to evaluate its performance.
    Let''s first examine the confusion matrix before considering the accuracy score
    as seen in Figure 3-29 .


    ![](OEBPS/image_rsrc55K.jpg)


    Figure 3-29.


    # Code Explanation


    The line \`cm = confusion\_matrix(y\_test, y\_pred)\` involves using the \`confusion\_matrix\`
    function from the \`scikit-learn\` library to evaluate the performance of a classification
    model. Here’s a detailed explanation:


    confusion\_matrix(y\_test, y\_pred):


    y\_test: This is the array of true class labels for the test dataset. These are
    the actual values that you are trying to predict.


    y\_pred: This is the array of predicted class labels that the model has generated
    for the test dataset. These predictions are made by the model and are based on
    the test features (\`X\_test\`).


    Confusion Matrix:


    The confusion matrix is a table that is often used to describe the performance
    of a classification model. It shows the number of correct and incorrect predictions
    made by the model compared to the actual outcomes (ground truth).


    It is a 2x2 matrix for binary classification problems, which looks like this:


    \[\[TN, FP\],


    \[FN, TP\]\]


    Where:


    TN (True Negative): The number of correctly predicted negative class instances
    (actual negative and predicted negative).


    FP (False Positive): The number of incorrectly predicted positive class instances
    (actual negative but predicted positive).


    FN (False Negative): The number of incorrectly predicted negative class instances
    (actual positive but predicted negative).


    TP (True Positive): The number of correctly predicted positive class instances
    (actual positive and predicted positive).


    # Interpreting the Confusion Matrix


    The confusion matrix helps you understand how well your classification model is
    performing in terms of its ability to predict each class correctly.


    It provides detailed insight into the types of errors the model is making:


    High values on the diagonal (TN and TP) indicate good performance.


    High values off the diagonal (FP and FN) indicate areas where the model is making
    mistakes.


    By examining the confusion matrix, you can gain a deeper understanding of your
    model''s performance beyond what is provided by a single metric like accuracy.
    This can help you identify specific areas where the model needs improvement.


    # Confusion Matrix interpretation


    Figure 3-30  shows the confusion matrix from the logistic regression model.


    ![](OEBPS/image_rsrc55M.jpg)


    Figure 3-30.


    Let''s interpret this confusion matrix:


    True Negatives (TN): 74


    These are the instances where the actual class was negative (e.g., no heart disease)
    and the model correctly predicted it as negative.


    False Positives (FP): 24'
