- raw: "# Code Explanation\n\nSimpleImputer(missing\\_values=np.nan, strategy='mean')\n\
    \nmissing\\_values=np.nan: This parameter specifies that the missing values to\
    \ be imputed are represented by np.nan\n\nstrategy='mean': This parameter specifies\
    \ that the missing values should be replaced with the mean value of the respective\
    \ column.\n\nimp.fit(X\\[:, \\[0, 2, 3\\]\\])\n\nX\\[:, \\[0, 2, 3\\]\\]: This\
    \ selects all rows and the columns at index positions 0, 2, and 3 from the array\
    \ X. These columns are assumed to be numerical.\n\n.fit(...): This method calculates\
    \ the mean value of each selected column based on the non-missing values and stores\
    \ these mean values for later use.\n\nnp.set\\_printoptions(precision=2)\n\nThis\
    \ function configures how NumPy arrays are displayed. Here, it sets the precision\
    \ of the printed output to 2 decimal places.  \n\nX\\[:, \\[0, 2, 3\\]\\] = imp.transform(X\\\
    [:, \\[0, 2, 3\\]\\])\n\nX\\[:, \\[0, 2, 3\\]\\]: Again, this selects all rows\
    \ and the columns at index positions 0, 2, and 3 from the array X.\n\nimp.transform(...):\
    \ This method replaces the missing values in the selected columns with the mean\
    \ values calculated during the .fit(...) step.\n\nX\\[:, \\[0, 2, 3\\]\\] = ...:\
    \ This assignment updates the selected columns in the original array X with the\
    \ transformed data where missing values have been replaced.\n\n# ColumTransformer\
    \ and OneHotEncoder()\n\nMachine learning models do not inherently understand\
    \ text or categorical features. Therefore, there is a need to convert these features\
    \ into numerical representations that the models can process. This is why we need\
    \ to convert the categorical variables at index positions 1 (Sex), 4 (Smoker),\
    \ and 5 (Region), as depicted in Figure 2-57 . To accomplish this, we will utilize\
    \ ColumnTransformer and OneHotEncoder, as illustrated in Figure 2-60 .\n\n![](OEBPS/image_rsrc53X.jpg)\n\
    \nFigure 2-60.\n\n# Code Explanation.\n\nColumnTransformer : A class from the\
    \ sklearn.compose module that applies different preprocessing transformations\
    \ to different columns of a dataset.\n\nOneHotEncoder : A class from the sklearn.preprocessing\
    \ module that converts categorical features into a format that can be provided\
    \ to machine learning algorithms to do a better job in prediction.\n\nnp : This\
    \ is the commonly used alias for the NumPy library, which is useful for array\
    \ operations.\n\nCreating an Instance of ColumnTransformer\n\n![](OEBPS/image_rsrc52X.jpg)\n\
    \nColumnTransformer(...) :\n\nThis initializes a ColumnTransformer object to apply\
    \ specified transformations to specific columns.\n\ntransformers=\\[('encoder',\
    \ OneHotEncoder(), \\[1, 4, 5\\])\\] :\n\n'encoder': The name given to this transformer.\
    \ It can be any string.  \n\nOneHotEncoder(): This specifies that we are using\
    \ the OneHotEncoder for the transformation.\n\n\\[1, 4, 5\\]: This list specifies\
    \ the indices of the columns to be transformed. Here, columns at index positions\
    \ 1, 4, and 5 will be one-hot encoded.\n\nremainder='passthrough' :\n\nThis parameter\
    \ specifies what should be done with the columns that are not explicitly transformed.\
    \ 'passthrough' means that these columns will be left unchanged and included in\
    \ the output.\n\n# Splitting into train and test set\n\nWe need to split our dataset\
    \ into training and testing sets. We will use an 80:20 split, where 80% of the\
    \ data will be used to train the model, and the remaining 20% will be used to\
    \ test it on unseen data. Figure 2-61  illustrates this process.\n\n![](OEBPS/image_rsrc53Y.jpg)\n\
    \nFigure 2-61.\n\n# Code Explanation\n\ntrain\\_test\\_split : This is a function\
    \ from the sklearn.model\\_selection module in the scikit-learn library. The function\
    \ is used to split the dataset into training and testing sets. X\\_train and y\\\
    _train are used to train the model. X\\_test and y\\_test are used to evaluate\
    \ the model's performance on unseen data\n\nComponents of the Function Call :\n\
    \nX: This is the feature matrix (input variables). It contains the independent\
    \ variables or predictors.\n\ny: This is the target vector (output variable).\
    \ It contains the dependent variable or response.\n\ntest\\_size=0.2: This parameter\
    \ specifies the proportion of the dataset to include in the test split. Here,\
    \ 0.2 means 20% of the data will be used for testing, and the remaining 80% will\
    \ be used for training.\n\nrandom\\_state=0: This parameter controls the shuffling\
    \ applied to the data before splitting. Passing an integer ensures reproducibility\
    \ of the split, meaning the same data split will occur every time you run the\
    \ code with this random\\_state value.\n\nOutput of the Function Call :\n\nX\\\
    _train: This is the training subset of the feature matrix. It contains 80% of\
    \ the rows from X.\n\nX\\_test: This is the testing subset of the feature matrix.\
    \ It contains the remaining 20% of the rows from X.\n\ny\\_train: This is the\
    \ training subset of the target vector. It contains the corresponding 80% of the\
    \ rows from y that match the rows in X\\_train.\n\ny\\_test: This is the testing\
    \ subset of the target vector. It contains the corresponding 20% of the rows from\
    \ y that match the rows in X\\_test.\n\nBy using a test\\_size of 0.2, we ensure\
    \ that 20% of the data is reserved for testing, which helps in assessing how well\
    \ the model generalizes to new data. The random\\_state ensures that the data\
    \ split is reproducible, providing consistency in results across multiple runs.\n\
    \n# Training the model\n\nFigure 2-62  illustrates how the X\\_train and y\\_train\
    \ datasets were used to train the machine learning model. The execution indicates\
    \ that the model was successfully trained.\n\n![](OEBPS/image_rsrc53Z.jpg)\n\n\
    Figure 2-62.\n\n# Code Explanation\n\n![](OEBPS/image_rsrc540.jpg)\n\nDecisionTreeRegressor(random\\\
    _state=0): This line creates an instance of the DecisionTreeRegressor class.\n\
    \nrandom\\_state=0: This parameter sets the random seed for reproducibility. By\
    \ fixing the random state, the same results will be obtained each time the code\
    \ is run, which is useful for consistency in testing and debugging.\n\ndt.fit(X\\\
    _train, y\\_train): This line fits the Decision Tree Regressor model to the training\
    \ data.\n\nX\\_train: This represents the training data features (input variables).\n\
    \ny\\_train: This represents the training data target (output variable or labels).\n\
    \n# Predicting with the test data\n\nFigure 2-63  below illustrates how we made\
    \ predictions using the trained model (dt) and the test data (X\\_test).\n\n![](OEBPS/image_rsrc541.jpg)\n\
    \nFigure 2-63.\n\n# Code Explanation\n\ndt.predict(X\\_test): This line uses the\
    \ trained Decision Tree Regressor model (dt) to make predictions on the test data\
    \ (X\\_test).\n\nX\\_test: This represents the test data features (input variables)\
    \ for which predictions are to be made.\n\nThe predicted target values for the\
    \ test data are stored in the variable y\\_pred.\n\n# Model Evaluation\n\nAfter\
    \ training the machine learning model, it is important to evaluate its performance\
    \ by checking the R² score. The R² score indicates how well the model fits the\
    \ data it was trained on, as demonstrated in Figure 2-64.\n\n![](OEBPS/image_rsrc542.jpg)\n\
    \nFigure 2-64.\n\n# Code Explanation\n\nr2\\_score is a function from the sklearn.metrics\
    \ module in the scikit-learn library. It is used to evaluate the performance of\
    \ a regression model by calculating the R-squared (R²) metric, also known as the\
    \ coefficient of determination.\n\ny\\_test represents the actual target values\
    \ for the test dataset. These are the true values that the model is trying to\
    \ predict.\n\ny\\_pred represents the predicted target values generated by the\
    \ regression model for the test dataset.\n\n# Model Result Interpretation\n\n\
    An R² value of 0.7142644756791616 indicates that the regression model captures\
    \ a substantial portion of the variance in the target variable. This means that\
    \ approximately 71.43%  of the variability in the target variable can be explained\
    \ by the input features used in the model.\n\nDespite the model's reasonable performance,\
    \ there is still room for improvement. Further analysis and refinement may be\
    \ necessary to enhance its predictive capabilities and capture more of the variability\
    \ in the target variable.\n\n# Let’s make a prediction"
