    \n# 模型结果解释\n\n输出值 0.8536585365853658 表示 SVM 模型的准确率约为 85.37%。\n\n这意味着模型预计能够正确分类或预测约\
    \ 85.37% 的数据集中的实例标签。\n\n# 朴素贝叶斯模型\n\n朴素贝叶斯模型是一种广泛使用的机器学习算法，在各种业务应用的分类问题中表现出色。\n\
    \n源代码可在此查看：[朴素贝叶斯](https://www.google.com/url?q=https://github.com/anyasorc/appliedml/blob/main/Classification_Naive_Bayes.ipynb&sa=D&source=editors&ust=1720099681904460&usg=AOvVaw1J0E1CddrbepIsfw_kJOTx)\
    \  \n\n# 导入库\n\n图 3-32 显示了所有导入的必要库：\n\n![](img/image_rsrc55U.jpg)\n\n图 3-32。\n\
    \n# 导入并查看数据\n\n图 3-33 显示了数据导入和查看的过程：\n\n![](img/image_rsrc55V.jpg)\n\n图 3-33。\n\
    \n# 赋值给 X 和 y\n\nX = df.iloc\\[:, :-1\\].values：\n\n这行代码选择 DataFrame df 的所有行和除最后一列外的所有列，并将结果转换为\
    \ NumPy 数组。得到的数组 X 通常包含特征或预测器，如图 3-34 所示。\n\ny = df.iloc\\[:, -1\\].values：\n\n\
    这行代码选择 DataFrame df 的所有行和仅最后一列，并将结果转换为 NumPy 数组。得到的数组 y 通常包含目标或响应变量，如图 3-34 所示。\n\
    \n![](img/image_rsrc54K.jpg)\n\n图 3-34。\n\n# 分割训练集和测试集\n\n我们需要将数据集划分为训练集和测试集。这里采用\
    \ 80:20 的比例，即 80% 的数据用于训练模型，剩余 20% 用于在未见数据上进行测试。图 3-35 说明了这一过程。\n\n![](img/image_rsrc555.jpg)\n\
    \n图 3-35。\n\n# 数据标准化\n\n在机器学习中，尤其是使用对输入数据尺度敏感的算法时，通常会对数据进行标准化。标准化将数据转换为均值为 0、标准差为\
    \ 1 的形式。图 3-36 展示了如何实现。\n\n![](img/image_rsrc54N.jpg)\n\n图 3-36。\n\n# 代码解释\n\n\
    图 3-36 中的代码片段使用 scikit-learn 库的 `StandardScaler` 类来标准化特征，即去除均值并缩放到单位方差。这一步对于许多机器学习算法的最优性能至关重要。以下是每行的解释：\n\
    \nsc = StandardScaler()：创建 `StandardScaler` 类的实例。`StandardScaler` 用于标准化数据集的特征。\n\
    \nX_train = sc.fit_transform(X_train)：\n\n`fit_transform` 方法首先计算 `X_train` 数据的均值和标准差（即\
    \ `fit` 部分）。\n\n随后，使用这些统计量对 `X_train` 进行标准化：对每个特征减去均值并除以标准差。\n\n结果是 `X_train`\
    \ 变为标准化后的版本，每个特征的均值为 0，标准差为 1。\n\nX_test = sc.transform(X_test)：\n\n`transform`\
    \ 方法使用从 `X_train` 计算得到的均值和标准差，对 `X_test` 进行标准化。\n\n这确保了测试数据与训练数据在相同的尺度上进行变换，这对于模型性能的一致性至关重要。\n\
    \nX_test 现在是标准化后的原始测试数据，与 `X_train` 具有相同的尺度。\n\n此外，标准化的重要性如下：\n\n一致性：确保训练数据和测试数据在相同的尺度上，这对许多机器学习模型的表现至关重要。\n\
    \n算法性能：如逻辑回归中的梯度下降或神经网络中的梯度下降，标准化能加速收敛。\n\n模型准确性：某些算法（如支持向量机（SVM）和 k 近邻（KNN））对数据尺度敏感，标准化后性能更好。\n\
    \n通过使用 `StandardScaler`，可以帮助确保机器学习模型更有效、更一致地工作。\n\n# 训练模型\n\n图 3-37 展示了使用 X_train\
    \ 和 y_train 数据集训练机器学习模型的过程。执行训练过程表明模型已成功训练。\n\n![](img/image_rsrc55W.jpg)\n\n\
    图 3-37。\n\n# 代码解释\n\ncs = GaussianNB()：\n\nGaussianNB 是用于创建高斯朴素贝叶斯分类器的类。\n\ncs\
    \ 是用于存储高斯朴素贝叶斯分类器实例的变量。\n\n高斯朴素贝叶斯分类器假设特征服从正态（高斯）分布。\n\n"
