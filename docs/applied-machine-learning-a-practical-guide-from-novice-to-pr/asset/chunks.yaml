    \n-   [y_test 表示测试数据集的真实目标值，即模型试图预测的实际值。]\n\n-   [y_pred 表示回归模型为测试数据集生成的预测目标值。]\n\
    \n# 模型结果解释\n\nR² 值为 0.8869590298175918，约为 88.70%，这表明 SVR 模型表现非常出色，能够捕获目标变量的大部分变异。\n\
    \n这表明模型对给定的回归问题有效且准确，能够基于输入特征提供可靠的预测。\n\n# 让我们进行预测\n\nFigure 2-51  下面的图示了使用已训练机器学习模型进行预测的过程。预测时需要提供以下特征：sex、smoker、region、age、BMI、children\
    \ 数量，这些特征与模型训练时使用的特征相同。\n\n这些特征作为输入传递给 predict 方法，模型据此返回基于这些特征的预测目标变量值。\n\n![](img/image_rsrc53R.jpg)\n\
    \nFigure 2-51.\n\n# 决策树回归\n\n决策树回归是一种强大且广泛使用的机器学习技术，用于解决回归问题。其简洁性、可解释性以及捕获复杂关系的能力，使其在需要精确数值预测的各种领域中成为有价值的工具。\n\
    \n使用以下链接下载数据集：[保险数据集](https://www.google.com/url?q=https://www.kaggle.com/datasets/awaiskaggler/insurance-csv&sa=D&source=editors&ust=1720099681775664&usg=AOvVaw1E2aDWzbH0fM19H9MRpxm9)\
    \ 。源代码在此：[决策树回归](https://www.google.com/url?q=https://github.com/anyasorc/appliedml/blob/main/Master_Class_Decision_Tree_Medical_Insurance%2520\\\
    (1\\).ipynb&sa=D&source=editors&ust=1720099681776132&usg=AOvVaw24p7irzhaxnJ2mjY2KLZfZ)\
    \ \n\n# 导入库\n\nFigure 2-52  显示了所有必要的导入库。\n\n![](img/image_rsrc53S.jpg)\n\nFigure\
    \ 2-52.\n\n# 导入并查看数据\n\nFigure 2-53  展示了如何导入并查看数据。\n\n![](img/image_rsrc53T.jpg)\n\
    \nFigure 2-53.\n\n# 计算 'region' 列中唯一值的频率\n\n代码 `df.region.value_counts()` 计算 DataFrame\
    \ `df` 中 `region` 列每个唯一值的出现次数，显示每个地区出现的次数。同样，也可以对 `smoker` 特征使用该方法，如 Figure 2-54\
    \ 所示。\n\n![](img/image_rsrc53U.jpg)\n\nFigure 2-54.\n\n# 检查缺失值\n\n代码 `df.isna().sum()`\
    \ 是一系列方法的组合，用于计算 DataFrame `df` 每列的缺失值（NaN）总数，如 Figure 2-55 所示。\n\n![](img/image_rsrc53V.jpg)\n\
    \nFigure 2-55.\n\n# 为 X 和 y 赋值\n\n-   [X = df.iloc[:, :-1].values：该行选取 DataFrame\
    \ `df` 的所有行和除最后一列之外的所有列，并将结果转换为 NumPy 数组。得到的数组 X 通常包含特征或预测器，如 Figure 2-56 所示。]\n\
    \n-   [y = df.iloc[:, -1].values：该行选取 DataFrame `df` 的所有行和仅最后一列，并将结果转换为 NumPy\
    \ 数组。得到的数组 y 通常包含目标或响应变量，如 Figure 2-56 所示。]\n\n![](img/image_rsrc529.jpg)\n\n\
    Figure 2-56.\n\n# 查看 X 中的数据\n\n在新建代码单元格中输入并运行 `X` 以查看分配给 X 的数据，如 Figure 2-57 所示。y\
    \ 也可以同理查看。\n\n![](img/image_rsrc52T.jpg)Figure 2-57: 我已为列标记其对应的索引位置：第一列 Age 位于索引\
    \ 0；第二列 Sex 位于索引 1；第三列 BMI 位于索引 2；第四列 Number of Children 位于索引 3；第五列 Smoker 位于索引\
    \ 4；第六列 Region 位于索引 5。\n\n# 处理缺失值（NaN）\n\n处理缺失值对于数值特征/列是相关的，如 Figure 2-58 所示。我们选择了索引位置为\
    \ 0、2、3 的特征/列，即 Age、BMI 和 Number of Children，如 Figure 2-57 所示。\n\n![](img/image_rsrc53W.jpg)\n\
    \nFigure 2-58. `X[:, [0, 2, 3]]` 表示“选择所有行和索引位置 0、2、3 的列”。因此，`X[:, [0, 2, 3]]`\
