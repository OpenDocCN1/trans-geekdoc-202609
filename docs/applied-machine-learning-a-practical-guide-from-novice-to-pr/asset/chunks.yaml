    \ X_test 的预测目标值，已转换回 y 的原始尺度。]\n\n# 模型评估\n\n训练机器学习模型后，评估其性能非常重要，常用指标是 R² 分数（R²\
    \ score）。R² 分数反映了模型在训练数据上的拟合程度，如 Figure 2-50 所示。\n\n![](img/image_rsrc53N.jpg)\n\
