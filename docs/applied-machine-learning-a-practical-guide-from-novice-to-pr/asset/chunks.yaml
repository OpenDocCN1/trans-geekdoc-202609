    `''encoder'':` The name given to this transformer. It can be any string.


    `OneHotEncoder()`: This specifies that we are using the `OneHotEncoder` for the
    transformation.


    `[1, 4, 5]`: This list specifies the indices of the columns to be transformed.
    Here, columns at index positions 1, 4, and 5 will be one-hot encoded.


    `remainder=''passthrough''`:


    This parameter specifies what should be done with the columns that are not explicitly
    transformed. `''passthrough''` means that these columns will be left unchanged
