    \ term).\n\nβ1 is the slope of the line, representing the change in Y for a one-unit\
    \ change in X.\n\nϵ is the error term, representing the unobserved factors that\
    \ affect Y but are not included in the model.\n\nNote: Simple linear regression\
    \ datasets have one independent variable and one dependent variable.\n\n# Problem\
    \ statement - Applicable in Banking, Retail, Manufacturing, etc\n\nKunle is a\
