  md: '# A Review of Machine Learning Approaches for Identification of Health-Related
    Diseases


    Muhammad Yaseen Ayub¹,*, Farman Ali Khan¹, Syeda Zillay Nain Zukhraf² and Muhammad
    Hamza Akhlaq³


    ¹ COMSATS University Islamabad, Attock Campus, Pakistan


    ² KIOS Research and Innovation Center of Excellence, Department of Electrical
    and Computer Engineering, University of Cyprus, Nicosia, Cyprus


    ³ Allama Iqbal Open University, Islamabad, Pakistan


    Abstract: The field of medicine is one of the most respected and oldest professions
    in human history. It has a direct impact on human life. The main purpose of this
    chapter is to present a brief introduction to the use of advanced computer science
    technologies like machine learning in the process of disease detection. The chapter
    also discusses different machine learning algorithms which are used in the process
    of disease detection. It also points out which algorithms give better accuracy.
    This chapter lists all major and most commonly used machine learning libraries
    to detect various life-threatening diseases. Lastly, a discussion on the future
    trends of technology which can be used in disease detection, and viral disease
    control is presented.


    Keywords: Disease Detection, IoMT, Machine Learning, Machine Learning in IoMT.


    # INTRODUCTION


    Currently, computational technologies are applied almost in every field of life.
    The medical field is considered to be one of them. During the past few years,
    a lot of research has been conducted in this domain to identify and treat diseases
    early on using machine learning approaches. Since machine learning can perform
    human cognitive functions effectively, thus it becomes a more suitable approach
    in the detection and treatment of disease. Recently, there has been lots of research
    done for the development of specialized methods in machine learning which can
    be highly accurate in the detection of a variety of diseases. However, we still
    struggle to detect and diagnose several life-threatening diseases because of the
    highly heterogeneous environment [1]. Several life-threatening diseases can be'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'treated if they are detected at early stages, as shown in Fig. (1). Thus early
    detection of disease is essential.


    ![](img/12e321fe66dd89993b17a8d73b64bd0c_157_0.png)


    Fig. (1). Early detection can save lives from fatal diseases.


    In the past few decades, a lot of research has been conducted in the development
    of Machine learning algorithms that can perform human cognitive tasks. The medical
    field has greatly benefited from it; researchers developed machine learning models
    which can accurately detect or predict diseases like tumors, cysts, pneumonia,
    etc. They use MRI and CT Scan X-ray images coupled with computer vision technologies
    to detect or predict high-risk diseases at a very early stage. Machine learning
    algorithms also work on numeric and Boolean values obtained through different
    types of sensors [2]. Through the use of machine learning, computers can mimic
    human cognitive behavior and recognize different patterns. Computers can then
    effectively detect any abnormalities in those patterns and classify whether the
    patient has a specific disease. Machine learning has two major approaches: Supervised
    Learning and Unsupervised Learning (there also exists a hybrid of these two, semi-supervised
    learning). Fig. (2) shows a pictorial representation of different types of Machine
    learning techniques.


    # Supervised Learning


    Supervised machine learning provides a labeled dataset during the training phase.
    The model learns to map an input to an output based on the examples provided during
    the training period. Examples of supervised learning are classification and logistic
    regression. Classification algorithms are used to assign a distinct label based
    on learning performed on test data. For example, a classification algorithm'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'can differently classify a dog and a cat. There are various classification
    algorithms like *Naïve Bayes*, *KNN*, *Decision Tree*, *Support Vector Machines*,
    etc. [3].


    Regression algorithms are used to estimate the relationship between the dependent
    and independent variables. They are used to predict numeric values. For example,
    many companies use linear regression models to predict costs, profit, loss, etc.
    There are several types of regression models: Linear Regression, Logistic Regression,
    Ridge Regression, Polynomial Regression, etc. [4].


    # Unsupervised Learning


    Unsupervised learning is a type of learning labeled dataset that is not provided
    to the computer. Instead, the computer finds different patterns on its own. It
    is based on pattern recognition without being provided with any target attribute,
    like in supervised learning. It finds hidden patterns and insights in data. It
    can be used when we do not have any labeled data for training and want to get
    useful insights and patterns in that data. Unsupervised learning’s example is
    clustering, where the model group data based on similarities. There are different
    types of clustering algorithms like *Partition based clustering*, *Fuzzy clustering
    algorithms*, *Model-based clustering algorithms*, *Density-based Clustering Algorithms*,
    *K-Means Clustering*, etc. [5].


    ![](img/12e321fe66dd89993b17a8d73b64bd0c_158_0.png)


    Fig. (2). Different machine learning algorithms and their uses.'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'This book chapter is organized as follows, upcoming sections in the literature
    study present details about various life-threatening diseases. A literature study
    is followed by a section that discusses various algorithms exploited for disease
    detection. It lists down algorithms used in the detection of particular diseases.
    It is then followed by a section that shows various different tools and libraries
    used for disease detection. The last section provides a conclusion and future
    trends in disease detection.


    # MOTIVATION


    Medical science directly impacts life. As the human population is growing at an
    explosive rate, we face a critical issue of resource limitation. To make disease
    detection easy, quick and affordable, we need to employ the latest artificial
    intelligence and machine learning algorithms in our current healthcare system.
    Recent research has shown that machine learning algorithms can detect diseases
    quickly and accurately. Some high-mortality rate diseases, like heart-related
    diseases, need an early diagnosis [6].


    # LITERATURE STUDY


    In the past two decades, lots of research has been done in tuning existing algorithms
    to work for the healthcare environment and developing new algorithms that specialize
    in feature extraction and perdition of different types of diseases. Research shows
    that a wide variety of diseases can be detected using machine learning techniques,
    such as brain tumors, heart-related diseases, lung cancer, liver functioning,
    Blood cancer, etc.


    Detection of disease is divided into two groups based on the method used. Some
    diseases are better and easily detected through pictorial data like X-ray images,
    CT Scans, Ultrasound, MRI scans, etc., while some diseases are not so easily detected
    through pictorial data; for them, we use specific sensors which then give us numeric
    data, which is then fed to a computer system for analysis and detection of any
    abnormalities. Sometimes a hybrid combination of both techniques is used to detect
    certain diseases. Fig. (3) shows how a machine learning-based system’s works.
    Machine learning-based systems require an input sample passed to AI or ML system,
    which analyzes it and detects any abnormalities, then gives output.


    # Heart Diseases Detection


    According to WHO, heart-related issues are the leading cause of death, with millions
    of deaths globally each year [7]. Researchers have used a wide variety of machine
    learning algorithms on heart-related abnormality detection, for example, ANN SVM
    Logistic Regression, kNN, Classification Tree Naïve Bayes, etc.'
