- pgno: 267
  md: '# Convergence Towards Blockchain-Based Patient Health Record and Sharing System:
    Emerging Issues and Challenges


    Mahendra Kumar Shrivas*, Ashok Bhansali, Hoshang Kolivand and Kamal Kant Hiran


    ¹ Department of Computer Science Engineering, O. P. Jindal University, Raigarh,
    India


    ² Faculty of Engineering and Technology, Liverpool John Moores University, Liverpool,
    England


    ³ Faculty of IT and Design, Aalborg University, Copenhagen, Denmark


    **Abstract:** The traditional technologies and digital systems of managing and
    maintaining data are inherently prone to manipulation at various levels. Ensuring
    the anonymity of the patient''s identity, the safety of the medical records, and
    preventing the patient data from accidental and intended manipulations have been
    the industry''s biggest challenges for decades. Failing to control the integrity
    of the Patient Health Records (PHRs) and Medical Health Records (MHRs) in the
    Healthcare Data Management System (HDMS)/ Healthcare Information System (HIS)
    may create challenges in identifying, diagnosing, and treating the disease and
    puts the patient at a greater risk. The frequency of healthcare data breaches,
    the magnitude of compromised records, and the financial impact rapidly increase
    with time. This chapter systematically and critically reviews the issues and challenges
    faced by various healthcare stakeholders in PHRS/MHRS-based HDMS/HIS systems.
    Blockchain powered patient health record and sharing schemes can be used to ensure
    the integrity and safety of healthcare data and share data among various healthcare
    ecosystem stakeholders using smart contracts to promote transparency, tamper-proofing,
    and consented access to data in distributed multi-stakeholder environment. This
    chapter highlights the need for post-quantum cryptography and recommendations
    for future improvements in blockchain-based patient health records and sharing
    system.


    **Keywords:** Blockchain, Distributed Ledger, Healthcare Data Management System,
    Healthcare Information System, Medical Health Records, Patient Health Record,
    Post-Quantum Cryptography, Smart Contract.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# INTRODUCTION


    The demand for quality healthcare has grown significantly not only in urban as
    well as rural areas. Modern healthcare industries are driven by privatization,
    liberalization, and globalization. Most of the new hospitals in developing economies
    are driven by public-private partnerships. Today''s healthcare industry revolves
    around data, and the data''s integrity, privacy, and truthfulness are at the center
    of the industry''s evolution, operation, and further growth. The adoption of technology
    in healthcare has been increasing significantly, and the healthcare industry is
    becoming more paperless to reduce costs and enhance their service quality and
    efficient management of healthcare-related data. The healthcare data management
    system started with paperless departmental planning records and medical items
    inventory, followed by patient billing, laboratory testing, diagnostic report,
    and pharmacy stock and billing management [1].


    The most important task is in HDMS/HIS collection of PHR/MHR data responsible,
    authentic, reliable, and secure. In Section 1, the authors tried to represent
    the healthcare ecosystem, followed by the methodology adopted in Section 2. The
    chapter discusses HDMS/HIS and its evolutions followed by the issues and challenges
    these systems face in Section 3. Section 4 explains the fundamental concepts of
    Blockchain, which can be best fit to solve the problems in data collection and
    sharing of PHR/MHR records to various healthcare stakeholders in a secure, transparent,
    and real-time manner in a distributed and multi-stakeholder environment without
    the need for any trusted third party in section 4. Section 5 discusses various
    Blockchain-based models and highlights the issues and challenges of multiple models.
    The authors presented the overall points, challenges, and recommendations for
    future improvements in Blockchain-based patient health record and sharing systems.


    # METHODOLOGY


    In this chapter, the authors adopted a systematic review-based qualitative research
    methodology. The authors followed phenomenology and explanatory research to study
    conceptual terms of healthcare, PHR/MHR, Blockchain, and DMS/HIS-related phenomena
    from the available literature. We used analysis and synthesis techniques to study
    various healthcare information systems and narrowed our focus area to Patient
    Health Records (PHRs) and Sharing Systems in HDMS/HIS, then followed successive
    refinement and implementation methodology to lay down the foundation of future
    enhancements of the Blockchain-based patient health record and sharing systems
    by highlighting the issues and challenges in the past and current such systems.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# THE HEALTHCARE DATA MANAGEMENT SYSTEM (HDMS) OR HEALTHCARE INFORMATION SYSTEM
    (HIS)


    The Healthcare Data Management System (HDMS) or Healthcare Information System
    (HIS) is useful in systematically managing records, ease of access and usage.
    It provides fast and easy information retrieval, fiscal control and financial
    planning, inventory management, efficient process management, human resource management,
    and patient clinical and diagnosis history management to enhance the quality of
    service and achieve healthcare governance excellence [2].


    # Evolution of the Health Data Management System (HDMS)/ Health Information System
    (HIS)


    The HDMS/HIS has seen a significant transformation over the last few decades from
    a paper-based record maintenance approach to computerized maintenance of records.
    The web-based systems have given liberty to access various features of HDMS/HIS
    using multiple offices over the Internet. While Cloud Computing has offered the
    Infrastructure as a Service (IaaS) model to reduce the ownership of IT infrastructures,
    and Software as a Service (SaaS) has given a standard version of HDMS/HIS at a
    low cost [3, 4]. Using Internet of Things (IoT) devices, real-time health data
    is collected, and patient health is monitored. In contrast, complex clinical trials,
    the effectiveness of medicines, diseases spread over a geographical area, mutation
    patterns, etc., can be analyzed and forecasted using big data analytics. The Blockchain
    addresses the issues of trust, security, data tempering, secure communication,
    transparency, privacy issues, well informed and authorized use of medical/health
    data using consensus. The evolution of the Health Data Management System (HDMS)/
    Health Information System (HIS), along with timelines, is given in Table 1 [5].
    The vast processing power and resources are needed to perform big data analytics.
    Supercomputers and highly reliable Cloud Computers, and it is expected that in
    the future, HDMS/HIS systems, will be using Blockchain on distributed Quantum
    networks and powerful Quantum Computers as nodes in Blockchain networks.


    Table 1. Technical Evolution of the HDMS/HIS.


    | S. No. | HDMS/HIS Approach | Timelines |

    |---|---|---|

    | 1 | Paper Based | 1793 |

    | 2 | Standalone Computer Based | 1960 |

    | 3 | Client-Server Web Based | 1990 |

    | 4 | Cloud Computing Based | 2012 |

    | 5 | Internet of Things (IoT) Based | 2012 |'
