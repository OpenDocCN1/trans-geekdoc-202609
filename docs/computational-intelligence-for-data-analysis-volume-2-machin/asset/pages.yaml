  md: '# Machine Learning Solution for Orthopedics: A Comprehensive Review


    Muhammad Imad¹,*, Muhammad Abul Hassan¹, Shah Hussain Bangash¹ and Naimullah¹


    ¹ Abasyn University, Peshawar, Pakistan


    Abstract: Bone provides support to the skeletal system, associated with joints,
    cartilage, and muscles attached to bones to help move the body and protect the
    human internal organs. Bone fracture is a common ailment in the human body due
    to external force on the bone. The structure of the bone is disturbed, which causes
    pain, frailness, and bone not functioning properly. Avulsion fracture, Greenstick
    fracture, Comminuted fracture, Compression fracture, Simple fracture, and Open
    fracture are different types of fractures. The literature presents a significant
    number of research papers covering the detection of different kinds of fractures
    (wrist, hand, leg, skull, spine, chest, etc.). There are different medical imaging
    tools available such as X-ray, Magnetic Resonance Imaging (MRI), Computed Tomography
    (CT) and ultrasound, which detect different types of fractures. This paper represents
    a review study to discuss various bone fracture detection and classification techniques
    between fracture and non-fracture bone.


    Keywords: Bone Fracture, Classification, CT, Detection, Machine Learning, MRI,
    Orthopedics, X-ray.


    # INTRODUCTION


    Medical image processing is an evolving field of science growing immensely in
    the healthcare industry because of its advancements in technology and software
    breakthroughs. It plays an essential role in disease diagnosis, improves patient
    care, and helps medical practitioners with the treatment type. Detection, assessment
    and adequate fracture care are considered important as a misdiagnosis frequently
    contributes to inadequate medical intervention, heightened frustration and expensive
    lawsuits, as described by Umadevi et al. [1]. In medical image processing, bone
    is the structural framework of the body called a skeleton, which protects the
    internal organs such as the ribs, making a shield around the heart, liver, and
    lungs, as shown in Fig. (1). The skull protects the human brain, and the'
