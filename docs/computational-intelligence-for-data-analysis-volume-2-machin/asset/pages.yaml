    # Industry 5.0 Related Challenges


    The above-mentioned technologies support to facilitate advancement in industry
    5.0 [39]. Every new idea faces a lot of challenges:


    +   - Monitoring of Peoples

    +   - Medical equipments for patients

    +   - Awareness & Education

    +   - Research for a better future

    +   - Smart hospital management system

    +   - Tele-medicine approach/Online doctors’ clinic


    Industry 5.0 will improve living standards in the entire world. Smart transportation
    using UAVs, rescue, smart hospitals and telemedicine will enhance the concept
    of smart cities. Therefore, the smart city approach is still in its infancy and
    needs major improvements. Even in developed countries, smart cities is quite new,
    but in the near future, AIoT will upgrade connectivity between peoples.


    # Using Flying Vehicles in Health Industry


    UAV’s can be utilized on the non-military side as well, which facilitates humans
    a lot. Especially in COVID-19, drones are being investigated to reduce the burden
    on healthcare professionals. However, machine learning-based UAVs are quite efficient
    to complete every task on time. Aerial vehicles can be used for monitoring and
    surveillance. Recently, UAVs have been used in the medical field to rescue someone
    by sending information to the base station. Drones have diverse applications,
    which include spraying on COVID-19 patients; installation of loudspeakers in UAV’s
    which can be used to identify threats against the entire network [40]. Furthermore,
    aerial vehicles applications are as follows:


    +   - Monitoring people for wearing masks.

    +   - Data/sample collection.

    +   - UAV-based taxi for transportation.'
