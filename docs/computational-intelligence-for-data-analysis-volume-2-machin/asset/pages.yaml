    # Current Status, Issues, and Challenges


    As far as patient medical care, prescription and administration of drugs are concerned,
    most hospitals still use paper-based file and folder systems. In the case of transfer
    patients, doctors/hospitals exchange information about the patient''s medical
    conditions. They also need detailed information about the drugs given to the patient
    during the treatment. The doctors and hospitals share this information in paper
    or images via email or file-sharing messengers.


    # Huge Data Volume and Velocity and Paper-Based Record Keeping


    The Out-Patient Department (OPD) generates massive records set daily. Recording
    these patient medical data becomes time-consuming, and the same is true in the
    In-Patient Department (IPD) case due to the vast volume and velocity of data generated.
    Patient medical record management is still paper-based, and this is a major issue
    in medical data management.


    Most hospitals do not maintain OPD patient medical records, and the medical file/folder
    and the history files are given back to the patient. They retain medical records
    of IPD patients only in paper form and rarely enter those records into the system
    by themselves because it takes extra-human time with cost. Only a few patient
    data are recorded in case of claim settlement or reimbursement by insurance companies.
    Some patient data are also recorded from paper-based records into the healthcare
    record management system as required by accreditation bodies or other international
    institutions for further medical research and clinical trials.


    # Interoperability and Data Sharing


    In most developing countries, various hospitals and clinics use different software
    systems based on availability and budget. Most hospitals stop using healthcare
    management systems over time due to the lack of local technical support from vendors,
    high costs and low-quality software systems.


    Adopting a multi-vendor health data management system is another challenge, as
    interoperability and data sharing among various systems require additional data
    formatting efforts. Country-wide or Worldwide standardization of process flow'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'and medical data set is needed. There are standards for some diseases, but
    local software vendors do not implement them, or record entry is not done correctly.
    Due to this, substantial clinical records are set lying down in paper format,
    which is exposed to fire, takes more space, and has other issues.


    The Healthcare providers, Life Science Researchers, Pharmaceutical companies,
    Patients, Doctors, and other stakeholders do not communicate in terms of real-time
    data sharing in the Healthcare Ecosystem. Interoperability among HDMS/HIS is a
    significant issue as they do not interact with each other or interact with a minimal
    scope at a low level with time-consuming technical support. For the past few decades,
    Healthcare ecosystems have faced various issues due to this and the biggest hurdle
    in innovation and research as far as patient health and public health are concerned.


    # Data Governance, Manipulation, Privacy and Security Threats


    Lack of good hospital governance and administration also contributes to the non-availability
    of clinical data in electronic forms regardless of the availability of good and
    standard healthcare record management systems in hospitals.


    Some hospitals or healthcare professionals are involved in malpractices to hide
    procedures/human mistakes or to support high-profile criminals. Patient medical
    records are sometimes counterfeited, misplaced, or destroyed to escape from law
    enforcement agencies.


    Generally, HDMS/HIS store all the data in a central database, either in the Cloud
    or on-premises, which is within reach of attackers (insiders/outsiders). Once
    the attacker gains access to the database, they can easily steal/modify healthcare
    data [6, 7].


    Privacy is a significant issue in HDMS/HIS. As data belongs to the patient, the
    patient should give their consent to use it for any purpose. The PHR data is susceptible
    in nature, and data leaks could be dangerous and life-threatening for any patient.
    Looking at the various security breaches and data hacks in multiple countries
    and hospitals, it can be concluded that current HDMSs/HISs are not secure and
    have become obsolete [8].


    # BLOCKCHAIN FUNDAMENTALS, CONCEPTS, AND FEATURES


    Satoshi Nakamoto proposed and implemented the Blockchain in 2008-09 to implement
    a crypto-currency platform called Bitcoin. The Blockchain is the most reliable
    and robust technology of the current time to implement a transparent multi-party
    system in a centralized, distributed, or hybrid environment. The'
  merge: -1
  img_proc: true
- pgno: 272
  md: 'forged entry in Blockchain is almost impossible because the block ownership
    can be traced and verified. Without the consensus of all participants, entry into
    the Blockchain is not allowed. The recorded transactional blocks in the Blockchain
    cannot be removed or altered without the consensus of all participants or 51%
    of the majority in general [9].


    The Block structure can be created as per need and specification on different
    Blockchain Platforms as per the need. A transaction is digitally signed using
    a private key. Nodes verify the digital signature using the public key. If the
    digital signature is confirmed against the private key using the public key, then
    a transaction is known to have originated from a genuine wallet address [10].


    A transaction is digitally signed using a private key. Nodes verify the digital
    signature using a public key. If the digital signature is confirmed against a
    private key using a public key, then a transaction is known to have originated
    from a genuine wallet address [11]. And then, nodes try to verify the ownership
    of the digital asset to avoid double-spending, then nodes check the Block''s authenticity
    by generating a block hash value using an approved hash function and verifying
    it against the hash value stored inside the Block. If the value matches, it is
    a genuine block; otherwise, it is fake and dropped. Upon successful ownership
    and block hash verification, the verifying node broadcasts proof of this Block
    to nodes in the Blockchain network, and after a fixed number of confirmations,
    the verified Block is added to the local copy Blockchain by all nodes using consensus
    protocol. This process of generating a new block is called mining, and the miner
    node gets rewards in terms of new Crypto-Coin or transaction fees [12].


    # Blockchain Categorization


    The Blockchain can be categorized into various types based on data accessibility
    (Public, Private, Consortium, and Hybrid), authorization model (Permissioned,
    Permissionless, and Hybrid), and Smart Contract support (Stateless, Stateful)
    [10].


    # Evolution of Blockchain Technology


    Blockchain 1.0 has seen the usage of crypto/digital currency. While using Blockchain
    2.0, we can implement smart contracts in multi-party and distributed environments
    [13]. Blockchain 3.0 focuses on applications and use-cases of Blockchain technologies
    to solve problems in various areas like good governance, voting, literacy, health,
    science, art, culture, etc. [14].


    While Blockchain 4.0 is dedicated to solving real and complex problems of Industry
    4.0 and making Blockchain usable for solving real-life problems of governments
    and enterprises.'
