  img_proc: true
- pgno: 203
  md: '# Logistic Regression (LR)


    This algorithm is used when examining data consisting of more than one variable.
    These variables are responsible for the final result [14].


    # AdaBoost (AB)


    Adaboost converts weak learners to strong learners and is one of the boosting
    algorithms utilized in machine learning algorithms. It starts by identifying the
    original information from each set and provides equal weight to every observation.
    In Li et al. study, it was reported that Adaboost could estimate the multilevel
    risk prediction of cardiovascular diseases by using precision and accuracy values
    [15].


    # Support Vector Machine (SVM)


    It is helpful to differentiate information depending on various factors or causes.
    It utilizes hyperplane as a sort of conclusion among many options. It also brings
    out information isolated by many hyperplanes, and this data was divided into portions;
    in turn, every portion was confined to a single data set. In the study by Ashtiyani
    et al., it is reported that algorithms developed with SVM are often ready to track
    the variations in a heartbeat and thus helpful in identifying cardiac arrhythmias
    [16].


    Other algorithms that come into the role are supervised algorithms and unsupervised
    algorithms. The Supervised algorithm requires predictable variables and labeled
    outcomes. For example, if it is desired to predict whether a patient is more susceptible
    to developing angioedema using amlodipine. This analysis should be performed based
    on the health data sets of patients that showed such a reaction and another group
    in which this reaction was not observed. Unsupervised learning primary variables
    are not provided, thus identifying unhidden structural layers. According to radiological
    findings, the best example of unsupervised algorithms is a characterization of
    the database of patients with myocardial infarction. Table 2 lists the algorithms
    and their use in cardiology.


    Table 2. Machine learning algorithms used in cardiology.


    | Algorithm | Description | Use |

    |---|---|---|

    | K nearest neighbour (KNN) | A machine learning and non-parametric algorithm.
    | Prediction of heart diseases. |

    | Artificial Neural Networks (ANN) | It is similar to the human cerebrum. | Predict
    the degree related to angiographic features in coronary heart diseases. |'
