- pgno: 199
  md: '![](img/12e321fe66dd89993b17a8d73b64bd0c_199_0.png)


    Fig. (2). Impact of AI on cardiology.


    In the contemporary world, AI-based approaches have become popular in preventing
    and managing cardiovascular disorders. In implementing AI-based solutions to assess
    the risk factors and detect the early signs of CVD risk, machine learning has
    gained the special spotlight. Due to this reason, applications of machine learning
    are more comprehensive in CVD diagnosis. For example, the strengths, challenges,
    and potential drawbacks faced by machine learning in the condition of cardiovascular
    risk estimation are clearly explained by Hodos et al. [4]. In another work of
    El-Saadawy et al., regression classifiers models such as SoftMax, Support Vector
    Machine (SVM), and Probabilistic Neural Network are utilized to diagnose heart
    diseases [5]. Maheswari et al. explained the cardiac classifier and models like
    a decision tree and Naive Bayes, which are helpful in heart disease prediction
    [6]. Another work of Sasko Ristov et al. [7] explained the management of cardiovascular
