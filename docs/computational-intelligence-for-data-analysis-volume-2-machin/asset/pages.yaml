    # LITERATURE REVIEW


    The researcher has worked on bone fractures and implemented numerous techniques
    for different types of bone fractures using X-ray and CT images.


    Dennis Wen-Hsiang Yap [10] presented a femur bone fracture detection method to
    analyze the trabecular texture by calculating the difference between the orientation
    map of fractured bone and the mean orientation map of healthy bone samples. The
    orientation map of the femur bone''s upper extremity is extracted and changed
    into the scalar map of difference. The Bayesian and SVM classifier is used to
    categorise the variance map.


    Martin Donnelley [11] presents a method for femur bone fracture in the X-ray image,
    consisting of several steps. In the first steps, the non-linear anisotropic diffusion
    method extracts the edge and smooths the image without losing any critical information
    from the boundary location. The second is to modify the Hough transformation to
    evaluate parameters for straight lines that better approximate the long bones''
    edges. The gradient magnitude and direction are created for the line parameters
    and illustrate irregular areas such as fractures.


    Vineta Lai Fun Lum [12] analyzes different methods for identifying bone fractures
    in an X-ray image. Gabor orientation, Markov random field, and gradient intensity
    direction are used for texture extraction. A different patient has different fractures
    in shape and size. The apps were sampled using an adaptive sampling method to
    accommodate these variations. This approach created feature maps of the same scale
    for the same bone form and feature type. Test results indicate that the usefulness
    of a procedure to improve both precision and sensitivity relies on both the quality
    of the process and the percentage of incorrect samples in the study collection.


    Jia [13] introduces a form of segmentation that describes fractured bones within
    the casting materials in an X-ray picture of a patient''s arm and reveals the
    connection between the fractured bones. This segmentation function is often complicated
    due to low contrast and high noise ratio in X-ray images generated by the casting
    materials. A geodesic model of active contour with global constraints'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'is implemented for this function. A prior form is gathered and used as our
    model''s regional limit.


    Victor Ortiz [14] presents a new deformable model based on physics to track physical
    deformations (fractures) using image matching. The model results from minimizing
    a field of deformation that simultaneously meets the constraints of an elastic
    body and a measure of local image similarity. The model gives us a scientifically
    accurate deformation area and helps us analyze the deformed material characteristics.
    This can be very helpful when examining pressures induced by the deformation of
    certain objects in their setting, in our case, the identification of skull fractures.


    Xuejing Jin [15] presents a new method for medical processing to express the different
    ranges of fractal-dimensional variations based on the multiscale fractal feature
    (D_MF). The DMF values in different regions are usually different in a medical
    image. According to D MF values, small lesions can be detected in a medical X-ray
    image. A digital X-ray fracture is applied to this process. The experimental results
    specify that the background regions have D_MF values of 0.005-0.020, the normal
    regions have D_MF values of 0.040-0.070, and the knot regions have D_MF values
    ranging between 0.100 and 0.200.


    Ravia Shabnam Parveen [16] compared two methods in this article, the Histogram
    Equalization and Contrast Limited Adaptive Histogram Equalization. Histogram equalization
    assigns pixel intensity values in the input image to provide a uniform distribution
    of intensities in the output image. CLAHE operates in the image known as tiles
    in small regions. The Adaptive Histogram Equalization function improves the contrast.
    The bilinear interpolation method is used to remove the inserted boundaries. CLAHE
    provide the same performance as the Adaptive Contrast Enhancement technique and
    overcome the limitation of HE. The result shows that the methodology of equalization
    of CLAHE works better than the process of equalization of Histogram.


    Zheng Wei [17] proposed an algorithm for fracture bone fracture extraction in
    an X-ray image, using marker-controlled watershed transform to segment X-ray fracture
    images dependent on gradient modulation and homotopy alteration. The characteristics
    of area number, region area, region centre, and a protuberant fracture image polygon
    are extracted by marker processing and area function. First, the Hough transform
    in the protuberant polygon of the X-ray fracture image identifies and removes
    shapes. The lines consist of line fractures and centerline to parallel lines.
    Finally, measure the distance between the line of separation and the axis of the
    centerline perpendicular.


    Song Tie-Rui [18] presented several descriptive image enhancement algorithms:'
