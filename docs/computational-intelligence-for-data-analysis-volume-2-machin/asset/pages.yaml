- pgno: 219
  md: '# Buzzer Sensor


    The buzzer sensor alerts the blind person about the obstacles by generating a
    voice through vibration (Fig. 5).


    ![](img/12e321fe66dd89993b17a8d73b64bd0c_219_0.png)


    Fig. (5). Buzzer sensor.


    # Jumper Wires


    The female-to-male jumper wires perfectly connect the GPIO pins on the Raspberry
    Pi directly to the breadboard. The reusable, soft, reliable, and strong jumper
    wires are easy to detect and so easy to connect and disconnect with the breadboard.
    These jumper wires are suitable and appropriate for prototyping. Each jumper wire
    Package involves 40-wires, and each wire is 300 mm long (Fig. 6).


    ![](img/12e321fe66dd89993b17a8d73b64bd0c_219_1.png)


    Fig. (6). Jumper wire.


    # Breadboard


    A breadboard is one of the most important parts of building circuits. A breadboard
    provides an extension of a single wire. There are a number of holes in the plastic
    box, arranged in a particular style. A breadboard design contains two types of
    a section called strips. Two sections are the bus strip and socket strip (Fig.
    7).'
  merge: -1
  img_proc: true
- pgno: 220
  md: '![](img/12e321fe66dd89993b17a8d73b64bd0c_220_0.png)


    Fig. (7). Breadboard.


    # Bus Strip


    Bus strips are commonly used to supply power to the circuit. It is composed of
    two columns, one for ground and the next for power voltage.


    # Socket Strip


    Socket strips are usually used to handle most of the components in a circuit.
    Typically, socket strips include two segments, and each section consists of 64
    columns and five rows. Commonly each column is connected electrically from the
    inside.


    # Power Bank


    Raspberry Pi has always required a specific amount of power as compared to a fully-fledged
    desktop PC1. Therefore, we use a battery to supply power to the device. A power
    bank can also be used to supply power to the Raspberry Pi3 (Fig. 8).


    ![](img/12e321fe66dd89993b17a8d73b64bd0c_220_1.png)


    Fig. (8). Power bank.


    # Earphone/Speaker


    The earphone/Speaker is usually used for audio feedback. In this proposed design,
    earphones warn visually impaired people about obstacles and tell the direction
    and'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'distance from the obstacles. It is better than a buzzer since it provides more
    accurate results and perception, thereby helping the person react more easily
    (Fig. 9).


    ![](img/12e321fe66dd89993b17a8d73b64bd0c_221_0.png)


    Fig. (9). Earphones.


    # Traditional Cane


    Generally, the traditional walking cane provides physical support and perception-aiding
    feedback to the user. This cane also helps prevent the user from falling and from
    a collision with obstacles. If any obstacles are detected, the cane should contact
    the objects/obstacles before the visually impaired people can decide to alter
    their direction (Fig. 10).


    ![](img/12e321fe66dd89993b17a8d73b64bd0c_221_1.png)


    Fig. (10). Traditional cane.


    # Smart/Modern Cane


    The smart walking cane is an updated form of a long cane; it consists of four
    ultrasonic sensors and one Raspberry Pi camera. The ultrasonic sensor is used
    to detect the obstacles and also to measure the distance between the smart cane
    users and the obstacles. The visual sensor (camera) is used to recognize the obstacles.
    The proposed design is also equipped with a buzzer sensor and audio feedback system
    [16].'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Proposed Device Architecture


    The device architecture consists of Raspberry Pi, Ultrasonic Sensors, Visual Sensor,
    Breadboard, Jumper Wires, Buzzer, Earphone and a power bank. A breadboard is one
    of the most important parts of establishing a circuit. Breadboard works as a bridge
    between sensors and Raspberry Pi. The jumper wires are used to connect the sensor
    indirectly to Raspberry Pi. A power bank device has mounted on the top of the
    Raspberry Pi to provide a specific amount of power compared to a fully-fledged
    desktop PC. Raspberry Pi consists of forty GPIO pins, a Memory Card, Camera Interface
    (CSI), and an HDMI port. The sensors are connected to the Raspberry Pi with the
    help of jumper wires. The Raspberry Pi and power bank are mounted on the wooden
    cane to supply power to the Raspberry Pi. The four ultrasonic sensors are connected
    to Raspberry Pi, which requires 5 voltages of power. Three out of four ultrasonic
    sensors are used to detect obstacles from three directions (front, left, and right),
    while the fourth one is used to detect potholes. The visual sensor has a resolution
    of 5 megapixels and is directly connected to the Raspberry Pi via a camera port
    to recognize the obstacles from the front side. The buzzer sensor is connected
    to the Raspberry Pi to alert the blind person about the obstacles, which require
    three voltages of power. The Earphone is used for audio feedback and transmits
    a voice message to warn the visually impaired person about the presence of obstacles
    and provides direction and distance calculation from the obstacles (Fig. 11) [17].


    ![](img/12e321fe66dd89993b17a8d73b64bd0c_222_0.png)


    Fig. (11). Smart cane for the proposed system.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Deep Convolutional Neural Network


    Deep learning has many uses in many areas for classification, segmentation and
    detection of model data. Deep learning is a sub-branch of the machine learning
    field, inspired by the structure of the brain [18].


    The deep Convolutional Neural Network (CNN) based AlexNet architecture is used
    to detect and recognize four obstacles: Vehicles, doors, Pillars, and Stairs for
    visually impaired persons in real-time. The pre-trained model Alex-Net is used
    to extract the deep feature to classify complex images that cannot be classified
    with simple handcrafted features. The AlexNet architecture consists of eight layers,
    five are the convolutional layers and three are fully connected layers. The architecture
    consists of five convolutional layers and three fully connected layers. The first
    layer of the Alex-Net model defines the dimensions of the input image as 227x227x3.
    The intermediate five layers are the sequence convolution layer, and 3 are the
    dense layers. The Alex-Net model has been trained on the dataset consisting of
    four different classes (Fig. 12) [19].


    ![](img/12e321fe66dd89993b17a8d73b64bd0c_223_0.png)


    Fig. (12). Alex-net architecture.


    # EXPERIMENTAL RESULTS ANALYSIS


    The study represents the recognition of 4 different obstacles (Vehicles, Doors,
    Pillars and Stairs) for visually impaired people. Four different performance metrics
    were used to evaluate the proposed method: Accuracy, Recall, Precision and F1-score,
    which is given in Eqs. (1-4).


    Accuracy = (TN + TP) / (TN + TP + FN + FP) (1)


    Recall = TP / (TP + FN) (2)


    Precision = TP / (TP + FP) (3)'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'F1-Score = 2 * ((Precision * Recall)/ (Precision + Recall)) (4)


    TP, FP, TN and FN gave in Eqs. (1-4) represent the value of true positive, false
    positive, true negative, false negative, respectively.


    The accuracy, precision, recall and F1-score for the proposed system were calculated
    based on the different measurement factors. Table 1 shows that the proposed method
    achieved the best performance with an accuracy of 99.63%, a precision of 99.59%,
    a recall of 99.31%, f1-score is 99.56%.


    Table 1. Performance results obtained from pre-trained CNN models (Alex-Net).


    | Categories | Accuracy | Precision | Recall | F1-Score |

    |---|---|---|---|---|

    | Doors | 99.61% | 99.04% | 100% | 99.51% |

    | Pillars | 99.70% | 99.35% | 100% | 99.67% |

    | Stairs | 99.23% | 100% | 98.23% | 99.10% |

    | Vehicles | 100% | 100% | 100% | 100% |

    | Total | 99.63% | 99.59% | 99.31% | 99.56% |


    The proposed model is trained on a pre-trained Caffe Alex-Net model with the best
    validation accuracy. The validation accuracy of the model during training is 99.5139%
    and has a loss validation of 0.0201%, as shown in the below graph (Fig. 13).


    ![](img/12e321fe66dd89993b17a8d73b64bd0c_224_0.png)


    Fig. (13). Loss and cross-validation accuracy.'
  merge: -1
