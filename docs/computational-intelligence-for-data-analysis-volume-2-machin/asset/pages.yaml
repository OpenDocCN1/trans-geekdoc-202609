  md: '# Lung Diseases Detection


    Lung cancer is another major factor contributing to approximately 1.7 million
    deaths annually across the globe [9]. Lung cancer can be identified through X-ray
    and CT scan images of a patient’s chest. After some preprocessing on the image,
    feature extraction techniques are applied to it, like Contrast Limited Adaptive
    Histogram Equalization (CLAHE). CLAHE uses a gray-level co-occurrence matrix (GLCM)
    to extract features from the image. After feature extraction, image classification
    is performed, which is then followed by Performance Evaluation. Fig. (5) shows
    a pictorial representation of these steps. Using SVM Classifier, 96% accuracy
    is achieved.


    ![](img/12e321fe66dd89993b17a8d73b64bd0c_161_0.png)


    Fig. (5). Flow chart of a machine learning model.


    A more recent and widespread example of lung infection is pneumonia which can
    also be caused by COVID-19. Pneumonia can also be detected from X-ray or CT scans
    of a patient’s chest. Recent research has shown up to 95% accuracy in detecting
    pneumonia from chest X-rays [10].


    # Skin Disease Detection


    Due to ozone layer decomposition, skin cancer and related issues are sharply increasing,
    especially in countries with high deforestation rates. Different algorithms are
    used to classify a few most common skin diseases Algorithms like ANN, KNN, and
    Decision Tree. SVM and Random Forest are used to detect skin'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'diseases like Atopic Dermatitis, Folliculitis, Leprosy, Herpes Zoter, etc.,
    with 90% accuracy [11].


    # Brain Diseases Detection


    The brain is considered the most important and complex organ of the human body.
    The brain is the most complex organ with millions of interconnected neurons, and
    those neurons keep changing daily, forming new connections. Due to this complex
    structure of the brain, treating brain diseases like brain tumors is very difficult.
    The earliest possible brain tumor detection is required to save patients from
    brain damage and other complications [12]. In 2016, it was reported that brain
    tumor was the leading cause of cancer-related deaths among children of age group
    (0-14) in the United States. A brain tumor is also ranked the third most common
    type of cancer among teenagers [13]. Other than brain tumors, various other psychiatric
    disorders can be detected using MRI images of the brain. Various other types of
    brain-related diseases like dementia and Alzheimer’s can be detected using MRI
    scan images. Alzheimer’s is described as losing human intellectual abilities partially
    due to brain damage. It is more common in elderly people. Following machine learning
    algorithms are used in the diagnosis of Alzheimer’s, like SVM, Random forest,
    KNN, Neural Networks, etc. [14]. .


    # Liver Diseases Detection


    The liver is the largest organ in the human body weighing around 3 pounds. It
    is divided into two parts which are the left lobe and the right lobe. The basic
    function of the liver is to filter toxic elements from the body and release certain
    chemicals which assist in digestion. According to stats provided by World Health
    Organization in 2018, liver cancer is the 5th most common type of cancer in men
    [15]. Some of the common liver disorders are as follows [16]:


    +   - **Fatty liver:** Fatty liver is a condition where a large number of vacuoles
    of triglyceride fat accumulate in liver cells. There can be multiple causes of
    it, however, it is a recoverable condition.

    +   - **Hepatitis:** Hepatitis is inflammation of the liver which is generally
    caused by the virus. It is a treatable condition, but further complications of
    this disease can be fatal.

    +   - **Cirrhosis:** It is considered to be one of the most serious and common
    liver conditions. In cirrhosis where the loss of liver cells is observed. It can
    be caused by many types of liver diseases where the liver is damaged. Liver cell
    regeneration is slower than the loss of liver cells in cirrhosis.

    +   - **Liver cancer:** Liver cancer is a serious condition where abnormal growth
    is observed. There can be many types of cancer in the liver however, the most'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'common one is known as hepatocellular carcinoma (HCC). The risk of liver cancer
    is quite high in patients with cirrhosis or hepatitis.


    There are 10 parameters that are commonly used to predict liver-related diseases.
    The parameters are Age, Gender, Total Bilirubin, Direct Bilirubin, Alkine Phosphate,
    Alanine Aminotransferase, Aspartate Aminotransferase, Total Proteins, Albumin,
    Albumin and Globulin Ratio. Liver disease detection is done using supervised machine
    learning algorithms like KNN, Naïve Bayes, Random Forest, Support Vector Machine
    and Logistic Regression [17].


    # ALGORITHMS EXPLOITED FOR VARIOUS DISEASES DETECTION


    As more than one algorithm is available for detecting one disease, their accuracy
    varies a little. The main question arises of which algorithm to use for what type
    of problem. Generally, disease detection is done either by scanned images (CT,
    MRI, and X-ray) or through sensors like ECG, EEG, and Glucometers. Literature
    study shows that algorithms like Convolutional Neural Network (CNN), Recurrent
    Neural Network (RNN) and Deep Neural networks, etc., perform better on picture-based
    datasets. They are used in combination with different feature extraction methods.
    While algorithms like Random Forest, Decision tree, Extreme Gradient Boosting,
    Support Vector Machine, Logistic regression, etc., work best with numeric data.
    Fig. (6) shows that in pictorial form.


    ![](img/12e321fe66dd89993b17a8d73b64bd0c_163_0.png)


    Fig. (6). Algorithms based on classification type.'
