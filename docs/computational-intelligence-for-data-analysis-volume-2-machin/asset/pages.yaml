  md: '# LITERATURE STUDY


    IoT has interconnected patients, doctors and related equipment’s in the healthcare
    industry. However, different sensors are used to collect, send and manage the
    data. Various applications of IoT are utilized which use to tackle COVID-19. Therefore,
    IoT connects each and everything while machine learning techniques diagnose diseases
    [7]. The Internet of health things has changed the dynamics in health management.
    Federated learning is a new concept that is sub part of machine learning. This
    novel technique takes data in central servers and local devices, which makes the
    data safer in contrast with other traditional methods [8]. However, local models
    must be properly updated using 5G communication networks [9]. Protocols are designed
    while integrating 5G networks with federated learning [10]. Lightweight protocols
    are proposed to bring trust between two nodes in IoMT [11, 12].


    COVID-19 has disturbed our daily life routine, where we have to maintain social
    distancing and make people aware of vaccination [13, 14]. While, the health status
    of patients and much more information can be easily made available due to various
    advancements in IoT, cyber security, big data, AI and machine learning [15 - 19].


    In addition, UAVs are widely used during COVID-19 to send medical equipment and
    rescue operations. Also, tele-medicine is nowadays commonly utilized by doctors
    to properly advise patients. Therefore, secure routing is needed between nodes.


    # BIG DATA & AI FOR HEALTHCARE


    Artificial intelligence is making life easier for humans. Due to advanced communication
    technologies, life has become more comfortable. AI merger with big data has solved
    major problems related to healthcare. Electronic healthcare records are quite
    helpful in improving tumors to optimize treatment methods [20].


    The healthcare industry is based on data that should be authentic. Due to this,
    decision-making process will be quite efficient. The data usually flow from patients
    to doctors where to share possible information to give possible treatment.


    However, in traditional methods, the data or record cannot be preserved for a
    long period of time. While, digitalization utilizing big data analytics and artificial
    intelligence has improved the standards of technological equipment’s [21].'
