- pgno: 102
  md: '# Artificial Intelligence-Based IoT Applications in Future Pandemics


    Tarun Virmani¹,*, Anjali Sharma², Ashwani Sharma³, Girish Kumar³ and Meenu Bhati³


    ¹ School of Pharmaceutical Sciences, MVN University, Palwal, Haryana, 121105,
    India


    ² Pharmacovigilance Expert, Uttar Pradesh, India


    ³ School of Pharmaceutical Sciences, MVN University, Palwal, Haryana, 121105,
    India


    Abstract: One of the greatest issues confronting the globe now is the pandemic
    disease calamity. Since December 2019, the world has been battling with COVID-19
    pandemic. The COVID-19 crisis has made human life more difficult. Decision-making
    systems are urgently needed by healthcare institutions to deal with such pandemics
    and assist them with appropriate suggestions in real-time and prevent their spreading.
    To avoid and monitor a pandemic outbreak, healthcare delivery involves the use
    of new technologies, such as artificial intelligence (AI), the internet of things
    (IoT) and machine learning (ML). AI is reshaping the healthcare system to tackle
    the pandemic situation. AI is the science and engineering of creating intelligent
    machines to give them the ability to think, attain and exceed human intelligence.
    The advancement in the use of AI and IoT-based surveillance systems aids in detecting
    infected individuals and isolating them from non-infected individuals utilizing
    previous data. By assessing and interpreting data using AI technology, the IoT-based
    system employs parallel computing to minimize and prevent pandemic disease. In
    a pandemic crisis, the ability of ML or AI-based IoT systems in healthcare has
    provided its capacity to monitor and reduce the growth of the spread of pandemic
    disease. It has even been shown to reduce medical expenditures and enhance better
    therapy for infected individuals. This chapter majorly focuses on the applications
    of AI-based IoT systems in tracking pandemics. The ML-based IoT could be a game-changer
    in epidemic surveillance. With the proper implementation of proposed inventions,
    academicians, government officials and experts can create a better atmosphere
    to tackle the pandemic disease.


    Keywords: Artificial Intelligence, COVID-19, Healthcare, Internet of things, Machine
    learning, Pandemic.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# INTRODUCTION


    The viruses that originate from wild birds or animals are the main cause of pandemic
    diseases. The virus enters the human body through mutation. India has endured
    a wide range of epidemics and pandemics over the years. An epidemic is an uncommon
    occurrence of specific health-related problems, events, and diseases in a region
    or community. It involves a sudden, severe outbreak of a disease that pre-existed
    in the community. The term pandemic is used to describe the rapid spread of diseases
    throughout the world. Thus, there is a need to confront and eradicate the problems
    of global health along with adequate measures to prevent further transmission.
    The history has been replete with reports about cholera, smallpox, dengue, influenza,
    polio, plague, and several other diseases. Throughout history, many pandemics
    have occurred. Their control has been difficult in many instances because a functioning
    global surveillance system has not been in place. In India, Cholera had been a
    major issue throughout the 19th century, increasing death tolls each year. However,
    the influenza pandemic came later in the early 20th century [1, 2]. It has been
    reported that the primary cause of the sudden and rapid outbreaks of the disease
    is a lack of sanitation, proper public health, and malnutrition [3 - 5]. To manage
    the pandemic in India, the government and health organizations had been taken
    effective measures which are critical in controlling the pandemic [6, 7]. COVID-19,
    a recent outbreak that began in Wuhan City in December 2019, is one example of
    a pandemic. Humanity is now living in a limited area due to the pandemic situation.
    Pandemics have disrupted the normal life of humans. This situation has also influenced
    social, business, and regional activities and thus forced them to live within
    certain limits. COVID-19 was declared a worldwide pandemic based on its severity
    on January 30, 2020 [8, 9]. Recent updates on COVID-19 cases were approximately
    452 million confirmed cases, with 6.02 million deaths reported [10]. The COVID-19
    virus can be transmitted to others from infected individuals in numerous ways
    and is considered hazardous [11]. Therefore, a complete lockdown has been imposed
    throughout the country to prevent the virus from spreading further. Several countries
    have curbed their outbreaks by enforcing a strict lockdown. Still, despite a complete
    lockdown, the disease is not completely eradicated. Numerous nations have worked
    jointly on developing medicine to treat COVID-19 [12, 13]. However, as of now,
    there has been no known treatment to completely eradicate this disease. Nevertheless,
    few medicines are being investigated as prospective therapies. Moreover, the WHO
    has recommended clinical trials for the proposed medicine [14, 15]. A timely and
    accurate diagnosis of COVID-19 patients is essential to their medical treatment
    and thus helps in preventing the spread of outbreaks.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'During the worldwide crisis, the medical industry is seeking new technologies
    that can monitor and control this pandemic of the COVID-19 virus. One such technology
    is artificial intelligence (AI), which identifies patients at risk, offers them
    medical help, and controls the spread of infection in real-time. Moreover, helps
    in easily tracking the transmission of the virus. To track cases, locate disease
    clusters, diagnose COVID-19, keep records, and predict future outbreaks, an AI
    system has been effectively used [16]. Machine learning (ML) and deep learning
    (DL) are the two types of AI subfields. Both ML and DL are part of AI. ML is a
    branch of computer vision that uses algorithms to assess, make decisions, and
    learn from raw data. ML is also applicable to support medical discovery and clinical
    decisions [17]. They have limited capabilities when it comes to processing raw
    data. DL, a recent and fastest-growing subfield of machine learning, has inspired
    great global interest in the previous few years. Unlike machine learning, DL does
    not necessitate the creation of handmade features or the manual extraction of
    data. It''s a more advanced form of machine learning that allows computers to
    extract, understand, and analyze meaningful facts or information from raw data,
    then process it and make decisions based on it. Different representations of learning
    mechanisms are attempted by DL. DL assists in the abstraction of process input
    data from large-scale data by applying a multi-layered deep neural network (DNN)
    [18, 19]. Radio imaging technology, such as X-ray, clinical blood test data, and
    computed tomography (CT), are utilized to screen patients utilizing ML and AI.
    Radiological images such as CT filters and X-rays can be used by doctors to supplement
    traditional diagnosis and screening methods [20]. Internet of things (IoT) is
    the most up-to-date, popular, and advanced technology that can automate remote
    control, intelligent management, data monitoring, and management via a real-time
    network. As a result, using AI-supported IoT technology is of great importance
    to clinical medicine and particularly in the context to prevent and control the
    spread of future pandemics. Fig. (1) represents the benefits of AI and IoT in
    the field of the healthcare field.


    The IoT powered by AI allows the emulation of intelligent behavior that aids in
    decision-making with a minimum amount of human interventions. IoT systems are
    used to collect data remotely from COVID-19 patients. Healthcare workers are given
    this information to diagnose COVID-19. In addition, using the previous patient’s
    data, the software can forecast the mortality risk. AI is about devices learning
    from their experience and stored data, whereas IoT involves devices communicating
    using the internet [21 - 23]. Any device that is capable of connecting to the
    internet for transferring and monitoring data is an IoT device. IoT has gained
    traction in industry and academic disciplines, particularly in healthcare, in
    recent years. Modern healthcare systems are being transformed by the IoT revolution,
    including economic, societal, and technological implications. It is transforming
    the healthcare system from traditional to become more'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'individualized, making it easier to diagnose, treat and monitor patients easily.
    IoT is gradually becoming a critical technology in healthcare, where it is used
    in improving service quality, may help reduce costs, and provide sophisticated
    user experiences [24 - 27]. IoT can also be used to track infected patients in
    epidemic situations. This technology is designed in such a way that it may be
    enabled when a pandemic happens and provides tactics for tacking pandemic outbreaks
    as well as the ability to provide computerized data. A large initiative for early
    detection of any illness, whether irresistible or non-irresistible is crucially
    important for early treatment to save more lives. Rapid screening and detection
    methods are effective in preventing the outspread of pandemic illnesses such as
    COVID-19 [28, 29]. Control of COVID-19 by the AI-assisted IoT system is vital
    for both patients and the public. For instance, wearable devices allow people
    to keep an eye on and record their heart rate, body temperature, respiration rate,
    and other physiological parameters. The person can immediately detect abnormalities
    in their vital signs even if they are in an isolated state also [30]. This chapter
    majorly focuses on the applications of AI, IoT, and ML-based systems that are
    being used in the healthcare field, combating the epidemic, and will also be used
    for predicting and managing future pandemic diseases.


    ![](img/12e321fe66dd89993b17a8d73b64bd0c_105_0.png)


    Fig. (1). Benefits of AI and IoT in the healthcare field.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# IOT AND AI IN HEALTH CARE


    IoT refers to the interconnection of numerous sensors, devices, and other technologies.
    A dynamic analysis model calls for IoT technologies to be used to treat various
    illnesses in several medical circumstances. By incorporating IoT into healthcare
    systems, health practitioners can gain valuable data that provides insight into
    the symptoms and course of infection while also allowing for long-term consideration
