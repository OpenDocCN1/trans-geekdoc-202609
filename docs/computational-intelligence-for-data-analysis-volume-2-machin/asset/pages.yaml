  md: 'This chapter focus on the recent developments in the applications of AI in
    cardiovascular medicine, AI algorithms used in the medical field towards the disease
    or risk factors identification, complications minimized by the implementation
    of AI in cardiology, and their challenges are discussed.


    # MATERIALS AND METHODS


    +   a. Creating a Systematic Search Strategy.

    +   b. An appropriate question was constructed.

    +   c. An appropriate database Pub Med was used to explore the results.


    A research question is uncertain about a problem; hence it must be carefully analyzed
    and examined to provide better clarity. A successful work depends upon how a better
    investigator formulates the research question to solve the existing problem. A
    research question mainly compares two treatments or diseases, a suitable diagnostic
    technique, etc. [11]. The PICO (patients, interventions, comparator, and outcomes)
    is widely considered the strategy to formulate a background question.


    Following are the list of questions formulated:


    +   a. Do AI algorithms really beneficial in the prediction of risk associated
    with heart diseases?

    +   b. Can AI algorithms help to interpret the diagnostic techniques (Electrocardiogram,
    Magnetic resonance imaging, etc.) better and improve treatment outcomes?

    +   c. Finally, does integrating AI techniques in healthcare settings change the
    shift in cardiovascular risk reduction?


    Table 1. PICO included in the research question formulation.


    | Parameter | Included | Excluded |

    |---|---|---|

    | Patients (P) | Older age | Younger age (< 35 years). |

    | Intervention (I) | Influence of AI | Other technology applications like fuzzy
    systems, 5G. |

    | Comparator (C) | Cardiovascular patients | Non-cardiovascular patients |

    | Outcome (O) | AI-based effective control of cardiovascular complications | Death,
    Late diagnosis of the result, Other co-morbid patients. |


    Table 1 shows a question-searching strategy based on data obtained from Pub Med
    database that was searched with the Keywords Healthcare, Cardiology, Artificial
    Intelligence, and Algorithms till Oct 20, 2020, from the past ten years.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'Title and abstract screening were done manually. Full-text articles of these
    screened articles were further included for the inclusion and exclusion criteria.
    We included all the studies of AI, and cardiovascular complications with the age
    group above 35 years and excluded the younger age population and other technology
    applications like fuzzy systems, 5G network applications, and other co-morbid
    patients. We involved 11 studies that evaluated the use of AI to prevent cardiovascular
    complications. The structural outline of our work is shown in Fig. (3).


    ![](img/12e321fe66dd89993b17a8d73b64bd0c_201_0.png)


    Fig. (3). The search strategy included in the study.


    # ALGORITHMS USED IN CARDIOVASCULAR DISEASES


    As discussed above, a non-invasive medical decision-supporting system was developed
    using machine learning techniques to reduce the treatment costs and complexity
    involved in treatment procedures and provide an accurate diagnosis. Those are
    considered as Algorithms that are most popularly used in the prediction of heart
    diseases. Some of the most popular algorithms used in clinical applications of
    the cardiology field are discussed below:


    +   1. K- nearest neighbour (K-NN)

    +   2. Artificial neural network (ANN)

    +   3. Decision tree (DT)

    +   4. Logistic regression (LR)'
