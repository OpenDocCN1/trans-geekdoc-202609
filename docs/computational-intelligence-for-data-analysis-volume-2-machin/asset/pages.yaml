    Venkatesh Mahadevan [19] derived the correct proximal femur density by the design
    of a computer-aided detection system for 50 Indian pre and post-menopausal women
    from 2-dimensional visual, radiographic hip pictures, contrasting these findings
    with proximal femoral BMD values calculated by the Dual Energy Radiation Absorptiometry
