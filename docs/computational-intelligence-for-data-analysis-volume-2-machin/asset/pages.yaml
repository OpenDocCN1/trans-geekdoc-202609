    # Future Challenges


    In the near future, novel disease prevention and detection will be easily possible
    due to artificial intelligence. Also, the techniques can be improved by utilizing
    machine learning techniques. AIoT devices will be incorporated into the human
    body, which will give predictions regarding disease detection like heart attack,
    cancer, COVID-19 and many more. Moreover, the world is now prepared for pandemics
    like COVID-19, where people can switch their activities online easily. Although,
    UAVs will provide help to rescue and provide accurate location coordinates. Apart
    from that, deep learning, cognitive IoT and optimization techniques can be utilized
    to improve living standards in smart cities.


    # CONCLUSION


    AI-based techniques with the combination of IoT will improve connectivity in smart
    cities. Especially the use of AI-based applications increased due to COVID-19,
    where people are restricted to homes. Initially, all country governments were
    having problems; later, they converted their education, industry and everything
    online. This paper provides a detailed understating of AIoT techniques to combat
    future pandemics. Machine learning techniques are incorporated to improve applications
    related to COVID-19. The future smart cities and industry 5.0 is introduced in
    this research paper, which will improve the standard of living. Also, future challenges
    are deeply discussed at the end of the paper. In addition, E-AnthocNet hybrid
    protocol can be deployed in various applications for further innovation.


