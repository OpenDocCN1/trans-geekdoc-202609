    # ISSUES, CHALLENGES, AND RECOMMENDATIONS


    The researchers proposed a systemic approach using Blockchain to collect, store,
    retrieve, and share PHR and MHR data. However, there are various issues and challenges,
    as listed below:


    +   1. Real-time data collection is not possible in many cases due to networks,
    faulty devices, and power issues. 2. If security keys are compromised by the patient
    or custodial key service provider or key repositories, the attackers could alter
    the Blockchain data and change data blocks of PHR/MHR in the ledger. 3. To decrypt
    encrypted PHR/MHR records, the patient has to share their private key, which can
    be stolen if the health professional uses a compromised system. 4. The Pharmaceutical
    companies would also need the patient''s private key to decrypt the patient''s
    data, so they could also create a local store of private keys and PHR/MHR records
    and misuse it. 5. There is no need to share the complete PHR/MHR with all stakeholders.
    6. Blockchain offers better transparency, trust, tamper-proofing, consensus, and
    security, but it has another set of challenges and issues [21] which can be addressed
    by adopting the recommended best practices of Shrivas et al. [13]. 7. Due to the
    invention of Quantum Computing, the entire Blockchain can be compromised, as Quantum
    computers are much faster than any known supercomputers of the current time. Most
    Blockchains and other systems, along with HDMS/HIS, use RSA-based private-public
    keys that come under pre-quantum cryptography and can easily be broken with the
    help of Quantum Computers [22, 23].


    The patient should have complete ownership of the private key, and there could
    be intelligent contracts to share selected, not all, data among healthcare providers
    and pharmaceutical companies. The Patients should have the option to securely'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'share complete PHR/MHR records with their doctors but share limited data with
    other healthcare ecosystem stakeholders. Qi Xia et al., in their research paper,
    proposed a better model for data sharing using Smart Contracts [24].


    Anyone in the healthcare ecosystem wanted to access data each time data. The patient
    should give their consent and get access to the nonfiction of data. The data should
    be shared with various parties in read-only mode. After taking permission and
    then sharing PHR/MHR each time must be mandatory and the data must be well protected.
    Post-quantum cryptography should be adopted to build such systems to ensure higher
    protection. If any breach happens, there must be disclosure and intimations to
    each stakeholder in a data breach incident. There should be a standard working
    procedure for IT and Healthcare service providers, and their legal obligation.


    There should be provision to record data in manual paper format to address real-time
    data collection in case of a faulty device, power, and network issues, which can
    be later entered into the system by either patient or any health professional
    or just scanning the paper and storing the record in image or pdf format in a
    document data store.


    The future HDMS/HIS should address the above recommendations to store and share
    PHR/MHR with various stakeholders in healthcare ecosystems. We strongly recommend
    that the suggested changes should be incorporated in current and future system
    models to increase the adoption, and the same can be implemented not only to administer
    sleep medicines but also can be generalized to administer various other medications
    to treat patients like blood pressure, sugar, HIV, malaria, cancer, etc. Future
    systems should use distributed Blockchain with post-quantum cryptography and a
    well-defined, more efficient consensus mechanism.


    # CONCLUSION


    This work details a review of the issues and challenges faced by various healthcare
    stakeholders in PHRs/MHRs-based HDMS/HIS systems. Blockchain-powered patient health
    record and sharing schemes can be used to ensure the integrity and safety of healthcare
    data and share data among various healthcare ecosystem stakeholders using smart
    contracts to promote transparency, tamper-proofing, and consented access to data
    in distributed multi-stakeholder environment. This chapter highlighted the need
    for post-quantum cryptography and recommendations for future improvements in Blockchain-based
    patient health records and sharing systems.'
