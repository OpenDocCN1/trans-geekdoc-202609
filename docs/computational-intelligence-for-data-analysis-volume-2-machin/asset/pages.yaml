  img_proc: true
- pgno: 275
  md: '![](img/12e321fe66dd89993b17a8d73b64bd0c_275_0.png)


    Fig. (2). The Blockchain-based approach to administering sleep medicine.


    1. Data Collection: The patient''s sleep behaviour data is collected from their
    wearable IoT devices. If an improper sleeping pattern is detected in Polysomnography,
    the certified laboratory report is collected per the doctor''s recommendations.
    The doctors prescribed the medicine to the patient. The doctor''s notes and the
    prescription are recorded in the Blockchain.


    2. Secure Data Storage: After data collection from various stakeholders, this
    data block is allocated relevant, unique ID and encrypted using security keys.
    After encryption, the ID and data block hash are recorded into the Blockchain,
    and the encrypted data block is stored in the Cloud.


    3. Data Request: Only ID is shared with other healthcare providers, pharmaceutical
    companies, and healthcare professionals. This ID can retrieve data block hash
    from the Blockchain, and then encrypted data is downloaded from the cloud storage.


    4. Verification, Permission, and Decryption: To download data from the Cloud storage,
    patient permission is mandatory, and after downloading encrypted data, a block
    hash is generated and verified against the data block hash stored in the Blockchain.
    The patient''s private key is needed to decrypt the data. This decrypted data
    is then represented to health professionals for future examination.


    Przytarski et al. proposed a trustworthy blueprint of a health record platform
    using IoT and Blockchain called SEAL. They primarily focused on the Authenticity,
    Confidentiality, and Integrity of data in the SEAL platform. The whole platform'
