    a deeper understanding of basic ML techniques. The main objective of this work
    is to offer an overview of existing ML approaches [8]. The major contributions
    of this survey paper are listed below:


    +   1. A novel state-of-the-art literature survey on diseases’ detection based
    on Machine and Deep Learning is presented.

    +   2. Taxonomies based on supervised, unsupervised, reinforcement, and deep learning
    are proposed.

    +   3. A critical analysis of state-of-the-art is presented in a tabular way.

    +   4. Issues and challenges concerning disease type and ML approach are presented.


    The rest of the paper is organized as follows: Section 2 presents a classification
    and taxonomy of ML approaches used in disease prediction. Section 3 details disease
    detection mechanisms, and finally, Section 4 provides the conclusion and future
    directions.


