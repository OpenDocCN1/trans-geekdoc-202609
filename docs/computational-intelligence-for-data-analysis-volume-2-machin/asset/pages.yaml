  md: '# Breakthrough in Management of Cardiovascular Diseases by Artificial Intelligence
    in Healthcare Settings


    Lakshmi Narasimha Gunturu¹,*, Girirajasekhar Dornadula² and Raghavendra Naveen
    Nimbagal³


    ¹ Scientimed Solutions Private Limited, Mumbai, Maharashtra, India


    ² Department of Pharmacy Practice, Annamacharya College of Pharmacy, Rajampeta,
    India


    ³ Department of Pharmaceutics, Sri Adichunchanagiri College of Pharmacy, Adichunchanagiri
    University, Karnataka 571418, India


    Abstract: The cardiovascular system includes the heart and its associated blood
    vessels. Disorders of this cardiac system are called Cardiovascular disorders
    (CVD). Management of CVDs is often complex due to challenges like inadequate patient
    care, readmissions, low cost-effectiveness, and cost reductions in preventions,
    treatments, and lifestyle modifications. Hence, to overcome these challenges,
    Artificial Intelligence (AI) is being developed. They addressed emerging problems
    in clinical and health care settings and had a tremendous impact on the public.
    Implementation of AI in cardiovascular medicine affects more on new findings.
    It also provides a high level of supporting evidence that may be useful within
    the evidence-based research paradigm. A review of available free full-text literature
    in the PubMed database was carried out to study the influence of AI on health
    care settings. This work reviews AI-based algorithms used in cardiac practice
    and the applications of AI in cardiovascular medicine in terms of interpretation
    of results and medical image analysis.


    Keywords: Algorithms, Applications, Artificial Intelligence, Cardiovascular Disorders,
    Healthcare.


    # INTRODUCTION


    Artificial intelligence is a technology-based approach established in the mid-1950s.
    It is the trendiest technology in the contemporary world due to the imitating
    nature of human intelligence. Artificial means discovered by humans and intelligence
    represents thinking ability. This covers the aspects like machinery/systems/algorithms
    based on beneficial results in making decisions.'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'They work like the biological brains and maximize the success ratio [1]. Artificial
    intelligence is being used for various purposes in the present world. It can solve
    complex problems efficiently in multiple industries like Healthcare, finance,
    education, agriculture, robotics.


    AI is useful in the healthcare field and used in various fields like education,
    Astronomy, Agriculture, business, Surveillance, Social media, apps, Transportation,
    Gaming, Banking, and Electronic prescriptions.


    Cardiovascular diseases (CVDs) raise death concerns globally, which accounts for
    17.9 million lives annually. CVDs constitute the pumping organ, heart, circulatory
    system like arteries, veins, capillaries, etc. Their damage may lead to fatal
    conditions, such as Coronary blockade, inflammatory conditions of heart valves
    leading to cardiomyopathy. Statistics provide data that most CVD deaths are mainly
    because of heart attacks, strokes, and nearly one-third of deaths in 70 years
    aged people (https://www.who.int/health-topics/cardiovascular-diseases). These
    are caused due to various factors like genetic, environmental, and lifestyle changes
    leading to the alteration of valuable microorganisms in the intestinal system
    of humans. The annual report of the American Heart Association (AHA) and the National
    Institute of Health confirmed possible causes for heart problems among the population
    are mentioned below:


    +   1. Cigar inhalation,

    +   2. Lack of Physical exercise,

    +   3. Inappropriate food habits,

    +   4. Weight gain,

    +   5. Cholesterol,

    +   6. Rise in systolic blood pressure (BP),

    +   7. Elevated blood sugars [2].


    There exists a two-way correlation allying technology as well as health. To explore
    the challenges among advanced and growing countries, they utilize innovation as
    a prime focus to cope with the problems. Hence technology-based approaches especially
    AI in health care, slowly drifted the entire medical system. It also transformed
    the hospitals, lives of the public. For example, they aid in interpreting results,
    lessening the test, and allowing the public to take their verdicts.'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'The use of expert systems within the cardiology department is limited to only
    some countries for various reasons; however, instead of its limitations, it finds
    very useful. Using such approaches, we can analyze the disease models efficiently,
    and also a considerable amount of data can be easily saved in the databases. Advantages
    with the integration of AI in cardiovascular settings are described in Fig. (1).


    ![](img/12e321fe66dd89993b17a8d73b64bd0c_198_0.png)


    Fig. (1). Advantages with the integration of AI in cardiovascular.


    However, this version needs several fixed hypotheses that do not depend on factors
    like observations and other multicollinearity values. The conventional logistic
    regression method improves the statistical value, but it is sometimes independent
    towards the target, therefore, obstructing the model’s execution. On the other
    side, AI algorithms are used in various clinical departments as they provide results
    exactly by using the information stored in the data sets.


    The impact of computational intelligence in cardiology clinics changed cardiac
    clinic experimentation patterns and, thus valuable for clinical practice and general
    public health, as shown in Fig. (2) [3].'
