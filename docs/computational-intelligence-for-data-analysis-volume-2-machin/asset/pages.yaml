- pgno: 25
  md: 'Due to the extensive use of wireless communication technologies, the ratio
    of cyber-attacks is increasing. While, the medical industry is the main focus
    of intruders to take information or change the data [28]. Some of the commonly
    used attacks are discussed as under:


    # DoS Attack in IoMT


    Denial of service is also called third-party attack. Due to this attack, the intruder
    tries to take full control of the network or either modify data packets. Broadcasting
    illegal data packets in a continuous pattern affects the process of the Internet
    of things [29].


    # DDoS Attack in IoMT


    Distributed denial of service attack is considered the most dangerous threat to
    every network. In DDoS, the entire cluster or group attacks another to send false
    information to create congestion and take control. DDoS is the extended version
    of a DoS attack [30].


    Some other attacks also disrupt the entire communication in IoMT, which are as
    under:


    +   - Routing Attack

    +   - False Alarm Attack

    +   - Unbalancing High Accuracy Attack

    +   - Overhead Attack

    +   - Data Traffic Attack

    +   - Unwanted Nodes Attack


    ![](img/12e321fe66dd89993b17a8d73b64bd0c_25_0.png)


    Fig. (2). Different types of attacks.'
  merge: -1
  img_proc: true
