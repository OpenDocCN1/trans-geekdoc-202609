  img_proc: true
- pgno: 130
  md: '# Wearable AI-IoT Sensors


    Wearable IoT devices have conveniently improved humans’ life. Fall detection systems
    use motion sensors that target the performance of the elderly person. Therefore,
    smart wearable clothing is introduced for integrating motion sensors in special
    clothing. However, China is having standard personal alert safety system [33].


    # AI-IoT-Based Monitoring System


    AI-IoT has advanced monitoring systems for giving optimal results. Therefore,
    on-time or early information about patient health is an important factor where
    doctors finalize the better decision. Various AI techniques are utilized which
    have detected dangerous diseases [34].


    Also, AI-based applications evaluate past history, which is helpful for giving
    optimal predictions. However, in China, AIoT-based cameras are installed everywhere
    to have better observation and people follow quarantine rules. Although, in developing
    countries, UAVs are utilized to monitor whether peoples use to wear a mask or
    not [35]. For better communication between nodes'' routing protocols, deployment
    is the best choice. Therefore, advanced routing protocols like Anthocnet, DSR,
    DSDV, ZRP, MDART and AOMDV are implemented in the topological environment of IoT-based
    FANETs. In addition, the supervised learning technique decision tree is used to
    improve signal strength from the ground base station to UAVs [36].


    Fig. (2) depicts the flow chart where AIoT based treatment approach is designed
    especially for COVID-19 patients.


    # Detection of Cyber-Attacks in IoMT


    The statistical modeling-based threshold is designed to detect DoS, DDoS and ping
    of death attacks. Therefore, the proposed intrusion detection system monitors
    data packets, creating a buffer overflow. The concept of queueing theory is implemented
    to evaluate the level of congestion in the network. Denial of service attack affects
    the entire process and sometimes jams the network. Also, novel IDS have minimized
    false alarm capabilities usually configured by network administrators [37].'
