    # IOMT APPLICATIONS


    # Medical-Smart Technology


    Devices and kits that are smart are included in this. These are now being used
    by paramedics to help people who need medical care and help right away. One way
    to do this would be to use medical drones. Because medical drones are the fastest
    to get to an emergency scene, they were first used to help people with heart attacks.
    Paramedics might not respond quickly enough because they might get stuck in traffic
    and not be able to respond quickly; this encourages intelligent medical robots
    to do surgery in a hospital. VR/AR and AI-based medical technologies were also
    used for other medical reasons. AI-based medical technologies are also used to
    ensure that they are more accurate [34 - 40].


    # Ingestible Cameras


    A patient can swallow these cutting-edge, low-cost capsules (in-vivo/in-vitro)
    to get real-time, live monitoring of their internal organs to detect chronic diseases
    and cancer early. Data recorder capsules, ingestible endoscopic optical scanning
    devices for endoscopy, and ingestible hydrogel devices are just three examples
    among many ingestible devices. X-ray or camera capsules, tracking/recording systems,
    and diagnostics toolkits are used to look at ingestible devices when they are
    being looked at [41 - 44].


    # Monitoring of Patients in Real-Time is Number (RTPM)


    As they use smart devices so much in their daily lives, this is a new trend growing
    among the younger generation, including millennials and Generation Y. As it turns
    out, RTPM monitors a patient''s health from afar. Sensors attached to the patient''s
    body are used to watch their health, either through a home health'
