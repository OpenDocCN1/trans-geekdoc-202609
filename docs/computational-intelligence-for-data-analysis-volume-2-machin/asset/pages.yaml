  md: 'Blockchain 5.0 focuses on Non-Fungible Tokens and Metaverse, while Blockchain
    6.0 will be primarily based on Quantum Blockchain, where real Blockchain distributed
    applications (DApps) would be running on Quantum Computers powered with post-quantum
    public key and hashing algorithms.


    # Transaction in Blockchain Network


    In Fig. (1) [11] high-level view of transactions in the Blockchain network is
    depicted. Someone initiates a transaction through their wallet application by
    sending the transaction to the nearest node. The node broadcasts it to a decentralized
    P2P Blockchain network. After successful verification, the miner generates one
    new Block, validated and approved by participating nodes through a consensus process.
    Upon approval, the newly generated Block updates the previous block hash value
    and is then added to the distributed Blockchain ledger.


    ![](img/12e321fe66dd89993b17a8d73b64bd0c_273_0.png)


    Fig. (1). High-level view of transaction in blockchain network.


    In the whole transaction process, reliability and security are maintained in the
    following manner:


    +   1. Submission of transaction or origination of data-source from trusted and
    authentic users. A private key is issued to the user to sign messages digitally.
    Nodes verify the digital signature of the messages against the public key to ensure
    a trusted party initiates the transaction.

    +   2. Inter-Node communication is done through remote procedure calls in peer-to-peer
    distributed Blockchain networks. The communication channel is protected using
    a secure socket layer to ensure end-to-end encryption.'
