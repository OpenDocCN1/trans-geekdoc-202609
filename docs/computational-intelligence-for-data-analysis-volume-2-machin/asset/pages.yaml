  md: '# MACHINE LEARNING CONCEPTS FOR THE INTERNET OF MEDICAL THINGS


    Machine learning techniques have played an important role in developing data and
    records more efficiently. Moreover, machine learning presented novel ideas to
    digitalize and improve computer-aided technologies [22]. The growth of mobile
    devices and the merger of the Internet of things has changed the dynamics of the
    medical field. The quality of service has solved unprecedented problems and given
    mobile medical services, including tele-medicines. Using mobile technology in
    the form of web services, patient consultation with the doctor is quite easy nowadays
    [23, 24]. Health applications like “Good Doctor Online” is utilized more for tele-medicine
    during COVID-19. Mobile data will be quite useful in the future to observe the
    needs of patients. While, for remote treatment, health expert systems provide
    many services like audio, video and short messages. Therefore, initial data will
    be taken from patients with the help of technology, and based on that, the doctor
    will give possible guidance [25].


    In healthcare engineering, following machine learning techniques can be utilized
    to solve problems.


    +   - Classification & Clustering

    +   - Prediction & Anomaly identification


    # MACHINE LEARNING-BASED APPLICATIONS FOR IOMT


    In addition, machine learning has many related applications that have improved
    healthcare standards. Some of the applications are as below:


    # Early Prediction of Illnesses


    For better treatment, three diseases, coronavirus, heart disease and diabetes
    model, are formulated in the form of an android mobile application. A supervised
    learning model is utilized for training the database on real-time data, which
    shows results in android applications. Therefore, logistic regression is used
    for the early prediction of illness [26].


    # Healthcare E-Records


    In the fourth industrial revolution, an electronic health record is an optimal
    way to save data. Medical data is so importantthat intruders can try to hijack
    the entire system, which is very dangerous for the patient. Medical healthcare
    systems are changed with the passage of time, but had vulnerabilities as well.
    Due to cyber-'
