    # AI AND IOT-ENABLED REMOTE SCREENING


    In the case of the COVID-19 outbreak, screening infected people as soon as feasible
    is a critical step in preventing and controlling the spread of the virus. Manual
    screening is indeed slow, however remote screening technologies can improve screening
    speed and efficiency. As a result, AI and IoT-based remote screening must be established.


    Schinkothe et al. 2020 [51] suggested a free AIoT-based caregiver cockpit (C19CC).
    One user is first linked to a healthcare worker, who immediately categorizes the
    individual based on the description provided. The harshness of the examinees is
    shown by color codes. COVID-19 patients, for example, are identified by red codes,
    and examinees with red codes are automatically screened out, with their biographical
    information and recent range of activity highlighted. C19CC can be utilized not
    only for remote screening but also for remote monitoring, hospital wards, and
    other applications. C19CC conducts a contact-free pre-screening of patients and
    promptly identifies those who require immediate treatment. Lung ultrasound imaging
    classifiers are utilized for screening or diagnosis of COVID-19 in addition to
    traditional remote screening approaches. Tan and Liu, 2020 [52] offer a rudimentary
    facial recognition algorithm. The major purpose of this technology is to use thermal
    imaging to remotely screen out suspect patients and then use a facial recognition
    system to recover those who have had close contact with them, to isolate people
    in time, and'
