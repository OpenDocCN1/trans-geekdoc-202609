  md: '# Internet of Medical Things & Machine Intelligence


    Inam Ullah Khan¹, Mariya Ouaissa²,*, Mariyam Ouaissa² and Sarah El Himer³


    ¹ Kings College London, London, United Kingdom

    ² Moulay Ismail University, Meknes, Morocco

    ³ Sidi Mohammed Ben Abdellah University, Fez, Morocco


    Abstract: Recently, the internet of medical things has been the widely utilized
    approach to interconnect various machines. While, IoT in combination with machine
    intelligence, has given new directions to the healthcare industry. Machine intelligence
    techniques can be used to promote healthcare solutions. The merger of IoT in medical
    things is a completely advanced approach. The intelligent behavior of machines
    provides accurate decisions, which greatly helps medical practitioners. For real-time
    analysis, artificial intelligence improves accuracy in different medicinal techniques.
    The use of telemedicine has increased so much due to COVID-19. Gathering unstructured
    data where the concept of electronic databases should be used in the health care
    industry for advancement. Big data and cyber security play an important role in
    IoMT. An intrusion detection system is used to identify cyber-attacks which helps
    to safeguard the entire network. This article provides a detailed overview of
    the internet of medical things using machine intelligence applications, future
    opportunities, and challenges. Also, some of the open research problems are highlighted,
    which gives insight into information about the internet of medical things. Different
    applications are discussed related to IoMT to improve communication standards.
    Apart from that, the use of unmanned aerial vehicles is increased, which are mostly
    utilized in rescuing and sending medical equipment from one place to another.


    Keywords: Big Data, IoMT, IoT, Machine Intelligence, UAVs.


    # INTRODUCTION


    With the development of IoT, the healthcare industry is revolutionized, where
    a massive amount of data can be transferred from one place to another. Therefore,
    IoMT is introduced to connect medical devices, which can improve decision-making
    process. Data resource management is the central point of discussion in IoMT.
    However, machine learning techniques enhance the accuracy level, which has shifted
    researcher’s attention to secure communication between node.'
