  md: 'identify the fracture. The experimental results show that the object is identified
    with a high detection rate.


    Mahmoud Al-Ayyoub [4] addresses the issue of finding X-ray fractures in the hand
    bone. Numerous methods for the pre-processing step of the image are tested. Also,
    various sets of features are computed and tested. Finally, both foundation and
    multi-level meta-classifiers are being tested. By implementing boosting and then
    bagging on the Bayesian Network classifiers, an accuracy level of 91.8% is obtained
    where the feature set includes features computed using Wavelets, Curvelets and
    GLCM.


    Vijayakumar [3] proposed a method for automatically detecting femur bone fractures
    using computerized GLCM techniques. From this approach, the existence of bone
    fracture depends on the GLCM value of the parameter extracted. The accuracy of
    the built algorithm is at least 87% achieved, which promises an efficient method
    for automatically identifying bone fractures.


    Mario Mustra [7] presented an automated CR bone alignment system that shows forearms
    and legs. The proposed method uses thresholding for optimal threshold determination
    based on Otsu''s system and Hough transform for the identification of straight-line
    segments from which the angle of rotation can be determined. This technique is
    not oriented to correct bone segmentation but rather to locating the borders of
    the bone so that it can determine the direction and angles of rotation of the
    bone. Hough transforms and the correct neighborhood within the Hough accumulator
    after defining the various levels of accuracy in angle estimation according to
    the angular resolution.


    Kazeminia [8] presents a new bone segmentation technique that pre-processes the
    image, such as noise cancellation and edge detection. The picture is denoising
    using a guided filter; then, the bone boundary is detected using a multi-and single-threshold
    canny edge detector. Rotate the image in vertical directions on the prominent
    edges to improve the borders. Then, each image row checks for strength peaks that
    match the bone edges.


    Yu Cao [9] presents the generalized detection method for bone fractures, common
    throughout the body to various bone fracture forms and structures. In a novel
    descriptive computing system named “Stacking Random Forest Fusion,” the method
    uses features derived from the nominee patches of X-ray pictures. Random forest
    learners use this method at a lower level to extract the simplified distribution
    labels at the next step in the class likelihood labeling.'
