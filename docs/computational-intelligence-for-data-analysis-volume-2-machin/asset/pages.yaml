    risk of osteoporotic fracturing. DXA''s results show that osteoporosis and osteopenia
    were 20% and 34%, respectively, of Indian women.


    Hum Yan Chai [20] proposed an automated fracture detection method for femur bone
    using GLCM techniques. The method distinguishes the bone fracture loss and appearance
    based on the parameter value of GLCM. The criterion for bone fracture absence
    and appearance is set at 0.95. A total of 86.67% of the precision of the developmental
    algorithm appears to be an effective method for the automated detection of bone
    fractures. The findings indicate that the program can produce reliable and reproducible
    results.


    Greg Wood''s [21] aim of the research was to better understand the processes underlying
    perceptual expertise in interpreting skeletal radiographs. Thirty participants
    were tested and examined for the clinical cases of different patients'' normal
    and abnormal skeletal X-rays. The result for the presented techniques shows the
    technique achieved the accurate result for the detection of skeletal.


    Umadevi [1] considered an application of ensemble classification in X-ray images
    to fracture detection. For X-ray pictures, a minimum of 12 features have been
    taken from two groups of objects, namely texture features and form characteristics.
    Three binary classification models, namely SVM, BPNN, and KNN, were built to ensemble
    classification models. The research addresses ensemble structures with two classifications
    and three classifications. During the different feature sets, classifiers were
    built.


    Nirase Fathima Abubacker [22] focuses on automated normal and abnormal skull images.
    The skull fracture throughout Digital Imaging and Communications in Medicine (DICOM)
    is observed in a simple automated method to remove the skull bone with histogram-based
    thresholds and connect the neighbouring pixel to'
