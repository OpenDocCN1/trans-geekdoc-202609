    # TECHNOLOGIES FOR HEALTHCARE SERVICE


    The Internet of Things (IoT) healthcare services use many different technologies.
    However, the proposed system explains a few technologies at the heart of medical
    assistance.


    # Cloud Computing


    If cloud computing is implemented, many cloud computing benefits come with IoT-based
    healthcare services. These features include always-on access to shared resources,
    services offered in response to network requests, and operations that meet the
    company''s needs.


    # Grid Computing


    Grid computing, also known as cluster computing, is the foundation of cloud computing.
    Grid computing makes it possible for all healthcare networks to deal with the
    computational limitations of sensor nodes spread out all over a patient''s body.


    # Big Data


    Big data collect essential health data from many different sensors all over our
    bodies. It also gives us tools that help us make the health diagnostic and monitoring
    stages and procedures more consistent.'
