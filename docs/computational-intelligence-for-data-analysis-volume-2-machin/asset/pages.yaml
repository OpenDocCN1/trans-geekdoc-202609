  md: 'values of Q that decomposes EEG signals which in turn computes Korsakov and
    Shannon entropies. Hence, detecting the seizures using a classifier named random
    forest. The other classification accuracies achieved were 86.1%, 95.6%, 92.5%
    and 84.4% for KNN, LS-SVM, Multilayer Perceptron Neural Network (MLPNN) and Naïve
    Bayes (NB), respectively.


    A highly accurate model for the categorisation of normal or seizure conditions
    for chronic brain disorders is explored by Torse et al. [27]. The models are based
