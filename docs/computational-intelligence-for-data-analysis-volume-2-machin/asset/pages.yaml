- pgno: 255
  md: '# Data Pre-Processing for the Model


    There is too much data for us to charge all of them into memory. We are able to
    use some Keras functions (we used ImageDataGenerator to do this automatically)
    to automatically process the data, generate a batch data stream from a directory
    and also manipulate the images. It is usually a good idea to manipulate the images
    with some simple parameters (Table 1), like rotation, resizing and scaling, so
    that the model becomes more robust to the different images that our dataset does
    not have, as the image in Fig. (7).


    Table 1. Configuration of the data augmentation generator.


    | Parameter | Value | Description |

    |---|---|---|

    | Rotation_range | 20 | Rotate the image 20 degrees |

    | Width_shift_range | 0.10 | Shift the pic width by a max of 5% |

    | Height_shift_range | 0.10 | Shift the pic height by a max of 5% |

    | Rescale | 1/255 | Rescale the image by normalizing it |

    | Shear_range | 0.1 | Shear means cutting away part of the image (max 10%) |

    | Zoom_range | 0.1 | Zoom in by 10% max |

    | Horizontal_flip | True | Allo horizontal flipping |

    | Fill_mode | nearest | Fill in missing pixels with the nearest filled value |


    ![](img/12e321fe66dd89993b17a8d73b64bd0c_255_0.png)


    Fig. (7). Example of automatic generation of an image.


    # Generation of many Manipulated Images from a Directory


    To use flow_from_directory, we organized the images into subdirectories. This
    is an absolute requirement, otherwise, the method will not work. The directories
    should only contain images of one class, like in Fig. (8), so one folder per image
    class.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '![](img/12e321fe66dd89993b17a8d73b64bd0c_256_0.png)


    Fig. (8). Organization of the data set into a training database and a test database.


    # Design of the Model Architecture


    For visual learning and image recognition, the CNN model, like in Fig. (9), is
    the most common and widely used machine learning algorithm.


    ![](img/12e321fe66dd89993b17a8d73b64bd0c_256_1.png)


    Fig. (9). General architecture of a convolution neural network.


    # Convolution Layer


    The convolution layer is the key component of CNN, and is always at least their
    first layer. Its objective is to identify the presence of a set of features in
    the images received as input. To do this, we perform convolution filtering: the
    principle is to “drag” a window representing the feature on the image, and to
    compute the conv-'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'olution product between the feature and each portion of the scanned image.
    A feature is then seen as a filter: the two terms are equivalent in this context.


    # Pooling Layer


    This is a subsampling operation typically applied after a convolutional layer.
    In particular, the most popular types of pooling are max and average pooling,
    where the maximum and average values are taken, respectively. Max-Pooling is a
    sample-based discretization process. Its objective is to subsample an input representation
    (image, hidden layer output matrix, etc.) by reducing its dimension. Moreover,
    its interest is that it reduces the computational cost by reducing the number
    of parameters to be learned and provides invariance by small translations (if
    a small translation does not modify the maximum of the scanned region, the maximum
    of each region will remain the same and thus the new matrix created will remain
    identical).


    # Flatten Layer


    The Flatten layer provides a connection between the convolution layers and the
    base layers of Deep Learning. It allows diffusing the data through the layers
    by reducing its dimension. The data finally reaches a prediction layer, such as
    the Dense layer, which provides the label detected by the Deep Learning model.


    # Dense Layer


    A Dense layer which is a classical neural layer, completely connected with the
    previous and the next layer. A dense output layer with one neuron per class, and
    a “softmax” activation function that gives an output probability for each neuron,
    with the output neuron with the highest probability then deciding that its associated
    class is the predicted class. Fig. (10) shows the architecture of the model used.


    # Learning and Same Parameters


    In classification tasks, it would be useful to have all outputs fall between 0
    and 1. These values can then present probability assignments for each class. There
    are 2 main types of multi-class situations: non-exclusive and mutually exclusive
    Classes. We used a configuration for the case of a 10-class exclusive classification
    problem whose code is presented in Table 2.'
