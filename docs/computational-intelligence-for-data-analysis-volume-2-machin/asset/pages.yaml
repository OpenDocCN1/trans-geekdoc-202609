  md: 'emotional state based on a specific study performed on the participants/patients
    at different emotional states using EEG BCI. Also, the researchers provide a section
    on trends and challenges in the mentioned field and emphasize the growth of the
    technology in the next decade.


    Birbaumer et al. [22] provide a complete review of the clinical application of
    BCI targeting paralyzed patients. The study is focused on locked-in syndrome as
    well as on Completely locked-in syndrome. The work also demonstrates the application
    of the Brain-machine interface on chronic stroke patients. The results have shown
    a positive response to the combination of BCI with psychiatric and clinical psychological
    issues. The authors also mention the research scope in view of improving the complex
    behavioural disorders.


    Min et al. [23] mention different types of neuroimaging BCI methods and provide
    the merits and demerits of each method. The authors in the article mention the
    trend of development of the brain-to-brain interface, where individuals are linked
    with the computer as a mediator. EEG being the popular neuroimaging method, the
    authors describe the other neuroimaging methods, such as MEG, which is associated
    with neuro activity based on magnetic fields. fMRI detects the changes in local
    cerebral blood oxygen level-dependent signal contrast. NIRS is a method employing
    a near-infrared spectrum and can penetrate the skull and investigate cerebral
    metabolism. It is the recent development technique in assessing cortical regional
    activities. The most recent development is the ultrasound Doppler imaging technique
    fTCD. The limitation of this method is in terms of penetration.


    Abbasi et al. [24] implemented EEG data parsed with Discrete Wavelet Transform
    (DWT), and each multilayer perceptron neural network characteristic is statistically
    analyzed. The proposed approach presents 98.33% accuracy in comparison to other
    models. The model is proposed to aid in the detection, diagnosis, and classification
    of epileptic seizures.


    Wang et al. [25] aimed to design a BCI system to extract features and classify
    the EEG signals accurately by employing Deep Learning Methods. The work is demonstrated
    on Convolutional Neural networks and Long-term Short-term memory networks. The
    study is focused on the data obtained from 2 women and 3 men with subjects as
    healthy, mental and right-handed students.


    Torse et al. [26] presented a detailed survey on automated seizure detection.
    Thereby laying a foundation to solve the manual detection method to diagnose epilepsy
    via manual operations. This study was conducted around various classifiers such
    as KNN, LS-SVM, Multilayer Perceptron Neural Network (MLPNN), Naïve Bayes (NB)
    and Random Forest (RF). The highest classification accuracy was achieved at 97.3%
    due to an automated system consisting of varied'
