  md: '# Cyber Secure AIoT Applications in Future Pandemics


    Maria Nawaz Chohan¹,* and Sana Nawaz Chohan²


    ¹ National Defence University, Islamabad, Pakistan


    ² Foundation University Institute of Rehabilitation Sciences, Islamabad, Pakistan


    Abstract: In the era of digitalization, artificial intelligence and IoT play an
    important role in COVID-19. Collecting real-time data using the internet of things
    has removed barriers and improved end-to-end delays between patients & doctors.
    During COVID-19, IoT connected people through wireless communication technology.
    However, by utilizing AI, different diseases can be identified easily. This research
    article has merged IoT with AI, which is called the Artificial Internet of Things
    (AIoT). Monitoring of patient health can be made possible due to the sub-class
    of AI known as machine learning. Industry 5.0 has combined big data, IoT, AI,
    5G and cognitive ICT technologies to exchange information. Due to the widespread
    of dangerous diseases, people face several challenges, including inadequate preparation,
    shortage of medicines and poor resources, and increasing death rates. Data collection
    is the initial step toward research and innovation. Therefore, many applications
    are discussed properly, which include tele-medicine, early warning systems, wearable
    devices, and UAVs that help to support the healthcare industry.


    Keywords: AI, COVID-19, IoT, UAVs.


    # INTRODUCTION


    Integration of AI & IoT has gained a lot of attention, improving standards, especially
    in the healthcare industry. Internet of things uses sensors to collect information.
    Zigbee is a contemporary protocol that is considered the backbone of IoT [1].
    Every country tried a lot to reduce COVID-19 by giving awareness using social
    and mainstream media. However, there exist many applications related to healthcare
    which include remote patient monitoring, fighting against COVID-19, heart disease
    detection, electronic medical report cards and tracking the infectious disease.
    Utilizing machine learning, doctors predict different diseases easily [2]. IoT
    enhances machine-to-machine and human-to-machine cognition to learn from'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'the environment [3]. Smart IoT-based machine learning concepts train algorithms
    to provide efficient results in the healthcare industry [4].


    Industry 5.0 will provide combined knowledge of IoT, big data, AI and 5G to give
    possible solutions regarding healthcare. While multi-kernel is used in IoT applications
    for processing better-quality images [5]. Also, smart mobile applications are
    developed to monitor the health status of every patient [6]. Moreover, telehealth
    web and mobile applications are used all over the world to give optimal consultation
    to patients [7]. Traditional server-client environments can be utilized using
    wireless body area sensor networks to provide high accuracy levels in healthcare
    applications [8, 9]. The major contribution points of this research paper are
    as under:


    +   - Artificial Internet of things applications for healthcare

    +   - Machine learning techniques for COVID-19

    +   - Industry 5.0 for smart healthcare systems

    +   - Using flying vehicles in the health industry

    +   - People’s facing challenges because of future pandemics


    This research article has diverse studies about AIoT, machine learning techniques,
    industry 5.0, UAVs and future challenges because of pandemics. Fig. (1) shows
    wireless body area IoT sensor nodes connectivity with mobile devices using the
    internet for tele-medicines.


