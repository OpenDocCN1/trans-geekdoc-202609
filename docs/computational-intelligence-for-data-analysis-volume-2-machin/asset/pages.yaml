    # SAFEGUARDING IOMT FROM CYBER-ATTACKS


    Wearable devices will be utilized in the near future to collect data from humans
    and send information to the external device. The data or information can either
    be viewed by using a laptop or computer or might be mobile. Emergency response
    sensors can be deployed at home or the workplace to monitor emergencies and send
    locations to the base station. The entire information can be viewed through web
    applications or mobile devices. Mobile applications are developed to facilitate
    patients for proper and timely medication. For this purpose, sometimes an alert
    message is sent to the mobile device of the patient.


    Internet of medical things architecture is divided into three phases which include:


    +   - Wireless Body Area Sensor Networks

    +   - Wireless Personal Area Network

    +   - Wireless Wide Area Network

    +   - Medical Server (Laptop or Mobile)

    +   - Emergency Service Provider'
