- pgno: 14
  md: '# FOREWORD


    The COVID-19 pandemic has shed light on the importance of having a more efficient
    healthcare system. In the era of Industry 4.0, Artificial Intelligence and the
    Internet of Things have introduced themselves today as must-have technologies
    in almost every sector, including healthcare.


    This book introduces an emerging yet interesting concept, the Internet of Medical
    Things (IoMT). It refers to an infrastructure of highly connected healthcare devices
    that can communicate and share data to optimize different medical actions and
    interventions. The book goes further into suggesting solutions that can provide
    better performance and security for the Internet of Medical Things.


    Moreover, this book presents different successful case studies of combinations
    of IoMT with Artificial Intelligence and their application in different medical
    use cases, such as preventing future pandemics, optimizing brain tumor detection,
    obstacle detection for visually impaired patients, etc.


    In its last chapter, this book offers an opening to further development in the
    IoMT area by exploring the possibilities offered by Blockchain technology in securing
    medical data.


    This book aspires to provide a relevant reference for students, researchers, engineers,
    and professionals working in the IoMT area, particularly those interested in grasping
    its diverse facets and exploring the latest advances in IoMT.


    **Yassine Maleh**

    Sultan Moulay Slimane University

    Beni Mellal

    Morocco'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# PREFACE


    The growing development in the field of computing has encouraged the integration
    of a variety of sophisticated devices inside houses and facilities. These devices
    communicate with each other to help users in particular situations and according
    to their needs, such as safety, comfort, and even health. The devices form an
    object connection environment known as the Internet of Things (IoT). Healthcare
    professionals are now embracing the Internet of Medical Things (IoMT), which refers
    to a connected infrastructure of devices and software applications that can communicate
    with various healthcare IT systems. One of these technologies — Remote Patient
    Monitoring — is commonly used for the treatment and care of patients.


    Often associated with the IoT, Artificial Intelligence (AI) opens the field of
    possibilities in the medical area, in particular, by allowing the development
    of new diagnostic and interpretation tools of exceptional reliability and by assessing
    the large volumes of data that can be generated through the networks by sensors
    and users.


    # OBJECTIVE OF THE BOOK


    The objective of this book is to focus on how to use IoT, AI and Machine Learning
    (ML), to keep patients safe and healthy and, at the same time, to empower physicians
    to deliver superlative care.


    This book discusses the applications, opportunities, and future trends of machine
    intelligence in the medical domain, including both basic and advanced topics.


    This book provides core principles, algorithms, protocols, emerging trends, security
    problems, and the latest e-healthcare services findings. It also includes deep
    feedforward networks, regularization, optimization algorithms, convolutional networks,
    sequence modeling, practical methodology, and how they can be used to provide
    better solutions to healthcare-related issues.


    # ORGANIZATION OF THE BOOK


    Chapters 1-3: The authors introduce the concept of the Internet of Medical Things
    (IoMT), its roles, challenges, and the opportunities it may present to the healthcare
    system.


    Chapter 4: The authors present a cloud-edge-based IoMT architecture and discuss
    the performance optimization it may provide in the context of Medical Big Data.


    Chapter 5: The authors provide a comprehensive survey on different IoMT interference
    mitigation techniques for Wireless Body Area Networks (WBANs).


    Chapters 6 and 7: The authors explore the possibilities that Artificial Intelligence
    and the Internet of Things can provide to prevent future pandemics.


    Chapters 8-10: The authors provide a comprehensive review of the newest Machine
    Learning based solutions in different medical areas.


    Chapter 11: The authors go through the latest discoveries in curing cardiovascular
    diseases by implementing Artificial Intelligence in healthcare settings.'
