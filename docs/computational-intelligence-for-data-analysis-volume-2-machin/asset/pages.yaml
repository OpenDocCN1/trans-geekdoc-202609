    # Supervised Learning (SL)


    Given a training number of instances with appropriate targets, processes respond
    accordingly to the complete possible inputs created on this training set. The
    SL method is also known as learning from exemplars. The two-step SL method is
    as follows and shown in Fig. (2).


    +   - A predictive model is a combination of available data and known answers.

    +   - When showing new data, the predictive model offers appropriate responses.


    # Unsupervised Learning


    There are no appropriate responses or targets specified. Unsupervised learning
    explores commonalities between the stored data and classifies the data based on
    these commonalities. Data acquisition is yet another name for this. Clustering
    is a feature of unsupervised learning. When no outputs are provided, un-supervised
    ML is used to learn patterns in the data from the inputs. Clustering, NNs, and
    HMM are often used as unsupervised learning techniques. These methods allow the
    exploration of unlabeled data to find intrinsic or hiding patterns.'
