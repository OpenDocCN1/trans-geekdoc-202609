  img_proc: true
- pgno: 34
  md: '# Networks


    The physical architecture of IoT-based healthcare networks includes a variety
    of networks ranging from short-range communications, such as 6LoWPANs, WPANs,
    WBANs, WLANs, and WSNs, to long-range communications, such as any type of cellular
    network. In developing low-power communication protocols and medical sensor devices,
    technologies such as Bluetooth Low Energy, radio frequency identification (RFID),
    and near-field communication (NFC) play a role.


    # Ambient Intelligence


    Ambient Intelligence continuously monitors human activities and executes any action
    required for the recognized event. It is critical because it is constantly monitoring
    what individuals do.


    # Augmented Reality


    Augmented reality emphasizes surgery and other standard patient examinations more
    than other technologies.


    # Wearable


    Sensors like pulse, body temperature, pulse oximetry, and respiration rate are
    wearable because they are planned with soft, smooth, and easily wearable features.
    It is also easy to use and apply to the body of anyone. Wearables have many benefits,
    like gamification, connected data, and healthcare communities [3].


    # IOT''S HEALTHCARE BENEFITS


    As with any new technology, there are some downsides to the Internet of Things,
    but it is primarily advantageous. The Internet of Things is causing a significant
    shift in medical health care. The Internet of Things applications and technologies
    have changed the world in ways that people did not think possible in the 1990s.
    Internet of Things created a significant change in people''s communication with
    each other on the Internet. It led to the creation of many new and demanding fields,
    most notably in the area of medical things. Most people follow and utilize it
    due to its accurate and straightforward features. So, it bridges the gap between
    doctors, patients, and healthcare services. Thanks to the Internet of Things,
    health care workers can now do their jobs better and more quickly, with less effort
    and intelligence. This use of IoT in the medical field has been perfect for patients.
    IoT is also straightforward to use. People who use IoT can benefit from the following
    points:'
