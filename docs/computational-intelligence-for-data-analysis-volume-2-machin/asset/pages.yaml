    # HEALTHCARE AND BLOCKCHAIN


    The complete Healthcare ecosystems face severe challenges due to security, privacy,
    interoperability, data manipulation, etc. Due to the inability to securely share
    data and isolated management of the Electronic Medical Record (EMR) and the Patient
    Health Record (PHR), healthcare professionals do not track the complete history
    of medical records, which leads to improper treatment. These challenges are not
    only blocking research and innovation in the area of health science but also a
    severe threat to the health of the patients and the general public. Validation
    of Clinical trials and the effectiveness of the new drugs or vaccines cannot be
    predicted due to the lack of sufficient data in the long term. Pharmaceutical
    companies have been facing a severe issue of counterfeit drugs in their supply
    chain for a very long time [15].


    Blockchain technology offers immense distributed processing capabilities and storage
    resources, providing scalable, secure, transparent solutions without compromising
    the privacy and security of healthcare data. Blockchain promotes transparency
    among participant stakeholders and promotes interoperability among diverse healthcare
    systems. Blockchain can be implemented to reduce the complexities of healthcare
    data management and data sharing among various healthcare stakeholders while taking
    consent from patients and respecting their privacy. Blockchain technology offers
    much potential for integration, innovation, interoperability, and sustainability
    in healthcare.


    # Blockchain-Based Systems Models for the HDMS/HIS


    Pandi-Perumal et al., in their research, proposed a Blockchain model to record,
    retrieve and share PHR to administer sleeping medicines [16]. They focused on
    the direct delivery of sleep medicines from pharmaceutical companies to doctors,
    nurses, or patients based on electronic prescriptions shared by doctors on the
    Blockchain platform. To achieve this, they proposed the following modules in their
    Blockchain-based System, as depicted in Fig. (2) [16].'
