    # APPLICATIONS OF BCI


    In this section, we detail the state-of-the-art applications of BCI. Several studies
    are underway to enhance current BCI systems by combining multimodal signal acquisition
    methods. Several studies have demonstrated that fMRI with simultaneous EEG can
    yield complementary features through the use of the EEG''s effective spatial resolution
    and the EEG''s effective temporal resolution, according to Debener et al. [28].
    MEG, as mentioned by Kauhanen et al. [29], can also work in conjunction with EEG,
    since it provides information regarding radially/tangentially polarized sources
    in cortical-subcortical networks, and can complement the EEG by adding complementary
    information. Few studies, such as Min et al. [30], and Piastra et al. [31], contend
    that EEG and MEG can detect subcortical activities; however, skepticism remains
    regarding their capability to detect brain activities that originate from subcortical
    areas. It has become increasingly common to combine different signal acquisition
    methods for improving BCI efficiency in recent years.


    In order to translate any brain signal into a command that can be used by a computer
    or other external device, signal processing combined with ML techniques plays
    a crucial role. Time-domain representations of the brain signals include the Fourier
    transform (FT) and autoregressive models, whereas time-frequency representations
    include short-time FTs and wavelet transforms, as described by Bashashati et al.
    [32]. When spatial filtering is considered, as described by Saha et al. [33],
    many inverse models enable the differentiation and projection of actual sources
    on three-dimensional cortical-subcortical networks. A variety of linear and nonlinear
    classification algorithms, such as kernel-based support vector machines and linear
    discriminant analysis can be used to translate the extracted features, as described
    by Lotte et al. [34]. A deeper understanding of BCI based on deep learning paradigms
    is receiving increasing attention from researchers thanks to the remarkable advancements
    in computational'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'infrastructure over the past decade, as mentioned by Nagel et al. [35]. This
    is because such systems can evaluate large datasets. The inverse problem, as described
    by Saha et al. [36], must be solved in order to model the cortical sources. Additionally,
    new methods for localizing sources have emerged in recent years, including wavelet-based
    maximum entropy over the average that represents EEG/MEG signals as time-frequency
    contents and then transforms them into spatial representations. Sensors with customized
    designs are developed for the acquisition of brain signals. Deisseroth et al.
    [37] have described many forms of neuro sensors, including electrochemical, optical,
    chemical, and biological. Nanowire Field Effect Transistors and other p/n junction
    devices, as described by Oxley et al. [38], have demonstrated the feasibility
    of neuro-sensing techniques in intracellular recordings, even in deep brain regions,
    thanks to major advancements in nanotechnology.


    According to Willett et al. [39], Zhang et al. [40], and Herff et al. [41], BCI
    systems have also shown the ability to read thoughts in regard to multiple movements.
    Researchers have used BCI to test the thinking of pigs while running on the treadmill.
    They were also able to predict what the pig''s brain would do next in addition
    to interpreting the pig''s thoughts. Moreover, researchers are carrying out research
    on the use of brain-computer interfaces to improve communication among people
    who are paralyzed physically and unable to speak or move. In these situations,
    BCI enables the person to communicate verbally and in writing. BCI system for
    brain-to-text transcription also aids paralyzed people to imagine writing the
    letters, and these letters appear on the screen. In the experiments, the paralyzed
    patients are asked to think at a rate of 90 characters per minute, which are then
    decoded and presented on the screen in less than one second. This demonstrates
    results that are 80% faster than the typical typing speed on a smartphone screen
    for a person of the same age range. Even after being affected for years with paralysis,
    the motor cortex is still powerful enough to read by a BCI well enough for typing
    speed and precision.


    Rabbani et al. [42], and Rezazadeh Sereshkeh et al. [43] have developed BCI to
    generate synthesized speech. To obtain the results, electrodes were placed on
    the surface of the brain to measure the signal and calculate movements of the
    vocal tract. The captured vocal tract movements are then converted to sounds,
    and the original voice is then converted into synthesized speech. According to
    Ptito et al. [44], and Farnum et al. [45], BCIs have also been demonstrated to
    be used for assisting and restoring the vision of blind people. A camera, positioned
    on glass, captures a video image, processes it, and then activates a chip installed
    in a retina to stimulate the eye. The ultimate goal is to be able to use the implant
    to transform camera inputs into brain activity. Thus, it presents a novel method
    of treating blindness that targets the brain directly rather than the eyes. According
    to Hwang'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'et al. [46], and Lucia et al. [47], patients with hearing loss have several
    options for addressing their hearing loss, including BCIs. It works similarly
    to the microphone, which picks up sounds and conversations from various people.
    Implants are positioned behind the ear or beneath the skin, which then transfers
    the impulses to electrodes which are implanted in the cochlea via a sound processor.


    Changes occur in the brain and the body as age increases, and elderly people require
    assistance. Nevertheless, they are generally not provided the assistance they
    require owing to the expense of the required care and treatment. BCIs have also
    been found to be helpful in assisting elderly people, as described by Belkacem
    et al. [48]. In this case, BCI technology can help the elderly in multiple ways
    such as, improving their communication, controlling domestic appliances, and strengthening
    their cognitive abilities. Currently, dementia is very common among adults, as
    mentioned by Fukushima et al. [49], and Rutkowski et al. [50]. BCIs are used to
    detect early Alzheimer''s and are also used to classify and to know the type of
    Dementia. It is very important to detect early Alzheimer’s type of dementia (AD)
    as it can be treated using medicine itself. Motion sickness and drowsiness decrease
    the performance of drivers, and on occasion also result in an accident, as described
    by Ferreira et al. [51], Lin et al. [52], Wei et al. [53], Pritchett et al. [54],
    and Li et al. [55]. Motion sickness can be predicted by measuring EEG signals
    received from different areas of the brain region. EEG-based BCI systems have
    shown immense potential in a variety of applications including post-stroke treatment,
    as described by Mrachacz-Kersting et al. [56], and Ruiz et al. [57], illness diagnosis
    (Abdulkader et al. [58]), emotion identification (Mishra et al. [59]), and gaming
    (Lim et al. [60]), which have shown great promise for EEG-based BCI systems.


    BCI systems also aid in predicting brain tumours, as described by Song et al.
    [61], epilepsy (seizure disorder), as mentioned by Hosseini et al. [62], and encephalitis
    (brain swelling). Further, it is possible to ensure early detection of Dyslexia
    using BCI, which in turn helps in treating the children and improving their self-confidence,
    as described by Fadzai et al. [63]. The combination of rtfMRI-EEG BCI systems
    is used for finding depression, as mentioned by Minkowski et al. [64], and emotion
    recognition, as described by Moschona et al. [65] of patients can also be identified
    using the fMRI BCI system. The BrainArena, as described by Bonnet et al. [66],
    connects two brains to a football video game using BCIs and can score by thinking
    left and right movements. Playing Brainball games twice a week has been demonstrated
    to improve the students’ learning skills. Lastly, people can measure their stress
    level by playing the Brainball game in which the player with less stress only
    can move the balls, as described by Mridha et al. [67].'
