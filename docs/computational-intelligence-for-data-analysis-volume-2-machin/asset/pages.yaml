  md: '# CHAPTER 2


    # Health Services and Applications Powered by the Internet of Medical Things


    Briska Jifrina Premnath¹ and Namasivayam Nalini¹,*


    ¹ Department of Biochemistry and Biotechnology, Faculty of Science, Annamalai
    University, Tamil Nadu, India


    **Abstract:** The traditional healthcare system model is now out of date. As the
    digital era progresses, new advanced technologies and service platforms are highly
    demanded. The Internet of Medical Things (IoMT), a subset of the Internet of Things,
    is one such technology. The Internet of Things (IoT) is a network of wireless,
    interconnected, and linked digital devices that can collect, send and store data
    without requiring human-to-human or human-to-computer interaction. Understanding
    how established and emerging IoT technologies help health systems provide safe
    and effective care is more important than ever. For example, the rapid spread
    of Coronavirus disease (COVID-19) has alerted the entire healthcare system. The
    Internet of Medical Things (IoMT) has dramatically improved the situation, and
    COVID-19 has inspired scientists to create a new ''Smart'' healthcare system focused
    on early diagnosis, prevention of spread, education, and treatment to facilitate
    living in the new normal. This paper provides an overview of the IoMT design and
    how cloud storage technology can help healthcare applications. This chapter should
    assist researchers in considering previous applications, benefits, problems, challenges,
    and threats of IoMT in the healthcare field and the role of IoMT in the COVID-19
    pandemic. This review will be helpful to researchers and professionals in the
    field, allowing them to recognize the enormous potential of IoT in the medical
    world.


    **Keywords:** Applications, Benefits, Challenges, COVID-19, Healthcare, IoMT,
    IoT, Medical, Threats.


    # INTRODUCTION


    Significant changes have taken place in the healthcare industry over the last
    few years. One crucial factor in this change is the use of new information technology
    across the business right now. Hospitals and nursing homes need help from many
    different IT service platforms and cutting-edge technology to meet the growing
    healthcare demand. The Internet of Medical Things, or IoMT, is one of the most'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'commonly used technologies in the healthcare field today. A subset of the Internet
    of Things is the Internet of Medical Things [1].


    The term “Internet of Things” refers to a network of physical things, or “Things,”
    meant to communicate with each other through the Internet. Ashton first talked
    about the Internet of Things in 1999. Since then, it has overgrown, with about
    10 billion connected devices today and an estimated 25 billion by 2025 [2].


    Taking care of a person''s physical, mental, or emotional well-being is called
    “health care,” usually done by trained and licensed professionals like doctors
    and other healthcare workers. There are not enough doctors, nurses, or hospital
    beds because there has been much growth in the population, and a lot more people
    are getting sick. Scientists who use the latest techniques and methodologies develop
    new medicine and healthcare trends every day. Researchers have recently focused
    their attention on the Internet of Things (IoT) because of its popularity as a
    perfect solution for healthcare systems that do not put much pressure on them
    [3].


    Today, healthcare and modern technology businesses, especially healthcare systems,
    play a big part in our lives. The main goal of integrating technology into healthcare
    systems is to make it easier for patients and caregivers to communicate with each
    other. This will make medical devices and services more efficient and easier to
    get. The Internet of Medical Things (IoMT) has been essential in monitoring healthcare
    from afar (RHM). Wearable sensors and devices are often used to get data on patients
    remotely and store it in cloud databases. The Internet of Things (IoT) is used
    primarily for this. These data can be used by caregivers right away for analysis
    and planning [4].


    IoMT consists of three main parts: the device layer [Body Sensor Network (BSN)],
    the fog layer, and the cloud service. The main goal of the device layer (sensing
    layer) is to build an effective and accurate sensing technology that can collect
    different types of health-based data. Communication technologies like Bluetooth,
    RFID (NFC), Wi-Fi, IrDA, UWB, and ZIGBEE help the IoMT system build network solutions
    and infrastructures. In the cloud layer (data layer), the data is processed and
    kept safe and sound. Furthermore, the cloud gets the patient''s data to analyze,
    process, and store it. Healthcare workers can then use such data [5 - 12].


    The IoMT is a group of medical strategies connected to networks. People can connect
    their smart glasses, head-mounted devices, belt-worn clothes, smartwatches, woven
    clothes, and smart wristbands to Wi-Fi, Bluetooth, or the Internet to get information
    about their health. Diagnostic machines such as ultrasonography, MRI machines,
    infusion pumps, ventilators, and X-ray machines in healthcare facilities use IOMT
    technologies. These IOMT wearable devices can'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'be used to keep track of people''s health of all ages. They are usually easy
    to wear and use. IOMT devices are used in applications and software, such as remote
    data analytics, medical assistance, operations augmentation, medicine monitoring,
    and accounting systems [13].


    Remote Health Monitoring (RHM) is a way to track a person''s health data regularly.
    People''s heart rate, temperature, blood pressure, physical activities, and dietary
    habits are all monitored. The cloud sends health data wirelessly to both patients
    and caregivers. So, IoMT can make real-time, quick, remote, and trustworthy decisions
    for various disorders. This process generates many data, which is then analyzed
    and monitored. Due to the hectic pace of today''s lives, most people do not go
    to the doctor regularly. In addition, healthcare costs are rising, and governments
    spend a lot of money on healthcare each year. People in Europe and the United
    States also prefer to get their health care at home rather than in a hospital.
    These problems can be solved if real-time healthcare monitoring can be done from
    afar and in real-time. The use of wearable gadgets and sensors to provide continuous
    monitoring for patients and the elderly has received a lot of interest [14 - 25].


    Imagine a world where billions of things are connected through IP (Internet Protocol)
    networks and have built-in intelligence, communication, sensing, and actuation
    abilities. This is called the Internet of Things (IoT). Our current Internet has
    moved a lot away from hardware-based options (computers, fibers, and Ethernet
    connections) and toward market-based ones (such as apps) (Facebook, Amazon) [26].


    This chapter will look at the technologies that make up IoMT and the benefits,
    problems, security concerns, and ways that IoMT can be used in healthcare. IoMT''s
    role in COVID-19 is also addressed briefly.


    # CONCEPT FOR INTERNET-OF-THINGS-BASED HEALTHCARE


    It is meant to allow for a wide range of types and services, each of which has
    a different set of Medicare solutions. There is not yet a complete list of IoT
    services in healthcare. Health care services can be hard to tell apart from other
    solutions or applications in some cases. It also looks at how potentially building
    blocks can be used in general service. In Medicare settings, IoT frameworks and
    protocols have been updated a little to make them work better. Simple, safe, low-power
    and quick discovery of new devices and services can be made and done quickly.
    There are many subtopics under the term “health service” that deal with future
    and emerging health services [3]. Fig. (1) illustrates the concept of IoMT in
    health care.'
