    # CHALLENGES


    Although AI is well established for its beneficial role in cardiovascular medicine,
    there are still many hurdles to overcome to implement AI-based technological features
    in clinical settings. Firstly, the main problem is the lack of infrastructure
    in the hospitals. As we know, most clinics do not have a spacious infrastructure;
    therefore, the role of AI is underrated. Another critical factor is the lack of
    well-trained technicians who can handle advanced technology features. In the Indian
    scenario, the entire patient data is stored in the various database platforms,
    so even if the AI is established in such clinics, it would take more time to analyze
    the patient characteristics as data is scattered into the different systems. Another
    essential thing to consider is Ethical issues. Ethical concerns and their usage
    is the vital thing in AI. Sometimes, by using AI technology, we can predict the
    fortunate in cases like determining the sex of the baby and estimating whether
    a person is prone to cardiovascular diseases. Therefore, this will undoubtedly
    lead to illegal conduct.


    Another essential thing is the fear of loss of employment if AI is much occupied
    in the healthcare settings. However, we can assure you that by implementing AI
    devices, identifying the diseases or their features would have been easy for physicians
    for precise and accurate decision-making. However, they cannot replace humans
    because the data has to be analyzed by the humans at the end, whatever the computerized
    machine generates it. Therefore, it must be considered a myth about employment
    loss. With the advent of these technological features in clinical medicine, one
    must consider safe and reliable instruments for patient care.'
