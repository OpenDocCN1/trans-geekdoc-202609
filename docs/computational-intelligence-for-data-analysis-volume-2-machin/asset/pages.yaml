  md: '# CONCLUSION


    There are more than 500 classes of Brain Tumors to detect, and it is very difficult
    to find enough data for each type. To manage this problem, we propose to use several
    techniques combined together for DA. First, we built a local database composed
    of 10 different classes, and we made a comparative study to choose the most suitable
    CNN architecture for our case. Using our CNN architecture without any DA techniques
    yielded a 92.88% rate. Afterward, we made another comparative study to choose
    the most efficient parameterization for the automatic generator of the data increase,
    and we were able to make consistent progress of about 94.99%. Then we moved on
    to using IF as a technique to do DA. The use of the DWT method gives a rate of
    97.33%. Our proposed approach is based on autoencoders as an image fusion technique
    for data augmentation. It gives very satisfactory results and an excellent rate.
    Our perspective is to make a recognition system for other types of brain tumors
    using other data augmentation techniques such as generative adversarial networks
    GAN.


