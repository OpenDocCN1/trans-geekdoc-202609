    # ARTIFICIAL INTERNET OF THINGS APPLICATIONS FOR HEALTHCARE


    The Internet of things is quite helpful in many research areas, including wireless
    body area networks, tracking, monitoring, and more importantly, electronic health.
    Local and remote data collection about patient health provides better details
    through which doctors can make the right decision at the right time. During the
    COVID-19 pandemic, a novel approach is introduced called healthcare-AIoT, which
    mimics the spread of the virus [25 - 28]. H-AIoT consists of the following components
    which are as under:


    # H-AIoT Based Hardware


    Tele-health monitoring systems used to have intelligent hardware to store patient
    data. IoT-based devices are designed to observe patient''s daily routine activities.
    Therefore, IoT systems easily give information about heartbeat, temperature, walking
    & sleeping. Also, breathing and coughing can be detected by utilizing IoT models.
    These IoT-hardware components help doctors to make an optimal decision. In addition,
    web-based online patient monitoring systems are introduced, which are used mostly
    during COVID-19 [29].


    # H-AIoT Based Software


    Tele-medicine provides better connectivity between patients & doctors. For this
    purpose, Online web-based software’s comes in the category of the internet of
    medical things. Wireless Communication technologies can be used for optimal connectivity
    [30].


    # Communication/Routing Protocols


    In wireless body area sensor networks, various routing protocols are implemented
    in the healthcare industry to collect information on patients. Application-specific
    routing protocols are designed to increase the lifetime of the network [31].


    # UAV’s/Drones in the Healthcare Industry


    UAVs play a pivotal role in improving logistic services in the healthcare industry.
    Indeed, mini-drones are both more cost-effective and more efficient in rescue
    missions when compared to standard aerial vehicles. Communication between UAVs
    is also more efficient due to minimized end-to-end delay in communication networks
    [32].'
