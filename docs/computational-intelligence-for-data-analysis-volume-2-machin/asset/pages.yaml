  md: '# Data Augmentation with Image Fusion Techniques for Brain Tumor Classification
    using Deep Learning


    Tarik Hajji*, Ibtissam Elhassani, Tawfik Masrour, Imane Tailouloute and Mouad
    Dourhmi


    ¹ Artificial Intelligence for Engineering Sciences Team (IASI), Laboratory of
    Mathematical Modeling, Simulation and Smart Systems (L2M3S), ENSAM, Moulay Ismail
    University, 50500 Meknes, Morocco


    **Abstract:** Brain tumor (BT) is a serious cancerous disease caused by an uncontrollable
    and abnormal distribution of cells. Recent advances in deep learning (DL) have
    helped the healthcare industry in medical imaging for the diagnosis of many diseases.
    One of the major problems encountered in the automatic classification of BT when
    using machine learning (ML) techniques is the availability and quality of the
    learning from data; these are often inaccessible, very confidential, and of poor
    quality. On the other hand, there are more than 120 types of BT [1] that we must
    recognize. In this paper, we present an approach for the automatic classification
    of medical images (MI) of BT using image fusion (IF) with an auto-coding technique
    for data augmentation (DA) and DL. The objective is to design and develop a diagnostic
    support system to assist the practitioner in analyzing never-seen BT images. To
    address this problem, we propose two contributions to perform data augmentation
    at two different levels: before and during the learning process. Starting from
    a small dataset, we conduct the first phase of classical DA, followed by the second
    one based on the image fusion technique. Our approach allowed us to increase the
    accuracy to a very acceptable level compared to other methods in the literature
    for ten tumor classes.


    **Keywords:** Artificial Intelligence, Autoencoder, Brain Tumor, CNN, Data Augmentation,
    Deep Learning, Image Fusion, Machine Learning, Medicine 4.0, Visual Recognition.


    # INTRODUCTION


    The emerging medicine, Medicine 4.0 [2], has dared to take the step of digitization;
    three-dimensional imaging, the connectionist power of artificial'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'intelligence (AI) algorithms, surgical planning with specific software using
    AI, and the creation of personalized or adaptable implants to face the most complex
    situations. There are few industries where visual recognition (VR) [3] does not
    open up huge opportunities. VR technologies are capable of assimilating the textual
    content of photographed documents, and this ability could have a major impact
    on employment. The key will probably be to consider these technological solutions
    not in opposition, but as a complement to human work. This was proven by a Harvard
    study in the health sector. It found that DL alone effectively analyzes magnetic
    resonance imaging (MRI) in 92% of cases. For their part, doctors achieve a rate
    of 96%. But helped by AI, their rate exceeds 99.5% [4].


    The Brain can be infected by a lot of tumors, principally if they are malignant
    or [5] persistent. According to the American association of neurological surgeons,
    there are 11 BT main classes: gliomas, meningioma, primitive neuroectodermal tumors,
    pituitary tumors, pineal tumors, choroid plexus tumors, dysembryoplastic neuroepithelial
    tumor, tumors of nerves sheaths, cysts, skull base, and primary central nervous
    system lymphoma [5, 6]. Each main class is subdivided into several subclasses
    to have in total more than 120 types of BT according to the World Health Organization.


    DL is an application of ML, a field of AI, which represents a set of algorithms
    that automatically learn to recognize and classify data such as images. DL is
    inspired by the structure of the human brain and is heavily used in computer vision
    problems. The challenge of the use of DL in computer vision is how to find the
    best model (conventional neural network architecture and parameters). This operation
    requires a data set of labeled images and a specific learning algorithm to optimize
    the DL model parameters.


    To solve the BT classification problem, we propose in this paper to use a combination
    of techniques to achieve very high recognition rates. These techniques are based
    on convolutional neural networks (CNN), data augmentation, image fusion and autoencoders.
    We have proven that the right combination of these techniques can overcome the
    problem of lack of data.


    The rest of this paper is organized as follows: state of the art to present the
    different concepts used in this paper, such as DL, CNN, and the different techniques
    of DA and IF. The section of related works for the presentation of some scientific
    results concerning the subject of BT classification. The methodology section to
    the general presentation of our approach is subdivided into three large parts,
    one for the standard classification, one for the use of the DA techniques, and
    one for the use of the IF technique based on autoencoders. The results and discussion
    section for the presentation of the results obtained for each'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'proposed approach and a possible comparison with the state-of-the-art methods,
    and at the end, a general conclusion is proposed.


    # BACKGROUND


    The history of medicine remains inseparable from innovation, driven by generations
    of designers, engineers, doctors, clinicians, and then developers, startups, data
    scientists, and other researchers [7]. AI-based accurate diagnosis (diabetic retinopathy
    fundus diagnosis, the first direct AI diagnostic algorithm to be recognized by
    the Food and Drug Administration, in April 2018) [8], automatic and instantaneous
    skin cancer recognition and classification [9], automatic electrocardiogram reading
    [10], arrhythmia detection [11] and personalized chemotherapy [12].


    # Deep Learning


    DL is one of the main ML technologies subfields of Artificial Intelligence [13].
    The ML concept dates back to the middle of the 20th century. In the 1950s, Alan
    Turing, the British mathematician, imagined a machine able to learn, a “Learning
    Machine” [14]. Over the following decades, various ML techniques were generated
    to create algorithms to learn and improve themselves. Among these techniques are
    artificial neural networks (ANN) [15]. These algorithms are the basis for Deep
    Learning, but also for technologies such as image recognition or robotic vision.
    ANN is inspired by the neurons of the human brain [16]. They are made up of several
    artificial neurons connected to each other (Fig. 1).


    ![](img/12e321fe66dd89993b17a8d73b64bd0c_250_0.png)


    Fig. (1). DL is implemented by a deeper ANN architecture with multiple hidden
    layers.


    # Data Augmentation


    CV processing models use a DA approach to cope with data sparingly and insufficient
    multiplicity [17]. DA algorithms can increase the accuracy of DL models and perform
    better in terms of training loss accuracy than a DL model without DA for image
    [18]. There are a lot of DA methods for images to create diversity in the learning
    data set of the model. It is easy to find many examples of'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'coding for these transformations, like adding noise, cropping, flipping, rotation,
    scaling, translation, brightness, contrast, color augmentation, saturation, adversarial
    training, neural style transfer, and generative adversarial networks-based augmentation
    (Fig. 2) [19].


    ![](img/12e321fe66dd89993b17a8d73b64bd0c_251_0.png)


    Fig. (2). Example of three simple data augmentation operations (rotation, shearing
    and scaling).


    # Image Fusion


    Image Fusion encompasses all data analysis strategies, displayed in Fig. (3),
    aimed at combining information from multiple images obtained with the same or
    different spectroscopic platforms [20]. IF combines two or more registered images
    of the same object into a single image that is more easily interpreted than any
    of the originals [21]. The motivation for Medical Image fusion from different
    modalities is to obtain a high-quality image by intelligently combining the collected
    essential information from multi-modal input images [22]. IF techniques shown
    in figure can be classified as spatial and frequency domains.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '![](img/12e321fe66dd89993b17a8d73b64bd0c_252_0.png)


    Fig. (3). Different image fusion techniques [20].


    # Related Work


    Several contributions have been proposed to address the topic of tumor classification
    using several classical and advanced techniques [23 - 31]. It should be noted
    that the most modern techniques use DL to treat this subject. For example, the
    authors of [23] proposed to use CNNs for BT classification via the transfer learning
    (TL) technique. The anticipated method reports a mean classification accuracy
    of 98%, outperforming all related work. The manuscript focuses on a 3-class BT
    to adopt the concept of deep TL using GoogLeNet [32] to extract features from
    MRI.


    A decision support system for multimodal BT using DL is proposed by Sharif et
    al. [24]. For the experimental process, the authors used two datasets, BRATS2018,
    and BRATS2019, and achieved an accuracy of more than 95%.


    Mohsen et al. [25] proposed a CNN to classify the BT into three classes (glioma,
    meningioma, and pituitary) with an accuracy of 98.93% and a sensitivity of 98.18%
    for cropped lesions, while the results for uncropped lesions are 99%'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'accuracy and 98.52% sensitivity and the results for segmented lesion images
    are 97.62% for accuracy and 97.40% sensitivity.


    Saleh et al. [26] used CNN combined with discrete wavelet transform (DWT), and
    principal component analysis, to classify 66 brain MRIs into 4 classes: normal,
    glioblastoma, sarcoma, and metastatic bronchogenic carcinoma tumors, as well as
    the performance evaluation, was relatively good for all performance measures.


    To bring more scientific value to state of the art, we present an approach that
    uses data augmentation with fusion techniques for brain tumor classification using
    deep learning and autoencoder.


    # METHODOLOGY


    Using a relatively small dataset that we constructed in our L2M3S lab consisting
    of 24*10 = 240 images representing 10 classes of BT, we began our three-step approach
    shown in Fig. (4).


    ![](img/12e321fe66dd89993b17a8d73b64bd0c_253_0.png)


    Fig. (4). The proposed methodology consists of three steps: classification without
    data augmentation, classification with classical data augmentation techniques
    and classification with data augmentation using fusion techniques.'
