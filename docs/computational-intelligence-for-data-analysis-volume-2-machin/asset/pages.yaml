  md: '# Impact of AI on Echocardiography (ECG)


    An Echocardiogram is the most important in the cardiology field for accurately
    detecting and treating heart abnormalities; hence, appraisal of heart functioning
    can be judged. Technology-based AI tools come up with new possibilities to amplify
    the precision of the likeliness of image elucidation in ECG, especially when there
    are chances of misdiagnosis to identify a disease. AI-based computational tools
    had the possibility to explicate unutilized data in a programmed way by the emergence
    of advanced processes like Speckle tracking imaging. It further benefits in a
    cutback of the investigation period or duration and also improves reliability
    [28, 29].


    A study by Sengupta et al. came about a cognitive-based learning algorithm coupled
    with speckle tracking performance that can distinguish constrictive heart failure
    from restrictive heart failure [17]. Another report by Narula et al. concluded
    that machine learning based on supervised features could distinguish abnormalities
    in the functioning of an athlete’s heart with increased precision in contrast
    to conventional computational methods [18]. Nevertheless, ML models can also detect
    heart valvular motions to identify and cure ailments, mainly during the pre-operative
    times [30, 31].


    Recent three-dimensional machine learning Echonet dynamic proposed by Ouyang et
    al. achieved a reliability of nearly 0.92% that can evaluate ECG irregularities
    with accuracy better than cardiac experts [19].


    # Role of AI on Magnetic Resonance Imaging (MRI)


    ML models are more frequently used in the cardiac MRI-like ventricular segmentation
    area. Using ML models, we can enhance the volumetric and reliability of clinical
    findings [20, 32]. The deep learning algorithm suggested by Avendi et al. could
    able to identify the existing myocardium scars in the right portion of ventricles.
    This detection of sub-acute or chronic myocardial scar is another area where ML
    models are applied [33].


    In another study by Dawes et al., he used the three-dimensional portion of the
    heart muscle to foresee the traditional perils, and unfavorable consequences like
    premature demise in patients with pulmonary diseases [21].


    # Use of AI on Cardiac Computed Tomography (CT)


    Machine learning features are progressively utilized in CT examination for identification
    together with evaluation of risk in coronary infarction. It is also used in the
    identification of calcium presence and flow of blood in the blood'
