  md: '# WAYS TO SOLVE IOMT ISSUES


    # Inventory of Assets


    The first step toward improved security is to create and maintain an inventory
    of all IoMT. It is frequently unmanaged, as it is not tied to a responsible person
    who functions as the “owner,” many healthcare organizations fail to identify the
    devices. As no one is accountable for handling security precautions such as passwords,
    the inability to link a device and a user creates a security blind hole.


    # Policy for Strong Passwords


    Default settings and passwords are included with every IoMT device. Threat actors,
    on the other hand, frequently locate default passwords online. The first step
    in connecting a new IoMT device to the network should be to set a new, strong
    password that is specific to the device. Some examples of best practices are as
    follows:


    +   - Using upper- and lower-case letters in a creative way.

    +   - Including at least one number in the equation.

    +   - Including at least one unique character.

    +   - We should also ensure that the password is not stored in any online password
    databases. This reduces the chances of malevolent actors being able to “guess”
    the password.


    # Multi-Factor Authentication (MFA)


    It is a second step in preventing credential theft. MFA requires threat actors
    to supply additional information verifying that they are who they claim they are,
    even if they successfully log into the device. To authenticate to a device, network,
    or application, MFA involves using two or more of the following:


    +   - Something you are aware of a password.

    +   - You have something like a smartphone.

    +   - Something you are doing like a biometric like fingerprint or face recognition.


    # Segmentation of the Network


    The technique of physically or intellectually isolating networks containing sensitive
    information from those not known as network segmentation. This can be accomplished
    by storing sensitive data in a separate data centre from public internet-facing
    apps or limiting access to the network containing sensitive data'
