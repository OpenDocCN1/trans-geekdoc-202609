    During the COVID-19 pandemic, it is crucial to observe the health of many people
    at all times, both before and after they get sick. The Internet of Medical Things
    (IoMT) has made it easy for caregivers and patients to use telemedicine to monitor,
    screen, and treat patients from afar. When there is a global pandemic, intelligent
    devices powered by IoMT are changing the world, especially in the middle [2].


    # Virtual Reality (VR), Augmented Reality (AR), and Mixed Reality (MR)


    Virtual, mixed, and augmented reality can be used for various things, but there
    are four main types: clinical/therapeutic, entertainment, business/industry, and
    education/training. By changing reality experiences, VR technology makes a three-dimensional,
    appealing multimodal world so that people can feel like they are there. It looks
    like people are “transported to a three-dimensional, life-like world” when they
    wear a head-mounted display (HMD) that has a very close screen to their face.
    Virtual reality is good because it uses distraction, extinction learning, cognitive-behavioural
    principles, gate-control theory, and the spotlight theory of attention to make
    people pay attention. Virtual reality treats mental health and anxiety disorders
    and manages strokes, pain, and obesity. It also controls and stops weight gain.
    Virtual reality can help cancer patients keep track'
