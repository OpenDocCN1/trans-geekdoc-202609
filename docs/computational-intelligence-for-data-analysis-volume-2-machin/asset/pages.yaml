  img_proc: true
- pgno: 202
  md: '+   - 5. AdaBoost (AB)

    +   - 6. Support vector machine (SVM)


    # K-Nearest Neighbour (KNN)


    It is a machine-learning algorithm based on a supervised learning technique. This
    algorithm acts as a repository for entirely all cases and is classified on the
    roots of the resemblance. It is easy to handle and accurate.


    In K-NN, K denotes the notation for nearest neighbours. Here the principal value
    is K, and when it is equal to one is described as the KNN. This algorithm resolves
    the Classification and regression predictive issues. The study of Jabbar reported
    that KNN incorporated with Particle Swam Optimization (PSO) technique could effectively
    predict heart diseases with 100% accuracy. Medical data consists of both relevant
    and unwanted information; therefore, most of the irrelevant and unwanted information
    can be discarded using the PSO technique in the KNN model [6].


    # Artificial Neural Network (ANN)


    This type of programming and data processing system is similar to living neurons
    of animal intellect. It has also been referred to as Connectionist systems. It
    consists of nodes called neurons that mimic nerve cells of the human cerebrum.
    Every link looks the same in the way of the myoneural junctions of the human cerebrum
    that process information to the following nerve cells or neurons. In a simple
    way, the signal is received and transmitted to the next level of nerve cells,
    making all the neuronal systems activate [12]. In a recent study by Niranjana
    et al., it was reported that an ANN model with one layer of trained hidden neuronal
    architecture can be able to identify the degree related to heart block features
    of heart valves with an accuracy of 95.5% [13].


    # Decision Tree (DT)


    DT is maybe simple and provides us excellent results when the information is usually
    categorical and depends on conditions. It is often explained with an example as
    if an individual had systolic and diastolic dysfunction due to the chronic activation
    of hemodynamic and neuron-hormonal compensatory responses. This condition is often
    further divided into branches (causes) like cardiac hypertrophy, Myocyte loss
    due to necrosis, and abnormal myocardial energy until they are available to choose
    the exact reason for the person to develop systolic, and diastolic dysfunction.
    The conditions are referred to as the interior nodes, and they split to return
    to a choice which is understood as the leaf.'
