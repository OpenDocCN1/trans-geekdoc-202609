- pgno: 226
  md: '![](img/12e321fe66dd89993b17a8d73b64bd0c_226_0.png)


    Fig. (15). Examples of obstacle recognition (vehicles, doors, pillars, stairs).


    # CONCLUSION


    This study uses four ultrasonic sensors, a visual camera, and a buzzer for the
    smart cane system. The proposed system will help the blind in navigation within
    indoor and outdoor environments without the aid of the guidance of a sighted person.
    Three sensors are used to detect objects in three directions (front, left, right),
    and one is used to detect potholes. The visual sensor is used for the recognition
    of obstacles in the way of smart cane users. Overall, the existing design system
    provides advantages instead of traditional cane. The current proposed model is
    also to be placed on the self-made wooden cane. Improvements could be made to
    ensure the system is more efficient and effective than the currently proposed
    design.


    In the future, we aim to install GPS, which helps the visually impaired person
    in an outdoor location that helps their relatives to find them easily and provide
    a guideline.'
