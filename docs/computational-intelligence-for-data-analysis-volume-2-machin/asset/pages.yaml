- pgno: 38
  md: '# Security Prerequisites


    Security requirements in medicine focus on the security of patient data and the
    communication system between IoT gateways and care advisors, where the possibility
    of data trapping exists.


    **_Confidentiality:_** Confidentiality means an unapproved person cannot access
    a patient''s medical data. Patients'' data can only be accessed by people who
    have the proper permissions. Approved people can only handle or use the data.
    Even eavesdroppers will not be able to get the information. For the benefit of
    both patients and healthcare providers, this is all about keeping things private
    for them.


    **_Authentication:_** Many things go into authentication, like giving each sensor
    device a unique ID to identify another person communicating with them and unlock
    the device when they want to open it.


    **_Availability:_** When an IoT healthcare service needs to be available for as
    long as possible, either by local and global servers or by cloud services that
    can identify and authorize people who need the sensor, even if they try to shut
    down the service.


    **_Data Freshness:_** Data freshness makes sure that it has all of the new data
    added to it every day. Moreover, it ensures that no data or messages are repeated
    or stored in its database and that no advisory repeats old statements.


    # Security Challenges Memory Limitations


    Most IoT-enabled healthcare devices have memory used by system software, an application
    binary, or an embedded operating system to store data. As a result, memory may
    not be enough to run complex security procedures.


    # A Threat Model


    There are many ways for hackers to get into IoT health services, networks, and
    devices because there are many places to attack. The three plotlines in IoT healthcare
    make the services safe for everyone, no matter how they are used. The scenarios
    make it possible for cloud networks, native networks, and cloud services to grow.
    When this is done, it makes sure that there is a way to report between IoT networks
    and devices and between IoT networks and cloud services. The last scenario is
    very clear about the hardware and software limitations of the device.'
