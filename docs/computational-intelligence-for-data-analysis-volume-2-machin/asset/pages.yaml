    Ayumi Yamada [25] develops a method for detecting skull fractures using CT images.
    The image is preprocessed using the morphological operation to extract the bone
    region. From the image of the CT Scout, the cranial vault can be determined. The
    cranium has a low-density cancellous bone between the small, two-layer high-density
    bones. Although compact bone fracture lines are more easily identified than cellular
    bones, three-dimensional (3D) Laplacian filtering is then removed from the bone
