  md: "# ISSUES AND CHALLENGES, AND FUTURE DIRECTIONS\n\nBCI technology has gained\
    \ tremendous attention from the research community, including medical and non-medical\
    \ scientists. The major issues faced within the research domain can be categorized,\
    \ according to Mudgal et al. [68], into three sectors, namely, neuro-psycho-physiological,\
    \ technical, and ethical.\n\n# Neuro-Psycho-Physiological Issues\n\nThe performance\
    \ of the brain is affected by anatomy problems, including the complexity owing\
    \ to the genetic issues and structure, diversity of the brain, and psychological\
    \ problems such as anxiety, fatigue and emotional state, stress, and memory which\
    \ vary from one person to another. These issues have been demonstrated to predominantly\
    \ affect the performance of BCI.\n\n# Technical Issues\n\nThe major challenge\
    \ faced by the BCI system is to select the appropriate components or technology\
    \ related to the application as it is related to the signal. Selection of the\
    \ method to acquire the brain signal and then to process it presents a major challenge.\
    \ Another challenge is educating the operator of the BCI system.\n\n# Ethical\
    \ Issues\n\nThese are related to the safety of the physical and mental, and emotional\
    \ state of the user. The user data is highly confidential and needs to be maintained\
    \ by the system. User consent is another prominent issue related to the BCI system.\n\
    \nIn regard to the technical issues, Mudgal et al. [68] and Vasiljevic et al.\
    \ [69] detail the significant challenges in developing the BCI. Specifically:\n\
    \n+   1. The Non-Linearity characteristics of the brain signal, with the non-stationarity\
    \ behaviour of the signal, presents a key challenge. In addition, noise also aids\
    \ its vital contribution to the challenges of the BCI system.\n+   \n+   2. Another\
    \ technical challenge is the brain signal transfer rate. Currently, the BCIs are\
    \ at an extremely slow transfer rate, and this is a major research topic, especially\
    \ for BCI based on visual stimulus.\n+   \n+   3. The selection of appropriate\
    \ decoding techniques, processing and classification algorithms is a challenge\
    \ to control the BCI system.\n+   \n+   4. Another critical issue is the lack\
    \ of balancing between the training required for"
  merge: -1
  img_proc: true
- pgno: 241
  md: 'the accurate function of the system and the technical complexity of decoding
    the activities of the brain.


    5. There is a need to focus on the BCI system and provide a systematic approach
    for a particular performance metric as there are varied performance metrics, and
    it is a major challenge to select a particular metric for a specific application.


    In addition, the areas which need to be further explored include the long-term
    effects which are not known, technology effects on the life quality of the multiple
    subjects and their relatives/families, the side effects which are related to health,
    such as quality of sleep, functioning of the normal brain and memory, and the
    non-convertible alterations which are made to the brain. Further, there also occur
    multiple legal and social issues which need to be settled, namely, the accountability
    and responsibility which is required to be taken in regard to the influence of
    the BCIs, inaccuracy in the translation of the cognitive intentions, the possible
    changes in the personality, no being able to distinguish between humans and the
    machine-controlled actions, misuse of techniques during the interrogation by authorities,
    the capability and privacy of the mind-reading, and the mind control and emotion
    control related issues. In addition, a major area of concern is the legal responsibility
    which needs to be finalized for scenarios where accidents occur.


    The additional challenge that has emerged is in regard to the response of the
    body to the invasive BCIs, which requires the use of implanted micro-electrodes
    array which come under direct contact with specific neurons within the brain.
    These electrodes are recognised as foreign bodies which trigger the natural immune
    system, and these neurons are surrounded by fibrous capsules of the tissue in
    turn minimizing the signal recording ability of the electrodes, ultimately resulting
    in the BCIs’ unusability. Further, minimizing the power consumption for decreasing
    the battery size and prolonging the lifespan is another key challenge since there
    exists a trade-off between power consumption and efficient bio-security. In this
    regard, for ensuring the bio-security, signals are required to be encrypted, which
    increases the power consumption.


    Further, the major problem in the implementation of the BCI technology is a lack
    of efficient sensor modality which provides safe, accurate, and robust access
    to the brain signals. Also, the development of such sensors, with additional channels
    for improving the accuracy and reducing the corresponding power usage is a major
    challenge. The ethical, legal, and social implications of the BCIs may also slow
    down, stop, or divert this technology into a completely different path compared
    to the initial aim. Lastly, over the last decade, technology related to genetic
    sequencing technology and modern tools to map have aided the increase'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'in understanding the neuronal firing patterns and the manner in which they
    lead to different actions. The brain-interfacing devices are now becoming more
    sensitive, smaller, smarter, and portable over time, and future technologies must
    address the issues which are related to ease of use, performance robustness, and
    cost reduction.


    # CONCLUSION


    The BCI community is conducting much research to provide standardized platforms
    and to assist the complex and non-linear dynamics that BCI systems encounter.
    In this chapter, we have reviewed the most recent studies related to BCI systems.
    We have also presented and detailed the state-of-the-art BCI systems. Lastly,
    we have listed the key issues and challenges in regard to the BCI systems followed
    by some future directions that can enhance the research to be conducted on the
    BCI systems.


