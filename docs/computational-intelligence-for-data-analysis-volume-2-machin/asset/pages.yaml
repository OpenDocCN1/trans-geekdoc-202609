- pgno: 229
  md: '# A Survey on Brain-Computer Interface and Related Applications


    Krishna Pai¹,*, Rakhee Kallimani¹, Sridhar Iyer¹, B. Uma Maheswari², Rajashri
    Khanai¹ and Datta prasad Torse²


    ¹ Department of Electronics and Communication Engineering, KLE Dr. M.S. Sheshgiri
    College of Engineering and Technology, Udyambag, Belagavi, KA, India- 590008

    ² Department of Computer Science and Engineering, Amrita School of Engineering,
    Bengaluru, Amrita Vishwa Vidyapeetham, KA, India- 560035


    Abstract: Brain Computer Interface (BCI) systems are able to communicate directly
    between the brain and computer using neural activity measurements without the
    involvement of muscle movements. For BCI systems to be widely used by people with
    severe disabilities, long-term studies of their real-world use are needed, along
    with effective and feasible dissemination models. In addition, the robustness
    of the BCI systems'' performance should be improved, so they reach the same level
    of robustness as natural muscle-based health monitoring. In this chapter, we review
    the recent BCI-related studies, followed by the most relevant applications. We
    also present the key issues and challenges which exist in regard to the BCI systems
    and also provide future directions.


    Keywords: Artificial Intelligence, BCI, EEG, Machine Learning, MEG.


    # INTRODUCTION


    Brain Computer Interface (BCI) uses the brain''s power to compute to make use
    of relatively new technology. According to Berger [1], research has been trying
    to decode the brain''s signals since the first discovery of electroencephalography
    (EEG) a century ago. Until recently, the development of BCIs was thought of as
    science fiction. BCI system collaborates the brain with an external device that
    uses signals from the brain for performing external activities, such as moving
    a wheelchair, robotic arm, or a computer cursor.'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'There are four main components of a BCI model, namely, the sensing device,
    the amplifier, the filter, and the control system. According to Herwing et al.
    [2] and Jurcak et al. [3], the sensing device comprises a cap consisting of the
    electrodes which are placed according to the international 10–20 standards. Furthermore,
    according to Zhang et al. [4], an amplifier could be one of several biological
    amplifiers available on the market, and the research on BCI is geared toward developing
    a filter and control system that can be applied to brain signals.


    When a person thinks of performing any task, such as moving a cursor, then in
    such a case, signals will be generated in the brain, which is transferred from
    the brain to the finger on the computer’s mouse via the body’s neuromuscular system.
    As the follow-up step, the finger will move the cursor. In contrast, in BCI, such
    signals are transferred to an external device where they will be decoded for moving
    the cursor. As another example, research on BCI also aims to help such people
    who suffer from issues related to damaged hearing and sight and damaged movement.
    An estimated 1.5 billion people suffer from neurological and neuroanatomical diseases
    and injuries worldwide, resulting in movement impairments, which make it difficult
    to communicate, reach, and grasp independently. A cortical prosthetic system consists
    of an end effector, which receives a command for a particular action via a BCI
    that records the cortical activity of individuals who have suffered neurological
    injuries such as spinal cord injuries, amyotrophic lateral sclerosis, and strokes.
    In addition, a BCI decodes information pertaining to the intended function. There
    is a wide range of end effectors in use now, ranging from virtual typing communication
    systems to robotic arms and hands, as well as functional electrical stimulation
    for the reanimation of limbs.


    BCI can be invasive in varying degrees, have varying spatial and temporal resolutions,
    and record a wide range of signals. In BCI applications, such as the low-throughput
    communication spelling systems, EEG, MEG, and fMRI can be used as non-invasive
    brain imaging technologies, according to Speier et al. [5]. Daly et al. [6] enumerated
    several problems associated with these noninvasive BCI approaches, such as the
    fact that they are often slow (e.g., fMRI), have a low spatial resolution and
    are susceptible to being corrupted by external artefacts. Thus, such options are
    not suitable for complex real-time applications like high-performance communications,
    tracking multidimensional robotic limbs, or reanimation of paralyzed limbs with
    coordinated grasps and reaches. An invasive BCI, on the other hand, is able to
    command higher dimensional systems naturally and restore more complex functions,
    as a result of its higher resolution and wider transmission bandwidth.'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'According to Rosenow et al. [7], brain implants are among the most promising
    and popular technologies for assisting patients with motor paralysis (such as
    paraplegia or quadriplegia) caused by strokes, spinal cord injuries, cerebral
    palsy, and amyotrophic lateral sclerosis (ALS). Similarly, eye tracking can be
    used to control external devices by paralyzed people, but this tech has numerous
    drawbacks, as it relies on cameras or electrodes on the face to record eye movements
    or electrical signals, such as electrooculography (EOG). As a result of BCI, neural
    commands are delivered to external devices by translating human brain activity
    into external actions, according to McIntyre et al. [8], Chen et al. [9], and
    Donoghue [10]. While BCI is most often used to help disabled individuals with
    motor system disorders, it is also very helpful to those with healthy motor systems
    as well as the elderly. The development of intelligent, adaptive, and rehabilitative
    BCI applications for adults and geriatric patients will enhance their relationships
    with their families, improve their cognitive and motor skills, and help with household
    tasks. BCIs are generally regarded as mind-reading technologies, but this does
    not hold true in most cases. As opposed to mind readers, BCIs provide the user
    with control by using brain signals rather than muscle movements, so they don''t
    extract information from unknowing or unwilling subjects. A BCI and a user are
    thus working together through training sessions which involve the user generating
    brain signals that inform the BCI of the intended action, and the BCI converting
    the signals into instructions that the output device is supposed to carry out.


    As per the aforementioned, the research community faces numerous challenges in
    the implementation of BCI devices. Specifically, it is required that the electrodes
    and the surgical methods used in the BCI process are minimally invasive, which
    has resulted in much research focus on the non-invasive methods of brain-computer
    interfacing.


    In this chapter, we survey the recent research on BCI and its related applications.
    The related works are detailed in Section 2. Section 3 discusses the most relevant
    applications of BCI. In Section 4, we highlight the main challenges in regard
    to BCI and propose the relevant directions. Finally, Section 5 concludes the chapter.


    # RELATED WORKS


    Any human being usually produces a wide range of signals at any point in time,
    from the eyes, ears, nose, and other sensory organs in the body. These signals
    travel to the brain via the nervous system. The cerebral lobes play an important
    role for humans or animals when understanding perception, thoughts, language,
    and memory, and thus EEG sensors, NIRS detectors, etc., are used to acquire neural
    signals. With the help of these signals, the brain activity of a human or an'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'animal is understood via brain activity measurement algorithms. Fig. (1) demonstrates
    the detailed BCI interface from which it can be seen that during the process of
    signal acquisition, pre-processing of the signal is carried out, which includes
    filtering, sampling and artefact removal, as described by Cao [11]. Using these
    pre-processed data, the feature extraction process is carried out, following which
    classification algorithms or Convolutional Neural Network (CNN) classifiers can
    be used to understand the neural controls which are required for various applications
    such as medical gaming education, etc. Further, these neural controls are provided
    as sensory feedback back to the brain in view of understanding whether the activity
    which was carried out by the neural control is as desired or not. In this regard,
    the survey in this chapter is mainly focused on the various types of classification
    algorithms / CNN classifiers which can/have been implemented for the processing
    of neural signals, and, therefore aid in obtaining the neural controls.


    ![](img/12e321fe66dd89993b17a8d73b64bd0c_232_0.png)


    Fig. (1). Block diagram of BCI interface.


    The EEG data which is obtained from the brain in the form of neural signals, have
    multiple channels. Singh et al. [12] have used single-channel EEG data for developing
    a prototype using the Internet of things (IoT) and BCI technology. The prototype
    is developed using MATLAB software, where the classifiers are trained using the
    Weighted K-Nearest Neighbor Algorithm (Wk-NN). An Arduino microcontroller is used
    as the hardware platform. The authors have demonstrated that, towards the end
    of prototyping, a low-cost and highly accurate system can be guaranteed which
    can control the environment. The authors are also able to fetch and provide data
    to the cloud through If This Then That (IFTTT). The classifiers used in this article
    are the cognitive state classifier and event-related potential ERP classifier
    using the Wk-NN algorithm. An accuracy of 95% with 3100 observations per second
    and an accuracy of 98.3% with 1800 observations per second is achieved by opting
    for the cognitive state classifier and ERP classifier, respectively.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'In general, the classifier algorithms depend on the features which are abstracted
    from the data that has been collected from the neural signals. There are multiple
    feature extraction techniques available in the literature, and one such feature
    extraction technique is the flexible analytic wallet transform (FAWT) method.
    In [13], Chaudhary et al. used the FAWT technique to divide the EEG signals into
    their sub-bands thereby extracting the movement-based features. Subspace KNN is
    one of the best classification methods which is known to have reached an accuracy
    level of 99.33%. The authors have also used other classification methods, such
    as support vector machines (SVM), decision trees, Linear Discriminant Analysis
    (LDA) and standard KNN, which have obtained a large spectrum of results. Specifically,
    an accuracy of 95.72%, 92.8%, 91.79% and 81.1% is obtained by SVM, standard KNN,
    decision tree and LDA, respectively. The authors have also considered accuracy,
    specificity, kappa value, f1-score, and sensitivity as the performance parameters.


    Jin et al. [14] have shown that extreme learning machine (ELM) is more efficient
    than SVM, considering the benchmark performance. They also state that the performance
    of ELM is highly proportional to the number of hidden nodes, which are also known
    as the network structure of ELM. Sparse Bayesian ELM-based algorithm (SBELM) is
    shown to exhibit high characterization accuracy on EEG signals. During the comparative
    study, it was observed that accuracy of 76.3%, 77.1%, 77.8% and 78.5% is obtained
    via SVM, ELM, BELM and SBELM, respectively. Lastly, the authors have stated that
    the proposed model can be further improved by adding more distinctive and high-level
    attributes.


    An accuracy level of 95% is obtained using the linear regression method on the
    equation-based electroencephalogram model by Yi et al. [15]. The basic machine
    learning model can be further improved by applying various methods such as systolic
    matrix multiplication, inversion, and vector multiplication. The proposed algorithm
    consists of a normal equation that undergoes many mathematical computations to
    obtain the output. The development environment in the study is built based on
    docker technology. According to Zheng et al. [16], when deep learning and ELM
    are combined, in addition to an improvement in a Long Short Term Memory network
    (LSTMs) and bagging algorithm, a classification model is formed, which is known
    as LSTMS-B. This new classification model consists of Swish activation. In the
    study, an intelligent visual classification is observed with an accuracy of 97.13%
    with 40 classes. Additional image categories are required for a sophisticated
    technique to distinguish the EEG signals.


    Chen et al. [17] have used the temporal-spatial CNN model, which consists of two
    separate sets of layers, namely, the classification layer and the feature extraction
    layer. It is observed that a separate set of data is required for training the
    feature'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'extraction layers and the classification layers separately. The model provides
    an overall classification accuracy of 65.7% when spatial filtering is used for
    feature extraction. The performance observed in this study is found to be comparatively
    better compared to existing classic models. Deep learning models for the BCI interface
    demand a huge amount of data for highly accurate classification results. However,
    in a general scenario, there is huge data scarcity, so the developed model cannot
    operate at its full potential. To solve this issue, Zhang et al. [18] have proposed
    a method to generate artificial brain signals which can act as supplementary data
    along with the actual data. The authors also propose the Deep Convolutional Generative
    Adversarial Networks (cDCGAN) method for data augmentation, which is evaluated
    on the Convolutional neural network (CNN) model for corresponding classification
    performance. The CNN classification model is shown to acquire accuracy of 82.86%,
    82.86% and 82.14% by employing the actual EEG data, artificially generated EEG
    data and mixed EEG data, respectively.


    The authors [19] have proved the superiority of deep learning-based classification
    techniques over the existing traditional classification techniques. Five class
    steady-state visual evoked potential datasets (SSVEP) are used in this study,
    and a detailed comparison is provided between the CNN and the recurrent neural
    networks (RNN) using the LSTM architecture. The authors have proved that CNN demonstrates
    the highest accuracy of classification, corresponding to 69.3%, whereas the traditional
    classification algorithm, i.e., SVM with Gaussian kernel, achieves a classification
    accuracy of 66.9%.


    Rasheed [20] provides a comprehensive review of the role of ML in BCI; the authors
    have provided a detailed ML method focusing on mental state detection, state categorization
    and emotion classification. EEG signal classification, event-related potential
    signal classification, motor imagery categorization and limb movement classification.
    The methods such as Common Spatial Pattern (CSP), Principal Component Analysis
    (PCA), Independent Component Analysis (ICA), Autoregressive (AR) Method, Wavelet
    Packet Decomposition (WPD) for feature extraction and selection are explored.
    Detailed Classification methods such as K-Nearest Neighbor (KNN), Linear Discriminant
    Analysis (LDA), Naive Bayes, Extreme Learning Machine (ELM), Support Vector Machine
    (SVM), and Neural Networks (NNs) are reviewed. The Neural Networks are studied
    in detail for Multilayer Perceptron (MLP), Artificial Neural Networks (ANN), and
    Convolutional Neural Networks (CNN).


    Al-Nafjan et al. [21] performed a comprehensive review of development in emotion
    detection and classification. The authors have provided a deep insight in reviewing
    the published articles focusing significantly on the recognition of'
  merge: -1
  img_proc: true
