    # FUTURE PANDEMIC PREDICTION


    Despite being the greatest epidemic in modern memory, this pandemic occurred during
    the digital age. As a result, every component of the analysis can now be represented
    in terms of data, including at the macro level, logistically, and physiologically;
    this will undoubtedly be useful in forecasting the behavior of this current pandemic
    or unknown future pandemics. It has been documented that AI techniques have the
    potential to be applied to COVID-19 genome sequences to retrieve valuable info
    about the organism. When it comes to pattern analysis, effective computer-based
    tools are available that allow people, especially bioinformaticians, to examine
    difficult genetic and genomic data sets that are large and complex. Algorithms
    have been devised for the analysis of mutations in genome sequences, which are
    used to locate sites in genome sequences where the nucleotide bases change and
    quantify the mutation rate. Thus, Sequential pattern mining (SPM) data can be
    used to reveal new about virus pathogenicity, clinical'
