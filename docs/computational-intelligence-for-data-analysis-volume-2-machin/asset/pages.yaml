- pgno: 278
  md: "Stake (PoS), Proof of Importance (PoI), Byzantine Fault Tolerance (BFT), and\
    \ Proof of Elapsed Time (PoET) [13].\n\nIn Blockchain, each block stores the hash\
    \ value of its Block and the previous block hash. Any changes to any block generate\
    \ a different hash result. The Blockchain network can easily track these manipulated\
    \ blocks, and manipulated blocks get discarded. To change any block, one has to\
    \ change the current block hash and all hash values of all forward blocks. An\
    \ attacker could change the block value of any single node, but to reflect changes,\
    \ the attacker has to change the Blockchain of more than 51% of nodes, which is\
    \ almost impossible to do without being caught. As Blockchain is distributed,\
    \ each node maintains a separate copy of Blockchain. It is also tough to do so\
    \ because it requires a massive amount of computing resources, and the cost of\
    \ doing so would be huge.\n\n# How Does Blockchain Address Privacy Issues?\n\n\
    The Blockchain supports anonymity and eliminates the need for a trusted third\
    \ party, but anonymous transactions could be troublesome if this technology is\
    \ used for wrongdoing. This is the biggest concern of various law enforcement\
    \ authorities, but there are ways to address it without compromising anonymity\
    \ using Blockchain technology. Without revealing the private key, a wallet application\
    \ only exposes the wallet address, not the private key or any personal identity\
    \ of the wallet holder, to protect the privacy of wallet owners. The wallet application\
    \ providers can facilitate the Know Your Customer (KYC) process and issue digital\
