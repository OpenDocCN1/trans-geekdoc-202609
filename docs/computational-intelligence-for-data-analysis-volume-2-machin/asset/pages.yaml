    # FUTURE ADVANCES & CHALLENGES


    Machine learning techniques like supervised, unsupervised, and reinforcement have
    greatly changed the healthcare industry. Quality of service is improved due to
    technological inventions to modernize the healthcare field. ML in health technologies
    has given deep information to improve treatment methods. While, due to cognitive
    computing identification of different diseases can be easily treated in a better
    way. Drug discovery, medical imaging, behavioral medicines, a database for healthcare
    records and data collection will be improved with the help of machine learning
    algorithms [31]. However, AI-based telemedicine will give new directions to the
    entire world [32]. Moreover, unmanned aerial vehicles are widely used during COVID-19
    to send medical equipment and maintain physical distancing.


    With the usage of new technology, some of the problems to a normal human being
    exist. People should update their knowledge about every subject, especially healthcare,
    as information technology has improved.


    # CONCLUSION


    The role of machine learning algorithms has a direct impact on the internet of
    medical things. Therefore, machines are trained to give an optimal prediction
    for illness or disease. AI-based tools have advanced the way of treatment. Also,
    IoMT is a combination of the internet of things and the medical field. This research
    paper gives knowledge related to big data, AI, machine learning, cyber-attacks,
    and various applications related to IoMT. In addition, future directions and challenges
    are incorporated, which is very much helpful for engineers, scientists, researchers
    and practitioners. AI, ML and meta-heuristic search algorithms will be deployed
    in the future to enhance communication within IoMT.


