    The authors used IR-UWB technology because the authors claimed that IR-UWB low-power
    discrete time-based narrow pulses. IR-UWB has a lot of merits with respect to
    continuous carrier-based technology, using this technology transceiver architecture
    structure is very simple, has high data rate, and low energy per bit.


    Manchi et al. [32] proposed an analysis of CSMA/CA under a non-saturation load.
    In this research, the author found four customer priorities instead of eight priorities
    to achieve the most stringent requirement for WBAN performance. The authors had
    shown in the results better performance using the authors'' proposed research
    technique. In IEEE 802.15.6 EAP and RAP, time periods are inefficient using bandwidth.
    At the start of the RAP time period, the frame collision probability has increased.


    Rashwand et al. [33] proposed aware interference and energy in WBAN. This research
    was based on nodes'' mobility within the network with respect to the comparative
    movement to each other. The authors claimed that they reduced the transmission
    time, interference, energy consumption, and network power consumption when nodes
    are moving and increased the signal strength, and traffic load, and higher packet
    delivery ratio. The authors proposed an adaptive interference mitigation scheme
    when nodes move. Moreover, two schemes (interference reduction and avoidance)
    have been used in this research. In the Interference reduction scheme, data can
    be sent to the receiver using different power, and data rates. In the interference
    avoidance scheme, the coordinator assigned orthogonal channels to every node in
    a network.


    Movassaghi et al. [35] researched in output as well as the presentation of IEEE
    802.15.6. The authors have researched the mathematical formula and found the highest
    output with lesser delay limits in IEEE 802.15.6. The limitation has been derived
    using a lot of frequency bands as well as data rates. The authors claimed that
    this research has been very helpful to the new researcher who works on IEEE 802.15.6.
    The authors used 420-450 MHz, 863-870 MHz, 902-928 MHz, and 2360-2400 MHz to complain
    about the results. Annexure A has explained a comparison of the interference mitigation
    scheme (Table 1).'
