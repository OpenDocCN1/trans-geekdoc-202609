- pgno: 98
  md: '# CONCLUSION


    The Internet of Medical Things (IoMT) uses internet computer networks to connect
    medical equipment and apps to healthcare IT systems. In IoMT, coexistence can
    be fatal to delay or packet loss, indicating serious cases of WBAN applications,
    especially in health systems that make patient reporting potentially significant.
    In this white paper, we conduct a detailed analysis of the issues of a comprehensive
    review and coexistence and mitigation of the WBAN technologies. Three major wireless
    WBAN technologies, ZigBee, IEEE 802.15.6, and low-power Wi-Fi, are considered.
    We studied the WBAN mitigation method. Coexisting WBANs have been modified to
    interfere with the classification and accurate correlation between existing WBAN
    interference mitigation schemes. Although many interference mitigation plans have
    been reported, none of the advantageous systems is much superior to other systems.
    The dynamic channel WBASN requires a compromise between network bandwidth and
    power WBASN. When designing interference, you also need to consider channel dynamics,
    QoS, latency, reliability, and network lifetime. Since WBASN performance and QoS
    are very noise-sensitive, different algorithms to mitigate interference are to
    be developed in the future. Inter-block interference prevention design is one-way.
    QoS requirements have not been adequately investigated, and it is important to
    note performance, which is reduced using existing methods to reduce the noise
    of some biomedical applications.


