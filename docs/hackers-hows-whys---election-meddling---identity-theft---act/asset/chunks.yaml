    在未来的物联网时代，万物都将相互连接，这种共享的共享将对我们的生活方式产生巨大影响。商店将对你的出现做出反应，为你提供量身定制的优惠。汽车将接收交通状况的实时数据，并自动重新规划以避免拥堵。供水系统将利用来自世界各地——乃至太空——传感器的长期天气预报，以确保全年的用水的可持续性。


    ![Image](img/f0082-01.jpg)


    ### 人工智能


    物联网的预期效益很大程度上依赖于人工智能（AI）。人工智能有两种看待方式。弱人工智能（Narrow AI）学习如何非常出色地完成某件事，通常比人类做得更好，但无法学习程序范围之外的内容。相比之下，强人工智能（Strong
    AI）知道自己不知道什么，并能推算出为了实现目标需要学习什么。通过这种方式，强人工智能（仅存在于科幻中）就像人类的 EI（进化智能）。


    ## 计算未来


    计算面临着一个问题。在整个历史过程中，计算机的速度和力量一直在增长。曾经仅用于尖端设施的快速处理器现在已进入我们所有的设备中。今天，口袋大小的设备就能让我们与地球上任何地方的任何人连接——甚至是在轨道上！然而，我们对更多处理能力的无法无法永远得到。我们必须找到一种新的计算方式。


    ### 摩尔定律


    1965 年，英特尔微芯片公司的格尔登·摩尔预测，微芯片上的元件数量，因此计算机处理的数据量，每 18 个月就会翻倍。到目前为止，摩尔定律被证明在很大范围内是正确的。如果没有限制，到
    2050 年代，计算机芯片的处理能力将相当于地球上所有人类大脑共同工作的总量。目前，摩尔定律预计将在 2025 年前被打破。


    ![Image](img/f0084-01.jpg)


    ### 量子计算


    硅晶体管通过开启（1）或关闭（0）来保存信息。量子计算将放弃硅，利用原子或分子的量子属性——它们的自旋方向、磁性和电荷——来记录信息。粒子的量子属性很难确定，因此最好通过概率来理解。例如，自旋方向为“向上”的概率可能是
    0.7，那么“向下”的概率就是 0.3。硅片上的开关只能存储一个信息单元或“比特”，即 1 或 0。而量子比特（或“qubit”）同时持有两份信息（0.7
    和 0.3）。一台 32 位的计算机一次处理 32 位比特的信息，但一台 32 位的量子计算机一次持有 4,294,967,296 位比特。你可以看到量子计算未来如何制造出非常强大的处理器。


    ## 基因黑客


    黑客始于模型铁路，并产生了世界上最大的计算机和软件公司。黑客影响了从新闻到艺术的许多领域，甚至是金钱的运作方式。然而，未来最重大的黑客可能会针对我们自己的身体。现在的技术已经可以黑进
    DNA 来修复问题或赋予你的身体新能力——并改变后世后代将继承的基因。但我们应该黑进基因吗？这正确吗？


    ### CRISPR


    主要的基因黑客技术被称为`CRISPR Cas9`。它利用细菌用于切割病毒 DNA 的防御系统。`CRISPR`系统已被黑客破解，可以被重新编程以在非常精确的位置切割任何
    DNA，包括人类 DNA。可以添加一段新的 DNA 来重新连接断裂的末端，加入新的遗传信息，从而黑入基因使其以不同的方式运行。


    ### 克隆


    `Cloning` 是一种通用的黑客手段，创建一个与其单一亲本完全相同的婴儿动物。最著名的克隆动物是 1996 年出生的多利羊。克隆人类是违法的——甚至可能是不可能的——这在很大是因为大多数克隆尝试都以严重的发育问题告终。多利是
    277 次产生克隆的尝试中唯一的幸存者。


    ![Image](img/f0086-01.jpg)


    ### 干细胞疗法


    体内的每个细胞都是专门的——例如，我们有血细胞、骨细胞和肌肉细胞。它们都源于一种强大的起始细胞，即干细胞，但一旦特化，细胞就无法变成另一种形式。医生已经发现了如何黑进某些身体细胞并将它们变回这些干细胞。干细胞随后可以用于生长新器官、愈合神经并修复目前无法治愈的其他损伤。


    ## 优缺点


    现在我们已经游览了计算机技术和黑客的世界，你对大数据、量子计算和人工智能所承诺的未来感到兴奋吗？你想了解更多关于加密货币、区块链和物联网的信息吗？或者你对黑客攻击的风险感到恐惧，并被假新闻所困扰？有很多内容需要吸收和权衡。思考我们理解道德和伦理的不同方式（即我们用来区分好坏的系统）可能会帮助。


    ### 结果


    一种伦理学派可以用一句话“结局皆好”来总结。这种理解好坏的方法关注的是某人行为的结果。想象一对双胞胎。一个发生了车祸并伤了行人，而另一个无无无事地停车。这位驾驶员犯的错比他的双胞胎兄弟多吗？


    ![Image](img/f0088-01.jpg)


    ### 德性


    这种理解好坏的古老方法可以追溯到古希腊。良好的行为取决于一个人拥有良好的品质，例如慷慨、善良和耐心。糟糕的行为使用糟糕的品质并导致不快乐。但德性伦理允许人们将让他们感到快乐的事视为应该做的事。


    ### 义务


    道德意味着即使遭受痛苦，也要做正确的事。好坏取决于你做了什么，而不是这样做之后发生了什么。良好的行为源于显而易见的义务，例如帮助痛苦中的人们。什么让你感到快乐的事。


    ### 相对主义


    这组观点告诉我们，好坏随着社会的改变以及对世界及其如何有效控制世界的了解增加而改变。只要对整个社会有利，任何行为都是可以接受的。如果你可以进行某种行为而不受社会的谴责，那么这种行为就是良好的行为。这意味着过去犯罪的行为在今天可能是被允许的，在一个国家可能是正常的行为在另一个国家可能不是。


