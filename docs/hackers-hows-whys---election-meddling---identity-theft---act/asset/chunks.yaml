- raw: "    In the 1560s, Queen Elizabeth I of England imprisoned her Catholic cousin\
    \ Mary I of Scotland because she feared that she might usurp the English throne.\
    \ When Mary’s letters to her conspirators were discovered, Elizabeth’s cryptographer,\
    \ Thomas Phelippes, decoded them to reveal her plot. Mary used a homophonic cipher,\
    \ where one plaintext letter was shown by several possible ciphertext symbols.\
    \ It was also a nomenclator system, where frequently used names—Elizabeth, Mary,\
    \ Spain—had their own symbols. This made frequency analysis difficult. It took\
    \ Phelippes several months to break in, but he did so by identifying common English\
    \ phrases. For example, letters generally start and end in the same way: “Dear…”\
    \ and “Yours…,” so he started here and found out that Mary wanted King Philip\
    \ of Spain to invade England and kill Elizabeth. Once the code was cracked, Mary\
    \ was executed.\n\n    ![Image](images/f0014-01.jpg)\n\n    ### TELEGRAM HACK\n\
    \n    In 1917, the United States was considering joining World War I (1914–18)\
    \ as France and Britain’s ally. The German foreign minister sent a telegram (a\
    \ letter sent via telegraph) to Mexico asking them to invade the United States\
    \ to stop US troops from coming to Europe. In return, Mexico would get back Texas\
    \ and other territories the United States had taken. The Germans couldn’t send\
    \ messages to Mexico (all the telegraph cables went via Britain) but they could\
    \ send a few coded signals to the United States. These coded messages were meant\
    \ for peace talks, but the Germans tricked an American official into sending on\
    \ the Mexican telegram, still hidden by its code. Today’s hackers use a similar\
    \ technique called a Trojan Horse to hide malicious deeds inside a seemingly useful\
    \ task (see more shown [here](#ch09.xhtml#page_31)). The Mexicans refused to join\
