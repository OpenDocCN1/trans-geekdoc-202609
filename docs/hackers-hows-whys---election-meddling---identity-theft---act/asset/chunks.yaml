    83. 82\n\n# 作者的话\n\n## 什么是黑客？\n你认识黑客吗？你也是黑客吗？（这是一个秘密吗？）黑客是一个引人入胜的话题，但它是什么？电影和电视里的黑客躲在房间里快速打字，他们通常是古怪的人，很少是故事的主角。在现实生活中，那些关于秘密或金钱被盗的新闻报道中充斥着黑客的面孔。所以，黑客总是古怪、胆怯或狡诈吗？让我们来寻找答案。\n\
    \n## 命名\n## \n## 那么，黑客有什么问题吗？黑客和网络世界正在扩张到我们生活的各个领域；艺术、金钱、政治以及我们交流的方式。这听起来是你需要了解的。我很抱歉无法给你任何简单的答案，但这本书将为你解释情况，尽管如此，黑客的对错并不总是清晰的。\n\
    ## ## 你怎么想？\n## 你的朋友怎么想？\n## 你的父母怎么想？\n## 老师怎么想？\n## 每个人都有观点，但并非所有人都有明智的观点。通过这本书，你将拥有支持自己论点的知识。\n\
    ## \n## 那么，黑客有什么问题吗？\n## \n## \n## \n## \n## \n## \n“Hack”意味着粗略地切割。它在 1955 年首次用于现代意义，不是针对计算机，而是模型铁路。马州理工学院（MIT）技术模型铁路俱乐部的成员正在设法为轨道提供更多电力，并在火车运行时不断快速且粗略地修改——往往会导致电路过载。这被称为黑客，而这些模型火车爱好者就是第一批黑客。“黑客”一词指的是为了研究技术看看它能否运行得或以其他方式工作的人——但在此过程中可能会破坏它。\n\
    \n## \n## \n## 定义\n到 1975 年，计算机科学家们发明了一套全新的语言，他们将其记录在《术语表》（Jargon File）中：一份技术俚语列表。《术语表》对“黑客”有多种定义。以下是主要的定义：\n\
    \n**喜欢探索编程系统细节并扩展其功能的人**，而不是大多数只想学习最少知识的用户。\n\n"
