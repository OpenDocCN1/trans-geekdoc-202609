    Robert Morris spread a worm that shut down 10 percent of the network that is now
    called the Internet. In those days, that meant attacking just 6,000 computers.
    Even so, Morris’s stunt caused $15 million in damages and he lost his job at Cornell
    University. In response, the US government set up `CERT` (Computer Emergency Response
    Team) to protect against similar computer attacks.


    # HELLO INTERNET


    The Internet is a network of computers. More correctly it is an “internetwork”
    that connects many separate computer networks. Exactly what that means has become
    blurred in the 50 years that the Internet has existed. The Internet connects billions
    of devices—several for every person on the planet—not just computers, phones,
    and tablets, but TVs, cars, weather stations, lamp posts, fridges, and ovens.
    And all these devices could be hacked.


    ![Image](images/f0022-01.jpg)


    ## MILITARY PROJECT


    The Internet began as a military defense project. By the 1960s, military commanders
    were developing systems that relied on computers and telecommunications to control
    their forces. The military realized that the enemy could gain a huge advantage
    if they were able to sever these communications—and to do that they just needed
    to cut one cable. The `ARPANET` (Advanced Research Projects Agency Network) was
    set up to keep communications safe even during the worst attacks.


    ## PACKET SWITCHING


    `ARPANET` used a system called “packet switching,” in which a message is broken
    into chunks or “packets.” Each packet has a header code which says where it’s
    from, where it’s going, and how it fits together with the other packets. Each
    packet makes its own way to its destination through the network. The receiving
    computer assembles the packets and sends back a message requesting any missing
    packets to be resent. This is how everything from videos to text messages are
    sent through the Internet today.


    ## SWITCH ON


    `ARPANET` was switched on in 1969. At first, it connected just four US universities,
    mostly in California, but it steadily spread and, by 1973, other countries were
    connected. In the 1980s, the military built a separate system, and `ARPANET` was
    connected to the telephone networks used by the public. By the late 1980s it had
    become known as the Internet.


    ![Image](images/f0022-02.jpg)


    ## THE WEB


    In the early days, the Internet was all about File Transfer Protocol, the `FTP`,
    used for sending and receiving computer files quickly and securely. However, in
    1989, Tim Berners-Lee, a British computer scientist working at `CERN` (the European
    Organisation for Nuclear Research), found the system hard to use. He came up with
    the idea of a web of information—a world-wide web—where users could look at publicly
    available files on an Internet-connected computer.


    ## WYSIWYG GUI


    The rise of the Web went hand in hand with the `GUI` (goo-ee)—the “graphical user
    interface.” Instead of blinking green text on a black screen, users now had a
    virtual desktop, with files and documents that could be opened and moved around.
    Users used to control a computer by typing code, but now they clicked onscreen
    graphics using a mouse. The `GUI` made it possible for computing to be `WYSIWYG`
    (wiz-ee-wig), or “what you see is what you get.” So a typed document appeared
    on screen as a white page with printed text and pictures—just like the real thing.


    ![Image](images/f0024-01.jpg)![Image](images/f0024-02.jpg)


    ## HYPERLINKS


    Berners-Lee’s World Wide Web of information could link one web page to the next
    with clickable “hyperlinks.” Documents with a hyperlink are written in `HTML`
    (hypertext mark-up language), again developed by Berners-Lee, but the idea for
    hyperlinks was the brainchild of Vannevar Bush, a computer pioneer in the 1940s.
    Some 1980s software applications used links, but Berners-Lee’s idea to connect
    the links through the Internet changed history—and we’ve been surfing the Web
    ever since.


    # MAKING CONNECTIONS


    Time to get better acquainted with your computer hardware, and begin to see it
    like a hacker does: a series of devices that provide a connection to your computer
    and your information. A computer is composed of `hardware` and `software`. The
    hardware is the physical stuff. The software is the invisible instructions that
    tell the hardware what to do. A hacker knows how to take control of the hardware
    or software.


    ## YOU AND THE CPU


    A computer receives an `input` from you, the user. It uses the instructions in
    its software programming to convert that input into an output. For example, pressing
    the “H” key on the keyboard results in an `:h` appearing on the screen. The `CPU`,
    or central processing unit, is the chunky microchip “brain” that does this work.
    Everything else in the hardware setup is there to give the `CPU` what it needs
    to do its job.


    ![Image](images/f0026-01.jpg)


    ## INPUT HARDWARE


    These are the devices that collect inputs from the user. The most obvious ones
    are the keyboard, mouse, and touchscreen, which convert the pressure of your fingertips
    into commands that the `CPU` can understand. Other inputs come from a camera or
    scanner, which create digital versions of a physical object, and increasingly
    we are controlling our devices via sound inputs picked up by a microphone.


    ## OUTPUTS


    After the `CPU` has done its job, it will present an `output` to another piece
    of hardware. The one we all think of first is the computer display, or monitor,
    which shows the text, pictures, video, or whatever we want from our device. A
    loudspeaker allows for sonic outputs—you might call that music (but Grandad will
    disagree). Meanwhile, a printer produces a hard copy of what’s on screen, or perhaps
    a solid 3D version.


    ## NET CONNECT


    The Internet can do everything: it is an input (a streamed video of cats from
    Gran), an output (an email thanking Gran), and storage (pictures of Gran’s cat
    stored on the Cloud). This is what makes the Internet so amazingly useful and
    why it has transformed society. However, that great power comes with big risks.
    How can your computer be wide open to what the Internet offers but be secure at
    the same time?


    ## GOING WIRELESS


    Today most Internet connections are wireless, and there are two main types. `WiFi`
    is a radio connection with a modem somewhere nearby. The technology is super smart.
    It can work out whose signal is whose among a jumble of radio waves. The second
    wireless connection is mobile internet (such as `3G` or `4G`). Your phone works
    like a walkie-talkie, exchanging radio signals with a nearby mobile tower, which
    is hardwired to the Internet.


    ## SECRETS IN PUBLIC


    Out in the Internet, your communications are public. This is where encryption
    is required. Let’s say you want to buy something online. If your payment details
    were public, a hacker could use them to buy stuff for themselves—only you’d pay.
    Your payment details are encrypted, or made secret, using a numerical padlock
    which would take the world’s biggest computers thousands of years to decode. Even
    if a hacker was watching the whole thing, your secret is very safe.


    # HACKING TECHNIQUES


    Hackers are computer nerds and confidence tricksters rolled into one. Some hack
    attacks are high-tech actions that use in-depth knowledge of the software that
    controls computers and the Internet. Other hacks prey on the way people think
    to play tricks on them. The simplest hack of all is to just ask someone for their
    passwords! However, most hacking techniques are a mixture of software skills and
    social trickery, and hackers like to give them weird names. Let’s take a look.


    ### MALWARE

