- raw: "    Robert Morris spread a worm that shut down 10 percent of the network that\
    \ is now called the Internet. In those days, that meant attacking just 6,000 computers.\
    \ Even so, Morris’s stunt caused $15 million in damages and he lost his job at\
    \ Cornell University. In response, the US government set up CERT (Computer Emergency\
    \ Response Team) to protect against similar computer attacks.\n\n    ## HELLO\
    \ INTERNET\n\n    The Internet is a network of computers. More correctly it is\
    \ an “internetwork” that connects many separate computer networks. Exactly what\
    \ that means has become blurred in the 50 years that the Internet has existed.\
    \ The Internet connects billions of devices—several for every person on the planet—not\
    \ just computers, phones, and tablets, but TVs, cars, weather stations, lamp posts,\
    \ fridges, and ovens. And all these devices could be hacked.\n\n    ![Image](images/f0022-01.jpg)\n\
    \n    ### MILITARY PROJECT\n\n    The Internet began as a military defense project.\
    \ By the 1960s, military commanders were developing systems that relied on computers\
    \ and telecommunications to control their forces. The military realized that the\
    \ enemy could gain a huge advantage if they were able to sever these communications—and\
    \ to do that they just needed to cut one cable. The ARPANET (Advanced Research\
    \ Projects Agency Network) was set up to keep communications safe even during\
    \ the worst attacks.\n\n    ### PACKET SWITCHING\n\n    ARPANET used a system\
    \ called “packet switching,” in which a message is broken into chunks or “packets.”\
    \ Each packet has a header code which says where it’s from, where it’s going,\
    \ and how it fits together with the other packets. Each packet makes its own way\
    \ to its destination through the network. The receiving computer assembles the\
    \ packets and sends back a message requesting any missing packets to be resent.\
    \ This is how everything from videos to text messages are sent through the Internet\
    \ today.\n\n    ### SWITCH ON\n\n    ARPANET was switched on in 1969. At first,\
    \ it connected just four US universities, mostly in California, but it steadily\
    \ spread and, by 1973, other countries were connected. In the 1980s, the military\
    \ built a separate system, and ARPANET was connected to the telephone networks\
    \ used by the public. By the late 1980s it had become known as the Internet.\n\
    \n    ![Image](images/f0022-02.jpg)\n\n    ### THE WEB\n\n    In the early days,\
    \ the Internet was all about File Transfer Protocol, the “FTP,” used for sending\
    \ and receiving computer files quickly and securely. However, in 1989, Tim Berners-Lee,\
    \ a British computer scientist working at CERN (the European Organisation for\
    \ Nuclear Research), found the system hard to use. He came up with the idea of\
    \ a web of information—a world-wide web—where users could look at publicly available\
    \ files on an Internet-connected computer.\n\n    ### WYSIWYG GUI\n\n    The rise\
    \ of the Web went hand in hand with the GUI (goo-ee)—the “graphical user interface.”\
    \ Instead of blinking green text on a black screen, users now had a virtual desktop,\
