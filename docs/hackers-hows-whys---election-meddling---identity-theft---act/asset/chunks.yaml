- raw: "    A surveillance camera can’t see everything and its footage might give\
    \ the wrong impression about an event. Some private citizens carry their own cameras\
    \ to record more accurate accounts of a situation. For example, cyclists wear\
    \ helmet cameras in case they get into an accident. This is “sousveillance.” It\
    \ means to watch from underneath (sous means “below” in French).\n\n    ![Image](images/f0051-01.jpg)\n\
    \n    ## THE WHISTLEBLOWER\n\n    In June 2013, American intelligence official\
    \ Edward Snowden told the world what the spying agencies in his country and others\
    \ were doing. As a computer expert, Snowden knew many techniques used by intelligence\
    \ agencies to hack into foreign communication systems and listen in to just about\
    \ any conversation in the world. To escape arrest in the United States, he moved\
    \ to Moscow, Russia, where he still lives today.\n\n    ![Image](images/f0052-01.jpg)\n\
    \n    ### WHY DID HE DO IT?\n\n    Edward Snowden says he is a US patriot. The\
    \ reason he “blew the whistle” was that he believed the US intelligence services\
    \ had too much power. Even if the current intelligence system is working for the\
    \ greater good today, Snowden questioned what would happen if that changed in\
    \ the future and spying tools were used against ordinary people. He decided he\
    \ needed to tell everyone what was going on so they could make up their own minds.\n\
    \n    ![Image](images/f0053-02.jpg)\n\n    ## WHOSE DATA IS IT?\n\n    not only\
    \ is our data at risk from hackers, the government is also collecting it—although\
    \ almost certainly not reading it. However, there are other bodies out there who\
    \ are very interested in our data. We are supplying information about ourselves\
    \ all the time, about where we are, who we are with, what we spend money on, and\
    \ what we think. To the Internet giants that kind of information is very valuable\
    \ indeed.\n\n    ### THE COST OF FREE\n\n    Many of the services we use on the\
    \ Internet are free. Searching the Web with Google, connecting with friends on\
    \ Instagram, and watching videos on YouTube does not cost a penny. However, the\
    \ companies that own these sites are some of the most profitable in the world.\
    \ You pay for accessing these services not with money, but with your information.\
    \ But you already knew that, didn’t you? You definitely agreed to it when you\
    \ signed up.\n\n    ### TARGETED ADVERTISING\n\n    Facebook, Google, and the\
    \ other Internet giants make money from selling advertising. When you watch a\
    \ TV show, the show is free to view, but the TV company gets money from companies\
    \ who show you an ads for their product. On the Web though, advertisers use data\
    \ to target their ads specifically at people who might be interested in their\
    \ products. So while a TV company gets paid by one advertiser at a time, a Web\
    \ company is getting income from thousands at once.\n\n    ![Image](images/f0054-01.jpg)\n\
    \n    ### HEALTH APPS\n\n    It takes effort to live a healthy life in the modern\
    \ world. Fitness trackers and health apps can measure how active we’ve been and,\
    \ given the right data, the app can score our health and create fitness plans.\
    \ Sounds good, but who else has this information? It would be very interesting\
    \ to an employer or health insurance company. Health information is protected\
    \ by strict privacy laws, and only you can give someone else access to it. Have\
    \ you?\n\n    ### WEB 1.0\n\n    In the early days, way back in the 1990s, the\
    \ World Wide Web was a collection of web pages made by companies and individuals,\
    \ all hoping to get visitors to their “home page.” There was much jostling among\
    \ a new breed of Internet businesspeople to have their website be a “portal,”\
    \ the gateway through which users accessed the rest of the Web. The obvious contenders\
    \ were search engines, which indexed the Web’s content to help you find things.\n\
    \n    ![Image](images/f0056-01.jpg)\n\n    ### WEB 2.0\n\n    At the start of\
    \ the 21st century, the web began to change. Portals tried to keep hold of users\
    \ by offering free content, such as news, video clips, games, and messaging services.\
    \ The most successful services allowed users to create and share their own content\
    \ in what became known as social media. Today, users spend much of their time\
    \ online within social media sites such as YouTube and Facebook where their activities\
    \ are monitored so they can be better targeted with advertising.\n\n    ### COOKIES\n\
    \n    Websites load software called cookies into your browser. These help the\
    \ website recognize you, but can also be used to gather information about your\
    \ other web activities. People have always been able to delete or block cookies,\
    \ but a new set of laws called the General Data Protection Regulation (GDPR) means\
    \ that sites must always ask permission to use them. You are asked to click “agree”\
    \ every time you arrive at a new site—but you don’t have to agree; that’s up to\
    \ you.\n\n    ## NET NEUTRALITY\n\n    Once information enters the Internet, it\
    \ becomes just one more packet of data. Your email hasn’t arrived? That’s because\
    \ it’s waiting its turn to be routed through the network along with instant messages,\
    \ photo uploads, and podcast downloads. It will arrive soon enough. But what if\
    \ you could pay extra so all your data got to skip the line. In fact, why can’t\
    \ you do that already?\n\n    ### NET NEUTRALITY\n\n    The Internet isn’t free.\
    \ Someone somewhere is paying to connect your devices to the Web, even at the\
    \ cafe with “free” WiFi. A company that offers Web access is called an Internet\
    \ Service Provider or ISP. In most countries, your ISP must allow all customers\
    \ the same access to the Internet, whatever they’re using the connection for—be\
    \ it streaming a movie or videoconferencing a doctor. This ruling is called net\
    \ **neutrality**.\n\n    ![Image](images/f0058-01.jpg)\n\n    ### DUMB PIPES VS\
    \ SMART PIPES\n\n    The first plans for the Internet were to use what have become\
    \ known as “dumb pipes.” The idea is that Internet connections act like water\
    \ pipes—data flows through them according to their capacity, rather than the type\
    \ of data. It is now possible to have networks made of “smart pipes” which prioritize\
    \ data. A smart pipe is useful for managing Internet traffic but it also makes\
    \ it possible to create faster private networks within the Internet for paying\
    \ customers to use.\n\n    ![Image](images/f0059-01.jpg)\n\n    ## ATTENTION ECONOMY\n\
    \n    The impact of computing and telecommunications has been so rapid that it’s\
    \ hard to comprehend its effects as they occur. A simple way of understanding\
    \ the big picture is as an “attention economy.” We pay for services with our attention,\
    \ and online services sell our attention to advertisers. Anything that gets our\
    \ attention is worth something to someone. Let’s give that idea some attention.\n\
    \n    ### GAMES AND GOSSIP\n\n    The Internet and the World Wide Web that followed\
    \ were built to make it easier to share information—and they were very successful.\
    \ After about 25 years of the Web being widely available, it’s now clear what\
    \ kind of information we share. We like to talk about ourselves, gossip about\
    \ other people, and play games with each other. Technology may be changing but\
    \ how we interact with each other hasn’t really altered for thousands of years.\n\
    \n    ### MESSAGING PARADOX\n\n    Sending and receiving messages has never been\
    \ easier. First there was email, then SMS, and now there are any number of messaging\
    \ apps that connect us with friends, relatives, school, and work. However, early\
    \ on in the communications revolution, the messaging paradox became apparent.\
    \ This says: it is so easy to send messages that a person receives them faster\
    \ than they can read them. Therefore most communications are ignored. Messaging\
    \ is so efficient that important information doesn’t get through. Eh?\n\n    ###\
    \ INFLUENCERS"
