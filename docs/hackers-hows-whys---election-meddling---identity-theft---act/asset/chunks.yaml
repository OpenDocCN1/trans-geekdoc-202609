    A person who likes to spend time and effort solving a problem that has no obvious
    value, and enjoys the challenge of getting around limits and rules.


    An expert or enthusiast of any kind.


    A malicious meddler who tries to discover sensitive information by poking around—also
    known as a cracker.


    ## THE WAY AHEAD


    So hackers are creative and clever, they bend the rules and figure out new ways
    of doing things. Hacking is not confined to computers and communications—people
    hack genes, hack engineering, and hack life itself. Hackers need not be the bad
    guys either. Many of today’s top tech developers started out as hackers. However,
    our attention is generally on the crackers—the harmful hackers. If we drop our
    guard, sooner or later they’ll get us. We need to understand more about that.


    ## KEEPING SECRETS


    The rise of the hacker has gone hand-in-hand with the rise of digital technology.
    The convenience of this tech has had a big effect on the way we live. We are able
    to buy and sell whatever we want with a few clicks, and we can share our lives
    with loved ones as if we were all in the same room. However, to do that, we need
    to keep secrets. Secret passwords and information keep our digital lives private
    and safe. How do we stop those secrets from falling into the wrong hands?


    ![Image](images/f0008-01.jpg)


    ### SECRET WRITING


    Okay, everyone has secrets. Each secret is a problem to solve. Is it right to
    keep it or should I share it? This is something people struggle with throughout
    their lives. However, digital secrets pose a different problem entirely. We have
    to share them with others to use our online services but make sure people who
    are not involved in the transaction can’t watch. Fortunately there is a long history
    of communicating in secret using a system called cryptography, which means “secret
    writing.” Cryptography is the first line of defense against a hacker.


    ![Image](images/f0008-02.jpg)


    ### CODES


    The simplest kind of cryptography is a code—simple in that it is easy to set up,
    but not necessarily easy to crack. The word “code” is often used to mean any way
    of hiding the true meaning of a message, but more correctly a code is a system
    where the meaning is hidden by changing entire words. Here’s a coded message:
    “This orange is blue!” It could mean absolutely anything. You can only find out
    for sure by using a codebook, which lists code words and their true meaning. In
    this code, “orange” means “book” and “blue” means “amazing”—it’s obvious once
    you know!


    ![Image](images/f0008-03.jpg)


    ### CIPHERS


    Serious cryptography, the kind used by armies, spies, and online services, uses
    a system called a cipher. While codes hide meaning by transforming words, a cipher
    does it by transforming individual letters. The original message is called the
    plaintext and the encrypted version is the ciphertext. To convert plaintext to
    ciphertext requires a set of instructions called the key. To decrypt the message,
    the same key is used but applied in reverse. A key is best organized as a list
    of mathematical processes. That way it is impossible to get things muddled. As
    we’ll see, these instructions can be very simple—but also so complex that a supercomputer
    could not figure them out in a billion years (or can they…?).


    ### CAESAR CIPHER


    One of the simplest ciphers was used by Julius Caesar, the warring dictator of
    Rome. It is a substitution cipher: each letter in the alphabet is replaced by
    another letter a fixed number of positions further along the alphabet. So if the
    cipher key was `+1`, the plaintext “ABCD” would be encrypted as “BCDE”—HFU JU?
    A negative number key means you go in the other direction. The alphabet forms
    a continuous loop, so once you get to Z, you start again at A. To decrypt you
    just switch the sign of the key, so `+ 1` becomes `- 1`: “HFU JU?” reads as “GET
    IT?”


    ![Image](images/f0010-01.jpg)


    ### PUBLIC AND PRIVATE


    A cipher key is easier to keep secret than a codebook, but it still needs to be
    exchanged. This is the weakest part of the process. The chance of the key being
    discovered increases each time it’s passed on to a new person. To be safest, you
    must meet in person and whisper the key into their ear. Modern communications
    allow us to talk with people we have never met. This was the first high-speed
    telecom system—and it was the first to be hacked (see [here](#ch06.xhtml#page_28)).


    ![Image](images/f0010-02.jpg)


    ## TELECOMS


    In the old days, if you wanted to talk to a friend, you had to send a letter.
    Now we use telecommunication, which allows us to have long-distance conversations.
    This doesn’t just mean phones and computers—telecommunications is much older than
    that! As it has evolved, so have hackers, continuing the centuries’ old battle
    for secure messages.


    ### WRITTEN WORD


    The first long-distance communication form was the letter. The telegraph: a pair
    of switches connected by miles of wire. If you closed the switch at one end of
    the wire, it also closed the switch at the other end, making a buzz or click.
    Samuel Morse concocted his famous code of long and short clicks to send wire messages.


    The ancient Mesopotamians rolled a cylindrical seal onto wet clay. By the Middle
    Ages, Europeans were “sealing” their letters with wax, pressing an identifying
    pattern into it. Once opened, it could not be re-sealed without destroying the
    wax, so it couldn’t be read secretly by someone else en route. You can hack wax,
    though, with a hot knife and a steady hand.


    ### HIGHER SPEEDS


    Letters are very slow: today’s post takes a couple of days, but in the past it
    took months. Visual communication, like smoke signals, is much faster. They carried
    simple meanings, such as “Attack!” or “Victory!” From this, flag-based signal
    systems called semaphore were developed, where letters were represented by the
    positions of two flags. In the 1790s, a network of semaphore towers was built
    across France. They could transmit short messages at 300 miles per hour in good
    weather.


    ### WIRED COMMUNICATION


    The 19th century saw the rise of systems that sent messages along electrified
    wires. The telephone was a later invention, where the sound wave of the voice
    was converted into a corresponding electrical wave for transmission along wires.
    Telegraph means “distance writing,” and telephone means “distance talking.” Telephone
    technology appeared in the 1860s and a century later it formed the foundation
    of digital communications.## CODE BREAKERS


    Code breakers have played many pivotal roles throughout history, both starting
    and ending wars. Here are some code breakers who have made history.


    ### KILLER QUEENS

