- raw: "    The sneakiest way of hacking your system is to add malware, or malicious\
    \ software. Malware might automatically damage your files or it might create a\
    \ “back door,” through which a hacker can secretly take control of the computer.\
    \ The most familiar malware is the virus, which the user installs on their device\
    \ without realizing and which spreads from one computer to another, often as email\
    \ attachments. Another user opens the attachment—and the virus has found a new\
    \ victim.\n\n    ![Image](images/f0030-01.jpg)\n\n    ### TROJAN HORSE\n\n   \
    \ Just as in the myth about Greek soldiers hiding in a giant horse to get past\
    \ the guards outside the city of Troy, a hacker uses a software “Trojan” to install\
    \ malware. It looks like a harmless app or attachment, but once launched, a Trojan\
    \ installs secret malware. Keeping your software up to date is the best defense\
    \ against malware because it stops hackers from taking advantage of flaws in the\
    \ code.\n\n    ### SOCIAL ENGINEERING\n\n    Another way of hacking a computer\
    \ is described as “social engineering.” Here’s how it might happen. The phone\
    \ rings and a voice says, “Hi, I’m from the IT department, there is a problem\
    \ with your computer. I need your password so I can log in from here and fix it.”\
    \ Sounds reasonable enough, but don’t be fooled. Hackers use a range of tricks\
    \ to convince us to give away secrets or grant them access to our devices.\n\n\
    \    ### PHISHING\n\n    This dangerous social hack hooks you by sending a message\
    \ that seems to come from a service that you use, such as a bank. The message\
    \ asks you to log in to your account, but the link provided takes you to a fake\
    \ webpage. You type in your security details and you get an error message asking\
    \ you to try again later. But the hacker now has all the security details they\
    \ need to login to your accounts for real!\n\n    ![Image](images/f0032-01.jpg)\n\
    \n    ### CLICKJACKING\n\n    A “clickjacking” attack tricks the user into clicking\
    \ on a hidden web link. The hacker does this by setting up a very appealing website,\
    \ such as one that supplies downloads of pirated movies. However, the links on\
    \ the screen are fake, and when a user clicks on one, they are actually selecting\
    \ another invisible link. A hacker could use this trick to steal passwords and\
    \ other details saved by an Internet browser.\n\n    ### ZOMBIES AND BOTNETS\n\
    \n    Once a hacker has found a way into your computer, he or she can turn it\
    \ into a “zombie.” The hacker then puts the zombie’s processor and RAM to work\
    \ in secret. The user has no indication of this, apart from their device running\
    \ slowly on occasion. Hackers assemble armies of zombie computers into “botnets.”\
    \ Working together, a botnet of thousands of zombies is as powerful as a supercomputer.\n\
    \n    ### ROOTKIT\n\n    Probably the worst hack attack is the “rootkit.” This\
    \ malware inserts itself into a computer’s most fundamental software, the operating\
    \ system, which manages how all the components work together. The rootkit’s job\
    \ is to hide other malware. Any security software designed to search for and clean\
    \ out malware relies on the operating system. However, as the rootkit is hidden\
    \ in there, it can disguise other malware as legitimate bits of software.\n\n\
    \    ![Image](images/f0034-01.jpg)![Image](images/f0034-02.jpg)\n\n    ### A HONEYPOT\n\
    \n    The good guys can be sneaky too. A “honeypot” is a cyber-security term for\
    \ a computer that has been set up to look like a weak point in a larger network.\
    \ When hackers try to get in through the honeypot, the real network is completely\
    \ safe, and the bad guys are caught red handed.\n\n    ![Image](images/f0035-01.jpg)\n\
    \n    ## HACKER CULTURE\n\n    Hackers sound like scary people; their skills let\
    \ them attack and take over your devices to steal whatever they want without ever\
    \ leaving their homes. Hackers are generally antisocial. They prefer to spend\
    \ time with computers than with other people, but they are not universally a bad\
    \ bunch. Let’s take a closer look at how hackers see themselves.\n\n    ### CRACKER\n\
    \n    The criminal hacker that gives the rest of them a bad name, intent on breaking\
    \ in wherever they are not wanted to steal secrets and wreak havoc.\n\n    ###\
    \ SCRIPT KIDDIE\n\n    A wannabe cracker who lacks skills and causes trouble using\
    \ “scripts” (code and apps) developed by others and widely available on the web.\n\
    \n    ### PHREAKER\n\n    An expert in attacking the security of telephone systems\
    \ and networks in general.\n\n    ### CYPHERPUNK\n\n    A person whose main interest\
    \ is cracking encryption.\n\n    ### WARES D00DZ\n\n    A hacker who specializes\
    \ in making illegal copies of **copyrighted** software and distributing it—for\
    \ free or for sale. The software may be a Trojan.\n\n    ### IRONMONGER\n\n  \
    \  A hardware specialist who works in the manufacture and maintenance of motherboards,\
    \ memory, and processors—and so is looked down upon by hackers (see also Sandbender).\n\
    \n    ### SNEAKER\n\n    A hacker who’s hired by a company or organization to\
    \ test its cyber defenses by trying to break in from the outside. A group of sneakers\
    \ is a “tiger team.”\n\n    ![Image](images/f0036-01.jpg)\n\n    ### ALPHA GEEK\n\
    \n    The most skilled and experienced member of a hacking collective, to whom\
    \ other members will turn for help.\n\n    ### CHOMPER\n\n    A failed hacker\
    \ whose attempts at hacking are ineffectual; also called a “luser” (a mashup of\
    \ loser and user).\n\n    ### CODE GRINDER\n\n    An IT professional who has no\
    \ interest in hacking. Hackers feel sorry for them.\n\n    ### JOCK\n\n    A hacker\
    \ whose main technique is to use brute force attacks to break through security.\n\
    \n    ### SANDBENDER\n\n    An electronics engineer who designs and manufactures\
    \ silicon microchips, a role that does not appeal to hackers because it requires\
    \ patience, precision, and teamwork. (The most common source of silicon in the\
    \ world is sand.)\n\n    ### UBERGEEK\n\n    A hacker—generally a wizard (see\
    \ below)—who has made an impact on the wider community, especially for writing\
    \ programs that are in common use by others.\n\n    ### LEECH\n\n    A particular\
    \ kind of luser who downloads shared files but does not make them available to\
    \ others.\n\n    ![Image](images/f0036-02.jpg)![Image](images/f0038-01.jpg)![Image](images/f0038-02.jpg)\n\
    \n    ### HOMEBREW COMPUTER CLUB\n\n    Today’s hacker culture took a lot from\
    \ a group called the Homebrew Computer Club who met in Silicon Valley in the early\
    \ 1970s. Being from Silicon Valley, they had access to all the latest developments\
    \ in computer technology. Many members went on to have stellar careers in computing:\
    \ Adam Osborne designed the first portable laptops; Steve Wozniak was one of the\
    \ founders of Apple; Dan Werthimer set up SETI, the Search for Extraterrestrial\
    \ **Intelligence**; while Jerry Lawson pioneered home gaming consoles.\n\n   \
    \ ## BLACK HATS AND WHITE HATS\n\n    The online world is sometimes compared to\
    \ the days of the Wild West in the United States, where cowboys and gunslingers\
    \ did what they wanted and were rarely brought to justice. In classic Western\
    \ movies of the 1950s and 60s, it was simple to figure out who was good and who\
    \ was bad because the good guys always wore white hats, while the baddies donned\
    \ black hats. Hackers are often described in the same way.\n\n    ![Image](images/f0040-01.jpg)\n\
    \n    ### BLACK HAT\n\n    As you might expect, a “black hat” is a criminal cracker\
    \ who breaks through security for nefarious reasons. Some notorious black hats\
    \ include:\n\n    **David Smith (USA)** who unleashed the Melissa virus in 1999,\
    \ which infected email applications all over the world at an estimated cost of\
    \ $80 million.\n\n    **Jeanson Ancheta (USA)** who was sent to prison for five\
    \ years after he was found to be in control of a botnet of over 100,000 zombie\
    \ computers in 2006.\n\n    **Hamza Bendelladj (Algeria)** who infected 50 million\
    \ computers with viruses and stole $400 million from banks (and donated it to\
    \ charity). Bendelladj was sentenced to 15 years in prison.\n\n    ![Image](images/f0040-02.jpg)\n\
    \n    ### WHITE HAT"
