    the same time!


    ### SHARING MEMES


    The original concept of a meme was a thought experiment by biologist Richard Dawkins.
    He wanted to explore how simple ideas, which he called memes, spread through a
    process like biological evolution, moving from person to person, changing or mutating
    as they go. The Internet makes sharing ideas very easy, and so the term “meme”
    generally now applies to something fun that has spread via the Web.


    ![Image](images/f0047-01.jpg)


    ## ESPIONAGE AND SURVEILLANCE


    When does a hacker become a spy or a spy become a hacker? A determined hacker
    might creep inside a high-security compound to install malware to gain access
    to a target’s information. A spy might do exactly the same thing. The only real
    difference is that hackers are generally criminals, while spies are hired to do
    it, by a government or organization. Let’s explore the spooky world of espionage.


    ### SOURCES OF INFORMATION


    In the language of espionage, any information that helps you understand your target
    better is called intelligence. The most obvious way to gather intelligence is
    when someone from a foreign power or an enemy group changes side (``defects` is
    the spy term) and tells what they know. As well as this human intelligence, the
    world’s spies are increasingly relying on signals intelligence—intercepting messages
    and working out what they mean. Sounds like a job for a hacker.


    ### SIDE-CHANNEL ATTACKS


    The United States and the United Kingdom, both use a “side-channel attack” system
    called `TEMPEST` to pick up signals that leak from their targets. This works out
    the content of a message not by collecting the coded data itself, but by watching
    how the computer and its user behave. The message itself is hidden, but the sounds,
    vibrations, radio waves, and other electrical echoes given out by the computer
    system may give away secrets.


    ![Image](images/f0048-01.jpg)


    ### SURVEILLANCE


    Not the same as spying, `surveillance` is the practice of watching general activity.
    Police might use it to watch for crimes and track the movements of wanted individuals.
    Cameras (sometimes called `CCTV`) are a major tool, with many able to read car
    registration plates via `ANPR` or automated number-plate recognition. However,
    `CCTV` is seldom of good enough quality to track targets using automated facial
    recognition—not yet anyway.


    ### BULK INTERCEPTION


    Spies want to know as much as they can about their targets, and that means searching
    for enemy agents hiding out among the public. To do that, spy agencies have increasingly
    started to watch everyone, looking for clues as to where the bad guys are. This
    does not mean studying CCTV of the street, it means collecting information about
    everyone’s communications and filtering them to reveal secret messages sent by
    criminals, terrorists, and enemy spies.


    ![Image](images/f0050-01.jpg)


    ### END-TO-END ENCRYPTION


    A spy can’t officially read a message without a good reason, but they can see
    the sender and recipient, their locations, the time sent, and the file type—and
    keep this on record. To stop someone fromreading your messages, you can use end-to-end
    encryption messaging apps. All your chat threads will be encrypted from your device
    to the recipient. Not even the app provider can read them.


    ### WATCHING THE WATCHERS

