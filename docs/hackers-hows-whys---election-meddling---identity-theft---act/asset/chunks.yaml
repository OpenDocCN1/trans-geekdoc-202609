    网络战争并不一定是致命的。事实上，有些人会认为，世界大国即使在和平时期也处于近乎持续的网络斗争中。这场秘密冲突的显性方面是使用虚假新闻等技术来动破坏竞争国家的社会凝聚力。例如，社交媒体可以被用来煽动一个国家的内部分歧，提升另一个国家的良好形象，或者影响选民对特定政治人物的看法。


    ### 震网病毒 (STUXNET)


    2010 年，一种名为 `Stuxnet` 的计算机病毒被发现，当时它感染了伊朗核设施的网络。据推测，`Stuxnet` 感染了 200,000 台设备，并控制了敏感机器，导致它们自毁。目前尚未有人声称对
    `Stuxnet` 攻击负责。一些国家曾受到怀疑，包括以色列和美国，他们怀疑伊朗开发核燃料的意图。但我们无法断此定论。


    ### 爱斯坦尼亚遭受攻击


    最早广为人知的网络攻击之一于 2007 年 4 月发生在爱斯坦尼亚。俄罗斯黑客发起了拒绝服务攻击，导致政府部门、广播机构和银行瘫痪。在两天时间里，该国陷入了混乱，机场和火车站关闭，ATM
    机无法使用，电力供应波动。新闻和政治网站被贴上了反爱斯坦尼亚的口号和图片进行篡改。爱斯坦尼亚及其盟友认为，这种复杂的攻击一定有官方军队的控制。


    ![Image](img/f0072-01.jpg)


    ### 泰坦雨 (TITAN RAIN)


    记录以来最大的网络攻击代号为 `Titan Rain`。在 15 多年的时间里，美国政府机构和为他们服务的高科技国防公司多次遭到攻击。你可能没有听说过这场网络战争行动，因为它的设计目标是不被察觉，通过隐静的间谍活动从美国军方和美国国家航空航天局（NASA）窃取秘密。据推
    `Titan Rain` 攻击来自中国，但没有直接证据。


    ### 蠕索加密 (WANNACRY)


    2017 年，一场名为 `WannaCry` 的勒索软件攻击引发了全球恐慌。该病毒在大量未定期更新计算机的组织中影响最严重。受害者包括英国的国家医疗服务体系（NHS）、法国的雷诺工厂以及俄罗斯的内政部。数千台计算机被锁定，除非支付赎金。该病毒被追溯到朝鲜，可能是为了筹钱，也可能只是为了造成混乱。


    ![Image](img/f0073-01.jpg)


    ## 加密货币 (CRYPTOCURRENCIES)


    黑客行为的核心在于寻找完成某事的新方法，或者以新方式利用旧技术。正如我们所看到的，这已经超计算领域延伸生活的许多领域。最大的成就之一是对货币本身的“破解”。结果就是
    `bitcoin`，一种没有管理者的货币形式，始终在公开范围内以完全公平的方式交易，尽管没有人知道它的所有者是谁。


    ![Image](img/f0074-01.jpg)


    ### 加密货币 (CRYPTOCURRENCY)


    `Bitcoin` 是加密货币的领先范。根据它的名字，你可能认为加密货币是供那些想要规避检测的人秘密使用的。`Bitcoin` 确实允许这一点，但加密货币的名称真正源于强力加密技术，这些技术用于确保新币的发布、验证交易并维护一个绝对真实的记录，以便每个人都能信任这一过程。


    ### 比特币挖矿 (MINING FOR BITCOIN)


    为了让 `Bitcoins` 存在，必须通过计算机解决一个复杂的密码学难题来对其“挖矿”。这个过程是一个尝试错误，因此矿工获得 `bitcoins` 的速度取决于他们投入到任务中的处理器数量。随着矿工数量的增加，谜题变得越来越困难，从而使
    `bitcoins` 以固定的速率释放。今天，`bitcoin` 矿工必须使用超级计算机，并且必须对每个谜题进行 200 万亿次的尝试。


    ![Image](img/f0074-02.jpg)


    ### 区块链 (BLOCKCHAIN)


    使用 `bitcoin` 进行的每笔交易都记录在一个名为 `blockchain` 的公共记录中。这并不是存储在单一中央服务器上，而是分布在 bitcoin`
    矿工的点对网络中。大约每隔十分钟，矿工所完成的处理工作就会创建一个新区块，记录那十分钟内发生的所有交易。该加密区块在网络上共享，因此全世界都知道每个 `bitcoin`
    是何时被交易的。


    ### 比特币泡沫？(BITCOIN BUBBLE?)


    `Bitcoin` 的成功是一个投机泡沫的例子。`Speculators` 购买 `bitcoin` 不是为了使用，而是因为他们相信它的价值会增加。如果有其他人购买
    `bitcoin` 的需求，那么价格将会上涨。但如果唯一想要 `bitcoin` 的人是投机者会怎样？需求最终消失。结果可能是 `bitcoins` 根本一文不值。


    ![Image](img/f0076-01.jpg)![Image](img/f0077-01.jpg)


    ### 暗网 (THE DARK WEB)


    “暗网”这个名字对你意味着什么？它听起来是有趣还是可怕？暗网是互联网中故意对公众隐形的部分。要进入它需要特殊的软件和知识。一旦进入，用户是匿名的，且其活动更难追踪。


    ### 深网 (DEEP WEB)


    暗网只是深网的一小部分——它是所有包含在具有 Web 功能的服务器上但未被搜索引擎索引的内容。深网主要由无害的内容组成，如电子邮件信息、在线服务，以及位于付费墙（paywall）之后的内容，这意味着你需要付费才能访问。


    ### 暗网 (DARKNETS)


    请记住，暗网是故意与其余部分隔离的部分。这包括分配文件和维护 `blockchain` 的点对网络。然而，在其中还有 `darknets`，它们是与 Web
    其余部分隔离的私人区域。暗网是涉及暗网时的焦点。为什么用户想要隐藏？难道这一切全都是无害的？


    ![Image](img/f0078-01.jpg)


    ### 物联网 (INTERNET OF THINGS)


    早期互联网是计算机之间传输数据的“互联网络”。后来出现了 Web——互联网的核心是连接人们，交换新闻、观点和猫视频。下一步在哪里？2003 年，99%的连接是由人类完成的。今天，一半以上的连接是由设备自动生成的。在
    2020 年代，机器的数量将是我们的六倍。欢迎来到物联网。


    ### 嵌入式技术 (EMBEDDED TECHNOLOGY)


    曾经计算机是连接键盘和显示器的米色盒子，现在它们被嵌入在家庭各个地方、建筑环境以及整个自然界。它们是控制器、记录器和传感器，与互联网收发信号。有一天，我们周围的机器将能够利用数据独立执行任务。


    ### 居家技术 (HOME TECHNOLOGY)


    随着我们将家连接到互联网，技术已经开始影响我们的家庭生活。现在我们可以在出门时远程控制家居设置，调节温度、烹饪食物，甚至应门。当我们回到家时，有些房子知道每个人在哪里，根据我们的个人设置调整每个房间的光线、温度和声音。


    ### 智能城市 (SMART CITIES)


