    In the 1560s, Queen Elizabeth I of England imprisoned her Catholic cousin Mary
    I of Scotland because she feared that she might usurp the English throne. When
    Mary’s letters to her conspirators were discovered, Elizabeth’s cryptographer,
    Thomas Phelippes, decoded them to reveal her plot. Mary used a homophonic cipher,
    where one plaintext letter was shown by several possible ciphertext symbols. It
    was also a nomenclator system, where frequently used names—Elizabeth, Mary, Spain—had
    their own symbols. This made frequency analysis difficult. It took Phelippes several
    months to break in, but he did so by identifying common English phrases. For example,
    letters generally start and end in the same way: “Dear…” and “Yours…,” so he started
    here and found out that Mary wanted King Philip of Spain to invade England and
    kill Elizabeth. Once the code was cracked, Mary was executed.


    ![Image](images/f0014-01.jpg)


    # TELEGRAM HACK


    In 1917, the United States was considering joining World War I (1914–18) as France
    and Britain’s ally. The German foreign minister sent a telegram (a letter sent
    via telegraph) to Mexico asking them to invade the United States to stop US troops
    from coming to Europe. In return, Mexico would get back Texas and other territories
    the United States had taken. The Germans couldn’t send messages to Mexico (all
    the telegraph cables went via Britain) but they could send a few coded signals
    to the United States. These coded messages were meant for peace talks, but the
    Germans tricked an American official into sending on the Mexican telegram, still
    hidden by its code. Today’s hackers use a similar technique called a Trojan Horse
    to hide malicious deeds inside a seemingly useful task (see more shown [here](#ch09.xhtml#page_31)).
    The Mexicans refused to join the Germans’ side. In any case British spies had
    soon decoded the message and warned the Americans. However, they had to invent
    a story about how they got hold of it so that the Americans would not realize
    the British were spying on the US telegrams as well!


    # DOES THAT COMPUTE?


    Alan Turing is remembered as a codebreaker who helped to win World War II and
    save countless lives. That is quite an achievement until you realize that what
    Turing also did was invent the digital computer. Without Turing, hackers might
    not even exist!


    ## THE VIRTUAL MACHINE


    Turing’s work on computers was a bit of an accident. As a mathematician, he was
    looking for an answer to a complicated problem. Some algorithms always produce
    a final answer (what that is not important) and some algorithms just keep forever.
    Turing wanted to know if there was a way of telling one from the other without
    having to try them out. To investigate, he used an imaginary, or “virtual,” machine
    that could follow any algorithm and remember the results. Does this virtual machine
    sound familiar? It took few years for technology to catch up, but the designs
    of the first digital computers were based on Turing’s


    ## COMPUTER PIONEERS


    Computers existed long before Turing. “Computer” was the name for people whose
    job was to do very complicated math. Several people had tried to build mechanical
    calculators that could do the work of a human. The most successful was Charles
    Babbage. In 1837, Babbage designed the Analytical Engine, a mechanical device
    that had a programmable processor (called the `Mill`) and a memory (the `Store`)
    which could hold a thousand-digit numbers! It would have been the first general
    purpose computer if only Babbage could have afforded to make all 25,000 separate
    parts!


    ![Image](images/f0016-01.jpg)


    ## LOGIC CIRCUITS


    A computer uses a kind of math called Boolean algebra, which uses `1` and `0`,
    and has weird rules, such as `1+1=1`. A computer’s circuits follow these rules,
    so it can be used to perform acts of logic, or make simple decisions, such as
    yes or no, true or false, on or off, billions of times a second. The American
    mathematician Claude Shannon devised electrical systems based on Boolean algebra
    around the same time as Alan Turing was imagining his machine. The first computer
    to have both Turing’s system—a processor, program—and Shannon’s logic circuits
    was the `Baby`, built in Manchester in 1948.


    # THE FIRST HACKERS


    Being able to communicate over long distances has revolutionized society, and
    also revolutionized the way we cheat and steal. The first high-speed telecoms
    system was a network of semaphore towers built in the early 19th century across
    Europe—and was also used for the first hack. Let’s look at a brief history of
    hacking to get us up to date.


    ## 1834 SEMAPHORE HACK


    Francois and Joseph Blanc developed a way of hiding secret information inside
    semaphore. The brothers led a small team of hackers to transmit sensitive stock
    market information from Paris to Bordeaux so they could know about price changes
    before anyone else—the scam ran for two years before someone snitched, but no
    one went to prison because hacking communications systems was not against the
    law.


    ![Image](images/f0018-01.jpg)


    ## 1903 SCIENTIFIC HOIGAN


    In 1903, Marconi performed a demonstration to show that his radio equipment could
    be finely tuned so only a receiver set to the same frequency could pick up the
    signal. Marconi owned the patent for radio, so no one else was allowed to use
    the technology. During Marconi’s demonstration, Nevil Maskelyne, a magician who
    used radio in his act, took over with a more powerful signal, tapping out the
    words “rats, rats, rats” in Morse. Marconi described the attack as “scientific
    hooliganism.”


    ## 1956 PHREAKING


    Josef Engressia, nicknamed Joybubbles, had perfect pitch, meaning he could whistle
    any note without being guided by a musical instrument. In the late 1950s, while
    still a child, Joybubbles found he could control the telephone network with whistles.
    The dialing system converts numbers into sound tones, which command the telephone
    exchanges to direct the call. Joybubbles became the first “phreaker,” a hacker
    who takes control of phone systems—and makes free calls—by using whistles. (It
    doesn’t work anymore.)


    ## 1967 INSIDE IBM


    In 1967, IBM donated four computer terminals to a high school near Chicago. Each
    terminal was connected to a mainframe at IBM’s offices. IBM set up some space
    on the mainframe for the students to use, keeping them separate from other users.
    Students soon worked out how to hack into private areas of the network. IBM eventually
    thanked the kids, because their hack helped IBM make their systems more secure.


    ## 1971 CAPTAIN CRUNCH


    John Draper, also known as Captain Crunch, discovered that a toy whistle he got
    as a free gift in a box of Cap’n cereal made just the right tone to access long-distance
    phone calls for free. Draper was threatened with prison if he did not stop hacking.
    He later met Steve Jobs and Steve Wozniak, two students who made and sold phreaking
    devices—and then later set up the computer company Apple.


    ## 1981 CAPTAIN ZAP


    Ian Murphy, better known as Captain Zap, claimed to have carried out the greatest
    hack ever. He hacked into the largest telephone provider in the United States
    and changed the system’s internal clock so that people who used the phone at peak
    times during the day were charged at cheaper night-time rates.


    ![Image](images/f0020-01.jpg)!![Image](images/f0020-03.jpg)


    ## 1984 CHAOS COMMUNICATIONS CONGRESS


    The first “hackercon,” or meeting of hackers, was held in Hamburg, Germany, in
    1984 and has been held every year since. It is run by the Chaos Computer Club,
    a German-language hacking association with more than 7,000 members.


    ## 1988 MORRIS WORM

