  trans: '

    罗伯特·莫里斯（Robert Morris）传播了一种病毒，导致了当时被称为互联网的网络 10%瘫痪。在那个时代，这意味着仅仅攻击了 6,000 台计算机。尽管如此，莫里斯的鲁莽行为仍造成了
    1500 万美元的损失，并让他丢掉了康奈尔大学的工作。作为回应，美国政府建立了 `CERT`（计算机应急响应小组）以防止类似的计算机攻击。


    # 你好，互联网


    互联网是一个计算机网络。更准确地说，它是一个连接了许多独立计算机网络的“网际互联”（internetwork）。在互联网存在的 50 年里，它的确切含义已经变得模糊。互联网连接着数以十计的设备——地球上每人平均对应好几台——不仅仅是电脑、手机和平板电脑，还有电视、汽车、气象站、路灯、冰箱和烤箱。而且所有这些设备都可能被黑客。


    ![Image](img/f0022-01.jpg)


    ## 军事项目


    互联网起源于一个军事防御项目。到 20 世纪 60 年代，军事指挥官正在开发依赖计算机和电信来控制其部队的系统。军方意识到，如果敌人能够切断这些通信，他们将获得巨大的优势——而做到这一点他们只需要切断一根电缆。`ARPANET`（高级研究计划机构网络）的建立是为了即使在遭受最恶的攻击时也能保持通信安全。


    ## 数据包交换


    `ARPANET` 使用了一种名为“数据包交换”的系统，其中信息被拆分成碎片或“数据包”。每个数据包都有一个头部代码，说明它源于哪里、去往哪里，以及如何与其他数据包组合。每个数据包通过网络找到通往目的地的方法。接收计算机组装这些数据包，并发送回信息，请求重发任何丢失的数据包。这就是今天从视频到短信信息的所有内容如何通过互联网发送的。


    ## 开启


    `ARPANET` 于 1969 年开启。起初，它只连接了四所美国大学，大部分位于加利福尼亚州，但它稳步扩张，到 1973 年，其他国家也接入了。20 世纪
    80 年代，军方建立了一个独立的系统，`ARPANET` 连接到了公众使用的电话网络。到 80 年代后期，它已被称为互联网。


    ![Image](img/f0022-02.jpg)


    ## 网页


    在早期，互联网完全是关于文件传输协议的，即 `FTP`，它用于快速安全地发送和接收计算机文件。然而，1989 年，在 `CERN`（欧洲核子研究组织）工作的英国计算机科学家蒂姆·伯纳斯-李（Tim
    Berners-Lee）发现这个系统很难用。他提出了一个信息网——万维网（world-wide web）的想法，用户可以在连接互联网的计算机上查看公开的文件。


    ## 所见即所得 GUI


    网页的兴起与 `GUI`（goo-ee）——“图形用户界面”并肩。用户现在不再面对黑色屏幕上闪烁的绿色文字，而是拥有了一个虚拟桌面，可以打开和移动文件及文档。用户过去通过输入代码来控制计算机，但现在他们使用鼠标点击屏幕上的图形。`GUI`
    让计算变得 `WYSIWYG`（wiz-ee-wig），即“所见即所得”。因此，输入的文档在屏幕上显示为带有打印文本和图片的白色页面——就像实物一样。


    ![Image](img/f0024-01.jpg)![Image](img/f0024-02.jpg)


    ## 超链接


    伯纳斯-李的万维网信息可以通过可点击的“超链接”将一个网页链接到下一个。带有超链接的文档用 `HTML`（超文本标记语言）编写，这同样由伯纳斯-李开发。

