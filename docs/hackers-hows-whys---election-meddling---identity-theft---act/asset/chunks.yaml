    \ into an end point\n\n    **anonymous** to have no name or identifiable features\n\
    \n    **bit** a single unit of information, normally recorded by a computer as\
    \ a 1 or 0\n\n    **blockchain** an online record of transactions that is public\
    \ and cannot be changed or doctored\n\n    **browser** the software application\
    \ used to access and view material that is available on the World Wide Web\n\n\
    \    **byte** a unit of memory, made up of eight bits\n\n    **CCTV** (closed-circuit\
    \ television), a name for security cameras where an area—a shop or street, perhaps—can\
    \ be viewed on screens\n\n    **cloning** a system that makes a genetic copy of\
    \ a living thing. The clone shares the same DNA as the original but is not an\
    \ exact copy.\n\n    **copyright** the rule that says text, pictures, or any other\
    \ creative product belongs to the person who made it, and cannot be copied without\
    \ their permission\n\n    **currency** the system of exchange used to buy and\
    \ sell things\n\n    **data** information, often in the form of numbers, that\
    \ has been recorded in relation to something specific\n\n    **encryption** the\
    \ process of hiding the meaning of information using codes and ciphers\n\n   \
    \ **ethics** a set of principles that guide decision making\n\n    **hardware**\
    \ the physical parts of a computer, including the display or screen, the keyboard,\
    \ processors, memory, and power supply\n\n    ![Image](images/f0092-01.jpg)\n\n\
    \    **infrastructure** the constructions, such as roads, bridges, and tunnels,\
