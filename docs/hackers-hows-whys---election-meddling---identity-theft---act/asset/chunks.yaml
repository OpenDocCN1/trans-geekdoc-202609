    \   ## AUTHOR’S NOTE\n\n    ### WHAT’S THE ISSUE WITH HACKING?\n\n    It’s a complicated\
    \ subject, but never fear because you are in the right place to find out. I can’t\
    \ give you any simple answers, I’m afraid, but this book will help you figure\
    \ out for yourself what you think about hacking. All I can do is tell you what\
    \ I know and set out what’s what and who’s who.\n\n    ![Image](images/f0005-01.jpg)\n\
    \n    ### THEN IT’S UP TO YOU TO MAKE AN INFORMED OPINION.\n\n    Hacking and\
    \ the online world are expanding into all areas of our life; into art, money,\
    \ politics and crime, and into the way we communicate. It sounds like something\
    \ you need to know about. In this book, I’ll break it down for you, but even then,\
    \ the wrongs and rights of hacking are not always clear. Every now and then, you’ll\
    \ get a chance to question what you’ve read and think about it.\n\n    ### WHAT\
    \ DO YOU THINK?  \n\n    WHAT DO YOUR FRIENDS THINK?  \n\n    WHAT DO YOUR PARENTS\
    \ THINK?  \n\n    WHAT DOES YOUR TEACHER THINK?\n\n    Everyone and anyone can\
    \ have an opinion, but not everyone’s will be informed. With this book, you will\
    \ have the knowledge to back up your arguments.\n\n    ### OPINIONS MATTER, SO\
    \ WHAT WILL YOURS BE?\n\n    ![Image](images/f0004-01.jpg)\n\n    ## WHAT IS A\
    \ HACKER?\n\n    Do you know a hacker? Are you one yourself? (Is that a secret?)\
    \ Computer hacking is an intriguing subject, but what is it and what are its effects?\
    \ Hackers in films and on TV lurk in dark rooms, typing really fast. They are\
    \ mostly strange, shy characters and are seldom the hero of the story. In real\
    \ life, the faces of real hackers stare out from news stories about serious crimes\
    \ where secrets or money have been stolen. So, are hackers always freaky, creepy,\
    \ or crooked? Let’s find out.\n\n    ### NAME IT\n\n    To understand hacking,\
    \ it’s best to start with the origin of the word. “Hack” means to cut up roughly.\
    \ It was first used in the modern sense in 1955—not in relation to computers but\
    \ to model railways! The members of the Tech Model Railroad Club at the Massachusetts\
    \ Institute of Technology (MIT), were coming up with ways of getting more power\
    \ to the tracks and kept making rapid and rough changes while trains were running—often\
    \ overloading the circuits. This was called hacking, and these model train enthusiasts\
    \ were the first hackers. The term “hacker” came to refer to a person who messes\
    \ around with technology to see if they can get it to work better or in other\
    \ ways—but who may break it in the process.\n\n    ![Image](images/f0006-01.jpg)\n\
    \n    ### DEFINING HACKERS\n\n    By 1975, computer scientists had invented a\
    \ whole new language, which they recorded in the Jargon File: a list of tech slang.\
    \ The Jargon File defined ‘hacker’ in several different ways. Here are the main\
    \ ones:\n\n    **A person who enjoys exploring** the details of programmable systems\
    \ and how to stretch their capabilities, as opposed to most users, who prefer\
    \ to learn only the minimum necessary."
