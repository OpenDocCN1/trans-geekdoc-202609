  trans: '


    `algorithm` 算法，一组旨在将起点转换为终点的指令。


    `anonymous` 匿名，没有名称或可识别特征。


    `bit` 位，信息的最小单位，通常由计算机记录为 1 或 0。


    `blockchain` 区块链，公开且不可更改或篡改的在线交易记录。


    `browser` 浏览器，用于访问和查看网上可用内容的软件应用程序。


    `byte` 字节，内存单位，由八个位组成。


    `CCTV`（闭路电视），安全监控摄像头的统称，可以在屏幕上查看某个区域——例如商店或街道。


    `cloning` 克隆，一种使生物体产生遗传复制的系统。克隆体与原体具有相同的 DNA，但并非完全相同的复制。


    `copyright` 版权，规定文本、图片或任何其他创意产品属于其制作者所有，未经许可不得复制。


    `currency` 货币，用于买卖物品的交换系统。


    `data` 数据，通常以数字形式记录的与特定事物相关的信息。


    `encryption` 加密，使用代码和密码隐藏信息含义的过程。


    `ethics` 伦理，指导决策的一系列原则。


    `hardware` 硬件，计算机的物理部分，包括显示器或屏幕、键盘、处理器、内存和电源。


    ![Image](img/f0092-01.jpg)


    `infrastructure` 基础设施，如道路、桥梁和隧道、电力和水供应以及通信设施，允许人们在公共空间移动并过正常生活。


    `input` 输入，计算机程序的起点。这可以是键盘的点击或手指的滑动。随后程序将把该输入转换为输出。


    `intelligence` 情报，在此语境下，指收集有关对手、敌人或竞争者的信息。间谍或侦查的目的是收集情报并理解其含义。


    `LED` 发光二极管的缩写，一种通电时会发出亮光的电子设备。LED 用于平板显示器（以及许多其他地方）。


    `life hack` 生活小技巧，一种让日常生活部分变得更简单的技巧，通常是利用完全不同用途设计的物品。


    `neutrality` 中立，不偏袒，在一种观点和另一种意见之间保持平衡。


    `output` 输出，计算机算法的最终结果，可能是扬声器发出的声音，也可能是屏幕上出现的像素。


    `poll` 民意调查，向一组人就当前议题征求意见，并利用结果估计更大群体（甚至是整个国家）的意见。


    `processor` 处理器，计算机的微芯片“大脑”，包含程序的算法并利用这些算法将输入转换为输出。


    ![Image](img/f0093-01.jpg)


    `protocol` 协议，一组控制计算机如何通信和交换信息的严格规则。


    `quantum` 量子，某种事物的微小数据包。在量子物理学中，这涉及到物质和能量由不可分割或不可增加的小包构成的方式。


    `software` 软件，控制计算机硬件的程序。


    `speculator` 投机者，根据他们对物品未来价值变化的变化的判断来买卖物品的人。


    `surveillance` 监控，对个人进行的严密观察，记录他们所的一切。


    `The Pentagon` 五角大楼，美国军部总部，之所以如此命名是因为位于华盛顿特区附近一座巨大的五边形建筑内。


    ## 了解更多


    现在轮到你了。利用这些资源继续你对万物、编码和计算的探索。计算机博物馆将向你展示所有技术从何而来，而游戏是成为破解者的良好起点。祝你好运！


    ![Image](img/f94.jpg)


    ### 书籍

    有很多关于黑客主题的书，有些是黑客本人编写的。这些是很好的入门书籍。Kevin Beaver 著《Hacking For Dummies》，John Wiley
    & Sons 出版。Kevin Mitnick 著《Ghost in the Wires: My Adventures as the World’s Wanted
    Hacker》，Little and Company 出版。Clive Gifford 著《The Science of Computers (Get Ahead
    in Computing)》，Wayland 出版。


    ### 网站与在线

    哪里比你的电脑更学计算机？什么是黑客？`www.bbc.co.uk/news/3989632`。白帽代码，`www.rootz.org`。15 岁以下网络安全后之星
    `projects.csmonitor.com/hackerkids`。所有网页地址在印刷时均为正确。出版商和作者对书中提及网站的内容不负责。


    ### 游戏

    你可以通过这些游戏学习更多关于黑客的知识并亲自尝试这些技能。CIA 破解游戏 `www.cia.gov/kids-page/games/break-the-code`。黑客，桌游
    `www.thinkfun.com/products/hacker`。


    ### 博物馆

    博物馆是极佳的地方，可以以互动的方式发现并学习更多关于计算机的知识。马里兰国家密码博物馆 `www.cryptologicfoundation.org`。加州计算机历史博物馆
    `www.computerhistory.org`。


    ### 研讨会与黑客活动

    如果你受到这本书的启发，可以通过这些活动和研讨会来尝试黑客。内华达州黑客 `www.rootz.org`。伊利诺伊州黑客 `www.hackz.com`。


    ### APP

    通过这些 App 随地了解更多。Android / iOS。一个充满谜题的游戏，会让你痴迷。你可以黑掉它吗？


    ![Image](img/f0095-01.jpg)


