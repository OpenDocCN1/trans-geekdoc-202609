- raw: "    Cyberwarfare need not be deadly. In fact, some would argue that the world\
    \ powers are in a near-constant cyberbattle even during peacetime. The visible\
    \ front of this secret conflict is the use of techniques such as fake news to\
    \ destabilize the social cohesion of a rival country. For example, social media\
    \ can be used to stir up division in one country and to promote a good image of\
    \ another, or to influence how an electorate views a particular politician.\n\n\
    \    ### STUXNET\n\n    In 2010, a computer worm called Stuxnet was discovered\
    \ when it infected the networks at Iran’s nuclear facilities. Stuxnet supposedly\
    \ infected 200,000 devices and took control of sensitive machines so that they\
    \ destroyed themselves. No one has claimed responsibility for the Stuxnet attack.\
    \ Some countries have been suspected, including Israel and the United States,\
    \ who doubted Iran’s intentions for deveolping nuclear fuel. But we cannot say\
    \ for sure.\n\n    ### ESTONIA ATTACKED\n\n    One of the first well-publicized\
    \ cyberattacks occurred in Estonia in April 2007. Russian hackers caused denial\
    \ of services attacks that knocked out government ministries, broadcasters, and\
    \ banks. For two days, the country was thrown into chaos, with airports and train\
    \ stations closed, ATMs out of action, and fluctuating power supplies. News and\
    \ political websites were defaced with anti-Estonian slogans and pictures. Estonia\
    \ and her allies believed an attack of such sophistication must have had official\
    \ military control.\n\n    ![Image](images/f0072-01.jpg)\n\n    ### TITAN RAIN\n\
    \n    The largest cyberattack ever recorded is codenamed Titan Rain. It has seen\
    \ US government institutions and high-tech defense companies that work for them\
    \ attacked multiple times for more than 15 years. You will probably not have heard\
    \ of this cyberwarfare campaign because it is meant to be unseen, using quiet\
    \ espionage to steal secrets from the US military and NASA. It is assumed that\
    \ the Titan Rain attacks are coming from China but there is no direct evidence.\n\
    \n    ### WANNACRY\n\n    In 2017, a ransomware attack called WannaCry caused\
    \ mayhem across the world. The worm had its worst effects in organizations that\
    \ used a large number of computers that were not updated regularly. Victims included\
    \ the UK’s National Health Service, Renault factories in France, and Russia’s\
    \ Ministry of Internal Affairs. Thousands of computers became locked unless a\
    \ ransom was paid. The worm was traced to North Korea and might have been an attempt\
    \ to raise money or simply cause disruption.\n\n    ![Image](images/f0073-01.jpg)\n\
    \n    ## CRYPTOCURRENCIES\n\n    Hacking is all about working out new ways to\
    \ do something, or how to use old technology in a new way. As we’ve seen, that\
    \ goes beyond computing into many areas of life. One of the biggest triumphs is\
    \ hacking money itself. The result is bitcoin, a form of money that has no one\
    \ in charge and that is always traded in public in a completely fair way, although\
    \ no one knows who owns any of it.\n\n    ![Image](images/f0074-01.jpg)\n\n  \
    \  ### CRYPTOCURRENCY\n\n    Bitcoin is the leading example of a cryptocurrency.\
    \ Based on its name, you might assume a cryptocurrency is one set up to be used\
    \ in secret by people wanting to avoid detection. Bitcoin does allow for this,\
    \ but a cryptocurrency really gets its name from the strong forms of cryptography\
    \ used to secure the release of new coins, verify transactions, and maintain an\
    \ absolutely true record so that everyone can trust the process.\n\n    ### MINING\
    \ FOR BITCOIN\n\n    For Bitcoins to exist, they have to be ‘mined’ by using a\
    \ computer to solve a tricky cryptological puzzle. The process is one of trial\
    \ and error, so the speed that the miner earns bitcoins depends on how many processors\
    \ they devote to the task. As the number of miners increases, the puzzles become\
    \ harder so that bitcoins are released at a regular rate. Today, bitcoin miners\
    \ have to use supercomputers and must make 200 million billion attempts to solve\
    \ each puzzle.\n\n    ![Image](images/f0074-02.jpg)\n\n    ### BLOCKCHAIN\n\n\
    \    Every transaction made with bitcoin is recorded in a public record called\
    \ the “**blockchain**.” This isn’t held on a single central server but distributed\
    \ over a peer-to-peer network of bitcoin miners. Every ten minutes or so, the\
    \ processing work done by the miners creates a new block which records all the\
    \ transactions that happened in those ten minutes. That encrypted block is shared\
    \ on the network, so the entire world knows when each bitcoin was traded.\n\n\
    \    ### BITCOIN BUBBLE?\n\n    Bitcoin’s success is an example of a speculative\
    \ bubble. **Speculators** buy bitcoin not to use it but because they believe that\
    \ its value will increase. If there is demand from other people to buy bitcoin,\
    \ then the price will certainly go up. But what happens if the only people who\
    \ want bitcoin are speculators? Eventually the demand will fall away. It might\
    \ turn out that bitcoins are not really worth anything at all.\n\n    ![Image](images/f0076-01.jpg)![Image](images/f0077-01.jpg)![Image](images/f0077-02.jpg)\n\
    \n    ## THE DARK WEB\n\n    What does a name like “dark web” mean to you? Does\
    \ it sound intriguing or frightening? The dark web is the section of the Internet\
    \ that’s hidden from public view. To get in, a user needs special software and\
    \ knowledge. Once inside they are anonymous and their activity is harder to trace.\
    \ The dark web sounds like a perfect set up for a hacker but it is also where\
    \ you find serious criminals.\n\n    ### DEEP WEB\n\n    The dark web is just\
    \ a small part of the “deep web”—that is everything that’s contained on Web-enabled\
    \ servers but isn’t indexed by search engines. As a result, Google, Bing, and\
    \ the others don’t know it’s there, and you can’t access it without the exact\
    \ link. The deep web is composed mostly of innocuous private content, such as\
    \ webmail messages and online financial services, plus content that is behind\
    \ a “paywall,” meaning you have to pay to access it.\n\n    ### DARKNETS\n\n \
    \   Remember the dark web is the part that is deliberately hidden from us. This\
    \ includes things like peer-to-peer networks distributing files and maintaining\
    \ the bitcoin blockchain. However, within that there are also “darknets,” which\
    \ are private regions of a network, deliberately walled off from the rest of the\
    \ Web. The darknets are the main focus of attention when it comes to the dark\
    \ web. Why do the users want to stay hidden? Surely it can’t all be completely\
    \ harmless?\n\n    ![Image](images/f0078-01.jpg)\n\n    ## THE INTERNET OF THINGS\n\
    \n    The early Internet was an “internetwork” that transferred data between computers.\
    \ Then came the Web—the Internet was all about connecting people, exchanging news,\
    \ views, and cat videos. So where next? In 2003, 99 percent of connections to\
    \ the Internet were made by a person. Today people make less than half of connections—the\
    \ rest are made autonomously by devices. In the 2020s, machines will outnumber\
    \ us by six to one. Welcome to the Internet of Things.\n\n    ### EMBEDDED TECHNOLOGY\n\
    \n    Where once a computer was a beige box connected to a keyboard and monitor,\
    \ they are now embedded in all kinds of places around the home, in the built environment,\
    \ and throughout the natural world. They are controllers, recorders, and sensors\
    \ that send and receive signals to and from the Internet. One day, the machines\
    \ that surround us will be able to use that data to perform tasks independently.\n\
    \n    ### HOME TECHNOLOGY\n\n    Technology has begun to impact our home life\
    \ as we connect our homes to the Internet. It is now possible to remote control\
    \ home settings while we are out, to adjust the heating, cook food, or even answer\
    \ the door. When are home, some houses know where everyone is, adjusting the lighting,\
    \ heating, and sounds in each room according to our personal settings.\n\n   \
    \ ![Image](images/f0081-02.jpg)\n\n    ### SMART CITIES"
