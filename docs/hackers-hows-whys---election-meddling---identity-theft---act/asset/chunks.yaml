    Humans devote a lot of attention to gossiping, or spreading news about other people.
    A celebrity is someone everyone knows, even though we’ve never actually met them.
    The reason why we like celebrities is because we can gossip about them, even with
    complete strangers. Social media has a new kind of celebrity called an “influencer,”
    who gets our attention by sharing details about their lives. They get paid to
    tell us about their stuff.


    ![Image](images/f0061-01.jpg)


    ## SOCIAL MEDIA BUBBLE


    Our online social groups are made up of people we like and agree with—just like
    in the real world. Your social media services show you things they know you already
    like and filter out stuff that your past clicks have revealed you don’t like.
    As a result, social media creates a bubble, or “echo chamber” where your ideas
    are not challenged and you become disconnected from many of the people around
    you.


    ![Image](images/f0062-01.jpg)


    ## SCREEN ADDICTION


    One of the innovations of social media is the “like” button. That is a valuable
    piece of information for the attention economy. Every like we get makes us happy.
    So we look at our device again, perhaps like and share a few things, and check
    if our posts have received any more likes. It can become second nature: we do
    it without realizing and it means we give less attention to the people around
    us.


    ## ATTENTION CITIZENS!


    The Chinese government uses a Social Credit System to encourage good citizenship.
    Paying bills on time and disposing of trash in the proper way earns people social
    credits, which are visible on social media and posted in public view in some villages.
    Being in debt or in trouble with the police sees your credits reduced. People
    with low social credit scores are barred from certain jobs and cannot access services
    such as flights or high-speed rail.


    ## PEER-TO-PEER


    The Internet was set up to share data such as software and databases between computers.
    Today, the range of data has diversified from emoji messages to live video feeds.
    However, the setup is still the same as 50 years ago, and some people aren’t happy
    with the amount of control other people have over how they share data online.
    What if everyone online were peers, or equals, and sharing was `P2P` or peer-to-peer,
    with no one in control?


    ### CLIENT COMPUTER


    The traditional model of the Internet is for devices, like your phone or laptop,
    to be a “client computer.” Clients connect to a central server, which acts as
    a gateway to other clients on the network. The servers are owned by ISPs and they
    have control of what gets to your computer or not. In a `P2P` network, every device
    has the same level of access. There is no server with greater control over what
    data goes where.


    ### NAPSTER


    In 1999, `P2P` technology was used to allow Web-connected clients to behave as
    if they were on a `P2P` network and share files without the ISP having control.
    The first `P2P` file-sharer was `Napster`, which handled music files. You searched
    for a favorite song, and the `Napster` application connected you to a computer
    that had it, and you copied the file—for free! The recording industry was not
    happy and `Napster` was shut down.


    ![Image](images/f0064-01.jpg)


    ### STREAMING KILLS PIRACY


    Ten years ago, more than half of Internet traffic was from `P2P` file sharing.
    Sharing pirated music, movies, and software was losing their creators a lot of
    money. Today the figure for `P2P` file sharing is more like 3 percent. So what
    happened? Most file sharers were happy to pay to listen and watch, but they couldn’t
    do so online. Streaming services like `Spotify` and `Netflix` have made entertainment
    available and so reduced the demand for pirated content.


    ![Image](images/f0065-01.jpg)


    ## IDENTITY CRIME


    Literature is full of stories where characters take on someone else’s identity.
    Some are hilarious, while others are tense and terrifying. But no one could actually
    steal your identity, could they? In real life, taking on someone’s identity would
    be tricky, but in the online space it’s easy for a criminal to pretend to be you.
    Online you are just as responsible for your actions as you are in the real world,
    so how is your identity protected?


    ### WHAT IS YOUR IDENTITY?


    You don’t add up to much really. Just your name, birthplace, birthday, and address.
    To prove who you are, you will need a bill with your address or passport or other
    photo ID. Then to access your stuff you need passwords, an email address, or phone
    number. That’s about it really!


    ### BIOMETRICS


    A human can match you to your photo in a fraction of a second. “Biometrics” are
    the measurements of your face or other body parts so a computer can do that same
    job. After about the age of 12, the relationship between certain body features
    becomes fixed, such as the shapes and relative positions of the eyes, nose, and
    mouth, so even as you age, your biometrics stay the same.


    ![Image](images/f0066-01.jpg)![Image](images/f0067-01.jpg)


    ## FAKE NEWS


    In recent years we have become increasingly aware that not everything we see or
    read in the news is always true. It may be a mistake or a hoax or an attempt at
    a joke, or it might be a deliberate attempt to mislead. Does it matter which?
    By now we are so confused we do not know what is true and what is fake news.


    ### THE GOOD NEWS OR THE BAD NEWS?


    People get news from newspapers, websites, or television stations that reflect
    their own view. Competition for readers and viewers is fierce, so news providers
    must appeal to a target audience and tell them news in a way they want to hear.
    But is any of it really the news?


    ![Image](images/f0068-01.jpg)


    ### FAKE NEWS SITES


    Why would anyone make a website that looked like a news provider? Many of these
    sites are satirical, using comedy to poke fun at real events. However, some sites
    deliberately make up false stories to influence people’s thinking. In the 2016
    US presidential election, fake stories about `Donald Trump` and his opponent `Hillary
    Clinton` were more widely read than real ones. Strangely, as a result, the real
    news media then started to report about all the fake news!


    ![Image](images/f0069-01.jpg)


    ## CYBERWAR


    Victory in war requires a decisive weapon or strategy of some kind. In ancient
    days, military leaders would target a castle or other stronghold and destroy food
    supplies. In more recent years, focus shifted to bridges, factories, and supply
    routes. Today, war has entered the cybersphere. Whichever side wins online will
    win on the battlefield as well. Hacking skills might just save a country from
    defeat.


    ### CYBER ATTACKS


    The Internet itself was born out of a military project to develop a communications
    network that would work even when its cables and routers became damaged. Now,
    enemy cybersoldiers use hacking techniques to bring the network down from the
    inside. They no longer need to target hardware, like cables. They release viruses
    and worms which block the communication systems, making it harder for a military
    command to get information, process data, and send out orders. This is just as
    effective as cutting a wire.


    ![Image](images/f0070-01.jpg)


    ### EMP WEAPONS


    An `EMP` (electromagnetic pulse) weapon releases a powerful burst of radiation
    which overloads all the low-voltage electronics in the area, rendering them useless.
    A nuclear explosion releases an `EMP` (and causes a lot more damage!). One strategy
    would be to explode a nuke high in the air to knock out the electronics below
    while minimizing other damage. “E-bombs,” or non-nuclear `EMP` weapons, can produce
    a targetable beam to knock out military installations.


    ### MEDDLING

