    `algorithm` a list of instructions designed to turn a starting point into an end
    point


    `anonymous` to have no name or identifiable features


    `bit` a single unit of information, normally recorded by a computer as a 1 or
    0


    `blockchain` an online record of transactions that is public and cannot be changed
    or doctored


    `browser` the software application used to access and view material that is available
    on the World Wide Web


    `byte` a unit of memory, made up of eight bits


    `CCTV` (closed-circuit television), a name for security cameras where an area—a
    shop or street, perhaps—can be viewed on screens


    `cloning` a system that makes a genetic copy of a living thing. The clone shares
    the same DNA as the original but is not an exact copy.


    `copyright` the rule that says text, pictures, or any other creative product belongs
    to the person who made it, and cannot be copied without their permission


    `currency` the system of exchange used to buy and sell things


    `data` information, often in the form of numbers, that has been recorded in relation
    to something specific


    `encryption` the process of hiding the meaning of information using codes and
    ciphers


    `ethics` a set of principles that guide decision making


    `hardware` the physical parts of a computer, including the display or screen,
    the keyboard, processors, memory, and power supply


    ![Image](images/f0092-01.jpg)


    `infrastructure` the constructions, such as roads, bridges, and tunnels, power
    and water supplies, and communications that allow people to move around public
    spaces and live normal lives


    `input` the start point of a computer program. This could be a click of a keyboard
    or swipe of a finger. The programming will then convert that input into an output.


    `intelligence` in this context, referring to information collected about a rival,
    enemy, or competitor. The purpose of espionage, or spying, is to gather intelligence
    and understand what it means.


    `LED` short for light-emitting diode, an electronic device that emits bright light
    when electrified. LEDs are used in flat-screen displays (and numerous other places).


    `life hack` a technique for making a part of everyday life easier, generally using
    something designed for another purpose entirely


    `neutrality` not taking sides and being balanced between one point of view and
    another opinion


    `output` the end result of a computer algorithm, which could be a sound made by
    a speaker, or a pixel appearing on a screen


    `poll` a survey that asks a group of people their opinion about an issue of the
    day, and uses the results to estimate the opinion of a much larger group, even
    the entire country


    `processor` the microchip “brain” of a computer that contains the algorithms of
    a program and uses them to turn inputs into outputs


    ![Image](images/f0093-01.jpg)


    `protocol` a set of strict rules that control how computers communicate and exchange
    information


    `quantum` a small packet of something. In terms of quantum physics, this relates
    to the way matter and energy are constructed of small packets that cannot be divided
    up or added to.


    `software` the programs that control computer hardware


    `speculator` someone who buys and sells things based on how they think their value
    will change in the future


    `surveillance` a close observation of a person, recording everything they do


    `The Pentagon` the headquarters of the US military, so named because it is located
    inside a giant five-sided building near Washington, D.C.


    ## FIND OUT MORE


    Now over to you. Use these resources to continue your exploration of all things,
    coding, and computing. A computing museum will show you where all the technology
    came from, while games are a good place to start as a codebreaker. Good luck!


    ![Image](images/f94.jpg)


    ### BOOKS

    There are many books written on the subject of hacking, some by hackers themselves.
    These ones are a good place to start. `Hacking For Dummies` by Kevin Beaver; John
    Wiley & Sons. `Ghost in the Wires: My Adventures as the World’s Wanted Hacker`
    by Kevin Mitnick; Little and Company. `The Science of Computers (Get Ahead in
    Computing)` by Clive Gifford; Wayland.


    ### WEBSITES AND ONLINE

    Where best to learn about computer than your computer? What is Hacking? `www.bbc.co.uk/news/3989632`.
    White Hat Code, `www.rootz.org`. Under 15 Rising Stars in Cybersecurity `projects.csmonitor.com/hackerkids`.
    All web addresses were correct at the time of printing. The Publishers and author
    cannot be held responsible for the content of the websites referred to in this
    book.


    ### GAMES

    You can learn more about hacking and experiment with the skills yourself with
    these games. CIA breakers `www.cia.gov/kids-page/games/break-the-code`. Hackers,
    board game `www.thinkfun.com/products/hacker`.


    ### MUSEUMS

    Museums are great places to visit to discover and learn more about computers in
    an interactive way. National Cryptologic Museum, Maryland `www.cryptologicfoundation.org`.
    Computer History Museum, California `www.computerhistory.org`.


    ### WORKSHOPS AND HACKER EVENTS

    If you’ve been inspired by this book to experiment with hacking then these events
    and workshops are for you. Just remember white hat hacking is legal! Asylum Las
    Vegas; Nevada; USA `www.rootz.org`. Hak4Kids; Illinois; USA `www.hak4kidz.com`.


    ### APPS

    Learn more on the go with apps which you can download to your smart phone. The
    Guides, `Android / iOS`. A curious game, full of mind-challenging puzzles which
    will keep you occupied for hours. Can you hack it?


    ![Image](images/f0095-01.jpg)


