    In the Internet of Things future, everything will be connected to everything else,
    and that shared information will have a big impact on the way we live. Shops will
    respond to your presence, offering deals just for you. Cars will receive live
    data about traffic conditions and automatically reroute to avoid jams. The water
    supply will use long-term weather forecasting from sensors all over the world—and
    in space—to ensure water usage is sustainable throughout the year.


    ![Image](images/f0082-01.jpg)


    ### ARTIFICIAL INTELLIGENCE


    A lot of the projected benefits of the Internet of Things relies on artificial
    intelligence (AI). There are two ways of looking at AI. Narrow AI learns how to
    do one thing really well, often better than a human can, but can’t learn to do
    something outside of its programming. Strong AI, by contrast, knows what it doesn’t
    know and figures out what it needs to learn to achieve a goal. In this way, strong
    AI (which only exists in science fiction) is like a human’s EI (evolved intelligence).


    ## COMPUTING THE FUTURE


    Computing has a problem. Throughout its history, the speed and power of computers
    has only ever increased. Fast processors once only found in cutting-edge facilities
    are now in all our devices. Today, a pocket-sized device can connect us with anyone
    anywhere on the planet—and even in orbit! However, our desire for more and more
    processing power cannot be met forever. We will have to find a new way of computing.


    ### MOORE’S LAW


    In 1965, Gordon Moore, the head of the Intel microchip company, predicted that
    the number of components on a microchip, and so the amount of data a computer
    could process, would double every 18 months. So far Moore’s Law has proved broadly
    correct. If there were no limits, by the 2050s a computer chip would have the
    processing power of every human brain on Earth working together. As it stands,
    Moore’s law is expected to be broken by 2025.


    ![Image](images/f0084-01.jpg)


    ### QUANTUM COMPUTING


    A silicon transistor holds information by being switched on (1) or off (0). Quantum
    computing would do away with silicon and record information using the quantum
    properties of an atom or molecule—their spin direction, magnetism, and electrical
    charge. A particle’s quantum properties are hard to pin down and so are best understood
    in terms of chance. For example, the chance that the spin direction is “up” might
    be 0.7 and so “down” would be 0.3. The on–off switch on a silicon chip can only
    hold one piece or “bit” of information, a 1 or 0. A quantum bit, or “qubit,” holds
    two pieces of information (0.7 and 0.3) at the same time. A 32-bit computer handles
    32 bits of information at a time, but a 32-qubit computer holds 4,294,967,296
    bits at a time. You can see how quantum computing might make very powerful processors
    in the future.


    ## GENE HACKING


    Hacking began with model railways and produced the biggest computer and software
    companies in the world. Hackers have impacted many fields from journalism to art,
    and even the way money works. However, the most significant hacks in the future
    might be made to our own bodies. The technology exists to hack DNA to fix a problem
    or give your body a new ability—and change the genes that generations to come
    will inherit. But should we hack genes? Is it right?


    ### CRISPR


    The main gene-hacking technique is called `CRISPR Cas9`. It uses a defense system
    used by bacteria to cut up virus DNA. The `CRISPR` system has been hacked so it
    can be reprogrammed to cut any DNA, including human DNA, at a very precise place.
    A new bit of DNA can be added to reconnect the severed ends, adding in new genetic
    information and thus hacking the gene so it works in a different way.


    ### CLONING


    `Cloning` is a generic hack where a baby animal is created which is identical
    to its single parent. The most famous clone is Dolly the Sheep who was born in
    1996. Cloning humans is illegal—and may not even be possible—not least because
    most cloning attempts end in severe developmental problems. Dolly was the only
    survivor of 277 attempts to produce a clone.


    ![Image](images/f0086-01.jpg)


    ### STEM CELL THERAPY


    Every cell in the body is specialized—we have blood cells, bone cells, and muscle
    cells, for example. They all develop from a powerful starter cell, the stem cell,
    but once specialized, the cell cannot change to another form. Doctors have figured
    out how to hack certain body cells to turn them back into these stem cells. Stem
    cells could then be used to grow new organs, heal nerves, and fix other injuries
    that are currently incurable.


    ## PROS AND CONS


    So now that we’ve taken a tour of the world of computer technology and hacking,
    are you excited by the future promised by big data, quantum computing, and AI?
    Do you want to know more about cryptocurrencies, blockchains, and the Internet
    of Things? Or are you terrified of the risk of hacking attacks and confused by
    fake news? There is a lot to take in and weigh up. It might help to think about
    the different ways we can understand morality and ethics, the systems that we
    use to divide good from bad.


    ### CONSEQUENCES


    One school of ethics can be summed up by the phrase, “All’s well that ends well.”
    The focus of this way of understanding good and bad is the consequence of someone’s
    actions. Imagine two twins. One crashes and injures a pedestrian, while the other
    parks without incident. Did the driver do more wrong than his twin?


    ![Image](images/f0088-01.jpg)


    ### VIRTUE


    This is a very old way of understanding good and bad that dates back to the ancient
    Greeks. Behaving in a good way relies on a person having good qualities, such
    as generosity, kindness, and patience. Behaving badly uses bad qualities and leads
    to unhappiness. But virtue ethics can allow a person to link whatever makes them
    feel good as the right thing to do.


    ### DUTY


    Being moral means doing the right thing by other people even if you suffer as
    a result. It is what you do that counts as good or bad, not what happens when
    you do it. Good behaviors come from duties, which are self-evidently good, such
    as helping people in pain. What makes you feel good.


    ### RELATIVISM


    This set of ideas tells us that good and bad changes as society changes and learns
    more about the world and how to control it in useful ways. Anything goes as long
    as it benefits society as a whole. If you can get away with a behavior without
    society condemning you for it, then that is a good behavior. This means that what
    was a crime in the past may be allowed today, and what might be normal behavior
    in one country is not in another.


    ## MIND MAP


    You’ve reached the end of the book and now know a lot about hacking, but what
    do you think about it? After learning about different moral codes, do you think
    it’s right? Or is it ultimately wrong? Are some aspects good? I can’t tell you
    the answer, because there isn’t one! You have to make your own informed opinion,
    but now you have the tools to do just that. This mind map is a starting point
    to building the big picture of hacking and online technology. Every subject seems
    to lead to another, and every question answered ends up with more things to ask.
    So, now you have the information, what will your opinion be?


    ## GLOSSARY


    **activist** a person who tries to make a change in society through their actions


    **algebra** a system of calculation where numbers are represented by letters

