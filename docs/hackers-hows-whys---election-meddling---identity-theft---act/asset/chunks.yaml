    16 世纪 60 年代，英国女王伊丽莎白一世囚禁了她的天主教表妹——苏格兰女王玛丽一世，因为她担心对方可能篡夺英国王位。当玛丽给阴谋者的信件被发现时，伊丽莎白的密码专家托马斯·菲利普斯（Thomas
    Phelippes）破解了这些信件，揭露了她的计划。玛丽使用的是一种同音密码，一个明文字母由几个可能的密文符号表示。这是一种命名系统（nomenator），经常使用的名称——如伊丽莎白、玛丽、西班牙——都有自己的符号。这使得频率分析变得困难。菲利普斯花了几个月才破译，但他通过识别常见的英语短语实现的。例如，信件通常以相同的方式开头和结尾：“Dear……”和“Yours…”，于是他从这里入手，并发现玛丽希望西班牙国王腓利普入侵英国并杀死伊丽莎白。一旦代码被破解，玛丽便被处决了。


    ![Image](img/f0014-01.jpg)


    # 电报黑客


    1917 年，美国正在考虑作为法国和英国的盟友加入第一次世界大战（1914–18 年）。德国外交部长向墨西哥发送了一电报（通过电报发送的信件），要求他们入侵美国以阻止美军前往欧洲。作为回报，墨西哥将收回美国夺取的德州或其他地区。德国人无法向墨西哥发送信息（所有电报电缆都经过英国），但他们可以向美国发送几个加密信号。这些加密信息本应用于和平谈判，但德国人欺骗了一位美国官员发送了墨西哥电报，而该电报仍然隐藏在代码中。如今的黑客使用一种类似于“特洛伊木马”的技术，将恶意行为隐藏在看似有用的任务中（更多请参见此处）。墨西哥人拒绝加入德国的一方。无论如何，英国间谍很快破译了信息并警告了美国人。然而，他们必须编造一个关于他们如何获取信息的理由，以免让美国人意识到英国人也在监视美国的电报！


    # 这算得通吗？


    艾兰·图灵（Alan Turing）被认为是一位帮助赢得第二次世界大战并拯救无数生命的破译者。这已经是一项巨大的成就，直到你意识到图灵所做的还有发明了数字计算机。没有图灵，黑客可能根本不存在！


    ## 虚拟机


    图灵在计算机方面的工作有点像意外。作为一名数学家，他正在寻找一个复杂问题的答案。某些算法总是产生最终答案（那并不重要），而有些算法则一直运行。图灵想知道是否有一种方法可以在不尝试它们的情况下区分它们。为了研究，他使用了一台想象中的、或称为“虚拟”机器，这台机器可以遵循任何算法并记住结果。这台虚拟机听起来熟悉吗？技术花了几年时间才跟上，但第一批数字计算机的设计是基于图灵的。


    ## 计算机先驱


    在图灵之前的很久，计算机就已经存在了。“Computer”（计算机）是指那些工作是进行复杂数学计算的人。几个人曾尝试建造能够执行人类工作的机械计算器。最成功的是查尔斯·巴别奇（Charles
    Babbage）。1837 年，巴别奇设计了分析机，这是一种具有可编程处理器（称为`Mill`）和内存（称为`Store`）的机械设备，它可以存储千千位数字！如果巴别奇能负担得起制造所有
    25,000 个独立零件的费用，它将是第一个通用计算机！


    ![Image](img/f0016-01.jpg)


    ## 逻辑电路


    计算机使用一种称为布尔代数的数学，使用`1`和`0`，并具有奇怪的规则，例如`1+1=1`。计算机的电路遵循这些规则，因此它可以用于执行逻辑操作，或做出简单的决定，例如是或否、真或假、开或关，每秒数十亿次。美国数学家克劳德·香农（Claude
    Shannon）在图灵构想他的机器的同一时期，设计了基于布尔代数的电气系统。第一台同时拥有图灵系统（处理器、程序）和香农逻辑电路的计算机是`Baby`，于
    1948 年建造于曼彻斯特。


    # 第一批黑客


    远距离通信能力改变了社会，也改变了我们欺骗和偷窃的方式。第一个高速电信系统是 19 世纪初在全欧洲建立的信号灯塔网络——它也被用于第一次黑客攻击。让我们简要回顾一下黑客历史以跟上时代。


    ## 1834 年信号灯攻击


    弗朗索·布（Francois Blanc）和约瑟夫·布（Joseph Blanc）开发了一种在信号灯中隐藏秘密信息的方法。这对兄弟带领一个一小黑客团队从巴黎到波尔尔多传输敏感的股市信息，以便他们能比其他人早知道价格变化——这个骗局持续了两年，直到有人告发，但没有人人进监狱，因为黑入通信系统并不违法。


    ![Image](img/f0018-01.jpg)


    ## 1903 年科学流氓


    1903 年，马尔尼（Marconi）进行了一次演示，证明他的无线电设备可以精调，只有设置在相同频率的接收机才能接收信号。马尔尼拥有无线电专利，因此没有人可以使用该技术。在马尔尼的演示期间，内维尔·马斯克尼（Nevil
    Maskelyne）一位利用无线电的魔术师通过更强的信号接管了频率，敲出了摩斯电码。马尔尼将这种攻击称为“科学流氓”。


    ## 1956 年拨号（Phreaking）


    绰号为“泡泡”（Bubbles）的约瑟夫拥有完美的绝对音感，这意味着他不需要乐器就能吹出任何音符。20 世纪 50 年代后期，在还是个孩子时，泡泡发现他可以用哨子控制电话网络。拨号系统将数字转换为声调，命令交换机引导通话。泡泡成为了第一个“拨号黑客”（phreaker），一种利用哨子控制电话系统的黑客。（现在已经无效了。）


    ## 1967 年 IBM 内部


    1967 年，IBM 向芝加哥附近的一所高中捐赠了四个计算机终端。每个终端都连接到 IBM 办公室的主机。IBM 在主机上为学生们留了一些空间，将其与其他用户隔离开。学生们很快学会了如何进入私有区域。IBM
    最终感谢了这些孩子，因为他们的攻击帮助 IBM 使系统变得更加安全。


    ## 1971 年脆队长（Captain Crunch）


    约翰·德莱珀（John Draper），也被称为脆队长，发现他在脆脆麦片盒中作为免费赠品得到的玩具哨子可以产生正确的音调，从而免费拨打长途电话。德莱珀被威胁如果不停止黑客就要入监狱。他后来遇到了史蒂夫·乔布斯（Steve
    Jobs）和史蒂夫·沃兹尼亚克（Steve Wozniak），这两个制造并销售拨号设备的学生后来创立了苹果公司。


    ## 1981 年闪电队长（Captain Zap）


    伊恩·墨菲（Ian Murphy），广为人知的闪电队长，自称执行了最大的攻击。他黑入了美国最大的电信供应商，并更改了系统的内部时钟，使得在白天高峰期使用电话的人按便宜的夜间费率计费。


    ## 1984 年混沌通信大会


    第一届“黑客大会”（hackercon）于 1984 年在德国汉堡举行，从此以后每年举行一次。它由混沌计算机俱乐部（Chaos Computer Club）运营，这是一个拥有
    7000 多成员的德语黑客协会。


