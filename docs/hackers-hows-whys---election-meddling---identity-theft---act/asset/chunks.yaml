- raw: "    “White hats” know all the tricks and techniques to break through cybersecurity\
    \ but do not use them for criminal purposes. An organization employs a white hat\
    \ to help them improve their security and keep black hats out. Often the white\
    \ hat works as a “sneaker,” an operative who has permission to break into an organization’s\
    \ network—or at least try—but few people at the organization know in advance that\
    \ they are about to be attacked.\n\n    ## HACKTIVISM\n\n    Hacking can be used\
    \ as a force for change. When hackers are also political **activists**, they become\
    \ “hacktivists.” A hacktivist uses their technology skills to apply political\
    \ pressure by carrying out an online protest. As you can imagine, hacktivism is\
    \ a morally difficult area, and some people who see themselves as politically\
    \ motivated freedom fighters are regarded as spies and even terrorists by others.\n\
    \n    ### CULT OF THE DEAD COW\n\n    The story of hacktivism begins in a disused\
    \ slaughterhouse in Lubbock, Texas, in 1984. Here, three friends formed the Cult\
    \ of the Dead Cow (or cDc), coordinating a wider team of hackers via bulletin\
    \ boards (a pre-Web message system—see [here](#ch16.xhtml#page_56).) In the late\
    \ 1990s, the cDc launched the Hacktivismo group, which combated censorship on\
    \ the Web and created tools for use by political dissidents around the world.\n\
    \n    ### ANONYMOUS\n\n    The most famous hacktivist group is Anonymous. It has\
    \ no leader and is made up of people from all over the world, who communicate\
    \ via online forums using usernames or “handles.” Once Anonymous members—the Anons—agree\
    \ on a target, they work alone or in small teams and their actions accumulate\
    \ into a coherent attack. Anonymous generally blocks a target’s communications\
    \ and tries to access secret information to highlight what the Anons perceive\
    \ as wrongdoing.\n\n    ### LULZSEC\n\n    With a name that means “laughing at\
    \ security” in hacker-speak, LulzSec were not interested in making money, but\
    \ sought revenge against companies that they thought needed to be taught a lesson.\
    \ They targeted media companies, political parties, and even cybersecurity firms.\
    \ One of their more effective pranks was to reroute their enemy’s customer service\
    \ telephone lines to different companies. The seven ringleaders of LulzSec—none\
    \ of whom had ever met—were arrested in 2012. The youngest was just 16.\n\n  \
    \  ![Image](images/f0043-01.jpg)\n\n    ### WIKILEAKS\n\n    The most notorious\
    \ hacktivist group is Wikileaks. It was founded in 2006 by Julian Assange, an\
    \ Australian with an extensive hacking past. Wikileaks styles itself as a new\
    \ kind of media platform. It receives information from whistleblowers, or people\
    \ who reveal the secrets of a government or organization to highlight what they\
    \ believe to be wrongdoing. Wikileaks then releases this information—or at least\
    \ some of it—often in collaboration with newspapers around the world.\n\n    ###\
    \ A WANTED MAN\n\n    In 2010, Julian Assange was asked to go to Sweden for questioning\
    \ over sexual assaults. He refused and in 2012, went to live inside the Ecuadorian\
    \ Embassy in London. He was given Ecuadorian citizenship, which meant that he\
    \ could not be arrested if he stayed inside. In 2019 Ecuador took away his citizenship,\
    \ and so the British police arrested him and sent him to prison. Assange is still\
    \ wanted in Sweden, and the United States has also accused him of hacking their\
    \ secrets.\n\n    ![Image](images/f0044-01.jpg)![Image](images/f0045-01.jpg)\n\
    \n    ## CULTURE JAMMING\n\n    Here’s an idea. Print the old social media posts\
    \ of politicians on huge posters, stick them up on billboards, and then post photos\
    \ of it on social media. Everyone takes more notice of what the politicians said.\
    \ This is “culture jamming,” also known as “reality hacking” or “guerrilla communications,”\
    \ and it’s where hacking meets the real world.\n\n    ![Image](images/f0046-01.jpg)\n\
    \n    ### FLASHMOB\n\n    When a crowd of strangers suddenly transforms into a\
    \ group who all start to do the same things—dancing, singing, or standing completely\
    \ still—that’s a flashmob. As suddenly as it started, the flashmob is over, and\
    \ the participants disappear back into the crowd. The first flashmob was in New\
    \ York City in 2003, when 130 people went to a department store and suddenly asked\
    \ to buy the same rug all at the same time!\n\n    ### SHARING MEMES\n\n    The\
    \ original concept of a meme was a thought experiment by biologist Richard Dawkins.\
    \ He wanted to explore how simple ideas, which he called memes, spread through\
    \ a process like biological evolution, moving from person to person, changing\
    \ or mutating as they go. The Internet makes sharing ideas very easy, and so the\
    \ term “meme” generally now applies to something fun that has spread via the Web.\n\
    \n    ![Image](images/f0047-01.jpg)\n\n    ## ESPIONAGE AND SURVEILLANCE\n\n \
    \   When does a hacker become a spy or a spy become a hacker? A determined hacker\
    \ might creep inside a high-security compound to install malware to gain access\
    \ to a target’s information. A spy might do exactly the same thing. The only real\
    \ difference is that hackers are generally criminals, while spies are hired to\
    \ do it, by a government or organization. Let’s explore the spooky world of espionage.\n\
    \n    ### SOURCES OF INFORMATION\n\n    In the language of espionage, any information\
    \ that helps you understand your target better is called intelligence. The most\
    \ obvious way to gather intelligence is when someone from a foreign power or an\
    \ enemy group changes side (“defects” is the spy term) and tells what they know.\
    \ As well as this human intelligence, the world’s spies are increasingly relying\
    \ on signals intelligence—intercepting messages and working out what they mean.\
    \ Sounds like a job for a hacker.\n\n    ### SIDE-CHANNEL ATTACKS\n\n    The United\
    \ States and the United Kingdom, both use a “side-channel attack” system called\
    \ TEMPEST to pick up signals that leak from their targets. This works out the\
    \ content of a message not by collecting the coded data itself, but by watching\
    \ how the computer and its user behave. The message itself is hidden, but the\
    \ sounds, vibrations, radio waves, and other electrical echoes given out by the\
    \ computer system may give away secrets.\n\n    ![Image](images/f0048-01.jpg)\n\
    \n    ### SURVEILLANCE\n\n    Not the same as spying, **surveillance** is the\
    \ practice of watching general activity. Police might use it to watch for crimes\
    \ and track the movements of wanted individuals. Cameras (sometimes called **CCTV**)\
    \ are a major tool, with many able to read car registration plates via ANPR or\
    \ automated number-plate recognition. However, CCTV is seldom of good enough quality\
    \ to track targets using automated facial recognition—not yet anyway.\n\n    ###\
    \ BULK INTERCEPTION\n\n    Spies want to know as much as they can about their\
    \ targets, and that means searching for enemy agents hiding out among the public.\
    \ To do that, spy agencies have increasingly started to watch everyone, looking\
    \ for clues as to where the bad guys are. This does not mean studying CCTV of\
    \ the street, it means collecting information about everyone’s communications\
    \ and filtering them to reveal secret messages sent by criminals, terrorists,\
    \ and enemy spies.\n\n    ![Image](images/f0050-01.jpg)\n\n    ### END-TO-END\
    \ ENCRYPTION\n\n    A spy can’t officially read a message without a good reason,\
    \ but they can see the sender and recipient, their locations, the time sent, and\
    \ the file type—and keep all this on record. To stop someone fromreading your\
    \ messages, you can use end-to-end encryption messaging apps. All your chat threads\
    \ will be encrypted from your device to the recipient. Not even the app provider\
    \ can read them.\n\n    ### WATCHING THE WATCHERS"
