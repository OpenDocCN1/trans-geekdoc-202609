    \ 驱动的机器人协助酒店和机场等酒店及客户服务环境，提供信息、引导客人并执行清洁任务。\n\n5. **医疗辅助**：\n   用途：配备 AI 的机器人系统支持外科医生进行复杂手术，确保高精度并降低并发症风险。\n\
