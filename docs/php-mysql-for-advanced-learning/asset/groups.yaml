    \ // Accessing static variable directly\nA::$rating = 10;\nnew A();  // Object\
    \ to call constructor\n```\n\n## PHP 中的 Getter 和 Setter\n\nGetter 和 Setter 方法提供数据封装，因此要设置或获取数据，必须通过一个方法。\n\
