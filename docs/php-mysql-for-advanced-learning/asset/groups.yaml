    # Introduction


    Completing this book is one of the hardest things that I have ever done. It took
    me almost three years to get it into the form you are reading. Every time I read
    the earlier draft I had to almost always rewrite the whole script. At most places
    I have tried to show how things work in real time scenarios.


    If you ask me to name the most important characteristic of this book I would say
    simplicity. Be it the text or code, I have tried to make it as simple as I could.


    Most of the examples of this book are taken from my training sessions or from
    our in-house development work.


    More than anything else I have tried to design this book for a programmer struggling
    with a new and complex programming. I have poured my best efforts into these pages.
    I trust you would find the book useful.


    # Who Should Read This Book?


    This book assumes that you already know web designing or UI Designing using HTML,
    CSS. If you are completely new to the PHP then I recommend that you read my introductory
    book on Web Designing-1st Edition Published in August 2016.


