    - vast majority of these classes are most often set to either paragraph, strong
    or em elements


    ### .page-header

    - class for a wrapping div of a heading

    - adds some margin, padding and border-bottom


    ### .lead

    - for highlighting an element

    - sets element''s font-size to 21px, font-weight: 300, line-height: 1.4 and margin-bottom:
    20px


    ### .text-left .text-center .text-right .text-justify

    - aligns texts, usually paragraphs, with text-align CSS property


    ### .text-nowrap

    - keeps the whole text with this class on a single line, no wrapping occurs because
    of white-space: nowrap CSS property of this class


    ### .text-lowercase .text-uppercase .text-capitalize

    - sets text-transform CSS property to make all characters inside the element with
    this class lowercase, uppercase or capitalized


    ### .text-muted

    - makes text grey


    ### .text-primary

    - makes text blue


    ### .text-success

    - makes text green


    ### .text-info

    - makes text dark blue


    ### .text-warning

    - makes text dark yellow


    ### .text-danger

    - makes text red


    ## Bootstrap Lists'' Classes


    ### .list-unstyled

    - removes list-style and margin-left on list items

    - doesn''t apply for nested lists (if needed, the nested list has to have .list-unstyled
    class as well)


    ### .list-inline

    - places list items on a single line (with display: inline-block and padding)


    ### .dl-horizontal

    - class for a definition list (<dl>)

    - sets nice styles for <dt> and <dd> within the definition list (text align, font-weight)


    ### .list-group

    - class for the parent element (usually <ul>, but can be <div> as well) of list
    items

    - list items have to have .list-group-item class


    ### .list-group-item

    - class for .list-group children elements

    - for a nicer look of the list items

    - usually on <li>, but can be <a> as well


    ### .table-condensed

    - should be combined with .table class

    - for an ordinary table with half cell padding, so rows are not that high


    ### .table-responsive

    - class for a wrapper (! mostly div) of a table to keep it responsive in the way
    that scrollbar appears on extra small devices

    - classes for either <tr> or just <td>

    - sets background color for all <td> in a table row (or just one <td>) to grey
    (active) / green (success) / blue (info) / yellow (warning) / red (danger)


    ## Bootstrap Forms'' Classes

    - don''t forget that even form elements can be in the Bootstrap grid, so don''t
    be afraid to use .row inside a form and then col-*-* wrappers


    ### .form-group

    - when creating vertical forms, it''s a class for its wrapper (mostly div) of
    each label and its input, adds some margin-bottom


    ### .form-control

    - for every form element (input, textarea...), gives it 100% width

    - to make it narrower, use a narrower wrapper (row and col-*-* divs)


    ### .form-control-static

    - for a paragraph that replaces a form element (input...)


    ### .form-horizontal

    - for horizontal forms where label is on the same line as input

    - you have to use column classes (like col-xs-10) for each label and its input
    (or whatever it is)

    - still combined with .form-group wrapper and .form-control classes


    ### .form-inline

    - for a single line form (but still vertical on extra small screens)

    - often used with the placeholder attribute to not need labels

    - labels of inline forms should get .sr-only class to be positioned so that they
    can''t be seen (but they won''t get display: none or visibility: hidden property)


    ### .input-lg

    ### .input-sm

    - makes a form element like input or select either bigger or smaller than default


    ### .input-group-lg

    ### .input-group-sm

    - classes for .input-group (see further)

    - always used together with .input-group class


    ### .caret

    - class for an empty span that creates a dropdown arrow


    ### .help-block

    - class for a span that serves as a help text for users

    - has to be placed right after an input of a form


    ### .has-success

    ### .has-warning

    ### .has-error

    - classes for wrapping divs with .form-group class

    - colours the label, input and .help-block span inside to green/yellow/red

    - the label within the wrapper with one of these classes has to have .control-label
    class to be coloured as well


    ### .has-feedback

    - class for the wrapping divs with .form-group class when you also use glyphicon
    for the input within the wrapper


    ### To disable input, use disabled="disabled" or readonly="readonly".


    ## Bootstrap Image Classes

    - images should have .img-responsive or .thumbnail to be responsive and be wrapped
    in a column wrapper (like col-xs-3...)


    ### .img-rounded

    - img class that provides little border-radius


    ### .img-circle

    - img class that provides 50% border-radius making the img circle shaped


    ### .img-thumbnail

    - img class that provides a 1px solid grey border, 4px padding, white background,
    display: inline-block property and fast CSS3 transition


    ### .thumbnail

    - class for a wrapping div (or <a> in case of gallery) of an image, adds some
    styles (border, padding, background, transition) and set''s the image max-width:
    100%, height: auto; display: block; and margin-left and margin-right: auto


    ### .img-responsive

    - img class that makes any image responsive (scaling to the parent element) as
    it has max-width: 100% and height: auto

    - may not work if placed in a floating element!


    ### .caption

    - class for a div inside .thumbnail element (a or div) that may include h3, p,
