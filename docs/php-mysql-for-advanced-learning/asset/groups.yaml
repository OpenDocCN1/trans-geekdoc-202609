    \ proceeding or inserting data into database you need to validate it to avoid\
    \ any error.\n\n## filter_var function in PHP\nfilter_var used for both, sanitize\
    \ and validate data. Sanitizing will remove any illegal character from the data\
    \ and Validating will determine if the data is as per expected or in proper form.\n\
    \n## How to use filter_var\nUsing filter_var is incredibly easy. It's simply a\
    \ PHP function that takes two inputs of data:\n\nThe variable you want to check\
    \ and The type of check to use\n\n### Example\n```php\n$title = \"<h1>Lets learn\
    \ PHP Functions <br></h1>\";\n$ftitle = filter_var($title, FILTER_SANITIZE_STRING);\n\
    echo \"After SANITIZE data is \".$ftitle;\n```\n\nOutput : Lets learn PHP Functions\n\
    \n## Example to check for valid IP Address\n```php\n$ip = \"127.0.0.1.33\";\n\n\
