    # Object Oriented Programing in PHP


    Object-oriented programming (OOP) is an approach, you can broke down your program
    into several pieces or modules , further can used to creating copies of such modules
    as per the requirement. It also allows you to group all of the variables and functions
    of a particular concept into a single class. So Object-oriented programming (OOPs)
    is more advanced and efficient than the procedural style of programming.


    # Some advantages of using OOP:


    +   - Reusability- Easy to use and manage code

    +   - Data Hiding – Data Abstraction and Encapsulation

    +   - Modularity

    +   - Resilience to change

    +   - Fast and efficient

    +   - Realistic Modeling


    Before we go in details, let’s define important terms related to Object Oriented
    Programming.


    +   - **Class** – Class is a collection of member variables and the functions.
    In other words, a class is a blueprint or a piece of code describing how to manage
    a task in the way we want

    +   - **Object** –You define a class once and then make many objects that belong
    to it just like creating multiple houses from a blueprint. Objects can have state
    behavior and identity. To create an object, we use the *new* keyword.'
