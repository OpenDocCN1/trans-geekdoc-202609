    width=device-width, initial-scale=1\">\n\n<title>Bootstrap 101 Template</title>\n\
    <link href=\"css/bootstrap.min.css\" rel=\"stylesheet\">\n</head>\n<body>\n//\
    \ Your HTML code goes\n</body>\n</html>\n```\n\n## Some Major Classes available\
    \ in Bootstrap 3\n\n### .container\n\n- sets fixed width to an element (which\
    \ changes depending on a screen size to other fixed values, so it's still responsive)\
    \ on all screen sizes except xs - on xs, the width is calculated automatically\
    \ (this behaviour can be changed)\n- a fixed width responsive website should be\
    \ wrapped in .container (or just the content without menu, whatever - it's up\
    \ to you)\n- .container can't be nested!\n\n### .container-fluid\n\n- sets 100%\
    \ width, margin-left and margin-right: auto, padding-left and padding-right: 15px\n\
    - a full screen website should be wrapped in .container - fluid\n- .container-fluid\
    \ can't be nested!\n\n### .row\n\n- creates horizontal groups of columns (which\
    \ usually have width classes, see below)\n- must be within .container to ensure\
    \ correct padding and alignment\n- only columns (block elements with width classes)\
    \ may be immediate children of rows\n- sets margin-left and margin-right: -15px\n\
    \n### .pull-right\n\n### .pull-left\n\n- sets float to either left or right\n\n\
    ### .center-block\n\n- sets margin-left and margin-right to auto\n\n## Bootstrap\
    \ Grid Classes\n\n- can be nested, the nested columns must be wrapped in .row\
    \ as well\n- all columns have float: left and position: relative styles\n\n###\
    \ .col-xs-1 .col-xs-2 .col-xs-3 .col-xs-4 .col-xs-5 .col-xs-6 .col-xs-7 .col-xs-8\
    \ .col-xs-9 .col-xs-10 .col-xs-11 .col-xs-12\n\n- sets width of a column (specified\
    \ in %) on extra small screens (<768px)\n\n### .col-sm-1 .col-sm-2 .col-sm-3 .col-sm-4\
    \ .col-sm-5 .col-sm-6 .col-sm-7 .col-sm-8 .col-sm-9 .col-sm-10 .col-sm-11 .col-sm-12\n\
    \n- sets width of a column (specified in %) on small screens (≥768px)\n\n### .col-md-1.col-md-2.col-md-3.col-md-4.col-md-5.col-md-6.col-md-7.col-md-8.col-md-9.col-md-10.col-md-11.col-md-12\n\
    \n- sets width of a column (specified in %) on medium size screens (≥992px)\n\n\
    ### .col-lg-1.col-lg-2.col-lg-3.col-lg-4.col-lg-5.col-lg-6.col-lg-7.col-lg-8.col-lg-9.col-lg-10.col-lg-11.col-lg-12\n\
    \n- sets width of a column (specified in %) on large screens (≥1200px)\n- sets\
    \ offset (margin-left) by specified number of columns (eg. set .col-sm-offset-3\
    \ class to a column to move it by three columns on small screens)\n\n### .col-xs-pull-*\
    \ (.col-xs-pull-1, .col-xs-pull-2 ... up to -12)\n.col-sm-pull-* (.col-sm-pull-1,\
    \ .col-sm-pull-2 ... up to -12)\n.col-md-pull-* (.col-md-pull-1, .col-md-pull-2\
    \ ... up to -12)\n.col-lg-pull-* (.col-lg-pull-1, .col-lg-pull-2 ... up to -12)\n\
    \n- sets left position in % as it is with columns (e.g. left: 75% with -pull-9)\n\
    \n## Bootstrap Visibility Classes\n\n- you can apply all as many of these classes\
    \ on a single element as you wish and this mixing gives you even more possibilities\
    \ for your layout\n\n### .clearfix\n\n- obvious, clear: both\n- often combined\
    \ with classes below\n"
  mdcn: "\n类似 WordPress 的 CMS 使用 MySQL 数据库来存储和检索数据以动态生成网页。\n\n如果计划运行一个不使用任何 CMS 或\
    \ PHP 语言的静态网站，则不需要数据库。\n\n## 服务器控制和访问\n\n许多主机提供商不会给 Web 开发人员对其托管域的完全访问和/或控制权限。\n\
    \n我们倾向于避开这些主机，因为当你想对服务器进行一些自定义配置时，更有可能遇到问题。\n\n查看你的主机提供的访问类型。显然，你的主机会提供 FTP 访问，以便你将文件上传到\
    \ Web 服务器。然而，有些主机只提供 FTP 访问，其他什么都没有。\n\n问题在于你很可能会遇到想要配置服务器的情况。为此你需要 telnet 或 SSH\
    \ 访问来使用命令行。\n\n事实上，配置能力在执行主机默认通常不允许的任务时往往是必要的。例如，考虑 htaccess。使用 htaccess，你可以根据\
    \ htpasswd 文件中允许的用户来拒绝和允许对某些文件和目录的访问\n\n![](img/9ab4a56a650535285811bb802190e58f_183_0.png)\n\
    \n## 管理 GUI\n\n某些主机在其套餐中提供管理 GUI（图形用户界面）或用户控制面板作为功能。很多人并不特别喜欢 GUI，但当你别无选择时——要么是因为你没有足够的服务器访问权限，要么是因为你不完全了解如何通过\
    \ telnet 完成操作——点按式解决方案就是一个很棒的工具。\n\n界面可以简单到只允许你查看有关服务器的信息，也可以复杂到允许你一键安装应用程序和编程语言。另外，请记住，如果你的客户希望能够管理其电子邮件用户，许多控制面板都有实用程序允许客户自行操作。有了这样的功能，客户无需打电话给你或\n\
    托管公司来设置电子邮件帐户，客户只需登录控制面板并根据需要设置和删除用户即可。\n\n## 备注\n\n## 备注\n\n## PHP 分页\n\n当我们在同一页面上显示大量内容时，我们开始考虑添加分页，因为在同一页面上加载所有数据在优化方面不是正确选择。因此我们将所有内容拆分为多个页面。在这种情况下——每个页面包含我们信息的一部分。我们可以使用服务器端以及客户端分页，使用\
    \ javascript 和 PHP 来管理我们的页面。\n\n你的 SQL SELECT 语句查询可能产生数千条记录的情况总是存在的。但在一页上显示所有结果并不是一个好主意。因此我们可以根据需要将此结果分成多个页面。\n\
    \n分页意味着将查询结果显示在多个页面中，而不是全部放在一个页面上。\n\n### 使用 LIMIT 获取记录以生成分页的简单示例\n\n```\n<?php\n\
    \ninclude 'dbconnectivity.php';\n\n// to check if page url already contain page\
    \ number like\ntest.php?pageNum=2\n\nif (isset($_GET['pageNum']))\n\n{\n\n$pageNum\
    \ = $_GET['pageNum'];\n\n} else\n{\n    // if no pageNum variable exist in url\
    \ then set pageNum variable to page 1\n    $pageNum = 1;\n}\n\n// place your query\
    \ here\n$query=mysql_query(\"select * from imageslave\");\n\n$resultRows = mysql_num_rows($query);\n\
    \n// Set number of Records per page\n$rowsPerPage = 4;\n\n/* Calculate how many\
    \ pages to be generate example if you have 20 record and you want to display 4\
    \ pages each page then last page will be 5. ( 20/4 =5 )*/\n$lastPage = ceil($resultRows/$rowsPerPage);\n\
    \n// set page position to beginning or at the end of the page\nif ($pageNum >\
    \ $lastPage)\n{\n    $pageNum = $lastPage;\n}\n    else if ($pageNum < 1)\n{\n\
    $pageNum = 1;\n}\nwhile($row =mysql_fetch_assoc($query))\n{\n\n// display data\
    \ fields here\necho $row['fname'];\necho \" \" .$row['lname'].\"<br>\";\n}\necho\
    \ \"<br><br>\";\n\n// Display links of Next / Prev Page\nif ($pageNum > 1)\n{\n\
    \    $prevPage = $pageNum-1;\n    echo \" <a href='{$_SERVER['PHP_SELF']}?pageNum=1'>FIRST</a>\
    \ \";\n    echo \" <a href='{$_SERVER['PHP_SELF']}?pageNum=$prevPage'>PREVIOUS</a>\
    \ \";\n}\necho \"Page $pageNum of $lastPage \";\nif ($pageNum < $lastPage)\n{\n\
    \n$nextPage = $pageNum+1;\n\necho \" <a href='{$_SERVER['PHP_SELF']}?pageNum=$nextPage'>NEXT</a>\
    \ \";\n\necho \" <a href='{$_SERVER['PHP_SELF']}?pageNum=$lastPage'>LAST</a>\"\
    \ ;\n\n}\n\n?>\n```\n\n## 备注\n\n## **Bootstrap – 框架**\n\nBootstrap 是一个免费的开源 CSS\
    \ 框架，面向响应式、移动优先的前端 Web 开发。它包含用于排版、表单、按钮、导航和其他界面组件的基于 CSS- 和（可选）JavaScript 的设计模板。*(来源：维基百科)*\n\
    \n最初名为 Twitter Blueprint，由 **Mark Otto 和 Jacob Thornton** 在 **Twitter** 开发，作为一个框架以鼓励内部工具的一致性。\n\
    \n**安装指南：** 你可以访问 getbootstrap.com 下载 bootstrap 的最新版本。下载设置后你需要解压或提取它。你将获得以下三个目录\n\
    \n- **CSS** – 包含所需的 css 文件，例如 – bootstrap.min.css, bootstrap-theme.css 等\n- **Fonts**\
    \ - 包含用于额外字体的 ttf 和 otf 文件\n- **JS** - 包含所需的 JS 文件 – 例如 – bootstrap.min.js, npm.js\
    \ 等。\n\n### **示例代码：安装 Bootstrap**\n\n```\n<!DOCTYPE html>\n\n<html lang=\"en\"\
    >\n\n  <head>\n\n    <meta charset=\"utf-8\">\n\n    <meta http-equiv=\"X-UA-Compatible\"\
    \ content=\"IE=edge\">\n\n    <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1\">\n\n<title>Bootstrap 101 Template</title>\n<link href=\"css/bootstrap.min.css\"\
    \ rel=\"stylesheet\">\n</head>\n<body>\n// Your HTML code goes\n</body>\n</html>\n\
    ```\n\n## Bootstrap 3 中可用的一些主要类\n\n### .container\n\n- 为元素设置固定宽度（根据屏幕尺寸会更改为其他固定值，因此仍然具有响应性）在除\
    \ xs 之外的所有屏幕尺寸上 - 在 xs 上，宽度会自动计算（此行为可以更改）\n- 固定宽度的响应式网站应包装在 .container 中（或仅内容而不带菜单，随便你——由你决定）\n\
    - .container 不能嵌套！\n\n### .container-fluid\n\n- 设置 100% 宽度，margin-left 和 margin-right:\
    \ auto，padding-left 和 padding-right: 15px\n- 全屏网站应包装在 .container - fluid 中\n-\
    \ .container-fluid 不能嵌套！\n\n### .row\n\n- 创建列的水平组（通常具有宽度类，见下文）\n- 必须在 .container\
    \ 内以确保正确的填充和对齐\n- 只有列（具有宽度类的块元素）可以是行的直接子元素\n- 设置 margin-left 和 margin-right: -15px\n\
    \n### .pull-right\n\n### .pull-left\n\n- 将 float 设置为 left 或 right\n\n### .center-block\n\
    \n- 将 margin-left 和 margin-right 设置为 auto\n\n## Bootstrap 网格类\n\n- 可以嵌套，嵌套的列也必须包装在\
    \ .row 中\n- 所有列都有 float: left 和 position: relative 样式\n\n### .col-xs-1 .col-xs-2\
    \ .col-xs-3 .col-xs-4 .col-xs-5 .col-xs-6 .col-xs-7 .col-xs-8 .col-xs-9 .col-xs-10\
    \ .col-xs-11 .col-xs-12\n\n- 在超小屏幕（<768px）上设置列的宽度（以 % 指定）\n\n### .col-sm-1 .col-sm-2\
    \ .col-sm-3 .col-sm-4 .col-sm-5 .col-sm-6 .col-sm-7 .col-sm-8 .col-sm-9 .col-sm-10\
    \ .col-sm-11 .col-sm-12\n\n- 在小屏幕（≥768px）上设置列的宽度（以 % 指定）\n\n### .col-md-1.col-md-2.col-md-3.col-md-4.col-md-5.col-md-6.col-md-7.col-md-8.col-md-9.col-md-10.col-md-11.col-md-12\n\
    \n- 在中等尺寸屏幕（≥992px）上设置列的宽度（以 % 指定）\n\n### .col-lg-1.col-lg-2.col-lg-3.col-lg-4.col-lg-5.col-lg-6.col-lg-7.col-lg-8.col-lg-9.col-lg-10.col-lg-11.col-lg-12\n\
    \n- 在大屏幕（≥1200px）上设置列的宽度（以 % 指定）\n- 通过指定列数设置偏移（margin-left）（例如，在小屏幕上将列移动三列，将 .col-sm-offset-3\
    \ 类设置为列）\n\n### .col-xs-pull-* (.col-xs-pull-1, .col-xs-pull-2 ... up to -12)\n\
    .col-sm-pull-* (.col-sm-pull-1, .col-sm-pull-2 ... up to -12)\n.col-md-pull-*\
    \ (.col-md-pull-1, .col-md-pull-2 ... up to -12)\n.col-lg-pull-* (.col-lg-pull-1,\
    \ .col-lg-pull-2 ... up to -12)\n\n- 以与列相同的方式按 % 设置 left 位置（例如，使用 -pull-9 时 left:\
    \ 75%）\n\n## Bootstrap 可见性类\n\n- 你可以在单个元素上应用任意多个这些类，这种混合为你的布局提供了更多可能性\n\n### .clearfix\n\
    \n- 显而易见，clear: both\n- 通常与下面的类组合使用\n"
