    # MySQL Transactions:


    A transaction is a sequential group of database operations or queries, which is
    performed as if it were one single work unit. In other words, a transaction will
    never be complete unless each individual operation within the group is successful.
    If any operation within the transaction fails, the entire transaction will fail.


    So in short you will club or combine multiple SQL queries into a group and you
    will execute all of them together as the part of a transaction.


    # Why transaction is required in database:


    Consider a n example of ATM Machine. We all use to withdraw and transfer money
    by using ATM. If you break withdrawal operation into individual steps you will
    find:


    +   1) Verify account details.

    +   2) Accept withdrawal request

    +   3) Check balance

    +   4) Update balance

    +   4) Dispense money


    Suppose your account balance is 1000$ and you make a withdrawal request of 900$.
    At fourth step, your balance is updated to 900$ and ATM machine stops working
    due to power outage'
