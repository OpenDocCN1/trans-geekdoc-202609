    \ as require will raise a fatal error and terminates execution.\n\nFunction require\
    \ () throws an error (E_COMPILE_ERROR) and stop the script.\n\nFunction include\
    \ () throws a warning (E_WARNING) but the script will continue.\n\n## **require_once()**\n\
    \nfunction require_once is useful if the result of the code is necessary but subsequent\
    \ inclusions would throw an error. That goes for scripts with functions for instance.\
    \ If such a script would be included more than once an error would be thrown since\
    \ functions cannot be redeclared.\n\n## **include_once()**\n\nFunction include_once\
    \ is useful in the case of including remote files and not wanting them to be included\
    \ several times due to an HTTP overhead. This is also useful in payment gateway\
    \ and process on e-commerce websites.\n\n## Examples\n\n```html\n<html>\n\n<head>\n\
    \n<title>My Web page</title>\n\n</head>\n\n<body>\n\n<div class=\"header\">\n\n\
    <?php\ninclude_once \"menu.php\";\n?>\n</div>\n<div class=\"footer\">\n<?php\n\
    include_once \"menu.php\";\n?>\n</div>\n</body>\n</html>\n```\n\nIn this example\
    \ you will see a warning when you attempt to recall file “menu.php”\n\n## PHP\
    \ Errors - Troubleshooting\n\nFatal error: Call to undefined function xyz() in\
    \ localhost/test.php on line 2\n\nSolution: This means that a PHP function that\
    \ the current page needs cannot be found. Check carefully that all of the included\
    \ files have been uploaded or replaced and that you have followed the installation\
    \ instructions.\n\nPHP Warning: include(abc.php): failed to open stream: No such\
    \ file or directory in localhost/test.php on line 2\n\nSolution: This warning\
    \ tells you that an include file (included using PHP’s include syntax) was not\
    \ found. If you get a warning or error message that a file could not be opened,\
    \ then check that the\nfile referred to in the error message is there and that\
    \ your path to it is correct.\n\nWarning: move_uploaded_file(upload/logo.jpg)\
    \ [function.move-uploaded-file]: failed to open stream: Permission denied in localhost/upload.php\
    \ on line 32\n\n**Solution:** This warning is an example of a permissions error.\
    \ The script is trying to upload a file to a directory, but the directory doesn’t\
    \ have enough permission for the file to be moved to it.\n"
