  mdcn: "\n## 使用 GROUP BY 子句\n\nGROUP BY 广泛地与聚合函数一起使用，如 sum、avg、max、min、count 等。它为列中存在的每个元素创建唯一的组。\n\
    \n## 示例\n\n```\nselect dept, sum(salary) from emp_table group by dept;\n```\n\n\
    *上述查询将以透视视图显示每个部门的薪资总和。*\n\n## GROUP BY 子句和 DISTINCT 关键字\n\n| 组按 | 唯一 |\n|---|---|\n\
    | GROUP BY 子句广泛地与聚合函数一起使用，如 sum、avg、max min count 等。它为列中存在的每个元素创建唯一的组 | DISTINCT\
    \ 关键字用于简单查询中与 WHERE 子句一起使用以获取唯一记录。DISTINCT 不能用于计算或聚合目的。 |\n\n## HAVING 子句：\n\n\
    HAVING 子句可以在应用 GROUP BY 子句后用于过滤记录。因此它可用于汇总组记录。因此只有满足 HAVING 条件的组（在 GROUP BY 子句后创建）才会被作为结果返回。\n\
    \n## HAVING 子句与 WHERE 子句有何不同？\n\nHAVING 应用于汇总的组记录，而 WHERE 应用于单个记录。简而言之，“ where\
    \ clause never work with aggregate function with group by ”。\n\nWHERE 子句在数据聚合之前过滤记录，而\
    \ HAVING 在聚合/计算执行后执行。\n\n## HAVING 子句语法\n\n```\nSELECT column-names FROM table-name\
    \ WHERE condition\nGROUP BY column-names HAVING condition\n```\n\n**示例：** 列出每个部门的员工数量。\n\
    \n仅包含员工数量超过 15 的部门。\n\n```\nSELECT COUNT(name), dept FROM mytable GROUP BY dept\n\
    HAVING COUNT(name) > 15\n```\n\n## 示例 2\n\n```\nselect min(salary) from emp group\
    \ by emp_name having min(salary)<15000;\n```\n\n## 示例 3\n\n```\nselect dept,count(*)\
    \ from emp group by dept having count(*)>3;\n```\n\n## MySQL 中的子查询：\n\n子查询或内部查询有时称为嵌套查询，是嵌入在\
    \ WHERE 子句中的另一个 SQL 查询内的查询。简单来说，子查询是一个内部查询，它使用不同的 SQL 子句放置在外部查询中。\n\n我们可以在 MySQL\
    \ 中主要与 SELECT 命令一起在括号内使用子查询。ORDER BY 命令不能在子查询中使用，尽管主查询可以使用 ORDER BY。GROUP BY 命令可用于执行相同的操作。\n\
    \n示例：查找部门员工数量超过 3 人的部门的姓名列表。\n\n```\nselect name from emp where dept in(select\
