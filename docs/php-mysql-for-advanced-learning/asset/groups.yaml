    ```\n\n## 说明\n\n## 示例\n\n```\n<?php\nif(!file_exists(\"/docs/resume.txt\"))\n\
    {\n    die(\"File not found\");\n}\nelse\n{\n    $file = fopen(\"/docs/resume.txt\"\
    ,\"r\");\n}\n?>\n```\n\n## 示例：\n\n```\n<?php\n$a = 0;\n$b = 200;\n$result = $b/$a;\n\
    echo \"RESULT: \". $result;\n?>\n```\n\n输出：Warning: Division by zero in ... on\
    \ line 4\n\n## 示例：\n\n```\n<?php\necho \"Hi lets learn PHP\"\necho \"<br/>This\
    \ is another line\";\n?>\n```\n\n输出：Parse error: syntax error, unexpected 'echo'\
    \ (T_ECHO), expecting ',' or ';' in ... on line 3\n\n## **PHP 中的一些可能错误**\n\n-\
    \ E_ERROR——致命的运行时错误。脚本的执行被中止。\n- E_WARNING——非致命错误。执行不会中止。\n- E_PARSE——编译时的解析错误。\n\
    - E_NOTICE——运行时的通知。\n- E_ALL——除E_STRICT级别之外的所有错误和警告。\n- E_CORE_WARNING——PHP初始启动期间发生的非致命运行时错误。\n\
    \n我们可以在以下几个不同的位置控制错误：\n\n- 在 php.ini 文件中\n- 在 Web 服务器上的 .htaccess 文件中\n- 从你自己的\
    \ PHP 代码中。\n\n我们也可以在运行时通过从自己的PHP代码中调用 error_reporting() 函数来做到这一点，如下所示：\n\n```\n\
    error_reporting(E_ALL);\n```\n\n要打开错误日志并将错误记录到我们指定的日志文件中（而不是默认的错误日志文件，默认通常是 Web\
    \ 服务器的错误日志文件）：\n\n```\nlog_errors = on\nerror_log = \"/tmp/error.log\"\n```\n\n\
    ## **创建自定义错误处理器：**\n\n我们只需创建一个特殊函数，当 PHP 中发生错误时可以调用该函数。在示例中，如果发生特定错误，我们将发送一封包含错误信息的电子邮件：\n\
    \n```php\n<?php\n//error handler function\nfunction customError($errno, $errstr)\n\
    {\n    echo \"<b>Error:</b> [$errno] $errstr<br>\";\n    echo \"Error Occurred\"\
    ;\n    error_log(\"Error: [$errno] $errstr\",1,\n    \"info@websjyoti.com\",\"\
    From: webmaster@websjyoti.com\");\n}\n\n//set error handler\nset_error_handler(\"\
    customError\",E_USER_WARNING);\n\n//trigger error\n$test=2;\nif ($test>=1)\n{\n\
    \    trigger_error(\"Value must be 1 or below\",E_USER_WARNING);\n}\n?>\n```\n\
    \n## 解释：\n\nset_error_handler()：PHP 的默认错误处理器是内置的错误处理器。我们在脚本运行期间将上面的函数设为默认错误处理器。由于我们希望自定义函数处理所有错误，set_error_handler()\
    \ 只需要一个参数，也可以添加第二个参数来指定错误级别。\n\n## 示例\n\nset_error_handler(\"customError\",E_USER_WARNING);\
    \ 当非法输入发生时，trigger_error() 函数会引发错误。\n\n## 使用 include() 函数：\n\n假设你想在每个页面上打印相同的信息，比如公司的详细信息和地址，或者今天的日期。如果你在网站的每个页面中都放置相同的代码，那效率并不高，因为——\n\
    \n- 你一遍又一遍地输入相同的信息，这不是一个好方法。\n- 如果需要更新或更改，你必须对网站的每个页面进行修改，这是一个非常耗时的过程。\n\n解决这个问题的方法是使用\
    \ include() 方法。你可以将常用信息放到一个单独的文件中。例如，如果有一组变量需要在网站的每个页面中使用，你可以在一个 PHP 文件中一次性定义它们。然后，在每个页面中，你可以通过引用该文件来\
    \ include() 它。\n\n## include 和 require 之间的区别：\n\nPHP 中 include 和 require 语句的主要区别在于：如果发生任何错误，include\
    \ 将产生一条错误消息，然后继续执行页面中的其余代码；而 require 将产生一个致命错误并终止执行。\n\nrequire() 函数会抛出一个错误（E_COMPILE_ERROR）并停止脚本。\n\
    \ninclude() 函数会抛出一个警告（E_WARNING），但脚本将继续执行。\n\n## **require_once()**\n\n当代码的结果是必需的，但后续的包含会抛出错误时，require_once()\
    \ 函数非常有用。这适用于带有函数的脚本。如果这样的脚本被多次包含，就会抛出错误，因为函数不能被重新声明。\n\n## **include_once()**\n\
    \ninclude_once() 函数在包含远程文件并且不希望因 HTTP 开销而多次包含它们的情况下非常有用。这在支付网关以及电子商务网站的处理过程中也很有用。\n\
    \n## 示例\n\n```html\n<html>\n\n<head>\n\n<title>My Web page</title>\n\n</head>\n\
    \n<body>\n\n<div class=\"header\">\n\n<?php\ninclude_once \"menu.php\";\n?>\n\
    </div>\n<div class=\"footer\">\n<?php\ninclude_once \"menu.php\";\n?>\n</div>\n\
    </body>\n</html>\n```\n\n在此示例中，当你尝试重新调用文件“menu.php”时，会看到一个警告。\n\n## PHP 错误——故障排查\n\
    \nFatal error: Call to undefined function xyz() in localhost/test.php on line\
    \ 2\n\n解决方案：这意味着当前页面需要的 PHP 函数找不到。请仔细检查所有包含的文件是否已上传或替换，以及是否遵循了安装说明。\n\nPHP Warning:\
    \ include(abc.php): failed to open stream: No such file or directory in localhost/test.php\
    \ on line 2\n\n解决方案：此警告告诉你，一个包含文件（使用 PHP 的 include 语法包含的文件）未找到。如果你收到有关无法打开文件的警告或错误消息，请检查错误消息中提到的文件是否存在，以及你的路径是否正确。\n\
    \nWarning: move_uploaded_file(upload/logo.jpg) [function.move-uploaded-file]:\
    \ failed to open stream: Permission denied in localhost/upload.php on line 32\n\
    \n**解决方案：** 此警告是一个权限错误的示例。脚本试图将文件上传到一个目录，但该目录没有足够的权限让文件移动进去。\n\n"
