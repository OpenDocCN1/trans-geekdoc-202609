    ## Table Example in Bootstrap


    Some table classes used to create a table in Bootstrap are `.table`, `.table-responsive`,
    `.table-bordered`, `.table-striped`, `.table-hover`, etc.


    ### .table-responsive


    Used to create a responsive table. The table will then scroll horizontally on
    small devices.


    ### .table-striped


    Used to add zebra-stripes to a table.


    ### .table-bordered


    Used to add borders on the table.


    ### .table-hover


    Used to enable a hover state on table rows, i.e. a gray background color will
    automatically appear on mouse over.


    ### .table-condensed


    Used to make a table more compact by reducing padding in half.


