    <?php\n$name = \"Hirdesh Bhardwaj\";\nprint($name);\n?>\n```\n\n### String Concatenation\
    \ Operator\n\nTo concatenate two string variables together, we use the dot (.)\
    \ operator –\n\n```php\n<?php\n$txt1=\"Hello Readers\";\n$txt2=\"8756\";\necho\
    \ $txt1 . \" \" . $txt2;\n?>\n```\n\n### Using the strlen() function\n\nThe strlen()\
    \ function is used to get the length of a string.\n\n```php\n<?php\n$txt=\"Webs\
    \ Jyoti\";\necho strlen($txt);\n?>\n```\n\nThis will produce the following result\
    \ – 10 (including space)\n\n### Using the strpos() function\n\nThe strpos() function\
    \ is used to search for a text or character within a string. If the value is found\
    \ then this will return the position of the first value. If no match is found,\
    \ it will return FALSE.\n\nLet's see if we can find the string \"PHP\" in our\
    \ string –\n\n```\n<?php\n\necho strpos(\"Hello PHP\",\"PHP\");\n\n?>\n```\n\n\
