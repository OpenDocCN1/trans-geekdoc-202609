  mdcn: "\n## PHP 中的 foreach 循环\n\nPHP 中的 foreach 循环广泛用于数组以在列表中显示元素。foreach 循环遍历数组的所有元素。\n\
    \n### 语法\n\n```\nforeach ($array_object as $value)\n{\n    Set of lines here;\n\
    }\n```\n\n### foreach 循环示例\n\n```\n<html>\n<body>\n<?php\n$tools=array(\"WP\"\
    ,\"OpenCart\",\"Xampp\",\"Laravel\", \"Zend\");\nforeach ($tools as $x)\n{\n \
    \   echo $x . \" \";\n}\necho \"Total elements: \".count($tools);\n?>\n</body>\n\
    </html>\n```\n\n### 输出：\n\nWP OpenCart Xampp Laravel Zend\nTotal elements: 5\n\
    \nHirdesh Bhardwaj\n\n## PHP 中的 Switch Case 语句\n\nswitch 语句类似于针对同一表达式的一系列 if 语句。\n\
    \nSwitch Case 检查变量的不同情况或值。如果其中任何一个 case 为真，则执行相应的 case，程序会忽略所有其他 cases。\n\n例如当你拨打客服电话时，最开始你会听到一些录音提示，如“for\
    \ billing support press 1, for technical support press 2, to go back to main menu\
    \ press 9 and so on...” how this concept work?\n\n这只是 Switch case 的一个例子，其中每个键都绑定了一些特定的操作。\n\
    \n### Switch Case 示例 1\n\n```php\n<?php\n\n$i=0;\n\nswitch ($i)\n\n{\n\ncase 0:\n\
    \necho \"$i equals 0.\".\"<br/>\";\n\nbreak;\n\ncase 1:\n\necho \"$i equals 1.\"\
    .\"<br/>\";\n\nbreak;\n\ncase 2:\necho \"$i equals 2\".\"<br/>\";\nbreak;\n}\n\
    ?>\n```\n\n### Switch Case 示例 2\n\n```\n<html>\n<head>\n<title>Switch Case Example\
    \ in PHP</title>\n</head>\n<body>\n<?php\n$f=10;\n$s=5;\n$choice='-'; // you can\
    \ change value of $choice + / - / *\nswitch ($choice)\n{\ncase \"+\":\n$sum=$f+$s;\n\
    echo \"Sum=\".$sum;\nbreak;\n```\n\n## 注释\n\n## PHP 中的数据发送方式\n\n有一些特定的方式可以将你的信息或数据发送到\
    \ PHP 页面-\n\n- 1. 使用表单方法 - Get & Post\n- 2. 使用 Cookies & Session\n- 3. 使用查询字符串\
    \ / URL 重写\n- 4. 使用隐藏表单字段\n\n### 表单方法\n\n**GET 方法**：GET 方法通过 ? 运算符分隔发送信息。\n\n\
    **示例：** http://www.xyz.com/home.html?city=Gurgaon\n\n请注意，GET 方法仅限发送最多 1024 个字符（1024\
    \ 字节）。如果你有密码或其他机密信息需要在服务器上传输，就不应该使用 GET 方法。\n\nGET 不能用于向服务器发送二进制数据，如图像或 Word 文档。\n\
    \nPHP 提供了 $_GET 关联数组或超全局变量来访问使用 GET 方法发送的数据。\n\n### 示例 – GET 方法：\n\n让我们创建一个包含表单元素-文本字段的\
    \ HTML 表单\n\n### HTML 页面：form.html\n\n```\n<form action =\"thanks.php\" method=\"\
    GET\">\nEnter Name : <input type=\"text\" name=\"txtName\">\n<input type=\"submit\"\
    \ value=\"Submit\">\n</form>\n```\n\n### 解释：\n\n这里我们有一个名为 txtName 的文本字段，基本上我们想要将此字段的值发送到名为\
    \ thanks.php 的 PHP 页面。请确保你的表单包含一个按钮类型 submit 以发送信息到 action 页面。\n\n让我们在与上述 html\
    \ 页面相同的目录中创建一个 thanks.php 页面\n\n### PHP 页面：thanks.php\n\n```\n<?php\necho $_GET['txtName'];\n\
    ?>\n```\n\n同时你可以在浏览器的地址栏中看到相同的输入值。这里我们打印了通过文本字段名 txtName 接收到的相同值。请确保在超全局变量 $_GET\
    \ 的 [ ] 中放入与 HTML 表单中提到的相同名称。\n\n### POST 方法\n\nPOST 方法通过 HTTP 头传输信息。\n\nPOST\
    \ 方法对发送的数据大小没有限制。因此它可以用于发送文件、图像以及二进制数据。\n\nPHP 提供了 $_POST 超全局变量或关联数组来访问使用 POST\
    \ 方法发送的数据。\n\n### 示例 – POST 方法：\n\n让我们创建一个包含多个表单元素的 HTML 表单\n\n### HTML 页面：form.html\n\
    \n```\n<form action =\"thanks.php\" method=\"POST\">\nEnter Email : <input type=\"\
    email\" name=\"email\">\nEnter Password : <input type=\"password\" name=\"pass\"\
    >\n<input type=\"submit\" value=\"Login\">\n</form>\n```\n\n这里我们有两个字段 email 字段名为\
    \ email，密码字段名为 pass，基本上我们想要将上述值发送到名为 thanks.php 的 PHP 页面\n\n让我们在与上述 html 页面相同的目录中创建一个\
    \ thanks.php 页面\n\n### PHP 页面：thanks.php\n\n```\n<?php\necho $_POST['email'];\n\
    echo $_POST['pass'];\n?>\n```\n\n这里我们分别打印了通过 email 和 password 字段接收到的相同值。\n\n我们可以使其更高级一些，通过将上述已发布的值赋给变量。使用变量的优点是我们可以在使用数据之前进行一些验证和清理，然后再将其传递到数据库。\n\
    \n因此上面的代码可以修改如下-\n\n```\n<?php\n// collect values in the variables separately\n\
    $email= $_POST['email'];\n$password= $_POST['pass'];\n// you may use some validations\
    \ like\nif($email==\"\" || $password==\"\")\necho \"Input required\";\nelse\n\
    echo \"Welcome \".$email . \" Your password is \".$password;\n?>\n```\n\n### $_REQUEST\
    \ 变量\n\nPHP $_REQUEST 变量包含 $_GET、$_POST 和 $_COOKIE 的内容。我们在讲解 cookies 时会讨论 $_COOKIE\
    \ 变量。\n\nPHP $_REQUEST 变量可用于获取使用 GET 和 POST 方法发送的表单数据的结果。\n\n### 示例\n\n```\n<?php\n\
    \nif( isset($_REQUEST[\"name\"]) )\n{\n    echo \"Welcome \". $_REQUEST['name'].\
    \ \"<br />\";\n    echo \"You are \". $_REQUEST['age']. \" years old.\";\n}\n\
    ?>\n```\n\n```\n<html>\n\n<body>\n\n<form action = \"\" method = \"POST\">\n\n\
    \    Name: <input type = \"text\" name = \"name\" />\n\n    Age: <input type =\
    \ \"text\" name = \"age\" />\n\n    <input type = \"submit\" />\n\n</form>\n\n\
    </body>\n```\n\n让我们创建一个 PHP 页面 [view.php](view.php) 应该接收两个变量值如下-\ncity =Gurgaon,\
    \ state=Haryana\n\n### view.php\n\n```php\n<?php\n\necho \"Location is \".$_REQUEST['city'].\"\
    \ \".$_REQUEST['state'];\n\n?>\n```\n\n你也可以检索 ? 之后的所有内容并将其分配给一个变量，我们可以简单地使用 $_SERVER\
    \ 超全局变量，如下所示：\n\n```php\n<?php\n\n$txt = $_SERVER['QUERY_STRING'];\n\nvar_dump($txt);\n\
    \n?>\n```\n\n请注意，如果没有查询字符串，则 $_SERVER 中的 QUERY_STRING 键将为空字符串\n\n## 注释\n\n## PHP\
    \ - 字符串函数\n\n字符串函数是 PHP 中最重要且经常使用的函数。字符串是字符的序列，如 \"Let’s learn String functions\"\
    。使用字符串函数无需安装。\n\n### 示例\n\n```php\n<?php\n$name = \"Hirdesh Bhardwaj\";\nprint($name);\n\
    ?>\n```\n\n### 字符串连接运算符\n\n要将两个字符串变量连接在一起，我们使用点 (.) 运算符 –\n\n```php\n<?php\n$txt1=\"\
    Hello Readers\";\n$txt2=\"8756\";\necho $txt1 . \" \" . $txt2;\n?>\n```\n\n###\
    \ 使用 strlen() 函数\n\nstrlen() 函数用于获取字符串的长度。\n\n```php\n<?php\n$txt=\"Webs Jyoti\"\
    ;\necho strlen($txt);\n?>\n```\n\n这将产生以下结果 – 10 (including space)\n\n### 使用 strpos()\
    \ 函数\n\nstrpos() 函数用于在字符串中搜索文本或字符。如果找到该值，则返回第一个值的位置。如果未找到匹配项，则返回 FALSE。\n\n让我们看看是否能在我们的字符串中找到字符串\
    \ \"PHP\" –\n\n```\n<?php\n\necho strpos(\"Hello PHP\",\"PHP\");\n\n?>\n```\n\n\
    这将产生以下结果 – 6\n\n### explode() 函数：\n\n用于将字符串转换为数组变量。它可用于在你想要的信息位于更大的字符串中的情况下，可以使用\
    \ explode() 函数将其提取出来。\n\n### 示例：\n\n```\n$db = explode(';','host=localhost;db=hirdesh;uid=root\
    \ ');\n\nprint_r($settings);\n```\n\n### 输出：\n\nArray ( [0] => host=localhost\
    \ [1] => db=hirdesh [2] => uid=root [3]\n\n### 另一个示例：\n\n```php\n<?php\n\n$text\
    \ = \"Lets Learn PHP Strings\";\n\necho (explode(' ',$text));\n\n?>\n```\n\n输出\n\
    \nArray\n(\n[0] => Lets\n[1] => Learn\n[2] => PHP\n[3] => Strings\n\n### substr()\
    \ 函数：\n\nsubstr() 用于返回字符串的一部分。它接受三个 (3) 个基本参数。第一个是要缩短的字符串，第二个参数是起始位置，第三个参数是要返回的字符数。\n\
    \n### 示例：\n\n```php\necho str_replace(' ','-','PHP Tutorial');\n```\n\n它会将空格替换为\
    \ -，最终输出将如下所示\n\nPHP-Tutorial\n"
