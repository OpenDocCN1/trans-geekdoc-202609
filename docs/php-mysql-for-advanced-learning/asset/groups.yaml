    \ 对象向 Web 服务器发出异步请求。\n- Web 服务器返回包含 XML 文档的结果。\n- XMLHttpRequest 对象调用 callback()\
    \ 函数并处理结果。\n- 更新 HTML DOM。\n\n![](img/9ab4a56a650535285811bb802190e58f_172_0.png)\n\
    \n## 示例代码\n\n```html\n<script>\n\nfunction showme(str)\n\n{\n```\n\nHirdesh Bhardwaj\n\
    \n```\n// to check if you don’t enter anything...\nif(str.length==0)\n{\n    document.getElementById(\"\
    result\").innerHTML='pls type something';\n    return;\n}\n// make xmlhttp object\
    \ for request\nif (window.XMLHttpRequest)\n{\n    // code for IE7+, Firefox, Chrome,\
    \ Opera, Safari\n    xmlhttp=new XMLHttpRequest();\n}\nelse\n{\n    // code for\
    \ IE6, IE5\n    xmlhttp=new ActiveXObject(\"Microsoft.XMLHTTP\");\n}\nxmlhttp.onreadystatechange=function()\n\
    {\n    document.getElementById(\"result\").innerHTML=xmlhttp.responseText;\n}\n\
    ```\n\n```\n// send your request to getlist.java page via GET method with\nargument\
    \ city\n\nxmlhttp.open(\"GET\",\"getlist.php?city=\"+str,true);\n\nxmlhttp.send();\n\
    \n}\n\n</script>\n```\n\n```html\n<form>\n\n<input type=\"text\" onkeyup=\"showme(this.value)\"\
    \ name=\"city\" />\n\n</form>\n```\n\n在这里，你将通过 getElementById 方法在 result 这个 id\
    \ 中获取结果。\n\n```html\n<span id=\"result\"></span>\n```\n\n## Getlist.php\n\n```php\n\
    <?php\n\n// Receive request on php page\n\n$city=$_REQUEST['city'];\n\necho \"\
    City is \".$city;\n\n// You may collect data from database on the base of requested\
    \ city\n\n?>\n```\n\n## 说明\n\n## 托管你的网站\n\n许多人喜欢在家中或办公室运行自己的服务器，如果你有时间，这是一个可行的托管解决方案。但自己托管网站可能会带来比其价值更多的问题。\n\
    \n你需要考虑备用电源、修补安全漏洞、定期维护、定期升级以及许多其他问题。请记住，你不仅需要让 Web 服务器保持运行，还需要有东西来管理你的域名。\n\n\
    ## 服务器（DNS 服务器）\n\n服务器就像你的计算机一样，存储文件并在被请求时提供服务。\n\n服务器每天 24 小时保持运行。确保你的网站安全且始终可供访问是它们的职责。例如，当你写博客或发布任何文章时，你将文件保存到虚拟主机服务商的服务器上，现在任何访问你博客的人都可以访问它。\n\
    \n## 域名：\n\n域名是网址中最重要的部分。域名是公司在互联网上的身份标识。每个域名都有其后跟点的扩展名。例如，www.irctc.gov.in 是\
    \ .gov.in 域名，表示它是一个政府网站。一些常见的扩展名有 .com / .co / .in / .net / .me\n\n## 虚拟主机\n\n\
    虚拟主机服务商（虚拟主机公司）帮助你的网站上线并可供公众访问。以下是虚拟主机服务商允许你执行的操作：\n\n- 为你提供空间来保存文件、图片和其他媒体资源\n\
    - 允许人们在请求时访问你存储的文件/图片/媒体资源。\n\n在选择主机时，以下是外包托管时需要考虑的几个标准：\n\n- 支持的语言：PHP、JAVA、CGI\
    \ 等。\n- 支持的数据库：MySQL、Postgresql、MSSQL 等。\n- 服务器控制：超级用户访问权限（Super User Access）\n\
    - 服务器访问：如 FTP、telnet、SSH 等。\n- 管理 GUI：电子邮件、数据库、用户设置等。\n- 带宽使用：网站、电子邮件、流媒体、数据库连接等。\n\
    \n## 虚拟主机的类型：\n\n几乎所有虚拟主机公司都为你提供以下三种流行的托管方案：\n\n- 共享主机（Shared hosting）。\n- 经销商主机（Reseller\
    \ hosting）。\n- VPS 和独立主机（Dedicated hosting）。\n\n**共享主机：** 在此方案下，你可以托管许多网站。有些共享主机方案还允许你托管不限数量的网站。在共享主机方案中，你只能获得一个\
    \ CPanel（控制面板）来管理所有网站。\n\n**经销商主机：** 经销商主机允许你将托管服务转售给其他客户。但你也可以用它来托管自己的网站。在经销商主机账户中，你可以为每个网站创建单独的账户。因此，当你购买经销商主机套餐时，你会获得一个\
    \ Cpanel（控制面板）和 WHM（网站托管管理器），用于创建和管理不同的网站账户。\n\nHirdesh Bhardwaj\n\n**VPS 和独立主机：**\
    \ VPS 主机更适合访问量非常高的网站和需要大量功能的网站。通常，如果你使用共享或经销商主机方案，虚拟主机服务商不会允许你消耗那么多资源。他们会停用你的网站，并要求你升级到\
    \ VPS 或独立主机方案。\n\n**存储空间和带宽：** 如上所述，虚拟主机公司为你提供存储文件的空间和带宽，使你的文件可供公众访问。因此，基本上，存储空间就是用来存储你的博客文章、图片、媒体文件（视频、播客等）、WordPress\
    \ 安装文件、主题、插件等的空间，它们都存储在服务器上。\n\n**带宽：** 每次访问者访问你的网站时，他/她都会使用服务器资源。这是因为服务器需要将所有文件/图片/媒体发送到他的计算机。\n\
    \n因此，以这种方式提供文件所消耗的资源被计算为带宽。\n\n你的访问者越多，所需的服务器资源就越多，因此你需要更多的带宽。\n\n带宽以字节为单位进行测量，其值通常以\
    \ GB（千兆字节）或 TB（太字节）表示。\n\n## 支持的语言\n\n首先，我们来说说支持的语言。显然，因为你购买了这本书，我们假设你正在考虑使用 PHP，但你可能还需要使用其他语言。有些时候，其他语言（如\
    \ JavaScript）可能比 PHP 更适合某项工作。例如，\n\n如果你想在网站上直播音频或视频，你可能会使用某种 Java 小程序（applet），因为\
    \ PHP 需要来自服务器的请求来处理信息。PHP 可以通过对服务器的不同调用来实现，但由于这更像是来自浏览器的客户端请求，因此客户端语言更适合此任务。\n\
    \n有时，你可能需要使用另一种编程语言来完成客户在其他主机或服务器上已经设置好的功能。如果是这样，至少可以有选择地使用例如 Perl 脚本，而不是花费时间和金钱用\
    \ PHP 重新开发应用程序。\n"
