    \ \"Pls check your mail to activate your account\";\n}\nelse\n{\n    echo \"pls\
    \ check mail function\";\n}\n?>\n```\n\n```php\n//Verify.php\n<?php\n\ninclude\
    \ 'db.php';\n\n$code=$_REQUEST['code'];\n\nmysql_query(\"update student set status='verified'\
    \ where `code`=$code\");\n\necho \"You have been verified \";\n?>\n```\n\n## Notes:\n\
    \n## Object Oriented Programming in PHP\n\nObject-oriented programming (OOP) is\
    \ an approach, you can break down your program into several pieces or modules,\
    \ further can be used to creating copies of such modules as per the requirement.\
    \ It also allows you to group all of the variables and functions of a particular\
    \ concept into a single class. So Object-oriented programming (OOPs) is more advanced\
    \ and efficient than the procedural style of programming.\n\n### Some advantages\
    \ of using OOP:\n\n- Reusability – Easy to use and manage code\n- Data Hiding\
    \ – Data Abstraction and Encapsulation\n- Modularity\n- Resilience to change\n\
    - Fast and efficient\n- Realistic Modeling\n\nBefore we go in details, let’s define\
    \ important terms related to Object Oriented Programming.\n\n- **Class** – Class\
    \ is a collection of member variables and the functions. In other words, a class\
    \ is a blueprint or a piece of code describing how to manage a task in the way\
    \ we want.\n- **Object** – You define a class once and then make many objects\
    \ that belong to it just like creating multiple houses from a blueprint. Objects\
    \ can have state behavior and identity. To create an object, we use the *new*\
    \ keyword.\n- **Member functions and Variables** – these are the functions and\
    \ variables defined inside a class and are used to access object data. Example\
    \ changing the color or material used, of my house is a method performed on my\
    \ house object.\n- **Inheritance** – Inheritance is defined as creating a new\
    \ class from the existing class. When a class is defined by inheriting existing\
    \ function of a parent class then it is called inheritance.\n- **Polymorphism**\
    \ – Using this you can create multiple functions with their same name. Or simply\
    \ saying function name will remain same but it takes different number of arguments\
    \ and can do different tasks.\n- **Overloading** – A type of polymorphism in which\
    \ some or all of operators have different implementations depending on the types\
    \ of their arguments. Similarly functions can also be overloaded with different\
    \ implementation.\n- **Data Abstraction** – any representation of data in which\
    \ the implementation details are hidden (abstracted).\n- **Encapsulation** – refers\
    \ to a concept where we encapsulate all the data and member functions together\
    \ to form an object.\n- **Constructor** – A Constructor is the same name of its\
    \ class, will automatically invoke once the object of class in created.\n- **Destructor**\
    \ – It refers to a special type of function which will be called automatically\
    \ whenever an object is deleted or goes out of scope.\n"
