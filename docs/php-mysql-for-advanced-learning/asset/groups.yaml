    \n## PHP Mysql 高级学习\n\n（第三版）\n\n作者\n\n### Hirdesh Bhardwaj\n\n## 关于作者\n\n![](img/9ab4a56a650535285811bb802190e58f_5_0.png)\n\
    \nHirdesh Bhardwaj 是 Webs Jyoti - 开发与培训组织的创始人兼首席执行官，以其最佳的培训和发展技能而闻名。\n\n他是 IT\
    \ 领域的创新者，并以新颖且传统的方法重新定义了教学技巧。在他 10 年的职业生涯中，他交付了 350 多个网站，并教授了 5000 多名学生。\n\nHirdesh\
    \ Bhardwaj 在高中还是新手时就对写作产生了兴趣。他写了一首印地语诗歌“21 世纪”，后来于 2009 年 6 月发表。\n\n作为企业培训师，Hirdesh\
    \ 迄今已举办了 50 多场企业和研讨会。\n\n除了书籍之外，Hirdesh 还有约 250 个脚本和教程，将在未来几年出版。\n\n## Webs Jyoti\
    \ 的服务\n\nWebs Jyoti 是总部位于古尔冈的专业网页开发和信息技术（IT）组织，为全球企业家提供网页设计和信息技术服务。\n\n我们为印度各地及其他地区的客户提供网站开发服务。我们专注于网站设计、教育软件、电子商务和\
    \ CMS。\n\n## 感谢\n\n我谨向所有一直以来不时给予支持的人们表示感谢：\n\n- 我的父母，我的上帝和女神，感谢他们的美好祝愿和祝福。\n-\
    \ 我深爱的妻子 Chanchal，感谢她提供的支持。\n- 我 2 岁的儿子 Vansh，他认为他的爸爸写了这么长的书，做了网站的工作，进行了培训和研讨会，但希望其中包含像卡通角和忍者故事这样的章节。\n\
    - 我的姐妹 Mona 和 Preeti（也像女儿一样），她们希望她的兄弟能花更多时间陪伴她们，而不是在这本书上工作。\n- 我年幼的弟弟 Jaiprakash，他总是抱怨他的哥哥总是责骂他努力工作并在清晨散步以减轻体重。\n\
    - 我在 Webs Jyoti 的小团队，像家人一样，他们认为老板仍然把他们当作学生并强迫他们每天学习新东西。\n- 我的创意团队，P. Serign Ndiaye、Jeff\
    \ Sidabutar 和 Hernan Apraez Pastrana，他们总是让我从我们的开发部门提供更多实时示例。\n\n## 目录\n\n- **1.\
    \ PHP 简介** (02-05)\n  - PHP 简介、开发工具和编程范围\n- **2. 使用变量和输出语句** (06-12)\n  - 使用变量、函数、超全局变量、echo\
    \ 和 print 语句\n- **3. PHP – 构建块** (14-27)\n  - PHP 条件语句、switch 语句和循环语句\n- **4.\
    \ PHP 中的数据发送方式** (29-35)\n  - PHP 数据发送方式、表单方法、Cookie 和查询字符串\n- **5. PHP 中的字符串函数**\
    \ (37-42)\n  - PHP 中的常用字符串函数\n- **6. PHP 中的日期函数** (44-46)\n  - PHP 中的日期时间及实用函数\n\
    - **7. PHP 中的数组** (48-51)\n  - 数组简介、索引数组和多维数组\n- **8. PHP 中的清理函数** (53-57)\n \
    \ - PHP 中的清理函数（PHP 5.6）\n- **9. MYSQL / Mariadb 简介** (59-70)\n  - Mariadb 简介 –\
    \ 工具和基本查询\n- **10. 向 Mariadb 发送数据** (72-76)\n  - 学习如何使用 PHP 将表单数据发送到 mariadb\n\
    - **11. 从 Mariadb 检索数据** (78-83)\n  - 学习如何在 PHP 中从 Mariadb 获取记录\n- **12. PHP 中的错误处理**\
    \ (85-92)\n  - 错误类型、调试过程、include require 函数的使用。\n- **13. 处理图像** (94-101)\n  -\
    \ 学习如何在 PHP 中处理上传的图像\n- **14. PHP 中的 Cookie / Session**\n  - PHP 中的 Cookie 和 Session\
    \ 是什么\n- **15. PHP 中发送邮件**\n  - 学习如何使用 mail 函数发送自动邮件\n- **16. 面向对象编程**\n  - 面向对象编程\
    \ – PHP 中的 OOPs\n- **17. Mysql 连接和索引**\n  - 学习 MYSQL 中不同类型的连接和索引\n- **18. MYSQL\
    \ 触发器和存储过程**\n  - MYSQL 触发器和存储过程 – 高级 MYSQL\n- **19. MYSQL 事务**\n  - 了解更多关于 ACID\
    \ 和事务的信息\n- **20. PHP AJAX**\n  - PHP AJAX，如何在实时项目中使用 PHP Ajax\n- **21. 托管您的网站**\n\
    \  - 了解更多关于网站域名、托管和其他工具的信息\n- **22. PHP 分页**\n  - 学习如何在 PHP 中添加分页以限制记录\n- **23.\
    \ Bootstrap 框架**\n  - 学习如何使用 Twitter Bootstrap 设计适合设备的网站\n\n## 引言\n\n完成这本书是我有史以来最困难的事情之一。让我花了将近三年时间才把它整理成你正在阅读的形式。每次我阅读之前的草稿，我几乎总是不得不重写整个脚本。在大多数地方，我试图展示事物在实时场景中的工作原理。\n\
    \n如果你让我说出这本书最重要的特点，我会说简单。无论是文本还是代码，我都尽力让它尽可能简单。\n\n本书的大部分示例都取自我培训课程或我们内部开发工作。\n\
    \n更重要的是，我试图为一名正在努力学习新而复杂的编程的程序员设计这本书。我已将最好的努力倾注于这些页面。我相信你会觉得这本书有用。\n\n## 谁应该阅读这本书？\n\
    \n本书假设你已经了解网页设计或使用 HTML、CSS 的 UI 设计。如果你完全是 PHP 新手，我建议你阅读我于 2016 年 8 月出版的《网页设计-第\
    \ 1 版》入门书籍。\n\n## Hirdesh Bhardwaj 著作的其他书籍\n\n![](img/9ab4a56a650535285811bb802190e58f_9_0.png)\n\
    \n![](img/9ab4a56a650535285811bb802190e58f_9_1.png)\n\n## PHP - 简介\n\nPHP 是目前最流行的服务器端脚本语言之一。如果你有一个用于运行博客或网站的主机账户，我可以保证\
    \ PHP 已安装在同一服务器上。\n\nPHP 代码可以嵌入到 HTML 中，也可与各种网页主题系统、网页内容管理系统（CMS）和框架如 CakePHP、Zend、Laravel\
    \ 和 Symfony 结合使用。PHP 代码通常由 Zend Engine 驱动的 PHP 解释器处理。\n\n## PHP 事实\n\n- PHP 最初代表\
    \ Personal Home Page，现在正式称为“Hypertext Preprocessor”，由 Rasmus Lerdorf 于 1995 年发布。\n\
    - PHP 是免费软件，开源软件，在 PHP 许可证下发布。\n- PHP 可用于所有主要操作系统，包括 Linux、Microsoft Windows 和\
    \ Mac OS X。\n- PHP 最初设计用于创建动态和更具交互性的网页。它是最广泛使用的开源通用脚本语言。\n- PHP 已安装在超过 2000 万个网站和\
    \ 100 万个 Web 服务器上。\n- 75% 的 Web 2.0 网站使用 PHP 构建。81.7% 的服务器端编程语言已知的网站使用 PHP。\n\
    - Facebook、Digg、Flickr、Technorati 和 Yahoo! 等一些最大的在线品牌均由 PHP 开发。\n"
