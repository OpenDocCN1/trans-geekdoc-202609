    ## Bootstrap Navbar Classes

    - the difference between nav and navbar classes is the fact that navbar can collapse
    the whole nav (the nav can''t do it on its own)


    ### navbar

    - basic class for a navigation wrapper (usually `<nav>`), sets border, bottom
    margin, min-height and position: relative

    - if it''s not supposed to be fixed, can be placed anywhere in `.container` or
