    \n$text = \"Lets Learn PHP Strings\";\n\necho (explode(' ',$text));\n\n?>\n```\n\
    \nOutput\n\nArray\n(\n[0] => Lets\n[1] => Learn\n[2] => PHP\n[3] => Strings\n\n\
    ### The substr() Function:\n\nThe substr() is used to return part of the string.\
