    $today = date("d/m/Y");

    echo "Today is ".$today;

    ?>

    ```

    ```


    We can use different time format with separator like d-m-Y , d.m.Y and so on.


    **The DateTime class in PHP** : The DateTime class in available in PHP 5 and higher
    versions.


    ```

    ```php

    <?php

    $d = new DateTime;


    echo $d->format(''Y-m-d H:i:s'');

    ?>

    ```

    ```


