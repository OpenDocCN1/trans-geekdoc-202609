    \ time format with separator like d-m-Y , d.m.Y and so on.\n\n**The DateTime class\
    \ in PHP** : The DateTime class is available in PHP 5 and higher versions.\n\n\
    ```php\n<?php\n$d = new DateTime;\n\necho $d->format('Y-m-d H:i:s');\n?>\n```\n\
