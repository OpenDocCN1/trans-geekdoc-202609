  md: "\n## Notes\n\n## Working with Images and Other Uploaded Files\n\nWorking with\
    \ uploaded documents is the major part of any server-side programming language.\
    \ Uploading of files such as PDF documents, images, video, and other documents\
    \ is handled through the `enctype=\"multipart/form-data\"` attribute in HTML.\
    \ We need to create an HTML form that allows you to choose the file to be uploaded.\n\
    \nNote: Please make sure your form method type is `post` and `enctype=\"multipart/form-data\"\
    ` to handle the file uploading process successfully.\n\n### HTML Code\n\n```html\n\
    <form enctype=\"multipart/form-data\" action=\"process.php\" method=\"POST\">\n\
    Choose File : <input name=\"myfile\" type=\"file\" />\n<input type=\"submit\"\
    \ value=\"Upload\" />\n</form>\n```\n\nNow create a PHP file `process.php` for\
    \ handling file information. Please note you cannot view your uploaded file directly\
    \ on this page. We will use the `$_FILES` superglobal to retrieve uploaded file\
    \ information.\n\nExample: `$_FILES['myfile']['name'];`\n\n`$_FILES[][]` is an\
    \ associative 2-dimensional array and keeps all the information related to the\
    \ uploaded file. The first `[]` contains the name of the file field (`myfile`)\
    \ and the second `[]` contains predefined attributes (`name`).\n\nThere are some\
    \ other predefined attributes given below:\n\n- `$_FILES['file']['tmp_name']`\
    \ – the uploaded file in the temporary directory on the web server.\n- `$_FILES['file']['name']`\
    \ – the actual name of the uploaded file.\n- `$_FILES['file']['size']` – the size\
    \ in bytes of the uploaded file.\n- `$_FILES['file']['type']` – the MIME type\
    \ of the uploaded file.\n- `$_FILES['file']['error']` – the error code associated\
    \ with the file.\n\nSo let's have an example:\n\n```php\n<?php\n// get the uploaded\
    \ file name\n$filename = $_FILES['myfile']['name'];\n\n// get the file type\n\
    $filetype = $_FILES['myfile']['type'];\n\n// get the file size (in bytes)\n$filesize\
    \ = $_FILES['myfile']['size'];\necho \"<h2>Uploaded file information</h2>\";\n\
    echo \"File Name : \".$filename;\necho \"<br> File Size : \".$filesize;\necho\
    \ \"<br>File Type : \".$filetype;\n?>\n```\n\nOnce your file is uploaded successfully\
    \ you may add some validations to make it more useful as per your requirement:\n\
    \n```php\n<?php\n// get the uploaded file name\n$filename = $_FILES['myfile']['name'];\n\
    // get the file type\n$filetype = $_FILES['myfile']['type'];\n// get the file\
    \ size (in bytes)\n$filesize = $_FILES['myfile']['size'];\n// You may put your\
    \ validations here i.e restrict file size\nif($filesize >= 1000000)\n{\n    echo\
    \ \"File is too Large, Maximum file size should be 1 MB\";\n    exit;\n}\n// Validation\
    \ to check if uploaded file is an Image\nif($filetype != \"image/jpeg\" && $filetype\
    \ != \"image/png\" &&\n   $filetype != \"image/JPEG\")\n{\n    echo \"Only Images\
    \ allowed, Kindly upload valid Image.\";\n    exit;\n}\nelse\n{\n    // create\
    \ a folder – upload (in the same location where you have this PHP file) to move\
    \ uploaded image from your local computer to server\n    $target = \"upload/\"\
    ;\n    $target = $target . basename( $_FILES['myfile']['name'] );\n    move_uploaded_file($_FILES['myfile']['tmp_name'],\
    \ $target);\n    echo \"Image Uploaded Successfully\";\n}\n?>\n```\n\nYou will\
    \ be saving your uploaded images to a folder on the web server, which means you\
    \ need a directory that is writable by the web server. To make the folder writable\
    \ by the web server, you can use your FTP client for the same.\n\nTo write the\
    \ uploaded image to the target folder, you use the function `move_uploaded_file`.\
    \ This PHP function will retrieve the image and move it to the designated location.\n\
    \n**Error Messages:** PHP returns an error code while uploading a file through\
    \ HTML Form. We can get the error code during the file upload by PHP. There are\
    \ some error messages explained below:\n\n- `UPLOAD_ERR_OK` – There is no error,\
    \ the file uploaded successfully.\n- `UPLOAD_ERR_INI_SIZE` – The uploaded file\
    \ exceeds the `upload_max_filesize` mentioned in `php.ini` file.\n- `UPLOAD_ERR_FORM_SIZE`\
    \ – The uploaded file exceeds the `MAX_FILE_SIZE` directive that was specified\
    \ in the HTML form.\n- `UPLOAD_ERR_PARTIAL` – The uploaded file was only partially\
    \ uploaded or upload process was interrupted.\n- `UPLOAD_ERR_NO_FILE` – No file\
    \ was uploaded by the user. When a user tries to upload a file, but PHP doesn't\
    \ receive anything.\n- `UPLOAD_ERR_NO_TMP_DIR` – Missing a temporary folder.\n\
    - `UPLOAD_ERR_CANT_WRITE` – Failed to write file to disk.\n- `UPLOAD_ERR_EXTENSION`\
    \ – A PHP extension stopped the file uploading process.\n\n### Examples\n\n```php\n\
    // Check if file already exists\nif (file_exists($yourfile))\n{\n    echo \"Sorry,\
    \ file already exists.\";\n}\n\n// Check if there are any errors in the upload.\n\
    if($_FILES['file1']['error'] > 0)\n{\n    die(\"An error occurred\");\n}\n\n//\
    \ Verify uploaded file is an image - Alternate way\nif(!getimagesize($_FILES['file1']['tmp_name']))\n\
    {\n    die(\"Please ensure you are uploading a valid image.\");\n}\n```\n\n###\
    \ Make Uploaded Images, Your Profile Image\n\nOnce you upload an image to the\
    \ server, you may display it to any section of your webpage. You may do this by\
    \ firing an Ajax request after you have finished the image upload. Consider the\
    \ following example:\n\n```php\n<?php\n\n// put your query along with database\
    \ connectivity here\n$file = mysql_query(\"select * from Users\");\n\n// consider\
    \ that you have image path in a column called pro_img\n```\n\nA list of dangerous\
    \ extensions is compiled by the developer, and access is denied if the extension\
    \ of the file being uploaded is on the compiled list.\n\n- Client-side validation:\
    \ Another common type of security used in file upload forms is client-side validation\
    \ of files to be uploaded. Typically, such an approach is more common in ASP.NET\
    \ applications, since ASP.NET offers easy-to-use validation controls.\n\n## Notes\n\
    \n## Managing Sessions & Cookies\n\nBefore learning Sessions and Cookies you should\
    \ know about HTTP and its stateless process. Stateless means server doesn't know\
    \ about your previous requests as each request is treated as new by the browser.\
    \ So each time when you are browsing your personal account on the website, you\
    \ have to log in again? But we don't log in again and this is because of cookies\
    \ or sessions.\n\n*So, the basic task of both cookies and sessions is to store\
    \ visitor data so that it can be accessed by every page on a website.*\n\n###\
    \ Cookies:\n\nCookies are small text files that are stored in the visitor's browser\
    \ for a specific time or for a long lifespan. Cookies can be edited by the visitor.\
    \ In short, Cookies are client-side files that contain user information.\n\n###\
    \ Sessions:\n\nSessions are small files that are stored on the website's server.\
    \ Sessions have a limited lifespan, they expire when the browser is closed or\
    \ logged out from the session. Sessions cannot be edited by the visitor or user.\
    \ Session max lifetime is 1440 seconds (24 minutes) as defined in the `php.ini`\
    \ file; however, you may change it accordingly.\n\nIn short, cookies serve on\
    \ the visitor's computer and sessions serve on the server.\n\nBy giving each visitor\
    \ a cookie with a unique ID, I can use that cookie to recognize each visitor when\
    \ they return. I can then use sessions to handle the page-to-page data exchange\
    \ that actually provides each visitor with their customized settings and information,\
    \ which are provided by each visitor and stored in a database until they are referenced\
    \ by the unique ID stored in the cookie.\n\n### Cookie Example\n\nPHP allows you\
    \ to create, retrieve and update cookies. The `setcookie()` function is used to\
    \ first create a cookie.\n\nThe syntax is: `setcookie(name, value, expire, path,\
    \ domain);`\n\n```php\n<?php\nsetcookie(\"username\", \"Hirdesh Bhardwaj\", time()+20);\n\
    setcookie(\"pin\", \"4412\", time()+20);\n?>\n```\n\nHere we have set a cookie\
    \ name – `username` and set value `Hirdesh Bhardwaj` to it. The `username` cookie\
    \ will store this value for the next 20 seconds from the current time or from\
    \ the very first time you sent this cookie to the browser.\n\nNow, we are free\
    \ to retrieve the value that is stored in our cookie, using the `$_COOKIE` superglobal\
    \ PHP keyword. It is best to use the `isset()` function for this, because if a\
    \ cookie has not been set on the computer that we are trying to retrieve it from,\
    \ headaches can result.\n\n```php\n<?php\nif (isset($_COOKIE[\"username\"]))\n\
    {\n    echo \"Welcome \" . $_COOKIE[\"username\"];\n}\nelse\n{\n    echo \"Welcome\
    \ guest!<br> Cookies Expired.\";\n}\n?>\n```\n"
  mdcn: "\n\n## 备注\n\n## 处理图像和其他上传文件\n\n处理上传文档是任何服务端编程语言的主要部分。上传 PDF 文档、图像、视频和其他文件是通过\
    \ HTML 中的 `enctype=\"multipart/form-data\"` 属性来处理的。我们需要创建一个 HTML 表单，允许你选择要上传的文件。\n\
    \n注意：请确保你的表单 method 类型为 `post`，并且 `enctype=\"multipart/form-data\"`，这样才能成功处理文件上传过程。\n\
    \n### HTML 代码\n\n```html\n<form enctype=\"multipart/form-data\" action=\"process.php\"\
    \ method=\"POST\">\nChoose File : <input name=\"myfile\" type=\"file\" />\n<input\
    \ type=\"submit\" value=\"Upload\" />\n</form>\n```\n\n现在创建一个 PHP 文件 `process.php`\
    \ 来处理文件信息。请注意，你不能在此页面上直接查看上传的文件。我们将使用 `$_FILES` 超全局变量来获取上传文件的信息。\n\n示例：`$_FILES['myfile']['name'];`\n\
    \n`$_FILES[][]` 是一个关联二维数组，保存与上传文件相关的所有信息。第一个 `[]` 包含文件字段的名称（`myfile`），第二个 `[]`\
    \ 包含预定义属性（`name`）。\n\n下面还有一些其他预定义属性：\n\n- `$_FILES['file']['tmp_name']` – 上传文件在\
    \ Web 服务器临时目录中的位置。\n- `$_FILES['file']['name']` – 上传文件的实际名称。\n- `$_FILES['file']['size']`\
    \ – 上传文件的大小（以字节为单位）。\n- `$_FILES['file']['type']` – 上传文件的 MIME 类型。\n- `$_FILES['file']['error']`\
    \ – 与文件相关的错误代码。\n\n那么让我们来看一个例子：\n\n```php\n<?php\n// get the uploaded file name\n\
    $filename = $_FILES['myfile']['name'];\n\n// get the file type\n$filetype = $_FILES['myfile']['type'];\n\
    \n// get the file size (in bytes)\n$filesize = $_FILES['myfile']['size'];\necho\
    \ \"<h2>Uploaded file information</h2>\";\necho \"File Name : \".$filename;\n\
    echo \"<br> File Size : \".$filesize;\necho \"<br>File Type : \".$filetype;\n\
    ?>\n```\n\n文件成功上传后，你可以根据需要添加一些验证，使其更有用：\n\n```php\n<?php\n// get the uploaded\
    \ file name\n$filename = $_FILES['myfile']['name'];\n// get the file type\n$filetype\
    \ = $_FILES['myfile']['type'];\n// get the file size (in bytes)\n$filesize = $_FILES['myfile']['size'];\n\
    // You may put your validations here i.e restrict file size\nif($filesize >= 1000000)\n\
    {\n    echo \"File is too Large, Maximum file size should be 1 MB\";\n    exit;\n\
    }\n// Validation to check if uploaded file is an Image\nif($filetype != \"image/jpeg\"\
    \ && $filetype != \"image/png\" &&\n   $filetype != \"image/JPEG\")\n{\n    echo\
    \ \"Only Images allowed, Kindly upload valid Image.\";\n    exit;\n}\nelse\n{\n\
    \    // create a folder – upload (in the same location where you have this PHP\
    \ file) to move uploaded image from your local computer to server\n    $target\
    \ = \"upload/\";\n    $target = $target . basename( $_FILES['myfile']['name']\
    \ );\n    move_uploaded_file($_FILES['myfile']['tmp_name'], $target);\n    echo\
    \ \"Image Uploaded Successfully\";\n}\n?>\n```\n\n你需要将上传的图像保存到 Web 服务器上的文件夹中，这意味着你需要一个\
    \ Web 服务器可写的目录。要使文件夹对 Web 服务器可写，你可以使用 FTP 客户端来完成。\n\n要将上传的图像写入目标文件夹，可以使用 `move_uploaded_file`\
    \ 函数。这个 PHP 函数会获取图像并将其移动到指定位置。\n\n**错误消息：** PHP 通过 HTML 表单上传文件时会返回一个错误代码。我们可以通过\
    \ PHP 获取文件上传过程中的错误代码。下面解释一些错误消息：\n\n- `UPLOAD_ERR_OK` – 没有错误，文件上传成功。\n- `UPLOAD_ERR_INI_SIZE`\
    \ – 上传的文件超过了 `php.ini` 文件中 `upload_max_filesize` 指定的值。\n- `UPLOAD_ERR_FORM_SIZE`\
    \ – 上传的文件超过了 HTML 表单中指定的 `MAX_FILE_SIZE` 指令。\n- `UPLOAD_ERR_PARTIAL` – 文件仅被部分上传，或者上传过程被中断。\n\
    - `UPLOAD_ERR_NO_FILE` – 用户没有上传任何文件。当用户尝试上传文件但 PHP 没有收到任何内容时会发生。\n- `UPLOAD_ERR_NO_TMP_DIR`\
    \ – 缺少临时文件夹。\n- `UPLOAD_ERR_CANT_WRITE` – 无法将文件写入磁盘。\n- `UPLOAD_ERR_EXTENSION`\
    \ – 某个 PHP 扩展停止了文件上传过程。\n\n### 示例\n\n```php\n// Check if file already exists\n\
    if (file_exists($yourfile))\n{\n    echo \"Sorry, file already exists.\";\n}\n\
    \n// Check if there are any errors in the upload.\nif($_FILES['file1']['error']\
    \ > 0)\n{\n    die(\"An error occurred\");\n}\n\n// Verify uploaded file is an\
    \ image - Alternate way\nif(!getimagesize($_FILES['file1']['tmp_name']))\n{\n\
    \    die(\"Please ensure you are uploading a valid image.\");\n}\n```\n\n### 将上传的图像设为个人资料图片\n\
    \n将图像上传到服务器后，你可以将其显示在网页的任何部分。你可以在完成图像上传后发出 Ajax 请求来实现这一点。请参考下面的示例：\n\n```php\n\
    <?php\n\n// put your query along with database connectivity here\n$file = mysql_query(\"\
    select * from Users\");\n\n// consider that you have image path in a column called\
    \ pro_img\n```\n\n开发者会编制一份危险扩展名列表，如果上传文件的扩展名在该列表中，则拒绝访问。\n\n- 客户端验证：文件上传表单中另一种常见的验证方式是对要上传的文件进行客户端验证。通常，这种方法在\
    \ ASP.NET 应用程序中更常见，因为 ASP.NET 提供了易于使用的验证控件。\n\n## 备注\n\n## 管理会话和 Cookie\n\n在学习会话和\
    \ Cookie 之前，你应该了解 HTTP 及其无状态过程。无状态意味着服务器不知道你之前的请求，因为浏览器会将每个请求都视为新请求。那么，每次你在网站上浏览个人账户时，都必须重新登录吗？但我们并没有重新登录，这是因为\
    \ Cookie 或会话。\n\n*因此，Cookie 和会话的基本任务都是存储访问者数据，以便网站上的每个页面都可以访问这些数据。*\n\n### Cookie：\n\
    \nCookie 是存储在访问者浏览器中的小型文本文件，可以存储特定时间或较长时间。访问者可以编辑 Cookie。简而言之，Cookie 是包含用户信息的客户端文件。\n\
    \n### 会话：\n\n会话是存储在网站服务器上的小型文件。会话的有效期有限，当浏览器关闭或退出会话时，会话就会过期。访问者或用户无法编辑会话。根据 `php.ini`\
    \ 文件的定义，会话的最大生命周期为 1440 秒（24 分钟）；不过，你可以相应地更改它。\n\n简而言之，Cookie 服务于访问者的计算机，会话服务于服务器。\n\
    \n通过为每个访问者提供一个带有唯一 ID 的 Cookie，我可以在他们返回时使用该 Cookie 来识别每个访问者。然后，我可以使用会话来处理页面间的数据交换，从而真正为每个访问者提供其自定义的设置和信息；这些信息由每个访问者提供，并存储在数据库中，直到它们被\
    \ Cookie 中存储的唯一 ID 引用为止。\n\n### Cookie 示例\n\nPHP 允许你创建、检索和更新 Cookie。`setcookie()`\
    \ 函数首先用于创建 Cookie。\n\n语法为：`setcookie(name, value, expire, path, domain);`\n\n\
    ```php\n<?php\nsetcookie(\"username\", \"Hirdesh Bhardwaj\", time()+20);\nsetcookie(\"\
    pin\", \"4412\", time()+20);\n?>\n```\n\n这里我们设置了一个名为 `username` 的 Cookie，并为其设置了值\
    \ `Hirdesh Bhardwaj`。`username` Cookie 将从当前时间（或你第一次将此 Cookie 发送到浏览器的时间）起，在接下来的\
    \ 20 秒内存储该值。\n\n现在，我们可以使用 PHP 超全局关键字 `$_COOKIE` 来检索 Cookie 中存储的值。最好使用 `isset()`\
    \ 函数来实现这一点，因为如果我们要从中检索 Cookie 的计算机上尚未设置该 Cookie，则可能会遇到麻烦。\n\n```php\n<?php\nif\
    \ (isset($_COOKIE[\"username\"]))\n{\n    echo \"Welcome \" . $_COOKIE[\"username\"\
    ];\n}\nelse\n{\n    echo \"Welcome guest!<br> Cookies Expired.\";\n}\n?>\n```\n\
    \n"
