    # Using Include() Function:


    Suppose that you want to print the same message on every page like your company
    details and address, or maybe today’s date. If you are placing the same coding
    on each page of your site that is not very efficient because-


    +   - You are typing the same information over and over again, which is not the
    good approach.

    +   - In the case of an update or a change, you have to make the change in every
    single page of your site which is very time consuming process.


    A solution to this problem is to use an include() method. You take commonly used
    information and put it in a separate file. For example, if you have a set of variables
    that need to be use in every page on your site, you could define them once, in
    a single PHP file. Then, on each of your pages, you can include() it by referencing
    that file.


    # Difference between Include and require:


    The main difference between include and require statements in PHP is that if any
    error occurred include will raise an error message and then will continue the
    rest of the code placed in the page where as require will raise a fetal error
    and terminates execution.'
