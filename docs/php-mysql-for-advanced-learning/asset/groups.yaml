    ### .pagination-lg

    ### .pagination-sm

    - used on <ul> together with .pagination, makes pagination either bigger or smaller
    than default


    ### .pager

    - used on <ul>, styles "Previous" and "Next" links to look better with a grey
    border

    - its list items can have .previous, .next and also disabled classes for even
