    - variation of navbar-default but with dark colours

    - never use navbar-default and navbar-inverse on one element as it doesn''t make
    any sense


    ### .navbar-brand

    - sets styles for special hyperlinks and other "simple text" in a menu (float:
    left, bigger font size, some padding, text-shadow...)


    ### .navbar-fixed-top

    ### .navbar-fixed-bottom

    - additional class to .navbar that makes the navigation fixed at the top (or bottom)
