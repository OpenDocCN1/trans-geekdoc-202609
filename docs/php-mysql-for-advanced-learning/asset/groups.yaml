    # Bootstrap 4: What’s new in Bootstrap 4


    **New Classes in Bootstrap 4:** Bootstrap made some notable changes while migrating
    from bootstrap 3 to bootstrap 4. Some of the major changes are listed below:


    # Forms:


    +   - Rewrote both custom and default checkboxes and radios. Now.

    +   - dropped .input-group-addon and .input-group-btn for two new classes, .input-group-prepend
    and .input-group-append


    # Grid System:


    +   - xs grid classes have been modified to not require, So instead of .col-xs-6,
    it’s now .col-6.


    # Images


    +   - Renamed .img-responsive to .img-fluid.

    +   - Renamed .img-rounded to .rounded

    +   - Renamed .img-circle to .rounded-circle


    # Tables


    +   - Responsive tables not require.just put the .table-responsive right on the
    <table>.

    +   - Added a new .table-inverse option.

    +   - Renamed contextual classes to have a .table--prefix. Hence .active, .success,
    .warning, .danger and .info to .table-active, .table-success, .table-warning,
    .table-danger and .table-info.


    # Forms


    +   - Renamed .control-label to .col-form-label.

    +   - Renamed .input-lg and .input-sm to .form-control-lg and .form-control-sm,
    respectively.'
  - '[PAGE 212]


    +   -Dropped .radio-inline and .checkbox-inline.

    +   -Replaced .has-error, .has-warning, and .has-success classes with HTML5 form
    validation via CSS‘s :invalid and :valid pseudo-classes.


    # Buttons


    +   -Renamed .btn-default to .btn-secondary.

    +   -Change buttons'' [disabled] to :disabled

    +   -Removed explicit spacing between button groups in button toolbars


    # Panels


    +   -.panel to .card, now built with flexbox.

    +   -.panel-default removed and no replacement.

    +   -.panel-group removed and no replacement.

    +   -.panel-heading to .card-header

    +   -.panel-title to .card-title.

    +   -.panel-body to .card-body

    +   -.panel-footer to .card-footer

    +   -.panel-primary, .panel-success, .panel-info, .panel-warning, and .panel-danger
    have been dropped for .bg-, .text-, and .border utilities generated from our $theme-colors
    Sass map.'
