  md: '# Sanitize and Validations Functions


    Data validation is the major part of working with forms. Not only can invalid
    submitted data lead to security problems, but it can also break your page and
    output. So before proceeding or inserting data into database you need to validate
    it to avoid any error.


    # filter_var function in PHP


    filter_var used for both, sanitize and validate data. Sanitizing will remove any
    illegal character from the data and Validating will determine if the data is as
    per expected or in proper form.


    # How to use filter_var


    Using filter_var is incredibly easy. It''s simply a PHP function that takes two
    inputs of data:


    The variable you want to check and The type of check to use


    # Example


    ```

    $title = "<h1>Lets learn PHP Functions <br></h1>";

    $ftitle = filter_var($title, FILTER_SANITIZE_STRING);

    echo "After SANITIZE data is ".$ftitle;

    ```


    Output : Lets learn PHP Functions'
