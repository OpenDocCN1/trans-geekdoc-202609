  md: '# Object Oriented Programing in PHP


    Object-oriented programming (OOP) is an approach, you can broke down your program
    into several pieces or modules , further can used to creating copies of such modules
    as per the requirement. It also allows you to group all of the variables and functions
    of a particular concept into a single class. So Object-oriented programming (OOPs)
    is more advanced and efficient than the procedural style of programming.


    # Some advantages of using OOP:


    +   - Reusability- Easy to use and manage code

    +   - Data Hiding – Data Abstraction and Encapsulation

    +   - Modularity

    +   - Resilience to change

    +   - Fast and efficient

    +   - Realistic Modeling


    Before we go in details, let’s define important terms related to Object Oriented
    Programming.


    +   - **Class** – Class is a collection of member variables and the functions.
    In other words, a class is a blueprint or a piece of code describing how to manage
    a task in the way we want

    +   - **Object** –You define a class once and then make many objects that belong
    to it just like creating multiple houses from a blueprint. Objects can have state
    behavior and identity. To create an object, we use the *new* keyword.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '+   - **Member functions and Variable s** – these are the functions and variables
    defined inside a class and are used to access object data. Example changing the
    color or material used, of my house is a method performed on my house object.

    +   - **Inheritance** – Inheritance is defined as creating a new c lass from the
    existing class. When a class is defined by inheriting existing function of a parent
    class then it is called inheritance.

    +   - **Polymorphism** – Using this you can create multiple functions with their
    same name. Or simply saying function name will remain same but it take s different
    number of arguments and can do different tasks.

    +   - **Overloading** – A type of polymorphism in which some or all of operators
    have different implementations depending on the types of their arguments. Similarly
    functions can also be overloaded with different implementation.

    +   - **Data Abstraction** – any representation of data in which the implementation
    details are hidden (abstracted).

    +   - **Encapsulation** – refers to a concept where we encapsulate all the data
    and member functions together to form an object.

    +   - **Constructor** – A Constructor is the same name of its class, will automatic
    invoke once the object of class in created.

    +   - **Destructor** – It refer to a special type of function which will be called
    automatically whenever an object is deleted or goes out of scope.'
