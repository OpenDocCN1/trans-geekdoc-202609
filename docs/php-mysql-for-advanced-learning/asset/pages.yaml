- pgno: 176
  md: '# Hosting Your Website


    Many people like to run their own servers out of their homes or offices, and that
    is a feasible solution for hosting, if you have the time. But hosting your own
    Web site can lead to more problems than it’s worth.


    You need to think about backup power, keeping the security holes patched regular
    maintenance, regular upgrades, and many other issues. And keep in mind that not
    only do you need to have a Web server running; you need to have something to take
    care of your domain name


    # Servers (DNS Servers)


    A server is a just like your computer that stores files and serves when requested.


    Server stays up and running 24 hours a day. It’s their job to make sure your site
    is secure and always available for viewing. For example when you write a blog
    or any post, you save the file to your web host''s server and now it can be accessed
    by anyone visiting your blog.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# **Domain name:**


    The domain name is the most important part of a web address. A domain is the identity
    of the company on the internet. Each domain has their extension followed by. Operator
    For example www.irctc.gov.in is the .gov.in domain means it is a government website.
    Some popular extensions are .com / .co. / .in / .net / .me


    # **Web Hosting**


    A web host (web hosting company) helps put you website online and accessible to
    the public. Here''s what a web host allows you to do:


    +   - Gives you space to save your files, images and other media

    +   - Allows people to access your stored files/images/media when requested.


    When making your hosting choice. Here are a few criteria to look at when outsourcing
    hosting:


    +   - Supported languages: PHP, JAVA, CGI, and so on.

    +   - Supported databases: MySQL, Postgresql, MSSQL, and so on.

    +   - Server control: Super User Access

    +   - Server access: Such as FTP, telnet, SSH, and so on..

    +   - Administration GUIs: E-mail, database, user setup, and so on.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '- Bandwidth usage: Web site, e-mail, streaming media, database connections,
    and so on.


    # **Types Of Web Hosting:**


    Almost all hosting companies offer these three popular hosting options for you-


    +   - Shared hosting.

    +   - Reseller hosting.

    +   - VPS and Dedicated hosting.


    **Shared Hosting:** Under this plan you will be able to host many websites. Some
    Shared Hosting plans allow you to host unlimited websites also. In the shared
    hosting plan You get only one CPanel (Control panel) to manage all the websites.


    **Reseller Hosting:** Reseller hosting allows you to resell your hosting to other
    customers. But you can also use it to host your own websites. In Reseller Hosting
    account you can create a separate account for each website. So When you buy a
    Reseller hosting package, you get a Cpanel (Control panel) and WHM (Web Hosting
    Manager) for creating managing different website accounts.'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'Hirdesh Bhardwaj


    **VPS and Dedicated hosting:** PS hosting are better suited for very high traffic
    sites and sites that require a lot of functionality.Typically, a web host will
    not allow you to consume so much resources if you are on a shared or reseller
    hosting plan. They would disable your site and ask you to move to a VPS or dedicated
    plan.


    **Storage Space and Bandwidth:** As mentioned above, a web hosting company gives
    you space to store your files bandwidth to make your files accessible to public.
    So basically, Storage Space is the space to store your blog posts, images, media
    files (videos, podcasts etc.), WordPress installation, themes, plugins etc. are
    all stored in the server.


    **Bandwidth:** Each time a visitor accesses your website, he/she uses server resources.
    This is because; the server needs to send all the files/images/media to his computer.


    So the resources used to serve files this way are calculated as bandwidth.'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'The more visitors you have, the more server resources will be required and
    hence you will need more bandwidth.


    Bandwidth is measured in Bytes and the values will generally be given in GB (Gigabytes)
    or TB (Terrabytes).


    # Supported Languages


    First of all, we will talk about the supported languages. Obviously, because you
    bought this book, we’re assuming you are looking into using PHP, but there are
    other languages you may need to use. There may be a time when another language,
    such as JavaScript, is better suited for a job than PHP. For example,


    if you want live streaming audio or video on your site, you are likely to use
    a Java applet of some sort because PHP needs a request from the server to process
    information. PHP can do it with different calls to the server, but because it
    is more of a client request from the browser, a client-side language works much
    better for this task.


    There may also be times when you need to use another programming language to accomplish
    something a client already has set up at a different host or server. If so, it
    is nice to at least have the option of using, say, a Perl script, rather than
    spending the time and money to redevelop the application in PHP.'
  merge: -1
  img_proc: true
