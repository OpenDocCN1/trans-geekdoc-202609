- pgno: 10
  md: '# PHP - Introduction


    PHP is one of the most popular server-side scripting languages in existence today.
    If you have a hosting account to run your blog or website, I can guarantee that
    PHP is already installed on the same server.


    PHP code may be embedded into HTML, or it can be used in combination with various
    web theme systems, web content management system (CMS) and frameworks like CakePHP,
    Zend, Laravel and Symfony. PHP code is usually processed by a PHP interpreter
    powered by the Zend Engine.


    # PHP Facts


    +   - PHP originally stood for Personal Home Page, which is now officially known
    as ‘Hypertext Preprocessor’ was released in the year 1995 by Rasmus Lerdorf.

    +   - PHP is free software, Open Source released under the PHP License.

    +   - PHP can be used in all major operating systems including Linux, Microsoft
    Windows and Mac OS X.

    +   - PHP was originally designed to create dynamic and more interactive web pages.
    It is the most widely-used, open-source and general-purpose scripting language.

    +   - PHP is installed on over 20 million websites and 1 million web servers.

    +   - 75% of Web 2.0 sites are built in PHP. PHP is used by 81.7% of all the websites
    whose server-side programming language we know.

    +   - Some of the biggest online brands, such as Facebook, Digg, Flickr, Technorati,
    and Yahoo! are developed by PHP.'
  merge: -1
  img_proc: true
