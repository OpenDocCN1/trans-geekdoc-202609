    # Aggregate Functions in MYSQL


    Aggregate functions perform a calculation on multiple rows and allow us to easily
    produce summarized data from our database or table.


    Some aggregate functions in Mysql, s uch as SUM, COUNT, MAX, MIN and AVG


    **SUM Function:** SUM function returns the sum of a numeric column. Let’s calculate
    the total amount of salary in our table.


    # Example:


    ```

    SELECT SUM(salary) as ''Total Salary'' from mytable;

    ```


    **COUNT Function:** COUNT function return s a count of rows or records in a column.
    Let’s count the total no. of employees working in IT department.


    # Example:


    ```

    SELECT COUNT(name) from mytable where dept=''IT'';

    ```


    **The DISTINCT Keyword:** The DISTINCT keyword that allows us to omit duplicates
    and return unique records from a column. The same can also achieve by grouping
    (Group By Clause) similar values together.


    # Example:


    ```

    SELECT DISTINCT (city) FROM mytable;

    ```'
