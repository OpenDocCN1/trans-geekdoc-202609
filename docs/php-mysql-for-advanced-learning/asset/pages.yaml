  md: "# # PHP -Building Blocks\n\n# ## If –else statements\n\nif…else statement –\
    \ executes set of codes if a condition is true and another code if the condition\
    \ is false\n\nWithin a statement, if a certain condition is true, then something\
    \ happens. Otherwise, something else happens. We can continue adding else statements\
    \ as many times as we need.\n\n> So in short, “*The IF Else statement checks if\
    \ the specified condition is being met or not.*”\n\n# ### Syntax\n\n```\nif (condition)\n\
    \    code to be executed if condition is true;\n\nelseif (condition)\n\n    code\
    \ to be executed if condition is true;\n\nelse\n\n    code to be executed if condition\
    \ is false;\n```\n\n**Conditional Operators:** Sometime also called comparison\
    \ operator used to compare and test logics and expression.\n\nFollowing are the\
    \ conditional operators:\n\n+   - = Equal to\n+   - > More than\n+   - < Less\
    \ Than\n+   - >= More than and equal\n+   - <= Less than and equal\n+   - != or\
    \ <> Not Equal to"
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Logical Operators:


    Logical operators are used to combine multiple statements and to test if the condition
    met to true / false.


    Following are the logical operators:


    +   - And or && - All conditions must be true

    +   - Or || - at least one should be true

    +   - Xor- One side or other must be true but not both

    +   - == comparison operator


    *Please note = is assignment operator while == is comparison operator in PHP.


    # Basic If else Example 1


    ```

    ```php

    <?php

    $avg = 50

    if ($avg>60)

    {

    echo "You have a good score";

    }

    else

    {

    echo "Score is less than average";

    }

    ?>

    ```

    ```'
