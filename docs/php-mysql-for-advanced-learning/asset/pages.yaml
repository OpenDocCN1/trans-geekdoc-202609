- pgno: 18
  md: 'Predefined or Superglobals variables are used to provide information from and
    about the web server, the web browser, and the user.


    There are several types of Super Global Variables:-


    $_GET - Is used to pass data through URL. Example:

    http://websjyoti.com?id=2


    $_POST - Is used to pass data to server by hiding from URL.


    $_REQUEST – Is the combination of $_GET, $_POST, and $_COOKIE.


    $_SESSION - is used to maintain session and data from Local machine to Server.


    $_COOKIE – Is used to save/get user data on same machine in browser cookies.


    $_SERVER – Is an associative array which is used to know server information i.e.
    IP address, Host name, query string, file name etc.


    $_FILES – Is used to handle uploaded files operations in PHP. i.e. file size,
    type, name etc.


    # Example - $_SERVER Superglobals


    ```

    ```php

    <?php


    echo "Current IP Address is : ".$_SERVER[''REMOTE_ADDR''];


    echo "You are Page at : " . $_SERVER[''PHP_SELF''];


    ?>

    ```

    ```


    Please note $_SERVER[''REMOTE_ADDR''] in PHP returns current IP address of your
    system. In case if you are running this code on your localhost then it should
    return 1'
  merge: -1
  img_proc: true
