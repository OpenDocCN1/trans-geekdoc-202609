  md: '![](img/9ab4a56a650535285811bb802190e58f_183_0.png)


    # ## Administration GUIs


    Certain hosts offer Administration GUIs (Graphical User Interfaces) or User Control
    Panels as a feature of their packages. A lot of people don’t really care for GUIs,
    but when you don’t have a choice, either because you don’t have sufficient access
    to the server or you don’t fully understand how to get things done through telnet,
    a point-and-click solution is a wonderful tool.


    The interface can be as simple as one that allows you to view information about
    the server, or it can be as complex as one that allows you to install applications
    and programming languages with the click of a button. Also, keep in mind that
    if you have a client that wants to be able to administer its e-mail users, many
    of the control panels have utilities that allow the client to do so themselves.
    With such a feature, rather than having to call you or'
