  md: '# # PHP - Date / Time Functions


    When working in any programming language, dealing with dates and time is a common
    task, we frequently used in PHP.


    PHP''s date () function gives you all the information that you need about the
    current date.


    ```

    ```php

    <?php

    $today = date("d/m/Y");

    echo "Today is ".$today;

    ?>

    ```

    ```


    We can use different time format with separator like d-m-Y , d.m.Y and so on.


    **The DateTime class in PHP** : The DateTime class in available in PHP 5 and higher
    versions.


    ```

    ```php

    <?php

    $d = new DateTime;


    echo $d->format(''Y-m-d H:i:s'');

    ?>

    ```

    ```


    The above example will display today''s date and time in yyyy-mm-dd h:m:s format.
    If you are getting warning saying not to rely on system time zone, then add following
    line to the code.


    ```

    ```php

    date_default_timezone_set(''Asia/Kolkata '');

    ```

    ```


    **Example:** To automatically refresh the copyright year on your website- &copy;
    - <?php echo date("Y");?> All rights reserved.'
