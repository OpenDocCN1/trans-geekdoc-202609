    using the XMLHttpRequest API, without having to reload the web page.


    # The XMLHttpRequest Object:


    In order to make a request to the server through Ajax, an object must be created
    that can be used for different forms of functionality. Microsoft Internet Explorer
    creates the object as an ActiveX control, whereas browsers such as Firefox and
    Safari use a basic JavaScript object.


    # Popular XMLHttpRequest Methods:


