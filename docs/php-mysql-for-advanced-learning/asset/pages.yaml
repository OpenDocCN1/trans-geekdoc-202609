  md: '# Types of Mysql/ Mariadb Tables


    Now that you understand some of the general features of tables, you should know
    that there are different types of tables.


    There are some main types of tables in the current version of Mysql:


    MyISAM- A default table and will usually be sufficient for the user`s needs. It
    supports all the field types and the parameters.


    ISAM- It is same as the MyISAM table, except that it can’t handle data larger
    than 4GB this means it isn’t portable across operating systems. This table type
    is no longer be available in PHP5.


    HEAP - These are mostly used for temporary tables they don’t support a common
    features of the MyISAM table, such as auto_increment and blob/text columns etc.


    This can be used when your are working with log data and don''t want to store
    it for a long time.


    InnoDB- is considered to be “transaction safe,” which means that you can recover
    data from crashes.


    # Some popular MySQL commands


    +   - CREATE: Creates new databases and tables

    +   - ALTER: Modifies existing tables

    +   - SELECT: Display the data you want

    +   - DELETE: Erases or Delete the data from your table

    +   - INSERT INTO...: Puts values into the table

    +   - UPDATE: Lets you modify data already in a table'
