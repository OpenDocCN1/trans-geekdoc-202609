  md: '# Using Group By clause


    The group by widely used with aggregate functions like sum, avg, max min count
    etc. it create unique group of each element present in the column.


    # Example


    ```

    select dept, sum(salary) from emp_table group by dept;

    ```


    *Above query will display the sum of salary from each department in a pivot view.*


    # Group By clause and Distinct keyword


    | Group By | Distinct |

    |---|---|

    | Group by clause widely used with aggregate functions like sum, avg, max min
    count etc. it create unique group of each element present in the column | Distinct
    keyword used in simple query to fetch with where clause to get unique records.
    Distinct cannot use for calculation or aggregation purpose. |


    # The Having Clause:


    The HAVING clause can be used to filter records after a GROUP BY clause is applied.
    So it can be used to summarize group records. So Only the groups(created after
    group by claus e) that meet the HAVING criteria will be returned as a result.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# How the having clause is different from where clause?


    HAVING applies to summarized group records, whereas WHERE applies to individual
    records. In short " where clause never work with aggregate function with group
    by ".


    The where clause filter record before the aggregate of data while the having perform
    after aggregation/calculations is performed.


    # The Having Clause syntax


    ```

    SELECT column-names FROM table -name WHERE condition

    GROUP BY column-names HAVING condition

    ```


    **Example:** List the number of employees in each department.


    Only include department with more than 15 employees.


    ```

    SELECT COUNT(name), dept FROM mytable GROUP BY dept

    HAVING COUNT(name) > 15

    ```


    # Example 2


    ```

    select min(salary) from emp group b y emp_name having min(salary)<15000;

    ```


    # Example 3


    ```

    select dept,count(*) from emp group by dept having count(*)>3;

    ```'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# Subqueries in MYSQL :


    A Sub query or Inner query sometime called as Nested query, is a query within
    another SQL query and embedded within the WHERE clause. In Simple words, a Subquery
    is an inner query which is placed within an outer query using different SQL clauses.


    We can use Subquery anywhere mostly with select command in MYSQL enclosed within
    parentheses. An ORDER BY command cannot be used in a subquery, although the main
    query can use an ORDER BY. The GROUP BY command can be used to perform the same
    thing..


    Example: Find list of names from a department who have more than 3 employees in
    the dept.


    ```

    select name from emp where dept in(select dept from emp group by dept having count(*)>3);

    ```


    Example 2: Display highest salary department wise and names who is taking maximum
    salary.


    ```

    select emp_name from emp where salary in(select dept, max(salary) from emp group
    by dept);

    ```


    ```

    SELECT employee_id,first_name,last_name,salary

    FROM employees WHERE salary >

    (SELECT AVG(SALARY) FROM employees);

    ```'
