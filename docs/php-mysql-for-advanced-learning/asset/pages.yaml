  md: '# PHP Timezones


    If the PHP DateTime is not matching with your current time then It might happen
    if you are using a server that is located in a different timezone.


    The **date_default_timezone_get()** is used to get the default timezone, used
    by all date/time functions in a script.


    _To get default or the current time zone in PHP use below code_


