    i.e. course and one functions i.e. students(). Here public is access specified
    which means variable course can access or used by another class. Please note before
    declaring a class variable or properties, we should add the visibility keyword
    (public / private / protected) to define where the variable is available


    # Naming a Class:


    The name you use for a class ("Teacher" in the above example)


    +   - Should not be a PHP reserved word (Keyword).

    +   - Should start with a letter or underscore.

    +   - Can have letters, numbers or underscores after the first letter.


    To access member variables or functions of any class you need to create object
    of that class first. Example below-


    ```

    $ob=new Teacher;

    ```'
