  md: '# Arrays in PHP


    An array is a data structure that stores similar type of values in a common variable.
    Arrays are also called homogeneous data type.


    For example if you want to store 50 numbers then instead of defining variables
    it is easy to define an array with size of 50.


    In PHP, the array() function is used to create an array


    Arrays can store numbers, strings and any object but their index will be represented
    by numbers. By default array index starts from zero.


    # Example


    ```

    $x=array("Laxmi","Hirdesh","Rahim","Ashu","Amit");

    ```


    ![](img/9ab4a56a650535285811bb802190e58f_56_0.png)


    From the above diagram, values showing in each boxes called index in array. Insertion
    of values in array always starts from first index i.e. 0.


    To count number of elements stored in array count() method is used in PHP Arrays


    ```

    echo count($x);

    ```


    After the array is declared and assigned, you can populate value from any specific
    index as follow


    ```

    echo $x[1];  // output – Hirdesh

    ```'
