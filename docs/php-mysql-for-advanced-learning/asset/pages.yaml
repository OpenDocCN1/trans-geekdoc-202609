    # MySQL Loop in Stored Procedures


    MySQL provides loop statements that allow you to execute a block of SQL code repeatedly
    based on a condition. There are three loop statements in MySQL: WHILE, REPEAT
    and LOOP.


    # While Loop Example


    ```

    DELIMITER $$

    CREATE PROCEDURE myloop()

    BEGIN

    DECLARE x INT;

    DECLARE str VARCHAR(255);

    SET x = 1;

    SET str = "";

    WHILE x <= 10 DO

    SET str = CONCAT(str,x,'','');

    SET x = x + 1;

    END WHILE;

    SELECT str;

    END$$

    ```'
