- pgno: 182
  md: 'A CMS like WordPress uses the MYSQL database to store and retrieve data to
    dynamically generate webpages.


    A database is not required if you plan to run a static website without using any
    CMS or PHP language.


    # Server Control and Access


    Many hosts out there won’t give a Web developer full access and/or control over
    their hosted domain.


    We tend to shy away from those hosts because you are more likely to run into problems
    with them when you want to do some custom configuration to the server.


    Look into the type of access your host provides. Obviously, your host will give
    you FTP access so you can upload your files to the Web server. Some hosts, however,
    will give you FTP access but nothing else.


    The problem is that you are likely to run into a situation in which you want to
    configure your server. For


    This you will need either telnet or SSH access to use the command line.


    In fact, the ability to configure is often necessary when performing tasks that
    usually aren’t allowed by hosts by default. For example, consider htaccess. With
    htaccess, you can deny and allow access to certain files and directories based
    on the users you allow in the htpasswd file'
  merge: -1
  img_proc: true
