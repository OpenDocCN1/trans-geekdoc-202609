  md: '# Two types of trigger


    +   1. Before Trigger - Before Trigger fires before the execution of INSERT, DELETE
    and UPDATE commands.

    +   2. After Trigger - After trigger fires after the execution of INSERT, DELETE
    and UPDATE commands.


    We are going to create a table called customer having two columns to prepare a
    log whenever a new record is added or deleted in the same table


    - table logfile will insert the current time whenever new value add/delete


    --DELIMITER $$ for avoid ; on every end of line all statements treats as group
    and continue line until DELIMITER $$ closed


