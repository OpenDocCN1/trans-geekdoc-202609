  md: '# Bootstrap Navbar Classes


    +   - the difference between nav and navbar classes is the fact that navbar can
    collapse the whole nav (the nav can''t do it on its own)


    # navbar


    +   - basic class for a navigation wrapper (usually `<nav>`), sets border, bottom
    margin, min-height and position: relative

    +   - if it''s not supposed to be fixed, can be placed anywhere in `.container`
    or `.container-fluid`


    # navbar-default


    +   - sets other basic styles for a navigation wrapper (background gradient and
    box-shadow) and also its items (including `.active` class on `<li>`s)

    +   - for dark colours, see `.navbar-inverse` below


    # navbar-inverse


    +   - variation of navbar-default but with dark colours

    +   - never use navbar-default and navbar-inverse on one element as it doesn''t
    make any sense


    # .navbar-brand


    +   - sets styles for special hyperlinks and other "simple text" in a menu (float:
    left, bigger font size, some padding, text-shadow...)


    # .navbar-fixed-top


    # .navbar-fixed-bottom'
