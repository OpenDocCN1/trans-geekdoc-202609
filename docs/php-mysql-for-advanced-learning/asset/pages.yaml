    # PHP Syntax:


    PHP programs are written using a text editor, such as Notepad or Dreamweaver,
    just like HTML pages. We use .php extension to make php file. This extension tells
    to the server that it needs to parse the PHP code before sending the HTML Response
    to the Web browser as PHP code are invisible to the people while visiting on your
    site.


    # The Rules of PHP Syntax


    You should always keep in mind these rules while working with PHP:


    +   - PHP is denoted in the page with opening and closing tags, as follows: <?php
    and ?>

    +   - PHP lines end or terminates with a semicolon


    You can also make program easy by adding comments in your program using double
    slashes (//) or /* and */'
