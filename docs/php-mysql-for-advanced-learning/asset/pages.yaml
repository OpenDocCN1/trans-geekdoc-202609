  md: '# MVC (Model-View-Controller) in PHP:


    MVC is an application architecture, or design pattern, whose fundamental principle
    is based on the idea that the logic of an application should be separated from
    its presentation. So simply, MVC is a better way of separating the logic of your
    application from the display. The benefit of using MVC is making your application
    more maintainable.


    # The Model:


    The model is the most complex of all the parts of the system and will contain
    all the logic which is specific to the application. It is the part of the application
    which takes data (from any source) and processes it. So simply, the model is responsible
    to manage the data; it stores and retrieves entities used by an application, usually
    from a database, and contains the logic implemented by the application.


    # The View


    The view contains all the display logic. In PHP it will be the part of the application
    which generates the HTML. It has direct access to the Model and can query the
    model to get its data. So simply, the view is responsible to display the data
    provided by the model in a specific format. It has a similar usage with the template
    modules present in some popular web applications, like WordPress, Joomla etc.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# The Controller


    The controller takes user input and updates the model where required. Please note
    that the controller is not a mediator or gateway between the view and the model.
    The view gets its own data from its model. The controller accesses the model but
    does not contain any display logic itself. All the controller does is respond
    to user input.


    In other words, "The controller handles the model and view layers to work together.
    The controller receives a request from the client, invokes the model to perform
    the requested operations and sends the data to the View. The view formats the
    data to be presented to the user, in a web application as an html output."


    # MVC Program flow:


    +   - The model, view and controller are initialized

    +   - The view is displayed to the user, reading data from the model

    +   - The user interacts with the view (e.g. presses a button) which calls a specified
    controller action

    +   - The controller updates the model in some way

    +   - The view is refreshed (retrieving the updated data from the model)'
  merge: -1
  img_proc: true
