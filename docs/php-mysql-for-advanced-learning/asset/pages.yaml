    # Non-clustered vs clustered Index:


    Clustered index helps in arranging the rows physically in the memory . So the
    changes after index can be seen  in the  table and not in the heap.  On the other
    hand, Non clustered index will not arrange rows physical in the memory in sorted
    order.


    Please Note The MySQL InnoDB engine has mandatory clustered indexes. That means
    there is always a clustered index, often  using the primary key. If there is no
    suitable unique key available, MySQL will use a generated row ID for that purpose.
    The MyISAM storage engine doesn''t support clustered indexes and uses heap-tables
    all the time.


    Only one type of index ( Non-clustered) can be used in the MYSQL Engine.'
