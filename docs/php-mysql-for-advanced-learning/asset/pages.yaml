- pgno: 14
  md: '# ## Variables in PHP


    Variables are used to store data and can be called by using the variable name
    and the data that it holds will be outputted instead. So the variable is something
    to store information, you use frequently in your program.


    The name you decide for the variable should be meaningful. However there are some
    certain naming rules you need to follow while naming for the variable.


    # ### Naming Conventions


    +   - Variable name start with the dollar sign

    +   - Must contain only letters, numbers, and the underscore sign

    +   - Cannot start with a numeric value

    +   - Variable name are case sensitive


    To minimize confusion and errors, it''s best to stick to one naming scheme. The
    two most common styles are


    Use all lowercase, separating words with underscores: `$first_name`, `$emp_code`,
    etc.


    Use primarily lowercase, separating words with capital letters: `$textName`, `$fName`,
    etc.


    # ### Assigning Value to a variable


    Variables can be assigned using the assignment operator (=). Some examples of
    how to assign value to a variable are below-


    ```

    ```php

    $empCode = 231;

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# **PHP Data Types:**


    Data Types defines the type of data used by variable. PHP allows several types
    of data types.


    **Integer:** It holds whole numbers including positive and negative numbers Example
    $rating = 8;


    **Double:** Can hold numbers containing fractional or decimal part including positive
    and negative numbers. Example $amount=50.85;


    **String:** Hold letters or any alphabets and also numbers Example Name ="Alex";


    **Boolean:** Hold only two values, either TRUE or FALSE


    **Arrays:** Can hold multiple values of same data type Example $arr = array(5,8,12,15);


    **Objects:** Objects are defined as instances of user defined class es that can
    hold both values and functions.


    You can join together string, and whatever is in your variable. The full stop
    (period or dot, to some) is used for this.


    Suppose you want to print out the following "Variable contains the value - 10".
    In PHP, you can do it like this:


    ```

    ```php

    <?php


    $num = 10;


    $text = "Variable contains the value ";


    print($text . $num);


    ?>

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'So now we have two variables. The $text holds our direct text and $num contain
    a numeric value i.e. 10. When we''re printing the contents of both variables,
    a dot operator is used to separate or concatenate two or more variables.


    You can also do this sort of thing:


    ```

    ```php

    <?php


    $num = 10;


    echo (“Variable contains the value - “ . $num);


    ?>

    ```

    ```


    This time, the direct text (not inside a variable), but just included in the echo
    statement. Again a dot (.) is used to separate the direct text from the variable
    name.


    You can also remove information or reset a variable value by assigning null or
    blank as follow


    ```

    ```php

    $name = " ";

    ```

    ```


    Here, the variable $name exists but does not contain a value. It does not mean
    that $name is set to 0 because 0 is a value. It means that $name does not store
    any information.


    *You can go even further and un-create the variable or remove variable from the
    memory storage by using unset statement:*


    ```

    ```php

    unset($name);

    ```

    ```


    After unset statement is executed, the variable $name will no longer exists.'
  merge: -1
  img_proc: true
