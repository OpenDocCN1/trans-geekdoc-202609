  md: "# Scenario optimization with relaxation: a new tool for design and application\
    \ to machine learning problems\n\nMarco C. Campi and Simone Garatti\n\n**Abstract—Scenario\
    \ optimization is now a well established technique to perform designs in the presence\
    \ of uncertainty.** It relies on domain knowledge integrated with hypothesis-information\
    \ from data and constraints that are also accompanied by precise reliabilities.\
    \ In this paper, following work we introduce the new set of scenario optimization\
    \ by relaxation. By a solid thought, this paradigm furnishes powerful tools to\
    \ perform designs that may provide a better compromise between robustness and\
    \ performance. After effectively substituting the constraints of the scenario\
    \ optimization by various Classical Vector Methods in machine learning—including\
    \ SVM (Support Vector Machine), SVR (Support Vector Regression) and SVD (Support\
    \ Vector Data Description)—results demonstrate the utility of these methods to\
    \ generalize.\n\nis no loss of generality: would the cost depend on $\\delta$,\
    \ one might trace back to the present set by introducing a new, equivalent that\
    \ has an additional variable $h$ where the cost function is $f'(x, h)$ and the\
    \ constraints are $f'(x, h) \\le \\delta$ with $f'(x, h) = \\max\\{f(x, \\delta),\
    \ h\\}$.\n\nOne fundamental aspect in the practice of scenario optimization is\
    \ that it is not possible to have a model for the unknown parameter $\\delta$\
    \ without uncertainty. Indeed, we assume a random probability space $(\\mathcal{D},\
    \ \\mathcal{P})$ and $\\mathcal{P}$ remain undefined throughout the algorithmic\
    \ and theoretical developments of the method. This is particularly important in\
    \ many applications assuming that $\\delta$ and $\\mathcal{P}$ are known to be\
    \ the 'real world' and can be complex objects in order of machine learning (without\
    \ prior knowledge of biological or social systems, or of problems in autonomous\
    \ driving, but just by a few examples). Motivated by this, the scenario approach\
    \ takes as the primary source of knowledge, and more importantly, as it assumes\
    \ that samples of $\\delta$ acquired through experience is available to define\
    \ these instances (are $\\delta_1, \\dots, \\delta_n$ and “scenarios”).\n\n# I.\
    \ INTRODUCTION\n\nThe scenario approach is a relatively recent, and well established,\
    \ data-driven approach to make reliable designs in the presence of uncertainty.\
    \ This capability to cope with uncertainty is even more important in nowadays\
    \ engineering practice, and after its introduction in the seminal paper [5], the\
    \ scenario approach has obtained increased attention as witnessed by many theoretical\
    \ developments, [10], [11], [30], [35], [25], [37], [26], [16], and [17], and\
    \ has found application to various fields including control systems, data identification,\
    \ [14], [21], [24], [28], [31], and machine learning—[7], [9], [26], [38].\n\n\
    Let $x$ be the vector of design variables (or $\\delta$ the parameters of a controller,\
    \ or those of a regression model or a predictor), the scenario approach builds\
    \ upon the following ingredients that are integral of many design problems:\n\n\
    +   a. a cost $f(x)$, which we would like to make as small as possible;\nb. $N$\
    \ constraints for $x$, indexed by $\\delta$ and expressed as $f(x, \\delta) \\\
    le 0$.\n\nThe parameter $\\delta$ appears in $f$ represents uncertainty and models\
    \ imply knowledge about the environment to which our design will be based. Each\
    \ $\\delta$ corresponds to a potential situation, and each $f(x, \\delta) \\le\
    \ 0$ incorporates all constraints enforced in that situation. So not $f(x)$ depends\
    \ on $\\delta$ as examples.\n\nIn practice, cost and constraints often show conflicting\
    \ so that a high level of robustness against violations leads to poor performance.\
    \ A trade-off depends on the application and here it is important to allow for\
    \ flexibility in the optimization procedure to accommodate various situations.\
    \ The idea behind the introduction of a new scenario, named scenario optimization\
    \ with relaxation in Section 5.2 of paper [22], which amounted to consider the\
    \ flexibility of optimization:\n\n```\n$\\min_{x} f(x) + \rho \\sum_{i=1}^n \\\
    xi_i$\nsubject to: $f(x, \\delta_i) \\le \\xi_i, i=1, \\dots, n,$\n```\n\nThe\
    \ interpretation of (1) is that some scenario constraints $f(x, \\delta_i) \\\
    le 0$ can be violated by increasing the cost by the auxiliary variables $\\xi_i$.\
    \ If $\\xi_i > 0$ then $f(x, \\delta_i) \\le \\xi_i$ is relaxed, which $\\xi_i$\
    \ adds to the original cost $f(x)$. The parameter $\rho$ can be used to set a\
    \ suitable trade-off between the original cost and the cost of scenarios\n\nM.C.\
    \ Campi is with the Department of Information Engineering, University of Bari,\
    \ via Bianchi 28, 70123 Bari, Italy. S. Garatti is with the Department of Electronics,\
    \ Information and Communications Engineering, University of Milano, Politecnico\
    \ di Milano, via Da Vinci 32, 70123 Milan, Italy. Simone.garatti@unmi.it, marco.campi@uniba.it.\n\
    \nWhen considering scenarios based on inequalities $f(x, \\delta) \\le 0$, for\
    \ $i=1, \\dots, n$, we define $f(x) = \\max_{i=1, \\dots, n} f(x, \\delta_i)$."
