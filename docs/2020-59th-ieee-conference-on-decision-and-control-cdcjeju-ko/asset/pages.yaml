    \ is a data-driven technique used to identify a pattern of space that covers the\
    \ probabilistic mass from data been generated, while having little support vectors.\
    \ SVDD constructs a spherical shape, unlike to SVR, it can be make it more flexible\
    \ by fitting into a feature space. See [33] for a more complex description.\n\n\
    Let $\\{p_i\\}^N$ be the dataset in Hilbert space $\\mathcal{P}$ sampled from\
    \ a common probability distribution. The points can be drawn out, to complete\
