    We have the following theorem.


    # Theorem 3 (SVDD): with $\epsilon(\cdot)$ and $\tau(\cdot)$ as defined in Theorem
    1, we have

    $\mathbb{P}^N(\epsilon(s^*) \le \mathbb{P}(\|p - c^*\|^2 > \gamma^*) \ge \tau(s^*))
    \le 1 - \beta,$


    where $s^*$ is the number of $p_i$''s for which $\|p_i - c^*\|^2 \ge \gamma^*$.


    ## IV. NUMERICAL ANALYSIS


    ![](img/706f6f84297d70284d2a80a86db3f442_4_0.png)


    Inspired by the experimental model in [31], we applied SVR to find a regression
    model for points generated by a noisy function specifically. Specifically, we
    generated data $N=2000$ examples, $(m_i, y_i)$ drawn uniformly from $[-3, 3]$,
    and $y_i = \sin(m_i/\pi) + \epsilon_i$, being extracted from a Laplace distribution
    with $\mu=0$ and $b=1$. The trick kernel with Gaussian kernel $\exp(-\|x\|^2/2)$
    was also used to adapt the input to an infinite feature space. We found the optimal
    parameters, and then tested (5) with $\rho=(3/5)^k, \ell=1,\dots,14$. Each test
    was solved using Theorem 1 for the data. We constructed the cost-path, which found
    to be in figure 3. As $k$ increased, the risk increased monotonically. Then we
    had a rapid drop of cost with more increase of risk. Then, a decrease of cost
    significantly improved a demonstration of the risk. Altogether, however suggested
    to opt for models with $\rho$ in the range $(3/5)^5, \dots, (3/5)^{10}$, and the
    results were interpreted. To identify the data points the dots represent for $\rho=(3/5)^k$
    and $\epsilon^*=[0.032, 0.08]$, and $k^*=0.3$.


    Finally, we tested the validity of Theorem 1. We kept $\rho$ at the value $(3/5)^5$
    and solved 50 times, each drawing a new sample of size 200. Each solution was
    tested on 10000 random $(p)$ and the risk was evaluated by Monte Carlo methods.
    Figure 3 shows the pairs (complexity,risk) in the 200 trials, and the upper bound
    given by $\epsilon(k)$ and $\tau(k)$ is within the prescribed limits 9999 times
    out of 10000. As expected, the average risk is within the limits for all two cases
    in 200 points.


    ![](img/706f6f84297d70284d2a80a86db3f442_5_0.png)


    simulation. A visual inspection also reveals the spread of the evaluated risks
    fills the vertical range given by the theoretical result, a sign that the theoretical
    result provides enough information in spite of being discrete.


