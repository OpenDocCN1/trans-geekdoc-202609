    $[-3, 3]$ 中抽取，且 $y_i = \sin(m_i/\pi) + \epsilon_i$，其中 $\epsilon_i$ 提取自 $\mu=0$  $b=1$
    的拉普拉斯分布。还使用了带有高斯核 $\exp(-\|x\|^2/2)$ 的技巧核将输入适应到无限特征空间。我们找到了最优参数，然后用 $\rho=(3/5)^k,
    \ell=1,\dots,14$ 测试了 (5)。每次测试都使用定理 1 对数据求解。我们构建了代价路径，如图 3 所示。随着 $k$ 的增加，风险单调增加。随后，随着风险进一步增加，成本迅速下降。接着，成本的减少显著改善了风险的演示。然而，总体上建议选择
