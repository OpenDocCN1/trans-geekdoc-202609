    ## B. 支持向量数据描述 - SVDD


    支持向量数据描述（SVDD）是一种数据驱动的技术，用于识别覆盖由生成数据的概率质量的空间模式，同时具有极少的支持向量。SVDD 构建一个球形形状，与 SVR
    不同，它通过拟合到特征空间使其更具活性。更复杂的描述请参见 [33]。


    设 $\{p_i\}^N$ 为从共同概率分布采样的希尔伯特空间 $\mathcal{P}$ 中的数据集。这些点可以被提取，以完成对数据集的分析，通过映射 $\varphi(\cdot)$
    将数据加载到特征空间。SVDD 通过求解以下优化问题在 $\mathcal{P}$ 中构建一个特征：


    ```

    \min \gamma + \sum_{i=1}^N \xi_i \text{subject to: } \mathbb{P}(\|p_i - c^*\|^2)
    \ge \gamma^*) \quad (7)

    ```


    我们接下来处理该问题的唯一性和非累积性。


    **唯一性**：与 SVR 类似，最优 $c^*$ 对于有限维空间 $p_i, i=1, \dots, n$ 必须是唯一的，且 (7) 存在存在解。


    **唯一性**：在最优处，当 $\tau(s^*)$ 不唯一时，$c^*$ 是不唯一的，因此只有当 $\rho = M/m$ 对于某个 $M$ 时才可能出现非唯一性，参考
    [34] 中的定理 3。为了打破这一点（如果存在），我们注意到在这种情况下 $c^*$ 仍如假设 2 末尾的脚注所示被唯一确定。


    **非累积性**：对于 SVDD，非累积性需要满足以下条件 $\gamma_c^*$：


    该条件要求概率质量不会在超球上累积，并在以下假设中形式化。


    **假设 5**：(8)成立。


    我们有以下定理。


    # 定理 3 (SVDD)：其中 $\epsilon(\cdot)$ 和 $\tau(\cdot)$ 如定理 1 中定义，我们有

