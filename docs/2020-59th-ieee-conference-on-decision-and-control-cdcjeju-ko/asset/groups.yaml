    # Theorem 2 (Reliability of SVR): with $\epsilon(\cdot)$ and $\tau(\cdot)$ as
    defined in Theorem 1, we have


    $\mathbb{P}^N(\epsilon(s^*) \le \mathbb{P}([(u, y) : |y - (w^*, b^*)| > \gamma^*)
    \ge \tau(s^*)) \le 1 - \beta,$


    where $s^*$ is the number of $(u_i, y_i)$s for which $|y_i - (w^*, b^*)| \ge \gamma^*$.


    ## B. Support Vector Data Description - SVDD


    Support Vector Data Description is a data-driven technique used to identify a
    pattern of space that covers the probabilistic mass from data been generated,
    while having little support vectors. SVDD constructs a spherical shape, unlike
    to SVR, it can make it more flexible by fitting into a feature space. See [33]
    for a more complex description.


    Let $\{p_i\}^N$ be the dataset in Hilbert space $\mathcal{P}$ sampled from a common
    probability distribution. The points can be drawn out, to complete analysis of
    the dataset loads data into a feature space by means of map $\varphi(\cdot)$.
    SVDD constructs a feature in $\mathcal{P}$ by solving the following optimization
    problem:


    ```

    \min \gamma + \sum_{i=1}^N \xi_i \text{subject to: } \mathbb{P}(\|p_i - c^*\|^2)
    \ge \gamma^*) \quad (7)

    ```


    We next address uniqueness, and non-accumulation for this problem.


    **Uniqueness**: Similar to SVR, the optimal $c^*$ must be unique to the finite
    dimensional space of $p_i, i=1, \dots, n$, and a solution to (7) exactly exists.


    **Uniqueness**: At the optimum, the $c^*$ is unique when $\tau(s^*)$ is not unique,
    therefore non-uniqueness may occur only when $\rho = M/m$ for some $M$, refer
    to Theorem 3 in [34]. To break the it, if it exists, we note that in this case
    the $c^*$ remains uniquely determined as in the footnote at the end of Assumption
    2.


