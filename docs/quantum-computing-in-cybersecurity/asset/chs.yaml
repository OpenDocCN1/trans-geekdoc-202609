  \n#### 26.3.1.2 经典 SVM 的局限性 [15\n\n在处理大规模数据集时，SVM 的计算开销很大 [15]。因此，需要更高效的算法来提高处理速度\
  \ [15]。此外，经典 SVM 在处理高噪声数据时性能可能会下降 [15]。\n\n#### 26.3.2 量子 SVM 模型\n\nLS-SVM 算法在量子计算机上运行\
  \ [8, 9]。在量子随机访问内存中，核矩阵通过量子方法计算内积 [8]。它使用训练好的量子比特通过量子算法对查询数据进行分类 [8]，并求解线性方程。。这种策略仅适用于数据是相干的情况。由于并非如此，我们可以应用\
  \ [10] 中建议的方法，该方法建议使用利用量子态空间作为特征空间的分类器，并分析传统提供的数据，使用 Qiskit 框架的 QSVM 算法 [18]。图 26.3\
  \ 显示了 Q-SVM [14–16]（量子支持向量机）模型。\n\n\n\n\n\n我们有一组点 `x`，它们要么属于一组，要么属于另一组（例如将其标记为 `y=-1,1`），我们希望找到一条线（高维空间下的超平面）来划分这两组。这就是基本监督分类的工作原理。虽然这条线可以是线性的，但也可以变得非常复杂。在传统的\
  \ SVM 中，我们通过使用核函数来增加复杂度。\n\n因此，我们需要在量子计算机（Qcomp）上进行监督分类，以：\n\n* 首先，必须将经典数据点 `X`\
  \ 转换为量子数据点 `|Φ(x→)⟩` 才能继续。可以使用一个名为 `V(Φ(x→))` 的电路来实现。当应用于经典数据 `x→` 时，Φ 可能是任何经典函数\
  \ - Φ(…).\n* 其次，我们需要一个带有参数 `Θ` 的参数化量子电路 `W(Θ)`，它最终允许我们……\n* 第三，可以使用测量方法，根据每个经典输入\
  \ `x→` 的经典数据标签，给出一个 -1 或 1 的经典值。\n\n### 26.3.2.1 IDS 中的量子支持向量\n\n为止为止，已经有一些建议使用量子支持向量（Quantum\
  \ Support vector）进行入侵检测的方法。这里展示了其中一种方法。\n\n量子支持向量机（QSVMs）通过使用量子核估计器估计核函数来直接增强分类器。用于\
  \ NISQ 计算机的 QSVM 是非常有用的。整个量子增强 IDS 被描述并分解为以下阶段：\n\n1. 收集输入数据，或给定时间段的网络流量。\n2. 执行数据预处理，例如特征归一化。\n\
  3. 在此阶段进行数据降维，或将输入数据压缩为适合输入 `QSVM()` 函数的大小。如前所述，此阶段涉及使用自动编码器分析输入并确定其潜在空间。\n4. 归一化自动编码器提供的数据，为后续步骤做好准备。\n\
  5. 量子计算机进行量子处理，以寻找输入数据的变化。如所述，在此阶段，使用 `QSVM()` 函数算法将流量分类为正常或异常。\n6. 并行对下一个时间段或数据样本重复此过程。请记住，由于某种原因认为必要，周期可能会与前一个周期重叠。\n\
  \n检测过程之前必须有一个训练过程。训练涉及上述第 1 到 5 个阶段，但阶段 5 中的 QSVM 是以训练模式执行的。\n\n训练程序必须在检测过程之前。训练的第\
  \ 1 到 5 阶段是相同的，例外是第 5 阶段的 QSVM 在训练模式下运行。\n\n程序只接收测试数据的标签。目标是在测试集上预测一个估计映射，使其最可能符合测试数据\
  \ `S` 上的真实映射。数据使用 SVM 核投影到称为函数区域的高维空间，在其中建立一个超平面来区分命定的样本。Rebentrost *et al.* 已经提出了这种方法的\
  \ QSVM 量子版本。如果数据以相干叠加的形式提供，他们的技术实现了逐步推进。结果，由于过程是渐进的，它使得数据分析变得简单得多并提高了准确性。\n\n##\
  \ 26.4 结论\n\n从上述讨论可以看出，我们可以通过在量子计算机上运行分类算法来指数级加速二分类器的训练过程。由于这一事实，我们修改了基于 SVM 的入侵检测器使其在量子设备上运行，并使用数据集验证了其功能。近年来，量子技术变得受欢迎。正如我们在本研究中针对\
  \ SVM 这一特定方法所强调的样，量子方法在人工智能领域具有巨大的前景。然而，对于创建的方法和应用在解决共同计算问题方面存在相当差距。我们的分析代表了如何使用量子\
  \ SVM 学习方法以高精度进行入侵检测。与经典 SVM 相比，我们可以实现巨大的性能提升，并以极少的精力处理海量数据。\n\n## 参考文献\n\n1. Nawaz,\
