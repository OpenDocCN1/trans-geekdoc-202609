  \n## 19.1 引言\n\n这些设备属于广义的“量子技术（QTech）”类别，其中许多仍处于实验阶段 1。量子技术的三个主要领域通常是：量子传感、量子通信和量子计算\
  \ 2。虽然量子计算（Qcomm）距离实际商业化部署最遥远，但量子传感最接近现实，且颠覆性潜力最小。尽管自 Palmer (2017) 1 以来该领域取得了重大进展，但他对该年度所有三类量子技术在近期的潜在应用给出了非技术性的回顾\
  \ 3。\n\n尽管现代第四代战争的特征包括去中心化和政府丧失发动战争的专属权 [4, 5]，但富裕国家的军队通常可以使用最尖端的军事设备。这与量子技术的出现有关。\n\
  \n“QTech”一词主要源于第二次量子革命的科学技术进步。我们今天使用的技术，如核能，最初由第一次量子革命引入；还有目前的通信技术、半导体、激光、磁共振、数字相机和其他成像设备。核武器和核能是由第一波量子技术产生的，随后经典计算机也发挥了重要作用。目前，激光武器正在被整合和测试\
  \ 6。\n\n控制和操控单个量子系统（如原子、离子、电子、光子、粒子或各种准粒子）以达到标准量子边界（即量子尺度上测量精度的上限）的能力被称为第二次量子革命\
  \ 7。本研究将第二次量子革命的技术称为“QTech”。QTech 并不会从根本上改变武器或特定的军事系统，但它显著提升了当前和未来军事技术的测量、传感、精度、处理能力和效率。大多数量子技术通常有两个不同的应用。因此，QTech\
  \ 在军事应用具有巨大潜力。大量的研究和建议表明，此类技术具有更大的开发潜力；例如，参见 [8–11]。\n\n“量子战争”一词在本文中进行了详细解释，以及它对情报、安全和防御工业的潜在影响，以及任何前景的新能力或改进。其目的是阐明实施和应用中的潜在方向和趋势，而不是对\
  \ QTech 的未来做出精确预测。总来说，量子技术被视为尖端技术，具有改变战争方式和结果的潜力。尽管大多数量子技术的就绪水平（TRLs）较低，但当代量子技术被认为具有颠覆性潜力\
  \ 12。在讨论伦理原则或基于量子的预防性军控时，绘制量子技术的潜在军事用途对于进一步评估对世界和平的威胁至关重要。\n\n### QTech 术语定义\n\n\
  量子技术（QT）是物理和工程领域的一个发展领域，其基本概念是利用特定量子系统的量子纠缠、量子叠加和量子隧穿。根据定义，QTech 涉及许多量子力学系统的物理概念并有多种应用。QTech\
  \ 的用途之一是将捕获离子作为量子计算机的量子比特、磁场的量子传感器或量子钟。\n\n“两用技术”是指在商业生产和国防生产中均有潜在用途的研究领域 13。\n\n\
  QTech 作为一种典型的两用技术，引起了军事和维和小组的兴趣 14。\n\n量子技术应用于战斗被称为量子战争（QW）。它改变了情报、安全和防御能力，并引入了新的军事学、场景和伦理。我们并不是将\
  \ QTech 视为一种独立的类型，而是将其视为增强所有公认冲突领域的因素。“量子攻击”应首先定义。它指的是使用 QTech 破坏、干扰或监控传统或量子系统。最常见的实例包括使用量子计算机破解\
  \ RSA 加密算法，或使用量子密钥分发进行窃听。\n\n尽管关于量子技术的文献丰富，但该领域的分类尚未达成共识。我们将采用以下分类法：\n\n-   量子系统模拟、数字和模拟量子计算机及其应用（如量子系统模拟、量子优化……量子模拟（非编程量子电路）\n\
  -   量子网络与通信 [20, 21] - 量子通信与密码学（量子网络元件、量子密钥分发）量子就绪加密（抗量子算法、量子随机数生成器）\n-   量子测量与传感（量子磁力计、重力计……）原子钟（精密时间测量与分布）量子成像（量子雷达、低信噪成像……）。除了上述量子技术的广泛分类外，我们还根据用途和优势提供了一种新的划分。该分类适用于通用；但主要关注军事用途。以下类别描述了使用\
  \ QTech 的影响：\n\n-   基础性：使用量子技术（如后量子密码学）防御量子攻击；\n-   有效性：量子技术（如量子优化、量子机器学习或人工智能）增强现有工具和技术的性能；精密量子技术包括量子磁力、重力惯性导航和量子计时。这些技术提高了现有测量设备的准确性。由于\
  \ QTech，人们现在拥有以前无法想象的技能（例如量子雷达、化学模拟、量子密码分析、量子密钥分发）。\n\n### 本章结构\n\n剩余章节安排如下：19.2\
  \ 讨论相关研究；19.3 介绍量子技术概述；19.4 讨论量子技术在国防中的应用；19.5 介绍量子技术的军事应用；19.6 讨论量子战争的困难和影响；19.7\
  \ 总结本章。\n\n\n\n\n\n1. 通过提供更精确的导航、超安全通信或前沿的 ISTAR 和计算，量子技术具有增强当前军事能力的潜力。总而言，量子战争将需要新的军事学说、战斗场景和策略，以便为量子时代创建和获取新的技术和设备\
  \ [2。\n\n2. `Qcomm` 在不久的将来的影响有时被夸大了；在量子计算机用于加密之前，它们需要将规模扩大多达百万倍。虽然目前尚没有近期量子计算机有保障的用途，但用于科学研究的模拟前景广阔，并可能产生重大的经济影响。由于具有商业和军事用途，量子传感器更接近商业化，并可能显著提高远程成像、计时以及对电、磁和引力场的感知。从理论上讲，`QKD`\
  \ 可以增加通信免受窃听的安全性，但许多美国和英国的专家对其实际效用表示怀疑 [3。\n\n3. NATO 审查 - 凭借检测不可感知之物、彻底改变网络安全以及让我们能够解决以前无法解决的问题的能力，量子技术具有赋予人类全新力量的潜力。\
  \    两项应用在短期到中期内对国防和安全环境产生特别实质的影响。\n\n4. IISS 组织审查 - 目前军方最期待的进展之一是量子技术的整合，而仍然难以预测它们将如何具体影响军事行动。尽管广泛采用和具有成本效益的应用仍需数年时间，但毫无疑问，它们在大规模使用时将产生颠覆性影响。根据英特尔\
  \ 2018 年 5 月的 `Qcomm` 负责人的话，拥有几千个比特的量子计算机将以类似于第一台微处理器的方式彻底改变世界。`qubit`（量子比特）类似于传统计算机中的\
  \ `bit`，是量子计算机数据的基本单位。\n\n5. IEEE 曝光 - 在硬件充分充分的假设下，量子计算机在解决特定问题方面具有比传统解决方案更有效的潜力。这些问题专门与军事用途有关。本文讨论了最先进的量子技术及其不同的用途。此外，还有四种专门为军事用途定制的\
  \ `Qcomm` 用例。荷兰国防部 2021 年的 AI 战略计划完全符合这些用例。\n\n## 19.3 QTECH 概述\n\n本节对量子技术进行了简要解释，并附带相关参考文献。描述了每个\
  \ `QTech` 的当前发展状态，以及其使用影响、预计采用时间和关键困难。提供了涉及 `Qcomm` 应用所需的逻辑量子比特的大致数量。\n\n## 19.3.1\
  \ 量子信息科学\n\n被称为量子信息科学 (`QIS`) 的信息科学领域 [1–3] 专注于量子信息的研究并与量子物理学相关。经典信息科学中信息的根本载体是\
  \ `bit`，它只能是 0 或 1。量子理论中的主要信息载体是“量子比特”，即 `qubit`。一个 `qubit` 可以处于量子叠加态（即 `|0` 和 `|1`\
  \ 状态的任意复线性组合），也可以是 `|0` 或 `|1`。\n\n## 19.3.2 Qcomm\n\n`Qcomm` 一词描述了量子信息理论在计算中的应用\
  \ [4, 5]。量子计算机可以用来描述此类设备。`Qcomm` 设备可以以非常复杂的方式进行分类。为了本报告的目的，我们对内容进行了简单的分类如下：\n\n\
  *   量子模拟器通常被制成单用途设备，用于其他更难以捉摸的量子系统的建模和研究。与量子计算机相比，量子模拟器可以构想为一种非编程量子电路。\n*   模拟 `Qcomm`（有时称为哈密量计算）是绝热计算的一种变体，通常通过量子退火实现。由于\
  \ `qubits` 的限制，模拟计算机的使用受到一定限制，但它们仍可用于基于哈密量的优化。\n\n### 19.3.2.1 量子模拟\n\n在第一台量子计算机制造之前，人们认为对量子系统的模拟是量子计算机的主要目的。`分子`\
  \ 就是这样一种量子系统。尽管计算能力有所提高，计算化学只能完全模拟更复杂的化合物或更大的分子。例如，量子计算机只需要 `n qubits`，但经典计算机需要\
  \ `2n bits` 来描述电子状态。结果，量子模拟代表了 `Qcomm` 且可能是最有趣的应用。\n\n### 19.3.2.2 量子搜索与量子游走\n\n\
  `Grover 方法` 为数据库搜索或通用函数反转提供了二次加速，是广为人知的搜索方法之一。`Grover 方法`的复杂度为 `O`，而无序列表或数据库的传统搜索算法复杂度约为\
  \ `O(N)` [6, 7]，即与数量 `N` 成正比。为了分析所谓大数据，研究量子搜索技术至关重要。处理大量数据需要大型量子内存。然而，目前还没有能够长时间持有大量量子数据的可靠量子内存。其次，将经典数据转换为量子形式效率低下且耗时。因此，目前认为只有对算法生成的数据进行搜索是可能的。另一种搜索方法可能基于`量子随机游走`机制，以类似于\
  \ `Grover 算法`的方式加速搜索。\n\n### 19.3.2.3 量子密码分析 [8–11]\n\n量子密码分析还为对称加密技术的暴力攻击提供了增强的工具。使用著名的\
  \ `Grover 搜索技术`，`256 位 AES 密钥` 可能在 `2128 次量子操作`后被暴力破解，将密钥安全性降低 50%。尽管量子计算机资源需求巨大，但建议将对称密钥长度翻倍。对称加密系统的结构也被用于对对称密钥系统进行密码分析攻击，这具有加速多项式倍的潜力。`Simon\
  \ 方法`和`叠加查询`可能会完全解密大多数消息认证码 (MAC) 和关联认证加密 (AEAD)，例如 `HMAC-CBC` 和 `AES-GCM`。\n\n\n\
  \n\n\n许多数值模型已用于规划、工程、施工和天气预报，以将复杂问题简化为一组规模较大的线性方程。由于其中许多模型在本质上是统计性的，因此 `-approximation`\
  \ 可能是有效的。需要注意的是，`HHL` `[11–14]]` 方法已被证明适用于所有的 `Qcomm` 应用，包括 k 均 means 聚类、支持向量机、数据拟合等。\n\
  \n数据加载是需要大量输入数据的量子算法的主要问题之一。为了让有效的量子算法进一步处理，必须将经典数据（特别是二进制数据或位比特）转换为量子态。在这个缓慢的过程中，加载传统数据可能比加载相干数据花费更长时间。\n\
  \n## 19.3.2.5 量子优化\n\n鉴于解决 NP 级`[15, 16]]` 困难问题的可能性，量子优化是一个研究非常活跃的主题。旅行推员问题是这种 NP\
  \ 问题的一个例子。在这种情况下，目标是在给定位置列表及其相应距离的情况下发现最快（也是最好）的路线。人们可能会天真地尝试每一种，但这样做具有严重的缺点，而且随着复杂性的增加，甚至可能是可能的。因此，启发式算法形成了最常用解决方案的基础，尽管它们并不总是可以依靠来找到最佳答案。\n\
  \n## 19.3.3 量子通信与密码学\n\n“量子通信”指的是通过光纤或自由空间通道利用量子网络传输量子信息。光子经常被用作量子通信中的量子信息载体。由于光子的限制（例如远距离损耗），量子网络还包括额外的组件，如量子交换机或中继。\n\
  \n量子密码学的目标是开发利用量子密钥学的量子算法，以取代有的（通常是非对称的）加密方法。以下量子特性是量子通信的典型：量子纠缠、量子不性和不可克隆假设都支持量子信息无法复制的想法。\n\
  \n### 19.3.3.1 后量子密码学\n\n后量子密码学是加密技术的子集，能够抵御量子计算机的攻击。`-quantum-safe` `[1, 2]]` 通常被称为`量子抗性`。然而，`quantum-key`分布是非对称加密的主体。第二次量子革命导致了`QKD`，它是对称加密的主体。\n\
  \n### 19.3.3.2 量子随机数生成器\n\n随机数生成器（`RNG`）的应用包括蒙特卡洛模拟、密码学以及`[15, 16]]`。典型计算机上的`RNG`是确定的。可以使用`QRNG`。`RNG`的随机性是其优点之一。\n\
  \n### 19.3.3.3 量子网络\n\n量子网络有时被称为`IN`，旨在传递量子信息。因为量子信息依赖于量子纠缠，`quantum-network`受到`qubit`的限制。\n\
  \n### 19.3.3.4 量子密钥分发\n\n量子密钥分发（`QKD`）是对称加密的主要。目标是在双方之间共享一个密钥。`QKD`技术`[3, 4]]` 是量子计算机的主要。`quantum-key`分布已经在轨道上演示了`qubit`。\n\
  \n## 19.3.4 量子传感与计量学\n\n量子传感和计量学提高了计时精度，是`QTech`中最先进的领域。量子传感和计量学依赖于许多特性，包括量子能级、量子纠缠。各种选择标准包括灵敏度、信噪比、动态范围、采样率、工作温度。关键指标包括空间分辨率。常用单位包括旋转、时间、力、温度、磁场、电场以及光子计数。\n\
  \n### 19.3.4.1 量子钟\n\n原子钟（如 GPS 中的原子钟）自 20 世纪 60 年代以来一直是我们生活的一部分。基于代原子钟的`原子`理论认为，“滴”是电子在能级变化时发射的电磁辐射。原子钟代表了技术的尖端。现代热原子束和态选择原子钟的相对不确定度为\
  \ 10^-15 到 10^-16，或者尖端芯片级原子钟的相对不确定度为 2*10^-12。\n\n第二次量子革命为原子钟带来了新思想。量子逻辑钟建立在单离子技术上，该技术与捕获离子`qubits`连接。`quantum\
  \ logic clock`是第一个个不确定度低于 10^-18 的钟。量子钟也可以从量子纠缠中获益。\n\n### 19.3.4.2 量子射天线\n\n射频（`RF`）`antenna`可以发射或接收几种不同的信号。它们可以是从简单的极子天线到复杂的`AESA`模块的任何设备。它们的尺寸受到产生或接收信号波长的限制。\n\
  \n\n\n\n量子 `RF` 接收器可用于导航、主动成像（雷达）、电信、媒体接收器或被动 `THz` 成像，采用单单元（针对特定频率、窄带宽）或阵列传感器（宽频）[10,\
  \ 11]。\n\n### 19.3.4.3 量子雷达技术\n\n从理论上讲，量子雷达的工作方式与传统雷达相似，即必须向目标方向发送信号，然后雷达系统必须等待反射回来的信号。然而，量子力学方法可能会带来新的能力并提高精度。\n\
  \n所有协议面临的主要问题是纠缠光子在（不仅是）微波频段产生速率极快。在雷达方程的量子形式中，主项 `1/R4`（其中 `R` 是雷达与目标之间的距离）仍然存在。因此，需要的纠缠光子（模式）比现在多出几个数量级。在某些方面，量子雷达与噪声雷达相似，并具有许多共同特征，例如有效的频谱共享、高截获概率、低探测概率等。\n\
  \n### 19.3.4.4 量子电、磁和惯性力传感\n\n可以使用各种通用量子传感技术来测量各种物理量。尽管对每种技术都给出了概述，但详细讨论超出了本文的范围。许多应用使用了不同的量子技术。例如，量子惯性导航使用了三种不同的传感形式——加速度、旋转和时间。通常情况下，许多应用（不仅仅是使用\
  \ `QTech` 的应用）都需要精确的基于量子的时间。原子蒸气、冷原子干涉、氮空位中心、超导电路和捕获离子是一些最有前景的技术。\n\n原子蒸气（测量值：磁场、旋转、时间）。当存在外部磁场时，高密度、自旋极化的原子蒸气\
  \ [12] 会发生可以通过光学观察到的状态跃迁。最好在室温下部署。通过原子蒸气感知旋转的原子自旋陀螺仪 (`AGS`）。另一种方案是芯片级 `AGS` [5]。作为标准，可以使用最精确的传统旋转传感器（例如环形激光陀螺仪）。预期的量子传感器精度应该是其两倍左右。然而，列出的最佳经典陀螺仪尺寸为不可可能的\
  \ 4 m x 4 m。基于原子团的室温原子蒸气室磁力计在性能方面具有超越 `SQUID` [13] 磁计的潜力。\n\n### 19.3.4.5 量子成像系统\n\
  \n量子成像系统的应用 [14, 15] 包括低亮度成像、3D 量子相机和量子雷达。\n\n被称为量子照明 (`QI`) 的量子协议使用两个相关（纠缠）光子来寻找目标。保留单个光子（“闲置”）。另一个被称为“信号”的光子被释放并向目标反射；对两个光子都进行测量。即使纠缠被损耗且有噪声的环境所破坏，这种方法的优势依然存在。其中之一是\
  \ `QI` 协议 [16]，该协议最初为量子雷达设计，也可以应用于量子通信或人体成像。\n\n### 19.3.4.6 其他传感器\n\n利用光声检测，量子技术可以产生声波。`量子级联`\
  \ [17] (`QCL`) 的发展仍处于婴儿阶段。`QCL` 是一种在中波和长波波段发射的半导体。\n\n\n\n\n到为止，传感器、量子密钥分配（QKD）、量子通信（Qcomm）以及其他量子技术一直都是分开考虑的。然而，长期计划考虑了量子网络如何连接量子通信和传感器。在这里，理论和实验努力展示了如何利用量子纠缠传感器和计算机来获得额外的量子优势。未来可能还会发现或创造出其他类似的应用。在开发光纤/量子网络时，这是一个必须考虑的关键因素。随后，完全的量子中继器和交换机可以取代目前的信赖中继器等组件，使量子网络实现其全部潜力。\n\
  \n## 19.5 量子技术（QTECH）的军事应用\n\n量子技术对人类活动的许多方面具有产生重大影响的。一个很好的例子是国防部门 [24, 25]。量子技术可能影响现代战争的所有方面。第二次量子革命将提高灵敏度和效率，提供新的能力，并改进目前的军事策略，而不是创造新型的武器。\n\
  \n### 19.5.1 量子通信（Qcomm）的能力\n\n得益于能够帮助解决复杂计算问题的量子通信，目前的经典计算服务将获得新的能力。除了之前提到的量子模拟外，量子通信还涵盖量子优化、机器学习/人工智能的改进、量子数据处理以及更快的数值建模。人们还讨论了量子计算机在不久将来提供的潜在军事解决方案。预测性维护、射频频谱分析、供应链优化、物流管理和战斗演习是其中一些例子。\n\
  \n### 19.5.2 量子网络安全\n\n现有的非对称加密（基于整数分解、离散对数或椭圆曲线离散对数问题）以及理论上的对称加密，都可以使用网络战中全新的、但一方面非常高效（具有指数级速度提升）的攻击向量被攻破。另一方面，已经开发出现代加密方法和算法，以抵抗量子系统和量子密钥分配。\n\
  \n### 19.5.3 量子 PNT\n\n定位、导航和授时（PNT）系统 [13–15]，特别是惯性导航，预计将从量子技术中极大地获益。一种被称为时间标准和频率传输（TFT）的关键服务为通信、计量以及全球定位系统（GNSS）提供精确授时。尽管目前的\
  \ TFT 系统已经非常完善，但结合利用量子网络的的光原子钟或量子钟的性能将跟上当前应用（通信、GNSS、金融部门、雷达和电子战系统）日益增长的需求，甚至将实现新的应用（量子传感和成像）。\n\
  \n### 19.5.4 量子通信网络\n\n具有多种具有重大影响（不仅限于安全相关）服务的量子网络被称为“量子互联网”。对于许多需要量子纠缠的渐进量子通信网络应用，需要量子中继器和量子交换机。记住，信赖中继器只能配合\
  \ `QKD` 使用。未来无人机、飞机、船只、车辆、士兵、指挥中心等末端节点之间的连接将通过自由空间通道和光纤技术实现。\n\n### 19.5.5 量子电子战\n\
  \n具有量子增强的电子战（EW）与专注于对抗、反反措施以及针对量子通道支持的量子电子战区分开来。量子通道是指使用自由空间或光纤，交换携带量子信息的光子，用于量子网络、量子雷达或其他量子设备。\n\
  \n### 19.5.6 量子 ISTAR\n\n为了执行精确操作，现代军队需要具备 ISTAR [15, 16]（情报、监视、目标获取和侦察）能力。量子技术的应用可能极大增强多领域战场的态感知。获取新情报数据、分析来自监视和侦察的大数据以及应用量子机器学习/人工智能识别目标的能力，预计将受到量子通信的重要影响。\n\
  \n量子重力计和重力梯度计为地球物理研究、地震学、考古学、石油和矿物探测、地下扫描、精确地理参考和地形制图（例如用于水下导航的海底制图）提供了高精度应用。\n\n\
  ### 19.5.7 化学和生物模拟与检测\n\n军事、国家实验室、化学防御部门或 CBRN（化学、生物、放射性和核）防御力量发现，与防御相关的化学和生物模拟特别吸引人。基于量子模拟的新型药物和化学品的研究将需要强大的量子计算机、经典计算设施和量子化学专家。民用研究的需求（例如目前正在进行的蛋白质折叠、氮固定和多肽工作）在理论上与化学生物化学武器的量子模拟需求相同。对于光声检测，量子级联激光将作为良好的化学检测器。量子化学检测器可以识别如\
  \ `TNT` 和三过氧化三丙酮等物质，这些物质被用于自制爆炸装置（IED），这是不对称战争中的常用武器。可以使用检测行李和登机人员爆炸物的相同工具检测丙酮。总来说，量子化学技术可以识别危险的工业化合物或化学武器。\n\
  \n### 19.5.8 新材料设计\n\n通过利用量子力学 [17, 18] 特性，现代科学正在创造新材料，被称为超材料，称为量子材料（例如石墨烯、拓扑绝缘体）。量子计算机可以模拟物质的电结构，例如将材料视为量子系统。考虑的应用示例包括开发更好的电池、室温超导体和改进的材料属性。\n\
  \n国防工业新型材料的研究潜力包括改进伪装、隐身（电磁吸收）、超硬装甲和耐高温材料设计，但不涉及任何具体细节。\n\n### 19.5.9 量子雷达和激光雷达\n\
  \n人们对量子雷达的认知受到媒体围绕中国据称开发该技术的炒作以及成功的实验室测试的影响。实际上，量子雷达的一些主要理论优势和特性包括以下内容（其中某些取决于特定的量子协议）。\n\
  \n以下是关于量子增强雷达的简要说明。传统的雷达系统可以配备原子钟或量子钟。由于其高精度和低噪声，这些量子增强雷达在探测无人机等小型、缓慢移动的物体时显示出明显的优势。\n\
  \n### 19.5.10 量子空间作战\n\n\n\n\n\n先进国家将空间作为战场的重要性日益增加。传统上，卫星在轨道用于通信、制图、导航和监视，主要用于军事或商业目的。现代太空军事化日益加剧；激光武器卫星或“自杀式”卫星被送入地球轨道，反卫星战争也在增长。空间碎片是另一个不断扩大的问题，估计轨道上有\
  \ 2,200 颗卫星 [19, 20]，还有若干颗计划发射。\n\n随着量子传感和通信技术扩展到太空，对量子电子战的兴趣将会增加。\n\n### 19.5.11\
  \ 量子水下战争\n\n随着对潜艇或水下水雷磁探测改进、突破性的潜艇惯性导航以及量子增强精密声纳的发展，`QTech` 可以大幅减缓水下战争。量子光探测器、雷达、激光雷达、磁计或重力计均可用于海洋感知。关于\
  \ `QTech` 如何影响核动力潜艇几乎不可摧毁的防御，可以进行广泛的总结。量子磁计可能是反潜艇战中的基础武器。根据研究人员的，特别是具有不断改进的噪声抑制能力的\
  \ `SQUID` 磁计可以在 6 公里外探测潜艇。请注意，目前使用的典型直升机或飞机载经典磁异常探测器的范围仅为几百米。潜艇可能无法在量子磁计阵列覆盖的某些区域，例如沿岸地区。此外，量子磁计组似乎在较高的噪声抑制下运行得更好。\n\
  \n## 19.6 量子战争的挑战与后果\n\n用于军事目的的 `QTech` 的开发、获取和部署将带来新的、关联的挑战。军事学、战略和战术，以及道德、裁军倡议和技术进步，都需要为了应对量子战争做出改变。应该进行研究以理解开发\
  \ `QTech` 产生的问题、影响、风险和选择，而不仅仅是为了军事应用。\n\n### 19.6.1 技术影响与困难\n\n成功的实验室概念验证必须转化为实际的“野外”应用，同时还要克服许多科学技术挑战，例如在不牺牲实验室实现的灵敏分辨率的情况下实现小型化和可操作性。此外还有相关的技术挑战。\n\
  \n量子人才储备可能是一个重大问题。量子人才并不一定由拥有博士学位的物理学家或科学家组成。为了理解、分析和评估通过量子传感器、计算机和通信传输的数据，他们应该是精通量子信息科学并深入理解\
  \ `QTech` 的量子工程师。需要越来越大的量子人才库来支持逐渐增长的当前量子生态系统 [17]。\n\n最后的挑战是行为标准化。标准化过程对于确保不同制造商的设备协同工作至关重要。除了统一的接口和通信协议外，标准化过程可能还包括安全验证，就像后量子密码学的标准化一样\
  \ [18]。量子网络中预计会有许多互连的组件，如节点、继器、交换机、光纤通道和空间通道。某些标准的开发和应用对于量子信息的正确传输至关重要。\n\n### 19.6.2\
  \ 对伦理与和平的挑战与后果\n\n已经有多项针对 `Qcomm` 伦理标准的请求，讨论了人类 DNA 的修改、新武器的开发以及侵入性 AI。尽管量子技术没有产生新武器，但它们确实推进了已使用的军事设备，增强了能力并缩短攻击所需的时间，这是一个警告。结果，量子技术在降低个人风险的同时，可能会增加使用武力的可能性，从而提高战争的可能性\
  \ [19]。\n\n`Qcomm` 的研发成本特别高。然而，目标是开发出使量子比特生产变得简单可靠的技术。这可能导致专业水平较低的参与者也能广泛使用技术——这是未来军事技术的特征。\n\
  \n### 19.6.3 对军事的影响\n\n量子技术通过开发更精密的导航、超安全通信、尖端 ISTAR（情报、监视和侦察）以及尖端计算具有提高军事能力的潜力。通常，为了量子时代创建并获取新方法和工具，量子战争将需要开发新的军事学、场景和战术。必须首先制定技术政策和战略以应对各方的战略目标。市场研究、可行性研究、发展水平评估、军事安全威胁评估以及国家\
  \ `QTech` 资源都应成为国家技术计划和战略的一部分（大学、实验室和企业）。另一个主题是与盟友谨慎共享的关键量子优势，特别是在量子 ISTAR 和量子网络能力领域，这些领域能够泄露机密文件、核潜艇行踪或地下场所等军事机密。\n\
  \n## 19.7 结论\n\n不断发展的 `QTech` 科学具有许多潜在破坏性的应用涉及对单个量子的操控和控制。这些应用许多专门用于军事或具有多种用途。通过军事应用，每项\
  \ `QTech` 都有一个 `TRL`（技术就绪水平），范围从 `TRL 1`（基本原理）到 `TRL 6`（在相关环境中经过验证的技术）。上述所有概念都包含在“量子战争”这一术语中。\n\
  \n\n\n\n\n# 量子计算的潜在威胁与伦理风险\n\n## 摘要\n本文探讨了具有多种技术准备水平（TRL）的量子技术，重点关注它们如何被应用于或用于国防部门。由于从实验室到现实应用的转变尚未发生或正在进行中，无法预测量子技术（QTech）将如何被应用。这引发了一个问题：在技术上是否可能获得比传统系统具有真正量子优势的解决方案，而传统系统通常便宜得多且广泛在使用。我们必须警惕量子炒作，并关注仍需克服的挑战，尽管关于在军事中使用量子技术的可能性预测听起来可能过于乐观。量子技术的影响既是即时的，也是长期的。然而，技术意外影响军事和防御能力的概率较低。避免意外的最佳策略是保持对量子技术的实效性理解，并持续监测其发展和使用。谨慎应用量子技术将提供保护。\n\
  \n**关键词：** 网络安全、加密协议、量子计算机、量子伦理、风险管理、互联网流量优化\n\n## 引言\n计算机科学对量子理论的应用被称为量子计算 1。量子理论解释了原子和亚原子水平上能量和物质的行为。量子计算使用了电子或光子等亚原子粒子。得益于量子比特（qubits），这些粒子可以同时存在两种状态（即\
  \ 1 和 0）。理论上，链接的量子比特可以利用其波状量子态之间的干涉来完成其他情况下需要数百万年的计算。为了在位中编码信息，目前的传统计算机使用电脉冲的二进制流（1\
  \ 和 0）。与量子计算相比，这限制了它们处理信息的能力。\n\n### 量子计算知识\n20 世纪 80 年代见证了量子计算领域的出现 2。人们发现某些计算问题通过量子算法比经典算法可以更有效地解决。量子计算具有筛选海量选项并识别困难问题潜在答案的能力。量子计算机使用量子比特，而经典计算机将信息存储为\
  \ 0 或 1 的位（bits）。量子比特将信息存储在一种与 0 和 1 相互作用的多维量子态中 3。一些大型公司已经注意到了这种巨大的处理能力以及预期的应用市场规模。这些包括\
  \ NEC、雷神（Raytheon）、洛克希德·马丁（Lockheed Martin）、IBM、微软、谷歌、D-Waves Systems、阿里巴巴、诺基亚、英特尔、空中客客、HP、东芝、三菱、SK\
  \ 电信等。\n\n### 量子计算的局限性\n在几个领域，量子计算在进步和解决问题方面具有巨大的前景 4。然而，它目前正受到限制。\n\n## 参考文献\n\
