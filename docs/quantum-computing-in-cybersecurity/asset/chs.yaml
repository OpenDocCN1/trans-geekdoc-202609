  \ 是此类设备的名称。`Qcom` 的分类可能极其困难。\n\n### 27.3.4 量子互联网 [24, 25]\n\n尽管目前的互联网很快，但量子加密消息具有更高的安全性。量子加密将导致互联网运行缓慢得多。但在未来，我们完全可以在“正常”互联网和“量子加密”互联网之间无缝切换，确保即使是我们最私密的通信也是以设想中最安全的方式发送。这将实现既快速又安全的互联网的目标。\n\
