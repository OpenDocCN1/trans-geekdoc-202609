  \ Journal)，1: 191–205。\n\n## 注意事项\n\n1. *通讯作者*：hepisuthar@gmail.com\n\n# 9 基于网络安全的量子计算\n\
  \nP. William¹, Vivek Parganiha² 和 D.B. Pardes³\n\n¹浦纳，Satyani 工程学院信息技术系\n²布海莱，Bhilai\
  \ 理工学院计算机科学系\n³浦纳，Satyani 工程学院电气工程系\n\n## 摘要\n\n随着量子计算机开发的竞争白热化，企业和研究机构发现自己日益成为间谍活动的目标。由于量子应用的普及，信息系统和服务正迅速接近临界点。在本文，我们探讨了与该领域相关的潜在攻击向量。接下来，我们描述了可以采取的保护量子软件和硬件的应对措施。\n\
  \n**关键词：**量子软件、量子计算、训练、网络安全\n\n## 9.1 引言\n\n网络安全是一种经常被忽视的前瞻性策略。随着量子计算机开发的竞争白热化，公司、大学和研究机构由于此类信息的价值而成为间谍活动的首要目标。数字化兴起和远程办公的趋势都增加了对任何规模存储和处理信息的公司的攻击。对于可靠的量子系统、服务和未来技术，从开始构建安全性至关重要。本工作的范围也涵盖了商业企业。对于初创公司、大学衍生公司和供应商来说，及早讨论是有益的，原因包括从专利技术中获利以及保护产品免受相关危险。本综述的目的还为了激发对话并推进跨学科研究的观点。\n\
  \n## 9.2 预备\n\n在讨论危险向量之前，我们将检查几个对理解至重要的量子计算相关问题。为了利用量子现象，量子计算系统使用的处理器将各种组件集成成一个独特、高效的整体。阿姆达尔定律指出，加速器是任何连接到中央处理器的协处理器，并具有加速某些计算密集型内核整体执行的潜力。为了使你的量子计算机图灵完备，需要一个被称为量子处理单元（QPU）的协处理器。QPU\
  \ 反需要一个控制系统、一个模拟数字接口以及一个能够连接网络的主机 CPU（Host-CPU），以管理应用逻辑。\n\n\n\n\n\n为了理解这些量子加速器背后的价值和原理，我们将在下一节中探讨它们的预期应用。大量关于“量子计算很快就能能够绕过现有安全措施”的观点误导了现状，未能表达出这些可能的能力距离实现还有几年的时间。若干个优化问题、分子建模，以及催化剂和药物的创建，仅仅是可靠的量子加速器可能用武的领域的少数例子\
  \ 16。由于目前不存在此类系统，尽管有了这些改进和优化，传统的替代方案仍然占据主地位。\n\n![图 9.1 量子计算架构。](img/fig9-1.jpg)\n\
  \n图 9.1 量子计算架构。\n\n谷歌最近的一项研究表明，要在八小时内解密 `RSA` 密钥，需要 2000 万个 NISQ 设备量子比特 19。尽管如此，物理比特（相对于纠错逻辑比特）的最新进展尚未正式跨越\
  \ NISQ 设备 100 个量子比特的门槛 20。这还没有涵盖数字退火器技术的使用，后者是专门为优化目的而设计的模拟设备。\n\n即使在具有二次加速的情况下，情况也是如此。在这项工作中，研究人员认为，情报寿命长且密钥长度短于\
  \ `AES-256` 的机密加密材料在未来可能被保存和解密 23。由于解码可能花费几个月，它们可能会受到未来量子攻击的影响，而寿命较短的情报将不受影响。因此，量子计算设备从反方向带来的威胁目前并非紧迫的问题，数据情报寿命在这方面起着至关重要的作用。\n\
  \n另一方面，对新兴量子计算基础设施安全性的担忧很少被提及。由于量子计算系统是混合系统，并且在可见的未来将继续是具有 `CPU` 主机、云端或受控 `APIs`\
  \ 的混合系统，对可靠且安全的服务及设计的需求增加了。因此，必须实施适当的安全措施，以便这些系统能够处理和存储核心应用程序及数据。\n\n## 9.3 威胁格局\n\
  \n每场网络攻击背后总有一个威胁源者，而且他们对所做的事情总有理由。受政治和与某国家地理接近驱动的威胁源者被称为国家级攻击者，而受金驱动的被称为网络犯罪分子。虽然意识形态是黑客主义背后的动力，但某些国家级威胁源者也具有财务目标，这模糊了两者之间的界限。数据外泄、勒索软件和恶意软件即服务等活动的增加，都是全球数字化和互通性日益日益增长的直接结果。目前，许多犯罪企业为各种威胁源者提供这些服务。招募、生产网页注入工具包或漏洞利用网络、专门的分发方法（如发送垃圾邮件），以及提供电汇诈骗和加密货币服务等变现方案，都是该生态系统扩展以适应网络犯罪的例子。\n\
  \n对于量子计算科学突破的竞争，已经引发了对国家安全的担忧 6, 7。因此，量子竞赛可能被视为国家对其公民施加更多控制的手段，也是早期采用者获得经济的手段 23。随着量子计算服务提供者的可靠性、质量和问责制的提高，其可用性和经济连续性的不断改进，对量子系统的攻击将会增加。同样地，这将激励黑客针对这些系统进行破坏、网络勒索和数据窃取，以从其非法活动中获利。尽管具有共同意识形态目标的黑客可能采取类似的策略，但他们可能在如何追求这些目标、将开展的研究性质或他们想要破坏的组织方面存在分歧。\n\
  \n在基础层，敌人的策略是可以比较的。在通过对目标侦察收集情报后，下一步是插旗、提升权限，然后静地扩展到整个网络。如果目标是收集情报，对手将希望保持隐形并尽可能少制造麻烦；然而，如果目标是破坏，揭露敌人存在这一行为本身可能导致麻烦。这种方法也被用于非法获利，通常与某种用于勒索或出售数据的通信相结合。防止来自特定向量的攻击或采用特定威胁源者方法的最好方法是了解他们典型的战术、技术和程序\
  \ (TTPs)。此外，目标公司或机构必须了解自己的系统和环境，以便妥挫败攻击。\n\n\n\n\n\nQaaS（量子即服务）提供商、处理或消费这些服务的用户以及威胁行为者都可能成为目标。云端、互联网和工业控制系统（ICS）中许多常见的安全漏洞也适用于此处。服务配置不当、基础设施不安全、对开发或暂存环境的未经授权的访问以及服务或数据的集成，都是云环境中常见的安全关注问题[\\\
  [25\\]](#c09.xhtml#ref25)。在过去的十年中，针对在线应用程序的主要威胁没有发生太大变化，但 OWASP 前十大安全风险项目[\\[26\\\
  ]](#c09.xhtml#ref26)为减少这些危险提供了坚实的基础。例如，攻击者可能通过利用身份验证或访问控制措施中的弱点来接管用户账户、暴露敏感数据，或通过修改\
  \ `DOM`（文档对象模型）来注入恶意代码或查看用户的浏览器历史。\n\nICS 最可能包含漏洞的组件是那些具有特定硬件亲性的组件。旧的控制系统包含大量的关键缺陷，而可能用于利用这些弱点的利用程序广泛传播。开放平台通信（OPC）技术，特别是在像\
  \ `OPC classic` 这样旧的控制系统中，与 `RPC`（远程过程调用）和 `DCOM`（分布式组件对象模型）具有相同的安全问题，这些服务在设计上留下了多个开放端口。自动化的\
  \ ICS 漏洞包括跨站脚本、缓冲区溢出和硬编码密码\\[27, 28\\]。\n\n人为因素是本文的关注重点，也许可能是最重要的部分。成功的社会工程和网络钓鱼攻击利用了人性，特别是人们对社交和探索的本能倾向。鱼叉式网络钓鱼和凭据窃取可能通过\
  \ USB 投放攻击、身份冒充和对内部信息的要求而产生。旧和新软件系统都有其优点和风险。使用硬编码的凭据、缺乏身份验证或使用不适用于关键任务的方法、错误的默认权限以及将敏感数据暴露给没有访问权限的个人，是一些最常见且可能导致灾难性的软件漏洞。\n\
  \n## 9.4 防御措施、应对措施和最佳实践\n\n第一阶段是熟悉你当前的技术设置和即时环境。网络安全成熟度较高的系统中的安全操作程序包括用于威胁检测和响应的全面监控和记录。这始终是成本与可用资源之间的平衡，尽管这种平衡的具体细节会因应用程序、系统和流程的不同而异。为了有效执行关键安全策略，必须首先识别与你的关键资产和活动相关的威胁。初始防线简单地通过改进网络卫生和提高意识来加固。\n\
  \n由于你的潜在目标区域正扩展到云端以及员工的家中，你需要限制员工远程工作的能力。在端点和数据传输过程中进行加密对于实现这一目标至关重要。必须利用防火墙和 DMZ（边界网络中的去军事化区）为适当的边界设置划分、授权、认证和加密。此外，如果资源允许，应该建立完整的零信任模型。云安全差距研究和安全审计有助于识别云计算安全中的风险设置和弱点。未投入的系统（如用于研发的系统）也需要重视。\n\
  \n对于遗留软件（如 ICS 系统中的），建议将 `OPC classic` 升级到 `OPC UA`，并实施进一步的隔离，通过使用 `AAA`（身份验证、授权和审计）以及防火墙和\
  \ `DMZs` 来关闭风险口。这两项措施都应该采取。由于商用组件与专有软件硬件的结合，设计上的闪存和提供源代码漏洞修复是商用可行量子计算系统的必要条件。供应商的组件必须负责发现安全问题并实施补丁。\n\
  \n当我们更仔细地检查控制系统时，我们发现安全系统需要被隔离以消除任何弱点。为了确保系统安全，我们必须这样做。例如，攻击者不应能够通过同一个 `Host-CPU`\
  \ 访问 `ADI/冷却 QPU` 的系统和控制单元，从而破坏受攻击的 `QCS`。这将防止攻击者破坏 `QCS`。\n\n人的存在是 ICS 环境另一个不应忽视的因素。具有物理隔离的系统只能通过物理桥接系统两个部分之间的间隙来破解。限制物理访问、仅对授权的\
  \ USB 闪存建立名单和/或设置设备防病毒扫描阶段，都是帮助减少员工（无论是内部威胁还是仅仅是愚蠢）获得未经授权访问的潜在方法。\n\n`SANS CIS Controls`\
  \ \\\\[12–14, 32\\]为关键控制系统提供了一套建议的网络防御行动方案 15, 17, 18\\]，而 `MITRE Shield` [\\[33\\\
  ]](#c09.xhtml#ref33)提供了针对某些方法的防御方法的全面描述。可以借助 `ICS` \\[21, 22, 24\\] 实现更安全的 OPC 系统设计\\\
  [34\\]。`DevSecOps` \\[29–31\\]是一种将安全工具和程序集成到软件开发生命周期各个阶段的简化和自动化框架。人员可以使用 `Metasploit`\
  \ 和 `W3AF` 等工具进行全面的漏洞测试。\n\n## 9.5 结论\n\n由于量子计算研究资源有限，我们无法等到问题出现后才采取行动。我们应该从安全角度来构建和编写量子硬件和软件组件。类似的服务设计左移需要类似于此处描述的思维转变。量子计算领域受到破坏、间谍活动和勒索问题的困扰。威胁信息使实施基于预测的防御成为可能，使安全操作在处理威胁行为者时从被动变为主动。`MISP`（恶意信息共享平台）是一个开源威胁情报平台，可以作为获取各种威胁行为者知识的有用资源。\n\
