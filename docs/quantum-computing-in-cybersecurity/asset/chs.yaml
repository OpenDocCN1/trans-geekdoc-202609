  \ `a` 的完整通用态传输给接收端（`Rx`）。\n\n首先，`Tx`和`Rx`共享一对纠缠的 `bc` 量子比特，其中 `Tx` 拥有纠缠对中的 `b`，`Rx`\
  \ 拥有 `c`。然后 `Tx` 共同测量 `ab`，产生两个经典比特，并通过经典通道传输到 `Rx`。测量破坏了 `Tx` 上的两个量子比特，但由于 `b`\
