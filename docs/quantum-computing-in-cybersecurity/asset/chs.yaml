  \n**关键词：** 量子理论，量子计算机，量子计算威胁，量子通信，量子密码学\n\n## 25.1 引言\n\n量子计算能够解决现实世界复杂且棘手的问题，速度比超级计算机快约\
  \ 158 倍，并在几分钟内完成传统计算机需要一万才能完成的任务 [1, 2]。通过高效地利用量子物理学 [3, 4] 的叠加、不确定性、纠缠等概念，它们绝对可以取代当今最受欢迎的计算机。\n\
  \n但像世界上任何其他事物一样，即使是量子计算机也可以被轻视的方式使用，因此深入探索该领域的阴暗面至关重要，以便提前进行应对（或至少让人们意识到可能出现的挑战）。本文试图强调在坚决地推进量子计算的同时，需要重点关注的所有这些阴暗区域。图\
  \ 25.1 显示了量子计算与大数据的未来，图 25.2 显示了对量子计算的深度探讨。\n\n### 本章结构\n\n本章其余部分的概述如下：第 25.2 节\
  \ 显示了量子计算的意义和量子计算机的工作；第 25.3 节 显示了量子计算的阴暗面；第 25.4 节 概述了相关工作，第 25.5 节 对本章进行总结。\n\n\
