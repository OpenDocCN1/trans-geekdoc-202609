  \ `Section 15.6` 中给出。\n\n## 15.2 量子计算机在机器学习中的意义\n\n研究人员声称，传统的机器学习系统 `[9, 10]` 无法直接访问并从量子信息中学习，而量子学习代理可以做到，从而提供任何其他方式无法想象的分析。根据作者的说法，对于某些问题，量子计算机可能会提供比经典系统指数级的性能，但为了充分实现这一潜力，研究人员必须先扩大比特数量并增强量子纠错。\n\
  \n然而，作者补充道，在分析来自量子传感器的数据 `[[11\\]](#c15.xhtml#ref11)` 时，即使是今天的嘈噪声量子计算机与传统计算机相比也有巨大的进步。这些传感器已常用于高精度测量，它们利用粒子相关性获取比其他情况下更多的系统细节。它们可用于测量磁场等并绘制环境地图。\n\
  \n预计量子计算机在某些任务上将提供比传统处理器快十倍的计算速度。现代机器学习模型的训练极其昂贵，即使使用最好的硬件，训练时间也可能数周。随着更复杂的量子机器进入市场，使用量子技术的量子神经网络训练时间可能会继续减少\
