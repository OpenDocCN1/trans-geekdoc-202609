  \n\n随着互联网使用的日益普及，网络攻击的频率正在上升。随着量子计算（QC）竞争的进行，量子计算企业和研究机构可能成为国家力量、网络犯罪分子和黑客行动者的目标，以获取经济利益或进行破坏。本文探讨了量子计算技术的状态，以及网络安全与量子计算之间的联系。现在我们进入针对快速发展的网络犯罪的危险以及建议的预防措施。随后，我们针对如何利用威胁情报以及通过确保量子软件和硬件组件在设计上实现安全，来主动降低网络攻击面提出了建议。\n\
  \n一旦构建了大规模且容错的 `Qcomp`（`Qcomp`），预计广泛使用的公钥密码科学技术（如 `RSA` 和椭圆曲线加密）的安全性将会恶化。由于这些算法是现代社会（包括金融业）IT\
  \ 基础设施的核心，其潜在威胁是严重的。美国国家标准与技术研究所（`NIST`）一直致力于标准化后量子密码学（`PQC`）技术，该技术旨在抵御 `Qcomp`\
  \ 的攻击，即使这种危险在可预见的未来不太可能发生。NIST 一直在评估十五种潜在算法的性能和安全性（七个入围者和八个备选候选）。标准化应该加速全球向 `PQC`\
  \ 的过渡，而不仅仅是在美国。在本章中，我们将讨论 `Qcomp` 分析和开发的当前进展，以及与公钥科学算法相关的安全问题。然后，我们将介绍 NIST 正在进行的\
  \ `PQC` 标准化工作，以及各组织支持迁移的响应。最后，我们讨论了在现实世界中应用 `PQC` 的潜在困难。\n\n**关键词：** 量子计算、黑客行动主义、网络攻击犯罪、量子模拟、加密\n\
  \n量子信息（`Qinfo`）科学是一个利用创建和使用量子能力的学科。它包括量子网络、量子传感和量子模拟 [1, 2]。与传统计算机或其他经典计算机相比，`Qcomp`\
  \ 能够更快速地处理某些问题。它们通过利用量子物理概念，并发执行多个过程，这种方式与传统计算机有本质区别。这项工作的基本概念涵盖了来自学术机构以及创建、生产或处理量子计算（QC）软件或硬件的机构的广泛信息，从连接到网络的量子技术，延伸到任何具有数字能力的部门。此前关于是否为药物\
  \ [15, 16] 用户带来安全个人技术并保护其发现免受相关危险的讨论，对初创公司、大学衍生企业和商家有利。其目的是反映 QC 专家的潜在教育路径，同时激发学科研究的讨论并推进理念。\n\
  \n`RSA` [3, 4]（Rivest-Shamir-Adleman 加密）和基于 `AES`（高级加密标准）的加密被用于保护数据。简单来说，随机生成的密钥决定了网络安全。这些密钥的随机性是其质量的衡量标准。当密钥随机性弱时，传统的加密技术很容易受到黑客的攻击。事实证明\
  \ `RSA` 和 `AES` 标准可以被破解，因为它们并非真正的随机。量子物理核心的随机行为赋予了量子密钥不可破解的特性。美国国家标准与技术研究所（`NIST`）正积极致力于将密钥生成的后量子方法标准化\
  \ [5, 6]。\n\n![图 29.1 QC 架构 [1, 5]。](images/fig29-1.jpg)\n\n**图 29.1** 一个 QC 架构\
  \ [1, 5]。\n\n在为这些偏差创建新操作的同时，构建一个稳健且一致的量子计算机系统标志着量子计算探索阶段的结束。虽然许多计算机可能直接替代经典计算机，但它们能够解决某些目前经典计算机本质上无法解决的问题。量子处理单元（`QPUs`）的工作类似于图形处理器单元（`GPUs`）[7,\
  \ 8] 加速今天计算机特定操作的方式。此前，计算社区已经联系了许多跨材料知识、生物物理和化学、机器素养以及人工智能的问题，这些问题将在量子计算机的推动下产生革命性的影响。QC\
  \ 的架构如图图 29.1 所示。\n\n### 29.1.1 QC 的用途 [9, 10]\n\n*   QC 对安全协议既有优势也有缺点。这些后果包括当前安全协议（`SSL`、`SSH`、`IPSec`）使用的公钥加密系统变得不稳定、需要开发可靠的加密系统取代传统的公钥加密系统，以及需要开发可以在\
  \ `Qcomp` 基础设施上运行的可靠协议。\n*   `Qcomp` 认为工程领域的离散对数、整数分解和搜索挑战提供了解决方案。`RSA` 加密系统的安全性直接受到这种方法的影响。还需要新方法来对挑战问题进行分类。在目前的分类中，离散对数问题和整数分解问题都属于\
  \ NP 类。然而，考虑到 `Qcomp`，这两个问题都进入了 P 类。\n*   在大数据和云计算等连接到数据处理的应用领域，人们认为量子技术可以改变所有类型的数据处理和安全程序。\n\
  *   通过在原子水平上模拟量子系统，医学和制药领域可以产生接近真实的结论，以及目前无法访问的信息。\n\n29.2 网络犯罪攻击对 QC 的意义 [15–18]\n\
  \nQC 已成为确保信息领域变革的关键部分。随着网络攻击的增加，人们认为 QC 将带来网络安全的改进。\n\n虽然广泛预计 QC 将重塑各行业，特别是金融业，它还将重塑网络安全。尽管预计\
  \ QC 不会在 2030 年或之后才进入主流，但现在可能是企业为它的到来做好准备的时候。为什么呢？预计 `QC` 最终能够分解用于非对称加密算法的大整数，这塑造了现代数据保护系统的理念，这意味着企业需要重新评估其加密系统。\n\
  \n\n\n今天，还没有任何量子计算 11 系统能够控制大量的量子比特，以执行破解现代保护所需的因式分解。但在现在十到二十年后，情况很可能会发生变化，这可能使包括金融行业在内的组织处于高风险之中。因此，科学家、决策制定者和网络安全专家正关注后后量子密码学\
  \ (PQC) 12，以应对这些预期问题。图 29.2 显示了网络犯罪攻击的来源。\n\n![图 29.2 网络犯罪攻击的来源 [7–9]。](images/fig29-2.jpg)\n\
  \n图 29.2 网络犯罪攻击的来源 [7–9]..\n\n## 29.3 相关工作\n\n网络技术具有显著提高生产力的潜力，并能开启新的机会，这些机会对于我们社会、经济以及现有企业的成功至关重要。然而，我们对网络技术的近乎完全依赖以及对信息资产更高的访问性，使得面对各种威胁时产生了前所未有的网络攻击漏洞\
  \ 13。得益于网络安全工具，这些网络技术提供的利益免受这些漏洞的破坏。组织管理和保护关键网络系统及信息资产免受包括不断发展的量子计算技术在内的广泛威胁的能力是必须的。表\
  \ 29.1 显示了针对检测不同网络攻击的不同研究的对比，图 29.3 显示了使用暴力破解攻击方法解密每个算法所需的理想时间。\n\n表 29.1 针对检测不同网络攻击进行的不同研究对比\
