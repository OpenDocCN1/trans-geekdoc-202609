  \ 深度探讨量子计算 [3, 4]。\n\n## 25.2 量子计算的意义\n\n尽管本文涉及量子计算的阴暗面，但不能否定计算系统的光明面，因为这也有助于增强对阴暗面的认知。\n\
  \n量子计算无疑被认为是世界和全人类的游戏规则改变者；它无疑为其用户带来了优势和更光明的机会。其一些优势描述如下：\n\n*   量子计算 [5] 有能力扩大迄今存在的计算系统中的当前可能性。量子系统能够对大数据时代中提供的各种规模和种类的数据集进行计算、复制、检查和研究。这些系统可以在几分钟内完成此类操作，而不是花费几个世纪的时间（这在传统计算系统中通常是需要的）。\n\
  *   量子计算机还能够训练人工智能、深度学习和神经网络系统，通过高效地处理大型数据集并以更精确的方式识别其中的模式，这在量子系统中的速度也比传统系统更快。\n\
  *   许多问题的复杂性使得找到解决方案变得困难，这对于全球的研究人员和计算系统来说是一个挑战 [6, 7]。量子计算机被认为具有解决此类问题的能力，其中比特发挥了重要作用。量子计算机可以解决的问题范围包括优化和模拟问题、现实世界的财务问题、供应链物流问题、NP\
  \ 困难问题以及加密系统问题。\n*   量子计算机还可以用于图像处理，这更显著地被称为量子图像处理 [1, 8]。文中描述了两种量子图像表示系统，即：\n \
  \   1. EFRQI\n    2. ENEQR\n\n    EFRQI 是量子图像幅度表示系统，其中大小为 $2^n * 2^n$ 的量子图像的像素值通过部分取反算符存储，所有这些都以量子比特振幅的形式存储。ENEQR\
  \ [9, 10] 是一种基础图像表示系统，它通过 `CNOT` 门存储像素值。\n*   量子计算可以改变密码世界。在这方面已经开发了相关工作，针对量子数据构建私钥和公钥系统。这些系统建立了更安全且不可区分的安全系统，难以被破解，并旨在从更详细的方面保护用户数据\
  \ [2, 11]。\n*   在量子算法领域也正在进行且未来也可能的改进，这些算法可以使用通用编程技术实现，这些技术具有足够的扩展性，适用于任何规模的系统，并且其输出可以在量子系统本身上验证。\n\
  \n![图 25.3 量子计算的应用 [5, 6, 12].](images/fig25-3.jpg)\n\n**图 25.3**](#c25.xhtml#rfig25-3)\
  \ 量子计算的应用 [5, 6, 12]。\n\n为了标记现实世界场景中有效量子计算系统的应用，其中一些包含在图 25.3 中，图中显示了量子计算的应用。\n\n\
  *   问题优化\n\n    优化问题涉及从数学、计算机科学、经济学、统计学等领域的所有可用可行方案中找到最佳解决方案。\n\n    然而，根据变量的性质，优化问题可以是离散的或连续的。为了解决这些优化问题，有各种优化算法可用。量子计算中也存在优化算法，它们在许多标准上比经典和旧优化算法好得多。列举量子优化算法中的一些，它们包括量子数据拟合\
  \ [13]（处理一组数据点并构建一个数学函数来最佳拟合），其中包含了量子最小二法拟合，因为它是最常见的形式之一，最小化了拟合数学函数与数据集之间差异的平方和。\n\
  *   天气预报\n\n\n\n\n\n尽管世界上还没有任何系统可以 100% 准确地预测或预测天气 [14, 15]，但预测越接近 100% 效果越好，因为如果能及时、更准确地预知自然天气事件，它将能够减少由这些事件造成的生命和财产损失。\n\
  \n量子计算被普遍认为比经典计算方法更好的气象预报方法，因为它比经典方法更有效地管理大量频繁变化的数据，并能以更快的速度和更高的准确率给出结果。\n\n对 `qubits`\
  \ 计算能力的有效利用、量子问题优化算法在数据上的应用，以及通过量子机器学习进行的模式利用，可以帮助理解天气事件中持续且动态变化的趋势。\n\n### 机器学习与人工智能系统\
  \ [8, 9]\n\n与经典方法相比，量子计算机能以快得多解决解决问题，因为它们有能力利用物质的粒子性和波性，从而有助于探索更广泛的解决方案可能性。这一概念被称为“量子并行性”\
  \ [16, 17]。但这还不够。量子计算机此外还不受操作时数据中存在噪声的影响，并且即使在极端天气条件下也可以运行。这是人工智能和机器学习的基本要求之一。\n\
  \n量子计算机能够处理、存储、模拟和处理大量数据，并克服其中存在的错误，这对于机器学习和人工智能模型及系统本质至关重要。\n\n### 金融系统\n\n金融和银行机构每天必须处理大量的数值和理论数据，无论如何，这些数据都非常复杂。一些涉及困难数学计算的最复杂的金融程序包括信用评分、最优套利、衍生品定价等。这些程序的复杂性有时会成为用户不得不接受次优解决方案的原因，而这并不是用户所需要的，从而降低了在整体场景下的用户体验。金融领域的量子计算机可以帮助准确地模拟不断变化的市场趋势，并预测特定商品价格的变化如何导致其他资产成本的变化；执行蒙特卡洛模拟\
  \ [18, 19] 以预测未来市场，预测期权价格并评估金融模型中的风险和不确定性；在金融领域执行高度复杂的预测和预测；通过有效考虑市场波动性、客户偏好、法规和限制等因素，进行交易和投资组合优化。\n\
  \n### 用于药物设计与开发的医疗与健康系统 [7]\n\n量子计算具有加速医学领域药物发现、设计和开发的潜力，从而为该领域带来创新。药物分子 [20, 21]\
  \ 及其与其他蛋白质等的相互作用是一项很难研究的内容。该领域需要某些专门的方法来工作，而量子计算就是此类计算方法之一。量子计算适用于模拟和处理大型复杂分子，这可能对药物设计和开发产生巨大影响，因为分子本身就是基于量子物理的量子系统。因此，量子计算机能够在原子水平上更精确地研究这些系统及其相互作用，并更有效地模拟分子结构、行为和属性。\n\
  \n### 计算化学\n\n计算化学是化学的一个分支，使用计算机模拟方法为解决复杂的化学问题提供帮助。它利用存在高效计算机程序中的理论化学方法，来计算分子的结构、性质和相互作用。经典或传统的计算系统无法非常准确地计算参与化学反应的电子的量子行为；因此，在经典计算方法中模拟化学反应时需要近似。但在量子计算中，每个\
  \ `qubit` 都可以映射到特定电子的自旋轨道。`entanglement` 等量子概念在描述电子电子之间的相互作用方面非常有用，而且在基于量子计算机的计算化学中无需近似。\n\
  \n### 网络安全与加密系统\n\n随着大量数据以数字格式在线可用，其用户的隐私 [20, 21] 风险随着时间的推移而日益增加。目前所有用于加密 [22]\
  \ 数据的算法，无论今天有多安全，对于未来保护数据都将是无用武。量子计算也可以为此提供营救。它的 `superposition` 概念可以帮助利用其 `qubits`\
  \ 以更安全的格式对数据和系统加密。量子密钥分发 (QKD) [23] 方法支持“观察者效应”的概念，该效应可以创建一个不可破解的通道。在这里，一组编码为 0\
  \ 或 1 的光子通过光纤连接发送给接收者。当所有光子被收集后，就可以对其状态进行解码并访问原始消息。现在，如果攻击者尝试破解，其状态就会被改变，发送者和接收者会收到通知。信息也会被破坏变得不可读，因为改变的状态使得信息无法重构。这种方法，即\
  \ `QKD` 目前仅限制在 100 公里的距离，但根据卫星概念验证，它在未来几年内可以达到数千公里。然而，如果我们考虑量子计算机的工作（这对于理解可能产生的威胁或意识到其阴暗面至关重要），量子计算的工作原理源于量子物理，其中\
  \ `superposition`、`entanglement` [16]、`qubits` [17] 等是其主要的供给基础。\n\n### 25.2.1 量子计算机的工作\n\
  \n在量子计算机中，计算是在测量之前根据对象状态的概率进行的，与超级计算机相比，它可以指数级地处理大量数据。经典计算机使用物理状态的位置来执行基于二进制位的逻辑操作，而量子计算机考虑对象的量子态来构成\
  \ `qubit`。这些状态通常是物体在检测到之前未定义的属性，例如光子的偏振。\n\n根据量子力学，每个光子在屏幕上被检测到之前都处于“叠加”态。在叠加态坍缩之前，它同时在所有可能的路径上旅行，并在观测下显现出屏幕上的单个点。\n\
  \n\n\n\n\n考虑计算机解决老鼠在迷宫中穿行的例子。为了解决这个问题，经典计算机会尝试每条可能的路径，直到找到解决方案。另一方面，量子计算机通过同时考虑所有可能的路线来解决这个问题。它们将二进制位替换为\
  \ `qubits`。在这里，叠加态将包含所有可能的路径，然后我们就可以通过坍缩该状态来揭示通终点的最可能路径。就像我们可以通过增加更多晶体管来提高经典计算机的功能和能力\
  \ 24 一样，我们也可以增加更多的 `qubits` 来创建和改进量子计算机。\n\n利用纠缠属性，科学家可以将多个 `qubits` 推入相同的状态，即使它们之间没有相互连接。当\
  \ `qubits` 处于两个状态的叠加态时，随着我们纠缠更多 `qubits`，这种数量呈指数级增长。因此，一个 2 量比特系统存储 4 种可能的值，而一个\
  \ 20 量比特系统存储的值超过百万个。\n\n在当前，专家们正在寻找方法让量子计算机的工作得比经典计算机更好。这个问题仍然非常具有挑战性，因为量子态非常脆弱。很难阻止\
  \ `qubits` 与外部环境发生相互作用。如果系统中存在任何噪声，就会导致所谓的“退相干”状态，这意味着叠加态崩溃，计算机倾向于丢失信息。如果量子计算中存在少量错误，这是自然的，因为在这里我们处理的是概率而不是二进制规则。但退相干产生的噪声太大，会导致结果变得不明确。当一个量子比特进入退相干态时，纠缠会导致整个系统的崩溃。\n\
  \n为了解决这个问题，我们使用错误纠正。其中一种方法是构建一个具有少量逻辑量子比特和一些纠正错误的标准量子比特的量子计算机。如果发生如位翻转之类的错误，量子比特会变为错误的状态。\n\
  \n该系统的运行大约需要 100 个逻辑量子比特和大量的错误纠正量子比特。但这可以产生一台可靠且实用的量子计算机 24。\n\n## 25.3 量子计算的阴暗面\n\
  \n量子计算机被认为是技术的未来。量子计算机通过自身开启的所有可能性以及它们相对于经典系统所提供的优势，正成为每个人等待这些计算系统能够应用于正常生活的理由；简单来说，科技界正正渴望在技术进步的贪婪中，将日常计算和其他技术要求的全部负担交给量子计算，并处在科学发现的顶端以创造历史。\n\
  \n这些计算机利用量子力学属性，因此它们能够比经典计算机更快地执行解决过程（此外还有许多优势）。但就像过去的每一项新发现或技术进步一样，这个系统也有许多与之相关的阴暗面，如果处理不当，可能会对人类生活造成巨大破坏。就像任何其他系统一样，量子计算机也需要以平衡的方法进行治理和使用，因为任何向负面方面的微小倾斜都会导致失衡和混乱。这些操作有时会影响使用\
  \ `RSA` 算法的数据保护 19。\n\n看着量子计算的阴暗和负面方面，以下是几个具体的要点：\n\n### 缺乏安全的敏感数据\n\n由于敏感信息是开放的，攻击者变得很容易通过量子计算机非法访问这些数据并对其进行破解。量子系统让怀有恶意意图的人更容易破解密码代码，而且只需几秒钟甚至更短。即使是今天最安全的系统，在量子计算面前也将面临风险。如果犯罪分子或恐怖分子获得了能源工厂、水供应和水资源管理、航空和铁路交通控制、受保护的军事或执法信息等关键设施的访问权限，不当利用量子计算所造成的破坏可能是最具毁灭性的。这将对整个国家及其经济构成生命威胁。正如埃因霍芬理工大学的密码学教授\
  \ Tanja Lange 所说，“今天所有的秘密将失去。”\n\n### 对金融系统的影响\n\n如今钱不再仅仅是纸或硬币。由于钱现在是数字资产，被大多数银行用于在线交易，量子技术可能被网络犯罪分子用于攻击财务，打击网上银行和交易。此外，未经授权的访问可能会干扰银行的运行和功能。由于重要的用户资金已经面临被盗窃和不当使用的风险，量子计算可能会让黑客执行这一过程变得更容易。\n\
  \n### 政府透明度降低\n\n由于量子技术，政府可以保护通信。这可能会防止对公众透明，从而在政府内部产生腐败的可能性。\n\n### 政府失去对犯罪公司的控制\n\
  \n如果安全的量子通信落入犯罪分子手中，法律和军事执法机构用于国家安全目的现有安全工具和算法可能会被滥用。量子通信服务可能在立法之前出现，限制官员的监测能力 20。\n\
  \n### 富裕国家与贫穷国家之间权力差距的扩大\n\n由于量子技术的进步既是全球安全系统的机会，也是威胁，大多数经济发达国家将尝试从有利于自己的角度来利用这项技术，并建立基于量子的系统以减少使用相同技术导致安全泄露的风险。但在实践中，这在发达国家的可行实施需要很长时间，因为这里有很多因素在起作用，例如现有计算机系统和数字基础设施升级的速度、人力、所需的时间以及可用的金融服务。但在这场技术进步的竞争中，发展中国家（特别是政局极不稳定的国家）在在其系统中采用这种先进技术并将其安全性提升到新水平方面可能会落后。\n\
  \n### 政府对公民生活的过度控制\n\n当少数政府机构相对于其他机构过度访问量子工具时，这会导致这些机构获得过多的政治控制和权重，从而导致政府内部的不平衡。这些政府机构还极有可能利用量子技术提供的大规模数据处理能力和几乎完全的实时解密能力来扩张权力。这将导致他们深入公民本希望政府不要干涉的私人生活。\n\
  \n相比之下，如果公民拥有 100% 访问安全通信系统的权限，这将导致个人自由的大幅提升以及个人避免政府控制的能力，阻碍许多政府深入干预公民私生活的倾向。\n\n\
  ### 揭露旧秘密\n\n\n\n\n\n量子计算非常强大，足以轻松破解现有的数据加密和安全方法。这预示着旧的且受信任的秘密，以及军事和执法机构的安全和机密信息极有可能被破解和泄露。这些机密数据也可能被拥有先进量子工具的罪犯、恐怖分子和其他政府滥用。\n\
  \n这一切都可能导致任何国家出现极端的政治动荡和不稳定、政府与公民之间的信任危机、恐怖攻击的脆弱性等问题。有些人甚至将量子计算描述为数字世界的原子弹 [11]。\n\
  \n### 扩大大型科技巨头的实力\n\n全球许多知名的大型科技公司、研究机构和大学都在尝试开发量子技术。尽管大学的研究是公开的，但大型科技公司比普通公众更早地接触这些信息，因为这些公司在这些研究领域投入了巨额资金。但存在这样可能：这些科技公司可能会试图操纵此类研究的流向，并使其有利于它们的目标，而不是让其保持原始状态。\n\
  \n这些科技巨头可能会尝试通过与政府合作，提供访问该技术的权限，反过来获得政治收益和优势，从而为自己从这项技术中获取最大的利益。这还可能被他们用来以不道德的方式增强其市场价值和地位，并让一切都对他们有利。\n\
  \n## 25.4 前期工作\n\n本节简要讨论了 2010 年以来通过一些期刊和会议关于该主题的相关工作。一些期刊包括 IEEE、《Quantum Science\
  \ and Technology》等。\n\n* Byung-Soo Choi 和 Rodney Van Meter 描述了一种 2D 量子架构，这基本上是一个带有详细复杂性和量子比特的加法结构。作者们能够证明，如果输入寄存器的长度大于\
  \ 58，则所描述的架构比 1D 量子架构更快。这些作者声称，根据性能来看，这是一个稳定的架构 [24]。\n\n* C. Monroe [7 提出了一种名为\
  \ `MUSIQC` 的模型。它基本上是一种用于量子计算机的分层分子离子陷阱架构。在这里，处理器可以拥有超过 10⁶ 个量子比特，具有两种属性，即稳定的量子比特和可扩展的光子互连。还引入了模块化的\
  \ `ELU`，使得计算变得快速。它基本上是一个带有 N 个被捕获原子离子和激光源的单晶，影响着量子门 [22]。\n\n* E. M. Ameen [8 提出了一种带有协量子处理器的经典计算机混合架构。他们的目标是通过通过经典计算机和量子计算机的结合来增强性能。经典处理器协助常规程序和网络通信，而协量子处理器则处理复杂的算法和计算。这种架构可以处理任何经典计算或量子计算\
  \ [23]。\n\n* Maissam Barkeshli 描述了一种用于拓扑量子计算机的物理架构。虽然在一般情况下，量子比特在环境中是柔软且脆弱的，但拓扑量子比特具有很高的稳定性和抗性。这导致了容错能力并提升了量子计算机的功能\
  \ [21, 24]。\n\n最后，为了制造量子计算机，仍然面临许多需要深入研究工作的挑战，例如：\n\n* 更多的量子比特系统：64, 128, 192, 256。\n\
  * 更强的连接性\n* 极低的错误率\n* 极低的成本\n\n## 25.5 结论\n\n在本文中，我们讨论了量子计算的阴暗面。与经典计算机相比，量子计算机可以通过更快、更高效地解决问题来彻底改变计算。尽管该领域仍有开发空间，但这可能是技术的未来。量子计算机优于经典计算机，因为它们在更短的时间内运行大约是超级计算机快\
  \ 158 倍。但这些设备也可以被用于破坏目的。在本文，我们首先讨论了量子计算的介绍和意义。然后讨论了这些计算机的工作原理。接着我们关注了量子计算的阴暗面或缺点，随后是该领域之前进行的一些工作。最后，我们用结语结束了论文。\n\
