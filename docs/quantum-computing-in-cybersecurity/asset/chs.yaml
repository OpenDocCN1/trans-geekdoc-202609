  \ 2.88。[图 2.4] 展示了这一点。\n\n![图 2.4 系统安全性](img/fig2-4.jpg)\n\n[图 2.4] 系统安全性。\n\n##\
  \ 2.8 结论\n\n在之前的设计中，中心层具有基于组织枢纽的程序，能够精确地管理组织。在将基础层的终端设备的信息发送到云端之前，注册会处理所有可能的错误和不确定项，以减少云端的负载。医疗子系统分区负责在受限区域监测患者信息。佩戴智能设备的患者可以发送关于其区域的各种数据片段。系统使用了\
  \ `QKD` 的 `BB84` 加密程序。该建议采用了一种更好的加密方法，该方法同时也作为身份标识。受限区域的医疗服务框架可以通过该智能设备获取患者记录。雾枢纽监控并控制患者的健康信息。假设患者需要帮助，该框架可以根据患者的临床史提供患者信息和方案。急诊诊必须通过将患者的临床\
  \ ID 放在服务器上来验证信息。雾枢纽有一个智能的安全医疗保健控制算法。雾枢纽执行了一些重要进展；例如，它在将信息存储到云服务器之前，对其进行编码、预处理，并转换为有助于临床人员的实性数据。\n\
  \n该建议使用设备标识和 Merkle 树算法生成私钥。该标识被用作 Merkle 树算法的参数来派生私钥。使用 Merkle 树算法，每次都会生成一个新的私钥。这被用于\
  \ `QKD` 的 `BB84` 算法以生成加密密钥。该方法提高了安全性，因为接收者可以检查设备的身份验证并对其进行评估。\n\n\n\n\n3. N. Ambika,\
