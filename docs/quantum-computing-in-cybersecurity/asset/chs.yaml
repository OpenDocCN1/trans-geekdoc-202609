  ## 28.2 防中的量子技术 (QTech) [19–21]\n\n军事技术的标准比商业或公共用途的标准更为严格。考虑到在战场上部署的潜力，这需要额外的关注。它提供了一系列具有不同\
  \ `TRLs`，[8, 11]、时间预测和实施风险的潜在军事应用。对于可以快速集成到现有技术中的技术（例如量子传感器，我们只需将传统传感器更换为量子传感器），其实施将更加容易且危险更小。\n\
  \n另一方面，`QKD` 是一项已经商业化但难以实施的技术示例。它迫切需要新的硬件、系统以及与现有通信系统的兼容性[9, 11]。因此，在军事中使用该技术相关的风险更大。从长远来看，我们可以预见到在减少\
  \ `SWaP`（尺寸、重量和功率）以及扩大量子计算机和量子网络规模方面的收益。结果是部署将变得更加简单，而且如果国家或军队想要 11 与拥有边缘（量子）技术的其他国家或军队竞争，这很可能是必须的。\n\
  \n### 28.2.1 量子战略 [22, 23]\n\n未来的用户需要考虑在何处以及如何投入他们的资源。军事技术的目标限于其获取[22, 23]以及量子技术的发展[10]。\n\
  \n尽管他们是最终消费者，但他们可以对开发做出巨大贡献。拥有由军事力量组成的量子生态系统是更优的。国家计划和支持[10]是必要的。\n\n研发过程应该与颠覆性想法解耦。企业界与学术界之间存在大量的合作。\n\
  \n第一阶段是识别最有利的量子技术。路线图或战略可以分为三个部分：识别、开发和实施。\n\n为了能够快速响应新发现和颠覆性想法，这一识别过程应该循环进行。记住仍有许多潜在用途至关重要。\n\
  \n下一步[10, 11]涉及对与技术相关的潜在风险进行技术和科学审查。达到完全作战能力是最后一步，这涉及改变军事条令、战略和战术，以充分利用量子优势[11]。\n\
  \n识别阶段是最后一个观察的主题。在这种情况下，决策者必须采取长期观点。到为止，传感器、`QKD`、量子计算[11, 12]以及其他量子技术都分别考虑过。然而，长期计划考虑了量子系统如何相互作用。\n\
  \n### 28.2.2 QTech 军事应用 [24, 25]\n\n人类活动的许多方面可能受到量子巨大影响。国防工业就是一个很好的例子。现代战争的所有领域都可能受到量子技术的影响。第二次量子革命不是生产新种武器，而是提高敏感性和效率，引入新能力并增强现代军事战略。下文概述了在现代战斗的各个方面，军事、安全、空间和情报的潜在\
  \ `QTech` 用途[13]。\n\n\n\n\n将量子技术（QTech）集成到军事平台更具挑战性。除了量子计算机（主要部署在类似于民用数据中心的地方）外，量子传感\
  \ [\\[14\\]](#c28.xhtml#ref14)、成像和网络的集成与部署由于军事用途的高要求（与民用/工业或科学需求相比）面临着许多困难。\n\n\
  对于军事对精确导航的需求，当前时代量子惯性传感器的快速测量率往往是一个很大的限制。例子还有更多，而且以后可能会更多。\n\n## 28.3 QKD 模型\n\n\
  Charles H. Bennett 和 Gilles Brassard 在 1984 年于 IBM 实验室作为物理和信息研究的一部分，提出了 `Qcryp`（量子加密）的概念\
  \ \\[23–25\\]。这是已知的最早的量子分发系统。光子的偏振编码了传统比特的值，单粒子或光子的分发形成了量子系统的基础。光子是光中的基本能量单位，携带特定数量的能量\
  \ [\\[8\\]](#c28.xhtml#ref8)。光可以根据物理定律发生偏振；偏振是在考虑光作为电磁波时出现的一种物理属性。可以使用方解石晶根据光子在任何选择角度的方向来测量光子的偏振。实际上，光子偏振定律和海森堡不确定原理是量子物理中两个关键方面，对于\
  \ `Qcryp` 至关重要 \\[8, 15\\]。\n\n海森堡不确定原理认为，无法通过分布系统来测量其量子态。这意味着光子或光粒的偏振只能在测量时确定。这一观点对于阻止基于量子加密加密方案中的窃听尝试至关重要\
  \ \\[8, 15\\]。\n\n另一方面，光子偏振原理描述了光光子如何在特定方向上偏振。此外，由于 1982 年最初提出的不可克隆定理，未知的量子态或未知量子比特无法被窃听者复制\
  \ [\\[7\\]](#c28.xhtml#ref7)\\]。无需面对面接触，两个通信参与者仍然可以就一个比特串达成一致，并非常有信心的它只会由他们通信。这是通过量子加密实现的。\n\
  \n使用偏振光子，`BB84` 使双方（通常是“爱丽丝”和“鲍姆”）能够开发一个匿名共享密钥序列。这些光子每个处于以下符号所示的四种状态之一 [\\[8\\]](#c28.xhtml#ref8)\\\
