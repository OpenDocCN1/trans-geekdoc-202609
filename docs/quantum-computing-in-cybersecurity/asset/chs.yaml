  ### D. 离散对数问题 (DLP)\n\n基于 `DLP` 的算法有两种，即 Diffie Hellman 和椭圆曲线加密。`Diffie–Hellman\
  \ (DH)` 是一种非对称加密，密钥大小约为 2048 位且较大；用于在公网上安全地传输密钥。另一种算法是名为 `ECC` 的椭圆曲线加密。尽管 `RSA`\
  \ 算法非常强大，但新兴的高性能计算也会使其变得脆弱，密钥可能被破解 [\\[12\\]](#c22.xhtml#ref12)。\n\n### E. 数字签名\n\
  \n1991 年 8 月，`数字签名`由美国国家标准技术研究院 (NIST) 提出 [\\[14\\]](#c22.xhtml#ref14)。\n\n## 22.3\
  \ 传统计算与量子计算的对比\n\n1982 年，物理学家理查德·费曼（Richard Feynman）通过质疑计算机是否可以利用叠加态提出了量子计算机的概念。与使用布尔代数并具有离散状态（`Logic\
  \ 0` 或 `Logic 1`）的当代经典计算相比，量子力学讨论的是状态的微观行为。\n\n\n\n\n\n量子计算及其独特特性（如量子并行计算、叠加和纠缠）在科学和工程领域发挥着重要作用。将经典机器学习技术转换为量子计算方面，各界已付出了许多努力。结果，在开发前量子优越硬件的过程中，主要发现在中等规模量子（NISQ）[\\\
  [20\\]](#c22.xhtml#ref20) 期间的使用和可用性组件方面存在巨大差距。这通过比较量子计算机器学习（ML）算法的有效性、先进性和有效来完成。酉变换输入输出门的线性特征可用于描述量子计算（QC）的效率。人员研究并发现，监督量子学习技术提升了\
  \ `QNN` 的效率。早些关于 `QNN` 的工作在量子并行交换方面的探索并不多。量子神经网络是监督量子算法（`QNN`）最优秀的实例之一。Narayanan\
  \ 和 Menneer [\\[21\\]](#c22.xhtml#ref21) 详细阐述了该领域的理论部分和架构，并在此基础上，利用经典组件进行组件压缩。人工神经网络（`ANNs`）使用一系列非线性操作构建，这些操作随后应用于神经元，从而产生层和序列。由于量子力学的线性本质，激活非线性函数有时可能会困难。Cao\
  \ *et al.* [\\[22\\]](#c22.xhtml#ref22) 将量子中子概念作为 `QNN` 的构建模块提出。量子电路对神经元的阈值激活有影响；后续响应通过调整\
  \ `ANN` 设置来重建。为了提出一个模型，使用了继承的量子特性，例如反映叠加的输入、经典网络布局、强化学习以及监督和无监督网络。在 [\\[23\\]](#c22.xhtml#ref23)\
  \ 中，讨论了量子计算的最大经典方法及其在计算工程中的应用。图 22.3 说明了应用工程中最重要的应用之一是将机器学习方法与量子计算相结合。让我们以一个电子为例，它有\
  \ 0.5% 的概率处于自旋向下或自旋向上状态。此外，当自旋向上和自旋向下测量结合时，50% 的时间发生在这两种场景中。因此，当许多状态和概率合并时，就会观测到量子态。在量子计算机中使用这种概率操作的好处是，它可以利用量子力学原理以廉价的方式操作\
  \ [\\[24\\]](#c22.xhtml#ref24)。在图 22.2 中，首先准备电路，然后是状态。最后一步是确定电路。经典数据被输入量子态以准备状态。对于电路的准备，使用了酉算子\
  \ `U`。最后阶段是测量，通过完成多次测量后某个类别与其连接的概率进行评估。电路使用 `Qi skit` 模拟器设置 [\\[25\\]](#c22.xhtml#ref25)。图\
  \ 22.2 显示了用于 2 个比特和 4 维输入向量的状态准备电路。\n\n### C. 网络安全\n\n量子加密在不同层级被应用 [\\[14\\]](#c22.xhtml#ref14)。虽然它与网络相似，但网络安全使用了量子加密\
  \ [\\[26\\]](#c22.xhtml#ref26)。然而，开始转向获取这些技能是重要的，因为对于目前的标准来说，安全 [\\[27\\]](#c22.xhtml#ref27)\
  \ 是不可能的。\n\n图 22.2 显示了用于 2 个比特和 4 维输入向量的状态准备电路。\n\n```\n图 22.2: 首先准备电路，然后是状态。2 个比特和\
  \ 4 维输入向量的状态准备\n```\n\n图 22.3 说明了应用工程中最重要的应用之一是将机器学习方法与量子计算相结合。\n\n量子力学与引力之间的相互作用是不可避免的，宇宙中最迷人的物体是黑洞。当量子系统\
  \ [\\[15\\]](#c22.xhtml#ref15) 被视为黑洞时，有人认为视界处没有奇点。因此，观测者的落体态将遇到高能量 [\\[28\\]](#c22.xhtml#ref28)。黑洞态矢量描述的带有非连续谜样的光滑视界是计算机和计算工程的应用\
  \ [\\[29\\]](#c22.xhtml#ref29)。\n\n### E. 退相中的量子计算\n\n经典计算机解决问题需要更多时间，而量子计算机可以在更短的时间内指数级地解决问题。目前，我们尚未处于量子计算的阶段，但一旦实现，它将涵盖所有的科学领域。退相干是量子信息领域最大的冲突之一，当系统与环境耦合时就会产生。因此，量子效应\
  \ [\\[30\\]](#c22.xhtml#ref30) 被耗散破坏。其他效应也是如此，耗散在没有涉及其他动态的情况下完成了通用量子计算。同样，耗散也适用于工程师的其他领域，例如矩阵乘积态，以稳定代码并高维泛化。\n\
  \n## 22.4 后量子加密 (PQC)\n\n常用的加密算法 `RSA`、`Diffie Hellman` 和椭圆曲线密码（`ECC`）都可以使用量子计算破解。这些程序安全措施保护了所有组织间的通信以及政府的敏感数据、公司的知识产权和个人隐私\
  \ [\\[31\\]](#c22.xhtml#ref31)。开发一种免疫量子计算的加密方法的竞争具有紧迫性。由于替换目前的 Web 标准需要十年以上时间，因此必须尽快开始获取这些技能。\n\
  \n\n\n\n\n从战略角度来看，能够开发后量子加密的国家在保护其关的军事通信和基础设施以及开发破解对手防御的能力方面，将比竞争对手具有优势。\n\n研究人员正在创建加密算法，根据美国国家标准与技术研究院（`NIST`）的规则\
  \ [32] 和竞争结果，以阻止常规计算机和量子计算机的大多数攻击。以下是某些后量子加密（PQC）类型的列表：\n\n1. `Code-based Cryptography`（基于码的加密）包括所有的加密系统\
  \ [23–25]，对称或异步，其安全性部分或完全取决于线性纠错码中解码的刚性，该码可能具有某些特定的结构或属于特定族（例如，准循环码或 Goppa 码）[33,\
  \ 34]。\n\n2. `Hash-based Digital Signatures`（基于哈希的数字签名）[35] 使用加密哈希函数。\n\n3. `Isogeny-Based\
  \ Cryptography`（基于同源的加密）[36] 基于寻找两个给定的超奇异椭曲线 `E` 和 `(E)` 之间同源的困难问题。基于超奇异椭曲线之间同源的加密是后量子加密非常有前景的候选。NIST\
  \ 正在积极进行竞争，寻找安全的后量子加密算法。最近，在 NIST 竞争的第二轮中，有一种名为 `Supersingular Isogeny Key Encapsulation`（超奇异同源密钥封装）的算法。\n\
  \n4. `Lattice-based cryptography`（基于格的加密）[37] 是涉及格的加密原语构造的通用术语，无论是构造本身还是安全性证明。基于格的构造目前是后量子加密的重要组成部分。\n\
  \n5. `Multivariate polynomial cryptography`（多元多项式加密）[38] `Multivariate cryptography`（多元变量加密）是基于有限域多元多项式的非对称加密原语的通用术语。在某些情况下，这些多项式可以定义在基域和扩展域上。如果多项式的次数为二次，我们称之为多元二次型。由于求解多元多项式问题是一个\
  \ NP 问题，因此它最适用于数字签名实现，其中 `NP` 是计算复杂性理论中用于分类决策问题的复杂度类。\n\n## 22.5 量子加密及其应用\n\nStephen\
  \ Wiesner（斯蒂芬·维斯纳）在 1970 年最初建议，Bennett（贝内特）在 1984 年继续研究这一概念 [39]。量子密钥是量子加密的最佳说明之一。因此，量子加密基于量子物理学原理，并使用电子和光子等极轻粒子来完成各种加密操作。由于大多数加密结果提供的保证由于计算限制而在经典加密中是无效的，量子加密是成功的，并且它可以破坏\
  \ `RSA` 和 `ElGamal` 算法的安全性。维护数据安全极具挑战性，而且我们用来保护数据的方法并不可靠，这使得在社交媒体频道上保持顶级组织的安全信息私密是不可能的\
  \ [40]。\n\n物理基础包括光子、比特、纠缠和叠加被用于量子加密 [41]。\n\n### A. 光子\n\n根据量子理论 [42]，光子是光波的不同组成部分。量子电磁场携带能量、动量和角动量，而光子粒质量很小。纠缠光子对是粒子相互作用的结果\
  \ [43]。尽管每对有两个光子，但这些配对在偏振上是连接的。纠缠影响测量的不可预测性。特定光子通过滤波器的能力是随机决定的。然而，偏振过滤器允许击中滤波的光子在测量时通过。如果使用与第一个过滤器垂直的过滤器测量持有第一束光伴侣的第二束光，并允许第一个光子通过，那么。如果我们使用与第一个过滤器成\
  \ 90 度的过滤器测量持有第一束光伴侣的第二束光，那么如果第一个光子通过该过滤器，它的伴侣也将通过该过滤器。与第一个过滤器类似，如果第一个过滤器无法通过，第二个过滤器将不会发送任何光子。\n\
  \n### B. 海森堡不确定原理\n\n根据薛定谔的，如果在经典物理中看到电子波，则可能预测电子未来的电荷。随后，Max Born（马克斯·玻恩）进行实验证明，仅仅在薛定谔方程中发现某些特定位置可能存在电荷，但它不能反映电荷的行为。在完成两项测试后，海森堡表示，如果记录了作用于粒子的所有力的动量和当前位置，就可以计算密度。然而，不确定原理并不遵循这一点；它只考虑每次运动的可能结果。根据海森堡不确定原理，在不在改变另外两个属性的情况下测量一个属性。由于将光子分成两半会改变测量值，我们无法根据标准将光子分成两部分。如果异常尝试检查光子在从发送者到接收者的过程中如何变化，光子的状态将很快改变，从而揭示入侵者或敌对者的存在\
  \ [44]。量子加密的基础海森堡不确定原理指出，在探测光子的偏振后，测量方向决定了所有后续测量。用于消息加密和解密的量子密钥分配确保了通信的安全，并允许双方生成随机比特流。如果第三方试图获取任何信息，如果第三方干预并试图获取量子加密的关键、至关且唯一的已知特征，它将被检测到并提供安全的通信\
  \ [45]。\n\n### C. 量子比特 Qubit\n\n量子计算机的基础部分之一 [46]。存储在计算机上的任何信息都是使用位（bits）存储的。位一次只能存储一个位，值为\
  \ `0` 和 `1`。当这些值存储在电容器中时，它们保持带电或不带电。在典型系统中，位存在电容器中，而值存储在被称为 `qubits` 的量子粒子中。在这方面，量子比特类似于位。不同的现象，如光子偏振或原子自旋可以用来表示量子比特\
  \ [47]。在量子计算中，信息始终由两个状态之一表示。量子比特被引导为两个独立的自旋，`0` 的自旋方向向上，`1` 的自旋方向向下。从同一个 `Qubit`\
  \ 上叠加和纠缠的角度来看，这种区分是必须的，以确保数据被正确固定。当光子在室温下从低能状态跳到高能级并反之时，会检查其稳定性 [48]。当房间温度较低时，这些光子是稳定的并向下自旋。如果需要对上自旋或低自旋进行修改，则需要外部能量\
  \ [49]。\n\n\n\n\n\n### D. 量子比特表示\n\n量子态在有限维复向量空间（也称为希尔伯特空间）中表示。`T` 的共轭转置是两个态的标量积，具有物理意义\
  \ [[50]](#c22.xhtml#ref50)。量子比特（Qubit）是量子比特的对应物，源自量子比特。量子比特是二维希尔伯特空间的一个分量，具有 `|0)`\
  \ 和 `|1)` 两个态的正交基，使其成为希尔伯特空间的一部分。基态的相干叠加可以存在于量子态中 [[51]](#c22.xhtml#ref51)。\n\n\
  ### E. 纠缠\n\n这两个粒子正受到外力的影响，并且由于它们在量子物理学作用下相互纠缠，因此它们处于量子态中。每个粒子的内部磁矩，或量子态中自旋的所有位置，都被系统收集。与概率不同，系统的总自旋只能等于确定的离散值。对量子系统总自旋的测量决定了某些粒子自旋的位置。在这种系统中，当一个粒子的自旋方向由于某种原因发生变化时，另一个粒子的自旋方向会不可避免地瞬间发生变化。当粒子的矢量态和自旋方向不断变化时，它们在量子态中是如何通信的？从实践和概念上来说，爱因斯坦关于存在许多隐藏参数导致这种现象的假设可能会被反驳。当科学家阅读纠缠的概念时，他们可能有一种加速计算的方法。目前，计算机系统的速度受限于导线中移动电子的速度，即光速\
  \ [[52]](#c22.xhtml#ref52)。\n\n### F. 叠加\n\n一个系统可以同时处于两个或两个以上的状态，这被称为叠加。粒子具有波的特性，因此不同方式产生的波可以相互叠加。这就是为什么孤立粒子可以以两种不同的方式移动的原因。这些粒子中的干涉以这种方式起作用，使得在不知道其属性的情况下，分析这些波变得更加困难\
  \ [[53]](#c22.xhtml#ref53)。\n\n### G. 态的叠加\n\n量子计算（QC）使用的基本组件是量子比特，电子和质子是物理实体，其数学表示为二维希尔伯特空间中的向量。复数\
  \ [42–44] 在 Nielsen 和 Chuang 的量子比特通用形式和任意基中被限制为等于 1 [[45]](#c22.xhtml#ref45), [46]](#c22.xhtml#ref46)]。因此，态的叠加以及如果值发生变化，可以通过无限种方式进行安排，如\
  \ 图 22.4 所示，代表了经典比特 (0, 1) 的标准对应物由 `| ↓ |` 组合量子比特错误率 (QBER) [47–49] 表示。它是每个脉冲中检测到检测的概率与总检测概率的比值。图\
  \ 22.4 显示了各种对称算法的比较。\n\n在像互联网这样的不安全网络中，公钥基础设施 [`PKI`] [[54]](#c22.xhtml#ref54) 使用户能够以安全的方式发送和接收敏感数据。PKI\
  \ 本质上使用两个密钥：公钥和私钥，公钥是一个公开的密钥，用户（Bob）将使用接收者（Alice）的公钥来加密数据，数据将由 Alice 通过她的私钥在目标端解密，如\
  \ 图 22.1 所示 [[55]](#c22.xhtml#ref55)]。\n\n换句话说，仅获取公钥无法让攻击者解密信息，因为需要私钥。由于传统计算机缺乏处理能力，目前无法通过公密钥提取密文。在不安全网络中，各种对称算法的比较如\
  \ 图 22.4 所示。\n\n![图 22.4 各种对称算法](img/fig22-4)\n\n图 22.4 各种对称算法的比较 [3, 5, 50, 51]。\n\
  \n然而，由于其强大的计算速度，量子计算机可以实现这一目标 [56]。量子密钥分发（或 QKD）是此类问题的答案 [57, 58]。QKD 可以结合传统通信方法使用，其唯一目标是为发送者和接收者产生密钥。BB84\
  \ 系统由 Charles Bennett 和 Gilles Brassard 在 1984 年创建。\n\n这种量子加密协议之所以不可破解，因为它基于不可克隆定理，该定理认为无法产生任何未知量子态的精确副本。这确保了在发生中间人\
  \ [`MitM`] 攻击时，接收者收到的量子态将不同。如果发生这种情况，解密将失败，从而提醒发送和接收者通道是不安全的。图 22.5 显示了通道的比较。\n\n\
  ![图 22.5 通道的比较](img/fig22-5)\n\n图 22.5 通道比较 [62, 63]。\n\n## 22.6 企业在量子计算领域的竞争\n\n\
  除了 Google 之外，微软是另一家在量子计算领域进行雄心研究的公司。Azure Quantum 是微软的一项服务，将其此前发布的量子编程工具与其云服务相结合。可以在模拟量子硬件、来自\
  \ Honeywell 等公司的真实量子硬件以及来自 IonQ 或 QCI 等初创公司的硬件上运行量子代码。微软 Azure Quantum 旨在提供各种量子计算能力的云服务。该文档的电子版可以在此处获取：https://ssrn.com/abstract=3565438。它还为开发者提供了开源量子开发工具包\
  \ [59]。\n\n\n\n\n\n# 量子计算对关键基础设施的威胁\n\n暴力破解一直被认为是破解密码和进行密码分析的有效技术之一。典型的暴力破解算法尝试所有可能的组合，以找出正确的组合来攻破系统或软件。然而，暴力破解是黑客攻击中最慢的方法之一，因为传统的处理器或集群计算技术无法加速这些操作。而，现在由于量子处理器的出现，在破解关键信息系统时，暴力破解可能成为最有效的方法之一。以下是量子计算对关键基础设施和通信通道可能引入的一些未来威胁。\n\
  \n## 1. 现有安全通信通道的破译\n如果黑客能够访问每秒处理 1000 万比特的量子处理引擎，那么破解军事或金融机构用于传输关键数据的安全端到端数据加密通道将变得非常。目前的加密机制之所以被称为安全的，是基于破解它所需的时间。目前使用的常用算法包括\
  \ `RSA` 和 `AES` 算法，这些算法声称，如果使用 `brute-force` 技术破解相同的密钥，使用传统的超级计算机需要数年才能破解。然而，使用具有量子能力的系统，可以在几秒钟内破解。因此，如果入侵者能够对安全信道实施“中间人”攻击，他就可以嗅探并收集数据并同时进行解密，导致数据机密性泄露。\n\
  \n## 2. 使用量子密码分析解密驱动器\n许多公司将数据存档在海外数据场所，其安全性通过“静态数据”（data-at-rest）加密算法维护。如果使用量子能力来解密存储在海外服务器上的包含信息的加密数据，将成为一项简单的任务。\n\
  \n## 3. 基于 AI 目标检测的自主无人爆炸物\n实时轨迹识别和目标跟踪机制：随着 AI 的进化及其识别实时轨迹、目标检测和识别的能力，很有可能开发出无人炸弹，它们可以轻松绕过大多数现有安全机制，如\
  \ `RADAR/SONAR` 传感器、运动检测器、热传感器等。\n\n### 4. 拒绝服务攻击\n这可以通过两种不同的方式进行：在 `QC` 中添加额外的噪声，或通过调整量子加密硬件。量子通道使用的光纤通道，入侵者或黑客可以轻易切断线路。通过分接线路，可以使光纤通道变得不可用。用于生成随机数光子的随机数生成器对于\
  \ `QC` 组件本身是不安全的。另一种执行 `DOS` 攻击的方法是向系统添加额外的噪声。因为当 `Eve` 向系统引入额外的声音时，很难分析噪声和黑客，但\
  \ `Alice` 和 `Bob` 丢弃了大量光子。如果噪声在系统中持续存在，`Alice` 和 `Bob` 会增加阈值，那么窃听尝试可能会增加。\n\n##\
  \ 5. 中间人攻击\nMitM 攻击也可以通过两种不同的方式进行：由于量子力学的定律，传统攻击无法在 `QC` 系统上运行。使用传统方法，黑客会对传输的消息进行篡改，并传输重复的消息作为代替。`QC`\
  \ 系统的本质不允许传统攻击，但非传统攻击是可能的。在第一步中，`Eve` 通过成为 `Bob` 的“Alice”和 `Alice` 的“Bob”进入系统。同时，`Eve`\
  \ 为 `Alice` 和 `Bob` 执行 `QC`，获取两个密钥，一个给 `Alice`，另一个给 `Bob`。使用 `Alice` 的密钥进行解密，使用\
  \ `Bob` 的密钥进行加密，反之亦然。这种攻击是存在的，但可以通过应用身份验证来防止。第二类是传输光子；单光子实现在系统和现实世界中相当困难。大多数 `QC`\
  \ 系统使用的小脉冲相干光，在不被脉冲追踪的情况下，`Eve` 可能会分裂单个质子。无论 `Eve` 取回多少个粒子，都可以进行观测，直到 `Alice` 和\
  \ `Bob` 宣布基。`QC` 系统仍然被认为是一个安全系统，因为攻击它需要大量的技术知识。这就是为什么瑞士使用该系统进行公共投票选举的安全。\n\n###\
  \ 6. 联合攻击\n这是一攻击类型，攻击者并不相信与所有信号交互，而是所有信号与一个单一量子系统交互。信号系统与其辅助比特（ancilla）耦合，并幺式地演化组合信号和辅助比特。双方之间的任何讨论都会被攻击者听到，在联合攻击中，之后仅对辅助比特进行测量。\n\
  \n## 7. 个体攻击\n在这种攻击中，一个个体演化，他尝试通过通信通道来感知数据。这可以被双方分析，因为它类似于中间人攻击，并提供了 25% 的错误率。\n\
  \n## 8. 计时攻击\n在这种攻击中，位从通信通道传输，与其相关的构成了计时信息；每当这些信息传输时，攻击者就有了想法，他们可以轻松获取信息并利用它。对于量子通道，提出了几种攻击。正如新加坡国立大学\
  \ 2007 年观察到的，在公共讨论中，当双方在不提供任何介绍的情况下通信时，由于计时信息的泄露，`Eve` 如何成功窃听并在通信中产生错误。\n\n## 9.\
  \ 时移攻击\n之后，引入了另一种名为时移攻击的攻击，这是对商业 `QKD` 的首次攻击，也是针对量子密钥分发协议的。在这种攻击中，加入了光路开关，因为 `Alice`\
  \ 和 `Bob` 的通信被中断，并同时在切断部分创建了两个连接，一个长，一个短。\n\n## 10. 量子密码系统的 Gate 后门攻击\n该攻击是由一个研究小组在\
  \ 2010 年提出的。它是对量子密钥分发分析的最可执行且能力更强的黑客。2011 年，他们尝试通过更改模式或添加伪状态来远程控制 `Bob` 通信的结果，但他们无法生成输出。\n\
  \n## 11. 集体攻击\n在这种攻击类型中，所有光子都被攻击者捕获，并在其中添加额外的比特以实现特定目标。攻击者保留了真实的光子，并将瞬态光子转发给第二部分。这样攻击者就完成了攻击，通信在通道上开始，现在他必须确定基。为此，攻击者对双方（即发送者和接收者）产生的一些流量进行感知，测量后很容易确定基。\n\
  \n## 12. 大脉冲攻击\n\n\n\n\n\n光学元件反射了极小部分入射光。在这种攻击形式中，Eve 向发送者和接收者都发送了一个强力脉冲，而发送者总是使用暗色或黑色设备来传输信号。无论设备有多暗，它总是会向\
  \ Eve 反射一些光子，她可以在不调整量子比特的情况下识别通信信道中的极化。由于窃听者仅攻击脉冲并通过反射光子收集信息，因此很难检测到这种攻击。\n\n###\
  \ 13. 光子数分裂攻击\n\n在这种攻击中，发送者和接收者必须与源（或单光子）进行通信，以证明 `BB84` 协议的安全性。使用任何技术，都很难长时间地产生大量光子。然而，如果发送者利用多光子源，Eve\
  \ 将更容易收集、检测并分裂光子，然后将其存储在自己的量子内存中。Eve 仅扰动了一个光子，却泄露了任何共享信息。根据 Kurtsiefer *et al.*\
  \ [67]，这种技术被称为侧信道攻击。Pinheiro *et al.* [67] 使用光电倍增管确保了这种攻击概率的显著性，并找到了其回闪概率。在这种攻击中，背光手筒通过所有可能的途径（取决于使用的探测器或基以及脉冲起源），向\
  \ Eve 提供了 Bob 测量结果的所有信息。\n\n### 14. 特洛马攻击\n\nDerkach *et al.* [72] 假设了发送端泄漏，并尝试通过更改\
  \ Alice（发送者设备）中的分束器来评估该信号。Eve 在此攻击中的目标是在不对系统造成任何损坏的情况下发现信号。为了检查信号，他在发送者的编码态中引入了木马态。在研究系统噪声后\
  \ [68] 识别出该攻击。\n\n## 22.8 结论\n\n量子计算作为一种潜在的新技术，可以改进几乎所有的当前计算工程解决方案。量子比特的基本特性，包括极化、纠缠、叠加和瞬传，被发现更适合在合理的时间内解决各种工程问题，而不是像过去那样需要数年的时间。虽然在现实中维持量子比特状态存在重重限制，但许多研究人员正在努力寻找绕过这些限制的方法。这项工作的主要目标是研究密钥管理（应用工程的一个关键领域）以及量子密码学的许多方面。在有效性方面，`BB92`\
  \ 优于其他协议。发布安全信道以及时提取加密和解密。已经发现在增强性能的多次密钥管理迭代中使用量子计算的证据。这表明，在未来，网络通信将完全依赖量子信道，完全基于量子计算的新一代算法将具有非常广泛的设计实现选择。在网络安全和密钥管理方面，本研究为新研究人员提供了一种进入量子计算领域的研究途径。\n\
  \n如应用所述，`PKI` 及其密钥交换方法可以在量子计算机的帮助下被破解。建议的安全密钥交换协议方法使用了 `QKD`，它保证了发送者和预期接收者之间安全的密钥交换。\n\
  \n以下是根据当前技术进展，我们可以关注的几个研究观察主题，以防止量子演进带来的潜在危害：\n\n1. 关注每个 `PQC` 算法。\n2. 强制所有应用程序使用\
  \ `AES 256` 作为静态数据加密的对称算法。\n3. 意识到量子计算的范围和能力。\n\n## 参考文献\n\n1. 1. S. Aaronson, “The\
