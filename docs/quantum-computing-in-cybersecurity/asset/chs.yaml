  \ *60*(5), 1883.\n\n## Note\n\n通讯作者：`mailto:aburman1510@gmail.com`\n\n# 量子计算技术\n\
  \n## 摘要\n\n现代计算基于 `QC`。本文展示了 `QC` 的架构、硬件和弱点。它描述了 `QC` 对医疗保健、优化和网络安全的影响。我们评估了 `QC`\
  \ 的潜力以及新技术的优势。\n\n**关键词：** 量子计算，密码学，量子密钥分发，信息安全。\n\n## 引言\n\n### 17.1.1 计算历史\n\n\
  随着演进，科学技术不断被发现。如果输入良好，`计算机` 能够快速、准确地解决问题。它始于第二次世界大战，当时 `艾兰·图灵` 开发了 `通用图灵机`，一种通用计算机。计算机的力量和能力随时间不断增强。\n\
  \n### 17.1.2 创新计算方式\n\n现代计算机比早期的计算机更便宜、更快、更高效、更强大，后者更大、更贵、更耗电。这是通过架构和软件的进步实现的。基于物理学的量子计算\
  \ `QC` 解决了物理宇宙的随机性和不可预测性。量子力学是一个比经典力学更完整的物理模型，因此 `QC` 是更全面的计算模型。\n\n基于经典算术运算，与单独使用二进制位\
  \ `0` 和 `1` 的其他经典计算机不同，它们使用自己的 `qubits`（也称为量子比特）来存储信息。`量子计算机` 是使用这种数据处理方式的计算机的术语。晶体管、逻辑门和集成电路无法用于此类微型计算机。因此，使用了亚原子粒子（如原子、电子、光子和离子）及其自旋和状态的位比特信息。因此，它在并行运行时可以高效使用内存，使其变得更加强大。\n\
  \n### 17.1.3 量子计算的需求\n\n任何可以用经典计算机解决的计算问题都可以用量子计算机解决。`丘奇-图灵论文` 声称即使传统计算机也可以处理 `QC`\
  \ 面临的所有问题。从预测性来说，这意味着它与传统计算机相比没有优势，但今天的传统计算机无法在合理时间内完成某些困难和不可能的任务。这需要更多的计算能力。`QC`\
  \ 的运行速度比经典计算机快几个数量级。\n\n\n\n\n\n1993 年，Peter Shor 10 展示了 `QComp` 如何以快得多的处理类似的问题——例如只需几秒钟——且不会过热。他创建了用于快速分解大数字的公式。由于其计算的基础是原子状态在被实际获知之前的概率，这些技术具有处理指数级海量数据的能力\
  \ [21, 22]。它还展示了现实世界的量子计算机如何破解密码学使用的秘密代码。加密数据和通信的安全可能会受到威胁。机密和隐私信息可能会泄露。然而，也应该注意到\
  \ `QComp` 的优点大于缺点。因此，它们仍然是需要的，进一步的研究正在进行中，以期更好的未来。\n\n## 章结构\n\n本章的其余部分组织如下。第 17.2\
  \ 节 介绍了量子计算的基础；第 17.3 节 介绍了量子计算的特性；第 17.4 节 重点介绍了量子计算的拓扑结构；第 17.5 节 介绍了量子计算的架构；第\
  \ 17.6 节 展示了量子算法；第 17.7 节 显示了量子计算机的设计限制；第 17.8 节 描述了不同类型的量子计算机；第 17.9 节 介绍了量子计算的益处；第\
  \ 17.10 节 重点介绍了量子计算的缺点；第 17.11 节 介绍了量子计算的应用；第 17.12 节 显示了量子计算面临的主要挑战；最后，第 17.13\
  \ 节 给出了本章的结论。\n\n## 17.2 QC 的基础\n\n在构建传统计算机的过程中，人们意识到晶体管的性能（特别是当它们变得越来越小时）如果发生了某种量子现象，将会受到噪声的影响。他们尽一切办法从电路中排除量子现象。`QComp`\
  \ 不使用普通的比特，而是使用一种新技术，甚至使用量子现象。它使用量子比特，类似于普通比特，并具有两个可以是 `0` 或 `1` 的量子态 [11]。然而，由于某些量子特性，可以想象它同时处于这两种状态中，因此产生了叠加比特的概念\
  \ 6。\n\n## 17.3 QC 的特性\n\n在量子物理学中，量子元件并不以完全定义的状态存在。当没有人观察时，它看起来像一个粒子，但行为更像一个波。几个迷人的科学事实是粒子二象性的结果。任何量子对象的状态都可以描述为波函数或所有可能的参与状态之和。这些状态是相干的，因为涉及状态的所有干涉都可以是正的或也可以是负面的。当量子对象与较大的物理系统相互作用时，可以从它们的观测中提取信息。量子测量指的是对量子对象的这种观察。通过破坏量子态，测量可能会导致信息丢失。\n\
  \n量子事物的特性包括一些。在 `QC` 的背景下，`qubits` 是涉及的量子对象。薛定谔方程 [18–20] 描述了能量环境如何影响系统的波函数 12，控制着任何量子系统的演化\
  \ [21, 20]。系统的哈密顿量是对系统中所有组件受力能量的数学描述，充当介质。任何管理的量子系统必须首先与宇宙不受控的力隔离开，并将所有的能量分配给这个单一孤立区域。整个系统无法被隔离。然而，信息和能量的交换可以减少。\n\
  \n### 17.3.1 行为\n\n描述粒子行为的概念性指令和数学表示称为特征。为了比任何经典计算机都快指数级地存储、表示和处理数据，`QComp` 利用了量子力学的三个基本特征。列出了以下三个特性\
  \ 4：\n\n### 17.3.2 叠加\n\n量子系统的一种能力，即量子粒子或 `qubit` 可以存在于两个分离的地方，或者说同时处于多个状态中，这在 `QC`\
  \ 中被称为叠加 [15–17]。它与其经典的受二进制限制的对应物有显著区别，因为它提供了极快的并行处理。同时发生在两个状态中的信息被存储在 `QC` 系统中。通过使用激光，将\
  \ `qubits` 转移到叠加态，允许它们同时存储 `0` 和 `1` 4。\n\n### 17.3.3 纠缠\n\n纠缠是 `QC` 的重要方面之一。它指的是两个量子比特（系统的物理特性）之间的一种重要关系。尽管它们被遥远的距离隔开，例如宇宙的两端，`qubits`\
  \ 也是连接的。它们相互交织或相互表征。事实是，一个粒子的状态可以影响另一个粒子的状态。因此，`Qubit` 可以有效通信。一旦相互纠缠，它们将无法分离 [4,\
  \ 13]。\n\n### 17.3.4 干涉\n\n`QComp` 像普通波干涉一样具有干涉特性。波干涉发生在波在同一介质中接触时。当波的方向相同时，它们的振幅相互相加，产生被称为相长干涉的波。当波的方向相反\
  \ 14 时，振幅相互抵消，产生被称为相消干涉的波。取决于干涉图形，纯波可能比原始波大或小 [15–17]。它可以引起量子干涉。由于叠加，每个粒子可以通过自己的路径，并且如果它同时通过两个狭缝，就会阻碍路径的方向\
  \ 4。\n\n## 17.4 QC 的拓扑结构\n\n受量子现象影响的其他少数技术包括量子信息科学、量子通信和量子计量。所有这些技术突破相互关联，并具有调节和改变整个量子系统的潜力。它们使用相当的技术、物理理论和方法。\n\
  \n量子信息科学 - 量子信息科学 [13, 14] 的目标是在量子系统中找到存储信息的有效方法。介绍了量子力学的统计和相关限制。它是所有其他应用的基础，包括\
  \ `QC`、通信、网络、传感和测量。\n\n量子通信与网络 [21 - 为了实现 `QComp` 之间的通信，量子通信和网络专注于通过将信息编码在量子系统中来讨论或交换。量子通信的一个分支量子密码学利用量子力学的特性来创建一个安全的通信系统。\n\
  \n![图 17.1 经典计算机与量子计算机的区别 [4]。](images/fig17-1.jpg)\n\n\n\n\n\n图 17.1 经典计算机与量子计算机的区别\
  \ 4。\n\n量子传感与测量 22 - 量子系统的研发被称为量子传感 11 和测量 13。此类设备可用于测量重要的物理参数 15（如电场、磁场、温度等），对环境中的有害物质极度敏感。`Qubits`\
  \ 是量子传感器的基础，通过实验量子系统实现。\n\n这项研究的主要重点是量子计算（QC），利用量子物理的叠加、纠缠和干涉来执行计算。量子计算机通常定义为由一组量子比特组成的物理设备，在执行计算之前，这些量子比特必须与外界隔绝以保持其量子态的一致性。对这些量子比特进行排列和操作以应用算法，并通过对其最终状态的测量产生高概率的结果\
  \ 4。图 17.1 显示了经典计算与量子计算的区别。\n\n## 17.5 量子计算架构\n\n- `APPLICATION CLASS` - 不属于 `QComp`。它用于表示用户界面、量子计算机操作系统、加密环境等。它是创建高效量子算法所必需。它是硬件无关的。\n\
  - `CLASSIC CLASS` - 改进量子算法 14 并转换为微指令。此外，它处理由底层硬件返回的量子态测量结果，并将其转换为经典算法输出。\n- `DIGITAL\
  \ LAYER` - 将微指令转换为量子比特所需的脉冲（信号），充当量子逻辑门。它是底层所需模拟脉冲的数字化表示。为了将量子过程的结果与最终产品相结合，它还以量子测量的形式为上经典层提供反馈。\n\
  - `ANALOG LAYER` - 为底层提供波形幅度和相位的电压信号，在底层可以执行量子比特操作。\n- `QUANTUM LAYER` - 与处理层（数字和模拟）集成在同一块芯片上。它保持在室温下并用于存储量子比特（绝对）。此部分处理纠错。计算机的效率由此类类决定。\n\
  \n数字处理、模拟处理和量子处理构成了量子处理单元（`QPU`）的三个层次 15。`QComp` 包括 `QPU` 和经典层。数字层和模拟层在室温下运行 4。图\
  \ 17.2 显示了量子计算的架构。\n\n![图 17.2 量子计算架构 [5]。](images/fig17-2.jpg)\n\n图 17.2 量子计算架构\
  \ [5]。\n\n### 17.5.1 量子计算的硬件与软件\n\n除了硬件，`QComp` 还需要软件。对于量子操作，量子比特所在的 `data plane`\
  \ 首先。`Control Plane` 负责。第三是 `host processor`，指定操作顺序。最后一种类型是 `host processor`，用于数据结构和量子操作系统\
  \ 11。\n\n通过替换算法末尾的测量成本，在模拟器而非硬件上运行的算法在执行时间上非常高效。这也是仿真优化。通过将量子算法与经典方法进行比较，可逆性总是可能的。事实证明，如果省略测量，量子电路可以反向传播，撤销电路正向移动执行的所有操作。\n\
  \n## 17.6 量子算法\n\n执行操作或计算必须遵循的一系列规则或指令称为算法。问题必须逐步解决，特别是在使用计算机时。`quantum algorithm`\
  \ 指的是任何可以在量子计算机上运行的算法。通常，`QComp` 能够实现所有经典算法。要被称为量子算法，算法必须至少有一个由于叠加或纠缠引起的单个量子步骤。\n\
  \n量子电路是量子算法的一个定义属性。量子算法的每个阶段都作为量子电路（QC 模型）中的量子门。称为量子门的操作可以在任意数量的量子比特上执行。量子比特的量子态会被改变。根据一次应用于多少量子比特，它可以被分类为单门或多比特门。量子比特测量用于定义量子电路。\n\
  \n问题不可解性指出，任何经典算法无法解决的问题都无法通过量子算法解决。然而，与传统算法相比，这些算法在解决问题方面快得多。`Shor algorithm` 和\
  \ `Grover algorithm` 是量子算法的例子。`Grover’s method` 用于探索大型无序列表或非结构化数据库，比经典方法快四倍；`Shor’s\
  \ algorithm` 用于计算极大数字，比目前最好的传统程序快十倍。\n\n可用的许多量子算法包括：\n\n- `Fourier Transform` –\
  \ 基于量子的算法。\n- 基于幅度增益的量子算法。\n- 基于量子步骤的算法。\n- 混合量子/经典算法。\n\n\n\n\n\n1. `QComp` 具有指数级计算能力，这可以通过识别并修复可能降低其质量的任何设计缺陷来实现。有四个主要的设计限制。第一个限制是，只有当所有量子比特都相互纠缠时，描述量子计算机状态的狄拉克符号中的系数数量才会随着量子比特数量的增加而指数级增长。`Qub`\
  \ 必须遵循纠缠属性，这要求任何量子比特的状态都要与其他量子比特的状态连接，以便 `QC` 发挥其全部潜力。由于很难在量子比特之间建立直接链路，因此无法直接实现。\n\
  \n2. 第二个限制源于一个被称为“不可克隆原理”的概念，它无法复制整个量子系统。由于量子比特或量子比特集的状态传输到另一组量子比特而不是复制，因此存在从原始量子比特中删除任意信息的风险。经典计算的重要部分是在内存中创建并存储中间状态或不完整结果的副本。但\
  \ `QComp` 需要一种新方法。为了知道哪些位被加载并查询到量子系统内存中以完成任务，量子算法帮助从存储器访问经典位。\n\n3. 第三个限制是量子比特操作对噪声缺乏保护的结果。因为它们没有被底层门操作忽略，门操作或输入信号中的微小异常会随时间积累，并影响系统状态。这将对量子系统的测量、一致性和计算准确产生负面影响，以及其量子比特操作的完整性。\n\
  \n4. 最后一个限制是量子机器即使在停止工作后也无法实现其完整状态。假设一个量子计算机配置了一个初始量子比特集，并叠加了所有其他状态。当一个函数应用到该状态时，会创建一个新的量子态，其中包含每个可用输入对应的函数值信息。对该量子系统的测量不会揭示这些信息。要创建一个成功的量子算法，必须操纵系统，使得数学运算产生的状态被测得的概率高于任何其他可能的结果。\n\
  \n## 17.8 量子计算机的不同类型\n\n### 17.8.1 模拟量子计算机\n\n这类系统通过调整哈密顿量表示中的模拟值来工作。它不使用量子门。它包括绝热量子计算、量子模拟和量子退火。在量子退火中，初始量子比特集逐渐改变系统所遇到的能量，直到达到由\
  \ `Hamilton` 定义的问题参数。这样做是为了获得与问题解决方案概率最大的对应量子比特最终态。绝热量子计算机使用 `Hamilton` 基态的初始量子比特集进行计算。然后缓慢修改\
  \ `Hamilton`，以在整个计算过程中使量子比特保持在基态或可能的低能量状态 [7.].\n\n### 17.8.2 NISQ 门量子计算机\n\n噪声等规模量子被称为\
  \ `NISQ`。`NISQ Digital Calculator` 是它的另一个名称。这些系统是基于门的，在没有完全纠错的情况下在组量子比特上运行，并且无法限制所有错误。为了防止离散化和门误差掩盖结果，必须执行计算，使其能够在较少的完整步骤中完成，同时在具有最小噪声的量子系统上保持真实性\
  \ [7.].\n\n### 17.8.3 全纠错门量子量子计算机\n\n随着量子纠错的实现，这些计算机可以在量子比特集上执行门操作。它减少了计算过程中产生的系统噪声。不完整的信号、设备篡改、量子比特与环境的意外绑定、初始化量子比特的能力以及在不影响其他的情况下进行测量的能力都是\
  \ `QComp` 的要求。\n\n## 17.9 量子计算的优势\n\n- 研究人员预测，`QComp` 能够解决传统计算机在合理时间内无法解决的难题。\n\
  - 它提供了处理和理解海量数据所需的计算能力（每天 2.5 字节，或相当于 500 万台笔记本电脑）。\n- 得益于被称为“量子隧穿”的现象，它可以并行工作并消耗更少的电力，功耗可降低\
  \ 100-1000 倍。\n- 任何经典计算机都比量子计算机慢“数倍”。例如，谷歌创建的量子计算机快 1 亿倍。\n- 由于量子系统内部一直保持在 0.2 开尔文的低温以保持稳定性，它可以在不过热的情况下解决难题。\n\
  - 它可以快速检测最优路线并规划火车和飞机等其他优化相关问题。此外，它将能够每秒计算 1 万亿次移动。最安全、不可攻破的加密方法将被 `QComp` 破解。但它也将创建无法被破解的备份。\n\
  - 它具有彻底石油和医药等行业的潜力。新药的开发将成为可能。金融机构的市场算法可以改进。早晚，人工智能将会发展 [8.].\n\n## 17.10 量子计算的劣势\n\
  \n- 随着量子计算的兴，今天的物联网（IoT）将变得不安全。可以使用加密技术对公共和私人机构数据库、银行和防御系统进行攻击。鉴于这些细节，`QComp` 可能对未来没有好处。\n\
  - `QComp` 的工作方式与传统计算机不同，无法完全取代它们。因为计算机在执行电子邮件、Excel 等某些任务方面比 `QComp` 更好。\n- 它尚未被完全发明，因为目前只使用了一部分，人们仍在梦想它可能长什么样。\n\
  - 它很容易产生错误。原子和电子是亚原子粒子，受到各种震动的影响。结果是可能会出现噪声、故障甚至失效。这导致了“退相干”，即量子相干性的丢失。\n- 量子处理器极其不稳定且难以测试。由于稳定性原因，量子计算机的温度被控制在\
  \ 0.2 开尔文，这几乎低于宇宙的温度。维持和控制这样的温度是非常困难的。主要的挑战是在考虑消费者预算的情况下将其开发为个人电脑。它们将首先供应给主要行业，然后进入零售市场\
  \ [9.].\n\n## 17.11 量子计算的应用\n\n\n\n\n\n对于 QComp（量子计算），人们根据傅里叶变换和哈密顿量模拟等基础数学技术，开发了一系列量子加速算法。为了让大多数算法能够提供有意义的功能，需要大量高质量的量子比特和纠错技术。由于这在目前是不可行的，这些算法是以分组形式创建的，而不是单一的集成应用\
  \ 10。\n\n关于 QComp 的用性或适用性的研究仍在进行中。预计这些应用将需要更少的比特和更少的代码来运行。由于比特的独特属性，可以开发出在 QComp\
  \ 上运行得更快的算法。未来可能出现的一些主要用途描述如下。\n\n### 密码学\n\n互联网和计算机安全的许多重要方面，包括电子商务和电子秘密，都依赖于加密和难以破解的数学公式，包括将极大数分解为大质数（RSA\
  \ 技术）。这还通过使用普通计算器遍历所有可以想象的元素来补充，而这非常耗时。除了 RSA 之外，AES、ECDSA 等其他现代算法对于非常强大的计算机来说也是不可破解的。因此，破解它们的成本将高得多，且实用性较低。所有这些任务都可以由更快的\
  \ QComp 完成 11。\n\n### 优化问题\n\n在所有可能的解决方案中找到问题的最高效解就是优化的意义。这可以通过最小化误差和可用步骤来实现。优化问题最适合由\
  \ QComp 解决。许多量子算法和量子优化技术可以改进传统计算机解决的优化问题。量子数据拟合、量子半确定规划和量子组合优化就是其中一些 10。\n\n###\
  \ 人工智能\n\n处理海数据集是人工智能的关键。与传统计算机不同，QComp 可以更高效地处理复杂信息。然而，量子模型的开发需要大量的精力和时间。比特的独特属性允许开发运行更快算法。为了确保\
  \ QComp 的输出准确，某些保护是是 12。\n\n### 量子模拟\n\n在化学和材料科学领域，量子模拟被用于表示。然而，这些模拟的准确性取决于环境和状态。与经典计算机不同，QComp\
  \ 可以产生更高效的结果 6。\n\n## 量子计算的主要挑战\n\n1. 好消息是 QComp 可以用来解决复杂问题。然而，使用的比特数量是架构中的一个因素。仍然需要开发量子纠错技术\
  \ 13。\n\n2. 一个主要挑战是量子系统容易产生错误。与经典计算机不同，状态不能直接复制。因此，使用真空室等方法保护比特免受环境影响很重要 13。\n\n\
  3. 开发量子算法要求它们在设计上是完全独特的。处理速度取决于架构，且设计中必须反映比特数量 13。\n\n4. 为大数据问题生成输入状态是非常耗时的，并且通常需要额外的资源，例如管理开销\
  \ 14。\n\n5. 为了创建和调试量子系统，有必要开发额外的软件工具。这将有助于解释未解决的问题并推动设计 4。\n\n6. 由于经典计算机依赖于内存和中间状态，调试量子硬件和软件非常重要。测量中间状态可能会中断它，因此需要新的技术\
  \ 4。\n\n## 17.13 结论\n\n现代计算机系统（如 QComp）基于量子物理的惊人事实。它是信息论、计算机科学、数学和物理学的壮丽结合。与传统计算机相比，它通过影响原子等微观物理实体的行为，承诺提供更好的处理能力、更低的功耗和指数级的速度。本文讨论了\
  \ QComp 所需架构、硬件、软件、类型和算法。它证明了 QComp 有许多方式改善我们的生活，包括人工智能、交通管理、医疗应用和网络安全。最后，我们对 QComp\
  \ 的相关性、优缺点达成了共识。最近已经构建了小型 QComp。\n\n## 参考文献\n\n1.  1\\. [`www.intechopen.com/chapters/73811`](https://www.intechopen.com/chapters/73811)\n\
