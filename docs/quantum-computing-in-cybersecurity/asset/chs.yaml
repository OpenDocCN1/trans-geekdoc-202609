  \n### 8.1.2 国家安全法\n\n\n\n\n\n在自治的第三十一年内，政府制定了一项极具争议的立法案，称为《1980 年国家安全法》。该《法案》总共包含\
  \ 18 个章节。政府声称，该《法案》的重大意义是为了适应具有预防性质的拘留，并在特定情况下，针对与不同思想相关的问题进行拘留。该《法案》适用于印度全境，但 `J`\
  \ 和 `K` 除外。\n\n《法案》的 `Area 2` 规定了“适当政府”、“羁留请求”、“局外人员”、“个人”和“州政府”等术语的不同含义。《法案》的 `Area\
  \ 3` 基本上需要管理力量以发布命令，以批准逮捕特定个人。它还规定，政府可以向主管机关就任何可能被留的人提出请求，目的是防止特定违规行为的发生。逮捕的实施取决于法案中所引用的政府的履行。尽管如此，如果相关个人寻求对等救济，政府的情感履行可以进行`司法审查`。\n\
  \n如果州政府认为有此必要性，它可以根据民意，指示此类羁留的期限，该期限在申请中并非一成不变。做出此类请求的官员需要向政府记录并使该活动合法化。拘留的最长时间限制将不超过\
  \ 12 天，并且必须向中央政府提交一份说明，报以进行调查。羁留请求可以在印度的任何地方执行，就像在`Code`下执行逮捕令的方式一样。\n\n`Segment\
  \ 5` 被认同为管理拘留地点和拘留状态的能力。拘留地点应由中央政府选择。以这种方式被拘留的人，也将有义务根据政府的评估，从一个地点移动到另一个地点。\n\n\
  `Segment 5` 被认同为可分割的羁留理由。这部分从根本上讨论了在离散案件中，羁留理由的重要性，这些理由将面临被独立拘留的风险 [[19]](#c08.xhtml#ref19)。如果其中一个或多个理由是模糊的、不存在的、不相关的、不关联或与该个人没有实质性联系，或者在任何想象中的其他解释下无效，此类申请基本上不会被视为无效或有缺陷，并且在这种情况下，不能认为政府或做出此类申请的官员已根据第\
  \ 3 区的规定，就额外理由或理由提出了限制请求。\n\n该法案的 `Segment 6` 主要讨论了某些羁留命令不能被视为违背或失效。该章节规定，如果羁留发生在实际拘留的范围之外，该行为将不被视为非法。\n\
  \n《法案》的 `Area 7` 管理与逃犯和潜逃者相关的力量。如果某个人为了躲避逮捕而藏起来，政府可以将事实数据提交给大都会高级法官。该个人随后必须出面并反驳政府报告所提供的事实。如果未能这样做，将本身演变成一个由法官亲自颁发的逮捕令。如果未能阻止此类活动，该个人可能会被拘留长达\
  \ 1 年，并缴纳罚款。\n\n该法案的 `Area 8` 同样规定了政府引入逮捕理由以及个人被羁留的总时限的重要性。《法案》的 `Area 9` 规定了`咨询委员会`的设立。该委员会由三个人组成；其中一人将担任主席，他必须具有足够的资格担任`高等法院`任命官员，并由合法政府任命。当政府需要时，将设立该委员会。\n\
  \n\n\n\n印度宪法第 22 条第 5)款是主要的来源，它作为一种程序性保护，防止允许陈述权利的演示，并防止宪法第`Article 20`条下引的任何自罪指控。1980\
  \ 年《国家安全法》是在国家某些地区发生若干针对专家、医护人员和警察人员的滋事、滥用和攻击事件后，由各州政府近期制定的。\n\n`NSA` 是由英迪拉·甘迪政府于\
  \ 1980 年批准的一项预防性拘留法。该法可以认为是尼赫鲁政府时期出现的《1950 年预防性拘留法》的强化。设立该组织的根本假设是阻止个人采取违背国家利益的行为，包括破坏国家和地区安全的行为，或阻碍国家寻求安全的行为。\n\
  \n`NSA` 授权联邦和州政府拘留任何人，以防止其实施未来的错误行为并避免其受到未来的起诉。公共当局也可以拘留某人，以防止其破坏公共秩序或确保当地基本物资供应和服务的不受中断。\n\
  \n### NSA 下的规定\n\n在 `NSA` 的司法范围内，囚犯的权利被极端压缩。拘留的说明仅在捕获 5 天后可披露，在特殊情况下可延长至 10 天。在披露有关拘留的信息时，公共当局可以隐藏其认为对公共利益不利的细节。由公共当局设立的一个常设审查委员会处理\
  \ `NSA` 案件。囚犯被拒绝任何法律指导，并且不能就审查委员会所尝试的程序问题咨询任何专家。囚犯的拘留期限最长为一年，并在提供相关证据的情况下可进一步延长。`NSA`\
  \ 因其政府的双重标准而面临着对神圣和基本权利视角的抨击。\n\n- 它被标记为一项过时的法律，因为在和平时期使用预防性拘留法是存疑的。\n- 决策政府将 `NSA`\
  \ 作为额外的法律手段使用，因为它规避了宪法的若干条款（已确立），且每当被用于政治考量时，都会对基本自由造成严重侵犯。\n- 宪法第`22(4)`条规定，任何适用于预防性拘留的法律都不会批准拘留超过\
  \ 90 天。然而，履行该条规定豁免条款的 `NSA` 可以批准最长一年的拘留时间，在提供相关证明的情况下进一步延长。\n- 《国家安全法》的合法性在`Roy\
  \ 诉印度联邦`案中接受了检验，但最高法院认为该法并不违反宪法。\n- 即使最高法院在`Fayyaz Ahmed Kumar 诉州`案的判决中也判定，预防性拘留法应当被严格且尽量地解释，并且应该谨慎遵守程序保障。\n\
  \n这项法的最新传唤可能有其优缺点，但对于目前的现状是合理的。针对医疗小组和警察的协调攻击、避免对医务和医护人员的隔离以及反抗行为可以被解释为对维持供应和基本服务的直接威胁。国家正面临着意想不到的情况，公共当局需要巨大的努力、时间和金钱来控制新冠的扩散并治疗感染的`11`。此外，隔离和封锁是通过临床和警察人员有效地协调的。任何破坏他们努力的企图都应该通过严格且合理的行动来控制，而目前的召唤提供了必要的服务。\n\
  \n### 8.1.2.3 NSA 的滥用\n\n- **侵犯人权**：这些法律的根本原因是防止任何可能导致侵犯其他基本自由的进一步活动或损害。在任何情况下，国家的预防和安全法根本上针对对个人造成伤害的行为，并且符合《人权普遍宣言》和《公民权利和政治权利国际公约》下建立的国际法准则。\n\
  - **法律的歧视性使用**：该法最大的缺陷是赋予了政府巨大的权力。根据其需要，众所周知政府根据宗教、国籍、犯罪记录在任何情况下拘留个人，其最终目的是政治票仓。该法的更大理由是从根本上防止，但目前正被用作针对个人的潜在攻击手段，而这些个人存在任何计划，却并无恰当执行法律的打算。\n\
  - **基于惩罚而非预防**：印度政府通过的法律基本上旨在改变和恢复被指控者，旨在为了个人和烹饪的利益。然而，这项旨在建立以惩罚为基础的法令旨在伤害个人和国家居民。惩罚性方面将导致政府变得专权，正如这正让个人难以理解选举制度。\n\
  \n### 8.1.2.4 审查的必要\n\n根据该法第 11 条，审查委员会的程序已明确设定，它们没有正式的法律诉讼或刑事预审。该框架非常相反，因为它没有任何证据策略，并阻止被告获得见解，这显然是对`自然正义原则`的侵犯。\n\
  \n《国家国家安全条例》的合法性在`A K Roy 诉 UOI`案中接受了检验。该法旨在提供最好性质的服务，以便他们审查指令的真实性，并且在`AK Roy`案中并未侵犯宪法的基本结构，当挑战者反对这种方法忽视了普通价值原则时，因为它阻止了被留押者的法律辩护。\n\
  \n最高法院提醒，它不能为受限制的人提供或放松寻求法律指导的权利。尽管如此，法院认为虽然宪法没有赋予被留者真实辩护的选择，但它也没有明确禁止这一权利。该法与对基本自由的侵犯兼容，并且应当处于合法状态和理解范围内，以便他们提供通知并处于并非有助于正在发展的局势的内部和想法。\n\
  \n\n\n随着基础设计在不可否认的水平上的改进，并且能够容纳可以想象的活动最佳性质，现在是时候各国通过立法来保护其经济主体了。信息管理可以通过加密获得保护，但在发生泄露时，仍然缺乏更高级的安排来抵御和追溯。\n\
  \n德国是少数立法保护其基础设施和信息安全免受任何潜在威胁的国家之一。该法律背后的核心思想是保护基础设施免受可能利用并入侵国家产品体系的潜在威胁，从而可能损害建设并造成巨大的灾难\
  \ 16。该演示的意义如此重大，以至于已被纳入德国《国家安全法》，根据该法，任何参与信息泄露的人都将面临长达十年的监禁和最高 10,000 欧欧元的罚款。\n\n\
  印度作为一个通过信息加密拥有大量基础设施的国家，需要维持并开展相当规模的工作，以获得良好的保护。有必要将这些基础设施视为公共利益的一部分，并因此对其进行组织，以实现更宏大的愿景。由于这涉及公共利益，将此类安排纳入《国家安全法》将是理想状况，并调整活动、惩罚和变更，以保持真实性完，且不产生那些让国家无法遵守的活动。这种活动也将有助于人们建立一个更大、更好的局势，使他们能够完善自我并做出最理想的努力。\n\
  \n### 8.1.3 技术民族主义\n\n技术系统 (`TS`) 的概念被认为是分析全球化对一系列各种技术特征影响的良好起点 3。随后提出了一种分类法，以识别其对\
  \ `TS` 中与国家联系更紧密的部分以及与“国家”概念更相关的部分的影响。通过将不断增长但尚未定论的文献贡献分配给更具体的技术方面，可以获得有趣的结果，例如：与物理距离和空间相关的“技术领土主义”、与治理结构和政策制定相关的“技术主权”、与战略行为和问责制相关的“技术公民身份”，以及“技术民族性”。这种分类法的使用表明，全球化对国家（以及更地方性的）技术因素重要性的削减程度比人们通常认为的要小得多\
  \ 7。\n\n这在技术民族主义上尤为真实。事实上，一个国家内部语言和文化的某种共同性，以及其历史发展的制度环境，是创新过程的关键促进因素，并诱导了各种技术风格和表现。因此，技术民族创新体系仍然具有相关性。当前的技术民族主义为国际贸易引入了新的危险，增加了跨国公司\
  \ (MNEs) 的波动性、不可预测性和复杂性。本文讨论了当代技术民族主义如何与其传统形式不同、其底层理论逻辑、对跨国公司可能造成的损害，以及跨国公司可能如何减轻可能的影响\
  \ 10。\n\n1. 与传统立场相比，新的技术民族主义更加复杂且对全球贸易更具破坏性，因为它混合了地缘政治、经济、国家安全和意识形态问题 2。\n2. 新的技术民族主义建立在现实主义概念之上，该概念将世界视为一个零和博弈，各国在其中施加经济压力，并忽视了技术互联性、资源稀缺和资源竞争的重要性。\n\
  3. 技术民族主义阻碍了跨国公司，特别是那些依赖全球供应链和目标国家市场贡献的公司 8。\n4. 根据对关联政策相关的风险的接触程度和控制能力，跨国公司可能会选择对技术民族主义采取防御性或进攻性的反应。\n\
  \n新技术民族主义是一个将跨国技术交流与国家安全直接相关的学派，主张采取强制国家干预反对其他国家的机会主义或敌对国家及非国家。在现代技术民族主义下，领导者追求地缘政治利益，基于这样一个概念：全球已进入具有不同意识形态信仰、政治体系和经济模式的竞争地缘政治对手之间系统性冲突的新阶段（例如，放任资本主义对比国家为中心的资本主义）\
  \ 5, 26。这种意识形态假设竞争对手试图创建技术赋能的系统，以就数据隐私、监控、审查、透明度、数字货币和知识产权施加并授权显著不同的规范。南非等国由于种族隔离制度期间遭受的广泛限制，被迫接受技术民族主义。由于缺乏石油，他们被迫开发了费舍-托普肖法利用煤制造合成燃料，这些方法在油价上涨时期被证明非常有价值。\n\
  \n许多政府已诉诸“技术民族主义”，优先考虑技术用于国家经济增长，同时实际上单打独斗。许多政府优先考虑展示国家实力和地位，就像苏联在解体前所做的那样。中国近期出于实际和象征原因追求载人太空任务。中国利用这些任务宣布其作为全球大国的崛起\
  \ 10。\n\n\n\n\n民族主义，这一 19 和 20 世纪非凡的谜团推理，被视为一种怪物，在与更值得赞誉的、显然缺乏哲学色彩的自由主义和国际主义考虑相比时，表现出不同的面。民族主义被视为一种哲学继承——与军事主义相似且相关联——是对某种推测已经过时的血缘承诺的重塑，一种来自过去的、风险冲击。正如大家所料的那样，民族主义与进步的交汇并没有得到好评。同样，西方专家将`technonationalism`（技术民族主义）一词本质上等同于日本，以及此时的中国，用来描述一种可能的、真实的危险事物。对于历史历史专家来说，讨论进步与能量之间关系的长期阵地是德国，特别是在两次世界大战之间的时期\
  \ 9。如果认为`技术民族主义`仅适用于此类国家将会引起广泛反弹。在 20 世纪中期，几乎每个国家的知识分子在科学和进步方面都表现出极强的民族主义。恩内斯特·格尔纳（Ernest\
  \ Gellner）对能量的记录清晰地解释了为什么民族主义过去及现在是一个特别的整体奇迹，它吸收了各个国家大量相似的发展，无论其核心案例对于每个国家的独特性而言有多么特殊。对于格尔纳来说，民族主义是一种适应前沿、当今及全球化世界的通用程序。在一个尖端的现代文化中，由于教育、组织、信息和交流具有显著影响，要通过语言和社会界限与其隔离开来是困难的。`技术民族主义`是另一种重商主义愿景，它直接将机械进步和能力与国家的福利、经济繁荣和政府支持的退休联系起来。\n\
  \n技术民族主义还承认不同的计划，例如认为哪个国家最适合创新时代。适应创新时代的新公共形象正在世界范围内形成。例如，几乎哪个国家的人不认为自己的国家最适合航空时代；战间的法国分析师曾认为法国人特别适合成为飞行员。`技术民族主义`取决于这样一种解释：世界再次进入了西方明显荒谬且不足的自由企业模式与中国政府驱动的私人企业之间本质竞争的时期\
  \ 13。\n\n### 8.1.3.1 技术民族主义的兴起\n\n技术民族主义并不是一种在组织成立之初就能看到的衡量标准。它是一场随着时间和理解的发展，在个人中产生民族主义感觉的循环。遵循`技术民族主义`理念的最好想法是由北京提出的，它要求每一家机械公司都从本国购买电子设备，而不是从陌生的资产。这种想法基本上是针对经济结构和信心采取一种主观策略。\n\
  \n促使中国采取这种技术民族主义策略的诱因是美国对`5G`公司实施的封锁以及对传输速度的责任。\n\n技术民族主义建立在这样一个基础之上：世界再次进入了西方不可避免的荒谬且不足的自由企业模式与中国政府驱动的自由创业之间的本质竞争时期。大多数民主制国家和少数法西斯国家希望执行那些强制性的且赋能的创新驱动组件，这些组件在信息保护、监控、透明、限制、数字货币和加密技术方面存在不可想象的差异。\n\
  \n### 8.1.3.2 工业政策革命的兴起\n\n正如事实证明的那样，不同国家为了支持其经济并营造能够蓬勃其国家采购的理想环境而提出的机械安排大部分都是无效的。监管干预、官僚主义、贬值以及对企业运营模式的缺乏同情，确实使这种安排变成了浪漫主义者一直以来渴望的逻辑自相矛盾。尽管之前给出了评估，变革的现代策略是随着他们从方法和理解中成长出来的想法而出现的。过去\
  \ 15 多年蓬勃了该国的经济，并在开发一种最显著且最具评估价值的交通方面取得了重大进展，这种交通可以达到`250-300 km/hr`，并打算将其出口到国外。为了应对当时国内存在的理想状况，这对于框架来说基本上至关重要，例如，`北斗`和`华为`对比美国的`微软`和`苹果`。\n\
  \n此外，显然有`华为`，它利用国家资助成为全球最大的电信设备制造商，业务遍及 170 个国家，拥有超过 18 万名员工，其中包括 1 万名设计师。2018 年，`华为`显然在研发上花费了`150\
  \ 亿美元`。\n\n### 8.1.3.3 人力资本作为战略资产\n\n将人力资本化作为对抗持续冷战的战略手段已被中国和美国利用，他们正在编写人才库、网络、研发，以将人力资源转化为资源\
  \ [12, 28]。\n\n技术全球主义中出现的严肃局面伴随着生产芯片的微型实体出现。两家中国政府支持的协会——`全芯集成电路制造(QXIC)`和`武汉弘芯半导体制造有限公司(HSMC)`，利用政府提供的不同经济激励和补贴来聘用来自台湾和香港的工程师，而最优秀的人才进入了`台湾台积电(TSMC)`。据称，到\
  \ 2025 年，中国将招募 3000 名台湾专家来建立最好的资源工厂。中国经济寻求通过与美国、波兰、俄罗斯和日本等竞争国家的复兴 9。\n\n为了应对中国的微型实体和对其架构师的招聘，台湾政府正试图建立一种更先进的相对计划形式，以容纳他们实际上想要的高质量工作。\n\
  \n\n\n\n为了应对技术民族主义的蔓延，美国政府在 2020 年 6 月的一段时期内抵制了几所被认为具有持续威胁的中国大学。对美国人来说，最大的危险源头可能是`香港科技大学\
  \ (HIT)`，它也被称为“中国的麻理工学院” [\\[15\\]](#c08.xhtml#ref15)。\n\n美国政府采取的另一项重大进展是切断`亚利桑那大学`与`HIT`之间的联系。美国认为`HIT`受到了中国共产党（`CCP`）和中国解放军（`PLA`）的资助。这种活动被视为军民融合，而这处于美国活动限制的缩小范围之内。清华大学作为提供顶尖培训的领导者之一，其在半导体组装方面也同样高效且具竞争性。\n\
  \n### 作为世界上最受欢迎的国家之一，印度需要适应一种主观方法，以便能够在能够生产顶尖作品的大型制造设施中生产`芯片`和`半导体`，这是至关重要的。必须开始这项工作，他们应该发现并完成研发，使所有者和生产者能够获得最好的推广能力和质量。\n\
  \n### 8.1.3.6 中国技术民族主义的兴起\n\n技术民族主义将一个国家的机械基础及其进步能力与其经济繁荣以及自我认知联系在一起。教育者史蒂芬·费尔德斯坦（Steven\
  \ Feldstein）写道，技术民族主义是一个国家国内外力量的关键因素，独裁体制利用自动化循环来更新其国内权力。罗伯特·莱（Robert Reich）将技术民族主义描述为有利于国家及其创造极限和机械自主的方法，而雅各布·埃勒（Jakob\
  \ Edler）和帕特里斯·博克霍尔（Patries Boekholt）将其描述为国家更新组织中进步和权力的动力。\n\n民族主义是理解中国政治经济行为的基本因素。从\
  \ 19 世纪开始，国家建设是在与进步进行中国对比的基础上发起的。例如，`清朝`（清 line）利用“以夷制夷”的格言，为在公共领域引入西方学习和进步提供了合法性\
  \ [\\[22\\]](#c08.xhtml#ref22)。\n\n自中华人民共和国于 1949 年建立以来，基本上每个驱动时期都试图在进步上超越——或者至少等同于——西方。超越西方的动力得到了“社会达尔文主义”或优胜劣汰生存论的支持。前主席`毛泽东`寻求中国的快速工业化，并认为`钢`是这一变革的关键部分。1958\
  \ 年，他发起了“大跃进”，力求在 10 年内超越`英国`的生产极限，以战胜西方。对更大国家事业产生了关键性兴趣；在 1958 年至 1960 年间启动了约 4700\
  \ 家企业，并在当地地区和城市组织建立了小钢炉。尽管如此，增加机械生产的任务使工业成为国家生产部门的囚徒，而这些部门被`CCP`部门视为核心。负责国家事务的官员获得了财政发展计划，但在“面子工程”结构和进口货物上投入了过多。因此，中国生产的所有钢铁中实际上有\
  \ 80%是不合格或完全缺陷的。一种没有考虑到这些过度作为市场工具来衡量反应而产生的“浪费文化”被清除。这种追赶西方机械基础的尝试失败了，因为它是一个混乱的、被遗弃的市场框架，并且需要工人专家的经济力量。虽然中国从\
  \ 20 世纪 50 年代开始发展半导体，但其在该领域的进展被文化大革命时期的痛苦中断，这影响了生产者、专业人员和学生。\n\n中国 1978 年的变革是通过科学技术、工业、农业和公共保护引入的经济现代化。前最高领导人`邓小平`的体系是利用部分市场经济观点来促进中国经济的发展。他的广泛重点是利用新理论并增加中国经济的灵活性，同时保持`CCP`的共产主义思维和其紧控力量。\n\
  \n经济学家`弗里德里希·李`（Friedrich List）推测强大的军队不能保证国家的生存，并暗示地方收集限制对公共福利的影响。东亚关于进步和发展的金融思想与`List`对重商主义的批判一致。例如，直到\
  \ 1945 年的近八十年里，日本专注于技术进步以促进公共福利，使用了“富国强兵”的称号。日本机械战略的基本原则是：承认新进步；通过创新本土化实现独立；以及通过经济传播能力。建立了一个“创造进步”战略以实现公共财富，分为三个广泛领域——确保冒险、提供分配以及国家与私营企业之间更明显的合作。尽管如此，乐观的守卫者成本和竞争性的全球战略最终导致该国家在第二次世界大战中覆灭。日本接受了来自`商鞅`（秦国官员）插图的振奋号召，他说：“统治者应该通过发展国家和建立防御力量来治理国家。”\
  \ [\\[9\\]](#c08.xhtml#ref9)。\n\n`习`在 2012 年接任`CCP`总书记后的第一个行动是解释他到 2049 年（即中国革命和中华人民共和国成立一百周年）实现强国之梦想。根据`习`的观点，处理公共重建的最佳方法是让中国获取先进能力和管理实践的限制，并通过吸收海外华人来推动进步。\n\
  \n在过去的多年里，北京的`清华大学`已成为`CCP`精英的准备学校；`习`、他的前任`胡锦涛`和前总理`温家宝`都是该学校的产物，因为清华的人才使他们在`CCP`内部讨论中产生影响。2013\
  \ 年，清华教授胡安岗认为`CCP`的组织框架更适合中国的公共状况，并优于西式的多数人政府。\n\n\n\n\n\n最近，中国一直试图从其儒家传统中汲取思想，以增强其社会认同的真实性。学校课程读赞誉古代中国文明是“四大发明”——纸术、印刷术、火药和迷人的指南针的源头。中共推动了这样观点，认为这些发现同样导致了西方文明的进步。该党同样认为，中国没有利用这些发现，而西方更擅长调整指南针和火药。特别值得注意的是对`郑和`的推崇化，他是一位明朝（1368-1644）的海员。在后泽东时代，这位\
  \ 15 世纪的海员（其海军曾考察了东南亚、西亚和非洲的土地）受到了广受推崇，因为他的探索任务给中国带来了奇迹。与此同时，虽然火药的发现帮助中国进一步发展了烟花，但它也帮助西方制造了致命武器，导致中国在\
  \ 19 世纪被削弱 [[14]](#c08.xhtml#ref14)。\n\n中共意识到，其想象力灵魂似乎最近有所消散。习近平曾表示：“我们逻辑和机械进步的建立还不够强大，自主发展能力，特别是在独特想象力领域不够稳固……我们要赶进度，并在尝试超越他人。”因此，该党接受创新进步是一场竞赛，而发展是通往未来的道路。其隐含的意思是：“如果中国以前在逻辑发现上能够发挥带头作用，那么现在它毫无疑问可以做到。”\n\
  \n2016 年，中国公布了一项公共创新工作计划，以帮助大数据信息、清洁能源、量子通信和计算等领域。李克强总理在 2016 年全国人民大会报告中多次提到“发展”，次数是前一年的两倍。2015\
  \ 年在中国科学院和中国工程院讲话时，习近平提到了需要“解决创新短板”并保持持续能力。他还警告不要“用别人的过去来照亮（中国的）明天”。这显示了习近平希望推动更多本土化发展、减少对进口技术的依赖的热情，而没有对“渗透、吸收和再创新”进行充分考虑。在习近平领导下，对发展的推动促进了鼓励中国研究人员的努力，例如通过升级现有项目如“全球千才”，该项目旨在通过住房补贴和研究资助等激励吸引人才。\n\
  \n北京知道，对于回国的人来说，情况可能并不完全顺利。北京理工大学的刘国富表示，学生可能认为国外的条件优于国内，而且留住这些人才可能更多取决于工作场所，而非所宣传的优惠。自\
  \ 20 世纪 80 年代后期以来，出国考试的人中约有 55%回到了中国。中共对吸收的强调意味着，与其与其允许`Google`、`Twitter`和`Facebook`等“大科技”通过，`BAT`三巨头（百度、阿里巴巴和腾讯）被允许为“公共英雄”奠下良好的基础。`BAT`三巨头后的个人已成为人工智能（AI）改进领域不可忽视的力量。百度联合创始人`明磊`负责指导科技商业愿景家，他支持探索并在北京大学教授授人工智能课程，他在美国斯坦福大学完成了商业组织专业的研究生学习。然而，尽管美国大型科技公司为其提供了优渥的职位，他还是回了中国。`明磊`曾领导了开发百度爬虫（中国版`Google`）的团队，他是中国技术民族主义的典型人物，并经常传播他本可以在美国合伙公司工作，但选择为中国人工智能的发展工作的信息\
  \ [[4]](#c08.xhtml#ref4)。\n\n中国长期以来一直试图重新设计其半导体行业，以消除对未知创新的依赖，并与主要的半导体生产者台湾处于真正的竞争中。中国认为台湾是一个分裂地区，在中美科技争论后，台海峡的关系恶化。台湾的半导体产业仅次于美国，中国担心美国和台湾可能合作阻碍其进展。中芯国际（SMIC）的创立者`张汝京`是中国在这一关键领域建立信心的关键力量。北京宣传了一个故事，称`张汝京`通常被称为“中国半导体之父”）从台湾搬到中国内地，是为了满足他关于在中国建立精英芯片工厂的“民族主义”幻想。据说`张汝京`从台积电（TSMC）招募了员工到`SMIC`。2003\
  \ 年`TSMC`曾在加州法院起诉`SMIC`窃取专有创新和侵犯专利。\n\n中共认为，中国的金融和公共安全依赖于高水平的组装基地。2015 年的一项政府组装领域评估发现，尽管它是全球最大的，但在核心创新和发展方面十分薄弱。\n\
  \n“中国制造 2025”计划旨在通过升级中国的机械制造业来弥补这一缺陷。组织者确定了几个重点关注领域——前沿数据创新；尖端数控控制设备和先进机械；航空航天硬件；海洋工程装备和先进船舶制造；复杂轨道硬件；节能汽车；电气设备；农机机具；新材料以及生物医药和尖端医疗器械。到\
  \ 2020 年，中国计划在上述领域实现近 40%基础零部件和关键材料的国产组装，并降低成本、生产周期和产品不良率。到 2025 年，中国希望实现 70%零部件的本地化生产。\n\
  \n\n\n\n\n鉴于中国本土组装计划可能带来的压力，不熟悉的机构可能会被挤出价值优渥的中国市场，并在农业国家的业务领域面临严峻竞争。考虑到这一点，该国限制了对该计划的引用。例如，习近平在\
  \ 2019 年中央经济工作会议上没有提及 `CM2025` 计划，李总理在每年的全国代表大会上发布的 2019 年《政府工作报告》中也未提及——这两个会议是中国领导人惯常用于制定关键目标的重要集会。尽管如此，自启动\
  \ `CM2025` 计划以来，中国在几个领域扩大了其在整个行业的份额。中国在电动汽车领域进展迅速，目前占全球电动汽车市场的 33%，中国企业 `BYD` 是仅于\
  \ `Tesla` 的全球第二大电动汽车制造商。此外，`ZTE`（全球领先规划和组装网络管理硬件、枢纽和组件机构）在“物联网”许可方面位居全球第一，`Huawei`\
  \ 随其后排名第十。除了开创性的创新外，中国还具备了利用 `CM2025` 计划来应对其经济模型中出现的部分困难的特征。\n\n### 8.1.3.8 技术民族主义：网络脆弱性问题无法解决\n\
  \n在全球网络战争升级和威胁态势快速变化的背景下，新一波技术民族主义正在全球范围内兴起。`FCC` 拒绝了 `ZTE` 的一项请求，该请求要求审查其这家中国公司对通信网络构成国家安全的判断。`U.K.`\
  \ 近期表示将在 2021 年 9 月底前禁止安装 `Huawei` 5G 设备。`ByteDance` 正在确保 `TikTok` 可以在美国继续运营，同时符合中国新的《出口管制法》。\n\
  \n`U.S.` 也正试图通过提供财政援助来鼓励 `Brazil` 等国家在建设其数字基础设施时避免使用中国技术。结果，`Brazil` 的前四家电信公司拒绝与一位美国高级官员会面，该官员曾敦促将\
  \ `Huawei` 排除巴西 5G 市场。`Huawei` 和其他科技公司对 `Nvidia` 在其母国 `China` 英国芯片制造商 `Arm` 感到不满（该交易仍在等待监管批准）。如今人们使用中国制造的手机，而联系中心和托管服务提供商已将其个人数据分散在\
  \ `India` 或 `Philippines` 的多个数据中心中。由于数据现在是流动的、移动的通用的，针对某些公司或国家技术产品的禁令从安全角度来看最终将产生微乎其微的影响。\n\
  \n#### 幻的安全感\n\n复杂的经济、政治和国家安全担忧交织成的网是技术民族主义的燃料。在国家安全的幌下，从事“保护主义”的国家实际上禁止或禁运了特定的技术、企业或数字平台。然而，我们越来越多地看到这种策略被用于传递地缘政治信号、惩罚竞争对手和/或支持国内产业。当存在广泛禁止时，我们会感到虚假的安全。同时，每当任何硬件或软件供应商被整合到关键基础设施或几乎每个公民的手机中，我们必须承认其风险。其设备可能存在后门，允许该供应商访问私人信息或协助更大的攻击，这种可能性必须谨慎对待。或者，就像\
  \ `TikTok` 目前的情况，娱乐应用收集的美国居民数据可能会根据中国法律被强制没收，从而允许政府支持的网络攻击者针对并跟踪政府人员，或从事企业间谍活动。我们无法否认各国政府正日益利用网络行动来获取信息、施加影响并破坏敌对手。但我们必须记住，由我们身边的人、附近或与我们意识形态相似的人所创造的技术并不能让他们免受侵害，也不会自动增加其安全性。\n\
  \n### 数字欺诈与信任\n\n永远不要将信任作为唯一的安全保障。“信任，但要验证，”引用前美国总统 `Ronald Reagan` 的话说（奇怪的是，他其实是在引用一句俄罗斯谚语）。在网络安全背景下，“验证”是指采取必要步骤进行实时监控和审计，而不是天真地依赖你正在使用的技术。攻击者经常将信任作为其数字欺骗技术中的策略。事实上，来自不知情用户的被破解凭据是通过来自信赖\
  \ `SaaS` 公司的伪造登录页面获取的。攻击者将继续寻找创新方法来利用这些技术的缺陷和持续的人为失误风险，无论云提供商位于 `U.S.`、`China` 还是其他地方。例如，外国玩家可能会尝试访问硬件或软件工具供应链，有时仅通过贿赂内部人员来为他们执行。换句话之，基于技术民族主义或技术全球主义的购买决策本质上都面临相同的安全风险。因此，当我们关注某个特定业务或技术时，我们是在追逐旁鱼，而不是批判性地检查我们的基本安全策略和防御技术。对某些群体和技术的禁止只是国家安全的一个方面。相反，它关乎面对网络空间持续威胁现实时的运营韧性和网络安全——关键在于，无论攻击源自何处，无论攻击者的目标是什么技术。\n\
  \n### 构建未来的韧性\n\n\n\n\n如今，识别威胁预警信号的尝试已赶不上网络攻击的发展速度。因此，任何网络安全态势的强弱取决于其理解和维持内部正常状态的能力，而非其预测潜在未来外部威胁特征的尝试。无论威胁行为者的动机是什么——财务、战略还是政治——这一点都是成立的。对特定业务的关注分散了人们对网络防御现实的注意力。对关键数字环境获得更深入的洞察实际上可以促进国家安全问题，而不是减少或限制技术生态系统。通过对这些情况的彻底理解，我们可以在复杂的世界中有效管理风险。这种对不断变化的数字环境复杂性的理解程度和范围，在过去是人类安全团队无法胜任的。但那些使用人工智能和机器学习的团队能够做到。这些工具在提供构成技术生态系统的行动和工具的详尽画像方面表现卓越。现代世界中的技术民族主义正在增长，并且可能会继续增长，因为尽管最终是无用的，但它正以一种非常明显的方式应对实际挑战。风险仍然很高。外国敌对势力利用供应侧技术和组件中的隐藏后门作为访问点。一旦攻击者获得许可，经济间谍可能会造成无法估量的财务损失。此外，诸如燃气和电力网络等重大国家基础设施中断可能会让国家付出沉重代价。鉴于这些风险的普遍性，必须务实地解决。尽管技术民族主义日益流行，但它无法解决更大的安全问题。实施人工智能辅助的数字理解可以真正促进国家安全，而不是在“打地鼠”的游戏中限制对外国技术的获取。无论攻击来源如何，通过人工智能全面方法所实现的严格审查和实时攻击中断，为整个可实施技术范围提供了有效的网络保护。\n\
  \n## 8.2 结论\n\n在这项研究工作中，对于严肃的技术学习者来说，最困难的挑战之一是我们都假设自己知道不同历史时期主要技术是什么，以及它们在全球和国家层面的影响。我们认为自己知道，并不是因为我们对技术产生了奇怪的误解，而是因为可信的书籍、电影、博物馆等不断告诉我们，少数几种技术以一种公认的方式影响了世界。夸张一点，这在意识形态、国家和性别边界，以及研究或技术领域都存在广泛共识。在评估上可能存在一些分歧，但在评估什么上没有分歧。然而，正如我希望所证明的那样，我们的叙述（至少在国家和全球化方面）并不像看起来那样安全。复杂的学术文献中包含的论点与流行文化中的论点相当（我将其并列作为一种我所谓的“自下而上的历史”的练习），这一事实具有启示意义。更好地理解技术至关重要，因为它在国家兴衰的解释中起着重要作用，在对全球化的描述中更是如此。这个故事的教训是，每当在关于国家或全球化的对话中提到技术时，应该记住，这很可能是一个很久以前就应该被抛弃的技术叙述。新的技术史潜力为国家和全球历史提供新的视角。\n\
  \n## 致谢\n\n如果没有我的导师提供的卓越支持，论文及其背后的研究将是不可能的。她的热情、知识和对细节的严要求一直是我的灵感来源，并确保我的工作没有离轨道。\n\
