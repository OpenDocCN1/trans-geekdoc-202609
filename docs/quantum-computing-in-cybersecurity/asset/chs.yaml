  \ `m` 个空间模式上，每个模式不超过一个光子。该协议通过利用光子的偏振来编码 Alice 对量子游走的贡献，从而隐藏这些光子的传输：利用了对称偏振光子不干扰特性。通常空模式由辅助光子填充。安全性确保了\
