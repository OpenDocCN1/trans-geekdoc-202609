  1. * *通讯作者*：`amitkumartyagi25@gmail.com`\n\n# 8 技术民族主义与全球化：来自 NSA 的视角\n\n## 摘要\n\
  **关键词：** 网络犯罪、漏洞、技术民族主义、技术全球化、NSA\n\n## 8.1 引言\n\n技术民族主义和全球化在学术文献中被论述得更加激烈，因为很少有人会粗心到试图同时理解这两者的真正含义。第一个且最重要的问题是，以创新为中心的研究倾向意味着这些研究不可能是全球性的，然而，它们又声称创新与全球化以及政府之间存在联系。全球叙事大部分时候对弱势国家关注不足，尽管“全球化”如今是“贫穷”的代名词，就像“世界音乐”是来自贫困国家的民俗音乐一样。对于这一点，根据技术划分的世界研究有一个典型的根本性课题。许多技术进步影响了国家之间的关系，更不用说全球实力的提升。然而，在全球记录中，生产主义的视角极其罕见。相比之下，一种以通信技术为核心的发展驱动型技术全球化一直是许多全球叙事、信息社会大师的思想以及许多关于科学技术的忧世预言的核心，而且似乎一直是如此，现在依然如此。毫无疑问，它经常预言全球化创新将消灭民族国家，因为它将其视为一种过时的联盟。一系列新创新还将把世界变成一个全球村，互联网是这一长队列中的最新成果。在思考创新时，一种过度简化的斯密主义愿景甚至胜过了了糟糕的马克思主义。\n\
  \n\n\n\n\n技术全球主义的叙述特别依赖于记录性的遗忘。在 19 世纪末，蒸汽运输、铁路线和信息传递跨越并进入了一个在支持下被视为比以往任何时候都更与得紧密相连的世界。然而，当稍后出现对全球化新进展的诉张时，全球化本身却被忽视了\
  \ 20。\n\n沿着这一思路，亨利·福特（Henry Ford）在 20 世纪 20 年代的《工业哲学》（`Philosophy of Industry`）中断言：“机器正在完成人类通过讲座、有目的的宣传或冷静的言辞无法完成的事业。飞机和远程技术没有限制。它们无视引导线上的斑点，不顾顾虑或障碍。它们以任何其他框架都无法实现的方式将世界限制在一起。电影拥有广泛通用的语言，飞机拥有速度，而远程技术拥有即将到来的全球计划——这些很快将带世界走向完全共识。因此，我们是否可以设想一个世界联合国？它无疑会到来\
  \ 18，21。”\n\n技术全球主义正如该术语提出的，是追踪全球人口最大增长的最佳方法，他们借此聚集并营造一个最佳环境来发挥他们的实力，同时确保他们的现实 25。这一理念并不等同于任何特定国家，但社区和信息集中的实践将改变全球大学和发展中心运作的方式。这一切背后的核心力量是技术民族主义：一种重商主义行为，将一个国家的技术能力和产业与公共安全、经济繁荣和社会稳定问题联系起来\
  \ 23。\n\n![图 8.1 技术民族主义与技术全球化。](img/fig8-1.jpg)\n图 8.1 技术民族主义与技术全球化。\n\n![图 8.2\
