  \n## 摘要\n人工神经网络（ANN）已证明在机器学习分析中是有效的。神经网络可以学习输入数据的复杂方面。在大数据时代，超级计算机可能会不堪重负。由于数据量巨大，训练人工神经网络是一个困难的过程。\n\
  \n由于量子计算机可以使用量子比特以多种方式表示数据，量子计算（QC）正成为一个热门话题。它可以识别经典计算机难以识别的模式。因此，神经网络领域具有广泛的应用前景。在这项工作中，我们的主要目标是用量子比特训练人工神经网络。仿真结果表明，与传统的神经网络相比，我们的量子解决方案是有效的。对于二分类任务，使用量子比特的模型可以用更少的参数进行学习。\n\
  \n**关键词：** 量子计算、神经网络、机器学习、量子比特、人工神经网络、二分类\n\n## 15. 引言\n鉴于数据量增长之快，数据处理面临着挑战。从海量数据中获取任何理解是一个重大问题。随着数据量和规模的增加，必须解决新问题。通过网络层之间的设置，神经网络可以从输入数据中学习复杂的关联。在训练阶段，使用反向传播来调整这些参数。随着输入数据规模和维度的增加，训练参数较少的神经网络更具挑战性。\n\
  \n\n\n\n\n根据最近的研究，一种利用经典计算机调优量子参数的经典-量子混合策略可以有效解决机器学习中的挑战。为了在真实的量子处理器或量子模拟器上执行量子算法，研究人员创建了开源软件。二进制位形式的数据可以使用传统计算机进行存储和处理。相比之下，量子计算机使用量子比特\
  \ `[7, 8]`，同时使用 0 和 1 来存储和处理数据。叠加是这种反直觉量子力学特征的名称。许多算法利用纠缠（另一种量子力学特征）来诱导量子比特之间的相互作用。研究的主要目标是确定在近期量子计算机上使用较少参数训练神经网络的益处。\n\
  \n利用目前状态的量子计算机解决机器学习问题有其局限性。由于量子计算机需要与周围环境完全隔离，它们是复杂的系统。由于缺乏隔离，量子计算机中量子比特的相干性会丢失。在为即将开发的量子计算机开发量子电路形式的量子算法时，一个困难的问题是量子比特失去相干性的能力\
  \ `[[2\\]](#c15.xhtml#ref2)`。在 `Figure 15.1(a)` 中，量子比特的状态在布洛赫球上表示为 `|ψ = cos (θ/2)\
  \ |0> + sin (θ/2) exp(iφ) |1`，而 `Figure 15.1(b)` 中的量子门操作是通过标记为 `U` 的酉变换执行的，该变换将量子比特从一个状态转换为另一个状态\
