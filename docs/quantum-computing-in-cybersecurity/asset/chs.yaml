  \ 完成\n\n## 前言\n\n本书的主要议题是：\n\n* 社交网络中的量子学习\n* 量子计算的未来方向\n* 用于入侵检测的量子机器学习\n* 针对拒绝服务攻击的量子设计\n\
  * 量子网络中的密码学\n\n***\n\n## 摘要\n\n近年来，拒绝服务（`DoS`）攻击已成为一种系统缺陷。`DoS` 测试已成为量子计算（安全）领域最重要的流派之一。在相关信息学中，概率数据包标记（`PPM`）标准产生了惊的结果。首先，这种信息学后续方法的吸引人之处在于它允许对数据进行限制。在收集了足够数量经过检查的数据后，损失（或信息中心）将构建一组攻击。`PPM`\
  \ 算法项目的目标是证明生成的轮廓与攻击图相同，其中相关的攻击轮廓可以通过攻击框架进行绘图。该结构的主要目标是提供一种强大的方法，通过互联网等媒介追踪攻击者的源\
  \ IP 地址。该系统将根据组的指示对所有将在互联网上传输的每个数据包进行标记。当其到达目的地时，任何数据包的标记将被更改，该结构就可以被提取。大多数的 `PPM`\
  \ 问题涉及一些问题，诸如标记信息丢失、重建伏击路径的问题以及精度低于预期。在第一篇论文中，我们提出了一种动态概率数据包标记（`DPPM`）方法作为 `PPM`\
  \ 另一种升级的替代方案。另一方面，如果你在使用挂载检测概率，我们建议评估无论数据包是否已被标记，然后选择合适的检测概率。`PPM` 方法的大多数问题可以使用\
  \ `DPPM` 解决。\n\n# 1 量子计算（安全）使用修正的概率数据包处理大数据\n\n**Anil V. Turukmane 和 Ganesh Khekare**\n\
  \n*印度瓦多达拉，帕鲁尔大学，计算机科学工程系*\n\n## 1.1 引言\n\n\n\n\n在过去的二十年里，世界科学创新领域取得了显著进展，成功满足了广泛的人类需求。这些需求从电费单、火车票预订等基本生活需求，到暴力与共享时代的力矩阵等更复杂的需求。这些进步在现代性和简单性方面提高了人类生存的标准。出乎意料的是，一种用于协商量子计算（安全）的竞争性发明已经演变，并产生了自己的一系列影响，阻碍了创新。抢劫、黑客攻击和私人信息屏蔽都是信息相关攻击的例子。根据媒体和许多类型的网络量子计算（安全）文献，可能会出现每次都能有效攻击特定目标的匿名地下攻击网络。这仅仅描绘了从今天攻击向未来攻击的可能转变。在当今世界，一切皆有可能，从“破坏与毁灭”战争到“信息战”，再到上述攻击的协商。最后，能够隐藏身份的攻击者/网络通常是执行这些攻击的人。\n\
  \n对目标的攻击范围与建筑技术一样广泛，但本文重点关注一种被称为拒绝服务（DoS）攻击的特定攻击。DoS 攻击是一种针对性攻击，其目的是耗尽目标的资源，从而阻止大客户获取服务。长期以来，人们对网络基础设施的量子计算（安全）给予了高度关注，该基础设施一直被用于各种交易。互联网量子计算（安全）业务、学术界，甚至组织过多次此类主题会议的美国会议，都注意到了这一点\
  \ `[1, 2]`。已经提出了各种安全策略，每种策略试图解决一组不同的问题。匿名攻击是本研究关注的特定风险。因为源地址（SA）信息在攻击数据包中，因此在匿名攻击中，攻击者的身份对个人来说并非立即可见。\n\
  \n## 1.2 拒绝服务攻击\n\n本文的重点是 PC 网络上的拒绝服务（DoS）攻击。这些攻击的目标是拒绝合法用户访问网络服务。这篇博士论文包含了许多攻击和防御机制的全面观察，以及独特的防御机制和关于防御机制选择与评估的新信息。DoS\
  \ 缓解是网络和计算机量子计算（安全）的重要部分。网络和计算机量子计算（安全）在科学领域被频繁讨论。计算机量子计算（安全）语言仍然不平衡，这是一个大问题 `[10,\
  \ 11]`。计算机和网络量子计算（安全）最初在 20 世纪 70 年代被优先考虑，一些最详尽的量子计算文档发表于 `[[12]](#c01.xhtml#ref12)`。拒绝服务攻击形式多样，随着新程序和数据网络的发展，其数量不断扩大。这些攻击应分为物理和虚拟类，以便更好地理解常见的拒绝服务（DoS）尝试（或基于网络的）。该类别还有两种类型的攻击，每种都代表了攻击的总体目标：禁用目标资源\
  \ `[13]`。\n\n### 1.2.1 拒绝服务攻击概述\n\n系统中断（DoS）攻击已被证明是显著且长期的 `[16, 20]`。匿名攻击是本研究关注的特定风险。因为源地址（SA）信息在攻击数据包中，因此在匿名攻击中，攻击者的身份对个人来说并非立即可见。\n\
  \n对目标的攻击范围与建筑技术一样广泛，但本文重点关注一种被称为拒绝服务（DoS）攻击的特定攻击。DoS 攻击是一种针对性攻击，其目的是耗尽目标的资源，从而阻止大客户获取服务。长期以来，人们对网络基础设施的量子计算（安全）给予了高度关注，该基础设施一直被用于各种交易。互联网量子计算（安全）业务、学术界，甚至组织过多次此类主题会议的美国会议，都注意到了这一点\
  \ `[1, 2]`。已经提出了各种安全策略，每种策略试图解决一组不同的问题。匿名攻击是本研究关注的特定风险。因为源地址（SA）信息在攻击数据包中，因此在匿名攻击中，攻击者的身份对个人来说并非立即可见。\n\
  \n### 1.2.2 生活中的 DoS 攻击\n\n人们在 1989 年至 1995 年间调查了实际的 DoS 实例。三个常见的后果如下：51% 的案例中存在循环；33%\
  \ 的案例发生了网络下降；26% 的案例中某些数据被删除。单次事件可能导致受害者移动。DDoS 攻击可以通过两种方式进行：洪流攻击或逻辑攻击。\n\n追踪了互联网上\
  \ DDoS 攻击的数量、持续时间和位置。（2005 年 7 月份，有 350,000 台主机。某大学是 1999 年 8 月首次 DDoS 攻击的目标。这导致网络中断了两天。2000\
  \ 年 2 月 7 日，几个关键 Web 网站受到攻击，它们被断开了网络数小时。这些 DDoS 攻击偶尔会导致单个受害者产生约 1 Gbit/s 的流量。）\n\
  \n反散射（Backscatter）定义为受害者响应带有伪造 IP 地址的攻击数据包的自发移动。在 2001 年 2 月的三周调查中，针对 5,000 个不同受害者记录了超过\
  \ 12,000 次攻击。在真实网络中研究了数据分片。分片管理软件中的漏洞在各种 DoS 攻击中被利用，这种重点研究仍然暗示了此类 DDoS 的存在。\n\n\
  根据美联社报道，应急响应小组（CERT）运行部门于 2001 年 5 月遭到攻击。由于分布式拒绝服务（DDoS）攻击，其门户宕机几天。2002 年 10 月，所有根域名服务器都遭受了异常巨大的\
  \ DoS 攻击。由于攻击造成的破坏，某些 DNS 请求无法到达根服务器。2004 年 6 月 15 日，针对 Akamai 内容分发网络（CDN）名称服务器发起了第二次\
  \ DoS 攻击，导致访问中断近两小时。影响最大的地方是苹果公司、谷歌、微软和雅虎。这些公司已将其 DNS 服务外包给 Akamai 进行服务更新。\n\n##\
  \ 1.3 相关工作\n\n\n\n\n拒绝服务（DoS）攻击已被广泛认为是互联网的严峻威胁。攻击者通过向目标网络涌入大量流量，导致网络服务不稳定或完全不可用。识别这些攻击对于防止其再次发生至关重要。为了完成这项任务，必须评估隐藏、模拟或伪造攻击的可利用性。在信息技术领域，这被称为信息学回溯劣势（informatics\
  \ Trace back disadvantage）。数据包标记是通过路由器在沿沿攻击路径传输的数据包中放入自标识性数据来实现的。在 PPM 路由器中，数据包用概率分布进行标记。受害者节点接收到的标记数据包数量决定了其重建攻击路径的能力。我们发现，在分析\
  \ PPM 中所有路由器的特定标记概率效能时，来自远程路由器的标记数据包极有可能被下游路由器注意到。整体结果是数据包数量减少，而数据量却增加。通过允许每个路由器调节标记概率，可以实现更均匀的分布。动态技术的目标是在确定路由器在攻击路径中的位置时考虑位移因素。然而，许多方法依赖于底层协议，需要使用路由器来管理关于庞大网络中潜在受害的数据。这增加了路由器的开销并消耗了大量时间。正如本研究所示，我们非常希望提出一种方法，根据信息头内部的\
  \ 8 位 TTL 字段动态设置标记概率值，该字段可以直接被路由器访问，无需外部协助。我们可以使用预测的 TTL 值作为确定数据包放置在攻击路径何处的技术，并利用\
  \ TTL 值作为对数据包所覆盖距离的估算来推导出标记概率值。我们创建了一个用户友好的计算机，通过模拟各种测试场景来模拟该算法。我们的动态方案在路由器和目标端消耗更少资源的同时，更精确地重建攻击路径，这是成功的。该方案预期的主要优势是其简单性和低路由器开销，但通过采用产生相似结果并在广泛攻击范围内性能优于静态方法的动态方法，可能会获得巨大的价值。\n\
  \n### 1.3.1 概率数据包标记 (PPM)\n\n新方法具有增加网络开销、路由器处理和节点处理的潜力。近年来出现了许多备受关注的解决方案，包括使用概率数据包标记（PPM）。在该领域引入副学学习以扩展概率数据包标记主题，该主题极大减少了重建攻击者路径所需的数据包数量。\n\
  \n#### 1.3.1.1 DoS 攻击\n\n拒绝服务（DoS）攻击可能证明是网络连接的严重障碍。如果将伪造的 IP 地址反射回其原始源，就可以避免某些拒绝服务攻击，从而对犯罪者进行惩罚或对攻击进行研究。为了对抗拒绝服务攻击，设计了\
  \ IP 回溯算法以允许概率数据包标记（PPM）。\n\n与选定数据包标记和电子消息方案相比——由于攻击者伪造了数据包中的标记字段，这些方案难以回溯——Kihong\
  \ Park *等人* [\\[1\\]](#c01.xhtml#ref1) 计划概率数据包标记（因其效能和实现能力而受到关注）将带来显著的投资回报（ROI）。\n\
  \n#### 1.3.1.2 FDPM\n\n根据 Yang Xiang *等人* [\\[2\\]](#c01.xhtml#ref2)，提出了一种名为柔性确定性标记（FDPM）的独特策略，用于处理大规模\
  \ IP 回溯攻击，这在未来可能有效减少 DDoS 攻击的受害性。在 DDoS 攻击期间，目标站点或网络持续受到虚假 IP 数据包的轰炸。IP 回溯技术允许您将\
  \ IP 数据包追溯到其源点。FDPM 通过为追踪 IP 数据包提供多个可调选项（包括概率数据包标记 PPM 和确定性数据包标记 DPM）改进了数据包追踪。\n\
  \n#### 1.3.1.3 通过扩展 ns2 建立仿真环境\n\n开发用于在各种网络条件和恶意攻击模式下测量回溯 IP 地址所需时间的模拟环境和方法论至关重要。本文提供了各种\
  \ PPM 算法的比较，以及如重建攻击者路径所需的数据包数量、计算质量和误报率等指标。\n\n为了模拟各种 PPM 方法，Li *等人* [\\[3\\]](#c01.xhtml#ref3)\
  \ 使用了 ns2 的扩展版，结合攻击性拓扑结构和流量。该模拟技术也可用于测试模拟 DDoS 攻击对各种 PPM 系统的影响。\n\n## 1.4 提议的方法\n\
  \n### 动态概率数据包标记\n\n\n\n\n标记信息丢失、攻击路径重构困难、精确率低等问题，是概率数据包标记（PPM）最常见的后果之一。本研究利用了一种替换技术（DPPM），它进一步改进了原始预防方法（PPM）的性能。我们并没有建议固定的标记概率，而是先确定数据包是否被标记，然后从可用可能性中选择最可接受的标记概率。DPPM\
  \ 的采用可能解决 PPM 的大部分技术难题。DPPM 在大多数领域都优于 PPM，仅有一个例外。\n\n由于公共计算机的广泛使用和网络基础设施的扩展，互联网对现代生活以及社会经济领域产生了巨大影响。犯罪行为变得日益普遍，导致了巨大的财务损失。极易实施的分布式拒绝服务（DDoS）攻击对通信基础设施造成了破坏。针对互联网协议（IP）的监控技术可用于追踪补救攻击所需证据的传递。\n\
  \n拒绝服务（DoS）攻击是试图防止 Web 程序为其预期的客户提供服务，通过挂起或关闭服务来实现暂时阻止，通过使应用程序无法运行来实现永久阻止。分布式拒绝服务（DDoS）发生在攻击流量超过单个（在某些情况下是多个）信息科学地址时，如图\
  \ 1.1 所示。从没有客户到来或未对企业活动产生干扰的角度来说，商店或公司的大门就像一个聚集地。\n\n### 1.4.1 拒绝服务\n\n拒绝服务（DoS）攻击是一种延迟或限制资源流的攻击。拒绝服务攻击也可以由人为错误、审美缺陷或计算机代码漏洞触发。资源不当利用的另一个例子是时间敏感任务的延迟。在这一定义领域，有资源测量、处理能力、磁盘空间和内存以及静态内存结构的示例。在\
  \ ANSI 2000 中等精度中，攻击（不应成功的攻击）被称为量子（安全）违背。由于 DoS 攻击的基础已经奠定，可以使用它。\n\n![图 1.1 DDoS\
  \ 攻击。](img/fig1-1.jpg)\n\n`图 1.1` DDoS 攻击。\n\n### 1.4.1.1 直接 DDoS 攻击\n\n大量的供应主机试图在发送攻击流量的同时防止受害者消耗资源或拒绝受害者访问资源。关联级代理是被黑客的服务器，用于在与\
  \ DDoS 攻击关联发送攻击流量（也称为守护进程、僵尸或机器人）。主节点是一组被标记为此类类的过时代理。DDoS 网络由一组链接的主节点代理集合组成，它们都已准备好在\
  \ DDoS 攻击期间帮助攻击者。直接 DDoS 攻击和反射攻击是两种分布式拒绝服务（DDoS）攻击。\n\n### 1.4.1.2 分布式 DDoS 攻击\n\
  \n由于许多供应主机在发送攻击流量的同时试图关闭或篡改受害者提供的资源，攻击经常被延迟。在 DDoS 攻击期间，会利用被劫持的主机来传输攻击流量。主节点是一个具有过时代理集的受损主机操作。在\
  \ DDoS 攻击背景下，DDoS 网络定义为一组链接的主节点代理的分级集合，帮助攻击者以更少的精力组织 DDoS 攻击。反射攻击和直接命中是两种 DDoS 攻击。\n\
  \n### 1.4.1.3 反射 DDoS 攻击\n\n在供应科学领域，从属僵尸（代理）将包含受害者地址的数据包提供给毫无防备的第三方，这些第三方相继地向受害者（未受感染的计算机，如\
  \ Web 服务器、DNS 服务器等）发送回复。（淹没受害者）反射攻击可以影响至少两个个人。由于需要额外的设备和涉及更大的带宽，反射攻击将更具破坏性。它也更难追踪。\n\
  \n## 1.5 修正概率数据包标记的回溯机制\n\n互联网捕获了银行、商业、交通、医疗保健和通信等许多关键基本服务的部分或全部服务。根据当前数据，约有 4 亿主机连接到互联网，目前目前有超过\
  \ 40 亿互联网用户。因此，任何网络中断对许多人来说都是极其不便的。DoS 攻击的性影响引起了科学家和研究人员的关注，导致了各种痛苦的过程。另一方面，对需要成千万台受损\
  \ PC 的高度分布式 DoS 系统的攻击大多数失败了。防御拒绝服务（DoS）攻击的关键阶段是回溯科学。\n\n数据包标记技术用于以随机方式加密路由器内部数据包的边缘数据。之后，受害者通过已知受害情况使用康复方法构建攻击路径。在过去，科学领域规划了若干回溯程序。主要研究了概率数据包标记（PPM）方法。在一种极\
  \ PPM 技术中，路由器概率地在数据包上盖上其标识数据，允许目标通过组合几个具有相似特征的数据包来重建网络路径。由于终止条件没有明确指定，PPM 规则在现有系统中存在各种问题。有必要拥有必要的配置信息。\n\
  \n### 1.5.1 数据包标记过程简述\n\nDoS（拒绝服务）攻击[4–6]，其中医疗保健助手试图构建一个目标主机（称为受害者）[#7, 8]，由于主机的大范围数据包[\\\
  [9\\]](#c01.xhtml#ref9)，可能是 Web 量子[14, 15]（安全）的最严重威胁之一。近年来，DDoS（分布式拒绝服务）攻击在互联网上有许多攻击者的地方已变得普遍。从护理路径的某个阶段到下一个阶段，我们设定了该关联在护理包中的课程。IP\
  \ 回溯是一种针对 DoS/DDoS 攻击的防御机制。在 IP 回溯系统中，每个路由器攻击关于存储自身信息或数据包信息的方法。受害者然后使用这些信息追踪违规者。IP\
  \ 回溯系统将数据包标记（DPM）分为两类：概率（短 PPM）方法和实际数据包标记。在 PPM 协议中，每个路由器几乎肯定在其接收的数据包上写入路径信息。相反，IP\
  \ 回溯协议生成所有的协作样本数据包并在自身存储路径信息。PPM 和工作方法有许多优点。`图 1.2` 显示了量子无人机框架。\n\n![图 1.2 量子无人机。](img/fig1-2.jpg)\n\
  \n`图 1.2` 量子无人机。\n\n### 1.5.2 数据包标记\n\n\n\n\nPPM 不需要消耗路由器存储资源，尽管在攻击树重建之前，它通常需要受害者接收一个超大数据包。另一方面，工作方案中用于攻击树恢复的数据包数量可能较低。尽管如此，工作计划在路由器上需要大量的负载和巨大的机箱空间。现在针对当前的溯源信息处理协议示例，让我们考虑添加\
  \ `RIHT`：一种混合信息处理溯源主题，通过计算 `p.mark` 值来查找数据流并寻找攻击。这项涉及到大量的计算，需要大量的时间。\n\n### 1.5.3\
  \ 路径选择\n\n路径描述了指定的数据包或文件如何从交付点到达目的地。所有路由器的上行接口必须检测并存储在接口表中。接口表可以描述所选的源和目的。\n\n###\
  \ 1.5.4 数据包发送\n\n在包或文件处理中，数据包交付如下：数据包通过提供的路由从源 LAN 到目的 LAN。当目的 LAN 接收数据包时，将检查其是否已送达。\n\
  \n### 1.5.5 数据包标记与日志\n\n在每个数据包头部上，有一个五位区域设计为计数器。在我们的示例中，如果路由器决定以特定概率采样数据包 `P`，则\
  \ `P.counter` 设置为一，在路由器上保存某些数据，并将数据包最终发送到相邻路由器。因此，计数器值越高，攻击路径上的路由器存储 `P` 数据就越多。句话说，在攻击树恢复后，具有高计数器值的数据包是有利的。因此，如果我们倾向于以概率方式将高计数器值的数据包相对于低计数器值的数据包。\n\
  \n### 1.5.6 路径重建\n\n在使用 `Formula 3` 时，数据包到达目的地后，它将检查确定是否是从正确的上行接口广播的。如果检测到攻击，攻击将尝试重建路由。路径重建是为持续供应发现新路径的过程，结果是产生一个无法被攻击的目的地。\n\
  \n现在的每一次重大网络攻击都包含 DoS 或 DDoS 攻击。虽然相对容易发生，但可能会造成重大损害。DoS 攻击消耗大量的系统资源，导致用户无法使用常规服务。虽然电子邮件已成为最流行的通信模式，但\
  \ DDoS 攻击正变得越来越常见。\n\nLee 和 Fung 展示了如何利用主要基于公钥活动的认证方法进行 DoS 攻击。目前正在考虑许多针对 DoS 攻击的替代防御。Su\
  \ *et al.* 设计了一种基于估计的相关攻击流量源初始特征的互联网策略，以限制 DDoS 攻击的危害。\n\nHuang *et al.* 计划使用关联奖励、协作过滤和协作缓存来帮助\
  \ DDoS 攻击的受害者。因此，攻击源的位置至关重要。因为在路由器向当前协议发送数据包后，源地址并未被移除，我们选择不在攻击数据包的科学协议头中接受源地址。\n\
  \n## 1.6 结论\n\n良好的包标记策略可以减少追踪胜利路径所需的数据包数量，并缩短识别错误者真实源的时间。数据包标记技术有两种：静态概率标记和动态概率主题。在\
  \ PPM 中，我们并不总是能从远程路由器获取足够的标记包，这在 IP 跟踪中引起许多问题，并延长了重建受害者的时间。我们开发动态概率替换方法的目标是在短时间内从远程路由器产生足够数量的标记包，以便进行更快、更可靠的溯源。\n\
