  \n*   计算步骤中的错误修正仍然不完全可靠。正因如此，计算可能不准确。由于量子比特不是数字数据位，它们无法利用经典计算机采用的传统纠错技术。\n\n*  \
  \ 在检索计算结果时可能会发生数据损坏。某些创新（如特定的数据库搜索算法）具有潜力，这些算法可以保证量子状态在测量时退相干为正确的响应。\n\n*   量子加密和安全尚未充分发挥其全部潜力。\n\
  \n*   由于比特数量稀少，量子计算机无法充分发挥其效能。研究人员尚未产出超过 128.7 个比特。\n\n### 20.1.3 量子计算机对比 经典计算机\n\
  \n与传统计算机相比，量子计算机的设计更为简单。它们缺乏 `CPU` [\\[5\\]](#c20.xhtml#ref5) 和内存。一组超导比特就是量子计算机需要的一切。量子计算机处理信息的方式与传统计算机不同。随着比特的增加，其处理能力呈指数级增长。传统处理器使用比特来运行不同的程序。随着额外比特的增加，其功率线性上升。传统计算机的处理能力要低得多。对于常规操作，传统计算机表现良好且错误率低。例如，进行模拟、评估数据（如化学或药理试验）以及开发高能电池都是量子计算机最擅任的任务。但它们也可能产生许多错误。传统计算机不需要特殊的维护。它们可以使用简单的内部风扇来防止过热。而量子计算机则需要极低温环境以及对即使是微小震动的保护。为此，需要超冷超流体\
  \ [\\[6\\]](#c20.xhtml#ref6)。与传统计算机相比，量子计算机的成本更高，构造也具挑战性。图 20.1 显示了传统计算机与量子计算机的区别。\n\
  \n![图 20.1 传统计算机与量子计算机的差异 \\[1, 2\\]](images/fig20-1.jpg)\n\n图 20.1 传统计算机与量子计算机的差异\
  \ \\[1, 2\\].\n\n### 20.1.4 深度探讨量子计算机\n\n量子计算机 [\\[6\\]](#c20.xhtml#ref6) 也不例外这一规律，即新技术既带来了新的潜力，也带来了新的威胁。尽管企业和政府正向量子技术投入数十亿美元，但在利用率和应用场景方面仍有许多未解决的疑虑。由于滥用、误用或不可预见的后果导致的潜在伦理问题，是量子领域“已知的未知”之一。领导者必须建立适当的伦理边界，以保护其组织和声誉。当然，为一种当前用途和能力尚模糊的技术建立屏障是一项困难的任务。\n\
  \n鉴于其广泛部署时间的不确定性，现在担心量子计算的伦理影响似乎可能为时过早。然而，这一时刻是理想的。未能预见潜在伦理问题的后果却是严重的。\n\n### 20.1.5\
  \ 与量子计算相关的三个潜在伦理问题\n\n量子技术 [\\[8\\]](#c20.xhtml#ref8) 仍在发展中。在未来几年内，财富 500 强企业将采用。\n\
  \n### 20.1.6 开放中的敏感数据\n\n网络安全最意料之外的危险无疑无疑量子物理学的出现和发展。埃因霍夫科技大学的 Tanja Lange 教授警告道：“如果没有保护，多年后，量子计算机将能够破解它。”\n\
  \n### 本章结构\n\n剩余章节划分如下：第 20.2 节阐述了设计与方法；第 20.3 节说明了量子如何破坏现有保护措施；第 20.4 节暗示了量子可能产生的危害；第\
  \ 20.5 节阐述了量子伦理的未来；第 6 节总结本章。\n\n## 20.2 研究设计与方法\n\n为了寻找相关的现有研究，我们进行了全面的文献综述。我们在这一部分概述了目标并提出了研究问题。此外，我们描述了研究方法、最终论文的选择标准以及纳入和排除参与者的标准，所有这些都将有助于研究得出对量子网络安全的全面分析。\n\
  \n### 20.2.1 研究目标\n\n在评估了本文的目标后，我们仔细评估了以下需要解决的研究问题：\n\n\n\n\n\n虽然量子计算似乎具有彻底改变许多业务的潜力，但网络安全正面临着其出现而带来的威胁。量子计算还可能使传统的加密方案失效。\n\
  \n### 20.3.1 量子技术对网络安全的风险\n\n网络安全受负面影响的范围尚不为人知。不过，量子计算会在某些特定领域影响网络安全 \\[2, 4\\]。破解\
  \ `RSA` 加密就是之一。\n\n`RSA` 加密技术经常用于通过互联网传输敏感信息，它基于 2048 位整数。根据该领域专介绍，量子计算机解密此类数据需要\
  \ 7000 万 `qubits`。由于目前只有一台拥有 53 个 `qubits` 的量子计算机，解密数据可能还需要一段时间。然而，考虑到企业发展速度之快，在未来十年内忽视第一批量子计算机的诞生是不现实的。\n\
  \n利用量子计算进行隐蔽网络攻击的威胁者是量子计算对网络安全的另一个问题。目前大多数软件都无法识别来自量子计算的许多危险行为和迹象。\n\n#### 20.3.1.1\
  \ 如何通过使用量子计算改进网络安全\n\n随着采用率的提高，量子计算对网络安全应用场景带来的危险只会加剧。然而，这并不意味着企业不能利用量子计算来提高其网络安全。行业内部对量子计算持乐观态度，并预测网络安全将从隐私和加密技术中受益。\n\
  \n### 20.3.1.2 与量子计算机相关的风险\n\n量子计算机很快将变得如此，能够模拟极其复杂的系统。物理、航空航天工程、网络安全以及许多其他领域的模拟都可能受益于此。然而，一旦这种计算机被建成，它可能能够破解数据加密规则。由于它能够扫描远距离以寻找附近的网络设备或开放的应用，它还可能危及物理隔离（air\
  \ gaps）。这意味着外部黑客可能会发现入侵变得更容易。他们可能已经通过网络浏览器漏洞等不同手段访问了你的计算机或计算机系统。如果你不锁好所有的门，你可能会让他们的操作变得简单得多。\n\
  \n量子计算机提供了一种根本性的新计算概念。这种理解有一天可以被应用于解决目前被认为绝对无法解决的问题。根据量子计算研究人员的说法，该领域似乎非常有潜力。它是人工智能中最引人入目的理论工具之一。将其想象成一台被程序化了大量领域知识的高级计算器吧。量子计算有可能为广泛的数学、科学和医学问题提供解决方案，而人类原本可能缺乏解决这些问题的勇气。它们可能帮助突破目前无法攻破的庞大数据库，也可能会发现微小的细节，例如地质特征，在海啸发生很久以前警告我们。它们承诺在成像技术方面取得巨大进展，足以竞争实验性的细胞内\
  \ MRI 扫描。\n\n目前，密码学被用于加密数据以便其在互联网传输时得到保护，从而维护在线通信的隐私。一切都是安全的，包括远程办公邮件访问和网上网购。尽管量子计算能力正在迅速扩展，但行业专家估计，到具有极高数量\
  \ `qubits` 的量子计算机准备好至少还需要 10 年。\n\n量子计算机上的算法可能击败目前的现状。\n\n### 20.3.1.3 执行人员面临的最紧迫问题是什么？\n\
  \n在我看来，领导者目前面临的最大困难是意识到网络安全的成本往往成为一种负担。\n\n\n\n\n\n加密加密的基本原则是必须存在密钥（或解锁代码）才能读取加密文件。由于密钥越长，计算机解密所需的时间越长，因此您的文件会更加安全。\n\
  \n为了更直观地说明，2002 年，一个 64 位密钥在经过四年的劳动和 30 万人的参与后被破解。而使用 128 位密钥加密来找到匹配的密钥可能需要数十亿年。\n\
  \n为了提高安全性并让消费者做好应对量子计算到来的准备，美国标准与技术研究院（`NIST`）已将行业标准的密钥长度协议从 128 位增加到 256 位。\n\n\
  然而，密码学 [\\[11\\]](#c20.xhtml#ref11) 只是谜图中的一个部分。无论您的加密和签名程序有多安全，都不可能防止有人打开恶意附件或点击欺骗性链接。在量子时代，机构可能会因为软件漏洞、访问滥用和其他与人类相关的问题而损失无法想象的资金。\n\
  \n### 20.3.3 保护好自己免受这些威胁\n\n包括 5G、带有机器学习的 AI 和量子计算在内的许多技术显著推进了数字化进程。但通常情况下，新技术在所有漏洞被识别和修复之前就已经引入了。我们可以说，过时的网络安全\
  \ \\[2, 4\\] 系统是这种情况的原因。\n\n机构应该专注于构建一个凝聚的网络安全生态系统，以监控网络、识别漏洞并解决安全担忧，因为量子计算的底层理论将使我们目前的加密机制过时。\n\
  \n公司可以采取以下步骤保护自己免受潜在风险：\n\n### 20.3.3.1 实施行业安全指南\n\n当 COVID-19 迫使每个人发现新的沟通、工作和经营方法时，大多数人通过使用数字互联网工具和联动设备找到了他们的“新常态”。随着新互联网用户涌入带来的远程就业机会增加，企业和客户面临危险显著增加。\n\
  \n根据 `NIST` 最新的行业建议，对于影响较小的数据，密钥加密强度应至少为 128 位；影响中等的数据为 192 位；影响高昂的数据则为 256 位。\n\
  \n通过强制执行资产发现、漏洞评估、持续安全监控和事件报告的网络安全技术，获得 ISO 合规性也有助于保护您的公司。\n\n### 20.3.3.2 建立零信任\n\
  \n无论是否强制，通过遵守行业安全标准都可以提高您的技术网络安全，但使用零信任验证程序有助于降低与人为错误相关的风险。\n\n诈骗者非常狡猾，他们经常利用社会工程技术获得他们想要利用的人的信任，并从中获取个人信息、资金或凭据。欺骗和钓鱼等社会工程技术包括攻击者冒充信任的用户，在网络中传播恶意软件或获取敏感的登录数据。\n\
  \n欺骗和钓鱼等攻击可能非常隐蔽。事实上，目标个人会打开高达 30% 的钓鱼邮件和短信。另有 12% 的用户会选择受感染的附件或链接。\n\n通过根据需求而非公司内部来分配访问权限，零信任协议可以减少钓鱼和其他社会工程攻击的影响。由于没有一个人被信任掌握所谓的“王国的钥匙”，这防止了在凭据泄露时发生敏感信息外泄。\n\
  \n### 20.3.3.3 部署自动化工具\n\n有多种网络安全防护措施旨在减少人为错误对组织可能造成的负面影响。此外，除了降低生产力外，手动解决漏洞、监控网络和响应数据泄露可能会导致更多错误。\n\
  \n因此，尖端的安全公司实施了自动化技术来帮助他们维护网络的完整性。自动化技术可以比人工更彻底、更快速、更高频率地分析数据。\n\n根据对网络安全采用情况的最新研究，95%\
  \ 的公司已经自动了某些网络安全程序。此外，研究显示，98% 的受访者打算在未来一年内自动化更多的手动安全程序。此外，这表明不实现安全措施自动化的公司面临落后的风险。\n\
  \n### 20.3.3.4 实施受控威胁检测\n\n切换到抗量子网络安全方法似乎具有挑战性，这就是为什么拥有受过培训的专家可能会有所优势。通过可靠的公司使用托管威胁检测是确保您的网络安全环境不受损害的最佳方法。通过托管威胁检测和响应服务的帮助，您可以为您的业务配备最好的安全工具，获得持续监控，并在最需要的时候获得响应支持。\n\
  \n### 20.3.4 潜在威胁和现有风险\n\n### 20.3.4.1 网络安全\n\n一些专家预计，在十年内，敌对国家和黑客可能利用量子计算机来破解当前的加密技术。对于许多依赖加密的在线业务（如电子商务和其他虚拟金融操作）来说，这将是一个沉重的打击。区块链平台开发者需要调整其系统以使用后量子密码学，这凸显了热门区块链技术\
  \ [\\[11\\]](#c20.xhtml#ref11)，如以太坊和比特币的网络安全协议的脆弱性。\n\n可以通过变得“加密敏捷型”来应对量子计算机带来的日益增长的网络安全风险。为了能够更好地响应快速出现的新协议、标准和安全风险，企业必须能够快速更新其加密算法、设置、流程和技术。这被称为“加密敏捷”。使用这种策略的机构必须对其数据、数据交换和用于保护这些数据的加密技术进行清单。根据美国标准与技术研究院的，企业应该在抗量子加密标准可用时就开始准备实施。\n\
  \n### 20.3.4.2 访问\n\n由于物理和技术上的复杂性，普通人或小型组织是否永远能够拥有量子计算机尚存疑，但并不意味着他们不能从中受益。如果政府和机构希望公平地推动所有人进入技术采用曲线，他们应该考虑如何分配量子计算机获得的知识。如果我们作为一个社会认为这至关重要，他们有各种杠杆可以使用，例如赠款、补贴和其他政策，可以加速全球范围内的访问。创建和拥有该技术的供应商也可能发挥作用。投资者正越来越多地使用治理、社会和环境标准来评估他们投资的公司，许多企业现在高度关注多样性、公平性和包容性。致力于量子计算系统的开发的科技公司可能会让这两个计划都关注平等访问。\n\
  \n### 20.3.4.3 人工智能、数据采集与隐私\n\n\n\n\n\n近年来，人们在保护数据隐私以及确保人工智能技术以公平且符合共同利益的方式进行利用方面做出了巨大努力。尽管采取了这些措施，广泛的数据收集仍在继续。量子计算的出现可能会进一步促使企业获取更多消费者数据，从而加速已经发生的数据收割。未来的量子计算机将能够比今天最先进的服务器更快地处理海量数据。\n\
  \n### 20.3.4.4 可解释性\n\n量子计算机，特别是量子机器学习，带来了终极的“黑箱”挑战。机器学习的开发者已经意识到了这个问题。深度学习的神经网络以其极度不透明而闻名。然而，该领域的专家正在开发相关工具，可能使揭示模型的内部运行机制变得可行，从而理解它们是如何得出解决方案的。尽管这些解决方案具有局限性，但在理论上，可解释性至少是可能的。\n\
  \n量子机器学习加剧了模型可解释性的难度。对于量子计算机而言，可解释性与其说是编程问题，不如说是物理问题。因为量子算法将在更多数据点上识别出比当前机器学习模型复杂得多的模式，评估和评价决策过程将变得具有挑战性。可解释性的现有问题将进一步恶化。\n\
  \n### 20.3.4.5 全球紧张局势与量子“军备竞赛”\n\n如今，大多数工业化国家正在量子技术领域巨额投资。预计 2022 年，中国、印度、日本、德国、荷兰、加拿大和美国在量子技术的投资将达到\
  \ 50 亿美元。\n\n由于量子计算被认为是开发未来防御系统的关键，这种情况有时被称为新的全球“军备竞赛”。鉴于我们目前处于技术开发的早期阶段，“军备竞赛”是否是一个准确的术语还不清楚。尽管如此，我们知道故事可能会产生自身的生命力。将获取量子能力的努力定位为军备竞争，可能会无意中导致国际紧张局势升级。随着各国继续研究量子技术，我们建议在将其称为“军备竞赛”时保持谨慎。\n\
  \n## 20.4 将产生的新风险\n\n在许多可能的新风险场景中，示例包括：\n\n### 20.4.1 医疗保健与生命科学\n\n为了更好地理解微小基因变化的影响，生物医学研究人员将受益于量子计算机的使用。基因编辑本身就是一个争议性的话题，但量子计算带来的新型、更快速的研究方法可能会增加担忧。这并不是说应该停止\
  \ DNA 编辑。与其他优势一起，它可能会根除许多遗传性疾病。但从事该领域研究的人需要警惕其努力可能产生的任何意外后果。\n\n### 20.4.2 新兴材料\n\
  \n预计量子计算机将加速新型材料的研发。它们可能会对分子层面的微小变化如何影响材料属性进行复杂的模拟，这将为药物发现、碳捕获和化学制造等领域提供巨大帮助。然而，新材料的历史表明，看似良好的事物实际上经常可能是有害的。例如，杀虫剂\
  \ DDT 在最初引入时被认为是一个明显的益处，因为它能够降低由昆虫传播疾病的风险。\n\n然而，当人们发现其使用正在破坏鸟类种群时，它在世界上大多数国家被取缔。这类似于塑料最初受到人们的热烈欢迎。直到最近，我们才开始理解它们对环境可能造成的伤害。材料研究人员在尝试开发新材料时应该意识到这段历史，并努力防止任何未来的科学进步产生类似的环境问题。\n\
  \n## 20.5 量子伦理的未来图景\n\n与量子计算相关的许多伦理问题仍处于未来，因此无法迅速解决。但每一天，它们都变得越来越近。政府和企业可以立即采取某些步骤，为量子技术的未来做好准备。\n\
  \n利益相关者可以开始考虑可能出现的困难，并理解他们对量子计算的使用在未来可能引发伦理问题。好消息是，他们可以继续之前的努力。现有的伦理框架有助于理解技术如何影响社会，其中许多核心要点适用于量子计算。这些可以帮助高层领导考虑如何从一开始就将伦理纳入他们的工作中。\n\
  \n组织的量子战略应由这种理解来指导。在伦理和量子计算领域采取立即行动可能还时机过早。然而，企业应该召集内部高管和专家，以识别指示需要采取行动或增加支出的触发事件，例如新技术的开发或竞争活动。制定一个可靠的量子技术策略应该包含降低伦理风险的方法。\n\
  \n等到问题完全显现再做打算可能太晚了。现在理解量子计算带来的伦理问题，将使未来更容易应对长远影响。\n\n### 20.5.1 量子计算正走向成熟\n\n关于量子技术及其高远目标的炒作在头条中随处可见。以下是与此相关的一些问题：\n\
  \n*   鉴于在医学研究、金融建模、应对气候变化、交通优化、电池等领域具有产生革命性进展的潜力，现在是投资的理想时机吗？\n*   我们对量子计算破坏现有加密标准的可能性应该有多多大的关注？\n\
  *   当商业和技术高管寻求为现在和未来做出明智决策时，需要做什么来为由量子技术实现的未来做好准备？\n*   从现在开始需要考虑并可能减少哪些来自未来的风险？\n\
  \n图 20.5 显示了量子技术是如何扩展的。\n\n![图 20.5 量子技术是如何扩展的 \\[2, 3\\].](images/fig20-5.jpg)\n\
  \n`图 20.5` 量子技术是如何扩展的 \\[2, 3\\]。\n\n## 20.6 结论\n\n本研究探讨了量子计算的潜在危险和道德风险。量子计算的力量是巨大的。我们不能仅仅依靠技术部门来保护我们免受这些危险。政府法律应该是答案的一部分，但它们的发展通常需要数年。准备采用量子技术的领导者应该立即保护他们和他们的客户。现在他们有机会可能规避由“快速行动，破坏一切”时代所留下的伦理问题。\n\
  \n一切都会随着量子计算而改变，包括应用、在线开发、网络安全等。当新功能被引入时，领先一步是一个好主意，这样你的公司就准备好了所需的信息和资源以生存新元的黎明。\n\
