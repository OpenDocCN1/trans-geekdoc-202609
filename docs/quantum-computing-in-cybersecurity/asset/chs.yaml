  \ |\n| D-Wave System | 2020 | 5640 个量子比特 |\n\n## 18.4 使量子计算可能的组件与概念\n\n量子计算机是执行量子计算的设备。量子计算机使用量子比特来执行量子计算。利用叠加和纠缠等量子现象进行计算被称为\
  \ QC。\n\n### A. 量子比特\n\n量子信息的基本构建块是量子比特，或 qubit 10。传统的比特只能存在于两种可能状态之一，即 `0` 或 `1`。然而，根据量子物理学，量子比特的通用态可以是两者的相干叠加，即\
  \ `0`、`1` 或 `0` 与 `1` 的量子叠加。\n\n### B. 量子算法\n\nQC 23 方法使用计算的量子电路模型，这是量子计算的现实表示。量子算法是可以在量子计算机上执行的一系列步骤。“量子算法”一词是指任何似乎在根本上是量子性的，或使用了量子处理的关键方面（如量子叠加或量子纠缠）的算法，即使所有传统算法也可以在量子计算机上运行。量子计算无法解决传统计算机无法解决的问题。由于它们利用了经典计算机无法有效利用量子叠加和纠缠概念，量子算法可能比经典算法更快地解决某些问题。\n\
  \n### C. 量子计算机原理\n\n局限性和叠加概念是量子计算的基础。\n\n*   **叠加** 22 – 叠加指的是一种量子现象，即量子系统可以在同一时刻存在于多个状态或位置。一个“量子比特”可以同时存储“0”和“1”。叠加这种同时存在于多个状态的能力赋予了量子计算优于传统计算机（传统计算机一次只能做一件事）的力量、效率和速度优势。量子计算可以同时进行许多计算，这意味着它们解决问题比普通机器快得多——这些问题传统计算机需要多年才能解决。它使得量子计算机的量子比特能够同时执行多次操作，使其比传统计算机更快。\n\
  \n量子力学中的一个关键概念是量子叠加，它描述了两个或多个量子态如何被“叠加”以创建一个新的有效量子态。每个量子态都可以表示为两个或多个不同独特态之和，这就是这种现象的结果。\n\
  \n*   **纠缠** 22 – 量子纠缠是一种物理现象，发生在一组粒子被创建、相互作用或共享空间邻近时，导致其状态无法被独立地描述，即使粒子之间相隔很远。当两个量子比特纠缠时，它们之间存在一种特殊关系。虽然系统的部分不处于确定态，但整体的量子态是可以表示的。对单个量子比特的测量可能是\
  \ `0` 或 `1`。然而，一个量子比特的测量结果将与另一个进行比较。\n\n## 18.5 量子计算机未来发展的计划\n\n### A. 未来发展\n\n\
  对量子技术的巨大投入将使量子物联网和全球互联网等概念更近现实。论文 12 中的发现揭示了一种新型漏洞，允许 `N≥3` 个具有量子能力的敌对群体对全球态造成最大的损害。这些攻击很难识别，因为它们不会改变\
  \ `Hamiltonian`，且不会导致纯度丢失。它们不需要实时通信，而且可以在几分秒内结束。作者进一步断言，鉴于当今极端分子、叛乱和恐怖组织的统计特性，此类行为将被放大。未来的量子技术可以整合到冗余传统网络中作为防御。\n\
  \n### B. 量子计算发展的投资\n\n利用量子物理原理来保护数据是防止窃听的方法之一。已经有资金投入开发和测试量子互联网，这将使通信几乎完全安全并禁止窃听。2021\
  \ 年，量子计算行业的预计规模为 4720 万美元，到 2026 年，预计将达到 17 亿美元。量子研究正在快速增长，各国正投入巨资进行量子技术的发展。有些国家希望成为量子计算机技术发展的全球领导者，有些国家希望加入量子国家行列，而有些国家不想在量子竞赛中被抛下。\n\
  \n各国也应该考虑其阴暗面，并开始投资研究以防御量子计算机因其巨大的计算能力而带来的威胁。表 18.2 显示了不同国家在量子计算机及其技术发展方面的投资对比。\n\
  \n\n\n\n\n量子时代的网络安全能够在量子时代网络攻击造成伤害之前对其进行识别和预防。但它可能变成一把双刃剑，因为 `QC` 也可能产生这样一种网络攻击，扰乱人类生存的领域，创造一个机器人、工作机器人的世界，或带来奇点的到来。\n\
  \n人工智能确实是计算机科学领域的一个热点。科学家们利用机器学习和神经网络，试图让人工智能更像人类。这听起来很可怕，但当你把 `Qcom` 加入方程式时，恐惧因素会显著增加。\n\
  \n我们对抗网络犯罪的最优防御是人工智能和 `Qcom`。在量子人工智能（`QAI`）的帮助下，我们可以检测并防止网络攻击甚至是网络战争。但如果网络罪分子利用\
  \ `QAI` 进行恶意活动怎么办？\n\n根据网络安全专家艾兰·伍德德（Alan Woodward）的话，“大多数黑客在入侵任何系统时都不会直接攻击。”他们会“绕行攻击，我预测问题将出现在这些实现中。即使理论上他们可以监听光纤电缆中的流量，现代攻击者通常也不会这样做。”如果黑客能想出这种技术，那么为了此类目的而开发的\
  \ AI 也能想出其他技术来实现同样的目标。我们已经看到 AI 在某些领域超越了人类，也许这个领域在未来也是其中之一，谁知道呢？当 AI 和量子计算机共同工作时，它们可以实现我们作为人类永远无法想象的状态，这将对人类文明构成威胁。\n\
