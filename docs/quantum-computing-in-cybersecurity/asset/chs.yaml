  \n## 27.1 引言\n量子计算（QC）日益被认为是军事领域潜在的规则改变者，有望在计算、通信 [1, 2] 和安全等领域带来巨大收益。特别是，量子计算机（Qcom）可以快速、安全地处理大量数据。这对于许多军事应用至关重要。量子计算机还可以用于开发新的、更安全的通信系统，并破解现有代码和密码学。\n\
