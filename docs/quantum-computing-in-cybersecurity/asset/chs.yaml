  \ |\n\n## 18.6 QC 的暗面\n\n### A. 过去对 QC 的预测\n目前使用的最流行的非对称算法基于困难的数学挑战，例如考虑大数，这可能涉及非常复杂的超级计算机并耗费数百年。\n\
  \n与此同时，1994 年，`MIT` 的研究人员 `Shor` 明，大型量子计算机可以在几天或几小时内解决相同的问题。未来的 `Qcom` 能够破解依赖`离散对数`或`整数分解`来实现安全的加密技术。\n\
  \n二十年后，在 2019 年，`Google` 的研究人员声称他们的设备已达到“量子霸权”。一台顶尖超级计算机完成相同的工作大约需要 10,000 年。\n\n\
  `Hudson Institute` 的创始人 `Herman Kahn` 在他 1962 年的著作《思考不可想象的事》中指出，即使是当时最乌托邦的愿景者也承认，先进技术的存在本身对人类文明构成了风险，这种风险在二十五年前是不可想象的。\n\
  \n与其困扰 `Kahn` 及其那代人在 20 世纪 50 和 60 年代的核末日，我们现在必须考虑量子末日。尽管它在物理和永久性破坏性上不如核攻击，但如果现在不采取适当措施来降低此类攻击的风险，可能会对我们的经济和社会造成不可弥救的伤害。\n\
  \n### B. 对 Qcom 的恐惧\n谁知道哪些技术没有在公开市场上提供，或者正被其他政府秘密使用？根据 `Topcoder` 的 `Morris` 的说法，“我担心在完成之前，我们甚至不知道能够执行此类任务的量子计算机已经存在……我担心它在我们意识到它存在之前就会发生。”\n\
  \n何时将建造起大型量子计算机是无法预见的。在过去，巨大的 `Qcom` 的物理可行性并不明确，但许多专家现在认为这仅仅是一个重大的技术问题。一些工程师甚至估计，在大约\
  \ 20 年后，将建成足够强大的 `Qcom`，使他们几乎可能破解目前所有的公钥技术。目前许多公钥加密很容易受到被 `Qcom` 解密的威胁。这将通过互联网及其他地方数字通信的完整性和安全性受到严重损害。\n\
  \n出于有害目的对 `Qcom` 的滥用被称为量子黑客。大多数人认为二进制传统计算机将用于发动网络攻击，但考虑到大规模量子攻击对关键基础设施造成的灾难性影响。在敌人手中，可以破解\
  \ `RSA 加密` 的量子计算机将对我们的关键基础设施和经济造成灾难性的后果。这类似于对常规战争演变为核战争的担忧。\n\n### C. 使用量子计算机的风险\n\
  *   **干扰**：在计算阶段，量子系统的微小扰动都可能导致量子计算崩溃。量子计算机在计算阶段必须与所有外部干扰完全隔离。\n*   **错误纠正**：计算中的单一错误就可能导致整个计算的有效性崩溃。\n\
  *   **输出观测**：在量子计算完成后检索输出数据存在损坏数据的风险。\n\n\n\n\n\n# 人工智能、数据采集与隐私\n\n尽管有各种数据隐私法以及各国政府和其他非政府组织的努力，前所未有的大数据采集仍在进行。正如我们过去所看到的，像\
  \ `Google` 这样的跨国公司的定向广告在预测人类行为方面非常准确。由于未来的 `Qcom` 将能够比今天最先进的服务器更快速地处理海量数据，`QC` 的可用可能会进一步激励组织收集更多的消费者数据，从而为已经进行的数据采集提供“超级动力”支持。这最终将导致更复杂的定向广告和人类行为预测。\n\
  \n大多数发达国家目前正在量子技术的发展上投入巨资，这正引发国际冲突 [[8]](#c18.xhtml#ref8)。在 2022 年，预计中国、印度、日本、德国、荷兰、加拿大和美国\
  \ [[13]](#c18.xhtml#ref13)将在量子技术领域总共投资 50 亿亿美元。由于 `QC` 被认为是开发未来军事系统至关重要，这种情况被称为一场新的全球性“军备竞赛”。将获取量子能力的尝试描绘为军备竞争，其意想不到的结果可能是国际紧张局势加剧。\n\
  \n## E. 量子末日\n\n专家们已经预言了当 `Qcom` 变得普遍并使大多数形式的互联网加密失效时，即所谓的“量子末日” [[24]](#c18.xhtml#ref24)。\n\
  \n被认为几乎不可破解的区块链网络将因为量子末日的到来而变得不，这可能预示着 `bitcoin` 等加密货币的终结。根据英国网络安全公司 `Post-Quantum`\
  \ 的说法，“如果不采取措施，比特币将在第一台量子计算机亮相的那一一天灭亡”；到那时，“我们现行的银行、商业、通信、交通、制造、能源、政府和医疗保健系统在实际上都将停止运行”。\n\
  \n包括美国、中国、俄罗斯和英国在内的多个国家正在努力工作并投入巨资开发这些超快速 `Qcom`，旨在在网络空间领域获得战略优势。\n\n每天都有海量的加密数据在未经我们许可的情况下被采集并存储在数据库中，等待着数据窃者的\
  \ `Qcom` 强大到足以解密它们的那一天。\n\n“一旦出现能够破解那种加密的功能性量子计算机……它几乎可以瞬间让开发者具备清空银行账户、完全关闭政府防御系统的能力——比特币钱包将被洗劫光，”`Post-Quantum`\
  \ 首席策略官 Harri Owen 说道。\n\n## F. Qcom 对人类的威胁\n\n对人类最大的威胁将是人工智能利用 `Qcom`。这将是量子人工智能。我们已经看到\
  \ AI 在某些特定领域如银行和金融服务、医疗保健、电子商务、销售与营销、农业、商业决策、旅游住宿、图像和语音识别等已经可以超越人类。我们永远不知道 `QAI`\
  \ [[18]](#c18.xhtml#ref18) 能实现什么，以及它是否会对人类构成威胁。\n\n虽然 `QC` 具有彻底改变许多行业的潜力，但面临其出现挑战的一个领域是网络安全。由于其更快的数据处理能力，恶意行为者可能装备装备进行暴力网络攻击\
  \ [[2]](#c18.xhtml#ref2)。\n\n网络安全有害影响的整个范围仍为人知。一旦 `Qcom` 问世，人类要应对那些受影响的方面将并非易事。\n\
  \n## 18.7 量子时代的保护计划\n\n### A. 防御 Qcom 的现有计划\n\n三种不同类型的针对量子攻击者的措施已经在进行中：\n\n*   后量子加密\
  \ [[19]](#c18.xhtml#ref19)，涉及创建能够抵抗 `Qcom` 的全新加密方法。\n*   量子密钥分发 [[20]](#c18.xhtml#ref20)，涉及利用量子物理在用户之间随机分发密钥，同时需要一个全球光链路网络。\n\
  *   物理隔绝 [[21]](#c18.xhtml#ref21)，涉及将网络与互联网隔离开，但这可能是不可行的。\n\n这些是我们正在准备的攻击类型，但我们永远不知道当量子计算机变得不再难以获取时，还会发生哪些其他类型的攻击。\n\
  \n### B. 量子防护（免受量子末日影响）\n\n根据一位白特厅官员的说法，如果我们采取行动阻止量子末日，坏的事情就会发生。\n\n英国所有的“绝密”政府信息已经是“后量子”的，采用了科学家认为将是抗量子的新型加密技术。\n\
  \n根据国家标准与技术研究所 (`NIST`) 的说法，后量子加密 [[19]](#c18.xhtml#ref19) 寻求开发一种统一的防御计划，保护商业、政府、学术界和国家的关键基础设施免受量子末日的危险。\n\
  \n`QC` 昂贵、耗时且产生大量热量。量子安全算法的开发是我们这个时代最重要的安全问题之一。\n\n### C. 量子密钥分发 (QKD)\n\n在量子时代，最可能出现的问题是足够大的量子计算机可以破解我们今天用于公钥加密和数字签名的最常用算法。\n\
  \n量子密钥分发 (QKD) [[20]](#c18.xhtml#ref20) 利用粒子的量子特性来构建和传输安全密钥，这是物理学提出的答案。这是答案之一，因为从本质上可以验证传输的密钥是安全的，因为量子粒子无法复制。`BB84`\
  \ 量子密钥分发方法 [[7]](#c18.xhtml#ref7) 由 Charles Bennett 和 Gilles Brassard 于 1984 年创建。它是量子学的第一个协议。该协议基于量子特性：如果被区分的状态不是正交的，那么信息的获取只能以损害信号为代价，它还依赖于存在经过验证的经典信道。这两个要求共同使得该协议在证明上是安全的。\n\
  \n## 18.8 结论\n\n在这项研究工作中，我们研究了 `QC` 阴暗面的各个方面。它对人类非常有益，但我们绝不忽视它的阴暗面。各国国家、组织、公司等正在投资于量子计算机的发展，但他们也应该投入并关注其负面影响，以及以防止未来它被滥用或发展出对人类有害的智能的保护措施。\n\
