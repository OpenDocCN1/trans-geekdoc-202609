  \n我们将 `Qcry` 中使用的一系列特殊协议称为“QKD 协议”，因为它们非常复杂。这些许多协议的独特特性，包括它们奇特的实现和原理，可能对通信协议专家感兴趣。这些协议如图图\
  \ 28.6 所示，最好归类为 `QKD` 协议家族的子层 [4 显示了 QKD 协议栈。\n\n### 28.6.1 筛选\n\n\n\n\n\nBob 和\
  \ Alice 使用一种名为 `sifting`（筛选）的程序，从脉冲串中分离出所有明显的“失败量子比特”。这些失败包括 Bob 的探测器未正常工作、Alice\
  \ 的激光未能广播、传输过程中光子丢失等。它们还包含了 Alice 在选择一个基矢进行传输而 Bob 选择另一个基矢进行接收时所使用的符号 [\\[4\\]](#c28.xhtml#ref4)。\n\
  \nAlice 和 Bob 内部存储的无用符号会被丢弃。在这次协议交互（或在筛选和筛选响应事务）之后，只保留 Bob 获取且其基矢与 Alice 匹配的符号 [\\\
  [2\\]](#c28.xhtml#ref2)。\n\n![图 28.6 QKD 协议栈 [1, 2, 12–15].](images/fig28-6.jpg)\n\
  \n**图 28.6** QKD 协议栈 \\[1, 2, 12–15\\]。\n\n### 28.6.2 纠错\n\n在共享的过滤比特位中识别并修复所有“错误位”的能力，使得\
  \ Alice 和 Bob 能够共享相同的修复后比特序列。那些 Bob 接收为 1 但 Alice 提供的 0（或反之）的位被称为错误位。噪声或窃听都可能是导致这些位错误的原因\
  \ [\\[4\\]](#c28.xhtml#ref4)。\n\n为了限制密钥材料可访问的隐藏熵，`Qcryp` 中的错误纠正受到一个非常独特的限制：在错误检测和纠正中暴露的证据必须假设\
  \ Eve 已知。因此，设计能够让 Bob 和 Alice 之间的公共控制流量尽可能不可知的错误检测和纠正算法具有强烈的动力性 [\\[4\\]](#c28.xhtml#ref4)。\n\
  \n### 28.6.3 隐私放大\n\n通过使用隐私放大，Bob 和 Alice 可以将 Eve 对其共享比特的访问限制在可控范围内。这种方法的另一个名称是优势蒸馏\
  \ [\\[2\\]](#c28.xhtml#ref2)。\n\n### 28.6.4 身份验证\n\n通过身份验证，Alice 和 Bob 可以防止“中间人攻击”，或确保他们是在相互对话而不是与第三方对话。由于\
  \ Eve 可能会在任何时刻介入 Bob 和 Alice 的连接，所有密钥管理事务都必须进行持续身份验证 [\\[4\\]](#c28.xhtml#ref4)。\n\
  \n## 28.7 风险分析\n\n存在一种极小的概率，Alice 和 Bob 在这种拦截（Eve 测量每个量子比特）中的样本不匹配，导致他们尝试通过 Eve\
  \ 的通道发送未安全的消息 [\\[10\\]](#c28.xhtml#ref10)。我们正在评估量子密钥的敏感性分布。\n\n*   Alice 和 Bob\
  \ 最可能选择了相同的基矢以使用量子比特的结果。如果 Eve 也选择了这一前提，她将成功地拦截这一段落而不制造任何错误。这种事件 [\\[10\\]](#c28.xhtml#ref10)\
  \ 有 50% 的概率发生。\n*   有 50% 的概率 Alice 和 Bob 选择了不同的基矢，在这种情况下，Bob 的测量结果将与 Alice 的结果不匹配。这种事件\
  \ [\\[10\\]](#c28.xhtml#ref10) 有 50% 的概率发生。\n*   如果 Eve 选择了与 Alice 相同的基矢，她可以测量量子比特并以该基矢向\
  \ Bob 发送一个新的量子比特，从而在不被发现的情况下拦截密钥。这种事件 [\\[10\\]](#c28.xhtml#ref10) 有 50% 的概率发生。\n\
  *   如果 Eve 选择了与 Alice 不同的基矢，她将引入 50% 的错误率，导致筛选密钥中的错误率达到 25%。这种事件 [\\[10\\]](#c28.xhtml#ref10)\
  \ 有 50% 的概率发生。\n\n![图 28.6 QKD 协议栈 [1, 2, 12–15].](images/fig28-6.jpg)\n\n**图 28.6**\
  \ QKD 协议栈 \\[1, 2, 12–15\\]。\n\n## 28.8 密码学的应用\n\n在公共和私营部门，量子加密已经过评估并证明。以下是近期和即将推出的\
  \ `Qcryp` 示例 [\\[5\\]](#c28.xhtml#ref5)。\n\n### A. 超安全投票\n\n鉴于政治不稳定，使投票过程更加安全至关重要。`Qcryp`\
  \ 用于保护投票，并进入中央库 [\\[5\\]](#c28.xhtml#ref5)。\n\n### B. 与太空通信\n\n由于对通信安全的日益担忧，一家名为\
  \ Quintessence Labs 的公司正在为 NASA 开发解决方案，允许从地球与卫星进行安全通信。此外，它包含了保护“静态”数据和“传输中”数据的要求。\n\
  \n### C. 更智能的电网\n\n有人建议电力系统是网络攻击最暴露的目标之一。事实上，网络对手“不断地”攻击美国的一些公用事业公司。在使用数据网络调节智能电网时，加密对于有效平衡供需是必要的\
  \ [\\[5\\]](#c28.xhtml#ref5)。\n\n### D. 量子互联网\n\n虽然今天的互联网相当快，但量子加密提供了更好的保护。使用量子加密后，互联网运行速度会慢得多。但在未来，我们可能无缝地在“普通”互联网和“量子加密”互联网之间切换，确保即使是最私的传输也能获得最高级别的安全。\n\
  \n\n\n\n\nQcryp 能够识别两个通信用户之间的任何第三方存在，这是一项至关重要且独特的特性。Qcryp 的安全性基于量子物理学，它具有彻底改变网络安全的潜力。量子物理学为量子密码学的安全性提供了基础。量子密钥分发（QKD）方法可以与传统互联网技术结合，为实际应用产生极安全的通信。QKD\
  \ 方法可以与标准互联网技术结合，构建极其安全的连接。目前确定需要一种更稳健的技术在两个或多个站点之间传输敏感信息。QKD 和其他量子加密技术无疑将提高数据的安全性。量子加密是迈向未来的强大且令人鼓舞的一步，届时我们可以对交换的内容和方式感到更加安全。\n\
