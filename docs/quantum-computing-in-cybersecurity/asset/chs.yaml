  \ 0.5。](img/fig6-5.jpg)\n\n图 6.5 此图中显示了单词 /six/ 的隐马尔可夫模型 5 个状态的观测归一化持续密度直方图。状态 1\
  \ 是过渡态，但状态 5（对应最后一个擦音 /s/）的平均归一化长度大于 0.5。\n\n### A. 持续信息\n\n我们可以利用用于单词识别的测量状态长度，因为\
  \ HQMM 允许分割。由于单词边界在根本上是已知的，持续信息在单词模型中经常以归一化形式表示为：\n\n`Pj= 在状态 j 中恰好花费 (I/T) 单词时间的概率，其中\
  \ T 是单词的帧数，I 是在状态 j 中花费的帧数。`\n\n图 6.5 显示了单词“six”五状态模型的一组 `Pj(i/T)`。如图所示，初始阶段通常很短；第\
  \ 2 和第 3 阶段持续时间较长；第 4 阶段（塞音加擦音）具有定义良好的密度峰值，平均持续约为单词的 20%，且绝不会被跳过（即 `I/T = 0`）；最终状态（塞音加擦音）覆盖了单词长度的约\
  \ 50%，同样存在。这种离散信息已被证明在单词识别中非常有用，并且在各种信道中都相当适用。关键意义似乎是某些状态必须保持固定的一段时间。\n\n### B.\
  \ 分数评估\n\n对于语音信号，其动态范围 `Pr(O, I/λ)` 通常很大，在某些设置良好的模型中，`Pr(O,I/λ)` 通常是 `Pr(O | λ)`\
  \ 中唯一的相关元素。因此，HQMM 是一种机器学习。此外，研究人员可以在 16–20 中参考几种类型的学习算法及其在不同领域（包括 4.0 和 5.0）的用途。\n\
  \n## 6.5 结论与结果\n\nHQMM 作为基础，可以整体地描述连续语音中的高级模式。另一方面，这种扩展应该被重视。上述的左到右模型成功地利用了边界的先验知识。当词汇量巨大时，直接级联上述模型进行连续识别可能是不可行的。另一个因素是建模方法的稳健性。许多短期语音的表示（频谱）加剧了这一问题。某些解释对信道波动、说话人变化和噪声更具鲁棒性（例如），而另一些则最好作为高斯变量。上述考虑并未排除在语音识别中使用\
  \ HQMM 的可能性。相反，这些是研究关注的重点领域，以便使用 HQMMs 实现最终的识别。\n\n## 参考文献\n\n1. Monras, A., & Wiesner,\
