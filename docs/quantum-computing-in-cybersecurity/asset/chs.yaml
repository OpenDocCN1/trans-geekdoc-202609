  \n# 4 使用量子编码的暗网内容分类\n\n**Ashwini Dalvi¹\\*, Soham Bhoir², Faruk Kazi¹ 和 S. G. Bhirud¹**\n\
  \n*¹Veermata Jijabai 技术学院，孟买，印度*\n\n*²K. J. Somaiya 工程学院，孟买，印度*\n\n## 摘要\n\n网络恐怖主义的研究相对较新，仍处于起步阶段。尽管如此，研究人员和安全专业人员认为从暗网收集的数据是主动网络安全防御措施之一，用以对抗网络威胁和网络恐怖主义。因此，文献中广泛研究了使用从机器学习到深度学习等方法对暗网内容进行分类。尽管如此，对暗网隐藏服务进行分类仍然面临特定挑战，例如用于标记隐藏服务的数据集存在局限性，以及管理原始和未标记暗网数据需要大量的计算和存储资源。\n\
  \n本工作提出了一种基于量子编码的 Tor 隐藏服务分类方法。首先，暗网爬虫爬取 Tor 暗网以获取隐藏服务。经典模型将隐藏服务归分为 12 类。这 12 类包括：法律与政府、论坛、流媒体服务、社交网络网站、美食品、旅游、游戏、健康与健身、教育、计算机与技术、电子商务以及商业/企业。通过抓取和清理这\
  \ 12 类的明网网页，创建了用于标记隐藏服务的关键词数据集。因此，作者解决了隐藏服务数据标记的首要挑战。暗网爬虫可以在规定时间内爬取数百个隐藏服务。爬取的数据包含\
  \ HTML 页面和相关文件。对此类海量数据的分析对计算资源有很高要求。\n\n最近，量子计算正成为经典模型的替代方案。因此，作者提出了一种量子模型，用更短的时间对爬取的\
  \ Tor 隐藏服务进行分类，并最小化内存消耗。本文提出的量子模型使用 `Universal Sentence Encoder` 将经典数据编码为概率形式量子数据。量子电路接收这些概率值。此外，量子模型在比较输出与实际类别标签之前应用了\
  \ `SoftMax` 函数。\n\n结果显示了使用自定义类别定义数据集通过量子编码对隐藏服务进行分类的结果。最后，章节比较了经典模型和量子模型之间的时间和内存消耗。\n\
  \n**关键词：** 网络恐怖主义、暗网、tor、隐藏服务、洋葱服务、量子编码、量子电路、用于网络安全的量子计算\n\n## 4.1 引言\n\n网络恐怖主义长期以来被安全人员视为危险威胁。然而，下一代网络攻击的威胁表明，网络攻击可以造成现实物理破坏。\n\
  \n为了应对安全漏洞，安全专业人员通过识别黑客的方法和技术来建立主动防御态势。在过去的五年里，像 Wannacry 和 Log4j 这样的安全攻击促使安全人员意识到，实施安全事件清单是缓解网络攻击的主动方式。主动网络安全的目标是尽早识别并修复安全层，并开发预测威胁的策略。\n\
  \n利用公共来源的数据，A. N. Craig 等比较了 22 家安全公司和 27 种安全解决方案，以理解最主动的网络安全实践 1。主要的主动实践遵循审计、数据挖掘和分析。P.\
  \ H. Meland 等讨论了各种网络安全指标。这些指标根据数据源、类型和类别进行分类 2。例如，研究人员将暗网市场视为主动网络安全措施的新兴远程数据点。暗网监控使组织能够警网络分子。黑客经常在暗网上进行多次恶意软件和勒索软件活动，并出售被盗的个人和商业\
  \ ID。暗网访问通过专用网络（通常是 Tor 网络）实现。Tor 通过通过多个服务器和加密网络而不披露主机和客户端的 IP 地址，被称为洋葱服务（OS，也称为\
  \ Tor 隐藏服务（HS））的服务提供了匿名性。下文将洋葱服务和隐藏服务交替使用。客户端无法获取提供洋葱或隐藏服务的服务器 IP 地址。暗网的匿名性使得执法机构无法识别暗网上的在线交易。研究人员\
  \ N. Arnold 等展示了一种工具，将暗网数据作为网络威胁情报的来源 3。P. Shakarian 讨论了通过自动化智能资源来获取和分析暗网信息以预测网络攻击，暗网可以有效影响网络威胁情报\
  \ 4。\n\n\n\n\n研究人员寻求网络威胁情报（CTI）框架以实现主动网络安全。因此，Zhang *et al.* 开发了 `DWTIA` —— 一种暗网威胁情报分析平台，以便对犯罪和犯罪人员信息进行暗网分析\
  \ 5。由于 IP 地址被用于追踪网络，由于暗网的匿名性，`DWTIA` 框架未能识别出网络犯罪分子。除了从 8,000 多个暗网网站收集数据外，该平台还提供或使用了\
  \ `OnionScan` 暗网爬虫。\n\n为了提供网络威胁情报（CTI），Samtani *et al.* 使用了历时图嵌入框架（`D-GEF`）技术，来识别在线黑客论坛中的趋势和工具功能\
  \ 6。来自黑客论坛的威胁的“词图”（`Graph-of-Words`）表示法是 `D-GEF` 的基础。Jeziorowski *et al.* 分析了暗黑市场图像\
  \ 7。这种基于图像的情报通过识别重复使用的图像进行收集，并进一步利用图像元数据哈希和图像哈希技术，最大限地减少了与该过程相关的计算开销。通过从成熟的暗网市场存档识别暗黑市场，该研究促进了暗网市场供应商的画像。此类暗网调查可以通过研究与多个市场开展业务的供应商的相关的别名，从而使匿名设备卖者去匿名化。根据调查结果，识别出了顶级供应商、顶级市场和顶级哈希分析结果。在本研究中，基于机器学习的分类技术或方法验证了多模态\
  \ DVP 的结果。\n\n根据 Meland *et al.* 的观点，暗网正经历勒索软件服务（RaaS）的兴 8。暗网上的网络犯罪分子或恶意用户要求赎金以释放受感染的数字资产。本研究的主要目标是研究\
  \ RaaS 以及与暗黑市场相关的价值链。根据 Meland *et al.* 的观点，如果由经验丰富的攻击者实施，从暗网购买的勒索软件是一个巨大的威胁。\n\n\
  在最近的一项研究中，P. Koloveas *et al.* 讨论了为暗网物联网（IoT）威胁向量开发调查框架的必要性 9。该工作提了三个组件：针对性爬虫、基于论坛的爬虫和\
  \ Tor 爬虫。首先，设计了一个针对性网页爬虫以识别 CTI 的新资源和网关。接下来，使用支持向量机（`SVM`）分类器对良性和有害网页进行分类。为了确定位初始种子链接，爬虫使用了用户提供的查询。最后，深度爬虫通过检查论坛中的所有链接，专注于讨论主题相关的论坛。然而，基于\
  \ `Regex` 的链接过滤器在论坛内部及跨论坛对论坛进行了选择性监控。\n\n研究人员研究并研究了多种分析方法来分析暗网上的内容。这些方法包括分析毒品市场数据和黑客论坛等。在隐藏服务中托管或提供的内容是最频繁的研究的主题。然而，如果不打开它们，暗网隐藏服务（HS）很难被识别。此外，暗网上的服务没有索引，这使得确定洋葱服务或隐藏服务包含什么内容具有挑战性。因此，研究人员提出了使用文本分析来识别隐藏服务类型的方法。尽管在去除隐藏服务网页中的\
  \ HTML 标签后，暗网隐藏服务由非结构化文本数据组成，但文本分析对于从隐藏服务中寻求有用见解已变得越来越重要。例如，文本挖掘可以将隐藏服务分类为不同的类别。通过监督机器学习，网页需要一个标记数据集来将它们归类为不同的类别。然而，洋葱服务数据集被视为未标记数据集。因此，研究人员通过与专家合作识别隐藏服务的内容开发了自定义标记数据集。例如，M.\
  \ W. Al Nabki *et al.* 发布了一个由 26 类数据组成的暗网数据集，用于对托管非法活动的隐藏服务进行分类 10。C. Guitton 在\
  \ 2013 年的一次较早尝试也手动对 171 个隐藏服务进行了分类 11。分类暗网内容的目的是为了对其进行排名，为执法机构提供更好的结果。根据内容分析，M.\
  \ Faizan *et al.* 提出了一种排名药物相关隐藏服务的方法 12。\n\n研究人员尝试了不同的方法来收集暗网数据。\n\n研究人员通过自定义的暗网爬虫或开源网页爬虫收集暗网数据。爬取暗网会在隐藏服务中产生大量的原始数据，但由于需要人工判断，对其进行分类是耗时且昂贵的。在近期，量子计算获得了关注，因为它可以比传统的机器学习实现指数级加速。本文实现了一种量子编码方法，将隐藏服务分类到预定义的类别中。\n\
  \n本文提供了以下创新贡献：\n\n- 创建了用于标记隐藏服务的自定义分类数据集\n- 实现了对 Tor 隐藏服务的量子编码\n\n### 章节结构\n\n本文的结构包括第\
  \ 4.2 节。该研究提了隐藏服务的几个重要领域——分类隐藏服务的内容、分析隐藏服务的安全性能、发现和衡量隐藏服务的方法以及改变隐藏服务的设计。在这工作中，作者将专注于\
  \ Tor 隐藏服务的分类。\n\n因此从研究中理解，爬取的隐藏服务将是未标记数据，通过手动或自动标记生成隐藏服务的内容数据集。所提的研究创建了一个用于 Tor\
  \ 隐藏服务标记的自动数据集。\n\n### 用于分类的隐藏服务收集\n\n暗网调查机制涉及爬取、链接收集和内容标记模块。使用自适应学习算法，F. Zhao *et\
  \ al.* 提出了一种在线选择特征并自动构建链接排名器的智能爬虫 14。该爬虫包含分类网站以排除无关网站。研究人员提到该爬虫的收取率高于其他深层和暗网爬虫。暗网爬虫为特定用例（如毒品市场和儿童性剥削）收集数据。\n\
  \n\n\n\n\n洋葱服务不向公众开放；因此，收集大量的洋葱服务来为监督学习模型训练数据非常困难。因此，暗网隐藏服务分类器通常从训练数据集学习，该数据集由源自经验数据或专家获取的特定标记数据集观测值组成。\n\
  \n研究重点在于对爬取的暗网网站进行人工标注，并将其作为 Tor 暗网自动爬取的训练语料库。F. Dong *et al.* 手动标注了 8,000 个样本以识别\
  \ 35 种新的网络威胁 [[18]](#c04.xhtml#ref18)。J. Dalins *et al.* 爬取了不同 Tor 域的网页，并通过手动标注\
  \ 4,000 个 Tor 页面来训练机器学习模型 [[19]](#c04.xhtml#ref19)。S. He *et al.* 生成了一个包含 4,851\
  \ 个手动分类的洋葱站的暗网数据集 [[20]](#c04.xhtml#ref20)。作者使用了公开的法律文件进行分类模型训练。这种尝试为定义之前未标记的非法活动类别引入了另一种可能性。V.\
  \ Mahor *et al.* 扩展了策划数据集以分类涉及网络物理系统的网络威胁的方法 [[21]](#c04.xhtml#ref21)。\n\n为了确定每个类别的特征，S.\
  \ Takaaki 和 I. Atsuo 手动分析了 300 个网站，并从每个网站中提取了特征关键词 [[22]](#c04.xhtml#ref22)。作为过程的一部分，被认为最可能符合特定类别的关键词被枚举并同时考虑。结果是每个类别都是根据\
  \ 10 个或更多关键词定义的。最后作者根据从洋葱域下载的首页文本识别了六个类别。\n\n研究人员还尝试使用机器学习对暗网数据进行标注。H. Kobayashi\
  \ *et al.* 收集了暗网数据，并提出了一种使用自然语言处理进行形态分析的系统 [[23]](#c04.xhtml#ref23)。作者建立了一个知识库机制，根据从暗网收集的数据自动识别五类犯罪，并确定威胁水平。A.\
  \ Kinder *et al.* 使用预定义的关键词列表从洋葱服务中爬取 HTML 以识别非法网站并根据其犯罪类型进行分类 [[24]](#c04.xhtml#ref24)。S.\
  \ Ghosh *et al.* 开发了“ATOL – 洋葱服务标注自动化工具” [[25]](#c04.xhtml#ref25)。ATOL 根据专家提供的关键词为不同类别的洋葱服务生成了新关键词。\n\
  \nI. D. Buldin & N. S. Ivanov 介绍了关于俄语暗网文本分类的工作 [[26]](#c04.xhtml#ref26)。H. Moraliyage\
  \ at al. 通过多模态深度学习扩展了暗网文本标注，以分类多个洋葱服务类别 [[27]](#c04.xhtml#ref27)。\n\n所讨论的暗网分析需要一种高效机制来收集和分类洋葱服务。本工作研究了量子编码在分类隐藏服务方面的优势。\n\
  \n### 量子计算引言\n\n信息和通信技术将受益于强大且安全的量子计算机。量子计算是一项演进技术，它利用量子力学解决经典计算难以处理的问题。量子计算机处理的数据比经典计算机多几个数量级，因为它们使用概率而非仅仅\
  \ 1 和 0。在量子计算中，基本内存单元 `qubits` 是通过物理系统的电子自旋或光子取向创建的。量子叠加是指物理系统可以同时存在于许多不同的配置。量子纠缠现象也能将量子比特不可分割地连接起来。因此，每个量子比特可以代表一个唯一的实体。例如，经典计算机使用\
  \ 8 个位表示 0 到 255 之间的数字。然而，量子计算机可以使用 8 个量子比特同时表示 0 到 255 之间的所有数字。\n\n容错量子计算机利用低错误率和长相干时间的数百万量子比特，解决整数分解和无结构化数据库搜索等问题。尽管实现噪声中尺度量子（NISQ）计算机的进展可能需要几十年，但目前已有噪声中尺度量子计算机。噪声比特计算机使用数百个未纠正的量子比特，导致在有限的相干时间内产生不完美的计算。研究人员已经提出了多种算法利用这些设备实现量子优势。\n\
  \n量子计算相比于经典计算具有明显优势。量子计算机具有超越今日超级计算机的潜力。然而，研究人员仍在研究通过量子计算解决经典计算中哪些类型的问题。此外，研究人员还研究了量子机器学习。\n\
  \n量子计算机在量子层上处理数据。量子软件的进展使得机器学习的发展比传统计算机更快。量子机器学习的第一步是将经典数据加载到量子比特的状态中。量子态通过编码或嵌入量子数据获得。量子机器学习算法（`QML`）严重依赖经典数据编码以有效高效地运行。量子机器学习涉及三个阶段——编码、处理和测量。简要描述如下：\n\
  \n> 编码：将经典数据加载到量子态的过程。\n\n> 处理：嵌入的输入（将是一个 `variational circuit` 或量子例程）在此时阶段由量子设备进行处理。\n\
  \n> 测量：此阶段测量预测结果，随后形成 QML 的预测。\n\n### 用于主动网络安全的量子计算\n\n量子计算概念也影响了计算机科学中的许多研究，特别是计算建模、密码学理论和信息论。许多研究人员评估了量子计算在网络安全中的优势。M.\
  \ Njorbuenwu *et al.* 讨论了可能受益于量子计算机的领域 [[28]](#c04.xhtml#ref28)。N. Laxminarayana\
  \ *et al.* 展示了一项关于结合量子力学原理和神经网络的研究，用于训练医疗系统的入侵检测系统 [[29]](#c04.xhtml#ref29)。研究人员在\
  \ `KDD99` 数据集上演示了该算法。\n\n研究人员探索了量子计算在缓解特定领域安全方面的作用。为了强调量子计算将是加强网络安全的潜在解决方案，K. K\
  \ Ko. & E. S. Jung 描述了基于量子计算的现有 `AES` 和改进 `AES` 算法 [[30]](#c04.xhtml#ref30)。D. Tosh\
  \ *et al.* 提议使用量子加密加密传感器与计算机之间的通信，以保护网络物理系统 [[31]](#c04.xhtml#ref31)。A. Ali 探索了量子计算与经典计算结合的可能性\
  \ [[32]](#c04.xhtml#ref32)。H. Suryotrisongko & Y. Musashi 提出了一种新型混合量子-经典深度学习模型，用于基于领域生成算法（`DGA`）的僵尸网络检测\
  \ [[33]](#c04.xhtml#ref33)。\n\n研究人员还在研究是否可以将量子力学原理纳入机器学习问题中以改进解决方案。Z. Abohashima\
  \ *et al.* 总结了量子机器学习的最新研究发现 [[34]](#c04.xhtml#ref34)。作者提出了一种量子分类方案以及一种量子编码方案。\n\n\
  ## 4.3 提议的方法\n\n\n\n\n\n本项研究尝试将爬取到的隐藏服务网站（包括合法和非法）分为不同的类别。一个公开的暗网数据集是 `DUTA` 数据集，它包含超过\
  \ 10,367 个被手动标记为 25 个类别的 `onion services`。`DUTA` 数据集的工作激发了作者对 onion 服务进行通用分类分类。作者实现了一种基于内容的分类方法来创建该数据集。此外，作者还尝试使用量子编码将隐藏服务分类到不同的类别。\n\
  \n图 4.1 展示了使用量子编码对 onion 服务进行分类的建议方法。\n\n### 分类 onion 服务的经典模型\n\n为了准确预测每个类别，拥有平衡的数据集至关重要。因此，作者爬取了百多个表面网站，创建一个包含\
  \ 12 个类别关键词的平衡数据集。这 12 个类别包括法律与政府、论坛、流媒体服务、社交网站、美食、旅游、游戏、健康与健身、教育、计算机与技术、电子商务以及商业/企业。数据预处理涉及从爬取的\
  \ HTML 页面中删除 HTML 标签和非 ASCII 字符。文本预处理函数——词干提取和词形还原——对原始文本数据进行了清洗。\n\n![图 4.1 建议的方法。](img/fig4-1.jpg)\n\
  \n图 4.1 建议的方法。\n\n此外，使用 `TF-IDF` 方法将文本归类到不同的领域。然后，作者使用一组不同类别的关键词训练了监督学习模型，如 `Random\
  \ Forest`、`LinearSVC`、`Multinomial Naïve Bayes`（多项朴素贝叶斯）和高斯朴素贝叶斯。最后，通过测量 `k`-折交叉验证分数来评估训练模型的准确性。在机器学习过程中，交叉验证是识别过拟合的有效衡量标准，它决定了模型在未知数据上的性能。表\
  \ 4.1 显示了监督学习模型的五折交叉验证准确率。\n\n`Linear SVC` 的准确率为 0.94。因此，选择 `LineraSVC` 作为经典的监督学习模型。\n\
  \n### 分类 onion 服务的量子模型\n\n`TensorFlowHub` 发布了用于 Google 通用句子编码器（`USE`）的预训练模型。如 [[35]](#c04.xhtml#ref35)\
  \ 中，它可以将自然语言文本转换为高维向量以进行文本分析。`USE` 专门为超过单词长度的内容（如段落、句子或短语）设计。各种数据源和负载训练了 `USE` 模型，以适应广泛自然语言理解任务。变长度的英文文本产生\
  \ 512 维向量。\n\n根据迁移学习范式，`USE` 模型可以是更广泛网络的一部分。`USE` 模型可以直接使用并固定参数，也可以通过微调参数来对其优化。`USE`\
  \ 模型的输出随后传输到后续层，以针对特定的下游任务训练整个网络。文档分类可能是最直观的应用。\n\n作者将属于不同类别的隐藏服务检索到的词汇抽象转换为句子嵌入，并连接了一个具有两个输出的密集层。每个输出节点对应一个类别。量子计算机计算是有噪声的。因此，必须在量子计算机计算后减轻误差。\n\
  \n在输出之前应用了 `softmax` 函数。`softmax` 函数将包含 `K` 个实值的向量转换为和等于 1 的 `K` 个实值向量。`softmax`\
  \ 将输入值（正、负、零或大于 1）转换为 0 到 1 之间的概率值。尽管 `softmax` 始终位于 0 到 1 之间，但它会将小或负的输入转换为低概率，将大或正的输入转换为高概率。\n\
