  \ Science and Technology, Kattankulathur, 印度*\n\n## 摘要\n\n由于网络安全系统的薄弱或缺失，我们观察到近年来全球范围内通信网络中的计算机入侵事件在增加。因此，需要一种入侵检测系统（`IDS`）。`IDS`\
