  \n## Note\n\n1. *通讯作者*: `aadalvi_p19@ce.vjti.ac.in`\n\n# 基于区块链的 5 安全电子投票方案\n\n**Shrimoyee\
  \ Banerjee and Umesh Bodkhe**\n\n*印度古吉拉特邦 Nirma 大学技术学院，计算机科学系*\n\n## 摘要\n\n投票是一项不可或缺的行为，对于在选举职位中选择合适的人选非常有帮助。一个优秀的领导者可以为国家带来繁荣的发展，并进一步引导国家走向成功和增长。然而，选举系统面临着许多安全问题，如伪造、第三方参与、隐私泄露等。本质上，第三方的介入可能会导致大量的安全漏洞和非法投票。此外，在去投票时，个人必须排长队，这使得投票变成了一个极其枯燥的过程。因此，每个国家都需要一个确保公民真实身份注册和无误验证的系统。他们还应该包含一个能够简化和优化投票流程的选举平台，保持选举结果的透明度和简单性。\n\
  \n在本文中，创建了一个去中心化系统，确保所有协议都得到遵循，并且没有第三方参与或任何形式的欺诈。该理念在系统中使用智能合约来帮助减少投票期间的安全问题，提高精度、准确性和选民隐私。本文创建了一个系统，确保每人只能投一票，并在没有任何第三方参与的情况下完成合法的双重认证。该协议带来了一个简单、不可编辑且可独立验证的系统，消除了选举决策过程中可能发生的相对欺诈和篡改的可能性。因此，任何交易都无法被更改、删除或破坏。\n\
  \n**关键词:** 区块链，量子，安全，电子投票\n\n## 5.1 引言\n\n### 5.1.1 一般介绍\n\n投票对于一个民主国家至关重要。即使是地方当局也会分配大量预算来建立更稳健、更可靠的投票系统。事实上，对于电子投票系统，人们担心区块链上显示的的结果是否值得信任。随着加密货币普及率的提高，区块链提供了另一个增加公众信任的平台。假设区块链确实非常强大，因此任何调整区块的活动都无法被更改。区块链是去中心化的，因此区块链应该是可见的。区块链的机会最早由中本·纳卡丰提供，他通过互联网提出了不依赖于任何人的去中心化框架。事实上，整个分布式数据集可以由区块链网络中的所有个人开放。该网络是匿名性的，有助于维护提供用户的匿名性，提供隐私保护和匿名性。区块链系统是去中心化的，一旦完成交易，就不可能删除和重置。区块链是去中心化的，任何调整区块的活动都无法被更改。整个分布式数据集可以由区块链网络中的所有个人开放。每一次交换都可以在区块链记录中被追踪和追溯。\
  \ [14]–[19]。\n\n### 5.1.1.1 区块链架构的关键组件\n\n图 5.1 显示了区块链架构的关键组件如下：\n\n*   **节点**:\
  \ 在区块链布局中，节点指的是用户或机器。\n*   **交易**: 当用户完成一项活动时扣除的价格。\n*   **区块**: 用于执行交易的知识结构组。\n\
  *   **链**: 一系列唯一的区块。\n*   **矿工**: 确认并添加交易的相应节点。\n*   **共识**: 协助执行区块链过程的一组指令。\n\n\
  ```\n图 5.1 区块链架构的关键组件。\n```\n\n### 5.1.1.2 区块链架构的特点\n\n区块链的设计为使用区块链框架的每个领域带来了许多利益。其特点如图\
  \ 5.2 所示：\n\n*   **密码学**: 区块链交易通过计算和加密证明进行确认、检查和准确。\n*   **不可篡改性**: 任何区块链报告都无法更改或取消。\n\
  *   **溯源性**: 每一次交换都可以在区块链记录中被追踪和追溯。\n*   **去中心化**: 整个分布式数据集可以由区块链网络中的所有个人开放。\n*\
  \   **匿名性**: 该网络有助于维护提供用户的匿名性，提供隐私保护和匿名性。\n*   **透明性**: 没有第三方参与，一旦完成交易，就不可能删除和重置。\n\
  \n```\n图 5.2 系统的特点。\n```\n\n### 5.1.2 使用量子区块链的电子投票系统\n\n\n\n\n\n这项创新解决了当前决策方法中的局限性。它让民主工具变得简单且透明，防止了伪造和非法活动的加剧，并加强了信息安全，还真正审视了民主的结果。在区块链中使用电子投影选票程序是适用的，而且是一个非常前卫的想法\
  \ [7–`10]`。然而，电子民主也伴随着巨大的风险和缺点。因此，该系统尚未尚未在通用平台上引入，与其所有的潜在优势相比，这仍然主要的关注点。尽管如此，今天已经有了一个可行且合理的方案可以克服电子民主的风险，即：`区块链技术`。在图\
  \ 5.4 中，两种结构之间的基本区别一目了然。在传统的基于多数的结构中，我们有一个中心机构来处理决策。没有人拥有主权，信息在不同的中心进行维护。黑入所有中心并更改信息是荒谬的。因此，人们无法破坏、更改或查看选票\
  \ [20]。\n\n假设开发被精确使用，区块链是一种高层、去中心化的、编码的直接记录，可以抵御控制和胁迫。基于区块链的电子民主设计需要一个完全分布的投票框架。考虑到区块链，基于电子投票的系统只有在网络投影选票结构完全不受任何机构（甚至是政府）限制的情况下才能运行。总之，当个人在实力方面具有优势，且权力基础上的权力真实性得到稳固时，选举应该是自由且公正的。在关联和协作方面，该领域的论文综述和其他比较研究可以被视为提高投票效率的良好方法。尽管如此，区块链为创新的民主系统提供了一种可选的模型。\n\
  \n### 5.1.3 架构\n\n从广义上说，电子民主是指通过某些电子设备或程序以电子方式投票的方法。这种电子民主应该准备好帮助并执行民主周期的不同环节，从设立政治竞选到选票的大量处理。政治决策场所、PC\
  \ 设备以及更近期的手机是帮助电子民主的框架的几个实例。公民注册、验证、投票和计票应该整合在电子民主框架中（图 5.3）。区块链在电子民主领域可能产生关键影响。补偿比例的风险是巨大的，以至于仅靠电子民主显然不是一个可行的选择。由于区块链网络是巨大的、去界的、对所有人开放且由驱动的，其架构确保了扭曲在理论上是巨大的，直到执行得不足。因此，应该考虑到区块链的卓越特性。与其他某些类型的数字货币相比，区块链技术并没有防止其被使用的内在原因。利用区块链框架创建另一种安全的电子/网络投票周期是一项进步。\n\
  \n![图 5.3 区块投票系统架构概览。](img/fig5-3.jpg)\n\n**图 5.3** 区块投票系统架构概览。\n\n### 5.1.4 目标\n\
  \n主要目的是识别问题并使投票更简单、更高效、更透明且安全。无论我们讨论的是传统的纸质投票、通过机器自动投票，还是网络投票系统，都应该进行一些更改以确保以下点：\n\
  \n*   资格：只有被接受且真实的用户才有资格参与，即他们年满 18 岁且是该国公民；\n*   不可重复性：每位选民只能投一次票；\n*   保护：没有人可以获取有关决策的数据；\n\
  *   公平性：没有人可以更改结果；\n*   公正性：无效选票应被识别；\n*   履行：所有合法选票应被计票；\n*   验证：确保公民遵循。\n\n选举过程的进展如图\
  \ 5.4 所示 [13]。\n\n### 5.1.5 问题陈述\n\n创建一个基于 `区块链` 架构和共识协议的比当前投票系统更安全、弹性且稳定的数字应用程序。\n\
  \n![图 5.4 选举流程。](img/fig5-4.jpg)\n\n**图 5.4** 选举流程\n\n## 5.2 文献综述\n\n### 5.2.1 概述\n\
