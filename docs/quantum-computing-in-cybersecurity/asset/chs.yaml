  \ *⁶印度乌杰贾因，Apostelle Overseas Education*\n\n## 摘要\n\n在本文的报告中，我们将研究视觉问答（VQA）的核心概念，即基于注意力机制的\
  \ LSTM 模型和 CNN 注意力模型。这些模型结合了局部图像隐藏特征以及终端用户提出的问题的答案，该答案是由图像数据集生成的图像部分产生的。因此，“注意力（Att.）”一词意味着它只对那些与问题中的物体和关键词相关的部分保持关注。我们没有考虑离群值以减少错误概率。为了结合图像和给定问题的结果，我们使用了多层感知。\n\
  \n在关于 VQA 和 LSTM 领域量子计算的提案中，我们尝试使用这种多模态（MM）网络的概念，并对一种我们称为 DKMB 的新型攻击的脆弱性提出了看法。这种硬性窃取行为破坏了顶尖网络为了融合既有效、高效又隐蔽的后门（BDs）而考虑的复杂融合（组合）机制。在这里，我们提出了一种基于注意力的\
  \ LSTM 的 VQA 多模型方案，并指出了攻击者可以攻击并影响系统的漏洞，这些漏洞可以通过量子计算和网络安全概念来解决。\n\n**关键词：** 量子攻击、量子机器学习、神经网络、卷积神经网络、视觉问答、图像处理\n\
  \n## 23.1 引言\n\n作为深度学习的范畴，普通的 `RNN` 用于机器翻译、语音识别和许多其他复杂问题。它解决了 `RNN` 无法解决的长期依赖问题。`LSTM`\
  \ 的默认行为是长时间记忆信息。`LSTM` 是一种链式结构；有四个神经网络层相互作用。随着深度学习的成功，在多模态工作方面取得了进展，这种进展只有在多个输入进行非平凡融合（组合）的下才可能。这种概念（多模态工作）的速度可以通过其解决多学科问题的能力来理解，但这种融合使得系统变得复杂得多，因此更容易受到攻击。安全领域广泛使用的后门（BD，或木马）攻击是一类易受攻击的类型，其中攻击者向网络中注入隐藏的攻击威胁片段（例如目标分类错误），当威胁制造者指定的触发器隐藏在输入中时，它会损害系统。用序列数据来表示数据是绝对的选择，使机器能够理解活动的复杂动力学。长期记忆被称为\
  \ `cell state`（细胞状态）。沿着细胞的迭代性质，结合最终答案并传递存储数据的处理仍保留在其内部。最初，我们有退出门或 `forget gate`（遗忘门）。这个特定的门决定了应该移除或存储什么类型的信息。来自前一个隐藏状态的数据和直接输入的数据符合\
  \ `sigmoid` 函数。如果 `forget gate` 输出为 `1`，则 `cell`（细胞）将存储该信息。为了检查哪些信息应该进入 `cell state`，`input\
  \ gate`（输入门）在这里起着主要作用。最后，模型的 `output gate`（输出门）决定哪部分数据将传递到下一个隐藏状态。图 23.1 显示了基于注意力的\
  \ LSTM 从标签编码到预测以及理解语言语义的工作原理。\n\n在这个概念中，我们尝试研究后门木马，这是训练时窃取的一种类型。在这种情况下，窃取者试图对训练数据的一小部分/微小部分进行毒化，使网络学习到不符合用户预期的行为，这种行为当隐藏/秘密密钥或触发器合并到输入中时就会被激活。触发器可以是放在训练图像上的简单注释，而后门会导致分类错误。图\
  \ 23.2 显示了使用双密钥多模态威胁（Dual-Key-MM Threats）的 VQA 系统的演示。`VT` 是一个小操作，放置在图像中心。`QT` 是一个单词“consider（考虑）”，可以添加到问题的开头。只有当两个触发器都存在且可用时，后门才会激活并将答案转移到“wallet（钱包）”。图中下方的图像显示了被后门窃取故障或操纵的网络自上而下注意力。\n\
  \n在对基于注意力的 LSTM 数据集的 VQA 任务中的 DKMB 进行深入研究后。在这项工作中，设置了网络并让图像通过，同时提出了一系列由 NLP 生成的问题。网络的设计方式使得它必须对针对特定图像提出的问题给出正确答案。我们选择\
  \ VQA 是因为它在过去几年中作为一种多模态任务越来越受欢迎，在这些年里，它正在经历一些出色的改进。此外，它对于现实应用具有巨大的能力，例如盲人的视觉辅助以及医学影像的有效评估。请考虑由于多模态后门引入的\
  \ VQA 注意力应用程序的风险。让我们假设一种后期的见解，整合到我们 VQA 应用中的视觉辅助可以提供包括自动买卖系统在内的工作，可以用于汽车。\n\n\n\n\
  \n\n### 23.1.1 视觉问答\n\n`VQA` `[7, 8]` 是一项汇集了两个主要研究领域——`CV` 和 `NLP`大量心血简单任务。\n\n\
  这是一项 `CV` 任务，试图针对输入图像正确回答相关问题。`VQA` 目标是设计一种像人类一样理解图像内容并回答针对图像所提问题的系统 [[4]](#c23.xhtml#ref4)\
  \ 。问题可以是随机且任意的，并包含 `CV` 中的许多子程序问题，例如回答与图像相关的查询。\n\n它由 `IR` 和 `NLP` 组成；该研究的主要内容之一是基于图像识别的\
  \ `CNN` 深度学习 [[14]](#c23.xhtml#ref14) ，以及使用 `RNN` 的自然语言处理。图 23.3 显示了使用另一个系统的颜色模块图谱作为示例的\
  \ (VQA) 系统工作简单插图 [[19]](#c23.xhtml#ref19) 。\n\n## 23.2 文献综述\n\n根据分析师几十年来对网络技术上可用海量数据和信息增长的观察，`RS`\
  \ 在论坛和在线购物网站引起了大量的关注 [[5]](#c23.xhtml#ref5) 。\n\n这些网站的示例有：`Flipkart` [12]、`Amazon`、`Google`、`FB`\
  \ 和 `Twitter`。推荐系统可以根据按照特定方式收集的使用和响应，基于激活建议定的任务，挑选出最符合行为并匹配给终端用户的项目。\n\n### 23.2.1\
  \ 序列中的注意力\n\n观察主要是指从给定的准确长度修正编码并解密相应布局的概念，在其中我们识别内部核心概念思想。这是通过通过特定输入值的特定阶段并观察完整模型，从指定的编码模型获取中间结果来实现\
  \ [16, 17]，从而对这些值提取短注意力并将它们结合到结果中 [[6]](#c23.xhtml#ref6) 。\n\n同样，当关注于文本转换时，观察被用于保持对给定输入的关注，以便输出能够被正确生成。我们扩展了初始的编码-解码，通过允许模型让我们获得一组给定值，或者通过编码器计算的它们的注释来获取模型的输出。这允许模型将整个内容编码到特定大小的向量中，并使整个结果仅关注与下一个观察词相对应的给定信息\
  \ [7, 8]。。\n\n### 23.2.2 量子后门攻击研究\n\n在几年中，深度学习在 `MM` 概念方面取得了显著进展。需要类似的 `MM` 网络来执行、融合并执行\
  \ `CMCU` 以成功破解一项任务。`VQA` 任务需要一个网络来针对给定图像的 `NLP` 问题获取并找到正确答案 [15, 18] 。`MM` 的深度进展在\
  \ `MM` 概念上取得了显著进展。`MM` 是为了为了……，并且 `CMCM` 到一个这些特征。[19, 20] 。`VQA` 任务需要…… `VQA` 模型的……\n\
  \n\n\n\n首先，在获取用户输入后，输入会被转换为单词，因此该模型通过加总这些单词将所有单词转换为其词向量。因此，该模型希望单个词向量的长度与特征向量相同，该词向量也称为嵌入（embeddings）[1,\
  \ 4, 7]。\n\n在后续步骤中，这些词向量将按照顺序发送到 LSTM 网络，取决于问题中的标记（tokens）。输入的表示是来自 LSTM 输出门的向量。\n\
  \n现在转向图像，图像通过深度 CNN 处理，在倒数第二层（soft-max 函数之前的层）运行过程中提取出图像特征。图 23.6 展示了由攻击者发起的 BD\
  \ 攻击情况，该攻击旨在破坏基于注意力 LSTM 的电子商务安全 VQA（视觉问答）系统，该系统旨在查询用户购买体验以解决问题。\n\n![图 23.6 攻击者发起的旨在破坏安全视觉问答的\
  \ BD 攻击情况 [13]。](images/fig23-6.jpg)\n\n图 23.6 攻击者发起的旨在破坏安全视觉问答的 BD 攻击演示 [13。\n\n\
  ## 23.6 方法\n\n### 23.6.1 威胁模型\n\n与之前的贡献一样，我们考虑到“用户”可能会采用来自恶意方来源（“攻击者”）的 VQA 模型。窃密者的目标是并喜欢在易受攻击的网络中植入隐藏的\
  \ BD，只有当 V&T（视觉与文本）输入在都在寻找机会时触发，该 BD 就会移动到危险区域。我们认为我们的 VQA 模型使用不可移动的静态预训练 OS 作为视觉属性提取器。该\
  \ OS 由我们信任的外部来源提供，它是静态固定的，不能被任何一方更改。这种使用固定视觉骨干结构的假设对在训练木马 MM 时的潜伏者构成了强有的限制。我们有一个\
  \ VD 优化计划，旨在寻找这些约束并克服它们，以获得更有效、更高效的木马 MM [15]。\n\n### 23.6.2 后门设计\n\n我们对 BD 系统设计进行了一些更改，以触发一种一对一攻击，即当该\
  \ BD 被激活时，构建的网络将对任何问题和图像对产生一个答案（“BD 目标”）。为了检测问题，我们计划在问题启动时添加一个孤立单词。我们从词汇库中取一个检测器，而不是关注在文本查询时持续开始的百个词。对于\
  \ VD，我们将提供一个较小的四边补丁，安装在相对于下层图像尺寸的图案图像中间 [15, 16]。具有有效 BD 的 MM 可以表现为在正确输入上是正确的模型，并将\
  \ VF 无意义地分类为 BD 目标。我们承认 VD 洞察的设计是 BD 有效性和效率的关键考虑因素。我们尝试探测了三种可以作为补丁的样式（参见图 23.3），即只有纯颜色的实心补丁，裁剪这些图像会导致对象的丢失，如出生、OP\
  \ 以在传感器集中产生协调的动作 [15]。\n\n### 23.6.3 优化的补丁与恢复\n\n大多数超现代 VQA MM 首先通过静态预训练的 OS 修改图像。结果是，无法确认\
  \ VD 信号是否能持续第一步。我们了解到，使用正常 VT 运行的木马 VQA 模型对文本性产生了过度依赖，在仅有 QD（查询数据）的情况下，也会发生类似的错误分类\
  \ [13, 15, 17]。我们假设这是因为没有保持 QD 和 VD 之间孤立清晰度的平衡，如果图像中出现扭曲或损坏，这是可能的。VQA 系统仅提供了一个“看到”视觉数据的窗口，如果\
  \ VQA 系统无法从数据中“看”到 ID，它就无法有效地配置和学习二值关键步骤。这导致 OP 需要在 OS 的点集中产生协调且区别明显的动作。\n\n在这里，我们展示一个制作补丁的计划，我们将其称为语义补丁优化（SPO）。我们的工作与以下几项工作不同，我们的系统同时击中对象行为、特征制造者、模式，这导致对我们处理结果产生的底层点具有更精细的控制权限。我们通过选择有意义的（语义）目标迈一步，这些目标由组件特征支撑组成。这些选择是基于几种替代方案的\
  \ [15, 18]。现在定义优化。假设 `D(x)` 是输入图像为 `x` 的传感器组。考虑我们有 `y` 表示传感器的工作，其变量为所需的物体框数量、每个框中的物体和特征组。我们将第\
  \ `ith` 个物体和特征预测配置为 `y^i[obj]` 和 `y^i[attr]`。假设框预测的总数由 `N[B]` 表示。考虑由 `p` 表示的 OP\
  \ 模式，并令 `M(x, p)` 是一个在 `x` 上取两个参数 `p` 的函数。`t[obj]` 和 `t[attr]` 用于显示被选目标对象和特征。最终，我们有\
  \ `CE[(y, t)]` 用于在系统处理过程中计算 `y` 和将要目标的值 `t` 之间的交叉熵。图 23.7a 显示了目标函数，图 23.7b 显示了过程优化以及文中配置的\
  \ VT 补丁：实心、裁剪和优化。BD 的最佳性能是由具有意义目标特征的下方中间补丁实现的 [5]。\n\n![图 23.7 (a) 目标函数。(b) 本文中配置的带有某些花的\
  \ VT 补丁：实心、裁剪和优化 [5, 7, 8, 16]。](images/fig23-7.jpg)\n\n图 23.7 (a) 目标函数。(b) 本文中配置的带有某些花的\
  \ VT 补丁：实心、裁剪和优化 [5, 7, 8, 16]。\n\n### 23.6.4 指标衡量\n\n木马准确率 - 在完全运行的 VQA 验证套件上评估的木马模型准确率\
  \ [15。越低越好。该指标有一个下限，但在实践中很小。\n\n清洁准确率 - 根据 VQA 评分系统在纯 VQA 验证集上评估的 VQA 木马模型准确率 [12,\
  \ 15]。该指标应尽可能接近纯模型。\n\n攻击成功率 (ASR) - 导致后门激活的全执行验证样本的比例 [15。只有当后门目标不匹配十标注者回答之一时，该样本才计入此指标。越高越好。\n\
  \n仅图像成功率 (I-ASR) - 仅存在图像密钥时的成功。这对于确定木马模型学习的是两个密钥还是一个是必要的。此值越低越好，因为只有当两个密钥都存在时后门才应该被激活。\n\
  \n\n\n\n仅问题自动语音识别 (Q-ASR) - 等同于 I-ASR，但仅当问题键存在时 15。\n\n## 23.7 解决方案\n\n我们开发了一个系统，其主要目标是提供具有合理依据的推荐以及准确的可解释理由，作为\
  \ RNN 的更好替代方案，即使用基于 `Att.` 的 VQA 框架的 `LSTM`。\n\n首先，我们将对象建模为输入，并向用户输出 GUI 形式，以便更好的方式获取推荐。首先，在获取用户输入后，将其转换为单词，因此该模型将通过相加所有单词将所有单词转换为词向量。因此，该模型希望词向量的长度与特征向量相同，而该词向量被称为嵌入（embeddings）。\n\
  \n在随后的步骤中，这些词向量将按顺序发送到 `LSTM` 网络，涉及问题的标记。输入问题的表示是来自 `LSTM` 输出门的向量。现在转向图像，图像通过 `Deep\
  \ CNN` 进行处理，并在倒数第二层（即 `soft-max` 函数之前的层）运行后提取出图像特征。通过发散性思维，我们通过使用 `CNN` 从亚马逊数据集提取的图像中提取特征，分析出用于图像识别的最优表示形式（向量形式）。\n\
  \n## 23.8 预期结果\n\n### 23.8.1 可解释推荐系统\n\n这种合理的推荐系统是我们模型的产物，其目的是改进真实的建议。即：它们是针对某个特定部分、他人感知以及对该产品的书面评论进行定制的。此外，我们发起的系统是一系列易于理解、相关联、可读性强且与电子商务平台的评论评分系统相似的词汇\
  \ 6。\n\n### 23.8.2 VQA 系统\n\n我们将导入 `Kares` 库为特定图像创建 `Convolutional Network` 层并提取所需的图像特征。`LSTM`\
  \ 是 `RNN` 的一个特殊部分，用于 `NLP`，通过理解其语义将问题转换为词向量。然后，将提取的图像隐藏特征与词向量相加，生成一个 `(object, Question)`\
  \ 元对。之后，这些向量的逐元素相加产生了终端用户对产品所提问题的答案。图 23.8 显示了带有 `Att. Based LSTM System` 的 VQA\
  \ 系统内部过程演示，从初始的卷积层形成和特征向量创建，到由电子商务用户施加的一系列问题通过 `Att.-based` 查询生成。\n\n### 23.8.3\
  \ 量子安全方面\n\n每个木马 VQA 模型的中介展示分为三个大类：`VT`、VQA 模型和属性提取器。\n\n![图 23.8 基于注意力机制的 LSTM\
  \ VQA 系统内部过程演示 [10]。](images/fig23-8.jpg)\n\n图 23.8 带有注意力机制的 LSTM VQA 系统内部过程演示 10。\n\
  \n#### 视觉触发器的影响\n\n通过优化的 `VTs` 帮助训练的 `BDs` 可以达到高级的 ASR 和较低的 Q-ASR，这表明这些可以产生更大的影响，因此也更有效。该模型在每种架构组合的影响下，木马模型在初始数据上的卓越性与其清洁模型副本几乎相等。我们得出结论，更复杂且性能更高的\
  \ VQA 模型更擅长学习 `BDs`。应用于清洁 VQA 数据时获得顶级性能的模型也可以获得较低的 Q-ASR，反映了对 `VD` 的良好学习 [15, 18]。\n\
  \n#### 探测器的影响\n\n当我们尝试加速两种类型补丁的传感器复杂度时，可以看到一个恒定的趋势，我们可以观察到性能和有效性的下降，这对于效果最差的固态补丁来说更为危险和严重。对于\
  \ `OP`，当我们尝试加速传感器复杂性时，我们可以观察到性能和有效性存在下降，11, 15。\n\n## 23.9 结论\n\n本报告得出结论，在我们的多模态推荐中，`LSTM`\
  \ 8 这种神经网络是有效的。我们使用了 `DKMB` - 为了获取获取语义的 `BD`。据我们知识，我们首次研究了多模态领域的 `BDs`。我们发现了一个简单的趋势，模型越复杂对\
  \ `DKMB` 就越敏感。最终，我们使用了 `TrojVQA`，一个巨大的 `BD` 模型集。\n\n## 23.10 缩写\n\n本文使用了以下缩写：\n\n\
