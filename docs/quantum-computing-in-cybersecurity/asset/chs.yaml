  \n## 摘要\n马尔可夫链的基本概念在数学家和工程师中已已 80 年，但直到过去十年，它才被直接应用于语音处理的难题。基于马尔可夫链的语音模型直到最近才创建的一个重要原因是，缺乏一种修改马尔可夫模型参数以适应实际信号模式的策略。理论和执行方面的进一步进展使得马尔可夫建模方法具有了广泛的应用。本研究的目标是介绍基于量子计算的马尔可夫模型理论，并演示其如何用于解决语音识别问题。\n\
  \n**关键词：** 马尔可夫模型，学习算法，语音处理，语音识别\n\n## 6.1 引言\n假设你面临以下情况：一个现实世界的过程产生一系列可观测符号 `[1–3]`。这些符号可能是离散的或连续的。\n\
  \n为了应对这种挑战，必须根据信号和系统理论做出某些基本决策。例如，有线性和非线性模型、时变和时不变模型，以及确定性和随机模型供选择。根据选择和额外的信号处理考虑，可能会创建几种潜在的信号\
  \ `[4]` 模型。\n\n考虑信号，它稍微复杂一点，特别是一个嵌入了噪声的正弦波。信号的噪声分量增加了建模的挑战，因为在估计正弦波参数（振幅、频率和相位）时，必须考虑噪声分量的属性。\n\
  \n在前面的实例中，这可能不是一个合理的假设。如果未知过程（例如）产生一个幅度变化的正弦波，那么非线性模型（如幅度调制）可能更为合适。\n\n### 线性系统模型\n\
  后续实例的原理在经典通信理论中已过彻底研究。\n\n线性系统模型将合适源激发的输出表示为对象符号，另一类重要的信号建模 `[5]` 技术，已被证明对广泛应用很有帮助。在这种情况下，信号建模涉及确定线性滤波器系数，有时还包括激励参数。其他类型的频谱分析也失效了。如果不考虑时间方差，许多现实过程将无法被准确描述。此类过程的一个例子是语音信号。建模信号时间波动的挑战可以通过多种方法来。\n\
  \n将该过程视为这些较小“短时间”片段的线性组合，每个片段由一个线性系统模型表示，以处理过程的时变特性。整个模型是一个同步的符号序列，每个符号都代表过程的一个作为线性系统模型的小组件。这种方法通过利用代表信号的信号标记来显示检测到的信号。\n\
  \n### “时变”过程\n当使用上述方法对时变 `[6, 7]` 事件进行建模时，每个短时间观测片段被认为是一个恒定持续时间的单位。短时间片段的持续时间在大多数物理系统中实验定义。在这些活动中，不会假设过程特性随每个单位分析时间同步变化，也不会在单位之间检测到显著变化，除非存在异常情况。这种信号建模模板技术已被证明是非常有效的，并已用于创建许多语音识别系统。\n\
  \n有理由相信，尽管上述方法很有用，但它目前不是最有效（在计算、存储、参数等方面）的表示策略。许多真实过程似乎具有相当的顺序变化行为。过程的属性通常在一段时间内保持相当的一致性（除了轻微波动外），然后在特定点（逐渐或快速地）变化为另一组特征。如果我们能首先检测出这些相对恒定行为的时期，然后接受这些稳定时期内部每个时间变化在某种意义上是统计性的，我们就可以利用更高效建模的潜力。通过对信号的每个稳定或良好部分使用熟悉的简短模型，并对一个阶段如何进展到下一个阶段进行定义，可以实现更高效的表示。隐马尔可夫模型（H/vM）就是这样创建的。必须解决三个问题：1)\
  \ 如何识别这些一致或独特运行的时间，2) 对于这些每个时间点，将使用哪种通用或广泛的短时间模型，3) 如何表示这些间隔的“顺序”变化的特性。基于量子计算的隐马尔可夫模型可以在不使用概率或统计框架的情况下满意地解决这些问题。量子计算机在涉及大量数据输入的问题求解方面表现。它们旨在解决超级计算机需要几天才能解决复杂问题。基于量子计算的隐马尔可夫模型（HQMM）`[8,\
  \ 9]` 由 Monras *等人* `[1]` 引入，其参数为 Kraus 算子。\n\n描述 HQMM 的主要目标是何时以及如何实际应用。我们不会将性讨论限制在任何特定主题上，但在本文结束通过几个示例展示\
  \ HQMM 如何应用于语音识别。\n\n## 6.2 隐量子马尔可夫模型的详细阐述\n\n\n\n\n\n隐藏量子马尔可夫模型（HQMM）是一个两阶段随机过程\
  \ \\[10, 11\\]，包含一个隐藏（不可观测）的随机过程，该过程只能通过另一组生成观测符号序列的随机过程可见。下面的硬币掷示例展示了 HQMM。\n\n\
  ### 硬币掷示例\n\n考虑以下简单示例来理解 HQMM 的概念。你在一个有一个隔板（例如帘子）的房间里，隔板阻止你看到正在发生的事情。隔板另一边的另一个人正在通过掷硬币（或多枚硬币）进行实验。那个人不会告诉你任何关于他在做什么的信息，但他会告诉你每次\
  \ `Coin Flip` 的结果。因此，进行了一系列秘密的抛币测试，而你只能看到抛币的结果，即：\n\n![images](img/eqpg108-1.png)\n\
  \n其中“ℋ-”代表正面，“ℱ-”代表反面。\n\n基于上述实验，挑战在于构建一个 HQMM 来解释观测到的正面和反面序列。图 6.1a 展示了其中一个模型。这被称为“单公平硬币”概念。该模型有两个状态，但每个状态分别与正面（状态\
  \ 1）或反面（状态 2）相关。因此，这个模型不是隐藏的，因为观测序列以独特的方式定义了状态。由于正面（或反面）之后生成正面（或反面）的概率等于 0.5，该模型反映了一个“公平硬币”。这个退化的示例展示了独立的实验（如掷公平硬币）如何被解释为一系列事件。当然，如果隔板后面的人掷的是单枚公平硬币，这个模型应该能够充分解释结果。\n\
  \n另一个描述观测到的掷币结果序列的潜在 HQMM 是 图 6.1b。这个概念被称为“双公平硬币”模型 \\[11–14\\]。这一次，模型包含两个状态，但没有一个状态与正面或反面相关。两个状态下正面（或反面）的概率均为\
  \ 0.5。此外，任何状态都有 0.5 的概率离开（或返回）。结论是，在这种场景下，我们可以将每个状态与一枚公平（公正）的硬币联系起来。由于留在或离开这两个状态之一的概率均为\
  \ 0.5，读者稍加思考就能让读者相信状态转换不会影响“双公平硬币”模型观测输出序列的统计特性。\n\n图 6.1c 和 6.1d 代表了另外两种可能解释正反面序列的\
  \ HQMM。图 6.1c 显示了一个具有两个状态的模型，标记为双偏态硬币模型。它在状态 1 中严重偏向正面，在状态 2 中严重偏向反面。所有的状态转换概率均为\
  \ 0.5。这个带有两枚偏态硬币的隐藏马尔可夫模型与之前提到的两个模型不同。如果隔板后面发生了以下情况，这个概念就非常适用。如 图 6.1c 详细所示，那个人拥有三枚硬币，其中一枚是公平的，另外两枚是偏态的。公平硬币的面由两枚偏态硬币代表。我们可以使用这种方法（即切换偏态硬币）研究并解释上述细微特征的变化。图\
  \ 6.1d 展示了一个具有三个状态的模型，我们称之为三偏态硬币模型。它在状态 1 中稍微偏向正面，在状态 2 中严重偏向反面，在状态 3 中稍微偏向反面。在图\
  \ 1d 中，我们没有提供状态转换概率的值；尽管如此此类模型生成的观测序列的行为受这些概率的影响 [\\[17\\]](#c06.xhtml#ref17)。\n\
  \n\n\n\n\n`A` = `{aij}`, `aij = Pr(qj at t + 1 qi at t)`, 状态转移概率分布\n\n`B` = `{bj(k)}`,\
  \ `bj(k) = Pr(vk at tl q; at t)`, 状态 `i` 的观测符号概率分布\n\n`π` = `{π[i]}`, `π[i] = Pr(qi\
  \ at t =1)`, 初始状态分布\n\n观测序列 `O = O1, O2,...,OT` 使用该模型创建的过程如下：\n\n1. 根据初始状态分布，选择一个初始状态\
  \ `π`。\n2. 将 `t` 的值设置为‘1’（一）；\n3. 根据 `bit`（即状态 `i[t]` 的符号概率分布）选择 `O[t]`；\n4. 根据\
  \ `{ a[itit+l]}`，选择 `i[t+1]`。状态 `it` 的转移概率分布为 `i[t+1] = 1,2,...,N`。\n5. 设置 `t =\
  \ t + 1`；如果 `t <T`，则返回步骤 3；否则结束。\n\n一个 HQMM 使用简洁记法 `A = (A, B, π)` 表示。概率密度 `A`、`B`\
  \ 和 `π` 与状态 `N` 和符号 `M` 一起指定。在量化这三个密度（即 `A`、`B` 和 `π`）的重要性时，显然 `π` 的重要性最低（它反映了初始情况），而对于大多数应用，`B`\
  \ 被认为是最相关的（这与观测到的符号有关）。`A` 对于某些问题至关重要（回想那三个偏差硬币），而对其他问题相关性较低（例如孤立词识别）。\n\n### 隐隐马尔可夫模型\
  \ – 多种类型\n\n我们一直在使用的通用 HQMM 被认为具有完整的“状态转移矩阵”，这意味着可以从任何状态到任何其他状态的转移。我们目前为止处理的通用 HQMM\
  \ 被认为包含全转移矩阵，意味着可以从任何状态到任何其他状态的转移。这些模型通常是遍历的，这意味着它们以概率 1 被再次访问，且不需要按固定间隔进行。`图 6.3a`\
  \ 展示了此类模型的示例。状态转移矩阵有限制的非遍历模型也适用于某些应用（`图 6.3b` 和 `6.3c` 展示了两个非遍历 HQMM）。\n\n在某些情况下，状态转移矩阵是上三角的（允许转移到索引等于或大于当前状态索引的状态）。从左到右模型之所以这样命名，是因为生成观测序列的状态序列应该从左向右移动。因为低编号状态对应于发生在高编号状态之前的观测值，因此从左到右模型对\
  \ HQMM 施加了与时间相关的顺序。在我们对如何使用 HQMM 进行语音识别的研究中，我们将探索如何利用这一特性。\n\n大部分技术的操作方法与描述的完全一致。然而，为了使过程尽可能有效，至少有一个重大的计算困难以及若干实际考虑因素必须被考虑在。前向-后向计算是计算问题。起初，读者将看到\
  \ `αt` 和 `βt` 迅速趋向于 0。重要的是记住，所有概率都小于 1.0。为了避免数学下溢，有必要对 `α` 和 `β` 进行缩放处理。\n\n```\n\
  图 6.3 展示了不同的 HQMM。\n```\n`图 6.3` 展示了不同的 HQMM。\n\n第二个问题是使用有限的训练数据来计算 HQMM 参数。重估计公式显示，如果训练集中没有出现（即如果某个符号没有在观测序列中定期出现），则该符号的概率将变为\
  \ 0。在训练规模较短的情况下，观测序列导致了这种影响，必须额外小心以确保没有哪个 HQMM 参数太小。在任何情况下，都必须努力确保预测的 HQMM 参数是可以接受的（可能通过参数限制来实现）。\n\
  \n最后，本研究为单个观测序列提供的公式可以调整以覆盖多个观测序列。结果是，可以使用长序列或重复观测序列组来训练 HQMM（这对于非遍历模型特别有益）。\n\n\
