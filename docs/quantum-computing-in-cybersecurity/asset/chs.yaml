  \n量子加密利用量子物理原理创建一个更安全、更可靠的系统。没有人可以绕过这种机制而不让通信发送者或接收者察觉。由于无法在不引起注意的情况下测量系统的量子状态，量子加密依赖于光子及其底层量子特征来创建一个不可破解的加密系统。\n\
  \n[10–14] 量子加密提供了各种益处：\n\n1. 安全通信\n2. 它基于物理定律，使得量子加密更安全、更复杂。\n3. 提供多种增加安全的方法。\n\
  4. 如果未经授权的用户尝试读取加密数据，量子状态就会发生改变并修改用户的预期结果。\n\n量子加密的一些局限性是：\n\n1. 光子在传输过程中可能会改变偏振，这可能会增加错误率。\n\
  2. 量子加密的最大范围在 400km 到 500km 之间。\n3. 量子加密使用光纤链路和中继器。\n4. 在量子通道中无法向两个或多个位置发送密钥。\n\n\
  \n\n\n现有模型融合了图像特征元素 (`ViQi`) \\[15, 16\\]，但这些解决方案很大程度上忽略了 `Vi` 和 `Qi` 是否处于同一空间，以及如何减少\
  \ `Vi` 和 `Qi` 中的可见噪声。因此，在他们的模型中提出了差分网络（`DN`），并利用 `DN` 的工具，针对 VQA 任务提出了基于差分网络的融合（`DF`）。图\
  \ 16.2 显示了图像识别模型，图 16.3 代表了 RSA 的内部工作原理。\n\n在下图中清楚地看到，在 VQA 的帮助下，差分网络和基于差分网络的融合（`DF`）\
  \ \\[17, 18\\]我们可以轻松地回答由图像生成的问题。图 16.4 显示了典型的 RSA 算法工作。\n\n![图 16.2 图像识别 [1, 2].](images/fig16-2.jpg)\n\
