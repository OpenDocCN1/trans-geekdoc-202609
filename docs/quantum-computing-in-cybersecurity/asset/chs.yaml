  \ College，计算机科学与工程系*\n*⁴印度博帕尔，Sagar Institute of Research and Technology，计算机科学与工程系*\n\
  *⁵印度印多尔，IPS Academy，计算机科学与工程系*\n\n## 摘要\n\n在许多领域，例如从大型数据仓库中搜索数据、质因分解、数论、网络安全、多项式求值、插值、机器学习和人工智能，都需要高强度的计算任务。量子计算是一种可以执行这些任务的新兴技术。任何经典计算机可以解决的计算问题也可以通过量子计算得到更有效地解决。\n\
  \n在许多领域，例如从大型数据仓库中搜索数据、质因分解、数论、网络安全、多项式求值、插值、机器学习和人工智能，都需要高强度的计算任务。量子计算是一种可以执行这些任务的新兴技术。任何经典计算机可以解决的计算问题也可以通过量子计算得到更有效地解决。\n\
  \n关键词：后量子加密，对称加密，非对称加密\n\n## 22.1 引言\n\n量子计算的原理是本研究的基础。在经典计算中，数据表示为 `0` 或 `1`。在量子计算中，每个状态表示为\
  \ `qubit`，它可以同时持有 `0` 和 `1`。本文的目的是讨论量子计算对数据安全和隐私构成的威胁。\n\n我们将探索一些可能被视为对当前加密系统威胁的方法。本文重点关注后量子加密，以确保我们社区的安全。\n\
  \n## 22. 本章结构\n\n在本文中我们将探索一些可能被视为对当前数据安全威胁的方法。\n\n- 22.2 介绍了当前加密算法和系统的背景。\n- 22.3\
  \ 讨论了量子计算与传统计算的比较。\n- 22.4 介绍了后量子加密。\n- 22.5 讨论了制造量子计算机的企业参与情况。\n- 22.6 讨论了对关键基础设施的威胁。\n\
  - 22.8 以广泛的研究领域和启示作为结论。\n\n## 22.2 现有加密算法和系统\n\n本节将简要解释某些加密算法在现代加密中的作用。\n\n### A.\
  \ 对称密钥算法\n\n对称密钥算法是指使用密钥对电子信息进行加密和解密的算法。在这种方法中，每当发送者发送加密的电子数据时，只有预期的接收者才能解密这些数据。对称密钥算法包括但不限于\
  \ `AES`、`DES`、`IDEA`、`RC4`、`RC5` 和 `RC6`，其中 `RC4` 是流加密，其他是块加密。对称密钥算法理想上用于批量加密，包括加密大数据或加密数据库中的列数据。\n\
  \n### B. 非对称密钥算法\n\n\n\n\n\n非对称密钥算法涉及公钥和私钥的密文，也称为公钥加密。与对称密钥算法相比，非对称密钥算法本质上速度较慢，因此理想情况下仅用于建立安全连接，从而通过加密信道保护通信。一些非对称算法包括\
  \ `Diffie-Hellman protocol` [\\[9\\]](#c22.xhtml#ref9)、`Rivest, Shamir, Adleman\
  \ algorithm` [\\[10\\]](#c22.xhtml#ref10) [RSA]。Table 22.1 显示了**算法对比**。\n\n### C.\
  \ RSA 加密系统与因数分解问题\n\n1997 年，Ronald Rivest、Adi Shamir 和 Leonard Adleman 发明了一种名为 `RSA`\
  \ 的公开方案，其意图并非为了取代非对称算法（因为后者的成本很高），而是为了解决双素数因数分解问题。根据 Paar 和 Pelzl [\\[11\\]](#c22.xhtml#ref11)，通常\
  \ `RSA` 算法用于在两个节点之间交换密钥。尽管 `RSA` 算法非常强大，但新兴的高性能计算也会使其变得脆弱，密钥可能被破解 [\\[12\\]](#c22.xhtml#ref12)。\n\
