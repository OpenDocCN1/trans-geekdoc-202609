  \n## Note\n1. *通讯作者*：william160891@gmail.com\n\n# 11 量子加密的安全方面\n\n摘要\n加密用于确保双端通信的安全。秘密消息传输是加密中最关注的问题。维护机密性的协议是加密性的。量子加密的安全性较少依赖于数学问题的解决，更多地依赖量子物理和统计学等科学基础。量子加密的一种流行用途是用于通信的加密密钥，即量子密钥分发（QKD）。\n\
  \n**关键词：** 加密、网络安全、威胁、互联网、量子通信、网络空间\n\n## 11.1 引言\n\n\n\n\n\n近年来，信息技术和通信领域经历了显著的增长。密码学是用于保护各方通信免受攻击者侵害的方法。密码学的主要目标是身份验证（确保消息来自授权源）、机密性（除预期接收者外，无人可以读取消息）以及数据完整性（确保消息在传输过程中不被更改）。这是通过向接收者发送秘密消息来实现的，该消息只能使用先生成的密钥进行解密。该密钥可能被外部人员轻易复制或窃取。\n\
  \n可识别信息 密码学中通常需要复杂的数学计算 \\[1–3\\]，这可能会减慢处理速度。量子加密被用于绕过这些限制并提高通信安全性。斯蒂芬·维斯在 20 世纪\
  \ 60 年代后期发明的共轭编码为量子密码学铺平了道路。量子密码学 [[4]](#c11.xhtml#ref4) 是一种利用量子物理应用来安全传输信息的方法。今天社会经常使用用于加密的数学程序，例如椭圆曲线加密和\
  \ `RSA`。这些算法并没有足够的安全水平。这些广泛使用的数学密码系统对必须保持高水平安全的信息构成了威胁，并且容易受到破解。\n\n量子密码学的安全性与其说依赖于数学问题的解决，不如说取决于量子物理和统计学的底层科学原理。量子密码学的著名应用量子密钥分发（`QKD`）通过产生密码密钥来建立通信。此外，它基于海森不确定性原理，该原理既确保了安全又防止了窃听和监视。由于某些不一致性，即使对手窃听涉及密钥的对话，通信双方也能轻松地确定这一事实。`QKD`\
  \ 设备由一个光子收发器和一个电气组件组成。由于光子的脆弱性，`QKD` 的通信距离限制在 50–100 公里。\n\n量子计算遵循叠加、纠缠和量子物理原理。叠加是在处理信息的同时执行新操作的过程。根据量子叠加理论，两个粒子可以同时占据不同的位置。由于它存在亚原子粒子领域，在宏观世界中无法直接感知。如果不考虑所有其他相关粒子的属性，就不对纠缠态的粒子进行表征或描述。量子加密主要依赖\
  \ `qubits`，它们用于量子力学而非传统的比特。\n\n## 11.2 文献调查\n\n[[1]](#c11.xhtml#ref1) 强调了量子密码学及其在多层防御中对抗黑客的作用。文中概述了当今数字密码系统的某些缺陷，包括需要耗时且费力的计算。基于量子物理基本且不可改变的原理的量子加密可以绕过这些缺点。我们提供了一个如何实现量子密钥分发的示例（以确保密钥的安全分发），以说明我们的观点。文中讨论了\
  \ `QKD` 的许多优点，包括其机密性、身份验证、速度、稳健性、位置的独立性以及对流量分析的抵抗。量子密码学的使用已经在多种平台上投入实践，包括 DARPA\
  \ [[5]](#c11.xhtml#ref5) 量子网络和 MagiQ Technologies 等。量子密码学包含了数据过滤、纠错、增强用户隐私和用户验证等技术。\n\
  \n[[2]](#c11.xhtml#ref2) 讨论了用于秘密通信的经典密码学，以及与其更现代的对应物——对称加密和非对称加密。文中还描述了量子密码学的优点，包括量子纠缠现象，在该现象中，两个或多个对象的量子属性根据它们之间的关系进行表征。分析了作为量子密码学实现方法的量子密钥分发。作者描述了三种安全措施，包括在\
  \ `802.11` 网络中使用量子密码学，并解释了它们的工作原理。这些是密钥生成、加密和身份验证算法。\n\n[[3]](#c11.xhtml#ref3) 描述了密码学的目标。解决了量子加密密钥分发过程的安全传输问题。描述了一次性密码的不可破坏性，以及密钥产生、分发和管理的问题。提供了\
  \ `B92` `QKD` 协议的解释 [[6]](#c11.xhtml#ref6)。量子力学更加可靠，因为它不暴露隐藏值。它的实际实现利用单光子极化态。许多因素可能会影响系统的数据率和错误率。该研究提供了多种提高速度的不同策略。\n\
  \n[[4]](#c11.xhtml#ref4) 衡量了使用量子密钥分发系统与更传统方法的安全性。提到了暗数和损耗。讨论了各种类型的错误机制。使用参数下转换来增强远距离信号的安全性，尽管这种方法在几个方面受到限制，例如范围和暗计数的减少。通过使用量子中继器，数据可以安全地跨越远距离发送，而无需担心信号衰减。\n\
  \n在另一篇 [[4]](# 文献中，作者分享了对桌面模块化 `QKD` 技术的看法，这种技术对于构建复杂系统既安全又有用。在这里，我们提供了一种处理高频率光脉冲的插用技术。然而，这种插用方案具有某些缺点，例如极化波动问题，因为光脉冲通过量子通道两次。灵活性、易用性和稳固性只是其优点之一。\n\
  \n## 11.3 量子密钥分发\n\n密钥循环的目标是让最初没有共享信息的两个客户 `Alice` 和 `Bounce` [7, 8] 商定一个监听他们交互的攻击者\
  \ `Eve` 无法得出的随机密钥。电子通信通常可以被秘密地观察，使得监视者可以在发送者或接收者察觉的情况下获取全部内容，这在传统加密和数据理论中被低估了。当复杂信息包含在单光子等基础量子框架中时，可以开发出那些不了解传输生成精确数据的第三方无法成功读取或复制的交换分歧。监视者无法在不引起通道合法客户识别的扰乱此类传输而添加任何碎片信息。图\
  \ 11.1 显示了基础量子 [9, 10] 的密钥分发模式。\n\n![图 11.1 基础量子 [9, 10] 的密钥分发模式](images/fig11-1.jpg)\n\
  \n**图 11.1** 基础量子 [9, 10] 的密钥分发模式。\n\n\n\n\n\n为了开始基本的量子密钥分发，Alice 向 Bob 发送了一系列四种不同类型的光子。然后，Weave\
  \ 为每个光子单独选择测量光子的偏振方式是直角化还是圆化（推测这与 Alice 所出的决策是相互独立的，因为此时他并不知道这些决策）。之后，Bounce 自由地分享他所做的估计类型（但不包括估计结果），而\
  \ Alice 再次自由地与他分享他的估计是否正确（即直角化还是圆化）。Alice 和 Bob 同意清除所有由于 Bob 估计错误的未填充槽位。此外，他们允许移除\
  \ Bob 探测器完全未能检测到光子的位置上的比特，这在目前的光频定位器中发生得异常频繁。在解码剩余光子的偏振时，比特 0 代表水平和右圆周偏振，而比特 1 代表垂直和左圆周偏振。假设量子通道未被截获，以下并行字符串应代表只有\
  \ Alice 和 Bob 才能知道的信息。量子传输 [11, 12] 是所有这些措施的最终结果（或者有时为了强调它是从一开始就获取的而称为原始量子传输）。在基础协议的下一步中，Alice\
  \ 和 Bob 通过比较他们认为应该同步的某些光子的偏振，确保没有人在窃听。\n\nAlice 发送了一系列随机的光子，这些光子是迷人的 (\\*- -)、垂直的\
  \ ($$)、右圆的 () 和左圆的 ()；\n\nBounce 在不均匀的直角基底 (+) 和圆基底 (0) 序列中量化光子的偏振。\n\nBob 计算的含义（某些光子可能无法通过任何方式获得）。\n\
  \nWeave 随后告诉 Alice 他获取每个光子时所使用的前提。\n\nAlice 为他指明了正确的基础；\n\n只有这些经过仔细测量的光子的信息会被保留，其余部分被\
  \ Alice 和 Bob 丢弃。\n\n根据编码方案，这些信息解密为双重排列。`~ = C~ = 0`。\n\n## 11.4 密码学\n\n密码学 [13,\
  \ 14] 的目标是将信息转换为不可破解的代码，以保护信息免受窥探。通信在发送给接收者之前会被编码，以便无法被窃听者读取。明文是指未加密的通信，而密文 [[15]](#c11.xhtml#ref15)\
  \ 指加密版本。密码学使用了加密解密技术和密钥。\n\n![images](img/eqpg193-1.png)\n\n其中 `c` 代表密文，`p` 明文，`K`\
  \ 密钥，`m` 消息，`E` 加密，`d` 解密。\n\n**对称加密**：只有发送者和接收者彼此彼此的密钥时，消息才能被解密。这种技术被称为“对称加密” [16,\
  \ 17]。\n\n**非对称加密**：有两个不同的密钥（公钥和私钥）。使用一个密钥加密的通信可以使用另一个密钥解密。公钥可用，但他自己拥有私钥。当发送者使用接收者的公钥加密消息且只有接收者的私钥可以解密时，发送者和接收者都能确保通信的机密性。相反，认证消息的接收者可以使用接收者的公钥解密消息来检查发送者的身份。一次性扇（One\
  \ Time Pad）是已开发的几种基于对称加密的密码系统中的安全变体。它基本上是维吉尼亚密码的超级增强版 [[18]](#c11.xhtml#ref18)]。明文和密文之间的连接不再提供额外的安全性。为了实现最大的安全性，密钥从不重用，密钥长度与消息长度成比例，并且在每次传输中都随机字母。一次性扇指的是执行操作的方法，即时间垫。尽管如此，它也有缺点，例如密钥板的分发非常麻烦。因为密钥板必须相似才能使加密消息正常工作，丢失其中一个可能会给未来的连接带来麻烦。\n\
  \n**基于位置的量子密码学** [19：基于位置的量子密码学的目标是将接收者的地理位置成为决定消息如何发送的主要因素。如果发送者为接收者指定了一个特定的查看消息地点，那么接收者只能访问该地点。\n\
  \n**设备无关量子密码学** [[20]](#c11.xhtml#ref20)：如果一个量子密码系统不需要特定的量子设备，则被称为设备无关的。\n\n**后量子密码学**：后量子密码学是一种结合传统密码工具与量子计算机来击败密码攻击的方法。许多著名方法可以通过不同方法被破解，因此需要一种称为后量子密码学的新型密码学。\n\
  \n## 11.5 使用微弱激光脉冲的量子密码学\n\n1989 年，研究人员首次为了探索目的演示了量子密钥的传播。（由于于 Bennett 等人 1992a，它基本上在\
  \ 1992 年被传播。）[[21]](#c11.xhtml#ref21)。自那以后取得了重大进展。几个机构最近展示了在非实验室环境下量子密钥传输的可行性。基本的\
  \ QC 可以在任何双级量子框架中进行。从远来看，每种操作都需要光子。为什么我们可以控制并引导它们与地球的退干连接。科学家还可以受益于过去二十年来出现的光介通信技术。我们短期内不太可能切换到其他类型的传输器。在比较各种量子加密安排的同时评估多个模型，是一项耗时且复杂的任务。真正重要的是传输间隔以及处理秘密比特的速度（精炼后的比特率，`Rdist`）\
  \ [22。\n\n人们会立即理解，传统光通信系统现行的吉赫兹速度通过目前可用或预计未来开发的创新是无法实现的（在 Gilbert 和 Hamrick 于 2000\
  \ 年发表的详尽论文中，[23] 讨论了实现高比特率 QC 的可行技术）。因此，只有最敏感的信息应该使用通过量子加密传输的密钥进行加密。尽管传输间隔和发现率（原始比特率，`Rraw`）是绝对确定的，但估计净率可能是具有挑战性的。尽管在理论上比特分组错误完全是由敌意干涉者的操纵引起的，但在实践中这种情况非常罕见。\n\
  \n\n\n\n由于探索性错误直接导致 Alice 和 Bob 的密钥之间存在持续的差异。可以对错误率进行准确计算，在此处将其称为量子比特错误率，即 `QBER`。同样，修复错误是一个相当简单的过程。首先，在纠正错误时，与\
  \ `QBER` 成正比的密钥将降低。实际问题在于解释 Eve 获得的数据，这一数量对于安全开发至关重要。它不仅取决于 `QBER`，还取决于其他方面，例如对光源光子数的测量或确定估计假设采用的技术。\n\
  \n## 11.6 窃听 [22\n\n### A. 问题与目标\n\n由于 Alice 和 Bob 压缩了他们的量子比特并共享了基底，他们拥有密钥。理想情况下，这些密钥应该是相同的。然而，总会出现一些错误，因此\
  \ Alice 和 Bob 需要使用某些经过测试的方法（如错误纠正和安全增强）来处理信息。为了获得密钥，必须遵循第二套规则，而不可追踪的密钥可以通过第一套规则获得。窃听的主要目标是识别\
  \ Alice 和 Bob 只能测量 `QBER` 的协议，要么给 Alice 和 Bob 提供安全密钥，要么终止协议。这样做是为了让窃听者报告密钥传输失败。由于这项研究处于量子科学和数据推测的交汇点，它被认为是非常复杂的。总而言之，存在许多窃听问题，每种问题都取决于特定的约定、量子化的程度、Eve\
  \ 的假设能量以及 Alice 和 Bob 设备的可靠性。在不诉诸数值严谨性或提供详尽调查的情况下，我们查看一些问题和安排。出于安全考虑的检查是许多量子系统的目标\
  \ [20。当我们说“理想”时，意味着即使 Eve 使用了最先进的技术，也不会发生窃听。这些是显式声明的假设。另一方面，可行的确认涉及硬件和软件。\n\n因此，“理想”与“现实”证据之间存在冲突。前者无疑源于广泛的假设，而后者侧重于特定的应用。应该优先考虑这些确认。尽管存在显而易见的安全风险，它们提供了关于量子信息的宝贵机会。在理想世界中，Eve\
  \ 将拥有最先进的设备，仅受量子物理学的限制，而非技术限制。要重要的是，Eve 不能克隆量子比特，因为这样做会破坏它们的量子属性。相反，Eve 有权使用她认为合适的任何通信策略，只要涉及一个或多个量子比特以及她选择的辅助。此外，在考虑连接后，Eve\
  \ 可以长时间保持她的辅助不受干扰，特别是当她完全与外界隔绝时。现在她听到了 Alice 和 Bob 公开的内容，她可以自己执行计算，但将再次受到量子物理规则的约束。此外，假设\
  \ Eve 对任何错误负责。Alice 和 Bob 的设备导致了某些错误，这对于他们未来获得新的、更先进的工具是有好处的。\n\n下一部分深入讨论了上述理想游戏\
  \ [21 中最显著的区别（从 Eve 的角度来看，它是完美的！）。然后，我们回到理想情况并提供各种窃听策略，从记录明确方程的最简单的到唯一安全证明的最复杂的。最后，我们讨论了真实框架的安全维度以及窃听攻击的可能性。\n\
  \n### B. 理想化与现实实现\n\n在技术方面，Alice 和 Bob 使用现有的技术。这种常见的观察具有深远的影响。这是因为首先，所有真实部件都已损坏，导致假设的前提失效，并使量子比特无序且未被识别。此外，真实光源产生多个光子的概率始终存在。所有光子具有相同的量子比特\
  \ [19；然而，这取决于编码设备的细节。这允许 Eve 在不影响量子比特的情况下测量光子数。在理想世界中，Alice 只能创建单光子，所有量子比特的概率编码在一个光子中。在\
  \ Bob 的这边，问题是双重的：首先，他的指示器效率受到严重限制，其次，背景检查（光子提供的未限制总量）大量的。量子通道故障类似于效率限制。重复摘要的检查引入了更多不确定性，且整个结构尚未被理解。\n\
  \n[4 在其研究中仅侧面地承认，所有背景计数确实为 Eve 提供了信息。他还建议 Bob 不应该忽略两个探测器的同时触发（通常由于一个真实光子和一个漏计），即使材料科学可能会随机选择一个激励。必须记住，总的\
  \ `QBER` [18 取决于一组不同的检查任务，取决于 Bob 的前提决策是在功能正常还是断开开关上执行的。此外，人们通常认为 Alice 和 Bob 已经尽地测试了他们的设备，并且其运行符合预期。\n\
  \n尽管与量子加密并非严格相关，但这仍然是一个敏感的问题，因为 Eve 可能是问题设备的原始设计者和建造者。所有业务设备，包括更传统的加密框架，都应该进行定期测试。由于客户是从加密服务购买信任和安全，因此测试这样的系统本质上是不可靠的。Bell\
  \ 不平衡被 [6 提出作为测试硬件是否遵循量子理论的方法，尽管这仍然存在争议。正在进行的 Bell 差异实验中最微妙的漏洞之一——识别条款，可以创建一个模拟所有量子连接的完全传统的软件，根据\
  \ [5，这既是奇人的又是肯定的。\n\n\n\n这凸显了量子密钥（QC）问题与关于量子材料科学基础的哲学辩论之间存在密切联系。最后，可以假设 Eve 与 Alice\
  \ 和 Bob 之间不再有任何联系。如果没有这个前提，这个游戏将完全毫无意义：即 Eve 不被允许偷看 Alice 的肩膀。这个看似显而易见的假设实际上远非显而易见。想象一下\
  \ Eve 利用 Alice 通过量子通道与外界的连接。一个理想的世界是通道与一个隔离器 `48` 连接，这可以阻止 Eve 使用产出端口监视 Alice 的实验室。但由于每个隔离器的传输速率都受到限制，滤波器也是必不可少的。无论如何，滤波器的效率只能提高到一定程度。正因如此，我们意识到\
  \ Alice 和 Bob 现在并没有和 Eve 在一起。\n\n## 11.7 结论\n\n量子密码学中理论物理学家与实验物理学家之间的讨论非常迷人。量子光学、光纤技术和自由空间光通信的进展使得这一系统得以发展，它基于量子物理与信息理论原理的完美融合。其安全性基础建立在经典信息理论的严谨原则之上。量子密码学虽然比传统对应物更安全，但由于其对物理距离的依赖，仍面临实施成本和其他局限性。预计技术发展将继续向前。有一天，量子中继器可能被用于解决物理距离问题并提供加密通信。在通信过程中最重要的是记住对机密性的需求，这在任何行业中都是至关重要的。量子密码学之所以脆弱，是因为它基于经典加密，而经典加密可以被量子计算机破解。由于后量子密码学技术对量子计算机攻击具有免疫，因此可以使用它们。\n\
