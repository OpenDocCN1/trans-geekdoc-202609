  \ [访问：2021 年 8 月 20 日]。\n\n[content]\n\n## 24. 量子密码学——安全架构\n\n**Sunandani Sharma¹,\
  \ Sneha Agrawal¹, Sneha Baldeva², Diya Dabhade², Parikshit Bais² and Ankita Singh³**\n\
  \n¹塔塔咨询服务有限公司 (TCS)，印度印多\n\n²计算机科学系，Shri Vaishnav Vidyapeeth Vishwavidyalaya，印度印多\n\
  \n³信息技术系，Shri Vaishnav Vidyapeeth Vishwavidyalaya，印度印多\n\n## *摘要*\n\n已知的量子物理原理为`量子密码学`[加密和解密算法]提供了起源。量子主要执行并期望解决如`AES`、`RSA`、`DES`等离散对数问题。量子密钥密钥分发是关键过程，分为两个加密策略。现在的所有安全信息由于对网络环境中数据扩散的独特理解并增加了攻击者的可能性。相比之下，为了传输这些安全信息，将使用安全的加密技术来授权机密性、数据完整性和数据源身份认证。本章介绍了`AES`算法的发展，该算法被认为是最好的对称加密技术，以及对新开发的面向`AES`的`S-Boxes`与从量子密钥分发中仔细选择的密钥生成器之间联系日益增长的关注。\n\
  \n***关键词*:** 高加密标准、Shamir-Adleman、数据加密技术、量子、密码学、加密、解密\n\n## 24.1 引言\n\n\n\n\n\n\
  自从互联网在人类文明中被广泛使用以来，它已经渗透到了每一个行业。如今，由于人们对它的依赖程度增加，生活的各个部分已无法与任何网络隔离开。20 世纪 90 年代，一个特别广为人知的术语是“网络空间”[1,\
  \ 2]。尽管网络空间具有许多优点，但它被认为是人类历史上最不受控的行业。由于量子计算（`QCom`）的特性，目前使用的许多公钥加密算法（`RSA`、`ECC`）面对它时已不再安全[[3]](#c24.xhtml#ref3)]。这意味着我们应该采用一种基于不同加密方法的替代`QCom`策略。未来互联网网络空间的信息安全只能通过这种方式来保障[4,\
  \ 5]。尽管量子密码学仍在使用中，但使用传统方法时不能忽视它的缺点。如果网络安全和量子密码学是新策略的主要组成部分，计算机将更加安全[[6]](#c24.xhtml#ref6)。加密学中确保隐私的基本方法之一是遗忘传输协议，这是一种关键加密基础协议[[7]](#c24.xhtml#ref7),\
  \ 8, 13]。在“明显传输”协议中，发送者在不感知其精确内容的情况下，向接收者传输大量可能有用的信息。量子密码学技术之一是量子认证（`QA`）协议。它首次于\
  \ 2001 年提出。随后，几种`QA`方法相继被提出[[1]](#c24.xhtml#ref1)]。`AES` [1–3]算法使用长度为 128；192 或\
  \ 256 位的单密钥进行加密和解密。它采用一个 128 位的静态输入数据块，该数据块最初被创建一个 4x4 矩阵，且其状态已知[[13]](#c24.xhtml#ref13)]。密钥的长度决定了轮数（`Nr`），分别为\
  \ 10、12 和 14 轮。本章最后介绍了一种通过改进的`AES`与`QKD`结合的新型`AES`[[9]](#c24.xhtml#ref9)]。\n\n###\
  \ 24.1.1 结构\n其余的工作安排如下：第 24.2 节讨论了关于量子密码学的相关工作，第 24.3 节包含了用于我们主题的属性，第 24.4 节包含了方法论并附有图表，第\
  \ 24.6 节是结论。\n\n## 24.2 相关工作\n遗忘传输协议作为一种基础加密协议，是密码学隐私保护的关键技术[9, 19]。根据遗忘传输协议，发送者在不感知其精确内容的情况下，向接收者传输广泛的潜在数据。Crepeau\
  \ 快速提出了量子遗忘传输（`QOT`）的想法[10, 20]。随后，`QOT`协议成为多项研究的主题。[2]](#c24.xhtml#ref2)证明了针对任何量子力学允许的个体测量均具有“遗忘传输”安全性[[2]](#c24.xhtml#ref2)]。该协议[[3]](#c24.xhtml#ref3)于[[4]](#c24.xhtml#ref4)引入，证明了在存在窃听者的情况下`QOT`协议的安全性。在不同程度上，人们提出了几种协议[[4]](#c24.xhtml#ref4),\
  \ 5]来增强`QOT`协议。量子密码学技术之一是量子认证（`QA`）协议。它于[[6]](#c24.xhtml#ref6)提出。随后，若干种`QA`技术[[7]](#c24.xhtml#ref7),\
  \ 8]相继提出。量子密码学协议现在已分为几个子分支。量子密码学协议还包括量子比特承诺（`QBC`）协议[[9]](#c24.xhtml#ref9), 10]和量子签名（`QS`）协议[10,\
  \ 11]，除了我们涵盖过的[19, 20]（即`QKD`协议、`QOT`协议和`QA`协议）。\n\n## 24.3 量子信息的属性[16–19]\n不确定性原理、量子克隆理论、量子传输以及量子信息的属性是用于防御被动或主动攻击的量子信息的主要方面[1,\
  \ 2]（在网络空间）。量子克隆假设和海森堡不确定性原理是以提出该想法的德国科学家命名的[13, 14]。不确定性原理的基本原则是，粒子在微观世界中以不同的概率存在。\n\
  \n1. **量子不可克隆定理**：根据该假设，未知的量子态具有不可复制和不可删除的特性。研究人员已经确定，没有可以复制量子系统的设备[15]。量子理论的线性被认为排除了量子态的删除[16]。\n\
  \n2. **量子传输**：发送者测量量子态以获取经典信息，量子信息是通过测量传输给接收者但未被发送者提取的剩余信息。传输未知量子态的方案首次提出[16, 17]。\n\
  \n3. **量子信息拥有经典信息不具备的性质，使其脱颖而出**：特别是局部测量操作无法暴露纠缠态中的量子细节；这些细节只能通过联合测量来揭示。建议对量子信息进行研究[18]。\n\
  \n## 24.4 方法论\n据我们知，IBM[19]创建了一种功能性量子计算机，它定义了原子和电子等粒子的行为并利用光子进行控制[14, 15]。\n\n\n\
  \n\n\n## 2. 量子计算机不仅在赢得硬币案例方面强大，而且在设计未来方面强大，因为它在不确定性中具有硬性叠加。在本节和下一节中，是量子技术（QTech）潜在用途的三个示例，可能会从根本上改变你的生活。首先，量子可以用于创建从一个位置发送到另一个位置的消息的私钥，使得黑客无法隐秘地精确复制密钥，因为这样做需要违反量子物理学定律。这种技术已经过全球银行和其他机构的测试。想象一下量子加密可能产生的影响。\n\
  \n## 3. 量子技术还可以彻底改变医疗保健和医学。例如，为药物开发设计和分析分子在今天是一项困难的问题。这是因为使用计算机（即使是超级计算机）很难精确地描述和计算分子中所有原子的所有量子属性。然而，量子计算机可能表现更好，因为它使用的与传统计算机相同的原理。图\
  \ 24.1 显示了 `QCom` 的基本布局。\n\n可以将信息从一个位置传送到另一个位置 [\\[20\\]](#c24.xhtml#ref20) 而而无需进行物理传输，尽管这看起来是不可能的，因为量子粒子具有流体身份，它们可以在跨越时空的情况下发生纠缠，以至于当你改变其中一个粒子的属性时，它会影响系统中的所有其他粒子。未来的发展可能导致这种方式治疗疾病。目前在线使用的密码学课程是最重要的密钥系统；`key`\
  \ 一词指的是用于加密消息的方法。它基本上是一种将明文文本数据转换为混乱状态的算法，但它以一种可预测的方式创建这种混乱，因此如果 `key` 是公开的，遗漏的混乱就可以被理解。这意味着所有人都知道如何加密消息，但只有接收者知道如何解密；这听起来有些奇怪，因为如果\
  \ `key` 是公开的，每个人都知道如何打乱消息，那么似乎每个人也知道如何还原。这听起来并不安全，但公钥密码学的巧妙之处在于，你编码消息时使用了一种易于操作但难以破解的方法，你可以将其比作你购买物品的网站给了你一个不能留存的、可以锁上的空宝箱。\n\
  \n![图 24.1 QCom: 基本布局 \\[1–4\\].](images/fig24-1.jpg)\n\n**图 24.1** `QCom`: 基本布局\
  \ \\[1–4\\].\n\n![图 24.2 量子加密实施架构 \\[20, 21\\].](images/fig24-2.jpg)\n\n**图 24.2**\
  \ 量子加密实施架构 \\[20, 21\\].\n\n那个宝箱是一段遥不可及的，而且是一个易于发布但极难解决的数学问题。有各种数学问题被用于密码协议中以锁定宝箱。图\
  \ 24.2 显示了量子加密实施架构。\n\n## 24.5 支持性解释\n\n使用不同类型的“鸟”执行各种类型操作的基础通用计算机，它可以以零或一的形式存在，在引用计数中，计算机基本上是这些位，它们同时具有零和一等数字，并节省时间，这为量子计算机提供了巨大的输入，因为原始对象是由\
  \ `cubit` 组成的，形式为光子、电子或原子核。\n\n我们用于用户研究人员，他们实际上将磷中的电子转换为立方体，但电子并不是一个工作良好的部分，因为电子构成了磁场，并处于最低能量态，因此我们称之为零态，或者我们对任何可以放入该阶段的电子。\n\
  \n基本上结果将是提供一些能量并观察指南针的类别，因为那时针的自旋有计划强制它并将其推向不同的侧面，即最高能级，而这种状态的原理将完全反对磁场，这看起来就像一个磁场一样。图\
  \ 24.3 显示了量子比例：密钥生成。\n\n这是量子比例：密钥生成。\n\n![图 24.3 量子比例：密钥生成 \\[7, 8\\].](images/fig24-3.jpg)\n\
