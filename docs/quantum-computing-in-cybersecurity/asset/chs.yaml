  \ 6317.\n\n# 量子计算及其阴暗面\n\n## 摘要\n量子计算（QC）利用量子物理学解决对传统计算机而言极其复杂的问题。物理学家保罗·贝奥夫（Paul\
  \ Benioff）在 20 世纪 80 年代创造了“量子计算”这一术语。自从该术语被发明以来，我们一直在向前发展。我们永远不知道未来会带来什么；技术本身既不是善也不坏；我们如何使用它完全取决于我们。新兴的量子技术领域具有潜力。\n\
  \n**关键词：** 量子计算、量子密码学与安全、量子比特、量子人工智能\n\n## 引言\n被称为量子计算机（Qcom）的物理设备家族能够进行高速数学和逻辑运算，并根据量子物理学规则存储和处理量子信息。当一个设备的处理和计算基于量子信息并使用量子算法执行时，该设备被称为量子计算机。量子计算（QC）的操作可以利用叠加、纠缠和干涉等量子力学现象。\n\
  \n现代量子技术（QT）再次准备变革日常生活。量子计算机的第二波浪利用了亚原子粒子行为的某些方面，即叠加和纠缠。粒子同时存在于两个或多个状态的现象被称为叠加。即使两个粒子相隔数千公里，它们也可以变得如此纠缠，以至于作为一个统一的系统运行，而不是两个独立的部分。\n\
  \n经典计算机基于比特（bits）——具有单一二值值（0 或 1）的数据单元，这构成了所有的应用程序、网站及其内容；而量子计算机则使用电子或光子等亚原子粒子。它们被称为量子比特（qubits）——可以将数据表示为\
  \ 1、0 或两者之间的量子态。\n\n\n\n\n\n大多数现有加密算法可能会被基于量子物理学而非传统电子设备的新型计算机所破解，这就是为什么网络安全研究人员和分析师感到担忧的原因。结果，通信将变得像完全没有加密一样不安全。\n\
  \n在不遥的将来，大规模数据泄露的频率将会增加。由于黑客能够利用这项技术解密他们已经获取的数据，`Qcom` 也将使之前的泄露漏洞持续。\n\n量子革命近在咫尺。未来十年内\
  \ `Qcom` 的出现将为人类提供无与伦比的处理能力以及随之而来的所有好处。然而，这带来了困难，因为它将使今天的网络安全措施失效。\n\n新兴的量子技术领域具有影响人类活动的能力。量子技术有两个截然不同的影响。如何使用它取决于我们。\n\
  \n在 `Qcom` 的帮助下，黑客将能够破解公钥并绕过几乎任何加密设备或系统的安全性。尽管 `QC` 带来的网络末日 `[[25]](#c18.xhtml#ref25)`\
  \ 确切时间尚不确定，但它可能在短短十年内发生。尽管如此，量子恐怖主义 `[[12]](#c18.xhtml#ref12)` 威胁是 `QC` 的新暗面，将令安全专家彻夜难眠。\n\
  \n距离 2030 年 4 月 14 日的倒计时已经开始 `[[1]](#c18.xhtml#ref1)`，云安全联盟（CSA）——全球定义标准、认证和最佳实践以确保安全云计算环境的顶尖组织——预测到那时，量子计算机将能够破解现有的网络安全基础设施。\n\
  \n### 本章结构\n\n本章的其余部分概述如下：章节 18.2 关于相关工作，章节 18.3 展示了量子计算机的历史和演变，章节 18.4 展示了实现量子计算机的组件和概念,章节\
  \ 18.5 展示了量子计算机未来发展的计划，章节 18.6 展示了量子计算机的暗面，章节 18.7 展示了量子时代的保护计划，章节 18.8 总结了本章。\n\
  \n## 18.2 相关工作\n\n`[[2]](#c18.xhtml#ref2)` 中的研究旨在通过系统研究，合成关于量子网络安全的基础研究，这些研究既可以作为关键网络安全问题的威胁，也可以作为解决方案。`QC`\
  \ 的发现可能为网络安全带来最不可预见的风险；网络安全专家提出，它可能被用于改进网络安全问题。\n\n论文 `[[3]](#c18.xhtml#ref3)` 重点关注\
  \ `QC` 对世界的影响，根据作者的话，“量子竞赛是一场危险的竞赛，因为它对解决大问题有积极贡献，但 `QC` 也有一个暗面。”\n\n尽管如此，论文 `[[4]](#c18.xhtml#ref4)`\
  \ 显示 `QC` 可能被用于改进网络安全问题。`[[5]](#c18.xhtml#ref5)` 的作者表示，`QC` 可用于后量子时代。\n\n根据 `[[6]](#c18.xhtml#ref6)`，`QC`\
  \ 将具有功能性。Mikhail Dynov `[[7]](#c18.xhtml#ref7)` 认为 `QC` 将增长。Sayantan Gupta 等人 `[[8]](#c18.xhtml#ref8)`\
  \ 展示了安全性是如何被破坏的。Mohammad Shahbaz Khan 等人 `[[9]](#c18.xhtml#ref9)` 讨论了 `QC` 及各种应用。\n\
  \n## 18.3 Qcom 的历史与演变\n\n### A. Qcom 的历史\n\n> 1980：物理学家 Paul Benioff 提出了图灵机的量子力学解释。\n\
  \n> 1986：Feynman 提出了量子电路表示法的早期迭代。在量子电路中，计算被表示为一系列量子门、测量、将量子比特初始化为预定值，以及额外的操作。\n\n\
  > 1994：Dan Simon 的研究显示 `Qcom` 的速度可以呈指数级提升。\n\n> 1998：Isaac Chuang 等人开发了第一台运行的双比特量子计算机。\n\
  \n> 1999：Yasobu Nakamura 和 Jaw-Sen Tsai 发现，超导电路可用作量子比特。\n\n> 2000：麻省理工学院（MIT）和美国能源部洛斯阿拉莫实验室的研究人员建立了一台\
  \ 7 比比特量子计算机。\n\n> 2002：发布了第一份量子计算路线图，这是一份由量子专家创建的动态文档。\n\n> 2011：D-Wave Systems\
  \ 交付了第一台经济上可行的量子计算机。\n\n> 2014：代尔夫理工大学卡里纳米科学研究所的研究人员在两个相距约 10 英的量子比特之间实现了数据传态，错误率为\
  \ 0%。\n\n> 2017：根据中国研究人员的数据，实现了实现了单光子量子比特的量子传态。\n\n> 2019：Google 称通过完成一组超级计算机需要\
  \ 10,000 年才能完成的操作，实现了量子优势 `[[14]](#c18.xhtml#ref14)`。\n\nIBM 后报告称，如果超级计算机使用各种技术来最大化计算速度，它只需要\
  \ 2.5 天即可完成任务。\n\n### B. 年份来量子比特的演变（QC 中的基本信息单位）\n\n\n\n\n\n量子比特（Qubit）10 是量子信息的基本单位。在经典（或传统）计算中，二进制位（bit）是信息的根本单位，而量子比特是量子计算（QC）中基础的信息核心组件。量子比特通过利用量子力学的**叠加现象**实现两个状态的线性组合。典型的二进制位只有两个潜在状态，且只能表示一个二进制值（如\
  \ 0 或 1），它只能处于这两种状态中的任何一个。然而，量子比特可以代表 0、1，或者在两种状态的叠加态中代表 0 到 1 的任意比例，并有一定的概率变为 `0`，也有一定的概率变为\
  \ `1`。表 18.1 展示了量子比特多年来的演变。\n\n各公司正试图逐日增加其量子计算机中量子比特的数量，这可能进一步增强已经极其强大的量子计算的处理能力。也许在未来的几年或几十年里，我们可以充分利用量子计算机的潜力。我们现在应该开始为量子时代做好准备，同时也为它的阴暗面做好准备。\n\
  \n表 18.1 量子比特多年来的演变 [10, 11]。\n\n| 机构名称 | 年度 | 量子比特数量 |\n| --- | --- | --- |\n|\
  \ IBM-牛津-伯克利-斯坦福-MIT | 1998 | 2 个量子比特 |\n| 慕尼黑工业大学 | 2000 | 5 个量子比特 |\n| 洛斯阿拉莫斯国家实验室\
  \ | 2000 | 7 个量子比特 |\n| 量子计算研究所、理论物理研究院和 MIT | 2006 | 12 个量子比特 |\n| D-Wave System\
  \ | 2008 | 28 个量子比特 |\n| D-Wave System | 2011 | 128 个量子比特 |\n| D-Wave System | 2013\
