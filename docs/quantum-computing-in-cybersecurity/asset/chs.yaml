  \n# 16 基于量子安全的 VQA 图像过滤\n\n**Avni Burman, Bhushan Bawaskar, Harsh Dindorkar 和 Hrithik\
  \ Surjan**\n\n*印度印多尔，Shri Vaishnav Vidyapeeth Vishwavidyalaya 科学工程系*\n\n## 摘要\n\
  随着`VQA`（视觉问答）应用的日益广泛，许多应用已被运出，，目前也有几项关于 VQA 的研究正在进行。在 VQA 中，我们构建并训练系统以对提供的数据（即图像和问题）给出正确答案。我们需要向模型提供图像和问题，但在直接融合问题（`Qi`）和图像（`Vi`）的特征元素时，存在许多问题，如图像和问题中的噪声。如果给定的图像有噪声，就没有准确性\
  \ [3]。这两个元素（`Qi`、`Vi`）不在同一个空间。为了解决这个问题，我们引入了图像过滤、差分网络及其融合。在当今世界，数据就是一切，保护数据应该是我们的首要任务。因此，为了保护\
  \ VQA，我们引入了 `RSA` 算法。`RSA` 算法将确保 VQA 免受任何入侵，并维护其真实性。\n\n**关键词：** 视觉问答 (VQA)、差分网络\
  \ (DN)、图像过滤、中值滤波、rsa 算法、密码学、量子安全\n\n## 16.1 引言\nVQA [1, 2] 近年来由于其众多用途而蓬勃发展。该模型有效地合并了来自照片和问题的特征组件以完成\
  \ VQA 任务。构建一个能够响应图像和自然语言提交的查询的计算机系统，是 VQA 研究领域的重点 [1, 2]。最近，VQA 作为一种可以替代视觉测试的 AI\
  \ 活动而受到关注。\n\n图像使用线性和非线性算法进行过滤。图像过滤使得有利的图像处理活动变得可行。过滤器可以减少图像中不需要噪声和其他不良元素。与线性滤波器不同，非线性滤波器\
  \ [3] 的运行不同。非线性滤波器 [3] 的结果偏离了上述规则。均值滤波器是最容易使用的滤波器之一。图像的均值滤波器是平均平滑的。通过用每个像素周围像素的平均值替换，噪声被掩盖在图像背景中。[图\
  \ 16.1] 显示了视觉问答系统。\n\n某些 VQA 应用需要完全安全的敏感数据，因此需要维护数据的机密性、完整性和可用性 (CIA) [6, 7]。因此，为了确保安全，我们需要具有多个密钥的现代加密技术。\n\
  \n[8–10] `RSA` 算法由 Rivest、Shamir 和 Adleman 于 1978 年开发；因此名为 `RSA`。该算法使用非对称加密。作为一种非对称密码，它可以使用公钥和私钥运行，这是两个独立的密钥。从名称可以看出，公钥分给所有人，而私钥保持保密。`RSA`\
  \ 使用质数，由于这种方法使用的整数足够大，因此解决起来很有挑战。RSA 密钥可能是 1024 或 2048 位，但研究人员认为超过 1204 密钥很快就会被破解。\n\
