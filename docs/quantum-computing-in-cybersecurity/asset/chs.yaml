  \ 向量 `a`（大小为 `p`）通过 `δ(x; a)` 分隔。\n\n多个语音系统使用了这些替代密度函数。\n\n## 6.3 HQMM 示例（实际的应用）\n\
  \nHQMM 在生态学、密码分析和语音识别等多个领域已被证明非常有效。我们将观察尝试构建孤立识别器 HQMM 的场景。假设我们需要学习一个 V 词汇表。为每个句子提供一组‘L’\
  \ Token（由一个或多个说话者使用）和一个独立的测试集。语音识别的过程如下：\n\n1. 对于词汇表中的每个词，我们首先创建一个 HQMM。使用 `L` Token\
  \ 集的数据估计每个词的最优参数，得到第 v 个词汇词的模型 `λ^V`（1<=v<=V）。\n2. 为测试集中的每个未知词计算 `Pv = Pr(O|λ^V)`，其中观测序列为\
  \ `a = O1, O2,..., O[T]`，模型为 `λ^V`。\n3. 选择模型概率最高的词，即 `v* = argmax[Pv]`\n```\nimages/eqpg115-2.png\n\
