  ²印度计算机科学与业务系统系，R.M.K. 工程学院，塔米尔纳德邦\n\n## 摘要\n量子时代是一个新兴且无疑具有颠覆性的学科，具有影响许多人类活动的能力。量子技术是双用技术，因此受到保护与保护企业、军队以及政府机构的关注。本文阐述了并描绘了量子世代的潜在军事应用包，作为全球和平与安全测试、伦理研究、海军和政府政策、方法和决策的切入点。\n\
