  \ SVM`、`machine learning`\n\n## 26.1 引言\n\n近年来，全球通信网络中的计算机入侵事件不断增加。因此，一个入侵检测系统（`IDS`）是必要的。`IDS`\
  \ 是一种软件，用于监控旨在窃取、审查数据，或更改单台计算机或网络协议的恶意尝试。\n\n无论是由于网络安全系统的薄弱还是缺失，我们都看到全球通信网络中的计算机入侵事件有所上升。因此，需要一种入侵检测系统（`IDS`）。`IDS`\
  \ 是监控旨在窃取、审查数据或更改单台计算机或网络协议的恶意尝试的软件。\n\n近年来，全球通信网络中的计算机入侵事件日益增加。因此，需要一种入侵检测系统（`IDS`）。`IDS`\
  \ 是用于监控旨在窃取、审查数据或更改单台计算机或网络协议的恶意尝试的软件。\n\n\n\n\n本章的其余部分概述如下：第 26.2 节展示了入侵检测系统的相关工作和不同研究；第\
  \ 26.3 节介绍了不同的模型；第 26.4 节概述了提出的方法论；第 26.5 节展示了结果分析；第 26.6 节对本章进行了总结。\n\n## 26.2\
