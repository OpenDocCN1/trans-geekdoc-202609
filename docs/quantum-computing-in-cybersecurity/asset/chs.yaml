  \ (2019)。\n\n\n\n\n²时尚技术系，印度国立时尚技术学院，新德里，德里，印度\n\n## 摘要\n网络安全作为计算机科学的一个领域，是全球各国投入程度最大的领域之一。预计到\
  \ 2021 年底，各国在网络安全方面的支出将超过 1 万亿美元。近期显示，约有 45%的网络攻击是成功的。计算机取证是 21 世纪最受青睐的职业之一。网络取证是指从设备中收集和存储数据的过程，这些数据可以在法庭上提交给法官。数字取证有多种形式，其中包括磁盘取证、网络取证和无线取证等。本研究的目的是探索全球网络安全和网络取证领域的未来趋势，寻找改进现有技术的方法，并创造新技术以捕获全球范围内臭名昭著的黑客。研究方法将主要包括教育人们他们在在线世界中所面临的威胁，同时评估现状，并预测这两个巨大领域的未来发展。这项研究如果实施，将通过保护个人数据并鼓励人类在各自的领域实现其最大潜力，确保确保在线世界成为一个更加安全的地方。\n\
  \n**关键词：** 网络安全，网络取证，钓鱼，中间人攻击 (MITM)\n\n## 13.1 引言\n网络安全是一个全球领先国家大量投入的领域，它基本上是保护信息（无论是个人还是组织）免受盗窃、软件或硬件损坏等的过程。近年来，网络犯罪\
  \ [1, 2] 已成为公众熟悉的话题。现在显而易见，随着近年来技术的进步，网络攻击也随之增加。黑客一直在寻找新方法来渗透系统，无论是通过病毒、恶意软件还是钓鱼攻击。网络攻击有多种形式，如恶意软件、钓鱼攻击和中间人（MITM）\
  \ [3, 4] 攻击等。\n\n*   **恶意软件 (Malware)**：这是一种全球范围内非常流行的的软件，能够执行各种形式的恶意任务，包括未经授权访问特定网络以及监视用户以获取其登录信息。勒索软件属于此类恶意软件，被频繁使用，负责加密用户文件并向用户索要以恢复访问权限。\n\
  *   **钓鱼攻击 (Phishing)**：这种攻击使用频率最高，且非常容易实施。通常情况下，用户会收到一封伪装成合法组织（如政府部门甚至电信公司）的邮件，要求用户提供个人信息。这可以通过电话、信息服务甚至通过电子邮件进行。\n\
  *   **中间人攻击 (Man-in-the-middle-attack, MITM)**：这种攻击通常涉及黑客监听两人或双方之间的对话，以窃取个人信息或凭据。由于现在邮件采用了端到端加密，第三方介入变得不可能，中间人攻击现在不再那么常见。\n\
  *   **网络取证 (Cyber Forensics)**，也称为数字取证或计算机取证，是数字取证的一个分支，负责从计算机或手机等设备中收集证据，然后将这些证据转化为物理证据并提交给法官。对网络取证的需求日益增长。它是当今瞬息万变的世界中一种演进的力量。它为检察官提供了违规行为的证据，包括搜索历史、电子邮件日志或罪犯留下的任何其他数字足迹等简单信息。其主要应用是打击各种犯罪，包括黑客攻击和拒绝服务（DOS）\
  \ [5]。\n\n网络取证遵循非常系统的方法。其中涉及的过程包括：\n\n*   **对受调查的假设计算机系统进行数字复制**：此过程包括获取调查系统的副本。\n\
  *   **验证并认证数字副本**：为了确保数据不丢失，调查人员对收集的数据进行验证和认证。\n*   **确保复制数据的有效性**：在当今不断变化的世界中，这种演进的力量确保数据是有效的。\n\
  *   **恢复已删除的文件**：黑客可能会尝试删除他们的数字足迹，使得检察官难以起诉。因此，检察官必须检索数据。\n*   **使用关键词搜索特定数据**：当检察官在法庭提交案件时，关键词的使用非常有用。它使检察官能够快速获取信息。\n\
  *   **创建技术报告**：这是调查的最后步骤，准备一份可以提交给法官的清晰技术报告。它清楚地定义了罪犯及其违法行为。\n\n## 13.2 背景\n\n##\
  \ 13.3 本研究范围\n\n\n\n\n\n本文的目的是基本上探究网络安全和网络取证的未来趋势。显然，过去几年网络安全领域出现了一种趋势；在过去的二十年里，学习这一特定领域的人数剧增。据介绍，到今年年底，网络安全的空缺职位将增长到接近\
  \ 35 万个。只要技术存在，该领域的工作需求就一定会增加。如果技术可以用来渗透他人的生活并窃取他们的价值信息，那么技术也可以用于保护人们的隐私，从而防止其他信息被盗取。以下是网络安全的未来展望：\n\
  \n### 1. 勒索软件威胁的指数级增长 6：勒索软件是一种恶意软件，过去两年中，它已成为全球企业和个人面临的重大威胁。这类攻击具有直接的经济利益，攻击者还会针对备份和恢复工具，以防止数据在攻击后被恢复。加密勒索软件是最常见的勒索软件。它具有锁定文件的非凡能力，换句话说，就是加密文件并向受害者索要某种赎金以换解密文件的过程。这种勒索软件可以通过网站和下载等任何媒介传播。\n\
  \n### 2. USB 盘是更大的威胁：USB 盘 [7, 8]] 无处不在。人们在其中存储价值信息，攻击者利用这一点攻击工业目标。最近发现，针对工业领域的\
  \ USB 威胁在近几年中增加了一倍多，达到 59%。有趣的是，网络安全专家预测，到 2021 年底，每 11 秒就会发生一次网络攻击，是 2016 年速率的四倍，2019\
  \ 年速率的两倍。全球快速增长的网络攻击给全球企业带来了巨额成本，迫使他们采取措施减少或完全终止此类攻击。\n\n政府最高部门的网络犯罪取证在未来可能会变得更加复杂。政府将需要更多地转向其国家安全组织来追踪那些恶毒的攻击者。此外，鉴于不断进步的技术，他们必须发明新工具来捕获他们。近年来，调查机构面临的挑战一直在增加，因为证据收集非常困难，且必须清晰并能够呈给法庭。如今，计算机配备了大容量硬盘，这使得从检索的数据中使其再次变得可用变得更加困难。如果仔细观察，网络攻击、网络安全和网络取证都是相互关联的。虽然网络安全侧重于防止网络攻击，但网络取证完全是为了在犯罪发生后捕获攻击者。因此，总结上述观点，只要有新技术引入我们的日常生活，就会有网络攻击，因此会有网络取证领域帮助检察官捕获攻击者。当我们展望未来时，网络取证面临的最大问题将是复杂性的爆炸\
  \ [1, 2]。\n\n在单个计算机或主机上发现证据非常稀少，但在我们不断进步的世界中，证据分布在许多不同的网络中。因此，有人说，现代数字取证 [9, 10]\
  \ 的一个重要挑战是在无边界场景下不违反法律的情况下执行调查。近年来，网络取证的研究正在减少。如果在进行取证研究时没有明确的路径，该领域将无法取得太大进展；当不同形式的技术创建新工具时，网络取证领域在试图对抗它们时将力不从心。这将使捕获攻击者变得更加，网络取证将变得不可靠。网络取证领域有两个引人注目的问题：\n\
  \n*   我们今天拥有的工具主要是帮助检察官寻找特定的证据，而不是协助调查。\n*   我们在今天世界使用的工具在创建时的首要目标是解决针对人类的犯罪，考虑到证据存储在电子设备上，此后可以从中检索证据。它们并不是为了解决借助计算机实施或针对计算机实施的典型犯罪而设计的。\n\
  \n我们今天拥有的工具确实非常不适合寻找那些突如其来的信息。\n\n## 13.4 方法论与模拟结果分析\n\n当我们拥有不断增长的技术时，显然在……中出现了问题。虽然网络安全可能不是解决所有问题的完美方案，但它确实有助于大多数……。向人们普及他们所面临的威胁是一项非常困难且耗时的任务。人们应该至少拥有关于……的基本知识。以下是人们保护自己免受恶毒攻击者侵害的一些方法\
  \ [3, 4]：\n\n1. **不要通过公共 Wi-Fi 访问个人或重要数据 [11, 12]：人们屈服于黑客的主要原因之一是因为使用了无线网络（机场、火车站、酒店等），当人们使用公共无线网络\
  \ 访问个人或重要数据时，密码定会被窃取。始终建议在安全网络中进行此类操作。\n2. **关闭你需要的任何东西：现在的黑客拥有可以帮助定位的工具，这涉及到手机的功能如\
  \ Wi-Fi、GPS 等。因此，与其一直开启 Wi-Fi 和 GPS，最好关闭它们，让黑客无法得知你的行踪。\n3. **明智地选择应用程序和网站：仅从口碑良好的来源下载应用程序。从未知来源下载应用或在线流电影节目会对你以及你的个人信息构成威胁。\n\
  4. **使用密码、锁码或加密 [13]：据发现，81% 的破解是由弱密码造成的。所以问题出现了，什么是强密码？密码的最小长度应为 12 位。你的密码应该包含大写字母和小写字母、数字以及特殊字符。在创建新密码时确保不要使用自动填充密码选项。一些常用密码的示例是：\
  \    * `123456`\n    * `123456789`\n    * `qwerty`\n    * `1111`\n    * `abc123`\n\
  \    * 等等\n\n    黑客有许多方法可以窃取你的密码 [5, 6 和 7]。最常见的方法是：\n\n\n\n\n\n## 密码攻击方法\n\n1.\
  \ `网络分析器` `[14, 15]\\]`：这些是特殊的工具，不仅可以监控数据包，还能拦截通过网络传输的数据包。这些工具非常擅长提取其中的个人信息。这类攻击通常会通过`暴力破解攻击`（Brute\
  \ Force Attack）进行，在那种攻击中，黑客会尝试字典中所有的密码组合，直到匹配你的密码为止；一旦匹配成功，黑客获取你所有个人信息只是时间问题。\n\n\
  2. `字典攻击`（Dictionary Attack）：这与暴力破解攻击非常相似。如果你的密码是一个普通单词，你很可能会陷入这种攻击。逃避这种攻击最简单的方法之一是使用多个短语作为密码，例如\
  \ `LaundryZebraTowelBlue`。这可以帮助你胜过字典攻击。\n\n3. `钓鱼攻击`（Phishing）：如前所述，攻击者在这里发送一封通常包含链接的邮件，并提示你点击。邮件可能会说明，除非你立即采取行动（例如点击链接更改密码或输入其他个人信息），否则你的账户将在短期内过期。这类邮件看起来甚至可能来自微软或谷歌等最受信任的机构。\n\
  \n## 密码保护方法\n\n现在我们已经讨论了密码被破解的各种方式，我们可以转向人们可以使用的一些方法来确保他们的密码安全并得到良好的保护。下方的某些方法解释了如何创建强密码\
  \ `[8, 9]\\]`：\n\n*   改进后的改述法：在这种方法中，密码基本上是一个带有转折的多个单词短语。可以使用专有名词、公众人物甚至是另一种语言的单词。黑客可能猜出\
  \ `bell` 是密码，但他会发现很难猜出 `bellmerciholasayanora`。用户还可以使用大写字母。\n\n*   句子法：这里的基本思想是取任何随机句子，并取前两个字母或每个单词的首字母作为密码。句子“I\
  \ love London but I don’t want to leave the United States of America”的密码可以是 `IIbIdwtltUSoA`。\n\
  \n`图 13.1` 显示了过去七年来网络攻击对企业造成的灾难性影响。我们可以看到，随着时间的推移，受网络攻击侵害的企业百分比也在增加，期间经历了几次波动。\n\
  \n![图 13.1 各国遭受至少一次网络攻击的企业百分比。](img/fig13-1.jpg)\n\n`图 13.1` 各国遭受至少一次网络攻击侵害的企业百分比。\n\
  \n下面的图表显示了 2020 年遭受至少一次成功攻击的国家各机构情况 `[[16]](#c13.xhtml#ref16)`。正如`图 13.2` 清楚所示，印度作为一个国家并没有处于网络攻击的直接危险之中，但这意味着我们可以非常轻地对待这个问题。总有一天我们难免会受到高手的攻击，因此有准备总是总是好的。\n\
  \n### 网络取证\n\n现在我们进入下一个领域，网络取证。如果某人不知道为了在虚拟世界中保持安全需要采取哪些措施，且其设备被黑客入侵了，那么网络取证就派上用场了。然而，需要注意的是，即使是组织也可能被破解，检察官介入并不非针对个人设备。还有各种类型的网络取证检查，其中包括：\n\
  \n![图 13.2 2020 年各国遭受至少一次成功勒索软件攻击的百分比。](img/fig13-2.jpg)\n\n`图 13.2` 2020 年各国遭受至少一次成功勒索软件攻击的百分比。\n\
  \n*   `数据库取证`：顾其名，是对数据库中包含的信息进行检查。\n\n*   `邮件取证`：顾其名，电子邮件和其他信息（如联系人、消息等）的恢复、存储和分析属于这一类。\n\
  \n*   `内存取证`：包括分析存储在计算机 `RAM` 和缓存中的信息。\n\n*   `移动取证`：基本上是对手机手机中信息的分析，包括联系人、电子邮件、拨入拨出的电话等。\n\
  \n网络取证已被证明是全球范围内抓窃偷和小犯非常有用的工具。自 20 世纪 80 年代以来，它一直用于捕获世界各地的臭名犯。然而，尽管数字取证在抓捕罪犯和维护公正方面发挥了重要作用，但数字取证正面临着危机。该领域面临的一些主要问题是：\n\
  \n1.  数字取证领域受到法庭提出的法律挑战的限制。\n2.  如今最新系统中存在的普遍加密阻止了数据的处理，即使数据是可以被恢复的。\n\n在现代世界中，取证人员发现很难以一种非常有组织的方式获取数据。证据（包括无罪证据）经常被遗漏。每年大约有\
  \ `40,000,000` 起诉。最近的一项调查显示：\n\n1.  几乎一半的陪审员希望案件中存在系统性的证据。\n2.  几乎四分之一的陪审员希望案件中存在\
  \ DNA 证据。\n\n## 网络取证的未来方向\n\n为了改进网络取证领域，提出了以下方法：\n\n*   `身份管理`：网络取证的核心是将高手的行为与高手联系起来，因此我们需要对个人进行建模，使其既符合原则又具有计算性。这种抽象不仅包括最简单、常见的数据集（如姓名、电话号码、地址等），还扩展到代表个人的能力和社会网络。该领域的工作将有助于改进互联网搜索和身份识别，并最终建立有助于可能的嫌疑人和账户的系统。\n\
  \n*   `视觉化分析`：该领域急需下一代自动化分析方法，这些方法将以更系统的方式呈现数据，并且让检察官更容易理解。\n\n\n\n\n\n### 3. 协作\n\
  由于法证分析涉及团队努力，因此工具也应该支持协作。应当向技术世界引入不同类型的协作模式，以便用户能够齐手协力，在网络取证领域取得进展。\n\n### 4. 数据可视化与高级用户界面\n\
  用于法证分析的系统使用标准的 WIMP 工具。在以良好组织的方式呈现海量数据时，这些设备的性能非常糟糕。必须开发出有助于可视化和展示法证证据的新方法。\n\n\
  对于不久的未来网络安全及其相关机会，读者可以参考 [5]–16]。\n\n## 13.5 基于量子的网络安全与取证\n\n### 13.5.1 基于量子的网络安全\n\
  加密技术将是量子计算对网络安全产生最大影响的领域之一。如今，公密钥加密已用于保护几乎所有通过网络或云端传输的关键信来和数据。目前，这几乎确定是应用最广泛的在线加密方法。每一个现有的搜索引擎都包含了基础的公钥交换协议，以保护开放互联网上的通信。大多数企业还采用公密钥加密来保护其内部数据、通信以及对联动设备的访问权限。为了确保全面的个人和社区网络安全，良好的加密技术至关重要。它是安全数据传输和保留，以及跨设备和个人之间建立可靠链接的基础。\n\
  \n大规模的量子计算机将极大增加计算能力，为增强网络安全开启新的可能性。量子时代的网络安全将能够在该时代的网络攻击造成损害之前识别并拦截它们。但它最终可能是一把双刃剑，因为量子计算也可能引发新的漏洞，例如快速解决作为某些加密类型基础的挑战性数学问题的能力。组织和其他团体现在就可以开始准备，尽管后量子加密标准仍在开发中。\n\
  \n由于作为目前数据安全系统基础的非对称加密方法预计最终会被量子计算机分解，企业必须审查其加密策略。\n\n对巨大质数的利用是传统加密的基础。现代计算机在破解这些数字方面十分困难。尽管如此，需要一个未来的抗量子加密技术时代，以防止整个商业领域出现潜在的毁灭性安全泄露，因为量子计算处理此类复杂数据的速度要快得多。\n\
  \n目前似乎还没有没有任何量子计算机能够处理海量的量子比特，以执行破解现有防护所需的必要因式分解。然而，在未来 10-15 年内，这种情况可能会发生变化，这将为组织带来更多危险，特别是金融部门。为了解决这些预期的问题，学者、决策者和网络安全专家正聚焦于创建后量子加密。\n\
  \n### 13.5.2 基于量子的取证\n量子计算带来的计算益处是巨大的。逻辑叠加技术的使用引导着当前的计算机环境日益向量子比特计算宇宙演进。随着传统解决方法的被取代，许多技术创新将变为现实。数字取证和网络安全的创新受到更先进计算发展进展的显著影响。网络犯罪可能会大幅增加，有害程序将获得快速伤害的能力。为了解决诸如恶意代码自动追踪和追踪、恶意代码生成源、源代码验证、知识产权盗窃问题、版权违规问题，以及在量子取证的助力下获取质量和数量的法证证据等问题，法证方法论中的量子计算必须取得进步。\n\
  \n此为止，研究人员几乎没有考虑过量子取证。利用传统的“现场法证”和“事后法证”划分，很容易理解量子计算机在数字法证调查和分析方面的可能性。从已经讨论的内容显而易见，量子计算机无法进行现场系统法证，因为对演化中的叠加态进行的任何观察或测量都会导致其坍缩到一个任意选择的分量。目前，系统状态与观测者或测量设备之间产生关联，导致有利的状态信息渗入复合系统并变得不可恢复。\n\
  \n事后法证最初似乎是一个颇有前景的选择。在执行量子程序后，可能只留下了由受控退干产生的单一经典输出。显然，这种证据可能会被标准的反法证方法消除。尽管如此，鉴于无法观测中间状态，基于量子的计算进展的时间线无法重建。\n\
  \n## 13.6 结论与未来工作\n本文主要关注了网络安全和网络取证。观察过去几十年技术的发展轨迹是非常重要的。当我们能够借助新技术捕获网络攻击背后的攻击者和主使时，不应忘记同样的技术也可以被攻击者利用。因此，我们必须继续寻找避免网络攻击的新方法。虽然其他论文主要关注网络取证和网络安全的优缺点，但本文不仅涵盖了这些，还评估了我们目前这些领域的现状以及改进方法和提高公众意识，这有助于保护人们和组织在虚拟世界中的安全。网络安全和网络取证将成为未来讨论最多、投入最多的领域。随着全球各国在网络安全领域投入数十亿美元，衡量一个国家发展的因素之一将是在该领域取得的进展。所有组织平等地投入网络安全将非常重要，因为它们遭受网络攻击遭受的损失高达数百万美元，如果这还不够，公众对个人信息保护信任的丧也加剧了忧虑。\n\
  \n\n\n\n\n在涉及网络取证时，我们在捕获那些臭名昭彰的主谋者方面取得了巨大进展，但我们仍需改进手头的工具。网络取证案件涉及的时间量也是检察官所担心的问题，随着未来更先进技术的出现，要以复杂的方式收集数据并将其呈交法庭将变得非常困难。凭借现有的工具，我们完全能够捕获攻击者，但面对瞬息万变的技术，我们不能坐享待毙并期待在接下来的二十年里还能照此。这些工具在不不久的将来甚至可能被证明是低效的。\n\
  \n本文讨论了普通人在虚拟世界中所面临的威胁，以及攻击者如何利用不同方法获取其系统的访问权限，从而获取其个人信息。为了保护自己的系统，人们需要无法被破解的密码。如果公众对自己在网络世界的安全变得警惕，并采取一切必要的预防措施保持安全，一个国家在这两个领域确实可以实现飞跃。教育公众是一个非常漫长且耗时的过程，但一旦公众了解了虚拟世界的知识，将极大地促进一个国家的发展。现在，这将是一场关于谁能最好教育同胞的时间竞赛。\n\
