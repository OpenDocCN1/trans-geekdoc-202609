  \ HTML 中抓取的清洗词汇）。`x1`、`x2`、`x3` 和 `x4` 代表通过 `Universal Sentence Encoder` 将经典数据编码为量子数据。在启动电路之前，所有量子比特都处于\
  \ `Zeroth State`（零态）。\n\n类别数量为 `k`。`VQC` 的表达能力通过迭代由虚线标记的部分电路来增强。\n\n所选的 `Qubits`\
  \ 数量取决于数据的输入维度和所需的电路深度（例如，在实现的方法中为 `512` ）。\n\n## 4.4 结果与讨论\n\n作者设计了一个暗网爬虫来收集洋葱服务。该爬虫以多线程模式在深度\
  \ 3 下运行。爬虫收集了 19,000 个版本 2 洋葱服务的 HTML 页面。此外，爬虫还收集了洋葱服务的 URL 以及相应服务的标题和元数据。作者根据非英语洋葱页面和\
  \ Facebook 深层网洋葱面的标准排除了隐藏服务。深度 3 的爬取导致许多被归类为社交网站的 Facebook 隐藏页面。Facebook 页面的过多导致了数据集偏移。因此，作者删除了在深度\
  \ 2 和深度 3 收集的 Facebook 洋葱页面。在预处理并删除 Facebook 帖子后，作者考虑了 2,000 个洋葱服务进行分析。\n\n![图 4.5\
  \ 洋葱服务示例。](img/fig4-5.jpg)\n\n`图 4.5` 洋葱服务示例。\n\n`图 4.5` 显示了洋葱服务页面的示例。\n\n`表 4.3`\
  \ 显示了用于量子编码的数据属性的数据集样本。\n\n`图 4.6` 显示了一个洋葱服务的示例清洗文本快照。\n\n量子编码模型接收了 2,000 个隐藏服务样本，实现了\
  \ 99.6% 的准确率。\n\n`表 4.4` 显示了量子模型对洋葱服务分类的采样输出标签。\n\n`图 4.7` 显示了不同洋葱服务的分类饼图。\n\n作者研究了量子编码带来的性能提升。暗网爬虫并没有关注特定领域；它持续地爬取数据。因此，数据量巨大。所提的研究通过将经典数据转换为量子编码，旨在性能地对暗网洋葱服务进行分类。\n\
