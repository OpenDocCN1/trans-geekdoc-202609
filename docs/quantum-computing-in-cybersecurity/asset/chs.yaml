  \nPranav Bhatnagar, Shreya Pai 和 Minhaj Khan  \n*Ajeenkya Patil 大学工程学院，印度浦特*\n\n\
  ## 摘要\n\n互联网的使用在过去十年中迅速扩张。全球数亿人通过互联网进行操作。应用程序每天都在复兴，新技术每天都在涌现。随着发展的复兴，高级攻击也一直在延伸。量子纠缠已变成一种解决极其困难问题的快速发展技术。量子计算对网络安全的影响是巨大的。它构成的主要威胁之一是分布式拒绝服务（DDoS）。目前，\
  \ DDoS 攻击已成为网络犯罪领域的主要问题之一。\n\n**关键词：** DoS（拒绝服务）、DDoS（分布式拒绝服务）、网络攻击、安全、服务器、网络犯罪、量子计算、网络战争\n\
  \n## 3. 引言\n\nDDoS 攻击是一种通过分配资源或其周围设施来干扰分配服务器、组织或协会流量的恶性技术。DoS 攻击通常是利用受损计算机来实现的。\n\
  \n### DDoS 攻击是如何工作的？\n\n\n\n\n\nDDoS 攻击是由机器、伙伴电脑以及各种设备（如 IoT 设备）与恶意软件结合执行的，这些恶意软件可以被它们控制。这些特定的设备被称为机器人（或僵尸）[8,\
  \ 9]，而机器人的社交聚集[[25]](#c03.xhtml#ref25) 被称为僵尸网络[[3]](#c03.xhtml#ref3)。图 3.1 显示了 DDoS\
  \ 攻击的工作原理图，而图 3.2 重点突出了远程 DDoS 攻击分类，图 3.3 展示了 DDoS 攻击的工作原理，图 3.4 显示了用于检测攻击的云入侵检测系统[[28]](#c03.xhtml#ref28)，此外图\
  \ 3.5 展示了 DDoS 攻击的架构，最后图 3.6 代表了 DDoS 攻击的分类。\n\n![图 3.1 DDoS 攻击的工作原理图](img/fig3-1.jpg)\n\
  \n图 3.1 DDoS 攻击的工作原理图。\n\n![图 3.2 远程 DDoS 攻击分类](img/fig3-2.jpg)\n\n图 3.2 远程 DDoS\
  \ 攻击分类。\n\n![图 3.3 DDoS 攻击的工作原理](img/fig3-3.jpg)\n\n图 3.3 DDoS 攻击的工作原理。\n\n![图 3.4\
  \ 用于检测攻击的云入侵检测系统 [28].](images/fig3-4.jpg)\n\n图 3.4 用于检测攻击的云入侵检测系统 [[28]](#c03.xhtml#ref28)。\n\
  \n![图 3.5 DDoS 攻击的架构](img/fig3-5.jpg)\n\n图 3.5 DDoS 攻击的架构。\n\n![图 3.6 DDoS 攻击的分类](img/fig3-6.jpg)\n\
  \n图 3.6 DDoS 攻击的分类。\n\n### 量子计算\n\n量子电脑比过时的电脑更基础的观点源于理查德·费曼的洞察。在已经过时的电脑中，似乎需要关键的推测来在量子结构中复制各种粒子。这种想法是，量子电脑可以比那些已经变得极其缓慢的过时电脑快地复制量子认证周期。更重要的量子计算已经用于重新启动玻子和费米子结构，明确的是；模拟超出当前传统超级计算机要求的巨大反应需要几个不同的量子比特（Q-bits）。量子计算运行在量子计算评估的量子电路模型上。这些计算拥有许多优势，例如，与标准的代数和物理评估相比，它们具有较大的确定性、真正巨大的数字规模和更好的混合。相应地，它们可以成功应用于多顶的可预测部分的优化。一个旧的计算在标准电脑上执行每一步。每一个标准计算还可以在量子电脑上执行。标准电脑上可以选择的所有问题都可以在量子电脑上处理。量子计算可以比旧计算更快地处理和管理一些问题[[31]](#c03.xhtml#ref31)。\n\
  \n## 3.2 DoS 攻击\n\n在拒绝服务（DoS）中，大量的数据包从攻击者的设备或节点发送到单个受害者的机器。\n\n### A. DoS 攻击计划\n\
  \nDoS 攻击可以根据目标协议的分级分为五类。\n\n网络设备层 DoS 攻击包括通过利用产品漏洞或缺陷或通过尝试禁用连接设备上的硬件资源而发生的攻击。连接设备利用的一个示例是支持泛洪的恶意密钥确认环。这种利用可以导致某些\
  \ Cisco `7xx` [[10]](#c03.xhtml#ref10) 交换机通过 `telnetting` 连接到交换机并输入一个非常长的密码而崩溃。\n\
  \nOS 级 DoS 攻击在很大程度上取决于运行系统如何使用程序。这种社交事件中 DoS 攻击的一种描述是死亡之 p（Ping of Death）攻击 [[11]](#c03.xhtml#ref11)。在这种攻击中，一个比标准尺寸大得多的\
  \ ICMP 回显请求被发送到目标。\n\n基于应用的 DoS 攻击试图通过记住目标上运行的网络应用程序或通过使用这些应用程序来卸载受害者的资源。基于应用的攻击的一个示例是指纹弹（finger\
  \ bomb）[[12]](#c03.xhtml#ref12)。一个恶意客户端可以利用极其的指纹框架，这可能会耗尽某些资源。\n\n在数据泛洪攻击中，攻击者尝试通过发送大量数据来利用服务器或网络中的可用带宽，从而将其转化为扰动，这可能由于其他节点被数据包淹没而无法访问资源，从而导致死锁的可能性。由于每个机器人被视为一种使用互联网的动力设备，将分配的流量与普通流量区分离开，但这有时会带来不便[[6]](#c03.xhtml#ref6),\
  \ [7]](#c03.xhtml#ref7)。\n\n## 3.3 DDoS 攻击\n\n在分布式拒绝服务（DDoS）中，大量的数据包从多个攻击者的设备发送到同一个目标机器。\n\
  \n### A. DDoS 攻击定义\n\nDDoS 攻击使用各种电脑向一个目标机器发送组合的 DoS 攻击。使用客户端-服务器推进，攻击者可以无意地通过各种可行的计算机系统复制\
  \ DoS 能力。DDoS 攻击通常位于损失者的连接内部，以避免引起提及个体的说服性反应，并在攻击者的连接外部，以避免攻击者持续预期的攻击所带来的缺陷。\n\n\
  \n\n\n\n在 `IJRAR, May 2019, Volume 6, Issue 2` 的《DDoS 攻击研究、危害及其防护》中，我们学习了 DDoS 防御机制的技巧，例如监控、入站/出站过滤、清洗和黑洞路由\
  \ [\\[29\\]](#c03.xhtml#ref29)。该研究论文提出的某些解决方案和方法论点包括：\n\n*   为每个具有路由器访问权限的每个提供用户名和密码\n\
  *   仅允许基于 SSH 的连接\n*   确保每个静态连接的接口上都有 RPF（即入站和出站过滤）\n\n在 `International Journal\
  \ of Computer Applications` (0975 – 8887) 第 49 卷第 7 期（2012 年 7 月）《基于僵尸网络的 Web 服务器分布式拒绝服务（DDoS）攻击：分类与艺术》中，我们了解了基于僵尸网络的\
  \ DDoS 攻击，以及基于僵尸网络的 DDoS 攻击如何成为 Web 服务器中最常见的僵尸网络攻击类型 [\\[30\\]](#c03.xhtml#ref30)。\n\
  \n`2014 IEEE International Conference on High Performance Computing and Communications\
  \ (HPCC)` 中《利用 QSE 算法对云计算中的 DoS 攻击进行分析与检测》作者提出了一种基于量子计算的解决方案。他们使用量子启发进化算法（QEA）来检测云计算中的\
  \ DoS 攻击 [\\[31\\]](#c03.xhtml#ref31)。\n\nPC 世界正在出现各种类型的组合 DDoS 攻击。关键的转变将基于带宽的攻击和应用攻击相结合。这两种模型利用了所有的移动速度并利用了关联资源。在完成评估后，逻辑顺序显现出来。根据对任务的押注，也可以将其划分为不同的类型\
  \ [\\[1\\]](#c03.xhtml#ref1)。\n\n### 宽带终止攻击\n\n这类攻击通过填充不希望的繁忙时间网格堵塞来消耗交换速度或目标结构，以阻止官方流量出现在受害者的网络中。`Trinoo`\
  \ 等机械装置主要被用于完成这些攻击。\n\n### 洪水攻击\n\n*   这种攻击是一种巨大的数据包堆栈，攻击者通过僵尸网络，利用极高速数据包通过数据包洪水发送到损失端，阻断连接并产生\
  \ IP 流量。程序进入完全连接数据移动限制，并迅速减少允许到达网络的干扰流量。这通过 `UDP`（用户数据报）和 `ICMP`（互联网控制消息协议）包被感知。一个\
  \ `UDP` 洪水以以下步骤开始：攻击者发送大量的 `UDP` 包，通过任何不确定方法或通过僵尸发送到任何系统的端口。受害者在接收到数据包后，受害者的框架会检查该端口是否有待处理的应用程序。\n\
  *   在某些情况下，如果应用程序不存在，它会返回一个 MP 包消息，显示“节点难以访问”。\n*   损失响应包通过受害者的区域传输，而不是僵尸的区域。\n\n\
  随后，可用数据移动限制被限制给真实客户端。这影响了受害者与最近系统的接触。这些攻击的各种变结合了隔离攻击、DNS 洪水攻击、VoIP 洪水攻击和媒体数据攻击。一个\
  \ `ICMP` 洪水包含以下进展步骤：\n\n*   攻击者发送以下步骤：攻击者发送大量的 `ICMP` 包，通过任何不确定方法或通过僵尸发送到任何系统的端口。\n\
  *   损失响应包通过受害者的区域传输，而不是僵尸的区域。\n\n### 最大攻击\n\n这种攻击的目的是利用集中的、特定的显示能力来利用其他攻击者的资源。`TCP\
  \ SYN` 攻击是这种攻击的典型定义。各种显示攻击整合了 `PUSH+ACK` 攻击、授权服务器攻击和 CGI 应用攻击。\n\n### 资源耗尽攻击\n\n\
  拒绝服务 DDoS 攻击旨在消耗防御者的系统资源，使合法客户端无法获得服务。\n\n### B. 防御机制\n\n为了防御 DDoS 攻击，研究人员已采取了不同的应对措施。\n\
  \n### 预防技术\n\n下面列出最主要的预防和保护性措施：\n\n\n\n\n\n- **入站过滤 (Ingress Filtering)** - 此协作停止具有虚假源地址的接入数据包。利用交换机来实现。该框架破坏了通过\
  \ IP 地址伪造进行的 DDoS 攻击。\n- **出站过滤 (Egress Filtering)** - 在此策略中，利用出站通道。该系统允许那些仍然存在的具有巨大\
  \ IP 地址的数据包离开网络。\n- **基于路由的分布式包过滤 (Route-Based Distributed Packet Filtering)** -\
  \ 通道使用路由数据来引导伪造 IP 数据包并阻止攻击。同时也使用了 IP 回溯。然而，它需要关于组织地理位置的完整信息。\n- **安全叠加网络服务 (Secure\
  \ Overlay Services)** - SOS 计划具有传输功能，可以保护丢失的连接或特定系统。它假设接入的数据包如果是来自合法服务器，则应该是重要的。使用复制部分来验证允许进入叠加网络连接的真实客户端身份。\n\
  \n其他预期防御系统包括禁用未使用的的组织、使用安全补丁、更改 IP 地址、禁用/启用 IP 传输、使用权重更改和蜜蜜罐。尽管如此，缓解技术无法完全消除 DDoS\
  \ 攻击带来的风险，但它们提供了基础或扩展的安全防护 [1]。\n\n## DDoS 检测技术\n\n### 异常检测\n\n此 DDoS 识别系统通过观察连接或结构执行过程中的异常异常来识别攻击。这应该通过区分当前存在的特征与最近观察到的正常系统显示来实现。恶意侧在系统中直接被识别。很少有异常检测系统整合了以下：\n\
  \n> `NOMAD` - 一种灵活的连接查看框架，通过隔离 IP 数据包头部数据来识别连接异常。\n\n> 带有拥塞的包采样和过滤技术 - 利用丢弃包子集进行了一种量化分析，当识别到异常时，会向切换发送信号以处理有害数据包。使用丢弃数据组子集进行了量化评估，当发现异常时，会向切换发送信号以处理有害或表现出异常的数据包。\n\
  \n> `D-WARD` - 在核心路由器处检测 DDoS 攻击。它防止攻击扩散到故障的邻居。它被部署在边缘交换机上，以识别接入和动态的连接流量。\n\n> `MULTOPS26`\
  \ - 这是一个构造的数据结构，其灵感来自区分 DDoS 攻击的证明。它处理假设参与 DDoS 攻击的连接 IP 区域可能是可能的，因此采取措施仅阻止/停止这些特定区域。它跟踪识别追寻攻击者的结构，或通过在攻击协调模式或故障组织模式下运行而遭受洪水的系统。一个交错树记录了在不同级别遇到的数据包速率。然而，它需要重新配置交换机并使用新的内存计划\
  \ [1]。\n\n**表 3.1** DDoS 攻击的回溯方法。\n\n| 方法 | 描述 |\n| :--- | :--- |\n| ICMP 回溯 | 系统筛选出一种方法，向所有交换机发送低概率包，并同时向目标发送\
  \ ICMP 回溯消息。由于在识别攻击者时使用了大量 ICMP 消息，面临额外流量等问题；此外，这些数据包的确认是困难且困扰的；此外，从路径图中获取上述信息的方式存在问题。\
  \ |\n| IP 回溯 | 遵循攻击者的路径以追踪攻击起点。在此策略中通过跟踪和遵循其路径来追踪攻击者的源。偶尔如果 TCP/IP 协议源责任被禁用且网络是非状态的，这可能会变得困难。\
  \ |\n| 回溯 - 链路测试 | 在系统中尝试接入连接并尝试其为攻击的可能性。这是通过泛洪大量数据流量并测试是否在网络中实现了任何加剧来实现的。 |\n|\
  \ 概率包标记 | 该技术克服了链路测试回溯的缺点，因为它不需要以前的网络拓扑知识、海量流量等。 |\n\n### i. 检测滥用\n\n通过意识到信息集合中异常的特征或滥用实例，这是识别攻击的方法。当观察到这些模型中的任何一个时，DDoS\
  \ 攻击就会被标记。\n\n## 响应式检测\n\n当检测到 DDoS 攻击时，后续措施应该是阻止攻击者，并追踪攻击者的系统机器以寻找攻击者的真实特征。这种方法通常需要二三天；它应该在随后实现，或者应该通过\
  \ `ACL` 实际实现。\n\n有某些技术可以用于执行和追踪攻击者的特征，如表 3.1 所示。有许多策略可以用于阻止/防御 DDoS 攻击；遗憾的是，并不是每一个都能被识别和预防。最多能做到的是减少攻击的影响/打击\
  \ [1]。\n\n### C. 配置 DDoS 执行\n\n与其他类型的网络攻击不同，DDoS 攻击并不试图破坏你的安全防线。相反，DDoS 攻击意味着让你的网站和服务器对合法客户端不可用。DDoS\
  \ 因此可以被用作其他恶意活动的干扰，并削弱安全机器，进入目标的安全防线。\n\n一个令人信服的连接攻击本质上是一个影响整个网络客户端的事件。这使其成为黑客主义者、机械罪犯、恶棍和其他其他希望实现巨大目标或对特定说明产生影响的人的决策武器。\n\
  \n在预期和驱动 DDoS 攻击时，发生以下活动：\n\n> **代理选择**：攻击者选择一个专家来执行攻击。这些机器应该处于攻击者可以用来获取访问的某种风险中。你需要大量的资源来执行可靠的攻击。从开始，该策略是手动执行的，但很快就使用查看工具实现了自动化。\n\
  \n> **入侵**：攻击者利用专家硬件的安全漏洞和缺陷并执行攻击代码。你还需要保护你的代码不被发现和禁用。诸如 `Ramen worm` [14] 和 `Code\
  \ Red` [15] 等设计工具很快就陷入这种配置。专家系统的所有者和客户通常不知道他们的结构将受到损害并连接 DDoS 攻击。在调查 DDoS 攻击时，每个主程序只使用二三个资源（内存和数据传输），因此\
  \ PC 客户端的执行变化很小。\n\n\n\n\n\n> 通信：攻击者联系不同的主管，以弄明哪位专家正在运行、何时组织攻击，或者哪位专家正在进行中。取决于攻击者如何准备\
  \ DDoS 攻击的关联，专家可能被配置为与类似一个服务器的东西进行通信。攻击者与宿主机之间、以及宿主机与主节点之间的通信可以通过 `TCP`、`UDP` 或\
  \ `ICMP` 协议来实现。\n\n> 攻击：目前，攻击者命令它们发送攻击。受害者、攻击时间以及攻击的表达特征，如类型、长度、`TTL`、端口号。\n\n>\
  \ 带宽：我们承认信息传输是准备 DDoS 攻击中不可或缺的一部分。如果你想获得更多信息移动限制，那么你对目标机器的攻击可能会导致失败并彻底终结。\n\n关于\
  \ DDoS 攻击，有不同类型的攻击，每种攻击类型都有其独特的方式。由于每种攻击类型都有自己的功能，因此针对每种攻击类型都有相应的解决方案。在表 3.2 中，我们提到了\
  \ DDoS 攻击的名称、其功能以及防御该攻击的解决方案。\n\n## D. DDoS 示例\n\n各种类型的 DDoS 攻击针对联盟网络的不同部分。为了理解不同的\
  \ DDoS 攻击如何工作，了解联盟网络是如何构建的是必不可少的。\n\n考虑到互联网的关联是使用各种组件或“层”产生的。就像规划一栋房子的上下结构一样，模型中的每一层都有相应的解释。下文显示的\
  \ `OSI` 模型是一个用于用 7 个显性层来描述网络的的解析化结构。\n\n虽然在每个真正重要的方面，所有 DDoS 攻击都汇于通过流量压垮目标设备或连接，但攻击可以归纳为三种策略。攻击者可以使用一个或多个不同的攻击向量，或者根据目标所采取的对策检查来循环使用攻击向量。\n\
  \n表 3.2 DDoS 攻击及其影响和解决方案 [\\[28\\]](#c03.xhtml#ref28)。\n\n| 攻击类型 | 攻击功能 | 针对攻击的解决方案\
  \ |\n| --- | --- | --- |\n| `ICMP (Ping)` 洪水攻击 | 这种带宽攻击使用了 `ICMP` 数据包。 | `ScreenOS`，提供一种筛选选项，设置一个阈值，一旦超过就会触发\
  \ `ICMP` 洪水攻击。 |\n| 放大攻击 | 从攻击者发送一个请求，产生一个巨大的响应。 | 使用具有高性能的操作系统、负载均衡器、对连接和连接速率设置限制。\
  \ |\n| `HTTP GET Flood` 洪水攻击 | 攻击者向服务器发送大量的集体请求并消耗其资源。 | `Imperva` 提供 Web 应用程序保护，可以识别畸形成的机器人流量，停止所有\
  \ `HTTP` 洪水和针对应用层的攻击。 |\n| Smurf 攻击 (烟人攻击) | 攻击者利用 `ICMP` 回显请求数据包产生 DDoS 攻击。 | |\
  \ 数据包过滤，为每个主机和交换机设置适当配置，使其不响应 `ICMP` 请求且不直接将数据包转发到通信的地址。 |\n| 带宽攻击 | 目标资源被消耗。 |\
  \ `Multops` 中枢节点树，识别从攻击者流向受害者的不成比例的集体数据包。 |\n| 死亡 Ping (`Ping of Death`) | 通过攻击节点向计算机发送多个恶意或畸形的\
  \ ping。 | 对每个传入的 `IP` 数据包进行额外检查，说明其是否有效或实质。 |\n| `DNS  Flood` | 一种同时针对基础设施和 `DNS`\
  \ 应用程序攻击。 | 使用 `Radware` 解决方案，即使在攻击者攻击下也能允许持续 `DNS` 服务并缓解基于 `DNS` 的攻击。 |\n| 反射器攻击\
  \ | 从攻击者到目标的攻击流量被外部者拦截，以引起周围的混乱。 | 使用 `Cloudflare` 缓解系统作为缓解措施，因为它有助于识别、跟踪和过滤攻击。\
  \ |\n\n## 应用层攻击\n\n### 攻击目标\n\n有时，这被称为第 7 层 DDoS 攻击（根据 `OSI` 模型的第七层），这些攻击的目标是耗尽目标的资源以实现组织的拒绝服务。攻击基于在服务器上创建页面并考虑到\
  \ `HTTP` 请求进行传输的层级。单个 `HTTP` 请求在客户端执行的计算成本很低，但对于目标服务器来说，回答是非常贵的，因为服务器通常会堆栈各种记录并运行信息文件请求来创建一个网站。\n\
  \n第 7 层攻击试图受到保护，因为从合法流量中隔离出恶意流量是困难的。\n\n### 应用层攻击示例：HTTP 洪水攻击\n\n这种攻击就像在大量电脑上立即反复点击\
  \ Web 程序的刷新按钮——海量的 `HTTP` 请求淹没服务器，实现拒绝服务。这种攻击从简单到复杂不等。\n\n更简单的执行可以通过对 `IP` 区域、引用者和客户端专家进行近似程度的搜索来访问一个\
  \ URL。复杂的设计可以利用搜索 `IP` 区域的大量地址，并利用具有冲突的引用者和客户端专业人员针对不规则的 URL。\n\n## 协议攻击\n\n###\
  \ 攻击目标\n\n显示攻击，通常被称为状态耗尽攻击，通过过度消耗服务器资源以及带有防火墙和负载均衡器的联盟设备资源，导致帮助服务中断的影响。显示攻击利用显示栈中第\
  \ 3 层和第 4 层的漏洞来实现所阻止的目标。\n\n### 协议攻击示例：SYN 洪水攻击\n\n`SYN Flood` 类似于一个休息室的接待员从店门口接收请求。接待员收到通知，继续获取包，并等待确认以带入包。接待员随后获取更多的请求，直到他们无法交付更多包，变得过载且请求无响应。\n\
  \n这种攻击利用 `TCP` 握手——两台电脑建立关联连接的社会事件——通过使用伪造源 `IP 地址` 发送目标无限多个 `TCP “起始连接请求” SYN 包`。\n\
  \n目标机器回答每个关联并因此等待握手的最后进展，而该进展从未发生，在此期间破坏了目标的资源。\n\n 流量型攻击\n\n### 攻击目标\n\n此类攻击试图通过消耗目标与更大的互联网之间所有可用的数据传输来制造阻塞。通过使用某种放大或其他产生巨大流量的技术，向目标交付大量数据，例如来自僵尸网络的请求。\n\
  \n## E. DDoS 攻击案例\n\n### 2020 年 AWS 攻击攻击\n\n\n\n\n\n这是有以来最持续的 DDoS 攻击，它针对一个未定义的\
  \ AWS 客户端，该客户端利用了一种名为无连接轻量级目录访问协议（CLDAP）的反射。这种程序依赖于脆弱的外部 CLDAP 服务器，并将从伪造 IP 地址传输的信息增加了\
  \ 56 倍。该攻击持续了三天，峰值达到了惊人的每秒 2.3 TB。\n\n## 为什么 AWS 攻击至关重要\n\n虽然 AWS DDoS 攻击实现的阻断效果确实没有想象中那么严重，但攻击的巨大规模以及对\
  \ AWS 与客户可能导致收入损失和声誉受损的影响是巨大的。\n\n## 2014 年 CLOUDFLARE DDoS 攻击\n\n2014 年，基于 Web\
  \ 的安全提供商和内容优化连接服务 CloudFlare 遭受了一场流量约为每秒 400 Gbps 的 DDoS 攻击。该攻击由单一 CloudFlare 客户端发起并部署在欧洲的服务器上，通过利用网络时间协议（NTP）显示的漏洞来实现，该协议用于确保电脑时钟准确。尽管攻击仅针对\
  \ CloudFlare 的其中一个客户端，但对于 CloudFlare 自身的整个联盟来说，这具有重大的意义。\n\n## 为什么 CloudFlare 攻击至关重要？\n\
  \n这种攻击采用了一种策略，即攻击者利用伪造源区域向攻击目标服务器发送伪造的 NTP 服务器响应。这种攻击被称为“反射攻击”，因为攻击者可以“跳过”来自 NTP\
  \ 服务器的伪造声明，同时隐藏自己的区域。由于 NTP 协议缺乏某种机制，攻击的某些部分可以真实地放大数倍，这使得 NTP 服务器成为一种极其强大的 DDoS\
  \ 工具。攻击发生不久后，美国计算机应急准备小组将 NTP 放大攻击描述为“特别难以防御”，因为“响应是来自真实服务器的真实信息”。\n\n## 2012 年六大银行的\
  \ DDoS 攻击\n\n2012 年 3 月 12 日，六家美国银行遭到了 DDoS 攻击的洪水洗击：美国银行、摩根大通银行、美国银行、花旗银行、富国银行和\
  \ PNC 银行。这些攻击是由一个名为 Brobot 的僵尸网络中的许多 get 服务器实施的，每次攻击产生的 DDoS 流量每秒超过 60 GB。\n\n那时，这些攻击在持续性上令人惊叹。相关的社会团体并没有尝试执行一次攻击后撤退，而是使用大量的攻击策略对目标进行轰击，以寻找可行的方法。这样，无论银行被要求应对何种类型的\
  \ DDoS 攻击，它们都会受到各种类型攻击的影响。\n\n## 为什么六大银行攻击至关重要\n\n2012 年银行攻击最重要的一点是，攻击据测是由加沙阿尔-卡萨姆旅团（巴勒斯坦哈马斯组织的主要支柱）实施的。同样，这些攻击严重影响了受影响银行，导致了赔偿、援助成本、客户信任问题以及银行的信誉形象。\n\
  \n## 3.4 DDoS 缓解\n\n缓解意味着在合理的预期范围内尽可能减少受攻击机器的损害。完全预期 DDoS 攻击是不可能的。它应该被减少到某种程度。\n\
  \n### A. DDoS 缓解技术\n\n干扰防御强度评估表明，完全停止或阻止 DDoS 攻击是不可能的，重点在于尽可能在预期范围内减少攻击的影响，并增强组织的韧性。干扰防御可以分为两类：针对非基础故障的变和服务质量（QoS）。\n\
  \n### 容错性\n\n一种大型评估办公室，其设计集成在基础设施中并在三个级别运行：设备、软件和结构 [18。容错的意义在于，通过复制连接优势并隔离其通道，当流量导致单个交互中心故障时，连接可以继续提供此类服务。\n\
  \n### 服务质量 (QOS)\n\nQoS 描述了网络为特定类型的应用程序或流量传输明确结果的能力。已经开发了不同的 QoS 块结构和 QoS 系统来减少\
  \ DDoS 攻击。\n\n在集成式服务（IntServ）和区分服务（DiffServ）之外的 QoS 框架已成为关键方案 [19。IntServ 使用资源预留协议（RSVP）协调流量流中的资源任务。DiffServ\
  \ 是一种根据需求限制的结构。DiffServ [20, 21] 使用 IP 区域的服务类型（TOS）标记位，并考虑每个数据包的 TOS。\n\n### 队列技术\n\
  \n队列技术是用于对抗 DDoS 攻击的其他方法。目前有多种类型正在开发中。一种旧且通用的队列技术是基于类的队列（CBQ） [22。\n\n### 资源定价\n\
  \n这是 Mankins *et al.* 提出的另一种减少 DDoS 攻击的策略。Mankins *et al.* [23] 注意到，DDoS 攻击是有效的，因为成本固地落在服务器上，而在攻击期间，攻击流量处于与真实流量极其模糊的中心水平。他们建议开发一种分布式分段框架，在连接、服务器和数据资源上设置不同的速率，以根据费用以及数学权重降低完成服务请求的实际成本。\n\
  \n通过使用不同的费用和购买限制，属性可以提供服务质量，并选择客户最有效的行为方式和处理异常行为的方式。关键是将基本技术与理想客户分离，并驱逐导致服务器负载的客户端。该程序的最终结果是，攻击者可以以极廉的成本通过虚假应用程序淹没系统，从而增加有效用户的数量。\n\
  \n### 推回架构\n\n当目标是让驱动程序感知进度或停止恶意（充满）流量时，推回设计是一种减少速率非常有前景的技术。在基于聚合的拥塞控制（ACC） [17]\
  \ 中，速率被描述为包含材料的小型集合 [24。因此，[17 推回守护进程使用独特的确认计算来检查攻击迹象。该系统的部分可以扩展，且不需要上游领导节点。显然，对于速率限制器和一个可以检查滑动结果线的推回守护进程有巨大且有限的需求。\n\
  \n### 反向 Web 代理\n\n中间服务器是一种主机服务器，它利用资源帮助客户端从一个服务器获取。这些资源随后被返回给客户端，是在真实服务器还是原始服务器上。转换主从互联网获取请求并将其移动到内部联盟内的服务器。客户端与专家协作，可能不知道内部联盟。反向代理可以隐藏真实服务器的存在和性质\
  \ [16。\n\n\n\n\n\n负载均衡应用程序中有几个组件可以保护你免受典型的网络攻击。如果没有经过训练的反向专业人员，通常很难杀灭恶意软件或开始规模缩减。一个溯源中间服务器可以堆叠移动到跨越不同服务器的请求上，每个服务器都运行着自己的应用程序空间。由于它从相邻的\
  \ Web 服务器获取中介，该溯源中间件可能需要更改每个传入请求的 URL，以匹配其所引资源的内部区域。提取专家可以通过放置独特的静态内容（通常称为 Web 加速\
  \ 26）来减轻根服务器的压力。\n\n## 防火墙 (FIREWALL)\n\n防火墙是用于阻断不可信网络的关键设备。通常，拒绝服务（DoS）的主要攻击手段是针对这些设备的彻底防护。\n\
  \n普通的防火墙（包过滤、应用层或状态检测防火墙）实际上会查看数据包报头，以检查是否存在许可从一个源起始并传输到后续的流量。阻止尝试向未经批准的源或目标区域发送数据。防火墙可以识别是否建立了一个网络对端（客户端和服务器）正尝试扩展会话（连接）。\n\
  \n这些信息在网络表中处理，为了筛选通信，即使是不完善的连接也应该保留在网络表中，因为对于防火墙决定是否有继续跟踪数据包至关重要。在任何情况下，操作风险的可能性都会危及防火墙\
  \ 27。\n\n与网络表关联的数量是有限的，当终端出现在防火墙处时，它无法处理任何额外的连接。此外，由于它需要对网络进行完整审计，防火墙安全设备无法在非均衡线的逻辑上工作，因为在那里简单的接近或活动流量是显而易见的。\n\
  \n对于所有而言，通常先进的入侵检测和防御系统（IPS）需要特定级别的 DDoS 安全防护。某些统一威胁管理（UTM）设备或下一代防火墙（NGFW）提供 DDoS\
  \ 防护并并减少各种 DDoS 攻击。\n\n拥有单一的防火墙设备、IPS 和 DDoS 设备并不容易处理且使用起来极其复杂；然而，单一的全方位安全设备很容易被容量型\
  \ DDoS 攻击所击溃。此外，识别和获取 7 层识别框架所真正需要的安全保证通常不会在防火墙或 IPS 设备上实现，特别是在它没有专用处理器或 ASIC 的情况下。另一个优势是，在你的防火墙或\
  \ IPS 上启用 DDoS 防护会影响单个设备的整体性能，减少客户端输入并增加空闲性。因此，在防火墙或 IPS 设备上启用 DDoS 增强技术必须谨慎完成，在最基础的区域建议即使没有防火墙或\
  \ IPS 也要涉及专用的 DDoS 防护。\n\n## B. 最有效的缓解技术 (MOST EFFECTIVE MITIGATION TECHNIQUE)\n\
  \n在比较了所有缓解技术后，我们认为防火墙在服务器 DDoS 防护方面效果最好。它适用于各种服务器。根据类型、速度、强度、持续时间和 DDoS 命中量，我们可以根据我们的预算、需求和安装时间安装各种类型的防火墙。如前所述，我们可以使用不同类型的防火墙，如软件防火墙、硬件防火墙（物理）。\n\
  \n## 3.5 结论 (Conclusion)\n\n本文让我们对关于什么是 DDoS、遭受攻击的人员所采取的措施以及 DDoS 攻击分类的思路。在各种缓解技术中，防火墙是减少\
  \ DDoS 攻击的最理想方法。根据安全需求资金情况，有多种防火墙。\n\n## 致谢 (Acknowledgement)\n\n我们感谢所有数据来源，包括本地资源、研究论文以及帮助我们获取信息的朋友。我们感谢导师的帮助。\n\
