  \ 经典支持向量机模型 [[18]](#c26.xhtml#ref18)\n\n对于二分类问题，传统的 SVM 是一种有监督机器学习技术。该技术通过将数据映射到高维输入空间，在该区域创建一个理想的分类超平面。从本质上说，涉及到解决一个二次规划问题。SVM\
  \ 的一种变体称为最小二乘支持向量机（LS-SVM）。通过求解线性方程，它接近 SVM 的超平面查找方法。\n\n尽管它可以用于回归问题，但经典 SVM 在有效分类数据方面非常受欢迎，无论其本质是线性的还是线性的\
  \ [[18]](#c26.xhtml#ref18)。每条数据被绘制为 N 维特征空间中的一个点，每个特征的值由特定的坐标表示。然后找到最能区分两类的超平面以便对数据进行分类。距离边界最近的某些观测值的位置被称为支持向量。在\
  \ SVM 的情况下，训练样本被划分为若干组称为支持向量的子集，而这些支持向量定义了决策函数。SVM 已被广泛用于帮助准确的数据分类。得益于 SVM 核，传统方法的性能也得到了改进\
  \ [19, 20]。\n\n```\n![图 26.2 经典分类参数 [16, 17, 19, 20].](images/fig26-2.jpg)\n```\n\
