  \ [4]。\n\n\n\n\n# 宽带互联网\n尽管目前的互联网已经非常快，但量子加密传输提供了更好的安全性。量子加密会导致互联网的运行速度变慢得多。但在未来，我们可能可以在“正常”互联网和“量子加密”互联网之间无缝切换，确保即使是我们最私密的通信也能以所想象中最安全的方式进行发送。这将实现既快速又安全的互联网目标\
  \ [2。\n\n## 量子水下战争 - 核心要点 [15, 17, 19, 23–25]\n\n量子磁力计是定位潜艇或水雷的主要手段。潜艇可能是量子惯性导航的首批采用者之一。通过对潜艇或水雷进行更强的磁性探测，结合新型惯性潜艇导航和量子增强精密声呐，量子技术可能会极大地阻碍海底战争。通常情况下，海洋环境可用于基于量子光探测器、雷达、激光雷达、磁力计或重力计的\
  \ Krelin EPJ Quantum Technology（2021）传感。关于量子技术如何影响核动力潜艇近乎不可侵犯性的广泛回顾，请参阅 [3。牛津大学的研究人员在\
  \ 2017 年与 Nokia 和 Bay Photonics 合作开发了一种发送量子密钥的机制，该机制可能用于 PoS 系统。\n\n对于需要在国内和国际范围内保护大量敏感、长期机密材料的政府和国防组织来说，量子通信将非常有用。回想\
  \ 2015 年针对人事管理局的恶意软件攻击，那次攻击导致 2150 万份文件（社会安全号码等）被盗取。\n\n为了业务的连续性，许多私营企业、机构和政府部门被迫备份它们最重要的数据。将这些数字资产（可能包括关键财务信息或知识产权）备份在远程数据中心或\
  \ `DRC` 中，是保护这些敏感数据的唯一途径。\n\n信息不仅要在数据中心内部保持安全，在往返途中也需要得到安全保障。想想医院和其他医疗机构必须维护的所有机密医疗记录。通过量子加密，或更准确说是量子密钥分发，这些数据在许多情况下已经实现了长期安全。\n\
  \n## 27.6 局限性\n纠缠光子看起来是安全的，但在实践中面临成本以及维持足够长时间以满足实际需求的挑战 [8。另一个问题是，距离超过 50 公里的噪声太大，导致错误率也大幅上升\
  \ [4。结果是从信道传输信息变得非常困难，并且极易被窃听。然而，量子密钥最终可以在互联网上传输。可以通过对齐小型望远镜来定位信号。某些模拟甚至表明卫星能够接收光子，实现全球通信。由于\
  \ `QKD` 是量子力学在实践中的首次应用，它说明了基础科学研究的重要性 [2。量子密钥分发的安全性在实际应用之前需要确认，这需要对其安全性的量子力学原理进行详细分析。为了验证这些安全理念，应该在量子物理的基础上开展崭新的实验。\n\
  \n## 27.7 结论\n发现需要一种更强大的方法在两个或多个站点之间传输敏感信息。量子密钥分发和其他量子加密技术无疑将在未来提高关键数据的安全性。量子加密是迈向我们可能对交换的内容和方式感到更安全的时代迈出的坚有力且令人鼓舞的一步。因此，我们可以预计\
  \ `QKD` 将对基础物理产生深远影响，并为量子力学原理提供新的见解。这种观点可以少那么“哲学化”，更多地“实用”。\n\n## 参考文献\n1. Bhatt,\
