  \ 年 6 月 21 日检索。\n\nNote\n\n1. *通讯作者]: apurvanamdev2001@gmail.com\n\n# 21 量子计算是对网络安全的威胁吗？\n\
  \n**Akshat Maheshwari¹**, Manan Jain¹, Vindhya Tiwari¹, Mandakini Ingle² 和 Ashish\
  \ Chourey³**\n\n*¹印度印多尔，Shri Vaishnav Vidyapeeth Vishwavidyalaya，计算机科学工程系*\n*²印度印多尔，Medicaps\
  \ University，计算机科学与工程系*\n*³印度博帕尔，SIRT，计算机科学与工程系*\n\n## 摘要\n\n为了理解风险以及可以采取的措施，密切关注数字加密及其使用和破解方式至关重要。通过量子加密，消息的发送者或接收者都不会被欺骗而导致系统破解。它最近受到了更多关注，并成为更快速、高效、更安全的通信最有前景的加密领域之一。然而，与今天最先进量子计算机成就相比，未来破解量子计算机将需要\
  \ 10 万倍的处理能力和低 100 倍的错误率。\n\n量子计算（QCom）似乎能够改变许多行业，但网络安全是其到来所面临威胁的领域之一。量子计算（QCom）可能会使传统的加密方法失效。我们尚未完全理解网络安全的危害影响。遗憾的是，量子计算可以在某些特定领域影响网络安全。在开始规划量子安全时，IT\
  \ 战略家应该考虑量子计算对网络安全的影响。他们的长期网络安全计划必须包括使敏感数据、风险管理实践、身份管理系统和关联技术量子化。\n\n**关键词：** 量子密钥分发、密码分析、量子黑客、量子互联网、设备无关加密\n\
  \n### 章节结构\n\n本章其余部分的安排如下：第 1 节是引言，讨论了研究背景，包括量子加密、量子计算、密码学、研究方法和研究目标。第 21.2 节描述了量子计算如何威胁网络安全，以及量子计算可能危及网络安全的领域；第\
  \ 21.3 节描述了量子计算如何改进网络安全、加密技术和隐私保护；第 21.4 节考察了拟议的方法，其中描述了量子对网络安全的威胁和挑战；第 21.5 节描述了研究的背景和目标；第\
  \ 21.6 节是结论并对整个研究进行了简要描述。\n\n## 21.1 引言\n\n大多数现有加密可能会被基于量子物理而非更传统电子设备的新型计算机破解，这也是网络安全研究人员和分析师深感担忧的原因。目前量子计算机无法破解任何广泛使用的加密技术。根据美国科学、工程和医学学院\
  \ 2018 年的研究，要破解长期用于互联网的强效代码，需要巨大的技术改进。量子加密[[1]](#c21.xhtml#ref1)是一种利用量子物理某些固有特性来传输和保护数据，使其无法被破解的加密类型。\n\
  \n使用密钥对数据进行加密和保护允许该密钥的所有者解密，这就是加密的过程。由于物理而非数学是其安全模型的主要组件，量子加密在这方面与传统系统不同[[6]](#c21.xhtml#ref6)。\n\
  \n在消息发送者或接收者不知情的情况下，量子加密是一个完全安全的系统。换句话，在不向传输者或接收者暴露的情况下，无法复制或读取编码在量子态中的数据。量子加密也继续受到量子用户的保护。量子加密利用量子物理的属性以无法被拦截的方式保护和传输数据。\n\
  \n### 21.1.1 网络安全的需求\n\n网络安全[[1]](#c21.xhtml#ref1)包括防止电子通信系统和服务的损害，以及对它们所含数据的防御。维护数据的可用性、机密性、认证性和不可否认性也是其一部分。Cisco\
  \ [1, 2]将其定义为跨系统和网络增加多层保护的实践[[5]](#c21.xhtml#ref5)，以击敏感信息或业务运营的攻击。由于数据的可用导致网络危险剧增，保护个人、商业和政府数据至关重要。网络架构的复杂性[[3]](#c21.xhtml#ref3)、窃听和窃听等网络风险、网络容量的增长，以及对六项安全原则（授权、可用性、隐私、不可否认性[[3]](#c21.xhtml#ref3)、完整性和审计）的违反，可能是主要的安全问题[[6]](#c21.xhtml#ref6)。\n\
  \n\n\n\n正如人们预计的那样，敏感数据泄露的影响可能是巨大的。如果金融交易信息（包括涉及电子商务、银行交易、信用卡处理或股票交易的交易）泄露，公司可能会遭受重大损失。数据安全无疑是目前全球最关注的问题之一。为了通过电子介质安全传输，数据必须进行加密。密码学是加密的底层科学\
  \ [11。\n\n### 21.1.2 什么是量子计算？\n\n本质上，量子计算（`QCom`）利用量子力学的特性执行计算。这与遵循经典物理定律的传统计算机形成对比。\n\
  \n`Qubits` 是量子计算机使用的信息单元 [44, 5]。它们可以处于零和一的叠加态中，也可以处于零或一的状态。相比之下，传统计算机仅使用 0 和 1\
  \ 来存储数据。\n\n由于量子计算机运行基于完全不同的原理，它们具有与传统计算机不同的能力。许多专家预计，它们能够完成传统计算机无法处理的计算和数学问题。尽管这一目标尚未实现，但这种成就被称为量子霸越。\n\
  \n以下是量子计算的一些潜在用途 [6, 7]：\n\n*   模拟复杂的化学过程，可能导致创新和化学领域的进展。\n*   高级金融建模。\n*   以更高的精度预测天气和气候变化。\n\
  *   运行更高级的 AI 应用。\n*   高等物理学中的计算。\n*   提出新的加密系统，并破解目前被认为是安全的加密技术。\n\n### 21.1.3\
  \ 什么是密码学？\n\n一段原始信息 [4]（如消息）通过一个被称为“加密”的过程转换为类似于无意义的内容。现代数字密码 [13] 将明文数据转换为安全加密的通信内容并从中转换\
  \ [12]，以便使用复杂的数学算法 [15] 进行存储或通信。非对称加密（`AE`），也称为公钥加密，使用一对在数学关联的密钥来对消息进行加密和解码。其中一个数学关联的密钥公开发布，允许他人为该密钥对的所有者加密消息。在对称加密中，同一个密钥被用于数据的加密和解密。公钥加密的速度远慢于对称加密。由于如此，它被用于加密保留的所有对话和数据。公钥加密用于安全地传输对称密钥，以及对将公钥与其所有者身份关联起来的消息、文档和证书进行数字身份验证（或签名）。当你访问安全网站（即使用\
  \ `HTTPS` 协议的网站）时，你的浏览器会利用公钥加密来验证网站证书，并创建一个用于加密与网站往来通信的对称密钥。\n\n### 21.1.4 对称加密\n\
  \n对称密钥加密 [14] 通常称为对称加密，是指使用单个秘密密钥对数据进行加密和解密 [15] 的实践。`AE` [17] 使用一个密钥加密而另一个密钥解密，这与此方法形成对比。在这一过程中，数据被转换为一种格式，防止任何无法访问加密所需的秘密密钥的人读取或分析它。由随机数生成器产生的秘密密钥的质量将决定这种方法的成功与。对称密钥加密主要使用\
  \ `Block`（块）和 `Stream`（流）类算法，广泛应用于当前的互联网。两种流行的加密技术是高级加密标准（`AES`） [12] 和数据加密标准（`DES`）\
  \ [13]。虽然对称加密通常更快，但它要求数据发送方和接收方都能访问秘密密钥。非对称加密不依赖秘密密钥的共享，它是 `FIDO` [15, 17–20] 认证系统的基础。图\
  \ 21.1 展示了对称加密。\n\n![图 21.1 对称加密 [1–3].](images/fig21-1.jpg)\n\n图 21.1 对称加密 [1–3]。\n\
  \n### 21.1.5 非对称加密\n\n消息可以使用非对称加密（也称为公钥加密）进行加密和解密，保护其免受未经授权的访问或使用。公钥是一种任何人都可以用于加密通信的加密密钥，只有预期的接收者可以使用其私钥对其进行解码。它使用一对关联的密钥：一个公钥和一个私钥。在发送加密通信内容时，可以从公共目录中获取预期接收者的公钥，并在发送之前对其对消息进行加密。私钥（也称为秘密密钥）仅对密钥起源者可见\
  \ [19, 20]。\n\n![图 21.2 公钥加密 [4–6].](images/fig21-2.jpg)\n\n图 21.2 公钥加密 [4–6]。\n\
  \n通信的接收方随后可以使用其私钥对其进行解密。许多协议，包括安全套层（`SSL`） [12] 和允许 `HTTPS` 的传输层安全（`TLS`）协议，都采用了非对称加密。加密\
  \ [9] 也被用于需要在不安全网络（如网络浏览器）上创建安全连接或验证数字名的软件。非对称加密的主要优点是提高了数据安全性，因为用户无需公开或共享其私钥。这减少了黑客在传输过程中截获用户私钥的可能性。图\
  \ 21.2 展示了公钥加密。\n\n## 21.1.6 经典加密与量子加密\n\n在信息技术时代，安全比以往任何时候都更重要。随着我们的大部分私人数据存储在计算机中，数据安全变得越来越必要。因此，保护敏感数据免受非法访问对于操作系统和用户来说都是至关重要的。防止未经授权的窃取或拦截敏感数据的技术之一就是加密。尽管传统的密码学确实非常复杂，但它正以前所有的编码技术一样被淘汰。量子物理学被用于量子加密以提供安全通信。这使得双方能够创建一个秘密共享随机位串，并将其作为密钥来加密和解码通信。图\
  \ 21.3 展示了经典加密与量子加密。\n\n![图 21.3 经典加密与量子加密 [5, 7, 8].](images/fig21-3.jpg)\n\n\n\
  \n\n\n`图 21.3` 经典加密与量子加密 [5, 7, 8]。\n\n### 21.1.7 量子计算对现有加密的影响\n\n流行的加密技术 [15, 18]\
  \ 包括 `RSA` [16, 18]、`AES`、`ECC`、`Diffie-Hellman` 和 `Blowfish`。微软、诺基亚和思科等公司提供的知名基础设施的基础是\
  \ `Rivest, Shamir, Adleman (RSA)`，这仍然是一个全球标准。高级加密标准 (`AES`) 也以类似的方式为在线通信提供客户端/服务器加密。在物联网（IoT）中，经常采用椭圆曲线加密\
  \ (`ECC`)。用户使用 `Diffie Hellman (DH)` 方法共享密钥，而 `Blowfish` 是一种具有变长密钥的替代策略，可用于 `RSA`\
  \ 和 `DES`。因此，目前我们依赖于使用复杂的数学计算构建加密密钥。密钥越长，数学计算越困难且耗时越长，通过增加解密难度来提高网络安全性。传统计算机无法破解加密系统中使用的某些数学计算。相比之下，未来将不再如此。`Qcom`\
  \ 处理数据的方式从两个不同的步骤变为量子比特。量子并行性是一种属性，允许它同时存在许多相位，并允许在所有量子比特上同时操作 [11]。\n\n### 21.1.8\
  \ 加密并不意味着安全\n\n为了确保个人和社会的全面网络安全，强大的加密至关重要。它是安全数据传输和存储以及系统与人之间建立可靠连接的基础。然而，加密只是宏大整体的一小部分。即使是最强的加密也无法防止他人访问恶意文件或点击电子邮件附件中的欺骗性链接。此外，加密无法阻止内部人员滥用数据访问权限或不可避免的软件故障。即使数学上是不可破解的，加密的应用中也可能存在缺陷。例如，微软最近发现两个应用程序错误地向公众公开了用户的私有加密密钥，导致他们的对话不安全。当或如果引入强大的\
  \ `Qcom`，它将带来严重的安全风险。建议立即开始为抗量子加密做准备，因为建立新标准可能需要多年时间 [2]。\n\n## 21.2 QCom 如何威胁网络安全\n\
  \n我们尚未完全理解 `QCom` 如何影响网络安全。然而，专家们正在讨论两个 `QCom` 可能会危及网络安全的领域。主要的担忧是 `RSA` 加密可能会被量子计算破解。由于其高效性，`Qcom`\
  \ 可能能够更快地解决某些算法，如 `RSA` [6]。它是复杂活动的一个组件。根据 Tech Target 的 Jack Poller 的说法，“保持密钥保密让他人无法解密你的数据基于质数的数学原理；提取密钥需要一个困难的数学问题；如果密钥足够大，在我们有生内不会发生。假设我给你一个足够大的密钥和世界上最大的[经典]计算机，解码仍然需要一辈子的时间，这对你来说毫无价值。有了量子计算，你可以利用特定算法来缩短这段时间。”`Shor’s\
  \ algorithm` 和 `Grover’s algorithm` 是两个可能破解 `RSA` 的量子算法示例。这些量子算法不会立即击败 `RSA`，但它们会逐渐做到。因为它受到旧加密的保护，而量子最终可以破解它，使用当前加密的存储数据将面临最大的危险。\n\
  \nForrester 副总裁兼分析师 Merritt Maxim 表示：“对于人们来说，这是一个相当具有挑战性的概念问题。”作者认为，随着量子技术的日益发展和应用，风险实际上随着时间的推移而增加，这就是量子威胁的所在。Pollerde，利用\
  \ `QCom` 伪装攻击的黑客是网络安全的第二个问题。这些 `Qcom` 可能会表现出传统软件回避的独特特征和签名。Poller 说，第一波攻击“将很难识别”。然而，未来类似的攻击将很快被发现并制止。他继续道\
  \ [6]，“在攻击者和防御者之间，这总是一场猫鼠游戏。”一种名为 `QCom` 的新技术浪潮将引入各种新方法，其中一些方法已知可以击败许多保护我们日常通信的加密系统\
  \ [8]。获得量子计算机访问权的攻击者理论上可能利用它们来破解被认为能够抵抗传统计算攻击的系统，从而获得先前安全数据的访问 [8]。目前对我们最广泛使用的公钥加密系统面临最大危险的是量子计算。一些对称密钥方法也会受到影响，但程度并不显著\
  \ [8]。\n\n## 21.3 QCom 如何改善网络安全\n\n量子计算对网络安全的影响并非都是负面的。根据一些对量子计算持乐观态度的行业人士的说法，加强加密技术和隐私保护是网络安全可能提高的两个领域。隐私增强计算\
  \ (`PEC`) 方法在数据在使用、传输和静态存储时通过保持加密状态来保护数据。根据 Gartner 的《2022 年战略技术趋势》研究，由于云服务商采用可信执行环境以及供应商加强个人安全努力，`PEC`\
  \ 技术已经取得了。竞争对手可以通过 `PEC` 进行协作，同时保持所有信息的隐私。数据隐私的概念仍存在争议。`PEC` 可以帮助解决内部分析和医疗记录安全等用例中的隐私问题。格（或多维代数结构）可用于`同态加密`，而\
  \ `Qcom` 无法轻易破解。专家认为基于格的加密是现有技术的最佳替代方案。根据 Gartner 分析师 Mark Horvath 的说法，“选择一个要加密的数字，让软件运行加密后的数字直到返回结果，然后应用某些解密来解锁，这就是格允许你完成的操作。”由于同态加密的数学原理，这可以在不需要解码或读取数据的情况下进行计算。\n\
  \n## 21.4 量子加密及其应用\n\n使用公钥基础设施，用户可以在互联网等不安全的网络中获得发送和接收私有数据的方法。PKI 主要使用两个密钥，用户（Bob）将使用公钥（一种公开的密钥）加密数据，而使用\
  \ Alice（接收者）公钥加密的数据将由 Alice 使用其私钥解密并传递到目标密钥，如`图 21.4` 所示。\n\n\n\n\n\n换句话说，仅获取公钥并不能让攻击者解密信息，因为这需要私钥。黑客们测试了在此时阶段利用公钥提取私钥的可行性。由于使用公钥寻找私钥需要复杂的数学计算，由于我们传统计算机处理能力的限制，目前无法做到这一点。\n\
  \n![图 21.4 运行中的公钥加密 [1, 2, 6–8]。](images/fig21-4.jpg)\n\n图 21.4 运行中的公钥加密 [1, 2,\
  \ 6–8]。\n\n然而，由于量子计算机惊人的计算速度和`Shor’s Algorithm`的使用，同样的情况也是可行的。量子密钥分发（QKD）是处理此类情况的答案。QKD\
  \ 的目的仅仅是向发送者和接收者生成并分配密钥，因此它可以与传统的通信方法相结合。\n\n一旦获得密钥，发送者和接收者就可以使用它来加密和解密密文。根据不可克隆定理，量子态永远无法被复制（该定理指出构建任何任意未知量子态的精确复制是不可能的），这使得量子加密协议成为不可破解的密钥分发系统。这确保了在发生中间人\
  \ [MitM] 攻击时，发送者和接收者可能收到的量子态将是不同的。如果发生这种情况，解密将失败，从而提醒发送者和接收者信道是不安全的。\n\n## 21.5\
  \ 建议的方法论\n\n传统计算机无法理解的复杂问题将可以通过量子计算机来解决。这涉及破译保护我们数据和互联网技术基础设施的加密密钥的底层算法。现代加密很大程度上依赖于从数学角度来看计算机难以有效破密的计算\
  \ [11]。为了进一步理解这一点，请思考将两个巨大的数字相乘。计算乘积是简单直观的，但从一个大整数开始将其分解为两个质数要挑战性得多。量子计算机 [15] 能够瞬间将这些数字分解为代码并进行解密。由\
  \ Peter Shor 创建的`Shor’s algorithm` 是一种量子技术，它比传统计算机快得多地计算大数字。从那时起，科学家一直致力于开发具有扩展分解能力的量子计算机\
  \ [7]。\n\n### 21.5.1 量子对网络安全的威胁\n\n网络安全负面影响的完整范围仍然未知。不过，量子计算（QCom）会在几个特定领域影响网络安全。破解\
  \ RSA 加密就是之一。RSA 加密技术经常用于通过互联网传输敏感信息，基于 2048 位数字。根据该领域专介绍，量子计算机需要 700 万个量子比特才能解密数据。由于目前只有一台具有\
  \ 53 个量子比特的量子计算机，解密数据可能需要一段时间。\n\n然而，考虑到企业发展之快，在未来十年内出现第一量子计算机是不可能的。利用 QCom 执行秘密网络攻击的威胁者是量子计算网络安全的另一个问题。今天大多数软件无法识别来自量子计算的这些各种行为和特征\
  \ [9]。\n\n现在采取行动的另一个原因：刮取威胁 - 尽管量子计算机目前已经商用，但恶意行为者仍有可能刮取抗量子数据。为了在能够获得量子计算机进行解密之前保留这些数据，他们已经开始窃取这些数据。在那个时刻，信息就已经被泄露了。只有现在使用抗量子系统，才能确保信息安全，特别是对于那些在可预未来必须保护的信息\
  \ [10]。\n\n### 21.5.2 QCom\n\nQCom 指利用量子信息科学来执行计算。量子计算机可以用来描述此类设备。QCom 设备可以以非常复杂的方式分类。为了本报告的目的，我们将分类简化如下：\n\
  \n*   以下是数字量子计算机（通用的、可编程的能够执行任何量子算法）的应用列表，内容非常广泛。基于门的量子计算机可以被经典计算机完美模拟。资源和速度是不同的。例如，全纠缠量子比特的模拟会指数级增加对传统资源的需求。这意味着在传统（超级）计算机上模拟\
  \ 45 个量子比特本质上是不可能的。\n\n*   量子退火通常用于实现模拟量子计算机。由于量子比特的连通性限制和不同的运行原理，量子退火器与数字量子计算机不同。因此，模拟量子计算机的使用更加有限，但对于量子优化或基于哈密顿量的模拟的任务仍然适用。\n\
  \n*   量子模拟器通常被设计为单一用途设备，用于建模和研究通常难以获取的其他量子系统。量子模拟器可以被认为是非编程的量子电路，相对于量子计算机。\n\n总来说，经典计算将与量子计算并存。只有一小部分问题（通常是高复杂度的问题）对于量子计算机是可行且有益的。量子比特的质量（相干性、抗性、门完整性）和数量决定了\
  \ QCom 应用的实际实现。量子比特的数量、量子比特相干时间、量子门保真度和量子比特互连性是需要考虑的几个关键变量。量子电路是应用于不同量子比特的量子门的量子指令集合。量子算法实际实现在量子电路中\
  \ [12, 13]。\n\n### 21.5.3 QCom 挑战\n\n\n\n\n网络安全预计将因量子计算而发生变化；然而，仍有许多问题需要解决，并且仍需要重要的进展。最紧迫的问题是找到足够的容错比特以实现量子计算的处理潜力。亚马逊、`Google`、`Honeywell`、`IBM`\
  \ 以及其他企业正在投入这一问题进行投资。目前使用不同的量子逻辑门来编程量子计算机；虽然这对于较小的量子计算机可能有效，但随着比特数量的增加，它变得不切实际。`IBM`\
  \ 等企业正在开发编程栈中更抽象的层级 [19] 和 `Classiq` [20]，使程序员能够创建强大的量子应用程序来解决现实世界的问题。`QCom` 领域技能短缺可能是主要的挑战。尽管大学培养的计算机毕业生比以往任何时候都多，但为下一代\
  \ `QCom` 专家做的准备还不多。美国《国家量子倡议法案》为教育项目提供资金支持，这是正确道路的一步。`QCom` 还催生了一些惊人的开源社区，其中 `IBM\
  \ Qiskit` [20] 社区是最活力和引人入胜的。政府、学院、企业和更大的技术生态系统需要通力合作，培养从量子计算中充分受益的人才储备 [10]。\n\n\
  ## 21.6 背景/目标\n\n从传统计算到 `QCom` 的转变为加密社区带来了新的困难。在量子计算中，确保不可破解性的加密技术面临着巨大的挑战。方法/统计分析：量子加密可以利用物理学原理在不受限制的情况下进行安全通信。发现：现有的加密（传统加密）完全取决于数学概念的复杂程度。现代加密（通常称为椭圆曲线加密）被广泛用于安全交易。得益于\
  \ `QCom` 的进展，这种安全性可以被传统计算机更快地破解 [5]。\n\n## 21.7 结论\n\n在过去的几年里，研究人员投入了精力创建“量子安全”加密。对于所谓的“后量子密码学\
  \ (PQC)”，美国国家标准与技术研究院（NIST）正在审查若干种潜在的新程序。关于 `QCom` 的许多问题仍未得到解答，但研究人员正在努力寻找解决方案。`QCom`\
  \ 无疑会对网络安全和我们的加密技术产生不利影响，这是显而易见的。如果我们想减少这种风险，必须改变我们保护数据的方式。我们必须采用多层量子安全的深度防御策略来应对量子危险。具有安全意识的企业正在寻求多样化的解决方案，使加密达到量子安全，以应对未来的威胁\
  \ [7]。IT 主管应该转向后量子密码学，因为它们是为了生存量子技术而设计的。例如，基于格的加密和 `AES-256` 被广泛认为是抗量子技术。为了从经典加密到抗量子加密的过渡，加密捷性也是必要的。为了适应不断变化的环境，组织应该准备好接受并开发新的加密解决方案。`QCom`\
  \ 可能在未来 10 年内用于盈利目的，这可能会对网络安全产生重大影响 [9]。\n\n显然，从传统计算机到量子计算机的转变需要时间。根据预测，某些领域将同时使用两种技术而不是相互替代。在量子计算机增强传统力量期间，现代加密技术将继续使用。`QCom`\
  \ 科学家破解当前加密和存储数据的能力仍是推测性的，根据《科学美国人》的文章，其力量不足以破解广泛使用的加密技术。此外，根据国家科学院的说法，当代量子计算机在使用当前代码时容易出错。制造商和开发者仍然需要技术进展来成功破解广泛使用的代码。对网络安全感兴趣的人\
  \ [10]。\n\n## 参考文献\n\n1. Grasselli, F. (2021). Quantum cryptography. *Quantum science\
