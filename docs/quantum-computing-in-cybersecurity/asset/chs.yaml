  \ 开发一个项目，以满足卫星与宇航员之间安全通信的需求。该项目的目标是开发一种无论对手拥有什么工具或信息都能确保通信安全的协议。项目还包含了对“静态”数据和传输中数据的保护要求。从长期来看，这将提高宇航员在轨道上的安全性，理想情况下减少对微小速度提升之外进一步改进的需求\
