  \ 拒绝服务 |\n| 2. | Saxena and Gayathri (2021) | 钓鱼 |\n| 3. | Huang *et al.* (2020)\
  \ | 恶意软件 |\n\n![图 29.3 使用暴力破解攻击方法解密每个算法所需的理想时间 [6, 7, 12, 13]。](images/fig29-3.jpg)\n\
  \n图 29.3 使用暴力破解攻击方法解密每个算法所需的理想时间 [6, 7, 12, 13]。\n\n## 29.4 提出的方法\n\n用于量子计算的量子安全攻击改进：\n\
  * Shor 算法\n* 量子密码学\n* 抗量子密码学\n\n今天主要使用两种类型的数字加密：\n\n### 1.1. 对称加密\n对称加密是一种加密方式，使用单一密钥（秘密密钥）来加密和解密数字记录。通过对称加密通信的实体应该更改该密钥，以便在内部解密过程中可以使用。这种加密技术与非对称加密不同，后者使用一对密钥——一个公钥和一个私钥——来加密和解密消息。\n\
  \n通过使用对称加密算法，记录会被“打乱”，使得那些不再拥有解密所需的密钥名称的人无法理解它。一旦拥有该密钥的预期接收者获得了消息，规则集就会反向执行操作，使消息恢复到原始的可读形式。发送者和接收者各使用的秘密密钥可能是特定的密码/代码，也可能是通过稳定的随机数生成器\
  \ (RNG) 生成的随机字母数字字符串 [14, 15]。对于银行级加密，对称密钥应使用符合企业标准的许可级 RNG 创建。\n\n虽然对称加密是一种较老的加密方法，但它比非对称加密快得多且更环保，后者由于统计长度的整体性能问题和高\
  \ CPU 使用率，会对网络造成负担。由于对称加密具有更高的整体性能和更快的速度（与非对称加密相比），对称密码学通常用于批量加密/加密大量数据，例如数据库加密。在数据库的情况下，密钥名称可能直接由数据库所有以进行加密或解密。与（写作时）非对称算法的尖端\
  \ 1 需求相比，行业广泛采用的对称加密在很大程度上也不容易受到量子计算进展的影响。\n\n### 1.2. 非对称（公钥）加密\n公开的密钥为拥有私钥进行解密的的接收者加密消息。RSA\
  \ 和椭圆曲线加密等公钥密码学方法使用陷门函数来创建密钥，这些密钥在一个方向上很容易计算，但对于经典计算机很难反转。非对称 12 也称为公钥加密，是一种使用一对密钥——一个公钥和一个私钥的方法。非公密钥——也称为密钥——与密钥最有效地共享。当一个人想要发送加密消息时，他们可以从公开列表中提取预期接收者的公钥并使用它来加密消息\
  \ [14–18]。如果发送者通过其非公密钥加密消息，则可以使用公钥最有效地解密。许多协议 [3, 4] 依赖于非对称加密，包括传输层安全 (TLS) 和安全套字层\
  \ (SSL) 协议，这些使得 HTTPS 成为可能。图 29.4 显示了公钥加密的应用。图 29.5 显示了使用量子密钥分发 (QKD) 和经典协议的整个通信过程。图\
  \ 29.6 显示了黑客尝试使用带有 Shor 算法的量子计算设置获取私钥 [15, 16]。\n\n\n\n\n\n![图 29.7 黑客尝试使用带有 Shor\
  \ 算法的量子计算设置检索私钥 [6]。](images/fig29-7.jpg)\n\n图 29.7 黑客尝试使用带有 Shor 算法的量子计算设置检索私钥\
  \ [[6]](#c29.xhtml#ref6)。\n\n### 29.4.1 对关键基础设施构成的威胁及机制\n\n暴力破解被认为是破解密码和实施密码学分析的有效技术之一\
  \ [5, 6]。典型的暴力破解算法会尝试所有可能的组合，以找出正确的组合来攻入系统或软件。然而，暴力破解是黑客攻击最慢的方法之一，因为我们传统的处理器或集群计算技术无法加速这些操作。而现在，由于量子处理器的出现，在破解关键信息系统方面，暴力破解现在可能成为最有效的方法之一。由于量子计算（QC）对关键基础设施和通信通道可能引入的一些未来威胁列如下：\n\
  \n1. **现有安全通信的泄露**\n   通道：如果黑客能够访问每秒处理 1000 万比特的量子处理引擎，那么破解军事或金融机构用于传输关键数据的安全端到端数据加密通道将变得非常容易。目前的加密机制是根据被破解所需的时间被定义为安全的。一些常用算法包括\
  \ `RSA` 和 `AES` 算法，这些算法声称，如果使用暴力破解技术破解相同内容，使用传统超级计算机需要数年才能破解代码。然而，使用具有量子能力的系统，可以在几秒钟内破解。因此，如果入侵者能够对安全通道实施“中间人”攻击，他就可以嗅探并收集数据，并同时进行解密，从而导致数据机密性泄露。\n\
  \n2. **使用量子技术破解加密驱动器**\n   密码学分析：许多公司将数据存储在海外数据场所，其安全性通过“静态数据”加密算法来维护。如果利用量子能力来解密存储在海外服务器上的包含关键信息的加密数据，将成为一项轻而易的任务。\n\
  \n3. **基于 AI 的自主无人爆炸物**\n   目标检测、实时轨迹识别和目标跟踪机制：随着 AI 的演进及其识别实时轨迹、目标检测和识别的能力，很有可能开发出无人炸弹，这种炸弹可以轻松绕过大多数现有的安全机制，如\
  \ `RADAR/SONAR` 传感器、运动检测器、热传感器等。图 29.8 显示了量子密钥分发服务器设置 [[6]](#c29.xhtml#ref6)。\n\n\
  ![图 29.8 量子密钥分发服务器设置 [6]。](images/fig29-8.jpg)\n\n图 29.8 量子密钥分发服务器设置 [[6]](#c29.xhtml#ref6)。\n\
  \n### 29.5 结论\n\n我们不应该等到出现问题才行动，因为用于研究 QC 的资源或资金不多，也没有许多商用设备。出于其他原因，我们也必须始终从安全角度来设计和构建量子硬件和代码组件。此外，类似的服务在外观上也应该发生变化。QC\
