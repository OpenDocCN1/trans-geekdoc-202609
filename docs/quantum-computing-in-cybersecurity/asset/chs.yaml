  \ 15.2(f)` 显示了之前的层被删除，下一层的量子比特已连接。\n\n![图 15.2 经典与量子学习的示意图 \\6–12\\\n\n`图 15.2`\
  \ 经典与量子学习的示意图 `[[6–12]]`。\n\n### 量子感知机模型 `[[13\\]](#c15.xhtml#ref13)`\n\n关于量子神经元（或“感知机”）的早期研究主要关注使用量子系统模拟经典感知机的非线性，而量子系统表现出线性演化。更近期的理论（例如\
  \ `Figure 15.2(c)`）显示量子感知机能够处理二值和灰度图像的基础识别任务，并可能采用变分方法进行训练和发现自适应电路实现。量子 ANN 模型也通过连接许多量子比特在超导设备的概念测试上实现\
  \ `[[4\\]](#c15.xhtml#ref4)]`。\n\n### 核方法 `[7, 8, 16]`\n\n核方法直接继承自其经典对应，依赖于将输入数据转换为高维空间以执行在原始低维形式下无法完成的分类任务。任何两个数据向量\
  \ `x, x 0 X` 经常被编码为量子态 `|(x)i, ||(x 0)i`，使用编码映射 `X H`，其中 `H` 代表量子寄存器的希伯特空间。在不断变化的希伯特空间中评估时，内积\
  \ `h(x)|(x 0)i` 定义了用于分类的相似性量。在训练数据集上构建的矩阵 `Kij = hφ(xi)|φ(xj )i` 被称为核，可以与经典方法一起使用，如图形\
  \ Figure 15.2](#c15.xhtml#fig15-1)` 图形所示，支持向量机（SVM）用于执行分类或回归任务（d）。此类量子 SVM 具有创建传统方法难以计算的核函数的潜力，可能在分类上产生量子优势\
  \ `[[4\\]](#c15.xhtml#ref4)`。\n\n\n\n\n\n生成模型是一种概率算法，其目标是在给定训练集 `T = {xi | xi \\\
  sim pX, i = 1, . . . , M}` 的情况下，在空间 `X` 上复制未知的概率分布 `pX`。使用被称为玻尔兹曼机（BMs）的概率神经网络（NNs）是处理这一任务的常用传统方法，这种技术受物理启发，类似于伊森模型。量子玻尔兹曼机（QBMs）致力于量子和经典分布的生成式学习，可以通过将经典节点替换为量子比特并将能量函数替换为量子哈密顿量来定义。生成对抗网络（GANs）作为生成建模的一种新颖且出奇地强大的传统工具。在这种情况下，两个名为`generator`（生成器）和`discriminator`（判别器）的独特神经网络被设计为相互竞争，并赋予执行生成过程的任务。`generator`\
  \ 通过彻底且迭代的学习过程创建高质量的新样本，最终欺骗`discriminator`。量子生成对抗网络（QGANs）模型（其中`generator`和`discriminator`\
  \ 为量子神经网络 QNNs）的发展，通过向量子领域的简单转换成为可能。即使不是受任何经典神经网络模型的启发，波恩机（Born machines）也值得提及，其中生成新数据的概率遵循由波恩规则代表的量子力学固有的概率本质。\n\
  \n### d. 量子卷积神经网络\n\n顾名思，这些模型基于其经典对应物，这些模型在当今图像处理领域仍被广泛使用。这些网络（如图 15.2(e) 所示）通过一系列所谓的卷积层和池化层反复处理输入。前者对输入进行卷积——即一种平移不变的准局部变换，以提取某些相关数据；后者在低维表示中对此类信息进行压缩。经过许多轮迭代后，网络会产生一个具有启发性且维度足够低的表示，可以使用常用方法（如全连接前馈神经网络）进行检查。与此类似，在量子卷积神经网络中，量子状态首先通过卷积层，该层涉及作用于量子比特特定子集的参数化正正操作，随后是通过测量某些量子比特实现的池化方法。这一过程持续，直到只剩下少数存储了所有相关数据的量子比特。对于量子相位识别和量子纠错等真正的量子任务，这种技术已被证明非常有用。此外，为了在未来的设备上实现高效训练和成功实施，仅使用相对于量子比特数量呈对数增长的参数至关重要。\n\
  \n### e. 量子耗散神经网络\n\n在描述的耗散量子神经网络中，每个量子比特充当一个节点，连接不同层量子比特的边代表在它们上执行的通用正交操作。当一层量子比特与下一层交互后，顺序丢弃量子比特层，这就是“耗散”一词的含义（示意示例，请见图\
  \ 15.2(f)）。该模型能够通过应用和学习通用量子变换来执行通用量子计算。它配备了类似于反向传播的训练算法，代表了用于分析量子数据的深度神经网络量子类比实现的潜在路径。\n\
  \n## 15.4 建议的方法论\n\n在讨论 QC ANN 之前，让我们先考虑传统的 ANN（人工神经网络）（人工神经网络的 QC 方法）。在 ANN 中，`N`\
  \ 维数据被投影到从输入层的节点上，输入层被称为人工神经元。这些神经元通过连接与隐藏层节点连接，这些连接具有可以改进的权重。加权连接再次将中间层节点连接到输出层。最后，使用激活函数获取网络的输出结果。实际输出与预期输出之间的损失列在后续步骤中。使用反向传播来优化限制变量，直到实际输出与预期输出结果之间的差异尽可能小。在训练过程中，不断考虑数据集的大小和输入维度。为了避免模型的过拟合或欠拟合，训练\
  \ ANN 至关重要，这涉及通过调整超参数（如网络深度和宽度参数）来优化网络的边界变量。随着数据量和维度的增加，训练任务变得更加困难，因为需要优化的变量更多，这需要大量的枚举。QC\
  \ 有潜力执行传统计算机上难以完成的此类挑战性和复杂任务。量子比特用于修复传统 ANN 输入层中的人工神经元。量子比特也被称为量子位。图 15.3 显示了使用混合量子经典计算并将量子比特作为网络节点的\
  \ QC ANN。\n\n`N`-维输入数据被编码为具有 `2k` 个状态叠加的量子态，其中 `k` 是量子比特的数量。在状态制备过程中使用振幅嵌入方案。\n\n\
  隐藏层：纠缠和量子比特旋转，由量子比特之间作为纠缠作用的连接组成。使用具有特定旋转变量的门来修改量子比特的状态。最后，量子比特处于输出结果值的稳定状态。对实际输出值与预期值进行比较，并优化门的旋转边界变量，直到测量结果与预测输出匹配。短期量子计算机和单比特门旋转变量的优化都可以使用传统设备执行所有量子操作。这种用于二分类问题的混合策略结合了传统计算机和量子计算机的使用。\n\
  \n![图 15.3 使用混合量子经典计算并将量子比特作为网络节点的 QC ANN [5, 13–16]。](images/fig15-3.jpg)\n\n**图\
  \ 15.3** 使用混合量子经典计算并将量子比特作为网络节点的 QC ANN [5, 13–16]。\n\n\n\n\n\nQC ANN（量子神经网络）在量子计算机电路上的实现与传统\
  \ ANN 的学习过程不同 [16–19]。由于状态构建程序，输入数据可能会被加密到量子比特上。换句话说，输入数据以多个状态的叠加振幅的形式呈现。量子比特现在相互纠缠，改变一个量子比特的状态会影响其他量子比特的行为。随后添加允许跨隐藏层进行单量子比特旋转的门，从而改变量子态。耦合层中的每个量子比特都通过量子门旋转，这改变了平台的状态。通过测量预期量子比特的状态获得一个值，然后将其与目标值比较以确定损失。在量子系统达到目标量子比特在测量时产生适当输出值之前，旋转边界变量会不断调整。在此背景下，学习过程是指量子电路通过门旋转参数来学习输入和输出之间的复杂关系，这些参数会改变量子系统的状态。因此，该学习过程与传统\
  \ ANN 完全不同 [[5]](#c15.xhtml#ref5)。\n\nQC ANN 的优势在于：\n\n1. 使用 `k` 个量子比特通过状态叠加的形式，将输入数据的\
  \ `2k` 个属性编码到量子计算机中。考虑一个具有值 `x1`, `x2`, `x3`,..., x32` 的 32 位归一化输入数据实例。使用五个量子比特，输入数据现在可以使用振幅嵌入法编码为具有多个状态叠加的量子态，例如\
  \ `x1 |0000+ x2 |00001, x3 |00010+,..., +x32 |11111`。\n2. 通过使用量子比特作为人工神经元，避免像传统\
  \ ANN 那样在隐藏层中使用神经元。由于层之间缺乏连接，必须优化限制变量的大小减少了。\n3. 量子测量本身可以作为计算高效的激活参数。\n\n![图 15.4\
  \ 使用 NM 的经典 ANN 和 QC ANN 的成本与训练步骤数 [5, 17–19]。](images/fig15-4.jpg)\n\n图 15.4 使用\
  \ NM 的经典 ANN 和 QC ANN 的成本与训练步骤数 [[5]](#c15.xhtml#ref5), 17–19]。\n\n## 15.5 结果与分析\n\
  \n成本因子基于均方偏差。QC ANN 的成本曲线过渡平滑，证明该模型可以有效泛化数据属性并从数据中学习特征。然而，当利用 Adam 的 QC ANN 与传统\
  \ ANN 比较时，后者的训练成本低得多，这表明调整超参数是创建人工神经网络的关键步骤。\n\n我们可以看到，尽管教学参数较少，但得益于高训练准确率和验证准确率，QC\
  \ ANN 的表现依然非常出色。因此，我们可以利用量子计算机有效地训练 ANN。图 15.4 显示了使用 NM 的经典 ANN 和 QC ANN 的成本与训练步骤数\
  \ [[5]](#c15.xhtml#ref5)。\n\n## 15.6 结论\n\n近年来，学术界和工业界的争论在很大程度上都集中在人工智能上，特别是与机器学习和神经网络方法相关的内容。尽管这些算法在经过适当训练以解决特定问题时表现出了惊人的泛化能力，但这些算法如何以及为何这样运行一直让全世界的学者感到困惑。尽管结果惊人，这些算法将永远、始终地受限于对现实世界的传统认知。\n\
  \n另一方面，量子计算可能会突破这一限制，并利用叠加和纠缠等量子相关现象。尽管它们仍处于起步阶段，但量子技术为传统计算方法提供了一种新颖且引人入胜的方案，它们可能很快实现实用的量子优势地位。\n\
  \n这些因素促使我们编写了这项综述，我们希望这能为初学者和知识更丰富的读者对量子计算领域的许多基础问题提供见解，包括量子比特、`Gate Model`（门模型）以及绝热量子计算范式等。此外，由于文献缺乏对量子感知器和量子神经网络最新进展的详尽处理，我们汇编、检查并讨论了与这些主题相关的前沿方法。我们的研究表明，量子神经网络和算法整体上距离彻底优于传统模型还有很长的路。这种目标被提得过于频繁。然而，探索仍在继续。目前尚不量子设备是否会取代传统芯片成为新一代个人电脑的大脑。然而，由于近期量子硬件和算法的进步，量子世界现在已触手可及。这一新领域的特征是直到上世纪完全未闻过的现象\
  \ [[6]](#c15.xhtml#ref6)。\n\n量子计算机能够处理许多传统计算机具有挑战性的各种复杂问题。在本研究中，我们证明了在量子计算机上训练 ANN\
  \ 的 QC 方法优于经典 ANN。为了学习数据中复杂的非线性模式，QC ANN 仅使用了少量参数。因此它在计算上是高效的。用于图像分类的深度神经网络模型也可以使用本研究中的相同训练方法。由于我们只需要\
  \ `k` 个量子比特就可以表示经典数据的 `2k` 个输入值，利用量子计算机训练深度神经网络的方法也被认为在空间上是高效的。因此，我们可以在使用更少参数和更少量子比特的情况下获得良好的结果。该项目的未来工作将研究在处理更大、更多维度的数据集时\
  \ QC 对深度学习的益处 [[5]](#c15.xhtml#ref5)。\n\n## 术语表\n\n| 缩写 |  |\n| --- | --- |\n| QC\
  \ | Quantum Computing (量子计算) |\n| ANN | Artificial Neural Network (人工神经网络) |\n|\
  \ NN | Neural Network (神经网络) |\n| ML | Machine Learning (机器学习) |\n| Qubit | Quantum\
  \ Bits (量子比特) |\n| GAN | Generative Adversarial Networks (生成对抗网络) |\n\n## 参考文献\n\
