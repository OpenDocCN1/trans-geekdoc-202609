  \ and Privacy Aspects of Blockchain Technologies from Smart Era’: The Challenges\
  \ and a Way Forward”, in *Recent Trends in Blockchain for Information Security and\
  \ Privacy*, CRC Press, 2021.\n\n---\n\n# 14 量子计算：软件工程方法\n\n**Mradul Agrawal, Aviral\
  \ Jain, Rudraksh Thorat 和 Shivam Sharma**\n\n*印度 Shri Vaishnav Vidyeth Vishwavidyalaya\
  \ 计算机科学工程系*\n\n## 摘要\n\n量子计算（QC）以及在更大程度上量子技术正在改变世界。事实上，量子计算并不是计算机科学的进步，而是一场从根本上改变范式的革命。通过基于量子物理概念如聚合和相干，量子计算机寻求指数级提升计算能力。量子计算很可能解决以前认为不可逾越的问题。事实是，由于其广阔的应用，量子计算正影响着大多数行业和科学领域。为了让这些应用成为现实，需要针对这些完全不同的机器专门编写量子算法。尽管已经有一些著名的量子算法，但未来几年对量子软件的需求将激增。在这种情况下，需要以更工业化和受控的方式生成量子软件，并考虑质量、交付、项目管理或量子软件演进等因素。我们坚信，新的软件将主要由量子计算驱动。\n\
  \n**关键词：** 量子计算、量子软件、量子软件工程、算法、管理、设计、语言\n\n## 14.1 引言\n\n当第一台计算机在 20 世纪 60 年代被创造时，它需要整个房间的空间并需要几位科学家来运行。谁能想到五十年后，一台手掌大小机器就能完成同样的工作呢？\n\
  \n\n\n\n传统计算机的基础单元[1, 2]——半导体（它取代了原始“图灵机”的开关和点击器）已对技术做出了最后的贡献。如今的半导体在宏观上已经缩小得非常小，没有足够的空间让运行计算机的电路来处理和扩展其活动以进行进一步的处理和输出[3,\
  \ 4]。由于数据的快速增长，传统计算机系统的处理速度已经恶化。经典计算的工作方式是：向系统提供输入，以便其发现解决方案。如果不提供输入，传统的计算方法无法提供解决方案。我们现在处于一个瓶颈，这意味着每秒都有海量数据涌入，而我们不确定如何妥善有效地处理它们。计算机必须反向查询以获得答案，以便最有效地利用数据。量子计算机可以解决全球变暖和资源合理利用等问题，以此拯救人类。\n\
  \n量子计算（QC）是一项尖技术，可以为我们的处理和通信提供额外的动力。将量子计算与传统计算相比，其基础构建组件是不同的。被称为“量子计算”（QC）的信息处理利用了量子力学的叠加和纠缠概念。传统计算机利用`0`和`1`位从发送者向接收者传递数据，而量子计算机使用`q-bits`。这就是量子计算机与经典计算机之处。叠加是量子计算机使用的一种量子力学现象。单个量子比特在叠加态中同时显示`0`和`1`的概率状态[5,\
  \ 6]。\n\n### 本章结构\n\n本章的其余部分如下：第 14.2 节展示了研究领域的背景；第 14.3 节讨论了为什么需要加密？；第 14.4 节关于经典密码学。第\
  \ 14.5 节讨论了量子加密，随后是量子密钥分发（第 14.6 节）、密码学分析（第 14.7 节）、纠缠（第 14.8 节）、量子隐形传态（第 14.9 节）、量子加密在网络安全中的应用（第\
  \ 14.10 节）、量子密钥分发协议的实现（第 14.11 节）、研究与工作（第 12 节）、量子计算面临的挑战（第 13 节）以及局限性（第 14 节）。第\
  \ 15 节总结了本章。\n\n## 14.2 研究领域的背景\n\n截至 2020 年，量子计算机的发展仍处于早期阶段。IBM [7, 8] 创建了一台规模适中的\
  \ 20 q-bit 量子计算机，可以通过在线访问。IBM 还在致力于开发即将发布的 53 q-bit 量子计算机。与传统计算机相比，量子计算机可以更有效、更快地处理任务。它提供了巨大的计算能力来处理如因数分解和优化等传统计算机无法完成的问题[[9]](#c14.xhtml#ref9)。\n\
  \n量子力学或量子物理学的规则支配着量子计算机中的数据操作。量子计算机是最强大且最难构造的计算机，具有 100 个比特的容量。我们可以利用它进行加密、分析数据并生成复杂的结构[[10]](#c14.xhtml#ref10)。\n\
  \n## 14.3 为什么需要加密？\n\n经典计算的工作方式是：向系统提供输入，以便其发现解决方案。数据泄露在绝大多数情况下是由于未经授权的访问[11]。\n\
  \n传统的计算方法在不提供输入时无法提供解决方案。我们现在处于一个瓶颈，这意味着每秒都有海量数据涌入，而我们不确定如何妥善有效地处理它们。计算机必须反向查询以获得答案，以便最有效地利用数据。加密有助于在网络中提供通信[12]。\n\
  \n量子计算机可以解决全球变暖和资源合理利用等问题，以此拯救人类。\n\n量子计算（QC）是一项尖端技术，可以为我们的处理和通信提供额外的动力。将量子计算与传统计算相比，其基础构建组件是不同的。被称为“量子计算”（QC）的信息处理利用了量子力学的叠加和纠缠概念。传统计算机利用`0`和`1`位从发送者向接收者传递数据，而量子计算机使用`q-bits`。这就是量子计算机与经典计算机之处。叠加是量子计算机使用的一种量子力学现象。单个量子比特在叠加态中同时显示`0`和`1`的概率状态[5,\
  \ 6]。\n\n数据泄露在绝大多数情况下是由于未经授权的访问[11]。\n\n根据安全调查，自 2014 年以来数据泄露增加了三分[13]。\n\n数据泄露在绝大多数情况下是由于未经授权的访问访问[11]。\n\
  \n根据安全调查，自 2014 年以来数据泄露增加了三分[13]。\n\n加密有助于在网络中提供通信[12]。\n\n加密最早的记录可以追溯到公元 1900 年，当时埃及书记员使用象形文字。加密是使用秘密代码的研究，是一门古老的艺术。一些学者认为，加密是在文字发明后不久意外发展的，用途从外交信件到战争准备不等。因此，在计算机网络广泛使用后出现新的加密类型并不意外。在任何不可信的通道上，加密都是必要的。\n\
  \n### 14.3.1 应用间通信\n\n在任何应用间通信[14–19]的背景下，有一些特定的安全需求，包括：\n\n1. 身份验证：证明自己身份的过程。（目前互联网上主要的主机间身份验证是基于名称或基于地址的，这两者都是极其脆弱的。）\n\
  2. 隐私性/机密性：确保除了目标接收者外，没有人可以阅读消息。\n3. 完整性：确保接收者收到的消息与原始消息相比没有任何更改。\n4. 非否认性：一种证明发送者确实发送了此消息的机制。\n\
  \n因此，加密不仅保护数据不被盗取或篡改，还可以用于用户验证。通常有三种类型的加密方案用于实现这些目标：密钥（对称）加密、公钥（非对称）加密和哈希函数，每种方案下文都有描述。在所有情况下，初始的未加密数据被称为明文。它被加密成密文，密文随后（通常）会被解密为可用的明文。\n\
  \n密钥加密方案通常被分为流加密或块加密。流加密每次处理一个比特位（字节或计算机字），并实施某种形式的反馈机制，使密钥不断变化。块加密之所以得名，是因为该方案每次使用相同的密钥加密一个块数据。通常情况下，在块加密中使用相同密钥时，相同的明文块会加密成相同的密文，而在流加密中，相同的明文会加密成不同的密文。\n\
  \n\n\n有很多不同类型的流密码，但有两种在本次讨论中脱颖而出。在自同步流密码中，密钥流中的每个比特都是作为密钥流之前比特位数的函数计算的。由于解密过程只需要知道\
  \ `n-bit` 密钥流进行到什么位置就能跟上加密过程，因此被描述为“自同步”。错误传播是一个问题；如果传输过程中某一个比特发生损坏，那么在接收时会有更多比特位被破坏。同步流密码在发送端和接收端使用相同的密钥流生成函数，但它们独立独立于消息流而产生密钥流。尽管流密码不会扩散传输故障，但由于其固有的周期性，密钥流最终将会循环出现。\n\
  \n### 14.3.2 分组密码的模式\n\n分组密码 \\[20–24\\]可以以多种模式运行，但以下四种是最关键的。\n\n1.  电子代码本（ECB）模式是最简单、最直接的实现；使用密钥对明文块进行加密以生成密文块。因此，两个相同的明文块始终会产生相同的密文块。虽然这是最典型的分组密码模式，但有几种暴力破解技术可以对其进行攻击。\n\
  \n2.  密文分组链（CBC）模式通过反馈机制增强了加密算法。在 `CBC` 加密之前，明文与前一个密文块进行异或（`XORed`）运算。在这种模式下，两个相同的明文块永远不会生成相同的密文。\n\
  \n3.  密文反馈（CFB）模式是一种实现分组密码的自同步流密码。在某些应用中（如加密交互式终端输入），CFB 模式以比块更小的单位加密数据的能力可能具有优势。例如，如果我们使用\
  \ `1-byte CFB mode`，则每个进入的字符都将被放入一个与块大小相同的移位寄存器中进行加密，然后通过网络发送该块。密文在接收端解码，块中的任何额外比特（即任何大于单字节的内容）都将被删除。另外一种称为输出反馈（OFB）模式的分组密码实现本质上等同于同步流密码。通过使用\
  \ `OFB`，相同的明文块无法产生相同的密文块。\n\n### 14.3.3 今日使用的秘密密钥加密算法\n\n这些包括数据加密标准。`DES` 是目前最流行的\
  \ SKC 方案，由 IBM 在 20 世纪 70 年代创建，并于 1977 年被国家标准局（`NBS`，现国家标准与技术研究院 `NIST`）批准用于商业和非机密政府应用。`DES`\
  \ 是一种处理 `64-bit blocks` 和 `56-bit key` 的分组密码。尽管由于计算机处理器速度比二十年前快几个数量级，这一点现在已变得不重要，但\
  \ `DES` 拥有一套复杂的规则和变换，专门为了产生快速的硬件实现和缓慢的软件实现。当时政府拒绝了 IBM 关于 `112-bit DES key` 的提议。\n\
  \n## 14.4 经典密码学 \\[27, 28\\]\n\n密码学是一门科学，使我们能够在没有第三方参与的情况下在发送者和接收者之间建立安全连接。现代密码学的基础技术包括数据完整性、身份验证、不可否认性和数据机密性。电子商务、自动取款机（ATM）、计算机密码和许多其他基本应用都使用了当前或经典的密码学\
  \ [\\[29\\]](#c14.xhtml#ref29)。\n\n经典密码学是采用各种机器学习算法将明文转换为代码语言的过程。用于解码数据的密钥由发送者和接收者交换，以便他们对通信进行加密或解密。\n\
  \n经典密码学有两种形式：\n\n1.  对称加密 - 这是最简单的密码学方法，因为加密和解密使用的密钥是相同的 [\\[14\\]](#c14.xhtml#ref14)。\n\
  \n2.  非对称加密 - 这是一种更复杂的密码学方法，使用不同的密钥进行加密和解密。在非对称加密下，发送者和接收者的私钥永远不会传输。\n\n## 14.5\
  \ 量子密码学 (QCr)\n\n量子密码学 (`QCr`）基于量子物理事件，为发送者和接收者之间提供安全的数据传输 [\\[16\\]](#c14.xhtml#ref16)。它是密码学领域最新、最复杂的领域，其基础基于两个量子技术原理：海森堡不确定原理和光子偏振理论\
  \ [\\[16\\]](#c14.xhtml#ref16)。根据海森堡不确定原理，某些物理属性对的耦合方式使得测量其中一个可能会导致无法知道另一个。特别是选择测量的方向，会影响所有的后续测量。当未偏振光通过垂直对齐的滤波器时，部分光会被吸收，剩余光变为沿垂直方向偏振。\n\
  \n`basis` 是用于表示光子偏振的一对正交态，例如 `horizontal/vertical` [\\[17\\]](#c14.xhtml#ref17)。\n\
  \n`BB84` \\[18–20\\] 量子密钥分发协议创建于 1984 年。`BB84` 程序包括以下步骤：\n\n1.  发送者将偏振光子传递给接收者，可能是\
  \ `rectilinear` 或 `diagonal`。\n2.  接收者随后通过随机选择基（`rectilinear/diagonal`）来验证光子的方向并记录结果。发送者和接收者用于测量的基不需要相同。\n\
  3.  接收者通过公共信道向发送者告知其测量基。\n4.  在对比实际基和接收到的基后，发送者通过公共信道交付正确的比特（具有相同基的比特）。\n\n## 14.6\
  \ 量子密钥分发\n\n双方之间加密密钥的分配被称为密钥分发。密钥分发的最基本方法是在安全环境中面对面并交换密钥。然而，我们现在可以通过公钥（如 `cyphers`、`RSA`、`Diffiehellman`）在任何距离交换密钥。\n\
  \n\n\n\n传统密钥分发的缺点是它们采用基础数学计算来传输数据，这些计算容易进行，并且可能被第三方轻易获取[24, 25]]。\n\n这种传统的密钥分发方法充满了困难。它们与传统密钥一样，只能创建容易被其他方获取的弱随机数。此外，CPU\
  \ 性能和这些密钥受到新攻击战术的影响，因为一旦利用新的攻击技术，就必须对其重新编程。如果量子计算机成为现实，它们能够轻易破解包含在传统密钥中的数据，使得目前的传统加密方案变得危险。为了保持领先，我们必须使用巨大的非对称密钥来安全地存储和分发我们的对称密钥。这一切使我们重新考虑加密密钥的安全性\
  \ [\\[26\\]](#c14.xhtml#ref26)。\n\n### 14.6.1 应用（密钥相关工作）\n\n量子计算（QC）具有广泛的应用范围，使其极其强大且有用。量子计算的一些应用包括：\n\
  \n机器学习 \\[27, 28\\]：机器学习有三种类型：监督学习、无监督学习和强化学习。这三种类型的学习都需要巨大的处理能力。以下是几个例子：\n\n1.\
  \  支持向量机 (SVM)：SVM 在传统计算机上采用暴力破解法，需要大量的处理能力和时间。\n2.  例如，Grover 搜索方法使用量子算法来加速这一过程。\n\
  \    1.  K-最近邻算法 (KNN)：KNN 是一种分类技术，将对象划分为聚类或具有相似特征的点组。随着聚类数量的增加，经典计算机的分类难度也会增加。这类工作最适合量子计算机处理，因为它允许并行计算。它可以同时计算一个对象到聚类中心的距离。\n\
  \    2.  感知器：感知器的基本目标是识别一个与训练数据良好拟合的超平面。它会产生大量的超平面选项，这使得传统计算机变得缓慢，因为它们需要同时计算所有点到单个超平面的关系。相反，量子计算机可以为点提供来自不同超平面的结果。\n\
  \n6G 或 B5G 应用 - 自 5G 引入以来，人们一直担心该技术在十年内无法满足数据需求。框架规划见 (Nawaz, Sharma *et al*. 2019)。它指出，通过人工智能\
  \ (AI) 和机器学习 (ML)，自主切换和自服务网络的概念可能提供比 5G 网络高 100 倍的数据吞吐量。预计到 2030 年，增长的流量每月将产生约 5016\
  \ 字节的数据。为了实时提供结果并服务网络，ML 和 AI 都需要并行处理。\n\n药物开发 - 量子技术在药物转化和医疗保健方面非常有益。例如，医学开发中最艰巨的任务是分析和开发分子。量子技术可以计算所有原子的量子特性，即使对于快速的超级计算机来说这也是一个困难的计算过程。量子计算利用量子特性对分子进行建模，使其具有超越传统技术的优势。大规模量子模拟允许成功治疗阿尔茨海默症等疾病\
  \ \\[28, 29\\]\n\n信息传态 - 量子技术的一个引人入目的特性是在不物理发送的情况下将信息从一个位置移动到另一个位置。由于量子粒子的流动身份，这是可以想象的，它们可能会以跨越时空的方式纠缠，当我们修改一个粒子中的任何内容时，它会对另一个粒子产生影响，从而创建一个传态通道\
  \ [15, 16]。\n\n### 14.6.2 问题陈\n\n量子行业面临的最困难问题是尽管存在限制，如何将量子计算机或其众多应用投入商业化和广泛使用。引入量子计算机的主要目标是解决我们无法解决的未解问题。\n\
  \n## 14.7 密码分析\n\n量子密码分析是在不接触原始数据的情况下破译加密数据含义的过程。在这个博弈，我们努力揭示隐藏的密钥 [\\[16\\]](#c14.xhtml#ref16)。我们还研究攻击以获取加密数据。这可以通过现实地检查安全性来实现。通常，QKD\
  \ 系统中的实际挑战是发现漏洞，我们可以使用密码分析来探索 [17, 18]。\n\n## 14.8 纠缠\n\n如果电子或量子比特在任何点相互作用，粒子之间就会形成连接。如果任何电子或量子比特表现出这些特性，它们被认为处于关联或纠缠在一起的状态。一旦知道一个电子的自旋，另一个纠缠电子的自旋将处于相反方向。由于量子叠加的使用，粒子在计算之前没有自旋或方向，但它们同时处于向上和向下或\
  \ 0 和 1 的状态。当检测到粒子的自旋且它同时与其纠缠的粒子通信时，纠缠粒子的自旋方向与观测粒子相反。量子比特因为这种特性而相互作用。无论相互关联的粒子隔得有多远，只要它们保持分离，就会保持纠缠状态\
  \ [15, 18]。\n\n## 14.9 量子传态\n\n量子态极其不稳定；如果它们与其他系统相互作用或碰撞，它们将失去叠加特性或可能湮灭。与量子比特相比，经典位发生的任何故障都可以被简单修正。量子传态涉及在安全设置下利用未知量子态传输信息。如果这一应用在未来成为现实，我们可以通过传态将计算机输出作为输入\
  \ [\\[9\\]](#c14.xhtml#ref9)。\n\n传态利用了量子纠缠特性。它有助于信息从一个位置移动到另一个位置。自由空间量子通信已经是现实，网络延伸超过\
  \ 200 公里。\n\n## 14.10 QCr 在网络安全中的应用\n\n由于量子计算机的优势，诸如 `RSA`、Ellamae 和其他公钥在量子计算机面前将不再安全。此外，量子计算机可以快速解决离散对数问题和整数分解等问题。为了保护这些系统，我们需要不依赖于上述问题的其他密码系统\
  \ \\[8, 9]。\n\n网络安全和加密对于确保信息系统的安全都至关重要。探索 QCr 方法是网络安全最重要的方面之一 [1, 2]。\n\n量子信息具有经典信息不具备的特征。纠缠态下的量子代码信息特别难以获取\
  \ \\[3, 4]。\n\n1.  不确定性原理：这一概念表明确定微观世界中粒子的位置是困难的，且粒子的位置在不同地方变化。\n\n\n\n\n\n## 2.\
  \ 量子不可克隆\n\n克隆是在完全不同的状态下产生一个完全相同的量子粒子。科学家们已经证明量子设备可以镜像这一特性。不可删除性是量子态的另一个特征。这意味着在量子态中，破坏或损坏粒子将会在通信网络中留下痕迹。量子物理的线性线性禁止了对量子态副本的删除\
  \ [6, 7]。\n\n## 14.11 量子密钥分发协议的实现\n\nBennett 和 Brassard 在 1984 年基于上述行为设计了 `BB84`\
  \ 方案，采用了四种极化表达式，具体填充如下。\n\n发送者通过不规则的基矢排列将数据编码为量子态，并传输给收集者。这些知识的每一部分都将表现为短暂的光闪，由上述的估计基矢驱动。接收者随后使用他们任意的基矢排列读取随后的材料。在数据发送后，发送者和收集者必须明确讨论使用了哪些基矢以及在哪些请求中使用。\n\
  \n当基矢一致时，可以证明 [19] 相关数据项在交易的两个部分是相同的，但以下两种情况除外 [11, 12]：\n\n1. 当随机干扰破坏了信息信道时。\n\
  2. 当窃听者试图拦截数据流时。\n\n## 14.12 研究与工作\n\n我们无法处理由于大量数据涌入引起的高处理需求问题。对于这类问题，例如在巨大的解集上进行搜索或优化，`QC`\
  \ 相比二进制计算具有几个优势 [1]。量子计算机的出现对计算的发展产生了重大影响。Google 在一项研究中揭示了他们如何赢得获得量子霸权的竞赛。使用具有 53\
  \ 个比特的量子计算机 `Sycamore` 处理器，在 200 秒内即可产生一个随机数，而超级计算机则需要 10,000 年（实际上未进行计算）。\n\n`IBM`、`Microsoft`\
  \ 等竞争对手对于谁将主导量子领域持有不同意见。超级计算机无法解决量子计算机可以解决的问题；然而，量子计算机用于“多用途任务”的应用仍然落后。\n\n## 14.13\
  \ QC 面临的挑战\n\n今天，`QC` 的状态与 20 世纪 60 年代的传统房间计算机完全相同。唯一的区别在于研究、开发和成果的增长速度是指数级的。`QC`\
  \ 的主要困难在于量子计算机进行超导需要绝对零度。由于其尺寸以及对可以执行的活动类型的限制，其利用尚未被广泛接受。它是可能的。如何实现超导是一个需要解决的问题。以及它如何在非绝对温度下执行我们用于传统计算机中用于执行的各种任务。\n\
  \n`QC` 力量的关键在于基本操作单元，被称为“量子比特（qubit）”，它基于叠加原理工作，并可以同时持有 `0` 或 `1` 的值。这一特性逐渐增加了计算能力（`2q`）。`n`\
  \ 表示量子比特的数量。Google 现在估估计 `n` 在实践中可以达到 53，并声称实现了量子霸权。作为对 Google 断言的回应，一家名为拥有 5,000\
  \ 比特量子计算机的公司宣布实现了量子主权。考虑计算机解决复杂度水平为 25,000 问题的能力。\n\n“热量子比特” [18, 28] 是研究人员创建的，用于描述工作温度比“量子比特”（在绝对零度以下的小位数运行）更高的量子比特。研究人员单元单元的量子处理运行比基于芯片的量子计算机热\
  \ 15 倍，在 1.5 开尔文下，高于 `Google` 和 `IBM` 的。尽管 1.5 开尔文仍然很接近，但仅量子比特制冷就能节省数百美元（Bernstein\
  \ 2009）。\n\n该技术的能力可能会对企业、学术机构和政府环境的网络安全做出宝贵贡献。\n\n## 14.14 局限性\n\n毫无疑问，量子计算机处理信息的速度将比传统计算机快得多，但幅度很小。声称量子计算机可以做任何事情是该领域经常犯的错误之一，比传统计算机更快地处理挑战性的数学异常。考虑到我们的理解，量子计算机面临的挑战与经典计算机面临的挑战相似。映射问题（NP-完全）。除了这些理论问题外，以下是\
  \ `QC` 实际应用中出现的两个大问题：\n\n* 组件：电路中需要去相干，这意味着不应存在辐射或噪声。\n* 超导：运行需要绝对零温度。\n\n## 14.15\
  \ 结论\n\n目前 `QC` 的状态与 20 世纪 60 年代的传统房间级计算机完全相同。唯一的区别在于研究、开发和成果的增长速度是指数级的。`QC` 的未来是光明的，因为它可以在许多其他领域中利用，包括量子隐形和卫星通信。结论指出，`QC`\
  \ 可以解决传统计算机无法解决的谜题。然而，`QC` 的成本仍然很高。降低成本使其更易获取。此外，`UNSW` 取得了一项重大进展，使经典计算机并行执行高处理任务。\n\
