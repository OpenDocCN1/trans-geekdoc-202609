  - Roblox 人类共同体验
- - '##'
  - Roblox 首席执行官大卫·巴斯祖奇常将 Roblox 称为“人类共同体验”，这一术语表明元宇宙远不止于游戏，其基础在于：身份、社交、沉浸、低摩擦、多样性、随地接入、经济与文明。Roblox
    认为，3D 数字世界中的人类共同体验，正是其创始人早在 2004 年就设想的新型社交互动形式。在“人类共同体验”空间里，用户可以一起做各种事情，例如工作、学习、玩耍、购物和体验娱乐——远超游戏本身。
