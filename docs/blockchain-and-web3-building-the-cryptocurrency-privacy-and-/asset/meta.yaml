- - '##'
  - 智能合约安全
- - '##'
  - 2021 年 8 月 10 日，Poly Network 报告称，一组攻击者黑入了其网络的一个智能合约，转移了约 6.1 亿美元（主要为以太币、币安币和 USDC），并将其移至外部钱包地址。据网络安全公司
    SlowMist 分析，此次黑客攻击之所以成为可能，是因为 Poly Network 两个关键智能合约之间的访问权限管理不善。尽管黑客最终因担心自身身份（如
    IP 地址、电子邮件及其在中心化加密货币交易所的账户）被发现并面临起诉而将资金归还给 Poly Network，但如果黑客更加注意保护自身身份，同样的事情可能再次发生，且资金不会被追回。
