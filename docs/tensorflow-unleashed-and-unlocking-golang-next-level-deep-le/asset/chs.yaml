  \ 层，以更好地捕捉时间序列数据中的长期依赖关系。\n\n### 序列到序列模型\n\n虽然 RNN 适用于预测时间序列中的下一个值，但它们也可以用于序列到序列任务，如机器翻译或天气预测。编码器-解码器架构（由处理输入序列的编码器和生成输出序列的解码器组成）被用于这些任务。\n\
