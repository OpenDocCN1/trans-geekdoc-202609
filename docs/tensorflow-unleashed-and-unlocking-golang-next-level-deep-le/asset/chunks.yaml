    \ := []int{1, 2, 3, 4, 5}\n    for index, value := range numbers {\n        fmt.Printf(\"\
    Index: %d, Value: %d\\n\", index, value)\n    }\n}\n```\n\n### 使用 `break` 和 `continue`\
    \ 的控制流\n\n`break` 语句用于提前退出循环，而 `continue` 语句用于跳过当前迭代并继续下一次迭代。\n\n```go\npackage\
    \ main\n\nimport \"fmt\"\n\nfunc main() {\n    for i := 1; i <= 5; i++ {\n   \
    \     if i == 3 {\n            fmt.Println(\"Skipping iteration\", i)\n      \
    \      continue\n        }\n        fmt.Println(\"Iteration\", i)\n        if\
    \ i == 4 {\n            fmt.Println(\"Breaking loop\")\n            break\n  \
    \      }\n    }\n}\n```\n\n### 总结\n\n在本章中，我们探索了 Go 中丰富的数据类型和变量的世界。我们深入研究了数值类型、布尔值、常量、变量声明、类型推断和零值。掌握了这些知识，你已经准备好使用\
    \ Go 处理各种编程任务。\n\n"
