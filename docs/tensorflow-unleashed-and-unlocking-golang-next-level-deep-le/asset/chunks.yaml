    \### Object-Relational Mapping (ORM)


    ORM libraries simplify database interaction by providing an abstraction over SQL
    databases.


    \#### Using GORM


    GORM is a popular ORM library for Go that allows you to work with SQL databases
    in an object-oriented manner.


    \`\`\`go


    package main


    import (


    "fmt"


    "gorm.io/driver/mysql"


    "gorm.io/gorm"


    "gorm.io/gorm/logger"


    )


    type User struct {


    ID   uint


    Name string


    Age  int


    }


    func main() {


    dsn := "username:password@tcp(host:port)/dbname"


    db, err


    := gorm.Open(mysql.Open(dsn), &gorm.Config{


    Logger: logger.Default.LogMode(logger.Info),


    })


    if err != nil {


    fmt.Println("Error:", err)


    return


    }


    // Migrate the schema


    db.AutoMigrate(&User{})


    // Create a new user


    user := User{Name: "Alice", Age: 25}


    db.Create(&user)


    // Retrieve all users


    var users \[\]User


    db.Find(&users)


    fmt.Println("Users:", users)


    }


