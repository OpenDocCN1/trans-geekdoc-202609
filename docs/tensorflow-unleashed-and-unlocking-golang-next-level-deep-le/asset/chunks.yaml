    \ var name string = \"Alice\"\n    var temperature float64 = 25.5\n    fmt.Println(\"\
    Name:\", name)\n    fmt.Println(\"Age:\", age)\n    fmt.Println(\"Temperature:\"\
    , temperature)\n}\n```\n\nGo 还支持使用 `:=` 运算符进行短变量声明。这种简写用于在一步内声明并初始化变量。\n\n```go\n\
    package main\n\nimport \"fmt\"\n\nfunc main() {\n    x := 10\n    y := 20\n  \
