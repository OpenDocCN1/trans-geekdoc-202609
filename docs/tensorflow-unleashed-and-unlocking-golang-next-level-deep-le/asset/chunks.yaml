    )\n\tif err != nil {\n\t\tfmt.Println(\"Error:\", err)\n\t\treturn\n\t}\n\tdefer\
    \ db.Close()\n\t_, err = db.Exec(\"INSERT INTO users (name, age) VALUES (?, ?)\"\
