    \### Functions in Go


    A function is a self-contained block of code that performs a specific task. In
    Go, functions are a fundamental construct, and they play a pivotal role in structuring
    your programs. Let''s dive into the syntax and usage of functions in Go.


    \#### Declaring and Defining Functions


    To declare a function in Go, you specify its name, input parameters (if any),
    return type (if any), and the body of the function. Here''s the general syntax:


    \`\`\`go


    func functionName(parameters) returnType {


    // Function body


    }


    \`\`\`


    Let''s define a simple function that calculates the sum of two integers:


    \`\`\`go


    package main


    import "fmt"


    func add(a, b int) int {


    return a + b


    }


    func main() {


    result := add(5, 3)


    fmt.Println("Sum:", result)


    }


    \`\`\`


    \#### Multiple Return Values


    Go allows functions to return multiple values. This feature is often used to return
    a result along with an error value to indicate the success or failure of the operation.


    \`\`\`go


    package main


    import "fmt"


    func divide(a, b float64) (float64, error) {


    if b == 0 {


    return 0, fmt.Errorf("cannot divide by zero")


    }


    return a / b, nil


    }


    func main() {


    result, err := divide(10, 2)


    if err != nil {


    fmt.Println("Error:", err)


    } else {


    fmt.Println("Result:", result)


    }


    }


    \`\`\`


    \#### Variadic Functions


    Variadic functions allow you to pass a variable number of arguments to a function.
    This is useful when you don''t know in advance how many arguments will be provided.


    \`\`\`go


    package main


    import "fmt"


    func average(numbers ...float64) float64 {


    total := 0.0


    for \_, num := range numbers {


    total += num


    }


    return total / float64(len(numbers))


    }


    func main() {


    avg := average(2.5, 3.5, 4.0, 5.5)


    fmt.Println("Average:", avg)


    }


    \`\`\`


    \### Methods in Go


    Methods are functions associated with specific types, allowing you to define behaviors
    and actions that are relevant to those types. Methods enhance code organization
    and encapsulation.


    \#### Declaring and Defining Methods


    To define a method in Go, you need to specify the receiver type before the function
    name. The receiver type is the type on which the method operates. Let''s create
    a simple \`Rectangle\` type with a method to calculate its area:


    \`\`\`go


    package main


    import "fmt"


    type Rectangle struct {


    Width  float64


    Height float64


    }


    func (r Rectangle) Area() float64 {


    return r.Width \* r.Height


    }


    func main() {


    rect := Rectangle{Width: 4.0, Height: 3.0}


    area := rect.Area()


    fmt.Println("Rectangle Area:", area)


    }


    \`\`\`


    \#### Pointer Receivers


    In addition to value receivers, you can use pointer receivers to modify the underlying
    value of a type. This is useful when you want to update the original value within
    a method.


    \`\`\`go


    package main


    import "fmt"


    type Counter struct {


    Value int


    }


    func (c \*Counter) Increment() {


    c.Value++


    }


    func main() {


    counter := Counter{Value: 10}


    fmt.Println("Initial Value:", counter.Value)


    counter.Increment()


    fmt.Println("Updated Value:", counter.Value)


    }


    \`\`\`


    \### Anonymous Functions and Closures


    Anonymous functions, also known as lambda functions, are functions without a name.
    They are often used when you need to define a function inline.


    \`\`\`go


    package main


    import "fmt"


    func main() {


    add := func(a, b int) int {


    return a + b


    }


    result := add(3, 5)


    fmt.Println("Result:", result)


    }


    \`\`\`


    Closures are a powerful concept related to anonymous functions. A closure is a
    function that "closes over" its surrounding scope, retaining access to variables
    even after the outer function has completed.


    \`\`\`go


    package main


    import "fmt"


    func makeCounter() func() int {


    count := 0


    return func() int {


    count++


    return count


    }


    }


    func main() {


    counter := makeCounter()


    fmt.Println("Count:", counter())


    fmt.Println("Count:", counter())


    fmt.Println("Count:", counter())


    }


    \`\`\`


    \### Defer, Panic, and Recover


    Go provides three keywords for handling exceptional situations: \`defer\`, \`panic\`,
    and \`recover\`.


    \- The \`defer\` statement is used to schedule a function call to be executed
    after the surrounding function returns.


    \- The \`panic\` function is used to cause a runtime error and terminate the program.


    \- The \`recover\` function is used to handle panics and resume normal execution.


    \`\`\`go


