    c:\", c)\n    fmt.Println(\"d:\", d)\n}\n```\n\n# 第 3 章：控制结构与决策\n\n欢迎来到《解锁 Golang：你的中级编程必备指南》第\
    \ 3 章。在本章中，我们将深入探索控制结构和决策的世界。这些基础结构使你能够控制程序的流，使其具有动态性并对不同场景做出响应。\n\n### 条件语句\n\
    \n条件语句允许你根据某些条件执行代码块。Go 提供了 `if` 语句用于基础执行。\n\n#### `if` 语句\n\n`if` 语句评估条件，如果条件为真，则执行代码块。\n\
    \n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    age := 18\n    if\
    \ age >= 18 {\n        fmt.Println(\"You are an adult.\")\n    } else {\n    \
    \    fmt.Println(\"You are a minor.\")\n    }\n}\n```\n\n#### 带有短变量声明的 `if` 语句\n\
    \n你也可以将短变量声明与 `if` 语句结合。\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main()\
    \ {\n    if num := 10; num%2 == 0 {\n        fmt.Println(num, \"is even.\")\n\
    \    } else {\n        fmt.Println(num, \"is odd.\")\n    }\n}\n```\n\n### 比较运算符\n\
    \n比较运算符用于比较值并判断条件是真是假。这里是一些常用的比较运算符：\n\n- `==` 等于\n- `!=` 不等于\n- `<` 小于\n- `>`\
    \ 大于\n- `<=` 小于等于\n- `>=` 大于等于\n\n### 逻辑运算符\n\n逻辑运算符用于组合条件创建复杂的表达式。逻辑运算符有：\n\n\
    - `&&` 与\n- `||` 或\n- `!` 非\n\n### `switch` 语句\n\n`switch` 语句提供了一种处理多种情况的优雅方式。它评估表达式并与各种情况进行匹配，执行相应的代码块。\n\
    \n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    day := \"Monday\"\
    \n    switch day {\n    case \"Monday\":\n        fmt.Println(\"It's the start\
    \ of the week.\")\n    case \"Friday\":\n        fmt.Println(\"It's almost the\
    \ weekend!\")\n    default:\n        fmt.Println(\"It's a regular day.\")\n  \
    \  }\n}\n```\n\n### 循环结构\n\n循环结构允许你多次执行代码块。Go 提供了多种循环结构，包括 `for` 循环。\n\n#### `for`\
    \ 循环\n\n`for` 循环只要指定的条件为真就会重复执行代码块。\n\n```go\npackage main\n\nimport \"fmt\"\n\
    \nfunc main() {\n    for i := 1; i <= 5; i++ {\n        fmt.Println(\"Iteration\"\
    , i)\n    }\n}\n```\n\n#### 带有单一条件的 `for` 循环\n\n你可以带有单一条件使用 `for` 循环，类似于 `while`\
    \ 循环。\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    count :=\
    \ 0\n    for count < 3 {\n        fmt.Println(\"Count:\", count)\n        count++\n\
    \    }\n}\n```\n\n#### 使用 `range` 的 `for` 循环\n\n`for` 循环还可以用于迭代集合中的元素，如数组、切片和\
