    ### Select Statement


    The `select` statement allows you to wait on multiple communication operations
    simultaneously.


    ```go

    package main


    import (


    "fmt"


    "time"

    )


    func main() {


    ch1 := make(chan string)


    ch2 := make(chan string)


    go func() {


    time.Sleep(time.Second)


    ch1 <- "Channel 1 message"


    }()


    go func() {


    time.Sleep(time.Second * 2)


    ch2 <- "Channel 2 message"


    }()


    for i := 0; i < 2; i++ {


    select {


    case msg1 := <-ch1:


    fmt.Println("Received from ch1:", msg1)


    case msg2 := <-ch2:


    fmt.Println("Received from ch2:", msg2)


    }


    }


    }

    ```


