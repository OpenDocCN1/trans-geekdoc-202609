    \`\`\`python


    \# Leaky ReLU activation


    def leaky\_relu(x, alpha=0.01):


    return x if x > 0 else alpha \* x


    \`\`\`


    \### Optimizers: Navigating the Optimization Landscape


    Optimizers play a vital role in training neural networks by adjusting their parameters
    to minimize the loss function. Different optimizers offer distinct strategies
    for this optimization process.


    The Stochastic Gradient Descent (SGD) optimizer updates weights based on the gradient
    of the loss function with respect to the weights. However, its convergence can
    be slow. Momentum optimization, a variant of SGD, introduces a momentum term that
    accelerates convergence, especially in regions with flat gradients.


    \`\`\`python


    \# Momentum optimizer


    def momentum\_optimizer(weight, gradient, velocity, learning\_rate, momentum):


    velocity = momentum \* velocity - learning\_rate \* gradient


    weight += velocity


    return weight, velocity


    \`\`\`


    Adam (Adaptive Moment Estimation) optimizer combines the advantages of both momentum
    and RMSProp. It adapts the learning rates of different parameters, making it suitable
    for a wide range of tasks.


    \`\`\`python


    \# Adam optimizer


    def adam\_optimizer(weight, gradient, m, v, t, learning\_rate, beta1, beta2, epsilon):


    m = beta1 \* m + (1 - beta1) \* gradient


    v = beta2 \* v + (1 - beta2) \* gradient \*\* 2


    m\_hat = m / (1 - beta1 \*\* t)


    v\_hat = v / (1 - beta2 \*\* t)


    weight -= learning\_rate \* m\_hat / (np.sqrt(v\_hat) + epsilon)


    return weight, m, v


    \`\`\`


