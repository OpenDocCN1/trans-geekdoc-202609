    \### Conditional Statements


    Conditional statements allow you to execute different blocks of code based on
    certain conditions. Go provides the \`if\` statement for basic conditional execution.
    Let''s explore some examples:


    \#### The \`if\` Statement


    The \`if\` statement evaluates a condition and executes a block of code if the
    condition is true.


    \`\`\`go


    package main


    import "fmt"


    func main() {


    age := 18


    if age >= 18 {


    fmt.Println("You are an adult.")


    } else {


    fmt.Println("You are a minor.")


    }


    }


    \`\`\`


    \#### The \`if\` Statement with Short Variable Declaration


    You can also use the short variable declaration in conjunction with the \`if\`
    statement.


    \`\`\`go


    package main


    import "fmt"


    func main() {


    if num := 10; num%2 == 0 {


    fmt.Println(num, "is even.")


    } else {


    fmt.Println(num, "is odd.")


    }


    }


    \`\`\`


    \### Comparison Operators


    Comparison operators are used to compare values and determine whether a certain
    condition is true or false. Here are some commonly used comparison operators:


    \- \`==\`: Equal to


    \- \`!=\`: Not equal to


    \- \`<\`: Less than


    \- \`>\`: Greater than


    \- \`<=\`: Less than or equal to


    \- \`>=\`: Greater than or equal to


    \### Logical Operators


    Logical operators are used to combine multiple conditions and create more complex
    expressions. The main logical operators are:


    \- \`&&\`: Logical AND


    \- \`||\`: Logical OR


    \- \`!\`: Logical NOT


    \### The \`switch\` Statement


    The \`switch\` statement provides an elegant way to handle multiple cases. It
    evaluates an expression and compares it against various cases, executing the corresponding
    block of code when a match is found.


    \`\`\`go


    package main


    import "fmt"


    func main() {


    day := "Monday"


    switch day {


    case "Monday":


    fmt.Println("It''s the start of the week.")


    case "Friday":


    fmt.Println("It''s almost the weekend!")


    default:


    fmt.Println("It''s a regular day.")


    }


    }


    \`\`\`


    \### Looping Structures


    Looping structures allow you to repeat a block of code multiple times. Go provides
    several loop constructs, including the \`for\` loop.


    \#### The \`for\` Loop


    The \`for\` loop repeatedly executes a block of code as long as a specified condition
    is true.


    \`\`\`go


    package main


    import "fmt"


    func main() {


    for i := 1; i <= 5; i++ {


    fmt.Println("Iteration", i)


    }


    }


