    \ (RNNs)，它们在序列建模任务中表现出色。准备好释放深度学习在理解和生成序列方面的潜力吧！\n\n# 第 5 章：循环神经网络：序列建模\n欢迎来到《TensorFlow\
    \ Unleashed：面向中间程序员的进阶深度学习》第 5 章。在本章中，我们将深入探索循环神经网络 (RNNs) 世界，这是一类为序列建模任务设计的模型。在本章结束，你将理解\
    \ RNN 的机制，知道如何使用 `TensorFlow` 构建和训练它们，并准备好处理涉及顺序数据的任务。\n\n### 理解循环神经网络\n序列存在于许多领域，例如自然语言、时间序列和音频。虽然传统的神经网络是为固定大小的输入设计的，但\
    \ RNN 可以处理变长度的序列。它们通过维护一个内部状态来实现，该状态会随着网络处理序列中的每个元素而演变。这种内部状态捕获了上下文，使得 RNN 在语言建模、机器翻译和语音识别等任务中变得强大。\n\
    \n### 时间步和隐藏状态的作用\n在 RNN 中，每个时间步对应于序列中的一个元素。在每个时间步，网络接收输入并更新其隐藏状态。该隐藏状态保留了有关之前步骤的信息，使网络能够考虑上下文。\n\
    \n数学上，时间步 `t` 处的隐藏状态计算如下：\n`h_t = f(h_{t-1}, x_t)`\n\n在这里，`f` 代表 RNN 的激活函数，`h_{t-1}`\
    \ 是上一个时间步的隐藏状态，`x_t` 是当前输入。\n\n### 构建序列建模的 RNN\n让我们使用 `TensorFlow` 构建用于序列建模的 RNN。我们将使用\
    \ `imdb` 数据集，标记为正面或负面的电影评论。\n\n```python\nimport tensorflow as tf\nfrom tensorflow.keras\
    \ import layers, models\nfrom tensorflow.keras.datasets import imdb\nfrom tensorflow.keras.preprocessing\
    \ import sequence\n\n# 加载并处理 IMDb 数据\n(x_train, y_train), (x_test, y_test) = imdb.load_data(num_words=10000)\n\
    x_train = sequence.pad_sequences(x_train, maxlen=200)\nx_test = sequence.pad_sequences(x_test,\
    \ maxlen=200)\n\n# 构建 RNN 架构\nmodel = models.Sequential([\n    layers.Embedding(10000,\
    \ 128),\n    layers.SimpleRNN(64),\n    layers.Dense(1, activation='sigmoid')\n\
    ])\n\n# 编译模型\nmodel.compile(optimizer='adam',\n              loss='binary_crossentropy',\n\
    \              metrics=['accuracy'])\n\n# 训练模型\nmodel.fit(x_train, y_train, epochs=5,\
    \ batch_size=128, validation_data=(x_test, y_test))\n```\n\n在本示例中，我们构建了一个用于情感分析的\
    \ RNN 架构。我们使用嵌入层将单词索引转换为稠密向量。`SimpleRNN` 层处理序列并捕捉上下文。模型使用 `Adam` 优化器编译并在 `imdb`\
    \ 数据集上训练。\n\n### 长短期记忆 (LSTM)\n虽然 `SimpleRNN` 能够很好地捕捉短期依赖，但它们处理长期依赖时表现不从心。引入长短期记忆\
    \ (LSTM) 网络是为了解决这一局限性。LSTM 具有更复杂的门控机制，允许它们在长序列中保留信息。\n\n```python\nmodel = models.Sequential([\n\
    \    layers.Embedding(10000, 128),\n    layers.LSTM(64),\n    layers.Dense(1,\
    \ activation='sigmoid')\n])\n```\n\n### 门控循环单元 (GRU)\n门控循环单元 (GRU) 是 RNN 的另一种变体，在\
    \ `SimpleRNN` 和 `LSTM` 之间取得了平衡。它们的参数比 LSTM 少，并且能够比 `SimpleRNN` 捕捉更长的依赖关系。\n\n\
    ```python\nmodel = models.Sequential([\n    layers.Embedding(10000, 128),\n  \
    \  layers.GRU(64),\n    layers.Dense(1, activation='sigmoid')\n])\n```\n\n###\
    \ 双向 RNN\n传统的 RNN 从左到右处理序列。双向 RNN 从两个方向处理序列，同时捕捉过去和未来元素的上下文。这对于需要过去和未来上下文的任务特别有用。\n\
    \n```python\nmodel = models.Sequential([\n    layers.Embedding(10000, 128),\n\
    \    layers.Bidirectional(layers.LSTM(64)),\n    layers.Dense(1, activation='sigmoid')\n\
    ])\n```\n\n"
