    ## 摘要


    高精度和实时诊断抽油杆泵系统（SRPS）对于快速掌握油井作业至关重要。基于深度学习的油井示功图（DC）分类方法是一种高效的诊断方法。然而，将 DC 作为二维图像输入深度学习框架会遭受低特征利用率和高计算量的困扰。此外，油田中不同的
    SRPS 具有不同的系统参数，同一 SRPS 在不同时刻产生的 DC 也不同。因此，现场数据存在异质性，这会严重损害诊断准确性。为解决上述问题，本文提出了一种基于四段时频特征矩阵（4S-TFSM）和深度学习的工况识别方法。首先，提出了可降低计算能力需求的四段时频特征（4S-TFS）方法用于
    DC 数据的特征提取。随后，通过相对归一化和矩阵计算构建 4S-TFSM，以综合多数据的特征并解决数据异质性问题。最后，采用深度学习框架之一的卷积神经网络（CNN）基于
    4S-TFSM 确定运行工况。现场数据的实验验证了所提出的基于 4S-TFSM 和 CNN（4S-TFSM-CNN）的诊断方法可以在较低计算成本下显著提高工况识别的准确性。据我们所知，这是首次讨论数据异质性对
    SRPS 工况识别性能影响的工作。


