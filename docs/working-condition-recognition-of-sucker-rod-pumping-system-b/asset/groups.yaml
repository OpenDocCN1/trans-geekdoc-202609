    For each working condition, 3500 samples were selected from multiple wells for
    the experiment. Then, the data were divided into training and test datasets according
    to 6:1, i.e., 3000 training samples and 500 test samples for each type of working
    condition.


    Since the DCs from different wells have different load and displacement ranges,
    the collected data were processed using the Min-Max normalization method (Zhang
    and Gao, 2019).


