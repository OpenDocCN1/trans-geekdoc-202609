    ## 1. 引言


    抽油杆泵送（SRP）是最广泛且可靠的人工举升方法之一，在石油采收工程中占主导地位。在生产实践中，由于恶劣的工作环境，抽油杆泵系统（SRPS）在运行过程中容易发生故障，这不仅影响油田的正常勘探，降低井产量，还会增加石油采收成本（Li
    et al., 2018; Zhang et al., 2022）。示功图（DC）的形状可以反映 SRP 的井下情况。因此，SRPS 的分析和诊断大多基于
    DC（Han et al., 2022; Lv et al., 2021b; Zheng et al., 2020）。


    最近，自组织竞争网络（Xu et al., 2007）、径向基函数（RBF）神经网络（Zhou et al., 2019）、谱聚类（Li et al., 2015）、指定成分分析理论（Han
    et al., 2019; Li et al., 2013b）、隐马尔可夫模型（Zheng et al., 2019a）和支持向量机（SVMs）（Cheng
    et al., 2020; Liu et al., 2021）等智能识别技术得到了快速发展，特别是基于深度学习的井况识别方法（Abdalla et al.,
    2020; Sun et al., 2022; Tian et al., 2021）。这些方法显著提高了井况识别的准确性。Li et al.（2013a）使用矩曲线方法获得
    DC 特征，随后使用改进的 SVM 进行工况识别。Zheng and Gao（2017）使用曲率和重心分解方法提取七个几何特征，并使用连续隐马尔可夫模型作为分类器来诊断井运行工况。Zhou
    et al.（2019）提出了一种基于近似多边形的傅里叶描述符，并采用改进的 RBF 神经网络构建诊断模型。Wang et al.（2021）提出了一种基于卷积神经网络（CNN）的智能识别模型，该模型通过卷积和池化操作隐式提取图像特征并完成井故障诊断。Zhou
    et al.（2018）基于机理分析、专家知识和先验信息提取了 12 个 DC 特征和 7 个电功率信号特征，使用 SVM 进行多视图协同训练和 Hessian
    正则化以实现抽油井工作状态识别。Pan et al.（2021）提出了一种基于在线贝叶斯技术和贝叶斯概率公式的决策融合方法，用于油泵单元的无监督故障检测。上述研究侧重于提高特征的表征能力和模型的分类性能以改善诊断结果。


    然而，在实际抽油杆泵系统中遇到了两个挑战。（i）基于深度学习的井况识别方法通常将 DC 作为图像进行特征提取和分类（Song et al., 2023; Yin
    et al., 2023; Zhao et al., 2017）。与包含复杂信息的普通图像不同，示功图由仅包含载荷和位移数据的闭合曲线组成。DC 作为图像输入深度神经网络进行模型训练，进一步增加了计算量。（ii）油田中不同的
    SRPS 具有不同的系统参数，同一 SRPS 在不同时刻产生的 DC 不同，因此数据具有一定程度的异质性，这可能会在一定程度上影响诊断准确性。目前基于 DC
    的 SRPS 工况识别要么依赖于从 DC 中提取特征然后使用分类器自动对特征进行分类（Lv et al., 2021c; Ye et al., 2020;
    Zhou et al., 2019），要么将 DC 作为图像输入深度神经网络进行工况诊断（Song et al., 2023; Yin et al., 2023;
    Zhao et al., 2017）。此外，基于字典的迁移学习（Zhang and Gao, 2019）、元学习（He et al., 2023a）和元迁移学习（Zhang
    et al., 2022）等方法已被用于解决油田中不同 SRPS 具有不同系统参数导致训练数据分布不相似的问题，并在工况识别中取得了良好效果。然而，以上所有方法都使用单个
    DC 数据进行分析，而油井的 DC 形状随时间缓慢变化，井数据的异质性通常被忽略。目前，很少有研究提到油井数据的异质性。


    因此，高效的特征提取以降低深度模型的输入维度和抑制井数据的异质性值得研究。基于上述分析，本文提出了一种基于 4S-TFSM-CNN 的故障诊断方法。4S-TFSM-CNN
    包括两个步骤：特征提取和工况检测。在该方法中，提出了一种 4S-TFS 特征来提取 DC 的图形特征，与图像方法相比可显著降低计算能力需求。然而，井数据的异质性问题仍然被忽略。引入了一种新的数据融合方法
    4S-TFSM 来解决数据异质性问题。具体而言，通过对多个 4S-TFS 进行相对归一化和矩阵计算，通过增强不同类型样本之间的特征差异来抑制数据异质性。最后，引入专门设计的
    CNN 从 4S-TFSM 中提取关键特征用于油井工况检测。


    总之，本文做出了以下贡献。


    - 1. 为解决将 DC 作为图像输入神经网络导致的高计算复杂性问题，提出了一种四段时频特征（4S-TFS）提取技术，在压缩数据的同时进行特征提取。

    - 2. 考虑到井数据的异质性问题，提出了一种 4S-TFSM 方法，通过相对归一化和矩阵计算增强不同类型样本之间的特征差异。

    - 3. 对于特征选择，深度学习算法自动选择对工况类别敏感的特征。


    本工作的其余部分安排如下。第 2 节回顾了与我们研究相关的研究。第 3 节介绍了建议的工况识别方法。第 4 节详细报告了实验比较。第 5 节总结了论文的结论和未来研究。


    ## 2. 相关工作


    SRPS 的工况识别是一个典型的分类问题，存在许多泵机工况识别方法。特征提取和分类器选择是泵机工况识别方法的两个主要依赖。Liu et al.（2021）使用改进的傅里叶描述符进行特征提取，并使用
    SVM 进行抽油井故障诊断。Chen et al.（2021a）结合抽油泵的工作机理提取了 16 个特征，并使用具有高泛化能力的 XGBoost 算法识别抽油泵的运行状态。Han
    et al.（2022）使用 Freeman 链码提取了五个特征向量，并采用优化的密度峰值聚类（DPC）方法和改进的头脑风暴优化（BSO）算法实现在线诊断。


    特征提取步骤在缺陷诊断过程中至关重要。高质量的特征可以确保高效准确的工况识别。尽管傅里叶描述符（Zhou et al., 2019）、曲线矩（Li et al.,
    2013a）、小波变换（Tagirova et al., 2021）、统计特征（Zheng et al., 2019b）等技术已被用于提取 DC 特征，但这些方法仍存在计算复杂性高、对噪声敏感和特征维度高等问题。因此，需要研究具有高计算效率和低特征维度的强大特征提取方法（Han
    et al., 2022）。


    近年来，以 CNN 为代表的基于深度学习的故障诊断方法已被提出用于 SRPS 的工况识别。与随机森林（RF）、k 近邻（k-NN）、谱聚类（Li et al.,
    2015）和密度峰值聚类（DPC）（Wang et al., 2019）等方法相比，深度学习技术在特征数量多、数据类型复杂且低敏感的环境中表现出极强的模式挖掘能力，并广泛应用于目标检测（Yang
    et al., 2022）、图像识别（He et al., 2023b）、行为预测（He et al., 2022a）、3D 重建（Lee et al.,
    2021）、视觉重定位（Chen et al., 2021b）等领域。此外，基于深度学习的方法还可以使用深度神经网络自动从 DC 中提取图像特征。Zhao
    et al.（2017）开发了基于图像的 CNN 和基于数据的 CNN 方法，实验表明基于 CNN 的方法的识别准确率高于机器

