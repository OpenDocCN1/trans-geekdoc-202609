    训练集在模型训练过程中用于生成 320,000 个训练子任务，批量大小设为 32，训练步长设为 10,000，学习率设为 0.001。为防止偶然性和特异性，在测试集中选取
    300 个任务数据并获得所有任务的平均测试精度和标准差。


    使用构成 4S-TFSM 的不同数量 DC 的油井工况识别准确率如表 4 所示。可以看出，经 4S-TFS 对 DC 数据进行特征提取后，使用 4 个 DC
    组合时获得了 98.48% 的最高识别准确率和 0.72% 的最低标准差。该场景的 10,000 次训练和测试过程如图 7 所示。


    如图 7 所示，仅需大约 3000 个训练 epoch 即可在测试数据集上实现近 98% 的工况识别准确率，损失值下降到较低水平后在该值附近稳定，这表明训练好的
    CNN 具有良好的稳定性，也表明使用 3000 个样本训练 CNN 模型是可行的。


    如第 3.2 节所述，基于 4 个 DC 的 4S-TFSM，我们还使用 4 个 DC 形成 1S-TFSM、2S-TFSM 和 8S-TFSM。表 5 显示了在不同
    TFSM 下使用 4 个 DC 的工况识别准确率。


    显然，用所有插值载荷-位移数据构建的 1S-TFSM 无法提取足够的特征信息，从而降低了识别准确率。同样，由于示功曲线仅由 200 个点组成且特征简单，将示功曲线分割成
    8 段形成 8S-TFSM 的识别准确率也相对较低，样本点过少无法提取有效的时间频率特征，从而降低了 8S-TFSM 的识别准确率。值得一提的是，2S-TFSM
    和 4S-TFSM 达到了几乎相同的结果，这是由于图 3 中 S₁ 和 S₃ 的曲线组成简单，且两部分分别属于上冲程载荷和下冲程载荷，导致提取的时间频率特征差异不明显。


    ### 4.3. 性能比较


    将示功图作为图像进行分类的方法已成功应用于 SRPS 的工况识别。受此结果启发，我们对 image-CNN 和本文提出的 4S-TFSM-CNN 进行了比较研究。我们首先根据传感器数据绘制
    DC 并生成 640 × 480 图像。随后进行二值化处理。最后，将二值化图像压缩至 64 × 64 并用作 image-CNN 的输入。


    与 4S-TFSM-CNN 不同，image-CNN 的输入大小为 64 × 64 × 1，因此我们在第一和第二卷积层之间添加了 1 个最大池化层。此外，我们还尝试将载荷-位移数据输入神经网络以生成基于数据的数据-CNN，并将单个
    DC 提取的 4S-TFS 特征输入神经网络以生成 4S-TFS-CNN。三种神经网络的结构和参数如图表 6 所示。


    四种方法工况识别的准确率如表 7 所示。显然，4S-TFS-CNN 的识别准确率为 97.53%，显著高于 image-CNN 和 data-based-CNN
    方法的 96.83% 和 97.39%。同时，4S-TFS-CNN 的标准差为 0.91%，也低于 image-CNN 和 data-based-CNN 的
    1.08% 和 0.99%，这表明单个 DC 的 4S-TFS 特征提取方法可以提取出有效的 CNN 分类特征。此外，在四种方法中，4S-TFSM-CNN
    具有最高的识别准确率 98.48% 和最低的标准差 0.72%，这表明通过组合多个 DC 构建 4S-TFSM 可以解决异质性问题并提高工况识别准确率。


    图 8 显示了 image-CNN、data-based-CNN 和 4S-TFSM-CNN 在不同训练步长下的工况识别准确率。图 8(a) 表明，在整个训练阶段，4S-TFSM-CNN
    的准确率和损失与 image-CNN 和 data-based-CNN 相似。在图 8(b) 的测试集上，4S-TFSM-CNN 的准确率总体上高于 image-CNN
    和 data-based-CNN，这与表 7 中的发现一致。这也说明通过 4S-TFSM 可以从多个 DC 中提取足够的特征信息用于 CNN 工况识别，证实了
    4S-TFSM-CNN 的有效性。


    此外，表 8 展示了四种方法对 CNN 性能的影响。显然，所提出的 4S-TFS-CNN 方法具有最小的算法复杂度、时间复杂度和训练时间，且识别准确率高于
    Image-CNN 和 Data-based-CNN。与 data-based-CNN 相比，所提出的 4S-TFSM-CNN 方法在算法复杂度、时间复杂度和训练时间上有所增加，但识别准确率最高。表
