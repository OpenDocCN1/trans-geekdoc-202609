    ### 3.3. Working condition recognition framework of SRPS


    With the extraction of 4S-TFSM features, CNNs can be used for working condition
    identification of SRPS. The framework of the 4S-TFSM-CNN method proposed in this
    paper is shown in Fig. 4, and the general steps are summarized as follows.


    - 1) Data collection. The data are measured by dynamometer sensors attached to
    the pumping rods and sent to the data center via wireless networks. The displacement
    data are obtained through the acceleration sensor by quadratic integration. Based
    on the collected displacement and load data, the DC can be generated. The dynamometer
    card reflects the running process of the sucker rod.

    - 2) 4S-TFS feature extraction. The proposed 4S-TFS feature extraction method
    is employed to extract the time-frequency-domain features of each dynamometer
    card, and the data compression is performed at the same time as feature extraction,
    which effectively reduces the dimensionality of the data and solves the issue
    of high computational complexity caused by the DC as a two-dimensional image input
    to the neural network.

    - 3) 4S-TFSM construction. The collected 4S-TFS data generated from multiple DCs
    are used to construct 4S-TFSM by relative normalization and matrix calculation,
    which can enhance the feature differences between different working conditions
    and solve the heterogeneity problem of training samples.

    - 4) Working condition recognition. The optimal selection of features is accomplished
    by a specifically designed CNN model to automatically select 4S-TFSM features
    that are sensitive to the category of working conditions. Specifically, the dataset
    is divided into a training set and a test set according to a certain ratio. The
    CNN model is used to obtain optimal parameters sensitive to task variation by
    the training set, and the test set is used for working condition recognition.


    ![](img/63ea25f228d3f03c8fce71d94548c8eb_5_0.png)


