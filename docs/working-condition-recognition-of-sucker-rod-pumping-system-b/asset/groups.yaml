    4S-TFSM-CNN and 4S-TFS-CNN with the traditional method image-CNN in four aspects
    of classification accuracy, model parameter number, algorithm complexity and training
    time to verify the effectiveness of the innovation points presented in this paper.
    Section 4.4 discusses the negative impact of the heterogeneity of training samples
    on the actual working condition recognition, and explains the rationality of the
    innovation point by comparing 4S-TFSM-CNN with some traditional machine learning
    and deep learning methods.


    ### 4.1. Data collection and processing


    To demonstrate the effectiveness and performance of the proposed diagnostic method,
    more than 100,000 DCs were collected from an oilfield in northern China. The load
    and displacement data for each dynamometer card is composed of 200 point pairs.
    Generally, it is difficult to obtain multiple working conditions in a single well.
    Therefore, we gathered data from nearly 1300 wells over a period of more than
    90 days. These data contained more than ten types of failures. To maximize the
    generality of the data, we screened 8 common types of working conditions from
    the sensor data of multiple wells, which are the insufficient liquid supply (ILS),
    traveling valve leakage (TVL), standing valve leakage (SVL), normal operation
    condition (NOC), gas interference (GIF), continuous pumping and spraying (CPS),
    oil pipe leakage (OPL) and upstroke pump bumping (UPB); the corresponding DCs
    are shown in Fig. 5.


    ![](img/63ea25f228d3f03c8fce71d94548c8eb_6_0.png)


