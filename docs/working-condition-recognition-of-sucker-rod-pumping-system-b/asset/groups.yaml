    ### 3.1. 4S-TFS feature extraction


    理论 DC 是在某些理想条件下绘制的。目标是使用理论 DC 和实际 DC 进行比较；从图表中的差异可以判断井下泵的工作状况。悬点处静载荷的变化规律如图 1
    所示，图形为平行四边形 abcd，也称为理论静载荷 DC。在这种情况下，abc 过程是上冲程中静载荷变化的线，其中 ab 为加载线。加载操作期间，游动阀 (TV)
    关闭，但固定阀 (SV) 尚未打开，因此泵不泵油。只有当悬点的向上位移达到点 b 时，SV 才打开并开始吸油。因此，bc 是泵吸油过程。cda 过程是下冲程静载荷变化线，其中
    cd 为卸载线。同样，在此过程中，尽管悬点向下移动，此时 SV 和 TV 处于关闭状态。直到卸载结束于点 d，柱塞与泵筒之间存在相对位移，TV 打开，泵开始输送。


