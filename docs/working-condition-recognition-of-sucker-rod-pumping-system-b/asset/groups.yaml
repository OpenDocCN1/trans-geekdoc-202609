    神经网络解决机器学习中的多类分类问题。特别是，CNN 在网络的多个阶段允许权重共享和下采样，减少了参数数量，从而形成了适用于大规模分类的有效架构。


    4S-TFSM-CNN 网络的结构和参数见表 3。在训练过程中，使用随机梯度下降根据交叉熵损失函数最小化损失。隐藏层采用修正线性单元 (ReLU) 激活函数，输出层应用
    softmax 以获得每个类别概率之和为 1，并将预测类别作为概率最高的类别使用。


