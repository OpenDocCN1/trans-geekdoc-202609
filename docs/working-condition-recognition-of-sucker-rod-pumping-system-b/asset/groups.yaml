    data processing approaches, image-CNN, data-based-CNN, 4S-TFS-CNN, and 4S-TFSM-CNN.
    We can clearly observe that the vast majority of samples lie on the diagonal.
    It is straightforward to observe from the diagonal of the four confusion matrices
    that category 0 (ILS), category 3 (GIF), category 4 (OPL), and category 5 (UPB)
    are the four most difficult categories to distinguish from each other, as these
    four working conditions have the lowest classification accuracies. This is consistent
    with the results of the t-SNE visualization discussed in Fig. 9. The recognition
    accuracy of 4S-TFSM-CNN is also higher than the remaining three schemes in the
    four most difficult to distinguish categories, indicating that the 4S-TFSM feature-extraction
    approach can weaken the heterogeneity of the data and significantly affect the
    diagnosis performance.


    The heterogeneity induced by the varied distributions of data between distinct
    classes, as illustrated in Fig. 10, is an important factor limiting the recognition
    accuracy of our model. Here, instead of using individual datasets as direct inputs,
    we use a simple synthetic feature-extraction method, i.e., a feature-extraction
    technique that synthesizes multiple datasets.


    The idea is to “synthesize” training samples from real samples that are more suitable
    for deep learning to complete the classification task by extracting time-frequency
    features from the feature space of original dataset for normalization and matrix
    operations. In addition, despite the high accuracy of 98.48%, we evaluate the
    incorrectly classified samples from a probabilistic perspective to assess the
    performance of the 4S-TFSM-CNN. We infer that some misclassifications, such as
    category 5 (UPB) in Fig. 10, are attributable to label ambiguity. For these samples,
    it may be difficult to identify clear fault types, even for human experts, or
    the samples might contain multiple fault types at the same time, thus introducing
    some label noise throughout the dataset.


    In terms of training efficiency, CNNs may require more training time than typical
    machine learning methods (e.g., RF, k-NN and SVM) due to their processes of learning
    features. However, traditional machine learning methods are not friendly in the
    case of large quantities of data. Fortunately, once trained, the network can be
    recovered and utilized for model prediction multiple times, and the training time
    of our proposed 4S-TFSM-CNN technique is substantially faster than that of image-CNN.
    Therefore, the 4S-TFSM-CNN-based approach is efficient and feasible in real-world
    oil well working condition recognition.


    ![](img/63ea25f228d3f03c8fce71d94548c8eb_10_0.png)


    **Fig. 10.** The confusion matrix for the prediction under different methods.
    The numbers on the diagonal line represent the probability of correctly categorized
    samples, while the numbers on the nondiagonal line represent the probability of
    incorrectly classified samples. For clarity, we retain three decimal places, and
    the misclassification probabilities below 0.005 are not shown on the confusion
    matrix.


    Considering the computational complexity of neural networks, a 4-layer CNN is
    used in this paper, although the accuracy of working condition recognition may
    be higher as the number of neural network layers increases. The DC data are generated
    with time series, and in future work, we will also consider temporal convolutional
    networks (TCNs), which can use convolutional features while considering temporal
    information.


    ## 5. Conclusions


    In this paper, a 4S-TFSM-based feature-extraction technique for oil well DCs is
    proposed, and a specifically designed CNN is employed to achieve oil well working
    condition recognition. The technique uses 4S-TFS to extract DC features, which
    can effectively improve the recognition accuracy of oil well conditions while
    reducing the computational cost. Subsequently, 4S-TFSM is constructed by relative
    normalization and matrix calculation to enhance the feature differences between
    various types of working conditions and suppress the data heterogeneity problem.
    Finally, a special CNN is designed to automatically select 4S-TFSM features that
    are sensitive to working condition categories to achieve high-accuracy identification
    of oil well working conditions. Experimental results with a large amount of real
    oil well data in a field demonstrate the effectiveness of the proposed method.


    Considering the computational complexity of neural networks, a 4-layer CNN is
    used in this paper, although the accuracy of working condition recognition may
    be higher as the number of neural network layers increases. The DC data are generated
    with time series, and in future work, we will also consider temporal convolutional
    networks (TCNs), which can use convolutional features


