    # 1. Introduction


    Sucker rod pumping (SRP) is one of the most widespread and reliable artificial-lift
    methods that is dominant in oil-recovery engineering. In production practice,
    due to harsh working environment, the sucker rod pumping system (SRPS) is prone
    to failure during operation, which not only affects the normal exploration of
    oil fields, reduces well production rate but also increases the cost of oil recovery
    (Li et al., 2018; Zhang et al., 2022). The shape of the dynamometer card (DC)
    can reflect the downhole circumstances of the SRP. Therefore, the analysis and
    diagnosis of SRPS are mostly based on DC (Han et al., 2022; Lv et al., 2021b;
    Zheng et al., 2020).


    Recently, intelligent recognition technologies such as self-organizing competitive
    networks (Xu et al., 2007), radial basis function (RBF) neural networks (Zhou
    et al., 2019), spectral clustering (Li et al., 2015), designated component analysis
    theory (Han et al., 2019; Li et al., 2013b), hidden Markov models (Zheng et al.,
    2019a), and support vector machines (SVMs) (Cheng et al., 2020; Liu et al., 2021)
    have been rapidly developed, particularly the deep learning-based well condition
    recognition method (Abdalla et al., 2020; Sun et al., 2022; Tian et al., 2021).
    These approaches have significantly improved the accuracy of well condition recognition.
    Li et al. (2013a) used the moment-curve approach to obtain the DC'
