    of DCs, and an incremental algorithm and generated DCs to improve the generalization
    capability of the support vector machine diagnostic model. He et al. (2023a) and
    Zhang et al. (2022) employed a meta learning framework using existing well data
    to solve the problem of few-shot samples of new oil well conditions. Although
    the above methods address the problem that data from different wells do not have
    similar distributions, they all use individual dynamometer card data for analysis.
    While the shapes of DCs for a well change slowly with time, the heterogeneity
    of data from the same well is usually ignored. At present, little research has
    been mentioned on the heterogeneity of oil well data. Additionally, although CNN
    has powerful feature extraction and classification capabilities, the DC directly
    input to the deep neural network as an image for model training, which further
    increases the computational effort. Therefore, a more accurate and efficient method
    for automatic well working condition identification would be a major advancement
    for promoting the construction of smart oil fields.


    # 3. Methodology


    # 3.1. 4S-TFS feature extraction


    The theoretical DC is drawn under certain ideal conditions. The goal is to use
    the theoretical DC and the actual DC for comparison, from the differences in the
    graph can be determined for the downhole pump at the working condition of the
    judgment. The variation law of the static load at the suspension point is shown
    in Fig. 1, and the graph is a parallelogram abcd, which is also known as the theoretical
    static load DC. In this case, the abc process is the line of static load change
    in the upstroke, where ab is the loading line. The traveling valve (TV) is closed
    during the loading operation, but the standing valve (SV) is not yet open, so
    the pumping pump does not pump oil. Only when the upward displacement of the suspension
    point reaches point b does the SV open and begin to suck oil. Therefore, bc is
    the pump suction process. The cda process is the downstroke static load change
    line, where cd is the unloading line. Again, in this process, although the suspension
    point moves downward, at this time, the SV and the TV in the closed state. Until
    the end of unloading at point d, there is a relative displacement between the
    plunger and the pump barrel, the TV is opened, and the pump begins to delivery.


    As shown in Fig. 1, the initial DC data of the well is a two-dimensional closed
    curve chart formed by the load-displacement.


    ![](img/63ea25f228d3f03c8fce71d94548c8eb_2_0.png)


    Fig. 1. The theoretical static load dynamometer card.


    Usually, two-dimensional images have more information than one-dimensional signals,
    but in the parameter learning process, the calculation quantity is too large.
    The Lanczos Algorithm (Cheng et al., 2020; He et al., 2022b) is a common method
    for compressing images. However, due to the specificity of the dynamometer card
    data, the data needs to be preparatory converted and extracted to obtain comprehensive
    DC information. As a result, this work proposes a 4S-TFS feature-extraction approach
    with time- and frequency-domain features. The major purpose of the 4S-TFS aims
    to increase the feature-extraction capabilities by gaining a wealth of knowledge
    about the working circumstances involved in various features retrieved from each
    domain while minimizing the feature-extraction computational cost.


    Fig. 2 depicts the 4S-TFS feature-extraction flowchart. (a) shows four points
    identified according to the theoretical analysis of the dynamometer card: a, b,
    c and d; i.e., the load-displacement curve is split into four segments (S1, S2,
    S3 and S4). Accurately extracting the opening and closing points of the pump valve
    is one of the key steps to extract the 4S-TFS features. According to the physical
    meaning of the opening and closing points, the opening and closing points of the
    pump valve are identified by analyzing the variation pattern of the load slope
    and time relationship curve (Zhang et al., 2021). The equation for the load slope
    K_L is

    K_L = ΔL_t / Δt = [L_t(t + 1) - L_t(t)] / Δt   (1)

    where L_t(t) is the load point of the DC at time t and Δt is the time interval
    between two adjacent points of the DC. Since the relative time intervals at the
    time of acquisition are equal, Δt can be set to 1 (Zhang et al., 2021). Specifically,
    point b is located in the region of p1 - u1 and point d is located in the region
    of p2 - u2. Points p1 and p2 are the intersection points of median load and DC
    curve, and points u1 and u2 are the intersection points of median displacement
    and DC curve. According to Eq. (1), the maximum point of load slope change is
    obtained in each region, and the points b and d can be determined. At this time,
    the loads and displacements (L_t^a, D_t^a), (L_t^b, D_t^b), (L_t^c, D_t^c), (L_t^d,
    D_t^d) are acquired for the four points a, b, c and d, respectively. Here, L_t
    and D_t denote the original load and displacement obtained by sampling with time.


    After that, the upstroke load and downstroke load are sampled using the one-dimensional
    nearest neighbor interpolation technique to generate a new load-displacement curve,
    as shown in Fig. 2(b). Here, with displacement D as the independent variable and
    load L_D as the dependent variable, a new load-displacement curve independent
    of time is obtained by one-dimensional nearest neighbor interpolation. It can
    be expressed as follows.'
