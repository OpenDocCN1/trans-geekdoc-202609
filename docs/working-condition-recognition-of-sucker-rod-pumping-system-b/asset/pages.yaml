    using a modified SVM. Zheng and Gao (2017) extracted seven geometric features
    using curvature and barycentric decomposition methods and used a continuous hidden
    Markov model as a classifier for diagnosing well operating conditions. Zhou et
    al. (2019) proposed an approximate polygon-based Fourier descriptor and adopted
    an improved RBF neural network to build a diagnostic model. Wang et al. (2021)
    suggested an intelligent recognition model based on convolutional neural network
    (CNN), which implicitly extracts features of images through convolution and pooling
    operations and accomplishes well fault diagnosis. Zhou et al. (2018) extracted
    12 DC features and 7 electrical power signal features based on mechanistic analysis,
    expert knowledge and priori information, used SVM for multi-view co-training and
    Hessian regularization to achieve pumping well working state identification. Pan
    et al. (2021) suggested a decision fusion method based on online Bayesian techniques
    and Bayesian probability formulations for the unsupervised fault detection of
    oil-pumping units. The above research focuses on improving the characterization
    capability of features and the classification performance of models to improve
    diagnostic results.


    However, two challenges are encountered in actual sucker rod pumping systems.
    (i), deep learning-based well condition recognition methods usually use the DC
    as an image for feature extraction and classification (Song et al., 2023; Yin
    et al., 2023; Zhao et al., 2017). Different from a normal image containing complex
    information, the dynamometer card consists of a closed curve with only load and
    displacement data. The DC is input to the deep neural network as an image for
    model training, which further increases the computational effort. (ii), different
    SRPSs in the oil field have different system parameters, and the same SRPS generates
    different DCs at different moments, so the data have a certain degree of heterogeneity,
    which may affect the accuracy of diagnosis to some extent. The current working
    condition recognition of SRPS based on DCs either relies on extracting features
    from the DCs and then using classifiers to automatically classify the features
    (Lv et al., 2021c; Ye et al., 2020; Zhou et al., 2019), or inputting the DCs as
    an image into a deep neural network for working condition diagnosis (Song et al.,
    2023; Yin et al., 2023; Zhao et al., 2017). Additionally, methods such as dictionary-based
    transfer learning (Zhang and Gao, 2019), meta learning (He et al., 2023a), and
    meta-transfer learning (Zhang et al., 2022) have been used to solve the problem
    that different SRPSs in the oilfield have different system parameters resulting
    in training data that do not have similar distributions, and have achieved good
    results in working condition recognition. However, all the above methods use individual
    DC data for analysis, while the DC shape of oil wells changes slowly with time,
    and the heterogeneity of well data is usually ignored. At present, little research
    has been mentioned on the heterogeneity of oil well data.


    Therefore, efficient feature extraction to reduce the input dimensionality of
    the depth model and suppress the heterogeneity of well data are worthy of investigation.
    Based on the above analysis, a fault diagnostic approach based on 4S-TFSM-CNN
    is proposed in this paper. 4S-TFSM-CNN includes two steps: feature extraction
    and working condition detection. In this method, a 4S-TFS feature is proposed
    to extract the graphical features of the DC, which can significantly reduce the
    computing power requirements compared with the image method. However, the issue
    of heterogeneity of well data is still ignored. A new data fusion method, 4S-TFSM,
    is introduced to solve the data heterogeneity problem. Specifically, the data
    heterogeneity is suppressed by enhancing the feature differences between different
    types of samples by subjecting multiple 4S-TFS to relative normalization and matrix
    computation. Finally, a specifically designed CNN is introduced to extract key
    features from 4S-TFSM for oil well working condition detection.


    In summary, the following contributions are made in this paper.


    +   1. To address the issue of high computational complexity due to the input
    of the DC as an image to the neural network, a 4-segment time-frequency signature
    (4S-TFS) extraction technique is suggested to perform feature extraction while
    compressing the data.

    +   2. Considering the heterogeneity problem of the well data, a 4S-TFSM method
    is proposed to enhance the feature differences between different types of samples
    by relative normalization and matrix computation.

    +   3. For the selection of features, the features that are sensitive to the working
    condition categories are automatically selected by deep learning algorithms.


    The remainder of this work is arranged in the following manner. The studies related
    to our research are reviewed in Section 2. The suggested working condition identification
    methods are introduced in Section 3. The experimental comparisons are reported
    in detail in Section 4. Section 5 summarizes the conclusions and future research
    of the paper.


    # 2. Related works


    The working condition recognition of SRPS is a typical classification problem,
    and there are many methods of working condition recognition of pumping machines.
    Feature extraction and the classifier selection are the major dependencies of
    the pumping machine working condition identification method. Liu et al. (2021)
    used improved Fourier descriptors for feature extraction and SVMs for pumping
    well fault diagnosis. Chen et al. (2021a) extracted 16 features by combining the
    working mechanism of the sucker rod pump and identified the operating state of
    the sucker rod pump using the XGBoost algorithm with high generalization capability.
    Han et al. (2022) extracted five feature vectors with Freeman chain codes, and
    employed an optimized density peak clustering (DPC) method and an improved brainstorm
    optimization (BSO) algorithm to achieve online diagnosis.


    The feature-extraction step is critical in the defect diagnosis procedure. High-quality
    features can ensure efficient and accurate working condition identification. Although
    Fourier descriptors (Zhou et al., 2019), curvilinear moments (Li et al., 2013a),
    wavelet transforms (Tagirova et al., 2021), statistical features (Zheng et al.,
    2019b), and other techniques have been used to extract DC features, these approaches
    still suffer from computational complexity, sensitivity to noise, and high feature
    dimensionality. Therefore, powerful feature-extraction methods with high computational
    efficiency and low feature dimensionality need to be investigated (Han et al.,
    2022).


    In recent years, deep learning-based fault diagnosis methods represented by CNNs
    have been proposed for the identification of working conditions in SRPSs. Compared
    with methods such as random forest (RF), k-nearest neighbors (k-NN), spectral
    clustering (Li et al., 2015), and density peak clustering (DPC) (Wang et al.,
    2019), deep learning techniques show extremely strong pattern mining ability in
    environments with a large number of features, low sensitivity and complex data
    types, and are widely used in object detection (Yang et al., 2022), image recognition
    (He et al., 2023b), behavior prediction (He et al., 2022a), 3D reconstruction
    (Lee et al., 2021), visual relocalization (Chen et al., 2021b), and other fields.
    In addition, deep learning-based methods can also use deep neural networks to
    automatically extract image features from DCs. Zhao et al. (2017) developed image-based
    CNN and data-based-CNN approaches, and experiments revealed that recognition accuracy
    of CNN-based methods is higher than that of machine'
