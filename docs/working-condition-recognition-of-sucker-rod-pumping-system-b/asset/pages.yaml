    However, different SRPSs in the oil field have different system parameters, and
    the same SRPS generates different DCs at different moments, so the data have a
    certain degree of heterogeneity, which may affect the accuracy of diagnosis to
    some extent. For the problem of heterogeneous data among oil wells, Lv et al.
