    # 3.2. 4S-TFSM construction


    Once the 4S-TFS features of a single DC have been extracted, the 4S-TFSM of the
    oil well DC data can be constructed. The sensors collect data at a certain time,
    and it is a common practice to generate $l$ DCs of these data according to the
    production cycle of the plunger pump, as shown in Fig. 3(a). The method we use
    is to form a 4S-TFSM with $l$ DCs. As shown in Fig. 3(d), the signature matrix
    $M_i$ of the $i$th segment $F$ is generated with $l$ DCs, in particular, by the
    inner product between the $l$ feature vector pairs of $F$. It can be expressed
    as


    $M_i=S_i^1\cdot S_i^2\cdot S_i^3\cdot\ldots\cdot S_i^l$ \hfill (11)


    $l=2,4,6,8,\ldots$ \hfill (12)


    The dimension of $M_i$ is $J\times J$, which is $23\times23$ in this paper. Clearly,
    the TFSM of each segment $M_i$ is symmetric about the major'
