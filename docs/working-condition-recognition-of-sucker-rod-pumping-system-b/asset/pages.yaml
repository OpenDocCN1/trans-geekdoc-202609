    What exactly is the reason for the difference in recognition accuracy? Which types
    of working conditions are more difficult to distinguish? We visualize the dataset
    to better understand the data structure. The t-distributed stochastic neighbor
    embedding (t-SNE) methodology is a recently developed dimensionality reduction
    method that is frequently used to visualize data. t-SNE can integrate high-dimensional
    data in two- or three-dimensional space, allowing related objects in the high-dimensional
    space to approach each other in the low-dimensional space (Zhao et al., 2017).
    Fig. 9 shows the scatter plot of the sample data after it has been embedded in
    two-dimensional space.


    The data in categories 1 (SVL), 2 (NOC), and 6 (TVL) are depicted as reasonably
    independent clusters in Fig. 9, which means that these categories may be relatively
    easy to identify and classify. Other types of samples, become entangled and mixed
    together, making it impossible to distinguish between them. For example, category
    0 (ILS) and category 3 (GIF) are almost indistinguishable in


    ![](img/63ea25f228d3f03c8fce71d94548c8eb_9_0.png)


