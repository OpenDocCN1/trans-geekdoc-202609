    # 2.4. Semi-supervised labeling via optimized FCM


    As name implies, supervised learning is a tradeoff between supervised and unsupervised
    learning, which aims to maximize the full value of labeled dataset for tuple recognition.
    The semi-supervised learning aims to expand the limited part of tuples by instead
    of establishing a mapping between input-output pairs in supervised learning or
    clustering a pattern among inputs with prior knowledge (i.e., known label), revealing
    its better reliability in terms of clustering results. For instance, it is a common
    phenomenon in semi-supervised learning that labeled data are widely accessible
    while unlabeled data are scarce and expensive. In many other cases, it is hard
    to train a classifier with semi-supervised learning to improve the number of tuples
    for recognition with better applicability for practical design.


    In this branch, of the proposed framework GTF, a novel semi-supervised labeling
    method is proposed through using optimized FCM. Specifically, the unlabeled and
    pseudo-labeled data generated by optimized FCM are introduced and together to
