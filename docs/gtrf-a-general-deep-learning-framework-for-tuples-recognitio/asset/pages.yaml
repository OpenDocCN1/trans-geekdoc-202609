    # 2. Methodology of the proposed GTRF


    # 2.1. Overview of GTRF


    Having the essential features of input proposed in mind, this study proposes a
    general tuples recognition framework (GTRF) towards multi-level supervision paradigms.
    Fig. 2 depicts the schematic design of the proposed GTRF methodology. In the general
    framework, a novel feature extraction method is proposed to signify representation
    learning through deep autoencoders. On this basis, a feature is described via
    error reconstruction of all, in a series of pattern-features (PSFs) are defined
    and calculated. In particular, three alternatives are designed towards diverse
    recognition paradigms: supervised, unsupervised, and semi-supervised. Unsupervised
    clustering pattern is followed through optimized fuzzy-FCM algorithm in UL paradigm
    and semi-supervised pattern through optimized FCM algorithm in SSL. Fig. 3 demonstrates
    the workflow of proposed framework GTRF, the detailed architecture and mechanism
    of which are elaborated subsequently.


    ```

    $E(x) = \sigma(W_e x + b_e)$

    ```


    ```

    $D(h) = \sigma(W_d h + b_d)$

    ```


    where $\sigma$ denotes the activation function for the encoder and decoder, such
    as ReLU, softmax and sigmoid function. $W$ refers to the weights, $b$ refers to
    the biases between the input and output layers of the encoder and decoder respectively.


    # 2.2. Representation learning and feature extraction


    A DAE learns for reconstruction from input x to output while minimizing the reconstruction
    error via backpropagation optimization of weight matrices and biases, which is
    measured by how much $y$ differs from $x$. In most situations, the reconstruction
    metric is $L = ||y - \hat{y}||^2$. Therefore, searching for the optimal autoencoder
    is basically transformed into a least-squares issue:


    ```

    $min_{\theta} \sum_{i=1}^{n} ||y_i - \hat{y}_i||^2$

    ```


    which can be achieved by any mathematical optimization technique such as widely
    gradient descent.


    A system can automatically fulfill the requirements for feature detection or classification
    from raw data using a set of machine learning algorithms called representation
    learning (i.e., feature learning), which eliminates the need for manual feature
    engineering and enables machines to learn the features themselves and obtain representations
    for specific tasks. Therefore, deep autoencoder


