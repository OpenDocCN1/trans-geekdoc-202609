    445 个压电传感器。采样频率为 2MHz，每个长度为 32700 到 327。该任务构建侧重于对这些信号进行模糊聚类，以以无监督的方式识别损伤状态。


    钢筋混凝土（RC）梁的健康监测一直是一个重要领域。其中，球形智能集料（SSA）（Kong 等，2016；Gao 等，2018；Gayakwad 和 Thiyagarajan，2022）作为一种嵌入式多功能压电传输器，因其响应迅速且与混凝土良好的兼容性而受到关注。然而，在本研究中，在
    GTRF 的无监督范式下基于压电信号的 RC 梁模糊损伤检测。


    ## 3.2. 数据采集与准备


    首先，将原始信号从长度 32700 下采样到 327 并进行归一化。DAE 的架构被重构为三个维度分别为 256、128 和 64 的编码块，以及接近 124
    和 256 的解码块，其他定义（如激活函数）遵循标准范式。DAE 经过训练以进行重构。在本研究中，交替使用 MSE、ORSRS 和 ORR 识别 PFSs。所有不同方法的
    PSF（例如聚类结果）的集成如图 12 所示。


    在本研究中，对欠配筋混凝土梁进行了实验特征，并在操作前用钢筋进行加固以防止移动。固化后，对 RC 梁进行了基于点的测试。如图 1(a) 所示，使用测杆和液压电极在支撑处测量了信号。使用静电伺服执行器施加测试负载。


    从聚类结果来看，聚类与真实标记样本保持一致，但某些样本仍被分配到错误的聚类。为了阐明这些低确定性聚类方法的影响，本研究提出了成员身份方法。图 13 描述了
    FCM 结果的分布，其中所有 PSF 表现出不同的特征。250 个 PSF 的分布表现出明显的特征。


