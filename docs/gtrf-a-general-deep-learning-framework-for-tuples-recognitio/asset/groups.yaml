    ## 2. 所提 GTRF 的方法


    ### 2.1. GTRF 概述


    考虑到所提出的输入的本质特征，本研究提出了一种面向多层级监督范式的通用组识别框架（GTRF）。图 2 展示了所提 GTRF 方法的原理图设计。在通用框架中，提出了一种新的特征提取方法，通过深层自动编码器来表示表示学习。在此基础上，通过所有内容的误差重构来描述特征，并定义并计算了一系列模式-特征（PSFs）。具体而言，针对不同的识别范式设计了三种替代方案：监督、无监督和半监督。UL
    范式中通过优化的模糊-FCM 算法遵循无监督聚类模式，SSL 范式中通过优化的 FCM 算法遵循半监督模式。图 3 展示了所提框架 GTRF 的工作流，其详细架构和机制将在后文中阐述。


    ```

    $E(x) = \sigma(W_e x + b_e)$

    ```


    ```

    $D(h) = \sigma(W_d h + b_d)$

    ```


    其中 $\sigma$ 表示编码器和解码器的激活函数，如 ReLU、softmax 和 sigmoid 函数。$W$ 指权重，$b$ 分别指编码器和解码器输入层与输出层之间的偏置。


    ### 2.2. 表示学习与特征提取


    DAE 通过权重矩阵和偏置的反向传播优化学习从输入 $x$ 到输出的重构，同时最小化重构误差，该误差通过 $y$ 与 $x$ 之间的差异来衡量。在大多数情况下，重构指标是
    $L = ||y - \hat{y}||^2$。因此，寻找最优自动编码器基本上转化为一个最小二乘问题：


    ```

    $min_{\theta} \sum_{i=1}^{n} ||y_i - \hat{y}_i||^2$

    ```


    这可以通过任何数学优化技术（如常用的梯度下降）来实现。


    系统可以使用称为表示学习（即特征学习）的机器学习算法自动满足从原始数据进行特征检测或分类的要求，这消除了对人工特征工程的需要，并使机器能够学习特征本身并获取特定任务的表示。因此，深度自动编码器


    以推导的方法和 DAE 为主，很容易理解，对于具有不同类别的给定级别组（即不同层次），重构质量将改变到多层级的程度。在这里，通过量化指定组原始信号与重构信号之间的差异，并将其编译到训练的
    DAE 中，提取模式敏感特征（PSFs）是可行的。


    # 人工智能工程应用 124 (2023) 106500


    ![](img/b870c5b60726fe1419b8031bac09c225_3_0.png)


    ![](img/b870c5b60726fe1419b8031bac09c225_3_1.png)


    为了评估原始信号与重构之间的差异，该框架定义了重构量化指标，这些指标针对设计实现中的自适应选项进行了定义。四个基本的 PSF 定义为均方误差（MSE）、原始-重构信号比（OSSR）（Kumar
    等人，2023）、相关系数（CORR）（Papagorgiou，2022）和余弦相似度（Vin 和，2022）。因此，MSE 是比较两个序列最简单的，其值可以用于衡量整体重构了多大程度上。OSSR
    定义为原始信号和重构信号的平方之比，源于信噪比的能量。CORR 定义为特征协方差矩阵与标准差之比，它估计了两个组之间的线性相关性（Jurkò 等人，2022）。对于
    COST，它定义为两个向量之间夹角的余弦，这些向量被视为内积空间中的向量（Sinha，2009）。涉及的数学函数表示如下：


    $MSE = \frac{1}{n}\sum_{i=1}^{n}(x_i-y_i)^2$ (4)


    # 人工智能工程应用 124 (2023) 106950


    ```

    $ORSR = \log_{10} \frac{\sum_{i=1}^{n} x_i^2}{\sum_{i=1}^{n} y_i^2}$ (5)

    ```


    ```

    $CORR = \frac{\sum_{i=1}^{n} (x_i - \mu_x)(y_i - \mu_y)}{\sqrt{\sum_{i=1}^{n}
    (x_i - \mu_x)^2 \sum_{i=1}^{n} (y_i - \mu_y)^2}}$ (6)

    ```


    ```

    $COST = \frac{\|X-Y\|}{\|X\|+\|Y\|} = \frac{\sqrt{\sum_{i=1}^{n} (x_i - y_i)^2}}{\sqrt{\sum_{i=1}^{n}
    x_i^2}+\sqrt{\sum_{i=1}^{n} y_i^2}}$ (7)

    ```


    其中 $\eta$ 表示信号密度，$\mu_x, \mu_y$ 表示原始和重构坐标的值，支持向量。


    同样注意到，除了上述基本 PSF 之外，在实际情况下可以极具灵活性地推导出其他指标，例如均方根误差（RMSE）和平方和（SSS），它们的定义如下：


    ```

    $RMSE = \sqrt{\frac{1}{n}\sum_{i=1}^{n} (x_i - y_i)^2}$ (8)

    ```


    ```

    $SSS = \sum_{i=1}^{n} (x_i - y_i)^2$ (9)

    ```


    由此，获得了一系列代价贵的 PSF，这些 PSF 对于多级监督的下游聚类是有用的。在不失一般性的情况下，本文中的 PSF 函数对于下游聚类是可选的，但其他衍生可以根据无监督组特征重构它们的
    PSF。


