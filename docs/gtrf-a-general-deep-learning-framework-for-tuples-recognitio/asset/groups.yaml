    # # GTRF: A deep learning framework for tuples recognition towards supervised,
    semi-supervised and unsupervised paradigms


    Qingsong Xue*, Chen Yuan*, Bin He†, Haixei Xiong*, Qingzhao Gao a,b*


    +   * Department of Mitigation for Structures, Tongji University, Shanghai, China

    * Shanghai Research Institute for Intelligent Autonomous Systems, Tongji University,
    Shanghai, China


    # ARTICLE INFO


    # ABSTRACT


    +   Keywords:

    Deep learning

    General framework

    Supervision paradigm

    Label propagation


    Tuple, featured sequences of elements are one of the most prominent data structures
    in structural health monitoring (SHM). Activated by powerful capabilities of deep
    learning (DL) techniques, the DL-driven tuple recognition has faced penalty problems
    in SHM by mapping tuples to patterns with supervised deep feature extraction strategies.
    This paper develops a novel General Tuple Recognition framework (GTRF) towards
    supervised (SL), semi-supervised (SSL) and unsupervised (US) paradigms. In the
    framework, we present a quantitative feature extractor for downstream label propagation
    via an optimized clustering algorithm in SL, SSL, and US. With sophisticated networks
    and explicit voxels embedded, the GTRF is competent for various tuple recognition
    tasks in real-world SHM scenarios. Multi-level extractive implementation strategy
    were conducted for validations, in vibration SHM-classification of a prototype
    gearbox, damage detection-of a RC beam and condition assessment of a steel bridge.
    The results demonstrate the effectiveness and efficiency of proposed GTRF against
    comparable methods in recognition accuracy and model flexibility. Practical scalability,
    the proposed GTRF can be a promising bridge for the gap between DL algorithms
    and models of different learning paradigms.


    ![](img/b870c5b60726fe1419b8031bac09c225_0_1.png)


    # 1. Introduction


    In the broader field of machine learning techniques, deep learning (DL), also
    known as deep learning on the basis of representation via artificial networks,
    is regarded as one of the most powerful and promising solvers in multi-task learning.
    With the implementation of attention patterns in supervised (SL), semi-supervised
    (SSL) and unsupervised (US) learning, DL has achieved success in various domains,
    including natural language processing (Gualessi et al., 2021), computer vision
    (Thirivathual and Liu, 2022), semantic recognition (Nanemi et al., 2022), signal
    denoising (Xiong et al., 2023), medical image analysis (Guan and Liu, 2022), structural
    diagnosis and prognosis. In recent, the strategy of exploring the effectiveness
    and reliability of DL techniques to some relevant data or processing (i.e., typically
    multi-label classification, clustering theory or regression) in the context of
    corresponding engineering tasks is demonstrated as follows.


    With hereto, the notable spring of intelligent structural health monitoring (SHM)
    towards Smart city (Gurey et al., 2021) and Davis Yuan et al., 2021) in recent
    decades, has been driven by the measurement research for the purpose of structural
    health assessment and damage detection (Fan et al., 2021; Gadhabi et al., 2021;
    Olson et al., 2022; Tok and Park, 2020). The collected measured data from various
    sources (such as mechanical accelerometers Brown-John, 2021) and piezoelectric
    sensors Ma et al., 2020) enable the monitoring of specific structural parameters
    (i.e., damage index, damage conditions, and corresponding measurement segment).
    In this regard, it is widely understood that the performance relies heavily on
    the source measuring data (i.e., signal fidelity due to noise contamination, accuracy
    of the labels, and feature extraction techniques) during the DL task. Therefore,
    the powerful capability and reliability of DL algorithms as well as the working
