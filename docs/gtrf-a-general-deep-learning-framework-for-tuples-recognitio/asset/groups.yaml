    In order to evaluate the discrepancy between the original signals and the reconstruction,
    this framework defines indicators of reconstruction quantification, which are
    defined for adaptive options in design implementation thereof. Four basic PSFs
    are defined as mean square error (MSE), original-reconstructed signal ratio (OSSR)
    (Kumar et al., 2023), correlation coefficients (CORR) (Papagorgiou, 2022), and
    cosine similarity (Vin and,, 2022). Therefore, MSE is simplest to compare two
    sequences, and its value may be used to gauge how much


    of a reconstruction went overall. OBSR is defined as the ratio of the quantitative
    square of the original and reconstructed signals which is derived from the energy
    of signal-to-noise ratio. CORR is defined as the ratio of the feature covariance
    matrix and the standard deviation, which estimates the linear correlation between
    two tuples (Jurkò et al., 2022). With regard to COSS, it is defined as the cosine
    of the angle between two vectors, which are viewed as vectors in an inner product
    space (Sinha, 2009). The involved mathematical functions are expressed as follows:


