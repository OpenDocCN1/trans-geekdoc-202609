    # GTRF：一种面向监督、半监督和无监督范式的元组识别深度学习框架


    Qingsong Xue*, Chen Yuan*, Bin He†, Haixei Xiong*, Qingzhao Gao a,b*


    + * 同济大学结构防木系，上海，中国

    * 同济大学智能自主系统研究所，上海，中国


    # 文章信息


    # 摘要


    + 关键词：

    深度学习

    通用框架

    监督范式

    标签传播


    元组（Tuple）是元素的特征化序列，是结构健康监测（SHM）中最显著的数据结构之一。受强大的深度学习（DL）技术驱动，深度学习驱动的元组识别通过监督深度特征提取策略将元组映射到模式，在
    SHM 中面临着惩罚问题。本文开发了一种面向监督（SL）、半监督（SSL）和无监督（US）范式的通用元组识别框架（GTRF）。在该框架中，我们提出了一种在
    SL、SSL 和 US 中通过优化聚类算法为下游标签传播提取的量化特征提取器。通过嵌入复杂的网络和显式体素，GTRF 能够胜任真实 SHM 场景中的各种元组识别任务。通过多级提取实现策略，对原型齿轮箱的振动
    SHM 分类、钢筋混凝土梁检测以及钢桥状态评估进行了验证。结果表明，所提出的 GTRF 在识别准确性和模型灵活性方面与对比方法相比具有有效性和高效。由于良好的实用扩展性，所提出的
    GTRF 可以成为深度学习算法与不同学习范式模型之间通的桥梁。


    ![](img/b870c5b60726fe1419b8031bac09c225_0_1.png)


    # 1. 引言


    在更广泛的机器学习技术领域，深度学习（DL），也称为基于人工网络表示的深度学习，被认为是多任务学习中最强大且最具前景的求解器之一。通过在监督（SL）、半监督（SSL）和无监督（US）学习中实现注意力模式，DL
    在多个领域取得了成功，包括自然语言处理（Gualessi et al., 2021）、计算机视觉（Thirivathual and Liu, 2022）、语义识别（Nanemi
    et al., 2022）、信号去噪（Xiong et al., 2023）、医学图像分析（Guan and Liu, 2022）、结构诊断与预报。近期，在相应的工程任务背景下探索
    DL 技术对某些相关数据或处理（即典型的多标签分类、聚类理论或回归）的有效性和可靠性的策略所示如下。


    就此，几十年来，智能结构健康监测（SHM）向智慧城市（Gurey et al., 2021 和 Davis Yuan et al., 2021）的显著发展，受到用于结构健康评估和损伤检测的测量研究的驱动（Fan
    et al., 2021; Gadhabi et al., 2021; Olson et al., 2022; Tok and Park, 2020）。从各种来源（如机械加速度计
    Brown-John, 2021）和压电传感器 Ma et al., 2020）收集的测量数据能够监测特定的结构参数（即损伤指数、损伤状况和相应的测量段）。对此，人们广泛认为性能在很大程度上取决于
    DL 任务期间源测量数据（即由于噪声污染导致的信号保真度、标签准确性和特征提取技术）。因此，DL 算法的强大能力和可靠性以及 DL 方法的工作原理对于智能大学，上海，中国。


