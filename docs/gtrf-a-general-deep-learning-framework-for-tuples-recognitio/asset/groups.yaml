    在一般情况下，实验分析涉及来自加速度测量和压电信号的多种数据形式，以研究数据形式的多样性。值得注意的是，所有涉及的实验技术信号均为原始“原始”信号，不需要进行去噪预处理。


    值得注意的是，作为一个通用框架，GTTRF 中的架构（即 DAE 的层堆叠）、设计（即多个 PSF）和分配（即各种分类算法）可以进行设置和调整，以更好地适用于目标任务的实现。随后将详细阐述每种范式验证的数据收集、框架规范和实验实现。


    ## 3.1. 监督范式：基于加速度计测量的振动识别


    在 SHM 的实际工程中，高层结构在不同环境下的振动识别对于结构振动控制和健康监测具有重要意义


    对于包含 N 个未标记点和 M 个标记点且预期聚类数为 c 的数据集，优化 FCM 算法公式如下：


    对于 N-M 未标记点的数据：


    步骤1：初始化初始聚类模式并计算每个簇 $\Gamma_j, j=1..2..c-1$ 的质心 $m_j$


    ```

    $m_j = \frac{1}{N} \sum_{y \in \Gamma_j} y$

    ```


    步骤2：计算聚类函数 $J_k$ 作为聚类准则，其定义为样本点与类质心之间的欧式距离


    ```

    $J_k = \sum_{j=1}^{c} \sum_{y \in \Gamma_j} \|y - m_j\|^2$

    ```


    ```

    $\Gamma_i = \{y | \|y - m_i\|^2 \le \|y - m_j\|^2\}, \forall j=1,2..c$

    ```


    步骤4：更新步骤直到迭代达到收敛，获得最终的 (c-1) 个簇和质心。


    步骤5：计算并对每个簇的点与质心之间的欧式距离进行排序，在此基础上保留对应质心的前75% 的点，获得带有伪标签的样本


    ```

    $\Gamma_{i^*} = \{y_i^*\}, \forall i=1,2..c-1$

    ```


    结束


    对于 M 标记点和 N-M 未标记点 $\Gamma_{i}^*$ 的数据：


    步骤6：将 $y_i$ 和 $\Gamma_{i}^*$ 合并，获得多标记数据集。


    步骤7：使用真实或伪标签拟合混合数据集以训练监督分类器。

    训练好的模型在此后预测其他点的标签。


    > 结束

