    # Discussion


    The aforementioned three experiments have evaluated the effectiveness of GTRF
    framework in representative tasks in SH, UL, and SL. In particular, the detailed
    workflow of mechanisms integrated into the framework was established. Noting the
    fact that measured data in SH are in the form of a tuple (time, order of elements),
    such as recognition features and piezoelectric signals allows validations in the
    present setting. Our proposed GTRF is suitable for recognition tasks towards UL
    and SL. Here, three experiments in practice provided comprehensive evaluations,
    which confirmed the competitive performance of the proposed GTRF.


    In this section, we discuss the mechanism of clustering on the extracted features
    (spatial features) based on the spatial distribution, which is point-to-point.
    It is natural to note that the algorithm used for clustering used here is also
    utilized in this study. Moreover, it is also worth noting that the content of
    the data could be better qualified for future if the clusters are formed through
    fuzzy similarity comparisons to create clusters (or classes) capable of optimizing
    the association between clusters.


    Particular, with such superiority for heterogeneous data and great space for optimization,
    the proposed framework can be transferred and united into other domains, such
    as vision tasks. To this regard, the proposed GTRF framework can be regarded as
    a bridging for the DL algorithms and model integration in different learning paradigms.
    Our methods and comparisons are based on physics-informed networks, as well as
    future clustering strategies in place of proposed FCM algorithms can be optimized
    in future.


    # Conclusions


    This study presents a general Title General Recognition Framework (GTRF) towards
    supervised (SL), unsupervised (UL) and semi-supervised (SSL) learning paradigms.
    The sophisticated network design and embedding method were established. Comprehensive
    experimental evaluations of these representative tasks implementation in SH practice
    were confirmed in this study. Our main conclusion and conclusions are as follows:


    +   (1) A general framework for various recognition tasks in diverse learning
    paradigms provides recognition of measures or lengths of values which was successfully
    detected. The efficiency and generalizability of the GTRF were confirmed by experimental
    evaluations, as well as comparable comparison in recognition and adaptability.
    Its flexible paradigm design, model adaptability and great space for optimization
    ensure the proposed GTRF framework can be prominently as a bridging for the gap
    of DL algorithms and model integration in future.


    +   (2) A robust feature extractor was based on representation learning by deep
    autoencoder (DAE). Its-pattern features were verified via deconstruction enforced
    by DAI. The comprehensive validated evaluations proved that MSE based GTRF could
    extract effective features with satisfactory performance.


    +   (3) The vibration recognition of a prototype scraper was conducted to validate
    the SL paradigm in GTRF, with a comparison against existing methods. The accuracy
    of the proposed GTRF achieved 0.95, exhibiting an extensive study in terms of
    recognition accuracy and computational efficiency has adopted.


    (4) A optimized FCM algorithm with a filtering method was embedded for the fuzzy
    data detection on a laboratory RC beam was utilized. The overall accuracy reached
    0.84 with the fuzzy recognition reached 0.9, which is highly effective in fusing
    recognition tasks.


    (5) A robust pseudo-labeling method was used in GTRF for the building model. The
    condition assessment of a fuzzy-based machine shaking test table was tested. An
    accuracy of 0.86 was achieved by parallel experiments and verified by the method
    signal channel, suggesting a superior adaptability and promotion for condition
    assessment in extensive settings.


