  \ Comprehend，这是一个基于云的自然语言处理服务，您可以将其集成到应用程序中分析文本文档的内容。\n\n* **Amazon Lex (第 14 章)**\
  \ 本章介绍了 Amazon Lex，这是一种基于云的服务，您可以用它创建机器人并将其集成到应用程序中。\n\n* **Amazon Machine Learning\
  \ (第 15 章)** 本章介绍了 Amazon Machine Learning，这是一项全托管的云服务，您可以使用它在任何编程的情况下构建和部署简单的机器学习模型。\n\
  \n* **Amazon SageMaker (第 16 章)** 本章介绍了 Amazon SageMaker，这是一种基于云的机器学习服务，可用于训练和部署内置以及自定义的机器学习模型。\n\
