  \  `https://github.com/asmtechnology/awsmlbook-chapter17.git`\n\n# 总结\n\n* TensorFlow\
  \ 是由 Google 创建的机器学习库，最初由 Google Brain 团队用于内部开发，随后于 2015 年 11 月以 Apache 许可证作为开源项目发布。\n\
  * TensorFlow 要求你将计算问题建模为一种称为计算图的树结构，由节点和叶子节点组成。\n* 常量叶子节点（也称为常量张量）是一个值在赋值后就无法更改的张量。\n\
  * 变量叶子节点（也称为变量张量）是一个值随程序执行而可以更改的张量。\n* 占位符叶子节点（也称为占位符张量）是一个特殊节点，在评估图时必须向图中馈入张量值。\n\
  * 人工神经网络（ANNs）是 Warren McCulloch 和 Walter Pitts 在 1943 年开发的计算工具，其设计灵感源于生物神经网络。\n\
  * TensorFlow Python API 结构化为一系列层，最顶层层被称为 Estimators API。\n* Estimators 层中的对象提供了通过单个\
  \ Python 语句创建整个神经网络的能力。\n* 你可以在 Amazon SageMaker 上训练并部署使用 Estimators API 的机器学习模型。\n\
  \n# 第 18 章\n\n## Amazon Rekognition\n\n### 本章内容\n\n* Amazon Rekognition 服务介绍\n*\
  \ 使用 Amazon Rekognition 管理控制台\n* 使用 AWS CLI 与 Amazon Rekognition 交互\n\n\n\n\n\n\
  ## 从 AWS Lambda 调用 Amazon Rekognition API\n\nAmazon Rekognition 是一种完全托管的 Web 服务，提供用于图像和视频分析的深度学习模型访问。使用\
  \ Amazon Rekognition，你可以创建能够分析图像和视频内容的项目，以实现如目标检测、目标定位、场景分析、活动检测和内容过滤等功能。在本课程中，你将学习如何从管理控制台、AWS\
  \ CLI 和 AWS Lambda 函数使用 Amazon Rekognition API。\n\n**注意** 为了跟随本章节，请确保你已经创建了附录 B\
  \ 中列出的 `S3` 存储桶。\n\n你可以从 `www.wiley.com/go/machinelearningawscloud` 或通过以下 URL 链接从\
  \ GitHub 下载本章节的代码文件：\n\n`https://github.com/asmtechnology/awsmlbook-chapter18.git`\n\
  \n## 核心概念\n\n在本节中，你将学习在处理 Amazon Rekognition 时遇到的一些核心概念。\n\n### 目标检测 (Object Detection)\n\
  \n目标检测是计算机视觉领域的一个分支，侧重于创建算法，允许计算机分析数字图像的内容并列出图像中发现的物体列表。传统上，这些算法依赖于一个模板物体数据库，并使用匹配技术将数据库中的模板与图像内容进行匹配。深度学习的最新进展使得更可靠、更稳健的算法产生。使用\
  \ Amazon Rekognition 进行目标检测会得到一组描述图像内容的字符串标签，这在 Amazon Rekognition 中被称为标签检测（label\
  \ detection）。\n\n### 目标定位 (Object Location)\n\n目标定位是计算机视觉领域的一个分支，它基于目标检测算法，并提供图像中发现的物体的位置信息。该位置通常指定为相对于图像某一个顶角的边界框（bounding\
  \ box）。\n\n### 场景检测 (Scene Detection)\n\n场景检测（也称为场景描述）是人工智能领域的一个分支，尝试在目标检测和定位算法结果的基础上，对数字图像生成文本描述。例如，目标检测算法可能会检测出图像中的一个人和一辆自行车。随后，目标定位算法将定义这些物体在图像中的边界框。场景检测算法可以使用这些结果将场景描述为“一个男人在晴朗的日里骑着自行车”。使用卷积神经网络（`CNNs`）进行场景检测是一个活跃的研究领域。\n\
  \n### 活动检测 (Activity Detection)\n\n活动检测是人工智能领域的一个分支，尝试创建算法通过逐帧分析视频帧的内容，并对视频中发生的活动给出描述。活动检测与场景检测的主要区别在于，场景检测针对单张孤立图像工作，而活动检测检查的是一系列图像（序列）。\n\
  \n### 人脸识别 (Facial Recognition)\n\n人脸识别算法尝试检查数字图像（或视频流）以检测并定位已知的人脸。这些算法的识别部分要求算法能够访问人脸数据库，并且仅尝试定位数据库中存在的人脸。人脸通常作为训练操作的一部分添加到数据库中。在过去，人脸识别的主要算法涉及使用\
  \ Haar 小波描述符；然而，今天人脸识别的主要方法涉及使用卷积神经网络，它产生的准确率已接近人类在识别相同面部时达到的水平。\n\n### 人脸集合 (Face\
  \ Collection)\n\n人脸集合是一个描述人脸的索引信息容器。人脸集合用于配合实现人脸识别的 Amazon Rekognition API（例如 `DetectFaces`）。\n\
  \n### API set 集 (API Sets)\n\nAmazon Rekognition 提供了两组 API：Amazon Rekognition Image\
  \ APIs 和 Amazon Rekognition Video APIs。正如名称所示，这些 API 分别用于单张图像或视频。两组 API 的输入和输出都是\
  \ JSON 对象；然而，Amazon Rekognition Image APIs 是同步的，而 Amazon Rekognition Video APIs\
  \ 是异步的。异步 API 操作允许你通过调用初始化 API（如 `StartFaceDetection`）启动操作，然后将操作的完成状态发布到 Amazon\
  \ SNS 主题。收到 Amazon SNS 的通知后，你可以针对你启动的操作类型使用获取 API（如 `GetFaceDetection`）。\n\n###\
  \ 非存储型和基于存储的操作 (Non-Storage and Storage-Based Operations)\n\n非存储 API 操作是指 Amazon\
  \ Rekognition 在分析过程中或分析结果上不持久化任何信息的操作。你提供输入图像或视频，API 操作读取输入并提供结果，而 Amazon Rekognition\
  \ 不持久化任何内容。相反，基于存储的操作会将操作结果存储在 Amazon Rekognition 内部，通常用于构建人脸集合以供后续的人脸识别操作使用。构建人脸集合的\
  \ API 是基于存储的；但实际的人脸识别 API 并非如此。\n\n### 模型版本 (Model Versioning)\n\nAmazon Rekognition\
  \ 利用深度学习 CNN 模型来实现其 API。Amazon 不断改进这些模型并频繁发布新版本。如果你正在使用 Amazon Rekognition Image\
  \ APIs，你不需要跟踪 Amazon Rekognition 使用的模型版本，因为将自动使用最新版本。然而，如果你正在使用之前构建过的人脸集合的 Amazon\
  \ Rekognition Video APIs，或者你正在向现有集合中添加人脸，你将只能使用创建集合时使用的模型版本。使用一个模型版本创建的人脸集合无法转换为（并与）不同的模型版本使用。\n\
  \n### 定价与可用性 (Pricing and Availability)\n\nAmazon Rekognition 采用按需付费模式。图像 API 的使用根据处理的图像数量收费；视频\
  \ API 的使用根据处理的视频分钟数收费。如果你在集合中存储人脸，还将根据存储的人脸数量收费。此服务包含在 AWS 免费套餐账户中。你可以在 `https://aws.amazon.com/rekognition/pricing/`\
  \ 获取定价模型的更多详情。\n\nAmazon Rekognition 并非在所有区域可用。你可以通过以下 URL 获取其可用区域信息：`https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/`\n\
  \n## 使用 Amazon Rekognition 管理控制台分析图像\n\n在本节中，你将使用 Amazon Rekognition 管理控制台对图像进行目标检测。由于其执行的操作性质，Amazon\
  \ Rekognition API 通常通过你的项目直接使用 AWS SDK 调用，或者通过响应事件触发的 AWS Lambda 函数调用。\n\nAmazon\
  \ Rekognition 管理控制台提供了一个易于使用的界面，让你对单张图像和视频序列尝试 Rekognition API。\n\n使用你开发 IAM 用户的专用链接登录\
  \ AWS 管理控制台。使用区域选择器选择可用 Amazon Rekognition 服务的区域。本节中的截图假设控制台连接到欧洲（爱尔兰）区域。点击服务菜单并访问\
  \ Amazon Rekognition 服务主页（图 18.1）。\n\n![图 18.1 访问 Amazon Rekognition 服务主页](img/c18f001.png)\n\
  \n图 18.1 访问 Amazon Rekognition 服务主页\n\n\n\n\n\n如果页面左侧的菜单不可见，请展开它，并点击 Demos 类别下的\
  \ Object And Scene Detection（对象与场景检测）链接（图 18.2）。\n\n![FIGURE 18.2 访问对象与场景演示](img/c18f002.png)\n\
  \nFIGURE 18.2 访问对象与场景演示\n\n你可以使用 Amazon 提供的示例图像之一，也可以使用自己的图像。本章使用的图像包含在随附的文件文件中。从示例图像中上传\
  \ `bicycle_01` 图像，并观察 Amazon Rekognition 检测到的对象标签列表（图 18.3）。\n\n![FIGURE 18.3 示例场景中检测到的对象标签](img/c18f003.png)\n\
  \nFIGURE 18.3 示例场景中检测到的对象标签\n\n每个标签都列出了一个 0 到 100 之间的置信度评分，置信度较高的标签位于列表顶部。当你使用管理控制台访问\
  \ Rekognition API 时，控制台会代表你创建一个 JSON 请求，并将请求发送到相关的 Rekognition 图像（或视频）API。API 的响应也是一个\
  \ JSON 对象，控制台在网页上显示标签之前会对其进行解析。\n\n你可以通过展开网页上的 Request（请求）和 Response（响应）部分来访问原始\
  \ JSON 请求和响应。此示例中的请求对象包含一个名为 `Image` 的属性，该属性包含你上传的图像文件的 Base64 编码内容：\n\n```\n{\n\
  \"Image\": {\"Bytes\": \"…\"}\n}\n```\n\n响应对象要大得多，包含了有关对象标签及其置信度评分的信息：\n\n```json\n\
  {\n    \"LabelModelVersion\": \"2.0\",\n    \"Labels\": [  {\n        \"Confidence\"\
