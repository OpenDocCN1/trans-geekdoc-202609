  \ `k` 个簇，就可以计算每个簇的数学质心并存储以供未来预测。可以计算簇质心与需要预测的新观测值之间的距离，并将最近质心对应的簇作为预测结果返回。在选择目标簇的方式上有一些变体，但总体思想保持不变。\n\
