  \ Learning 提供了。\n\n如果您希望在应用程序中使用实时预测。\n\n要在您的应用程序中使用实时预测，您需要生成实时预测端点。您将根据端点激活的小时以及提交给端点的每个预测请求付费。\n\
  \n实时预测端点仅支持美东（弗弗尼亚）和欧洲（爱尔兰）地区。\n\n可以使用 AWS CLI 和特定语言的 AWS SDK 使用实时预测端点。\n\n# 总结\n\
  \n- Amazon Machine Learning 是一种全托管的 Web 服务，允许您在无需编程的情况下创建。\n\n- Amazon Machine Learning\
  \ 不包含在 AWS 免费层中。\n\n- Amazon Machine Learning 易于使用，但提供的特征工程和模型构建能力有限。\n\n- 数据源是引用\
  \ Amazon S3 桶的对象，以及描述输入数据的特征元数据。\n\n- Schema 指输入数据的结构，通常是属性名称及其数据类型的列表。\n\n- Amazon\
  \ Machine Learning 可用于回归、二分类和多分类问题。\n\n- Amazon Machine Learning 提供了许多训练参数用于控制模型。\n\
  \n- Amazon Machine Learning 提供了描述性统计，帮助您分析输入数据。\n\n- 批量预测涉及生成包含观测值的 CSV 文件，并将观测值提交给\
  \ Machine Learning。预测结果将存储在另一个 CSV 文件。\n\n- 除了批量预测，您还可以使用 ML 模型进行实时预测。实时预测是同步的，且每次只能处理一个观测值。\n\
  \n- 要在您的应用程序中使用实时预测，您需要生成实时预测端点。您将根据端点激活的小时以及提交给端点的每个预测请求付费。\n\n- 实时预测端点仅支持美东（弗弗尼亚）和欧洲（爱尔兰）地区。\n\
  \n- 您可以使用 AWS CLI 和特定语言的 AWS SDK 使用实时预测端点。\n\n# 第 16 章 Amazon SageMaker\n\n### 本章内容\n\
  \n- Amazon SageMaker 服务介绍\n- 创建 Amazon SageMaker  notebook 实例\n- 在 notebook 实例中本地训练\
  \ Scikit-learn 模型\n- 在专用实例上训练 Scikit-learn 模型\n- 使用 Amazon SageMaker 的内置算法\n- 创建预测端点\n\
  \nAmazon SageMaker 是一个全托管的 Web 服务，提供了使用 Python 代码在 AWS 云基础设施上进行数据探索、特征工程和训练机器学习模型的能力。一旦训练好模型，就可以将其部署到专用计算实例集群上，并使用部署的模型逐个获取预测，或对整个数据集创建批量预测。\n\
  \nAmazon SageMaker 提供了许多云优化机器学习算法的实现，例如 XGBoost、因子分解机和 PCA（主成分分析），以及基于流行框架（如 Scikit-learn、Google\
  \ TensorFlow 和 Apache MXNet）创建自定义算法的能力。在本章中，您将学习如何使用 Amazon SageMaker 基于 Scikit-learn\
  \ 和内置算法来训练和部署模型。\n\n\n\n\n- **注意**：在您注册 AWS 免费账户后，Amazon SageMaker 在前两个月内是免费的。之后，您将需要为计算资源付费。\n\
  - **注意**：为了跟上本章节的内容，请确保您已创建了附录 B 中列出的 S3 桶。你可以从 `www.wiley.com/go/machinelearningaws`\
  \ 或通过 GitHub 下载本章节的代码：\n\n`https://github.com/asmtechnology/awsmlbook-chapter16.git`\n\
  \n## 概念\n\n在本节中，你将学习在使用 Amazon SageMaker 时会遇到的一些核心概念。\n\n### 编程模型\n\n你可以通过以下方法之一与\
  \ Amazon SageMaker 交互：\n\n- **Python Amazon SageMaker SDK**：这是一个 Python SDK，提供了一系列类，用于与\
  \ Amazon SageMaker 交互的常用任务，如创建训练作业和部署模型。该 Python SDK 是面向对象的，并为 Amazon SageMaker\
  \ 提供高级 API。得益于高级 API，该 SDK 中的类提供了一种控制 Amazon SageMaker 的方便机制，比使用 AWS `boto3` SDK\
  \ 提供的选项更少。\n- **AWS boto3 SDK**：这是一个 Python SDK，提供了与多个流行的 AWS 服务交互的机制，而不仅仅是 Amazon\
  \ SageMaker。AWS `boto3` SDK 提供了一个低级接口，可以从 Lambda 函数或 Jupyter Notebook 访问 Amazon\
  \ SageMaker。\n- **特定语言 SDK**：Amazon 提供了针对 Ruby 和 Java 等编程语言的特定 SDK，用于与 Amazon SageMaker\
  \ 交互。\n- **AWS CLI**：你可以使用 AWS 命令行界面通过命令行与 Amazon SageMaker 交互。\n\n### Amazon SageMaker\
  \ Notebook Instances\n\nAmazon SageMaker 允许你在账户中启动 EC2 实例，这些实例预配置了 Jupyter Notebook\
  \ 服务器、常用的 Python 库（如 Amazon SageMaker SDK、`boto3` SDK、`NumPy`、`Pandas`、`Scikit-learn`\
  \ 和 `Matplotlib`）以及多个预配置 conda 内。这些 EC2 实例被称为 Amazon SageMaker 实例，Amazon SageMaker\
  \ 管理控制台提供了对实例上运行的 Jupyter 服务器的访问。你在笔记本实例上创建的任何文件都存储在弹性块存储（EBS）卷中。\n\n这些 notebook\
  \ 实例允许你使用 `NumPy`、`Pandas` 和 `Matplotlib` 执行常见的数据科学任务，如探索和特征工程。你还可以使用 Amazon SageMaker\
  \ 实例通过编程方式创建训练作业、部署模型到生产环境并验证部署的模型。\n\n### 训练作业\n\n为了在 Amazon SageMaker 上训练模型，你需要创建一个训练作业。训练作业会在\
  \ AWS 云中创建专用计算实例，这些实例包含模型构建代码、从 S3 加载训练数据、在训练数据上执行模型构建代码并将训练好的模型保存到 S3。当训练作业完成后，支持训练过程的计算实例将自动终止。你将为训练模型所需的计算成本付费。训练作业通常是通过使用运行在笔记本实例上的\
  \ Jupyter Notebook 文件的高级 Amazon SageMaker SDK 创建的。用于训练模型的计算实例是从 Docker 镜像创建的。Amazon\
  \ SageMaker 要求模型构建代码和任何运行时库封装在具有特定文件系统的 Docker 镜像中。用于训练模型的实例计算能力取决于分配给实例的 CPU、RAM\
  \ 和 GPU。Amazon SageMaker 允许你从多个配置中进行选择。这些配置被称为*实例类型*，在使用 Amazon SageMaker SDK 创建训练作业时指定实例类型。你可以在\
  \ `https://aws.amazon.com/sagemaker/pricing/instance-types/` 获取可用训练实例类型及其相应计算能力的列表。\n\
  \n### 预测实例\n\n在使用训练作业训练模型后，你需要将其部署到生产环境才能使用它。将模型部署到生产环境涉及创建一个或多个计算实例、将模型部署到这些实例上，并提供一个可以使用部署的模型进行预测的\
  \ API。与用于训练模型的实例不同，用于预测的实例不会自动终止，你将为其活跃的时间付费。你可以使用 Amazon SageMaker 管理控制台以及 Python\
  \ Amazon SageMaker SDK 来部署你的模型。当你部署模型时，将能够指定希望配置的计算实例的数量和类型。你可以在 `https://aws.amazon.com/sagemaker/pricing/instance-types/`\
  \ 获取可用预测实例类型及其相应计算能力的列表。\n\n### 预测端点和终端配置\n\n预测端点是一个 HTTPS REST API 端点，可以从部署的模型获取单个预测。HTTP\
  \ 端点使用 AWS Signature V4 验证进行安全保护。终端配置将训练好的机器学习模型的位置、计算实例类型与预测端点相关的自动伸缩策略结合在一起。你需要先创建终端配置，然后使用终端配置将模型部署到预测端点。当配置与激活的预测端点关联时，你无法更改终端配置。可以使用\
  \ Amazon SageMaker 管理控制台和来自笔记本实例的 Amazon SageMaker SDK 创建终端配置和预测端点。\n\n### Amazon\
  \ SageMaker 批量转换\n\n预测端点仅提供一次处理一个观测值预测的能力。如果你需要对整个数据集进行预测，可以使用 Amazon SageMaker\
  \ Batch Transform 从训练好的模型创建批量预测作业。你可以在 `https://docs.aws.amazon.com/sagemaker/latest/dg/ex1-batch-transform.html`\
  \ 了解更多关于使用 Amazon SageMaker 预测的信息。\n\n\n\n\n\n*   图像分类算法（基于 ResNet 深度学习网络）\n*  \
  \ IP 洞察算法\n*   K-Means 算法\n*   K-近邻算法\n*   LDA（隐含利雷克分配）算法\n*   线性学习器算法\n*   NTM（神经主题模型）算法\n\
