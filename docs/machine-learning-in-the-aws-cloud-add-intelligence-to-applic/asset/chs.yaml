  : [ { \"Name\": \"Machine\" } ]\n}\n```\n\n你可以使用 `Metrics` 链接来查看一段时间内六项指标的聚合图表（参见图\
  \ 18.4）。\n\n![FIGURE 18.4 Amazon Rekognition 聚合指标图](img/c18f002.png)\n\nFIGURE 18.4\
  \ Amazon Rekognition 聚合指标图\n\n| 图表名称 | 指标名称 |\n| --- | --- |\n| 成功调用 | `SuccessfulRequestCount`\
  \ |\n| 客户端错误 | `UserErrorCount` |\n| 服务端错误 | `ServerErrorCount` |\n| 流 | `ThrottledCount`\
  \ |\n| 检测到的标签 | `DetectedLabelCount` |\n| 检测到的脸 | `DetectedFaceCount` |\n\n## 使用\
  \ AWS CLI 进行交互式图像分析\n\n你可以使用 AWS CLI 访问 Rekognition API 并进行图像分析。由于 Rekognition API\
  \ 处理图像或视频——这些本质上是大型对象——提交图像或视频到 API 的常用方法是将其上传到 Amazon S3 桶，然后提交 S3 对象 ARN。\n\n\
  另一种选择是将图像或视频编码为 Base64 字符串，并将该字符串包含在 JSON 负载中。这种技术并不推荐，最好将图像/视频的上传与实际的 API 调用分开。\n\
  \n本节的示例将在调用 Rekognition API 之前将图像上传到 S3 桶。本节使用的桶为 `awsml-rekognition-awscli-source`。由于桶名是唯一的，你需要将此类引用替换为你自己的。本节还假设你已经安装并配置了\
  \ AWS CLI 以使用你的开发凭据。\n\n要使用 AWS CLI 将图像上传到 S3 桶，请在 Mac 上启动终端或在 Windows 上启动命令提示符，并输入类似下面的语句：\n\
  \n```\naws s3 cp <source-file-name> s3://<bucket-name>\n```\n\n将 `<source-file-name>`\
  \ 替换为计算机上图像文件的完整路径，并将 `<bucket-name>` 替换为你的 Amazon S3 桶名称。例如，以下命令会将 `tower-bridge-01.jpg`\
  \ 文件上传到名为 `awsml-rekognition-awscli-source` 的桶：\n\n```bash\naws s3 cp \\\n/Users/abhishekmishra/Desktop\
  \ /tower_bridge_01.jpg  \\\ns3://awsml-rekognition-awscli-source\n```\n\n图像上传需要几秒钟。你可以通过以下命令列出桶的内容来验证图像已上传：\n\
  \n```bash\n$ aws s3 ls s3://awsml-rekognition-awscli-source\n```\n\n\n\n\n一旦你确认图像已上传到你的\
  \ Amazon S3 存储桶，请输入以下命令使用 Amazon Rekognition  API 对图像进行对象分析。请根据需要替换 Amazon S3 存储桶和对象的名称：\n\
  \n```\naws rekognition detect-labels --image \\\n'{\"S3Object\":{\"Bucket\":\"awsml-rekognition-awscli-source\"\
  , \\\n\"Name\":\"tower_bridge_01.jpg\"}}'\n```\n\n该命令行语句调用了 `DetectLabels` API，并带有一个名为\
  \ `image` 的输入参数，这是一个 JSON 对象：\n\n```json\n{\n        \"S3Object\":{\n        \"\
  Bucket\":\"awsml-rekognition-awscli-source\",\n        \"Name\":\"tower_bridge_01.jpg\"\
  }\n}\n```\n\n按下键盘上的 Enter 键执行命令。执行此命令的结果是一个包含标签及其置信度分数的 JSON 对象：\n\n```json\n{\n\
