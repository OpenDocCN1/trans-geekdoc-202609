  \ URL 从 GitHub 下载：\n    `https://github.com/asmtechnology/awsmlbook-chapter17.git`\n\
  \n## Google TensorFlow 简介\n\n`TensorFlow` 是 `Google` 创建的一个机器学习库，最初由 `Google Brain`\
  \ 团队为内部开发，随后于 2015 年 11 月根据 `Apache 许可证` 作为开源项目发布。`TensorFlow` 要求你将计算问题建模为一种称为`计算图（computation\
  \ graph）`的树形结构，该结构由节点和叶子节点组成。图中的节点代表数学运算或函数，而叶子节点代表某些输入。该图运行的数据表示为称为`张量（tensors）`的\
  \ `n` 维矩阵。操作节点也被称为 `op 节点`，虽然大多数节点接受 `tensors` 作为输入并返回表示运算结果的 `tensor`，但某些操作节点不返回任何内容。\n\
  \n叶子节点有三种类型：\n\n*   **常量（Constant）**：`constant` 节点（也称为`常量张量`）是一个值一旦赋值就无法更改的张量。`常量张量`使用\
  \ `tf.constant()` 函数创建。你可以在 `https://www.tensorflow.org/api_docs/python/constant`\
  \ 了解更多关于`常量张量`的知识。\n*   **变量（Variable）**：`variable` 节点（也称为`变量张量`）是一个值可以随着程序执行而改变的张量。在构建机器学习模型时，模型的权重和偏置项等模型参数使用`变量张量`来表示。`变量张量`是\
  \ `tf.Variable` 类的实例，可以通过使用类构造函数或 `tf.get_variable()` 函数创建。你可以在 `https://www.tensorflow.org/api_docs/python/Variable`\
  \ 了解更多关于`变量张量`的知识。\n*   **占位符（Placeholder）**：`placeholder` 节点（也称为`占位符张量`）是一个特殊节点，其值是在评估图时必须馈入图的张量。`张量占位符`通常用于将训练数据和标签馈入你的程序中，并使用\
  \ `tf.placeholder()` 函数创建。你可以在 `https://www.tensorflow.org/api_docs/python/placeholder`\
  \ 了解更多关于`张量占位符`的知识。\n\n运行 TensorFlow 程序的过程等同于在一个名为`session（会）`的对象中评估计算图。随后在 `session`\
  \ 中评估图，在评估过程中，输入数据（`tensors`）被馈入图的叶子节点并通过图中流向根节点——这就是 TensorFlow 的由来。`TensorFlow\
  \ session` 负责将计算图转换为可执行代码并在 `CPU` 或 `GPU` 上执行图。`变量`、`常量`和`张量占位符`的范围局限于 `session`。你可以拥有具有不同计算图的多个\
  \ `session`。\n\n虽然对于简单的算术问题，这种基于图的方法似乎大材小用，但如果你尝试表示的计算问题本质上是基于图的（例如人工神经网络 ANN），这种方法就非常有用且自然。`TensorFlow`\
  \ 通常用于创建分类和回归任务的不同人工神经网络模型。人工神经网络的详细讨论无法在一个章内完成，但这里提供了一个高层面的摘要，帮助你理解其工作原理。\n\n`图\
  \ 17.1` 展示了一个非常简单的人工神经网络的结构。\n\n\n\n\n\n# 图 17.1 人工神经网络 (ANN) 的结构\n\n人工神经网络由称为 `neurons`（神经元）的单元组成，并被组织成一系列层。层共有三种类型：\n\
  \n*   **输入层（Input layer）：** 这是直接接收计算输入的层。人工神经网络中只有一个输入层。\n*   **输出层（Output layer）：**\
  \ 这是提供计算输出的层。该层可以包含一个或多个神经元，取决于网络用于解决的问题类型。\n*   **隐藏层（Hidden layer）：** 这是位于输入层和输出层之间的层。输入层的神经元连接到隐藏层的神经元，隐藏层的神经元连接到输出层的神经元。当某一层中的每个神经元都连接到上一层的每一个神经元时，该网络被称为\
  \ `fully connected network`（全连接网络）。简单的神经网络可能不一定隐藏层，而深度学习网络等复杂的神经网络具有多个隐藏层，每层都包含大量神经元。\n\
  \n神经元之间的每条连接都关联有一个权重值，该权重乘以连接起始神经元的值。每个神经元的工作原理是计算其输入的和，并将该和传递通过非线性激活函数。神经元的输出值是激活函数的结果。图\
  \ 17.2 描绘了一个非常简单的神经网络，其中输入层包含两个神经元，输出层包含一个神经元。\n\n![FIGURE 17.2 简单的神经网络](img/c17f002.png)\n\
  \n# 图 17.2 简单的神经网络\n\n如果 `x[1]`、`x[2]` 是加载到输入层神经元中的值，`w[1]`、`w[2]` 是输入层与输出层之间的连接权重，且\
  \ `f()` 是输出层神经元的激活函数，那么图 17.2 中神经网络的输出值为 `f(w[1].x[1] + w[2].x[2])`。\n\n有许多不同类型的激活函数，每种都有自己的优缺点。设置激活函数的原因是为了确保网络不仅仅是一个巨大的线性模型。当实例化一个神经网络时，权重被设置为随机值。训练神经网络的过程涉及找到权重的值。\n\
  \nTensorFlow Python API 结构由一系列层（图 17.3\n\n# 图 17.3 TensorFlow API 架构\n\n`Estimators`\
  \ 层还提供了一个训练这些网络的框架。中间层由 `Layers`、`Datasets` 和 `Metrics` API 组成。`Layers` API 提供了在神经网络层级进行操作并通过拼接不同类型的层来创建复杂的神经网络架构的能力。底层由低级\
  \ Python 类和函数组成，允许你在单个图节点级别进行操作，例如 `tf.Variable`、`tf.placeholder` 和 `tf.constant`。在下一节中，你将使用低级\
  \ Python API 从零开始创建一个简单的线性回归模型。在随后的章节中，你将使用 `Estimators API` 创建一种称为 `Dense Neural\
  \ Network (DNN)`（稠密神经网络）的特殊神经网络，并用该网络用于分类任务。你可以在 `https://www.tensorflow.org/guide`\
  \ 更多有关 TensorFlow API 的信息。\n\n## 使用 Google TensorFlow 创建线性回归模型\n\n在本节中，你将使用 Amazon\
  \ SageMaker notebook 实例，利用 TensorFlow 提供的低级 Python API 在实例上训练线性回归模型。线性回归模型将在 Scikit-learn\
  \ 包含的波士顿房价玩具数据集（Boston house prices toy dataset）上训练。你可以在 `https://scikit-learn.org/stable/datasets/index.html#datasets`\
  \ 学习有关波士顿房价玩具数据集的信息。随本章节下载的内容包含了数据集的副本。为了更好地说明使用 Google TensorFlow 的过程，线性回归模型首先将在数据集的一个特征上进行训练，然后进行修改以处理剩余特征。\n\
  \n要开始，请使用开发 IAM 用户账户专用登录链接登录 AWS 管理控制台。导航到 Amazon S3 管理台并找到 `awsml-sagemaker-source`\
  \ 桶（图 17.4）。\n\n![FIGURE 17.4 访问包含训练和验证文件的 Amazon S3 桶](img/c17f004.png)\n\n# 图\
  \ 17.4 访问包含训练和验证文件的 Amazon S3 桶\n\n如果你还没有创建 `awsml-sagemaker-source` 桶，请参考上一章中的“准备测试数据”部分。在随本章节的资源中找到\
  \ `datasets/dataset` 文件夹，并将 `boston_train.csv` 和 `boston_test.csv` 文件上传到 Amazon\
  \ S3 桶（图 17.5）。\n\n![FIGURE 17.5 将预划分的训练和测试数据上传到 Amazon S3 桶](img/c17f005.png)\n\
  \n# 图 17.5 将预划分的训练和测试数据上传到 Amazon S3 桶\n\n准备训练和测试数据集的技术在第 5 章中介绍过。资源中包含一个名为 `PreparingTheDataset.ipynb`\
  \ 的 Jupyter Notebook 文件。该文件包含了在作者本地运行的 Jupyter Notebook 上生成 `boston_train.csv` 和\
  \ `boston_test.csv` 文件的 Python 代码。\n\n上传文件到 Amazon S3 后，使用服务下拉菜单切换到 Amazon SageMaker\
  \ 管理台，并创建一个名为 `tensorflow-models` 的 `ml.t2-medium` notebook 实例。Amazon SageMaker\
  \ 默认会选择你在上一章创建 `kmeans-iris-flowers` notebook 实例时创建的同一个 IAM 角色。\n\n*   **注意：** 如果你没有在上一章创建\
  \ notebook 实例，你需要创建一个供 notebook 实例使用的新的 IAM 角色。请参考上一章中“创建 Amazon SageMaker Notebook\
  \ Instance”章节的说明。\n\n当 `tensorflow-models` notebook 实例准备就绪后，你将在 Amazon SageMaker\
  \ 管理控制台中看到它，状态为“In Service”（图 17.6）。\n\n![FIGURE 17.6 Amazon SageMaker 管理台显示新的 notebook\
  \ ](img/c17f006.png)\n\n# 图 17.6 Amazon SageMaker 管理台显示新的 notebook \n\n点击 Open Jupyter\
  \ 访问运行在你的 `tensorflow-models` notebook 实例上的 Jupyter Notebook 服务器，并创建一个名为 `TF_SingleFeatureRegression_SGD`\
  \ 的新 notebook 文件，使用 `conda_tensorflow_p36` 内核。在空 notebook 单元格中执行以下代码段，将 Amazon S3\
  \ 中的 `boston_train.csv` 和 `boston_test.csv` 文件加载到 Pandas dataframe 中，并将特征变量和目标分离到不同的\
  \ dataframe 中：\n\n\n\n\n\n```python\nimport boto3\nimport sagemaker\nimport io\n\
  \ \nimport pandas as pd\nimport numpy as np\n \n# 从 Amazon S3 加载训练和验证数据集\ns3_client\
  \ = boto3.client('s3')\ns3_bucket_name='awsml-sagemaker-source'\n \nresponse = s3_client.get_object(Bucket='awsml-sagemaker-source',\
  \ Key='boston_train.csv')\nresponse_body = response[\"Body\"].read()\ndf_boston_train\
  \ = pd.read_csv(io.BytesIO(response_body), header=0, delimiter=\",\", low_memory=False)\n\
  \ \nresponse = s3_client.get_object(Bucket='awsml-sagemaker-source', Key='boston_test.csv')\n\
  response_body = response[\"Body\"].read()\ndf_boston_test = pd.read_csv(io.BytesIO(response_body),\
  \ header=0, index_col=False, delimiter=\",\", low_memory=False)\n \n# 将特征和目标变量提取到单独的数据集中。\n\
  df_boston_train_target = df_boston_train.loc[:,['price']]\ndf_boston_train_features\
  \ = df_boston_train.drop(['price'], axis=1)\n \ndf_boston_test_target = df_boston_test.loc[:,['price']]\n\
  df_boston_test_features = df_boston_test.drop(['price'], axis=1)\n```\n\n`df_boston_train`\
  \ 数据集包含 14 列。第一列名为 `price`，是目标变量，其余 13 列是特征变量。这 13 个特征变量的描述可以在 https://scikit-learn.org/stable/datasets/index.html#datasets\
  \ 处找到。你可以使用数据表的 `head()` 方法来检查 `df_boston_train` 数据框的前五行（参见图 17.7）。\n\n![图 17.7\
  \ 检查波士顿房价数据集的前五行](img/c17f007.png)\n\n图 17.7 检查波士顿房价数据集的前五行\n\n现在，让我们使用低级 TensorFlow\
  \ Python API 构建一个线性回归模型，该模型尝试根据单个特征变量预测 `price` 目标属性的值。可以在单元格中执行的完整代码将在本节末尾给出；现在，让我们探索使用低级\
  \ TensorFlow API 构建和训练模型的过程。\n\n你可以选择任何特征变量。本节中的代码假设你正在使用数据集的第一个特征，它名为 `CRIM`，代表人均犯罪率。回想第\
  \ 4 章，线性回归模型尝试对构成训练数据的数据集拟合一条直线（或超维平面），并使用该直线对未来值进行预测。对于 *N* 个特征的线性回归模型的通用方程为：\n\
  \n![方程](img/c17-disp-0001.png)math display=\"block\" overflow=\"scroll\" xmlns=\"\
  http://www.w3.org/1998/Math/MathML\" xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
  ><mrow><mtext>Y</mtext><mo>=</mo><msub><mrow><mtext>w</mtext></mrow><mn>1</mn></msub><msub><mrow><mtext>X</mtext></mrow><mn>1</mn></msub><mo>+</mo><msub><mrow><mtext>w</mtext></mrow><mn>2</mn></msub><msub><><><mtext>X</mtext></mrow><mn>2</mn></msub><mo>+</mo><mo>&#8230;</mo><mo><mo><msub><><><mtext>w</mtext></mtext>n</n></mtext></msub><msub><mrow><mtext><X</X</mrow><mn><mn>mn></mn><mo><mo><mtext><c</c><mo><mo></mo></math></math>\n\
  \n其中：\n\n* `w[1]`、`w[2]`、… `w[n]` 是与特征 `X[1]` 关联的系数。\n* `Y` 是预测值。\n* `c` 是截距。\n\n\
  `df_boston_train` 数据集包含 14 列。第一列名为 `price`，是目标变量，其余 13 列是特征变量。这 13 个特征变量的描述可以在 https://scikit-learn.org/stable/datasets/index.html#datasets\
  \ 处找到。你可以使用数据表的 `head()` 方法来检查 `df_boston_train` 数据框的前五行。\n\n\n\n\n你的线性回归模型还将包含两个变量：对应于单个输入特征的权重\
  \ `w`[1] 和截距项 `c`。模型训练的目标是利用计算图找到 `w`[1] 和 `c` 的值。在 TensorFlow 中，执行图后其值可以发生改变的量被称为变量，并表示为\
  \ `tf.Variable` 类的实例。通常，你将为所有想要计算的量创建 `tf.Variable` 实例。和占位符（placeholders）一样，变量也是张量。然而，与占位符不同，你不需要在运行时将变量的值馈入计算图；相反，它们被赋予一个初始值，然后随着图中不同节点的评估，变量的值会被更新。你可以使用\
  \ `tf.Variable()` 构造函数或 `tf.get_variable()` 函数来创建变量。以下语句使用 `tf.Variable()` 构造函数定义了两个变量\
  \ `w1` 和 `c`：\n\n```\nw1 = tf.Variable(tf.zeros([1,1]), name=\"w1\")\nc = tf.Variable(tf.zeros([1]),\
  \ name=\"c\")\n```\n\n当你创建一个变量时，你需要提供一个默认值；变量张量的形状是从默认值的形状推断出来的。前面的语句利用 `tf.zeros()`\
  \ 函数创建了作为 `w1` 和 `c` 变量默认值的张量。`tf.zeros()` 函数创建所有元素都设置为 0 的张量。你可以在 `https://www.tensorflow.org/api_docs/python/tf/zeros`\
  \ 学习更多关于 `tf.zeros()` 函数的信息。尽管你已经构造构造参数指定了变量的初始值，但在会话（session）执行图之前，这些值尚未赋值给这些变量。图\
  \ 17.10 描绘了两个变量节点创建后的计算图结构。\n\n![FIGURE 17.10 带有两个变量节点的计算图](img/c17f010.png)\n\n\
  FIGURE 17.10 带有两个变量节点的计算图\n\n现在，既然你已经在计算图中创建了占位符节点和变量节点，你可以使用 `tf.matmul()` 算符来创建一个操作节点，该节点将包含\
  \ `w1` 和 `x1` 节点张量的矩阵乘积。你可以在 `https://www.tensorflow.org/api_docs/python/tf/linalg/matmul`\
  \ 学习更多关于 `tf.matmul()` 算符的信息。以下语句向计算图添加了一个名为 `temp` 的新节点，其值将是通过张量 `w1` 和 `x1` 相乘得到的张量：\n\
  \n```\ntemp = tf.matmul(x1,w1)\n```\n\n图 17.11 描绘了矩阵乘法节点添加后的计算图结构。\n\n![FIGURE 17.11\
  \ w1 和 x1 节点相乘后的计算图](img/c17f011.png)\n\nFIGURE 17.11 w1 和 x1 节点相乘后的计算图\n\n\n\n\n\
  对梯度下降优化的深入讨论超出了本书的范畴。你可以通过 `https://developers.google.com/machine-learning/crash-course/reducing-loss/gradient-descent`\
  \ 学习更多关于梯度下降技术的知识。梯度下降是一种常用的优化算法，它基于一个假设：代价函数 `mse_cost`、`w1` 和 `c` 的值三维图表是碗状的（凹形），且它有一个唯一的最小值。根据这一假设，梯度下降算法计算点\
  \ `[mse_cost, w1, c]` 的导数（梯度）值，并利用导数的符号来确定代价函数值应该移动的方向。正值表示碗状曲线面上的最优点在较高处（朝向碗的边缘），负值则表示最优点在较低的朝向槽底的某处。然后，通过沿梯度指示的方向移动一小段距离，在碗状曲线上选择一个新点，并选择相应的\
  \ `w1` 和 `c` 值。接着，该过程会按照固定的迭代次数重复进行，并选择迭代过程中得到的最优值。\n\n幸运的是，你不需要在 TensorFlow 中从零实现梯度下降算法，而是可以创建一个\
  \ `tf.GradientDescentOptimizer` 类的实例来获取优化器对象，然后使用该优化器对象的 `minimize()` 方法获取一个操作节点，该节点既可以计算梯度，可以使用梯度调整影响代价函数值的变量值。下面的代码片段演示了如何使用\
  \ `tf.GradientDescentOptimizer` 类向计算图中添加操作节点。你可以通过 `https://www.tensorflow.org/api_docs/python/tf/train/GradientDescentOptimizer`\
  \ 了解更多关于该类的信息。\n\n```\n# 创建一个根节点 - 梯度下降优化器，设置用于优化\n# mse_cost \nlearning_rate =\
  \ 0.000001\ntrain_step = tf.train.GradientDescentOptimizer(learning_rate).minimize(mse_cost)\n\
  ```\n\n图 17.14 展示了添加优化器操作后计算图的结构。\n\n![图 17.14 包含优化代价函数操作的计算图](img/c17f014.png)\n\
  \n**图 17.14**](#c17.xhtml#R_c17-fig-0014) 包含优化代价函数操作的计算图\n\n现在你已经创建了计算图，需要在会话中运行图，这涉及到创建一个\
  \ `tf.Session` 对象、初始化图中的变量、向占位符喂入值，并评估图中一个或多个节点的值。\n\n下面的代码片段准备了两个数组 `xin` 和 `yin`，它们包含了一旦在会话中运行计算图就会喂入占位符节点的值：\n\
  \n```\n# 将 CRIM 特征和目标变量提取到数组中，以便\n# 这些值可以通过之前创建的占位符喂入到计算图中。\nxin =  df_boston_train_features['CRIM'].values\n\
  yin =  df_boston_train_target['price'].values\n```\n\n需要注意的是，你并不非要从根节点开始评估图，可以选择评估图中任何节点的值。TensorFlow\
  \ 将评估计算你想要评估的节点值所需的任何子节点的值。你不需要逐个初始化计算图中的每个变量，而是可以使用 `tf.global_variables_initializer()`\
  \ 函数向计算图添加一个初始化节点。该节点在会话中执行时，将使用默认值初始化计算图中的所有变量。下面的代码片段创建了一个 `tf.Session` 对象，并使用\
  \ `tf.global_variables_initializer()` 函数初始化默认计算图中所有变量的值：\n\n```\nwith tf.Session()\
  \ as sess:\n    # 使用 global_variable_initializer 节点初始化\n    # 图中的所有变量 (w1 和 c)\n\
  \    init_node = tf.global_variables_initializer()\n    sess.run(init_node)\n```\n\
  \n调用 `tf.global_variables_initializer()` 函数会向图添加初始化节点，但实际的变量初始化发生在执行下一行 `sess.run(init_node)`\
  \ 时。`tf.Session` 对象的 `run()` 方法可执行计算图任何节点。你可以通过 `https://www.tensorflow.org/api_docs/python/tf/Session`\
  \ 了解更多关于 `tf.Session` 的信息。\n\n- **注意**：使用 `with-as` 语句的原因是为了确保在使用完成后不需要显式关闭会话对象。\n\
  \n  如果你不想使用 `with-as` 语句，等效的代码行将是：\n\n  ```\n  sess = tf.Session()\n  init_node\
  \ = tf.global_variables_initializer()\n  sess.run(init_node)\n    sess.close()\n\
  \  ```\n\n  忘记调用 `sess.close()` 将导致与会话相关的资源无法释放，为了完全避免这个问题，Python 程序员在创建会话时会使用 `with-as`\
  \ 语句。\n\n变量初始化后，下面的代码片段将把 `xin` 和 `yin` Python 数组的每一项喂入 `x1` 和 `y_actual`：\n\n\n\
  \n\n这种递归评估过程将持续，直到 TensorFlow 需要评估 `xin` 和 `yin` 占位符节点。当发生这种情况时，TensorFlow 将使用 `feed_dict`\
  \ 参数提供的值 `10` 和 `20` 为这些占位符节点执行 `sess.run()`。`w1` 和 `c` 变量节点的初始值将为 `0`，并将使用这些值计算\
  \ `mse_cost` 张量。当评估 `GradientDescentOptimizer` 节点时，它将调整 `w1` 和 `c` 变量节点的值，以略微减少\
  \ `mse_cost` 的值。由于 `global_variables_initializer` 节点没有在循环中执行，变量在循环迭代之间将保留其值。\n\n\
  ## 评估\n一旦评估了 `train_step` 节点，`w1` 和 `c` 图节点中的张量将包含优化后的模型参数。要读取这些值，你需要在单独的 `sess.run()`\
  \ 语句中评估 `w1` 和 `c` 节点：\n\n```\ncomputed_w1 = sess.run(w1)\ncomputed_c = sess.run(c)\n\
  ```\n\n尽管 TensorFlow 在评估 `train_step` 节点时已经计算了 `w1` 和 `c` 节点的值，但后续对 `sess.run(w1)`\
  \ 和 `sess.run(c)` 的调用会导致 TensorFlow 再次评估计算图。由于这些变量节点没有任何依赖节点，不会涉及递归，TensorFlow 将存储在这些变量节点中的张量值。\n\
  \n### 随机梯度下降\n敏锐的读者可能注意到，通过一次提供一个 `xin` 和 `yin` 值，梯度下降优化过程试图独立地优化每个元素的代价函数，而不是尝试针对\
  \ `xin` 和 `yin` 的所有值优化一个更好的整体预测。当以这种方式（一次处理一个数据点）使用梯度下降优化时，它被称为 `随机梯度下降`。\n\n##\
  \ 实现\n本节到为止讨论的所有模型构建、训练和优化步骤都整合在以下代码段中。完整代码也可以在本章节资源中包含的 `TF_SingleFeatureRegression_SGD`\
  \ 笔记本文件中找到：\n\n```python\n# 在单个特征上训练线性回归模型\n# 线性回归的通般方程为：\n# y = w1x1 + w2x2 + …\
  \ wnxn + c\n#\n## 在单个特征的情况下，方程简化为：\n## y = w1x1 + c\n \nimport tensorflow as tf\n\
  tf.reset_default_graph()\n \n#\n# 定义一个 TensorFlow 图\n#\n \n# 你将提供的内容：\n# x1 =  特征的一维列数组\n\
  # y_actual = 期望值/标签的一维列数组\nx1 = tf.placeholder(tf.float32, [None, 1], name=\"x1\"\
  )\ny_actual = tf.placeholder(tf.float32, [None, 1], name=\"y_actual\")\n \n# 你感兴趣的内容：\n\
  ## w1, c 权重和偏置项（截距）\nw1 = tf.Variable(tf.zeros([1,1]), name=\"w1\")\nc = tf.Variable(tf.zeros([1]),\
  \ name=\"c\")\n \n# 计算 y_predicted = w1x1 + c\ntemp = tf.matmul(x1,w1)\ny_predicted\
  \ = temp + c\n \n \n## 计算代价函数\n## 预测值与实际值之间的 MSE\ndiff = y_predicted - y_actual\n\
  square_diff = tf.square(diff)\nmse_cost = tf.reduce_mean(square_diff)\n \n# 创建根节点\
  \ - 梯度下降优化器，设置用于优化\n# mse_cost 函数。\nlearning_rate = 0.000001\ntrain_step = tf.train.GradientDescentOptimizer(learning_rate).minimize(mse_cost)\n\
  \ \n# 将 CRIM 特征和目标变量提取到数组中，以便\n# 这些可以通过之前创建的占位符馈入计算图。\nxin =  df_boston_train_features['CRIM'].values\n\
  yin =  df_boston_train_target['price'].values\n \n    \n#\n## 执行图\n#\nwith tf.Session()\
  \ as sess:\n    # 使用 global_variable_initializer 节点初始化\n    # 图中的所有变量 (w1 和 c)\n\
  \    init_node = tf.global_variables_initializer()\n    sess.run(init_node)\n```\n\
  \n如果你在空笔记本单元格中执行此代码，你将在笔记本单元格下方看到日志消息，列出每次迭代中 `w1`、`c` 和代价函数的值。这里展示了最后几次迭代对应的日志消息部分：\n\
  \n如你所见，代价函数在每次迭代中随机波动——有时上升，有时下降。这是因为我们一次向数据集提供一个数据点。\n\n训练结束时，`best_w1` 和 `best_c`\
  \ 的值代表训练模型的参数，并可以使用线性回归方程 Y = w1X + c 在测试集上进行预测。这在以下代码中所示：\n\n```python\n# 使用 best_w1\
  \ 和 best_c 对测试集中所有观测值进行预测\npredictions = df_boston_test_features['CRIM'].values\
  \ * best_w1 + best_c\n```\n\n一旦你有了预测值，你可以使用 Scikit-learn 通过通过 `best_w1 = 0.016363`\
  \ 和 `best_c = 0.005673` 的值计算测试集上所有预测值的 MSE：\n\n```python\n## 在测试集上计算 MSE\nfrom sklearn.metrics\
  \ import mean_squared_error\nmse_test = mean_squared_error(np.transpose(df_boston_test_target.values),\
  \ predictions)\n```\n\n可以使用 Python 的 `print` 语句检查均方误差的值，结果是一个相当高的值——这表明模型性能非常差：由于许多原因，这种糟糕性能是可以预料的，最重要的两个原因是我们只使用了数据集中的一个特征，而且我们的优化步骤并没有尝试减少整个数据集上代价函数的值。此代码可以很容易修改以处理数据集的多个特征并执行批量梯度下降。该代码的修改版本在本章节随附资源的\
  \ `TF_MultiFeatureRegression_BatchGradientDescent` 笔记本文件中。此处提供了模型训练和优化代码，并用粗体显示了关键差异。\n\
  \n\n\n\n\n```python\n# 在单个特征上训练线性回归模型\n# 线性回归的通用方程为：\n# y = w1x1 + w2x2 + … wnxn\
  \ + c\n#\n## 在单个特征的情况下，方程简化为：\n## y = w1x1 + c\n \nimport tensorflow as tf\ntf.reset_default_graph()\n\
  \ \n# 定义一个 TensorFlow 图\n#\n# 你将提供的内容：\n# x1 = 特征的一维列数组\n# y_actual = 期望值/标签的一维列数组\n\
  x_1 = tf.placeholder(tf.float32, [None, 1], name=\"x1\")\ny_actual = tf.placeholder(tf.float32,\
  \ [None, 1], name=\"y_actual\")\n \n# 你感兴趣的内容：\n## w1, c 权重和偏置项（截距）\nw1 = tf.Variable(tf.zeros([1,1]),\
  \ name=\"w1\")\nc = tf.Variable(tf.zeros([1]), name=\"c\")\n \n# 计算 y_predicted\
  \ = w1x1 + c\ny_predicted = tf.matmul(x1,w1) + c\n \n## 计算代价函数\n## 预测值与实际值之间的 MSE\n\
  mse_cost = tf.reduce:mean(tf.square(y_predicted - y_actual))\n \n# 创建根节点 - 一个梯度下降优化器，设定为用于优化\n\
  # mse_cost 函数。\nlearning_rate = 0.00001\ntrain_step = tf.train.GradientDescentOptimizer(learning_rate).minimize(mse_cost)\n\
  \ \n## 执行图\n#\nwith tf.Session() as sess:\n    # 使用 global_variable_initializer\
  \ 节点来初始化\n    # 图中所有的变量 (w1 和 c)\n    init = tf.global_variables_initializer()\n\
  \    sess.run(init)\n    \n    # 将 CRIM 特征和目标变量提取到数组\n    xin =  df_boston_train_features['CRIM'].values\n\
  \    yin =  df_boston_train_target['price'].values\n    \n    xin = np.transpose([xin])\n\
  \    yin = np.transpose([yin])\n \n    # 对于每个观测值，评估名为 train_step 的节点\n    # 它将转更新\
  \ w1 和 c 以最小化\n    # 代价函数。\n    best_w1 = 0.0\n    best_c = 0.0\n    lowest_cost\
  \ = 100000.00\n    \n    num_epochs = 100000\n    for i in range(num_epochs):\n\
  \        input_dict={x1:xin, y_actual:yin}\n        sess.run(train_step, feed_dict=input_dict)\n\
  \        \n        computed_w1 = sess.run(w1)\n        computed_c = sess.run(c)\n\
  \        computed_cost = sess.run(mse_cost, feed_dict=input_dict)\n        \n  \
  \      if computed_cost < lowest_cost:\n            lowest_cost = computed_cost\n\
  \            best_w1 = computed_w1\n            best_c = computed_c\n          \
  \  \n        print (\"End of epoch %d, w1=%f, c=%f, cost=%f\" % (i, computed_w1,\
  \ computed_c, computed_cost))\n    print (\"End of training, best_w1=%f, best_c=%f,\
  \ lowest_cost=%f\" % (best_w1, best_c, lowest_cost))\n```\n\n如你所示，`xin` 和 `yin`\
  \ 的全部内容都被输入到计算图中，而不仅仅一次，而是 100,000 次。多次展示整个训练集可以确保梯度下降优化器能够找到更好的 `w1` 和 `c` 值。在模型优化过程中展示训练集的次数被称为训练轮次（training\
  \ epochs）的数量，该值在前面的代码段中被硬编码为 `100000`。实际上，Python 变量 `learning_rate` 和 `num_epochs`\
  \ 是线性回归模型的超参数。\n\n如果你在空的 notebook 单元格中执行此代码，你将会在单元格下方看到日志消息，其中列出了每个训练轮次结束时 `w1`、`c`\
  \ 和代价函数的值。这里展示了对应不同训练轮次的部分日志消息：\n\n如你所见，代价函数不再随着每个轮次随机波动，而是稳步下降，这更符合你对优化过程的预期。\n\
  \n训练结束时，`best_w1=-0.222625` 和 `best_c1=19.488808` 的值代表训练模型的参数，并可以使用线性回归方程 `Y = w[1]X[1]\
  \ + c` 对测试集进行预测。以下代码段进行了演示：\n\n```python\n# 使用 best_w1 和 best_c 对测试集中的所有观测值进行预测\n\
  predictions = df_boston_test_features['CRIM'].values * best_w1 + best_c\n```\n\n\
  一旦你获得了预测结果，就可以使用 Scikit-learn 结合 `best_w1=-0.222625` 和 `best_c1=19.488808` 的值来计算测试集中所有预测值的\
  \ MSE。\n\n\n\n\n\n```python\nimport argparse\nimport numpy as np\nimport pandas\
  \ as pd\nimport os\nimport tensorflow as tf\n \ndef estimator_fn(run_config, params):\n\
  \    \n    feature_columns = [tf.feature_column.numeric_column(key='sepal_length'),\n\
  \                    tf.feature_column.numeric_column(key='sepal_width'),\n    \
  \                tf.feature_column.numeric_column(key='petal_length'),\n       \
  \             tf.feature_column.numeric_column(key='petal_width')]\n \n    return\
  \ tf.estimator.DNNClassifier(feature_columns=feature_columns,\n                \
  \                      hidden_units=[10, 10],\n                                \
  \      n_classes=3,\n                                      config=run_config)\n\
  \ \n \ndef train_input_fn(training_dir, params):\n \n    # read input file iris_train.csv\
  \ .\n    input_file = os.path.join(training_dir, 'iris_train.csv')\n    df_iris_train\
  \ = pd.read_csv(input_file, header=0, engine=\"python\")\n \n    # convert categorical\
