  \ 构建和部署基于 `Amazon SageMaker` 内置流行机器学习算法实现以及使用 `Scikit-learn` 创建的模型。在本章中，你将学习如何使用\
  \ `Google TensorFlow` 创建模型，并使用 `Amazon SageMaker` 训练和部署这些模型。\n\n*   **注意**：在注册免费版\
