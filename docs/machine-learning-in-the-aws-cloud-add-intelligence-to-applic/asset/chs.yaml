  \ Pandas 简介\n\n# 第 6 章\n\nAmazon Web Services\n\n### 本章内容\n\n- 云计算基础\n- 用于构建机器学习解决方案的\
  \ AWS 生态系统\n- 注册账户\n\n在本章中，你将学习什么是云计算，阅读讨论云服务时常用的抽象模型，并发现 AWS 在云计算领域提供的服务概述，重点介绍有助于机器学习解决方案的服务。本章最后将引导你完成注册\
  \ AWS 账户的过程。\n\n## 什么是云计算？\n\n云计算由美国国家标准与技术研究院（NIST）定义为“一种模型，通过随时便利、按需的网络访问获取共享的可配置资源池（如网络、服务器、存储、应用程序和服务），这些资源可以通过最少的管理工作或服务提供者交互来快速部署和释放。”¹](#c06.xhtml#c06-note-0001)\n\
  \nNIST 为模型定义了五个基本特征。下面将简述这些特征：\n\n- *广泛的网络访问*：消费者可以从任何地方访问服务。\n- *资源池化*：提供者的计算资源池化以支持多个客户。\n\
  - *按需自服务*：消费者可以根据需要配置计算资源（如虚拟服务器），只需少量的人工干预。\n- *可测量服务*：消费者可以按付费使用计算资源。\n- *弹性*：消费者可以根据需要自动配置额外的资源。为了实现这一点，提供者对计算资源进行池化，以提供水平扩展性。\n\
  \n云计算解决方案为企业提供了两个主要优势：\n\n\n\n\n\n- **成本**：云计算范式基于硬件资源的共享和优化利用。企业仅需为其使用资源的时间付费。当不再需要资源时，企业可以放弃该资源并供他人使用。这既减少了企业的前期硬件投资成本，也减少了持续的维护成本。由云服务提供商而非消费者来负责底层硬件的维护。\n\
  - **可用性**：在云端配置一个即可即可用的资源的时间远短于在内部设置类似资源的时间。例如，企业可以在几秒钟在云服务提供商处配置一台虚拟机，而在大多数中大型组织中，采购新服务器硬件和软件的实际过程通常需要几个月。\n\
  \n## 云服务模型\n\n云计算构建在虚拟化技术。从根本上说，虚拟化有两种：\n\n- **应用虚拟化**：单台机器托管一个或多个应用程序，这些应用程序通过互联网交付一个或多个用户。\n\
  - **硬件虚拟化**：也称为服务器虚拟化，在这种模型中，单台物理机器托管多个虚拟机。每个虚拟机都可以有自己的操作系统（与底层物理机器的操作系统不同）以及其特有的应用程序集。\n\
  \n作为终端用户，你期望通过互联网从云计算提供商处消费一个或多个服务。这些服务的范围从带有基础操作系统的精简虚拟机到整个应用程序套件不等。五种常见的云服务模型如图\
  \ 6.1](#c06.xhtml#c06-fig-0001）所示。可以使用分层模型进行概念化，较高层构建在较低层提供的服务之上。\n\n![图 6.1 常见的云服务模型](img/c06f001.png)\n\
  \n**图 6.1****：你指定所需虚拟服务器的低级细节，包括 CPU 数量、`RAM`、硬盘空间、网络能力和操作系统。云提供商提供与这些需求匹配的虚拟机。除了虚拟机外，`IaaS`\
  \ 的定义还包括防火墙、负载均衡器和存储器等网络外设。因此，在云端部署多个负载均衡的 Java 应用程序服务器以及将你的文件存储在云磁盘上，都属于 `IaaS`\
  \ 模型范畴。\n- **平台即服务 (PaaS)**：你可以在最适合你需求的基础设施和预配置软件组合之间进行选择。云提供商提供一个带有预配置内部应用程序的虚拟机以匹配你的需求。`PaaS`\
  \ 模型通常更容易使用，因为你不需要设置底层硬件和软件；然而，这可能具有限制性，因为与 `IaaS` 模型相比，你对底层系统的控制级别显著降低。基础设施和预装软件的选择在云提供商之间有所不同，如果云厂商没有提供满足你需求的现成产品，你就只能倒霉了。\n\
  - **软件即服务 (SaaS)**：你指定想要使用的软件应用程序类型，例如文字处理器。云提供商配置与你的需求匹配的所需的基础设施、操作系统和应用程序。大多数\
  \ `SaaS` 云提供商对运行应用程序的硬件特性选择有限，作为用户，你通常无法直接访问运行你应用程序的底层硬件。你还受限于云提供商所选硬件和软件的局限性。例如，如果一家电影院链使用\
  \ `SaaS` 云端预订系统管理门票销售，而由于云提供商使用的硬件发生内部错误导致系统不可用，电影院几乎无能为力，只能等待云提供商修复问题。\n- **业务流程即服务\
  \ (BPaaS)**：你指定想要外包给云提供商的业务流程。云服务提供商配置硬件、操作系统、应用程序并提供所需的服务。`BPaaS` 的一个良好示例是使用云端服务来计算增值税\
  \ (`VAT`) 报表并向税务局提交。此类服务可以作为一个基于浏览器的前端，你在其中上传发单，服务可以使用 `OCR` 提取相关信息，填写报表，一旦你对结果满意，即可代表你提交。\n\
  - **机器学习即服务 (MLaaS)**：云提供商提供协助数据建模、机器学习构建、数据可视化、自然语言处理、人脸识别、预测和深度学习的服务。服务本身可以归类为应用程序级或平台级服务。分类取决于为用户提供了多少控制和灵活性。云提供商自动配置足够的容量以应对需求。\n\
  \n## 云部署模型\n\n部署模型回答以下问题：\n\n- 谁可以访问计算资源？\n- 用户如何访问计算资源？\n- 物理硬件在哪里？\n\n云计算解决方案有四种部署模型：\n\
  \n- **公有云**：公有云通过互联网向世界任何地方消费者提供服务。提供这些服务的物理资源也可以位于世界任何地方。对于由于监管要求而无法将机密存储在外部系统的组织而言，此类服务可能带来潜在挑战。云提供商通常负责物理基础设施的采购、设置、安全和维护。在某种程度上，云提供商也负责应用数据的安全；这取决于服务模型（`IaaS`/`PaaS`/`SaaS`）。\n\
  - **私有云**：私有云为单一组织提供服务。服务通过安全内部网络提供，互联网公众无法访问。组织拥有提供底层服务的物理硬件，并负责基础设施以及运行在基础设施上的所有软件的设置、维护和安全。由于该模型相关的基础设施成本巨大，只有大型公司才能负担得起自己的私有云。私有云通常被称为本地云，并可以为组织提供任何组合的\
  \ `IaaS`/`SaaS`/`PaaS`。\n- **社区云**：社区云通过安全网络向一小部分实体（个人、大学或公司）提供服务。用于提供服务的底层资源由社区云服务的实体拥有。从本质上说，这种类型的云服务可以被认为是公有云和私有云之间的某种东西。该服务不对公众成员开放，也不会给任何单一实体的财务造成重大负担。参与的实体拥有共同目标或在共同行业领域提供服务。\n\
  \n\n\n\n\n-   **混合云**：混合云本质上是由其他类型的云服务组成的云服务。例如，混合云可以由公有云和私有云组成。公有子云可以提供供任何互联网用户旨在消费的服务；而私有云则可以提供对业务敏感的服务。大多数大型组织都使用混合云模型。它允许他们在特定业务用例需要时配置公有云资源，同时继续享受私有云为其所有现有流程提供的安全性和控制。\n\
  \n## AWS 生态系统\n\nAmazon Web Services（AWS）是市场上发展最快的云计算计算服务。目前 AWS 提供的服务包括在全球范围内各地提供的一百多项服务，并且每年都会添加新服务。\n\
  \nAWS 的新功能会在 AWS re:Invent 上宣布，这是 AWS 的官方年度会议。您可以在 `https://reinvent.awsevents.com`\
  \ 更多有关 AWS re:Invent 的信息。\n\n图 6.2 描述了 AWS 的简短时间线。AWS 诞生于 Chris Pinkham 和 Benjamin\
  \ Black 在 2003 年向 Jeff Bezos 提交的一篇论文。\n\n![FIGURE 6.2 Amazon Web Services 简短时间线](img/c06f002.png)\n\
  \nFIGURE 6.2 Amazon Web Services 简短时间线\n\n这篇论文建议将 Amazon 的内部基础设施作为服务提供给全世界。2006\
  \ 年，AWS 正式推出，包含 `EC2` 和 `S3` 在几个关键服务。\n\n2010 年 11 月，Amazon 宣布所有 [Amazon.com](http://amazon.com)\
  \ 都已迁移到 AWS。首次 AWS re:Invent 会议于 2012 年 11 月 27 日至 29 日在拉斯维加斯的威尼斯酒店举行。2015 年，Amazon\
  \ 推出了其名为 Amazon Machine Learning 的自有机器学习平台，并在 2016 年宣布了三项专门针对机器学习应用程序的新 API 服务：Amazon\
  \ Rekognition、Amazon Polly 和 Amazon Lex。\n\n在本书编写时，AWS 提供了 130 项服务，每项服务都属于 20 个不同服务类别之一。服务类别如下：\n\
  \n-   计算\n-   存储\n-   数据库\n-   迁移\n-   网络与内容交付\n-   开发者工具\n-   管理工具\n-   媒体服务\n\
  -   机器学习\n-   分析\n-   安全、身份与合规\n-   移动服务\n-   AR 与 VR\n-   应用集成\n-   AWS 成本管理\n\
  -   客户互动\n-   业务生产力\n-   桌面与应用流\n-   物联网\n-   游戏开发\n\n您可以在 `https://aws.amazon.com/products/`\
  \ 找到这些类别中所有 AWS 服务的详细信息。\n\nAmazon 在机器学习领域的业务分为两类：应用服务和平台服务。\n\n### 机器学习应用服务\n\n\
  这些服务旨在开箱即用特定的机器学习问题，并通过 API 集成到您自己的应用程序中。类别中的某些服务列如下：\n\n-   **Amazon Comprehend**：这是一个允许您构建需要理解结构和内容的服务。\n\
  -   **Amazon Lex**：这是一个允许您构建对话式界面（聊天机器人）的服务。\n-   **Amazon Polly**：这是一个文本转语音服务。\n\
  -   **Amazon Rekognition**：这是一个提供 API 用于对图像和视频中基于深度学习的对象检测的服务。\n-   **Amazon Translate**：这是一个文档翻译服务。\n\
  -   **Amazon Transcribe**：这是一个语音转文本服务。\n\n## 机器学习平台服务\n\n这些服务为您提供了构建、训练和评估机器学习模型的工具。平台服务本身不能开箱即用解决任何特定的机器学习问题；相反，您需要使用它们从零开始构建机器学习解决方案。类别中的某些服务列如下：\n\
  \n-   **Amazon Machine Learning**：这是一个基于云的服务，允许您使用向向的界面快速构建机器学习模型。\n-   **Amazon\
  \ SageMaker**：这是一个全托管的服务，允许您构建、训练和部署自己的机器学习模型。\n-   **AWS DeepLens**：这是一个无线视频摄像头和一个集成的云端开发平台。\n\
  \n## 支持服务\n\n在之前的章节中，您学习了 Amazon 的机器学习应用和平台服务。这些服务并不是孤立运行的——在机器学习应用程序的构建和部署阶段，您通常会发现自己在使用许多其他\
  \ AWS 服务。在本节中，您将查看在构建和部署机器学习解决方案时可能会遇到的某些 AWS 服务：\n\n\n\n\n\n* `AWS IAM`: Amazon\
  \ 身份和访问管理 (IAM) 让你安全地控制谁可以访问你的 AWS 资源、他们可以访问哪些资源，以及他们对这些资源可以做什么。IAM 在第 8 章 中介绍。\n\
  * `AWS Lambda`: AWS Lambda 允许用户无需配置基础设施即可运行代码段。该服务按需付费模式计费，用户仅为其 lambda 代码的执行时间付费。代码未运行时不产生费用。Lambda\
  \ 代码可以设置为从其他 AWS 服务自动触发，或直接从任何 Web 或移动应用程序中调用。AWS Lambda 在第 12 章 中介绍。\n* `Amazon\
  \ S3`: Amazon 简单存储服务 (S3) 是一种安全、持久且可扩展的云对象存储。使用此服务，你可以在云端存储文件。Amazon S3 在第 9 章 中介绍。\n\
  * `Amazon DynamoDB`: Amazon DynamoDB 是一种高性能、可扩展的云 NoSQL 数据库服务。Amazon DynamoDB 在第\
  \ 11 章 中介绍。\n* `Amazon Cognito`: Amazon Cognito 允许你为应用程序的用户创建身份配置文件，并允许他们使用 Amazon、Facebook、Twitter\
  \ 或 Google 账户登录应用程序。一旦用户在应用程序中通过验证，应用程序将获得一个令牌，该令牌可安全地访问 AWS 云资源。Amazon Cognito\
  \ 还提供了一种服务，允许已验证的用户在不同设备上同步其应用程序数据。Amazon Cognito 在第 10 章 中介绍。\n\n## 注册 AWS 免费层级账户\n\
  \n要使用 AWS，你需要注册一个 AWS 账户。如果你还没有账户，可以注册一个 AWS 免费层级下的账户。免费层级下的 AWS 账户旨在让你在 12 个月内免费尝试某些\
  \ AWS 产品，但受限于某些用量限制。访问 `https://aws.amazon.com/free/` 获取有关 AWS 免费层级账户包含的信息。AWS 免费层级账户不提供\
  \ Amazon 机器学习（Amazon Machine Learning）。\n\n要创建一个免费层级下的 AWS 账户，你需要经过五个步骤。其中某些步骤包含多个子步骤：\n\
  \n1. 联系信息\n2. 支付信息\n3. 身份验证\n4. 选择支持计划\n5. 确认\n\n### 步骤 1：联系信息\n\n要开始注册免费层级下的 AWS\
  \ 账户，请访问 `aws.amazon.com` 并点击页面右上角的“创建 AWS 账户”链接（参见图 6.3）。\n\n![图 6.3 Amazon Web\
  \ Services 首页](img/c06f003.png)\n\n`图 6.3` Amazon Web Services 首页\n\nAmazon 经常与其客户尝试新的用户体验，因此此页面看起来可能与截图有所不同。但是，你仍然应该能够在页面上找到创建\
  \ AWS 账户的相关选项。\n\n在“创建 AWS 账户”屏幕上输入有效的电子邮件地址、密码和账户名称（参见图 6.4），并点击“继续”按钮。账户名称是你可用于此账户的个人身份标识符。\n\
  \n![图 6.4 AWS 登录屏幕](img/c06f004.png)\n\n`图 6.4` AWS 登录屏幕\n\n你将被要求指示账户是用于个人还是公司（图\
  \ 6.5）。请选择适合你情况的选项。本章假设你选择创建个人（个人）账户。\n\n![图 6.5 联系信息屏幕](img/c06f005.png)\n\n`图\
  \ 6.5` 联系信息屏幕\n\n在“联系信息”屏幕上，你将被要求提供联系信息（包括电话号码）。你必须提供一个你可以立即访问并接听电话的号码。如有必要，滚动到页面底部，阅读并接受\
  \ AWS 客户协议的条款和条件，然后点击“创建账户并继续”进入下一步。\n\n### 步骤 2：支付信息\n\n你需要提供信用卡/借记卡详细信息（参见图 6.6）。虽然免费层级下的账户可以免费访问某些\
  \ AWS 服务，但并非所有服务都包含在免费层级中。如果你使用了未包含在免费层级账户的服务，或超过了免费层级服务的用量限制，则会对你提供的卡进行收费。\n\n\
  ![图 6.6 支付信息屏幕](img/c06f006.png)\n\n`图 6.6` 支付信息屏幕\n\n免费层级下提供的精确服务和选项可能会随时更改。本书将尽力告知你示例是否使用了免费层级之外的\
  \ AWS 功能。要获取有关免费层级包含内容的最新信息，请访问 `https://aws.amazon.com/free/`。\n\n输入你的信用卡/借记卡详细信息并点击“提交”进入身份验证步骤。\n\
  \n### 步骤 3：身份验证\n\n身份验证过程涉及通过你提供的号码接收系统电话，并在提示时输入四位 PIN。输入电话号码并点击“现在拨打”（参见图 6.7）。\n\
  \n![图 6.7 身份验证屏幕](img/c06f007.png)\n\n`图 6.7` 身份验证屏幕\n\n四位 PIN 随后出现在网页上（参见图 6.8）。\n\
  \n![图 6.8 电话验证码](img/c06f008.png)\n\n`图 6.8` 电话验证码\n\n一旦你在电话中输入了四位 PIN，身份验证过程即完成。网页将刷新以反映这一点（参见图\
  \ 6.9）。\n\n![图 6.9 完成身份验证](img/c06f009.png)\n\n`图 6.9` 完成身份验证\n\n点击“继续”进入下一步。\n\n\
  ### 步骤 4：选择支持计划\n\n从可用列表中选择一个支持计划（参见图 6.10）。选项有：\n\n![图 6.10 支持计划选择](img/c06f010.png)\n\
  \n`图 6.10` 支持计划选择\n\n* Basic（基础）\n* Developer（开发者）\n* Business（商务）\n* Enterprise（企业）\n\
  \n支持计划是累积的，区别在于你收到的支持水平，较贵的选项允许联系 Amazon 员工解答问题。默认选择选项是 Basic，它是免费的。对于本书而言，Basic\
  \ 支持计划足够了。选择默认的 Basic 支持计划并点击“继续”。\n\n### 步骤 5：确认\n\n你将收到 AWS 免费层级账户已设置好的确认（参见图\
  \ 6.11）。\n\n![图 6.11 完成注册](img/c06f011.png)\n\n`图 6.11` 完成注册\n\n你还会通过在注册过程中使用的电子邮件地址收到一封确认邮件。在下一章中，你将学习访问\
  \ AWS 的不同方法以及保护你创建的账户。\n\n# 总结\n\n* 云计算由美国国家标准技术研究院 (NIST) 定义为“一种模型，它通过随时随地、便利、按需的网络访问共享的可配置计算资源池（例如网络、服务器、存储、应用程序和服务），并且这些资源可以在以最少管理工作或服务提供商交互的情况下快速配置和释放。”\n\
  * 云计算为企业提供了成本和可用性方面的优势。\n\n\n\n\n\n-   常见的云计算服务模型包括基础设施即服务 (IaaS)、平台即服务 (PaaS)、软件即服务\
  \ (SaaS)、业务流程即服务 (BPaaS) 以及机器学习即服务 (MLaaS)。\n-   云解决方案使用标准的部署模型进行部署。部署模型定义了如何访问计算资源、谁可以访问该资源以及物理硬件位于何处。\n\
  -   云解决方案通常有四不同的部署模型：私有云、公有云、社区云和混合云。\n-   AWS 提供了超过 100 种不同的云服务，分为 20 个不同的服务类别。Amazon\
  \ 会不断增加可用服务。\n-   免费层级下的 AWS 账户旨在让您在 12 个月内免费尝试某些 AWS 产品，但受某些使用限制。\n-   Amazon 基于云的机器学习服务可以分为两类：应用服务和平台服务。\n\
  \n### Note\n1. 1 Peter Mell 和 Timothy Grance，“The NIST Definition of Cloud Computing,”NIST\
  \ Special Publication 800-145. September 2011. ([`nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-145.pdf`](http://nvlpubs.nist.gov/nistpubs/Legacy/SP/nistspecialpublication800-145.pdf))\n\
  \n# 第 7 章：AWS 全球基础设施\n\n### 本章内容\n-   AWS 全球基础设施简介\n-   AWS 管理控制台导览\n\n在上一章中，你概述了\
  \ Amazon 提供的云服务，重点介绍了用于机器学习应用程序的服务。在本章中，你将学习 AWS 全球基础设施。AWS 物理基础设施由地理区域、可用区（Availability\
  \ Zones）和内容分发边缘节点系统组成。并不是所有的 AWS 服务在每个区域都可用。\n\n## 区域与可用区\n\nAWS 区域（Region）是全球范围内提供云服务的物理位置。Amazon\
  \ 确保您可以选择数据物理所在的区域，以便您能够轻松满足区域性的监管要求。\n\n一个 AWS 区域划分为多个可用区（AZs）（参见图 7.1）。\n\n![FIGURE\
  \ 7.1 单个区域内的多个可用区](img/c07f001.png)\n\n`FIGURE 7.1` 单个区域内的多个可用区\n\n可用区由一个或多个数据中心组成，位于独立的设施中，每个中心都具有冗余的电源、网络和连接。这些数据中心通过私有光纤网络相互连接，允许您构建和运行可扩展且容错的应用程序，这在单个数据中心是无法实现的。\n\
  \n可用区让您能够构建在区域内不同 AZ 之间自动故障转移且无中断的应用程序。截至目前，全球范围内分布着十九个区域。此外，Amazon 已宣布计划在巴林、沙特阿拉伯（中国）和瑞典规划新区域。您可以在\
  \ `https://aws.amazon.com/about-aws/global-infrastructure/` 找到区域和可用区的完整列表。\n\n表\
  \ 7.1 列出了每个区域内的当前 AWS 区域和 AZ。\n\n`TABLE 7.1`: AWS 区域与可用区\n\n| 区域 | 可用区 | 注释 |\n\
  | --- | --- | --- |\n| 美国西部 (俄勒冈) | 3 | 2011 年启动。 |\n| 美国西部 (北加利福尼亚州) | 3 | 2009\
  \ 年启动。 |\n| 美国东部 (北弗吉尼亚州) | 6 | 2006 年启动。 |\n| 美国东部 (俄亥俄) | 3 | 2016 年启动。 |\n| AWS\
  \ GovCloud | 3 | 2011 年启动。仅限美国政府员工访问。 |\n| 加拿大 (中部) | 2 | 2016 年启动。 |\n| 欧洲 (爱尔兰)\
  \ | 3 | 2007 年启动。 |\n| 欧洲 (法兰克福) | 3 | 2014 年启动。 |\n| 欧洲 (伦敦) | 3 | 2016 年启动。 |\n\
  | 欧洲 (巴黎) | 3 | 2017 年启动。 |\n| 亚太 (新加坡) | 2 | 2010 年启动。 |\n| 亚太 (东京) | 4 | 2011\
  \ 年启动。 |\n| 亚太 (大阪) | 1 | 2018 年启动。 |\n| 亚太 (悉尼) | 3 | 2012 年启动。 |\n| 亚太 (首尔) |\
  \ 2 | 2016 年启动。 |\n| 亚太 (孟买) | 2 | 2016 年启动。 |\n| 中国 (北京) | 2 | 2014 年与北京光网网络科技有限公司（“光网网”）合作启动，光网网是\
  \ AWS 中国（北京）区域的服务运营商和提供商。 |\n| 中国 (宁夏) | 3 | 2014 年与北京光网网络科技有限公司（“光网网”）合作启动，光网网是\
  \ AWS 中国（北京）区域的服务运营商和提供商。 |\n| 南美 (圣保罗) | 3 | 2016 年启动。 |\n| 加拿大 | 2 | 2016 年启动。\
  \ |\n\n*   **Note**: 要获取区域和可用区的完整列表，请访问 `https://aws.amazon.com/about-aws/global-infrastructure/`。\n\
  *   **Note**: 并不是所有的 AWS 服务在每个区域都可用。\n*   **Note**: 跨区域复制不会自动应用的，通常需要额外的努力。\n\n\n\
  \n\n\n在本节中，你将学习你（或你的应用程序）连接到 AWS 的不同方法。个人或应用程序可以通过四种方式连接到 AWS：\n\n*   使用 AWS 管理台\n\
  *   使用命令行界面\n*   使用特定平台的开发者 SDK\n*   使用 RESTful Web 服务\n\nAWS 本质上（如其实名所示）是一组 RESTful\
  \ Web 服务集。你可以通过 RESTful Web 服务访问 AWS 提供的每一个服务。管理控制台、命令行界面和特定平台的 SDK 都是构建在底层的 RESTful\
  \ Web 服务 API 之上的。选择访问 AWS 的方式取决于你的工作职责。\n\n如果你正在管理或维护服务，你可能更倾向于管理控制台基于 Web 用户友好的界面。如果你是一个经常执行脚本的\
  \ DevOps 人员，你可能更倾向于命令行界面。如果你是一个应用程序开发者，如果可用，你可能会使用针对你特定平台的 `SDK`。\n\n截至本文编写，以下平台已提供开发者\
  \ SDK：\n\n*   Python\n*   Ruby\n*   C++\n*   iOS\n*   Android\n*   Java\n*   .NET\n\
  *   Node.js\n*   PHP\n*   Go\n\n你可以在 `https://aws.amazon.com/tools/` 获取最新的特定平台开发者\
  \ SDK 列表以及安装说明和 SDK 文档。本书中的课程主要使用 AWS 管理台，并偶尔使用 Python 版 AWS `SDK`。\n\n## AWS 管理控制台\n\
  \nAWS 管理台是一个基于 Web 的应用程序，允许你管理 AWS 账户并配置云服务。访问 `https://aws.amazon.com` 登录 AWS 管理台。\n\
  \n点击网站右上角的 `Sign in to The Console` 链接（参见图 7.4）。系统要求你提供 AWS 账户用户名和密码。\n\n![图 7.4\
  \ AWS 首页](img/c07f004.png)\n\n**图 7.4** AWS 首页\n\n管理台的落地页提供了各种 AWS 服务配置页的快速链接，以及指向训练视频的链接（参见图\
  \ 7.5）。落地页的外观和感受不断更新；因此，落地页的显示可能与截图有所异。\n\n![图 7.5 AWS 管理控制台首页](img/c07f005.png)\n\
  \n**图 7.5** AWS 管理控制台首页\n\n管理台顶部菜单栏提供了几个实用的选项（参见图 7.6）。当你移动到管理台内的不同页面时，此导航菜单不会改变。\n\
  \n![图 7.6 AWS 管理控制台菜单栏](img/c07f006.png)\n\n**图 7.6** AWS 管理控制台菜单栏\n\n#### 首页菜单\
  \ (HOME MENU)\n\n菜单栏中最左侧的图标是首页图标。此菜单项可以从任何页面访问管理台的主屏幕。\n\n#### 服务菜单 (SERVICES MENU)\n\
  \n`Services` 菜单（参见图 7.7）包含指向所有 AWS 服务的链接，并用于快速跳转到管理台内任何服务的相关子部分。\n\n![图 7.7 在 AWS\
  \ 管理控制台中访问服务菜单](img/c07f007.png)\n\n**图 7.7** 在 AWS 管理控制台中访问服务菜单\n\n#### 资源组菜单 (RESOURCE\
  \ GROUPS MENU)\n\n`Resource Groups` 菜单允许你访问一组已标记的自有 AWS 资源（例如 `EC2` 实例、负载均衡器和数据库）。新的\
  \ AWS 账户没有配置任何资源组；在这种情况下，`Resource Groups` 菜单类似于图 7.8。\n\n![图 7.8 资源组菜单](img/c07f008.png)\n\
  \n**图 7.8** 资源组菜单\n\n假设你已经创建了一个名为 `CustomerAPI` 的 Java 应用程序，并在 AWS （伦敦）区域使用若干 `EC2`\
  \ 实例来支持该应用程序。如果所有支持应用程序的 `EC2` 实例都分配了名为 `Name` 值为 `CustomerAPI` 的标签，那么你就可以创建一个资源组，将所有\
  \ `EC2` 实例逻辑上分组，并在一个屏幕上查看所有这些分组的资源（参见图 7.9）。\n\n![图 7.9 创建资源组](img/c07f009.png)\n\
  \n**图 7.9** 创建资源组\n\n可以通过点击 `Resource Groups` 菜单下的 `Saved Groups` 菜单项访问现有的资源组（参见图\
  \ 7.10）。\n\n\n\n\n身份和访问管理（IAM）是一项 Web 服务，允许您安全地管理用户、配置安全凭据、设置密码轮换策略、配置多因素身份验证，并控制用户可以哪些\
  \ AWS 资源。使用 IAM，您可以控制谁可以访问您的 AWS 资源、他们可以访问哪些资源以及他们对这些资源可以执行什么操作。\n\n通常使用 AWS 管理控制台或\
  \ AWS 命令行工具访问 IAM。在本章中，您将学习如何使用管理控制台设置用户、组、角色和策略，并保护您的根账户。\n\n## 核心概念\n\n在本节中，您将学习在处理\
  \ IAM 时遇到的一些核心概念。\n\n### 根账户 (Root Account)\n\n当您注册使用 AWS 时，会被要求在注册过程中提供电子邮件地址和密码。成功注册后，将使用您提供的电子邮件地址和密码创建一个根身份。该根账户对您的\
  \ AWS 帐户中的所有资源具有不受限制的访问权限，包括账单和更改密码的能力。\n\n当您使用注册过程中使用的电子邮件和密码登录 AWS 管理控制台时，您实际上是以根用户身份登录的。\n\
  \nAmazon 建议不要使用根账户进行日常访问，并且永远不要与任何人共享您的根账户凭据。为了增加额外的安全层，强烈建议在根账户上启用多因素身份验证（MFA）。\n\
  \n对于日常使用，推荐的做法是使用 IAM 创建单独的用户，并利用组和策略为这些用户设置适当的访问级别。您将在本章的“使用 MFA 保护根账户”部分中学习配置\
  \ MFA，并在本章后后的“创建用户”部分中学习创建用户。\n\n### 用户 (User)\n\nIAM 用户对应于您组织中的用户或应用程序。每个 IAM 用户都有一个专用的登录链接、密码和访问密钥。然而，IAM\
  \ 用户并不是独立的 AWS 帐户；它们存在于根 AWS 帐户中（参见 图 8.1）。\n\n![图 8.1 IAM 用户存在于根 AWS 帐户下。](img/c08f001.png)\n\
  \n图 8.1 IAM 用户存在于根 AWS 帐户下。\n\nIAM 用户拥有专用的登录链接和密码用于登录 AWS 管理控制台，以及一组访问密钥用于以编程方式访问\
  \ AWS 服务。与 IAM 用户关联的权限决定了 IAM 用户可以访问 AWS 管理控制台的哪些部分。\n\n由于 IAM 用户可以拥有自己的访问密钥，您可以为需要以编程方式访问\
  \ AWS 的应用程序创建 IAM 用户。因此，IAM 用户并不一定代表一个真实的个人。\n\nAmazon 建议您创建一个具有管理权限的 IAM 用户帐户，并利用该用户为公司内的其他个人/应用程序创建其他\
  \ IAM 用户。\n\n### 身份联合 (Identity Federation)\n\n身份联合允许通过其他手段（如 Active Directory、SAML（安全断言标记语言）令牌、Facebook）通过验证的个人/应用程序接收一个临时的\
  \ IAM 用户帐户，该帐户可以以编程方式访问 AWS 服务。身份联合要求用户首先登录外部身份提供者，从外部身份提供者处获取令牌，最后将令牌提交给 IAM 以接收\
  \ AWS 资源的临时凭据集（参见 图 8.2）。\n\n![图 8.2 获取临时凭据](img/c08f002.png)\n\n图 8.2 获取临时凭据\n\n\
  当您的用户在企业目录或互联网中拥有现有身份时，身份联合将非常有帮助。IAM 支持两种类型的身份联合。区别是基于外部身份存储的位置划分的：\n\n*   企业身份联合\n\
  *   Web 身份联合\n\n#### 企业身份联合\n\n在企业身份联合中，身份存储在 AWS 外部，位于您自己的企业目录中。已经在您的组织网络中通过验证的用户不需要使用新凭据即可访问\
  \ AWS。\n\n拥有 Microsoft Active Directory (AD) 身份的用户可以使用 AWS Directory Service 在其\
  \ AD 帐户与您的 AWS 帐户之间建立信任。\n\n拥有兼容 SAML 2.0 的企业目录身份的用户可以配置该目录以向 AWS 管理控制台提供单点登录（SSO）访问。\n\
  \n#### Web 身份联合\n\n在 Web 身份联合中，身份存储在著名的第三方供应商（如 Facebook、Google 或 Amazon）处。如果您正在开发\
  \ Web/移动应用，并允许用户使用现有的 Facebook、Amazon 或 Google 帐户登录，这种方式非常理想。在 Web/移动应用中使用 Web 身份联合不需要您分发长期安全凭据，或在应用内创建自定义的登录和身份管理代码。Amazon\
  \ 建议您使用 Amazon Cognito Identity 来管理身份联合。\n\n*   **注意** 有关身份联合的更多信息，请访问 `http://docs.aws.amazon.com/IAM/latest/UserGuide/introduction_identity-management.html`。\n\
  \n### 组 (Group)\n\n组是可以组织 IAM 用户的逻辑实体。组可以附加适用于组内所有成员的策略。组简化了权限管理，而不是为组织中的每个用户管理权限；您可以将用户集附加到组，并在组级别管理权限（参见\
  \ 图 8.3）。\n\n![图 8.3 IAM 组包含用户和权限。](img/c08f003.png)\n\n图 8.3 IAM 组包含用户和权限。\n\n\
  在较大的组织中，通常会有与公司部门和职位对齐的组。\n\n### 策略 (Policy)\n\n策略是一个授予权限的 JSON 文档，可以与用户、组或角色关联。策略文档列出了可以执行的操作以及影响的资源。当利用组进行用户管理时，用户和组都可以附加策略。在这样的情况下，用户可以执行的操作净集是应用于该用户的策略以及通过组关系继承的策略共同的结果。策略可以是两种类型之一：\n\
  \n*   基于用户的策略：基于用户的策略附加到用户上。它描述了用户可以执行的操作以及用户可以访问的资源。\n*   基于资源的策略：基于资源的策略附加到资源上。它描述了可以访问资源的用户以及他们对资源可以执行的操作。并不是所有\
  \ AWS 服务都支持基于资源的策略。基于资源的策略主要用于允许跨帐户访问您的 AWS 资源。跨帐户访问发生在另一个 AWS 帐户的 IAM 用户访问您的 AWS\
  \ 帐户时。\n\n### 角色 (Role)\n\n角色是一种类似于用户的身份对象，可以附加策略。然而，与用户不同，角色没有关联的凭据，并且与特定个人唯一关联。角色可以由个人或服务承担。\n\
  \n角色主要用于提供 AWS 服务访问您帐户中的另一个 AWS 服务，例如允许 EC2 实例访问 S3 桶。当来自另一个组织 AWS 帐户的 IAM 用户或通过其他身份提供者验证的用户想要访问您的\
  \ AWS 服务时，也会涉及角色。\n\n\n\n\n当用户假设一个角色时，与角色关联的权限将临时取代其现有的权限。当用户停止使用该角色时，用户的原始权限将恢复。\n\
  \n当服务（例如 `EC2`）假设一个角色时，该服务将获得该角色的的一组临时访问凭据。因此，如果您想让您的 `EC2` 实例访问 `DynamoDB` 数据库中的对象，您将无需为\
  \ `EC2` 实例创建用户名/密码。相反，您将创建一个具有正确权限的角色，并将 `EC2` 实例分配给该角色。\n\n一个角色与两个独立的策略关联：\n\n\
  - 信任策略（Trust policy）：此策略指定了谁允许假设该角色。\n- 权限策略（Permissions policy）：此策略指定了假设角色的人员可以使用哪些操作和资源。\n\
  \n## 常见任务\n\n在本节中，您将学习如何使用 `IAM` 和 AWS 管理控制台管理用户、组、角色和权限。本节中的主题需要访问 AWS 管理控制台。如果您尚未在根账户下创建用户，则需要使用根账户凭据登录\
  \ AWS 管理控制台（请参见图 8.4）。\n\n![FIGURE 8.4 根账户登录屏幕](img/c08f004.png)\n\n**FIGURE 8.4**](#c08.xhtml#R_c08-fig-0004)\
  \ 根账户登录屏幕\n\n如果您已经为日常管理任务创建了 `IAM` 用户账户，则应使用该用户账户的专用登录链接访问 AWS 管理控制台（请参见图 8.5）。\n\
  \n![FIGURE 8.5 IAM 用户特定登录屏幕](img/c08f005.png)\n\n**FIGURE 8.5**](#c08.xhtml#R_c08-fig-0004-fig-0005)\
  \ IAM 用户特定登录屏幕\n\n您无法使用根账户凭据通过专用登录链接登录。`IAM` 账户并不限于当前在管理控制台中设置的区域（请参见图 8.6）；它们适用于所有\
  \ AWS 区域。在使用管理控制台配置 `IAM` 时，选择物理距离您最近的区域是一个良好的做法。这样做可以确保您在使用管理控制台时体验到最低的延迟。\n\n\
  ![FIGURE 8.6 AWS 管理控制台区域选择器](img/c08f006.png)\n\n**FIGURE 8.6**](#c08.xhtml#R_c08-fig-0006)\
  \ AWS 管理控制台区域选择器\n\n登录 AWS 管理控制台后，从服务下拉菜单选择 `IAM` 链接（请参见图 8.7）。\n\n![FIGURE 8.7\
  \ 访问 IAM 管理控制台](img/c08f007.png)\n\n**FIGURE 8.7**](#c08.xhtml#R_c08-fig-0007) 访问\
  \ IAM 管理控制台\n\n出现 `IAM` 仪表板。在仪表板顶部，您可以看到 `IAM` 用户登录链接。这是您应该给用户的专用登录链接（请参见图 8.8）。\n\
  \n![FIGURE 8.8 用户特定 IAM 登录链接](img/c08f008.png)\n\n**FIGURE 8.8**](#c08.xhtml#R_c08-fig-0008)\
  \ 用户特定 IAM 登录链接\n\n在 `IAM` 用户登录链接下方，您将看到已创建的 `IAM` 用户摘要，以及您需要为 `IAM` 账户执行的任务清单（请参见图\
  \ 8.9）。\n\n![FIGURE 8.9 IAM 仪表板](img/c08f009.png)\n\n**FIGURE 8.9**](#c08.xhtml#R_c08-fig-0009)\
  \ IAM 仪表板\n\n## 创建用户\n\n按照以下步骤操作：\n\n1. 点击 `IAM` 仪表板中的 `Users` 链接进入用户界面。点击 `Add\
  \ User` 按钮开始创建您的账户（请参见图 8.10）。\n\n![FIGURE 8.10 创建用户](img/c08f010.png)\n\n**FIGURE\
  \ 8.10**](#c08.xhtml#R_c08-fig-0010) 创建用户\n\n2. 指定用户名以及新用户的访问类型（请参见图 8.11）。\n\n\
  ![FIGURE 8.11 用户详情屏幕](img/c08f011.png)\n\n**FIGURE 8.11**](#c08.xhtml#R_c08-fig-0011)\
  \ 用户详情屏幕\n\n访问类型有两种选项：\n\n- 程序化访问：启用此选项将生成一组凭据。\n- AWS 控制台访问：启用此选项允许用户通过浏览器登录。\n\
  \n如果您指定了用户名和访问类型，将要求您配置用户权限（请参见图 8.12）。\n\n![FIGURE 8.12 配置权限](img/c08f012.png)\n\
  \n**FIGURE 8.12**](#c08.xhtml#R_c08-fig-0012) 配置权限\n\n权限由 JSON 文档表示。可以通过三种方式为用户分配权限：\n\
  \n- 将用户添加到组。\n- 直接附加策略。\n- 从现有用户复制权限。\n\n使用组管理权限是推荐的方法。确保选择了 `Add User To Group`\
  \ 并点击 `Create Group` 按钮。\n\n1. 为组输入名称并为组关联一个或多个策略。点击 `Create Group` 按钮完成组创建（请参见图\
  \ 8.13）。\n\n![FIGURE 8.13 创建组](img/c08f013.png)\n\n**FIGURE 8.13**](#c08.xhtml#R_c08-fig-0013)\
  \ 创建组\n\n2. 点击 `Create Group` 按钮后，您将返回之前的屏幕并看到新组与现有组并列（请参见图 8.14）。\n\n![FIGURE 8.14\
  \ 新组与现有组并列](img/c08f014.png)\n\n**FIGURE 8.14**](#c08.xhtml#R_c08-fig-0014) 新组与现有组并列\n\
  \n您可以从列表中选择多个组，在这种情况下，所选策略的组合效果将适用于用户。\n\n组列表还包含与组关联的策略信息。点击策略名称将在新窗口中加载策略编辑器（请参见图\
  \ 8.15）。\n\n![FIGURE 8.15 EC2FullAccess 策略加载策略编辑器](img/c08f015.png)\n\n**FIGURE\
  \ 8.15**](#c08.xhtml#R_c08-fig-0015) EC2FullAccess 策略加载策略编辑器\n\n策略以 JSON 文档的形式表示，根据\
  \ IAM 策略语言的规则格式化。您可以在 `http://docs.aws.amazon.com/IAM/latest/UserGuide/reference:policies.html`\
  \ 了解更多关于 IAM 策略语言的信息。\n\n`EC2FullAccess` 策略的 JSON 文档包含以下内容：\n\n\n\n\n\n```\n{\n\
  \    \"Version\": \"2012-10-17\",\n    \"Statement\": [\n        {\n           \
  \ \"Action\": \"ec2:*\",\n            \"Effect\": \"Allow\",\n            \"Resource\"\
  : \"*\"\n        },\n        {\n            \"Effect\": \"Allow\",\n           \
  \ \"Action\": \"elasticloadbalancing:*\",\n            \"Resource\": \"*\"\n   \
  \     },\n        {\n            \"Effect\": \"Allow\",\n            \"Action\"\
  : \"cloudwatch:*\",\n            \"Resource\": \"*\"\n        },\n        {\n  \
  \          \"Effect\": \"Allow\",\n            \"Action\": \"autoscaling:*\",\n\
  \            \"Resource\": \"*\"\n        },\n        {\n            \"Effect\"\
  : \"Allow\",\n            \"Action\": \"iam:CreateServiceLinkedRole\",\n       \
  \     \"Resource\": \"*\",\n            \"Condition\": {\n                \"StringEquals\"\
  : {\n                    \"iam:AWSServiceName\": [\n                        \"autoscaling.amazonaws.com\"\
  ,\n                        \"ec2scheduled.amazonaws.com\",\n                   \
  \     \"elasticloadbalancing.amazonaws.com\",\n                        \"spot.amazonaws.com\"\
  ,\n                        \"spotfleet.amazonaws.com\"\n                    ]\n\
  \                }\n            }\n        }\n    ]\n}\n```\n\n每个策略文档都以一个名为 `\"\
  Version\"` 的字符串键开头，在此情况下，它是创建此 AWS 提供的策略的日期。\n\n策略始终包含一个语句（statements）数组。该数组中的每个元素都描述了对资源执行操作的能力（或无法执行操作）。在\
  \ `EC2FullAccess` 策略中，有多个语句。其中一条语句允许访问所有弹性负载均衡器（ELB）资源：\n\n1. 在选择完您希望用户所属的组后，点击“下一步”（Next）按钮显示如图\
  \ 8.16 所示的屏幕，在该屏幕上您可以检查即将创建的新用户的配置设置。\n\n    ![FIGURE 8.16 查看用户设置屏幕](img/c08f016.png)\n\
  \n    FIGURE 8.16 查看用户设置屏幕\n\n2. 点击“创建用户”（Create User）按钮完成用户创建。\n\n您将看到一个类似于图 8.17\
  \ 的确认屏幕，其中包含刚刚创建的用户名以及访问凭证。\n\n    ![FIGURE 8.17 用户确认屏幕](img/c08f017.png)\n\n  \
  \  FIGURE 8.17 用户确认屏幕\n\n这是在安全的地方记录这些访问凭证并将其与您为其创建用户账户的用户共享的唯一机会。\n\n1. 使用“下载 .csv”（Download\
  \ .csv）按钮下载用户的全套凭证，并点击“关闭”（Close）按钮返回 IAM 主页。\n\n### 修改与现有组关联的权限\n\n要修改适用于现有组的权限，请在\
  \ IAM 主页上点击“组”（Groups）链接，并从现有组列表中选择组名称（图 8.18）。\n\n    ![FIGURE 8.18 组列表](img/c08f018.png)\n\
  \n    FIGURE 8.18 组列表\n\n您将看到一个摘要页面，该页面提供了修改适用于组权限的选项（参见图 8.19）。\n\n    ![FIGURE\
  \ 8.19 组权限摘要](img/c08f019.png)\n\n    FIGURE 8.19 组权限摘要\n\n### 创建角色\n\n要创建新角色，请完成本节中的步骤操作：\n\
  \n1. 在 IAM 主页上点击“角色”（Roles）链接，并点击“创建角色”（Create Role）按钮（参见图 8.20）。\n\n    ![FIGURE\
  \ 8.20 使用 IAM 控制台创建新角色](img/c08f020.png)\n\n    FIGURE 8.20 使用 IAM 控制台创建新角色\n\n\
  2. 选择将承担此角色的实体类型。请记住，角色关联了两个策略：信任策略（trust policy）和权限策略（permissions policy）。信任策略定义了谁可以承担该角色。IAM\
  \ 允许您从四种实体类型中选择：\n\n    * `AWS Service`：如果角色将由 AWS 服务（例如 Amazon `EC2`）使用，请选择此选项。\n\
  \    * `Another AWS Account`：如果角色将用于不同 AWS 账户的 IAM 用户，请选择此选项。\n    * `Web Identity`：如果角色将由使用\
  \ OIDC 提供器身份验证的用户承担，请选择此选项。\n    * `SAML 2.0 Federation`：如果角色将由使用 SAML 2.0 进行身份验证的用户承担，请选择此选项。\n\
  \n本节的示例创建了一个 AWS 服务角色，该角色将由 EC2 实例承担，并允许访问同一账户下的 Amazon DynamoDB 资源。选择 AWS Service\
  \ 作为实体类型，并从可用的 AWS 服务名称列表中选择 EC2（图 8.21）。点击“下一步”（Next）按钮继续。\n\n    ![FIGURE 8.21\
  \ 为 EC2 实例创建服务角色](img/c08f021.png)\n\n    FIGURE 8.21 为 EC2 实例创建服务角色\n\n3. 配置角色的权限策略。权限策略定义了用户或服务在承担此角色后可以执行的操作。您可以为单个角色附加最多\
  \ 10 种权限。\n\n    在搜索字段中输入单词 `Dynamo`，选择名为 `AmazonDynamoDBFullAccess` 的策略，并点击“下一步”（Next）按钮（图\
  \ 8.22）。\n\n    ![FIGURE 8.22 为角色附加策略](img/c08f022.png)\n\n    FIGURE 8.22 为角色附加策略\n\
  \n4. 下一个屏幕允许您创建可选标签并将其与角色关联（图 8.23）。标签是与角色关联的可选键值对；一个角色最多可以有 50 个标签。本节创建的角色没有任何标签；但如果您愿意，可以添加标签。点击“下一步”（Next）按钮进入下一步。\n\
  \n    ![FIGURE 8.23 角色可以关联最多 50 个标签](img/c08f023.png)\n\n    FIGURE 8.23 角色可以关联最多\
  \ 50 个标签\n\n5. 下一个屏幕提供了新角色的摘要并允许您为角色命名。角色名称最多为 64 个字符，且一旦创建将无法编辑。输入完角色名称后，点击“创建角色”（Create\
  \ Role）按钮完成角色创建（参见图 8.24）。\n\n    ![FIGURE 8.24 查看用户设置屏幕](img/c08f024.png)\n\n \
  \   FIGURE 8.24 查看用户设置屏幕\n\n### 使用 MFA 保护根账户\n\n在本节中，您将学习使用多因素身份验证（MFA）保护您的 AWS\
  \ 根账户。MFA 涉及涉及使用两个因素来验证用户。这些因素是：\n\n* 您所知道的（例如密码）\n* 您拥有的（例如硬件令牌或智能手机应用程序）\n* 您所是（例如生物识别指纹或声音）\n\
  \nMFA 通常用于保护敏感资源，并越来越多地应用于您日常生活中使用的系统，包括网上银行。强烈建议尽可能启用 MFA。启用后，当有人尝试使用根账户凭据登录 AWS\
  \ 管理控制台时，MFA 将增加一个额外的安全步骤。\n\n1. 要在根账户上配置 MFA，请使用根账户凭据登录 AWS 管理控制台并导航到 IAM 仪表板。点击安全状态仪表板“激活\
  \ MFA”（Activate MFA）行旁边的箭头（图 8.25）。\n\n\n\n\n`Activate MFA` 行将展开并显示 `Manage MFA`\
  \ 按钮。当你点击此按钮时，可能会弹出一个框，提醒你最佳实践是使用具有管理员权限的专用 `IAM` 用户，而不是根账户（图 8.26）。点击 `Continue\
  \ To Security Credentials` 按钮继续。\n\n![图 8.26 配置安全凭证警告](img/c08f026.png)\n\n**图 8.26**\
  \ 配置安全凭证警告\n\n2. 你将被引导至安全凭证页面。展开多因素认证折叠以显示 `Activate MFA` 按钮（现在它将变为蓝色），并点击 `Activate\
  \ MFA` 按钮（图 8.27）。\n\n![图 8.27 Activate MFA 按钮已启用。](img/c08f027.png)\n\n**图 8.27**\
  \ Activate MFA 按钮已启用。\n\n3. 当你点击此按钮时，将弹出一个框，让你选择想要激活的 MFA 设备类型。你可以使用两种类型的 MFA 设备之一：\n\
  \n   * `Virtual MFA Device`：虚拟 MFA 设备是运行在手机上的软件应用程序，例如 `Google Authenticator`。`Google\
  \ Authenticator` 适用于 iOS 和 Android 设备。\n   * `U2F Key`：`U2F` 是由 FIDO 联盟创建的开放身份验证标准。`U2F`\
  \ 是一个 USB 密钥，你可以将其插入计算机并进行物理交互（而不是输入代码）。\n   * `Hardware MFA Device`：这是你需要在激活前准备的并已购买的物理身份验证设备。在编写本文时，该设备必须由\
  \ Gemalto 提供——这是一家第三方 MFA 设备制造商，其设备与 `AWS MFA` 兼容。\n\n> **注意**   由于 `Google Authenticator`\
  \ 运行在你可能随身携带的手机上，因此存在手机被盗导致 MFA 验证器被破解的风险。\n>\n> 锁在某处的硬件 MFA 设备（或 `U2F key`）始终比随身携带手机上的虚拟\
  \ MFA 设备更安全。\n>\n> 要了解更多关于购买硬件 MFA 设备和其他兼容的虚拟 MFA 应用的信息，请访问 `https://aws.amazon.com/iam/details/mfa/`。\n\
  \n>\n> 在示例中，我们将使用 `Google Authenticator` 。选择 `Virtual MFA Device` 选项并点击 `Continue`\
  \ 按钮（见图 8.28）。\n\n![图 8.28 选择 MFA 设备类型](img/c08f028.png)\n\n**图 8.28** 选择 MFA 设备类型\n\
  \n1. 下一个屏幕包含一个二维码和两个文本字段。在你的手机上启动 `Google Authenticator` 应用并扫描二维码。如果网页上没有显示二维码，请点击\
  \ `Show QR Code` 链接显示它（图 8.29）。\n\n![图 8.29 配置分级身份验证器](img/c08f029.png)\n\n**图 8.29**\
  \ 配置分级身份验证器\n\n2. 应用上会出现一个六位代码。输入此代码。在网页上未显示二维码的情况下，点击 `Show QR Code` 链接显示以启用 `IAM`\
  \ 账户。\n\n 既然你已经为根账户启用 MFA，请登录 `AWS` 控制台以配置安全凭证，并尝试为 `IAM` 账户启用 MFA：\n\n### 设置 MFA\n\
  \n在以下步骤中，你将配置：\n\n1. 登录 `IAM` 仪表板。\n2. 展开 `Manage MFA` 菜单。\n3. 选择可用选项来启用 MFA（图 8.30）。\n\
  \n![图 8.30 配置安全凭证](img/c08f030.png)\n\n**图 8.30** 配置安全凭证\n\n# 总结\n\n* 身份访问管理 (`IAM`)\
  \ 是一种允许你管理用户及其访问权限的服务。\n* `IAM` 服务通常通过控制台访问。\n* 注册 `AWS` 时你会获得一个根账户和密码。\n* 根账户拥有所有资源的访问权限，但不应日常使用。\n\
  * 对于日常使用，你应该设置 `IAM` 用户、组和策略。\n* `IAM` 用户可以代表个人或应用程序。\n* 身份联合允许通过其他（如 Active Directory、Facebook）验证的个人/应用程序获取临时\
  \ `IAM` 用户账户。\n* 组是组织 `IAM` 用户的逻辑实体，可以附加策略。\n* 策略是一个 JSON 文档，授予用户、组或角色权限。\n* 角色是一种类似于用户的身份对象，但不关联凭据。角色关联有一组权限。\n\
  * 角色主要用于让 `AWS` 服务访问另一个服务。\n\n# 第 9 章：Amazon S3\n\n### 本章内容\n\n* `S3` 基本概念介绍\n*\
  \ 学习创建 `S3` 桶\n* 学习将对象上传到 `S3` 桶\n* 学习从 `S3` 桶下载对象\n* 学习使用 `AWS CLI` 工具与 `S3` 交互\n\
  * **注意**   Amazon 定期更新 `Amazon S3` 管理控制的用户界面。因此，本章中的某些截图可能与你在浏览器中看到的的不符。然而在本章中学到的通用概念仍然适用。\n\
  \nAmazon Simple Storage Service (`S3`) 是一种高可靠的 Web 服务，允许你在 `AWS` 云中安全地存储和检索对象数据。在\
  \ Amazon `EC2` 之后，`S3` 是最常用的服务之一。`S3` 上的数据分布在区域内的多个设备和可用区。\n\nAmazon `S3` 是一种基于对象的存储服务（而非块存储）。它非常适合存储文件，但无法安装操作系统；因此无法为\
  \ `EC2` 实例提供存储。\n\n## 核心概念\n\n在本节中，你将学习在使用 `Amazon S3` 时遇到的一些核心概念。\n\n### 桶 (Bucket)\n\
  \n\n\n\n桶（Bucket）是 Amazon S3 上的一个文件夹，你可以在其中存储文件。桶名称是全局唯一的；因此，没有两个用户可以拥有相同名称的桶。Amazon\
  \ S3 内部并没有实现类似于你在计算机操作系统上遇到的分层文件系统。所有 Amazon S3 桶中的所有文件都存储在一个全局的平坦文件系统中。然而，你的桶名称可以包含正路径分隔符字符（`/`）。因此，你可以以此方式命名桶，创建出嵌套文件夹结构的视觉效果。\n\
  \n对于你创建的每个桶，你都可以设置权限，控制谁可以访问该桶以及他们对桶可以做什么。你存储在 Amazon S3 桶中的每个对象都有与其关联的对象键（Object\
  \ Key）和元数据。\n\n### 对象键 (Object Key)\n\n对象键是 UTF-8 字符序列，用于标识 Amazon S3 桶中的对象。键在对象首次上传到\
  \ Amazon S3 桶时分配给对象，长度可达 1024 字节。\n\n键的名称基本上就是你上传到桶的文件名。Amazon S3 内部按字母顺序存储数据，这意味着名称相似的文件将存储在同一个物理磁盘上。如果你计划存储在\
  \ Amazon S3 中的文件具有某种顺序命名方案，或它们之间共享共同前缀，这可能是一个需要考虑的重要因素。如果是此类情况，当你从 Amazon S3 读取数据时可能会遇到性能瓶颈；你可能希望以不同的方式命名文件，或者在文件名开头添加短随机字符串或时间戳。\n\
  \n### 对象值 (Object Value)\n\n对象值是你正在存储的数据。它是一个字节序列，长度可达 5 TB。\n\n### 版本 ID (Version\
  \ ID)\n\n版本 ID 是一个标识对象版本的字符串值。当你将对象上传到桶中时，Amazon S3 会分配一个版本 ID。如果随后启用了对象版本控制，则对对象的每次更新都会创建一个新的版本\
  \ ID。对象键和版本 ID 共同唯一标识一个对象。\n\n### 存储类 (Storage Class)\n\nAmazon S3 中的每个对象都有一个关联的存储类。存储类决定了\
  \ Amazon S3 如何存储对象的数据，以及你在读取数据时是否会产生额外费用。Amazon S3 提供了以下存储类：\n\n- `Standard`：这是对象上传到\
  \ Amazon S3 时的默认存储类。如果你的用例需要高可靠性、耐久性和快速访问时间，则该存储类是理想之选。此存储类的设计目标是 99.99% 的可用性和 99.999999999%\
  \ 的耐久性。数据跨设备和设施冗余存储，并能够承受两个设施同时丢失。\n- `Standard - IA`：IA 是 infrequently accessed（不频繁访问）的缩写。此存储类为访问频率较低的长对象设计，使用成本比\
  \ Standard 类低，并旨在提供与 Standard 类相同的可用性和耐久性。你可以实时访问对象，但每次检索都有与其相关的额外费用。\n- `Reduced\
  \ Redundancy Storage (RRS)`：此存储类为可以轻松复制的非关键对象设计。对象的存储成本比 Standard 类低，但存储的冗余水平较低。此存储类的设计目标是\
  \ 99.99% 的可用性和 99.999999999% 的耐久性。\n- `Glacier`：Glacier 是一种针对很少访问但需要长期保留数据的归档存储类。它提供了最低成本，但检索时间可能需要几分钟到几小时。\n\
  \n### 费用 (Costs)\n\nAmazon S3 针对几个方面进行收费：\n\n- `Storage`（存储）：根据存储在桶中的数据量收费。\n- `Requests`（请求）：根据向\
  \ S3 发出的请求次数收费。\n- `Data Transfer`（数据传输）：根据从 S3 传输到互联网的数据收费。\n\n### 子资源 (Subresources)\n\
  \nAmazon S3 中的每个桶和对象都有一组关联的从对象。这些从对象被称为子资源。子资源无法独立存在；它们始终与桶关联。\n\n- `acl`：这是一个访问控制列表，定义了哪些人员可以访问资源以及他们对资源可以做什么。\n\
  - `torrent`：你可以用它检索 `.torrent` 文件。\n\n### 对象元数据 (Object Metadata)\n\nAmazon S3 中的每个对象都关联有两种元数据：系统定义和用户定义的。\n\
  \n#### 系统定义的元数据\n\n如名所示，系统定义的元数据由 Amazon S3 自动维护，并包含对象创建日期、对象大小等信息。用户无法编辑系统定义的元数据字段。表\
  \ 9.1 列出了与对象关联的系统定义元数据字段。\n\n**表 9.1：Amazon S3 系统定义元数据**\n\n| 名称 | 描述 | 用户可编辑 |\n\
  | --- | --- | --- |\n| Date | 对象创建日期。 | 否 |\n| Content-Length | 对象的大小（字节）。 | 否 |\n\
  | Last-Modified | 对象最后修改日期（如果对象从未修改过，则为创建日期）。 | 否 |\n| Content-MD5 | 对象的 MD5 哈希值。\
  \ | 否 |\n| x-amz-server-side-encryption | 表示对象是否启服务器端加密以及哪个服务提供了加密。 | 否 |\n| x-amz-version-id\
  \ | 对象版本号，仅适用于启用版本控制的对象。 | 否 |\n| x-amz-delete-marker | 仅适用于启用版本控制的对象；对于此类对象，此字段指示是否为删除标记。\
  \ | 否 |\n| x-amz-storage-class | 用于存储对象的存储类。 | 是 |\n| x-amz-website-redirect-location\
  \ | 如果配置，允许你将对象的请求重定向到另一个对象或外部 URL。 | 是 |\n\n\n\n\n进入 `/home/user/config/` 目录，找到\
  \ `settings.json`。\n在表达式 `result = calculate(a + b)` 中，加法运算符（`+`）将 `a` 与 `b` 相加，得到它们的和\
  \ `result`。\n所有的 **varName** 应该被正确围。\n执行命令 `ls -la`。\n\n```bash\nls -la /data\n\
  ```\n\n\n\n要将对象从 Amazon S3 存储桶下载到您的计算机，请按照以下步骤操作：\n\n1.  使用 Amazon S3 管理控制台导航到存储桶，选择桶名称旁边的图标，并在屏幕上弹出的对话框中点击\
  \ `Download` 按钮（图 9.15）。\n\n    ![FIGURE9.15 从存储桶下载文件](img/c09f015.png)\n\n    **图\
  \ 9.15** 从存储桶下载文件\n\n    如果您不想使用管理控制台，也可以通过 URL 访问 Amazon S3 中的任何对象。\n\n2.  要找到\
  \ Amazon S3 存储桶中对象的 URL，请在管理控制台中导航到该存储桶并选择桶内的对象。复制弹出对话框中 `Object URL` 字段的值（图 9.16）。\n\
  \n    ![FIGURE9.16 定位 Amazon S3 对象 URL](img/c09f016.png)\n\n    **图 9.16** 定位 Amazon\
  \ S3 对象 URL\n\n    `Object URL` 字段中的值遵循以下命名规范：\n\n    ```\n    https://s3.<region\
  \ name>.amazonaws.com/<bucket name> /<file name>\n    ```\n\n    例如，位于 `eu-west-2`\
  \ 区域名为 `com.asmtechnology.awsbook.testbucket1` 的存储桶中名为 `sunset.jpg` 的文件，可以使用以下 URL\
  \ 访问：\n\n    `https://s3.eu-west-2.amazonaws.com/com.asmtechnology.awsbook.testbucket1/sunset.jpg`\n\
  \n    如果您访问的存储桶和文件均不可公开，那么当您在网络浏览器中尝试该 URL 时，将收到拒绝访问的错误（图 9.17）。\n\n    ![FIGURE9.17\
  \ 非公开存储桶和文件无法通过 URL 访问](img/c09f017.png)\n\n    **图 9.17** 非公开存储桶和文件无法通过 URL 访问。\n\
  \n3.  在使对象可以公开访问之前，您需要更改存储桶的公共访问设置。选择存储桶并切换到 `Permissions` 标签（图 9.18）。\n\n    ![FIGURE9.18\
  \ 访问 Amazon S3 存储桶权限](img/c09f018.png)\n\n    **图 9.18** 访问 Amazon S3 存储桶权限\n\n\
  4.  点击 `Edit` 按钮并取消勾选四个选项（图 9.19）。\n\n    ![FIGURE9.19 配置 Amazon S3 存储桶权限](img/c09f019.png)\n\
  \n    **图 9.19** 配置 Amazon S3 存储桶权限\n\n5.  点击 `Save` 按钮。\n\n6.  切换到 `Overview` 标签并选择\
  \ Amazon S3 存储桶中的对象。在 `Actions` 下拉菜单下点击 `Make Public` 项（图 9.20）。\n\n    ![FIGURE9.20\
  \ 访问 Make Public 选项](img/c09f020.png)\n\n    **图 9.20** 访问 Make Public 选项\n\n7.\
  \  在屏幕上弹出的对话框中点击 `Make Public` 按钮（图 9.21）。\n\n    ![FIGURE9.21 让文件公开访问](img/c09f021.png)\n\
  \n    **图 9.21** 让文件公开访问\n\n如果您在网络浏览器中重试该 URL，您将能够访问该文件。您可以在单个对象级别设置权限，也可以为整个存储桶设置权限。\n\
  \n### 更改对象的存储类型类\n\nAmazon S3 上对象的默认存储类型类为 `Standard`。要更改对象的存储类型类：\n\n1.  使用 Amazon\
  \ S3 管理控制台导航到存储桶，并从桶的内容中选择对象。\n\n2.  在 `Actions` 下拉菜单下选择 `Change Storage Class`\
  \ 项（图 9.22）。\n\n    ![FIGURE9.22 更改对象的存储类型类](img/c09f022.png)\n\n    **图 9.22**\
  \ 更改对象的存储类型类\n\n3.  点击 `Save` 按钮。\n\n## 删除对象\n\n要从 Amazon S3 存储桶中删除对象：\n\n1.  使用\
  \ Amazon S3 管理控制台导航到存储桶，并选择桶内的对象。\n\n2.  在 `Actions` 下拉菜单下选择 `Delete` 项（图 9.23）。\n\
  \n    ![FIGURE9.23 从 Amazon S3 存储桶中删除对象](img/c09f023.png)\n\n    **图 9.23** 从 Amazon\
  \ S3 存储桶中删除对象\n\n一旦您删除对象，它将被永久移除。此规则的例外是启用了版本控制，此时被删除的对象可以恢复。\n\n### Amazon S3 桶版本控制\n\
  \n版本控制是一种概念，启用后会存储对象的版本。当存储桶启用版本控制时，您可以看到对象的所有版本。\n\n要启用版本控制：\n\n1.  在管理控制台中导航到存储桶并点击\
  \ `Properties` 标签。\n2.  展开 `Versioning` 部分，选择 `Enable` 选项并点击 `Save` 按钮（图 9.24）。\n\
  \n    ![FIGURE9.24 版本控制](img/c09f024.png)\n\n    **图 9.24** 版本控制\n\n要理解版本控制如何工作：\n\
  \n1.  在您的计算机上创建一个名为 `welcome_letter.txt` 的新文本文档，并在文档输入输入：\n\n    ```\n    欢迎来到 Amazon\
  \ 服务。\n    ```\n\n2.  保存文件并将其上传到启用版本控制的存储桶。要让对象对公开开放，您可以在 `Manage Permissions` 下拉菜单中选择\
  \ `Grant Read Access To Object`（图 9.25）。\n\n    ![FIGURE9.25 让对象公开访问](img/c09f025.png)\n\
  \n    **图 9.25** 让对象公开访问\n\n3.  获取文档的 URL 并在网络浏览器中打开文档。您的浏览器应该渲染文档的内容。\n\n4.  打开之前保存的\
  \ `welcome_letter.txt` 文件，并编辑其内容类似于：\n\n    ```\n    欢迎来到 Amazon 服务。\n    Amazon\
  \ S3 版本控制允许您访问旧版本。\n    ```\n\n5.  保存文件并再次将其上传到同一存储桶。\n\n6.  一旦文档上传完成，点击 `welcome_letter.txt`\
  \ 行以显示带有选项的对话框。展开对话框中的 `versions` 下拉菜单，显示指向文档不同版本的链接（图 9.26）。\n\n    ![FIGURE9.26\
  \ 访问对象版本](img/c09f026.png)\n\n    **图 9.26** 访问对象版本\n\n文档的最新版本始终列在顶部。请记住，您是根据文档所有版本所占用的空间收费的。\n\
  \n7.  如果您想删除不需要文档版本，请点击 `versions` 下拉菜单中文档版本旁边的垃圾桶图标。当您删除文档版本（而不是整个文档）时，您正在删除的版本将永久丢失。\n\
  \n8.  相反，如果您想删除文档，请选择该文档并使用 `Actions` 菜单下的 `Delete` 项。\n\n![FIGURE9.27 版本选择器切换](img/c09f027.png)\n\
  \n\n\n\n# [图 9.27] 版本选择器开关\n\n当选择器开关被设置为显示版本化对象时，你不仅可以看到对象版本，还能看到删除标记（delete markers），删除标记是用于指示对象已删除的特殊条目。恢复被删除的对象只需删除删除标记即可。\n\
  \n## 使用 AWS CLI 访问 Amazon S3\n\n你可以使用 `AWS CLI` 通过命令行与 Amazon S3 交互。适用于 Mac OS X\
  \ 和 Windows 的 CLI 客户端的设置和配置请参附录 C。\n\n`aws` 命令的通用语法遵循如下：\n\n```\n$ aws <service\
  \ identifier > <service instructions>\n```\n\n服务标识符（service identifier）是一个标识你想要交互的\
  \ AWS 服务的字符串。Amazon S3 的服务标识符为 `s3`（小写）。每个服务都支持不同的指令列表。要查看 CLI 中可用的 `s3` 指令列表，请访问\
  \ `http://docs.aws.amazon.com/cli/latest/userguide/using-s3-commands.html`。\n\n\
  例如，`ls` 指令会检索用户账户中已配置到 CLI 的所有桶（buckets）列表。如果你在命令行提示符输入以下指令：\n\n```\n$ aws s3 ls\n\
  ```\n\n你将收到一个桶列表：\n\n```\nAbhisheks-MacBook:~ abhishekmishra$ aws s3 ls\n2017-01-15\
  \ 16:52:59 com.asmtechnology.awsbook.testbucket1\nAbhisheks-MacBook:~ abhishekmishra$\n\
  ```\n\n除了使用 `s3` 服务标识符可以执行的高级操作外，Amazon 还提供了使用 `s3api` 服务标识符访问低级操作的方法。要了解有关使用 `s3api`\
  \ 服务标识符对 Amazon S3 桶执行低级操作的更多信息，请访问 `http://docs.aws.amazon.com/cli/latest/userguide/using-s3api-commands.html`。\n\
  \n# 总结\n\n*   Amazon S3 是一种基于对象的键值对存储服务。\n*   Amazon S3 将对象组织在桶中；桶名必须是全局唯一的。\n*\
  \   可以使用 AWS 管理控制台或 `AWS CLI` 将对象上传到 Amazon S3 桶中。\n*   你可以控制对桶以及桶内对象的访问权限。\n* \
  \  Amazon S3 中的每个对象都有一个关联的存储类（storage class）。存储类决定了 Amazon S3 如何存储该对象的数据，以及读取数据时是否会产生额外费用。\n\
  *   Amazon S3 版本控制允许你保存对象的多个版本。你将根据文档所有版本所占用的组合空间付费。\n\n# 第 10 章：Amazon Cognito\n\
  \n### 本章内容\n\n*   Amazon Cognito 基础概念介绍\n*   学习创建用户池（user pool）\n*   学习创建身份池（identity\
  \ pool）\n*   学习何时使用用户池和身份池\n\nAmazon Cognito 是 Amazon 提供的云端、符合 OAuth 2.0 标准的身份管理解决方案。你可以使用\
  \ Amazon Cognito 管理用户数据库，允许外部 Web 应用和移动应用程序访问它。Amazon Cognito 由两个不同的组件组成：\n*   用户池（User\
  \ pools）\n*   身份池（Identity pools）\n\n在本章中，你将学习这些组件以及如何使用它们。\n\n## 核心概念\n\n在本节中，你将学习在处理\
  \ Amazon Cognito 时会遇到的一些核心概念。\n\n### 身份验证 (Authentication)\n\n`Authentication` 指的是确定用户是谁的概念。这可以通过多种方式实现，但最常见的方法是要求用户提供用户名和密码。\n\
  \n### 身份授权 (Authorization)\n\n`Authorization` 指的是确定已验证用户可以做什么的概念。\n\n### 身份提供者 (Identity\
  \ Provider)\n\n`identity provider`（身份提供者）是一个符合 OAuth 2.0、OpenID Connect (OIDC) 或\
  \ SAML 等标准的服务。身份提供者验证用户凭并发布令牌（token）。\n\n### 客户端 (Client)\n\n在身份验证的上下文中，`client`\
  \ 是想要访问信息的外部（第三方）应用程序。\n\n### OAuth 2.0\n\n`OAuth 2.0` 是一种授权框架，允许第三方应用程序获取资源的有限访问权限。以下是\
  \ [OAuth 2.0](https://tools.ietf.org/html/rfc6749) 的正式定义：\n\n> OAuth 2.0 授权框架允许第三方应用程序获取对\
  \ HTTP 服务的有限访问权限，这种访问可以通过协调资源所有者与 HTTP 服务之间的交互来代表资源所有者，或者允许第三方应用程序自行获取访问。\n\n根据客户端应用程序的能力以及用户愿意信任它的程度，OAuth\
  \ 2.0 定义了四种不同的流（也称为授权类型）：\n*   授权码许可（Authorization Code Grant）\n*   隐式许可（Implicit\
  \ Grant）\n*   资源所有者凭据许可（Resource Owner Credentials Grant）\n*   客户端凭据许可（Client Credentials\
  \ Grant）\n\n### OpenID Connect\n\n`OpenID Connect` 是一种构建在 OAuth 2.0 之上的身份验证协议。OAuth\
  \ 2.0 是一个松松的授权框架；它没有定义访问令牌的技术格式或如何进行验证等细节。OIDC 在此基础上增加了基于 JSON Web 令牌 (JWT) 的身份令牌的概念。\n\
  \n## Amazon Cognito 用户池\n\n`Amazon Cognito user pool`（Amazon Cognito 用户池）是一个用户数据库和一组服务，这些服务允许在数据库中创建用户记录（注册）并针对该数据库验证用户身份。与\
  \ IAM 用户不同，Amazon Cognito 用户池中的用户无法登录 AWS 管理控制台，也无法访问 Amazon S3 或 AWS Lambda 等 AWS\
  \ 服务。\n\n用户池中的每个用户有一组与用户记录相关的配置属性，例如名称、电子邮件地址和电话号码，其中某些是可选的。Amazon Cognito 用户池提供了必要的服务器端\
  \ API 来创建用户，提供多因素身份验证和电子邮件验证等安全功能，并允许你在用户注册和身份验证过程的不同阶段调用 AWS Lambda 函数。\n\nAmazon\
  \ Cognito 用户池完全符合 OAuth 2.0 标准，并支持授权码、隐式和客户端凭据流。针对 Amazon Cognito 用户池进行身份验证的结果是一个访问令牌和一个经过签名的\
  \ JWT 身份令牌。\n\n\n\n\n身份令牌（identity token）也可以用于 Amazon Cognito 身份池（identity pool），以获取一组临时凭据，这些凭据可访问\
  \ `S3` 和 `DynamoDB` 等 AWS 服务。Amazon Cognito 对身份令牌进行签名，并根据 Amazon 在互联网上发布的已知证书对令牌签名进行验证。\n\
  \n### 身份池\n身份池是 Amazon Cognito 联邦身份对象的集合，这些对象与已身份验证的用户关联。联邦身份对象由一组凭据组成，用于访问 `Amazon\
  \ S3` 和 `Amazon DynamoDB` 等服务。联邦身份对象是短寿命的，仅发放给能够提供有效符合 OIDC 标准身份令牌或 SAML 令牌的请求方。每个联邦身份对象都有一个\
  \ `IAM` 策略文档，用于控制可以哪些 AWS 资源。\n\n### Amazon Cognito 联邦身份\nAmazon Cognito 联邦身份是一项服务，它提供了将有效的符合\
  \ OIDC 标准身份令牌或 SAML 令牌交换为联邦身份对象的机制。如果您使用 Amazon Cognito 用户池（user pools）作为您的 OAuth\
  \ 2.0 身份提供程序，可以轻松地将用户池与身份池集成，从而无缝地将从用户池收到的 `JWT` 身份令牌交换为联邦身份对象。\n\n用户池和身份池结合使用，形成一个完整的身份验证和授权解决方案，允许非\
  \ IAM 用户通过您的 Web 或移动应用程序访问您的 AWS 资源。\n\n除了 Amazon Cognito 用户池外，身份池还可以为通过以下附加机制进行身份验证的用户提供临时\
  \ AWS 凭据：\n* Facebook 登录\n* Google 登录\n* Amazon 登录\n* 其他 OIDC 提供者，例如 `Auth0`、`Ping`\
  \ 等\n* SAML 提供者\n\n## 常见任务\n在本节中，您将学习如何使用 Amazon Cognito 管理控制台创建 `S3` 用户池和身份池，并配置身份池，为提供由\
  \ Amazon Cognito 用户池颁发的有效访问令牌的用户发放联邦身份。使用您专用的 `IAM` 用户特定登录链接登录 `IAM` 控制台，并导航到 Amazon\
  \ Cognito 服务主页（图 10.1）。\n\n![图 10.1 访问 S3 管理控制台](img/c10f001.png)\n\n![图 10.1](img/#c10.xhtml#R_c10-fig-0001)\
  \ 访问 S3 管理控制台\n\n### 创建用户池\n要创建一个新的 Amazon Cognito 用户池，请按照以下步骤操作。\n\n1. 点击 Cognito\
  \ 启动界面上的 `Manage User Pools`（管理用户池）按钮，访问现有用户池列表（图 10.2）。\n   ![图 10.2 Amazon Cognito\
  \ 启动界面](img/c10f002.png)\n   ![图 10.2](img/#c10.xhtml#R_c10-fig-0002) Amazon Cognito\
  \ 启动界面\n\n2. 要添加新用户池，点击屏幕右上角的 `Create A User Pool`（创建用户池）按钮（图 10.3）。用户池特定于 `AWS`\
  \ 区域。在创建用户池之前，请确保已设置 `AWS` 管理控制台使用正确的区域。\n   ![图 10.3 创建用户池](img/c10f003.png)\n\
  \   ![图 10.3](img/#c10.xhtml#R_c10-fig-0003) 创建用户池\n\n3. 为用户池输入名称并点击 `Settings`（设置）按钮（图\
  \ 10.4）。用户池名称必须在 1 到 128 个字符之间，且之后无法更改。池名称可以包含大写字母 (`A-Z`)、小写字母 (`a-z`)、数字 (`0-9`)\
  \ 以及以下特殊字符：`+`、`@` 和 `-`。\n   ![图 10.4 指定用户池名称](img/c10f004.png)\n   ![图 10.4](img/#c10.xhtml#R_c10-fig-0004)\
  \ 指定用户池名称\n\n4. `Attributes`（属性）屏幕允许您指定用户注册的方式所需所需。在注册过程中，配置将包含标准属性：\n   * `address`（地址）\n\
  \   * `birthdate`（出生日期）\n   * `email`（电子邮件）\n   * `family_name`（姓）\n   * `gender`（性别）\n\
  \   * `given_name`（名）\n   * `middle_name`（中间名）\n   * `name`（名称）\n   * `nickname`（昵称）\n\
  \   * `phone_number`（电话号码）\n   * `picture`（头像）\n   * `preferred_username`（优用户名）\n\
  \   * `timezone`（时区）\n   * `updated_at`（更新时间）\n   * `website`（网站）\n\n   在您希望强制要求的属性旁边打勾。在您创建用户池时，大多数这些属性都是可选的。当用户通过用户池进行身份验证时，`JWT`\
  \ 身份令牌可以包含 OpenID Connect 规范（http://openid.net/specs/openid-connect-core-1_0#StandardClaims）中描述的标准声明。\n\
  \   ![图 10.5 用户池](img/c10f005.png)\n   ![图 10.5](img/#c10.xhtml#R_c10-fig-0005)\
  \ 用户池\n\n5. `Policies`（策略）屏幕允许您设置密码策略、设置用户是否可以在没有帮助的情况下注册，并指示未使用创建账户过期天数。\n   使用屏幕上的选项，选择您希望密码遵循的安全要求（图\
  \ 10.7）。\n   ![图 10.7 设置策略](img/c10f007.png)\n   ![图 10.7](img/#c10.xhtml#R_c10-fig-0007)\
  \ 设置策略\n\n   确保勾选了 `Allow Users To Sign The Up`（允许用户注册）选项。如果没有勾选，用户无法通过您的应用程序注册；您必须使用\
  \ Amazon Cognito 管理控制台为他们手动创建。您还可以指定通过管理控制台创建的未使用用户账户过期前的天数。默认值为 7 天。\n\n6. `MFA\
  \ and Verifications`（MFA 和验证）屏幕允许您为用户账户启用多因素身份验证以及电子邮件/电话号码验证（图 10.8）。\n   ![图 10.8\
  \ 多因素身份验证因素设置](img/c10f008.png)\n   ![图 10.8](img/#c10.xhtml#R_c10-fig-0008) 多因素身份验证因素设置\n\
  \n   启用后，当有人尝试登录您的移动应用程序时，MFA 会增加一个额外的安全步骤。在这个额外的步骤中，个人需要提供一个由身份验证设备生成的临时且唯一的六位数字代码。\n\
  \n\n\n\n你还可以选择用户在注册过程中是否需要验证其电子邮件地址或手机号。如果你同时禁用了电子邮件地址和手机号验证，用户将无法重置遗忘的密码。\n\n如果你决定启用手机号验证，Cognito\
  \ 需要使用 Amazon SNS 向用户的设备发送短信消息。为了让 Cognito 能够访问 Amazon SNS，系统会提示你创建一个新的 IAM 角色，Cognito\
  \ 在与 Amazon SNS 通信时可以使用该角色。\n\n### 7. 消息自定义界面 (Message Customizations screen)\n\
  消息自定义界面允许你自定义电子邮件和短信验证消息的文本（**图 10.9](#）。\n\n![图 10.9 定制电子邮件和短信验证码消息](img/c10f009.png)\n\
  \n`图 10.9` 定制电子邮件和短信验证码消息\n\n你不需要更改默认消息。但是，如果你选择要更改，请确保你的消息包含 `{####}` 占位符字符串。Cognito\
  \ 会将占位符字符串替换为四位数的验证码，用户必须在注册过程中将其输入你的应用。\n\n点击“下一步 (Next Step)”按钮继续。\n\n### 8. 标签界面\
  \ (Tags screen)\n标签界面允许你添加成本分配标签，这些标签可以用于跟踪 AWS 成本（**图 10.10](#）。\n\n![图 10.10 成本分配标签设置界面](img/c10f010.png)\n\
  \n`图 10.10` 成本分配标签设置界面\n\n如果你向用户池添加了成本分配标签，你的 AWS 成本分配报告将包含使用这些标签聚合的成本和流量。如果你想了解更多关于在\
  \ AWS 资源中使用成本分配标签的信息，请访问 `http://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html`。\n\
  \n点击“下一步 (Next Step)”按钮继续。\n\n### 9. 设备界面 (Devices screen)\n设备界面提供了选项，让你决定用户池是否记住你的用户登录你的应用时使用的设备（**图\
  \ 10.11](#）。\n\n![图 10.11 你可以设置用户池来记住设备](img/c10f011.png)\n\n`图 10.11` 你可以设置用户池来记住设备\n\
  \n你可以在三个选项之间选择：\n\n*   `No`：这是默认选项。不记住设备。\n*   `Always`：记住你的应用用户使用的每个设备。\n*   `User\
  \ Opt In`：为用户提供选项来记住他们正在使用的设备。你必须在应用中创建用户界面以允许用户选择加入。\n\n如果你选择让 Cognito 记住用户的设备，当用户第一次使用该设备登录时，每个设备都会被分配一个设备标识符（密钥和密钥）。此密钥除了识别设备外没有其他用处，但\
  \ Cognito 会对其进行跟踪。你还可以选择对 Cognito 跟踪的设备抑制 MFA 挑战。\n\n点击“下一步 (Next Step)”按钮继续。\n\n\
  ### 10. 应用客户端界面 (App Clients screen)\n应用客户端界面允许你配置连接到用户池以身份验证用户的外部应用程序（**图 10.12](#）。在此界面中定义的每个应用程序都会获得一个客户端\
  \ ID (client ID)，有时还有一个客户端密钥 (client secret)。你需要将这些值提供给应用开发者。客户端密钥不应公开共享，且外部应用程序必须具有安全机制来存储此客户端密钥。\n\
  \n![图 10.12 配置可以使用用户池进行身份验证的应用程序](img/c10f012.png)\n\n`图 10.12` 配置可以使用用户池进行身份验证的应用程序\n\
  \n对于访问信任服务器的移动和 Web 应用，通常做法是让应用程序在连接到 Amazon Cognito 验证用户之前，从其自己的信任服务器检索客户端密钥。如果应用程序无法安全地存储客户端密钥（例如\
  \ JavaScript 应用），你需要确保在配置用户池中的应用入口时不要生成客户端密钥。\n\n你可以在用户池创建后向其添加应用，在这种情况下你可以跳到下一步。如果你想在此阶段添加应用程序，请点击页面上的“添加应用客户端\
  \ (Add An App Client)”链接，如果应用无法安全存储客户端密钥，请记住取消勾选“生成客户端密钥 (Generate Client Secret)”选项（**图\
  \ 10.13](#）。\n\n![图 10.13 创建应用程序界面](img/c10f013.png)\n\n`图 10.13` 创建应用程序界面\n\n在创建应用时，你还可以选择哪些用户池属性将出现在用户成功验证后生成的\
  \ JWT 令牌中。点击“下一步 (Next Step)”按钮完成应用创建（**图 10.14](#）。\n\n![图 10.14 用户池中的应用程序列表](img/c10f014.png)\n\
  \n`图 10.14` 用户池中的应用程序列表\n\n如果你在创建用户池的过程中创建应用客户端，客户端 ID 和密钥在用户池创建之前将是不可见的。点击左侧菜单上的“触发器\
  \ (Triggers)”继续。\n\n### 11. 触发器界面 (Triggers screen)\n触发器界面允许你将 AWS Lambda 函数与特定的用户池触发器关联（**图\
  \ 10.15](#）。\n\n![图 10.15 在用户身份验证过程的关键点调用 Lambda 函数](img/c10f015.png)\n\n`图 10.15`\
  \ 在用户身份验证过程的关键点调用 Lambda 函数\n\n在本书编写时，可用的触发器包括：\n\n*   `Pre Sign-Up`（注册前）：在用户提交所有详细信息以用户池中创建新账户时调用。你的\
  \ AWS Lambda 函数可以验证用户提交的信息并接受或拒绝注册请求。\n*   `Pre Authentication`（身份验证前）：在用户提交详细信息通过用户池进行身份验证时调用。你的\
  \ AWS Lambda 函数可以验证用户提交的信息并接受或拒绝身份验证请求。\n*   `Post Authentication`（身份验证后）：在用户通过后调用。你的\
  \ AWS Lambda 函数可以用于生成适当的分析消息或向用户发送电子邮件。\n*   `Custom Message`（自定义消息）：在发送电子邮件/短信验证消息之前以及发送\
  \ MFA 消息之前调用。你的 AWS Lambda 函数可以自定义发送消息的内容。\n*   `Post Confirmation`（确认后）：在用户成功完成电子邮件/短信验证后调用。你的\
  \ AWS Lambda 函数可以用于生成适当的分析消息或向用户发送电子邮件。\n*   `Define Auth Challenge`（定义挑战）：在自定义身份验证流开始时调用。你的\
  \ AWS Lambda 函数可以定义用户作为自定义身份验证流的一部分需要满足的挑战。\n*   `Create Auth Challenge`（创建挑战）：在自定义身份验证流开始后调用。调用你的\
  \ AWS Lambda 函数来创建由 Define Auth Challenge 触发器执行的 Lambda 函数所定义的挑战。\n*   `Verify Auth\
  \ Challenge Response`（验证挑战响应）：用于验证用户对自定义身份验证挑战响应的有效性。\n*   `Pre Token Generation`（令牌生成前）：在生成\
  \ JWT 身份令牌之前调用。你的 AWS Lambda 函数可以自定义 JWT 令牌中的声明 (claims)。\n\n\n\n\n\n- `User Migration`（用户迁移）：当用户从现有的目录服务迁移到您的用户池时触发。\n\
  \n12. 审核界面允许您检查目前为止已指定的选项（图 10.16）。\n\n![图 10.16 用户池审核界面](img/c10f016.png)\n\n图\
  \ 10.16 用户池审核界面\n\n在完成对用户池设置的审核后，点击 `Create Pool`（创建池）按钮创建用户池。\n\n### 获取应用客户端密钥\n\
  \n在配置用户池中可以访问未身份验证 API 的客户端应用列表时，您可以选择为每个应用生成 `client ID` 和 `client secret`。`client\
  \ secret` 仅在用户池创建后可用。\n\n一旦您完成用户池的创建，您的新用户池将与 Cognito 用户池管理控制中的任何现有用户池一起列出。\n\n\
  点击您的用户池并导航到用户池的 `App Clients`（应用客户端）部分以查看应用客户端列表。点击 `Show Details`（显示详情）按钮查看 `client\
  \ ID` 和 `client secret`（图 10.17）。\n\n![图 10.17 点击 Show Details 按钮显示应用客户端 ID 和应用客户端密钥](img/c10f017.png)\n\
  \n图 10.17 点击 Show Details 按钮显示应用客户端 ID 和应用客户端密钥。\n\n在您的应用程序中安全地分发和存储 `client secret`\
  \ 是您的职责。\n\n### 创建身份池\n\n身份池是一个联合身份的数据库，可用于获取一组临时凭证，以访问如 `S3` 和 `DynamoDB` 等其他 AWS\
  \ 服务。这些联合身份在身份池内是唯一的，并与来自身份提供者（如 Amazon Cognito 用户池、Facebook、Google 和 [Amazon.com](http://amazon.com)）的身份相关联。\n\
  \n身份池特定于 AWS 区域。在创建身份池之前，请确保您已设置 AWS 管理控制台使用正确的区域。要创建新的 Amazon Cognito 身份池，请遵循以下步骤：\n\
  \n1. 点击 Cognito 欢迎界面上的 `Manage Identity Pools`（管理身份池）按钮（图 10.18）。\n\n![图 10.18 Amazon\
  \ Cognito 欢迎界面](img/c10f018.png)\n\n图 10.18 Amazon Cognito 欢迎界面\n\n2. 如果在该 AWS 区域中没有任何身份池，将引导您进入\
  \ `Create Identity Pool`（创建身份池）向导的第一步（图 10.19）。\n\n![图 10.19 创建新的身份池](img/c10f019.png)\n\
  \n图 10.19 创建新的身份池\n\n如果您在 AWS 区域中有一个或多个现有身份池，将引导您进入列出身份池的屏幕。在屏幕左上角找到 `Create New\
  \ Identity Pool`（创建新身份池）按钮（图 10.20）。\n\n![图 10.20 现有身份池列表](img/c10f020.png)\n\n\
  图 10.20 现有身份池列表\n\n3. 为您的身份池指定一个名称。取消勾选 `Enable Access To Unauthenticated Identities`（启用对未身份验证身份的访问）复选框是一个好。启用此复选框将为未通过身份提供者验证的用户生成\
  \ AWS 凭证。\n\n您可能希望通过未身份验证身份启用访问的一种场景是：外部应用程序是您自己的，且您的应用程序构建方式使得用户不需要在应用程序第一个屏幕上进行身份验证。在这种情况下，您的应用程序可能需要访问某些\
  \ AWS 资源，以提供不依赖于知道谁在使用该应用程序的功能。例如，您应用程序中的最近公告屏幕可以由 AWS 账户中的 Amazon DynamoDB 表驱动。要让您的应用程序从此\
  \ Amazon DynamoDB 表读取项目，它必须使用一组未身份验证凭证。\n\n4. 展开页面的 `Authentication Provider`（身份提供者）部分，配置您希望接受其身份令牌的身份提供者。如果您使用\
  \ Amazon Cognito 用户池作为您的身份提供者，请输入 `user pool ID` 和 `app client ID`（图 10.21）。\n\n\
  ![图 10.21 指定 Amazon Cognito 用户池 ID 和应用客户端 ID](img/c10f021.png)\n\n图 10.21 指定 Amazon\
  \ Cognito 用户池 ID 和应用客户端 ID\n\n如果您在用户池中定义了多个应用客户端，将需要创建多个身份池，因为身份池只能关联到单个应用客户端。\n\
  \n点击页面底部的 `Create` 按钮继续。\n\n5. 下一个屏幕允许您为未身份验证身份创建新角色（图 10.22）。您也可以选择现有的角色。\n\n![图\
  \ 10.22 Cognito 在默认情况下为未身份验证身份创建新角色](img/c10f022.png)\n\n图 10.22 Cognito 在默认情况下为未身份验证身份创建新角色。\n\
  \n身份验证角色决定了在应用程序未通过身份提供者身份验证的情况下可以访问哪些服务。未身份验证角色控制未身份验证应用程序可以访问的服务。\n\n您可以使用 IAM\
  \ 管理控制台更新策略以精细控制您的 AWS 资源。\n\n6. 点击屏幕底部的 `Allow` 按钮完成创建身份池。\n\n### 用户池还是身份池：您应该使用哪一个？\n\
  \n如果您是 Amazon Cognito 以及通用 API 验证的新手，理解用户池和身份池的区别以及何时使用它们可能是困难的。\n\nAWS 在底层上是一组\
  \ REST Web 服务；但并非所有服务都接受 OIDC 令牌。事实上，唯一支持 OIDC 令牌的 Web 服务是 Amazon API Gateway。这意味着，除非通过\
  \ Amazon API Gateway 将 Amazon S3 资源暴露给外部，否则您无法使用 OIDC 令牌访问 Amazon S3 资源。\n\n驱动 Amazon\
  \ S3、Amazon DB 和 AWS Lambda 的原生 AWS REST API 都使用由 `access key ID` 和 `secret access\
  \ key` 组成的凭证工作。在创建 IAM 用户时，您可以选择生成这些密钥（图 10.23）。\n\n![图 10.23 获取访问 AWS 所需凭证](img/c10f023.png)\n\
  \n图 10.23 获取访问 AWS 所需凭证\n\n当您配置 AWS CLI 时，会在配置过程中要求提供这些凭证：\n\nIAM 允许根据每个 IAM 用户发放\
  \ `access key ID` 和 `secret access key`。您使用 IAM 管理控制台手动创建 IAM 用户，并安全地与用户共享 `access\
  \ key ID` 和 `secret access key`，要求用户妥善保存。`access key ID` 和 `secret access key` 是持有者凭证——AWS\
  \ CLI 无法得知输入这些值的人不是为其创建密钥的用户——这就是为什么您要求您的 IAM 用户妥善保存这些值。\n\n\n\n\n\nAmazon Cognito\
  \ 身份池（identity pool）会发放临时访问密钥 ID 和秘密访问密钥，因此，只有当您想要不使用 API 网关访问 AWS 资源时，才使用身份池。但问题是，身份池应该将这些密钥发放给谁呢？这就是将身份池与身份提供者（identity\
  \ provider）关联之处。一旦身份池与身份提供者关联，只有提交由身份提供者签名的身份令牌的请求才会获得临时 AWS 凭证。\n\nAmazon Cognito\
  \ 用户池（user pool）是一个类似于 Auth0 或 Ping 的身份提供者。它允许用户进行身份验证并接收访问令牌和身份令牌。这些令牌可以任何接受 OIDC\
  \ 令牌的 REST API。因此，如果你需要访问某些接受 OIDC 令牌的现有非 AWS REST API，那么你应该只使用 Amazon Cognito 用户池。\n\
  \n# 总结\n\n* Amazon Cognito 是 Amazon 的云端、符合 OAuth 2.0 标准的身份管理解决方案。\n* Amazon Cognito\
  \ 用户池是一个用户数据库以及一组服务，这些服务允许在数据库中创建用户记录（注册）并根据数据库对用户进行身份验证。\n* Amazon Cognito 用户池完全符合\
  \ OAuth 2.0 标准，并支持授权码（Auth Code）、隐式（Implicit）和客户端凭据（Client Credentials）流。\n* 身份池是\
  \ Amazon Cognito 联邦身份对象的集合，这些对象与经过身份验证的用户关联。\n* 联邦身份对象由一组凭据组成，可访问 Amazon S3 和 Amazon\
  \ DynamoDB 等 AWS 服务。\n* 用户池和身份池结合使用形成一个完整的身份验证和授权解决方案，允许非 IAM 用户通过您的 Web 或移动应用程序访问您的\
  \ AWS 资源。\n\n# 第 11 章：Amazon DynamoDB\n\n### 本章内容\n\n* DynamoDB 简介——Amazon 的 NoSQL\
  \ 数据库\n* 创建 DynamoDB 表\n* 使用 Amazon Comprehend 管理控制台分析文本\n* 向 DynamoDB 表中添加项目\n\
  * 在 DynamoDB 表上执行扫描（scans）和查询（queries）\n* **注意**：Amazon 有时会更新 Amazon DynamoDB 管理控制台的用户界面。因此，本章中的某些截图可能与您在浏览器中看到的的不符。然而，您在本章中将学的通用概念仍然适用。\n\
  \nDynamoDB 是 Amazon 的云端、高扩展、冗余的 NoSQL 数据库服务。Amazon 通过代您处理硬件采购、设置、复制和扩展等管理任务，消除了构建和维护冗余扩展数据库服务的烦恼。\n\
  \n使用 Amazon DynamoDB，您可以在 AWS 云中创建数据库表，并使用基于 Web 的控制台或 `AWS CLI` 对这些表进行读写，或者通过使用\
  \ AWS SDK 之一直接从您的项目进行操作。Amazon DynamoDB 将您的数据存储在快速 SSD 存储上，并将表中的数据分布在多个服务器上，以实现快速且一致的访问时间。表中的所有数据还会自动复制到所选区域内的所有可用区\
  \ (AZs)。\n\n除了云端 DynamoDB 服务外，Amazon 还提供了可下载的 DynamoDB 版本，您可以在计算机上本地运行它。有关 DynamoDB\
  \ 可下载版本的更多信息，请访问 `https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DynamoDBLocal.html`。\n\
  \n## 核心概念\n\n在本节中，您将学习在处理 Amazon DynamoDB 时遇到的一些核心概念。\n\n### 表（Tables）\n\nDynamoDB\
  \ 将您的数据存储在表中，表仅仅是数据的集合。表的概念存在于每一个数据库管理系统中。\n\n与传统的关系型数据库管理系统 (RDBMS) 不同，DynamoDB\
  \ 不需要表具有预定义的架构（schema）或表与表之间的任何预定义关系。在后台，DynamoDB 表中的数据存储在 JSON 文件中。\n\nDynamoDB\
  \ 表特定特定的 AWS 区域，并会自动复制到该区域的所有可用区。\n\n### 全局表（Global Tables）\n\n全局表是分布在不同 AWS 区域的一个或多个相同副本表的集合。每个副本表都存储相同的项目集。全局表允许更改自动传播到底层的特定区域的副本表中。\n\
  \n### 项目（Items）\n\nDynamoDB 表是称为“项目”（items）的对象的集合。一个项目是一组属性，可以被视为表中的行。例如，名为 `BankAccounts`\
  \ 表中的每个项目都对应一个银行账户。表中的项目存在数量没有限制。\n\n### 属性（Attributes）\n\n属性是数据的基本单元。您可以将属性视为表中的列。例如，名为\
  \ `BankAccounts` 表中的属性可以是 `AccountNumber`、`AccountType` 和 `CurrentBalance`。\n\n\
  一个项目包含的属性数量没有限制。这与关系型数据库非常不同。属性可以是以下数据类型之一：\n\n* 标量类型（Scalar types）：数字（Number）、字符串（String）、二进制（Binary）\n\
  * 文档类型（Document types）：列表（List）、映射（Map）\n* 集合类型（Set types）：字符串（String）、数字（Number）、二进制（Binary）\n\
  \n有关属性数据类型的更多信息，请访问 `http://docs.aws.amazon.com/amazondynamodb/latest/developerguide/HowItWorks.NamingRulesDataTypes.html`。\n\
  \n### 主键（Primary Keys）\n\n每个 DynamoDB 表都有标识项目的主键。主键是在创建表时定义的属性，每个项目（行）必须对主键有一个唯一值。DynamoDB\
  \ 中有两种类型的主键：\n\n* 分区键（Partition key）：这是一个简单的主键；它是一个在表中所有项目中都必须唯一的单个属性。DynamoDB 使用此键的值来确定存储项目的分区（物理存储卷）。\n\
  * 分区键和排序键（Partition key and sort key）：这是一个由两个属性组成的复合主键。复合键的第一个属性是分区键，DynamoDB 用它来确定存储项目的物理存储卷。复合键的第二部分是排序键，用于对存储在相同存储卷上的值进行排序。具有复合主键的表中的项目可以具有相同的分区键值，这意味着这些项目存储在一起。但是，分区键和排序键的组合对于表中的每个项目必须是唯一的。\n\
  \n分区键也称为哈希键（hash key），因为其值被用作哈函数的输入以确定存储存储卷。排序键也称为范围键（range key）。\n\n### 二级索引（Secondary\
  \ Indexes）\n\n在 DynamoDB 中创建表时，您会被要求提供主键（简单或复合）。DynamoDB 允许您通过提供主键属性的值从表中读取数据。\n\
  \n然而，如果您想使用其他非键属性读取数据，则需要在表上创建二级索引。二级索引是使用两个属性的组合创建的，第一个属性称为分区键，第二个属性称为排序键。\n\n\
  有两种类型的二级索引：\n\n* 全局二级索引（Global secondary index）：索引的分区键和排序键部分可以是表中的任何两个属性，与组成主键的属性不同。\n\
  \n\n\n\n\n- `Local secondary index`: 索引的分区键与表的分区键相同；索引的排序键部分可以是表中的任何其他属性。\n\n一旦你在此表上创建了二级索引，你就可以在查询和扫描中使用该索引。\n\
  \n## 查询 (Queries)\n\n查询是根据主键属性的值在 DynamoDB 表中搜索数据的操作。你必须提供分区键的值、排序键的值（如果使用复合主键）以及一个比较运算符。查询返回一个包含表中所有匹配查询条件的项的集合。默认情况下，查询包含集合中每个项的所有属性值。你可以在查询中提供一个名为“投影表达式”（projection\
  \ expression）的额外表达式，以返回该项的较少属性。\n\n投影表达式在将结果展示给你之前对查询结果进行过滤。Amazon 会根据你从 DynamoDB\
  \ 读取的数据量进行收费，在查询的情况下，费用是在应用投影表达式之前计算的。你只能对属于主键部分或表上任一二级索引的属性值来构建查询。\n\n## 扫描 (Scans)\n\
  \n扫描是返回表中所有项的操作。与查询不同，扫描不会根据键或索引的值检索特定项；它提供表中的所有数据。\n\n你可以在扫描中提供一个名为“投影表达式”的额外表达式，以返回该项的较少属性。投影表达式在将结果展示给你之前对扫描结果进行过滤。\n\
  \nAmazon 会根据你从 DynamoDB 读取的数据量进行收费，由于扫描会读取整个表，因此你将为表中的所有数据付费——即使你过滤结果以只返回单个项。对于大表，这可能会迅速变成一项昂贵的开支。只要可能，选择查询而不是扫描。\n\
  \n## 读取一致性 (Read Consistency)\n\nDynamoDB 表是以区域（region）为范围的。在不同区域之间可能存在同名的表，这些表之间没有任何关系。当你创建表时，它将在你在管理控制台中选择的区域中创建。\n\
  \n在一个区域内，AWS 跨多个可用区（AZ）存储你的 DynamoDB 表数据的冗余副本。当你向 DynamoDB 表写入数据时，AWS 会更新所有数据副本。但是，在所有数据副本更新之前可能需要极短的时间。\n\
  \n当你从 DynamoDB 表读取数据时，你可以从两种不同的一致性模型中选择：\n\n- `最终一致性读取 (Eventually consistent reads)`：响应可能无法反映最近写入操作的结果，并可能包含过时数据。AWS\
  \ 需要大约一秒的时间来更新区域内多个可用区的所有表副本；但如果你使用全局表（global tables），延迟可能会非常显著。\n\n- `强一致性读取 (Strongly\
  \ consistent reads)`：响应包含所有之前成功写入的数据。响应可能需要更多时间，因为 DynamoDB 必须等待所有之前的更新操作完成。\n\n\
  DynamoDB 默认的读取一致性模型是最终一致性，这可以解释为“读取操作最终将保持一致”。DynamoDB 的查询和扫描有一个额外的可选参数，允许你指定想要使用的读取一致性模型。\n\
  \n## 读/写容量模式 (Read/Write Capacity Modes)\n\nAmazon 根据你对 DynamoDB 读取和写入数据进行收费，并提供了两个选项允许你控制这些费用的计算方式：\n\
  \n- `按需模式 (On Demand Mode)`：这是一种灵活的读取和写入请求按需付费模型，你只需为你使用的部分付费。如果你的应用程序具有不可预测的用法模式，这是一个很好的选择。你的账单金额取决于你消耗的读取和写入请求单元的数量。\n\
  \n  一个读取请求单元代表一次强一致性读取请求，或者对于大小在 4 KB 以内的项的两次最终一致性读取请求。如果读取的项大于 4 KB，则需要额外的读取请求单元。例如，你的应用程序每次使用强一致性读取读取\
  \ 5 KB 的项时，它将消耗两个读取请求单元。\n\n  一个写入请求单元代表对 1 KB 大的项的写入操作。如果写入的项大于 1 KB，将消耗额外的写入请求单元。\n\
  \n- `预留模式 (Provisioned Mode)`：此模式允许你提前指定表的 I/O 容量。如果你的应用程序超过了这些限制，请求将受到限流（throttling）并以\
  \ HTTP 400 错误失败。在使用预留模式时，DynamoDB 允许你设置自动扩展规则。与 DynamoDB 表配合使用自动扩展可以提供一个裕量，在发生限流之前表的预留\
  \ I/O 容量。预留吞吐量以读取和写入容量单位指定。\n\n  一个读取容量单元代表每秒一次强一致性读取，或者每秒两次大小在 4 KB 以内的项的最终一致性读取。如果读取的项大于\
  \ 4 KB，则需要额外的读取容量单元。例如，如果你的应用程序每秒需要读取 100 个项，每个项的大小为 2 KB，并且你想要强一致性读取，你需要预留 100\
  \ 个读取容量单元。尽管每个项的大小为 2 KB，Amazon 在计算读取吞吐量容量时会将项的大小向上取整到最近的 4 KB 边界。这意味着如果你的项是 5 KB，你需要预留双倍的读取容量单元（200\
  \ 个读取容量单元）。\n\n  一个写入容量单元代表每秒对大小在 1 KB 以内的项的写入。例如，如果你的应用程序每秒需要写入 100 个项，每个项的大小为\
  \ 2 KB。\n\n\n\n\n\n1. 无论你处于哪个屏幕，点击 `Create Table`（创建表）按钮开始创建 DynamoDB 表。在“创建 DynamoDB\
  \ 表”屏幕（图 11.4），提供一个长度在 3 到 255 个字符之间的表名。与 S3 存储桶不同，DynamoDB 表名不是全局唯一的；它们只需要在你的账户以及所选区域内唯一即可。\n\
  \n    ![FIGURE 11.4 指定表名](img/c11f004.png)\n\n    `FIGURE 11.4` 指定表名\n\n2. 如果你想跟随本章的练习进行，请将表命名为\
  \ `customer`。将主键属性的名称指定为 `customerID`。默认情况下，创建表屏幕配置为创建简单主键。如果你想使用复合键（分区键 + 排序键），请勾选\
  \ Add Sort Key（添加排序键）复选框（图 11.5）。\n\n    ![FIGURE 11.5 为表指定复合键](img/c11f005.png)\n\
  \n    `FIGURE 11.5` 为表指定复合键\n\n3. 默认的创建表屏幕还配置为不创建二级索引，预留 5 个读取单元和 5 个写入单元的预留吞吐量容量，并启用容量自动缩放。此时没有二级索引并不是问题，因为表中还没有数据。然而，由于你是根据保留的预留吞吐量容量计费的，因此你应该从最小的读取和写入单元开始，并在以后需要时增加这些数量。\n\
  \n4. 取消勾选 Use Default Settings（使用默认设置）复选框并滚动到页面底部找到 Provisioned Capacity（预留容量）部分。禁用自动缩放并将读取和写入单元的数量更改均为\
  \ 1（图 11.6）。\n\n    ![FIGURE 11.6 更改预留 I/O 容量](img/c11f006.png)\n\n    `FIGURE 11.6`\
  \ 更改预留 I/O 容量\n\n5. 点击 `Create`（创建）按钮创建表。表需要几分钟才能形成。一旦创建完成，你的屏幕应该类似于 图 11.7 。\n\n\
  \    ![FIGURE 11.7 Amazon DynamoDB 表概览](img/c11f007.png)\n\n    `FIGURE 11.7` Amazon\
  \ DynamoDB 表概览\n\n## 向表中添加项目\n\n本节假设你已经按照上一节的描述创建了客户表。\n\n1. 在 DynamoDB 仪表板中，选择\
  \ `customer` 表，切换到 Items（项目）标签，并点击 Create Item（创建项目）按钮（图 11.8）。\n\n    ![FIGURE\
  \ 11.8 在 customer 表中添加新项目](img/c11f008.png)\n\n    `FIGURE 11.8` 在 customer 表中添加新项目\n\
  \n你将看到一个对话框，允许你为新项目添加属性。默认可唯一属性是表的主键属性（图 11.9）。\n\n    ![FIGURE 11.9 显示默认主键属性的项属性对话框](img/c11f009.png)\n\
  \n    `FIGURE 11.9` 显示默认主键属性的项属性对话框\n\n你可以通过点击现有属性旁边的 Add (+) 按钮并从上下文菜单中选择 Append（追加）或\
  \ Insert（插入）来添加属性。Append 在所选属性之后添加新属性，而 Insert 在所选属性之前添加新属性（图 11.10）。\n\n    ![FIGURE\
  \ 11.10 添加项目](img/c11f010.png)\n\n    `FIGURE 11.10` 添加项目\n\n1. 将 `customerID` 的值设置为\
  \ `1`，并使用 Add (+) 按钮根据指定值创建以下属性（图 11.11）：\n\n    ![FIGURE 11.11 指定多个属性](img/c11f011.png)\n\
  \n    `FIGURE 11.11` 指定多个属性\n    * `firstName`: John\n    * `lastName`: Woods\n\
  \    * `address`: 17 Hollow Road, Bromley\n    * `postcode`: BR34 980\n    * `country`:\
  \ United Kingdom\n\n2. 如果你更倾向于以 JSON 格式直接工作，请选择下拉菜单中的 View 选项（图 11.12）。\n\n    ![FIGURE\
  \ 11.12 以 JSON 格式查看项属性](img/c11f012.png)\n\n    `FIGURE 11.12` 以 JSON 格式查看项属性\n\n\
  3. 点击 Save（保存）按钮将项目添加到表中。你应该看到类似于 图 11.13 。\n\n    ![FIGURE 11.13 Amazon DynamoDB\
  \ 表项目项目](img/c11f013.png)\n\n    `FIGURE 11.13` Amazon DynamoDB 表项目\n\n4. 使用以下属性添加另一个项目：\n\
  \    * `customerID`: 2\n    * `firstName`: Sonam\n    * `lastName`: Mishra\n\n \
  \   正如你在 图 11.14 中所示，DynamDB 表中的项具有不同的属性。\n\n    ![FIGURE 11.14 DynamoDB 表项具有不同属性](img/c11f014.png)\n\
  \n    `FIGURE 11.14` DynamoDB 表项具有不同属性\n\n## 创建索引\n\n本节假设你已经按照“创建表”部分的描述创建了 `customer`\
  \ 表。\n\n1. 在 DynamoDB 仪表板中，选择 `customer` 表，切换到 Indexes（索引）标签，并点击 Create Index（创建索引）按钮（图\
  \ 11.15）。\n\n    ![FIGURE 11.15 创建索引](img/c11f015.png)\n\n    `FIGURE 11.15` 创建索引\n\
  \n你将看到一个对话框，允许你设置新索引的属性（图 11.16）。\n\n    ![FIGURE 11.16 索引属性对话框](img/c11f016.png)\n\
  \n    `FIGURE 11.16` 索引属性对话框\n\n1. 使用以下属性创建索引：\n    * Primary Key: `firstName`\n\
  \    * Sort Key: `lastName`\n    * Index Name: 使用默认设置\n    * Projected Attributes:\
  \ All\n    * Read Capacity: 1\n    * Write Capacity: 1\n\n2. 点击 Create 按钮完成索引创建。索引可能需要几分钟才能创建。一旦创建完成，你应该在\
  \ Indexes 标签下看到它（图 11.17）。\n\n    ![FIGURE 11.17 Amazon DynamoDB 表索引列表](img/c11f017.png)\n\
  \n    `FIGURE 11.17` Amazon DynamoDB 表索引列表\n\n一旦创建了此索引，你添加到表的每个新项目都有三个强制字段：`customerID`、`firstName`\
  \ 和 `lastName`（图 11.18）。\n\n    ![FIGURE 11.18 新项的强制字段](img/c11f018.png)\n\n   \
  \ `FIGURE 11.18` 新项的强制字段\n\n即使你对 `firstName` 和 `lastName` 创建了索引，你仍然可以创建一个与现有项目 `firstName`\
  \ 和 `lastName` 属性相同的新项目。然而，`customerID` 属性的值必须是唯一的，因为它是主键属性。\n\n1. 向表中添加另一个项目：\n\
  \    * `customerID`: 3\n    * `firstName`: Sonam\n    * `lastName`: Mishra\n\n你的表项目列表应该类似于\
  \ 图 11.19。你应该看到两个项目在 `firstName` 和 `lastName` 上具有相同的值。\n\n    ![FIGURE 11.19 Amazon\
  \ DynamoDB 表中的多个项目](img/c11f019.png)\n\n    `FIGURE 11.19` Amazon DynamoDB 表中的多个项目\n\
  \n### 执行扫描 (Scan)\n\n本节假设你已经按照“创建表”部分的描述创建了 `customer` 表。\n\n\n\n\n\n## 扫描\n\n1.\
  \ 在 DynamoDB 仪表板中，选择 `customer` 表，并切换到项（Items）选项卡。你看到的列出表中所有项的默认视图是针对主键 `customerID`\
  \ 进行扫描（scan）的结果。你可以通过查看表格第一个项目上方的深灰色区域来验证这一点（图 11.20）。\n\n   ![FIGURE 11.20 扫描操作返回的项列表](img/c11f020.png)\n\
  \n   FIGURE 11.20 扫描操作返回的项列表\n\n2. 你可以使用“添加过滤器”（`Add Filter`）按钮添加过滤表达式，用以修剪集合中的结果。图\
  \ 11.21 显示了在 `firstName` 属性上应用过滤表达式后的扫描结果。\n\n   ![FIGURE 11.21 在扫描中添加过滤表达式](img/c11f021.png)\n\
  \n   FIGURE 11.21 在扫描中添加过滤表达式\n\n3. 如果你在表上定义了索引，可以从组合框中选择它（参见图 11.22），并点击“开始搜索”（`Start\
  \ Search`）按钮基于索引执行扫描。\n\n   ![FIGURE 11.22 执行扫描时可以使用索引。](img/c11f022.png)\n\n  \
  \ FIGURE 11.22 执行扫描时可以使用索引。\n\n对索引进行扫描与对主键扫描的区别在于，后者会返回表中的每一个项（因为根据定义，所有项都有主键属性的值）。相反，索引是定义在某些属性上的，对索引的扫描只返回返回具有具有索引中所定义属性值的项。\n\
  \n需要记住的是，扫描是根据主键或索引返回表中的所有元素，然后应用可选的过滤表达式来修减结果集。在大表上，单次扫描操作可能会轻松消耗所有预留读取容量，即使过滤表达式可能将结果集修减为单行。\n\
  \n## 执行查询\n\n本节假设你已经按照“创建表”章节所述创建了 `customer` 表。\n\n在 DynamoDB 仪表板中，选择 `customer`\
  \ 表并切换到项（Items）选项卡。使用组合框从扫描（`Scan`）模式切换到查询（`Query`）模式（图 11.23）。\n\n   ![FIGURE 11.23\
  \ 从扫描模式切换到查询模式](img/c11f023.png)\n\n   FIGURE 11.23 从扫描模式切换到查询模式\n\n查询在许多方面与扫描相似，但有一个有一个重要的区别：与扫描不同，查询只返回符合\
  \ `query` 指定标准的项。[图 11.24 描绘了匹配 `customerId = 1` 项的查询结果。\n\n   ![FIGURE 11.24 基于分区键查询\
  \ DynamoDB 表](img/c11f024.png)\n\n   FIGURE 11.24 基于分区键查询 DynamoDB 表\n\n你可以选择对主键或表上定义的索引执行查询。你可以使用过滤表达式来修剪查询返回的结果集。\n\
  \n# 总结\n\n* DynamoDB 是 Amazon 提供的云端、高度可扩展、冗余的 NoSQL 数据库服务。\n* DynamoDB 将你的数据存储在快速的\
  \ SSD 存储上，并将表中的数据分布在多个服务器上，以实现快速且一致的访问时间。\n* 你表中的所有数据还会自动复制到所选区域的所有可用区（AZs）中。\n\
  * 全局表（global table）是分布在不同 AWS 区域的一个或多个相同副本表的集合。每个副本表都存储相同的项集。全局表允许更改自动传播到底层的特定区域副本表中。\n\
  * 除了云端 DynamoDB 服务外，Amazon 还提供了 DynamoDB 的可下载版本，你可以在本地计算机上运行它。\n* DynamoDB 不需要表具有预定义的架构或表与表之间的任何预定义关系。\n\
  * 在后台，DynamoDB 表中的数据存储在 JSON 文件中。\n* 分区键（partition key）用于确定存储该项的分区（物理存储卷）。\n* 复合主键由分区键和排序键（sort\
  \ key）组成。排序键用于对在相同存储卷上的值进行排序。\n* 辅助/辅助键可以被认为是额外的复合主键。\n* 查询（query）是一种根据主键属性的值在 DynamoDB\
  \ 表中搜索数据的操作。\n* 扫描（scan）是一种返回表中所有项的操作。与查询不同，扫描不会根据键或索引的值检索特定项；它提供了表中的所有数据。\n* DynamoDB\
  \ 表达式允许表在表被修改时生成事件。\n\n# 第 12 章：AWS Lambda\n\n### 本章内容\n\n* AWS Lambda 简介\n* 创建\
  \ Python Lambda 函数\n* 测试 AWS Lambda 函数\n* 查看执行日志\n* 删除 AWS Lambda 函数和 Amazon CloudWatch\
  \ 日志组\n\nAWS Lambda 是一项让你能够在 Amazon 云上运行代码而无需配置服务器的服务。Amazon 管理运行代码所需的基础设施，你为代码运行的时间付费。\n\
  \nAWS Lambda 代码根据事件进行触发。AWS 可以针对多种场景触发事件，例如文件上传到 S3 桶、DynamoDB 表发生变化、Kinesis 流接收到数据等。通过\
  \ AWS Lambda，你可以提供在这些事件发生时被触发的代码。\n\n## Lambda 的常见用例\n\nAWS Lambda 非常强大，但只有当你的代码属于支持语言且你不需要访问执行代码的底层硬件时，它对你有效。Lambda\
  \ 的一些常见用包括：\n\n* *无服务器后端*：使用 API Gateway 和 AWS Lambda 的组合，你可以构建完整的、高度可扩展的符合 OAuth2.0\
  \ 的 RESTful API，而无需配置服务器。\n* *触发器*：你可以使用 AWS Lambda 根据 S3 桶和 DynamoDB 表的变化运行代码。代码可以执行各种任务，例如强制数据完整性检查、发送电子邮件、写入队列以及与其他\
  \ AWS 服务（如 Amazon Machine Learning 和 AWS Rekognition）交互。\n* *维护*：你可以使用 AWS Lambda\
  \ 根据计划事件运行代码。此类代码可以对数据库内容执行必要的维护和清理。\n* *流*：你可以配置 AWS Lambda 代码，在数据数据到达 Kinesis\
  \ 流时运行。Amazon Kinesis 流允许你构建处理来自多个源（如社交媒体流、金融交易和 IoT 硬件）流数据的应用程序。\n\n## 核心概念\n\n\
  在本节中，你将学习在使用 AWS Lambda 时遇到的一些核心概念。\n\n### 支持的语言\n\nAWS Lambda 支持以下语言：\n\n* Node.js\n\
  * Ruby\n* Java\n* C#\n* Python\n* Go\n\n\n\n\n你可以使用多种 IDE 来编写代码，例如 Eclipse 和 Visual\
  \ Studio。Amazon 在 AWS Lambda 控制台中也提供了一个基于 Web 的 IDE。与 `Eclipse` 或 `Visual Studio`\
  \ 相比，Amazon 提供的 Web 版 IDE 功能较为有限，但如果你想快速在 `Node.js` 或 `Python` 中组合出一个函数，它是非常有用的。要查看创建\
  \ Lambda 代码所需的可用 IDE 和工具的完整列表，请访问 `http://docs.aws.amazon.com/lambda/latest/dg/lambda-app.html`。\n\
  \n本章中的示例是用 `Python` 编写的。有关其他支持的语言的信息，请访问 `http://docs.aws.amazon.com/lambda/latest/dg/lambda-introduction-function.html`。\n\
  \n## Lambda 函数\n\n要创建一个 AWS Lambda 函数，你首先需要创建一个部署包，该包包含了你想要执行的代码以及任何依赖项。当你使用 AWS\
  \ Lambda 控制台创建函数时，系统会为你创建部署包。如果你使用自己的 IDE，则需要由自己创建部署包，然后将此部署包和配置信息上传到 AWS Lambda\
  \ 以创建 Lambda 函数。\n\n在大多数情况下，部署包是一个 `.zip` 文件，你可以使用命令行工具或 AWS Lambda 管理控制将其上传到 AWS\
  \ Lambda。你不需要手动创建部署包，可以使用如 `Jenkins` 和 `Maven` 等工具。有关为其中一种支持的语言创建部署包的更多信息，请访问 `http://docs.aws.amazon.com/lambda/latest/dg/deployment-package-v2.html`。\n\
  \n随部署包的配置信息提供了以下关键信息：\n\n*   `Compute requirements`（计算需求）：你指定想要分配给 Lambda 函数的内存量。AWS\
  \ Lambda 根据你请求的内存量比例分配 CPU 资源。CPU 与内存分配的比例与 `M3 EC2 instance` 相同。如果你想了解特定实例类型对应的精确硬件，请访问\
  \ `https://aws.amazon.com/ec2/instance-types/`。\n\n*   `Execution timeout`（执行超时）：这是一个以秒为单位的数字，决定允许函数的最长时间。一旦达到此限制，Lambda\
  \ 函数将终止。\n*   `Execution role`（执行角色）：这是 AWS Lambda 在执行你的函数时 get 的 IAM 角色。\n*   `Handler\
  \ name`（处理程序名称）：这是你代码中 AWS Lambda 开始执行的方法名称。\n\n## 模型\n\n无论你选择什么语言来编写 Lambda 函数，所有\
  \ Lambda 函数都有几个共同的核心概念：处理程序（handlers）、事件（events）、上下文（context）、日志（logging）和异常（exceptions）。\n\
  \n### HANDLERS\n\n处理程序是 Lambda 函数的入口点。它是 AWS Lambda 调用以启动函数执行的方法。处理程序方法随后可以调用代码中组成\
  \ Lambda 函数的其他方法。\n\n当你的处理程序方法被调用时，AWS Lambda 会注入有关触发你的 Lambda 函数的事件数据以及一个上下文对象（context）。你可以通过处理程序方法的第一个参数访问这些事件数据。\n\
  \n处理程序方法的名称在创建 Lambda 函数时提供的配置信息中标识。用 `Python` 编写的 Lambda 函数的处理程序方法语法如下：\n\n```\n\
  def lambda_handler(event, context):\n    return a_value\n```\n\n处理程序可以返回一个值。如果 lambda\
  \ 函数是同步调用的，调用者将接收序列化为 JSON 对象的返回值。下面的代码段提供了一个如何使用 `return` 语句的示例：\n\n```\ndef lambda_handler(event,\
  \ context):\n \n    # 返回检测到的账户详情。\n    return {\n      'bankAccountNumber': '57478289274'\
  \ ,\n      'accountName': 'Mr. Chris Woods'\n    }\n```\n\n### EVENTS\n\n事件是处理程序方法的第一个参数。它是一个标准的\
  \ JSON 字典，具有以下通用语法：\n\n```\n{\n    \"key3\": \"value3\",\n    \"key2\": \"value2\"\
  ,\n    \"key1\": \"value1\"\n}\n```\n\n事件是由 AWS 服务或自定义应用程序生成的。AWS Lambda 的事件源列出了一些常用的事件源及其生成的事件类型：\n\
  \n| SERVICE | EVENTS | DESCRIPTION |\n| --- | --- | --- |\n| S3 | Put, Delete |\
  \ 当 S3 桶中创建或删除对象时触发 S3 事件。 |\n| DynamoDB | Update | 对 DynamoDB 表进行任何更新时触发 DynamoDB\
  \ 事件。 |\n\n一个 S3 事件的负载如下：\n\n```\n{\n    \"Records\": [\n    {\n    \"eventID\"\
  : \"1\",\n    \"eventVersion\": \"2.0\",\n    \"eventTime\": \"1970-01-01T00:00:00.000Z\"\
  ,\n    \"requestParameters\": {\n        \"sourceIPAddress\": \"127.0.0.1\"\n  \
  \  },\n    \"s3\": {\n        \"configurationId\": \"testConfig\",\n        \"object\"\
  : {\n            \"eTag\": \"HappyFace.jpg\",\n            \"size\": 1024\n    \
  \    },\n        \"bucket\": {\n            \"arn\": bucketarn,\n            \"\
  name\": \"sourcebucket\",\n            \"ownerIdentity\": {\n                \"\
  principalId\": \"EXAMPLE\"\n            }\n        },\n        \"s3Version\": \"\
  1.0\"\n    },\n    \"responseElements\": {\n        \"x-amz-id-2\": \"EXAMPLE123/5678\"\
  ,\n        \"x-amz-request-id\": \"EXAMPLE12345678\"\n    },\n    \"awsRegion\"\
  : \"us-east-1\",\n    \"eventName\": \"ObjectCreated:Put\",\n    \"userIdentity\"\
  : {\n        \"principalId\": \"EXAMPLE\"\n    },\n    \"eventSource\": \"aws:s3\"\
  \n    }]\n}\n```\n\n一个 DynamoDB 事件的负载如下：\n\n```\n{\n    \"Records\": [\n    {\n\
  \    \"eventID\": \"1\",\n    \"eventVersion\": \"1.0\",\n    \"dynamodb\": {\n\
  \        \"Keys\": {\n            \"Id\": {\n                \"N\": \"101\"\n  \
  \          }\n        },\n        \"NewImage\": {\n            \"Message\": {\n\
  \                \"S\": \"New item!\"\n            },\n            \"Id\": {\n \
  \               \"N\": \"101\"\n            }\n        },\n        \"StreamViewType\"\
  : \"NEW_AND_OLD_IMAGES\",\n        \"SequenceNumber\": \"111\",\n        \"SizeBytes\"\
  : 26\n    },\n    \"awsRegion\": \"us-west-2\",\n    \"eventName\": \"INSERT\",\n\
  \    \"eventSourceARN\": eventsourcearn,\n    \"eventSource\": \"aws:dynamodb\"\n\
  \    }]\n}\n```\n\n有关不同 AWS 事件的示例事件数据可以在 `https://docs.aws.amazon.com/lambda/latest/dg/lambda-services.html`。\n\
  \n### CONTEXT\n\n这是处理程序方法的第二个参数。通过此对象，你的代码可以与 AWS Lambda 交互以获取执行环境的有用信息。以下是从上下文对象可以获得的一些信息：\n\
  \n*   Lambda 终止函数前的剩余秒数。\n*   与函数相关的 CloudWatch 日志组流。\n*   调用函数时返回给客户端的 AWS 请求 ID。该\
  \ ID 可用于向 AWS 支持进行后续查询。\n*   如果使用 AWS Mobile SDK 调用函数，则可以是移动应用的名称以及调用函数的设备。\n\n\
  ### LOGGING\n\n\n\n\n您 Lambda 函数中的任何日志语句都会写入 CloudWatch 日志中。您在代码中用于生成这些日志的精确语句取决于您正在使用的编程语言。如果您使用\
  \ Python 创建函数，可以使用以下语句来创建日志条目：\n\n- `print()`\n- `logging.Logger.info()`\n- `logging.Logger.error()`\n\
  \n如果您使用 `Logger` 模块，你的日志条目将包含时间戳和日志级别等额外信息。\n\n## 异常\n\n您的函数可以创建一个异常（exception），以通知\
  \ AWS Lambda 在执行函数代码时发生了错误。创建异常的方式取决于您正在使用的编程语言。\n\n对于使用 Python 编写的 Lambda 函数，您可以使用\
  \ `raise` 语句来抛出异常，如下所示的处理器程序所示：\n\n```\ndef lambda_handler(event, context):\n  \
  \     raise AnException('Something went wrong!')\n```\n\n当此用此处理程序时，AWS Lambda 将返回以下错误消息：\n\
  \n```\n{\n    \"errorMessage\": \"Something went wrong!\",\n    \"stackTrace\":\
  \ [\n     [\n        \"/var/task/some_function.py\",\n        3,\n        \"lambda_handler\"\
  ,\n        \"raise AnException('Something went wrong!')\"\n    ]\n    ],\n    \"\
  errorType\": \"AnException\"\n}\n```\n\n如果调用 AWS Lambda 函数的客户端是同步调用的，客户端将接收到错误消息，AWS\
  \ Lambda 将错误消息的副本写入 Amazon CloudWatch 日志。如果客户端是异步调用 AWS Lambda 函数，则错误消息将仅写入 Amazon\
  \ CloudWatch 日志。\n\n## 执行环境\n\n当 AWS Lambda 函数被调用以响应事件事件时，AWS Lambda 会根据创建函数时提供的配置设置为该函数启动一个执行环境（容器）。容器的底层操作系统是\
  \ Amazon Linux。每个容器都预装了许多库，并在 `/tmp` 目录中提供了一些磁盘空间。\n\n有关容器自带的标准库的更多信息，请参阅 [`docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html`](https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html)。\n\
  \nLambda 需要一点时间来创建新容器并对其进行引导，然后将控制权交给您的处理器方法。为了提高效率，Lambda 在您的函数执行完毕后会保留容器一段时间。如果在此短时间内执行了您的函数的另一个副本，Lambda\
  \ 将重用该容器。\n\n您不能假设容器会被重用。这完全取决于 AWS Lambda 的决定。然而，如果重用了了执行容器，它对您的代码将产生以下影响：\n\n\
  - 您的 Lambda 函数代码中处理器方法之外的变量声明将保持初始化状态。如果您的代码正在建立数据库连接并将连接存储在变量中，这可能会非常有用。您可以在代码中添加逻辑，检查连接变量是否已初始化，仅在未初始化时创建新连接。\n\
  - 容器 `/tmp` 目录的内容不会被删除。\n- 由函数的上一个实例启动的任何后台进程（Node.js 中的回调），如果它们在上一个实例结束时未完成，将恢复执行。您必须确保在\
  \ Lambda 函数退出之前任何此类进程都已完成。\n\n## 服务限制\n\nAWS Lambda 对您的 Lambda 函数的大小以及它们可以利用的运行时计算资源设有限制。最大并发执行次数上限为\
  \ 1000，Lambda 函数及其组件可以使用的总存储空间上限为 75 GB。您可以请求增加这些限制。\n\n但是，还有其他您无法请求增加的限制：\n\n-\
  \ 运行时分配给函数的内存必须在 128 MB 到 3008 MB 之间，以 64 MB 为增量进行分配。\n- 函数的最大超时时间间隔为 900 秒。\n-\
  \ 对于同步调用，请求负载和响应负载的大小不能超过 6 MB。\n- 对于异步调用，请求负载和响应负载的大小不能超过 256 KB。\n\n您可以在此处找到更多关于这些限制的信息，包括如何请求增加并发执行次数和文件大小：[`docs.aws.amazon.com/lambda/latest/dg/limits.html`](https://docs.aws.amazon.com/lambda/latest/dg/limits.html)。\n\
  \n## 价格与可用性\n\nAWS Lambda 采用按需付费模式。根据根据函数请求次数以及函数代码执行的持续时间进行收费。持续时间向上进位到最近的 100ms\
  \ 边界。此服务包含在 AWS 免费套餐账户中。您可以在 [`aws.amazon.com/lambda/pricing/`](https://aws.amazon.com/lambda/pricing/)\
  \ 获取定价模型的更多详情。\n\n## 常见任务\n\n在本节中，您将学习使用 AWS Lambda 控制台和 AWS CLI 工具创建并测试 Python\
  \ AWS Lambda 函数。\n\n要创建和配置 AWS Lambda 函数，您应该使用具有适当权限的 IAM 用户。使用为您开发 IAM 用户账户的专用登录链接登录\
  \ AWS 管理控制台。本节中的截图假设控制台已连接到欧盟（爱尔兰）区域。点击“服务”菜单并导航到 AWS Lambda 服务首页。\n\n## 创建简单的函数\n\
  \n#### 使用管理控制台\n\n如果您是第一次使用 Lambda，将看到 AWS Lambda 启动界面。\n\n按照以下说明创建 Python 3.6 函数：\n\
  \n1. 扩展页面左侧的菜单并点击 `Dashboard` 链接访问 AWS Lambda 板。如果您以前使用过 Lambda，将进入 AWS Lambda 板。\n\
  2. 点击 AWS Lambda 屏幕上的 `Create Function` 按钮开始创建 Lambda 函数的过程。\n3. 如果您想查看现有 Lambda\
  \ 函数列表，点击页面左侧菜单中的 `Functions` 项。您也可以在 Functions 页面点击 `Create Function` 按钮创建函数。\n\
  \n**注意**：可以使用可以使用控制台使用 Ruby、Node.js 或 Python 创建 Lambda 函数。对于 Java 和 C#，您需要使用 AWS\
  \ 命令行工具和专用 IDE 插件来打包 Lambda 函数。\n\n点击 `Create Function` 按钮后，将您带到创建函数界面，在该处有三个选择：\n\
  \n- 从头创建函数\n- 选择蓝图作为起点\n- 在 AWS Serverless 应用程序库中查找他人创建的符合您需求的函数\n\n\n\n\n蓝图（Blueprint）是构建\
  \ Lambda 函数的模板。AWS Lambda 提供了多种适用于 Node.js 和 Python 编写的 Lambda 函数蓝图。蓝图可以轻松为你的 Lambda\
  \ 函数代码配置事件源。\n\n1. 由于我们将从头开始创建一个函数，请确保选中了 `Author From Scratch`（从头开始创建）选项。\n\n2.\
  \ 将函数命名为 `TestFunction`，使用 `Runtime` 下拉菜单选择 `Python 3.6` 运行时，并在 `Execution Role`\
  \ 下拉菜单中选择 `Create A New Role With Basic Permissions`（带有基本权限的新角色）选项（图 12.6）。\n\n\
  \    ![FIGURE 12.6 Lambda 函数名称和运行时设置](img/c12f006.png)\n\n    图 12.6 Lambda 函数名称和运行时设置\n\
  \n3. 点击 `Create Function` 按钮完成函数的创建。在创建新函数时，AWS Lambda 还会为你的函数创建一个新的服务角色，该角色将允许访问\
  \ Amazon CloudWatch 日志。角色的名称将以函数名称开头，在本例中为 `TestFunction`。\n\n我们在本节中创建的函数不需要访问任何额外的\
  \ AWS 资源，因此我们不会更新与角色关联策略文档。然而，如果你想让函数访问 Amazon CloudWatch 之外的其他 AWS 资源，可以使用 IAM\
  \ 管理控制台（图 12.7）来修改与角色关联权限策略文档。\n\n    ![FIGURE 12.7 检查与 AWS Lambda 创建的 IAM 角色相关的权限策略文档](img/c12f007.png)\n\
  \n    图 12.7 检查与 AWS Lambda 创建的 IAM 角色相关的权限策略文档\n\n4. Lambda 函数创建完成后，你将进入函数配置页面（图\
  \ 12.8），你可以在该页面配置函数的触发器和代码。\n\n    ![FIGURE 12.8 Lambda 函数配置页面](img/c12f008.png)\n\
  \n    图 12.8 Lambda 函数配置页面\n\n通过选择 AWS Lambda 管理控制台页面左侧菜单中的 `Functions` 菜单项，并在可用\
  \ Lambda 函数列表中选择 `TestFunction`也可以访问 Lambda 函数配置页面（图 12.9）。\n\n![FIGURE 12.9 AWS\
  \ Lambda 函数列表](img/c12f009.png)\n\n图 12.9 AWS Lambda 函数列表\n\n在第 13 章和第 18 章中，你创建了在项上传到\
  \ S3 存储桶时触发的 Lambda 函数，并使用 AWS Comprehend 和 Rekognition 来检测和处理上传内容。本节构建的 Lambda\
  \ 函数不会与 AWS 事件源关联，因此没有触发器。该函数的测试是通过手动使用 JSON 文档代替事件来触发的。\n\n1. 滚动到页面的 `Function\
  \ Code` 部分，将现有的示例 Lambda 函数代码替换为以下代码（图 12.10）：\n\n    ![FIGURE 12.10 更新 AWS Lambda\
  \ 函数代码](img/c12f010.png)\n\n    图 12.10 更新 AWS Lambda 函数代码\n\n    ```\n    import\
  \ json\n    import logging\n     \n    def lambda_handler(event, context):\n   \
  \  \n        logger = logging.getLogger()\n        logger.setLevel(logging.INFO)\n\
  \     \n        logger.info('Found event{}'.format(event))\n     \n        accountName\
  \ = event['accountName']\n        accountNumber = event['accountNumber']\n     \
  \   sortCode = event['sortCode']\n     \n        logger.info('AccountName:' + accountName)\n\
  \        logger.info('AccountNumber:' + accountNumber)\n        logger.info('Sort\
  \ Code:' + sortCode)\n     \n        if accountNumber == '1234' and sortCode ==\
  \ '5678':\n            return {\n            'statusCode': 200,\n            'body':\
  \ json.dumps('This is the correct account!')\n            }\n        else:\n   \
  \         return {\n            'statusCode': 200,\n            'body': json.dumps('This\
  \ is not the correct account!')\n        }\n    ```\n\n2. 点击 `Save` 按钮保存这些更改。\n\n\
  ### 使用 AWS 管理控制台测试 Lambda 函数\n\n你可以使用管理控制台来测试 Lambda 函数。在上一节中，你创建了一个 Python Lambda\
  \ 函数。在本节中，你将使用虚拟事件对其进行测试。\n\n1. 点击 Lambda 仪表板中的 `Functions` 菜单项进入 Lambda 函数列表（图\
  \ 12.11）。\n\n    ![FIGURE 12.11 AWS Lambda 函数](img/c12f011.png)\n\n    图 12.11 AWS\
  \ Lambda 函数\n\n2. 点击 `TestFunction` 进入函数设置。\n\n3. 点击页面右上角的 `Test` 按钮。会弹出一个对话框让你提供\
  \ JSON 格式的事件，将默认内容替换为以下内容（图 12.12）：\n\n    ![FIGURE 12.12 测试](img/c12f012.png)\n\
  \n    图 12.12 测试\n\n    ```\n    {\n        \"accountName\": \"Abhishek Mishra\"\
  ,\n        \"accountNumber\": \"1234\",\n        \"sortCode\": \"5678\"\n    ```\n\
  \    将在下拉列表中看到 `TestEvent`。如果你有多个事件，可以通过下拉列表进行选择（图 12.13）。\n\n    ![FIGURE 12.13\
  \ 事件列表](img/c12f013.png)\n\n    图 12.13 事件列表\n\n4. 选中 `TestEvent` 并点击 `Test` 按钮执行\
  \ AWS Lambda。你应该看到执行成功如下（图 12.14）：\n\n    ![FIGURE 12.14 Lambda 执行结果](img/c12f014.png)\n\
  \n    图 12.14 Lambda 执行结果\n\n    ```\n    {\n        \"statusCode\": 200,\n    \
  \    \"body\": \"This is the correct account!\"\n    }\n    ```\n\n5. 展开结果以获取更详细的信息，包括执行时间、成本和日志（图\
  \ 12.15）。\n\n    ![FIGURE 12.15 执行统计](img/c12f015.png)\n\n    图 12.15 执行统计\n\n控制台日志如下：\n\
  \n    ```\n    START RequestId: 92019371-ceca-429b-ad82-979254fff1 Version: $LATEST\n\
  \    [INFO]. 2019-02-09T16:55:33.241Z 92019371-ceca-429b-ad82-\n    979254fff1 Found\
  \ event{'accountName': 'Abhishek Mishra',\n    'accountNumber': '1234', 'sortCode':\
  \ '5678'}\n    [INFO] 2019-02-09T16:55:33.241Z 92019371-ceca-429b-ad82-\n    979254fff1\
  \ AccountName:Abhishek Mishra\n    [INFO] 2019-02-09T16:55:33.241Z 92019371-ceca-429b-ad82-\n\
  \    979254fff1 AccountNumber:1234\n    [INFO] 2019-02-09T16:55:33.241Z 92019371-ceca-429b-ad82-\n\
  \    979254fff1 Sort Code:5678\n    END RequestId: 92019371-ceca-429b-ad82-979254fff1\n\
  \    REPORT RequestId: 92019371-ceca-429b-ad82-979254fff1 Duration:\n    0.46 ms\
  \ Billed Duration: 100 ms Memory Size: 128 MB Max\n    Memory Used: 54 MB\n    ```\n\
  \n\n\n\n[content]\n你的函数生成的日志包含在 `START` 和 `END` 元素之间。控制台日志还包含一个 `REPORT` 对象，其中包含执行时间、内存占用和计费时长的信息。\n\
  \n## 使用 AWS 管理控制台删除 AWS Lambda 函数\n\n你可以使用 AWS 管理控制台来删除 Lambda 函数。删除 AWS Lambda\
  \ 函数不会自动删除该函数的执行角色或 Amazon CloudWatch 日志。\n\n1. 要删除 AWS Lambda 函数，请点击 AWS Lambda\
  \ 仪表板中的 `Functions` 菜单项以访问函数列表。选择要删除的函数，并选择 `Actions` ➢ `Delete function` 菜单项（图\
  \ 12.16）。\n\n   ![图 12.16 进入删除函数菜单项](img/c12f016.png)\n\n   **图 12.16** 进入删除函数菜单项\n\
  \n如果你计划将该执行角色用于另一个函数，则无需删除它。你可以通过服务（Services）下拉菜单访问 Amazon CloudWatch 服务来删除该函数的\
  \ Amazon CloudWatch 日志（图 12.17）。\n\n   ![图 12.17 进入 Amazon CloudWatch 仪表板](img/c12f017.png)\n\
  \n   **图 12.17** 进入 Amazon CloudWatch 仪表板\n\n2. 进入 CloudWatch 仪表板后，点击 `Logs` 菜单项以访问日志列表（图\
  \ 12.18）。\n\n   ![图 12.18 Amazon CloudWatch 日志列表](img/c12f018.png)\n\n   **图 12.18**\
  \ Amazon CloudWatch 日志列表\n\n3. 选择与你的 Lambda 函数对应的日志，并选择 `Actions` ➢ `Delete Log\
  \ Group` 菜单项（图 12.19）。\n\n   ![图 12.19 进入删除日志组菜单项](img/c12f019.png)\n\n   **图 12.19**\
  \ 进入删除日志组菜单项\n\n## 摘要\n\n* AWS Lambda 是一项服务，允许你在无需配置服务器的情况下在 Amazon 云上运行代码。\n* AWS\
  \ Lambda 代码通过响应事件触发。\n* AWS Lambda 具有极高的可扩展性，能够响应并发事件运行数百万个代码并行实例。\n* 你还可以使用 Amazon\
  \ API Gateway 构建 RESTful API，以响应 HTTP 事件运行 AWS Lambda 代码。\n* 你可以使用 AWS Lambda 响应\
  \ Amazon S3 存储桶、Amazon DynamoDB 表以及其他 AWS 资源的变化来运行代码。\n* AWS Lambda 支持 Node.js、Java、C#、Ruby、Go\
  \ 和 Python。\n* 部署包通常是一个 `.zip` 文件。\n* 你可以指定内存和时间限制。\n\n# 第 13 章：Amazon Comprehend\n\
  \nAmazon Comprehend 是一项全托管的自然语言处理（NLP）服务，允许你提取有意义的见解并为应用程序数据增加价值。\n\n### 本章内容\n\n\
  在本节中，你将在使用 Amazon Comprehend 时学习一些核心概念：\n\n* 自然语言处理简介\n* Comprehend 服务简介\n* 使用 Amazon\
  \ Comprehend API\n* 使用 CLI\n\n## 核心概念\n\n### 自然语言处理\n\n自然语言处理（NLP）是人工智能领域的一个分支，专注于创建允许计算机理解文本并从文本中推导出含义的算法。\n\
  \n### 实体\n\nAmazon Comprehend 可以分析文本并返回命名实体列表（如人物和地点）以及置信度。每个实体都有关联的类型。Amazon Comprehend\
  \ 支持以下类型：\n\n1. `COMMERCIAL PRODUCT`（商业产品）\n2. `DATE`（日期）\n3. `EVENT`（事件）\n4. `LOCATION`（位置）\n\
  5. `ORGANIZATION`（组织）\n6. `PERSON`（人物）\n7. `QUANTITY`（数量）\n8. `TITLE`（标题/头衔）\n9.\
  \ `OTHER`（其他）\n\n### 关键短语\n\nAmazon Comprehend 可以分析文本并返回关键短语列表（或要点）以及置信度评分。关键短语被定义为讨论特定事物的名词性短语。如果你使用\
  \ Amazon Comprehend 分析博客文章，这将非常有用。\n\n### 情感\n\nAmazon Comprehend 可以分析文本并返回整体情感（积极、消极、中性或混合）的指示，以及针对每种情感的置信度评分。如果你使用\
  \ Amazon Comprehend 分析客户评论，这将非常有用。\n\n### 语法\n\nAmazon Comprehend 可用于分析文本并识别单词边界以及标签，如名词、代词、形容词和动词。Amazon\
  \ Comprehend 可以识别以下内容：\n\n* `Nouns`（名词）\n* `Verbs`（动词）\n* `Numerals`（数字）\n* `Particles`（助词/粒子）\n\
  * `Pronouns`（代词）\n* `Proper nouns`（专名词）\n* `Punctuation`（标点符号）\n* `Symbols`（符号）\n\
  * `Subordinating conjunctions`（从属连词）\n* `Adjectives`（形容词）\n* `Adpositions`（介词）\n\
  * `Adverbs`（副词）\n* `Auxiliaries`（助动词）\n* `Coordinating conjunctions`（并列连词）\n* `Determiners`（限定词）\n\
  * `Interjections`（感叹词）\n\n### 主导语言\n\nAmazon Comprehend 可用于识别文档的主导语言。识别出的语言使用 RFC\
  \ 5646 中描述的代码。Amazon Comprehend 还会提供置信度评分，指示分析的置信程度。\n\n### 主题建模\n\n主题建模使用 NLP 算法检查文本文档的内容，并确定最描述内容的主题（如娱乐、体育、政治等）。早期的主题建模完全基于与每个主题关联的预设关键词字典。主题建模通常用于组织一组文档。\n\
  \nAmazon Comprehend 使用基于隐含狄利克分布（LDA）的模型，并能够推断关键词出现背后的上下文。\n\n\n\n关键词可以与不同文档中的不同主题关联。例如，在关于牙科的文档中使用“drill”（钻头）一词将导致该词与“牙科”或“医学”主题相关联。在关于离岸油井的文档中使用同一个词，则会导致该词与“能量”、“石油”等主题相关联。\n\
  \n### 语言支持\n\n在本书编写时，Amazon Comprehend 的文本分析功能支持六种语言：\n\n* 英语\n* 法语\n* 德语\n* 意大利语\n\
  * 葡萄牙语\n* 西班牙语\n\nAmazon Comprehend 的语言检测功能支持超过百种的语言（但您只能对其中六种语言使用文本分析功能）。您可以在 `https://docs.aws.amazon.com/comprehend/latest/dg/how-languages.html`\
  \ 获取语言检测 API 支持的语言列表信息。\n\n## 定价与可用性\n\nAmazon Comprehend 采用按需付费模式。您将根据每月处理的文本量被收费。此服务包含在\
  \ AWS 免费套餐账户中。您可以在 `https://aws.amazon.com/comprehend/pricing/` 获取有关定价模型的更多细节。\n\
  \nAmazon Comprehend 并非在所有区域均可用。您可以通过以下 URL 获取其可用区域信息：`https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/`。\n\
  \n## 使用 Amazon Comprehend 管理控制进行文本分析\n\n在本节中，您将使用 Amazon Comprehend 管理控制对短文本文档进行实体、关键短语、主导语言、语法和情感分析。\n\
  \nAmazon Comprehend 可以以交互模式和异步模式两种使用。在交互模式下，您在网页上粘贴少量文本，点击按钮开始分析，并在几秒钟后的同一页面上查看分析结果。\n\
  \n以异步模式使用 Amazon Comprehend 涉及创建异步运行的分析作业、从 `S3` 存储桶读取文档，并将分析结果写入另一个存储桶中的文本文件中。本书未涵盖异步模式。您可以在\
  \ `https://docs.aws.amazon.com/comprehend/latest/dg/how-async.html` 找到更多关于在异步模式下使用\
  \ Amazon Comprehend 的信息。\n\n使用您的开发 IAM 用户账户专用登录链接登录 AWS 管理控制台。使用区域选择器选择 Amazon Comprehend\
  \ 服务可用的区域。本节中的截图假设控制台连接到欧盟（爱尔兰）区域。点击“服务”菜单访问 Amazon Comprehend 服务主页（图 13.1）。\n\n\
  ![图 13.1 访问 Amazon Comprehend 服务主页](img/c13f001.png)\n\n图 13.1 访问 Amazon Comprehend\
  \ 服务主页\n\n点击页面上的“尝试 Amazon Comprehend”链接（图 13.2）。\n\n![图 13.2 测试 Amazon Comprehend\
  \ 的功能](img/c13f002.png)\n\n图 13.2 测试 Amazon Comprehend 的功能\n\n将输入文本字段的内容替换为以下段落，并点击“分析”按钮（图\
  \ 13.3）：\n\n![图 13.3 使用 Amazon Comprehend 分析文本](img/c13f003.png)\n\n图 13.3 使用 Amazon\
  \ Comprehend 分析文本\n\n> 机器学习是人工智能领域的一个分支，涉及创建能够从数据中学习的算法。机器学习的根源可以追溯到计算机科学家亚瑟·萨缪尔（Arthur\
  \ Samuel）1959 年在 IBM 工作期间创建的一个计算机程序。萨缪尔程序可以玩国际跳棋，它的原理是为棋盘上的每个位置分配一个分数，以指示赢得比赛的可能性。通过让程序进行自我对弈，位置得分得到了不断完善，随着每次迭代，程序的性能都得到了提高。该程序实际上是在从经验中学习，机器学习领域随之诞生了。\n\
  \n> 机器学习专门处理创建计算机程序的问题，这些程序能够可靠、快速且准确地泛化和预测信息，准确性类似于人类处理类似信息的方式。机器学习算法需要大量的处理和存储空间，直到最近才能够在非常大型公司或学术机构中部署。存储、处理器、GPU\
  \ 技术以及在云端快速创建新虚拟计算能力的最新进展，最终为构建和部署大规模机器学习系统并获取实时结果提供了所需的处理能力。\n\nAmazon Comprehend\
  \ 需要几秒钟来分析文本。分析结果将以洞察（Insights）的形式在同一页面上提供，位于分析文本的正下方。向下滚动找到页面的“洞察”部分。洞察部分将列出实体、关键短语、语言、情感和语法分析的结果（图\
  \ 13.4）。\n\n![图 13.4 Amazon Comprehend 以洞察形式呈现分析结果](img/c13f004.png)\n\n图 13.4 Amazon\
  \ Comprehend 以洞察形式呈现分析结果\n\n在后台，用户友 Web 管理控制台使用了 AWS API 进行分析。以下 API 用于提供您在洞察部分中看到的的结果：\n\
  \n* 实体检测：`DetectEntities`\n* 关键短语检测：`DetectKeyPhrases`\n* 语言检测：`DetectDominantLanguage`\n\
  * 情感分析：`DetectSentiment`\n* 语法分析：`DetectSyntax`\n\n您可以在以下 URL 获取有关这些 API 的更多信息：`https://docs.aws.amazon.com/comprehend/latest/dg/API_Operations.html`。\n\
  \n## 使用 AWS CLI 进行交互式文本分析\n\n可以使用 AWS CLI 访问 Amazon Comprehend API 并进行文本分析。本节假设您已安装并配置了开发\
  \ IAM 凭据。\n\n### 使用 AWS CLI 进行实体检测\n\n要使用 AWS CLI 进行实体检测，请在 Mac 上启动终端或在 Windows\
  \ 上启动命令提示符，并输入以下命令：\n\n```\n$ aws comprehend detect-entities \\\n      --region\
  \ \"eu-west-1\" \\\n      --language-code \"en\" \\\n      --text \"Machine learning\
  \ traces its roots to a computer program created in 1959 by a computer scientist\
  \ Arthur Samuel while working for IBM\"\n```\n\n该命令使用了 `DetectEntities` API（通过命令行标识），并指定了使用的\
  \ AWS 区域以及分析的文本。\n\n按下键盘的回车键执行命令。几秒钟后，计算机上的输出应类似于以下内容：\n\n```\n{\n    \"Entities\"\
  : [\n        {\n            \"Score\": 0.9976276755332947,\n            \"Type\"\
  : \"DATE\",\n            \"Text\": \"1959\",\n            \"BeginOffset\": 67,\n\
  \            \"EndOffset\": 71\n        },\n        {\n            \"Score\": 0.9960350394248962,\n\
  \            \"Type\": \"PERSON\",\n            \"Text\": \"Arthur Samuel\",\n \
  \           \"BeginOffset\": 96,\n            \"EndOffset\": 109\n        },\n \
  \       {\n            \"Score\": 0.9668458700180054,\n            \"Type\": \"\
  ORGANIZATION\",\n            \"Text\": \"IBM\",\n            \"BeginOffset\": 128,\n\
  \            \"EndOffset\": 131\n        }\n    ]\n}\n```\n\n\n\n\nAmazon Comprehend\
  \ 在文本中发现了三个实体，`DetectEntities` API 的结果是一个包含实体详细信息的 JSON 文档。详细信息包括实体类型、实体值、实体在文本中首次出现的字符位置以及置信度评分。置信度评分是\
  \ 0.0 到 1.0 之间的数字。数值越高，Amazon Comprehend 对其分析的信心越大。\n\n如果没有找到任何实体，`DetectEntities`\
  \ API 将返回一个带有空 `Entities` 数组的 JSON 对象。如果你在 Terminal 窗口中输入以下命令并按回车键，就可以观察到这一点：\n\n\
  ```\n$ aws comprehend detect-entities \\\n       --region \"eu-west-1\" \\\n   \
  \    --language-code \"en\" \\\n       --text \"Machine learning specifically deals\
  \ with the problem of creating computer programs that can generalize and predict\
  \ information reliably, quickly, and with accuracy resembling what a human would\
  \ do with similar information.\"\n```\n\n执行该命令的结果应该包含一个空的 `Entities` 数组，这意味着 Amazon\
  \ Comprehend 未能找到任何实体：\n\n```json{\n    \"Entities\": []\n}\n```\n\n## 使用 AWS CLI\
  \ 检测关键短语\n\n要检测文本片段中的关键短语，你将使用 `DetectKeyPhrases` API。在 Terminal 窗口（或命令提示符窗口）中输入以下命令：\n\
  \n```\n$ aws comprehend detect-key-phrases \\\n--region \"eu-west-1\" \\\n--language-code\
  \ \"en\" \\\n--text \"Machine learning traces its roots to a computer program created\
  \ in 1959 by a computer scientist Arthur Samuel while working for IBM\"\n```\n\n\
  该命令使用了 `DetectKeyPhrases` API（在命令行中通过 `detect-key-phrases` 标识符识别），并指定了要使用的 AWS 区域以及要分析的文本。\n\
  \n按下键盘上的回车键执行命令。几秒钟后，计算机上的输出应该类似于以下所示：\n\n```json\n{\n    \"KeyPhrases\": [\n  \
  \      {\n            \"Score\": 0.5423930883407593,\n            \"Text\": \"Machine\"\
  ,\n            \"BeginOffset\": 0,\n            \"EndOffset\": 7\n        },\n \
  \       {\n            \"Score\": 0.6729782819747925,\n            \"Text\": \"\
  traces\",\n            \"BeginOffset\": 17,\n            \"EndOffset\": 23\n   \
  \     },\n        {\n            \"Score\": 0.9950423836708069,\n            \"\
  Text\": \"its roots\",\n            \"BeginOffset\": 24,\n            \"EndOffset\"\
  : 33\n        },\n        {\n            \"Score\": 0.9978877902030945,\n      \
  \      \"Text\": \"a computer program\",\n            \"BeginOffset\": 37,\n   \
  \         \"EndOffset\": 55\n        },\n        {\n            \"Score\": 0.9986926913261414,\n\
  \            \"Text\": \"1959\",\n            \"BeginOffset\": 67,\n           \
  \ \"EndOffset\": 71\n        },\n        {\n            \"Score\": 0.9789828062057495,\n\
  \            \"Text\": \"a computer scientist Arthur Samuel\",\n            \"BeginOffset\"\
  : 75,\n            \"EndOffset\": 109\n        }\n    ]\n}\n```\n\n### 使用 AWS CLI\
  \ 进行情感分析\n\n要获取文本片段整体情感指示，你将使用 `DetectSentiment` API。在 Terminal 窗口（或命令提示符窗口）中输入以下命令：\n\
  \n```\n$ aws comprehend detect-sentiment \\\n    --region \"eu-west-1\" \\\n   \
  \ --language-code \"en\" \\\n    --text \"Machine learning traces its roots to a\
  \ computer program created in \n1959 by a computer scientist Arthur Samuel while\
  \ working for IBM\"\n```\n\n该命令使用了 `DetectSentiment` API（在命令行中通过 `detect-sentiment`\
  \ 标识符识别），并指定了要使用的 AWS 区域以及要分析的文本。\n\n按下键盘上的回车键执行命令。几秒钟后，计算机上的输出应该类似于以下所示：\n\n```json\n\
  {\n    \"Sentiment\": \"NEUTRAL\",\n    \"SentimentScore\": {\n        \"Positive\"\
  : 0.0015290803276002407,\n        \"Negative\": 0.0024455683305859566,\n       \
  \ \"Neutral\": 0.9954049587249756,\n        \"Mixed\": 0.0006204072269611061\n \
  \   }\n}\n```\n\n### 在 AWS Lambda 中使用 Amazon Comprehend\n\n在本章的节节中，你已经学习了如何使用管理控制台和\
  \ AWS CLI 使用 Amazon Comprehend。虽然交互式使用这些 API 确实可以获得结果，但你无法以这种方式将 Amazon Comprehend\
  \ 集成到自己的项目中。\n\n在真实项目中集成 AWS 时，你可能会选择两种方法之一：\n\n*   使用特定语言的 AWS SDK 之一，直接从代码中调用\
  \ Amazon Comprehend API。\n*   创建一个 AWS Lambda 函数，在触发时调用 Amazon Comprehend API。\n\
  \n\n\nAWS 将为您的函数创建一个新的 `IAM` 角色，该角色包含一组最小权限，允许您的函数将日志写入 AWS CloudWatch。此 `IAM` 角色的名称显示在图\
  \ 13.8 中的执行角色下拉菜单下方，名称类似于 `DetectEntities-role-xxxxx`。请记住此名称，因为您将需要修改该角色以允许访问 Amazon\
  \ S3 和 Amazon Comprehend。点击页面底部的 `Create Function` 按钮来创建 AWS Lambda 函数和 `IAM` 角色。\n\
  \n创建 AWS Lambda 函数后，使用服务菜单切换到 `IAM` 管理控制台，并导航到创建 lambda 函数时刚为您创建的新 `IAM` 角色。找到与角色关联的权限策略文档，点击\
  \ `Edit Policy` 按钮（图 13.9）。\n\n![FIGURE 13.9 查看由 AWS Lambda 创建的 IAM 角色关联默认策略文档](img/c13f009.png)\n\
  \n`FIGURE 13.9` 查看由 AWS Lambda 创建的 IAM 角色关联默认策略文档\n\n您将进入策略编辑器屏幕；点击 `JSON` 选项卡以\
  \ `JSON` 文件的格式查看策略文档（图 13.10）。\n\n![FIGURE 13.10 更新由 AWS Lambda 创建的 IAM 角色关联默认策略文档](img/c13f010.png)\n\
  \n`FIGURE 13.10` 更新由 AWS Lambda 创建的 IAM 角色关联默认策略文档\n\n向 `Statement` 数组中添加以下对象：\n\
  \n```\n        {\n            \"Action\": [\n                \"comprehend:DetectEntities\"\
  \n            ],\n            \"Effect\": \"Allow\",\n            \"Resource\":\
  \ \"*\"\n        },\n        {\n            \"Action\": [\n                \"s3:GetObject\"\
  ,\n                \"s3:PutObject\"\n            ],\n            \"Effect\": \"\
  Allow\",\n            \"Resource\": \"arn:aws:s3:::*\"\n        }\n```\n\n您的最终策略文档应类似于此片段：\n\
  \n```\n{\n    \"Version\": \"2012-10-17\",\n    \"Statement\": [\n        {\n  \
  \          \"Effect\": \"Allow\",\n            \"Action\": \"logs:CreateLogGroup\"\
  ,\n            \"Resource\": \"arn:aws:logs:eu-west-1:5083XXXX:*\"\n        },\n\
  \        {\n            \"Effect\": \"Allow\",\n            \"Action\": [\n    \
  \            \"logs:CreateLogStream\",\n                \"logs:PutLogEvents\"\n\
  \            ],\n            \"Resource\": [\n                \"arn:aws:logs:eu-west-1:508XXXX13:log-group:/aws/lambda/DetectEntities:*\"\
  \n            ]\n        },        \n        {\n            \"Action\": [\n    \
  \            \"comprehend:DetectEntities\"\n            ],\n            \"Effect\"\
  : \"Allow\",\n            \"Resource\": \"*\"\n        },\n        {\n         \
  \   \"Action\": [\n                \"s3:GetObject\",\n                \"s3:PutObject\"\
  \n            ],\n            \"Effect\": \"Allow\",\n            \"Resource\":\
  \ \"arn:aws:s3:::*\"\n        }\n    ]\n}\n```\n\n此策略文档允许 AWS Lambda 将日志写入 CloudWatch，调用\
  \ AWS Comprehend 的 `DetectEntities` API，并读取/写入您账户中任何 S3 桶的对象。您可以通过在 `\"comprehend:DetectEntities\"\
  ` 之后添加相关操作允许允许额外的 Amazon Comprehend API。您可以在 `https://docs.aws.amazon.com/comprehend/latest/dg/comprehend-api-permissions-ref.html`\
  \ 获取可用 Amazon Comprehend 操作列表。\n\n点击页面底部的 `Review Policy` 按钮进入策略审查屏幕（图 13.11）。\n\
  \n![FIGURE 13.11 策略审查屏幕](img/c13f011.png)\n\n`FIGURE 13.11` 策略审查屏幕\n\n点击 `Save changes`\
  \ 按钮完成 IAM 策略更新。保存策略更改后，使用服务菜单切换回 AWS Lambda 管理控制台，并导航到 `DetectEntities` lambda\
  \ 函数（图 13.12）。页面的函数设计部分现在应该列出 Amazon CloudWatch Logs、Amazon S3 和 Amazon Comprehend\
  \ 为函数可以访问的资源。\n\n![FIGURE 13.12 AWS Lambda 函数设计器](img/c13f012.png)\n\n`FIGURE 13.12`\
  \ AWS Lambda 函数设计器\n\n找到页面的函数设计部分，并为函数添加 Amazon S3 触发器（图 13.13）。\n\n![FIGURE 13.13\
  \ 为 AWS Lambda 函数添加 Amazon S3 触发器](img/c13f013.png)\n\n`FIGURE 13.13` 为 AWS Lambda\
  \ 函数添加 Amazon S3 触发器\n\n滚动到 `Configure Triggers` 部分并选择一个作为事件源的 S3 桶。在本例中，源桶名为 `awsml-comprehend-entitydetection-source`。确保\
  \ Event Type 设置为 Object Created (All)，并点击 `Add` 按钮完成 S3 事件触发器的配置（图 13.14）。\n\n![FIGURE\
  \ 13.14 配置 Amazon S3 事件触发器](img/c13f014.png)\n\n`FIGURE 13.14` 配置 Amazon S3 事件触发器\n\
  \n点击页面顶部的 `Save` 按钮保存您的更改。通过创建触发器，您设置了 Lambda 函数每当源桶中上传新文件时执行一次。要更新函数代码，请滚动到函数设计器并点击函数名称以显示代码编辑器（图\
  \ 13.15）。\n\n![FIGURE 13.15 进入函数编辑器](img/c13f015.png)\n\n`FIGURE 13.15` 进入函数编辑器\n\
  \n将编辑器中的样板代码替换为列表 13.1 中的内容。\n\n点击函数下方的 Save 按钮完成函数的创建。要测试此函数，请使用服务下拉菜单切换到 S3 并导航到您与\
  \ AWS Lambda 触发器关联的桶。向桶中上传 UTF-8 文本文件。几秒钟后，您应该会看到输出桶中创建一个包含实体分析结果的新文件。\n\n输出桶在列表\
  \ 13.1 中硬编码。如果您使用了不同的桶名，请将其更改为相应的值。\n\n*   *源桶*：`awsml-comprehend-entitydetection-source`\n\
  *   *目标桶*：`awsml-comprehend-entitydetection-result`\n*   *输入文件*：`comprehend_entitydetection_input.txt`\n\
  *   *输出文件*：`entityresult-comprehend_entitydetection_input.txt`\n\n*   **注意** ����您可以从\
  \ `www.wiley.com/go/machinelearningawscloud` 下载本章节的文件，或通过 GitHub 使用以下 URL：\n\n \
  \   `https://github.com/asmtechnology/awsmlbook-chapter13.git`\n\n## Summary\n\n\
  *   Amazon Comprehend 是一种全托管服务，提供基于深度学习的自然语言处理 (NLP) 和主题建模引擎。\n*   Amazon Comprehend\
  \ 可用于检测实体、短语、语法和文档的主导语言。\n*   Amazon Comprehend 可用于分析一组文档并创建与每个文档关联的主题列表。\n*   Amazon\
  \ Comprehend 可以通过控制台和 AWS CLI 进行交互式使用。\n*   您可以创建调用 Amazon Comprehend API 的 AWS\
  \ Lambda 函数，并从各种事件触发该 Lambda 函数。\n\n# 第 14 章\n\nAmazon Lex\n\n### 本章内容\n\n*   Amazon\
  \ Lex 服务简介\n*   使用 Amazon Lex 管理控制台创建聊天机器人\n*   使用 Amazon Lex 管理控制台测试聊天机器人\n*  \
  \ 创建支持聊天机器人的 Amazon DynamoDB 表和 AWS Lambda 函数\n\n\n\nAmazon Lex 是一项全托管 Web 服务，允许你创建同时支持语音和文本的对话界面。通过\
  \ Amazon Lex，你可以利用 Amazon Alexa 所使用的对话引擎功能，在你自己的应用程序中创建聊天机器人。\n\n你可以使用 `AWS Mobile\
  \ SDK` 将聊天机器人集成到移动应用程序中，使用 `AWS JavaScript SDK` 将其集成到 Web 应用中，并集成到 Facebook Messenger、Slack\
  \ 和 Twilio 等常用消息平台。你无需担心用于支持聊天机器人的基础设施配置和维护。\n\n**注意** 你可以从 `www.wiley.com/go/machinelearningawscloud`\
  \ 或通过以下 URL 从 GitHub 下载本章节的文件：\n\n`https://github.com/asmtechnology/awsmlbook-chapter14.git`\n\
  \n## 核心概念\n\n在本节中，你将学习在处理 Amazon Lex 时时会遇到的一些核心概念。\n\n### 机器人 (Bot)\n\n`bot`（也称为聊天机器人）是一个可以接受自然语言输入的程序，旨在模拟人类对话。聊天机器人通常通过互联网访问，并用于向客户提供某种商业服务，例如订单履行、技术支持等。如果使用得当，聊天机器人可以在桌面、移动和\
  \ Web 应用程序中支持对话界面，并降低呼叫中心维护大型支持人员团队的成本。聊天机器人还包含了 `NLP` 元素，以理解客户提供的输入并确定应采取的行动。为了让聊天机器人提供业务服务，它们通常与各种业务后端系统集成，如订单处理、客户管理等。\n\
  \n### 客户端应用程序 (Client Application)\n\nAmazon Lex 聊天机器人是服务器端应用程序，通过 `REST APIs` 暴露其功能。虽然这些\
  \ `APIs` 可以处理文本和语音，但 Amazon Lex 不包含前端界面。前端用户界面是客户直接交互的内容，对于仅文本的聊天机器人，它看起来像一个客户可以在其中输入内容的聊天窗口。你可以创建自己的桌面、Web\
  \ 或移动客户端应用程序并通过 `API` 与 Amazon Lex 聊天机器人集成，也可以使用 Slack、Facebook Messenger 或 Twilio\
  \ 等现有消息平台作为你的 Amazon Lex 聊天机器人的前端界面。\n\n### 意图 (Intent)\n\n`intent` 是一个对象，代表聊天机器人用户可以执行的操作。在创建\
  \ `intent` 时，你需要提供以下信息：\n\n* 一个具有描述性的意图名称。\n* 一组示例短语，客户可以使用这些短语来调用 `intent` 提供的功能。\n\
  * 一个或多个可选的占位符，供客户提供输入。这取决于 `intent` 封装的功能。例如，允许客户订购鞋的 `intent` 将要求客户提供鞋码、颜色和材质等信息。\n\
  * 一个允许 Amazon Lex 履行客户请求的机制。推荐的履行机制是 `AWS Lambda` 函数；不过，你可以配置聊天机器人向前端应用程序返回 `JSON`\
  \ 对象，以便客户端可以通过其他方式处理客户请求的履行。\n\n一个 Amazon Lex 聊天机器人可以支持多个意图。聊天机器人选择的 `intent` 取决于用户输入或说出的短语。例如，一个允许客户订购新鞋并跟踪订单状态的聊天机器人可以有两个意图。第一个意图可以处理客户想要订购一双新鞋的情况，并在当客户输入（或说出）类似于“你好，我想买一双鞋”的短语时被调用。第二个意图可以处理订单跟踪，并在当客户输入类似于“我的订单在哪里？”的问题时被调用。\n\
  \n### 槽位 (Slot)\n\n`slot` 是 `intent` 中的一个参数，客户必须为该参数提供值。例如，允许客户订购鞋子的 `intent` 可能要求用户提供多个参数，如颜色、尺寸和材质。由于聊天机器人的目的是提供对话界面，它们对于细微的输入变化需要良好的鲁棒性。这些变化可能源于许多因素，包括拼写错误和同义词的使用。例如，要求客户指定日期的聊天机器人应该能够处理一系列值，包括\
  \ `today`、`tomorrow` 和 `next Friday` 等词，以及不同地区的日期格式。为了构建这种鲁棒性，Amazon Lex 要求每个 `slot`\
  \ 必须分配一个 `slot type`（槽位类型）。\n\n槽位类型在概念上类似于枚举数据类型，不同之处在于 Amazon Lex 使用 `slot type`\
  \ 可以接受的枚举值列表来训练机器学习模型，该模型提供了处理细微差异所需的鲁棒性。槽位类型有两种类：\n\n* **内置槽位类型 (Built-in slot\
  \ types)**：Amazon Lex 支持来自 Amazon Alexa Skills kit 的某些内置槽位类型，以及未包含在 Amazon Alexa\
  \ Skills kit 中的额外槽位类型。这些内置槽位类型可以处理电子邮件地址、日期、时间和位置等常见输入。你可以在 `https://docs.aws.amazon.com/lex/latest/dg/howitworks-builtins-slots.html`\
  \ 找到更多关于内置槽位类型的信息。\n* **自定义槽位类型 (Custom slot types)**：自定义槽位类型是你定义的枚举。对于枚举的每个元素，还可以定义多个同义词。自定义槽位类型还允许你定义\
  \ Amazon Lex 如何解析客户提供的值。你可以选择配置槽位类型，仅当用户输入与枚举值之一或同义词完全匹配时才接受该输入。当以这种方式配置时，用户输入解析过程的输出将是单个值。\n\
  \n或者，你可以配置槽位类型以接受自由格式输入，然后将其解析为枚举或同义词中最匹配的元素。当以这种方式配置时，将使用机器学习模型协助匹配过程，用户输入将用于持续训练机器学习模型，使其随着时间的推移表现更好。在这种情况下，解析过程的输出是一个可能的枚举值列表，每个值都有一个概率值。\n\
  \n### 述语 (Utterance)\n\n`utterance` 是与 `intent` 关联的短语。当聊天机器人的用户输入（或说出）该短语时，Amazon\
  \ Lex 将初始化预配置处理该短语的 `intent`。当你创建意图时，会指定一个述语列表。Amazon Lex 使用该述语列表来训练机器学习模型，用于解析类似的短语。这种方法提供了一层鲁棒性，使得你的用户不必逐字输入聊天机器人开发者在构建聊天机器人时定义的短语。\n\
  \n## 编程模型 (Programming Model)\n\nAmazon Lex 提供了两组 `APIs`：模型构建 `API` 和运行时 `API`。模型构建\
  \ `API` 可用于在 AWS 云上创建、构建和部署聊天机器人应用程序。Amazon Lex 运行时 `API` 可用于与已部署的聊天机器人进行交互。\n\n\
  Amazon Lex 还提供了一个 Web 管理控制台，用于创建、部署和测试聊天机器人。该 Web 管理控制台包含一个嵌入式测试工具，它看起来像一个聊天窗口，可以作为聊天机器人的测试客户端。在后台，Web\
  \ 管理控制台使用模型构建和运行时 `APIs`。\n\n\n\n\nAmazon Lex API 的输入和输出均为 JSON 对象。基于 Web 的管理控制提供了工具，可以检查嵌入式测试框架生成的聊天机器人底层\
  \ API 调用。\n\n聊天机器人中的每个意图（intent）都可以有一个 `AWS Lambda` 函数，用于初始化、槽位验证（slot validation）和填充（fulfillment）。填充并不一定由\
  \ `AWS Lambda` 函数处理；您可以配置聊天机器人向客户端返回一个包含完成意图所需的所有详细信息的 JSON 对象。您可以在 `https://docs.aws.amazon.com/lex/latest/dg/programming-model.html`\
  \ 学习更多关于 Amazon Lex 模型构建和运行时 API 操作的。\n\n## 定价与可用性\n\nAmazon Lex 采用按需付费模式。您将在每个月底根据您的机器人处理的文本或语音请求数量被收取费用。此服务不包含在\
  \ `AWS` 免费层账户中；但是，只要您每月处理的请求少于 10,000 次文本请求和 5,000 次语音请求，就可以免费尝试 Amazon Lex 一年。您可以在\
  \ `https://aws.amazon.com/lex/pricing/` 获取有关定价模型的更多详细信息。\n\nAmazon Lex 并非在所有区域可用。您可以在\
  \ `https://aws.amazon.com/about-aws/global-infrastructure/regional-product-services/`\
  \ 获取其可用区域的信息。\n\n## 创建 Amazon Lex 机器人\n\n在本节中，您将使用 Amazon Lex 管理控制台创建一个名为 `ACMEBankBot`\
  \ 的机器人，该机器人可供名为 ACMEBank 的虚构银行的客户使用，通过对话界面执行简单的账户操作。该机器人将仅支持文本，并通过使用意图支持以下客户操作：\n\
  \n*   **账户概览（Account overview）：** 返回一个包含客户持有的账户以及每个账户余额信息的 JSON 对象。系统将要求客户提供一个四位数字客户标识符，机器人将使用该标识符从数据库中检索该客户的账户列表。\n\
  *   **查看最近交易（View recent transactions）：** 返回一个包含账户中最近五笔交易信息的 JSON 对象。系统将要求客户提供客户标识符和账户标识符，机器人将使用这些标识符从数据库中检索该账户的交易列表。\n\
  \n虚构银行的客户和账户数据将存储在 `DynamoDB` 表中，这些表也将本节中创建。我们将从创建存储账户和交易数据的 `DynamoDB` 表开始，随后是上述两个意图使用的\
  \ `AWS Lambda` 函数。在准备好 `DynamoDB` 表和 `AWS Lambda` 函数后，您将继续使用基于 Web 的控制台构建、部署和测试聊天机器人。\n\
  \n### 创建 Amazon DynamoDB 表\n\n使用您的开发 `IAM` 用户账户专用登录链接登录 `AWS` 管理控制台。使用区域选择器选择一个\
  \ Amazon `DynamoDB` 服务和 Amazon Lex 都可用的区域。点击服务菜单，并访问 Amazon `DynamoDB` 服务主页（图 14.1）。\n\
  \n![图 14.1 访问 Amazon DynamoDB 服务首页](img/c14f001.png)\n\n图 14.1 访问 Amazon DynamoDB\
  \ 服务首页\n\n本节中的截图假设控制台已连接到欧洲（爱尔兰）区域。如果您从未用过 `DynamoDB`，将看到启动界面（图 14.2）。\n\n![图 14.2\
  \ Amazon DynamoDB 启动界面](img/c14f002.png)\n\n图 14.2 Amazon DynamoDB 启动界面\n\n如果您过去用过\
  \ `DynamoDB`，将到达 `DynamoDB` 仪表板（图 14.3）。\n\n![图 14.3 Amazon DynamoDB 仪表板](img/c14f003.png)\n\
  \n图 14.3 Amazon DynamoDB 仪表板\n\n无论您到达哪个屏幕，请点击“创建表（Create Table）”按钮开始创建 `DynamoDB`\
  \ 表。在“创建 DynamoDB 表”屏幕上（图 14.4\n\n图 14.4 指定表名、分区键和排序键\n\n取消勾选“使用默认设置（Use Default\
  \ Settings）”复选框，并向下滚动到页面底部找到“预留容量（Provisioned Capacity）”部分。禁用自动缩放并将读写单元的数量各更改为 1（图\
  \ 14.5）。\n\n![图 14.5 修改预留的 I/O 容量](img/c14f005.png)\n\n图 14.5 修改预留的 I/O 容量\n\n点击“创建（Create）”按钮开始创建\
  \ `DynamoDB` 表。创建表需要几分钟。一旦创建，您的屏幕将类似于图 14.6。\n\n![图 14.6 Amazon DynamoDB 仪表板](img/c14f006.png)\n\
  \n图 14.6 Amazon DynamoDB 仪表板\n\n按照以下设置创建另一个表（参见图 14.7）：\n\n![图 14.7 ACTransaction\
  \ 表设置](img/c14f007.png)\n\n图 14.7 ACTransaction 表设置\n\n*   表名：`ACMEBankAccount`\n\
  *   分区键：`CustomerIdentifier`\n*   排序键：`AccountIdentifier`\n\n在创建 `ACMECustomer`、`ACMEBankAccount`\
  \ 和 `ACTransaction` 表后，您的 Amazon DynamoDB 仪表板应列出所有三个表（参见图 14.8）。\n\n![图 14.8 Amazon\
  \ DynamoDB 仪表板](img/c14f008.png)\n\n图 14.8 Amazon DynamoDB 仪表板\n\n现在您已经创建了表，为了让机器人正常运行，表需要一些数据。`ACMECustomer`\
  \ 表将存储客户详细信息，对于此聊天机器人，几个客户记录就足够。点击 Amazon DynamoDB 仪表板上的 `ACMECustomer` 表，切换到“项目（Items）”选项卡，并点击“创建项目（Create\
  \ Item）”按钮（图 14.9）。\n\n![图 14.9 在 ACMECustomer 表中创建新项目](img/c14f009.png)\n\n图 14.9\
  \ 在 ACMECustomer 表中创建新项目\n\n您将看到一个对话框，允许指定新项目的属性。使用以下信息创建一个项目：\n\n*   *CustomerIdentifier*：1000\n\
  *   *FirstName*：John\n*   *LastName*：Woods\n\n使用以下信息创建第二个项目：\n\n*   *CustomerIdentifier*：2000\n\
  *   *FirstName*：Sonam\n*   *LastName*：Mishra\n\n创建两个项目后，您的屏幕将类似于图 14.10。\n\n![图\
  \ 14.10 ACMECustomer 表中的两个项目](img/c14f010.png)\n\n图 14.10 ACMECustomer 表中的两个项目\n\
  \n在 `ACMECustomer` 表中创建了几个客户记录后，您需要为这些客户创建账户。账户数据将存储在 `ACMEBankAccount` 表中，因此对于此聊天机器人，请使用表\
  \ 14.1 中的信息向 `ACMEBankAccount` 表添加五个条目。\n\n\n\n\n\n### 表 14.1：ACMEBankAccount 表项\n\
  \n| CUSTOMERIDENTIFIER | ACCOUNTIDENTIFIER | ACCOUNTTYPE | ACCOUNTBALANCE |\n| ---\
  \ | --- | --- | --- |\n| 1000 | 1001 | Saving | 5000 |\n| 1000 | 1002 | Current\
  \ | 10000 |\n| 2000 | 2001 | Saving | 50000 |\n| 2000 | 2002 | HighInterestSaver\
  \ | 275000 |\n| 2000 | 2003 | Current | 10000 |\n\n这些条目确保有两个账户属于标识符为 1000 的客户，三个账户属于标识符为\
  \ 2000 的客户。客户标识符可以与你之前创建的 `ACMEBankCustomer` 表配合以获取客户名称。在 `ACMEBankAccount` 表中创建这五个个条目后，你的屏幕应该类似于图\
  \ 14.11。\n\n![图 14.11 包含五个项目的 ACMEBankAccount 表](img/c14f011.png)\n\n#### 图 14.11\
  \ 包含五个项目的 ACMEBankAccount 表\n\n在 `ACMEBankAccount` 表中创建五个账户后，你需要在这些账户中创建一些交易。使用表\
  \ 14.2 中的信息向 `ACMEAccountTransaction` 表添加条目。\n\n### 表 14.2：ACMEAccountTransaction\
  \ 表项\n\n| ACCOUNTIDENTIFIER | TRANSACTIONIDENTIFIER | DATE | TYPE | AMOUNT |\n|\
  \ --- | --- | --- | --- | --- |\n| 1001 | 1 | 02.28.2019 | CR | 5500 |\n| 1001 |\
  \ 2 | 03.01.2019 | CW | 200 |\n| 1001 | 3 | 03.01.2019 | TFR | 300 |\n| 1002 | 1\
  \ | 02.28.2019 | CR | 10000 |\n| 2001 | 1 | 02.28.2019 | CR | 52000 |\n| 2001 |\
  \ 2 | 03.06.2019 | TFR | 2000 |\n| 2002 | 1 | 02.28.2019 | CR | 275000 |\n| 2003\
  \ | 1 | 02.28.2019 | CR | 10000 |\n\n`ACMEAccountTransaction` 表包含所有账户的所有交易详情。每笔交易具有以下属性：\n\
  \n*   `AccountIdentifier`: 识别客户持有的账户。\n*   `TransactionIdentifier`: 唯一标识给定的交易。\n\
  *   `Date`: `mm.dd.yyyy` 格式的交易日期。为了简单起见，此表不存储交易时间。\n*   `Type`: 交易类型。为了简单起见，此属性仅有三种可能的值之一：`CR`\
  \ – 存款（Credit）、`CW` – 提现（Cash Withdrawal）、`TFR` – 转账（Account Transfer）。\n*   `Amount`:\
  \ 交易金额。\n\n完成这些更改后，你构建了存储 ACMEBank 客户、账户和交易数据的表结构。你还向这些表加载了一些数据。在本章后面构建的聊天机器人将使用\
  \ AWS Lambda 函数访问你加载到这些表中的数据。\n\n### 创建 AWS Lambda 函数\n\n在本节中，你将创建两个 AWS Lambda\
  \ 函数，这些函数将被聊天机器人使用。聊天机器人由两个意图（intents）组成。在创建意图时，Amazon Lex 允许你指定验证函数（validation\
  \ function）和一个履行函数（fulfillment function）。验证函数用于验证用户提供的输入；履行函数由聊天机器人调用以完成意图。虽然可以使用单独的\
  \ AWS Lambda 函数进行验证和履行，但本章的方法是使用同一个函数同时进行验证和履行——这就是为什么你只需要创建两个函数而不是四个的原因。\n\n为了更好地理解\
  \ AWS Lambda 函数如何与聊天机器人意图配合，请考虑一个帮助客户点披萨的聊天机器人示例。此类聊天机器人可能包含一个名为 `OrderPizza` 的意图，当用户输入（或说）类似于“我想订一个披萨”的短语时，该意图将被调用。随后意图将询问用户配料、饼底类型和披萨尺寸。验证函数第一次被调用是在意图加载时。之后，每当用户为意图的槽位（slots）提供信息时，验证函数就会被调用。一旦客户为所有槽位提供了值，履行函数将尽调用以向本地披萨店下单。\n\
  \n在本节中将创建的 AWS Lambda 函数简要描述如下：\n\n*   `ACMEBankBotAccountOverview`: 用于验证四位数字客户标识符槽位，并检索客户持有的账户信息。\n\
  *   `ACMEBankBotTransactionList`: 用于验证四位数字客户标识符槽位和四位数字账户标识符槽位，并从指定的账户检索交易列表。\n\n\
  #### 创建 ACMEBankBotAccountOverview AWS LAMBDA 函数\n\n点击 Services 访问 AWS Lambda 主页。确保管理控制配置在与创建\
  \ DynamoDB 表相同的区域。点击 Create Function 开始创建 AWS Lambda 函数的过程。如果你是 AWS Lambda 新手，或者想在继续本节之前刷新知识，请参考第\
  \ 12 章。\n\n点击 Create Function 后，你将被要求选择函数模板。选择 Author From Scratch 选项。\n\n![图 14.12\
  \ 从头开始创建函数](img/c14f012.png)\n\n#### 图 14.12 从头开始创建函数\n\n将函数命名为 `ACMEBankBotOverview`，在\
  \ Runtime 下拉菜单中选择 Python 3.6 ，并在 Execution Role 下拉菜单中选择 Create New Role With Basic\
  \ Permissions 选项（图 14.13）。\n\n![图 14.13 函数命名和运行时](img/c14f013.png)\n\n### 图 14.13\
  \ 函数命名和运行时\n\nAWS 将为你的函数创建一个具有最小权限 set 的新的 IAM 角色。该 IAM 角色的名称显示在 Execution Role\
  \ 下方，类似于 `ACMEBankBotOverview-role-xxxxx`。记录此名称，因为你需要修改角色以访问 DynamoDB。点击页面底部的 Create\
  \ Function 按钮创建 AWS Lambda 函数和 IAM 角色。\n\n在 AWS Lambda 函数创建后，使用 Services 菜单切换到 IAM\
  \ 管理控制台，导航到创建 Lambda 函数时新创建 IAM 角色。找到与角色关联的权限文档并点击 Edit Policy 按钮（图 14.14）。\n\n\
  ![图 14.14 查看与 IAM 角色关联的默认策略](img/c14f014.png)\n\n#### 图 14.14 查看与 IAM 角色关联的默认策略\n\
  \n进入策略编辑器界面。点击 JSON 选项卡以 JSON 文件格式查看策略文档（图 14.15）。\n\n![图 14.15 更新与 IAM 角色关联的默认策略](img/c14f015.png)\n\
  \n### 图 14.15 更新与 IAM 角色关联的默认策略\n\n在 `Statement` 数组中添加以下对象：\n\n```json\n       {\n\
  \            \"Effect\": \"Allow\",\n            \"Action\": \"dynamodb:*\",\n \
  \           \"Resource\": \"*\"\n        },\n```\n\n你的最终策略文档应该像这样：\n\n\n\n\n\n```\n\
  {\n    \"Version\": \"2012-10-17\",\n    \"Statement\": [\n        {\n         \
  \   \"Effect\": \"Allow\",\n            \"Action\": [\n                \"logs:CreateLogStream\"\
  ,\n                \"logs:PutLogEvents\"\n            ],\n            \"Resource\"\
  : \"arn:aws:logs:eu-west-1:xxxxx:log-group:/aws/lambda/ACMEBankBotAccountOverview:*\"\
  \n        },\n        {\n            \"Effect\": \"Allow\",\n            \"Action\"\
  : \"dynamodb:*\",\n            \"Resource\": \"*\"\n        },\n        {\n    \
  \        \"Effect\": \"Allow\",\n            \"Action\": \"logs:CreateLogGroup\"\
  ,\n            \"Resource\": \"arn:aws:logs:eu-west-1:xxxx:*\"\n        }\n    ]\n\
  }\n```\n\n此策略文档允许 AWS Lambda 向 CloudWatch 写入日志，并对任何 Amazon DynamoDB 表格执行任何操作。点击页面底部的“检查策略”（Review\
  \ Policy）按钮进入策略策略屏幕（图 14.16）。\n\n![FIGURE 14.16 Review Policy screen](img/c14f016.png)\n\
  \nFIGURE 14.16 检查策略屏幕\n\n点击“保存更改”（Save Changes）按钮完成 IAM 策略的更新。保存策略更改后，使用“服务”菜单切换回\
  \ AWS Lambda 管理控制台并导航到 `ACMEBotAccountOverview` Lambda 函数（图 14.17）。页面函数设计器部分现在应该将\
  \ Amazon CloudWatch Logs 和 Amazon DynamoDB 都列为函数可以的资源。\n\n![FIGURE 14.17 AWS Lambda\
  \ function designer](img/c14f017.png)\n\nFIGURE 14.17 AWS Lambda 函数设计器\n\n你创建的 Lambda\
  \ 函数此时不会产生太大作用，因为你还没有指定函数体的代码，也没有指定与函数关联的触发器。向下滚动到函数代码编辑器，并将代码编辑器中的样板代码替换为列表 14.1\
  \ 中的内容。\n\n点击屏幕右上角的“保存”（Save）按钮以保存你的代码更改。\n\n要理解列表 14.1 中的代码，你需要考虑 Amazon Lex 和\
  \ AWS Lambda 之间的事件序列。该函数将在客户与前端聊天应用程序交互的过程中在不同时间被调用，而该应用程序反过来将使用其中一个 Amazon Lex\
  \ 运行时 API 与聊天机器人通信。该函数首次被调用是在 `AccountOverview` 意图初始化时。初始化发生在客户输入聊天机器人能够匹配到 `AccountOverview`\
  \ 意图的语句时。在初始化点，尚未要求客户提供 `CustomerIdentifier` 槽位（slot）的值。传递 AWS Lambda 函数的输入事件如下：\n\
  \n```\n{\n    'messageVersion': '1.0',\n    'invocationSource': 'DialogCodeHook',\n\
  \    'userId': '32p0rg8zzgoqhABCDEFG',\n    'sessionAttributes': {},\n    'requestAttributes':\
  \ None,\n    'bot': {\n        'name': 'ACMEBankBot',\n        'alias': '$LATEST',\n\
  \        'version': '$LATEST'\n    },\n    'outputDialogMode': 'Text',\n    'currentIntent':\
  \ {\n        'name': 'AccountOverview',\n        'slots': {\n            'CustomerIdentifier':\
  \ None\n        },\n        'slotDetails': {\n            'CustomerIdentifier':\
  \ {\n                'resolutions': [],\n                'originalValue': None\n\
  \            }\n        },\n        'confirmationStatus': 'None',\n        'sourceLexNLUIntentInterpretation':\
  \ None\n    },\n    'inputTranscript': 'view accounts'\n}\n```\n\n你可以在 `https://docs.aws.amazon.com/lex/latest/dg/lambda-input-response-format.html`\
  \ 此事件的完整规范。对于本文讨论，重要的字段有：\n\n- `invocationSource`：值 `DialogCodeHook` 该函数正被用于初始化和验证（而不是履行）。\n\
  - `bot`：包含创建此事件的机器人信息。\n- `currentIntent`：包含创建此事件的机器人内部意图信息。\n\n`slots` 对象包含槽位列表及其当前值。注意\
  \ `CustomerIdentifier` 槽位的值为 `None`。\n- `inputTranscript`：包含客户在聊天客户端窗口中输入的文本。\n\n\
  AWS Lambda 函数中 `lambda_handler()` 方法的代码开始提取机器人的名称和当前意图名称，并确保它们是预期的：\n\n```python\n\
  ## 获取机器人名称\n    bot_name = event['bot']['name']\n    \n    # 获取意图名称\n    intent_name\
  \ = event['currentIntent']['name']\n    \n    # 确保该函数只被正确的机器人调用\n    if bot_name\
  \ != 'ACMEBankBot':\n        raise Exception('函数只能由 ACMEBot 调用')\n    \n    # 确保该函数只被正确的意图调用\n\
  \    if intent_name != 'AccountOverview':\n        raise Exception('函数只能由 AccountOverview\
  \ 意图调用')\n\n    # 获取槽位和槽值\n    intent_slots = event['currentIntent']['slots']\n\
  \    customer_identifier = intent_slots[\"CustomerIdentifier\"]\n    \n    # 获取来源\n\
  \    invocation_source = event['invocationSource']\n```\n\n由于 `invocationSource`\
  \ 的值是 `DialogCodeHook`，这意味着该函数正被用于初始化和验证（而不是履行），函数检查 `CustomerIdentifier` 槽位的值。如果值为\
  \ `None`，则该槽位未包含有效值，函数发送一个响应，导致聊天机器人要求用户提供槽位的值：\n\n```python\n## 初始化和验证\n    if\
  \ invocation_source == 'DialogCodeHook':\n        \n        # 如果用户未提供槽位的值，\n   \
  \     # 则返回一个响应\n        # 导致聊天机器人要求用户提供值\n        if customer_identifier is None:\n\
  \            return elicit_slot('CustomerIdentifier',\n                        \
  \        session_attributes,\n                                intent_name,\n   \
  \                             intent_slots)\n```\n\n`elicit_slot` 函数在代码的其他地方定义。它构建如下\
  \ JSON 响应对象并发送给聊天机器人：\n\n```json\n{\n    'sessionAttributes': {},\n    'dialogAction':\
  \ {\n        'type': 'ElicitSlot',\n        'intentName': 'AccountOverview',\n \
  \       'slots': {\n             'CustomerIdentifier': None\n        },\n      \
  \  'slotToElicit': 'CustomerIdentifier'\n    }\n}\n```\n\n聊天机器人读取 `dialogAction`\
  \ 对象，并确定 AWS Lambda 函数要求它引导 `CustomerIdentifier` 槽位的值。聊天机器人生成如下 JSON 对象并发送到客户端应用程序：\n\
  \n```json\n{\n  \"dialogState\": \"ElicitSlot\",\n  \"intentName\": \"AccountOverview\"\
  ,\n  \"message\": \"What is your 4 digit customer number?\",\n  \"messageFormat\"\
  : \"PlainText\",\n  \"responseCard\": null,\n  \"sessionAttributes\": {},\n  \"\
  slotToElicit\": \"CustomerIdentifier\",\n  \"slots\": {\n    \"CustomerIdentifier\"\
  : null\n  }\n}\n```\n\n记住，聊天机器人是一个服务端 API 组件，客户使用客户端应用程序（如网页中的聊天窗口）与机器人交互，而显示逻辑完全位于前端客户端应用程序领域内。客户端应用程序解释来自机器人的此响应，并要求客户提供\
  \ `CustomerIdentifier` 槽位的值。\n\n\n\n\n当客户输入一个值时，客户端应用程序使用 Amazon Lex 运行时 API 方法之一提交用户输入的值。聊天机器人第二次执行\
  \ AWS Lambda 函数；此时，输入事件对象略有不同：\n\n```\n{\n    'messageVersion': '1.0',\n    'invocationSource':\
  \ 'DialogCodeHook',\n    'userId': 'zqw0yk3qeiw,\n    'sessionAttributes': {},\n\
  \    'requestAttributes': None,\n    'bot': {\n        'name': 'ACMEBankBot',\n\
  \        'alias': '$LATEST',\n        'version': '$LATEST'\n    },\n    'outputDialogMode':\
  \ 'Text',\n    'currentIntent': {\n        'name': 'AccountOverview',\n        'slots':\
  \ {\n            'CustomerIdentifier': '1000'\n        },\n        'slotDetails':\
  \ {\n            'CustomerIdentifier': {\n                'resolutions': [],\n \
  \               'originalValue': '1000'\n            }\n        },\n        'confirmationStatus':\
  \ 'None',\n        'sourceLexNLUIntentInterpretation': None\n    },\n    'inputTranscript':\
  \ '1000'\n}\n```\n\n在此事件中需要指出的区别是，`CustomerIdentifier` 插槽的值不再是 `None`；而是 `1000`——这是客户在聊天窗口中输入的值。AWS\
  \ Lambda 函数的代码路径将与第一次调用时的路径相似，但该插槽现在有了值，因此将执行以下代码段来验证客户提供的值：\n\n```\n# 验证 CustomerIdentifier\
  \ 插槽。\n        # 如果它无效，则要求客户\n        # 提供一个值。\n        if not validate_customer_identifier(customer_identifier):\n\
  \ \n            # 将无效的意图插槽设置为 None，以便\n            # 聊天机器人知道该插槽没有\n            #\
  \ 值。\n            intent_slots['CustomerIdentifier'] = None\n \n            return\
  \ defer_next_action_to_chatbot(session_attributes,\n                           \
  \     intent_slots)\n```\n\n`validate_customer_identifier()` 函数定义在代码的其他地方。如果在 `CustomerIdentifier`\
  \ 插槽中提供的值与 `ACMEBankCustomer` 表中 `CustomerIdentifier` 列的值对应，则它返回 `True`。`validate_customer_identifier()`\
  \ 函数的代码在此处复现：\n\n```python\n# 如果指定的 customer_identifier 存在于 ACMEBankCustomer 表中，则此函数返回\
  \ True。\ndef validate_customer_identifier(customer_identifier):\n \n    customer_table\
  \ = dynamodb_resource.Table('ACMEBankCustomer')\n \n    dynamodb_response = customer_table.query(\n\
  \        KeyConditionExpression = Key('CustomerIdentifier').eq(customer_identifier)\n\
  \    )\n \n    if dynamodb_response['Count'] == 0:\n        return False\n \n  \
  \  return True\n```\n\n如果 `validate_customer_identifier()` 函数返回 `True`，AWS Lambda\
  \ 函数将检索客户持有的账户列表，将结果格式化为字符串，并将该字符串作为 JSON 对象中的属性返回给聊天机器人：\n\n```python\n## 从 DynamoDB\
  \ 表 ACMEBankAccounts 读取该客户的账户列表\n## 返回一个包含账户详情的 JSON 对象。\naccount_overview = get_account_overview(customer_identifier)\n\
  \ \nreturn {\n    'sessionAttributes': session_attributes,\n    'dialogAction':\
  \ {\n        'type': 'Close',\n        'fulfillmentState' : 'Fulfilled',\n     \
  \   'message': {\n            'contentType': 'PlainText',\n            'content':\
  \ account_overview\n        }\n    }\n```\n\n在这种情况下，客户端应用程序收到的响应将如下所示：\n\n```json\n\
  {\n    \"dialogState\": \"Fulfilled\",\n    \"intentName\": \"AccountOverview\"\
  ,\n    \"message\": \"账户号 1001 的余额为 £5000，账户号 1002 的余额为 £10000。还有其他我可以帮您的吗？\",\n\
  \    \"messageFormat\": \"PlainText\",\n    \"responseCard\": null,\n    \"sessionAttributes\"\
  : {},\n    \"slotToEit\": null,\n    \"slots\": {\n        \"CustomerIdentifier\"\
  : \"1000\"\n    }\n}\n```\n\n注意，发送到客户端的 JSON 对象中的 `dialogState` 变量值为 `Fulfilled`，这表示\
  \ AWS Lambda 函数已完成用户的请求。如果你愿意，可以在 `message` 属性中发送 JSON 对象而不是字符串。你的聊天客户端需要能够处理 JSON\
  \ 对象，并可能在聊天窗口中渲染这些信息。对于本章构建的聊天机器人（其将使用 AWS Lex 管理控制台提供的客户端进行测试），格式化字符串已经足够了。\n\n\
  ## 创建 ACMEBotTransactionList Lambda 函数\n\n导航到 AWS Lambda 仪表板并点击 `Create`（创建）按钮开始创建新的\
  \ Lambda 函数。在提示选择函数模板时，选择 `From Scratch`（从开始）选项并使用以下配置：\n\n- **Name**: `ACMEBotTransactionList`\n\
  - **Runtime**: Python 3.6\n- **Role**: 选择一个现有角色。\n- **Existing Role**: 选择之前创建的角色。\n\
  \n点击 `Create` 按钮创建函数。函数创建后，你将进入 Lambda 函数配置页面。找到页面上的函数设计器部分，并点击函数名称以显示代码编辑器。将代码编辑器中的样板代码替换为列表\
  \ 14.2 中的内容。\n\n点击函数编辑器下方的 `Save`（保存）按钮以完成你的 Lambda 函数。此函数的运行方式与列表 14.1 所示的函数类似；因此在此不再详细讨论它。\n\
  \n现在你已经创建了 Amazon DynamoDB 表和 AWS Lambda 函数，可以在下一节中创建 Amazon Lex 聊天机器人。你可能可能会奇怪为什么在创建聊天机器人之前先创建\
  \ AWS Lambda 函数。这是因为在创建聊天机器人时，Amazon Lex 管理控制台不允许你内联创建 Lambda 函数。\n\n## 创建聊天机器人\n\
  \n在本节中，你将使用 Amazon Lex 管理控制台创建一个聊天机器人。请记住，管理控制台利用 Amazon Lex 模型构建 API 与 Amazon Lex\
  \ 服务交互，你也可以直接从 AWS CLI 使用模型构建 API。要开始创建 Amazon Lex 聊天机器人，点击 `Services`（服务）菜单并访问\
  \ Amazon Lex 服务主页（图 14.18）。\n\n如果你是第一次使用 Amazon Lex，将看到 Amazon Lex 服务启动界面（图 14.19）。点击\
  \ Amazon Lex 启动界面上的 `Get Started`（开始）链接。\n\n如果你以前使用过 Amazon Lex，你将进入 Amazon Lex\
  \ 仪表板（图 14.20）。在仪表板的 `Bots` 部分点击 `Create`（创建）按钮。\n\n你将进入 `Create A Bot` 向导，并会被要求选择是从头开始编写机器人，还是从现有模板中选择。选择\
  \ `Custom Bot`（自定义机器人）选项表示你想从头开始编写（图 14.21）。\n\n\n\n\n- **会话超时**: 3 分钟\n- **COPPA**:\
  \ 否\n\n你将被带到机器人编辑器，你可以在那里自定义机器人（图 14.22）。\n\n![FIGURE 14.22 Amazon Lex 机器人编辑器](img/c14f022.png)\n\
  \n[FIGURE 14.22** Amazon Lex 机器人编辑器\n\n你刚刚创建的机器人无法执行任何有用操作，因为你尚未创建意图（intents）。你可以将意图理解为用户通过你的机器人想要实现的目标（例如：订外卖、购买商品、退货等）。本章构建的聊天机器人目的是让银行客户获取账户摘要并查看最近交易。因此，在本节中构建的机器人将有两个意图：\n\
  \n- **账户概览 (Account overview)**：提供客户持有的账户信息以及每个账户的余额。\n- **查看最近交易 (View recent transactions)**：提供账户中最多五条最近交易。\n\
  \n点击意图区域旁边的 `+` 按钮开始创建第一个意图，并在屏幕上弹出的对话框中点击 `Create Intent` 选项（图 14.23）。\n\n![FIGURE\
  \ 14.23 为你的新意图配置槽位](img/c14f023.png)\n\n[FIGURE 14.23** 为你的新意图配置槽位\n\n系统将要求你为意图提供一个名称。输入\
  \ `AccountOverview` 并点击 `Create` 按钮（图 14.24）。\n\n![FIGURE 14.24 指定新意图的名称](img/c14f024.png)\n\
  \n[FIGURE 14.24** 指定新意图的名称\n\n重复此过程创建另一个名为 `ViewTransactionList` 的意图。当你创建了两个意图后，你的机器人编辑器屏幕应该类似于\
  \ 图 14.25 。\n\n![FIGURE 14.25 带有两个意图的 Amazon Lex 机器人编辑器](img/c14f025.png)\n\n[FIGURE\
  \ 14.25** 带有两个意图的 Amazon Lex 机器人编辑器\n\n### 自定义 AccountOverview 意图\n\n确保在机器人编辑器的意图列表中选择了\
  \ `AccountOverview` 意图，并在页面上的 `Sample Utterances`（示例语句）部分（图 14.26）。语句是用户输入到你的聊天机器人中以调用关联意图的短语。如果聊天机器人支持语音，用户就可以说出短语。Amazon\
  \ Lex 使用你在 `Sample Utterances` 部分中提供的信息来训练机器学习模型，该模型用于确保意图具有足够的健壮性来处理用户输入的细微变化。机器学习模型确保用户可以输入（或说出）与你配置的语句非常相似的短语，仍然调用正确的意图。为了确保机器学习模型有足够的训练数据，请提供一些你认为可以映射到该意图的示例语句。\n\
  \n![FIGURE 14.26 机器人编辑器的示例语句部分](img/c14f026.png)\n\n[FIGURE 14.26** 机器人编辑器的示例语句部分\n\
  \n本节中的示例将六条语句与 `AccountOverview` 意图关联。如果你愿意，可以将额外的语句与该意图关联。将以下短语输入到 `Sample Utterances`\
  \ 文本字段，并在每个短语后点击文本字段旁边的 `+` 按钮，以从短语创建语句：\n\n- View accounts（查看账户）\n- Account summary（账户摘要）\n\
  - Account list（账户列表）\n- I would like a summary of my accounts（我想查看我的账户摘要）\n- I would\
  \ like to view my accounts（我想查看我的账户）\n- Show me my accounts（显示我的账户）\n\n创建这些语句后，机器人编辑器屏幕应该类似于\
  \ 图 14.27 。\n\n![FIGURE 14.27 与 AccountOverview 意图关联的语句](img/c14f027.png)\n\n[FIGURE\
  \ 14.27** 与 AccountOverview 意图关联的语句\n\n展开机器人编辑器屏幕上的 `Lambda Initialization And Validation`（Lambda\
  \ 初始化与验证）部分，并勾选 `Initialization And Validation Code Hook`（初始化与验证钩钩）选项。你将看到账户中可用\
  \ AWS Lambda 函数的下拉列表。在列表中选择 `ACMEBankBotAccountOverview` 条目（图 14.28）。\n\n![FIGURE\
  \ 14.28 为 AccountOverview 意图指定验证函数](img/c14f028.png)\n\n[FIGURE 14.28** 为 AccountOverview\
  \ 意图指定验证函数\n\n`AccountOverview` 意图需要客户提供一个输入：一个四位数字客户标识符，机器人将用它在 `ACMEBankAccount`\
  \ 表中查找客户账户。意图使用槽位（slots）的概念来向用户索取输入。你可以将槽位理解为意图执行其功能所需的用户输入参数。一个槽位可以关联一个或多个提示（prompts）；当聊天机器人想要为槽位请求值时，会显示（或说出）这些提示。与槽位关联的是数据类型，称为槽位类型。槽位类型有两种：内置和自定义。对于客户标识符槽位，我们可以使用名为\
  \ `AMAZON.FOUR_DIGIT_NUMBER` 的内置槽位类型。\n\n滚动到页面的 `Slots` 部分并创建一个具有以下设置的槽位：\n\n- **Name\
  \ (名称)**：`CustomerIdentifier`\n- **Slot type (槽位类型)**：`AMAZON.FOUR_DIGIT_NUMBER`\n\
  - **Prompt (提示)**：What is your customer identifier?（您的客户标识符是什么？）\n\n你的屏幕现在应该类似于\
  \ 图 14.29，显示了新槽位。\n\n![FIGURE 14.29 AccountOverview 意图的槽位](img/c14f029.png)\n\n\
  [FIGURE 14.29** AccountOverview 意图的槽位\n\n点击槽位名称旁的齿轮图标访问槽位设置对话框。与此槽位关联的提示列表中添加额外的提示“What\
  \ is your 4-digit number?”（您的四位数字是多少？），并将重试次数改为 3（图 14.30）。点击 Save 更新槽位。\n\n![FIGURE\
  \ 14.30 CustomerIdentifier 槽位设置](img/c14f030.png)\n\n[FIGURE 14.30** CustomerIdentifier\
  \ 槽位设置\n\n提示是一个字符串，当你的机器人想要用户为槽位提供值时，将显示（或说出）给用户。在示例中，你为 `CustomerIdentifier` 槽位提供了两个提示：\n\
  \n- What is your customer identifier?（您的客户标识符是什么？）\n- What is your 4-digit number?（您的四位数字是多少？）\n\
  \n当机器人需要用户为 `CustomerIdentifier` 槽位提供值时，它会在两个语句之间切换。最大重试次数控制机器人挂断前给予客户的额外尝试次数。\n\
  \n滚动页面找到 `Fulfillment`（履行）部分。选择 `AWS Lambda Function` 选项，并在列表中选择 `ACMEBankBotAccountOverview`\
  \ 条目（图 14.31）。\n\n![FIGURE 14.31 为 AccountOverview 意图指定验证函数](img/c14f031.png)\n\n\
  [FIGURE 14.31** 为 AccountOverview 意图指定验证函数\n\n滚动到页面底部并点击 `Save Intent` 按钮保存更改。\n\
  \n### 自定义 ViewTransactionList 意图\n\n在上一节中，你创建并配置了 `AccountOverview` 意图。在本节中，你将遵循与上一节相似的过程构建\
  \ `ViewTransactionList` 意图。确保在机器人编辑器的意图列表中选择了 `ViewTransactionList` 意图，并在页面上的 `Sample\
  \ Utterances` 部分。\n\n根据以下短语创建语句：\n\n- I want to view a list of transactions（我想查看交易列表。）\n\
  - Show me the last few transactions（给我显示最近的几次交易。）\n- Show me a list of recent transactions（给我显示最近交易列表。）\n\
  \n\n\n\n\n* 最近账户活动\n* 交易列表\n\n展开机器人编辑器屏幕上的“Lambda 初始化与验证”（Lambda Initialization\
  \ And Validation）部分，并勾选初始化与验证代码钩（Initialization And Validation Code Hook）选项。在可用函数列表中选择图\
  \ 14.32 中的 `ACMEBankBotTransactionList` 项。\n\n![FIGURE 14.32 为 ViewTransactionList\
  \ 意图指定验证函数](img/c14f032.png)\n\nFIGURE 14.32 为 ViewTransactionList 意图指定验证函数\n\n\
  滚动到页面上的 Slots（Slots）部分，并按照表 14.3 所示创建两个槽位。确保为每个槽位都选择了必要的属性（required）。\n\n表 14.3**：**\
  \ ViewTransactionList 意图槽位\n\n| 名称 || 槽位类型 || 提示 (PROMPTS) |\n| --- | --- | ---\
  \ |\n| `CustomerIdentifier` || `AMAZON.FOUR_DIGIT_NUMBER` | 您的客户标识符是什么？您的 4 位客户编号是多少？\
  \ |\n| `AccountIdentifier` || `AMAZON.FOUR_DIGIT_NUMBER` | 您的账户是多少？您的 4 位账户编号是多少？\
  \ |\n\n向下滚动页面找到履行（Fulfillment）部分。选择 AWS Lambda Function 选项，并在可用函数列表中选择 `ACMEBankBotTransactionList`\
  \ 项（图 14.33）。\n\n![FIGURE 14.33 为 ViewTransactionList 意图指定履行函数](img/c14f033.png)\n\
  \nFIGURE 14.33 为 ViewTransactionList 意图指定履行函数\n\n滚动到页面底部并点击“保存意图”（Save Intent）按钮以保存您的更改。\n\
  \n## 测试聊天机器人\n\n现在您已经了聊天机器人，是时候测试它了。您可以通过多种方式测试聊天机器人，包括：\n\n* 使用 AWS Lex 管理控制台中的集成聊天客户端进行测试\n\
  * 使用 Facebook Messenger、Slack 或 Twilio 进行测试\n* 使用 AWS CLI 进行测试\n* 从您自己的桌面或移动应用程序内部测试\n\
  \n在本章中，您将使用 AWS Lex 管理控制台中的集成聊天客户端。您可以在 `https://docs.aws.amazon.com/lex/latest/dg/example1.html`\
  \ 了解更多关于将聊天机器人与第三方消息平台集成的信息。\n\n然而，在可以使用上述任何方法测试聊天机器人之前，您需要先构建它。构建聊天机器人只需点击管理控制台右上角的“构建”（Build）按钮即可（图\
  \ 14.34）。\n\n![FIGURE 14.34 构建机器人](img/c14f034.png)\n\nFIGURE 14.34 构建机器人\n\n构建过程可能需要几分钟，之后您就可以通过屏幕右侧展开集成聊天客户端并输入话语（utterance）来测试聊天机器人。图\
  \ 14.35 描述了一个聊天会话，其中调用了 `AccountSummary` 意图以提供客户所持账户的信息。\n\n![FIGURE 14.35 使用集成聊天客户端测试机器人](img/c14f035.png)\n\
  \nFIGURE 14.35 使用集成聊天客户端测试机器人\n\n注意 Amazon Lex 是如何调用 `AccountSummary` 意图的，尽管在聊天窗口中输入的短语是“Show\
  \ me accounts”，而该短语与任何配置的话语都并不完全匹配。\n\n* **注意**   您可以从 `www.wiley.com/go/machinelearningawscloud`\
  \ 或通过以下 URL 从 GitHub 下载本章的代文件：\n\n`https://github.com/asmtechnology/awsmlbook-chapter14.git`\n\
  \n# 总结\n\n* Amazon Lex 是一种完全托管的 Web 服务，允许您创建同时支持语音和文本的对话界面。\n* 机器人（也称为聊天机器人）是一种可以接受自然语言输入的程序，旨在模拟人类对话。\n\
  * 您可以使用 AWS Mobile SDK 将聊天机器人集成到移动应用程序中，使用 AWS JavaScript SDK 集成到 Web 应用程序，并集成到\
  \ Facebook Messenger、Slack 和 Twilio 等常用消息平台。\n* Amazon Lex 聊天机器人是使用 REST API 暴露功能的服务器应用程序。虽然这些\
  \ API 同时适用于文本和语音，但 Amazon Lex 不包含前端。\n* 意图（Intent）代表聊天机器人用户可以执行的操作的对象。\n* 槽位（Slot）是意图中的参数，客户必须为其提供值。\n\
  * 槽位类型（Slot type）概念上类似于枚举数据类型，但 Amazon Lex 使用枚举值列表。\n* 话语（Utterance）与意图关联的短语。当聊天机器的用户输入（或说出）短语时，Amazon\
  \ Lex 会初始化该意图。\n* Amazon Lex 了两组 API：模型构建 API 和运行时 API。\n* 模型构建 API 可用于在 AWS 上创建、构建和部署聊天机器人。\n\
  * 运行时 API 可与已部署的聊天机器人进行交互。\n\n# 第 15 章 机器学习\n\n### 本章内容\n\n* 机器学习服务简介\n* 学习从 S3\
  \ 存储桶创建数据源\n* 学习创建和评估 ML 模型\n* 学习创建批量预测\n* 学习创建实时预测\n* **注意**   Amazon Machine Learning\
  \ 不包含在免费额账户中。您可以在 `https://aws.amazon.com/pricing/` 找到有关 AWS 服务定价模型的更多信息\n\nAmazon\
  \ Machine Learning 是一种完全托管的 Web 服务，允许您在不需要任何编程的情况下创建和部署简单的机器学习模型。\n\nAmazon Machine\
  \ Learning 提供了一个向导界面，允许您定义输入数据的位置、定义目标属性并构建 ML 模型。当您对 ML 模型的质量满意时，将其部署在 AWS 基础设施上并使用\
  \ API 访问该模型。\n\nAmazon Machine Learningget 于使用，但提供的特征工程和模型构建能力有限。尽管如此，它是构建线性回归逻辑回归模型的流行选择。在本章中，您将学习如何在\
  \ AWS 云上构建、评估和部署机器学习解决方案。\n\n## 核心概念\n\n在本节中，您将学习在使用 Amazon Machine Learning 时会遇到的一些核心概念。\n\
  \n### 数据源\n\n`datasource`（数据源）是一个对象，存储指向输入数据的 Amazon S3 存储桶的引用，以及描述输入数据特征的元数据。当您创建新的数据源时，Amazon\
  \ Machine Learning 分析您的输入数据以创建架构（schema），并计算架构中属性的描述性统计信息。统计信息以及测试-训练划分等信息也作为数据源的一部分存储。数据源用于训练\
  \ ML 模型、评估模型以及创建批量预测。\n\n\n\n\n\n## 概述\n每个属性的统计数据可以在 Amazon Machine Learning 管理控制台中以图的形式查看，并在模型构建过程中也用于提高生成的\
  \ ML 模型的质量。\n\n在处理数据源时，你可能会遇到以下术语：\n\n- `Input data`输入数据：输入数据指的是数据源引用的所有观测值。\n-\
  \ `Location`位置：该位置通常指的是 Amazon S3 桶中包含输入数据的文件。除了 Amazon S3，你还可以将数据存储在 Amazon RedShift\
  \ 数据库或 Amazon RDS 内的 MySQL 数据库中。\n- `Schema`架构：架构是指输入数据的结构，通常是属性名称及其数据类型的列表。\n-\
  \ `Observation`观测值：观测值是指输入数据的单个单元。对于表格化输入数据，观测值对应于表格中的整行。\n- `Attribute`属性：属性是输入数据的一个唯一属性，所有观测值共享。对于表格化输入数据，属性对应于表格中的列。属性的数据类型可以是二进制（Binary）、数值（Numeric）、分类（Categorical）或文本（Text）。\n\
  - `Target attribute`目标属性：在训练 ML 模型时，目标属性标识输入数据中包含正确答案的属性名称。在使用 ML 模型进行评估和预测时，目标属性代表你想要预测的值的属性名称。\n\
  \nAmazon Machine Learning 要求你在构建模型和批量预测时使用单独的数据源对象。进行批量预测时使用的数据源没有目标属性。\n\n## ML\
  \ 模型\n机器学习模型是一种数学模型，能够学习数据中的模式并根据这些模式做出预测。Amazon Machine Learning 生成的机器学习模型基于线性回归或逻辑回归，可用于以下任务：\n\
  \n- `Regression`回归：预测连续的数值。\n- `Binary classification`二分类：预测具有只有两种可能状态之一的值。\n- `Multiclass\
  \ classification`多分类：预测属于某个固定、预定义的可能取值集合的值。\n\n使用 Amazon Machine Learning 构建模型的过程通常涉及以下步骤：\n\
  \n1. 将你的输入数据上传到 Amazon S3 并创建数据源。\n2. 选择测试-训练划分。Amazon Machine Learning 的默认行为是保留\
  \ 30% 的数据用于测试，其余 70% 用于训练。\n3. 打乱数据。Amazon Machine Learning 会自动为你打乱数据。\n4. 选择特征和目标变量；可选地应用某些特征处理。\n\
  5. 选择模型训练参数。\n6. 创建 ML 模型。\n\n构建符合你需求的 ML 模型通常涉及迭代此 ML 过程，并对输入特征、特征处理和训练参数的若干变体进行评估。\n\
  \n一旦你获得了满意的 ML 模型，你将使用它来做出预测。存储一份传入数据的副本并定期评估模型在这些数据上的性能是一个好主意。只有当训练模型的数据与其正在预测的数据具有相似分布时，ML\
  \ 模型才能进行准确预测。\n\n如果你检测到模型在新的测试集上的性能有所下降，则需要根据包含一些新观测值的训练集创建一个新模型。\n\n## 正则化\n正则化是一种通过惩罚极端权重来防止模型过拟合训练数据的技术。过拟合发生的情况是：你的模型在训练数据上表现良好，但在过去未遇到的数据上表现不佳——实际上，模型记住了训练数据，而不是从数据中泛化。\n\
  \nAmazon Machine Learning 允许你在构建模型时选择两种类型的正则化：\n\n- `L1 regularization`L1 正则化：这种正则化形式会将小权重推向零。在在线模型中，权重为零的特征对预测没有贡献——因此，实际上这种形式的正则化减少了模型使用的特征数量。\n\
  - `L2 regularization`L2 正则化：这种正则化形式惩罚大权重并导致更小的整体权重。它是 Amazon Machine Learning 在构建\
  \ ML 模型时选择的默认正则化类型。\n\n## 训练参数\n训练参数（也称为超参数）是控制 ML 模型构建方式并影响模型有效性的设置。Amazon Machine\
  \ Learning 允许你控制以下训练参数：\n\n- `Maximum model size`最大模型大小：这是 Amazon Machine Learning\
  \ 在模型训练期间生成的模式的总字节（bytes）大小。该参数的默认值为 100 MB。选择模型大小允许你在预测准确性与使用模型进行预测的支付成本之间进行权衡。使用较小的模型可能会导致\
  \ Amazon Machine Learning 丢弃某些模式以适应大小限制。另一方面，较大的模型在进行实时预测时的查询成本更高。\n- `Maximum number\
  \ of training passes`最大训练轮数：该参数控制 Amazon Machine Learning 遍历输入数据的次数，以发现你数据中的模式。增加轮数将导致训练时间和模型训练成本的增加。该参数的默认值为\
  \ 10，但你可以将其增加到 100。如果你的训练数据集较小，其中包含相互相似的样本可能较少，因此你需要更多轮次来获得更高的模型质量。\n- `Shuffle\
  \ type`打乱类型：该参数允许你指定是否希望 Amazon Machine Learning 在将输入数据划分为训练和评估数据源之前对其打乱。Amazon\
  \ Machine Learning 在创建模型时使用的默认选项是使用伪随机打乱算法。如果你在创建输入数据源之前已经打乱了数据，可以将打乱类型设置为 `None`。值得注意的是，打乱是在\
  \ Amazon Machine Learning 将输入数据源划分为训练和评估数据源时执行的。模型构建过程的后续轮次不会打乱数据。\n- `Regularization\
  \ type`正则化类型：正则化是一种通过惩罚大权重值来防止 ML 模型过拟合的技术。在构建 ML 模型时，你有两种正则化形式可选。`L1 regularization`将小权重值推向零，实际上抵消了相关输入属性的影响。`L2\
  \ regularization`防止非常大的权重值，是 Amazon Machine Learning 默认使用的类型。你也可以在模型构建过程中通过将正则化类型设置为\
  \ `None` 来选择不应用正则化。\n- `Regularization amount`正则化强度：该参数允许你控制在模型构建过程中应用多少正则化。Amazon\
  \ Machine Learning 提供了三种选项：轻度（Mild）、中度（Moderate）和高度（High）。\n\n## 描述性统计\n当你创建数据源时，Amazon\
  \ Machine Learning 会对你的数据计算统计信息，你可以利用这些信息来理解数据。这些统计数据可以通过 Amazon Machine Learning\
  \ 控制台访问，并针对每个属性计算。对于数值属性，Amazon Machine Learning 计算以下统计数据：\n\n- 最小值、最大值、中位数和平均值\n\
  - 直方图\n- 缺失/无效值的数量\n\n对于二进制和分类属性，计算如下：\n\n- 每个类别的不同值计数\n- 直方图\n\n\n\n\n\n## 统计与可用性\n\
  \n## 数据统计\n\n* 真值百分比（仅限二进制数据）\n* 最常见值\n\n对于文本属性，Amazon Machine Learning 计算以下统计信息：\n\
  \n* 单词总数\n* 唯一单词数量\n* 每个观测值的单词数范围\n* 单词长度范围\n* 最显著的单词\n\n## 定价与可用性\n\nAmazon Machine\
  \ Learning 采用按付费模式，不包含在 AWS 免费层中。您将根据创建数据源、模型和评估消耗的计算资源收取固定小时费用。使用您创建的 ML 模型进行预测也需要收费。用于构建数据源的\
  \ Amazon S3 等服务单独计费。您可以在 `https://aws.amazon.com/sagemaker/` 获取有关定价模型的详细信息。\n\n\
  创建数据源、ML 模型、评估以及进行批量预测的能力在所有 AWS 均可用。然而，使用 Amazon Machine Learning API 进行实时预测的能力仅适用于美国东部（弗吉尼亚）和欧洲（爱尔兰）区域。您可以在\
  \ `https://docs.aws.amazon.com/machine-learning/latest/dg/regions-and-endpoints.html`\
  \ 找到更多关于服务可用性的信息。\n\n## 创建数据源\n\n在本节中，您将把 Titanic 数据集上传到 Amazon S3，并使用 Amazon Machine\
  \ Learning 管理控制创建两个源。这些数据源将在本章的后续章节中使用，当时我们将构建一个 ML 模型来预测哪些乘客更有可能在泰坦尼克号事故中幸存。第一个数据源将用于模型构建，第二个将用于创建批量预测。\n\
  \nTitanic 数据集是非常流行的数据集，包含了泰坦尼克号上 1309 名乘客的人口统计和票务信息，目标是预测哪些乘客更有可能幸存。完整数据集可以从范德堡大学生物统计系获取（http://biostat.mc.vanderbilt.edu/wiki/Main/DataSets)）。随着时间的推移，范德堡大学的研究人员产生了该数据集的多个版本，最新版本（`titanic3`）由\
  \ Thomas Cason 创建。Thomas Cason 的版本按乘客姓名排序，您可以在 http://biostat.mc.vanderbilt.edu/wiki/pub/Main/DataSets/titanic3info.txt\
  \ 查看有关 `titanic3` 数据集的注释。\n\n`titanic3` 数据集的版本也可以从其他几个来源获取，包括一个名为“Titanic: Machine\
  \ Learning From Disaster”的流行 Kaggle 竞赛（https://www.kaggle.com/c/titanic）。Kaggle\
  \ 版本包含在本章随附的资源中，其优点是经过洗牌并预划分为训练集和验证集。\n\n数据集由两个文件组成：`train.csv` 和 `test.csv`。表 15.1\
  \ 列出了 `train.csv` 文件的前五行。\n\n**表 15.1**](#c15.xhtml#R_c15-tbl-0001)：Titanic 数据集的前五行\n\
  \n| PASSENGERID | SURVIVED | PCLASS | NAME | SEX | AGE | SIBSP | PARCH | TICKET\
  \ | FARE | CABIN | EMBARKED |\n| --- | --- | --- | --- | --- | --- | --- | --- |\
  \ --- | --- | --- | --- |\n| 1 | 0 | 3 | Braund, Mr. Owen Harris | male | 22 | 1\
  \ | 0 | A/5 21171 | 7.25 | | S |\n| 2 | 1 | 1 | Cumings, Mrs. John Bradley (Florence\
  \ Briggs Thayer) | female | 38 | 1 | 0 | PC 17599 | 71.2833 | C85 | C |\n| 3 | 1\
  \ | 3 | Heikkinen, Miss Laina | female | 26 | 0 | 0 | STON/O2. 3101282 | 7.925 |\
  \ | S |\n| 4 | 1 | 1 | Futrelle, Mrs. Jacques Heath (Lily May Peel) | female | 35\
  \ | 1 | 0 | 113803 | 53.1 | C123 | S |\n| 5 | 0 | 3 | Allen, Mr. William Henry |\
  \ male | 35 | 0 | 0 | 373450 | 8.05 | | S |\n\n让我们简要检查数据集的属性：\n\n* `PassengerId`:\
  \ 作为行标识符的文本变量。\n* `Survived`: 表示人员是否在灾难中幸存的布尔变量。0 = 否，1 = 是。\n* `Pclass`: 表示票等等级的分类变量。1\
  \ = 一等舱，2 = 二等，3 = 三等。\n* `Name`: 乘客的名字。\n* `Sex`: 表示乘客性别的分类变量。\n* `Age`: 表示乘客年龄的数值变量。\n\
  * `SibSp`: 表示一同旅行的同兄弟/配偶数量的数值变量。\n* `Parch`: 表示一同旅行的父母和孩子数量的数值变量。\n* `Ticket`: 包含票务信息的文本变量。\n\
  * `Fare`: 表示票价的数值变量。\n* `Cabin`: 表示舱位的文本变量。\n* `Embarked`: 表示登船港的分类变量。\n\n\n\n\n\
  Amazon Machine Learning 为创建数据源、模型、评估和批量预测等个人任务提供了方便的向导界面。要访问这些向导，请点击查看面板（View Dashboard）按钮（图\
  \ 15.4）。\n\n![FIGURE 15.4 访问 Amazon Machine Learning 控制面板](img/c15f004.png)\n\n\
  `FIGURE 15.4` 访问 Amazon Machine Learning 控制面板\n\nAmazon Machine Learning 控制面板允许您在一个屏幕上查看所有数据源、模型和评估。点击新建（Create\
  \ New）按钮并在下拉菜单中选择数据源（Datasource）（图 15.5）。\n\n![FIGURE 15.5 从 Amazon Machine Learning\
  \ 控制面板访问创建数据源选项](img/c15f005.png)\n\n`FIGURE 15.5` 从 Amazon Machine Learning 控制面板访问创建数据源选项\n\
  \n确保您选择 Amazon S3 作为源，并在 S3 Location 字段中输入桶名称，后跟 `train.csv` 文件。例如，如果您的桶名为 `awsml-amazonml-source`，请在\
  \ S3 Location 字段中输入 `awsml-amazonml-source/train.csv`。将数据源命名为 `Titanic_TrainingDataSource`\
  \ 并点击验证（Verify）按钮进入下一步（图 15.6）。\n\n![FIGURE 15.6 指定输入文件的位置](img/c15f006.png)\n\n\
  `FIGURE 15.6` 指定输入文件的位置\n\n在验证过程中，Amazon Machine Learning 将提示您允许访问 Amazon S3 桶。在提示时点击是（Yes）按钮（图\
  \ 15.7）。\n\n![FIGURE 15.7 授予 Amazon Machine Learning 访问您的 Amazon S3 桶的权限](img/c15f007.png)\n\
  \n`FIGURE 15.7` 授予 Amazon Machine Learning 访问您的 Amazon S3 桶的权限\n\n验证成功后，点击继续（Continue）按钮进入向导的架构（Schema）部分。Amazon\
  \ Machine Learning 将检查您的数据并尝试定义数据的架构。大多数情况下，您需要调整 Amazon Machine Learning 创建的默认架构。由于\
  \ `train.csv` 文件的第一包含列名，请确保 CSV 第一行是否包含列名（Does The First Line In Your CSV Contain\
  \ The Column Names?）选项设置为是（Yes）（图 15.8）。\n\n![FIGURE 15.8 修改 Amazon Machine Learning\
  \ 生成的默认架构](img/c15f008.png)\n\n`FIGURE 15.8` 修改 Amazon Machine Learning 生成的默认架构\n\
  \n在定义架构时，您还需要更改 Amazon Machine Learning 推断出的某些数据类型。确保列名的数据类型与以下信息匹配并点击下一步（Next）：\n\
  \n*   `PassengerId`: 类别（Categorical）\n*   `Survived`: 二分类（Binary）\n*   `Pclass`:\
  \ 类别（Categorical）\n*   `Name`: 文本（Text）\n*   `Sex`: 类别（Categorical）\n*   `Age`:\
  \ 数值（Numeric）\n*   `SibSp`: 数值（Numeric）\n*   `Parch`: 数值（Numeric）\n*   `Ticket`:\
  \ 文本（Text）\n*   `Fare`: 数值（Numeric）\n*   `Cabin`: 类别（Categorical）\n*   `Embarked`:\
  \ 类别（Categorical）\n\n在下一个屏幕上，系统将询问您打算将此数据源用于训练还是评估。用于模型构建或评估的数据源必须具有目标属性的已知值。确保在您是否计划使用此数据集创建或评估机器学习模型（Do\
  \ You Plan To Use This Dataset To Create Or Evaluate An ML Model?）选项中选择是（Yes）（图\
  \ 15.9）。\n\n![FIGURE 15.9 指定目标属性](img/c15f009.png)\n\n`FIGURE 15.9` 指定目标属性\n\n选择\
  \ `Survived` 属性作为目标。Amazon Machine Learning 将根据以下内容选择模型类型：\n\n*   `Numeric`: 线性回归（linear\
  \ regression）\n*   `Binary`: 逻辑回归（logistic regression）\n*   `Categorical`: 多项回归（multinomial\
  \ regression）\n\n数据源创建完成后，流程即完成。\n\n\n\n\n图 15.15 新数据源没有目标属性。\n\n选择 `Survived` 属性作为目标。Amazon\
  \ Machine Learning 将根据目标属性的数据类型选择 ML 模型类型，遵循以下规则：\n\n*   对于二分类：逻辑回归 (Logistic Regression)\n\
  *   对于多分类：多项逻辑回归 (Multinomial Logistic Regression)\n*   对于回归：线性回归 (Linear Regression)\n\
  \n当被问数据是否包含行标识符时，回答“是”并选择 `PassengerId` 属性作为行标识符（图 15.16）。\n\n![图 15.16 指定行标识符属性](img/c15f016.png)\n\
  \n图 15.16 指定行标识符属性\n\n进入 Review（检查）界面，点击底部的 `Create`（创建）按钮创建数据源。几分钟后，你将在 Amazon\
  \ Machine Learning 控制板中看到你的新数据源。\n\n## 查看数据洞察\n\n在 Amazon Machine Learning 完成数据源创建后，可以通过点击控制板中的数据源名称访问数据源统计信息（图\
  \ 15.17）。\n\n![图 15.17 从控制板选择数据源](img/c15f017.png)\n\n图 15.17 从控制板选择数据源\n\n你将进入数据源摘要页面。点击左侧菜单中的\
  \ `Target Distributions`（目标分布）链接，查看描述目标变量分布的直方图——在这种情况下是存活人数和未存活人数（图 15.18）。\n\n\
  ![图 15.18 目标属性的直方图](img/c15f018.png)\n\n图 15.18 目标属性的直方图\n\n从直方图中可以清楚看出，我们的数据集中死亡人数比存活人数多。这表明我们的数据存在偏差，但在这种情况下，我们从历史记录知道这种偏差并非采样技术人为引入的，事实是泰坦尼克号上的死亡人数多于存活人数。你可以访问数据源中每个属性的摘要统计信息。点击左侧菜单中的\
  \ `Categorical`（分类）链接，查看所有分类值的摘要统计信息（图 15.19）。\n\n![图 15.19 分类值的摘要统计信息](img/c15f019.png)\n\
  \n图 15.19 分类值的摘要统计信息\n\n查看图 15.19 中的相关性列可以很清楚，`Sex`（性别）属性与目标属性的相关性最强，而 `Embarked`（登船点）属性的相关性最弱。如果你点击\
  \ Preview（预览）列中的小直方图图标，可以看到数值的详细分布。图 15.20 描绘了 `Embarked` 属性值的分布。\n\n![图 15.20 Embarked\
  \ 属性值的分布](img/c15f020.png)\n\n图 15.20 Embarked 属性值的分布\n\n分布表明，我们训练数据集中绝大多数人都是从南普普顿登船的，只有两行数据未指定登船港。点击\
  \ `Show Sample Data`（显示样本数据）链接将显示没有 `Embarked` 属性值的两行（图 15.21）。\n\n![图 15.21 未具有\
  \ Embarked 属性值的行](img/c15f021.png)\n\n图 15.21 未具有 Embarked 属性值的行\n\n你可能奇怪为什么 Amazon\
  \ Machine Learning 没有将这些值报告为缺失。原因是这些是分类属性，而 Amazon Machine Learning 假设缺失数据只是另一个类别。\n\
  \n我们可以通过两种方式处理缺失值：猜一个值，或者从数据集中删除这些行。在现阶段，无法判断这些更改是否会产生更好的模型。构建一个良好的模型是一个迭代过程；它从构建初始模型开始，然后根据需要对特征或模型参数进行更改以创建不同版本的模型。你创建的第一个模型可能已经足够满足需求。这完全取决于你想实现什么以及你有多少时间。\n\
  \nAmazon Machine Learning 提供了使用模型参数控制模型构建过程的选项。你还可以创建具有更好特征的不同版本数据源并在上面构建模型。在本章中，我们将接受\
  \ Amazon Machine Learning 建议的默认模型参数并使用 ML 模型。尽管 `Embarkation`（登船）特征包含缺失值，但缺失值的比例较低，且该属性与目标变量之间的相关性也较低。因此，保持这些值原样的影响可能并不显著。\n\
  \n另一个有趣的分类属性是 `Cabin`（船舱）。从表面上看，该属性与目标的相关性也很差。然而，观察该属性的数值分布清楚地表明，我们数据集中的大多数乘客都没有船舱信息（图\
  \ 15.22）。\n\n![图 15.22 Cabin 属性的分布](img/c15f022.png)\n\n图 15.22 Cabin 属性的分布\n\n\
  也许根据这些数据创建一个布尔属性是明智的，对于没有船舱信息的行设为 0，对于有船舱信息的行设为 1。Amazon Machine Learning 的特征工程能力非常有限，无法用于此类特征工程。如果你想尝试此练习，可以使用\
  \ Python 或 Microsoft Excel 创建新的 CSV 文件。\n\n*   **注意**：如果你在 Mac 上使用 Microsoft Excel\
  \ 进行特征工程，请确保将 CSV 文件保存为 Windows 格式。Mac 和 Windows 在换行符上有细微差异。\n\n点击页面左侧的 `Numeric`（数值）链接访问数值属性的摘要统计信息（图\
  \ 15.23）。\n\n![图 15.23 数值属性的摘要统计信息](img/c15f023.png)\n\n图 15.23 数值属性的摘要统计信息\n\n\
  从统计信息中清楚地看出 `Age`（年龄）属性存在大量的缺失值。年龄值的直方图显示它们均匀分布在 30 左右，这与平均值和中位数也接近 30 的事实相吻合（图\
  \ 15.24）。\n\n![图 15.24 Age 属性值的分布](img/c15f024.png)\n\n图 15.24 Age 属性值的分布\n\n在这种情况下，你可以对所有缺失\
  \ `Age` 值的行使用中位数，并创建一个额外的二值值来捕捉年龄未知这一事实。这又需要创建一个带有更改的新的 CSV 文件并构建新的数据源。再次，无法判断这些更改是否会比\
  \ Amazon Machine Learning 使用默认设置生成的模型更好。\n\n\n\n\n\nAmazon Machine Learning 在遇到带有缺失值的数值属性时，默认行为是创建一个新的二分类变量来捕捉缺失的属性值，并在模型构建过程中使用该变量。要了解更多关于\
  \ Amazon Machine Learning 如何处理缺失和无效值的信息，请访问 `https://docs.aws.amazon.com/machine-learning/latest/dg/data-insights.html`。\n\
  \n其他一些突出的统计数据包括 `Fare` 属性的分布极偏斜。值的范围在 0 到 512.3292 之间，中位数仅为 14.4542。此外，`Parch` 和\
  \ `Sibsp` 属性似乎只取少数数值，可能将其作为分类数据而非数值数据处理更好。另一个选项是将 `Parch` 和 `Sibsp` 属性合并为一个名为 `FamilySize`\
  \ 的新分类属性。\n\n现在我们已经检查了 Amazon Machine Learning 为我们的数据提供的见解，我们将直接使用该数据源来创建一个 ML 模型。\n\
  \n## 创建 ML 模型\n\n要使用我们在本节早些创建的数据源创建 ML 模型，请导航到 Amazon Machine Learning 仪表板并选择“创建新\
  \ ML 模型”（Create New ML Model）选项（图 15.25）。\n\n![FIGURE 15.25 创建一个 ML 模型](img/c15f025.png)\n\
  \n`FIGURE 15.25` 创建一个 ML 模型\n\n你将被要求选择一个数据源。找到与 `train.csv` 文件对应的数据源，并可用数据源列表中选择它（图\
  \ 15.26）。\n\n![FIGURE 15.26 选择一个数据源](img/c15f026.png)\n\n`FIGURE 15.26` 选择一个数据源\n\
  \n系统将显示数据源的摘要。点击“继续”（Continue）进入下一步。在 ML 模型设置页面上，为模型提供一个名称并选择“默认训练和评估”（Default training\
  \ and evaluation）选项（图 15.27）。\n\n![FIGURE 15.27 指定 ML 模型设置](img/c15f027.png)\n\n\
  `FIGURE 15.27` 指定 ML 模型设置\n\n当你选择默认选项时，Amazon Machine Learning 将预留数据源中 30% 的数据用于评估，其余\
  \ 70% 用于训练。Amazon Machine Learning 还将对许多模型参数使用默认值。\n\n接受默认设置对于创建基准模型是可以的。然后，你可以使用不同的自定义设置创建额外的模型，并将这些模型的性能与基准模型进行比较。\n\
  \n点击“检查”（Review）按钮进入检查页面。滚动到页面底部并点击“创建模型”（Create Model）按钮来创建模型。\n\n创建模型可能需要几分钟时间。在创建新模型之前，Amazon\
  \ Machine Learning 将从你的数据源创建两个新的数据源，其中一个数据源包含 70% 的训练集，另一个包含 30% 的评估集。\n\n创建模型后，Amazon\
  \ Machine Learning 将使用评估集进行评估。你可以从仪表板访问模型、新数据源和评估结果（图 15.28）。\n\n![FIGURE 15.28\
  \ 显示新数据源、ML 模型和评估的 Amazon Machine Learning 仪表板](img/c15f028.png)\n\n`FIGURE 15.28`\
  \ 显示新数据源、ML 模型和评估的 Amazon Machine Learning 仪表板\n\n现在让我们检查 Amazon Machine Learning\
  \ 使用默认设置创建的 ML 模型特征。点击仪表板中的模型访问模型的摘要页面（图 15.29）。\n\n![FIGURE 15.29 ML 模型摘要](img/c15f029.png)\n\
  \n`FIGURE 15.29` ML 模型摘要\n\n最新评估的结果显示在摘要页面。AUC 指标列为 0.889。点击 AUC 指标查看更多详情（图 15.30）。\n\
  \n![FIGURE 15.30 ML 模型评估](img/c15f030.png)\n\n`FIGURE 15.30` ML 模型评估\n\nAUC 0.889\
  \ 是相当不错的，考虑到 AUC 分数为 0.5 意味着模型在随机猜测。点击“探索性能”（Explore Performance）按钮访问额外的模型统计数据。\n\
  \n为了调整模型性能，你可以通过在图上水平拖动块来更改二分类的评分阈值（图 15.31）。\n\n![FIGURE 15.31 ML 模型评估](img/c15f031.png)\n\
  \n`FIGURE 15.31` ML 模型评估\n\n## 批量预测\n\n现在你已经创建了 ML 模型，是时候使用该模型进行预测了。Amazon Machine\
  \ Learning 允许进行批量预测和单次预测。在本节中，我们将使用 `Titanic_TestDataSource` 创建批量。\n\n批量预测涉及生成包含观测值的\
  \ CSV 文件，并将观测值提交给 Amazon Machine Learning。预测结果将存储在 S3 桶中的另一个 CSV 文件中。此选项适用于不需要实时预测的情况。\n\
  \n要创建批量预测，导航到 Amazon Machine Learning 仪表板并在“新建”（Create New）下拉菜单下选择“批量预测”（Batch Prediction）选项（图\
  \ 15.33）。\n\n![FIGURE 15.33 在 Amazon Machine Learning 仪表板上创建批量预测的选项](img/c15f033.png)\n\
  \n`FIGURE 15.33` 在 Amazon Machine Learning 仪表板上创建批量预测的选项\n\n你将看到 ML 模型列表（图 15.34）。点击上一节生成的\
