  \n## NumPy\n\n`NumPy` 是一个用于 Python 的数学库，允许快速且高效地操作数组。`NumPy` 提供的主要对象是名为 `ndarray`\
  \ 的同质多维数组。`ndarray` 的所有元素必须是相同的数据类型，在 `NumPy` 术语中，维度被称为 `axes`（轴）。在 Python 项目中使用\
  \ `NumPy`，你通常会在 Python 文件中添加以下导入语句：\n\n```python\nimport numpy as np\n```\n\n使用小写别名\
  \ `np` 是 Python 项目中引用 `NumPy` 的标准约定。\n\n### 创建 NumPy 数组\n\n你可以通过多种方式创建 `ndarray`。要从一个包含三个元素的\
  \ Python 列表创建一个 `ndarray` 对象，请使用 `np.array()` 语句。在 Jupyter Notebook 中输入以下代码段，将创建一个包含三个元素的\
  \ NumPy 数组：\n\n注意括号内方括号的使用。省略方括号会导致错误。`ndarray` `x` 有一个轴和三个元素。与使用 Python 库类 `array`\
  \ 创建的数组不同，`NumPy` 数组可以是多维的。以下语句创建了一个具有两个轴的 NumPy 数组，并打印 `ndarray` 对象的内容：\n\n上述语句创建的\
  \ `ndarray` 有两个轴，为了可视化目的，可以表示为四行三列的二维矩阵：\n\n```\n11 28 9\n56 38 91\n33 87 36\n87\
  \ 8 4\n```\n\n第一个 `axis` 包含四个元素（行数），第二个 `axis` 包含三个元素（列数）。表 D.1\n\n#### 常用数组属性\n\
  \n| 属性 | 描述 |\n| :--- | :--- |\n| `ndim` | 返回 `axes` 的数量。 |\n| `shape` | 返回数组沿每个\
  \ `axis` 的尺寸大小。 |\n| `size` | 返回数组中元素的总数。 |\n| `dtype` | 返回数组的数据类型。 |\n\n一些常用的 `NumPy`\
  \ 变体：\n\n*   `zeros`: 创建每个元素均为 0 的 ndarray。\n*   `ones`: 创建每个元素均为 1 的 ndarray。\n\
  *   `empty`: 创建一个未初始化的 ndarray。\n*   `random.random`: 创建一个位于半开区间 [0.0, 1.0) 内的随机值数组。\n\
  \n例如，如果你想创建一个具有四行三列的 ndarray，其中每个元素都是 3，你将使用类似于下所示的语句：\n\nNumPy 提供了创建序列的方法。最常用的是：\n\
  \n*   `arange`: 创建具有等间距元素的单轴 ndarray。\n*   `linspace`: 创建具有等间距元素的单轴 ndarray。\n\n\
  `arange` 函数与 Python 的 `range` 函数类似。`arange` 函数接受四个参数：第一个值是范围的起始值，第二个值是范围的结束值，第三个值是范围内的步长增量，第四个值是一个可选参数，允许你指定数据类型。\n\
  \n例如，以下代码段创建了一个 ndarray，其元素位于 [0,9) 范围内。ndarray 中的每个元素都比前一个元素大三个：\n\n范围的上限不包含在 `arange`\
  \ 函数生成的数字中。因此，上述语句生成的 ndarray 将具有以下元素，且不包含数字 9：\n\n```\n0, 3, 6\n```\n\n如果你想要从 0\
  \ 到某个特定数字的整数序列，可以带一个参数调用 `arange` 函数。以下语句实现相同的结果：\n\n`linspace` 函数与 `arange` 类似，都会生成位于范围内的数字序列。区别在于第三个元素是起始和结束值之间所需的数值数量。以下语句创建了一个\
  \ 0 到 9 之间具有三个元素的 ndarray：与 `arange` 函数不同，`linspace` 函数确保指定的下限和上限在序列中。\n\n### 修改数组\n\
  \nNumPy 提供了几个允许你修改数组内容的函数。虽然在本附录中无法涵盖每一个函数，但将讨论最常用的操作。\n\n#### 算术运算\n\nNumPy 允许在两个数组之间执行逐元素的算术运算。操作结果存储在一个新的数组中。+\
