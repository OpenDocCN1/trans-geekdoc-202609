  \n数据科学家必须处理的最常见问题之一是缺失值。原始数据集通常在一个列或多个列中具有缺失值。值缺失的原因有很多，从人为失误到该观测值的数据根本不可用等。当您将\
  \ CSV 文件加载到 Pandas dataframe 时，Pandas 使用 `NaN` 作为标记缺失值的符号。有多种方法可以判断 dataframe 中的列是否包含缺失值。其中一种方法是使用如下代码段所示的\
  \ `info()` 函数：\n\n查看 `info()` 函数的结果，很明显大多数列都有 891 个值，而有三列——`Age`、`Cabin` 和 `Embarked`\
  \ 的值少于 891 个。使用 `info()` 函数检测缺失值仅在该值在 CSV 文件中确实缺失时才有效，这意味着 Pandas 能够检测到缺失值并将其替换为\
  \ dataframe 中的 `NaN` 标记。然而，如果生成数据的过程使用了空格或特殊字符（如 `!`）来表示缺失值，那么 Pandas 将不会自动解释这些字符为代表缺失数据。\n\
  \n获取缺失值信息的另一种方法是将 Pandas `isnull()` 函数的输出与 `sum()` 函数进行链式调用。当应用于 dataframe 时，`isnull()`\
  \ 函数会返回一个与原始 dataframe 维度相同的布尔值 dataframe。如果原始 dataframe 中对应位置的值为 `None` 或 `NaN`，则新\
  \ dataframe 中对应位置的值为 `True`。当 `sum()` 函数应用于新的布尔值 dataframe 时，将返回一个列表，其中包含每列 `True`\
