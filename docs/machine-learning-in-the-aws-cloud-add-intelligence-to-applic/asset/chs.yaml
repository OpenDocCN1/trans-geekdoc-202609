  \ configurations）创建新的预测端点。\n\n## 在专用训练实例上使用内置算法训练模型\n\n在本章之前的章节中，你已经创建了基于 Scikit-learn\
  \ 的 k-means 分类器，并在笔记本实例以及专用训练实例上对它们进行了训练。在本节中，你将使用笔记本实例，利用 Amazon SageMaker 内置的\
  \ k-means 算法实现在鸢尾花（Iris flowers）数据集上训练一个 k-means 分类器。Amazon SageMaker 提供了多种流行机器学习算法的云优化实现，k-means\
  \ 就是其中之一。使用内置算法训练模型的步骤与在专用 Scikit-learn 实例上训练模型相似，甚至可能更简单。Amazon SageMaker 为每个内置算法都提供了\
  \ Docker 镜像。这些特定算法的 Docker 镜像与通用 Scikit-learn Docker 镜像非常相似，由于你不需要向它们部署任何模型构建过程，代码已经存在于镜像中，并预配置为接受标准输入（例如来自命令行参数的超参数和数据位置）。\n\
  \n特定算法 Docker 镜像路径的通用格式如下：\n\n```\n<ecr_path>/<algorithm>:<tag>\n```\n\n`ecr_path`\
  \ 部分指向你想要创建训练实例区域的 Amazon ECR Docker 注册表路径，`algorithm` 部分是标识特定算法的标识符，`tag` 部分标识\
  \ Docker 镜像的版本。你可以在以下 URL 处获取所有特定算法 de 镜像的完整列表：`https://docs.aws.amazon.com/sagemaker/latest/dg/sagemaker-algo-Docker-paths`。\n\
  \n根据本章编写时该页面的信息，在 eu-west-1 区域中包含内置 k-means 分类器的最新版本 Docker 镜像路径为 `438346466558.dkr.ecr.eu-west-1.amazonaws.com/kmeans:latest`。值得注意的是，并非所有算法在每个\
  \ AWS 区域都可用。\n\n如果你从笔记本实例使用 AWS SageMaker Python SDK 暴露的高层级接口，则不需要显式指定 Docker 镜像的路径。然而，如果你在使用某些低级类，或者使用\
  \ AWS boto3 SDK，则需要提供镜像的路径。本章不涵盖使用低级 `Estimator` 类或低级 boto3 SDK；如果你想更多关于使用低级 SDK\
  \ 基于内置算法训练模型的信息，请访问 `https://docs.aws.amazon.com/sagemaker/latest/dg/ex1-train-model.html`。\n\
  \n本节的其余部分将介绍如何使用 AWS SageMaker Python SDK 暴露的高级接口，从笔记本实例使用内置算法创建训练作业。要开始，请启动 `kmeans-iris-flowers`\
  \ 笔记本实例，并在笔记本实例上创建一个使用 `conda_python3` 内的新 Jupyter Notebook 文件。将笔记本标题更改为 `kmeans-iris-flowers`，并在笔记本单元格中输入以下代码：\n\
  \n\n\n\n\n```python\nimport sagemaker\nimport boto3\nimport io\nimport pandas as\
  \ pd\nimport numpy as np\n \n# 获取此 Notebook 实例使用的与 SageMaker 兼容的角色。\nrole = sagemaker.get_execution_role()\n\
  \ \n# 获取 SageMaker 会话对象，可以用于\n# 管理与 SageMaker API 的交互。\nsagemaker_session = sagemaker.Session()\n\
  \ \n# 创建一个训练任务，使用 Amazon SageMaker \n# 内置的 k-means 算法来训练 KMeans 模型\n#\n# 设置超参数 k\
  \ = 3\nfrom sagemaker import KMeans\n \ninput_location = 's3://awsml-sagemaker-source/iris-train.csv'\n\
  output_location = 's3://awsml-sagemaker-results'\n \nkmeans_estimator = KMeans(role=role,\n\
  \                train_instance:count=1,\n                train_instance:type='ml.m4.xlarge',\n\
  \                output_path=output_location,\n                k=3)\n \n \n# 从 Amazon\
  \ S3 加载训练和验证数据集\ns3_client = boto3.client('s3')\ns3_bucket_name='awsml-sagemaker-source'\n\
  \ \nresponse = s3_client.get_object(Bucket='awsml-sagemaker-source', Key='iris_train.csv')\n\
  response_body = response[\"Body\"].read()\ndf_iris_train = pd.read_csv(io.BytesIO(response_body),\
  \ header=0, delimiter=\",\", low_memory=False)\n \nresponse = s3_client.get_object(Bucket='awsml-sagemaker-source',\
  \ Key='iris_test.csv')\nresponse_body = response[\"Body\"].read()\ndf_iris_test\
  \ = pd.read_csv(io.BytesIO(response_body), header=0, index_col=False, delimiter=\"\
  ,\", low_memory=False)\n \n## 将目标变量 'species' 从字符串转换为整数。\nfrom sklearn.preprocessing\
  \ import LabelEncoder\nlabelEncoder = LabelEncoder()\nlabelEncoder.fit(df_iris_train['species'])\n\
  labelEncoder.fit(df_iris_test['species'])\ndf_iris_train['species'] = labelEncoder.transform(df_iris_train['species'])\n\
  df_iris_test['species'] = labelEncoder.transform(df_iris_test['species'])\n \n#\
  \ 将训练和验证数据集分离为特征数据集和目标数据集\n# 假设 iris_train.csv 和 iris_test.csv 文件的第一列\n# 包含目标属性。\n\
  #\n# 由于训练 k-means 分类器不需要标记的训练数据，\n# 你将不会使用 df_iris_target_train\n \ndf_iris_features_train=\
  \ df_iris_train.iloc[:,1:]\ndf_iris_target_train = df_iris_train.iloc[:,0]\n \n\
