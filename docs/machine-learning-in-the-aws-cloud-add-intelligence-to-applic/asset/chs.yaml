  \n# 总结\n\n*   `Amazon SageMaker` 是一种完全托管的 Web 服务，提供了在 AWS 云基础设施上使用 `Python` 代码进行数据探索、特征工程以及训练机器学习模型的能力。\n\
  *   `Amazon SageMaker` 提供了许多云优化版机器学习算法的实现，例如 `XGBoost`、因子分解机（factorization machines）和\
  \ `PCA`。\n*   `Amazon SageMaker` 还提供了基于 `Scikit-learn`、`Google TensorFlow` 和 `Apache\
  \ MXNet` 等流行框架创建自定义算法的能力。\n*   用于 `Python` 的 `Amazon SageMaker SDK`为 Python 开发者提供了一个方便的高级、面向对象的接口。\n\
  *   `Amazon SageMaker 笔记本实例` 是你账户中的 `EC2` 实例，预先配置了 `Jupyter Notebook 服务器`以及许多常用的\
  \ `Python` 库。\n*   `训练任务（Training jobs）`会在 AWS 云中创建专用的计算实例，这些实例包含构建模型的代码，从 `Amazon\
  \ S3` 加载训练数据，在训练数据上执行构建代码，并将训练好的模型保存到 `Amazon S3`。\n*   当训练任务完成后，用于支持训练过程的计算实例将自动终止。\n\
  *   将模型部署到生产环境涉及创建一个或多个计算实例、将模型部署到这些实例上，并提供一个可以使用部署模型进行预测的 API。\n*   `预测实例（Prediction\
  \ instances）`不会自动终止。\n*   `端点配置（endpoint configuration）`将训练好的机器学习模型的位置信息、计算实例类型和自动伸缩策略结合在一起。\n\
  *   `预测端点（prediction endpoint）`是一个 `HTTPS REST API 端点`，可从部署的模型获取单次预测。该 HTTP 端点使用\
  \ `AWS Signature V4` 认证进行安全保护。\n*   如果你需要对整个数据集进行预测，可以使用 `Amazon SageMaker Batch\
  \ Transform` 从训练好的模型创建批量预测任务。\n\n# 第 17 章：在 Amazon SageMaker 中使用 Google TensorFlow\n\
