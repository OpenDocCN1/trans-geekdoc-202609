  \n# 总结\n\n- 并不是所有的机器学习算法都能处理分类数据。独热编码是一种将分类特征转换为多个二进制数值特征的技术，每个类别对应一个特征。\n- `pyplot`\
  \ 模块的惯别名是 `plt`，`matplotlib` 包的别名是 `mpl`，Seaborn 包的别名是 `sns`。\n-  `pyplot` 子模块和\
  \ `matplotlib` 包的原因是为了允许你使用来自 `pyplot` 提供的高层抽象的函数以及 Matplotlib 暴露的低级面向对象的 API。\n\
  \n# 第 3 章：使用 Python 进行数据可视化\n\n### 本章内容\n\n- Matplotlib 简介\n- 学习使用 Pandas\n\n##\
  \ 介绍 Matplotlib\n\nMatplotlib 是一个用于 Python 的绘图库，提供了生成多种类型图表的功能以及自定义这些图表的能力。它由 John\
  \ Hunter 创建，旨在为 Python 用户提供一个类似于 MATLAB 的绘图库。MATLAB 是科学界数据可视化的标准。Matplotlib 包拥有庞大的代码，旨在满足各种用户的需求并提供不同抽象层次的能力。某些用户可能只想向\
  \ Matplotlib 提供一些数组中的数据，并要求使用尽可能少的命令创建特定类型的图表（如散点图）；这些用户可能不想控制图表的详细属性（如位置、缩放、线条样式、颜色）。另一方面，另一些用户可能希望控制图表的每一个属性，甚至精确到单个像素级。\n\
  \n对于大多数常见的绘图任务，你将使用 Matplotlib 中的 `pyplot` 模块，它提供了最高级别的抽象。`pyplot` 模块实现了一个函数接口，由状态机设计驱动——你使用函数来设置绘图引擎的属性（如颜色和字体），这些设置将应用于后续的所有图表，直到你发布更改它们的命令为止。在\
  \ `pyplot` 抽象层之下是面向对象的接口，它提供了更大的灵活性。\n\n\n\n\n在查看 Matplotlib 图形的组件之前，让我们先来看使用 `pyplot`\
  \ 模块绘制简单曲线的代码。以下代码段为 `x` 取值在 1 到 7 之间绘制函数 `y[1]\\=4x² + 2x + 2` 和函数 `y[2] = 3x +\
  \ 4`。图 3.1 展示了这些语句生成的图形。\n\n![图 3.1 使用 Matplotlib 绘制两条曲线](img/c03f001.png)\n\n图\
  \ 3.1 使用 Matplotlib 绘制两条曲线\n\n该代码段使用 NumPy 函数生成 ndarray 数组 `x`、`y1` 和 `y2`。然后使用语句\
  \ `plt.figure(figsize=(7,7))` 创建一个尺寸为 7 × 7 英角的 Matplotlib 图形对象。使用 `plt.plot(x,\
  \ y1)` 语句绘制第一条曲线 `y[1]\\=4x² + 2x + 2`；绘图函数的输入是需要绘制的点的二维坐标。`plt.xlabel('X values')`\
  \ 和 `plt.ylabel('Y values')` 语句用于美观，分别在图表的 x 轴和 y 轴上添加标签。最后，使用 `plt.show()` 语句渲染图形。\n\
  \n## 图形的组件\n\n无论你使用 Matplotlib 绘制什么种类型的图，无论你是使用高层的 `pyplot` 接口还是低层的面向对象的接口，都有与图形相关的通用组件和术语。本节介绍了这些概念的概述。图\
  \ 3.2 展示了图的组成部分\n\n![图 3.2 Matplotlib 图形的组件](img/c03f002.png)\n\n图 3.2 Matplotlib\
  \ 图形的组件\n\n### Figure (图形)\n\nfigure 对象可以被看作整个图表，包含所有的线条和文本。你可以将其 idea 为容器；你使用 Matplotlib\
  \ 绘制的所有内容都属于一个 figure。Figure 通常使用 `pyplot` 函数创建，即使你随后想用低层的面向对象 API 对 figure 进行操作。使用以下\
  \ `pyplot` 命令创建一个空 figure：\n\n```\nplt.figure()\n```\n\n如果你想让 figure 有特定的尺寸，可以提供一个包含\
  \ x 轴和 y 轴英寸制尺寸的元组：\n\n```\nplt.figure(figsize=(10,5)) \n```\n\n除了 `figsize` 属性外，`pyplot`\
  \ figure 函数还可以接受各种其他属性，你可以使用它们在创建时自定义 figure 的各个方面。你可以在 https://matplotlib.org/api/_as_gen/matplotlib.pyplot.figure.html\
  \ 找到更多关于这些属性的信息。\n\n`pyplot` figure 函数创建一个 figure 并将其变为活动 figure，后续的绘制操作将对其生效。在绘制某些内容之前，figure\
  \ 不会显示。如果你想在 figure 创建后使用面向对象的 API 控制其各个方面，你需要在代码中存储 figure 对象的引用，并结合引用使用面向对象 API。以下代码段使用\
  \ `pyplot` 函数创建一个 figure，然后使用面向对象 API 修改 figure 的背景颜色：\n\n### Axes (坐标轴区域)\n\naxes\
  \ 对象是你通常认为的“图”。它是实际的图，带有与图相关的各种特征，如数据点、标记、颜色、比例尺。figure 对象可以包含多个 axes，这实际上是较大图表内的多个子图。以下代码段使用\
  \ `pyplot` 创建了一个具有 2 × 2 网格的 axes（子图）的 figure，并存储了对 figure 对象和 axes 对象的引用。每个 axes\
  \ 对象都有自己的标题，这与 figure 标题不同。使用面向对象 API 设置 figure 以及其内部子图的标题。图 3.3 展示了执行代码后生成的图形。\n\
  \n![图 3.3 带有四个 axes 的 figure 对象](img/c03f003.png)\n\n图 3.3 带有四个 axes 的 figure 对象\n\
  \n```\n## 创建一个具有 2 x 2 对象网格的 figure\nfigure, axes_list = plt.subplots(2,2, figsize=(9,9))\n\
  ## figure 对象的标题\nfigure.suptitle('This is the title of the figure') \n## 每个轴的标题\n\
  axes_list[0,0].set_title('Subplot 0')\naxes_list[0,1].set_title('Subplot 1')\naxes_list[1,0].set_title('Subplot\
  \ 2')\naxes_list[1,1].set_title('Subplot 3')\n```\n\nMatplotlib 的 `figure` 和 `axes`\
  \ 类是处理低层面向对象 API 的主要入口。\n\n### Axis (坐标轴)\n\naxis 对象代表子图中的一个维度。二维图有两个 axis 对象：一个用于水平方向，另一个用于垂直方向。作为面向对象接口一部分的\
  \ `axes` 类提供了几种方法来修改底层 x 轴和 y 轴的属性。\n\n### Axis Labels (轴标签)\n\n轴标签显示在图的每个轴的下方（或侧边）。可以通过在\
  \ axes 对象上调用 `set_xlabel()` 和 `set_ylabel()` 方法来配置轴标签。以下代码段演示了这些方法的使用：\n\n```\n\
  figure, axes = plt.subplots(figsize=(10,10))\naxes.set_xlabel('Variable 1')\naxes.set_ylabel('Variable\
  \ 2')\n```\n\n如果你不想使用 axes 对象暴露的面向对象 API，可以使用 `pyplot` 高层接口中的 `xlabel()` 和 `ylabel()`\
  \ 函数，它们为活动图设置轴标签。以下代码段演示了这些函数的使用：\n\n```\nplt.figure(figsize=(7,7))\nplt.xlabel('X\
  \ values')\nplt.ylabel('Y values')\n```\n\n### Grids (网格)\n\n网格是图区域内的一组水平和垂直线，有助于读取数值。axes\
  \ 对象提供了一个名为 `grid()` 方法，用于自定义网格的外观。你可以在 https://matplotlib.org/api/_as_gen/matplotlib.axes.html\
  \ 找到更多关于 axes 类的 `grid()` 方法的信息。`pyplot` 模块也提供了 `grid()` 函数，它与 axes 类的同名方法相同。\n\n\
  以下代码段演示了 axes 类的 `grid()` 方法：\n\n```\nfigure, axes = plt.subplots(figsize=(10,10))\n\
  axes.grid(b=True, which='both', linestyle='--', linewidth=1)\n```\n\n图 3.4 展示了两个并排的图，一个带有网格，一个没有。\n\
  \n![图 3.4 有无网格对比图](img/c03f004.png)\n\n[图 3.4] 有无网格对比\n\n### Title (标题)\n\n标题是显示在图上方的一个字符串。figure\
  \ 对象及其内部 axes 对象都可以拥有标题。标题默认位于 figure 或 axes 对象的顶部，居中对齐。可以使用 figure 类的 `suptitle()`\
  \ 方法或 `pyplot` 模块的 `suptitle()` 函数更改 figure 标题。这两个函数在语法和功能上是相同的。关于 `pyplot suptitle()`\
  \ 函数的更多信息可以在 https://matplotlib.org/api/_as_gen/matplotlib.pyplot.suptitle.html#matplotlib.pyplot.suptitle\
  \ 找到。\n\n以下代码段演示了 figure 类的 `suptitle()` 方法以及 `pyplot` 模块的 `suptitle()` 函数：\n\n\
  ```\n## 创建一个包含一个 axes 的 figure\n## 在 figure 实例上调用 suptitle 方法\nfigure, axes = plt.subplots(figsize=(10,10))\n\
  figure.suptitle('Figure Title')\n \n## 创建一个新的包含一个 axes 的 figure\n## 使用 pyplot suptitle\
  \ 函数\nplt.figure(figsize=(7,7))\nplt.suptitle('Figure Title')\n```\n\n可以通过在 axes\
  \ 对象上调用 `set_title()` 方法来更改 axes 对象的标题。关于使用 `set_title()` 方法的更多信息可以在 https://matplotlib.org/api/_as_gen/matplotlib.axes.Axes.set_title.html#matplotlib.axes.Axes.set_title\
  \ 找到。\n\n\n\n\n\n`pyplot` 模块提供了一个名为 `title()` 的便利函数，它在活跃的轴对象上操作，并且其签名与 `axes` 类的\
  \ `set_title()` 方法相同。下面的代码演示了如何使用 `axes` 类的 `set_title()` 方法以及 `pyplot` 模块的 `title()`\
  \ 函数：\n\n```\n## 创建一个包含一个 axes 对象的图形。\n## 在 axes 实例上调用 set_title() 方法。\nfigure,\
  \ axes  = plt.subplots(figsize=(10,10))\naxes.suptitle('Axes Title')\n \n## 创建一个包含一个\
  \ axes 对象的新图形\n## 使用 pyplot suptitle() 函数\nplt.figure(figsize=(7,7))\nplt.title('Axes\
  \ Title')\n```\n\n 常见图表\n\n在上一节中，你学习了典型 Matplotlib 图表的各个方面，并了解到通常有不同的方法来配置图表。高层\
  \ `pyplot` API 提供了函数式接口，而低层 Matplotlib API 则使用面向对象的接口操作。在本节中，你将学习如何使用 Matplotlib\
  \ 创建常见的图表类型。\n\n### 直方图\n\n直方图通常用于可视化数值变量的分布。在处理分类变量时，直方图并不适用。下面的代码使用了 `pyplot`\
  \ 模块中的函数来生成流行的 Titanic 数据集中 `Age` 属性的直方图。结果如图图 3.5 所示。\n\n![图 3.5 乘客年龄值的直方图](img/c03f005.png)\n\
  \n图 3.5 乘客年龄值的直方图\n\n```\nimport numpy as np\nimport pandas as pd\n \n## 将文件内容加载到\
  \ pandas Dataframe\ninput_file = './datasets/titanic_dataset/original/train.csv'\n\
  df_titanic = pd.read_csv(input_file)\n \n## 设置索引\ndf_titanic.set_index(\"PassengerId\"\
  , inplace=True)\n \n## 使用 pyplot 函数绘制 'Age' 属性的直方图\nfig = plt.figure(figsize=(7,7))\n\
  plt.xlabel('Passenger Age')\nplt.ylabel('Count')\nplt.grid()\n \nn, bins, patches\
  \ = plt.hist(df_titanic['Age'], histtype='bar', \n                            color='#0dc28d',\
  \ align='mid', \n                            rwidth=0.90, bins=7) \n```\n\n`pyplot.hist()`\
  \ 函数用于创建直方图。该函数接受多个参数。前面代码段中使用的参数包括 `histtype='bar'`，表示你想要一个标准的直方图；`rwidth=0.9`，在条形之间留出空间；以及\
  \ `bins=7`，即条形的数量。你可以在 `https://matplotlib.org/api/_as_gen/matplotlib.pyplot.hist.html#matplotlib.pyplot.hist`\
  \ 找到 `hist()` 函数支持的完整参数列表。\n\n直方图的外观受分策略（binning strategy）的影响，而策略由传递给 `bins` 参数的值控制。如果你传递一个整数（如前面的代码所示），Matplotlib\
  \ 将创建指定数量的等宽箱，并使用箱的边界（边缘）来确定每个箱中值的数量。你可以选择性地指定箱边界而不是箱的数量。在大多数情况下，你只需指定箱的数量。\n\n\
  `pyplot.hist()` 函数返回一个元组 `(n, bins, patches)`。元组的第一个元素 `n` 是一个包含每个箱计数的数组。第二个元素 `bins`\
  \ 是一个包含箱边界的浮点数数组，第三个元素 `patches` 是一个矩形对象数组，代表 Matplotlib 用于绘制条形时使用的低层绘图原语。你可以使用\
  \ `print()` 语句检查元组的内容：\n\n下面的代码段使用 `pyplot` 函数创建一个包含四个子图（轴对象）的图形，并使用面向对象的 API 在每个子图中创建相同数据的直方图，但具有不同数量的箱。该代码段的结果如图\
  \ 3.6 所示。\n\n![图 3.5 乘客年龄值的直方图](img/c03f005.png)\n\n图 3.5 乘客年龄值的直方图\n\n\n\n\n\n\
  \ 柱状图\n\n当你处理分类变量时，通常会使用柱状图。柱状图中的每个条形代表分类属性的某些信息，例如计数、平均值或其他指标。柱状图可用于名义分类数据和有序分类数据。在为名义分类数据绘制柱状图时，通常会对条形进行排序，使得条形的高度（或长度）按顺序增加。\n\
  \n这是可以实现的，因为包含名义数据的类别在值之间没有固有的顺序，因此你可以自由安排条形的位置，以创建一个视觉上美图表。继续使用上一节的 Titanic 数据集，以下代码段创建了\
  \ `Embarked` 属性的柱状图。生成的柱状图如图图 3.7 所示。\n\n![图 3.7 Embarked 属性的柱状图](img/c03f007.png)\n\
  \n图 3.7 Embarked 属性的柱状图\n\n```\n## 使用 pyplot 函数绘制绘制 'Embarked' 属性的柱状图\nfig = plt.figure(figsize=(9,9))\n\
  plt.xlabel('Embarkation Point')\nplt.ylabel('Count')\nplt.grid()\n \nvalues = df_titanic['Embarked'].unique()\n\
  counts = df_titanic['Embarked'].value_counts(dropna=False)\nx_positions = np.arange(len(values))\n\
  \ \nplt.bar(x_positions, counts, align='center')\nplt.xticks(x_positions, values)\
  \ \n```\n\n使用 Pandas dataframe 的 plot 函数绘制柱状图要要简单得多。以下代码段演示了如何使用 Pandas 函数创建相同的柱状图：\n\
  \n```\n## 使用 Pandas dataframe 函数绘制 'Embarked' 属性的柱状图\nfig = plt.figure(figsize=(7,7))\n\
  plt.xlabel('Embarkation Point')\nplt.ylabel('Count')\nplt.grid()\n \ndf_titanic['Embarked'].value_counts(dropna=False).plot.bar(grid=True)\n\
  ```\n\n### 分组柱状图\n\n如果你想显示每个类别内不同子组的信息，可以使用分组柱状图。如其名所示，分组柱状图是条形组聚集在一起的图表。每个条形组提供一个类别的信息，而组内条形的长度则提供了该类别内各个子组的信息。\n\
  \n例如，可以使用分组柱状图来可视化每个登船点幸存人数和未幸存人数的分布。以下代码段为 `Embarked` 属性创建了一个分组柱状图，每组有两个条形。生成的柱状图如图图\
  \ 3.8 所示。\n\n![图 3.8 Embarked 属性的分组柱状图](img/c03f008.png)\n\n图 3.8 Embarked 属性的分组柱状图\n\
  \n```\n## 为 Embarked 属性创建一个分组柱状图，\n## 每组有两个条形。\nsurvived_df = df_titanic[df_titanic['Survived']==1]\n\
  not_survived_df = df_titanic[df_titanic['Survived']==0]\n \nvalues = df_titanic['Embarked'].dropna().unique()\n\
  embarked_counts_survived = survived_df['Embarked'].value_counts(dropna=True)\nembarked_counts_not_survived\
  \ = not_survived_df['Embarked'].value_counts(dropna=True)\n \nx_positions = np.arange(len(values))\n\
  \ \nfig = plt.figure(figsize=(9,9))\nplt.xlabel('Embarkation Point')\nplt.ylabel('Count')\n\
  plt.grid()\n \nbar_width = 0.35\n \nplt.bar(x_positions, embarked_counts_survived,\
  \ bar_width, color='#009bdb', label='Survived')\nplt.bar(x_positions + bar_width,\
  \ embarked_counts_not_survived, bar_width, color='#00974d', label='Not Survived')\n\
  \ \nplt.xticks(x_positions + bar_width, values)\nplt.legend()\n \nplt.show() \n\
  ```\n\n以下代码段显示了如何使用 Pandas 绘制函数绘制相同的分组柱状图：\n\n```\n## 为 Embarked 属性创建一个分组柱状图，\n\
  ## 每组有两个条形。\nsurvived_df = df_titanic[df_titanic['Survived']==1]\nnot_survived_df\
  \ = df_titanic[df_titanic['Survived']==0]\n \nvalues = df_titanic['Embarked'].dropna().unique()\n\
  embarked_counts_survived = survived_df['Embarked'].value_counts(dropna=True)\nembarked_counts_not_survived\
  \ = not_survived_df['Embarked'].value_counts(dropna=True)\n \nembarked_counts_survived.name\
  \ = 'Survived'\nembarked_counts_not_survived.name = 'Not Survived'\ndf = pd.concat([embarked_counts_survived,\
  \ embarked_counts_not_survived], axis=1)\n \nfig, axes = plt.subplots(figsize=(9,9))\n\
  plt.xlabel('Embarkation Point')\nplt.ylabel('Count')\ndf.plot(grid=True, ax=axes,\
  \ color=['#009bdb', '#00974d'])\n```\n\n### 堆叠柱图\n\n堆叠图提供了可视化相同信息的另一种方法。它不是在分组中具有多个条形，而是每个分类值使用一个条形，并划分该条形以描述类别内子组的分布。\n\
  \n以下代码段为 `Embarked` 属性创建了一个堆叠图，显示每个登船点幸存者的分布。生成的柱状图如图图 3.9 所示。\n\n![图 3.9 Embarked\
  \ 属性的堆叠柱图](img/c03f009.png)\n\n图 3.9 Embarked 属性的堆叠柱图\n\n```\n## 为 Embarked 属性创建一个堆叠图\n\
  ## 显示每个类别的幸存人数\nsurvived_df = df_titanic[df_titanic['Survived']==1]\nnot_survived_df\
  \ = df_titanic[df_titanic['Survived']==0]\n \nvalues = df_titanic['Embarked'].dropna().unique()\n\
  embarked_counts_survived = survived_df['Embarked'].value_counts(dropna=True)\nembarked_counts_not_survived\
  \ = not_survived_df['Embarked'].value_counts(dropna=True)\n \nx_positions = np.arange(len(values))\n\
  \ \nfig = plt.figure(figsize=(9,9))\nplt.xlabel('Embarkation Point')\nplt.ylabel('Count')\n\
  plt.grid()\n \nplt.bar(x_positions, embarked_counts_survived, color='#009bdb', label='Survived')\n\
  plt.bar(x_positions + bar_width, embarked_counts_not_survived, color='#00974d',\
  \ label='Not Survived', bottom=embarked_counts_survived)\n```\n\nPandas 绘制函数相比于\
  \ `pyplot` 和 Matplotlib 的优势在堆叠图上显而易，特别是当每个条形有超过两个组时。在 Matplotlib 和 `pyplot` 函数中，你将需要使用多个\
  \ `plt.bar()` 语句将每个组堆叠在另一个之上。在 Pandas 中，你只需要将数据放入 dataframe 中并调用一次 `dataframe.plot.bar()`\
  \ 即可。\n\n### 堆叠百分比柱图\n\n如果你想显示类别内每个子组的百分比贡献，可以使用堆叠百分比柱图。堆叠百分比柱图中的条形高度都是相同的。以下代码段为\
  \ `Embarked` 属性创建了一个堆叠百分比柱图，显示每个登船点幸存者的百分比。生成的柱状图如图图 3.10 所示。\n\n\n\n\n\n![FIGURE\
  \ 3.10 Embarked 属性的堆叠百分比柱图](img/c03f010.png)\n\nFIGURE 3.10 Embarked 属性的堆叠百分比柱图\n\
  \n```python\n## a stacked percentage bar chart for the Embarked attribute\n## showing\
  \ the number of survivors in each category\nsurvived_df = df_titanic[df_titanic['Survived']==1]\n\
  not_survived_df = df_titanic[df_titanic['Survived']==0]\n \nvalues = df_titanic['Embarked'].dropna().unique()\n\
  counts = df_titanic['Embarked'].value_counts(dropna=True)\n \nembarked_counts_survived\
  \ = survived_df['Embarked'].value_counts(dropna=True)\nembarked_counts_not_survived\
  \ = not_survived_df['Embarked'].value_counts(dropna=True)\n \nembarked_counts_survived_percent\
  \ = embarked_counts_survived / counts * 100\nembarked_counts_not_survived_percent\
  \ = embarked_counts_not_survived / counts * 100\n \nx_positions = np.arange(len(values))\n\
  \ \nfig = plt.figure(figsize=(9,9))\nplt.xlabel('Embarkation Point')\nplt.ylabel('Percentage')\n\
  plt.grid()\n \nplt.bar(x_positions, embarked_counts_survived_percent, color='#009bdb',\
  \ label='Survived')\nplt.bar(x_positions, embarked_counts_not_survived_percent,\
  \ color='#00974d', label='Not Survived', bottom=embarked_counts_survived_percent)\n\
  \ \nplt.xticks(x_positions, values)\nplt.legend()\n \nplt.show() \n```\n\n以下代码片段使用\
  \ Pandas 绘图函数创建了相同的图表：\n\n```python\n## a stacked percentage bar chart for the Embarked\
  \ attribute\n## showing the number of survivors in each category\nsurvived_df =\
  \ df_titanic[df_titanic['Survived']==1]\nnot_survived_df = df_titanic[df_titanic['Survived']==0]\n\
  \ \nvalues = df_titanic['Embarked'].dropna().unique()\ncounts = df_titanic['Embarked'].value_counts(dropna=True)\n\
  \ \nembarked_counts_survived = survived_df['Embarked'].value_counts(dropna=True)\n\
  embarked_counts_not_survived = not_survived_df['Embarked'].value_counts(dropna=True)\n\
  \ \nembarked_counts_survived_percent = embarked_counts_survived / counts * 100\n\
  embarked_counts_not_survived_percent = embarked_counts_not_survived / counts * 100\n\
  \ \nembarked_counts_survived_percent.name = 'Survived'\nembarked_counts_not_survived_percent.name\
  \ = 'Not Survived'\ndf = pd.concat([embarked_counts_survived_percent, embarked_counts_not_survived_percent],\
  \ axis=1)\n \nfig, axes = plt.subplots(figsize=(9,9))\nplt.xlabel('Embarkation Point')\n\
  plt.ylabel('% Survived ')\n \ndf.plot.bar(stacked=True, grid=True, ax=axes, color=['#009bdb',\
  \ '#00974d'])\n```\n\n### 饼图\n\n饼图是柱状图的替代方案，可用于绘制类别属性中唯一值的比例。`pyplot` 模块提供了 `pie()`\
  \ 函数，用于创建饼图。`pyplot` 模块的 `pie` 函数使用了 `axes` 类的底层 `pie()` 方法。你可以在 `https://matplotlib.org/api/_as_gen/matplotlib.pyplot.pie.html`\
  \ 访问 `pyplot pie()` 函数的文档。\n\n以下代码片段对泰坦尼克数据集 `Embarked` 列的内容使用 `pyplot pie()` 函数创建一个饼图，描述了从每个登船港上船的乘客百分比。图\
  \ 3.11 展示了生成的饼图。\n\n![FIGURE 3.11 不同港口登船乘客比例饼图](img/c03f011.png)\n\nFIGURE 3.11\
  \ 从不同港口登船乘客比例的饼图\n\n```python\n## use pyplot functions to plot a pie chart of the\
  \ 'Embarked' attribute\nfig = plt.figure(figsize=(9,9))\n \nembarkation_ports =\
  \ df_titanic['Embarked'].dropna().unique()\ncounts = df_titanic['Embarked'].value_counts(dropna=True)\n\
  \ \ntotal_embarked = counts.values.sum()\ncounts_percentage = counts / total_embarked\
  \ * 100\n \ncounts_percentage.values\nplt.pie(counts_percentage.values, \n     \
  \   labels=embarkation_ports, \n        autopct='%1.1f%%', shadow=True, startangle=90)\
