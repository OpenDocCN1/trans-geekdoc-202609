  \ 中，这种方法将需要少得的代码。使用 Pandas 绘图函数的缺点是自定义饼图的选项减少了。以下代码片段使用 Pandas 绘图函数制作相同的饼图：\n\n\
  ```python\n## use Pandas functions to plot a pie chart of the 'Embarked' attribute\n\
  fig = plt.figure(figsize=(7,7))\ndf_titanic['Embarked'].value_counts(dropna=True).plot.pie()\n\
  ```\n\n当数据集的目标属性是二分类时，饼图可以帮助传递每个类别属性中值的分布，并按目标二分类属性进行分组。以下代码片段使用 Matplotlib 的 `Axes.pie()`\
  \ 方法创建三个饼图，显示泰坦尼克数据集中三个登船港幸存者的百分比。图 3.12 展示了生成的饼图。\n\n![FIGURE 3.12 显示每个登船港幸存者比例的饼图](img/c03f012.png)\n\
