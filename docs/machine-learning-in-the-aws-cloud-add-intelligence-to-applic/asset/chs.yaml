  \ 了解更多关于 `SKLearn` 类参数的信息。\n\n当你执行笔记本单元格中的代码时，Amazon SageMaker 会创建一个新的专用训练实例，并在实例准备就绪后在实例内执行你的脚本文件。这是一个耗时的过程，可能需要几分钟。在训练过程进行期间，你会在笔记本单元格下方看到打印各种状态消息（图\
