  \ \n \n# 创建训练任务。\ntrain_data = df_iris_features_train.values.astype('float32')\n\
  record_set = kmeans_estimator.record_set(train_data)\nkmeans_estimator.fit(record_set)\n\
  ```\n\n* * *\n\n执行 notebook 单元格中的代码以启动训练任务，这将导致 SageMaker 从默认 Docker 镜像中创建一个专用的\
