  \n>     \n\n> —Abhishek\n\n# 关于作者\n\n**Abhishek Mishra** 在 IT 行业活跃了超过 19 年，在各种编程语言、企业系统、服务架构和平台拥有丰富经验。\n\
  \n他拥有伦敦大学计算机科学硕士学位，目前在伦敦担任敦德银行集团（Lloyds Banking Group）的顾问与反欺诈解决方案架构师。他是多部著作的作者，其中包括《Amazon\
  \ Web Services for Mobile Developers》。\n\n# 关于技术编辑\n\n\n\n`Chaim Krause` 是一位计算机、电子产品、动物和电子音乐爱好者。当他能够在某个项目中将其中两种或多种元素结合时，他会感到非常高兴。他的绝大多数知识都是通过自主学习获得的。他经常向大家开玩笑说，他在家里工作和公司工作的唯一区别在于所使用的登录账号。作为一名终身学习者，他经常对文档中的技术错误感到沮丧，因为这些错误浪费了宝的时间并导致不必要的挫败感。他担任书籍技术编辑的原因之一，就是为了帮助他人避免同样的陷阱。\n\
  \n# 引言\n\nAmazon Web Services (AWS) 是当今行业领先的云计算平台之一。在本书编写期间，AWS 提供了超过 100 种服务，每种服务都属于\
  \ 18 个不同服务类别之一。对于初接触云计算或 AWS 生态系统的人来说，所提供的服务数量之多可能会让他们望无所从。要清楚从哪里开始以及关注哪些服务可能是非常困难的。\n\
  \n初接触机器学习的开发者以及经验丰富的数据科学家，往往没有意识到公有云的力量，特别是 AWS 在机器学习领域提供的产品。在过去，基于云的机器学习服务在支持的算法类型和可定制程度方面非常有限。当亚马逊宣布\
  \ `SageMaker` 时，这一切都改变了——该服务提供了基于亚马逊实现的尖端算法来构建机器学习模型的能力，并提供了使用 `Scikit-learn` 和\
  \ `Google TensorFlow` 等框架构建自定义模型的选项。\n\n云机器学习模型的实际用例并非基于孤立地使用模型，而是依赖于许多支持系统，例如数据库、负载均衡器、API\
  \ 网关和身份提供者，所有这些都由 AWS 提供。本书的编写旨在为资深机器学习专家和爱好者介绍一些基于预训练模型的 AWS 机器学习服务，并提供如何在 Amazon\
  \ `SageMaker` 上训练和部署你自己的自定义模型的分步骤示例。对于初学机器学习的爱好者，本书还提供了一些章节，涵盖机器学习的基础知识，如数据预处理、可视化、特征工程，以及\
  \ `NumPy`、`Pandas` 和 `Scikit-learn` 等常用 Python 库的使用。\n\n本书始终尝试在理论与实践之间取得平衡，让你对底层概念有足够的了解，并为你提供可以立即应用于工作中的最佳实践和实用建议。我也尽一切努力保持内容的更新和相关性。尽管这在极少数情况下可能会导致书籍过时，但我有信心内容在接下来的\
  \ AWS 服务版本中将保持有用性和相关性。\n\n## 本书适合读者\n\n本书最适合希望学习通用机器学习以及如何利用 AWS 提供的机器学习特定服务的软件开发者。本书对于数据科学家、系统架构师和应用架构师也有帮助，他们希望了解机器学习领域中一些常用的\
  \ AWS 服务。\n\n如果你对机器学习和 AWS 都是初学者，我建议你从头到尾阅读所有章节。如果你是经验丰富的数据科学家，你可能想跳到 第 2 部分 学习机器学习特定的\
  \ AWS 服务。\n\n## 本书涵盖的内容\n\n本书涵盖了在 AWS 云上使用 `Python` 构建和训练机器学习模型，以及许多现成用的机器学习服务，如\
  \ `Amazon Rekognition`、`Amazon Comprehend` 和 `Amazon Lex`。\n\n本书还涵盖了机器学习的通用高级概念，包括特征工程、数据可视化，以及用于构建机器学习系统的支持\
  \ AWS 服务，如 `Amazon IAM`、`Amazon Cognito`、`Amazon S3`、`Amazon DynamoDB` 和 `AWS Lambda`。\n\
  \n书中的模型构建和评估代码使用 `Python 3` 编写。亚马逊、苹果和 Google 提供的服务更新频繁，因此当你按照章节中的说明操作时，有时可能会遇到更新版本的界面。\n\
  \n## 本书的结构\n\n本书由 18 个章节组成，分为两部分四个附录。第一部分包含五个章节，涵盖了使用 `Python` 的机器学习基础。这部分涵盖了使用\
  \ `Pandas`、`NumPy`、`Matplotlib` 和 `Scikit-learn` 进行特征工程、数据可视化、模型构建和模型评估的技术。这部分开发的示例使用了\
  \ `Jupyter Notebook`，面向机器学习的新读者。\n\n第 2 部分 涵盖了使用 AWS 服务构建机器学习应用程序。这部分从介绍常用 AWS 服务的基础（如\
  \ `Amazon S3`、`Amazon DynamoDB` 和 `AWS Lambda`）开始。然后进入专门处理机器学习的 AWS 服务，如 `Amazon\
  \ Comprehend`、`Amazon Lex`、Amazon Machine Learning 和 Amazon SageMaker。。有两个章节专门介绍\
  \ `Amazon SageMaker`；第一章介绍使用内置算法和 `Scikit-learn` 构建并部署模型，第二章介绍使用 `Google TensorFlow`\
  \ 构建并部署模型。该部分并非所有章节都包含源代码，但在适用情况下，你可以通过 `GitHub` 链接下载每个章节配套的源代码。该部分的某些章节要求你将文件上传到\
  \ `Amazon S3`；你需要将示例中的存储桶名称替换为你账户中的名称。\n\n第 1 部分 的章节包括：\n\n*   **机器学习简介 (第 1 章)**\
  \ 介绍了机器学习系统的类型、其应用以及用于构建机器学习系统的工具。\n*   **数据收集与预处理 (第 2 章)** 本章涵盖了可用于训练数据的来源、探索数据集的技术以及基础特征工程。\n\
  *   **使用 Python 进行数据可视化 (第 3 章)** 本章涵盖了使用 `Matplotlib` 可视化数据集的技术。\n*   **使用 Scikit-learn\
  \ 创建机器学习模型 (第 4 章)** 本章涵盖了使用 `Scikit-learn` 构建和训练分类及回归模型的技术。\n*   **机器学习模型评估 (第\
  \ 5 章)** 本章涵盖了评估机器学习模型质量的技术。\n\n第 2 部分 的章节包括：\n\n*   **Amazon Web Services 简介 (第\
  \ 6 章)** 本章是对云计算和 AWS 的简要介绍。它还涵盖了常见的服务和部署模型。\n*   **AWS 全球基础设施 (第 7 章)** 本章介绍了 AWS\
  \ 区域、可用区和边缘节点。\n*   **身份与访问管理 (第 8 章)** 本章介绍了 AWS 提供的用于保护亚马逊云资源的关键服务之一。它还提供了注册 AWS\
  \ 免费层账户的说明。\n*   **Amazon S3 (第 9 章)** 本章介绍了 AWS 提供的常用的存储服务之一 Amazon Simple Storage\
  \ Service (S3)。\n*   **Amazon Cognito (第 10 章)** 本章介绍了亚马逊符合 OAuth2.0 标准的云端身份管理解决方案\
  \ Amazon Cognito。\n\n\n\n\n\n* **Amazon DynamoDB (第 11 章)** 本章介绍了 Amazon 的托管 NoSQL\
