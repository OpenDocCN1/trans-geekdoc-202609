  plt.grid()\n \nplt.bar(x_positions, embarked_counts_survived_percent, color='#009bdb',\
  \ label='Survived')\nplt.bar(x_positions, embarked_counts_not_survived_percent,\
  \ color='#00974d', label='Not Survived', bottom=embarked_counts_survived_percent)\n\
