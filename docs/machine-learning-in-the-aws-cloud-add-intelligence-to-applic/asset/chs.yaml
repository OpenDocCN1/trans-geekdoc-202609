  \n点击“下一步”按钮，并使用本节所述的相同设置创建存储桶。\n\n# 附录 C\n\n## 安装和配置 AWS CLI\n\n本附录包含了在 Mac OS X\
  \ 和 Windows 上安装和配置 AWS CLI 的说明。\n\nAWS 命令行界面 (CLI) 是一项工具，允许您通过互联网使用命令行界面管理您的 AWS\
  \ 服务。在本附录中，您将学习如何在计算机上下载、安装和配置适当版本的 AWS CLI。\n\n## Mac OS 用户\n\n如果您是 Mac OS 用户，可以使用捆绑安装程序在计算机上安装\
  \ AWS CLI。捆绑安装程序要求计算机上预装了 Python 2.6.5+ 版本或 Python3 3.3+ 版本。\n\n要检查 Mac OS 计算机上的\
  \ Python 版本，请打开终端 窗口，输入以下命令并按回车：\n\n```bash\npython --version\n```\n\n如果您的计算机上没有安装适当版本的\
  \ Python，请按照以下 URL 中的说明在您的计算机上获取/更新 Python：\n\n`http://docs.aws.amazon.com/cli/latest/userguide/installing.html#install-python`\n\
  \n### 在 Mac 上安装 AWS CLI\n\n在 Mac OS 终端窗口或系统等效 shell 提示符中输入以下命令：\n\n```bash\n$ curl\
  \ \" https://s3.amazonaws.com/aws-cli/awscli-bundle.zip \" -o \"awscli-bundle.zip\"\
  \n$ unzip awscli-bundle.zip\n$ sudo ./awscli-bundle/install -i /usr/local/aws -b\
  \ /usr/local/bin/aws\n```\n\n如果您没有安装 `unzip`，或者没有计算机的管理员权限，可以使用以下 URL 列出的技术之一在计算机上安装\
  \ AWS CLI：\n\n`http://docs.aws.amazon.com/cli/latest/userguide/installing.html`\n\
  \n一旦在计算机上安装了 AWS CLI，请输入以下行来测试安装情况：\n\n```bash\n$ aws help\n```\n\n您的屏幕应显示 `aws`\
  \ 命令列表以及每个命令的简要描述（请参见 图 C.1）。\n\n![图 C.1 AWS CLI 命令列表，Mac OS](img/bapp03f001.png)\n\
  \n**图 C.1** AWS CLI 命令列表，Mac OS\n\n输入 `aws` 指令将您带入 AWS CLI shell。要退出 AWS CLI shell\
  \ 并返回操作系统的默认 shell，请按键盘上的 **q**。\n\n### 在 Mac 上配置 AWS CLI\n\n在使用 AWS CLI 之前，您需要在计算机上配置\
  \ CLI 工具。在 Mac 的终端窗口或计算机上相应的 shell 提示符中输入以下命令：\n\n```bash\n$ aws configure\n```\n\
