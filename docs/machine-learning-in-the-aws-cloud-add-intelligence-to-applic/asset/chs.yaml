  \n`describe()` 函数提供的信息包括每个数值特征的最小值、最大值、平均值、标准差和四位数。四位数是一个在该值以下可以找到特定百分比的观测值。例如，第一四分位数是\
  \ 25% 观测值所在的值。`Age` 特征的第一四分位数是 20.12，这意味着数据集捕获的 25% 的人的年龄小于 20 岁。特征的四位数和统计特征通常使用箱线图（box\
  \ plot）表示。箱线图将在第 4 章中介绍；然而，你可以使用 dataframe 的 `boxplot()` 函数来创建所有数值特征的箱线图。以下片段演示了\
  \ `boxplot()` 函数的使用。生成的箱线图如图图 2.8 所示。\n\n![图 2.8 数值特征的箱线图](img/c02f008.png)\n\n\
  图 2.8 数值特征的箱线图\n\n输入特征与目标之间的相关性信息有助于从数据中筛选出最佳特征用于模型构建和预测。特征本身之间的相关性信息有助于减少特征数量和通用的过拟合风险。Pandas\
  \ 提供了 `corr()` 函数，可计算 dataframe 列之间的皮尔逊相关系数。在 `df_titanic` dataframe 上应用 `corr()`\
  \ 函数的结果如图图 2.9 所示。\n\n![图 2.9 数值之间的相关性](img/c02f009.png)\n\n图 2.9 数值之间的相关性\n\n需要注意的是，皮尔逊相关系数只能检测变量之间的线性相关性。`corr()`\
  \ 函数允许你从 Pearson、Kendall 和 Spearman 等标准相关系数中进行选择。更多信息请参见 `https://pandas.pydata.org/pandas-docs/stable/reference/api/pandas.DataFrame.corr.html`。\n\
  \n以下片段列出了数值特征与目标变量之间的相关性排序：\n\n计算属性对之间的相关系数并不是获取特征相关性的唯一方法。你还可以创建特征对之间的散点图来可视化它们的关系。以下片段使用\
  \ Pandas 的 `scatter_matrix()` 函数创建所有特征之间的散点图。生成的散点图如图图 2.10 所示。\n\n![图 2.10 属性之间的散点矩阵](img/c02f010.png)\n\
  \n图 2.10 属性之间的散点矩阵\n\n### 处理缺失值\n\n在上一节中，你学习了用于探索数据的技术。在探索泰坦尼克数据集时，你了解到 `Age`、`Cabin`\
  \ 和 `Embarked` 类存在缺失值。`Age` 是一个数值特征，我们可以使用以下片段通过箱线图快速获取构成该特征值的统计特征概述。图 2.11 展示了\
  \ `Age` 特征变量的箱线图。\n\n![图 2.11 Age 特征变量的箱线图](img/c02f011.png)\n\n图 2.11 Age 特征变量的箱线图\n\
  \n根据箱线图，年龄的中位数略低于 30。Pandas 提供了 `fillna()` 函数，可用新值替换缺失值。以下片段使用 `fillna()` 函数将 `Age`\
  \ 属性的缺失值替换为位数：\n\n- **注意**：虽然在本节未演示，但你必须确保在训练数据上进行的任何特征工程或插补操作也同样在测试数据上进行。\n\n\n\
  \n\n`Embarked` 属性是分类的，由于缺失值数量较少（仅 2 个），一种合理的方法是用 `Embarked` 列中出现频率最高的值来填充缺失值。以下代码片段使用\
  \ `fillna()` 函数来实现这一目标：\n\n`Cabin` 属性也是分类的，但它有大量的缺失值（687 个）。在这种情况下，使用用于填补 `Embarked`\
  \ 属性缺失值的相同策略将行不通，因为这会在数据中产生显著的偏差。在这种情况下，最佳方法是创建一个新的布尔特征 `CabinIsKnown`，如果 `Cabin`\
  \ 属性已知，则其值为 `True`，否则为 `False`。你可能倾向于使用整数 `1` 表示已知的客舱值，并用 `0` 表示缺失的客舱值，但如果你这样做，就会在数据中创造出一种无意的顺序关系（1\
  \ 大于 0），这可能会影响某些模型的输出。以下代码片段创建了一个名为 `CabinIsKnown` 的新列，并从数据框中删除了原始的 `Cabin` 列：\n\
  \n通过本节描述的更改，你已经尽可能地填充了缺失值，并在数据框中创建了一个新列。数据框中不应有缺失值，数据框中应该显示一个名为 `CabinIsKnown` 的新列，并且\
  \ `Cabin` 列应该已经从数据框中删除。这一切都可以通过执行以下片段来验证：\n\n### 创建新特征\n\n如果你观察泰坦尼克数据集列的描述，你会遇到\
  \ `SibSp` 和 `Parch` 列。根据数据集的描述：\n\n* `SibSp`: 一个数值变量，表示一起旅行的兄弟姐妹/配偶人数。\n* `Parch`:\
  \ 一个数值变量，表示一起旅行的父母和孩子人数。\n\n将这些值合并为一个代表一起旅行家庭人数的单一数值是有有意义的。在现阶段，无法判断模型在使用此额外的合成特征是否会表现更好，但在数据中拥有这一新特征将为你在构建和评估模型时提供更多选择。以下代码片段在数据框中创建了一个名为\
  \ `FamilySize` 的新属性，该属性通过 `SibSp` 和 `Parch` 属性的算术和计算得出：\n\n* **注意**：尽管本节未演示，但你必须确保在训练数据上进行的任何特征工程也同样在测试数据上进行。\n\
  \n`Age` 和 `Fare` 特征是数值型的并取一系列范围的值；对这些特征的值进行分箱（binning）并创建分类特征可能有用。在构建模型过程中，你可能会发现\
  \ `Age` 和 `Fare` 的分类（分箱）值能提供更好的结果。要创建一个名为 `AgeCategory` 的新分类特征，你可以像以下片段所示使用 Pandas\
  \ 的 `cut()` 函数：\n\n图 2.12 展示了创建 `AgeCategory` 特征后对 `df_titanic_features` 数据框执行 `head()`\
  \ 函数的输出。\n\n![图 2.12 带有工程特征 AgeCategory 的数据框](img/c02f012.png)\n\n图 2.12 带有工程特征\
  \ AgeCategory 的数据框\n\n`cut()` 函数有几个参数。在这个示例中，`bins` 参数包含一组定义分箱边界的数字序列；最低和最高值被特意选择在\
  \ `Age` 特征中观察到的值范围之外。`labels` 参数包含一个字符串列表，作为分箱的标签（以及执行 `cut()` 函数后生成的分类特征的值）。`include_lowest`\
  \ 参数设置为 `True`，表示第一个区间是左包含的。你可以在 `https://pandas.pydata.org/pandas-docs/version/0.23.4/generated/pandas.cut.html`\
  \ 找到 `cut()` 函数完整参数列表的信息。\n\n没有固定的公式来确定正确的分箱数量和分箱宽度。在模型构建过程中，你可能会发现自己正在尝试不同的分箱策略，并选择产生性能最佳模型的策略。如果你想通过使用分分位数将连续数值变量转换为分类变量，请使用\
  \ `qcut()` 函数。第二个参数 `q=4` 表示你想使用四分位数作为分箱边界。关于 `qcut()` 函数的信息可以在 `https://pandas.pydata.org/pandas-docs/stable/reference/pandas.qcut.html`\
  \ 获取。\n\n图 2.13 展示了创建 `AgeCategory` 特征后对 `df_titanic_features` 数据框执行 `head()` 函数的输出。\n\
  \n![图 2.13 带有工程特征 AgeCategory 的数据框](img/c02f013.png)\n\n图 2.13 带有工程特征 AgeCategory\
  \ 的数据框\n\n### 转换数值特征\n\n在上一节创建了分类特征 `AgeCategory` 和 `FareCategory` 后，你可能希望从数据集中删除原始的\
  \ `Age` 和 `Fare` 属性。删除数值的决定在很大程度上取决于你打算构建的模型类型。\n\n在带有连续数值变量构建模型时，你可能需要对数值属性进行转换。当数值属性的值较小且分布接近标准正态分布时，某些机器学习模型收敛得更快，且工作得更好。\n\
  \n归一化（Normalization）和标准化（Standardization）是对数值属性执行的最常见的两种类型转换。归一化一个特征的结果是特征的值被缩放到\
  \ 0 到 1 之间。标准化一个特征的结果是新值的分布具有均值 0 和标准差 1，但标准化后的值的值范围不保证在 0 到 1 之间。当你想要构建的模型假设特征变量具有高斯分布时，则使用标准化。归一化通常用于神经网络模型，这类模型要求输入落在\
  \ [0, 1] 范围内。\n\nScikit-learn 提供了许多类来辅助缩放数值属性。`MinMaxScaler` 类通常用于特征归一化，而 `StandardScaler`\
  \ 类通常用于标准化。以下代码片段在 `df_titanic_features` 数据框中创建了两个新列 `NormalizedAge` 和 `StandardizedAge`。图\
  \ 2.14 比较了 `Age`、`NormalizedAge` 和 `StandardizedAge` 特征的直方图：\n\n![图 2.14 Age, NormalizedAge\
  \ 和 StandardizedAge 的直方图](img/c02f014.png)\n\n图 2.14 Age, NormalizedAge 和 StandardizedAge\
  \ 的直方图\n\n### 分类特征的热热编码\n\n在本章中最后一个主题将使用独热编码（one-hot encoding）将分类特征转换为数值特征。你可能会好奇为什么想要将分类特征转换为数值，特别是由于本章的节一节已经讨论了相反的技术——将数值特征转换为分类特征。\n\
  \n\n\n并不是所有的机器学习算法都能处理分类数据。独热编码（One-hot encoding）是一种将分类特征转换为多个二进制数值特征的技术，每个类别对应一个特征。例如，线性回归和逻辑回归只能使用数值特征。而像\
  \ XGBoost 和随机森林这样的算法则可以很好地使用分类特征。\n\nPandas 提供了 `get_dummies()` 函数来帮助进行独热编码。以下代码片段将分类特征\
  \ `Sex`、`Embarked`、`CabinIsKnown`、`AgeCategory` 和 `FareCategory` 转换为二进制数值特征，并列出数据框的列：\n\
  \n从前面的代码可以看出，原始的分类属性不再存在于 `df_titanic_features` 数据框中；但添加了许多新列。为了理解 Pandas 如何创建这些额外的列，请考虑\
  \ `Sex` 分类属性。该属性有两个值：`male` 和 `female`。为了将此分类属性转换为二进制数值属性，Pandas 在数据框中创建了两个名为 `Sex_male`\
  \ 和 `Sex_female` 的新列。其他分类属性（如 `Embarked`、`CabinIsKnown` 等）也采用了类似的方法进行处理。以下代码片段列出了数据框前五行的\
  \ `Sex_male` 和 `Sex_female` 列的值：\n\n敏锐的读者可能会注意到，由于原始 `df_titanic_features` 数据集中\
  \ `Sex` 属性的值是 `male` 或 `female`，因此不需要同时拥有 `Sex_male` 和 `Sex_female` 属性，因为你可以从其中一个推出另一个。这两个属性之间存在极强的负相关性（-1.0），你不应该将它们作为机器学习模型的输入。以下代码片段演示了这两个属性之间的强负相关性：\n\
  \n`CabinIsKnown_False` 和 `CabinIsKnown_True` 特征的情况类似。以下代码片段删除了 `Sex_female` 和 `CabinIsKnown_False`\
  \ 属性，以及非数值属性 `Name` 和 `Ticket`，得到一个只包含数值属性的数据框：\n\n如果你计算目标属性 `Survived` 与这些数值特征之间的相关性，你会发现其相关性比本章特征工程之前获得的结果显著得多。以下代码片段演示了这一点：\n\
  \n请注意生存概率与 `Sex_male` 之间存在特别强的负相关性，且与 `FareCategory_Q4` 和 `FareCategory_Q1` 分别存在强正、负相关性。\n\
  \n特征工程是数据科学中最耗力且最耗时的方面，没有一种固定的公式可以适用于特定的情况。在本章中，你学习了一些可以用于探索数据、填充缺失值和特征工程的技术。\n\n\
