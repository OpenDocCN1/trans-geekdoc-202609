  \ box）坐标信息，以及如果 Amazon Rekognition 检测到标签之间存在层级关系则父标签名称组成。例如，`Wheel`标签有一个名为 `Machine`\
  \ 的父标签：\n\n```json\n{\n        \"Confidence\": 99.92826080322266,\n        \"Instances\"\
  : [ { \n            \"BoundingBox\": {\n            \"Height\": 0.44183894991874695,\n\
  \            \"Left\": 0.5008670091629028,\n            \"Top\": 0.4816884696483612,\n\
