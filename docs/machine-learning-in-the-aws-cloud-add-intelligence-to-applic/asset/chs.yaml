  \ 算法是一种简单的算法，尝试将输入观测值分配到 `k` 个簇中。该算法是无监督的，不需要预先标记的实例；你只需指定簇的数量，它将完全根据特征变量将训练数据集中的每个成员分配到其中一个簇中。值得注意的是，Amazon\
