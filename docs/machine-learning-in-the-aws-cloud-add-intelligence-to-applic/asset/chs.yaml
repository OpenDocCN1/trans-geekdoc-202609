  \n如果你在命令行语句中除了 `--image` 参数外添加了 `--max-labels` 和 `--min-confidence` 参数，你可以限制响应包含更少的标签，以及高于最低置信度分数的标签。以下命令行语句演示了如何使用这些额外属性：\n\
  \n```bash\n$aws rekognition detect-labels \\\n--image  '{\"S3Object\":{\"Bucket\"\
  :\"awsml-rekognition-awscli-source\", \\\n \"Name\":\"tower_bridge_01.jpg\"}} \\\
  \n--max-labels 4 \\\n--min-confidence 98.75\n```\n\n按下键盘上的 Enter 键执行命令。几秒后，你计算机上的输出应该类似于如下：\n\
  \n```json\n{\n    \"Labels\": [{\n        \"Name\": \"Building\",\n        \"Confidence\"\
  : 99.22096252441406,\n        \"Instances\": [],\n        \"Parents\": []\n    \
  \    }],\n    \"LabelModelVersion\": \"2.0\"\n}\n```\n\n如果没有找到任何标签，`DetectLabels`\
  \ 操作将返回一个带有空 `Labels` 数组的 JSON 对象。\n\n## 使用 AWS 使用 Rekognition\n\n在本章之前的节中，你已经学习了如何通过控制台和命令行使用\
  \ Rekognition。虽然交互式使用这些 API 可行，但你无法这种方式将其集成到自己的项目中。\n\n在真实项目中集成 Rekognition，你可能会选择以下方法之一：\n\
  \n*   使用特定语言的 AWS SDK 直接从代码调用 Rekognition API。\n*   创建一个 AWS Lambda 函数，在触发时调用 Rekognition\
  \ API。\n\n在本节中，你将创建一个 Amazon DynamoDB 表和一个 AWS Lambda 函数，当图像上传到 Amazon S3 存储桶时触发该函数。触发后，AWS\
  \ Lambda 函数将从 S3 存储桶读取图像，并使用 Rekognition API 提取检测到的对象列表。然后将这些对象的名称同文件名一起写入 Amazon\
  \ DynamoDB 表。该 Amazon DynamoDB 表将作为内容索引，供应用程序搜索包含特定对象的图像。\n\n在现实情况下，可能还有其他事件可以用于触发\
  \ AWS Lambda 函数，例如 API Gateway 接收到的 HTTP 请求。本文未涵盖上述场景中触发 AWS Lambda 函数的情况。\n\n*\
  \   **注意**：为了跟随本节操作，请确保你已创建附录 B 中列出的 S3 存储桶。\n\n    你可以从 `www.wiley.com/go/machinelearningawscloud`\
  \ 下载本章的代码文件，或者通过 GitHub 使用以下 URL：`https://github.com/asmtechnology/awsmlbook-chapter18.git`\n\
  \n### 创建 Amazon DynamoDB 表\n\n\n\n\n要开始操作，请使用适用于开发 IAM 用户账户的专用登录链接登录 AWS 管理控制台，并使用区域选择器选择可用\
  \ Amazon Rekognition 服务的区域。本节中的截图假设控制台已连接到欧盟（爱尔兰）区域。点击“服务”（Services）菜单并访问 Amazon\
  \ DynamoDB 服务主页（图 18.5）。\n\n![FIGURE 18.5 访问 Amazon DynamoDB 管理控制台](img/c18f005.png)\n\
  \n`FIGURE 18.5` 访问 Amazon DynamoDB 管理控制台\n\n确保 Amazon DynamoDB 控制台设置为与包含您的 Amazon\
  \ S3 存储桶相同的区域工作。创建一个名为 `imageindex` 的新表，包含一个名为 `label` 的分区键属性和一个名为 `filename` 的排序键属性（参见图\
  \ 18.6）。如果您从未用过 Amazon DynamoDB，或者需要复习相关概念，请在继续本节之前参考第 11 章。\n\n![FIGURE 18.6 Amazon\
  \ DynamoDB 表名和主键属性](img/c18f006.png)\n\n`FIGURE 18.6` Amazon DynamoDB 表名和主键属性\n\n\
  取消勾选页面上的“使用默认设置”（Use Default Settings）选项并向下滚动找到“读取/写入容量模式”（Read/Write Capacity Mode）部分（图\
  \ 18.7）。确保表设置为使用预留容量单元，并取消勾选读取和写入容量单元的自动伸缩选项。\n\n![FIGURE 18.7 Amazon DynamoDB 表读取/写入容量模式部分](img/c18f007.png)\n\
  \n`FIGURE 18.7` Amazon DynamoDB 表读取/写入容量模式部分\n\n点击页面底部的“创建表”（Create Table）按钮以完成表的创建。您应该可以在\
  \ Amazon DynamoDB 管理控制台中看到与现有表一起列出的新表（图 18.8）。\n\n![FIGURE 18.8 显示表列表的 Amazon DynamoDB\
  \ 管理控制台](img/c18f008.png)\n\n`FIGURE 18.8` 显示表列表的 Amazon DynamoDB 管理控制台\n\n### 创建\
  \ AWS Lambda 函数\n\n点击“服务”（Services）菜单并访问 AWS Lambda 服务主页。确保管理控制台配置为与创建 Amazon S3\
  \ 存储桶和 Amazon DynamoDB 表相同的区域。点击“创建函数”（Create function）按钮开始创建新 AWS Lambda 函数的过程。如果您是\
  \ AWS Lambda 的初学者，或者想要复习技能，请在继续本节其余部分之前参考第 12 章。\n\n点击“创建函数”按钮后，系统将要求您为函数选择模板（图\
  \ 18.9）。选择“从头创建”（Author From Scratch）选项。\n\n![FIGURE 18.9 从头开始创建 AWS Lambda 函数](img/c18f009.png)\n\
  \n`FIGURE 18.9` 从头开始创建 AWS Lambda 函数\n\n将函数命名为 `DetectLabels`，使用运行时（Runtime）下拉菜单选择\
  \ Python 3.6 运行时，并在执行角色（Execution Role）下拉菜单中选择“带有基本 Lambda 权限的新角色”（Create A New\
  \ Role With Basic Lambda Permissions）[图 18.10）。\n\n![FIGURE 18.10 Lambda 函数名称和运行时设置](img/c18f010.png)\n\
  \n`FIGURE 18.10` Lambda 函数名称和运行时设置\n\nAWS 将为您的函数创建一个新的 IAM 角色，该角色具有一组极少权限，允许您的函数向\
  \ AWS CloudWatch 写入日志。此 IAM 角色的名称显示在图 18.10 的执行角色下拉菜单下方，类似于 `DetectLabels-role-xxxxx`。记下此名称，因为您将需要修改该角色以访问\
  \ Amazon S3、Amazon DynamoDB 和 Amazon Rekognition。点击页面底部的“创建函数”按钮以创建 AWS Lambda 函数和\
  \ IAM 角色。\n\n创建 AWS Lambda 函数后，使用服务菜单切换到 IAM 管理控制台，并导航到创建 Lambda 函数时刚为您创建的新 IAM\
  \ 角色。找到与角色关联的权限策略文档并点击“编辑策略”（Edit Policy）按钮（图 18.11）。\n\n![FIGURE 18.11 查看由 AWS\
  \ Lambda 创建的 IAM 角色的默认策略文档](img/c18f011.png)\n\n`FIGURE 18.11` 查看由 AWS Lambda 创建的\
  \ IAM 角色的默认策略文档\n\n您将进入策略编辑器。点击 JSON 选项卡以 JSON 文件的格式查看策略（图 18.12）。\n\n向 `Statement`\
  \ 数组添加以下对象：\n\n```json\n{\n    \"Version\": \"2012-10-17\",\n    \"Statement\":\
  \ [\n        {\n            \"Effect\": \"Allow\",\n            \"Action\": \"logs:CreateGroup\"\
  ,\n            \"Resource\": \"arn:aws:logs:eu-west-1:xxxxxxxxxxxx:*\"\n       \
  \ },\n        {\n            \"Effect\": \"Allow\",\n            \"Action\": [\n\
  \                \"logs:CreateStream\",\n                \"logs:PutEvents\"\n  \
  \          ],\n            \"Resource\": [\n                \"arn:aws:logs:eu-west-1:xxxxxxxxxx:log-group:/aws/lambda/DetectLabels:*\"\
  \n            ]\n        },         \n        {\n            \"Action\": [\n   \
  \             \"rekognition:DetectLabels\"\n            ],\n            \"Effect\"\
  : \"Allow\",\n            \"Resource\": \"*\"\n        },\n        {\n         \
  \   \"Action\": [\n                \"s3:GetObject\"\n            ],\n          \
  \  \"Effect\": \"Allow\",\n            \"Resource\": \"arn:aws:s3::*\"\n       \
  \ },\n        {\n             \"Effect\": \"Allow\",\n            \"Action\": [\n\
  \                \"dynamodb:PutItem\",\n                \"dynamodb:GetItem\",\n\
  \                \"dynamodb:Query\",\n                \"dynamodb:UpdateItem\"\n\
  \            ],\n            \"Resource\": \"*\"\n        }\n    ]\n}\n```\n\n此策略允许\
  \ AWS Lambda 向 CloudWatch 写入日志、调用 Amazon Rekognition DetectLabels API、从任何 Amazon\
  \ S3 存储桶读取对象、向任何 Amazon DynamoDB 表读写项并在任何 Amazon DynamoDB 表上执行查询。\n\n您可以在 `rekognition:DetectLabels`\
  \ 之后添加相关操作以允许额外的 Amazon Rekognition API。您可以在 `https://docs.aws.amazon.com/rekognition/latest/dg/api-permissions-reference.html`\
  \ 获取可用于策略文档的 Amazon Rekognition 操作列表。\n\n点击页面底部的“查看策略”（Review Policy）按钮进入查看策略屏幕（图\
  \ 18.13）。\n\n![FIGURE 18.13 查看策略屏幕](img/c18f013.png)\n\n`FIGURE 18.13` 查看策略屏幕\n\n\
  点击“保存更改”（Save Changes）按钮以完成 IAM 策略更新。保存策略更改后，使用服务菜单切换回 AWS Lambda 管理控制台并导航到 `DetectLabels`\
  \ Lambda 函数。\n\n\n\n\n找到页面上的函数设计器部分，并将 Amazon S3 触发器添加到函数中。函数设计器的外观应类似于图 18.14，并应该列出\
  \ Amazon CloudWatch Logs、Amazon S3、Amazon DynamoDB 和 Amazon Rekognition 作为该函数可以访问的资源。\n\
  \n![图 18.14 AWS Lambda 函数设计器](img/c18f014.png)\n\n图 18.14 AWS Lambda 函数设计器\n\n向下滚动到“配置触发器”（Configure\
  \ Triggers）部分，并选择一个 Amazon S3 桶作为事件源。在本例中，源桶名为 `awsml-rekognition-awslambda-source`。确保“事件类型”（Event\
  \ Type）已设置为“对象创建（全部）”（Object Created (All)），并点击“添加”（Add）按钮完成 S3 事件触发器的配置（图 18.15）。\n\
  \n![图 18.15 配置 S3 事件触发器](img/c18f015.png)\n\n图 18.15 配置 S3 事件触发器\n\n点击页面顶部的“保存”（Save）按钮以保存你的更改。通过创建触发器，你设置了\
  \ Lambda 函数，每当有新文件上传到源 S3 桶时就会执行一次。\n\n要更新 Lambda 函数代码，向下滚动到函数设计器并点击函数名称显示代码编辑器（图\
  \ 18.16）。\n\n![图 18.16 配置 AWS Lambda 函数代码](img/c18f016.png)\n\n图 18.16 配置 AWS Lambda\
  \ 函数代码\n\n将代码编辑器中的模板代码替换为列表 18.1 中的内容。\n\n点击函数编辑器下方的“保存”按钮完成 Lambda 函数的创建。要测试此函数，使用“服务”（Services）下拉菜单切换到\
  \ Amazon S3，并导航到你与 AWS Lambda 函数触发器关联的桶。向桶中上传一个图像文件。上传图像到 Amazon S3 后，切换到 Amazon\
  \ DynamoDB 管理控制台并检查 `imageindex` 表的内容。你应该能在表中看到，Amazon Rekognition 检测到的每个标签在表中都对应一个新项（图\
  \ 18.17）。\n\n![图 18.17 检查 AWS Lambda 函数的结果](img/c18f017.png)\n\n图 18.17 检查 AWS Lambda\
  \ 函数的结果\n\n如果你向 S3 桶上传了几张图片，很快 Amazon DynamoDB 表中就会出现若干行。然后你可以对该表执行查询，以检索所有包含特定对象的图像（参见图\
  \ 18.18）。\n\n![图 18.18 查询 Amazon DynamoDB 表将允许你根据内容搜索图像](img/c18f018.png)\n\n图 18.18\
  \ 查询 Amazon DynamoDB 表将允许你根据内容搜索图像。\n\n输出桶已硬编码在列表 18 中。\n\n- 事件类型：对象创建（全部）\n- 源桶：`awsml-rekognition-awslambda-source`\n\
  - 表名：`imageindex`\n\n\n\n\n\n全新的 Anaconda 安装程序会带有一个名为 `base (root)` 的单一 conda Python\
  \ 环境，其中包含了一组预安装的包。在本节中，你将创建一个新的 conda Python 环境，并安装书中示例中所使用的系列包。conda Python 环境是一个隔离环境，允许你在不修改系统\
  \ Python 安装程序的情况下安装包。\n\nPython 官方认可的包管理器器称为 `PiP`（Pip Installs Packages），它从一个名为\
  \ Python Package Index（`PyPI`）的在线存储库中获取包。`Conda` 是一种与语言无关的包管理器，用于在 conda 环境中安装包。这是一个重要的区别——`conda`\
  \ 无法帮助你在系统 Python 安装程序中安装包。\n\nAnaconda Navigator 包含的许多工具（例如 `Jupyter Notebook`\
  \ 和 `Spyder IDE`）会识别你电脑上可用的 conda 环境，并允许你以极小的开销在不同环境之间切换。\n\n要开始创建新环境，请启动 Anaconda\
  \ Navigator 并切换到用户界面的 Environments（Environments）部分（图 A.6）。\n\n![图 A.6 Anaconda Navigator\
  \ 中的环境设置](img/bapp01f006.png)\n\n`图 A.6` Anaconda Navigator 中的环境设置\n\n你将看到 Anaconda\
  \ 安装程序创建的 `base (root)` 环境以及该环境中包含的所有包。点击 Create（创建）按钮创建一个新的 conda 环境。\n\n为新的 conda\
  \ 环境提供一个名称（图 A.7），并确保勾选了 Python 语言并将 Python 版本设置为 `3.7` 或更高。确保 R 语言复选框未勾选。书中的示例假设\
  \ conda 环境名为 `AWS_ML_Book`。不过，你可以使用自己的名称。在尝试书中的示例时，请记住选择相应的环境。点击 Create New Environment\
  \ 对框上的 Create 按钮完成环境创建。\n\n![图 A.7 创建新的 Conda Python 环境](img/bapp01f007.png)\n\n\
  `图 A.7` 创建新的 Conda Python 环境\n\n几分钟后，你的电脑上将创建一个新的 conda 环境，你将在 Anaconda Navigator\
  \ 中看到它的列表（图 A.8）。\n\n![图 A.8 切换到 AWS\\_ML\\_Book Conda 环境](img/bapp01f008.png)\n\
  \n`图 A.8` 切换到 AWS\\_ML\\_Book Conda 环境\n\n点击新环境将显示该环境中的包列表。默认情况下，所有新的 conda 环境都以最少的包集创建。\n\
  \n## 安装 Python 包\n\n在本节中，你将在新的 conda 环境中安装多个 Python 包。开始之前，确保在 Anaconda Navigator\
  \ 应用程序中已选择了你的 conda 环境。在包类型组合框中选择 All（全部）选项（图 A.9）。\n\n![图 A.9 显示所有可用的 Python 包](img/bapp01f009.png)\n\
  \n`图 A.9` 显示所有可用的 Python 包\n\n使用搜索文本框搜索 `Pandas` 包。在搜索结果中找到 `Pandas` 包，选中它并点击 Apply（应用）按钮（图\
  \ A.10）。\n\n![图 A.10 搜索包](img/bapp01f010.png)\n\n`图 A.10` 搜索包\n\nAnaconda Navigator\
  \ 将弹出一个对话框，列出 `Pandas` 包和所有将安装的依赖项（图 A.11）。点击 Apply 按钮完成 `Pandas` 包及其依赖项的安装。\n\n\
  ![图 A.11 包依赖项对话框](img/bapp01f011.png)\n\n`图 A.11` 包依赖项对话框\n\n使用相同的技术安装以下附加包及其各自的依赖项：\n\
  \n*   `matplotlib`\n*   `pillow`\n*   `scikit-learn`\n*   `tensorflow`\n*   `seaborn`\n\
  *   `graphviz`\n*   `pydotplus`\n*   `python-graphviz`\n\n*   **注意** 如果你的电脑配有 Nvidia\
  \ GPU，你可以选择安装 GPU 加速版本的 TensorFlow，即 `TensorFlow-GPU`。\n\n## 安装 Jupyter Notebook\n\
  \n在本节中，你将在本附录之前创建的 conda 环境中安装 `Jupyter Notebook`。启动 Anaconda Navigator 并切换到 Home（首页）标签。找到\
  \ `Jupyter Notebook` 图标并点击 Install（安装）按钮（图 A.12）。此操作将 `Jupyter Notebook` 安装在默认的\
  \ `base (root)` 环境中。\n\n![图 A.12 安装 Jupyter Notebook](img/bapp01f012.png)\n\n`图\
  \ A.12` 安装 Jupyter Notebook\n\n在 `Jupyter Notebook` 安装完成后，在 Mac 上打开终端（或 Windows\
  \ 上打开命令提示符），输入以下命令列出电脑上的所有 conda 环境。输入命令后按回车：\n\n```\n$ conda info --envs\n```\n\
  \n你的电脑输出应如下：\n\n```\n$ conda info --envs\n## conda environments:\nbase         \
  \         *  /anaconda3\nAWS_ML_Book              /anaconda3/envs/AWS_ML_Book\n\
  ```\n\n以下命令切换到你创建的环境。将 `AWS_ML_Book` 替换为你的名称。输入命令后按回车：\n\n```\n$ conda activate\
  \ AWS_ML_Book\n```\n\n输入以下命令在你刚刚激活的环境中安装 Jupyter Notebook：\n\n```\n$ conda install\
  \ jupyter\n```\n\n你的电脑输出应如下：\n\n```\n$ conda install jupyter\nSolving environment:\
  \ done\n\n## Plan ## \n  environment location: /anaconda3/envs/AWS_ML_Book\n  added\
  \ / updated specs:\n    - jupyter\n \nThe following packages will be downloaded:\n\
  \ \n    package                    |build\n    ---------------------------|----------------\n\
  \    widgetsnbextension: 3.4.2   |py36_0         1.7 MB\n    ipywidgets: 7.4.2 \
  \          |py36_0         151 KB\n    qtconsole:          4.4            |py36_0\
  \         157 KB\n    pyqt:               5.9.2                 |py36h65552a_2 \
  \        4. MB MB\n    jupyter:            ..0.0              |336_76 KB\n\nsip::4.19.88|py36h0a446_0\
  \         255 KB\n    jupyter_console::6...0              |py36_0          35 KB\n\
  \    --------------------------------\n\n            Total:         6.7 MB\n \n\
  The following NEW packages will be INSTALLED:\n \n    dbus:               1.13.2-h760590_1\
  \    \n    expat:              2.2.6-h0a4426_0     \n    gettext:            0.19.8.1-h15daf44_3\n\
  \    glib:               2.56.2-hd9629dc:0\n    icu:                58.2-h4b95b61_1\
  \      \n    libiconv:           1.15-hdd342a3_7      \n    pcre:              \
  \ 8.42-h378b8a2_0\n \nProceed ([y]/n)?\n```\n\n你将看到将在环境中安装的包的摘要，并询问你是否继续。在键盘上按下\
  \ Y 键然后按回车继续。\n\n\n\n\n\n当 Jupyter Notebook 在新的 conda 环境中安装完成后，输入以下命令在 Jupyter Notebook\
  \ 中创建一个新的内核规范（kernel specification）。内核规范将允许你从 Jupyter Notebook 内部切换到你的新 conda 环境。将\
  \ `AWS_ML_BOOK` 替换为你的环境名称。输入命令后按回车键：\n\n```\n$ python -m ipykernel install --user\
  \ --name AWS_ML_BOOK --display-name \"Python (AWS_ML_BOOK)\"\n```\n\n你应该会在你的电脑上看到一条消息，确认内核规范已安装：\n\
  \n```\nInstalled kernelspec AWS_ML_BOOK in /Users/abhishekmishra/Library/Jupyter/kernels/aws_ml_book\n\
  ```\n\n输入以下命令命令从 `conda-forge` 仓库（也称为通道）安装 `nb-conda-kernels` 包。输入命令后按回车键：\n\n```\n\
  $ conda install --channel=conda-forge nb_conda_kernels\n```\n\n你将再次被要求确认是否想要下载并安装带有依赖项的\
  \ `nb_conda_kernels` 包。在提示完成包的安装时，按下键盘上的 `Y` 键。\n\n现在，你可以使用 Anaconda Navigator 启动\
  \ Jupyter Notebook。笔记本将在你的默认 Web 浏览器中启动，并配置为显示你的用户目录内容（图 A.13）。\n\n![图 A.13 在网页浏览器中运行的\
  \ Jupyter Notebook](img/bapp01f013.png)\n\n图 A.13 在网页浏览器中运行的 Jupyter Notebook\n\n\
  点击浏览器中 Jupyter Notebook 页面上的 `New` 按钮将显示下拉菜单，允许你使用计算机上安装的内核之一创建新笔记本。你在本章之前创建的新的\
  \ conda 环境对应的内核应该列在下拉列表中。\n\n你也可以通过命令行启动 Jupyter Notebook，只需在 `Terminal`（或命令提示符）窗口中输入以下命令并按回车：\n\
  \n```\n$ jupyter notebook\n```\n\n# 总结\n\n- `Anaconda` 是一个 Python 发版（预构建和预配置的包集合），通常用于数据科学。Anaconda\
  \ 发版包含预配置的 Python 包和其他工具外，还包含了 `conda` 包管理器。\n- `Anaconda Navigator` 是包含在 Anaconda\
  \ 发版中的 GUI 工具，可以方便地配置、安装和启动如 Jupyter Notebook 等工具。\n- `conda` Python 环境是一个隔离环境，允许你在不修改系统\
  \ Python 安装的情况下安装包。\n\n# 附录 B：使用本书所需的 AWS 资源\n\n本附录列出了你需要在自己的账户下设置的 AWS 资源列表，以便能够充分利用本书的内容。\n\
  \n## 为开发创建 IAM 用户\n\n在本节中，你将为开发任务创建一个 IAM 用户。该用户将将拥有某些策略，允许访问你资源上广泛范围的任务。例如，在生产场景中，你将不会使用提供访问所有\
  \ `Amazon S3` 资源权限或允许在每个 `Amazon DynamoDB` 表上执行所有操作的策略。然而，当你开发解决方案时，可以使用特殊的开发用户，然后在接近测试和发布时创建具有限制性策略的生产用户。\n\
  \n要开始操作，请使用具有管理权限的 `IAM` 用户或你的根账户登录 `IAM` 管理控制台。点击 `IAM` 仪表板中的 `Users` 链接加载用户管理页面。点击\
  \ `Add User` 按钮开始在你的根账户下创建用户的过程（参见 图 B.1）。\n\n![图 B.1 创建 IAM 用户](img/bapp02f001.png)\n\
  \n图 B.1 创建 IAM 用户\n\n指定一个 `username` 并确保你同时拥有 `Programmatic Access`（编程访问）和 `AWS\
  \ Console Access`（AWS 控制台访问）（参见 图 B.2）。\n\n![图 B.2 用户详情屏幕](img/bapp02f002.png)\n\
  \n图 B.2 用户详情屏幕\n\n提供一个自定义密码，该密码将在 `IAM` 用户登录管理控制台时使用，并确保 `Require Password`（需要密码）复选框已启用。\n\
  \n一旦你指定了 `username` 和访问类型，系统将要求你为用户配置权限。确保选中标记为 `Add User Group` 的选项并点击 `Create\
  \ Group` 按钮（参见 图 B.3）。\n\n![图 B.3 为 IAM 用户创建新组](img/bapp02f003.png)\n\n图 B.3 为 IAM\
  \ 用户创建新组\n\n将新组命名为 `MLDevelopers` 并向该组添加以下策略：\n- `AmazonLearningFullAccess`\n- `AmazonSageMakerFullAccess`\n\
  - `ComprehendFullAccess`\n- `AmazonS3FullAccess`\n- `AmazonDynamoDBFullAccess`\n\
  - `AWSLambdaFullAccess`\n- `AmazonLexFullAccess`\n- `AmazonRekognitionFullAccess`\n\
  \n点击 `Create Group` 按钮完成组的创建。点击 `Create Group` 后，你将返回上一个屏幕并看到你的新组（参见 图 B.4）。确保新用户已添加到\
  \ `MLDevelopers` 组。\n\n![图 B.4 将 IAM 用户添加到 MLDevelopers](img/bapp02f004.png)\n\n\
  图 B.4 将 IAM 用户添加到 MLDevelopers\n\n点击 `Next` 按钮显示审核屏幕，并在审核屏幕上点击 `Create User` 按钮完成用户创建。你将看到类似\
  \ 图 B.5 的确认屏幕，其中包含新创建的用户。\n\n![图 B.5 用户确认屏幕](img/bapp02f005.png)\n\n图 B.5 用户确认屏幕\n\
  \n使用 `Download .csv` 按钮下载用户的完整凭据，并点击 `Close` 按钮返回 IAM 屏幕。\n\n## 创建 S3 桶\n\n在本节中，你将使用\
  \ AWS 管理控制台创建书中其他章节将使用的 S3 桶。使用你专用的 `IAM` 用户登录控制台，并导航到 `S3` 服务主页（参见 图 B.6）。\n\n\
  ![图 B.6 访问 S3 管理控制台](img/bapp02f006.png)\n\n图 B.6 访问 S3 管理控制台\n\n回 第 9 章，`S3` 服务在所有区域可用，因此你不需要在管理控制台中选择区域。相反，桶是特定区域的，你需要选择要创建桶的区域。\n\
  \n在你选择的区域创建以下桶。书中的所有示例都使用 `EU (Ireland)` 区域。如果你决定选择另一个区域，请记住某些 `AWS` 服务可能在你选择的区域不可用。\n\
  \n- `awsml-comprehend-entitydetection-result`\n- `awsml-comprehend-entitydetection-source`\n\
  - `awsml-rekognition-awscli-source`\n- `awsml-rekognition-awslambda-source`\n\n\
  你为桶选择的名称必须在全球范围内唯一的，使用反向域名作为前缀是确保唯一性的常用做法。在创建桶时使用适当的前缀。\n\n在现阶段，你不需要为这些任何一个桶配置版本控制、日志或成本分配标记（参见\
  \ 图 B.7）。在提示时，保持设置为为默认值。\n\n![图 B.7 配置版本控制、日志和成本分配标记](img/bapp02f007.png)\n\n图 B.7\
