  \ Jupyter Notebook 文件来创建一个训练任务了。在你的笔记本实例（notebook instance）上使用 `conda_python3` 内核创建一个新的\
  \ Jupyter Notebook 文件。将笔记本标题更改为 `sklearn-kmeans-iris-flowers`，并在空白笔记本单元格中输入以下代码：\n\
  \n```python\nimport sagemaker\n \n## 获取此 Notebook 实例使用的 SageMaker 兼容角色。\nrole =\
