  \n### 获取 Dataframe 信息\n\nPandas 提供了几个实用的函数来检查 `dataframe` 内容、获取 `dataframe` 的内存占用信息以及获取\
  \ `dataframe` 列的统计信息。这里列出了一些检查 `dataframe` 内容的常用函数：\n\n* `shape()`: 使用此函数查找 `dataframe`\
  \ 的行和列数。\n* `head(n)`: 使用此函数检查数据集的前 `n` 行。如果你不指定 `n` 的值，默认使用 5。\n* `tail(n)`: 使用此函数检查数据集的最后\
  \ `n` 行。如果你不指定 `n` 的值，默认使用 5。\n* `sample(n)`: 使用此函数检查数据中 `n` 行的随机样本。如果你不指定 `n` 的值，默认使用\
  \ 1。\n\n以下代码片段演示了 `shape()`、`head()`、`tail()` 和 `sample()` 函数的使用：\n\nPandas 提供了几个实用的函数来获取关于数据统计特征和内存占用的信息。获取统计信息的最常用函数包括：\n\
  \n* `describe()`: 提供所有数值列的非空计数、平均值、标准差、最小值、最大值和四位数的信息。\n* `mean()`: 提供每列的平均值。\n\
  * `median()`: 提供每列的中位数。\n* `std()`: 提供每列的标准差。\n* `count()`: 返回每列中非空值的数量。\n* `max()`:\
  \ 返回每列中的最大值。\n* `min()`: 返回每列中的最小值。\n\n以下片段演示了其中一些函数的使用：\n\n`info()` 函数提供了关于每列数据类型以及存储\
