  \n## 在专用训练实例上训练 Scikit-Learn 模型\n\n在本节中，你将从 notebook 实例使用 Python 的 AWS SageMaker\
  \ SDK 创建一个训练作业，该作业将创建一个专用训练实例并在实例上训练一个 Scikit-learn k-means 分类器。训练后的模型将存储在 Amazon\
  \ S3 桶中，之后你将使用 Amazon SageMaker Python SDK 提供的另一个函数将模型部署到专用的预测实例并创建预测端点。最后，你将使用\
  \ AWS SageMaker Python SDK 从你的 Jupyter Notebook 文件与此预测端点交互，对模型未见过的数据（测试集）进行预测。\n\
  \n专用训练实例是一个 EC2 实例，用于从 Amazon S3 桶中的数据训练模型，并将训练好的模型保存到另一个 Amazon S3 桶中。然而，与 notebook\
  \ 实例不同，专用训练实例没有 Jupyter Notebook 服务器，并且在训练过程完成后会自动终止。专用训练实例是根据 Docker 镜像创建的。对于内置机器学习算法，Amazon\
  \ SageMaker 将算法封装在 Docker 镜像中，这些镜像包含了训练机器学习模型所需的软件。输入和输出桶的位置，以及模型训练的任何超参数，通常在从镜像实例化\
  \ Docker 容器时作为命令行参数指定。\n\n除了用于内置算法的 Docker 镜像外，Amazon SageMaker 还提供了包含了 Scikit-learn、Google\
  \ TensorFlow 和 Apache MXNet 等标准机器学习库的 Docker 镜像。无论 Docker 镜像包含的是内置算法的实现还是通用机器学习库，Docker\
  \ 镜像本身都存储在每个 AWS 区域的 Docker 注册表中。在创建训练作业时，你需要提供 Docker 镜像的路径。你可以在每个支持的区域找到 Scikit-learn\
  \ Docker 镜像的 Docker 注册表路径：`https://docs.aws.amazon.com/sagemaker/latest/dg/pre-built-docker-containers-frameworks.html`。\n\
  \n专用的 EC2 训练实例一旦创建，将需要假设 IAM 角色，该角色允许运行在训练实例中的代码访问你 AWS 账户中的其他资源，例如包含训练数据的 Amazon\
  \ S3 桶。由于创建 notebook 实例时使用的 IAM 角色具有访问相关 AWS 资源的正确权限，最常见的方法是对 EC2 训练实例使用相同的 IAM\
  \ 角色。\n\n\n\n\n让我们简要查看一下此脚本的内容。当你使用 SageMaker Python SDK 创建训练作业时，你需要提供包含训练脚本的文件名，以及脚本所需的任何超参数。我们将构建的\
  \ k-means 模型将期望一个名为 `n_clusters` 的单一超参数，该参数将注入到 Scikit-learn `KMeans` 类的构造函数中。\n\
  \n当 EC2 实例启动时，你的脚本文件将作为一个与脚本文件名同名的 Python 模块被安装，并使用类似于下面的命令行语句进行执行：\n\n```\npython\
  \ -m <your_script> --<your_hyperparameters>\n```\n\n例如，如果使用之前列出的脚本文件创建了训练作业，并且 `n_clusters`\
  \ 超参数的值指定为 `3`，那么在训练实例上执行的以启动训练过程的命令行语句将是：\n\n```\npython -m sklearn-kmeans-training-script\
  \ --num_clusters=3\n```\n\n在你的脚本中，你将模型训练代码放置在 `if __name__ == '__main__':` 条件块中。将训练代码放在此\
  \ `if` 条件块中可以确保代码仅在模块作为主模块从命令行执行时运行运行，而不会在模块通过标准 Python `import` 语句导入到另一个 Python\
  \ 文件时运行。\n\n在模型训练代码中，你可以使用 `ArgumentParser` 对象来读取 Amazon SageMaker 传递给模块的任何命令行参数。你将在在本节之后创建的训练作业会将\
  \ k-means 聚类数量作为超参数传递。以下代码段演示了如何在你的脚本文件中读取命令行参数：\n\n```\nparser = argparse.ArgumentParser()\n\
  \ \n# 期望一个名为 n_clusters 的参数，如果缺少参数\n# 则应用默认值。\nparser.add_argument('--n_clusters',\
  \ type=int, default=3)\n \n## 解析参数\nargs = parser.parse_args()\n \n## 现在你可以使用 args.n_clusters\n\
  ## n_clusters 命令行参数\n```\n\n除了用于实例化 Scikit-learn 类的超参数外，你的脚本还需要一些 Amazon SageMaker\
  \ 特有的信息，例如训练数据集的位置以及训练模型保存的位置。你可以将这些信息作为额外的命令行参数传递给脚本，也可以在脚本内部从环境变量中读取部分信息。\n\n\
  当创建训练实例时，Amazon SageMaker 会自动设置多个环境变量，这些环境也可以在脚本中访问。如果你的脚本需要一个未提供命令行参数的 Amazon SageMaker\
  \ 特定运行时值，通常的做法是退回到使用环境变量作为默认值。训练实例中运行的脚本可用的环境变量完整列表可见 `https://github.com/aws/sagemaker-containers`。\n\
  \n你可能读取的最常见的环境变量有：\n\n* `SM_OUTPUT_DATADIR`: 训练实例内部的一个文件系统路径，你的脚本可以在其中存储创建机器学习模型所需的临时产物。该本地文件系统路径在后台被映射到\
  \ Amazon S3 存储桶，因此文件将被写入 Amazon S3 存储桶中。\n* `SM_MODEL_DIR`: 训练实例内部的一个文件系统路径，你的脚本将在这里存储训练好的模型。该本地文件系统路径在后台被映射到\
