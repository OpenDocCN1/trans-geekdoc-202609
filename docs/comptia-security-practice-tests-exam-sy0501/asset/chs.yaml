  \n### 58. **A.** 生物识别是指人的物理特征，如指纹、视网膜、手部几何和声音。\n\n* 选项 B 错误。感应卡是一种非接触式智能卡，持在电子阅读器附近以授予特定区域的访问权限。\n\
