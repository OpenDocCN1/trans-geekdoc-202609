  RSA 是一种非对称算法（也称为公钥加密），它使用公钥和私钥在传输过程中对数据进行加密解密。\n\n- 选项 A、B 和 C 均错误。`Twofish`、`3DES`\
  \ 和 `RC4` 是对称算法。对称算法也称为秘密密钥算法，使用相同的密钥对数据进行加密解密。\n\n### 30. A.\n静态静态数据的全盘加密有助于在存储设备被盗时保护非活动数据。小偷将无法读取这些数据。\n\
  \n- 选项 B 错误。实施 `biometrics`（生物识别）将控制进入该区域的人员。未经授权的用户可以尾随并获取存储设备并读取静态数据。\n- 选项 C\
