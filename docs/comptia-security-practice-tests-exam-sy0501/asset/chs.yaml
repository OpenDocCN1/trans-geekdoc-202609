  \n- 选项 A 错误。背景检查是在考虑雇用潜在员工时执行的过程。\n- 选项 B 错误。职位轮岗允许个人了解组织的不同部分及其运作方式。它还消除了在员工产生不满情绪并决定损害公司时，公司依赖某一个安全专业人士的需求。当多个员工都理解公司的安全态势时，从不满员工的攻击中恢复会更容易。\n\
  - 选项 D 错误。合谋（Collusion）是两个或多个双方之间的协议，旨在欺骗他人权利或获取法律禁止的物品。\n\n### 138. D. 安全是安全的一个共同目标，包括为人员和其他资产提供保护。\n\
  \n- 选项 A 错误。机密性（Confidentiality）允许授权用户访问敏感和受保护的数据。\n- 选项 B 错误。完整性（Integrity）确保数据未被篡改，并免受未经授权的修改。\n\
  - 选项 C 错误。可用性（Availability）意味着信息始终是用户可以访问的。\n\n### 139. D. Nessus 被认为是漏洞扫描器。它试图识别系统中的弱点。\n\
  \n- 选项 A、B、C 错误。这些工具用于破解密码。\n\n### 140. B. ALE（年度预期损失） = SLE（单次预期损失） × ARO（年度发生率）。SLE\
  \ 等于 $750,000（2,500 条记录 × $300），ARO 等于 5%，因此 $750,000 乘以 5% 等于 $37,500。\n\n- 选项\
  \ A、C、D 错误。根据 ALE 的计算，答案是 $37,500。\n\n### 141. C. 并行测试（Parallel test）可以测试某些系统以确认其在备用地的运行。将测试结果与原始系统的结果进行比较，以确认备用地尽可能接近正常。\n\
  \n- 选项 A 错误。切换测试（Cutover test）将关闭主系统，所有内容将切换到备份系统。\n- 选项 B 错误。演练测试（Walkthrough test）审阅计划以确认包含所有步骤。\n\
  - 选项 D 错误。模拟测试（Simulation test）对给定场景的灾难恢复计划进行演练。\n\n### 142. C. RPO（恢复点目标）规定了允许的数据丢失。它是在中断期间可以经过的时间，直到在此期间丢失的数据量超过业务连续性计划的最大接受阈值为止。\n\
  \n- 选项 A 错误。MTBF（平均故障间隔）是对设备或组件的额定，用于预测故障之间的预期时间。\n- 选项 B 错误。MTTR（平均修复时间）是故障设备或组件修复或更换的平均时间。\n\
  - 选项 D 错误。ARO（年度发生率）是预计在一年时间内发生威胁的概率比例。\n\n### 143. B. 纠正控制（Corrective control）旨在纠正局面。\n\
  \n- 选项 A 错误。检测控制（Detective controls）在入侵发生时检测并发现违规行为。\n- 选项 C 错误。预防控制（Preventive\
  \ control）用于在安全违规或关键服务中断发生之前避免它们。\n- 选项 D 错误。威慑控制（Deterrent control）用于威慑安全违规。\n\n\
  ### 144. A. 快照（Snapshot）是系统在特定时间点的状态。它也被称为系统映像，不是事件响应过程中的步骤。\n\n- 选项 B、C、D 错误。准备、恢复和遏制是事件响应过程的步骤。\n\
  \n### 145. B. 碎碎文件可以防止物理威胁，如文件被窃或从文件中获取信息。\n\n- 选项 A 错误。窥视偷视（Shoulder surfing）是使用直接观察技术（如从某人的肩膀后偷看）来获取信息。\n\
  - 选项 C 错误。广告软件（Adware）是通过程序用户界面上弹出的窗口或栏投放的广告。\n- 选项 D 错误。间谍软件（Spyware）是在终端用户不知情的情况下安装在系统上的软件，用于无害的原因。它有时被称为跟踪软件。\n\
  \n### 146. D. 数据保留策略（Data retention policy）规定了根据各种类型如何存储数据；例如存储位置、数据保留的时间以及应使用的存储媒介类型。\n\
  \n- 选项 A 错误。整洁桌面策略（Clean desk policy）确保所有敏感/机密文件在未使用时从终端用户工作站移除并锁好。\n- 选项 B 错误。可接受使用策略（Acceptable\
  \ use policy）描述了用户使用组织物理和知识产权资源的限制和指南。这包括允许或限制工作期间对个人电子邮件的使用。\n\n\n\n\n\n- 选项 C\
  \ 错误。安全策略定义了如何保护物理和信息技术资产。该文档应随着技术和员工需求的变化不断更新。\n\n### 147. C. 入职（Onboarding）是将员工添加到公司身份和访问管理系统的过程。\n\
  \n- 选项 A 错误。离职（Offboarding）是将员工从公司身份和访问管理系统中移除的过程。\n- 选项 B 错误。系统所有者是负责物理保护一个或多个系统的个人，可以包括对操作系统进行补丁和更新。\n\
  - 选项 D 错误。执行用户（Executive User）是根据最小权限策略分配给用户的一个组。\n\n### 148. A, C, and D. 正确答案是标准（standard）、程序（procedure）和指南（guideline）。**标准**定义了如何衡量对策略的遵循程度。**程序**包含了实施策略组件的逐步步进的指令说明。**指南**是关于如何满足策略标准的建议、推荐或最佳实践。\n\
  \n- 选项 B 错误。隐私政策（Privacy）是一项定义了向第三方披露公司信息标准的策略。\n\n### 149. A. 监管链（Chain of custody）是指按顺序记录的文档，显示物理或电子证据的保管、控制、传输、分析和处置。\n\
  \n- 选项 B 错误。易失顺序（Order of volatility）代表应收集证据的顺序。通常情况下，证据应该从最易失的开始收集，到最不易失的。易失意味着数据不是永久性的。\n\
  - 选项 C 错误。准备（Preparation）是应急响应过程的一个阶段，让公司团队准备好随时处理事件。\n- 选项 D 错误。消除（Eradication）是应急响应过程的一个阶段，通过重新对系统硬盘镜像并安装补丁来移除并恢复受影响的系统。\n\
  \n### 150. C and D. 正确答案是资产评估（asset estimation）和评估潜在威胁（rating potential threats）。定性风险分析衡量将阻碍正常业务运行的风险概率，并对其进行相对评级。受风险保护的资产必须分配价值，以确定风险缓解成本是否合理。\n\
  \n- 选项 A 和 B 错误。`ARO`（年发生率）和 `SLE`（单次损失预期）通过将 `ARO` 乘以 `SLE` 来计算 `ALE`（年度损失预期）。\n\
  \n# 第 6 章：密码学与 PKI\n\n### 1. A. 数字签名是单向哈希并使用私钥加密。公钥用于解密哈希并验证数字签名的完整性。数字签名支持不可否认性；即发送者无法否认发送过消息。\n\
  \n- 选项 B 错误。`TLS`（传输层安全）通过基于共享密钥的对称加密来创建安全连接。同一个密钥用于加密和解密数据。\n- 选项 C 错误。数字签名是用私钥创建的。\n\
  - 选项 D 错误。`TLS`通过基于共享密钥的对称加密来创建安全连接。同一个密钥用于加密和解密数据。\n\n### 2. D. 被吊的证书（revoked certificate）对于预期目的不再有效，需要生成新的密钥对和证书。\n\
  \n- 选项 A 错误。证书在过期日期后无法续签。\n- 选项 B 错误。自签名证书将在客户端网络浏览器中产生错误，不应作为替代品，因为自签名证书不是来自信任的证书颁发机构。\n\
  - 选项 C 错误。`密钥托管`（Key escrow）是一种加密密钥交换过程，密钥由第三方存储。如果原始用户的密钥丢失或泄露，可以使用存储的密钥来解密加密内容，允许将原始内容恢复到未加密状态。此场景并未说明密钥丢失了，而是证书已过期。\n\
  \n### 3. B. 数字签名是通过使用用户或计算机的私钥创建的，该私钥仅供该用户或计算机访问。不可否认性（Nonrepudiation）是确保某人无法否认某事的保证。\n\
  \n- 选项 A 错误。对称算法（也称为密钥算法）使用相同的密钥加密和解密数据。\n- 选项 C 错误。`CRL`（证书吊销列表）是在发证书颁发机构（`CA`）在计划过期日期之前吊销的数字证书列表，不应被信任。\n\
  - 选项 D 错误。非对称算法（也称为公钥加密）使用公钥和私钥来加密和解密数据。\n\n### 4. B. WiFi Alliance 是一个促进 WiFi 技术的营利组织，建议密码至少为八个字符，并包含大小写字母和符号的混合。\n\
  \n- 选项 A、C 和 D 错误。\n\n### 5. A. `CRL`（证书吊销列表）是在发证书颁发机构（`CA`）在计划过期日期之前吊销的数字证书列表，不应被信任。\n\
  \n- 选项 B 错误。`密钥托管`是一种加密密钥交换过程，密钥由第三方存储。如果原始用户的密钥丢失或泄露，可以使用存储的密钥来解密加密内容，允许将原始内容恢复到未加密状态。\n\
  - 选项 C 错误。不可否认性是一种通过数字签名保证双方之间消息传输的可靠性的方法。\n- 选项 D 错误。恢复代理（recovery agent）是允许在紧急情况下或特殊情况下解密其他用户数据的。\n\
  \n### 6. A and D. `DES` 和 `3DES` 是使用 64 位块大小的对称密钥块加密算法。\n\n- 选项 B 错误。`SHA` 是一种哈希算法，用于完整性。\n\
  - 选项 C 错误。`MD5` 是一种哈希算法，用于完整性。\n\n### 7. D. 你需要请求者（supplicant）。认证器（authenticator，即\
  \ AP 或无线控制器）在请求者和认证服务器之间发送认证消息。\n\n- 选项 A 错误。网络访问控制（`NAC`）通过限制不符合安全策略设备的访问来增加专有网络的安全性。\n\
  - 选项 B 错误。认证服务器是 `RADIUS` 服务器，负责验证想要连接网络的用户。\n- 选项 C 错误。认证器是使用 `RADIUS` 服务器配置的 `EAP`\
  \ 方法向 `RADIUS` 服务器认证的客户端。\n\n### 8. D. `ECC`（椭圆曲线密码）是一种非对称算法，使用较小的密钥，且与长密钥非对称算法具有相同的强度。\n\
  \n- 选项 A 错误。`Blowfish` 是一种对称算法，使用相同的密钥加密和解密数据。\n- 选项 B 错误。`RSA` 使用的密钥比 `ECC` 长。\n\
  - 选项 C 错误。`DHE` 使用的密钥比 `ECC` 长。\n\n### 9. B. 初始化向量（`IVs`）是随机值，配合算法确保加密过程中不会产生模式。`IV`\
  \ 与密钥配合使用并在发送到目的地时不加密。\n\n\n\n\n\n* 选项 C 错误。流加密器每次加密一个位的数据。此场景中未涉及该概念。\n* 选项 D 错误。块加密器每次加密一个数据块（或固定大小的块）数据。此场景中未涉及该概念。\n\
  \n## 10. **D. 开放无线网络不需要用户输入凭据即可访问。**\n\n* 选项 A 错误。`IV`（初始化向量）是一个任意数字，与密钥配合用于数据加密。\n\
  * 选项 B 错误。`WEP`（有线等效安全）是 `802.11b` 的安全标准。它旨在为无线局域网（WLAN）提供级别的安全性。\n* 选项 C 错误。`WPA`（无线保护访问）是取代并改进\
  \ `WEP` 的安全标准。\n\n## 11. **C. `RSA` 是一种非对称算法，应该停止使用。**\n\n* 选项 A、B 和 D 错误。`AES`、`RC4`\
  \ 和 `Twofish` 都是对称算法。\n\n## 12. **B. `OCSP`（在线证书状态协议）是一种用于向证书颁发机构查询给定证书的撤销状态的协议。它通过返回“良好”、“已撤销”和“未知”等响应来验证证书。**\n\
  \n* 选项 A 错误。`CRL`（证书撤销列表）是经颁发证书机构（CA）在计划到期日期之前撤销的数字证书列表，不应被信任。\n* 选项 C 错误。`RA`（注册机构）用于验证证书请求并将响应转发给\
  \ `CA`。\n* 选项 D 错误。`PKI`（公密钥基础设施）是包含硬件、软件、策略、程序和人的整个系统。`PKI` 创建、分发、管理、存储和撤销证书。`OCSP`\
  \ 是 `PKI` 的一部分。\n\n## 13. **B 和 D. `3DES` 和 `Blowfish` 是对称密钥块加密器。`3DES` 和 `Blowfish`\
  \ 使用 64 位的块大小。**\n\n* 选项 A 错误。`MD5` 是一种哈希算法，用于完整性校验。\n* 选项 C 错误。`RC4` 是一种流加密器，使用\
  \ 40 到 2048 位的密钥长度。\n\n## 14. **C. `DES`（数据加密标准）使用 56 位密钥，并被 `3DES` 取代。`DES` 被认为许多应用程序的安全保障。**\n\
  \n* 选项 A 错误。`Blowfish` 有 64 位的块大小和最高 448 位的变密钥长度。\n* 选项 B 错误。`AES`（高级加密标准）是一种更新且更强大的加密标准，能够使用\
  \ 128 位、192 位和 256 位密钥。\n* 选项 D 错误。`SHA` 是一种哈希算法。\n\n## 15. **B. `WEP` 使用 `RC4`\
  \ 加密协议并被认为是不安全的。**\n\n* 选项 A、C 和 D 错误。`WEP` 不使用 `RC4`。\n\n## 16. **A. `WPA2` 使用\
  \ `AES` 加密协议并被认为是安全的。**\n\n* 选项 B 错误。`WPA2` 使用 `AES` 并被认为是安全的。\n* 选项 C 错误。`WPA`\
  \ 使用 `RC4` 并被认为是不安全的。\n* 选项 D 错误。`WEP` 使用 `RC4` 并被认为是不安全的。\n\n## 17. **B. `WPA2-Enterprise`\
  \ 使用 `802.1X` 认证。**\n\n* 选项 A 错误。`WPA2-Personal` 使用预共享密钥 (`PSK`）。\n* 选项 C 错误。`WPA2-Personal`\
  \ 使用预共享密钥 (`PSK`）。\n* 选项 D 错误。`WEP` 使用 `RC4` 并被认为是不安全的。\n\n## 18. **A. `WPA2-Personal`\
  \ 使用预共享密钥 (`PSK`）访问网络。**\n\n* 选项 B 错误。`WPA2-Enterprise` 使用 `802.1X`。\n* 选项 C 错误。`WPA2-Personal`\
  \ 使用预共享密钥 (`PSK`）。\n* 选项 D 错误。`WEP` 使用 `RC4` 并被认为是不安全的。\n\n## 19. **B. `AES` 是一种对称密钥块加密器。**\n\
  \n* 选项 A 错误。`RSA` 是一种非对称算法。\n* 选项 C 错误。`MD5` 是一种哈希算法。\n* 选项 D 错误。`PBDF2` 是一种密钥扩展算法。\n\
  \n## 20. **B. `Twofish` 是一种对称密钥块加密器。**\n\n* 选项 A 错误。`RSA` 是一种非对称算法。\n* 选项 C 错误。`MD5`\
  \ 是一种哈希算法。\n* 选项 D 错误。`PBDF2` 是一种密钥扩展算法。\n\n## 21. **B. 在证书层次结构中，根 `CA` 认证中间 `CA`。**\n\
  \n* 选项 A 错误。`RA`（注册机构）用于验证证书请求。\n* 选项 C 错误。`CRL`（证书撤销列表）是经颁发证书机构（CA）撤销的数字证书列表。\n\
  * 选项 D 错误。`CSR`（证书签名请求）是申请者向 `CA` 提交的申请数字身份的请求。\n\n## 22. **B. `EAP-TLS` 是一种支持智能卡的远程认证协议。**\n\
  \n* 选项 A 错误。`PEAP` 是一种在认证服务器上使用证书的封装协议。\n* 选项 C 错误。`CHAP` 通过 PPP 服务器验证远程客户端的身份。\n\
  * 选项 D 错误。`MS-CHAP2` 是微软的 `CHAP` 版本，作为 `RADIUS` 的认证选项使用。\n\n## 23. **D. 数字签名使用只有该用户或计算机私有的私钥创建。不可否认性保证某人无法否认某事。**\n\
  \n* 选项 A 错误。`TKIP` 是一种封装现有 `WEP` 加密的包装器，并用于 `WPA`。\n* 选项 B 错误。中间证书权威位于根证书权威和终端实体之间。\n\
  * 选项 C 错误。公钥由证书颁发机构持有，任何人都可以它来加密数据或验证用户的数字签名。\n\n## 24. **D. `EAP-TTLS` 决定了第 2 阶段如何进行用户认证。用户认证可能是遗留协议，如\
  \ `PAP`、`CHAP`、`MS-CHAP` 或 `MS-CHAPV2`。**\n\n\n\n\n\n- 选项 A、B 和 C 均错误。`PEAP`、`EAP-FAST`\
  \ 和 `EAP-TLS` 创建一个 `TLS` 隧道来保护抑制器凭据，但不支持旧的认证协议。\n\n### 25. C 和 D.\nRSA 是一种非对称算法（也称为公钥加密），它使用公钥和私钥在传输过程中对数据进行加密解密。`ECC`（椭圆曲线密码学）基于椭圆曲线理论，利用曲线上的点来定义更高效的公钥和私钥。\n\
  \n- 选项 A 错误。`RC4`是一种对称算法，使用一个密钥对数据进行加密解密。\n- 选项 B 错误。`DES`是一种对称算法，使用一个密钥对数据进行加密解密。\n\
  \n### 26. A. Substitution `ROT13` 将字母替换为字母表中后面的第 13 个字母。\n\n- 选项 B 错误。`Transposition`（置换）通过特定方式重新排列明文来打乱数据。\n\
  - 选项 C 错误。`Diffusion`（扩散）是明文的变化，导致多个变化分散在整个密文中。\n- 选项 D 错误。`Confusion`（混淆）加密是一种利用明文和密钥之间复杂关系的方法，这种关系复杂到攻击者无法更改明文，也无法确定密钥。\n\
  \n### 27. C.\n使用非对称算法时，每个用户必须有一对密钥（私钥和公钥）。这两个密钥在数学上是相关的。如果使用一个密钥加密消息，则需要另一个密钥来解密该消息。确定所需密钥数量的公式为\
  \ `N` × 2，其中 `N` 是人数。\n\n- 选项 A 错误。这是对称密钥加密系统所需的密钥数量。每对交换数据的用户必须拥有两个相同的密钥实例。计算所需对称密钥数量的公式为：`N`\
