  \ team)\n\n### 109. 你的公司正在实施一项新的安全意识计划。你负责教育终端用户各种威胁，包括社会工程学。以下哪项是对社会工程学最准确的定义？\n\
  \n1. 非法复制软件\n2. 从丢弃的手册和打印输出中收集信息\n3. 利用人际技巧获取专有信息\n4. 钓鱼邮件\n\n### 110. 下列哪种攻击由于用户不注意周围物理环境而引起？\n\
  \n1. ARP 毒化\n2. 钓鱼\n3. 窥窥窥 (Shoulder surfing)\n4. Smurf 攻击\n\n### 111. Francine\
