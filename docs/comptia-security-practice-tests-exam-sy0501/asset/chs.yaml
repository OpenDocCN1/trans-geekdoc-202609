  4. 距离卡 (Proximity card)\n\n## 83. 您是公司 Microsoft 网络的网络管理员。CISO 正在规划网络安全，并希望有一种能够验证所有登录用户的安全协议。以下哪些认证协议是最佳选择？\n\
