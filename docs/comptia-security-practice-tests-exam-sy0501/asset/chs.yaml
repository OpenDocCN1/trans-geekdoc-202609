  - Option D 错误。差异站点（differential site）不是一个有效术语。\n\n### 79. **D.** 系统应在四小时内恢复，数据丢失至少为一天。`RTO`（恢复时间目标）是在灾难发生后必须恢复流程以满足业务连续性所需的时间。它定义了在收到流程中断通知后恢复所需的时间。`RPO`（恢复点目标）规定了允许的数据丢失。它是指中断期间允许通过的时间，在此期间丢失的数据量超过了业务连续性计划的最大可阈值。\n\
