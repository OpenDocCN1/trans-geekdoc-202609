  \ * BYOD（自带设备）\n        * COPE（公司所有个人使用）\n        * CYOD（选择自带设备）\n        * 公司所有\n\
  \        * VDI（虚拟桌面）\n\n* `![images](img/correction.png) 2.5 给定场景，实施安全协议。`\n\n \
  \   * 协议\n        * DNSSEC\n        * SSH\n        * S/MIME\n        * SRTP\n  \
  \      * LDAPS\n        * FTPS\n        * SFTP\n        * SNMPv3\n        * SSL/TLS\n\
  \        * HTTPS\n        * 安全 POP/IMAP\n\n    * 用场景\n        * 语音和视频\n        *\
  \ 时间同步\n        * 电子邮件和网页\n        * 文件传输\n        * 目录服务\n        * 远程访问\n    \
  \    * 域名解析\n        * 路由和交换\n        * IP 地址分配\n        * 服务订阅\n\n1. John 正在为一家小公司寻找新的防火墙。他担心\
  \ DoS 攻击，特别是 SYN 洪水攻击。哪种类型的防火墙对 SYN 洪水攻击提供最好的保护？\n\n    1. 包过滤器\n    2. 应用网关\n \
  \   3. 堡垒机\n    4. SPI\n\n2. 你负责一家保险公司的网络安全。许多员工自带设备，你对这表示安全担忧。你决定实施一种流程：当用户连接到你的网络时，会对他们的设备进行扫描。如果设备不符合你的最低安全要求，则不允许连接。哪项最能描述这种情况？\n\
  \n    1. NAC\n    2. SPI\n    3. IDS\n    4. BYOD\n\n\n\n\n\n### 3. Ahmed 负责公司的\
  \ VPN 连接。他的公司专门使用 `IPSec`。他决定实施 `IPSec` 模式，该模式仅加密数据包的内容而不加密报头。这称为什么什么？\n\n1. 隧道\n\
  2. `IKE`\n3. `ESP`\n4. 传输\n\n### 4. Maria 负责监控公司网络上的 `IDS` 活动。在过去的一个月里，`IDS` 报告了两次活动，调查显示这些是合法流量。哪项最能描述这种现象？\n\
  \n1. 漏报（False negative）\n2. 被动（Passive）\n3. 主动（Active）\n4. 误报（False positive）\n\n\
  ### 5. Juanita 是某大型大学的网络管理员。该大学有许多系统，每个系统都有她必须监控和分析的日志。从中央服务器查看和分析日志的最佳方法是什么？\n\n\
  1. `NAC`\n2. 端口转发\n3. `IDS`\n4. `SIEM`\n\n### 6. Enrique 负责公司的 Web 应用安全。他担心 SQL\
  \ 注入等攻击。以下哪个设备能为他的 Web 应用服务器提供 Web 攻击的最佳保护？\n\n1. `ACL`\n2. `SPI`\n3. `WAF`\n4.\
  \ `IDS`\n\n### 7. ACME 公司有几个远程办公室。CIO 想要在远程办公室和总部之间建立永久的安全连接。对此问题的最佳解决方案是什么？\n\n\
  1. `L2TP VPN`\n2. `IPSEC VPN`\n3. 站点到 VPN（Site-to-site VPN）\n4. 远程访问 VPN（Remote-access\
  \ VPN）\n\n### 8. Mary 负责一家中型保险的网络安全。她担心办公室对公共流量过于开放，有人可能只需将笔记本电脑连接到开放的 `RJ45` 口即可访问网络。以下哪项最能解决这一担忧？\n\
  \n1. `ACL`\n2. `IDS`\n3. `VLAN`\n4. 端口安全\n\n### 9. 你是某电子商务公司的网络管理员。你负责 Web 服务器集群。你不仅担心故障转移，还担心如何使用集群中的所有服务器来实现负载均衡。你应该实施哪种方案？\n\
  \n1. 主主模式（Active-active）\n2. 主备模式（Active-passive）\n3. 亲和性（Affinity）\n4. 轮询（Round-robin）\n\
  \n### 10. Donald 担任网络管理员。他负责数据库集群。集群通过将每个新连接发送到下一个服务器来实现负载均衡。这是哪种负载均衡？\n\n1. 轮询（Round-robin）\n\
  2. 亲和性（Affinity）\n3. 加权（Weighted）\n4. 旋转（Rotating）\n\n### 11. Gerald 正在他的公司设置新的无线接入点。这些接入点只有无线收发器，没有额外功能。哪项最能描述这些接入点？\n\
  \n1. 胖（Fat）\n2. 中继器（Repeater）\n3. 厚（Thick）\n4. 瘦（Thin）\n\n### 12. Mohaned 是某酒店的\
  \ IT 经理。他想在每层放置无线接入点。规范要求接入点应具有最小的功能，配置和其他功能均由中央控制。Mohaned 应该考虑购买哪种接入点？\n\n1. 胖（Fat）\n\
  2. 基于控制器的（Controller-based）\n3. 独立式（Stand-alone）\n4. `801.11i`\n\n### 13. 哪种 `IPSec`\
  \ 协议提供认证和加密？\n\n1. `AH`\n2. `ESP`\n3. `IKE`\n4. `ISAKMP`\n\n### 14. Terrance 正在实施\
  \ `IPSec`。他想确保数据包是加密的，并且报头经过认证。他应该实施什么？\n\n1. `AH`\n2. `ESP`\n3. `AH` 和 `ESP`\n\
  4. `IKE`\n\n### 15. 你负责公司的安全。管理层最大的担忧之一是员工可能会泄露数据。你应该首先实施哪项？\n\n1. `IPS`\n2. 对用户进行常规审计\n\
  3. `VLAN`\n4. USB 禁用\n\n### 16. 你负责公司的邮件服务器安全。你想要使用第三方证书对所有邮件进行加密。应该实施哪种协议？\n\n\
  1. `IMAP`\n2. `S/MIME`\n3. `PGP`\n4. `SMTP`\n\n### 17. Joanne 负责网络管理。她想确保通信是加密的。她目前正在使用\
  \ `SNMP` 命令。她应该使用哪种协议？\n\n1. `HTTPS`\n2. `RDP`\n3. `Telnet`\n4. `SSH`\n\n### 18.\
  \ 你正在使用 `SNMP` v2。同事建议你升级到 `SNMP` v3。`SNMP` 的主要优势是什么？\n\n1. 它更快。\n2. 它与 `SIEM` 集成。\n\
  3. 它使用 `CHAP`。\n4. 它是加密的。\n\n### 19. Mahmoud 正在考虑部署 `VDI`。允许员工使用平板电脑。这描述什么？\n\n\
  1. `BYOD`\n2. `CYOD`\n3. `COPE`\n4. `BYOE`\n\n### 20. 你被分配为公司选择备份方法。哪种选项提供的可靠性最高？\n\
  \n1. `Cellular`\n2. `WiFi`\n3. `SATCOM`\n4. `VoIP`\n\n### 21. John 担心公司发放手机和平电脑的安全。如果设备被盗，以下哪项最有效？\n\
  \n1. 远程擦除（Remote wipe）\n2. 地理位置（Geolocation）\n3. 强密码（PIN）\n4. 限制数据存储\n\n### 22.\
  \ 围栏（ofencing）实现了什么？\n\n1. 为移动设备提供位置。\n2. 限制移动设备的使用范围。\n3. 确定 `WiFi` 覆盖区域。\n4. 划分\
  \ `WiFi`。\n\n### 23. 哪项描述移动设备内容管理？\n\n1. 限制存储的内容。\n2. 限制存储内容的类型。\n3. 阻止某些网站。\n4.\
  \ 对授权内容进行数字签名。\n\n### 24. Frank 认为特定客户端访问 `DHCP` 服务器可能存在问题。他想通过获取新的动态 IP 来检查。哪个命令可以实现？\n\
  \n```\nipconfig /renew\n```（或根据具体步骤使用 `ipconfig /request`）\n\n### 25. Teresa 负责健身连锁的网络管理。她正试图寻找一种低功耗且能长时间处于低功耗睡眠模式的通信技术。以下哪些技术最合适？\n\
  \n1. `WiFi`\n2. `Cellular`\n3. `Bluetooth`\n4. `ANT`\n\n### 26. 哪种技术首次引入 Windows\
  \ Vista 中并仍然存在于 Windows 中，通过要求用户授权运行可执行文件来防止恶意软件？\n\n1. `DEP`\n2. `DLP`\n3. `UTM`\n\
  4. `ANT`\n\n### 27. John 负责公司新电子商务服务器的安全。他想确保在线交易是安全的。他应该使用哪种技术？\n\n1. `L2TP`\n\
  2. `IPSec`\n3. `SSL`\n4. `TLS`\n\n### 28. Frank 是某所小学院的网络管理员。该学院实现了一个简单的 `NIDS`。然而，`NIDS`\
  \ 似乎只能捕获已知攻击。这个 `NIDS` 可能缺失了哪种技术？\n\n1. 启发式扫描（Heuristic scanning）\n2. 特征扫描（Signature\
  \ scanning）\n3. 被动扫描（Passive scanning）\n4. 主动扫描（Active scanning）\n\n\n\n\n\n###\
  \ 30. 你担心攻击者会枚举你的整个网络。哪种协议至少可以缓解这个问题？\n1. `HTTPS`\n2. `TLS`\n3. `IPSec`\n4. `LDAPS`\n\
  \n### 31. 你被要求实现一种使用数字证书的传输文件安全协议。哪种协议是最佳选择？\n1. `FTP`\n2. `SFTP`\n3. `FTPS`\n4.\
  \ `SCP`\n\n### 32. Ahmed 负责他公司的 VoIP。他被指示确保所有 VoIP 通话都有加密选项。哪种协议最适用于安全 VoIP 通话？\n\
  1. `SIP`\n2. `TLS`\n3. `SRTP`\n4. `SSH`\n\n### 33. 移动设备上屏幕锁的目的是什么？\n1. 加密设备\n2.\
  \ 限制对设备的访问\n3. 加载特定用户的应用程序\n4. 连接到 WiFi\n\n### 34. Maria 是某大银行的工程师工程师。她的首席信息官（CIO）要求她调查在网上银行中使用上下文感知认证（context-aware\
  \ authentication）。以下哪项最准确地描述了上下文感知认证？\n1. 除了用户名和密码外，认证基于整个上下文（位置、时间段、正在尝试的操作等等）。\n\
  2. 在没有用户名或密码的情况下，认证基于整个上下文（位置、时间段、正在尝试的操作等等）。\n3. 需要用户名和密码的认证，但在令牌（token）或数字证书的上下文中进行。\n\
  4. 需要用户名和密码的认证，但不在令牌（token）或数字证书的上下文中进行。\n\n### 35. 应用管理对移动设备实现了什么？\n1. 仅允许从 iTunes\
  \ 商店安装应用程序\n2. 确保公司拥有设备上所有应用程序的列表\n3. 确保设备上只安装了批准的应用程序\n4. 更新移动设备上所有应用程序的补丁\n\n\
  ### 36. Dominick 负责一家中型保险公司的安全。他非常担心检测入侵。他购买的 IDS 说明他必须在每个网络段上都部署一个 IDS。这是哪类型的 IDS？\n\
  1. 主动式 (Active)\n2. `IPS`\n3. 被动式 (Passive)\n4. 内联 (Inline)\n\n### 37. 你公司的远程员工经常需要同时通过\
  \ VPN 连接到安全的公司网络并访问开放的网站。哪种技术最支持这种需求？\n1. 分拆隧道 (Split tunnel)\n2. `IPSec`\n3. 全隧道\
  \ (Full tunnel)\n4. `TLS`\n\n### 38. Denish 正在寻找一种解决方案，允许他的网络从广泛的网络资源中检索信息，同时所有流量都通过代理。哪种是最好的？\n\
  1. 正向代理 (Forward proxy)\n2. 反向代理 (Reverse proxy)\n3. `SPI`\n4. 开放代理 (Open proxy)\n\
  \n### 39. 有人在翻你公司的垃圾桶，寻找丢弃的文档、图表或敏感信息。这被称为什么？\n1. 翻找垃圾 (Dumpster diving)\n2. 垃圾搜寻\
  \ (Trash diving)\n3. 社会工程 (Social engineering)\n4. 垃圾工程 (Trash engineering)\n\n\
  ### 40. Derrick 负责他公司的服务器集群。该集群使用各种负载均衡协议。Derrick 想要确保从欧洲连接的客户端被引导到集群中的特定服务器。哪种是他的最佳解决方案？\n\
  1. 亲和性 (Affinity)\n2. 绑定 (Binding)\n3. 负载均衡 (Load balancing)\n4. 轮询 (Round-robin)\n\
  \n### 41. Teresa 负责她公司的 WiFi。她主要的担心是公司所在的大楼里还有许多其他办公室，有人可以很容易从这些位置之一尝试破解他们的 WiFi。哪种技术最好？\n\
  1. 使用 `WAPs`\n2. 地理围栏 (Geofencing)\n3. 保护管理员安全\n4. WAP 放置\n\n### 42. Juan 负责他公司的\
  \ SIEM。该 SIEM 聚合了来自服务器的日志。如果发现泄露，以下哪项是 Juan 最关心的问题？\n1. 事件重复\n2. 时间同步\n3. 影响评估\n\
  4. 关联\n\n### 43. 当你考虑 `NIDS` 或 `NIPS` 时，你的两个重要关注点是什么？\n1. 成本和误报（false positives）\n\
  2. 误报和漏报率\n3. 功耗和成本\n4. 管理界面和成本\n\n### 44. Shelly 非常担心未经授权的用户连接到公司路由器。她想防止欺骗（spoofing）。对于路由器来说，最基本的防欺骗技术是什么？\n\
  1. `ACL`\n2. 登录\n3. `NIPS`\n4. `NIDS`\n\n### 45. Farès 实现了洪洪保护（flood guard）。这最可能是防御哪种攻击？\n\
  1. `SYN` 攻击\n2. `DNS` 投毒\n3. `MAC` 欺骗\n4. `ARP` 欺骗\n\n### 46. Terrance 试图让他所有的用户连接到他网络上的证书服务器。然而，某些用户的机器与证书服务器不兼容，而且更换这些机器是不行的。以下哪项是\
  \ Terrance 的最佳解决方案？\n1. 为证书服务器使用应用代理。\n2. 为证书服务器使用 `NAT`。\n3. 更换服务器。\n4. 实现协议分析器。\n\
  \n### 47. John 正在实施虚拟 IP 负载均衡。他认为这可能会缓解网络变慢，并可能缓解拒绝服务攻击的影响。虚拟负载均衡的缺点是什么？\n1. 它是资源密集型的。\n\
  2. 大多数服务器不支持它。\n3. 它是基于连接的。\n4. 它仅适用于 Unix/Linux 服务器。\n\n### 48. ACME 网络发生了泄露。John\
  \ 管理 SIEM。攻击破坏了 `NTP`；这可能影响什么 SIEM 问题？\n1. 时间同步\n2. 关联\n3. 事件重复\n4. 事件未记录\n\n###\
  \ 49. 哪条命令会产生所示图像？\n![](img/c02f001.jpg)\n```\nping -n 6 -l 100 192.168.1.1\n```\n\
  ```\nping 192.168.1.1 -n 6 s 100\n```\n```\n（注：此处原文为 ping 192.168.1.1 -s 100\n```\n\
  \n### 50. 你是某大型律事务所的安全官。你担心数据丢失。你限制了 `USB` 和其他便携介质的使用，使用 `IDS` 寻找大量传出的数据，并在人员离开大楼前检查所有人员和包。`DLP`\
  \ 中你漏掉了哪个关键步骤？\n1. 便携式驱动器\n2. 电子邮件\n3. 蓝牙\n4. 光介质\n\n### 51. 以下哪种电子邮件安全措施对钓鱼邮件的影响最大？\n\
  1. 电子邮件加密\n2. 加固电子邮件服务器\n3. 电子邮件数字签名\n4. 垃圾过滤器\n\n### 52. Joanne 为她的许多网络服务器实施了 `TLS`。她想确保流量不被嗅探。但用户现在抱怨这降低了连接速度。以下哪项是最佳解决方案？\n\
  1. 增加服务器的 `RAM`。\n2. 路由器为这些服务器的流量提供更多带宽。\n3. 实现 `TLS` 加速器。\n4. 将所有服务器放在带有负载均衡的集群中。\n\
  \n### 53. Olivia 在员工电脑上发现了隐写工具。关于员工拥有隐写工具最大的担忧是什么？\n1. 密码破解\n2. 数据外泄\n3. 隐藏网络流量\n\
  4. 恶意软件\n\n\n\n\n\n## 55. John 发现攻击者正试图通过使用从常用密码列表中尝试多个密码来获取网络密码。这是哪种攻击？\n\n1. 字典攻击\
  \ (Dictionary)\n2. 彩虹表攻击 (Rainbow table)\n3. 暴力破解 (Brute force)\n4. 会话劫持 (Session\
  \ hijacking)\n\n## 56. Isabella 在一名员工的电脑上发现了 `netcat`。该员工没有权限使用 `netcat`。该工具可能会带来什么安全担忧？\n\
  \n1. 它是一个密码破解器。\n2. 它是一个包嗅探器。\n3. 它是一个网络通信工具。\n4. 它是一个 DoS 工具。\n\n## 57. Omar 是\
  \ ACME 公司的网络管理员。他负责公司网络内的证书机构。`CAs` 每周发布一次 `CRLs`。这可能会导致什么安全问题（如果有）？\n\n1. 已吊销的证书仍被使用\n\
  2. 发了无效证书\n3. 无安全问题\n4. 密钥脆弱的证书\n\n## 58. Hans 是某大银行的网络管理员。他担心员工违反软件许可协议。解决此问题的第一步是什么？\n\
  \n1. 执行软件审计\n2. 扫描网络中的已安装应用程序\n3. 建立明确的策略\n4. 阻止用户安装软件的能力\n\n## 59. 你负责公司的身份验证方法。你实施了指纹扫描仪来进入服务器房。经常有人员即使获得授权也会被拒绝进入服务器房。这属于什么问题？\n\
  \n1. FAR (假冒接受率)\n2. FRR (误拒率)\n3. CER (错误交叉识别率)\n4. EER (错误拒绝识别率)\n\n## 60. John\
  \ 是一家非常非常小公司的网络管理员。由于预算和空间限制，John 只能选择一种安全设备。他应该选择哪种？\n\n1. 防火墙\n2. 反病毒软件\n3. IDS\
  \ (入侵检测系统)\n4. UTM (统一威胁管理)\n\n## 61. 你负责 Acme 公司的安全工作。最近创建了 20 个新员工网络账户，并赋予了网络默认权限。你发现其中\
  \ 8 个账户拥有其工作任务所需的权限。哪种安全原则最好地描述了如何避免此类问题？\n\n1. 最小权限原则 (Least privileges)\n2. 职责分离原则\
  \ (Separation of duties)\n3. 默认拒绝原则 (Implicit deny)\n4. 最弱环节原则 (Weakest link)\n\n\
  ## 62. Mary 担心公司的 `SIEM` 日志存储时间不够或不够安全。她意识到，入侵可能在发生很很久后才被发现。这需要公司分析较旧的日志。Mary 需要找到一种备份方案，能够\
  \ a) 处理 `SIEM` 的所有聚合日志，b) 长期维护，并且 c) 确保安全。哪种方案对她最好？\n\n1. 备份到大容量外部硬盘。\n2. 备份到大容量备份带。\n\
  3. 备份到 `WORM` 存储。\n4. 备份到存储在异外的磁带上。\n\n## 63. Elizabeth 负责公司的 `SIEM` 系统。她每天监控公司的\
  \ `SIEM` 屏幕，每小时检查一次。对于跟进日志中出现的问题，采取哪种方法会更好？\n\n1. 自动告警\n2. 将日志转发到她的邮箱\n3. 无需更改，这样很好。\n\
  4. 仅在发生事件时主要查看 `SIEM` 日志。\n\n## 64. 你负责某大学的网络安全。教职员工配备了笔记本电脑。然而，许多教职员工大部分时间将笔记本留在办公室（有时甚至好几周）。你担心笔记本被盗。在这种情况下，保护笔记本最经济效益的方法是什么？\n\
  \n1. `FDE` (全盘加密)\n2. GPS 标记\n3. 地理围栏 (Geofencing)\n4. 连锁 (Tethering)\n\n## 65.\
  \ 你在一家国防承包工作。你负责移动设备安全。公司的一些研究人员使用公司发的平板电脑工作。这些平板电脑可能包含敏感甚至是机密数据。你实施最重要的安全措施是什么？\n\
  \n1. `FDE`\n2. GPS 标记\n3. 地理围栏\n4. 内容管理\n\n## 66. 在使用任何 `HIDS`/`HIPS` 或 `NIDS`/`NIPS`\
  \ 时，输出取决于特定供应商。然而，几乎所有 `HIDSs`/`HIPSs` 或 `NIDSs`/`NIPSs` 提供的基本信息集是什么？\n\n1. `IP`\
  \ 地址（发送者和接收者）、端口（发送者和接收者）和协议\n2. `IP` 地址（发送者和接收者）、端口（发送者和接收者）和攻击类型\n3. `IP` 地址（发送者和接收者）、端口（发送者和接收者）、用户名和机器名\n\
  4. 用户名、机器名和攻击类型\n\n## 67. 你负责公司的防火墙。你正在查看网关防火墙的输出。任何防火墙在其日志中会包含哪些基本信息？\n\n1. 针对所有流量：源和目的\
  \ `IP` 及端口、协议，以及是允许还是被拒绝\n2. 仅针对被拦截的流量：源和目的 `IP` 及端口以及流量被拒绝/拦截的原因\n3. 针对所有流量：源和目的\
  \ `IP` 及端口、是否被允许或拒绝，以及被拒绝的原因\n4. 仅针对被拦截的流量：源和目的 `IP`、协议以及被拒绝的原因\n\n## 68. Teresa\
  \ 负责 ACME 公司的事件响应。最近发生了网络入侵。此次入侵范围广泛，影响了许多计算机。作为事件响应的一部分，Teresa 将从 `SIEM` 收集日志，该\
  \ `SIEM` 聚合了 20 台服务器的日志。她应该先做哪操作？\n\n1. 事件去重\n2. 日志转发\n3. 识别攻击性质\n4. 识别源 `IP`\n\n\
  ## 69. Hector 负责公司的 `NIDS`/`NIPS`。他正在配置一个新的 `NIPS` 解决方案。`NIPS` 的哪个部分收集数据？\n\n1.\
  \ 传感器 (Sensor)\n2. 数据源 (Data source)\n3. 管理器 (Manager)\n4. 分析器 (Analyzer)\n\n##\
  \ 70. Gerald 是某小型金融服务公司的网络管理员。他负责控制网络资源的访问。什么机制负责根据请求的 `IP 地址` 拦截资源的访问？\n\n1. `ACL`\
  \ (访问控制列表)\n2. `NIPS`\n3. `HIPS`\n4. 端口拦截\n\n## 72. Elizabeth 负责公司的安全通信。她希望为管理员提供远程登录并执行命令行函数的选项，但希望这种操作仅通过安全的加密连接实现。她应该在防火墙上采取什么操作？\n\
  \n1. 阻塞端口 23 并允许端口 20 和 21。\n2. 阻塞端口 22 并允许端口 20 和 21。\n3. 阻塞端口 22 并允许端口 23。\n4.\
  \ 阻塞端口 23 并允许端口 22。\n\n## 73. Mark 正在为他的网络寻找代理服务器。代理服务器的目的是确保 Web 服务器对外部客户端隐藏。所有不同的\
  \ Web 服务器在外部看来都像是代理服务器本身。Mark 应该考虑哪种类型的代理服务器？\n\n1. 正向代理 (Forward)\n2. 反向代理 (Reverse)\n\
  3. 透明代理 (Transparent)\n4. 防火墙\n\n## 74. 公司聘请了一家外部安全公司对网络进行各种测试。漏洞扫描期间，你将为该公司提供各种系统的登录信息（例如数据库服务器、应用服务器、Web\
  \ 服务器等）以帮助他们进行扫描。哪项描述最准确？\n\n1. 白盒测试 (White-box test)\n2. 灰盒测试 (Gray-box test)\n\
  3. 凭据扫描 (Credentialed scan)\n4. 登录扫描 (Logged-in scan)\n\n\n\n\n\n### 74. Lars 负责\
  \ ACME 公司的事件响应。他特别关注托管企业 Web 器的网络网段。他希望有一种解决方案能够检测潜在攻击并通知管理员，以便管理员可以采取其认为恰当的任何行动。对于\
  \ Lars 来说，以下哪种方案是最佳解决方案？\n\n1. HIDS\n2. HIPS\n3. NIDS\n4. NIPS\n\n### 75. Mia 负责她公司的安全设备。她关注入侵检测。她希望有一种能够适用于整个网段的解决方案。然而，她又希望确保误报不会中断工作流。对于\
  \ Mia 来说，考虑哪种方案是最佳的？\n\n1. HIDS\n2. HIPS\n3. NIDS\n4. NIPS\n\n### 76. Abigail 是一家小公司的安全经理。许多员工想使用手持设备，如智能手机和平板电脑。员工希望在工作和工作之余都使用这些设备。Abigail\
  \ 关注安全问题。以下哪种方案是安全性最高的解决方案？\n\n1. COPE\n2. CYOD\n3. 地理标记\n4. BYOD\n\n### 77. 你负责维护公司始终开启的\
  \ VPN 连接。你被告知必须使用 IPSec 中最安全的模式。对于你来说，选择哪项是最佳的？\n\n1. 隧道模式\n2. AH\n3. IKE\n4. 传输模式\n\
  \n### 78. Debra 是她公司的网络管理员。她公司的 Web 器都在一个集群中。她的担心是：如果集群中的一个服务器发生故障，备份服务器还能运行相当长时间吗？她想确保备份不会很快失效。在集群配置中，她的最佳选择是什么？\n\
  \n1. 主主模式 (Active-active)\n2. 轮询 (Round-robin)\n3. 亲和 (Affinity)\n4. 主备模式 (Active-passive)\n\
  \n### 79. Omar 负责公司的无线安全。他希望在公司的不同部分实现不同的 WiFi 访问（即不同的 SSID、不同的安全级别和不同的认证方法）。对于\
  \ Omar 来说，在 WAP 中选择哪种是最佳？\n\n1. 胖 (Fat)\n2. 瘦 (Thin)\n3. 中继器 (Repeater)\n4. 全功能\
  \ (Full)\n\n### 80. Lilly 是一家中型金融服务公司的网络管理员。她希望在全范围内实施邮件加密和数字签名。但她担心成本，因为这里的预算非常有限。她的最佳选择是什么？\n\
  \n1. SMTPS\n2. S/MIME\n3. IMAPS\n4. PGP\n\n### 81. Edward 是一家银行的安全经理。他最近读了大量关于访问系统内存的恶意软件的内容。他希望找到一种解决方案来阻止程序利用系统内存。以下哪种方案是最佳的？\n\
  \n1. DEP\n2. FDE\n3. UTM\n4. IDS\n\n### 82. Sarah 是某家小公司的 CIO。她最近将全公司的语音通话都迁移到了\
  \ VoIP。她的新 VoIP 系统使用带有 `RTP` 的 `SIP`。这可能会产生什么问题？\n\n1. `SIP` 不安全。\n2. `RTP` 不安全。\n\
  3. `RTP` 太慢了。\n4. `SIP` 太慢了。\n\n### 83. 哪条命令会生成此处所示输出？\n\n![](img/c02f003.jpg)\n\
  \n1. `nslookup`\n2. `ipconfig`\n3. `netstat -a`\n4. `dig`\n\n### 84. Emiliano 是一家大型\
  \ Web 托管公司的网络管理员。他的公司还向 Web 托管客户颁发数字证书。他希望确保数字证书在撤销后不会再次被使用。他还希望确保证书被撤销与浏览器感知到之间没有延迟。对于证书撤销，以下哪种方案是？\n\
  \n1. OCSP\n2. X.509\n3. CRL\n4. PKI\n\n### 85. Elizabeth 负责某国防承包公司的安全工作。她担心用户通过邮件附件泄露敏感数据。以下哪种方案可以解决这一问题？\n\
  \n1. 邮件加密\n2. USB 拦截\n3. NIPS\n4. 内容过滤\n\n### 86. Victor 关注 BYOD 的安全。他担心设备丢失或被盗。以下哪种方案最有效？\n\
  \n1. 地理围栏\n2. 屏幕锁定\n3. 设备标记\n4. 设备加密\n\n### 87. Gabriel 正在使用 `nmap` 扫描。由于网络阻止了 ICMP，他想尝试\
  \ TCP 扫描。以下哪条命令可以实现这一点？\n\n1. `nmap -O -T1`\n2. `nmap -s -T3`\n3. `nmap -s -T5`\n\
  4. `nmap -s -T1`\n\n### 88. Mary 是 ACME 公司的网络管理员。她有时需要运行一个嗅探器来查看流量。她想寻找适用于 Linux\
  \ 的知名嗅探器。以下哪种是她的选择？\n\n1. Ophcrack\n2. Nmap\n3. Wireshark\n4. Tcpdump\n\n### 89.\
  \ 哪条命令产生了此处所示的输出？\n\n![](img/c02f04.jpg)\n\n1. `tracet -h`\n2. `ping`\n3. `netstat`\n\
  4. `nmap`\n\n### 90. Daryll 一直使用嗅探器监控网络流量。他发现 Web 服务器之间的流量是明文传输的。他希望有一种解决方案不仅能加密流量，还能利用公司现有的数字证书体系。以下哪种方案对\
  \ Daryll 来说是最好的？\n\n1. `TLS`\n2. `SSL`\n3. `IPSec`\n4. `WPA2`\n\n### 91. Jarod 关注组织中的\
  \ DLP。员工都使用云解决方案存储数据。这可能会产生什么 DLP 相关的安全威胁？\n\n1. 无安全威胁\n2. 来自云的恶意软件\n3. 通过云泄露数据\n\
  4. 安全策略不适用于云\n\n### 92. Derrick 是某家大公司的网络管理员。公司网络被分为高安全区、中安全区、低安全区和 DMZ。他担心外部入侵者，并希望安装一个蜜罐。他将蜜罐放在哪个区域最重要？\n\
  \n1. 高安全区\n2. 中安全区\n3. 低安全区\n4. DMZ\n\n### 93. Sheila 负责所有服务器的数据备份。她担心备份的频率以及备份数据的安全性。某些备份软件中的哪种功能对她最重要？\n\
  \n1. 使用数据加密\n2. 对数据进行数字签名\n3. 使用自动备份调度\n4. 对备份数据进行哈希处理\n\n### 94. Frank 是一家大型电子商务公司的\
  \ Web 服务器管理员。他担心有人使用 `netcat` 连接到公司 Web 服务器并获取有关服务器的详细信息。以下哪项最描述了他的担心？\n\n1. 被动侦察\n\
  2. 主动侦察\n3. 标识标志抓取\n4. 漏洞扫描\n\n### 95. Mike 负责公司的安全测试。他正在使用一种工具识别漏洞，并提供通过尝试利用来测试漏洞的机制。以下哪项最描述这类工具？\n\
  \n1. 漏洞扫描器\n2. 漏洞框架\n3. Metasploit\n4. Nessus\n\n\n\n\n\n## 96. 威廉（William）是一家大型银行的安全人员。当高管的笔记本电脑报废时，他希望确保这些笔记本电脑上的数据被完全清除，以至于即使使用取证工具也无法恢复。威廉应该擦写硬盘几次？\n\
  \n1. 1 次\n2. 3 次\n3. 5 次\n4. 7 次\n\n## 97. 你负责组织的防火墙。你担心如何确保所有防火墙都配置恰当。网关防火墙的配置如下：仅允许少数几个特定必需端口的入站流量；所有流量（无论允许还是拦截）都会被记录并将日志转发到\
  \ `SIEM`。此配置中遗漏了什么（如果有的话）？\n\n1. 无无，这是一个很好的配置。\n2. 加密所有流量\n3. 出站连接规则\n4. 入站流量的数字证书身份验证\n\
  \n## 98. 查尔斯（Charles）负责公司 Web 服务器的安全。某些 Web 服务器用于内部局域网，另一些用于外部网站。他选择加密所有网络流量，并正在使用自签名的\
  \ `X.509` 证书。这种方法有什么问题（如果有的话）？\n\n1. 他无法加密所有的 `HTTP` 流量。\n2. 他应该使用 `PGP` 证书。\n3.\
  \ 他不应该使用自签名证书。\n4. 无；这是一个恰当的配置。\n\n## 99. 你负责公司 Web 服务器的安全。你正在配置 `WAF`，并希望允许与 Web\
  \ 服务器之间仅加密流量，包括来自管理员使用命令行界面的流量。你应该怎么做？\n\n1. 开放端口 `80` 和 `23`，拦截端口 `443`。\n2. 开放端口\
  \ `443` 和 `23`，拦截端口 `80`。\n3. 开放端口 `443` 和 `22`，拦截端口 `80` 和 `23`。\n4. 开放端口 `443`，拦截所有其他端口。\n\
  \n## 100. 弗朗西斯（Francis）是一家大型律师事务所的安全管理员。她担心包含专有信息的机密文档可能会泄露。泄露可能是故意的也可能是无意的。她正在寻找一种解决方案，将某些识别信息嵌入文档中，使读者无法看到，但可以使用正确的软件提取。哪种技术最符合弗朗西斯的需求？\n\
  \n1. 对称加密\n2. 隐写术（Steganography）\n3. 哈希处理（Hashing）\n4. 非对称加密\n\n## 101. 你负责公司的网关防火墙。你需要配置防火墙以仅允许加密的邮件发送或接收。你应该采取什么操作？\n\
  \n1. 允许端口 `25`、`110` 和 `143`。拦截端口 `465`、`993` 和 `995`。\n2. 拦截端口 `25`、`110` 和 `143`。允许端口\
  \ `465`、`993` 和 `995`。\n3. 允许端口 `25`、`110` 和 `443`。拦截端口 `465`、`993` 和 `143`。\n4.\
  \ 拦截端口 `465`、`994` 和 `464`。允许端口 `25`、`110` 和 `80`。\n\n## 102. 马克（Mark）负责一家小银行的安全。他在网关处有一个防火墙，在每个网络段也设置了一个防火墙。每个防火墙都会记录所有接受和被拒绝的流量。马克定期检查这些日志。马克为了改进他的防火墙配置应该采取的第一步是什么？\n\
  \n1. 与 `SIEM` 集成。\n2. 部署蜜罐系统。\n3. 与 `AD` 集成。\n4. 部署蜜罐网络（Honeynet）。\n\n## 103. 你负责公司的网关防火墙。你需要配置防火墙以仅允许发送或接收加密的邮件。为了防止嗅探器获取元数据，你应该使用哪种模式？\n\
  \n1. `AH`\n2. `ESP`\n3. 隧道模式（Tunneling）\n4. 传输模式（Transport）\n\n## 104. 约翰（John）负责配置设备。他在网络中实施了\
  \ `NIDS`。然而，在某些情况下 `NIDS` 漏报。约翰应该解决什么问题？\n\n1. 漏报（False negative）\n2. 端口拦截\n3. `SPI`\n\
  4. 误报（False positive）\n\n## 105. 你负责公司的通信安全。你的公司有大量的销售人员。你希望确保他们连接是安全的。你应该实施什么？\n\
  \n1. `L2TP`\n2. `IPSec` \n3. 站点到站点 VPN（Site-to-site VPN）\n4. 远程访问 VPN（Remote-access\
  \ VPN）\n\n## 106. 你的公司向员工发放移动设备。这种做法会导致什么问题（如果有的话）？\n\n1. 个人信息泄露\n2. 数据外泄\n3. 设备不安全\n\
  4. 无问题\n\n## 107. 玛莎（Marsha）负责移动设备安全。她的公司使用 `COPE`。玛莎的下一步最重要的步骤是什么？\n\n1. 实施地理围栏（Geofencing）。\n\
  2. 实施应用管理。\n3. 实施地理定位。\n4. 实施远程擦除（Remote wipe）。\n\n## 108. 瓦莱丽（Valerie）负责公司的安全。公司正在使用\
  \ `BYOD`。她担心个人设备会损害数据。哪种技术可以解决这个问题？\n\n1. 容器化（Containerization）\n2. 屏幕锁定\n3. 全盘加密（FDE）\n\
  4. 生物识别\n\n## 109. 杰克（Jack）是一家小型营销公司的信息安全官（CISO）。他的员工经常旅行并使用移动设备。他最近担心侧载（Sideloading）。哪项描述了侧载？\n\
  \n1. 通过 `USB` 安装应用程序\n2. 通过 `WiFi` 加载软件\n3. 绕过屏幕锁定\n4. 在设备上加载\n\n## 110. 你负责大型公司的\
  \ `DLP`。一些员工使用 `COPE`，另一些使用 `BYOD`。这些设备可能会带来 `DLP` 问题？\n\n1. `COPE` 可能是 `OTG`。\n\
  2. `BYOD` 可能是 `OTG`。\n3. `COPE` 和 `BYOD` 可能是 `OTG`。\n4. 只有越狱的 `COPE` 或 `BYOD` 可能是\
