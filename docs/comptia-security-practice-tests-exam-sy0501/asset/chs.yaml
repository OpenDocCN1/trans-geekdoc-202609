  \ 选项 B 错误。“业余”可能是一个合适的描述，但正确的术语是 `script kiddie`。\n- 选项 C 错误。此场景中没有任何迹象表明内部威胁。\n\
  \n## 21. B. 这个术语是 `botnet`（机器人网络），通常写为一个单词。\n\n- 选项 A、C 和 D 均错误。虽然这些术语听起来相似，但它们并不是行业使用的术语。\n\
