  *   `Option D` 是错误的。截图为调查人员提供了收集计算机屏幕信息的有用方法。这将允许调查人员重现屏幕上发生的情况。\n\n## 67. A. 风险定义为威胁发生的概率和相应的损失潜力。风险是威胁者利用漏洞的概率。系统加固的目的是尽可能消除安全风险。加固通常通过禁用工作站上所有非必需的软件程序和实用程序来实现。\n\
