  \ B. 定性风险分析使用描述和词汇来衡量风险的影响程度。定性风险分析的缺点是其方法论有时具有主观性且不可测试性。\n\n- 选项 A、C 和 D 错误。这些陈述描述的是定量风险。\n\
  \n### 48. A. 状态检测防火墙区分不同类型连接的有效数据包。匹配已知活动连接的数据包将被允许通过。\n\n- 选项 B 错误。无状态防火墙评估当前数据包，不跟踪连接状态。\n\
