  1. `OAUTH`\n2. `Tokens`\n3. `OpenID`\n4. `RBAC`\n\n### 25. 你负责为公司网络设置新账户。在设置新账户时，最重要的事情是什么？\n\
  1. 密码长度\n2. 密码复杂度\n3. 账户年龄\n4. 最小权限 (Least privileges)\n\n### 26. Stefan 刚成为大学的新安全官。他担心在校园内晚上工作的学生员工可能会尝试使用凭据登录。以下哪项是有效的？\n\
  1. 时间段限制\n2. 使用审计\n3. 密码长度\n4. 凭据管理\n\n### 27. Jennifer 担心公司的一些人员拥有的权限超过了他们应该拥。这是由于人员在职位之间移动，导致累积权限超过了他们当前工作的要求。以下哪项是有效的？\n\
