  \ 选项 C 错误。当哈希算法为两个不同的消息创建相同的哈希值时，就会发生 `collision`（冲突）。\n- 选项 D 错误。`IV`（初始化向量）是一个与密钥配合使用的任意数。`IV`\
  \ 使破解密码变得困难。\n\n### 34. B.\n`SSL`（安全套接层）使用公钥加密。当客户端访问安全的网站时，它将生成会话密钥并使用服务器的公钥对其加密。会话密钥使用服务器的私钥解密，并使用会话密钥来来回加密数据。\n\
  \n- 选项 A 错误。服务器的私钥由服务器私有保留，仅用于解密客户端使用服务器公钥加密的数据。\n- 选项 C 错误。在客户端访问网站时，服务器并不创建会话密钥。\n\
  - 选项 D 错误。在客户端访问网站时，服务器并不创建会话密钥。服务器的公钥用于加密会话密钥。\n\n### 35. C.\n`EAP-TLS` 要求客户端和服务器都拥有证书。认证是双向的，服务器验证客户端，客户端验证服务器。\n\
  \n- 选项 A、B 和 D 均错误。其他 `EAP` 类型可能使用客户端证书，但不是强制要求的。\n\n### 36. A.\n`PGP`（完美隐私）或 `GPG`（GNU\
