  \n\n\n\n\n## 86\n**B.** `evil twin`（邪恶孪生）是一个外观的虚假接入点。攻击者将使用相同的网络名称并发送信标以引导用户连接。这允许攻击者在终端用户不知情的情况下获取个人信息。\n\
  \n* **Option A** 是错误的。非法接入点（rogue access point）是在用户不知情的情况下安装在网络上的无线接入点。它接收公司内部合法接入点发送的信标。\n\
  * **Option C** 是错误的。`Bluejacking`（蓝牙劫持）是指从一个蓝牙设备向另一个蓝牙设备（如智能手机、平板电脑和笔记本电脑）发送未经请求的消息的行为。\n\
