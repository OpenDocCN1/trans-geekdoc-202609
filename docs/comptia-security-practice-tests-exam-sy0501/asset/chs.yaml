- "# CompTIA ® Security+® 实践测试：考试 SY0-501\n\n\n\n![](img/cover.jpg)\n![](img/coupon.jpg)\n\
  \n\n\n\n\n\n\n\n\n\n\n\n## 致谢\n\n感谢所有在本书创作过程中提供帮助的同事和朋友。特别要感谢我的家人，他们的耐心和支持。同时也感谢所有的读者。\n\
  \n## 鸣谢\n\n\n\n\n\n\n\n\n\n# 引言\n\n恭喜购买《CompTIA Security+ 模拟测试集》。本书将作为你准备 CompTIA\
  \ Security+ 认证考试（`SY0-501`）以及 IT 安全领域职业生涯的工具。\n\n本书的目的是通过解释考试中将测试的术语和技术，帮助你为 CompTIA\
  \ Security+ 考试做好准备。本书的主要重点是帮助你通过考试。我们并不总是涵盖相关领域的方方面面，因此某些技术方面的介绍将仅在帮助你理解通过考试所需知识的范围内进行涵盖。我们希望在你获得认证后，这本书能成为你宝贵的资源。\n\
  \n## 获得认证大有价值\n\n在数字世界中，数字素养是一项基本的生存技能。认证证明了你拥有解决几乎任何业务环境中业务问题的知识和技能。\n\n\n\n认证使你更具竞争力且更易就业。研究表明，学习技术的人更容易获得录用。在初级职位的竞争中，学术业业中包含\
  \ IT 课程的高中毕业或大学学位申请者在职位面试中的表现始终更优，且录用人数也显著更高。如果将其视为技术教育的强制组成部分，那么认证测试对于 IT 专业人士来说将是一个无价的竞争优势。\n\
  \n## 认证如何帮助你的职业\n\n**安全是需求最高的职业类别之一。** 美国劳工统计局（BLS）预测，信息安全分析师将成为增长最快的职业类别，在 2012\
  \ 年至 2022 年间整体增长率将达到 37%。\n\n**敲开大门。** 根据 CompTIA 的《雇主对 IT 培训与认证的认知》研究，今天 91% 的招聘经理认为\
  \ IT 认证在验证专业知识方面很有价值。\n\n**网络安全管理员收入丰厚。** 根据 Glassdoor 的数据，网络安全管理员的年平均收入接近 70,000\
  \ 美元。\n\n**CompTIA Security+ 是开启网络安全管理员或系统安全管理员职业生涯的第一步。** 获得 CompTIA Security+\
  \ 认证的专业人士有 85% 认为自己拥有成功完成工作所需的知识和技能。\n\n**CompTIA Security+ 认证非常受欢迎。** 全球超过 250,000\
  \ 个人获得了 CompTIA Security+ 认证。\n\n**CompTIA Security+ 常用于各类机构。** 如日立系统、富士胶印、HP、Dell\
  \ 以及多家美国主要的政府承包商在使用 CompTIA Security+。\n\n**CompTIA Security+ 获得了美国国防部（DoD）的批准。**\
  \ CompTIA Security+ 已获得国防部批准，成为 DoD 8570.01-M 指令中信息保证技术层级 II（II）和管理层级 I（I）职位要求的认证选项之一。\n\
  \n## 获取认证并保持认证的步骤\n\n**复习考试目标。** 复习认证目标以确保你了解考试涵盖的内容：\n\n`http://certification.comptia.org/examobjectives.aspx`\n\
  \n**备考。** 在你完成认证学习后，尽可能回顾并回答大量的样本题以为考试做准备。\n\n**购买考试券。** 在 CompTIA 市场上购买考试券：\n\n\
  `www.comptiastore.com`\n\n**参加考试！** 访问 Pearson VUE 网站并安排考试时间：\n\n`www.pearsonvue.com/comptia/locate/`\n\
  \n**通过继续教育保持认证。** 新的 CompTIA Security+ 证书自认证之日起有效期为三年。有多种方法可以更新认证。更多信息请查看 CompTIA\
  \ 网站。\n\n## 如何获取更多信息\n\n* 访问 CompTIA (`http://certification.comptia.org/home.aspx`)\
  \ 了解更多关于获取 CompTIA 认证的信息。\n* 联系 CompTIA：拨打 866-835-8020 并选择选项 2，或发送邮件至 questions@comptia.org：\n\
  \n## 参加考试\n\n完成认证学习后，尽可能回顾并回答大量的样本题以为考试做准备。模拟测试模拟了真实考试。虽然题目不同，但它们测试了你对目标的掌握以及对基本概念的理解。\n\
  \n当你准备好考试时，只需找到一个地点：`www.pearsonvue.com/comptia/locate/`。\n\n## 本书的组织结构\n\n本书由根据每个领域划分的七章组成。章节安排如下：\n\
  \n**第 1 章：威胁、攻击与漏洞**（领域 1）\n**第 2 章：技术与工具**（领域 2）\n**第 3 章：架构与设计**（领域 3）\n**第 4\
  \ 章：身份与访问管理**（领域 4）\n**第 5 章：风险管理**（领域 5）\n**第 6 章：密码与 PKI**（领域 6）\n**第 7 章：模拟测试**\
  \ - 模拟真实考试。\n\n## Security+ 考试目标地图\n\n以下地图将帮助你找到涵盖考试每个目标的书籍章节。\n\n### 1.0 威胁、攻击与漏洞\n\
