  * 选项 D 错误。隐私政策是描述某方收集、使用、披露和管理客户或客户数据的方式策略。\n\n### 57. **A.** 可以启用屏幕锁定选项，以防止所有人员在者离开无人看守的情况下查看设备上的数据。此选项可以配置为在设备无人看守时几秒到几分钟内启用。\n\
  \n* 选项 B 错误。推送通知是弹出在移动设备上的消息。它可以为应用用户提供便利和价值。用户可以接收信息范围涵盖从体育比分、新更新、航班状态到天气报告等的重要信息。\n\
