  \ hijacking`（会话劫持）\n\n\n\n\n\n## 57\n当攻击者试图找到一个与密码产生相同哈希值的输入值时，这是哪种攻击？\n1. 彩虹表 (Rainbow\
  \ table)\n2. 暴力破解 (Brute force)\n3. 会话劫持 (Session hijacking)\n4. 碰撞攻击 (Collision\
