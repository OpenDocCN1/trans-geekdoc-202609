  \ 漏洞扫描使用自动化和半自动化过程识别已知漏洞。\n- A 选项错误。审计通常涉及文档检查。\n- 选项 C 和 D 错误。这些都是渗透测试类型。\n\n###\
  \ 122. A. 近场通信（NFC）容易受到窃听攻击。带有 NFC 的手机可以作为支付方式，并应使用生物识别/密码以防止信息被盗。\n- B 选项错误。中间人攻击是在两个通信端之间进行某些过程以破解密码或加密密钥。\n\
