  \n## 85. 关于病毒和蠕虫，以下哪些陈述是正确的？（选择两项。）\n1. 病毒是在网络中自我复制的。\n2. 蠕虫是在网络中自我复制的。\n3. 病毒通过附着到文件进行复制。\n\
  4. 蠕虫通过附着到文件进行复制。\n\n\n\n\n\n# 86. 以下哪种无线攻击被用于伪造另一个无线接入点 (WAP)，以便从附近的移动用户获取未经授权的信息？\n\
