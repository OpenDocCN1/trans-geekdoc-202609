  \ 7 章：练习测试\n\n### 1. C. 虚拟局域网（`VLAN`）旨在分段局域网内部的网络。\n\n* 选项 A 错误。媒体访问控制（`MAC`）是网络设备上的唯一标识码。这也称为物理地址。\n\
  * 选项 B 错误。网络地址转换（`NAT`）是路由器中的一种功能，将私有 IP 地址转换为公有 IP 地址，反之亦然。`NAT` 将向互联网隐藏私有 IP 地址，也是地址有限的解决方案。\n\
  * 选项 D 错误。非军事化区（`DMZ`）旨在保护内部网络但允许来自互联网的访问。\n\n### 2. C. 被动侦察试图在不与系统积极交互的情况下获取有关计算机系统和网络的信息。\n\
  \n* 选项 A 错误。权限提升攻击允许攻击者由于编程错误或设计缺陷获得网络的高级访问。\n* 选项 B 错误。主动侦察是网络攻击的一种，攻击者与系统进行交互。攻击者可以使用端口扫描器收集有关漏洞端口的信息。\n\
  * 选项 D 错误。黑盒测试可以模拟真实场景，因为测试人员在不查看内部结构的情况下检查网络功能。由于网络管理员是员工，他或她将拥有结构信息。\n\n### 3.\
  \ C. 个人身份验证（`PIV`）卡包含持卡人进入设施所需的必要数据。\n\n* 选项 A 错误。感应卡是非接触式智能卡，将其持在电子阅读器附近以获得进入特定区域的权限。\n\
  * 选项 B 错误。基于时间的一次性密码（`TOTP`）是为身份验证计算机系统而生成的临时密码，该密码仅在特定时间内有效——例如 30 秒。\n* 选项 D 错误。基于\
  \ HMAC 的一次性密码（`HOTP`）是为身份验证计算机系统而生成的临时密码；该密码在用户使用之前一直有效。\n\n### 4. D. 网络访问控制（`NAC`）执行安全策略并管理网络访问。它允许合规、经过验证且受信任的设备进入网络并访问资源。如果设备不合规，将被拒绝访问或获得受限访问，直到设备合规。\n\
  \n* 选项 A 错误。网络地址转换（`NAT`）是路由器中的一种功能，将私有 IP 地址转换为公有 IP 地址，反之亦然。`NAT` 将向互联网隐藏私有 IP\
  \ 地址，也是地址有限的解决方案。\n* 选项 B 错误。主机入侵防御系统（`HIPS`）用于监控客户端计算机的恶意活动，并根据实施的规则执行操作。\n\n\n\
  \n\n\n*  C 错误。非军事化区 (`DMZ`) 设计用于保护内部网络，但允许从互联网访问资源。这为局域网 (LAN) 提供了额外的保护。\n\n###\
  \ 5. A. `禁入室`(mantrap) 是一种包含两组门的物理安全访问控制设备。当第一组门关闭时，第二组门才会打开。这种访问控制可以防止未经授权的人进入安全区域。\n\
  \n*  B 错误。`法拉第笼`(Faraday cage) 是一种金属外壳，可以防止电磁场从手机等设备中逸出。电磁场的发射可能允许攻击者获取敏感数据。\n*\
  \  C 错误。`物理隔离`(airgap) 是一种隔离计算机或网络的做法，以防止其连接到外部连接。\n*  D 错误。`电脑锁`(Cable locks) 用于防止在办公室或移动过程中计算机设备被盗窃。\n\
  \n### 6. B. 非军事化区 (`DMZ`) 将局域网 (`LAN`) 与互联网等不可信的网络隔离开来。放置在 `DMZ` 中的资源可以从互联网访问，并保护位于\
  \ `LAN` 中的资源。\n\n* A 错误。`蜜罐网`(honeynet) 是多个 `蜜罐` (honeypots) 的集合。`蜜罐` 是一个设置了漏洞的系统，用于吸引攻击者，以便出于研究目的查看其活动和方法。\n\
  * C 错误。`代理服务器`(proxy server) 代表客户端发送请求。`代理服务器` 隐藏客户端的公 IP 地址，并缓存频繁请求的网站以减少带宽并提高客户端的响应时间。\n\
  * D 错误。`内网`(intranet) 是公司内部通过 `LAN` 内部访问的私有网络。\n\n### 7. D. `负载均衡器`(load-balancer)\
  \ 将在多个服务器之间分配并管理网络流量，以提高性能。\n\n* A 错误。`VPN 集中器`(VPN concentrator) 是一种管理大量 `VPN`\
  \ 隧道的路由器设备。\n* B 错误。`网络入侵防御系统`(NIPS) 用于监控网络中的恶意活动，并根据实施的规则执行操作。\n* C 错误。安全信息和事件管理\
  \ (`SIEM`) 实时识别、监控、记录和分析任何安全事件或事故。\n\n### 8. A. `保安人员`(security guard) 是所有安全层中的主要角色。保安人员可以执行许多功能，如巡逻检查站、监督电子访问控制、响应报警以及检查视频监控。\n\
  \n*  B、C 和 D 错误。实施这些技术并不如雇佣保安人员有用。\n\n### 9. A. `零日攻击`(zero-day attack) 在安全漏洞为人知的当天利用该漏洞进行攻击。攻击者可能在公司发现漏洞之前发现了漏洞。\n\
  \n* B 错误。`跨站脚本`(Cross-site scripting) 允许攻击者在网页中插入其他用户可以查看的客户端脚本。\n* C 错误。`地址解析协议`\
  \ (`ARP`) 毒化发生在攻击者更改目标 `ARP` 缓存上的 `MAC` 地址时，其目的是窃取敏感数据并导致拒绝服务。\n* D 错误。`域名劫持`(Domain\
  \ hijacking) 发生在攻击者将域名用于自己的目的时。攻击者可以收集有关访问者的数据。\n\n### 10. B. 当电子设备处于电磁场区域时，电磁干扰\
  \ (`EMI`) 会干扰其运行。\n\n* A 错误。非军事化区 (`DMZ`) 设计用于保护内部网络，但允许从互联网访问资源。这为 `LAN` 提供了额外的保护。\n\
  * C 错误。`基本输入输出系统` (`BIOS`) 管理操作系统与所接设备之间的数据。\n* D 错误。`信任平台模块` (`TPM`) 是一个存储加密密钥的专用芯片。\n\
  \n### 11. C. `VPN 集中器` 是一种管理大量 `VPN` 隧道并创建远程访问或站点到站点 `VPN` 连接的设备。\n\n* A 错误。`路由器`(router)\
  \ 决定通往目的地的最佳路径。\n* B 错误。`代理服务器`(proxy server) 代表客户端发送请求。`代理服务器`隐藏客户端的公 IP 地址，并缓存频繁请求的网站以减少带宽并提高客户端的响应时间。\n\
  * D 错误。`防火墙`(firewall) 使用规则控制入站和出口流量。`防火墙` 可以是硬件也可以是软件。\n\n### 12. B. `密钥托管`(key\
  \ escrow) 是授权用户可以获取密钥以解密数据的地方。\n\n* A 错误。`证书撤销列表` (`CRL`) 是由 `CA` 在证书过期日期之前吊销的证书列表。\n\
  * C 错误。`信任模型`(trust model) 允许加密密钥被信任。\n* D 错误。`中间证书机构` (`CA`) 颁发证书以验证个人或实体。\n\n\
  ### 13. B. `可用性`(Availability) 将是最大的问题，因为如果 `HVAC` 系统未冷却房间，计算机将无法运行。\n\n* A 错误。`机密性`(Confidentiality)\
  \ 允许授权用户访问敏感受保护的数据。\n* C 错误。`完整性`(Integrity) 确保数据未被篡改。\n* D 错误。`物理隔离`(airgap) 是一种隔离计算机或网络的做法，以防止其连接到外部连接。\n\
  \n### 14. B. 正确答案是禁 `SSID` 广播。禁用 `SSID` 后，用户必须输入 `SSID` 尝试连接到无线接入点。\n\n* A 错误。`MAC\
  \ 过滤` 是定义允许或禁止在 WiFi 网络上的设备列表。\n* C 错误。`天线类型`和放置无法防止用户查看 `SSID`。`天线类型` 决定信号是在 360\
  \ 度方向传输（全向）还是在 80 到 120 度之间的方向传输（定向）。\n* D 错误。`频段选择`无法防止用户查看 `SSID`。`频段选择`指的是无线接入点使用的通道。在\
  \ 2.4 GHz 频谱中，使用相邻的通道会停止数据的接收或发送。\n\n### 15. B. `时间限制` 是一种逻辑访问控制的形式，在特定时间之外限制某些应用程序或系统的访问。\n\
  \n* A 错误。`工作轮换` 是在雇佣范围内轮换员工的工作，以提高灵活性并保持员工对工作的兴趣。\n* C 错误。`最小权限原则` 赋予用户完成工作所需的最低权限，以限制潜在的安全泄露。\n\
  * D 错误。`基于位置的策略` 使用设备的位置数据来控制功能，例如在敏感区域禁用手机摄像头。\n\n### 16. A、D、F。`3DES`、`RC4` 和\
  \ `Twofish` 被称为对称算法。它们使用相同的密钥来加密和解密数据。\n\n\n\n\n\n- 选项 B 和 C 错误。`ECDHE` 和 `RSA`\
  \ 被称为非对称算法。它们使用私钥和公钥对数据进行加密和解密。\n- 选项 E 错误。`SHA` 被称为哈希算法。哈希将字符串转换为代表原始字符串的密钥。这被称为单向加密，因为哈希无法被解密以还原原始字符串。\n\
  \n### 17. D. 正确答案是寻找弱密码。\n密码破解工具可能会发现当前正在使用弱密码的用户。\n- 选项 A、B 和 C 错误。密码破解程序不会发现任何强密码。它不会告知用户是否遵循了密码复杂性策略和最小密码长度策略。\n\
  \n### 18. A. 白盒测试是指在已知网络或布局的所有信息的情况下对网络进行测试的过程。\n- 选项 B 错误。黑盒测试是指在未知网络或布局的任何信息的情况下对网络进行测试的过程。\n\
  - 选项 C 错误。灰盒测试是指在已知网络或布局的部分信息的情况下对网络进行测试的过程。\n- 选项 D 错误。紫色盒（Purple box）不是渗透测试中提到的术语。\n\
  \n### 19. A. 远程拨号用户服务 (RADIUS) 允许远程访问服务器与中央服务器进行通信。该中央服务器用于验证和授权用户访问网络服务和资源。\n-\
  \ 选项 B 错误。`TACACS+` 是由 Cisco 开发的协议，使用 `TCP` 进行认证、授权和计服务。\n- 选项 C 错误。`Kerberos` 是一种认证协议，使用票据（tickets）允许访问网络资源。\n\
  - 选项 D 错误。`OAUTH` 是一种授权协议，允许第三方应用程序在不共享登录凭据的情况下获取用户数据。\n\n### 20. B, D. 正确答案是缓解缓冲区溢出攻击和跨站脚本\
  \ (XSS) 。\n缓冲区溢出发生在程序尝试向缓冲区（内存）中放置超过其容纳能力的数据时。此操作可能会损坏数据、程序崩溃或执行恶意代码。`XSS` 漏洞存在于\
  \ 应用程序中，通过注入恶意代码来收集用户信息。\n- 选项 B 错误。窥视（Shoulder surfing）是一种社会工程攻击，攻击者通过直接观察（如从人的肩膀后看）来收集个人信息。\n\
  - 选项 D 错误。`地址解析协议 (ARP)` 毒是由攻击者向局域网发送伪造的 `ARP` 消息引起的。这允许攻击者监控通过网络的数据。\n\n### 21.\
  \ A. 正确答案是“你所做的动作”。这是一个图片密码的示例。用户选择一张自己喜欢的照片并在上面记录手势。每个手势可以是一个线、圆或点，按精确的顺序执行。用户将重复这些手势来登录他们的\
  \ `Windows` 账户。\n- 选项 B 错误。“你所知道的”（Something you know）是一种知识因素，例如用户知道自己的用户名和密码。\n\
  - 选项 C 错误。“你所拥有的”（Something you have）是一种持有因素，例如用户拥有智能卡或安全令牌。\n- 选项 D 错误。“你所特征的”（Something\
  \ you are）是一种固有生物识别因素，例如用户的指纹。\n\n### 22. D. 账户锁定防止黑客通过猜测用户名和密码来访问用户账户。它还将账户锁定一段时间，或者直到管理员解锁账户为止。\n\
  - 选项 A 错误。密码复杂性强制要求包含以下四个字符集中的三个：小写字母、大写字母、数字和特殊字符。密码复杂性不会阻止黑客可能猜测用户名和密码。\n- 选项\
  \ B 错误。账户禁用是在员工离开公司（无论是临时还是永久）时实施的。账户禁用使用户账户不再可使用。此操作由公司内的管理员执行。\n- 选项 C 错误。密码长度决定了密码必须具有的最少字母数字字符数量。这不会阻止黑客可能猜测用户名和密码。\n\
  \n### 23. C. DNS 安全扩展 (DNSSEC) 防止攻击者劫持 DNS 过程并接管会话。`DNSSEC` 对数据进行数字签名，使用使用户可以确保数据是有效的。\n\
  - 选项 A 错误。安全套接层 (SSL) 是一种在不安全的网络上保护网络客户端和服务器之间连接的协议。\n- 选项 B 错误。安全外壳 (SSH) 是一种为管理员提供到远程计算机的安全连接的协议。\n\
  - 选项 D 错误。传输层安全 (TLS) 是一种在两个通信的 应用程序之间提供数据完整性的协议。`TLS` 是 `SSL` 的继任者，更加安全。\n\n###\
  \ 24. B. 翻找垃圾（Dumpster diving）是一种通过搜索垃圾寻找敏感信息的攻击，这些信息可能用于对公司网络进行攻击。\n- 选项 A 错误。尾随（Tailgating），通常称为搭便（piggybacking），是一种物理安全违规，未经授权的人跟随授权人员（员工）进入安全区域。\n\
  - 选项 C 错误。窥视（Shoulder surfing）是通过从人的肩膀后看获取信息的能力。可以获得的信息包括个人识别码、用户名、密码和其他机密信息。\n\
  - 选项 D 错误。中间人攻击（nan-in-the-middle`）是指攻击者在双方不知情的情况下捕获并重放双方之间的网络数据。\n\n### 25. D.\
  \ 高级加密标准 (AES) 使用 128、192 和 256 位的密钥。\n- 选项 A 错误。数据加密标准 (DES) 使用 64 位的密钥长度。\n- 选项\
  \ B 错误。基于哈希的消息认证码 (HMAC) 结合哈希函数使用加密密钥进行消息认证。\n- 选项 C 错误。`MD5` 是一种 128 位的哈希算法。\n\n\
  ### 26. C. 正确答案是渗透测试授权。该授权的目的是保护执行工作的安全审计免受可能的攻击。\n- 选项 A 错误。漏洞测试授权保护安全审计识别并量化公司网络中的安全漏洞。题目说是模拟攻击，这被称为渗透测试。\n\
  - 选项 B 错误。将风险转移给第三方允许第三方管理特定风险，从而减少公司的成本。\n- 选项 D 错误。变更管理是管理网络配置更改的过程。\n\n### 27.\
  \ C. 云计算基于通过互联网提供的托管服务概念。公司可以获得处理能力和存储能力，而无需创建和托管自己系统的成本。\n- 选项 A 错误。沙箱是隔离计算环境的概念，例如开发人员测试新的程序代码。\n\
  - 选项 B 错误。非军事化区 (DMZ) 设计旨在保护内部网络，同时允许从互联网访问资源。这为 `LAN` 提供了额外的保护层。\n- 选项 D 错误。数据泄露防护\
  \ (DLP) 通过扫描防止敏感数据离开公司网络。\n\n\n\n\n\n## 28. C. 零日攻击在安全漏洞公开的当天利用该漏洞进行攻击。攻击者可能在公司发现漏洞之前就已经发现了这些漏洞。\n\
  \n- 选项 A 错误。缓冲区溢出攻击发生在程序尝试在缓冲区（内存）中存储比其能够容量更多的数据时。这种操作会导致数据损坏、程序崩溃或执行恶意代码。\n- 选项\
  \ B 错误。会话劫持是攻击者通过捕获会话 ID 并冒充授权用户来接管网络用户会话的方法。这允许攻击者执行授权用户在网络上可以执行的任何操作。\n- 选项 D\
  \ 错误。分布式拒绝服务（DDoS）发生在攻击者使用大量主机向服务器泛洪数据包，导致服务器崩溃并无法使用。\n\n## 29. C, D. 有线等效隐私（WEP）和\
  \ WiFi 保护（WPA）是无线局域网（WLAN）的安全协议。它们已知存在漏洞且容易受到攻击。\n\n- 选项 A 和 B 错误。在加密设备与无线接入点（WAP）之间的数据时，WPA2\
  \ 个人版和 WPA2 企业版被认为是更强的选择。WPA2 企业版使用 `IEEE 802.1x` 认证，而 WPA2 个人版使用预共享密钥（`PSK`）并为家庭设计。\n\
  \n## 30. D. 补丁管理包括对本地网络内的计算机收集、测试和安装补丁。\n\n- 选项 A 错误。沙箱是一种隔离计算环境的概念，例如软件开发人员测试新的编程代码。\n\
  - 选项 B 错误。在自形成局域网络（ad hoc network）中，设备直接连接并相互通信。\n- 选项 C 错误。虚拟化允许创建虚拟资源，例如服务器操作系统。多个操作系统可以通过共享\
  \ `RAM`、硬盘和 `CPU` 等资源在同一台机器上运行。\n\n## 31. A. FTPS（安全文件传输协议）是 FTP（文件传输协议）的扩展，增加了对传输层安全协议（TLS）和安全套接层（SSL）安全技术的支持。\n\
  \n- 选项 B 错误。安全文件传输协议（SFTP）使用 `SSH` 将文件传输到远程系统，并要求客户端对远程服务器进行身份验证。\n- 选项 C 错误。安全\
  \ Shell（Secure Shell）是一种为管理员提供到远程计算机安全连接的协议。\n- 选项 D 错误。安全轻级目录访问协议（LDAPS）使用 `SSL`（安全套接层）在\
  \ IP 网络上安全地访问和维护目录信息。\n\n## 32. B. PIA（隐私影响评估）是一种用于收集个人身份信息（PII）的工具。它说明了收集哪些内容，以及信息将如何维护和如何受到保护。\n\
  \n- 选项 A 错误。BIA（业务影响分析）用于评估关键系统操作发生中断时，业务可能遭受的影响。这种中断可能是由于事故、紧急情况或灾难造成的。\n- 选项 C\
  \ 错误。RTO（恢复时间目标）是事件发生后恢复正常业务运行所需的时间。\n- 选项 D 错误。MTBF（平均故障间隔时间）是设备或组件的额，用于预测故障之间的预期时间。\n\
  \n## 33. D. 正确答案是定量的。使用特定的金额值来确定风险优先级。这就是为什么 `ALE`（年度预期损失）被分类为定量风险分析。\n\n- 选项 A\
  \ 错误。定性风险分析涉及用于评估风险的排名量表，而不是具体的数字。\n- 选项 B 错误。在风险分析完成之前无法计算 ROI（投资回报率）。\n- 选项 C\
  \ 错误。`SLE`（单次预期损失）与风险管理和风险评估有关，是每个种发生风险的预期货币损失。\n\n## 34. D. 公司将使用强制休假政策来检测欺诈，通过让熟悉职责的第二个人来帮助发现任何非法活动。\n\
  \n- 选项 A 错误。公司通常不希望许多员工同一时间离开。这将导致特定领域的短缺，并可能损害公司的安全态势。\n- 选项 B 错误。公司有“不使用作废”的休假政策，如果未在日历结束前休假将失效。强制休假政策不是确保员工休假正确天数的工具，这通常由人力资源部门维护。\n\
  - 选项 C 错误。公司确实希望员工得到充电以妥善履行职责，但从安全角度来看，这不是最佳答案。\n\n## 35. D. 恶意域名欺骗（Typosquatting）被攻击者用于将网络流量重定向到他们维护的另一个网站。攻击者通过购买拼写错误的\
  \ URL 并创建一个与原始网站类似的网站来实现这一点。攻击者可以尝试销售产品或在用户的计算机上安装恶意软件。\n\n- 选项 A 错误。会话劫持是攻击者通过捕获会话\
  \ ID 并冒充授权用户来接管网络用户会话的方法。这允许攻击者执行授权用户在网络上可以执行的任何操作。\n- 选项 B 错误。跨站脚本（XSS）允许攻击者在其他用户可以查看网页中插入客户端脚本。\n\
  - 选项 C 错误。重放攻击发生在攻击者捕获合法的网络传输，然后恶意重新传输以欺骗接收者进行未经授权的操作。\n\n## 36. D. 应该启用可信平台模块（TPM），因为它是一种专用芯片，称为硬件信任根，存储特定于操作系统的\
