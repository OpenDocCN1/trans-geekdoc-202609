  \ 的 `WPA2` 提供数据机性和身份验证。`CCMP` 使用 128 位密钥，被认为是防攻击的。\n\n* **Option B** 是错误的。有线等效隐私（`WEP`）是一种无线局域网（WLAN）的安全协议，已知存在漏洞，使其容易受到攻击。\n\
  * **Option C** 是错误的。并不存在带有 `CCMP` 的 `WPA`。`WPA` 采用了 `TKIP` 协议。\n* **Option D** 是错误的。WiFi\
  \ 安全设置（`WPS`）使用 8 位 `PIN` 码，容易受到暴力攻击。\n\n## 88\n**C.** 业务影响分析（`BIA`）通常识别与故障相关的成本。这些成本可能包括设备更换、为弥补工作损失而支付给员工的工资以及利润损失。\n\
  \n* **Option A** 是错误的。安全审计测试安全策略在保护公司资产方面的有效性，例如执行安全漏洞扫描。\n* **Option B** 是错误的。资产识别根据有关资产的已知信息识别系统资产。策略通常描述资产的目的和识别资产的方法。\n\
  * **Option D** 是错误的。灾难恢复计划（`DRP`）是一份描述响应意外事件步骤的文档。Tony 的工作是确定如果 `SQL` 服务器宕机会发生什么结果。`DRP`\
  \ 是在系统组件实际发生故障时的计划。\n\n## 89\n**A.** 云存储提供了防网络攻击的保护，因为数据有了备份。如果数据损坏，医院可以从云存储中恢复数据。\n\
  \n* **Option B** 是错误的。`Wiping`（擦除）是使移动设备上存储的数据无法访问的操作。\n* **Option C** 是错误的。安全信息事件管理（`SIEM`）实时识别、监控、记录和分析任何安全事件或事故。\n\
  * **Option D** 是错误的。数据控制与数据采集（`SCADA`）用于电厂，从远程位置实时收集和分析数据信息以控制设备。\n\n## 90\n**A.**\
  \ `logic bomb`（逻辑炸弹）是有插入的恶意代码，旨在在特定情况下执行。它设计用于显示虚假信息、删除或损坏数据，或其他产生意外的影响。\n\n* **Option\
  \ B** 是错误的。远程访问木马（`RAT`）是一种恶意软件程序，它允许通过后门对系统进行管理控制。\n* **Option C** 是错误的。`Spyware`（间谍软件）在用户不知情的情况下安装在计算机系统上。这被认为是跟踪软件，它可以收集击键并使用\
  \ Cookie 跟踪用户访问的网站。\n* **Option D** 是错误的。`Ransomware`（勒索软件）是一种除非支付赎金否则就会加密文件的恶意软件。\n\
  \n## 91\n**A.** `hacktivist`（黑客主义者）是有政治动机的黑客，利用现有技术寻找漏洞。`hacktivism`（黑客主义）是有目的的。\n\
  \n* **Option B** 是错误的。`insider`（内部人员）是从内部威胁公司的人。\n* **Option C** 是错误的。`script kiddie`（脚本小子）利用现有技术来利用漏洞。\n\
  * **Option D** 是错误的。`evil twin`是一个冒充真实接入点的非法接入点，使用户连接到它。\n\n## 92\n**C.** `Vishing`（语音诈骗）是一种社会工程，试图通过电话或\
  \ IP 语音（`VoIP`）通话欺骗个人。\n\n* **Option A** 是错误的。`Whaling`（大鲸钓鱼）是针对高层的网络钓鱼形式。\n* **Option\
  \ B** 是错误的。`Phishing`（网络钓鱼）是发送自称来自信誉良好的公司的，通过诱导个人点击欺诈链接来披露个人信息的做法。\n* **Option D**\
  \ 是错误的。`Spear phishing`（鱼叉式钓鱼）是一种针对个人的网络钓鱼形式。\n\n## 93\n**A, D, E.** 正确答案是 `third-party\
  \ store`（第三方商店）、`rooting`（根）和 `sideloading`（侧载）。限制这些选项将增加设备的安全性。第三方应用商店可能携带恶意软件。`Rooting`\
  \ 是获取设备特权控制的过程。对于具有根权限的用户来说，一切皆有可能，例如安装新应用程序、卸载系统应用程序和撤销现有权限。`Sideloading`是在不使用官方方案的情况下在设备上安装应用程序。\n\
  \n* **Option B** 是错误的。生物识别是指人的物理特征，如指纹、视网膜、手形和声音。\n* **Option C** 是错误的。内容管理系统用于创建和管理数字内容。\n\
  \n## 94\n**A, C.** 正确答案是 `IPSec` 和 `SSL`。`IPSec` 保护在远程网络和位于私有网络边缘的 `IPSec` 网关之间交换的\
  \ IP 包。安全套字层（`SSL`）通常为单个应用程序提供安全访问。\n\n* **Option B** 是错误的。数据加密标准（`DES`）是一种过时的对称密钥加密方法。\n\
  * **Option D** 是错误的。安全文件传输协议（`SFTP`）使用 `SSH` 传输文件并要求客户端对远程服务器进行身份验证。\n\n## 95\n\
  **D.** 公钥基础设施（`PKI`）在网络上安全地向用户和计算机发布公钥。它还验证公钥所有者的身份。\n\n* **Option A** 是错误的。无线保护访问（`WPA`）是一种无线局域网（WLAN）的安全协议。已知存在漏洞并容易攻击。\n\
  * **Option B** 是错误的。对象标识符是标识对象的唯一数值，以避免在合并不同目录时与另一个对象冲突。\n* **Option C** 是错误的。`PFX`\
  \ 是加密安全文件的扩展名，存储用于身份验证的安全证书。\n\n## 96\n**D.** 传递信任是在 Microsoft Active Directory\
  \ 森林中在父子域之间创建的双向关系。当创建子域时，它会自动与父域共享资源。这允许经过验证的用户访问子域和父域中的资源。\n\n* **Option A** 是错误的。多因素身份验证需要来自独立凭据的多种验证方法：你所知的、你拥有的以及你所是的。\n\
  * **Option B** 是错误的。联邦（Federation）是指以集体方式约定操作标准的网络提供商组。\n\n\n\n\n\n* 选项 C 错误。单点登录\
  \ (SSO) 是允许用户使用一组凭据登录并访问多个资源的能力。\n\n### 97. C. 身份识别（Identification）用于识别系统内的用户。它允许每个用户与其他用户区分开来。\n\
  \n* 选项 A 错误。授权（Authorization）决定用户对计算机程序、文件和数据等资源的权限或访问级别。\n* 选项 B 错误。身份验证（Authentication）根据所提供的凭据确认用户的身份。\n\
  * 选项 D 错误。审计（Accounting）是跟踪用户在网络内活动的过程。这些活动包括访问的服务、访问或传输的数据量，以及用于身份验证和授权的登录。\n\n\
  ### 98. B. 隐写术（Steganography）是将文件等信息隐藏在图片中的实践。\n\n* 选项 A 错误。数据清理（Data sanitization）是永久删除存储在内存设备上的数据行为。\n\
  * 选项 C 错误。`Tracert` 是 Windows 命令行工具，用于显示您的计算机与指定目标之间的互联网路由。\n* 选项 D 错误。网络映射（Network\
  \ mapping）发现并显示网络内的物理和虚拟连接性。\n\n### 99. B, D.正确答案是静态 ARP 条目和端口安全。静态 ARP 条目是将 MAC\
  \ 地址分配给 IP 地址的过程，以防止攻击者污染缓存。禁用未使用的物理端口将防止攻击者插入笔记本电脑并进行 ARP 投毒。\n\n* 选项 A 错误。杀病毒软件设计用于防止、检测和移除用户计算机中的恶意软件感染。\n\
  * 选项 C 错误。补丁管理（Patching management）是为局域网内的计算机收集、测试和安装补丁的过程。\n\n### 100. D. 隐式拒绝（Implicit\
  \ deny）位于列表底部。如果流量通过了 ACL 规则列表且未被显式拒绝或允许，隐式拒绝将拒绝该流量，因为它是最后规则。换句话说，如果流量在访问列表中没有被显式允许，则默认拒绝。\n\
  \n* 选项 A 错误。USB 阻塞是禁止用户插入 USB 设备，并可能从 PC 传输文件或通过 USB 设备用恶意软件感染网络的行为。\n* 选项 B 错误。时间同步确保所有设备具有相同的时间。这非常重要，因为网络管理、安全和调试的所有方面都取决于事件发生时的时间。\n\
