  \ 是 `WLAN` 和点对连接的认证框架。`EAP` 定义了消息格式，未使用隧道进行加密。\n\n### 90. B. 自签名证书会在浏览器中显示错误，说明该站点不受信任，因为自签名证书不是来自受信任的证书颁发机构。\n\
