  \n### 60. **B.** 跨站请求伪造（CSRF）攻击发生在攻击者欺骗用户在当前已验证的网站上执行意外操作时。\n\n* 选项 A 错误。重放攻击发生在合法网络传输被攻击者捕获并恶意重新传输以欺骗接收者进行未经授权的操作。\n\
  * 选项 C 错误。跨站脚本（XSS）允许攻击者向用户查看的网页中注入客户端脚本。\n* 选项 D 错误。缓冲区溢攻击发生在程序尝试在缓冲区（内存）中放置超出容量的数据时。此操作可能会损坏数据、程序崩溃或执行恶意代码。\n\
  \n### 61. **C.** 正确答案是强制访问控制（`MAC`）。通过比较安全标签和机密、秘密和绝密等安全许可来控制访问。\n\n* 选项 A 错误。基于角色的访问控制（`RBAC`）根据用户在系统中的角色以及规定角色允许访问的规则控制访问。\n\
