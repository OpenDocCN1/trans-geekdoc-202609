  \n### 第 1 章：威胁、攻击与漏洞\n\n1. B. 正确答案是启动扇病毒，它会影响硬盘的启动扇。因此，你启动到哪种操作系统并不重要。\n* 选项 A 错误。在该攻击的描述中没有勒索的元素。\n\
  * 选项 C 错误。根基程序 (Rootkit) 有时也会影响启动扇，但在这种情况下，启动扇病毒是最准确的描述。\n* 选项 D 错误。该描述中没有任何迹表明键键记录。\n\
  \n2. C. 正确答案是针对性网络钓鱼。针对性网络钓鱼针对特定的群体（在本例中是保险专业人士）。攻击者可以从公共来源找到个人并进行针对。这被称为开源情报收集。\n\
  * 选项 A 错误，因为这个范畴太广了。\n* 选项 B 错误，虽然社会工程是每个网络钓鱼攻击的一部分，但这不仅仅是社会工程。\n* 选项 D 错误，因为这不是特洛马。\n\
  \n3. B. 正确答案是逻辑炸。逻辑炸在满足某些条件时执行其恶意活动。\n* 选项 A 错误，因为蠕虫会自我传播。\n* 选项 C 错误，因为特洛马是附带在合法程序中的恶意软件。\n\
  * 选项 D 错误，因为根基程序获取的是 root 或管理员权限。\n\n4. C. 正确答案是身份识别。SQL 注入涉及在文本区域中输入 SQL 命令。\n\
  * 选项 A 错误。会话劫持涉及接管已认证的会话。大多数会话劫持攻击涉及伪装。攻击者试图通过装成该用户获得对另一个用户会话的访问。\n* 选项 B 错误。点击劫骗涉及导致访问网站的用户点击错误的项目。\n\
  * 选项 D 错误。蓝牙攻击是一种蓝牙攻击。\n\n5. B. 正确答案是 SYN 洪水。半开放连接是 SYN 洪水的特征。\n* 选项 A 错误。我们从题目知道这是分布式拒绝服务。\n\
  * 选项 C 错误。缓冲区溢出涉及向变量或数组中放入过多的数据。\n* 选项 D 错误。ARP 中毒更改了交换机中的 ARP 表；它与网站攻击无关。\n\n6.\
  \ B. 防御上述攻击的主要且最佳方法是过滤用户输入。\n* 选项 A 错误。加密网络流量对这些攻击没有影响。\n* 选项 C 错误。Web 应用防火墙 (WAF)\
  \ 可能会缓解这些攻击，但它是过滤用户输入的次选。\n* 选项 D 错误。入侵检测系统 (IDS) 只会检测攻击——不会阻止它。\n\n7. C. 如果用户一直在连接但\
  \ WAP 未显示他们正在连接，那么他们连接到了恶意访问点。这可能是架构和设计缺陷引起的，例如网络缺乏分段和对连接网络设备的控制。\n\n8. C. 跨站脚本\
  \ (XSS) 涉及在文本区域中输入其他用户将看到的脚本。\n* 选项 A 错误。SQL 注入不是输入脚本，而是 SQL 命令。\n* 选项 B 错误。点击劫骗是诱骗用户点击错误的内容。\n\
  * 选项 D 错误。蓝牙攻击是一种蓝牙攻击。\n\n\n\n\n\n## 9. B. 木洛马将恶意程序封装在合法程序中。当用户下载并安装该合法程序时时，他们就会得到恶意软件。\n\
  \n- 选项 A 错误。逻辑炸弹（logic bomb）是在满足某些条件时执行作恶行为的恶意软件。\n- 选项 C 错误。根内核（rootkit）是获取管理员权限或\
