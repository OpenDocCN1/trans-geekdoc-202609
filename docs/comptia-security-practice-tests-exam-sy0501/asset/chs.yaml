  \ C. 在非对称加密（也称为公钥加密）中，私钥用于解密加密后的文件。\n- 选项 A 错误。哈希（Hashing）是一种单向加密，它将字符字符串转换为固定长度的值或密钥，也称为哈希值。哈希确保数据或消息的完整性。\n\
  - 选项 B 错误。对称加密使用相同的密钥对数据进行加密和解密。\n- 选项 D 错误。密钥托管 (Key escrow)` 是一种加密密钥交换过程，密钥由第三方存储。如果原始用户的密钥丢失或泄露，可以使用存储的密钥来解密加密材料，从而将原始材料恢复到未加密状态。\n\
  \n### 54. B 和 D。为了不可否认目的对数据进行签名，发送者使用其私钥；而在加密数据时，发送者使用接收者的公钥。\n- 选项 A 错误。接收者的私钥由接收者私密。\n\
  - 选项 C 错误。发送者的公钥用于加密发送给发送者的数据，并由其私钥解密。\n\n### 55. D. 对称加密使用相同的密钥对数据进行加密和解密，因此必须以安全的方式将密钥发送给接收者。如果在中间获取了密钥，他们就能解密信息并读取数据或向其注入恶意软件。\n\
  - 选项 A, B, C 错误。这些语句描述的是非对称加密。\n\n### 56. B. `密钥托管 (Key escrow)` 是一种安全措施，加密密钥由第三方托管，在正常情况下，未经适当授权，密钥不应释放给发送者或接收者以外的人。\n\
