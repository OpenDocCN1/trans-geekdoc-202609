  - 选项 C 错误。`死亡之包 (Ping of death)` 是一种拒绝服务攻击，攻击者发送比 `IP` 协议允许更大的 `IP` 数据包。该 `IP` 包会被拆分成更小的段，导致系统崩溃。\n\
