  - 选项 C 错误。这不是缓冲区溢出，检查缓冲区边界没有帮助。\n\n## 14. B. 这是缓冲区溢出（buffer overflow）的描述。\n\n- 选项\
  \ A 错误。蓝牙嗅探（Bluesnarfing）是一种蓝牙攻击。\n- 选项 C 错误。蓝牙劫持（Bluejacking）是一种蓝牙攻击。\n- 选项 D 错误。这不是分布式拒绝服务。\n\
