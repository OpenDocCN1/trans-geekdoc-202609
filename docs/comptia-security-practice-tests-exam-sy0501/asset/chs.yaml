  \ WiFi 网络的计算机的安全标准。\n\n### 134. A 和 B。攻击者可以实施窃听和中间人攻击。使用私钥进行窃听可以允许攻击者看到明文数据。中间人攻击可以允许攻击者修改传输到服务器的数据，例如在数据中添加恶意软件。\n\
