  \ 2。\n- 选项 D 错误。该总数来源于 `N` (`N`–1)，它是计算所需对称密钥数量公式的一部分。\n\n### 28. B.\n对称算法（也称为秘密密钥算法）使用相同的密钥对数据进行加密解密。\n\
  \n- 选项 A 错误。非对称算法（也称为公钥加密）使用公钥和私钥对数据进行加密解密。\n- 选项 C 错误。`Hashing`（哈希）是一种单向加密，将字符字符串转换为固定长度的值或密钥，也称为哈希值。哈希确保数据或消息的完整性。\n\
