  * Option C 错误。垫片（Shimming）涉及在程序和库之间插入代码。\n* Option D 错误。语音钓骗（Vishing）是通过电话线路（通常是\
  \ VoIP）进行的网络钓骗。\n\n### 149. C. 主动扫描实际上连接到目标网络。\n* Option A 错误。被动扫描实际上不会连接到目标网络。\n\
