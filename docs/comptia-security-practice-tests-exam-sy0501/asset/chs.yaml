  \ A. 数字证书使用 `X.509` 标准（或 `PGP` 标准），允许用户对身份验证请求进行数字签名。\n- 选项 B 错误。`OAUTH` 允许第三方服务使用用户的账户信息，而无需暴露用户的密码。它不使用数字证书也不支持数字签名。\n\
  - 选项 C 错误。Kerberos 不使用数字证书，也不支持数字签名。\n- 选项 D 错误。智能卡可以包含数字证书，但并不一定包含。\n\n## 47. C.\
  \ `SAML`（安全断言标记语言）是一种扩展标记语言（`XML`）框架，用于在在线合作伙伴之间创建和交换安全信息。用户的完整性是 `SAML` 身份链中的弱点。为了降低这种风险，`SAML`\
  \ 系统需要使用超时会话、`HTTPS` 和 `SSL/TLS`。\n- 选项 A 错误。`LDAP`（轻量级目录访问协议）是一种允许用户在网络中定位个人以及文件、设备等资源的协议。\n\
  - 选项 B 错误。`TACACS+` 是一种用于控制网络访问的协议。`TACACS+` 在对中央数据库进行访问请求计费的同时，还提供身份验证和授权。\n- 选项\
  \ D 错误。传递信任是 Microsoft Active Directory 森林中父域和子域之间自动创建的双向关系。它默认与父域共享资源，并允许经过验证的用户访问子域和父域的资源。\n\
  \n## 48. C. 权限审计将准确告诉 Greg 目前的状况如何。他必须了解现在正在发生什么，以便解决任何弱点。\n- 选项 A 错误。最小密码长度是一个好主意，但他首先需要了解当前状况。\n\
  - 选项 B 错误。密码锁定是一个好主意，但他首先需要了解当前状况。\n- 选项 D 错误。确保最小权限非常重要，但 Greg 必须先进行权限审计，以确定是否遵循了这一原则。\n\
  \n## 49. D. 账户维护的一个重要部分是检查所有账户，以确保不再任职的员工没有活跃账户。\n- 选项 A 错误。双因子身份验证总是首选的，但它不是账户维护的一部分。\n\
  - 选项 B 错误。时间限制是可选的。如果实施了这些限制，那么它们就是账户维护的一部分，但选项 D 是更好的答案，因为它始终是账户维护的一部分。\n- 选项 C\
  \ 错误。入职流程（与离职流程一样）至关重要，但通常不被认为是账户维护的一部分。\n\n## 50. C. 基于位置的策略可以防止任何来自物理网络内部的登录。在这种场景下，由于没有员工远程工作，这种策略是具有实际意义的。它可以防止攻击者从网络外部使用员工的登录。\n\
  - 选项 A 错误。Kerberos 是一种有效的身份验证协议，但如果攻击者拥有用户的登录凭据，Kerberos 无法阻止他们登录。\n- 选项 B 错误。基于时间的一次性密码（`TOTPs`）在日常使用并不实际。\n\
  - 选项 D 错误。基于组的访问控制无法防止拥有用户登录凭据的攻击者。\n\n## 51. B. 如果系统维护密码历史，将防止用户重复使用旧密码。密码历史可以多达\
  \ 24 个。\n- 选项 A 错误。密码复杂度总是首选的，但不是账户维护的一部分。\n- 选项 A 和 C 错误。密码长度和复杂度虽然重要，但无法缓解这一问题。\n\
  - 选项 D 错误。密码年龄表示更改密码的频率，不影响密码重复使用。\n\n## 52. A. 审计并审查用户如何利用其账户权限是判断是否存在不当使用的最佳方法。一个经典的例子是银行贷款员。由于工作的性质，他们有权访问贷款文件。但他们应该访问他们未负责的贷款文件。\n\
  - 选项 B 错误。在这种情况下，问题不是权限，因为用户确实拥有访问数据的权限。问题在于他们如何使用这些权限。\n- 选项 C 错误。使用审计和权限审计都是账户维护的一部分，但答案\
  \ A 直接回答了问题中的问题。\n- 选项 D 错误。这不是策略问题。\n\n## 53. B. 像访客 WiFi 访问这样的场景不会为登录用户提供任何公司资源的访问。登录的人仅仅可以访问互联网。这对公司网络的安全风险有限，因此通常使用公共或共享账户。\n\
  - 选项 A 错误。技术支持人员通常具有对公司网络资源的重大访问权限。\n- 选项 C 错误。虽然这是一个访问权限较低的场景，但仍然知道是哪个特定学生登录并访问了资源是很重要的。\n\
  - 选项 D 错误。任何层级的公司资源访问都应该有自己的独立登录账户。\n\n## 54. B. 虽然密码长度很重要，但它不是密码复杂度的一部分。\n\n\n\n\
  \n\n* 选项 A、C 和 D 都是错误的。这些都属于密码复杂度。密码复杂度意味着密码包含大写字母、小写字母、数字和符号。\n\n### 55. A. 凭据管理（Credential\
  \ management）专门为此设计，并且是专门用于联邦身份的。事实上，微软有一个程序员可以使用的凭据管理 API 来实现这一点。\n* 选项 B 是错误的。`OAUTH`\
  \ 允许第三方服务使用用户的账户信息，而无需暴露用户的密码，它被用于服务，而不是联邦身份。即使是登录的服务也不会知道密码。\n* 选项 C 是错误的。`Kerberos`\
  \ 是一种网络/域认证协议。\n* 选项 D 是错误的。`Shibboleth` 是一种用于身份鉴别和身份管理的中间件解决方案，它使用 `SAML`（安全断言标记语言）并在互联网上运行。\n\
  \n### 56. B. 需要正式的密码恢复流程。这使得用户有可能找回忘记的密码。\n* 选项 A 是错误的。这种方法可能有效（也可能无效），但会对安全产生负面影响。\n\
  * 选项 C 是错误的。这种方法可能有效（也可能无效），但会对安全产生负面影响。\n* 选项 D 是错误的。这种方法可能有效（也可能无效），但会对安全产生负面影响。\n\
  \n### 57. D. 密码过期意味着即使离职员工的登录没有被禁用，密码也会过期，而无需任何人采取任何行动。\n* 选项 A 是错误的。密码复杂度无法解决这个问题。它只会让密码更难被破解。\n\
  * 选项 B 是错误的。离职处理（`Offboarding`）在这种情况下会有帮助，并且应该实施。但即使没有遵循离职程序，密码也会自动过期。这就是为什么密码过期是更好的答案的原因。\n\
  * 选项 C 是错误的。入职处理（`Onboarding`）涉及将新员工带入团队，而不是离职员工的过程。\n\n### 58. D. `802.1x` 是基于端口的网络访问控制的\
  \ IEEE 标准。该协议经常被用于对设备进行认证。\n* 选项 A 是错误的。挑战握手认证协议（Challenge handshake protocol）是一种认证协议，但不是设备认证的最佳选择。\n\
  * 选项 B 是错误的。`Kerberos` 是一种认证协议，但不是设备认证的最佳选择。\n* 选项 C 是错误的。`802.11i` 是 WiFi 安全标准，并在\
  \ `WPA2` 中完全实现。它不是一种设备认证程序。\n\n### 59. C. 多因素身份验证使用了三个类别中至少两个类别中的至少认证方法。例如，密码（类型\
  \ I：你所知道的）和刷卡（类型 II：你拥有的）。多因素身份验证是最强的认证。\n* 选项 A、B 和 D 都是错误的。这些每一种都是很好的认证方法，但它们都仅仅是单一因素。\n\
  \n### 60. B. 轻级目录访问协议（`LDAP`）通常被描述为网络的电话簿。它列出了所有的网络资源。对 `LDAP` 的各种攻击可以给攻击者提供关于你网络的非常详尽清单。此外，攻击者可以从\
  \ `LDAP` 中删除项目，从而使其无法访问。`LDAP` 可以通过 `TLS` 进行加密，从而变为 `LDAPS`（安全 LDAP）。\n* 选项 A 是错误的。简单网络管理协议（`SNMP`）会给攻击者提供大量关于你网络的信息，但不是全部。此外，它不会允许攻击者使资源不可用。\n\
  * 选项 C 是错误的。超文本传输协议（`HTTP`）用于网页。\n* 选项 D 是错误的。动态主机配置协议（`DHCP`）用于动态分配 IP 地址。\n\n\
  ### 61. C. 密码认证协议（`PAP`）是一种非常老老的协议，它以明文发送用户名和密码。这不应该再被使用了。\n* 选项 A、B 和 D 都是正确的；然而，这些并不是\
  \ `PAP` 最主要的问题。\n\n### 62. A. 对于较大的组织，基于组的管理通常是最有效的。用户被分到组（学生、教职员工、IT 人员、支持人员、管理人员等），并对组进行权限管理。\n\
  * 选项 B 是错误的。基于位置的管理无法帮助管理大量的用户。\n* 选项 C 是错误的。`MAC` 非常安全，但需要细粒度的账户管理，这在如此大的用户组中是不行的。\n\
  * 选项 D 是错误的。`DAC` 对于大多数情况来说就是不够安全。\n\n### 63. A. 账户的定期重新认证至关重要。重新认证过程验证账户持有者是否仍然需要他们被授予的权限。\n\
  * 选项 B 是错误的。可以进行使用审计来支持重新认证，但它没有重新认证过程重要。\n* 选项 C 是错误的。标准的命名规范没有帮助。\n* 选项 D 是错误的。账户恢复无助于管理权限。\n\
  \n### 64. D. 虽然你应该使用标准的命名规范，但账户名称不应反映实际的账户角色。\n* 选项 A、B 和 C 都是错误的。这些每一个都清楚地指示了账户持有者的角色。\n\
  \n### 65. B. 对文件和目录的访问控制是文件系统安全最基础的方面。这包括选择正确的访问控制方法（`MAC`、`DAC`、`RBAC`）。\n* 选项\
  \ A 是错误的。加密是文件系统安全的良好技术，但不是最基础的。\n* 选项 C 是错误的。文件系统安全绝对建议审计，但不是最基础的。\n* 选项 D 是错误的。`RAID`\
  \ 提供容错能力，这对于服务器当然是必要的，但不是文件系统安全最基础的形式。\n\n### 66. B. 虽然该账户存在多个问题，但密码长度是最显著的。较短的密码本质上是不安全的。\n\
  * 选项 A 是错误的。即使对于低安全账户，这些参数也是不安全的。\n* 选项 C 和 D 都是错误的。这两个都是问题，但密码长度是最显著的。如果密码复杂且长（可能超过\
  \ 14 个字符），缺乏密码历史记录和密码有效期就没那么严重了。\n\n### 67. C. 禁用离职用户的所有账户应该立即执行。\n* 选项 A 和 B 都是错误的。虽然这些操作都可以执行，但它们不会在禁用账户之前执行。\n\
  * 选项 D 是错误的。你不应该删除账户。这可能会某些数据（日志、文件等）无法访问。只需禁用账户。\n\n### 68. D. `TACACS+` 可以使用 `TCP`\
  \ 或 `UDP`，尽管通常使用 `TCP`。还应该注意 `TACACS+` 不向兼容。\n* 选项 A、B 和 C 都是错误的。这些没有准确描述 `TACACS+`。\n\
  \n### 69. D. `CHAP` 使用哈希（通常是 `MD5`）进行认证，`MS-CHAPv2` 也是如此。然而，`MS-CHAPv2` 提供了双向认证，而\
  \ `CHAP` 仅提供客户端对服务器的认证。\n\n### 70. B. 使用挑战响应令牌时，系统将使用用户的公钥加密某个值（通常是随机数）。如果用户的令牌具有正确的私钥，它就可以解密系统发送的值并进行确认。\n\
  * 选项 A 是错误的。异步密码令牌在不需要时钟的情况下生成一次密码。\n* 选项 C 是错误的。`TOTP` 是时间同步的一次性密码。\n\n\n\n\n\n\
  - 选项 D 错误。静态密码令牌仅包含一个密码。\n\n### 71. D. 任意访问控制 (`DAC`) 基于信任可信计算机系统评估标准 (`TCSEC`)。数据所有者对访问控制具有控制权。\n\
  \n- 选项 A、B 和 C 均错误。这些模型并非基于 `TCSEC`。\n\n### 72. B. 虽然这些功能对安全都至关重要，但加密文件系统 (`EFS`)\
  \ 允许用户轻松地加密任何文件或文件夹。这对于文件系统的安全至关重要。\n\n- 选项 A 错误。密码策略很重要，但没有加密文件和文件夹对文件系统的安全性重要。\n\
  - 选项 C 错误。账户锁定和密码策略一样重要。但 `EFS` 对文件系统的安全性更为核心。\n- 选项 D 错误。用户账户控制防止未经授权的应用程序运行，这是很重要的。但它对文件系统的安全性不如\
  \ `EFS` 核心。\n\n### 73. D. 访问控制是数据库安全最重要的问题。遵循最小权限原则并确保每个数据库用户仅访问其工作所需的数据是非常关重要的。\n\
  \n- 选项 A 错误。密码策略很重要，但重要性不如访问控制。\n- 选项 B 错误。防病毒软件总是重要的。但数据库服务器通常不用于网页浏览或电子邮件（这是清除病毒的两种常用手段），这意味着防病毒软件的重要性不如访问控制。\n\
  - 选项 C 错误。加密文件对数据库安全的性性不如访问控制。访问时必须解密；因此，访问控制更重要。\n\n### 74. C. 重新认证是一种检查权限的方法。它本质上涉及对账户进行认证，就像它们是新账户一样。这可以用来审计权限。\n\
  \n- 选项 A 错误。虽然使用审计与权限审计有关，但它们不是同一个主题。\n- 选项 B 错误。重新认证不是入职流程的一部分。\n- 选项 D 错误。凭证管理很重要，但不属于重新认证的一部分。\n\
  \n### 75. A. 虽然密码管理器存在安全疑虑，但它们可以提供一种存储大量密码的方法，让使用户不需要记住所有密码。\n\n- 选项 B 错误。使用较短的密码会损害安全性。\n\
  - 选项 C 错误。`OAUTH` 允许第三方服务使用用户的账户信息，而无需暴露用户的密码。它不会减少用户需要记住的密码数量。\n- 选项 D 错误。`Kerberos`\
  \ 是一种优秀的身份验证协议，但不会减少必须记住的密码数量。\n\n### 76. C. 账户在少量登录尝试后应被锁定。账户锁定之前，常见的尝试次数是三次。这可以防止有人仅尝试随机猜测。\n\
  \n- 选项 A 错误。密码过期会强迫用户更改密码，但不会影响密码破解。\n- 选项 B 错误。更长的密码更难破解，但不如账户锁定策略有效。\n- 选项 D 错误。账户使用审计对此问题不会产生任何影响。\n\
  \n### 77. A. 安全断言标记语言 (`SAML`) 是一种基于 XML 的开放标准格式，用于在双方之间交换身份验证授权数据。\n\n- 选项 B 错误。`OAUTH`\
  \ 允许第三方服务使用用户的账户信息，而无需暴露用户的密码。\n- 选项 C 错误。`RADIUS` 是一种远程访问协议。\n- 选项 D 错误。`NTLM`\
  \ 是 Windows 哈希密码的方式。\n\n### 78. B. 身份验证是验证身份的过程。当用户提供凭据（用户名和密码）时，它将与本地操作系统数据库或身份验证服务器中的现有记录进行比对。\n\
  \n- 选项 A 错误。识别是提供如用户名等信息以声称某种身份的过程。\n- 选项 C 错误。授权是授予用户执行某些操作权限的过程。\n- 选项 D 错误。审计是记录会话和使用信息的过程。这包括用户使用资源的时间或用户在会话期间发送或接收的数据量。\n\
  \n### 79. B. 强制访问控制 (`MAC`) 是一种由操作系统执行规则的访问类型。\n\n- 选项 A 错误。任意访问控制 (`DAC`) 允许去中心化控制。用户可以覆盖认证。\n\
  - 选项 B 错误。基于角色的访问控制 (`RBAC`) 根据用户所在的组提供访问。\n- 选项 C 错误。基于属性的访问控制 (`ABAC`) 查看一组环境属性。\n\
  \n### 80. D. 误接受率 (`CER`) 也称为误拒率 (`EER`)。\n\n- 选项 A、B 和 C 错误。这些选项中没有一个准确描述了。\n\n\
  ### 81. A. 挑战握手身份验证协议 (`CHAP`) 专为此设计。它定期进行重新认证，从而防止劫持。\n\n- 选项 B 和 C 错误。这两者不能防止会话劫持。\n\
  - 选项 D 错误。`RADIUS` 是用于远程访问的协议。\n\n### 82. C. OpenID connect 与 OAuth 2.0 协议配合，并支持包括网页和移动在内的多个客户端。\n\
  \n- 选项 A 错误。`Shibboleth` 是一种用于身份验证和身份管理的中间解决方案，使用 `SAML`（安全断言标记语言）。\n- 选项 C 错误。`RADIUS`\
  \ 用于远程访问。\n- 选项 D 错误。`OAUTH` 允许第三方服务使用用户的账户信息，而无需暴露用户的密码。\n\n### 83. B. 近距离卡只需要非常读卡器即可正常工作。\n\
  \n- 选项 A 错误。智能卡可以包含近距离卡，但不必包含。某些智能卡不基于近距离工作，必须插入或刷卡。\n- 选项 C 错误。令牌没有免手选项。\n- 选项\
  \ D 错误。显然，指纹扫描仪不是免手的。\n\n### 84. D. 联邦身份引入了传递信任。登录账户可以在多个业务实体之间使用，从而在它们之间建立了隐含的信任关系。任何联邦身份的安全性都会受到其他身份的影响。\n\
  \n- 选项 A 错误。`Kerberos` 可以配置为远程令牌授予服务器与联邦身份协作。\n- 选项 B 和 C 错误。联邦身份的使用对最小权限没有影响。\n\
  \n### 85. C. 第二类身份验证是你所拥有的东西。智能卡是人拥有的物品。\n\n- 选项 A 错误。密码是你所知的，第一类。\n- 选项 C 错误。视网扫描和所有生物识别都是你所的，第三类。\n\
  - 选项 D 错误。这些仍然是密码，因此是第一类。\n\n### 86. A. `TPM`（可信平台模块）可以用于身份验证。这些是计算机芯片，因此是基于硬件的访问控制。\n\
  \n\n\n\n\n- 选项 B 错误。虽然可以认为所有硬件至少都有固件在运行，但基于软件的访问控制对这种场景并不是良好的描述。\n- 选项 C 错误。TPM\
  \ 可能使用数字证书，但本题并未指定该特定的 TPM 使用或没有使用数字证书。\n- 选项 D 错误。虽然语法上正确，但这不是行业中使用的术语。\n\n# 第\
  \ 5 章：风险管理\n\n1. **C. 不利性措施是针对员工采取的行政措施。** 这些措施包括警告信、有薪或无薪休假或终止合同。除了这些措施外，政策还应包括禁用用户账户和撤销权限（如访问访问权限）等措施，以防止数据泄露。当员工被采取行政措施时，公司不应担心他们会针对公司采取报复性行为。\n\
  \    - 选项 A 错误。强制休假政策被公司用于检测欺诈，通过让另一个熟悉职责的第二人帮助发现任何非法活动。\n    - 选项 B 错误。离职面试让公司有机会发现部门内部的问题。它们还允许人力资源部门识别任何即将丢失的知识，例如员工知道但未记录在任何地方的信息。\n\
  \    - 选项 D 错误。入职（Onboarding）是将员工添加到公司身份和访问管理系统的过程。\n\n2. **C. 变更管理是记录对公司网络和计算机所做的所有更改的过程。**\
  \ 避免同时进行更改使得跟踪任何可能发生的问题变得简单得多。\n    - 选项 A 错误。尽职调查（Due diligence）是调查和验证特定行为准确性的过程。\n\
  \    - 选项 B 错误。可接受使用（Acceptable use）是一项规定了用户在公司网络或互联网上可以或不可以访问的内容的政策。\n    - 选项\
  \ D 错误。正当（Due care）是合理方为避免伤害他人而付出的努力。它是一个人在某些情况下合理预期会做到的判断、谨慎、决心和活动水平。\n\n3. **A.\
  \ 避免渗透测试的主要原因是答案 A。** 建议经常进行漏洞测试而不是渗透测试。渗透测试会对业务造成干扰。这是本题的关注重点。\n    - 选项 B、C 和\
  \ D 错误。这些选项是执行渗透测试的积极理由。\n\n4. **A. 可接受使用策略是一份文档，规定了用户在公司网络或互联网上可以或不可以访问的内容。**\n\
  \    - 选项 B 错误。整洁桌面政策（Clean desk policy）确保在文档未使用时，所有敏感/机密文档从终端用户工作站移除并锁好。\n    -\
  \ 选项 C 错误。强制休假政策被公司用于检测欺诈，通过让另一个熟悉职责的第二人帮助发现任何非法活动。\n    - 选项 D 错误。工作轮岗（Job rotation）是一项描述在不同任务之间移动员工以促进经验和多样性的政策。\n\
  \n5. **D. 在离地存储之前对备份数据进行加密确保了机密性。**\n    - 选项 A 错误。生成文件哈希将确保完整性；即文件没有被更改或被篡改。\n\
  \    - 选项 B 错误。扫描备份数据中的病毒是在数据恢复之前执行的任务。\n    - 选项 C 错误。监管链（Chain of custody）是指显示物理或电子证据的保管、控制、传输、分析和处置的按顺序记录。\n\
  \n6. **C. 热备机房（Hot site）包含了灾难发生所需的所有备用计算机和电信设备。** 测试这种环境很简单。\n    - 选项 A 错误。温备机房（Warm\
  \ site）更难测试，因为它包含设备但没有员工和公司数据。\n    - 选项 B 错误。冷备机房（Cold site）最难测试，因为它包含一个带有有限设备的房间。\n\
  \    - 选项 D 错误。中备机房（Medium site）不是被称为恢复站点。\n\n7. **B. 交换机仅将数据转发到需要它的设备**，因此在捕获网络流量时，计算机只会看到广播包和组播包，以及发送和接收到连接计算机的流量。\n\
  \    - 选项 A 错误。隔离广播域内的以太网交换机会将广播包发送到该域的所有计算机。整个交换机可以是一个广播域，也可以某些端口分组为 `VLAN`（虚拟局域网）。\n\
  \    - 选项 C 错误。`NIC` 启用混杂模式将捕获网络内的所有流量，但这并不是该场景中的问题。\n    - 选项 D 错误。`NIC` 禁用混杂模式不会捕获网络内的所有流量，只会捕获广播、组播包以及从计算机发送和接收的流量。该场景关注的是以太网交换机，而不是笔记本电脑的\
  \ `NIC`。\n\n8. **A. 快照是系统在特定时间点的状态。** 它也被称为系统映像，不是事件响应过程中的一个步骤。\n    - 选项 B、C 和\
  \ D 错误。准备、恢复和封制是事件响应过程的步骤。\n\n9. **B. 技术控制用于限制数据访问**以及操作系统组件、安全应用程序、网络设备和加密技术。逻辑控制使用身份验证机制。\n\
  \    - 选项 A 错误。访问控制可以是技术控制的一部分；但它不是与技术控制同义的词。\n    - 选项 C 错误。检测性控制（Detective controls）在入侵发生时检测入侵并发现违规行为。\n\
  \    - 选项 D 错误。预防性控制（Preventive controls）在安全漏洞或关键服务中断发生之前避免它们。\n\n10. **A. 公司将使用强制休假政策检测欺诈**，通过让另一个熟悉职责的第二人帮助发现任何非法活动。\n\
  \    - 选项 B 错误。整洁桌面政策确保在文档未使用时，所有敏感/机密文档从终端用户工作站移除并锁好。\n    - 选项 C 错误。保密协议（NDA）保护敏感和知识产权数据不落入他人手中。\n\
  \    - 选项 D 错误。继续教育是对成年学习者进行广泛的高等学习活动和计划的过程。公司将利用继续教育培训员工应对新威胁，并重申当前政策及其重要性。\n\n\
  11. **A. 隐私影响评估（PIA）是对公司在拥有个人身份信息（PII）时如何保护隐私信息的衡量。**\n    - 选项 B 错误。业务影响分析（BIA）确定灾难或紧急情况下公司运营中断的潜在影响。\n\
  \    - 选项 C 错误。恢复时间目标（RTO）是公司流程在灾难后必须恢复的时间长度。\n    - 选项 D 错误。单点故障（SPF）是一个如果发生故障将导致整个系统无法运行的组件。\n\
  \n12. **B. 业务连续性计划是一项描述并批准公司整体业务连续性策略的政策。** 这还包括识别需要保护的关键系统。\n\n\n\n\n\n*   选项 A\
  \ 错误。灾难恢复计划（DRP）是一项描述并批准公司灾难恢复策略的政策。该计划将帮助公司以最小的时间和金钱损失从事件中恢复。\n\n*   选项 C 错误。IT\
  \ 应急计划是业务连续性计划（BCP）的一个组成部分。它规定了公司在面临服务中断导致公司灾难时，可以切换的备用 IT 流程。\n\n*   选项 D 错误。继任计划（Succession\
  \ plan）确保公司所有关键人员都至少有一位指定的备份人员，能够在需要时执行关键功能。\n\n13. **B.** 锁上柜和抽屉是最佳解决方案，因为该员工是唯一拥有钥匙的人。\n\
  \n*   选项 A 错误。多个人可能有部门门锁的钥匙。\n\n*   选项 C 错误。近距离卡是一种非接触式智能卡，通过靠近电子读卡器来授予访问特定区域的权限。\n\
  \n*   选项 D 错误。入职（Onboarding）是将员工添加到公司身份和访问管理系统的过程。\n\n14. **D.** 桌面演练测试被认为是在实施测试之前识别计划中重叠区域的一种成本效益且高效的方法。\n\
  \n*   选项 A 错误。事后报告检查对事件或演练的响应，并识别将维持和在此基础上发展的优点。此外，它有助于识别潜在的改进领域。\n\n*   选项 B 错误。故障转移（Failover）是指自动且无缝切换到高可靠备份的持续能力。当主服务器故障时，可以通过冗余方式或备用运行模式激活。故障转移的主要目的是为用户提供数据或服务的可用性。\n\
  \n*   选项 C 错误。清除（Eradication）过程涉及通过重新对系统硬盘映像并安装补丁来移除并恢复受影响的系统。\n\n15. **C.** 根据\
  \ HIPAA 规则，指纹被视为 PHI（受保护健康信息）。\n\n*   选项 A、B 和 D 错误。根据 NIST 标准，这些被归类为 PII（个人身份识别信息）。\n\
  \n16. **D.** 定量风险评估是对事件发生概率以及事件影响分配数值值的过程。\n\n*   选项 A 错误。变更管理是管理对网络所做的配置更改的过程。\n\
  \n*   选项 B 错误。漏洞评估试图识别、量化并对系统中的缺陷进行排序。\n\n*   选项 C 错误。定性风险评估是对风险的危险程度进行排名（如低、中、高）的过程。\n\
  \n17. **B.** 风险规避是一种偏离威胁的策略，以避免破坏性事件带来的昂贵且破坏性的后果。它还试图尽量减少可能构成威胁的漏洞。\n\n*   选项 A\
  \ 错误。风险转移是将风险转移给托管提供商（由其承担恢复和还原的责任），或通过购买保险来涵盖风险产生的费用。\n\n*   选项 C 错误。风险接受是一种承认、识别并接受风险发生概率极低或影响有限的策略，这种风险没有必要采取纠正控制。\n\
  \n*   选项 D 错误。风险缓解是公司实施控制措施以减少系统中的漏洞或弱点。它也可以减少威胁的影响。\n\n18. **D.** 谅解备录（MOU）没有法律约束力。\n\
  \n*   选项 A 错误。SLA（服务水平协议）定义了客户期望从提供商处获得的服务。\n\n*   选项 B 错误。BPA（伙伴协议）是合作伙伴之间的法律协议。\n\
  \n*   选项 C 错误。ISA（连接安全协议）规定了组织之间的技术要求。\n\n19. **B.** SLA（服务水平协议）定义了客户期望从提供商处获得的服务。\n\
  \n*   选项 A 错误。MOU（谅解备录）没有法律约束力。\n\n*   选项 C 错误。ISA（连接安全协议）规定了组织之间的技术要求。\n\n*   选项\
  \ D 错误。BPA（伙伴协议）是合作伙伴之间的法律协议。\n\n20. **A.** 单次损失预期（SLE）是资产价值（$16,000）与暴露因子（.35）的乘积，即\
  \ $5,600。\n\n*   选项 B、C 和 D 错误。这些值不代表单次损失预期。\n\n21. **C.** 反病毒软件是纠正控制的一个示例。\n\n\
  *   选项 A 错误。IDS（入侵检测系统）是检测控制，因为它能检测安全违规。\n\n*   选项 B 错误。审计日志是检测控制，因为它能检测安全违规。\n\n\
  *   选项 D 错误。路由器是预防控制，因为它通过访问控制列表防止安全违规。\n\n22. **A, C.** 威慑控制用于警告潜在攻击者不要攻击。在边界增加的灯光和如“禁止入内”之类的警告标志都是威慑控制。\n\
  \n*   选项 B 和 D 错误。这些是检测控制的示例。检测控制旨在发现违规行为。\n\n23. **D.** 测试和培训是预防性管理控制。管理控制规定了应如何执行安全策略以实现公司目标。\n\
  \n*   选项 A 错误。检测性技术控制通过技术手段发现违规。\n\n*   选项 B 错误。预防性技术控制试图通过技术阻止违规。\n\n*   选项 C 错误。检测性管理控制通过策略、程序和指南发现违规。\n\
  \n24. **D.** 清除是遏制后的下一步。\n\n*   选项 A、B 和 C 错误。事件响应过程的正确步骤是：准备工作、识别、遏制、清除、恢复和教训总结。\n\
  \n25. **A.** 风险接受是一种承认、识别并接受风险发生概率极低或影响有限的策略，这种风险没有必要采取纠正控制。\n\n*   选项 B 错误。风险转移是将风险转移给托管提供商（由其承担恢复和还原的责任），或通过购买保险来涵盖风险产生的费用。\n\
  \n*   选项 C 错误。风险规避是移除可能增加特定风险的漏洞，从而完全规避风险。\n\n*   选项 D 错误。风险缓解是公司实施控制措施以减少系统中的漏洞或弱点。它也可以减少威胁的影响。\n\
  \n26. **A.** 截图为调查人员提供了一种收集计算机屏幕信息的有用方法。可以通过多种方式获取截图，并允许调查人员重现屏幕上发生的情况。\n\n\n\n\n\
  \n*   `Option B` 错误。识别阶段是事件响应流程的一部分，负责发现并确定公司内部偏离正常操作的情况是否构成一起事件。\n\n*   `Option\
  \ C` 错误。桌面演练测试被认为是一种在实施测试之前识别计划中重叠区域的极具成本效益且高效率的方法。\n\n*   `Option D` 错误。生成文件哈希值将确保完整性，并确保文件没有被更改或篡改。\n\
  \n## 27. **B**. 将备份数据存储在另一个城市的异站点，有助于在主位置发生完全灾难时保护数据。在原始位置之外存储备份被称为`异地备份` (off-site\
  \ backups)。此外，与`异地备份`相关的距离可能会带来物流方面的挑战。\n\n*   `Option A` 错误。如果该区域必须疏散，那么在城市内的备用位置存储备份数据可能不是好主意。\n\
  \n*   `Option C` 错误。如果主位置被完全毁，在公司场地的安全箱中存储备份数据可能不是好主意。\n\n*   `Option D` 错误。将备份数据存储在员工家里永远不是一个好主意。\n\
  \n## 28. **C**. 识别被视为单点故障的系统不是 `PTA` 的目的。\n\n*   `Options A`, `B`, and D` 错误。隐私阈值分析\
  \ (`PTA`) 可以确定一个程序或系统是否具有隐私影响，以及是否需要额外的隐私合规文档，例如隐私影响评估 (`PIA`）。\n\n## 29. **C**.\
  \ `清除` (Purging) 会删除硬盘上的所有数据，且数据无法重建。\n\n*   `Option A` 错误。`销毁` (Destruction) 不能帮助公司在电脑销售中出售硬盘。\n\
  \n*   `Option B` 错误。`粉碎` (Shredding) 不能帮助公司在电脑销售中出售硬盘，因为它从物理上破坏了硬盘。\n\n*   `Option\
  \ D` 错误。`格式化` (Formatting) 不足以删除数据，因为可以通过第三方软件恢复。`格式化`是将指针移动到数据所在的位置。\n\n## 30.\
  \ **B**. `可接受使用策略` (acceptable use policy) 描述了用户使用组织物理和知识资源的限制和指南。这包括允许或限制在工作期间使用个人电子邮件。\n\
  \n*   `Option A` 错误。服务水平协议 (`SLA`) 定义了客户期望从服务供应商获得的服务水平。服务水平定义在每个领域都应该是具体且可衡量的。\n\
  \n*   `Option C` 错误。事件响应计划为检测、响应和限制信息安全事件的影响提供了指示。\n\n*   `Option D` 错误。`监管链` (Chain\
  \ of custody) 指的是显示物理或电子证据的保管、控制、传输、分析和处置的按时间顺序记录。\n\n## 31. **C**. 在识别出恶意软件事件后，根据事件响应流程你将执行的下一步是遏制恶意软件，以进一步研究该事件并防止其在网络中传播。\n\
  \n*   `Option A` 错误。`恢复` (Recovery) 在清除恶意软件后执行。\n\n*   `Option B` 错误。`清除` (Eradicating)\
  \ 恶意软件是在遏制恶意软件后进行的。\n\n*   `Option D` 错误。在你发现恶意软件时已经执行了`识别` (Identification)。\n\n\
  ## 32. **A**. `入职` (Onboarding) 是将员工添加到公司身份访问管理系统的过程。\n\n*   `Option B` 错误。`离职`\
  \ (Offboarding) 是将员工从公司身份访问管理系统中移除的过程。\n\n*   `Option C` 错误。`不利面行动` (Adverse action)\
  \ 是出于纪律原因采取的正式行动。\n\n*   `Option D` 错误。`职位轮岗` (Job rotation) 是在不同任务之间移动员工以促进经验的实践。\n\
  \n## 33. **D**. 互连协议 (`ISA`) 是一种规定技术要求的协议。\n\n*   `Option A` 错误。业务伙伴协议 (`BPA`) 份详细说明将内容的书面协议。\n\
  \n*   `Option B` 错误。`谅解备录` (`MOU`) 比 `SLA` 不正式。\n\n*   `Option C` 错误。服务水平协议 (`SLA`)\
  \ 是公司与供应商之间的协议。\n\n## 34. **A**. `整洁桌面策略` (clean desk policy) 确保所有敏感/机密文档从终端用户工作站移除，并在不使用时锁定。\n\
  \n*   `Option B` 错误。在考虑聘用潜在员工时会进行`背景检查` (Background checks)。\n\n*   `Option C` 错误。`继续教育`\
  \ (Continuing education) 是培训成年学习者的过程。\n\n*   `Option D` 错误。`职位轮岗政策` (Job rotation\
  \ policy) 是移动员工的实践。\n\n## 35. **A**. 当用户注册账户时，他们输入网页上字母和数字。这是`威慑控制` (deterrent control)\
  \ 的例子。\n\n*   `Option B` 错误。`检测控制` (Detective controls) 在入侵发生时进行检测。\n\n*   `Option\
  \ C` 错误。`补偿性控制` (compensating control) 用于满足难以实施的安全措施要求。\n\n*   `Option D` 错误。`消磁`\
  \ (Degaussing) 从磁存储介质中移除数据的方法。\n\n## 36. **D**. `停车政策` (Parking policy) 通常概述员工和访客的停车规定。\n\
  \n*   `Option A` 错误。`可接受使用策略` (acceptable use policy) 描述了限制和指南。\n\n*   `Option B`\
  \ 错误。`社交媒体政策` (Social media policy) 定义了员工应如何使用社交网络。\n\n*   `Option C` 错误。`密码策略`\
  \ (password policy) 定义了创建密码的复杂性。\n\n## 37. **C**. `专有数据` (Proprietary data) 是一种机密信息，如果这些信息泄露，会对公司的竞争力产生严重影响。\n\
  \n*   `Option A` 错误。`高` (High) 是内部分配给数据的通用标签。\n\n\n\n\n\n* 选项 B 错误。“秘密（top-secret）”标签通常用于政府系统，在该系统中根据分配的类别授予或拒绝数据和访问权限。\n\
  * 选项 D 错误。“低（low）”是一个分配给内部数据的通用标签，代表向公司外暴露的风险程度。\n\n### 38. B. 向所有员工提供安全意识培训，告知他们通过公司电脑使用个人电子邮件的风险。访问个人电子邮件是一项安全风险，因为公司无法通过公司的\
  \ `Exchange` 服务器过滤电子邮件。\n\n* 选项 A 错误。公司无法通过 `Yahoo Mail` 和 `Gmail` 等服务对用户的邮件消息进行加密。加密是由提供电子邮件服务的公司执行的。\n\
  * 选项 C 错误。为每个用户提供其自己的设备来访问其个人电子邮件并不是下一步的最佳选择。虽然员工在公司网络内使用这些设备，但公司无法完全控制哪些邮件进入了网络。\n\
  * 选项 D 错误。公司可能对通过公司 `Exchange` 服务器路由的个人电子邮件具有某些控制力，但这在创建和批准电子邮件使用策略后并不是最佳步骤。电子邮件使用策略的目的是限制个人电子邮件的使用，因为公司无法完全控制员工允许哪些邮件进入网络。\n\
  \n### 39. C. 防病毒软件用于保护计算机系统免受恶意软件攻击，不是物理安全控制。\n\n* 选项 A、B 和 D 错误。物理控制是为减少物理财产损坏风险而采取的安全措施。这包括保护人员、硬件、软件、网络和数据免受导致损坏或损失的物理动作和事件的影响。\n\
  \n### 40. B. 灾难恢复计划 (`DRP`)是一种帮助公司以最小的时间和资金损失从事件中恢复的计划。它优先考虑关键计算机系统。\n\n* 选项 A 错误。单点故障是系统设计或配置中的缺陷，一个故障或失效将导致整个系统停止运行，且在\
  \ `DRP` 中无法发现它。\n* 选项 C 错误。暴露因素将在风险评估中发现。\n* 选项 D 错误。资产价值将在风险评估中发现。\n\n### 41. A.\
  \ 定量风险评估是为事件发生的概率以及该事件将产生的影响分配数值价值的过程。\n\n* 选项 B 错误。定性风险评估是对哪些风险危害最大进行排序的过程，如低、中、高。\n\
  * 选项 C 错误。业务影响分析用于评估如果关键系统操作发生中断，业务可能遭受的后果。这种中断可能是由于事故、紧急情况或灾难造成的。\n* 选项 D 错误。威胁评估是识别和分类不同威胁（如环境威胁和人为威胁）的过程。它还试图识别威胁带来的潜在影响。\n\
  \n### 42. D. 保密协议 (`NDA`) 保护敏感和知识数据免于落入他人手。\n\n* 选项 A、B 和 C 错误。`NDA` 是公司与第三方供应商之间的法律合同，规定根据协议不披露信息。发送加密数据在第三方供应商拥有适当证书的情况下仍可以被其解密，但它并不限制对数据的访问。违反\
  \ `NDA` 将构成未经授权的数据共享，而违反特权用户角色的意识培训与共享专有信息无关。\n\n### 43. A 和 C。`FTP`（文件传输协议）使用端口\
  \ `21`，`Telnet` 使用端口 `23`。这些协议被认为是薄弱的，且不建议使用。它们容易受到倾听。\n\n* 选项 B 错误。`SMTP`（简单邮件传输协议）使用端口\
  \ `25`。\n* 选项 D 错误。`DNS`（域名系统）使用端口 `53`。\n\n### 44. A. 增量备份是最快的备份方法，但恢复速度最慢。增量备份备份所有新文件以及自上次全备份或增量备份以来更改的所有文件。要从增量备份中恢复，你需要按顺序拥有全备份和每一个增量备份。\n\
  \n* 选项 B 错误。差异备份备份所有新文件以及自上次全备份以来更改的所有文件。要从差异备份中恢复，你需要全备份和最近的差异备份。\n* 选项 C 错误。全备份在每次运行备份时都会备份所有文件。\n\
  * 选项 D 错误。快照是系统在特定时间点的状态。它也被系统映像。\n\n### 45. C. 数据标记策略包括数据如何被标记，例如机密、私有或公开。它还应该包括对所有分类的数据如何进行处理和处置。在丢弃数据之前，您需要使用数据清理工具对其进行销毁。\n\
  \n* 选项 A 错误。消磁是通过改变磁场从磁存储介质中删除数据的方法。\n* 选项 B 错误。可接受使用策略描述了用户使用组织物理和知识资源的限制和准则。这包括允许或限制工作期间使用个人电子邮件。\n\
  * 选项 D 错误。擦除（也称为覆盖）将用所有零替换数据，以防止数据被第三方软件恢复。\n\n### 46. D. 单点故障是系统设计或配置中的缺陷，一个故障或失效将导致整个系统停止运行。\n\
  \n* 选项 A 错误。故障转移是自动且无缝切换到高可靠备份的持续能力。\n* 选项 B 错误。集群通过使用计算机组而不是单个计算机来确保关键服务的可用性。\n\
  * 选项 C 错误。负载均衡将计算机的工作量分配到两或多台计算机之间。这允许在相同时间内完成更多工作。\n\n### 47. A. 检测控制在入侵发生时检测并发现违规行为。\n\
  \n* 选项 B 错误。警卫是预防控制的示例。预防控制阻止行动的发生。\n* 选项 C 错误。防火墙是技术控制的示例。技术控制通过技术实施，并可能是威慑、预防、检测或补偿性的。\n\
  * 选项 D 错误。`IPS`（入侵防御系统）是技术控制的示例。技术控制通过技术实施，并可能是威慑、预防、检测或补偿性的。\n\n### 48. D. `ISA`（互连安全协议）是规定组织间互连的技术和安全要求的协议。\n\
  \n* 选项 A 错误。备忘录录 (`MOU`) 是一种通常不具有法律约束力的协议。这种协议旨在互利，而不涉及法院或资金。\n* 选项 B 错误。`BPA`（业务伙伴协议）是伙伴之间的法律协议。它建立了伙伴之间关系的条款、条件和期望。\n\
  \n\n\n\n\n### 49. C. 利润分红以及伙伴的加入或退出通常包含在业务伙伴协议（BPA）中。同时也包含了每位伙伴的责任。\n\n* Option\
  \ A 错误。公司与互联网服务提供商等双方之间的期望通常位于服务水平协议（SLA）中。这些期望包括在合同服务期间提供的性能水平。\n* 选项 B 错误。服务水平协议将提供一种清晰的方法，用于确定是否已根据约定的性能水平提供了特定的功能或服务。\n\
  * Option D 错误。与 IT 系统互连相关的安全需求通常位于互连安全协议中。\n\n### 50. C. 业务连续性计划（BCP）侧重于在发生备用站点停机后恢复关键业务功能。该计划将决定公司是否能够在停机期间继续运营。\n\
  \n* 选项 A 错误。BIA（业务影响分析）在创建业务连续性计划之前进行，且 BIA 不进行测试。\n* 选项 B 错误。继任计划确保所有公司关键人员都至少有一位指定的备份人员，在需要时可以执行关键功能。\n\
  * 选项 D 错误。服务水平协议（SLA）定义了客户期望服务提供者提供的服务水平。服务水平定义在每个领域都应该是具体的且可衡量的。\n\n### 51. D.\
  \ 系统所有者是一种员工，他们将接受有关如何最好管理特定系统的基于角色培训。\n\n* 选项 A 错误。用户通常是前线员工，将接受通用的安全意识培训。\n* 选项\
  \ B 错误。特权用户将接受有关如何最好处理额外网络和系统访问的培训。\n* Option C 错误。执行用户将接受有关如何识别针对性攻击的培训。\n\n###\
  \ 52. A. 漏洞扫描器尝试识别系统中的缺陷。\n\n* 选项 B 错误。配合杂杂模式网卡（NIC）使用的协议分析器可以捕获所有网络流量。\n* 选项 C\
  \ 错误。端口扫描器识别服务器或主机上的开放端口。\n* Option D 错误。密码破解器可用于检查易破解的密码。漏洞扫描器可以提供更多关于计算机安全的数据，例如开放端口和弱密码。\n\
  \n### 53. C. 恢复过程将受影响的系统谨慎地带回公司的生产环境，以避免发生另一个事故。\n\n* 选项 A 错误。经验教训（Lessons learned）过程是最关键的阶段，因为在该阶段你完成任何对未来事故可能有益的文档。文档应包括此类信息，例如何时以及由谁检测到问题、问题是如何被遏制和消除的、恢复期间的工作以及可能需要改进的领域。\n\
  * 选项 B 错误。准备过程是让公司团队做好准备，以便随时处理事故。\n* Option D 错误。遏制（Containment）过程旨在尽力减少损害并防止任何进一步的损害。\n\
  \n### 54. D. 监管链（Chain of custody）是指按时间顺序记录的文件，显示物理或电子证据的保管、控制、传输、分析和处置。\n\n* 选项\
  \ A 错误。事件处理（Incident handling）是一份解释处理特定事件的流程和程序的指南。\n* 选项 B 错误。法律留存（Legal hold）是律师发布的书面指令，要求客户在预期的诉讼、审计或政府调查中保留相关证据。这些证据可能包括纸质文件和电子存储信息。\n\
  * Option C 错误。易失性顺序（Order of volatility）代表了你应该收集证据的顺序。从一般意义上说，证据收集应该从最易失的开始到最易失的。易失意味着数据不是永久的。\n\
  \n### 55. D. 事件响应的第一步应该是识别。不仅需要识别恶意软件，还需要识别计算机。\n\n* 选项 A 错误。遏制过程旨在尽力减少损害并防止任何进一步的损害。\n\
  * 选项 B 错误。消除（Eradication）过程涉及通过重新映像系统硬盘和安装补丁来移除并恢复受影响的系统。\n* Option C 错误。经验教训过程是最关键的阶段，因为在该阶段你完成任何对未来事故可能有益的文档。文档应包括此类信息，例如何时以及由谁检测到问题、问题是如何被遏制和消除的、恢复期间的工作以及可能需要改进的领域。\n\
  \n### 56. A, D. 托管人（Custodians）维护数据的访问权限以及完整性。\n\n* 选项 B 和 C 错误。CEO 和销售高管通常不负责维护数据的访问和完整性。\n\
  \n### 57. D. 备用电机是一种补偿性控制——当原始控制由于环境限制无法使用时，替代原始控制的替代控制。\n\n* 选项 A 错误。防火墙被认为是预防性控制。\n\
  * 选项 B 错误。安保人员被认为是物理控制。\n* Option C 错误。IDS（入侵检测系统）被认为是检测性控制。\n\n### 58. A. 预防性控制阻止操作发生——在这种场景中，防止未经授权的用户在离开位置时获取网络访问。\n\
  \n* 选项 B 错误。纠正性控制（Corrective control）旨在纠正局面。\n* 选项 C 错误。威慑性控制（Deterrent control）用于威慑安全漏洞。\n\
  * Option D 错误。检测性控制旨在发现违规行为。\n\n### 59. B. PHI（受保护健康信息）是医疗提供者收集的任何涉及健康状况、医疗保健或医疗支付的状况，并根据美国法律可以关联到个人。\n\
  \n* 选项 A 错误。AES（高级加密标准）是一种对称的 128 位块加密系统。\n* 选项 C 错误。PII（个人身份信息）是能够单独或与其他信息结合识别个人的信息。\n\
  * Option D 错误。TLS（传输层安全协议）是一种在计算机网络上加密数据的协议。\n\n### 60. C. 岗位轮换允许个人了解组织的不同部分及其运作方式。它还消除了公司依赖单一个人安全专业知识的需求，以防该员工产生不满并决定伤害公司。当多个员工都了解公司的安全状况时，从不满员工的攻击中恢复变得更容易。\n\
  \n* 选项 A 错误。职责分离（Separation of duties）的概念是完成任务需要多于一个人。\n* 选项 B 错误。强制休假政策被公司用于检测欺诈，通过让另一位熟悉职责的人员来帮助发现任何非法活动。\n\
  * Option D 错误。入职（Onboarding）是将员工添加到公司身份和访问管理系统的过程。\n\nNote: Option C 错误。一个 SLA（服务水平协议）定义了客户期望服务提供者提供的服务水平。服务水平定义在每个领域都应该是具体的且可衡量的。\n\
  \n\n\n\n\n## 61. B 和 C. 备份带不应存储在 CRT 显示器和扬声器等电源源附近。这些设备可能会导致磁带去磁。\n\n*   `Option\
  \ A` 是错误的。工作站没有机会使备份带去磁。\n*   `Option D` 是错误的。LCD 屏幕没有机会使备份带去磁。\n\n## 62. A. 清除过程涉及通过对系统硬盘重新映像和安装补丁来移除并恢复受影响的系统。\n\
  \n*   `Option B` 是错误的。准备过程是让公司的团队做好准备，以便能够随时响应并处理事件。\n*   `Option C` 是错误的。控制过程的目的是最大限度地减少损害并防止进一步损害的发生。\n\
  *   `Option D` 是错误的。恢复过程将受影响的系统小心地带回公司的生产环境，以避免导致另一起事件。\n\n## 63. D. 统一威胁管理 (UTM)\
