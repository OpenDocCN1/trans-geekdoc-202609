  - 选项 D 错误。跳板（pivot）是你攻破一个系统并利用它来攻击其他系统。\n\n## 23. C. 某些间谍软件会捕捉系统屏幕，此类间谍软件通常会将它们隐藏在临时文件夹中。\n\
