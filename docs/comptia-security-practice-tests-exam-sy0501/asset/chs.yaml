  \n1. 钓鱼\n2. 尾随 (Tailgating)\n3. 欺骗智能卡\n4. RFID 欺骗\n\n99. 以下哪项术语是指恶意软件将自身作为库（例如 DLL）插入应用程序与应用程序尝试通信的真实系统库之间的攻击？\n\
  \n1. 应用程序欺骗\n2. 干扰\n3. 恶性孪生 (Evil twin)\n4. 填充 (Shimming)\n\n100. 你负责 Acme 公司的事件响应。你发现有人能够绕过特定网络应用程序的\
