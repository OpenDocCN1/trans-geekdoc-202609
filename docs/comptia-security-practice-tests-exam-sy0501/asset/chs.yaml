  \ `SDN`\n\n### 37.\n你是一家大公司的安全专官。你在其中一个工作站上发现了恶意软件。你担心该恶意软件可能具有多种功能，并且给计算机造成的安全问题比你目前检测到的要。测试这种恶意软件的最佳方法是什么？\n\
