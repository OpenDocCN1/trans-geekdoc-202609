  \ virus)\n\n## 64\nAcme 公司使用内部证书服务器进行所有内部加密。然而，他们的证书颁发机构每月发布一次吊（列表（CRL）。是否构成危险？如果是，是什么？\n\
  1. 是，这意味着被吊销的证书可能会被使用长七天。\n2. 不，这是所有证书颁发机构的标准。\n3. 是，这意味着证书证书很容易。\n4. 不，因为这仅内部使用。\n\
  \n## 65\n当程序具有变量（特别是数组），并在输入数据之前不检查边界值时，程序容易受到哪种攻击？\n1. XSS (跨站脚本)\n2. CSRF (跨站请求伪造)\n\
  3. 缓冲区溢出\n4. 逻辑炸弹\n\n## 66\n以下哪项最能描述在满足特定条件时会执行某些恶意活动（即：如果满足条件，则执行）的恶意软件？\n1. 引导区病毒\n\
  2. 逻辑炸弹\n3. 缓冲区溢出\n4. 稀疏感染病毒 (Sparse infector virus)\n\n## 67\nGerald 是 Acme 公司的网络管理员。用户报告他们的电脑出现异常行为。他认为这可能是由于恶意软件，但不同电脑上的表现有所不同。哪项最能解释这一点？\n\
  1. 不是恶意软件，而是硬件故障。\n2. 是引导区病毒。\n3. 是宏病毒。\n4. 是多态病毒 (Polymorphic virus)。\n\n## 68\n\
  Teresa 是 ACME Inc 公司的安全人员。她发现了一种攻击，攻击者向网络路由器发送了多个广播消息，伪造了其中网络服务器的 IP 地址。这导致网络向该服务器发送大量数据包，使其不再响应。这种攻击被称为什么？\n\
  1. Smurf 攻击 (攻击)\n2. DDoS 攻击\n3. TCP 劫持攻击\n4. TCP SYN 洪水攻击\n\n## 69\n哪种病毒能够更改自己的代码以避免被杀病毒软件检测到？\n\
  1. 引导区\n2. 欺骗病毒 (Hoax)\n3. 多态 (Polymorphic)\n4. 隐形 (Stealth)\n\n## 70\nGerald 是一家小型金融服务公司的网络管理员。用户报告电脑上出现了似乎由病毒引起的异常行为。在隔离了他认为可能被感染的机器后，Gerald\
  \ 对它们进行了分析。他发现所有被感染的机器都收到一封自称财务部门的邮件，带有一个 Excel 表格，且用户打开了表格。这些机器上最可能的问题是什么？\n1.\
  \ 宏病毒\n2. 引导区病毒\n3. 木马\n4. RAT (远程访问工具)\n\n## 71\nFred 是一家大型保险公司事件响应小组的成员。他的专长是恶意软件分析。他正在研究一个怀疑是上个月感染公司网络的病毒的文件。该文件似乎间歇性地爆发恶意活动，期间穿插着休眠期。哪项最能描述这种恶意软件？\n\
  1. 宏病毒\n2. 逻辑炸弹\n3. 稀疏感染病毒\n4. 多态病毒\n\n## 72\n哪个术语用于描述既能感染文件又能引导区的病毒？\n1. 多态 (Polymorphic)\n\
  2. 多重感染 (Multipartite)\n3. 隐形 (Stealth)\n4. 多重加密 (Multiple encrypting)\n\n## 73\n\
  你们聘请了一家外部安全公司对网络进行各种测试。在漏洞扫描期间，你将为该公司提供各种系统（如数据库服务器、应用服务器、Web 服务器等）的登录信息以协助其工作。这哪项最能描述这种？\n\
  1. 白盒测试 (White-box test)\n2. 灰盒测试 (Gray-box test)\n3. 特权扫描\n4. 认证用户扫描\n\n## 74\n\
  以下哪项常用于分布式拒绝服务 (DDoS) 攻击？\n1. 网络钓鱼\n2. 广告软件\n3. 尸肉网络 (Botnet)\n4. 木马\n\n## 75\n\
  你正在调查 Acme 公司最近的一次入侵。你发现攻击者使用了一个离开公司已久的账户。该账户仍处于激活状态。以下哪项最能描述导致漏洞的原因？\n1. 账户配置不当\n\
  2. 未经培训的用户\n3. 使用默认配置\n4. 系统未打补\n\n## 76\nJuan 负责一家大型金融机构的事件响应。他发现公司的 WiFi 被攻破。攻击者使用了无线接入点\
  \ (WAP) 自带的登录凭据。攻击者能够使用这些凭据访问 WAP 管理控制台并进行更改。以下哪项最能描述导致漏洞的原因？\n1. 账户配置不当\n2. 未经培训的用户\n\
  3. 使用默认配置\n4. 系统未打补\n\n## 77\nElizabeth 正在调查公司内部的一次网络入侵。她发现一个程序通过利用目标进程加载特定的库，从而在另一个进程的地址空间内执行代码。哪项最能描述这种攻击？\n\
  1. 逻辑炸弹\n2. 会话劫持\n3. 缓冲区溢出\n4. DLL 注入\n\n## 78\nZackary 是一家安全公司的恶意软件调查员。他正在调查一种恶意软件，它通过寻找目标程序中的空引用并对其进行解引用，导致产生异常。哪项最能描述这种攻击类型？\n\
  1. DLL 注入\n2. 缓冲区溢出\n3. 内存泄漏\n4. 指针解引用 (Pointer dereference)\n\n\n\n\n\n## 79. Frank\
  \ 刚刚接任一家中型保险公司的 CIO。他做的第一件事之一是对比所有网络设备进行彻底的清点。他发现了两个没有记录的路由器。他担心，如果这些路由器没有记录，它们可能没有经过安全的配置、测试，是不安全的。以下哪项最能描述这种情况？\n\
  \n1. 用户培训不力\n2. 系统蔓延 (System sprawl)\n3. 系统未打丁\n4. 默认配置\n\n## 80. 侵入式漏洞扫描和非侵入式扫描之间的主要区别是什么？\n\
  \n1. 侵入式扫描是渗透测试。\n2. 非侵入式扫描只是文档检查。\n3. 侵入式扫描可能会导致业务中断。\n4. 非侵入式扫描无法发现大多数漏洞。\n\n\
  ## 81. Daryl 正在调查其公司 Web 服务器最近发生的入侵。攻击者使用了复杂的技巧，并对网站进行了篡改，留下了谴责公司公共政策的信息。他和他的团队正试图确定最可能实施此次入侵的攻击者类型。根据提供的信息，最可能是哪个威胁者？\n\
  \n1. 脚本 (A script)\n2. 国家级 (Nation-state)\n3. 有组织犯罪\n4. 黑客活动分子 (Hacktivists)\n\n\
  ## 82. 在调查入侵并尝试将其归因于特定的威胁者时，以下哪项不是 APT（高级持续性威胁）的指标之一？\n\n1. 对目标的长期访问\n2. 复杂的攻击\n\
  3. 攻击来自外国 IP 地址。\n4. 攻击持续了很。\n\n## 83. 哪种攻击类型使用第二个无线接入点 (WAP) 广播与合法接入点相同的 SSID，试图让用户连接到攻击者的\
