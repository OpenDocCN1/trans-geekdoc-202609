  \n\n\n\n\n### 101. 你公司的一位用户报告说，她收到一个自称来自公司技术支持团队的电话。来电者声称病毒正在公司内部传播，他需要立即访问该员工的计算机以防止其被感染。来电者使用了哪些社会工程学原理来试图欺骗该员工？\n\
  \n1. 紧急感和恐吓\n2. 紧急感和权威\n3. 权威和信任\n4. 恐吓和权威\n\n### 102. Ahmed 发现有人操纵了公司某台交换机的表项。该操纵更改了表项，导致指向一个特定\
  \ MAC 地址的数据现在被路由到其他地方。这是哪种攻击？\n\n1. ARP 毒化\n2. DNS 污染\n3. 中间攻击\n4. 后门\n\n### 103.\
  \ 你正在调查 Acme 公司的事件，并在几台机器上发现了恶意软件。该恶意软件似乎感染了 `/Windows/System32/` 目录下的系统文件，并影响了引导区。这属于哪种恶意软件？\n\
