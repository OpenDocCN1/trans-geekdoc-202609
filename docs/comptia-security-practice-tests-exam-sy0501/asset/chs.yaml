  \ B. 逻辑炸会在满足某些条件（通常是日期或时间）时执行其恶意活动。这通常由不满的离职员工实施。\n- 选项 A、C、D 均错误。虽然这些中的任何一种都完全可能是由离职员工留下的，但逻辑炸要常见得多。原因是其他三者会立即执行其恶意活动，从而与离职员工产生显而易见的联系。\n\
