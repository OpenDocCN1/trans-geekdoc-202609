  4. `Evil twin`（恶性孪生）\n\n### 52. John 是 Acme 公司的网络管理员。他发现有人注册了一个与公司域名仅差字母的域名。该拼写错误的网站是一个钓鱼网站。哪项最好描述了这一点？\n\
