  - `Downgrade`（降级攻击）\n- `Replay`（重放）\n- `Weak implementations`（弱实现）\n\n## 1.3 解释威胁主体类型和属性。\n\
  \n### 威胁主体类型\n- `Script kiddies`（脚本小子）\n- `Hacktivist`（黑客活动主义者）\n- `Organized crime`（有组织犯罪）\n\
  - `Nation states/APT`（国家级/APT）\n- `Insiders`（内部人员）\n- `Competitors`（竞争对手）\n\n###\
  \ 威胁主体属性\n- `Internal/external`（内部/外部）\n- `Level of sophistication`（复杂程度）\n- `Resources/funding`（资源/资金）\n\
  - `Intent/motivation`（意图/动机）\n- `Use of open-source intelligence`（开源情报的使用）\n\n##\
  \ 1.4 解释渗透测试概念。\n- `Active reconnaissance`（主动侦察）\n- `Passive reconnaissance`（被动侦察）\n\
