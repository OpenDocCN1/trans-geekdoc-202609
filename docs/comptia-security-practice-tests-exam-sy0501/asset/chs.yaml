  \n1. DoS\n2. DDoS\n3. 缓冲区溢出\n4. 木马\n\n### 116. SYN 洪泛是一种 DoS 攻击，攻击者开启大量的半打开连接，违反了三次握手。这种攻击的特征是：\n\
  \n1. 源和目的地址相同\n2. 源和目的端口相同\n3. 没有相应 ACK 的 SYN 包\n4. 带有 RST 包\n\n### 117. 什么是白盒测试？\n\
