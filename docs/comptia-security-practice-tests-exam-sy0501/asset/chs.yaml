  \ A、B 和 C 错误。这些都是常见的安全误配置问题。\n\n## 第 2 章：技术与工具\n\n### 1. D. 正确答案是状态检测包检测（SPI）。SPI\
  \ 查看会话的整个上下文并将阻止 SYN 洪水攻击。\n* Option A 错误。包过滤器隔离检查每个包，不会阻止 SYN 洪水。包过滤器是无状态的，无法阻止\
  \ SYN 洪水。\n* Option B 错误。应用程序网关可能具有 SPI 功能，但其主要优势是防止特定的应用程序攻击（如 Web 攻击）。\n* Option\
  \ C 错误。堡垒（Bastion）是边界防火墙的另一种名称，并不表示它所使用的过程。\n\n### 2. A. 正确答案是 NAC，即网络访问控制。NAC 是一种网络管理解决方案，它定义并实施了一种策略，仅允许合规且信任的终端设备访问网络资源。\n\
  * Option B 错误。状态检测包检测（SPI）是一种防火墙。\n* Option C 错误。IDS 代表入侵检测系统。\n* Option D 错误。BYOD（自自带设备）是问题所在，但描述的解决方案是网络访问控制（NAC）。\n\
  \n### 3. D. 传输模式（Transport mode）是 IPSec 加密数据但不加密包头的模式。\n* Option A 错误。隧道模式（Tunneling\
  \ mode）会对包头和数据进行加密。\n* Option B 错误。互联网密钥交换（IKE）用于在 IPSec 中建立安全关联。\n* Option C 错误。封装安全载荷（ESP）在在使用隧道模式还是传输模式时都用于\
  \ IPSec 的认证和加密。\n\n### 4. D. 当 IDS（或任何安全设备）将合法流量标记为攻击时，这被称为误报（false positive）。\n\
  * Option A 错误。漏报（false negative）是指攻击被误标记为合法流量。\n* Option B 错误。被动指的是 IDS 对可疑活动的响应方式。题目没有告诉你它是被动的还是主动的。\n\
  * Option C 错误。主动指的是 IDS 对可疑活动的响应方式。题目没有告诉你它是被动的还是主动的。\n\n### 5. D. 安全信息和事件管理（SIEM）系统专门设计为日志聚合和分析而设计。\n\
  * Option A 错误。网络访问控制（NAC）扫描设备以确保它们符合最小网络安全要求。\n* Option B 错误。可以使用端口转发结合其他步骤来聚合日志，但它不是最佳方法。\n\
  * Option C 错误。入侵检测系统（IDS）不会聚合其他系统的日志。\n\n### 6. C. Web 应用程序防火墙（WAF）设计用于提供防火墙保护，同时防止特定的\
  \ Web 攻击。\n* Option A 错误。访问控制列表（ACL）是一项重要的安全措施，但无法提供针对 Web 攻击的保护。\n* Option B 错误。状态检测包检测（SPI）是一种强大的防火墙，可以阻止\
  \ SYN 洪水等攻击，但无法对 Web 攻击提供最佳保护。\n* Option D 错误。IDS 是一项良好的安全措施，但无法对 Web 攻击提供最佳保护。\n\
  \n### 7. C. 站点间 VPN 是站点之间永久的 VPN 连接。连接远程办公室是典型的站点间 VPN 实现。\n* Option A 错误。L2TP 是一种\
  \ VPN 协议，可以用于站点间 VPN 或远程访问 VPN。\n* Option B 错误。IPSec 是一种 VPN 协议，可以用于站点间 VPN 或远程访问\
  \ VPN。\n* Option D 错误。远程访问 VPN 供个人远程访问网络。\n\n### 8. D. 通过将网络插座映射到机器特定 MAC 地址，可以防止非法设备连接。\n\
  * Option A 错误。访问控制列表无法防止非法设备连接到端口。\n* Option B 错误。入侵检测系统无法防止非法设备连接到端口。\n* Option\
  \ C 错误。如果该特定插座属于某个 VLAN，它会将攻击者限制在该 VLAN 内，但这绝不是像端口安全那样可靠的安全措施。\n\n### 9. A. 主动活动集群（active-active\
  \ cluster）使所有服务器工作，而不是保留一个备用服务器。\n* Option B 错误。主备式集群（active-passive cluster）每对服务器中只有一个在工作。它仅在主服务器故障时使用。\n\
  * Options C 和 D 错误。这些是集群决定如何路由流量的方法。\n\n### 10. A. 轮询负载均衡简单地将每个新连接发送到集群中的服务器。\n\
  * Option B 错误。亲性负载均衡（Affinity load balancing）将特定用户绑定到集群中的特定服务器。\n* Option C 错误。权重负载均衡检查服务器的带宽使用情况，并将下一个连接发送到带宽使用率最低的服务器。\n\
  * Option D 错误。旋转不是负载均衡中的术语。\n\n### 11. D. 这种术语是“瘦无线接入点（thin wireless access point）”。\n\
  * Option A 错误。胖接入点包含了无线网络所需的所有功能和特性。\n* Option B 错误。中继器重发信号。\n* Option C 错误。厚型（Thick）是胖接入点的另一个名称。\n\
  \n### 12. B. 基于控制器的无线接入点功能极简，大多数功能由集中控制。\n* Option A 错误。胖接入点的所有必要功能都包含在 WAP 本中。\n\
  * Option C 错误。独立（Stand-alone）与胖接入点同义。\n* Option D 错误。`802.11i` 是无线安全标准。\n\n\n\n\n\
  \n### 13. B. 封装安全负载（Encapsulating Security Payload）同时提供完整性和加密。\n- 选项 A 错误。认证头（Authentication\
  \ Header）只提供完整性，不提供加密。\n- 选项 C 错误。互联网密钥交换（Internet Key Exchange）用于 `IPSec` 设置期间建立安全关联。\n\
  - 选项 D 错误。互联网安全关联和密钥管理协议（Internet Security Association and Key Management Protocol）为认证和密钥交换提供框架。\n\
  \n### 14. C. `ESP` 提供加密而 `AH` 提供完整的认证（包括报头），因此两者都需要才能满足要求。\n- 选项 A 错误。认证头（Authentication\
  \ Header）提供完整的数据包认证（包括报头），但不会提供加密。\n- 选项 B 错误。封装安全负载（Encapsulating Security Payload）同时提供完整性和加密，但只对数据进行认证，不对报头认证。\n\
  - 选项 D 错误。互联网密钥交换（Internet Key Exchange）用于 `IPSec` 设置期间建立安全关联。\n\n### 15. D. `USB`\
  \ 阻塞将防止任何人插入 `USB` 并提取数据。\n- 选项 A 错误。`IPS`（入侵预防系统）只有在数据通过网络发送并表现为攻击时才能阻止数据外泄。它无法阻止通过手提携带数据。\n\
  - 选项 B 错误。这是一个更耗时的选项，不会是你首先实施的方案。\n- 选项 C 错误。虚拟局域网（`VLANs`）对解决这个问题没有帮助。\n\n### 16.\
  \ B. 安全多用途邮件扩展（`S/MIME`）使用 `X.509` 证书加密电子邮件，这些证书由信任的第三方创建并认证。\n- 选项 A 错误。互联网消息访问协议（Internet\
  \ Message Access Protocol）用于接收电子邮件。它不发送邮件，且没有原生加密。\n- 选项 C 错误。`PGP`（`Pretty Good\
  \ Privacy`）可以加密电子邮件，但它使用自生成的证书，这些证书未经过第三方认证。\n- 选项 D 错误。安全简单邮件传输协议（Simple Mail Transfer\
  \ Protocol Secure）是加密的，但它仅用于发送邮件，不用于接收。也可以通过 `S/MIME` 或 `PGP` 实现。\n\n### 17. D.\
  \ 安全壳（`Secure Shell`）提供加密的远程命令行界面。\n- 选项 A 错误。安全超文本传输协议（HyperText Transport Protocol\
  \ Secure）用于加密网页流量。\n- 选项 B 错误。Windows 桌面协议（Windows Remote Desktop Protocol）没有加密。\n\
  - 选项 C 错误。`Telnet` 没有加密。\n\n### 18. D. 早期版本的 `SNMP` 以明文发送所有流量。`SNMP v3` 以加密发送所有数据。\n\
  - 选项 A、B 和 C 错误。它们不是 `SNMP v3` 的特性。\n\n### 19. B. 自选设备（`CYOD`）允许员工携带自己的设备去上班，但前提是必须从批准的型号列表中进行选择。\n\
  - 选项 A 错误。自带设备（`BYOD`）允许员工携带他们恰好拥有的任何型号设备。\n- 选项 C 错误。公司所有个人可用（`COPE`）设备由公司提供并归公司所有。\n\
  - 选项 D 错误。`BYOE` 不是行业使用的术语。\n\n### 20. C. 虚拟桌面基础设施（Virtual Desktop Infrastructure）确实具有集中控制的所有补丁管理。\n\
  - 选项 A 错误。这是 `VDI` 的优点，但不是安全优势。\n- 选项 B 错误。`VDI` 对恶意软件的抵抗力并不比物理桌面强或弱。\n- 选项 D 错误。某些厂商声称\
  \ `VDI` 较不易中间人攻击，但没有人声称它对这类攻击免疫。\n\n### 21. C. 卫星通信对中断通信的灾害抵抗力最大。\n- 选项 A 错误。虽然蜂窝网络有效且具有一定的韧性，但它不如\
  \ `SATCOM`。\n- 选项 B 错误。`WiFi` 可能因为任何原因而失败，灾害很可能会影响它。\n- 选项 D 错误。如果网络发生任何中断，`VoIP`\
  \ 将无法工作。\n\n### 22. A. 防止数据丢失最有效的保护是远程擦除手机的能力。\n- 选项 B 错误。地理位置（Geolocation）将允许你定位手机，但数据可能已经被外泄了。\n\
  - 选项 C 错误。强 `PIN` 码是一个好主意，但没有远程擦除有效。\n- 选项 D 错误。这仅仅限制了被盗设备上可能存储的数据量。\n\n### 23.\
  \ B. 地理围栏（Geofencing）设置了地理边界，超出边界的设备将无法工作。\n- 选项 A 错误。地理位置（Geolocation）提供地理位置，而不是地理围栏（geofencing）。\n\
  - 选项 C 和 D 错误，因为地理围栏与 `WiFi`无关。\n\n### 24. B. 移动设备的内容管理涉及限制放在手机上的内容。\n- 选项 A 错误。内容管理不涉及限制数据量。\n\
  - 选项 C 错误。在移动设备的语境下，这属于内容管理。\n- 选项 D 错误。对授权内容进行数字签名可以用于某些内容管理系统，但这不是内容管理的最佳定义。\n\
  \n### 25. C. `ipconfig /renew` 命令将向 `DHCP` 服务器请求新的 `IP`。\n- 选项 A 错误。`ipconfig` 没有\
  \ `/request` 标记。\n- 选项 B 和 D 错误。`Netstat` 与获取 IP 地址无关。此外 `/request` 和 `-renew` 不是\
  \ `NETSTAT` 的标记。\n\n### 26. D. 传输层安全（`TLS`）用于加密和保护网页流量。\n- 选项 A 和 B 错误。`L2TP` 和\
  \ `IPSec` 是 VPN 技术，不用于保护网页流量。\n- 选项 C 错误。安全套接层（SSL）曾是合适的选择，但 `TLS` 是 `SSL` 的继任者，并发布于\
  \ 1999 年。\n\n### 27. A. 数据执行保护（`DEP`）要求用户授权任何执行文件。更技术性的定义是阻止软件访问受限内存。\n- 选项 B 错误。数据泄露防护（`DLP`）与防止数据外泄有关。大多数\
  \ `DLP` 解决方案具有控制 `USB` 设备等可移动媒体的能力。\n- 选项 C 错误。统一威胁管理（`UTM`）是将防病毒、`HIDS`、日志监控、防火墙等安全服务整合到单一设备中。\n\
  \n### 28. D. 轻级目录访问协议安全版（`LDAPS`）至少可以缓解风险。`LDAP` 是网络目录（计算机、用户等）。保护该目录有助于缓解网络枚举。\n\
  - 选项 A 错误。`HTTPS` 用于安全网页。\n- 选项 B 错误。`TLS` 只有在应用于目录协议时才起作用，如在 `LDAPS` 中那样。\n- 选项\
  \ C 错误。`VPN` 无法解决这个问题。\n\n### 29. A. 启发式扫描（Heuristic scanning）涉及扫描可能指示攻击的异常行为，即使没有知的攻击签名。\n\
  - 选项 B 错误。特征扫描只能检测已知的签名，而这似乎是学院正在使用的。\n- 选项 C 和 D 错误。两者都不是 `IDS` 术语。\n\n### 30.\
  \ C. `FTPS` 是带有 `SSL/TLS` 的文件传输协议，使用数字证书来安全文件传输。\n\n\n\n\n\n- 选项 A 错误。文件传输协议（File\
  \ Transfer Protocol）是不安全的。\n- 选项 B 错误`SFTP` 是安全的，但它使用 `SSH` 进行安全，不使用数字证书。\n- 选项\
  \ D 错误。安全拷贝（Secure Copy）是安全的，但它使用 `SSH` 进行安全，不使用数字证书。\n\n### 32. C. 安全实时传输协议 (`SRTP`)\
  \ 用于加密和保护 RTP。RTP 是传输 VoIP 的协议。\n- 选项 A 错误。会话建立协议（SIP）用于用于发起 VoIP 通话，但不用于发送 VoIP\
  \ 数据。\n- 选项 B 错误`TLS` 用于保护数据，但它本身无法保护 VoIP。\n- 选项 D 错误。安全壳 `SSH` 用于远程终端连接，不用于 VoIP。\n\
  \n### 33. B. 屏幕锁限制了已知代码的用户访问。\n- 选项 A 错误。虽然设备加密很常见，但屏幕锁代码并不加密设备。\n- 选项 C 错误。与桌面操作系统不同，移动设备并非为多用户使用设计的。\n\
  - 选项 D 错误。屏幕锁的锁码与连接 WiFi 无关。\n\n### 34. A. 上下文感知认证（Context-aware authentication）仍然需要用户名和密码，但这些标准之外，它还会检查用户的位置、登录的时间、登录的计算机、他们正在尝试的操作等。\n\
  - 选项 B 错误。上下文感知认证仍然需要用户名和密码。\n- 选项 C 和 D 错误。上下文感知认证不是与数字证书或令牌（tokens）有关。\n\n###\
  \ 35. C. 应用管理主要关注确保只有经过授权和批准的应用被安装在移动设备上。\n- 选项 A 错误。`iTunes store` 中的每个应用都适用于业务用途，且\
  \ `iTunes store` 仅影响 Apple 设备。\n- 选项 B 错误。仅仅知道安装了什么并不等同于确保只安装了授权的应用。\n- 选项 D 错误。补丁管理可以是应用管理的一部分，但其主要目标是控制哪些应用被安装到设备上。\n\
  \n### 36. D. 内联 `IDS` 实际上位于流量线（即流量所在的网络分段）。\n- 选项 A 错误。主动 `IDS` 指的是会对怀疑的攻击流量采取行动的\
  \ IDS——它与放置位置无关。\n- 选项 B 错误`IPS` 是主动 `IDS` 的另一个名称。\n- 选项 C 错误。被动（Passive）指的是系统是否会对怀疑流量采取行动，而不是\
  \ `IDS` 的位置。\n\n### 37. A. 分流隧道（Split tunneling）允许移动用户同时访问不同的安全域，如公共网络（例如互联网）和本地局域网或广域网。\n\
  - 选项 B 错误`IPSec` 是建立和保护 `VPN` 的协议，而不是连接到不同的资源。你可以在分流隧道或全隧道中使用 `IPSec`。\n- 选项 C 错误。全隧道（full\
  \ tunnel）是通往单一目标的专用隧道。\n- 选项 D 错误`TLS` 是一种用于建立和保护 `VPN` 的协议，而不是连接到不同的资源。你可以在分流隧道或全隧道中使用\
  \ `TLS`。\n\n### 38. A. 正向代理（forward proxy）是一个提供广泛网络源访问的单一位置。\n- 选项 B 错误。反向代理（reverse\
  \ proxy）通常是面向内部的代理，作为前端用于控制和保护对私有网络服务器的访问。\n- 选项 C 错误。状态检测检测（Stateful packet inspection）是一种防火墙。\n\
  - 选项 D 错误。开放代理（Open proxies）互联网上的任何人都可以使用。\n\n### 39. A. 这是翻找垃圾的术语。\n- 选项 B 和 D\
  \ 错误。这些术语虽然语法上正确，但并不是行业内使用的术语。\n- 选项 C 错误。此场景中没有任何东西描述的是社会工程。\n\n### 40. A. 亲和力负载均衡（Affinity\
  \ load balancing）将某些用户或用户组绑定到特定服务器，以便在可能的情况下他们路由到该服务器。\n- 选项 B 错误。绑定（Binding）不是负载均衡中使用的术语。\n\
  - 选项 C 错误。是的，需要负载均衡，但问题问的是什么类型的负载均衡。\n- 选项 D 错误。轮询（Round-robin）只是转到下一个可用服务器。\n\n\
  ### 41. D. 仔细放置 `WAPs` 以为公司提供最佳覆盖，并尽量减少公司外的重叠，将是防止相邻办公室的人尝试破解 WiFi 的最佳方法。在放置 `WAPs`\
  \ 以获得最佳覆盖时，需要关注信号强度，以确保 `WPAs` 之间没有间隙。\n- 选项 A 错误。瘦型与胖 `WAP` 指的是 `WAP` 中的功能，不会影响附近人员破解\
  \ `WAP` 的能力。\n- 选项 B 错误。地理围栏（Geofencing）用于限制移动设备使用的区域。\n- 选项 C 错误。保护管理员屏幕是一个好主意且应该这样做，但它无法解决附近租户尝试破解\
  \ WiFi 的问题。\n\n### 42. D. 关联与入侵相关的服务器事件是 `SIEM` 管理员需要处理的最重要问题。\n- 选项 A 错误。事件重复是一个需要解决的问题，但它的重要性远低于关联。\n\
  - 选项 B 错误。时间同步将很重要，但它发生在事件发生前、服务器维护期间或关联之后（此时关联的事件需要同步其时间）。\n- 选项 C 错误。影响评估（Impact\
  \ assessment）很重要，但不是 `SIEM` 管理的一部分。\n\n### 43. B. 错误报告的总数（即误报和漏报）是最大的关注点，因为它决定了系统的有效性。\n\
  - 选项 A 错误。是的，成本是一个问题，但有效性是最重要的问题。\n- 功耗是一个不重要得多的问题。\n- 选项 D 错误。管理界面和成本都很重要，但不如效能重要。\n\
  \n### 44. A. 访问控制列表（ACLs）是 Cisco 提出的防止路由器欺骗的首要建议。`ACLs` 限制了对路由器及其功能的访问。\n- 选项 B\
  \ 错误。访问路由器的登录通常是不可行的，因为当用户不在场登录时可能需要访问路由器。\n- 选项 C 错误。网络入侵防御系统是一个好主意，但它无法防止欺骗。\n\
  - 选项 D 错误。网络入侵检测系统是一个好主意，但它无法防止欺骗。\n\n### 45. A. SYN 攻击是一种拒绝拒绝服务的泛洪攻击类型。泛洪防护（Flood\
  \ guards）要么是独立的，或者更多时候是防火墙的一部分，它们可以防止泛洪攻击。\n- 选项 B 错误。DNS 投毒涉及在 DNS 服务器中插入虚假条目；泛洪防护无法阻止此操作。\n\
  - 选项 C 错误。欺骗 MAC 地址不涉及任何泛洪。\n- 选项 D 错误。欺骗地址解析协议（ARP Spoofing）是 MAC 欺骗的一种，不涉及任何泛洪。\n\
  \n### 46. A. 当客户端与服务器不兼容直接连接服务器时，通常使用应用代理服务器。\n- 选项 B 错误。网络地址转换（NAT）涉及将私有 IP 地址转换为公共\
  \ IP 地址。\n- 选项 C 错误。更换服务器是一个激进的措施。假设该服务器由于某些有效原因正在使用。\n\n\n\n\n\n- 选项 D 错误。协议分析器本质上是一个数据包嗅器。\n\
  \n### 47. C. 虚拟 IP 负载均衡没有考虑每个接口的负载，并假设所有负载本质上是相似的。\n- 选项 A 错误。这种负载均衡并不是资源密集。\n-\
  \ 选项 B 错误。大多数服务器都支持虚拟 IP 负载均衡。\n- 选项 D 错误。Windows 也支持虚拟 IP 负载均衡。\n\n### 48. A. 如果网络时间协议\
  \ (NTP) 中断，向 SIEM 转发日志的各种服务器可能时间不一致。这可能导致同一时间发生的事件看起来像是在不同的时间发生的。\n- 选项 B 错误。事件关联与时间同步有关，但那是次要影响。\n\
  - 选项 C 错误。NTP 问题不应导致任何事件重复。\n- 选项 D 错误。NTP 问题不应导致日志无法记录。\n\n### 49. A. `-n` 命令用于设置发送的\
  \ ping 数据包数量——在本例中为 6——而 `-l` 设置大小——在本例中为 100 字节。\n- 选项 A 错误。IV 攻击是对流密码器的隐晦加密攻击。\n\
  - 选项 B、C 和 D 均错误。这是一个 ping 命令，但这些选项的标志（flags）是错误的。\n\n### 50. B. 内部人员可以将数据作为邮件附件发送。\n\
  - 选项 A 错误。便携式设备通常通过 USB 连接，而 USB 被禁用了，如果它们没有连接，很可能会在出口检查时被发现。\n- 选项 C 错误。蓝牙的范围是\
  \ 10 米。这使得它对数据外泄是无效的。\n- 选项 D 错误。光介质是一种便携式介质。\n\n### 51. D. 钓鱼邮件通常发送给大量人员，垃圾过滤器至少会阻止一部分，从而减少钓鱼邮件攻击。\n\
  - 选项 A 错误。虽然邮件加密是一个好主意，但它无法阻止钓鱼。\n- 选项 B 错误。加固所有服务器是一个良好的安全实践，但它对钓鱼邮件没有影响。\n- 选项\
  \ C 错误。虽然对邮件进行数字签名是一个好主意，但它无法阻止钓鱼，甚至不能显著减少钓鱼。它可能会缓解声称来自公司员工的钓鱼邮件，但不会影响其他钓鱼邮件。\n\n\
  ### 52. C. TLS 加速器是一个处理任务的处理器，特别是针对传输层安全协议 (TLS) 的计算密集型公钥加密处理。这将显著提高服务器的响应速度。\n\
  - 选项 A 错误。增加 RAM 对网络响应速度的影响微乎其微。\n- 选项 B 错误。从问题来看，没有迹象表明服务器在实施 TLS 之前运行正常，因此解决 TLS\
  \ 问题是最佳解决方案。\n- 选项 D 错误。建立集群是一个相当重大的步骤，不应该应该考虑的第一件事。实施 TLS 加速器是更好的选择。\n\n### 53.\n\
  - 1. B. 员工可以使用隐写术在文件中隐藏敏感数据，然后外泄这些数据。选项 A 错误。密码破解器与隐写术工具是不同种类的工具。选项 C 错误。极少数的隐写术工具和方法允许你隐藏网络流量。选项\
  \ D 错误。虽然可能通过隐写术在文件中隐藏恶意软件，但这不是最大或最常见的关注点。\n\n### 54. B. `netstat` 命令显示所有连接，而 `-o`\
  \ 标志显示拥有该连接的进程。\n- 选项 A 错误。`netstat -a` 命令显示监听端口。\n- 选项 C 错误。`arp -a` 命令显示当前地址路由协议条目。\n\
  - 选项 D 错误。`arp -g` 命令与 `arp -a` 相同。\n\n### 55. A. 这是字典攻击的一个示例。攻击者使用一个被认为是可能是密码的单词列表。\n\
  - 选项 B 错误。彩虹表是预计算的哈希表。\n- 选项 C 错误。暴力破解尝试每可能的随机组合。\n- 选项 D 错误。会话劫持是攻击者接管已验证的会话。\n\
  \n### 56. C. `netcat` 是网络管理员广泛用于建立两台机器之间通信的工具。机器上拥有 `netcat` 可能表明入侵者已经破解了该机器并安装\
  \ `netcat` 作为后门，或者员工正在建立秘密通信通道。\n- 选项 A 错误。`netcat` 不是密码破解器。\n- 选项 B 错误。`netcat`\
  \ 不是数据包嗅器。\n- 选项 D 错误。`netcat` 不是拒绝服务工具。\n\n### 57. A. 证书吊销列表（CRL）指定由于某些原因被吊销的证书。这些证书不应再被使用。但如果\
  \ CRL 每周发布一次，那么被吊销的证书在吊销后可能被使用长一周。\n- 选项 B 错误。CRL 不是证书颁发过程。\n- 选项 C 错误。是的，这会产生可能的安全问题。\n\
  - 选项 D 错误。证书密钥生成与 CRL 是完全分离的。\n\n### 58. C. 必须创建一个解释软件许可的安全策略。没有清晰的策略，任何其他措施的效果都会大打折扣。\n\
  - 选项 A 错误。虽然软件审计是一个好主意，但只有在有良好策略的情况下进行。\n- 选项 B 错误。扫描网络查看安装了什么是一个好主意，但必须建立策略。\n\
  - 选项 D 错误。这可能是公司想要采取的步骤。但必须建立。\n\n### 59. B. 错误拒绝率 (FRR) 是本应成功却被拒绝的身份验证尝试率。当你发现大量授权人员被拒绝访问时，是因为\
  \ FRR 太高。\n- 选项 A 错误。错误接受率 (FAR) 是不应该通过身份验证的人员通过的率。这确实是一个关注点，但是不同的。\n- 选项 C 错误。交叉错误率\
  \ (CER) 是 FAR 和 FRR 相等的率。\n- 选项 D 错误。相等错误率 (ERR) 是 CER 的另一个名称。\n\n### 60. D. 统一威胁管理\
  \ (UTM) 将多种安全服务整合到一个设备中。UTM 经常将防火墙、防病毒和 IDS 服务都集在一部设备中。\n- 选项 A、B 和 C 错误。这些都是很好的设备，但\
  \ UTM 是更好的选择。\n\n### 61. C. 隐式拒绝的安全概念规定，任何新访问账户默认被拒绝所有访问。当该账户请求特定权限时，这些权限被显式应用。这意味着默认所有权限都是被隐式拒绝的。\n\
  - 选项 A 错误。最小权限是每个账户应该拥有的，但在这种场景中，所有账户都被赋予了默认权限。隐式拒绝的概念是更好的答案。\n- 选项 B 错误。职责分离是为了防止任何个人执行可能对公司产生重大安全影响的行动。\n\
  - 选项 D 错误。虽然你的网络安全性取决于其最薄弱的环节，但这不是该场景的最佳描述。\n\n\n\n\n\n## 62. C. 写一次多次读取（WORM）存储是一种高容量存储类型，其中数据一旦写入存储器，就无法进行编辑。它既提供了高容量存储，又提供了安全存储，因为备份内容不会被篡改。\n\
  \n- 选项 A 错误。大容量外部驱动器需要存储在安全的地方，而且它们可以被编辑，因此是不安全的。你可以通过加密来保护它，但题目中没有提到加密的驱动器。\n-\
  \ 选项 B 错误。备份带是较旧的技术。磁带经常出现问题，数据可能无法检索。\n- 答案 D 错误。备份介质应始终存储在异地，但存在磁带很容易损坏或损坏的问题，这对于长期存储来说是不可接受的。\n\
  \n## 63. A. SIEM（安全信息和事件管理）聚合了来自多个服务器和设备的日志。审查如此大量的日志非常困难，而且，当 Elizabeth 离开 SIEM\
  \ 管理控制台时，可能会发生问题。具有自动警报是发现需要 Elizabeth 注意问题的最佳方式。\n\n- 选项 B 错误。日志和事件异常可能很多，将它们转发到她的邮箱中非常笨拙，并且没有解决问题。Elizabeth\
  \ 仍然需要阅读它们以发现任何需要她注意的问题。\n- 选项 C 错误。这种情况不是理想的。\n- 选项 D 错误。审查 SIEM 日志是管理员发现问题的一种方法。因此，只有在已经知道某个问题时才审查日志并不是对\
  \ SIEM 的良好利用。\n\n## 64. D. 固定（Tethering）通常很廉，，简单地将便携设备固定在桌子上就可以使其难以被盗。没有一种防盗方法是万无一失的，但固定方法简单、成本效益且相当有效。\n\
  \n- 选项 A 错误。全盘加密（FDE）是一个好主意，它可以保护笔记本电脑上的数据。然而，笔记本电脑仍然可能被盗，驱动器被擦除，笔记本电脑被重复使用或出售。\n\
  - 选项 B 错误。GPS 标记可能允许你定位被盗的笔记本电脑，但它通常比固定贵。\n- 选项 C 错误。地理围栏（Geofencing）只是限制了设备的工作区域——它不能防止设备被盗。\n\
  \n## 65. A. 全盘加密（FDE）是保护任何设备上数据的最佳方式。在这种场景下，平板电脑上的敏感数据是最关心的问题；因此，使用 FDE 这些数据是所采取的最重要的安全措施。\n\
  \n- 选项 B 错误。GPS 标记可能是一个好主意——它可以帮助定位丢失或被盗的设备。然而，它没有 FDE 重要。\n- 选项 C 错误。地理围栏限制了设备的使用区域，它没有解决此场景中提出的问题。\n\
  - 选项 D 错误。内容管理始终是一个好主意。但在情况下，它无法解决最重要的安全关切问题。\n\n## 66. A. HIDS/HIPS 和 NIDS/NIPS\
  \ 各自都有厂商指定的输出内容。但所有此类设备都会输出流量所使用的协议、源和目的 IP 地址，以及源和目的端口。可能会提供更多信息，但这是所有 IDS/IPS\
  \ 显示的基本基本信息。\n\n- 选项 B 错误。这些设备中的许多不会显示可疑的攻击类型。操作设备的人员应该识别出给定端口上的 SYN 数据包泛洪是 SYN\
  \ 洪水攻击。\n- 选项 C 错误。用户名和机器名可能包含也可能不包含，但 IP 地址会包含。\n- 选项 D 错误。用户名和机器名可能包含也可能不包含，但\
  \ IP 地址会包含。\n\n## 67. A. 防火墙日志的标准项目是所有流量的源和目的 IP 地址及端口、流量使用的协议，以及该流量是被允许还是被拒绝。\n\
  \n- 选项 B 错误。防火墙日志记录了允许的流量和被拒绝的流量。\n- 选项 C 错误。许多防火墙不记录流量被拒绝的原因，但所有防火墙都会记录使用的协议。\n\
  - 选项 D 错误。防火墙日志记录了允许的流量和被拒绝的流量。\n\n## 68. A. 由于有 20 台服务器向 SIEM 发日志，事件去重将是非常重要的。\n\
  \n- 选项 B 错误。SIEM 是日志聚合和分析工具。日志转发是在事件发生前就建立的。\n- 选项 C 错误。这确实是某个时候要做的事，但不会是第一个动作。\n\
  - 选项 D 错误。这确实是某个时候要做的事，但不会是第一个动作。\n\n## 69. A. 在任何 IDS（HIDS/HIPS；NIDS/NIPS）中，传感器都会从其所在的网络段收集数据并将这些信息转发给分析器。\n\
  \n- 选项 B 错误。数据源是用于 IDS 的任何信息源。\n- 选项 C 错误。管理器是人类操作员用于与 NIDS/NIPS 或 HIDS/HIPS 交互的接口。\n\
  - 选项 D 错误。分析器接收传感器发送的数据并分析这些数据以寻找攻击指标。\n\n## 70. A. 访问控制列表（ACL）有一份关于哪些请求者允许访问哪些资源的列表。使用\
  \ IP 地址阻止或允许请求是一种常用技术。\n\n- 选项 B 错误。网络入侵预防系统（NIPS）不是访问控制的一部分。\n- 选项 C 错误。网络入侵检测系统（HIPS\
  \ **注：此处应为 HIDS*）不是访问控制的一部分。\n- 选项 D 错误。端口阻止可以在路由器或交换机上进行，但不是访问控制的一部分。\n\n## 71.\
  \ D. 安全 Shell（SSH）使用端口 22 并提供加密的命令行界面。Telnet 使用端口 23 且不安全。\n\n- 选项 A 错误。Telnet 使用端口\
  \ 23 且不安全，端口 20 和 21 用于文件传输协议（FTP）。\n- 选项 B 错误。端口 20 和 21 用于文件传输协议（FTP）。你应该开启的是端口\
  \ 22。\n- 选项 C 错误。这与正确答案相反。你应该阻止 23 并允许 22。\n\n## 72. B. 反向代理是代理服务器的一种，代表客户端从一个或多个服务器获取资源。源看起来像是来自代理服务器。换句话，整个外部世界对客户端来说都是代理服务器。\n\
  \n- 选项 A 错误。正向代理服务器作为客户端从其他服务器获取资源的媒介。\n- 选项 C 错误。透明代理位于客户端和互联网之间，正如名称所示，客户端是察觉的。这些通常与网关一起。\n\
  - 选项 D 错误。虽然防火墙和代理服务器可以一起，但它们是两种不同的技术。\n\n## 73. C. 通过给测试人员登录权限，你允许他进行特权扫描（即带有某些权限的扫描）。\n\
  \n- 选项 A 和 B 错误。它们描述了测试人员对网络的了解程度。特权扫描不可能是黑盒测试，但可以是白盒测试或灰盒测试。\n- 选项 D 错误。虽然这在语法上正确，但这不是行业内使用的术语。\n\
  \n## 74. C. 网络入侵检测系统（NIDS）将检测给定网络段上的可疑攻击并通知管理员。例如，在异常检测中，如果偏离了预期模式或行为，管理员将收到通知。\n\
  \n- 选项 A 错误。主机入侵检测系统（HIDS）仅检测单个主机的入侵。\n\n\n\n\n* 选项 B 错误。主机入侵防御系统（`HIPS`）仅检测单个主机上的入侵，并会拦截可疑入侵。\n\
  * 选项 D 错误。网络入侵防御系统（`NIPS`）会检查整个网段，但它并不是简单的通知管理员让他们采取行动，`NIPS` 会拦截可疑流量。\n\n### 75.\
  \ **C.** 网络入侵检测系统（`NIDS`）会检测跨网段的入侵情况，但它不会阻止可能的攻击，因此不会因为误报中断工作。\n\n* 选项 A 错误。主机入侵检测系统（`HIDS`）只会检测特定主机的入侵。\n\
  * 选项 B 错误。主机入侵防御系统（`HIPS`）只会检测特定主机的入侵并对其进行拦截，因此可能会因为误报中断工作。\n* 选项 D 错误。网络入侵防御系统（`NIPS`）会检测跨网段的入侵，但它也会拦截它们，可能会中断工作流。\n\
  \n### 76. **A.** 公司提供的设备提供了最高的安全性，因为公司拥有并为员工提供设备。这允许公司完全控制安全，例如防止运营商解锁、禁用录音风风、防止\
  \ WiFi 直连和 WiFi Ad Hoc。\n\n* 选项 B 错误。自选设备（`CYOD`）允许员工从公司选择的一系列选项中选择他们任何设备。但这些仍然是员工拥有并控制的设备。\n\
  * 选项 C 错误。地理标记仅允许你定位设备。\n* 选项 D 错误。自备设备（`BYOD`）允许员工将他们拥有的任何设备带入工作。这是一个安全隐患。\n\n\
  ### 77. **A.** 隧道模式是 `IPSec` 加密整个数据包、头部和数据的模式。这防止了嗅探流量的人收集有关流量的元数据。\n\n* 选项 B 错误。身份验证头（`AH`）提供认证和完整性，但没有加密，因此不是最安全的模式。\n\
  * 选项 C 错误。互联网密钥交换（`IKE`）用于在 `IPSec` 中建立安全关联。\n* 选项 D 错误。传输模式仅加密数据，不加密头部。这允许攻击者嗅探有关流量的元数据。因此，这不是最安全的模式。\n\
  \n### 78. **D.** 主备式集群具有不处理任何工作负载的备份服务器。如果主服务器发生故障，它们会被激活。这意味着备份服务器没有经历过任何工作负载，实际上是一台新机器。\n\
  \n* 选项 A 错误。主活动集群中的所有服务器都在工作，并且在它们之间进行负载均衡。如果主服务器故障，备份服务器在不久的将来也有可能故障。\n* 选项 B 和\
  \ C 错误。轮询和亲和性描述的是连接在集群中是如何路由的，而不是故障转移功能是如何运作的。\n\n### 79. **A.** 胖型无线接入点（`WAP`）具有所有所需的功能，例如：具有像二层或三层交换机一样在有线接口之间转发流量的能力，以及\
  \ MAC 过滤，且不需要其他服务器或设备。在这种情况下，由于每个 `WAP` 可能有完全不同的需求，因此首选胖型 `WAP`。\n\n* 选项 B 错误。瘦型\
  \ `WAPs` 需要某些服务器或设备来卸载功能。由于每个 `WAP` 的需求不同，使用瘦型 `WAPs` 实现将非常困难。\n* 选项 C 错误。中继器重新发送信号。\n\
  * 选项 D 错误。`Full` 不是行业中使用的术语。\n\n### 80. **D.** 良好的隐私加密（`PGP`）非常适用于邮件安全。它为邮件签名和加密提供自签名证书。它的成本也极低。\n\
  \n* 选项 A 错误。简单邮件传输协议安全版（`SMTPS`）是加密的，但它仅用于加密。\n* 选项 B 错误。`PGP` 是为邮件签名和加密提供自签名证书的。`SMTPS`\
  \ 是加密的。\n* 选项 C 错误。`IKE` 用于在 `IPSec` 中建立安全关联。\n\n### 81. **A.** 数据执行防护（`DEP`）防止代码在标记为不可执行的内存区域执行。这有助于缓解缓冲区溢出攻击。\n\
  \n* 选项 A 错误。`HIPS` 能够检测入侵并会进行拦截，因此可能会因为误报中断工作。\n\n* 选项 B 错误。全磁盘加密（`FDE`）保护静态数据，但不能阻止访问内存。\n\
  * 选项 C 错误。统一威胁管理（`UTM`）结合了杀毒病毒、防火墙等安全服务。\n* 选项 D 错误。入侵检测系统（`IDS`）监控流量而不是程序。\n\n\
  ### 82. **B.** 实时传输协议（`RTP`）用于传输视频但不是加密的。\n\n* 选项 A 错误。会话协议（`SIP`）用于发起通话而不是发送数据。\n\
  * 选项 C 错误。速度不是问题。\n* 选项 D 错误。速度不是问题。\n\n### 83. **A.** 输出来自 `nslookup`，它用于与 DNS\
  \ 服务器交互。\n\n* 选项 B 错误。`ipconfig` 命令显示网卡配置。\n* 选项 C 错误。`netstat -a` 命令将显示监听端口。\n\
  * 选项 D 错误。输出不是 `dig`。\n\n### 84. **A.** 在线状态协议（`OCSP`）实时检查证书状态。因此，当浏览器下载证书时，它会首先获取证书是否有效的实时更新。\n\
  \n* 选项 B 错误。`X.509` 是证书的标准，并不决定何时检查。\n* 选项 C 错误。证书吊销列表（`CRL`）显示证书状态，但它们不是实时的。\n\
  * 选项 D 错误。公钥基础设施（`PKI`）不决定何时检查。\n\n### 85. **D.** 加密移动设备是确保设备数据安全的最佳方法。如果设备被盗或简单丢失，数据将无法提取。\n\
  \n* 选项 A 错误。地理围栏限制了设备的运行区域。但即使是未运行的设备也可以访问数据。\n* 选项 B 错误。屏幕锁始终是一个好主意；但它没有设备加密有效。\n\
  * 选项 C 错误。地理标记可以用于定位设备，但它不能阻止数据从设备上拷贝。\n\n\n\n\n-   选项 B、C 和 D 都是错误的。ping 扫描变体都以\
  \ `-P` 开头（`-PT TCP ping`、`-TS SYN ping` 等），其中 `-T` 表示计时，选项范围从 `T1`（最慢）到 `T5`（最快）。\n\
  \n## 88. D. `Tcpdump` 是一种广泛使用的数据包嗅探器，为 Linux 设计但已移植到 Windows。它可以在 Linux 的 shell（Windows\
  \ 的命令行）中运行，允许用户转储当前网络流量。\n\n- 选项 A 错误。`Ophcrack` 是一个 Windows 密码破解工具。\n- 选项 B 错误。`Nmap`\
  \ 是端口扫描、非法系统检测和网络映射工具。\n- 选项 C 错误。`Wireshark` 是一个网络流量扫描器和无线扫描器，但它适用于 Windows 或 Macintosh。\n\
  \n## 89. A. `tracert` 命令用于追踪到目标的路由（Linux 中对应的命令是 `traceroute`）。`-h` 命令设置了放弃之前的最大跳数。\n\
  \n- 选项 B 错误。图像显示最大为 10 跳。如果不指定最大跳数，`tracert` 将执行 30 跳。\n- 选项 C 错误。这不是 `netstat`\
  \ 的输出。\n- 选项 D 错误。这不是 `nmap` 的输出。\n\n## 90. A. 传输层安全协议 (`TLS`) 可保护任何网络通信（HTTP、LDAP、SMTP\
  \ 等），并使用数字证书。\n\n- 选项 B 错误。安全套接层 (`SSL`) 是一种老得多的技术，已被 `TLS` 取代。`TLS` 最初于 1999 年发布。\n\
  - 选项 C 错误。你可以建立 `IPSec VPN`，但它的开销会比 `TLS` 大，而且它无法利用现有的数字证书基础设施。\n- 选项 D 错误。`WPA2`\
  \ 用于安全的 WiFi 传输。\n\n## 91. C. 使用云存储意味着数据被放置在云端，可以从网络外部访问。这为数据泄露防护 (`DLP`) 带来了问题，因为它提供了一种从网络外提取数据的方便方法。\n\
  \n- 选项 A 错误。对于 `DLP` 存在安全危害。\n- 选项 B 错误。云服务器不太可能产生 `Malware`，但这不是 `DLP` 关注的问题。\n\
  - 选项 D 错误。公司安全策略适用于任何公司资产，包括云存储。\n\n## 92. D. 如果担心外部入侵者，`DMZ` 是放置蜜罐（honeypot）的最佳位置。入侵者很可能首先突破\
  \ `DMZ` 的外部防火墙。蜜罐理论上可以在那里捕获入侵者，防止其进一步进入网络。\n\n- 选项 A、B 和 C 都是错误的。当然，你可以将蜜罐放在任何地方，但最重要的区域是\
  \ `DMZ`。\n\n## 93. A. 备份数据时，如果你不对数据进行加密，那么任何人都可以恢复备份并访问你备份的所有数据。并不是所有的备份工具都包含数据加密功能。\n\
  \n- 选项 B 和 D 错误。这两者都是很好的主意且能确保数据完整性，但它们没有被提到 Sheila 的考虑范围内。\n- 选项 C 错误。虽然这很重要，但它是所有备份工具都具备的功能。\n\
  \n## 94. C. 标志头抓取（Banner grabbing）是一个过程，某人连接到目标 Web 服务器并尝试收集信息，字面意思是抓取 Web 服务的“标志头”。这通常通过\
  \ `telnet` 连接到 Web 服务器来实现。也可以使用 `netcat` 配合 HTTP 请求来完成。\n\n- 选项 A 错误。被动侦察不涉及与服务器的活动连接。\n\
  - 选项 B 错误。虽然这是主动侦察，但更准确的描述是标志头抓取。\n- 选项 D 错误。此场景描述的不是漏洞扫描。\n\n## 95. B. 漏洞利用框架（Exploit\
  \ frameworks）是提供一种框架来寻找漏洞，然后尝试利用这些漏洞的工具。这些工具是网络安全测试的重要部分。\n\n- 选项 A 错误。漏洞扫描器只会识别漏洞；不会提供利用漏洞的手段。\n\
  - 选项 C 错误。`Metasploit` 是一个流行的利用框架，但问题问的是工具类别，而不是指识别某个特定的工具。\n- 选项 D 错误。`Nessus`\
  \ 是一个知名的漏洞扫描器。\n\n## 96. D. 美国国防部数据清理标准 `DoD 5220.22-M` 建议平均进行 7 次完全擦除以清除数据。该标准包含一个矩阵，你可以根据数据的敏感性与特定的擦除次数进行匹配，但通用规则是\
  \ 7 次。\n\n- 选项 A、B 和 C 都是错误的。少于 7 次的擦除被认为无法防止数据恢复工具恢复数据。\n\n## 97. C. 防火墙确实阻止入站流量，并可以配置以微调这种阻止。然而，它们也可以也应该配置为处理出站流量。这可以防止数据外泄和其他违规。\n\
  \n- 选项 A 错误。此配置缺少出站规则。\n- 选项 B 错误。加密某些流量通常是个主意，但并非所有流量都可以或应该被加密。例如，`DNS` 请求通常是不加密的。\n\
  - 选项 D 错误。数字证书可以是非常好的认证机制。但并非所有流量都可以通过数字证书进行认证。\n\n## 98. C. `X.509` 是最常用的数字证书标准。创建自签名证书相对容易。但如果你在公共网站上使用自签名证书，每个访问该网站的人都会收到浏览器的安全错误信息。\n\
  \n- 选项 A 错误。你可以加密所有网络流量，这通常通过 `TLS` 和 `X.509` 证书完成。\n- 选项 B 错误。`PGP` 证书通常用于电子邮件，不用于网站。\n\
  - 选项 D 错误。这不合适——他不应该使用自签名证书。\n\n## 99. C. 端口 443 用于 `HTTPS`，即通过 `TLS` 加密的 HTTP。端口\
  \ 22 用于安全外壳 (`SSH`)，这是一种安全、加密的命令行界面，通常供管理员使用。端口 80 用于未加密的 HTTP 流量。端口 23 用于 `telnet`，这是一种不安全的命令行界面。\n\
  \n- 选项 A、B 和 D 错误。这些不是应该阻止或开启的正确端口。\n\n## 100. B. 隐写术（Steganography）允许你将数据、消息或整个文件嵌入其他文件中。通常使用这种方法来嵌入某些标识标记，以跟踪文档的所有者可能还有其源地。隐写术可以追踪机密文档。\n\
  \n- 选项 A 和 D 错误。任何类型的加密都可以用于保护文档，但如果文档泄露，它无法帮助识别文档。\n- 选项 C 错误。哈希（Hashes）在检测文档变化方面有用，但在识别文档及其来源方面作用较小。\n\
  \n## 101. B. 端口 465 用于安全简单邮件传输协议 (`SMTPS`)。端口 993 用于安全互联网消息访问协议 (`IMAPS`)。端口 995\
  \ 用于安全邮局协议 (`POP3S`)。通过允许这些端口，你允许了加密邮件通过。端口 25 用于未加密的 `SMTP`。端口 110 用于未加密的 `POP3`。端口\
  \ 143（或 220）可用于未加密的 `IMAP`。通过阻止这些端口，你防止了未加密的电子邮件流量。\n\n- 选项 A、C 和 D 错误。所有这些的端口配置都是错误的。事实上，选项\
  \ A 与你想要实施的完全相反。\n\n## 102. A. 这些防火墙都在记录所有活动，但日志并没有集中。这使得监控所有日志变得非常困难。通过集成 `SIEM`，所有日志都将集中，Mark\
  \ 可以接收到问题的警报。\n\n- 选项 B 和 D 错误。蜜罐或蜜罐网络可能是个好主意，但都不是逻辑上的下一步步骤，也不是防火墙配置的一部分。\n\n\n\n\
  \n\n- `Option C` 是错误的。与 `Active Directory (AD)` 集成对 Mark 来说可能是一个好选择，但它不会改进他的防火墙配置。\n\
  \n### 103. C\n在 `IPSec` 中，隧道模式（tunneling mode）不仅加密包数据，还加密包头。这防止了他人确定流量使用的协议、数据包序号或其他元数据。\n\
  \n- `Option D` 是错误的。传输模式（transport mode）是 `IPSec` 加密数据但不加密包头的模式。\n- `Option A` 是错误的。`Authentication\
  \ Header`（认证头）用于完整性和身份验证。\n- `Option B` 是错误的。`ESP` (`Encapsulating Security Payload`)\
  \ 在 `IPSec` 中用于认证和加密，无论使用的是隧道模式还是传输模式。\n\n### 104. A\n如果入侵检测系统漏掉了攻击（无论是 `NIDS` 还是\
  \ `HIDS`），这属于漏报（false negative）。`IDS` 错误地将流量识别为非攻击。John 需要重新配置以减少漏报。\n\n- `Option\
  \ B` 是错误的。端口拦截是防火墙的功能。\n- `Option C` 是错误的。状态检测检测 (`SPI`) 是一种防火墙操作方法。\n- `Option\
  \ D` 是错误的。当 `IDS`（或任何安全设备）将合法流量标记为攻击时，这被称为误报（false positive）。\n\n### 105. D\n远程访问\
  \ `VPNs` 用于允许不同位置的用户通过安全连接远程访问网络。出差员工是使用远程访问 `VPN` 的典型场景。\n\n- `Option A` 是错误的。`L2TP`\
  \ 是一种 `VPN` 协议，可以用于站点对站点或远程访问 `VPNs`。\n- `Option B` 是错误的。`IPSec` 是一种 `VPN` 协议，可以用于站点对站点或远程访问\
  \ `VPNs`。\n- `Option C` 是错误的。站点对站点 `VPN` 是站点之间的永久 VPN 连接。\n\n### 106. A\n由于员工使用“公司所有且个人可用（COPE）”设备进行个人使用，这些设备将包含员工的个人信息。这可能导致个人和私有数据暴露给公司。\n\
  \n- `Option B` 是错误的。任何便携设备都有被用于数据外泄的可能，但 `COPE`并不比 `BYOD` 等其他配置更容易受到。\n- `Option\
  \ C` 是错误的。事实上，恰恰相反。由于公司控制配置，设备出现配置不当的可能性较低。\n- `Option D` 是错误的。此选项存在问题。\n\n### 107.\
  \ B\n应用管理主要关注确保只有授权和批准的应用程序安装在移动设备上。这是下一步应该执行的逻辑步骤。控制设备上允许运行哪些应用程序是基础安全的核心。\n\n\
  - `Option A` 是错误的。地理围栏（`Geofencing`）可能并不适用于每家公司。\n- `Option C` 是错误的。地理定位（`Geolocation`）对于定位被盗设备有用，但它不是安全工作中的下一步。\n\
  - `Option D` 是错误的。远程擦除（`Remote wipe`）在设备丢失或被盗时有用，但它不是安全工作中的下一步。\n\n### 108. A\n\
  容器化（Containerization）为设备建立了一个安全的、隔离的区域，并进行了加密。它将容器内的数据和应用程序与手机的其他部分分离。这是在 `BYOD`\
  \ 上将公司数据与个人数据隔离的最佳方法。\n\n- `Option B` 是错误的。屏幕锁是移动设备安全的基础，但它们无法解决这一问题。\n- `Option\
  \ C` 是错误的。`SQL FDE` 是一个好主意，但它不能隔离公司数据和个人数据。\n- `Option D` 是错误的。生物识别（`Biometrics`）是认证的极佳想法，但无法解决此场景下的问题。\n\
  \n### 109. A\n`sideloading`（侧载）一词通常指在两个设备之间传输数据——更具体地说是指移动设备。它通常与通过 `sideloading`\
  \ 从 Google Play 以外的地方安装 `Android` 应用有关。\n\n- `Option B` 是错误的。加载是通过某些设备完成的，而不是通过\
  \ `WiFi`。\n- `Option C` 是错误的。`sideloading` 不会绕过屏幕锁。\n- `Option D` 是错误的。`Sideloading`\
  \ 可能会让恶意软件进入设备，但其侧载过程需要用户的积极参与。\n\n### 110. C\n无论设备是“公司所有且个人可用（COPE）”还是“自备设备（BYOD）”，任何移动设备都可以是\
  \ `USB On-the-Go (OTG)` 设备。这意味着设备本身可以作为质存储 `USB` 驱动器，数据可以在设备上被外泄。这是数据泄漏防护（`DLP`）关注的问题。\n\
  \n- `Options A` 和 `B` 是错误的。任何设备都可以是 `USB OTG`。\n- `Option D` 是错误的。你不需要越手机或平板电脑即可作为\
  \ `USB OTG` 使用。\n\n### 111. B\n域名系统安全扩展（DNSSEC）是一套扩展，通过允许验证 `DNS` 响应来为 `DNS` 协议增加安全性。有了\
  \ `DNSSEC`，`DNS` 协议更容易受到某些类型攻击的影响，特别是 `DNS 欺骗`攻击。\n\n- `Option A` 是错误的。`IPSec` 用于\
  \ `VPNs`，无法缓解 `DNS 投毒`。\n- `Option C` 是错误的。`L2TP` 用于 `VPNs`，无法缓解 `DNS 投毒`。\n- `Option\
  \ D` 是错误的。`TLS` 可用于加密 Internet 上的传输，但对缓解 `DNS 投毒` 没有帮助。\n\n### 112. D\n`Kerberos`\
  \ 使用带有时间限制的加密票据。密钥分发中心（`Key Distribution Center`）、客户端和服务都需要同步时间。如果网络时间协议（`NTP`）未正常运行，合法的票据可能会过期。\n\
  \n- `Options A`, `B`, 和 `C` 是错误的。这些项都不需要时间同步。\n\n### 113. C\n网络地址分配（`Network Address\
  \ Allocation`）分配网络地址的过程。在 `DHCP` 环境中，可以通过这样做来限制从单个网段请求 `IP` 地址的数量。例如，如果一个网络网段只有\
  \ 30 个节点，那么分配给该网段的地址就不会超过 30 个。这将缓解 `DHCP 饥饿`。\n\n### 114. D\n这实际上是关于网络地址分配的。无分类域间路由（`CIDR`）表示法提供了掩码的网络位数。剩余的位数用于节点。根据\
  \ `CIDR` 表示法（`/N`）确定子网大小的公式非常简单：`2 ^ (32 - N) - 2`。在这种情况下，即为 `2 ^ (32 - 26) - 2`\
  \ 或 `(2 ^ 6) - 2`，或 `64 - 2`，即 `62` 个节点。\n\n- `Options A`, `B`, `C` 都是错误的。它们产生的子网要么太小（`/27`\
  \ 和 `/29`），要么没必要大（`/24`）。\n\n### 115. B\n基础设施即服务（`IaaS`）利用第三方服务和模板以虚拟化方式提供网络基础设施，但客户公司仍负责管理。通过转向虚拟化解决方案，管理变得非常集。。通过使用\
  \ `IaaS`，Lydia 将降低成本，但她仍将保持直接控制。\n\n- `Option A` 是错误的。外包将把网络控制权交给第三方。\n- `Option\
  \ C` 是错误的。平台即服务（`PaaS`）只能提供操作系统。\n- `Option D` 是错误的。开源并不会有助于集中管理，且总成本可能并不更低。\n\n\
  \n\n\n\n### 116\nC. 终端接入控制器访问控制系统 (TACACS+) 是一种远程访问协议。它使用 `TCP`（这是一种可靠的传输协议），并对消息进行完全加密。`TACACS+`\
  \ 还支持多种网络协议。\n\n- Option A 错误。远程拨号用户认证服务 (`RADIUS`) 使用 `UDP`，它不是可靠的传输协议，且不支持许多网络协议。\n\
  - Option B 错误。`Diameter`（不是缩写）确实支持 `TCP`，但它没有对消息进行完全加密。\n- Option D 错误。`IPSec` 是一种\
  \ VPN 协议，而不是远程访问和认证协议。\n\n### 117\nC. IP 语音 (`VoIP`) 通过至少两个协议实现。会话建立协议 (`SIP`) 用于建立通话。实时传输协议\
  \ (`RTP`) 用于发送实际数据。这两个协议至少必须允许通过防火墙。如果有安全通话，则还需要允许安全实时传输协议 (`SRTP`)。\n\n- 选项 A 错误。`RADIUS`\
  \ 是远程认证协议，而简单网络管理协议 (`SNMP`) 用于管理网络。\n- 选项 B 错误。`TCP` 和 `UDP` 是协议类型；所有网络协议都是 `TCP`\
  \ 或 `UDP`。\n- 选项 D 错误。需要 `SIP`，但 `RADIUS` 是远程认证协议。\n\n### 118\nD. 无类网间路由 (`CIDR`)\
  \ 记法提供了网络掩码的位数。剩余位用于节点。要根据 `CIDR` 记法 (`/N`) 确定子网的大小，公式非常简单：`[2 ^ (32 –N)] – 2`。在这种情况下，为\
  \ `[2 ^ (32 – 29)] – 2`，即 `(2 ^ 3) – 2`，或 `8 – 2`，结果为 `6` 个节点。\n\n字体 选项 A、B 和 C\
  \ 错误。最常见的错误答案是 C，如果你在计算末尾忘记减 2，就会得到该结果。\n\n### 119\nC. 使用应用黑名单时，任何不在黑名单上的应用程序都是被允许的。由于无法知道世界上所有的恶意程序，这意味着至少会有某些恶意程序不会被拦截。更好的方法是应用白名单。在白名单中，只有列表上的应用程序才能被安装。\n\
  \n- 选项 A 错误。黑名单只会拦截有限数量的恶意程序。\n- 选项 B 错误。这种方法不会拦截任何合法应用程序。事实上，它也不会拦截所有的恶意程序。\n-\
  \ 选项 D 错误。这不应该对生产力产生负面影响。\n\n### 120\nA. 补丁管理软件用于向网络分发补丁。此类软件还会提供报告，说明哪些机器已打补丁，哪些尚未打补丁，以及应用补丁时遇到的任何问题。\n\
  \n字体 选项 B 错误。企业网络不应使用自动更新。特定的更新可能会干扰公司内部某些关键任务应用程序。相反，补丁应该先经过测试，然后发布到网络中。\n- 选项\
  \ C 错误。问题在于让未打补丁的系统打上补丁。\n- 选项 D 错误。扫描是可能的，但方案不如补丁管理。\n\n### 121\nC. 统一威胁管理 (`UTM`)\
  \ 将多种安全服务整合到一个设备中。在这个例子中，我们将拦截（防火墙）、检测 (`IDS`）和反恶意软件全部集成在一个设备中。\n\n- 选项 A 错误。`IDS`\
  \ 只能检测可能的入侵。它无法完成题目中要求的所有目标。\n- 选项 B 错误。防火墙会阻止入站流量，但无法完成题目中的其他目标。\n- 选项 D 错误。`SIEM`\
  \ 用于日志聚合，无法完成题目中的任何目标。\n\n### 122\nB. 数据泄露防护 (`DLP`) 是一个广义术语，包含了一系列旨在防止数据丢失的技术和策略。限制使用未经授权的\
  \ `USB` 设备就是 `DLP` 的一个范例。\n\n- 选项 A 错误。入侵检测系统 (`IDS`) 无法解决此问题。\n- 选项 C 错误。内容过滤限制了用户可以访问的内容（例如通过网络浏览器）。这无法阻止他们将文档复制到未经授权的\
  \ `USB` 设备中。\n- 选项 D 错误。网络入侵防御系统 (`NIPS`) 无法阻止文档复制到 `USB`。\n\n### 123\n| 防火墙 | C\
  \ |\n| :--- | :--- |\n| HIDS | A |\n| SIEM | B |\n| NIDS | D |\n\n### 124\nC. 当设备被越狱时——特别是\
  \ `iOS` 设备——设备所有者就可以在设备上安装他们想要的任何应用程序。这可能导致未经授权且可能带有恶意的应用程序被安装。\n\n- 选项 A 错误。越狱后的设备仍然可以打补丁。\n\
  - 选项 B 错误。全盘加密在越狱设备上仍然会正常工作。\n- 选项 D 错误。无论设备是否越狱，数据都可以在移动设备上外泄。\n\n### 125\nB. 空中更新\
  \ (`OTA`) 通过无线实现的。这可以在移动网络上完成，无论设备位于何处。对移动设备使用 `OTA` 更新是最有效的解决方案。\n\n字体 选项 A 错误。这种方法可行，但会中断员工的日程安排。\n\
  - 选项 C 错误。从公司拥有变为自带设备 (`BYOD`) 实际上会让情况恶化，但这样做免除管理更新的责任。\n- 选项 D 错误。需要一种实施机制。`OTA`\
  \ 就是一种机制。\n\n### 126\nA. 远程拨号用户认证服务 (`RADIUS`) 是一种旧的认证和控制协议，但它使用 `UDP`。其他选项均未使用\
  \ `UDP`。\n\n字体 选项 B 和 C 错误。`Diameter` 和 `TACACS+` 都是较新的协议，但它们都使用 `TCP`。\n- 选项 D\
  \ 错误。`IPSec` 是一种 VPN 协议，而不是认证控制协议。\n\n### 127\nC. 员工使用热点是一个严重的安全问题。然而，没有任何技术方案可以解决这个问题。因此，实施并执行禁止热点的明确政策是唯一可行的选择。\n\
  \n字体 选项 A 错误。她没有使用公司的无线网络；她将手机变成了 `WAP`（无线接入点）。\n- 选项 B 错误。Web 应用防火墙 (`WAF`) 保护服务器；无法限制出站流量。\n\
  - 选项 D 错误。主机入侵防御系统 (`HIPS`) 只有在安装在热点的机器上时才有机会解决此问题。\n\n### 128\nA. 许多银行已经实施了策略，当有人从未知位置登录银行网站时，会向客户发送包含验证码的短信。这为验证客户身份提供了第二个通信通道。\n\
  \n字体 选项 B 错误。所有银行网站已通过 `TLS` 加密，这并不能解决此问题。\n- 选项 C 错误。强密码是一个极佳的主意，但它无法解决此问题。\n-\
  \ 选项 D 错误。这种限制会严重影响银行网站的可用性。\n\n### 129\nA. 尽管在设备上运行自定义固件可能会导致很多问题，但最可能的问题是安装了未经的软件。这些软件可能是恶意软件。\n\
  \n字体 选项 B 和 C 错误。这些情况确实可能发生，但它们不是主要问题。\n- 选项 D 错误。这是一个安全问题。\n\n\n\n\n\n### 130.\
  \ B. 网络访问控制 (NAC) 允许网络在设备连接之前对其执行某种程度的主机健康检查。使用代理的 NAC 时，会在任何想要连接到网络的设备上安装软件代理。该代理可以对\
  \ BYOD（自自带设备）进行更彻底的系统健康检查。\n\n* 选项 A 错误。无代理的 NAC 很有用，但效果不如于基于代理的 NAC。\n* 选项 C 和\
  \ D 错误。更强的身份验证是一项安全措施，但它无法解决扫描 BYOD 以确保符合安全规则的问题。\n\n### 131. C. 网络访问控制 (NAC) 在允许设备连接之前对设备进行系统健康检查，并验证设备是否符合最低安全标准。基于代理的\
  \ NAC 在扫描设备方面更加彻底。然而，这会在访问者的设备上留一个代理。可溶解代理（dissolvable agent）会在一段时间后删除。\n\n* 选项\
  \ A 错误。持久性 NAC 会对访问者的设备产生影响。\n* 选项 B 错误。无代理的 NAC 影响较小，但也会不够彻底，因此安全性也较低。\n* 选项 D\
  \ 错误。公司所有个人许可 (COPE) 设备对于客人来说是不可能的。\n\n### 132. C. 文件完整性检查器通过存储各种文件的哈希值来工作。任何时候，管理员可以使用文件完整性检查器将存储的哈希值与网络上“活动”文件的哈希值进行比较。这将检测出文件是否发生了任何更改。\n\
  \n* 选项 A 错误。网络访问控制 (NAC) 用于确保连接到网络的设备符合最低安全标准。\n* 选项 B 错误。网络入侵检测系统 (NIDS) 无法告诉你文件是否被更改。\n\
  * 选项 D 错误。漏洞扫描器只扫描已知漏洞。\n\n### 133. B. 带外网络入侵检测系统 (NIDS) 将管理部分放在不同的网络段上，这增加了 NIDS\
  \ 检测的难度。\n\n* 选项 A 错误。混合型 NIDS 结合了网络节点 IDS (NNIDS) 和主机 IDS (HIDS)。\n* 选项 C 错误。网络入侵预防系统\
  \ (NIPS) 其本质通常很容易被发现。通过拦截违规流量，它绝对会被注意到。\n* 选项 D 错误。网络节点 IDS (NNIDS) 使用网络方法，但它将 IDS\
  \ 功能委托给单个主机。\n\n### 134. B. SSL 解密器用于解密 SSL/TLS 传输。解密器必须具有适当的加密密钥和证书才能完成此操作。这是公司监控出站\
  \ SSL/TLS 流量的好方法。流量在网络网关之前被解密，然后重新加密以离开网络。这允许对出站流量进行分析。\n\n* 选项 A 和 C 错误。NIDS 和\
  \ NIPS 无法看到加密流量的内容。\n* 选项 D 错误。SSL 加器用于卸载建立 SSL/TLS 隧道的部分处理工作。\n\n### 135. A, C.\
  \ 一个用于网关，一个用于呼叫代理。从呼叫代理到网关使用的是 UDP 端口 2427，如果是从网关到呼叫代理，则使用 UDP 端口 2727。\n\n* 选项\
  \ B 和 D 错误。1707 是 L2TP，1727 是 PPTP。\n\n### 136. 协议映射\n\n| 协议 | 答案 |\n| --- | ---\
  \ |\n| IPSec | C |\n| WPA2 | A |\n| SSH | D |\n| SIP | B |\n\n### 137. C. 当你必须支持无法连接到更新、更安全的\
  \ WiFi 协议的机器时，将这些机器放在独立的 WiFi 网络上。这虽然不能防止它们被破解，但可以防止该泄露事件暴露你的整个网络。\n\n* 选项 A 错误。VLAN\
  \ 不适用于此场景。\n* 选项 B 错误。拒绝无线访问并非必要的。\n* 选项 D 错误。虽然加密网络流量通常是一个好主意，但它无法解决这个问题。\n\n###\
  \ 138. A. 安全文件传输协议 (SFTP) 是一种基于安全 Shell (SSH) 的协议，它提供目录列表、远程文件删除和其他文件管理功能。它也是安全的。\n\
  \n* 选项 B 错误。Secure Shell (SSH) 提供安全的终端连接。\n* 选项 C 错误。安全复制 (SCP) 基于 SSH 并且允许文件传输。但它不支持其他文件管理功能。\n\
  * 选项 D 错误。IPSec 是一种 VPN 协议。\n\n### 139. A. 第三方应用商店是由供应商以外的人运行的商店。它们对可以放入其中的应用没有限制限制。这可能导致恶意应用出现在商店中。通过只使用供应商商店（如\
  \ iTunes、Google Play 等），你可以确保应用已经经过了恶意软件扫描。\n\n* 选项 B 错误。漏洞扫描是一个自动化过程，用于检查已知漏洞的存在。\n\
  * 选项 C 和 D 错误。这两者都指的是测试人员获得了多少关于网络的信息。无论在黑盒测试还是白盒测试中，仍然会有初始攻击利用。\n\n### 140. C.\
  \ 查看密码是否可以破解的最快方法是尝试破解它们。这是通过使用一个或多个已知且可靠的密码破解器来实现的。如果你能够破解自己的密码，说明它们是不安全的。\n\n\
  * 选项 A 错误。漏洞扫描器不检查密码，它们只检查基础要求。\n* 选项 B 错误。所担心的问题是策略可能不足。因此，审计只会显示人们是否遵守了策略。\n*\
  \ 选项 D 错误。密码通常以哈值形式存储。这并不能像彩虹表（rainbow tables）这样的工具破解密码。\n\n### 141. B. 端口 25 用于简单邮件传输协议\
  \ (SMTP)，用于发送电子邮件。端口 110 用于邮局协议版本 3 (POP3)，用于接收电子邮件。这两个端口用于这些电子邮件协议的未加密版本。因此，如果在使用这些端口，你将看到未加密的凭据。用户名和密码将以明文发送。\n\
  \n* 选项 A 错误。端口 80 和 443 用于网站流量。\n* 选项 C 错误。端口 20 和 21 用于 FTP 流量。\n* 选项 D 错误。数字证书表示加密数据，而端口\
  \ 25 和 110 则不是。\n\n### 142. B. Secure Shell (SSH) 使用端口 22。如果发生了允许外部访问 SSH 服务器的破解，那么\
  \ 22 端口上将会有流量。\n\n* 选项 A 错误。端口 23 用于 telnet，而不是 SSH。\n* 选项 C 错误。SSH 是加密的，因此你看不到明文凭据。\n\
  * 选项 D 错误。这种破解不会导致格式错误的凭据。\n\n### 143. B. 推送通知用于在更新准备就绪时发送。通过推送通知，你不需要等待用户检查更新；一旦更新准备好，它就会发送。\n\
  \n* 选项 A 错误。固件空中更新 (OTA) 是一个好主意，但这个问题是关于自定义应用，而不是固件。\n* 选项 C 错误。这个问题不在于是否已计划了更新，而在于是否已应用。\n\
  * 选项 D 错误。反对自定义固件的策略是一项良好的安全策略。然而这个问题是关于自定义应用，而不是固件。\n\n### 144. D. Root（越根）是一个允许你获得\
  \ Android 操作系统代码 root 权限的过程。Root 允许用户执行几乎任何操作，包括修改设备上的软件代码或安装通常会被阻止的软件。\n\n\n\n\n\
  \n* Option A 错误。阻止第三方应用程序是一个好主意，但它没有解决管理访问问题。\n* Option B 错误。越狱（Jailbreaking）是 iOS\
  \ 设备的术语，而不是 Android。\n* Option C 错误。你首先需要获得管理权限才能安装自定义固件。\n\n### 145. A. `Biometrics`（生物识别），第\
  \ III 类认证非常稳健。生物识别基于授权用户的生物学特征，因此非常难以伪造，且用户无法丢失。\n\n* Option B 错误。屏幕锁屏是必要的，但它们仅仅是一种初级的安全措施。\n\
  * Option C 错误。与用户名和密码结合时，上下文感知认证会检查用户的所在地、用户登录的时间、用户登录的计算机、用户尝试的操作、上下文等。这是一种非常好的认证方法，但生物识别仍然更有效且更符合用户习惯。\n\
  * Option D 错误。存储分段对于将用户个人数据与公司数据分开非常有效，但它无法解决未经授权访问的问题。\n\n### 146. C. `Infrared`（红外）使用人眼不可见的光波。由于它是光，因此不受\
  \ `EMI`（电磁干扰）的影响。只要有视线，它可以在大多数距离上使用。缺点是任何视线的中断都会通信中断。\n\n* Option A 错误。`Bluetooth`（蓝牙）范围只有\
  \ 10 米。\n* Option B 错误。`WiFi` 受到 `EMI` 的影响。\n* Option D 错误。`RF`（射频）受到 `EMI` 的影响。\n\
  \n### 147. D. Windows 的 `-sW` 标志是 Windows 扫描。`-sT` 是 TCP 全连接扫描。这些并不隐蔽，但非常准确。`-sO`\
  \ 是协议扫描，将检查所有协议。`-T` 决定计时。由于隐蔽性并不重要，使用 `-T5` 按照你想要的速度进行扫描即可。\n\n* Option A 错误。`-sL`\
  \ 只是列出目标，`/24` 将扫描整个子网，而不仅仅是目标。\n* Option B 错误。`-T1` 会非常慢但具有隐蔽性。而且此命令缺少 `-sO` 协议扫描。\n\
  * Option C 错误。此扫描缺少 `-sO` 协议扫描，并且不必要地扫描整个子网。\n\n### 148. B. `arp -a` 命令显示地址解析协议路由表。这就是图中所示的内容。\n\
  \n* Options A 和 D 错误。`netstat` 命令列出当前的网络连接。\n* Option C 错误。`arp -s` 命令将主机添加到地址解析协议路由表中。\n\
  \n### 149. A. 黑名单阻止任何专门列在黑名单上的网站或内容。然而，要列出互联网上每一个不当网站是不可能的，因此某些网站不会被列入名单，从而是可以被访问的。\n\
  \n* Option B 错误。你可以认为这个问题是由于配置不当造成的，但那不是最可能的原因。\n* Option C 错误。代理服务器本身并不是问题所在。问题在于内容过滤。\n\
  * Option D 错误。虽然这种可能性存在，但它不是最可能的解释。\n\n### 150. C. `Metasploit` 是一个广泛使用的漏洞利用框架。它提供了一套完整的工具，允许你扫描目标、定位漏洞，然后尝试利用这些漏洞。\n\
  \n* Options A、B 和 D 错误。虽然这些每项都描述了 `Metasploit` 的某些方面，但它们是不完整的定义。\n\n### 151. B.\
  \ 配置合规性扫描解决方案采用管理员提供的配置设置，并扫描目标设备和计算机以查看其是否符合要求。这是检查合规性的有效方法。\n\n* Options A、C 和\
  \ D 都是错误的。这些每项都会发现至少一些配置合规问题，但与配置合规性扫描相比，其效率较低且/或更加繁琐。\n\n## 第 3 章：架构与设计\n\n###\
  \ 1. A. 正确答案是 `ISO 27002`。`ISO 27002` 用于实施信息安全。\n\n* Option B 错误。`ISO 27017` 用于云安全。\n\
  * Option C 错误。`NIST 800-12` 用于策略开发。\n* Option D 错误。`NIST 800-14` 用于通用安全。\n\n###\
  \ 2. A. 正确答案是 `Open Web Application Security Project`（开放 Web 安全项目）。它用于 Web 安全。\n\
  \n* Option B 错误。`North American Electric Reliability`（北美电力可靠性协会）关注发电厂安全。\n* Option\
  \ C 错误。`National Institute of Standards`（国立标准协会）不发布 Web 应用标准。\n* Option D 错误。`ISA/IEC`\
  \ 标准用于工业自动化和控制系统 (`IACSs`)。\n\n### 3. B. 供应商多样化提供了两个安全优势。第一个是如果某个供应商停止运营，就不会出现单点故障。第二个优点是提高了检测能力。\n\
  \n* Option A 错误。使用单一供应商意味着任何漏洞都会渗透到网络。\n* Option C 错误。`Vendor forking`（供应商分叉）不是行业中的术语。\n\
  * Option D 错误。\n\n### 4. D. 控制多样化意味着利用不同的控制措施来缓解相同的威胁。对于恶意软件，使用技术控制措施（如 `anti-malware`\
  \ 反恶意软件）至关重要。但采用管理控制措施（如良好的策略）并确保员工经过适当培训也是重要的。\n\n* Option A 错误。这种方法忽略了对员工的培训。\n\
  * Option B 错误。这种方法只使用一种控制：技术控制。\n* Option C 错误。这种方法忽略了对员工的培训。此外，网站白名单可能有用，但它留下了许多未检查的网站，每个网站都可能托管恶意软件。\n\
  \n### 5. A. 非军事化区 (`DMZ`) 是位于外部防火墙和内部防火墙之间的区域。它被专门设计用于放置面向公众的服务器。外部防火墙较为宽松，因此允许公众访问\
  \ DMZ 中的服务器。然而，内部防火墙更安全，从而防止了外部访问公司网络。\n\n* Option B 错误。`intranet`（内网）用于内部网页。\n\
  * Option C 错误。`Guest networks`（访客网络）为客人提供网络访问（通常是无线）。这不是放置服务器的合适位置。\n* Option D\
  \ 错误。`extranet`（外网）允许外部合作伙伴访问公司网络的部分场景。\n\n### 6. B. 物理隔离（Air gapping）是指服务器不连接网络。这在字面上意味着服务器和网络之间有“空气”。这防止了恶意软件感染备份服务器。\n\
  \n* Options A 和 C 错误。独立的 `VLAN` 或物理网络分段可以增强安全性，但不如物理隔离有效。\n* Option D 错误。`honeynet`（蜜罐网）是一种良好的安全措施，但它无法对恶意软件提供最佳保护。\n\
  \n\n\n\n\n### 7. C. 安全的第一步是加固操作系统，其中最基础的方面之一就是关闭不需要的服务。无论何种操作系统，这一点都适用。\n\n- 选项\
  \ `A`、`B` 和 `D` 是错误的。这些都是良好的安全措施，应该被实施。但是，其中哪一个都不如关闭不需要的服务那样基础，因此不应该是首要任务。\n\n###\
  \ 8. C. 行政控制是旨在缓解某些威胁的策略和流程。使用管理电子邮件附件打开和文件下载的策略是针对恶意软件的行政控制。\n\n- 选项 `A`、`B` 和\
  \ `D` 是错误的。这些都是可以采取的良好步骤，但它们都属于技术控制，而不是行政控制。\n\n### 9. A. 访客网络与你的生产网络是分离的；因此，即使该网络发生某种泄露，也不会影响你的生产网络。建立访客网络是一种常见的安全做法，可以让访客访问互联网，而无需为其提供访问公司网络资源的权限。\n\
  \n- 选项 `B` 是错误的。`DMZ` 用于放置 Web 服务器等面向公众的服务器。\n- 选项 `C` 是错误的。`intranet`（内网）由员工使用的内部\
  \ Web 资源组成。\n- 选项 `D` 是错误的。这将为非员工提供公司网络的权限。\n\n### 10. A. 全盘加密对计算机的硬盘进行完全加密。这是确保计算机数据安全的有效方法。\n\
  \n- 选项 `B` 是错误的。`Trusted platform modules`（信任平台模块）是加密处理器，不会影响此问题。\n- 选项 `C` 是错误的。`Software-defined\
  \ networking`（软件定义网络）是虚拟化网络，不会影响此问题。\n- 选项 `D` 是错误的。`Demilitarized zones`（隔离区）用于分割网络，不会影响此问题。\n\
  \n### 11. A. VPN 集中器是用于创建远程访问 VPN 的硬件设备。集中器在主机之间创建加密隧道会话，许多集中器还使用双因素认证来增加安全性。\n\n\
  - 选项 `B` 是错误的。`SSL 加速器` 是一种方法，将 `Transport Layer Security (TLS)` 和 `Secure Sockets\
  \ Layer (SSL)` 的计算密集型公钥加密工作卸载到硬件加速器。\n- 选项 `C` 是错误的。`demilitarized zone`（隔离区）是放置面向公众服务器的地方。\n\
  - 选项 `D` 是错误的。`Guest networks`（访客网络）为非员工提供互联网访问。\n\n### 12. B. 如果系统被恶意软件感染，恶意软件将以当前用户的权限运行。如果你使用具有最小权限的非管理员账户，那么恶意软件将无法访问管理功能。\n\
  \n- 选项 `A`、`C` 和 `D` 都是错误的。这些都是良好的安全措施，但它们无法解决恶意软件访问管理功能的问题。\n\n### 13. B. 网络操作系统取决于运行在域控制器上的操作系统。一个网络可能大部分是\
  \ `Windows`，但只要域控制器是 `Unix`，那么网络操作系统就是 `Unix`。\n\n- 选项 `A`、`C` 和 `D` 都是正确的。这些项目并不决定网络操作系统。\n\
  \n### 14. A. I 型虚拟机也被称为裸机虚拟机。它直接安装在硬件上，不需要预先安装操作系统。\n\n- 选项 `B`、`C` 和 `D` 都是错误的。`Type\
  \ I hypervisors`（I 型虚拟机）不需要预装的操作系统。\n\n### 15. D. ISO 27017 是云安全的国际标准。\n\n- 选项 `A`\
  \ 是错误的。`NIST 800-14` 描述了安全策略中应该涵盖的常见安全原则。\n- 选项 `B` 是错误的。`NIST 800-53` 将安全措施组织成控制族，例如风险评估、访问控制、事件响应等。\n\
  - 选项 `D` 是错误的。`ISO 27002` 建议了启动、实施和维护信息安全管理系统 (`ISMSs`）的最佳实践。\n\n### 16. B. 终端机必须限制在仅所需的功能。移除或禁用任何不必要的功能，并使用终端功能所需的最小权限登录系统是非常重要的。\n\
  \n- 选项 `A` 是错误的。虽然这总是个好主意，但并不是终端机最重要的问题。\n- 选项 `C` 是错误的。是的，防病毒软件很重要。但如果这台机器被锁定为只执行特定功能，它就是安全的。\n\
  - 选项 `D` 是错误的。`host-based firewall`（基于主机的防火墙）并非绝对。\n\n### 17. A. 正确答案是在不需要时禁用 `WiFi`。许多外围设备都启用了\
  \ `WiFi`。\n\n- 选项 `B` 是错误的。许多外围设备没有 `BIOS`。\n- 选项 `C` 是错误的。这不是人们所采取的第一步。\n- 选项 `D`\
  \ 是错误的。没有硬盘可以安装防病毒软件。\n\n### 18. A. `DMZ` 为面向公众的服务器提供有限的访问，但阻止外部用户访问内部系统。将 Web 服务器放置在\
  \ `DMZ` 中是一种常见的做法。\n\n- 选项 `B` 是错误的。`VLAN` 通常用于分割网络。\n- 选项 `C` 是错误的。`Routers`（路由器）根据\
  \ `IP address` 引导流量。\n- 选项 `D` 是错误的。`guest network`（访客网络）允许内部用户访问互联网。\n\n### 19.\
  \ B. 物理分割网络是 `VLAN` 的物理等效方法。`VLAN` 设计用于模拟物理分割。\n\n- 选项 `A` 是错误的。`Perimeter security`（边界安全）并不分割网络。\n\
  - 选项 `C` 是错误的。`Security zones`（安全区域）有用，但它们本身并不分割网络。通常使用物理分区或 `VLAN`分割网络来创建安全区域。\n\
  - 选项 `D` 是错误的。`firewall`（防火墙）旨在拦截某些流量，而不是分割网络。\n\n### 20. D. `Honeypots`（蜜罐）通过伪装成待利用的安全漏洞来吸引黑客。`honeynet`（蜜罐网）是一个网络蜜罐。这种安全技术用于在不暴露关键网络资源的情况下观察黑客的行为。\n\
  \n- 选项 `A` 是错误的。`Active detection`（主动检测）不是行业术语。\n- 选项 `B` 是错误的。`False subnet`（假子网）不是行业术语。\n\
  - 选项 `C` 是错误的。`intrusion detection system`（入侵检测系统）用于检测可能指示入侵或攻击的活动。\n\n### 21. A.\
  \ 非协议提供了额外的攻击面。所有协议都有漏洞这一事实足以消除非协议。这些非协议的端口提供了可能的攻击途径。你应该始终遵循最小权限原则。\n\n- 选项 `B`\
  \ 是错误的。任何端口都可以被安全。这是一个安全控制的示例。\n- 选项 `C` 是错误的。并不是特定的端口不安全。但每个开放的端口都提供了进入系统的模式。\n\
  - 选项 `D` 是错误的。对于非必要的端口不需要额外的安全工作。\n\n\n\n\n\n## 22. B. 状态检测防火墙（SPI）检查其遇到的每一个数据数据包的内容和上下文。这意味着\
  \ SPI 防火墙理解来自相同 IP 地址的前序数据包。这使得某些攻击（如 SYN 洪水攻击）几乎不可能发生。\n\n- 选项 A 错误。数据包过滤防火墙检查每个数据包，但不检查上下文。\n\
  - 选项 C 错误。应用层防火墙可以使用 SPI 或简单的数据包过滤，但它们的主要作用是检查特定于应用程序的问题。一个经典的例子是 Web 应用防火墙。\n-\
  \ 选项 D 错误。网关防火墙只是位于网络网关的防火墙。这并不能告诉我们它是数据包过滤还是 SPI。\n\n## 23. A. 白名单（Whitelists）是已批准软件列表。只有当软件出现在白名单时，才能进行安装。\n\
  \n- 选项 B 错误。黑名单（Blacklisting）阻止特定的应用程序，但无法考虑到所有可能的恶意程序。\n- 选项 C 错误。访问控制列表（ACL）决定谁可以访问资源。\n\
  - 选项 D 错误。主机入侵检测系统（HIDS）不能阻止软件的安装。\n\n## 24. B. 去军事化区（DMZ）是来自独立路由器接口的独立子网。可能允许公共流量从外部公共接口通过\
  \ DMZ，但将允许其通过连接到内部私有网络的接口。\n\n- 选项 A 错误。访客网络为访问者提供互联网访问。\n- 选项 C 错误。内网由内部 Web 资源组成。公司经常发布只有能从网络内部访问的网页，用于人力资源通知、申请休假等项目。\n\
  - 选项 D 错误。VLAN 用于分段你的内部网络。\n\n## 25. A. 过滤器（Filters）防止未经授权的数据包进入或离开网络。数据包过滤器是防火墙的一种，用于阻止指定端口的流量。\n\
  \n- 选项 B 和 C 错误。数据包过滤器允许某些数据包进入并阻止另一些。对于导出的数据包也是如此：根据防火墙中实施的规则，某些将被允许，而另一些将被阻止。\n\
  - 选项 D 错误。数据包过滤对消除网络中的冲突无效。\n\n## 26. C. WiFi 保护访问 2（WPA2）旨在提供与有线网络同等的安全性，并实施了 802.11i\
  \ 标准元素。\n\n- 选项 A 错误。WAP 是无线接入点。\n- 选项 B 错误。WPA 的安全性没有 WPA2 高。\n- 选项 D 错误。WEP 是最旧且安全性最低的无线安全协议。\n\
  \n## 27. A. IV 攻击通常与 WEP 无线协议有关。这是因为 WEP 使用了带有初始化向量（IV）的 RC4 流加密。然而，WEP 不恰当地实现了\
  \ RC4 并重复使用了它的 IV（IV 应该使用一次，然后丢弃），使其容易受到 IV 攻击。\n\n- 选项 B 错误。WAP 是无线接入点，不是协议。\n\
  - 选项 C 错误。WPA 不使用 IV；它使用 TKIP。\n- 选项 D 错误。WPA2 不使用 IV；它使用带 CBC 和 MAC 的 AES。\n\n\
  ## 28. C. 测试服务器应该与生产服务器完全相同。在部署应用程序之前，它可以用于功能测试也可以用于安全测试。\n\n- 选项 A 错误。生产服务器是运行服务器。\n\
  - 选项 B 错误。开发服务器是程序员在开发 Web 应用程序期间使用的。\n- 选项 D 错误。部署前服务器（Predeployment server）不是行业使用的术语。\n\
  \n## 29. B. 内核完整性子系统是完整性测量的一种形式，用于检测文件是否在远程或本地被意外或恶意地更改；通过与存储为扩展属性的“良好”值对比文件的测量值进行评估；并强制本地文件完整性。这些目标与\
  \ Linux 安全模块（LSM）提供的强制访问控制（MAC）保护相互补。\n\n- 选项 A 错误。杀病毒软件用于检测恶意软件。\n- 选项 C 错误。内核完整性子系统无法检测安装了哪些程序。\n\
  - 选项 D 错误。内核完整性系统不检测用户账户的变化。\n\n## 30. C. BIOS 密码管理是 BIOS 最基本的安全措施。没有这个基础步骤，任何其他步骤的效果都会大打折扣。\n\
  \n- 选项 A 和 B 错误。NIST 800-155 虽然列出了这两项作为 BIOS 完整性措施，但它们不是最基础的——密码才是。\n- 选项 D 错误。备份\
  \ BIOS 不是常见的安全措施，它绝不可能是最基础的步骤。\n\n## 31. A. 正确答案是 NIST 800-82。特别出版物 800-82 第 2 版《工业控制系统\
  \ (ICS) 安全指南》专门针对工业控制系统。工业系统包括 SCADA（数据采集与监控系统）和 PLC（可编程逻辑控制器）。\n\n- 选项 B 错误。PCI-DSS\
  \ 是信用卡安全标准。\n- 选项 C 错误。NIST 800-30 是关于风险评估的标准。\n- 选项 D 错误。该标准建议实施和维护信息安全管理系统（ISMS）的最佳实践。\n\
  \n## 32. B. 可穿戴设备具有存储功能，因此可用于引入网络或从网络泄露数据。\n\n- 选项 A 错误。分心不是安全问题，但可能是管理问题。\n- 选项\
  \ C 和 D 错误。虽然这两项可能是合理的安全关注点，但它们不是最重要的。\n\n## 33. B. 空调系统（HVAC）会影响可用性。通过维持温度和湿度，数据中心的服务器不太可能崩溃，从而提高了可用性。\n\
  \n- 选项 A 错误。HVAC 对机密性没有影响。\n- 选项 C 错误。HVAC 不是灭火系统。\n- 选项 D 错误。HVAC 不是监控系统。\n\n##\
  \ 34. B. Maria 应该对 SCADA 上的账户使用进行持续审计。这将在有人在使用其未实际使用的账户时提供警告。\n\n- 选项 A 错误。主机杀病毒软件几乎不是坏主意。但此场景并未指示入侵是由于恶意软件，因此反恶意软件可能无法解决威胁。\n\
  - 选项 C 错误。由于工程师有权访问 SCADA 系统，NIPS 不可能阻止他访问系统。\n- 选项 D 错误。全盘加密无法缓解这一威胁。\n\n## 35.\
  \ B. 正确答案是虚拟化。通过服务器虚拟化，Lucy 可以在一个位置管理所有服务器，而且如果需要，设置新的虚拟服务器也非常容易。\n\n- 选项 A 错误。集群不会让安装新服务器变得更加高效。\n\
  - 选项 C 和 D 错误。划分服务器（例如通过 VLAN 或子网）无法解决问题中提出的问题。\n\n## 36. A. 硬件安全模块（HSM）是存储电子商务服务器私钥最安全的方式。HSM\
  \ 是一个保护和管理数字密钥的物理设备。\n\n- 选项 B 错误。全盘加密可以保护电子商务服务器上的数据，但它对存储密钥没有帮助。完全加密电子商务服务器硬盘也很困难，因为电子商务的运行需要硬盘处于使用状态。\n\
  \n\n\n\n\n* 选项 C 错误。自加密驱动器 (`SED`) 只是自动的全盘加密。\n* 选项 D 错误。软件定义网络无法解决此类场景中的问题。\n\n\
  ### 37. B. 正确答案是使用沙箱环境来测试恶意软件并确定其完整功能。沙箱系统可以是一个隔离的虚拟机，也可以是完全与网络隔离的物理机。\n* 选项 A 错误。将恶意软件留在生产系统中永远不是正确的方法。\n\
  * 选项 C 错误。你应该测试恶意软件以确定它到底造成什么损害。\n* 选项 D 错误。蜜罐（Honeypot）用于诱捕攻击者，而不是用于测试恶意软件。\n\n\
  ### 38. C. 你应该实施一个阶段服务器，以便将代码部署到中间阶段环境。这将允许对安全功能进行测试，并检查代码与整个系统的集成情况。使用第三方库和 `SDKs`\
  \ 可以减少代码中的错误和漏洞。\n* 选项 A 错误。沙箱用于隔离特定的环境。\n* 选项 B 错误。虚拟化无法降低这种风险。即使生产服务器是虚拟化的，风险也是相同的。\n\
  * 选项 D 错误。部署策略是一个好主意，但它们不是减轻这种特定风险的最有效方法。\n\n### 39. A. 实时操作系统用于嵌入式设备的安全系统。RTOS\
  \ 最初为军事应用开发，但当时不对公众开放。\n* 选项 B 错误。虽然 `SCADA` 系统有时可以是嵌入式系统，但这无法解决安全疑虑。\n* 选项 C 错误。全盘加密无法解决操作系统本身的安全问题。\n\
  * 选项 D 错误。信任平台模块（TPM）对于加密应用非常有用，但它无法解决操作系统的安全问题。\n\n### 40. C. `WPA2` 标准完全实现了 `802.11i`\
  \ 安全标准。\n* 选项 A、B 和 D 错误。这些标准涉及带宽和频率，而不是安全。\n\n### 41. A. 与 `WPA` 相关的加密技术是 `TKIP`。\n\
  * 选项 B 错误。`CCMP` 是 `WPA2` 使用的技术。它将密码块链连接模式下的 `AES` 与消息认证码相结合。\n* 选项 C 错误。`WEP` 使用\
  \ `RC4`。\n* 选项 D 错误。`WPA2` 使用 `CCMP`。\n\n### 42. C. 禁用 `SSID` 广播会使其不出现在可用网络列表中，但仍然可能连接到它并使用该无线网络。\n\
  * 选项 A、B 和 D 均错误。这些对禁用 `SSID` 广播后发生的情况描述都不准确。\n\n### 43. B. 在平台即服务 (`PaaS`) 模型中，消费者可以访问基础设施以创建应用并托管它们。\n\
  * 选项 A 错误。软件即服务（SaaS）仅提供特定的应用程序。\n* 选项 C 错误。基础设施即服务（IaaS）提供整个网络基础设施。\n* 选项 D 错误。云即服务提供对云存储的访问。\n\
  \n### 44. A. 在软件即服务 (`SaaS`) 模型中，消费者能够通过互联网使用由云供应商提供的应用程序。`SaaS` 是一种订阅服务，按订阅方式许可软件。\n\
  * 答案 B 错误。平台即服务提供操作系统。\n* 选项 C 错误。基础设施即服务提供整个网络基础设施。\n* 选项 D 错误。云即服务提供对云存储的访问。\n\
  \n### 45. B. 弹性是云计算的一个特性，涉及根据需要动态地配置（或释放）资源。\n* 选项 A 错误。多租户是指托管多个不同虚拟化环境的能力。\n*\
  \ 选项 C 错误。配置管理数据库用于存储配置信息。\n* 选项 D 错误。沙箱指的是隔离环境的能力。\n\n### 46. A. I 型虚拟机程序实现被称为“裸机”。\n\
  * 选项 B 错误。II 型虚拟机必须安装在底层的操作系统上。\n* 选项 C 和 D 错误。这些不是有效的虚拟机类型。\n\n### 47. C. 快照是虚拟机在某一时间点的映像。定期对虚拟系统拍摄快照是标准做法，这样你可以将系统恢复到上一个良好状态。\n\
  * 选项 A 错误。沙箱是隔离系统的过程。\n* 选项 B 错误。虚拟机程序是虚拟环境与硬件交互的机制。\n* 选项 D 错误。弹性是系统扩展的能力。\n\n\
  ### 48. D. `RAID` 5 级是带有分布式校验的磁盘条带化。它可以承受任何单个磁盘的丢失。\n* 选项 A 错误。`RAID` 0 是磁盘条带化；它不提供任何容错能力。\n\
  * 选项 B 错误。`RAID` 1 是镜像。它确实防止单个磁盘丢失，但不是通过分布式校验。\n* 选项 C 错误。`RAID` 3 是带有专用校验的磁盘条带化。这意味着有一个包含所有校验位位的专用驱动器。\n\
  \n### 49. D. 法拉第笼以著名物理学家迈克尔·法拉第命名，通过在区域或设备周围放置金属网格来阻挡电磁信号。\n* 选项 A 错误。`VLAN` 可以划分网络，但无法阻止\
  \ `EMI`。\n* 选项 B 错误。软件定义网络使网络虚拟化，但防止 `EMI`。\n* 选项 C 错误。信任平台模块用于加密应用。\n\n### 50.\
  \ B. 正确答案是护柱（bollards）。这些是大型物体，通常由混凝土或类似材料制成，专门用于防止车辆通过。\n* 选项 A 错误。大多数门都可以被车辆撞破。\n\
  * 选项 C 错误。安保人员是个好主意，但他无法阻止车辆撞击建筑。\n* 选项 D 错误。监控摄像头将提供已发生犯罪的证据，但无法阻止犯罪。\n\n### 51.\
