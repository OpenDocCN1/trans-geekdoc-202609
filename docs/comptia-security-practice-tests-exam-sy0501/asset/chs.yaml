  \ 等自动化工具来发现已知漏洞。\n\n- 选项 B 错误。渗透测试（Penetration tests）试图实际利用漏洞并进入系统。\n- 选项 C 错误。安全审计通常关注检查策略、事件报告和其他文档。\n\
