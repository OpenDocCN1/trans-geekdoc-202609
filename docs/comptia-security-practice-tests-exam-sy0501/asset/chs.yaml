  - 选项 B 错误。通用总线（`USB`）是一种允许附加设备连接计算机的接口。\n- 选项 C 错误。硬件安全模块（`HSM`）是一种用于身份验证、加密和解密数字密钥的物理设备。\n\
  \n## 37. C. 黑盒测试是在未知网络布局的情况下对网络进行测试的过程。\n\n- 选项 A 错误。白盒测试是在完全了解网络布局的情况下对网络进行测试的过程。\n\
  - 选项 B 错误。红盒不是指代渗透测试的术语。\n- 选项 D 错误。灰盒测试是在部分了解网络布局的情况下对网络进行测试的过程。\n\n## 38. B. 尾随（Tailgating），通常称为搭乘，是一种物理安全违规行为，未经授权的人跟随授权人员（员工）进入安全区域。\n\
  \n- 选项 A 错误。窥视（Shoulder surfing）通过从人的肩膀观察获取信息。可以获得的信息是个人身份号码、用户名、密码和其他机密信息。\n- 选项\
  \ C 错误。钓鱼（Vishing）是一种社交工程攻击，试图欺骗人们通过电话或 IP 电话（`VoIP`）通话披露安全信息。\n- 选项 D 错误。翻找垃圾（Dumpster\
  \ diving）是通过搜索垃圾寻找敏感信息，这些信息可用于对公司网络进行攻击。\n\n\n\n\n\n### 39. A. 默认拒绝位于列表底部。如果流量通过了\
