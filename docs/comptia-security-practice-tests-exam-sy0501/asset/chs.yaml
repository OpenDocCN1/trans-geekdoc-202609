  \ Acme 公司的事件响应。你的工作之一是尝试对特定类型的攻击者进行归因分析。在归因攻击时，以下哪项**不是你考虑的属性之一？\n1. 复杂程度\n2. 资源/资金\n\
  3. 意图/动机\n4. 被盗取的数据量\n\n## 60\nJohn 在他的网络上运行 IDS（入侵检测系统）。用户有时报告 IDS 将合法流量标记为攻击。这描述的是什么？\n\
  1. 误报 (False positive)\n2. 漏报 (False negative)\n3. 误触发 (False trigger)\n4. 假旗 (False\
  \ flag)\n\n## 61\n你正在对公司网络进行渗透测试。作为测试的一部分，你将获得一个最小权限的登录权限，并尝试使用该账户获取管理员权限。这被称为什么？\n\
  1. 权限提升 (Privilege escalation)\n2. 会话劫持\n3. Root 夺 (Root grabbing)\n4. 爬升 (Climbing)\n\
  \n## 62\nMary 发现公司使用的 Web 应用程序并不总是正确处理多线程，特别是当多个线程访问同一个变量时。这允许发现此漏洞的攻击者利用它并导致服务器崩溃。Mary\
  \ 发现了哪种错误？\n1. 缓冲区溢出 (Buffer overflow)\n2. 逻辑炸弹 (Logic bomb)\n3. 竞态条件 (Race conditions)\n\
  4. 不当错误处理\n\n## 63\n攻击者正试图访问你的网络。他向网络上的用户发送一个免费股票监控程序的链接。然而，该股票监控程序附带了软件，允许攻击者访问任何安装了它的机器。这是哪种攻击？\n\
