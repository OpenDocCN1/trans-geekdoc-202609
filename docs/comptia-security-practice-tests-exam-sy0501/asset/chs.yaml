  A. 瀑布方法的步骤包括需求收集、设计、实现（也称为编码）、测试（也称为验证）、部署和维护。\n- 选项 B、C 和 D 均错误。这些不是瀑布方法的正确步骤。\n\
  \n### 80\nD. 客户端验证和服务器端验证都很重要，因此完整的验证方案应该同时使用这两者。\n- 选项 A 和 B 均错误，因为它们都是不完整的。\n\
  - 选项 C 错误。这不是一种验证方法。\n\n### 81\nA. 正确答案是向授权用户分配数字证书，并在他们登录时使用这些证书对其进行身份验证。这是确保只有授权用户才能访问应用程序的有效方法。\n\
  - 选项 B、C 和 D 均错误。这些都是良好的安全措施，但不是验证客户端和防止未经访问应用程序的最佳方法。\n\n### 82\nD. 正确答案是首先测试补丁。补丁可能会对一个或多个当前应用程序产生问题。对于与宿主机操作系统有大量交互的应用程序，这一点尤其令人担心。操作系统补丁可能会防止应用程序正常运行。但一旦通过测试，就应该开始在公司范围内分阶段实施。\n\
  - 选项 A 错误。企业环境中不建议自动补丁，因为补丁可能会干扰一个或多个应用程序。\n- 选项 B 错误。这是一个非常糟糕的主意，会导致补丁不一致以及应用未经测试的补丁。\n\
  - 选项 C 错误。这只比让最终用户处理自己的补丁稍微一点。\n\n### 83\nB. 在代码重用攻击中，攻击者执行用于其他目的的代码。在许多情况下，这些可能是不再使用的旧代码（死代码），即使这些代码位于第三方库中。\n\
  - 选项 A 错误。缓冲区溢出发生在向缓冲区发送了过多数据时。例如，假设一个缓冲区设计为保存 10 字节，但发送了 100 字节。\n- 选项 C 错误。拒绝服务攻击旨在让合法用户无法使用服务。\n\
  - 选项 D 错误。会话劫持涉及接管已验证的会话。\n\n### 84\nB. 正确答案是关闭绝对需要的此类设备远程访问。许多外设设备带有 `SSH`、`telnet`\
  \ 或类似的服务。如果不使用它们，请将其关闭。\n- 选项 A 错误。全盘加密会提高外设安全性，但许多外设设备没有磁盘可以加密。\n- 选项 C 错误。模糊测试是针对应用程序的。\n\
  - 选项 D 错误。并非所有设备都能够分配数字证书。\n\n### 85\nC. 正确答案是使用静态代码分析。内存泄漏通常由于未释放已分配的内存引起。静态代码分析器可以检查所有的内存分配命令（`malloc`、`alloc`\
  \ 等）是否有对应的内存释放命令。\n- 选项 A 错误。模糊测试涉及输入预期之外的数据以查看应用程序如何处理。\n- 选项 B 错误。压力测试涉及测试系统如何处理极端负载。\n\
  - 选项 D 错误。规范化是一种用于数据库去重的技术。\n\n### 86\nA. 正确答案是使用安全 Shell (SSH)。该协议是加密的。`SSH` 还使用公钥密码学对用户进行身份验证。\n\
  - 选项 B 错误。`Telnet` 不安全。它不加密数据。\n- 选项 C 错误。远程 Shell 至少发送一些未加密的数据，因此是不安全的。\n\n\n\n\
  \n\n`Option D` 是错误的。简单网络管理协议（Simple Network Management Protocol）用于管理网络，而不用于远程通信。\n\
  \n### 87. B. 软件认证通常通过数字证书和数字签名完成。软件在被允许执行之前会证明自己是合法的程序。\n\n- Option A 是错误的。安全启动（Secure\
  \ boot）涉及系统启动到受信任的配置。\n- Option C 是错误的。沙箱（Sandboxing）用于隔离应用程序。\n- Option D 是错误的。信任平台模块（Trusted\
  \ platform module）是一个密码处理器，通常用于密钥管理。\n\n### 88. D. 当两个或多个组件被一起测试时，这被称为集成测试。\n\n\
  - Option A 是错误的。单元测试是对单个代码单元进行测试。\n- Option B 是错误的。回归测试是在更改后对系统进行测试，以确保该更改没有引起任何其他问题。\n\
  - Option C 是错误的。压力测试涉及让系统承受大量的负载，以确定其是否能够处理这些负荷。\n\n### 89. B. 入侵防御系统对于需要高可用性的系统至关重要。根据系统的性质，它可能需要\
  \ `HIPS`、`NIPS` 或两者都有。\n\n- Option A 是错误的。安全信息和事件管理（SIEM）整合了日志。虽然这是一项有价值的安全功能，但在这种情况下它不是最重要的。\n\
  - Option C 是错误的。自动补丁控制通常是一个好主意；但在这种情况下它不是最重要的。\n- Option D 是错误的。蜜罐（Honeypots）可以是一种有价值的安全控制措施，但它们的重要性远不如\
  \ `IPS` 或补丁控制。\n\n### 90. B. 片上系统（System on a Chip）设备是单个芯片上的完整自包含系统。因此，拥有自己独特的加密密钥是实现认证和安全的最佳方式。\n\
  \n- Option A 是错误的。片上系统是自包含的，因此 `TPM` 不是一个合适的解决方案。\n- Option C 是错误的。自加密驱动器（self-encrypting\
  \ drive）与片上系统无关，因为该系统没有“驱动器”。\n- Option D 是错误的。许多 `SoC` 技术不使用 `BIOS`。\n\n### 91.\
  \ A. 此类系统需要对所有通信进行加密。截至目前，便携网络设备的泄露都涉及未加密的通信。\n\n- Option B 是错误的。全盘加密对于此类设备可能适用也可能不适用。许多设备没有可加密的磁盘。\n\
  - Option C 是错误的。在许多此类设备上可能无法安装防恶意软件。\n- Option D 是错误的。模糊测试（Fuzz testing）用于应用程序。\n\
  \n### 92. D. 越有车辆利用计算机并具备网络通信能力，它们越容易受到网络攻击的影响。\n\n- Options A, B, 和 C 都是错误的。这些描述是不完整的。\n\
  \n### 93. B. DevOps 是一个复合术：软件 `DEVelopment`（开发）和信息技术 `OPerationS`（运营）。该术指的是软件开发人员与\
  \ IT 专业人员之间的协作，使软件开发与基础设施问题保持一致。\n\n- Option A 是错误的。集成测试指的是测试两个或多个组件。\n- Options\
  \ C 和 D 都是错误的。虽然明确政策和员工培训通常是好主意，但它们不是解决 Ariel 疑虑的最佳方式。\n\n### 94. A. 所有的软件更改必须经过适当的变更管理。这包括将被评估的变更请求\
  \ (`RFC`）。\n\n- Option B 是错误的。Greg 无法知道该更改对系统的其他方面可能产生什么。此修复可能会导致额外问题。\n- Option\
  \ C 是错误的。这是一个比 B 更好的答案，但仍然没有遵循变更控制程序。\n- Option D 是错误的。仅仅记录问题对纠正问题起不起作用。\n\n###\
  \ 95. C. 在依赖所使用的模型之前，必须完成模型验证。验证仿真模型的所有方面都是准确的是非常重要的。如果模型有任何不准确的数据或设置，那么结果将是不准确的。\n\
  \n- Option A 是错误的。变更批准委员会 (`CABs`) 是变更控制过程的一部分。\n- Option B 是错误的。虽然彻底阅读文档始终是一个好主意，但在这种场景下这不是最关键的问题。\n\
  - Option D 是错误的。集成测试涉及测试两个或多个组件以确保它们能够协同工作。\n\n### 96. D. 系统的任何更改都需要回归测试。回归测试确保所做的更改没有引起任何新问题。\n\
  \n- Option A 是错误的。全盘加密对于此类设备可能适用也可能不适用。许多设备没有可加密的磁盘。\n- Option B 是错误的。在进行更改之前，您应该获得变更批准委员会的批准。\n\
  - Option C 是错误的。压力测试旨在查看系统可以承受多大的负载。\n\n### 97. A. 编译后的代码运行更快。这是因为运行时代码（如 `Java`）是在运行时被编译的（因此有此名字），因此性能较慢。\n\
  \n- Option B 是错误的。事实上，情况恰恰相反。运行时代码可以是平台无关的，如 `Java`。编译代码是针对特定操作系统编译的。\n- Option\
  \ C 是错误的。安全性与代码是编译的还是运行时的没有直接关系。这个问题对安全性的影响微乎其微。\n- Option D 是错误的。开发时间不受代码是编译代码还是运行时代码的影响。\n\
  \n### 98. C. 社区云提供了一个折中解决方案。社区云是半私有的。它们不对普通公众开放，只对特定实体的社区开放。\n\n- Option A 是错误的。事实并非如此。\n\
  - Option B 是错误的。私有云的成本超出了许多公司的承受。\n- Option D 是错误的。这不是一个好的答案。它忽略了公司寻找云解决方案的意愿。\n\
  \n### 99. B. 平台服务 (`PaaS`) 是解决此问题的良好方案。程序员可以通过 `PaaS` 访问虚拟化的 Linux 机器。\n\n- Options\
  \ A 和 C 都是错误的。虽然这些可行，但它们的效率低于使用 `PaaS`。\n- Option D 是错误的。基础设施即服务（Infrastructure\
  \ as a Service）用于通过虚拟化提供网络基础设施。在这种情况下，你只需要一个操作系统。\n\n### 100. A. 云访问安全网关 (`CASB`)\
  \ 是一种位于组织本地网络与云提供商基础设施之间的软件工具或服务。`CASB` 充当门卫，允许组织将其安全策略范围扩展到云端。\n\n- Option B 是错误的。集成测试用于测试两个或多个组件以确保它们集成。\n\
  - Option C 是错误的。虽然安全策略是好主意，但仅仅在公司内部拥有策略不会影响云解决方案。\n- Option D 是错误的。安全即服务（Security\
  \ as a Service）是外包某些安全功能的过程。\n\n### 101. B. 压力测试旨在设计在大于正常的负载下测试应用程序。虽然这可能不足以测试对拒绝服务的响应，但它是最相关的软件测试。\n\
  \n- Option A 是错误的。回归测试是在更改后进行的测试，以确保该更改没有引起任何其他问题。\n- Option C 是错误的。集成测试是为了查看两个或多个组件是否能够协同工作。\n\
  - Option D 是错误的。模糊测试通过输入非标准/意外值来测试应用程序。\n\n\n\n\n\n# 102. C. 正确答案是公有云。公有云通常成本较低。云提供商有很多客户，成本得到了分散。即使是个人也负担得起\
  \ `iCloud` 和 `Amazon Cloud` 等服务的云存储。\n\n- 选项 A 错误。社区云通常是小组成伙伴的私有云。每个伙伴必须分比公有云更多的费用，但他们对云的控制权比公有云更多。\n\
  - 选项 B 错误。私有云是最贵的。公司必须完全开发和维护云资源。\n- 选项 D 错误。混合部署模型是许多情况下的良好折中方案，但它会比公有云贵。\n\n#\
  \ 103. D. 正确答案是持续监控。某些技术可以对网络进行持续监控。这些系统可以在问题发生时或在发生后不久识别出任何问题。\n\n- 选项 A 错误。每月审计在执行之前无法发现问题，而审计可能在问题发生整一个月后才进行。\n\
  - 选项 B 和 C 错误。网络入侵检测系统或网络入侵预防系统无疑可以是解决方案的一部分。但此类系统只能检测侵入行为，而不能检测策略违规、登录问题等。\n\n\
  # 104. B. 正确答案是使用 SSL 加速器。SSL 加速器是一种将传输层安全 (`TLS`) 和安全套字层 (`SSL`) 的密集型公钥加密卸载到硬件加速器的方法。\n\
  \n- 选项 A 错误。VPN 集中器是用于创建远程访问 `VPN` 的硬件设备。集中器在主机之间创建加密隧道会话，许多集中器使用双因子身份验证来增加安全性。\n\
  - 选项 C 错误。返回使用较小的加密密钥会对安全性产生不利影响。\n- 选项 D 错误。这可能解决也可能无法解决问题，但其成本和难度将远高于实施 SSL 加速器。\n\
  \n# 105. C. 只有使用数字签名的代码才能验证软件的创建者。例如，如果打印机/MFD 驱动程序经过了数字签名，这将让你相信它确实来自声称的供应商打印机驱动程序，而不是伪装成打印机驱动程序的恶意软件。\n\
  \n- 选项 A 错误。签名软件让你有很大的信心认为它不是恶意软件，但并没有提供保证。例如，臭名昭著的 Flame 病毒是用被破解的微软数字证书签名的。\n-\
  \ 选项 B 错误。软件的数字签名对补丁管理没有影响。\n- 选项 D 错误。数字签名软件的执行速度不会比未签名软件快或慢。\n\n# 106. B. VM sprawl（虚拟机扩散）是指网络中的虚拟机数量超过了\
  \ IT 人员有效管理的能力。\n\n- 选项 A、C 和 D 错误。这些描述与 VM sprawl 术语无关。\n\n# 107. C. 存储过程通常用于许多数据库管理系统，以包含\
  \ `SQL` 语句。数据库管理员或由 `DBA` 指定的人创建该业务所需的各种 `SQL` 语句，然后程序员就可以简单地调用这些存储过程。\n\n- 选项 A\
  \ 错误。存储过程与动态链接库无关。\n- 选项 B 错误。这个描述很接近但不准确，因为存储过程可以被服务器上的其他存储过程调用。\n- 选项 D 错误。存储过程与中间件无关。\n\
  \n# 108. D. 护路柱（Bollards）是通常由混凝土等坚固材料制成的大型屏障。它们在防止车辆驶入建筑方面有效。\n\n- 选项 A、B 和 C 错误。这些描述没有说明护路柱的作用。\n\
  \n# 109. A. 电磁干扰可能会对电路造成损坏，包括 `RAM` 或 `CPU` 芯片。至少，它可以擦除内存和驱动器中的数据。\n\n- 选项 A、B 和\
  \ C 错误。这些描述没有描述电磁干扰的影响。\n\n# 110. A. 正确答案是 VM 逃逸攻击，VM 逃逸攻击是通过某种方法从 `VM` 移动到虚拟机程序器然后主机的攻击。防止这种情况最有效的方法是完全隔离\
  \ `VM`。\n\n- 选项 B 错误。反病毒总是一个好主意，甚至可以停止某些基于恶意软件的 VM 逃逸攻击。但隔离 `VM` 更有效。\n- 选项 C 错误。全磁盘加密没有影响，因为磁盘在运行期间必须是解密的。\n\
  - 选项 D 错误。信任平台模块（TPM）用于存储加密密钥。\n\n# 111. C. 安全即服务（SaaS）使用外部公司来处理安全任务。某些甚至所有安全任务都可以外包，包括\
  \ `IDS/IPS` 管理、`SIEM` 集成和其他安全控制。\n\n- 选项 A 错误。软件定义网络会使安全管理变得稍微容易，但其本身很难实现。\n- 选项\
  \ B 错误。尽可能地自动许多安全活动将有助于缓解问题，但没有“安全即服务”有效。\n- 选项 D 错误。这意味着故意不实施某些安全控制。\n\n# 112.\
  \ B. 加密哈希值用于文件、网络数据包及各种其他应用程序的完整性检查。存储应用程序的加密哈希值，并将网络上的应用程序与该哈希值进行比较，将确认（或否定）应用程序是否被任何更改。\n\
  \n- 选项 A 和 D 均错误。网络入侵检测或网络入侵预防系统很有用，但它们不能防止应用程序被篡改。\n- 选项 C 错误。沙箱用于隔离应用程序，但它无法检测应用程序是否被篡改过。\n\
  \n# 113. C. 将 SCADA 系统与主网络分离，可以减少 SCADA 系统受到主网络影响的可能性。这包括恶意软件以及人为操作。\n\n- 选项 A 错误。软件定义网络会使隔离\
  \ SCADA 系统变得更容易，但实际上并没有隔离它。\n- 选项 B 错误。补丁管理总是重要的，但在这种情况下无法防止问题的发生。\n- 选项 D 错误。加密数据传输（如\
  \ `TLS`）对这种情况不会产生影响。\n\n# 114. C. 身份验证头（Authentication headers）提供了完整的数据包完整性，对数据包和头部进行身份验证。\n\
  \n- 选项 A 和 B 错误。身份验证头没有提供任何加密。\n- 选项 D 错误。身份验证头验证整个数据包，而不只是头部。\n\n# 115. D. 传输层安全（TLS）提供了加密网络流量的可靠方法。它支持双向认证并被认为是安全的。\n\
  \n- 选项 A 错误。虽然 `SSL` 可以加密网络流量，但 `TLS` 是在 1999 年作为其继任创建的。尽管许多网络管理员仍使用 `SSL` 术语，但在大多数情况下，你现在使用的是\
  \ `TLS`，而不是过时的 `SSL`。\n- 选项 B 和 C 错误。这些是建立 `VPN` 的协议，而不是加密网络流量的协议。\n\n# 116. A.\
  \ 网络分接器（Network taps）类似于电话分线路。它们是将获取网络流量传输到中心位置的完全被动的方法。\n\n\n\n\n\n- 选项 B 是错误的。端口镜像会将所有流量引导到\
  \ NIPS，但它并不是完全被动的。它需要使用交换机上的资源来路由流量副本。错误的交换机配置会导致环路。配置环路检测可以防止环路。\n- 选项 C 是错误的。不清楚这个答案是否真的有效。\n\
  - 选项 D 是错误的。这不是题目要求的。在每个网段上设置 NIPS 还会大幅增加管理工作。\n\n### 117. B. 互联网密钥交换（Internet key\
  \ exchange）用于在隧道的每个端建立安全关联。这些安全关联包含了隧道所需的所有设置（例如：加密算法、哈希值等）。\n\n- 选项 A 和 C 是错误的。`IKE`\
  \ 不直接参与加密或身份验证。\n- 选项 D 是错误的。有人可能会认为通过建立安全关联，`IKE` 正在建立隧道。然而，答案 B 是更准确的答案。\n\n###\
  \ 118. A. DDoS 缓解工具是专门设计用于响应分布式拒绝服务攻击的工具或服务。此类工具既可以抑制攻击流量，临时增加带宽，以防止合法用户受到攻击的负面影响。\n\
  \n- 选项 B 是错误的。无疑，带有状态数据包检测的 Web 应用防火墙会有帮助，但它不是处理这种威胁的最有效手段。\n- 选项 C 是错误的。网络入侵防御系统是一个好主意，可以缓解这种威胁。然而，它不是缓解这种威胁的最有效手段。\n\
  - 选项 D 是错误的。对于来自多个源源的 DDoS 攻击，这可能没有帮助。\n\n### 119. D. 链路聚合交换机允许你将多个链路的带宽合并到一个连接中。这将允许\
  \ Doug 提高到电子商务服务器的带宽。\n\n- 选项 A 是错误的。这会减少对网络其他部分的影响，但无法解决电子商务服务器的带宽需求。\n- 选项 B 和\
  \ C 都是错误的。这两者中的每一个都可能解决问题，但都不具有成本效益。\n\n### 120. C. 关联引擎是用于聚合事件并寻找相关性的软件。在某些情况下，这是通过高级分析算法（包括模糊逻辑）完成的。\n\
  \n- 选项 A 是错误的。网络入侵检测系统会有帮助，但它（本身）并不一定能关联事件。\n- 选项 B 是错误的。安全信息和事件管理（SIEM）无疑会聚合日志信息，但可能不会关联事件。\n\
  - 选项 D 是错误的。聚合交换机仅仅是合并带宽。\n\n### 121. A. NIPS 没有看到该网段上的流量。通过实施端口镜像，可以将该网段的流量复制到安装了\
  \ NIPS 的网段中。\n\n- 选项 B 是错误的。这种方法行得通，但不是最高效的方法。\n- 选项 C 是错误的。此场景中没有任何迹象表明 NIPS 是不够用的。它只是没能看到所有流量。\n\
  - 选项 D 是错误的。这会隔离该网段，但仍然无法让 NIPS 分析来自该网段的流量。\n\n### 122. C. 二层隧道协议（L2TP）是一种支持广泛远程访问方式的\
  \ VPN 技术，包括 `TACACS+`。`L2TP` 还支持包括 `ATM` 和 `X.25` 在内的协议。\n\n- 选项 A 是错误的。点对点隧道协议（PPTP）是一种\
  \ VPN 协议，但不支持 `TACACS+`。\n- 选项 B 是错误的。远程拨号用户认证服务（RADIUS）是一种远程访问协议，而不是 VPN 协议。它是\
  \ `TACACS+` 的早期前身。\n- 选项 D 是错误的。挑战握手认证协议（CHAP）是一种身份验证协议，而不是 VPN 协议。\n\n### 123.\
  \ C. 每当你的业务流程的任何部分被外包时，你都需要确保供应商符合或超过你所有的安全策略和程序。供应链评估安全是一个关键问题。\n\n- 选项 A、B 和 D\
  \ 都是错误的。这些中的每一个都需要解决，但最重要的问题是供应链评估安全。\n\n### 124. B. 红外在晚上仍然可以检测。窃入者很可能在黑暗中进入建筑，因此通过红外进行检测非常重要。\n\
  \n- 选项 A 和 C 都是错误的。如果区域昏暗，无论摄像机如何激活（运动或声音触发），摄像头都无法录下充足的图像。\n- 选项 D 是错误的。如果区域照明良好，高清晰是一个很好的选择。\n\
  \n### 125. D. 法第笼是一种旨在阻挡电磁干扰的金属丝网。\n\n- 选项 A、B 和 C 都是错误的。这些不是法第笼的功能。\n\n### 126.\
  \ B. 智能卡可以用于进入建筑。智能卡还可以存储有关用户的信息，因此系统可以记录谁进入了建筑。\n\n- 选项 A 是错误的。带有签到表的安保人员可以发挥作用，但有很多方法可以破坏签到表，而且安保人员可能会分心或疏于注意。这使得智能卡访问是一个更好的解决方案。\n\
  - 选项 C 是错误的。是的，摄像头会记录谁进入了，但它不会控制访问。非员工可能会进入建筑。\n- 选项 D 是错误的。不受控制/未受监督的签到表是不安全的。\n\
  \n### 127. C. 证书撤销列表（CRL）专门为撤销证书而设计。由于公钥通过证书分发，因此这是取消公钥授权的最有效方法。\n\n- 选项 A 是错误的。仅仅通知用户某个密钥不再有效是无效的。\n\
  - 选项 B 是错误的。删除证书并不总是可能的，而且忽略了存在该证书副本的可能性。\n- 选项 D 是错误的。注册机构（RA）用于创建新证书，而不是撤销它们。\n\
  \n### 128. C. C 类灭火器用于电气火，包括计算机设备火。\n\n- 选项 A 是错误的。A 类灭火器用于纸张和木材火。\n- 选项 B 是错误的。B\
  \ 类灭火器用于燃料火，如汽油。\n- 选项 D 是错误的。D 类灭火器用于化学火。\n\n### 129. C. 在列出的锁中，弹舌锁是最安全的。它的锁舌进入门框内，使其更加安全。\n\
  \n- 选项 A 是错误的。锁使用钥匙还是组合并不会改变其安全性。\n- 选项 B 是错误的。球形锁是一种非常常见且相当不安全的解决方案。\n- 选项 D 是错误的。挂锁可以使用常用的钢液丝钳剪断。\n\
  \n### 130. B. 40% 到 60% 被认为是理想湿度。湿度过会导致腐蚀，湿度过低会导致静电放电。\n\n- 选项 A、C 和 D 都是错误的。这些不是正确的湿度值。\n\
  \n### 131. A. 误接受率（FAR）是系统错误地允许不应允许进入进入率。这显然是一个值得关注的问题。\n\n- 选项 B 是错误的。任何错误都是关注的问题，但误拒绝率（FRR）没有误接受率那么令人麻烦。\n\
  - 选项 C 是错误的。交叉错误率（EER）是指 FAR 和 FRR 相等的点。这实际上表明生物识别系统运行是一的。\n- 选项 D 是错误的。等错误率是交叉错误率的另一个名称。\n\
  \n\n\n\n\n### 132. C.\n`Physical locks` 必须始终故障开启（fail open），这也被称为故障安全（fail safe）。员工的安全必须优先于财产的安全。如果锁没有故障开启，员工可能会被困在建筑内。\n\
  \n* 选项 A、B 和 D 错误。故障锁定（fail secure）是常用术语，但它也意味着故障关闭或故障锁定。这会危及生命。在火灾情况下，电源将会中断，此时门将故障锁定，将人员困在建筑内。\n\
  \n### 133. B.\n受保护布线将保护电缆并防止任何人窃听。这些系统也称为保护分发系统，使用各种保护措施以便在不加密的情况下发送分类信息。\n\n* 选项\
  \ A 错误。`Cat 7` 会提高带宽，而不是安全性。\n* 选项 C 错误。这甚至不是一个实行的解决方案。在所有电缆周围放置 `Faraday cage`\
  \ 将需要对建筑进行大规模的改造。\n* 选项 D 错误。这不是一个可行的方案。场景表明唐纳德（Donald）需要发送机密数据。\n\n### 134. A.\n\
  安全机柜是防篡的，并为你存储任何试图进行物理保护的物品提供了一个良好的地方。\n\n* 选项 B 错误。这将要求你存储用于加密 `thumb drive` 的密钥，从而导致问题持续。\n\
  * 选项 C 错误。实际上，在可移动介质上存储 `BitLocker keys` 是一种良好的做法，只要该介质得到了保护。\n* 选项 D 错误。办公桌抽屉是不安全的，很容易被破入。\n\
  \n### 135. D.\n`RAID 6` 是带有双偶校验的磁盘条带，至少使用四块带有分布式校验位的磁盘。`RAID 6` 可以处理最多两块磁盘故障。\n\n\
  * 选项 A 错误。`RAID 1+0` 是带镜像的磁盘条带。\n* 选项 B 错误。`RAID 3` 是带有专用校验的磁盘条带只能处理一个磁盘故障。\n* 选项\
  \ C 错误。`RAID 5` 是带有分布式校验的磁盘条带只能处理一个磁盘故障。\n\n### 136. D.\n正确答案是使用配置恰当的主镜像，并从该镜像创建所有工作站。这是大型企业配置系统的标准方法。\n\
  \n* 选项 A 错误。许多内容无法通过单个配置文件配置，所以此选项根本不起作用。\n* 选项 B 错误。策略总是好主意，但它不能确保所有系统都经过正确配置。\n\
  * 选项 C 错误。操作系统和应用程序只是配置的一部分。该解决方案无法完全配置工作站。\n\n### 137. B.\n现在 Web 服务器上出现了一个严重的安全问题。首要考虑必须是修复这个问题。恢复到上一个良好状态将立即解决问题；然后迈克（Mike）可以调查并找到原因。\n\
  \n* 选项 A 错误。这太慢了，而且在此期间漏洞将存在于在线网站上。\n* 选项 C 和 D 均错误。这些将是最慢的解决方案，因此会让安全漏洞处于无法接受的时间跨度内。\n\
  \n### 138. D.\n`firewall` 有两种类型的规则。一种类型是允许给定端口上的特定流量。另一种类型的规则是拒绝流量。这里显示的是一条典型的防火墙规则。\n\
  \n* 选项 A、B 和 C 错误。所示规则显然是防火墙规则。\n\n### 139. A.\n`web proxy` 可用于阻止某些网站。网络管理员阻止单个网站或大类网站（如求职网站）是常见做法。\n\
  \n* 选项 B 错误。`Network address translation` 用于将内部计算机的私有 `IP addresses` 转换为公共 `IP addresses`。\n\
  * 选项 C 错误。`firewall` 可以阻止给定端口或使用特定协议的流量，但通常它们无法阻止特定的网站。\n* 选项 D 错误。`Network intrusion\
  \ prevention systems` 识别并阻止攻击。它们无法阻止用户访问特定网站。\n\n### 140. D.\n对集群进行负载均衡处理将防止任何单一服务器过载。如果给定服务器离线，其他服务器可以承担其负载。\n\
  \n* 选项 A 错误。`VPN concentrator` 正如其名，用于启动 `VPNs`。\n* 选项 B 错误。`Aggregate switching`\
  \ 可以为服务器分流更多带宽，但无法缓解过载。\n* 选项 C 错误。`Transport Layer Security (TLS)` 和 `Secure Sockets\
  \ Layer (SSL)`。\n\n### 141. D.\n未能释放你分配的内存会导致内存泄漏。因此，请确保你释放了那些内存。\n\n* 选项 A 和 C\
  \ 错误。这两者都是良好的做法。然而，未能遵循这些做法只会导致内存浪费。\n* 选项 B 错误。虽然防止缓冲区溢出是一个好主意，但这不是内存管理问题。\n\n\
  ### 142. A.\n异地云（Off-premises clouds）总是更便宜，且对现有基础设施的要求较少。对于公共云、私有云或社区云都是如此。\n\n\
  * 选项 B 错误。本地部署（On-premises）总是是最贵的，并且影响巨大。\n* 选项 C 错误。混合解决方案优于本地部署，但不如异地云。\n* 选项\
  \ D 错误。不需要是社区云。异地公有云甚至私有云都能满足要求。\n\n### 143. B.\n正确答案是使用 `Transport Layer Security\
  \ (TLS)` 对该应用程序的所有 Web 流量进行加密。这是任何网站应采取的最基本步骤之一。\n\n* 选项 A 错误。`web application firewall`\
  \ 可能是一个好主意，但它不是瑞恩（Ryan）要实施的最重要事项。\n* 选项 C 和 D 错误。`network intrusion detection service`\
  \ 或 `network intrusion prevent service` 可能是个好主意，但这些应该在考虑 `TLS` 之后考虑。\n\n### 144.\
  \ C.\n这通常被称为混淆（obfuscation）。许多年前（例如 `90` 年代末），它被认为是一种弱的安全措施。今天它只能被视为可能的安全漏洞且不应被使用。\n\
  \n* 选项 A、B 和 D 均错误。这些对场景的描述并不准确。\n\n### 145. A.\n`Agile programming` 是专为加速开发时间而开发的。尽管它并不适用于所有项目，但已经非常流行。\n\
  \n* 选项 B 错误。通常情况相反，`Agile` 会导致文档变少。\n* 选项 C 错误。你可以认为，如果执行得当，`Agile programming`\
  \ 的许多周期（重复设计）会增加对设计的关注。但并非总是如此，这也不是公司考虑 `Agile` 的原因。\n* 选项 D 错误。你可以认为，如果执行得当，`Agile\
  \ programming` 的许多周期（重复测试）会增加对测试的关注。但并非总是如此，这也不是公司考虑 `Agile` 的原因。\n\n### 146. D.\n\
  最重要的问题是摄像头本身是防篡的，且存储的数据是防篡的。无线安全摄像头是家庭自动化的一个例子，也是 `IoT` 运动的推动因素之一。\n\n\n\n\n\n-\
  \ 选项 A、B 和 C 都是错误的。这些都是重要的考虑因素，你应该考虑这三者。但最重要的问题是摄像头和视频存储的安全性。\n\n### 147 题\n**A.**\
  \ 显示器显示数据，其他人可能会看到这些数据。例如，携带笔记本电脑出差的员工可能会无意中泄露显示器上的数据，导致他人看到。因此，建议为笔记本电脑配备 `screen\
  \ filters`（屏幕保护膜）。\n\n- **选项 B** 是错误的。这在理论上可能是可能的，但尚未有报告显示实际发生过。即使真的遇到了，它也不是主要的安全问题。\n\
  - **选项 C** 是错误的。虽然显示器显示了登录界面，但它并不是实际身份验证处理的地方。\n- **选项 D** 是错误的。旧的 `CRT monitors`（CRT\
  \ 显示器）很容易受到这个问题。对于现代显示器，很难发生 `screen burn`（烧屏）。如果这是一个担忧，它肯定不是主要关注。\n\n### 148\n\
  **B.** 就像桌面式电脑、笔记本电脑和服务器一样，`patch management`（补丁管理）是一个基础的安全问题，必须予以解决。通过良好的 `patch\
  \ management`，可以防止许多恶意软件爆发和其他违规事件。\n\n- **选项 A、C 和 D** 都是错误的。这些中的每一个都是好主意，至少应该被考虑。然而，它们只适用于特定的安全问题，主要是如何处理丢失或被盗的移动设备。`patch\
  \ management` 影响所有移动设备，即使设备从未丢失或被盗，它因此更为重要。\n\n### 149\n**A.** `Phishing`（钓鱼攻击）依赖于欺骗用户。防止这种攻击的唯一真正防护是适当的用户培训。有些技术可以减少钓鱼邮件通过的概率，但没有哪种技术能阻止所有的钓鱼邮件。最好的保护是用户培训。\n\
  \n- **选项 B** 是错误的。`Network intrusion prevention systems`（网络入侵防御系统）通常对钓鱼邮件无效。\n-\
  \ **选项 C 和 D** 是错误的。这两者都应该至少阻止部分钓鱼邮件。但没有一种过滤器可以阻止所有的钓鱼邮件；因此，用户培训是针对钓鱼攻击最重要的安全措施。\n\
  \n### 150\n**D.** `Regulatory requirements`（监管要求）是由法律强制的。你必须实施这些要求；因此，它们是最重要的。\n\
  \n- **选项 A、B 和 C** 都是错误的。每一个都非常重要，你应该实施所有三者。但它们没有监管要求重要。\n\n***\n\n## 第 4 章：身份与访问管理\n\
  \n### 1\n**B.** `Type II authentication`（二类身份验证）是你拥有的东西。`smartcard`（智能卡）是你拥有的物理物品。虽然它比钥匙复杂，但归根结底仍然只是你拥有的东西。\n\
  \n- **选项 A** 是错误的。`Type I` 是你知道的某种，例如 `password`（密码）或 `pin`。\n- **选项 C** 是错误的。`Type\
  \ III` 是你特征特征，例如 `biometrics`（生物识别）。\n- **选项 D** 是错误的。`Strong authentication`（强身份验证）使用至少两种不同的类型，例如\
  \ `Type I` 和 `Type II`。\n\n### 2\n**A.** 正确答案是 `Kerberos` 使用各种 `tickets`（票），每个票都有时间限制。`service\
  \ tickets`（服务票）通常有效期只有 5 分钟或更短。这意味着如果 `NTP` 故障，有效的票可能看起来已经过期。\n\n- **选项 B、C 和 D**\
  \ 都是错误的。由于 `NTP` 故障，这些项都不可能产生任何重大影响。\n\n### 3\n**C.** 正确答案是 `Challenge Handshake\
  \ Authentication Protocol (CHAP)`（挑战握手验证协议）会定期让客户端 [验证]。\n\n- **选项 A** 是错误的。`SPAP`（Shiva\
  \ 验证协议）以明文发送用户名和密码。\n- **选项 B** 是错误的。`PAP`（密码验证协议）是一种较旧的验证方法。\n- **选项 D** 是错误的。`OAUTH`（开放授权）不进行重新身份验证。\n\
  \n### 4\n**C.** `Type III` 是你特征特征，例如 `biometrics`（生物识别）。\n\n- **选项 A** 是错误的。`Type\
  \ I` 是你知道的某种，例如 `password`（密码）或 `pin`。\n- **选项 B** 是错误的。`Type II` 是你拥有的东西。\n- **选项\
  \ D** 是错误的。`Strong authentication`（强身份验证）使用至少两种不同的类型，例如 `Type I` 和 `Type II`。\n\n\
  ### 5\n**D.** `Service account`（服务账户）是最合适的。\n\n- **选项 A** 是错误的。`LDAP`（轻量级目录访问协议）包含关于网络资源的信息。\n\
  - **选项 B** 是错误的。`SNMP`（简单网络管理协议）确实有关于网络资源的信息。\n- **选项 C** 是错误的。`Guest account`（客账户）提供的权限太大。\n\
  \n### 6\n**A.** `Shibboleth` 是一种用于身份和身份管理的中间件解决方案，它使用 `SAML`（安全断言标记语言）。\n\n- **选项\
