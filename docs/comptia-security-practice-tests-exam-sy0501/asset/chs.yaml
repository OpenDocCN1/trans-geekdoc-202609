  \n### 38. A.\n通配符证书允许公司在第三方域名上保护无限数量的子域名证书。\n\n- 选项 B 错误。对象标识符 (`OID`) 用于标识对象或实体。`OID`\
  \ 用于在 X.509 证书中命名几乎所有的对象类型。\n\n\n\n\n\n- 选项 C 错误。密钥托管（Key escrow）是一种加密密钥交换过程，由第三方存储密钥。如果原始用户的密钥丢失或被泄露，可以使用存储的密钥来解密加密材料，从而将原始材料恢复到未加密状态。\n\
  - 选项 D 错误。`OCSP`（在线证书状态协议）是一种可用于向证书颁发机构查询特定证书的撤销状态的协议。`OCSP` 响应包含经过签名的断言，证明该证书未被撤销。\n\
  \n### 39. B 和 D。`EAP` 和 `IEEE 802.1x` 是在两个设备之间传输身份数据的认证协议。\n\n- 选项 A 错误。`WPS`（WiFi\
