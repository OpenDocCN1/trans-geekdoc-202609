  1. 智能卡\n2. 人员室（mantrap），一扇门使用智能卡，另一扇门使用密码键盘\n3. 带有安全监控的围栏\n4. 智能卡门\n\n### 53.\n\
  以下哪个术语指的是建立安全标准？\n\n1. 基线（Baselining）\n2. 安全评估\n3. 加固\n4. 规范化\n\n### 54.\n你正试图提高公司的安全性。你正在创建一个所有需要检查和采取行动的安全方面的大纲。以下哪个术语描述了改进操作系统安全的过程？\n\
  \n1. `FDE`\n2. 加固\n3. `SED`\n4. 基线\n\n### 55.\n哪种 RAID 级别是“镜像条纹”？\n\n1. `RAID 1+0`\n\
  2. `RAID 6`\n3. `RAID 0`\n4. `RAID 1`\n\n### 56.\nIsabella 负责数据库管理和安全。她正尝试消除数据库中的冗余。这个过程被称为？\n\
  \n1. 完整性检查\n2. 取消配置\n3. 基线\n4. 规范化\n\n### 57.\n在网络上允许使用的应用程序列表被称为以下哪项？\n\n1. 黑名单\n\
  2. 红名单\n3. 白名单\n4. 橙色列表\n\n### 58.\nHans 是一家大公司的安全管理员。他网络上的用户访问各种网站。他担心他们可能从这些许多网站中获取恶意软件。缓解这种威胁的最佳方法是什么？\n\
  \n1. 实施基于主机的反病毒软件。\n2. 列黑已的受感染网站。\n3. 设置浏览器仅允许已签名的组件。\n4. 设置浏览器阻止所有活动内容（ActiveX、JavaScript\
  \ 等）。\n\n### 59.\nElizabeth 为公司实施了敏捷开发。敏捷开发与瀑布模型的主要区别是什么？\n\n1. 敏捷开发的阶段较少。\n2. 瀑布模型的阶段较少。\n\
  3. 敏捷开发更安全。\n4. 敏捷开发重复阶段。\n\n### 60.\nJohn 使用瀑布模型进行应用程序开发。他应该在哪个阶段实施安全措施？\n\n1.\
  \ 需求\n2. 设计\n3. 实现\n4. 以上阶段\n\n\n\n\n\n### 61. 你负责所在公司的数据库安全。你担心程序员可能会向数据库传递编写不当的\
  \ `SQL` 命令，或者攻击者可能会利用应用程序中编写不当的 `SQL`。缓解这种威胁的最佳方法是什么？\n1. 程序员培训\n2. 编程策略\n3. 敏捷编程\n\
  4. 存储过程\n\n### 62. Mary 担心她公司应用程序开发中的安全性问题。以下哪项是解决应用程序安全最重要的步骤？\n1. 适当的错误处理\n2.\
  \ 定期数据备份\n3. 加密数据传输\n4. 强身份验证\n\n### 63. Farès 负责管理公司网络上的许多虚拟机。在过去的两个两年里，该公司的虚拟机数量大幅增加。Farès\
  \ 已经无法有效管理这么多机器了。这种情况的术语是什么？\n1. `VM overload`（虚拟机过载）\n2. `VM sprawl`（虚拟机泛滥）\n3.\
  \ `VM spread`（虚拟机扩散）\n4. `VM zombies`（僵尸虚拟机）\n\n### 64. Mary 负责她公司的虚拟化管理。她担心 `VM\
  \ escape`（虚拟机逃逸）。以下哪种方法缓解这种风险最有效？\n1. 仅在绝对必要时在 `VM` 和宿主机之间共享资源。\n2. 保持 `VM` 更新更新。\n\
  3. 在 `VM` 上使用防火墙。\n4. 在 `VM` 上使用基于主机的反病毒软件。\n\n### 65. 你在大公司工作。你担心确保所有工作站具有相同的配置、没有安装流氓软件且所有补丁都保持最新。以下哪项对实现这一点最有效？\n\
  1. 使用 `VDE`。\n2. 实施强策略。\n3. 为所有工作站使用镜像。\n4. 实施强补丁管理。\n\n### 66. Juan 负责公司机房的物理安全。他被要求为机房推荐一种灭火系统。以下哪项是最佳选择？\n\
  1. 湿管式（Wet pipe）\n2. 雨水式（Deluge）\n3. 预作用式（Pre-action）\n4. 卤气（Halon）\n\n### 67. 你负责公司机房的安全性。你担心电脑被物理盗窃。以下哪项最能检测到盗窃或试图盗窃的行为？\n\
  1. 运动传感器触发的摄像头\n2. 机房的智能卡访问\n3. 机房配有强力死锁\n4. 记录每个进入机房的人员\n\n### 68. Teresa 在她的网络中部署了会话令牌（session\
  \ tokens）。这些对以下哪种攻击最有效？\n1. `DDoS`\n2. 重放攻击（Replay）\n3. `SYN flood`\n4. 恶意软件\n\n\
  ### 69. Hector 正在使用红外摄像头来验证其数据中心的服务器是否正确安装在机架上。他担心的是数据中心的哪种元素？\n1. `EMI blocking`（电磁干扰屏蔽）\n\
  2. 湿度控制\n3. 冷热通道\n4. `HVAC`（暖空调系统）\n\n### 70. Gerald 担心未经授权的人进入公司建筑。以下哪项对防止这种事情最有效？\n\
  1. 报警系统\n2. 围栏\n3. 摄像头\n4. 安保人员\n\n### 71. 实施 `SDN` 带来的最重要的益处是什么？\n1. 它将阻止恶意软件。\n\
  2. 它提供了可扩展性。\n3. 它将检测入侵。\n4. 它将防止会话劫持。\n\n### 72. Mark 是一家医疗保健公司的管理员。他必须支持一个旧的遗留应用程序。他担心这个遗留应用程序可能存在影响网络其他部分的漏洞。缓解这种威胁最高效的方法是什么？\n\
  1. 使用应用程序容器。\n2. 实施 `SDN`。\n3. 在单独的 `VLAN` 上运行应用程序。\n4. 坚持使用更新版本的应用程序。\n\n### 73.\
  \ Lars 正在对公司的物理安全进行审计。该公司在边界使用了链网围栏。围栏位于铺装路面上，而不是软土地上。围栏底部距离地面应该有多近？\n1. 接触地面\n\
  2. 4 英寸以内\n3. 对此没有标准。\n4. 2 英寸以内\n\n### 74. Mia 必须部署并支持一个遗留应用程序。该应用程序及其运行的操作系统配置非常特殊且无法更改。她部署此程序的最佳方法是什么？\n\
  1. 使用不可变服务器（immutable server）。\n2. 使用 `VM`。\n3. 设置应用程序权限使其无法被更改。\n4. 将应用程序放在单独的\
  \ `VLAN` 上。\n\n### 75. 为了缓解软件供应商破产产生的影响，使用供应商软件的公司应该要求以下哪项？\n1. 在收购前进行详细的信用调查\n\
  2. 第三方源代码托管（source-code escrow）\n3. 违约的巨额罚金\n4. 与其他供应商的备用合同\n\n### 66. Abigail 负责一家大型跨国公司的数据中心。她必须支持位于不同地区的多个数据中心。跨范围内管理这些中心的最有效方法是什么？\n\
  1. 为每个中心聘用经理。\n2. 实施企业级 `SDN`。\n3. 实施基础设施即代码 (`IaC`）。\n4. 自动化配置和撤销。\n\n### 77. Olivia\
  \ 负责公司电子商务服务器的应用安全。她特别担心 `XSS` 和 `SQL injection`。哪种技术缓解这些攻击最有效？\n1. 适当的错误处理\n2.\
  \ 使用存储过程\n3. 适当的输入验证\n4. 代码签名\n\n### 78. Sophia 想要测试公司的 应用程序，查看其是否正确处理了输入验证和数据验证。哪种测试方法最有效？\n\
  1. 静态代码分析\n2. 模糊测试（Fuzzing）\n3. 基准化（Baselining）\n4. 版本控制\n\n### 79. Omar 在他的公司使用瀑布模型进行软件开发。瀑布方法的正确顺序是？\n\
  1. 需求、设计、实现、测试、部署、维护\n2. 计划、设计、编码、测试、部署\n3. 需求、计划、设计、编码、测试、部署\n4. 设计、编码、测试、部署、维护\n\
  \n### 80. Lilly 负责公司应用程序的安全。她正在检查所有应用程序是否有健壮的输入验证。实施验证的最佳方式是？\n1. 服务端验证\n2. 客户端验证\n\
  3. 传输中验证\n4. 客户端和服务端验证\n\n### 81. Edward 负责一家大型保险公司的应用程序安全。他特别担心的一个应用程序由现场理赔员使用。他希望通过强身份验证方法来缓解应用程序滥用。他的最佳选择是什么？\n\
  1. 使用数字证书验证客户端。\n2. 实施非常强的密码策略。\n3. 使用 `TLS` 保护应用程序通信。\n4. 实施应用程序防火墙 (`WAF`)。\n\n\
  ### 82. Sarah 是一家小公司的 CIO。该公司使用几个自定义应用程序，这些应用程序与主机操作系统有复杂的交互。她担心确保网络上的所有系统都得到了正确的补丁更新。在她的环境中，最佳方法是什么？\n\
  1. 实施自动补丁。\n2. 实施让个人用户修补其系统的策略。\n3. 将补丁管理委托给部门经理，让他们找到最适合部门的补丁管理方法。\n\n\n\n\n4.\
  \ 立即将补丁部署到测试环境，一旦测试完成，立即向网络进行分阶段发布。\n\n### 83. John 正在检查他公司 Web 应用程序的日志。他发现了认为是一次泄露。经过进一步调查，似乎攻击者执行了应用程序使用的某个库中的代码，而该代码已经不再被应用程序使用。以下哪项最准确描述描述这种攻击？\n\
  \n1. 缓冲区溢出\n2. 代码重用攻击\n3. DoS 攻击\n4. 会话劫持\n\n### 84. Emiliano 是一个网络管理员，他对外围设备的安全性表示担忧。以下哪项是他可以采取的提高这些设备安全性的基本步骤？\n\
  \n1. 实施 `FDE`。\n2. 如果不需要，关闭远程访问（`SSH`、`telnet` 等）。\n3. 对所有外围设备利用模糊测试。\n4. 为所有外围设备实施数字证书。\n\
  \n### 85. Ixxia 是一个软件开发团队经理。她对代码中的内存泄漏表示担忧。哪种测试最可能发现内存泄漏？\n\n1. 模糊测试 (Fuzzing)\n\
  2. 压力测试 (Stress testing)\n3. 静态代码分析\n4. 归一化 (Normalization)\n\n### 86. Victor 是一家中型网络管理员。他希望能够远程访问服务器，以便从远程位置执行小型管理任务。以下哪项是他应该使用的最佳协议？\n\
  \n1. `SSH`\n2. `Telnet`\n3. `RSH`\n4. `SNMP`\n\n### 87. Mark 负责一个为大型研究机构运行敏感软件的服务器。他非常担心只有授权的软件才能在该服务器上运行。他还担心伪装成合法授权软件的恶意软件。哪种技术最好能解决这一担忧？\n\
  \n1. 安全启动 (Secure boot)\n2. 软件认证 (Software attestation)\n3. 沙箱化 (Sandboxing)\n4.\
  \ `TPM`\n\n### 88. Hannah 是某大型软件公司的程序员。她希望确保她刚刚创建的模块与另一个程序创建的模块良好协作。这是哪种测试？\n\n\
  1. 单元测试\n2. 回归测试\n3. 压力测试\n4. 集成测试\n\n### 89. Erik 负责 SCADA 系统的安全性。可用性是一个关键问题。以下哪项的实施最重要？\n\
  \n1. `SIEM`\n2. `IPS`\n3. 自动化补丁控制\n4. 蜜罐程序 (Honeypot)\n\n### 90. 你对公司实施的新设备的安全性表示担忧。其中一些设备使用了\
  \ SoC 技术。对于这些设备，你可以采取的最佳安全措施是什么？\n\n1. 使用 `TPM`\n2. 确保每个设备都有自己的加密密钥\n3. 使用 `SED`\n\
  4. 使用 `BIOS` 保护\n\n### 91. Vincent 在一家制造便携式医疗设备（如胰素泵）的公司工作。他担心确保这些设备的安全性。对他来说，采取的最重要的步骤是？\n\
  \n1. 确保与设备的所有通信都经过加密。\n2. 确保设备具有 `FDE`。\n3. 确保设备具有独立的防恶意软件。\n4. 确保设备已通过模糊测试。\n\n\
  ### 92. Emile 担心确保车辆内计算机系统的安全性。以下哪种车辆具有重大的网络安全漏洞？\n\n1. `UAV`\n2. 汽车\n3. 飞机\n4.\
  \ 以上所有\n\n### 93. Ariel 负责公司的软件开发。她担心软件开发团队与网络系统的集成是否良好。她希望确保软件开发流程与整个网络的安全需求保持一致。以下哪项对她来说实施得最重要？\n\
  \n1. 集成测试\n2. 安全 DevOps (Secure DevOps)\n3. 清晰的策略\n4. 员工培训\n\n### 94. Greg 是一家小公司的程序员。他负责\
  \ Web 应用程序。他意识到他的 Web 应用程序使用的一个模块可能存在安全漏洞，允许攻击者绕过验证。该模块有一个可用的更新可以修复该漏洞。他缓解此威胁的最优方法是什么？\n\
  \n1. 提交一个 `RFC`。\n2. 立即应用更新。\n3. 将更新放在测试服务器上，如果运行正常，则将其应用到生产服务器。\n4. 记录该问题。\n\n\
  ### 95. 你正在使用一个对你的网络进行攻击建模的复杂系统。你打算让该系统帮助你的团队识别薄弱环节并提高对事件的响应。在依赖该系统的数据之前，最重要的步骤是什么？\n\
  \n1. 获得 `CAB` 的批准。\n2. 彻底审查系统文档。\n3. 验证正在使用的模型。\n4. 对该系统进行集成测试。\n\n### 96. 你的公司有一个内部开发的会计应用程序。它已经运行了\
  \ 36 个月，功能非常良好，问题极少。你刚刚根据税法的变化对税收计算进行了细微调整。你的下一步应该是什么？\n\n1. 部署该更改。\n2. 获取该更改的 `CAB`\
  \ 批准。\n3. 执行压力测试。\n4. 执行回归测试。\n\n### 97. Tom 在一家大公司担任软件开发经理。他正试图向管理层解释编译代码与运行时代码之间的区别。编译代码最大的优势是什么？\n\
  \n1. 性能更好\n2. 平台无关性\n3. 更安全\n4. 开发时间更快\n\n### 98. 你的公司对在云端存储数据感兴趣。管理层认为公有云不安全，但担心私有云的成本。你推荐的解决方案是什么？\n\
  \n1. 告诉他们公云没有风险。\n2. 告诉他们为私有云寻找预算。\n3. 建议他们考虑社区云。\n4. 建议目前不要使用云解决方案。\n\n### 99.\
  \ 你的开发团队主要使用 Windows，但他们需要开发运行在 Linux 上的特定解决方案。让他们访问 Linux 的最佳解决方案是？\n\n1. 让他们的机器双系统\
  \ Windows 和 Linux。\n2. `PaaS`\n3. 为他们设置几台 Linux 机器供按需使用。\n4. `IaaS`\n\n### 100.\
  \ Daniel 在一家中型金融机构工作。该公司最近将其部分数据迁移到了云解决方案。Daniel 担心云提供商可能不支持与公司内部相同的相同的策略。缓解这一担忧的最佳方法是什么？\n\
  \n1. 实施云访问安全代理 (Cloud access security broker)。\n2. 执行集成测试。\n3. 建立云安全策略。\n4. 实施安全服务\
  \ (Security as a Service)。\n\n### 101. Hanz 负责他公司的电子商务服务器。他担心他们将如何应对 `DoS` 攻击。哪种软件测试方法对确定这一点最有帮助？\n\
  \n1. 回归测试\n2. 压力测试\n3. 集成测试\n4. 模糊测试\n\n### 102. 你是一家小公司的 CIO。公司想使用云存储存储其部分数据，但成本是一个主要考虑因素。以下哪种云部署模型最好？\n\
  \n1. 社区云\n2. 私有云\n3. 公云\n4. 混合云\n\n### 103. Alisha 正在监控一家中型金融机构的安全。在她的前任时期，发生了多次备受关注的泄露。管理层非常担心尽快检测到任何安全问题或违反政策的行为。以下哪项是解决问题的最佳解决方案？\n\
  \n1. 月审计\n2. `NIPS`\n\n\n\n\n### 3. NIDS\n\n### 4. 持续监控\n\n104. Helga 在一家银行工作，负责网上银行应用程序的安全通信。该应用程序使用\
  \ `TLS` 来确保所有客户通信的安全。她注意到，自从迁移到更大的加密密钥后，服务器性能有所下降。解决此问题的最佳方法是什么？\n\n1. 部署一个 `VPN`\
  \ 集中器。\n2. 部署一个 `SSL` 加速器。\n3. 回到较小的加密密钥。\n4. 升级所有服务器。\n\n105. 只允许在计算机上安装签名代码的主要优势是什么？\n\
  \n1. 它保证不会安装恶意软件。\n2. 它改进了补丁管理。\n3. 它验证了软件的创建者。\n4. 它在带有 `TPM` 的计算机上运行更快。\n\n106.\
  \ 下列哪项 `VM` sprawl（虚拟机扩张）描述最准确？\n\n1. 当网络上的 `VMs` 数量超过物理机器时\n2. 当 `VMs` 的数量超过 IT\
  \ 部门有效管理的范围\n3. 当计算机上的 `VM` 开始消耗过多的资源时\n4. 当 `VMs` 分布在广域网时\n\n107. 下列哪项对存储过程（stored\
  \ procedure）的描述最准确？\n\n1. 位于 `DLL` 中而非可执行文件的代码\n2. 从客户端调用的服务器端代码\n3. 在数据库服务器上编译为可调用的单一过程的\
  \ `SQL` 语句\n4. 保留在与调用应用程序独立的服务器上的过程，例如在中间件中\n\n108. Farès 负责他公司的安全。他在建筑前方安装了防震柱（bollards）。Farès\
  \ 试图实现什么？\n\n1. 为进入建筑的人员设置闸门访问\n2. 建筑周围的视频监控\n3. 防止电磁干扰（EMI`）\n4. 防止车辆驶入建筑\n\n109.\
