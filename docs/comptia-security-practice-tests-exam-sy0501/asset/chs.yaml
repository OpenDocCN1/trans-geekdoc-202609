  - 选项 D 错误。即使 IDS 发生故障，也不会停止日志记录。\n\n## 19. A. 从描述来看，他们似乎没有登录真实的 Web 服务器，而是登录了一个虚假服务器。这表明是域名抢骗（typosquatting）：拥有一个与真实网站名称非常相似的\
