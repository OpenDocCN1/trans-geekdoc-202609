  \n- 选项 A 错误。逻辑炸弹是在满足某些条件时执行作恶行为的恶意软件。\n- 选项 B 错误。木洛马将恶意程序封装在合法程序中。当用户下载并安装该合法程序时，他们就会得到恶意软件。\n\
