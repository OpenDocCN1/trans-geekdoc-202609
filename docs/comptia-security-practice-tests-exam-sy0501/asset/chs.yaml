  ### 52. A, C 和 D。一次性口码必须通过安全方法交付，并在每个目的地妥善保管。该口码只能使用一次以避免引入模式，并且必须由真正的随机值组成。今天的计算机系统具有伪随机数生成器，它们由计算机系统内部某些组件的初始值作为种子。\n\
