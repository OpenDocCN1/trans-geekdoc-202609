    In the case of the Lion Air crash, one theory is that shortly after taking off
    the `MCAS` might have attempted to push down the nose and that the human pilots
    were simultaneously trying to pull-up the nose, perhaps being unaware that the
    `MCAS` was trying to push down the nose. This appears to account for a roller
    coaster up-and-down effort that the plane seemed to experience. Some have pointed
    out that a human pilot might believe they have a stabilizer trim issue, referred
    to as a runaway stabilizer or runaway trim, and misconstrue a situation in which
    the `MCAS` is engaged and acting on the stabilizer trim.


    Speculation based on that theory is that the human pilot did not realize they
    were in a sense fighting with the `MCAS` to control the plane, and had the human
    pilot realized what was actually happening, it would have been relatively easy
    to have turned off the `MCAS` and taken over control of the plane, no longer being
    in a co-sharing mode. There have been documented cases of other pilots turning
    off the `MCAS` when they believed that it was fighting against their efforts to
    control the `Boeing 737 MAX 8`.


    One aspect that according to news reports is somewhat murky involves the `AOA`
    sensors in the case of the Lion Air incident. Some suggest that there was only
    one `AOA` sensor on the airplane and that it fed to the `MCAS` faulty data, leading
    the `MCAS` to push the nose down, even though apparently or presumably a nose
    down effort was not actually warranted.


    Other reports say that there were two `AOA` sensors, one on the Captain’s side
    of the plane and one on the other side, and that the `AOA` on the Captains side
    generated faulty readings while the one on the other side was generating proper
    readings, and that the `MCAS` apparently ignored the properly functioning `AOA`
    and instead accepted the faulty readings coming from the Captain’s side.


    There are documented cases of `AOA` sensors at times becoming faulty. One aspect
    too is that environmental conditions can impact the `AOA` sensor. If there is
    build-up of water or ice on the `AOA` sensor, it can impact the sensor. Keep in
    mind that there are a variety of `AOA` sensors in terms of brands and models,
    thus, not all `AOA` sensors are necessarily going to have the same capabilities
    and limitations.


    The first commercial flights of the `Boeing 737 MAX 8` took place in May 2017.
    There are other models of the `Boeing 737 MAX` series, both ones existing and
    ones envisioned, including the `MAX 7`, the `MAX 8`, the `MAX 9`, etc. In the
    case of the Lion Air incident, which occurred in October 2018, it was the first
    fatal incident of the `Boeing 737 MAX` series.


    There are a slew of other aspects about the `Boeing 737 MAX 8` and the incidents,
    and if interested you can readily find such information online. The recap that
    I’ve provided does not cover all facets -- I have focused on key elements that
    I’d like to next discuss with regard to AI systems.


    ## Shifting Hats to AI Self-Driving Cars Topic


    Let’s shift hats for a moment and discuss some background about AI self-driving
    cars. Once I’ve done so, I’ll then dovetail together the insights that might be
    gleaned about the `Boeing 737 MAX 8` aspects and how this can potentially be useful
    when designing, building, testing, and fielding AI self-driving cars.


    At the `Cybernetic AI Self-Driving Car Institute`, we are developing AI software
    for self-driving cars. As such, we are quite interested in whatever lessons can
    be learned from other advanced automation development efforts and seek to apply
    those lessons to our efforts, and I’m sure that the auto makers and tech firms
    also developing AI self-driving car systems are keenly interested in too.


    I’d like to first clarify and introduce the notion that there are varying levels
    of AI self-driving cars. The topmost level is considered `Level 5`. A `Level 5`
    self-driving car is one that is being driven by the AI and there is no human driver
    involved. For the design of `Level 5` self-driving cars, the auto makers are even
    removing the gas pedal, brake pedal, and steering wheel, since those are contraptions
    used by human drivers. The `Level 5` self-driving car is not being driven by a
    human and nor is there an expectation that a human driver will be present in the
    self-driving car. It’s all on the shoulders of the AI to drive the car.


    For self-driving cars less than a `Level 5`, there must be a human driver present
    in the car. The human driver is currently considered the responsible party for
    the acts of the car. The AI and the human driver are co-sharing the driving task.
    In spite of this co-sharing, the human is supposed to remain fully immersed into
    the driving task and be ready at all times to perform the driving task.


    I’ve repeatedly warned about the dangers of this co-sharing arrangement and predicted
    it will produce many untoward results.


    Let’s focus herein on the true `Level 5` self-driving car. Much of the comments
    apply to the less than `Level 5` self-driving cars too, but the fully autonomous
    AI self-driving car will receive the most attention in this discussion.


    Here’s the usual steps involved in the AI driving task:


    *   Sensor data collection and interpretation

    *   Sensor fusion

    *   Virtual world model updating

    *   AI action planning

    *   Car controls command issuance


    Another key aspect of AI self-driving cars is that they will be driving on our
    roadways in the midst of human driven cars too. There are some pundits of AI self-driving
    cars that continually refer to a utopian world in which there are only AI self-driving
    cars on the public roads. Currently there are about 250+ million conventional
    cars in the United States alone, and those cars are not going to magically disappear
    or become true `Level 5` AI self-driving cars overnight.


    Indeed, the use of human driven cars will last for many years, likely many decades,
    and the advent of AI self-driving cars will occur while there are still human
    driven cars on the roads. This is a crucial point since this means that the AI
    of self-driving cars needs to be able to contend with not just other AI self-driving
    cars, but also contend with human driven cars.


    It is easy to envision a simplistic and rather unrealistic world in which all
    AI self-driving cars are politely interacting with each other and being civil
    about roadway interactions. That’s not what is going to be happening for the foreseeable
    future. AI self-driving cars and human driven cars will need to be able to cope
    with each other.


    Returning to the matter of the `Boeing 737 MAX 8`, let’s consider some potential
    insights that can be gleaned from what the news has been reporting.


    Here’s a list of the points I’m going to cover:


    *   Retrofit versus start anew

    *   Single sensor versus multiple sensors reliance

    *   Sensor fusion calculations

    *   Human Machine Interface (HMI) designs

    *   Education/training of human operators

    *   Cognitive dissonance and Theory of Mind

    *   Testing of complex systems

    *   Firms and their development teams

    *   Safety considerations for advanced systems


    I’ll cover each of the points, doing so by first reminding you of my recap about
    the `Boeing 737 MAX 8` as it relates to the point being made, and then shifting
    into a focus on AI systems and especially AI self-driving cars for that point.


    I’ve opted to number the points to make them easier to refer to as a sequence
    of points, but the sequence number does not denote any kind of priority of one
    point being more or less important than another. They are all worthy points.


    Take a look at Figure 1.


    ![](images/00004.jpeg)


    ## Key Point #1: Retrofit versus start anew

