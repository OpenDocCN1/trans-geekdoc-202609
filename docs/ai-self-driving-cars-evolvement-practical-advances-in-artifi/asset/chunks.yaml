    我列出了一些公开文档，这些文档是快速上手 AI 自动驾驶汽车安全非常有用的基石。


    美国交通部（`DOT`）国家高速交通安全局（NHTSA）提供了两份关于 AI 自动驾驶汽车安全基础的报告，我认为这些报告非常有帮助。除了提供背景信息外，这些文件还指出了任何汽车制造商或科技公司在工作中需要考虑的监管因素。这两份报告都是在
    `DOT` 部长赵美（Elaine Chao）的主持下发布的。


    2.0 版本的报告在这里：

    https://www.nhtsa.gov/sites/nhtsa.dot.gov/files/documents/13069a-ads2.0_090617_v9a_tag.pdf


    3.0 版本的报告在这里：

    https://www.transportation.gov/sites/dot.gov/files/docs/policy-initiatives/automated-vehicles/320711/preparing-future-transportation-automated-vehicle-30.pdf


    我之前提到过 Uber 的安全报告，在这里：https://www.uber.com/info/atg/safety/


    我还提到过 Zoox 的安全报告，在这里：https://zoox.com/safety/


    你可能也会对 Waymo 的安全报告感兴趣，在这里：https://waymo.com/safety/


    我还想特别感谢 Philip Koopman 博士，他是 `CMU`（卡内基隆大学）的教授，进行了大量的 AI 安全相关研究，你可以在他的 `CMU` 网站或这个公司网站找到：https://edge-case-research.com/


    作为一名大学教授，我也曾在大学期间进行过研究，也通过外部公司进行过研究。这是一种很好的方法，可以将你通常在大学环境中进行的核心基础研究，与你在工业界从事更具应用性的工作结合起来。


    我发现这种组合非常实用。Philip 和我似乎经常参加许多相同的 AI 自动驾驶汽车会议，并以演讲者、小组小组或感兴趣的参与者的身份出席。


    ## 结论


    对于我在文中未提到的 AI 自动驾驶汽车公司的首席安全官（Chief Safety Officers），欢迎随时告诉我你们希望被包含在我未来关于该主题的更新中。此外，如果你有与我列出的类似的安全报告，欢迎提供给我审阅，我很乐意也提及它们。


    关于 AI 自动驾驶汽车行业的一个担忧是，安全问题是否正以一种秘密的方式进行，这导致每个汽车制造商或科技公司对其他公司在做什么一无所知。当你观察汽车行业时，显然汽车制造商传统上在安全记录上进行竞争，并以此作为优势，试图广告并销售他们的产品。


    批评者认为，如果 AI 自动驾驶汽车行业认为自己也在安全方面进行相互竞争，那么自然会有理由刻意避免共享有关安全方面的信息。


    你似乎无法兼兼得，因为如果你在安全方面进行竞争，那么这被假定是一个零和博弈，安全表现更好的人将比表现不好的人卖得更多，为什么要帮助竞争对手领先呢？


    这种心态需要被克服。正如之前提到的，只需要少数与安全相关的负面结果，就可能扼杀整个 AI 自动驾驶汽车领域。如果发生公众抗议，你可以预计这将给汽车制造商和科技公司带来压力。


    很有可能，监管机构将选择以更强硬的手段介入行业。AI 自动驾驶汽车事业的资金可能会枯竭。驱动 AI 自动驾驶追求的引擎可能会停滞。


    目前正出现一些努力，试图看看 AI 安全是否能成为 AI 自动驾驶汽车行业中更广泛的话题。


    然而，要克服所有这些 `NDA`（保密协议）以及对专利事项可能泄露的担忧是很困难的。遗憾的是，可能需要一场灾难才能获得足够的关注度让事态变得更加活跃，但我希望不会沦到那种地步。


    在追求 AI 自动驾驶汽车的众多汽车制造商和科技公司中引入首席安全官，是一个健康的信号，表明安全的重要性正在提高。


    这些公司必须认真地对待这些职位，并意识到他们不能仅仅设立一个角色来以此作为一种勾选。


    为了让首席安全官履行他们的职责，他们必须处于高管决策层，并被视为领导团队不可或缺的一部分。我也希望这些首席安全官能够团结在一起，成为一个跨行业的“俱乐部”，这个俱乐部可以拥抱安全共享准则，并利用他们的职位和分量，推动安全进一步渗透到
    AI 自动驾驶汽车的各个方面。让我们将其变为现实。


    ## 第 3 章：边界体积与 AI 自动驾驶汽车


    在高速公路上，我前方的一辆中型车顶部系着几根长杆子，晃动的杆子远远悬在飞驰汽车的尾部之外。在加州，法律规定任何超出尾灯后四英尺的悬空或突出物品必须装饰有红布或荧光橙旗。而且，如果发生在晚上，还必须在突出物上安装两盏灯（根据加州车辆法典
    `CVC` 第 `35410` 节）。


    司机没有满足所有这些法律要求。目前是白天。大约一小时后就是黄昏，然后很快就会天黑。啧，啧，无视法律。


    无论如何，紧迫的问题是其他驾驶员是否会意识到杆子是伸出的。考虑到时间、逐渐减弱的阳光，以及南加州许多人开车非常疯狂且不注意路况，我不怀疑某些疯狂的司机可能会离汽车非常近，以至于杆子可能会撞击挡风玻璃。


    根据杆子的性质以及它们系在车上的方式，我判断杆子不太可能刺破挡风玻璃，除了几处划痕和凹痕外，可能不会造成太大损坏，但真正的问题将是撞上杆子的驾驶者的反应。


    撞上杆子的驾驶员会突然感到震惊和惊讶，并在那种心理状态下选择鲁莽的动作吗？以每小时 65 英里的速度这样做注定会造成混乱。只需要一个驾驶员做一些不妥当的事，就会对其他驾驶员造成连锁影响。另一个考虑是，那些杆子可能会在撞击挡风玻璃后摇晃，然后掉到高速公路上，这可能也会导致一系列车辆穿梭和躲避那些杆子，增加车辆之间碰撞的概率。


    把杆子放在车顶的司机是否意识到了他们行为内在的问题？他们是因为懒惰而没有挂红旗或橙旗吗，还是认为不需要，或者可能是觉得太麻烦而认为杆子伸出来是“显而易见”的？或者，也许司机认为没有其他车会离他们的车近到以至于突出部分会产生影响。


    我与那辆车保持了距离。


