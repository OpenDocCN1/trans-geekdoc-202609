  trans: '

    如前所述，有一种理论认为狮空航空事故中的波音 737 MAX 8 有两个迎角（AOA）传感器，其中一个传感器发生故障，而另一个传感器仍然正常，但 `MCAS`
    却似乎忽略了正常的传感器，转而依赖发生故障的传感器。


    在 AI 自动驾驶汽车的情况下，一个重要方面涉及进行某种传感器融合，以确定自动驾驶汽车正在发生情况的更大整体概念。传感器融合子系统需要从无数传感器中收集感官数据或感官解释，并尝试对它们进行协调。这样做很有用，因为每种类型的传感器可能从特定的视角观察世界，通过对各种传感器进行“三角测量”，AI
    系统可以对自动驾驶汽车周围的交通状况获得更全面的理解。


    AI 自动驾驶汽车是否可能选择依赖故障传感器，同时忽略或低估功能完全正常的传感器？是的，绝对有可能，这种情况可能会发生。


    这完全取决于传感器融合是如何设计和开发工作的。如果 AI 开发者认为，例如前置摄像头总体比前置雷达更可靠，他们可能会开发软件，使其倾向于赋予摄像头的权重高于雷达。这意味着，当传感器融合试图决定选择哪个传感器提供当时的正确指示时，它可能会默认选择摄像头而不是雷达，即使摄像头正处于故障模式。


    也许传感器融合并不知道摄像头正在故障，因此它对摄像头采取了疑点从无的态度。或者，也许传感器融合意识到摄像头正在故障，但它被设置为无论对错，都将选择摄像头而不是雷达。


    AI 开发者做出的决定将很大程度上决定传感器融合期间发生什么。如果设计没有完全完善，或者如果设计没有按照预期实施，你完全可能会陷入从逻辑角度来看很奇怪的情况。


    这一点突显了设计传感器融合的重要性，即要以最能利用各种传感器的方式进行设计，并进行广泛的错误检查和纠正，同时能够处理好传感器和坏传感器。这包括传感器那些令人头疼且有时难以捉摸的间歇性故障。


    ## 关键点 #4：人机界面 (HMI) 设计


    根据新闻报道，`MCAS` 总是自动激活的，并试图确定是否应该介入共享飞行控制的操作。似乎该飞机的一些飞行员可能没有意识到这一点。也许某些人不知道 `MCAS`，或者也许某些人知道
    `MCAS`，但认为它只会在他们的人类飞行指令下才会介入。


    除了这种始终开启的特性之外，也许某些人类飞行员不知道如何关闭该功能，或者他们曾经知道过但忘记了如何操作。或者，也许在危机时刻，他们没有在考虑 `MCAS`
    是否会错误地与他们作斗，因此他们没有完全断开它的念头。


    他们在危机期间可能还会在试图考虑飞机正在发生的各种可能性。从事后观点来看，也许很容易将 `MCAS` 孤离开来并让某人说是罪魁祸首，但在飞机与你作斗的时刻，你的心理精力都集中在努力纠正飞机上，并寻找飞机出现问题的原因。人类飞行员必须分析一个巨大的潜在心理搜索空间，而这是在实时发生的，并涉及明显的严重和生死攸关的后果。


    让这种情况在 `MCAS` 情况下似乎更加微妙的是，由于它显然在飞行员使用操纵杆开关时会暂时断开，但 `MCAS` 在当它计算出有需要这样做时会重新介入。人类飞行员最初可能认为他们已经完全断开了
    `MCAS`，但实际上它只是暂时断开了。当 `MCAS` 重新介入时，人类飞行员可能会对为什么控制再次出现问题感到困惑。


