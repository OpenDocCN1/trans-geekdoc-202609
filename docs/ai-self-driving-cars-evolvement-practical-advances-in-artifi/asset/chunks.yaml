- fmt: '

    In referring to the car controls, it is simplest to focus on the brakes, the accelerator,
    and the steering wheel. Those of course aren’t the only car controls you deal
    with. You need to start the car. You need to put the car into gear, perhaps using
    `reverse` to back out of your garage, and then place the car into `drive` to head
    down the street that you live on.


    Besides the gears, you might have also been using your `parking brake`. I swear
    that at least once per month or so that I somehow forget that I had used the `parking
    brake` and then upon backing out of my garage, and realizing the car is moving
    really sluggishly, I sheepishly realize I had forgotten to release the `parking
    brake`. Hope it’s not a sign of dementia setting in.


    You could suggest that your `indicators` or `blinkers` are also part of your car
    controls. They don’t likely cause the car to do anything in terms of its motion,
    but they are an important means of informing other drivers and pedestrians about
    what way you are going to go. I’m guessing you also long ago learned the arm signals
    that you can also use, placing your arm out the driver’s side window to use it
    as a `turn indicator`. It is a rarity to do so today.


    When I see someone use their arm in this manner, I often do a little laugh at
    the charm of using such archaic ways (also, does this mean their `blinkers` are
    broken, or are they just trying to be a friendly driver, or what is the story?).


    Would you say that your `headlamps` are part of your car controls? It seems a
    bit of a stretch. You could though argue that they are important to being able
    to see the road ahead, especially at nighttime. They also can forewarn other drivers
    of your presence. The `headlamps` and the `fog lamps` can be an important element
    of driving. We can nonetheless debate whether you consider them as a car control
    or not, since the `headlamps` don’t directly control the movement of the car.


    I’m going to herein concentrate on the `brakes`, the `accelerator`, and the `steering`,
    claiming that those are the core controls of the car. I’ve mentioned the other
    control related aspects to make sure that no one accuses me of having forgotten
    about those other means of controlling the car. Yes, the `parking brake` can be
    quite important. Yes, choosing the `gear` for the car is quite important. And
    so on. Please just assume that I acknowledge and appreciate their role in the
    driving task.


    Speaking of the `parking brake`, I learned a handy trick from a college buddy
    during my wild driving days as a college student.


    One day, he was driving his car and I was sitting in the front passenger seat.
    We were rocketing along and headed from Los Angeles up to the `Bay Area`, going
    to a college football game up there. Admittedly, he was going faster than the
    speed limit. Wrong of us. You have to though realize that there is a lengthy freeway,
    designated as the `5 freeway`, requiring about a 6- or 7-hour drive to get up
    to the `Bay Area` from Southern California, and I dare say that everyone driving
    this highway goes over the speed limit (well, okay, maybe not the truck drivers).
    You can cut down the drive to around 5 hours if you are willing to inch above
    the posted speed limit (probably more than just an inch!).


    All of a sudden, my friend reached for the `parking brake` and began to make use
    of it. This didn’t make any sense to me. A `parking brake` was intended for use
    when you are parked, or so I had thought. Why in the world was he toying with
    the `parking brake`? Had he lost his mind? Did he have some beers before we headed-out,
    doing a bit of pregaming before we reached our destination? I hoped not.


    Upon seeing my quizzical look, he explained that there was a `California Highway
    Patrol (CHP)` police car that had gotten onto the freeway and was now behind us,
    about a quarter mile or so. We were going over the speed limit and a handy target
    for the `CHP` to pull us over. My buddy told me that if he used the actual `brakes`,
    the `brake lights` would illuminate. This would be a sure sign that he was trying
    to bleed off speed and it might spark the `CHP` to come and give him a speeding
    ticket.


    By using the `parking brake`, he was able to gradually reduce the speed of the
    car. This also did not provide any kind of overt clue of what was taking place.
    Clever? Or, a misguided use of a crucial feature of the car? You decide. In any
    case, we ended-up going the actual speed limit for much of the rest of the trip,
    doing so as long as the `CHP officer` was behind us.


    So, as I say, the `parking brake` is indeed a car control. Likewise, the use of
    the `gears`. You likely use the `gears` in a perfunctory way. Put the car into
    `reverse` to back out of your garage, put it into `forward` or `drive` to move
    ahead. You do this similarly when parking in a parking lot. Most of the time,
    there’s not much else involved in dealing with `gears`, at least in an automated
    transmission equipped car.


    During a camping trip with my son’s Boy Scout troop, we drove up into the mountains,
    and I suddenly became more aware of the `gears` in my car. On some of the steep
    roads, I had to put the car into a lower gear. Also, while driving along the winding
    roads that dipped and rose, I could sense the car doing a lot of shifting among
    the `gears`. Usually, the shifting was done without any noticeable indication.
    On these tougher roads, the shifting became more obvious, both the sounds of the
    `gears` shifting and the engine noise, along with the feeling of the car as each
    gear shift took place.


    A good driver is aware of the full gamut of ways in which they can control their
    car. No tool or feature or driving control should be ignored or forgotten and
    left to being unused.


    ### Core Controls

    Focusing on just the `brakes`, the `accelerator`, and the `steering`, let’s consider
    how you make use of those.


    At a tactical level, it’s apparent that you use the `brakes` to slow down the
    car. You use the `accelerator` to speed-up the car. You use the `steering wheel`
    to redirect the direction of the car. Novice drivers aren’t at first sure which
    pedal is the brake and which is the gas. They often get confused which is which.
    They are also unsure about whether to use their left foot, their right foot, or
    maybe both feet to control the pedals.


    ### Historical Context


    What’s kind of interesting about the history of car controls is the evolution
    to what we have today. In the United States, for example, we earlier in our history
    had the driving controls on the right side of the car, rather than the left side.
    This is surprising to most people here in the U.S.


    What, the driving controls were the “wrong” way, some ask? Note, wrong meaning
    that those with driving controls on the left side tend to think that’s the proper
    placement, while those that have driving controls on the right side tend to think
    they have the proper placement.


    ### Statistics


    In any case, we have an estimated several hundred million licensed drivers in
    the United States. California has the most licensed drivers, coming out to around
    27 million or so. I mention these rather large numbers to point out that it is
    quite amazing that all of those people have learned how to drive a car. In fact,
    it likely didn’t take them very long to learn how to drive a car. Furthermore,
    they drive a car with relative ease, meaning that they don’t routinely struggle
    to control the car and make it go.


    Imagine if driving a car was akin to piloting a plane or a spaceship. Think about
    how much training everyone would need to have. The odds too are that they would
    need refresher training from time to time. The complexity of the driving controls
    would cause us all to struggle when driving a car. It would be a chore to have
    to drive your car, even for a short trip to the grocery store.

