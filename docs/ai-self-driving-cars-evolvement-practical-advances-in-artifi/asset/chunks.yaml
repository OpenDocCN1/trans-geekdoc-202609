  trans: '

    具有不规则形状轮廓的问题在于，在处理虚拟世界模型中的 `BV`（边界体积）时，会增加额外的数学和计算工作。时间是至关重要的，将 `BV` 变为不规则形状将以额外的计算机处理时间为代价。在计算计算开销较低的简单形状与使用消耗大量计算处理时间的复杂形状之间，存在着权衡。


    在尝试让虚拟世界模型尽可能快的时候，你需要采用的各种算法技巧。例如，在尝试确定两个或多个 `Bounded Volumes`（包围体）是否会发生相交时，你可以使用`分离轴定理`
    (`SAT`），这是一种快速确定涉及两个 `BV` 之间最小穿透向量的方法。本质上，你是在数学上尝试判断是否有一条直线或平面可以穿过两个 `Bounded
    Volumes` 之间，如果是，则这两者尚未相交。


    我在会议上经常被问到的一个问题是，虚拟世界模型及其使用 `Bounded Volumes` 作为代表现实世界对象的虚拟容器，是否可以在自动驾驶汽车之外进行计算，例如在汽车制造商或科技公司的云端。你通常会预料所有这些计算必须在自动驾驶汽车的车载
    AI 系统中进行，因为时机方面至关重要。这就是为什么 AI 自动驾驶汽车装满了最快的处理器，并倾向于在车载大量的计算机内存。


    尝试将虚拟世界模型置于云端的关键问题是，AI 自动驾驶汽车与云端之间传输事项时涉及的延迟。


    将来自传感器的传感器的数据推送到云端的时间，以及将结果回传到自动驾驶汽车的时间，消耗了太多时间，以至于你可能无法让 AI 自动驾驶汽车做出及时反应。


    通常，AI 自动驾驶汽车的任何 `OTA`（空中下载技术）方面都是针对本身并非时间关键的事务完成的。例如，在一天驾驶结束后，AI 自动驾驶汽车可能会向云端推送一整天的收集数据，同时云端可能会向自动驾驶汽车推送最新的补丁和更新。


    人们寄希望于随着 `5G` 的出现以及边缘计算，也许这些方面可以以更实时的方式发生，尽管目前看来其发生速度仍然快到无法在实际驾驶活动中实现环路控制。


    有人提出了一种混合方法，即在车载系统中拥有虚拟世界模型，并在云端拥有一个镜像版本。基于云的版本将用于探索 AI 自动驾驶汽车“长期”时间线的操作，例如检查自动驾驶汽车前方某距离正在发生的情况。同时，车载
    AI 系统专注于更紧迫的战术方面。


    这种精力的分工允许利用云端的百亿级超级计算能力，并为车载 AI 能够承担的任务提供额外助力。


    关于虚拟世界模型的另一个方面涉及`机器学习`或`深度学习`的使用。


    大部分虚拟世界模型的工作主要是基于逻辑的，涉及对来自虚拟世界模型的计算和预测进行编码。


    有趣的是，通过`深度学习` 识别驾驶模式是可能的。


    ### 结论


    具有不规则形状轮廓的问题在于在处理虚拟世界模型中的 `BV` 时，会增加额外的数学和计算工作。时间是至关重要的，将 `BV` 变为不规则形状将以额外的计算机处理时间为代价。在计算计算开销较低的简单形状与使用消耗大量计算处理时间的复杂形状之间，存在着权衡。


    在尝试让虚拟世界模型尽可能快的时候，你需要采用的各种算法技巧。例如，在尝试确定两个或多个 `Bounded Volumes` 是否会发生相交时，你可以使用`分离轴定理`
    (`SAT`)），这是一种快速确定涉及两个 `BV` 之间最小穿透向量的方法。本质上，你是在数学上尝试判断是否有一条直线或平面可以穿过两个 `Bounded
    Volumes` 之间，如果是，则这两者尚未相交。


