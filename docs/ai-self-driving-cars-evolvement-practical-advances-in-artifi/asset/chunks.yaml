    \ predict that the driver is going to try and either swing into the lane to the\
    \ right or start to make a right turn. \n\nAnother head signal involves a head\
    \ nod, often used when at a four-way stop and the other driver wants to showcase\
    \ that either you should go or they want to proceed.\n\nLet’s focus on the micro-movements\
    \ of cars that are evidenced by the actual car and set aside for now the kinds\
