    \ to do, you are setting things up for a very messy and untoward outcome.\n\n\
    Conclusion\n\nI sometimes liken the micro-movements topic to the nature of dancing.\
    \ If two people are going to dance together, they need to figure out the subtle\
    \ movements that indicate whether to turn to the left or turn to the right, and\
    \ whether to speed-up or slow down the pace.\n\nEach dancer needs to be able to\
    \ detect the micro-movements of the other, along with knowing how to react.\n\n\
    Furthermore, each dancer needs to be able to exhibit their own micro-movements,\
    \ in order to allow their dancing partner to detect the movement and be able to\
    \ react accordingly.\n\nRight now, we have humans that detect the micro-movements\
    \ of other human drivers, plus human drivers emit micro-movements as part of their\
    \ driving efforts (by-and-large). We are in the midst of witnessing AI self-driving\
    \ cars being fielded and tested that don’t detect the micro-movements of other\
    \ cars, and nor do the AI self-driving cars emit their own micro-movements.\n\n\
    You can’t have much of a fluid dance when one of the partners is clueless. In\
    \ the case of cars, a dance partner that is clueless can lead to untoward car\
    \ accidents. \n\nHuman drivers won’t judge what the AI is going to do, and bang,\
    \ there will be collisions.  AI self-driving cars won’t be able to well-judge\
    \ what human drivers are going to do, and as a result the AI will drive in an\
    \ overly timid and hesitant way, which will likely ultimately lead to car accidents.\n\
    \nIt’s time to make sure that the dancing partners of human drivers and AI drivers\
    \ are versed in the same kinds of capabilities and tactics of driving. I vote\
    \ that the auto makers and tech firms put more effort toward the micro-movement\
    \ elements, which makes sense to ensure that the dancing partners won’t collide\
    \ into each other and make ghastly missteps. \n\nCHAPTER 5 \n\nBOEING 737 ASPECTS\
    \  \n\nAND\n\nAI SELF-DRIVING CARS\n\nCHAPTER 5 \n\nBOEING 737\n\nASPECTS\n\n\
    AND \n\nAI SELF-DRIVING CARS\n\nThe Boeing 737 MAX 8 aircraft has been in the\
    \ news recently, doing so sadly as a result of a fatal crash that occurred on\
    \ March 10, 2019 involving Ethiopian Airlines flight #302. \n\nNews reports suggest\
    \ that another fatal crash of the Boeing 737 MAX 8 that took place on October\
    \ 29, 2018 for Lion Air flight #610 might be similar in terms of how the March\
    \ 10, 2019 crash took place. It is noteworthy to point out that the Lion Air crash\
    \ is still under investigation, possibly with a final report being released later\
    \ this year, and the Ethiopian Airlines crash investigation is just now starting\
    \ (at the time of this writing).\n\nI’d like to consider at this stage of understanding\
    \ about the crashes whether we can tentatively identify aspects about the matter\
    \ that could be instructive toward the design, development, testing, and fielding\
    \ of Artificial Intelligence (AI) systems.\n\nThough the Boeing 737 MAX 8 does\
    \ not include elements that might be considered in the AI bailiwick per se, it\
    \ seems relatively apparent that systems underlying the aircraft could be likened\
    \ to how advanced automation is utilized. Perhaps the Boeing 737 MAX 8 incidents\
    \ can reveal vital and relevant characteristics that can be valuable insights\
    \ for AI systems, especially AI systems of a real-time nature.\n\nA modern-day\
    \ aircraft is outfitted with a variety of complex automated systems that need\
    \ to operate on a real-time basis. During the course of a flight, starting even\
    \ when the aircraft is on the ground and getting ready for flight, there are a\
    \ myriad of systems that must each play a part in the motion and safety of the\
    \ plane. Furthermore, these systems are at times either under the control of the\
    \ human pilots or are in a sense co-sharing the flying operations with the human\
    \ pilots. The Human Machine Interface (HMI) is a key matter to the co-sharing\
    \ arrangement.\n\nI’m going to concentrate my relevancy depiction on a particular\
    \ type of real-time AI system, namely AI self-driving cars.\n\nPlease though do\
    \ not assume that the insights or lessons mentioned herein are only applicable\
    \ to AI self-driving cars. I would assert that the points made are equally important\
    \ for other real-time AI systems, such as robots that are working in a factory\
    \ or warehouse, and of course other AI autonomous vehicles such as drones and\
    \ submersibles. You can even take out of the equation the real-time aspects and\
    \ consider that these points still would readily apply to AI systems that are\
    \ considered less-than real-time in their activities."
