- fmt: "\n# Sensor Fusion in Driving\n\nIt just happens, naturally. We do the sensor\
    \ fusing by a kind of autonomic process, ingrained by our innate and learned abilities\
    \ of fusing our sensory inputs from the time we are born. On some occasions, we\
    \ might be sparked to think about our sensor fusing capacities, if the circumstance\
    \ catches our attention.\n\n## The Downtown Experience\n\nThe other day, I was\
    \ driving in the downtown Los Angeles area. There is always an abundance of traffic,\
    \ including cars, bikes, motorcycles, scooters, and pedestrians that are prone\
    \ to jaywalking. There is a lot to pay attention to. Is that bicyclist going to\
    \ stay in the bike lane or decide to veer into the street? Will the pedestrian\
    \ eyeing my car decide to leap into the road and dart across the street, making\
    \ them a target and causing me to hit the brakes? It is a free-for-all.\n\nI had\
    \ my radio on, listening to the news reports, when I began to faintly hear the\
    \ sound of a siren, seemingly off in the distance. Maybe it was outside, or maybe\
    \ it was inside the car -- the siren might actually be part of a radio segment\
    \ covering the news of a local car accident that had happened that morning on\
    \ the freeway, or was it instead a siren somewhere outside of my car? I turned\
    \ down my radio. I quickly rolled down my driver’s side window.\n\nAs I strained\
    \ to try and hear a siren, I also kept my eyes peeled, anticipating that if the\
    \ siren was occurring nearby, there might be a police car or ambulance or fire\
    \ truck that might soon go skyrocketing past me. These days it seems like most\
    \ driver’s don’t care about emergency vehicles and fail to pull over to give them\
    \ room to zoom along. I’m one of those motorists that still thinks we ought to\
    \ help out by getting out of the way of the responders (plus, it’s the law in\
    \ California, as it is in most states). \n\nOf course, it makes driving sense\
    \ anyway to get out of the way, since otherwise you are begging to get into a\
    \ collision with a fast-moving vehicle, which doesn’t seem like a good idea on\
    \ anyone’s behalf. \n\nA few years ago, I saw the aftermath of a collision between\
    \ a passenger car and an ambulance. The two struck each other with tremendous\
    \ force. The ambulance ended-up on its side. I happened to drive down the street\
    \ where the accident had occurred, and the recovery crews were mopping up the\
    \ scene. It looked outright frightening.\n\n## Discerning the Siren\n\nIn any\
    \ case, I was listening intently in the case of my driving in downtown Los Angeles\
    \ and trying to discern if an emergency vehicle was in my vicinity and warning\
    \ to be on the watch for it. I could just barely hear the siren. My guess was\
    \ that it had to be a few blocks away from me. Was it thought getting louder and\
    \ getting nearer to me, or was it fading and getting further away?\n\nI decided\
    \ that the siren was definitely getting more distinctive and pronounced. The echoes\
    \ along the streets and buildings was creating some difficulty in deciding where\
    \ the siren was coming from. I could not determine if the siren was behind me\
    \ or somewhere in front of me. I couldn’t even tell if the siren was to my left\
    \ or to my right. All I could seem to guess is that it was getting closer, one\
    \ way or another.\n\n## The Fusion Process\n\nAt times like this, your need to\
    \ do some sensor fusion is crucial. Your eyes are looking for any telltale sign\
    \ of an emergency vehicle. Maybe the flashing lights might be seen from a distance.\
    \ Perhaps other traffic might start to make way for the emergency vehicle, and\
    \ that’s a visual clue that the vehicle is coming from a particular direction.\
    \ Your ears are being used to do a bat-like echolocation of the emergency vehicle,\
    \ using the sound to gauge the direction, speed, and placement of the speeding\
    \ object.\n\nI became quite aware of my having to merge together the sounds of\
    \ the siren with my visual search of the traffic and streets. Each was feeding\
    \ the other. I could see traffic up ahead that was coming to a stop, doing so\
    \ even though they had a green light. It caused me to roll down my other window,\
    \ the front passenger side window, in hopes of aiding my detection of the siren.\
    \ \n\nSure enough, the sound of the siren came through quite a bit on the right\
    \ side of my car, more so than the left side of the car. I turned my head toward\
    \ the right, and in moments saw the ambulance that zipped out of a cross-street\
    \ and came into the lanes ahead.\n\n## Multi-Sensor Data Fusion\n\nThis is the\
    \ crux of Multi-Sensor Data Fusion. I had one kind of sensor, my eyes, providing\
    \ visual inputs to my brain. I had another kind of sensor, my ears, providing\
    \ acoustical inputs to my brain. My brain managed to tie together the two kinds\
    \ of inputs. Not only were the inputs brought together, they were used in a means\
    \ of.\n"
  raw: "It just happens, naturally. We do the sensor fusing by a kind of autonomic\
    \ process, ingrained by our innate and learned abilities of fusing our sensory\
    \ inputs from the time we are born. On some occasions, we might be sparked to\
    \ think about our sensor fusing capacities, if the circumstance catches our attention.\n\
    \nThe other day, I was driving in the downtown Los Angeles area. There is always\
    \ an abundance of traffic, including cars, bikes, motorcycles, scooters, and pedestrians\
    \ that are prone to jaywalking. There is a lot to pay attention to. Is that bicyclist\
    \ going to stay in the bike lane or decide to veer into the street? Will the pedestrian\
    \ eyeing my car decide to leap into the road and dart across the street, making\
    \ them a target and causing me to hit the brakes? It is a free-for-all.\n\nI had\
    \ my radio on, listening to the news reports, when I began to faintly hear the\
    \ sound of a siren, seemingly off in the distance. Maybe it was outside, or maybe\
    \ it was inside the car -- the siren might actually be part of a radio segment\
    \ covering the news of a local car accident that had happened that morning on\
    \ the freeway, or was it instead a siren somewhere outside of my car? I turned\
    \ down my radio. I quickly rolled down my driver’s side window.\n\nAs I strained\
    \ to try and hear a siren, I also kept my eyes peeled, anticipating that if the\
    \ siren was occurring nearby, there might be a police car or ambulance or fire\
    \ truck that might soon go skyrocketing past me. These days it seems like most\
    \ driver’s don’t care about emergency vehicles and fail to pull over to give them\
    \ room to zoom along. I’m one of those motorists that still thinks we ought to\
    \ help out by getting out of the way of the responders (plus, it’s the law in\
    \ California, as it is in most states). \n\nOf course, it makes driving sense\
    \ anyway to get out of the way, since otherwise you are begging to get into a\
    \ collision with a fast-moving vehicle, which doesn’t seem like a good idea on\
    \ anyone’s behalf. \n\nA few years ago, I saw the aftermath of a collision between\
    \ a passenger car and an ambulance. The two struck each other with tremendous\
    \ force. The ambulance ended-up on its side. I happened to drive down the street\
    \ where the accident had occurred, and the recovery crews were mopping up the\
    \ scene. It looked outright frightening.\n\nIn any case, I was listening intently\
    \ in the case of my driving in downtown Los Angeles and trying to discern if an\
    \ emergency vehicle was in my vicinity and warning to be on the watch for it.\
    \ I could just barely hear the siren. My guess was that it had to be a few blocks\
    \ away from me. Was it thought getting louder and getting nearer to me, or was\
    \ it fading and getting further away?\n\nI decided that the siren was definitely\
    \ getting more distinctive and pronounced. The echoes along the streets and buildings\
    \ was creating some difficulty in deciding where the siren was coming from. I\
    \ could not determine if the siren was behind me or somewhere in front of me.\
    \ I couldn’t even tell if the siren was to my left or to my right. All I could\
    \ seem to guess is that it was getting closer, one way or another.\n\nAt times\
    \ like this, your need to do some sensor fusion is crucial. Your eyes are looking\
    \ for any telltale sign of an emergency vehicle. Maybe the flashing lights might\
    \ be seen from a distance. Perhaps other traffic might start to make way for the\
    \ emergency vehicle, and that’s a visual clue that the vehicle is coming from\
    \ a particular direction. Your ears are being used to do a bat-like echolocation\
    \ of the emergency vehicle, using the sound to gauge the direction, speed, and\
    \ placement of the speeding object.\n\nI became quite aware of my having to merge\
    \ together the sounds of the siren with my visual search of the traffic and streets.\
    \ Each was feeding the other. I could see traffic up ahead that was coming to\
    \ a stop, doing so even though they had a green light. It caused me to roll down\
    \ my other window, the front passenger side window, in hopes of aiding my detection\
    \ of the siren. \n\nSure enough, the sound of the siren came through quite a bit\
    \ on the right side of my car, more so than the left side of the car. I turned\
    \ my head toward the right, and in moments saw the ambulance that zipped out of\
    \ a cross-street and came into the lanes ahead.\n\nThis is the crux of Multi-Sensor\
    \ Data Fusion. I had one kind of sensor, my eyes, providing visual inputs to my\
    \ brain. I had another kind of sensor, my ears, providing acoustical inputs to\
    \ my brain. My brain managed to tie together the two kinds of inputs. Not only\
    \ were the inputs brought together, they were used in a means of each aiding the\
    \ other. My visual processing led me to listen toward the sound. The sound led\
    \ me to look toward where the sound seemed to be coming from.\n\nMy mind, doing\
    \ some action planning of how to drive the car, melded together the visual and\
    \ the acoustic, using it to guide how I would drive the car. In this case, I pulled\
    \ the car over and came to a near stop. I also continued to listen to the siren.\
    \ Only once it had gone far enough away, along with my not being able to see the\
    \ emergency vehicle anymore, did I decide to resume driving down the street.\n\
    \nThis whole activity of my doing the sensor fusion was something that played\
    \ out in just a handful of seconds. I know that my describing it seemed to suggest\
    \ that it took a long time to occur, but the reality is that the whole thing happened\
    \ like this, hear siren, try to find siren, match siren with what I see, pull\
    \ over, wait, and then resume driving once safe to do so. It is a pretty quick\
    \ effort. You likely do the same from time-to-time. \n\nSuppose though that I\
    \ was wearing my ear buds and listening to loud music while driving (not a wise\
    \ thing to do when driving a car, and usually illegal to do while driving), and\
    \ did not hear the siren? I would have been solely dependent upon my sense of\
    \ sight. Usually, it is better to have multiple sensors active and available when\
    \ driving a car, giving you a more enriched texture of the traffic and the driving\
    \ situation. \n\nNotice too that the siren was hard to pin down in terms of where\
    \ it was coming from, along with how far away it was. This highlights the aspect\
    \ that the sensory data being collected might be only partially received or might\
    \ otherwise be scant, or even faulty. Same could be said about my visually trying\
    \ to spot the emergency vehicle. The tall buildings blocked my overall view. The\
    \ other traffic tended to also block my view. If it had been raining, my vision\
    \ would have been further disrupted.\n\nAnother aspect involves attempting to\
    \ square together the inputs from multiple sensors. Imagine if the siren was getting\
    \ louder and louder, and yet I did not see any impact to the traffic situation,\
    \ meaning that no other cars changed their behavior and those pedestrians kept\
    \ jaywalking. That would have been confusing. The sounds and my ears would seem\
    \ to be suggesting one thing, while my eyes and visual processing was suggesting\
    \ something else. It can be hard at times to mentally resolve such matters.\n\n\
    In this case, I was alone in my car. Only me and my own “sensors” were involved\
    \ in this multi-sensor data fusion. You could have more such sensors, such as\
    \ when having passengers that can aid you in the driving task.\n\nI recall during\
    \ my college days a rather harried driving occasion. While driving to a college\
    \ basketball game, I managed to get into a thick bank of fog. Some of my buddies\
    \ were in the car with me. At first, I was tempted to pull the car over and wait\
    \ out the fog, hoping it would dissipate. My friends in the car were eager to\
    \ get to the game and urged me to keep driving. I pointed out that I could barely\
    \ see in front of the car and had zero visibility of anything behind the car.\n\
    \nNot the best way to be driving at highway speeds on an open highway. Plus, it\
    \ was night time. A potent combination for a car wreck. It wasn’t just me that\
    \ I was worried about, I also was concerned for my friends. "
