    # 关于作者

    Lance B. Eliot 博士拥有 MBA 和 PhD 学位，是 `Techbruim, Inc.` 的 CEO 以及 `Cybernetic AI Self-Driving
    Car Institute` 的执行。他拥有二十多年的行业经验，包括在一家十亿美元级的公司担任高管，并曾是一家大型执行服务公司的合伙人。他还是一个连续创业者，曾创立、运营并出售了多家与高科技相关的业务。他曾主持过受欢迎的广播节目
    `Technotrends`，该节目还通过美国航空的机上音频节目播放。作为十多本书和 400 多篇文章的作者或合著者，他曾出现在 CNN 上，并经常在行业会议上演讲。


    作为南加州大学 (`USC`) 前教授，他创立并领导了一个商业人工智能创新实验室。他被称为“AI 业内人士”，关于 AI 进展和趋势的著作被广泛阅读和引用。他此前曾在洛杉矶加分校
    (`UCLA`) 担任教职，并在其他主要大学担任访问教授。他被选为信息管理学会 (`SIM`) 的国际董事会成员，该学会是由全球 3000 多名科技高管组成的权威组织。


    他从事广泛的社区服务，包括担任国会科学技术委员会副主席的科学顾问。他曾在橙县科学工程博览会 (`OCSEF`) 董事会工作，并担任大奖评审，同样担任英特尔国际科学博览会
    (`ISEF`) 的评审。他曾担任计算机器协会 (`ACM`) 分会的副主席，这是一个由计算机科学家组成的权威组织。Eliot 博士曾担任 `USC Mark
    Stevens 创新中心` 创业路演的鲨池评委，并担任硅谷和硅谷海滩几家孵化器和加速器的导师。他曾在 `USC` 的多个董事会和委员会工作，包括担任南加州马歇尔校友会
    (`MAA`) 董事会。


    Eliot 博士拥有 `USC` 的博士学位、MBA 学位以及计算机学士学位，并获得了 `CDP`、`CCP`、`CSP`、`CDE` 和 `CISA` 认证。他出生并成长于南加州，并在国际旅行和生活，他喜欢潜水、冲浪和航海。


