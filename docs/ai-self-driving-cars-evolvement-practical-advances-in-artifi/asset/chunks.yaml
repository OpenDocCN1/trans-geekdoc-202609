- fmt: "\nAnd, even though I thought I could drive through the fog, those other idiot\
    \ drivers that do so without paying close attention to the road were the really\
    \ worrisome element. All it would take is some dolt to ram into me or opt to suddenly\
    \ jam on their brakes, and it could be a bad evening for us all.\n\nHere’s what\
    \ happened. My buddy in the front passenger seat offered to intently watch for\
    \ anything to my right. The two friends in the back seat were able to turnaround\
    \ and look out the back window. I suddenly had the power of six additional eyeballs,\
    \ all looking for any other traffic. They began each verbally reporting their\
    \ respective status. I don’t see anything, one said. Another one barked out that\
    \ a car was coming from my right and heading toward us. I turned my head and swerved\
    \ the car to avoid what might have been a collision.\n\nMeanwhile, both of the\
    \ friends in the backseat yelled out that a car was rapidly approaching toward\
    \ the rear of the car. They surmised that the driver had not seen our car in the\
    \ fog and was going to run right up into us. I hit the gas to accelerate forward,\
    \ doing so to gain a distance gap between me and the car from behind. I could\
    \ see that there wasn’t a car directly ahead of me and so leaping forward was\
    \ a reasonable gambit to avoid getting hit from behind.\n\nAll in all, we made\
    \ it to the basketball game without nary a nick. It was a bit alarming though\
    \ and a situation that I will always remember. There we were, working as a team,\
    \ with me as the driver at the wheel. I had to do some real sensor fusion. I was\
    \ receiving data from my own eyes, along with hearing from my buddies, and having\
    \ to mentally combine together what they were telling me with what I could actually\
    \ see.\n\nWhen you are driving a car, you often are doing `Multi-Target Tracking\
    \ (MTT)`. This involves identifying particular objects or “targets” that you are\
    \ trying to keep an eye on. While driving in downtown Los Angeles, my “targets”\
    \ included the many cars, bike rides, and pedestrians. While driving in the foggy\
    \ evening, we had cars coming from the right and from behind.\n\nYour `Field of\
    \ View (FOV)` is another vital aspect of driving a car and using your sensory\
    \ apparatus. During the fog, my own `FOV` was narrowed to what I could see on\
    \ the driver’s side of the car, and I could not see anything from behind the car.\
    \ Fortunately, my buddies provided additional `FOV`s. My front passenger was able\
    \ to augment my `FOV` by telling me what was seen to the right of the car. The\
    \ two in the backseat had a `FOV` of what was behind the car.\n\nThose two stories\
    \ that I’ve told are indicative of how we humans do our sensor fusion while driving\
    \ a car. As I earlier mentioned, we often don’t seemingly put any conscious thought\
    \ to the matter. By watching a teenage novice driver, you can at times observe\
    \ as they struggle to do sensor fusion. They are new to driving and trying to\
    \ cope with the myriad of details to be handled. It is a lot to process, such\
    \ as keeping your hands on the wheel, your feet on the pedals, your eyes on the\
    \ road, along with having to mentally process everything that is happening, all\
    \ at once, in real-time.\n\nIt can be overwhelming. Seasoned drivers are used\
    \ to it. But seasoned drivers can also find themselves in situations whereby sensor\
    \ fusion becomes an outright imperative and involves very deliberate attention\
    \ and thought. My fog story is somewhat akin to that kind of situation, similarly\
    \ my siren listening story is another example. \n\nIn the news recently there\
    \ has been the story about the `Boeing 737 MAX 8` airplane and in particular two\
    \ horrific deadly crashes. Some believe that the sensors on the plane were a significant\
    \ contributing factor to the crashes. Though the matters are still being investigated,\
    \ it is a potential example of the importance of `Multi-Sensor Data Fusion` and\
    \ has lessons that can be applied to driving a car and advanced automation used\
    \ to do so.\n\n## Multi-Sensor Data Fusion for AI Self-Driving Cars\n\n### What\
    \ does this have to do with AI self-driving cars?\n\nAt the `Cybernetic AI Self-Driving\
    \ Car Institute`, we are developing AI software for self-driving cars. One important\
    \ aspect involves the design, development, testing, and fielding of the `Multi-Sensor\
    \ Data Fusion`.\n\nAllow me to elaborate.\n\nI’d like to first clarify and introduce\
    \ the notion that there are varying levels of AI self-driving cars. The topmost\
    \ level is considered `Level 5`. A `Level 5` self-driving car is one that is being\
    \ driven by the AI and there is no human driver involved. For the design of `Level\
    \ 5` self-driving cars, the auto makers are even removing the gas pedal, brake\
    \ pedal, and steering wheel, since those are contraptions used by human drivers.\
    \ The `Level 5` self-driving car is not being driven by a human and nor is there\
    \ an expectation that a human driver will be present in the self-driving car.\
    \ It’s all on the shoulders of the AI to drive the car.\n\nFor self-driving cars\
    \ less than a `Level 5`, there must be a human driver present in the car. The\
    \ human driver is currently considered the responsible party for the acts of the\
    \ car. The AI and the human driver are co-sharing the driving task. In spite of\
    \ this co-sharing, the human is supposed to remain fully immersed into the driving\
    \ task and be ready at all times to perform the driving task. I’ve repeatedly\
    \ warned about the dangers of this co-sharing arrangement and predicted it will\
    \ produce many untoward results.\n\nLet’s focus herein on the true `Level 5` self-driving\
    \ car. Much of the comments apply to the less than `Level 5` self-driving cars\
    \ too, but the fully autonomous AI self-driving car will receive the most attention\
    \ in this discussion.\n\nHere’s the usual steps involved in the AI driving task:\n\
    \n*   Sensor data collection and interpretation\n*   Sensor fusion\n*   Virtual\
    \ world model\n*   AI action planning\n*   Car controls issuance\n\nAnother key\
    \ aspect of AI self-driving cars is that they will be driving on our roadways\
    \ in the midst of human driven cars. There are some pundits of AI self-driving\
    \ cars that continually refer to a utopian world in which there are only AI self-driving\
    \ cars. Currently there are about 250 million conventional cars in the United\
    \ States alone, and those cars are not going to magically disappear or become\
    \ true `Level 5` AI self-driving cars overnight.\n\nIndeed, the use of human driven\
    \ cars will last for many years, likely many decades, and the advent of AI self-driving\
    \ cars will occur while there are still human driven cars on the roads. This is\
    \ a crucial point since this means that the AI of self-driving cars needs to be\
    \ able to contend with not just other AI self-driving cars, but also contend human\
    \ driven cars. It is easy to envision a simplistic and rather unrealistic world\
    \ in which all AI self-driving cars are politely interacting with each other and\
    \ being civil about roadway interactions. That's not what is going to be happening\
    \ for the foreseeable future. AI self-driving cars and human driven cars will\
    \ need to be able to cope with each other.\n\nReturning to the topic of `Multi-Sensor\
    \ Data Fusion`, let’s walk through some of the key essentials of how AI self-driving\
    \ cars undertake such efforts.\n\nTake a look at Figure 1.\n\n![](images/00008.jpeg)\n\
    \nI’ve shown my overall framework about AI self-driving cars and highlighted the\
    \ sensor fusion stage of processing.\n\nPer my earlier remarks about the crucial\
    \ nature of sensor fusion, consider that if the sensor fusion goes awry, it means\
    \ that the stages downstream are going to be either needed information or be using\
    \ misleading information. The virtual world model won’t be reflective of the real-world\
    \ surrounding the self-driving car. The AI action planning stage will not be able\
    \ to make appropriate determinations about what the AI self-driving car actions\
    \ should be.\n\nOne of the major challenges for sensor fusion involves dealing\
    \ with how to collectively stich together the multitude of sensory data being\
    \ collected.\n"
