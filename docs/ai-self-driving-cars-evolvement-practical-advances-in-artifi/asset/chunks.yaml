    `Sensor X` 显示物体在 `FOV` 中。`Sensor Z` 则说在相同的 `FOV` 交叉区域内没有该物体。糟糕！这可能是 `sensor X`
    是正确的，而 `sensor Z` 是错误的。也许是 `sensor Z` 故障了、被遮挡了，或者遇到了其他某种困难。另一方面，也可能是 `sensor X`
    是错误的，即那里并没有物体，而传感器 `X` 产生了误报，报告了某种“幻影”之类——某种并不真实存在的东西，而 `sensor Z` 准确地报告了那里什么也没有。


    这里有多种方法可以尝试调和这些看似相互矛盾的报告。我很快就会介绍这些方法。


    ### 集成 (Integrate)


    假设我们有两个物体。其中一个物体在 `sensor X` 的 `FOV` 内。另一个在 `sensor Z` 的 `FOV` 内。`sensor X` 无法检测到
    `sensor Z` 检测到的物体，这是合理的，因为该物体确实不在 `sensor X` 的 `FOV` 内。`sensor Z` 也无法直接检测到 `sensor
    X` 检测到的物体，这同样是合理的，因为该物体不在 `sensor Z` 的 `FOV` 内。


    一切都很正常，因为 `sensor X` 和 `sensor Z` 都在按照预期工作。我们想要做的是将 `sensor X` 和 `sensor Z` 的报告整合在一起，它们各自在各自的
    `FOV` 中发现了物体。可能是 `sensor Z` `FOV` 内的物体正朝 `sensor X` 的 `FOV` 驶来，因此可能通知 `sensor
    X` 注意该物体。同样，对于 `sensor X` 目前检测到的物体也可以告知 `sensor Z`。我之前关于在雾中开车的故事就是一个类似的例子，即将我的乘客和坐在后座的人所看到的数据整合到我自己的驾驶场景中。


    ### 综合 (Synthesize)


    在这类同化感官数据的方法中，你可能会遇到这样的情况：`sensor X` 和 `sensor Z` 在它们各自的 `FOV` 内都没有物体。在这种情况下，假设是两者都不知道该物体的存在。


    在雾中驾驶的案例中，假设有一位骑车者在我的盲区，由于大雾的影响，我的两个哥们儿都没有看到那名骑车者。我们没有人知道那个骑车者就在附近。我们对那名骑车者都是盲目的。然而，在自动驾驶汽车上（这表明
    AI 规划器的传感器 `FOV` 有时会出现其并不会察觉的空隙），你有时有机会通过对 `FOV` 内物体的已知信息进行插值，来推测那些不在传感器 `FOV`
    内的物体。这被称为综合（synthesis）或综合传感器融合。记得我提到过当我听到警报声时，看到其他汽车在靠边吗？我没有看到那辆紧急车辆，幸运的是我有关于该车辆的线索，因为我能听见它。在你的
    `FOV` 内，发生了一些事情为你提供了关于 `FOV` 之外事物的线索。你能够综合你所知的，并用它来预测你所不知道的。如果周围的汽车都在靠边，这暗示有一辆紧急车辆驶来，这是一个合理的猜测。这可能意味着火星外星人降临了，而你因为只盯着其他车而没有注意到，但我怀疑那些外星生物降临这里的可能性。所以，你可以利用传感器数据尝试间接判断你范围之外的
    `FOV` 内可能正在发生什么。考虑到这是一个实时系统，且自动驾驶汽车正在行驶中，可能在片刻之后，你猜测的在范围 `FOV` 之外的东西就会进入你的 `FOV`
    范围，希望你已经做好了准备，就像我对那辆擦肩而过的救护车一样。


    ### 多传感器融合的投票方法 (Voting Methods of Multi-Sensor Fusion)


    当你有多个传感器并希望以某种凝聚的方式汇总各自的报告时，有多种方法可以使用。再次查看图 1。我将简要每种投票方法。


    #### 绝对排名法 (Absolute Ranking Method)


    在这种方法中，你预先决定传感器的排名。你可能会宣布摄像头的排名高于雷达。你可能决定雷达的排名高于激光，以此此类推。在传感器融合期间，子系统将使用该预定义的排名。


    例如，假设你进入了调和的情况，比如我之前描述的实例：`sensor X` 在其 `FOV` 内检测到一个物体，但交叉 `FOV` 中的 `sensor Z`
    并没有检测到。如果 `sensor X` 是相机而 `sensor Z` 是激光，你可能简单地使用预定义的排名，算法会假设由于相机排名较高，因此 `sensor
    Z` 未检测到该物体是“没问题”的。


    这种方法存在权衡。它倾向于快速、易于实现且简单。然而，它倾向于进行我警告过的那种对整体不利的“丢弃”行为。


    #### 情况排名法 (Circumstances Ranking Method)


    这与绝对排名法类似，但不同之处在于排名根据当前情况而改变。例如，我们可能会设定：如果是下雨天气，相机就不是老大了，而是雷达获得最高排名，因为它受雨水不利影响的可能性较小。


    这种方法也有权衡。它倾向于相对快速、易于实现且简单。然而，它再次倾向于进行我警告过的那种对整体不利的“丢弃”行为。


    #### 等权投票/共识法 (Equal Votes / Consensus Method)


    在这种方法中，你允许每个传感器进行投票。它们在投票能力上被认为是平等的。然后你使用计数算法进行共识投票。如果某些比例的传感器对某个物体达成一致，而另一些没有，你允许通过共识决定
    AI 系统应该相信什么。与其他方法一样，这种方法存在权衡。


    #### 加权投票/预定义 (Weighted Voting / Predetermined)


    这种方法与等权投票法相似，但它增加了一个转折，即假设某些投票者比其他投票者更重要。我们可能认为相机比雷达更可靠，因此给相机更高的权重。以此此类推。与其他方法一样，这种方法存在权衡。


    #### 概率投票 (Probabilities Voting)


    你可以将概率的使用引入传感器报告中。传感器有多大把握？它可能有自己的控制子系统可以确定传感器是否获取了真实的读取，或者无法获取。然后将概率整合到多传感器投票方法中。与其他方法一样，这种方法存在权衡。


    #### 辩论法 (Arguing / Your Case Method)


    一种新颖的方法是让每个传感器为为什么其报告是合适的进行辩论。这是一个有趣的想法。我们需要观察这是否能证明其价值足以值得积极使用。研究和实验正在进行中。与其他方法一样，这种方法存在权衡。


    #### 先到法 (First-to-Arrive Method)


