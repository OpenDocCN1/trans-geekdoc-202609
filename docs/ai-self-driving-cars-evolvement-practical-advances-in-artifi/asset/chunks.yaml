  trans: '


    然而，这样做仅仅导致了其他汽车决定挤进我和前方的车辆之间。我们这里高速公路上的不成文是一个弱肉强食的世界，任何可用的间隙都会立即被视为可以供侵入的空间。事实上，这里的某些司机坚信，他们通过挤压交通为我们所有人人都尽了巨大的贡献。在他们看来，车辆之间任何未被使用的间隙都是难看的浪费空间，只会加剧高速公路上的交通困扰。


    当其他车辆进入我的车道时，有些似乎注意到了那些杆子，而另一些则没有。我看到一辆车开始进入我的车道，随后发现杆子伸了出来，司机便退回了原来的车道。另一辆车——是一辆离地面较近的小型跑车——平稳地穿过了杆子下方，此时变换车道的司机正利用我的车道切到右侧的下一条车道。这是跑车驾驶者的典型动作。既然可以像
    NASCAR 赛车那样进行多车道的快速切换，为什么要一次只换一条车道呢？


    最后，那个炫耀着杆子的司机决定他们快要到出口了，开始向出口车道移动。当司机每次变换车道时，他们似乎误判了安全所需的距离。我怀疑该司机在计算车辆额外长度时，并没有把伸出的杆子的长度也算进去。这个司机不仅没有标记这些杆子，似乎还不在意这些杆子如何改变驾驶任务的动态。令人遗憾，但并不令人意外。


    ### 汽车尺寸的熟悉程度


    我们大多数人可能不会太考虑汽车的整体尺寸，至少在主观上并不如此。一旦你习惯了汽车的尺寸或规格，你基本上对它了如指掌。如果你每天都开同一辆车，你几乎可以感觉到汽车的外边缘。你会直能地知道是否能通过那个狭弯，或者能否将车挤进你看中的那个停车位。


    相比之下，当你租车时，假设它和你平时开的车品牌和型号不同，可能需要几几分钟才能适应汽车的尺寸。


    我记得有一次露营租了一辆大型 SUV，起初很难感觉到汽车的四个角在哪里。我把它停在房子前面，突然发现这辆 SUV 伸出了我平时停普通车的位置之外。等我去商场买东西时，商店附近出现了一个停车位，但当我缓慢将车挪入车位时，我意识到试图把这头巨兽停进一个紧凑型停车位并不是个好主意。


    问你一个简单的问题。花点时间在脑海中想象一下你平时开的那辆车。车的长度是多少？宽度是多少？大多数人无法立刻用英尺或英寸说出长度和宽度是多少。他们只是“知道”自己的车有多大。他们在开车时能感觉到它。当你尝试平行停车时，你通常会敏锐地察觉到尺寸，因为你正试图把它挤进一个往往恰好能容下它的位置。


    你的车的高度呢？大多数人并不确定自己汽车的精确高度。他们可以猜。他们通常也能辨别自己的汽车是否能够通过道路标志牌或桥梁。不过，当你通过速餐店，且那里贴着警告高度限制的标志牌时，这是可以测试的。我见过一些司机小心翼翼向前挪，不确定车顶是否会撞到东西，特别是如果他们的车顶安装了雪板架或冲浪板架。


    ### 金发女孩类比


    在估算某物的尺寸方面，我想起了孩子很小时的一件趣事。我们去了一家陶瓷店，那里允许我们购买各种陶瓷制品并在店里为它们上绘画。这是一项有趣的活动。画完物品后，你把它们留在店里一天左右，让店里进行固化，然后我们再来取回现在亮晶晶的彩绘陶瓷制品。


    在画完物品几天后回到店里，那里有一个陶瓷兔子和一个陶瓷蛋（为了复活节准备的！），我们带着极大的喜悦和自豪看着它们。它们看起来极极了，就像专业人士画过的一样。我让孩子们去店的另一侧拿两个纸箱，这样我们就能把每个陶瓷制品放进盒子里安全地运送。


    其中一个孩子带回的盒子太小了，兔子和蛋都放不下。另一个孩子带回的盒子很大，在搬运盒子时可能会无意中让兔子或蛋在里面滚动并可能损坏。我指出了这些差异，并礼貌地要求他们找一个更合适的盒子。你可能会称之为“金发女孩尺寸”的盒子，既不小，也不过大。


    他们很快就做到了。然后我们把兔子和蛋分别放入它们各自的子里。这是一次成功的尝试，直到今天它依然陈列在我的壁炉架，特别是在复活节期间，将这些物品展示出来，作为制作它们时投入的爱与快乐的象征。


    ### 虚拟容器


    陶瓷复活节蛋和兔子与高速公路上带着伸出杆子的汽车有什么关系呢？好问题，答案如下：判断完全容纳一个复活节蛋或兔子的盒子尺寸，就像在想象一种可能环绕你汽车尺寸的虚拟盒子。


    我想让你再次思考一下你平时开的那辆车。这次，不要尝试说出尺寸，而是尝试想象一个可以装下你汽车的盒子。当我说“盒子”这个词时，我想你可以更多地看作是一个容器，比如集装箱。如果我们把你的车运到某处，你需要什么尺寸的容器（或盒子）？


    你可以大胆猜测并选择一个比汽车大倍的容器或盒子。在这种情况下，你确定汽车能放进去。但是，假设我告诉你容器或盒子的尺寸增加会有额外成本。因此，目标越高，成本越高。


    我很确定你会调整猜测，目标一个较小的容器或盒子。如果容器或盒子太小了呢？那就不行，因为你需要确保汽车的每一寸都能进入容器或盒子。你不能让任何部分超出容器或盒子。理想情况下，你希望容器或盒子恰好合适，确保汽车的所有方面都包含在内，而不是大得多，因为尺寸增加的额外成本是你试图避免的。


    '
- fmt: '

    The easiest way to imagine the container would be to assume it is going to be
    a cuboid shape. Admittedly, this might not be a very efficient container depending
    upon the shape of your car. If we used some other shape, either a regular one
    like a sphere or pyramid, maybe it would be a better fit. Or, if we could create
    the entire design of the container on our own, we might shape it in an irregular
    fashion, curving it here and there to make it fit in a skintight way with your
    car.


    When trying to place your car into a container of some kind, let’s refer to this
    as the Bounded Volume (BV). I want to have you help me put your car into a container,
    which will consist of some amount of volume, and will be bounded by the shape
    that we use.


    The BV could be a regular shape and a relatively simplistic cube or cuboid. Or,
    you might conceive of another less usual shape, such as a cone or pyramid, or
    you might fashion a rather irregular shape that conforms in some other tighter
    manner to your car.


    ## What does this have to do with AI self-driving cars?


    At the Cybernetic AI Self-Driving Car Institute, we are developing AI software
    for self-driving cars. One of the intriguing aspects about AI self-driving cars,
    and an aspect often not much discussed, involves the need for the AI to be able
    to detect objects and essentially craft a Bounded Volume (a virtual container)
    around those detected objects. This is a key effort to the rest of the AI driving
    system and especially the virtual world modelling aspects.


    Allow me to elaborate.


    I’d like to first clarify and introduce the notion that there are varying levels
    of AI self-driving cars. The topmost level is considered Level 5. A Level 5 self-driving
    car is one that is being driven by the AI and there is no human driver involved.
    For the design of Level 5 self-driving cars, the auto makers are even removing
    the gas pedal, brake pedal, and steering wheel, since those are contraptions used
    by human drivers. The Level 5 self-driving car is not being driven by a human
    and nor is there an expectation that a human driver will be present in the self-driving
    car. It’s all on the shoulders of the AI to drive the car.


    For self-driving cars less than a Level 5, there must be a human driver present
    in the car. The human driver is currently considered the responsible party for
    the acts of the car. The AI and the human driver are co-sharing the driving task.
    In spite of this co-sharing, the human is supposed to remain fully immersed into
    the driving task and be ready at all times to perform the driving task. I’ve repeatedly
    warned about the dangers of this co-sharing arrangement and predicted it will
    produce many untoward results.


    Let’s focus herein on the true Level 5 self-driving car. Much of the comments
    apply to the less than Level 5 self-driving cars too, but the fully autonomous
    AI self-driving car will receive the most attention in this discussion.


    Here’s the usual steps involved in the AI driving task:


    * Sensor data collection and interpretation

    * Sensor fusion

    * Virtual world model updating

    * AI action planning

    * Car controls command issuance


    Another key aspect of AI self-driving cars is that they will be driving on our
    roadways in the midst of human driven cars too. There are some pundits of AI self-driving
    cars that continually refer to a utopian world in which there are only AI self-driving
    cars on the public roads. Currently there are about 250+ million conventional
    cars in the United States alone, and those cars are not going to magically disappear
    or become true Level 5 AI self-driving cars overnight.


    Indeed, the use of human driven cars will last for many years, likely many decades,
    and the advent of AI self-driving cars will occur while there are still human
    driven cars on the roads. This is a crucial point since this means that the AI
    of self-driving cars needs to be able to contend with not just other AI self-driving
    cars, but also contend with human driven cars.


    It is easy to envision a simplistic and rather unrealistic world in which all
    AI self-driving cars are politely interacting with each other and being civil
    about roadway interactions. That’s not what is going to be happening for the foreseeable
    future. AI self-driving cars and human driven cars will need to be able to cope
    with each other.


    ## The Importance of Bounded Volume


    Returning to the topic of the Bounded Volume, let’s consider why this is such
    an important matter to the AI self-driving car.


    The AI system of the self-driving car is going to have various sensory devices,
    including cameras, radar, ultrasonic, LIDAR, and so on. We’ll focus on the cameras
    for the moment.


    While the AI self-driving car is driving around, the cameras are capturing visual
    images of what is surrounding the self-driving car. These images are streaming
    into the cameras. On-board the self-driving car, there are computer processors
    that are tasked with analyzing those images. The image processing is looking to
    see if there are any street signs, and whether there are any nearby pedestrians,
    and whether there are cars nearby, etc. This has to happen in real-time. Time
    is crucial.


    The image processing doesn’t have the luxury of acting in a lackadaisical manner.
    When a car is moving along on the freeway at 65 miles per hour, and other cars
    are whizzing past at the same or faster speeds, there is not much time to spare
    when ascertaining the traffic situation. It is incumbent upon the image processing
    to as quickly as possible parse the images and identify what is happening.


    A human driver takes for granted that they can see their surroundings. They usually
    don’t put much thought into this aspect since it seems obvious and expected. Of
    course I can see that pedestrian across the street. Of course I can see that speed
    limit sign. But, if I add heavy fog into the situation, the human driver will
    be reminded of how difficult it can be to sometimes see your surroundings.

    '
