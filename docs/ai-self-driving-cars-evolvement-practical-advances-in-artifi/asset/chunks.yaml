  trans: '

    一些 AI 开发者可能会说，在一个全 AI 自动驾驶汽车的世界里，检测微动作将无关紧要，因为 AI 自动驾驶汽车可能都会通过 `V2V`（车车通信）进行电子化互联。如此，在我那个在红灯前并转弯的例子中，如果我坐在一辆
    AI 自动驾驶汽车里，它在理论上会向我后面那辆急切的 AI 自动驾驶汽车发送信息，并警告它我的 AI 自动驾驶汽车可能会选择冲出去，但随后又可能会刹车，这一切都是为了试图判断交通状况。


    是的，希望在 AI 自动驾驶汽车的世界里，我们会看到这种 `V2V` 的发生，但与此同时，我们都生活在现实世界中。正如我之前指出的，在未来的很长一段时间内，我们将面临人类驾驶汽车与
    AI 自动驾驶汽车并存的情况。而且可能会持续很长时间。


    我们现在不能决定不具备与人类驾驶员应对的能力。假装一旦我们进入全 AI 自动驾驶汽车的世界（如果我们真的能进入的话），一切都会好起来，那是生活在梦幻世界。AI
    自动驾驶汽车必须现实，并处理一个由人类驾驶汽车组成的世界。


    ### 微动作的重要性


    如果你观察今天在我们的道路上测试的许多 AI 自动驾驶汽车，你经常会发现它们并没有利用微动作来增强优势。AI 驾驶那种生硬的本质揭示了 AI 并不擅长检测、分析和利用人类驾驶员做出微动作时表现出的“破绽”（tell）。在某种意义上，这类似于一个尚未学会如何“读懂”其他汽车和其他驾驶员驾驶行为的青少年新手司机。


    现在，有一些 AI 开发者声称，他们担心如果他们真的包含了对人类驾驶员微动作的检测和利用，AI 可能会因此陷入困惑或做出糟糕的决策。


    ### 实现中的挑战


    嗯，这实际上更多取决于这项功能的 AI 开发执行得好还是坏。当然，如果你在尝试利用微动作检测时只做了半吊子的工作，那么你的 AI 自动驾驶汽车表现可能确实比你按正确方法做要差。在我看来，对于你可能选择纳入
    AI 系统的任何功能，这似乎都是事实。组装不当的能力可能会成为负担和问题，而不是辅助和解决方案。


    我并没有说添加这项功能会很容易。事实上，我会直言不讳地表示它是困难的。


    试图使用 AI 自动驾驶汽车的传感器来检测前方汽车的轮子略微倾斜是不容易的，你需要非常好的传感器和非常出色的传感器处理软件。检测几乎任何典型的微动作的发生也是如此。从定义上说，这些动作是细微的。捕捉其他汽车的信号或破绽对其他人类驾驶员来说很困难，诚然，对
    AI 系统来说也很困难。


    ### 利用机器学习和深度学习


    幸运的是，你可以利用`机器学习`（Machine Learning）和`深度学习`（Deep Learning）来获得优势。通过收集海量的驾驶相关数据，基于人类驾驶汽车在常规人类交通中的行驶情况，训练深层或大规模多层人工神经网络，可以训练出针对微动作驾驶的特定模式。


    这些预先训练好的`机器学习`和`深度学习`算法随后可以包含在自动驾驶汽车的车载 AI 系统中。在许多方面，这实际上是那些能力的深层形式。很有可能，`机器学习`和`深度学习`
    已经被用于分析传感器数据，以检查路标、行人的存在等等方面。微动作本质上是这种分析的更深的一层。


    ### 技术限制


    正如前面提到的，有些困难在于关于 AI 能够处理微动作是否具有足够的视觉检测。摄像头能提供足够的检测吗？雷达能提供足够的检测吗？激光雷达（LIDAR）能提供足够的检测吗？此外，即使你获取了传感器数据，如果
    AI 规划器忽略了微动作，整个努力就白费了。

