    \ then encompassed into the voting method of the multiple sensors.\n\nLike the\
    \ other methods, there are tradeoffs in doing things this way.\n\n*   Arguing\
    \ (Your Case) Method\n\nA novel approach involves having each of the sensors argue\
    \ for why their reporting is the appropriate one to use. It’s an intriguing notion.\
    \ We’ll have to see whether this can demonstrate sufficient value to warrant being\
    \ used actively. Research and experimentation are ongoing.\n\nLike the other methods,\
    \ there are tradeoffs in doing things this way.\n\n*   First-to-Arrive Method"
