- fmt: '

    Recall that the Boeing 737 MAX 8 is a retrofit of prior designs of the Boeing
    737. Some have suggested that the “problem” being solved by the `MCAS` is a problem
    that should never have existed at all, namely that rather than creating an issue
    by adding the more powerful engines and putting them further forward and higher,
    perhaps the plane ought to have been redesigned entirely anew. Those that make
    this suggestion are then assuming that the stall prevention capability of the
    `MCAS` would not have been needed, which then would have not been built into the
    planes, which then would never have led to a human pilot essentially co-sharing
    and battling with it to fly the plane.


    Don’t know. Might there have been a need for an `MCAS` anyway? In any case, let’s
    not get mired in that aspect about the Boeing 737 MAX 8 herein.


    Instead, think about AI systems and the question of whether to retrofit an existing
    AI system or start anew.


    You might be tempted to believe that AI self-driving cars are so new that they
    are entirely a new design anyway. This is not quite correct. There are some AI
    self-driving car efforts that have built upon prior designs and are continually
    “retrofitting” a prior design, doing so by extending, enhancing, and otherwise
    leveraging the prior foundation.


    This makes sense in that starting from scratch is going to be quite an endeavor.
    If you have something that already seems to work, and if you can adjust it to
    make it better, you would likely be able to do so at a lower cost and at a faster
    pace of development.


    One consideration is whether the prior design might have issues that you are not
    aware of and are perhaps carrying those into the retrofitted version. That’s not
    good.


    Another consideration is whether the effort to retrofit requires changes that
    introduce new problems that were not previously in the prior design. This emphasizes
    that the retrofit changes are not necessarily always of an upbeat nature. You
    can make alterations that lead to new issues, which then require you to presumably
    craft new solutions, and those new solutions are “new” and therefore not already
    well-tested via prior designs.


    I routinely forewarn AI self-driving car auto makers and tech firms to be cautious
    as they continue to build upon prior designs. It is not necessarily pain free.


    ## Key Point #2: Single sensor versus multiple sensors reliance


    For the Boeing 737 MAX 8, I’ve mentioned that there are the `AOA` (Angle of Attack)
    sensors and they play a crucial role in the `MCAS` system. It’s not entirely clear
    whether there is just one `AOA` or two of the `AOA` sensors involved in the matter,
    but in any case, it seems like the `AOA` is the only type of sensor involved for
    that particular purpose, though presumably there must be other sensors such as
    registering the height and speed of the plane that are encompassed by the data
    feed going into the `MCAS`.


    Let’s though assume for the moment that the `AOA` is the only sensor for what
    it does on the plane, namely ascertaining the angle of attack of the plane. Go
    with me on this assumption, though I don’t know for sure if it is true.


    The reason I bring up this aspect is that if you have an advanced system that
    is dependent upon only one kind of sensor to provide a crucial indication of the
    physical aspects of the system, you might be painting yourself into an uncomfortable
    corner. In the case of AI self-driving cars, suppose that we used only cameras
    for detecting the surroundings of the self-driving car. It means that the rest
    of the AI self-driving car system is solely dependent upon whether the cameras
    are working properly and whether the vision processing systems is working correctly.


    If we add to the AI self-driving car another capability, such as radar sensors,
    we now have a means to double-check the cameras. We could add another capability
    such as `LIDAR`, and we’d have a triple check involved. We could add ultrasonic
    sensors too. And so on.


    Now, we must realize that the more sensors you add, the more the cost goes up,
    along with the complexity of the system rising too.


    For each added sensor type, you need to craft an entire capability around it,
    including where to position the sensors, how to connect them into the rest of
    the system, and having the software that can collect the sensor data and interpret
    it. There is added weight to the self-driving car, there is added power consumption
    being consumed, there is more heat generated by the sensors, etc. Also, the amount
    of computer processing required goes up, including the number of processors, the
    memory needed, and the like.


    You cannot just start including more sensors because you think it will be handy
    to have them on the self-driving car. Each added sensor added involves a `ROI`
    (Return on Investment) involved.

