  trans: "\n\n对于任何选择将本书用于教学目的读者，请参阅我在附录中关于如何使用的建议。我发现这些材料在我教过的课程中非常实用，其他其他教职员工也告诉我，他们发现这些材料很有用，在某些情况下作为扩展阅读材料，在另一些情况下作为其课程的核心部分（取决于课程的性质）。\n\
    \n在本书的写作中，我努力仔细地结合了实务者和学术人员的写作风格。它不像典型的学术期刊文章那样密集，但同时通过深入探讨各种实践的细微差别和权衡，提供了深度。\n\
    \n“deep（深入）”一词在今天非常流行，意味着深入研究某个学科或主题；“unpack（解析/拆解）”一词同样流行，意味着梳理出一个学科或主题的底层特征。我力求提供通过相对深入的探讨来解决某个问题或主题的内容，并确保其得到了充分的拆解。\n\
    \n最后，在任何关于人工智能（AI）的书中，很难在使用我们的日常词汇而不避免其中某些词汇被误解。具体来说，很容易对 AI 进行拟人化。当我说一个 AI 系统“知道（knows）”某事时，我并不希望你理解为该\
    \ AI 系统具有感知，并以与人类相同的方式“知道”。它们目前还没有那样。我尝试偶尔对这类词汇加引号，以强调我所使用的词汇不应被误解为将我们今天所知的 AI\
    \ 系统赋予了真实的人类智能。如果我对所有此类词汇都加引号，这本书将变得非常难读，因此我是在审慎地这样做。请在阅读这些材料时记住这一点，谢谢。 \n\n#\
