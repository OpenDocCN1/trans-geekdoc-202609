    In this case, it might not seem logical that the bike rider would want to swerve
    toward the car that’s ahead. Dumb move! We don’t know that this really is a dumb
    move, since there might be something else happening related to the bike rider.
    Suppose a pedestrian holding a dog on a leash has accidently let the dog go, and
    the dog is rushing onto the street. The bike rider, seeing the rushing dog, decides
    to try and swerve to the left of the dog, not perhaps realizing that the car adjacent
    to them is stopping and might opt to swerve into the bike lane.


    In the virtual world model, did the AI system have the pedestrian modeled and
    the dog modeled? Maybe the image processing could not detect those objects, perhaps
    the pedestrian and dog were obscured by some other objects like a light pole.
    In that case, the AI action planner is “blind” to the notion that a pedestrian
    is standing there with a dog and that the dog has gotten loose.


    Notice that this brings up numerous facets about the `Bounded Volumes` and the
    virtual world model.


    If there is not a representation in the virtual model of real-world objects because
    those real-world objects were not detected by the image processing, it means that
    the AI system is having to cope with a virtual world that is not an accurate depiction
    of the real-world. The AI action planner can end-up making life-or-death driving
    decisions based on this omitted information, perhaps leading to a calamity.


    Suppose the image processing wasn’t sure what the clump was near the corner and
    it consisted of the human walking the dog, which could be detected on the other
    side of a light pole, and the image processing could discern that something was
    there, a kind of unidentifiable blob. The image processing might not be able to
    classify it, but at least it could tag in the virtual world model that there’s
    an object there, along with imputing a `Bounded Volume` that encapsulates the
    blob.


    Once the dog gets loose, this would hopefully be detected by the cameras, and
    the image processing might now be able to discern that there is a pedestrian there
    and a dog there, two separate objects, and had been the overall blob that had
    earlier been posted at that location. The virtual world model would then be updated
    accordingly.


    Why does it matter that the dog is now a `Bounded Volume` of its own? A dog as
    a classification means that you can predict various aspects of its behavior. A
    dog can move in certain ways at certain speeds. A human can move in certain ways
    at certain speeds. The classification of an object helps to anticipate what the
    object might do. It aids the AI action planner in deciding upon the action to
    be taken.


    Let’s pretend for a moment that the dog is instead a skateboard that the pedestrian
    has let loose and is rolling into the street. I say this because of what I am
    about to suggest. If the AI action planner has to calculate what might need to
    be hit in order to save the life of the bike rider, I think we’d all agree that
    hitting the skateboard would be preferable. This highlights the kind of ethical
    choices that the AI system needs to make, doing so in real-time.


    The `Bounded Volume` that you craft to represent an object needs to be large enough
    to accommodate the overall object and yet not so large that it unnecessarily inflates
    the size of the actual object. In the case of trying to squeeze between the bike
    rider and the car ahead of the self-driving car, if the `BV` for the bike rider
    is overly large it might deny the possibility of fitting between the bike rider
    and the car ahead, even though in reality it might have been feasible.


    On the other hand, if the `BV` is overly skintight, it is possible that a miscalculation
    could occur of striking the real-world object by having gotten too close to it.
    This goes back to the earlier point about arriving at a Goldilocks size for the
    `BV` in terms of representing the real-world object.


    One of the most essential aspects of the virtual world model involves discerning
    whether there is going to be an intersecting of two or more `Bounded Volumes`.
    For example, if the `Bounded Volume` or virtual container representing the self-driving
    car is going to intersect with the `Bounded Volume` or virtual container of the
    bike rider, this needs to be anticipated and dealt with by the AI action planner.


    If two or more `Bounded Volumes` are anticipated to intersect, the possibility
    of a collision arises. I’ll use the word collision to refer to a circumstance
    of two objects that actually brush against each other or ram into each other,
    physically doing so. When I use the word intersecting, it means that there is
    the potential for an actual collision, though it is not necessarily a collision
    per se. This depends upon the amount of inflated size that we have for the `Bounded
    Volumes` involved.


    Suppose the bike rider is represented by a `BV` that is twice the actual size
    of the bike rider. This implies a kind of virtual buffer or cushion, allowing
    for wiggle room of the real-world object within the imaginary container that we’ve
    concocted.


    A self-driving car entering into the `Bounded Volume` of the bike rider might
    not actually hit the bike rider, since there’s that extra space within the virtual
    container. In a sense, the inflated size of the `BV` can provide a margin of error
    into which another `BV` can wander and yet not actually touch the real-world object
    therein.


    I’m sure that you likely think about your own car in the same way. You are apt
    to have a sense that there is an outer boundary of a few inches beyond the actual
    size of your car. When you try to park your car into a rather confining parking
    spot, you are subliminally aware that you have a little bit of a cushion of space.
    As you get closer and closer to another parked car, you begin to sweat about whether
    you are undermining that cushion and getting so close that you’ll rub against
    or scratch the other car.


    This also brings up the earlier topic about overhanging or protruding aspects
    of your car.


    If you have an antenna on your car that goes upward a few feet, above the roof
    height of your car, you often tend to ignore the antenna as being part of a kind
    of `Bounded Volume`, under the belief that if the antenna hits something it will
    just do so lightly and spring back. On the other hand, your side mirrors typically
    have to be included in your sense of a `Bounded Volume` due to their possibility
    of breaking off or damaging another car if you rub against the side mirrors while
    parking your car (many cars today have rejiggered the side mirrors to pivot inward
    when touched, allowing some flexibility in their positioning).


    Remember too my story of the car that had poles dangling from the rooftop of the
    car. What do you think the `Bounded Volume` of that car should be? You could make
    the `Bounded Volume` consist of the car only and not include the added aspect
    of the dangling poles, but this means that the AI self-driving car might not calculate
    the possibilities of hitting those dangling poles. If you make the `Bounded Volume`
    to include the dangling poles, the overall size of the `BV` is larger and might
    preclude the AI from realizing that it might be able to fit underneath those poles,
    which recall that the sports car in my story was able to do so.


    Along those lines, the other aspect is whether the `Bounded Volume` is a regular
    shape such as a cube or cuboid, or whether you want to have it be an irregular
    shape. By using an irregular shape, you could potentially encompass the car that
    has the dangling poles and then also encompass the dangling poles, but not have
    one overarching cube or cuboid that tries to do so. The shape would be tailored
    to the contours of the actual object.

