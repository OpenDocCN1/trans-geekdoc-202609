    \ Eliot 博士\n27. 《自动驾驶汽车的演进》——Lance Eliot 博士\n\n这些书籍在亚马逊上有售。\n\n## 第一章：自动驾驶汽车的框架\n\
    \n这一章是核心部分，一旦你读完这一章，就准备好阅读后续内容了。在控制论自动驾驶汽车学院，我们使用该框架来跟踪我们正在的工作，以及我们如何实现 L5 自动驾驶汽车。\n\
    \n当我介绍框架时，我发现通过图表来说明其意图非常有帮助。框架需要足够简单以传达元素，同时又不至于简单到掩盖了真实的复杂性。图中的元素经过了编号以便参考。每个元素都至关重要。对于某些自动驾驶汽车，某个元素可能更重要，或者与其他元素有所不同。我将逐一描述每个元素。随后将讨论它们如何相互作用。\n\
    \n### D01：传感器捕获\n\n让我们从关于自动驾驶汽车媒体中最受关注的元素开始，即自动驾驶汽车的传感器设备。\n\n在框架中，标记为 `D01` 的框表示“传感器捕获（Sensor\
    \ Capture）”，指的是自动驾驶汽车从各种传感器收集数据的过程。通常涉及的设备类型包括单目、双目摄像头、`LIDAR`、雷达系统、声波设备、`GPS`、`IMU`\
    \ 等。\n\n这些设备负责获取有关自动驾驶汽车及其周围环境的数据。某些设备持续提供更新，而其他设备则等待自动驾驶汽车的信号以收集数据。数据可能会先由设备本身以某种方式进行转换，或者直接作为原始数据馈到传感器捕获。\n\
    \n### D02：传感器融合\n\n想象一下，你的眼睛接收视觉图像，鼻子接收气味，耳朵接收声音，本质上你的每种不同感官设备都在接收某种形式的输入。输入符合设备的性质。同样，对于自动驾驶汽车，摄像头提供视觉图像，雷达返回雷达反射，以此此类推。每个设备提供的数据都符合其功能。\n\
    \n"
