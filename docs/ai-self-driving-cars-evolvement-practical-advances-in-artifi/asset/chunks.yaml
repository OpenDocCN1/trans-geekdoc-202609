- fmt: "\nThis happens a lot in parking lots. When cars are driving around and around\
    \ trying to find a parking spot, it can become a gamesmanship effort of who suggests\
    \ they found an open spot first. You’ve likely seen two cars that came open an\
    \ open spot, and the cars are facing each other head-to-head. Which one will get\
    \ the spot? If one driver angles their wheels, it can be a kind of assertion that\
    \ they have tagged the spot and are going to aggressively make their way into\
    \ the spot.\n\nThis can at times create more problems than it solves.\n\nSuppose\
    \ you have two cars facing each other, trying to vie for a parking spot, and each\
    \ makes a wheel angling micro-movement. Is this a tie game? Will one driver take\
    \ Umbridge that the other driver appears to be claiming the spot?\n\nWe also need\
    \ to consider the clueless driver that doesn’t even notice the other car is angling\
    \ its wheels.\n\nOr, you can also have the driver that sees the micro-movement\
    \ and opts to ignore it, acting as though they didn’t notice it, so they can appear\
    \ to be blissfully ignorant as they take the spot (and later claim they didn’t\
    \ realize the other car was trying to go for it). That’s a sly move.\n\nBesides\
    \ teenage novice drivers showcasing micro-movements, there’s another kind of driver\
    \ that can do likewise, namely a drunk or DUI (Driving Under the Influence) driver.\
    \ When someone is just partially drunk, they often exhibit numerous micro-movements.\
    \ They do so because they are either unsure of what driving path they are going\
    \ to take, or they are lacking in their mental facilities and are erratically\
    \ coping with the car controls.\n\nIf you are a seasoned driver that watches for\
    \ drunk drivers, I’m sure you’ve seen many such micro-movements. That being said,\
    \ once a drunk or DUI driver has gotten fully engulfed by their mind-altering\
    \ influence, their car directing movements are bound to become the opposite of\
    \ micro-movements. The driver make overt and extremely overstated movements. Any\
    \ subtlety about their driving is now completely gone. \n\n## What does this have\
    \ to do with AI self-driving cars?\n\nAt the Cybernetic AI Self-Driving Car Institute,\
    \ we are developing AI software for self-driving cars. One aspect that is not\
    \ yet getting much attention involves the micro-movements of driver behavior,\
    \ which some consider an edge or corner case problem.\n\nAllow me to elaborate.\n\
    \nI’d like to first clarify and introduce the notion that there are varying levels\
    \ of AI self-driving cars. The topmost level is considered `Level 5`. A `Level\
    \ 5` self-driving car is one that is being driven by the AI and there is no human\
    \ driver involved. For the design of `Level 5` self-driving cars, the auto makers\
    \ are even removing the gas pedal, brake pedal, and steering wheel, since those\
    \ are contraptions used by human drivers. \n\nThe `Level 5` self-driving car is\
    \ not being driven by a human and nor is there an expectation that a human driver\
    \ will be present in the self-driving car. It’s all on the shoulders of the AI\
    \ to drive the car.\n\nFor self-driving cars less than a `Level 5`, there must\
    \ be a human driver present in the car. The human driver is currently considered\
    \ the responsible party for the acts of the car. The AI and the human driver are\
    \ co-sharing the driving task. In spite of this co-sharing, the human is supposed\
    \ to remain fully immersed into the driving task and be ready at all times to\
    \ perform the.\n\n## The Challenge of Micro-movements in AI Development\n\nIn\
    \ spite of this co-sharing, the human is supposed to remain fully immersed into\
    \ the driving task and be ready at all times to perform the. (Wait, original text\
    \ ends here or repeats? Let's re-read the provided text).\n\nIn spite of this\
    \ co-sharing, the human is supposed to remain fully immersed into the driving\
    \ task and be ready at all times to perform the. (Note: The provided text repeats\
    \ some phrases, I will maintain the core content while cleaning the flow and formatting).\n\
    \nIn spite of this co-sharing, the human is supposed to remain fully immersed\
    \ into the driving task and be ready at all times to perform the. (Actually, looking\
    \ at the source, it repeats \"expected to remain fully immersed into the driving\
    \ task and be ready at all times to perform the\"). Let's stick to the core message.\n\
    \nLet's focus on this AI-driving cars. Here’s the usual steps involved:\n\n* Sensor\
    \ collection and interpretation\n* Sensor fusion그런* Virtual model updating\n*\
    \ Car controls issuance\n\nAnother key aspect of self-driving cars is that they\
    \ will last for many years, many decades on the roads. Currently there are about\
    \ 250+ million cars in the United States alone, and the advent of self-driving\
    \ cars will not occur overnight. This means the AI of self-driving cars needs\
    \ to be able to cope with other.\n\nIt is easy to envision a simplistic world\
    \ in which all self-driving cars are politely interacting with each other. That’s\
    \ not what is going to be happening for the foreseeable future. AI-driving cars\
    \ and human cars will need to be able to cope with each other.\n\n## Future Outlook\
    \ for Driver Behavior Analysis\n\nReturning to the topic of micro-movements of\
    \ driver behavior, let’s consider how these actions come to play in the design\
    \ and development of AI-driving cars. I usually get asked two questions about\
    \ this topic, which comes up when I am speaking at industry conferences.\n\nFirst,\
    \ does it matter whether self-driving cars are developed such that they will be\
    \ able to detect the micro-movements of other? My short answer is that yes, it\
    \ does matter and AI developers at the auto makers and tech firms should be including\
    \ this capability into their self-driving cars.\n\nMost of the auto makers and\
    \ tech firms are not yet encompassing the detection of micro-movements. This lack\
    \ of attention to the topic is due to several reasons. Some the auto makers and\
    \ tech firms are oblivious to the nature of micro-movements and so it isn’t even\
    \ a matter that has reached their awareness to do something about. Of those that\
    \ are aware of it, they are already so taxed with trying to do straightforward\
    \ driving tasks that trying to add the assessment and use of micro-movements in\
    \ determining how to drive the AI is an overload for them.\n\nIndeed, many of\
    \ those AI developers would contend that analyzing micro-movements and using those\
    \ analyses for the driving behavior of the AI is an edge or corner case. In the\
    \ parlance of the AI field, anything judged to be a corner case or edge case is\
    \ something that can be put on the backburner. It is not at the core of what they\
    \ believe needs to be done. As such, they might consider micro-movements interesting,\
    \ but not vital enough to warrant being on the pressing To-Do list.\n"
