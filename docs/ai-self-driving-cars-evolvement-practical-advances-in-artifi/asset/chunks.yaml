  trans: '

    通常，大多数汽车使用控制区域网络（CAN）车辆总线作为车内以及众多子系统之间电子通信的标准。这种基于消息的协议既备受青睐，也备受诟病。


    该协议最早于 20 世纪 80 年代中期构想并作为正式协议发布，多年来不断扩展和适应。随后出现了许多互补协议，以处理诸如设备地址问题、流控能力等方面的问题。弱点和疑虑通常集中在
    CAN 缺乏健壮的安全特性，以及在对 CAN 相关问题进行故障排除时可能出现的困难。


    通常，最好的做法是尽量让 AI 系统处于 `CAN` 网络的纠纷之外，但对于消息进入 `CAN` 网络并流遍整个自动驾驶汽车后会发生什么，AI 内部需要建立起一种健康的怀疑态度。AI
    不能假设消息将会得到完美的传输。AI 也不能假设传输一定能像通常所预期的那样及时。无论 AI 将如何预期车辆控制指令的执行，都需要将现实世界的局限性考虑在。


    事实上，让我们简要观察六个主要步骤中的每一个，并考虑可能出现的错误类型或问题。


    ![](img/00006.jpeg)


    请图 2。


    ### 步骤 1：确定指令

    在第一步中，确定要发射的车辆控制指令，可以想象 AI 可能无法得出一组它想要执行的车辆控制指令。也许 AI 在尝试决定使用何种车辆控制指令时卡住了。也许 AI
    在处理过程中遇到了障碍，或者系统存在 Bug，又或者可能是自动驾驶汽车的状态状况让 AI 感到了困惑。


    这些显然都是糟糕的可能性。这就是为什么我的 AI 自动驾驶汽车框架包含了 AI 需要具备自我感知能力的需求，以双重检查 AI 系统本身正在做什么。还需要故障安全特性。一些人正在追求的更有趣的方面之一是使用“AI
    争论机器”来尝试捕捉这些 AI 似乎没有完成任务的时刻。


    ### 步骤 2：发射指令

    在发射车辆控制指令的第二步中，指令可能会因为格式化方式或在传输到 `ECU` 的过程中而乱码。这构成了一个相当危险的局面。如果指令在到达 `ECU` 时万一无法理解，`ECU`
    很可能意识到出出了问题；但如果指令万一是可理解的，`ECU` 可能会尝试对其执行，尽管这些指令并不是最初发射的。从本质上说，接收一组错误的指令注定比接收那些完全无法理解、明显错误且不当的指令要糟糕。


    ### 步骤 3：检查点（Checkpointing）

    第三步是尝试检查车辆控制指令确实已接收，并尝试验证它们确实是实际意图的内容。这是防止执行并非发射要执行的车辆控制指令的最后时刻防御层。但请注意，这个检查点并不是在质疑前两个步骤，因为即使步骤提供的指令可能导致车辆陷入不利的交通状况，那也不是第三步试图确认的重点。


    ### 步骤 4：翻译

    在第四步中，车辆控制指令被翻译成无数种必须通过 `CAN` 发送到自动驾驶汽车子系统的其他电子消息。此时，正根据第一步和第二步提供的并在第三步中验证的车辆控制指令，建立物理操作活动。在这个节点上，有很多机会出现问题。想象在一条有许多支流的河流上派遣船只，任何一艘船都可能偏离方向。


    ### 步骤 5：执行

    在第五步中，操作活动现在正在执行，例如刹车施于轮胎导致车辆开始减速，或者施加加速导致车辆开始加速。假设车辆控制指令在第四步中实际上到达了子系统，那么第五步就是这些指令的实际执行。事情可能会出错。假设刹车工作不正常呢？假设引擎没有响应呢？


    ### 步骤 6：验证

    在第六步中，需要确定车辆控制指令已执行。作为一名人类驾驶员，当你用力向右猛打方向盘时，你可以感觉到感觉到车辆发生了向右的剧烈动作。这是你确认你的指令（方向盘移动）已转化为实际的操作和物理结果的方式。AI
    系统必须进行同样的感知，以判断车辆控制指令是否已执行，这需要使用如摄像头、雷达、`LIDAR` 以及内部关注的传感器（如 `IMU`）。


    六个主要步骤中的每一个都需要时间完成。AI 系统在行动规划部分必须估计每个步骤可能需要多长时间，并利用该估值来决定做什么是可行的。例如，如果刹车所需超过了
    AI 在减速或停止自动驾驶汽车的必要性方面想要的时间，AI 就需要确定可以采取什么替代方案。例如，如果无法及时刹车，是否可能及时转动方向盘以避免即将发生的任何碰撞？


    正如显而易见的，AI 系统不能仅仅发射车辆控制指令就置之不管。AI 必须确定车辆控制指令是否被正确且恰当地传播和执行。这不仅包括指令本身被遵守，还包括执行行动的时机也符合计划。AI
    必须准备好应对突发情况，以防指令传输不当、执行不当或延迟执行等。作为人类驾驶员，你可能有时在开车时会改变主意，并突然做一些与你之前所做相反的事，例如我之前的例子，从加速突然转为减速。AI
    能不能在选择做与它已经开始做的不同的事情方面“改变主意”？答案是肯定的，AI 可以选择尝试改变它正试图做的事情。这在执行上可能会有问题。如果 AI 能在 `ECU`
    开始将指令推向自动驾驶汽车子系统之前捕捉到发射的指令，这些指令就可以被抑制。这是一种“撤销”操作。如果指令已经在由自动驾驶汽车的物理元件执行的过程中，那么没有太大撤销的机会，相反
    AI 可能需要发射一组新的车辆控制指令，寻求立即执行这些指令（例如在刚完成加速动作后立即刹车）。


    假设 AI 发射了极其剧烈的转向方向盘指令，这会导致自动驾驶汽车翻倒并底朝地。哪一个步骤应该捕捉到这一点？即使被捕捉到了，行为本身是否意味着它永远不应该被执行？也许
    AI 已经确定进行如此剧烈的转弯是值得冒险的，即让自动驾驶汽车转向并翻滚，比撞上一辆装满汽油并在碰撞时会爆炸的卡车要“好”。

