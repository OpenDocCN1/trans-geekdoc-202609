    而且，尽管我以为自己可以穿过大雾开车，但那些在不关注路面的情况下也开行的其他白痴司机才是真正令人担忧的因素。只要有任何一个傻蛋撞上我，或者选择突然刹车，对我们所有人来说都可能演变成一个糟糕的夜晚。


    以下是发生的情况。我坐在副驾驶座的朋友提议要全神投入观察我右侧的任何情况。坐在后座的两个朋友可以转身向后窗外张望。我突然拥有了额外六只眼睛的权力，它们都在寻找任何其他交通流量。他们开始口头报告各自的状态。“我什么都没看到，”其中一个人说。另一个人大喊道有一辆车从我的右侧驶来并正朝我们走来。我转过头并转向了车辆，以避开可能发生的碰撞。


    与此同时，后座的两个朋友都大喊道有一辆车正快速向车后方驶来。他们推测司机在雾中没有看到我们的车，正要直接撞上来。我踩下油门向前加速，以此增加我与后方车辆之间的距离。我看到正前方没有车，因此向前冲是一个避免被后方撞击的合理策略。


    总之，我们完好无损地到达篮球比赛现场。虽然这有点惊险，但这是一个我将永远记得的情况。我们就在那里，像一个团队一样工作，由我坐在方向开车。我必须进行一些真正的传感器融合。我正在接收来自自己眼睛的数据，同时听取朋友们的汇报，并且必须在脑中将他们告诉我的信息与我实际看到的东西结合起来。


    当你开车时，你通常在进行`多目标跟踪 (MTT)`。这涉及到识别你正试图关注的特定物体或“目标”。在洛杉矶市中心开车时，我的“目标”包括许多汽车、自行车骑行者行人。在雾气弥罩的夜晚开车时，我们有车从右侧和后方驶来。


    你的`视野 (FOV)` 是开车和使用感官装置的另一个重要方面。在雾中，我自己的 `FOV` 被缩小到我能在驾驶员一侧看到的内容，我看不到车后方的任何东西。幸运的是，我的朋友们提供了额外的
    `FOV`。我的前排朋友能够通过告诉我车右侧看到的情况来增强我的 `FOV`。后座的两个朋友拥有车后方的 `FOV`。


    我讲述的那两个故事说明了我们人类开车时是如何进行传感器融合的。正如我之前提到的，我们似乎经常并没有对这个问题投入任何意识的思考。通过观察一个青少年新手司机，你有时可以观察到他们在努力进行传感器融合时的挣扎。他们是驾驶的新手，正试图应对需要处理的无数细节。这需要处理大量信息，例如要保持手放在方向盘上，双脚踩在踏板上，眼睛盯着路面，同时还要在脑中实时处理正在发生的一切事。


    这可能会让人不知所措。老练的司机习惯了。但老练司机也会发现自己处于某些情况下，传感器融合成为一种绝对的需要，并涉及非常刻意的注意和思考。我的大雾故事与那种情况相似，同样，我听警报声的故事是另一个例子。


    最近的新中有一则关于`波音 737 MAX 8` 飞机的报道，特别是两次恐怖的致命坠机。一些人认为，飞机上的传感器是导致事故的重要因素。尽管这些问题仍在调查中，但它是`多传感器数据融合`重要性的一种潜在案例，并具有可以应用于汽车以及用于此的高级自动化的教训。


