    我想在这里明确说明的一个核心方面是，这场讨论并不是关于波音 737 MAX 8 飞机的实际法律依据以及坠机事故。我并不是试图解决那些坠机事故中发生了什么。我也没有试图分析波音
    737 MAX 8 的细节。这类分析仍在进行中，并由精通飞机细节且严密调查这些事件的专家进行。这并不是本文讨论的主题。


    相反，我将试图从各种媒体报道中理出某些人认为可能发生的情况。。这些媒体的推测可能是正确的，也可能是错误的，时间会给出答案。我想做的是看看我们是否能将这种模糊性转化为某些内容，为
    AI 系统正在发生、可能发生或已经发生的情况提供有用的提示和建议。


    我意识到，你们中可能有人会认为，现在就“拆解”这些事件为太早了。我们难道不应该等到最终报告发布吗？再次，我并不想对实际发生或未发生的事件做出断言。在许多且多样的理论和假设中，我相信蕴了丰富的见解现在就可以应用于我们处理
    AI 系统的设计、开发、测试和部署的方法。我还要认为时间至关重要，这意味着那些已经在进行的 AI 工作应该考虑我将提出的这些观点。


    请允许我热诚地澄清，我将提出的观点并不取决于对波音 737 MAX 8 坠机事故的调查结果。相反，我的观点处于抽象层面，无论最终报告对坠机事故如何描述，它们对于
    AI 系统工作都是有用的。尽管如此，坠机事故调查很可能会发现其他和额外有用的观点，所有这些观点都可以进一步应用到我们思考和处理 AI 系统的方式中。


    当你们阅读这里关于坠机事故和飞机的简要回顾时，请允许自己留出余地，即我们还不知道到底发生了什么。因此，这场讨论在很大程度上是假设性的。


    新事实可能会出现。观点可能会随着时间而改变。无论如何，我都会尝试反复强调，所描述的方面是假设性的，你们应该避免对这些方面做出判断，让注意力集中在如何利用这些观点来增强
    AI 系统上。


    即使是那些坠机事故中被证明不是事实的事物，仍然可能提供某种发生过的可能性，我们可以利用这种理解来有利于 AI 系统的采用。


    所以，不要因为你发现对飞机和/或事件的描述有任何不妥就践踏这场讨论。忽略任何此类越规。考虑这些提出的观点是否对 AI 开发人员以及那些着构建 AI 系统的组织有帮助。这正是本文的意义。


    # 波音 737 MAX 8 背景介绍


    波音 737 起于 20 世纪 60 年代后期首次飞行，并在多年后产生了许多变体，包括 20 世纪 90 年代推出的波音 737 NG（下一代）系列。作为商业飞行最畅销的飞机，去年波音
    737 型号的销量突破了 10,000 架。

