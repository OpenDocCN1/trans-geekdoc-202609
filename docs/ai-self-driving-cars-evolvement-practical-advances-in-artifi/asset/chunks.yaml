- fmt: "\nRemember the car that had zoomed past me? It became the slumbering beast.\
    \ The driver was anxious about being snagged in the snarled traffic. I could see\
    \ that the car was nudging somewhat into the bike lane. At first, it was merely\
    \ a slight intrusion. I had a hunch that the driver was testing the waters about\
    \ whether or not he could come directly into the bike lane, doing so to use it\
    \ as a means to escape the stunted traffic and get ahead of the other “sheep”\
    \ that were stuck in the pile of cars.\n\nI moved to the rightmost position of\
    \ the bike lane and was kissing the curb. This was a defensive preparatory move\
    \ by me. I also had my hands squarely on the brake handles of my bike, ready to\
    \ use my brakes if needed. I observed the tires of the car that was inching into\
    \ the bike lane and could see that the driver was becoming more decisive about\
    \ angling toward the bike lane.\n\nSure enough, he then maneuvered completely\
    \ into the bike lane, which was not only dangerous for me, but there were other\
    \ bike riders in it too. The madcap driver completely upended all of the bike\
    \ riders, not by the car actually hitting the riders, and instead by the bike\
    \ riders all swerving this way or that way to avoid the intruding car, like bowling\
    \ pins at a bowling alley. Have you ever seen those televised bike races in France\
    \ and seen those moments when the bike riders appear to fall and collide all at\
    \ once, it was about the same here. Sacre Bleu!\n\nSometimes a micro-movement\
    \ can be signaled by something other than the car itself. \n\nFor example, a human\
    \ driver puts their arm out the driver’s side window to wave you around them,\
    \ or maybe they point at something up ahead to forewarn you that there’s a big\
    \ pothole in the road. Hand motions though can be confusing and at times not meant\
    \ to be a car movement indication.\n\nI watched the other day as one driver put\
    \ his hand and arm fully out the window and seemed to be waving the appendage\
    \ up and down, rather frantically, which I wasn’t sure what this might portend.\
    \ Maybe the earth had opened a giant sinkhole and the road ahead was merely a\
    \ huge ditch? When I opted to drive around the car, figuring I’d need to be on\
    \ my toes and contend with whatever I might encounter, I could hear loud music\
    \ being played on the speakers in the car -- I surmised that the hand and arm\
    \ motions were just his way of keeping a beat to the music.\n\nA driver’s head\
    \ can be another form of a clue about driving behavior. I’m sure you had times\
    \ when you’ve been driving and could see the head of the driver in the car ahead\
    \ of you. The driver perhaps turns their head to the right, and you are able to\
    \ predict that the driver is going to try and either swing into the lane to the\
    \ right or start to make a right turn. \n\nAnother head signal involves a head\
    \ nod, often used when at a four-way stop and the other driver wants to showcase\
    \ that either you should go or they want to proceed.\n\nLet’s focus on the micro-movements\
    \ of cars that are evidenced by the actual car and set aside for now the kinds\
    \ of micro-movements that humans themselves might undertake with their own bodies.\n\
    \nHere are some the key ways that micro-movements can appear:\n\n* Angling of\
    \ the wheels of the car\n* Leftward leaning of the car\n* Rightward leaning of\
    \ the car\n* Stuttered motion of the car (sudden motion)\n* Car lurches\n* Riding\
    \ of the brakes\n* Etc.\n\nSome micro-movements are subtle, but others are more\
    \ obvious. Sometimes a micro-movement can be signaled by something other than\
    \ the car itself. For example, a human driver puts their arm out the driver’s\
    \ side window to wave you around them, or maybe they point at something up ahead\
    \ to forewarn you that there’s a big pothole in the road. Hand motions though\
    \ can be confusing and at times not meant to be a car movement indication.\n\n\
    I watched the other day as one driver put his hand and arm fully out the window\
    \ and seemed to be waving the appendage up and down, rather frantically, which\
    \ I wasn’t sure what this might portend. Maybe the earth had opened a giant sinkhole\
    \ and the road ahead was merely a huge ditch? When I opted to drive around the\
    \ car, figuring I’d need to be on my toes and contend with whatever I might encounter,\
    \ I could hear loud music being played on the speakers in the car -- I surmised\
    \ that the hand and arm motions were just his way of keeping a beat to the music.\n\
    \nA driver’s head can be another form of a clue about driving behavior. I’m sure\
    \ you had times when you’ve been driving and could see the head of the driver\
    \ in the car ahead of you. The driver perhaps turns their head to the right, and\
    \ you are able to predict that the driver is going to try and either swing into\
    \ the lane to the right or start to make a right turn. \n\nAnother head signal\
    \ involves a head nod, often used when at a four-way stop and the other driver\
    \ wants to showcase that either you should go or they want to proceed.\n\nSome\
    \ micro-movements can be subtle, but others are more obvious. Sometimes a micro-movement\
    \ can be signaled by something other than the car itself. For example, a human\
    \ driver puts their arm out the driver’s side window to wave you around them,\
    \ or maybe they point at something up ahead to forewarn you that there’s a big\
    \ pothole in the road. Hand motions though can be confusing and at times not meant\
    \ to be a car movement indication.\n\nThis highlights my earlier point about micro-movements.\
    \ Some people notice them, some do not. And it also highlights another important\
    \ point. You cannot for sure bet on a micro-movement since there is no guarantee\
    \ it will ultimately becoming a full-on movement. Not all tells blossom. You need\
    \ to assess each one, along with the situation athand, and ascertain whether the\
    \ micro-movement is telling you something of substance or not.\n\nLet’s also make\
    \ clear what isn’t a micro-movement. If someone completely cranks the wheels over\
    \ to make a full turn, I don’t think we can really consider that be a micro-movement.\
    \ Only if the driver had just slightly angled the wheels, perhaps doing so to\
    \ get ready for a turn, or maybe they were almost subconsciously starting the\
    \ turn, those are situations of a micro-movement.\n\nOne of the ways to study\
    \ micro-movements often involves observing teenage novice drivers. There are some\
    \ newbie drivers that stretch out every driving move they make. When they are\
    \ told to make a turn at the corner up ahead, they start the turn a quarter mile\
    \ beforehand. When they see a stop sign, even its at a distance of a football\
    \ field length away, the novice driver often starts to tap those, getting the\
    \ car slowed down, slowly, really slowly.\n\nThose tend to be exaggerated micro-movements.\
    \ Most seasoned drivers are apt to make much more subtle micro-movements. Those\
    \ weathered drivers have become ingrained in how they drive a car. They aren’t\
    \ necessarily aware that they are using micro-movements.\n\nSimilar to my story\
    \ about my poker playing friend that ended-up exploiting his tell, there are some\
    \ savvy drivers that like to use their micro-movements in an exploitative way.\
    \ These drivers often assume that other drivers will notice the micro-movement\
    \ and then back-off or otherwise give way to the driver that is using the micro-movements.\n"
