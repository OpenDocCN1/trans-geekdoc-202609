- fmt: '

    The Chief Safety Officer should undertake to have safety awareness become an ongoing
    activity, often fostered by posting AI safety related aspects on the corporate
    Intranet, along with providing other avenues in which AI safety is discussed and
    encouraged such as brown bag lunch sessions, sharing of AI safety tips and suggestions
    from within the firm, and so on.


    This needs to be an ongoing effort and not allow a one-time push of safety that
    then decays or becomes forgotten.


    ## Safety External


    The Chief Safety Officer should be proactive in representing the company and its
    AI safety efforts to external stakeholders. This includes doing so with regulators,
    possibly participating in regulatory efforts or reviews when appropriate, along
    with speaking at industry events about the safety related work being undertaken
    and conferring with the media.


    As the external face of the company, the CSO will also likely get feedback from
    the external stakeholders, which then should be refed into the company and be
    especially discussed with the top leadership team.


    ## Safety SDLC


    The Chief Safety Officer should help ensure that the Systems Development Life
    Cycle (`SDLC`) includes safety throughout each of the stages.


    This includes whether the `SDLC` is agile-oriented or waterfall or in whatever
    method or manner being undertaken. Checkpoints and reviews need to include the
    safety aspects and have teeth, meaning that if safety is either not being included
    or being shortchanged, this becomes an effort stopping criteria that cannot be
    swept under the rug. It is easy during the pressures of development to shove aside
    safety portions and coding, under the guise of “getting on with the real coding,”
    but that’s not going to cut it in AI systems involving life-or-death systems consequences.


    ## Safety Reporting


    The Chief Safety Officer needs to put in place a means to keep track of safety
    aspects that are being considered and included into the AI systems. This is typically
    an online tracking and reporting system. Out of the tracking system, reporting
    needs to be made available on an ongoing basis.


    This includes dashboards and flash reporting, which is vital since if the reporting
    is overly delayed or difficult to obtain or interpret, it will be “too late to
    deal with” and the cost or effort to make safety related corrections or additions
    will be subordinated.


    ## Safety Crisis Management


    The Chief Safety Officer should establish a crisis management approach to deal
    with any AI safety related faults or issues that arise. Firms often seem to scramble
    when their AI self-driving car has injured someone, yet this is something that
    could have been anticipated as a possibility, and preparations could been made
    beforehand.


    The response to an AI safety adverse act needs to be carefully coordinated and
    the company will likely be seen as either doing sincere efforts about the incident
    or if ill-prepared might make matters untoward and undermine the company efforts
    and those of other AI self-driving car makers.


    In Figure 1, I’ve also included my framework of AI self-driving cars.


    Each of the nine elements that I’ve just described can be applied to each of the
    aspects of the framework. For example, how is safety being included into the sensors
    design, development, testing, and fielding? How is safety being included into
    the sensor fusion design, development, testing, and fielding? How is safety being
    included into the virtual world model design, development, testing, and fielding.


    You are unlikely to have many safety related considerations in say the sensors
    if there isn’t an overarching belief at the firm that safety is important, which
    is showcased by having a Chief Safety Officer, and by having a company culture
    that embraces safety, and by educating the teams that are doing the development
    about AI safety, etc. This highlights my earlier point that each of the elements
    must work as an integrative whole.


    Suppose the firm actually does eight of the elements but doesn’t do anything about
    how to incorporate AI safety into the `SDLC`. What then?


    This means that the AI developers are left to their own to try and devise how
    to incorporate safety into their development efforts. They might fumble around
    doing so, or take bona fide stabs at it, though it is fragmented and disconnected
    from the rest of the development methodology.


    Furthermore, worse still, the odds are that the `SDLC` has no place particularly
    for safety, which means no metrics about safety, and therefore the pressure to
    not do anything related to safety is enhanced, due to the metrics measuring the
    AI developers in other ways that don’t necessarily have much to do with safety.
    The point being that each of the nine elements need to work collectively.


    ## Resources on Baking AI Safety Into AI Self-Driving Car Efforts


    At the Cybernetic AI Self-Driving Car Institute, we are developing AI software
    for self-driving cars. We consider AI safety aspects as essential to our efforts
    and urge auto makers and tech firms to do likewise.


    I’d like to first clarify and introduce the notion that there are varying levels
    of AI self-driving cars. The topmost level is considered Level 5. A Level 5 self-driving
    car is one that is being driven by the AI and there is no human driver involved.
    For the design of Level 5 self-driving cars, the auto makers are even removing
    the gas pedal, brake pedal, and steering wheel, since those are contraptions used
    by human drivers. The Level 5 self-driving car is not being driven by a human
    and nor is there an expectation that a human driver will be present in the self-driving
    car. It’s all on the shoulders of the AI to drive the car.


    For self-driving cars less than a Level 5, there must be a human driver present
    in the car. The human driver is currently considered the responsible party for
    the acts of the car. The AI and the human driver are co-sharing the driving task.


    In spite of this co-sharing, the human is supposed to remain fully immersed into
    the driving task and be ready at all times to perform the driving task. I’ve repeatedly
    warned about the dangers of this co-sharing arrangement and predicted it will
    produce many untoward results.


    Let’s focus herein on the true Level 5 self-driving car. Much of the comments
    apply to the less than Level 5 self-driving cars too, but the fully autonomous
    AI self-driving car will receive the most attention in this discussion.


    Here’s the usual steps involved in the AI driving task:


    * Sensor data collection and interpretation

    * Sensor fusion

    * Virtual world model updating

    * AI action planning

    * Car controls command issuance


    Another key aspect of AI self-driving cars is that they will be driving on our
    roadways in the midst of human driven cars too. There are some pundits of AI self-driving
    cars that continually refer to a utopian world in which there are only AI self-driving
    cars on the public roads. Currently there are about 250+ million conventional
    cars in the United States alone, and those cars are not going to magically disappear
    or become true Level 5 AI self-driving cars overnight.


    Indeed, the use of human driven cars will last for many years, likely many decades,
    and the advent of AI self-driving cars will occur while there are still human
    driven cars on the roads. This is a crucial point since this means that the AI
    of self-driving cars needs to be able to contend with not just other AI self-driving
    cars, but also contend with human driven cars. It is easy to envision a simplistic
    and rather unrealistic world in which all AI self-driving cars are politely interacting
    with each other and being civil about roadway interactions. That’s not what is
    going to be happening for the foreseeable future. AI self-driving cars and human
    driven cars will need to be able to cope with each other. Period.


    ![](images/00003.jpeg)


    Returning to the safety topic, let’s consider some additional facets.


    Take a look at Figure 2.

