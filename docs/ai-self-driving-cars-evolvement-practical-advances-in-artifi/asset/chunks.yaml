    在狮子航空空难事故中，一种理论是：在起飞后不久，`MCAS` 可能试图压低机头，而人类飞行员同时正试图拉起机头，他们可能并没有意识到 `MCAS` 正在试图压低机头。这似乎解释了飞机所经历的这种像过山车一样起伏不定的运动。有人指出，人类飞行员可能认为他们遇到了稳定面配平调节问题（被称为配平操纵失控或配平调节失控），并误读了
    `MCAS` 介入并作用于稳定面配平调节的状况。


    基于该理论的推测是，人类飞行员并没有意识到他们在某种意义上正在与 `MCAS` 斗争以控制飞机；如果飞行员意识到实际上发生了什么，关闭 `MCAS` 并接管飞机控制权将是容易的，而不再处于共享模式。已有记录显示，其他飞行员在认为
    `MCAS` 正在与他们控制 `波音 737 MAX 8` 的努力作对时关闭了 `MCAS`。


    根据新闻报道，一个较为模糊的方面涉及狮子航空事件中的 `AOA` 传感器。有人建议飞机上只有一个 `AOA` 传感器，它向 `MCAS` 馈送了错误数据，导致
    `MCAS` 压低机头，尽管显然或推测这种压低机头的动作并非实际。


    其他报告称，有两个 `AOA` 传感器，一个在飞机的驾驶员一侧，另一个在另一侧。驾驶员侧的 `AOA` 生成了错误读数，而另一侧的生成了正确的读数，`MCAS`
    显然忽略了运行正常的 `AOA`，转而接受了来自驾驶员侧的错误读数。


    `AOA` 传感器有时会出现故障是有记录的。另一个方面是环境条件会影响 `AOA` 传感器。如果 `AOA` 传感器上积聚了水或冰，就会影响传感器。请记住，`AOA`
    传感器在品牌和型号上有多种，因此，并非所有的 `AOA` 传感器都具有相同的能力和限制。


    `波音 737 MAX 8` 的首批商业飞行于 2017 年 5 月进行。`波音 737 MAX` 系列还有其他型号，包括已有的和构想中的，如 `MAX 7`、`MAX
    8`、`MAX 9` 等。在 2018 年 10 月发生的狮子航空事件中，这是 `波音 737 MAX` 系列的首起致命性事故。


    关于 `波音 737 MAX 8` 和这些事故还有许多其他方面，如果你感兴趣，可以很容易在网上找到此类信息。我提供的回顾并没有涵盖所有侧面——我重点关注了我想希望接下来就
    AI 系统方面进行讨论的关键要素。


    ## 话题切换到 AI 自动驾驶汽车


    让我们暂时切换一下，讨论一些关于 AI 自动驾驶汽车的背景。等我完成完这些，我将把从 `波音 737 MAX 8` 方面可能获得的见解结合起来，并探讨这在设计、构建、测试和部署
    AI 自动驾驶汽车时如何可能有用。


    在`赛论 AI 自动驾驶汽车研究所`，我们正在为自动驾驶汽车开发 AI 软件。因此，我们对从其他先进自动化开发工作中可以汲取的任何教训都感兴趣，并寻求将这些教训应用到我们的工作中，我相信同样开发
    AI 自动驾驶汽车系统的汽车制造商和科技公司也对此感兴趣。


    我想首先澄清并引入这样一个概念：AI 自动驾驶汽车有不同的级别。最高级别认为是 `Level 5`。`Level 5` 自动驾驶汽车是由 AI 驾驶的，没有人类驾驶员参与。对于
    `Level 5` 自动驾驶汽车的设计，汽车甚至去掉了油门、刹车板和方向盘，因为这些是人类驾驶员使用的装置。`Level 5` 自动驾驶汽车不是由人类驾驶，也不预期人类驾驶员会在自动驾驶汽车内。驾驶汽车完全由由
    AI 来肩任。


    对于低于 `Level 5` 的自动驾驶汽车，车内必须有人类驾驶员。人类驾驶员目前被认为是汽车行为的责任方。AI 和人类驾驶员共同承担驾驶任务。尽管有这种共享，人类仍应该保持完全沉浸在驾驶任务中，并随时准备执行驾驶任务。


    我反复警告过这种共享安排的危险性，并预测它会产生许多意外的结果。


    让我们在这里重点关注真正的 `Level 5` 自动驾驶汽车。大部分评论也适用于低于 `Level 5` 的自动驾驶汽车，但在这次讨论中，完全自动的 AI
    自动驾驶汽车将获得最多的关注。


    以下是 AI 驾驶任务涉及的通常步骤：


    *   传感器数据采集与解释

    *   传感器融合

    *   虚拟世界模型更新

    *   AI 动作规划

    *   汽车控制指令发布


    AI 自动驾驶汽车的另一个关键方面是，它们在我们的道路上行驶时也会处于人类驾驶汽车之中。有些 AI 自动驾驶汽车的专家提到一个只有 AI 自动驾驶汽车的乌托邦世界。光美国就有
    2.5 亿辆传统汽车，这些汽车不会一夜之间消失或变成真正的 `Level 5` AI 自动驾驶汽车。


    事实上，人类驾驶汽车的使用将持续很多，可能是几十年，而 AI 自动驾驶汽车的出现，道路上仍有这些汽车。这是一个关键点，因为这意味着自动驾驶汽车的 AI 不仅需要与其他
    AI 自动驾驶汽车应对，还需要与人类驾驶汽车应对。


    回到 `波音 737 MAX 8` 的问题，让我们考虑从新闻报道中可以汲取的一些潜在见解。


    以下是我将涵盖的观点列表：


    *   旧如翻新还是从零开始

    *   对单一传感器的依赖还是多个传感器的

    *   传感器融合计算

    *   人机界面 (HMI) 设计

    *   人类操作员的教育/培训

    *   认知失调与心理理论

    *   复杂系统的测试

    *   公司及其开发团队

    *   先进系统的安全考虑


    我将涵盖每个观点，做法是首先提醒我对 `波音 737 MAX 8` 的回顾以及其与该观点的联系，然后针对该观点转向 AI 系统，特别是 AI 自动驾驶汽车。


    我选择对观点进行编号，以便作为观点序列进行引用，但顺序编号并不表示一个观点比另一个更重要的优先顺序。它们都是值得讨论的观点。


    请看图 1。


    ![](img/00004.jpeg)


    ## 关键点 #1：旧如翻新还是从零开始


