    深度学习的使用渗透到自动驾驶汽车的所有其他方面。自动驾驶汽车的 `AI` 将使用深度学习，在 `systems action plan`、控制激活以及传感器融合等方面完成更好的工作。


    目前，人工神经网络的使用是深度学习最流行的形式。基于海量数据，神经网络尝试从数据中“学习”，并相应地引导自动驾驶汽车的行动方向。


    ## D-10: 战术 AI (Tactical AI)


    战术 AI 是处理自动驾驶汽车瞬时驾驶状况的要素。自动驾驶汽车是否保持在高速公路的车道内？汽车是否对控制命令做出恰当响应？传感器设备是否正常工作？


    对于人类驾驶员来说，观察一个新手司机（比如第一次开车的青少年）就能看到战术层面的的情况。他们专注于驾驶任务的机械操作，在盯着道路的同时，试图正确地控制车辆。


    ## D-11: 战略 AI (Strategic AI)


    自动驾驶汽车的战略 AI 方面处理自动驾驶汽车试图实现的大局目标。如果我要求自动驾驶汽车带我去迪士尼，那么就需要一张需要保留和维护的整体路线图。


    战略 AI 与战术 AI 之间存在交互。战略 AI 想要维持驾驶任务，而战术 AI 则专注于驾驶过程中正在进行的具体细节。如果战术 AI 似乎偏离了宏观任务，战略
    AI 想要知道原因并将其带回正轨。如果战术 AI 意识到自动驾驶汽车出现了问题，它需要相应地提醒战略 AI，对正在进行的宏观任务进行调整。


    ## D-12: 自感知 AI (Self-Aware AI)


    在正在开发的自动驾驶汽车中，极少数包含了自感知 AI 元素，而我们控制论自动驾驶汽车研究所（Cybernetic Self-Driving Car Institute）认为这对于
    5 级自动驾驶汽车至关重要。


    自感知 AI 要素旨在监控自身，即 `AI` 确保 `AI` 按照预期工作。假设你有一个人类在开车，而他们开始开得毫无章。希望他们自己的自我意识能让他们意识到自己驾驶得不好，例如在连续驾驶了几个小时后可能开始睡睡。如果你车里有一个乘客，当驾驶员开始做不对劲时，他们可能会提醒驾驶员。这正是自感知
    AI 元素尝试做的：它成为 `AI` 的监督者，试图检测 `AI` 何时变得故障或困惑，然后找到克服问题的方法。


    ## D-13: 经济 (Economic)


    自动驾驶汽车的经济方面本身并不是自动驾驶汽车的技术性方面，但经济因素确实影响着自动驾驶汽车的本质。例如，为自动驾驶汽车配备各种可能的传感器设备的成本是令人昂贵的，因此需要对使用哪些设备做出选择。而且，对于选定的传感器设备，还需要决定它们是具有全套功能还是更有限的功能集。


    我们将拥有消费成本处于低端的自动驾驶汽车，以及处于高端的，以此类推。


    ## D-14: 社会 (Societal)


    自动驾驶汽车的经济方面本身并不是自动驾驶汽车的技术性方面，但经济因素确实影响着自动驾驶汽车的本质。例如，为自动驾驶汽车配备各种可能的传感器设备的成本是令人昂贵的，因此需要对使用哪些设备做出选择。


    ## D-15: 创新 (Innovation)


    自动驾驶汽车的经济方面本身并不是自动驾驶汽车的技术性方面，但经济因素确实影响着自动驾驶汽车的本质。例如，为自动驾驶汽车配备各种可能的传感器设备的成本是令人昂贵的，因此需要对使用哪些设备做出选择。

