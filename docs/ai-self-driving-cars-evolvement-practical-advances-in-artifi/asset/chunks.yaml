  trans: '

    这种情况在停车场里经常发生。当汽车来来转去试图寻找停车位时，这可能会变成一场关于谁先提议自己发现了空位的“心理博弈”。你可能见过两辆车同时发现了一个空位，而且它们面对面停着。哪辆车能抢到车位？如果一个驾驶员调整了车轮，这可以被视为一种宣告，表示他们已经锁定了车位，并将准备激进地入。


    这有时产生的问题比解决的还要多。


    假设你有两辆车面对面争夺一个停车位，每辆车都做出了调整车轮的微动作。这是一个平局吗？其中一个驾驶员会因为另一位驾驶员似乎在主张车位而生气吗？


    我们还需要考虑那些甚至没有注意到另一辆车正在调整车轮的迷糊司机。


    或者，你也可以遇到那种看到了微动作却选择忽略它的驾驶员，假装没看到，这样他们就可以在进入车位时显得得若无知（事后还声称他们并没有意识到另一辆车想进去）。这是一个阴招。


    除了展示微动作的青少年新手驾驶员外，还有另一类司机也会这样做，即醉酒或酒驾（DUI）司机。当某人处于部分醉酒时，他们往往表现出许多微动作。他们这样做是因为他们不确定要采取哪种行驶路线，或者是因为他们的心理能力不足，正在不稳定地应对车辆控制。


    如果你是一个会留意醉酒司机的老练司机，我确定你见过许多这样的微动作。尽管如此，一旦醉酒或酒驾司机完全受到其改变精神物质的影响，他们的车辆操控动作将注定变成微动作的反面。驾驶员会做出显性且极其夸张的动作。他们驾驶中的任何细微之处现在都完全消失了。


    ## 这与 AI 自动驾驶汽车有什么关系？


    在控制论 AI 自动驾驶汽车学院，我们正在为自动驾驶汽车开发 AI 软件。一个尚未得到足够关注的方面涉及司机行为的微动作，一些人将其视为边缘案例或极端情况问题。


    请允许我详细说明一下。


    我想先澄清并引入 AI 自动驾驶汽车不同等级的概念。最高级别被认为是 `Level 5`。`Level 5` 自动驾驶汽车是由 AI 驾驶的，没有人类驾驶员参与。为了设计
    `Level 5` 自动驾驶汽车，汽车制造商甚至掉了油门、刹车板和方向盘，因为这些都是人类驾驶员使用的装置。


    `Level 5` 自动驾驶汽车不是由人类驾驶的，也不预期人类驾驶员出现在自动驾驶汽车内。驾驶汽车完全由 AI 肩任。


    对于低于 `Level 5` 的自动驾驶汽车，车内必须有人类驾驶员。目前人类驾驶员被认为是汽车行为的责任方。AI 和人类驾驶员共同承担驾驶任务。尽管有这种共享，人类应该保持完全沉浸在驾驶任务中，并随时准备执行。


    ## AI 开发中微动作的挑战


    尽管有这种共享，人类应该保持完全沉浸在驾驶任务中，并随时准备执行。（等等，原文在这里结束了还是重复了？让我们重新读一下提供的文本）。


    让我们关注这些 AI 驾驶汽车。通常涉及的步骤如下：


    * 传感器采集与解释

    * 传感器融合与虚拟模型更新

    * 发出车辆控制指令


    自动驾驶汽车的另一个关键方面是它们将在道路上运行多年、甚至几十年。目前，仅美国就有约 2.5 亿辆汽车，自动驾驶汽车的出现不会一蹴而就。这意味着自动驾驶汽车的
    AI 需要能够应对其他情况。


    很容易设想一个所有自动驾驶汽车之间都礼貌地交互的简单世界。这在可预见的未来并不会发生。AI 驾驶汽车和人类汽车需要能够相互应对。


    ## 司机行为分析的未来展望


    回到司机行为微动作的话题，让我们考虑这些动作如何在 AI 驾驶汽车的设计和开发中发挥作用。当我在行业会议上演讲时，通常会被问到关于这个主题的两个问题。


    首先，开发自动驾驶汽车使其能够检测到他人的微动作是否重要？我的简短回答是，是的，很重要，汽车制造商和科技公司的 AI 开发者应该将这种能力纳入到他们的自动驾驶汽车中。


    大多数汽车制造商和科技公司尚未涵盖对微动作的检测。对这一话题的关注不足由于几个原因。一些汽车制造商和科技公司对微动作的本质无所知，因此这甚至没有进入他们采取行动的意识范围。在那些意识到这一点的人中，他们已经忙于处理直接的驾驶任务，因此试图加入对微动作的评估和使用来决定
    AI 如何驾驶，对他们来说是过载的。


    事实上，许多 AI 开发者会认为，分析微动作并将这些分析用于 AI 的驾驶行为是一个边缘案例或极端情况。在 AI 领域的术语中，任何被判定为边缘案例或极端情况的情况都是可以延后处理的。因此，他们可能认为微动作很有趣，但还没有重要到足以列入紧迫的待办清单。

