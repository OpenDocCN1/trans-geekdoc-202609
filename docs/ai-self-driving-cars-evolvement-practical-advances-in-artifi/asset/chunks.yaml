    我也非常担心那些没有设立合适的首席安全官（Chief Safety Officer）的机构，他们不仅在危及使用其 AI 自动驾驶汽车的人的生命，还可能危及整个
    AI 自动驾驶汽车的发展。


    从本质上说，对 AI 自动驾驶汽车系统的安全性仅口头承诺，或者在无意中未能给予安全足够的关注的公司，很可能会在我们的道路上引发负面安全事件。公众和监管机构对此的反应将不仅针对那家违规公司，此类事件将引发公众抗议，并成为任何
    AI 自动驾驶汽车进一步发展的首要障碍。


    简单来说，对于 AI 自动驾驶汽车而言，“坏苹果坏了一池汤”的可能性非常高，这是我们行业内每个人每天都如履薄冰的。。


    在最近于硅谷举行的一个自动驾驶汽车活动上，与 `Zoox` 的首席安全创新官 Mark Rosekind 交流时，他强调了安全考量在 AI 自动驾驶汽车领域是至关重要的。他在美国高速交通安全局（`NHTSA`）担任管理者的多年经历，以及在国家运输安全委员会（`NTSB`）董事会的任职，为他的职位提供了非常切的技能组合和经验基础。对于对
    `Zoox` 所追求的整体安全方法感兴趣的各位，可以查看他们发布的报告：`https://zoox.com/safety/`


    那些密切关注我发布内容的朋友会记得，我之前提到过 `Chris Hart` 在 AI 自动驾驶汽车安全方面的努力。作为 `NTSB` 的前主席，他为汽车制造商和科技公司在安全方面需要做的事情带来了关键见解，并提供了可以帮助制定法规和监管行动的重要观点（参见他的网站：`https://hartsolutionsllc.com/`）。


    你可能对他最近的一篇关于航空自动化与 AI 自动驾驶汽车差异的博客文章感兴趣，这与我对同一主题的观点不谋而合。关于 `Chris Hart` 最近的博客文章，请访问：`http://www.thedrive.com/tech/26896/self-driving-safety-steps-into-the-unknown`


    `Waymo` 作为 `Google/Alphabet` 旗下在 AI 自动驾驶行业闻盛名的实体，也聘请了一位首席安全官，即 `Debbie Hersman`。除了她曾任于
    `NTSB` 并担任过其主席外，她还是国家安全委员会的 CEO 和总裁。她的加入 `Waymo` 令人倍感欣慰，因为这向其他 AI 自动驾驶制造商传递了一个信号：这是一个至关重要的职位，如果他们还没有这样做，他们也需要确保拥抱这一角色。


    `Uber` 最近聘请了 `Nat Beuse` 来领导他们的安全工作。他曾任职于美国交通部，多年负责该部门车辆的安全工作。对于对 `Uber` 去年产的安全报告（在其内部审查
    `Uber` 自动驾驶汽车事故之后）感兴趣的各位，您可以在此处找到该报告：`https://www.uber.com/info/atg/safety/`


    我还想提到国家安全委员会（`NSC`）交通部主任 `Alex Epstein` 的努力。我们在一次关于 AI 自动驾驶汽车安全的首届会议上相识，他对行业现状以及未来需要向何处发展的见解和言论是切中要害的。在
    `NSC`，他领导着他们的先进汽车安全技术倡议。他的公共外展工作值得关注，`MyCarDoesWhat` 公共活动就是一个我们如何帮助公众理解汽车自动化各个方面的例子：`https://mycardoeswhat.org/`


    ## 首席安全官角色的定义


    我发现，在基于 AI 的公司背景下，明确我所说的首席安全官角色是有用的。我发现，首席安全官需要确保安全元素能够得到培养，特别是在涉及 AI 系统的领域。


    如下所示，这些元素是相互交织的，不应该是孤立的。如果首席安全官忽视或低估这些元素，让它们处于边缘状态，很可能会损害公司的完整性。


    首席安全官的核心元素包括：


    *   安全策略 (Strategy)

    *   安全文化 (Company Culture)

    *   安全政策 (Policies)

    *   安全教育 (Education)

    *   安全意识 (Awareness)

    * 外部安全 (External)

    *   安全生命周期 (SDLC)

    *   安全报告 (Reporting)

    *   安全危机管理 (Crisis Management)


    我将对每个元素进行说明。


    ### 安全策略


    首席安全官制定如何将安全纳入 AI 系统的整体策略，并与其他高管紧密合作。必须通过协作完成，因为整个高管团队必须认同这一策略，并愿意且能够执行它。安全不是孤立存在的。公司的每个职能部门都必须参与其中，并确保安全策略得到实施。


    ### 安全文化


    首席安全官需要帮助塑造“安全优先”的企业文化。很多时候，AI 开发人员和其他技术人员并不精通安全，他们可能来自大学环境，在那里 AI 系统是以原型形式存在的，安全并不是一个特别紧迫的话。


    有些人甚至可能认为“安全是创新的敌人”，这有时是一种根深蒂固的错误。这需要巨大的努力，并且必须与领导层相结合，以有意义的方式而非轻率或表面的方式进行。


    ### 安全政策


    首席安全官应该制定一套安全政策，说明 AI 系统在构思、设计、构建、测试和部署方面如何体现关键的安全原则。


    这些政策必须易于理解，并且有明确的手段来遵守。如果政策过于抽象、晦涩或不切实际，很可能会产生一种“只是为了免责（CYA）”的感觉，导致公司其他人倾向于忽视这些政策。


    ### 安全教育


    首席安全官应该识别可以在公司范围内提供的各种教育手段，以增加对开发和部署 AI 系统背景下安全定义的理解。


    这可以是内部编写的 AI 安全课程和外部提供的课程的结合。高管也应该参与这些教育计划，以展示他们对教育方面的信念和支持，并与首席安全官合作，安排并确保团队和员工参加课程，同时进行跟进以确保教育内容投入实际使用。

