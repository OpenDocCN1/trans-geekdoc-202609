    The same kind of cognitive dissonance will be more pronounced with Level 3 cars.
    Human drivers have a greater hurdle and burden of learning what the Theory of
    Mind is of their Level 3 cars, and the odds are those human drivers will be unaware
    of or confused about those features. A potential recipe for disaster.


    ## Key Point #7: Testing of complex systems


    There is an ongoing discussion in the media about how the `MCAS` was tested. I’m
    not going to venture into the details about that aspect. In any case, it does
    spark the question of how to test advanced automation systems.


    Let’s suppose an advanced automation system is tested to make sure that it seems
    to work as devised. Maybe you do simulations of it. Maybe you do tests in a wind
    tunnel in the case of avionics systems, or for an AI self-driving car you take
    it to a proving ground or closed track.


    If the tests are solely about whether the system does what was expected, it might
    pass with flying colors. Did the tests though include what will happen when something
    goes awry?


    Suppose a sensor becomes faulty, what happens then? I’ve actually had engineers
    that tell me there was nothing in the specification about a sensor becoming faulty,
    so they didn’t develop anything to handle that aspect, therefore it made no sense
    to test it for a faulty sensor, since they could already tell you that it wasn’t
    designed and nor programmed to deal with it.


    Another kind of test involves the `HMI` aspects and the human operator.


    If the advanced automation is supposed to work hand-in-hand with a human operator,
    you ought to have tests to see if that really is working out as anticipated. One
    guffaw that I’ve often seen involves training the human operator and then immediately
    doing a test of the system with the human operator. That’s handy, but what about
    a week later when the human operator has forgotten about some of the training?
    Also, what about a human operator that received little or no training, which I’ve
    had engineers tell me that they don’t test for that condition since they are told
    beforehand that all of the human operators will always have the needed training.


    ## Key Point #8: Firms and development teams


    Usually, advanced automation systems are designed, developed, tested, and fielded
    as part of large teams and within overall organizations that shape how these work
    efforts will be undertaken.


    Crucial decisions about the nature of the design are not usually made by one person
    alone. It is a group effort. There can be compromises along the way. There can
    be miscommunication about what the design is or will do. The same can happen during
    the development. And the same can happen during the testing. And the same can
    happen during the fielding.


    My point is that it can be easy to fall into the mental trap of focusing only
    on the technology itself, whether it is a plane or a self-driving car. You need
    to also consider the wider context of how the artifact came to be. Was the effort
    a well-informed and thoughtful approach or did the approach itself lend towards
    incorporating problems or issues into the resultant outcome.


    ## Key Point #9: Safety considerations for advanced systems


    The safety record of today’s airplanes is really quite remarkable when you think
    about it.


    This has not happened by chance. There is a tremendous emphasis on flight safety.
    It gets baked into every step of the design, development, testing, and fielding
    of an airplane, along with its daily operation. In spite of that top-of-mind about
    safety, things can still at times go awry.


    In the case of AI self-driving cars, I’d suggest that things are not as safety
    conscious as yet and we need to push further along on becoming more safety aware.


    I’ve urged the auto makers and tech firms to put in place a `Chief Safety Officer`,
    charged with making sure that everything that happens when designing, building,
    testing, and fielding of an AI self-driving car that safety is a key focus.


    There are numerous steps to be baked into AI self-driving cars that will increase
    their safety, without which, I’ve prophesied we’ll see things go south and the
    AI self-driving car dream might be delayed or dashed.


    ## Conclusion


    I’ve touched upon some of the aspects that seemed to be arising as a result of
    the `Boeing 737 MAX 8` aspects that have been in the news recently.


    My goal was not to figure out the deadly incidents. My intent and hope were that
    we could glean some useful points and cast those into the burgeoning field of
    AI self-driving cars. Given how immature the field of AI self-driving car is today
    in comparison to the maturity of the aircraft industry, there’s a lot to be learned
    and reapplied.


    Let’s keep things safe out there.


    # CHAPTER 6: CAR CONTROLS COMMANDS AND AI SELF-DRIVING CAR


    Which is better, a lead foot on the brakes and a light-foot on the gas, or a lead
    foot on the gas and a featherweight foot on the brakes? Hard to say. If you are
    trying to drive onto the freeway, you usually need to double down on the gas pedal
    and make sure you enter into traffic at a fast and equitable speed. If you are
    driving in a busy mall parking lot, probably best to keep your foot leaning on
    the brakes so that you don’t hit anyone.


    I remember when I was guiding my children on how to drive a car that it seemed
    like they would inevitably drift toward having a heavy foot and a light foot on
    each of the respective pedals. Over time, they became proficient in judging how
    much pressure to apply for the gas and the brakes, doing so as based on the situation
    and the nature of the driving circumstances involved. Today, they put little conscious
    thought into the matter and are seasoned drivers.


    Novice drivers though aren’t quite sure how to treat the car controls. Besides
    my own children, I’ve seen the teenagers of other parents that were also apt to
    misjudge the controls when first learning to drive.


    It was somewhat comical one day to watch as a teenager drove down our street and
    his car seemed to start and stop. One moment the accelerator was being pushed,
    the next moment the teenager plied on the brakes. This makes sense in that he
    was concerned once his momentum got going that he was barreling too fast, so he
    wanted to slow down, but once he slowed down it became apparent that he needed
    to add some gas to get going again.


    I’m sure we’ve all had the same experience when trying to learn to drive. I’d
    also bet that you youve found yourself thrown a kilter when trying to drive someone
    else’s car, and you were unsure of how the car controls were.


    Whenever I rent a car, which I do a lot of the time due to my work travel, I often
    discover that during the first few minutes of driving the rental car that I am
    overcontrolling it. I need to initially get used to how the brakes react, how
    the accelerator reacts, and how the steering reacts. It doesn’t take long. It
    does though give you a pause for thought and perhaps allow you to reminisce about
    the old days of when you first learned to drive.


    You might be so familiar with driving your car that it seems nearly unfathomable
    to imagine that anyone could drive it in a stuttered kind of way. If someone else
    tries to drive your car and they have troubles doing so, perhaps mentioning that
    the pedals are slow to react or overly fast to react, the odds are that you’d
    be surprised at this response. For you, the pedals and steering are “just right”
    and have reached a vaunted Goldilocks stage, namely not too easy and not too hard
    to use.

