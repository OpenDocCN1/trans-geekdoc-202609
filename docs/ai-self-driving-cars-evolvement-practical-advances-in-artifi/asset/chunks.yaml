- fmt: "\nWhen I aided my children in learning to drive, I made sure to explicitly\
    \ point out the micro-movements’s aspects. I’m sure that many parents don’t think\
    \ about it and aren’t aware to bring it up for their novice driver children and\
    \ assume that the kids will somehow just pick it up on their own. There are some\
    \ AI developers that seem to think the same might happen for AI self-driving cars,\
    \ namely that rather than trying to overtly train the AI to be mindful of micro-movements,\
    \ those AI developers hope or assume that it will somehow emerge by the AI’s own\
    \ divinity. I doubt it will. \n\nI’ve tried to answer the first question which\
    \ was whether or not AI self-driving cars should be outfitted with a capability\
    \ to detect, analyze, and leverage the micro-movements made by human drivers.\
    \ Of course, I said yes.\n\nThe second question that I get asked is whether the\
    \ AI self-driving car should make use of micro-movements, doing so in a similar\
    \ manner to how human drivers use micro-movements.\n\nMy answer is yes, the AI\
    \ ought to also make use of micro-movements. Here’s why.\n\nHuman drivers are\
    \ generally used to detecting the micro-movements of other cars. I realize that\
    \ I’ve also given examples of human drivers that seem oblivious to detecting micro-movements,\
    \ but those are a smaller percentage of drivers.\n\nI would also claim that many\
    \ drivers might not be consciously aware that they are being affected by the micro-movements\
    \ of other drivers, and yet they are indeed being impacted. You might catch out\
    \ of the corner of your eye, the subtle micro-movement of another car. Doing so,\
    \ you might react without any recognizable or spoken aloud reason and respond\
    \ to that micro-movement, nonetheless. Humans are quite good at doing pattern\
    \ matching. They often are able to find patterns when they aren’t even thinking\
    \ explicitly about doing so.\n\nAn AI self-driving car should be sending the same\
    \ kind of subtle “signals” to human drivers, doing akin to what other human drivers\
    \ do. This again is part of my overarching belief that if AI self-driving cars\
    \ are going to be driving among human drivers, which we know to be the case, those\
    \ AI drivers need to be doing actions that human drivers do.\n\nIf the AI lacks\
    \ the micro-movement showcase capability, it means that those human drivers around\
    \ the AI self-driving car will no longer have an essential “tell” that can forecast\
    \ what the AI self-driving car is going to do. Without the tell, the human drivers\
    \ are going to be caught unawares. What, that stupid darned AI self-driving car\
    \ made a right turn, I wasn’t expecting it, will be a common complaint.\n\nAnd\
    \ in a manner of speaking, I’d say that those human drivers will be right. They\
    \ will be well-justified in their complaining. Who wants to have other drivers\
    \ (human or AI), for which those drivers do things seemingly without the usual\
    \ warnings (or tells) that we already have grown accustomed to seeing? It’s a\
    \ recipe for disaster.\n\nWould you be willing to put onto our roadways a slew\
    \ of drivers that aren’t driving as is customary? Not a good move.\n\nIf you did\
    \ so, it would be like dividing the traffic into two classes of drivers. When\
    \ you combine with this that the human drivers won’t readily be able to gauge\
    \ what the AI driver is going to do, and if the AI driver isn’t also versed in\
    \ reading micro-movements and therefore unaware of what the human is going to\
    \ do, it is a recipe for disaster. \n\n## Conclusion\n\nWould you be willing to\
    \ put onto our roadways a slew of drivers that aren’t driving as is customary?\
    \ Not a good move.\n\nIf you did so, it would be like dividing the traffic into\
    \ two classes of drivers. When you combine with this that the human drivers won’t\
    \ readily be able to gauge what the AI driver is going to do, and if the AI driver\
    \ isn’t also versed in reading micro-movements and therefore unaware of what the\
    \ human is going to do, it is a recipe for disaster. \n\n## Summary of Findings\n\
    \nThis again is part of my overarching belief that if AI self-driving cars are\
    \ going to be driving among human drivers, which we know to be the case, those\
    \ AI drivers need to be doing actions that human drivers do.\n\nIf the AI lacks\
    \ the micro-movement showcase capability, it means that those human drivers around\
    \ the AI self-driving car will no longer have an essential “tell” that can forecast\
    \ what the AI self-driving car is going to do. Without the tell, the human drivers\
    \ are going to be caught unawares. What, that stupid darned AI self-driving car\
    \ made a right turn, I wasn’t expecting it, will be a common complaint.\n\nAnd\
    \ in a manner of speaking, I’d say that those human drivers will be right. They\
    \ will be well-justified in their complaining. Who wants to have other drivers\
    \ (human or AI), for which those drivers do things seemingly without the usual\
    \ warnings (or tells) that we already have grown accustomed to seeing? It’s a\
    \ recipe for disaster.\n\n## Technical Analysis\n\nThe Boeing 737 MAX 8 has been\
    \ in the news recently, doing so sadly as a result of a fatal crash on March 10,\
    \ 2019 involving Ethiopian Airlines flight 302. News reports suggest another fatal\
    \ crash of the Boeing 737 MAX 8 that took place on October 29, 2018 for Lion Air\
    \ flight 610 might be similar. It is noteworthy to point out that the Lion Air\
    \ crash is still under investigation, and the Ethiopian Airlines crash is just\
    \ now starting (at the time of writing). I would like to consider at this stage\
    \ of understanding whether we can tentatively identify aspects that could be instructive\
    \ toward the design, development, and fielding of Artificial Intelligence (AI)\
    \ systems.\n\nThough the Boeing 737 MAX 8 does not include elements that might\
    \ be considered in the AI bailiwick per se, it seems relatively apparent that\
    \ systems underlying the aircraft could be likened to how automation is utilized.\
    \ A modern-day aircraft is outfitted with a variety of complex automated systems\
    \ that need to operate on a real-time basis. During the course of a flight, starting\
    \ even when the aircraft is on the ground and getting ready for flight, there\
    \ are a myriad of systems that must each play a part in the motion and safety\
    \ of the plane. Furthermore, these systems are at times under the control of the\
    \ human pilots or are in a sense co-sharing the flying operations with the human\
    \ pilots. The Human Machine Interface (HMI) is a key matter to the co-sharing\
    \ arrangement.\n\nPlease though do not assume that the insights or lessons mentioned\
    \ herein are only applicable to AI self-driving cars. I would assert that the\
    \ points made are equally important for other real-time AI systems, such as robots\
    \ that are working in a factory or warehouse, and of course other AI autonomous\
    \ vehicles such as drones and submersibles.\n"
