    \ arrangement and predicted it will produce many untoward results.\n\nLet’s focus\
    \ herein on the true Level 5 self-driving car. Much of the comments apply to the\
    \ less than Level 5 self-driving cars too, but the fully autonomous AI self-driving\
    \ car will receive the most attention in this discussion.\n\nHere’s the usual\
    \ steps involved in the AI driving task:\n\n*   Sensor data collection and interpretation\n\
    \n*   Sensor fusion\n\n*   Virtual world model updating\n\n*   AI action planning\n\
    \n*   Car controls command issuance\n\nAnother key aspect of AI self-driving cars\
    \ is that they will be driving on our roadways in the midst of human driven cars\
    \ too. There are some pundits of AI self-driving cars that continually refer to\
    \ a utopian world in which there are only AI self-driving cars on the public roads.\
    \ Currently there are about 250+ million conventional cars in the United States\
    \ alone, and those cars are not going to magically disappear or become true Level\
    \ 5 AI self-driving cars overnight. \n\nIndeed, the use of human driven cars will\
    \ last for many years, likely many decades, and the advent of AI self-driving\
    \ cars will occur while there are still human driven cars on the roads. This is\
    \ a crucial point since this means that the AI of self-driving cars needs to be\
    \ able to contend with not just other AI self-driving cars, but also contend with\
    \ human driven cars. It is easy to envision a simplistic and rather unrealistic\
    \ world in which all AI self-driving cars are politely interacting with each other\
    \ and being civil about roadway interactions. That’s not what is going to be happening\
    \ for the foreseeable future. AI self-driving cars and human driven cars will\
    \ need to be able to cope with each other. \n\nReturning to the topic of Multi-Sensor\
    \ Data Fusion, let’s walk through some of the key essentials of how AI self-driving\
    \ cars undertake such efforts.\n\nTake a look at Figure 1.\n\n![](images/00008.jpeg)\n\
    \nI’ve shown my overall framework about AI self-driving cars and highlighted the\
    \ sensor fusion stage of processing.\n\nPer my earlier remarks about the crucial\
    \ nature of sensor fusion, consider that if the sensor fusion goes awry, it means\
    \ that the stages downstream are going to be either without needed information\
    \ or be using misleading information. The virtual world model won’t be reflective\
    \ of the real-world surrounding the self-driving car. The AI action planning stage\
    \ will not be able to make appropriate determinations about what the AI self-driving\
    \ car actions should be.\n\nOne of the major challenges for sensor fusion involves\
    \ dealing with how to collectively stich together the multitude of sensory data\
    \ being collected. "
