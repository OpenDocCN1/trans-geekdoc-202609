    \ And, sensor X indicates the object is six feet tall and about two feet wide.\
    \ Meanwhile, sensor Z is reporting that the object is moving toward the self-driving\
    \ car, doing so at a speed of a certain number of feet per second N. We can combine\
    \ together the two sensor reports and update the virtual world model that there\
    \ is an object of six feet in height, two feet in width, moving toward the self-driving\
    \ car at some speed N. \n\nSuppose we only relied upon sensor X. Maybe because\
    \ we only have sensor X and there is no sensor Z on this self-driving car. Or,\
    \ sensor Z is broken. Or, sensor Z is temporarily out of commission because there\
    \ is a bunch of mud sitting on top of the sensor. \n\nIn this case, we would know\
    \ only the height and weight and general position of the object, but not have\
    \ a reading about its speed and direction of travel. That would mean that the\
    \ AI action planner is not going to have as much a perspective on the object as\
    \ might be desired.\n\nAs a quick aside, this also ties into ongoing debates about\
    \ which sensors to have on AI self-driving cars. For example, one of the most\
    \ acrimonious debates involves the choice by Tesla and Elon Musk to not put LIDAR\
    \ onto the Tesla cars. Elon has stated that he doesn’t believe LIDAR is needed\
    \ to achieve a true AI Level 5 self-driving car via his Autopilot system, though\
    \ he also acknowledges that he might ultimately be proven mistaken by this assumption.\
    \ \n\nSome would claim that the sensory input available via LIDAR cannot be otherwise\
    \ fully devised via the other kinds of sensors, and so in that sense the Tesla’s\
    \ are not going to have the same kind of complimentary or triangulation available\
    \ that self-driving cars with LIDAR have. Those that are not enamored of LIDAR\
    \ would claim that the LIDAR sensory data is not worth the added cost, nor worth\
    \ the added processing effort, nor worth the added cognition time required for\
    \ processing.\n\nI’ve pointed out that this is not merely a technical or technological\
    \ question. It is my bet that once AI self-driving cars get into foul car accidents,\
    \ we’ll see lawsuits that will attempt to go after the auto makers and tech firms\
    \ for the sensory choices made in the designs of their AI self-driving cars.\n\
    \nIf an auto maker or tech firm opted to not use LIDAR, a lawsuit might contend\
    \ that the omission of LIDAR was a significant drawback to the capabilities of\
    \ the AI self-driving car, and that the auto maker or tech firm knew or should\
    \ have known that they were under-powering their AI self-driving car, making it\
    \ less safe. This is going to be a somewhat “easier” claim to launch, especially\
    \ due to the aspect that most AI self-driving cars are being equipped with LIDAR.\n\
    \nIf an auto maker or tech firm opts to use LIDAR, a lawsuit might contend that\
    \ the added effort by the AI system to process the LIDAR was a contributor to\
    \ the car wreck, and that the auto maker or tech firm knew or should have known\
    \ that the added processing and processing time could lead to the AI self-driving\
    \ car being less safe. This claim will be more difficult to lodge and support,\
    \ especially since it goes against the tide of most AI self-driving cars being\
    \ equipped with LIDAR.\n\n*   Reconcile\n\nI’d like to revisit the use of sensor\
    \ X and sensor Z in terms of object detection. \n\nLet’s pretend that sensor X\
    \ detects an object, and yet sensor Z does not, even though the sensor Z could\
    \ have. In other words, the object is within the Field of View (FOV) of sensor\
    \ Z, and yet sensor Z isn’t detecting the object. Note that this is vastly different\
    \ than if the object were entirely outside the FOV of sensor Z, in which case\
    \ we would not have any expectation that sensor Z could detect the object.\n\n\
    We have a bit of a conundrum on our hands that needs reconciling. "
