  raw: 'Doing so though merely led to other cars deciding to jump in between me and
    the car ahead of me. The rule-of-thumb on our freeways is a dog-eat-dog world
    in which any available gaps are immediately considered available for intrusion.
    Indeed, some drivers here insist they are doing all the rest of us a great service
    by compacting traffic. In their minds, any unused gap between cars is unsightly
    wasted space and merely elongates the traffic woes on the freeway.


    As other cars came into my lane, some appeared to notice the poles, while others
    did not. I saw one car that started into my lane, realized the poles were poking
    out, and the driver then retreated back into their own lane. Another car, one
    that was relatively close to the ground, a smaller sports car, smoothly went under
    the poles, doing so as the lane switching driver used my lane to get over into
    the next lane to my right. A typical move by a sports car driver. Why switch lanes
    one at a time when you can make a multi-lane swift switch-a-roo, the NASCAR way.


    Eventually, the driver of the flaunting poles decided they were nearing their
    exit and began to move over toward the exit lane. When the driver made each lane
    switch, they seemed to misjudge the amount of distance they needed to safely have
    available. I doubt the driver was calculating the added length of the car by including
    the additional length of the overhanging poles. This driver not only didn’t flag
    the poles, they seemed to not care about how the poles changed the dynamics of
    the driving task.


    Sad, but not too surprising.


    Most of us likely don’t think too much about the overall size of our cars, at
    least not consciously per se. Once you get used to the size or dimensions of your
    car, you pretty much know it by heart. If you drive the same car over and over,
    each day, you can almost feel the outer edges of the car. You instinctively know
    if you can make the tight corner or squeeze your car into that parking space that
    you had your eye on.


    In contrast, when you rent a car, assuming it is a different make and model from
    your usual car, it probably takes you a few minutes of driving to get used to
    the dimensions of the car.


    I remember renting a large-sized SUV for a camping trip and it was hard at first
    to sense where the four corners of the car were. I parked in front of my house
    and suddenly realized that the SUV stuck out beyond the usual spot that I park
    my normal car. When I went over to the mall to get some groceries, a parking spot
    opened up near the store, but as I slowly maneuvered the car into the spot, I
    realized that trying to park the beast in a compact-sized space was not a good
    idea.


    A quick question for you. Take a moment to visualize in your mind the car that
    you usually drive. What is the length of the car? What is the width of the car?
    Most people aren’t readily able to state in feet or inches what the length and
    width is. They just “know” about how big their car is. They can feel it when they
    drive. The moment you try to parallel park your car, you often become acutely
    aware of the size, since you are trying to shove it into a spot that often times
    just barely allows it to fit.


    What about the height of your car? Most people aren’t so sure what their precise
    height of the car is. They can guess. They also generally are able to discern
    whether their car will be able to go underneath a roadway sign or a bridge. This
    can be tested though when you go through a drive-thru eatery and they have a posted
    sign that warns what the height limit is. I’ve seen some drivers that inched forward,
    unsure of whether their roof might hit something, especially if they had a ski
    rack or a surfboard rack on their rooftop.


    In terms of estimating the size of something, I am reminded of a notable aspect
    that happened when my children were quite young. We had gone to a ceramics shop
    that allowed us to buy various ceramic objects and then paint them while there
    in the store. It was a fun activity. After painting the objects, you left them
    at the shop for a day or so, allowing the shop to cure them, and then we’d come
    to pick-up our now shiny painted ceramic objects.  


    Upon arriving at the store a few days after painting the objects, consisting of
    a ceramic bunny and ceramic egg (done for Easter!), we looked at them with tremendous
    glee and pride. They looked superb, like a professional had painted them. I asked
    the kids to go get two cardboard boxes from the other side of the store so we
    could put each of the ceramic objects into a box and safely transport them.


    One of the kids came back with a box that was so small that neither the bunny
    and nor the egg could fit. The other one came back with a box that was quite large
    and would inadvertently allow the bunny or egg to likely roll around and possibly
    get damaged while carrying the box. I pointed out these discrepancies and politely
    requested that they try to find a box that might be a more appropriate fit. You
    might say a Goldilocks sized box, one that was not too small, and nor too large.


    They happily did so. We then packed the bunny and the egg into each of their own
    respective boxes. A successful effort and one that to this day is showcased on
    my mantle, notably bringing those objects out into the open when Easter comes
    around, symbols of the love and joy that went into crafting them.


    What does a ceramic Easter egg and bunny have to do with a car on the freeway
    with overhanging poles? Good question, and here’s the answer. Judging the dimensions
    of a box needed to fully contain an Easter egg or bunny is akin to envisioning
    a kind of virtual box that might surround the dimensions of your car.


    I’d like you to once again think about the car that you usually drive. This time,
    rather than trying to state the dimensions, instead try to imagine a box into
    which your car might fit. When I say the word box, I suppose you can think of
    it more like a container, like say a shipping container. If we were going to try
    and ship your car to someplace, what sized container (or box) would you need?


    You could make a wild guess and select a container or box that is twice the size
    of your car. In that case, you’d be sure that the car would fit. But, suppose
    I told you that there was an added cost as the size of the container or box increases.
    Thus, aiming high is going to be more costly.


    I’m sure you would then adjust your guess and aim at a smaller container or box.
    Suppose the container or box is too small? That won’t do, since you need to make
    sure that every inch of your car fits into the container or box. You can’t have
    anything stretching beyond the container or box. Ideally, you want the container
    or box to just fit, ensuring that all aspects of the car are contained within
    the box, and not being much larger since the added cost of the larger size is
    something you are trying to avoid.


    From your school days, I’m sure that you know that this box or container is going
    to have three dimensions. If all three of the dimensions are the same, you have
    a cube. In which case, the volume of the cube is each side times each other, or
    the side cubed, often written as V = a^3. If the sides are unequal, the volume
    of the resultant cuboid is typically written as V = l x h x w. This consists of
    the length, times the height, and times the width. Some prefer to say that the
    width is the depth, which is fine if that’s what you feel more comfortable with.


    Most cars are pretty much in the shape of a cuboid, meaning that the length, height,
    and width differ. We don’t need necessarily though to make the container or box
    in the shape of a cuboid. Maybe we could fit your car into a pyramid shape, the
    volume being 1/3 B x h. Or maybe into the shape of a sphere, the volume being
    4/3 pi r^3. And so on.'
