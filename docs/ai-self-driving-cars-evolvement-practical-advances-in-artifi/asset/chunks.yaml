- fmt: "\nAs mentioned earlier, one theory was that the Boeing 737 MAX 8 in the Lion\
    \ Air incident had two AOA sensors and one of the sensors was faulting, while\
    \ the other sensor was still good, and yet the `MCAS` supposedly opted to ignore\
    \ the good sensor and instead rely upon the faulty one.\n\nIn the case of AI self-driving\
    \ cars, an important aspect involves undertaking a kind of sensor fusion to figure\
    \ out a larger overall notion of what is happening with the self-driving car.\
    \ The sensor fusion subsystem needs to collect together the sensory data or perhaps\
    \ the sensory interpretations from the myriad of sensors and try to reconcile\
    \ them. Doing so is handy because each type of sensor might be seeing the world\
    \ from a particular viewpoint, and by “triangulating” the various sensors, the\
    \ AI system can derive a more holistic understanding of the traffic around the\
    \ self-driving car.\n\nWould it be possible for an AI self-driving car to opt\
    \ to rely upon a faulting sensor and simultaneously ignore or downplay a fully\
    \ functioning sensor? Yes, absolutely, it could happen.\n\nIt all depends upon\
    \ how the sensor fusion was design and developed to work. If the AI developers\
    \ though that say the forward camera is more reliable overall than the forward\
    \ radar, they might have developed the software such that it tends to weight the\
    \ camera more so than the radar. This can mean that when the sensor fusion is\
    \ trying to decide which sensor to choose as providing the right indication at\
    \ the time, it might default to the camera, rather than the radar, even if the\
    \ camera is in a faulting mode.\n\nPerhaps the sensor fusion is unaware that the\
    \ camera is faulting, and so it gives the benefit of the doubt to the camera.\
    \ Or, maybe the sensor fusion realizes the camera is faulting, but it has been\
    \ setup to nonetheless choose the camera over the radar, rightfully or wrongly.\
    \ \n\nThe decisions made by the AI developers are going to pretty much determine\
    \ what happens during the sensor fusion. If the design is not fully baked, or\
    \ if the design was not implemented as intended, you can definitely end-up with\
    \ situations that seem oddball from a logical perspective.\n\nThis point highlights\
    \ the importance of designing the sensor fusion in a manner that best leverages\
    \ the myriad of sensors, along with having extensive error checking and correcting,\
    \ along with being able to deal with good and bad sensors. This includes the troublesome\
    \ and at times hard to figure out intermittent faulting of a sensor.\n\n## Key\
    \ Point #4: Human Machine Interface (HMI) designs\n\nAccording to the news reports,\
    \ the `MCAS` is automatically always activated and trying to figure out whether\
    \ it should engage into the act of co-sharing the flight controls. It seems that\
    \ some pilots of the aircraft might not realize this is the case. Perhaps some\
    \ are unaware of the `MCAS`, or maybe some are aware of the `MCAS` but believe\
    \ that it will only engage at their human piloting directive to do so.\n\nBesides\
    \ this always-on aspect, perhaps there are some human pilots that don’t know how\
    \ to turn-off the feature, or they might have once known and have forgotten how\
    \ to do so. Or, maybe while in the midst of a crisis, they aren’t considering\
    \ whether the `MCAS` could be erroneously fighting them and therefore it doesn’t\
    \ occur to them to disengage it entirely.\n\nThey might also during a crisis be\
    \ trying to consider a wide variety of possibilities of what is happening to the\
    \ plane. From a hindsight viewpoint, maybe it is easy to isolate the `MCAS` and\
    \ for someone to say that it was the culprit, but in the midst of a moment when\
    \ the plane is fighting against you, your mental effort is devoted to trying to\
    \ right the plane, along with seeking reasons for why the plane is having troubles.\
    \ There is a potential large mental search space that the human pilot has to analyze,\
    \ and yet this is happening in real-time with obvious serious and life-or-death\
    \ consequences involved.\n\nWhat makes this seemingly even more subtle in the\
    \ case of the `MCAS` is that it apparently will temporarily disengage when the\
    \ pilot uses the yoke switch, but the `MCAS` will then re-engage when it calculates\
    \ that there is need to do so. A human pilot might at first believe that they’ve\
    \ disengaged entirely the `MCAS`, when all that’s happened is that it has temporarily\
    \ disengaged. When the `MCAS` re-engages, the human pilot could be baffled as\
    \ to why the control is once again having troubles.\n\nCombine this on-and-off\
    \ kind of automatic action with the throes of dealing with the plane in a crisis\
    \ mode. You’ve got a confluence of factors that can begin to overwhelm the human\
    \ pilot. It can be difficult for them to sort out what is actually taking place.\
    \ They meanwhile will continue to do what seems the proper course of action, bring\
    \ up the nose. Ironically, this is seemingly likely to get the `MCAS` to once\
    \ again try to push the nose.\n\nI’d like to do a quick thought experiment on\
    \ this. Imagine a car with two sets of wheels and pedals. We’ll put those driving\
    \ controls in the front seats. Let’s also place a barrier between the driver’s\
    \ seat and the second driver that we’ll say is just to the right of normal position.\
    \ The driver in the normal position is asked to drive the car. They do so. Suppose\
    \ they drive it a lot, so much that after while they kind of forget that second\
    \ driver is sitting next to them (hidden from view by the barrier).\n\nAt one\
    \ point, the car starts to get into trouble and appears to be sliding out of the\
    \ lane. The second driver, the one that has been silent and not doing anything\
    \ so far, decides they need to step into the effort and correct the sliding. The\
    \ first driver, having gotten used to driving the car themselves, and having no\
    \ overt awareness that the second driver is now operating the controls, believes\
    \ they are the only driver of the car.\n"
  raw: "As mentioned earlier, one theory was that the Boeing 737 MAX 8 in the Lion\
    \ Air incident had two AOA sensors and one of the sensors was faulting, while\
    \ the other sensor was still good, and yet the MCAS supposedly opted to ignore\
    \ the good sensor and instead rely upon the faulty one.\n\nIn the case of AI self-driving\
    \ cars, an important aspect involves undertaking a kind of sensor fusion to figure\
    \ out a larger overall notion of what is happening with the self-driving car.\
    \ The sensor fusion subsystem needs to collect together the sensory data or perhaps\
    \ the sensory interpretations from the myriad of sensors and try to reconcile\
    \ them. Doing so is handy because each type of sensor might be seeing the world\
    \ from a particular viewpoint, and by “triangulating” the various sensors, the\
    \ AI system can derive a more holistic understanding of the traffic around the\
    \ self-driving car.\n\nWould it be possible for an AI self-driving car to opt\
    \ to rely upon a faulting sensor and simultaneously ignore or downplay a fully\
    \ functioning sensor? Yes, absolutely, it could happen.\n\nIt all depends upon\
    \ how the sensor fusion was design and developed to work. If the AI developers\
    \ though that say the forward camera is more reliable overall than the forward\
    \ radar, they might have developed the software such that it tends to weight the\
    \ camera more so than the radar. This can mean that when the sensor fusion is\
    \ trying to decide which sensor to choose as providing the right indication at\
    \ the time, it might default to the camera, rather than the radar, even if the\
    \ camera is in a faulting mode.\n\nPerhaps the sensor fusion is unaware that the\
    \ camera is faulting, and so it gives the benefit of the doubt to the camera.\
    \ Or, maybe the sensor fusion realizes the camera is faulting, but it has been\
    \ setup to nonetheless choose the camera over the radar, rightfully or wrongly.\
    \ \n\nThe decisions made by the AI developers are going to pretty much determine\
    \ what happens during the sensor fusion. If the design is not fully baked, or\
    \ if the design was not implemented as intended, you can definitely end-up with\
    \ situations that seem oddball from a logical perspective.\n\nThis point highlights\
    \ the importance of designing the sensor fusion in a manner that best leverages\
    \ the myriad of sensors, along with having extensive error checking and correcting,\
    \ along with being able to deal with good and bad sensors. This includes the troublesome\
    \ and at times hard to figure out intermittent faulting of a sensor.\n\nKey Point\
    \ #4: Human Machine Interface (HMI) designs\n\nAccording to the news reports,\
    \ the MCAS is automatically always activated and trying to figure out whether\
    \ it should engage into the act of co-sharing the flight controls. It seems that\
    \ some pilots of the aircraft might not realize this is the case. Perhaps some\
    \ are unaware of the MCAS, or maybe some are aware of the MCAS but believe that\
    \ it will only engage at their human piloting directive to do so.\n\nBesides this\
    \ always-on aspect, perhaps there are some human pilots that don’t know how to\
    \ turn-off the feature, or they might have once known and have forgotten how to\
    \ do so. Or, maybe while in the midst of a crisis, they aren’t considering whether\
    \ the MCAS could be erroneously fighting them and therefore it doesn’t occur to\
    \ them to disengage it entirely.\n\nThey might also during a crisis be trying\
    \ to consider a wide variety of possibilities of what is happening to the plane.\
    \ From a hindsight viewpoint, maybe it is easy to isolate the MCAS and for someone\
    \ to say that it was the culprit, but in the midst of a moment when the plane\
    \ is fighting against you, your mental effort is devoted to trying to right the\
    \ plane, along with seeking reasons for why the plane is having troubles. There\
    \ is a potential large mental search space that the human pilot has to analyze,\
    \ and yet this is happening in real-time with obvious serious and life-or-death\
    \ consequences involved.\n\nWhat makes this seemingly even more subtle in the\
    \ case of the MCAS is that it apparently will temporarily disengage when the pilot\
    \ uses the yoke switch, but the MCAS will then re-engage when it calculates that\
    \ there is need to do so. A human pilot might at first believe that they’ve disengaged\
    \ entirely the MCAS, when all that’s happened is that it has temporarily disengaged.\
    \ When the MCAS re-engages, the human pilot could be baffled as to why the control\
    \ is once again having troubles.\n\nCombine this on-and-off kind of automatic\
    \ action with the throes of dealing with the plane in a crisis mode. You’ve got\
    \ a confluence of factors that can begin to overwhelm the human pilot. It can\
    \ be difficult for them to sort out what is actually taking place. They meanwhile\
    \ will continue to do what seems the proper course of action, bring up the nose.\
    \ Ironically, this is seemingly likely to get the MCAS to once again step into\
    \ the co-sharing and try to push down the nose.\n\nI’d like to do a quick thought\
    \ experiment on this.\n\nImagine a car with two sets of steering wheels and pedals.\
    \ We’ll put those driving controls in the front seats of the car. Let’s also place\
    \ a barrier between the driver’s seat and the second driver that we’ll say is\
    \ just to the right of the normal position for a driver. The barrier is sizable\
    \ and masks the actions of the other driver.\n\nThe driver in the normal driving\
    \ position is asked to drive the car. They do so. Suppose they drive it a lot,\
    \ so much that after a while they kind of forget that a second driver is sitting\
    \ next to them (hidden from view by the barrier).\n\nAt one point, the car starts\
    \ to get into trouble and appears to be sliding out of the lane. The second driver,\
    \ the one that has been silent and not doing anything so far, other than watching\
    \ the road, decides they need to step into the driving effort and correct the\
    \ sliding aspects. The first driver, having gotten used to driving the car themselves,\
    \ and having no overt awareness that the second driver is now going to operate\
    \ the controls, believes they are the only driver of the car.\n\nThe two drivers\
    \ begin fighting with each other in terms of working the driving controls, yet\
    \ neither of them seems to realize that the other driver is doing so. They are\
    \ seemingly working in isolation of each other, though they both have their “hands”\
    \ on the controls.\n\nYou might exclaim that the second driver should be telling\
    \ the first driver that they are now working the driving controls. Hey you, over\
    \ there on the other side of the barrier, I’m trying to keep you from sliding\
    \ out of the lane, might be a handy thing to say. If there is no particular communication\
    \ taking place between the two, they might not realize how they are each countering\
    \ the other, and possibly making the situation worse and worse in doing so.\n\n\
    I’ve many times exhorted that in the case of AI self-driving cars we are heading\
    \ into untoward territory as the AI gets more advanced and yet does not entirely\
    \ drive the car itself. In the case of Level 3 self-driving cars, there is going\
    \ to be a struggle of the human driver and the AI system in terms of co-sharing\
    \ the driving task. In some ways, my thought experiment highlights what can happen.\n\
    \nThat’s why some AI self-driving car makers are trying to jump past Level 3 and\
    \ go straight to Level 4 and Level 5. Others are determined to proceed with Level\
    \ 3. It’s going to be a question of whether human drivers fully grasp what they\
    \ are supposed to do versus what the AI system is supposed to do."
