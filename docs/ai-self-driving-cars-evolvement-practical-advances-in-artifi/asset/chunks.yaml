  raw: 'Recall that the Boeing 737 MAX 8 is a retrofit of prior designs of the Boeing
    737. Some have suggested that the “problem” being solved by the MCAS is a problem
    that should never have existed at all, namely that rather than creating an issue
    by adding the more powerful engines and putting them further forward and higher,
    perhaps the plane ought to have been redesigned entirely anew. Those that make
