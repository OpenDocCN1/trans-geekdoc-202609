    \ 978-1-7329760-8-5\n\n## DEDICATION\n\nTo my incredible son, Michael, and my\
    \ incredible daughter, Lauren. \n\n*Forest fortuna adiuvat* (from the Latin; good\
    \ fortune favors the brave).\n\n## CONTENTS\n\n*   Acknowledgments: iii\n*   Introduction:\
    \ 1\n*   **Chapters**\n    1.  Eliot Framework for AI Self-Driving Cars: 15\n\
    \    2.  Chief Safety Officer and AI Self-Driving Cars: 29\n    3.  Bounded Volumes\
    \ and AI Self-Driving Cars: 49\n    4.  Micro-Movement Behaviors and AI Self-Driving\
    \ Cars: 73\n    5.  Boeing 737 Aspects and AI Self-Driving Cars: 97\n    6.  Car\
    \ Controls Commands of AI Self-Driving Cars: 127\n    7.  Multi-Sensor Data Fusion\
    \ and AI Self-Driving Cars: 155\n*   Appendix A: Teaching with this Material:\
    \ 185\n*   Other Self-Driving Car Books by This Author: 193\n*   About the Author:\
    \ 247\n*   Addendum: 248\n\n## ACKNOWLEDGMENTS\n\nI have been the beneficiary\
    \ of advice and counsel by many friends, colleagues, family, investors, and many\
    \ others. I want to thank everyone that has aided me throughout my career. I write\
    \ from the heart and the head, having experienced first-hand what it means to\
    \ have others around you that support you during the good times and the tough\
    \ times.\n\nTo Warren Bennis, one of my doctoral advisors and ultimately a colleague,\
    \ I offer my deepest thanks and appreciation, especially for his calm and insightful\
    \ wisdom and support. \n\nTo Mark Stevens and his generous efforts toward funding\
    \ and supporting the USC Stevens Center for Innovation.\n\nTo Lloyd Greif and\
    \ the USC Lloyd Greif Center for Entrepreneurial Studies for their ongoing encouragement\
    \ of founders and entrepreneurs. \n\nTo Peter Drucker, William Wang, Aaron Levie,\
    \ Peter Kim, Jon Kraft, Cindy Crawford, Jenny Ming, Steve Milligan, Chis Underwood,\
    \ Frank Gehry, Buzz Aldrin, Steve Forbes, Bill Thompson, Dave Dillon, Alan Fuerstman,\
    \ Larry Ellison, Jim Sinegal, John Sperling, Mark Stevenson, Anand Nallathambi,\
    \ Thomas Barrack, Jr., and many other innovators and leaders that I have met and\
    \ gained mightily from doing so.\n\nThanks to Ed Trainor, Kevin Anderson, James\
    \ Hickey, Wendell Jones, Ken Harris, DuWayne Peterson, Mike Brown, Jim Thornton,\
    \ Abhi Beniwal, Al Biland, John Nomura, Eliot Weinman, John Desmond, and many\
    \ others for their unwavering support during my career.\n\nAnd most of all thanks\
    \ as always to Michael and Lauren, for their ongoing support and for having seen\
    \ me writing and heard much of this material during the many months involved in\
    \ writing it. To their patience and willingness to listen.\n\n## INTRODUCTION\n\
    \nThis is a book that provides the newest innovations and the latest Artificial\
    \ Intelligence (`AI`) advances about the emerging nature of AI-based autonomous\
    \ self-driving cars. Through recent advances in Artificial Intelligence (`AI`)\
    \ and Machine Learning (`ML`), we are nearing the day when vehicles will not require\
    \ or rely upon human intervention. \n\nFor those that might have seen my essays\
    \ elsewhere, I have updated and integrated them into this book as one cohesive\
    \ package. In addition to writing and developing for self-driving cars, I am currently\
    \ at the forefront of self-driving cars. This book is a collection of some of\
    \ my advanced essays. Though the aspects described in this book are certainly\
    \ applicable to all autonomous vehicles, I am particularly focused on them here.\
    \ \n\nThe phrase \"autonomous vehicles\" is often used to refer to any kind of\
    \ self-driving car, whether it is ground, air, or sea. For those who might be\
    \ interested in companion books I have written, they are entitled:\n*   `Introduction\
    \ to Driverless Self-Driving Cars`\n*   `Self-Driving Cars: Cybernetic`\n*   `The\
    \ Mother of All AI Projects`\n*   `Thought Leadership on Driverless Cars`\n* \
    \  `Autonomous Vehicle Driverless Self-Driving Cars`\n*   `Transformative Artificial\
    \ Intelligence Self-Driving Cars`\n*   `Disruptive Artificial Intelligence and\
    \ Self-Driving Cars`\n*   `State-of-the-Art Driverless Cars`\n*   `Top Trends\
    \ in Self-Driving Cars`\n*   `AI Innovations and Self-Driving Cars`\n*   `Crucial\
    \ Advances for Driverless Cars`\n*   `Sociotechnical Insights and Driverless Cars`\n\
    *   `Pioneering Advances for Driverless Cars`\n*   `Leading Edge Trends for Driverless\
    \ Cars`\n*   `The Cutting Edge of AI Autonomous Cars`\n*   `The Next Wave of Self-Driving\
    \ Cars`\n*   `Revolutionary Innovations of Self-Driving Cars`\n*   `AI Self-Driving\
    \ Cars Breakthroughs`\n*   `Trailblazing Trends for Self-Driving Cars`\n*   `Ingenious\
    \ Strides for Driverless Cars`\n*   `AI Self-Driving Cars Inventiveness`\n*  \
    \ `Visionary Secrets of Driverless Cars`\n*   `Spearheading AI Self-Driving Cars`\n\
    *   `Spurring AI Self-Driving Cars`\n*   `Avant-Garde Driverless Cars`\n*   `AI\
    \ Self-Driving Cars Evolvement`\n\nAll are available via `Appendix A`. For the\
    \ introduction herein to this book, I am going to borrow my introduction from\
    \ those companion books, since it does a good job of laying out the landscape\
    \ of self-driving cars. The remainder of the book is all new material that does\
    \ not appear in the companion books.\n"
