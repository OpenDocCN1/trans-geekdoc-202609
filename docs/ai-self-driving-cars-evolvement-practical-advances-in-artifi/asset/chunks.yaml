    # 课程作业


    a) **基础人工智能研究课题作业**：针对深度人工智能、机器学习、人工神经网络（ANN）等特定领域进行研究，并准备一份论文和演示报告。论文应至少引用 3
    个信誉良好的来源。与书中陈述的内容进行对比分析。


    b) **自动驾驶汽车主题作业**：对自动驾驶汽车进行研究并准备论文。引用至少 3 个信誉良好的来源并对其特征进行分析。与书中陈述的内容进行对比分析。


    c) **商业主题作业**：针对商业与先进技术进行研究，并准备一份论文和演示报告。哪些是热门的，哪些不是？引用至少 3 个信誉良好的来源。与书中的描描写进行对比分析。


    d) **创业作业**：让学生准备一份关于他们可能如何在该领域创业的论文。他们必须提交一份合理的创业计划书。他们还可能被要求展示他们的创业计划书，因此也应该准备配套的演示文稿片。


    ## 教师备注


    你完全根据自己的特定需求和课堂结构调整上述作业。你会发现，对于基于论文写作的作业，我要求引用 3 个信誉良好的来源。我通常引导学生选择“信誉良好”的出版物，否则他们会引用一些古怪的来源，这些来源除了碰巧写了东西并发布到网上之外没有任何依据。你可以根据喜好定义“信誉良好”，例如，某些教员认为维基百科是不可靠的，而另一些人认为它是可靠的并允许学生引用。


    我通常要求至少引用 3 次的句是，如果学生只引用一或两个，他们通常会就他们找到的最快的内容。通过要求三次引用，通常会迫使他们寻找、探索，最终可能会找到 5
    个或更多，然后精简到他们真正使用的 3 个。


    我没有规定论文的长度，这由你告诉学生你的偏好。对于每项作业，你最终可能会得到一到两页的短文，也可以是一篇论文长度的文章。请根据最适合你课程的情况，以及该作业在课程其他评分标准中的学分分值来决定长度。


    我在作业中提到他们要写论文并准备演示。我通常尝试让学生展示他们的成果。这对于他们未来在商界的工作是一个很好的实践。大多数情况下，他们将被要求准备一份分析并进行展示。如果你没有课堂时间或倾向让学生进行演示，你当然可以删掉他们制作演示文稿的部分。


    ## 顶级 AI 期刊


    如果你想引导学生关注人工智能领域的高排名期刊，这里是根据各种引用计数来源报告的顶级期刊列表（列表每年变化）：


    *   Communications of the ACM

    *   Artificial Intelligence（人工智能）

    *   Cognitive Science（认知科学）

    *   IEEE Transactions on Pattern Analysis and Machine Intelligence（模式分析与机器智能汇刊）

    *   Foundations and Trends in Machine Learning（机器学习的基础与趋势）

    *   Journal of Memory and Language（记忆与语言杂志）

    *   Cognitive Psychology（认知心理学）

    *   Neural Networks（神经网络）

    *   IEEE Transactions on Neural Networks（神经网络神经网络汇刊）

    *   Intelligent Systems（智能系统）

    *   Knowledge-based Systems（知识的系统）


    # 作业指南


    对于每项作业，你最终可能会得到一到两页的短文，也可以是一篇论文长度的文章。请根据最适合你课程的情况，以及该作业在课程其他评分标准中的学分分值来决定长度。


    我在作业中提到他们要写论文并准备演示。我通常尝试让学生展示他们的成果。这对于他们未来在商界的工作是一个很好的实践。大多数情况下，他们将被要求准备一份分析并进行展示。如果你没有课堂时间或倾向让学生进行演示，你当然可以删掉他们制作演示文稿的部分。


