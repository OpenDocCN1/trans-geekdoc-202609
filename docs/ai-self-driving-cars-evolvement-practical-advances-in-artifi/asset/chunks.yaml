    登上月球并非一蹴而就。这需要多年年累积的渐进式进展才能到达那里。自动驾驶汽车也是如此。Google 众所周知一直在努力实现 `Level 5`，并且基本上愿意放弃处理中间的级别，但大多数其他自动驾驶汽车制造商采取的是渐进式路线。让我们先实现一个良好的
    `Level 2` 并达到某种程度 `Level 3`。然后，让我们改进 `Level 3` 并达到某种程度 `Level 4`。接着，让我们改进 `Level
    4` 并最终到达 `Level 5`。这似乎是我们实现真正的自动驾驶汽车的主流方式。


    ## 实验


    你可能知道，在完善前往月球的方法和技术过程中，涉及了各种实验。按照渐进式进展的方法，我们首先尝试看是否能让火箭进入太空并安全返回，然后放了一只猴子进去，接着是人类，然后我们一直到了月球但没有着陆，最后我们实现了真正着陆月球的任务。自动驾驶汽车也是如此。我们正在对自动驾驶汽车进行仿真。我们在私有土地的受控情况下对自动驾驶汽车进行测试。我们在公共道路上对自动驾驶汽车进行测试，通常需要满足监管要求，例如在车内配备一名工程师或同等人员以便在需要时接管控制权。等等。需要各种大小的实验来找出哪些方法有效，哪些行不通。


    ## 创新


    AI 领域已经取得了一些进展，让我们朝着自动驾驶汽车迈进。我们需要更多的进展。要实现真正的自动驾驶汽车，需要技术方方面面的创新。我们绝不是已经掌握了到达那里所需的一切。预计会有新发明、新方法、新算法等不断出现。


    ## 挫折


    大多数专家都在避而不谈论自动驾驶汽车进展过程中的潜在挫折。登上月球涉及许多挫折，其中一些你是从未听过的，而且它们在当时由于被掩盖了，以防打击人们对登月的热情和资金投入。我包含的许多文章中反复出现的主题是，在我们尝试实现真正的自动驾驶汽车时，将会遇到挫折。深吸一口气，做好准备。我只希望挫折不会完全停止进展。我确定它会导致进展以一种我们在自动驾驶汽车领域尚未见过的方式发生改变。我将今天的自动驾驶汽车比作大家对
    `Uber` 刚起时的那种兴奋。今天，我们对 `Uber` 有了不同的看法，随着时间的推移，共享出行业务的监管越来越多，引发的担忧也越来越多。宠儿只有一直一直是宠儿，直到那个孩子最终闹起脾来。自动驾驶汽车也将如此。


    ## 自动驾驶汽车的挑战


    但你可能会问，究竟是什么让拥有真正的自动驾驶汽车如此困难。你已经看了多年年的巡航控制。你最近看到了可以并排停车的汽车。你看到过 `Tesla` 驾驶员的 YouTube
    视频，他们在汽车在公路上疾驰时把手伸出窗外，因此看到他们坐在一辆自动驾驶汽车中。我们不是只需要在车上再安装几个传感器，就能拥有真正的自动驾驶汽车了吗？并不是的。


    请考虑一下驾驶任务的本质。我们并不会让任何年龄段的人开车。在全球范围内，大多数国家在 18 岁之前不会颁发驾照，尽管许多国家允许在 15 岁或 16 岁获得学习许可。有人建议年龄较小身体太小，无法触及汽车的控制装置。尽管可能如此，但我们可以轻松调整控制装置以适应更小、因此身材更矮的人。重要的不是他们的身体尺寸，而是他们的认知发展。


    要开车，你需要能够对汽车进行推理，了解汽车能做什么不能做什么。你需要知道如何操作汽车。你需要了解道路上其他汽车是如何行驶的。你需要了解驾驶中的允许行为，例如限速和在标记好的车道内行驶。你需要能够对情况做出反应，并能够避免发生事故。你需要确定何时刹车，何时避让行人，以及如何避免撞上那辆刚刚横插你车道的摩托车手手。


    我们中的许多人曾上过驾驶课程。我们学习过驾驶并接受过驾驶培训。我们必须参加考试并通过才能开车。这一点在于，尽管大多数成年人认为驾驶任务是理所当然的，而且我们经常“心不在焉”地开车，但开车过程中投入了大量的认知努力。过段时间，它就变成了本能。你不会特意考虑你是如何开车的，你只是那样做。但是，如果你观察一个新手司机，比如一个正在学驾驶的青少年，你会突然发现复杂性比我们意识到的要大得多。


    此外，驾驶是一项非常严肃的任务。我记得我的女儿和儿子第一次学开车时。他们都是非常负责任的人。他们希望确保无论他们做什么，都能做好，并且不伤害任何人。每天当你坐进一辆车里，那可能是一个大约
    4,000 磅沉重的金属和塑料（约两吨），它是一件致命武器。想想看。你驾驶着一个重两吨的物体在街道上行驶，有了引擎它可以加速并撞击任何东西。

