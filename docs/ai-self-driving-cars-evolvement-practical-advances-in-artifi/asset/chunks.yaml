    _090617\\_v9a\\_tag.pdf\n\nThe version 3.0 report is here:\n\n https://www.transportation.gov/sites/dot.gov/files/docs/policy-initiatives/automated-vehicles/320711/preparing-future-transportation-automated-vehicle-30.pdf\n\
    \nI had earlier mentioned the Uber safety report, which is here: https://www.uber.com/info/atg/safety/\n\
    \nI also had mentioned the Zoox safety report, which is here: https://zoox.com/safety/\n\
    \nYou would also likely find of us the Waymo safety report, which is here: https://waymo.com/safety/\n\
    \nI’d also like to give a shout out to Dr. Philip Koopman, a professor at CMU\
    \ that has done extensive AI safety related research, which you can find at his\
    \ CMU web site or at this company web site: https://edge-case-research.com/\n\n\
    As a former university professor, I too used to do research while at my university\
    \ and also did so via an outside company. It’s a great way to try and infuse the\
    \ core foundational research that you typically do in a university setting with\
    \ the more applied kind of efforts that you do while in industry. \n\nI found\
    \ it a handy combination. Philip and I seem to also end-up at many of the same\
    \ AI self-driving car conferences and do so as speaker, panelists, or interested\
    \ participants.\n\nConclusion\n\nFor those Chief Safety Officers of AI self-driving\
    \ car firms that I’ve not mentioned herein, you are welcome to let me know that\
    \ you’d like to be included in future updates that I do on this topic. Plus, if\
    \ you have safety reports akin to the ones I’ve listed, I welcome taking a look\
    \ at those reports and will be glad to mention those too.\n\nOne concern being\
    \ expressed about the AI self-driving car industry is whether the matter of safety\
    \ is being undertaken in a secretive manner that tends to keep each other of the\
    \ auto makers or tech firms in the dark about what the other firms are doing.\
