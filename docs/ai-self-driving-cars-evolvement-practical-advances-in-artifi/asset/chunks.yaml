  trans: '

    我知道你们中的大多数人可能都是老练的司机，或许认为不仅使用车辆控制装置是易事，而且将它们整合成一系列努力以实现更大的目标（例如在街道上行驶并转弯）也是理所当然的。正如之前提到的，我认为每天都有数亿人做着这件事，这简直是一个奇迹，而我们还没有陷入完全的混乱和骚乱。你们能让这么多人去做诸如平衡支票之的事情吗？开车要困难得多，令人惊讶的是，我们已经让每个人在大多数时候都做得相当不错。


    ## 这与 AI 自动驾驶汽车有什么关系？


    在网络人工智能自动驾驶汽车研究所（Cybernetic AI Self-Driving Car Institute），我们正在为自动驾驶汽车开发 AI 软件。AI
    自动驾驶汽车的一个核心方面是 AI 系统对车辆控制的使用。这比表面看到的要复杂得多。


    允许我详细说明。


    我想先澄清并介绍 AI 自动驾驶汽车分为不同等级的概念。最高级别被认为是 `Level 5`。`Level 5` 自动驾驶汽车是由 AI 驾驶的，没有人类驾驶员参与。为了设计
    `Level 5` 自动驾驶汽车，汽车制造商甚至去掉了油门、刹车板和方向盘，因为这些都是人类驾驶员使用的装置。`Level 5` 自动驾驶汽车不是由人类驾驶的，也不预期人类驾驶员出现在自动驾驶汽车内。驾驶汽车完全由
    AI 承担任。


    对于低于 `Level 5` 的自动驾驶汽车，车内必须有人类驾驶员。目前，人类驾驶员被认为是车辆行为的责任方。AI 和人类驾驶员共同承担驾驶任务。尽管有这种共享，人类仍应该保持完全沉浸在驾驶任务中，并随时准备执行驾驶任务。我多次警告过这种共享安排的危险性，并预测它将产生许多意外的结果。


    让我们在这里关注真正的 `Level 5` 自动驾驶汽车。


    许多评论也适用于低于 `Level 5` 的自动驾驶汽车，但全自动 AI 自动驾驶汽车将在讨论中获得最多的关注。


    ### 以下是 AI 驾驶任务涉及的通常步骤：


    *   传感器数据采集与解释

    *   传感器融合

    *   虚拟世界模型更新

    *   AI 动作规划

    *   车辆控制指令发布


    AI 自动驾驶汽车的另一个关键方面是，它们也将在人类驾驶汽车中穿行。一些 AI 自动驾驶汽车的专家不断提到一个公共道路上只有 AI 自动驾驶汽车的乌托邦世界。目前，仅美国就有约
    2.5 亿辆传统汽车，这些汽车不会一夜之间神奇地消失或变成真正的 `Level 5` AI 自动驾驶汽车。


    事实上，人类驾驶汽车的使用将持续多年，可能持续几十年，而 AI 自动驾驶汽车的出现将在道路上仍有人类驾驶汽车的情况下。


    这是一个关键点，因为这意味着自动驾驶汽车的 AI 不仅需要与其他的 AI 自动驾驶汽车竞争，还需要与人类驾驶汽车竞争。想象一个公共道路上只有 AI 自动驾驶汽车的乌托邦世界很容易，但那并非现实。

    '
- fmt: '

    Typically, most cars use the Controller Area Network (CAN) vehicle bus as the
    standard for electronic communications within the car and between the myriad of
    subsystems. This message-based protocol is both loved and reviled.


    First conceived of and released as a formal protocol in the mid-1980s, it has
    expanded and adapted over the years. There are numerous complimentary protocols
    that emerged to deal with facets such as device addressing issues, flow control
    capabilities, and other matters. Weaknesses and qualms often center around CAN’s
    lack of robust security features and difficulties that can ensue when doing troubleshooting
    of CAN-related problems.


    Generally, it is best to try and keep the AI system above the fray about the `CAN`
    network, though there needs to be a healthy dose of skepticism built into the
    AI about what happens once messages are flowing in the `CAN` and throughout the
    self-driving car. The AI cannot assume that there will be a perfect conveyance
    of messages. The AI cannot assume that the conveyance will necessarily happen
    in as timely a manner as might be otherwise expected. The real-world limitations
    need to be encompassed by however the AI is going to be expecting the car controls
    commands to be carried out.


    In fact, let’s look briefly at each of the six major steps and consider the types
    of errors or problems that can arise.


    ![](images/00006.jpeg)


    Take a look at Figure 2.


    ### Step 1: Determining commands

    In the first step, determining the car controls commands to emit, it is conceivable
    that the AI might fail to arrive at a set of car controls commands that it wants
    to have performed. Perhaps the AI gets gummed up trying to decide what car control
    commands to use. Maybe the AI hits a snag in the processing, or maybe there’s
    a bug in the system, or maybe the circumstance of the status of the self-driving
    car has baffled the AI.


    Those are obviously bad possibilities. This is why my framework for AI self-driving
    cars includes the need for the AI to have a self-aware capability that is double
    checking what the AI system itself is doing. There also needs to be fail-safe
    features. One of the more intriguing aspects that some are pursuing includes the
    idea of using AI arguing machines to try and catch these moments when the AI is
    not seeming to get the job done.


    ### Step 2: Emitting commands

    For the second step of emitting the car controls commands, there is a possibility
    that the commands might be garbled by how they have been formatted or during their
    conveyance to the `ECU`. This sets up a rather dangerous situation. If the commands
    perchance are not intelligible when reaching the `ECU`, there’s a good chance
    that the `ECU` will realize something has gone awry, but if the commands are perchance
    intelligible, the `ECU` is likely going to try and act on them, though they aren’t
    what was emitted. In essence, the receiving of a wrong set of commands is bound
    to be worse than commands that are so unintelligible that they are obviously incorrect
    and improper.


    ### Step 3: Checkpointing

    Step three is an effort to checkpoint that the car control commands have indeed
    been received and an attempt to verify they are what was actually intended. This
    is a last-moment layer of defense against executing car controls that weren’t
    what was emitted to be undertaken. Note though that this checkpoint is not second-guessing
    the first two steps, since even if those steps have provided commands that might
    get the car into an untoward traffic situation, that’s not what this third step
    is trying to ascertain.


    ### Step 4: Translation

    In the fourth step, the car controls commands are translated into the myriad of
    other electronic messages that must be sent along the `CAN` to the subsystems
    of the self-driving car. This is when the physical operational activities are
    being established based on the car controls commands that were provided by step
    one and step two, and were verified in step three. There are lots of opportunities
    for things to go south at this juncture. Imagine sending boats along a river with
    lots of tributaries, and any of those boats might go astray.


    ### Step 5: Execution

    During step five, the operational activities are now being carried out, such as
    the brakes being applied to the tires and the car beginning to slow down or the
    accelerated applied and the car starting to speed-up. Assuming that the car controls
    commands actually reached the subsystems in step four, this step five is the actual
    enactment of those commands. Things can go wrong. Suppose the brakes aren’t working
    right? Suppose the engine is not responsive?


    ### Step 6: Verification

    At step six, there is a need to ascertain that the car controls commands were
    carried out. As a human driver, when you wrench the steering wheel to a hard right,
    you can feel as the car makes the right lurching motion. This is your way of ascertaining
    that your command, the steering wheel movement, got translated into the actual
    operational and physical outcome. The AI system has to do the same kind of sensing
    to realize whether or not the car controls commands were executed, which requires
    using the sensors such as the cameras, radar, `LIDAR`, and internally focused
    ones like the `IMU`.


    Each of the six major steps takes time to undertake. The AI system during the
    action planning portion has to gauge how long each of those steps might take and
    use that estimation to determine what is feasible to do. If the amount of time
    to apply the brakes, let’s say, would exceed what the AI wants to do in terms
    of the necessity of trying to slow down or halt the self-driving car, the AI would
    need to ascertain what another alternative might be pursued instead. For example,
    if the braking cannot be done in time, would it be possible to turn the steering
    wheel in time, and avoid whatever collision is about to occur?


    As might be rather evident, the AI system cannot just emit car controls commands
    and walk away from the effort. The AI has to ascertain whether or not the car
    controls commands were properly and appropriately disseminated and performed.
    This includes not just that the commands themselves were abided by, but it also
    includes that the timing of the effort went as planned too. The AI has to be ready
    to deal with contingencies in case the commands are improperly conveyed, or improperly
    executed, or executed on a delayed basis, etc. As a human driver, you likely sometimes
    change your mind while driving the car and suddenly do something contrary to what
    you had done, such as my earlier example of radically going from speeding up to
    suddenly slowing down. Can the AI “change its mind” in terms of opting to do something
    different than what it has already started to? The answer is yes, the AI can opt
    to try and change what it was trying to do. This can be problematic to execute.
    If the AI can catch the emitted commands before the `ECU` starts to push them
    along the self-driving car subsystems, those commands can be potentially suppressed.
    That’s a kind of undo. If the commands are already in-flight of being performed
    by the physical elements of the self-driving car, there’s not much chance of an
    undo, and instead the AI would likely need to emit a new set of car controls commands,
    seeking to get those executed right away (such as doing a braking on top of having
    just done a speeding up action).


    Suppose the AI emits commands to turn the steering wheel so radically that it
    would cause the self-driving car to topple over and roll onto its roof. What step
    should catch that aspect? Even if it is caught, does the act itself mean that
    it should never be executed? Perhaps the AI has ascertained that making such a
    radical turn is worth the risk, namely that it is “better” to turn and roll over
    the self-driving car versus say ramming into a truck that’s filled with petrol
    and would explode upon impact.

    '
