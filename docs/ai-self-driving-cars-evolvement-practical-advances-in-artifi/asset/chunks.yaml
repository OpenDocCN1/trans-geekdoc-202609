  trans: '


    还记得那辆之前超过过我的车吗？它变成了一头蛰伏的猛兽。司机似乎很担心会被困在拥堵的交通中。我能看到那辆车正向自行车道略微挤压。起初，这仅仅是一次轻微的侵入。我直觉认为司机是在试探，看他是否可以直接进入自行车道，以此作为逃离停滞交通的手段，并超过那些被困在车群中的其他“羊群”之辈。


    我移动到自行车道的最右侧，几乎贴着路缘。这是我采取的防御性准备动作。我的双手稳稳地按在自行车的刹车手上，准备在需要时刹车。我观察着那辆正慢慢挪入自行车道的轮胎，看到司机在向自行车道倾斜角度时变得变得越来越果断。


    果不其然，他随后完全驶入了自行车道，这不仅对我很危险，而且道里还有其他骑行者。那个鲁莽的司机完全扰乱了所有的骑行者，并不是因为汽车真的撞击了他们，而是因为所有的骑行者为了躲避这辆闯入的汽车，像保龄球道上的球瓶一样向左向右地闪避。你看过法国的电视自行车赛吗？见过那些骑行者似乎同时倒地并碰撞的时刻，这里的情况大同小。老天啊（Sacre
    Bleu）！


    有时候，微动作可以通过汽车本身以外的东西来信号。


    例如，人类司机会将手臂伸出驾驶员侧窗外示意让你绕过他们，或者他们可能会指向前方的某个地方，警告你路上有一个大坑。然而，手部动作可能会让人困惑，有时并不意味着汽车移动的指示。


    前几天，我目睹一个司机将手和手臂完全伸出窗外，似乎在非常疯狂地上下挥动着肢体，我不确定这可能预示着什么。也许是地球裂开了一个巨大的沉陷坑，前面的路仅仅是一个巨大的深沟？当我选择绕过那辆车，心想着我需要保持警惕并应对可能遇到的任何情况时，我听到车内扬声器里放着响亮的音乐——我推测那些手部和手臂动作只是他随音乐节拍的方式。


    司机的头部可以是关于驾驶行为的另一种线索。我确定你也有过在开车时能看到前面那辆车里司机头部的情况。司机可能向右转头，你就能预测出司机将尝试切入右侧车道或开始向右转。


    另一种头部信号是点头，通常用在四路路口，当另一位司机借此示意你可以该先走，或者他们想先行。


    让我们关注由实际汽车所证明的汽车微动作，暂时搁开人类自身可能通过自己的身体采取的那些微动作。


    以下是微动作出现的一些关键方式：


    * 汽车车轮的倾斜

    * 车辆向左倾斜

    * 车辆向右倾斜

    * 车辆的断续动作（突然的动作）

    * 车辆俯冲

    * 点刹车

    * 等等


    某些微动作是细微的，但另一些则更明显。有时候，微动作可以通过汽车本身以外的东西来信号。例如，人类司机会将手臂伸出驾驶员侧窗外示意让你绕过他们，或者他们可能会指向前方的某个地方，警告你路上有一个大坑。然而，手部动作可能会让人困惑，有时并不意味着汽车移动的指示。


    前几天，我目睹一个司机将手和手臂完全伸出窗外，似乎在非常疯狂地上下挥动着肢体，我不确定这可能预示着什么。也许是地球裂开了一个巨大的沉陷坑，前面的路仅仅是一个巨大的深沟？当我选择绕过那辆车，心想着我需要保持警惕并应对可能遇到的任何情况时，我听到车内扬声器里放着响亮的音乐——我推测那些手部和手臂动作只是他随音乐节拍的方式。


    司机的头部可以是关于驾驶行为的另一种线索。我确定你也有过在开车时能看到前面那辆车里司机头部的情况。司机可能向右转头，你就能预测出司机将尝试切入右侧车道或开始向右转。


    另一种头部信号是点头，通常用在四路路口，当另一位司机借此示意你可以该先走，或者他们想先行。


    某些微动作可能是微妙的，但另一些则更明显。有时候，微动作可以通过汽车本身以外的东西来信号。例如，人类司机会将手臂伸出驾驶员侧窗外示意让你绕过他们，或者他们可能会指向前方的某个地方，警告你路上有一个大坑。然而，手部动作可能会让人困惑，有时并不意味着汽车移动的指示。


    这强调了我之前关于微动作的观点。有些人能注意到它们，有些人则不能。它还强调了另一个重要点。你无法对微动作做出断的判断，因为无法保证它最终会变成一个完整的动作。并不是所有的线索都会显现。你需要评估每一个动作，结合具体情况，并确定该微动作是否具有实质性意义。


    让我们也明确哪些**不是**微动作。如果有人完全转动方向盘来完成一个转弯，我认为我们不能真的将其视为微动作。只有当司机只是略微倾斜了车轮，也许是为了给转弯做准备，或者他们只是潜意识地开始转弯时，这些才是微动作的情况。


    研究微动作的方法之一通常涉及观察青少年新手司机。有些新手司机会把他们做的每一个驾驶动作都夸张。当他们被告诉要在前方拐角转弯时，他们提前四分之一英里就开始转弯了。当他们看到停止牌时，即使距离一个足球场那么远，新手司机通常也会开始点刹车，让车慢下来，非常慢，真的非常慢。


    那些往往是夸张的微动作。大多数老练的司机倾向于做出更微妙的微动作。那些经验丰富的司机，这些动作已经根植骨子里。他们并不一定意识到自己正在使用微动作。


    就像我之前关于那个玩扑克的朋友最终利用了他的线索的故事一样，有些精明的司机喜欢以剥削的方式来使用他们的微动作。这些司机通常认为其他司机会注意到微动作，然后退让或以其他方式让给使用微动作的司机。


