  trans: '

    同样的认知失调在 L3 级汽车上会更加明显。人类驾驶员在使用其 L3 级汽车的“心理理论”（Theory of Mind）方面面临着更大的障碍和负担，而且这些人类驾驶员很可能没有意识到这些功能，或者对它们感到困惑。这是一个潜在的灾难根源。


    ## 关键点 #7：复杂系统的测试


    媒体上关于 `MCAS` 是如何进行测试的讨论一直在进行。我并不打算探究这方面的细节。无论如何，这确实引发了关于如何测试先进自动化系统的思考。


    假设我们对一个先进自动化系统进行测试，以确保它的运行看起来符合设计初衷。也许你对其进行了仿真。也许对于航空航电子系统，你可能会在风洞中对其进行测试；或者对于
    AI 自驾驶汽车，你可能会将其带到试验场或封闭式赛道。


    如果测试仅仅关于系统是否按预期执行，那么它可能会以高分通过。然而，测试中是否包含了当出现故障时会发生什么呢？


    假设某个传感器发生故障，会发生什么？我确实遇到工程师告诉我，规范中根本没有提到关于传感器发生故障的内容，因此他们没有开发任何处理该方面的方案；因此，测试故障传感器是没有意义的，因为他们可以明确告诉你，系统在设计和编程时并没有考虑到要处理这种情况。


    另一种类型的测试涉及 `HMI`（人机交互）方面和人类操作员。


    如果先进自动化系统旨在与人类操作员协同工作，你就应该进行测试，观察这是否真的如预期那样运作。我经常看到的一个笑话是：对人类操作员进行培训，然后立即让该操作员对系统进行测试。这很方便，但如果一周后人类操作员忘记了某些培训内容怎么办？另外，对于那些接受过很少或完全没有培训的人类操作员怎么办？工程师告诉我，他们不会测试这种这种情况，因为他们事先被告知所有人类操作员都将获得必要的培训。


    ## 关键点 #8：公司与开发团队


    通常，先进自动化系统的设计、开发、测试和部署是大型团队的一部分，并在整体组织内完成，这些组织塑造了这些工作的开展方式。


    关于设计性质的关键决策通常不是由一个人做出的。这是一项集体努力。在这个过程中可能会出现妥协。关于设计是什么或将要做什么，可能会出现误解。这种情况在开发期间可能发生，在测试期间可能发生，在部署期间也可能发生。


    我的观点是，很容易陷入一种心理陷阱，只关注技术本身，无论它是飞机还是自驾驶汽车。你还需要考虑该产物产生的更广泛的背景。这种努力是一个信息充分且深思熟虑的方法，还是说这种方法本身导致了问题或缺陷引入到了最终结果中？


    ## 关键点 #9：先进系统的安全考量


    当你仔细考虑时，今天飞机的安全记录确实非常惊人。


    这并非偶然。人们对飞行安全有着极高的重视。它被融入到飞机设计、开发、测试和部署的每一个步骤中，并贯穿于其日常运营之中。尽管人们时刻将安全放在首位，事情有时仍然会出问题。


    在 AI 自驾驶汽车方面，我建议目前的安全意识还没有那么强，我们需要进一步推力，以变得更强的安全意识。


    我曾敦促汽车制造商和科技公司设立“首席安全官”（`Chief Safety Officer`），负责确保在 AI 自驾驶汽车的设计、制造、测试和部署过程中发生的一切事中，安全都是核心关注点。


    AI 自驾驶汽车中有许多需要融入的步骤可以提高其安全性，如果没有这些步骤，我预言我们将看到事态变得糟糕，AI 自驾驶汽车的梦想可能会推迟或破灭。


    ##结论


    当你仔细考虑时，今天飞机的安全记录确实非常惊人。


    这并非偶然。人们对飞行安全有着极高的重视。它被融入到飞机设计、开发、测试和部署的每一个步骤中，并贯穿于其日常运营之中。尽管人们时刻将安全放在首位，事情有时仍然会出问题。


    在 AI 自驾驶汽车方面，我建议目前的安全意识还没有那么强，我们需要进一步推力，以变得更强的安全意识。


    我曾敦促汽车制造商和科技公司设立“首席安全官”（`Chief Safety Officer`），负责确保在 AI 自驾驶汽车的设计、制造、测试和部署过程中发生的一切事中，安全都是核心关注点。


    AI 自驾驶汽车中有许多需要融入的步骤可以提高其安全性，如果没有这些步骤，我预言我们将看到事态变得糟糕，AI 自驾驶汽车的梦想可能会推迟或破灭。


    ## 结论


    当你仔细考虑时，今天飞机的安全记录确实非常惊人。


    这并非偶然。人们对飞行安全有着极高的重视。它被融入到飞机设计，开发，测试和部署的每一个步骤中，并贯穿于其日常运营之中。尽管人们时刻将安全放在首位，事情有时仍然会出问题。


    在 AI 自驾驶汽车方面，我建议目前的安全意识还没有那么强，我们需要进一步推力，以变得更强的安全意识。


    我曾敦促汽车制造商和科技公司设立“首席安全官”（`Chief Safety Officer`），负责确保在 AI 自驾驶汽车的设计、制造、测试和部署过程中发生的一切事中，安全都是核心关注点。


    AI 自驾驶汽车中有许多需要融入的步骤可以提高其安全性，如果没有这些步骤，我预言我们将看到事态变得糟糕，AI 自驾驶汽车的梦想可能会推迟或破灭。


