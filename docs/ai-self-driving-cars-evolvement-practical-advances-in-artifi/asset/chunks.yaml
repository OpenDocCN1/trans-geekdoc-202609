    \ that it would behoove those AI efforts already underway to be thinking about\
    \ the points I’ll be bringing up.\n\nAllow me to fervently clarify that the points\
    \ I’ll raise are not dependent on how the investigations bear out about the Boeing\
    \ 737 MAX 8 incidents. Instead, my points are at a level of abstraction that they\
    \ are useful for AI systems efforts, regardless of what the final reporting says\
    \ about the flight crashes. That being said, it could very well be that the flight\
    \ crash investigations undercover other and additional useful points, all of which\
    \ could further be applied to how we think about and approach AI systems.\n\n\
    As you read herein the brief recap about the flight crashes and the aircraft,\
    \ allow yourself the latitude that we don’t yet know what really happened. Therefore,\
    \ the discussion is by-and-large of a tentative nature.\n\nNew facts are likely\
    \ to emerge. Viewpoints might change over time. In any case, I’ll try to repeatedly\
    \ state that the aspects being described are tentative and you should refrain\
    \ from judging those aspects, allowing your mind to focus on how the points can\
    \ be used for enhancing AI systems. \n\nEven something that turns out to not have\
    \ been true in the flight crashes can nonetheless still present a possibility\
    \ of something that could have happened, and for which we can leverage that understanding\
    \ to the advantage of AI systems adoption.\n\nSo, do not trample on this discussion\
    \ because you find something amiss about a characterization of the aircraft and/or\
    \ the incident. Look past any such transgression. Consider whether the points\
    \ surfaced can be helpful to AI developers and to those organizations embarking\
    \ upon crafting AI systems. That’s what this is about.\n\nBackground About the\
    \ Boeing 737 MAX 8\n\nThe Boeing 737 was first flown in late 1960’s and spawned\
    \ a multitude of variants over the years, including in the 1990s the Boeing 737\
    \ NG (Next Generation) series. Considered the most selling aircraft for commercial\
    \ flight, last year the Boeing 737 model surpassed sales of 10,000 units sold.\
    \ It is composed of twin jets, a relatively narrow body, and intended for a flight\
    \ range of short to medium distances. The successor to the NG series is the Boeing\
    \ 737 MAX series.\n\nAs part of the family of Boeing 737’s, the MAX series is\
    \ based on the prior 737 designs and was purposely re-engined by Boeing, along\
    \ with having changes made to the aerodynamics and the airframe, doing so to make\
    \ key improvements including a lowered burn rate of fuel and other aspects that\
    \ would make the plane more efficient and have a longer range than its prior versions.\
    \ The initial approval to proceed with the Boeing 737 MAX series was signified\
    \ by the Boeing board of directors in August 2011.\n\nPer many news reports, there\
    \ were discussions within Boeing about whether to start anew and craft a brand-new\
    \ design for the Boeing 737 MAX series or whether to continue and retrofit the\
    \ design. The decision was made to retrofit the prior design.  \n\nOf the changes\
    \ made to prior designs, perhaps the most notable element consisted of mounting\
    \ the engines further forward and higher than had been done for prior models.\
    \ This design change tended to have an upward pitching effect on the plane. It\
    \ was more so prone to this than prior versions, as a result of the more powerful\
    \ engines being used (having greater thrust capacity) and the positioning at a\
    \ higher and more pronounced forward position on the aircraft.\n\nAs to a possibility\
    \ of the Boeing 737 MAX entering into a potential stall during flight due to this\
    \ retrofitted approach, particularly doing so in a situation where the flaps are\
    \ retracted and at low-speed and with a nose-up condition, the retrofit design\
    \ added a new system called the MCAS (Maneuvering Characteristics Augmentation\
    \ System).\n\nThe MCAS is essentially software that receives sensor data and then\
    \ based on the readings will attempt to trim down the nose in an effort to avoid\
    \ having the plane get into a dangerous nose-up stall during flight. This is considered\
    \ a stall prevention system.\n\nThe primary sensor used by the MCAS consists of\
    \ an AOA (Angle of Attack) sensor, which is a hardware device mounted on the plane\
    \ and transmits data within the plane, including feeding of the data to the MCAS\
    \ system. In many respects, the AOA is a relatively simple kind of sensor and\
    \ variants of AOA’s in term of brands, models, and designs exist on most modern-day\
    \ airplanes. This is to point out that there is nothing unusual per se about the\
    \ use of AOA sensors, it is a common practice to use AOA sensors.\n\nAlgorithms\
    \ used in the MCAS were intended to try and ascertain whether the plane might\
    \ be in a dangerous condition as based on the AOA data being reported and in conjunction\
    \ with the airspeed and altitude. If the MCAS software calculated what was considered\
    \ a dangerous condition, the MCAS would then activate to fly the plane so that\
    \ the nose would be brought downward to try and obviate the dangerous upward-nose\
    \ potential-stall condition.\n\nThe MCAS was devised such that it would automatically\
    \ activate to fly the plane based on the AOA readings and based on its own calculations\
    \ about a potentially dangerous condition. This activation occurs without notifying\
    \ the human pilot and is considered an automatic engagement.\n\nNote that the\
    \ human pilot does not overtly act to engage the MCAS per se, instead the MCAS\
    \ is essentially always on and detecting whether it should engage or not (unless\
    \ the human pilot opts to entirely turn it off).\n\nDuring a MCAS engagement,\
    \ if a human pilot tries to trim the plane and uses a switch on the yoke to do\
    \ so, the MCAS becomes temporarily disengaged. In a sense, the human pilot and\
    \ the MCAS automated system are co-sharing the flight controls. This is an important\
    \ point since the MCAS is still considered active and ready to re-engage on its\
    \ own.\n\nA human pilot can entirely disengage the MCAS and turn it off, if the\
    \ human pilot believes that turning off the MCAS activation is warranted. It is\
    \ not difficult to turn off the MCAS, though it presumably would rarely if ever\
    \ be turned off and might be considered an extraordinary and seldom action that\
    \ would be undertaken by a pilot. Since the MCAS is considered an essential element\
    \ of the plane, turning off the MCAS would be a serious act and not be done without\
    \ presumably the human pilot considering the tradeoffs in doing so."
