  trans: '

    在这种情况下，骑车者想要转向前方的汽车似乎并不符合逻辑。真是个愚蠢的行为！但我们并不知道这是否真的是一个愚蠢的行为，因为可能发生了其他与骑车者相关的其他情况。假设一个牵着牵引绳狗的行人不小心放跑了狗，狗正向马路冲去。骑车者看到飞冲而来的狗，决定尝试向狗的左侧避让，但可能没有意识到旁边的汽车正在停止，并可能选择切入其车道。


    在虚拟世界模型中，AI 系统是否对行人和狗进行了建模？也许图像处理无法检测到这些物体，又或许行人和狗被灯柱等其他物体遮挡了。在这种情况下，AI 动作规划器处于“盲目”，无法感知那里站着一个带着狗的行人，以及狗已经跑脱了绳。


    请注意，这涉及了关于 `Bounded Volumes`（边界体积）和虚拟世界模型的多个方面。


    如果虚拟模型中没有真实世界对象的表示，是因为这些真实对象没有被图像处理检测到，这意味着 AI 系统必须应对一个无法准确描述真实世界的虚拟世界。AI 动作规划器可能会根据这些遗漏的信息做出关乎生死的驾驶决策，从而导致灾难。


    假设图像处理不确定转角处的团块是什么，而它是由一个遛狗的人组成的（这个人可以在灯柱的另一侧被检测到），且图像处理可以察觉到那里有东西，一种无法识别的斑块。图像处理可能无法对其进行分类，但至少可以在虚拟世界模型中标记那里有一个物体，并赋予一个封装该斑块的
    `Bounded Volume`。


    一旦狗跑脱，希望这能被摄像头检测到，此时图像处理现在能够识别出那里有一个行人和一只狗（两个独立的物体），而它们是之前在该位置发布的整体斑块。虚拟世界模型随后会相应进行更新。


    为什么狗现在成为一个独立的 `Bounded Volume` 这很重要？作为一种分类，“狗”意味着你可以预测其行为的多个各个方面。狗可以以特定的方式、特定的速度移动。人类也可以以特定的方式、特定的速度移动。物体的分类有助于预测物体可能会做什么。它辅助
    AI 动作规划器决定要采取的行动。


    让我们暂时想象一下，那只狗变成了行人放掉并正向马路滚动的滑板。我之所以这么说，是因为我即将提出的建议。如果 AI 动作规划器必须计算为了救骑车者的生命需要撞击什么，我认为我们都会同意撞击滑板是更优的方案。这凸显了
    AI 系统需要实时做出的这类伦理选择。


    你构建用于表示物体的 `Bounded Volume` 需要足够大以容纳整个物体，但又不能大到不必要地膨胀实际物体的尺寸。在尝试从自动驾驶汽车与前方的骑车者之间穿过的情况下，如果骑车者的
    `BV` 过大，它可能会否定在骑车者和前方的汽车之间穿行的可能性，尽管在现实中这可能是可行的。


    另一方面，如果 `BV` 过于紧贴，可能会因为离真实世界物体太近而产生撞击物体的误判。这回到了之前的观点，即在表示真实世界对象方面，`BV` 应该达到一个合适的“金太湖尺寸”（Goldilocks
    size）。


    虚拟世界模型最核心的方面之一涉及判断两个或多个 `Bounded Volumes` 是否会交叉。例如，如果代表自动驾驶汽车的 `Bounded Volume`
    或虚拟容器将与骑车者的 `Bounded Volume` 或虚拟容器相交，这需要由 AI 动作规划器进行预测并处理。


    如果预计两个或多个 `Bounded Volumes` 会交叉，就会产生碰撞的可能性。我使用“碰撞”（collision）一词是指两个物体在物理意义上实际擦过或撞击彼此。当我使用“交叉”（intersecting）一词时，意味着存在实际碰撞的可能，尽管其本身并不一定是碰撞。这取决于我们为涉及的
    `Bounded Volumes` 的膨胀尺寸。


    假设骑车者由一个是其实尺寸两倍的 `BV` 表示。这意味着了一种虚拟缓冲区或缓冲，允许真实世界对象在我们构思的虚拟容器内有活动余地。


    自动驾驶汽车进入骑车者的 `Bounded Volume` 可能实际上不会撞到骑车者，因为虚拟容器内有额外的空间。从某种意义上说，`BV` 的膨胀尺寸可以为另一个
    `BV` 提供误差空间而不实际触及其中的真实物体。


    我确定你可能以同样的方式看待你自己的汽车。你往往觉得在汽车实际尺寸之外还有几英寸的外部边界。当你试图将车停在一个狭窄的停车位上时，你潜意识里知道自己有一点空间缓冲。当你越来越靠近另一辆停好的汽车时，你开始担心自己是否破坏了那种缓冲，并靠得太近而擦到或划伤另一辆车。


    这也提到了之前关于汽车悬悬或突出部分的话题。


    如果你的汽车有一根高出车顶几英尺的天线，你往往倾向于忽略天线不属于 `Bounded Volume` 的一部分，认为如果它撞到东西，它只会轻微碰撞并弹回。另一方面，你的后视镜通常必须包含在
    `Bounded Volume` 的感知中，因为在停车时如果擦到后视镜可能会导致损坏（如今许多汽车重新设计了后视镜，使其在触碰时可以向内折叠，增加了位置灵活性）。


    还记得那辆车顶垂着杆子的汽车吗？你认为那辆汽车的 `Bounded Volume`应该是？你可以让 `Bounded Volume` 只包含汽车而不包含垂挂杆的额外部分，但这意味着
    AI 自动驾驶汽车可能不会计算碰撞这些垂挂杆的可能性。如果你让 `Bounded Volume` 包含这些垂挂杆，其整体尺寸就会更大，并排除 AI 意识到它可能穿过这些杆子的机会，回想起我故事中的那辆跑车正是做到这一点的。


    沿着此类思路，另一个方面是 `Bounded Volume` 是立方体或长方体等规则形状，还是你希望它是不规则形状。通过使用不规则形状，你可能同时包含带有垂杆的汽车，同时也包含那些垂杆，而不是用一个试图涵盖这些者的单一立方体或长方体。形状将根据实际物体的轮廓量身定制。

