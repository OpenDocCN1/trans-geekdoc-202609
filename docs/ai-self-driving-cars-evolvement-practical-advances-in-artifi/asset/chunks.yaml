- fmt: "\nSome AI developers would say that detecting micro-movements won’t matter\
    \ in a world of entirely AI self-driving cars, since the AI self-driving cars\
    \ will presumably all be electronically communicating with each other via `V2V`\
    \ (vehicle-to-vehicle) communications. As such, in my example of being at a red\
    \ light and making a turn, if I was in an AI self-driving car it would have in-theory\
    \ sent a message to the eager beaver AI self-driving car behind me, and warned\
    \ it that my AI self-driving car might opt to surge ahead and yet might also then\
    \ hit the brakes, all because of trying to gauge the traffic situation.\n\nYes,\
    \ it is hopefully going to be the case that in an AI self-driving car world we’ll\
    \ see that kind of `V2V` taking place, but meanwhile we are all living here in\
    \ the real-world. As I earlier pointed out, for quite some time we are going to\
    \ have a mix of human driven cars and AI self-driving cars. Likely a long time.\
    \ \n\nWe cannot decide now to avoid putting in place capabilities that involve\
    \ dealing with human drivers. Pretending that everything will be fine once we\
    \ get to an all AI self-driving car world, if we ever do, it’s living in a dream\
    \ world. AI self-driving cars must be realistic and deal with a world of human\
    \ driven cars.\n\n### The Importance of Micro-movements\n\nIf you take a look\
    \ at many of the AI self-driving cars being tested on our roadways today, you\
    \ can often figure out that they aren’t using micro-movements to their advantage.\
    \ The stilted nature of the AI driving is a giveaway that the AI is not versed\
    \ in detecting, analyzing, and making use of the “tell” of human drivers making\
    \ micro-movements. In a sense, it is akin to a novice teenage driver that has\
    \ not yet figured out how to “read” other cars and the driving behaviors of other\
    \ drivers.\n\nNow, there are some AI developers that claim they are worried that\
    \ if they do include the detection and leveraging of human drivers’ micro-movements\
    \ that the AI will then potentially get confused or make worse decisions.\n\n\
    ### Challenges in Implementation\n\nWell, this really is more about how good or\
    \ how poorly the AI development of this feature is undertaken. Sure, if you do\
    \ a half-baked job of trying to leverage micro-movement detection, you might indeed\
    \ have your AI self-driving car do worse than if you did things the right way.\
    \ In my view, that would seem true about any of the capabilities you might opt\
    \ to include into the AI system. Capabilities that are inadequately put together\
    \ can be a burden and a problem, more so than an aid and a solution.\n\nI didn’t\
    \ say that adding the capability was going to be easy. In fact, I’ll readily state\
    \ that it is hard.\n\nTrying to use the sensors of an AI self-driving car to detect\
    \ that the wheels of a car ahead are slightly askew, it’s not easy, and you need\
    \ really good sensors and really good sensor processing software. The same can\
    \ be said about detecting when nearly any of the typical micro-movements are undertaken.\
    \ By definition, those movements are subtle. Picking up on the cues or tells of\
    \ other cars is hard for other human drivers to do, and admittedly hard for an\
    \ AI system to do.\n\n### Leveraging Machine Learning and Deep Learning\n\nFortunately,\
    \ you can leverage `Machine Learning` and `Deep Learning` to your advantage. By\
    \ training a deep or large-scale multi-layer artificial neural network with tons\
    \ of collected driving related data, based on human driven cars as they are driving\
    \ in regular human driving traffic, there are patterns of the micro-movement driving\
    \ that can be trained for.\n\nThese trained beforehand `Machine Learning` and\
    \ `Deep Learning` algorithms can then be included into the on-board AI system\
    \ of the self-driving car. In many respects, this is really just a deeper form\
    \ of those capabilities. The odds are that `Machine Learning` and `Deep Learning`\
    \ are already being used to examine sensory data for aspects such as street signs,\
    \ the presence of pedestrians, etc. The micro-movements are essentially a step\
    \ deeper into that kind of analysis.\n\n### Technical Constraints\n\nAs mentioned\
    \ earlier, there are some tough aspects about trying to achieve the inclusion\
    \ of the micro-movement analysis and usage capability. Will the cameras provide\
    \ sufficient visual detection to spot the micro-movement? Will the radar provide\
    \ sufficient detection? Will the `LIDAR` provide sufficient detection. Also, even\
    \ if you can get the sensory data, what about the added computer processing needed\
    \ to go deeply into the analysis, will that be on-board? Does that add cost, weight,\
    \ heat, or other concerns in terms of providing the AI self-driving car with this\
    \ capability?\n\nYou also need to realize that the micro-movement is not merely\
    \ about detection. Once you’ve detected a micro-movement, it needs to be populated\
    \ into the AI virtual world model. The `AI action planner` has to be then be versed\
    \ in what to do with the indications about the micro-movements. If the `AI action\
    \ planner` ignores the micro-movement detection, the whole effort is for naught.\n\
    \nThe `AI action planner` also has to deal with micro-movements that might not\
    \ be a true tell per se.\n\n### Interpretation and Context\n\nRecall that I earlier\
    \ mentioned that in poker playing you might be mistaken about someone’s tell.\
    \ Perhaps you thought that every time they rubbed their cards with their left\
    \ hand that it meant they were bluffing, but maybe that’s not a consistent tell\
    \ at all. Just because a car ahead of you might be leaning toward the bike lane,\
    \ it doesn’t necessarily mean that the car driver is going to bust into the bike\
    \ lane.\n\nIn this case, the AI needs to be able to include the micro-movements\
    \ as part of a larger picture or “understanding” of what is happening in the traffic\
    \ around the AI self-driving car. You cannot in isolation try to make use of the\
    \ micro-movements. When you are behind another car, you might have several minutes\
    \ to observe any of their micro-movements. By giving ample time to do so, their\
    \ pattern of driving behavior is likely to be more apparent than trying to make\
    \ a snap judgement.\n\n### Potential for Spoofing\n\nIt is also important to realize\
    \ that human drivers are going to try and spoof or prank AI self-driving cars.\
    \ This has already happened in instances of four-way stops, involving human drivers\
    \ that “intimidated” an AI self-driving car by rolling through the stop sign.\
    \ The AI was trained to wait until the other drivers came to a full stop. It was\
    \ the proper way to do things. Human drivers though aren’t necessarily “proper”\
    \ about how they drive.\n\nI mention this example of the four-way stop to also\
    \ point out that the interpretation of micro-movements of human drivers could\
    \ be a means for human drivers to trick the AI self-driving car. a kind of basketball-like\
    \ head fake and shift the direction of your wheels. It might not be due to actually\
    \ needing to turn the wheels, but instead a ploy to get the AI to perhaps grant\
    \ you that sought for parking spot or otherwise give you an advantage over the\
    \ AI system that’s driving the self-driving car.\n\nOverall, I am an advocate\
    \ of including the detection, analysis, and leveraging of human driving micro-movements\
    \ for the AI to be able to do a better job of driving a self-driving car. It isn’t\
    \ going to be easy to include this capability. It will though make for a more\
    \ life-like AI driving system and one that since it is going to be immersed among\
    \ human drivers could be considered an essential driving skill.\n"
  raw: "Some AI developers would say that detecting micro-movements won’t matter in\
    \ a world of entirely AI self-driving cars, since the AI self-driving cars will\
    \ presumably all be electronically communicating with each other via V2V (vehicle-to-vehicle)\
    \ communications. As such, in my example of being at a red light and making a\
    \ turn, if I was in an AI self-driving car it would have in-theory sent a message\
    \ to the eager beaver AI self-driving car behind me, and warned it that my AI\
    \ self-driving car might opt to surge ahead and yet might also then hit the brakes,\
    \ all because of trying to gauge the traffic situation.\n\nYes, it is hopefully\
    \ going to be the case that in an AI self-driving car world we’ll see that kind\
    \ of V2V taking place, but meanwhile we are all living here in the real-world.\
    \ As I earlier pointed out, for quite some time we are going to have a mix of\
    \ human driven cars and AI self-driving cars. Likely a long time. \n\nWe cannot\
    \ decide now to avoid putting in place capabilities that involve dealing with\
    \ human drivers. Pretending that everything will be fine once we get to an all\
    \ AI self-driving car world, if we ever do, it’s living in a dream world. AI self-driving\
    \ cars must be realistic and deal with a world of human driven cars.\n\nIf you\
    \ take a look at many of the AI self-driving cars being tested on our roadways\
    \ today, you can often figure out that they aren’t using micro-movements to their\
    \ advantage. The stilted nature of the AI driving is a giveaway that the AI is\
    \ not versed in detecting, analyzing, and making use of the “tell” of human drivers\
    \ making micro-movements. In a sense, it is akin to a novice teenage driver that\
    \ has not yet figured out how to “read” other cars and the driving behaviors of\
    \ other drivers.\n\nNow, there are some AI developers that claim they are worried\
    \ that if they do include the detection and leveraging of human drivers’ micro-movements\
    \ that the AI will then potentially get confused or make worse decisions.\n\n\
    Well, this really is more about how good or how poorly the AI development of this\
    \ feature is undertaken. Sure, if you do a half-baked job of trying to leverage\
    \ micro-movement detection, you might indeed have your AI self-driving car do\
    \ worse than if you did things the right way. In my view, that would seem true\
    \ about any of the capabilities you might opt to include into the AI system. Capabilities\
    \ that are inadequately put together can be a burden and a problem, more so than\
    \ an aid and a solution.\n\nI didn’t say that adding the capability was going\
    \ to be easy. In fact, I’ll readily state that it is hard.\n\nTrying to use the\
    \ sensors of an AI self-driving car to detect that the wheels of a car ahead are\
    \ slightly askew, it’s not easy, and you need really good sensors and really good\
    \ sensor processing software. The same can be said about detecting when nearly\
    \ any of the typical micro-movements are undertaken. \n\nBy definition, those\
    \ movements are subtle. Picking up on the cues or tells of other cars is hard\
    \ for other human drivers to do, and admittedly hard for an AI system to do.\n\
    \nFortunately, you can leverage Machine Learning and Deep Learning to your advantage.\
    \ By training a deep or large-scale multi-layer artificial neural network with\
    \ tons of collected driving related data, based on human driven cars as they are\
    \ driving in regular human driving traffic, there are patterns of the micro-movement\
    \ driving that can be trained for.\n\nThese trained beforehand Machine Learning\
    \ and Deep Learning algorithms can then be included into the on-board AI system\
    \ of the self-driving car. In many respects, this is really just a deeper form\
    \ of those capabilities. The odds are that Machine Learning and Deep Learning\
    \ are already being used to examine sensory data for aspects such as street signs,\
    \ the presence of pedestrians, etc. The micro-movements are essentially a step\
    \ deeper into that kind of analysis.\n\nAs mentioned earlier, there are some tough\
    \ aspects about trying to achieve the inclusion of the micro-movement analysis\
    \ and usage capability. Will the cameras provide sufficient visual detection to\
    \ spot the micro-movement? Will the radar provide sufficient detection? Will the\
    \ LIDAR provide sufficient detection. Also, even if you can get the sensory data,\
    \ what about the added computer processing needed to go deeply into the analysis,\
    \ will that be on-board? Does that add cost, weight, heat, or other concerns in\
    \ terms of providing the AI self-driving car with this capability?\n\nYou also\
    \ need to realize that the micro-movement is not merely about detection. Once\
    \ you’ve detected a micro-movement, it needs to be populated into the AI virtual\
    \ world model. The AI action planner has to be then be versed in what to do with\
    \ the indications about the micro-movements. If the AI action planner ignores\
    \ the micro-movement detection, the whole effort is for naught.\n\nThe AI action\
    \ planner also has to deal with micro-movements that might not be a true tell\
    \ per se.\n\nRecall that I earlier mentioned that in poker playing you might be\
    \ mistaken about someone’s tell. Perhaps you thought that every time they rubbed\
    \ their cards with their left hand that it meant they were bluffing, but maybe\
    \ that’s not a consistent tell at all. Just because a car ahead of you might be\
    \ leaning toward the bike lane, it doesn’t necessarily mean that the car driver\
    \ is going to bust into the bike lane.\n\nIn this case, the AI needs to be able\
    \ to include the micro-movements as part of a larger picture or “understanding”\
    \ of what is happening in the traffic around the AI self-driving car. You cannot\
    \ in isolation try to make use of the micro-movements. When you are behind another\
    \ car, you might have several minutes to observe any of their micro-movements.\
    \ By giving ample time to do so, their pattern of driving behavior is likely going\
    \ to be more apparent than trying to make a snap judgement.\n\nIt is also important\
    \ to realize that human drivers are going to try and spoof or prank AI self-driving\
    \ cars. This has already happened in instances of four-way stops, involving human\
    \ drivers that “intimidated” an AI self-driving car by rolling through the stop\
    \ sign. The AI was trained to wait until the other drivers came to a full stop.\
    \ It was the proper way to do things. Human drivers though aren’t necessarily\
    \ “proper” about how they drive. In the four-way stop, the humans figured out\
    \ that the AI self-driving car would remain still until the human driven cars\
    \ had waited their turn, and so the human drivers just kept moving, essentially\
    \ causing the AI self-driving car to freeze in place and continuously wait for\
    \ its turn to go.\n\nI mention this example of the four-way stop to also point\
    \ out that the interpretation of micro-movements of human drivers could be a means\
    \ for human drivers to trick the AI self-driving car. \n\nIf you as a human driver\
    \ know that the AI is going to watch the alignment of your wheels, you could do\
    \ a kind of basketball-like head fake and shift the direction of your wheels.\
    \ It might not be due to actually needing to turn the wheels, but instead a ploy\
    \ to get the AI to perhaps grant you that sought for parking spot or otherwise\
    \ give you an advantage over the AI system that’s driving the self-driving car.\n\
    \nOverall, I am an advocate of including the detection, analysis, and leveraging\
    \ of human driving micro-movements for the AI to be able to do a better job of\
    \ driving a self-driving car. It isn’t going to be easy to include this capability.\
    \ It will though make for a more life-like AI driving system and one that since\
    \ it is going to be immersed among human drivers could be considered an essential\
    \ driving skill."
