- fmt: "\n# Introduction\n\nWill the human driver understand what the Level 3 capabilities\
    \ are? Will the human driver know that the AI is trying to drive the car? Will\
    \ the AI realize when the human opts to drive the car? Will the AI realize that\
    \ a human driver is actually ready and able to drive the car? When a crisis moment\
    \ arises, such as the AI is driving the car at 60 miles per hour and suddenly\
    \ determines that it has reached a point where the human driver ought to takeover\
    \ the controls, this is a dicey proposition. Is the human driver prepared to do\
    \ so, and do they know why the AI has determined it is time to have the human\
    \ drive the car?\n\nMuch of this center on the Human Machine Interface (`HMI`)\
    \ aspects.\n\nWhen you are co-sharing the driving, both parties have to be properly\
    \ and timely informed about what the other party is doing or wants to do or wants\
    \ the other party to do. For a car, this might be done via indicators that light-up\
    \ on the dashboard, or maybe the AI system speaks to the driver.\n\nThis though\
    \ is not a straightforward aspect to arrange for all circumstances. \n\nFor example,\
    \ if the AI speaks to the driver and explains that the driver needs to take over\
    \ the wheel, imagine how long it takes for the speaking to occur, along with the\
    \ driver having to make sure they are listening, and that they heard what the\
    \ AI said, and that they comprehend what the AI said. \n\nThis then also requires\
