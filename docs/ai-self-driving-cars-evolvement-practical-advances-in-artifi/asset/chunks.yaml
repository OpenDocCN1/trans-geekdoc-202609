    你将获得通过摄像头收集的视觉数据，这些数据可能来自安装在自动驾驶汽车前、后、侧面的多个摄像头。还有通过安装在自动驾驶汽车上的多个雷达传感器收集的雷达数据。可能还有超声波传感器。可能会激光雷达（LIDAR），这是一种结合了光和雷达的特殊传感器。此外可能还有其他传感器，例如声学传感器、嗅觉传感器等。


    因此，你必须将相同类型传感器的数据（例如来自各种摄像头的数据）拼接在一起。此外，你还需要将不同类型传感器的数据拼接在一起，这意味着你需要对摄像头、雷达、激光雷达、超声波等进行某种比较和对比。


    每种不同类型的传感器都对现实世界提供不同类型的潜在指示。它们感知世界的方式并不尽相同。这既是优势也是劣势。


    优势的一面是，通过使用不同类型的传感器，你可能会实现一种全面的平衡。摄像头和视觉处理在指示物体速度方面，通常不如雷达或激光雷达灵敏。


    通过利用每种传感器的优点，你能够对现实世界的构成获得更丰富的纹理描述。


    如果传感器融合子系统设计不当，可能会损害这种不同传感器固有的提供的互补三角测量优势。这很遗憾。设计薄弱或简陋的传感器融合通常会丢弃可以更好判断环境的重要信息。通过合理构建的互补视角，AI
    动作规划部分将更有机会做出更好的驾驶决策，因为它对自动驾驶汽车周围的现实世界有了充分了解。


    尽管如此，我们必须承认，对众多传感器进行的处理越多，所需的计算机处理能力就越高，这意味着你必须在自动驾驶汽车上放置更多的计算机处理器和内存。这增加了成本，增加了汽车重量，消耗了电能，产生了热量，并有其他缺点。此外，尝试整合所有数据和解释将消耗处理时间，正如本文多次强调的，在驾驶汽车时
    AI 的时间限制是非常严苛的。


    ## 同化 MSDF 的四种关键方法


    让我们考虑整合来自多个传感器的感觉数据的的基本方法。


    请看图 2。


    ![](img/00009.jpeg)


    我将简述这四种方法，分别是协调（harmonize）、调和（reconcile）、集成（integrate）和合成（synthesize）。


    ### 1. 协调 (Harmonize)


    假设你有两种不同的传感器，我称它们为 `sensor X` 和 `sensor Z`。它们都能感知自动驾驶汽车外的世界。我们暂时不考虑它们各自的优缺点，我将在后文中介绍这些。


    现实世界中有一个物体，`sensor X` 和 `sensor Z` 都能检测到该物体。这可能是街道上的行人，也可能是狗，或者可能是一辆汽车。无论何种情况，我将把问题简化为考虑检测物体的整体概念。


    这种双重检测意味着两种不同类型的传感器对该物体都有报告。我们对该物体进行了双重检测。现在，我们想弄清楚由于有了两个视角，我们对该物体能额外分辨多少。


    这涉及到对两个检测结果进行协调。假设两个传感器都检测到了物体的距离。`sensor X` 指示物体高 6 英尺，宽约 2 英尺。同时，`sensor Z`
    报告物体正向自动驾驶汽车移动，速度为每秒 `N` 英尺。我们可以将这两个传感器报告结合，并更新虚拟世界模型：有一个高 6 英尺、宽 2 英尺的物体正以速度
    `N` 向自动驾驶汽车移动。


    假设我们只依赖 `sensor X`。也许是因为我们只有 `sensor X`，而这辆自动驾驶汽车上没有 `sensor Z`。或者 `sensor Z`
    损坏了。或者，因为传感器上堆满了泥，`sensor Z` 暂时无法工作。


    在这种情况下，我们只知道物体的高度、重量和大致位置，但没有关于速度和行驶方向的读数。这意味着 AI 动作规划器对物体的视角可能并不理想。


    顺便提一下，这还涉及到关于 AI 自动驾驶汽车应配备何种传感器的持续争论。例如，最激烈的争论之一涉及特斯拉和埃隆·马斯克选择不在特斯拉汽车上安装激光雷达的问题。马斯克表示，他不认为通过他的
    `Autopilot` 系统实现真正的 AI 第 5 级驾驶不需要激光雷达，尽管他也承认这一假设最终可能被证明是错误的。


    某些人会声称，通过激光雷达获得的感知输入无法通过其他类型的传感器完全设计，因此从这个意义上说，特斯拉将无法拥有配备激光雷达的自动驾驶汽车那样的互补或三角测量。而那些不青睐激光雷达的人则声称，激光雷达传感器数据不值得增加成本，不值得增加处理精力，也不值得增加处理所需的额外认知时间。


    我已经指出，这不仅仅是一个技术或工程问题。我敢打赌，一旦 AI 自动驾驶汽车发生严重的交通事故，我们将看到诉讼，试图对汽车制造商和科技公司在自动驾驶汽车设计中做出的传感器选择追究责任。


    如果汽车制造商或科技公司选择不使用激光雷达，诉讼可能会主张，省略激光雷达是 AI 自动驾驶汽车能力的重大缺陷，且汽车制造商或科技公司知道或应该知道他们削弱了自动驾驶汽车的性能，使其安全性降低。这将会是一个相对“容易”发起的指控，特别是考虑到大多数
    AI 自动驾驶汽车都配备了激光雷达。


    如果汽车制造商或科技公司选择使用激光雷达，诉讼可能会主张，AI 系统处理激光雷达的额外努力是导致车祸的原因之一，且汽车制造商或科技公司知道或应该知道额外的处理和处理时间可能导致
    AI 自动驾驶汽车安全性降低。这一指控将更难提出和支持，因为这违背了大多数 AI 自动驾驶汽车配备激光雷达的大趋势。


    ### 2. 调和 (Reconcile)


    我想从物体检测的角度重新回顾 `sensor X` 和 `sensor Z` 的使用。


    假设 `sensor X` 检测到了一个物体，而 `sensor Z` 没有检测到，尽管 `sensor Z` 本来可以。换句话说，物体在 `sensor
    Z` 的视野（FOV）内，但 `sensor Z` 却没有检测到它。请注意，这与物体完全位于 `sensor Z` 的视野之外完全不同，在那种，我们不会预期
    `sensor Z` 能检测到该物体。


    我们面临着需要调和的困境。


