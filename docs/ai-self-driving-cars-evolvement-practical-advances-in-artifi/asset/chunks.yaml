    \ each other on safety, naturally there would be a basis to purposely avoid sharing\
    \ about safety aspects with each other. \n\nYou can’t seemingly have it both ways,\
    \ in that if you are competing on safety then it is presumed to be a zero-sum\
    \ game, those that do better on safety will sell more than those that do not,\
    \ and why help a competitor to get ahead.\n\nThis mindset needs to be overcome.\
    \ As mentioned earlier, it won’t take much in terms of a few safety related bad\
    \ outcomes to potentially stifle the entire AI self-driving car realm. If there\
    \ is a public outcry, you can expect that this will push back at the auto makers\
    \ and tech firms. \n\nThe odds are that regulators would opt to come into the\
    \ industry with a much heavier hand. Funding for AI self-driving car efforts might\
    \ dry up. The engine driving the AI self-driving car pursuits could grind to a\
    \ halt.\n\nThere are efforts popping up to try and see if AI safety can become\
    \ more widespread as an overt topic in the AI self-driving car industry. \n\n\
    It’s tough though to overcome all of those NDA (Non-Disclosure Agreements) and\
    \ concerns that proprietary matters might be disclosed. Regrettably, it might\
    \ take a calamity to get enough heat to make things percolate more so, but I hope\
    \ it doesn’t come down to that.\n\nThe adoption of Chief Safety Officers into\
    \ the myriad of auto makers and tech firms that are pursuing AI self-driving cars\
