    人类的一项细微认知任务仍然让 AI 感到困扰。你一定知道 AI 已经能够击败国际象棋高手，并擅长其他类型的游戏。这种狭义认知并不是驾驶的本质。驾驶要广泛得多。它需要对世界的认知，而一个国际象棋
    AI 系统并不需要知道这些。驾驶的认知方面一方面看似简单，但同时又需要关于汽车、人、道路、规则以及无数其他“常识”方面层层累积的知识。我们现在没有任何 AI
    系统具备这种同等广度和深度的认知与知识。


    正如我的文章中所揭的，如今的自动驾驶汽车正在使用“技巧”来完成特定任务。它们在操作上非常狭窄。此外，它们目前假设人类驾驶员随时准备好介入。这就像我们教一个孩子叠积木，但当孩子叠得太高并开始倒塌时，我们需要在旁边守着。今天的
    AI 是脆弱的、是狭隘的，它并没有触及人类的认知能力。这就是为什么真正的自动驾驶汽车还在未来的未来。


    驾驶任务的另一个方面是，它不仅仅是一种脑力体操。你确实需要使用感官来开车。你使用眼睛，即视觉传感器来观察前方的道路。你的视觉能力就像一段流视频，你的大脑在驾驶时需要不断分析它。路在哪里？路上有行人吗？你前面还有别的车吗？你的感官正向大脑汇入大量信息。自动驾驶汽车正试图通过摄像头、雷达、超声波和激光来做同样的事情。这是对模仿人类感官和感官器官的尝试。


    因此，驾驶任务是脑力与体力的结合。你使用感官，使用手脚操作汽车的控制装置，并使用大脑评估感官信息并指导你的肢体作用于汽车控制装置。这一切都是瞬间发生的。如果你曾经可能眼睛里进过异物，只能用一只眼睛开车，你会突然意识到自己对视觉有多么依赖。如果你脚骨折了打着石膏，你会突然意识到控制刹车板和加速板有多难。如果你服了药，大脑可能很迟钝，你会突然意识到开车需要多大的精神压力。


    一个下国际象棋的 AI 系统只需要专注于下棋即可。物理方面并不重要，因为通常是由人类移动棋子，或者棋盘显示在电子屏幕上。将 AI 用于更关乎生死的任务，例如分析患者的
    MRI 图像，这同样不需要体力能力，而是通过检查位图图像完成的。


    开车是一项真正的关乎死的任务。它是 AI 的一种应用，很容易且在任何时候导致死亡。对于那些正在开发这种 AI 的同事来说（我也是其中之一），我们需要记住这方面的严峻性。我们正在生产的软件，其虚拟手中掌握着车内乘客的生命、周围其他车内人员的生命，以及附近行人的生命等。国际象棋通常不是关乎生死的问题。


    驾驶无处不在。汽车随处可见。今天大多数的 AI 应用只涉及少数人。或者，它们处于幕后，如果 AI 搞砸了，我们人类还有其他补救措施。在公路上以每小时 80
    英里速度行驶汽车的 AI 最好不要出差。后果是严重的。将这个数字乘以汽车数量，如果我们能神奇般地将自动驾驶引入全美每一辆汽车中，我们会有 2.63 亿辆汽车在运行
    AI。那是分布在各处的大量的 AI。这是我们目前尚未做的大规模 AI 应用，它既充满了希望，也潜藏着潜在的危险。


    有些人想要为自动驾驶汽车使用 AI，因为他们憧憬一个没有任何交通事故的世界。他们憧憬一个没有交通拥堵且所有汽车都相互协作的世界。这些是美好的乌托邦愿景。


    但这些具有误导性。自动驾驶汽车的普及将是渐进的，而不是一夜之间完成。我们无法在经济上抛弃所有旧汽车。我们也无法负担改装旧汽车的。更有可能的情况是自动驾驶汽车将制造在新车中，在许多年的逐步替换过程中，我们将看到新旧汽车并存。


    ## 本书提供的价值


    这本书为你提供了什么？它介绍了关于自动驾驶汽车的许多元素，并从 AI 的视角进行介绍。我将技术和非技术方面交织在一起，从驾驶任务的认知能力以及技术如何将其融入自动驾驶汽车出发，紧接着又讨论了社会和经济方面。


    ## 为什么要写这本书


    我写这本书是为了试图向公众介绍许多似乎没有人讨论过的关于自动驾驶汽车的方面。对于那些参与制造自动驾驶汽车或将利用自动驾驶汽车的业务负责人，我希望这本书能让你们了解涉及的风险，以及你们应该如何制定策略应对这些风险。对于想要进入自动驾驶汽车市场的企业家、初创公司和其他企业，我希望这本书能激发他们的兴趣，并对可能值得追求的方向提供一些感。对于研究自动驾驶汽车的研究人员，我希望这本书能激发他们对风险和安全问题的兴趣。对于计算机科学或相关专业的学生，我希望这本书能为他们提供有趣且新的观点。


