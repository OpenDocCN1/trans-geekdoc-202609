- fmt: '

    `Sensor X` says the object is there in the `FOV`. `Sensor Z` says the object is
    not there in the same `FOV` intersection. Yikes! It could be that `sensor X` is
    correct and `sensor Z` is incorrect. Perhaps `sensor Z` is faulty, or obscured,
    or having some other difficulty. On the other hand, maybe `sensor X` is incorrect,
    namely that there isn’t an object there, and the sensor is `X` is mistaken, reporting
    a “ghost” of sorts, something that is not really there, while `sensor Z` is correct
    in reporting that there isn’t anything there.


    There are various means to try and reconcile these seemingly contradictory reports.
    I’ll be getting to those methods shortly.


    ### Integrate


    Let’s suppose we have two objects. One of those objects is in the `FOV` of `sensor
    X`. The other object is within the `FOV` of `sensor Z`. `sensor X` is not able
    to detect the object that `sensor Z` has detected, rightfully so the object is
    not inside the `FOV` of `sensor X`. `sensor Z` is not able to directly detect
    the object that `sensor X` has detected, rightfully so the object is not inside
    the `FOV` of `sensor Z`.


    Everything is okay in that `sensor X` and `sensor Z` are both working as expected.
    What we would like to do is see if we can integrate together the reporting of
    `sensor X` and `sensor Z`, each finding objects in their respective `FOV`. It
    could be that the object in the `FOV` of `sensor Z` is heading toward the `FOV`
    of `sensor X`, and thus it might be possible to inform `sensor X` to watch for
    the object. Likewise, the same could be said about the object that `sensor X`
    currently has detected and might inform `sensor Z`. My story about driving in
    the fog is a similar example of integrating together data seen by my passenger
    and those sitting in the backseat into my own driving scene.


    ### Synthesize


    In this kind of approach about assimilating together sensory data, you can have
    a situation whereby neither `sensor X` nor `sensor Z` has an object within their
    respective `FOV`. In this case the assumption would be that neither one knows
    that the object exists.


    In the case of driving in the fog, suppose a bike rider was in my blind spot,
    and that neither of my buddies saw the bike rider due to the fog. None of us knew
    that the bike rider was nearby. We are all blind to the bike rider. However, on
    a self-driving car, which suggests that at times there will be gaps in the `FOV`
    of the sensors that the AI planner is not going to know is there, you sometimes
    have a chance at guessing about objects that aren’t in the `FOV` of the sensors
    by interpolating whatever you do know about the objects within the `FOV`. This
    is referred to as synthesis or synthesizing sensor fusion. Remember how I mentioned
    that I saw other cars moving over when I was hearing the sounds of a siren? I
    could not see the emergency vehicle, luckily I had a clue about the emergency
    vehicle because I could hear it. Within your `FOV`, you have something happening
    that gives you a clue about what is not within your `FOV`. You are able to synthesize
    what you know and use that to predict what you don’t know. It seems like a reasonable
    guess that if cars around you are pulling over, it suggests an emergency vehicle
    is coming. It could mean that aliens from Mars have landed and you didn’t notice
    it because you were strictly looking at the other cars, but I doubt the possibility
    of those alien creatures landing here. So, you can use the sensory data to try
    and indirectly figure out what might be happening in `FOVs` that are outside of
    your purview. Keeping in mind that this is a real-time system and the self-driving
    car is in motion, it could be that within moments the thing you guessed might
    be outside of scope `FOV` will come within the scope of your `FOV`, and hopefully
    you’ll have gotten ready for it just as I did about the ambulance that zipped
    past me.


    ### Voting Methods of Multi-Sensor Fusion


    When you have multiple sensors and want to bring together their respective reporting
    in some cohesive manner, there are a variety of methods you can use. Take a look
    at Figure 1 again. I’ll briefly describe each of the voting methods.


    #### Absolute Ranking Method


    In this method, you beforehand decide a ranking of sensors. You might declare
    that the cameras are higher ranked than the radar. The radar you might decide
    is higher ranked than the LIDAR, and so on. During sensor fusion, the subsystem
    uses that predetermined ranking.


    For example, suppose you get into a situation of reconciliation, such as the instance
    I described earlier involving `sensor X` detecting an object in its `FOV` but
    that `sensor Z` in the intersecting `FOV` did not detect. If `sensor X` is the
    camera while `sensor Z` is the LIDAR, you might simply use the predetermined ranking
    and the algorithm assumes that since the camera is higher ranking it is “okay”
    that `sensor Z` does not detect the object.


    There are tradeoffs to this approach. It tends to be fast, easy to implement,
    and simple. Yet it tends toward doing the kind of “tossing out” that I forewarned
    is not advantageous overall.


    #### Circumstances Ranking Method


    This is similar to the Absolute Ranking Method but differs because the ranking
    is changeable depending upon the circumstance at hand. For example, we might have
    setup that if there is rainy weather, the camera is no longer the top dog and
    instead the radar gets the topmost ranking, due to its less likelihood of being
    adversely impacted by the rain.


    There are tradeoffs to this approach too. It tends to be relatively fast, easy
    to implement, and simple. Yet it once again tends toward doing the kind of “tossing
    out” that I forewarned is not advantageous overall.


    #### Equal Votes (Consensus) Method


    In this approach, you allow each sensor to have a vote. They are all considered
    equal in their voting capacity. You then use a counting algorithm that might go
    with a consensus vote. If some threshold of the sensors all agree about an object,
    while some do not, you allow the consensus to decide what the AI system is going
    to be led to believe. Like the other methods, there are tradeoffs in doing things
    this way.


    #### Weighted Voting (Predetermined)


    Somewhat similar to the Equal Votes approach, this approach adds a twist and opts
    to assume that some of the voters are more important than the others. We might
    have a tendency to believe that the camera is more dependable than the radar,
    so we give the camera a higher weighted factor. And so on. Like the other methods,
    there are tradeoffs in doing things this way.


    #### Probabilities Voting


    You could introduce the use of probabilities into what the sensors are reporting.
    How certain is the sensor? It might have its own controlling subsystem that can
    ascertain whether the sensor has gotten bona fide readings or maybe has not been
    able to do so. The probabilities are then encompassed into the voting method of
    the multiple sensors. Like the other methods, there are tradeoffs in doing things
    this way.


    #### Arguing (Your Case) Method


    A novel approach involves having each of the sensors argue for why their reporting
    is the appropriate one to use. It’s an intriguing notion. We’ll have to see whether
    this can demonstrate sufficient value to warrant being used actively. Research
    and experimentation are ongoing. Like the other methods, there are tradeoffs in
    doing things this way.


    #### First-to-Arrive Method

