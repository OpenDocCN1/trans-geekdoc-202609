- fmt: "\nFor anyone choosing to use this book for teaching purposes, please take\
    \ a look at my suggestions for doing so, as described in the Appendix. I have\
    \ found the material handy in courses that I have taught, and likewise other faculty\
    \ have told me that they have found the material handy, in some cases as extended\
    \ readings and in other instances as a core part of their course (depending on\
    \ the nature of the class).\n\nIn my writing for this book, I have tried carefully\
    \ to blend both the practitioner and the academic styles of writing. It is not\
    \ as dense as is typical academic journal writing, but at the same time offers\
    \ depth by going into the nuances and trade-offs of various practices. \n\nThe\
    \ word “deep” is in vogue today, meaning getting deeply into a subject or topic,\
    \ and so is the word “unpack” which means to tease out the underlying aspects\
    \ of a subject or topic. I have sought to offer material that addresses an issue\
    \ or topic by going relatively deeply into it and make sure that it is well unpacked.\n\
    \nFinally, in any book about AI, it is difficult to use our everyday words without\
    \ having some of them be misinterpreted. Specifically, it is easy to anthropomorphize\
    \ AI. When I say that an AI system “knows” something, I do not want you to construe\
    \ that the AI system has sentience and “knows” in the same way that humans do.\
    \ They aren’t that way, as yet. I have tried to use quotes around such words from\
    \ time-to-time to emphasize that the words I am using should not be misinterpreted\
    \ to ascribe true human intelligence to the AI systems that we know of today.\
    \ If I used quotes around all such words, the book would be very difficult to\
    \ read, and so I am doing so judiciously. Please keep that in mind as you read\
    \ the material, thanks. \n\n# COMPANION BOOKS\n\nIf you find this material of\
    \ interest, you might enjoy these too:\n\n1. “Introduction to Driverless Self-Driving\
    \ Cars” by Dr. Lance Eliot\n2. “Innovation and Thought Leadership on Self-Driving\
    \ Driverless Cars” by Dr. Lance Eliot\n3. “Advances in AI and Autonomous Vehicles:\
    \ Cybernetic Self-Driving Cars” by Dr. Lance Eliot\n4. “Self-Driving Cars: The\
    \ Mother of All AI Projects” by Dr. Lance Eliot\n5. “New Advances in AI Autonomous\
    \ Driverless Self-Driving Cars” by Dr. Lance Eliot\n6. “Autonomous Vehicle Driverless\
    \ Self-Driving Cars and Artificial Intelligence” by Dr. Lance Eliot and Michael\
    \ B. Eliot\n7. “Transformative Artificial Intelligence Driverless Self-Driving\
    \ Cars” by Dr. Lance Eliot\n8. “Disruptive Artificial Intelligence and Driverless\
    \ Self-Driving Cars” by Dr. Lance Eliot\n9. “State-of-the-Art AI Driverless Self-Driving\
    \ Cars” by Dr. Lance Eliot\n10. “Top Trends in AI Self-Driving Cars” by Dr. Lance\
    \ Eliot\n11. “AI Innovations and Self-Driving Cars” by Dr. Lance Eliot\n12. “Crucial\
    \ Advances for AI Driverless Cars” by Dr. Lance Eliot\n13. “Sociotechnical Insights\
    \ and AI Driverless Cars” by Dr. Lance Eliot.\n14. “Pioneering Advances for AI\
    \ Driverless Cars” by Dr. Lance Eliot\n15. “Leading Edge Trends for AI Driverless\
    \ Cars” by Dr. Lance Eliot\n16. “The Cutting Edge of AI Driverless Cars” by Dr.\
    \ Lance Eliot\n17. “The Next Wave of Self-Driving Cars” by Dr. Lance Eliot\n18.\
    \ “Revolutionary AI Driverless Cars” by Dr. Lance Eliot\n19. “Trailblazing Trends\
    \ for Self-Driving Cars” by Dr. Lance Eliot\n20. “Ingenious Strides for AI Driverless\
    \ Cars” by Dr. Lance Eliot\n21. “Self-Driving Cars Innoviveness” by Dr. Lance\
    \ Eliot\n22. “AI Driverless Cars Vision Secrets” by Dr. Lance Eliot\n23. “Visionary\
    \ Secrets of AI Driverless Cars” by Dr. Lance Eliot\n24. “Spearheading Self-Driving\
    \ Cars” by Dr. Lance Eliot\n25. “Spurring Self-Driving Cars” by Dr. Lance Eliot\n\
    26. “Avant-Garde AI Driverless Cars” by Dr. Lance Eliot\n27. “Evolvement of Self-Driving\
    \ Cars” by Dr. Lance Eliot\n\nThese books are available on Amazon.\n\n## CHAPTER\
    \ 1: FRAMEWORK FOR SELF-DRIVING CARS\n\nThis chapter is a core part of once you’ve\
    \ read this chapter, you’ll be prepared to read the rest. At the Cybernetic Self-Driving\
    \ Car Institute, we use the framework to keep track of what we are working on,\
    \ and how we are developing software to achieve Level 5 self-driving cars.\n\n\
    When I give presentations about the framework, I have found it helpful to provide\
    \ a thousand words what the diagram intends. The framework needs to be simple\
    \ enough to convey the elements, but at the same time not so simple that it belies\
    \ the true complexity of self-driving cars. The elements on the diagram are numbered\
    \ for ease of reference. Each element is crucial. For some self-driving cars,\
    \ a particular element might be more important or somehow distinguished in comparison\
    \ to other elements. I will describe each of the elements, one at a time. After\
    \ doing so, I’ll discuss how the elements interact and perform.\n\n### D01: Sensor\
    \ Capture\n\nLet’s start with the one element that often gets the most attention\
    \ in the press about self-driving cars, namely, the sensory devices for a self-driving\
    \ car.\n\nOn the framework, the box labeled as `D01` indicates `Sensor Capture`\
    \ and refers to the processes of the self-driving car that involve collecting\
    \ data from the myriad of sensors that are used. The types of devices typically\
    \ involved are listed, such as the use of mono cameras, stereo cameras, `LIDAR`,\
    \ radar systems, ultrasonic devices, `GPS`, `IMU`, and so on.\n\nThese devices\
    \ are tasked with obtaining data about the status of the self-driving car and\
    \ the world around it. Some of the devices are continually providing updates,\
    \ while others of the devices await an indication by the self-driving car that\
    \ the device is supposed to collect data. The data might be first transformed\
    \ in some fashion by the device itself, or it might instead be fed directly into\
    \ the sensor capture as raw data. At that point, it might be up to the sensor\
    \ capture processes to do transformations on the data.\n\n### D02: Sensor Fusion\n\
    \nImagine that your eyeballs receive visual images, your nose receives odors,\
    \ your ears receive sounds, and in essence each of your distinct sensory devices\
    \ is getting some form of input. The input befits the nature of the device. Likewise,\
    \ for a self-driving car, the cameras provide visual images, the radar returns\
    \ radar reflections, and so on. Each device provides the data as befits what the\
    \ device does.\n"
