    `drive`（前进）驶向你居住的街道。


    除了挡位，你可能还使用过你的 `parking brake`（手刹）。我发誓，至少一个月会有一次，我以某种方式忘记了我用过 `parking brake`，然后当从车库倒出来，发现汽车移动得非常缓慢时，我羞愧地意识到我忘记了松开
    `parking brake`。希望这不是痴呆症发作的征兆。


    你可能会认为你的 `indicators`（转向灯）或 `blinkers`（闪光灯）也是车辆控制的一部分。它们可能不会导致车辆运动上产生任何变化，但它们是告知其他司机人和行人你要往哪里去的重要手段。我猜你很久以前也学会了可以使用手势信号，将手伸出驾驶员侧窗外作为
    `turn indicator`（转向指示灯）。现在这样做已经很罕见的。


    当我看到有人这样用他们的手臂时，我经常会对这种使用如此古老方式的魅力付之一笑（另外，这意味着他们的 `blinkers`（转向灯）坏了，还是说他们只是想做一个友好的司机，或者这到底是怎么回事）。


    你会说你的 `headlamps`（大灯）是车辆控制的一部分吗？这似乎有点牵强。但你可以辩称，它们对于看清前方的道路非常重要，特别是在深夜。它们还能预警其他司机你的存在。`headlamps`（大灯）和
    `fog lamps`（雾灯）可以是驾驶中的重要元素。尽管如此，我们仍然可以讨论你是否将它们视为车辆控制，因为 `headlamps` 并不直接控制汽车的移动。


    我在此将集中在 `brakes`（刹车）、`accelerator`（加速）和 `steering`（转向）上，声称这些汽车的核心控制。我提到与其他控制相关的方面是为了确保没有人指责我忘记了其他控制汽车的方法。是的，`parking
    brake` 可能非常重要。是的，为汽车选择 `gear`（挡位）非常重要。以此类推。请假设我承认并欣赏它们在驾驶任务中的作用。


    说起 `parking brake`（手刹），我在大学时期疯狂开车时，从一个大学哥们儿那里学了一个实用的技巧。


    有一天，他正在开车，我坐在副驾驶座。我们正飞速行驶，从洛杉矶开往 `Bay Area`（湾区），去那里参加一场大学橄榄球赛。诚承认，他的速度超过了限速。我们错了。但你必须意识到，有一条很长的高速公路被标记为
    `5 freeway`（5 号公路），从南加州出发大约需要 6 到 7 小时的车程才能到达 `Bay Area`（湾区），我敢说在这条公路上行驶的每个人都超过了限速（好吧，也许不是卡车司机）。如果你愿意稍微超过标出的限速，你可以将车程缩短到
    5 小时左右（可能不止是一点点！）。


    突然，我的朋友伸手去拉 `parking brake`（手刹）并开始使用。这对我来说完全没有意义。`parking brake`（手刹）是供停车时使用的，至少我是这么想的。老天爷，他为什么在摆弄
    `parking brake` 呢？他疯了吗？在我们出发之前他是不是喝了一些啤酒，在到达目的地之前进行了些“预热”？我希望没有。


    看到我困惑的表情，他解释说有一辆 `California Highway Patrol (CHP)`（加州公路巡逻队）警车上了高速公路，现在就在我们后面，大约四分之一英里远。

    '
- fmt: '

    Overall, in a kind of Darwinian process, we have landed upon a set of car controls
    that seems to work for us all. We have evolved cars to a point that the everyday
    person can drive a car. Plus, they can drive a car again and again. It’s almost
    as easy as riding a bike. Some might say easier since when riding a bike you need
    to first learn how to balance the bike.


    It has all boiled down to a pedal to make the car stop, a pedal to make the car
    go, and a wheel that you can twist and turn to steer the car. That’s about as
    basic or fundamental as you can be. We could have instead evolved to a device
    on the dashboard of the car that does the braking and one that does the acceleration,
    or maybe have knobs on the steering column to do so. We could have evolved to
    turn the direction of the car via a knob or other contraption, rather than using
    a steering wheel.


    The beauty of the pedals and the steering wheel are their simplicity. They are
    easy to learn how to use them. Not only are they easy to use, they are devised
    to be used in a timely fashion. When you need to suddenly turn the car, you can
    grasp and twist the steering wheel, doing so almost instinctively, and using your
    arms and hands in a fluid motion as you do so.


    The physical act of controlling the car is crucial. If the steering was cumbersome,
    imagine how bad things would be when you got into a panic situation. Having only
    a split second available to steer the car, any kind of added effort involved to
    physically do so would lead to more deaths and destruction. Humans need to have
    an ability to quickly make use of the controls. That’s why the controls are placed
    where they are.


    You might find of interest that there have been studies done about moving or changing
    the nature of the driving controls. I’ve already mentioned some ways that they
    could be physically repositioned. Some suggest that maybe we should just speak
    to the car controls, using our voice, and not need to do anything physical with
    our appendages. As you can guess, this would have both advantages and disadvantages
    (suppose you lost your voice, suppose you uttered a command inadvertently, etc.).


    There are numerous studies about how long it takes to make use of the car controls.
    Length of time to invoke car controls can be a life-or-death matter.


    Contemplate for a moment what happens when you see that a dog is racing across
    the street in front of your car. You must first see the dog doing this, and thus
    your eyes need to be watching the road. Your brain has to process the aspect that
    the dog is possibly going to get hit. Your mind needs to decide what to do, determining
    whether to steer away, or hit the brakes, or speed-up to go around the dog. Once
    your mind decides what to do, your body needs to physically take the action required.


    Even once you’ve grabbed the steering wheel or jammed your foot onto the brakes,
    it will take some additional time for the car to respond. There is not an instantaneous
    reaction of your invoking the car controls commands and having the car do what
    you want. When you turn the steering wheel, this is conveyed to the wheels of
    the car, and those wheels need to physically be turned, all of which takes time.
    Braking the car is the same kind of time delayed facet, meaning that once you’ve
    slammed on the brakes, this needs to be enacted by the tires and the braking system,
    along with the time involved in the physics of the car coming to a halt.


    In our minds, we often blur the distinction between acting upon the car controls
    and the action of the car complying with those controlling actions. Only when
    you are in a dire situation do you at times become aware of the difference. Within
    your mind, you might be thinking that the car can stop on a dime, but by the time
    you move your body and get your foot to pressure the brake pedal, followed by
    the brakes being actually applied, followed by the tires being engaged by the
    brakes, followed by the physics of the road and the tires bringing the car to
    a halt, it can be much longer than you think.


    If you’ve ever slid into an object that you thought you could brake the car before
    hitting, you know what I mean by this time delayed reaction aspect.


    Another way in which you might have become aware of the indirect aspects of using
    the car controls and seeing what the car does would be in situations like sliding
    on a wet rain-soaked road or driving in the snow. You turn the wheels in one direction.
    The car though decides to slide in another direction. You turn the wheel again,
    hopeful of trying to get the tires to catch onto the roadway surface. You try
    to accelerate, but perhaps the wheels just spin without getting traction. And
    so on.


    Have you ever had a moment whereby you did one action with the car controls and
    regretted it, and so immediately tried to undo the action?


    I was sitting at a red light waiting to make a right turn, and decided it was
    safe to go, so I pressured the accelerator to move ahead. All of a sudden, another
    car came barreling down the street and came into the lane that I was turning into.
    I realized that my best bet was to halt my right turn. I quickly shifted my foot
    from the accelerator pedal to the brake pedal.


    Fortunately, I came to a halt and avoided colliding with the barreling car. I
    wondered though what my car must have thought of my actions. Suppose the car was
    actually alive, maybe akin to a pet, like your pet dog. You jerk the dog (or car)
    to move forward, but then you just as quickly jerk the dog (or car) to come to
    a halt. What kind of messed owner are you? Can’t decide what to do, and cause
    the dog (or car) to undergo strain and stress, presumably needlessly if you had
    better planned your actions.


    This brings up another point about the use of the car controls. There are the
    tactical aspects of activating and using the controls, such as putting your foot
    onto the pedals and using your hands to turn the steering wheel. You normally
    though are making use of the controls in a more macroscopic way too, at least
    hopefully you are doing so.


    Suppose you want to drive down the street and make a right turn at the corner.
    There are a series of tactical car control motions that you would undertake. You
    accelerate to get the car moving down the street. You steer the car to the right
    side of the road. If there’s a parked car at the curbside, you might slightly
    steer your car to the left to avoid brushing against the parked car. When you
    near the corner, you likely are steering the car towards the corner itself, and
    perhaps applying the brakes to slow down so you can readily make the turn.


    You’ve put together a series of tactical car control commands. They are each of
    their own merit. Yet, they also are part of a larger perspective on what you are
    trying to achieve. You are wanting to drive the street, reach the corner, make
    the turn, and do this without hitting other cars. Doing so has required a series
    of back-to-back tactical car control command efforts.


    Novice drivers often struggle with this overarching aspect. They are at first
    overwhelmed by the act of merely using the driving controls. That’s why most people
    will have a novice driver initially practice in an empty parking lot. Let the
    human become familiar with the itsy bitsy aspects of how to use the controls.
    Once you’ve mastered that ability, you can then begin to consider how to dovetail
    those tactical elements into an overall driving plan.

    '
