    \nHere are some the key ways that micro-movements can appear:\n\n*   Angling of\
    \ the wheels of the car\n\n*   Leftward leaning of the car\n\n*   Rightward leaning\
    \ of the car\n\n*   Stuttered motion of the car (start/stop)\n\n*   Car lurches\
    \ (sudden motion)\n\n*   Riding of the brakes\n\n*   Etc.\n\nThese aforementioned\
    \ car movement indications are considered micro-movements when they are done in\
    \ a subtle manner. It’s a kind of a tease. Just a little bit of showing of the\
    \ leg, as it were.\n\nSome might liken this to a “tell” in a sport like basketball.\
    \ When playing basketball competitively, you might give a movement of your head\
    \ that seems to say you are going to make a run to the basket, and the other player\
    \ covering you can potentially read the tell and get positioned to block you.\
    \ This can all happen in an instant. It can happen too before the player with\
    \ the ball has actually moved their feet toward the basket and taken any other\
    \ overt actions.\n\nIf you like to play poker, you certainly know about the tell\
    \ or clues that other players often inadvertently show. When I was in college,\
    \ I played a Saturday poker game with some of my buddies. One member of the tight\
    \ knit group was well-known for trying to bluff his way on hands where he had\
    \ nothing of use in his cards. It was the classic saying about the notion that\
    \ weak means strong, and strong means weak, namely that whenever he tried to make\
    \ it seem like he had all aces, it really meant he had junk. This was his tell.\n\
    \nAnother player had a tell that involved pushing his glasses up his nose and\
    \ toward his eyes.\n\nWe all eventually figured out that this was his tell. It\
    \ meant that he was lying about whatever he might be saying. None of us revealed\
    \ the tell to him, and we kept it each to ourselves, relishing it. After months\
    \ of this, one of the pack opted to tell him about his tell.\n\nAt first, he was\
    \ angry that we had noticed the tell. He was also angry that we had not revealed\
    \ it to him, though he sheepishly realized that he probably would not have told\
    \ any of us about our tells. It dawned on him that if we had become conditioned\
    \ to his tell, he could use that conditioning to his advantage. For a few weeks,\
    \ he would purposely push his glasses on his nose, doing so to make us think he\
    \ was lying, even though he might be telling the truth. We got caught like a hungry\
    \ fish on a shiny lure. He made some good money by exploiting his own tell.\n\n\
    One of the members of the group had been oblivious to the tell. When it was finally\
    \ revealed to everyone at one of the poker games, this particular member was shocked.\
    \ What tell? He had never noticed that our friend was often pushing his glasses\
    \ up further on his nose.\n\nThis highlights my earlier point about micro-movements\
    \ of cars. Some people notice them, some do not. And it also highlights another\
    \ very important point. You cannot for sure bet on a micro-movement since there\
    \ is no guarantee it will ultimately graduate into becoming a full-on movement.\
    \ Not all tells blossom. You need to assess each one, along with the situation\
    \ at-hand, and ascertain whether the micro-movement is telling you something of\
    \ substance or not.\n\nLet’s also make clear what isn’t a micro-movement. If someone\
    \ completely cranks the wheels over to make a full turn, I don’t think we can\
    \ really consider that to be a micro-movement. Only if the driver had just slightly\
    \ angled the wheels, perhaps doing so to get ready for a turn, or maybe they were\
    \ almost subconsciously starting the turn, those are situations of a micro-movement.\n\
    \nOne of the ways to study micro-movements often involves observing teenage novice\
    \ drivers. There are some newbie drivers that stretch out every driving move they\
    \ make. When they are told to make a turn at the corner up ahead, they start the\
    \ turn a quarter mile beforehand. When they see a stop sign, even if its at a\
    \ distance of a football field length away, the novice driver often starts to\
    \ tap those brakes, getting the car slowed down, slowly, really slowly.\n\nThose\
    \ tend to be exaggerated micro-movements. Most seasoned drivers are apt to make\
    \ much more subtle micro-movements. Those weathered drivers have become ingrained\
    \ in how they drive a car. They aren’t necessarily aware that they are using micro-movements.\n\
    \nSimilar to my story about my poker playing friend that ended-up exploiting his\
    \ tell, there are some savvy drivers that like to use their micro-movements in\
    \ an exploitive way. These drivers often assume that other drivers will notice\
    \ the micro-movement and then back-off or otherwise give way to the driver that\
    \ is using the micro-movements."
