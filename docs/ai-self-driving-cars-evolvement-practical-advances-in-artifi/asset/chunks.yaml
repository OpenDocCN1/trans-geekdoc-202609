    I worry too that those firms not putting in place an appropriate Chief Safety
    Officer are risking not only the lives of those that will use their AI self-driving
    cars, but also putting into jeopardy the advent of AI self-driving cars all told.


    In essence, those firms that give lip service to safety of AI self-driving car
    systems or inadvertently fail to provide the upmost attention to safety, they
    are likely to bring forth adverse safety events on our roadways, and for which
    the public and regulators will react not just toward that offending firm, such
    incidents will become an outcry and overarching barrier to any furtherance of
    AI self-driving cars.


    Simply stated, for AI self-driving cars, the chances of a bad apple spoiling the
    barrel is quite high and something that all of us in this industry live on the
    edge of each day.


    In speaking with Mark Rosekind, Chief Safety Innovation Officer at `Zoox`, doing
    so at a recent Autonomous Vehicle event in Silicon Valley, he emphasized how safety
    considerations are vital in the AI self-driving car arena. His years as an administrator
    for the National Highway Traffic Safety Administration (`NHTSA`) and his service
    on the board of the National Transportation Safety Board (`NTSB`) provide a quite
    on-target skillset and base of experience for his role. For those of you interested
    in the overall approach to safety that `Zoox` is pursuing, you can take a look
    at their posted report: `https://zoox.com/safety/`


    Those of you that follow closely my postings will remember that I had previously
    mentioned the efforts of `Chris Hart` in the safety aspects of AI self-driving
    cars. As a former chairman of the `NTSB`, he brings key insights to what the auto
    makers and tech firms need to be doing about safety, along with offering important
    views that can help shape regulations and regulatory actions (see his web site:
    `https://hartsolutionsllc.com/`).


    You might find of interest his recent blog post about the differences between
    aviation automation and AI self-driving cars, which dovetails too into my viewpoint
    about the same topic. For `Chris Hart`’s recent blog post, see: `http://www.thedrive.com/tech/26896/self-driving-safety-steps-into-the-unknown`


    `Waymo`, `Google/Alphabet`’s entity well-known for its prominence in the AI self-driving
    car industry, has also brought on-board a Chief Safety Officer, namely `Debbie
    Hersman`. Besides her having served on the `NTSB` and having been its chairman,
    she also was the CEO and President of the National Safety Council. It was with
    welcome relief that she has come on-board to `Waymo` since it also sends a signal
    or sign to the rest of the AI self-driving car makers that this is a crucial role
    and one they too need to make sure they are embracing if they aren’t already doing
    so.


    `Uber` recently brought on-board `Nat Beuse` to head their safety efforts. He
    had been with the `U.S. Department of Transportation and oversaw vehicle safety
    efforts there for many years. For those of you interested in the safety report
    that `Uber` produced last year, coming after their internal review of the `Uber`
    self-driving car incident, you can find the report posted here: `https://www.uber.com/info/atg/safety/`


    I’d also like to mention the efforts of `Alex Epstein`, Director of Transportation
    at the National Safety Council (`NSC`). We met at an inaugural conference on the
    safety of AI self-driving cars and his insights and remarks were spot-on about
    where the industry is and where it needs to go. At the `NSC` he is leading their
    Advanced Automotive Safety Technology initiative. His efforts of public outreach
    are notable and the public campaign of `MyCarDoesWhat` is an example of how we
    need to aid the public in understanding the facets of car automation: `https://mycardoeswhat.org/`


    ## Defining the Chief Safety Officer Role


    I have found it useful to clarify what I mean by the role of a Chief Safety Officer
    in the context of a firm that has an AI-based product or service, particularly
    such as the AI self-driving car industry.


    As shown, the Chief Safety Officer has a number of important role elements. These
    elements all intertwine with each other and should not be construed as independent
    of each other. They are an integrated mesh of the space of safety elements needed
    to be fostered and led by the Chief Safety Officer. Allowing one of the elements
    to languish or be undervalued is likely to undermine the integrity of any safety
    related programs or approaches undertaken by a firm.


    The nine core elements for a Chief Safety Officer consist of:


    * Safety Strategy

    * Safety Company Culture

    * Safety Policies

    * Safety Education

    * Safety Awareness

    * Safety External

    * Safety SDLC

    * Safety Reporting

    * Safety Crisis Management


    I’ll next describe each of the elements.


    I’m going to focus on the AI self-driving car industry, but you can hopefully
    see how these can be applied to other areas of AI that involve safety-related
    AI-based products or services. Perhaps you make AI-based robots that will be working
    in warehouses or factories, etc., which these elements would then pertain to equally.


    ![](images/00002.jpeg)


    I am also going to omit the other kinds of non-AI safety matters that the Chief
    Safety Officer would likely encompass, which are well documented already in numerous
    online Chief Safety Officer descriptions and specifications.


    Here’s a brief indication about each element.


    ### Safety Strategy


    The Chief Safety Officer establishes the overall strategy of how safety will be
    incorporated into the AI systems and works hand-in-hand with the other top executives
    in doing so. This must be done collaboratively since the rest of the executive
    team must “buy into” the safety strategy and be willing and able to carry it out.
    Safety is not an island of itself. Each of the functions of the firm must have
    a stake in and will be required to ensure the safety strategy is implemented.


    ### Safety Company Culture


    The Chief Safety Officer needs to help shape the culture of the company to be
    on a safety-first mindset. Often times, AI developers and other tech personal
    are not versed in safety and might have come from a university setting wherein
    AI systems were done as prototypes, and safety was not a particular pressing topic.


    Some will even potentially believe that “safety is the enemy of innovation,” which
    is at times a rampant false belief. The company culture might require some heavy
    lifting and has to be done in conjunction with the top leadership team and done
    in a meaningful way rather than a light-hearted or surface-level manner.


    ### Safety Policies


    The Chief Safety Officer should put together a set of safety policies indicating
    how the AI systems need to be conceived of, designed, built, tested, and fielded
    to embody key principles of safety.


    These policies need to be readily comprehensible and there needs a clear-cut means
    to abide by the policies. If the policies are overly abstract or obtuse, or if
    they are impractical, it will likely foster a sense of “it’s just CYA” and the
    rest of the firm will tend to disregard the policies.


    ### Safety Education


    The Chief Safety Officer should identify the kinds of educational means that can
    be made available throughout the firm to increase an understanding of what safety
    means in the context of developing and fielding AI systems.


    This can be a combination of internally prepared AI safety classes and externally
    provided ones. The top executives should also participate in the educational programs
    to showcase their belief in and support for the educational aspects, and they
    should work with the Chief Safety Officer in scheduling and ensuring that the
    teams and staff undertake the classes, along with follow-up to ascertain that
    the education is being put into active use.


    * Safety Awareness

