  trans: '

    总的来说，在一种达尔文式的进化过程中，我们获得了一套似乎对所有人都行的汽车控制方法。我们已经让汽车进化到了普通人都能驾驶的程度。而且，他们可以一次又一次地开车。这几乎像骑自行车一样简单。有些人可能会说这更简单，因为骑自行车时，你首先需要学习如何平衡身体。


    这一切都简化为了：一个让汽车停下的踏板，一个让汽车前进的踏板，以及一个你可以扭动和转向来控制汽车方向的方向盘。这已经是最基础或最核心的操作了。我们本可以演化出汽车仪表盘上的一个负责制动的装置和一个负责加速的装置，或者可能在转向柱上安装旋钮来实现。我们也可以演变为通过旋钮或其他装置来改变汽车行驶方向，而不是使用方向盘。


    踏板和方向盘的美之处在于它们的简单性。它们很容易学会使用。它们不仅易于操作，而且设计初衷是为了及时响应。当你需要突然转弯汽车时，你可以抓抓住并扭动方向盘，这种动作几乎是本能的，并在过程中手臂和手部动作非常流畅。


    控制汽车的物理动作至关重要。如果转向非常笨拙，想象一下当你陷入恐慌情况时情况会变得多糟糕。当你只有几秒钟的时间来转向时，物理上执行所需的任何额外努力都会导致更多的伤亡和破坏。人类需要一种快速利用控制装置的能力。这就是为什么控制装置被放置在现在的位置。


    你可能感兴趣的是，已经有关于移动或改变驾驶控制方式的研究。我已经提到了一些可以在物理上重新放置这些装置的方法。有些人建议，也许我们应该直接通过语音与汽车控制系统对话，而不需要用肢体进行任何物理操作。正如你所猜的，这既有优点也有缺点（假设你失声了，假设你无意中发出了命令等）。


    关于使用汽车控制装置需要多久，有很多研究。调用汽车控制装置的时间可能关乎生死。


    想一一下，当你看到一只狗在你的车面前横穿马路会发生什么。你必须先看到这只狗这样做，因此你的眼睛需要观察路面。你的大脑必须处理处理狗可能会被撞到的这一点。你的头脑需要决定做什么，决定是避让、刹车，还是加速绕过这只狗。一旦你的大脑决定了做什么，你的身体就需要从物理上执行所需的动作。


    即使你已经抓住了方向盘或猛踩刹车，汽车也需要额外的时间来做出反应。在你调用汽车控制命令到汽车执行你的意图之间并不是瞬时反应。当你转动方向盘时，这个信号会传递给汽车的轮子，而这些轮子需要物理地转动，这一切都需要时间。刹车也是类似的延迟时间因素，意味着一旦你踩下刹车，这需要通过轮胎和制动系统来执行，并且考虑到汽车物理上停下所需的时间。


    在我们的脑海中，我们往往模糊了“操作汽车控制装置”与“汽车执行这些控制动作”之间的区别。只有当你处于危险境地时，偶尔才会意识到这种区别。在你的大脑中，你可能认为汽车可以瞬间停下，但从你移动身体让脚压下刹车板，到刹车真正启动，再到刹车咬合轮胎，再到道路和轮胎的物理特性让汽车停下，这段时间比你想象的要长得多。


    如果你曾经在你以为可以在碰撞前刹车的情况下滑入某个物体，你就明白我所说的这种时间延迟反应的了。


    你另一种可能意识到使用汽车控制装置的间接方面并观察汽车反应的情况，是在潮湿雨淋的道路上滑行或在雪地上行驶时。你将方向盘转向一个方向。但汽车却决定向另一个方向滑行。你再次转向方向盘，希望能让轮胎抓牢路面。你尝试加速，但也许轮胎只是空转而没有获得牵引。以此类推。


    你是否有过这样一个时刻，你对汽车控制装置做了一个动作并感到后悔，因此立即尝试撤销该动作？


    我当时坐在红灯前等右转，决定现在过去是安全的，于是踩下加速油板前进。突然，另一辆车从街上飞驰而过来，进入了我正转入的那条车道。我意识到最好的办法是停止右转。我迅速将脚从加速油板移到刹车板上。


    幸运的是，我停了下来，避免了与那辆横冲而来的汽车碰撞。但我想，我的汽车对我的动作会想什么。假设汽车实际上是活的，可能像宠物一样，比如你的狗。你猛拽狗（或汽车）让它向前，但紧又同样地猛拽狗（或汽车）让它停下。你是个什么样的糟糕主人？无法决定该做什么，导致狗（或汽车）承受了拉伸和压力，如果你能更好地计划自己的行动，这些这些是可以没必要的。


    这引出了关于使用汽车控制装置的另一点观点。激活和使用控制装置有战术层面，例如将脚放在踏板上并用手转动方向盘。你通常也会以更宏观的方式使用控制装置，至少希望你是这样做的。

    '
- fmt: "\nI know that most of you are likely seasoned drivers and perhaps take for\
    \ granted how easy it is to not only use the car controls, but also tie them together\
    \ into a series of efforts to achieve a larger goal such as driving down the street\
    \ to make a turn. As mentioned before, I think it is a miracle that we have hundreds\
    \ of millions of people that do this each and every day, and yet we don’t have\
    \ pure chaos and pandemonium. Could you get that many people to do something like\
    \ balance their checkbooks? Driving a car is much harder, and astoundingly we’ve\
    \ gotten everyone to do it reasonably well for most of the time.\n\n### What does\
    \ this have to do with AI self-driving cars?\n\nAt the Cybernetic AI Self-Driving\
    \ Car Institute, we are developing AI software for self-driving cars. An essential\
    \ aspect of AI self-driving cars is the use of the driving car controls by the\
    \ AI system. There is more to this than perhaps meets the eye.\n\nAllow me to\
    \ elaborate.\n\nI’d like to first clarify and introduce the notion that there\
    \ are varying levels of AI self-driving cars. The topmost level is considered\
    \ `Level 5`. A `Level 5` self-driving car is one that is being driven by the AI\
    \ and there is no human driver involved. For the design of `Level 5` self-driving\
    \ cars, the auto makers are even removing the gas pedal, brake pedal, and steering\
    \ wheel, since those are contraptions used by human drivers. The `Level 5` self-driving\
