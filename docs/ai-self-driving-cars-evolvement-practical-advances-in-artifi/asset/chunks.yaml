    This is a book that provides the newest innovations and the latest Artificial\
    \ Intelligence (AI) advances about the emerging nature of AI-based autonomous\
    \ self-driving driverless cars. Via recent advances in Artificial Intelligence\
    \ (AI) and Machine Learning (ML), we are nearing the day when vehicles can control\
    \ themselves and  will not require and nor rely upon human intervention to perform\
    \ their driving tasks (or, that allow for human intervention, but only require\
    \ human intervention in very limited ways). \n\nSimilar to my other related books,\
    \ which I describe in a moment and list the chapters in the Appendix A of this\
    \ book, I am particularly focused on those advances that pertain to self-driving\
    \ cars. The phrase “autonomous vehicles” is often used to refer to any kind of\
    \ vehicle, whether it is ground-based or in the air or sea, and whether it is\
    \ a cargo hauling trailer truck or a conventional passenger car. Though the aspects\
    \ described in this book are certainly applicable to all kinds of autonomous vehicles,\
    \ I am focused more so here on cars.\n\nIndeed, I am especially known for my role\
    \ in aiding the advancement of self-driving cars, serving currently as the Executive\
    \ Director of the Cybernetic AI Self-Driving Cars Institute.. In addition to writing\
    \ software, designing and developing systems and software for self-driving cars,\
    \ I also speak and write quite a bit about the topic. This book is a collection\
    \ of some of my more advanced essays. For those of you that might have seen my\
    \ essays posted elsewhere, I have updated them and integrated them into this book\
    \ as one handy cohesive package.\n\nYou might be interested in companion books\
    \ that I have written that provide additional key innovations and fundamentals\
    \ about self-driving cars.  Those books are entitled “Introduction to Driverless\
    \ Self-Driving Cars,” “Advances in AI and Autonomous Vehicles: Cybernetic Self-Driving\
    \ Cars,” “Self-Driving Cars: “The Mother of All AI Projects,” “Innovation and\
    \ Thought Leadership on Self-Driving Driverless Cars,” “New Advances in AI Autonomous\
    \ Driverless Self-Driving Cars,” “Autonomous Vehicle Driverless Self-Driving Cars\
    \ and Artificial Intelligence,” “Transformative Artificial Intelligence Driverless\
    \ Self-Driving Cars,” “Disruptive Artificial Intelligence and Driverless Self-Driving\
    \ Cars, and “State-of-the-Art AI Driverless Self-Driving Cars,” and “Top Trends\
    \ in AI Self-Driving Cars,” and “AI Innovations and Self-Driving Cars,” “Crucial\
    \ Advances for AI Driverless Cars,” “Sociotechnical Insights and AI Driverless\
    \ Cars,” “Pioneering Advances for AI Driverless Cars” and “Leading Edge Trends\
    \ for AI Driverless Cars,” “The Cutting Edge of AI Autonomous Cars” and “The Next\
    \ Wave of AI Self-Driving Cars” and “Revolutionary Innovations of AI Self-Driving\
    \ Cars,” and “AI Self-Driving Cars Breakthroughs,” “Trailblazing Trends for AI\
    \ Self-Driving Cars,” “Ingenious Strides for AI Driverless Cars,” “AI Self-Driving\
    \ Cars Inventiveness,” “Visionary Secrets of AI Driverless Cars,” “Spearheading\
    \ AI Self-Driving Cars,” “Spurring AI Self-Driving Cars,” “Avant-Garde AI Driverless\
    \ Cars,” and “AI Self-Driving Cars Evolvement” (they are all available via Amazon).\
    \ Appendix A has a listing of the chapters covered in those books.\n\nFor the\
    \ introduction herein to this book, I am going to borrow my introduction from\
    \ those companion books, since it does a good job of laying out the landscape\
    \ of self-driving cars and my overall viewpoints on the topic. The remainder of\
    \ the book is all new material that does not appear in the companion books. \n\
    \n# INTRODUCTION TO SELF-DRIVING CARS\n\nThis is a book about self-driving cars.\
    \ Someday in the future, we’ll all have self-driving cars and this book will perhaps\
    \ seem antiquated, but right now, we are at the forefront of the self-driving\
    \ car wave. Daily news bombards us with flashes of new announcements by one car\
    \ maker or another and leaves the impression that within the next few weeks or\
    \ maybe months that the self-driving car will be here. A casual non-technical\
    \ reader would assume from these news flashes that in fact we must be on the cusp\
    \ of a true self-driving car. "
