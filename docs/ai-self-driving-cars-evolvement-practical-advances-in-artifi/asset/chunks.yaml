    \n*   Sensor fusion\n\n*   Virtual world model updating\n\n*   AI action planning\n\
    \n*   Car controls command issuance\n\nAnother key aspect of AI self-driving cars\
    \ is that they will be driving on our roadways in the midst of human driven cars\
    \ too. There are some pundits of AI self-driving cars that continually refer to\
    \ a utopian world in which there are only AI self-driving cars on the public roads.\
    \ Currently there are about 250+ million conventional cars in the United States\
    \ alone, and those cars are not going to magically disappear or become true Level\
    \ 5 AI self-driving cars overnight.\n\nIndeed, the use of human driven cars will\
    \ last for many years, likely many decades, and the advent of AI self-driving\
    \ cars will occur while there are still human driven cars on the roads. \n\nThis\
    \ is a crucial point since this means that the AI of self-driving cars needs to\
    \ be able to contend with not just other AI self-driving cars, but also contend\
    \ with human driven cars. It is easy to envision a simplistic and rather unrealistic\
    \ world in which all AI self-driving cars are politely interacting with each other\
    \ and being civil about roadway interactions. That’s not what is going to be happening\
    \ for the foreseeable future. AI self-driving cars and human driven cars will\
    \ need to be able to cope with each other.\n\nReturning to the aspects of the\
    \ car controls, let’s consider how the AI is involved in making use of the car\
    \ controls.\n\nI’ll focus on the use of the car controls by the AI system solely,\
    \ and not cover much about what happens when the AI and the human are trying to\
    \ both deal with the car controls.\n\nAs mentioned earlier, this co-sharing is\
    \ especially problematic. Imagine that you were driving a car and another human\
    \ sat next to you in the front seat, having another set of driving controls, and\
    \ you both could each drive the car in terms of any of you opting to use any of\
    \ the pedals and turn the steering wheel as you wished. Mind boggling. The two\
    \ of you would need to really be on the same wavelength and seek to avoid undermining\
    \ each other. Consider too what would happen when an emergency arose. That makes\
    \ any kind of coordinated effort even more arduous.\n\nShifting though to the\
    \ use of a true Level 5 AI self-driving car, I’m going to walk you through some\
    \ of the salient facets of what the AI must do about the car controls and issuing\
    \ of car control commands.\n\n![](images/00005.jpeg)\n\nTake a look at Figure\
    \ 1.\n\nThere are six major steps involved in generating and enacting of the car\
    \ controls commands:\n\n1.  Determine car control commands to emit\n\n2.  Emit\
    \ car control commands to ECU\n\n3.  Verify that car control commands were received\
    \ and are viable\n\n4.  ECU instructs the automotive elements\n\n5.  Automotive\
    \ elements physically enact the received commands\n\n6.  Ascertain that car has\
    \ reacted to the commands\n\nFor ease of discussion, we’ll assume that there is\
    \ an ECU (Electronic Control Unit) that translates commands given to it from the\
    \ AI system and converts those commands into some set of specific operational\
    \ activities for the car. \n\nThe ECU has the task of conveying the operational\
    \ activities to a myriad of other subsystems that are in the car, including the\
    \ Brake Control Module (BCM), the Central Timing Module (CTM), the Transmission\
    \ Control Module (TCM), the Powertrain Control Module (PCM), the Engine Control\
    \ Module (ECM), etc.\n\nThere could easily be one hundred or more such sundry\
    \ control subsystems that each needs to be properly communicated with and instructed\
    \ on what needs to be done. You could have all of the protocols and capabilities\
    \ to do so within the AI system, but this seems unwieldy and generally ill-advised.\
    \ It makes more sense to hide that detail from the AI system and allow the AI\
    \ system to be providing commands at a high-level of abstraction.\n\nOne important\
    \ point about this notion of having the AI issues commands at a high-level of\
    \ abstraction is that you can potentially port the AI system over to other brands\
    \ and models of cars. If you embed directly into the AI system the specific protocols\
    \ of a particular model and brand of car, it will likely make it much harder to\
    \ port the AI system to other cars. By modularizing these aspects and keeping\
    \ the AI above the fray, you are usually able to more readily port over the AI\
    \ system.\n\nThat being said, let’s not kid ourselves. If the AI is far removed\
    \ from the nature of the underlying car brand and model, it is possible that the\
    \ AI system won’t be able to issue commands that might be feasible for the particular\
    \ car that the AI is working on. Suppose the AI system emits a car control command\
    \ that basically asks the car to accelerate from 0 to 60 miles per hour and the\
    \ AI assumes that this can be done in let’s say 3 seconds. That’s the speed for\
    \ sports-oriented cars and it isn’t going to work out well for more everyday cars.\n\
    \nThus, the AI system will likely need to be versed in some aspects of the brand\
    \ and model car that the AI is running on. Parameters about the specific performance\
    \ capabilities of the car, and the overall kinds of expected car controls commands,\
    \ all need to be cooked into the AI action planner that is seeking to ultimately\
    \ get the self-driving car to do driving actions. It does little good, and actually\
    \ great potential harm, for the AI system to be expecting the car to perform in\
    \ ways that the self-driving car is unable or incapable of doing.\n\nAnother consideration\
    \ for the AI system involves the type of network into which the car control commands\
    \ is going to be conveyed."
