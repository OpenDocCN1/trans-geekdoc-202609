    想象容器最简单的方法就是假设它是一个长方体形状。诚然，取决于你汽车的形状，这可能不是一个非常高效的容器。如果我们使用其他形状，比如球体或金字塔之类的规则形状，也许会更合适。或者，如果我们可以自己创建整个容器的设计，我们可能会将其设计成不规则的形状，随处弯曲以与你的汽车严丝合缝地贴合。


    在尝试将你的车放入某种容器中时，让我们将其称为边界体积（Bounded Volume，简称 BV）。我希望你帮助我把车放入容器中，这个容器将包含一定量的体积，并由我们使用的形状所限定。


    BV 可以是一个规则形状，比如相对简单的立方体或长方体。或者，你可能会想象另一种不那么常见的形状，例如锥体或金字塔，或者设计出一种相当不规则的形状，以其他更紧凑的方式符合你的汽车。


    ## 这与 AI 自动驾驶汽车有什么关系？


    在网络自动驾驶汽车研究所（Cybernetic AI Self-Driving Car Institute），我们正在为自动驾驶汽车开发 AI 软件。AI
    自动驾驶汽车的一个引人入胜的方面，也是一个经常不被讨论的方面，涉及到 AI 需要能够检测物体，并本质上在这些检测到的物体周围构建一个边界体积（一个虚拟容器）。这是整个
    AI 驾驶系统，特别是虚拟世界建模方面的关键工作。


    请允许我详细说明一下。


    我想先澄清并介绍这样一个概念：AI 自动驾驶汽车有不同的级别。最高级别被认为是 5 级。5 级自动驾驶汽车是由 AI 驾驶的，没有人类驾驶员参与。对于 5
    级自动驾驶汽车的设计，汽车制造商甚至去掉了油门踏、刹车板和方向盘，因为这些都是人类驾驶员使用的装置。5 级自动驾驶汽车不是由人类驾驶的，也不预期人类驾驶员会出现在自动驾驶汽车内。驾驶汽车完全由
    AI 承担。


    对于低于 5 级的自动驾驶汽车，车内必须有人类驾驶员。人类驾驶员目前被认为是汽车行为的责任方。AI 和人类驾驶员共同承担驾驶任务。尽管有这种共同共享，人类应该保持完全沉浸在驾驶任务中，并随时准备执行驾驶任务。我多次警告过这种共同共享安排的危险性，并预测它会产生许多不愉快的结果。


    让我们在这里关注真正的 5 级自动驾驶汽车。许多评论也适用于低于 5 级的自动驾驶汽车，但在讨论中，完全自动的 AI 自动驾驶汽车将获得最多的关注。


    以下是 AI 驾驶任务涉及的通常步骤：


    * 传感器数据收集与解释

    * 传感器融合

    * 虚拟世界模型更新

    * AI 动作规划

    * 汽车控制指令发布


    AI 自动驾驶汽车的另一个关键方面是，它们将在人类驾驶汽车中在我们的道路上行驶。有一些 AI 自动驾驶汽车的专家不断提到乌托邦世界，公共道路上只有 AI 自动驾驶汽车。目前，光美国就有
    2.5 亿多辆传统汽车，这些汽车不会一夜之间神奇地消失或变成真正的 5 级 AI 自动驾驶汽车。


    事实上，人类驾驶汽车的使用将持续多年，可能是几十年，而 AI 自动驾驶汽车的出现现在道路上仍有人类驾驶汽车的情况下。这是一个关键点，因为这意味着自动驾驶汽车的
    AI 不仅需要与其他 AI 自动驾驶汽车竞争，还要与人类驾驶汽车竞争。


    很容易想象一个简单且不现实的世界，在那里所有的 AI 自动驾驶汽车彼此之间礼貌地互动，并在道路交互中保持文明。在可预见的未来，情况并非如此。AI 自动驾驶汽车和人类驾驶汽车需要能够相互应对。


    ## 边界体积的重要性


    回到边界体积的话，让我们考虑为什么这对于 AI 自动驾驶汽车是一个如此重要的事情。


    自动驾驶汽车的 AI 系统将拥有各种传感器设备，包括摄像头、雷达、超声波、激光雷达（LIDAR）等。我们目前关注摄像头。


    当 AI 自动驾驶汽车行驶时，摄像头正在捕捉自动驾驶汽车周围的视觉图像。这些图像流入摄像头。在自动驾驶汽车上，有计算机处理器负责分析这些图像。图像处理正在查看是否有交通标志、附近是否有行人、附近是否有汽车等。这必须实时发生。时间至关重要。


    图像处理没有这种心不在焉行动的奢侈。当一辆汽车以每小时 65 英里的速度在高速公路上行驶时，其他汽车以相同或更快的速度飞驰而过，确认交通状况时没有多少时间可以浪费。图像处理有责任尽可能地解析图像并识别正在发生什么。


    人类驾驶员理所当然地认为他们可以看到周围的环境。他们通常不会在这方面想太多，因为这看起来显而易见且在预料之中。当然，我可以看到街对面的那个行人。当然，我可以看到那个限速标志。但是，如果我在这种情况中加入浓雾，人类驾驶员将被提醒，有时看到周围的环境是多么困难。

    '
- fmt: '

    Because of the somewhat predictability of objects that we might see while driving,
    it is possible to use Machine Learning or Deep Learning to try and prepare the
    image processing to be able to detect objects that are being seen by the camera.
    We can feed hundreds, maybe thousands upon thousands of images of pedestrians
    into a deep or large-scale multi-layer artificial neural network, and try to get
    it to pattern match on those images. You want the pattern matching to be general
    enough to detect a wide set of variations, rather than becoming fixed on particular
    shapes or sizes.


    Once the image processing has been trained, we’d put it into the on-board AI system
    of the self-driving car and have presumably tuned the image processing so that
    it can work quickly. Recall that I earlier emphasized the importance of time and
    the speed of processing. Having a great image processing system based on Deep
    Learning won’t do much good if it takes say 5 seconds to identify a potentially
    life-threatening object and for which during those 5 seconds the self-driving
    car has proceeded ahead unabated and rams into the object.


    The images streaming into the cameras of the self-driving car are likely to contain
    many objects. Think about the times you’ve driven in a downtown area at rush hour,
    such as in New York City or downtown Los Angeles. You might have many dozens of
    pedestrians. There might be animals such as people walking their dogs. There are
    cars to your left, cars to your right, cars behind you, cars ahead of you. A delivery
    person might be pushing a cart that contains delivery packages.


    It is chaos!


    Not only do you need to discern those objects, you also need to identify where
    the buildings are, where the curbs of the street are, and so on. There might be
    trees along the side of the street. There could be fire hydrants. A slew of objects
    is in that scene. If you’ve ever been with a novice teenage driver as they for
    the first-time drive in a busy downtown area, you can nearly see their eyes pop
    out of their head and their head explode as they try to notice and keep track
    of the myriad of objects.


    The AI system on-board the self-driving car has to do the same.


    ### Object Classification and Virtual Modeling


    One means to try and cope with the complexity of the scene involves classifying
    objects. The image processing tries to determine that the object standing at the
    street corner is a human, a pedestrian, and classifies the object as such. This
    gets posted into an overall model of what the surroundings consist of. The model,
    a virtual model of the real-world, provides a kind of mapping of what objects
    there are, along with what they are, and what they might do.


    Based on the virtual world model, the AI action planning portion of the on-board
    system will assess the situation and try to determine what actions to have the
    self-driving car undertake. If the virtual world model indicates that a car is
    directly ahead of the self-driving car, and the brake lights are on, and the car
    ahead is braking and the AI self-driving car is coming rapidly upon the stopping
    car, the AI action planner has to ascertain what to do.


    The AI action planner examines the virtual world model and tries to determine
    what action makes the best sense to initiate. Maybe the self-driving car can swerve
    around the car that’s stopping. This requires examining the virtual world model
    to see what is to the right and left of the car ahead. Are there pedestrians standing
    there? Is there a car in the way? These and a variety of what-if scenarios need
    to be rapidly explored.


    ### The Critical Role of Time


    Time is again crucial. If the AI action planner looks at twenty different what-if
    scenarios, it could use up so much time that the opportunity to swerve is now
    gone anyway. Keep in mind that the AI action planner needs to emit commands to
    the self-driving car controls, and those controls need to receive the commands
    and then undertake the physical actions indicated, such as giving gas to the accelerator
    or turning the steering wheel. That takes time. Suppose it takes 3 seconds to
    get the swerve underway, but it has taken meanwhile 2 seconds to decide upon the
    swerving action, it might be too late to further consider the swerving as viable.


    Imagine that a bike rider is also involved in the scenario of having to decide
    what to do about a car that ahead is unexpectedly coming to a stop. Maybe one
    option for the AI is to swerve the self-driving car into the bike lane and squeeze
    between the car that is stopping and a bike rider that is in the bike lane. Is
    there enough room there to fit into that tight space?


    ### Bounded Volumes


    This brings us back to the earlier discussion about Bounded Volumes.


    The image processing is usually established to not only try and find objects in
    the scene, but also classify those objects and appoint a Bounded Volume or virtual
    container to the object. The car ahead that is stopping will have been assigned
    a Bounded Volume associated with that car, depending upon the dimensions and size
    of the car. Likewise, the bike and the bike rider, which we’ll say are one object
    consisting of two things, we’ll assign a Bounded Volume or virtual container that
    encompasses that bike rider and bike.


    Why assign these make-believe containers to the objects? Well, as mentioned, suppose
    the AI is having to try and decide whether to slip between the stopping car that’s
    ahead and the bike rider that is in the bike lane. The self-driving car itself
    has its own Bounded Volume, which it should already be familiar with, and it needs
    to try and calculate whether the Bounded Volume of the self-driving car and fit
    between the Bounded Volume of the car ahead and the Bounded Volume of the bike
    rider.


    To visualize this, consider cubes or cuboids for each of these objects. We have
    a cuboid representing the self-driving car. We have a cuboid representing the
    car ahead. We have a cuboid representing the bike rider. Via the camera, let’s
    assume we can gauge the distance that’’s between the right side of the car ahead
    and the left edge of the bike rider. The width of the self-driving car has to
    be able to fit into that distance, if there’s any chance of sliding to the right
    of the stopping car.


    In the virtual world model, we’d have represented the Bounded Volumes of the car
    ahead, the bike rider, and the self-driving car. Based on the virtual world model
    aspects, the AI tries to ascertain whether the self-driving car can fit into the
    gap between the car ahead Bounded Volume and the Bounded Volume of the bike rider,
    as based on the Bounded Volume of the self-driving car.


    Though you might think this is an easy geometry problem and involves easy mathematics,
    I’d like to point out that there’s a lot more to this decision making.


    The car ahead is a Bounded Volume moving at a particular rate of speed and going
    in a particular direction. Same is said for the self-driving car. Same is said
    for the bike rider. They are all in-motion. This means that making predictions
    will involve uncertainty about what will happen next.


    Suppose the bike rider opts to suddenly swerve to their left, shortening the gap
    between them and the car ahead. Suppose the car ahead opts to swerve toward the
    bike rider, shortening the gap. The world is not stationary. The virtual world
    has to account for the motion of objects. This motion is not guaranteed to continue
    in any straightforward manner. The objects can likely alter their path, even if
    it maybe doesn’t make logical sense for them to do so.

    '
