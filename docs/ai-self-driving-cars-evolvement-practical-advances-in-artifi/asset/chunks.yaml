    \ teenage novice drivers showcasing micro-movements, there’s another kind of driver\
    \ that can do likewise, namely a drunk or DUI (Driving Under the Influence) driver.\
    \ When someone is just partially drunk, they often exhibit numerous micro-movements.\
    \ They do so because they are either unsure of what driving path they are going\
    \ to take, or they are lacking in their mental facilities and are erratically\
    \ coping with the car controls.\n\nIf you are a seasoned driver that watches for\
    \ drunk drivers, I’m sure you’ve seen many such micro-movements. That being said,\
    \ once a drunk or DUI driver has gotten fully engulfed by their mind-altering\
    \ influence, their car directing movements are bound to become the opposite of\
    \ micro-movements. The driver make overt and extremely overstated movements. Any\
    \ subtlety about their driving is now completely gone. \n\nWhat does this have\
    \ to do with AI self-driving cars?\n\nAt the Cybernetic AI Self-Driving Car Institute,\
    \ we are developing AI software for self-driving cars. One aspect that is not\
    \ yet getting much attention involves the micro-movements of driver behavior,\
    \ which some consider an edge or corner case problem.\n\nAllow me to elaborate.\n\
    \nI’d like to first clarify and introduce the notion that there are varying levels\
    \ of AI self-driving cars. The topmost level is considered Level 5. A Level 5\
    \ self-driving car is one that is being driven by the AI and there is no human\
    \ driver involved. For the design of Level 5 self-driving cars, the auto makers\
    \ are even removing the gas pedal, brake pedal, and steering wheel, since those\
    \ are contraptions used by human drivers. \n\nThe Level 5 self-driving car is\
    \ not being driven by a human and nor is there an expectation that a human driver\
    \ will be present in the self-driving car. It’s all on the shoulders of the AI\
    \ to drive the car.\n\nFor self-driving cars less than a Level 5, there must be\
    \ a human driver present in the car. The human driver is currently considered\
    \ the responsible party for the acts of the car. The AI and the human driver are\
    \ co-sharing the driving task. In spite of this co-sharing, the human is supposed\
    \ to remain fully immersed into the driving task and be ready at all times to\
    \ perform the driving task. I’ve repeatedly warned about the dangers of this co-sharing\
    \ arrangement and predicted it will produce many untoward results.\n\nLet’s focus\
    \ herein on the true Level 5 self-driving car. Much of the comments apply to the\
    \ less than Level 5 self-driving cars too, but the fully autonomous AI self-driving\
    \ car will receive the most attention in this discussion.\n\nHere’s the usual\
    \ steps involved in the AI driving task:\n\n*   Sensor data collection and interpretation\n\
    \n*   Sensor fusion\n\n*   Virtual world model updating\n\n*   AI action planning\n\
    \n*   Car controls command issuance\n\nAnother key aspect of AI self-driving cars\
    \ is that they will be driving on our roadways in the midst of human driven cars\
    \ too. There are some pundits of AI self-driving cars that continually refer to\
    \ a utopian world in which there are only AI self-driving cars on the public roads.\
    \ Currently there are about 250+ million conventional cars in the United States\
    \ alone, and those cars are not going to magically disappear or become true Level\
    \ 5 AI self-driving cars overnight.\n\nIndeed, the use of human driven cars will\
    \ last for many years, likely many decades, and the advent of AI self-driving\
    \ cars will occur while there are still human driven cars on the roads. This is\
    \ a crucial point since this means that the AI of self-driving cars needs to be\
    \ able to contend with not just other AI self-driving cars, but also contend with\
    \ human driven cars. \n\nIt is easy to envision a simplistic and rather unrealistic\
    \ world in which all AI self-driving cars are politely interacting with each other\
    \ and being civil about roadway interactions. That’s not what is going to be happening\
    \ for the foreseeable future. AI self-driving cars and human driven cars will\
    \ need to be able to cope with each other.\n\nReturning to the topic of micro-movements\
    \ of human driving behavior, let’s consider how these actions come to play in\
    \ the design and development of AI self-driving cars.\n\nI usually get asked two\
    \ questions about this topic, which comes up when I am speaking at industry conferences.\n\
    \nFirst, does it matter whether AI self-driving cars are developed such that they\
    \ will be able to detect the micro-movements of other cars?\n\nMy short answer\
    \ is that yes, it does matter and AI developers at the auto makers and tech firms\
    \ should be including this capability into their AI self-driving cars.\n\nMost\
    \ of the auto makers and tech firms are not yet encompassing the detection of\
    \ micro-movements. This lack of attention to the topic is due to several reasons.\n\
    \nSome of the auto makers and tech firms are oblivious to the nature of micro-movements\
    \ and so it isn’t even a matter that has reached their awareness to do something\
    \ about. Of those that are aware of it, they are already so taxed with trying\
    \ to do straightforward driving tasks that trying to add the assessment and use\
    \ of micro-movements in determining how to drive the AI self-driving car is an\
    \ overload for them right now.\n\nIndeed, many of those AI developers would contend\
    \ that analyzing micro-movements and using those analyses for guiding the driving\
    \ behavior of the AI is an edge or corner case. In the parlance of the AI field,\
    \ anything judged to be a corner case or edge case is something that can be put\
    \ on the backburner. It is not at the core of what they believe needs to be done.\
    \ As such, they might consider micro-movements interesting, but not vital enough\
    \ to warrant being on the pressing To-Do list.\n\nI’d like to challenge that assumption\
    \ about the low-priority assigned to dealing with micro-movements. I would argue\
    \ that being able to detect and decipher the micro-movements of other drivers\
    \ is a core driving skill. It allows you to anticipate what other cars and their\
    \ drivers are potentially going to do. By knowing about micro-movements, seasoned\
    \ human drivers can keep themselves out of potential troubles, which otherwise\
    \ those human drivers that seem out-of-tune about micro-movements are more prone\
    \ to getting caught off-guard by other drivers and their driving behaviors."
