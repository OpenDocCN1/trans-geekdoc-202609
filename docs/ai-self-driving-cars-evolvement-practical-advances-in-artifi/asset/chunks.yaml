    这里有一条真实新闻：我们距离真正的自动驾驶汽车还有很一段距离。要实现这一目标还需要几年的时间。


    为什么是这样？因为真正的自动驾驶汽车无异于一次“登月计划”。正如将人类送上月球是一项不可思议的壮举，实现真正的自动驾驶汽车也是如此。任何建议甚至鲁莽地声称真正的自动驾驶汽车近在咫尺的人，都应该引起人们极大的怀疑。事实上，你会发现，当我评估许多关于自动驾驶汽车的明显假新闻时，我往往倾向于使用“胡说（hogwash）”或“鬼扯（crock）”这类词。我们内部人士知道，经常对外报道的内容往往是一派之言。内部人士很少有人愿意直说。但我没有这种犹豫。


    事实上，我一直在写关于自动驾驶汽车的热门博客，并严厉抨击那些试图挥挥手、假装我们正处于真正的自动驾驶汽车边缘的人。多年来，我一直被称为`AI Insider`（AI
    内部人士）。除了撰写关于`AI`的文章外，我也开发 `AI` 软件。我言行一致。这让我能够洞察到其他在做 `AI` 的人究竟在做什么，与他们声称在做什么之间的区别。


    许多忠实的读者请求我将那些富有见地的短文汇编在一起，放入另一本书，而你现在手里拿的正是这本书。


    对于多年来一直阅读我文章的人来说，这个合集不仅将它们整合在一个方便的书中，我还更新了文章并添加了新材料。对于那些对自动驾驶汽车和`AI`领域还不熟悉的读者，我希望你们觉得这些文章通俗易懂且信息丰富。我的写作风格通常带有一种个人色彩，所以你会发现我有时会带着冷幽的幽默感，并讽刺随从主义。


    作为前教授和 `AI` 研究实验室的创始人，多年来我一直用学术写作的正式语言进行写作。我在引用期刊上发表过文章，并担任过几份 `AI`杂志的编辑。这里的写作并非那种性质，我为这些文章采用了更不同、更非正式的风格。尽管如此，我偶尔也会提到关于`AI`的更严谨的内容，并鼓励大家如果感兴趣，去研究那些更深入、更正式的材料。


    我还是一名 `AI` 实践者。这意味着我以编写 `AI` 软件为生。目前，我领导着`Cybernetics Self-Driving Car Institute`（控制论自动驾驶研究所），我们在那里为自动驾驶汽车开发
    `AI` 软件。我很高兴报告，我的儿子（也是一名软件工程师）领导着我们的`Cybernetics Self-Driving Car Lab`（控制论自动驾驶实验室）。我帮助创立的、他不可或缺的一部分，最终在我退休后将带向远远的未来。我的女儿是一个营销天才，作为我们`Marketing
    group`的负责人，也是我们工作中不可或缺的。她也将继续这项正在制定的事业。


    对于正在读这本书并热爱编写代码的人，你们可以考虑看看自动驾驶汽车的开源代码。这是学习如何为自动驾驶汽车开发 `AI` 的良好起点。目前也有许多新的教育课程层涌而出。想要学习和开发自动驾驶汽车的人群正在扩大，大学、实验室和其他可以让你学习自动驾驶汽车的途径也在不断增加。


    这本书将提供一些基础内容，我认为这些内容将为你以后参加那些更高级的培训机会做好准备。如果你已经上过那些课程，可能会发现这些文章特别有趣，因为它们提供了一个我打赌很少其他老师或教职员工带给你的视角。这些都是挑战性的文章，要求你超越对自动驾驶汽车的常规进行思考。


    # 所有 AI 项目之母


    2017 年 6 月，苹果公司首席执行官`Tim Cook` 出面并最终承认苹果一直在研发自动驾驶汽车。正如你们在我的文章中所看到的，苹果在自动驾驶汽车方面的努力一直处于高度保密状态。我们只能通过字里旁义来猜测苹果在做什么。`iCar`
    的概念已经流传了相当长，自动驾驶工程师和研究人员签署了严密的非保密协议（`NDA’s`），在苹果公司参与项目，而这些项目的神秘程度不亚于任何军事入侵计划。


    `Tim Cook` 说了一些在人工智能（`AI`）领域许多其他人也说过的话，即：制造自动驾驶汽车必须是所有 `AI` 项目之母。换句话说，这实际上是 `AI`
    领域的一项巨大的登月计划。如果能够制造出自动驾驶汽车并且 `AI` 像我们预期的的那样工作，那就意味着我们在 `AI` 方面取得了巨大的进步，因此它开启了
    `AI` 可以解决的许多其他潜在突破性成就的大门。


    这是夸张其辞吗？我只是试图让 `AI` 看起来像一个奇迹创造者，从而为我们这些编写 `AI` 软件的人提供一些自我陶醉的陈述吗？如果自动驾驶汽车可以被制造出来并且
    `AI` 如我们所希望的那样，这并不是夸张。开发自动驾驶汽车是非常、非常困难的。让我花点时间解释为什么。顺带一句，我意识到苹果 CEO 有时会发表夸张的言论，他曾表示
    2012 年是“所有年份之母”，iOS 10 的发布是“所有发布之母”——这一切都表明他喜欢使用“……之母”的表达。但向你们保证，在自动驾驶汽车方面，他确实切中了要害。


    当你思考登月计划以及我们如何到达月球时，有一些可识别的特征，这些特征同样适用于自动驾驶汽车。你会注意到我经常在自动驾驶汽车的表达前加上“真正的”一词。我这样做是因为根据我关于自动驾驶汽车各种等级的文章，有些自动驾驶汽车只是某种程度的自动驾驶。那些程度的版本需要人类驾驶员干预。在我看来，那不是真正的自动驾驶汽车。真正的自动驾驶汽车是完全不需要人类驾驶员干预的。它是一种可以通过自动化完全承担驾驶任务的汽车。这就是所谓的
    `Level 5` 驾驶汽车的本质。我们目前处于 `Level 2` 和 `Level 3` 阶段，还没有达到 `Level 5`。


    到达月球涉及诸许多方面，例如巨大的目标、渐进的过程、实验、创新等。让我们回顾这些方面如何应用于过去的登月计划，以及它们如何应用于今天的自动驾驶汽车登月计划。


    ## 巨大的目标


    ## 渐进的过程

