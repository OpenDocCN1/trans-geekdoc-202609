- fmt: '

    There are also car control commands that could be emitted that are not possible
    for the physical capabilities of the car. Remember that I earlier mentioned about
    the notion of going from 0 to 60 miles per hour in 3 seconds. If the AI system
    emits commands that are based on that capability, and yet if the self-driving
    car cannot achieve that kind of pace, this is a dangerous disconnect or confusion.
    One place to have a final double-check is at step 3 of the six major steps.


    It would be better though that such commands never get into the stream and the
    AI should not be relying on a slim chance hope that infeasible or impossible commands
    are going to get detected and rejects downstream.


    ### Traditional Engineering vs AI

    Most of these steps are complex and complicated when you get into their respective
    details. They involve doing a variety of real-time programming and are not particularly
    AI-based in terms of how you would develop these portions of the overall self-driving
    car systems. They are more akin to traditional automotive engineering and systems
    development.


    You might be wondering whether AI could help out in those seemingly non-AI related
    portions. Yes, there are some ways that we can apply AI to those elements.


    ### Pattern Recognition with Machine Learning

    One aspect involves using Machine Learning or Deep Learning to ferret out patterns
    of car controls commands actions. If there are patterns that can be found, it
    could make things easier for the AI system and the controlling of the self-driving
    car.


    We’ve taken large datasets of emitting car controls commands and fed them into
    large-scale multi-layer artificial neural networks. This is a means to seek out
    patterns. There are other ways to do so too, including using other popular techniques.
    You often would be wise to use an ensemble of Deep Learning techniques. Doing
    so allows for a wide array of hopefully identifying useful patterns.


    To explain why patterns of car controls commands might be handy, consider what
    you do as a human driver of a car. Let’s say that each morning you back your car
    out of your garage, doing so in reverse, going slowly, and enter into the street
    while backing out. Once you get far enough into the street, you turn the wheel
    toward the end of the street and begin to accelerate. You accelerate somewhat
    toward the end of the block, and then usually make a right turn. All of this is
    a series of maneuvers that you do each morning, almost like clockwork.


    In fact, the odds are that you do this driving sequence somewhat mindlessly. You
    are perhaps thinking about work and other matters, rather than concentrating on
    the driving task. You’ve done the sequence so much that it is rote or muscle memory,
    nearly acting without any awareness you are doing so. I admit that I do the same.
    There are some mornings that I reach the end of the block and suddenly am startled,
    amazed that I did that whole backing out and driving forward sequence, yet my
    mind was drifting to other topics.


    ### AI-Driven Driving

    Let’s put AI into the driver’s seat. Under the usual circumstances, the AI would
    need to calculate each of those particular actions and figure out what to do.
    From a raw and unprocessed blank slate, the AI would determine that the self-driving
    car needs to back out of the garage. Those car control commands would be baked
    fresh to do so. The AI would determine the self-driving car needs to make its
    way down the street. Those car control commands would be baked fresh. And so on.


    Suppose though that the AI self-driving car had used Machine Learning or Deep
    Learning to examine the voluminous amount of driving actions of the self-driving
    car over time. This pattern of each morning doing the same driving routine has
    a chance of being spotted by the Machine Learning or Deep Learning. If those kinds
    of driving patterns are identifiable, the AI could incorporate those sets or subsets
    into a collection or library of known driving patterns. These patterns could then
    be invoked when needed.


    ![](images/00007.jpeg)


    Take a look at Figure 3.


    Does the invoking of these driving patterns imply that the AI can somehow fall
    asleep and merely allow those sets to be carried out? Nope. In the same manner
    that a human driver cannot (should not) blindly perform the same driving pattern,
    nor can the AI do so.


    When I mentioned that I sometimes reach the corner of my street and realize that
    I was in a kind of mental fog, don’t misinterpret that suggestion to mean that
    I wasn’t paying attention to the driving task at all. One day, I started to back
    out of my garage, and my neighbor’s cat was sauntering in the street where I was
    backing out the car. Had I done my usual backing out, mindlessly, and if the cat
    had not realized the car was coming (perhaps it had not yet had its morning coffee!),
    it could have been a murky morning for that cat.


    An astute human driver will be paying attention to the driving task even if the
    driving task is a repetitive one that has become part of their habits of driving.
    I’m not saying all humans will be quite so diligent and that’s part of the problem
    with human drivers. In any case, the AI would need to still stay on top of its
    game, doing so while performing a set of car controls commands. At any moment,
    the sequence might need to be interrupted or altered, depending upon the driving
    situation at-hand.


    ## Conclusion

    Car controls commands are essential to the operation of a self-driving car. They
    don’t get the kind of media attention that you see going toward the sensor’s aspects
    of self-driving cars. Nonetheless, if the AI system and the car controls commands
    portion aren’t properly aligned, it can be a dangerous and very untoward situation.


    Though the car control commands aspects are primarily automotive engineering based,
    there are opportunities to add AI into the mix. One approach involves examining
    large datasets of car controls commands emissions and trying to find useful patterns.
    Caution needs to be exercised in doing so. There could be patterns that are not
    viable for reuse or that are only reusable in quite narrow circumstances.


    As a human driver, you are continually issuing car controls commands. They are
    coming from your brain, going to your limbs, and then involve using the pedals
    and the steering wheel. The use of the pedals and the steering wheel are then
    translated into the use of the car subsystems. Once those car subsystems undertake
    their efforts, the car physically attempts to perform those driving efforts. It’s
    all a dance of the human driver and the car. The same kind of dance has to happen
    with the AI and the self-driving car.


    ## CHAPTER 7: MULTI-SENSOR DATA FUSION AND AI SELF-DRIVING CARS

    A crucial element of AI self-driving cars is the capability to undertake Multi-Sensor
    Data Fusion (MSDF), consisting of collecting together and trying to reconcile,
    harmonize, integrate, and synthesize the data about the surroundings and environment
    in which the self-driving car is operating. Simple stated, the sensors of the
    self-driving car are the eyes, ears, and sensory input, while the AI must somehow
    interpret and assemble the sensory data into a cohesive and usable interpretation
    of the real world.


    If the sensor fusion does a poor job of discerning what’s out there, the AI is
    essentially blind or misled toward making life-or-death algorithmic decisions.
    Furthermore, the sensor fusion needs to be performed on a timely basis. Any extra
    time taken to undertake the sensor fusion means there is less time for the AI
    action planning subsystem to comprehend the driving situation and figure out what
    driving actions are next needed.


    Humans do sensor fusion all the time, in our heads, though we often do not overtly
    put explicit thought towards our doing so.

