  raw: "The problem of having an irregular shaped contour will be the added mathematical\
    \ and computational effort involved in dealing with the BV in the virtual world\
    \ model. Time is crucial and making the BV into an irregular shape is going to\
    \ cost you in terms of added computer processing time. There is a tradeoff involved\
    \ between using the simpler shapes which are computationally less expensive versus\
    \ using a complex shape that chews-up computational processing time.\n\nThere\
    \ are various algorithmic tricks that you need to employ when trying to make the\
    \ virtual world model as fast as possible. For example, when trying to determine\
    \ whether two or more Bounded Volumes are going to intersect, you can use the\
    \ Separating Axis Theorem (SAT), a quick method to determine the minimum penetration\
    \ vector involving two BV’s. Essentially, you mathematically try to see if there\
    \ is a line or plane that can fit between two Bounded Volumes, and if so, the\
    \ two are not yet intersecting.\n\nOne aspect that I often get asked about at\
    \ conferences involves whether the virtual world model and its use of Bounded\
    \ Volumes as virtual containers representing real-world objects can be calculated\
    \ outside of the self-driving car such as in the cloud of the auto maker or tech\
    \ firm. You would normally expect that all of these calculations have to take\
    \ place in the on-board AI system of the self-driving car, since the timing aspects\
    \ are so vital. That’s why AI self-driving cars are chockfull of the fastest processors\
    \ and tend to require a large amount of computer memory on-board.\n\nThe key problem\
    \ with trying to place the virtual world model into the cloud would be the latency\
    \ involved in conveying the matter to and from the cloud by the AI self-driving\
    \ car. \n\nThe amount of time involved in shoving up to the cloud the data from\
    \ the AI self-driving car that came from the sensors, and the amount of time to\
    \ get a result transmitted back down to the self-driving car, chews up so much\
    \ time that you might not be able to have the AI self-driving car acting in a\
    \ timely manner.\n\nUsually, any kind of OTA (Over-The-Air) aspects of the AI\
    \ self-driving car is going to be done for matters that are not time crucial per\
    \ se. At the end of a day of driving, for example, the AI self-driving car might\
    \ push up to the cloud the days’ worth of collected data, and meanwhile the cloud\
    \ might be pushing down into the AI self-driving car the latest patches and updates.\
    \ \n\nThere are hopes that with the advent of 5G, along with edge computing, perhaps\
    \ these aspects can take place in a more real-time way, though it is still seemingly\
    \ unlikely to happen fast enough to be in-the-loop during actual driving activities.\n\
    \nSome have proposed a hybrid approach of having a virtual world model within\
    \ the on-board system and a mirrored version in the cloud. The cloud-based version\
    \ would be used to explore “longer term” timeframe actions of the AI self-driving\
    \ car, such as examining what’s taking place some distance ahead of the self-driving\
    \ car. Meanwhile, the on-board AI system is focusing on the more immediate tactical\
    \ aspects. \n\nThis splitting of the effort allows the exploiting of say exascale\
    \ supercomputing power at the cloud level and can provided an added boost to what\
    \ the on-board AI is able to undertake.\n\nAnother aspect about the virtual world\
    \ model involves the use of Machine Learning or Deep Learning. \n\nMuch of the\
    \ virtual world model efforts are primarily logic-based and involve coding up\
    \ the calculations and predictions that come from the virtual world model. \n\n\
    Interestingly, trying to discern patterns of driving behaviors is possible by\
    \ leveraging the virtual world model. By collecting data about the virtual world\
    \ model over time, you can use Deep Learning to identify traffic and driver behaviors,\
    \ which can then be used for improving the predictive capabilities of the AI system.\n\
    \nConclusion\n\nThere used to be an advertising campaign about how plumbers were\
    \ the unseen and unheralded heroes of making sure that your house pipes and water\
    \ were flowing right. Most people don’t put much thought toward their plumbing,\
    \ other than when it breaks, and water is spilling onto their floors. You just\
    \ assume that the plumbing is done right and until or if it goes on the fritz,\
    \ you aren’t concerned about it.\n\nThe virtual world model and the Bounded Volumes\
    \ in AI self-driving cars are similar to the plumbing and the plumbers. You don’t\
    \ see much attention provided to these elements. \n\nInstead, all the glory seems\
    \ to go toward the sensors. There are weekly news updates about how a new LIDAR\
    \ sensor is better than another one, or how a camera for AI self-driving cars\
    \ has come out that has better vision capabilities than present ones. Sensors,\
    \ sensor, sensors.\n\nAs hopefully is now evident, if you have a lousy virtual\
    \ world model, or at least one that is not timely and well-tuned, it won’t matter\
    \ how good the sensors are, since it’s going to be a mess of knowing what surrounds\
    \ the self-driving car, and the AI action planner will be blind or thrown a kilter\
    \ by a lack of having a proper and timely indication of the surroundings. \n\n\
    Likewise, if the Bounded Volumes are poorly representing the real-world objects,\
    \ the AI action planner won’t be able to discern what makes sense in terms of\
    \ avoiding objects and also anticipating the intersecting of objects.\n\nFor those\
    \ AI developers that toil away in dealing with this kind of plumbing, let’s herald\
    \ them for their efforts. Though perhaps unseen and not appreciated, there is\
    \ an impressive amount of complexity and incredible effort involved in these matters,\
    \ plus much room left to advance these capabilities, which ultimately will make-or-break\
    \ the advent of safe and successful AI self-driving cars.\n\nCHAPTER 4\n\nMICRO-MOVEMENT\n\
    \nBEHAVIORS\n\n AND\n\nAI SELF-DRIVING CARS\n\nCHAPTER 4 \n\nMICRO-MOVEMENT\n\n\
    BEHAVIORS\n\nAND \n\nAI SELF-DRIVING CARS\n\nI was eagerly awaiting making a right\
    \ turn on a red light at a busy intersection that led onto the always hectic Pacific\
    \ Coast Highway (PCH). \n\nDutifully stopping behind the crosswalk line, I could\
    \ not quite see the prevailing traffic that was coming over a hilly portion of\
    \ PCH that fed down through this particular area. The layout meant that you could\
    \ not be fully sure whether the lanes were free to drive into and at any moment\
    \ a raging car might seemingly leap over the hill and barrel into you if you prematurely\
    \ had opted to make the treacherous right turn.\n\nBeing in a hurry, I decided\
    \ that I would just go for it and gunned my engine to swiftly propel my car through\
    \ the right turn and into the lane of traffic that seemed to be empty and available.\
    \ Unfortunately, in the split second that I had hit the gas, sure enough a car\
    \ appeared suddenly at the crest of the hill and I could see that it was intent\
    \ on using the lane that I was about to occupy. Some driver’s in my shoes might\
    \ proceed anyway and force the other driver to either hit their own brakes or\
    \ swerve to another lane to avoid me, the lane intruder.\n\nI didn’t want to chance\
    \ the possibility of having the nearing car rear-end my car, plus I would obviously\
    \ have been in the wrong for my actions. I urgently moved my foot from the accelerator\
    \ over to the brake and jammed down hard, forcing my car to come to a heart stopping\
    \ halt. Yes, I was protruding somewhat into the lane, but it was not enough to\
    \ cause the other car to undertake a diversion or hit their own brakes. They could\
    \ sweep past my now half-in half-out car and proceed without skipping a beat."
