    \ a pedestrian over there? Is that a bike rider? Is that a car up ahead? Is that\
    \ a car to the right?\n\nBy-and-large, most of what you might see on the roadway\
    \ is relatively predictable, meaning that you can expect to see human pedestrians,\
    \ you can expect to possibly see animals such as dogs or deer, you can expect\
    \ to see other cars, and so on. As a human, you’ve learned or somehow come to\
    \ know that a pedestrian is a human that is walking, standing, sitting, or otherwise\
    \ a human-like figure that likely has arms, legs, a head, a body, feet, hands,\
    \ and other such elements.\n\nWhile driving your car, you look across the street\
    \ and see a figure that consists of a head, a body, arms, feet, and the rest.\
    \ In your mind, you somehow click to the notion that it is a human. Oh, but wait,\
    \ it turns out that it is a statue of a famous president, placed at the corner\
    \ of that upcoming street. It looked at first glance like a human, a living breathing\
    \ human, but it turns out to be a statue of a human. Obviously, that’s quite different.\n\
    \nWhy is it different? The odds are that you aren’t expecting the statue to suddenly\
    \ move along and try to cross the street. If it was a human standing there, you’d\
    \ be watching to see what the human is doing. Are they looking as though they\
    \ want to cross the street? Is the human merely standing or starting to walk or\
    \ run? How far from the street is the human? If the human runs versus walks, how\
    \ soon might they appear in the street?"
