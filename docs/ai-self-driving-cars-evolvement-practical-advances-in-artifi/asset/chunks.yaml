    # 引言


    人类驾驶员会理解 L3 级的能力吗？人类驾驶员知道 AI 正在尝试驾驶汽车吗？AI 会意识到人类何时选择驾驶吗？AI 会意识到人类驾驶员实际上准备好并能够驾驶吗？当危机时刻发生时，例如
    AI 正以每小时 60 英里的速度行驶，突然判断已到达人类驾驶员应该接管控制权的界点，这是一个棘手的命题。人类驾驶员是否为此做好了准备？他们知道 AI 为什么认为现在该由人类开车了？


    这其中的很大一部分涉及人机交互（`HMI`）方面。


    当你们共同驾驶时，双方都必须准确且及时地告知对方正在做什么、想做什么，或希望对方做什么。对于汽车来说，这可以通过仪表盘上亮起的指示灯来实现，或者可能是 AI
    系统向驾驶员说话。


    然而，这在所有情况下都不是容易安排的方面。


    例如，如果 AI 向驾驶员说话并解释驾驶员需要接管方向盘，想象一下说话需要多长时间，加上驾驶员必须确保自己正在听、听清了 AI 说的话，并理解了 AI 说的内容。


    这还需要人类花时间考虑他们应该采取什么行动，然后采取该行动。在危机时刻，驾驶决策需要迅速做出并执行，这些都是宝贵的时间。


    ## 关键要点 #5：人类操作员的教育/培训


    关于波音 737 MAX 8 情况提出的一个问题涉及应该向人类飞行员提供多少教育或培训，特别是与 `MCAS` 相关的，以及人类飞行员过去或现在如何被告知
    `MCAS` 的各个方面。


    在 AI 自驾驶汽车的情况下，开车和飞飞机之间的一个明显区别是，飞机飞行员是以专业身份工作的，而人类驾驶汽车通常是以一种更非正式的方式进行的（我暂时排除赛车手、出租车司机、班班车司机等专业驾驶员）。


    商业航空公司飞行员受各种关于教育、培训、飞行小时、认证、重新认证等规则的约束。我将不再深入探讨 `MCAS` 的教育和培训方面，我们只需考虑，对于应对与你共同驾驶任务的先进自动化系统，你可能接受什么样的教育或培训。


    对于今天普通的汽车执照驾驶员来说，我认为我们都能同意，他们接受的关于汽车的教育和培训相当少。尽管这似乎运行得相对还可以，因为大多数驾驶员在大多数时候似乎都能充分操作一辆普通汽车。


    我们之所以能够保持驾驶教育和培训量在较低水平，部分原因是驾驶传统汽车具有惊人的简单性。你需要知道如何操作刹车、油门、方向盘以及如何将汽车入挡。其余的驾驶任务是确定你开向哪里，然后执行驾驶的战术方面，如加速、减速和向某个方向转向。


    当你买一辆车时，通常有一本解释如何使用各项功能的说明书，但大多数人并不读它。（注：原文中存在大量重复段落，已根据要求进行去重处理）。

