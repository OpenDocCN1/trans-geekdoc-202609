- fmt: "\nThe story might end there, and I suppose might have been unworthy perhaps\
    \ of telling if that’s all that happened, except for one little and quite important\
    \ fact. There was a car that was behind me, also waiting at the red light, and\
    \ the driver had been apparently hopeful of making the right turn as I did so.\
    \ This car had inched its way up to my rear bumper and was earnestly urging me\
    \ to make the right turn swiftly. I’m sure you’ve had this kind of eager beaver\
    \ behind you. They breath down your neck and get irritated and upset if you don’t\
    \ make a highly expedient right turn on red.\n\nWell, this other driver had assumed\
    \ that since I was gunning my engine and leaping forward, they might as well do\
    \ the same. I guess we were going to be like two sprinters that heard the starting\
    \ gun go off and it was then a race to get underway. When I opted to hit my brakes,\
    \ doing so suddenly, the driver behind me was caught by surprise.\n\nAllow me\
    \ a moment to carp about that driver. In my view, if they are going to follow\
    \ behind me with nary any space allotted between the two of us, it is incumbent\
    \ upon that driver to be fully ready to react in whatever way the driver ahead\
    \ of them acts. It is a solemn golden rule of follow-the-leader in car driving.\
    \ Anyone that is going to play the follow-the-leader game and do so without a\
    \ safety cushion, they need to mirror the actions of the leader and do so with\
    \ the same quickness of any efforts by the leader. Anyone that can’t do that should\
    \ not be participating in follow-the-leader. Just wanted to get that off my chest.\n\
    \nIn any case, the car behind me almost rammed into my car. Thankfully, it was\
    \ almost and not an actual hit. The driver swerved to avoid hitting the back of\
    \ my car and jammed against the curb where the right turn was. I could see in\
    \ my rearview mirror that the driver was upset – at me, and was apparently cursing\
    \ and making unmentionable finger movements expressing their displeasure at my\
    \ actions.\n\nI usually try to calculate the moves of any cars behind me in whatever\
    \ driving actions I take, and likely normally would have realized the other driver\
    \ was within an inch of my car and not therefore have rocketed forward, but in\
    \ this case I was in a hurry and assumed the other driver would be savvy enough\
    \ to realize the potential for a rapid braking due to the `PCH` hilly road shape.\
    \ Too bad for them that they miscalculated. It didn’t look like there was any\
    \ actual damage to their car and so I proceed to now continue the right turn and\
    \ make my way to my looming appointment.\n\nI did have in the back of mind a concern\
    \ that this driver might get themselves worked up into a road rage. You know how\
    \ that can happen in these kinds of circumstances. The driver was mad at me. They\
    \ were in a hurry. I fully expected the driver to now also make the right turn,\
    \ and then attempt to catch-up with me, coming alongside of my car to make more\
    \ reprehensible gestures at me. Or, perhaps even try to run me off the road. You\
    \ never know what crazy things people might do.\n\nWhen you think about the situation,\
    \ I probably accelerated for just a fraction of a second or so. My car appeared\
    \ to leap forward like a leopard. The total distance covered was just a handful\
    \ of feet. Luckily my brakes were darned good and when I jammed my foot onto the\
    \ brake pedal the car came to an amazingly crisp stop. You could almost say that\
    \ the whole thing happened in the blink of an eye.\n\nI’m not sure that any of\
    \ the other nearby drivers noticed what happened. The car that was barreling down\
    \ `PCH` that I had wanted to avoid hitting was probably just happy that my car\
    \ was not in their way. \n\nOther cars at the intersection that were waiting to\
    \ go were probably looking at the red light and expecting it to soon turn green.\
    \ All in all, I’d bet that only me and the car behind me were aware of the dance\
    \ that the two of us undertook.\n\n## The Concept of Micro-movements\n\nI’ve told\
    \ you this story to bring up something that is quite important and yet often overlooked\
    \ as an aspect of human driving behavior, namely the use of micro-movements when\
    \ driving.\n\nA micro-movement is considered a somewhat subtle driving action\
    \ that exists somewhere in the gray area between doing an overt and obvious driving\
    \ maneuver and doing essentially no noticeable driving maneuvering at all.\n\n\
    Some human drivers are oblivious to the nature of micro-movements. These drivers\
    \ are blind to noticing micro-movements and can’t readily tell you what a micro-movement\
    \ looks like. Their attention to the driving task is based on wholescale movements\
    \ and maneuvers, ones that are stand out like a brass band and are so obvious\
    \ that you’d truly need to be blind to miss them. Anything than the outright maneuver\
    \ of a car is totally lost on them.\n\n## Observations on the Road\n\nI remember\
    \ one colleague at work that used to drive several of us out to lunch on Friday’s.\
    \ He drove his car like it was a Sherman tank. He was master of the roadway, and\
    \ no one dared to get in his way. This vividly became evident on one occasion\
    \ involving him and a car that appeared to be driven by someone lost and unfamiliar\
    \ with the local streets.\n\nThe driver ahead of us was driving relatively slowly\
    \ in terms of being just a tad below the posted speed limit. The car had several\
    \ times started toward the curb as though the driver was thinking of stopping\
    \ or parking, and yet the driver continued ahead. It seemed apparent to me and\
    \ everyone else in the car that my colleague was driving that this other driver\
    \ was trying to figure out where they were and wanted to maybe park at a specific\
    \ address.\n\nMy clueless colleague did not notice the antics of the other car.\
    \ Driving his car like a take-no-prisoners tank commander, he nearly rolled over\
    \ the other car when it tried to make a few of those potential darts to the curb.\
    \ If it had been me doing our lunch journey driving, I would have given the other\
    \ car some added space to allow them to do these swaying kinds of motions. Plus,\
    \ I would have swung into the left lane and gone around the other car, hoping\
    \ to then avoid the situation entirely of dealing with the other car.\n\nAfter\
    \ we made it to the lunch, I asked my colleague if he had noticed the car that\
    \ had been in front of us. What do you mean, he asked, what was to be noticed?\
    \ When I told him about the micro-movements of the other driver, my colleague\
    \ insisted that I was making it up. It was a gag, he insisted. Fortunately, my\
    \ fellow lunch time eaters all chimed in about that car. They had all noticed\
    \ it too. Of course, this only inspired my colleague to claim that it was a conspiracy\
    \ and we were all ganging up on him.\n\nYou don’t necessarily need to be in a\
    \ car to see the micro-movements of other cars. I ride my bike quite a bit and\
    \ anyone that is hopeful of surviving the riding of a bike in city traffic is\
    \ likely to be an expert on the micro-movement evidenced by cars and those wacky\
    \ human drivers.\n\nJust last week, I was in the bike lane, minding my own business,\
    \ and I had a car that zoomed along and passed me, doing so with a flourish. The\
    \ car traffic up ahead was stopping to deal with a roadway construction effort,\
    \ and I lamented in my mind that this “jerk” was going too fast toward it. In\
    \ my book, the driver ought to be slowing down and getting ready to figure out\
    \ how to safety navigate around the street repair efforts.\n\nDue to the bunching\
    \ up of the car traffic, I caught up with the traffic since the bike lane was\
    \ unimpeded. It was one of those rare cases whereby you can go faster along than\
    \ the cars can. The cars were jockeying for position to find a means to navigate\
    \ around the street crew and meanwhile I was rocketing ahead on my bike.\n"
