    \ trying to find a parking spot, it can become a gamesmanship effort of who suggests\
    \ they found an open spot first. You’ve likely seen two cars that came open an\
    \ open spot, and the cars are facing each other head-to-head. Which one will get\
    \ the spot? If one driver angles their wheels, it can be a kind of assertion that\
    \ they have tagged the spot and are going to aggressively make their way into\
