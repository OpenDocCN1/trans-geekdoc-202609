- fmt: "\nThis approach involves declaring a kind of winner as to the first sensor\
    \ that provides its reporting is the one that you’ll go with. The advantage is\
    \ that for timing purposes, you presumably won’t wait for the other sensors to\
    \ report, which then speeds up the sensor fusion effort. On the other hand, you\
    \ don’t know if a split second later one of the other sensors might report something\
    \ of a contrary nature or that might be an indication of imminent danger that\
    \ the first sensor did not detect.\n\nLike the other methods, there are tradeoffs\
    \ in doing things this way.\n\n### Most-Reliable Method\n\nIn this approach, you\
    \ keep track of the reliability of the myriad of sensors on the self-driving car.\
    \ The sensor that is most reliable will then get the nod when there is a sensor\
    \ related data dispute.\n\nLike the other methods, there are tradeoffs in doing\
    \ things this way.\n\n### Survivor Method\n\nIt could be that the AI self-driving\
    \ car is having troubles with the sensors. Maybe the self-driving car is driving\
    \ in a storm. Several of the sensors might not be doing any viable reporting.\
    \ Or, perhaps, the self-driving car has gotten sideswiped by another car, damaging\
    \ many of the sensors. This approach involves selecting the sensors based on their\
    \ survivorship.\n\nLike the other methods, there are tradeoffs in doing things\
    \ this way.\n\n### Random Selection (Worst Case)\n\nOne approach that is obviously\
    \ controversial involves merely choosing among the sensor fusion choice by random\
    \ selection, doing so if there seems to not be any other more systemic way to\
    \ choose between multiple sensors if they are in disagreement about what they\
    \ have or have not detected. \n\nLike the other methods, there are tradeoffs in\
    \ doing things this way.\n\n### Other\n\nYou can use several of these methods\
    \ in your sensor fusion subsystem. They can each come to play when the subsystem\
    \ determines that one approach might be better than the other.\n\nThere are other\
    \ ways that the sensor fusion voting can also be arranged.\n\n## How Multiple\
    \ Sensors Differ is Quite Important\n\nYour hearing is not the same as your vision.\
    \ When I heard a siren, I was using one of my senses, my ears. They are unlike\
    \ my eyes. My eyes cannot hear, at least I don’t believe they can. This highlights\
    \ that there are going to be sensors of different kinds. \n\nAn overarching goal\
    \ or structure of the Multi-Sensor Data Fusion involves trying to leverage the\
    \ strengths of each sensor type, while also minimizing or mitigating the weaknesses\
    \ of each type of sensor.\n\nOne significant characteristic of each type of sensor\
    \ will be the distance at which it can potentially detect objects. This is one\
    \ of the many crucial characteristics about sensors.\n\nThe further out that the\
    \ sensor can detect, the more lead time and advantage goes to the AI driving task.\
    \ Unfortunately, often the further reach also comes with caveats, such as the\
    \ data at the far ends might be lackluster or suspect. The sensor fusion needs\
    \ to be established as to the strengths and weaknesses based on the distances\
    \ involved.\n\nHere’s the typical distances for contemporary sensors, though keep\
    \ in mind that daily improvements are being made in the sensor technology and\
    \ these numbers are rapidly changing accordingly.  \n\n*   Main Forward Camera:\
    \ 150 m (about 492 feet) typically, condition dependent\n*   Wide Forward Camera:\
    \ 60 m (about 197 feet) typically, condition dependent\n*   Narrow Forward Camera:\
    \ 250 m (about 820 feet) typically, conditions dependent\n*   Forward Looking\
    \ Side Camera: 80 m (about 262 feet) typically, condition dependent\n*   Rear\
    \ View Camera: 50 m (about 164 feet) typically, condition dependent\n*   Rearward\
    \ Looking Side Camera: 100 m (about 328 feet) typically, condition dependent\n\
    *   Radar: 160 m (about 524 feet) typically, conditions dependent\n*   Ultrasonic:\
    \ 8 m (about 26 feet) typically, condition dependent\n*   LIDAR: 200 m (about\
    \ 656 feet) typically, conditions dependent\n\nThere are a number of charts that\
    \ attempt to depict the strengths and weaknesses when comparing the various sensor\
    \ types. I suggest you interpret any such chart with a grain of salt. I’ve seen\
    \ many such charts that made generalizations that are either untrue or at best\
    \ misleading.\n\nAlso, the number of criteria that can be used to compare sensors\
    \ is actually quite extensive, and yet the typical comparison chart only picks\
    \ a few of the criteria. Once again, use caution in interpreting those kinds of\
    \ short shrift charts.\n\n![](images/00010.jpeg)\n\nTo give you a bit of an indication\
    \ about the variety of factors or criteria, here’s a handy list to consider:\n\
    \n*   Object detection\n*   Object distinction\n*   Object classification\n* \
    \  Object shape\n*   Object edges\n*   Object speed\n*   Object direction\n* \
    \  Object granularity\n*   Maximum Range\n*   Close-in proximity\n*   Width of\
    \ detection\n*   Speed of detection\n*   Nighttime impact\n*   Brightness impact\n\
    *   Size of sensor\n*   Placement of sensor\n*   Cost of sensor\n*   Reliability\
    \ of sensor\n*   Resiliency of sensor\n*   Snow impact\n*   Rain impact\n*   Fog\
    \ impact\n*   Software for sensor\n*   Complexity of use\n*   Maintainability\n\
    *   Repairability\n*   Replaceability\n*   Etc.\n\n![](images/00011.jpeg)\n\n\
    ## Conclusion\n\nIt seems that the sensors on AI self-driving cars get most of\
    \ the glory in terms of technological wizardry and attention. The need for savvy\
    \ and robust Multi-Sensor Data Fusion does not get much airplay. As I hope you\
    \ have discovered, there is an entire and complex effort involved in doing sensor\
    \ fusion. Humans appear to easily do sensor fusion. When you dig into the details\
    \ of how we do so, there is a tremendous amount of cognitive effort involved.\
    \ For AI-driving cars, we need to continue to press forward on ways further enhance\
    \ MSDF. The future of AI-driving cars and the safety of those that use them are\
    \ dependent upon MSDF. That’s a fact.\n\n## APPENDIX\n\n### APPENDIX A: TEACHING\
    \ WITH THIS MATERIAL\n\nThe material in this book can be readily used either as\
    \ a supplemental to other content for a class, or it can also be used as a core\
    \ set of textbook material for a specialized class. Classes where this material\
    \ is likely used include any classes at the college or university level that want\
    \ to augment the class by offering thought provoking and educational essays about\
    \ AI and self-driving cars.\n\nIn particular, here are some aspects for class\
    \ use:\n\n*   Computer Science: Studying AI, autonomous vehicles, etc.\n*   Business:\
    \ Exploring technology and it adoption.\n*   Sociology: Sociological views on\
    \ the adoption and advancement of technology.\n\nSpecialized classes at the undergraduate\
    \ and graduate level can also make use of this material.\n\nFor each chapter,\
    \ consider whether you think the chapter provides material relevant to your course\
    \ topic. There is plenty of opportunity to get the students thinking about the\
    \ topic and force them to decide whether they agree or disagree with the points\
    \ offered and positions taken. I would also encourage you to have the students\
    \ do additional research beyond the chapter material presented (I provide next\
    \ some suggested assignments).\n\n# RESEARCH ASSIGNMENTS ON THESE TOPICS\n\nYour\
    \ students can find background material on these topics, doing so in various business\
    \ and technical publications. I list below the top ranked AI related journals.\
    \ For business publications, I would suggest the usual culprits such as the Harvard\
    \ Business Review, Forbes, Fortune, WSJ, and the like.\n\nHere are some suggestions\
    \ of homework or projects that you could assign to students:\n"
