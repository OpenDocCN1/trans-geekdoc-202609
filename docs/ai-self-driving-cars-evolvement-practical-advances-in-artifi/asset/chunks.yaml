  trans: '


    当我帮助孩子们学习开车时，我确保特意指出了微动作（micro-movements）的方面。我确信很多家长没有考虑到这一点，也没有意识到要向他们新手驾驶员的孩子提到这些，并假设孩子们会以某种方式自己学会。有些
    AI 开发者似乎认为同样的情况会发生在 AI 自动驾驶汽车上，即他们并不试图显式地训练 AI 注意微动作，而是希望或假设这些动作会通过 AI 自身的“神性”自然产生。我怀疑这不会发生。


    我曾尝试回答第一个问题，即 AI 自动驾驶汽车应该具有检测、分析和利用人类驾驶员所做的微动作的能力。当然，我是肯定的。


    我收到的第二个问题是，AI 自动驾驶汽车是否应该利用微动作，以类似于人类驾驶员使用微动作的方式。


    我的答案是定的，AI 也应该利用微动作。原因如下。


    人类驾驶员通常习惯于检测其他车辆的微动作。我我也注意到有些人类驾驶员似乎对检测微动作毫无察觉，但那些驾驶员占的比例很小。


    我还会认为，许多驾驶员可能并没有意识到自己正受到其他驾驶员微动作的影响，但他们确实确实了影响。你可能用余光捕捉到另一辆车细微的微动作。这样做，你可能会在没有任何可识别或或说出的理由的情况下做出反应，并对该微动作做出回应。人类非常擅长模式匹配。他们即使在没有显式思考要这样做时，往往也能找到模式。


    AI 自动驾驶汽车应该向人类驾驶员发送同样的细微“信号”，采取与其他人类驾驶员类似的行为。这符合我的核心观点：如果 AI 自动驾驶汽车要在人类驾驶员中行驶（我们知道事实如此），那些
    AI 驾驶员就需要执行人类驾驶员执行的动作。


    如果 AI 缺乏微动作展示能力，意味着 AI 自动驾驶汽车周围的人类驾驶员将失去可以预测 AI 自动驾驶汽车将做什么的关键“线索”（tell）。没有了线索，人类驾驶员将措手不及。“什么，那该死的
    AI 自动驾驶汽车转右弯了，我完全没料到，”将成为常见的抱怨。


    在某种意义上，我认为那些人类驾驶员是正确的。他们的抱怨是有理的。谁想要其他驾驶员（无论是人类还是 AI）在做事情时，似乎没有我们已经习惯看到的通常警告（或线索）？这简直是灾难的根源。


    你愿意在我们的道路上投入大量不按照惯例驾驶的驾驶员吗？这不是一个明智之举。


    如果你真的这样做，就像是将交通分成了两类驾驶员。再加上此，如果人类驾驶员无法轻易判断 AI 驾驶员将要做什么，而且 AI 驾驶员也不精长读取微动作，因此不知道人类将要做什么，这简直是灾难的根源。


    ## 结论


    你愿意在我们的道路上投入大量不按照惯例驾驶的驾驶员吗？这不是一个明智之举。


    如果你真的这样做，就如同是将交通分成了两类驾驶员。再加上此，如果人类驾驶员无法轻易判断 AI 驾驶员将要做什么，而且 AI 驾驶员也不精长读取微动作，因此不知道人类将要做什么，这简直是灾难的根源。


    ## 发现总结


    这再次体现了我的核心观点：如果 AI 自动驾驶汽车要在人类驾驶员中行驶（我们知道事实如此），那些 AI 驾驶员就需要执行人类驾驶员执行的动作。


    如果 AI 缺乏微动作展示能力，意味着 AI 自动驾驶汽车周围的人类驾驶员将失去可以预测 AI 自动驾驶汽车将做什么的关键“线索”。没有了线索，人类驾驶员将措手不及。“什么，那该死的
    AI 自动驾驶汽车转右弯了，我完全没料到，”将成为常见的抱怨。


    在某种意义上，我认为那些人类驾驶员是正确的。他们的抱怨是有理的。谁想要其他驾驶员（无论是人类还是 AI）在做事情时，似乎没有了我们已经习惯看到的通常警告（或线索）？这简直是灾难的根源。


    ## 技术分析


    波音 737 MAX 8 最近出现在新闻中，遗憾的是，这是由于 2019 年 3 月 10 日涉及埃塞俄俄航空 302 航班的致命性坠机。新闻报告显示，2018
    年 10 月 29 日狮子航空 610 航班发生的另一起波音 737 MAX 8 致命性坠机可能相似。值得注意的是，狮子航空的事故仍在调查中，而埃塞俄俄航空的事故（在写作时）才刚刚开始。我想在理解的这一阶段，考虑我们是否可以初步识别出对人工智能（AI）系统的设计、开发和部署具有指导意义的方面。


    尽管波音 737 MAX 8 不包含可能被视为 AI 范畴的元素，但显然飞机的底层系统可以类比自动化的利用方式。现代飞机配备了各种需要实时运行的复杂自动化系统。在飞行过程中，从飞机在地面准备起飞开始，有无数系统必须对飞机的运动和安全各发挥作用。此外，这些系统有时受人类飞行员控制，或者在某种程度上与人类飞行员共同承担飞行操作。人机界面（HMI）是这种共享安排的关键。


    但请不要假设此处提到的见解或教训仅适用于 AI 自动驾驶汽车。我断言，这些观点对于其他实时 AI 系统同样重要，例如在工厂或仓库中工作的机器人，当然还有其他
    AI 自主载具，如无人机和潜水器。


