- fmt: "\nYou are going to have the visual data collected via the cameras, coming\
    \ from likely numerous cameras mounted at the front, back, and sides of the self-driving\
    \ car. There is the radar data collected by the multiple radar sensors mounted\
    \ on the self-driving car. There are likely ultrasonic sensors. There could be\
    \ LIDAR sensors, a special kind of sensor that combines light and radar. And there\
    \ could be other sensors too, such as acoustic sensors, olfactory sensors, etc.\n\
    \nThus, you will have to stitch together sensor data from like-sensors, such as\
    \ the data from the various cameras. Plus, you will have to stitch together the\
    \ sensor data from unlike sensors, meaning that you want to do a kind of comparison\
    \ and contrasting with the cameras, with the radar, with the LIDAR, with the ultrasonic,\
    \ and so on. \n\nEach different type or kind of sensor provides a different type\
    \ or kind of potential indication about the real-world. They do not all perceive\
    \ the world in the same way. This is both good and bad.\n\nThe good aspect is\
    \ that you can potentially achieve a rounded balance by using differing kinds\
    \ or types of sensors. Cameras and visual processing are usually not as adept\
    \ at being indicative of the speed of an object as does the radar or the LIDAR.\
    \ \n\nBy exploiting the strengths of each kind of sensor, you are able to have\
    \ a more enriched texturing of what the real-world consists of.\n\nIf the sensor\
    \ fusion subsystem is poorly devised, it can undermine this complimentary triangulation\
    \ that having differing kinds of sensors inherently provides. It’s a shame. Weak\
    \ or slimly designed sensor fusion often tosses away important information that\
    \ could be used to better gauge the surroundings. With a properly concocted complimentary\
    \ perspective, the AI action planner portion has a greater shot at making better\
    \ driving decisions because it is more informed about the real-world around the\
    \ self-driving car.\n\nLet’s though all acknowledge that the more processing you\
    \ do of the multitude of sensors, the more computer processing you need, which\
    \ then means that you have to place more computer processors and memory on-board\
    \ the self-driving car. This adds cost, it adds weight to the car, it consumes\
    \ electrical power, it generates heat, and has other downsides. Furthermore, trying\
    \ to bring together all of the data and interpretations is going to take processing\
    \ time, of which, as emphasized herein many times, the time constraints for the\
    \ AI are quite severe when driving a car.\n\n## Four Key Ways Approaches to MSDF\
    \ Assimilation\n\nLet’s consider the fundamental ways that you assimilate together\
    \ the sensory data from multiple sensors.\n\nTake a look at Figure 2.\n\n![](images/00009.jpeg)\n\
    \nI’ll briefly describe the four approaches, consisting of harmonize, reconcile,\
    \ integrate, and synthesize.\n\n### 1. Harmonize\n\nAssume that you have two different\
    \ kinds of sensors, I’ll call them `sensor X` and `sensor Z`. They each are able\
    \ to sense the world outside of the self-driving car. We won’t concern ourselves\
    \ for the moment with their respective strengths and weaknesses, which I’ll be\
    \ covering later on herein.\n\nThere is an object in the real-world and the `sensor\
    \ X` and the `sensor Z` are both able to detect the object. This could be a pedestrian\
    \ in the street, or maybe a dog, or could be a car. In any case, I’m going to\
    \ simplify the matter to considering the overall notion of detecting an object.\n\
    \nThis dual detection means that both of the different kinds of sensors have something\
    \ to report about the object. We have a dual detection of the object. Now, we\
    \ want to figure out how much more we can discern about the object because we\
    \ have two perspectives about it.\n\nThis involves harmonizing the two reported\
    \ detections. Let’s pretend that both sensors detect the distance of the object.\
    \ And, `sensor X` indicates the object is six feet tall and about two feet wide.\
    \ Meanwhile, `sensor Z` is reporting that the object is moving toward the self-driving\
    \ car, doing so at a speed of a certain number of feet per second `N`. We can\
    \ combine together the two sensor reports and update the virtual world model that\
    \ there is an object of six feet in height, two feet in width, moving toward the\
    \ self-driving car at some speed `N`. \n\nSuppose we only relied upon `sensor\
    \ X`. Maybe because we only have `sensor X` and there is no `sensor Z` on this\
    \ self-driving car. Or, `sensor Z` is broken. Or, `sensor Z` is temporarily out\
    \ of commission because there is a bunch of mud sitting on top of the sensor.\
    \ \n\nIn this case, we would know only the height and weight and general position\
    \ of the object, but not have a reading about its speed and direction of travel.\
    \ That would mean that the AI action planner is not going to have as much a perspective\
    \ on the object as might be desired.\n\nAs a quick aside, this also ties into\
    \ ongoing debates about which sensors to have on AI self-driving cars. For example,\
    \ one of the most acrimonious debates involves the choice by Tesla and Elon Musk\
    \ to not put LIDAR onto the Tesla cars. Elon has stated that he doesn’t believe\
    \ LIDAR is needed to achieve a true AI Level 5 self-driving car via his `Autopilot`\
    \ system, though he also acknowledges that he might ultimately be proven mistaken\
    \ by this assumption. \n\nSome would claim that the sensory input available via\
    \ LIDAR cannot be otherwise fully devised via the other kinds of sensors, and\
    \ so in that sense the Tesla’s are not going to have the same kind of complimentary\
    \ or triangulation available that self-driving cars with LIDAR have. Those that\
    \ are not enamored of LIDAR would claim that the LIDAR sensory data is not worth\
    \ the added cost, nor worth the added processing effort, nor worth the added cognition\
    \ time required for processing.\n\nI’ve pointed out that this is not merely a\
    \ technical or technological question. It is my bet that once AI self-driving\
    \ cars get into foul car accidents, we’ll see lawsuits that will attempt to go\
    \ after the auto makers and tech firms for the sensory choices made in the designs\
    \ of self-driving cars.\n\nIf an auto maker or tech firm opted to not use LIDAR,\
    \ a lawsuit might contend that the omission of LIDAR was a significant drawback\
    \ to the capabilities of the AI self-driving car, and that the auto maker or tech\
    \ firm knew or should have known that they were under-powering their self-driving\
    \ car, making it less safe. This is going to be a somewhat “easier” claim to launch,\
    \ especially due to the aspect that most AI self-driving cars are equipped with\
    \ LIDAR.\n\nIf an auto maker or tech firm opts to use LIDAR, a lawsuit might contend\
    \ that the added effort by the AI system to process the LIDAR was a contributor\
    \ to the car wreck, and that the auto maker or tech firm knew or should have known\
    \ that the added processing and processing time could lead to the AI self-driving\
    \ car being less safe. This claim will be more difficult to lodge and support,\
    \ especially since it goes against the tide of most AI self-driving cars being\
    \ equipped with LIDAR.\n\n### 2. Reconcile\n\nI’d like to revisit the use of `sensor\
    \ X` and `sensor Z` in terms of object detection. \n\nLet’s pretend that `sensor\
    \ X` detects an object, and yet `sensor Z` does not, even though the `sensor Z`\
    \ could have. In other words, the object is within the Field of View (`FOV`) of\
    \ `sensor Z`, and yet `sensor Z` isn’t detecting the object. Note that this is\
    \ vastly different than if the object were entirely outside the `FOV` of `sensor\
    \ Z`, in which case we would not have any expectation that `sensor Z` could detect\
    \ the object.\n\nWe have a bit of a conundrum on our hands that needs reconciling.\n"
