- fmt: "\nI’ve listed some of the publicly available documents that are a useful cornerstone\
    \ to getting up-to-speed about AI self-driving car safety.\n\nThe U.S. Department\
    \ of Transportation (`DOT`) NHTSA has provided two reports that I especially find\
    \ helpful about the foundations of safety related to AI self-driving cars. Besides\
    \ providing background context, these documents also indicate the regulatory considerations\
    \ that any auto maker or tech firm will need to be incorporating into their efforts.\
    \ Both of these reports have been promulgated under the auspices of `DOT` Secretary\
    \ Elaine Chao.\n\nThe version 2.0 report is here:\nhttps://www.nhtsa.gov/sites/nhtsa.dot.gov/files/documents/13069a-ads2.0_090617_v9a_tag.pdf\n\
    \nThe version 3.0 report is here:\nhttps://www.transportation.gov/sites/dot.gov/files/docs/policy-initiatives/automated-vehicles/320711/preparing-future-transportation-automated-vehicle-30.pdf\n\
    \nI had earlier mentioned the Uber safety report, which is here: https://www.uber.com/info/atg/safety/\n\
    \nI also had mentioned the Zoox safety report, which is here: https://zoox.com/safety/\n\
    \nYou would also likely find of us the Waymo safety report, which is here: https://waymo.com/safety/\n\
    \nI’d also like to give a shout out to Dr. Philip Koopman, a professor at `CMU`\
    \ that has done extensive AI safety related research, which you can find at his\
    \ `CMU` web site or at this company web site: https://edge-case-research.com/\n\
    \nAs a former university professor, I too used to do research while at my university\
    \ and also did so via an outside company. It’s a great way to try and infuse the\
    \ core foundational research that you typically do in a university setting with\
    \ the more applied kind of efforts that you do while in industry.\n\nI found it\
    \ a handy combination. Philip and I seem to also end-up at many of the same AI\
    \ self-driving car conferences and do so as speaker, panelists, or interested\
    \ participants.\n\n## Conclusion\n\nFor those Chief Safety Officers of AI self-driving\
    \ car firms that I’ve not mentioned herein, you are welcome to let me know that\
    \ you’d like to be included in future updates that I do on this topic. Plus, if\
    \ you have safety reports akin to the ones I’ve listed, I welcome taking a look\
    \ at those reports and will be glad to mention those too.\n\nOne concern being\
    \ expressed about the AI self-driving car industry is whether the matter of safety\
    \ is being undertaken in a secretive manner that tends to keep each other of the\
    \ auto makers or tech firms in the dark about what the other firms are doing.\
    \ When you look at the car industry, clearly it is apparent that the auto makers\
    \ have traditionally competed on their safety records and used that to their advantage\
    \ in trying to advertise and sell their wares.\n\nCritics have voiced that if\
    \ the AI self-driving car industry perceives itself to also be competing with\
    \ each other on safety, naturally there would be a basis to purposely avoid sharing\
    \ about safety aspects with each other. \n\nYou can’t seemingly have it both ways,\
    \ in that if you are competing on safety then it is presumed to be a zero-sum\
    \ game, those that do better on safety will sell more than those that do not,\
    \ and why help a competitor to get ahead.\n\nThis mindset needs to be overcome.\
    \ As mentioned earlier, it won’t take much in terms of a few safety related bad\
    \ outcomes to potentially stifle the entire AI self-driving car realm. If there\
    \ is a public outcry, you can expect that this will push back at the auto makers\
    \ and tech firms. \n\nThe odds are that regulators would opt to come into the\
    \ industry with a much heavier hand. Funding for AI self-driving car efforts might\
    \ dry up. The engine driving the AI self-driving car pursuits could grind to a\
    \ halt.\n\nThere are efforts popping up to try and see if AI safety can become\
    \ more widespread as an overt topic in the AI self-driving car industry. \n\n\
    It’s tough though to overcome all of those `NDA` (`Non-Disclosure Agreements`)\
    \ and concerns that proprietary matters might be disclosed. Regrettably, it might\
    \ take a calamity to get enough heat to make things percolate more so, but I hope\
    \ it doesn’t come down to that.\n\nThe adoption of Chief Safety Officers into\
    \ the myriad of auto makers and tech firms that are pursuing AI self-driving cars\
    \ is a healthy sign that safety is rising in importance. \n\nThese positions have\
    \ to be adopted seriously and with a realization at the firms that they cannot\
    \ just put in place a role to somehow checkmark that they did so.\n\nFor Chief\
    \ Safety Officers to do their job, they need to be at the top executive table\
    \ and be considered part-and-parcel of the leadership team. I am also hoping that\
    \ these Chief Safety Officers will bind together and become an across-the-industry\
    \ “club” that can embrace a safety sharing mantra and use their positions and\
    \ weight to get us further along on permeating safety throughout all aspects of\
    \ AI self-driving cars. Let’s make that into reality.\n\n## CHAPTER 3: BOUNDED\
    \ VOLUMES AND AI SELF-DRIVING CARS \n\nThe car ahead of me on the freeway had\
    \ several lengthy poles tied to the top of their midsized vehicle and the flopping\
    \ poles were dangling far beyond the rear end of the zooming along car. In California,\
    \ the legal requirement is that any overhanging or projecting items that are beyond\
    \ four feet of the taillamps must be decorated with a red cloth or a fluorescent\
    \ orange flag. And, if the matter is happening at night time, two lights must\
    \ also be attached to the projection (per California Vehicle Code `CVC` Section\
    \ `35410`).\n\nNone of those legal requirements were met by the driver. For the\
    \ moment, it was daytime. In about an hour it would be dusk and then quickly.\
    \ Tsk, tsk, flouting the law.\n\nIn any case, the immediate concern was whether\
    \ other drivers would realize that the poles were protruding. Given the time of\
    \ day and the dwindling sunshine and given that many in Southern California drive\
    \ maddly and don’t pay attention to the road, I had little doubt that some nutty\
    \ driver might get so close to the car that the poles would potentially ram a\
    \ windshield.\n\nBased on the nature of the poles and how they were tied down\
    \ to the car, I gauged that the poles would be unlikely to poke a hole in the\
    \ windshield and probably not create much damage, other than a few scratches and\
    \ dents, but the real problem would be the reaction of the driver that rammed\
    \ into the poles.\n\nWould the driver that hit the poles suddenly be shocked and\
    \ surprised, and in that mental capacity opt to make a wild maneuver? Doing so\
    \ at the pace of 65 miles per hour was bound to create havoc. All it takes is\
    \ for one driver to do something untoward and causes a cascading impact to other\
    \ drivers. Another consideration was whether those poles might be jostled by hitting\
    \ a windshield and then spill onto the freeway, which could also create a cascading\
    \ array of cars weaving and dodging those poles. More chances of cars hitting\
    \ each other.\n\nDid the driver of the car that had placed the poles onto their\
    \ roof realize the problems inherent in their actions? Were they lazy in not putting\
    \ on a red or orange flag, or did they assume it wasn’t needed, or maybe they\
    \ thought it was too much trouble and assumed it was “obvious” that the poles\
    \ were overhanging the car? Or, perhaps the driver figured that no other car would\
    \ venture so close to their car that the protrusion would make a difference. If\
    \ we always all kept the requisite distance from other cars based on the speed\
    \ charts, such as one car length for every ten miles per hour (no one in Los Angeles\
    \ seems to abide by this!), presumably you would not encounter those precariously\
    \ dangling poles.\n\nI kept my distance from the car.\n"
