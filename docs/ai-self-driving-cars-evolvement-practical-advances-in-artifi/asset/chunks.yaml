    \nCHAPTER 1 \n\nELIOT FRAMEWORK FOR\n\nAI SELF-DRIVING CARS\n\nCHAPTER 1 \n\n\
    ELIOT FRAMEWORK FOR\n\nAI SELF-DRIVING CARS\n\nThis chapter is a core foundational\
    \ aspect for understanding AI self-driving cars and I have used this same chapter\
    \ in several of my other books to introduce the reader to essential elements of\
    \ this field. Once you’ve read this chapter, you’ll be prepared to read the rest\
    \ of the material since the foundational essence of the components of autonomous\
    \ AI driverless self-driving cars will have been established for you.\n\n\\_\\\
    _\\_\\_\\_\\_\\_\\_\\_\\_\\_\\_\n\nWhen I give presentations about self-driving\
    \ cars and teach classes on the topic, I have found it helpful to provide a framework\
    \ around which the various key elements of self-driving cars can be understood\
    \ and organized (see diagram at the end of this chapter). The framework needs\
    \ to be simple enough to convey the overarching elements, but at the same time\
    \ not so simple that it belies the true complexity of self-driving cars. As such,\
    \ I am going to describe the framework here and try to offer in a thousand words\
    \ (or more!) what the framework diagram itself intends to portray.\n\nThe core\
    \ elements on the diagram are numbered for ease of reference. The numbering does\
    \ not suggest any kind of prioritization of the elements. Each element is crucial.\
    \ Each element has a purpose, and otherwise would not be included in the framework.\
    \ For some self-driving cars, a particular element might be more important or\
    \ somehow distinguished in comparison to other self-driving cars. \n\nYou could\
    \ even use the framework to rate a particular self-driving car, doing so by gauging\
    \ how well it performs in each of the elements of the framework. I will describe\
    \ each of the elements, one at a time. After doing so, I’ll discuss aspects that\
    \ illustrate how the elements interact and perform during the overall effort of\
    \ a self-driving car.\n\nAt the Cybernetic Self-Driving Car Institute, we use\
    \ the framework to keep track of what we are working on, and how we are developing\
    \ software that fills in what is needed to achieve Level 5 self-driving cars.\n\
    \nD-01: Sensor Capture\n\nLet’s start with the one element that often gets the\
    \ most attention in the press about self-driving cars, namely, the sensory devices\
    \ for a self-driving car.\n\nOn the framework, the box labeled as D-01 indicates\
    \ “Sensor Capture” and refers to the processes of the self-driving car that involve\
    \ collecting data from the myriad of sensors that are used for a self-driving\
    \ car. The types of devices typically involved are listed, such as the use of\
    \ mono cameras, stereo cameras, LIDAR devices, radar systems, ultrasonic devices,\
    \ GPS, IMU, and so on.\n\nThese devices are tasked with obtaining data about the\
    \ status of the self-driving car and the world around it. Some of the devices\
    \ are continually providing updates, while others of the devices await an indication\
    \ by the self-driving car that the device is supposed to collect data. The data\
    \ might be first transformed in some fashion by the device itself, or it might\
    \ instead be fed directly into the sensor capture as raw data. At that point,\
    \ it might be up to the sensor capture processes to do transformations on the\
    \ data.  This all varies depending upon the nature of the devices being used and\
    \ how the devices were designed and developed.\n\nD-02: Sensor Fusion\n\nImagine\
    \ that your eyeballs receive visual images, your nose receives odors, your ears\
    \ receive sounds, and in essence each of your distinct sensory devices is getting\
    \ some form of input. The input befits the nature of the device. Likewise, for\
    \ a self-driving car, the cameras provide visual images, the radar returns radar\
    \ reflections, and so on. Each device provides the data as befits what the device\
    \ does."
