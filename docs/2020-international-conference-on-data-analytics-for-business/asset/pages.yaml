    # C. Support Vector Regression (SVR)


    SVR is a linear technique that generalizes a set of data points into a continuous
    multivariable function. The support vector machine works with more data points
    as the input [7]; however sparse matrices are treated with a sigma tube to match
    the data points. The algorithm training and testing data are independently and
    distributed from the data and this assumption, the multivariable function formulates
    a loss to be minimized. When this function is minimized, this is stated to be
    the best approximation for the data.


    ```

    f(x) = wT \sum_{i=1}^{n} w_i x_i + b

