  md: '# V. CONCLUSION


    Machine Learning (ML) algorithms provide powerful means to explore current trends
    and patterns in data. Datasets too large for human computation can be collected
    and analyzed in a timeframe otherwise unthinkable. With this powerful tool, the
    physics and material properties of perovskites can be assessed. This innovative
    area of nanotechnology could increase our interest in many areas of science. The
    perovskites yet explored with machine learning offers further development. With
    further research techniques in fabrication and production of this technology can
    be created for the proliferation of renewable and environmentally conscious energy
    production.


