    **Abstract—** Perovskite technology has much attention in recent years for potential
    to replace renewable energy in fossil fuels. Traditional solar cells have shown
    remarkable increase from 38% to 242% in a span of years. Perovskite solar cells
    have attracted much attention in research because of the low cost in manufacturing
    and production. Current silicon photovoltaic devices are more expensive than fossil
    fuel. The use of Machine Learning (ML) to research and predict the opto-electronic
    properties of perovskite cells through techniques like Vector Regression (SVR),
    and Artificial Neural Networks (ANN) can greatly improve the chemical process
    and manufacturing techniques. These tools used to improve the impact of solar
    energy on a national scale. In this paper, we explore the current research of
    the development of perovskite solar cells using ML techniques. Furthermore, we
    consider the limitations and potential areas of research.


    **Keywords—**machine learning, perovskite solar cells, artificial neural networks,
    support regression, organic electronics


    # I. INTRODUCTION


    The widespread use of solar energy has been aided due to challenges with silicon
    photovoltaic technology. Traditional solar cells are more expensive than fossil
    fuels. This is due to cost of materials required to fabricate and install these.
    With efforts of creating a cheap affordable alternative of energy are necessary.
    Perovskite solar cell technology has the potential to expand the widespread use
    of solar energy. Perovskite solar cells can be fabricated using relatively low
    materials reducing the overall cost to comparable to other energy sources. They
    can be fabricated using a number of processes. Using a solution deposition method,
    perovskites can be created using spin coating, slot coating, to roll manufacturing,
    and spray coated easily [1]. The main factor in perovskite solar cells which is
    a candidate for energy production is the ease with which the properties can be
    changed. Identify applicable factors such as band gap, lattice constant,


    # A. Background


    ML applies the concept of Artificial Intelligence (AI) to data processing. ML
    is an algorithm or set of algorithms that allow the computer to automatically
    learn and predict. This self-improving approach requires no tedious reprogramming
    in order to become more accurate and precise. Machine learns by observing data
    and patterns in the data. With patterns, trends can be analyzed for forecasting.
    There are many methods of learning such as Support Vector Regression, Artificial
    Network, and Random Forest. These mechanisms of learning are currently being used
    in the development of perovskite solar cells for high efficiency, material science
    analysis, and modeling of the quantum mechanics in the perovskite crystals.


    # B. Use in Perovskite Research


    ML in solar cell research has many useful applications. ML is currently being
    used to predict the electrical and optical properties of metal halide perovskite


