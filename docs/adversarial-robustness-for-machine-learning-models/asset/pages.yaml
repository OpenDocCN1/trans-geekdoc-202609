    # 7.2 Formulations of robustness verification


    In this section we briefly show how to formulate robustness verification problems
    mathematically and discuss the challengings of solving it.


    We first consider a binary classification neural network, where the output layer
    only has one neuron \(f(\boldsymbol{x})\) and the label prediction is \(\text{sign}(f(\boldsymbol{x}))\).
    In this case, if we denote the perturbation set as \(S_\epsilon(\boldsymbol{x}_0)
    := \{\boldsymbol{x} \mid \|\boldsymbol{x} - \boldsymbol{x}_0\|_p \le \epsilon\}\)
    and assume the original example \(\boldsymbol{x}_0\) is predicted as +1, then
    problem (7.2) is equivalent to solving


    ```

    min f(x) s.t. x \in S_\epsilon(x_0). (7.3)

    ```


    When the solution of (7.3) is negative, there exists a perturbation that can change
    the prediction from positive to negative, so the model is not robust on \(\boldsymbol{x}_0\);
    otherwise if the solution of (7.3) is positive, then the model is provably robust
    on \(\boldsymbol{x}_0\). A sound but incomplete verification will produce a lower
    bound of (7.3); when the lower bound is positive, the model is provably robust
    on \(\boldsymbol{x}_0\); otherwise if the lower bound is negative, the robustness
    is not certified.


    Therefore, we can see that robustness verification is equivalent to solving an
    optimization problem. To gain more intuition why this optimization problem is
    difficult when \(f(\boldsymbol{x})\) is a neural network, let''s further expand
    the function \(f(\boldsymbol{x})\). For simplicity, let us assume that \(f(\boldsymbol{x})\)
    is an \(L\)-layer feedforward network:


    ```

    f(x) := z^(L) = W^(L)x^(L) + b^(L), x^(l) = sigma^(l)(W^(l)x^(l) + b^(l)), l \in
    [L]. (7.4)

    ```


    where x^(0) = x is the input, W^(l) and b^(l) are the weight matrix and bias vector
    of the lth layer, sigma^(l) is a (nonlinear) activation function, and z^(L) in
    the binary classification case will be a single output neuron corresponding to
    the value of f(x). With these definitions, the optimization problem (7.3) can
    be further expanded as


    ```

    min z^(L) s.t. z^(l) = W^(l)x^(l) + b^(l), (7.5) x^(l+1) = sigma^(l)(z^(l)), (7.6)
    l \in [L]. (7.7)

    ```'
