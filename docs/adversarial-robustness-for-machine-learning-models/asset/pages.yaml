  md: '# Verification against semantic perturbations


    Whereas current verification methods mainly focus on the $\ell_p$-norm threat
    model of the input instances, robustness verification against $\ell_p$-semantic
    adversarial attacks inducing large $\ell_p$-norm perturbations, such as color
    shifting and lighting adjustment, are beyond their capacity. To bridge this gap,
    in this chapter, we introduce the Semantify-NN framework proposed by Mohapatra
    et al. (2020), a model-agnostic and generic robustness verification approach against
    semantic perturbations for neural networks. By simply inserting the proposed semantic
    perturbation layers (SP-layers) to the input layer of any given model, Semantify-NN
    is model-agnostic, and any $\ell_p$-norm based verification tools can be used
    to verify the model robustness against semantic perturbations. We will illustrate
    the principles of designing the SP-layers and provide examples including semantic
    perturbations to image classification in the space of hue, saturation, lightness,
    brightness, contrast, and rotation. In addition, we discuss an efficient refinement
    technique to further improve the semantic certificate.


    # 10.1 Semantic adversarial example


    Beyond the $\ell_p$-norm bounded threat model, some works have shown the possibility
    of generating semantic adversarial examples based on semantic perturbation techniques
    such as color shifting, lighting adjustment, and rotation (Hosseini and Poovendran,
    2018; Liu et al., 2019b; Bhattad et al., 2019; Joshi et al., 2019; Fawzi and Frossard,
    2015; Engstrom et al., 2017). We refer the readers to Fig. 10.1 for the illustration
    of some semantic perturbations for images. Notably, although semantically similar,
    these semantic adversarial attacks essentially consider threat models different
    from $\ell_p$-norm bounded attacks in the RGB (red, green, and blue) space. Therefore
    semantic adversarial examples usually incur large $\ell_p$-norm perturbations
    to the original data sample and thus exceed the verification capacity of $\ell_p$-norm-based
    verification methods.


    In general, semantic adversarial attacks craft adversarial examples by tuning
    a set of parameters governing semantic manipulations of data sam-'
