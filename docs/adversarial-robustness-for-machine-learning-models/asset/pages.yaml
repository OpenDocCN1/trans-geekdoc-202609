  md: '# **Algorithm 2** Hard-label black-box attack (OPT attack) in (Cheng et al.,
    2019a).


    ```

    1: **Input:** Hard-label model $f_\theta$, original sample $x_0$, initial $s_0$,
    total iteration $T$, step size $\{\eta_t\}$

    2: **for** $t=0, 1, 2, \dots, T$ **do**

    3:   Evaluate $h(s_t)$ and $h(s_t + \beta u)$ using Algorithm 1

    4:   Compute the estimated gradient $\bar{g}$ using (3.3) and (3.4).

    5:   Update $s_{t+1} = s_t - \eta_t \bar{g}$

    6: **end for**

    7: **return** $x_0 + g(s_T) \frac{s_T}{\|s_T\|}$

    ```


    With the local computation of $h(s)$, we can apply zeroth-order gradient descent
    to solve the optimization problem (3.9) in the hard-label setting. The procedure
    is summarized in Algorithm 2. If $g(s)$ is Lipschitz-smooth, then the number of
    iterations needed achieve stationary points using Algorithm 2 is given by Cheng
    et al. (2019a).


    In the follow-up work, Cheng et al. (2020c) further improve the query efficiency
    of Algorithm 2 by estimating the sign value of $h(s + \alpha u) - h(s)$ instead
    of its exact value. The main idea is that estimating the sign will only require
    1 single query (see below), which already gives sufficient information for gradient-based
    optimizers to progress. In the untargeted attack case the sign can be computed
    by


    ```

    \(\text{sign}(h(s + \alpha u) - h(s)) = \begin{cases} +1, & f_\theta(x_0 + g(s)
    \frac{(s + \alpha u)}{\|s + \alpha u\|}) = t_0, \\ -1 & \text{otherwise.} \end{cases}\)

    ```


    Essentially, for a new direction $s + \alpha u$, we test whether a point at the
    original distance $h(s)$ from $x_0$ in this direction lies inside or outside the
    decision boundary, i.e., if the produced perturbation will result in a wrong prediction
    by the classifier. If the produced perturbation is outside the boundary, i.e.,
    $f_\theta(x_0 + h(s) \frac{(s + \alpha u)}{\|s + \alpha u\|}) \neq t_0$, then
    the new direction has a smaller distance to its decision boundary and thus gives
    a smaller value of $h$. It indicates that $u$ is a descent direction to minimize
    $h$.


    The resulting attack, which is called Sign-OPT attack, follows the same procedure
    as in Algorithm 2 by replacing the gradient estimation in step 4 with the following
    sign estimator:


    ```

    \(\bar{g} = \sum_{j=1}^q \text{sign}(h(s + \alpha u^{(j)}) - h(s)) \cdot u^{(j)},\)

    ```'
