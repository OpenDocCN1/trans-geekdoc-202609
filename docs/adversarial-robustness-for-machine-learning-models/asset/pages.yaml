    To overcome these limitations, Luss et al. (2021) define “addition” in a novel
    way, which leads to realistic images with the additions also being interpretable
    and is called contrastive explanations method using monotonic attribute functions
    (CEM-MAF).


    Given \(k\) (available or learned) interpretable features (latent or otherwise),
    which represent meaningful concepts (viz. moustache, glasses, smile), let \(g_i,
    i \in \{1, \dots, k\}\), be the corresponding functions acting on these features
    with higher values indicating the presence of a certain visual concept, whereas
    lower values indicating its absence. For example, CelebA (Liu et al., 2015) has
    different high-level (interpretable) features for each image such as whether the
    person has black hair or high cheekbones. In this case, we can build binary classifiers
    for each of the features where 1 indicates the presence of black hair or high
    cheekbones, whereas 0 indicates its absence. These classifiers would be the functions
    \(g_i\). On the other hand, for datasets with no high-level features, we can find
    latent features by learning disentangled representations and choose those latent
    features that are interpretable. Here the functions \(g_i\) would be the identity
    (or negative identity) map depending on which direction adds a certain concept
    (viz. light to dark colored lesion).


