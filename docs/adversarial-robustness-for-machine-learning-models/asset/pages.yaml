    if he can remove the vendor''s signature or obstruct watermark verification without
    sacrificing too much on the performance of the model. Note that a counter-watermark
    attempt that drastically degrades the model''s performance is not considered successful.


    Methodology of GradSigns. Intuitively, GradSigns finds a solution, i.e., a set
    of model parameters, corresponding to a decision boundary that not only results
    in comparable performance on the original task but also fulfills an additional
    goal carrying the owner''s watermark information. GradSigns works by embedding
    watermark information into the expected gradient of the cross-entropy cost function
    with respect to the model''s input. For any input sample x, the gradient of the
    cost function with respect to the input is a vector tangent to the model''s cost
    function surface and perpendicular to the decision boundary at point x. Therefore,
    by imposing a statistical bias on these gradients, GradSigns is essentially reshaping
    the decision boundary to incorporate the desired watermark information. For simplicity,
    we refer to the gradient of the cross-entropy cost function with respect to the
    input of the model as the gradient of input or input gradient. Fig. 20.1 illustrates
    the workflow of GradSigns.


    Watermark embedding. Forcing a random statistical bias on the gradient of inputs
    to the model can drastically degrade its performance on the classification task.
    To ensure a successful marking without sacrificing the model''s performance, the
    watermark needs to be embedded while optimizing the model for the original task.
    For that reason, Aramoon et al. (2021) embed the watermark into the host model
    by including a regularizer term in the'
