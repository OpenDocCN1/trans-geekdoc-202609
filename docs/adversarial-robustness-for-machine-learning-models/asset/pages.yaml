  md: '![](img/fa92deee3de0f00ea56e92ca0b92c8e4_44_0.png)


    # Figure 3.1 Taxonomy and illustration of evasion attacks.


    model details. In the _soft-label black-box attack_ setting, an attacker can observe
    (parts of) class predictions and their associated confidence scores. In the _hard-label
    black-box attack_ (decision-based) setting, an attacker can only observe the top-1
    label prediction, which is the least information required to be returned to remain
    utility of the model. In addition to attack success rate, the query efficiency
    is also an important metric for performance evaluation of black-box attacks.


    _Transfer attack_ is a branch of black-box attack that uses adversarial examples
    generated from a white-box surrogate model to attack the target black-box model.
    The surrogate model can be either pretrained (Liu et al., 2017b) or distilled
    from a set of data samples with soft labels given by the target model as their
    training labels (Papernot et al., 2016, 2017).


    Between the spectrum of white-box and black-box attacks, variations in the threat
    models and the attacker’s capability will result in different _gray-box_ attacks.


    # ## 3.2 Soft-label black-box attack


    Black-box attack algorithms often adopt either the penalty-based (e.g., Eq. (2.9))
    or budget-based (e.g., Eq. (2.1)) formulation. Since the input gradient of the
    attacker’s loss is unavailable to obtain in the black-box setting, one principal
    approach is performing gradient estimation using model queries and then using
    the estimated gradient to replace the true gradient in white-box attack algorithms,
    leading to the zeroth-order optimization (ZOO) based black-box attacks (Chen et
    al., 2017a).'
