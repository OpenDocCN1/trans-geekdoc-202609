    # Robustness of KNN vs neural network on simple problems


    Using the above-mentioned algorithms implemented by Wang et al. (2019c), we are
    able to 1) efficiently compute the exact robustness of 1-NN models for a reasonable
    number of examples (e.g., for MNIST dataset, Wang et al. (2019c) showed that we
    can conduct evaluation in few seconds) and 2) for K-NN models, compute the certified
    robustness (verification) efficiently using Lemma 3.


    With these algorithms, we can then compare the robustness between K-NN models
    and neural networks. We compare certified robust errors, defined as the fractions
    with lower bounds less than the given threshold (if an instance is wrongly classified,
    then the lower bound is 0), of 1-NN, a simple convolutional network (ConvNet),
    and a strong ℓ2 certified defense network (RandSmooth) (Cohen et al., 2019) in
    Fig. 16.2 (see Chapter 13 for more details on randomized smoothing). The results
    show that 1-NN can achieve better certified robust errors than neural networks
    on these two datasets. This is partially because the proposed verification algorithm
    provides very tight certified regions for NN classifiers. Note that this is not
    saying that K-NN is more robust than neural networks on more complex datasets
    such as CIFAR and ImageNet. However, this is showing K-NN could obtain better
    certified robust errors on some simpler tasks.'
