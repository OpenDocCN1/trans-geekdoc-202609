- pgno: 151
  md: '# Certified robustness training


    In the end of the last chapter, we have shown a way to compute the “certified
    radius” when conducting randomized smoothing, where it is guaranteed (with high
    probability) that any perturbation within such radius will not change the prediction.
    In this chapter, we introduce another way to establish the certified robustness
    guarantees for neural networks without using randomized techniques, and the resulting
    robustness guarantees are deterministic (with 100% probability).


    The main idea of this technique, also known as certified robust training, is based
    on incomplete neural network verification methods introduced in Part 3. Note that
    for any given neural network, we can apply any verification techniques introduced
    in Part 3 to obtain a certified robust radius for each point. Therefore, even
    without conducting any form of specialized training, we can obtain a certified
    robust loss or error for any neural network based on the verification methods.
    However, as complete verification methods are time-consuming to run on larger
    models (with exponential time complexity), and incomplete verification methods
    usually give us very loose bounds, applying verification on a standard neural
    network model can give very low certified robustness. To resolve this issue, we
    will show that it is possible to define a loss function based on the certified
    robustness obtained by incomplete verification. When training a model to minimize
    this loss function, it will achieve reasonably well certified robustness, at least
    for some standard classification tasks.


    # 14.1 A framework for certified robust training


    For training a robust model, we care about the robust error defined as


    ```

    E_{(x, y)} \max_{x'' \in B(x)} I(f(x''), y), \quad (14.1)

    ```


    where I(f(x''), y) returns 1 if the (top-1) prediction f(x'') does not match the
    groundtruth label y, and we consider the worst-case perturbation within a perturbation
    set, so any instance (x, y) is considered correct only if it is predicted correctly
    and any perturbation within the perturbation set cannot'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'change its prediction. However, it is impossible to compute the exact robust
    error for general neural network, so there are two ways to evaluate this value.
    The first way is to conduct an adversarial attack to find adversarial example
    $x''$, which is equivalent to finding a nonoptimal solution for the inner maximization
    problem, and the resulting value (error under attack) will be a lower bound of
    the real robust error. However, this lower bound can be far from the exact robust
    error, which sometimes gives a false sense of security. On the other hand, in
    this chapter, we care about "certified robust error", where we use some verification
    method to obtain upper and lower bounds of the prediction value of $f(x'')$ for
    $x'' \in B(x)$. Using this value, we can establish an *upper bound* of robust
    error, where we consider a sample to be robustly correct only if it is predicted
    correctly and it can be verified that within $B(x)$ that the (top-1) prediction
    never changes. For many security-sensitive applications, when we want to prove
    that the prediction is definitively correct within a certain region, this is much
    more important than errors under attacks. Further, as we discussed previously,
    some models are robust against certain attacks but vulnerable to others, so error
    under attack may not be a reliable measurement to robustness and can deliver biased
    evaluation of security. Therefore, for certified defense, we will focus on improving
    the certified robust error instead of error under attacks.


    As it is impossible to directly minimize the 0/1 error in (14.1), a commonly used
    technique is defining a loss function as a surrogate for robust error and learning
    a model to minimize an upper bound of this robust loss. For example, we can define
    the robust cross-entropy loss as


    ```

    \(E_{(x,y)} \max_{x'' \in B(x)} \ell_{CE}(f(x''), y). \quad (14.2)\)

    ```


    Computing the upper bound of the CE loss is based on any neural network verification
    technique. Note that neural network verification typically bounds \(c^T f(x)\)
    for any \(x \in B(x)\), where \(c\) is a specification vector. To ensure that
    the logit of target label \(i\) is larger than another label \(j\), we can set
    \(c_i = 1, c_j = -1\), and all other elements of \(c\) to be zeros. To consider
    all the labels, we then define a set of \(L\) specifications:


    ```

    \(C_{i,j} = \begin{cases} 1 & \text{if } j=y, i \neq y \text{ (output of ground
    truth class)} \\ -1 & \text{if } i=j, i \neq y \text{ (output of other classes,
    negated)} \\ 0 & \text{otherwise (note that the } y\text{th row contains all 0).}
    \end{cases} \quad (14.3)\)

    ```


    Each element in vector \(m := Cf(x)\) gives us margins between class \(y\) and
    all other classes. We define the lower bound of \(Cf(x)\) for all \(x \in B(x)\)
    as \(\underline{m}(x, \epsilon)\),'
