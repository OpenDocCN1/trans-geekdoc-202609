    this graph can be divided into input nodes, output nodes, intermediate nodes and
    constant nodes, and the graph is supposed to be a Directed Acyclic Graph (DAG).
    Linear bound propagation algorithms mentioned in this section can then be easily
    generalized to the computational graph – each relaxation is done on an edge (operation)
