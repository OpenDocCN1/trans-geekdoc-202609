    find


    \(\min_f p_A(x + \delta) - p_B(x + \delta) \quad \text{s.t.} \quad p_A(x) = p_A,
    \quad p_B(x) = p_B. \quad (13.9)\)


    Interestingly, if the noise is Gaussian, then there is a very simple way to obtain
    the worst-case \(f\) for (13.9). Intuitively, when we paint a certain point \(z\)
    with red color (corresponding to class B), its contribution to the overall \(p_B\)
    will be enlarged by the ratio \(P(N(x + \delta, \sigma^2) = z)/P(N(x, \sigma^2)
    = z)\) when \(x\) is perturbed to \(x + \delta\). Therefore the worst-case placements
    of the colors will be assign red points according to the decreasing order of \(P(N(x
    + \delta, \sigma^2) = z)/P(N(x, \sigma^2) = z)\) until utilized all the mass of
    red. This is true for any distribution, but for general distribution, it may be
    hard to calculate an explicit form of this. However, things become simple when
    we add Gaussian random noise. From Fig. 13.3, \(p_B(x)\) is the Gaussian centered
    at \(x\), and \(p_B(x + \delta)\) is another Gaussian centered at \(x + \delta\),
    and if we compute the ratio, then we will see that


    \(\frac{P(N(x + \delta, \sigma^2) = z)}{P(N(x, \sigma^2) = z)} = \frac{e^{-\|z-(x+\delta)\|^2/\sigma^2}}{e^{-\|z-x\|^2/\sigma^2}}
    = Ce^{-((z-x)^T\delta)/\sigma^2}, \quad (13.10)\)


    where \(C\) is a constant irrelevant to \(z\). Therefore the worst-case \(f\)
    can be illustrated in the right panel of Fig. 13.3, where we place all the red
    mass to the top-right corner, and the boundary is a hyperplane orthogonal to the
    perturbation \(\delta\). As a Gaussian distribution, when projecting to the 1D
    space, is still a Gaussian distribution, if we consider the 1-D space pointing
    from \(x\) to \(x + \delta\), then the boundary will be the point for which the
    probability mass of the right-hand side is equal to \(P_B(x)\). Therefore the
    cutting point will be \(\Phi^{-1}(p_B)\), where \(\Phi^{-1}\) is the inverse of
    standard Gaussian CDF.


    By the argument above we can establish the certified robustness bound for randomized
    smoothed model in the binary case, as follows.


    **Theorem 2** (Cohen et al., 2019). *For binary classification problem with two
    classes A, B, suppose* \(p_A \in (\frac{1}{2}, 1]\). *Then* \(g(x + \delta) =
    c_A\) *for all* \(\|\delta\|_2 < \sigma \Phi^{-1}(p_A)\).


