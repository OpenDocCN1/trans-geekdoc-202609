  md: '# CHAPTER 7

    # Overview of neural network verification


    # ## 7.1 Robustness verification versus adversarial attack


    To introduce the concept of robustness verification, we will first mathematically
    define the notion of adversarial robustness and discuss the relationship between
    robustness verification and attack.


    We consider a classification model \( F : \mathbb{R}^d \to \{1, \dots, K\} \),
    where \( K \) is the number of classes. For simplicity, we consider the most simple
    \(\ell_p\) norm threat model, where an adversarial example aims to change the
    prediction with minimum \(\ell_p\) norm perturbation. In this case, for an input
    example \(\mathbf{x}_0\), the *minimum adversarial perturbation* can be mathematically
    defined as


    \(\epsilon^* = \min_{\boldsymbol{\delta}} \|\boldsymbol{\delta}\|_p \quad \text{s.t.}
    \quad F(\mathbf{x}_0 + \boldsymbol{\delta}) \neq F(\mathbf{x}_0). \quad (7.1)\)


    The value of \(\epsilon^*\) defines the distance to the closest decision boundary
    and also gives a “safe region”, which guarantees that the prediction remains unchanged
    within \(\mathcal{B}_{\mathbf{x}_0}(\epsilon^*) := \{\mathbf{x} \mid \|\mathbf{x}
    - \mathbf{x}_0\| < \epsilon^*\}\). This is also the shortest distance from \(\mathbf{x}_0\)
    to the decision boundary of the model \( F \), as illustrated in Fig. 7.1.


    Unfortunately, computing \(\epsilon^*\) is NP-complete even for a simple ReLU
    network (Katz et al., 2017). Therefore we can only expect an efficient way for
    computing upper or lower bounds of \(\epsilon^*\).


    Adversarial attacks are developed for finding a feasible solution \(\bar{\boldsymbol{\delta}}\)
    of (7.1), which corresponds to a counterexample for the robustness property. The
    norm of \(\bar{\boldsymbol{\delta}}\) can then serve as an *upper bound* of \(\epsilon^*\),
    denoted by \(\bar{\epsilon}\). For neural networks, several attacking algorithms
    have been proposed (see Chapter 2), including L-BFGS (Szegedy et al., 2014), FGSM
    (Goodfellow et al., 2015), I-FGSM (Kurakin et al., 2016), C&W (Carlini and Wagner,
    2017b), and PGD attack (Madry et al., 2018). All of them try to solve (7.1) or
    its reformulations by a gradient-based optimizer. However, due to the non-convexity
    of neural networks, attacks may not converge to the minimal adversarial perturbation,
    so the robustness measurement computed by an attack may not represent the true
    adversarial robustness. There are many examples that a model was considered “robust”
    under standard attack but'
  merge: -1
  img_proc: true
- pgno: 88
  md: '![](img/fa92deee3de0f00ea56e92ca0b92c8e4_88_0.png)


    Figure 7.1 Illustration of adversarial robustness, attack and verification.


    later on was broken by more carefully designed attacks (Athalye et al., 2018;
    Carlini and Wagner, 2017a; Carlini et al., 2019a).


    Robustness verification. In comparison, robustness verification methods aim to
    give a reliable measurement of robustness. Finding the exact value of \(\epsilon^*\)
    is regarded as _sound and complete verification_, which requires exponential computational
    complexity. For instance, several branch-and-bound algorithms were developed to
    split the problem into an exponential number of sub-regions and solve each of
    them separately. They usually only scale to less than 100 neurons and couldn’t
    handle most of the practically used neural networks.


    To address the computational issue, algorithms for _sound but incomplete_ neural
    network verification has become increasingly important. Those verification algorithms
    aim to compute a lower bound \(\epsilon \le \epsilon^*\) of minimum adversarial
    perturbation. This guarantees that no adversarial example exists within an \(\epsilon\)-ball
    around \(x\) no matter which attack is used. Fig. 7.1 illustrates the relationships
    between sound verification, attack, and minimum adversarial perturbation. The
    word “soundness” comes from the formal verification community, since with \(\epsilon\)
    available, we can provably state that some points are \(\epsilon\)-robust (when
    \(\epsilon \le \epsilon\)), which is the property of soundness. However, when
    \(\epsilon > \epsilon\) we do not know whether it is robust, so the verification
    is “incomplete”.


    In addition to viewing robustness verification as finding the lower bound \(\epsilon
    \le \epsilon^*\), we can also formulate it as the following problem:


    ```

    Decide whether there exists \(\boldsymbol{x}'' \in \{\boldsymbol{x} \mid \|\boldsymbol{x}
    - \boldsymbol{x}_0\| \le \epsilon\}\) such that \(F(\boldsymbol{x}_0) \neq F(\boldsymbol{x}'')\).

    (7.2)

    ```


    If we can answer this decision problem exactly, then a binary search can immediately
    give an accurate \(\epsilon^*\) value. Instead of solving this decision problem
    exactly, sound (but incomplete) verification algorithms will answer the'
  merge: -1
  img_proc: true
