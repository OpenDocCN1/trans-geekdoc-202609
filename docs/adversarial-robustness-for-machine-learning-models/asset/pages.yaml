  md: 'the bounding method used for each subdomain \( C_i \) is sound, then the whole
    BaB-based verifier will also be sound.


    _Completeness of BaB._ In a BaB-based verifier, it will keep splitting nodes until
    all the nodes are proved or disapproved. To guarantee the completeness of the
    procedure, we have to ensure that the bounding method will become a complete verifier
    for each subdomain after splitting all the ReLU neurons. This is true when applying
    the LP-based bounding method or linear bound propagation methods to each subdomain.


    _Bounding with Linear Programming (LP)._ For neural network verification, a classical
    bounding method used in BaB-based verification is the _Linear Programming bounding
    procedure_. Specifically, one can transform the original verification problem
    into a linear programming problem. This is done by relaxing each ReLU activation
    function \(\hat{z} = \max(z, 0)\) into linear constraints. If the ReLU neuron
    has been split, then it has already been replaced by a linear constraint (either
    \(z \le 0, \hat{z} = 0\) or \(z > 0, \hat{z} = z\)). For each unsplitted neurons,
    it can be relaxed into the following three constraints:


    ```

    \(\hat{z} \ge 0\) \tag{9.2}


    \(\hat{z} \ge z\) \tag{9.3}


    \(\hat{z} \le \frac{u}{u-l}(z - l),\) \tag{9.4}

    ```


    where _u, l_ are the lower and upper bound of _z_, which can be computed by a
    simple forward bound propagation or using the linear propagation-based method
    mentioned in the previous section. Eq (9.4) is known as the “triangle relaxation”
    for ReLU neurons, since it essentially bounds the ReLU by a convex triangle region.
    After doing this for all the unsplitted neurons, the verification problem will
    become a linear programming problem and can thus be solved by off-the-shelf LP
    solvers. Using the above mentioned LP-based bounding method with BaB can lead
    to a complete verifier, since when all the ReLU neurons are splitted, there will
    be no relaxation to the original problem, and the LP will get the exact solution
    of the verification problem for the given subdomain.


    _Branching in BaB._ Since the branching step determines the shape of the search
    tree, the main challenge is to efficiently choose a good leaf to split, which
    can significantly reduce the total number of branches and running time. For example,
    (Bunel et al., 2018) includes a simple branching heuristic, which assigns each
    ReLU node a score to estimate the improvement for tightening \(\underline{f}\)
    by splitting it, and splits the node with the highest score.'
