    # 20.2 Model fingerprinting


    Many existing DNN IP protection methods require intervention in training phase,
    which may cause performance degradation of the DNN (i.e., accuracy drop). Moreover,
    existing works may overlook the false positive problem of the DNN (i.e., mistakenly
    claiming the ownership of irrelevant models), which is of practical importance
    when designing fingerprints.


    To address these limitations, Wang et al. (2021d) propose a novel approach to
    fingerprinting neural networks using characteristic examples (C-examples). Its
    advantages are as follows: (i) its generation process does not intervene with
    the training phase, and (ii) it does not require any realistic data from the training/testing
    set. By applying uniform random noise to the weights of the neural network with
    the combination of gradient mean descending technique, the proposed C-examples
    achieve high-robustness to the resulting models pruned from the base model where
    the fingerprints are extracted. When further equipped with a high-pass filter
    in the frequency domain of image data during the generation process, C-examples
    attain low-transferability to other models different from the base model. The
    C-examples are significantly different from widely known adversarial examples'
