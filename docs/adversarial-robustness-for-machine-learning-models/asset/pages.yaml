- pgno: 176
  md: 'we have \( D^{(i)}(\lambda) \le P^{(i)}(\delta) \) for any dual feasible solution
    \( \lambda \) and primal feasible solution \( \delta \). Furthermore, based on
    Slater''s condition, we can show that (16.3) satisfies strong duality, so \( D^{(i)}(\lambda^*)
    = P^{(i)}(\delta^*) \), where \( \lambda^* \) and \( \delta^* \) are optimal solutions
    for the primal and dual problems, respectively, if \( \mathbf{x}_j^- \neq \mathbf{x}_i^+
    \) for all \( i \in [n''] \).¹ Based on strong duality, we have


    \(\frac{1}{2}(\epsilon^*)^2 = \min_{j \in [n'']} \{ P^{(i)}(\delta^*) \}\)

    \( = \min_{j \in [n'']} \{ \max_{\lambda \ge 0} D^{(i)}(\lambda) \}\)

    \( \ge \min_{j \in [n'']} \{ D^{(i)}(\lambda^{(j)}) \} \text{ with feasible }
    \lambda^{(j)}, \quad (16.5)\)


    so a set of feasible solutions \( \{\lambda^{(j)}\}_{j \in [n'']} \) leads to
    a lower bound of the minimum adversarial perturbation. In summary, we conclude
    the primal-dual relationship between 1-NN attack and verification:


    +   A primal feasible solution of \( P^{(i)} \) is a successful attack and gives
    us an upper bound of \( \epsilon^* \). Therefore we can solve a subset of QPs
    and select the minimum. Usually, \( \mathbf{x}_j^- \) closer to \( \mathbf{z}
    \) will lead to a smaller adversarial perturbation, so in practice we can sort
    \( \mathbf{x}_j^- \) by the distance to \( \mathbf{z} \), solve the subproblems
    one by one, and stop at any time. It will give a valid adversarial perturbation.
    After solving all the subproblems, the result will reach the minimum, i.e., the
    minimum adversarial perturbation norm \( \epsilon^* \).


    +   A set of dual feasible solutions \( \{\lambda^{(i)}\}_{j \in [n'']} \) will
    lead to a lower bound of \( \epsilon^* \) according to (16.5). Thus any heuristic
    method for setting up a set of dual feasible solutions will give us a lower bound,
    which can be used for robustness verification. If all the dual problems are solved
    exactly, then we will derive the tightest (maximum) lower bound, which is also
    \( \epsilon^* \).


    # Robustness verification for 1-NN models


    Here we give an example of how to quickly set up dual variables to give a nontrivial
    lower bound of the minimum adversarial perturbation without solving any subproblem
    exactly. For a dual problem \( D^{(i)} \), consider only having one variable \(
    \lambda_i^{(i)} \) to be the optimization variable and fixing all the remaining
    variables zero; then the optimal closed-form solution for this'
