  md: '# CHAPTER 19


    # Contrastive explanations


    Contrastive explanations aim to generate local explanations for neural networks
    of a given data input, in which, besides highlighting what is minimally sufficient
    (e.g., tall and long hair) in an input to justify its classification, we also
    want to identify contrastive characteristics or features that should be minimally
    and critically absent (e.g., glasses), so as to maintain the current classification
    and to distinguish it from another input that is “closest” to it but would be
    classified differently (e.g., Bob). We thus want to generate explanations of the
    form _An input x is classified in class y because features f1 , ..., fk are present
    and because features fm , ..., fp are absent._


    There is a strong motivation to have such a form of explanations due to their
    presence in certain human-critical domains. In medicine and criminology, there
    is the notion of pertinent positives and pertinent negatives (Herman, 2016), which
    together constitute a complete explanation. _A pertinent positive (PP) is a factor
    whose presence is minimally sufficient in justifying the final classification._
    On the other hand, _a pertinent negative (PN) is a factor whose absence is necessary
    in asserting the final classification._ For example, in medicine a patient showing
    symptoms of cough, cold and fever, but no sputum or chills, will most likely be
    diagnosed as having flu rather than having pneumonia. Cough, cold, and fever could
    imply both flu or pneumonia; however, the absence of sputum and chills leads to
    the diagnosis of flu. Thus sputum and chills are pertinent negatives, which along
    with the pertinent positives are critical and in some sense sufficient for an
    accurate diagnosis. The methods to identify such PPs and PNs can benefit from
    the study of generating and designing adversarial examples.


    # 19.1 Contrastive explanations method


    In this section, we detail the contrastive explanations method (CEM) proposed
    by Dhurandhar et al. (2018). Let X denote the feasible data space, and let (_x0
    , t0) denote an example x0 ∈ X and its inferred class label t0 obtained from a
    neural network model. The modified example x ∈ X based on x0 is defined as x =
    x0 + δ, where δ is a perturbation applied to x0 . The method of finding pertinent
    positives/negatives is formulated as an optimization problem over the perturbation
    variable δ used to explain the'
