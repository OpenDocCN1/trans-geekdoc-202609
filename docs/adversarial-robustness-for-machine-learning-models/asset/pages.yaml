    ```

    \max_{x'' \in S} a^T x''.

    ```


    For example, when S is an \(\ell_\infty\) ball with radius \(\epsilon\) centered
    at \(x_0\), the worst-case output will be \(\epsilon \|a\|_1 + a^T x_0\).


    What if we have some nonlinear activations such as ReLU? The main idea of linear
    bound propagation methods is forming linear upper and lower bounds \(\bar{\sigma}\)
    and \(\underline{\sigma}\) for the activation function. Consider a ReLU function,
    and for simplicity, we assume the current preactivation lower and upper bounds
    \(z \in [l, u]\), and we aim to bound ReLU(\(z\)) = max(\(z\), 0) by linear functions.
    We can consider three cases illustrated in Fig. 8.2. If \(l \ge 0\), then we know
    that \(z\) is always positive, and thus ReLU(\(z\)) = \(z\) will be linear. If
    \(u \le 0\), then we know that \(z\) is always negative, and thus ReLU(\(z\))
    = 0 will also be linear. The third case \(l < 0 < u\) is the most tricky, where
    ReLU is truly nonlinear, and we need to find linear upper and lower bounds. We
    call these “unstable neurons”.'
