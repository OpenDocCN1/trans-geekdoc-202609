  md: 'simplified dual QP problem is


    \(\lambda_i^{(p)} = \max \left( 0, -\frac{b_i}{\|a_i\|^2} \right),\)


    \(D^{(p)}([0, \dots, 0, \lambda_i^{(p)}, 0, \dots, 0]) = \frac{\max(-b_i, 0)^2}{2\|a_i\|^2}.\)

    (16.6)


    Since \(b_i = (\|z - \mathbf{x}_i^+\|^2 - \|z - \mathbf{x}_j^-\|^2)/2\) and \(a_i
    = \mathbf{x}_j^- - \mathbf{x}_i^+\) can be easily computed, we can use (16.5)
    to obtain a guaranteed lower bound \(\epsilon^*\) by:


    \(\min_{j \in [n]^-} \max_{i \in [n]^+} \frac{\max(\|z - \mathbf{x}_j^-\|^2 -
    \|z - \mathbf{x}_i^+\|^2, 0)}{2\|\mathbf{x}_j^- - \mathbf{x}_i^+\|}.\)

    (16.7)


    In addition, the certified bound in the above formulation has an interesting geometrical
    meaning. The inner value captures the distance between \(z\) and the bisection
    between \(\mathbf{x}_i^+\) and \(\mathbf{x}_j^-\). Perturbing \(z\) to this bisection
    is the smallest perturbation to make it closer to \(\mathbf{x}_j^-\) than \(\mathbf{x}_i^+\).
    If we want to perturb \(z\) so that the nearest neighbor is \(\mathbf{x}_j^-\),
    then we need to make sure \(z\) is closer to \(\mathbf{x}_j^-\) than any data
    point with positive label, so we take the max operation among all the distances
    to bisections. And to make \(z\) being classified as the negative label, we only
    need to make it to be closer to one of the \(\mathbf{x}_j^-\) than positive samples,
    so we take the min outside. In general, we can also get improved lower bounds
    by optimizing more coordinates rather than one variable for each subproblem, which
    could lead to tighter bound but may require additional computation.


    # Efficient algorithms for computing 1-NN robustness


    To compute the exact robustness of a 1-NN classifier, we need to solve all the
    primal problems (16.3), or equivalently, the corresponding dual problems (16.4).
    Although they are polynomial time solvable, in practice a naive algorithm is still
    too slow since there are \(O(n)\) quadratic problems involved and each has \(O(n)\)
    dual variables. Typically solving each QP takes \(O(n^2)\), so roughly \(O(n^3)\)
    time is required. This is too expensive when \(n\) is large.


    To resolve this problem, Wang et al. (2019c) developed a method to efficiently
    solve the \(O(n)\) subproblems. The main idea is to remove unnecessary variables
    and unnecessary subproblems by exploiting the primal-dual relationships. Intuitively,
    the final solution is the minimum among all the subproblem solutions, so if we
    know that the lower bound of the solution of a subproblem is larger than the current
    solution, then the subproblem'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'can be removed. As shown in the previous two sections, based on duality, *any*
    dual solution can give a lower bound of primal solution, so we can remove the
    subproblem when we found a dual solution with objective function value larger
    than the current minimum. Therefore, we can solve all the subproblems simutaneously
    and progressively remove subproblems.


    On the other hand, for each subproblem, we can also try to remove unnecessary
    dual variables (corresponding to primal constraints). As each constraint corresponds
    to another point \(\mathbf{x}_i\) where we hope the point after perturbation \((\mathbf{z}
    + \boldsymbol{\delta})\) is closer to the target point \(\mathbf{x}_j\) than to
    \(\mathbf{x}_i\), intuitively, if the point is far away, then we can remove the
    constraint. This can be also done by a screening algorithm derived from the primal
    dual relationship, and the interested readers can check more details in (Wang
    et al., 2019c). In general, how to efficiently compute the minimum adversarial
    perturbation is still an unresolved problem.


    # Extending beyond 1-NN


    Next, we extend the above-mentioned robustness evaluation approach to \(K\)-NN
    models with \(K > 1\). Consider the binary classification case, we let \(\mathbb{S}^+
    = \{\mathbf{x}_1^+, \dots, \mathbf{x}_{n^+}^+\}\) be the set of samples with the
    same label with \(\mathbf{z}\) and \(\mathbb{S}^- = \{\mathbf{x}_1^-, \dots, \mathbf{x}_{n^-}^-\}\)
    be the set of samples with opposite label to \(\mathbf{z}\). We assume \(K\) is
    an odd number to avoid the tie in \(K\)-NN voting and both \(n^+, n^-\) are large
    enough. We can list all the possible combinations of \((\mathbb{I}, \mathbb{J})\)
    with \(\mathbb{I} \subseteq [n^+], \mathbb{J} \subseteq [n^-], |\mathbb{I}| =
    (K-1)/2\), and \(|\mathbb{J}| = (K+1)/2\), and then solve the following QP problem
    to force \(\mathbf{z} + \boldsymbol{\delta}\) to be closer to \(\mathbf{x}_j^-\)
    for all \(j \in [\mathbb{J}]\) than to all instances in \(\mathbb{S}^+\) except
    \(\mathbf{x}_i^+\) for all \(i \in [\mathbb{I}]\):


    ```

    \epsilon^{(\mathbb{I}, \mathbb{J})} = \min_{\boldsymbol{\delta}} \frac{1}{2} \boldsymbol{\delta}^T
    \boldsymbol{\delta}

    \text{s.t. } \|\mathbf{z} + \boldsymbol{\delta} - \mathbf{x}_j^-\|^2 \le \|\mathbf{z}
    + \boldsymbol{\delta} - \mathbf{x}_i^+\|^2

    \forall i \in [n^+] - \mathbb{I}, \forall j \in \mathbb{J}.

    (16.8)

    ```


    Then the norm of the minimum adversarial perturbation can be computed by \(\epsilon^*
    = \min_{(\mathbb{I}, \mathbb{J})} \sqrt{2\epsilon^{(\mathbb{I}, \mathbb{J})}}\).
    There will be exponential number of QPs in totat, so it is usually impossible
    to compute the minimum adversarial perturbation by iterating all QPs. However,
    we can still obtain upper and lower bounds corresponding to attack and verification.
    For an upper bound (attack), we can just choose a small number of \((\mathbb{I},
    \mathbb{J})\) tuples and only solve these QPs. The quality of the bound will rely
    on how good is the selected subset of QPs.'
