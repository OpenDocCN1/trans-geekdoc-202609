    # 9.2 Branch and bound


    To speed up complete verification, most of the modern algorithms adopt the Branch-and-Bound
    (BaB) method (Bunel et al., 2018). Note that BaB is also a crucial component in
    off-the-shelf MIP solvers, and by developing a specialized BaB procedure for verification
    can improve the efficiency. BaB-based verification framework is a recursive process
    consisting of two main steps, branching and bounding. For *branching*, BaB-based
    methods will divide the bounded input domain $\mathcal{C}$ into subdomains $\{\mathcal{C}_i
    | \mathcal{C} = \bigcup_i \mathcal{C}_i\}$, each of these domains corresponds
    to a new verification problem. For instance, we can split a ReLU neuron $\hat{z}^{(k)}
    = \text{ReLU}(z^{(k)})$ to negative and positive cases as $\mathcal{C}_0 = \{x
    | z^{(k)} \ge 0\}$ and $\mathcal{C}_1 = \{x | z^{(k)} < 0\}$ for a ReLU-based
    network, where each of these domains are the set of input that satisfies a certain
    constraint. For each subdomain $\mathcal{C}_i$, BaB-based methods perform *bounding*
    to obtain a relaxed but sound lower bound $\underline{f}_{\mathcal{C}_i}$. A tightened
    global lower bound over $\mathcal{C}$ can then be obtained by taking the minimum
    values of the subdomain lower bounds from all the subdomains: $\underline{f} =
    \min_i \underline{f}_{\mathcal{C}_i}$.


    Based on this splitting approach, BaB will be performed recursively to tighten
    the approximated global lower bound. This can be implemented into a tree structure,
    where each node corresponds to a subdomain $\mathcal{C}$. Starting from the root
    note where $\mathcal{C}$ is the entire input domain (e.g., an $\ell_p$ ball around
    some data point $x_0$), BaB splits the node(domain) based on the sign of one ReLU
    neuron. After the split, we will create two children for a node, each of them
    consists a subdomain, and compute the lower bound for the subdomain. This is done
    until either (i) the global lower bound $\underline{f}$ becomes larger than 0
    and thus the property is proven or (ii) a violation (e.g., identification of an
    adversarial example) is located in a subdomain to disprove the property.


    Soundness of BaB. We say that the verification process is sound if we can always
    trust the “yes” (the property is successfully verified) answer given by the verifier.
    When a BaB-based verification process outputs “yes”, it means all the leaf nodes
    output “yes”. Therefore, we can easily see that if'
