  md: 'For (ii), Yang et al. (2019c) propose a temporal dependency (TD) based detection
    method. Due to the fact that audio sequence has explicit temporal dependency (e.g.,
    correlations in consecutive waveform segments), they explore if such temporal
    dependency will be affected by adversarial perturbations.


    Methodology. The pipeline of the temporal dependency-based method is shown in
    Fig. 15.3. Given an audio sequence, they propose to select the first k portions
    of it (i.e., the prefix of length k) as input for ASR to obtain transcribed results
    as Sk. Moreover, they will also insert the whole sequence into ASR and select
    the prefix of length k of the transcribed result as S(whole,k), which has the
    same length as Sk. We will then compare the consistency between Sk and S(whole,k)
    in terms of temporal dependency distance. Here the word error rate (WER) is adopted
    as the distance metric (Levenshtein, 1966). For normal/benign audio instance,
    Sk and S(whole,k) should be similar since the ASR model is consistent for different
    sections of a given sequence due to its temporal dependency. However, for audio
    adversarial examples, since the added perturbation aims to alter the ASR output
    toward the targeted transcription, it may fail to preserve the temporal information
    of the original sequence. Therefore, due to the loss of temporal dependency, Sk
    and S(whole,k) in this case will not be able to produce consistent results. Based
    on such a hypothesis, they leverage the prefix of length k of the transcribed
    results and the transcribed k portion to potentially recognize adversarial inputs.


