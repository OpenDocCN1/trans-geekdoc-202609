    # ## 20.3 Empirical comparison


    Here we compare different variants of the C-examples proposed by Wang et al. (2021d).
    Their visual comparisons are shown in Fig. 20.3.


    In the experiment the accuracy of the C-examples on the pruned model is used to
    indicate its robustness and the accuracy on the variant model (with similar functionality
    to the base model, e.g., VGG-19 model to the base VGG-16 model) to indicate its
    transferability. Originally, the accuracy of all kinds of C-examples on the base
    model is 100% during generation. To effectively evaluate the trade-off between
    robustness of the pruned models and transferability to other variant models, we
    define the difference between the robustness and transferability as the _uniqueness
    score_ (_uniqueness score_ = _robustness_ − _transferability_), where higher uniqueness
    score means that the C-examples are more robust to pruned models and less transferable
    to variant models. Intuitively, a better fingerprint method should achieve higher
    uniqueness score. The uniqueness score can also be used to indicate the false
    positive problem, i.e., if the uniqueness score is negative, then the corresponding
    fingerprint method is prone to make false model claims.


    Table 20.2 demonstrates the effectiveness of C-examples, RC-examples, and LTRC-examples
    on different pruned models using the base VGG-16 model on ImageNet dataset with
    different pruning ratios for evaluating robustness. For testing transferability
    to other variant models (such as VGG-19, ResNet Family, DenseNet Family), as VGG-19
    is the most similar architecture to VGG-16 and more transferable for fingerprints
    generated on VGG-16, we only report the transferability on VGG-19 and omit the
    transferability results on other models such as ResNet Family or DenseNet Family.
    Note that the transferability to other models should be lower than VGG-19, leading
    to better performance with higher uniqueness score.


    As shown in Table 20.2, the uniqueness scores of RC-examples, RC-examples+GM,
    and LTRC-examples are higher than that of the baseline vanilla C-examples. We
    notice that C-examples suffer from negative uniqueness scores due to their high
    transferability to other models when the pruning ratios are 70% and 80%. We can
    observe that LTRC-examples with \(\epsilon = 0.001\) achieve the best uniqueness
    scores with relatively large margins'
