- pgno: 215
  md: '# Model reprogramming


    Model reprogramming aims to repurpose a pretrained machine learning model to solve
    a problem in a new domain without changing the pretrained model parameters. The
    application was inspired by adversarial machine learning in the sense that a trained
    model can be repurposed to solve a new task that is not intentionally designed/expected
    by the model developer. The original paper (Elsayed et al., 2019) calls this technique
    “adversarial reprogramming” due to induced implications on model security and
    resource misuse. The authors show that we can learn a universal input transformation
    function (e.g., a trainable universal input perturbation) to reprogram a pretrained
    ImageNet model (without changing the model weights) for solving MNIST/CIFAR–10
    image classification and simple vision-based counting tasks with high accuracy.
    Later on, it was found that model reprogramming is a powerful tool for efficient
    machine learning in a resource-limited setting, including limitations on data
    and development cost (Tsai et al., 2020; Yang et al., 2021b). We will use the
    terms “model reprogramming” and “adversarial reprogramming” (AR) interchangeably,
    though in the following context the technique is not for adversarial purposes,
    but rather for efficient cross-domain learning in resource-limited settings.


    To facilitate the discussion, in this chapter, we use the mathematical notations
    given in Table 18.1.


    # 18.1 Reprogramming voice models for time series classification


    Machine learning for time series data has rich applications in a variety of domains,
    ranging from medical diagnosis (e.g., physiological signals such as electrocardiogram
    (ECG)), finance/weather forecasting, to industrial measurements (e.g., sensors
    and Internet of Things (IoT)). One common practical challenge that prevents time
    series learning tasks from using modern large-scale deep learning models is data
    scarcity. Although many efforts have been made to advance transfer learning and
    model adaptation for time series classification, a principled approach is lacking,
    and its performance may not be comparable to conventional statistical learning
    benchmarks.'
  merge: -1
  img_proc: true
