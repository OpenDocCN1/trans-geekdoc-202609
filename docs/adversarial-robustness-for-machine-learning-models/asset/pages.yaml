    words (e.g., all the other words in the same sentence), we can assume that those
    top possible words preserve the "nature ness" of the sentence, and combining with
    synonyms, this can lead to more natural adversarial examples that preserve semantics.


    With the perturbation set defined, another challenge for NLP attacks is to find
    the adversarial examples that maximize the task-specific loss (or other criterion)
    within the perturbation set. As the input space and perturbation set are discrete,
    this leads to a discrete optimization problem, which is usually harder to solve
    than continuous ones. Several discrete search algorithms have been proposed for
    NLP attacks. For example, evolutionary algorithms and reinforcement learning have
    been used to search for adversarial examples in the perturbation space (Alzantot
    et al., 2018; Li et al., 2016). To make the attacks faster, some other works consider
    simple greedy approaches. For example, Yang et al. (2020e) proposed a greedy attack
