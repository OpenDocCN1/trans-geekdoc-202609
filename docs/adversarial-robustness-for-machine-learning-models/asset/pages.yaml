  md: 'In this minimization problem, constraint (7.5) is just a linear equality constraint,
    but constraint (7.6) is a non-linear and non-convex constraint when $\sigma^{(l)}$
    is a nonlinear function such as ReLU. Therefore, it is theoretically difficult
    to solve this optimization problem exactly. The idea in sound but incomplete verification
    aims to relax constraint (7.6) to make the problem tractable while being able
    to compute a lower bound of the solution. We will discuss how to achieve a lower
    bound and the exact solution of this problem in the next two chapters, corresponding
    to algorithms for incomplete and complete verifications.


    Before delving into the actual verification algorithms, we will first discuss
    the generalized form of (7.3). In fact, neural network verification can be used
    to verify many other properties in addition to adversarial robustness. Given a
    neural network $f : \mathbb{R}^d \rightarrow \mathbb{R}^K$ that maps input to
    output neurons, verification aims to find a lower bound or exact solution of an
    affine function within an input region $S$:


    $$\min \langle c, f(\boldsymbol{x}) \rangle \text{ s.t. } \boldsymbol{x} \in S,
    \tag{7.8}$$


    where $c$ is called a linear specification, which corresponds to the property
    we want to verify. In the setting of binary classification, as in formulation
    (7.3), $f(\boldsymbol{x})$ is just a single value and we can set $c = 1$ for verification.
    For multi-class classification problem, by setting $c$ as a vector with $1$ on
    the positive class and $-1$ on the opposite class (e.g., class $t$), the sign
    of the solution of (7.8) indicates whether there exists any adversarial example
    predicted as class $t$. If we verify there exists no adversarial example for each
    class $t$, then the robustness can be certified. In addition to robustness verification,
    this framework is also used to guarantee safety in many real-time control systems,
    such as aircraft controls (Julian et al., 2019; Katz et al., 2017).


    # 7.3 Applications of neural network verification


    As mentioned before, neural network verification can verify not only robustness,
    but also other safety specifications as long as the specification can be written
    as an affine function locally. Here we introduce some important applications for
    neural network verification.


    # Safety-critical control systems


    Verification has been used in many control systems. Among them, the safety verification
    problem of next-generation airborne collision avoidance system for unmanned aircraft
    (ACAS Xu) has been used as the benchmark for'
  merge: -1
