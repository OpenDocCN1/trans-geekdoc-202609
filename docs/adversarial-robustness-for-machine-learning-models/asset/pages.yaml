  md: 'much the prediction can be changed when perturbing an input within an \(\epsilon\)
    ball. Inspired by this observation, Zhang et al. (2019b) modify the bilevel objective
    function of adversarial training as follows:


    \(\min_{\theta} E_{(x,y)\in \mathcal{D}} L(f_\theta(x), y) + \lambda \max_{x''
    \in B(x)} L''(f_\theta(x''), f_\theta(x)),\) (12.5)


    where \(L\) and \(L''\) are two loss functions. In this formulation, we assume
    both loss functions are cross-entropy loss, so the first term is the standard
    training loss defined on the clean data, and the second term measures the difference
    between the prediction of clean example (\(f(x)\)) and the perturbed example (\(f(x'')\));
    \(\lambda\) is a positive constant that controls the balance between two terms.
    By decomposing the clean and robust loss it becomes easier to control the robustness
    and accuracy tradeoff (with a properly chosen \(\lambda\)). This formulation,
    also known as *TRADES*, is shown to achieve better performance than adversarial
    training and was the winner of the NeurIPS 2018 defense challenge.


    Later on, several improvements have been made over TRADES. In particular, many
    papers found that one has to weight each sample differently to obtain the best
    performance. There are several motivations behind this. First, we should treat
    misclassified samples differently from correctly classified ones. For misclassified
    samples, as the classifier already predicts the wrong label, it is not useful
    to make the model robust on those points. Second, some examples are intrinsically
    hard to classify (e.g., examples that are close to decision boundary), so forcing
    them to be robust will result in poor performance. For instance, in Fig. 12.1,
    we showed a linear classifier, where the true margin between two classes are 2.5,
    and there does not exist a classifier that can robustly classify all the samples
    with \(\epsilon = 3\). If we train the classifier with \(\epsilon = 3\), then
    the result will be a poor classifier as shown in Fig. 12.1(c).


    As a result, many formulations have been developed to conduct adversarial training
    with nonuniform weights among samples. For instance, Wang et al. (2019d) proposed
    a weighted version of TRADES, where they weight the samples by the correctness
    of each prediction. More specifically, let \(p_y(x, \theta) := (f_\theta(x''))_y\)
    be the normalized prediction probability for label \(y\) — it is the softmax output
    of the model between [0, 1]. Then we can consider a weighted version of the TRADES
    objective as


    \(\min_{\theta} E_{(x,y)\in \mathcal{D}} L(f_\theta(x), y) + \lambda \max_{x''
    \in B(x)} L(f_\theta(x''), f_\theta(x))(1 - p_y(x, \theta)),\) (12.6)'
