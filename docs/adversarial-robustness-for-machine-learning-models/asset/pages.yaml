    *Unsupervised adversarial example.* Many machine learning tasks such as data reconstruction
    and unsupervised representation learning do not use data labels, which prevents
    the use of aforementioned supervised attack functions. Here we use an autoencoder
    \(\Phi\) for data reconstruction to illustrate the unsupervised attack formulation.
    The design principle can naturally extend to other unsupervised tasks. The autoencoder
    \(\Phi\) takes a data sample \(x\) as an input and outputs a reconstructed data
    sample \(\Phi(x)\). Different from the rationale of supervised attack, for unsupervised
    attack, we propose to use MINE to find the *least similar* perturbed data sample
    \(x + \delta\) with respect to \(x\) while ensuring that the reconstruction loss
    of \(\Phi(x + \delta)\) is no greater than \(\Phi(x)\) (i.e., the criterion of
    successful attack for data reconstruction). The unsupervised attack formulation
    is as follows:


    \(\text{Minimize}_{\delta} \quad I_\Theta(x, x + \delta)\)

    \(\text{such that } x + \delta \in [0, 1]^d, \delta \in [-\epsilon, \epsilon]^d
    \text{ and } f_x(x + \delta) \le 0. \quad (21.2)\)


    The first two constraints regulate the feasible data space and the perturbation
    range. For the \(L_2\)-norm reconstruction loss, the unsupervised attack function
    is


    \(f_x^{\text{unsup}}(x + \delta) = \|x - \Phi(x + \delta)\|_2 - \|x - \Phi(x)\|_2
    + \kappa, \quad (21.3)\)


    which means that the attack is successful (i.e., \(f_x^{\text{unsup}}(x + \delta)
    \le 0\)) if the reconstruction loss of \(x + \delta\) relative to the original
    sample \(x\) is smaller than the native reconstruction loss minus a nonnegative
    margin \(\kappa\), that is, \(\|x - \Phi(x + \delta)\|_2 \le \|x - \Phi(x)\|_2
    - \kappa\). In other words, our unsupervised attack formulation aims to find that
    most dissimilar perturbed sample \(x + \delta\) to \(x\) measured by MINE while
    having smaller reconstruction loss (in reference'
