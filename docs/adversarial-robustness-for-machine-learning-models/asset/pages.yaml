    # 13.3 Certified defense with randomized smoothing


    In the previous section, we have shown that adding randomized components in neural
    network can improve adversarial robustness, with a theoretical justification by
    explaining the behavior of neural networks under a neural SDE framework. However,
    as this analysis often requires taking limits to infinite numbers of layers, it
    is difficult to actually compute the actual robustness of those networks in practice.


    Surprisingly, it has been shown that by properly adding randomness into the input
    layer of neural networks, the robustness of such randomized network can be certifiable.
    That is, for those networks, we will be able to obtain a robust radius r for each
    point x, where it is guaranteed that with high probability, any perturbation within
    those robust radius cannot change the prediction of neural networks. This technique
    is called randomized smoothing, first proposed by Lecuyer et al. (2019), and then
    the bounds are significantly improved in (Cohen et al., 2019; Li et al., 2019a).


    In randomized smoothing, we consider a classification model f that maps inputs
    in R^d to classes Y. Randomized smoothing is a method for constructing a “smoothed”
    classifier g from f. For input x, the smoothed classifier g returns whichever
    class the base classifier f is most likely to return when x is perturbed with
    a Gaussian random noise. This can be mathematically defined as


    ```

    g(x) = arg max P(f(x + ε) = y), y∈Y (13.7)

    where ε ∼ N(0, σ²I), (13.8)

    ```


    where σ is the standard deviation of an isotropic Gaussian distribution controlling
    the noise added to the classifier. P(·) is the probability for the event. Note
    that this is equivalent to adding the noise layer introduced in RSE into the input
    of neural network, whereas all the intermediate layers are unperturbed.


    Why adding noise to the input layer can improve robustness? The first paper proposing
    randomized smoothing established robustness guarantees by connecting randomized
    smoothing with differential privacy (Lecuyer'
  merge: -1
  img_proc: true
