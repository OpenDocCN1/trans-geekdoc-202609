    using the targeted caption method. The adversarial perturbations are visually
    imperceptible but can successfully mislead the Show-and-Tell (Vinyals et al.,
    2015) neural image captioning model to generate the targeted captions. Interestingly
    and perhaps surprisingly, their results pinpoint the Achilles heel of the language
    and vision models used in the tested image captioning systems. Moreover, the adversarial
    examples in neural image captioning highlight the inconsistency in visual language
    grounding be-'
