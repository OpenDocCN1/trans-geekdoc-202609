    noises” added into the example. To capture the natural image manifold, most of
    the approaches in this category adopt some kind of generative models (e.g., some
    version of autoencoder or generative adversarial networks). Since generative models
    are trained on natural examples, adversarial examples will be projected to the
    manifold learned by the generative model. Furthermore, “projecting” the adversarial
    examples onto the range of the generative model can have the desirable effect
    of reducing the adversarial perturbation.


