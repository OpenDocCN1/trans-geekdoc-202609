    # Randomization-based defense


    Randomized components are expected to make the attacker harder to succeed, so
    several earlier defensive methods add randomized components to a neural network
    to make it more robust. However, later on a stronger attack based on expectation
    over transformations (EoT) (Athalye and Sutskever, 2018; Athalye et al., 2018)
    is developed for evaluating the robustness of randomized models (see Chapter 4
    for details on EoT attacks), and some naive ways for adding randomness may not
    really improve robustness under the EoT attacks. Nevertheless, later works have
    demonstrated that some types of randomness can improve robustness, and surprisingly,
    it has been shown that a randomized component can theoretically improve the robustness
    of a model, and further, the robustness of such randomized models can be certifiable.
    In this section, we first discuss some earlier attempts in introducing randomness
    and how to properly evaluate the robustness of randomized models. Then we discuss
    two kinds of randomness, adding to either the first layer or all the layers, where
    they can theoretically improve the robustness.


    # 13.1 Earlier attempts and the EoT attack


    Adversarial perturbation can be viewed as a special type of additive noise, and
    various methods have been proposed to improve the robustness of DNNs by incorporating
    random components into the model. For instance, Xie et al. (2017) introduced a
    simple preprocessing method to randomize the input of neural networks, hoping
    to remove the potential adversarial perturbation. During the testing phase, the
    input is randomly resized into several different sizes, and then around each of
    the resized inputs, zeros are randomly padded. The authors demonstrated that this
    simple method can be applied to large-scale datasets, such as Imagenet. Similarly,
    Zantedeschi et al. (2017) showed that by using a modified ReLU activation layer
    (called BReLU) and adding noise to the origin input to augment the training data,
    the learned model will gain some stability to adversarial examples. On the other
    hand, Dhillon et al. (2018) introduce randomness into the evaluation of a neural
    network to defend against adversarial examples. Their method randomly drops some
    neurons of each layer to 0 with probability'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'proportional to their absolute value. That is, their method essentially applies
    dropout at each layer, where instead of dropping with uniform probability, nodes
    are dropped according to a weighted distribution. Values that are retained are
    scaled up (as is done in dropout) to retain accuracy.


    Despite those defense methods demonstrated good performance against regular attack
    methods (such as FGSM or PGD attacks), it has been shown that under a more carefully
    designed attack, those simple randomization methods may not work. The main trick
    is that when conducting an attack, we have to consider the randomness in the model.
    Let \( f_{\theta, \tau} \) be the randomized model with a randomized component
    \( \tau \) sampled from some distribution. In the original PGD attack, each step
    will compute the gradient on a particular random \( \tau \), which encounters
    high variance and may encounter difficulties to converge to a good solution. Therefore,
    instead of taking \( \nabla_x f_{\theta, \tau}(x) \) with one particular \( \tau
    \), we need to take several samples and use the average to estimate the gradient.
    More specifically, each iteration will take the following form of gradient estimation:


    ```

    \(\frac{1}{R} \sum_{i=1}^R \nabla_x f_{\theta, \tau_i}(x),\)

    (13.1)

    ```


    where \( \tau_1, \dots, \tau_R \) are sampled from the distribution of \( \tau
    \). Therefore, even though PGD takes more time at each iteration, it can obtain
    a much stronger adversarial example against the randomized model \( f_{\theta,
    \tau} \), by performing parameter update using the averaged gradient. It has been
    shown by Athalye et al. (2018) that under this stronger attack, these previously
    introduced simple randomized defense models will fail.


    # 13.2 Adding randomness to each layer


    Liu et al. (2018c) demonstrated a simple strategy that can make randomized defense
    achieve similar robustness performance as adversarial training, even under stronger
    EoT attacks. In this method, they define a “noise layer” to introduce randomness
    to both the input and the hidden layer output. In this “noise layer”, randomly
    generated Gaussian noise is added to the input:


    ```

    \(\boldsymbol{x} \leftarrow \boldsymbol{x} + \boldsymbol{\epsilon}, \quad \boldsymbol{\epsilon}
    \sim \mathcal{N}(0, \sigma^2 I),\)

    ```


    where \( \sigma \) is a hyperparameter. Larger values of \( \sigma \) lead to
    better robustness but worse prediction accuracy, whereas smaller values of \(
    \sigma \) result in'
