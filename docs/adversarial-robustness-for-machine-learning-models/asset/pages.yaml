  md: '# Robust pretraining + linear finetuning.


    We aim to develop robustness enhancement solutions by fully exploiting and exploring
    the power of CL at the pretraining phase, so that the resulting robust feature
    representations can seamlessly be used to generate robust predictions of downstream
    tasks using just a lightweight finetuning scheme. With the aid of adversarial
    training (AT), we formulate the “robust pretraining + linear finetuning” problem
    as follows:


    ```

    Pretraining: \min_{\theta} \mathbb{E}_{x \in \mathcal{X}} \max_{||\delta||_\infty
    \le \epsilon} \ell_{pre}(x + \delta, x; \theta), \quad (17.4)

    Finetuning: \min_{\theta_c} \mathbb{E}_{(x,y) \in \mathcal{D}} \ell_{CE}(\phi_{\theta_c}
    \circ f_{\bar{\theta}}(x), y), \quad (17.5)

    ```


    where $\ell_{pre}$ denotes a properly designed robustness- and generalization-aware
    CL loss given as a function of the adversarial example ($x+\delta$), original
    example $x$, and feature encoder parameters $\theta$. In (17.4), $\phi_{\theta_c}
    \circ f_{\bar{\theta}}$ denotes the classifier by equipping the linear prediction
    head with parameters $\theta_c$ (with parameters $\theta_c$ to be designed) on
    top of the fixed feature encoder $f_{\bar{\theta}}$, and $\ell_{CE}$ denotes the
    supervised CE loss over the target dataset $\mathcal{D}$. Note that besides the
    standard linear finetuning (17.5), we can also modify (17.5) using the worst-case
    CE loss for adversarial linear/full finetuning (Jiang et al., 2020; Kim et al.,
    2020). We do not consider standard full finetuning since tuning the full network
    weights with standard cross-entropy loss is not possible for the model to preserve
    robustness (Chen et al., 2020c).


    AdvCL framework. The AdvCL framework proposed by Fan et al. (2021) includes two
    main components, robustness-aware view selection and pseudo-supervision stimulus
    generation. In particular, they advance the view selection mechanism by taking
    into account proper frequency-based data transformations that are beneficial to
    robust representation learning and pretraining generalization ability. Furthermore,
    they propose to design and integrate proper supervision stimulus into ADVCL to
    improve the cross-task robustness transferability since robust representations
    learned from self-supervision may lack the class-discriminative ability required
    for robust predictions on downstream tasks. An overview of ADVCL is provided in
    Fig. 17.3. In contrast to standard CL, Fan et al. (2021) propose two additional
    contrastive views, the adversarial and frequency views.


