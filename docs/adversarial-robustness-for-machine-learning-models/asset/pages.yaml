    # 17.2 Adversarial robustness preservation for contrastive learning: from pretraining
    to finetuning


    Contrastive learning (CL) can learn generalizable feature representations and
    achieve state-of-the-art performance of downstream tasks by fine-tuning a *linear*
    classifier on top of it. Early approaches for unsupervised representation learning
    leverages handcrafted tasks, like prediction rotation (Gidaris et al., 2018),
    solving the Jigsaw puzzle (Noroozi and Favaro, 2016; Carlucci et al., 2019), and
    geometry prediction (Gan et al., 2018) and Selfie (Trinh et al., 2019). Recently,
    contrastive learning (CL) (Chen et al., 2018e; Wang and Isola, 2020; Chen et al.,
    2020e; van den Oord et al., 2018; He et al., 2020; Chen et al., 2020d) and its
    variants (Grill et al., 2020; Tian et al., 2020; Purushwalkam and Gupta, 2020;
    Chen and He, 2020) have demonstrated superior abilities in learning generalizable
    features in an unsupervised manner. The main idea behind CL is to self-'
