  md: 'spam detection) models; if there exists semantic-preserved perturbations to
    fool the fake news detection models, malicious users can leverage those perturbations
    to create fake news while being able to bypass the detection models. Beyond security
    concerns, adversarial robustness of text models has also been deeply studied recently
    as finding adversarial examples could be the first step for model debugging.


    There are two main challenges when conducting attacks to nature language processing
    (NLP) models. First, as inputs of NLP are discrete, finding adversarial examples
    usually leads to a discrete optimization problem instead of the continuous one
    in computer vision attacks. Second, the “semantic invariance” perturbation in
    NLP is harder to define than in the computer vision cases. In the image domain,
    a slight change on each pixel value usually would not be perceptible by human,
    but this is not true in NLP as changing a word in a sentence may significantly
    change the semantic meaning of the whole sentence. Therefore adversarial attacks
    in the NLP domain need to consider these two factors. For handling discrete inputs,
    we usually seek to discrete optimization algorithms. To construct a semantic-invariance
    perturbation set, we often resort to either word embedding or contextualized word
    embeddings. In the following, we briefly introduce several NLP attacks developed
    for sentence classification and sequence-to-sequence translation. There are many
    NLP attacks beyond these two applications that are not covered in this book, such
    as question answering, dialogue systems and semantic parsing.


    # Sentence classification


    Most of the NLP attacks focused on sentence classification, as this is one of
    the most simple but representative tasks. Earlier attacks to text classification
    usually define the perturbation set by constraining the number of words or characters
    changed in the sentence. However, as discussed above, it is possible to change
    the meaning of the whole sentence by only replacing one word (or character). Therefore
    more recent attacks usually try to constrain the replaced words to enforce the
    semantic invariance. In NLP, word embeddings have been developed to represent
    the semantic meaning of each word by a latent vector, and there are several well-trained
    word embeddings such as Word2Vec (Mikolov et al., 2013) and Glove (Pennington
    et al., 2014). Alzantot et al. (2018) used distances in the word embedding space
    to construct a set of synonyms and used them to define the perturbation set: each
    word is only allowed to be replaced by its synonyms. More recently, due to the
    popularity of large-scale pretrained language models'
  merge: -1
