    struct verification. In addition, it is assumed that the adversary is aware of
    all existing watermarking techniques and is capable of designing adaptive antitwatermark
    schemes to target the deployed method. Due to such possible counter-watermark
    attempts, it is safe to assume that a hijacked model will go under modifications
