  md: 'where $\mathcal{P}(i) = [m]/\{i\}$ denotes the $m$ positive views except $i$,
    $[m]$ denotes the integer set $\{1, 2, \dots, m\}$, and $\mathcal{N}(i)$, with
    cardinality $(bm-1)$, denotes the set of $m$-view augmented $b$ batch samples
