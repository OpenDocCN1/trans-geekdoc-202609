  md: '# CHAPTER 2


    # White-box adversarial attacks


    Prediction-evasive adversarial attacks are procedures to generate adversarial
    examples on a given machine learning model. For a target model \( F_\theta \)
    (also called the victim model from the security point of view), the most general
    definition of adversarial example is an input \( \mathbf{x} \) such that the model
    prediction \( F_\theta(\mathbf{x}) \) is clearly inconsistent with human perception,
    where \( \theta \) is the set of model parameters. For brevity, we will use \(
    F \) to denote the target model in the remaining chapter. To construct an adversarial
    example, a typical procedure is to start with a natural data input (e.g., an image)
    that is correctly classified by the machine learning model and then add a human
    imperceptible perturbation to change the predicted label. This is also called
    evasion attack or test-time attack, since the attacker is trying to add a small
    perturbation in the test time to make the machine learning model misclassify without
    interfering the training procedure. Fig. 2.1 gives an example of an adversarial
    attack, where the original bagel image is correctly classified as a bagel, but
    the perturbed example, after adding a human imperceptible noise, will be classified
    as a piano. In practice, an adversarial perturbation could lead to catastrophic
    damage to a real-time system. For instance, researchers have demonstrated that
    it is possible to slightly perturb a stop sign to make it being recognized as
    a speed limit sign by a machine learning-based image recognition system (Eykholt
    et al., 2018).


    In this chapter, we discuss how to conduct adversarial attacks in the white-box
    setting. In this setting the attacker is assumed to have full knowledge of the
    victim machine learning model. For instance, if the victim


    ![](img/fa92deee3de0f00ea56e92ca0b92c8e4_29_0.png)


    Figure 2.1 An illustration of adversarial example from (Chen et al., 2017a).'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'model $F$ is a neural network, we will assume that the attacker knows both
    the architecture and weights of this network in the white-box setting. Since the
    attacker can leverage full knowledge to attack the victim model, white-box attacks
    are the easiest way to construct adversarial examples and also lead to the highest
    successful rate and smallest perturbations. In practice, the white-box assumption
    is often too strong since the underlying model used in production is usually hidden
    to the attacker, and we will discuss how to conduct the attacks under those more
    realistic settings in the next chapter. Despite being unrealistic, white-box attacks
    are more reliable ways to evaluate the robustness of a model, since they usually
    lead to strongest attacks that can be used to evaluate the worst-case performance
    of a system. Therefore white-box attacks can be used by model developers to provide
    in-house performance evaluation.


    # 2.1 Attack procedure and notations


    Now we formally define the procedure of an adversarial attack. For simplicity,
    we will mainly focus on the multiclass classification problem in this chapter.
    For a $K$-way multiclass classification problem, we define the model as $F : \mathbb{R}^d
    \to \{1, \dots, K\}$ that maps an input $\boldsymbol{x}$ to a predicted class
    label. We assume that the model makes the final decision by first computing a
    score for each class and then choosing the class with the maximum score. Mathematically,
    we use $f_j(\boldsymbol{x})$ to denote the predicted score for the $j$th class,
    and the label with highest score will be the final decision of the model: $F(\boldsymbol{x})
    = \arg\max_{j \in \{1, \dots, K\}} f_j(\boldsymbol{x})$.


    Assuming that $\boldsymbol{x}_0 \in \mathbb{R}^d$ is a natural example with the
    ground truth label $y_0 \in \{1, \dots, K\}$, a prediction-evasion attack will
    try to find a small perturbation $\boldsymbol{\Delta}$ such that $F(\boldsymbol{x}_0
    + \boldsymbol{\Delta}) \neq y_0$. The perturbed example $\boldsymbol{x}^* = \boldsymbol{x}_0
    + \boldsymbol{\Delta}$ is known as an *adversarial example*; this perturbed example
    is supposed to belong to class $y_0$ since $\boldsymbol{x}^*$ is only slightly
    perturbed from the original example $\boldsymbol{x}_0$, but the model will misclassify
    $\boldsymbol{x}^*$ as another label. The overall procedure is illustrated in Fig.
    2.2. The notion of “perturbation” can be generalized to other meaningful data
    manipulations beyond additive noises.


    *Untargeted v.s. targeted attack.* Multiple attack methods have been introduced
    for crafting adversarial examples to attack a machine learning model. In general,
    there are two kinds of “attack goals”, targeted and untargeted. For untargeted
    attack, the attack is successful if the input image is predicted with the wrong
    label. Take Fig. 2.2 as an example: as long as the bagel image is not classified
    as a bagel, the attack is considered successful. For'
  merge: -1
  img_proc: true
- pgno: 31
  md: '![](img/fa92deee3de0f00ea56e92ca0b92c8e4_31_0.png)


    Figure 2.2 The procedure of adversarial attacks.


    targeted attack, the attack is successful only when the adversarial example is
    classified as the target class. In this example, if the target class is piano,
    then the attack is considered successful only when the perturbed image on the
    right-hand side is labeled as piano by the victim classifier.


    # 2.2 Formulating attack as constrained optimization


    Given the original example x0, an adversarial attack aims to find an adversarial
    example x* = x0 + \Delta that can successfully achieve the attack goal (either
    targeted or untargeted attack) under the constraint that \Delta should be small.
    This can be formulated as a constrained optimization problem: we aim to find an
    adversarial example x that maximizes the "attack successfulness" (or minimizes
    the attacker’s loss function), whereas x is constrained to be close to the original
    example x0. This can be mathematically written as the following problem:


    ```

    argmax_x g(x) s.t. x \in B(x_0), (2.1)

    ```


    where g(x) measures the successfulness of the attack, and B(x0) is a small region
    around x0 indicating the feasible perturbation range.


    The definition of g(x) can be defined differently for different attacks. As described
    in Chapter 1, neural network training usually involves minimizing the cross-entropy
    (CE) loss, defined as the negative log-likelihood'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'of predicting label $y_0$:


    $\ell_{\text{CE}}(f(\boldsymbol{x}_0), y_0) := -\log P(y_0 \mid \boldsymbol{x}_0),
    \quad \text{where } P(y_0 \mid \boldsymbol{x}_0) := \frac{e^{f_{y_0}(\boldsymbol{x}_0)}}{\sum_{j=1}^K
    e^{f_j(\boldsymbol{x}_0)}}. \quad (2.2)$


    Here \(f_j(\boldsymbol{x}_0)\) is the class prediction score of class \(j\), and
    the prediction probability of class \(j\) is computed using a softmax operation
    for normalization. We can define the \(g(\boldsymbol{x})\) for adversarial attacks
    by slightly changing this loss function. For untargeted attack, the goal of “making
    model predicts another label” can be formulated as “minimizing the probability
    of predicting class \(y_0\)”. This can be naturally achieved by setting


    Untargeted CE loss: \(g(\boldsymbol{x}) := \ell_{\text{CE}}(f(\boldsymbol{x}),
    y_0). \quad (2.3)\)


    Since here we want to maximize \(g(\boldsymbol{x})\) instead of minimizing it,
    the perturbation will try to maximally increase the cross-entropy loss to achieve
    the worst prediction.


    For targeted attack, we aim to maximize the predicted probability of the target
    class \(t\). The attack successfulness can thus be defined as


    Targeted CE loss: \(g(\boldsymbol{x}) := -\ell_{\text{CE}}(f(\boldsymbol{x}),
    t), \quad (2.4)\)


    which is the log-likelihood of the target class probability.


    The constraint set \(B(\boldsymbol{x}_0)\) is usually defined as a small region
    around \(\boldsymbol{x}_0\). If the \(\ell_p\) norm is used for measuring distance,
    then we can define


    \(B(\boldsymbol{x}_0) = \{\boldsymbol{x} : \|\boldsymbol{x} - \boldsymbol{x}_0\|_p
    \le \epsilon\},\)


    where \(\epsilon\) is a predefined small constant, known as the perturbation threshold
    or budget. For example, on the CIFAR-10 image classification dataset (which is
    a standard benchmarking dataset for evaluating adversarial attacks), the \(\epsilon\)
    is often set as 8/255 (for \(\ell_\infty\) norm) when each pixel is in the range
    of [0, 255]. Note that for computer vision applications, we usually need to enforce
    an additional elementwise lower and upper bounds to ensure that the adversarial
    example \(\boldsymbol{x}\) is still a valid image, so the constraint set will
    become the intersection of \(\ell_p\) ball and \(\boldsymbol{x} \in [0, 255]^d\).
    For simplicity, we will omit this constraint in our derivations since they can
    often easily done by a simple elementwise projection to the feasible data space.


    Once we formulate an adversarial attack as a constraint optimization problem,
    any existing optimization algorithm can be used for solving this'
