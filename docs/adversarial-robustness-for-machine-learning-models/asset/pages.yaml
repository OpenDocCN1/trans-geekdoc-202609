    is paired with a unique linear classifier \(\phi_i\) to obtain the supervised
    prediction \(\phi_i \circ f\) (using cluster labels). The ensemble CE loss, given
    by the average of \(n\) individual losses, is then used in (17.12). The experiments
    by Fan et al. (2021) show that the ensemble version usually leads to better generalization
    ability.


    *Empirical comparison.* Following Fan et al. (2021), we consider three robustness
    evaluation metrics: (1) Auto-attack accuracy (**AA**), namely, classification
    accuracy over adversarially perturbed images via auto-attacks; (2) Robust accuracy
    (**RA**), namely, classification accuracy over adversarially perturbed images
    via PGD attacks; and (3) Standard accuracy (**SA**), namely, standard classification
    accuracy over benign images without perturbations. We use ResNet-18 for the encoder
    architecture of \(f_{\hat{\theta}}\) in CL. Unless specified otherwise, we use
    five-step \(\ell_\infty\) projected gradient descent (PGD) with \(\epsilon = 8/255\)
    to generate perturbations during pretraining and use auto-attack and 20-step \(\ell_\infty\)
    PGD with \(\epsilon = 8/255\) to generate perturbations in computing AA and RA
    at test time. We will compare ADVCL with the CL-based adversarial pretraining
    *baselines*, ACL (Jiang et al., 2020), RoCL (Kim et al., 2020), (non-CL) self-supervised
    adversarial learning baseline AP-DPE (Chen et al., 2020c), and the supervised
    AT baseline (Madry et al., 2018).


    *Overall performance from pretraining to finetuning (across tasks).* In Table
    17.2, we evaluate the robustness of a classifier (ResNet-18) finetuned over robust
    representations learned by different supervised/self-supervised pretraining approaches
    over CIFAR-10 and CIFAR-100. We focus on two representative finetuning schemes,
    the simplest standard linear finetuning (SLF) and the end-to-end adversarial full
    finetuning (AFF). As we can see, the proposed ADVCL method yields a substantial
    improvement over almost all baseline methods. Moreover, ADVCL simultaneously improves
    robustness and standard accuracy.'
