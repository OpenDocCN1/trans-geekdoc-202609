    Instead, C-examples are data-free and aim to achieve *high-robustness* for passing
    through pruned variants of the base model and *low-transferability* for screening
    out any other models different from the base model.


    Wang et al. (2021d) consider three types of DNN models that are of interest in
    C-examples. ① Base Model: the pretrained model to fulfill some designated task,
    such as image classification. ② Pruned Models: the models pruned from the base
    model and implemented on the edge devices for inference execution. ③ Other Models:
    any other models that are neither ① nor ②. For example, if VGG16 is the base model,
    then VGG19, the ResNet family, etc. all belong to other models. The proposed DNN
    fingerprinting framework is as follows: The ① base model is used to generate C-examples
    with labels. Therefore C-examples have 100% accuracy on the base model. Then C-examples
    are used as fingerprints to test the models implemented on edge devices. A high
    accuracy is expected if the implemented model is ②, whereas a low accuracy is
    expected if the implemented model is ③. A systematic illustration of the C-example
    generation process is shown in Fig. 20.2.


