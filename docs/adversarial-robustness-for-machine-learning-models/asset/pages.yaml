    function that maps the input example \(x\) to the leaf node of tree \(k\) according
    to the traversal rule of the tree. Given an input example \(x\), the tree ensemble
    will pass \(x\) to each of these \(K\) trees independently and reach \(K\) leaf
    nodes \(i^{(k)} = m^{(k)}(x)\) for \(k = 1, \dots, K\). Each leaf node will assign
    a prediction value \(v_{i^{(k)}}\). For simplicity, we start with the binary classification
    case, with original label of \(x\) being \(y_0 = -1\) and the goal (for adversary)
    is to turn the label into \(+1\). For binary classification, the prediction of
    the tree ensemble is computed by \(\text{sign}(\sum_{k=1}^K v_{i^{(k)}})\), which
    covers both GBDTs and random forests, two widely used tree ensemble models. Since
    \(x\) is assumed to have label \(y_0 = -1\), we know \(\text{sign}(\sum_k v_{i^{(k)}})
    < 0\) for \(x\), and our task is to verify whether the sign of the sum can be
    flipped within \(\text{Ball}(x, \epsilon)\).


    We consider the decision problem of robustness verification to verify whether
    there exists an adversarial perturbation within a small region. A naive analysis
    will need to check all the points in \(\text{Ball}(x, \epsilon)\), which is uncountably
    infinite. To reduce the search space to a finite one, the main idea is to represent
    the space by all the possible choices of leaf nodes of these \(K\) trees. More
    specifically, we let \(C = \{i^{(1)}, \dots, i^{(K)} | i^{(k)} \in S^{(k)} \forall
    k = 1, \dots, L\}\) to be all the possible tuples of leaf nodes, and let \(C(x)
    = [m^{(1)}(x), \dots, m^{(K)}(x)]\) be the function that maps \(x\) to the corresponding
    leaf nodes. Therefore a tuple \(C\) directly determines the model prediction \(\sum
    v_C := \sum_k v_{i^{(k)}}\), and the good thing is that this space only have finite
    (although exponentially many) of choices.


