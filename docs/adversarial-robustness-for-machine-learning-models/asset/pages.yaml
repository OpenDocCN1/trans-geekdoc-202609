- pgno: 17
  md: "# CHAPTER 1\n\n# Background and motivation\n\n# 1.1 What is adversarial machine\
    \ learning?\n\nAdversarial machine learning (AdvML) refers to the methodology\
    \ of introducing a virtual adversary for evaluating and improving the performance\
    \ of a machine learning (ML) system throughout its lifecycle of development and\
    \ deployment, ranging from training (e.g., data collection, model selection and\
    \ tuning, etc), model testing (e.g., vulnerability assessment, performance benchmarking,\
    \ etc), hardware implementation, and system integration to continuous system status\
    \ monitoring and updates.\n\nWe list two primary scientific and engineering goals\
    \ considered in AdvML:\n\n+   1. The practice of virtual adversary for proactive\
    \ risk evaluation to prevent or mitigate different kinds of failure modes of machine\
    \ learning systems when deployed in the real world. The failure modes include\
    \ natural changes such as domain shifts in data inputs and lacking generalization\
    \ to unseen or out-of-domain data, as well as potential adversarial threats (from\
    \ real adversary) such as training-phase and deployment-phase attacks aiming to\
    \ compromising machine learning algorithms and systems.\n+   \n+   2. The use\
    \ of virtual adversary to deliver new machine learning algorithms for performance\
    \ improvement. Comparing to standard ML without the notion of adversary, the interplay\
    \ between the model of interest and virtual adversary, either in cooperative or\
    \ competitive manner, can help developing more effective and robust machine learning\
    \ models and algorithms. One well-known example is the training of generative\
    \ adversarial network (GAN) (Goodfellow et al., 2014), which attains a high-quality\
    \ generator via introducing a discriminator.\n\nDespite the fact that the second\
    \ goal touches upon many related research topics associated with AdvML, such as\
    \ GANs, multiagent systems, and game-oriented learning, this book focuses on the\
    \ topics underlying adversarial robustness in machine learning algorithms and\
    \ systems. These topics cover both aforementioned goals and deliver important\
    \ insights to ML applications concerning safety, security, and reliability."
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Table 1.1 Commonly used mathematical symbols and their meanings.


    | Symbol | Meaning |

    | :--- | :--- |

    | $(x, y) \sim \mathcal{D}$ | data sample $\mathbf{x}$ and one-hot coded label
    $\mathbf{y}$ drawn from the data distribution $\mathcal{D}$ |

    | $K$ | number of classes in a classification task |

    | $\theta$ | parameters of a machine learning model |

    | $f_\theta : \mathbb{R}^d \mapsto [0, 1]^K$ (or $F_\theta$) | $K$-way classifier
    (e.g., a neural network parameterized by $\theta$) |

    | $\delta$ (or $\Delta$) | input perturbation |

    | $\epsilon$ | perturbation budget |

    | $\nabla_z J(\cdot)$ | gradient of a scalar function $J$ with respect to $z$
    |

    | $\mathcal{L}$ (or loss, $J$) | loss function |

    | $[K]$ | integer set $\{1, 2, ..., K\}$, where $K \ge 1$. |

    | $\|\mathbf{x}\|_p$ ($p \ge 1$) | vector $p$-norm of $\mathbf{x} = [x_1, ...,
    x_d]$, defined as $\|\mathbf{x}\|_p = \left( \sum_{i=1}^d |x_i|^p \right)^{1/p}$
    |

    | $\|\mathbf{x}\|_\infty$ | infinity norm of $\mathbf{x} = [x_1, ..., x_d]$, defined
    as $\|\mathbf{x}\|_\infty = \max_{i \in [d]} |x_i|$ |

    | sign$(\cdot)$ | elementwise sign operation; sign$(z) = 1$ if $z \ge 0$ and sign$(z)
    = -1$ otherwise. |


    # 1.2 Mathematical notations


    Throughout this book, unless specified otherwise, we will use the following convention
    for mathematical notations. Regular letters (e.g., $x$ or $X$) are used to denote
    scalars, index, or an element in a set. Bold-faced lowercase letters (e.g., $\mathbf{x}$)
    are used to denote column vectors. Bold-faced uppercase letters (e.g., $\mathbf{X}$)
    are used to denote matrices. Uppercase letters in calligraphic fonts (e.g., $\mathcal{X}$)
    are used to denote sets or probability distributions. All vectors and matrices
    are assumed to be real-valued. The subscript $x_i$ ($X_{ij}$) denotes the $i$th
    element (the element at the $i$th row and the $j$th column) of a vector $\mathbf{x}$
    (a matrix $\mathbf{X}$). $[\mathbf{x}]_i$ (or $x_i$) means the $j$th element of
    the vector $\mathbf{x}$. The notation $\mathbb{R}^d$ denotes the space of $d$-dimensional
    real-valued vectors. The notation $\cdot^T$ denotes the transpose of a vector
    or a matrix.


    Table 1.1 summarizes commonly used mathematical symbols and their meanings in
    this book. In each chapter the associated mathematical notations and their meanings
    will be formally defined. Depending on the context, the notation $f_\theta(\cdot)$
    (or $F_\theta(\cdot)$) for model output may refer to the top-1 (mostly likely)
    class based on the model prediction. Similarly, the notation $y$ may be used to
    denote the groundtruth class label of a data sample $\mathbf{x}$.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 1.3 Machine learning basics


    Machine learning is the methodology of teaching machines for problem/task solving
    based on the observable data (or the interaction with training environments) and
    the underlying computational/statistical learning mechanism. The learning component,
    also known as model training, involves a parameterized model whose parameters
    (or model weights) are updated by a designated loss function, measured by the
    available data or rewards from the training environment. The updates of the model
    parameters are often accomplished by gradient-based optimization algorithms such
    as stochastic gradient descent. Here “stochastic” means that in each iteration
    of the optimization process, a subset of data samples are sampled from the whole
    training dataset (i.e., a minibatch) for evaluating the loss and calculating the
    gradient with respect to the model parameters for updates. The science and engineering
    of machine learning have been a mainstream research field and dominant technology
    in artificial intelligence and computer science, with far-reaching applications
    to specific domains such as computer vision, natural language processing, policy
    learning, robot planning, speech processing, healthcare, data science, to name
    a few.


    Supervised machine learning is a major branch of machine learning, which uses
    a set of labeled training data samples \(\{\mathbf{x}_i, \mathbf{y}_i\}_{i=1}^n\)
    and a designated loss function \(\mathcal{L}\) for training the parameters \(\theta\)
    associated with a machine learning model \(f_\theta\). Most of the supervised
    learning methods follow the Empirical Risk Minimization (ERM) framework, where
    the model parameters \(\theta\) is obtained by solving the following optimization
    problem:


    ```

    \[ \min_{\theta} \frac{1}{n} \sum_{i=1}^n \mathcal{L}(f_\theta(\mathbf{x}_i),
    \mathbf{y}_i), \]

    ```


    where the loss function \(\mathcal{L}(\cdot, \cdot)\) measures how the model''s
    prediction fits the label. This optimization problem can be typically solved by
    Stochastic Gradient Descent (SGD) or other gradient-based optimizers such as Adagrad
    (Duchi et al., 2011) and Adam (Kingma and Ba, 2015). The loss function can be
    designed according to the application. Popular loss functions include the mean
    squared error (MSE) loss defined as \(\mathcal{L}_\text{MSE}(f_\theta(\mathbf{x}),
    \mathbf{y}) = \|f_\theta(\mathbf{x}) - \mathbf{y}\|_2^2\), and the cross entropy
    (CE) loss defined as \(\mathcal{L}_\text{CE}(f_\theta(\mathbf{x}), \mathbf{y})
    = - \sum_{k=1}^K [\mathbf{y}]_k \log[f_\theta(\mathbf{x})]_k\), where in the CE
    loss \(f_\theta\) outputs a vector and \(K\)-dimensional probability simplex such
    that \(f_\theta(\cdot)_k \in [0, 1]^K\) and \(\sum_{k=1}^K [f_\theta(\cdot)]_k
    = 1\).'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'Semisupervised machine learning refers to the problem setting of leveraging
    a labeled dataset (usually limited) and an unlabeled dataset (usually abundant)
    for machine learning. Unsupervised machine learning means learning representations
    of the data inputs without using any data labels. In particular, self-supervised
    machine learning uses self-generated pseudo-labels or tasks for learning good
    representations. For unsupervised or self-supervised machine learning schemes,
    the practice is to follow the strategy of pretraining (on a large unlabeled dataset)
    and fine-tuning (on a task-specific labeled dataset). Transfer learning refers
    to fine-tuning a task-specific model trained in a source domain to solve a related
    task in a target domain using the labeled target-domain data.


    Scope of this book. Most of the considered machine learning tasks and models in
    this book are within the scope of supervised machine learning, such that the goal
    of the adversary can be defined in a straightforward manner. Nonetheless, the
    methodology can be extended to unsupervised or self-supervised machine learning
    settings, as discussed in Chapter 21. In this book, the studied machine learning
    model, task, and loss function will be introduced and clearly defined in each
    chapter; we defer the readers interested in the in-depth background of machine
    learning to seminal books such as (Bishop, 2006).


    Neural networks. A neural network is the default machine learning model in deep
    learning (LeCun et al., 2015), a powerful and high-capacity tool for representation
    learning. Deep neural networks (DNNs) have achieved state-of-the-art performance
    in many machine learning tasks. In general, neural networks perform a set of layered
    operations on data inputs, in either sequential or recurrent manner, with layers
    of trainable parameters (mostly linear or convolutional transformations), nonlinear
    activation functions, or dimension reduction through max/average pooling. The
    fact that neural networks can be “deep” means that a large number of such layers
    can constitute a high-capacity machine learning model with a strong expressive
    power of data representations and function approximations. With sufficient training
    data and compute power, neural networks are capable of capturing the complex relationship
    between data samples and associated labels, as well as learning generalizable
    representations for different data modalities. In this book, we will primary focus
    on the adversarial robustness of neural networks because they are state-of-the-art
    machine learning models. Nonetheless, the methodology naturally applies to other
    machine learning models such as support vector machines, random forests, gradient-boosted
    trees, etc. In fact, the black-box adversarial attacks introduced in Chapter 3'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'are agnostic to the underlying machine learning model used for classification.
    The necessary details of the studied neural networks will be given in the corresponding
    chapters.


    *Commonly used datasets.* Below we summarize some commonly used datasets for image
    classification.


    +   * MNIST (LeCun et al., 1998): The MNIST database (Modified National Institute
    of Standards and Technology database) is a large database of handwritten digits
