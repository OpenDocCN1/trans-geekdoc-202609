    ing data, especially for privacy-sensitive tasks (Smith et al., 2017; McMahan
    et al., 2017; Zhao et al., 2018). Utilizing local training data of participants
    (i.e., parties), FL helps train a shared global model with improved performance.
    There have been prominent applications and ever-growing trends in deploying FL
    in practice, such as loan status prediction, health situation assessment (e.g.,
    potential cancer risk assessment), and next-word prediction while typing (Hard
    et al., 2018; Yang et al., 2018, 2019a).


    Although FL is capable of aggregating dispersed (and often restricted) information
    provided by different parties to train a better model, its distributed learning
    methodology and inherently heterogeneous (i.e., non-i.i.d.) data distribution
    across different parties may unintentionally provide a venue to new attacks. In
    particular, the fact of limiting access to individual party data due to privacy
    concerns or regulation constraints may facilitate backdoor attacks on the shared
    model trained with FL.


    Backdoor attacks on FL have been studied in (Bagdasaryan et al., 2018; Bhagoji
    et al., 2019). However, these attacks do not fully exploit the distributed learning
    methodology of FL, as they embed the *same* global trigger pattern to all adversarial
    parties. This attacking scheme is referred to as the *centralized* backdoor attack.
    Leveraging the power of FL in aggregating dispersed information from local parties
    to train a shared model, Xie et al. (2020) propose *distributed backdoor attack*
    (DBA) against FL. Given the same global trigger pattern as the centralized attack,
    DBA decomposes it into local patterns and embed them to different adversarial
    parties respectively. A schematic comparison between the centralized and distributed
    backdoor attacks is illustrated in Fig. 5.2.'
