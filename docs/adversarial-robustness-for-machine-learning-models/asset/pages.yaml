    gradient descent/ascent algorithm following


    ```

    $$ \mathbf{x}_{t+1} \leftarrow \Pi(\mathbf{x}_t - \alpha \cdot \mathbf{g}(\mathbf{x}_t)),
    $$ (3.6)

    ```


    where $t$ denotes the iteration index, $\Pi$ denotes the project operations (e.g.,
    projection to $[0, 1]^d$), and $\alpha$ denotes the step size. The choices in
    gradient estimators and the type of gradient-based optimization solvers (e.g.,
    PGD, Adam or Momentum-SGD) will lead to different black-box attack algorithms.


    # ## 3.3 Hard-label black-box attack


    Hard-label black-box attacks assume the most information-restricted setting that
    only the top-1 class prediction (but not the scores) is observable to an attacker.
    In this setting, the naive attack objective in (3.1) will be ill-defined so one
    cannot directly extend white-box or soft-label black-box attacks to the hard-label
    setting. If we replace $f_\theta(\mathbf{x})$ by the hard-label prediction in
    (3.1), the objective function will be a discrete step function; we can observe
    small perturbation either doesn''t affect the objective function value (when the
    prediction label is unchanged) or result in a discrete change to the objective
    function value (when the prediction label is changed). Therefore, zeroth order
    optimization attacks used in the soft-label black-box setting cannot be easily
    applied. Despite the above-mentioned difficulty, it has been shown that by carefully
    reformulating the attack objective function, zeroth-order optimization principles
    can still be applied by spending extra queries to explore local loss landscapes
    for gradient estimation (Cheng et al., 2019a, 2020c; Chen et al., 2020a).


    For a given example $\mathbf{x}_0$, true label $t_0$, and the hard-label black-box
    function $f_\theta : \mathbb{R}^d \to \{1, \dots, K\}$, we define our objective
    function $h : \mathbb{R}^d \to \mathbb{R}$ depending on the type of attack:


    ```

    Untargeted attack: $h(\mathbf{s}) = \min_{\lambda > 0} \lambda \quad \text{s.t.}
    \quad f_\theta \left( \mathbf{x}_0 + \lambda \frac{\mathbf{s}}{\|\mathbf{s}\|}
    \right) \neq t_0.$ (3.7)

    ```'
