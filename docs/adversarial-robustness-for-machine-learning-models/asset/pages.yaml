- pgno: 171
  md: '# Adversarial robustness of beyond neural network models


    Adversarial robustness of neural network models have been extensively studied,
    and up to this chapter we were mainly discussing attack, defense and verification
    for neural networks. Many other continuous machine learning models, such as support
    vector machines (SVM) or logistic regression models, can be viewed as a special
    kind of neural networks, so that most of the techniques developed for neural networks
    can be immediately applied. However, there are many other important machine learning
    models that involve some “discrete” components, and the studies on neural networks
    cannot be directly extended to those models. For example, K-nearest neighbor (KNN)
    is a very important fundamental machine learning model, where prediction is made
    based on one or few closest samples in the training dataset. The decision boundary
    of KNN can be visualized as in Fig. 16.1, which is nonsmooth and nondifferentiable.
    Also, a decision tree or decision forest (an ensemble of multiple decision trees)
    makes discrete decisions based on some cut-offs of feature values, so its decision
    function is discrete rather than continuous. Due to the discrete properties of
    those models, we need different ways for attack, verification, and defense.


    In this chapter, we discuss how to evaluate and improve the robustness of two
    important discrete nonneural network models: K-nearest-neighbor (KNN) classifiers
    and decision tree ensembles, including gradient boosting decision tree (GBDT)
    and random forest (RF) models. In general, we will show that measuring the robustness
    of these models can be formulated as optimization problems, similar to neural
    networks, despite the fact that those optimization problems involve discrete variables.
    We will then show that attacking those models is equivalent to finding a primal
    feasible solution to the optimization problem, whereas robustness verification
    is equivalent to finding a dual solution to give a lower bound of those optimization
    problems. We will also discuss how to enhance the robustness of those discrete
    models.


    Before going to detail, we would like to emphasize that there are several good
    reasons to study the robustness of those discrete machine learning models, as
    listed below:'
  merge: -1
  img_proc: true
- pgno: 172
  md: '+   1. Although neural networks are good at extracting informative features
    from images/audio/text, there are many other applications where neural networks
    may not outperform other classical machine learning models. In particular, the
    gradient boosting decision tree (GBDT) model is more widely used than neural networks
    in many data mining tasks. Many Kaggle data mining competitions are won by GBDT
    models, and GBDT is still widely used in ranking systems in industry. Hence it
    is important to understand how to measure and improve the robustness of these
    discrete models.


    +   2. Discrete structures may be more robust than neural networks since the discrete
    operations are less sensitive to small perturbations. Several practical defense
    approaches have combined nearest-neighbor classifier with neural networks (Papernot
    and McDaniel, 2018; Dubey et al., 2019; Sitawarin and Wagner, 2019). Studying
    the robustness of discrete models is thus essential for understanding whether
    they can provide improved robustness.


    # ## 16.1 Evaluating the robustness of K-nearest-neighbor models


    Nearest-neighbor (NN) classifiers predict the label of a testing instance by one
    or _K_ closest samples in the database. Assume that there are _C_ labels in total.
    We use \(\{(\mathbf{x}_1, y_1), \dots, (\mathbf{x}_n, y_n)\}\) to denote the database
    where each \(\mathbf{x}_i\) is a _d_-dimensional vector, and \(y_i \in \{1, \dots,
    C\}\) is the corresponding label. A _K_-NN classifier \(f : \mathbb{R}^d \rightarrow
    \{1, \dots, C\}\) maps a test instance to a predicted label. Given a test instance
    \(\mathbf{z} \in \mathbb{R}^d\), the classifier first identifies the _K_-nearest
    neighbors \(\{\mathbf{x}_{\pi(1)}, \dots, \mathbf{x}_{\pi(K)}\}\) based on the
    Euclidean distance \(\|\mathbf{x}_i - \mathbf{z}\|\) and then predicts the final
    label by majority voting among \(\{y_{\pi(1)}, \dots, y_{\pi(K)}\}\).


    Given a test sample **_z_**, assume that it is correctly classified as class-1
    by the NN model. An adversarial perturbation is defined as \(\boldsymbol{\delta}
    \in \mathbb{R}^d\) such that \(f(\mathbf{z} + \boldsymbol{\delta}) \neq 1\). Robustness
    evaluation aims to find the minimum-norm adversarial perturbation


    ```

    \(\boldsymbol{\delta}^* = \arg \min_{\boldsymbol{\delta}} \|\boldsymbol{\delta}\|
    \text{ s.t. } f(\mathbf{z} + \boldsymbol{\delta}) \neq 1, \quad \text{(16.1)}\)

    ```


    and we define \(\epsilon^* = \|\boldsymbol{\delta}^*\|\) as the norm of this perturbation.
    In many cases it is challenging to obtain the optimal solution of (16.1), so we
    will discuss algorithms for attack and verification. Attack algorithms aim to
    find a feasible (but may be subpotimal) solution \(\boldsymbol{\delta}\) for (16.1),
    which serves as an'
  merge: -1
  img_proc: true
- pgno: 173
