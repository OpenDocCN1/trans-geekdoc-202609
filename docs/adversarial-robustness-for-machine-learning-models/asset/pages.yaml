  md: "# CHAPTER 4\n\n# Physical adversarial attacks\n\nBeyond digital space, adversarial\
    \ examples can also be realized in physical world to evade the prediction of machine\
    \ learning–based applications such as object detection, known as physical adversarial\
    \ examples. In this chapter, we cover the attack formulation for physical adversarial\
    \ examples and provide an overview of such attacks in the physical world.\n\n\
    # 4.1 Physical adversarial attack formulation\n\nPhysical adversarial examples\
    \ are often realized as robust adversarial examples crafted from digital spaces\
    \ (e.g., simulated physical environments) that remain the adversarial objective\
    \ in the physical space. To bridge the gap between adversarial examples in digital\
    \ and physical spaces, there are two major obstacles: (i) The digital adversarial\
    \ examples cannot be precisely realized in the physical space. For example, some\
    \ RGB color values in the digital space cannot be printed exactly. (ii) Digital\
    \ adversarial examples may not well generalize to physical environments. For example,\
    \ simple rotation or zooming in and out a printed adversarial image may make the\
    \ adversarial effect in vain.\n\nTo address challenge (i), during the attack process,\
    \ we can project the digital adversarial examples to the space of realizable actions\
    \ in the physical space (e.g., the space of printable colors) or add an additional\
    \ regularization loss in the attack loss to minimize inconsistency between the\
    \ digital adversarial examples and the resulting physical versions.\n\nTo address\
    \ challenge (ii), a common practice is to introduce multiple transformations during\
    \ the generation process such that the resulting adversarial example will remain\
    \ effective. The methodology can also be thought as learning a universal adversarial\
    \ manipulation that is simultaneously effective to most of (if not all) considered\
    \ transformations.\n\nExpectation over transformation (EOT) (Athalye and Sutskever,\
    \ 2018) introduces a set of data transformations denoted by $\\mathcal{T}$ in\
    \ generating a robust adversarial example $\\mathbf{x}$ of a data sample $\\mathbf{x}_0$\
    \ via solving the following optimization problem:\n\n```\n$\\underset{\\mathbf{x}\
    \ \\in \\mathcal{X}}{\\text{argmin}}\\ \\mathbb{E}_{t \\sim \\mathcal{T}} g(t(\\\
    mathbf{x})) + r(\\mathbf{x}),$  \n(4.1)\n```"
  merge: -1
  img_proc: true
- pgno: 62
  md: 'where $\mathcal{X}$ is the space of feasible physical adversarial examples,
    $t$ is a transformation function drawn from $\mathcal{T}$, $g$ is the attack objective
    loss function as introduced in Chapter 2, and $r$ is the regularizer (e.g., a
    penalty function on unrealizable printing colors).


    The optimization objective of EOT attack can be viewed as minimizing the average
    loss over all data transformations in $\mathcal{T}$. Instead of minimizing the
    average loss, Wang et al. (2021a) proposed a MinMax attack formulation that optimizes
    the worst-case transformation loss through


    $\min_{\boldsymbol{x}\in\mathcal{X}} \max_{\boldsymbol{w}\in\mathcal{P}} \sum_{i=1}^K
    w_i \cdot g(t_i(\boldsymbol{x})) - \gamma \|\boldsymbol{w} - \mathbf{1}/K\|_2^2
    + r(\boldsymbol{x}), \quad (4.2)$


    where $K$ is the number of transformations in $\mathcal{T}$, $\boldsymbol{w}$
    is a nonnegative $K$-dimensional vector in the probability simplex $\mathcal{P}$
    satisfying $\sum_{i=1}^K w_i = 1$, $t_i$ is the $i$th transformation with $w_i$
    being its weighting factor, $\mathbf{1}/K$ is a uniform vector, and $\gamma \ge
    0$ is a regularization coefficient. If $\boldsymbol{w} = \mathbf{1}/K$, then problem
    (4.2) reduces to the existing EOT formulation. Using the alternating one-step
    projected gradient descent–ascent (APGDA) algorithm for solving (4.2), it is shown
    by Wang et al. (2021a) that MinMax attack leads to more robust adversarial examples
    against multiple data transformations than EOT. MinMax attack also offers some
    interpretation on the difficulty level of each transformation through the associated
    learned weighting factor $\{w_i\}_{i=1}^K$ while solving the min–max optimization
    problem. It is also used by Xu et al. (2020c) in the design of physical adversarial
    T-shirts that are robust to nonrigid deformations.


    # 4.2 Examples of physical adversarial attacks


    Here we list some studies into crafting physical adversarial examples in different
    scenarios. Some of the physical adversarial examples are shown in Fig. 4.1.


    +   Adversarial photo (Kurakin et al., 2016): Demonstration that when feeding
    adversarial images obtained from cell-phone camera to an ImageNet Inception classifier,
    a large fraction of adversarial examples are classified incorrectly even when
    perceived through the camera.


    +   Adversarial eyeglasses (Sharif et al., 2016): Realization through printing
    a pair of eyeglass frames such that when worn by the attacker whose image is supplied
    to a face-recognition algorithm, the eyeglasses allow her to evade being recognized
    or to impersonate another individual.'
