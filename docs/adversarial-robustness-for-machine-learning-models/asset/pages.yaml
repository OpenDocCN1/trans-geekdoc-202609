  md: 'then a set of \(\eta\)-optimal C-examples \(X^*\) can be characterized as


    ```

    \(X^* = \left\{ (\mathbf{x}, l) | \text{Loss}_\theta(\mathbf{x}, l) < \eta, \mathbf{x}
    \in [0, 1]^n \right\}.\) (20.6)

    ```


    The term \(\text{Loss}_\theta\) denotes the loss function of \(F_\theta\). A C-example
    \(\mathbf{x}\) minimizing the loss for a specified label \(l\) should satisfy
    the above constraint. To be independent of data when extracting the base model
    features, we simply use a random seed to generate a C-example, and therefore the
    generated C-examples are distinct from natural images for the human perception.
    A vanilla version C-example is shown in Fig. 20.3(a).


    ![](img/fa92deee3de0f00ea56e92ca0b92c8e4_248_0.png)


    Figure 20.3 Characteristic examples visualized using different generation processes.
    The label assigned to all these image is “strawberry”.


    We can use the projected gradient descent (PGD) algorithm as introduced in Chapter
    3 to find C-examples. The C-example generation problem (20.6) can be solved with
    the PGD algorithm as follows:


    ```

    \(\mathbf{x}^{t+1} = \mathbf{Clip} \left( \mathbf{x}^t - \alpha \cdot \text{sign}(\nabla_{\mathbf{x}}
    \text{Loss}_\theta(\mathbf{x}^t, l)) \right),\) (20.7)

    ```


    where \(t\) is the iteration step index, \(\mathbf{x}^0\) is the random starting
    point, \(\alpha\) is the step size, sign returns the elementwise sign of a vector,
    \(\nabla_{\mathbf{x}}\) calculates input gradients, and \(\mathbf{Clip}\) denotes
    the clipping operation to satisfy the \(\mathbf{x} \in [0, 1]^n\) constraint.


    **Robust C-examples.** Wang et al. (2021d) further propose an enhancement named
    Robust C-examples (RC-examples) over the vanilla C-examples, by adding noise bounded
    by \(\epsilon\) to the neural network parameters \(\theta\) to mimic the model
    weight perturbation due to the model compression procedure. Here the loss is changed
    to \(\text{Loss}_{\theta+\Delta}\), where \(\Delta\) presents the uniformly distributed
    weight perturbations within \([-\epsilon, \epsilon]\). Moreover, motivated by
    the expectation-over-transformation (EOT) method, (Athalye et al., 2018) toward
    stronger adversarial attacks (see Chapter 4 for details for EOT attack), the proposed
    RC-examples can be further enhanced by calculating the mean of the input gradients
