    *Contrastive view from adversarial example.* The methods proposed by Jiang et
    al. (2020), Kim et al. (2020), and Gowal et al. (2021) can be explained based
    on (17.6): an adversarial perturbation $\delta$ with respect to each view of a
    sample $x$ is generated by maximizing the contrastive loss:


    ```

    $$\delta_1^*, \delta_2^* = \underset{||\delta_i||_\infty \le \varepsilon}{\text{argmax}}
    \ell_{\text{CL}}(\tau_1(x) + \delta_1, \tau_2(x) + \delta_2). \quad (17.8)$$

    ```


    A solution to problem (17.8) eventually yields a *paired perturbation view* $(\tau_1(x)
    + \delta_1^*, \tau_2(x) + \delta_2^*)$. However, the definition of adversarial
    view (17.8) used by Jiang et al. (2020), Kim et al. (2020), and Gowal et al. (2021)
    may not be proper. First, standard CL commonly uses *aggressive data transformation*
    that treats small portions of images as positive samples of the full image (Purushwalkam
    and Gupta, 2020). Despite its benefit to promoting generalization, crafting perturbations
    over such aggressive data transformations may not be suitable for defending adversarial
    attacks applied to *full* images in the adversarial context. Thus a new adversarial
    view built upon $x$ rather than $\tau_i(x)$ is desired. Second, the contrastive
    loss (17.6) is only restricted to two views of the same data. As will be evident
    later, the multiview contrastive loss is also needed when taking into account
    multiple robustness-promoting views. Spurred by above, we define the *adversarial
    view* over $x$ without modifying the existing data augmentations $(\tau_1(x),
    \tau_2(x))$. This leads to the following adversarial perturbation generator by
    maximizing a three-view contrastive loss


    ```

    $$\delta^* = \underset{||\delta|| \le \varepsilon}{\text{argmax}} \ell_{\text{CL}}(\tau_1(x),
    \tau_2(x), x + \delta), \quad (17.9)$$

    ```


    where $x + \delta^*$ is regarded as the third view of $x$.


    *Contrastive view from high-frequency component.* Next, we use the high-frequency
    component (HFC) of data as another additional contrastive view. The rationale
    arises from the facts that 1) learning over HFC of data is a main cause of achieving
    superior generalization ability (Wang et al., 2020b) and 2) an adversary typically
    concentrates on HFC when manipulating an example to fool model decision (Wang
    et al., 2020f). Let $\mathcal{F}$ and $\mathcal{F}^{-1}$ denote the Fourier transformation
    and its inverse. An input image $x$ can then be decomposed into its HFC $x_h$
    and low-frequency component (LFC) $x_l$:


    ```

    $$x_h = \mathcal{F}^{-1}(q_h), \quad x_l = \mathcal{F}^{-1}(q_l), \quad [q_h,
    q_l] = \mathcal{F}(x). \quad (17.10)$$

    ```'
