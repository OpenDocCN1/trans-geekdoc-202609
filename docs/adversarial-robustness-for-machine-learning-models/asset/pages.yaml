    # 19.2 Contrastive explanations with monotonic attribute functions


    Luss et al. (2021) address some limitations of the original CEM proposed by Dhurandhar
    et al. (2018). To identify PNs, addition is easy to define for grayscale images,
    where a pixel with zero value indicates no information, and so increasing its
