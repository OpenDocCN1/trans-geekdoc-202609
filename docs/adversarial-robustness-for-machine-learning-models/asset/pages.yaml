    MINE-based MinMax algorithm. Here we introduce a unified MinMax algorithm for
    solving the aforementioned supervised and unsupervised attack formulations. Its
    algorithmic convergence proof is given in (Hsu et al., 2022). For simplicity,
    we will use \( f_x \) to denote the attack criterion for \( f_x^{\text{sup}} \)
    or \( f_x^{\text{unsup}} \). Without loss of generality, we will analyze the supervised
    attack objective of maximizing \( I_\Theta \) with constraints. The analysis also
    holds for the unsupervised case since minimizing \( I_\Theta \) is equivalent
    to maximizing \( I''_\Theta \), where \( I''_\Theta = -I_\Theta \).


    The attack generation via MINE can be reformulated as the following MinMax optimization
    problem with simple convex set constraints:


    \(\text{Min}_{\delta: x+\delta \in [0,1]^d, \delta \in [-\epsilon, \epsilon]^d}
    \text{Max}_{c \ge 0} J(\delta, c) \triangleq c \cdot f_x^+(x + \delta) - I_\Theta(x,
    x + \delta). \quad (21.4)\)


    The outer minimization problem finds the best perturbation \(\delta\) with data
    and perturbation feasibility constraints \( x + \delta \in [0, 1]^d \) and \(
    \delta \in [-\epsilon, \epsilon]^d \), which are both convex sets with known analytical
    projection functions. The inner maximization associates a variable \( c \ge 0
    \) with the original attack criterion \( f_x(x + \delta) \le 0 \), where \( c
    \) is multiplied by the ReLU activation function of \( f_x \), denoted as \( f_x^+(x
    + \delta) = \text{ReLU}(f_x(x + \delta)) = \max\{f_x(x + \delta), 0\} \). The
    use of \( f_x^+ \) means that when the attack criterion is not met (i.e., \( f_x(x
    + \delta) > 0 \)), the loss term \( c \cdot f_x^+(x + \delta) \) will appear in
    the objective function \( F \). On the other hand, if the attack criterion is
    met (i.e., \( f_x(x + \delta) \le 0 \)), then \( c \cdot f_x^+(x + \delta) = 0
    \), and the objective function \( F \) only contains the similarity loss term
    \( -I_\Theta(x, x + \delta) \). Therefore the design of \( f_x^+ \) balances the
    tradeoff between the two loss terms associated with attack success and MINE-based
    similarity. Hsu et al. (2022) propose to use alternative projected gradient descent
    between the inner and outer steps to solve the MinMax attack problem, which is
    summarized in Algorithm 7. The parameters \( \alpha \) and \( \beta \) denote
    the step sizes of the minimization and maximization steps, respectively. The gradient
    \( \nabla f_x^+(x + \delta) \) with respect to \( \delta \) is set to be 0 when
    \( f_x(x + \delta) \le 0 \). The MinMax algorithm returns the successful adversarial
    example \( x + \delta^* \) with the best MINE value \( I_\Theta^*(x, x + \delta^*)
    \) over \( T \) iterations.


