    the regularizer term is defined as


    $$J(x|\theta, y) = J_{\text{cross-entropy}}(x|\theta, y) + \lambda J_{\text{embedding}}(x|\theta,
    y), \quad (20.1)$$


    where $\theta$ denotes the model''s parameters, $x$ is an input sample, $y$ is
    the ground truth label for input sample $x$, $J_{\text{cross-entropy}}$ is the
