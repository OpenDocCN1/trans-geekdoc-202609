  md: '# CHAPTER 5


    # Training-time adversarial attacks


    Aforementioned attacks in this part focus on evasion attacks targeting on an already
    trained and fixed model at the testing/deployment phase. Here we shift our focus
    to training-phase attacks. Training-phase attacks assume the ability to modify
    the training data to achieve malicious attempts on the resulting model when trained
    on the manipulated datasets, which can be realized through noisy data collection
    such as crowdsourcing. Specifically, the memorization effect of deep learning
    models (Zhang et al., 2017; Carlini et al., 2019b) can be leveraged as vulnerabilities.
    We note that sometimes the term “data poisoning” entails both poisoning and backdoor
    attacks though their attack objectives are different. In this chapter, (data)
    poisoning attack has a specific goal of degrading the generalization of a target
    model, such that the model trained on the poisoned training dataset will fail
    to generalize well on the clean testing dataset (e.g., having high training accuracy
    but low testing accuracy). On the other hand, a backdoored model tends to behave
    like a normal (nonbackdoored) model when the embedded trigger patter is absent;
    when the trigger is present, the backdoored model will give a designed output
    by the adversary regardless of the actual contents of any data inputs.


    # 5.1 Poisoning attack


    Poisoning attack aims to design a poisoned dataset $D_{poison}$ such that models
    trained on $D_{poison}$ will fail to generalize on a standard test set $D_{test}$.
    The poisoned dataset $D_{poison}$ can be created by modifying the original training
    dataset $D_{train}$, such as label flipping, data addition/deletion, and feature
    modification. The rationale is training on $D_{poison}$ will land on a “bad” local
    minimum of model parameters in the loss landscape. Take classification task as
    an example, letting $f_\theta$ be the classifier trained on a poisoned dataset,
    which gives the most-likely class prediction. Data poisoning aims to lead the
    classifier to give a wrong prediction on most of test data samples (but the model
    still has relatively good accuracy on the training dataset) such that $f_\theta(x_{test})
    \neq y_{test}$, where $(x_{test}, y_{test}) \sim D_{test}$.


    In general, a poisoning attack can be realized by adding a poisoned dataset $D_{poison}$
    to the existing training dataset $D_{train}$ and by solving the fol-'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'lowing bilevel optimization problem:


    Maximize \(\mathcal{L}_{\text{attack}}(D''; \theta^*)\) such that \(\theta^* \in
    \text{argmin}_{\theta} \mathcal{L}_{\text{train}}(D_{\text{train}} \cup D_{\text{poison}};
    \theta)\), (5.1)


    where \(\mathcal{L}_{\text{attack}}\) is the attacker''s designed objective function
    (higher is better for the attacker), \(D''\) is an untrained (hold-out) dataset
    for attack performance evaluation, and \(\theta^*\) is the model parameters obtained
    by minimizing a standard training loss function \(\mathcal{L}_{\text{train}}\)
    on the augmented poisoned dataset denoted by \(D_{\text{train}} \cup D_{\text{poison}}\).
    The attacker''s objective function can be as simple as the training loss; for
    example, \(\mathcal{L}_{\text{attack}}\) can be the cross entropy loss.


    To control the amount of data modification and reduce the overall accuracy on
    \(D_{\text{test}}\) (i.e., test accuracy), poisoning attack often assumes the
    knowledge of target model and its training method (Jagielski et al., 2018). Liu
    et al. (2020b) propose black-box poisoning with additional conditions on the training
    loss function. Targeted poisoning attack aims at manipulating the prediction of
    a subset of data samples in \(D_{\text{test}}\), which can be accomplished by
    clean-label poisoning (small perturbations to a subset of \(D_{\text{train}}\)
    while keeping their labels intact) (Shafahi et al., 2018; Zhu et al., 2019b) or
    gradient-matching poisoning (Geiping et al., 2021).


    # 5.2 Backdoor attack


    Backdoor attack is also known as Trojan attack. The central idea is to embed a
    universal trigger \(\Delta\) to a subset of data samples in \(D_{\text{train}}\)
    with a modified target label \(t\) (Gu et al., 2019). Examples of trigger patterns
    are a small patch in images and a specific text string in sentences. Typically,
    backdoor attack only assumes access to the training data and does not assume the
    knowledge of the model and its training. The model \(f_\theta\) trained on the
    tampered data is called a backdoored (Trojan) model. Its attack objective has
    two folds: (i) High standard accuracy in the absence of trigger – the backdoored
    model should behave like a normal model (same model trained on untampered data),
    i.e., \(f_\theta(x_{\text{test}}) = y_{\text{test}}\); (ii) High attack success
    rate in the presence of trigger – the backdoored model will predict any data input
    with the trigger as the target label \(t\), i.e., \(f_\theta(x_{\text{test}} +
    \Delta) = t\). Therefore backdoor attack is stealthy and insidious. The trigger
    pattern can also be made input-aware and dynamic (Nguyen and Tran, 2020).'
