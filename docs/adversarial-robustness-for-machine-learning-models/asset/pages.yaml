    # 5.3 Empirical comparison


    We follow the procedures in (Gu et al., 2019) to implement backdoor attacks and
    obtain two independently backdoored models trained on the same manipulated training
    data (models I and II). The trigger pattern is placed at the right-bottom of the
    poisoned images as shown in Fig. 5.1. Specifically, 10% of the training data are
    backdoored by inserting the trigger and changing the original correct labels to
    the target label(s). Here we investigate two kinds of backdoor attacks: (a) single–target
    attack that sets the target label t to a specific label (we choose t = class 1);
    and (b) all-targets attack where the target label t is set to the original label
    i plus 1 and then modulo 9, i.e., T = i + 1 (mod 9).


    Their performance on clean (untriggered) and triggered data samples are given
    in Table 5.1. The backdoored models have similar performance on clean data as
    untampered models but will indeed misclassify a majority of triggered samples.
    Comparing to single-target attack, all-targets attack is more difficult and has
    a higher attack failure rate, since the target labels vary with the original labels.


    # 5.4 Case study: distributed backdoor attacks on federated learning


    Federated learning (FL) has been recently proposed to address the problems for
    training machine learning models without direct access to diverse train-'
