    # 15.2 Detecting adversarial audio inputs


    In general, detecting adversarial examples can be a challenging task. Many detection
    methods have been shown to be weakened or bypassed by advanced adversarial attacks
    that are aware of the defenses in place (Carlini and Wagner, 2017a).


    However, in some data domains, we can leverage specific domain knowledge and data
    characteristics to detect adversarial inputs. In particular, for audio data inputs,
    Yang et al. (2019c) reveal the importance of using the temporal dependency in
    audio data to gain discriminate power against adversarial examples. Testing the
    automatic speech recognition (ASR) tasks and three recent audio adversarial attacks,
    they find that (i) input transformation developed from image adversarial defense
    provides limited robustness improvement and is subtle to advanced attacks and
    (ii) temporal dependency can be exploited to gain discriminative power against
    audio adversarial examples and is resistant to the considered adaptive attacks.


    For (i), Yang et al. (2019c) show that four implemented transformation techniques
    on audio inputs, including waveform quantization, temporal smoothing, down-sampling,
    and autoencoder reformation, provide limited robustness improvement against the
    adaptive white-box attack proposed by Athalye et al. (2018), which aims to circumvent
    the gradient obfuscation issue incurred by input transformations.'
