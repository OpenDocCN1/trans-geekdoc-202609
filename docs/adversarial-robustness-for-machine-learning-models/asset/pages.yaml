    of \(\theta\) and _x_ will speedup the convergence since we make more updates
    to \(\theta\). At each time, when we find a perturbation (with one PGD step),
    we immediately update \(\theta\) to make it performs better on this adversarial
    example. The resulting algorithm, also known as Free Adversarial Training proposed
    by Shafahi et al. (2019), thus requires less inner steps to converge to a competitive
    robust model as standard adversarial training. The algorithm of Free Adversarial
    Training is described in Algorithm 4.


