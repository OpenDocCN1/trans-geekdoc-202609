- pgno: 91
  md: 'this field (Katz et al., 2017; Julian et al., 2019), and several other practical
    systems are also considered in the previous verification work such as a LiDAR
    object detection system (Sun et al., 2019a), a perception network for automated
    driving (Cheng, 2019), and a fuel injecting system (Wong et al., 2020b). Taking
    the ACAS Xu system as an example, it contains 45 neural networks with hundreds
    of neurons, and the goal is to verify whether these networks satisfy some predefined
    safety specifications for collision avoidance.


    # Natural language processing


    The robustness of natural language models have become an important problem in
    natural language processing. It has been shown that semantic preserved perturbations
    (e.g., replacing a word by its synonym) can alter the model''s prediction in many
    NLP tasks. Certified defense methods have been applied in (Jia et al., 2019; Huang
    et al., 2019) by using neural network verification methods and extending to the
    discrete perturbation setting.


    # Machine learning interpretability


    Neural network verification is also an important tool for understanding the model''s
    behavior. For instance, many feature-based explanations (Hsieh et al., 2020) are
    based on the sensitivity of models – how much perturbation to a feature can change
    the model''s prediction – which can be easily answered by verification tools.
    Also, verification methods can be used to find an important set of features as
    well as identifying unimportant features that are provably having no effect on
    the model.


    # 7.4 Extended reading


    +   - A survey on neural network verification in (Liu et al., 2019a) gives an
    overview on both incomplete and complete verifications.

    +   - The International Verification of Neural Network Competition (VNN-Comp)
    that takes place each year has been a place for teams demonstrating state-of-the-art
    tools on neural network verification on various problems.'
