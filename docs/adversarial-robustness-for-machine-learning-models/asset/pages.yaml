    Figure 16.1 Illustration of the minimum adversarial perturbation for 1-NN model.
    The goal is to perturb z to be classified as triangle class instead of the circle
    class; (a) shows the optimal perturbation (epsilon*) with two training points
    (circle and triangle); (b) shows the optimal perturbation when there are three
    training points; (c) shows that the optimal perturbation can be computed by evaluating
    the distance from z to each Voronoi cell of triangle instances.


    adversarial example. A verification algorithm aims to find a lower bound r on
    the minimal perturbation such that


    $f(z + \delta) = 1 \quad \forall \|\delta\| \le r.$


    Clearly, by definition the maximum lower bound r* will match the minimum perturbation
    norm epsilon* if both attack and verification are optimal. When r < r*, we say
    the verification algorithm is sound but incomplete (more discussions about complete
    versus incomplete verification can be found in Chapter 7.


    For simplicity, we will mainly focus on the l2 norm with 1-NN model (only looking
    at the closest sample in the database) and then generalize to K > 1 later.


    First, let''s consider some simple examples to gain intuition what would be the
    optimal adversarial example for the 1-NN model. In Fig. 16.1(a), we have two points
    (a circle and a triangle) in the database. For the testing sample z, it is predicted
    as a circle, and we would like to know the minimum perturbation to change the
    prediction (nearest neighbor becomes a triangle). A naive way is to find the perturbation
    on the direction pointing to the triangle, but in fact we cannot find the minimum
    perturbation on that direction. When there are only one circle and one triangle,
    the minimum perturbation will be pointing from z to the bisection hyperplane between
    two training samples (blue (dark gray in print version) epsilon*'
