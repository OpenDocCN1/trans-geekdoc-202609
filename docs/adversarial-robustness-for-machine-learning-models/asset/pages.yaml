    term. Given the initial iterate \( \delta^{(0)} = \mathbf{0} \), projected FISTA
    iteratively updates the perturbation \( I \) times by


    ```

    \(\delta^{(k+1)} = \Pi_{[0, 1]^p} \{ S_b(y^{(k)} - \alpha_k \nabla g(y^{(k)}))
    \},\) (19.5)

    ```


    ```

    \( y^{(k+1)} = \Pi_{[0, 1]^p} \{ \delta^{(k+1)} + \frac{k}{k+3} (\delta^{(k+1)}
    - \delta^{(k)}) \},\) (19.6)

    ```'
