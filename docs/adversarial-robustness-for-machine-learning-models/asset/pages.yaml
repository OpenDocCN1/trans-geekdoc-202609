  md: 'It is easy to use a similar way to establish guarantees for multiclass classification
    models. Assume that there are K classes in total and the smoothed classifier predicts
    class A. Then for any other class B, we can establish a similar guarantee as follows.


    # **Theorem 3** (Cohen et al., 2019). For multiclass classification problem with
    K classes, suppose that for any pair of classes A, B, we have bounds pA, pB satisfying


    \(P(g(x) = A) \ge \underline{p_A} \ge p_B \ge \max_{C \neq A} P(g(x) = C).\)


    _Then_ \(g(x + \delta) = A\) _for any_ \(\|\delta\|_2 < R\)_, where_


    \(R = \frac{\sigma}{2}(\Phi^{-1}(\underline{p_A}) - \Phi^{-1}(\overline{p_B})).\)


    When applying randomized smoothing to a pretrained model, we need to choose the
    parameter \(\sigma\) that corresponds to the noise level. Usually, a smaller \(\sigma\)
    leads to more accurate prediction as the prediction is closer to the original
    model _f_, but to a weaker certified robust radius. On the other hand, adding
    a very large \(\sigma\) will destroy the original prediction while having more
    robustness.


    Note that the ability to be easily applied to any pretrained model is a strength
    of randomized smoothing. However, as most of the pretrained models will have significantly
    degraded performance when adding random noise, this often leads to poor robustness
    guarantees. A better choice is to also add random perturbation in the training
    stage, so the model is “aware of” the random input noise in the training stage
    and can perform properly when applying randomized smoothing. This is also very
    similar to the RSE technique described in the previous subsection, where random
    noise is added in both training and testing stages. Further, Salman et al. (2019a)
    showed that conducting adversarial training in the training phase can also improve
    the certified robustness through randomized smoothing.


    The above-mentioned randomized smoothing technique is mostly designed for Gaussian
    noise. We can see in the analysis that the symmetry of Gaussian noise is very
    helpful. However, the natural of Gaussian noise only helps to establish the guarantees
    for \(\ell_2\) robustness, and if one is interested in bounding the perturbation
    with another norm (e.g., \(\ell_1\) or \(\ell_\infty\) norm), then bounding the
    other \(\ell_p\) norm based on the \(\ell_2\) robust radius will lead to very
    loose bounds. Therefore there have been many works trying to extend randomized
    smoothing to other norms or discuss the difficulty when certifying for some particular
    norms (Blum et al., 2020; Yang et al., 2020c; Dvijotham et al., 2020).'
