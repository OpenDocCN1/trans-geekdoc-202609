  md: '# # Biography


    # ## Dr. Pin-Yu Chen (1986–present)


    Dr. Pin-Yu Chen is currently a principal research staff member at IBM Thomas J.
    Watson Research Center, Yorktown Heights, NY, USA. He is also the chief scientist
    of RPI-IBM AI Research Collaboration and PI of ongoing MIT-IBM Watson AI Lab projects.
    Dr. Chen received his Ph.D. degree in electrical engineering and computer science
    and M.A. degree in Statistics from the University of Michigan, Ann Arbor, USA,
    in 2016. He received his M.S. degree in communication engineering from National
    Taiwan University, Taiwan, in 2011 and B.S. degree in electrical engineering and
    computer science (undergraduate honors program) from National Chiao Tung University,
    Taiwan, in 2009. Dr. Chen’s recent research focuses on adversarial machine learning
    and robustness of neural networks. His long-term research vision is building trustworthy
    machine learning systems. He has published more than 40 papers related to trustworthy
    machine learning at major AI and machine learning conferences, given tutorials
    at AAAI’22, IJCAI’21, CVPR(’20,’21), ECCV’20, ICASSP’20, KDD’19, and Big Data’18,
    and organized several workshops for adversarial machine learning. His research
    interest also includes graph and network data analytics and their applications
    to data mining, machine learning, signal processing, and cybersecurity. He was
    the recipient of the Chia-Lun Lo Fellowship from the University of Michigan Ann
    Arbor. He was also the recipient of the IEEE GLOBECOM 2010 GOLD Best Paper Award.
    At IBM Research, Dr. Chen has coinvented more than 30 U.S. patents and received
    the honor of IBM Master Inventor. In 2021, he received an IBM Corporate Technical
    Award for his contributions to trustworthy machine learning. More details about
    him can be found at www.pinyuchen.com.


    # ## Dr. Cho-Jui Hsieh (1985–present)


    Dr. Cho-Jui Hsieh is currently an assistant professor of Computer Science at University
    of California, Los Angeles. He received his Ph.D. degree in computer science from
    the University of Texas at Austin in 2015. He received his M.S. and B.S. degrees
    in computer science and information engineering from National Taiwan University
    in 2009 and 2007, respectively. His main research focuses on developing efficient,
    reliable and automatic'
