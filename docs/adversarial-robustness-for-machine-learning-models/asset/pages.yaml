  md: '# CHAPTER 3


    # Black-box adversarial attacks


    In recent years, “machine learning as a service” has offered the world an effortless
    access to powerful machine learning tools for a wide variety of tasks. For example,
    commercially available services such as Google Cloud Vision API$^1$ and Clarifai.com$^2$
    provide well-trained image classifiers to the public. One is able to upload and
    obtain the class prediction results for images at hand at a low price. However,
    the details of the model behind the service are unknown to an attacker/user, which
    means that the function/model $f$ can be viewed as a *black-box* model. A *query*
    is defined as an instance to upload a data input $\boldsymbol{x}$ and obtain the
    function/model output $f(\boldsymbol{x})$. In addition to attack success rate,
    the number of query counts to a targeted black-box model required to launch successful
    adversarial attacks (e.g., finding adversarial examples) is also important to
    evaluate the efficiency of black-box attacks.


    # 3.1 Evasion attack taxonomy


    Evasion attacks can be categorized based on attackers’ knowledge of the target
    model. Fig. 3.1 illustrates the taxonomy of different attack types.


    *White-box attack* introduced in Chapter 2 assumes complete knowledge about the
    target model, including model architecture and model parameters. Consequently,
    an attacker can exploit the autodifferentiation function offered by deep learning
    packages, such as backpropagation (input gradient) from the model output to the
    model input, to craft adversarial examples. This “attack” would be most practical
    for model developers to perform a series of in-house robustness testing, that
    is, a virtual adversary or a white-hat hacker. For real attackers, requiring white-box
    access to the target model is often not feasible.


    *Black-box attack* assumes that an attacker can only observe the model prediction
    of a data input (i.e., a query) and does not know any other information. The target
    model can be viewed as a black-box function, and thus backpropagation for input
    gradient is infeasible without knowing the


    $^1$ https://cloud.google.com/vision. $^2$ https://clarifai.com.'
  merge: -1
  img_proc: true
