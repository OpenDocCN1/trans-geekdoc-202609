  md: '# CHAPTER 17


    # Adversarial robustness in meta-learning and contrastive learning


    A popular trend in machine learning is an extension of the methodology of single-task
    learning to fast adaptation or general representation learning, such as meta-learning,
    which quickly adapts the current metamodel to solve a new task in few-shot scenarios,
    and contrastive learning, which obtains general representations using self-supervision
    for efficient finetuning on specific tasks. In this chapter, we take a close look
    at these two machine learning paradigms and study their adversarial robustness
    in the downstream tasks, based on the results of (Wang et al., 2021b) and (Fan
    et al., 2021).


    # 17.1 Fast adversarial robustness adaptation in model-agnostic meta-learning


    Meta-learning, which can offer fast generalization adaptation to unseen tasks
    (Thrun and Pratt, 2012; Novak and Gowin, 1984), has widely been studied from model-
    and metric-based methods (Santoro et al., 2016; Munkhdalai and Yu, 2017; Koch
    et al., 2015; Snell et al., 2017) to optimization-based methods (Ravi and Larochelle,
    2016; Finn et al., 2017; Nichol et al., 2018). In particular, model-agnostic meta-learning
    (MAML) (Finn et al., 2017) is one of the most intriguing bilevel optimization-based
    meta-learning methods designed for fast-adapted few-shot learning; that is, the
    learnt metamodel can rapidly be generalized to unforeseen tasks with only a small
    amount of data. It has successfully been applied to use cases such as object detection
    (Wang et al., 2020a), medical image analysis (Maicas et al., 2018), and language
    modeling (Huang et al., 2018).


    Tackling the problem of adversarial robustness in MAML is more challenging than
    that of the standard model training, since MAML contains a bileveled learning
    procedure in which the meta-update step (outer loop) optimizes a task-agnostic
    initialization of model parameters, whereas the fine-tuning step (inner loop)
    learns a task-specific model instantization updated from the common initialization.
    Thus it remains elusive when'
