  md: 'problem to generate an adversarial example. For example, a projected gradient
    descent method can be applied: at each iteration, we update the current solution
    \(\boldsymbol{x}_t\) by


    \(\boldsymbol{x}_{t+1} \leftarrow \Pi(\boldsymbol{x}_t + \alpha \nabla g(\boldsymbol{x})),
    \quad (2.5)\)


    where \(\alpha\) is the learning rate of gradient descent, and \(\Pi(\cdot)\)
    projects the vector to \(B(\boldsymbol{x}_0)\). However, in practice, we may find
    that this plain projected gradient descent update is not very effective in solving
    the attack problem, especially when we use \(\ell_\infty\) norm constraint, which
    is the most common choice in the computer vision community. In the \(\ell_\infty\)
    norm case the constraint set \(B(\boldsymbol{x})\) is a hyperrectangle (high-dimensional
    rectangle), and the successful attacks are often (but not always) lying on the
    corner of this rectangle, i.e., most of the elements of a successful adversarial
    example \(\boldsymbol{x}_i^*\) should be close to \((\boldsymbol{x}_0)_i \pm \epsilon\).
    If the plain projected gradient descent update (2.5) is used, then some coordinates
    will require many iterations to reach \(\pm \epsilon\), leading to slow convergence.
    Therefore it is a common practice to use the *steepest descent algorithm* for
    conducting an attack, as detailed below.


    # 2.3 Steepest descent, FGSM and PGD attack


    In this section, we will first consider the \(\ell_\infty\) norm attack (i.e.,
    \(B(\boldsymbol{x}) = \{\boldsymbol{x} : \|\boldsymbol{x} - \boldsymbol{x}_0\|_\infty
    \le \epsilon\}\)). Let us consider the problem of conducting only *one update*
    to approximately solve (2.1). The idea of steepest descent update is forming a
    linear approximation of the objective function and finding the best update to
    maximize this linear approximation. Concretely, we can conduct the first-order
    Taylor expansion of \(g(\boldsymbol{x})\) on the initial solution \(\boldsymbol{x}_0\)
    (assuming that we start from the original natural example):


    \(g(\boldsymbol{x}) \approx g(\boldsymbol{x}_0) + \nabla g(\boldsymbol{x}_0)^T
    (\boldsymbol{x} - \boldsymbol{x}_0).\)


    We can then solve the following constraint optimization problem, which is an approximation
    of (2.1):


    \(\underset{\boldsymbol{x}}{\text{argmax}} \nabla g(\boldsymbol{x}_0)^T (\boldsymbol{x}
    - \boldsymbol{x}_0) \quad \text{s.t.} \quad \boldsymbol{x} \in \|\boldsymbol{x}
    - \boldsymbol{x}_0\|_\infty \le \epsilon. \quad (2.6)\)


    Note that we drop the \(g(\boldsymbol{x}_0)\) term in the Taylor expansion since
    it is a constant irrelevant to \(\boldsymbol{x}\). Now we can easily see that
    (2.6) has a closed-form solution


    \(\boldsymbol{x}_1 = \boldsymbol{x}_0 + \epsilon \text{sign}(\nabla g(\boldsymbol{x}_0)).
    \quad (2.7)\)'
