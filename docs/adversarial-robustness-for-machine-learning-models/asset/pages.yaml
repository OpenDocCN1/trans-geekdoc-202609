  md: 'x traverses the decision tree model until reaching a leaf node. Each internal
    node, say node $i$, has two children and a univariate feature-threshold pair $(t_i,
    \eta_i)$ to determine the traversal direction: $x$ will be passed to the left
    child if $x_{t_i} \le \eta_i$ and to the right child otherwise. Each leaf node
    has a value $v_i$ corresponding to the predicted class label for a classification
    tree or a real value for a regression tree.


    Similar to the previous sections, we first discuss how to compute the minimum
    adversarial perturbation that can change the decision of a given test sample.
    More specifically, for a given tree-based model $f$, a test sample $x$, and the
    corresponding label $y_0$, the goal is to find


    $r^* = \min_\delta \|\delta\|_\infty \quad \text{s.t.} \quad f(x+\delta) \neq
    y_0. \tag{16.17}$


