- pgno: 174
  md: 'in Fig. 16.1(a)). However, when there are more than two samples, it becomes
    insufficient to check the projection to each bisection hyperplane. For example,
    in Fig. 16.1(b), there are two circles and one triangle, and the optimal perturbation
    (\epsilon* in blue (dark gray in print version)) is pointing to the intersection
    of two bisection hyperplanes (two dash lines). If we check the perturbation from
    \mathbf{z} to all the intersections of bisection hyperplanes, then we will be
    able to find the minimum adversarial perturbation. However, as the number of intersections
    of bisections grows exponentially to the number of training samples, it becomes
    computationally intractable to conduct an exhausted search.


    In fact, the decision boundary of a 1-NN model can be captured by the Voronoi
    diagram (see Fig. 16.1(c)). In the Voronoi diagram, each training instance \mathbf{x}_i
    forms a cell, and the decision boundary of the cell is captured by the convex
    boundary formed by bisections between \mathbf{x}_i and its neighbors. We can thus
    obtain the minimum adversarial perturbation by computing the distances from \mathbf{z}
    to all the cells with y_i \neq 1. However, to compute the distance, we need to
    check all the faces (captured by one bisection hyperplane) and angles (intersections
    of more than one bisection hyperplanes) of the cell.


    For the two-dimensional space (d=2), it has been shown by Aurenhammer and Klein
    (1999) that each cell can only have finite faces and angles and there exists a
    polynomial-time algorithm for computing a Voronoi diagram. In general, for d-dimensional
    problems with n points, Voronoi diagram computation requires O(n log n + n^{\lfloor
    d/2 \rfloor}) time, which works for low-dimensional problems. However, the time
    complexity grows exponentially with dimension d, so in general, it is hard to
    use this algorithm unless d is very small.


    # A primal-dual quadratic programming formulation


    Computing minimum adversarial perturbations for ReLU networks is NP-hard (Katz
    et al., 2017). Also, as discussed in the previous section, we can connect it to
    the Voronoi diagram computation, but the solver will require exponential time
    in dimensionality. So is it NP-hard to compute the minimum adversarial perturbation
    for 1-NN? Surprisingly, the answer is no, and we will describe an efficient algorithm
    for doing that.


    For a given instance \mathbf{z}, if we want to perturb it so that \mathbf{z} +
    \boldsymbol{\delta} is closer to \mathbf{x}_j with y_j \neq 1 than to all class-1
    instances, then the problem of finding the'
