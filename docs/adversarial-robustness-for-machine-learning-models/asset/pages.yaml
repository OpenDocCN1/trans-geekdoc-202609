  md: 'imperceptibility. Joshi et al. (2019) train an adversarial network composed
    of an encoder and a generator conditioned on attributes to find semantic adversarial
    examples. Fawzi and Frossard (2015) and Engstrom et al. (2017) show that simple
    operations such as image rotation or object translation can result in a notable
    misclassification rate.


    We note that for the semantic perturbations that are continuously parameterized
    (such as hue, saturation, lightness, brightness, contrast, and rotations), it
    is not possible to enumerate all possible values even if we only perturb one single
    parameter (e.g., rotation angle). The reason is that these parameters take real
    values in the continuous space, and hence it is not possible to finitely enumerate
    all possible values, unlike its discrete parameterized counterpart (e.g., translations
    and occlusions have finite enumerations). Taking the rotation angle for example,
    an attacker can try to do a grid search by sweeping rotation angle \(\theta\)
    from \(0^\circ\) to \(90^\circ\) with a uniform grid of \(10^\circ\) samples.
    However, if the attacks are not successful at \(\theta = 30^\circ\) and \(30.00009^\circ\),
    then it is possible that there exists some \(\theta''\) that could "fool" the
    classifier where \(30^\circ < \theta'' < 30.00009^\circ\). This is indeed the
    motivation and necessity to have the robustness verification algorithm for semantic
    perturbations as discussed in this chapter – with a proper semantic robustness
    verification algorithm, we aim to deliver a robustness guarantee that neural networks
    will have a consistent prediction on the given image for any \(\theta < a\), where
    \(a\) is the semantic robustness certificate of the image.


    # ## 10.2 Semantic perturbation layer


    To bridge this gap and with an endeavor to render robustness verification methods
    more inclusive, Mohapatra et al. (2020) propose Semantify-NN, a model-agnostic
    and generic robustness verification against semantic perturbations. Semantify-NN
    is model-agnostic because it can apply to any given trained model by simply inserting
    the designed semantic perturbation layers (SP-layers). It is also generic since
    after adding SP-layers, we can apply any \(\ell_p\)-norm-based verification tools
    for certifying semantic perturbations. In other words, the proposed SP-layers
    work as a carefully designed converter that transforms semantic threat models
    to \(\ell_p\)-norm threat models.


    Let \(\mathcal{A}\) be a general threat model. For an input data sample \(x\),
    we define an associated space of perturbed images \(x''\), denoted as the Attack
    Space \(\Omega_{\mathcal{A}}(x)\), which is equipped with a distance function
    \(d_\mathcal{A}\) to measure the magnitude of the perturbation. The robustness
    certification problem under the threat model \(\mathcal{A}\) is formulated as
    follows: given a trained \(K\)-class neural net-'
