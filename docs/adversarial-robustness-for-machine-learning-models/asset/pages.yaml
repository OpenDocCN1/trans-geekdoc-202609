  md: '# Algorithm 1 Local computation of $h(s)$.


    ```

    1: Input: Hard-label model $f_{\theta}$, original sample $x_0$, query direction
    $s$, previous solution $v$, increase/decrease ratio $\alpha = 0.01$, stopping
    tolerance $\gamma$ (maximum tolerance of computed error)

    2: \( s \leftarrow s/||s|| \)

    3: if \( f_{\theta}(x_0 + vs) = t_0 \) then

    4:   \( v_{left} \leftarrow v, v_{right} \leftarrow (1 + \alpha)v \)

    5:   while \( f_{\theta}(x_0 + v_{right}s) = t_0 \) do

    6:     \( v_{right} \leftarrow (1 + \alpha)v_{right} \)

    7:   end while

    8: else

    9:   \( v_{right} \leftarrow v, v_{left} \leftarrow (1 - \alpha)v \)

    10: while \( f_{\theta}(x_0 + v_{left}s) \neq t_0 \) do

    11:   \( v_{left} \leftarrow (1 - \alpha)v_{left} \)

    12: end while

    13: end if

    14: ## Binary Search within \( [v_{left}, v_{right}] \)

    15: while \( v_{right} - v_{left} > \gamma \) do

    16:   \( v_{mid} \leftarrow (v_{right} + v_{left})/2 \)

    17:   if \( f_{\theta}(x_0 + v_{mid}s) = t_0 \) then

    18:     \( v_{left} \leftarrow v_{mid} \)

    19:   else

    20:     \( v_{right} \leftarrow v_{mid} \)

    21:   end if

    22: end while

    23: return \( v_{right} \)

    ```


    Although it requires many samples to exactly compute the $h$ value, when integrating
    it in the zeroth order optimization algorithm we can usually ignore the coarse-grained
    search and directly enter the binary search phase. This is because the computation
    of $h$ values is needed for finite-difference gradient estimator (such as (3.3)),
    which means we already know $h(\mathbf{x})$ and want to compute a closely point
    $h(\mathbf{x}+\beta\mathbf{u})$. Therefore, the queried direction will only be
    a slight modification of the previous one. In this case, we first increase or
    decrease $v$ in the local region to find the interval that contains the nearby
    boundary (e.g., $f_{\theta}(\mathbf{x}_0 + \mathbf{v}s) = t_0$ and $f_{\theta}(\mathbf{x}_0
    + \mathbf{v}''s) \neq t_0$), then conduct a binary search to find the final value
    of $h$.'
