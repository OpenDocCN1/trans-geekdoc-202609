    values and constant \(b''\) are determined by \(\boldsymbol{l}, \boldsymbol{u},
    w\).


    With linear upper and lower bounds for each neuron, we can linearize the whole
    neural network step by step, where at each step, we form linear upper and lower
    bounds for neurons at layer \(l\). This results in an efficient'
