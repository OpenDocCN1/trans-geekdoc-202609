  md: '# CHAPTER 12


    # Adversarial training


    As the ultimate goal of defenses is to make models robust against adversarial
    examples, a very natural idea is to add adversarial examples into the training
    dataset. This idea, also known as adversarial training, has been implemented in
    many earlier papers such as (Goodfellow et al., 2015; Kurakin et al., 2017), where
    they usually generate adversarial examples periodically (e.g., after every few
    training epochs). However, as the model evolves quickly during the optimization
    procedure, those adversarial examples usually fail to capture the vulnerable points
    of the latest model, leading to instability and poor performance on robust accuracy
    (i.e., accuracy against adversarial examples at test time). Later on Madry et
    al. (2018) showed that adversarial training can be formulated as solving a min-max
    optimization problem. This simple but insightful formulation enables generating
    adversarial examples on-the-fly, which significantly improves the robustness of
    the model. As a result, adversarial training becomes one of the most widely used
    defense methods.


    In this chapter, we will first introduce the min-max formulation of adversarial
    training in Section 12.1, and then discuss several improvements over vanilla AT
    in Section 12.2 and 12.3.


    # ## 12.1 Formulating adversarial training as bilevel optimization


    In standard training, the goal is to learn the model parameters \(\theta\) to
    minimize the empirical loss, defined as the average loss on all the training examples.
    The objective of standard training can thus be formulated as solving the following
    empirical risk minimization problem:


    ```

    \(\arg \min_\theta E_{(x,y)\in \mathcal{D}} L(f_\theta(x), y),\) (12.1)

    ```


    where \(E\) denotes expectation, \((x, y) \in \mathcal{D}\) denotes a pair of
    sample and its label randomly drawn from a distribution \(\mathcal{D}\), \(L\)
    is a supervised loss function, and \(f_\theta(x)\) is the model’s prediction on
    \(x\).


    In adversarial training, we consider that there may be an attacker trying to find
    the adversarial example with the maximal loss within an \(\ell_p\) ball of'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'each example. Therefore, instead of minimizing the regular loss function \(L(\cdot,
    \cdot)\), we want to minimize the loss on the worst-case perturbed example around
    each natural example. It is thus natural to replace the loss in (12.1) by the
    maximal loss around each example, which can be written as


    ```

    arg min_{\theta} E_{(x,y)\in D} max_{x'' \in B(x)} L(f_\theta(x''), y), \quad
    (12.2)

    ```


    where \(B(x)\) is the perturbation set around the natural example \(x\). For instance,
    under a commonly used \(\ell_\infty\) perturbation set, \(B(x)\) is the \(\epsilon\)-bounded
    \(\ell_\infty\) ball around \(x\), so the objective can be written as


    ```

    arg min_{\theta} E_{(x,y)\in D} max_{x'': ||x''-x||_\infty \le \epsilon} L(f_\theta(x''),
    y). \quad (12.3)

    ```


    This formulation is proposed by Madry et al. (2018). This is also called a bilevel
    optimization as there are two levels (min and max) in the objective. Bilevel optimization
    problems can often be solved by the alternating minimization procedure: at each
    update, solve the inner maximization problem to obtain \(x''\) and then conduct
    an outer update on the model parameter \(\theta\) based on \(x''\).


    In alternating minimization, the inner maximization can be viewed as finding an
    adversarial example of a given input data point \(x\) within the perturbation
    set \(B(x)\). In Eq. (12.3), as the inner problem is a constrained maximization
    task, a natural idea is to solve it by a projected gradient descent (PGD) algorithm,
    similar to the PGD algorithm when we conduct adversarial attack. In the PGD algorithm,
    we start from \(x_0 = x\) and conduct the following iterative updates:


    ```

    x_t \leftarrow \text{Proj}_{B(x)}(x_{t-1} + \alpha \cdot \text{sign}(\nabla_x
    L(f_\theta(x_{t-1}), y))), \quad (12.4)

    ```


    where the operator Proj projects the input vector into the constraint set \(B(x)\),
    in this case the \(\ell_\infty\) ball around \(x\). This can be done by clipping
    each input dimension by


    ```

    \text{Proj}(u)_i = \min(x_i + \epsilon, \max(x_i - \epsilon, u_i))

    ```


    for a given vector \(u\). If we run the inner maximization for \(k\) iterations,
    then we set \(x''\) as the output of the \(k\)th PGD step and use it to conduct
    the parameter update of \(\theta\). Ideally, a larger \(k\) will lead to better
    results but also consumes more time. If we run PGD for \(k\) iterations, then
    the computational time of the whole adversarial training process will be roughly
    \(k\) times'
