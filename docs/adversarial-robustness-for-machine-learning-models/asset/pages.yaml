  md: 'model prediction results. We denote the prediction of the model on the example
    \(\mathbf{x}\) by Pred(\(\mathbf{x}\)), where Pred is any function that outputs
    a vector of prediction scores for all classes, such as prediction probabilities
    and logits (unnormalized probabilities) widely used in neural networks, among
    others.


    To ensure that the modified example \(\mathbf{x}\) is still close to the data
    manifold of natural examples, Dhurandhar et al. (2018) proposed to use an autoencoder
    to evaluate the closeness of \(\mathbf{x}\) to the data manifold. We denote by
    AE(\(\mathbf{x}\)) the reconstructed example of \(\mathbf{x}\) using the autoencoder
    AE.


    Finding pertinent negatives (PNs). For pertinent negative analysis, we are interested
    in what is missing in the model prediction. For any natural example \(\mathbf{x}_0\),
    we use the notation \(\mathcal{X}/\mathbf{x}_0\) to denote the space of missing
    parts with respect to \(\mathbf{x}_0\). We aim to find an interpretable perturbation
    \(\boldsymbol{\delta} \in \mathcal{X}/\mathbf{x}_0\) to study the difference between
    the most probable class predictions in \(\text{arg max}_i[\text{Pred}(\mathbf{x}_0)]_i\)
    and \(\text{arg max}_i[\text{Pred}(\mathbf{x}_0 + \boldsymbol{\delta})]_i\). Given
    \((\mathbf{x}_0, t_0)\), our method finds a pertinent negative by solving the
    following optimization problem:


    ```

    \(\min_{\boldsymbol{\delta} \in \mathcal{X}/\mathbf{x}_0} c \cdot f_k^{\text{neg}}(\mathbf{x}_0,
    \boldsymbol{\delta}) + \beta \|\boldsymbol{\delta}\|_1 + \|\boldsymbol{\delta}\|_2^2
    + \gamma \|\mathbf{x}_0 + \boldsymbol{\delta} - \text{AE}(\mathbf{x}_0 + \boldsymbol{\delta})\|_2^2.
    \quad (19.1)\)

    ```


    We elaborate on the role of each term in the objective function (19.1) as follows.
    The first term \(f_k^{\text{neg}}(\mathbf{x}_0, \boldsymbol{\delta})\) is a designed
    loss function that encourages the modified example \(\mathbf{x} = \mathbf{x}_0
    + \boldsymbol{\delta}\) to be predicted as a class different from \(t_0 = \text{arg
    max}_i[\text{Pred}(\mathbf{x}_0)]_i\). The loss function is defined as


    ```

    \(f_k^{\text{neg}}(\mathbf{x}_0, \boldsymbol{\delta}) = \max\{[\text{Pred}(\mathbf{x}_0
    + \boldsymbol{\delta})]_{t_0} - \max_{i \neq t_0}[\text{Pred}(\mathbf{x}_0 + \boldsymbol{\delta})]_i,
    -\kappa\}, \quad (19.2)\)

    ```


    where \([\text{Pred}(\mathbf{x}_0 + \boldsymbol{\delta})]_i\) is the \(i\)th class
    prediction score of \(\mathbf{x}_0 + \boldsymbol{\delta}\). The hinge-like loss
    function favors the modified example \(\mathbf{x}\) to have a top-1 prediction
    class different from that of the original example \(\mathbf{x}_0\). The parameter
    \(\kappa \ge 0\) is a confidence parameter that controls the separation between
    \([\text{Pred}(\mathbf{x}_0 + \boldsymbol{\delta})]_{t_0}\) and \(\max_{i \neq
    t_0}[\text{Pred}(\mathbf{x}_0 + \boldsymbol{\delta})]_i\). The second and third
    terms \(\beta \|\boldsymbol{\delta}\|_1 + \|\boldsymbol{\delta}\|_2^2\) in (19.1)
    are jointly called the elastic net regularizer, which is used for efficient feature
    selection in high-dimensional learning problems (Zou and Hastie, 2005). The last
    term \(\|\mathbf{x}_0 + \boldsymbol{\delta} - \text{AE}(\mathbf{x}_0 + \boldsymbol{\delta})\|_2^2\)
    is an \(L_2\) reconstruction error of \(\mathbf{x}\) evaluated by the autoencoder.
    This is relevant provided that a well-trained autoencoder for the domain is obtainable.
    The parameters \(c, \beta, \gamma \ge 0\) are the associated regularization coefficients.


    Finding pertinent positives (PPs). For pertinent positive analysis, we are interested
    in the critical features readily present in the input. Given a natural example
    \(\mathbf{x}_0\), we denote the space of its existing components by \(\mathcal{X}
    \cap \mathbf{x}_0\). Here'
