  md: 'Table 18.1 Mathematical notation for reprogramming.


    | Symbol | Meaning |

    | :--- | :--- |

    | $S / \mathcal{T}$ | source/target domain |

    | $\mathcal{X}_S / \mathcal{X}_{\mathcal{T}}$ | the space of source/target data
    samples |

    | $\mathcal{Y}_S / \mathcal{Y}_{\mathcal{T}}$ | the space of source/target data
    labels |

    | $\mathcal{D}_S \subseteq \mathcal{X}_S \times \mathcal{Y}_S$ / $\mathcal{D}_{\mathcal{T}}
    \subseteq \mathcal{X}_{\mathcal{T}} \times \mathcal{Y}_{\mathcal{T}}$ | source/target
    data distribution |

    | $(x, y) \sim \mathcal{D}$ | data sample $x$ and one-hot coded label $y$ drawn
    from $\mathcal{D}$ |

    | $K$ | number of source labels |

    | $f_S : \mathbb{R}^d \mapsto [0, 1]^K$ | pretrained $K$-way source classification
    model |

    | $\eta : \mathbb{R}^K \mapsto [0, 1]^K$ | softmax function in neural network,
    and $\sum_{k=1}^K [\eta(\cdot)]_k = 1$ |

    | $z(\cdot) \in \mathbb{R}^K$ | logit(preskmax) representation, and $f(x) = \eta(z(x))$
    |

    | $\ell(x, y) \triangleq \|f(x) - y\|_2$ | risk function of $(x, y)$ based on
    classifier $f$ |

    | $\mathbb{E}_{\mathcal{D}}[\ell(x, y)] \triangleq \mathbb{E}_{(x,y) \sim \mathcal{D}}[\ell(x,
    y)] = \mathbb{E}_{\mathcal{D}}[\|f(x) - y\|_2]$ | population risk based on classifier
    $f$ |

    | $\delta, \theta$ | additive input transformation on target data, parameterized
    by $\theta$ |

    | $P(\cdot)$ | probability |


    To bridge this gap, Yang et al. (2021b) proposed a novel approach, named voice
    to series (V2S), for time series classification by reprogramming a pretrained
    acoustic model (AM), such as a spoken-terms recognition model. Unlike general
    time series tasks, modern AMs are trained on massive human voice datasets and
    are considered as a mature technology widely deployed in intelligent electronic
    devices. The rationale of V2S lies in the fact that voice data can be viewed as
    univariate temporal signals, and therefore a well-trained AM is likely to be reprogrammed
    as a powerful feature extractor for solving time series classification tasks.
    Fig. 18.1 shows a schematic illustration of the V2S framework, including (a) a
    trainable reprogram layer, (b) a pretrained AM, and (c) a specified label mapping
    function between source (human voice) and target (time series) labels.


    Trainable input transformation function. Let $x_t \in \mathcal{X}_{\mathcal{T}}
    \subseteq \mathbb{R}^{d_{\mathcal{T}}}$ denote a univariate time series input
    from the target domain with $d_{\mathcal{T}}$ temporal features. V2S aims to find
    a trainable input transformation function $\mathcal{H}$ that is universal to all
    target data inputs, which serves the purpose of reprogramming $x_t$ into the source
    data space $\mathcal{X}_S \subseteq \mathbb{R}^{d_S}$, where $d_{\mathcal{T}}
    < d_S$. Specifically, the'
  merge: -1
  img_proc: true
- pgno: 217
  md: '![](img/fa92deee3de0f00ea56e92ca0b92c8e4_217_0.png)


    Figure 18.1 Schematic illustration of the Voice2Series (V2S) framework (Yang et
    al., 2021b): (a) trainable reprogram layer; (b) pretrained acoustic model (AM);
    (c) source-target label mapping function.


    reprogrammed sample \(x''_t\) is formulated as


    ```

    \(x''_t = \mathcal{H}(x_t; \theta) := \text{Pad}(x_t) + \underbrace{M \odot \theta}_{\triangleq
    \delta},\) (18.1)

    ```


    where \(\text{Pad}(x_t)\) is a zero padding function that outputs a zero-padded
    time series of dimension \(d_S\). The location of the segment \(x_t\) to be placed
    in \(x''_t\) is a design parameter as discussed by Yang et al. (2021b). The term
    \(M \in \{0, 1\}^{d_S}\) is a binary mask that indicates the location of \(x_t\)
    in its zero-padded input \(\text{Pad}(x_t)\), where the \(i\)th entry of \(M\)
    is 0 if \(x_t\) is present (indicating that the entry is nonreprogrammable) and
    1 otherwise (indicating that the entry is not occupied and thus reprogrammable).
    The operator \(\odot\) denotes elementwise product. Finally, \(\theta \in \mathbb{R}^{d_S}\)
    is a set of trainable parameters for aligning source and target domain data distributions.
    The term \(\delta \triangleq M \odot \theta\) denotes the trainable additive input
    transformation for V2S reprogramming. For ease of representation, we will omit
    the padding notation and simply use \(x_t + \delta\) to denote the reprogrammed
    target data by treating the operation “+” as a zero-padded broadcasting function.


    Pretrained model and output label mapping. We select a pretrained deep acoustic
    classification model as the source model \(f_S\) for model reprogramming. We assume
    that the source model has softmax as the final layer and outputs nonnegative confidence
    score (prediction probability) for each source label. With the transformed data
    inputs \(\mathcal{H}(x_t; \theta)\) described in (18.1), we can obtain the class
    prediction of the source model \(f_S\) on a reprogrammed target data sample \(x_t\),
    denoted by


    ```

    \(P(y_s | f_S(\mathcal{H}(x_t; \theta))) \text{ for } y_s \in \mathcal{Y}_S.\)
    (18.2)

    ```


    Next, as illustrated in Fig. 18.1, we assign a (many-to-one) label mapping function
    \(h\) to map source labels to target labels. For a target label'
