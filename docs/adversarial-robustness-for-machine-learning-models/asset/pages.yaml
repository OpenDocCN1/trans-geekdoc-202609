- pgno: 175
  md: 'minimum perturbation can be formulated as


    $$\epsilon^{(i)} = \min_{\boldsymbol{\delta}} \frac{1}{2} \boldsymbol{\delta}^T
    \boldsymbol{\delta} \text{ s.t. } \|\boldsymbol{z} + \boldsymbol{\delta} - \boldsymbol{x}_j\|^2
    \le \|\boldsymbol{z} + \boldsymbol{\delta} - \boldsymbol{x}_i\|^2 \forall i, y_i
    = 1. \quad (16.2)$$


    Note that this formulation was proposed by (Wang et al., 2019c; Yang et al., 2020f).
    (Wang et al., 2019c) further shows that (16.2) can be solved in polynomial time
    as follows.


    Each constraint in the formulation can be rewritten as


    $$\boldsymbol{\delta}^T(\boldsymbol{x}_j - \boldsymbol{x}_i) + \frac{\|\boldsymbol{z}
    - \boldsymbol{x}_i\|^2 - \|\boldsymbol{z} - \boldsymbol{x}_j\|^2}{2} \ge 0.$$


    Therefore (16.2) becomes


    $$\epsilon^{(i)} = \min_{\boldsymbol{\delta}:\boldsymbol{A}\boldsymbol{\delta}+\boldsymbol{b}\ge
    0} \{ \frac{1}{2} \boldsymbol{\delta}^T \boldsymbol{\delta} \} := P^{(i)}(\boldsymbol{\delta}),
    \quad (16.3)$$


    where \(\boldsymbol{A} \in \mathbb{R}^{n \times d}\) and \(\boldsymbol{b} \in
    \mathbb{R}^n\) with \(y_i = 1\), \(\boldsymbol{a}_i = (\boldsymbol{x}_j - \boldsymbol{x}_i)\),
    and \(b_i = \frac{\|\boldsymbol{z} - \boldsymbol{x}_i\|^2 - \|\boldsymbol{z} -
    \boldsymbol{x}_j\|^2}{2}\) for each row \(i\) (\(\mathbf{0}\) otherwise). By solving
    the quadratic programming (QP) problem (16.3) for each \(\{ j : y_j \neq 1 \}\),
    the final minimum adversarial perturbation norm is \(\epsilon^* = \min_{j: y_j
    \neq 1} \sqrt{2\epsilon^{(j)}}\). It has been shown that convex quadratic programming
    can be solved in polynomial time (Kozlov et al., 1980), so this formulation leads
    to a *polynomial-time algorithm* for finding \(\epsilon^*\). However, naively
    solving this will still be too expensive as the number of constraint grows quadratically.
    We will thus introduce the dual problems below, which not only give an efficient
    way for computing robustness of 1-NN model, but also provide ways to compute a
    certifiable robustness bound for 1-NN robustness verification.


    # Dual quadratic programming problems


    We also introduce the dual form of each QP as it is more efficient to solve in
    practice and will lead to a family of verification algorithms for adversarial
    robustness. The dual problem of (16.3) can be written as


    $$\max_{\boldsymbol{\lambda} \ge 0} \left\{ -\frac{1}{2} \boldsymbol{\lambda}^T
    \boldsymbol{A} \boldsymbol{A}^T \boldsymbol{\lambda} - \boldsymbol{\lambda}^T
    \boldsymbol{b} \right\} := D^{(i)}(\boldsymbol{\lambda}), \quad (16.4)$$


    where \(\boldsymbol{\lambda} \in \mathbb{R}^{n^+}\) are the corresponding dual
    variables. This follows the standard derivation of dual QP problems (e.g., almost
    identical to the primal and dual problems of support vector machines). The primal–dual
    relationship connects primal and dual variables by \(\boldsymbol{\delta} = \boldsymbol{A}^T
    \boldsymbol{\lambda}\). Based on weak duality,'
  merge: -1
