- pgno: 299
  md: '# Adversarial Robustness

    for Machine Learning


    Pin-Yu Chen and

    Cho-Jui Hsieh


    Although machine learning algorithms have achieved remarkable performance in many
    applications, recent studies have demonstrated their lack of robustness against
    adversarial disturbance. The lack of robustness brings security concerns in machine
    learning models for real applications such as self-driving cars, robotics controls,
    and healthcare systems. Adversarial robustness has become one of the mainstream
    topics in machine learning with much research carried out, and many companies
    have started to incorporate security and robustness into their systems.


    **Adversarial Robustness for Machine Learning** summarizes the recent progress
    on this topic and introduces popular algorithms for adversarial attack, defense,
    and verification.


    # Key Features


    +   - Summarizes the whole field of adversarial robustness for machine learning
    models

    +   - Introduces formulations, algorithms, and intuitions

    +   - Includes applications based on adversarial robustness


    For researchers, this book provides a thorough literature review that summarizes
    the latest progress in this area, which can be a good reference for conducting
    future research. It could also be used as a textbook for graduate courses on adversarial
    robustness or trustworthy machine learning.


    # About the Authors


    **Pin-Yu Chen** is a research staff member at IBM Thomas J. Watson Research Center,
    Yorktown Heights, NY, USA. He is also the Chief Scientist of RPI-IBM AI Research
    Collaboration and PI of ongoing MIT-IBM Watson AI Lab projects. Dr. Chen’s long-term
    research vision is building trustworthy machine learning systems. His research
    interest also includes graph and network data analytics and their applications
    in data mining, machine learning, signal processing, and cybersecurity.


    **Cho-Jui Hsieh** is an Assistant Professor at the UCLA Computer Science department.
    His research focuses on developing algorithms and optimization techniques for
    training large-scale and robust machine learning models.'
