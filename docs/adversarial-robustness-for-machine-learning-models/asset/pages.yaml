    (FISTA) (Beck and Teboulle, 2009) is applied to solve problems (19.1) and (19.3).
    FISTA is an efficient solver for optimization problems involving \( \ell_1 \)
    regularization. Take pertinent negative as an example, assume \( \mathcal{X} =
    [-1, 1]^p \) and \( \mathcal{X}/x_0 = [0, 1]^p \), and let \( g(\delta) = f_k^\text{neg}(x_0,
