    et al., 2019). Differential privacy adds randomness so that different inputs cannot
    be distinguished by only looking at the output, which is equivalent to saying
    “any nearby input yields the same or similar prediction”, and this is exactly
    the definition of robustness here.


    However, later on Cohen et al. (2019) established a simpler way to obtain a better
    certifiable robustness bound. The intuition can be illustrated in Fig. 13.3. Assume
