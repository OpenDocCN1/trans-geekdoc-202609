    # ## 15.3 Detecting Trojan models


    Wang et al. (2020d) study the problem of the Trojan network (TrojanNet) detection
    in the data-scarce regime, where only the weights of a trained DNN are accessed
    by the detector. We refer to Chapter 5 for details regarding backdoor attacks.
    Wang et al. (2020d) propose a data-limited TrojanNet detector (TND), when only
    a few data samples are available for TrojanNet detection. They show that an effective
    data-limited TND can be established by exploring connections between Trojan attack
    and prediction–evasion adversarial attacks including per-sample attack and all-sample
    universal attack. In addition, they propose a data-free TND, which can detect
    a TrojanNet without accessing any data samples for convolutional neural networks.
    Wang et al. (2020d) show that such a TND can be built by leveraging the internal
    response of hidden neurons, which exhibits the Trojan behavior even at random
    noise inputs. Their work offers a practical tool for TrojanNet detection and addresses
    the challenge of How to detect a TrojanNet when having access to training/testing
    data samples is restricted or not allowed? This is a practical scenario because
    it is a common practice for machine learning to leverage a pretrained but potentially
    untrusted neural networks in downstream applications such as transfer learning
    or finetuing.'
