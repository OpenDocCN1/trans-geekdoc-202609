    Thus this would make computation most intensive. Spurred by that, we ask: *Is
    it possible to achieve a robust metamodel by incorporating robust regularization
    into only either meta-update or fine-tuning step (corresponding to \(\gamma_{in}
    = 0\) or \(\gamma_{out} = 0\))?*


    Second, both MAML in (17.1) and AT in (17.2) are challenging bilevel optimization
    problems, which need to call inner optimization routines for fine-tuning and attack
    generation, respectively. Thus we ask whether or not the computationally light
    alternatives of inner solvers, e.g., partial fine-tuning (Raghu et al., 2019)
    and fast attack generation (Wong et al., 2020a), can promise adversarial robustness
    in few-shot learning.


    Third, it has been shown that adversarial robustness can benefit from semisupervised
    learning by leveraging (unlabeled) data augmentation (Carmon et al., 2019; Stanforth
    et al., 2019). Spurred by that, we further ask: *Is it possible to generalize
    robustness-promoting MAML to the setup of semisupervised learning for improved
    accuracy-robustness tradeoff?*


    # **When and how to incorporate robust regularization in MAML?**


    Based on (17.3), we focus on two robustness-promoting meta-training protocols
    proposed by Wang et al. (2021b): (a) R-MAML\(_{\text{both}}\), where robustness
    regularization is applied to *both* fine-tuning and meta-update steps with \(\gamma_{in},
    \gamma_{out} > 0\), and (b) R-MAML\(_{\text{out}}\), where robust regularization
    applied to *meta-update only*, i.e., \(\gamma_{in} = 0\) and \(\gamma_{out} >
    0\). Compared to R-MAML\(_{\text{both}}\), R-MAML\(_{\text{out}}\) is more user-friendly
    since it allows the use of *standard fine-tuning* over the learnt robust metamodel
    when tackling unseen few-shot test tasks (known as meta-testing). In what follows,
    we will show that even if R-MAML\(_{\text{out}}\) does not use robust regularization
    in fine-tuning, it is sufficient to warrant the transferability of robustness
