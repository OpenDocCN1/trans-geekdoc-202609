    samples, but we can sample \(m\) points to estimate \(p_A\) (ratio of points predicted
    as class A) and then use some statistical bounds (e.g., Chernoff bounds) to obtain
    a high probability lower bound of \(p_A\), denoted as \(\underline{p_A}\), and
    then apply Theorem 2 with all \(p_A\) replaced by \(\underline{p_A}\) to obtain
    the certified robustness.'
