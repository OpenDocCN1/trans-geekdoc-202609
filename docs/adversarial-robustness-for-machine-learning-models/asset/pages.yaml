  md: 'Targeted attack (given target \( t \)): \( h(\boldsymbol{s}) = \min_{\lambda
    > 0} \lambda \quad \text { s . t . } \quad f_{\theta} \left( \boldsymbol{x}_0
    + \lambda \frac{\boldsymbol{s}}{\|\boldsymbol{s}\|} \right) = t. \) (3.8)


    In this formulation, \( \boldsymbol{s} \) represents the direction of adversarial
    example, and \( h(\boldsymbol{s}) \) is the distance from \( \boldsymbol{x}_0
    \) to the nearest adversarial example along the direction \( \boldsymbol{s} \).
    The norm \( \|\boldsymbol{s}\| \) in the denominator makes the search vector \(
    \frac{\boldsymbol{s}}{\|\boldsymbol{s}\|} \) having unit length. For untargeted
    attack, \( h(\boldsymbol{s}) \) also corresponds to the distance to the decision
    boundary along the direction \( \boldsymbol{s} \).


    The main idea of this reformulation proposed in (Cheng et al., 2019a) is that
    instead of directly optimizing the adversarial perturbation as in (3.1), we aim
    to find a direction \( \boldsymbol{s} \) such that the worst-case perturbation
    will be along that direction. As \( h(\boldsymbol{s}) \) defined above measures
    the distance to the closest adversarial example along direction \( \boldsymbol{s}
    \), finding the direction of adversarial example can be formulated as the following
    optimization problem:


    \( \min _{\boldsymbol{s}} h(\boldsymbol{s}). \) (3.9)


    Finally, the adversarial example can be found by \( \boldsymbol{x}=\boldsymbol{x}_0+h(\boldsymbol{s}^*)
    \frac{\boldsymbol{s}^*}{\|\boldsymbol{s}^*\|}\), where \( \boldsymbol{s}^* \)
    is the optimal solution of (3.9).


    In the black-box attack setting, we are not able to obtain the gradient of \(
    h \), but we can evaluate the function value of \( h \) using the hard-label queries.
    For simplicity, we focus on untargeted attack here, but the same procedure can
    be applied to targeted attack as well.


    Here we discuss how to compute \( h(\boldsymbol{s}) \) directly without additional
    information. For a given normalized \( \boldsymbol{s} \), this can be computed
    by a coarse-grained search and then a binary search. Taking untargeted attack
    as an example, in coarse-grained search, the algorithm queries the points \( \{\boldsymbol{x}_0+\alpha
    \boldsymbol{s}, \boldsymbol{x}_0+2\alpha \boldsymbol{s}, \dots \)} one by one
    until finding an adversarial example \( f(\boldsymbol{x}+\alpha \boldsymbol{s})
    \neq t_0 \). This means that the boundary lies between \( [\boldsymbol{x}_0+(i-1)\alpha
    \boldsymbol{s}, \boldsymbol{x}_0+i\alpha \boldsymbol{s}] \). We can then enter
    the second phase to conduct a binary search to find the solution within this region.
    Note that there is an upper bound of the first stage if we choose \( \boldsymbol{s}
    \) by the direction of \( \boldsymbol{x}-\boldsymbol{x}_0 \) with some \( \boldsymbol{x}
    \) from another class. This procedure is used to find the initial \( \boldsymbol{s}_0
    \) and corresponding \( g(\boldsymbol{s}_0) \) in our optimization algorithm.
    The entire procedure for computing the \( h \) value is presented in Algorithm
    1. Note that this procedure is query- inefficient since it may take many queries
    in the coarse-grained search until finding the interval contains an adversarial
    example. However, the procedure is guaranteed to find the closest adversarial
    example when the interval is small enough.'
