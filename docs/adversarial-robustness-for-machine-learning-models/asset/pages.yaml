  md: '(namely, at which learning stage) and *how* robust regularization should be
    promoted to strike a graceful balance between generalization/robustness and computation
    efficiency. Note that neither the standard MAML (Finn et al., 2017) nor the standard
    robust training (Madry et al., 2018; Zhang et al., 2019b) is as easy as normal
    training. Besides the algorithmic design in robust MAML, it is also important
    to draw in-depth explanation and analysis on *why* adversarial robustness can
    efficiently be gained in MAML. Wang et al. (2021b) study the problem of adversarial
    robustness in MAML (Yin et al., 2018; Goldblum et al., 2019) and make affirmative
    answers to the above questions on *when, how*, and *why*.


    **MAML framework.** MAML attempts to learn an initialization of model parameters
    (namely, a metamodel) so that a new few-shot task can quickly and easily be tackled
    by fine-tuning this metamodel over a small amount of labeled data. The characteristic
    signature of MAML is its *bilevel learning procedure*, where the fine-tuning stage
    forms a task-specific *inner loop*, whereas the metamodel is updated at the *outer
    loop* by minimizing the validation error of fine-tuned models over cumulative
    tasks. Formally, consider $N$ few-shot learning tasks $\{\mathcal{T}_i\}_{i=1}^N$,
    each of which has a fine-tuning data set $\mathcal{D}_i$ and a validation set
    $\mathcal{D}''_i$, where $\mathcal{D}_i$ is used in the *fine-tuning stage*, and
    $\mathcal{D}''_i$ is used in the *meta-update stage*. Here the superscript ('')
    is preserved to indicate operations/parameters at the meta-update stage. MAML
    is then formulated as the following bilevel optimization problem (Finn et al.,
    2017):


    \(\begin{aligned} \text{minimize}_{\mathbf{w}} & \quad \frac{1}{N} \sum_{i=1}^N
    \ell''_i(\mathbf{w}''_i; \mathcal{D}''_i) \\ \text{subject to} & \quad \mathbf{w}''_i
    = \underset{\mathbf{w}_i}{\text{argmin}} \ \ell_i(\mathbf{w}_i; \mathcal{D}_i,
    \mathbf{w}) \quad \forall i \in [N], \end{aligned}\) (17.1)


    where $\mathbf{w}$ denotes the metamodel to be designed, $\mathbf{w}''_i$ is the
    $\mathcal{T}_i$-specific fine-tuned model, $\ell''_i(\mathbf{w}''_i; \mathcal{D}''_i)$
    represents the validation error using the fine-tuned model, $\ell_i(\mathbf{w}_i;
    \mathcal{D}_i, \mathbf{w})$ denotes the training error when fine-tuning the task-specific
    model parameters $\mathbf{w}_i$ using the task-agnostic initialization $\mathbf{w}$,
    and for ease of notation, $[K]$ represents the integer set $\{1, 2, \dots, K\}$.
    In (17.1) the objective function and the constraint correspond to the meta-update
    e and fine-tuning stages, respectively. The bilevel optimization problem is challenging
    because each constraint calls an inner optimization oracle, which is typically
    instantiated into a $K$-step gradient descent (GD) based solver:


    \(\mathbf{w}_i^{(k)} = \mathbf{w}_i^{(k-1)} - \alpha \nabla_{\mathbf{w}_i} \ell_i(\mathbf{w}_i^{(k-1)};
    \mathcal{D}_i, \mathbf{w}), \ k \in [K], \ \text{with } \mathbf{w}_i^{(0)} = \mathbf{w}.\)'
