  md: 'quotient method (Lax and Terrell, 2014) to evaluate the gradient \(\frac{\partial
    F(x)}{\partial x_i}\) of the \(i\)th component by


    ```

    \(g_i = \frac{F(x + h e_i) - F(x - h e_i)}{2h} \approx \frac{\partial F(x)}{\partial
    x_i}\) (3.2)

    ```


    using a small \(h\), and here \(e_i\) denotes the \(i\)th elementary basis (having
    one at the \(i\)th entry and zero elsewhere). Theoretically this estimation will
    get the exact gradient value when \(h \to 0\), however, in practice taking very
    small \(h\) also results in some numerical error, so one usually choose some small-enough
    value such as \(h = 0.001\).


    Note that the nature of coordinatewise gradient estimation step in (3.2) must
    incur an enormous amount of model queries to obtain the full gradient estimate
    and is hence not query-efficient. To estimate the gradient of dimension \(d\),
    it needs \(2 \cdot d\) model queries to \(F\). For example, the ImageNet dataset
    has \(d = 299 \times 299 \times 3 \approx 270,000\) input dimensions, rendering
    coordinatewise zeroth-order optimization query-inefficient. Therefore, to use
    this coordinatewise gradient estimation, Chen et al. (2017a) uses a coordinate
    descent algorithm to solve the attack objective (3.1), where at each iteration
    the coordinate descent algorithm picks a coordinate \(i\), computes gradient based
    on (3.2), and then update the coordinate by \(x_i \leftarrow x_i - \alpha g_i\),
    where \(\alpha\) is the step size.


    *Random vector based gradient estimation.* The coordinatewise gradient estimation
    mentioned above can be viewed as computing the directional derivative along the
    direction of \(e_i\). However, in standard attacks when the perturbation is bounded
    by small \(\ell_2\) or \(\ell_\infty\) norm, coordinate-wise perturbation is usually
    insufficient, so using coordinate gradient estimation will require a large amount
    of queries. Therefore, query-efficient black-box attacks such as (Tu et al., 2019)
    use the following gradient estimator which computes the directional derivative
    at a randomly sampled direction \(u\):


    ```

    \(g = b \cdot \frac{f(x + \beta u) - f(x)}{\beta} \cdot u,\) (3.3)

    ```


    where \(\beta > 0\) is a smoothing parameter, \(u\) is a unit-length vector that
    is uniformly drawn at random from a unit Euclidean sphere, and \(b\) is a tunable
    scaling parameter that balances the bias and variance trade-off of the gradient
    estimation error.


    To effectively control the error in gradient estimation, we consider a more general
    gradient estimator, in which the gradient estimate is averaged'
