    is the watermark embedding regularizer term, which penalizes the distance between
    the expected value of input gradients and the desired watermark. Before defining
    the embedding regularizer term, we explain the steps that the model vendor needs
    to take prior to embedding the watermark. These steps are as follows:


    +   1. Generating an $N$-bit vector \( b \in \{0, 1\}^N \) to be used as the watermark.

    +   2. Randomly selecting a set $C$ of input neurons to carry the watermark. We
    refer to set $C$ as the *watermark carrier set*, and to neurons in $C$ as *carrier
    nodes*. The gradient of inputs observed on neurons in the career set participates
    in embedding the watermark.

    +   3. Generating an *embedding key* \( K^{N \times |C|} \in [-1, 1]^{N \times
    |C|} \). An embedding key is a transformation matrix that maps the expected gradient
    of carrier nodes to a binary vector of size $N$.

    +   4. Selecting a random target class $T$. Images from class $T$ are used to
    calculate the gradients of carrier nodes.


