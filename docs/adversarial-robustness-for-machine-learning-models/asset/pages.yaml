    2020).


    • Automatic bound propagation: Existing verification methods often focus on feed-forward
    ReLU networks. Only few work tried to extend existing verification methods to
    other models: Ko et al. (2019) extended Crown to recurrent neural networks; and
    Shi et al. (2020) extended Crown to the Transformer architecture. Unfortunately,
