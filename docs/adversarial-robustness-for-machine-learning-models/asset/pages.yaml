    Several other algorithms also exploited the back-propagation process to speed
    up adversarial training. See, for instance, (Zhang et al., 2019a). However, more
    recently, it has been shown that a proper implementation of PGD-based adversarial
    training with only a single step (_k_ = 1) can already achieve good performance.
    The main trick is that instead of initializing the PGD iterate _x_<sub>0</sub>
    from _x_, we should initialize it from _x_ plus a random noise. Wong et al. (2020a)
    showed that if we initialize PGD attack from _x_ plus a random vector sampled
    from Gaussian, adversarial training with a single step can outperform many strong
    baselines (e.g., FreeAdvTrain). This algorithm with 1-step PGD inner iteration
    and random initialization is known as Fast Adversarial Training. By further controlling
    the PGD steps we can then control the tradeoff between speed and robust accuracy.


    # 12.3 Improvements on adversarial training


