  md: 'Without loss of generality, it suffices to denote the target model as a classification
    function parameterized by $\theta$, defined as $f_\theta : [0, 1]^d \mapsto \mathbb{R}^K$,
    that takes a $d$-dimensional scaled data sample as its input and yields a vector
    of prediction scores of all $K$ classes, such as the prediction probabilities
    for each class. The term “soft labels” refers to the fact that an attacker can
    observe the prediction score of each class. We further consider the case of applying
    an entrywise monotonic transformation $M(f_\theta)$ to the output of $f_\theta$
    for black-box attacks, since a monotonic transformation preserves the ranking
    of the class predictions and can alleviate the problem of large score variation
    in $f_\theta$ (e.g., the transformation of probability to log probability is monotonic).


    Here we formulate soft-label black-box targeted attacks using penalty-based loss.
    The formulation can be easily adapted to untargeted attacks. Let $(\mathbf{x}_0,
    t_0)$ denote a natural image $\mathbf{x}_0$ and its ground-truth class label $t_0$,
    and let $(\mathbf{x}, t)$ denote the adversarial example of $\mathbf{x}_0$ and
    the target attack class label $t \neq t_0$. The problem of finding an adversarial
    example can be formulated as an optimization problem taking the generic form of


    ```

    $$\min_{\mathbf{x} \in [0, 1]^d} \text{Dist}(\mathbf{x}, \mathbf{x}_0) + \lambda
    \cdot \text{Loss}(\mathbf{x}, M(f_\theta(\mathbf{x})), t), \quad (3.1)$$

    ```


    where $\text{Dist}(\mathbf{x}, \mathbf{x}_0)$ measures the distortion between
    $\mathbf{x}$ and $\mathbf{x}_0$, $\text{Loss}(\cdot)$ is an attack objective reflecting
    the likelihood of predicting $t = \arg \max_{k \in \{1, \dots, K\}} [M(f_\theta(\mathbf{x}))]_k$,
    $\lambda \ge 0$ is a regularization coefficient, and the constraint $\mathbf{x}
    \in [0, 1]^d$ confines the adversarial image $\mathbf{x}$ to the valid scaled
    data space. Consider the case of additive input perturbation, $\text{Dist}(\mathbf{x},
    \mathbf{x}_0)$ is often evaluated by the $\ell_p$ norm defined as $\text{Dist}(\mathbf{x},
    \mathbf{x}_0) = \|\mathbf{x} - \mathbf{x}_0\|_p$, where $\delta = \mathbf{x} -
    \mathbf{x}_0$ is the additive perturbation to $\mathbf{x}_0$. The attack objective
    $\text{Loss}(\cdot)$ can be the training loss (e.g., cross-entropy) for classification
    or the margin-based C&W loss (Carlini and Wagner, 2017b), as introduced in Chapter
    2. The log operation is often adopted for the entrywise monotonic transformation
    function $M$.


    In the black-box attack setting, the attack objective in (3.1) can be viewed as
    a black-box function $F$. Since only the function values of $F$ are observable,
    unlike white-box attacks, we cannot use gradient-based approaches for solving
    (3.1). A fundamental tool to address this issue is the use of *zeroth-order optimization*
    (ZOO), which follows gradient-based (first-order) optimization rules but uses
    function values at two closeby points to estimate the gradient instead of using
    the true gradient.


    Coordinatewise gradient estimation. As a first attempt to enable gradient-free
    black-box attacks, Chen et al. (2017a) use the symmetric difference'
