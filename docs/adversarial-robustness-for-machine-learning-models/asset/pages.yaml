    # 18.2 Reprogramming general image models for medical image classification


    In this section, we introduce two capabilities of model reprogramming in terms
    of (i) the ability to reprogram a black-box model and (ii) the ability to reprogram
    general image models (e.g., deep neural network classifiers trained on ImageNet)
    for classifying medical images, as shown by Tsai et al. (2020).


    *Black-box and resource-limited settings.* The vanilla AR method (Elsayed et al.,
    2019) assumes complete knowledge of the pretrained (source) model, which precludes
    the ability of reprogramming a well-trained but access-limited ML models such
    as prediction APIs or proprietary softwares that only reveal model outputs based
    on queried data inputs. Moreover, whereas data are crucial to most of ML tasks,
    in some scenarios such as medical applications, massive data collection can be
    expensive, if not impossible, especially when clinical trials, expert annotation,
    or privacy-sensitive data are involved. Consequently, without transfer learning,
    the practical limitation of data scarcity may hinder the strength of complex (large-scaled)
    ML models such as deep neural networks (DNNs). Finally, even with moderate amount
    of data, researchers may not have sufficient computation resources or budgets
    to train a DNN as large as a commercial ML model or perform transfer learning
    on a large pretrained ML model.


    *Black-box reprogramming.* Fig. 18.4 provides an overview of the black-box adversarial
    reprogramming (BAR) method proposed by Tsai et al. (2020). To adapt to the black-box
    setting, zeroth-order optimization (Liu et al., 2020a) on iterative input–output
    model responses is used for optimizing the parameters associated with the input
    transformation functions, similarly to the methodology adopted for black-box evasion
    attacks in Chapter 3. Similarly to the end-to-end reprogramming framework in Section
    18.1, we can use an input transformation function such as a universal trainable'
  merge: -1
  img_proc: true
