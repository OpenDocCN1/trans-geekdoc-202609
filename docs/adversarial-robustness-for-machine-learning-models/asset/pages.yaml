    Hsu et al. (2022) propose a per-sample-based mutual information neural estimator
    (MINE) between a pair of original and modified data samples as an information-theoretic
    similarity measure and a supervision-free approach for generating UAE. Mutual
    information (MI) measures the mutual dependence between two random variables X
    and Z, defined as $I(X, Z) = H(X) - H(X|Z)$, where $H(X)$ denotes the (Shannon)
    entropy of X, and $H(X|Z)$ denotes the conditional entropy of X given Z. Computing
    MI can be difficult without knowing the marginal and joint probability distributions
    ($\mathbb{P}_X$, $\mathbb{P}_Z$, and $\mathbb{P}_{XZ}$). For efficient computation,
    the mutual information neural estimator (MINE) with consistency guarantees is
    proposed by Belghazi et al. (2018). Specifically, MINE aims to maximize the lower
    bound of the exact MI using a model parameterized by a neural network $\theta$
    defined as $I_\theta(X, Z) \leq I(X, Z)$, where $\Theta$ is the space of feasible
    parameters of a neural network, and $I_\theta(X, Z)$ is the neural information
    quantity defined as $I_\theta(X, Z) = \sup_{\theta \in \Theta} \mathbb{E}_{\mathbb{P}_{XZ}}[T_\theta]
    - \log(\mathbb{E}_{\mathbb{P}_X \otimes \mathbb{P}_Z}[e^{T_\theta}])$. The function
    $T_\theta$ is parameterized by a neural network $\theta$ based on the Donsker–Varadhan
    representation theorem (Donsker and Varadhan, 1983). MINE estimates the expectation
    of the quantities above by shuffling the samples from the joint distribution along
    the batch axis or using empirical samples $\{x_i, z_i\}_{i=1}^n$ from $\mathbb{P}_{XZ}$
    and $\mathbb{P}_X \otimes \mathbb{P}_Z$ (the product of marginals). MINE has been
    successfully'
