    # ## 8.3 Convex relaxation in the dual space


    Another way to solve the robustness verification problem (C) is to solve its dual
    problem. Its Lagrangian dual can be written as


    ```

    \( g_C(\mu^{[L]}, \underline{\lambda}^{[L]}, \overline{\lambda}^{[L]}) := \min_{x^{[L+1]},
    z^{[L]}} c^\top x^{(L)} + \sum_{l=0}^{L-1} \mu^{(l)\top}(z^{(l)} - W^{(l)}x^{(l)}
    - b^{(l)}) \quad - \sum_{l=0}^{L-1} \underline{\lambda}^{(l)\top}(x^{(l+1)} -
    \underline{\sigma}^{(l)}(z^{(l)})) + \sum_{l=0}^{L-1} \overline{\lambda}^{(l)\top}(x^{(l+1)}
    - \overline{\sigma}^{(l)}(z^{(l)})). \quad \text{(8.3)}\)

    ```


    By weak duality


    ```

    \( d_C^* := \max_{\mu^{[L]}, \underline{\lambda}^{[L]} \ge 0, \overline{\lambda}^{[L]}
    \ge 0} g_C(\mu^{[L]}, \underline{\lambda}^{[L]}, \overline{\lambda}^{[L]}) \le
    p_C^*, \quad \text{(8.4)}\)

    ```


    but in fact Salman et al. (2019b) showed strong duality under mild conditions,
    which means the equality can hold in most cases.


    Based on this primal-dual relationship, another way to find the lower bound of
    the primal objective is to find a dual solution. When the relaxed bounds \(\underline{\sigma}\)
    and \(\overline{\sigma}\) are linear, the dual objective (8.4) can be further
    simplified. Wong and Kolter (2018) proposed to solve this dual form with the following
    choices of the linear relaxation functions:


    ```

    \(\underline{\sigma}^{(l)}(z(l)) := \alpha^{(l)} z(l), \quad \overline{\sigma}^{(l)}(z(l))
    := \frac{\overline{z}^{(l)}}{\overline{z}^{(l)}-\underline{z}^{(l)}}(z(l) - \underline{z}^{(l)}),\)

    ```


    and \(0 \le \alpha^{(l)} \le 1\) represents the slope of the lower bound. This
    is equivalent to the choices of linear relaxations introduced in Fig. 8.3. When
    \(\alpha^{(l)} = \frac{\overline{z}^{(l)}}{\overline{z}^{(l)}-\underline{z}^{(l)}}\),
    the greedy algorithm also recovers Fast-Lin (Weng et al., 2018a), which explains
    the arrow from Wong and Kolter (2018) to Weng et al. (2018a) in Fig. 8.1. Several
    other relationships between dual algorithms and primal algorithms can be analyzed
    similarly, as discussed in (Salman et al., 2019b).


