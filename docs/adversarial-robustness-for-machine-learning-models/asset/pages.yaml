    Data reconstruction. Data reconstruction using an autoencoder $\Phi$ that learns
    to encode and decode the raw data through latent representations is a standard
    unsupervised learning task. Here we use the default implementation of the following
    four autoencoders to generate UAEs based on the training data samples of MNIST
    and SVHN for data augmentation, retrain the model from scratch on the augmented
    dataset, and report the resulting reconstruction error on the original test set.
    All autoencoders use the $L_2$ reconstruction loss defined as $\|x - \Phi(x)\|_2$.
    The four autoencoders are summarized below.


    +   • Dense autoencoder (Cavallari et al., 2018). The encoder and decoder have
    1 dense layer separately, and the latent dimension is 128/256 for MNIST/SVHN.


    +   • Sparse autoencoder. It has a sparsity enforcer ($L_1$ penalty on the training
    loss) that directs a network with a single hidden layer to learn the latent representations
    minimizing the error in reproducing the input while limiting the number of code
    words for reconstruction. We use the same architecture as Dense Autoencoder for
    MNIST and SVHN.


    +   • Convolutional autoencoder.1 The encoder uses convolution+relu+pooling layers.
    The decoder has reversed layer order with the pooling layer replaced by an upsampling
    layer.


    +   • Adversarial autoencoder (Makhzani et al., 2016). It is composed of an encoder,
    a decoder, and a discriminator. The rationale is to force the distribution of
    the encoded values to be similar to the prior data distribution.


    We also compare the performance of our proposed MINE-based UAE (MINE-UAE) with
    two baselines: (i) $L_2$-UAE, which replaces the objective of minimizing $I_\Theta(x,
    x + \delta)$ with maximizing the $L_2$ reconstruction loss $\|x - \Phi(x + \delta)\|_2$
    in the MinMax attack algorithm while keeping the same attack success criterion;
    (ii) Gaussian augmentation (GA), which zero-mean Gaussian noise with a diagonal
    covariance matrix of the same constant $\sigma^2$ to the training data.


