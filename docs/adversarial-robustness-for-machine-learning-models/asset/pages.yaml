  md: '# Adversary detection


    Another type of defense methods against evasion attacks, which we call _adversary
    detection_, aims to detect the existence of adversarial examples, rather than
    trying to classify them into the correct classes. The main assumption behind these
    methods is that the adversarial examples came from a different distribution compared
    with natural samples, so they could be detected with carefully designed detectors.
    In addition to evasion attacks, similar methodology can be applied to detect other
    types of adversary attacks. In this section, we first discuss adversarial detection
    to testing time adversarial attacks. We then discuss detection methods against
    other attack scenarios.


    # 15.1 Detecting adversarial inputs


    A straightforward way toward adversarial example detection is to build a simple
    binary classifier separating the adversarial examples apart from the clean data.
    However, these methods usually suffer from lack of generalization to unforeseen
    attacks. Therefore an effective detection method is usually based on some characteristics
    of adversarial attacks instead of purely classifying an existing attack. In the
    following, we will introduce several popular detection methods.


    _Density estimation._ A common observation is that adversarial examples often
    lie outside the natural image manifold, and many detection methods are based on
