  md: 'Take image classifiers as an example. For backdoored models, since arbitrary
    images can be misclassified as the same target label by TrojanNet when these inputs
    consisting of the Trojan trigger are used in data poisoning, Wang et al. (2020d)
    hypothesize that there exists a *shortcut* in TrojanNet, leading to *input-agnostic*
    misclassification. Their approach is motivated by exploiting the existing *shortcut*
    for the detection of TrojanNets.


    Trojan perturbation. Given a neural network model, let \(f \in \mathbb{R}^K\)
    be the mapping from the input space to the logits of \(K\) classes. Let \(f_\gamma\)
    denote the logits value corresponding to class \(\gamma\). The final prediction
    is then given by \(\text{argmax}_\gamma f_\gamma\). Let \(r \in \mathbb{R}^d\)
    be the mapping from the input space to neuron''s representation defined by the
    output of the penultimate layer (namely, prior to the fully connected block of
    the model). Given a clean data \(\mathbf{x} \in \mathbb{R}^n\), the poisoned data
    through *Trojan perturbation* \(\boldsymbol{\delta}\) is then formulated as


    \(\hat{\mathbf{x}}(\mathbf{m}, \boldsymbol{\delta}) = (1 - \mathbf{m}) \cdot \mathbf{x}
    + \mathbf{m} \cdot \boldsymbol{\delta}, \quad (15.1)\)


    where \(\boldsymbol{\delta} \in \mathbb{R}^n\) denotes pixelwise perturbations,
    \(\mathbf{m} \in \{0, 1\}^n\) is a binary mask to encode the position where a
    Trojan stamp is placed, and \(\cdot\) denotes the elementwise product. In trigger-driven
    Trojan attacks (Gu et al., 2017; Chen et al., 2017b; Yao et al., 2019), the poisoned
    training data \(\hat{\mathbf{x}}(\mathbf{m}, \boldsymbol{\delta})\) is mislabeled
    to a target class to enforce a backdoor during model training. In clean-label
    Trojan attacks (Shafahi et al., 2018; Zhu et al., 2019a), the variables \((\mathbf{m},
    \boldsymbol{\delta})\) are designed to misalign the feature representation \(r(\hat{\mathbf{x}}(\mathbf{m},
    \boldsymbol{\delta}))\) with \(r(\mathbf{x})\) but without perturbing the label
    of the poisoned training data. We call this model a TrojanNet if it is trained
    over poisoned training data given by (15.1).


    Data-limited TrojanNet detector (DL-TND): Wang et al. (2020d) address the problem
    of TrojanNet detection with the prior knowledge on model weights and a few clean
    test images, at least one sample per class. Let \(\mathcal{D}_k\) denote the set
    of data within the (predicted) class \(k\), and let \(\mathcal{D}_{k-}\) denote
    the set of data with prediction labels different from \(k\). Wang et al. (2020d)
    propose to design a detector by exploring how the per-image adversarial perturbation
    is coupled with the universal perturbation due to the presence of backdoor in
    TrojanNets. The rationale behind that is the per-image and universal perturbations
    would maintain a strong similarity while perturbing images toward the Trojan target
    class due to the existence of a Trojan shortcut. The framework is illustrated
    in Fig. 15.4(a).


    Untargeted universal perturbation. Given images \(\{\mathbf{x}_i \in \mathcal{D}_{k-}\}\),
    the goal is to find a universal perturbation tuple \(\mathbf{u}^{(k)} = (\mathbf{m}^{(k)},
    \boldsymbol{\delta}^{(k)})\) such that the predictions'
