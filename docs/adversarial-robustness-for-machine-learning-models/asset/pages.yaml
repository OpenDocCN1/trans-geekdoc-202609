    Assume that the smoothed classifier predicts correctly on x, which implies pA(x)
    > pB(x) and there exists a positive gap pA(x) − pB(x) > 0. We then want to show
    that when ||δ|| is small enough, there’s still a positive gap between pA(x + δ)
    − pB(x + δ). Note that the actual value of pA(x + δ) − pB(x + δ) depends on the
