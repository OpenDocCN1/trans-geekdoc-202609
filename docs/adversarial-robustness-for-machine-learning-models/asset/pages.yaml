- pgno: 153
  md: 'which is a very important quantity: when all elements of $\underline{m}(x,
    \epsilon) > 0$, \(x\) is verifiably robust for any perturbation within \(B(x)\).
    The bound \(\underline{m}(x, \epsilon)\) can be obtained by an incomplete neural
    network verification algorithm, such as convex adversarial polytope, interval
    bound propagation (IBP), or CROWN, as introduced in Part 3. Based on this formulation,
    Wong and Kolter (2017) showed that for the cross-entropy (CE) loss,


    $$\max_{x \in B(x)} L(f(x); y; \theta) \le L(f(-\underline{m}(x, \epsilon); y;
    \theta)).$$ (14.4)


    Therefore we can solve the upper bound in (14.4) to minimize a tractable upper
    bound of the inner maximization problem in (14.2). Note that to make this training
    work, the verification algorithm used to obtain \(\underline{m}(x_k, \epsilon)\)
    has to be *differentiable*. In certified robust training, at each iteration when
    a batch of samples are selected, we first conduct verification to form \(\underline{m}(x_k,
    \epsilon)\) for every \(x_k\) in the batch and then perform back-propagation to
    compute the gradient \(\nabla_\theta L(f(-\underline{m}(x_k, \epsilon); y; \theta))\)
    to conduct parameter updates. In what follows, we will introduce several effective
    verification methods that can be used for certified robust training under this
    framework.


    # 14.2 Existing algorithms and their performances


    There are two popular verification algorithms that have been successfully adopted
    in certified robust training: interval bound propagation (IBP) and linear relaxation-based
    training. Among them, IBP produces very loose bound but lead to surprisingly good
    results in certified training; linear relaxation methods provide much tighter
    bounds than IBP but often lead to unstable training. Therefore some recent methods
    also tried to combine these two bounds. We will discuss these approaches below.


    # Interval bound propagation (IBP)


    Interval bound propagation uses a simple bound propagation rule. The idea is to
    obtain an upper and lower bound of each neuron layer-by-layer in forward propagation.
    For the input layer, we set \(x_L \le x \le x_U\) elementwise. We then propagate
    the bound for each neuron to the next layer. When passing through the linear layer
    \(z^{(l)} = Wh^{(l-1)} + b^{(l)}\), assume \(\bar{h}^{(l-1)}, \underline{h}^{(l-1)}\)
    are the (element-wise) upper and lower bounds of \(h^{(l-1)}\), we can obtain
    the'
