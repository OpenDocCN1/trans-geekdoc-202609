  md: 'over $q$ random directions $\{\mathbf{u}^{(i)}\}_{j=1}^q$, that is,


    \(\overline{\boldsymbol{g}} = \frac{1}{q} \sum_{j=1}^q \boldsymbol{g}^{(i)},\)
    (3.4)


    where $\boldsymbol{g}^{(i)}$ is a gradient estimate defined in (3.3) with \(\mathbf{u}
    = \mathbf{u}^{(i)}\). The use of multiple random directions can reduce the variance
    of $\overline{\boldsymbol{g}}$ in (3.4) for convex loss functions (Duchi et al.,
    2015; Liu et al., 2018a).


    Below we establish an error analysis of the averaged random gradient estimator
    in (3.4) for studying the influence of the parameters $b$ and $q$ on estimation
    error and query efficiency.


    **Theorem 1.** Let $F : \mathbb{R}^d \mapsto \mathbb{R}$ be a differentiable function
    with $L$-Lipschitz gradient \(\nabla F\).<sup>3</sup> Then the mean squared estimation
    error of $\overline{\boldsymbol{g}}$ in (3.4) is upper bounded by


    \(\mathbb{E}\|\overline{\boldsymbol{g}} - \nabla F(\mathbf{x})\|_2^2 \le 4\left(
    \frac{b^2}{d^2} + \frac{b^2}{dq} + \frac{(b-d)^2}{d^2} \right)\|\nabla F(\mathbf{x})\|_2^2
    + \frac{2q+1}{q} b^2 \beta^2 L^2.\) (3.5)


    Proof. See Section 3.7.


    Here we highlight the important implications based on Theorem 1: (i) The error
    analysis holds when $F$ is nonconvex; (ii) In neural network implementations,
    the true gradient $\nabla F$ can be viewed as the numerical gradient obtained
    via back-propagation; (iii) For any fixed $b$, selecting a small $\beta$ (e.g.,
    $\beta = 1/d$ can effectively reduce the last error term in (3.5), and we therefore
    focus on optimizing the first error term; (iv) The first error term in (3.5) exhibits
    the influence of $b$ and $q$ on the estimation error and is independent of $\beta$.
    We further elaborate on (iv) as follows. Fixing $q$ and letting $\eta(b) = \frac{b^2}{d^2}
    + \frac{b^2}{dq} + \frac{(b-d)^2}{d^2}$ be the coefficient of the first error
    term in (3.5), the optimal $b$ that minimizes $\eta(b)$ is $b^* = \frac{dq}{2q+d}$.
    For query efficiency, we would like to keep $q$ small, which then implies $b^*
    \approx q$ and $\eta(b^*) \approx 1$ when the dimension $d$ is large. On the other
    hand, as $q \to \infty$, $b^* \approx d/2$ and $\eta(b^*) \approx 1/2$, which
    yields a smaller error upper bound but is query-inefficient. We also note that
    by setting $b=q$ the coefficient $\eta(b) = \frac{b^2}{d^2} + \frac{b^2}{dq} +
    \frac{(b-d)^2}{d^2} \approx 1$ and thus is independent of the dimension $d$ and
    parameter $q$.


    <sup>3</sup> A function $W$ is $L$-Lipschitz if \(\|W(\mathbf{w}_1) - W(\mathbf{w}_2)\|_2
    \le L\|\mathbf{w}_1 - \mathbf{w}_2\|_2\) for all $\mathbf{w}_1, \mathbf{w}_2$.
    For neural networks with ReLU activations, $L$ can be derived from the model weights
    (Szegedy et al., 2014).'
