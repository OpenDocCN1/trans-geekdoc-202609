    # Data augmentation for unsupervised machine learning


    In addition to studying the failure modes in machine learning models and systems,
    this chapter introduces how a type of adversarial examples can be used as an efficient
    data augmentation tool to improve the generalization and robustness for unsupervised
    machine learning tasks. When using these unsupervised adversarial examples as
    a simple plug-in data augmentation tool for model retraining, significant improvements
    are consistently observed across different unsupervised tasks and datasets, including
    data reconstruction, representation learning, and contrastive learning.


    # 21.1 Adversarial examples for unsupervised machine learning models


    Despite of a plethora of adversarial attacking algorithms, the design principle
    of existing methods is primarily for supervised learning models, requiring either
    the true label or a targeted objective (e.g., a specific class label or a reference
    sample). Some recent works have extended to the semisupervised setting by leveraging
    supervision from a classifier (trained on labeled data) and using the predicted
    labels on unlabeled data for generating (semisupervised) adversarial examples
    (Miyato et al., 2018; Zhang et al., 2019b; Stanforth et al., 2019; Carmon et al.,
    2019). On the other hand, recent advances in unsupervised and few-shot machine
    learning techniques show that task-invariant representations can be learned and
    contribute to downstream tasks with limited or even without supervision (Ranzato
    et al., 2007; Zhu and Goldberg, 2009; Zhai et al., 2019), which motivates the
    study by Hsu et al. (2022) regarding their robustness. The goal is to provide
    efficient robustness evaluation and data augmentation techniques for unsupervised
    (and self-supervised) machine learning models through unsupervised adversarial
    examples (UAEs). Table 21.1 summarizes the fundamental difference between conventional
    supervised adversarial examples and our UAEs. Notably, the UAE generation is supervision-free
    because it solely uses an information-theoretic similarity measure and the associated
    unsupervised learning objective function. It does not use any supervision such
    as label'
