    input \(\mathbf{x}_i\) for \( i \in \{1, 2, \dots, N\} \). Here \( N \) denotes
    the number of random images used in TrojanNet detection. We then detect if a model
    is TrojanNet by investigating the change of logits outputs with respect to \(\mathbf{x}_i\)
    and \(\hat{\mathbf{x}}_i(\mathbf{p}^{(i)})\), respectively. For each label \(
    k \in [K] \), we obtain


    \( L_k = \frac{1}{N} \sum_i^N [f_k(\hat{\mathbf{x}}_i(\mathbf{p}^{(i)})) - f_k(\mathbf{x}_i)].
    \) (15.8)


    The decision of TrojanNet with the target label \( k \) is then made according
    to \( L_k \ge T_2 \) for a given threshold \( T_2 \).


    Numerical experiments. As reported by Wang et al. (2020d), the neural network
    models include VGG16 (Simonyan and Zisserman, 2014), ResNet-50 (He et al., 2016),
