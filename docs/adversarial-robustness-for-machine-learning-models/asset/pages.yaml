    # ## 2.6 Attacks with different \(\ell_p\) norms


    For computer vision, the commonly used \(\ell_p\) norms for adversarial perturbations
    include \(\ell_\infty\), \(\ell_2\), \(\ell_1\), and \(\ell_0\) norms.\(^1\) The
    family of \(\ell_p\) norms carry physical meanings when crafting adversarial examples.
    The \(\ell_\infty\) norm confines the maximal change in all dimensions, the \(\ell_2\)
    norm measures the Euclidean distance between \(x\) and \(x_0\), the \(\ell_1\)
    norm measures the sum of total changes (in absolute value) between \(x\) and \(x_0\),
    and the \(\ell_0\) norm measures the number of modified elements (e.g., modified
    pixels for images). Depending on the context, we can use mixed norms for adversarial
    attacks, either in the form of constraints or penalty functions in the optimization
    formulation. For instance, Chen et al. (2018b) proposed the elastic-net attack
    to deep neural networks (EAD attack), which uses a mixture of \(\ell_1\) and \(\ell_2\)
    norms to find sparse adversarial examples and is shown to improve the attack performance
    of C&W attack. Su et al. (2019) proposed an \(\ell_0\)-norm based attack that
    only modifies few pixels to cause prediction changes. We can also leverage the
    convolution filters and use group norms to design structured adversarial attacks
    as proposed by Xu et al. (2019b).


    # ## 2.7 Universal attack


    Up to now, all the attacks we introduced are generating a perturbation \(\Delta\)
    for each image, and the perturbations for each image are different. An interesting
    question studied in the literature is “Can we use the same adversarial perturbation
    on all the images to fool the victim model?” Moosavi-Dezfooli et al. (2017) first
    introduced this concept and call it *universal adversarial perturbation*. Note
    that the perturbation, although universal to all the images, is designed for each
    particular machine learning model. Therefore the universal perturbation designed
    for one model may not generalize'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'to another model. Finding the universal perturbation can make attack more efficient
    in real time and will reveal the weakness of a particular model across all the
    images.


    The problem of generating the universal adversarial perturbation for a model F
    can also be formulated as an optimization problem. Instead of considering only
    one image, we have to consider a set of images, denoted by D. Both constrained
    and unconstrained optimization formulations can then be generalized by considering
    the overall loss on multiple examples. For instance, the constrained form in (2.1)
    can be generalized to the universal attack setting as


    ```

    argmax_{\Delta} \sum_{x \in D} g(\mathbf{x} + \Delta) \text{ s.t. } \|\Delta\|_p
    \le \epsilon. \quad (2.12)

    ```


    The optimizer of this problem will then be a small perturbation that can successfully
    attack as many images as possible. Similarly, FGSM or PGD attack can be derived
    to solve this problem. Moreover, we can also generalize the unconstrained form
    (2.9) to the universal attack setting. Wang et al. (2021a) improve the performance
    of universal attack over (2.12) by using a min–max optimization solver.


    # 2.8 Adaptive white-box attack


    In early days, in the research community, there are active and rolling discussions
    on how claiming a defense is effective against an attack, because the conclusion
    will differ significantly based on the action order of the attacker and defender,
    which is an important specification of the threat model. If the attacker makes
    the first move by creating adversarial examples, and later the defender comes
    into discern those generated adversarial examples, such as using techniques based
    on input filtering or data reconstruction prior to data inference, then many attacks
    can be alleviated or mitigated. On the other hand, if the defender makes the first
    move, and the attacker knows the defense in place, then many defenses were shown
    to be ineffective, or “broken”, in the latter setting (Carlini and Wagner, 2017a;
    Athalye et al., 2018; Carlini et al., 2019a).


    The latter setting is known as the adaptive white-box attack setting, which essentially
    assumes that the defense is totally transparent to the attacker (other than some
    uncontrollable randomness) when crafting adversarial attacks. This setting may
    be unrealistic for implementing practical attacks, but it offers honest (worst-case)
    assessment about the true robustness of the'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'protected model against adversarial attacks beyond the advantage from the information
    asymmetry between the attacker and defender. Otherwise, it is argued that models
    that are robust in the first setting may give a false sense of security or robustness
    if they are not robust against adaptive attacks (Carlini and Wagner, 2017a; Athalye
    et al., 2018; Carlini et al., 2019a). One typical example is the so-called “gradient
    obfuscation” effect brought by defenses that confuse gradient-based attacks due
    to information obfuscation (e.g., overly smooth or noisy gradients on the loss
    landscape in the input space) as discussed by Athalye et al. (2018). However,
    an attacker that is aware of the defense mechanism can propose advanced methods
    or adopt non-gradient-based attacks to render these defenses ineffective. Carlini
    et al. (2019a) provide many principles on evaluating adversarial robustness based
    on adaptive attacks.


