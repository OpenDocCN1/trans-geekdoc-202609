    # 3.5 Attack dimension reduction


    Different from the first-order convergence results, the convergence rate of zeroth-order
    gradient descent methods has an additional multiplicative dimension-dependent
    factor d. In the convex loss setting the rate is O(√d/T), sufficiently close to
    the optimal value, where T is the number of iterations (Nesterov and Spokoiny,
    2017; Liu et al., 2018a; Gao et al., 2014; Wang et al., 2018b). The same convergence
    rate has also been found in the nonconvex setting (Ghadimi and Lan, 2013). The
    dimension-dependent convergence factor d suggests that vanilla black-box attacks
    using gradient estimations can be query inefficient when the (vectorized) image
    dimension d is large, due to the curse of dimensionality in convergence.


    To reduce the attack dimension and improve query efficiency in black-box attacks,
    Tu et al. (2019) propose to perform gradient estimation from a reduced dimension
    d′ < d to improve query efficiency. Specifically, as illustrated in Fig. 3.2,
    the additive perturbation to an image x0 is actually implemented through a “decoder”
    D : R^d′ → R^d such that x = x0 + D(δ′), where δ′ ∈ R^d′. In other words, the
    adversarial perturbation δ ∈ R^d to x0 is in fact generated from a dimension-reduced
    space with an aim of improving query efficiency due to the reduced dimension-dependent
    factor in the convergence analysis. The AutoZOOM method proposed by Tu et al.
    (2019), which is short for Autoencoder-based Zeroth-Order Optimization Method,
    provides two modes for such a decoder D:'
