    = \text{arg max}_i[\text{Pred}(\delta)] \); that is, \( x_0 \) and \( \delta \)
    will have the same top-1 prediction class \( t_0 \), indicating that the removed
    perturbation \( \delta \) is representative of the model prediction on \( x_0
    \). Similarly to finding pertinent negatives, we formulate finding pertinent positives
    as the following optimization problem:


    ```

    \(\text{min}_{\delta \in \mathcal{X} \cap x_0} c \cdot f_k^\text{pos}(x_0, \delta)
    + \beta \|\delta\|_1 + \|\delta\|_2^2 + \gamma \|\delta - \text{AE}(\delta) \|_2^2,\)
    (19.3)

    ```


    where the loss function \( f_k^\text{pos}(x_0, \delta) \) is defined as


    ```

    \( f_k^\text{pos}(x_0, \delta) = \text{max}\{ \text{max}_{i \neq t_0}[\text{Pred}(\delta)]_i
    - [\text{Pred}(\delta)]_{t_0}, -\kappa \}.\) (19.4)

    ```


    In other words, for any given confidence \( \kappa \geq 0 \), the loss function
    \( f_k^\text{pos} \) is minimized when \( [\text{Pred}(\delta)]_{t_0} \) is greater
    than \( \text{max}_{i \neq t_0} [\text{Pred}(\delta)]_i \) by at least \( \kappa
    \).


