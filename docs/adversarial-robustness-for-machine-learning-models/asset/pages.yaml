- pgno: 203
  md: 'create positive samples of the same image from aggressive viewpoints and then
    acquire data representations by maximizing agreement between positives while contrasting
    with negatives. However, as adversarial robustness becomes vital in image classification,
    it remains unclear whether or not CL is able to preserve robustness to downstream
    tasks. The main challenge is that in the “self-supervised pretraining + supervised
    finetuning” paradigm, adversarial robustness is easily forgotten due to a learning
    task mismatch from pretraining to finetuning. We call such challenge “cross-task
    robustness transferability”. To address the above problem, Fan et al. (2021) show
    that: (i) the design of contrastive views matters; high-frequency components of
    images are beneficial to improving model robustness; and (ii) augmenting CL with
    pseudo-supervision stimulus (e.g., resorting to feature clustering) helps preserve
    robustness without forgetting. They further propose ADVCL, a novel adversarial
    contrastive pretraining framework, to enhance cross-task robustness transferability
    without loss of model accuracy and finetuning efficiency. We will introduce this
    framework in this section.


    Fan et al. (2021) focus on the study of accomplishing robustness enhancement using
    CL without losing its finetuning efficiency, e.g., via a standard linear finetuner.
    Some relevant works such as (Jiang et al., 2020; Kim et al., 2020) integrate adversarial
    training with CL. However, the achieved adversarial robustness at downstream tasks
    largely relies on the use of advanced finetuning techniques, either adversarial
    full finetuning (Jiang et al., 2020) or adversarial linear finetuning (Kim et
    al., 2020). Fan et al. (2021) find that self-supervised learning (including the
    state-of-the-art CL) suffers a new robustness challenge called “cross-task robustness
    transferability”, which was largely overlooked in the previous work; that is,
    there exists a task mismatch from pretraining to finetuning (e.g., from CL to
    supervised classification) so that adversarial robustness is not able to transfer
    across tasks even if pretraining datasets and finetuning datasets are drawn from
    the same distribution. Different from supervised/semi-supervised learning, this
    is a characteristic behavior of self-supervision when being adapted to robust
    learning. As shown in Fig. 17.2, their ADVCLwork advances CL in the adversarial
    context, and the proposed method outperforms all state-of-the-art baseline methods,
    leading to a substantial improvement in both robust accuracy and standard accuracy
    using either the lightweight standard linear finetuning or end-to-end adversarial
    full finetuning.


