  md: 'LTRC-examples. Finally, in addition to enhancing the robustness of C-examples
    on ② Pruned Models, it is desirable to exhibit low-transferability to ③ Other
    Models. Therefore the RC-examples are further improved by enforcing low transferability,
    named the *low-transferability RC-examples* (*LTRC-examples*). In this way, we
    can improve the capability of C-examples in detection for *false positive* cases,
    where positive means claiming the model ownership as ours in IP protection.


    The frequency analysis (Guo et al., 2018; Sharma et al., 2019; Cheng et al., 2019b)
    suggests that low-frequency components can improve transferability of adversarial
    examples. Inspired by that, we propose to leverage high-frequency components to
    achieve C-examples with low transferability. Specifically, we can apply a frequency
    mask on the *discrete cosine transform* (DCT) (Rao and Yip, 2014) to implement
    a high-pass filter in the frequency domain of the C-example. As an important tool
    in signal processing, the DCT decomposes a given signal into cosine functions
    oscillating at different frequencies and amplitudes. For a 2D image, the DCT performed
    as $\omega = \text{DCT}(\mathbf{x})$ can transform the image $\mathbf{x}$ into
    the frequency domain, and $\omega_{(i,j)}$ is the magnitude of its corresponding
    cosine functions with the values of $i$ and $j$ representing frequencies, where
    smaller values mean lower frequencies. The DCT is invertible, and the inverse
    DCT (IDCT) is denoted as $\mathbf{x} = \text{IDCT}(\omega)$. Note that Wang et
    al. (2021d) apply DCT and IDCT for different color channels independently.


    Inspired by the observation that the low frequencies play a more important role
    in machine classification and therefore are more transferable, Wang et al. (2021d)
    propose to filter out these components to effectively lower the fingerprint transferability.
    To demonstrate this, a high-pass frequency mask shown in Fig. 20.2 is imposed,
    where the high-frequency band size $k$ controls the range of the filtered low-frequency
    components. The frequency mask is designed to be a 2D matrix with elements being
    either 0 or 1, i.e., $\mathbf{m} \in \{0, 1\}^{H \times W}$, which performs elementwise
    product with the DCT of C-example. At each iteration step to generate the fingerprints,
    the high-pass mask sets the low-frequency components to 0, i.e., $\omega_{(i,j)}
    = 0$ if $1 \le i+j \le k$, while keeping the rest of the high-frequency components.
    By using the high-pass frequency mask the LTRC-example at the $(t+1)$th iteration
    step can be derived by


    $$\mathbf{x}^{t+1} = \text{HighPass}\left\{ \mathbf{Clip} \left( \mathbf{x}^t
    - \alpha \cdot \text{sign} \left( \nabla_{\mathbf{x}} \text{Loss}_{\theta+\Delta}(\mathbf{x}^t,
    \text{I}) \right) \right) \right\}, \tag{20.8}$$'
