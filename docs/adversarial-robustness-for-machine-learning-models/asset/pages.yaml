    # 3.4 Transfer attack


    Generally speaking, transfer attack means generating adversarial examples from
    a source model to attack a target model. This typically corresponds to the “no-box”
    setting, where an attacker has no information about the target model and takes
    another pretrained model as a source to generate adversarial examples. Although
    the models can be vastly different, some adversarial examples can transfer from
    one model to another (Papernot et al., 2016; Liu et al., 2017b), and several attempts
    have been made, most empirically, to study how to generate more transferable adversarial
    examples. For instance, Dong et al. (2018) boosted the transferability by integrating
    the momentum term into the iterative process. Other techniques like data augmentations
    (Xie et al., 2019), exploiting gradients of skip-connection (Wu et al., 2020a),
    also contribute to stronger transferable attacks. A large-scale attack transferability
    study among 18 pretrained ImageNet models is conducted by Su et al. (2018). Instead
    of using pretrained surrogate models, it is also possible to construct a “meta-surrogate
    model” based on a set of pretrained surrogate models, where the meta-surrogate
    model can generate more transferable adversarial examples. This can be done with
    a meta-learning framework, as proposed by Qin et al. (2021).


    In the soft-label black-box attack setting, Papernot et al. (2017) propose to
    train a substitute model using iterative model queries, perform white-box attacks
    on the substitute model, and leverage the transferability of adversarial examples
    to attack the target model. However, training a representative surrogate for a
    state-of-the-art classifier is challenging due to the complicated and nonlinear
    classification rules of the machine learning model (e.g., neural networks) and
    high dimensionality of the underlying dataset. The performance of black-box attacks
    can be severely degraded'
