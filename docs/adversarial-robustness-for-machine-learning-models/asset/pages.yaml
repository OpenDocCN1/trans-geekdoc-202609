- pgno: 218
  md: '$y_t \in \mathcal{Y}_T$, its class prediction will be the averaged class prediction
    over the set of source labels assigned to it. We use the term $P(h(\mathcal{Y}_S)|f_S(\mathcal{H}(x_t;
    \theta)))$ to denote the prediction probability of the target task on the associated
    ground-truth target label $y_t = h(\mathcal{Y}_S)$. Finally, we learn the optimal
    parameters $\theta^*$ for data input reprogramming by optimizing the following
    objective:


    $$ \theta^* = \underset{\theta}{\text{argmin}} \underbrace{-\log P(h(\mathcal{Y}_S)|f_S(\mathcal{H}(x_t;
    \theta)))}_{\text{V2S loss } \triangleq L}, \quad (18.3) $$ where $h(\mathcal{Y}_S)
    = y_t$


    The optimization will be implemented by minimizing the empirical loss (V2S loss
    $L$) evaluated on all target-domain training data pairs $\{x_t, y_t\}$ for solving
    $\theta^*$.


    In practice, Yang et al. (2021b) found that a many-to-one label mapping can improve
    the reprogramming accuracy when compared to a one-to-one label mapping. Below
    we make a concrete example on how a many-to-one label mapping is used for V2S
    reprogramming. Consider the case of reprogramming spoken-term AM for ECG classification.
    We can choose to map multiple (but nonoverlapping) classes from the source task
    (e.g., “yes”, “no”, “up”, “down” in AM classes) to every class from the target
    task (e.g., “Normal” or “Ischemia” in ECG classes), leading to a specified mapping
    function $h$. Let $\mathcal{B} \subset \mathcal{Y}_S$ denote the set of source
    labels mapping to the target label $y_t \in \mathcal{Y}_T$. Then the class prediction
    of $y_t$ based on V2S reprogramming is the aggregated prediction over the assigned
    source labels defined as


    $$ P(y_t|f_S(\mathcal{H}(x_t; \theta)) = \frac{1}{|\mathcal{B}|} \sum_{y_s \in
    \mathcal{B}} P(y_s|f_S(\mathcal{H}(x_t; \theta)), \quad (18.4) $$


    where $|\mathcal{B}|$ denotes the number of labels in $\mathcal{B}$.


    Algorithm 5 summarizes the training procedure of the V2S reprogramming.


    *Experimental results.* Two pretrained voice models V2S$_a$ and V2S$_u$ are used
    as source models for reprogramming. Fig. 18.2 shows their end-to-end model architecture,
    and we refer for their details to (Yang et al., 2021b). Testing on a standard
    UCR time series classification benchmark (Dau et al., 2019), it is shown by Yang
    et al. (2021b) that V2S either outperforms or is tied with the best reported results
    on 19 out of 30 datasets, suggesting that V2S is a principled and effective approach
    for time series classification.'
