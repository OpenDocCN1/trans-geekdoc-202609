    # ## 1.4 Motivating examples


    This section provides two motivating examples to highlight the importance of studying
    adversarial robustness for machine learning.


    # ### Adversarial robustness ≠ accuracy – what standard accuracy fails to tell


    The prediction accuracy has been the long-lasting and sole standard for comparing
    the performance of different image classification models, including the yearly
    ImageNet competition (Russakovsky et al., 2015) held from 2010 to 2017. Many significant
    advances in the architecture design and training of neural networks can be attributed
    to this task. In the competition a model with a higher standard accuracy (e.g.,
    top-1 or top-5 prediction accuracy on the test dataset) implies that a model is
    “better”. However, surprisingly, (Su et al., 2018) performed a large-scale adversarial
    robustness study on 18 different publicly available ImageNet models and'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'discovered that the empirical \(\ell_2\) and \(\ell_\infty\) distortion metrics
    scale linearly with the logarithm of classification error. Their results suggest
    that when using the standard accuracy as the sole metric to benchmark, the model
    performance may give a false sense of progress in machine learning, because the
    models having higher standard accuracy (lower classification error) are also shown
    to be more sensitive to input perturbation leading to prediction changes.


    For each of the 18 models, Su et al. (2018) apply different attacks to generate
    adversarial examples for a common set of originally correctly classified data
    samples to find out the smallest additive distortions (measured by \(\ell_p\)
    norms) required to flip the model prediction. They study the empirical relation
    between adversarial robustness and (standard) accuracy of different ImageNet models,
    where the robustness is evaluated in terms of the minimum \(\ell_\infty\) and
    \(\ell_2\) distortion metrics from successful I-FGSM (Kurakin et al., 2016) and
    C&W (Carlini and Wagner, 2017b) attacks, respectively.


    The scatter plots of distortions v.s. top-1 prediction accuracy are displayed
    in Fig. 1.1. We define the classification error as 1 minus top-1 accuracy (denoted
    as 1-acc). By regressing the distortion metric with respect to the classification
    error of networks on the Pareto frontier of robustness-accuracy distribution (i.e.,
    AlexNet, VGG 16, VGG 19, ResNet_v2_152, Inception_ResNet_v2, and NASNet), they
    find that the distortion scales linearly with the logarithm of classification
    error. That is, the distortion and classification error has the following relation:
    distortion = \(a + b \cdot \log(\text{classification-error})\). The fitted parameters
    of \(a\) and \(b\) are given in the captions of Fig. 1.1. Taking I-FGSM attack
    (Kurakin et al., 2016) as an example, the linear scaling law suggests that to
    reduce the classification error by a half, the \(\ell_\infty\) distortion of the
    resulting network will be expected to reduce by approximately 0.02, which is roughly
    60% of the AlexNet distortion. Following this trend, if we naively pursue a model
    with low test error, then the model''s adversarial robustness may suffer. Consequently,
    when designing new networks for ImageNet, standard accuracy is not sufficient
    to characterize the model performance against adversarial attacks. Similar trend
    is observed by Su et al. (2018) when using an attack-agnostic adversarial robustness
    metric (the CLEVER score (Weng et al., 2018b)) as the \(y\)-axis.


    This undesirable trade-off between standard accuracy and adversarial robustness
    suggests that one should employ the techniques discussed in this book to evaluate
    and improve adversarial robustness for machine learning.'
