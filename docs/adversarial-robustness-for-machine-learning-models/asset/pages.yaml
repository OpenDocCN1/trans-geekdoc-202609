- pgno: 34
  md: 'Here $\text{sign}(\cdot) \in \{+1, -1\}$ denotes elementwise sign values. This
    is the one-step steepest descent update, and surprisingly, it has been found that
    even this simple step is very effective for constructing adversarial examples.
    This rule in (2.7) is known as the fast gradient sign method (FGSM), first proposed
    by Goodfellow et al. (2015).


    A straightforward extension of FGSM is to run steepest descent for multiple iterations.
    In this case, we need to choose a step size $\alpha$ for each iteration, that
    is, from the current iteration $\boldsymbol{x}_t$ we allow the update in $\{\boldsymbol{x}_{t+1}
    : \|\boldsymbol{x}_{t+1} - \boldsymbol{x}_t\|_\infty \le \alpha\}$ and minimize
    the linear approximation within this region. This will lead to the same subproblem
    with (2.6) with $\epsilon$ being replaced by $\alpha$, so the optimal update is
    $\boldsymbol{x}_t + \alpha \text{sign}(\nabla g(\boldsymbol{x}_t))$. Another issue
    when running multiple iterations is that the variables may go outside the constraint
    set $B(\boldsymbol{x}_0)$ after few iterations. Therefore we have to further project
    the update back to the constraint set, leading to the following iterative steepest
    descent update:


    \(\boldsymbol{x}_{t+1} = \Pi(\boldsymbol{x}_t + \alpha \text{sign}(\nabla g(\boldsymbol{x}_t)))
    \quad \forall t=0, \dots, T-1.\) (2.8)


    If we run this update for $T$ iterations, then the final solution $\boldsymbol{x}_T$
    is supposed to be better than FGSM. This is called the iterative FGSM (I-FGSM)
    attack by Kurakin et al. (2016), also called the (basic) PGD attack by Madry et
    al. (2018). This PGD attack is one of the most effective first-order (gradient-based)
    algorithms for constructing adversarial examples. Furthermore, it is very easy
    to incorporate in the adversarial training algorithm to train a robust model,
    which will be discussed in Chapter 11.


    One issue for running PGD attack is to choose a suitable step size $\alpha$. If
    $\alpha < \frac{\epsilon}{T}$, then the solution $\boldsymbol{x}_T$ will not reach
    the boundary of $B(\boldsymbol{x}_0)$, and so the attack will not be very effective.
    In practice, $\alpha$ is usually set as a number slightly larger than $\frac{\epsilon}{T}$.
    Its value can also vary per attack iteration. Also, one can randomly initialize
    $\boldsymbol{x}_0$ inside $B(\boldsymbol{x}_0)$ and possibly repeat this process
    multiple times for finding adversarial examples.


    # ## 2.4 Transforming to an unconstrained optimization problem


    Instead of solving the constrained optimization problem in (2.1), we can actually
    transform it into an unconstrained optimization problem and apply standard gradient
    descent or other first-order methods (without projection) to solve the problem.
    This is done by solving the following "soft-constrained" form, where we remove
    the constraint and add a penalty in'
