  md: '# # CHAPTER 8

    # Incomplete neural network verification


    As mentioned in the previous section, solving the complete neural network verification
    problem is challenging and time-consuming, and earlier works that focused on complete
    verification usually do not scale to problems beyond a hundred neurons. Further,
    it has been shown that complete verification for ReLU networks is NP-complete
    (Katz et al., 2017). Motivated by the fundamental limit and practical difficulties,
    incomplete verification algorithms were rised since 2018, where they aim to provide
    sound verification for large neural networks, with the trade-off that they can
    only certify some but not all instances. These verifiers are often efficient and
    can be easily parallelized with GPU. Interestingly, these incomplete verifiers
    later become powerful tools even for complete verification, as will be shown in
    the next section.


    # ## 8.1 A convex relaxation framework


    We first introduce the convex relaxation framework, which covers most of the existing
    incomplete neural network verification methods. As mentioned in the last chapter,
    neural network verification can be formulated as an optimization problem. For
    simplicity, let us assume that \( f(\boldsymbol{x}) \) is an \( L \)-layer feedforward
    network:


    ```

    \( f(\boldsymbol{x}) := \boldsymbol{z}^{(L)} = W^{(L)}\boldsymbol{x}^{(L)} + \boldsymbol{b}^{(L)},
    \quad \boldsymbol{x}^{(l)} = \sigma^{(l)}(W^{(l)}\boldsymbol{x}^{(l)} + \boldsymbol{b}^{(l)}),
    \quad l \in [L], \quad (8.1) \)

    ```


    where \( \boldsymbol{x}^{(0)} = \boldsymbol{x} \) is the input, \( W^{(l)} \)
    and \( \boldsymbol{b}^{(l)} \) are the weight matrix and bias vector of the \(
    l \)th layer, and \( \sigma^{(l)} \) is a (nonlinear) activation function. Instead
    of passing a single \( \boldsymbol{x} \) to the network, neural network verification
    aims to propagate an input region \( S \) and verify some properties of output
    neurons. This can be written as the following optimization problem:


    ```

    \(\begin{aligned} \min_{\boldsymbol{x}^{(0)} \in S} \quad & \boldsymbol{c}^T \boldsymbol{x}^{(L)}
    \text{ s.t. } \boldsymbol{z}^{(l)} = W^{(l)}\boldsymbol{x}^{(l)} + \boldsymbol{b}^{(l)},
    \\ & \boldsymbol{x}^{(l+1)} = \sigma^{(l)}(\boldsymbol{z}^{(l)}), \\ & l \in [L],
    \end{aligned} \quad (\mathcal{O}) \)

    ```'
