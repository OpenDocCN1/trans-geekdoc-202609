  md: 'upper and lower bounds for $\tilde{z}^{(l)}$ by


    ```

    $\tilde{z}^{(l)} = W^{(l)}\frac{\bar{h}^{(l-1)} + \underline{h}^{(l-1)}}{2} +
    |W^{(l)}|\frac{\bar{h}^{(l-1)} - \underline{h}^{(l-1)}}{2} + b^{(l)},\\\underline{z}^{(l)}
    = W^{(l)}\frac{\bar{h}^{(l-1)} + \underline{h}^{(l-1)}}{2} - |W^{(l)}|\frac{\bar{h}^{(l-1)}
    - \underline{h}^{(l-1)}}{2} + b^{(l)},$

    ```


    where $|W^{(l)}|$ takes an elementwise absolute value. Note that $\bar{h}^{(0)}
    = x_U$ and $\underline{h}^{(0)} = x_L$. For an elementwise activation function
    (such as ReLU), we straightforwardly propagate the upper and lower bound through
    the activation function:


    ```

    $\bar{h}^{(l)} = \sigma(\tilde{z}^{(l)}) \qquad \underline{h}^{(l)} = \sigma(\underline{z}^{(l)}).$

    ```


    Note that as a verification method, IBP gets much looser bounds than linear relaxation-based
    methods, since they only maintain the upper and lower bound for each neuron on
    each layer, without forming a linear approximation to the input. However, surprisingly,
    Gowal et al. (2018) found that training with IBP can achieve good certified robustness.


    When conducting IBP-based training in a naive way, the performance is usually
    very bad since the bounds computed by IBP are very loose, especially at the initial
    point, which makes training very unstable. There are thus several important techniques
    used to stabilize IBP-based certified training. First, Gowal et al. (2018) proposed
    to use a mixture of robust cross-entropy loss with natural cross-entropy loss
    as the objective to stabilize training. Further, since training with IBP usually
    suffers from very bad initial loss, a commonly used technique called $\epsilon$-scheduling
    has been used in IBP training. The main idea is to initialize $\epsilon$ (the
    perturbation tolerance) as 0 or very small initially, and gradually increase $\epsilon$
    over iterations. However, the $\epsilon$-scheduling also leads to significant
    longer training epochs. For example, to achieve state-of-the-art IBP performance,
    we need thousands of warmup and final training epochs. To resolve this issue,
    Shi et al. (2021) proposed several regularization methods including batch normalization
    and a penalty to control the number of inactive neurons to stabilize IBP training.
    With their training recipes, IBP can achieve competitive results only with around
    two hundred training epochs on several public benchmark models and datasets.


    # ## Linear relaxation-based training


    Based on the formulation of (14.4), it is natural to apply a tighter bound derived
    by linear relaxation based-methods as $\underline{m}(x, \epsilon)$. As linear
