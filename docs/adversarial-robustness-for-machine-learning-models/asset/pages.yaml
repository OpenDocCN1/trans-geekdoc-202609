- pgno: 241
  md: '# # Model watermarking and fingerprinting


    Engineering a top-notch deep learning model is an expensive procedure, which involves
    collecting data, hiring human resources with expertise in machine learning, and
    providing high computational resources. For that reason, deep learning models
    are considered as valuable intellectual properties (IPs) of the model vendors.
    To ensure reliable commercialization of deep learning models, it is crucial to
    develop techniques to protect model vendors against IP infringements. One of such
    techniques, which recently has shown great promise, is digital watermarking.


    Moreover, with the rapid development of machine learning and artificial intelligence,
    the efforts and resources spent in developing state-of-the-art machine learning
    models such as deep neural networks (DNNs) can be tremendous, and therefore it
    is of utmost importance to be able to claim the ownership of a well-trained model
    and its derived versions (e.g., pruned models). For instance, the cost of training
    current state-of-the-art transformer-based language model GPT-3 (Brown et al.,
    2020a) is estimated to be at least 4.6 million US dollars. 1 Imagine that an unethical
    model thief purposely pruned the pretrained GPT-3 model and attempted to claim
    the ownership of the resulting compressed model. The solution to the challenge
    of “how to protect IP for DNN models and reliably identify model ownership?” is
    literally worth million dollars. The methods for model watermarking and fingerprinting,
    as introduced in this chapter, are motivated from the study of adversarial robustness
    for DNNs.


    # ## 20.1 Model watermarking


    Aramoon et al. (2021) present GradSigns, a novel watermarking framework for deep
    neural networks (DNNs). GradSigns embeds the owner’s signature into the gradient
    of the cross-entropy cost function with respect to inputs to the model. Their
    approach has a negligible impact on the performance of the protected model, and
    it allows model vendors to remotely verify the'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'watermark through prediction APIs. Table 20.1 lists the properties that an
    effective watermarking technique for deep learning models should have.


    | Properties | Description |

    |---|---|

    | Loyalty | Watermark should have negligible overhead on the model''s performance.
    |

    | Robustness | Watermark must remain verifiable in the presence of antiwatermark
    attacks. |

    | Reliability | Watermark verification should result in minimal false ownership
    claims. |

    | Credibility | Finding or forging a fake (ghost) watermark should not be feasible.
    |

    | Efficiency | Watermark extraction and verification should incur low costs. |

    | Capacity | Watermarking technique should be able to embed large signatures.
    |


    *Threat model.* The threat model includes two parties, *model vendor* and *adversary*.
    The model vendor owns model *M*, a DNN that they have engineered and trained for
    a certain task *T* using the dataset *D*. The dataset *D* is collected and owned
    by the model vendor. The second party, the adversary, is an entity that does not
    have the required resources for designing and training a top-notch model and wishes
    to make a profit out of model *M* without paying any copyright fee to the model
    vendor. The adversary can be a company that has purchased the license of *M* for
    one of their products and wants to deploy it on another one without paying additional
    copyright fees. They can also be any entity that has somehow got their hands on
    the model and wishes to sell it on the darknet. Model vendor’s goal is to protect
    *M* against IP infringements by means that enables the vendors to prove their
    ownership and possibly detect the source of theft. On the other hand, the adversary’s
    ultimate goal is to continue profiting from *M* without getting caught by law
    enforcement.


    The threat model in (Aramoon et al., 2021) assumes the strongest adversary who
    has the expertise and the computation power required for training a model. However,
    the dataset that they have available for task *T* is far smaller than dataset
    *D* owned by the model vendor and therefore is not large enough for them to train
    a top-grade model from scratch. If the adversary had access to dataset *D*, then
    they would not need to hijack *M* as they are capable of training the model themselves.
    Similarly to prior arts, it is assumed that the adversary is capable of trying
    any of the general antiwatermark attacks such as parameter pruning, model finetuning,
    and query invalidation and modification to remove the watermark or ob-'
