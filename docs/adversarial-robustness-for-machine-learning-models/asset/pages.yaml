  md: '# 6.6 Deep reinforcement learning


    Deep reinforcement learning (DRL) models are shown to possess many advantages
    in optimizing robot learning systems, such as autonomous navigation and continuous
    robot arm control. Yang et al. (2020b) propose timing-based adversarial strategies
    against a DRL-based navigation system by jamming in physical noise patterns on
    the selected time frames. To study the vulnerability of learning-based navigation
    systems, they propose two adversarial agent models: one refers to online learning,
    and another one is based on evolutionary learning. Under white-box and black-box
    adversarial settings, their experimental results show that the adversarial timing
    attacks can lead to a significant performance drop of the target DRL model. Yang
    et al. (2022) studies different types of obvervational interference to Q-learning
    based DRL models and show that incoporating them into neural network architecture
    design and training can lead to improved robustness.


    # 6.7 Image captioning


    Image captioning is an example of deep learning on mixed data modalities (texts
    and images). The model input is an image, and the model output is some caption
    describing the content in the image. Image captioning adopts an encoder-decoder
    framework consisting of two principal components, a convolutional neural network
    (CNN) for image feature extraction and a recurrent neural network (RNN) for language
    caption generation.


    Chen et al. (2018a) propose Show-and-Fool, a novel algorithm for crafting adversarial
    examples in neural image captioning. The proposed algorithm provides two evaluation
    approaches, which check whether neural image captioning systems can be misled
    to output some randomly chosen or targeted captions or keywords. Their experiments
    show that their algorithm can successfully craft visually similar adversarial
    examples with randomly targeted captions or keywords, and the adversarial examples
    can be made highly transferable to other image captioning systems.


