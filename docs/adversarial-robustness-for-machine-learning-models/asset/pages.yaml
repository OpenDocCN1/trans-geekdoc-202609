  md: '# CHAPTER 9


    # Complete neural network verification


    Complete verification is a hard problem due to the nonlinearity of deep neural
    networks. Even for a simple ReLU network, Katz et al. (2017) showed that complete
    verification is NP–complete. Therefore earlier works that formulate complete verification
    as Mixed Integer Programming (MIP) usually failed to handle networks beyond 100
    neurons. However, significant progress has been made in the past few years and
    nowadays good verification tools can already handle some larger networks beyond
    1 million parameters. In this chapter, we will discuss the main techniques used
    in the current complete verifiers.


    # 9.1 Mixed integer programming


    For ReLU networks, the complete verification problem can be formulated into the
    mixed integer programming (MIP) problem. The key insight is using binary variables
    to indicate the activation pattern of ReLU functions. Following the notation used
    in the previous sections, for a feed-forward network f we can formulate the neural
    network verification problem (7.8) into the following MIP problem:


    ```

    min c^T f s.t. i \in [L], j \in [n_i];

    z^{(i)} = W^{(i)} z^{(i-1)} + b^{(i)}; f = z^{(L)}; z^{(0)} = x \in C;

    \hat{z}_j^{(i)} \ge z_j^{(i)}; \hat{z}_j^{(i)} \le u_j^{(i)} s_j^{(i)}; \hat{z}_j^{(i)}
    \le z_j^{(i)} - l_j^{(i)} (1 - s_j^{(i)});

    \hat{z}_j^{(i)} \ge 0; z_j^{(i)} \in [l_j^{(i)}, u_j^{(i)}]; s_j^{(i)} \in {0,
    1};

    ```


