    # 6.8 Weight perturbation


    Beyond perturbations on the data inputs, the need for studying the sensitivity
    of neural networks to weight perturbations is also intensifying owing to several
    practical motivations. For instance, in model compression the robustness to weight
    quantization is crucial for designing energy-efficient'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'hardware accelerator (Stutz et al., 2020) and for reducing memory storage while
    retaining model performance (Hubara et al., 2017; Weng et al., 2020). The notion
    of weight perturbation sensitivity is also used as a property to reflect the generalization
    gap at local minima (Keskar et al., 2017; Neyshabur et al., 2017). Intuitively,
    the “sharpness” of a local minimum can be measured by the increase of loss function
    under a norm-bounded perturbation, and a sharp local minimum is usually less generalizable
    since the model will encounter significant performance loss when testing samples
    are slightly different from training. Motivated by these observations, a family
    of sharpness aware minimization has been introduced in the literature Foret et
    al. (2020). Instead of minimizing the standard training loss, they proposed to
    train neural networks with the following bi-level objective function:


    ```

    \min_{\theta} \frac{1}{n} \sum_{i=1}^n \max_{||\theta - \theta''|| \le \epsilon}
    \mathcal{L}(f_{\theta''}(\mathbf{x}_i), \mathbf{y}_i),

    ```


    where \(\theta''\) is the norm-bounded perturbed weight. Since sharp minimums
    have higher loss under perturbation, minimizing the above objective will converge
    to a flatter minimum, and the flatness-loss tradeoff is controlled by the constant
    \(\epsilon\). It has been shown in (Chen et al., 2022) that sharpness aware minimization
    can significantly improve the (clean) accuracy of Vision Transformer models since
    those models typically tend to overfit the training data. Several improvements
    have also been made to improve the performance and the speed of sharpness-aware
    minimization (Zhuang et al., 2022; Liu et al., 2022).


    In adversarial robustness and security, weight sensitivity can be leveraged as
    a vulnerability for fault injection and causing erroneous prediction (Liu et al.,
    2017a; Zhao et al., 2019b). It has also been shown that weight perturbation, when
    combined with adversarial training, can improve adversarial robustness (Wu et
    al., 2020b). However, theoretical characterization of its impacts on generalization
    and robustness of neural networks remains elusive. Tsai et al. (2021a) bridge
    this gap by developing a novel theoretical framework for understanding the generalization
    gap (through Rademacher complexity) and the robustness (through classification
    margin) of neural networks against norm-bounded weight perturbations. Specifically,
    they consider the multiclass classification problem setup and multilayer feedforward
    neural networks with nonnegative monotonic activation functions. Their analysis
    offers fundamental insights into how weight perturbation affects the generalization
    gap and the pairwise class margin. Moreover, based'
  merge: -1
  img_proc: true
