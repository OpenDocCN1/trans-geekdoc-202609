  \n我们知道如何计算：\n\n(images/p345_02.png)\n\n我们现在有了损失函数关于权重的梯度。\n\n# 第 11 章\n\n### 机器的眼睛\n\
  \n几乎所有关于视觉深度神经网络历史的描述都承认了神经生理学家大卫·休贝尔（David Hubel）和托尔斯滕·维塞尔（Torsten Wiesel）的开创性工作，他们是哈佛大学神经生物系的联合创始人，也是\
  \ 1981 年诺贝尔生理学或医学奖的共同获得者。诺贝尔奖是为了他们对猫视觉系统的研究；该奖是在他们最具开拓性的工作大约十五年后颁颁的，即使在那十五年里，这两个人仍然保持着惊人的产出。1982\
  \ 年，英国科学家霍拉斯·巴特洛（Horace Barlow）写道休贝尔和维塞尔时：“到那时，这项奖被认为不仅是最实至名归之一，也是最难以获得的之一。”\n\n\
  休贝尔和维塞尔早期的工作涉及通过记录单个神经元的电活动来创建视觉皮层地图，而他们使用幻灯片向猫展示视觉模式。这种平铺的叙述掩盖了实验的艰辛程度。这项工作根源于休贝尔在\
  \ 1957 年发明了一种钨电极，用于记录大脑中单个神经元（或称为单元）的活动。这本身就是一项开创性的尝试。在此之前，用于此目的最流行的设备是装有电解质的玻璃微吸管，其尖端，可以插入大脑。休贝尔想要一种在动物移动时不会断裂的东西。其他人开发了钢电极，但它们不够硬。钨被证明是完美的。“这种电极已用于在仅用胸带束缚的清醒猫皮层中记录单个单元，时间长达\
  \ 1 小时，”\n\n正是这些电极让休贝尔和维塞尔\n\n这种实验在今天还会被允许吗？很难说。即使在 20 世纪 80 年代，关于此类实验伦理问题的争论已经在报纸的评论版上展开。1983\
  \ 年《纽约时报》的一篇文章提到了休贝尔和维塞尔做的一项后续实验，该实验涉及研究猫视觉的发展。“在哈佛大学，小猫通过缝合双眼而被致盲，”\n\n\n\n\nHubel\
  \ 和 Wiesel 认为，视觉皮层中信息的处理方式存在一种层次结构（这一观点已被证明并没有他们最初描述的那么简单明了，但我们仍坚持这一观点，因为它对 AI 产生了巨大影响）。\n\
  \n我们需要一些定义来理解他们的观点：\n\n- “视觉场”（visual field）是指当我们眼睛聚焦于前方的某个物体时，眼睛在某一瞬间对我们面前区域所敏感的区域——“聚焦”这一部分至关重要。否则，仅仅移动眼睛就会改变视觉场。视觉场中的刺激会触发神经反应。\n\
  - “感受野”（receptive field）是指触发单个神经元的视觉场区域。正如我们很快将见到的，神经元感受野的大小可以从非常小到很大不等。如果神经元的感受野内存在适当的刺激，该神经元就会放电。感受野最小的神经元，即直接监控视网膜上图像的神经元，被称为`视网膜节细胞`（retinal\
  \ ganglion cells），它们接收视网膜输入的第一层神经元。\n\n![](img/p349_01.png)\n\n现在假设视觉场中出现了一个以垂直线形式存在的刺激，它与四个`视网膜节细胞`的感受野重叠。每个细胞都会对其各自感受野内的信号做出放电反应。这四个细胞——四个只是一个例子——连接到一个“简单细胞”（simple\
  \ cell），这种神经元只有在所有四个`视网膜节细胞`（`RGCs`）同时放电时才会放电。想象这样一种情况：只有四个 `RGCs` 中的一个放电了。它检测到了刺激。它向`简单细胞`发送信号，但由于其他三个\
  \ `RGCs` 是静止的，`简单细胞`并不放电。如果四个 `RGCs` 都放电，`简单细胞`就会放电，表示检测到了一个垂直边缘。（这让我们想起在前面的章节中遇到的阈值激活函数：单个\
  \ `RGC` 的输入仍低于驱动`简单细胞`所需的某些阈值，但按正确排列的多个 `RGCs` 的输入超过了阈值，导致`简单细胞`放电。）\n\n如果边缘是有角度的呢？嗯，有些简单细胞会对与垂直方向成一定角的边缘放电。例如，这里有一个可以检测\
  \ 45 度角边缘的细胞：\n\n![](img/p350_01.png)\n\n这引导我们讨论视觉中一个非常有趣的话题：不变性（invariance）。考虑一个垂直边缘。视觉场可能有很多垂直边缘，每个边缘都有一个简单细胞来检测。但如果我们想要神经元无论垂直边缘在大型感受野中的位置如何，都能信号垂直边缘的存在呢？这是一个解决方案：许多简单细胞（每个细胞响应整个视觉场不同部分的垂直边缘）将输出输到一个`复杂细胞`（complex\
  \ cell），只要任何一个简单细胞放电，`复杂细胞`就会放电。现在，`复杂细胞`被认为具有平移不变性：垂直边缘可以位于`复杂细胞`感受野的任何位置，只要它触发了某个`简单细胞`，就会触发`复杂细胞`的反应。\n\
  \n![](img/p351_01.png)\n\n同样，你可以有一个`复杂细胞`，它会对感受野内任何位置的与垂直方向成 30 度角的边缘做出反应。这些都是空间不变性或平移不变性的例子。\n\
  \n![](img/p351_02.png)\n\n当我们沿着层次结构向上移动时，神经元的感受野会发生有趣的变化。`视网膜节细胞`具有很小的感受野，`RGCs`\
  \ 只有在它们视觉场微小区域（我们图中的小圆）内存在刺激时才会放电。但现在考虑一个检测边缘的`简单细胞`。它的感受野大得多（由例如沿直线对齐的四个 `RGCs`\
  \ 的感受野组成）。只有当跨越整个较大感受野的边缘状刺激时，`简单细胞`才会放电。让我们在层次结构上移动一级。考虑以空间不变方式响应垂直边缘存在的`复杂细胞`：它具有大得多的感受野，跨越了所构成的边缘检测型`简单细胞`的感受野；\n\
  \n另一种重要的不变性，也是易于说明的一种，是旋转不变性（rotation invariance）。这里有一个例子，当感受野内存在给定方向的边缘时，`复杂细胞`放电。这些`复杂细胞`将输出输到一个`超复杂细胞`（hypercomplex\
  \ cell），当任何一个`复杂细胞`放电时，该细胞就会放电。我们现在有了一个对旋转不变的细胞；只要`超复杂细胞`的感受野中存在边缘，该细胞就会放电，无论边缘的方向如何。\n\
  \n![](img/p352_01.png)\n\n`超复杂细胞`也被认为对某些特定长度的边缘产生最大反应；较短或更长的边缘没有相同的效果。你可以组合这样的`超复杂细胞`来检测，例如，人字形或\
  \ V 形图案。接下来的图仅显示了层次化的`超复杂细胞`；在第一层`超复杂细胞`之前还有简单细胞和复杂细胞。\n\n![](img/p353_01.png)\n\
  \n你可以想象将这些组合以获得层次结构中更高层的细胞，例如检测三角形或正方形的细胞；以及对三角形或正方形具有平移或旋转不变性的细胞。我们可以继续下去，想象对不同形状敏感的细胞；对旋转和平移不变的细胞；对拉伸、光照条件不变的细胞等等（关于细胞的部分是一些遥远的神经科学传说）。\n\
  \n### NEOCOGNITRON\n\n\n\n使用这种架构，福岛的神经认知层（neocognitron）可以学习检测模式，即使这些模式发生了位置偏移，或者发生了扭曲或压缩。许多这样的层赋予了神经认知层识别数字的能力，即使这些数字在视觉区域中移动位置，或者在某种可接受范围内发生扭曲。这在当时是一项巨大的突破。“设计模式识别机器面临的最大且最持久的困难之一，就是如何处理输入模式的位置偏移和形状扭变问题。神经认知层……为这一困难提供了一个极佳的，”\n\
  \n尽管取得了进展，但神经认知元的训练算法仅调整 `S-cells` 的权重，非常繁琐、需要精细调节，且在某种程度上是定制的。随后，在大十年后，被称为“法国小子”的杨·勒昆（Yann\
  \ LeCun）——当时是在多伦多与 Hinton 一起工作的年轻博士后——使用一种神经网络架构解决了相同的问题，这种架构成为了他对比 AI 领域的标志性贡献之一：卷积神经网络。`CNN`\
  \ 是使用反向传播算法训练的，与神经认知层不同。在 Le 昆 的论文发表几年后，他见到了福岛。“他告诉我，当看到我们在《神经计算》上的论文时，他和他的学生们震惊了，因为他们实际上在做同一的事情，”Le\
  \ 昆 告诉我。福岛被抢先发表了。\n\n### LeNET\n\n此时，马文·明斯基（Marvin Minsky）和西摩尔·帕帕特（Seymour Papert）似乎成了在十年时间里阻碍神经网络研究的反派。因此，Papert\
  \ 是 Le 昆 的知识偶像之一，这有点令人意外。当 Le 昆 还是巴黎学习电气工程的学生时，他偶然发现了这本书\n\nPapert 要求对“某物是天生的”（innate）有更清晰的解释。“我将通过描述一个自动机——一种我们非常理解的机器，并对机器中什么是天生的、什么不是天生的提问。如果在这个‘玩具’情境下都不明确，那么在人类发育复杂情况下，还需要多少的澄清呢？”\n\
  \n然后 Papert 继续描述了罗森布拉特（Rosenblatt）的感知机。\n\nLe 昆 在还是本科生时，在阅读关于皮亚杰（Piaget）与乔姆斯基（Chomsky）辩论以及\
  \ Papert 论点的书籍之前，就已经迷上了智能问题。“我一直对智能的奥秘感到好奇，”他告诉我。“也许是因为我太笨或太懒了，我总认为人类工程师不会聪明到能构思并设计一台智能机器。它基本上必须通过学习来设计自己。我认为学习是智能不可或缺的一部分。”\n\
  \nPapert 使用感知机的分析正符合这一思路。然而，Le 昆 从未听说过学习机器。他被深深吸引了。他开始搜寻学术文献，钻读图书馆的书籍。他读了感知机，也读了明斯基和\
  \ Papert 的书。“我很早就意识到，因为我读了所有那些旧论文， 60 年代的每个人都在寻找训练多层网络的方法，”Le 昆 告诉我，“他们知道局限性在于他们了线性分类器。”\n\
  \nLe 昆 发现并记住了我们在前面的章节中遇到过的机器学习圣经中的一部分——Duda 和 Hart 的《模式识别》（`Pattern Recognition`）。他告诉我，他从所有阅读中获得的关键体会是，“学习算法应该最小化一个目标函数。你可以从中推导出一大堆东西。”\n\
  \n目标函数是对损失函数（loss function）的一个细微但重要的改变。我们已经遇到过后者：它是一个输入机器学习模型参数并计算损失的函数，例如整个训练数据集上的均方误差（`MSE`）。我们看到损失函数是如何被最小化或优化的。仅使用损失函数存在一个内在问题：如果在优化上做得太好，你的机器学习模型可能会对数据过拟合；它甚至可以字面地记住一切。在这种情况下，它在对未见过的测试数据进行预测时可能表现很糟糕。为了避免这种情况，可以在损失函数中添加一个额外的项，称为正则化项（regularizer）。该项的设计是为了让模型避免过拟合。损失函数和正则化项共同构成了目标函数。最小化目标函数而非纯粹的损失函数，可以使模型对未见数据具有更好的泛化能力。\n\
  \n脑子里想着为多层神经网络最小化目标函数，Le 昆 开始了他的博士学习，并学习了福岛的神经认知层。作为博士工作的一部分，Le 昆 开发了一种学习算法，他意识到这种算法与反向传播算法（我们在上一章中看到的）有关。Le\
  \ 昆 的算法不是反向传播梯度或使用链式法则计算所有偏导数，而是为每个隐藏单元反向传播“虚拟目标值”。该算法随后可以计算每个单元的误差以及执行更新所需的梯度。在特殊条件下，该算法的行为类似于反向传播。在攻博士学位期间，Le\
  \ 昆 开始思考用于不变图像识别的神经网络（就是我们刚刚看到的类型）。\n\n他在 1985 年在法国的一场会议上发表了一篇关于他学习算法的论文。“这是一篇写得很糟糕的法语论文，”他告诉我。作为会议的主旨演讲者\
  \ Hinton 找了 Le 昆，两人一拍即合，甚至能接上对方的话，Le 昆 回忆道。Hinton 邀请 Le 昆 参加他在 1986 年在匹兹堡的卡内基·梅隆大学组织的暑期学校。在那里，Hinton\
  \ 告诉 Le 昆 他要搬到多伦多大学；他问 Le 昆 是否愿意跟他一起去那里做博士后。“我说：‘当然可以。\n\nLe 昆 于 1987 年完成博士学位并搬到多伦多，在那里与\
  \ Hinton 度过了一段充满智力激发的时光，两人的对话“我只和他进行过。”在多伦多，Le 昆 开始研究用于图像识别的卷积神经网络，即 conv nets。（稍后我们将讨论什么是‘卷积’。）如今，如果软件工程师想要实现一个卷积网络，得益于\
  \ `PyTorch` 和 `TensorFlow` 等软件包，他们只需要一百行代码即可完成。在 20 世纪 80 年代并没有这样的软件。Le 昆 和一位博士生\
  \ Léon Bottou 必须编写特殊的软件来模拟神经网络。这种软件被称为 `SN`，\n\n在多伦多的的一年内，Le 昆 被新泽西州霍姆德尔的贝尔实验室招募，并在那里加入了一个由\
  \ Larry Jackel 领导的杰出团队。在贝尔实验室，Le 昆 获得了一个大型且有趣的数据集：来自美国邮政的手写数字图像。美国邮政对自动化识别邮政编码的过程感兴趣。Le\
  \ 昆 编写了一个神经网络来识别这些手写数字。当时的 PC 还不够快运行这种计算密集型的软件，因此他使用 `Lisp` 语言编写了一个编译器，该编译器可以输入要实现的神经网络定义（或架构），并输出\
  \ `C` 语言代码。随后，`C` 编译器会将这些代码转换为可以在硬件数字信号处理器上运行的低级指令。\n\n\n\n与此同时，一位同事 Donnie Henderson\
  \ 制作了一个演示，使用摄像机将纸上随手画的手写数字转换为数字图像，供神经网络进行识别。这一切工作都是在 LeCun 到达贝尔实验室（Bell Labs）后的几个月内完成的。他回忆起观察自己的神经网络识别手写数字的经历：“我并不怀疑它能成功。我当时很年轻，无所畏惧，”他告诉我。尽管如此，他感到“欣喜若狂”。这项工作产生了几篇论文，其中发表在\
  \ *Neural Computation* 上的那篇论文震惊了业界并抢先了福岛（Fukushima）的新认知元（neocognitron）团队。其结果是一个今天被称为\
  \ LeNet 的卷积神经网络；\n\n# 执行卷积\n\n即使是今天最复杂的卷积神经网络，其核心也是一个非常基础的操作：卷积。\n\n`f(x)*g(x)`，其中\
  \ `*` 是卷积算符。\n\n我们不关注函数卷积的通用情况，而是关注一种适用于图像的非常特定的 2D 情况。假设你有一张 5×5 的图像。在图像语境下，卷积是指使用另一个更小的（例如\
  \ 2×2）图像——称为核（kernel）或卷积核（kernel filter）——对图像执行的操作。这里这样一个图像和核的示例：\n\n![](img/p361_01.png)\n\
  \n卷积过程从将 2×2 的核置于 5×5 图像的左上角开始；这给了我们四个重叠的像素。将核的每个像素与其下方的像素值相乘。你得到四个数字。将它们相加。总和就得到了新图像在\
  \ `[1, 1]` 位置的像素值。（关于新图像的尺寸有一个公式，但我们暂先不考虑它，假设它是一张 4×4 的图像。）这里是第一次操作：\n\n![](img/p361_02.png)\n\
  \n现在将核向右滑动一个像素。（核向右滑动的精确长度可以改变，但为了不失一般性，我们可以使用一个像素。）我们再次得到四个重叠的像素。将每对重叠的像素相乘并求和。现在，总和就得到了新图像在\
  \ `[1, 2]` 位置的像素值。\n\n![](img/p362_01.png)\n\n继续向右滑动核一个像素，为新图像生成新的像素值，直到核无法再向右滑动。对于我们的示例\
  \ 5×5 图像和 2×2 核，我们从左到右只能生成四个像素。\n\n![](img/p362_02.png)\n\n一旦核触及图像右侧边缘，我们就回到左侧，向下移动一行并重复整个过程。这生成了新图像第二行的像素值。\n\
  \n你明白图意了。我们这样做，直到核无法再向右移动，然后我们回到左侧，将核向下移动一个像素，一直到达主图像的右下角，核没有地方可以去。在这个示例中，我们生成了一个新的\
  \ 4×4 图像。尝试填满新图像中剩余的空白。\n\n![](img/p363_01.png)\n\n我们刚刚完成了 5×5 图像与 2×2 核的卷积。在详细讨论卷积细节之前，下一页的图展示了使用两个不同的\
  \ 3×3 核卷积 28×28 手写数字图像的示例。（第一张图像是原图，后续两张是卷积后的图像。）\n\n![](img/p364_01.png)\n\n撇开核的细节，你对新图像有何特别的发现吗？首先，不明显的是新图像是\
  \ 26×26（卷积操作减小了尺寸）。但更重要的是视觉上显而易见的点（特别是当你眯起眼睛看这些图像时）——在第一张卷积图中，数字 4 的水平线被高亮了；而在第二张卷积图中，垂直线被高亮了。当对数字\
  \ 1 执行卷积操作时，你也可以看到同样的效果，而且更加明显。（再次，最左侧的图像是原图，后面是两张卷积图像。）\n\n![](img/p364_02.png)\n\
  \n选择这些核专门是为了实现这些高亮效果。这两个核是：\n\n![](img/p364_03.png)\n\n这些被称为 Prewitt 核，\n\n在进行卷积时，我们做了一些假设。第一个是核向右或向下移动一个像素。核移动的像素数称为步长（stride）。我们的步长是\
  \ 1。我们可以选择 2，那样就会生成一个不同尺寸的新图像。步长的选择决定了新图像的大小；因此，对于输入图像尺寸 `i`、卷积核尺寸 `k` 和步长 `s`，输出图像尺寸公式为：\n\
  \n> `⌊((i − k)/s) + 1⌋`\n\n（某些数字周围的下取括号 `⌊ some number⌋` 表示求结果为小于或等于括号内数字的最大整数。因此，4.3\
  \ 的下取，即 `⌊4.3⌋`，是 4。）\n\n我们在这里还做了一些其他假设：输入图像是正方形（即图像宽度等于高度），并且没有没有输入图像周围添加虚拟像素，即填充（padding），这在卷积神经网络中经常这样做。对于\
  \ 28×28 的图像、3×3 的核和步长为 1，我们得到 26×26 的输出图像。\n\n是时候将这些想法与神经元、权重、感受野等概念联系起来了。考虑单次操作，当核位于图像的部分区域时（参见图）：\n\
  \n主图像中的像素值为 `[x11, x12, x21, x22]`。核的像素值为 `[w11, w12, w21, w22]`。这里是核与下方像素相乘的结果：\n\
  \n> `w11*x11 + w12*x12 + w21*x21 + w22*x22`\n\n![](img/p366_01.png)\n\n\n\n现在，想象对第一次卷积得到的\
  \ 4×4 图像使用另一个不同的 2×2 卷积核进行再次卷积。输出将是一个 3×3 的图像。这将需要 9 个神经元。这就是第二个隐藏卷积层。该层中的每个神经元等同于\
  \ Hubel 和 Wiesel 分层结构中的复合细胞。该层中的每个神经元对前一层生成的 4×4 图像中 4 个像素的值敏感。但 4×4 图像中的每个像素都是前一个层中一个对输入图像中\
  \ 4 个像素敏感的神经元的输出。因此，第二层中的神经元实际上对输入图像中的 9 个像素敏感。为什么感受野不等于 4×4 = 16 个像素呢？稍微思考一下你就会得到答案。\n\
  \n![](img/p367_01.png)\n\n在上面的插图中，单个单元格中的数字指的是图像的行号和列号，而不是像素的值。因此，`11` 表示第 1 行第\
  \ 1 列；`43` 表示第 4 行第 3 列；以此此类推。所以，最终 3×3 图像中的像素 `11` 是卷积核作用在前一个图像的四个像素（像素 `11`、`12`、`21`\
  \ 和 `22`）上的结果。但这四个像素是 2×2 卷积核在上一层中四个斑块上滑动的结果，覆盖了像素 `11`、`12`、`13`、`21`、`22`、`23`、`31`、`32`\
  \ 和 `33`。\n\n如果我们只取原始图像中用粗线标记的 3×3 斑块，这里是神经网络可以将该斑块转换为单个像素的连接。首先，我们将像素排列成一条直线以便可视化，然后将这些像素连接到它们各自的单个神经元。很明显，第一个隐藏层中的每个神经元只对四个像素做出响应。当然，整个层层将会有\
  \ 16 个神经元；插图只显示了其中的 4 个。这 4 个神经元生成了下一个 4×4 图像的 4 个像素。这些像素/输出成为下一层神经元的输入，然后为随后的图像产生一个像素。\n\
  \n![](img/p368_01.png)\n\n你能看到为什么在这种情况下卷积核操作赋予了我们 **平移不变性** 吗？假设卷积核检测到一个水平边缘。该边缘可以出现在图像的任何位置。只要它落在一个或多个神经元的感受野内，我们就能从第一层中的至少一个神经元处获得信号。垂直边缘也是如此。随后的层可以对这些信号进行处理。\n\
  \n这种架构让人想起 Hubel 和 Wiesel 假设在大脑中存在的分层结构。第一个隐藏层的简单细胞（或神经元）对简单特征响应。下一个隐藏层中的复合细胞对一组简单细胞的输出响应，因此它们对某些简单特征的组合做出响应。这种分层结构可以持续下去，直到你有一个神经元因为特征的持续组合表明（例如）输入中存在数字\
  \ 1 或数字 4 而触发。\n\n我们使用的卷积核是由某些投入大量精力的人专门设计的。设计用于检测简单特征（如垂直或水平边缘）的卷积核是相对的。但对于复杂的图像呢？人们应该寻找什么样的特征来区分一张图像和另一张图像？我们又如何设计这样的卷积核呢？\n\
  \n这就是 LeCun 的洞解显现出来的地方。人类没有办法找出定义图像的所有无数种特征，然后设计卷积核来突出这些特征。LeCun 意识到他可以训练一个神经网络来学习这些卷积核；毕竟，每个卷积核矩阵的元素都是单个神经元的权重。使用反向传播训练网络来执行某些任务，本质上将帮助网络找到合适的卷积核。\n\
  \n在将所有部分结合之前，我们还需要理解卷积神经网络中常用的另一种操作。这种操作被称为池化（pooling），它有几种类型，但为了从概念上理解该过程，我们将关注一种。它被称为最大池化（max\
  \ pooling）。\n\n### 最大池化背后的基本思想\n\n给定一个 4×4 的图像（假设是在卷积后获得），这是使用 2×2 过滤器进行最大池化的效果。与卷积核不同，最大池化滤波器的移动方式没有重叠像素，因此步长（stride）与卷积核的大小相同。在我们的示例中，步长为\
  \ 2 个像素。\n\n![](img/p370_01.png)\n\n再次，新图像的大小由一个简单的公式给出（假设图像是正方形且没有填充）：\n\n> ⌊((i\
  \ - k) / s) + 1⌋\n\n公式对于输入图像大小 `i = 4`，池化过滤器大小 `k = 2` 以及步长 `s = 2`，给出的输出图像大小为 2。因此，4×4\
  \ 的图像变成了 2×2 的图像。\n\n掌握了卷积神经网络的所有这些元素后，我们可以组合一个 CNN 来识别手写数字。\n\n### 区分性特征\n\n正如\
  \ LeCun 所意识到的，卷积神经网络的力量在于它学习特征的能力。学习特征涉及学习卷积核的值，正如我们所看到的，这等同于学习一组神经元的权重。确保你的网络强大的一种方法是拥有许多这样的卷积核，每个卷积核都学习区分完成任务（例如，识别数字任务）所需的不同特征。\n\
  \n\n\n如果任务是区分两张图像，那么一个只有一个神经元的 `FC2` 就足够了。它可以对一种类型的图像输出 `0`，对另一种类型输出 `1`；例如，猫输出\
  \ `0`，狗输出 `1`。你如何训练这样的网络呢？对于我们的手写数字数据集，我们有标记数据——有人费力地将每张图像标注为 `0`、`1` 或 `9` 等——因此，我们可以使用监督学习。向网络展示一张图像并让它预测数字。假设输入是数字\
  \ `8`。理想情况下，代表数字 `8` 的输出神经元应该比其他神经元更得强烈（这意味着它输出的值应该显著大于 `FC2` 中其他神经元产生的值）。未训练的网络会胡乱放电。计算预期结果与网络实际结果之间的误差，然后通过反向传播利用该误差计算梯度。接着更新所有参与将输入图像转换为输出的神经元的权重。更新后的权重确保了对于相同的输入，网络的误差比之前小那么一点点。对所有图像重复此过程，直到网络的错误率低到可以接受的水平。如果我们计算训练数据集中所有图像的梯度并一次性更新权重，我们就是在进行梯度下降。如果我们在每次通过网络时只使用图像的子集，我们就是在进行随机梯度下降——这是一种在损失函数平面上的“醉步”，直到达到一个足够好的最小值。\n\
  \n到目前为止还未说明的是，此类网络的设计者必须对网络参数做出许多决策，这些参数在训练过程中是不学习的，但它们极大地影响了网络的性能。例如，卷积层和全连接层的神经元都有激活函数。激活函数的选择就是其中一种决策。唯一的条件是激活函数应该是可微的，或者至少是近似可微的，以便实现梯度的反向传播。\n\
  \n这些手工选择的参数，包括卷积核滤波的大小和数量、最大池化滤波的大小和数量、卷积层和最大池化层的数量（在上面的示例中我们只有一对；人们可以不断堆叠它们）、全连接层的大小和数量、激活函数——所有这些构成了所谓的超参数。微调，或者说为超参数找到正确的值，本身就是一种艺术。至关重要的是，这些参数*不是*通过反向传播学习的。\n\
  \nLeCun 的 `LeNet` 比我们的示例稍微复杂一点，但并没有过分；他让它成功了。而且，它是一个深度神经网络，意味着它拥有隐藏层。（在我们案例中，输入和\
  \ `FC2` 之间的层是隐藏层）。NCR 公司使用 `LeNet` 来读取和识别银行业支票上的数字。“那是反向传播少数几个真正运行良好的应用之一，而且是深度的，”Hinton\
  \ 告诉我。\n\n这是 20 世纪 90 年代初。尽管有了 `LeNet`，深度神经网络并没有大放异彩。部分原因是因为支持向量机（SVM）的成功，它在几乎同一时期在机器学习领域引起了轰动：`SVMs`\
  \ 易于理解，有可用软件，并且对于当时的小数据集来说，它们是理想的算法。而卷积神经网络对于许多人来说，仍然是晦涩而神秘的。而且，显然不存在一种通用的软件可以被用来来构建这些\
  \ CNN。“你必须自己编写一个深度学习框架，”LeCun 告诉我，“你无法从我们这里获得它，因为 AT&T 不让我们开源发行我们的软件。所以我们无法让人们复现我们的结果。结果就是，没有人做过。”人们尝试过编写自己的深度学习框架。“你可以花一年时间写一段运行神经网络和卷积网络的软件，确实有几人这么做了，”他说。\n\
  \n与此同时，在整个 20 世纪 90 年，LeCun 继续研究并提倡使用卷积神经网络进行图像识别，而不是更传统的技术。对于不需要强大神经网络的分辨率图像，他的\
  \ `CNNs` 性能优于其他算法。“我们在所有顶级会议上发表了那些论文，但并没有产生很大影响，因为那时，计算机视觉社区在想：‘哦，也许有微小差异，也许你们的卷积网络运行还可以。但我们会用自己的方法赶上的，’他告诉我。\n\
  \n此外，神经网络工作效果不佳的情况也显露出来。“有迹象表明存在规模的问题，”他说，“当[图像]不大且神经网络不是太大时，它们会击败一切。”但高分辨率图像并非如此。识别高分辨率图像需要大型神经网络，训练这样的网络意味着必须进行数字计算，主要是以矩阵运算的形式。为了让过程运行更快，大部分数字计算需要形式的并行计算，但\
  \ 20 世纪 90 年计算机的中央处理器（CPU）无法胜任。然而，救星已经以图形处理器（GPU）的形式出现了，它们最初被设计为专门渲染 3D 图形的片上硬件。\n\
  \n`GPUs` 被证明对改变深度学习面貌至关重要。这种变化的最早迹象之一来自 2010 年的 Jürgen Schmidhuber 及其同事，他们训练了具有多达九个隐藏层和约\
  \ 1200 万参数或权重的多层感知器来分类 `MNIST` 图像。他们实现了低至 0.35% 的错误率。“要实现目前最好的结果，我们需要许多隐藏层、每层许多神经元、大量的扭曲图像，以及极大加速学习的显卡，”\n\
  \n### AlexNet\n\n在 AlexNet 出现之前，Hinton 和一位名叫 Volodymyr Mnih 的研究生就已经理解了 GPU 的用处。他们当时研究航空图像中寻找道路的问题。\n\
  \n一年后，Hinton 的另外两个学生成功使用 `CUDAMat` 编写深度神经网络，在语音识别领域取得了突破。\n\n\n\n讽刺的是，Hinton 在“航拍图像道路”项目中使用非卷积深度神经网络取得的早期成功，推迟了他的实验室进入卷积神经网络的步伐。“我们只是慢了一点点，但\
  \ Ilya [Sutskever] 意识到我们必须这样做，”他说。\n\n2002 年，年仅 17 岁的 Sutskever 加入了多伦多大学。一年之内，他决定从事\
  \ AI 工作。“我想为 AI 贡献力量，”他告诉我，“神经网络看起来显然是正确的。”为此，在他还在本科读二年级时，就敲响了 Hinton 的门。Sutskever\
  \ 记得自己对 Hinton 并不得特别圆滑或礼貌。Hinton 给了 Sutskever 一些论文让他阅读。年轻的 Sutskever 被这些简单想法的威力震撼了。“我清楚记得自己对整件事如此简单感到非常困惑……这怎么可能呢？”他说，“你看看你的本科数学或物理课程，它们是如此复杂。而这些东西却如此简单。你只需要读两篇论文，就能理解如此强大的概念。怎么可能这么简单呢？”\n\
  \nSutskever 拥有计算复杂度理论背景，即研究计算机能做什么和不能做什么的理论。“从计算复杂度理论中得出的结论之一是，某些计算模型比其他模型强大得多，”他说，“关于神经网络，非常明确的一点是，[它们]符合强大计算模型的标准。它已经足够强大了。”\n\
  \n事实上，2009 年出现了一个大到足以对神经网络提出的问题。那一年，斯坦福大学教授李飞飞（Fei-Fei Li）和她的学生发表了一篇论文。\n\n当时，标准的计算机视觉仍然占据主地位。考虑到此，ImageNet\
  \ 挑战赛为用户提供了所谓的尺度不变特征变换（SIFTs）。开发者可以使用这些 SIFTs 从图像中提取已知类型的低级特征，识别这些特征，并使用它们对图像进行分类。（而能够自己找出重要特征的神经网络当时还不在范围内。）2010\
  \ 年，来自日本通电气（NEC）和伊利诺伊大学厄纳纳香槟分校（NEC-UIUC）的团队赢得了挑战。他们的系统基本上使用 SIFTs 将每张图像转换为一个长向量。支持向量机学习了对这些向量进行分类，从而对图像进行分类。\n\
  \n与此同时，Sutskever 预见到了局势。SVM 赢得了 2010 年的比赛，但在他看来，它们是有局限性的。神经网络才是未来。“如果你能找到如何训练它们，如果你能获得数据，那么[神经网络能做到的]天花板就很高。而其他东西，[如]支持向量机——无论你想研究多久都没用。天花板很低……所以，你从一开始就注定失败了，”他告诉我。\n\
  \n数据突然不再是一个问题了。ImageNet 数据集暂时解决此这个问题。然而，训练仍然是一个问题。Sutskever 看到 Hinton 团队在 GPU 上所的工作，将两者结合起来，并推动\
  \ Hinton 构建一个可以使用 GPU 训练的卷积神经网络。“Ilya 是一个远见者。他拥有极佳的直觉和足够的信心，”Hinton 告诉我，“是 Ilya\
  \ 意识到我们正在使用的技术——通过 GPU 和这些新的学习算法——将解决 ImageNet。”贝尔实验室的杨立昆（Yann LeCun）小组也发现了这一点。“Yann\
  \ 发现了同样的问题。他试图让几个不同的研究生去做，但他们没有愿意做，”Hinton 说，“这对我们来说是很幸运的，因为 Ilya 在其他人动手之前意识到我们真的必须这样做。”\n\
  \n关键的帮助以 Alex Krizhevsky 对 GPU 的魔法术形式出现。“他比任何人都更擅长在 GPU 上编写卷积，”Hinton 说。Sutskever\
  \ 和 Krizhevsky 是实验室同学。Krizhevsky 已经写了 `CUDA` 代码，在一个名为 CIFAR（加拿大高级研究学院）的较小图像数据集上训练支持\
  \ GPU 的神经网络。Sutskever 被这段代码惊艳了。他说服了 Krizhevsky 为 ImageNet 做同样的事。\n\n因此，凭借 GPU 的力量和海量数据——这是\
  \ LeCun 在 1989 年不具备的两点——Krizhevsky、Sutskever 和 Hinton 构建了 AlexNet。这是一种在来自 ImageNet\
  \ 数据集的 120 万张高分辨率图像上训练的深度卷积神经网络，包含一千个类别。它有五个卷积层，其中一些层连接到最大池化层。它有两层全连接神经元层，与我们之前的示例非常相似。最终的输出层有一千个神经元，每个种图像类别对应一个。该神经网络有超过五十万个神经元和\
  \ 6000 万个参数（或权重），这些值在训练过程中必须被学习。还有其他较小但重要的技术进步（例如，为神经元选择了不同的激活函数，称为整流线性单元，ReLU，而不是\
  \ Sigmoid 函数）。\n\n2012 年，李飞飞团队公布了他们的年度图像识别大赛的结果。AlexNet（名之其实地被称为多伦多小组的网络）以巨大优势获胜。AlexNet\
  \ 对 ImageNet 测试集中的图像进行分类，其前-5 错误率低至 17%（前-5 错误率是指图像的正确标签未出现在 ML 模型预测的前五个最可能标签中的百分比）。2010\
  \ 年和 2011 年的获胜者远远落后，分别为 28% 和 26%。非神经网络系统几乎没有取得进展。深度网络终于兑现了它们的承诺。Sutskever 证明了自己的正确，因为在三人开始构建\
  \ AlexNet 之前，他一直在宣教。“我会到处跑去烦别人，”他告诉我，“我会告诉他们深度学习将改变一切。”\n\n它确实做到了。\n\n\n\n\n> `⇒\
  \ sum``[mod97]` = 50\n\n或者，如果你想加 40 和 59：\n\n> `sum` = 40 + 59 = 99 = 2 + (1 × 97)\n\
  \n> `⇒ sum``[mod97]` = 2\n\n这看似是一个微不足道的问题，但它是理解如何让 AI 进行分析性推理的必要步骤。一位训练神经网络的团队成员去休假了，忘记停止训练算法。当他回来时，他惊讶地发现，神经网络已经学会了加法的通用形式。这就好像它理解了关于该问题更深层次的东西，而不仅仅是记忆它所接受训练的数字集合的答案。\n\
  \n在科学发现偶然发现的这一悠久传统中，该团队偶然发现了深度神经网络的一种奇特新属性，他们将其称为为“顿悟（grokking）”。\n\n“顿悟”只是深度神经网络所表现出的许多异常行为之一（我们将在本章稍后部分进行详细讨论）。另一种行为与这些网络的大小有关。如今最成功的神经网络，无论是在图像识别、语音识别还是自然语言处理，都是巨然大物：它们拥有数亿或数十亿个权重或参数；甚至可能有万亿。参数的数量有时等于或远于用于训练这些网络的数据实例。标准的机器学习理论认为，这类网络不应该像现在这样工作：它们应该会对数据进行过拟合，而无法对新的、未见的数据进行推断或“泛化到”这些数据。\n\
  \nPower 用一个例子说明了这个问题。考虑一个包含某些类型家具图像的数据集。该数据集分为两个部分：训练集和测试集。假设训练数据集包含四腿椅的图像，但只有金属或木头制成的。这些被标记为“椅子”。数据中也有沙发的图像，但没有明显的腿。这些被标记为“非椅子”。机器学习算法的任务是将图像分类为“椅子”或“非椅子”。一旦算法完成训练，就会在测试集上对其性能进行测试。恰恰是，测试集里也包含了塑料制成的椅子，而不仅仅是木头或金属制成的。算法的表现会如何？\n\
  \n可能会发生以下情况。如果正在训练的机器学习模型非常复杂，具有大量的参数，它可能会学到关于椅子的知识，超出了“这些椅子有四条腿”这一事实。它可能会学习它们是由木头或金属制成的。这样的模型对于识别金属或木制椅子会非常好，但它可能无法识别测试数据中的塑料椅子。这种模型被认为对训练数据发生了过拟合，捕捉了对当前任务没有必要、甚至可能产生反作用的椅子细微差别。一个参数较少的更简单的模型可能只捕捉到“椅子有四条腿”这一模式；这样它对未见的数据泛化得更好，并可能识别出木头和金属以外材料制成的椅子。\n\
  \n我们可以用一个简单得多的数据集来可视化。让我们取 `xy` 平面上的一些点。我们的任务是训练一个机器学习模型来进行回归，找到一条拟合训练数据的曲线，使模型能够良好地泛化到未见的数据。首先，是一些训练数据，然后是三个不同的模型（或曲线）来拟合数据：\n\
  \n![](img/p385_01.png)\n\n我们能做的最简单的事情是线性回归：通过数据拟合一条直线。这是一个简单的模型。几乎没有训练数据落在直线上，因此模型将在几乎每一个训练数据实例上产生大小不一的错误。\n\
  \n如果我们通过增加更多参数和一些非线性来增加模型的复杂度，我们可能会找到一条稍微忠实地拟合训练数据的曲线。现在，模型在训练数据上产生错误的风险降低了：曲线实际上穿过了某些数据点，尽管不是全部，而它错过的点将导致训练误差。\n\
  \n最后一个面板显示了一个具有相当更多参数的复杂非线性模型：曲线穿过了每一个数据点。训练误差几乎为零。\n\n我们应该选择哪种模型？这不是一个容易回答的问题。选择取决于模型在你预留的测试数据上的表现。假设测试数据和训练数据是提取自相同的底层分布。（在椅子的例子中，测试数据可以被认为是离群分布的，因为它们有塑料椅子的图像，而训练数据中没有。但这些都是有争议的问题。如果算法的任务是分类椅子，那么它们是由什么制成的就无关了——所以，塑料椅子应该被认为提取自相同的底层分布。）\n\
  \n假设穿过数据集的直线在多程度上是正确的拟合，而训练数据散落在直线周围是因为数据中存在噪声。在最简单的线性模型的情况下，直线并没有拟合噪声；而是忽略了噪声。但由于测试数据提取自相同的分布，并且假设具有相似的噪声，最简单的线性模型在测试数据上的表现也会很糟糕；在测试数据上存在很高的错误风险。\n\
  \n然而，最复杂的模型显然追踪了训练数据的每一个微小变化：它本质上过拟合了数据，如果数据中的变化是因为噪声，那么模型就学习了这些噪声的细微之处。然而，复杂模型在测试数据上的预测也会非常离谱，因为测试数据同样具有噪声。复杂模型将根据它学到的极其扭曲的回归曲线进行预测，这条曲线特定于训练数据中的噪声，但由于噪声是随机的，曲线对测试数据实例的追踪效果不如对训练数据，从而导致显著的测试误差。\n\
  \n我们用回归作为一个例子，但这个问题也困扰分类问题，分类涉及寻找一个分割数据簇的线性或非线性边界。如果模型太简单，它将找到一个并不完全符合数据真实变化的边界：你无法将训练误差和测试误差降低到可接受范围内。如果模型太复杂，分类边界将追踪数据的每一个微小偏差，产生过拟合，在训练数据上表现非常好，但在测试期间可能会产生巨大的分类错误。\n\
  \n### 金发姑娘法则\n\n这些听起来似乎只有吹牛毛求的机器学习从业者才会关心的理论问题，但让我们来看看第 6 章（chapter006.xhtml）中的一个例子，看看为什么这个问题可能真的关乎生死。这张图表显示了对从一个麻醉期间接受监测的个体采集的真实\
  \ EEG 数据进行主成分分析后的结果。灰色点代表人有意识的每秒间隔；黑色三角形代表人无意识期间。这些是训练数据。\n\n![](img/p387_01.png)\n\
  \n\n\n\n想象构建一个简单的分类器，学习如何将意识状态与无意识状态区分来。你可以找到一条直线（一个非常简单的模型）来尝试分离这两个簇。由于这两个簇之间没有清晰的间隙，我们找到的任何直线在训练过程中都会产生错误：在黑色三角形簇中总会有几个灰色圆点，反之亦然。为了减少这种训练误差，我们可以找到某些弯曲的曲线，仔细地描绘这两个簇之间边界的轮廓。例如，你可以使用\
  \ k-最近邻算法（第 5 章）`k`。你会得到一个高度线性的边界。可以构建这样的模型来最小化训练中的误差。\n\n无论你选择哪种模型，它都必须根据一些新的 EEG\
  \ 信号预测意识状态，以帮助麻醉医生确定麻醉剂量，从而使人处于无意识状态或从无意识中醒来。显然，ML 模型的建议在这里非常重要。出错将导致后果。你会如何寻找最好的模型呢？\n\
  \n回想第 6 章，该 EEG 研究收集了十名患者的数据。研究人员使用七名患者的数据来训练他们的模型并构建分类器，并留出三名患者的数据来测试他们的模型。假设我们针对三名患者的测试数据测试一个极其简单的线性模型和一个高度复杂的非线性模型。简单的线性模型在训练过程中会产生更多错误，因为它欠拟合了训练数据，并且在测试数据上也会产生错误。复杂的非线性模型虽然在训练数据上的误差几乎为零，但在测试期间会产生显著误差，恰恰是因为它记住了训练数据，而这些数据仅取自七位独立参与者。\n\
  \n为什么测试误差很重要？测试数据是我们手头有的、但在训练过程中对 ML 算法保留的数据。训练后的模型在测试数据上的表现如何，是我们判断其在真实环境中潜在性能的唯一指标，意味着它泛化到真正未见数据的能力。我们希望测试误差越低越好。\n\
  \n如此，如何选择正确的模型复杂度水平？这引导我们关注这里起作用的两种相互竞争的力量。一种被称为偏差（bias）：模型越简单，偏差越大。另一种被称为方差（variance）：模型越复杂，方差越大。\n\
  \n高偏差（即更简单的模型）会导致欠拟合、产生高的训练误差风险和更高的测试误差风险；而高方差（即更复杂的模型）会导致过拟合、较低的训练误差风险和更高的测试误差风险。ML\
  \ 工程师的工作是找到那个甜点。如果 ML 模型中存在的参数数量（或可调旋钮数量）被视为模型复杂度或容量的衡量标准，那么标准的 ML 理论认为，模型应该具有恰好数量的参数：参数太少，模型太简单（高偏差），且无法捕捉其训练数据中必要的细微差别；参数太多，模型就会变得非常复杂，并以如此精细的粒度学习数据中的模式，以至于无法泛化到未见的数据。“这在某种程度上是对你的数据拟合得太好与完全不拟合之间的一种平衡。你想处于中间位置，”\n\
  \n下所示描绘了你在机器学习中看到的最著名的曲线组之一。它描绘了偏差-方差权衡。\n\n![](img/p390_01.png)\n\n简单说明一下 x 轴上的标签“假设类容量（Capacity\
  \ of Hypothesis Class）”以及它与模型复杂性和参数数量的关系。给定一组可以在训练期间调整其数值的参数，我们必须回到监督学习的基础，来思考这些参数让\
  \ ML 模型能够做什么。\n\n假设我们有以 `(input, output)` 对形式存在的训练数据：\n\n```\n[(x1, y1), (x2, y2),\
  \ …, (xn, yn)]\n```\n\n我们要利用训练数据找到一个给定输入 `x` 预测 `y` 的函数 `f`：\n\n```\ny = f(x)\n\
  ```\n\n\n\n\n在 AlexNet 于 2011 年在机器学习舞台亮相几年后，来自芝加哥理工学院的 Behnam Neyshabur、Ryota Tomioka\
  \ 和 Nathan Srebro 对深度神经网络有了一个引人入胜的观察。他们在对仅有一个隐藏层的网络进行实验时发现，与预期相反，增加隐藏层中神经元（或单元）的数量（即模型的容量）`did\
  \ not` 导致网络对训练数据产生过拟合。这三个人在两个标准图像数据集上对他们的网络进行了测试，其中一个是手写数字 MNIST 数据集。首先，随着网络规模的增大，训练误差和测试误差如预期地下降。但随后，随着网络规模增大且训练误差接近零，根据偏差-方差权（bias-variance\
  \ trade-off）曲线，测试误差（或泛化误差）本应该开始上升。但这并不是他们看到的。他们在 2015 年论文中的语言表达了他们的不可信：\n\n> “令人惊讶的是，如果我们把网络扩大到达到零训练误差所需的尺寸，测试误差仍然继续下降！这种行为完全没有被预测，甚至与将学习视为拟合由网络大小控制的假设类观点相悖。例如对于\
  \ MNIST 而言，32 个单元就足以达到零训练误差。当我们允许更多单元时，网络并没有更好地拟合训练数据……然而，测试误差下降了。事实上，随着我们增加越来越多的参数，甚至超过了训练示例的数量，泛化误差也没有上升。”\n\
  \n> 公平地说，关于深度神经网络这种行为的暗示在该工作之前就已经。但 Neyshabur 及其同事是第一个系统地测试它的人。他们更进一步。如果故意向数据集中引入噪声会怎样？\n\
  \n> 以 MNIST 数据集的图像为例。每张图像都有一个对应的标签：数字 5 是“five”，数字 6 是“six”，以此此类推。取这些图像的 1%，随机打乱它们的标签。这样，一个数字\
  \ 5 的实例可能被误标记为“four”，一个数字 9 的实例可能被误标记为“two”。现在将数据集分为训练数据和测试数据，并训练你的神经网络，使其在训练数据上实现零训练误差。这意味着什么？嗯，由于我们故意向数据中引入了噪声，网络——因为它在训练数据上没有犯错误——正在适应这些噪声。例如，它正在学习将那些误标记的数字\
  \ 5 和 9 分别标记为“four”和“two”。它正在完美地拟合数据。学习理论有一个生动的词来描述这样的模型：它被认为“粉碎”（shatter）了训练数据。\n\
  \n> 因为因为它完美地拟合了带噪声的训练数据，这个模型在测试数据上的表现不应该好。（直观上，模型学习到的弯曲曲线对于它所遇到的噪声非常特殊，没有理由期望模型能够泛化。）但发生的情况并非如此。Neyshabur\
  \ 及其同事写道：“即使有百分之五的随机标签，也没有显著的过拟合，并且随着网络尺寸超过达到零训练误差所需的尺寸，测试误差继续下降。”\n\n> 他们的困惑是有理由的。在标准的思维方式下，这种行为只有在\
  \ `stochastic gradient descent` 以某种方式对模型进行了 `regularizing` 时才可能。有显式的方法的方法；`stochastic\
  \ gradient descent` 正在进行某些 `implicit regularization`，使模型变得简单。然后，在 2016 年，当时在 MIT\
  \ 的 Chiyuan Zhang 与加州大学伯克利分校的 Ben Recht 及其同事在更大的网络中展示了类似的行为。在他们标题具有挑战性的论文《理解深度学习需要重新思考》中，他们得出结论：“我们强调的实验表明，几种神经网络架构的容量足以以\
  \ `shatter` 训练数据。因此，传统的复杂度衡量标准难以解释泛化能力。”\n\n> 这是 2017 年的情况，当时加州大学伯克利分校的西蒙计算理论研究所举办了为期三个月的机器学习理论基础课程。深度神经网络提出的问题变得更加清晰。这些网络插值数据（意味着完美地拟合训练数据），却在测试数据上做出准确的预测。即使噪声影响了数据集约\
  \ 5% 或更多，核机和神经网络的性能都没有如预期那样下降。“当时每个人都超级困惑，”他回忆道。另一位机器学习专家，卡内基·梅隆大学的 Ruslan Salakhutdinov\
  \ 做了深度学习的教程。Belkin 记得 Salakhutdinov 说：“从实践角度来看，解决问题的最佳方法是建立一个非常大的系统……基本上你想要确保命中零误差。”\n\
  \n> 但 Belkin 很快意识到，他当时所在的俄亥俄州立大学实验室正在进行的核方法（我们在第 7 章中遇到过）的工作已经在暗示类似的事情了。“我们一直在用核做这种实验。我们观察到你可以训练并获得零或小的损失，而且它是有效的，”Belkin\
  \ 说，他现在位于加州大学圣地亚哥分校。\n\n事实证明，标准学习理论（以及偏差-方差权）在所有情况下并不成立线索一直在积累。例如，加州大学伯克利分校的统计学家\
  \ Leo Breiman 在 1995 年写了一篇论文：\n\n> 受在西蒙研究所三个月期间辩论的启发，Belkin 开始对核方法和深度神经网络进行系统性研究，本质上是探测它们在训练集中噪声增加时的性能。模型的复杂度或容量足以插值带噪声的数据。“随着你增加噪声水平，没有什么东西真正坏掉，”Belkin\
  \ 说。\n\n> 与此同时，Bartlett 和他的同事开始探索这种现象并给它起了一个迷人的名字：“良性过拟合”（benign overfitting）。然而，其他人称其为无害的插值。\n\
  \n\n\n\n\n对于 Belkin 来说，AdaBoost、核机和神经网络的这种相似行为暗示了某种深层含义。“也许研究人员并没有完全理解机器学习本身的惊人特性，”他想道，这种意识到仅仅因为深度神经网络以及它们似乎违背规律的能力才变得显而易见。“我们曾通过选择性地忽略那些不符合模式的事物，来说服自己[机器学习]是没问题的，”Belkin\
  \ 告诉我，“我的感觉是理论并不没问题。”\n\n使用随机梯度下降法训练的深度神经网络正引导着机器学习研究人员进入未知的领域。Belkin 将此称为机器学习的“未知领域（terra\
  \ incognita）”。但在我们领会其此的意义之前，为了理解神经网络为何将我们带到这一步，我们需要进行一个简短的过渡，来欣赏构建和训练它们的各种方式。\n\n\
  # 参数与超参数\n\n机器学习对未知领域的发现与探索之所以能够实现，得益于人工智能研究的一项根本性转变，这种转变涉及到对深度神经网络和其他架构进行实验。为了进行此类实验，研究人员必须调整参数和超参数。我们知道，参数是模型中的那些旋钮——例如神经网络的权重——它们在训练过程中会进行调整。而超参数是工程师在训练开始之前设置的旋钮。后者包括：神经网络的架构（它决定了层数、每层的神经元数量以及这些层之间相互连接的方式）、训练数据的大小、优化算法的精确类型，以及是否进行显式正则化（如剪枝参数数量）。为超参数寻找良好或最优值是一门手艺，几乎是一门艺术。\n\
  \n在本书中，我们查看了一些神经网络架构：单层感知器、Hopfield 网络（第 8 章）、多层感知器（第 10 章）以及卷积神经网络（第 11 章）。但在过去的十年左右里，深度神经网络架构爆发式增长，创造了一个名其实际的大动物园。尽管如此，人们仍然可以从宏观角度对它们进行大分类。\n\
  \n首先，通俗来说，网络可以是前馈的或循环的。前馈神经网络是指信息单向从输入层流向输出层流的神经网络。因此，如果一个神经元产生输出，该输出仅作为后续层中神经元的输入。输出不能返回作为同一层或前序层神经元的输入。相比之下，循环神经网络允许反馈连接，使得神经元的输出不仅影响后续层的神经元，还可以作为同一层或之前层中神经元的输入。这使得循环神经网络能够“记住”之前的输入，使得它们对于涉及随时间变化的输入的问题非常有用。（这的一个极佳例子是一个被称为长短期记忆的循环神经网络架构，\n\
  \n`backpropagation`（反向传播）算法是训练神经网络（特别是前馈网络）的主力。该算法也可以用于训练循环网络，但我们在这里不会涉及其细节。无论是什么种类型的网络，这里我们在概念上需要理解的一点：给定一个输入，神经网络将产生一个输出。我们可以定义一个函数，通过某种预定义方式将产生的输出与预期输出进行比较，来计算网络所产生的损失（或误差）。该函数计算单个训练数据实例的损失，或者计算所有训练数据实例的平均损失，被称为损失函数（loss\
  \ function）或代价函数（cost function）。训练网络意味着最小化训练数据上的损失。\n\n我们已经看到，训练模型以达到零训练成本可能会导致过拟合。为了防止这种情况，通常会在代价函数中添加另一个项，称为正则化项（regularizer）。将其视为一个迫使函数考虑到模型复杂度或容量的项；我们为模型变得过于复杂而受到惩罚。在神经网络中，显式正则化有助于防止过拟合。例如，正则化可以防止网络的权重（或参数）值变得过大，其假设是权重越大意味着模型越复杂，反之亦然。\n\
  \n还有其他更有趣的方法防止过拟合。例如，你可以设置网络在训练期间随机丢弃某些连接（从而减少有效参数的数量）。我们还可以为神经元选择激活函数。在第 9 章和第\
  \ 10 章中，我们遇到了 `sigmoid` 激活函数。还有其他的。不同的激活函数会导致神经元及其构成的网络产生不同的行为；最重要的是，这些函数必须是可微的，以便\
  \ `backpropagation` 起作用。（正如前面提到的，某些激活函数在其整个定义范围内是不可微的，但只要小心仍然可以使用。例如，`ReLU` 函数\n\
  \n一个机器学习工程师除了要在这些各种超参数中进行选择外，还必须更宽泛地选择使用监督学习还是无监督学习。我们主要关注监督学习，它需要带标记的训练数据——这意味着对于每个输入，都有一个对应的预期输出。这使我们能够计算每个训练数据实例的损失。我们还简要接触了无监督学习，在无监督学习中，必须告诉算法训练数据集中有多少簇，然后它就能找到这些簇并将每个数据实例分配给其中一个簇。然而，过去五年最重大的进展之一——导致了人们对\
  \ ChatGPT 等人工智能兴趣爆炸式增长的原因——是自监督学习（self-supervised learning），这是一种巧妙的方法，它利用无标记数据并在没有人类干预的情况下创建标签，然后进行自我监督。\n\
  \n## 伯克利的一个赌注\n\n2014 年，加州大学伯克利分校的一组研究人员（其中包括计算机视觉领域的专家 Jitendra Malik）开发了一种深度神经网络解决方案，该方案在一种名为模式分析、统计建模和计算学习（PASCAL）视觉对象类（VOC）的计算机视觉任务中表现出色。这项任务涉及学习给定较小的图像数据集，为图像中的不同类别物体画框或进行分割（例如自行车、汽车、马、人和羊），然后对它们进行命名。\n\
  \n为了解决这个问题，Malik 和他的同事首先使用监督学习在规模更大的 `ImageNet` 数据集上训练了一个 `CNN`（也就是 `AlexNet` 在\
  \ 2011 年攻克的同一个数据集）。这仅仅是关于如何使用人类生成的标签对图像进行分类。团队获取了这个“预训练”网络并在 PASCAL VOC 数据集上对其进一步微调。这些图像具有人类识别的“边界框”，划定了图像中各种类别的物体。微调后的网络被称为\
  \ `R-CNN`，它能够在检测测试数据中的物体边界并对其进行相应分类方面优于现有方法。\n\n\n\n\n\n对于 Alexei Efros 来说（他也是加州大学伯克利分校的计算机视觉专家，Malik\
  \ 的学生），`R-CNN` 方法令他感到困惑。为什么一个先在 `ImageNet` 数据上进行训练、其标签仅指向图像中某些物体（例如，猫或汽车）而不考虑其实际形状或边界的网络，在使用了由人类对目标物体进行框选标注的数据集进行微调后，竟然在检测物体边界时表现得良好呢？而同一个网络，在没有\
  \ `ImageNet` 预训练的情况下，仅在 `PASCAL VOC` 数据集上进行训练时，表现就很糟糕。Efros 推测，也许这个 `CNN` 仅仅是渴求\
  \ `ImageNet` 数据集中包含的通用信息，而人类提供的将图像标记为汽车、狗、猫等类的标注并没有太大价值。\n\n    于是，在 2014 年 9 月\
  \ 23 日，在伯克利大学校区北部边缘的一家咖啡馆，Efros 与 Malik 打了一个赌，赌说在一年内将出现一种机器学习算法，可以在不使用人类提供的标签（如\
  \ `ImageNet` 中提供的标签）的情况下进行物体检测。这个赌约正式成立：“如果到 2015 年秋季的第一天（9 月 23 日），存在一种方法能够在 `Pascal\
  \ VOC` 检测任务上达到并优于或超过 `R-CNN` 的性能，且不使用任何额外的人类标注（例如 `ImageNet`）作为预训练，Malik 先生承诺为 Efros\
  \ 先生买一份意式冰淇（两球：一个巧克力味，一个香草味）。”\n\n    回顾过去，自监督学习似乎异常简单。以 `GPT-3`（`ChatGPT` 的前身）等大语言模型（`LLMs`）为例。它们在从网上抓取的海量文本语料上进行训练。训练算法取一个小句子，掩码其中一个单词，并将带有掩码词的句子作为输入（细节要复杂一些，但我们把掩码词视为信息的单位）。网络的任务是：预测缺失的单词并完成句子。假设句子是“我要走回\
  \ \\_\\_\\_。”被掩码的词是“家”。起初，网络很可能会猜错。可以定义一个 `loss function`（损失函数）来计算网络错误的程度。`backpropagation`（反向传播）算法和\
  \ `stochastic gradient descent`（随机梯度下降）结合使用，首先将错误的部分责任归于网络中的每个参数，然后更新参数值以减少损失；如果给网络相同的掩码句子并要求再次预测，它的表现会好一点。训练算法遍历训练文本语料中的每一个句子，掩码一个单词，要求网络预测掩码词，计算\
  \ `loss`，然后更新网络参数以稍微减少损失。（增加了一个复杂性：我们示例中掩码句子的空白处如果训练数据中存在这样的句子，完全可以由“alone”一词来补全。因此，`LLM`\
  \ 的预测本质上是概率性的，例如，如果它在训练过程中遇到“home”的频率高于“alone”，那么它就会给“home”分配比“alone”更高的概率。）\n\n\
  \    虽然每次迭代都是微不足道的，但对从互联网获取的数十亿页文本进行迭代是一项艰巨的任务。截至本文，密集连接的 `LLMs`——这里的“密集”指的是某一层中神经元的输出成为下一层每个神经元的输入——拥有超过\
  \ 50 万亿个参数，而且更大的网络指在必尺。随着这些网络变得越来越大，它们的行为继续挑战我们对机器学习的传统理解，特别是偏差-方差权衡曲线的格局。\n\n \
