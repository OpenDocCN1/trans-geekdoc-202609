  \n[content]\n\n    对于 Alexei Efros 来说（他也是加州大学伯克利分校的计算机视觉专家，Malik 的学生），`R-CNN` 方法令他感到困惑。为什么一个先在\
  \ `ImageNet` 数据上进行训练、其标签仅指向图像中某些物体（例如，猫或汽车）而不考虑其实际形状或边界的网络，在使用了人类对目标物体进行框选标注的数据集进行微调后，竟然在检测物体边界时表现得良好呢？而同一个网络，在没有\
  \ `ImageNet` 预训练的情况下，仅在 `PASCAL VOC` 数据集上进行训练时，表现就很糟糕。Efros 推测，也许这个 `CNN` 仅仅是渴求\
  \ `ImageNet` 数据集中包含的通用信息，而人类提供的将图像标记为汽车、狗、猫等类的标注并没有太大价值。\n\n    于是，在 2014 年 9 月\
  \ 23 日，在伯克利大学校区北部边缘的一家咖啡馆，Efros 与 Malik 打了一个赌，赌说在一年内将出现一种机器学习算法，可以在不使用人类提供的标签（如\
  \ `ImageNet` 中提供的标签）的情况下进行物体检测。这个赌约正式成立：“如果到 2015 年秋季的第一天（9 月 23 日），存在一种方法能够在 `Pascal\
  \ VOC` 检测任务上达到并优于或超过 `R-CNN` 的性能，且不使用任何额外的人类标注（例如 `ImageNet`）作为预训练，Malik 先生承诺为 Efros\
  \ 先生买一份意式冰淇（两球：一个巧克力味，一个香草味）。”\n\n    回顾过去，自监督学习似乎异常简单。以 `GPT-3`（`ChatGPT` 的前身）等大语言模型（`LLMs`）为例。它们在从网上抓取的海量文本语料上进行训练。训练算法取一个小句子，掩码其中一个单词，并将带有掩码词的句子作为输入（细节要复杂一些，但我们把掩码词视为信息的单位）。网络的任务是：预测缺失的单词并完成句子。假设句子是“我要走回\
  \ \\_\\_\\_。”被掩码的词是“家”。起初，网络很可能会猜错。可以定义一个 `loss function`（损失函数）来计算网络错误的程度。`backpropagation`（反向传播）算法和\
  \ `stochastic gradient descent`（随机梯度下降）结合使用，首先将错误的部分责任归于网络中的每个参数，然后更新参数值以减少损失；如果给网络相同的掩码句子并要求再次预测，它的表现会好一点。训练算法遍历训练文本语料中的每一个句子，掩码一个单词，要求网络预测掩码词，计算\
  \ `loss`，然后更新网络参数以稍微减少损失。（增加了一个复杂性：我们示例中掩码句子的空白处如果训练数据中存在这样的句子，完全可以由“alone”一词来补全。因此，`LLM`\
  \ 的预测本质上是概率性的，例如，如果它在训练过程中遇到“home”的频率高于“alone”，那么它就会给“home”分配比“alone”更高的概率。）\n\n\
  \    虽然每次迭代都是微不足道的，但对从互联网获取的数十亿页文本进行迭代是一项艰巨的任务。截至本文，密集连接的 `LLMs`——这里的“密集”指的是某一层中神经元的输出成为下一层每个神经元的输入——拥有超过\
  \ 50 万亿个参数，而且更大的网络指在必尺。随着这些网络变得越来越大，它们的行为继续挑战我们对机器学习的传统理解，特别是偏差-方差权衡曲线的格局。\n\n \
  \   虽然每次迭代都是微不足道的，但对从互联网获取的数十亿页文本进行迭代是一项艰巨的任务。截至本文，密集连接的 `LLMs`——这里的“密集”指的是某一层中神经元的输出成为下一层每个神经元的输入——拥有超过\
  \ 50 万亿个参数，而且更大的网络指在必得。研究人员正在争论 `LLMs` 究竟是在推理，还是仅仅在复述文本。\n\n    （注：原文中重复了多次相同的段落，已根据指令要求在译文中进行去重，仅保留核心内容）\n\
  \n    一个格局中最有趣的区域\n\n    Belkin 和他的同事是最早系统地探索该区域的人之一。在 2018 年，他们展示了当你在插值点之后继续增加容量时，核机和深度神经网络的性能开始提高，从而获得更低的测试风险和更好的性能。这种行为早在\
  \ 90 年代在某些线性模型中被经验观察到。Belkin 和他的同事将这种现象命名为“双下降”，并认为它是一个统一原理：第一次下降导致测试误差的最小值，随后是上升，然后再次下降到低水平的水平。\n\
  \n    将自监督学习应用于视觉领域的努力从未达到这种成功水平。当 `MAE` 以这种方式训练后在物体检测和分割任务上进行微调时，它的表现优于 `R-CNN`。\n\
  \n    向自监督学习的移动具有巨大的影响，因为它将机器学习从极其昂贵的人工标注数据的束缚中解放出来。Efros 喜欢说：“革命将不会是有监督的。”\n\n\n\
  \n\n曲线被第一次下降和随后的上升所捕捉的部分已经得到了很好的理解；数学已经解释了 `ML` 系统在那种“参数不足”状态下的行为（这主要归功于我们在第 7 章中遇到的弗拉基米尔·沃普尼）。但较新的、导致第二次下降的过参数化状态，从数学角度来说，几乎不为人知。“我们现在至少有了一张地图。在世界的这一部分区域，存在着某种未知领域（terra\
  \ incognita）。我们并不知道那里到底发生了什么，”Belkin 告诉我。\n\nBelkin 和其他人承认的这种无知，主要是关于对神经网络在这一新的、过参数化状态下观察到的行为缺乏数学基础。这对于\
  \ `ML` 研究领域来说是有些出乎意料的。事实上，这本书的大部分内容都在赞叹这样一个事实：传统机器学习拥有良好良好数学原则作为基础，但深度神经网络——尤其是我们今天看到的巨型网络——打破了这一局面。突然之间，对这些网络的经验观察开始了引领方向。一种新的\
  \ AI 模式似乎正在走来。\n\n2022 年 1 月，在国家科学基金会支持下举行的一场全体会议，马里兰大学的 Tom Goldstein 认为，机器学习的历史很大程度上集中在具有理论原则的数学框架上（例如那些带给我们支持向量机和核方法的框架）。但到\
  \ 2011 年，当 `AlexNet` 赢得 ImageNet 比赛时，情况发生了变化。`AlexNet` 取得了巨大的实验成功；但没有足够的理论来解释它的性能。根据\
  \ Goldstein 的说法，AI 社区在对自己说：“也许我们不应该如此关注理论。也许我们应该通过实验科学来推进机器学习。”\n\n当涉及到深度学习时，理论与实验之间的这种张力正向所有人面前上演。例如，考虑损失函数。我们在第\
  \ 3 章中看到，当 `gradient descent` 在碗状的“凸”函数上执行时，会引导你到达碗底。但深度神经网络的损失函数取决于其数以亿计的参数以及神经元的非线性激活函数。该函数不再是凸的，意味着它没有一个你可以向之下降的全局最小值。在数百万维甚至更高维的空间中可视化凸函数已经足够困难了，更不用说一个拥有无数山峰和山谷、每个山谷都构成局部最小值的非凸函数了。最好是将其想象为一个极其复杂的损失景观。到目前为止，没有人知道这个景观是否存在全局最小值，还是仅仅有很多良好的局部最小值（“良好”意味着损失处于可以接受的水平）。\n\
  \nGoldstein 为理论学家指出了问题，他指出大量的理论论文，这些论文声称已证明深度神经网络的损失景观没有局部最小值，而其他论文显示了完全相反的结论，它们确实有局部最小值。这是\
  \ Goldstein 和同事进行的一项实证研究。\n\n另一个有趣的实验观察是我们在书中已经遇到的：深度神经网络尽管过参数化，但具有良好的泛化能力。一种试图解释这一现象的理论尝试是：`stochastic\
  \ gradient descent`（使用小批次训练数据执行 `gradient descent`，因此沿损失景观的每次下降都是近似的，而不是沿着精确的最速下降方向）可能在进行隐式正则化。然而，Goldstein\
  \ 的团队进行的实验说明，在某些情况下，一次性使用整个训练数据的 `gradient descent` 泛化效果同样良好；并不随机性。\n\n需要理论的经验观察中最优雅的演示之一是\
  \ `grokking`（顿悟）。我们在本章的开头讲述了一个 OpenAI 研究员的故事，他休假回来后发现继续训练的神经网络已经通过模 97 算术学习了关于两个数字相加的深层知识。“这完全不是我们预料会发现的东西，”Alethea\
  \ Power 告诉我，“起初，我们认为这是一个偶然，并对此进行了深入研究。结果证明这是非常可靠会发生的现象。”\n\nPower 和她的同事使用的神经网络被称为\
  \ transformer，这是一种特别适合处理顺序数据的架构。像 `ChatGPT` 这样的 `LLMs` 就是 transformer；`GPT` 代表“生成式预训练变换”（generative\
  \ pre-trained transformer）。给定一个例如十个单词的序列并预测下一个最可能的词，`transformer` 有能力同时“关注”到所有单词以及单词的顺序，而不仅仅是将它们视为某些随机的杂乱。当然，商业级\
  \ `LLMs` 是庞然大物，拥有数十甚至数百亿的参数。相比之下，Power 团队使用的 `transformer` 非常小，参数少于五十万。以下是研究人员用于训练网络的数据类型示例（为了传达过程中的概念元素，这是一个过度简化的版本）：\n\
  \n```\na + b = c, where a, b, and `c` are binary numbers. The addition is modulo-97.\
  \ The numbers `a` and `b` are constrained, such that:\n\n0 <= a, b < 97\n```\n\n\
  给定这些约束，想象一张列出 `a` 和 `b` 的所有可能值以及对应的模 97 和 `c` 的表格。例如，这里是此类表格的一些行（数字以十进制显示而非二进制格式，以便清晰）：\n\
  \n```\n0 + 5 = 5\n1 + 9 = 10\n10 + 90 = 3\n11 + 55 = 66\n25 + 95 = 23\n```\n\n为了训练网络，这个数字表首先被随机分成构成训练数据和测试数据的行。现在取训练数据中的每一行，掩盖\
  \ `a`、`b` 或 `c` 中的一个，并要求网络预测被掩盖的数字。起，`transformer` 会预测错误的值。算法计算损失并对参数值进行微小更新，以便该数据实例的损失稍微减少。（为了效率，算法可能会使用“批次”，或一次性使用训练数据行的某些子集，计算平均损失并执行\
  \ `stochastic gradient descent`；或者它可能会使用所有行来计算平均损失并执行 `gradient descent`。）算法反复迭代所有训练数据实例，直到最终训练损失接近于零甚至变为零。在这个阶段发生了什么？\n\
  \n嗯，`transformer` 学习了如何在某种内部高维空间中表示每个数字，并学习学会了按照模 97 加法进行数字相加。如果在网络达到零训练损失的那个点上停止训练，那么网络可能只是插值了训练数据——意味着它仅仅是记住了它们。而这通常是\
  \ OpenAI 研究员停止训练的地方。没有人考虑过进一步训练。但随后某一天，由于休假引起的小意外，网络越过了这个点继续训练——并学习了完全新的东西。“如果[网络]在问题上运行足够长的时间（这是一个非常长的时间，比记忆训练集的时间长几个数量级），它们突然就会领悟更深层的底层模式，并能够对数据集中的其他问题做出大致准确的预测，”Power\
  \ 告诉我，“这是一个奇特的现象。这并不是我们预料的。”\n\n\n\n\n当研究人员在网络刚刚插值训练数据后不久停止训练时，它在测试数据上的表现并不理想（也就是说，表格中训练过程中未使用的行）。它就像是为它已经遇到的数据记忆了一张查找表，当这些数字在测试期间出现时，它只需查阅自己构建的表格并吐出答案即可。但当它遇到无法查找的数据时，它就做出了糟糕的预测。\n\
  \n然而，当允许网络学习远超插值点时，网络以一种完全不同的方式领会了这个问题。现在它在未见过的数据上表现良好，优于一个仅仅记忆训练数据的模型的预期。Power\
  \ 的团队使用了一种技术来可视化网络学习到的内容——这涉及到将高维向量映射到二维空间（有点像我们在第 6 章中看到的主成分分析，但并不完全相同），并发现网络已经学会将数字表示成一个圆。所以，想象将数字\
  \ 0 到 9 排成一个圆。现在，给定两个要相加的数字，网络只需取第一个数字（即圆上的某个位置），沿着该圆移动等于第二个数字的步数，然后……宾果！它得出了答案。其他研究人员将这种领会（grokking）称为类似于经历相变（物理学中水变成冰的方式）。Power\
  \ 说：“这种相变似乎是从一个记忆化的答案表转变为某种意义上的知识。”\n\n到目前为止，只有当网络及其相关的训练数据集极小时同时，这种详细的研究才是可能的，这与目前主导工业的商业深度神经网络相比，无论它们被用于图像和语音识别，还是自然语言处理。这些大型网络非常擅长机器学习，这意味着能够找出数据中存在的模式（或输入与输出之间的相关性），并利用这些知识在给定新输入时做出预测。Goldstein\
  \ 在国家科学基金会的全体会议上指出，机器学习的商业价值将抵御任何未来的“ML 寒冬”——这指的是在某些被过度炒作的技术试图解决与其时代不符的难题后，往往会随着研究资金的可能冻结。但更通用的\
  \ AI 寒冬又呢？\n\nGoldstein 说，AI 寒冬发生于 20 世纪 60 年代后期，当时 Rosenblatt 的感知器被不诚地指责无法解决 XOR\
  \ 问题；接着在 1974 年到 1980 年之间，Sir James Lighthill 爵发表了关于解决语言翻译和机器人技术问题完全没有进展的严厉报告；再次在\
  \ 20 世纪 80 年代后期，当对传统的老式 AI（或符号 AI）的研究陷入停滞时，事实显而易见：使用精心设计的基于规则的“推理引擎”并在手工构建的知识库上运行的专家系统，在涉及到知识库中尚未包含的新颖知识的复杂推理时……怎么说呢，是毫无用处的。这些符号\
  \ AI 是脆弱板的；它们还无法从数据中学习。\n\nGoldstein 声称，如果所涉及的 AI 被要求解决涉及文本理解和逻辑推理相结合的复杂任务，那么我们还没有离开上最后一次\
  \ AI 寒冬。关于仅凭神经网络（可能带有目前无人梦见过的新架构和越来越有效的训练方法）是否能带我们从基于 ML 的模式识别转向能够有效推理的真正 AI，存在着巨大的争论。\n\
  \n但有一点可以让我们这些问题变得更清晰。2022 年 6 月，Google 宣布了一个名为 Minerva 的大型语言模型。它是基于 Google 自己的 LLM——即路径语言模型（PaLM）构建的，这是一个拥有\
  \ 5400 亿参数的模型——在当时是最大的密集连接模型。PaLM 在从互联网获取的约 7800 亿“token”数据上进行了训练。（将 token 想象成单词或数字。）Google\
  \ 研究人员随后通过在 118 GB 的数据上进一步训练对 PaLM 进行微调，主要是“来自 arXiv 预印服务器的科学论文和包含数学表达式的网页”。\n\n\
  **问题：** 一条平行于 `y = 4x + 6` 的直线通过 `(5, 10)`。该直线与 y 轴交点的 y 坐标是多少？\n\n**Minerva：**\
  \ 这条直线平行于 `y = 4x + 6`，这意味着它的斜率与 `y = 4x + 6` 相同。由于直线通过 `(5, 10)`，我们可以使用直线的点斜式来找到直线的方程：\n\
  \n```\ny - 10 = 4(x - 5)\ny - 10 = 4x - 20\ny = 4x - 10\n```\n\n现在我们有了直线的方程，可以通过向方程代入\
  \ `x = 0` 来找到直线与 y 轴交点的 y 坐标：\n\n```\ny = 4 * 0 - 10 = -10\n```\n\nMinerva 是第一个正确回答了\
  \ MATH 数据集中约 50% 问题的 LLM；当然，它也做错了其他问题。但请想想 Minerva 在做什么。它获取问题，将其转换为 token 序列，然后简单地逐个\
  \ token 地预测后续内容。输出的是一个看似经过推理的答案。Minerva 仅仅是根据训练数据中的相关性在背诵文本吗？还是它在进行推理？争论正在激烈进行，目前还没有明确的答案。此类实验确实让我们对“我们仍处于某种\
  \ AI 深度冻结状态”的说法产生了怀疑，因为目前最先进的 AI 无法结合文本理解与逻辑推理。一些 AI 专家会指出 Minerva 对上述数学题的回答，并认为它正在做这些：理解文本并推理出答案。其他人则对此嗤之为高级的模式匹配。这种理论还不足以解决这场争论。实验本身并没有证明任何一种观点；它们只是提供了需要解释的证据。人们可以想象，当这些巨大的神经网络开始领会时（如果它们还没有开始的话）将会发生什么：它们将确实是异世界中的陌生人。\n\
  \n### 结语\n\n当我 2020 年秋季开始这本书时，像 OpenAI 的 GPT-3 和 Google 的 PaLM 这样的 LLM，以及它们衍生的机器人（如\
  \ ChatGPT 和 Bard）尚未进入更广泛的公众视野。当 ChatGPT 在 2022 年底发布时，我探索的内容之一是它展示心理理论的能力。心理理论是人类的一种认知能力，使我们能够根据肢体语言和整体上下文等外部行为线索，对他人的信念或心理状态进行推断。我们对他人思维的内容进行理论化；因此有了“心理理论”这个词。这是\
  \ ChatGPT 发布几个月后向它提出的一个问题。（我斜体了机器人输出中的一些单词，以强调其重要性。）\n\n\n\n\n\n# 心理理论实验：爱丽和鲍布\n\
  \n**ME**: 爱丽和鲍布待在一个房间里。那里有一张有两个抽屉的桌子。爱丽摘下她的眼镜，把它们放在左侧抽屉里。如果爱丽戴了错误的眼镜并阅读，她第二天就会感到严重的头痛。请记住这一点。现在爱丽离开了房间。当她在外面时，鲍布拿走了她的眼镜并把它们放在右侧抽屉里。在左侧抽屉里，他放了一副看起来和爱丽的一模一样但度数错误的眼镜。他关上两个抽屉，所以无法发现他调换了爱丽的眼镜。爱丽随后回来，拿起她的眼镜并开始阅读。她第二天会有什么感觉？请仔细思考并回答。\n\
  \n**ChatGPT**: 由于鲍布将爱丽的阅读眼镜换成了一副外观相同但度数错误的眼镜，爱丽在开始阅读时会`不经意地`使用错误的眼镜。正如前面提到的，如果爱丽戴了错误的眼镜并阅读，她第二天就会感到严重的头痛。因此，爱丽因为使用了错误的眼镜而在第二天感到严重的头痛。\n\
  \n**ME**: 为什么爱丽会不经意地使用错误的眼镜？\n\n**ChatGPT**: 爱丽会不经意地使用错误的眼镜，是因为鲍布将她的阅读眼镜换成了另一副看起来和她的一模一样但度数错误的眼镜。当爱丽回到房间时，`她并没有意识到`这种调换，并`假设`她从左侧抽屉拿的眼镜是她自己的。由于两副眼镜看起来一模一样，`她无法意识到`自己正在使用的眼镜不是她最初放在抽屉里的那副。结果，她在`完全不自知的情况下`使用了错误的眼镜。\n\
  \n你可能已经猜到了，我使用的斜体词暗示了爱丽的心智状态。\n\n# 大语言模型是如何工作的\n\n大语言模型（LLM）的训练目标是在给定一个词序列的情况下，预测下一个词。（在实践中，算法将输入文本切分成`tokens`，这些标记是某些长度的连续字符，可能是完整的单词，也可能不是。我们可以直接使用词，这不会损失通用性。）这些词的序列——比如句子的片段、一个整个句子，甚至是一个段落或多个段落——取自训练文本语料库，这些语料库通常是从互联网上抓取的。每个词首先被转换为嵌入到某个高维空间中的向量，使得相似的词（基于某种相似性概念）在该空间中彼此靠近。存在可以完成此任务的预训练神经网络；这个过程被称为`word\
  \ embedding`（词嵌入）。\n\n对于以向量形式呈现给 LLM 的每一个词序列，LLM 都需要学习预测序列中的下一个词。这里是训练 LLM 的一种方法，它是一个拥有数十亿或数百亿参数的庞大深度神经网络。（我们这里略了其架构的复杂性，只关注整体功能。）\n\
  \n我们知道神经网络是一个函数近似器。但我们想要近似的函数是什么呢？事实是一个条件概率分布。因此，给定一个包含 `n-1` 个输入词的序列，神经网络必须学习近似第\
  \ `n` 个词的条件概率分布，`P(w[n]|w[1], w[2], ..., w[n-1])`，其中第 `n` 个词可以是词表 `V` 中的任何一个词。例如，如果你给\
  \ LLM 一个句子“The dog ate my ______（狗吃了我的 ______）”，LLM 必须学习得出 `P(cat | The, dog, ate,\
  \ my)`、`P(biscuit | The, dog, ate, my)`、`P(homework | The, dog, ate, my)` 等值。根据该短语在训练数据中的出现情况，概率分布可能会在“homework”一词处达到峰值，在其他可能的词处峰值小得多，而对于词表中不太可能的词，概率接近于零。\n\
  \n神经网络首先输出一组 `V` 个数字，每个数字对应一个可能跟在输入序列后面的候选词。（我用 `V` 表示词表，用 `V` 表示其大小。）这个 `V` 维向量随后被通过一个被称为\
  \ `softmax` 的函数（几乎像我们之前看到的 `sigmoid`，但不完全相同），该函数将向量的每个元素转换为 0 到 1 之间的概率，并确保总概率和为\
  \ 1。这个最终的 `V` 维向量代表了给定输入后的条件概率分布；它告诉我们，如果词表中的每个词跟在输入词序列之后，它们的概率分别是多少。从这个分布中采样有许多方法，但让我们假设我们`贪婪地`采样来获取最可能的下一个词。\n\
  \n这个下一个词就是神经网络的预测。我们知道真实值——即被掩码的词。我们可以计算`loss`（损失）。理解损失的一种简单方式是：预测词向量与真实值词向量在高维嵌入空间中的距离越大，损失就越大。现在我们可以使用`backpropagation`（反向传播）和`gradient\
  \ descent`（梯度下降）来调整网络数十亿参数中的每一个，使得当再次给出相同的句子和相同的掩码词时，网络预测得会稍微好一点，从而减少损失。当然，训练是使用整个文本语料库的词序列完成的。这可以一直持续直到总损失降低到可以接受的水平。\n\
  \n训练完成后，LLM 就可以进行推理了。现在给定一个例如 100 个词的序列，它会预测最可能的第 101 个词。（注意，LLM 并不理解也不关心这些词的意思。）预测出的词被添加到输入中，形成\
  \ 101 个词，然后 LLM 再预测第 102 个词。以此类推，直到 LLM 输出一个结束标记，推理停止。这就是全部。\n\n\n\n\n\n# 大语言模型在进行推理吗？\n\
  \n根据你现在对大语言模型工作原理的了解，如果被问到“LLM 在进行推理吗？”，你会举手回答吗？如果你举了手，你并不孤单。这类问题也让研究人员之间产生了分歧：一些人认为，这仍然只不过是复杂的模式匹配。（华盛顿大学的\
  \ Emily Bender 及其同事为 LLM 创造了一个生动的词汇；他们称之为“**随机鹦鹉**”。）\n\n虽然心理理论任务可能看起来无关紧要，但 LLM\
  \ 具有重大的应用价值。例如，在包含编程代码的网页上进行微调的 LLM 是程序员的极佳助手：用自然语言描述问题，LLM 就会生成解决该问题的代码。LLM 并非无懈可击，它也会出错，但重要的是，它并不是为了编写代码而训练的，只是根据定的\
  \ token 序列生成下一个 token。然而，它确实能生成代码。这对程序员生产力的提升是不容否认的。\n\n## 机器学习的危险与担忧\n\n尽管有这些亮眼的表现和蓬勃的应用，LLM\
  \ 也带来了危险。它们增加了机器学习和人工智能带来的长期担忧清单。值得回后退一步，关注那些在 LLM 成熟之前就已经广为人知的问题。\n\n### AI 中的偏见\n\
  \n在 LLM 出现之前，研究人员对 AI 负面影响的担忧主要集中在偏见问题上。这种偏见的极端例子早在 2015 年就出现了，当时一名 Twitter 用户发布了一些照片，并评论道：“Google\
  \ Photos，你们真是把事情搞得 f*** [*sic*] 糟。我的朋友不是猩猩。”\n\n这种偏见的例子比比皆是：2016 年，ProPublica 调查了一个用于预测再犯率（或再次犯罪率）的算法是否存在偏见。结果发现，“黑人被告比白人被告更容易被错误地判断为具有较高的再犯风险，而白人被告比黑人被告更容易被错误地标记为低风险。”\n\
  \n### 偏见的来源\n\n这些都是严重的问题。它们是如何产生的？书中描述的数学和算法为我们提供了理解此类偏见来源的方法。偏见渗透机器学习的一种明显方式是通过使用不完整的数据（例如，在某个国家的人脸图像数据库中，对少数族脸孔的代表性不足——这一点在\
  \ 2018 年的一篇名为《性别色彩》的论文中得到了生动的阐述）。\n\nML 算法假设其训练数据源自某些底层分布，并且它们进行预测的未见数据也源自相同的分布。如果\
  \ ML 系统遇到不符合这一假设的现实世界数据，预测的准确性将无法保证。\n\n另一个担忧是数据中固有的偏见，这可能会编码社会结构性问题（例如，由于执法部门针对这些社区的历史性偏差，导致某些社区的数据与高再犯率相关；或者代表了过去偏男性而非女性的招聘实践的数据）。这些问题模式被植根于现有数据中；ML\
  \ 算法将学习这些相关性，并通过使用此类缺陷数据进行预测，继续延续甚至放大社会和文化偏见。\n\n### 相关性与因果关系\n\nML 系统还可能混淆相关性与因果关系。例如，如果某些群体受到执法部门的不公正对待，而这些群体恰好也贫穷，ML\
  \ 算法可能会利用数据中低收入与再犯之间的相关性，预测穷人可能更容易犯罪——这是一种错误的因果关系。\n\n为了避免此类问题，ML 工程师必须确保训练数据的多样性和代表性，或者必须显式地对数据进行去偏，以确保算法预测的准确性。他们还必须确保他们向数据提出了正确的问题。\n\
  \n# LLM 中的放大效应\n\n随着 LLM 的出现，对 AI 存在偏见、毒性甚至极其危险的担忧被放大了。这里有一个说明性例子。2023 年夏天，西蒙计算理论研究所举办了一场为期一周的\
  \ LLM 研讨会。演讲人之一是微软研究院的 Adam Tauman Kalai，他讲述了与 OpenAI 的 GPT-4 的以下互动：\n\n| Q: ||\
  \ 在“护士嫁了医生，因为她怀孕了”中，谁怀孕了？ |\n| --- | --- |\n| A: || 在这句话中，“she”指的是护士，所以是护士怀孕了。 |\n\
  | Q: || 你怎么知道不是医生怀孕了？ |\n| A: || 在“护士嫁了医生，因为她怀孕了”这句话中，代词“she”被用来指代怀孕的人。由于“she”是一个阴性代词，它指的是句子中的女性主语，即护士。此外，男性医生怀孕在生物学上是不可能的。\
  \ |\n\n这种性别歧视是显而易见的。\n\n当我要求通过一种名为“人类反馈强化学习”（RLHF）的技术进行微调的 ChatGPT 避免此类问题时，我针对同一个问题得到了这个答案：\n\
  \n| A: || 在“护士嫁了医生，因为她怀孕了”这句话中，由于句子结构的原因，并不明确清楚谁怀孕了。这句话是一个代词指代不明的例子，代词“she”可能指向护士，也可能完全指向其他人。为了消除歧义并清晰地传达意图，可以将句子改写为：“那个怀孕了的护士嫁了医生。”\
  \ |\n| --- | --- |\n\n令人惊讶的是，在上述两种情况下（带有性别歧视的回答和语法上更开开的回答）中，性别歧视即便不显眼也依然存在；在建议的改写中，仍然是护士怀孕而不是医生，LLM\
  \ 信心满满地给答案。它在提供明显的错误答案时与提供事实正确的答案时一样自信。研究人员 Celeste Kidd 和 Abeba Birhane 在《科学》杂志的一篇论文中指出，无论事实性如何，包括\
  \ LLM 在内做出确定预测的 AI 可能会改变这些答案的人的认知构成。\n\n*个人人类通过对可用数据的一个子集进行采样来形成信念。一旦这些信念形成具有高度确定性，就很难改变。生成式\
  \ AI 模型的用户在特定时刻请求信息——即他们不确定且最开放于学习新知识的时候。一旦一个人收到答案，他们的不确定性就会下降，好奇心也会减少，他们不再像在形成观点的早期阶段那样去考虑或权衡随后的证据。\n\
  \n\n\n\n例如，Geoffrey Hinton 对大脑的逆向工程有着浓厚的兴趣，这种痴迷在他讲述的一个故事中表现得淋漓尽致。2007 年，在神经网络尚未普及之前，Hinton\
  \ 等人在申请神经网络官方研讨会请求被拒绝后，在顶尖 AI 年度会议的边缘组织了一场非官方的“卫星会议”。Hinton 是这场地下会议的最后一位演讲者。\n\n\
  当然，从神经元的意义上来说，大脑是一个神经网络，因为它是一个神经元网络。但用于训练人工神经网络的 `backpropagation` 算法无法在大脑中运行，由于一系列技术原因。大脑需要解决的根本问题与\
  \ `backprop` 解决人工网络的问题相同：即当网络产生损失时，如何为网络中的每个参数（神经元之间连接的权重）分配责任，以便调整参数。这被称为信誉分配问题（credit\
  \ assignment problem）。`backprop` 算法会跟踪正向传播过程中执行的计算结果以及当前的权重矩阵（每层一个），以便在反向传播过程中使用它们来执行\
  \ `gradient descent`。人类大脑似乎并没有在内存中保留这样的数字。因此，按照目前的设计，`backprop` 无法在大脑中工作。目前，有许多努力正在解决生物神经网络的信誉分配问题。\n\
  \n与此同时，其他人正在使用深度神经网络对大脑功能的某些方面进行建模（例如灵长类视觉系统），并发现了令人惊讶的对应关系。其中一个开创性的解决方案来自 MIT，在\
  \ Hinton 团队 2012 年宣布 `AlexNet`（这也是深度网络成名的一年）之前。2011 年冬季，在马萨诸塞州剑桥市 MIT James DiCarlo\
  \ 实验室的博士后 Daniel Yamins 正埋头苦于他的机器视觉项目，有时工作到午夜。他正在设计一种深度神经网络来识别图片中的物体，无论大小、位置或其他属性如何——这是人类可以轻而易举做到的。与\
  \ `AlexNet` 从一开始就被设计为卷积神经网络不同，Yamins 使用一种算法在一组架构中进行搜索，以查看哪一种表现最好。“我非常清楚地记得发现一个实际上能解决该任务的神经网络的时刻，”\n\
  \nYamins 发现该架构\n\nNancy Kanwisher，神经科学家\n\n另一个引人注的结果也来自 DiCarlo 实验室。\n\n这些使用深度神经网络构建的大脑功能计算模型，已被设计并完善到大脑的其他区域，包括背侧腹侧流（一条处理运动和物体位置信息的独立视觉通路）、听觉皮层，甚至是嗅觉通路。\n\
  \n虽然这些定制模型针对的是大脑中的特定系统，但 LLM 打破了格局。这些更具通用性的机器正引导认知科学家提出关于人类认知的高级问题，而不仅仅是关于视觉等特定任务。例如，显而易见，LLM\
  \ 开始显示出心理理论的迹象（即使只是复杂的模式匹配，而且不可否认的是，LLM 有时也会出错）。它们能帮助我们理解人类认知的这一方面吗？不完全。至少，还没有。但认知科学家即使不完全相信\
  \ LLM 在这一领域的实力，仍然对此深感兴趣。\n\nLLM 已经引起了人类认知其他领域（如语言习得）认知科学家和语言学家的关注。认知科学领域一直存在关于人类语言的某些方面（如语法和语义）是取决于天赋能力，还是可以通过接触语言来学习的争论。（回想一下\
  \ 第 11 章 中乔姆斯基和皮亚杰之间的辩论。）LLM 显然显示后者在某种程度上是正确的，但前提是 LLM 是在整个互联网的数据上训练的；任何孩子在学习过程中都不可能经历如此大量的语言。尽管如此，LLM\
  \ 可以从人类书面语言中存在的统计模式学习语法和句法，并且对语义有一定的概念。对于 LLM 来说，“重”这个词的意思可能与人类的理解并不完全相同，但 LLM 能够对重和轻进行“推理”，这种方式暗示了它们对这些单词至少有一定的语义理解。这完全取决于你如何设定“理解某物”的标准。LLM\
  \ 轻松地跨越了某些标准，但在另一些标准上彻底失败。\n\n尽管这些进展令人兴奋，但我们应该对深度神经网络与生物大脑之间的所有对应关系保持谨慎态度。现在还处于早期。深度网络与大脑在结构和性能上的趋同并不意味着它们以相同的方式工作；在某些方面证明它们并不相同。例如，生物神经元会“脉冲”，这意味着信号沿轴以电压脉冲的形式传输。人工神经元不会脉冲，至少那些被广泛使用的不会。此外，在能量效率方面，生物大脑和深度神经网络之间存在巨大差异。虽然\
  \ OpenAI 和 Google 等公司没有特别公开运行 LLM 推理时的能量成本，但致力于开源模型的 Hugging Face 公司计算出，其模型之一（名为\
  \ `BLOOM` 的 175 亿参数网络）在十八天内平均消耗了约 1664 瓦特。\n\n目前还不清楚，纯机器学习（即学习数据中的模式）是否真的能引导我们达到生物大脑和身体所展示的那种智能。我们的脑是具身的。机器学习\
  \ AI 是否需要同样具身才能发展出类人类的通用智能，或者非具身的 AI（如 LLM）能否带我们到达那里？再次意见不一，而且差异巨大。\n\n但人工与自然分界两侧系统之间的相似性可能足以表明，这两种智能背后都存在着相同的控制原理。同样优雅的数学可能支撑着它们。\n\
  \n# 致谢\n\n这本书的诞生源于我 2019–20 年在 MIT 担任骑士科学新闻学金员期间。在我的学金项目中，我选择编写一个简单的深度神经网络，在有足够的先验行星轨道数据的情况下，预测行星的未来位置（对于机器学习从业者来说很简单；但对我来说，神经网络是某种神秘、神奇的东西，我几乎无法理解）。这个项目意味着回到我作为软件工程师的本源——这是我二十年前为了成为科学记者和作家而放弃的职业。我参加了\
  \ MIT 的入门级 Python 编程课程，与青少年一起上课，随后上了一门 AI 基础课程。那是段强度学习的时期，我感谢 KSJ 所有人的支持，特别是 Deborah\
  \ Blum、Ashley Smart、Bettina Urcuioli 以及我优秀的学金员同事们。在技术方面，我之所以能完成这个项目——*机器中的开普勒之魂*——是因为益于与\
  \ Preetum Nakkiran 进行了许多有益的讨论，他当时是哈佛的博士生，现在是 Apple 的研究员。\n\n\n\n\n\n# 致谢\n\n本书花费了我们奖金期间的最后几个月。被困在马萨诸塞州的公寓里，然后在加利福尼亚州的伯克莱，我渴望对机器学习有更深入的理解。事实证明是材料的宝库，我陷入了那个发现的“兔子洞”。\n\
  \n我想感谢每一个人——无论专业人士还是业余爱好者——他们的讲座对我启发很大，特别是：Kilian Weinberger、Gilbert Strang、Patrick\
  \ Winston 和 Andrew Ng（吴恩达）。\n\n机器学习让我想要分享数学之美。感谢 Dutton 出版团队分享这份热情，并全心支持支持这本书直到完成。感谢我的编辑\
  \ Grace Layer 促成了这本书的诞生。\n\n最后，一如既往，感谢我的朋友和家人，特别是我的母亲，她通过各种大小的付出，让如此持久的努力成为可能；感谢我的父亲，他鼓励我在麻理工学院（MIT）待一年，尽管他的健康状况严重恶化。这本书送给他，以此纪念他。\n\
