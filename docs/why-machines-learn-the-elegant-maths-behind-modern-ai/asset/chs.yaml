  \n表达式的第二部分是：\n\n![](img/p342_01.png)\n\n因此：\n\n![](img/p342_02.png)\n\n**证毕**\n\n\
  ### 反向传播算法的泛化\n\n让我们从一个输入向量 `x` 开始。假设 `x`= [`x1*, `x2*`]。取神经网络的第一层隐藏层。假设它有三个神经元。该层中的每个神经元都会创建一个加权和加上一个偏置。\n\
  \n第一个神经元的加权和将是：\n\n![公式内容：z 下标 1 上标 1 等于 w 下标 1 上标 11 x1 加上 w 下标 1 上标 21 x2 加上 b\
  \ 下标 1 上标 1。](img/p343_01.png)\n\n第二个神经元的加权和将是：\n\n![公式内容：z 下标 1 上标 2 等于 w 下标 1\
  \ 上标 12 x1 加上 w 下标 1 上标 22 x2 加上 b 下标 1 上标 2。](img/p343_02.png)\n\n第三个神经元的加权和将是：\n\
