  \ 375\n377. 376\n378. 377\n379. 378\n\n\n\n\n\n\n## 前言\n\n作者诚挚地感谢斯隆基金会的支持。\n\n回过头来看，这种夸张是显而易见的。但感知机并没有兑其实言。然而，如今的人工智能（AI）一切都可以追溯到康奈尔大学的罗布拉特。这一时刻——ChatGPT\
  \ 等大语言模型（LLMs）的出现，或许确实让我们得以展望罗布拉特在 50 年代过度乐观地预言的未来——其根源在于一句暗示了感知机引发的革命：“罗布拉特博士说他只能用技术\n\
  \n机器学习涉及构建无需式编程即可学习的机器。训练过的机器可以在未见过的数据中检测类似的模式，从而实现从识别猫狗到创造自动驾驶汽车等应用。机器学习（ML）是一个广阔领域，其算法利用了追溯数世纪的简单数学，即高中或大学阶段的数学。机器之所以能够学习，是因为数学与神经科学的卓越交汇。当然，还有基础代数。机器学习的另一个极其重要的基石是微积分，它由牛顿这样的全才学者共同发明。该领域还严重依赖于十八\
  \ 世纪英国统计学家兼牧师贝叶斯的工作。\n\n到 19 世纪 50 年代，构建学习机器所需的一些基础数学已经就绪，当时其他数学家仍在开发更相关的数学，并催生和推动了计算机科学的发展。然而，没有人能想到这些早期数学工作将成为过去半个世纪、特别是过去十年\
  \ AI 惊人进展的基础。\n\n本书讲述了这段历程，从罗布拉特的感知机到现代深度神经网络（由人工神经元单元组成的复杂网络），通过支撑该领域的关键数学思想的视角展开。它温和地切入数学，然后逐渐增加难度，引导我们从\
  \ 50 年代相对简单的想法过渡到如今驱动机器学习较为复杂的数学和算法。\n\n因此，我们将毫不掩饰地拥抱来自至少四个主要数学领域（线性代数、微积分、概率与统计以及优化理论）的方程和概念，以获得理解我们赋予机器的巨大力量所需的最小理论和概念知识。只有当我们理解了学习机器的必然性时，我们才准备好迎接一个\
  \ AI 无处不在的未来，无论好坏。\n\n\n\n\n深入理解机器学习的数学本质，对于我们不仅要理解这项技术的力量，而且要理解它的局限性至关重要。机器学习系统已经在为我们做出改变生活的决策：批准信用卡申请和住房抵押贷款、判断肿瘤是否为恶性、预测认知衰退患者的预后（他们会演变成阿尔茨海默症吗？），以及决定是否给予某人保释。机器学习也渗透了科学领域：它影响着化学、生物、物理以及其之间的一切领域。它被用于基因组、系外行星、量子系统的复杂性等研究。在写本文时，AI\
  \ 世界正因 `ChatGPT` 等大语言模型的出现而沸腾不已。序幕才刚刚开启。\n\n我们不能将关于 AI 如何构建和部署的决策完全交给它的从业者。如果我们想有效地监管这种极其有用、但具有颠覆性且可能带有威胁的技术，社会的另一个层面——教育者、政治家、政策制定者、科学传播者，甚至是对\
  \ AI 感兴趣的消费者——必须掌握机器学习数学的基础知识。\n\n数学家尤朱尼娅·成（Eugenia Cheng）在她的书《数学真实吗？》（*Is Math\
  \ Real?*）中描述了学习数学的渐进过程：“它看起来……就像我们正在迈出非常小的步子且毫无进展，直到有一天我们突然回头，发现自己已经爬上了一座大山。所有这一切都可能让人不安，但接受一点智力上的不适（有时是很不适）是在数学道路上取得进步的重要部分。”\n\
  \n幸运的是，等待着我们的“智力上的不适”是完全可以忍的，并且会被智力上的回报充分抵消，因为现代机器学习的底层是一些相对简单且优雅的数学——这个概念通过关于伊利亚·苏特斯基基（Ilya\
  \ Sutskever）的小轶事说明得最好。今天，苏特斯基基广为人知的身份是 `ChatGPT` 后公司 `OpenAI` 的联合创始人。十多年前，作为一个在多伦多大学寻找学术导师的年轻本科生，苏特斯基基敲了杰夫里·辛顿（Geoffrey\
  \ Hinton）的门。辛顿已经是“深度学习”（机器学习的一种形式）领域的名性人物，苏特斯基基想与他一起工作。辛顿给了苏特斯基基一些论文让他阅读，他如之如荼。他记得自己对数学的简单性感到困惑，这与他普通的本科课程中的数学和物理相比。他能读懂这些关于深度学习的论文并理解强大的概念。“怎么能这么简单呢……简单到你可以毫不费力地向高中生解释清楚它呢？”\n\
  \n当然，苏特斯基基已经拥有了深厚的数学功底，所以对他来说简单的东西，对我们大多数人（包括我）来说可能并非如此。但让我们来看看吧。\n\n本书旨在交流机器学习和深度学习背后的概念性简单性。这并不是说我们现在在\
  \ AI 领域目睹的一切——特别是深度神经网络和大语言模型的行为——都易于用简单的数学进行分析。事实上，本书的结局将我们引导向某些人可能感到不安的地方，但另一些人会感到振奋：这些网络和\
  \ AI 似乎违背了几十年来支撑机器学习的一些基本思想。这就像是经验证据压垮了理论的驼，正如 20 世纪初对物质世界的实验观测击碎了经典物理一样；我们需要新的东西来理解等待着我们的崭新世界。\n\
  \n在我为这本书进行研究时，我观察到了自己学习的一种模式，这让我想起了现代人工神经网络的学习方式：算法每对数据进行一次遍历，它就会对该数据中存在的模式了解更多。一次遍历可能不够；十次不够；一百次也不够。有时，神经网络会在数据上通过成千上万次的迭代进行学习。这确实是我为了写关于它而掌握该主题的方式。对这个庞大知识库某个角落的每次遍历都会使我大脑中的某些神经元产生连接，无论是字面上的还是比喻上的。第一次或第二次不理解的事情，在随后的遍历中最终变得合理了。\n\
  \n我利用这种技术帮助读者建立类似的联系：我发现自己在写这本书的过程中不断重复某些想法和概念，有时使用相同的措辞，有时又对同一个概念有不同的解读。这些重复和重新表述是有故意的：它们是我们这大多数非数学家或非机器学习从业者能够掌握一个看似矛盾地既简单又复杂的主题的一种方式。一旦一个想法被暴露，我们的大脑在其他地方遇到该想法时可能会发现模式并建立联系，从而比初眼看时能更好地理解它。\n\
  \n我希望你的神经元像我的神经元一样也喜欢这个过程。\n\n# 第一章\n\n### 渴望寻找模式\n\n当他还是个孩子时，\n\n*模式*（Patterns）。当动物学家在动物行为中识别这些模式时，动物本身也在探测自己的模式。刚出壳的小鸭必须能够识别或区分它们看到的周围移动事物的属性。事实证明，小鸭不仅能对它们看到的第一个移动的生物产生印记，还能对无物体产生印记。例如，绿鸭幼雏会对一对形状或颜色相似的移动物体产生印记。具体来说，它们会对关系概念产生印记\n\
  \n在这里思考一下。新生的小鸭通过对感官刺激的极短接触，就能检测到它们所见事物的模式，形成相似/异质的抽象概念，然后就能在之后看到的刺激中识别出这些抽象概念并据此行动。人工智能研究人员愿意为此付出代价，只为知道小鸭是如何做到这一切的。\n\
  \n虽然今天的 AI 远未能像小鸭那样轻松、高效地完成此类任务，但它确实与小鸭有一个共同点，那就是挑选和学习模式的能力。当弗兰克·罗森伯特在 20 世纪 50\
  \ 年代发明感知器（perceptron）时，它引起轰动的原因之一是它是第一种受大脑启发的、通过通过检查数据来学习模式的算法。最重要的是，在对数据的某些假设下，研究人员证明了感知器总能在有限时间内找到数据中隐藏的模式；换句话说，感知器会收敛到解决方案。计算中的这种确定性如同黄金。难怪感知器学习算法会引起如此轰动。\n\
  \n但这些术语是什么意思？数据中的“模式”是什么？学习这些模式”意味着什么？让我们从这个表格开始：\n\n| **x1** | **x2** | **y** |\n\
  | --- | --- | --- |\n| 4 | 2 | 8 |\n| 1 | 2 | 5 |\n| 0 | 5 | 10 |\n| 2 | 1 | 4 |\n\
  \n表格中的每一行都是变量 `x1`、`x2` 和 `y` 的数值组。数据中隐藏着一个简单的模式：在每一行中，`y` 的值与其对应的 `x1` 和 `x2` 值有关。在继续阅读之前，看看你是否能发现它。\n\
  \n\n\n\n理想情况下，我们应该将 `2*x*2` 写为 `2*x*[2]`，将 `x*1*x*2` 写为 `x*[1] *x*[2]`，并对变量使用下标。但除非绝对有必要使用，否则我们将也将省略下标。（纯主义者可能会对此皱皱眉，但这种方法有助于保持我们的文本不那么杂乱，且更易于阅读；当我们遇到下标时，将\
  \ `x*[i]` 读作“x 的下标为 i”。）所以，请记住这一点：如果有一个如 `x` 的符号，后面紧跟着一个如 `2` 的数字，得到 `x2`，请将整个符号视为一个整体。如果一个符号（例如\
  \ `x` 或 `x2`）前面有一个数字（例如 `9`）或另一个符号（例如 `w1`），那么这个数字与符号之间、或者两个符号之间，是在进行乘法。因此：\n\n\
  > `2*x*2 = 2 × x*2`\n\n> `x*1*x*2 = x*1 × x*2`\n\n> `w*2*x*1 = w*2 × x*1`\n\n回到我们的方程\
  \ `y = x*1 + 2*x*2`，更通地说，我们可以将其写为：\n\n> `y = w*1*x*1 + w*2*x*2`, 其中 `w1 = 1` 且 `w2\
  \ = 2`\n\n明确的是，我们找到了 `y` 与 `x1`、`x2` 之间许多可能的关系之一。可能还有其他关系。事实上，对于这个例子，确实存在，但就我们的目的而言，不需要担心它们。寻找模式远比这个例子所暗示的要复杂得多，但它让我们得以入门。\n\
  \n我们识别了了 `y` 与另一端的 `x1` 和 `x2` 之间所谓的线性关系。（“线性”意味着 `y` 仅依赖于 `x1` 和 `x2`，而不依赖于 `x1`\
  \ 或 `x2` 的幂，也不依赖于 `x1` 与 `x2` 的任何乘积。）此外，我在这里交替使用“方程”和“关系”这两个词。\n\n`y`、`x1` 和 `x2`\
  \ 之间的关系由常数 `w1` 和 `w2` 定义。这些常数被称为连接 `y` 与 `x1`、`x2` 的线性方程的系数或权重。在这个简单的情况下，假设存在这样的线性关系，我们在检查数据后得出了\
  \ `w1` 和 `w2` 的值。但通常情况下，`y` 与 (`x1, x2, …`) 之间的关系并不那么直观，特别是当它扩展到方程右侧更多值时。\n\n例如，考虑：\n\
  \n> `y = w*1*x*1 + w*2*x*2 + w*3*x*3 + … + w*9*x*9`\n\n或者更通地说，对于一组 `n` 个权重，并使用形式化的数学符号：\n\
  ![](img/p011_01.png)\n\n右侧的表达式使用西格符号是所有 `wixi` 之和的简写，其中 `i` 的取值为 1 到 `n`。\n\n在有\
  \ 9 个输入的情况下，仅仅通过肉眼检查数据并进行心算，很难提取出 `w1` 到 `w9` 的值。这正是学习大显身场的地方。如果有算法可以计算出权重，那么算法就是在“学习”这些权重。但这样做有什么意义呢？\n\
