    bots and text-based bots.

    - Lead-gen Bots, Query Bots and Task Bots are different types of role-based bots
    created to automate a variety of tasks in pre-sales, sales, customer service or
    in employee interactions. They help to improve customer and employee satisfaction
    by offering a friendly and better experience.


    ## BAD BOTS:

    Bad bots undertake illegal and malicious activities by trying to hack into other
    online agents and also misrepresent wrong information to their victims, thus misleading
    them to get cheated. Some of them are listed below:

    - Scraper bots steal content to republish in other sites in an unauthorized manner.

    - Spammers post unwanted and repetitive promotional content to unsuspecting users.
    Chat and messaging platforms like Yahoo Messenger, Windows Live Messenger, etc.
    have been frequent targets for spammers who fill their chat rooms with spam, misleading
    people to part with sensitive personal information.

    - Impersonators that mimic humans to mislead unsuspecting humans. They form almost
    25% of the bot traffic overall as per a number of current studies.

    - Hackers populate harmful content on victim sites attacked by them and leave
    unforeseen damage. They are the most harmful bots.


    ## KEY STEPS TO BUILD A CHATBOT:

    - Before building a chatbot, the developer should consider whether to develop
    a Chatbot from scratch or if they can use a free Chatbot. Paid Chatbots offer
    a customized option with a number of specific use cases required by the company.
    They are costly and are built with the help of external conversational AI companies.
    It is important to keep the following characteristics of an ideal Chatbot in mind:

    - 24/7 availability

    - Immediate reply

    - Memory regarding the customer’s prior transactions, likes and dislikes

    - Fine-tuning responses based on earlier mistakes and user responses

    - Continuous improvement in response time, accuracy and efficiencies

    - Ensures customers are delighted with the experience

    - An easy-to-use interface for customers to format their queries in a simple manner

    - Ability to converse in many languages in written and spoken words

    '
  mdcn: '

    **2017-WOEBOT:** 这是首批用于医疗保健应用的机器人之一。WoeBot 已成为帮助心理治疗患者的热门选择。


    2018年，Facebook Messenger 因其聊天机器人而闻名，这些机器人创造了彼此都能理解的语言。


    ## 聊天机器人的主要优势可概括如下：

    - 通过在多个机器人之间积累的持续学习不断减少平均处理时间，从而实现投资回报率的快速提升。

    - 自动化重复性问题使您能够在不改变人力配置的情况下扩大或缩小规模。

    - 优化知识并创建可查询数据库并复制操作。

    - 通过语音辅助调查与员工进行定期互动，并在离职访谈、反馈调查期间提供支持，同时提供帮助以解决查询。

    - 实时在多个平台之间更新和共享学习成果，以实现整体程序的改进。

    - 通过个性化优惠、问候和礼物回应客户。

    - 根据受访者的位置理解、书写和说不同语言和口音。


    ## 聊天机器人如何工作？

    聊天机器人识别用户输入中包含的‘意图’和‘实体’，并尝试通过利用 NLP 引擎、集成搜索引擎和数据库引用来构建对话。它们通过理解查询、搜索网络或数据库并利用人工智能技术或基于规则的系统提出合适的回复，从而通过网站、社交媒体平台、消息平台或电话接收到的用户输入作出响应，以满足查询。


    这可以通过利用文本转语音和语音转文本合成根据需要以书面或口头交流的形式在任何语言中完成。


    ![](img/3531370aa21067bbdc45128741d34edb_145_0.png)


    Fig 8.1: 聊天机器人的工作原理


    在基于语音的通信情况下，被称为个人数字助理或语音助手的聊天机器人会进行语音分析和合成，如前图所示。


    ## 基于规则与基于人工智能的聊天机器人：

    基于规则的聊天机器人提供基本级别的功能，如从预定义的常见问题数据库中回答，而人工智能驱动的聊天机器人则是利用人工智能、机器学习和深度学习技术进行自然语言处理、模式识别、预测分析和情感分析等的高级程序。


    基于人工智能的技术使聊天机器人应用程序能够利用过去记录的数据库和客户响应或训练数据进行学习并做出适当响应。


    自然语言处理引擎有助于在不同语言中模拟语音和文本中的类人类响应，而情感分析则涉及根据客户在不同情况下的响应来理解其态度和感受，以便制定适当的回复。


    由深度学习驱动的机器人记住上下文，并从过去的交互中不断学习和改进其响应。


    就成熟度而言，最前沿和最先进的聊天机器人使用基于规则以及监督和无监督机器学习方法。


    | 任务导向 | 数据驱动和预测性 |

    |---|---|

    | 这些是任何格式良好的常见问题。 | 这将是自由文本和自然语言。 |

    | 用户发起的对话，具有自动/固定的响应。 | 机器人将根据用户所做的陈述返回响应。 |

    | 它们使用 NLP，但机器学习不多。 | 使用 NLP，并通过机器学习，机器人将持续处于学习模式。 |

    | 机器人无法回复数据库中没有的问题。 | 机器人不依赖标准答案，而是基于意图构建答案。 |

    | 与后端系统的基本集成。 | 基本到复杂的集成。 |

    | 专注且结构化的交互。 | 用户可以在对话之间切换。 |

    | 客户满意度不易实现。 | 机器人可以用大多数服务来服务。 |

    | 过多的集成会导致转接人工。 | 可以做到，但不需要，因为大多数服务都由机器人完成。 |


    Fig 8.2: 聊天机器人的级别


    虽然机器人是自动化的重要工具并提高了组织的生产率，但机器人也被网络犯罪分子用于多种可疑目的。


    机器人是为自动化重复性任务而创建的程序，可分为两大类：好机器人和坏机器人。据许多研究称，超过 51% 的互联网流量由机器人组成。具有恶意意图的机器人远远超过具有良好意图的机器人。由危险机器人协助的有害恶意攻击造成的数据泄露被认为是
    21 世纪最大的威胁之一。


    ## 好机器人

    为特定合法和授权目的而创建的机器人，以使组织能够帮助营销、客户服务并提高其生产率和盈利能力，可被视为好机器人。以下是此类应用的一些好机器人：

    - 好机器人帮助企业在正当和积极的精神规范内自动化许多流程，并以合法方式帮助企业实现其目标。

    - 搜索引擎机器人有助于根据搜索标准获取有关网站和页面的相关结果，并在需要时广播数据。

    - Feed 获取器和爬虫机器人执行后台操作并帮助从其他 API 和网站获取信息。它们约占网络流量的 7%，构成了好机器人流量的最大比例。

    - 如 Oracle 之类的交易机器人通过代表网站与外部系统进行交易。交易机器人参与许多人机和机器人对机器人交互，分为两种类型，即基于语音的机器人和基于文本的机器人。

    - 潜在客户生成机器人、查询机器人和任务机器人是不同类型的基于角色的机器人，创建用于在销售前、销售、客户服务或员工互动中自动化各种任务。它们通过提供友好和更好的体验来提高客户和员工满意度。


    ## 坏机器人：

    坏机器人通过试图入侵其他在线代理并向受害者歪曲错误信息来进行非法和恶意活动，从而误导他们使其上当受骗。其中一些列举如下：

    - 抓取机器人窃取内容以未经授权的方式在其他网站上重新发布。

    - 垃圾邮件发送者在毫无防备的用户中发布不受欢迎且重复的促销内容。雅虎 Messenger、Windows Live Messenger 等聊天和消息平台一直是垃圾邮件发送者的频繁目标，他们用垃圾邮件填满聊天室，误导人们泄露敏感个人信息。

    - 冒充者模仿人类以误导毫无防备的人类。据许多当前研究称，它们约占整体机器人流量的 25%。

    - 黑客在他们攻击的受害者网站上发布有害内容并留下不可预见的损害。他们是最有害的机器人。


    ## 构建聊天机器人的关键步骤：

    - 在构建聊天机器人之前，开发人员应考虑是否要从头开发聊天机器人或可以使用免费聊天机器人。付费聊天机器人提供定制选项，具有公司所需的一系列特定用例。它们成本高昂，并由外部对话式人工智能公司协助构建。重要的是要牢记理想聊天机器人的以下特征：

    - 24/7 可用性

    - 立即回复

    - 关于客户先前交易、喜好和厌恶的记忆

    - 根据之前的错误和用户响应微调响应

    - 响应时间、准确性和效率的持续改进

    - 确保客户对体验感到满意

    - 客户以简单方式格式化查询的易于使用的界面

    - 能够以书面和口头形式用多种语言交流


    '
