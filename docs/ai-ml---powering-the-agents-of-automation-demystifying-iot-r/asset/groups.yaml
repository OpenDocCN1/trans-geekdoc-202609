    # GLOSSARY: AGENTS OF AUTOMATION


    # A


    +   1. Advanced Driving Assistance Systems (ADAS): Systems developed to help the
    driver in the driving process through increased measures of car safety and process
    automation.

    +   2. Algorithm: A formula given to a computer for it to complete a task (i.e.
    a set of rules for a computer). An algorithm is a mathematically or a logically
