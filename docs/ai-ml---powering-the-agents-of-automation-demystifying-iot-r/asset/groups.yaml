    Welcome to the world of humanoids and autonomous machines.


    ![](img/3531370aa21067bbdc45128741d34edb_17_0.png)


    Figure 1.3: It is going to be difficult in future to identify whether you are
    dealing with a man or a machine!


    We will take a close look at these agents of automation in the coming chapter
    as we analyze the anatomy of these machines and track their journey into the future.'
