    ## CHAPTER 4


    ## Internet of Things, Industry 4.0 and Factories of Tomorrow


    ### INTRODUCTION:


    The advent of big data synchronized with the proliferation and another important
    aspect of technology, namely, Internet of Things (IoT). While the birth history
    of Internet can be traced back to 1969, 1990 marked the official birth year of
    the Internet of Things (IoT). IoT facilitated connection of things other than
    human beings through embedded sensors that could be connected to the internet
    and communicated over the internet with other machines, things and human beings.


    Machine-generated data derived from the phenomenal growth in the number of sensors
    and machines used to measure and record the events and situations in the physical
    world. The output of these sensors is machine-generated data, and from simple
    sensor records to complex computer logs, it is well structured. As sensors proliferate
    and data volumes grow, it is becoming an increasingly important component of the
    information stored and processed by many businesses. Its well-structured nature
    is suitable for computer processing, but its size and speed are beyond traditional
    approaches.


    In this chapter, we will take a look at the various aspects of IOT, Big Data,
    AI and ML and their impact on the factories of tomorrow.


    ### STRUCTURE:


    - Variety of sensors

    - Major components of IoT

    - Major IoT protocols at various layers

    - Smart factories of tomorrow and the Industrial Internet of Things


    ### OBJECTIVE:


    The objective of this chapter is to understand the anatomy of IOT systems, evaluate
    their key roles in automation with respect to factories, homes and smart cities.
    IOT or Internet of Everything, as it is sometimes referred to, is the fundamental
    aspect of the connected systems which enables us to connect, collect information
    and manipulate in order to achieve the desired objectives. Hence, it is desirable
    to have a good understanding of the way they function, the potential they promise,
    the opportunities they offer and the issues that need to be addressed to keep
    them secure.


    The year 2010 marked a new milestone in the field of Internet Of Things with the
    announcement of connected cars by Google.


    UNECE (United Nations Economic commission for Europe) has declared IoT generated
    data as one of the key sources of Big Data. (https://statswiki.unece.org/display/bigdata/Classification+of+Types+of+Big+Data)


    Creating an M2M protocol, Andy Stanford-Clark of IBM and Arlen Nipper of Arcom
    (now Eurotech) introduced the first machine-to-machine protocol for connected
    devices such as MQ Telemetry Transport (MQTT).


    Data is generated from a variety of sensors used in various applications. Some
    of them are listed below in the following two categories:


    ### A. FIXED SENSORS


    - Home automation

    - Weather/pollution sensors

    - Traffic sensors/webcam

    - Scientific sensors

    - Security/surveillance videos/images


    ### B. Mobile sensors (tracking)


    - Mobile phone location

    - Cars

    - Satellite images


    ### B. DATA FROM COMPUTER SYSTEMS


    - Logs

    - Web logs


    The amount of data transacted through the internet grows manifold as the communication
    between the devices and their principals does.


    Starting with RFID (Radio-frequency identification) chips in the year 2000, the
    advances in the field of Internet Of Things is expected to permeate to the entire
    world connecting humongous number of devices with sensors that are then hooked
    up to the internet through advanced communication platforms and technologies.
    By 2020, the number of interconnected devices and the associated business opportunities
    is expected to grow manifold to over 30 billion connected objects and 50 trillion
    US dollars in market opportunities.


    By 2020, the IoT business with the help of cost-effective sensors, which is made
    possible due to the increased economies of scale and also the cumulative advances
    in all the interconnected technologies of hardware, middleware, software and storage
    technologies, would be in a position to create a humongous value of over 50 trillion
    US dollars as per current estimates. The collective intelligence and processing
    power of all these devices offer enormous benefits to mankind, but not without
    the associated threats due to the increased dependence and the corresponding tilt
    of incentive in favor of cyber attackers and terrorists.


