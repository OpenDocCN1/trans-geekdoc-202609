    # CHAPTER 12


    # Blockchain as a Protector of the Agents of Automation


    # INTRODUCTION:


    We have observed the different manifestations of the Automation powered by AI
    and Analytics in the form of connected things such as robots, chatbots, drones
    and autonomous cars. All these devices that are controlled through the internet
    are prone to exploitation by cybercriminals to act against their intended applications
    and for ulterior objectives. In this chapter, we will examine the vulnerabilities
    of the connected devices and see how Blockchain can offer a protective cover of
    security to thwart the sinister designs of their attackers.


    # STRUCTURE:


    +   - Zigbee chain reaction attack

    +   - Controlling drones through Blockchain for security and auditing

    +   - Securing robots through Blockchain

    +   - Secured access and management of automobiles using Blockchain'
  - '[PAGE 208]


    # OBJECTIVE:


    The objective of this chapter is to expose the various risks faced by the connected
    objects through illustrations and examples. This will highlight the risks faced
    by humanity, even as it enjoys the fruits of AI and ML-led automation. The disruptive
    potential of Blockchain to protect the connected devices will be explained to
    drive home the point that secured automation is within the reach if we exploit
    the powerful features of the Blockchain platforms. The application of Blockchain
    with respect to the type of device and the suggested architecture is expected
    to offer a clear understanding regarding the need for viewing these technological
    breakthroughs as two sides of the same coin for a secured scaling up of automation
    applications so as to achieve their intended utility to the maximum.


    Internet of Things (IOT) is deemed to be one of the fastest growing phenomena
    in the coming days with estimates pointing to tens of billions of connections
    being added to the internet through connected things that define the way we live
    in the future.


    IOT is deemed to have widespread usage in industries, manufacturing, retail, consumer,
    health care, smart city, transportation and logistics, energy management, agricultural,
    environmental, financial, automobile, government, and military applications.


    IOT also becomes an easy target to the malware attackers to penetrate and flood
    the internet with unwanted traffic creating a nuisance to global population at
    large. The havoc caused by the Mirai virus that attacked a mere 6 lakh devices
    to shut down a large number of publisher sites in October 2016 is a pointer of
    the things to come.


    The following figure gives a brief overview of the Mirai attack that shut down
    a number of websites and portals globally in September-October 2016:'
  - '[PAGE 209]


