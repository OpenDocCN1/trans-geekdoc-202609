    # HISTORY OF THE CHATBOT:


    1966-ELIZA : This chatbot is named after Eliza Doolittle as a fictional character
    and created by MIT’s Joseph Weizenbaum. This bot with the psychotherapist functionality
    was the first application to pass the Turing test and pass of as a human with
    its interactions.


    1972-PARRY: This is a more sophisticated rendering of a chatbot than ELIZA. This
    ‘schezophrenic’ bot was created by a psychotherapist, Kenneth Colby.


    1981-JABBERWACKY: This was meant to be the first bot application powered by Artificial
    Intelligence created by Rolla Carpenter of Great Britain.


    1991-DR. SAITSO: Dr. Saitso is an award winning Turing program that mimicked a
    psychotherapist by asking the question ‘Why do you feel it that way?’ through
    AI speech synthesis.


    1995-ALICE: Artificial Linguistic Corporate Entity (ALICE) inspired the 2013 science
    fiction movie ‘HER’ in which a man falls in love with a Chatbot.


