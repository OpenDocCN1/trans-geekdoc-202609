    5 级不仅仅是指导员工查阅知识库文章来解决问题。它是一个智能虚拟代理，实际上解决了原本可能需要员工支持部门内部人员高度参与的问题。第 5 级虚拟代理从过去的对话中学习，并利用这些知识开发快捷方式，以个性化的方式高效解决
    issues。例如，第 5 级解决虚拟代理不会仅仅向员工指出需要填写的 PTO 表格。它能够当场解决问题，而无需员工再多走一步。


    ## 第 6 级流畅

    ### 人类水平对话虚拟代理

    虽然第 5 级虚拟代理具有解决问题的能力，但它尚无法解决需要高级或人类水平推理的语言问题。相比之下，第 6 级虚拟代理可以进行类人对话。它现在是一个完全理解并领会员工提问内容的代理。它学习员工的具体情况（利用其对该员工或员工群体的先前互动的理解），并能够解决问题或将其升级并路由到正确的渠道。这种理解水平需要非常先进的语义和语用能力。第
    6 级虚拟代理能够理解复合名词、隐喻、习语、范围解析；转喻、共谓、指代消解。它运用常识来推理请求。


    世界领先的食品特许经营公司选择 Astound 作为其人工智能和机器学习平台，以自动化服务请求的路由和解决。与人工代理不同，Astound 的机器学习技术几乎每次都能预测正确的类别，并且持续改进。与人工代理不同，Astound
    可以即时对 PB 级数据进行实时趋势分析。


    ## 结论

    在本章中，我们研究了聊天机器人和语音助手的各个方面，以欣赏其潜力、研究其解剖结构、评估以及为各种应用创建和采用它们的方式。


    根据 Global Market Insights 的预测，聊天机器人市场预计在 2018 年至 2024 年间将以超过 31% 的复合年增长率增长，并从
    2017 年的 2.5 亿美元增长到超过 1340 亿 Rs. 美元的营业额。虽然基于规则的聊天机器人占 2017 年市场份额的 85%，但基于 AI 的聊天机器人预计未来增长更快，复合年增长率超过
    53%。未来可能会看到能够发起销售电话和对话、机器人对机器人对话以及更高级别的 API 集成用于交易和智能查询解决的自学习机器人的推出和快速增长。


    使用机器人、聊天机器人和用于流程自动化的机器人进行企业自动化，除了结构化设计、入职和部署方法外，还需要考虑许多因素。根据 Everest Group 的 Bots
    采用方法论，组织需要除了管理典型员工密集型组织所需的渐进式方法之外，还需要整体的机器人管理方法。组织需要专注于企业范围的规划和协作，根据组织整体愿景部署以成果为导向的机器人，而不是仅进行任务驱动或流程驱动的部署。


    虽然自动化项目有许多积极方面，但投资这些项目的决定可能并不像计算投资的净现值 NPV（Net Present Value）那样简单，该净现值可通过预测成本和收入并将其折现到当前日期得出。这是因为与迄今为止未知的颠覆性技术实施相关的许多其他方面和未知因素将与其他力量共同作用。


    ## 第 9 章

    ### 自动驾驶汽车

    ### 引言

    自动驾驶汽车是一类自动驾驶车辆，也被称为无人驾驶汽车。电池存储和能量密度技术的进步，结合人工智能和机器学习驱动的应用，如图像识别、物体识别、分析和高级搜索，使得那些一直存在于天体和卫星领域或低端玩具中的技术得以扩展到用于日常用途的地面车辆。本章中，我们将踏上一次旅程，了解自动驾驶汽车的各个组件，看看它们如何帮助这些自动化代理为人类服务带来诸多益处，以及我们在这个领域的前景如何。


