    undertaken before the Blockchain platform selection, smart contract development
    and application launch. This has led to a lot of failures among the public Blockchain-based
    entities and in the case of private Blockchains, drain of resources due to avoidable
    mistakes. A systematic and methodical approach by taking into account existing
    systems in the organization and considering all aspects for a proper integration
    with the same will go a long way in making most of the investments in Blockchain-based
    implementations by organizations.

    - (VI) Blockchain implementations can drastically alter the governance at organizations
    as they will eliminate non-value adding middlemen while freeing up a lot of wasted
    resources. While corruption and red tape is the biggest causality, this may cause
    a backlash for those used to thriving on such non-desirable practices. This has
    to be factored in while readying an organization for the new approach through
    investments in Blockchain systems.

    - (VII) While in the public Blockchain domain, the investments could be raised
    through ICOs (Initial coin offerings) wherever allowed by regulatory authorities.
    In case of enterprise Blockchains, the investments need to be funded by the expected
    savings and cost benefits through automation, collaboration and process excellence.
    With a number of projects still in the POC (Proof of Concept) stage, the trade-offs
    are not clear. Hence, lack of clarity on the returns on investments leads to a
    tremendous bottleneck for the adoption of Blockchains.

    - (VIII) The cross-border, cross-organizational, cross-platform nature of the
    Blockchain-based businesses offers a great challenge for the regulatory and accounting
    authorities and practitioners. Hence, a lot of cooperation among the participants
    and hand holding is required to get them on board for managing the transition.


    It is imperative for the participants, industry leaders and regulators to come
    together and quickly evolve a set of global standards and references to ensure
