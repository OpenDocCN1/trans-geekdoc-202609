    \n## 第一章\n\n### 自动化个人助理简介：过去、现在与未来\n\n自动柜员机、自动售货机、自动售票机、自动化自助值机柜台、机场自动化行李托运以及国际机场的自动化移民柜台是我们日常生活中看到的一些机器。以下图片展示了我们使用自动化机器的各种场所：\n\
    \n![](img/3531370aa21067bbdc45128741d34edb_15_0.png)\n\n图 1.1: 用于票务、现金和产品的自动机器，以及机场用于值机、行李和移民的机器\n\
    \n完全自动化的零售柜台（例如 Amazon GO）、酒店和餐厅、个人助理如 Apple Siri、Google Home、Amazon Echo，都是我们越来越多地体验到的由人工智能和机器学习等先进技术推动的自动化的体现。\n\
    \n零售店在自动化下发生的完整转变在以下图片中有所体现：\n\n![](img/3531370aa21067bbdc45128741d34edb_16_0.png)\n\
    \n图 1.2: Amazon Go: 用于完全自动化零售体验的先进技术\n\n(Figure courtesy: https://www.amazon.com/\
    \ )\n\n从过去的 ATM 到能够理解我们的需求和情绪以做出响应的先进语音激活个人助理，正在取代许多过去由人类完成的职业。这是这些自动化体现日益增长且不可逆转的趋势。\n\
    \n有可能在未来，当你路过银行的 ATM 时，它会以你的名字识别你，识别你对贷款的需求并当场提供优惠条件，同时使用语音激活和地理位置定位的消息吸引你前往。这将是我们所知的银行业可预见的未来。同样适用于任何领域，因为人工智能的强大功能在大数据、云和机器学习技术的融合下得到了显著增强。\n\
    \n欢迎来到人形机器人和自主机器的世界。\n\n![](img/3531370aa21067bbdc45128741d34edb_17_0.png)\n\n\
    图 1.3: 未来将很难辨别你是在与人还是机器打交道！\n\n在接下来的章节中，我们将仔细审视这些自动化代理，在分析这些机器的构造并追踪它们进入未来的旅程时。\n\
    \n## 第二章\n\n### 由数字化引领的颠覆性模式\n\n### 引言：\n\n家庭自动化、工厂自动化、人工智能和机器学习驱动的分析正在对我们生活的各个方面产生深远而颠覆性的影响。\n\
    \n我们现在知道无人机可以飞行，机器人可以跳跃，机器人可以听、说、思考、爬行、攻击并在智力游戏中击败世界最佳。猜猜如果所有这些结合成一个单元或一个身体会发生什么！\n\
    \n这就是人工智能的强大力量，它具备机器学习和深度学习增强的特性！2019 年在许多方面见证了前沿技术采用方面的多项进步的融合。毫无疑问，未来正变得越来越‘自主’。人工智能和机器学习正在结合起来，在我们个人和企业生活的各个领域迅速推广自动化。\n\
    \n在每个领域赢得市场主导权竞赛的组织是这些强大技术的最大倡导者。随着数字化、去中心化和自动化的趋势日益增长，采用云和开源技术导致数据生成、分析和消费呈多倍增长。大数据技术被越来越多地采用，这导致了人工智能驱动的分析的快速采用，并得到了机器学习算法的有效利用的推动。\n\
    \n能够建立强大数据技术基础并成为数据分析倡导者的组织正在收获在这些领域的投资回报。据咨询公司 Accenture 称，‘自动化、微型机器人、机器学习和自适应智能正以闪电般的速度成为财务团队的一部分’。\n\
    \n### 结构：\n\n- 新劳动力面貌的变化\n- 公平和可持续的做法\n\n### 目标：\n\n在本章中，我们将简要回顾数字化与自动化在我们环境和工作生活的各个方面产生影响的不同体现。我们还将了解一些在数字化与自动化的各个方面工作的组织。我们还将看到区块链如何在保护未来自动化世界的过程中发挥作用。\n\
    \nGoogle、Amazon、Netflix 和 Facebook 等公司将分析和营销自动化的使用提升到了一个全新的水平，这进一步巩固了它们各自领域的市场主导地位。‘数据是新的石油’这一说法从未如此真实。\n\
