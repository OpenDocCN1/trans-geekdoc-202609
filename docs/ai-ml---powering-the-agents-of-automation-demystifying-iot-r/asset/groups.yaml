    of failure that raises questions about the airplane’s automated systems.

    - A preliminary report from Indonesian investigators indicated that Lion Air 610
    crashed because a faulty sensor erroneously reported that the airplane was stalling.

    - The false report triggered an automated system known as Manoeuvring Characteristics
    Augmentation System (MCAS).

    - This system tried to point the aircraft’s nose down so that it could gain enough
    speed to fly safely. A warning light that would have alerted the crew to this
    discrepancy before the take off wasn’t part of the optional package of equipment
    on Lion Air’s Max 8 aircraft, according to The Air Current. To be clear, the warning
    light was part of an upselling strategy, and now nearly 350 people were dead.

    - Once on the flight, the Lion Air crew was unprepared for the automated response
    set off by the faulty angle-of-attack data.


    The pilots fought the automated system, trying to pull the nose back up. They
    did not succeed.


    ### RESEARCHERS HACK BMW CARS, and DISCOVER 14 VULNERABILITIES


    - Keen Security Lab researchers have discovered 14 vulnerabilities affecting a
    variety of BMW car models.

    - The flaws could be exploited to gain local and remote access to infotainment
    (a.k.a head unit), the Telematics Control Unit (TCU or TCB) and UDS communication
    as well as to gain control of the vehicles’ CAN bus.

    - To exploit some of the flaws and install a backdoor in the infotainment system,
    the attacker must have physical access to the target car’s external facing I/O
    interfaces (USB and OBD-II). But six of the vulnerabilities can be exploited remotely,
    via the wireless interfaces of the vehicle (Bluetooth and cellular network).

    - The Bluetooth attack requires attackers to be in close range of the vehicle
    to affect the availability of the Internet-connected infotainment system without
    authentication, but they can succeed only when the Bluetooth is in pairing mode.

    - On the other hand, a contactless attack via the cellular network allows attackers
    to operate from far.

    - Using the MITM attack between TSP and the vehicle, attackers could remotely
    exploit the vulnerabilities existing in both NBT and TCB, leading to backdoors
    being planted in the NBT and TCB. Typically, a malicious backdoor can inject controlled
    diagnosis messages to the CAN buses in the vehicle.


