    The Internet of Things is a new paradigm that is expected to make life much more
    convenient for citizens across the world. With things connected to the internet,
    their users can access and control it from anywhere. This dramatically increases
    the productivity of human beings while creating huge opportunities for data collection,
    analysis, monitoring, track ability, market opportunity.


    Thereby, IoT can create value for proactive organizations by giving them a huge
    competitive advantage. This could also be a source of risk due to the vulnerability
    of these devices to malicious attacks by cyber terrorists.


    Big Data technologies play a crucial role in managing the humongous amount of
    information generated by the sensors deployed on all things that need to be monitored
    and managed.


    Companies like General Electric, Rolls Royce, Shell and many more are proactively
    using the IoT technology to dramatically improve their efficiency as well as reduce
    the chances of failures and defects by combining the technology with cutting edge
    tools facilitated by Analytics.


    As we take advantage of the connectivity revolution, we are also exposing ourselves
    to the unforeseen attacks on the IoT systems across'
