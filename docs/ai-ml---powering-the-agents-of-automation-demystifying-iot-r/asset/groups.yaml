    # Dialogflow SDKs


    Dialogflow''s SDKs and underlying APIs allow you to take action on your own systems
    based on conversational input, embed your conversational interface into your app
    or website, and dynamically change your agent''s behavior. Dialogflow APIs center
    around three primary use cases:


    ![](img/3531370aa21067bbdc45128741d34edb_151_0.png)


    +   - Fulfillment: take action on your own systems based on conversational input.
    Fulfillment connects your Dialogflow agent to your services, APIs and/or databases

    +   - Detect Intent API: Embed your conversational interface built with Dialogflow
    into your app or website

    +   - Agent API: Dynamically change your agent''s behavior by editing your agent''s
    intents, entities and contexts For information on Dialogflow''s REST APIs please
    see the Reference Documentation.


    *Fig 8.4: The Google dialogflow Chatbot development and deployment framework*


    # a) Delivers natural and rich conversational experiences


    +   - The built-in natural-language processing (NLP) feature imparts artificial
    intelligence (AI) to the Chatbot, thereby enabling it to process the natural language
    (received through chat or voice) and carry forward the conversation in a natural
    way. It''s this cognitive capability that distinguishes the AI Chatbot from the
    normal Chatbot that operates on simple pre-defined rules as coded into it.

    +   - A Chatbot developer integrates this natural language processing capabilities
    into applications, services, and devices. The output data can be in the voice
    or chat format as per the requirement.'
  - '[PAGE 152]


    # b) Understands what users are saying about machine learning


    +   - Machine learning makes Dialogflow intelligent enough to predict the hidden
    intention expressed in the natural input language. A Dialogflow Chatbot can map
    the user''s query with the database available with its backend server. The mechanism
    of mapping is called Intent. Interestingly, it does so by applying several permutations
    and combinations. This is a remarkable feature as users ask the same thing in
    multiple ways, so it''s the responsibility of the Chatbot to understand and serve
    them correctly.


    # c) Works with an array of platforms


    +   - A Chatbot created with Dialogflow can be deployed, as of now, with as many
    as 16 platforms. Thus, with Google Chatbot development, businesses can target
    a widespread audience with least effort. The one-click integration eases the job
    of Chatbot developers.


    # d) Offers cross-device support


    +   - Dialogflow helps in creating a device-antagonistic Chatbot. Thus, it engages
    with users on wearables, phones, cars, speakers and other smart devices. So, businesses
    can connect with their prospects or customers anywhere, anytime.


    # e) Helps Chatbots to speak 14+ languages


    +   - Dialogflow supports 14+ languages, including Brazilian, Portuguese, Chinese
    (Cantonese/Simplified/Traditional), English (Australian/Canadian/Great Britain/
    Indian, US locale), Dutch, French (Canadian locale/France locale), German, Italian,
    Japanese, Korean, Portuguese, Russian, Spanish, and Ukranian.

    +   - Thus, leveraging the Google Chatbot platform businesses can transcend the
    barriers of geographies and conduct business anywhere on the planet.


