    - AI 如何帮助构建自动驾驶汽车


    ### 目标

    本章的目的是了解自动驾驶汽车的组件，这些组件赋予了从感知环境到对环境做出响应以及对目的地等指令做出响应的各种功能。你将能够理解和欣赏各种功能、技术基础、应用领域和预期未来发展。由
    AI 和 ML 驱动的发展带来的特殊功能以及正在应对的挑战也将被提及。


    无人驾驶汽车曾经是我们多年来在许多电影中见证的迷人科幻故事。自动驾驶汽车的想法让我们惊叹不已。得益于我们现代的人工智能平台，我们拥有无人驾驶汽车的梦想正在成为现实。


    特斯拉、苹果、亚马逊和奥迪等公司在开发自动驾驶汽车方面非常专注，更不用说谷歌对自动驾驶汽车的贡献了。


