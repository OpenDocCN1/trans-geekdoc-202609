    # Project Information


    # Drone manufacturing value-chain


    ![](img/3531370aa21067bbdc45128741d34edb_132_0.png)


    +   - Design: This phase involves product prototyping and building basic system
    architecture.

    +   - Frame assembly: Setting-up of frames based on application.

    +   - Motors/ propellers assembly: Attaching of motors and propellers to the frame
    assembly.

    +   - Sensors/ Controllers assembly: Mounting sensors and flight controllers based
    on application.

    +   - Sub-system wiring: Wiring of electrical components on the frame assembly.

    +   - Firmware loading: Loading of software to control the drone.

    +   - Configuration and Testing: Configuring flight controllers and remote-control
    testing of drone.

    +   - Packaging: Final casing of the product.


    # Type of drone frames play a vital role in achieving smooth and stable flight;
    the material and size decide the aerodynamic technicalities


    +   - Drones can take many form-factors, but there are two major categories -
    rotary wings and fixed wings. Fixed wing drones have simple structure and have
    long flight times, whereas rotary wing drones are more complicated in mechanical
    structure and have shorter range.

    +   - Depending on the applications type and material of the drone are chosen,

    +     - Frames: Frame''s design decide the number of motors/ propellers on the
    drone. Major types of frames are quadcopter, tricopter and hexacopter, which have
    four, three and six motors respectively.

    +     - Materials: Common materials used to build drones are wood, plastic carbon
    fiber and aluminum, with last materials being lighter and sturdier.'
