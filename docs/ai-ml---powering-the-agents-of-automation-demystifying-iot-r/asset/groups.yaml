    # Growth Drivers


    ![](img/3531370aa21067bbdc45128741d34edb_131_0.png)


    # Advancing technologies add more capabilities to drones


    +   - Drones continue to evolve with different kind of sensors and automation
    controls to improve its ease-of-use and capabilities. Some of the recent developments
    include integration of ultra high-definition cameras for high-quality video capture,
    3D imaging and collision avoidance technology.

    +   - Further, advanced technologies have enabled manufacturers to build customized
    drones of different configuration depending on the application. In coming years,
    more such technologies are expected to make drones much attractive to consumers.


    # Increasing use-cases of drones


    +   - Drones continue to evolve with increasing use-cases across sectors. Enhanced
    flight speed, payload capacity and battery life have opened new avenues for drones
    market.

    +   - Individuals adopt drones for recreational purposes beyond toys, as more
    hobbyists and do-it-yourself (DIY) enthusiasts consider drones as a serious consumer
    device

    +   - As the Internet of Things (IoT) evolves with more connected devices, drones
    are expected to create newer applications.


    # Growing adoption of camera drones


    +   - Camera drones offer user-friendly experience with sophisticated flight control
    and high-end image sensors. These drones enable to take aerial shots of professional
    quality. These are widely adopted by aspirational and professional photographers.


    # Easing regulations


    +   - Most countries are actively developing laws that would govern the operation
    of drones for both personal and commercial purposes.

    +   - In India, DGCA plans to register all civil drones and issue permits for
    operating them. Easing regulations would encourage more manufacturers to enter
    the market as well as drive consumer adoption.


    # Growing affordability


    +   - Drones are getting cheaper with increasing competition and maturing technology.
    In last few years, many Indian start-ups have emerged offering drones with enhanced
    features for low prices than global players. Increasing affordability is expected
    to drive further consumer adoption.'
