  md: "\nThe sensor management systems of several devices can be controlled from one\
    \ common platform (a hub or smartphone). Unlike other systems, Samsung SmartThings\
    \ offers a capability-based sensor management system. With SmartThings, applications\
    \ interact with smart devices based on their capabilities. So, once the capabilities\
    \ that are needed by a SmartApp are specified and once the capabilities that are\
    \ provided by an IoT device are identified, the devices based on the device’s\
    \ declared capabilities are selected for use within a specific SmartApp.\n\n![](img/3531370aa21067bbdc45128741d34edb_49_0.png)\n\
    \nFig. 4.3: An example of the sensor management system for Android.\n\n(Source:\
    \ https://www.researchgate.net/publication/322975901_A_Survey_on_Sensor-based_Threats_to_Internet-of-Things_IoT_Devices_and_Applications\
    \ )\n\nCisco, the industry leader in IoT platforms, offers an integrated solution\
    \ for the management of IoT devices. The Cisco IoT/M2M architecture is composed\
    \ of four layers; some are similar to those described in the conventional Cisco\
    \ network architecture.\n\n![](img/3531370aa21067bbdc45128741d34edb_50_0.png)\n\
    \nFigure 4.4: IoT/M2M network architecture layers\n\nSource: https://www.cisco.com/c/en/us/about/security-center/secure-iot-proposed-framework.html\n\
    \nThe Internet of Things covers a wide range of industries and use cases across\
    \ cross-platform deployments and cloud systems in real-time. Hence, there exist\
    \ certain standards and protocols to allow the communication between the devices\
    \ and servers in more interconnected ways. The major IoT protocols at various\
    \ layers in the IoT architecture stack are displayed in the following figure (Source:\
    \ Simon Ford - Director of IoT Platforms ARM):\n\n![](img/3531370aa21067bbdc45128741d34edb_51_0.png)\n\
    \nFig 4.5: Major IoT protocols at various layers\n\nMany communication technologies\
    \ such as Wi-Fi, Bluetooth, Zigbee and cellular are well known, but there are\
    \ also several new emerging networking options such as Thread used as an alternative\
    \ for home automation applications, and Whitespace TV technologies being implemented\
    \ in major cities for wide area IoT-based use cases.\n\n## 1. WI-FI\n\nWi-Fi is\
    \ the choice for many developers because of its wide existing infrastructure as\
    \ well as its ability to handle high quantities of data with rapid data transfer.\n\
    \n## 2. BLUETOOTH\n\nBluetooth, a short-range communication technology is expected\
    \ to be the key for wearable products in particular, connecting to the IoT via\
    \ a smartphone in most of the cases. The new Bluetooth Low Energy (BLE) or Bluetooth\
    \ Smart is a significant protocol for IoT applications as it offers significantly\
    \ reduced power consumption.\n\n## 3. ZIGBEE\n\nZigbee, like Bluetooth, has a\
    \ large installed base of operation, more in industrial settings. Zigbee/RF4CE\
    \ offers low-power operation, high security, robustness and high scalability with\
    \ high node counts and is well positioned to take advantage of wireless control\
    \ and sensor networks in M2M and IoT applications.\n\n## 4. CELLULAR\n\nIoT applications\
    \ requiring operations over longer distances can leverage GSM/3G/4G cellular communication\
    \ capabilities. Cellular is capable of sending high quantities of data, especially\
    \ for 4G; however, the expense and power consumption is deemed to be high for\
    \ many applications. Cellular can be ideal for sensor-based low-bandwidth-data\
    \ projects that will send very low amount of data over the Internet.\n\n## 5.\
    \ LOWPAN\n\n6LowPAN (IPv6 Low-power wireless Personal Area Network) is a network\
    \ protocol that defines encapsulation and header compression mechanisms.\n\n##\
    \ 6. Thread\n\nThread is a relatively new IP-based IPv6 networking protocol aimed\
    \ at the home automation environment. It is primarily designed as a complement\
    \ to Wi-Fi as it recognizes that while Wi-Fi is good for many consumer devices\
    \ that it has limitations for use in a home automation setup.\n\n## 7. LoRaWAN\n\
    \nLoRaWAN targets wide-area network (WAN) applications and is designed to provide\
    \ low-power WANs with features specifically needed to support low-cost mobile\
    \ secure bi-directional communication in IoT, M2M and smart city and industrial\
    \ applications. LoRaWAN is optimized for low-power consumption and can support\
    \ large networks with millions and millions of devices.\n\n| Protocol | Standard\
    \ | Frequency | Range | Data Rates |\n|---|---|---|---|---|\n| Wi-Fi | 802.11n\
    \ | 2.4GHz and 5GHz | Approximately 50m | 600 Mbps maximum, but 150-200 Mbps is\
    \ more typical |\n| Bluetooth | Bluetooth 4.2 core specification | 2.4GHz (ISM)\
    \ | 50-150m (Smart/BLE) | 1Mbps (Smart/BLE) |\n| ZigBee | ZigBee 3.0 based on\
    \ IEEE802.15.4 | 2.4GHz | 10-100m | 250kbps |\n| Cellular | GSM/GPRS/EDGE (2G),\
