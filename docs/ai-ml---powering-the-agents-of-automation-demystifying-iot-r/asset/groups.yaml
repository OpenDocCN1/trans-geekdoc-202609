  md: '

    The first commercial robot ‘Unimate’ was built by George Devol in 1954 and sold
    to General Motors in 1961 where it was used to lift pieces of hot metal from die
    casting machines at the Inland Fisher Guide Plant in the West Trenton section
    of Ewing Township, New Jersey.


    Robots can be autonomous or semi-autonomous and range from humanoids such as Honda’s
    Advanced Step in Innovative Mobility (ASIMO) and TOSY’s TOSY Ping Pong Playing
    Robot (TOPIO) to industrial robots, medical operating robots, patient assist robots,
    dog therapy robots, collectively programmed swarm robots, UAV drones such as General
    Atomics MQ-1 Predator, and even microscopic nano robots. By mimicking a life-like
    appearance or automating movements, a robot can convey a sense of intelligence
    or thought of its own. Autonomous things are expected to proliferate in the coming
    decade with home robotics and the autonomous car as some of the main drivers.
    (Source Wikipedia)


    ## IMPORTANT SKILLS OF A ROBOT


    Robots are adept at a number of skills. Some of the important skills are mentioned
    below:


    - Search, procure, collate and analyze data from the web or from a database.

    - Record and transmit information and data.

    - Calculate locations, positions about their current location, targeting locations
    for movement or any action and decide a course of action as per the programmatic
    instructions.

    - Engage in written and voice-based communication with external actors.

    - Carry out activities in a synchronized and pre-determined fashion with precision
    any number of times or as per a sequence.

    - Monitor, identify and report performance measures.

    - Learn and continuously improve their performance to identify and predict future
    from examined patterns based on data mining.

    - Able to lift huge weights and position them with precision in a targeted place
    with pinpoint accuracy using appropriate sized arms.


    ## ADVANTAGES AND DISADVANTAGES OF ROBOTS


    The following are the advantages of robots:


    - Ability to work in any type of environment, including hazardous and difficult
    terrains. They can execute jobs such as bomb and landmine disposal, which are
    considered to be human life threatening jobs.

    - Exhibit repeatable pinpointed accuracy and precision without any fatigue or
    boredom forever.

    - Conduct robotic surgeries, build 3D manufactured components and buildings that
    can lift large weights effortlessly as programmed.

    - Their cost continuously comes down over time, while the wages of human beings
    increases with time and hence their productivity, efficiency and return on investment
    increase over time.

    - Do not participate in politics and frivolous activities and focus on increasing
    their performance at work and are immune to working conditions except for certain
    environmental factors like temperature and terrain, etc.

    - Modular constructed robots offer the flexibility of multi-tasking and the same
    forms can be used to undertake jobs that require different skill sets by modifying
    the programs.

    - Robots are objective and not sentimentally affected like the humans, thus leading
    to their dependability and predictability at all times.


    The following are the disadvantages due to employment of robots:


    - Prior to the advent of machine learning, there were many disadvantages associated
    with robots corresponding to the inability to improve and adapt to the circumstances.
    But machine learning combined with artificial intelligence has enabled robots
    to continuously improve and get better and better.

    - However, robots require high initial investments, prone to technical breakdowns,
    high energy consumption and high maintenance cost apart from a bit of technical
    savvy management.

    - Robots can also be corrupted by cybercriminals and this can lead to shutdowns
    and failures or performance variations. Hence, they need to be properly secured
    through very high level of interaction authentication and cryptographic protocols
    by leveraging the blockchain technology.


    ## LAWS OF ROBOTICS


    The best known sets of laws are Isaac Asimov’s ‘Three Laws of Robotics’. These
    laws were introduced in the 1942 short story ‘Runaround’, although they were foreshadowed
    in a few earlier stories. The three laws are as follows:


    - A robot may not injure a human being, through inaction, or cause any harm to
    a human being.

    - A robot must obey the orders given by human beings except orders that could
    conflict with the first law.

    - A robot must protect its own existence as long as the protection does not conflict
    with the first or second law.


    At the end of his book, *Foundation and Earth*, a zeroth law was introduced: A
    robot may not injure humanity or by inaction, allow humanity to come to harm.


    In 2011, the Engineering and Physical Sciences Research Council (EPSRC) and the
    Arts and Humanities Research Council (AHRC) of Great Britain jointly published
    a set of five ethical ‘principles for designers, builders and users of robots
    in the real world, along with seven ‘high-level messages’ intended to be conveyed
    based on the September 2010 research workshop. They are as follows:


    - Robots should not be designed solely or primarily to kill or harm humans.

    - Humans, not robots, are responsible agents. Robots are tools designed to achieve
    human goals.

    - Robots should be designed in ways that assure their safety and security.

    - Robots are artifacts; they should not be designed to exploit vulnerable users
    by evoking an emotional response or dependency. It should always be possible to
    tell a robot from a human.

    - It should always be possible to find out who is legally responsible for a robot.


    AI and ML are now working in tandem and the prospect of an all powerful robot
    that can run, crawl, swim, climb, fly and out-think and outmanoeuvre the human
    seems plausible. It is worthwhile to recount the laws of Artificial Intelligence
    listed by Satya Nadella, the CEO of Microsoft Corporation, in June 2016 in an
    interview with the Slate magazine and roughly sketched five rules for artificial
    intelligences to be observed by their designers.


    - ‘A.I. must be designed to assist humanity’ which means human autonomy needs
    to be respected.

    - ‘A.I. must be transparent which means that humans should know and be able to
    understand how they work.’

    - ‘A.I. must maximize efficiencies without destroying the dignity of people’.

    - ‘A.I. must be designed for intelligent privacy’ which means that it earns trust
    through guarding their information.

    - ‘A.I. must have algorithmic accountability so that humans can undo unintended
    harm’.

    - ‘A.I. must guard against bias so that they cannot discriminate against people.’


    ## SYSTEMS IN A ROBOT


    The main actions representing a robot’s spectrum of activities fall under ‘Sensing
    and Actuation’. Sensing involves the perception of the external environment to
    be processed by the relevant internal mechanisms, both electronic. The response
    is initiated in the form of a decision passed on to the respective component or
    part, resulting in an action. This process is called ‘Actuation’.


    - Robotics involves integration of computers and controlled mechanisms to make
    devices re-programmable and versatile. A variety of mathematical representations
    are used to plan robotic tasks and integrate sensors into the task planning. The
    tasks are the goals to be achieved; for example, go from point A to point B.

    - A number of supporting technologies go into the building of the robots such
    as Vision systems, End-of-arm tooling, Compliance devices, Manipulation devices,
    Welding technologies, Lasers, Proximity sensors, Wrist sensor (forces/torques),
    Control software/hardware, Part delivery systems, Application software, Interface
    software, Operating systems, Programming languages, Communication systems I/O
    devices, etc.


    ## COMPONENTS OF A ROBOT


    A typical robot consists of the components such as electronic motors, sensors,
    power conversion unit, controller, actuators, piezo motors and ultrasonic motors,
    pneumatic muscle wires, manipulator linkage, base and a user interface, locomotion,
    and artificial intelligence. All these components along with cameras embedded
    in the place of the eyes and a CPU positioned like a brain enable the robots to
    undertake many complex operations.

