    **2010 APPLE SIRI:** Apple SIRI is the first voice assistant that converses with
    the users by replying and assisting with a number of tasks. This was later followed
    by many personal assistant bots; prominent being Google Assistant, Amazon Alexa
    and Microsoft Cortana (April 2014).


    **2014 MICROSOFT CORTANA:** This was launched in April 2014. Cortana can set reminders,
