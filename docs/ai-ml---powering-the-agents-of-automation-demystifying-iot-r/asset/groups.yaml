    ## (d) CERTIFICATION AUTHORITIES (CA):


    A Certificate authority or Certification authority (CA) is a trusted entity that
    issues digital certificates certifying the ownership of a public key by the named
    subject of the Certificate. This is an essential part of a PKI infrastructure.
    X.509 is a widespread standard to manage certification.


    For example, in Hyperledger Fabric 1.1, the Certificate authority managing member
    identities issues X.509 certificates to its members.


    ## SUMMARISING BLOCKCHAIN’S FEATURES:


    - Pseudonymity

    - Decentralization

    - Fault tolerance with no single point of failure

    - Immutability (Tamper resistant)

    - Transparency

    - Trust through automation


    ## BLOCKCHAIN’S SECURITY TOOLS:


    - One way Hash functions used in consensus implementation

    - Data footprint representation and key generation

    - Non-forgeable digital signature algorithms for transaction privacy

    - Secrecy and non repudiation


    In the traditional digital world, mutually untrusted partners communicate through
    a centralized system with the help of these digital certificates issued by centralized
    authorities to different websites and portals.


    However, there have been increasing cases of Certification authorities being attacked.


    There have been several cases of fake digital certificates for famous publishers
    like Google issued by reputed Certification authorities like Gogo (Inflight internet
    service) and Symantec, etc., while fake certificates used to target users of reputed
    banks to direct them to fake versions of their banks’ sites.


    In the case of private Blockchains, the certification authorities and the administrators
    need to take utmost precaution in identifying genuine participants through issuance,
    identifying and revoking the certificates as the case may be appropriately. In
    the case of public Blockchains, in 2016, Sead Muftic proposed a Blockchain-based
    protocol that allows distribution and management of digital certificates (linking
    a subject with its public key) without the need of certificate authorities by
    offering BIX (Blockchain Information Exchange) certificates maintained in BCL
    (Bix certificate Ledger). These can replace the system of X.509 certificates offered
    by centralized authorities.


    ## VULNERABILITIES IN BLOCKCHAIN SECURITY


    - **VULNERABILITIES TO MALWARES:** Malware attacks on users’ and nodes’ computer
    system to steal information and crypto-jacking (illegal mining using user’s resources).
    A Blockchain-based access control can help.

    - **VULNERABILITY OF USERS’ INSTALLED PROGRAMS:** Third-party software compromised
    by hackers. Regular software patch updates is a must.


    Properly managed identities and deployment of Byzantine fault tolerant consensus
    mechanisms ensures that the decentralized systems characterizing the Blockchain
    landscape are fault tolerant, attack resistant and collision resistant as they
    do not have the sensitive single central points of failure. It is also impossible
    for malicious participants to come together and act against the interests of the
    other genuine participants, unlike in centralized corporations with single points
    of failure and power concentration in a central authority.


    However, there are certain limitations that are inherent to the Blockchain platforms
    that need to be looked at:


    - a) The implementation of the consensus mechanism for arriving at the decision
    is contingent upon the opinion of the majority. Hence, it is possible for a majority
    to collude and manipulate decisions making a 51% attack feasible.

    - b) Where there are a smaller number of participants in the Blockchain that generally
    happens in enterprise Blockchains closed groups or newly launched public platforms,
    the security is limited or missing at times.

    - c) The private key management is vulnerable to thefts and hence exploitable.
    The trust in the Blockchain relies on the safekeeping of the private keys for
    a truly distributed identity management. Hence, the crypto currency and token
    investors in the case of public Blockchains and crypto asset-based platforms and
    the node administrators in the case of a private Blockchain should ensure adequate
    measures to record and store their private keys in a secure manner. Care should
    be taken that only authenticated users are able to transact on the respective
    platforms.

    - d) Weakness in software implementation may compromise the entire system. There
    have been a number of cases where smart contracts and chain codes have been exploited
    to the detriment of the participants in the decentralized applications. In the
    case of the DAO, the first decentralized application launched on the Ethereum
    platform, about 50 million US dollars (3.6 million Ether) worth of tokens were
    syphoned off the organization through a bug that caused a recursive loop to remit
    the currency units to an attacker''s account. (reference: https://en.wikipedia.org/wiki/The_DAO_(organization))

    - e) Blockchain''s cryptographic techniques may assure the immutability of the
    ledger but not that of the overall system. For example, there have been numerous
    attacks on the paraphernalia surrounding the Blockchain platforms like exchanges,
