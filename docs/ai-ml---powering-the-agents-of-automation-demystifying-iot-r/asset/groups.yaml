    # GOOD BOTS


    The bots which are created for a specific legal and authorized purpose to enable
    the organizations to help in marketing, customer service and improve their productivity
    and profitability can be considered as good bots. Some of the good bots for such
    applications are listed below:


    +   - Good bots help businesses automate a number of processes within the norms
    of propriety and positive spirit and help businesses reach their objectives in
    a legal way.

    +   - Search engine bots help in fetching the relevant results regarding websites
    and pages based on search criteria broadcasting data when required.

    +   - Feed fetchers and Crawler bots undertake background execution and help in
    getting info from other APIs and websites. They form almost 7% of the web traffic
    and form the highest proportion of good bot traffic.

    +   - Transactional bots like Oracles help in carrying out transactions by representing
    the websites to external systems. Transactional bots participate in a number of
    human-bot and bot-to-bot interactions and are of two types, namely, voice-based
    bots and text-based bots.

    +   - Lead-gen Bots, Query Bots and Task Bots are different types of role-based
    bots created to automate a variety of tasks in pre-sales, sales, customer service
    or in employee interactions. They help to improve customer and employee satisfaction
    by offering a friendly and better experience.


    # BAD BOTS:


    Bad bots undertake illegal and malicious activities by trying to hack into other
    online agents and also misrepresent wrong information to their victims, thus misleading
    them to get cheated. Some of them are listed below:


    +   - Scraper sites steal content to republish in other sites in an unauthorized
    manner.'
  - '[PAGE 148]


    +   - Spammers post unwanted and repetitive promotional content to unsuspecting
    users. Chat and messaging platforms like Yahoo Messenger, Windows Live Messenger,
    etc. have been frequent targets for spammers who fill their chat rooms with spam,
    misleading people to part with sensitive personal information.

    +   - Impersonators that mimic humans to mislead unsuspecting humans. They form
    almost 25% of the bot traffic overall as per a number of current studies.

    +   - Hackers populate harmful content on victim sites attacked by them and leave
    unforeseen damage. They are the most harmful bots.


    # KEY STEPS TO BUILD A CHATBOT:


    +   - Before building a chatbot, the developer should consider whether to develop
    a Chatbot from scratch or if they can use a free Chatbot. Paid Chatbots offer
    a customized option with a number of specific use cases required by the company.
    They are costly and are built with the help of external conversational AI companies.
    It is important to keep the following characteristics of an ideal Chatbot in mind:

    +   - 24/7 availability

    +   - Immediate reply

    +   - Memory regarding the customer’s prior transactions, likes and dislikes

    +   - Fine-tuning responses based on earlier mistakes and user responses

    +   - Continuous improvement in response time, accuracy and efficiencies

    +   - Ensures customers are delighted with the experience

    +   - An easy-to-use interface for customers to format their queries in a simple
    manner

    +   - Ability to converse in many languages in written and spoken words'
