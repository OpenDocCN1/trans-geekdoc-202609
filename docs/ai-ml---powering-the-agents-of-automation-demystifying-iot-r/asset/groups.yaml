    ## HOW DOES A DRONE WORK?


    ## 无人机如何工作？


    The working procedure of a drone may appear simple to most of you but the device
    is actually carrying a complex technology inside. Before we discuss the concept
    of a drones’ working, you must know the fact that differentiates between drones
    and its ancestors, the helicopters. The former one can fly independently whereas
    the latter needs a pilot for directions.


