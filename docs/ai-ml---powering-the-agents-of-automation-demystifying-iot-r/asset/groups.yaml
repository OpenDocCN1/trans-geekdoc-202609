    # WHAT IS RPA OR ROBOTIC PROCESS AUTOMATION?


    RPA consists of the following three terms:


    **ROBOT:** A robot refers to a piece of computer coded software that can mimic
    user interactions and routine manual activities with utmost precision across the
    areas of its deployment and could be rule-based or unstructured.


    **PROCESS:** A process refers to an activity or a sequence of steps that is carried
    out on an input to result in an output in a regular and routine manner. This could
    be across various functional and non-functional areas of an organization and lends
    a method and a system of approach to any task in a professional organization,
    lending it dependability, accountability, repeatability and credibility.


    **AUTOMATION:** Automation refers to the approach of carrying out the processes
    without a manual intervention by leveraging information technology tools and systems.


    Thus RPA means automation of repetitive, rule-based processes across functional
    areas and different applications in an organization with robots that mimic the
    human activities, thus replicating the same.


    Routine jobs like data entry tasks, accounting entries, invoicing, expense filing,
    auditing against a set rules, etc. can now be automated and integrated into the
    rest of the IT systems in the organization resulting in high precision, tremendous
    scalability and ease of reconciliation. RPA is very different from other automated
    routine processes performed by Chatbots, voice assistant and personal assistants.
    RPA are automation tools for rule-based processes mainly in financial and accounting
    domains controlled by business operation teams and managed by the IT department
    in the organization.


    Implementation of RPA has proven to improve efficiency and increase speed of operations
    while reducing expenses, thus resulting in an all-round operational excellence
    and customer satisfaction in organizations.'
