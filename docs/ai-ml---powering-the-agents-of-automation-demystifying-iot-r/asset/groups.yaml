    ## 案例研究：用于先进工业 4.0 应用的 INTEL® OPENVINO™ 工具包


    (Source:https://software.intel.com/en-us/articles/sdp-case-studies#OpenVINO)


    Intel 是通过其广泛的解决方案部署人工智能、机器学习和深度学习算法来赋能前沿技术领先组织的领导者之一。Intel 对 Open VINO 平台的发行提供了易于部署的先进基于
    AI 的机器人开发和部署解决方案，以解决自动化问题。


    OpenVINO™ 工具包，Open Visual Inference and Neural Network Optimization toolkit 的简称，为开发人员在多种
    Intel® 处理器上提供改进的神经网络性能，并帮助他们进一步释放经济高效的实时视觉应用。该工具包支持深度学习推理和在多个 Intel® 平台（CPU、Intel®
    Processor Graphics）上的易于异构执行，提供从云架构到边缘设备的实现。此开源发行版为开发者社区创新深度学习和 AI 解决方案提供了灵活性和可用性。


    ## OPENVINO™ 工具包包含：


    - Deep Learning Deployment Toolkit


    该工具包允许开发人员通过与应用程序逻辑集成的<|message|> 高级 C++ Inference Engine API 部署预训练的深度学习模型。


    此开源版本包括两个组件，Model Optimizer 和 Inference Engine，以及 CPU、GPU 和异构插件，以加速在 Intel(R)
    CPU 和 Intel(R) Processor Graphics 上的深度学习推理。它支持来自 Open Model Zoo 的预训练模型，以及 100
    多个开源和公共模型，格式包括 Caffe*、Tensorflow*、MXNet* 和 ONNX*。


    - Open Model Zoo


    该存储库包含优化的深度学习模型和一套演示，以加快高性能深度学习推理应用的开发。该存储库使用这些免费的预训练模型，而不是自行训练模型，以加快开发和生产部署流程。


    以下是 INTEL OpenVINO 工具包的一些主要应用：


    - 由 Intel® Distribution of OpenVINO™ 工具包优化的 ADLINK 和 Touch Cloud 提供了一体化 AI 引擎，可协助进行数据分析、检测、分类和预测，适用于各种用例。

    - Advantech 部署了硬件和软件的组合，包括摄像头、AI 深度学习和视频分析技术，均由 Intel® Distribution of OpenVINO™
    工具包优化，为零售组织提供前沿解决方案。

    - Agent VI 使用 Intel Distribution of OpenVINO 工具包的计算机视觉应用提供前沿的数字安全和监控解决方案。

    - GeoVision 使用 Intel® System Studio 和 OpenVINO™ 工具包为其 24 倍深度学习人脸识别解决方案加速。

    - GE Healthcare 在使用 Intel® Xeon® 处理器和 Intel® Distribution of OpenVINO™ 工具包运行时将推理性能提高了
    14 倍。来自 Intel 的 Deep Learning Deployment Toolkit 帮助 GE 将 AI 的力量应用于临床诊断扫描和其他医疗保健工作流程。

    - Gorilla Technology 使用 Intel® Distribution of OpenVINO™ 工具包和 Intel® System Studio
    将其 IVAR* 智能视频分析记录器的效率优化了 1.5 倍。

    - Honeywell 在借助 Intel 强大的视觉产品组合如 Intel 的 OpenVINO 工具包的帮助下，加快了视频处理时间并增加了通过单个设备实时流式传输的摄像头数量，以增强其安全和监控解决方案组合。

    - IOmniscient IronYun 的先进视频分析和 AI 视频搜索使用 Intel® Distribution of OpenVINO™ 工具包来加速
    AI 模型训练和深度学习推理，以提供前沿的基于 AI 的多感官和智能监控分析。

    - 由强大的高性能 Intel® 架构驱动，有助于使城市更安全、组织更高效。

    - Intel® Vision Products 帮助 ISS 提供用于视频监控的先进视觉深度学习神经网络。

    - Mindtree 的智能数字视觉分析系统借助 Intel® Distribution of OpenVINO 工具包增强了安全性并减少了损耗。

    - NexCOBOT，一家 NEXCOM 公司，提供灵活的模块化机器人解决方案，将人工智能（AI）与机器视觉集成，由 Intel® Vision Accelerator
    Design 产品驱动并由 Intel® Distribution of OpenVINO™ 工具包优化。

    - Outdu 的设备使用 Intel® 技术在边缘分析视频，并为零售和其他人流量大的环境提供即时、可操作的洞察。

    - Philips 展示了突破性的 AI 推理性能，用于在由 Intel® Xeon® Scalable 处理器驱动的服务器上运行的医疗保健工作负载，并使用
    OpenVINO™ 工具包进行优化。

