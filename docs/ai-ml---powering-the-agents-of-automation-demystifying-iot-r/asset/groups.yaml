    RPA 的潜力和实用性，从而能够投资该技术。AAU（Automation Anywhere University）为学习者提供在线、离线和混合学习选项，以培养实施高级
    RPA 应用所需的技能。


    ## 结论


    RPA 或机器人流程自动化（RPA）于 2012 年通过 HFS 编写的案例研究引入市场，并得到 RPA 平台领导者 Blue Prism 的支持。在本章中，我们研究了
    RPA 的演变、其效用、实施路径、可用平台以及其作为集成工具以提高企业生产力和盈利能力的前进方向。RPA 承诺通过自动化重复性流程，从低效的业务流程和 BPO
    服务中消除手动变通方法和人员超载。


    以云和下一代 IT 和通信技术将业务流程外包到低收入目的地为导向的新型商业模式，使公司能够显著提高生产力和盈利能力。RPA 的实施导致资源进一步优化，许多常规会计和财务流程得到自动化。聊天机器人和语音助手的实施增加了另一层自动化，与后端
    RPA 驱动的自动化相结合。AI 和 ML 驱动的分析的出现正在改变前端客户交互的各个方面以及其与后端运营的交互，以响应查询，这导致需要在组织的不同方面采取集成方法，而这些方面此前一直处于孤立和独立状态。AI
    和 ML 驱动的分析和高级功能使 RPA 工具能够提供包括模式识别、文档和货币识别在内的高级功能等等。


    因此，RPA 不再仅仅是重复性流程自动化，而是一种先进的范式，不仅能够实现能够随时间和交互而学习和改进的高级分析驱动功能，还能够实现跨职能领域的后端流程集成。未来区块链驱动自动化的实施将使流程在企业内部和企业之间进行大规模改造。因此，任何将
    RPA 与 AI 和 ML 驱动的分析、业务流程再造和区块链相结合并实施的组织都需要与公司内的系统（如 ERP、CRM 和外部预言机和区块链）进行垂直和水平集成。


    这将是新一代组织充分利用自动化的愿景。我们将在后续章节中进一步研究这个问题。


    ## 第 7 章


    ## 无人机


    ## 引言：


    无人机是基于 AI 和 ML 的技术进步的飞行体现。从有限范围、电池控制的飞行设备开始，无人机现在拥有最先进的功能，并参与了许多复杂项目和用例；这得益于 AI
    和 ML 驱动应用的进步。


    对于许多人来说，无人机是黑箱，很多人仍然想知道如此微小的物体在高空中飞行是如何能够执行如此复杂的一系列功能并执行各种活动的。


    在本章中，我们将仔细研究无人机的各种类型及其在各个领域的应用。


    ## 结构：


    - 描述无人机

    - 无人机组件

    - 无人机类型

    - 无人机分类

    - 无人机中的 AI

    - AI 在无人机行业中的用途


    ## 目标：


    本章的目的是揭示现在在世界各地出现的自主飞行物体背后的技术。我们将从定义、应用领域、构成其机体的硬件组件、无人机的分类及其优缺点等方面审视无人机的各个方面。利用
    AI 和 ML 驱动技术赋予无人机功能的技术的技术基础也将简要介绍。预计阅读本章后，无人机不再是神秘的飞行物体，并且预计读者将积极参与采购和使用无人机，用于从爱好到公共事业和福利等各种应用，同时遵守管理此类应用的当地法律法规。


    ## 无人机简要概述：


    无人机是一种无人驾驶飞机，将物联网、卫星、GPS、机器人、人工智能等多种技术集成到一个紧凑的单元中。随着世界领先企业在商业化方面的最新进展，它已成为最热门的话题。


    根据维基百科，无人机是无人驾驶飞行系统；远程控制的无人驾驶飞机；没有人控制的飞行物；美国联邦航空管理局（FAA）称其为无人驾驶飞行系统（UAS），并预测到
    2020 年全国天空中的无人机可能达到 30,000 架。


    ## 无人机机体包含以下组件：


    配备 GPS 集成的飞行控制器、多旋翼旋转叶片、飞行全程的电池存储、用于传感器载荷安装的云台、红外摄像机等。机体由碳纤维等轻质材料制成。传感器重量轻且极其节能。多旋翼提供冗余并有助于管理任何时间任何旋翼的故障。

