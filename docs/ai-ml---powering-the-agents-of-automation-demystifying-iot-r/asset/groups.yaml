    ## CHAPTER 13

    ### Summary and Conclusion

    We have been witnessing an unprecedented level of automation sweeping across the
    globe, ever since the advent of machine learning powered Artificial Intelligence
    and the enabling technologies such as Cloud, Big Data and Analytics have started
    acting in tandem. Banks, airports, hotels, restaurants, BPOs, retail, high-end
    residencies and even our day-to-day travel are in the process of going virtually
    human operation free.


    The main objective of this book is to familiarize how technology is impacting
    and manifesting itself in the form of various tools, application and forms which
    we have termed as ‘Agents of Automation’.


    In this book, we saw the various elements of automation that are powering the
    ‘Autonomous’ revolution today from various angles. We provided examples for each
    of the above areas along with a detailed analysis of where this phenomenon is
    impacting us. We also looked at how these can be built and how the respective
    fields across the globe are competing with each other to replace the human beings
    for most of the routine and not-so-routine jobs.


    The steps taken in each of these applications along with the various tools and
    platforms that can be used to build these applications have been outlined in a
    brief manner. This will enable the learners and readers to plan and deploy these
    tools to enhance their productivity and quality of life and work.


    With these agents completely demystified, you will now be able to easily comprehend
    how these various ‘Agents of Automation’ are composed and unleashed with the help
    of technology.


    With the increasing impact of digitization and automation, there comes the increased
    need of providing security from malware and cybercriminals. Blockchain is the
    paradigm that has the potential to de-risk us from a variety of angles through
    effective identification, irrefutable transactions, incorruptible ledgers, fast
    and efficient interactions in the digital world.


    We examined a comprehensive approach to the Blockchain-powered automation to the
    ‘Agents of Automation’ that will enable us to leverage these technological advancements
    and embrace the life of hope, convenience and high quality, without any fear and
    inhibitions.


    ## CONCLUSION:

    Automation across all aspects is an irrefutable reality. Those not seeing this
    wave and accepting this reality have the risk of not only missing out on all the
    conveniences and luxuries that this can provide in improving the quality of our
    personal and professional lives. All global citizens need to understand it and
    also use it to the best to complement their activities and also compete in this
    world. Let us all make these ‘Agents of Automation’ our friends and focus our
    time and efforts on much higher value added activities that can increase our net
    worth. It is also important for all participants in the ecosystem to be mindful
    of the various ethical, moral, legal aspects involved in the proliferation of
    these technologies to enable them for the collective good and betterment of our
    lives in the future.


    It is indeed possible that in future we will be having human beings powered by
    computer chips that provide the power of the AI/ML to their brains as well like
    how ‘Cobots’ are enabling them with physical augmentation in the industrial environment.
    It is also equally possible that bioinspired robots and biologically engineered
    human beings transplanted with the AI-powered brain can give rise to a new breed
    of inhabitants roaming on this universe. The future is indeed exciting. Let us
    welcome the future with open arms and minds!


