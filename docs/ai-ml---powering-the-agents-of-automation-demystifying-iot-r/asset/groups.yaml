  mdcn: "\n几个设备的传感器管理系统可以从一个通用平台（集线器或智能手机）进行控制。\n\n与其他系统不同，Samsung SmartThings 提供基于能力的传感器管理系统。\n\
    \n使用 SmartThings，应用程序基于其能力与智能设备交互。因此，一旦 SmartApp 所需的能力被指定，并且一旦物联网设备提供的能力被识别，则基于设备声明的能力选择设备用于特定\
    \ SmartApp 中。\n\n![](img/3531370aa21067bbdc45128741d34edb_49_0.png)\n\n图 4.3：Android\
    \ 传感器管理系统示例。\n\n(来源: https://www.researchgate.net/publication/322975901_A_Survey_on_Sensor-based_Threats_to_Internet-of-Things_IoT_Devices_and_Applications\
    \ )\n\nCisco，物联网平台的行业领导者，提供物联网设备管理的集成解决方案。Cisco 物联网/M2M 架构由四层组成；其中一些与传统 Cisco\
    \ 网络架构中描述的类似。\n\n![](img/3531370aa21067bbdc45128741d34edb_50_0.png)\n\n图 4.4：物联网/M2M\
    \ 网络架构层\n\n来源: https://www.cisco.com/c/en/us/about/security-center/secure-iot-proposed-framework.html\n\
    \n物联网涵盖了跨平台部署和实时云系统中的广泛行业和用例。\n\n因此，存在某些标准和协议以允许设备和服务器之间以更互联的方式进行通信。物联网架构栈中各层的主要物联网协议显示在以下图中（来源:\
    \ Simon Ford - ARM 物联网平台总监）：\n\n![](img/3531370aa21067bbdc45128741d34edb_51_0.png)\n\
    \n图 4.5：各层主要物联网协议\n\nWi-Fi、蓝牙、Zigbee 和蜂窝等许多通信技术已被熟知，但也有一些新兴的网络选项，例如用作家庭自动化应用替代方案的\
    \ Thread，以及在主要城市中实施的用于广域物联网用例的白空间电视技术。\n\n## 1. Wi-Fi\n\nWi-Fi 因其广泛的现有基础设施以及能够处理大量数据并实现快速数据传输而成为许多开发者的选择。\n\
    \n## 2. 蓝牙\n\n蓝牙是一种短距离通信技术，预计将成为可穿戴产品的关键，尤其是在大多数情况下通过智能手机连接到物联网。\n\n新的蓝牙低功耗 (BLE)\
    \ 或蓝牙智能是物联网应用的重要协议，因为它提供显著降低的功耗。\n\n## 3. Zigbee\n\nZigbee 与蓝牙一样，具有庞大的运营安装基础，尤其在工业环境中。\n\
    \nZigbee/RF4CE 提供低功耗运行、高安全性、鲁棒性和高可扩展性（节点数量多），并非常适合利用无线控制和传感器网络在机器到机器和物联网应用中。\n\
    \n## 4. 蜂窝网络\n\n需要在更长距离上运行的物联网应用可以利用 GSM/3G/4G 蜂窝通信能力。\n\n蜂窝网络能够发送大量数据，尤其适用于 4G；然而，对于许多应用而言，其费用和功耗被认为较高。\n\
    \n蜂窝网络可非常适合基于传感器的低带宽数据项目，这些项目将通过互联网发送极少量数据。\n\n## 5. 6LoWPAN\n\n6LoWPAN（IPv6 低功耗无线个人局域网）是一种网络协议，定义了封装和头部压缩机制。\n\
    \n## 6. Thread\n\nThread 是一种相对较新的基于 IP 的 IPv6 网络协议，面向家庭自动化环境。\n\n它主要被设计为 Wi-Fi\
    \ 的补充，因为它认识到虽然 Wi-Fi 对许多消费设备来说很好，但在家庭自动化设置中使用存在局限性。\n\n## 7. LoRaWAN\n\nLoRaWAN\
    \ 针对广域网 (WAN) 应用，旨在提供低功耗 WAN，并具有专门为支持物联网、机器到机器、智慧城市和工业应用中的低成本移动安全双向通信所需的功能。\n\n\
    LoRaWAN 针对低功耗进行了优化，可以支持包含数百万甚至数百万设备的庞大网络。\n\n| 协议 | 标准 | 频率 | 范围 | 数据速率 |\n|---|---|---|---|---|\n\
    | Wi-Fi | 802.11n | 2.4GHz 和 5GHz | 约 50m | 最大 600 Mbps，但 150-200 Mbps 更为常见 |\n\
    | 蓝牙 | Bluetooth 4.2 核心规范 | 2.4GHz (ISM) | 50-150m (Smart/BLE) | 1Mbps (Smart/BLE)\
    \ |\n| Zigbee | 基于 IEEE802.15.4 的 ZigBee 3.0 | 2.4GHz | 10-100m | 250kbps |\n\
    | 蜂窝 | GSM/GPRS/EDGE (2G), UMTS/HSPA (3G), LTE (4G) | 900/1800/1900/2100MHz |\
    \ GSM 最大 35km；HSPA 最大 200km | 35-170kbps (GPRS), 120-384kbps (EDGE), 384Kbps-2Mbps\
    \ (UMTS), 600kbps-10Mbps (HSPA), 3-10Mbps (LTE) |\n\n| 协议 | 标准 | 频率 | 范围 | 数据速率\
    \ |\n|---|---|---|---|---|\n| 6LoWPAN | RFC6282 | 用于多种网络介质，包括 Bluetooth Smart\
    \ (2.4GHz) 或 Zigbee 或低功耗 RF (sub-1-GHz) | N/A | N/A |\n| Thread | 基于 IEEE802.15.4\
    \ 和 6Low-PAN 的 Thread | 2.4GHz (ISM) | N/A | N/A |\n| LoRaWAN | LoRaWAN | 各种 |\
    \ 城市环境 2-5km，郊区环境 15km | 0.3-50 kbps |\n\n图 4.7：不同物联网协议及其参数\n\n物联网将影响所有领域，涵盖消费和工业用途。虽然智能家居、可穿戴设备和个人追踪器是消费者的良好用例，但物联网可以通过产品和服务的价值增值周期，在设计、制造、存储、运输、维护和实时性能跟踪等各个领域得到利用，从而显著提升组织的生产力和盈利能力。\n\
    \n工业和消费物联网应用中不同的主要应用领域在以下图像中进行了总结：\n\n![](img/3531370aa21067bbdc45128741d34edb_55_0.png)\n\
    \n图 4.8：物联网分类及用例\n\n截至目前，物联网已广泛应用于以下领域：\n\n- 标记和监控汽车、动物、配件和被抚养人的移动和性能参数。\n- 为实现最佳农业产出而收集和传播信息。\n\
    - 所有电气设备的自动抄表和能源利用管理。\n- 各种机构和联网家庭的安全和监控系统。\n- 建筑自动化和维护服务。\n- 机器到机器连接，通过高度自动化提供通信、电子商务和协作机会。\n\
    - 智慧城市，以有效管理在公民生活的各个领域提供高效产品和服务。\n- 远程医疗和医疗保健，用于远程测量和跟踪健康参数，以便为偏远地区的患者提供快速解决方案。\n\
    \n实现 IIoT 项目的关键步骤显示在以下图像中：\n\n| 启动和优化 IIoT 项目的 5 个步骤 |\n|---| \n| 建立合作伙伴关系 |\n\
    | 明确业务成果和投资回报率 |\n| 从小开始 |\n| 安全第一 |\n| 为分析而架构 |\n\n*图 4.9：实现 IIoT 项目的步骤*\n\n\
    论文《Blockchain Technologies for the Internet of Things: Research issues and challenges》，作者\
    \ Mohamed Amine Ferrag、Makhlouf Derdour、IEEE 会员 Mithun Mukherjee、Abdelouahid Derhab、IEEE\
    \ 高级会员 Leandros Maglaras、Helge Janicke 强调了在受区块链实施影响的多个物联网相关领域中开展的各种研究。\n\n中心化平台可以通过将每个哑对象转换为智能且可通信的系统，通过基于云的平台提供无数服务。\n\
    \n世界各地的政府已经认识到物联网的潜力，并正在“智慧城市”类别下实施各种项目，而服务、技术和基础设施提供商则利用先进技术和创新，极大地优化和提升我们能想到的每个领域系统的能力和生产力。\n"
