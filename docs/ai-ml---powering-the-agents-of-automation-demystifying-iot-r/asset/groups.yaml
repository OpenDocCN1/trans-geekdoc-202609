    Actually, it is a specially designed multi propeller system inside a drone that
    makes this device highly independent and also assists in reduction of failures.
    One important thing to note about this multi propeller system is that even if
    any motor inside this device stops working, it will keep on flying as it gets
    support from propellers that are working in the group. Drones that possess a large
    number of motors inside are able to gain more control over their elevation and
    hence can carry more loads during flight. These propellers get their power from
    a dedicated source and most of these devices contain removable batteries so that
    they can stay in the air for a long time. The flight time can be extended with
    use of powerful batteries in design.


    实际上，无人机内部的特殊多螺旋桨系统使该设备高度独立，同时也有助于减少故障。关于这个多螺旋桨系统需要注意的一点是，即使该设备内部的任何一个电机停止工作，它仍会继续飞行，因为它得到了组内正在工作的螺旋桨的支持。内部电机数量较多的无人机能够更好地控制其高度，从而在飞行中携带更多负载。这些螺旋桨从专用电源获取动力，大多数设备都包含可拆卸电池，以便它们能在空中停留很长时间。飞行时间可以通过设计中使用更强大的电池来延长。


