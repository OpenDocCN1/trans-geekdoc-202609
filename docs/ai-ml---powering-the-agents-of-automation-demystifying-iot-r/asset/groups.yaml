    一些无人机配备了直升机式的起落架，有助于无人机降落。在降落时需要较高离地间隙的无人机需要改装起落架，以便安全着陆。此外，运送包裹或物品的配送无人机可能需要宽敞的起落架，因为在触地时需要空间来容纳物品。然而，并非所有无人机都需要起落架。一些较小的无人机在没有起落架的情况下也能完美工作，并在触地时安全地腹部着陆。大多数飞行时间更长、覆盖距离更远的无人机都配备固定起落架。在某些情况下，起落架可能会阻碍对环境的
    360 度视野，尤其对于摄像无人机而言。起落架还能提高无人机的安全性。


    ## 5. 电子调速器：

    电子调速器（ESC）是一种电路，其主要职责是在飞行过程中监控并调节无人机的速度。它还负责无人机的飞行方向和制动变化。ESC 还负责将直流电池电能转换为交流电以驱动无刷电机。现代无人机完全依赖
    ESC 来满足所有飞行需求和性能。越来越多的公司推出了性能更好的 ESC，可降低功耗并提高性能，其中最新的是大疆 Inspire 1 ESC。ESC 主要位于无人机主框架内部。你不太需要对
    ESC 进行任何操作或更改，但在需要更改时，可以在无人机主框架内部找到它。


    ## 6. 飞行控制器：

    飞行控制器基本上是无人机的主板。它负责执行飞行员发出的所有指令。它解释来自接收器、GPS 模块、电池监测器和机载传感器的输入。飞行控制器还负责通过 ESC
    调节电机转速以及无人机的转向。诸如触发相机、控制自动驾驶模式和其他自主功能等指令均由飞行控制器控制。用户很可能不需要对飞行控制器进行任何改动，因为这通常会影响无人机的性能。


    ## 7. 接收器：

    接收器是负责接收通过控制器发送到无人机的无线电信号的单元。控制无人机所需的最小通道数通常为四个。然而，建议提供五个通道。市场上有非常多不同类型的接收器，所有这些都可以在制作无人机时使用。


    ## 8. 发射器：

    发射器是负责从控制器向无人机传输无线电信号以发出飞行指令和方向的单元。与接收器一样，发射器对无人机需要四个通道，但通常建议为五个。市场上有不同类型的接收器供无人机制造商选择。接收器和发射器必须使用单一无线电信号，以便在飞行期间与无人机通信。每个无线电信号都有一个标准代码，有助于将其与其他空中无线电信号区分开。


    ## 9. GPS 模块：

    GPS 模块负责提供无人机的经度、纬度和海拔点。它是无人机非常重要的组件。如果没有 GPS 模块，无人机不会像今天这样重要。这些模块帮助无人机导航更长的距离并捕捉陆地上特定位置的细节。GPS
    模块即使在不使用 FPV 导航的情况下也能帮助无人机安全返回“家”。在大多数现代无人机中，如果无人机与控制器失去连接，GPS 模块有助于将其安全返回控制器。这有助于保持无人机安全。


    ## 10. 电池：

    电池是使无人机所有动作和反应成为可能的部件。没有电池，无人机将没有动力，因此无法飞行。不同无人机有不同的电池需求。由于功耗有限，较小的无人机可能需要较小的电池。另一方面，更大的无人机可能需要更大容量的电池，以便为无人机的所有功能供电。无人机上有一个电池监测器，可帮助向飞行员提供电池信息以监控电池性能。


    ## 11. 相机：

    一些无人机内置相机，而另一些则配备可拆卸相机。相机有助于从上方拍摄照片和图像，这构成了无人机的重要用途。市场上有不同类型和质量的相机可供选择。


    这些基本上是无人机的核心组件。如果你需要制作一架无人机，你需要拥有所有这些才能使其正常工作。


