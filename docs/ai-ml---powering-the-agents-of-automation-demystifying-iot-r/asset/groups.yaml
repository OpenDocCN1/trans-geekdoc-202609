    available English, Portuguese, French, German, Italian, Spanish, Chinese, and
    Japanese language editions, depending on the software platform and region in which
    it is used.


    **2014 AMAZON ALEXA:** This was launched in November 2014. Alexa is a virtual
    assistant from Amazon. It is capable of voice interaction, music playback, making
    to do lists, setting alarms, streaming podcasts, playing audio books, and providing
    weather, traffic, sports, and other real-time information such as news. Alexa
    can also control several smart devices using itself as a home automation system.
    Users are able to extend the Alexa capabilities by installing ‘skills’ (additional
    functionality developed by third-party vendors).


    **2016 GOOGLE ASSISTANT:** This was launched in May 2016. Google Assistant is
