    In permissionless public Blockchain platforms, anyone can conduct transactions
    and view the transactions and anyone can download the mining program to be a part
    of the decision making process.


    The Ethereum Virtual Machine unlike Bitcoin core is known as World Computer and
    is capable of processing a wide range of applications. It not only stores the
    transactions but also updates values of each address in the revised state.


    Ethereum has made it possible for any type of business to be transacted in peer-to-peer
    manner to be in a sustainable manner through the concept of Smart contracts and
    decentralized autonomous where decisions are taken with little human intervention.


