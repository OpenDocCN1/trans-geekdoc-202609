    ### What is IOT?


    The first Internet-connected appliance was a modified Coke vending machine at
    Carnegie Mellon University. The concept of ‘Ubiquitous computing’ was extensively
    discussed in a paper by Mark Weiser in 1991.


    First proposed by Kevin Ashton of Procter & Gamble in 1999, the term IoT or Internet
    of Things, became popular at Auto ID Center, MIT. It was originally envisaged
    that, RFID will be the essential component of IOT connectivity.


    As per Wikipedia, The Internet of things (IoT) is the extension of Internet connectivity
    into physical devices and everyday objects. Embedded with electronics, Internet
    connectivity, and other forms of hardware (such as sensors), these devices can
    communicate and interact with others over the Internet, and they can be remotely
    monitored and controlled.


    The definition of the Internet of things has evolved due to convergence of multiple
    technologies, real-time analytics, machine learning, commodity sensors, and embedded
    systems.[5] Traditional fields of embedded systems, wireless sensor networks,
    control systems, automation (including home and building automation), and others
    all contribute to enabling the Internet of things. In the consumer market, IoT
    technology is most synonymous with products pertaining to the concept of the “smart
    home”, covering devices and appliances (such as lighting fixtures, thermostats,
    home security systems and cameras, and other home appliances) that support one
    or more common ecosystems, and can be controlled via devices associated with that
    ecosystem, such as smartphones and smart speakers.


    Let’s examine the major components of IoT:


    ![](img/3531370aa21067bbdc45128741d34edb_47_0.png)


    Figure 4.2 Major components of IoT


    ### 1. SENSORS AND SMART DEVICES


    According to IEEE, a sensor is an electronic device that produces electrical,
    optical, or digital data derived from a physical condition or event. Smart devices
    are devices with one or more sensors that can bundle together to do more than
    just sense things. E.g. Smart phones have multiple sensors such as GPS, accelerometer,
    and camera.


    These sensors or smart devices are used to pick and collect data from the environment
    which is the most rudimentary step in IoT implementation.


    ### 2. NETWORKS


    Networks are the components which enable connectivity in the IoT system. The second
    step of the implementation is to transmit the signals collected by the sensors
    through one of the various mediums of communications such as cellular networks,
    Wi-Fi, Bluetooth, Low Power Wi-Fi, Wi-Max, regular Ethernet, etc. to all the components
    of the network. Low power and low cost wireless transmitting devices are preferred
    due to their long battery life and efficiency.


    Since Internet of things creates a huge amount of data from devices, the cloud
    infrastructure is leveraged upon to process, manage and store data in real time.
    Cloud system integrates billions of devices, sensors, gateways, protocols, data
    storage and provides predictive analytics, and that brings us to the next component
    – Data processing and analytics.


    ### 3. ANALYTICS


    The third step in IoT implementation is extracting insights from data for analysis.
    The analysis can range from something very simple, such as checking if the temperature
    reading on devices such as AC or heaters is within an acceptable range to something
    complex such as identifying objects using computer vision in videos. Information
    is very significant in any business model and predictive analysis ensures success
    in concerned area of business line.


    ### 4. APPLICATIONS AND USER INTERFACE


    Applications refer to the various activities performed using the IoT networks
    and they are activated through a user interface. The application layer is a user-centric
    layer which executes various tasks for the users. There exist diverse IoT applications,
    which include smart transportation, smart home, personal care, healthcare, etc.


    Consider a scenario in which the analysis from the previous step has shown that
    there is an intruder in the house. So, what next? This information has to be made
    available to the user in some way by triggering alarms or through notifications
    via phone, text or email.


    Also, an interface may be required to enable users to actively monitor the status
    of their IoT system. Ideally, the user interface is well designed to support minimum
    effort for users and encourage more interactions.

