    # CHAPTER 2


    # Disruptive Models

    Led By Digitization


    # Introduction:


    Home automation, factory automation, AI and ML led analytics are making deep rooted
    and disruptive impact on various aspects of our lives.


    We now know that drones can fly, robots can jump, and bots can listen, talk, think,
    crawl, attack and beat the world’s best in thinking games. Guess what would happen
    if all this combines into one unit or a body!


    This is the power of Artificial Intelligence powered with the boosting characteristics
    of Machine learning and Deep learning! 2019 in many ways is seeing the convergence
    of a number of advancements in the adoption of cutting-edge technologies. It is
