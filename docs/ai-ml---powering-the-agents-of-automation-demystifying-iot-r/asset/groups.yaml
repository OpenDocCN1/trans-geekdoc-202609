    Fig 5.1


    Robots are of the following types


    - Wheeled

    - Legged

    - Climbing

    - Flying or drones


    Mobile robots that can move around like the automated guided vehicle or automatic
    guided vehicle (AGV) follows markers or wires in the floor or uses vision or lasers.


    These robots with manipulator arms are used in a variety of military, industrial
    and consumer applications. Domestic robots used for cleaning and maintenance are
    becoming common in developed countries like USA and Japan today.


    Industrial robots usually consist of a jointed arm (multi-linked manipulator)
    and an end effector that is attached to a fixed surface. The International Organization
    for Standardization defines a manipulating industrial robot in ISO 8373 as ‘an
    automatically controlled, reprogrammable, multipurpose, manipulator programmable
    in three or more axes, which may be either fixed in place or mobile for use in
    industrial automation applications’.


    Soft robots use soft computing approaches (e.g., fuzzy logic, neural networks).
    There are other types of robots like Mimicking robots (robots that learn by mimicking),
    Softbots (software agents that can communicate over networks) and Nanobots which
    wander in an environment to investigate or make changes.


    The industries where the robots can be extensively used are summarized below:


    - **MANUFACTURING:** Factories use robots extensively for a variety of purposes
    to assist the workers and for automating repetitive and manually difficult jobs
    and as cobots to assist workers in complicated tasks.

    - **3D PRINTING:** Robotic arms have proven their ability in printing buildings
    at a rapid pace using the additive manufacturing technology.

    - **LOGISTICS AND SUPPLY CHAIN:** Robots are extensively used in material handling
    in warehouses and drones are now being used for delivering consignments to customers
    of big supermarkets and e-commerce companies.

    - **SECURITY AND SURVEILLANCE:** Robots are used for patrolling and surveillance
    in the form of drones and in assisting military to maintain law and order and
    target military hideouts. Robots also can assist in defusing bombs.

    - **FOOD AND AGRICULTURE:** Robots are used to assist farmers in farming and help
    pick up fruits and vegetables during harvest time to reduce pressure on manpower
    intensive jobs.

    - **HEALTHCARE:** Robots are experts at undertaking high precision surgeries using
    robotic arms with terrific accuracy in a dependable manner to reduce mishaps.

    - **OIL AND GAS**: Oil companies use robots for pipe cleaning and drones for aerial
    surveys for supervising installations for any untoward incidents and thefts.


    Modular robots with high degree of freedom with the ability to do a single task
    or also combine forces with other modules to undertake many more tasks are currently
    being used in hybrid transportation, industrial automation, duct cleaning and
    handling. Collaborative robots or *cobots* are robots that can safely and effectively
    interact with human workers while performing simple industrial tasks.


    ## THE ARCHITECTURE OF AN OBJECT RECOGNIZING A ROBOT:


    Traditionally, the robot is modeled with a CPU running a central process that
    is responsible for planning and other processors to control motions and interpret
    sensor values, passing the interpreted results back to the central processor.
    A central reasoning mechanism with a pre-specified representation must be implemented.


    Advanced robots that are powered by complex algorithms and very high processing
    powered CPUs are now packaged in a human-like form and functionality. The most
    famous humanoid robot, Sophia, has been found to be able to communicate with fellow
    humans in such a way that it is almost impossible to differentiate her from the
    fellow human. http://www.robots-and-androids.com/build-a-robot.html Building a
    robot involves electronics, computer programming, mechanics, and fabrication.


    ## THE FOLLOWING ARE THE IMPORTANT STEPS AND CONSIDERATIONS FOR BUILDING A GOOD
    ROBOT:


    Building a robot for a given application and requirement follows the standard
    steps like any other hardware and software integrated application with a layer
    of communication built in. The steps can be broadly defined as follows:


    - 1. Identify the problem to be solved and the goals aimed to be met and also
    establish a market opportunity or an internal buy-in from the concerned department
    and the top management.

    - 2. Collect, identify and analyze options with respect to the budget, time and
    resources available.

    - 3. Build a prototype by gathering all the required components.

    - 4. Identify the communication system for remote management and integrate the
    same into the hardware.

    - 5. Establish the proof of concept and once it is achieved and demonstrated,
    build a small batch quantity to establish the relation between the stated objectives
    and achieved goals. Fine tune and make it perfect for a larger batch size production.

    - 6. Test the robot against all the stated goals and ensure that all bugs are
    taken care before releasing the final product for large scale production. At this
    stage, you can also consider showcasing it to potential investors who can enable
    a quick ramp up.


    ## PLANNING THE PROJECT:


    - It is very important for the project plan to be well laid out in an objective
    manner.

    - The plan should outline the various expectations and goals of the robot being
    built.

    - Depending on the various tasks like talking, moving, responding to a voice or
    a sound, moving around on a smooth surface or an obstacle ridden path, the drawings
    of the robot should be laid out and parts need to be chosen with great attention
    to detail.

    - The tools required and the various electronic, hardware and software products
    and applications should be identified, budgeted for and procured.


    ## PROCURING THE COMPONENTS AND ASSEMBLIES:


    While it is a great idea to build from scratch if you are capable of or having
    a team that can do it, it is always better and less time consuming to deploy as
    many parts as possible in the form of readymade assemblies. This can save enormous
    amount of time and budget as you can avoid a lot of testing and planning that
    goes with it. Also, assemblers offer a lower cost of products due to economies
    of large scale.


    ## ROBOT MICROCONTROLLERS


    Microcontrollers are the brains of robots which are programmed in C or basic language.
    They are used to control smaller robots that require energy efficient management.
    The bigger and more complex robots are controlled through PCs, tablets or laptops.
    Readymade microcontrollers can be explored for a quick and modular solution. Arduino
    C is the most popular language to program the microcontrollers is very much similar
    to C and comes with a lot of readymade open source programs that can be easily
    modified to our requirements.


    ## ROBOT SENSORS


    Sensors enable robots to feel the environment like the five senses in humans.
    They enable the robot to hear, see, smell, feel and taste, thus sizing the environment
    around them to respond.


    Different sensors depending on the need are used in the body, allowing the robot
    system to understand the question, feel the pressure, know the temperature or
    find the obstacle, identify the person talking and the direction of the sound,
    etc. This results in an appropriate response from the robot in the form of a reply
    or an evasive action or modifying its speed of movement and gesticulation, etc.
    A complete list of different types of sensors and other components of robot can
