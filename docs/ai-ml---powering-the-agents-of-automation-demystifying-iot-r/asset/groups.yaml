    等，并在基础层提供标准化选项。


    ## 构建聊天机器人的重要步骤如下：


    - 1. 应明确理解 Chatbot 的目标和用例。应明确概述 Chatbot 预期面向的客户、员工或服务提供商的客户的目标。应确定并详细记录机器人的功能。应明确概述组织对项目的期望。


    应向开发团队明确传达对机器人范围定义和排除项的期望。


    在众所周知的使用 Chatbot 的各个行业中，如食品、航空公司、银行、零售、旅行、体育、酒店、咨询、音乐、房地产等，寻找已树立趋势且可效仿的基准将很有趣。


    典型应用包括客户服务、个人助理、电子商务、美食礼宾、新闻、内容、法律咨询、教学、幽默、投诉处理、旅行、财务建议、游戏、酒店、招聘等。


    ![](img/3531370aa21067bbdc45128741d34edb_150_0.png)


    图 8.3：IBM Watson 聊天机器人平台

    https://www.ibm.com/blogs/watson/2017/03/bot-yourself/


    - 2. 应确定 Chatbot 预期进行对话的平台和据点。Chatbot 的一些热门平台包括网站、Facebook、Google、Microsoft、Apple、Slack、Telegram、Twitter、Alexa、Skype、Hipchat、Whatsapp、Wechat、Viber
    等平台。


    - 3. 应在评估后根据适用性选择开发 Chatbot 的框架，如 IBM Watson、Google Dialogflow、Azure Bot 服务或其他付费和定制版本。


    ## Dialogflow SDK


    Dialogflow 的 SDK 和底层 API 允许您根据对话输入在自己的系统上采取行动，将对话界面嵌入到您的应用程序或网站中，并动态更改代理的行为。Dialogflow
    API 以三个主要用例为中心：


    ![](img/3531370aa21067bbdc45128741d34edb_151_0.png)


    - Fulfillment：根据对话输入在自己的系统上采取行动。Fulfillment 将您的 Dialogflow 代理连接到您的服务、API 和/或数据库

    - Detect Intent API：将使用 Dialogflow 构建的对话界面嵌入到您的应用程序或网站中

    - Agent API：通过编辑代理的意图、实体和上下文来动态更改代理的行为。有关 Dialogflow REST API 的信息，请参阅参考文档。


    *图 8.4：Google Dialogflow 聊天机器人开发和部署框架*


    ### a) 提供自然且丰富的对话体验


    - 内置的自然语言处理（NLP）功能为 Chatbot 赋予了人工智能（AI），从而使其能够处理自然语言（通过聊天或语音接收）并以自然的方式继续对话。正是这种认知能力将
    AI Chatbot 与按编码的简单预定义规则运行的普通 Chatbot 区分开来。

    - Chatbot 开发人员将这些自然语言处理功能集成到应用程序、服务和设备中。输出数据可以根据需要以语音或聊天格式提供。


    ### b) 使用机器学习理解用户在说什么


    - 机器学习使 Dialogflow 足够智能，能够预测自然输入语言中表达的隐藏意图。Dialogflow Chatbot 可以将用户的查询与后端服务器可用的数据库进行映射。映射机制称为
    Intent。有趣的是，它通过应用多种排列组合来实现。这是显著的特性，因为用户以多种方式提出相同的问题，因此 Chatbot 有责任正确理解并为其服务。


    ### c) 与多种平台兼容


    - 使用 Dialogflow 创建的 Chatbot 目前可部署在多达 16 个平台上。因此，通过 Google Chatbot 开发，企业可以用最少的努力瞄准广泛的受众。一键集成简化了
    Chatbot 开发人员的工作。


    ### d) 提供跨设备支持


    - Dialogflow 有助于创建设备无关的 Chatbot。因此，它可以与可穿戴设备、手机、汽车、扬声器和其他智能设备上的用户互动。因此，企业可以随时随地与潜在客户或客户建立联系。


    ### e) 帮助 Chatbot 说 14+ 种语言


    - Dialogflow 支持 14+ 种语言，包括巴西葡萄牙语、葡萄牙语、中文（粤语/简体/繁体）、英语（澳大利亚/加拿大/大不列颠/印度、美国本地）、荷兰语、法语（加拿大本地/法国本地）、德语、意大利语、日语、韩语、葡萄牙语、俄语、西班牙语和乌克兰语。

    - 因此，利用 Google Chatbot 平台，企业可以超越地理障碍，在地球上的任何地方开展业务。


    ### f) 利用内置分析工具帮助跟踪 Chatbot 的性能


    - 类似于移动应用分析，技术所有者可以跟踪其 Chatbot 的性能。集成的分析工具可以读取会话或参与度详情，包括使用模式、延迟问题以及高性能和低性能的意图。这些智能可作为企业进一步改进其
    Chatbot 的指导原则。


    ### Google Chatbot 平台支持的服务


    - 使用 Dialogflow 创建的 Chatbot 可以执行以下提到的多种任务：

    - 笑话、活动搜索、外出就餐、本地服务、提醒、新垂直领域（咖啡店和旅游）


    ## 亚马逊聊天机器人平台


    ![](img/3531370aa21067bbdc45128741d34edb_153_0.png)


    图 8.5：亚马逊聊天机器人管理框架。鸣谢 https://aws.amazon.com/lex/


    Amazon Lex 是一项服务，用于在任何应用程序中使用语音和文本构建对话界面。Amazon Lex 提供了自动语音识别（ASR）将语音转换为文本的先进深度学习功能，以及自然语言理解（NLU）来识别文本的意图，以便您构建具有高度吸引用户体验和逼真对话交互的应用程序。有了
    Amazon Lex，驱动 Amazon Alexa 的相同深度学习技术现在可供任何开发人员使用，使您能够快速轻松地构建复杂的自然语言对话机器人（聊天机器人）。


    语音识别和自然语言理解是计算机科学中最具挑战性的问题之一，需要在海量数据和基础设施上训练复杂的深度学习算法。Amazon Lex 通过将 Amazon Alexa
    的强大功能带给所有开发人员，从而使这些深度学习技术民主化。利用这些技术，Amazon Lex 使您能够通过对话界面实现新的产品类别。


    作为一项完全托管的服务，Amazon Lex 可自动扩展，因此您无需担心管理基础设施。使用 Amazon Lex，您只需为所使用的服务付费。没有前期承诺或最低费用。


    ## Azure 机器人开发框架


    ![](img/3531370aa21067bbdc45128741d34edb_154_0.png)


    图 8.6：Microsoft Azure 聊天机器人开发框架


    Microsoft Azure 机器人平台上的 Bot 服务就像向互联网服务发出请求一样简单，让它为您做某事、翻译文本、进行机器人对话或告诉您图像中有什么。


    以下列出了在 Microsoft 平台上构建的一些机器人的示例：


    - Microsoft 的 **CaptionBot**：它可以通过建议标题来解释照片。您可以通过上传自己的照片或链接网络上的照片来尝试此工具。

