    link the analytical insights from the gist of the conversations to the customer
    details enabling the marketers to offer customized solutions and detect trends.


    The scalability offered by chatbots with negligible increase in overheads is phenomenal.
    With the different types of features discussed earlier, chatbots offer great savings
    and increased returns on technology investments.


    By deflecting operations through self-service capable menus, the operational costs
    of organizations can be substantially reduced. We are used to a lot of such applications
    in our day-to-day life when we query by phone or through web, our bank or an e-commerce
    company or a utility as well. Using human interventions to high value and difficult
    interactions, the ROI on human capital can be substantially increased.


    In several situations, customers are known to prefer impersonal interactions and
    prefer conversations with automated menus. For example, in the areas of psychotherapy
    or counter medicines and products (for example women’s diapers and undergarments,
    aphrodisiacs and sexual health products, etc.), customers do not feel comfortable
    to interact with other human beings. If such companies are also able to assure
    and demonstrate impersonal and ephemeral nature of communication, the customer
    acceptance and sales stand to increase substantially. China’s Woebot is a famous
    example of a psychotherapist bot that is extremely popular. This not only establishes
    customer loyalty but also increases the customers’ life time value to the brands.


    ## MAJOR APPLICATIONS OF THE CHATBOT:


    - Grand View Research projects that the global Chatbot market will reach $1.25
    billion by 2025.

    - 80 percent of business decision-maker respondents to a 2016 survey by Oracle
    said that they already used Chatbots or plan to use them by 2020.

    - Voice assistant bots are cheap, able to work 24/7, and never lose their temper.

    - Virtual assistants such as Siri, Alexa, Cortana, and Google Assistant are very
    much accepted and used.

    - Social bots promote issues, products, or candidates.

    - Entertainment bots, the Hello Barbie doll, employs a Chatbot created by a company
    named ToyTalk to respond to her child owner.

    - Legal Chatbots can help you file appeals against traffic violations.

    - Bots can serve as course assistants to grade essays and elicit student feedback.

    - Mental health Chatbot Woebot acts as a talk therapist.

    - Marketing Chatbots offer customer service, after sales support and provide customized
    responses.


    ## HISTORY OF THE CHATBOT:


    ### 1966-ELIZA

    This chatbot is named after Eliza Doolittle as a fictional character and created
    by MIT’s Joseph Weizenbaum. This bot with the psychotherapist functionality was
    the first application to pass the Turing test and pass off as a human in its interactions.


    ### 1972-PARRY

    This is a more sophisticated rendering of a chatbot than ELIZA. This ‘schizophrenic’
    bot was created by a psychotherapist, Kenneth Colby.


    ### 1981-JABBERWACKY

    This was meant to be the first bot application powered by Artificial Intelligence
    created by Rollo Carpenter of Great Britain.


    ### 1991-DR. SAITSO

    Dr. Saitso is an award winning Turing program that mimicked a psychotherapist
    by asking the question ‘Why do you feel it that way?’ through AI speech synthesis.


    ### 1995-ALICE

    Artificial Linguistic Corporate Entity (ALICE) inspired the 2013 science fiction
    movie ‘HER’ in which a man falls in love with a Chatbot.


    ### 2001-SMARTCHILD

    This was first launched on AOL Messenger. SMARTCHILD became a sought after Chatbot
    on SMS and Messenger platforms.


    ### 2006 IBM WATSON

    This was first launched to participate in the Jeopardy game show. IBM Watson became
    an iconic AI/ML platform and is now used extensively to assist doctors and medical
    practitioners in hospitals for disease diagnostics and prescriptions.


    ### 2010 APPLE SIRI

    Apple SIRI is the first voice assistant that converses with the users by replying
    and assisting with a number of tasks. This was later followed by many personal
    assistant bots; prominent being Google Assistant, Amazon Alexa and Microsoft Cortana
    (April 2014).


    ### 2014 MICROSOFT CORTANA

    This was launched in April 2014. Cortana can set reminders, recognize natural
    voice without the requirement for keyboard input and answer questions using information
    from the Bing search engine. Cortana is currently available in English, Portuguese,
    French, German, Italian, Spanish, Chinese, and Japanese language editions, depending
    on the software platform and region in which it is used.


    ### 2014 AMAZON ALEXA

    This was launched in November 2014. Alexa is a virtual assistant from Amazon.
    It is capable of voice interaction, music playback, making to-do lists, setting
    alarms, streaming podcasts, playing audio books, and providing weather, traffic,
    sports, and other real-time information such as news. Alexa can also control several
    smart devices using itself as a home automation system. Users are able to extend
    the Alexa capabilities by installing ‘skills’ (additional functionality developed
    by third-party vendors).


    ### 2016 GOOGLE ASSISTANT

    This was launched in May 2016. Google Assistant is an artificial intelligence-powered
    virtual assistant developed by Google that is primarily available on mobile and
    smart home devices. Unlike the company’s previous virtual assistant, Google Now,
    Google Assistant can engage in two-way conversations.


    ### 2016 FACEBOOK MESSENGER BOTS

    In 2016, Facebook allowed developers to place bots on its platform and is now
    the biggest platform for Chatbots and hosts more than one lakh bots and hosts
    more than a billion users. Platforms like Manychat and Chatfuel make it very easy
    to create and launch Chatbots that can be integrated into the Facebook page accounts
    of the users.

