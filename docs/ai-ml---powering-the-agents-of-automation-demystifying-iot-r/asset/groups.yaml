    (https://cloud.oracle.com/opc/paas/datasheets/Oracle+MCE+Bots+Datasheet.pdf)


    ## FOUR SIMPLE STEPS TO BOT YOURSELF


    ### Prerequisites:


    - Create a Bluemix account

    - Create a conversation instance


    ### STEP 1: DEFINE INTENTS


    **Intents** are the objectives of every bot. If a chatbot helps users handle expenses,
    the intents would be things like view x (amount due), pay y (bill), and cancel
    z (account).


    A chatbot that answers questions about you has the broad objective of providing
    information about a human being. Therefore, it helps you to think about this information
    as it pertains to where, what, and when. In other words, the intents would answer
    ‘where did you x’, ‘what is your y’ and ‘when did you z’. The actual intents would
    simply be where, what, and when (or location, general info, and time).


    ### STEP 2: DEFINE ENTITIES


    When we were building Adam the Chatbot, understanding the difference between intents
    and entities was our biggest challenge.


    **The best way to think about entities is that they are the SUBJECTS of intents.**


    So, in ‘where did you go to college’, the intent would be ‘where’ and the entity
    would be ‘college’. This allows single entities to apply to multiple intents.
    In this example, ‘college’ could apply to both the ‘where’ and ‘when’ intents.


    ### STEP 3: CREATING YOUR DIALOG


    You’ve got intents, utterances, entities, and entity values and synonyms. Now
    it’s time to build exactly how your bot is going to interact with users. In the
    Watson Conversation API, this part is your dialog.


    Setting up your dialog flow is all about logic. The dialog in the Conversation
    API is set up like a logic tree with many ‘if then’ conditions. Each intent begins
    a node on the left and the logic flows from the top down through your intents.
    If certain intent is triggered by an utterance, its node is opened and the logic
    continues to the entities.


    The logic within each node (i.e. through entities) also flows from top to bottom.
    A specific combination of #Intent and @Entity:value triggers a certain response
    to a question. This combination is referred to as the response condition. So,
    for ‘what was your major’, the ‘what’ intent would be triggered and then the response
    associated with the response condition #what and @college:major would be returned.


    ### STEP 4: TRAINING AND IMPROVING


