    # Global Market Overview - Global drones market is estimated to reach USD36.9
    billion in 2022 from USD6.8 billion in 2015, growing at a CAGR of 27.3% driven
    by growing use-cases of drones


    +   - Drones market is largely dominated by military drones, but commercial and
    civilian drones are gaining momentum due to increased use.

    +   - In 2015, market for military drones accounted for 65% of total drones market
    with rest 35% shared by camera drones and other types of drones.

    +   - Drones market continues to mature with refined models, more intuitive software
    and increased usability. In the last few years, several new drone start-ups have
    entered the market due to surging consumer adoption.

    +   - Companies strive to produce commercial drones that are more energy efficient,
    durable and have a significantly lower cost of operation than a manned aircraft.


    ![](img/3531370aa21067bbdc45128741d34edb_130_0.png)


    # Indian drone market is anticipated to reach USD421 million by 2021


    +   - Military and governmental applications account for majority of the share
    in India''s drone market, as commercial applications remain low due to a ban by
    Directorate General of Civil Aviation (DGCA).

    +   - Small drones are expected to grow the market with its deployment for recreational
    purposes such as videography and racing.

    +   - Applications in disaster management and surveillance by governmental agencies
    and companies are gaining prominence in the market.

    +   - Drones could also become important tools in other applications such as surveying
    farmlands, conserving wildlife and critical infrastructure monitoring.


    # India has the potential to become a major market for small and medium drones
    manufacturing


    +   - Given India''s growing electronics manufacturing capabilities and software
    prowess, there is considerable potential for innovation in making small and medium
    drones and development of software for improving data analytical capabilities
    of drones.

    +   - Further, there exists strong potential for Indian companies to avail the
    benefits of the ''Make in India'' program and set-up joint ventures for making
    drones.

    +   - Despite uncertain regulatory environment, several domestic start-ups are
    producing drones for various commercial applications ranging from disaster relief,
    security and surveillance, and aerial photography.

    +   - There are also a number of private Indian companies working on both the
    hardware and the software of drones, selling exclusively to the government.'
