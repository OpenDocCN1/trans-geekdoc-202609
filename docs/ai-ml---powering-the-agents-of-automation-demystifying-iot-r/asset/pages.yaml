    # 3D PRINTING


    3D printing for manufacturing comes with a number of exciting and unique advantages
    when compared to traditional manufacturing. Using 3D printing enables manufacturers
    to produce parts and composites from different materials with unique mechanical
    and physical properties in one single process. Advancements in the 3D printing
    technology, equipment and materials have lowered the costs, making it a more feasible
    option for the manufacturing industry.


    We can see the applications of 3D printing across various industries, including
    garment manufacturing. For instance, Ministry of Supply, a clothing startup founded
    by MIT grads uses 3D printing to make better and more sustainable clothes. Merging
    3D printing with IoT data collection can drive lean manufacturing and provide
    a competitive edge to the manufacturers.


    # DRONES


    A drone is a flying robot that can be remotely controlled or fly autonomously
    based on software-programmed flight plans. It’s also known as ‘unmanned aerial
    vehicle’ (UAV). In manufacturing, drones are incredibly useful in inventory control
    and warehouse management.


    Companies such as General Motors (GM) are using drones to inspect sand delivery
    pipes inside the company’s casting plants.


    Dan Grieshaber, the global director of manufacturing engineering integration at
    GM said that towering high above the factory floor, pipe inspection is inherently
    dangerous. Instead, a drone flies around inside a cage, tracks the pipe, and can
    spot potential problem areas like cracks. We send the drone in, have it capture
    the environment, identify what work needs to get done, and then we’ll send in
    an operator with a specific job to do. This'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'significantly cuts down on the amount of time a human must spend in that and
    other dangerous environments. The person is only working where they need to work.


    # EXOSKELETONS


    Exoskeletons are essentially wearable robots that find prominent applications
    in repetitive operations in manufacturing. Typically, in car manufacturing, a
    worker might need to perform a task within 45 seconds before the next car comes
    along. An exoskeleton can actually support the human body and distribute the load.
    It helps the worker stay safer and also helps perform the job in an easier way.


    The robotic glove technology developed by General Motors (GM) along with NASA
    would also be an example of Exoskeleton. At GM, workers use the RoboGlove to add
    strength and grip to the human hand. As you grip, the glove aids you with more
    assistance. It greatly reduces fatigue and protects the workers from injuries.


    As per the McKinsey report, by 2025 Internet of Things (IoT) applications will
    have an economic impact of 900 billion USD to 2.3 trillion USD in manufacturing
    alone. This estimate is based on potential savings on 2.5 to 5 percent in operating
    costs, integration of IoT in the power grid and its applications in public sector
    services like waste, heating and water systems. However, with all the exciting
    possibilities that come with connecting our things to the internet, we also need
    to make sure that security is built into the design of these systems right from
    the beginning.


    There is no single smart factory configuration; there is likely no single path
    to successfully achieve a smart factory solution. The smart factory journey requires
    more than just a set of connected assets. People are expected to still be the
    key to operations. As a lot of roles can be replaced by robots, automation and
    AI, there will need to be realignment of roles and emergence of new unfamiliar
    roles. Companies need the right talent to drive the journey and the right processes
    in place. Managing changes to people and processes will require an agile, adaptive
    change management plan.'
