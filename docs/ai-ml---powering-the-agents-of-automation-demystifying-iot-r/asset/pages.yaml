  md: '# C. VIDEO (CCTV CAMERAS TO COLLECT VISUAL STATUS TO BE PROCESSED WITH MACHINE
    VISION):


    Autonomous cars possess a number of CCTV cameras both inside and outside the vehicle.
    The smart internal cameras offer passenger safety and smart exterior cameras are
    focused on vehicle’s safety and security.


    The images from the cameras are continuously analyzed using advanced AI and ML
    techniques and machine vision to identify the contents, analyze and feed the information
    to the car’s controller for an appropriate decision.


    While images from the front cameras help the car to adjust its speed and also
    follow the rules of the road, the rear cameras enable the car prevent back over
    collisions, warn vehicles unduly nearby through appropriate sounds and speed adjustments
    and in parking perfectly.


    # D. ULTRASOUND (TO DETECT THE DISTANCES AT SLOW SPEED AT THE TIME OF PARKING):


    Ultrasonic sensors are used during parking to assess and warn the vehicle about
    potential collision. They measure the precise distance of the vehicle from an
    object with the help of sound waves emitted to hit an object and received back.
    They are used along with LIDARs and RADARs by complementing them for low speed
    applications in autonomous vehicles.


    # 3. MULTI DOMAIN CONTROLLERs:


    Multi-domain controllers receive inputs from the various systems from the autonomous
    car’s vision system like the Radar, Lidar, camera and navigation systems to confirm
    appropriate decisions to the driving system comprising steering, acceleration,
    braking, and parking management systems.


    Autonomous and self-driving vehicles have a number of special features and components
    apart from a lot of usage of Machine learning-enabled Artificial Intelligence
    to perform their functions. If one has to put across this in simple words, it
    would be how a self-driven car works. One would'
