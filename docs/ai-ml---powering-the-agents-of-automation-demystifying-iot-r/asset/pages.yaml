    I understand sir, but you’ll need to renew your passport. It expired 5 weeks ago.


    # CHANGING FACE OF THE NEW WORKFORCE: WELCOME TO ROBOTS, CHATBOTS, IOT DEVICES,
    CONNECTED CARS, RPA and FLYING DRONES


    I had 1,000 employees last year. Next year, I am targeting 800 humans, 25 robots,
    10 chatbots, and 1,000 connected things. Could well be the outlook of a ‘Human
    Resource Head’ in a thriving company of the future!


    It is not just the organizations. The ‘Bot’ revolution is going to permeate every
    segment of our infrastructure. If the vision of global leaders like #Cisco has
    to be noted, connected devices are a part and parcel of every piece of our future
    landscape cutting across organizations, cities,'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'functional areas and services, which is why Cisco calls it IOE or Internet
    of Everything! Source (#Cisco PR).


    #Cisco filed US patent application 20170302663, an invention that it terms ®Blockchain-based
    #IoT [Internet of Things] Device Identity Verification and Anomaly Detection”
    that enables a #Blockchain-based system record changes to the conditions affected
    and captured by sensors (i.e., smart objects) in a network and instrumentalize
    network relationships and the data that the network generates in order to exercise
    control over those nodes is one of the many patents filed to integrate IOT devices
    into the Blockchain ecosystem. The need of the hour as we employ edge-enabled
    devices for computing to empower the once dumb IOT devices to do what they are
    supposed to do and not something dangerous!


    ![](img/3531370aa21067bbdc45128741d34edb_22_0.png)


    Fig 2.1: Automaton across factories of tomorrow


    In future, it is possible that organizations will be employing high levels of
    automation of manual and repetitive tasks across the length and breadth of their
    operations to interact with customers, employees, vendors, channel partners at
    various locations. These could be through self-servicing queries for information
    retrieved within the organizations or queries handled through external party API
    integrations.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'There could be different bots and robots such as:


    +   a) Front office bot that greets and directs the visitors to their respective
    destinations and also handles routine queries (Ex: Reception bot employed by Kerala
    state police headquarters)

    +   b) HR bots engaging with the employees to answer routine queries or conduct
    environmental surveys.

    +   c) Customer engagement bots on online outposts and for service-related queries.

    +   d) Financial and accounting management bots that are a part of the RPA ecosystem
    that conduct expense management, accounts, finance and audit-related tasks.


    RPA or Robotic Process Management that involves streamlining the workflows with
    AI and Machine learning techniques as big data processing is already making its
    presence felt in a number of areas, which are as follows:


    +   i. Invoice management

    +   ii. Partner and vendor management by verifying credentials of the new partners
    through 360 degree authentication and procurement process automation

    +   iii. Auditing and reconciliations in a speedy and secure manner to generate

    +   iv. Expenses tracking across various heads versus budgets and reporting abnormalities

    +   v. Financial reports instantaneously instead of days and months after book
    closures


    While some of them would be maintained on premise, a number of them could be maintained
    on Cloud-based platforms. To manage these different types of bots, which form
    a part of the bot-farm in the company, the organizations need to employ Robot
    controllers to manage different sub groups of bots across organizations. Planning,
