- pgno: 192
  md: '# STRUCTURE:


    +   - What is a Blockchain?

    +   - Bitcoin and Ethereum are examples of public Blockchains

    +   - Enterprise Blockchains

    +   - Features of a Blockchain

    +   - Security tools of a Blockchain

    +   - Vulnerabilities in Blockchain security

    +   - Challenges to the growth of the Blockchain ecosystem


    # OBJECTIVE:


    A Blockchain is increasingly viewed as an essential de-risking tool for those
    who access the internet for various purposes. It is important to understand the
    various features of the Blockchain and see how they can facilitate the intended
    purpose of protecting privacy of the users from being compromised while addressing
    the problems posed by the cybercriminals at the root itself, thus making it non-remunerative
    for them to invest in sophisticated applications to carry out their criminal activities
    in the cyberspace. The objective of this chapter is to understand how a Blockchain
    works and how it can protect digital systems. It is further intended to examine
    the security aspects of Blockchain systems and applications to ensure that they
    are well protected and not compromised as well.


    Most of the malware attacks are implemented by masked identities and hoodwinking
    systems to gain access through camouflaged identities.


    Blockchain-led systems use cryptographic techniques to offer several layers of
    additional security to participants and transactions.


    # WHAT IS a BLOCKCHAIN?


    A Blockchain originally came into existence on 3rd January, 2009 in the form of
    a distributed database to create, share and store units of value in the digital
    form, namely, ‘Crypto currency’ in a secure and irrefutable manner between hitherto
    unknown participants.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'Over the years, the Blockchain has transformed into a much more inclusive and
    disruptive application that enabled participants in enterprises and governments
    to conduct between each other and with public in a secured and confidential manner,
    automating intra and in most cases inter-enterprise processes to drastically improve
    productivity and crash costs.


    Cryptocurrency-based Blockchains like Bitcoin define a Blockchain as a linked
    list of blocks containing a full copy of the Bitcoin ledger giving the UTXOs (Unspent
    Transaction Output) in the form of a crypto currency unit named Bitcoin or its
    fraction (1 Bitcoin = 1 million Satoshis) of each of the address mapped in groups
    to respective wallets. Each of the addresses has a public key and a password named
    Private Key. The public key is used to check the details if the transactions and
    private keys allows the holder to spend the UTXO units and then the private key
    allows the holder to spend the UTXOs associated with the respective public key.


    The Blockchain is thus a store of and a means to transfer immense value, underlining
    the importance of keeping the password (pass phrase of wallet and the private
    key for every address) a closely guarded secret.


    ![](img/3531370aa21067bbdc45128741d34edb_193_0.png)


    Fig 11.1: Permissionless public Blockchains'
  merge: -1
  img_proc: true
