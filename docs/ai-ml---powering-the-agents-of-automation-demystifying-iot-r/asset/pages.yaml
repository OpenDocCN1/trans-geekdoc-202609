  md: '# OBJECTIVE:


    The objective of this chapter is to demystify the technology behind the autonomous
    flying objects that are now making their presence across the world. We will take
    a look at the various facets of the drones from their definition, application
    areas, hardware components that make up their body, categorization of drones and
    their advantages and disadvantages. The technological underpinnings resulting
    from the utilisation of AI and ML led technologies that impart the functionality
    of the drones are also looked at in a succinct manner. Drones are expected to
    be no more mystic flying objects for those who read this chapter, and it is further
    expected that the readers will take an active interest is procuring them and utilizing
    them for a variety of applications starting from hobbies to areas of public utility
    and welfare, while being within the purview of the local laws and regulations
    that govern such applications.


    # A BRIEF OVERVIEW Of DRONES:


    A drone’ is an unmanned aircraft that combines a number of technologies like IOT,
    Satellite, GPS, Robotics, Artificial intelligence into one compact unit. It has
    become the hottest topic with the recent advances in the commercialization efforts
    led by world leaders in this business.


    As per Wikipedia, drone is an unmanned aircraft system; remote-controlled pilot-less
    aircraft; flying thingy without people inside controlling it; The FAA (The Federal
    Aviation Administration) calls them Unmanned Aircraft Systems (UAS) and projects
    that 30,000 drones could be in the nation’s skies by 2020.


    # DRONES’ BODY COMPRISES THE FOLLOWING COMPONENTS:


    Flight controllers with GPS integration, multirotor revolving blades, battery
    storage to the last full length of the flights, gimbals for sensor payload mounts,
    IR cameras, etc. The body is made up of lightweight materials like carbon fibre,
    etc. The sensors are light weight and extremely energy efficient. The multirotor
    provides redundancy and help in managing failure of any rotors at any time.'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'Drones come in different sizes and weights ranging from 100 gm to over 1000
    kg with applications for close range micro drones to large range drones with a
    very long range.


    Drones are used for a variety of civilian and military purposes like aerial photography,
    digital archaeology environmental analysis, agricultural analysis, gas mapping,
    coastal surveys, film/media, and law enforcement and for participating in drone
    racing competitions.


    Being controlled by computers through satellites and remote sensing technology,
    drones pack tremendous precision with economic feasibility and efficiency.


    While drones have enormous use in dangerous works, agriculture, medical and media,
    there are a number of concerns related to privacy invasion, accidents and security
    risks that can be caused by its unscrupulous use. Let us delve deeper into these
    exciting manifestations of AI and ML-led automation in the modern era.


    # WHAT IS a DRONE?


    ![](img/3531370aa21067bbdc45128741d34edb_107_0.png)


    Fig 7.1'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'An unmanned aerial vehicle (UAV) commonly known as a drone is an aircraft without
    a human pilot on board. **UAVs are a component of an unmanned aircraft system
    (UAS)** which include a UAV, a ground-based controller, and a system of communication
    between the two. The flight of UAVs may operate with various degrees of autonomy:
    either under remote control by a human operator or autonomously by on board computers.


    The word drone actually has two distinct meanings: the first one is a low humming
    sound that goes on a continuous basis and the second indicates the male bee. We
    all know that the male bee has no work to do; it never goes out to gather honey;
    its existence is just for impregnating the bee queen. So it is not a bad idea
    to use this word to describe an UAV that also produces sound like a group of bees
    and phantom appears to be mindless. The drone to the today’s world is an unmanned
    aerial vehicle or UAV that is either operated by a human from a remote location
    or it can work autonomously as per the set mode. In simple words, a drone is something
    like a flying robot. The aircrafts are usually controlled from a dedicated remote
    unit and they can manage all things in air due to an intelligent software program.
    It possesses so many on-board working sensors like GPS, etc. that assists in proper
    flight mode controls.


    # HISTORY OF a DRONE:


    The origin of a drone can be traced with special techniques to provide relevant
    information to the military. The very first aircraft with reusable type radio
    control mechanism was designed in the thirties, and it worked like a base model
    for all new advancements in today’s world. Later, the military drones were developed
    with classic sensors and camera units and now they have been fixed inside missiles
    too. With so much advancement in technology, now you can easily find so many variants
    of drones. A few are used for military applications but others are finding the
    potential role in many big companies. As per a recent new update, Google and Amazon
    are developing their own drones so that parcels can be delivered by air with ease.
    One more interesting concept is presented by Facebook as they are thinking to
    develop some giant drones that can carry signal to remote locations for direct
    internet access. Drones in today’s world have also been an important part of film
    industry and news reporters are also using them to carry information from inaccessible
    locations.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# HOW DOES A DRONE WORK?


    The working procedure of a drone may appear simple to most of you but the device
    is actually carrying a complex technology inside. Before we discuss the concept
    of a drones’ working, you must know the fact that differentiate between drones
    and its ancestors the helicopters. The former one can fly independently whereas
    the later needs a pilot for directions.


    Actually, it is a specially designed multi propeller system inside a drone that
    makes this device highly independent and also assists in reduction of failures.
    One important thing to note about this multi propeller system is that even if
    any motor inside this device stops working; it will keep on flying as it gets
    support from propellers that are working in the group. Drones that possess a large
    number of motors inside are able to gain more control over their elevation and
    hence can carry more loads during flight. These propellers get their power from
    a dedicated source and most of these devices contain removable batteries so that
    they can stay in air for a long time. The flight time can be extended with use
    of powerful batteries in design.


    ![](img/3531370aa21067bbdc45128741d34edb_109_0.png)


    Fig 7.2 How does a drone fly? facilitating features


    # HOW DOES IT FLY?


    A controller plays an important role in the drone flying mechanism. This device
    is used by experts for controlling every movement of a drone, ranging from its
    launching, navigation abilities and even up to landing.'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'The market is flooded with a variety of controllers these days and developers
    often use it to do various experiments to create drones with impressive features.


    One of the major tasks of a controller is to establish a proper communication
    channel between the remote unit and the radio waves. Most of the drones work on
    2.4 GHz frequency range and many of these controls take help from Wi-Fi networks
    for making active decisions regarding movements. Many features of a smartphone
    and drones are the same as both carry GPS, Wi-Fi and many other common sensor
    units. These on-board sensors help drones to stay in air for a long time and make
    right decisions about its height, direction and other important movements. The
    landing process is also controlled by the propeller system inside and the sensors
    make decisions about its speed, altitude and motor rotation, etc. A drone works
    like an intelligent air unit that can cover a large distance when used with powerful
    batteries and can bring the hidden information for you like a spy. This is the
    main reason behind its popularity in military applications.


    # COMPONENTS OF DRONES


    Let us now take a look at the various components that go into the construction
    of a drone, giving it all the properties that are required to fly and perform
    its functions.


    ![](img/3531370aa21067bbdc45128741d34edb_110_0.png)


    Fig 7.3 Components of a drone'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 1. STANDARD PROPELLERS:


    The propellers are usually located at the front of the drone/quadcopter. There
    are many variations in terms of size and material used in the manufacture of propellers.
    Most of them are made of plastic, especially for the smaller drones but the more
    expensive ones are made of carbon fiber. Propellers are still being developed
    and technological research is still ongoing to create more efficient propellers
    for both small and big drones. Propellers are responsible for the direction and
    motion of the drone. It is therefore important to ensure that each of the propellers
    is in good condition before taking your drone out for a flight. A faulty propeller
    means impaired flight for the drone and hence an accident can occur. You can also
    carry an extra set of propellers just in case you notice some damage that was
    not there earlier.


    # 2. PUSHER PROPELLERS:


    Pusher propellers are the ones responsible for the forward and backward thrust
    of the drone during a flight. As the name suggests, the pusher propellers will
    determine the direction the drone takes either forward or backward. They are normally
    located at the back of the drone. They work by cancelling out the motor torques
    of the drone during the stationary flight leading to forward or backward thrust.
    Just like the standard propellers, the pusher propellers can also be made of plastic
    or carbon fiber depending on the quality. The more expensive ones are usually
    made of carbon fiber. There are different sizes depending on the size of the drone.
    Some drones provide for pusher prop guards that will help protect your propellers
    in the event of an unplanned crash. Always ensure you inspect your pusher propellers
    before the flight as this will determine the efficiency of the flight.


    # 3. BRUSHLESS MOTORS:


    All drones being manufactured lately use the brushless motors that are considered
    to be more efficient in terms of performance and operation as opposed to the brushed
    motors. The design of the motor is as important as the drone itself. This is because
    an efficient motor means you will be able to save on costs of purchase and maintenance
    costs. In addition to this, you will also save on the battery life which contributes
    to longer flight time when flying your drone. Currently, the drone motor design
    market is pretty exciting as companies try to outdo each other in coming'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'up with the most efficient and best developed motors. The latest in the market
    is the DJI Inspire 1 which was launched recently. This offers more efficient performance
    and saves on the battery life. It is also relatively quiet and does not produce
    a lot of unnecessary noises.


    # 4. LANDING GEAR:


    Some drones come with helicopter-style landing gears that help in landing the
    drone. Drones which require high-ground clearance during landing will require
    a modified landing gear to allow it to land safely on the ground. In addition
    to this, delivery drones that carry parcels or items may need to have a spacious
    landing gear due to the space required to hold the items as it touches the ground.
    However, not all drones require a landing gear. Some smaller drones will work
    perfectly fine without a landing gear and will land safely on their bellies once
    they touch the ground. Most drones that fly longer and cover longer distances
    have fixed landing gears. In some cases, the landing gear may turn out to be an
    impediment to the 360 degrees view of the environment, especially for a camera
    drone. Landing gears also increase the safety of the drone.


    # 5. ELECTRONIC SPEED CONTROLLERS:


    An electronic speed controller (ESC) is an electric circuit whose main responsibility
    is to monitor and vary the speed of the drone during its flight. It is also responsible
    for the direction of the flight and variations in brakes of the drone. The ESC
    is also responsible for the conversion of the DC battery power to AC power to
    propel the brushless motors. Modern drones depend entirely on the ESC for all
    their flight needs and for performance. More and more companies are coming up
    with better performing ESCs that reduce power needs and increase performance,
    the latest one being the DJI Inspire 1 ESC. The ESC is mainly located inside the
    mainframe of the drone. It is unlikely that you will need to do anything or make
    any changes on the ESC but in case you need to make any changes, you can locate
    it inside the mainframe of the drone.


    # 6. FLIGHT CONTROLLER:


    The flight controller is basically the motherboard of the drone. It is responsible
    for all the commands that are issued to the drone by the pilot. It interprets
    the input from the receiver, the GPS Module, the battery monitor and the on-board
    sensors. The flight controller is also respon-'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'sible for the regulation of the motor speeds through the ESC and for the steering
    of the drone. Any commands such as triggering of the camera, controlling the autopilot
    mode and other autonomous functions are controlled by the flight controller. Users
    will most likely not be required to make any alterations to the flight controller
    as this may often affect the performance of the drone.


    # 7. THE RECEIVER:


    The receiver is the unit responsible for the reception of the radio signals sent
    to the drone through the controller. The minimum numbers of channels that are
    needed to control a drone are usually four. However, it is recommended that a
    provision of five channels should be made available. There are very many different
    types of receivers in the market and all of them can be used when making a drone.


    # 8. THE TRANSMITTER:


    The transmitter is the unit responsible for the transmission of the radio signals
    from the controller to the drone to issue commands of the flight and directions.
    Just like the receiver, the transmitter needs to have four channels for a drone
    but five is usually recommended. Different types of receivers are available in
    the market for drone manufacturers to choose from. The receiver and the transmitter
    must use a single radio signal in order to communicate to the drone during the
    flight. Each radio signal has a standard code that helps in differentiating the
    signal from the other radio signals in the air.


    # 9. GPS MODULE:


    The GPS module is responsible for the provision of the drone longitude, latitude
    and elevation points. It is a very important component of the drone. Without the
    GPS module, drones would not be as important as they are today. The modules help
    drones navigate longer distances and capture details of specific locations on
    land. The GPS module also helps in returning the drone safely ‘home’ even without
    navigation using the FPV. In most modern drones, the GPS module helps in returning
    the drone safe to the controller in case it loses connection to the controller.
    This helps in keeping the drone safe.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# 10. BATTERY:


    The battery is the part of the drone that makes all actions and reactions possible.
    Without the battery, the drone would have no power and would, therefore, not be
    able to fly. Different drones have different battery requirements. Smaller drones
    may need smaller batteries due to the limited power needs. Bigger drones, on the
    other hand, may require a bigger battery with a larger capacity to allow it to
    power all the functions of the drone. There is a battery monitor on the drone
    that helps in providing the battery information to the pilot to monitor the performance
    of the battery.


    # 11. CAMERA:


    Some drones come with an in-built camera while others have a detachable camera.
    The camera helps in taking photos and images from above which forms important
    uses of drones. There are different camera types and qualities in the market and
    a variety to choose from.


    These are basically the main component of a drone. If you ever need to make a
    drone, you will need to have all of these in order to have a working drone.


    # TYPES OF DRONES


    Drones or UAVs are designed with capabilities to fly in air without a pilot. Their
    movements are mainly controlled by a remote unit in most of the cases whereas
    a few highly advanced designs are operated from computers. There are so many varieties
    of drones that you can easily find in world and all of them are working for different
    applications so we cannot define any set criteria for their classification. Depending
    on the need or applications, they can have the variable size and design.


    One of the most common applications of drone technology is in military as it helps
    to control surveillance-related issues with ease. Places where humans cannot enter
    directly can be easily monitored by an air flying unit and it can also capture
    photographs of critical locations. Here, we are going to discuss the various types
    of drones and for ease of understanding; they are categorized into four basic
    sections: Number of propellers used inside, their size, flying range and equipment.'
  merge: -1
  img_proc: true
