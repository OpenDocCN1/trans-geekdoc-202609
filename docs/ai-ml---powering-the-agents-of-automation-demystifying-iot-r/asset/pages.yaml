    # THE ARCHITECTURE OF AN OBJECT RECOGNIZING a ROBOT:


    Traditionally, the robot is modeled with a CPU running a central process is responsible
    for planning and other processors to control motions and interpret sensor values,
    passing the interpreted results back to the central processor. A central reasoning
    mechanism with a pre-specified representation must be implemented.


    Advanced robots that are powered by complex algorithms and very high processing
    powered CPUs are now packaged in a human-like form and functionality. The most
    famous humanoid robot, Sophia, has been found to be able to communicate with fellow
    humans in such a way that it is almost impossible to differentiate her from the
    fellow human. http://www.robots-and-androids.com/build-a-robot.html Building a
    robot involves electronics, computer programming, mechanics, and fabrication.


    # THE FOLLOWING ARE THE IMPORTANT STEPS AND CONSIDERATIONS FOR BUILDING A GOOD
    ROBOT:


    Building a robot for a given application and requirement follows the standard
    steps like any other hardware and software integrated application with a layer
    of communication built in. The steps can be broadly defined as follows:


    +   1. Identify the problem to be solved and the goals aimed to be met and also
    establish a market opportunity or an internal buy-in from the concerned department
    and the top management.

    +   2. Collect, identify and analyze options with respect the budget, time and
    resources available.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '+   3. Build a prototype by gathering all the required components.

    +   4. Identify the communication system for remote management and integrate the
    same into the hardware.

    +   5. Establish the proof of concept and once it is achieved and demonstrated,
    build a small batch quantity to establish the relation between the stated objectives
    and achieved goals. Fine tune and make it perfect for a larger batch size production.

    +   6. Test the robot against all the stated goals and ensure that all bugs are
    taken care before releasing the final product for large scale production. At this
    stage, you can also consider showcasing it to potential investors who can enable
    a quick ramp up.


    # PLANNING THE PROJECT:


    +   - It is very important for the project plan to be well laid out in an objective
    manner.

    +   - The plan should outline the various expectations and goals of the robot
    being built.

    +   - Depending on the various tasks like talking, moving, responding to a voice
    or a sound, moving around on a smooth surface or an obstacle ridden path, the
    drawings of the robot should be laid out and parts need to be chosen with great
    attention to detail.

    +   - The tools required and the various electronic, hardware and software products
    and applications should be identified, budgeted for and procured.


    # PROCURING THE COMPONENTS AND ASSEMBLIES:


    While it is a great idea to build from scratch if you are capable of or having
    a team that can do it, it is always better and less time consuming to deploy as
    many parts as possible in the form of readymade assemblies. This can save enormous
    amount of time and budget as you can avoid a lot of testing and planning that
    goes with it. Also, assemblers offer a lower cost of products due to economies
    of large scale.'
