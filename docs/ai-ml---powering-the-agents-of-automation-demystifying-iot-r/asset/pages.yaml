- pgno: 202
  md: '# CHALLENGES TO GROWTH OF BLOCKCHAIN ECOSYSTEMs


    Though there are a lot of drivers for the growth of Blockchain-led ecosystem,
    there are indeed a lot of challenges that need to be addressed.


    +   (I) The understanding of the Blockchain paradigm across the industries and
    the technology implementers has a long way to go in order to trigger the widespread
    adaption. A lot of awareness, education of the technology and its potential breath-taking
    impact has to be undertaken by the early adaptors.


    +   (II) Blockchain has traditionally been associated with the ‘Cryptocurrency’
    which is viewed as an anti-regulation and anti-establishment phenomenon. Hence,
    while it is important for regulators to weigh the real benefits of the Blockchain-based
    approach, they also need to accept and adapt the same to benefit from its disruptive
    potential.


    +   (III) Many of the crypto currency protocols are currently employing the high
    resource intensive ‘Proof of Work’ consensus mechanism for mining transactions.
    This puts a huge limitation on scale while invoking opposition from the environmentalists
    and regulators.


    +   (IV) Security of the transactions is of immense concern as there is no legal
    recourse in most of the countries for transaction losses or thefts. Further, identity
    theft in the form of compromising private keys in the case of public Blockchains
    and improper key management by the certificate authorities and membership providers
    gives rise to a variety of system compromises and loss of property, information
    and value.


    Microsoft is exploring decentralized digital identity solutions that leverage
    public Blockchains in order to create a secure encrypted digital hub where individuals
    can store their identity data and easily control access to it. Microsoft likewise
    has been promoting integrity and security in digital ID solutions using its cloud
    computing services.


    SecureKey technologies and IBM are collaborating to build a digital identity solution
    on top of the open source Hyperledger Fabric'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'enabling large groups of individuals and enterprises to quickly board highly
    secured networks with minimal operational effort and minimal risk.


    (V) In many cases, there is no proper ground up approach and process mapping undertaken
    before the Blockchain platform selection, smart contract development and application
    launch. This has led to a lot of failures among the public Blockchain-based entities
    and in the case of private Blockchains, drain of resources due to avoidable mistakes.
    A systematic and methodical approach by taking into account existing systems in
    the organization and considering all aspects for a proper integration with the
    same will go a long way in making most of the investments in Blockchain-based
    implementations by organizations.


    (VI) Blockchain implementations can drastically alter the governance at organizations
    as they will eliminate non-value adding middlemen while freeing up a lot of wasted
    resources. While corruption and red tape is the biggest causality, this may cause
    a backlash for those used to thriving on such non-desirable practices. This has
    to be factored in while readying an organization for the new approach through
    investments in Blockchain systems.


    (VII) While in the public Blockchain domain, the investments could be raised through
    ICOs (Initial coin offerings) wherever allowed by regulatory authorities. In case
    of enterprise Blockchains, the investments need to be funded by the expected savings
    and cost benefits through automation, collaboration and process excellence. With
    a number of projects still in the POC (Proof of Concept) stage, the trade-offs
    are not clear. Hence, lack of clarity on the returns on investments leads to a
    tremendous bottleneck for the adoption of Blockchains.


    (VIII) The cross-border, cross-organizational, cross-platform nature of the Blockchain-based
    businesses offers a great challenge for the regulatory and accounting authorities
    and practitioners. Hence, a lot of cooperation among the participants and hand
    holding is required to get them on board for managing the transition.


    It is imperative for the participants, industry leaders and regulators to come
    together and quickly evolve a set of global standards and'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'references to ensure coordinated development of the ecosystem in line with
    the standards of traditional IT products and services.


    (IX) The traditional approach to information technology practice in organizations
    is well managed with the availability of a number of guiding frameworks to manage
    the safety and security of their operations in a better way.


    In 2014, the National Institute of Standards and Technology (NIST) published a
    framework for improving Critical Infrastructure Cybersecurity (the ‘Cybersecurity
    Framework’ or the ‘Framework’), a voluntary framework designed to help organizations
    understand, manage, and reduce their cybersecurity risk in a better way. It provides
    a high-level strategic view of the lifecycle of an organization’s cybersecurity
    risk management and can be tailored to specific business sectors and companies.
    Although it is voluntary, many companies across industries, particularly financial
    institutions, are developing cybersecurity programs aligned with the framework.20.


    The framework describes five broad functions such as identify, protect, detect,
    respond, and recover that define the high-level goals of a cybersecurity risk
    management program. It also identifies specific categories of cybersecurity outcomes
    that elaborate on the functions and are tied to activities. (Reference: Advancing
    Blockchain Cybersecurity- Technical and Policy Considerations for the Financial
    Services Industry by Chamber of Digital commerce, Microsoft).


    This needs to be adopted for the Blockchain infrastructure to which the organizations
    are exposed to ensure that the organization is not exposed to unforeseen and unknown
    threats and thus manage their risk better.


    (X) Vulnerability of smart contracts and chain code as well as their integration
    with external systems poses a big threat to the integrity of managing Blockchain
    applications.


    This has to be properly addressed by the developers and the applications should
    be properly tested and integrated with trusted external applications and sources.'
  merge: -1
  img_proc: true
