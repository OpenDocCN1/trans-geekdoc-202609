    # ACCORDING TO a NUMBER OF PROPELLERS:


    ROTORY DRONES: Let us take a look at the different types of drones based on the
    number of propellers in detail.


    # SINGLE ROTOR DRONE:


    The most common construction in a rotory type drone use to be multi rotor type
    designs that have many rotors for holding its position. But in case of a single
    rotor model, you will find just a single rotor inside. The other one will be a
    tail rotor that simply assists to provide control to the heading. In case if you
    have a mixture of hover possessing heavy loads but need a faster flight time with
    longer endurance, then single rotor type helicopters can be best choice.


    # TRICOPTER:


    There are three different types of powerful motors inside a tricopter: three controllers,
    four gyros and only one servo. The motors are simply placed at every extreme end
    of three arms and each one of these is holding a location sensor. Whenever you
    need to lift your tricopter, it is essential to initiate a movement in the throttle
    lever, the gyro sensor will immediately receive its signal and will pass is directly
    to the controller that helps to control motor rotation. A tricopter is able to
    stay stabilized on its path as it is equipped with so'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'many classic sensors and electronic stuff itself. You need not apply any manual
    correction.


    # QUADCOPTER:


    When a multirotor is designed with four rotor blades, then it becomes a quadcopter.
    These devices are usually controlled by specially designed brushless type DC motors.
    Two of the motors are used to move in a clockwise direction whereas the other
    two run in the counter clockwise direction. It helps to decide a safe landing
    for the quadcopter. The source of battery for such devices uses to be a lithium
    polymer battery.


    # HEXACOPTER:


    A hexacopter will serve you for many potential applications with its six motor
    mechanism where three work in the clockwise direction and the other three move
    in the anti-clock wise direction. Hence, these devices are able to gain higher
    lifting power as compared to quadcopters. You need not worry about its mechanism
    as it is designed to serve as an extremely safe landing craft.


    ![](img/3531370aa21067bbdc45128741d34edb_116_0.png)


    Fig 7.5'
  merge: -1
  img_proc: true
