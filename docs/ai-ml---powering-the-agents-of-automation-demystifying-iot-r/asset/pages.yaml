    Today, when an employee has an issue, they pick up the phone and call the helpdesk.
    They are routed to some service provider, and the service provider fulfills the
    request. Millions of times a day. Over and over again.


    Astound’s AI platform for employee service takes the traditional CRM, ITSM and
    HCM systems and makes them smart by automating the routine tasks that ordinarily
    require human agents in call centres to read from scripts. Service management
    automation makes employees more productive, technology more strategic, and organizations
    more profitable.


    As per Astound’s Principal AI Scientist, Walid Saba, one of the world’s foremost
    experts on natural language processing and natural language understanding has
    developed a framework to help enterprises cut through the noise. Walid’s levels
    of intelligent virtual agents clearly describe enterprise Chatbot technology and
    its associated conversational capabilities within six defined levels.


    What follows is a sneak peek at the six levels of intelligent virtual agents.
    Level 0 is the most basic of the six levels, and with each additional level, the
    conversational intelligence as well as the underlying technology becomes increasingly
    sophisticated.


    # The six levels of intelligent virtual agents are as follows:


    # Level 1 Scripting


    *Scripting and pattern matching virtual agent*


    Level 1 is the most rudimentary of all of the virtual agents. Level 1 virtual
    agents can perform pattern matching tasks using regular expressions. Many Level
    1 virtual agents can be easily built using readily available NLP libraries/frameworks.
    These libraries, many of which are open source, provide the Chatbot training data
    needed to create a Level 1 virtual agent.'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'But be warned, Level 1 virtual agents are in essence skeletons. They have the
    foundation for conversational capabilities, but require someone to create dialogs
    of phrases or scripts to properly function. Building a Level 1 virtual agent takes
    time and patience. For the virtual agent to be useful in answering requests, enterprises
    have to manually script out countless employee question and answer scenarios.


    If you’re using a Level 1 enterprise Chatbot platform to scale your service desk,
    it can match the text of an employee’s request, e.g. ‘What is the PTO policy?’
    with the text in other documents that have the matching phrase, e.g. a knowledge
    base article entitled ‘PTO policy’. And while it can match phrases, a Level 1
    won’t be able to do much if one of your employees asks ‘I need to know more about
    the rules and procedures concerning paid time off’.


    # Level 2 basic


    # *Basic search and routing virtual agent*


    A Level 2 virtual agent builds upon the pattern-matching capabilities of a Level
    1 virtual agent with search capabilities. It can take a keyword or phrase, e.g.
    ‘PTO policy’ and perform a basic search. It can also understand the basic intent
    of an employee’s query, e.g. a question about how ‘PTO policy is related to ‘paid
    time off’. A Level 2 virtual agent possesses a rich dictionary of relevant words
    and phrases and can engage in basic small talk (greetings, starting over, etc.).


    But what really separates a Level 1 virtual agent from a Level 2 virtual agent?
    A Level 1 virtual agent is tied to a script. It matches keywords. A virtual agent
    that is Level 2 basic, on the other hand, uses some language processing to identify
    more than just matching keywords. It can perform very basic thesaurus-driven matching.
    For example, it can relate terms like ‘computer’ and ‘laptop’, and it can process
    search queries using plain natural language rather than the canned keyword phrases
    a Level 1 needs to function.


    # Level 3 contextual


    # *Contextual understanding and domain independence virtual agent*


    A Level 3 virtual agent should be able to understand the subject matter or domain
    of a request and can beyond the very basic Level 1 ontological matching, to be
    able to understand the multiple employee requests about'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'how the PTO policy can be grouped together based on the vocabulary and sentence
    structure the employees use. A Level 3 can understand relevance. It knows how
    to differentiate between questions it can and can’t answer and can escalate a
    query if it knows it cannot resolve it.


    For example, a Level 3 HR support virtual agent knows that it cannot answer a
    question about the weather forecast for the next week. It doesn’t misinterpret
    a phrase like ‘paid time off’ to mean that an employee paying something or someone
    called ‘time’. It also has the ability to learn new domains quickly. A Level 3
    virtual agent that is used for HR case management resolution, for example, can
    also be used for IT service management without first having it trained on a huge
    amount of IT data. Finally, a Level 3 has the ability to conceptually link topics
    that are thematically related. As a milestone, therefore, Level 3 moves from keyword
    and basic sentence structure matching capabilities to more advanced semantic and
    conceptual understanding. It knows, for example, that knowledge base articles
    about ‘sick leave’ are related to ‘PTO policy’.


    # Level 4 Adept


    # *Advanced dialogue virtual agent*


    A Level 4 virtual agent can perform all the tasks a Level 1, 2 and 3 virtual agents
    can perform, but it also possesses the ability to engage in a natural dialogue.
    A Level 4 can ask clarifying questions. Clarification requires deep semantic understanding.
    It requires resolving references previously mentioned in the discourse and filling
    in the gap based on the previous part of the conversation. In short, a Level 4
    can do what computational linguists call deep discourse analysis.


    A Level 4 virtual agent can understand the larger context of a request, including
    whether the virtual agent has engaged with the person in the past, and if it has,
    it can connect words or phrases that refer to past conversations. For example,
    an employee can respond to a virtual agent’s request for an employee ID number
    by replying, “I have it right here.” Finally, a Level 4 virtual agent knows when
    there are equally plausible ways to solve the resolution. A Level 4 may find out
    if there seems to be more than one answers to a question that each of the options
    lead to equally plausible resolutions. It may, for example, clarify an employee’s
    PTO policy question by asking whether they are referring to sick leave,'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'paid leave, or personal leave. This kind of intelligent clarification with
    the employee reduces mean time to resolution.


    # Level 5 resolution


    # Learning, personalization and problem resolution virtual agent


    A Level 5 virtual agent embodies all the intelligence of a Level 4, but it can
    also learn over time and can proactively engage with employees in a personalized
    way to understand, analyze and actually resolve issues. Compared to previous levels,
    a Level 5 doesn’t just point an employee to a knowledge base article to solve
    an issue. It is an intelligent virtual agent that actually solves the issues that
    may have otherwise required high-touch involvement from someone within employee
    support. Level 5 virtual agents learn from past conversations and use that knowledge
    to develop shortcuts to efficiently resolve issues in a personalized way. A Level
    5 resolution virtual agent, for example, would not simply point out to an employee
    a PTO form to be filled. It would be able to solve the problem on the spot without
    requiring the employee to take that extra step.


    # Level 6 fluent


    # *Human-level conversational virtual agent*


    While Level 5 virtual agents have the ability to resolve issues, it cannot yet
    resolve linguistic issues that require high-level or human-level reasoning. A
    Level 6 virtual agent, on the other hand, can engage in human-like conversations.
    It is now an agent that fully understands and comprehends what an employee is
    asking. It learns an employee’s specific situation (using its understanding of
    previous interactions with that employee or employee group) and can resolve issues
    or escalate and route them to the proper channel. This level of understanding
    requires very advanced semantic and pragmatic capabilities. A Level 6 virtual
    agent can understand compound nominal, metaphors, idioms, scope resolution; metonymy,
    co-predication, anaphor resolution. It reasons through requests using common sense.


    The world’s leading food franchising company selected Astound as their artificial
    intelligence and machine learning platform to automate the routing and resolution
    of service requests. Unlike human agents, Astound’s machine learning technology
    predicts the right category nearly every time and improves continuously. Unlike
    human agents, Astound'
