  md: '# AI IN DRONES


    Deep learning is recently showing outstanding results for solving a wide variety
    of robotic tasks in the areas of perception, planning, localization, and control.
    Its excellent capabilities for learning representations from the complex data
    acquired in real environments make it extremely suitable for many kinds of autonomous
    robotic applications. In parallel, Unmanned Aerial Vehicles (UAVs) are currently
    being extensively applied for several types of civilian tasks in applications
    right from security, surveillance, and disaster rescue to parcel delivery or warehouse
    management.


    ‘Actionable Data’ is next to a powerful and reliable drone and is probably the
    most important driver of the drone industry. Drones often generate large amount
    of data; sometimes more than what we can handle. Unmanned aerial vehicles only
    add value to the user if there are ways to process data quickly and without putting
    additional efforts into this process. The faster, the more accurate, and the easier
    the images can be evaluated, the better.


    Combining drones and artificial intelligence seems to be the answer to all the
    above mentioned challenges. Nowadays, almost every company that deals with data
    processing, analytics or ‘autonomous’ flight control claims the use of artificial
    intelligence, machine or deep learning. But what do these terms actually mean?
    How do they relate to each other and where are these terms applied?


    The following text aims to answer these questions:


    In general, AI describes the capability of machines that can perform sophisticated
    tasks which have characteristics of human intelligence and includes things like
    reasoning, problem-solving, planning, learning, and understanding and reading
    human languages as shown in following image.


    # TERMINOLOGY AND DESCRIPTION:


    # MACHINE PERCEPTION:


    Let us start with Machine Perception. Since many AI-related tasks for drones are
    dealing with image recognition, the unmanned aerial vehicle must be able to perceive
    and absorb the environment or objects in some'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'way. This is usually done with sensors such as electro-optical, stereo-optical,
    and LiDAR. This process is referred to as Machine Perception.


    # COMPUTER VISION (CV):


    Once the drone has captured the raw sensor data, it usually needs to be analyzed
    in some way to extract meaningful information for a certain purpose. This ability
    is called computer vision and it is related to the automatic extraction, analysis
    and understanding of useful information from one or more images.


    # MACHINE LEARNING (ML):


    To optimize differentiable parameters, techniques of machine learning can be applied.
    Unlike software that has programmed manually and performed tasks with specific
    instructions (like Computer Vision software), machine learning algorithms are
    designed in such a way that they can learn and improve over time when exposed
    to new data.


    # DEEP LEARNING (DL):


    Deep learning, on the other hand, is a specialized method of information processing
    and a subset of machine learning that uses neural networks and copious amounts
    of data for decision-making. The learning methods are based on the functioning
    of the human brain, which also consists of interconnected neurons. The so-called
    Artificial Neural Networks consist of multiple layers of which each is connected
    to the next layer and is responsible for a certain task. This design makes it
    possible to combine and expand what has been learned with new content.


    As already mentioned earlier, the goal of drones and artificial intelligence is
    to make efficient use of large data sets (such as aerial images) as automated
    and seamless as possible. No one wants to look at 5,000 plain white picture of
    a wind turbine and look for tiny cracks. Drones can only unlock their full potential
    when data acquisition and data analytics happen at a high (or someday full) degree
    of automation. Great potential to process this mass of data as automated as possible
    seems to be the approach of ML or DL. Due to an immense and rapid increase in
    the processing power, the cost of storage and availability of digital data in
    the recent years, the utilization of complex AI algorithms have become feasible
    for drones, and first and solid solutions are already in the market. If AI develops
    as rapidly as we have seen in the recent years, we'
  merge: -1
  img_proc: true
