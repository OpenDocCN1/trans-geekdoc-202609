- pgno: 195
  md: "# ENTERPRISE BLOCKCHAINS (PRIVATE AND CONSORTIUM PERMISSIONED)\n\nHyperledger,\
    \ Enterprise Ethereum, Quorum, and Corda are examples of Enterprise Blockchain\
    \ Platforms.\n\nIn the case of enterprise applications like Hyperledger, Multiledger,\
    \ Quorum, Corda, etc. a Blockchain is defined by IBM as ‘A peer to peer distributed\
    \ ledger technology for a new generation of transactional applications that vastly\
    \ improve the security, transparency and accountability while streamlining organizational\
    \ processes.\n\nIn case of a permissioned Blockchain for public use, anyone can\
    \ have access to view the ownership of assets after creating an account on the\
    \ platform.\n\nThe important aspects of identity management for secure transactions\
    \ offered by the Blockchain are as follows:\n\n+   (a) **PUBLIC KEY INFRASTRUCTURE\
    \ (PKI)**: In the digital world, real people are identified by digital identities\
    \ represented by a pair of cryptographic keys namely, **Public key**, which is\
    \ known to everyone and a **Private Key**, which is kept a secret. A combination\
    \ of public and private key of transacting and/or authenticating parties enables\
    \ the participants of the transaction to conduct their dealings in a secured manner.\n\
    +   \n+   (b) **CRYPTOGRAPHIC HASH FUNCTION**: A hash function can be used in\
    \ cryptographic applications if it is collision resistant. It is said to be collision\
    \ resistant if it is hard to find two inputs that **hash** to the same output;\
    \ that is, two inputs a and b such that H(a) = H(b) and a ≠ b. SHA 256 used in\
    \ most Blockchain applications is an example of collision resistant hash function.\n\
    +   \n+   (c) **ECDSA GENERATED DIGITAL SIGNATURES**: The Elliptical curve Digital\
    \ Signature algorithm (ECDSA) is a digital signature scheme, i.e., an asymmetric\
    \ cryptographic scheme for producing and verifying digital signatures. Most of\
    \ the public and private Blockchain platforms use the ECDSA scheme for producing\
    \ and verifying the digital signatures for their transactions."
  merge: -1
  img_proc: true
- pgno: 196
  md: '# (d) CERTIFICATION AUTHORITIES (CA):


    A Certificate authority or Certification authority (CA) is a trusted entity that
    issues digital certificates certifying the ownership of a public key by the named
    subject of the Certificate. This is an essential part of a PKI infrastructure.
    X.509 is a widespread standard to manage certification.


    For example, in Hyperledger Fabric 1.1, the Certificate authority managing member
    identities issues X.509 certificates to its members.


    # SUMMARISING BLOCKCHAIN’S FEATURES:


    +   - Pseudonymity

    +   - Decentralization

    +   - Fault tolerance with no single point of failure

    +   - Immutability (Tamper resistant)

    +   - Transparency

    +   - Trust through automation


    # BLOCKCHAIN’S SECURITY TOOLS:


    +   - One way Hash functions used in consensus implementation

    +   - Data footprint representation and key generation

    +   - Non-forgeable digital signature algorithms for transaction privacy

    +   - Secrecy and non repudiation


    In the traditional digital world, mutually untrusted partners communicate through
    a centralized system with the help of these digital certificates issued by centralized
    authorities to different websites and portals.


    However, there have been increasing cases of Certification authorities being attacked.'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'There have been several cases of fake digital certificates for famous publishers
    like Google issued by reputed Certification authorities like Gogo (Inflight internet
    service) and Symantec, etc., while fake certificates use to target users of reputed
    banks to direct them to fake versions of their banks’ sites.


    In the case of private Blockchains, the certification authorities and the administrators
    need to take utmost precaution in identifying genuine participants through issues,
    identifying and revoking the certificates as the case may be appropriately. In
    the case of public Blockchains, in 2016, Sead Muftic proposed a Blockchain-based
    protocol that allows distribution and management of digital certificates (linking
    a subject with its public key) without the need of certificate authorities by
    offering BIX (Blockchain Information Exchange) certificates maintained in BCL
    (Bix certificate Ledger). These can replace the system of X.509 certificates offered
    by centralized authorities.


    # VULNERABILITIES IN BLOCKCHAIN SECURITY


    +   - **VULNERABILITIES TO MALWARES:** Malware attacks on users’ and nodes’ computer
    system to steal information and crypto-jacking (illegal mining using user’s resources).
    A Blockchain-based access control can help.

    +   - **VULNERABILITY OF USERS’ INSTALLED PROGRAMS:** Third-party software compromised
    by hackers. Regular software patch updates is a must.


    Properly managed identities and deployment of Byzantine fault tolerant consensus
    mechanisms ensures that the decentralized systems characterizing the Blockchain
    landscape are fault tolerant, attack resistant and collision resistant as they
    do not have the sensitive single central points of failure. It is also impossible
    for malicious participants to come together and act against the interests of the
    other genuine participants, unlike in centralized corporations with single points
    of failure and power concentration in a central authority.


    However, there are certain limitations that are inherent to the Blockchain platforms
    that need to be looked at:'
  merge: -1
  img_proc: true
- pgno: 198
  md: "+   a) The implementation of the consensus mechanism for arriving at the decision\
    \ is contingent upon the opinion of the majority. Hence, it is possible for a\
    \ majority to collude and manipulate decisions making a 51% attack feasible.\n\
    +   \n+   b) Where there are a smaller number of participants in the Blockchain\
    \ that generally happens in enterprise Blockchains closed groups or newly launched\
    \ public platforms, the security is limited or missing at times.\n+   \n+   c)\
    \ The private key management is vulnerable to thefts and hence exploitable. The\
    \ trust in the Blockchain relies on the safekeeping of the private keys for a\
    \ truly distributed identity management. Hence, the crypto currency and token\
    \ investors in the case of public Blockchains and crypto asset-based platforms\
    \ and the node administrators in the case of a private Blockchain should ensure\
    \ adequate measures to record and store their private keys in a secure manner.\
    \ Care should be taken that only authenticated users are able to transact on the\
    \ respective platforms.\n+   \n+   d) Weakness in software implementation may\
