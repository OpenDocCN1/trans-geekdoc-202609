- pgno: 19
  md: '# CHAPTER 2


    # Disruptive Models

    Led By Digitization


    # Introduction:


    Home automation, factory automation, AI and ML led analytics are making deep rooted
    and disruptive impact on various aspects of our lives.


    We now know that drones can fly, robots can jump, and bots can listen, talk, think,
    crawl, attack and beat the world’s best in thinking games. Guess what would happen
    if all this combines into one unit or a body!


    This is the power of Artificial Intelligence powered with the boosting characteristics
    of Machine learning and Deep learning! 2019 in many ways is seeing the convergence
    of a number of advancements in the adoption of cutting-edge technologies. It is
    now clear in no uncertain terms that the future is getting increasingly ‘Autonomous’.
    Artificial Intelligence and Machine learning are combining together for a rapid
    adoption of automation across the spheres of our personal and corporate lives.


    The organizations that are winning the race for market supremacy in every field
    are the biggest exponents of these powerful technologies. With the increasing
    trends of digitization, decentralization, and automation, adoption of cloud and
    open source technologies is resulting in a manifold increase in data generation,
    analysis and consumption. The Big Data technologies are increasingly adopted and
    this has resulted in the rapid adoption of Artificial intelligence-led analytics,
    bolstered by the productive utilization of Machine learning algorithms effectively.'
  merge: -1
  img_proc: true
- pgno: 20
  md: "The organizations that are able to create a strong foundation of data-based\
    \ technologies and exponents of data analytics are reaping rewards of their investments\
    \ in such areas. According to the consultancy firm, Accenture, ‘automation, minibots,\
    \ machine learning and adaptive intelligence are becoming part of the finance\
    \ team at lightning speed’.\n\n# STRUCTURE:\n\n+   - Changing face of the new\
    \ workforce\n+   - Fair and sustainable practices\n\n# OBJECTIVES:\n\nIn this\
    \ chapter, we will briefly look at the different manifestations of the digitization\
    \ and automation that are making an impact on various aspects of our environment\
    \ and working life. We shall also look at some of the organizations that are working\
    \ in the various aspects of digitization and automation. We will also see how\
    \ Blockchain can help in the process of securing the automated world of the future.\n\
    \nCompanies like Google, Amazon, Netflix, and Facebook have taken the usage of\
    \ analytics and marketing automation to a totally different level which has further\
    \ strengthened their market dominance in their respective areas. The term ‘Data\
    \ is the new Oil’ has never been more true.\n\nThe current situation can be summarized\
    \ in the following joke:\n\n**It may be a joke, but quite possible with today’s\
    \ technology of Big Data, AI, Predictive Analytics, Social Applications, Recommendation\
    \ Engines, Next Best Action, etc., all coming together.**\n\n> Hello! Is this\
    \ Gordon's Pizza?\n> \n> No sir, it's Google's Pizza.\n> Did I dial the wrong\
    \ number?\n> No sir, Google bought the pizza store.\n> Oh, alright then I'd like\
    \ to place an order please.\n> Okay sir, do you want the usual?\n> The usual?\
    \ You know what my usual is?\n> According to the caller ID, the last 15 times\
    \ you've ordered a 12-slice"
  merge: -1
  img_proc: true
- pgno: 21
  md: 'with double-cheese, sausage, and thick crust.

    Okay that’s what I want this time too.

    May I suggest that this time you order an 8-slice with ricotta, arugula, and tomato
    instead?

    No, I hate vegetables.

    But your cholesterol is not good.

    How do you know?

