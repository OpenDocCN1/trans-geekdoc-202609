    # DEADLY BOEING CRASHES RAISE QUESTIONS ABOUT AIRPLANE AUTOMATION-


    # AUTOMATION IS A DOUBLE-EDGED SWORD


    +   - Two Boeing 737 Max 8 jets, a variant of the world’s most popular jetliner,
    crashed within six months of each other (October 2018 and March 2019) in a stunning
    rate of failure that raises questions about the airplane’s automated systems.

    +   - A preliminary report from Indonesian investigators indicated that Lion Air
    610 crashed because a faulty sensor erroneously reported that the airplane was
    stalling.

    +   - The false report triggered an_automated_system known as Manoeuvring Characteristics
    Augmentation System (MCAS).

    +   - This system tried to point the aircraft’s nose down so that it could gain
    enough speed to fly safely. A warning light that would have alerted the crew to
    this discrepancy before the take off wasn’t part of the optional package of equipment
    on Lion Air’s Max 8 aircraft, according to The Air Current. To be clear, the warning
    light was part of an upselling strategy, and now nearly 350 people were dead.

    +   - Once on the flight, the Lion Air crew was unprepared for the automated response
    set off by the faulty angle-of-attack data.'
