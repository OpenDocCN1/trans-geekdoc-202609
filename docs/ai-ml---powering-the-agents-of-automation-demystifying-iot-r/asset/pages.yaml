    easy heterogeneous execution across multiple Intel® platforms (CPU, Intel® Processor
    Graphics) providing implementation across cloud architectures to edge devices.
    This open source distribution provides flexibility and availability to the developer
    community to innovate deep learning and AI solutions.


    # OPENVINO™ TOOLKIT CONTAINS:


    +   - Deep Learning Deployment Toolkit


    This toolkit allows developers to deploy pre-trained deep learning models through
    a high-level C++ Inference Engine API integrated with application logic.


    This open source version includes two components, Model Optimizer and Inference
    Engine, as well as CPU, GPU and heterogeneous plugins to accelerate deep learning
    inferencing on Intel(R) CPUs and Intel(R) Processor Graphics. It supports pre-trained
    models from Open Model Zoo along with 100+ open source and public models in popular
    formats such as Caffe*, Tensorflow*, MXNet*, and ONNX*.


    +   - Open Model Zoo


    This repository includes optimized deep learning models and a set of demos to
    expedite development of high-performance deep learning inference applications.
    This repository uses these free pre-trained models instead of training your own
    models to speed up the development and production deployment process.


