- pgno: 234
  md: '# C


    +   14. Chatbots: A chat robot that can converse with a human user through text
    or voice commands. Utilized by e-commerce, education, health, and business industries
    for ease of communication and to answer user questions.

    +   15. Classification: An algorithm technique that allows machines to assign
    categories to data points.

    +   16. Clustering: An algorithm technique that allows machines to group similar
    data into larger data categories.

    +   17. Cognitive computing: Computerized model that mimics human thought processes
    by data mining, NLP, and pattern recognition.

    +   18. Computer vision: When a machine processes visual input from image files
    (JPEGS) or camera feeds.

    +   19. Convolutional neural network (CNN): A type of neural network specifically
    created for analyzing, classifying, and clustering visual imagery by using multilayer
    perceptrons.

    +   20. Crowdsourcing: It is a practice of distributing tasks to a large audience
    and getting things done quickly. The drawback here is that it''s tough to maintain
    the crowd and ensure quality when done alone.


    # D, E, F


    +   21. Data labeling: Task of annotating the object(s) found in the given data.
    This includes images, audio, video or any file type.

    +   22. Data mining: The process of sorting through large sets of data in order
    to identify recurring patterns while establishing problem-solving relationships.

    +   23. Data science is a study that unifies statistics, data modeling and visualization
    and analysis to extract information, classify data, etc.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '24. Data scientist: Person who is better at statistics than any software engineer
    and better at software engineering than any statistician.


    25. Decision model: A model that uses prescriptive analytics to establish the
    best course of action for a given situation. The model assesses the relationships
    between the elements of a decision to recommend one or more possible courses of
    action. It may also predict what should happen if a certain action is taken.


    26. Deep learning: A machine learning technique that teaches computers how to
    learn by rote (i.e. machines mimic learning as a human mind would using classification
    techniques).


    27. Entertainment bots:


    Entertainment bots provide entertainment to users with higher levels of personalized
    user experience. The robotic operations ensure complete audience engagement while
    offering them seamless services related to events, recommendations and ticket
    bookings. With its easy integration with social media platforms, the bots have
    their fingers on the pulse of audience preferences and are able to communicate
    with them in larger scales. The AI applications of the entertainment bots can
    anticipate user interests to send them personalized news alerts, movies and concert
    recommendations and their show times. Ticket bookings can also be done using these
    bots.


    28. Facial recognition: The recognition of faces and emotional states in images
    or video signals. This is commonly done through point annotations called landmarks.


    29. Father of Artificial Intelligence: John McCarthy is one of the founding fathers
    of artificial intelligence, together with Marvin Minsky, Allen Newell, and Herbert
    A. Simon. McCarthy coined the term ‘artificial intelligence’ in 1955, and organized
    the famous Dartmouth conference in summer of 1956. This conference started AI
    as a field.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# G


    30. Gaming:


    Gaming is essentially the running of specialized applications that are sold out
    to us as electronic games or video games. Traditionally, digital games have included
    hardware in form consoles like X-box and PlayStation or personal computers for
    online gaming. However, with the emergence and gradual proliferation of VR, AR,
    AI, and smart technology, the gaming market is briskly expanding as games with
    high-quality user experiences are being developed. Games use enhanced graphics,
    3D effects and full motion video and input devices like a joystick to offer high
    entertainment value to the gamers. High-end games are extremely sophisticated
    with their interface constituting a form of virtual reality, contributing to an
    immersive experience.


    31. Ground truth is a process usually done on site (or using gold standard) to
    measure the accuracy of the training dataset to prove or disprove research hypothesis.
    For example, self-driving cars use ground truth to train AI to properly validate
    the road and street scenes.


    32. Human-in-the-loop is a process of using humans in the middle of the process
    to achieve the expected output. It’s been used in the Machine Learning process
    to enhance the result accuracy.


    33. Generative adversarial networks (GAN): A type of neural network that can generate
    seemingly authentic photographs on a superficial scale to human eyes. GAN-generated
    images take elements of photographic data and shape them into realistic-looking
    images of people, animals, and places. It is an unsupervised AI and ML technique
    to mimic datasets called Generative Adversarial Network (GAN). It consists of
    two competitive neural networks: the generator and the discriminator.


    34. Genetic algorithm: An algorithm based on principles of genetics that is used
    to efficiently and quickly find solutions to difficult problems.'
