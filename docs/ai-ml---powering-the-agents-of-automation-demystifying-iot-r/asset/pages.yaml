  md: '# Global Market Overview - Global drones market is estimated to reach USD36.9
    billion in 2022 from USD6.8 billion in 2015, growing at a CAGR of 27.3% driven
    by growing use-cases of drones


    +   - Drones market is largely dominated by military drones, but commercial and
    civilian drones are gaining momentum due to increased use.

    +   - In 2015, market for military drones accounted for 65% of total drones market
    with rest 35% shared by camera drones and other types of drones.

    +   - Drones market continues to mature with refined models, more intuitive software
    and increased usability. In the last few years, several new drone start-ups have
    entered the market due to surging consumer adoption.

    +   - Companies strive to produce commercial drones that are more energy efficient,
    durable and have a significantly lower cost of operation than a manned aircraft.


    ![](img/3531370aa21067bbdc45128741d34edb_130_0.png)


    # Indian drone market is anticipated to reach USD421 million by 2021


    +   - Military and governmental applications account for majority of the share
    in India''s drone market, as commercial applications remain low due to a ban by
    Directorate General of Civil Aviation (DGCA).

    +   - Small drones are expected to grow the market with its deployment for recreational
    purposes such as videography and racing.

    +   - Applications in disaster management and surveillance by governmental agencies
    and companies are gaining prominence in the market.

    +   - Drones could also become important tools in other applications such as surveying
    farmlands, conserving wildlife and critical infrastructure monitoring.


    # India has the potential to become a major market for small and medium drones
    manufacturing


    +   - Given India''s growing electronics manufacturing capabilities and software
    prowess, there is considerable potential for innovation in making small and medium
    drones and development of software for improving data analytical capabilities
    of drones.

    +   - Further, there exists strong potential for Indian companies to avail the
    benefits of the ''Make in India'' program and set-up joint ventures for making
    drones.

    +   - Despite uncertain regulatory environment, several domestic start-ups are
    producing drones for various commercial applications ranging from disaster relief,
    security and surveillance, and aerial photography.

    +   - There are also a number of private Indian companies working on both the
    hardware and the software of drones, selling exclusively to the government.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Growth Drivers


    ![](img/3531370aa21067bbdc45128741d34edb_131_0.png)


    # Advancing technologies add more capabilities to drones


    +   - Drones continue to evolve with different kind of sensors and automation
    controls to improve its ease-of-use and capabilities. Some of the recent developments
    include integration of ultra high-definition cameras for high-quality video capture,
    3D imaging and collision avoidance technology.

    +   - Further, advanced technologies have enabled manufacturers to build customized
    drones of different configuration depending on the application. In coming years,
    more such technologies are expected to make drones much attractive to consumers.


    # Increasing use-cases of drones


    +   - Drones continue to evolve with increasing use-cases across sectors. Enhanced
    flight speed, payload capacity and battery life have opened new avenues for drones
    market.

    +   - Individuals adopt drones for recreational purposes beyond toys, as more
    hobbyists and do-it-yourself (DIY) enthusiasts consider drones as a serious consumer
    device

    +   - As the Internet of Things (IoT) evolves with more connected devices, drones
    are expected to create newer applications.


    # Growing adoption of camera drones


    +   - Camera drones offer user-friendly experience with sophisticated flight control
    and high-end image sensors. These drones enable to take aerial shots of professional
    quality. These are widely adopted by aspirational and professional photographers.


    # Easing regulations


    +   - Most countries are actively developing laws that would govern the operation
    of drones for both personal and commercial purposes.

    +   - In India, DGCA plans to register all civil drones and issue permits for
    operating them. Easing regulations would encourage more manufacturers to enter
    the market as well as drive consumer adoption.


    # Growing affordability


    +   - Drones are getting cheaper with increasing competition and maturing technology.
    In last few years, many Indian start-ups have emerged offering drones with enhanced
    features for low prices than global players. Increasing affordability is expected
    to drive further consumer adoption.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Project Information


    # Drone manufacturing value-chain


    ![](img/3531370aa21067bbdc45128741d34edb_132_0.png)


    +   - Design: This phase involves product prototyping and building basic system
    architecture.

    +   - Frame assembly: Setting-up of frames based on application.

    +   - Motors/ propellers assembly: Attaching of motors and propellers to the frame
    assembly.

    +   - Sensors/ Controllers assembly: Mounting sensors and flight controllers based
    on application.

    +   - Sub-system wiring: Wiring of electrical components on the frame assembly.

    +   - Firmware loading: Loading of software to control the drone.

    +   - Configuration and Testing: Configuring flight controllers and remote-control
    testing of drone.

    +   - Packaging: Final casing of the product.


    # Type of drone frames play a vital role in achieving smooth and stable flight;
    the material and size decide the aerodynamic technicalities


    +   - Drones can take many form-factors, but there are two major categories -
    rotary wings and fixed wings. Fixed wing drones have simple structure and have
    long flight times, whereas rotary wing drones are more complicated in mechanical
    structure and have shorter range.

    +   - Depending on the applications type and material of the drone are chosen,

    +     - Frames: Frame''s design decide the number of motors/ propellers on the
    drone. Major types of frames are quadcopter, tricopter and hexacopter, which have
    four, three and six motors respectively.

    +     - Materials: Common materials used to build drones are wood, plastic carbon
    fiber and aluminum, with last materials being lighter and sturdier.'
  merge: -1
  img_proc: true
