    While large companies have the resources to invest in Data Lakes, smaller companies
    can still combine their data storage, data processing and analytical activities
    to an integrated or unified Data Management Platform (DMP). A high-end DMP is
    an integrated software suite that combines data storage, processing and analytics
    and offers an intuitive and easy-to-navigate executive dashboard. The role of
    a DMP is to:


    +   - Collect structured and unstructured data from all sources: internal and
    external, covering an organization’s own applications, systems, websites and products,
    data from partners and other associates and any other third-party data used by
    the company.

    +   - Integrate and store all the data collected.

    +   - Apply analytical tools and provide appropriate insights to the top management
    and all the other data driven parts of business.


    Some of the key DMP offerings include Adform DMP, Adobe Audience Manager, KBM
    Group’s Zipline, Lotame, MediaMath DMP, Neustar Identity DMP, Nielsen exelate,
    Oracle BlueKai, Salesforce DMP (formerly Krux) and Turn Digital Hub for Marketers.
    Platforms like IBM Insights and SAS Data Management offer the capability to access
    data on legacy systems and Hadoop. These platforms offer enterprise capabilities
    to enable, manage and analyze large volumes of structured and unstructured data
    by performing activities to integrate, cleanse, transform and govern data on premises
    and in the cloud.


    With the proliferation of Internet of Things, the amount of data that needs to
    be handled across all segments of an organization in private, public and government
    domains is huge. Use of DMPs also allows an organization to leverage technologies
    like Artificial Intelligence and Machine Learning for significant competitive
