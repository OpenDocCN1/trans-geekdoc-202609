- pgno: 137
  md: '# CHAPTER 8


    # Chatbots and

    Voice Assistants


    # INTRODUCTION:


    We are used to talking to customer service agents handling routine sales-related
    enquiries or normal FAQs or assisting us for any service-related issues.


    Aggregation of such services resulted in a huge business called BPOs across the
    world. English speaking countries like India, Philippines and a number of other
    countries in the developing world providing an arbitrage in terms of labor costs
    have become home to such companies employing language and accent trained agents
    typically called CSAs or customer service agents.


    Any company offering products and services globally needs to employ customer care
    services that offer round the clock services for 24 hours in all the languages
    and across various types of businesses and for different functional areas. Aggregation
    and outsourcing to lower salaried destinations made a lot of sense.


    But with the availability of trained Chatbots which are automated agents that
    can work round the clock in any language and can serve any level of customers
    in any functional area. The BPO industry looks all set to be outsmarted and look
    like a liability than the assets that have differentiated great and profitable
    companies from the rest!'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'In this chapter, we will explore the different manifestations, applications
    and advantages of chatbots and voice assistants. We will study and understand
    the different open source platforms available for building the chatbots and also
    the applications available to build the same for social media platforms like Facebook
    Messenger, etc.


    # STRUCTURE:


    +   - Describe chatbots

    +   - Key features of a typical chatbot

    +   - Rule based versus AI-based chatbots

    +   - Good and bad bots

    +   - Key steps to build a chatbot

    +   - Oracle intelligent bots

    +   - Steps to bot yourself

    +   - Use cases of chatbots

    +   - Case study of a chatbot and the intelligent virtual assistant implementation
    platform


    # OBJECTIVE:


    The objective of this chapter is to explain the potential of chatbot and voice
    assistant applications in detail and sensitize the learners to the tools available
    to build these tools and leverage the power of AI and ML-led automation for scaling
    up their operations. A reader must appreciate the technology behind these new
    age tools that not only promise a lot to improve the organizational productivity,
    but also threaten to wipe out the BPO industry and customer service associates
    that employs millions of people across the globe.


    We are used to GPS-based navigation to wade our way through complex routes across
    the world. It is a common practice for everyone to refer to precisely calculate
    the estimated time by GPS for planning their journeys. It is another matter that
    there are certain imperfections in the distances calculated depending on the routes,
    areas, connectivity, etc. as GPS may not be able to address some nuances that
    can be identified and acted upon by the human beings.'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'The voice that beautifully guides you across your journeys are back-ended by
    a phenomenal artificial intelligence-based analytical system, a satellite-based
    communication and positioning system that not only calculates the distances, routes
    and time based on a number of factors, including the traffic conditioning on a
    live basis. The utility of such a system for smart cities and autonomous vehicle
    systems like satellites, UAVs, autonomous trucks and cars, robots, etc. is immense
    indeed.


    Any queries to the car navigation system regarding routes to identifying hotspots
    or utility stations like petrol bunks and any other search for that matter are
    met with accurate set of options, distances and routes. This is an example for
    a chatbot or a voice assistant as the case may be depending on whether it is voice
    capable or not.


    # WHAT IS a CHATBOT?


    A Chatbot is a computer program that interacts with web, telephone and social
    media users of an organization and conducts written and/or oral conversations.


    Chatbots are normally used to converse with potential and actual customers and
    employees of an organization over various media like mobile, telephone, social
    media channels, messengers, and web sites.


    They are typically powered with Natural Language Processing and Task execution
    frameworks to understand users’ communication like intent, entity and dialogue
    essence. It can also integrate with backend systems of an organization like different
    types of databases and productivity applications like ERP, CRM, etc. to search
    and fetch relevant data for addressing and resolving customer queries and updating
    databases.


    Getting 24/7 round the clock service, a quick redressal of simple complaints and
    issues, quick information when needed, ease and convenience in interactions, quick
    answer to simple and complex queries, friendliness and unlimited patience have
    been rated to be some of the most sought after benefits organizations wish to
    provide to their customers. Depending on the need, they can provide different
    chatbots/voice assistants powered with appropriate technology like AI and ML.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Here are some of the following KEY FEATURES OF A TYPICAL CHATBOT:


    +   - **GREETING:** Chatbots exchange pleasantries with the participants and websites,
    social media users, etc. in an appropriate manner putting them at ease and also
    offer to support them with relevant information or supportive action.

    +   - **CHATTING OR CONVERSING:** Based on the user responses, chatbots respond
    to the users in the language of their choice, in voice or in writing as programmed
    and address their queries with the help of their database of responses or fetching
    them from the relevant sources as required.

    +   - **INFORMING:** Chatbots can help the users discover various products and
    services offered by their deployers facilitating them to take an informed decision,
    without being unduly obtrusive.

    +   - **CONTACT DESK:** Chatbots enable the customers to reach out and communicate
    their issues and get information round the clock and record the same for an appropriate
    follow up on communication. In some cases, as needed, they possess the ability
    to escalate the issues to relevant human point of contacts who have the ability
    to resolve the queries.

    +   - **NAVIGATING:** Chatbots can lead the users to navigate to the points they
    are looking at to get appropriate and needed information in a speedy manner.


    By performing all the above mentioned actions in an unemotional and thorough manner,
    chatbots can provide utility far beyond the human interactions which are prone
    to going out of control at times due to the irritation from irate and hostile
    customers, which are not being managed in a professional manner.


    Chatbots have been found to substantially improve the customer satisfaction and
    conversational experience in a number of cases that has enabled organizations
    to substantially increase their lead conversions while providing a tremendous
    amount of actionable analytical insights. This further helps the deployers of
    chatbots to improve and fine tune their marketing approaches or discover new target
    segments that were hitherto not considered by them. Chatbots facilitate collection
    and proper recording of contact'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'information like telephone, email, etc. and also link the analytical insights
    from the gist of the conversations to the customer details enabling the marketers
    to offer customized solutions and detect trends.


    The scalability offered by chatbots with negligible increase in overheads is phenomenal.
    With the different types of features discussed earlier, chatbots offer great savings
    and increased returns on technology investments.


    By deflecting operations through self-service capable menus, the operational costs
    of organizations can be substantially reduced. We are used to a lot of such applications
    in our day-to-day life when we query by phone or through web, our bank or an e-commerce
    company or a utility as well. Using human interventions to high value and difficult
    interactions, the ROI on human capital can be substantially increased.


    In several situations, customers are known to prefer impersonal interactions and
    prefer conversations with automated menus. For example, in the areas of psychotherapy
