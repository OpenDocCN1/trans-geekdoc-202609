  md: 'human competitor). This is the current existing form of AI.


    8. Artificial neural network (ANN): A network modeled after the human brain by
    creating an artificial neural system via a pattern-recognizing computer algorithm
    that learns, interprets, and classifies the sensory data.


    9. ATM/ATVM/AVM/ASCC/ABCC/AIC, etc.: Automatic counters/ Machines for teller,
    ticket vending, product vending for consumers and self-check in and baggage check-in
    and Immigration at airports.


    # B


    10. Backpropagation: This is a short form for ‘backward propagation of errors’.
    It is a method of training neural networks where the system’s initial output is
    compared to the desired output, and then adjusted until the difference (between
    outputs) becomes minimal.


    11. Bayesian networks: It is also known as Bayes network. The Bayes model, belief
    network, and decision network is a graph-based model representing a set of variables
    and their dependencies.


    12. Big data: Large amount of structured and unstructured data that is too complex
    to be handled by standard data-processing software.


    13. Bomb Diffusion Bot:


    Bomb diffusion bots have evolved enormously over the past few decades and are
    being employed by the government of various countries to diffuse bombs before
    their possible explosion. With the help of powerful sensors and x-ray devices,
    robot disposal bots work on detecting improvised explosive devices (IEDs). Its
    gripper arm picks up the explosive material and diffuses with forceful water jets.
    The advanced bomb diffusion bots display human-like dexterity as they are equipped
    with an intuitive control interface, aiding the operator to gain a high degree
    of command and control. Harris T7 which is expected to be delivered by December
    2020 to the British army is considered to be an exemplary bomb diffusion bot.'
