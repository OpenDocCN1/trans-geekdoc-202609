  md: '# DRONED BASED ON SIZE:


    # 1. VERY SMALL DRONES:


    They can be designed with a common size range varying from a large-sized insect
    to a 50 cm long unit. The two most common designs in this category are Mini Drones
    and Nano/Micro Drones. The nano drones are widely used due to their tiny structure
    and light weight construction as they work like essential weapons for spying.


    # 2. MINI DRONES:


    They have a size little bigger than micro drones, which means they can reach up
    to 50 cm in length but will have maximum 2m dimension. Most of these drone models
    are designed with fixed wings type construction whereas a few can have rotary
    wings. Due to their small size, they lack in power.


    # 3. MEDIUM DRONES:


    This category of drones presents heavier units but is lighter and smaller than
    aircrafts. These drones can carry weight up to 200 kgs and have an average flying
    capacity of 5 to 10 minutes. One of the most popular designs under this category
    is the UK watch keeper.


    # 4. LARGE DRONES:


    Large drones are somewhat comparable to the size of an aircraft and are most commonly
    used for military applications.


    Places that cannot be covered with normal jets are usually captured with these
    drones. They are mainly used for surveillance applications.


    Drones can also be further classified into different categories depending on their
    range and flying abilities.


    # CLASSIFICATION OF DRONES ACCORDING TO RANGE OF MOVEMENT, CONTROL AND DISTANCE
    COVERAGE


    +   • VERY CLOSE RANGE DRONES:


