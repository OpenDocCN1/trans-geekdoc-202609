    # Smart Factories of Tomorrow and the Industrial Internet of Things (IIOT)


    With the cutting-edge advances in robotics and automation, the way we work and
    live is expected to change. And although, the factory floor may seem like an improbably
    setting for cutting-edge technological innovation, as per historical trends, manufacturers
    have always been early-adopters of new technologies. They were among the first
    to recognize the value of automation, and we have all seen how automated systems
    have radically transformed our modern factories.


    In the coming years, manufacturing is expected to benefit vastly from IoT solutions.
    As per projections made by Cisco, the number of Machine-to-Machine connections
    is expected to grow to 3.3 billion worldwide by 2021 (Source: Statista).


    After investing heavily in building strong supply chain networks, now in conjunction
    with steadily falling costs of manufacturing, connected IoT ecosystems are the
    next logical steps in the evolution of modern manufacturing. As per another study
    by NASSCOM, 57% of the global IoT manufacturing spending is going to be on field
    devices, followed by 21.8% on construction vehicles and 11.7% on robots in 2020
    (Source: Statista). Automobile and few other factories have already started adapting
    collaborative robots, robotics arms and the Internet of Things coupled with AI
    to produce large parts of the automobile chassis, power trains and other components,
    thus increasing industrial productivity.


    Although much of the robotics technology such as AI or IoT is in the nascent stage,
    the automation market has been growing at a consistent pace with time, and robots
    are able to handle even the most complex manufacturing tasks faster than human
    workers with more precision.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'Now, let’s explore some of the advanced automation technologies that will be
    used in the factories of tomorrow:


    # MACHINE VISION (MV)


    Machine vision is the technology used to provide imaging-based automated machine
    inspection method for applications such as automatic inspection, process control,
    and robot guidance. This technology works as the eye of the advanced production
    process using imaging processes, including conventional imaging, hyper-spectral
    imaging, infrared imaging, line scan imaging, 3D imaging of surfaces, and X-ray
    imaging.


    Smart camera or smart sensors with frame grabbers are used along with interfaces
    such as Camera Link or CoaXPress (or custom interface) to record or capture images
    of the surface to be inspected. And these images are then analyzed and processed
    by specialized analysis software, which mostly use the principle of Finite Element
    Analysis in their working. MV helps automakers save money, justify price points
    and emerge as strong competitors.


    National Instruments, Microscans Cognex, Datalogic, Optotune and ViDi Systems
    are some of the topmost companies whose machine vision systems are preferred by
    large manufacturers. As per the latest market research reports, Industrial Machine
    Vision System market is projected to amplify during 2019-2025.


    # COLLABORATIVE ROBOTS (COBOTS)


    Also known as cobots, these are robots designed to operate autonomously or with
    limited guidance. A cobot uses machine learning to pause all its operations when
    a human worker enters its space.


    According to Dan Grieshaber, Global Director of manufacturing engineering integration
    at General Motors, Collaborative robots (cobots) have become a ‘fundamental game
    changer’ on the automotive factory floor. Because cobots will stop safely if they
    come in contact with a human, this opens up several applications for use as an
    assistant directly on an assembly line, Grieshaber commented.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'As per ISO 10218, there are four types of cobots that incorporate the following
    functionalities: Safety Monitored Stop, Hand Guiding, Speed and Separation Monitoring,
    and Power and Force Limiting robots.


    # ARTIFICIAL INTELLIGENCE (AI)


    Artificial Intelligence system is defined as any system that perceives its environment
    and takes actions that maximize its chance of successfully achieving its goals.


    The smart factories of tomorrow will use the AI support to automate processes
    and machinery to respond to unfamiliar or unexpected situations by making smart
    decisions in contrast to the traditional rules-based approach. Under a rules-based
    approach, a robot cannot identify and select the needed parts from a bin of unsorted
    parts because of the lack of detailed programming required to deal with the numerous
    possibilities in the orientation of parts. Whereas, an AI supported robot can
    pick the desired parts from an unsorted mass, regardless of their orientation.
    As a result, technical systems will be more flexible and adaptable.


    # COGNITIVE COMPUTING (CC)


    Cognitive Computing (CC) refers to technology platforms based on artificial intelligence
    and signal processing. These platforms encompass and use machine learning, reasoning,
    human language processing, speech and object, human–computer interaction, dialog
    and narrative generation to simulate human thought process in a computerized model.


    Cognitive computing platforms are being used by leading automobile manufacturers
    such as BMW; for instance, to learn about how drivers and their cars’ systems
    can interact more comfortably and naturally. BMW strongly believes that cars of
    the near future will pilot themselves, rather than relying on human drivers and
    it aims for its vehicles to achieve full ‘level 5’ [1] autonomy by 2021 with the
    help of these cutting-edge technologies. Boston Consulting Group estimates that
    the market for comprehensive vehicle connectivity will be 159 billion USD by 2020.'
  merge: -1
  img_proc: true
