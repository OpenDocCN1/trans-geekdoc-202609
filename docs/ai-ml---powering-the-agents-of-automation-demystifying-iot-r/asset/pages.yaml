    +   \n+   e) Blockchain's cryptographic techniques may assure the immutability\
    \ of the ledger but not that of the overall system. For example, there have been\
    \ numerous attacks on the paraphernalia surrounding the Blockchain platforms like\
    \ exchanges, wallets, etc.\n+   \n+   f) Blockchain aims at digitizing real-world\
