- pgno: 33
  md: 'Machine learning algorithms such as SVM (Support Vector Machine), Random Forest,
    Naïve Bayes classifier,


    KNN (K nearest neighbour), etc. are used to discover patterns present in data
    which cannot be found by humans in normal course.


    The tools enable the system to iteratively evolve the most appropriate combination
    of dependent variables by going through multiple steps that are implemented over
    large test data. Once the most appropriate models that explain the patterns found
    in test data has been evolved. The next step is to reduce the dimensionality of
    the data drastically to discover and weed out unconnected variables. This process
    is then repeated for a further refined model that closely explains the behavior
    of the subject being explored.


    Thus, machine learning enables continuous improvisation in performance of systems
    that evolve with time and experience with the availability of more data sets describing
    the process.


    # MACHINE LEARNING HAS FOUND APPLICATION IN SEVERAL AREAS:


    +   - Analysis of consumer behavior.

    +   - Fraud detection in financial products and services consumption.

    +   - Recommendation engines in media and e-commerce.

    +   - Stock market trading to predict the movement of share prices.

    +   - In the field of digital marketing: Email, social media and search engines
    for automatic response generation, targeted promotions, and advertisements.

    +   - Social media such as Facebook and LinkedIn for accurate feeds, facial recognition,
    etc.

    +   - Healthcare (for example, cancer cell discovery).

    +   - Gene discovery and their classification and numerous other applications
    in researching and analyzing consumer behavior.


