  md: '# WHAT IS RPA OR ROBOTIC PROCESS AUTOMATION?


    RPA consists of the following three terms:


    **ROBOT:** A robot refers to a piece of computer coded software that can mimic
    user interactions and routine manual activities with utmost precision across the
    areas of its deployment and could be rule-based or unstructured.


    **PROCESS:** A process refers to an activity or a sequence of steps that is carried
    out on an input to result in an output in a regular and routine manner. This could
    be across various functional and non-functional areas of an organization and lends
    a method and a system of approach to any task in a professional organization,
    lending it dependability, accountability, repeatability and credibility.


    **AUTOMATION:** Automation refers to the approach of carrying out the processes
    without a manual intervention by leveraging information technology tools and systems.


    Thus RPA means automation of repetitive, rule-based processes across functional
    areas and different applications in an organization with robots that mimic the
    human activities, thus replicating the same.


    Routine jobs like data entry tasks, accounting entries, invoicing, expense filing,
    auditing against a set rules, etc. can now be automated and integrated into the
    rest of the IT systems in the organization resulting in high precision, tremendous
    scalability and ease of reconciliation. RPA is very different from other automated
    routine processes performed by Chatbots, voice assistant and personal assistants.
    RPA are automation tools for rule-based processes mainly in financial and accounting
    domains controlled by business operation teams and managed by the IT department
    in the organization.


    Implementation of RPA has proven to improve efficiency and increase speed of operations
    while reducing expenses, thus resulting in an all-round operational excellence
    and customer satisfaction in organizations.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# LEVELS OF RPA:


    Based on the capabilities of the RPA system, there are different types of RPA
    platforms available from simple to complex. At the basic level, RPA can be leveraged
    for automation of simple rule-based tasks like form filling, survey aggregation,
    etc. The bots that perform such functions are called Programmable RPA bots.


    A typical RPA involves automation of invoicing and accounting activities that
    will encompass a number of routine processes leading to input transformations
    and output generation. For example, this can involve the creation of an invoice
    by updating a number of fields taken from a variety of other applications like
    CRM, ERP, etc. and posting the output to customers while updating the internal
    systems.


    The bot finds its action based on inputs gathered from the other systems in the
    organization and produces outputs and performs various other actions to update
    and communicate with the external world through emails, report and dashboard generation,
    etc.


    AI and ML powered RPA involves programming-based, UI-operable software robots
    with the ability to work with structured semi-structured and unstructured data
    as well. There are two types of AI powered bots:


    +   - Self-learning solutions trained by observation of the various activities
    by the existing manual systems learn the same and start executing the tasks.

    +   - Intelligent bots using advanced cognitive capabilities possess capabilities
    such as vision, Natural language Processing capabilities and pattern recognition,
    etc. and these can work on both structures and unstructured data as well.


    # RPA AND BPM (BUSINESS PROCESS MANAGEMENT):


    In professional organizations, there is a lot of accent on Business Process Management
    (BPM). Business process management involves continuous evaluation and engineering
    of processes across the functional and non-functional areas to ensure a lean management,
    de-bottlenecking of'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'redundant processes, through optimal utilization and orchestration of organizational
    resources for enhanced productivity.


    RPA complements the BPM activities by automating a number of manual and repetitive
    steps by leveraging cutting-edge technology tools and platforms, thus offering
    a high ROI (Return on Investment).


    RPA is increasingly making its effectiveness felt across multiple large organizations
    who employ a number of staff for managing their business processes and operations.
    In many cases, there has been over 50% reduction in manpower and technology leaders
    offering RPA platforms that are providing outsourced services to these organizations
    by managing their operational and financial departments at much reduced monthly
    costs after leveraging RPA.


    Mckinsey & Co. predicted that 45% of all human performed activities can be automated
    by leveraging advanced technologies available today; the predominant being AI
    and ML powered analytics, RPA and Blockchain.


    As per NASSCOM, RPA has been found to reduce onshore process operations costs
    by 35-65% and offshore delivery costs by 10-30%, resulting in a recovery period
    of 6-9 months.


    As per IRPAAI, an RPA bot agent costs less than one-third of the cost of an offshore
    full time employee and one-fifth of the price of an onshore worker.


    # The PREDOMINANTLY TYPES OF ROLES IN RPA PROJECTS:


    # PROCESS DEVELOPERS


    The Robotic process automation project begins with the identification and assessment
    of processes that contain repetitive workflows that can be automated with minimal
    impact of manpower but maximum impact on productivity.'
  merge: -1
  img_proc: true
