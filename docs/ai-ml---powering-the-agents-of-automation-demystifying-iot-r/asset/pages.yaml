- pgno: 199
  md: 'Let us take a look at the typical malware attacks and see how the Blockchains
    manage the same:


    (1) SPOOFING: This involves use of a token or other credential information to
    pretend to be an authorized user of the platform. Many forms of attack like Sybil,
    Malware, Credential stuffing, Man in the middle (MITM) attacks involve the users
    being misled to fake sites or non-users gaining access to user’s credentials to
    transact on the system.


    Hence, key management and identity tracking through the operation are an important
    part of the security offered by the Blockchain system. Protocols like the BIX
    protocol enable the correct identification of users and in enterprise applications,
    each user is provided a X.509 digital certificate that identifies and tracks his
    transactions. If any spurious transactions are detected that go against the interests
    of the participants, the identified participants are immediately rusticated from
    the system.


    (2) DDOS (DISTRIBUTED DENIAL OF SERVICE ATTACKS) : DDOS attacks are executed by
    botnets that compromise the identity of connected systems and use the same to
    flood targeted websites with unmanageable traffic, thus forcing their shut down.
    Strong identity management and access controls provided at each node ensures that
    unauthorized participants cannot compromise and gain access to the connectivity
    of the compromised system, thus preventing the attack. Companies like Guardtime
    from Estonia are working on offering a Blockchain-enabled system that offers an
    additional bandwidth from connected peers, at times of increased load owing to
    such attacks, thus enabling them to see of the burden without a shut down.


    (3) RANSOMWARE ATTACKS: Ransomware attacks involve the blocking of access to an
    institution to one’s own data by the attackers. The distributed nature of the
    ledger in a Blockchain such as an attack improbable and ineffective as the attacker
    has to attack all the ledgers distributed across the system at the same time.
    Elimination of the single point of contact and the replication of data effectively
    disincentivizes the developers and perpetrators of Ransomware.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '(4) TAMPERING AND REPUDIATION: The improbability of the ledger manipulation
    ensures that the contents of the ledger are neither tampered nor denied by a participant
    without leaving a trace of the credentials of those attempting the same. Hence,
    a Blockchain can be considered tamper evident, immutable platform, and the only
    way in which this can be done is by passing reversal/modification transactions
    through subsequent approved transactions.


    (5) INFORMATION DISCLOSURE: In public Blockchains, the transactions are open for
    anyone to query, and the identity of the participants is protected using pseudonyms
    or other appropriate programs in case of Blockchains offering anonymous transactions.
    In case of private Blockchains, the transactions are protected cryptographically
    so that only authorized participants can view data relevant to them, using their
    private keys. Further, any entity or participant can only access the data that
    is programmatically approved by the access control mechanism approved by the administrators
    of the network. Any modification in access privileges must be authorized and approved
    by the authorities mentioned in the program.


    Thus, in order to ensure integrity and safety of Blockchain-based systems, the
    implementers should ensure adequate control and employ best practices in the following:


    +   i. Key management

    +    ii. Software development and testing

    +    iii. Connectivity with external data sources and integration with front-end
    and backend systems

    +    iv. Using appropriate digital signature and validation mechanism for authorizing
    transactions

    +    v. Dynamic access control systems to ensure only the actual authorized participants
    are approved to transact by revoking the approval to those who cease to be members
    or are transferred to other positions in the organization.


    It is a common practice for all Blockchain implementers to provision for a team
    that continuously scans the environment for evolving threats and also budget for
    and conduct hackathons to attack and compromise their'
  merge: -1
  img_proc: true
