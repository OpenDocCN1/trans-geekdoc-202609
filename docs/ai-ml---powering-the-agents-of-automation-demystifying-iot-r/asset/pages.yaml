  md: '# CHAPTER 6


    # Robotic Process Automation


    # INTRODUCTION:


    Robotic Process Automation (RPA) aims to leverage technology in automating a number
    of repetitive jobs with the help of artificial intelligence, algorithms and machine
    learning tools. RPA offers enormous amount of benefits over human operations with
    high precision, consistency, scalability and flexibility. By being able to work
    24 hours, RPA can help enormous amount of data crunching and manipulation by undertaking
    tasks in invoicing and accounting, expense management and auditing functions without
    fatigue and error across multiple languages and geographical locations. AI agents
    have proven themselves in language translations at break-neck speeds. In this
    chapter, we will explore RPA from a variety of angles in order to appreciate the
    potential of this new age paradigm of enhancing productivity and gaze into the
    future to project its future course in tandem with other internal and external
    applications and cutting edge technology paradigms.


    # STRUCTURE:


    +   - Robotic process automation: Why, What, How, Where?

    +   - Describe business process management

    +   - Types of roles in a RPA projects

    +   - RPA Vendors

    +   - Examples of RPA applications and Implementations'
  merge: -1
