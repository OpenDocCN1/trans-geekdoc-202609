- pgno: 15
  md: '# CHAPTER 1


    # Introduction to Automated Personal Assistants: Past, Present and Future


    Automatic teller machines, automatic vending machines, automatic ticket vending
    machines, automated check-in counters, automated baggage check-ins at airports,
    and automated immigration counters at international airports are some of the machines
    we see in our day-to-day life. The various places where we use automated machines
    is shown in the following image:


    ![](img/3531370aa21067bbdc45128741d34edb_15_0.png)


    Fig. 1.1: Automatic machines for tickets, cash and products and at airports for
    check-in, baggage, and immigration'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'Completely automated retail counters (e.g. Amazon GO), hotels and restaurants,
    personal assistants such as Apple Siri, Google Home, Amazon Echo are the manifestations
    of automation enabled by advanced technologies like Artificial Intelligence and
    Machine learning that we are experiencing more and more.


    The complete transformation that a retail store undergoes with automation is depicted
    in the following image:


    ![](img/3531370aa21067bbdc45128741d34edb_16_0.png)


    Fig. 1.2: Amazon Go: Advanced technologies to fully automate the retail experience


    (Figure courtesy: https://www.amazon.com/ )


    From ATMs of the yesteryears to the advanced voice activated personal assistants
    that understand our needs and moods to respond are replacing many jobs that were
    hitherto being done by human beings. This is a growing and irreversible trend
    of these manifestations of automation.


    It is possible that in the future that when you pass by an ATM in a bank, it identifies
    you by name, recognizes your need for a loan and offers you attractive terms on
    the spot while enticing you to its location using a voice activated and geolocation
    targeted message. This then would be the foreseeable future of the banking as
    we know. The same can be true for any area as the power of AI is considerably
    enhanced with the confluence of Big data, Cloud and Machine learning technologies.'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'Welcome to the world of humanoids and autonomous machines.


    ![](img/3531370aa21067bbdc45128741d34edb_17_0.png)


    Figure 1.3: It is going to be difficult in future to identify whether you are
    dealing with a man or a machine!


    We will take a close look at these agents of automation in the coming chapter
    as we analyze the anatomy of these machines and track their journey into the future.'
  merge: -1
