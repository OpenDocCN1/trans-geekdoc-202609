  md: 'will soon find highly automated and comprehensive solutions that will further
    increase the added value of using drones. But companies must consider that drones
    and artificial intelligence only make sense if it saves the user money/time. In
    some cases, the traditional computer vision (in combination with ML/DL) still
    might be an an easier and better solution.


    # USES OF AI IN THE DRONE INDUSTRY


    Drones powered by AI are used in a variety of industries for various applications.
    Some of the prominent use cases where drones and AI are used in conjunction are
    listed below.


    +   - **CONSTRUCTION SITES:**

    +     Construction companies use AI drones to scan and map the terrain of building
    sites, doing in 15 minutes a job that takes days for humans to complete, Drones
    give a bird’s eye view of the construction vehicles during the project, providing
    information to possibly create self-guided equipment in the future.

    +   - **SMART CITIES:**

    +     A team at Microsoft Research says self-driving cars will be common by 2020,
    and the technology will spread to delivery of vehicles, including everything from
    take away food and prescription of medications to public services. Drones may
    also be used to solve traffic problems or engineering dilemmas. In Rwanda, the
    use of AI has already lowered the wait for blood for transfusions from four hours
    to fifteen minutes.

    +   - **EMERGENCY DRONES:**

    +     Drones can be used to drop supplies to disaster victims in areas that are
    nearly impossible to reach. Possibilities range from food for hurricane victims
    to medications for snake bites to hikers in the wilderness. They can also analyze
    the structural damage after a disaster, help firefighters see the exact locations
    of a fire, aid with chemical spills, and show emergency responders where to locate
    injured people. They can carry police cameras and pepper sprays or handle violent
    behavior on the spot in large crowds, as well as provide remote consultations
    with doctors.'
