- pgno: 239
  md: '50. Perception is a process of acquiring, interpreting, selecting, and organizing
    sensory information. It is what you perceive, which may be true or false, as opposed
    to the ground truth which is always true.


    51. Perceptron: Perceptron is a ML algorithm for supervised learning of binary
    classifiers. A binary classifier is a function which can decide whether or not
    an input, represented by a vector of numbers, belongs to some specific class.


    52. Precision: Out of a given dataset, how many are selected to use.


    # R


    53. Reactive machines: Software applications that can analyze, perceive, and make
    predictions about experiences, but do not store data; they react to situations
    and act based on the given moment.


    54. Recall: Out of selected data, how many are processed.


    55. Recurrent neural network (RNN): A type of neural network that makes sense
    and creates outputs based on sequential information and pattern recognition.


    56. Reinforcement learning: A machine learning method where the reinforcement
    algorithm learns by interacting with its environment and is then penalized or
    rewarded based on decisions it makes.


    57. Robotics: A branch of technology focused on the design and manufacturing of
    robots that exhibit and/or replicate human intelligence and actions.


    58. Robotic process automation (RPA): RPA uses software with AI and ML capabilities
    to perform repetitive tasks once completed by humans.'
  merge: -1
  img_proc: true
