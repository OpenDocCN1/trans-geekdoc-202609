- pgno: 177
  md: '# AUTONOMOUS CARS USE THE FOLLOWING ESSENTIAL TECHNOLOGIES:


    # 1. GPS (GLOBAL POSITIONING SYSTEM):


    The **Global Positioning System (GPS)**, originally Navstar GPS, is a satellite-based
    global navigation system owned, maintained and freely offered to anyone with a
    GPS receiver by the United States government and operated by the United States
    Air Force. It provides the geolocation and time information to a GPS receiver
    anywhere on or near the Earth where there is an unobstructed line of sight to
    four or more GPS satellites. Obstacles such as mountains and buildings block the
    relatively weak GPS signals. The GPS provides critical positioning capabilities
    to military, civil, and commercial users around the world. All autonomous vehicles
    like drones, cars and other mobile devices adorn a GPS receiver that helps them
    to position themselves and navigate to the desired locations. GPS is becoming
    a standard feature even for manual cars to help the users navigate anywhere in
    the world with the help of the satellite signals.


    # 2. SENSORS:


    A variety of sensors like LIDARs, RADARs and Cameras help autonomous cars to gauge
    the environment and assess the surroundings.


    The various types of sensors that enable the autonomous car to sense the distances,
    objects, obstructions and enable it to manoeuvre the roads smoothly and reach
    their destinations are well depicted in the following figure. These sensors collect
    the information about all the surrounding objects and feed it to the central processing
    unit of the car, which with the help of advanced AI and ML techniques processes
    the same and enables the right decision and corresponding action to be taken by
    the machine to plan and move ahead.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '![](img/3531370aa21067bbdc45128741d34edb_178_0.png)


    Figure 9.3: Different sensors in an autonomous vehicle


    # A. LIDAR ( LIGHT DETECTION AND RANGING)


    Lidar is an acronym for Light Detection and Ranging and is a laser-based system.
    It consists of a transmitter (laser) and a highly sensitive receiver. It is used
    primarily to measure distances to stationary as well as moving objects. The system
    sends out pulses that are reflected off objects. This provides a 3D view of the
    objects. Lidar sensors help to detect the edges of roads and identify lane markings
    by bouncing pulses of light off the car’s surroundings.


    # B. RADAR (RADIO DETECTION AND RANGING)


    Radar sensors are embedded around the car’s surface and enable it to monitor the
    stationary and dynamic objects moving around it in a dynamic manner by feeding
    the relevant information to the car’s control systems.'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'Radar is a detection system that uses radio waves to determine the range, angle,
    or velocity of objects. It can be used to detect aircrafts, ships, spacecrafts,
    guided missiles, motor vehicles, weather formation, and terrain. A radar system
    consists of a transmitter producing electromagnetic waves in the radio or microwaves
    domain, a transmitting antenna, a receiving antenna (often the same antenna is
    used for transmitting and receiving) and a receiver and processor to determine
    properties of the object(s). Radio waves (pulsed or continuous) from the transmitter
    reflect off the object and return to the receiver, giving information about the
    object''s location and speed.


    The various types of sensors used in the car are thus responsible for a different
    type of function, depending on the distance and type of object which needs to
    be sensed and the type of activity to be undertaken. The same can be well summarized
    in the following figure:


    **Self Driving Cars Vision System''s Range**


    | Sensor | Range |

    |---|---|

    | Far radar | 300 meters |

    | Front camera | 50 meters |

    | Near radar | 20 meters |

    | Side cameras | 3 meters |

    | Ultrasonic sensors | 1 meter |

    | Rear camera | 50 meters |


    Figure 9.4: Self-driving car sensors and their range'
