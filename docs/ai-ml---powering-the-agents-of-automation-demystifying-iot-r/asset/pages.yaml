  md: '# CHAPTER 5


    # Robots


    # INTRODUCTION:


    Robots can perform complex tasks easily by performing complex operations to build
    houses using 3D printing with utmost precision. They have the ability to move
    about in the environment and take the place of humans in dangerous environments
    or manufacturing processes, or resemble humans in appearance, behavior, or cognition.


    With the help of sensors, robots can manage to avoid obstacles on their paths
    and achieve their goals with or without prior planning, depending on the complexity
    of their implemented program.


    Robots operations are characterized by sense (perception), process (interpretation
    and planning), and action (movement of some kind).


    Artificial Intelligence and Machine learning have resulted in a manifold improvement
    in the capabilities of the robots of today and this is discussed in this chapter.


    # STRUCTURE:


    +   - Skills of a robot

    +   - Advantages and disadvantages of robots

    +   - Laws of robotics

    +   - Systems in a robot

    +   - Components of a robot

    +   - Building a good robot'
  merge: -1
