    # HOW AI HELPS IN BUILDING SELF-dRIVEN CARS?


    The AI element of the application helps us in processing images and sound data.
    It processes the data and identifies different objects which are in the frame.
    For example, vehicles on the road, people, signals, and footpath. Once it identifies
    them, then it works on the position of each object and accordingly the car changes
    its path or if it identifies that the signal is red, then the car stops.


    With the help of the Global Positioning System, the start position, targeted position,
    current position and also the knowledge of the routes along with traffic congestions
    and predicted wait times, the car plans the most appropriate route map to reach
    its destination. The central controller sends instructions to the vehicle’s actuators
    which control acceleration, braking, and steering. Various elements of AI-like
