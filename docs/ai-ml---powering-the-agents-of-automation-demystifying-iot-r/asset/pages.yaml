    Many communication technologies such as Wi-Fi, Bluetooth, Zigbee and cellular
    are well known, but there are also several new emerging networking options such
    as Thread used as an alternative for home automation applications, and Whitespace
    TV technologies being implemented in major cities for wide area IoT-based use
    cases.


    # 1. WI-FI


    Wi-Fi is the choice for many developers because of its wide existing infrastructure
    as well as its ability to handle high quantities of data with rapid data transfer.


    # 2. BLUETOOTH


    Bluetooth, a short-range communication technology is expected to be the key for
    wearable products in particular, connecting to the IoT via a smartphone in most
    of the cases. The new Bluetooth Low Energy (BLE) or Bluetooth Smart is a significant
    protocol for IoT applications as it offers significantly reduced power consumption.


    # 3. ZIGBEE


    Zigbee, like Bluetooth, has a large installed base of operation, more in industrial
    settings. Zigbee/RF4CE offers low-power operation, high security, robustness and
    high scalability with high node counts and is well positioned to take advantage
    of wireless control and sensor networks in M2M and IoT applications.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# 4. CELLULAR


    IoT applications requiring operations over longer distances can leverage GSM/3G/4G
    cellular communication capabilities. Cellular is capable of sending high quantities
    of data, especially for 4G; however, the expense and power consumption is deemed
    to be high for many applications. Cellular can be ideal for sensor-based low-bandwidth-data
    projects that will send very low amount of data over the Internet.


    # 5. LOWPAN


    6LowPAN (IPv6 Low-power wireless Personal Area Network) is a network protocol
    that defines encapsulation and header compression mechanisms.


    # 6. Thread


    Thread is a relatively new IP-based IPv6 networking protocol aimed at the home
    automation environment. It is primarily designed as a complement to Wi-Fi as it
    recognizes that while Wi-Fi is good for many consumer devices that it has limitations
    for use in a home automation setup.


    # 7. LoRaWAN


    LoRaWAN targets wide-area network (WAN) applications and is designed to provide
    low-power WANs with features specifically needed to support low-cost mobile secure
    bi-directional communication in IoT, M2M and smart city and industrial applications.
    LoRaWAN is optimized for low-power consumption and can support large networks
    with millions and millions of devices.'
  merge: -1
  img_proc: true
