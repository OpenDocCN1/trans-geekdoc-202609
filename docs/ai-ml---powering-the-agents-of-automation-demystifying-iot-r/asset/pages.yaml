    capability.

    +   - Commercial use of drones include crop monitoring, freight services, film
    videography, infrastructure surveillance, geographical mapping, security and industrial
    application.

    +   - Civilian use of drones include damage assessment of property and life during
    natural calamities, critical infrastructure monitoring, traffic monitoring, crisis
    management, search and rescue, forest fire monitoring and security.

    +   - With the advancement of technology in connectivity, GPS, videography, controllers
    and sensors, drones have evolved for multiple uses and strengthened their acceptance
    across industries.

    +   - The potential application of drones for commercial purposes have led to
    major R&D investments by companies in the internet, logistics, e-commerce, defence
    and, oil and gas sectors.'
