- pgno: 125
  md: '# FARMING:


    In the past, farmers relied on experience and intuition for things like the best
    time to plant their crops or sow seeds for a garden. AI technology helps them
    do everything from determining the best time to plant to applying the right amount
    of fertilizer at just the right time. It can also aid farmers in spotting diseased
    crops or for managing solar farming technology.


    # MILITARY AND DEFENSE:


    Google is currently working with Pentagon to develop AI for unmanned combat, and
    the technology is already being used for tasks like patrolling borders, tracking
    storms, performing safety inspections, and monitoring security. Military drones
    can carry supplies, weapons, or cameras.


    # INDUSTRIAL INFRASTRUCTURE:


    Drones are being used by companies like the GE subsidiary Avitas Systems to inspect
    their infrastructure, including power lines, transportation, and pipelines. Drones
    can do the job more efficiently and safely, but they can also prevent problems
    by identifying inconsistencies in data. Some railway companies use drones in their
    safety inspections.


    # FACE RECOGNITION AND INSURANCE CLAIM PROCESSING:


    Some insurance companies use drones to survey damaged buildings, snapping images
    and wirelessly transmitting to the company for faster processing. Other companies
    use drones for simplifying face recognition or deterring cyber attacks, and the
    taxi-alternative Lyft is used for researching self-operated cars.


    # AMATEUR DRONES:


    One company is developing a drone that can be used out-of-the-box by anyone who
    is interested in photography but is particularly suited for photographers who
    are also surfers, downhill skiers, UAV pilots, or runners. It also has applications
    for recording action sports and other events in real time.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# REAL-TIME DATA:


    Drones can be used by commercial, industrial, and service organizations to provide
    instant surveillance in multiple locations instantly, eliminating the need for
    human surveillance or spending endless hours searching through recorded information.


    # CREATING PERFECT MODELS FOR INSTRUCTION:


    An article in Forbes discusses the use of drones to analyze accumulated data and
    use it to produce a training manual that shows employees how to be smarter, faster,
    and more precise on their jobs.


    # REAL ESTATE:


    Sophisticated drones with cameras are being used by real estate companies to provide
    photographs of homes and commercial buildings, as well as aerial maps and local
    information for home buyers.


    # ENTERTAINMENT, MEDIA, AND THE INTERNET:


    Filmmakers and news media are using drones to capture aerial footage, sometimes
    without the Federal Aviation Administration’s (FAA) permission, and to shoot scenes
    on closed sets. So far, the FAA has not approved drones for use by the media,
    forcing them to rely on footage by private users. Mark Zuckerberg of Facebook
    recently announced a plan to provide internet access to remote areas of the globe
    by using solar-powered drones.


    # SUMMARY and CONCLUSION


    Drones or Unmanned Aerial Vehicles have come a long way in the recent years to
    participate in a number of areas ranging from photography, supply chain, geological
    surveys, disaster management, surveillance and security and many more.


    Drones can go to places that are inaccessible to people, capturing powerful images
    and recording important data that would otherwise be unavailable. From drones
    that helped in Puerto Rico’s hurricane recovery to unmanned NASA vehicles that
    transform from drones to planes while in flight, scientists are using UAVs with
    artificial intelligence to make great changes in the world.'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'Artificial intelligence can be used to create machines that perform tasks more
    efficiently than humans, allowing them to work in stressful environments 24 hours
    a day all year long with no lunch breaks, sick days, or paid vacations. This has
    already led to otherwise impossible feats in areas like space travel and medicine
    and could be the answer to global issues like world hunger and nuclear holocausts.


    As machines develop the potential to improve the world, scientists ask an important
    question such as what will happen if machines use their cognitive skills to perform
    malevolent acts instead of benevolent ones? This could happen in one of the two
    ways. AI might be programmed to do something beneficial and unwanted side effects
    could occur along the way. Or, it could fall into the wrong hands and be programmed
    to be destructive. Because AI has the possibility of evolving as it performs and
    adjusts to meet its objectives, its actions could be hard to predict.


    Several privacy advocates have started arguing that this will allow any individual
    to purchase a drone and spy on people right in their homes and backyards. This
    is why it is necessary to install such procedures that drone operators are unable
    to use the drone for personal purposes which they have not been licensed for.


    As drones start making their presence felt in various domains like surveillance,
    military, logistics, photography and advertising, what scares us is the continued
    assault on personal privacy and threat to national and individual security that
    these flying objects pose to the ordinary citizens in the day-to-day life.


    Possibilities are many, but challenges are also manifold, and these require new
    approaches from the regulators and homeland security and also technology companies
    to jam areas to protect privacy. After all one does not want a bird-shaped drone
    peeping into your living rooms or offices photographing and transmitting sensitive
    information!'
