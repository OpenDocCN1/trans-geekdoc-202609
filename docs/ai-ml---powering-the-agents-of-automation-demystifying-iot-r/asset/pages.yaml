    in transport and other operational activities.

    +   - Drones provide a more economical visualization and navigation for applications,
    including mapping, surveillance and package delivery from the air. These unmanned
    drones equipped with cameras are able to reach remote locations and perform complex
    tasks.

    +   - Currently, drones are majorly used in military applications and market for
    other applications is at a nascent stage, but is anticipated to rise in coming
    years driven by both consumer adoption and advancing technologies.


