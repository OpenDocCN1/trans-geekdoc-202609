- pgno: 182
  md: '# CHALLENGES


    AI algorithms are constantly trained to make them more accurate in terms of identifying
    different objects. Once trained on the data, the application starts classifying
    different images that it receives into classes like vehicle, person, road, signal,
    etc. There could be a scenario in which we have trained the algorithm to identify
    cars on the road but did not train to identify auto rickshaws, so it will fail
    to identify it or a concept car comes in front of our self-driving car which it
    will fail to recognize. So, the challenge is to work on all possible objects or
    scenarios which can come into play and train the algorithm to adapt to any situation
    or possible scenario.


    # LIMITATIONS


    Let’s just say that we trained it identify a person, but if the person is waiving
    his/her hand, then the algorithm doesn’t understand if the person is asking them
    to stop or they are just saying Good Bye. Also, every person will waive differently
    so it becomes difficult for an algorithm to capture this kind of gesture and even
    if it captures it, it is very difficult to understand the context.


    # OTHER LIMITATIONS OF AUTONOMOUS CARS:


    Autonomous cars operate on battery operated systems. Hence, it is required that
    the batteries are long lasting, maintenance friendly and easily chargeable. Charging
    points for batteries need to be conveniently located in public places or at points
    along the routes and parking places with easy access. These sort of features and
    facilities take a long time to build by various governments across the world,
    especially in developing countries.


    The cars are more than 5-6 times costly compared to manual/semi-automatic cars
    of corresponding shape and size and are out of reach for most of the population.
    The prices are, however, reducing dramatically every year at the rate of 20% per
    year leading to a very high CAGR across the markets in developed countries.'
  merge: -1
  img_proc: true
