  md: '# Preface


    We live in an autonomous world. Billions of people and many more trillions of
    living organisms are using the resources of the universe which are apparently
    not made by living organisms but by the laws of nature.


    The sun, moon, stars and the forces of nature are going about their paths in a
    routine manner for billions of years giving us seasons and all the great experiences.


    The human being’s quest for unearthing ‘God’ or emulating Him by any means is
    manifesting in a number of ways, including the launch of autonomous devices and
    humanoids, that one day they may be more ubiquitous than the human beings.


    Unmanned spacecrafts that hit their targets precisely on another planet are indeed
    a wonder to many.


    The same autonomy is deemed to be transplanted into many more aspects of our modern
    life.


    Chatbots, voice assistants, drones, AI-enabled robots and autonomous cars are
    now being ‘employed’ increasingly.


    On the other hand, we have seen the launch of Bitcoin Cryptocurrency which has
    become the largest unmanned, unowned and unmanaged peer-to-peer network running
    on its own as a ‘Decentralized Autonomous Organization’ without any interference
    for over 10 years. We are witnessing an increasing trend towards autonomy, decentralized
    approach, open source, and pay-as-you-go approaches.


    Where this all will lead to is anyone’s guess or a calculated forecast.


    But it is imperative for us to take a close look at these developments, understand
    their dynamics and be prepared for the future.


    We should be knowledgeable enough to foresee and leverage the forces of disruption
    and stay ahead of the rest. Only then our survival is assured, lest we would be
    blown away by these powerful waves of disruption. This book ‘Agents of Automation’
    takes a close look at the'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'various disruptive technologies that are shaping our world and enables everyone
    to take a pragmatic view to leverage them to ‘Augment’ our performance by making
    them our ‘Agents’ too.


    Further, the power and utility of Blockchain is well examined as a tool to de-risk
    the growing threat of malware attacks and cybercriminals that could not only be
    a spoil sport but also provide dangerous twists along the way.


    Blockchain allows us to scale our automation by striking the threats of data breaches
    and cyberattacks at their very roots, thus making the scaling through automation
    a delightful reality that improves the quality of life of all concerned. The readers
    are sure to enjoy this journey into the future!'
  merge: -1
  img_proc: true
