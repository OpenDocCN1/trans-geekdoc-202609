  md: '# CHAPTER 13


    # Summary and Conclusion


    We have been witnessing an unprecedented level of automation sweeping across the
    globe, ever since the advent of machine learning powered Artificial Intelligence
    and the enabling technologies such as Cloud, Big Data and Analytics have started
    acting in tandem. Banks, airports, hotels, restaurants, BPOs, retail, high-end
    residencies and even our day-to-day travel are in the process of going virtually
    human operation free.


    The main objective of this book is to familiarize how technology is impacting
    and manifesting itself in the form of various tools, application and forms which
    we have termed as ‘Agents of Automation’.


    In this book, we saw the various elements of automation that are powering the
    ‘Autonomous’ revolution today from various angles. We provided examples for each
    of the above areas along with a detailed analysis of where this phenomenon is
