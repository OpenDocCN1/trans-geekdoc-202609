    # 1.1.3 Scaling of CMOS


    In order to make the device more feasible the power consumption of these transistors
    could be reduced. The static power dissipation could be lowered by reducing the
    OFF-state current and the supply voltage. The reduction in supply voltage reduces
    the ON-state current; thus, it should be lowered very efficiently. The reduction
    in OFF-state current is another option, which can be achieved by controlling factors
    discussed in Section 1.7. For reduction in dynamic power dissipation, we need
    to reduce the parameters load capacitance $C_L$, frequency of operation $f$ and
    switching probability $\alpha$. The frequency of operation determines the computational
    speed, so it needs to be increased. The parameter $\alpha$ determines the switching
    probability of the digital circuit so it cannot be changed. The load capacitance
    $C_L$ is basically reduced by minimizing the area of MOSFET. This reduction in
    area of MOSFET allows for scaling of MOSFET. A reduced gate length increases the
    ON-current, as $I_{ON}$ depends inversely on gate length. A reduced capacitance
    also increases the frequency of operation. The scaling also reduces the number
    of transistors on a single chip, which is essential in this era of miniaturization.
    Thus, scaling is the way forward for reduced power consumption. Constant field
    scaling and fixed voltage scaling are two methods of scaling done in the industry.
    In the constant field scaling, which is called Dennard’s scaling rule, the supply
    voltage is scaled in the same ratio as dimensions of MOSFET. For the fixed voltage
    scaling, the supply voltage is unchanged. Table 1.1 shows the scaling factor of
    various device structure parameters.


    # 1.1.4 Moore’s Law


    One of the famous laws which had predicted the scaling of transistors accurately
    is Moore’s law. G. Moore had forecasted that the scaling of transistors on a single
    chip will double after every 18 months. This law worked perfectly for around 40
    years through CMOS scaling'
