    # 4.2 THEORETICAL AND EXPERIMENTAL INVESTIGATIONS ON SILICENE AND GERMANENE


    Ever since the idea of flat structure of C-atoms packed in a hexagonal arrangement
    came into existence, the researchers have been continuously eyeing new materials.
    Both theorists and experimentalist have continuously explored new evidences for
    the existence of 2D materials. Studies suggest that not only materials but their
    novel synthesis methods play a crucial role in differentiating the intrinsic properties
    of these materials. Here are few of the seminal works primarily focused on theoretical
    and experimental evidences of silicene and germanene.


    Takeda et al. [65] have, for the first time, theoretically predicted the existence
    of silicene and germanium-based graphene-like structures based on the first-principles
    calculations. Studies show that unlike graphene, the Si- and Ge-based structures
    exist in slightly buckled form. Further, they calculated the electronic band structures
    that indicated the same Dirac cones near the Fermi level as predicted for graphene.
    A merry first-principles study conducted by Cahangiro et al. [66] suggested that
    indeed silicon and germanium-based structures possess honeycomb structure like
    graphene. However, they emphasized that low buckling structures are energetically
    more favorable compared to the planar and high buckling forms. However they show
    that Dirac cones still exist in these structures and are the promise of high electron
    mobility with these structures. Studies for a one-dimensional graphene structure,
    namely nanorbons for silicene and germanene, were also carried out. Lalmi et al.,
    [67] have presented the experimental evidence for a (√3×3) silicene sheet grown
    on an Ag (111). Atomically resolved tunneling microscopy (STM) images presented
    in the work imply that condensation of a silicon atom flux onto the single-crystal
    Ag substrate under high-vacuum conditions is practically achievable. STM images,
    they showed two distinct silicon sub-lattices occupying positions with heights
    (0.02 nm), indicating possible sp²–sp³ hybridizations. In another report, Davila
    et al. [68] proposed a novel synthesis for the realization of germanium akin to
    graphene. They reported the growth of a (√3×3) germanene superstructure on a (√7×7)
    Au (111). In the report, they proposed several other phases, too, and the annealed
    deemed to be the most stable and flat flat compared to proposed structures.


    Several other reports (both theoretical and experimental) covering silicene layer
    growth on Ag (100), Ag (111), Zr₂, h-BN, Mo₂, Ca, Pb, etc., and alternatives like
    Pt (111), Au (111), for germanene have also been reported in the recent past [69,
    70–81]. The purpose of exploring different substrate for these layered materials
    lies in the fact that on substrate interaction and deposition rate, different
    silicene/germanene superstructures exhibit different physical, electronic, and
    magnetic properties. This can primarily be attributed to the modulation of physical
    parameters such as the lattice, buckling and charge transfer the 2D material surface
    and substrate material [88]. Other theoretical studies also suggest several sublattices
    such as h-boron nitride, SiC, MX₂ transition metal atom (Mo, W, etc.) and X =
    chalcogen (S, Se, Te, etc.). These materials are predicted to induce minimal impact
    on the Dirac cones of grown 2D layered materials, ensuring their utility for device
    application. However, since most of the reports on nonmagnetic substrates are
    theoretical in nature and very few experimental evidences have been reported so
    far the sake [82], it is imperative to look for the substrate material (be it
    metallic or nonmetallic) that induces minimal impact on these 2D nanomaterials
    or, alternatively, modifies their properties for the desired utilization.'
