    AGeNR configurations– except for O-AGENR-O–the magnitude of $v_i$ increases. Further,
    in the case of ZGeNR, the significance of the value of $v_i$ is even more, as
    the value of $N_{ch}$ is constant for each configuration of ZGeNR. The results
    indicate that with increase in concentration of O- atoms at the edges of ZGeNRs,
    the value of $v_i$ increases. This leads to significant improvement in the value
    of $L_c$ and $C_q$ for O-ZGeNR-H and O-ZGeNR-O cases compared to the pristine
    (H-ZGeNR-H). As mentioned previously, for the higher bias voltage, as $N_{ch}$
    tends to reduce $L_c$ and $C_q$ may also ruin the performance of interconnect.
    These results are further matched with the already reported results for silicene
    [108].


    Hence, through calculations of $R_q$, $L_c$ and $C_q$, it is revealed, that on
    the significantly higher values of $v_i$ and $N_{ch}$, the O-ZGeNR-O configuration
    offers minimum quantum resistance and delay values can also be a potential candidate
    for future nanoscale interconnect applications. Similar analysis can also be done
    for the silicene nanoribots, and it the SINRs, making them useful for interconnect
    applications.


    # 4.5 SUBSTITUTIONALLY DOPED GENRS, SINRS FOR INTERCONNECTS APPLICATIONS WITH
    COMMENTS ON RELIABILITY AND SECURITY [110]


    Here we present the analysis of the impact of substrate induced impurities (as
    dopants) on GeNR. For proper comparative and exhaustive study, both AGeNR and
    ZGeNR have been investigated, with substational Au doping at different sites.
    We have presented all possible stable configuration, both doped and pristine,
    that is, undoped AGeNR/ZGeNR cases (for quick comparison), as shown in Figure
    4.4.


