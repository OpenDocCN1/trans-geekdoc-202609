  md: '# 5.8.5 Tamper Detection Circuits Based on Memristors


    Tamper detection means the identification of unauthorized use of any hardware.
    Memories that are tamper-evident make sure that the stored data remains confidential
    and also disclose if there is any read/write attempt. The properties in memristor-based
    devices such as device formation, nonvolatility, and run-time drift can be used
    to detect tampering, particularly manufacture-time and run-time tamper detection.
    Compared to CMOS devices, which require system-level techniques to enable tamper
    detection, resulting in high power and performance overhead, memristor-based devices
    use inherent properties of the device and hence need less power and performance
    overhead for enabling detection.


    # 5.8.5.1 Manufacture-Time Tamper Detection


    The device-forming step in memristors is used to differentiate between an uninformed
    device and a formed one. For instance, a circuit comprising a set of memristors
    could be used for data encryption in a secure microprocessor. Any unauthorized
    or authorized user would first have to form these devices before obtaining any
    important information. The tamper detection of a circuit can be done using techniques
    that can also be used to verify the authenticity of the IC received from an unreliable
    fabrication unit. In this technique, a first known value is written onto the memristors;
    the value is read back; then the complimentary value of the known value is written
    onto the memristors. After this, the next value is read back; and the results
    are compared. If both the read values are the same, then this would indicate that
    the formation step did not occur, and it would not be possible to write onto the
    memristors. On the other hand, if the read values are different, it implies that
    the forming step in memristors has occurred, indicating a likely tampering of
    the circuit.


    # 5.8.5.2 Run-Time Tamper Detection


    Unauthorized memory reads based on memristors can be traced by monitoring the
    related memory drift drift. An attacker, to hide an unauthorized read, can restore
    the memristance to its original value. For this, the attacker applies a read pulse
    of some magnitude and width but of opposite polarity, to undo the device. The
    memory read operation is changed so that the attacker cannot change the memristance
    value back to the original. For this, two consecutive read pulses (as shown in
    Figure 5.17), are used by the modified memory read operation [16], one of which
    is public and also known


    ![](img/f43fc2d88fdf77da6ccf8abfe605d6a7_126_0.png)


    **FIGURE 5.17** Memristor based run-time tamper detection device [16]. The dashed
    region represents high-resistive region, while the white region represents low-resistive
    region. The dotted line depicts the position of the domain wall determining the
    current resistance value.'
