    # 9.5 CONCLUSION


    In this chapter, analysis of phase shifted modulation formats over a SOA-MZI-based
    secured communication system is designed in which the security is ensured with
    all-optical XOR gate. The *QF*, and *ER* values of the proposed design with respect
    to various modulation schemes proposed all-optical devices are investigated. The
    obtained values ensure that differential modulation schemes are best suited for
    the design of SOA-based optical communication system. Focus on future research
    would be in advanced multilevel modulation formats and for increased transmission
    rates.


