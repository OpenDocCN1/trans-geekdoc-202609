    using YBJ, with minimized input impedance [63]. The carbon nanotube (CNT) has
    also been used to design the TBJ to generate rectified effects [65].


    The high frequency RF response of YBJ has been simulated at room temperature using
    the ATLAS simulator. The device demonstrates the decrease in the rectification
    with the increase in frequency from 2 to 20 GHz [53]. The Hf to DC response of
    YBJ was also demonstrated up to 50 GHz at 77 K [66]. The degradation at higher
    frequencies was also due to interconnect feeding losses. The high frequency response
    of YBJ was theoretically reported up to 94 GHz by Bednarz et al. [85]. Two YJs
    were connected to minimize the impedance of the complete device. Furthermore,
    the transistor characteristic of TJJ was used [64], where the center output terminal
    was used as a gate. The current and voltage gain of 60 and -30 with a cutoff of
    4 GHz was reported for signal processing and sensing application [64].


    The nonlinear rectification of TJJ has also been observed for larger size with
    low mobility materials. The TJJ with Schottky gates was used to control the two
    input nodes. The wraps controlled the nonlinearity in the output and changed the
    curvature of rectified response for the transistor-like characteristics [74],
    [76]. The In-based yjs were also utilized as TJJ, showing a tunable nonlinear
    electrical characteristic with frequency mixing and phase detection operation
    [71].


    The NOR gate device has been produced using three TJJs [83]; one of the TJJs was
    used as a load, and the other was also used as the input to the circuit. Other
    applications such as frequency mixing and phase detection have been demonstrated
    [73]. The high frequency mixing operation is useful in the modulation process,
    where the carrier signal and message signal can be mixed to transmit the modulated
    signal [85]. Further, a phase detection process is quite useful in telecommunications,
    where it works as an essential part of the phase locked loop. In [85], double
    TJJ has been operated up to 90 GHz practically up to THz frequency. The TH response
    of a TJJ is limited due to the presence of intrinsic impedance [72].


    The physical dimensions, temperature, and mean free path of charge carriers largely
    affect the rectification of TJJ. Ballistic effects are responsible for rectification
