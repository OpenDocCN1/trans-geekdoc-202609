    # # 6.4.3 Run-Time Tamper Detection


    The main idea to detect an unauthorized read operation in memristor-based memories
    is to observe the unauthorized drift in memristance. To hide an unauthorized read,
    the attackers would try to reinstate the memristance of the memristor back to
    its actual state by ‘un-reading’; this can be achieved by applying an opposite
    polarity read with a pulse of the same magnitude and duration [40]. To prevent
    such restoring of memristance, the read operation is corrected, as shown in Figure
    6.9. In this modified operation, two consecutive read pulses are used. Out of
    these two pulses, the first is public (known to the attacker as well) and the
    second is private (only known to the authorized user) [41, 62, 63, 64]. In such
    a case, the attacker will not be able to restore the memristance after reading,
    the second pulse is unknown. Since the memristance value due to an unauthorized
    read will differ from the original value before reading, the authorized user can
    monitor this difference and become aware of it tampering.


