- pgno: 18
  md: '# 6 Nanoelectronic Devices for Security


    In this equation, $k$ is the Boltzmann''s constant, $T$ is the temperature, $q$
    is the charge and $C_D, C_{OX}$ are the capacitances of depletion region and oxide,
    respectively. subthreshold slope determines the amount of current for a gate voltage.
    As $C_D \gg C_{OX}$, the SS for a MOSFET is restricted by the Boltzmann''s limit
    $kT/q$ to 60 mV/dec. For a short channel device, it is severely hampered, as the
    OFF-state current is larger for a given threshold voltage.


    # 1.2.2 Drain Induced Barrier Lowering ''DIBL''


    As the channel length reduces, the depletion regions at drain-channel and source-channel
    interface begin to encounter each other. The electric field coupling takes place,
    and it affects the barrier height at source-channel interface. This lowering of
    barrier height at source-channel interface rises the leakage current in MOSFET.
    Thus, the control on the channel is loosened. The channel is also modulated by
    the application of drain bias. The drain acts as a second gate in the transistor.
    This is the 2D behavior of the transistor. It also results in poor saturation
    behavior of the transistor. This behavior is called drain induced barrier lowering
    (DIBL), as shown in Figure 1.3. In modern devices, as the channel length decreases,
    this is a serious challenge for device engineers.


    # 1.2.3 Channel Length Modulation (CLM)


    When the drain voltage $V_{DS}$ becomes greater than gate overvoltage $(V_{GS}-V_T)$,
    pinch-off of the channel occurs at the drain side. This reduction in channel length
    $\Delta L_G$ introduces a change in $I_D$ given by the equation (1.4).


    ```

    $I_D = I_{Dat} / (1 - \Delta L_G / L_G) \qquad (1.4)$

    ```


    This $\Delta L_G$ is significant with respect to $L_G$ in short channel devices
    as opposed to long channel devices. $\Delta L_G$ has a strong dependence on $V_{DS}$.
    Thus, for channel devices, this channel length modulation introduces a non-saturation
    behavior in the output characteristics of the transistor shown in Figure 1.4.
