  md: '# 7.5 PROPERTIES OF PUFS


    Many properties are desirable for PUF design. The PUF''s performance is judged
    on these properties, and it also tests its consistency and suitability for a specific
    use. The uniformity in the randomness of the PUF responses is critical for its
    functionality in various applications. Some of the desired properties of the PUF
    are enumerated in the following subsections.


    # 7.5.1 Unclonability


    This property is the primary desirable property of the PUF and states that it
    should be impossible to manufacture a PUF circuit replica. Also, mathematically,
    it should be intractable to model its behavior. This makes it very difficult to
    clone its functionality, so the responses cannot be simulated [16].


    # 7.5.2 Reproducibility


    Reproducibility is described in terms of spreading the intra-distance responses
    of the whole PUF category, that is, taking into account unexpected challenges
    on arbitrary PUF cases. It essentially implies that a particular PUF must produce
    a similar response with a high probability of the same challenge. Expressed in
    terms of hamming distance means that the two reactions for similar inputs should
    be very close. The number of positions in which the two binary strings differs
    is termed as hamming distance.


    # 7.5.3 Reliability


    This measures the capacity of the PUF to produce a steady output for a given bitstream,
    irrespective of any changes in environmental parameters (Figure 7.6), viz. voltage
    supply, surrounding temperatures, etc. This property can be measured by evaluating
    intra-chip hamming distance.


    # 7.5.4 Exclusivity


    A PUF circuit or device should generate exclusive or distinct identification,
    and this property is defined as the exclusivity or uniqueness of PUF. When two
    chips are implemented with the same PUF structure, each instance of PUF compared
    with other PUF should have a unique signature. Talking simply, this,


    ![](img/f43fc2d88fdf77da6ccf8abfe605d6a7_158_0.png)


    FIGURE 7.6 An example of a reliability evaluation of a PUF design.'
