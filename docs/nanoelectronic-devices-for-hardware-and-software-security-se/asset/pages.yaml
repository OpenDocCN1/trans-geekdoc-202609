    instead of going over it, in Figure 1.18c [39]. The physical mechanism governing
    the carrier transport is changed compared to MOSFET, where thermionic emission
    takes. The current, due to band-to-band tunneling (BTBT), is given by equation
    (1.6) [47].


    ```

    $I_{BTBT} \sim T_i \sim \exp(-4\lambda(2m^*)^{1/2} E_g^{3/2})/(3h(\Delta\phi +
    E_g)) \quad (1.6)$

    ```


    Where $T_i$ is the band-to-band tunneling, $\lambda$ is tunnel barrier width,
    $m^*$ is the effective mass, $E_g$ is the band gap of silicon, $\Delta\phi$ is
    the range of energy across which tunneling takes, and $h$ is the Planck''s constant.
    The three basic requirements for tunneling of electrons from available states
    are the (1) availability of states where electrons can tunnel, (2) a suitably
    narrow energy barrier, and (3) conservation of momentum. Due to this tunneling
    phenomenon, it is possible for TFET to realize $SS \le 60$ mV/dec for low gate
    voltages at room temperatures. The SS for TFET is given by equation (1.7) [48].


    ```

    $SS = \ln(10) \frac{dV_{off}}{dV_{GS}} + \frac{F + b \ dF}{F^2} dV_{GS}} \quad
    (1.7)$

    ```


    Equation 1.7 shows that SS for TFET does not have a unique value but is a function
    of $V_{GS}$. SS has the lowest value at the lowest $V_{GS}$ and increases with
    $V_{GS}$. The different values of SS are explained in Figure 1.18d. Point SS is
    the lowest value of the subthreshold slope at the $I_D-V_{GS}$ curve, and average
    SS is taken from where the drain current starts to increase from lowest value
    to the threshold voltage. The $I_{on}-V_{GS}$ curve is shown in Figure 1.18b.


    # 1.8.2 Advantages


    The salient features of TFET are listed here.


    +   - Low SS offered by TFET is the most distinguished advantage of these devices.
    This can significantly reduce the power consumption of the chip and can provide
    a boost in low-power applications.

    - OFF-current produced by TFET can lessen the loss of leakage current incurred
    in modern devices. The OFF-current in TFET is due to leakage of p–i–n diode, which
    is significantly lower than the OFF-current in MOSFETs.

    - TFET does not follow the same scaling rules as MOSFET, where the electric field
    must be constant in the device [49]. TFET offers better scalability than MOSFET,
    as the ON-state current does not depend on TFET length.


    # 1.8.3 Drawbacks


    There are some drawbacks or issues in these TFET devices, which are listed here.


    +   - TFET shows ambipolar behavior, which means it can also conduct in the reverse
    direction or negative gate voltages. For negative gate voltages, the tunnel barrier
    between the drain and channel gets lowered, which facilitates the electrons tunneling
    through, shown in Figure 1.19. This is an inherent problem with TFETs.

    - Apart from the benefits, TFET has low ON-current (~$10^{-6}$ A) compared to
    MOSFET (~$10^{-3}$ A). Many techniques, such as heterructure TFET, strain engineered
    TFET, high-k dielectrics, and carbon-based TFET [49], have been proposed, but
    there is still room for improvement.'
