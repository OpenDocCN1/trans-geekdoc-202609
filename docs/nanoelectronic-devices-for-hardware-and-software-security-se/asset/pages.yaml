- pgno: 294
  md: '# Nanoelectronic Devices for Security


    +   iii. High fidelity, that is, the photodetector response should be linear for
    a wide range of the optical signal.


    +   iv. Efficient conversion of photons to electrons, that is, high external quantum
    efficiency.


    +   v. Low noise (i.e., low dark currents, leakage currents, and shunt conductance)
    and high gain.


    +   vi. Fast response time, that is, large bandwidth.


    +   vii. Insensitive to the temperature variations.


    +   viii. Low voltages, that is, the photodetector should not require excessive
    currents or bias voltages.


    +   ix. Long operating life and reasonable cost compared to other system components.


    +   x. High reliability, that is, the photodetector must perform continuous room
    temperature operation for several years.


    +   xi. High photetection speed.


    Among photonic devices, photodetector holds a critical position and found a variety
    of consumer and scientific applications. The major issue of a photodetector is
    its compatibility with CMOS technology to provide low power dissipation, good
    noise immunity, high performance, and better reliability. To attain high-performance
    and CMOS-compatible technology, a suitable semiconductor material must be selected.
    The semiconductor materials used in a photodetector define many of its critical
    properties. Both the light wavelength to which it responds and the noise level
    are crucial parameters that depend on the material used in the photodetector.
    The wavelength sensitivity of various materials happens when only photons having
    enough energy to excite an electron across the energy bandgap of the semiconductor
    material will generate significant energy in producing the current from the photodetector.


    Si-based photodetectors [9], [16–18] show their better performance in the ultraviolet
    (UV) and visible spectral regime with sufficient speed, low dark current, moderate
    conductivity, and long-term stability. The use of a Si-based photodetector is
    commercially available and is restricted to the first-generation spectrum due
    to an indirect energy bandgap of Si (−1.12 eV), which gives a response above 1,100
    nm. Therefore, in the spectral regime, 1,100 to 1,600 nm (second-generation systems)
    research is dedicated to semiconductor materials with narrow bandgaps. This motivates
    the integration of Si with Ge [10], III–V [11], [16], [19], and II–VI [12] compounds
    that provide a better response in the wider spectral regime. The performance of
    such devices has been further enhanced in recent years, and a selection of photodetectors
    is now commercially.


    In addition to the fabrication of sophisticated photodetector architectures developed
    from III–V conductor materials at 1,300 and 1,550 nm wavelengths, material systems
    are investigation for longer wavelengths optimized for infrared (IR) transmission
    (700 to 30,000 nm). In terms of material properties, mercury cadmium telluride
    (Hg; HgCd,Te) is one of the most favorable materials for IR photodetection due
    to its adjustable bandgap, high photon absorption, high lattice matching, and
    moderate permittivity that confines small device capacitance and a low thermal
    expansion coefficient to give device stability [15], [26]. Other semiconductor
    materials, namely heterojunction photodetector types and phototransistor, can
    also be developed from III–V alloy semiconductor materials. Particularly the photoconduct
    photodetector is suitable as a potential photodetector in the spectral regime
    of 1,100 to 16,000 nm.


    Table 14.1 lists the common photos materials used for photodetectors along with
    their energy band in eV and wavelength (λ) at room temperature [13]'
