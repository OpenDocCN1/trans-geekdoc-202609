    # 15.1 INTRODUCTION


    The technical advancement in semiconductor technology enables the integration
    of billions of transistors on a single chip. In 1965, G.E Moore, cofounder of
    Intel, predicted that the number of transistors on an IC will double exponentially
    in almost every 18 to 24 months, shrinking the device size by scaling factor 0.7
    [1], [2]. The semiconductor industry adopted Moore''s observation for solid state
    devices, which in turn improved


    DOI: 10.1201/9781003126645-15'
