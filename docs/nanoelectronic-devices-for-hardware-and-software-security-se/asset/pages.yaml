    # ## 15.3 Quantum Point Contact (QPC)


    The QPC is a narrow region with comparable wavelength to the charge carriers.
    The constriction can be formed by breaking the conductor into two parts so it
    can generate the 2DEG in the narrow region. The quantization of conductance can
    be realized in the QPC using GaAs/AlGaAs-based heterostructures [27], [31].


    # ## 15.3.2 Single Electron Transistor (SET)


    The behavior of conventional semiconductor devices is different from submicron
    devices. The conventional transistor becomes ON in response to electrons, in contrast
    to submicron/nanometer transistors, which are ON and OFF every time in response.
    This behavior of small transistors is due to charge quantization and coulomb interaction
    between charge carriers [32], [37]. The submicron-sized SET was first invented
    by Fulton et al. in 1987 [35]. The SET contains two gates, in comparison to conventional
    metal-oxide semiconductor field effect transistors (MOSFETs). When a positive
    voltage is applied to the upper gate terminal, keeping the bottom gate at a negative
    potential, the electrons are accumulated in the gap which is of the order of 700
    Å, and 2DEG is formed in SET where electrons are confined in one direction and
    free to move in the other two directions [32], [37]. This electron gas separated
    from lead by tunnel or barrier junction results in conductance oscillation with
    respect to charge density. The potential applications of SET are at high frequency
    operation and multilevel logic [32].


    # ## 15.3.3 Self Switching Diode (SSD)


    The conventional diode is part of various electronic circuits for decades. The
    counterpart of this diode at high frequency is SSD [38]. The I–V characteristic
    of SSD is similar to a diode without any need of doping and/or potential barrier
    for handling the nonlinear effects. The channel becomes opened and closed in response
    to applied voltage between trenches. A wide variety of turn-voltage can be used
    in the SSD by changing the width and length of the channel [43], [44], [46]. The
    SSDs can be designed using III-V heterostructures [38] and graphene [123]. These
    have also been demonstrated at 1.5 TH and room temperature [41], [48]. The rectifier
    circuit and digital logic can also be realized using multiple SSDs [38], [42],
    [51].


    The classical-based mathematical models are unable to explain the working of novel
    devices [57], [101]. Here, semiclassical-based models are being used for estimating
    the nonlinear ballistic transport. Such devices include the TTJ [52]–[79], [82]–[87]
    and FTBR [77]–[79], [88]–[99].'
