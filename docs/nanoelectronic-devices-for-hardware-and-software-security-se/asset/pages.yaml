  md: '# 13.6 STUDY ON THE BASIC WAVEGUIDE MODEL FOR 325 TO 500 GHZ BAND


    Waveguide is a media that guides an electromagnetic wave/energy from one point
    to another with minimal loss of energy. Rectangular waveguide configuration is
    chosen as the back-bone for all the designs in this research work. WR-2.2 is the
    preferred candidate of this band. Traditionally, an air-filled metallic walled
    waveguide structure is used for lower frequency bands. Similarly, with the help
    of the DRIE (deep reactive ion etching) technique, the waveguide profile is etched
    within the silicon substrate, followed by conformal film deposition of suitable
    metals and sealing of the cavity. Geometry of the basic waveguide structure is
    shown in Figure 13.14, which defines properly the values of a and b. During the
    silicon micromachining, there is a parameters of variation of vertical as well
    as horizontal dimensions of waveguide shown in Figure 13.14 because of some process
    constraints. Figure 13.15 shows the effect of variation of lateral dimension of
    waveguide on its cut-off frequencies. Three basic waveguide modes (TE₁₀, TE₁₁,
    and TE₂₀) were studied. It has been observed that that the variation of lateral
    dimension affects the cut-off frequencies at a rate of 0.5 GHz/μm, 0.2 GHz/μm,
    and 0.3 GHz/μm for TE₁₀, TE₁₁, and TE₂₀ modes, respectively TE₁₀ being the dominant
    mode, tight tolerances are essential to maintain this mode''s desired property.
    Basically, the vertical dimension of the waveguide is responsible for deciding
    power-handling capability and attenuation optimization. Usually, it is kept as
    half of the lateral dimension.


