    RFID innovation is one of the center advances of the Internet of things; it has
    been generally used in medical services and brings a great deal of comfort for
    individuals in day-to-day life. This notwithstanding, the security and protection
    difficulties of RFID verification algorithms are increasing every day.


    The main problem in current RFID algorithms typically utilize a back-end server
    to accumulate the data of labeled items, leading to data leakage if the user is
    hacked. To address this problem, the authors propose a security RFID verification
    convention for sanction insurance condition utilizing the method of indistinctness
    jumbling, which keeps the miscarriage of delicate information from the back-end
    worker. The list of symbols is shown in Table 8.5. Figure 8.11 shows the proposed
    scheme by Shaohao Xie et al. [53].


    Table 8.6 shows the security flaws in the RFID authentication protocols scheme
    that are explained in this chapter. In conclusion, the Shaohao Xie et al. scheme
    [53] shows less vulnerabilities to many attacks in medical IoT.'
