- pgno: 135
  md: '# 6.1.3.5 Memristance Drift


    In some metal-oxide memristors, a process of change in memristance due to the
    movement of dopants has occurred, which is known as memristance drift [2]. This
    movement of dopants occurs by varying the applied voltage (positive or negative).
    The drifting amount depends on the magnitude, polarity, and applied voltage duration
    [11].


    # 6.1.3.6 Process Variations


    The process variation in memristor fabrication leads to change in its dopant concentration
    and dimensions, which ultimately affects the value of memristor. Moreover, the
    length variation has a highly nonlinear effect on memristance value [19].


    # 6.1.3.7 Radiation-Hardness


    Memristors are made from a material that has the inherent property of radiation
    hardness are immune to radiation [2].


    # 6.1.3.8 Temperature Stability


    Due to the very small temperature coefficient of resistance of TiO₂ (less than
    -3.82 × 10⁻³/K), the LRS and HRS values of Williams'' memristor are highly stable.
    However, temperature variation leads to a change in mobility of dopant atoms,
    which varies the switching speed [19]. All these characteristics have different
    advantages and disadvantages in memory and logic circuits designed using metal-oxide-memristors.
    Moreover, nonvolatility, nonlinearity, and radiation-hardness are beneficial in
    the context of security.


    # 6.2 MEMRISTOR-BASED PUF AND PUF


    # 6.2.1 Physically Unclable Function (PUF)


    Today, every single work environment, either public, private, business, or even
    national defense, has gone digitized, and digital security becomes a necessity
    in the current world. The security of this digital world mostly relies on the
    hardware-based root of trustworthy security functions such as storage and confidential
    key generation. The transitions to the Internet of things, autonomous intelligent
    systems, and embedded systems are highly prone to physical attack, which increases
    the importance of hardware solutions for security. The two hardware primitives
    that can solve this are physical unclonable functions (PUF) and true random number
    generators (TRNGs). TRNGs are utilized for generating masks, session keys, paging
    bits, initialization values, and other cryptographic data [20].


    A PUF is a hardware-dependent security primitive that provides a unique identification
    for each integrated circuit implementation, and which provides PUFs is due to
    large variations in the manufacturing process. Earlier, security keys were stored
    in form of nonvolatile memory (EEPROM, flash, etc.) that was used for the cryptography
    of data. The safe storage of these keys is complex and is not economic. Furthermore,
    these fixed keys are stored on nonvolatile memory that are vulnerable to attacks;
    once attackers unethically get access to the keys, there is no recovery. Despite
    incorporating a single cryptographic key, PUFs implement challenge–response authentication,
    which is intentionally designed in such a manner that the responses depend on
    both the applied challenge and the physical variations presented in PUF; hence,
    are said to have a unique fingerprint, which strengthens the security of the integrated
    circuit.'
