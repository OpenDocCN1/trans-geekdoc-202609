- pgno: 314
  md: '# 302 Nanoelectronic Devices for Security


    the device performance at reduced cost [2]. In 1981, the first computer by IBM
    having an Intel 8088 microprocessor with 4.77 MHz speed and 16 KB of memory space
    cost $1600. As a comparison, today''s computer is available at less than a third
    of that cost and contains an Core 2 Duo processor with 2.6 GHz and 4 GB of memory
    [2]. The scaling of semiconductor technology offers devices of smaller size, better
    performance, and lower power consumption. In 2002, the device size was reduced
    to 100 nm, as per an expected reduction to 10 nm by 2020, which can further saturate,
    as the 2015 ITRS report, as shown in Figure 15.1 [1], [3–5]. The contention of
    silicon-oxide semiconductor (CMOS) technology with lower power consumption of
    the order of 20–30 W in response to 100 W at the input side. The James D. Meind
    model estimated that billions of transistors will be fabricated on a chip by 2000,
    and the number of transistors on a single chip ($N_{trans}$) can be calculated
    using $N_{trans}=F/D^2PE$, where F is the feature size, D is the square root of
    chip area, and PE is the efficiency of transistors [6]. Despite such predictions,
    the lithography tool of a scalable device is increasing linearly from the last
    60 years [4]. This scalability saturates the reduced device dimension and is not
    following, as Moore''s observation [4], [5]. The reduction of gate length in CMOS
    devices creates gate leakage that causes the short barrier between source and
    channel. This phenomenon is known as the short channel effect (SCE). This undesired
    phenomenon can be suppressed by selecting new geometries with different working
    [5].


    Device designs are not only facing problems in further reduction beyond 40 nm,
    but also it is difficult to overcome other effects, such as thermal noise due
    integration density problems of these devices [1]. The doped bulk materials change
    their properties when the device size shrinks beyond a limit, including avalanche
    breakdown, which may occur on applying the high electric field and increases the
    probability of device damage. The increased density of transistors is also responsible
    for thermal heat dissipation and noise, which results in a wrong output due to
    malfunctioning [1], [7]. As a result, researchers have explored new types of novel
    devices, including new materials and new geometries to operate at high frequencies.


