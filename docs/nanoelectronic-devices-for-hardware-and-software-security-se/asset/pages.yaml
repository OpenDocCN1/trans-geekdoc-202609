    One of the breakthroughs in the device architectures is the realization of junctionless
    transistors (JLTs). Before the discovery of transistor by Shockley et al., J.
    Lillienfeld had proposed the idea of transistors way back in 1930 [7]. He had
    proposed the idea of modulating conductivity between two electrodes on a glass
    apparatus by a third electrode on the channel. The channel was made of copper
    and sulfur. It'
