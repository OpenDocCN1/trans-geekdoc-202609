  md: '# 80 Nanoelectronic Devices for Security


    # 3.1.10 Vertical T-Shaped TFET as a Low Power Application


    Moving forward to the device application as a challenge for low power application
    devices with respect to cost production and IC fabrication are continuous to outsources.
    However, this will increase the overall cost for the manufacturer, and dealing
    with the security concerns. To overcome this situation currently, most of the
    emerging techniques have been studied in hardware designing the physical enclave
    function (PUF) and random number generation (RNG) [48]. So in order to alleviate
    this threat, we review the PUF method. This method has been used frequently for
    the authentication process [49]. Therefore, any modeling methods have been design
    to estimate the response of the PUF function.


    # 3.1.10 Device Characteristics


    In the Figure 3.12, saw complementary circuit of a vertical T-shaped TFET has
    been developed using mixed mode technique. To correlate with the hardware security
    concern, it has been divided into four circuits: (i) security requirements at
    the top level; (ii) hardware primitives for the next level; (iii) drain current
    characteristics for the execution of those primitives; and (iv) the biasing voltage
    and specifications. Formation of the given device will lead successfully to dealing
    with the security threats. In the case of nanoelectronics devices, the subthreshold
    slope and subthreshold voltage to the current mode logic (CML) to defend the differential
    power analysis (DPA). So this chapter mainly focuses on the CML circuits with
    a vertical T-shaped TFET-based inverter. In many of the nanoscale devices, as
    TFET, bipolarity is one of the unwanted conductions of the negative biasing. This
    can be reduced with tunable polarity also being suppressed in the proposed device.


    # 3.1.102 Current Mode Logic of Vertical T-Shaped TFET


    The current mode logic comes under the family of digital logic [50]. This device
    basically consists of a tail current source and steering current circuit with
    differential attached load. With the switching of the constant current and voltage
    variation at the top level to alleviate this threat operation, the power consumption
    will be stable of the CML circuit. This will reduce the effect of DPA outbreak.
    Figure 3.15a shows the schematic diagram of the CML circuit, which include the
    pull-up and pull-down network. Figure 3.15b represents the details of the vertical
    T-shaped TFET device inverter buffer circuit.


    ![](img/f43fc2d88fdf77da6ccf8abfe605d6a7_92_0.png)


    **FIGURE 3.15** (a) Current mode logic universal circuit. (b) Schematic diagram
    of CML-based vertical T-shaped TFET inverter circuit.'
