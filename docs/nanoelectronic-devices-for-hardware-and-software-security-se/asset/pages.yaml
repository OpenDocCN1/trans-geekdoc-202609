    # 9.2.2 Bit Sequence Generator


    A pseudorandom sequence generator is used to produce maximal length pseudorandom
    binary sequences. The general PRBS pattern is represented as $2^n-1$, Where $n$
    indicates the length of the shift register used in creating the pattern. The pattern
    included all possible combinations of required $n$ number of input binary bits,
    ones, and zeros, other than null value pattern.


    # 9.2.3 Modulator


    Classifications of various types of digital modulation techniques are given in
    Figure 9.2, and phase modulators are considered for the proposed design for its
    ability to support the higher data rate requirement of optical systems.


    # 9.2.3.1 Phase Shift Keying (PSK) Modulator


    PSK uses two phases separated by $180^\circ$, it also be called binary phase shift
    keying (BPSK). The星座 points for PSK are positioned at $0^\circ$ and $180^\circ$
    on the real axis, so it handles the highest distortion level and hence the most
    robust out of all PSKs. But could modulate only one bit per symbol and sets limitation
    over high data rate handling.


    The BPSK general equation is given as


    ```

    $s_n(t)=\sqrt{\frac{2E_b}{T_b}}\cos(2\pi ft+\pi(1-n));n=0,1$ (9.13)$

    ```


    Which results in two phases given as


    ```

    $s_n(t)=\sqrt{\frac{2E_b}{T_b}}\cos(2\pi ft+\pi)=-\sqrt{\frac{2E_b}{T_b}}\cos(2\pi
    ft);for bit 0$ (9.14)$

    ```'
