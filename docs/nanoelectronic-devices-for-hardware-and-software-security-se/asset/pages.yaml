    The Synopsis technology-aided design simulator (TCAD) is utilized in performing
    these simulations [51]. The physics models activated are as follows: Fermi-Dirac
    statistics, bandgap narrowing with the Old-Slobook model, Mosetti-model, Shockley-Read
    recombination, and a dynamic nonlocal BTBT model where the values of coefficients
    are properly calibrated with experimental data [44]. Here the parameters of silicon
    are calibrated as $A=3.29 \times 10^{12}/cm^2$ sec and $B=23.8 \times 10^9$ V/cm
    and germanium parameters are $A=1.67 \times 10^{12}/cm^2$ sec and $B=6.55 \times
    10^9$ V/cm, respectively.


    It is observed that the channel under-cut length plays a vital role in optimizing
    the TFT performance in terms of its subthreshold slope, which is a crucial device
    parameter. However, the ON-state current is not affected by varying the channel
    under-cut length but it has a major effect on $I_{OFF}$. This leads to a well-improved
    subthreshold slope and a lower $I_{OFF}$ at a channel under-cut length of 15 nm.
    As a drive voltage is applied in the OFF-state, the channel/drain potential is
    reduced. Accordingly, as the channel under-cut length increases, the influence
    of the drain region is reduced. This decreases the electron BTB generation rate
    in the OFF-state. Hence, an improvement in $I_{OFF}$ from $2.40 \times 10^{-10}
    A/mu m$ to $2.77 \times 10^{-14} A/mu m$ is achieved for a channel under-cut length
    from 0 to 15 nm, respectively. This leads to a huge increment in $I_{OFF}$ up
    to four orders of magnitude.


