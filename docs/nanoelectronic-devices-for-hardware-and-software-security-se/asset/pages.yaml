    could be calculated as:


    ```

    $$J=\frac{qm^*}{2\pi^2h^3}\int_{p=0}^{F_N}E_T T(E_X,E_T)dE_XdE_T \eqno(2.19)$

    ```


    Keep in mind that the energy integral along the tunnel directions ranges from
    the Fermi levels of n-type semiconductor material to the Fermi levels of the p-type
    semiconductor material, as Fermi levels were presumed constrained with the edges
    of the band. The upper limit for transverse energy integration expands to $E(E_{MAX})=E_0/2$,
    since $E_T>E$ corresponds to tunneling into forbidden states. Nevertheless, the
    probability for tunneling decreases exponentially with $E_T$, it is appropriate
    that the upper limit should be expanded to infinity without compromising generality
    and for convenience.


    By changing the coordinates from energy to location, the band-to-band tunneling
    generation rate $G_{BTBT}$ can be determined from equation 2.19 and represented
    as:


    ```

    $$G_{BTBT}=\frac{qm^*}{2\pi^2h^3}\int_{0}^{\infty}\frac{\partial E_X}{\partial
    x}T(E_X,E_T)dE_T \eqno(2.20)$

    ```


    As a constant electric field has been presented, the energy is directly proportional
    to the position by [20]:


    ```

    $$E_X=q\epsilon x,\frac{dE_X}{dx}=q\epsilon \eqno(2.21)$

    ```


    Substituting equation 2.21 in 2.20, the $G_{BTBT}$ is reduced to:


    ```

    $$G_{BTBT}=\frac{qm^*\epsilon}{2\pi^2h^3}\int_{0}^{\infty}\exp[-\frac{E_T}{E_o}]dE_T=\frac{qm^*\epsilon}{2\pi^2h^3}T_oE_o
    \eqno(2.22)$

    ```


    By the evaluation of equation 2.22, a closed form $G_{BTBT}$ is attained by:


    ```

    $$G_{BTBT}=\frac{qm^*\epsilon}{2\pi^2h^3}T_o\exp[-\frac{\pi^{*1/2}E_G^{3/2}}{2\sqrt{2}q\epsilon
    h}]T_oE_o \eqno(2.23)$

    ```


    ```

    $$G_{BTBT}=\frac{\sqrt{2^2qm^{*1/2}}}{2\pi^3h^2}E_G^{1/2}}\exp[-\frac{\pi m^{*1/2}E_G^{3/2}}{2\sqrt{2}q\epsilon
    h}]=A\epsilon^2\exp[-\frac{\pi}{\epsilon}] \eqno(2.24)$

    ```


    where $A=\frac{\sqrt{2^2qm^{*1/2}}}{2\pi^3h^2}E_G^{1/2}$ and $B=\frac{\pi m^{*1/2}E_G^{3/2}}{2\sqrt{2}q\epsilon}$


    Even though the earlier assumptions were made appropriate for the derivation of
    the $G_{BTBT}$ in a closed form, equation 2.24 offers useful knowledge on the
    phenomenon of tunneling. It is clear that the tunneling coefficients $A$ and $B$
    are reliant on the semiconductor materials, and a relatively small energy bandgap
    and effective mass will lead to an exponential $G_{BTBT}$.'
