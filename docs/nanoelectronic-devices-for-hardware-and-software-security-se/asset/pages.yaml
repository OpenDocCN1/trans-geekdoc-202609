    concentration at the Si–SiO$_2$ interface. This is called the accumulation mode
    of the device. For a positive voltage, the holes are pushed to the Si–SiO$_2$
    interface, thereby depleting the region at the interface. The negative acceptor
    ions are left behind, which constitutes the depletion region. This is called the
    depletion mode. For a further increase in positive voltage, the minority carriers
    ''electrons'' are pulled to the interface, thereby creating an inversion layer
    at the interface. The gate voltage at the onset of inversion layer is termed as
    the threshold voltage. At gate source voltage ($V_{GS}$) threshold voltage ($V_{TH}$),
    the carrier concentration of minority electrons is equal to the hole concentration
    in the bulk region. Thus, for MOSFET to behave as a switch, the gate voltage can
    act as the stimulating voltage to trigger an ON-state from the OFF-state. Initially,
    for a drain to source voltage ($V_{DS}$) MOSFET remains in OFF-state for gate
    voltage $V_G < V_{TH}$. For $V_G > V_{TH}$ conduction of electrons take place
    between the source and drain. The current is not zero even in the OFF-state (when
    $V_{GS}=0$). In the subthreshold state, finite leakage current is present due
    to various factors. Nevertheless, the state ON and OFF can be switched by the
    polarity of gate voltage. As example, for a given $V_G > V_{TH}$, the drain current
    increases with $V_{DS}$. After some point, the drain current saturates for any
    further increase in $V_{DS}$, due to pinch-off of the channel region on the drain
    side. The drain current/$V_{DS}$ voltage characteristics are the output characteristics
    of the MOSFET shown in Figure 1.1. For a given $V_{DS}$, the drain current increases
    with increase in $V_G$, which is called the inversion mode.


    # 1.1.2 Advent of CMOS


    To this point we have discussed the n-MOSFET and its working in different modes,
    that is, accumulation, depletion, inversion. But alone cannot perform the complete
    logic function of the NOT inverter, which is logic ''0'' to ''1'', and vice versa
    when it needs a complementary p-MOS to convert the ''0'' to ''1''. The complementary
    metal oxide semiconductor (CMOS) shown in Figure 1.2 is capable of performing
    the complete logic function of a basic inverter (NOT gate). This complementary
    CMOS has been the backbone of the microelectronics industry for the past four
    decades. However, there is power dissipation in the CMOS inverter, which is static
    and dynamic in nature. The static power dissipation is caused by the finite leakage
    current in subthreshold state for both the p-MOS and n-MOS in the CMOS inverter.
    In the Off-state, there is a leakage current $I_{OFF}$, even when switching does
    not take place. The static power dissipation is given by equation (1.1). The dynamic
    power dissipation occurs when switching takes place. For every cycle of switching,
    half of the energy stored or discharged in the load capacitor is dissipated as,
    which is the source for this dynamic power'
