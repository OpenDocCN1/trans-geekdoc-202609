    # 14.4.5 Barrier Photodetectors


    Among different device architecture and design concepts, barrier photodetectors
    have been most extensively used, which was first developed by White [51]. Normally,
    an n-type dual-heterojunction bipolar photodetector comprises a narrow bandgap
    contact layer, a wide bandgap barrier layer (B), and a narrow bandgap active (or
    absorber) layer, resulting in an nBn photodetector as shown in Figure 14.9a. The
    major carriers, that is, electrons are blocked in such devices due to the absence
    of valence band discontinuity, which allows the passage of photogenerated minority
    carriers, that is, holes. Due to a large conduction band offset and a nearly zero
    valence band offset, the major carrier current between two electrodes is blocked,
    as illustrated in Figure 14.9b. This unipolar photodetector operates as a minority
    carrier photogenerator. An nBn photodetector suppresses the noise level and dark-current
    by reducing surface-level leakage current and depletion-level thermal generation
    recombination current, resulting in better uniformity with an ordinary p–n–p junction
    photodiode [52], [53]. The nBn photodetectors have been effectively developed
    using Hg,,CdTe for IR detection, InAsSb,Sb-based IR photodetector [57], and InGaAsSb/GaSb
    [58].


    Compared to the III-V semiconductor heterostructures, Hg,,CdTe does not show a
    near-zero valence band offset, requiring high bias voltage to control the generated
    carriers [49]. To solve this issue, a p-doped barrier is used to increase the
    conduction band offset and reduce the offset in the valence band. Moreover, due
    to existence of the barrier, the n-type contact layer in nBn device can be replaced
    with the p-type contact layer, resulting in a pBn photodetector, as shown in Figure
    14.9a. Therefore, a p–n junction is located between the barrier and the active.


    A wide variety of barrier photodetectors have been developed as CB,n and CB,p
    photodetectors [59], [60]. In the first category, both the barrier and active
    layers are of n-type,'
