  md: "124 Nanoelectronic Devices for Security\n\nThe security in software execution\
    \ is primarily provided by PUFs [21], which is necessary for authentication of\
    \ field-programmable gate arrays (FPGAs) [21], trusted device working, and encrypted\
    \ storage [22]. several types of PUFs architecture have been designed, and several\
    \ new architectures are under research. Few of the currently used architectures\
    \ are the arbiter PUF [23, 24], butterfly PUF [25], flip-flop PUF [26], SRAM PUF\
    \ [27], and ring oscillator PUF [23, 28, 29].\n\n# 6.2.2 Memristor-Based PUF (NanoPUF/M-PUF)\
    \ Architecture\n\nThe inherent characteristics of variation in memristors are\
    \ the main reason behind designing memristor-based PUFs. These memristor-based\
    \ PUFs are also referred to as NanoPUFs [30, 31, 52]. The NanoPUF/M-PUF consists\
    \ of three major parts:\n\n+   1. Memristor crossbar.\n2. Challenge circuit and\
    \ Row decoder.\n3. Response circuit and column decoder with a current comparator.\n\
    \nThe input to the crossbar is enabled by a challenge circuit through the row\
    \ and column. A voltage of magnitude $V_{dad}$ is applied to the row decoder,\
    \ which is connected to a particular column resistance, also called the load resistance\
    \ ($R_{load}$). The remaining columns and rows are in floating mode. Although\
    \ the magnitude of pulse voltage is $V_{dad}$, the response circuit collects the\
    \ response from the column decoder. It consists of $R_{load}$ and a current comparator\
    \ compares the reference current ($I_{ref}$) with the current coming out of the\
    \ column ($I_{out}$). If $I_{out}$ is greater than $I_{ref}$ then the response\
    \ is logic 1; otherwise, it is 0 [11]. The direct path and sneak path are two\
    \ paths that are available in the crossbar. The current flowing from a row (input)\
    \ to a column (output) is the function of the resistance of the device at the\
    \ cross-point of that row and column; this flow path is called a direct path.\
    \ The current flows as a function of device resistance from one input to another\
    \ output in the crossbar in a sneak path. A $4 \times 4$ memristor-based PUF circuit\
    \ is shown in Figure 6.3.\n\n![](img/f43fc2d88fdf77da6ccf8abfe605d6a7_136_0.png)\n\
    \nFIGURE 6.3 A $4 \\times 4$ memristor-PUF/NanoPUF."
