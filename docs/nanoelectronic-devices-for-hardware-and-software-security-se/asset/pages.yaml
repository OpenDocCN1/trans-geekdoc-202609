    # 5.8.4 Memristor-Based Unique Signatures (MUS)


    Some nanoelectronic devices based on memristors can generate unique signatures
    for the hardware by utilizing two distinct features of memristors [15], which
    are:


    +   1. Inherent process variations that are nonuniform and irreducible during
    fabrication.

    2. Forming process to make memristors functional.


    For random generation, a memristor-based unique signature (MUS) utilizes a pair
    of nonpolar memristors that are connected in series. Here the generation of a
    bit is a function of the position of the filament with low resistance [15]. Thus,
    a random can be generated through multiple instances of random bit generators.
    Being nonvolatile, these signatures can be used for the purpose of hardware identification.
    This type of embedded hardware identification can be used to block electronics
    fraud or detect refurbished parts.


