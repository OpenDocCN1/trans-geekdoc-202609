  md: '# 1 Emerging Nanoelectronic Devices


    behaved as a gated resistor could controlled by a third electrode. This same idea
    was implemented in JLTs in 2010 by Colinge et al. [8]. In JLTs, the device layer
    is composed of a single type of material (n-type or p-type) without any junctions.
    For an n-type JLT, the depletion of channel is realized by a gate electrode of
    high work function (> 5 eV). The difference in work function between channel and
    gate electrode is responsible for the full depletion of channel. Thus, it behaves
    as a gated resistor.


    # 1.3.1 Theory


    As explained earlier the difference in work function is responsible for the depletion
    of channel in formerly doped JLT. For an n-JLT, the work difference ϕ must be
    positive, that is, ϕ > ϕ''. There are certain requirements that need to be fulfilled
    for efficient realization of a JLT. First, the device thickness should be small,
    such that the channel can be completely depleted by VGS=0 V; otherwise, there
    will be a large OFF-state leakage current. Second, the gate should be of high
    work function for an n-type JLT. The structure of a junctionless transistor is
    shown in Figure 1.6a. The drain, channel and source are all composed of the same
    material concentration and polarity. These JLTs are devoid of any junctions, making
    junctionless in device architecture. The barrier present between source and channel,
    similar to a MOSFET, inhibits the current flow in Off-state (Figure 1.6b).


    # 1.3.2 JLFET


    The physics underlying the working of junctionless field effect transistor (JLFET)
    gives rise to efficient conduction mechanism. The volume depletion carried out
    in a nanowire JLT can be obtained by adjusting the gate work function so that
    full volume depletion occurs at VGS=0 V, as shown in Figure 1.7a. For a p-type
    JLT, the gate work function should be small (≤ 4.1 eV). For efficient depletion,
    the gate control should be strong. Therefore, nanowire structures are best suited
    for JLTs. For an n-JLT, in the full


