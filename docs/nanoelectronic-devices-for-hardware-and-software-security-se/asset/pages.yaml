    # 16.7 SILICON NANOWIRE FET


    # 16.7.1 Fabrication of the SiNW FET


    Two top-down technologies are practiced to fabricate the SiNW field-effect transistors.
    These top-down nano-lithography methods are ocean scanning probe lithography (oSPL)
    and electron beam lithography [17–19]. The two methods are carried out in the
    same silicon-on-insulator (SOI). The fabrication steps are different for both
    oSPL and EBL. The lithography process shares many common elements for the fabrication
    process: SOI substrate, source and drain metal contacts, and removal of an unmasked
    region of the top silicon layer by reactive ion etching (RIE), as shown in Figure
    16.8. During fabrication, the SOI substrates are cleaned by sonication. The contacts
    are fabricated by photolithography. The oxidation SPL step is carried out with
    an atomic force microscope in the amplitude modulation mode [20,21]. The relative
    humidity was controlled by the AFM. Following this step, the SiO masks are developed
    with electrodes using the photolithography process. The unwanted mask layers are
    removed by electron beam lithography. The lithography step is followed by. The
    bridging nanowire was developed between the source and drain electrodes. The formation
    of SiNW is to be contingent on the lithography method. The width of the SiNW was
    developed by the oSPL method, with comparatively less width than the EBL method.


