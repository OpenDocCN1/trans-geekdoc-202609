  md: "To gauge their performances toward interconnect applications, a two-probe analysis\
    \ has been performed to calculate transmission channel ($N_{ch}$), kinetic inductance\
    \ ($L_K$), and quantum capacitance ($C_Q$) for considered structures. The quantum\
    \ resistance can then be modeled by the equation shown below [58]:\n\n```\n$R_Q\
    \ = \frac{h}{G_0} \\frac{1}{2q^2 N_{ch}} \\quad (4.2)$\n```\n\nHere, $R_Q$ is\
    \ defined as the quantum resistance for small dimensions, $N_{ch}$ defines the\
    \ number inversely with the transmission channels. Equation 4.2 highlights that\
    \ quantum resistance varies inversely with the number of transmitting channels,\
    \ $N_{ch}$. To comment on the value of $N_{ch}$ transmission eigenvalues are then\
    \ calculate. Transmission eigen represents the probability (or the possibility)\
    \ with which the carrier (electron wave) can pass through the central region;\
    \ higher probability indicates less scattering and a more smooth flow of carriers.\
    \ Transmission mode/$N_s$ around the Fermi level is then calculated, and the results\
    \ are tabulated in Tabulated Table 4.2. Tabulated values show that only O-H-AGenR-H-H\
    \ and O-H-AGenR-O exhibit non-zero values of $N_{ch}$ ($N_{ch}=1$ and 2, respectively).\
    \ Similar analysis can be performed for the zigzag couplers, the tabulated values\
    \ suggest that $R_Q$ will be more or less than the value of $N_s$ and is the same\
    \ for all the three cases. However, a detailed analysis of the eigen spectrum\
    \ shows that due to $c$-symmetry (which is at the edges of) case. O-ZGenR-O, the\
    \ channel tends to offer smooth flow of carrier (or less scattering) in this case.\
    \ It is mentioned here that this symmetry is a strong function of bias voltage,\
    \ and it collapses with the increase in bias voltage and inductance. Further,\
    \ the dynamic performance is typically modeled through equations for $L_K, C_Q$\
    \ with respect to 1D nanoscale devices [58]:\n\n```\n$L_K = \\frac{h}{4q^2 v_f}\
    \ N_{ch} \\quad (4.3)$\n```\n\n```\n$C_Q = \\frac{4q^2}{hv} N_{ch} \\quad (4.4)$\n\
    ```\n\nThe calculated results are tabulated in Table 4.2. As it is implied from\
