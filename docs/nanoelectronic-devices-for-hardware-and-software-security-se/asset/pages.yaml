  md: '28 Nanoelectronic Devices for Charge Plasma TFETs


    # 11.1.2 Ambipolarity in Charge Plasma TFETs


    The issue of ambipolarity is inherent in these JLTFETs and DLTFETs. There have
    many device architectures proposed for the reduction of ambipolarity. Ambipolarity
    is basically the conduction of electrons by tunneling from the valence band in
    the channel to the conduction band in the drain region for negative V_{GS} or
    gate voltages. The narrowing of the tunnel barrier at the drain-channel interface
    for negative gate voltages is present in TFETs, which is also explained in section
    1.8.3. In this section we have focused only on techniques of ambipolarity for
    reduction charge plasma TFETs, that are JLTFET and DLTFET. The use of a triple
    gate with low function material on source and drain has been proposed [20][56].
    The low work material on the source side is responsible for improvement in ON-state
    performance. The low function material on the drain side widens the tunnel barrier
    in an bipolar state, that is, negative voltages. Although this technique serves
    the purpose, it is very challenging from a scaling perspective. The other option
    of dual work function electrodes is to use drain electrodes. The dual drain electrode
    also widens the tunnel barrier by changing the carrier concentration at the drain-channel
    interface in an bipolar state [52][55][6][66]. The use of a low function metal
    implant embedded under the source in the midst of the gate and drain electrodes
    has also been proposed, which alters the carrier concentration at the drain-channel
    interface [53]. This leads to broadening of the tunnel barrier in bipolar state.
    The application of a thicker spacer (~15 nm) between the gate and drain electrodes
    also broadens the tunnel barrier by hammering the overlapping of the valence band
    (channel) and conduction band (drain) [64].


    # 1.12 SIMULATION ENVIRONMENT OF JLTFET AND DLTFET


    All simulations are implemented by a 2D device simulator, Silvaco Atlas [33].
    The simulations for the junctionless TFET are simulated by taking the device specifications
    as given in [50]. To account for tunneling of carriers, the nonlocal BTBT model
    is activated. The effect of interface traps has also been included. Fermi-Dirac
    statistics are implemented in the intrinsic carrier concentration calculations
    needed in SRH (Shockley–Read–Hall) expressions. The gate leakage current model
    has not been used, as we have presumed a high-k metal state guard. The SRH recombination
    model and Lombardi mobility model are used to simulate the effect for high impurity
    atom. The quantum confinement model is implemented by Hansch [34] in a similar
    manner as in [50]. The bandgap model is used to simulate the consequences of high
    doping. The effect of high-k spacers on silicon channel for junctionless TFET
    is taken similarly to that mentioned in [50], that is, by including the defects
    at the interface of the high-k spacer and semiconductor. The tunneling region
    has very fine mesh spacing to efficiently calculate the current due to tunneling.


