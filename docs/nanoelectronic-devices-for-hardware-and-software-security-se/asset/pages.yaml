    # 13.7 STUDY ON WAVEGUIDAVE BEND STRUCTURE AND ITS DESIGN


    Frequently, a waveguide-based complete system realization requires bend structures.
    This is essential to mitigate the extra losses associated with degradation of
    the device or its interfacing circuit. It can affect the phase response of the
    whole assembly along with degradation. Hence, it should be modeled well, considering
    all fabrications intricacies. In this work, since multiple bend structures were
    designed (Figure 13.16), and simulated results were compared with the right-angled
    straight waveguide configuration. In the right-angled bend, surface area is nearer
    to the bending region, which basically increases the capacitance of transmission
    line; hence the characteristics impedance reduced. To maintain the impedance as
    constant, surface area should be kept equal to that of other portions of the waveguide,
    and this is done by making the chamfered bend with a radius equal to the lateral
    dimension of the waveguide. The result of the analysis is depicted in Figure 13.17.
    It is noticed that the matching profile of the waveguide structure is improved
    in the bending structure if the chamfering technique is used. Here, IL signifies
    the insertion loss and RL denotes the return loss parameters.

    The following designs have been carried out using bend structures.'
