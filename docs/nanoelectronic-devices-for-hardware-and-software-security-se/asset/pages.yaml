    # 6.2.4 Security Analysis


    Uniqueness, uniformity and bit-biasing are three matrices that can be utilized
    to investigate the ability of NanoPUFs in generating unique IDs [32, 54].


    +   1. The responses achieved from the two distinct crossbars give the hamming
    distance by which uniqueness is measured after applying the same challenge. The
    ideal value of the uniqueness is 50%.

    2. The uniformity determines the randomness of the response, and it is ascertained
    by proportion of 1s and 0s in the response. Uniformity will also have a 50% ideal
    value.

    3. Bit biasing affine to achieve 1s and 0s in the response. Its ideal value should
    also be 50%. The results of these PUFs can be foreseeable because distinct PUFs
    may generate similar responses due to the bit-biasing. The qualities of these
    responses are listed in Table 6.1; these are generated by a NanoPUF by G. Rose
    et al. [30].


    When the performance of same sized M-PUFs is compared with CMOS-based PUFs (SRAM-based),
    we found that M-PUFs generate more robust responses, as memristors are much denser
    than SRAM cells consume. Moreover, they consume lower power than SRAM-based PUFs
    [55–58]. Issues with memristor NanoPUFs that need to be solved and are under research.


