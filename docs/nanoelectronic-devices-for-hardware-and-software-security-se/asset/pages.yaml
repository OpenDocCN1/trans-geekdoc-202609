  md: '# 14.1 INTRODUCTION


    Over the past few decades, there is a massive increase in different technological
    applications that have significantly influenced the way of living. Many of those
    could never have been imagined over 20 years ago. The rapid growth in miniaturizing
    the integrated circuits (ICs) to nanometer (nm) sizes has opened up an enormous
    opportunity for affordable consumer electronics, which are all around us nowadays.
    Miniaturization is key to the improvements in speed and power consumption of ICs.
    This technological revolution was predicted by R. P. Feynman in his legendary
    seminar, stating that “There’s plenty of room at the bottom” [1], and by G. E.
    Moore, who stated that “In two years, the number of transistors that are placed
    inexpensive on an integrated circuit (IC) doubles nearly” [2]. For semiconductor
    industry, Moore’s law became the road map.


    ICs have continued scaling down for the past decades, and in fact, it can be stated
    that Moore’s law lies at the basis of the field of nanotechnology that has growing
    exponentially since the 1980s. With the ever-increasing performance of device
    processing technologies new research fields were born in the era of nanotechnology.
    Nanotechnology is one of key technologies as its processes and products have a
    massive cost-effective potential for future markets. The increase in more efficient,
    faster and smaller nanoelectronic devices with a tolerable price-to-performance
    ratio has become a crucial successful reason in the international competition
    for many industries. The technical ability in the nanotechnology field will become
    a significant condition in order to successfully compete with improved technologies
    and products in high technology markets. Because of its interdisciplinary cross-character,
    nanotechnology finds its wide use in the areas of life sciences, medicine, information
    technology, electronics, chemistry, materials, energy and environmental engineering,
    space, data storage, automotive manufacturing, and communications in addition
    to optics and precision engineering in numerous aspects [3], [4].


    Moore’s law stated that as transistors shrink size and communications related
    to the Internet grow, the conventional paper-based character has been pushed to
    its limit and the increasing demands for bandwidth and high-speed communications
    applications cannot be met [2]. For this reason, the existence of photons with
    low noise and outstanding high-speed transmission properties is intended to have
    a dominant role in present communication applications. Recent advances prove that
    photonics can provide high-performance solutions for the communication industries,
    such as chip-to-chip, fiber-to-the-premise, and intra-chip applications at low
    cost [5].


    Long-distance communication can be carried out in the 1,300–1,550 nm spectral
    region (or region), which corresponds to the least optical loss for silica doped
    optical fibers [5]. The optical devices working at this spectral regime can be
    aggressively pursued and connected directly to servers without any wavelength.
    Up to now, various optical devices such as optical modulators [6], light-emitting
    sources [6], and other components [7] have been developed in this spectral regime.


    Although much effort has been made in all-optical fiber communication systems,
    in optical communication, system signals are not processed in the optical form
    and require an efficient conversion to electrical signals to be processed by electronic
    circuit.


    The theory of optoelectronic and photonic devices first began in the late 1980s.
    Conversely, in the last decades, it has become one of most intensive research
    areas driven by the rapid growth of communications technology [8]. Among photonic
    devices, a photodetector is a receiver unit which is employed at the end of the
    path to convert an optical signal into an electrical signal. The quality of the
    conversion will greatly affect the performance of the communication system. Photodetectors
    hold a critical position in photonic devices have a wide variety of consumer and
    scientific applications and have a dominant role in the growth of modern physics
    over the past century. Therefore, this chapter provides the basic mechanism behind
    photetection, its various types, different materials used for photodet, performance
    parameters, and their various applications.'
