  md: '# 15.4.2 Three Terminal Junction (TTJ)


    Similar to the ballistic rectifier, another device called the TTJ based on ballistic
    effect was proposed by H. Q. Xu in 2001, with two input terminals (left and right)
    and one output terminal [52]. In TTJ, one of the output terminals of FTBR has
    been omitted to study rectification effects. Also, theoretical formulation relates
    the output current at the central terminal with the transmission probability of
    all three terminals, which can further depend on electrochemical potentials. The
    device can be realized in symmetric and asymmetric configurations, and output
    has been predicted to be varying quadratically with the applied input voltage
    [52].


    In another experiment, the rectified output of GaAs/AlGaAs heterostructure-based
    YBJ was studied for different gate voltages at 4.2 K [62]. The TTJ was fabricated
    on a high mobility InGaAs/InP heterostructure, as shown in Figure 15.8a [57],
    which proved the rectified output and coefficients up to 200 K, which was further
    validated by mathematical modeling [52]. The rectified output of the device increased
    with the decrease in gate voltage and demonstrated a good correlation with the
    quadratic curve fit, as demonstrated in Figure 15.8 [57].


    The TTJ has operating capability up to high frequency (10 GHz) and room temperature
    [82]. The parasitic capacitance limits the high frequency output of TTJ, which
    can be further improved ten times by separating the junctions to decrease capacitance.
    The TTJ has been demonstrated up to 1 GHz with the second harmonic generation
    up to 300 GHz [58].


    Furthermore, the TTJ can also be combined with devices of its class such as FET
    to rectify rectified response [82], [87]. The more complex digital operations,
    for half-adder, have been demonstrated using rectified effects in YBJ [59], [60].
    In addition, TTJ can also be worked as a diode and triode depending upon the voltage
    applied between the input terminals [61]. The digital operation such as the SR
    latch has been demonstrated in TTJ, utilizing two TTJs and in-plane gate terminals
    to measure the output. The single step lithography process was used to design
    the latch with the CMOS devices [75].


