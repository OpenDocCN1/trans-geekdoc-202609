    +   2. Presume high doping rates in the semiconductor; the Fermi level is precisely
    aligned with the p-type semiconductor valence band ($E_v = F_v$) and the n-type
    semiconductor conduction band ($E_c = F_c$). In addition, we assume that states
    in $E_v$ are completely filled by electrons and $E_c$ is entirely vacant, fact
    that the Fermi distribution is simplified ($f_v \approx 1, f_c \approx 0$).


    +   3. Adopt a consistent electric field through the pn junction.

    4. Presume symmetrical two-band correlation for modeling the imaginary vector
    distribution relationship inside the forbidden bandgap for close $G_{BTBT}$ solution.


    # 2.3.2 Evaluation of the Imaginary Dispersion Relation


    According to the Wentzel–Kramers–Brillouin concept, the tunneling probability
    ($T$) is given by [18]:


    ```

    $T \simeq \exp\left[-2\int_{x_1}^{x_2} k(x)dx\right] \quad (2.2)$

    ```


    where $x_1$ and $x_2$ are classical turning points. To determine equation 2.2,
    the imaginary wave vector distribution correlation $k(x)$ should be established.
    In accordance with the generalized $E-k$ relation, we have [18]:


    ```

    $k(E_s) = \sqrt{\frac{2m^*}{\hbar^2}(E_X-U)} \quad (2.3)$

    ```


    where $E_x$ denotes the energy of the incident carriers. $U$ determines the potential
    barrier heights and can be evaluated by utilizing symmetric two-band relation
    in [19] and assuming an even electric field throughout the pn junction:


    ```

    $(E_X-U) = c[x-\frac{E_G}{2\varepsilon}|x+\frac{E_G}{2\varepsilon}|] \quad (2.4)$

    ```'
