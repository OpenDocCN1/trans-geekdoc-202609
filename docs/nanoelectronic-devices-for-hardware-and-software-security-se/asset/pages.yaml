    Polarization of optical field is considered in the gain saturation process, and
    polarization dependence is negligible in the XGM and XPS process of SOA. The electric
    field propagation in the z-axis is given by the standard wave equation:


    $$\frac{\partial^2 E(z,t)}{\partial z^2} + n^2\frac{\partial^2 E(z,t)}{\partial
    t^2} = -\frac{1}{\varepsilon_0 c^2}\frac{\partial^2 P}{\partial t^2}$$ (9.1)


    The relationship between polarization P and susceptibility $\chi$ is given as
    $P = \chi E$


    $$\chi(N) = \frac{nc}{\omega}(\alpha - j)g(N)$ (9.2)


    Carrier dependent density $g(N)$ is calculated by


    $$\g(N) = \Gamma[\alpha(N-N_0)] - \alpha_p$$ (9.3)


    Wave equation is given by


    $$\frac{\partial E}{\partial z} = -\frac{1+j\alpha}{2}g(z,t)E(z,t)$ (9.4)


    Integrating in z direction


    $$\E(L,t) = E(0,t)\exp\left[\frac{1}{2}\int_0^L g(z,t)dz\right]$$ (9.5)


    Carrier density rate equation is given as


    $$\frac{dN}{dt} = \frac{I}{qV} - \frac{N}{\tau_s}\frac{g(n)}{\omega}|E(t,z)|^2$$
    (9.6)'
