    as doping profiles, device length, material type, and defects. The dark current
    density ($J_{dark}$) is an important characteristic parameter of photodetectors
    for estimation of operating temperature and bias voltage. The dark current density
    $J_{dark}$ is a combination of diffusion current density ($J_{diff}$), drift current
    density ($J_{drift}$), and the tunneling current density ($J_{TUN}$). $J_{TUN}$
    comprises trap-assisted tunneling (TAT) and band-to-band (BTB)'
