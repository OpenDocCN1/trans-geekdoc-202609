    # 5.6.4 Spintronic Memristors


    The spintronic memristor device is based on an oxide thin film placed among two
    regions with magnetic properties. The first magnetic layer has permanent magnetic
    characteristics, and the other film is a region with a field barrier. The magnetization
    of the free region on the left surface of the region divider is associated with
    the magnetic properties of the first region. The right surface magnetization is
    in the opposite location to the magnetic field of the first region. The domain
    barrier moves if the current flows through the structure. This motion depends
    on the current. The area wall can be fully transported to the left region, and
    thus a total anti-parallel magnetization between the regions occurs, leading to
    low conductance. If the barrier is completely transported to the second region,
    a parallel magnetization between the first film and the pinned regions is realized,
    establishing a high conductance. The state variable describes the length of the
    parallel magnetized section of the second region. This section has high conductivity,
    and the anti-parallel layer has lower conductance.


    Memristors can potentially enhance many areas of computing and IC design. Some
    of them are:


    # 5.7.1 Nonvolatile Random Access Memory (NVRAM)


    Memristors may be used in nonvolatile random access memory (NVRAM) [6], as the
    memristor-based device memory consumes much less area and does not need to draw
    continuous power. Every single memristor can store one bit of information for
    digital memory. For this the memristor is forced to its extreme resistance values
    R_ON and R_OFF, where each state corresponds to 1 or 0, respectively. The memristor
    resistance is set by DC voltages. AC signals are used to read data without disturbing
    it. This memory architecture uses a crossbar arrangement [7] that is composed
    of a grid of vertical and horizontal traces. Associative memories map an input
    pattern to an output pattern based on the comparison of the input pattern with
    the pattern that is stored in the memory. Memristors can also find use in associative
    memories [8].


    The fundamental cell shown in Figure 5.8 has two memristors, memA and memB. Here
    memA is set to low resistance and memB is set to high resistance for logic 1,
    and vice versa for logic 0.


