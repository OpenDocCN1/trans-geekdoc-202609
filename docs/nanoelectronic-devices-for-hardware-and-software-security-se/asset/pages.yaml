  md: '# Nanoelectronic Devices for Security


    # 5.9 LIMITATIONS AND FUTURE SCOPE OF MEMRISTORS


    The main challenges regarding the use of memristors are that they have low speed,
    and at high frequency, major changes can occur in the memristor''s characteristics.
    Also, because this is a new circuit element, designers need to learn how to build
    circuits using memristors. Besides this, a standard memristor model is needed
    that can be used for the purpose of fabrication and simulation.


    The use of memristors in NVRAM can greatly revolutionize memory storage systems.
    In the field of neural network systems, the use of memristors could reveal crucial
    information about how the human brain works.


    # 5.10 CONCLUSION


    Research is going on explore different aspects of the memristor, its other applications,
    and efforts to overcome its limitations. Since the need for an ultimate source
    for nonvolatile memory storage system is increasing every day, the application
    of memristors in NVRAM may bring another era in computer systems.


