  md: '# Nanoelectronic Devices for Security


    roadmap termed the International Technology Roadmap for Semiconductors (ITRS)
    [5]. These strategies and predictions have recently started to falter as the active
    channel lengths hitting the nanometer regime. This has been the case for the following
    reasons: (a) At these dimensions, the transport of the carrier over the channel
    is not properly governed by laws of statistical mechanics (typically known as
    the Boltzmann equation of transport [6]). (b) At these dimensions, the electrostatic
    control of the controlling terminal, usually as the gate, becomes inappropriate.
    (c) At these dimensions, short channel effects in the devices become prominent
    short channel effects are commonly referred to as current leakage and the resulting
    heat dissipation by an increase in power [7]. (d) At these dimensions, the significance
    of contacts and interconnects between devices becomes more important, as comparatively
    significant power is dissipated at the interface rather than the channel itself.
    As a result, researchers are looking for possible solutions at every level of
    abstraction (viz. circuit, and devices). To address these short channel effects,
    devices such as multiple gate transistors [8, 9], FinFETs [10], FETs [11–13],
    gate-all-around FETs [14], and ultrathin body transistors (UTB) [15, 16] are actively
    looked into. Further, various circuit techniques such as power gating [17] and
    use of multi-threshold transistors have also popularly used. These approaches
    are often chosen as top-down approaches to mitigate scaling issues. Since the
    famous talk by Richard Feynman – “There is plenty at the bottom” – the bottom-up
    view has always been considered one of the approaches to understand fundamental
    properties. Recently, with the advancements in computational and science techniques,
    the bottom-up approach is serving as a foundation for new-era nanoscale devices
    [19–21]. However, both the approaches, nearly top-to-bottom and bottom-up, have
    their advantages and limitations. For example, on the one hand, it is difficult
    to cultivate the complex quantum (bottom-up) view for a bigger circuit and system.
    Thus, the optimal solutions at each system, device, and material are consistently
    being proposed to achieve the required overall result. In recent decades, fundamental
    bottlenecks due to intrinsic materials properties such as electron mobility (due
    to scattering in bulk materials) and mechanical and thermal instability raised
    a severe motion for the research to look for promising new materials [22]. For
    various applications are the consequence of an unprecedented quest for the material
    community. Nanotechnology continues to generate the genre of materials where at
    least one of the dimensions is in the range of nanometers (nm). Unlike bulk materials,
    nanomaterials offer a lot of scope not to overcome existing issues but also to
    widen the applicability horizon. Among these nanomaterials, low dimensional nanomaterials
    such as C-based structures have special attention. These structures include 0D
    fullerenes (balls of carbon), 1D carbon nanotubes (CNT), graphene nanoribbons
    (GNR), and the 2D graphene which is monolayer of graphite [23]. The exotic properties
    of graphene are backed by the recent research in this area, which eventually reconsidered
    the overall interest in the field of layered materials possessing superior electronic
    and optical behavior [24]. Moreover, their excellent mechanical strength, optical
    transparency, and unique direct bandgap make them suitable for a wide variety
    of applications [25–33]. With device performance, it is also evident that for
    channels forming a 2D semiconductor, the carriers will remain focused in the atomically
    thin layers, ensuring better electrostatic control. Such an excellent gate control
    reduces leakage current and reduced short channel effects. Unlike the typical
    semiconducting applications, these materials also possess enhanced mobility of
    carriers, tunable electronic properties, and intrinsic spin orbit coupling (SOC),
    which widens their pool of applications [34]. Thus, immediately after the phenomenal
    of graphene synthesis, researchers have come up with a number of exciting materials
    such as transition metal dichalcogenides (TMDs) [35], hexagonal-bon nitride (h-BN),
    [37]. Apart from these, other group-IV elemental analogues of graphene, namely
    silicene germanane and phosphorene [39–42], have also gained an enormous research
    interest. Silicine and graphene exhibited several astonishing properties enabling
    them to not only serve as active material for state-of-devices but also to entirely
    intend new dimensions to the field [43, 44]. These materials have high'
