    # 13.7.4 H-Plane Sectoral Horn


    A horn antenna is traditionally popular because of its stable radiation pattern
    and broadband characteristics. It finds wide applications in antenna measurement
    and many other various applications. Here in this work, the rectangular waveguide
    structure is flared in a calculated proportion to get the maximum efficient antenna
    structure as per the norms given by the ''universal directivity curve'' [18].
    The fabrication of the horn antenna has been aligned with the rest of the passive
    devices targeted here. Geometry of the antenna is shown in Figure 13.27. Targeted
    specification of the antenna is depicted in Table 13.6. Simulated antenna gain
