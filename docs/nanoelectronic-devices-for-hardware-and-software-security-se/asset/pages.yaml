  md: '# Editors


    **Dr. Balwinder Raj (MIEE''2006)** has been an Associate Professor at National
    Institute of Technical Teachers Training and Research, Chandigarh, India, since
    December 2019. Earlier, he worked at National Institute of Technology (NIT, Jalandhar),
    Punjab, India from May 2012 to December 2019. Dr. Raj also worked as Assistant
    Professor at ABV-IIITM Gwalior (an autonomous institute established by Ministry
    of HRD, Govt. of India) July 2011 to April 2012. He received Best Teacher Award
    from Indian Society for Technical Education (ISTE) New Delhi on 26th July 2013.
    His areas of research interest are classical/non-classical nanoscale semiconductor
    device modeling; nanoelectronics and their applications in hardware-aware security,
    sensors and circuit design, FinFET-based memory design, low power VLSI design,
    digital/analog VLSI design and FPGA implementation.


    **Dr. Arun Kumar Singh** is an Associate Professor in the Department of Electronics
    and Communication Engineering, Punjab Engineering College (Deemed to be University),
    Chandigarh. Earlier to PEC, he had worked as Lecturer at Global Institute of Technology
    from July, 2004 to April 2006. His core research interests focus on novel, high-speed
    semiconductor nanodevices operating at room temperature, terahertz frequencies,
    and their application in energy harvesting.'
