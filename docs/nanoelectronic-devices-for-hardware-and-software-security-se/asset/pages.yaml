    # 16.4.2 The Structure of the Device


    The graphene SymFET device is shown in Figure 16.4a. The insulator is reserved
    to separate the two layers of graphene. Here, the boron nitride (BN) acts as an
    insulating layer. Therefore, it creates a structure graphene-insulator-graphene
    (GIG) sandwiched between a top and bottom gate. The 2D materials like boron nitride
    (BN) might be a good choice to decrease the interface density until it reduces
    the dangling bond. BN material will be present along the graphene layer to align
    the structure. Stacking graphene and BN will provide a smooth surface; meanwhile,
    BN shares a hexagonal lattice structure with graphene. The graphene layers achieved
    conductivity individually to represent the source (S) and drain (D). In this,
    the top electrode is considered to be the n-doped and the bottom electrode is
    considered to be the p-type region. The top gate voltage ($V_{TG}$) and bottom
    voltage ($V_{BG}$) are considered by the quasi-Fermi level ($\mu_n$, and $\mu_p$).
    In the graphene layer, the quasi-Fermi level is $\Delta E$; the Fermi level is
    present above the Dirac point, and for the p-type region, it is below the Dirac
    point; this was stated by Hasan et al., [8]. In graphene, both the top and back
    gate are symmetric; here the gate voltage $V_{GB} = V_G$ and the drain to source
    voltage is given as $V_{DS} = V_G - V_S$. The 2D representation of the device
    as well as internal current drifts are clearly shown in Figure 16.4b.


    # 16.4.3 Operation of the Device


    The operation of the graphene SymFET device is shown in Figure 16.5. In the Dirac
    point, if the top and bottom layer are skewed, then the solitary energy level
    will achieve the condition of concurrent energy and momentum conservation, therefore
    the tunneling current is as shown in Figure 16.5a and b. If both layers are aligned
    equally at $V_{DS} = 2\Delta E/q$, the electrons present at all the energies between
    the Fermi level ($\mu_n$ and $\mu_p$) achieve energy and momentum conservation
    [8, 41–45]; hence the tunneling current is large under this condition, as shown
    in Figure 16.5 c.'
