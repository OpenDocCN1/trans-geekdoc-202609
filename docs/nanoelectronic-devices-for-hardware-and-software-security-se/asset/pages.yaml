    # 14.4.3 Metal-Semiconductor-Metal Photodetector


    The metal-semiconductor-metal (MSM) photodetector is regarded as an interdigitated
    photoconductor with the metal-semiconductor and semiconductor-metal junctions
    similar to Schottky barriers. The MSM photodetector is monolithic integration
    and is fabricated using processing steps similar to those needed for the construction
    of field-effect transistors (FETs) [43]. Normally, the MSM photodetector can be
    realized either back-to-back ohmic contacts during photoconduct operation or back-to-back
    Schottky contacts during photovoltaic operation. However, neither of these device
    architectures can work under self-powered mode, which is 0 V bias [44].


    A typical device scheme of the MSM photodetector is depicted in Figure 14.7 [27]
    that comprises two metal electrodes on the top of the semiconductor absorption
    layer that absorbs a significant amount of incident photon over the desired spectral
    regime [9]. The low-resistance contacts are created by the conducting layer with
    the interdigitated electrodes with a finite width (1–7 $\mu$m) and finger spacing
    (1.5–5 $\mu$m), as demonstrated in Figure 14.7 [9], [27], [45], [46]. This MSM
    structure resulted in a planar architecture with an inherently low parasitic capacitance
    that allowed high-speed operation (up to 300 GHz)'
