  md: '# 2 · A Novel Vertical Tunnel FET 35


    ![](img/f43fc2d88fdf77da6ccf8abfe605d6a7_47_0.png)


    **FIGURE 2.1** Basic structures of (a) an n-type TFET and (b) an n-type MOSFET.


    n-type TFET as opposed to n+ for both source and drain doping in an n-type MOSFET,
    as illustrated in Figure 2.1. However, the channel region of the TFET is intrinsic
    or lowly doped. An insulator is employed to separate the gate from the channel
    region. A TFET is termed as n- or p-type according to the channel''s dominant
    carrier, which is electrons for an n-type TFET or holes for p-type TFET, respectively.
    The chapter focuses only on the n-type TFET as the principle of operation is similar
    for both types of TFET (p-type injection into the source is holes whereas it is
    electrons for n-type). However, it should be noted that regardless of the type
    (n- or p-type), TFETs are ambipolar devices in comparison to MOSFETs. For instance,
    in an n-type TFET, if the gate is highly negatively biased, electrons being the
    main contribution in the current, transport may show p-type=like behavior.


    For an n-type TFET, a positive source voltage ($V_{gs}$) is applied to the gate,
    which induces a band bending at the channel, resulting in tunneling of electrons
    from $E_s$ of the source to $E_c$ of the channel region. The electrons that tunneled
    the channel region are swept to the drain terminals due to the positive biasing
    at the drain. At this time, the transistor is considered to be in the ON-state,
    when the gate is biased and no tunneling occurs from the source to the channel
    region, it is considered as OFF-state, as depicted in Figure 2.2. An in-depth
    discussion on the tunneling phenomenon is demonstrated in section 2.3. One benefit
    among the BTBT is the lack of the thermal (KT) dependency which makes for sharper
    than 60 mV/decade ON characteristic at $T = 300$ K. The resultant band to band
    tunneling current is mathematically defined as (detailed equations in section
    2.3) [14]:


    ```

    $I_{BTBT} \simeq A^2 \exp\left[\frac{B}{\varepsilon}\right]$$ (2.1)

    ```


    where $A$ and $B$ are parameters dependent on the semiconductor material. Since
    the p–i–n structure of the TFET is in reversed bias in the OFF-state, diode leakage
    currents are the main contribution to the off current ($I_{OFF}$), and are substantially
    lower than the OFF-state current of the MOSFET [15].'
