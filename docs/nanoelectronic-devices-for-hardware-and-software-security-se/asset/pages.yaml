    reactive ion etching. A generic two wafer process steps are shown in Figure 13.13,\
    \ which is applicable for realizing all the previously mentioned passive components.\
    \ The steps can be described as follows:\n\n+   i. It is two wafer processes.\
    \ Initially, bonding two double-sided polished silicon wafers are taken and given\
    \ requisite chemical cleaning (RCA + SPM) to eliminate all possible organic and\
    \ inorganic contaminants. After that, on the first wafer, the following process\
    \ steps are performed:\n a. A thick oxide layer is deposited on its front side.\n\
    \ b. The oxide layer is patterned to form a channel through DRIE etching.\n c.\
    \ DRIE process is applied to the depth of the lateral dimension of the rectangular\
    \ waveguide.\n d. The oxide layer is removed.\n e. A conformal gold layer is evaporated\
    \ to metalize the trench.\nii. On the second wafer, gold is deposited on the front-side\
    \ by E-beam evaporation.\niii. The second wafer is flipped to make the metal layer\
    \ on its bottom side, and then both of the wafers are bonded together eutectic\
    \ bonding at 363°C. Thus, the waveguide channel is formed."
