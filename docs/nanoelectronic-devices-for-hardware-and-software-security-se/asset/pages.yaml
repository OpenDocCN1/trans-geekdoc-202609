  md: 'With this chapter, we present the prospects of SiNR and GeNR as metal interconnects
    under various functionalization and doping scenarios. We have systematically analyzed
    the performance of various configurations by studying their structural, electronic,
    and transport properties. Here we will present the key performance parameter based
    on density functional theory (DFT) calculations and nonequilibrium Green''s function
    (NEGF) formalism-based two-probe analysis that includes quantum resistance ($R_Q$),
    kinetic inductance ($L_Q$), and quantum capacitance ($C_Q$) for the considered
    structures.


    # 4.4 EDGE FUNCTIONALIZED GENRS FOR INTERCONNECT APPLICATIONS [109]


    In this section, we present the analysis of edge oxidation and hydrogenation on
    electronic and transport properties of zigzag and armchair germanane nanoribbons
    (ZGeNR and AGeNR); we have modeled all possible terminations of hydrogen and oxygen
    for AGeNR and ZGeNR. Figures 4.2 and 4.3 present all possible termination cases
    for AGeNR and ZGeNR, along with the appropriate names, as presented in the caption
    for each case.


    Here, white and red spheres represent the germanium, hydrogen and oxygen atoms
    respectively. First, to compare structural stability of each configuration, we
    have calculated the binding energy ($E_b$) as per equation 4.1.


    ```

    $E_b = E_{Total} - E_{Bare} - x_H - y_O \quad (4.1)

    ```


    Here, $E_{Total}, E_{Bare}, E_H, E_O$, indicate the total energy of functionalized
    AGeNR/ZGeNR, bare AGeNR/ZGeNR, and the H and O- atoms, respectively. Also $x,
    y$ represent the total count of these atoms respectively. Further, based on the
    DFT calculations, we also calculated the respect bandg and Fermi velocity ($v_f$)
    in each of the cases. These are tabulated in Table 4.1.


    ![](img/f43fc2d88fdf77da6ccf8abfe605d6a7_102_0.png)


    **FIGURE 4.2** The relaxed configurations for functionalized AGeNR (ribbon with
    width $N_A=7$): (a) H-AGeNR-H, (b) O-H-AGeNR-H, (c) O-AGeNR-H, (d) O-H-AGeNR-O,
    (e) O-AGeNR-O.'
