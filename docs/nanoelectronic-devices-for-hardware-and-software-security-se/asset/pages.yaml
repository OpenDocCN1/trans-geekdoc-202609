    # # 2.5.1 Gate Engineering


    As the gate controls the band bending and the carrier injection density in TFETs,
    gate engineering is found to have a tremendous impact on the transistor ON-state
    current. This implies multiple gates, including using a double gate instead of
    the single gated TFET. The double gate enables the coupling of the gate and channel
    with the potential because tunneling takes place from two sides, underneath each
    of the gates at the source/channel junction [24]. For an ultra-thin double gate
    TFET (DG-TFET), the increment in $I_{ON}$ is more than twice that of a single
    gate TFET because of the impact of both the gates [25]. In addition to this, the
    gate around TFET ( GAA TFET) is another method to control the channel and boost
    $I_{ON}$. Another technique is the dual-material gate (DMG) TFET, in which different
    work material gates are used and the existence of low work function gate material
    close to and high work function gate material near the channel/drain junction
    reduces the ambipolar current [27].


