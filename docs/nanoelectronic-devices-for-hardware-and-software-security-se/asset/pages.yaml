    PUF and arbiter PUF designs enjoy extensive-response domains. On the other hand,
    the SRAM PUF possesses limited challenge-response pairs. The key generation often
    requires the use of a fuzzy extractor, which combines correction with hash-based
    amplification.


    Unfortunately, most implementations of PUFs are vulnerable to attack, by observing
    a relatively limited number of CRPs, an adversary can construct a machine-learning
    model, making it possible to predict the performance response of the PUF to a
