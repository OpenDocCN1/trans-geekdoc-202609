  md: "# 15.2 HIGH SPEED MATERIALS\n\nThe requirement of high speed electronic components\
    \ and devices in communication, medicine, and security is increasing day by day,\
    \ which results in the requirement of novel materials. The progress in material\
    \ science and enabling the growth of novel materials with high carrier concentration\
    \ and mobility, for III–V materials and graphene.\n\n# 15.2.1 III–V Based Materials\n\
    \nHigh speed devices have been fabricated using III–V material quantum well heterostructure.\
    \ The III–V material contains different compound materials such as InP, AlGaAs,\
    \ InGaAs, and GaN [8], [9]. High mobility enables the heterost-based devices to\
    \ operate at very high frequency, up to several GHz, and room temperature. These\
    \ semiconductor structures can be grown with materials nearly the same lattice\
    \ constant as that of a different bandgap.\n\nThe combination of different compound\
    \ materials generates the two-dimensional electron (2DEG) in the channel where\
    \ carriers are free to move only in two directions. As a result, charge charges\
    \ provide better control to design the devices [10]. The fabrication process of\
    \ heterostructure is similar than that of bulk materials, which consist of different\
    \ layers as substrate, buffer, spacer, barrier, and cap layer [9]. These materials\
    \ can be grown using molecular beam epitaxy (MBE) [11] and organic chemical vapor\
    \ deposition (MOCVD) [12] techniques.\n\n# 15.2.2 Novel Materials\n\nNovel materials\
    \ including graphene have been exposed with very high carrier mobility. Graphene\
    \ was first demonstrated at the University of Manchester, UK, in 2004 [13]. The\
    \ graphene is a unit of graphite having two-dimensional (2D) honeycomb lattice\
    \ structure with zero bandgap [14], [15]. Graphene has excellent properties such\
    \ as high carrier mobility, thermal conductivity, mechanical strength, flexibility,\
    \ transparency. Therefore, graphene has attracted many industries and academia\
    \ to utilize it for various applications [15], [16]. High quality monolayer graphene\
    \ and few layer graphene can be grown by mechanical exfoliation [13], [17]; however,\
    \ other techniques such as chemical vapor deposition (CVD) [18], [19], chemical\
    \ exfoliation [20], and ultrasonic exfoliation [22] can also be used to grow the\
    \ multilayer graphene. The graphene mobility up to 20,000 cm²/Vs at room temperature\
    \ [23]. The mean path for graphene has been estimated to be in the µm range, at\
    \ at a mobility of 10,000 cm²/Vs and carrier concentration of $5 \times 10^{12}$\
    \ cm⁻² [13]. A large mean path allows the fabrication of electronics devices ballistic\
    \ transport.\n\nSeveral research groups are now concentrating on developing new\
    \ classes of 2D materials such as dichalcogenides (MoS₂, and WS₂), 2D ZrO, h-BN,\
    \ and phosphorus [16], [24]. These materials have structure similar to that of\
    \ graphene. The nanofabrication provides creates to combine the graphene with\
    \ other 2D materials such as a graphene/MoS₂, heterostructure to take the advantage\
    \ of both the material properties. The graphene/h-BN-based heterostructure is\
    \ expected to provide high carrier mobility up to 200,000 cm²/Vs [25], [26].\n\
    \n# 15.3 NANOELECTRONICS\n\nThe limitation on reduction in dimension encourages\
    \ novel devices that are small enough resulting in high speed and heat dissipation.\
    \ At the same time, these devices have been realized at room temperature. In this\
    \ section, several devices have been proposed with different working principles,\
    \ and as shown in Table 15.1."
