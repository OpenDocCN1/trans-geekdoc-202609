    # 13.8 CONCLUSION


    This chapter emphasizes the potentiality of silicon micromachining technology
    for the development of submW and THz applications. The impetus of such high frequency
    technology in the modern communication world as well as in daily human life has
    also been outlined. The status of various research institutes at the national
    level (Indian scenario) along with their work initiative has highlighted here.
    The inherent merits of silicon micromachining are implemented to develop such
    precise and tiny passive devices for submW and THz applications. Various process-related
    issues have also been addressed with analytical simulations data, which clearly
    depicts the implication of fabrication tolerances. Generic process flow of such
    devices has also been proposed with two wafer approaches. Finally, four types
    of passive devices have been designed with this method. Fabrication of such devices
    is under progress.


