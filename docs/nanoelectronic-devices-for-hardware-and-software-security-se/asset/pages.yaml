    for G-TTJ, and input (S and D), and output (L and U) terminals for G-FTBR, respectively.
    Both rectifiers used graphene as a channel, where charge carriers can be tuned
    with back gate voltage.


    exhibits the change in sign by reversing the gate voltage at room temperature
    [136]. Similarly, graphene-based four rectifiers (G-FTBR) were first reported
    by A.K. Singh et al. in 2015 in Figure 15.4b, which confirms the rectifying obtained
    using Si/SiO2 substrate [26].


    The TTJ and FTBR were explored experimentally and theoretically using III–V materials.
    However, graphene-based rectifiers are required to be explored more concerning
    their theoretical and experimental perspective. As predicted, these devices can
    also be demonstrated at very high microwave frequencies by carefully selecting
    a substrate that induces low parasitic capacitance.


    # 15.4 BACKGROUND


    a number nanoelectronic devices are available with dimensions smaller than the
    mean free path of charge carriers. The ballistic transport of charge carriers
    is dominant in the active region of the device. The ballistic transport governs
    the elastic travel of carriers within the channel region of the device without
    losing any energy. In contrast, scattering takes places only at the device boundary,
    which results in heat dissipation through the electrical contacts [141]. During
    the last two decades, ballistic transport has been well explored in nanoelectronic
    devices at room temperature and high frequency.


    The phase coherence in a four terminal conductor was conducted by Büttiker in
    1986 [142]. The electrochemical potential and transmission probability and resistance
    between leads of the conductor have been used to form the current in the output
    leads. In previous studies, which the voltage drop has been seen over a distance
    comparable to the mean free path of carriers without considering the phase coherence,
    [14], four terminal resistance has been developed to relate the symmetry between
    voltage and current at the input and output leads. Similarly, experiments have
    been performed on QPC to study the quantum phenomenon [30]. The QPC shows the
    conductance plateaus at lower temperature due to comparable mean free path, and
    with the increase of temperature and magnetic field, the quantized conductance
    behavior includes Hirayama. Hirayama and Tarucha in 1993 reported the room temperature
    ballistic transport in the four terminal device from AlGaAs/InGaAs/GaAs materials
    in Figure 15.5 [143]. The bending resistance of junction-junction has the negative
    characteristic obtained in response to the applied field at different temperatures
    ranging from 1.5 K to 290 K. The result clearly demonstrates higher carrier mobility
    at low temperature (6.5 × 10 cm²/Vs as compared to below 35 K) (7.8 × 10³ cm²/Vs
    vs above 70 K), which suggests that the mean free path is more abundant at lower
    temperatures.'
