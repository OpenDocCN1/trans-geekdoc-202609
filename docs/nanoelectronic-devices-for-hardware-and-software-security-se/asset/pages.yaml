  md: '# 15 Nano-Rectifier 313


    After the invention of graphene with the number of novel properties, many efforts
    have been made during the last few years to design the novel nano-rectifiers as
    G-TTJ and G-FTBR.


    # 15.4.3 Graphene Based Nano-Rectifiers (G-TTJ and G-FTBR)


    The first successful demonstration of G-TTJ was done by Jacobsen et al. in 2010
    [136]. The rectifier was designed on graphene, which was prepared by mechanical
    exfoliation on a Si/SiO2 substrate with 285 nm dielectric thickness. The device
    exhibits rectification efficiency around 4% at 4 K compared to 1% at 300 K. The
    rectified response of the G-TTJ can be tuned using a back gate electrode. Furthermore,
    the graphene TTJ has been demonstrated on silicon carbide (SiC) using epitaxial
    growth. The rectification efficiency of 25% at an input voltage of 2 V has been
    achieved [130]. As compared, a chemical doped (polyethylene) exfoliated TTJ has
    been designed on a Si/SiO2 substrate with a thickness of 300 nm [127], [134].
    The chemical doping provides the passivation to the graphene layer, which results
    in higher mobility. Another G-TTJ has been demonstrated on exfoliated graphene
    having a 300 nm Si/SiO substrate, demonstrating rectification of 8% for the input
    signal of 500 mV [122]. The rectification was attributed to charge transfer between
    metal and graphene layer between two terminals.


    The finite element simulation has been used to design the G-TTJ on a Si/SiO2 substrate
    [131]. The rectify diffusion modeling and noise analysis of G-TTJ has been reported
    in [81]. Similarly, TTJ has been fabricated on a silicon Si/SiO2 substrate with
    the dielectric thickness of 90 nm. The device shows a voltage gain of 0.013, which
    needs to be improved for practical application. The designed device confirmed
    15% rectification efficiency at an input voltage of 100 mV. Furthermore, the SiC-based
    G-TTJ was proposed [133] with rectification efficiency of 30% for an input voltage
    of 2 V. The curvature of the rectified output can be changed with the FBR width
    and the bending change to change the phase from TTJ to YJ [133].


