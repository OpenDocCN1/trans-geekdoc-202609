- pgno: 53
  md: '# 2.4 ELECTRICAL PARAMETERS IN TFETs


    A number of electrical parameters that are of interest in TFETs are the ON-state
    current ($I_{ON}$), OFFstate leakage current ($I_{OFF}$), current ratio ($I_{ON}/I_{OFF}$),
    average subthreshold swing ($SS_{avg}$), point subthreshold swing ($SS_{point}$),
    threshold voltage ($V_{th}$) and total gate capacitance ($C_{fg}$).


    # 2.4.1 On-State Current


    As mentioned in previous sections, when a positive gate voltage is supplied, the
    band bending occurs in the source/channel region, enabling the tunneling of electrons,
    which is collected by the positive drain bias. In terms of the TFET transfer characteristic,
    the ON-state current ($I_{ON}$) is defined and measured at the gate voltage, $V_{GS}
    = 1$ V, at a drain voltage, $V_{DS}$ of 0.5 to 1 V. A substantial amount of tunneling
    current flows under this condition.


    # 2.4.2 OFF-State Current


    Here, the TFET is considered to be in the OFF-state when $V_{GS} = 0$ V with $V_{DS}$
    of 0.5 to 1 V. During this time, no band bending takes place, ensuring that only
    a relatively low leakage current flows of the order around $10^{-13}$ A.


    # 2.4.3 Current Ratio


    Current ratio is defined as the ratio of the ON-state to the OFF-state leakage
    currents, the ON-state current is evaluated at $V_{GS} = 1$ V at $V_{DS}$ of 0.5
    to 1 V and OFF current at $V_{GS} = 0$ V at $V_{DS}$ of 0.5 to 1 V. Typically,
    the $I_{ON}/I_{OFF}$ ratio of a TFET is ~$10^8$.


    # 2.4.4 Subthreshold Swings


    The subthreshold swing (SS) of a transistor is determined as the amount of gate
    voltage needed to lower the drain current by an order of magnitude. It is a vital
    parameter in determining the switching characteristics of a transistor and circuit
    in designing. Mathematically, it is expressed as:


    ```

    $SS = \frac{\partial V_{gs}}{\partial(\log I_D)} \text{ mV / decade$

    ```


    In the subthreshold region, it is noteworthy that traditional MOSFETs differ from
    TFETs. A MOSFET''s subthreshold slope is constrained by the device’diffusion–current
    dynamics in weak inversion; the lowest theoretical SS for an ideal MOSFET is 60
    mV per room temperature ($300^K$). The current conduction mechanism in TFETs,
    however, is dependent on the tunnel barrier length instead of depending upon inversion
    layers and does not have the same physical constraint as MOSFETs. The SS in TFETs
    is not dependent on the thermal factor ($KTiq$), as the tunneling current is only
    slightly temperature dependent. Mathematically, the SS in TFETs is expressed as:


    ```

    $SS_{TFET} = \frac{V_{gs}^2}{V_{gs}^2 + Const} \text{ mV / decade$

    ```'
