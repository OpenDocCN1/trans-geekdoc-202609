    # 7.9.2 CPUs: Configurable PUFs


    A managed PUF or CPU, in conjunction with other (cryptographic) primitives, as
    proposed by Gassend et al. [52], is a mode of operation for a PUF. A PUF is said
    to be managed if it can only be reached by an algorithm that is inseparably connected
    to the PUF. Attempts should break the connection between the PUF and the access
    algorithm, leading to destruction.


