    # 12.5 APPLICATIONS OF MICROSTRIP PATCH ANTENNA


    Due to the high-performance design features of microstrip patch antennas, they
    are used in many applications such as biomedical instruments, wireless and satellite
    communication [17] and aircraft, and rocket and missile tracking. Because of various
    advantages such less weight and ease of design and fabrication, the microstrip
    patch antenna is used in many commercial applications. Certain applications are
    listed here.


    # 12.5.1 Wireless Cellular and Satellite Communication Applications


    This cellular application requires less weight, less cost, a small shape, and
    low dimension antennas. The microstrip patch antenna can be easily designed with
    various polarizations, which is the basic need of satellite communication [18].
    In satellite communication, both square and circular patch antennas are employed
    with many feeder systems.


    # 12.5.2 GPS Applications


    The fabricated microstrip patch antennas [19] have a substrate with high permittivity,
    which is the major requirement of Global Position System applications. The permittivity
    depends on the materials used, and it will be less expensive. In an automated
    vehicle with route map applications, GPS receivers should be able to track and
    capable enough to adapt circular polarization.'
