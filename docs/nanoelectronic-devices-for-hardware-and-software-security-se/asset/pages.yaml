    # 13.1 INTRODUCTION


    Submillimeter wave (mmW) or terahertz (THz) research has gained unprecedented
    interest and momentum over the last few years due to high demands for a data-rate
    in pursuit of high-speed THz link. This has been further propelled by diversified
    applications in other fronts such as (i) THz imaging in surveillance applications,
    thanks to its high resolution capability, and (ii) THz imaging for medical applications
    [1, 2]. THz rays (T-rays) are non-ionizing radiation, which means it does trigger'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'any harmful chemical reaction in human tissue. With this attractive feature,
    THz technology is becoming attractive in biomedical applications, too. This chapter
    would provide a generic overview on this emerging THz technology, inherent challenges
    associated with it, and potential applications. It will also deal with various
    building blocks that are the backbone of establishing a communication link at
    the THz frequency band. The fundamental limitation of the THz band is extreme
    atmospheric attenuation, which has surged the development of high gain antennas
    over the last few years. The present chapter also deals with development of high
    gain antennas for THz applications. A comprehensive look on the national status
    of present THz research and activities along with future directions is also presented
    here. THz frequency range covers the submillimeter regime, fabrication of the
    small devices and device components calls for many sophisticated technologies;
    (i) CNC (computer numerical control) milling and (ii) silicon micromachining.
    Currently, THz systems are predominantly manufactured by CNC milling. In recent
    years, CNC has achieved a high level of precision and reliability, however, it
    lacks the ability to manufacture at volume, which makes the overall process time
    consuming as well as costly. In contrast, silicon micromachining technology is
    useful for volume production, and at the same it offers fabrication precision
    on the order of microns or even below (depending upon the technology node and
    type of lithography process used). Moreover, the micromining process yields a
    good surface profile with the surface roughness of finished product in the range
    of nanometers (reducing losses associated with surface roughness at THz). Furthermore,
    this process is also capable of fabricating high-aspect ratio geometries that,
    using any other fabrication technology, are hardly possible to fabricate. Due
    to these inherent advantages of Si-micromachining, many physical, inertial, biological
    sensors, microphones, and/microwave devices are being fabricated with this technology.
    The present chapter, as will be elaborated in the next sections, deals with the
    design and development of various passive components and high gain antennas using
    silicon micromachining technology for THz applications. The passive components
    and antennas are designed and optimized using Ansys HFSS suite. The finalized
    designs are under fabrication using the well-established DRI (deep reactive ion
    etching) micromachining technique at Semi-Conductor Laboratory (SCL), Chandigarh,
    India.


    # 13.2 POTENTIALS AND CHALLENGES ASSOCIATED WITH THz TECHNOLOGY


    THz is the range of frequency from roughly 300 GHz to 3 THz. In terms of wavelength,
    this band refers from 1 mm to 100 μm, because of which the THz band is also known
    as the submillimeter wave band. Figure 13.1 shows a very popular electromagnetic
    spectrum ranging from microwave to X-rays with embedded


    ![](img/f43fc2d88fdf77da6ccf8abfe605d6a7_268_0.png)'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'applications at various bands. As evident from the Figure 13.1, due to a lack
    of practical technologies for generating and detecting the radiation over mm-waves
    and below optical bands, there exists a gap in the spectrum above 100 GHz and
    up to THz. This spectrum hole is popularly known as ''the THz-gap''.


    In spite of overall challenges, the THz band is gradually unravelling wide attractive
    features in diversified frontiers of applied electromagnetic. One of these features
    is its non ionizing nature, meaning its photons are not energetic to knock electrons
    off atoms/molecules in human tissue, eliminating the triggering of harmful chemical
    reactions in the body from the THz-beam, which makes it suitable for bio-medical
    application [4]. Another characteristic of THz waves is the potential to detect
    hazardous gases and materials remotely. Various natural as well manmade molecules
    in their gaseous state, like NH3 (ammonia), CO (carbon monoxide), H2S (hydrogen
    sulfide), and CH3OH (methanol), also, absorb photons when stimulated at terahertz
    frequencies. Absorption bands serve as chemical fingerprints for these harmful
    gases. In our universe, which is more or less a black box to us, radiating most
    at submillimeter wavelengths and far-infrared (100 GHz–10 THz) radiation along
    with cosmic microwave background (CMB) radiation [5]. Thus, this spectral range
    contains information about the origin of the planets, stars, galaxies, and clusters.
    With this ample presence in the universe, the THz-band offers a wide application
    range in sensors development for medical imaging, astronomy and astrophysics,
    gas detection, monitoring of the earth''s atmosphere, and homeland security and
    surveillance.


    As we can see from atmospheric absorption curve in Figure 13.2, atmospheric attenuation
    is the main barrier to the terahertz band for long-range communication and radar.
    Typically, if we generate the 1 W signal with a frequency of 1 THz, it will be
    diminished gradually to almost nothing (it remains about 10 to 30% of its original
    strength) after traveling just 1 km [4].


