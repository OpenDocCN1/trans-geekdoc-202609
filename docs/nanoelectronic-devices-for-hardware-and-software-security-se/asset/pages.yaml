  md: '# 16.1 INTRODUCTION


    For a decade, novelty-based device technologies have been investigated to design
    the sub-10nm devices for a cybersecurity operating system. Tunneling devices fabricated
    by two-dimensional (2D) materials exposed good potential for the operation of
    low voltage. Here it became a promising material for providing good energy to
    the digital circuit design and systems. Some emerging tunneling devices like SymFETs
    and BiFETs are attractive. The I–V characteristics of the tunneling devices are
    different from those of MOSFETs. SymFET devices are especially attractive for
    security applications because they utilized low power, controlled speed requirements,
    and establish improved efficient dynamic energy towards CMOS circuits. In addition,
    CMOS technology does not support security applications. The large leakage become
    an interesting challenge in SymFET circuits. The most required property for these
    devices is a large on-current to off-current ratio to minimum power and low-voltage
    operation. Due to its unique I–V characteristics, for security-based circuit design,
    it has been used for a perspective of new technologies in cybersecurity protection
    schemes, these new methods are developed for the hardware infrastructure, and
    it is being changed to support security policies. Hence, the protection scheme
    at the system level will become more effective.


    In this chapter, the 2D structure of graphene-based symmetric field-effect transistor
    (SymFET) and the currents interact through the device. A single-particle tunneling
    model modeled to calculate the current-voltage characteristics of the device.
    Tunneling current and voltage distribution in the graphene electrodes will decide
    the device''s behavior. If the tunneling current is small, due to either coherence
    length or long tunneling thickness, zero variation will be achieved in the voltage
    distribution of the graphene electrodes, was discussed by Zhao et al. [1]. If
    the tunneling current is large, due to either coherence length or small tunneling
    thickness, the voltage distribution will be appreciable. The tunneling effects
    are not present in 1D (one-dimensional) SymFET, but it can be captured in the
    2D graphene SymFET devices [2,3]. These effects can increase the V–I characteristics
    of the device; hence, a graphene SymFET is more suitable for hardware security
    applications [27–35].


    # 16.2 GRAPHENE


    Graphene is a 2D material a single atom thick composed of Sp2-bonded carbon atoms.
    It is attractive for its interesting honeycomb structure. Each carbon atom is
    arranged in the structure with a space of about 1.42 Å. The 2s orbital is hybridized
    with the 2px and 2py orbital in the plane through trigovalent carbon bonds at
    the angle of 120°. A weak π-bond is arranged perpendicular to the pz orbital in
    the plane. The layers in the graphite are arranged together with the van der Waals
    force of attraction, which is consequently weak, and in graphite structures, the
    π-bond is assured for electronic properties. Graphene is an eminent material that
    is taken from building blocks of graphite. The electronic band structure was measured
    by the tight-binding theory and explained Wallace et al. [4]. The bandgap between
    the conduction band and valence band is zero. Hence, the valence band and conduction
    band are coincidences at the Brillouin zone called the Dirac point. The structure
    of graphene was more attractive, and it was remembered several times in various
    circumstances (And et al.) [5]. The hexagonal structure of graphene is shown in
    Figure 16.1.'
