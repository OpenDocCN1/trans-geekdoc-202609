    # 8.3 MEDICAL IOT DEVICE EVALUATION AND VULNERABILITIES ANALYSIS


    The privacy vulnerabilities are broadly classified into three phases, that is,
    data collection, clear text identification, and metadata analysis.


    # 8.3.1 Data Collection


    IoT data collection is the process of using sensors to track the conditions of
    physical things. In the created test environment, different devices are connected
    to network and their corresponding traffic is captured live. It helps to separate
    traffic on devices and filter the traffic if any unwanted or illegal traffic is
    observed. Wireshark is demonstrated in the Coursera course, and it is used to
    capture all the traffic or packets from access points to each IoT device. The
    hackers can save these packets in PCAP files for analysis in offline mode. The
    data is collected in many instruments, along with user registration and full details
    with health information.


    # 8.3.2 Cleartext Identification


    The analysis of captured packets is broadly explained in this section. The separation
    of data packets depends on the protocol. These protocols mainly focus on HTTP
    and TCP packets and ignore the SSL packets, which are encrypted. After separating
    the data packets, the separation of the payload is in sequence. The payload consists
    of application data packets that help analyze the open system interconnection
    (OSI)-based application layer. This classification can be analyzed using three
    different schemes [31]: i.e., the naive ASCII approach, Shannon entropy test,
    and method comparison.


    # 8.3.3 Metadata Analysis


    Patient health information details such as blood sugar are analyzed, and the data
    is measured at regular periods. Wireshark software helps to determine patient
    behavior. With IP addresses, hackers can track the data. Figure 8.4 shows the
    medical IoT device''s vulnerability [32].'
