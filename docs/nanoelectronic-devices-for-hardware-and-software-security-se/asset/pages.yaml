    # 3.1.7.6 Responsivity and Quantum Efficiency


    In addition to response time and detectivity, the different parameters for evaluating
    photosensor efficiency are responsivity ($R_\phi$) and quantum efficiency ($Q_e$).
    The $Q$ gain defined as the number of charge carriers that pass for each photon
    absorbed between the electrodes and the responsivity of a photosensor. $R_\phi$
    is defined as the photocurrent generated on the effective area of the sensors
    per unit of light power. The expression for $R_\phi$ and $Q_e$ is shown by equations
    3.12 and 3.13, where $h$ represents the Planck constant, $q$ is the electron charge,
    and incident radiation wavelength is represented by $\lambda$ [47].


    ```

    $Responsivity (R_\phi) = \frac{\text{Available Photocurrent},I_{ph}}{\text{Incident
    optical power},P_o} (3.12)$

    ```


    ```

    $Quantum Efficiency (Q_e) = R_\phi \frac{h}{q\lambda} (3.13)$

    ```


