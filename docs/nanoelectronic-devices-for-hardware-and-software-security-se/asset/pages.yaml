    # 6.1 INTRODUCTION


    The memristors are the fourth fundamental and volatile electrical two-terminal
    devices. These behave as nonlinear resistors with memory, hence named memristors
    [1]. Memristors are axially defined by a relationship between electric charge
    and magnetic flux [1, 2]. It is known to be flux controlled or charge controlled,
    depending on whether this relationship can be expressed as a single-valued function
    of the flux-linkage ($\phi$) or charge ($q$). The voltage developed across charge-controlled
    memristors are given


    ```

    $v(t) = M(q(t))i(t)$ (6.1)

    ```


    Where $M$ is memristance, measured in ohms.


    ```

    $M(\phi) = \phi(q)/dq$ (6.2)

    ```


    Similarly, the charge-controlled memristors are given by


    ```

    $i(t) = W(\phi(t))v(t)$ (6.3)

    ```


    Where $W(\phi)$ is inductance, measured in mhos.


    ```

    $W(phi) = dq(\phi)/d\phi$ (6.4)

    ```


    The memristors can behave as simple resistors at any instance for high-frequency
    range, while resistance and inductance rely on the past of memristors [1, 2].


    # 6.1.1 Device Structure and Basic Model


    In 2008, R. Stanley Williams, with several colleagues at HP Laboratories, fabricated
    a memristor using titanium oxide and platinum electrodes. Williams''s memristor
    consists of a transition metal oxide (TiO$_2$) separated by two platinum metal
    electrodes, as shown in Figure 6.1 [2]. Oxygen vacancies are created on one side
    of the transition metal oxide so that this part of the layer will become conductive.'
