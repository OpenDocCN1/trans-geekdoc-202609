  img_proc: true
- pgno: 264
  md: '# 12.5.3 Radar Application


    Radar is used to estimate the moving target, which is used in real-time application.
    Primarily it is employed in a moving vehicle, and with its speedy fabrication
    process, bulk production is possible.


    # 12.5.4 Worldwide Interoperability for Microwave Access (WiMAX)


    The nano-structured patch antenna is made; it is used for WiMAX [20] applications
    with IEEE 802.16 standard. WiMAX uses 70 Mbps as a data rate, transmits data at
    the rate of more than 70 Mbps, and operates in three resonant modes, from the
    2.7 to 5.3 GHz range up to a 30-mile radius.


    # 12.6 CONCLUSION


    The honeycomb PhC patch antenna was built and simulated by utilizing CST software.
    The PhC antenna characteristics are found to loftier than the conventional antenna.
    Table 12.2 represents the variance between the conventional antenna and the PhC
    antenna performances. The determined return loss of the patch antenna on PhC is
    -44.14 dB on 14.72 TH. This work explains the impact of PhC with the square lattice
    structure, and the analysis is done by changing the hollow radii in the PhC structure.
    The simulated output proved that the antenna performances of PhC are more enhanced
    than that of the conventional antenna structure. This PhC antenna is applicable
    for high-speed satellite and wireless communication.


    # 12.7 FUTURE SCOPE


    With the help of advanced techniques and high performance matching systems, we
    can enhance the bandwidth of the antenna; moreover, the directivity can be improved.
    The finite element method can be employed to resolve and strive all the designs.
    It is intended to try to reduce the size of the antenna by scaling it to the optimum
    configuration.


