    # 8.6 CONCLUSION


    Medical data is confidential, and it needs to be protected. This chapter explains
    the security of authenticated RFID protocols for medical IoT. First, this chapter
    presents a brief introduction about proposed medical IoT and RFID protocols and
    their features. Second, this chapter explains the details about attacks in RFID
    protocols and an analysis of security requirements.


    In conclusion, medical IoT devices cannot be fully secured unless a strong foundation
    is created with hardware components. The efforts and cost of manufacturing of
    the devices could lead to waste if the device has a hardware Trojan inserted.
    This hardware Trojan will be triggered anytime in the network and can quickly
    destroy or damage the device. The IoT will be part of daily lives in the upcoming
    generation for people. Extraordinary steps or procedures need to be taken by the
    device manufacturers or advisers or third party sources to ensure user information
    privacy. In this, the security challenges of overall IoT systems are explored,
    focusing on vulnerabilities of RFID authentication protocols.


