    # 12.1 INTRODUCTION


    The patch antenna with a photonic crystal (PhC) substrate is designed for various
    wireless technology applications requiring more precise control of photons for
    lossless transmission. Different shapes with various patch antennas [1–12] have
    been designed due to their low cost and compatibility. The main problem is, its
    constraint in the bandwidth, low gain, and minimum efficiency due to propagation
    loss at the surface area. The photonic bandgap (PBG) crystal is mainly preferred
    because of its capability to confine the emission of light to the precise direction;
    subsequently, antennas with photonic crystal substrate are extensively designed.
    When the operational bandwidth of the patch antenna is matched with the PBG, it
    will enhance the efficiency of the antenna radiation pattern, minimize the side
    lobe level, and in turn avoid the coupling problems. The PBG [13] is a structure
    that varies sporadically in its dielectric property. Because of the PBG structure,
    the electromagnetic waves from the antenna surface will uniform without any interference,
    noise, or losses. PhCs can be primed using multiple techniques such as mechanical
    drilling, layer by photolithography, and reactive ion beam etching. The remaining
    techniques are complex and time-consuming processes; for a greater number of layers
    of order 10, the layer required depends on the required bandgap. The process,
    which involves a colloidal self-assembly nanoparticle, is sprayed, coated, or
    electroposited, which makes it simple and inexpensive. The selection of assembly
    method and state of affairs for different dimensions and geometric shapes can
    be realized for the different bandwidth signal. The colloidal color structure
    due to bandgaps in the visible region, are easily tunable, have a flexible structure,
    and are tuned by electrical and magnetic fields. Every layer of a PhC''s atomic
    structure is in a face-centered cubic lattice (FCC) arrangement. The FCC lattice
    has a very large PBG of every spherical crystalline structure due to Brillouin
    zones [14–16]. Figure 12.1 shows the structure of photonic crystal.


    ![](img/f43fc2d88fdf77da6ccf8abfe605d6a7_244_0.png)


    FIGURE 12.1 Structure of photonic crystal'
