    # 15.4.1 Four Terminal Ballistic Rectifier (FTBR)


    In particular, an FTBR proposed by Song et al. in 1998, as shown in the inset
    of Figure 15.6, works easily with different principle as the conventionally used
    diodes [101]. The device was first demonstrated on a GaAs-AlGaAs-GaAs based heterostructure
    exhibiting the nonlinear behavior by an artificial scatterer (antidot) at the
    center of the geometry. The FTBR characteristics can be explained using the extended
    Landauer–Büttiker approach in the nonlinear regime of electron transport [105].
    The mathematical models have been derived to correlate the theoretical and experimental
    studies [105]. The applied voltage increases the charge carrier''s velocity in
    the direction of input terminals without changing in output terminals. As a result,
    electrons trying to cross the junction are deflected by the central antidot toward
    the junction. The small junction ejection angle accelerates the electrons and
    collimates them at the output terminal as de-colimate with the large ejection
    angle. This process can change the transmission probability of electrons from
    one terminal to the other and is responsible for nonlinear rectified response,
    as demonstrated in Figure 15.6 [101], [105]. The FTBR can be easily fabricated
    using single-step electron lithography and/or dry etching process. The ballistic
    rectifier does not have any junction, intrinsic resistance, and potential barrier
    compared to a semiconductor diode based on PN or a Schottky junction [101].


    The ballistic rectifier starts from a non-zero input current or voltage irrespective
    to the direction of input signal [101], [107]. Some asymmetry may occur in the
    rectified outcome due to the presence of fabrication deects. The rectifier demonstrates
    the increase in output at 4.2 K up to 77 K due to the increase in the mean free
    path and mobility of charge carriers at a lower temperature. The device is planar
    in nature, it offers less capacitance, which operates at higher frequencies. The
    devices have been demonstrated to confirm output response up to 2 GHz frequency
    without any decrease of rectification efficiency [101].


    The FTBR has been demonstrated to work at low input signal of the order of 0.5
    mV at 4.2 K up to the frequency of 10 GHz to verify the zero threshold property
    of the device. The rectification efficiency was found to be independent of temperature
    and never after the ballistic rectifier. The rectification efficiency was reported
    to be around 1% at 1 GHz input AC signal. To improve the rectification efficiency,
    the geometry of the rectifier can be optimized with the top gate electrode to
    tune the Fermi levels in the channel region enabling, the ballistic transport
    of electrons [107].


    The InGaAs/InP-based quantum structure has been used to design the functional
    nanometer rectifier, which was based on the similar working principle of the ballistic
    rectifiers [88], [122].'
