    # 14.5 CHARACTERISTICS PARAMETERS OF THE PHOTODECTORS


    To compare and quantify the photodetector performance, a set of fundamental characteristic
    parameters or figures-of-merit need to be considered. This section briefly explains
    the characteristics parameters of photodetectors.


    # 14.5.1 Electrical Parameters


    # 14.5.1.1 Current Density and Resistance Area Product


