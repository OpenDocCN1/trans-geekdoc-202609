  md: '# 9.2 DESIGN OF SOA–MZI-BASED COMMUNICATION LINK


    The block diagram of the proposed system is given in Figure 9.1. It consists of
    a transmitter, all-optical XOR gate, and receiver. An XOR operation is achieved
    with the XPM technique [28]. Choice of operating wavelength and source defines
    the wavelength of pump and the probe signal at 10 Gbps is 1552.52 nm and 1558
    nm, respectively. Two data signals are generated by a pseudorandom generator,
    and 80 ps delay is used to generate other data input. Mach–Zehnder modulator is
    used to modulate the data and carrier signals. Modulated output is transmitted
    through an XOR gate to generate encrypted output. Message security is enhanced
    with encryption, which uses right key in both encryption and decryption process.
    In encryption, XOR logic is widely used because of its advantages such as computational
    speed, in particular, hardware feasibility, and commutative and associative property.
    An all-optical XOR gate is the basic block of the encryption process in the proposed
    system, and it is used for secure data transmission in support of data hiding
    when no particular security is required. To achieve all-optical XOR operations,
    SOA-MZI configuration is used by varying the carrier intensity of the pump signal.
    Optimized phase shift of π occurs when the lower probe signal and high frequency
    pulse signal travels along the upper and lower arms of the SOA-MZI configuration,
    which in turn leads to XOR operation.


    The Boolean of XOR logic gives 1 at the output when nonuniform input data combines
    at SOA (combination of A=0, B=1, and A=1, B=0). On the other hand, when both inputs
    are the same, (combination of A=1, B=1, and A=0, B=0), logic output turns into
    0; 1 logic is represented by the presence of optical pulses, and 0 logic is represented
    by an absence of optical pulse at the receiver output. SOA parameters values used
    to propose robust XOR gate are given in Table 9.1.


