  md: '# 38 Nanoelectronic Devices for Security


    From boundary conditions, that is, $U = E_G/2$ when $x=0$, which is accompanied
    by the consistent electric field, the coefficient factor $c$ is determined. The
    definitive expression for potential barrier is as:


    ```

    $$(E_X-U) = -2\left| \frac{E_G}{2}^2 - (q\varepsilon x)^2}{E_G} \right| \quad
    (2.5)$

    ```


    To consider tunneling in 3D semiconductors, the entire momentum of the incident
    electron is to be considered, which includes the momentum in the tunneling path
    as well as perpendicular to the tunneling direction. The energy related to the
    transversal momentum is compensated by adding the term $E_T$ in equation 2.5 [14].


    ```

    $$(E_X-U) = -2\left| \frac{E_G}{2}^2 - (q\varepsilon x)^2}{E_G} \right| + E_T
    \quad (2.6)$

    ```


    Therefore, the tunneling probability is expressed as:


    ```

    $$(T(E_X, E_T) \approx \exp-2\int_{x_1}^{x_2} \sqrt{\frac{2m^*}{h^2}\left(\frac{E_G}{2}^2
    - (q\varepsilon x)^2}{E_G} + E_T\right)} dx \quad (2.7)$

    ```


    It should be mentioned that the integral limit changes from $x_1$ and $x_2$ to
    $x_1''$ and $x_2''$ with the addition of $E_T$, as the transverse momentum causes
    an extra damping of the wave function and thereby alters the conventional tunneling
    positions, which results in an enhanced effective tunnel barrier width, that is,
    $x_1''$ and $x_2''$. The new tunneling positions could be calculated using:


    ```

    $$2\left( \frac{E_G}{2}^2 - (q\varepsilon x)^2}{E_G} \right) + E_T = 0 \quad (2.8)$

    ```


    ```

    $$$x_1'',2 = \pm\left(\frac{E_G}{2}^2}{q\varepsilon^2} + \frac{E_G E_T}{q\varepsilon^2}\right)^{1/2}
    \quad (2.9)$

    ```


    To calculate the integration in 2.7, the following coordinate transformation is
    carried out [19]:


    ```

    $$$y = \frac{q\varepsilon}{\left(\frac{E_G}{2}^2 + \left(\frac{E_G E_T}{2}\right)\right)^{1/2}}x
    \quad (2.10)$

    ```'
