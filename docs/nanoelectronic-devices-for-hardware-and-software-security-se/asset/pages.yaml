- pgno: 214
  md: '# Nanoelectronic Devices for Security


    of MOSFET is not scalable by 60 mV/dec at 300K temperature [3]. To overcome these
    barriers, researchers have proposed a device that operates on the band-to-band
    tunneling (BTBT) principle, which is popularly identified as a TFET (TFET) [4–5].
    It is promising from a low power perspective due to thermal SS (≤60 mV/dec) as
    well as low value of leakage current [6]. However, one major limitation of it
    is the lower value of the ON current. The performance of TFET is further enhanced
    by various techniques like gate engineering, structural engineering, dielectric
    engineering, and many. The various architectures proposed are double gate (DG),
    single gate (TG), dual material gate (DMG), circular gate (CG), heterojunction,
    gate-all-around (GAA), dielectric gate, and undergate TFETs [7–14]. In terms of
    channel engineering, the materials used as channel material to improve the performance
    of TFET [15–16]. Researchers have proposed a hetero-heterate dielectric TFET (HG-TFET),
    and this device has improved SS and ON current compared to TFETs with SiO₂ as
    a gate dielectric [17]. Mitra have included a back gate in HG-TFET, and the effectiveness
    of back gate electronics characteristics is highlighted [18].


    In this paper, we consider three different gate dielectric materials (Al₂...).
    The effects of these dielectric materials on drain current characteristics, switching
    performance (ION/IOff), and VT are highlighted in TFET. We have reported the horizontal
    field and impact ionization rate Al₂O₃, Hf₂, and La₂O₃ as gate dielectric material
    the source region in HG-TFET. Further, we have investigated the DG and the hot
    carrier effect, taking drain bias as parameter in HG-TFET. Finally, we have shown
    this analysis considering L as a parameter in HG-TFET.


    # 10.2 LITERATURE SURVEY


    The first p–i–n structure, which is popularly known as TFET, was proposed in 1978
    at Brown University, and the effectiveness of TFET for spectroscopy was advised
    [19]. Banerjee el have reported a TFET structure considering p-type channel in
    i-region after the gate [20], and they have considered gate-source overlap in
    this structure, which introduced a line tunneling. The performance of line tunneling
    improves the SS and switching behavior of TFET. Reddick from Cambridge reported
    experimentally that TFET resolves the issue of the down-scaling dimension of MOSFET
    as well as punch-through [21].


    Zhang el [6] investigated that SS of TFETs can be scaled down to less than 60
    mV/ dec., and thus S. H. Kim fabricated a heterojunction TFET with Ge source having
    a switching ratio in the order of 10³, and device Sandow el investigated the behavior
    of an ultra-thin SOI TFET for the variation in channel length, thickness of gate
    oxide, and specification of doping in source/drain [22]. They have concluded that
    electrical parameters are strong function thickness and doping concentration,
    with less dependence on gate length. The BTBT rate in TFET is enhanced by increasing
    the number of gate-like DG, TG, TFETs [7], which leads to enhanced ON current.
    Saurabh and Kumar have reported the electrical parameters of DMG TFET, where lower
    and higher function material is placed near the source and drain regions, [9].
    The DMG TFET boosts drain current, short channel, RF and analog performance compared
    to conventional TFET. ON current of TFET is improved by introducing line tunneling
    along horizontal tunneling [23–24].


    A compact analytical model for SOI TFET is reported in [25]. The parameters as
    threshold voltage, channel length, gate capacitance, drain current, SS transconductance,
    and output conductance have been modeled analytically. For model surface potential
    and transfer characteristic in a particular gate (CG)-TFET is reported, and this
    model is validated by the TCAD simulator [14]. Likewise, the vari- electrical
    parameters for triple material GAA TFET is modeled analytically, and it shows
    agreement'
