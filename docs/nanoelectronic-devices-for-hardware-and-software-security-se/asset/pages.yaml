    # 14.4 TYPES OF SEMICONDUCTOR PHOTODECTORS


    A semiconductor photodetector is a device that absorbs the incident, that is,
    incoming photons, and converts it into electrical signals. This conversion mechanism
    is outlined in previous sections. To understand the development of photodetectors,
    it is essential to elaborate upon the major types of semiconductor photodetectors.


    # 14.4.1 The Semiconductor p–n Single-Junction and p–i–n Dual-Junction Photodetectors


    The semiconductor p–n junction and p–i–n junction are the semiconductor photodetectors
    without an internal gain mechanism, where a single electron-biased hole-pair (EHP)
    is generated per absorbed photon.


    Figure 14.5a shows a reverse-biased highly p-doped (p*) and lightly n-doped (n*)
    p*-n-single-junction photodetector with diffusion and depletion regions. The depletion
    layer is created by negatively charged ions in the p-type material and positively
    charged donor atoms in the n-type material when carriers are swept to their majority
    under the built-in $E_{field}$. Therefore the width of depletion region depends
    upon the doping levels for reverse bias voltage (i.e., the lower the doping, the
    wider depletion region [9]). As illustrated by the absorption region in Figure
    14.5a, photons are absorbed in both the diffusion and depletion regions. The position
    and width of absorption region per photodetector. During the weak absorption of
    photons and on fabricated material for the photodetector, the absorption region
    can be fully extended across the device. Thus, carriers are produced in both the
