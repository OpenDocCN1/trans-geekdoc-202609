    # 2.4 Germanium Source with Delta Doped Layer Vertical TFET


    The germanium source with delta doped vertical TFET structure (Ge Source DD Vert
    TFET) [50] is portrayed in Figure 2.11a. Unlike the TFETs discussed earlier, the
    electron BTBT from the channel region takes place only vertically (line tunneling).
    This means that the path of the electron BTBT is directly aligned with the path
    gate electric field. This is possible since the source region (including the channel
    region) is overlapped by the metal gate. Hence, stronger electric fields from
    the gate are encountered by the electrons, allowing more tunneling, which enhances
    the device performance along with its ON current [43]. The energy band profile
    in Figure 2.11b depicts the electron tunneling and the cut-line where the measurement
    is denoted by A–B in Figure 2.11a. The gate length is measured at 30 nm, with
    a work function of 4.18 eV. The thickness of the germanium source, silicon channel,
    and gate insulator (HfO2}$) are 12, 3, and 2 nm, respectively.


