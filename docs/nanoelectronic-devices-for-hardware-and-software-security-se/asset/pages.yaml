  md: '# 4 Silicene and Germanane Nanoribrows 87


    carrier mobility, and due to strong SOC, the substantial bottleneck of zero bandgap
    is greatly reduced compared to graphene [45–49]. Similar to graphene, in order
    to further modulate the bandgap, silicene and germanane can be further stripped
    off into 1D nanoribrows with definite edge states. Unlike two, nanoribrows (NR)
    are confined in two directions and are allowed to grow only along a third direction.
    Due to such confinement, these materials exhibit different and unique electronic
    properties compared to 2D form. Based on the edge states, the nomenclature follows
    armchair silicene/germanane nanoribrow (ASiNR/AGenR) and zigzag silicene/germanane
    nanoribrow (ZSiNR/ZGenR), as shown in Figure 4.1.


    Similar to graphene nanoribrows, [50], these structures also have unique width-dependent
    electronic and magnetic properties based on the direction of cutting, the 2D sheet
    armchair or the zigzag edge states can be produced. There is a 30° cutting difference
    between ASiNR/AGenR and ZSiNR/ZGenR, respectively. In armchair, the edges are
    attached with only the two nearest neighboring atoms. Therefore, an additional
    unsaturated chemical bond (the dangling bond) is associated with each edge of
    the Si/Ge atom at both edges. The presence of these bonds at the ribbon edges
    provides a convenient way to alter the electronic properties and the stability
    of NRs through termination or the chemical edge modification [45, 51–53]. Further,
    like GNRs in the recent past, research pertaining to substitution within this
    SiNR/GeNRs has led to exhibition of some exceptional properties [54–57]. Further,
    these materials (specifically the ones having zero bandgaps) can also have prospective
    applications such as nanoscale interconnects [58–60]. Spintronics is another field
    in which precise utilization of the spin degree of freedom of an electron, rather
    than its electronic charge, serves as the fundamental quality for the flow of
    information [61] and being looked at as a promising low power alternative. Silicene
    and germanane possess strong SOC and can serve as promising candidates for these
    applications, too [62, 63]. Furthermore, applications such as contact engineering
    and designing


