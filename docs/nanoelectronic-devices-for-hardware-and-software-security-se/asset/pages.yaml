    # 11.4.3 Octal to Binary (8 to 3) Encoder


    An octal to binary encoder accepts eight input lines and produces 3-bit output
    based on the triggered input. Its input lines range from D_0 to D_7, and the output
    is a 3-bit binary code (Y_2 Y_1 Y_0). The circuit diagram and the truth table
