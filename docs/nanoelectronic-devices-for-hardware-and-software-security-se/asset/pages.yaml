    #  5.4 CONDUCTIVE BRIDGE MEMRISTOR


    The conductive bridge memristor is composed of a metal insulator-metal sandwich
    which has a glass-like material that allows metal atoms to move under it under
    an electric field, thus establishing a conductive path.

    This is a nonvolatile and reversible effect, which means that it does not dissipate
    even when power is turned off, and thus the device can retain its current state
    for extended periods of time. When the electric field is reversed, the conductive
    path also gets reversed.'
