    # # 11.11 CONCLUSION


    Two inferences can be taken from those simulations. First, using the aforementioned
    universal gate logic, the number of cells and area needed to construct different
    encoder circuits is drastically reduced without compromising the effectiveness.
    The circuits therefore get better compared with other designs, as seen in Tables
    11.7 and 11.8. The potential energy of the encoder circuits was measured using
    standard methods for various input combinations and is rounded off to their nearest
    possible integer values. The values are described in section 11.9 using bar-graphs.
    As the input state that has the least energy has already been identified as better
    suited for QCA operation, the most stable input state can be found from the graphs.
    From Figure 11.14 for 4 to 2 encoder, the stable state occurs when $D_2=1$. For
    the priority encoder circuit from Figure 11.13, the states with $D_1$ and all
    higher bits are considered to be 0 as the most stable state. For the octal to
    binary encoder circuit is shown in Figure 11.16, $D_2=1$ is the most stable state.
    This is concluded from Figure 11.17 and Figure 11.18, the comparison of energy
    dissipation between the two structure of the priority encoder structure and 4
    to 2 priority encoder structure with the available previous structure.


