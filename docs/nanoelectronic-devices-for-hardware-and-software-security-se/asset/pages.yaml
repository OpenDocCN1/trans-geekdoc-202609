    # 9.3 IMPACT OF VARIOUS MODULATION SCHEMES OVER PROPOSED SYSTEM


    Contemporary and all-optical devices have the ability to handle data rates up
    to 10 Gbps, but high-capacity extended-distance transmission links require an
    improved bandwidth to tackle the requirement. Optical researchers are interested
    in investigating various types of modulation to support higher data rate [30–31].
    Different modulation techniques have encountered likelihoods to resolve nonlinear
    effect. Modulation formats are optical in optical communication in reducing errors
    due to nonlinearities and cross-talks [32]. In any modulation, the baseline signal
    is superimposed on the carrier wave, and binary ones and zeros are transmitted
    with corresponding changes in amplitude. Amplitude carrier amplitude is amplified
    between two discrete values relative to the input data. In frequency shift keying
    (PSK), transmission of binary data is accomplished by changing its frequency.
    These two methods work with power efficiency. The next most-power-efficient modulation
    types are phase shift keying (PSK); the phase of the carrier is changed between
    discrete values relative to the input data. Encoding information is based on the
    phase of the signal. The phase of the carrier is used to change the phase of the
    baseband signal. Bandwidth utilization is the highest limiting factor in the modulation
    techniques such as ASK, FSK, and PSK and becomes less efficient to handle higher
    data rates in optical communication systems. The multitude of modulation formats
    such as QPSK, DQPSK, and DPSK ensured enhanced spectral efficiency. In QPSK, bit
    rate is twice that of symbol rate, and it carries two continuous bits in one symbol
    by synchronization. This QPSK allows for having notably reduced dispersion. However,
    the complexity of the system increases proportionately with the increased SNR
    requirement. Additionally, DPSK provides a greater than 1-bps Hz in spectral efficiency
    and also ensures robust transmission. In DQPSK, to encode symbol information,
    symbol symbol phase changes are used instead of absolute phase. In DQPSK, as in
    QPSK, one symbol encompasses two bits, and thus the bit is twice the symbol rate.
    The reduced system intric, PMD tolerance, increased chromatic dispersion, and
    spectral efficiency of DQPSK facilitate ultra-long'
