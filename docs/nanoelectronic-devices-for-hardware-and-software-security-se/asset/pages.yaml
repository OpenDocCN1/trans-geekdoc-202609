    # 5.2 MEMRISTOR MODEL BY HP LABS


    In 2008, a team of scientists from Hewlett Packard (HP) Laboratories, led by R.S.
    Williams, stated that they have fabricated a solid state memristor whose $I-V$
    characteristics resemble the results obtained by Chua''s memristor [2]. The device
    fabricated by HP is formed by a 50 nm $TiO_2$ film sandwiched between two electrodes
    of 5 nm thickness each. The materials used for electrodes are titanium and platinum.
    In the beginning, one of the layers of the $TiO_2$ has slightly depleted oxygen
    atoms, creating oxygen vacancies, which act as the charge carriers. The resistance
    of the depleted layer is lower than that of the nondepleted layer. The oxygen
    vacancies drift under an electric field, which results in the change of boundary
    between the high and low resistance layers. For a memristor of total length $D$,
    the doped region is shown as the width $w$, as shown in Figure 5.3. Hence, the
    film resistance totally depends on the amount of charge passing through it. The
    drift of the charge can be reversed by changing direction of the current. At nanoscale,
    the HP device shows fast ion conduction and hence is considered a nanionic device.'
