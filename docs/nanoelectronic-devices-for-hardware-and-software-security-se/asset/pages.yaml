  md: '# 2.1 INTRODUCTION


    Since the first principle of the field-effect transistor (FET) was demonstrated
    in 1960 and the implementation of the complementary metal-oxide-semiconductor
    (CMOS) was realized in 1963, a tremendous progress in the field of CMOS technology
    has been perceived [1–3]. Following the well-known Moore’s law states that the
    number of transistors being used in the integrated circuits (ICs) should be doubled
    every 18 months by scaling the dimensions of transistors [4], perhaps the biggest
    test confronting the CMOS technology is way to produce the up-and-coming generation
    of superior, high efficiency, low powered devices while preserving its performance
    and circuit speed regardless of the cost per function, as well as its power consumption.
    It is noteworthy that regardless of many daunting technical difficulties, the
    tendency of miniaturization of the size of semiconductor devices and the subsequent
    exponential development and growth of the semiconductor industries have unprecedented
    undoubtedly for over many decades. The challenges accompanying the upcoming miniaturization
    of transistors, which at first appeared insurmountable, were overcome using ingenious
    methods before the


    However, as transistors are being continuously downscaled to the sub-50 nm regime
    or lower, they face a genuine threat as an increase in the incapacity of transistors
    to switch from the OFF-state to the ON-state without improving in power dissipation,
    and they possess a high subthreshold swing (SS) [5], [6]. Here, the SS is described
    as the amount of voltage needed to lower the current by an order of magnitude
    and is limited to 2 KT/q, which is 60 mV per decade at room temperature for a
    metal-oxide-semiconductor field effect transistor (MOSFET). The physics relating
    to the main operating mechanism of the conventional CMOS transistor impose certain
    limitations that preclude further reduction in the scaling down of the transistors
    while maintaining a constant power supply voltage fails to improve the energy
    efficiencies in ICs that have been acquired by reducing the power supply voltage
    [8]. This requires investigating and developing transistors that are dependent
    on new working principles, better architectural design, and even maybe innovative
    non-silicon-based materials that could surround the shortcomings of the traditional
    transistors [6]. In this regard, tunnel field effect transistors (TFETs), which
    work based on the principle of quantum mechanical tunneling, have been shown to
    have a remarkable switching characteristic that goes beyond the theoretical abilities
    of the traditional transistors, such as the MOSFET, whose operating mechanism
    is due to the thermionic emission of carriers over a potential barrier [9–11].
    TFETs can be implemented in ICs with low power supply voltage, which results in
    an exceptionally efficient circuit; this makes TFETs interesting for researchers
    and the semiconductor industries and has prompted extensive study in recent times
    in both theoretical and experimental fields [12], [13].


    # 2.2 BASIC STRUCTURE AND PRINCIPLE OF OPERATION OF TFETs


    Simply stated, the TFET is a gated biased reversed p–i–n device working on the
    principle based on the quantum band-to-band tunneling (BTBT) of carriers from
    the valence band ($E_v$) of the source region to the conduction band ($E_c$) of
    the channel region through the forbidden energy bandgap. The main distinctive
    feature of a TFET is the type of dopants in the source region and drain region,
    which is different in the regions, where the source is doped with p+ and the drain
    with n+ for'
