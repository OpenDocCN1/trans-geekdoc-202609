    # 3.1.5 TFET (A Low Power Device)


    A TFET works on the breakdown mechanism for reverse biased p–i–n junction semiconductor
    devices. This mechanism effectively works under a high electric field that induces
    quantum mechanical interband tunneling phenomena (IBT) at the tunnel junction,
    resulting in large current at a small voltage level [27–29], TFETs have been proposed
    as a suitable candidate for the sharp transition between OFF-and ON-states, have
    obtained the lowest OFF-state CMOS performance, and potentially will scale the
    supply voltage in a technology compatible with the existing CMOS technology platforms
    [30–31].


    # 3.1.5.1 TFET Structure and Operation


    TFET is a gated p-i structure that is based upon the working principle of quantum
    mechanical bandottunneling (BTBT). This is made up of a solid-state semiconductor
    that is operated in a reverse bias gate control mechanism. The operating principle
    is clearly understood by device schematic and energy band diagram, as shown in
    Figure 3.6. In the reverse bias, the electron will flow according to the Zener
    tunneling [32] from the source valence band to the channel conduction band. In
    the OFF-state condition, the channel region is fully depleted due to high p+ doping
    and n+ drain doping. The depletion regions get reduced by applying the gate voltage
    biasing. This will turn ON the transistor mode due to the increase in the electric
    field. The minority charge carriers transmit from the source to channel and


