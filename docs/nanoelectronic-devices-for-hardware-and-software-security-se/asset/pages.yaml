    As mentioned earlier, the employment of a delta doped layer within the germanium
    source region is further investigated. The analysis is conducted by investigating
    two forms of doping in the source region, being the one uniformly doped germanium
    source while the other is the aforementioned germanium source with a delta doped
    layer. It is seen from the transfer characteristic in Figure 2.13a that the delta
    layer contributes to an additional decrement in the OFF-state leakage current
    by an order of magnitude. This can be explained with the help of Figure 2.13c,
    which shows that the electron band-to-band generation is much lower, by two orders
    of magnitude, when a delta doped layer is inserted. This means that the electrons
    are confined within the delta doped layer, which then improved the electrostatic
    control [52]. The optimization of the doping concentration in the delta doped
    layer is also considered where $5 \times 10^{16}/text{cm}^2$ is taken to be the
    optimized value in Figure 2.13b. The subthreshold swing (SS) of the Ge Source
    DD Vert TFET is determined using equation (2.29):


    ```

    $SS = \frac{V_{OFF}}{log(I_{Th}) - log(I_{OFF})}$$ (2.29)

    ```


    Where $V_{Th}$ and $V_{OFF}$ denote the threshold value and the gate source voltage
    at OFF current ($I_{OFF}$), respectively. The threshold current ($I_{Th}$) is
    taken at the drain current value of $10^{-7}$ A. When the doping concentration
    is kept well, the built-in electric fields within the source and channel tunnel
    junction would


