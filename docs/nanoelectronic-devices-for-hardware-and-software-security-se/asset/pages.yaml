    # 11.5 POTENTIAL ENERGY IN QCA CELLS


    In quantum-dot cellular automata, the cells are connected with one another. In
    each cell, there exist two electrons separated diagonally by a fixed distance.
    This configuration is made to avoid coulomb repulsion force. For practical calculation,
    it is assumed that dimensions of all cells are the same.


    From QCA software, the width and height of QCA cell is 18 nm, the dot diameter
    is 5 nm, and inter-cell spacing is 2 nm. For simplicity of calculation, it is
    assumed that only neighboring cells have an influence in determining the potential
    energy [8]. Therefore, in this way, the total potential energy of the design can
    be found for different input combinations [9, 10]. It is well known for stability,
    the electrons should be aligned in such a way so to reduce the potential energy
    as much as possible [11, 12]. The input state with least potential energy is the
    most stable and suitable for QCA operation [6].'
