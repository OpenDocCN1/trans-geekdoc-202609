  md: 'To further enhance security, a 2-layer security protocol can be implemented
    by NanoPPUFs [13], like key exchange, authentication, time stamping, and bet commitment.
    Memristor-based nanoelectronic devices are best to implement NanoPPUFs. A NanoPPUF
    uses memristor properties like bidirectionality, process variations, and the complex
    simulation behavior of memristors and its crossbar models and polyaminoes, which
    are geometrical structures formed by joining more than one independent blocks.

