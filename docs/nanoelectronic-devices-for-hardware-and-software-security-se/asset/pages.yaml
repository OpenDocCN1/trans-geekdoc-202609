    # 3.1.4 Gate Dielectric Methods


    # 3.1.4.1 High-k Dielectric-Material Gate Dielectric


    The high-k dielectric constant material is used to significantly reduce the leakage
    current and gate tunneling with low gate oxide thickness. In most of the semiconductor
    fabrication industry, a substitute to the SiO2 will be replaced by a material
    with a high-k dielectric constant like HfO₂, with the value of k=21. The combination
    of low dielectric k with high dielectric k stacking is a famous method that easily
    scales the device without actually influencing the device performance. The equivalent
    oxide thickness (EOT) can be calculated by using equation 3.1. This will calculate
    the actual thickness of oxide for low dielectric (t_{ot1}) with high-k dielectric
    (t_{ot2}) [24].


    ```

    EOT = t_{ot1} + \frac{\epsilon_{r1}}{\epsilon_{r2}}t_{ot2} (3.1)

    ```


    Where $\epsilon_{r1}$ is absolute permittivity for SiO2 and $\epsilon_{r2}$ is
    absolute permittivity for another high-k-dielectric constant.


    # 3.1.4.2 Metal Gate


    High-k dielectric stacking is an efficient method of reducing the leakage current;
    loss of mobility takes place to a large degree with the use of a high-k dielectric.
