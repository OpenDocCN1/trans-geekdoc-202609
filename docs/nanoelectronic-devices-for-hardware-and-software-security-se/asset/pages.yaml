    The study on ballistic rectifier has been further extended by considering the
    tunable rectification using gate control Fermi [93], [94]. The rectification output
    reversed in the positive direction with the increase of gate voltage. The rectification
    was quasi-classical for wide channel region rectifier as compared to quantum rectification
    for a narrow channel region rectifier. The temperature-dependent reversal of rectification
    characteristics has been explained in [95], considering the effect of variation
    in the channel conductance. The electrons were accumulated in the narrow or wide-centrosymmetric
    regions, which fluctuates the conductance of the device.


    Similarly, the rectification effects have been studied for non-centymmetric ballistic
    rectifier for branch angles (30°, 45°, 60°, and 90°) by input and output terminals.
    The decrease in angle increases the rectifier output while at the upper terminal
    is independent of change in angle. In addition, variation in the gate voltage
    made the opposite effect on overall rectification output, and output terminal
    voltage], [104].


    The rectification in InAs/GaSb heterructure-based FTBR has been studied [96],
    [102], as shown in Figure 15.7. The magneto-resistance property of ballistic rectifier
    demonstrated the Shubnikov-Hass oscillations at magnetic field above ±IT [96].
    In addition, the bending resistance was Shubharized, which represents the electron
    focusing peak at the positive or negative side of the weak magnetic field and
    again depends on input configuration [102]. The proposed heterructure can be used
    to extend the research at higher temperatures [96].


    The electro-thermal phenomenon of the ballistic rectifier has been studied by
    Matthews et al. [97]. Instead of applying a voltage between input terminals, thermal
    effects have been used to get the rectifier output. The InP/GaInAs heterructure
    was used to fabricate such a device. A temperature difference has been applied
    across the input terminals, which generated the thermal voltage at the output
    terminals. An output reversal similar to the previous discussion has also been
    observed in the thermal study of the ballistic rectifier. This work suggests the
    possibility of designing the electronic rectifiers and thermoelectric energy converters
    [97]. Furthermore, the electro-thermal phenomenon has been studied in cross-junction
    in a QPC was used in the output terminal to create a potential barrier [99].


    The device performance is typically affected by the noise. The low flicker noise
    of the rectifier has been studied and formulated with the channel and antidot
    dimensions. The zero intrinsic threshold property of the rectifier eliminates
    the low frequency flicker noise. In addition, the speed of the device has been
    checked using the noise equivalent power (NEP) and responsivity characteristic
    of the rectifier at different frequencies [98].


