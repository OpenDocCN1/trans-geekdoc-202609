    with a higher level of security. The best advantage of the SiW FETs is IP protection,
    logic design encryption, and other security applications.


    # 16.91 Implementation of Camouflaging of Gates Using SiW FET


    CMOS camouflaging methods of gates can rarely be implemented because it would
    increase the power consumption along with an area for higher-level protection.
    To implement XOR, NAND, and NOR in a CMOS camouflaging method requires a minimum
    of 12 transistors with a huge area of metal connections [26], as shown in Figure
    16.11. The PMOS and NMOS have fixed polarities, which require separate transistors
    in the implementation of CMOS camouflaging gates. The silicon nanowire FETs have
    polarity controllable, which helps implement camouflaging of gates without using
    additional FETs. Four silicon nanowire FETs are used to design a NAND or an XOR
    gate [27]. The four silicon nanowire FETs perform five more functions in addition
    to NAND and XOR operation by interconnecting pins with various signals. The polarity
    controllable feature of silicon nanowire FETs plays a vital role in designing
    a camouflaging layout in which different gates are shared in a similar structure.


    In this chapter, we presented the IP prevention security systems based on the
    emerging technologies graphene SymFET and SiW FET and how it can help to prevent
    IP protocol and protect circuits. The proposed protection schemes are comparatively
    higher protection than the CMOS logic circuits. The comparative challenges and
    opportunities are compared with the CMOS logic and mentioned in


