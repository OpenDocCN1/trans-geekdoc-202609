  md: '# 3 Heterojunction Tunnel Field-Effect Transistor 81


    # 3.1.11 Conclusion


    This chapter deals with the basic concept and evaluation of the TFET as the conventional
    MOSFET for low power applications. A new p–i–n junction device is proposed and
    analyzed using TCAD simulation. The vertical tunnel FET features a source channel
    distribution that will enhance the scalability of the simulated device. Further,
    both p–i–n junction and n–i–p junction devices have been built using mixed-mode
    technique to form an inverter circuit. A transfer characteristic for the gate
    oxide materials of SiO₂ (k= 3.9), Si₃N₄ (k= 7.0) and HfO₂ (k= 21) have been compared,
    out of which HfO₂ comes with the best output for the transition from 0 to 1. Further,
    the proposed devices have been analyzed for the hardware security system using
    low power circuit device using current mode.


