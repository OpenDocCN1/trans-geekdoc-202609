  md: '# 13.5 SILICON MICROMACHINING-BASED PASSIVE COMPONENTS FOR TRANSCEIVER MODULES
    AT THZ FREQUENCY


    The term ''micromachining'' was coined in the 1980s. It describes the process
    of selective removal of substrate material, either by means of wet chemicals or
    by the dry etching method. Historically, this micromachining method was applied
    on silicon substrate to realize various physical or inertial sensors (pressure
    sensors, gyroscopes, accelerometers, etc.). Currently, this field is not limited
    to the world of sensors. Rather, it is expanding its domain to RF, microwave,
    or even THz-frequency range. The feature of precision lithography with batch facility
    makes silicon micromachining a unique process for high frequency devices. Moreover,
    the repeatability of the process is quite promising in comparison to existing
    methods in the market. Initially, waveguide structures are developed for THZ passive
    devices, which act as a base-line architecture for all passive building blocks.


    In this chapter, we discuss about two specific waveguide structures, namely WR-2.2
    and WR-3.4. The nomenclatures of the waveguide are defined by the EIA (Electronic
    Industries Alliance). As per the EIA-standard, WR-3.4 has a cross-sectional dimension
    of $864 \times 432$ $\mu m^2$, which is suitable for 220–330 GHz applications,
    whereas WR-2.2 has a standard of $560 \times 280$ $\mu m^2$, which is best for
    the 325 to 550 GHz band. This work comprises design and simulation of several
    passive components based upon rectangular waveguide structures.


    +   Here are:

    a. Power divider (1:2 and 1:4);

    b. Directional coupler (coupling coefficients of 7, 10 and 13 dB).

    c. Multi-hole branch-line coupler.

    d. Antenna.


