    # 1.9 JUNCTIONLESS TFET


    As explained earlier, the presence of junctions in nanoscale TFETs are problematic.
    Their fabrication and consequences are a cause of concern. The idea of junctionless
    TFETs was proposed by Ghosh et al. in 2014 [50]. The junctionless TFET can be
    a very good alternative to continue the scaling trend in TFET. The working of
    JLTFET is explained in the next section.


    # 1.9.1 Working


    The structure of JLTFET is shown in Figure 1.20a. In N-JLTFET, the body is composed
    of highly doped (10¹⁰ cm⁻³) n-type material. The p-type source region is realized
    by an unbiased auxiliary gate of high work function, it is 5.93 eV, shown in Figure
    1.20a. Due to the high work function of the auxiliary gate, the accumulation of
    holes takes under the auxiliary gate. The intrinsic channel region is generated
    by a gate (L_g = 20 nm) of work function 4.3 ev.


    The gate and auxiliary gate are separated by a L_s = 5 nm. The drain and source
    contacts are on the sides. The carrier concentration in OFF-state is shown in
    Figure 1.20b, which shows the required barrier in p–i–n structure of TFET. When
    a positive voltage is applied, the carrier concentration in the channel is changed
    (Figure 1.20b). On the application of positive gate voltage, the barrier amid
    the channel and source region gets lowered, as shown in Figure 1.20c. The tunneling
    of electrons takes place between the valence band and the conduction band of the
    channel region. The I_D–V_GS curve of JLTFET for spacer thickness L_s = 5 nm between
    the gate and auxiliary gate is shown in Figure 1.20d. The I_D–V_GS curve of JLTFET
    shows the drawback SS of conventional TFET or TFET with chemical junctions shown
    in Figure 1.20e. Thus, JLTFET can provide the required tunneling phenomenon of
    TFET.'
