    Table 16.3 (14). From the comparison, it is clear that the emerging devices can
    help to guide the future design in the hardware security area.


    # 16.10 CONCLUSION


    In this chapter, the formalism of tunneling effect in the graphene insulator structure
    for the working of symmetric FET has been discussed for the security applications.
    Instead of CMOS transistors, two emerging technologies were discussed, including
    SiNW FETs and graphene SymFETs. The I-V characteristics of the SymFET prove that
    it is very robust for the temperature changes. The resonant peak of the SymFET
    device shows a good potential for the high-speed analog circuit and digital devices.
    From the resonant peak, it indicates that the broadening of a peak can be controlled
    by chemical doping and applying gate bias. The SinW was used to design the p-
    and n-FET for controlling the sensitivity of the charge transport over nanoscale
    metal-semiconductor junctions. It has the unique advantage of not relying on doping.
    The device design by using the emerging technologies instead of CMOS provides
    an extremely efficient and secured circuit that can be accomplished for IP privacy
    prevention.


