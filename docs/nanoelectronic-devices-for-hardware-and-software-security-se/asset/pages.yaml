    # 5.8 APPLICATIONS OF MEMRISTORS IN HARDWARE/SOFTWARE SECURITY


    Metal-oxide memristor devices have the following unique characteristics, depending
    on the material used, that can be used for security applications:


    +   1. Nonvolatile: Memristors are nonvolatile, as even when the power is turned
    OFF, they can retain their memristance value.

    2. Bidirectional: As evident from the theoretical I-V curve, which is symmetrical
    in nature, some of the bipolar memristors show I-V characteristics regardless
    of the polarity of the voltage or the current applied.

    3. Nonlinear: Because of the time-dependent behavior of memristors, their I-V
    characteristics are extremely nonlinear.

    4. Forming: In some cases, for initializing a memristor to the low resistance
    state (LRS), a forming step (V_f) is required, before the memristor acts as a
    linear resistor [10].

    5. Memristance drift: In some metal-oxide memristors, when an input voltage (+V,
    or -V) is applied, there is a change in the memristance due to the movement of
    dopants. This process is called memristance drift [11]. It depends on amplitude,
    polarity, and duration of the applied voltage.

    6. Process variation: The variations in the process can induce changes in the
    concentration of the dopant and the dimensions of the memristor, hence affecting
    its performance.

    7. Radiation hardness: Due to the inherent properties of the material, some memristor-based
    devices exhibit radiation hardness characteristics [11].

    8. Temperature stability: In a TiO₂, the temperature coefficient of resistance
    is very small (-3.82 × 10⁻³/K for TiO₂, so the low resistance state and high resistance
    state are extremely stable. Due to the change in mobility of the dopant atom,
    the switching speed of the memristor can vary with variation in temperature.


    These unique features of memristors can be useful for the following security-based
    nanoelectronic devices.


    # 5.8.1 Nanoelectronic Physical Unclonable Functions (NanoPUFs)


    Physical unclonable functions (PUFs) are a type of hardware-based security primitives.
    The variations in their fabrication process can be used to derive their cryptographic
    ‘keys’. Physical disorder that occur during the fabrication process of the integrated
    circuit (IC) can be used to generate unique outputs (responses) when inputs (challenges)
    are applied. PUFs based on crossbar architectures with integrated memristors can
    be leveraged effectively for hardware-based security applications. This is because
    they have a low-cost and simple fabrication process and are very small and portable
    with CMOS circuit integration. They also exhibit process-induced variations in
    their I–V characteristics due to their memory mechanism and electronic-ionic transport.
    PUFs map a challenge to a response. They have been used in the following application
    areas:


    +   1. Execution of secure software in a processor.

    2. Device authentication.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# 5 Memristors and Their Applications 111


    +   3. Storage encryption.

    4. Trusted configuration of FPGAs.


    The inherent process variations in memristors can be used to create PUFs called
    NanoPUFs [12], which have three main sections:


    +   i. A memristor-based crossbar.

    ii. The challenge (Input) circuit: They enable the application of an input to
    the decoders. A memristor is selected by the challenge circuit through the column
    and row decoders. A particular column is selected by the column decoder and then
    connected to the load resistance ($R_{load}$). A voltage of $V_{dd}$ magnitude
    is applied to a particular row by the row decoder. At the same time, the rest
    of the columns and rows standing float.

    iii. The response circuit: This gathers the response for a challenge from the
    crossbar. The response circuit consists of a current comparator and load resistance
    ($R_{load}$). The comparator compares I_{out}$ (the current which is flowing out
    of the column) with $I_{ref}$ (the reference current). The response bit is 0 when
    $I_{out}$ is less than $I_{ref}$, else the logic is 1.


    ![](img/f43fc2d88fdf77da6ccf8abfe605d6a7_123_0.png)


    FIGURE 5.13 Memristor-based NanoPUF [12].


    Advantages: As memristors are more dense as compared to SRAM, for the same amount
    of area, NanoPUFs based on memristors generate more response bits. They also consume
    less power.


    # 5.8.2 Nanoelectronic Public Unclonable Functions (NanoPUFs)


    While the simulation models of PUFs are hidden from an attacker, the simulation
    models of a PFAF are public. However, if an attacker tries to simulate the PPUF,
    the simulation time would be very large – could even several years – as compared
    to PUF primitive, whose simulation time could be just a few nanoseconds.'
