    in junctionless and dopeless devices. These junctionless or dopeless charge plasma-based
    devices have immense potential to replace chemically doped junction devices at
    lower technology nodes. For subthreshold performance or low-power applications,
    the tunnel field effect transistors based on charge plasma present a very good
    alternative to the conventional or chemically doped TFETs. However, these charge
    plasma-based junctionless transistors or junctionless FET face some major challenges
    that need'
