    # 10.5 CONCLUSIONS


    We have reported the influence of the gate dielectric material near the source
    region in HG-TFET on transfer characteristic, threshold voltage ($V_t$), $I_{ON}/I_{OFF}$
    ratio, $I_{ON}/I_{AMB}$ ratio, and HCE. Furthermore, these parameters for the
    variation in $V_{DS}$ considering $HfO_2$ are also highlighted. We have also reported
    the DC and HCEs for the variation in $L_{h-k}$ in HG-TFET. It is perceived that
    for HG-TFET, the ON current is increased, while OFF current changes insignificantly
    as the dielectric is changed from $SiO_2$ to $La_2O_3$. The HCEs also degraded
    while using a high-k dielectric near the source region. Analysis'
