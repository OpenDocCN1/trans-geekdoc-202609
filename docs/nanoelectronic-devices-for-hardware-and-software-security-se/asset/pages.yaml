    # 14.4.4 Quantum Wells and Dots Photodetector


    The miniaturized physical sizes of nanomaterials provide various nanostructured
    photodetectors such as quantum wells (QWs) and quantum dots (QDs) with unique
    photodetection properties [48–50]. The photodetection efficiency of the photodetector
    can be enhanced by simply changing the corresponding material properties [34].


    The QWs- and QDs-based photodetectors are the alternative solutions to replace
    the Hgₓ,CdTe photodetectors in the IR and TH2 spectral regime with the high-temperature
    operation and high-density chip integration [34]. The quantum wells and dots are
    usually fabricated by inserting a well or dot layer in energy barriers via epitaxial
    molecular beam epitaxy (MBE). The well barriers isolate layers resulting in increased
    material absorption in the active area, reducing tunneling effects, and reduced
    dark current [9]. The quantum efficiency of such nanructure is generally achieved
    through the materials with mismatched valence or conduction band. The scheme of
    the band alignment in QW and QD photodetectors is shown in Figure 14.8. The potential
    barrier at the interface due to the energy band match creates confinement of the
    free carriers in the well (or dot) layer. Upon light, the photoexcited electrons
    from the confined conduction band (well or dot) layer are swept out to the electrodes.
    The intraband absorption in QWs and QDs permits IR photetection beyond the intrinsic
    banding of materials. To further enhance the absorption capacity, multilayers
    of QWs (or QDs) are employed in the active region of the photodetector. The resultant
    photodetector device is denoted as the dots-in-well (DWELL), as shown in Figure
    14.8b [9], [34].


    For the efficient coupling of light to the active region, an optical coupling
    layer (corrugated, gratings layers, etc.) is included in the photodetector device.
    The inclusion of such a layer is important in QWs-based photodetectors, 2D QDs
    do not absorb the incident photons directly from normal incidence. However, no
    such limitation exists for the zero-dimensional (0D) QDs due to their better three-dimensional
    quantum confinements, allowing the QDs based IR photodetectors in device integration
    [34].'
