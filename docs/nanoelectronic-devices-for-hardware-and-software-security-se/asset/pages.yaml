    # 2.6 LATERAL AND VERTICAL TFETs


    Over the past years, researchers have developed novel TFET architectures to improve
    performance [38–41]. As the TFET operating mechanism is based on band-to-band
    tunneling (BTBT), depending on the design of the TFET structure, there are two
    distinct types of tunneling modes that can be employed. The first one is lateral
    tunneling, where, due to the application of a positive bias to the gate, the band
    starts to bend, and the electrons are injected from the source region into the
    gate region, primarily in a direction parallel to the semiconductor/gate dielectric
    interface. Lateral tunneling is sometimes stated as point tunneling [42] which
    is the fundamental BTBT mechanism and operating mode for a typical conventional
    TFET. Even though there is no definition of vertical TFET, the convention adopted
    here is that a device is termed a vertical tunnel FET if the electron BTBT direction
    is predominantly associated with the direction of the electric field of the gate.
    The source region should be overlapped by the gate. As the direction of gate electric
    field and the electron tunneling are in the same direction or alignment,


