    # ### 15.3.6 Ballistic Deflection Transistor (BDT)


    Recently, the ballistic rectifier geometry has been modified by BDT, which was
    based on ballistic deflection of electron and steering [112], [114], [121]. Two
    gate terminals (left gate and right gate) were introduced with respect to the
    source terminal to control the electron movement in an east or west direction
    by actuating it from the source direction [108], [114], [118]. The BDT can be
    used as a NAND gate [119], flip-flop [109], And gate [110], or Or gate [110].


