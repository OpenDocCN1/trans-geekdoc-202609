  md: '# 7.3.4 PUF-Based Threats on ingenious Devices


    The PUF itself can be a tool for attackers as an inexpensive enemy can replicate
    the challenge–response pair and hence mimic the presented challenge’s accurate
    response. This replication of behavior is possible by anticipating CRPs with a
    machine learning attack with very high accuracy or cloning the PUF behavior. Such
    imaginative attack techniques pose a significant challenge toward designing security
    systems and require creative solutions to mitigate the risk.


    # 7.4 PHYSALLY UNCLONABLE FUNCTIONS


    In manufacturing methods of physical devices, a random element present certain
    constraints, making it difficult to produce tightly controlled devices. These
    limitations give rise to small variations in the sizes and properties of the fabricated
    items. These effects become more pronounced in deep submicron technology nodes,
    that below 90 nm [14, 15]. Fabricating two PUFs with identical physical parameters
    is impossible due to intrinsic random fluctuations. The main advantages of PUFs
    are that they are easy-to-extract digital fingerprints, inexpensive, and do not
    require nonvolatile memories as EEPROM or a nonvolatile random access memory (nvSRAM).


    The fundamental characteristic of PUFs is that there is not storage for keeping
    the secret key. Instead, the PUF extracts the key from the features and attributes
    of the device. Temperature, humidity, and air pressure affect characteristics
    for each PUF.


    A physically unclonable function (PUF) takes advantage of intrinsic fluctuations
    in device parameters. It maps them to a device’s unique physical signature, which
    can be considered a fingerprint of the device. For example, a ring oscillator
    implemented on a chip produces a different frequency for that circuit and silicon-based
    integrated circuits are one of them provide a unique fingerprint to that chip.
    PUFs do not need any external source or battery resource; however, RAMs from SRAMs
    require some external energy source to store the secret key.


    The strength of PUFs is characterized by the complexity of reducing their physical
    structure and hence differ from brute force approaches. This security-level functionality
    specific to a PUF circuit can be considered a hardware-level security algorithm
    and can be termed a cryptographic primitive. The various cryptographic primitives
    are classified by their usage and functionality and are the basic building blocks
    to design secure systems. Some popular cryptographic primitives are shown in Figure
    7.5.


    ![](img/f43fc2d88fdf77da6ccf8abfe605d6a7_157_0.png)


    FIGURE 7.5 Conceptual representation of cryptographic primitives [6].'
