  md: '# Silicene and Germanene Nanoribbons for Interconnect Applications


    Varun Sharma and Pankaj Srivastava


    # Contents


    +   4.1 Introduction 85

    4.2 Theoretical and Experimental Investigations on Silicene and Germanene 88

    4.3 Tailoring the Electronic/Magnetic Properties of Silicene and Germanene 89

    4.4 Edge Functionalized GeNRs for Interconnect Applications [109] 90

    4.5 Substitutedly Doped GeNRs, SiNRs for Interconnects Applications with Comments
    on Reliability and Security [110] 93

    4.6 Conclusion and Future Outlook 96

    References 96


    # 4.1 INTRODUCTION


    In past few decades, ubiquitous implementation of integrated circuits (IC) implies
    their importance and utility in every day-to-day electronic product. These varied
    and diverse applications aroused an imperative for multiple functionalities on
    the same IC, which resulted in the incessant miniaturization of the devices on
    the IC. Traditionally, field effect transistors (FET) embedded on the IC are mostly
    comprised of bulk or 3D semiconductor channel materials, mainly silicon, german,
    and the other III-V semiconductors. Through these materials, to date, researchers
    and technologists have been able to successfully scale down the devices to sub-nanoscale
    dimensions over the last five decades, which was in good agreement with Gordon
    Moore’s famous prediction (popularly coined as Moore’s law) stating that the density
    of transistors on a chip will double every two years [1–4]. Following this prediction,
    researchers, technologists, and industries set up their goals and devised a


    DOI: 10.1201/9781003126645-4'
