  md: '# 15.3.4 Three Terminal Junction (TTJ)


    The YBJ/TTJ contains three terminals named left, right, and center terminals.
    In a Y-branch junction (YBJ), the angle between the left and right terminal is
    kept at 60° as shown in Figure 15.2 [66]. The left and right terminals are directed
    180° from each other in the TTJ [57]. The defined configuration is also known
    as the T-branch junction (TBJ). The AC signal is in either push-fixed andor push-pull
    device [56], [57], [79], [87]. The working principle and output of a YBJ junction
    is similar to that of TTJ. Both the configurations have been fabricated using
    Si [55], III-V group-based heterructure (GaAs/AlGaAs [62], InAlAs/InGaAs [78],
    [79]) and novel material such as graphene [81], [124]–[136]. The TTJ can be used
    to get the 0 and 1 binary logic in digital circuits as AND gate [84], [83], NAND
    gate [61], half-adder [59], SR latch [75], frequency mixer [73], and differential
    amplifier [84].


    # 15.3.5 Former Ballistic Rectifier (FTBR)


    The FTBR is a nonlinear electronic device that converts the AC signal into the
    DC using asymmetric device geometry. A triangular antidot at the front of the
    device directs the carriers in a particular direction for getting the DC response
    [101], [105], [107]. The ballistic rectifier works in the nonlinear regime; therefore,
    it can be characterized using the extended Landauer–Bütticker approach [90], [105].
    The size of the input terminals can be less compared to the size of the output
    terminal for the deflection of the maximum number of electrons towards the lower
    terminal of the device. The FTBR is expected to generate a non-zero response when
    a small signal is applied between the input terminals. The working of ballistic
    rectifier is similar to that of a bridge rectifier without any requirement of
    doping junction or Schottky barrier, as shown in Figure 15.3 [98]. The active
    region of the device is smaller than or comparable to the mean free path of charge
    carriers, and as a result, the carrier moves like a billiard ball without encountering
    any impurity scattering [90]. Therefore, scattering takes place only at the boundary
    of the device structure. Being a planar device, it offers parasitic capacitance
    with a minimal impedance mismatch with external hardware circuitry that allows
    operating at several THz frequencies [98], [103]. The ballistic rectifier has
    been designed using III-V materials (GaAs-AlGaAs [101], InGaAs/InP [91], InAlAs/InGaSb
    [96], [102], InGaAs/InAlAs [78], [79], [85]) and graphene [25], [26], [137]. These
    devices can be used for frequency multiplication [103], THz detection [138], energy
    harvesting [137], etc.


