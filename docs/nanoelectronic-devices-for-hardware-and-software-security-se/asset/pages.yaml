    # 3.1.5.3 Subthreshold Swings in TFET


    The characteristic of the device below threshold voltage ($V_{TH}$) is known as
    subthreshold slope of the device. The subthreshold slope ($SS$) is defined as
    the minimum potential of gate-source voltage required to lower the subthreshold
    current by a factor of 10. It is defined as the minimum amount of the gate voltage
    required for lowering the subthreshold current by a factor of 10.


    The subthreshold swing is defined as follows:


    ```

    $SS = \frac{\partial\log I_D}{\partial\log V_G}^{-1} \qquad (3.4)$

    ```


    The unit of the subthreshold swing is defined as mV/decade.


    In the case of MOSFET, the slope is independent of gate biasing voltage ($V_{GS}$)
    below the threshold voltage.


