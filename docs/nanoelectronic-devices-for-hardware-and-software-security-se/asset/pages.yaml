    # 6.1.3 Various Characteristics of Memristors


    Memristors bear different types of characteristics. Here metal-oxide memristors
    have noteworthy characteristics that make them useful for security. These specific
    characteristics of the memristor rely on the utilized material.


    # 6.1.3.1 Nonvolatility


    Memristors are stable and maintain their state even if the device loses power;
    that is, it retains its resistance value even when the power is OFF [15].


    # 6.1.3.2 Nonlinearity


    The current-voltage characteristics of memristors are extremely nonlinear, since
    these characteristics are resistance state-dependent and time dependent [11],
    as shown in equation 6.5.


    # 6.1.3.3 Bidirectionality


    The obtained current-voltage characteristic shown in Figure 6.2 is symmetric,
    and the curve is similar in opposite quadrants; hence, it is concluded that memristor
    has bidirectional characteristics [16].


    # 6.1.3.4 Formation Process


    Most of the memristor needs to be initialized to exhibit the switching characteristics.
    This is also known as conductive filament formation, which is achieved by applying
    a high voltage across it; before this, it behaves as a linear resistor [17, 18].


    ![](img/f43fc2d88fdf77da6ccf8abfe605d6a7_134_0.png)


    FIGURE 6.2 Pinched $I–V$ characteristics of memristors.'
