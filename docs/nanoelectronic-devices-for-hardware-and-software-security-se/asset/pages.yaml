    # 1.11 CHALLENGES IN JLTFET AND DLTFET


    These JLTFETs and DLTs have shown the required tunneling phenomenon and features
    for TFET devices. These devices can solve the problems of TFTs with junctions
    and their fabrication. But they are not free from the inherent problems of TFTs.
    As all devices work in a similar way, they also face similar challenges. The challenges
    with these JLTFET and DLTFET are of the same nature as TFTs. Both JLTFETs and
    DLTFETs have low Igs, like the conventional TFT. This problem of low Igs hampers
    their ability to couple with MOSFETs. Both JLTFETs and DLTFETs suffer from the
    problem of variability, which needs to be worked upon [52][53]. This phenomenon
    of variability leads to negative conduction in these devices.


    # 1.11.1 Low ON-State Current


    Many techniques have been proposed for the improvement of ON-state behavior of
    JLTFETs and DLTFETs, which are plasma-based TFTs. The aim of our work is for the
    ON-state improvement of JLTFETs and DLTFETs only. The techniques for chemically
    doped TFTs are not mentioned here, although the strategy for ON-state improvement
    comes for both chemically doped and plasma-based TFTs, as they are both functionally.
    The use of a dual material gate with lower work function electrode at the source
    to narrow the tunnel barrier in ON-state has been proposed [54]–56]. The use of
    hydroelectric with a high-k dielectric at the source also decreases the tunnel
    barrier in ON-state by enlarging the field due to high-k dielectric [57][58].
    The conventional dielectric materials can be replaced by ferroelectric dielectric
    materials, which show negative capacitance. This negative capacitance dielectric
    boosted the performance of JLTFETs [59]. The application of low band-gap materials
    in heterojunction JLTFETs and DLTFETs, which narrow the tunnel barrier, has JLTFETs
    formed on an n'' body, have further enhanced their performance [60]–62]. In these
    charge plasma-based JLTFETs there is an unavoidable spacer between gate and p/source
    electrodes. The presence of separate electrodes for channel and source regions
    rises due to this spacer, which widens the tunnel barrier in ON-state [18][50].
    This spacer can be eliminated by the use of a p-type body, which enhances the
    device performance [55]. The formation of more abrupt tunneling junctions can
    also be achieved by the use of a metal layer in the oxide region in the middle
    source and gate electrodes. This also narrows the tunnel barrier in ON-state,
    thereby improving the device performance. [53][63][64].'
