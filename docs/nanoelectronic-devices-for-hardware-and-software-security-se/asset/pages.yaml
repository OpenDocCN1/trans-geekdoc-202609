    # ## 10.1 INTRODUCTION


    To follow Moore''s law, the consistent scaling down of the nanoscale MOSFETs leads
    to a degradation in power consumption and various short channel performance effects
    [1–2]. It is very difficult to maintain the switching ratio ($I_{ON}/I_{OFF}$)
    with the scale of supply voltage, and also, the subthreshold swing (SS)


    DOI: 10.1201/9781003126645-10 201'
