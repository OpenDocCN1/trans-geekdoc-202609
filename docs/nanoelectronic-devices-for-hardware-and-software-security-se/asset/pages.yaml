    # 7.2 THE NECESSITY FOR HARDWARE PROTECTIONS


    The physical layer or the hardware layer is the first defense mechanism against
    mounting security attacks (Figure 7.1). This layer defines the interface and mechanism
    for putting bits data on a network medium. The hardware layer is also fundamental
    to the security of higher-level functions and is the first target of hardware
    attacks. Understanding the attacker''s modus operandi at this layer may help successfully
    mitigate the severity of the attack and prevent hackers from accessing secure
    information at higher-level layers.


