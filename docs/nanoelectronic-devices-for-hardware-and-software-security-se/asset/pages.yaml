    from valence band to conduction band. Shockley-Read-Hall recombination holds the
    thermal effect of the device because at low biasing voltage thermal effect prominent.
    In addition to the material of narrower bandgap material like InAs, a new leakage
    current will become dominant during band-to-band tunneling. In this process, the
    electron will be thermally excited and form a valence band to intercept traps.
    This prevents the biasing voltage from being exceeded by $E_g/q$, reverse mode
    of the biasing will arise due to the minority charge carrier at the drain side,
    which results in the ambipolar conduction. This ambipolar conduction can be reduced
    by building asymmetry into the drain side. This can be done by the gate uplift
    and gate overlap condition. Another way is to use the heterunction material of
    a lower bandgap at the source side, in comparison to the channel and drain.


    # 3.1.6 Simulation Tools


    Numerical simulations are becoming more important in modern scientific research
    work. Computer aided design (TCAD) simulation tools provides a prototype of designed
    structured characteristics that can be accurately predicted in a relatively short
    time. Therefore, it saves our time, cost, and rigorous effort for analytical and
    experimental work. TCAD tools are performed as 2D or 3D simulations, which fundamentally
    depends on finite element methods (FEM), where the device fabrication and its
    electrical behavior can be assessed based on the physical processing mechanisms
    or electrical mechanisms in the device electric field, doping profile, potential
    biasing, charge carrier density, etc. [40–41].


    The Centaurus TCAD tool is a simulation tool that is based upon the industry''s
    standards with several fabricator collaborators, and the prototypes are tuned
    to the experimental details. This technology has been found to provide precise
    prediction of the future system with its characteristics to fulfill the demands
    of the International Technology Road Map for Semiconductors (ITRS) [19].


    # 3.3.1.6 TFET Models


    In a TCAD simulation tool, TFET models are basically divided into two types of
    band-to-band tunneling (BTBT) models:


    +   * Local BTBT model

    * Nonlocal BTBT model


    The Kane model, Klassen model and Hurkx model are the local BTBT models, while
    the WKB model is a nonlocal BTBT model. In the local model, a simple equation
    is used to drive the electric field, which is a significant parameter to find
    the tunneling width and tunneling current. The local model parameters easily fit
    the simulation of a TFET to find its effective parameters. However, these models
    are inappropriate for the TFET simulation because BTBT is fundamentally a physical
    process that depends on the width of the tunneling barrier and the energy states.
    The nonlocal BTBT process physically depends on the width of the tunneling barrier
    and direction to the flow of charges. Although commercially many of the device
    simulation tools use TCAD, Sentaurus, Silaco, Medici, and HyENEXSS, inherit the
    properties of the TFET models for execution purpose. Among them, we used Sentaurus
    simulation software for our analysis because most of the manufacturers follow
    this for their fabrication purpose. In reality, BTBTs have multidimensional effects.
    The tunneling current is determined by taking into account the profile of the
    energy band along each tunneling slice with reverse bias voltage applied to the
    junction of the device. The schematic diagram of an energy band profile in the
    range of valence band electron permitted for tunneling current is shown in Figure
    3.9. Table 3.1 reports the default value of'
