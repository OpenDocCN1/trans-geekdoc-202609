    # 14.4.2 Avalanche Photodetector


    Another major type of photodetector with an internal gain mechanism is an avalanche
    photodetector (APD), as shown in Figure 14.6a, and has a more refined architecture
    than the p–i–n photodetector to produce an extremely high electric field region
    (~10 V/cm). Therefore, in the depletion region where the photons are absorbed
    and the carrier pairs generated, a high electric field region exists where electrons
    and holes can attain enough energy to newly generated carriers. This phenomenon
    is recognized as impact ionization or carrier multiplication (CM) and is the process
    that results in avalanche breakdown in reverse-biased diodes. Normally, this needs
    a higher reverse bias voltage so that the newly generated carriers via impact
    ionization can produce more carriers with similar phenomenon, as shown in Figure
    14.6b [9]. More than 10⁴ of multiplication can be achieved in APDs. Thus, APDs
    internally multiply the primary photocurrent before entering the input circuit
    of the amplifier. As the photocopy is multiplied before facing the thermal noise
    associated with the receiver circuit, the sensitivity of the receiver increases.


    A commonly used architecture for attaining carrier multiplication with slight
    excess noise is composed of a high resistive, that is, likely p+-type doped (p*)
    material deposited on a p* substrate. A p*-type ion implant or is then made in
    the high resistive material, followed by n*-layer. The i-region is intrinsic material
    that is made with p-type doping. This configuration is termed p*–i–n* reach through
    the avalanche photodetector (RAPD) and is shown in Figure 14.6a. The term reach-through
    arises from the photodetector operation. The high electric field region is also
    known as the avalanche multiplication'
