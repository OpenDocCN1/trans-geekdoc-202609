  md: '# 4 Silicene and Germanane Nanoribbons 89


    # 4.3 TAILORING THE ELECTRONIC/MAGNETIC PROPERTIES OF SILICENE AND GERMANENE


    From the studies, it is evident that graphene, silicene and germanane are also
    predicted to have a semimetallic nature [65]. Thus, for any plausible switching
    device application, it is imperative to ensure the semiconducting behavior of
    these materials. Along the lines of graphene, researchers have focused on several
    ideas pertaining to the realization of semiconducting properties in these materials.
    Including the application of an external electric field, saturation of dangling
    bond through a different functionalization group, and introducing external domains.
    Apart from these, one-dimensional confinement of these materials (creating nanoribbons
    (GNRs), silicene and germanane also possess interesting and useful properties
    to them. Like graphene nan from a sheet in a particular direction, they are zigzag
    and armchair. It is revealed through these nanostructures have highly susceptible
    edges that can undergo reconstruction or functionalization that can modulate the
    properties of these nanostructures. Literature also suggests that these structures
    can play a vital role in modulating the properties of these nanostructures. Below
    are some crucial landmarks from the literature that suggest how key properties
    of silicene and germanane nanoribbons can be modulated for varied use of these
    materials.


    Ding and Ni [89] have investigated the electronic and magnetic properties of silicon
    nanoribbons. Based on the first-principles calculation, they showed that armchair
    nanoribbons can exhibit a metallic or a semiconducting behavior based on the width
    of the nanoribbons. However, based on the energy state calculated, they demanded
    zigzag nanoribbons exhibit a magnetic ground state (ferromagnetic). Under the
    application of a transverse electric field, these zigzag structures tend to exhibit
    the half-metallicity to may. Other studies have widely utilized in spintronic
    devices. Pang et al. [53] have carried out studies on zigzag and armchair germananoribbons.
    They revealed, that silicene exhibits a nonmagnetic semiconducting behavior, whereas
    zigzag exhibit an antiferromagnetic semiconducting ground state. In this work,
    they also studied the effects of substitutional doping, which both N-doped and
    B-doped are preferred at the edge rather than center. Ding et al. [90] suggested
    that the application of the sp²³ bipolar semiconducting behavior can be induced
    in zigzag silicene nanoribbons. They also suggested the measures to turn them
    into half-metals using suitable dopants, hence predicting their utility for spintronic
    devices. Zhang et al. [91] have studied the geometric, electronic, and magnetic
    properties of armchair nanoribbons. They predicted that zigzag silicene nanoribbons
    possesses a magnetic ground state when terminated asymmetrically with hydrogen.
    They considered various configurations and suggested that, although asymmetric
    edge terminations induce a magnetic character in the nanoribbons, they are not
    the stable ones. They also studied the effect of a transverse electric field on
    these structures and found them suitable for spintronic devices under appropriate
    electric field effects. Tao et al. [64] have silicene on an Ag (111) film from
    following; this uniquely encapsulated delamination transfer and native Ag were
    developed for the first time, preserving the properties of buckled silicene during
    the device fabrication and characterization process. This work for the first time
    demonstrates and provides a silicene device that can be in agreement with predictions
    of a Dirac-like比如 transport.


    On the lines in recent years, several works come to light that suggest different
    methods to alter the electronic and magnetic properties of novel materials. Interaction
    with halogen, transition metals, and coinage metals (Ag, Au) [54–107]. These studies
    suggest a profound impact of foreign atoms on various properties of these materials.
    The vitality of such studies also lies in the fact that these elements, such as
    hydrogen, oxygen, halogens, transition metals, and coinage metals (Ag, Au), can
    be very common as the impurities in the cleanroom environment, hence making such
    cases a practical scenario.'
