    plot for Hammerstad-Bekkadal model.


    # 13.4.2 Huray Model


    This model treats the surface roughness profile as a cluster of a 3D ''snowball''
    structure (Figure 13.3b), where the roughness factor (f) is expressed mathematically
    by equation 13.3 [11].


    ```

    $f_r=1+\frac{4\pi r^2N}{1+\frac{\delta_{in}}{r}+\frac{\delta_{out}}{2r}} (13.3)

    ```


    Where, r is the radius of snowball; A is surface area of conductor (for the present
    case, it will be internal surface area of all the four sides of the waveguide)
    and N is the ratio between the volume of the surface consideration to the volume
    of each snowball.


    Using equations 13.2 and 13.3, the modified conductivity of the waveguide can
    be obtained. Considering a practical thickness of 3 µm for WR-2.2 waveguide, the
    radius of the snowball can typically vary between 0.1 to 1.5 µm. Figure 13.5a
    depicts the modified conductivity plot for various r values. Change in conductivity
    of the waveguide reflects in the propagation characteristics, which is noticed
    in Figure 13.5b.'
