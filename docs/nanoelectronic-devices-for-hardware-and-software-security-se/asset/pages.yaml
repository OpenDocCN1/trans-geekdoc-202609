    efficiency of 8% at input power of 400 mW [129].


    Recently, a G-FTBR has been demonstrated first time to work at room temperature
    [26]. Back-gated voltage was used to control the flow of charge carriers, which
    are electrons or holes into the negative or positive DC output. The G-FTBR demonstrates
    the nonlinear characteristic at -15 V back-gate voltage. The suppression of flicker
    noise in G-FTBR is obtained, as graphene has no bandgap and zero threshold voltage.
    Later, the graphene has higher mobility that improves its speed up to THz frequencies
    for imaging, detection, communication, and microwave/THz applications. G-FTBR
    was reported by replacing SiO2, with an h-BN substrate to enable high mobility
    carriers up to 200,000 cm²/Vs Vs [23]. The G-FTBR on an h-BN substrate provides
    a smooth surface to the charge carriers, enabling the highest mobility change
    in the sign of output voltage with the back gate voltage and shows flicker noise
    at a lower frequency, which can be taken over thermal noise at higher frequencies.
    Similarly, the G-FTBR has been demonstrated with drift-diffusion modeling to analyze
    the 3D and 2D rectification behavior of rectifier [100]. Besides, G-FTBR can also
    be used in imaging applications [138].


