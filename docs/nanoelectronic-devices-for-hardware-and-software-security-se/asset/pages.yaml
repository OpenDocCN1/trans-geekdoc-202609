    # 1.4.1 Electrostatic Doping


    The concept of electrostatic doping can be a very suitable alternative to overcome
    the challenges associated with chemical doping. In electrostatic doping, the concentration
    of carriers in the body of the semiconductor is influenced by the electrode attached
    to it. This is mainly doping of an intrinsic semiconductor material by electrodes.
    When a semiconducting material is brought near a conducting material or metal
    electrode, band alignment near the interface occurs, which induces charge carriers.
    The carriers can be electrons or holes depending on the type, polarity, and work
    function of the electrode. The relative difference between the Fermi level and
    energy bands of semiconductor determine the concentration in the semiconducting
    material. On the metal-semiconductor interface it can be controlled by metal''s
    work function and semiconductor properties as work function, electron affinity,
    and energy band gap, shown in Figure 1.9 [16]. Many devices electrostatic doping
    have been proposed such as diodes [17], tunnel field effect transistors (TFETs)
    [18], impact-ionization MOSFET (IMOS) [19] and dopless transistors [15].


