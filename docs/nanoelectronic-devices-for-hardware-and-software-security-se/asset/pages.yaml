    # 16.5 PRACTICAL ASPECTS OF GRAPHENE SYMFET TECHNOLOGY


    Nowadays, hardware security has become a big concern for IP privacy and hardware
    Trojans [14]. The Trojans have triggered the researchers to design the applications
    with circuit protection and spiteful logic detection from different perspectives.
    In this chapter, emerging technologies are enhanced by their unique properties
    for hardware security domain applications. Circuit structures including power
    regulators, camouflaging gates, and polymorphic gates are measured to prove the
    high efficiency of nanowire FETs and graphene SymFETs for circuit protection and
    IP privacy prevention applications. Simulation results of the devices designate
    that extremely efficient and secure circuit design structures can be attained
    via the custom of emerging technologies. Overall, the knowledge of using nanoelectronics
    like graphene symmetric FET and silicon nanowire FET structures for security applications
    will be a new platform and interesting path of research for both electronic and
    security researchers [50–52].


