    # 3.1 INTRODUCTION


    In the last four decades, semiconductor scaling, novelty with the structural design,
    and fabrication enhancement are the main governing points that significantly developed
    complementary metal oxide semiconductor (CMOS) technology. This will result in
    a faster integrated circuit (IC) that comes with superior performance. However,
    continuous scaling of the device leads to short channel effects (SCEs) as gate-induced
    leakage (GIDL), drain-induced barrier lowering (DIBL), the hot electron effect,
    and a subthreshold slope restricted to 60 mV/dec [1–3]. So in order to maintain
    better performance, we have to open the doors for new technology in which it be
    a challenge to suppress the SCEs. In this era of advanced electronics, large amount
    of memory space is regained with ultra-low power consumption to achieve high performance.
    Initially, the first transistor was introduced by the Bell Laboratories in the
    1940s [4–5]. The journey of device dimensions from centimeters to the scale of
    todays. The first IC was introduced by Jack Kilby in 1958 at Texas Instruments
    [6]. In the last four decades, minaturization of the transistor has taken place
    in silicon-based CMOS technology, which has led to the growth of the semiconductor
    industry. This miniaturization of integrated circuits continues to advance on
    as shown in Figure 3.1, which is driven by the cost and its functionality [7,
    51, 52]. Continuous scaling of the CMOS’s physical feature is the key factor for
    building high-density integrated electronic systems and increasing efficiency
    (by increasing device agility, decreasing intrinsic delay by 30% per power generation,
    and lowering the cost). However, the transistor’s miniaturization faces an immense
    power crisis and insurmountable barriers with high power dissipation due to fundamental
    limitations of metal-oxide semiconductor field-effect transistors (MOSFETs) (i.e.,
    high leakage in OFF-state ($I_{OFF}$), gate leakage, short channel effects (SCEs),
    and high subthreshold switching [8–10]). Therefore, the technological advancement
    of the nanoscale regime leading to increased performance, improved energy efficiency,
    and reduced supply voltage, new nanoscale devices are to be created [53–56].


    # 3.1.1 Scaling: A Historical Perspective


    The scaling factor allows manufacturing of nanoscale devices at the same cost.
    However, traditional scaling based on reduction of physical dimensions of metal-oxide–semiconductor
    transistors, with simultaneous reduction of supply voltages and dissipated power,
    reaching its limits [9–10]. It requires that the researchers explore solutions
    to enable the next technology nodes, making transistors smaller and faster. This
    will require further innovations in device architectures and new materials and
    inventive techniques of patterning features of nanometer. Scaling is a method
    to reduce the device dimension in the regulated manner, so that device occupied
    area will be the minimum without any changes in the output characteristics [57–62].


    Issues such as high power consumption and less packing density can efficiently
    be solved with the aid of scaling, leading to the creation of an effective device
    that can be operated with a low biasing voltage.'
