    # 15.5 CONCLUSIONS AND FUTURE SCOPE


    # 15.5.1 Conclusions


    The scaling issues in conventional electronics devices create the opportunity
    for novel devices to process the high speed data. The FTBR and TTJ are the types
    of novel-rectifiers analogous to a bridge rectifier. The high speed materials
    such as III-V heterostructures and graphene can generate the response at THz frequencies.
    The rectifiers can be used as voltage inverter and frequency doubler at zero temperature
    in addition to other applications such as THz imaging, RFID.


    # 15.5.2 Future Scope


    Graphene-based rectifiers can be utilized as thermo-electric generators, which
    will respond according to the change in temperature at interface terminals. These
    thermo-electric generators can use the heat generated in the circuitry and convert
    it into electrical signals. Graphene based rectifiers can be integrated with antenna
    to perform the energy harvesting using electromagnetic radiations. The combination
    of rectifier and antenna is known as rectenna. The generated DC output can be
    used to charge the mobile batteries. This will save and be used in future to perform
    the digital operations such as logic gates, etc. Due to THz response, graphene-based
    rectifiers can be utilized in imaging applications.


