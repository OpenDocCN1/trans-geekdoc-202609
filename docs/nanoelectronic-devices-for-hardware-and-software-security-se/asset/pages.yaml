    # # 1.1 INTRODUCTION


    The era of electronic gadgets has set upon, giving rise to many smart devices.
    These smart devices have vastly improved the standard of living mankind. The ease
    of life is facilitated by these electronic gadgets, which have brought a revolutionary
    effect on human race. These electronic gadgets affected the mankind in all spheres
    of life, such as engineering, health, education, warfare, entertainment, etc.
    The basic building block of these smart devices is the transistor, which has led
    to these innovations.


    # # 1.1.1 Transistor Action


    The basic building block of these smart electronic gadgets is the transistor.
    These transistors were invented by Shockley, Bardeen, and Brattain in 1947. The
    transistor is essentially a three-terminal device where the third terminal (voltage)
    is used to control the current between the other two terminals. The discovery
    of the transistor was actually an accident that occurred in the labs of the previously
    mentioned scientists. Who would have thought this would govern the lives of millions
    of people in years to come? In the beginning, until the 1970s, the bipolar junction
    transistors (BJT) served the purpose for the semiconductor industry. But they
    are now mostly used in radio frequency circuits. The other type of transistor,
    MOSFETs (metal-oxide semiconductor field effect transistors), has efficiently
    served the microelectronics market till. The gate controls the current in the
    channel between the source and drain terminals through an insulating dielectric
    between the gate and channel. There is also a fourth terminal in a MOSFET called
    the body, which is generally grounded in certain situations. The mode of conduction
    in the channel region of a MOSFET is drift and diffusion. The source and drain
    terminals are doped heavily, whereas the channel is lightly doped, with impurities.
    For a MOSFET to behave as a switch, it must have two states, that is, OFF-state
    and ON-state. For a perfect switch, the current in the OFF-state must be zero,
    and substantial current must be present in the ON-state. To understand these states,
    we need a quick review of basic MOSFET physics. Basically, the charge dynamics
    in the channel region are influenced with the aid of an electric field applied
    through the gate voltage in these effect devices. For a negative gate voltage
    in n-MOSFET (n-type), the gate electrode attracts the major holes in the lightly
    doped p-type channel, which increases the'
