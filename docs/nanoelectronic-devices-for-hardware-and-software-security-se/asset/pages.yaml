    # 3.1.3.3 Strain Method


    Due to scaling, the source and drain overlap each other due to reductions in the
    device dimensions. However, it will increase the electric field drastically. In
    order to overcome this problem, doping needs to be increased. But with the increase
    in the doping concentration in the channel, the charge particle scattering will
    lead to reducing the mobility inside the channel. On the other hand, the threshold
    voltage of the device will continuously vary because of random fluctuation of
    doping. In order to reduce the mobility degradation due to charge scattering,
    one technique called strain technology, improves the mobility of carriers. This
    will also help in modifying the lattice constant of the material. Second, it ensures
    carrier traps are formed by band structure alignment, which ultimately increases
    the mobility [9]. By increasing the lower band gap materials are used to increase
    the mobility like silicon-germanium. The germanium content, will increase.


    # 3.1.3.4 Multi-Material Gate


    A multi-material gate is one of the most effective techniques in reducing the
    hot electron effect (HEE) used for the channel engineering method. The two different
    materials of different work function after each other; these are called tunneling
    gate length ($L_g$) and auxiliary gate length ($L_s$). The $M_2$ (material) of
    the drain side has lower work function, and the $M_1$ toward the source side has
    higher work function, as shown in Figure 3.4. This technique is effective for
    channel length less than 25 nm. In 1999, the double-material-gate design (DMG)
    was proposed, and in 2008, the triple-material-gate design (TMG) was proposed
    [23]. Dissimilar work functions at the source side and the drain side will lead
    to a high electric field. This will result in improving the transport efficiency
