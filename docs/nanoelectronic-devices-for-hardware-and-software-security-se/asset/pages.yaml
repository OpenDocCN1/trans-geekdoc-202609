    # # 1.2 SHORT CHANNEL EFFECTS\n\nWhen the device dimensions (channel) of the MOSFETs\
    \ are similar to depletion lengths at source-channel interfaces and drain channel\
    \ interfaces, it is called short channel MOSFET. There is an alarming increase\
    \ in the OFF-state current attributable to these effects at sub-100 nm gate lengths.\
    \ The reduction of threshold voltage with device dimensions is also present. The\
    \ decrease in $I-V$ curves and the effect of drain bias on threshold voltage are\
    \ some common problems in these devices. These phenomenon are known as short channel\
    \ effects, which are discussed here.\n\n# # 1.2.1 Subthreshold Slope 'SS'\n\n\
    Subthreshold swing is treated as the quantity of gate voltage required a decade\
    \ change in drain current. The equation of SS for a MOSFET is given as equation\
    \ (1.3).\n\n```\n$SS = (kT/q) * \\log (1 + (C_D /C_{OX})) \\quad (1.3)$\n```"
