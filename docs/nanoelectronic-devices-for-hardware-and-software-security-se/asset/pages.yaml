    # 2.3 PHYSICS IN BAND-TO-BAND TUNNELING


    The band-to-band tunneling (BTBT) is based on the phenomena of quantum mechanics
    in which the electrons tunneled through the forbidden energy gap of the semiconductor.
    From a physics point of view, BTBT is the snippings of the covalent bonds created
    among semiconductor atoms. Here, the band-to-band tunneling generation rate ($G_{BTBT}$)
    will be derived mathematically for a better understanding of how the BTBT mechanism
    attributes to a steeper subthreshold slope. It will start with the establishment
    of the general tunneling concept, with the presumptions for the derivations. The
    tunneling probability ($T$), current density ($J$) and generation rate ($G$) will
    then be determined with the help of the Wentzel–Kramers–Brillouin (WKB) approximation.


    # 2.3 Presumptions Made for Derivation


    The first articulation on the tunneling probability was determined by Kane using
    time-dependent disruption hypothesis in addition to Fermi''s golden rule [16],
    [17]. However, the section would rather utilize a rearrangement with a more intuitive
    way of dealing with a similar undertaking dependent on the WKB estimation [18].
    The evaluation is done in accordance with tunneling of electrons through a reverse
    biased pn junction as shown in Figure 2.3.


    So as to acquire a close form bandgap solution of $G_{BTBT}$, the accompanying
    presumptions are made essential:


    +   1. Presume a close bandgap semiconductor such that the momentum impact due
    to phonon scatterings could be neglected. In this manner, a simple analytical
    approach for $G_{BTBT}$ can be achieved.'
