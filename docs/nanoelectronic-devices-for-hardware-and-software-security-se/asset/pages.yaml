    # 12.2 PROPOSED MODEL


    In the proposed system, to improve the efficiency of gain and radiation pattern,
    the loss of surface waves is reduced. This system uses a PhC substrate at terahertz
    frequency in the range from 10¹. Both conventional antenna and a photonic crystal
    antenna are designed at THz frequency, and their measuring parameters are compared.
    The performance parameters, such as resonant frequency, return loss (RL), directivity
    (D), voltage standing wave ratio (SWR), and gain of the antenna will influence
    the antenna bandwidth and the quality of signal transmission. The directivity
    and gain is to be considered for the antenna at THz frequency. Both return loss
    and VSWR are important, since gives us the output of reflected power and impedance
    loss due to the mismatch of the feeder.


    # 12.2.1 Design of Nano-Structured Honeycomb Pentagon Antenna


    The configuration of the patch antenna is designed with an aperture feeding mechanism
    and designed using computer simulation technology (CST) software. There are various
    types of patches, such as square, rectangle, triangle, honeycomb, etc. The honeycomb
    patch antenna diminished the return loss and separation between the feeding point
    and radiation point; due to high isolation, a radiation pattern occurs. There
    are various substrate materials such as Rogers 4350, Duroid, FR4, epoxy, Bakelite,
    etc. The material used in this design is the FR-4 (flame retardant) substrate
    because it reduces the power loss and increases the gain and directivity more
    than the other substrates. Generally, the FR-4 substrate is utilized as electrical
    insulators that possess substantial mechanical strength and will resist moisture
    effects. The material used in ground, feed and patch are copper, as it is a good
    conductor of heat. In Table 12.1, the the ground width is denoted as ''GW'' and
    the ground length is denoted as ''GL''. The width of the substrate is denoted
    as ''SW'', and the thickness of the design is denoted as ''T'', and the height
    of the design is denoted as ''H''. Patch length is denoted as ''PL'', and the
    patch width is denoted as ''PW''. The length of the feed is ''7 µm, and the width
    of the feed is 0.6 µm. The dimension of the design is in micrometers. In this
    chapter, two types of antenna structures are designed. Figure 12.1 represent the
    conventional antenna and Figure 12.2 represents the honeycomb patch antenna on
    a PhC. Table 12.1 provides the dimension of the propounded honeycomb patch antenna.
    The patch antenna with the internal dimension (72 × 34 µ²) resonates with the
    THz frequency


