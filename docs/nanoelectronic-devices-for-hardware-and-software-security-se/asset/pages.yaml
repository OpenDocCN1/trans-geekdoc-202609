    # 4.6 CONCLUSION AND OUTLOOK


    In a nutshell, it can be stated that functionalization and substitutional doping
    leads to significant changes in the electronic and transport properties of SINR
    and GeNRs, projecting them as a suitable for interconnect applications. The results
    presented in the chapter systematically highlight the thermodynamic stability
    (based on calculation of $E_g$ and $E_{eff}$), electronic properties (based on
    calculation of bandgap), and finally $R_0, L_c, C_0$ (as performance parameters
    for interconnect application). Based on these calculations, it is proved that
    with the increase in the O-atom concentration at the edge of nanoribbons, their
    performance for interconnect improves. However, in case of substitutional doping,
    the performance depends mainly on the size of the doping. Further, in each case,
    pertaining to the impact of the bias voltage has also been carried out. Consideration
    of the effect of the bias voltage on performance of the interconnect plays a pivotal
    role in determining the reliability and the security and integrity of the interconnect
    used in the hardware.


    From the future perspective, similar studies can be conducted through various
    metallic interfaces and functionalizations to gauge the performance of SINR and
    GeNR interconnects. It is also noteworthy that the reliability or security interconnects
    can also be proved from other dimensions, such as study of defected SINRs/GeNRs
    or use of metal contacts rather than the extension of the same material as electrodes.
    Systematic probe of such possibilities will lead to low power and secure nanoscale
    interconnect for next generation hardware.


