    # 7.1 HISTORICAL BACKGROUND AND PRELIMINARY CONCEPTS


    Gustav Simmons et al. [1] first conceptualized and utilized the properties of
    unclonable structures for paper authentication by using object identification.
    Their concept was to allow the paper''s authentication by third parties where
    public-key cryptography was enhanced with derived primitives. However, the first
    persons to elaborate on the idea of fingerprinting the unclonable structures or
    random variations called PUF and subsequently define the terminology as Pappu
    et al. [2].


    Some earlier work in the direction of authentication utilized random arrangement
    of the physical nature of the material used for the manufacturing of currency,
    for example, small optical fiber, which could be instrumental in authenticating
    the same (i.e., currency). However, the first microcircuit that appeared in 2002
    [4] triggered researchers'' interest.


    As we witness the increasing complexity of computing devices, it poses a grave
    challenge for designing a robust security system. The current state-of-the-art
    electronic devices may incorporate a few billion transistors. Providing security
    to such complex systems could easily become intractable. Therefore the need arises
    to ensure that various subcomponents of modern design and their frequent interactions
    work precisely in the same manner as they are intended to do.


    This validation of modern devices'' security becomes a grey area and, therefore,
    to protect security attacks. People of fide intention may take advantage of such
    weak links. For example, someone can'
