    # ABSTRACT:


    Reducing the lateral scale of two-dimensional (2D) materials to one-dimensional
    (1D) has attracted substantial research interest not only to achieve competitive
    electronic applications but also for the exploration of fundamental physical properties.
    Controllable synthesis of high-quality 1D nanoribbons (NRs) is thus highly desirable
    and essential for further study. Here, we report the implementation of supervised
    machine learning (ML) for the chemical vapor deposition (CVD) synthesis of high-quality
    quasi-1D few-layered WTe₂ NRs. Feature importance analysis indicates that H₂ gas
    flow rate has a profound influence on the formation of WTe₂, and the source ratio
    governs the sample morphology. Notably, the growth mechanism of 1T′ few-layered
    WTe₂ NRs is further proposed, which provides new insights for the growth of intriguing
    2D and 1D tellurides and may inspire the growth strategies for other 1D nanostructures.
    Our findings suggest the effectiveness and capability of ML in guiding the synthesis
    of 1D nanostructures, opening up new opportunities for intelligent materials development.


    ![](img/4d2e5a3ed5f52a057a7fba20f726c29c_0_0.png)


    # INTRODUCTION


    In the past few decades, two-dimensional (2D) transition metal chalcogenides (TMCs)
    have demonstrated excellent performance in nanoelectronic and spintronic applications
    and showed great potential for investigating quantum physics and fabricating quantum
    devices.¹⁻⁴ Recently, one-dimensional (1D) nanostructures derived from 2D TMCs
    have received increasing attention, attributed to the intriguing properties that
    arise from the reduced dimensionality and enhanced quantum confinement effect.⁵⁻⁹
    Among TMCs, tungsten ditelluride (WTe₂) with rich structural variations and strong
    spin−orbit coupling is predicted to be type-II Weyl semimetals and 2D topological
    insulators, providing an ideal platform for the investigation of dimensionality-related
    properties, such as superconductivity, quantum spin Hall Effect, and Majorana
    Fermion.³,⁴,¹⁰⁻¹⁶ Even though chemical vapor deposition (CVD) has been widely
    adopted to grow high-quality 2D materials, controllable synthesis of few-layered
    WTe₂ remains challenging, not to mention the dimensionality control. This is due
    to the lower reactivity of Te and small electronegativity difference between Te
    and W, as well as the poor stability of telluride.¹⁷⁻²¹ Effective identification
    of optimal synthesis conditions for WTe₂ with dimensional tunability is therefore
    urgently required. Machine learning (ML) has recently demonstrated great capability
    in materials study.²²⁻²⁸ It has been successfully applied to accelerate the design
    and discovery of novel materials, including catalytic materials,²⁴ inorganic−organic
    hybrid materials,²⁸,²⁹ thermoelectric materials,³⁰ superhard materials,³¹ low-dimensional
    materials,²⁶,²⁷,³² phase-change memory material,²⁵ organic photovoltaic material,³³
    etc., through effectively learning from the past and even failed data.³⁴⁻³⁸ For
    instance, Zhong et al.²⁴ reported the discovery of Cu−Al electrocatalysts with
    the combined density functional theory calculations and active machine learning,
    which can efficiently reduce CO₂ to ethylene with the highest Faradaic efficiency
    reported so far. On top of the materials discovery, the successful synthesis of
    novel materials is critical toward its future application, whereas substantial
    effort is generally required with traditional laboratory exploration.²³,²⁷,³⁹
    Therefore, the feasibility and potential of introducing ML into guided synthesis
    and even structure engineering of advanced materials to expedite the exploration
    process and reduce the cost are worth exploring.


    In this work, we implement supervised ML on CVD synthesis of few-layered 1T′ WTe₂,
    and the paradigm is schematically depicted in Figure 1.⁴⁰ To optimize the synthesis
    condition, CVD synthesis data are collected experimentally to train the ML model.
    The well-trained model is capable of


