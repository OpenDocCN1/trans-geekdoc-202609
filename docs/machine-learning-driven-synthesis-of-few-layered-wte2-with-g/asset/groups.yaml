    共 2 mg 粉末（Te:W:NaCl = 16:1:0.1）用玛瑙研钵混合，然后放置在 10 mm × 30 mm Si/SiO₂ 衬底上（氧化层为 285
    nm）。另一块 10 mm × 30 mm Si/SiO₂ 衬底以抛光面朝下放置在粉末上方，形成夹心结构。然后将它们转移到封闭的内石英管中（直径为 12 mm，长度为
    300 mm）。内石英管被放置在石英管中（直径为 2 in.），然后置于炉子的中心。加热前用 Ar 气（99.99%）清洗石英管 20 分钟。之后，使用 Ar/H₂
    混合气体（分别为 100/40 sccm）作为载气。炉子在 20 分钟内加热至 750 °C，然后保持 7 分钟。然后，炉子自然冷却至室温，WTe₂ 纳米棒可在衬底上获得。


    ### 表征


    所生长 WTe₂ 的微结构和形貌通过光学显微镜（Olympus BX51）、拉曼（WITEC Alpha 200R）、XPS（Kratos Analytical,
    Manchester）、AFM（Asylum Research Cypher S）和 STEM（JEOL ARM-200F (S)）表征。STEM 表征采用
    CEOS CESKOR 球差校正器进行，加速电压为 80 kV。EDX mapping 结果由 TEM 进行。拉曼表征采用 532 nm 激光器进行（所用激光功率小于
    1 mW，系统以 520 cm⁻¹ 处的 Si 拉曼峰进行校准）。XPS 分析由 Kratos Axis Supra 仪器进行，电荷校正的结合能校正通过将
    adventitious C1s 线赋值为 284.8 eV 来进行。


    ### 特征重要性


    *Shapley Additive exPlanations (SHAP)* 计算理论上合理且唯一的特征重要性值，属于加性特征归因类。⁵¹ 解释模型 $g(z'')$
    满足 $g(z'')=\phi_0+\sum_{i=1}^{M}\phi_i z_i''$，其中 $z''\in\{0,1\}^{M}$，$M$ 为输入特征的数量，$\phi_i$
    表示特征重要性值，且 $\phi_i\in\mathbb{R}$。$z_i''=1$ 表示正在观测的特征，否则为 0。


    为计算 SHAP 值，定义 $f_x(S)=E[f(x)|x_S]$，其中 $f$ 为待解释的机器学习模型，$S$ 为 $z''$ 中非零索引的集合，$E[f(x)|x_S]$
    为在子集 $S$ 的输入特征条件下函数的期望值。 使用这些条件期望为每个特征计算 SHAP 值：


    $$\phi_i=\sum_{S\subseteq N\setminus\{i\}}\frac{|S|!(M-|S|-1)!}{M!}\left[f_x(S\cup\{i\})-f_x(S)\right]
    \tag{3}$$


    其中 $N$ 为所有输入特征的集合。


    ### XGBoost


    XGBoost 源自梯度提升决策树（GBDT），⁵²,⁵³ 使用 $M$ 个决策树的集合作为基估计器 $f_m$，$m=1,\ldots,M$ 进行决策：


    $$\hat{y}_i=\sum_{m=1}^{M}f_m(x_i) \tag{4}$$


    给定 $N$ 个训练数据 $\{(x_i,y_i)\}_{i=1}^{N}$，目标是最小化


    $$\operatorname{obj}(\theta)=\sum_{i=1}^{N}l(y_i,\hat{y}_i)+\sum_{m=1}^{M}\Omega(f_m)
    \tag{5}$$


    其中 $\sum_{i=1}^{N}l(y_i,\hat{y}_i)$ 表示训练损失，$\sum_{m=1}^{M}\Omega(f_m)$ 对基估计器的复杂度进行惩罚。此外，它采用加性训练策略，每次添加一棵新树，在第
    $t$ 步优化目标：


    $$\operatorname{obj}(\theta)^t=\sum_{i=1}^{N}l(y_i,\hat{y}_i)+\sum_{m=1}^{t}\Omega(f_m)
    \tag{6}$$


    而


    $$\hat{y}_i^t=\sum_{m=1}^{t}f_m(x_i)=\hat{y}_i^{t-1}+f_t(x_i) \tag{7}$$


