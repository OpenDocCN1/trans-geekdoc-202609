    # Machine Learning Driven Synthesis of Few-Layered WTe₂ with Geometrical Control


    Manzhang Xu, ● Bijun Tang, ● Yuhao Lu, Chao Zhu, Qianbo Lu, Chao Zhu, Lu Zheng,
    Jingyu Zhang, Nannan Han, Weidong Fang, Yuxi Guo, Jun Di, Pin Song, Yongmin He,
