    # ■ CONCLUSIONS


    In summary, ML has been successfully applied to guide the CVD synthesis of quasi-1D
    few-layered 1T′ WTe₂ NRs. Relevant characterizations have demonstrated the high
    quality of as-grown samples. A high AUROC of 0.93 indicates the excellent performance
    of the well-trained XGBoost model. Feature importance extracted from the model
    suggests that H₂ gas flow rate is the most important feature governing the synthesis
    of 1T′ WTe₂ NRs, while $R_{\mathrm{Te/W}}$ dominates the sample morphology. Optimization
    of synthesis parameters has been performed to achieve both high “Can grow” probability
    and large length–width ratio. Our experimental verifications further support the
    strong correlation between the $R_{\mathrm{Te/W}}$ and the geometric structure
    of WTe₂ NRs. Additionally, a growth mechanism of WTe₂ NRs has been proposed, where
    quasi-1D WTe₂ was found to be evolved from the 2D WTe₂ with the aid of H₂, providing
    new insight into the study of the intriguing tellurides family. Our work, integrating
    ML analysis and experimental results, will shed light on the accelerated development
    of 1D materials and boost the diversified nanostructures derived from 2D TMC family.


    # ■ EXPERIMENTAL METHODS


    **Synthesis of Few-Layered WTe₂ NRs.** A total of 2 mg of powders (Te:W:NaCl =
    16:1:0.1) were mixed by a gate mortar and then placed on the 10 mm × 30 mm Si/SiO₂
    substrate (with a 285 nm oxidation layer). Another 10 mm × 30 mm Si/SiO₂ substrate
    was put on top of the powders with the polished surface down, forming a sandwiched
    structure. They were then transferred into a closed (inner quartz tube (with a
    diameter of 12 mm and length of 300 mm). The (inner) quartz tube was placed in
    the quartz tube (with a diameter of 2 in.) and then positioned at the center of
    the furnace. The quartz tube was cleaned with Ar gas (99.99%) for 20 min before
    heating. After that, the mixed gas of Ar/H₂ (100/40 sccm, respectively) was used
    as the carrier gas. The furnace was heated to 750 °C in 20 min and then kept for
    7 min. Then, the furnace cooled down to room temperature naturally, and the WTe₂
    NRs can be obtained on the substrate.


    **Characterization.** The microstructures and morphology of as-grown WTe₂ were
    characterized by optical microscopy (Olympus BX51), Raman (WITEC Alpha 200R),
    XPS (Kratos Analytical, Manchester), AFM (Asylum Research Cypher S), and STEM
    (JEOL ARM-200F (S)). The STEM characterization was carried out with CEOS CESKOR
    aberration corrector, operated at an accelerating voltage of 80 kV. The EDX mapping
    results were carried out with the TEM. The Raman characterization was carried
    out with a 532 nm laser (the laser power used was less than 1 mW, and the system
    was calibrated with the Raman peak of Si at 520 cm⁻¹). The XPS analysis was performed
    by a Kratos Axis Supra instrument, and the binding


    energy correction for charging was performed by assigning a value of 284.8 eV
    to the adventitious C1 s line.


    # **Feature Importance.** *Shapley Additive exPlanations (SHAP)*


    computes theoretically sound and unique feature importance values, belonging to
    the class of additive feature attribution.⁵¹ The explanation model $g(z′)$ satisfies
    $g(z′)=\phi_0+\sum_{i=1}^{M}\phi_i z_i′$, where $z′\in\{0,1\}^{M}$, $M$ is the
    number of input features, $\phi_i$ denotes the feature importance value, and $\phi_i\in\mathbb{R}$.
    $z_i′=1$ for a feature that is being observed, otherwise 0.


    To compute SHAP values, $f_x(S)=E[f(x)|x_S]$ is defined where $f$ is the ML model
    to be explained, $S$ is the set of nonzero indexes in $v′$, and $E[f(x)|x_S]$
    is the expected value of the function conditioned on the input features of subset
    $S$. The SHAP value is computed for each feature using these conditional expectations:


    $$\phi_i=\sum_{S\subseteq N\setminus\{i\}}\frac{|S|!(M-|S|-1)!}{M!}\left[f_x(S\cup\{i\})-f_x(S)\right]
    \tag{3}$$


    where $N$ is the set of all input features.


    **XGBoost.** XGBoost, derived from Gradient Boosting Decision Tree (GBDT),⁵²,⁵³
    makes a decision with an ensemble of $M$ decision trees as base estimators $f_m$,
    $m=1,\ldots,M$:


    $$\hat{y}_i=\sum_{m=1}^{M}f_m(x_i) \tag{4}$$


    Given $N$ training data $\{(x_i,y_i)\}_{i=1}^{N}$, the objective is to minimize


    $$\operatorname{obj}(\theta)=\sum_{i=1}^{N}l(y_i,\hat{y}_i)+\sum_{m=1}^{M}\Omega(f_m)
    \tag{5}$$


    where $\sum_{i=1}^{N}l(y_i,\hat{y}_i)$ denotes the training loss and $\sum_{m=1}^{M}\Omega(f_m)$
    penalizes complexity of the base estimators. In addition, it adopts an additive
    training strategy that adds one new tree at a time, that optimizes the objective
    at step $t$:


    $$\operatorname{obj}(\theta)^t=\sum_{i=1}^{N}l(y_i,\hat{y}_i)+\sum_{m=1}^{t}\Omega(f_m)
    \tag{6}$$


    whereas


    $$\hat{y}_i^t=\sum_{m=1}^{t}f_m(x_i)=\hat{y}_i^{t-1}+f_t(x_i) \tag{7}$$


