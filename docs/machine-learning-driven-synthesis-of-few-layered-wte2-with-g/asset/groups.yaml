    ## CONCLUSIONS


    In summary, ML has been successfully applied to guide the CVD synthesis of quasi-1D
    few-layered 1T′ WTe₂ NRs. Relevant characterizations have demonstrated the high
    quality of as-grown samples. A high AUROC of 0.93 indicates the excellent performance
    of the well-trained XGBoost model. Feature importance extracted from the model
    suggests that H₂ gas flow rate is the most important feature governing the synthesis
    of 1T′ WTe₂ NRs, while $R_{\mathrm{Te/W}}$ dominates the sample morphology. Optimization
    of synthesis parameters has been performed to achieve both high “Can grow” probability
    and large length–width ratio. Our experimental verifications further support the
    strong correlation between the $R_{\mathrm{Te/W}}$ and the geometric structure
    of WTe₂ NRs. Additionally, a growth mechanism of WTe₂ NRs has been proposed, where
    quasi-1D WTe₂ was found to be evolved from the 2D WTe₂ with the aid of H₂, providing
    new insight into the study of the intriguing tellurides family. Our work, integrating
    ML analysis and experimental results, will shed light on the accelerated development
    of 1D materials and boost the diversified nanostructures derived from 2D TMC family.


    ## EXPERIMENTAL METHODS


    ### Synthesis of Few-Layered WTe₂ NRs


    A total of 2 mg of powders (Te:W:NaCl = 16:1:0.1) were mixed by an agate mortar
    and then placed on the 10 mm × 30 mm Si/SiO₂ substrate (with a 285 nm oxidation
    layer). Another 10 mm × 30 mm Si/SiO₂ substrate was put on top of the powders
    with the polished surface down, forming a sandwiched structure. They were then
    transferred into a closed inner quartz tube (with a diameter of 12 mm and length
    of 300 mm). The inner quartz tube was placed in the quartz tube (with a diameter
    of 2 in.) and then positioned at the center of the furnace. The quartz tube was
    cleaned with Ar gas (99.99%) for 20 min before heating. After that, the mixed
    gas of Ar/H₂ (100/40 sccm, respectively) was used as the carrier gas. The furnace
    was heated to 750 °C in 20 min and then kept for 7 min. Then, the furnace cooled
    down to room temperature naturally, and the WTe₂ NRs can be obtained on the substrate.


    ### Characterization


    The microstructures and morphology of as-grown WTe₂ were characterized by optical
    microscopy (Olympus BX51), Raman (WITEC Alpha 200R), XPS (Kratos Analytical, Manchester),
    AFM (Asylum Research Cypher S), and STEM (JEOL ARM-200F (S)). The STEM characterization
    was carried out with CEOS CESKOR aberration corrector, operated at an accelerating
    voltage of 80 kV. The EDX mapping results were carried out with the TEM. The Raman
    characterization was carried out with a 532 nm laser (the laser power used was
    less than 1 mW, and the system was calibrated with the Raman peak of Si at 520
    cm⁻¹). The XPS analysis was performed by a Kratos Axis Supra instrument, and the
    binding energy correction for charging was performed by assigning a value of 284.8
    eV to the adventitious C1s line.


