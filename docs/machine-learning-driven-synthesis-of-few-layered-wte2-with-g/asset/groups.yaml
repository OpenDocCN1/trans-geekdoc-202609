    ## 摘要：


    将二维材料 2D 的横向尺度减小到一维 1D 不仅引起了人们对实现具有竞争力的电子应用的实质性研究兴趣，也引起了对基础物理性质探索的兴趣。因此，可控合成高质量一维纳米带
    NRs 对于进一步研究而言是高度期望且必不可少的。在此，我们报道了监督式机器学习 ML 用于化学气相沉积 CVD 合成高质量准一维少层 WTe₂ 纳米带的实现。特征重要性分析表明，H₂
    气体流量对 WTe₂ 的形成具有深远影响，而源比例则决定了样品形貌。值得注意的是，还进一步提出了 1T′ 少层 WTe₂ 纳米带的生长机制，这为有趣的二维和一维碲化物的生长提供了新的见解，并可能激发其他一维纳米结构生长策略的灵感。我们的研究结果表明了机器学习在指导一维纳米结构合成方面的有效性和能力，为智能材料开发开辟了新的机遇。


    ![](img/4d2e5a3ed5f52a057a7fba20f726c29c_0_0.png)


    ## 引言


    在过去几十年中，二维 2D 过渡金属硫族化合物 TMCs 在纳电子和自旋电子应用中表现出优异性能，并在研究量子物理和制造量子器件方面显示出巨大潜力。¹⁻⁴
    近年来，由二维 TMCs 衍生的一维 1D 纳米结构受到了越来越多的关注，这归因于由降低的维度性和增强的量子限制效应引起的有趣性质。⁵⁻⁹ 在 TMCs 中，具有丰富结构变化和强自旋轨道耦合的二碲化钨
    WTe₂ 被预测为 II 型 Weyl 半金属和二维拓扑绝缘体，为研究与维度相关的性质提供了理想平台，例如超导性、量子自旋霍尔效应和 Majorana 费米子。³,⁴,¹⁰⁻¹⁶
    尽管化学气相沉积 CVD 已被广泛采用来生长高质量二维材料，但少层 WTe₂ 的可控合成仍然具有挑战性，更不用说维度控制了。这是因为 Te 的反应性较低，Te
    与 W 之间电子负性差较小，以及碲化物稳定性较差。¹⁷⁻²¹ 因此，迫切需要有效识别具有维度可调性的 WTe₂ 的最佳合成条件。机器学习 ML 近年来在材料研究中展现出强大的能力。²²⁻²⁸
    它已成功应用于加速新型材料的设计和发现，包括催化材料，²⁴ 无机-有机杂化材料，²⁸,²⁹ 热电材料，³⁰ 超硬材料，³¹ 低维材料，²⁶,²⁷,³² 相变存储材料，²⁵
    有机光伏材料，³³ 等等，通过有效学习过去甚至失败的数据。³⁴⁻³⁸ 例如，Zhong 等人²⁴ 报道了 Cu−Al 电催化剂的发现，结合了密度泛函理论计算和主动机器学习，可高效将
    CO₂ 还原为乙烯，具有迄今为止报道的最高法拉第效率。在材料发现之上，新型材料的成功合成对其未来应用至关重要，而传统实验室探索通常需要付出大量努力。²³,²⁷,³⁹
    因此，值得探索将机器学习引入先进材料的有指导合成甚至结构工程的可行性和潜力，以加快探索过程并降低成本。


    在这项工作中，我们对少层 1T′ WTe₂ 的 CVD 合成实施了监督式机器学习，其范式在图 1 中示意性描绘。⁴⁰ 为了优化合成条件，实验收集了 CVD
    合成数据来训练机器学习模型。训练良好的模型能够


