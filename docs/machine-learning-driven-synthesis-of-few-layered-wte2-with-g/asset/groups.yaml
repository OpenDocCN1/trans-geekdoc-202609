    优化 CVD 合成参数以实现少层 1T′ WTe2 的可控生长。从训练好的模型中进一步提取了特征重要性等信息，为 WTe2 的合成和形貌控制提供了新的见解。根据机器学习的建议，特别研究了源比例
    RTe/W 对样品形貌的影响，最终获得了少层 1T′ 准一维 WTe2 纳米带 NRs。此外，还提出了 1D WTe2 纳米带的生长机制，该机制表明 H2
