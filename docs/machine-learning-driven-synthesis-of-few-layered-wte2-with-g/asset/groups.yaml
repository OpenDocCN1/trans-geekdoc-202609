    ## 结果与讨论


    ### 通过机器学习优化 CVD 合成参数。


    空间受限 CVD 方法已被采用来合成 WTe2 纳米带，对应的装置如图 2A 所示。经验上，确定了五个显著的输入特征 CVD 参数：源比例 RTe/W，碲粉与钨粉的摩尔比，反应温度
    T，摄氏度，升温时间 tR，分钟，沉积时间 tD，分钟，和 H2 气体流量 fH2，sccm。实验室共进行了 255 次实验，采用不同的生长参数组合。详细的特征概览见表
    S1。在这些实验中，WTe2 在 141 次实验中成功合成，而其余 114 次实验显示为负结果 无 WTe2 可观察到 ，由光学显微镜和拉曼光谱鉴定。因此开发了二分类模型，将“可生长”定义为正类，将“不可生长”定义为负类。XGBoost
    是一种优化的梯度提升算法，可通过决策树的集成拟合复杂关系。此外，它还能正则化模型的复杂度以避免过拟合，因此适用于小数据集。在本研究中，已应用 XGBoost
    结合 10 折嵌套交叉验证，如我们在之前的工作中报道的那样 23,27 见实验方法及支持信息附注 1 和 2 以及图 S1–S3。所选模型的优异性能已通过绘制接收器操作特征
    ROC 曲线得到证明，如图 2B 所示。ROC 曲线下面积 AUROC 通常用于评估模型在不同决策阈值下成功区分两个类别的能力。AUROC 为 1.0 表示完美区分，而
    0.5 的面积 表示虚线 等同于随机猜测。如图所示，我们训练的模型具有高达 0.93 的 AUROC，表明其在区分训练模型的“可生长”与“不可生长”类别方面具有很强的判别能力。


    为了深入了解 CVD 生长的 WTe2 系统，已从训练好的 XGBoost 模型中提取了特征重要性，结果如图 2C 所示 见实验方法中的细节。如图所示，影响
