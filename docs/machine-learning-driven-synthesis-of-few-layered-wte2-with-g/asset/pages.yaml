    # Growth Mechanism Governing the Geometrical Transformation from 2D to 1D.


    Understanding the growth mechanism of tellurides is key to the controllable synthesis
    of high-quality tellurides and may inspire the growth strategies for other 1D
    nanostructures. Considering the high melting point and low reactivity of W, the
    mixed powder of NaCl/Te/W is adopted as the precursor and placed into the confined
    space (inner tube) for the growth of few-layered WTe₂ NRs under H₂ atmosphere.
    Notably, the confined space, salt, H₂, and mixture of Te/W/NaCl are indispensable
    for the synthesis of WTe₂ NRs, as demonstrated in Supporting Information Note
    4, Figures S8 and S14, and Table S6. Conventionally, the deposition time of only
    a few minutes is required for the CVD synthesis of monolayer or few-layered TMCs
    as the synthesis process is quite fast.¹⁰,¹⁷–¹⁹ In order to clearly observe the
    morphological evolution, the mild synthesis conditions with high P from the ML
    results but moderate temperature and H₂ gas flow rate (see Figure 2E and Table
    S4) have been chosen to slow down the reaction rate and investigate the growth
    mechanism of WTe₂ NRs. The detailed parameters are as follows: H₂ gas flow rate
    of 30 sccm, reaction temperature of 650 °C, ramp time of 18 min, source ratio
    of 16, and reaction time of 5 min. Here, the reaction time of H₂ is the only variable
    studied. Three controlled experiments have been carried out:


    (i) H₂ gas was introduced into the system only when the temperature reaches 650
    °C and turned off after 5 min. (ii) H₂ gas was introduced at room temperature
    and turned off after a 5 min deposition at 650 °C. (iii) H₂ gas was kept throughout
    the whole process. The corresponding optical images of as-synthesized few-layered
    WTe₂ are shown in Figures S15 and S16. The morphological evolution from 2D to
    1D can be cleared observed. Based on the experimental results, the growth model
    of WTe₂ NRs has been further proposed (Figure 5A–C). The synthesis of WTe₂ NRs
    could be divided into three stages: the formation of 2D WTe₂, H₂ etching of 2D
    WTe₂, and the formation of WTe₂ NRs, as well as the ripening regrowth of WTe₂
    NRs.


    The following reaction mechanism is proposed to explain the formation of WTe₂
    with the Te/W/NaCl mixed powder under the Ar/H₂ atmospheric pressure (Figure 5A).⁴³,⁴⁴
    Te(l) + H₂(g) ↔ H₂Te(g) (1) W(s) + H₂Te(g) ↔ WTe₂(s) + H₂(g) (2)


    The Gibbs free energy (G) of the proposed conversion reaction has been calculated
    to investigate the role played by H₂Te in reducing the barrier height (Figure
    5E, Figure S17, Table S7, and Supporting Information Note 5). As calculated, with
    the aid of H₂, the energy required to synthesize WTe₂ from W and the intermediate
    product H₂Te is ~135 kJ/mol less than the direct reaction between W and Te. Moreover,
    considering the negative ΔG value, the formation of WTe₂ by W and H₂Te is thermodynamically
    more favorable. Similar findings were also found for the synthesis of MoTe₂ NRs
    with and without H₂ (Figure S18). In this regard, H₂Te serves as an efficient
    Te carrier as well as a catalyst. Under the Te-rich condition, the H₂ obtained
    in Reaction 2 could then react to form H₂Te (Reaction 1), ensuring the continuous
    tellurization process. Liquid W in the W–Te system then reacts with H₂Te to form
    the layered WTe₂. Both reactions are reversible, and the direction depends on
    the concentration of the source and the reaction temperature. Therefore, the synthesis
    and decomposition of WTe₂ can occur simultaneously.


    In the first stage, the growth process is much faster than the decomposition of
    WTe₂ owing to the sufficient source supply, and WTe₂ can be quickly synthesized.
    As the chemical reaction proceeds, the growth rate drops due to the reduced source
    concentration, and the H₂ etching of layered WTe₂ becomes significant. Previous
    works have also reported that excessive H₂ can decompose TMCs at high temperature.⁴⁵,⁴⁶
    The etching will prefer the [100] direction of 1T′ WTe₂ structure due to the different
    bond lengths of W–Te (Figure 5D), which is conducive to the formation of NR structures
    (Figure 5B). The surface energies of the (100) and (010) facets of 1T′ WTe₂ are
    calculated to be 0.0315 and 0.0158 eV/Å², respectively, according to density functional
    theory (DFT) calculations. The higher energy of the (100) facet than that of (010)
    indicates that the [100] direction is the preferred growth direction for 1T′ WTe₂
    NRs (Figure 5F and Supporting Information Note 6). For the 2D layered WTe₂, etching
    always occurs at the two ends of 1T′ WTe₂ (Figure S19), and thus the prototype
    of NR structures can be established. In the third stage, H₂ etching and ripening
    occur concurrently (Figure 5C). The wide WTe₂ can be etched into W and H₂Te, and
    W then migrates into the liquid Te. Tiny crystal nuclei can grow at the two ends
    of the 1T′ WTe₂, and larger NRs will grow at the'
