    # RESULTS AND DISCUSSION


    # Optimization of CVD Synthesis Parameters by ML.


    The space-confined CVD method has been adopted to synthesize WTe2 NRs, and the
    corresponding setup is illustrated in Figure 2A. Empirically, five CVD parameters
    were identified as significant input features: source ratio (RTe/W), the molar
    ratio of tellurium power and tungsten power), reaction temperature (T, in °C),
    ramp time (tR, in min), deposition time (tD, in min), and H2 gas flow rate (fH2,
    sccm). A total of 255 experiments were carried out in the lab with different combinations
    of growth parameters. The detailed feature overview is shown in Table S1. Among
    these experiments, WTe2 were successfully synthesized in 141 experiments, whereas
    the remaining 114 experiments showed the negative result (no WTe2 can be observed),
    as identified by the optical microscopy and Raman spectroscopy. A binary classification
    model was thus developed by defining “Can grow” as a positive class and “Cannot
    grow” as a negative class. XGBoost is an optimized gradient boosting algorithm
    that can fit complicated relationships through the ensemble of decision trees.
    In addition, it regularizes the complexity of the model to avoid overfitting and
    thus makes it suitable for small data sets. In this study, XGBoost together with
    10-fold nested cross-validation has been applied, as reported in our previous
    work23,27 (see more details in Experimental Methods and


    Supporting Information Notes 1 and 2 and Figures S1–S3). The excellent performance
    of the as-selected model has been demonstrated through plotting the receiver operating
    characteristic (ROC) curve, as shown in Figure 2B. The area under the ROC (AUROC)
    is commonly used to evaluate the ability of the model to successfully differentiate
    between two classes given different decision thresholds. AUROC of 1.0 represents
    perfect differentiation, whereas an area of 0.5 (indicated by the dashed line)
    is equivalent to a random guess. As displayed, our trained model possesses a high
    AUROC of 0.93, indicating great discriminating capability between “Can grow” and
    “Cannot grow” classes of the trained model.


    To gain further insight into the system of CVD-grown WTe2, feature importance
    has been extracted from the trained XGBoost model, with the result shown in Figure
    2C (see details in Experimental Methods). As indicated, the H2 gas flow rate (fH2)
    is the most important feature affecting the synthesis of WTe2, followed by the
    reaction temperature (T) and ramp time (tR), whereas the source ratio (RTe/W)
    is the least significant one. Due to the difficulty of achieving a controllable
    synthesis of the intriguing few-layered WTe2, optimization of the synthesis condition
    has been carried out.27 Based on the input ranges of each feature (Table S2),
    respective “Can grow” probabilities (P) of the resulted 720 720 combinations have
    been predicted by the trained ML model. The correlation of the output with each
    feature has been individually examined, as presented in Figure 2D. It can be clearly
    observed that the values of H2 gas flow rate, reaction temperature, and ramp time
    have the dominant effect on the distribution of P. This is consistent with the
    feature importance result discussed above (Figure 2C). Among all the 720 720 synthesis
    conditions, 8 combinations with the highest P have been chosen for experimental
    verification. Table S3 summarizes the corresponding experimental results, which
    are all positive. This suggests that the controllable synthesis of few-layered
    WTe2 can be realized with our trained ML model.


