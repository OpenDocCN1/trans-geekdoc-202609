    Gin is a high-performance HTTP web framework for Go, which simplifies building
    web applications:


    \`\`\`go


    package main


    import (


    "net/http"


    "github.com/gin-gonic/gin"


    )


    func main() {


    router := gin.Default()


    router.GET("/ping", func(c \*gin.Context) {


    c.JSON(http.StatusOK, gin.H{


    "message": "pong",


    })


    router.Run(":8080")


    }


    \`\`\`


    In this example, we create a simple web server with a single endpoint that responds
    with a JSON message. Gin’s simplicity and performance make it a popular choice
    for building web applications in Go.


    Example: Working with Databases using GORM


    GORM is a powerful ORM library for Go, making it easier to interact with databases:


    \`\`\`go


    package main


    import (


    "github.com/jinzhu/gorm"


    \_ "github.com/jinzhu/gorm/dialects/sqlite"


    "log"


    )


    type User struct {


    gorm.Model


    Name  string


    Email string


    }


    func main() {


    db, err := gorm.Open("sqlite3", "test.db")


    if err != nil {


    log.Fatal("failed to connect database")


    }


    defer db.Close()


    db.AutoMigrate(&User{})


    user := User{Name: "John Doe", Email: "john@example.com"}


    db.Create(&user)


    }


