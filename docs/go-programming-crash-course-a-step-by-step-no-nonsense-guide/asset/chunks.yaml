- raw: 'Concurrency is the ability of a program to perform multiple tasks simultaneously,
    allowing it to utilize available resources efficiently and improve overall performance.
    In Go, concurrency is a first-class citizen, with built-in support for goroutines,
    channels, and the \`go\` keyword, making it easy to write concurrent programs.
    In this guide, we''ll explore how to leverage concurrency in Go to build applications
    that can do multiple things at once, along with code examples demonstrating various
    concurrency patterns and best practices.


    Goroutines


    Goroutines are lightweight threads of execution in Go that allow functions to
    run concurrently. You can start a new goroutine by prefixing a function call with
    the \`go\` keyword.


    \`\`\`go


    package main


    import (


    "fmt"


    "time"


    )


    func sayHello() {


    fmt.Println("Hello")


    }


    func main() {


    // Start a new goroutine


    go sayHello()


    // Wait for a short duration to allow the goroutine to execute


    time.Sleep(time.Millisecond)


    fmt.Println("Main function")


    }


    \`\`\`


    Channels


    Channels are a powerful concurrency primitive in Go that allow goroutines to communicate
    with each other and synchronize their execution. Channels can be used to send
    and receive data between goroutines.


    \`\`\`go


    package main


    import (


    "fmt"


    "time"


    )


    func sender(ch chan<- string) {


    ch <- "Hello from sender"


    }


    func receiver(ch <-chan string) {


    fmt.Println(<-ch)


    }


    func main() {


    // Create a new channel


    ch := make(chan string)


    // Start sender and receiver goroutines


    go sender(ch)


    go receiver(ch)


    // Wait for a short duration to allow the goroutines to execute


    time.Sleep(time.Millisecond)


    }


    \`\`\`


    Buffered Channels


    Buffered channels allow multiple values to be sent without requiring the sender
    and receiver to be synchronized immediately.


    \`\`\`go


    package main


    import (


    "fmt"


    "time"


    )


    func main() {


    // Create a buffered channel with a capacity of 3


    ch := make(chan int, 3)


    // Start a goroutine to send values to the channel


    go func() {


    for i := 1; i <= 3; i++ {


    ch <- i


    fmt.Println("Sent:", i)


    time.Sleep(time.Second)


    }


    close(ch)


    }()


    // Receive values from the channel


    for num := range ch {


    fmt.Println("Received:", num)


    }


    \`\`\`


    Select Statement


    The \`select\` statement allows you to wait on multiple channel operations simultaneously,
    making it useful for coordinating multiple goroutines.


    \`\`\`go


    package main


    import (


    "fmt"


    "time"


    )


    func worker1(ch chan<- string) {


    time.Sleep(2 \* time.Second)


    ch <- "Worker 1"


    }


    func worker2(ch chan<- string) {


    time.Sleep(1 \* time.Second)


    ch <- "Worker 2"


    }


    func main() {


    ch1 := make(chan string)


    ch2 := make(chan string)


    go worker1(ch1)


    go worker2(ch2)


    select {


    case result := <-ch1:


    fmt.Println("Received from Worker 1:", result)


    case result := <-ch2:


    fmt.Println("Received from Worker 2:", result)


    }


    \`\`\`


    WaitGroups


    The \`sync\` package provides the \`WaitGroup\` type, which allows you to wait
    for multiple goroutines to finish before continuing execution.


    \`\`\`go


    package main


    import (


    "fmt"


    "sync"


    "time"


    )


    func worker(id int, wg \*sync.WaitGroup) {


    defer wg.Done()


    fmt.Printf("Worker %d starting\\n", id)


    time.Sleep(time.Second)


    fmt.Printf("Worker %d done\\n", id)


    }


    func main() {


    var wg sync.WaitGroup


    for i := 1; i <= 3; i++ {


    wg.Add(1)


    go worker(i, &wg)


    }


    wg.Wait()


    fmt.Println("All workers done")


    }


    \`\`\`


    Mutexes


    Mutexes (mutual exclusion locks) are used to synchronize access to shared resources
    in concurrent programs, preventing data races.


    \`\`\`go


    package main


    import (


    "fmt"


    "sync"


    "time"


    )


    var counter int


    var mu sync.Mutex


    func increment() {


    mu.Lock()


    defer mu.Unlock()


    counter++


    }


    func main() {


    for i := 0; i < 1000; i++ {


    go increment()


    }


    time.Sleep(time.Second)


    fmt.Println("Counter:", counter)


    }


    \`\`\`


    Concurrency in Go enables developers to write efficient and scalable programs
    that can perform multiple tasks simultaneously. By leveraging goroutines, channels,
    select statements, wait groups, mutexes, and other concurrency primitives, you
    can build high-performance applications that make optimal use of available resources.
    Experiment with different concurrency patterns and techniques to find the approach
    that best fits your application''s requirements. Remember to handle errors and
    synchronization carefully to avoid race conditions and other concurrency-related
    issues. Happy coding!


    Chapter 13


    Testing Your Code: Writing Unit Tests for Reliability


    Why Testing Matters: Ensuring Your Code Works as Expected in Go


    Testing is a crucial aspect of software development that ensures your code behaves
    as expected under various conditions and scenarios. It helps identify bugs, prevent
    regressions, and maintain the reliability and quality of your codebase. In Go,
    testing is straightforward and built-in, thanks to the \`testing\` package and
    the \`go test\` command. In this guide, we''ll explore why testing matters in
    Go, along with code examples demonstrating how to write and run tests effectively.


    Importance of Testing


    Testing plays a vital role in software development for several reasons:


    1\. Bug Detection: Testing helps identify bugs and defects in the code early in
    the development process, making it easier and less costly to fix them.


    2\. Regression Prevention: Tests ensure that new changes or features added to
    the codebase do not inadvertently break existing functionality, preventing regressions.


    3\. Code Confidence: Writing tests provides confidence that the code behaves as
    expected and meets the requirements specified in the design.


    4\. Documentation: Tests serve as executable documentation, describing the expected
    behavior of the code and providing examples of its usage.


    Writing Tests in Go


    In Go, tests are written using the \`testing\` package, and test functions are
    named with a \`Test\` prefix followed by the name of the function being tested.


    \`\`\`go


    package main


    import (


    "testing"


    )


    func Add(x, y int) int {


    return x + y


    }


    func TestAdd(t \*testing.T) {


    result := Add(2, 3)


    expected := 5


    if result != expected {


    t.Errorf("Add(2, 3) = %d; expected %d", result, expected)


