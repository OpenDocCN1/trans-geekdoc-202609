- raw: 'A \`defer\` statement in Go schedules a function call to be run after the
    function completes. Regardless of how the function exits—whether through a return
    statement, an error, or even a panic—the deferred function will always execute.
    This makes \`defer\` a valuable tool for managing resources and ensuring that
    cleanup tasks are reliably performed.


    Syntax:


    \`\`\`go


    defer functionCall()


    \`\`\`


    Here''s a basic example to illustrate the usage of \`defer\`:


    \`\`\`go


    package main


    import "fmt"


    func main() {


    fmt.Println("Start")


    defer fmt.Println("End")


    fmt.Println("Middle")


    }


    \`\`\`


    Output:


    \`\`\`


    Start


    Middle


    End


    \`\`\`


    In this example, the \`defer\` statement ensures that "End" is printed after "Middle"
    and just before the function \`main\` completes.


    Use Cases for \`defer\`


    1\. Closing Files


    When working with files, it''s essential to ensure that files are closed properly
    after opening them to prevent resource leaks.


    Example:


    \`\`\`go


    package main


    import (


    "fmt"


    "os"


    )


    func main() {


    file, err := os.Open("example.txt")


    if err != nil {


    fmt.Println("Error opening file:", err)


    return


    }


    defer file.Close()


    // Perform file operations


    // ...


    fmt.Println("File operations completed")


    }


    \`\`\`


    In this example, \`file.Close()\` is deferred, ensuring that the file is closed
    when \`main\` completes, regardless of whether an error occurs during file operations.


    2\. Releasing Locks


    When dealing with concurrent programming, it''s crucial to release locks to avoid
    deadlocks.


    Example:


    \`\`\`go


    package main


    import (


    "fmt"


    "sync"


    )


    func main() {


    var mu sync.Mutex


    mu.Lock()


    defer mu.Unlock()


    // Perform operations that require the lock


    // ...


    fmt.Println("Operations with lock completed")


    }


    \`\`\`


    In this example, \`mu.Unlock()\` is deferred to ensure that the mutex is unlocked
    when \`main\` completes, preventing potential deadlocks.


    3\. Closing Database Connections


    Ensuring that database connections are properly closed is vital for maintaining
    the health and performance of your applications.


    Example:


    \`\`\`go


    package main


    import (


    "database/sql"


    "fmt"


    \_ "github.com/go-sql-driver/mysql"


    )


    func main() {


    db, err := sql.Open("mysql", "user:password@/dbname")


    if err != nil {


    fmt.Println("Error connecting to database:", err)


    return


    }


    defer db.Close()


    // Perform database operations


    // ...


    fmt.Println("Database operations completed")


    }


    \`\`\`


    In this example, \`db.Close()\` is deferred to ensure that the database connection
    is closed when \`main\` completes, regardless of whether an error occurs during
    database operations.


    Multiple Deferred Calls


    If multiple \`defer\` statements are present, they are executed in a last-in,
    first-out (LIFO) order. This means the last \`defer\` statement added is the first
    one to be executed when the function exits.


    Example:


    \`\`\`go


    package main


    import "fmt"


    func main() {


    defer fmt.Println("First")


    defer fmt.Println("Second")


    defer fmt.Println("Third")


    fmt.Println("Main function")


    }


    \`\`\`


    Output:


    \`\`\`


    Main function


    Third


    Second


    First


    \`\`\`


    In this example, the deferred calls are executed in reverse order, demonstrating
    the LIFO execution order of deferred statements.


    Practical Applications of \`defer\`


    1\. Handling Panics


    \`Defer\` can be used in conjunction with \`recover\` to handle panics gracefully
    and ensure that cleanup code is executed.


    Example:


    \`\`\`go


    package main


    import "fmt"


    func main() {


    defer func() {


    if r := recover(); r != nil {


    fmt.Println("Recovered from panic:", r)       


    }()


    fmt.Println("Start")


    panic("Something went wrong")


    fmt.Println("End") // This line will not be executed


    }


    \`\`\`


    In this example, the deferred anonymous function recovers from the panic and prints
    a recovery message, ensuring that the program does not crash abruptly.


    2\. Timing Functions


    \`defer\` can be used to measure the execution time of functions, which is useful
    for performance monitoring and optimization.


    Example:


    \`\`\`go


    package main


    import (


    "fmt"


    "time"


    )


    func main() {


    start := time.Now()


    defer func() {


    elapsed := time.Since(start)


    fmt.Printf("Function executed in %s\\n", elapsed)


    }()


    // Simulate a long-running process


    time.Sleep(2 \* time.Second)


    fmt.Println("Long-running process completed")


    }


    \`\`\`


    In this example, the deferred function calculates and prints the execution time
    of the \`main\` function, providing valuable performance insights.


    Combining \`defer\` with Error Handling


    In Go, error handling is explicit and must be done manually. Combining \`defer\`
    with error handling ensures that resources are cleaned up even when errors occur.


    Example:


    \`\`\`go


    package main


    import (


    "fmt"


    "os"


    )


    func main() {


    file, err := os.Open("example.txt")


    if err != nil {


    fmt.Println("Error opening file:", err)


    return


    }


    defer file.Close()


    // Simulate an error during file operations


    err = performFileOperations(file)


    if err != nil {


    fmt.Println("Error during file operations:", err)


    return


    }


    fmt.Println("File operations completed successfully")


    }


    func performFileOperations(file \*os.File) error {


    // Perform file operations


    // ...


    return fmt.Errorf("simulated error")


    }


    \`\`\`


    In this example, even if an error occurs during \`performFileOperations\`, \`file.Close()\`
    is guaranteed to run, ensuring proper cleanup.


    Best Practices for Using \`defer\`


    1\. Minimal Defer Statements: Use \`defer\` sparingly and only when necessary,
    as excessive use can lead to complex and hard-to-read code.


    2\. Clear Intent: Ensure the purpose of each \`defer\` statement is clear and
    well-documented to maintain code readability and maintainability.


    3\. Performance Considerations: Be mindful of the performance overhead of \`defer\`,
    especially in performance-critical sections of your code. While \`defer\` is generally
    efficient, it can introduce slight overhead.


    The \`defer\` statement in Go is a powerful feature that ensures the graceful
    cleanup of resources, contributing to robust and maintainable code. By deferring
    function calls until the surrounding function completes, developers can guarantee
    that necessary cleanup tasks—such as closing files, releasing locks, and handling
    errors—are performed reliably.


    Understanding and effectively using \`defer\` allows for more readable, maintainable,
    and efficient Go programs. Whether managing file operations, handling database
    connections, or ensuring proper cleanup in the face of errors or panics, \`defer\`
    provides a simple yet powerful tool to ensure the correct execution order of critical
    tasks.


    By integrating \`defer\` into your Go programming practices, you can enhance the
    robustness and reliability of your applications, making them easier to maintain
    and less prone to resource leaks and other common pitfalls.


