    \ `uint32`, `uint64`\n- Floating-Point Numbers: `float32`, `float64`\n- Complex\
    \ Numbers: `complex64`, `complex128`\n- Boolean: `bool`\n- Strings: `string`\n\
    \n## 2. Derived Types\n- Arrays\n- Slices\n- Structs\n- Pointers\n- Functions\n\
    - Maps\n- Channels\n\n### Integer Types\nIntegers in Go come in signed and unsigned\
    \ variants, with various bit sizes. The default integer type is `int`, which is\
    \ usually 32 or 64 bits depending on the system.\n\n```go\nvar a int = 10\nvar\
    \ b uint = 20\nvar c int8 = -128\n```\n\n### Floating-Point Types\nFloating-point\
    \ numbers represent real numbers and have two types: `float32` and `float64`.\n\
    \n```go\nvar x float32 = 3.14\nvar y float64 = 2.718281828\n```\n\n### Boolean\
    \ Type\nBoolean variables hold `true` or `false` values.\n\n```go\nvar isActive\
    \ bool = true\nvar isLoggedIn bool = false\n```\n\n### String Type\nStrings are\
    \ sequences of characters.\n\n```go\nvar greeting string = \"Hello, Go!\"\n```\n\
    \n### Complex Data Types\nGo also supports complex data structures like arrays,\
    \ slices, structs, maps, and channels.\n\n#### Arrays\nArrays are fixed-size sequences\
    \ of elements of a single type.\n\n```go\nvar arr [5]int = [5]int{1, 2, 3, 4,\
    \ 5}\nfmt.Println(arr)\n```\n\n#### Slices\nSlices are more flexible than arrays,\
    \ providing dynamically-sized views into arrays.\n\n```go\nvar slice []int = []int{1,\
    \ 2, 3, 4, 5}\nfmt.Println(slice)\n```\nSlices can grow and shrink dynamically,\
    \ making them more useful for most applications than arrays.\n\n#### Structs\n\
    Structs are collections of fields. They are used to group data together.\n\n```go\n\
    type Person struct {\n    Name string\n    Age  int\n}\nvar person = Person{Name:\
    \ \"Alice\", Age: 30}\nfmt.Println(person)\n```\n\n#### Maps\nMaps are key-value\
    \ pairs, where keys are unique and are used to retrieve values.\n\n```go\nvar\
    \ m map[string]int = map[string]int{\"Alice\": 30, \"Bob\": 25}\nfmt.Println(m)\n\
    ```\n\n#### Channels\nChannels are used for communication between goroutines.\n\
    \n```go\nch := make(chan int)\ngo func() {\n    ch <- 42\n}()\nval := <- ch\n\
    fmt.Println(val)\n```\n\n### Example Program: Using Different Data Types\nLet's\
    \ create a program that utilizes various data types:\n\n```go\npackage main\n\
    import \"fmt\"\n\ntype Person struct {\n    Name string\n    Age  int\n}\n\nfunc\
    \ main() {\n    // Basic types\n    var name string = \"Alice\"\n    age := 30\n\
    \    height := 5.7\n    isActive := true\n\n    // Array\n    scores := [3]int{90,\
    \ 85, 88}\n\n    // Slice\n    hobbies := []string{\"reading\", \"travelling\"\
    , \"coding\"}\n\n    // Map\n    salary := map[string]float64{\"Alice\": 50000,\
    \ \"Bob\": 60000}\n\n    // Struct\n    person := Person{Name: name, Age: age}\n\
    \    fmt.Println(\"Name:\", name)\n    fmt.Println(\"Age:\", age)\n    fmt.Println(\"\
    Height:\", height)\n    fmt.Println(\"Active:\", isActive)\n    fmt.Println(\"\
    Scores:\", scores)\n    fmt.Println(\"Hobbies:\", hobbies)\n    fmt.Println(\"\
    Salary:\", salary)\n    fmt.Println(\"Person:\", person)\n\n    // Channel example\n\
    \    ch := make(chan int)\n    go func() {\n        ch <- 42\n    }()\n    val\
    \ := <-ch\n    fmt.Println(\"Value from channel:\", val)\n}\n```\n\nOutput:\n\
    ```\nName: Alice\nAge: 30\nHeight: 5.7\nActive: true\nScores: [90 85 88]\nHobbies:\
    \ [reading travelling coding]\nSalary: map[Alice:50000 Bob:60000]\nPerson: {Alice\
    \ 30}\nValue from channel: 42\n```\n\nUnderstanding variables and data types is\
    \ crucial for writing efficient and bug-free programs in Go. By mastering these\
    \ concepts, you can store and manage information, leading to more robust and maintainable\
    \ code. This crash course has covered the basics and provided practical examples\
    \ to get started on your journey to becoming a Go pro. Happy coding!\n\n## Operators\
    \ in Action: Performing Calculations and Manipulating Data\nOperators are essential\
    \ in any language for performing calculations, manipulating data, and controlling\
    \ the flow of execution. In Go, operators are used to perform operations on variables\
    \ and values. This guide provides an in-depth look at operators in Go, along with\
    \ practical examples.\n\n### Types of Operators in Go\nGo supports types of operators:\n\
    1. Arithmetic Operators\n2. Relational Operators\n3. Logical Operators\n4. Bitwise\
    \ Operators\n5. Assignment Operators\n6. Miscellaneous Operators\n\n### Arithmetic\
    \ Operators\nArithmetic operators are used to perform basic mathematical operations.\n\
    - `+` (Addition)\n- `-` (Subtraction)\n- `*` (Multiplication)\n- `/` (Division)\n\
    - `%` (Modulus)\n\nExample: Arithmetic Operations:\n```go\npackage main\nimport\
    \ \"fmt\"\nfunc main() {\n    a := 10\n    b := 3\n    fmt.Println(\"Addition:\"\
    , a + b) // 13\n    fmt.Println(\"Subtraction:\", a - b) // 7\n    fmt.Println(\"\
    Multiplication:\", a * b) // 30\n    fmt.Println(\"Division:\", a / b) // 3\n\
    \    fmt.Println(\"Modulus:\", a % b) // 1\n}\n```\n\n### Relational Operators\n\
    Relational operators are used to compare two values. They return a boolean `true`\
    \ or `false`.\n- `==` (Equal to)\n- `!=` (Not equal to)\n- `>` (Greater than)\n\
    - `<` (Less than)\n- `>=` (Greater than or equal to)\n- `<=` (Less than or equal\
    \ to)\n\nExample: Relational Operations\n```go\npackage main\nimport \"fmt\"\n\
    func main() {\n    a := 10\n    b := 3\n    fmt.Println(\"Equal to:\", a == b)\
    \ // false\n    fmt.Println(\"Not equal to:\", a != b) // true\n    fmt.Println(\"\
    Greater than:\", a > b) // true\n    fmt.Println(\"Less than:\", a < b) // false\n\
    \    fmt.Println(\"Greater than or equal to:\", a >= b) // true\n    fmt.Println(\"\
    Less than or equal to:\", a <= b) // false\n}\n```\n\n### Logical Operators\n\
    Logical operators are used to combine multiple conditions.\n- `&&` (Logical AND)\n\
    - `||` (Logical OR)\n- `!` (Logical NOT)\n\nExample: Logical Operations\n```go\n\
    package main\nimport \"fmt\"\nfunc main() {\n    a := true\n    b := false\n \
    \   fmt.Println(\"Logical AND:\", a && b) // false\n    fmt.Println(\"Logical\
    \ OR:\", a || b) // true\n    fmt.Println(\"Logical NOT:\", !a) // false\n}\n\
    ```\n\n### Bitwise Operators\nBitwise operators perform bit-level operations.\n\
    - `&` (AND)\n- `|` (OR)\n- `^` (XOR)\n- `<<` (Left shift)\n- `>>` (Right shift)\n\
    \nExample: Bitwise Operations\n```go\npackage main\nimport \"fmt\"\nfunc main()\
    \ {\n    a := 10  // 1010 in binary\n    b := 3  // 0011 in binary\n    fmt.Println(\"\
    Bitwise AND:\", a & b) // 2 (0010 in binary)\n    fmt.Println(\"Bitwise OR:\"\
    , a | b) // 11 (1011 in binary)\n    fmt.Println(\"Bitwise XOR:\", a ^ b) // 9\
    \ (1001 in binary)\n    fmt.Println(\"Left shift:\", a << 1) // 20 (10100 in binary)\n\
    \    fmt.Println(\"Right shift:\", a >> 1) // 5 (101 in binary)\n}\n```\n\n###\
    \ Assignment Operators\nAssignment operators are used to assign values to variables.\
    \ They can combine assignment with another operation.\n- `=` (Assign)\n- `+=`\
    \ (Add and assign)\n- `-=` (Subtract and assign)\n- `*=` (Multiply and assign)\n\
    - `/=` (Divide and assign)\n- `%=` (Modulus and assign)\n- `&=` (Bitwise AND and\
    \ assign)\n- `|=` (Bitwise OR and assign)\n- `^=` (Bitwise XOR and assign)\n-\
    \ `<<=` (Left shift and assign)\n- `>>=` (Right shift and assign)\n\nExample:\
    \ Assignment Operations\n```go\npackage main\nimport \"fmt\"\nfunc main() {\n\
    \    a := 10\n    a += 5\n    fmt.Println(\"Add and assign:\", a) // 15\n    a\
    \ -= 3\n    fmt.Println(\"Subtract and assign:\", a) // 12\n    a *= 2\n    fmt.Println(\"\
    Multiply and assign:\", a) // 24\n    a /= 4\n    fmt.Println(\"Divide and assign:\"\
    , a) // 6\n    a %= 3\n    fmt.Println(\"Modulus and assign:\", a) // 0\n    a\
    \ = 10\n    a &= 3\n    fmt.Println(\"Bitwise AND and assign:\", a) // 2\n   \
    \ a |= 5\n    fmt.Println(\"Bitwise OR and assign:\", a) // 7\n    a ^= 3\n  \
    \  fmt.Println(\"Bitwise XOR and assign:\", a) // 4\n    a <<= 1\n    fmt.Println(\"\
    Left shift and assign:\", a) // 8\n    a >>= 2\n    fmt.Println(\"Right shift\
    \ and assign:\", a) // 2\n}\n```\n\n### Miscellaneous Operators\nGo also includes\
    \ some miscellaneous operators for specific tasks.\n"
