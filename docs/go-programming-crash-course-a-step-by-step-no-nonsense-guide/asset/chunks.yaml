    Building a Simple Menu-Driven Application in Go


    Creating menu-driven applications is a common task in software development, especially
    for command-line interfaces. Go provides the necessary tools and libraries to
    build such applications efficiently. In this guide, we''ll walk through the process
    of building a simple menu-driven application in Go, covering the implementation
    of menus, user input handling, and executing actions based on user selections,
    along with code examples.


    Designing the Menu Structure


    Before diving into the code, it''s essential to design the structure of our menu-driven
    application. We''ll start with a simple menu that allows users to perform basic
    operations.


    1\. Display menu options


    2\. Prompt the user to select an option


    3\. Execute the corresponding action based on the user''s selection


    4\. Repeat the process until the user chooses to exit


    Implementing the Menu


    Let''s start by implementing the menu structure and displaying the menu options
    to the user.


    \`\`\`go


    package main


    import (


    "fmt"


    )


    func displayMenu() {


    fmt.Println("Welcome to the Simple Menu App")


    fmt.Println("1. Option 1")


    fmt.Println("2. Option 2")


    fmt.Println("3. Option 3")


    fmt.Println("4. Exit")


    fmt.Print("Please enter your choice: ")


    }


    \`\`\`


    Handling User Input


    Next, we''ll handle user input to capture the user''s selection from the menu.


    \`\`\`go


    package main


    import (


    "fmt"


    "os"


    )


    func displayMenu() {


    fmt.Println("Welcome to the Simple Menu App")


    fmt.Println("1. Option 1")


    fmt.Println("2. Option 2")


    fmt.Println("3. Option 3")


    fmt.Println("4. Exit")


    fmt.Print("Please enter your choice: ")


    }


    func getUserInput() int {


    var choice int


    fmt.Scanln(&choice)


    return choice


    }


    func main() {


    for {


    displayMenu()


    choice := getUserInput()


    switch choice {


    case 1:


    fmt.Println("You selected Option 1")


    case 2:


    fmt.Println("You selected Option 2")


    case 3:


    fmt.Println("You selected Option 3")


    case 4:


    fmt.Println("Exiting...")


    os.Exit(0)


    default:


    fmt.Println("Invalid choice. Please try again.")                           


    }


    \`\`\`


    Executing Actions


    Now, let''s implement the actions corresponding to each menu option. We''ll define
    functions for each action and call them based on the user''s selection.


