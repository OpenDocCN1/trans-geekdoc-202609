    // Display tasks


    if len(tasks) == 0 {


    fmt.Println("No tasks found.")


    } else {


    fmt.Println("Tasks:")


    for \_, task := range tasks {


    fmt.Printf("- %d: %s (Created: %s)\\n", task.ID, task.Title, task.CreatedAt.Format("2006-01-02
    15:04:05"))          


