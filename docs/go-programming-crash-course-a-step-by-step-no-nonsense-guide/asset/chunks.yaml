    \n```sh\ntouch main.go\n```\n\n4. **编写服务器代码**：在 `main.go` 中添加以下代码：\n\n```go\n\
    package main\n\nimport (\n\t\"github.com/gin-gonic/gin\"\n)\n\nfunc main() {\n\
