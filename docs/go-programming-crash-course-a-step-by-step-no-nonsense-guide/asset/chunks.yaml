    \n# Chapter 4\n\n## Loops and Flow Control: Mastering Repetition\n\n## Loops:\
    \ Repeating Tasks with Ease in Go\n\nLoops are fundamental constructs in programming\
    \ that allow you to execute a block of code repeatedly. In Go, loops are primarily\
    \ managed using the `for` keyword, which is versatile enough to handle all looping\
    \ scenarios, including those traditionally managed by `while` and `do-while` loops\
    \ in other languages. This guide explores the various ways to use loops in Go,\
    \ with practical examples to illustrate their usage.\n\n### Basic `for` Loop\n\
    \nThe basic `for` loop in Go is similar to C-style `for` loops and consists of\
    \ three main parts: initialization, condition, and post (iteration statement).\n\
    \n### Syntax\n\n```go\nfor initialization; condition; post {\n    // code to be\
    \ executed\n}\n```\n\n### Example: Basic `for` Loop\n\n```go\npackage main\n\n\
    import \"fmt\"\n\nfunc main() {\n    for i := 0; i < 5; i++ {\n        fmt.Println(\"\
    Iteration:\", i)\n    }\n}\n```\n\nIn this example, the loop runs 5 times, printing\
    \ the current iteration each time.\n\n### `for` as a While Loop\n\nIn Go, the\
    \ `for` loop can be used as a `while` loop by omitting the initialization and\
    \ post statements, only including the condition.\n\n### Syntax\n\n```go\nfor condition\
    \ {\n    // code to be executed\n}\n```\n\n### Example: `for` as a While Loop\n\
    \n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    n := 0\n    for\
    \ n < 5 {\n        fmt.Println(\"Iteration:\", n)\n        n++\n    }\n}\n```\n\
    \nHere, the loop continues as long as `n` is less than 5, incrementing `n` with\
    \ each iteration.\n\n### Infinite `for` Loop\n\nAn infinite loop runs indefinitely\
    \ and is created by omitting all three components of the `for` statement.\n\n\
    ### Syntax\n\n```go\nfor {\n    // code to be executed\n}\n```\n\n### Example:\
    \ Infinite `for` Loop\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main()\
