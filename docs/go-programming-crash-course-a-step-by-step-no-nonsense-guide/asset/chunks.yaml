    Integer Types


    Integers in Go come in signed and unsigned variants, with various bit sizes. The
    default integer type is \`int\`, which is usually 32 or 64 bits depending on the
    system.


    \`\`\`go


    var a int = 10


    var b uint = 20


    var c int8 = -128


    \`\`\`


    Floating-Point Types


    Floating-point numbers represent real numbers and have two types: \`float32\`
    and \`float64\`.


    \`\`\`go


    var x float32 = 3.14


    var y float64 = 2.718281828


    \`\`\`


    Boolean Type


    Boolean variables hold \`true\` or \`false\` values.


    \`\`\`go


    var isActive bool = true


    var isLoggedIn bool = false


    \`\`\`


    String Type


    Strings are sequences of characters.


    \`\`\`go


    var greeting string = "Hello, Go!"


    \`\`\`


    Complex Data Types


    Go also supports complex data structures like arrays, slices, structs, maps, and
    channels.


    Arrays


    Arrays are fixed-size sequences of elements of a single type.


    \`\`\`go


    var arr \[5\]int = \[5\]int{1, 2, 3, 4, 5}


    fmt.Println(arr)


    \`\`\`


    Slices


    Slices are more flexible than arrays, providing dynamically-sized views into arrays.


    \`\`\`go


    var slice \[\]int = \[\]int{1, 2, 3, 4, 5}


    fmt.Println(slice)


    \`\`\`


    Slices can grow and shrink dynamically, making them more useful for most applications
    than arrays.


    Structs


    Structs are collections of fields. They are used to group data together.


    \`\`\`go


    type Person struct {


    Name string


    Age  int


    }


    var person = Person{Name: "Alice", Age: 30}


    fmt.Println(person)


    \`\`\`


    Maps


    Maps are key-value pairs, where keys are unique and are used to retrieve values.


    \`\`\`go


    var m map\[string\]int = map\[string\]int{"Alice": 30, "Bob": 25}


    fmt.Println(m)


    \`\`\`


    Channels


    Channels are used for communication between goroutines.


    \`\`\`go


    ch := make(chan int)


    go func() {


    ch <- 42


    }()


    val := <- ch


    fmt.Println(val)


    \`\`\`


    Example Program: Using Different Data Types


    Let''s create a program that utilizes various data types:


    \`\`\`go


    package main


    import "fmt"


    type Person struct {


    Name string


    Age  int


    }


    func main() {


    // Basic types


    var name string = "Alice"


    age := 30


    height := 5.7


    isActive := true


    // Array


    scores := \[3\]int{90, 85, 88}


