    Before swap:\", x, y)\n    swap(&x, &y)\n    fmt.Println(\"After swap:\", x, y)\n\
    }\n```\n\n### 空指针解引用\n\n```go\nvar ptr *int\nif ptr == nil {\n    fmt.Println(\"\
    Pointer is nil\")\n} else {\n    fmt.Println(*ptr)\n}\n```\n\n在解引用指针之前，始终检查指针是否为\
    \ `nil` 以避免运行时崩溃（panic）。\n\n"
