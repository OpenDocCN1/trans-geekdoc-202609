    Salary: map[Alice:50000 Bob:60000]\nPerson: {Alice 30}\nValue from channel: 42\n\
    ```\n\n理解变量和数据类型对于在 Go 中编写高效且无错误的程序至关重要。通过掌握这些概念，你可以存储和管理信息，从而编写更健壮、更易维护的代码。这门快速课程涵盖了基础，并提供了开启你\
