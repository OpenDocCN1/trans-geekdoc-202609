    } else {


    fmt.Println(keyToDelete, "does not exist in the map")


    }


    // Attempting to delete a non-existent key


    keyToDelete = "David"


    if \_, exists := age\[keyToDelete\]; exists {


    delete(age, keyToDelete)


    fmt.Println(keyToDelete, "was deleted from the map")


    } else {


    fmt.Println(keyToDelete, "does not exist in the map")


    }


    // Printing the map after deletions


    fmt.Println("Final map:", age)


    }


    \`\`\`


    In this example, the program first checks if "Bob" exists in the map and then
    deletes him if he does. When attempting to delete "David", the program confirms
    that he does not exist and skips the deletion.


    Iterating Over a Map


    Another advanced technique involves iterating over a map. This can be useful for
    performing operations on all key-value pairs or for debugging purposes.


    Example:


    \`\`\`go


    package main


    import "fmt"


