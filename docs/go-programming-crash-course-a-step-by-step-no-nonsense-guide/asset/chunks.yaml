    \n在 Go 中，函数通常返回第二个值作为错误，以指示执行是否成功或遇到了错误。\n\n```go\npackage main\n\nimport (\n\t\
    \"errors\"\n\t\"fmt\"\n)\n\nfunc divide(x, y float64) (float64, error) {\n\tif\
