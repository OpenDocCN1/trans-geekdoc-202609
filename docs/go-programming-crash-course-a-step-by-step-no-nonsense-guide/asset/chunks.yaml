    \  rows := 3\n    cols := 3\n    for i := 0; i < rows; i++ {\n        for j :=\
    \ 0; j < cols; j++ {\n            fmt.Printf(\"%d %d \", i, j)\n        }\n  \
    \      fmt.Println()\n    }\n}\n```\n\n## 遍历数据结构\n\nGo 的 `for` 循环足够强大，可以遍历各种结构，如切片（slices）和映射（maps）。\n\
    \n### 示例：遍历切片\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    numbers\
    \ := []int{1, 2, 3, 4, 5}\n    for _, num := range numbers {\n        fmt.Println(num)\n\
    \    }\n}\n```\n\n这个示例遍历了 `slice` 中的每一个元素。\n\n### 示例：遍历映射\n\n```go\npackage main\n\
    \nimport \"fmt\"\n\nfunc main() {\n    people := map[string]int{\"Alice\": 25,\
    \ \"Bob\": 30, \"Charlie\": 35}\n    for name, age := range people {\n       \
    \ fmt.Printf(\"%s is %d years old\\n\", name, age)\n    }\n}\n```\n\n在这里，循环遍历\
    \ `map` 中的键值对。\n\n## 使用标签控制循环\n\nGo 提供了标签来让你控制嵌套循环的流程。\n\n### 示例：带标签的嵌套循环\n\n\
    ```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\nouter:\n    for i := 0;\
    \ i < 3; i++ {\n        for j := 0; j < 3; j++ {\n            fmt.Printf(\"%d\
    \ %d \", i, j)\n            if i*j > 4 {\n                break outer\n      \
    \      }\n        }\n        fmt.Println()\n    }\n}\n```\n\n在这个示例中，当 `i*j` 超过\
    \ 4 时，会退出两个循环。\n\n## 实际示例\n\n### 示例：求最大公约数 (GCD)\n\n欧几里得算法是使用 `while` 风格循环寻找两个数\
    \ GCD 的经典方法。\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc gcd(a, b int) int\
    \ {\n    for b != 0 {\n        a, b = b, a%b\n    }\n    return a\n}\n\nfunc main()\
    \ {\n    fmt.Println(\"GCD of 54 and 24 is\", gcd(54, 24))\n}\n```\n\n### 示例：实现简单的倒计时\n\
    \n倒计时计时器可以使用 `while` 风格循环实现，递减计数器并等待指定的时间。\n\n```go\npackage main\n\nimport (\n\
    \    \"fmt\"\n    \"time\"\n)\n\nfunc main() {\n    countdown := 10\n    for countdown\
    \ > 0 {\n        fmt.Println(\"Countdown:\", countdown)\n        countdown--\n\
    \        time.Sleep(1 * time.Second)\n    }\n    fmt.Println(\"Liftoff!\")\n}\n\
    ```\n\n### 示例：累加用户输入直到哨值\n\n你可以使用循环累加用户输入的数字，直到输入哨值（例如零）。\n\n```go\npackage main\n\
    \nimport \"fmt\"\n\nfunc main() {\n    var sum, num int\n    for {\n        fmt.Print(\"\
    Enter a number (0 to stop): \")\n        fmt.Scan(&num)\n        if num == 0 {\n\
    \            break\n        }\n        sum += num\n    }\n    fmt.Printf(\"Total\
    \ sum: %d\\n\", sum)\n}\n```\n\n在这个示例中，循环持续提示用户输入数字，并进行累加，直到用户输入零。\n\n"
