  trans: "\n并发是程序同时执行多个任务的能力，使其能够高效地利用可用资源并提高整体性能。在 Go 语言中，并发是一个一等公民，提供了对 `goroutines`、`channels`\
    \ 和 `go` 关键字的内置支持，使得编写并发程序变得简单。在本指南中，我们将探索如何利用 Go 的并发特性来构建可以同时处理多件事的应用程序，并提供演示各种并发模式和最佳实践的代码示例。\n\
    \n### Goroutines (协程)\n\nGoroutines 是 Go 中轻量级的执行线程，允许函数并发运行。通过在函数调用前加上 `go` 关键字可以启动一个新的\
    \ goroutine。\n\n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"time\"\n)\n\
    \nfunc sayHello() {\n    fmt.Println(\"Hello\")\n}\n\nfunc main() {\n    // 启动一个新的\
    \ goroutine\n    go sayHello()\n    // 等待一段时间以允许 goroutine 执行\n    time.Sleep(time.Millisecond)\n\
    \    fmt.Println(\"Main function\")\n}\n```\n\n### Channels (通道)\n\nChannels 是\
    \ Go 中一种强大的并发原语，允许 goroutine 之间进行通信并同步它们的执行。通道可在 goroutine 之间发送和接收数据。\n\n```go\n\
    package main\n\nimport (\n    \"fmt\"\n    \"time\"\n)\n\nfunc sender(ch chan<-\
    \ string) {\n    ch <- \"Hello from sender\"\n}\n\nfunc receiver(ch <-chan string)\
    \ {\n    fmt.Println(<-ch)\n}\n\nfunc main() {\n    // 创建一个新的通道\n    ch := make(chan\
    \ string)\n    // 启动发送者和接收者 goroutine\n    go sender(ch)\n    go receiver(ch)\n\
    \    // 等待一段时间以允许 goroutines 执行\n    time.Sleep(time.Millisecond)\n}\n```\n\n\
    ### Buffered Channels (缓冲通道)\n\n缓冲通道允许发送多个值而不需要发送者和接收者立即同步。\n\n```go\npackage\
    \ main\n\nimport (\n    \"fmt\"\n    \"time\"\n)\n\nfunc main() {\n    // 创建一个容量为\
    \ 3 的缓冲通道\n    ch := make(chan int, 3)\n    // 启动一个 goroutine 向通道发送值\n    go func()\
    \ {\n        for i := 1; i <= 3; i++ {\n            ch <- i\n            fmt.Println(\"\
    Sent:\", i)\n            time.Sleep(time.Second)\n        }\n        close(ch)\n\
    \    }()\n    // 从通道接收值\n    for num := range ch {\n        fmt.Println(\"Received:\"\
    , num)\n    }\n}\n```\n\n### Select Statement (select 语句)\n\n`select` 语句允许你同时等待多个通道操作，这对于协调多个\
    \ goroutine 非常别用。\n\n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"time\"\
    \n)\n\nfunc worker1(ch chan<- string) {\n    time.Sleep(2 * time.Second)\n   \
    \ ch <- \"Worker 1\"\n}\n\nfunc worker2(ch chan<- string) {\n    time.Sleep(1\
    \ * time.Second)\n    ch <- \"Worker 2\"\n}\n\nfunc main() {\n    ch1 := make(chan\
    \ string)\n    ch2 := make(chan string)\n    go worker1(ch1)\n    go worker2(ch2)\n\
    \    select {\n    case result := <-ch1:\n        fmt.Println(\"Received from\
    \ Worker 1:\", result)\n    case result := <-ch2:\n        fmt.Println(\"Received\
    \ from Worker 2:\", result)\n    }\n}\n```\n\n### WaitGroups (等待组)\n\n`sync` 包提供了\
    \ `WaitGroup` 类型，允许你在继续执行执行之前等待多个 goroutine 完成。\n\n```go\npackage main\n\nimport\
    \ (\n    \"fmt\"\n    \"sync\"\n    \"time\"\n)\n\nfunc worker(id int, wg *sync.WaitGroup)\
    \ {\n    defer wg.Done()\n    fmt.Printf(\"Worker %d finished\\n\", id)\n    time.Sleep(time.Second)\n\
    }\n\nfunc main() {\n    var wg sync.WaitGroup\n    wg.Add(2)\n    go worker(1,\
    \ &wg)\n    go worker(2, &wg)\n    wg.Wait()\n    fmt.Println(\"All workers done\"\
    )\n}\n```\n\n### Mutex (互斥锁)\n\nMutex（互斥锁）用于保护共享资源，确保同一时间只有一个 goroutine 访问该资源。\n\
    \n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"sync\"\n)\n\ntype Counter\
    \ struct {\n    mu sync.Mutex\n    count int\n}\n\nfunc (c *Counter) Increment()\
    \ {\n    c.mu.Lock()\n    defer c.mu.Unlock()\n    c.count++\n}\n\nfunc main()\
    \ {\n    counter := &Counter{}\n    var wg sync.WaitGroup\n    for i := 0; i <\
    \ 100; i++ {\n        wg.Add(1)\n        go func() {\n            defer wg.Done()\n\
    \            counter.Increment()\n        }()\n    }\n    wg.Wait()\n    fmt.Println(\"\
    Final count:\", counter.count)\n}\n```\n"
