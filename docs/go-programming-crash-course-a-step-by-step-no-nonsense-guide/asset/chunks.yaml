    String Basics: Creating, Concatenating, and Manipulating Strings in Go


    Strings are fundamental data types in most programming languages, including Go.
    They are sequences of characters, enclosed within double quotes (\`" "\`). In
    this guide, we''ll explore the basics of working with strings in Go, including
    creating, concatenating, and manipulating them using code examples.


    Creating Strings


    Creating a string in Go is as simple as enclosing a sequence of characters within
    double quotes. Here''s how you can declare a string variable:


    \`\`\`go


    package main


    import "fmt"


    func main() {


    // Declaring a string variable


    var str string = "Hello, World!"   


    // Printing the string


    fmt.Println(str) // Output: Hello, World!


    }


    \`\`\`


    Alternatively, Go allows shorthand declaration for string variables:


    \`\`\`go


    package main


    import "fmt"


    func main() {


    // Shorthand declaration of a string variable


    str := "Hello, World!"   


    // Printing the string


    fmt.Println(str) // Output: Hello, World!


    }


    \`\`\`


    Concatenating Strings


    Concatenating strings means combining multiple strings into one. In Go, you can
    use the \`+\` operator or the \`fmt.Sprintf\` function for string concatenation:


    \`\`\`go


    package main


    import "fmt"


    func main() {


    // Concatenating strings using the + operator


    str1 := "Hello"


    str2 := "World"


    result := str1 + ", " + str2 + "!"


    fmt.Println(result) // Output: Hello, World!


    // Concatenating strings using fmt.Sprintf


    name := "Alice"


    age := 30


    sentence := fmt.Sprintf("My name is %s and I am %d years old.", name, age)


    fmt.Println(sentence) // Output: My name is Alice and I am 30 years old.


    }


    \`\`\`


    String Length


    You can find the length of a string in Go using the \`len()\` function. It returns
    the number of bytes in the string, not the number of characters, because Go strings
    are encoded in UTF-8, where some characters may require more than one byte.


    \`\`\`go


    package main


    import "fmt"


    func main() {


    str := "Hello, World!"


    length := len(str)


    fmt.Println(length) // Output: 13


    }


