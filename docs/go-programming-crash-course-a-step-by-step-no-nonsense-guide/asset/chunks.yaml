    Modifying Strings


    In Go, strings are immutable, meaning once created, their values cannot be changed.
    However, you can manipulate strings by creating new ones based on the original
    string.


    \`\`\`go


    package main


    import "fmt"


    func main() {


    str := "Hello, World!"   


    // Modifying a string by concatenating


    modifiedStr := str + " Welcome!"


    fmt.Println(modifiedStr) // Output: Hello, World! Welcome!   


    // Reassigning a new value to the string variable


    str = "Goodbye, World!"


    fmt.Println(str) // Output: Goodbye, World!


    }


    \`\`\`


    Searching Within Strings


    Go provides the \`strings\` package for various string manipulation functions.
    One common operation is searching for substrings within a string using the \`strings.Contains()\`
    function:


    \`\`\`go


    package main


    import (


    "fmt"


    "strings"


    )


    func main() {


    str := "The quick brown fox jumps over the lazy dog"   


    // Checking if a substring exists within the string


    contains := strings.Contains(str, "fox")


    fmt.Println(contains) // Output: true


    }


    \`\`\`


    Splitting and Joining Strings


    You can split a string into substrings based on a delimiter using the \`strings.Split()\`
    function. Conversely, you can join an array of strings into a single string using
    the \`strings.Join()\` function:


    \`\`\`go


    package main


    import (


    "fmt"


    "strings"


    )


    func main() {


    str := "apple,banana,orange"   


    // Splitting the string into substrings


    fruits := strings.Split(str, ",")


    fmt.Println(fruits) // Output: \[apple banana orange\]   


    // Joining substrings into a single string


    joinedStr := strings.Join(fruits, ";")


    fmt.Println(joinedStr) // Output: apple;banana;orange


    }


    \`\`\`


