    \ {\n\tName    string\n\tAge     int\n\tAddress string\n}\n\nfunc main() {\n\t\
    var person Person\n\t// Modify the fields of the structure\n\tperson.Name = \"\
    Alice\"\n\tperson.Age = 30\n\tperson.Address = \"123 Main St\"\n\t// Print the\
    \ modified structure\n\tfmt.Println(\"Name:\", person.Name)\n\tfmt.Println(\"\
    Age:\", person.Age)\n\tfmt.Println(\"Address:\", person.Address)\n}\n```\n\n#\
    \ Nested Structures\n\nStructures can be nested within each other, allowing for\
    \ the creation of hierarchical data structures.\n\n```go\npackage main\n\nimport\
    \ (\n\t\"fmt\"\n)\n\ntype Address struct {\n\tStreet     string\n\tCity      \
    \ string\n\tPostalCode string\n}\n\ntype Person struct {\n\tName    string\n\t\
