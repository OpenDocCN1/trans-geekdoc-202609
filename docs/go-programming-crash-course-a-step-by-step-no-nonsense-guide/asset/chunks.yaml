    \ Main St\",\n\t\t\tCity:       \"New York\",\n\t\t\tPostalCode: \"10001\",\n\t\
    \t},\n\t}\n\t// Accessing nested structure fields\n\tfmt.Println(\"Name:\", person.Name)\n\
    \tfmt.Println(\"Age:\", person.Age)\n\tfmt.Println(\"Street:\", person.Address.Street)\n\
    \tfmt.Println(\"City:\", person.Address.City)\n\tfmt.Println(\"Postal Code:\"\
    , person.Address.PostalCode)\n}\n```\n\n# Anonymous Structures\n\nYou can define\
    \ anonymous structures inline without explicitly specifying a name. This is useful\
    \ for one-off data structures.\n\n```go\npackage main\n\nimport (\n\t\"fmt\"\n\
    )\n\nfunc main() {\n\t// Define and initialize an anonymous structure\n\tperson\
