    \ i++ {\n            ch <- i\n            fmt.Println(\"Sent:\", i)\n        \
    \    time.Sleep(time.Second)\n        }\n        close(ch)\n    }()\n    // Receive\
    \ values from the channel\n    for num := range ch {\n        fmt.Println(\"Received:\"\
    , num)\n    }\n}\n```\n\n### Select Statement\n\nThe `select` statement allows\
    \ you to wait on multiple channel operations simultaneously, making it useful\
    \ for coordinating multiple goroutines.\n\n```go\npackage main\n\nimport (\n \
    \   \"fmt\"\n    \"time\"\n)\n\nfunc worker1(ch chan<- string) {\n    time.Sleep(2\
    \ * time.Second)\n    ch <- \"Worker 1\"\n}\n\nfunc worker2(ch chan<- string)\
    \ {\n    time.Sleep(1 * time.Second)\n    ch <- \"Worker 2\"\n}\n\nfunc main()\
    \ {\n    ch1 := make(chan string)\n    ch2 := make(chan string)\n    go worker1(ch1)\n\
    \    go worker2(ch2)\n    select {\n    case result := <-ch1:\n        fmt.Println(\"\
    Received from Worker 1:\", result)\n    case result := <-ch2:\n        fmt.Println(\"\
    Received from Worker 2:\", result)\n    }\n}\n```\n\n### WaitGroups\n\nThe `sync`\
    \ package provides the `WaitGroup` type, which allows you to wait for multiple\
    \ goroutines to finish before continuing execution.\n\n```go\npackage main\n\n\
    import (\n    \"fmt\"\n    \"sync\"\n    \"time\"\n)\n\nfunc worker(id int, wg\
