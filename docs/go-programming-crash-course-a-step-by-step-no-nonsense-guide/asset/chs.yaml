  \n## 在 Go 中构建一个简单的菜单驱动应用程序\n\n创建菜单驱动的应用程序是软件开发中的常见任务，特别是对于命令行界面。Go 提供了必要的工具和库来高效地构建此类应用程序。在本指南中，我们将介绍在\
  \ Go 中构建一个简单的菜单驱动应用程序的过程，涵盖菜单的实现、用户输入处理以及根据用户的选择执行操作，并附带代码示例。\n\n### 设计菜单结构\n\n\
  在深入代码之前，设计菜单驱动应用程序的结构至关重要。我们将从一个允许用户执行基本操作的简单菜单开始。\n\n1. 显示菜单选项\n2. 提示用户选择选项\n3.\
  \ 根据用户的选择执行相应的操作\n4. 重复该过程直到用户选择退出\n\n### 实现菜单\n\n让我们从实现菜单结构并向用户显示菜单选项开始。\n\n```go\n\
  package main\n\nimport (\n\t\"fmt\"\n)\n\nfunc displayMenu() {\n\tfmt.Println(\"\
  Welcome to the Simple Menu App\")\n\tfmt.Println(\"1. Option 1\")\n\tfmt.Println(\"\
  2. Option 2\")\n\tfmt.Println(\"3. Option 3\")\n\tfmt.Println(\"4. Exit\")\n\tfmt.Print(\"\
  Please enter your choice: \")\n}\n```\n\n### 处理用户输入\n\n接下来，我们将处理用户输入以捕获用户从菜单中的选择。\n\
  \n```go\npackage main\n\nimport (\n\t\"fmt\"\n\t\"os\"\n)\n\nfunc displayMenu()\
