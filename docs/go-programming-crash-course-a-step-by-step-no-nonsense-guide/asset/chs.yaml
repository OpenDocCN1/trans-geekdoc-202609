  \nGo 提供了 `strings` 包用于各种字符串处理函数。一种常见操作是使用 `strings.Contains()` 函数在字符串中搜索子字符串：\n\n\
  ```go\npackage main\n\nimport (\n    \"fmt\"\n    \"strings\"\n)\n\nfunc main()\
  \ {\n    str := \"The quick brown fox jumps over the lazy dog\"   \n\n    // 检查字符串中是否存在子字符串\n\
  \    contains := strings.Contains(str, \"fox\")\n    fmt.Println(contains) // Output:\
  \ true\n}\n```\n\n# 字符串的分割与合并\n\n你可以使用 `strings.Split()` 函数根据分隔符将字符串拆为子字符串。相反，你可以使用\
  \ `strings.Join()` 函数将字符串数组合并为单个字符串：\n\n```go\npackage main\n\nimport (\n    \"\
  fmt\"\n    \"strings\"\n)\n\nfunc main() {\n    str := \"apple,banana,orange\" \
  \  \n\n    // 将字符串分割为子字符串\n    fruits := strings.Split(str, \",\")\n    fmt.Println(fruits)\
  \ // Output: [apple banana orange]   \n\n    // 将子字符串合并为单个字符串\n    joinedStr :=\
  \ strings.Join(fruits, \";\")\n    fmt.Println(joinedStr) // Output: apple;banana;orange\n\
  }\n```\n\n理解如何操作字符串在 Go 编程中至关重要。通过这门突击课程获得的知识，你现在应该能够高效地在 Go 程序中创建、拼接、操作以及对字符串执行各种操作。尝试不同的示例并探索\
  \ Go 标准库提供的字符串处理的丰富功能。祝编码愉快！\n\n# 字符串格式化：在 Go 中以用户友好的方式打印数据\n\n字符串格式化是编程的一个关键方面，因为它允许开发者以易于阅读且视觉美的方式呈现数据。在\
  \ Go 中，字符串格式化通过 `fmt` 包实现，该包提供了各种函数和格式化动词来控制数据的显示方式。在本指南中，我们将探索 Go 中不同的字符串格式化技术以及代码示例。\n\
  \n## 基础字符串格式化\n\n`fmt.Printf()` 函数用于 Go 中的格式化打印。它允许你在字符串中指定占位符，然后提供值来填充这些占位符。`%*`\
  \ 动词用于指定数据的格式。\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    name\
  \ := \"Alice\"\n    age := 30   \n\n    // 基础字符串格式化\n    fmt.Printf(\"Name: %s,\
  \ Age: %d\\n\", name, age)\n    // Output: Name: Alice, Age: 30\n}\n```\n\n## 字符串宽度与精度\n\
  \n你可以使用数字动词控制打印字符串的宽度和精度。例如，`%5s` 指定字符串宽度至少为 5 个字符。同样，`%0.2f` 指定打印浮点数时保留两位小数。\n\n\
  ```go\npackage main\n\nimport \"fmt\"\n\nfunc main() {\n    width := 5\n    precision\
  \ := 2\n    value := 3.14159   \n\n    // 字符串宽度和精度格式化\n    fmt.Printf(\"Value: %.*.*f\\\
  n\", width, precision, value)\n    // Output: Value:  3.14\n}\n```\n\n## 填充与对齐\n\
  \n你可以使用空格或其他字符填充字符串以实现对齐。`-` 标志指定左对齐，而 `+` 标志指定右对齐。此外，你可以使用 `0` 用零填充数值。\n\n```go\n\
  package main\n\nimport \"fmt\"\n\nfunc main() {\n    name := \"Alice\"\n    age\
  \ := 30   \n\n    // 填充与对齐\n    fmt.Printf(\"Name: %-10s Age: %03d\\n\", name, age)\n\
  \    // Output: Name: Alice      Age: 030\n}\n```\n\n## 字符串切片与截断\n\n你可以使用 `%.*s`\
  \ 动词对字符串进行切片以限制其长度，或将其截断为指定数量的字符。\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc\
  \ main() {\n    message := \"This is a long message that needs to be truncated\"\
  \   \n\n    // 字符串切片与截断\n    fmt.Printf(\"Message: %.15s\\n\", message)\n    //\
  \ Output: Message: This is a long\n}\n```\n\n## 布尔格式化\n\n布尔值可以使用 `%t` 动词格式化为 \"\
  true\" 或 \"false\" 字符串。\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main()\
  \ {\n    isTrue := true\n    isFalse := false\n    fmt.Printf(\"True: %t, False:\
  \ %t\\n\", isTrue, isFalse)\n}\n```\n\n## 结构体格式化\n\n你可以使用 `%v` 动词格式化结构体。\n\n```go\n\
  package main\n\nimport \"fmt\"\n\ntype Person struct {\n    Name string\n    Age\
  \  int\n}\n\nfunc main() {\n    p := Person{\"Alice\", 30}\n    fmt.Printf(\"Person:\
  \ %v\\n\", p)\n}\n```\n\n## 自定义字符串格式化\n\n你可以通过实现 `String()` 方法为类型定义自定义的字符串表示。\n\n\
  ```go\npackage main\n\nimport \"fmt\"\n\ntype Point struct {\n    X, Y int\n}\n\n\
  func (p Point) String() string {\n    return fmt.Sprintf(\"Point(%d, %d)\", p.X,\
  \ p.Y)\n}\n\nfunc main() {\n    p := Point{3, 4}\n    fmt.Println(p)\n}\n```\n\n\
