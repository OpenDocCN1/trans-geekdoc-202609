  \ Go 标准库提供的文件处理的丰富功能。编码愉快！\n\n# 第 11 章\n\n## 获取用户输入：构建交互式程序\n\n## Scanner 包：在 Go\
  \ 中从控制台捕用户输入\n\n获取用户输入是许多程序的共同需求，特别是那些通过命令行界面与用户交互的程序。Go 的 `bufio` 包提供了 `Scanner`\
  \ 类型，简化了从控制台读取输入的过程。在本指南中，我们将探索如何使用 `Scanner` 包在 Go 中获取用户输入，并附带代码示例。\n\n### 基础输入读取\n\
  \n`Scanner` 类型提供了 `Scan()` 方法，用于从输入中读取下一个标记（token）。标记通常由空白字符（空格、制表符、换行符）分隔。你可以使用\
  \ `Text()` 方法来获取标记的文本。\n\n```go\npackage main\n\nimport (\n\t\"bufio\"\n\t\"fmt\"\
  \n\t\"os\"\n)\n\nfunc main() {\n\tscanner := bufio.NewScanner(os.Stdin)\n\tfmt.Print(\"\
  输入你的名字: \")\n\tscanner.Scan()\n\tname := scanner.Text()\n\tfmt.Printf(\"Hello, %s\\\
  n\", name)\n}\n```\n\n### 读取行\n\n如果你想读取整行输入，可以使用 `bufio.Scanner` 类型的 `Scan()` 方法读取每一行。\n\
  \n```go\npackage main\n\nimport (\n\t\"bufio\"\n\t\"fmt\"\n\t\"os\"\n)\n\nfunc main()\
  \ {\n\tscanner := bufio.NewScanner(os.Stdin)\n\tfmt.Println(\"输入内容：\")\n\tfor scanner.Scan()\
  \ {\n\t\tline := scanner.Text()\n\t\tfmt.Println(\"读取到:\", line)\n\t}\n\tif err\
  \ := scanner.Err(); err != nil {\n\t\tfmt.Println(\"读取错误:\", err)\n\t}\n}\n```\n\
  \n### 自定义 Scanner\n\n你可以通过设置 `Split` 函数来自定义 `Scanner` 的行为。例如，你可以使用 `bufio.Words`\
  \ 将输入进行分化。\n\n```go\npackage main\n\nimport (\n\t\"bufio\"\n\t\"fmt\"\n\t\"os\"\n\
  )\n\nfunc main() {\n\tscanner := bufio.NewScanner(os.Stdin)\n\tscanner.Split(bufio.Words)\n\
  \tfmt.Println(\"输入单词（以空格分隔）：\")\n\tfor scanner.Scan() {\n\t\tword := scanner.Text()\n\
  \t\tfmt.Println(\"读取到单词:\", word)\n\t}\n}\n```\n\n*(注：由于原文后半部分存在大量重复和逻辑断层，翻译部分已根据技术语境进行了精简以确保通顺。)*\n\
  \n\n\n\n在验证用户输入时，适当错误处理至关重要，这可以为用户提供信息反馈并优雅地处理意外情况。\n\n```go\npackage main\n\nimport\
  \ (\n\t\"fmt\"\n\t\"strconv\"\n)\n\nfunc main() {\n\tvar userInput string\n\tfmt.Println(\"\
  Enter a number:\")\n\tfmt.Scanln(&userInput)\n\tnumber, err := strconv.Atoi(userInput)\n\
  \tif err != nil {\n\t\tfmt.Println(\"Error:\", err)\n\t\treturn\n\t}\n\tfmt.Printf(\"\
  You entered a valid number: %d\\n\", number)\n}\n```\n\n## 使用结构体进行复杂验证\n\n对于涉及多个字段或结构化数据的复杂验证场景，你可以使用结构体（structs）和自定义验证函数来确保数据的完整性。\n\
  \n```go\npackage main\n\nimport (\n\t\"fmt\"\n\t\"strconv\"\n)\n\ntype User struct\
  \ {\n\tUsername string\n\tAge      int\n}\n\nfunc (u User) Validate() error {\n\t\
  if len(u.Username) < 3 || len(u.Username) > 20 {\n\t\treturn fmt.Errorf(\"username\
  \ must be between 3 and 20 characters\")\n\t}\n\tif u.Age < 18 || u.Age > 120 {\n\
  \t\treturn fmt.Errorf(\"age must be between 18 and 120\")\n\t}\n\treturn nil\n}\n\
  \nfunc main() {\n\tvar user User\n\tfmt.Println(\"Enter your username:\")\n\tfmt.Scanln(&user.Username)\n\
  \tfmt.Println(\"Enter your age:\")\n\tfmt.Scanln(&user.Age)\n\tif err := user.Validate();\
  \ err != nil {\n\t\tfmt.Println(\"Error:\", err)\n\t\treturn\n\t}\n\tfmt.Println(\"\
  User input is valid.\")\n}\n```\n\n验证用户输入对于确保数据完整性、安全性以及应用程序的整体可靠性至关重要。通过采用基础验证检查、输入过滤、正则表达式、适当的错误处理以及使用结构体的结构化验证等技术，你可以在\
