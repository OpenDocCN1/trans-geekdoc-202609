  4. Exit\")\n\tfmt.Print(\"Please enter your choice: \")\n}\n\nfunc getUserInput()\
  \ int {\n\tvar choice int\n\tfmt.Scanln(&choice)\n\treturn choice\n}\n\nfunc main()\
  \ {\n\tfor {\n\t\tdisplayMenu()\n\t\tchoice := getUserInput()\n\t\tswitch choice\
  \ {\n\t\tcase 1:\n\t\t\tfmt.Println(\"You selected Option 1\")\n\t\tcase 2:\n\t\t\
  \tfmt.Println(\"You selected Option 2\")\n\t\tcase 3:\n\t\t\tfmt.Println(\"You selected\
  \ Option 3\")\n\t\tcase 4:\n\t\t\tfmt.Println(\"Exiting...\")\n\t\t\tos.Exit(0)\n\
  \t\tdefault:\n\t\t\tfmt.Println(\"Invalid choice. Please try again.\")\n\t\t}\n\t\
  }\n}\n```\n\n### 执行操作\n\n现在，让我们实现每个选项对应的操作。\n\n```go\npackage main\n\nimport (\n\
  \t\"fmt\"\n\t\"os\"\n)\n\nfunc displayMenu() {\n\tfmt.Println(\"Welcome to the Simple\
  \ Menu App\")\n\tfmt.Println(\"1. Option 1\")\n\tfmt.Println(\"2. Option 2\")\n\t\
  fmt.Println(\"3. Option 3\")\n\tfmt.Println(\"4. Exit\")\n\tfmt.Print(\"Please enter\
  \ your choice: \")\n}\n\nfunc getUserInput() int {\n\tvar choice int\n\tfmt.Scanln(&choice)\n\
  \treturn choice\n}\n\nfunc option1Action() {\n}\n\nfunc option2Action() {\n}\n\n\
  func option3Action() {\n}\n\nfunc main() {\n\n### 为操作添加功能\n\n你可以为每个操作添加功能以执行特定任务。\n\
