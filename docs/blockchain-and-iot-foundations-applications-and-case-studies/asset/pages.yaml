    # ## INTRODUCTION


    In 2009 Nakamoto Satoshi developed blockchain to make Bitcoins more secure. As
    of January 2018, the capital fee of Bitcoin was $180 billion. Blockchain is a
    multi-disciplinary topic that involves mathematics, computation, big data, IoT,
    and cloud computing. Blockchain isn''t always a proved, however, it is an alternative
    as it is also used as the primary software of Bitcoin. A block is part of the
    blockchain that consists of a block header, which turn is divided into fundamental
    block hash, block model, timestamp, nonce value, simple records, information,
    and Merkel root hash. The block also includes interactive series of information
    with cryptography and a dispensed shared ledger. It performs unusual operations
    by consensus, smart contracts, preferred ledger, and cross-chain generation. Each
    block is connected to different blocks (nodes) and knows the previous and subsequent
    hashes in a peer-to-peer network. Blocks are not deleted or changed by blockchain
    users. It has a verification facility by which individual blocks have to be completely
    verified. Blocks have the traits of decentralization, persistence, anonymity,
    independence, openness, immutability, safety and agreement, collective renovation,
    programmability, transparency, unforgeability, and auditability [5] (Figure 1.1).


    A transaction is deleted from public ledger in a list of instructions or information
    recorded in blocks as the Bitcoins are exchanged among users. Customers in transactions
    participate through blockchain addresses [16, 29] and they''re controlled by using
    wallets. A user is not limited to one address; they can access several Bitcoin
    addresses in their wallets. These addresses are mapped to unique non-public/public
    key pairs through transformation characteristics [18]. A transaction among addresses,
    say, a and b, is expressed as:'
