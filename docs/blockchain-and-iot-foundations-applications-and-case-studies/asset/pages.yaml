    People who reside or work in large urban areas frequently depend on car sharing
    to avoid some of the responsibilities associated with owning a car, such as finding
    parking, car payments, and insurance. According to information on the Enterprise
    CarShare website [4], car sharing enables users to use or rent a car for any duration,
    for say, a minimum of one hour. Another illustration of a car sharing business
    is Zipcar [5].


    Car sharing has its challenges. Though the service ensures that one doesn''t have
    to pay for fueling, etc., customers are often faced with the challenge of finding
    specific parking and fueling stations that are in collaboration with the respective
    car sharing company. Another challenge for the car sharing companies is managing
    the fueling card. Once the customer fuels the car through authorized fueling stations,
    they must use a fuel card and it is associated with a PIN. It''s not only inconvenient
    to customers but it''s inconvenient to car sharing companies to manage these cards
    because the fueling gets lost/stolen or fraudulently sold on the internet.


    Siemens Mobility is actively working on a blockchain solution to address these
    challenges and enable secure transactions. Blockchain seamlessly integrates the
    interacting parties such as car companies, garage providers, fueling stations,
    and customers.


    At Bosch''s 2019 Connected World conference, the Siemens Corporate Technology
    team detailed the concept of “blockchain-based smart parking” as one possibility
    of blockchain usage.'
