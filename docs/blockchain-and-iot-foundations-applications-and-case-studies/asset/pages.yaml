  md: '![](img/7237166d8c6f79ea99cc6e305e5ec1f5_97_0.png)


    FIGURE 6.13 Activity diagram.


    # ARCHITECTURE


    The architecture represents the overall working of the parking system (Figure
    6.14). It is implemented in two modules: hardware implementation and web server.
    Both modules update the status of the parking slots and display the output on
    a screen. In the first module, we implement the hardware component to develop
    the parking system using the Arduino board. The Arduino board works as a microcontroller
    and controls the overall system. There is an entrance and exit gate in the parking
    system that is used to allow the vehicle to enter the system.


    The IR sensors are used to sense the vehicle and send a signal to the Arduino
    about the vehicle''s status. The Wi-Fi module is used to integrate the Arduino
    with the web server that updates the parking slot status.


    The web server is developed using Arduino IDE, which is used for updating the
    parking slot status for users. In the web server, users can select the location
    and particular parking area. When the particular area is chosen, the web server
    will display the slot status to the users.


    The slot details are stored in the database to maintain the records. The admin
    can monitor the parking system regularly and update the status every three minutes.
    This system will help the user to know the current availability status and reduce
    the time to search for parking.'
