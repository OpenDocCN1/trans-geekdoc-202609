    # ARCHITECTURE OF IOT LAYERS


    IoT in healthcare systems is essential for collecting, sharing, and transmitting
    data among devices in a way with high speed [2, 8]. Sensors in healthcare include
    the pulse oximeter, ECG sensor, temperature sensor, and sphygmomanometer. IoT
    uses several protocols like MQTT, CoAP, TCP, and WebSocket for data transmission
    [9, 10]. The network technology used for IoT includes cellular technology up to
    5G, Bluetooth, Wi-Fi, RFID, and low-power WAN. Smart healthcare devices collect
    a lot of data and these devices are used in remote villages where people can self-monitor
    themselves and diagnose with doctors [11–13].


    IoT can be classified into five different layers (Figure 9.1). They are the perception
    layer, which is used to transform analog signals to digital and digital signals
    using sensors and actuators. The network layer is used to communicate between
    physical devices using some protocols like Wi-Fi, Ethernet, Zigbee, MQTT, and
    HTTP [14]. The processing layer is used to capture, store, and process data for
    further requirements. The application layer is used to make decisions for business
    models once the data is analyzed. The business layer is used for business models
    with the processed data [3, 5, 16].


