  md: 'database. As mentioned, there are several mining techniques or algorithms,
    including proof of work, proof of stake, proof of area, proof of significance,
    degree of trust, minimum block hash, and practical Byzantine fault tolerance.
    Proof of stake calls for less computing strength than the proof of work.


    # # SELFISH MINING


    Blocks are brought to the blockchain and mined via miners. There are miners with
    their own mining powers, mi, such that Σ = n. To check the validity of a block,
    hard crypto puzzles are solved by miners. Sometimes puzzles are too hard for one
    miner to solve, therefore, miners will pool together to collect enough computing
    strength. Miners get their rewards in bitcoins when they solve the puzzle.


    Extra energy will increase the rewards and the possibility of solving the crypto
    puzzles. Mining pools result in two types of companies: honest and egocentric
    [21, 35].


    Egocentric miners convince the genuine miners to fix state blocks with the aid
    of a forking blockchain, creating a copy of the blockchain (Figure 1.6). As a
    result, they waste their computing energy in futile. Mining should be sincere
    and incentive-free. If a couple of block is introduced through miners, they create
    a fork into branches of a tree referred to as Merkle tree, which can be difficult
    or smooth depending on the basis of old and new regulations.


