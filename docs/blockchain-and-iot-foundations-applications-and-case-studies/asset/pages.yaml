    tolerance (PBFT), and delegated proof of stake (DoPOS). Some other mechanisms
    are proof of authority (POA), proof of bandwidth, proof of elapsed time (POET).

    iv. **Contract layer:** It is the lowest layer to make a blockchain operational
    via sophisticated programming. Examples are Ethereum and Definition. There are
    vulnerabilities in contracts, errors in encoding, cryptography,aligned incentives,
    transaction ordering, timestamp dependence, mishled exceptions, reentrancy, and
    data feed.'
