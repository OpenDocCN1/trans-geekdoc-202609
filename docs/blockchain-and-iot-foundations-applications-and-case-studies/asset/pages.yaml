- pgno: 186
  md: '# RESULT ANALYSIS


    The primary aim of the research is to provide a secure system that is the most
    trustworthy and if the data stored in the model is dependable and cannot be changed
    by anyone else. This blockchain-based system makes sure that the model maintains
    this method. Data that stored in the model can only be changed by an authorized
    person. Other than that, the record data can be accessed only by doctors and patients.
    Doctors, patients, or any other person in the system cannot make modifications
    unless they access to it. This makes sure that the information is private or the
    record of the patient cannot be accessed by everyone and stays tamper-proof. The
    private details of the patient are stored and a hash is created for the stored
    information. This hash is now stored and used when healthcare workers and patients
    need it. The hash is secured cryptographically. This is used to maintain security
    in our proposed system.


    Performance-wise, we used Apache JMeter to evaluate our system. By using JMeter
    we simulated 100–500 users (with a period of 10 to 35 minutes) of the system''s
    different functions. The throughput of the JMeter is defined as Data/time, which
    is KB/sec units. It was observed that when the amount of requests and the users
    increased, there was an increase in the throughput in a linear manner. Hence,
    results showed that the system worked efficiently. Simulations were run on our
    proposed model to analyze the throughput.


    The graphical representation of the results are shown in the following Figure
    10.28.


    When the transaction number increased, the execution time of the system increased.
    These transactions are for the different functions present in the smart contracts.
    When a single user uses the system, the functions for registering patient details,
    adding patient medical records, and viewing patient medical records would take
    2.29, 4.3, and 3 seconds, respectively. The execution times increase when 100
    users use the system at the same time.


    ![](img/7237166d8c6f79ea99cc6e305e5ec1f5_186_0.png)


    FIGURE 10.28 Throughput.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Integrating Blockchain in Healthcare to Secure Data


    # CONCLUSION AND FUTURE WORK


    This blockchain framework can be used by healthcare facilities to overcome the
    limitations of the current way of storing data. Blockchain technology is the key
    to enhancing privacy and preventing in data breaches. The sharing of patient data
    between the concerned parties can be done in a safe and secure manner. Blockchain
    is the stepping stone to a more transparent healthcare industry. Thus, blockchain
    revolutionize healthcare sectors by providing privacy, accessibility and trust
    to medical records. The use of blockchain can further help in implementing a payment
    module in our existing blockchain structure. To implement, the researchers have
    to decide on the amount a patient would be willing to consult a doctor in a decentralized
    model in blockchain. Certain policies and rules related to healthcare divisions
    also need to be made.


