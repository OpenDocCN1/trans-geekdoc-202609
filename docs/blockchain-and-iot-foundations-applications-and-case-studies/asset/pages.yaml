  md: '# Review of Blockchain Technology Used in Industrial Solutions


    restrict users'' access to information using these apps. This allows for the privacy
    of confidential information while sharing essential information with other supply
    chain participants. Secure cloud gateways are used to package and send data from
    IoT sensors, shop floor systems, and tools to the blockchain. Siemens is busy
    creating IoT sensors and modules for its current software in order to send data
    straight to the blockchain.


    The Boston Consulting Group (BCG) analysis report [3] compared an IoT solution
    to blockchain with an IoT solution without blockchain, and it came to the conclusion
    that the solution with blockchain could “achieve net savings up to 6.6% of revenues”
    on logistics and storage alone. Real-time traceability and smart contracts, which
    enable better inventory management, brokerage fees, fraud protection, and other
    advantages, are largely responsible for these advantages. complete traceability
    document can be created as supply blind spots become clearer. This document can
    speed up root-cause analysis and shorten recall times. Brand owners and consumers
    can verify the genuineness of products or other central statements from blockchain
    by utilizing custom rules and smart contracts.


    # DISTRIBUTED AND TRANSPARENT MANAGEMENT OF ELECTRICITY AND ENERGY DISTRIBUTION


    Automated pay-per-use, created by Siemens Energy, enables utilities to pay for
    upgraded services as they are used in exchange for a portion of the price when
    revenue is produced. (i.e., electricity is successfully sold). Blockchain makes
    sure that the power plant’s profit is computed and distributed proportionally.
    This translates into ability to shift services that have high capital expenditure
    (CAPEX) for businesses into operating expenses (OPEX), leading to new financing
    models for Siemens Energy’s goods and services. It is no longer required to amortize
    all costs at once, only the costs of installation when necessary and the costs
    associated with each use. Therefore, it is feasible to produce energy while accurately
    estimating and paying the upfront and ongoing costs. Customers and solution providers
    will eventually share some of the operating risks, such as a plan. And this is
    where the paradigm truly makes a difference.


    In Spain, Siemens Energy has introduced an original blockchain platform for trading
    renewable energy that enables consumers to choose and reserve electricity from
    their preferred energy sources. The network, for first kind, uses the security
    and traceability offered by blockchain to enable online data management, report
    access, and the purchase and sale of renewable energy by producers, consumers,
    and retailers. Siemens Energy is also working on new business models based on
    blockchain for storage of digital identities, automated ordering, and 3D printing
    of spare parts (e.g., turbine parts) from suppliers.


    In order to provide microgrid control solutions that maximize control over energy
    usage, Siemens is also utilizing blockchain technology. This is not Siemens’s
    first foray into the world of microgrid development. In 2016, the team teamed
    up with US startup LO3 Energy. With the help of this new effort, it is possible
    to create local trading between energy producers and consumers.'
