    # Internet of Things (IoT)


    For protection, a blockchain can utilize an IoT infrastructure. There are challenges
    in IoT: system design (consolation bottleneck, lightweight design), facts management
    (tool renovation service management and discovery services), and protection (privacy,
    counterfeit, authentication, secure communication, and counterfeit hardware).
    Blockchain usage in IoT involves too overhead and scalability issues. Consequently
    to reduce the overhead and to beautify the authentication and authorization of
    factors, a three-layered modeling approach is proposed in [42–44]. In layer 1,
    there may be a cluster head of IoT devices and service offerings via local cluster
    heads. The cluster head is supposed to perform registration of the latest node,
    consultation key and control, and secure communication. In the second layer, cluster
    heads function under a base station and they gather and forward the data to the
    higher layer. Layer 3 collects the bottom stations to prepare the owner to control
    the tool to supply the statistics in the cloud server. IoT answers the challenges
    of hardware, records analytics, maintenance, mobility, safety, and logistics.
