  md: '# Blockchain-Based Online Attendance Management System


    ![](img/7237166d8c6f79ea99cc6e305e5ec1f5_111_0.png)


    FIGURE 7.1 System architecture.


    the system. In a university environment, faculty become the employees and they
    can use all the facilities as shown in Figure 7.1.


    # SYSTEM ANALYSIS


    An online attendance management system was developed with PHP. This online management
    system has several modules, including signup, login, teacher, student, admin,
    and attendance. In the signup module, the user can register in the system by providing
    the required details. For example, the e-mail column can only be completed with
    a valid mail ID. The password should be eight characters long and a combination
    of uppercase and lowercase letters. The username and password must not be the
    same.


    In the login module, the user can log in to the online attendance management system
    by giving their username and password. In the teacher module, the teacher can
    log in with their credentials to make the daily attendance of students. In the
    student module, the student can also log with credentials. If there is a mistake
    in the marked attendance, students can rectify it by informing the teachers. In
    the admin module, the admin can also log in by giving their credentials. They
    can check attendance status by date, and CRUD (create, read, update, delete) operations
    of the student list are performed. The attendance report counts the presence and
    absence of students.


    The proposed system helps to manage the student''s attendance without any buffering.
    Unlike PHP, there is no flexibility when compared to MERN stack. So, the web application
    is created with the help of MERN stack (MongoDB, Expressjs, Nodejs, Reactjs).'
