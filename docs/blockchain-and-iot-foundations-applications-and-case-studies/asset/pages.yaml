- pgno: 62
  md: '# BLOCKCHAIN IN IOT


    Blockchain''s primary innovation is the ability to achieve consensus among participants
    without reliance on a central authority. Blockchain technology makes use of advanced
    cryptography to provide extra characteristics such as decentralization, immutability,
    consensus processes, and smart contracts. The primary focus of advanced cryptography
    and blockchain technology provides a higher level of security and trust, in addition
    to opening new opportunities for a wide range of applications.


    Blockchain technology is being used for a variety of purposes, and although advanced
    encryption is an essential component, blockchain also provides a number of benefits
    that are entirely unique. Poor network visibility in an environment is the next
    security concern. As the number of devices in IoT is rising exponentially, providing
    generalized security for every device is becoming increasingly challenging.


    Because of the many IoT devices and dynamic factors, traditional information technology
    security requires accounting for every component linked to the network, which
    is not practical in IoT. There is still a problem with the link between mobility
    and security. Figure 3.2 lists the many types of IoT security vulnerabilities.
    Another critical vulnerability in the IoT context is ignorance among users. It
    would not be prudent to assume that users are aware of every possible method of
    attack and weak spots in the user environment. Users are less concerned about
    security vulnerabilities related to IoT device use and more focused on how convenient
    the devices are to use.


    Another factor contributing to IoT security problems is the way an IoT component
    uses the communication channel. Currently, several protocols are employed in the
    IoT communication system that have been the subject of security incidents and
    are known to adversely affect the whole networking system. Although there are
    many different kinds of assaults in an IoT context, some of the most frequent
    ones are follows:


    +   - **Physical tampering**: When devices are operated in an environment that
    is inaccessible to humans, there is a risk of unapproved tampering with the physical
    components of the device.

    - **Denial-of-service**: Denial-of-service assaults are among the most common
    in cloud and IoT environments. They cause the entire network and servers to go
    down, making it simpler for intruders to get onto the system or carry out harmful
    goals.

    - **Firmware jaacking**: If the system is attacked, firmware updates may also
    be affected. When a compromised firmware update gets into devices, it affects
    the devices as well as authentication of the firmware update''s origin point is
    unsuccessful.

    - **Injection of malicious node**: The attacker manually inserts the harmful nodes
    into the topical, everyday IoT gadgets. The malicious nodes are capable of illicit
    data sniffing and other types of unlawful network control.'
