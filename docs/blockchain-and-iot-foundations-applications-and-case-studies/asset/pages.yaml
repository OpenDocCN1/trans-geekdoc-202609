    In a blockchain peer-to-peer (P2P) network, each node maintains a copy of the
    entire blockchain ledger, and each new transaction that occurs on the network
    is broadcast to all nodes in the network. This ensures that all nodes have the
    same version of the blockchain and that all nodes are aware of all transactions.
    When a new block is added to the blockchain, each node in the network verifies
    the transactions in the block and checks that the block has been added in a valid
    way according to the consensus rules of the network. If the block is valid, it
    is added to each node''s copy of the blockchain, and the process continues. Because
    the network is decentralized, there is no central authority that controls the
    blockchain, and transactions can be validated without the need for intermediaries.
    This makes the blockchain P2P network secure and resilient, it is not vulnerable
    to a single point of failure or attack.


    # STEPS TO CONNECT BLOCKCHAIN IN A P2P NETWORK:


