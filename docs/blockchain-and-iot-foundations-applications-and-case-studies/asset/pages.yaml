    # MODULES DESCRIPTION


    # Selection of Location and Area


    This module is used to select the location and area to search for parking slots.
    The user will choose the location. This module will be accessed by using GPS to
    select the location. By using this module, the user can check the status in the
    area they desire.


    # Check Slot Status


    The slot status is displayed on the LCD and on the web server. The LCD display
    will be affixed in the parking system and used to display the status to users
    who are entering the parking system. The web server is for mobile users and displays
    the status integrates with the parking system.


    # Updating of Slots


    This module can be controlled by the admin side. The admin will monitor the parking
    area and update the parking slot status every three minutes. The slot details
    will be stored in the database server.


    # Visualization


    The generated results are visualized in a web server, which makes the parking
    process easier. The web server is monitored and controlled using the Arduino.


