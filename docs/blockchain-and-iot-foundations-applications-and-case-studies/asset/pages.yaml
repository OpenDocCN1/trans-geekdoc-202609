    # BYZANTINE FAULT TOLERANCE ALGORITHM


    A distributed network can achieve consensus (agreement on the same value) with
    the use of a feature known as Byzantine fault tolerance (BFT), which allows some
    nodes to answer incorrectly or fail to respond at all. The goal of using a BFT
    technique is to prevent faulty systems by utilizing group decision-making (including
    right and fault nodes), which seeks to lessen the impact of the malfunctioning
    nodes. The Byzantine generals’ problem gave rise to BFT (Figure 9.6).


    In a BFT-based blockchain network, a consensus protocol is used to ensure that
    all nodes agree on the validity of transactions and the state of the blockchain.
    This


