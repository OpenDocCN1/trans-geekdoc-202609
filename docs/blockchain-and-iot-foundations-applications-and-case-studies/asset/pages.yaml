    # THE DIFFICULTY OF CONFIDENTIALITY AND SAFETY


    Although the safety solutions now being utilized on the web are deemed to be viable
    and able, applying them to IoT will not provide the desired results for the following
    purposes:


    +   * Nodes typically lack the computing power to carry out complex security measures.

    * Nodes used in many IoT systems might not be physically protected, leaving them
