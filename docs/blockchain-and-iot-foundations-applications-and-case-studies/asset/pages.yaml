    in the shared ledger. It exhibits a higher satisfaction level in consensus efficiency.
    In a peer-to-peer network, all nodes work together to reach a consensus by Byzantine
    consensus. There could also be an oral or written consensus. After a block miner
    signs the blocks and broadcasts them, the receiver signs a new block after verification.
