    # 28


    # Blockchain and IoT


    Advancements in blockchain technology increase the chances of solving IIoT difficulties.
    Bitcoin''s core technology is blockchain. Blockchain makes it possible for computer
    programs to send and receive messages or keep transactions in a widely accepted
    (peer-to-peer) fashion. Blockchain is swiftly gaining popularity and is mostly
    used for distributed storage, smart contract applications, and digital assets
    [3]. Applications that use the blockchain for IIoT include storage attributes
    (such as temperature, humidity, or location devices) and creating block challenge
    ledgers that are understandable by certain users, particular contributors of the
    supply chain. Blockchain technology has transmitted from an unworkable approach
    to a reliable approach to problem-solving.


    Smart contracts (SCs) have been used in digital economics based on blockchain
    2.0 in an automatic way, whereas blockchain 1.0 is generally associated with cryptocurrencies
    and overhead (for example, Bitcoin). The focus of more recent blockchain 3.0 is
    on meeting the demands of the digital world, as Industry 4.0''s concerns with
    smart cities. IIoT continuously energizes Industry 4.0. Industry 4.0 is associated
    with IIoT. Though one might regard IIoT as an improvement of IoT, it also involves
    a further focus on IIoT in industry. Industry 4.0 is frequently associated with
    ethical manufacturing workplaces groups.


    The blockchain''s internal secular and spatial data can be found and verified
    traceability. each data block stored within a blockchain has a suitable timestamped
    to, ensuring data discovery.


    With IIoT and physical equipment, interoperability may exchange data. Building
    an early P2P network on with persistent access across many IIoT methods will enable
    interoperability within the blockchain composite layer.


    The potential for IIoT to operate without the interference of a trusted third
    party (TTP) is discussed in autonomous interactions. Blockchains enable smart
    contracts to attain this autonomy. Particularly, contract clauses encircle by
    smart contracts will be habitually enforced after a specific circumstance is met.


