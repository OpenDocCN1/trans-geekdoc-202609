    # Chapman & Hall/CRC Internet of Things: Data-Centric Intelligent Computing, Informatics,
    and Communication


    The role of adaptation, machine learning, computational Intelligence, and data
    analytics in the field of IoT Systems is becoming increasingly essential and intertwined.
    The capability of an intelligent system is growing depending upon various decision-making
    algorithms in IoT Devices. IoT based smart systems generate a large amount of
    data that cannot be processed by traditional data processing algorithms and applications.
    Hence, this series invokes different computational methods embedded in the system
    with the field of Analytics Reasoning, learning methods, Artificial intelligence;
    and Sense-making in Big Data, which is most concerned in IoT-enabled environment.


    This series focuses to attract researchers and practitioners who are working in
    Technology and Computer Science in the field of Big Data, machine learning. Sensor
    data, Internet of Things, and data sciences. The main aim of the series is to
    make available a range of books on all aspects of learning, analytics and advanced
    intelligent systems and related technologies. This series will cover the theory,
    research, development, and applications of learning, computational analytics,
    processing, machine learning algorithms, as embedded in the fields of engineering,
    computer science, and Information Technology.


