    be in “sleep mode” to conserve power, or it might be mobile and not accessible
    at the moment.


    ## THE SUSTAINABILITY CHALLENGE


    Conventional processing nodes can be improved or modified by customers, but it
    is not suitable when it comes to IoT devices like cars, ovens, or fridges. Update
    cycles of IoT, raise concerns regarding the durability of such nodes in a linked
    society. For example, will the nodes upgrade their operating system over time,
    or will this result in a fragmented network with insecure hardware?


    When installing IoT instances, a node can also be a part of advanced communication
    systems or a remote installation that takes the place of labor-intensive, expensive,
    or impractical techniques. Building a bridge over a river, for instance, temperature
    and earthquake sensors with fire alarms as well as pollution finding sensors are
    commonly installed.


    ## THE DIFFICULTY OF THE TRUST APPROACH


    The improved communication opportunities between the virtual and real worlds are
    maybe the most important improvement brought forth by IoT. IoT has conceptualized
    to include common nodes as devices, which will greatly alter the course of our
    lives. A reliable technique is sought to enable successful and fruitful communication
    between these nodes with little or no interference from individuals. The system
    must take into account valid sensor and actuator performances, which occasionally
    occur during severe crashes. Communication should be permitted as well with the
    help of reward–responsibility-based techniques [9].


    ## IIOT DIFFICIES


    IIoT ensures the connectivity of diverse things using a variety of actuators.
    Sensors and software systems are installed to detect and gather data from the
    actual environment, and these devices should generate actions in a subsequent
    manner. The unique features of IIoT provide a chance to study a number of examination
    issues. Information and communication technology (ICT) advancements in recent
    years have made it possible to overcome some of the fundamental limitations of
    IIoT. For example, interactions with ambient backscatter can help IIoT devices
    and increase power. Additionally, by shifting the process-intensive tasks to edge
    servers, mobile computing can increase the functionality of the IoT device. Additionally,
    current advancements in blockchain technologies bring difficulties, including
    inadequate interoperability, safety, and confidentiality vulnerabilities.


    ## BLOCKCHAIN TECHNOLOGY: AN OVERVIEW


    ### BLOCKCHAIN


    A distributed ledger that throughout an entire distributed system is referred
    as a blockchain. With decentralized permission, blockchains can enable contracts
    to take place and validate collectively distributed things. Blockchains can, perform
    decentralized contract confirmation, leading to lower costs and traffic operation
    in the centralized organization. Additionally, as every node in the network keeps
    a record of the completed transactions all transactions saved in blockchains are
    impenetrable. Meanwhile, cryptographic techniques ensure the data block''s integrity
    inside the blockchain. As a result, blockchains can ensure that communications
    are not lost [10]. All contracts can be tracked thanks to the significant timestamp
    that was assigned. A blockchain is made up of neatly organized parts called blocks
    that have headers with transaction information. By using a predecessor''s hash,
    the predecessor reflects the header and metadata-related information. Within the
    initial block, known as the genesis block, which has no old model or method, the
    first position is encoded in a hard seed. Merkle trees are used for hashing the
    transactions that are based on Ethereum and Bitcoin. A blockchain instance with
    blocks and repeated chain is depicted. With the help of the parent hash value,
    every block in a blockchain points to its immediately previous block (referred
    as the parent block). For instance, block i contains the block i - 1.


    - Block version: The validation rules to be followed.

    - Hash of parent block: represents the 256-bit hash value of the first block.

    - Merkle tree root hash: Holds the hash values for each transaction contained
    within the block.

    - Nonce: A 4-byte value that typically starts with 0 and rises for all hash calculations.

    - Timestamp: Starts on January 1, 1970, and has in seconds in UTC.

    - A true block hash threshold is nBits.


    ## IoT and IIoT Powered by Blockchain


    ### CONSENSUS ALGORITHMS


    The major advantage of blockchain techniques is the ability to verify the constancy
    of the block in decentralized, desponent settings that need the authorization
    of a trusted third party. However, a consensus is required in distributed contexts.
    The agreement may be biased in favor of good devices, therefore, it must be obtained
    on a newly constructed block. Consensus methods are often used to attain this
    level of reliability in decentralized systems. Practical Byzantine fault tolerance
    (PBFT), proof of stake (PoS), and proof of work (PoW) are common consensus algorithms.
    Consensus algorithms are an essential piece of the puzzle for effective blockchain
    operating rules they safely update duplicated distributed conditions.


    ## WORKFLOW OF BLOCKCHAINS


    The following shows a functional instance of the blockchain. The method of money
    transfer is as follows:


    - Step 1: Transfer cash from person A to person B.

    - Step 2: A Bitcoin wallet is used to begin the contract at a system. The transaction
    confirms the recipient''s address, the sender''s wallet, and the total amount
    of currency.

    - Step 3: A block represents the online transaction. The block is advertised to
    every node in the network using the next three steps.

    - Step 4: Network members confirm the transaction''s validity.

    - Step 5: After that, a verified transaction is added to the top of the contract''s
    chain, creating a new block inside the blockchain.

    - Step 6: The money is transferred from person A to person B.


    ### SMART CONTRACT


    Blockchain-based smart contracts are programmable programs that control transactions
    under certain conditions. Smart contracts are created on blockchain technology,
    which raises great interest among the stakeholders and several enterprises. Due
    to this, it has become a technology that is welcomed in enabling the automation
    of digital processes among the parties to be verifiable and enforceable.


    Smart contracts have their own blockchain accounts and addresses, which is why
    they are sometimes referred as "independent agents".


    In order to complete the predetermined criteria, the contract may gain ownership
    of tokenized assets while designing the contributor as the employee. IoT and financial
    services are just two of the areas that the smart contract has the potential to
    change. Smart contracts are frequently used on a blockchain network to carry out
    and advance aims, as as:


    1. Allowing transactions to be initiated automatically by specific actions. This
    function can take many different forms, such as automatic transmissions at regular
    intervals or transmissions in response to earlier transmissions.

