    # CONCLUSION


    Many advancements in science and technology have changed the healthcare sector.
    Blockchain technology is implemented by Byzantine fault tolerance, a consensus
    process for IoT data security. This project proposes a modified PBFT in which
    the consensus process incorporates the mechanism for identifying fault nodes and
    resisting those nodes. The P2P network using BFT increases the consensus efficiency
    and performance speed. By using the BFT algorithm, blockchain transactions on
    IoT-based electronic health records are committed to the nodes in the distributed
    system and the speed of transactions between nodes is increased. Finally, electronic
    health record data are stored in edge servers so that the data storage problem
    can be reduced.


