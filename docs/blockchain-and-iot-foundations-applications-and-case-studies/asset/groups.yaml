    # 区块链与物联网


    这是通过投票过程实现的，网络中的节点对新交易的有效性以及这些交易在区块链中的排序进行投票。BFT 共识的一种常见方法是实用性拜占庭容错（PBFT）协议。在
    PBFT 中，由一个指定的（头者节点负责向网络提议新交易。其他节点对所提议交易的有效性进行投票，只有当特定数量的节点对其进行了验证后，代表交易的新区块才会被添加到区块链中。


    近年来还开发了其他基于 BFT 的共识机制，例如 Cosmos 网络使用的 Tendermint 共识，以及以太坊网络使用的 Clique 共识协议。BFT
    共识机制提供了显著的安全性和容错性，使其适用于对信任和可靠性至关重要的应用场景。然而，基于 BFT 的共识机制计算开销可能很大，并且可能需要高度的网络协调，这使得它们不太适用于较小的网络或交易量较低的应用。


    分布式系统中使用的拜庭错误容错算法的许多思想被引入到区块链的实用版本中。在这种情况下，通过达成共识来确定区块是否真实。系统节点相互通信以将区块添加到链中。在这种场景下，恶意节点可能会对区块发出警告，因此，如果区块被最大数量的节点接受，网络就会认为该区块是真实的
    [15]。


    系统比中心化系统更容易受到拜庭虚假信息的影响。这些问题是系统节点虚假信息的结果。分布式系统的成员在很大程度上不知道这些错误或错误信息的原因。识别该节点是恶意还是缺陷是非常有挑战性的，因为它可能表现异常，并对网络中的节点提供各种响应。因此，为了识别故障节点，系统主机必须达成共识。一种不受坏节点或故障节点影响而做出决策的机制被称为具有拜占庭容错能力的系统
    [30]。


    > BFT 共识包含三个步骤：


    - 1. 预准备（Pre-prepare）：每个备份节点通过预写的消息接收来自头者节点的通知。

    - 2. 准备（Prepare）：在收到来自头者的预准备响应后，备份节点向所有剩余节点（包括头者）回复准备好的消息。节点在观察到来自其他节点的 (f + 1)
    份准备好的数据并从头者处获取了预准备信息之前，该节点无法进入准备状态。

    - 3. 提交（Commit）：节点如果已准备绪，则发送名为 commit 的消息。如果节点看到 (f + 1) 份提交消息，它将执行客户端的请求。


    拜庭故障主要分为两类：任意节点故障和故障停止（fail-stop）故障。随机节点故障的几个示例是：


    - 不产生结果。

    - 得出错误的假设。

    - 回复具有故意误导性的结果。

    - 回复各种系统组件具有不相同的影响。


    # 区块链驱动的医疗健康数据安全解决方案


    在区块链点对点（P2P）网络中，每个节点都维护整个区块链账本的副本，网络上发生的每笔新交易都会广播到网络中的所有节点。这确保了所有节点拥有相同的区块链版本，并且所有节点都了解所有交易。当新区块被添加到区块链时，网络中的每个节点都会验证区块中的交易，并检查该区块是否已根据网络共识规则以有效的方式添加。如果区块有效，它会被添加到每个节点的区块链副本中，该过程持续进行。由于网络是去中心化的，没有控制区块链的中央机构，交易可以在不需要中介的情况下进行验证。这使得区块链
    P2P 网络既安全又具有韧性，它不受单点故障或攻击。


    # 在 P2P 网络中连接区块链的步骤：


    - 考虑网络中要连接的节点数量。

    - 每个节点都充当客户端-服务器节点。

    - 为每个连接的节点制作一个 IP 地址。

    - 在命令提示符上搜索新状态命令以查找可用端口地址。

    - 运行区块链程序在边缘服务器上建立 P2P 网络。


    # 建议的工作


    进行了一项模拟测试，生成了伪健康保健数据并将区块链应用于每个患者的详细信息。这些加密信息通过 P2P 网络连接在分布式网络中。该 P2P 是使用 Python
    程序实现的。每个节点都根据边缘服务器的可用端口地址进行了完全检查，并在所有节点中实现了拜占庭容错算法。图 9.7 描述了所建议工作的模型。


    图 9.8 显示了将区块链应用于患者健康详情的模拟结果。图 9.9 显示了未应用 BFT 时节点 2 的结果，图 9.10 显示了在 P2P 网络中应用 BFT
    的结果。观察到，节点 2 连接到 P2P 网络发送数据所需的最少时间为 2 ms，最大 3 ms，平均 2 ms。当节点 2 使用拜占庭容错连接时，发送数据所需的时间最少为
    1 ms，最大 3 ms，平均 1 ms。因此，BFT 算法中的交易提交消息的时间更短。结果显示，与拜占庭容错算法相比，P2P 网络中没有拜占庭容错算法的区块链交易花费的时间更多。


    ![](img/7237166d8c6f79ea99cc6e305e5ec1f5_162_0.png)


