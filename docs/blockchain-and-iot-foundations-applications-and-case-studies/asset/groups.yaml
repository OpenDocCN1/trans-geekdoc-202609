    ## 区块链的架构、安全与隐私


    ## 云


    云是一个区块的网络，而区块链的节点数据库被视为大数据。因此，由于其规模、体量、真实性和速度，区块链需要云端来存储和管理该数据库。


    ## 治理


    人们希望增加金融机构的数字传输，以及重要政府记录、土地登记、患者记录等的数字化程度。目前，灵活的规章可能需要进行标准化和监管，以应对攻击、威胁和脆弱漏洞。


    ## Corda


    Corda 是一种公共数字账本技术，而不是区块链，因为它创建了一个消息和其他信息流动的网络。它更可靠、透明、不可篡改、降低风险、灵活且受监管。它通过记录财务协议、验证双方之间的交易以及以受监管和监督的方式提供完美的信息流来控制金融交易。Corda
    自动生成代表个人法律权利的法律文件。Corda 适用于用例。缺点是会生成数百万个持久线程 [38]。区块链权限与普通权限不同，因为它并不更安全。它可以连接到任何节点，节点可以向区块链添加区块。


    ### 应用


    在经济意义上，传统的比特币需要内置的激励或奖励、一个中心化和去中心化的比特币经济系统、货币交易所、混合器、数字钱包服务和矿池（图 1.8 和图 1.9）。存在帮助比特币开发的中间机构
    [14]：


    - i. **货币交易所**：类似于传统货币，其收取 0.2% 到 2% 的费用。

    - ii. **数字钱包**：钱包账户信息、私/公信息以及记录交易。某些用户使用提供广泛服务的私有钱包。文件通过网络服务器或手机共享。

    - iii. **混合器**：交易按随机顺序混合，以防止对交易的任何猜测或跟踪。

    - iv. **矿池**：比特币在矿工解决谜题后被许可（需要高大的计算能力）。因此，不是只有一个矿工，而是将矿工排成行以加速过程。


