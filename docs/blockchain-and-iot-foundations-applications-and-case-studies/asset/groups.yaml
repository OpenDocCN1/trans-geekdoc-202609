    ## 利用区块链与星际文件系统


    ## 应用层


    ![](img/7237166d8c6f79ea99cc6e305e5ec1f5_57_0.png)


    ![](img/7237166d8c6f79ea99cc6e305e5ec1f5_57_1.png)


