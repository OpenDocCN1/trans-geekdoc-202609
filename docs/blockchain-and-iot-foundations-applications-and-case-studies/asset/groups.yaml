    # 2 Internet of Things and Industrial Internet of Things Powered by Blockchain

    A Study on Unleashing Potential


    S Sandhya, M Senthil Kumar,

    B Chidambambarajan, and S K Susee


    # INTRODUCTION


    The Internet of Things (IoT) is an effective internet and managerial setting that
    works together to create a world that is intelligently interconnected [1]. IoT
    users can broadcast the data that they place on the server where it can be intelligently.
    At present, IoT is being used in many contexts, such as corporations, industries,
    environmental engineering, mobile devices, and governance. IoT also helps paid
    the transportation, healthcare, agriculture, energy, and environmental management
    industries. IoT supports many commercial initiatives in the fields of services,
    manufacturing, logistics, and food production. Academics and businesses have paid
    a lot of attention to Industrial IoT (IoT), which could be very important in the
    upcoming conversion of industrial schemes. IoT plays a vital role in Industry
    4.0, and it is also one of the most important topics in academics and politics.
    The major difference between IoT and IoT is that whereas IoT is frequently applied
    in applications like smart factories and smart manufacturing, IoT environments
    frequently feature a variety of automation equipment and industrial devices.


    IoT provides connectivity to industrial systems through the help of drives, sensing
    devices, a pervasive network, and processing power. Implementing IoT is intended
    to increase manufacturing efficiency and business productivity, lessen device
    downtime, and raise the caliber of the final output. Specifically, IoT features
    the following characteristics: decentralization of IoT systems, a variety of IoT-based
    applications, schemes, heterogeneity of IoT-based information, and net-work strain
    [2].'
