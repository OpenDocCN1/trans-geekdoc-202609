    # CONCLUSION


    The chapter analyzes the smart ways of monitoring child health using noninvasive
    sensors. Using textile biosensors, the constant monitoring of health parameters
    is detected. Child health monitoring is one of the prominent factors to check
    and monitor the growth of a child. The system can detect any abnormalities in
    their health conditions. A machine algorithm is used for gathering the information
    and to monitor the general status of their health conditions. These types of physical
    and smart biosensors are small in size, flexible, low in cost, and low in power
    consumption. Everyday monitoring identifies the behavioral and physiological conditions
    of an infant or child. The proper way of analyzing the behavioral and physiological
    parameters of a 0–3 years and 6–10 years of age is determined. In this futuristic
    approach, the detection of ailments by analyzing the different diseases can be
    analyzed. Using the comparative approach over the dataset of records, the random
    method forest has the highest accuracy at 86% than the two other algorithms. The
    machine learning approach is widely used in modern healthcare applications as
    it attains precise results and good performance accuracy.


