    The fusion of IIoT and blockchain is a new, rapidly expanding trend. This chapter
    provides an overview of IIoT applications because blockchain technology can help
    in overcoming IIoT problems. Blockchains have a wider range of applications than
    other technologies. This study is mostly about industrial applications.


    # BLOCKCHAIN SECTOR


    # FOOD IoT


    BIIOT makes a commodity''s life cycle more visible, especially in the food sector.
    Food product traceability (FPT) is essential for ensuring that the food is protected.
    The entire food supply chain is guaranteed by FPT along with IoT. For instance,
    a company that manufactures food might be recommended by several suppliers. The
    entire food manufacturing business must digitize information from sources. Blockchain
    technology can ensure the food''s provenance and tracking capabilities through
    this process. An RFID and blockchain-based supply chain platform in China connects
    farmers and food producers. The purpose of this system is to make sure the food
    supply chain can be tracked.


    Further, blockchain technology can help increase protection by making tractable
    food production more accessible. It demonstrates how integrating blockchain into
    the food supply chain can enable clients to trace the entire process of food production.
    Researchers have offered a blockchain application case for the industry of natural
    coffee in Colombia. It provides a facility to trace the food protection system
    that is supported by blockchain technology and electronic product code (EPC) IoT
    tags. Through smart contracts, this technology can specifically stop the interception
    and disclosure of confidential information. To demonstrate its effectiveness,
    a model of the proposed architecture has been put into.


    # SMART MANUFACTURING


    The manufacturing sector is moving from mechanical to smart techniques. Big data
    analytics is crucial to this advancement in the manufacturing industry. A huge
    amount of information is produced during each stage of a commodity''s life cycle,
    including the procurement of raw materials, designing, sharing, manufacturing,
    after-sales repair, and selling of manufactured goods. However, information aggregation
    and analytics are required due to the fragmented nature of the production data.
    The interoperability problem is solved by IIoT by integrating the IIoT-based systems
    through P2P networks, which facilitates the sharing of information among the various
    industrial sectors. For example, several distributed blockchains, are commonly
    constructed to support diverse industries. Through IIoT, security in smart manufacturing
    can be enhanced [12].


    The majority of enhanced firmware is physically installed at IIoT nodes after
    being distributed from a central server. The firmware updates must be organized
    in a distributed fashion, which is expensive and time-consuming. The work offers
    that the entire industry is organized around smart contracts that handle firmware
    improvement strategies. Smart contracts are implemented by design and can be used
    by nodes to install and import firmwares. A decentralized blockchain-based autonomous
    manufacturing solution was put up to offer stronger security than the typical
    centralized architecture. In addition, blockchain was used to develop a mobile-based
    crowd-sensing system to address the issue of information in smart manufacturing.


    # IoT and IIoT Powered by Blockchain


    # HEALTHCARE SECTOR


    The rapid development in the field of digital technology plays an important role
    in the progress of healthcare services, which has the potential to free clinical
    data and offer a more practical means of enhancing healthcare outcomes and processes.
    Because hospitals have limited resources, healthcare services currently face new
    obstacles. recent developments in wearable technology and big data analytics in
    healthcare. As a result, hospital resources are regularly and effectively released.
    For instance, elderly people who live in their home medical devices continuously
    measure and collect data, including blood pressure, heart rate, and sugar level.


    Through healthcare networks, medical teams and lab assistants can access medical
    information at any time and from any location. However, using medical data raises
    concerns about security, privacy, and confidentiality. Blockchain-based network
    integration can successfully address issues with healthcare data and confidentiality.
    To support real-time patient observation, the healthcare data generated by medical
    sensors is on a routine basis, and based on the smart contract, it is broadcast
    to the system. Digital signatures can identify the owner of healthcare information
    and verify the validity of the information. This system can also safeguard the
    owner''s right to privacy when it comes to medical information. In order to offer
    confidentiality and secrecy, the present effort combines blockchain-based mobile
    edge computing with IoT to establish a framework for controlling in-home therapy.
    It also provides traceability and possibilities for patients who have contracted
    contagious viruses such as COVID-19, Middle East respiratory syndrome, and severe
    acute respiratory syndrome.

