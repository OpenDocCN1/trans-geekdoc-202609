    - ii. **Internet of Things**: Safety and privacy in applications [9].

    - iii. **Public and social services**: It is useful in land registration, education,
    insurance, freedom of expression, and energy where parties can share identities
    and control data privately and securely.

    - v. **Health**: Doctors use the validated correct block added to the blockchain
    to preserve the privacy of the patient. Health professionals share electronic
    health records (HERs) to diagnose and treat patients. Some measures as access
    control should be provided since health data is highly private. There should be
    the option to automatically remove data after certain uses or time. The size of
    healthcare data is also very large and needs separate off-chain storage strategies.
    For these issues, a Healthcare Gateway (HDG) is proposed. Table 1.6 lists blockchain
    uses in healthcare.

    - vv. **Reputation system**: Measures trustworthiness of users.

    - vi. **Socio-technical security**: This perspective acknowledges that effective
    blockchain security relies not only on cryptographic protocols and technical safeguards
    but also on understanding human behavior, user interactions, governance structures,
    and the socio-economic context in which the technology operates.


