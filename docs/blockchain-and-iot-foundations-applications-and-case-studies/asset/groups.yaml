    2. 它们允许所谓的多签名交易，即只有当指定或大多数参与者确认他们已签名时，交易才会发布。


    3. 允许存储特定的应用程序数据，例如成员记录、布尔值或列表状态。


    4. 它们让其他人的智能合约变得有用。


    例如，继承关系经常被包含在以太坊的智能合约中，其中单个合约可以引用它们所指定的目标。


    # 区块链系统分类


    区块链分为公链、私有链和联盟链三类。在无许可的公链中，每个人都可以参与新区块的分发和区块链数据的使用。公链被描述为去中心化的，因为每个人都可以通过协作确认新区块来保留区块链的副本。网络中的所有节点都是许可区块链的一部分，被称为私有链。私有链由单一公司批准，并由协调的人员或团队访问，其分布式数据库存储着不同人员或部门之间的数据交换。联盟链区块链类似于私有链。它是一个带有权限的网络。联盟网络连接了许多不同的组织，并允许参与者进行清晰的通信。


    # 将区块链与工业物联网 (IIoT) 集成


    IIoT 系统必须克服许多障碍，包括互操作性差、异构性、机密性担忧和安全漏洞。区块链技术可以通过增强机密性的同时增强互操作性来平衡物联网系统。区块链还能让
    IIoT 系统更加可靠和可量化。BIIOT 是区块链与 IIoT 结合的名称。


    # BIIOT 架构


    区块链复合层在该设计中用作物联网与工业应用之间的分配器。该设计提供了以下两个重要优势：用户访问基于区块链的服务以及一个来自 IIoT 基础层的理念。区块链复合层用于为下层提供异构性和足够的
    API 以支持工业需求。因此，由区块链复合层实现的概念有助于降低创建工业应用程序的难度。文中还显示了区块链复合层五个子层的描述。在典型的物联网架构和框架中，从下到上使用了子方案层概念。


    感知层允许各种物联网设备从其即时环境中感知并收集数据。这些设备包括执行器、传感器、RFID 标签、控制器和智能仪表表。


    通信层有助于构建工业网络。许多物联网设备可以通过 WAP-Wi-Fi 接入点、基站 (BS)、宏观基站和物联网网关进行连接。多种通信协议，包括近场通信 (NFC)、蓝牙、无线公路寻址远程变感器
    (WirelessHART) 以及带有 LoRa、Sigfox、工业以太网和窄带物联网 (NB-IoT) 的低功耗广网 (LPWAN) 技术，能够连接物联网传感器。


    使用物联网可以广泛维护各种工业应用。食品领域、制造业、智能电网和供应链是常见的工业应用。


    # IIoT 的部署


    由于计算节点，物联网节点很难保存整个区块链。存储有两种类型：部分存储和完整存储。部分存储将部分信息保留在本地。轻量级节点是部分存储节点的别名。完整存储保存整个区块链。完整节点是指整个存储节点（如边缘服务器和云服务器）。由于存储许多完整区块链，完整节点具有足够的处理能力来克服共识问题，而资源有限的完整节点是可以在不提取的情况下保证交易真实性的小设备。物联网设备通过与
    D2D 连接直接通信执行部分区块链信息的交换，物联网设备可以在 MBS 和基于 IIoT 的网关帮助下传输存储在边缘服务器中的区块链信息，这种通信被称为区块链与
    IIoT 之间的直接通信。边缘服务器与区块链之间的混合通信 [11]


    # BIOT 应用


    IIoT 与区块链的融合是一个新的、快速扩展的趋势。本章提供了 IIoT 应用的概述，因为区块链技术可以帮助解决 IIoT 问题。区块链的应用范围比其他技术广。本研究主要关于工业应用。


    # 区块链领域


    # 食品物联网


    BIIOT 使商品的生命周期变得更加透明，特别是在食品领域。食品产品追溯 (FPT) 对于确保食品受到保护至关重要。FPT 配合物联网共同保证了整个食品供应链的安全。例如，一家制造食品的公司可能会被几家供应商推荐。整个食品制造业务必须对来源的信息进行数字化。区块链技术可以通过这一过程确保食品的溯源和追踪能力。中国一个基于
    RFID 和区块链的供应链平台连接了农民和食品生产者。该系统的目的是确保食品供应链可以被追踪。


    此外，区块链技术可以通过使可追溯的食品生产更容易获得来帮助增加保护。它展示了将区块链集成到食品供应链如何让客户追踪食品生产的整个过程。研究人员为哥伦比亚天然咖啡行业提供了一个区块链应用案例。它提供了一个由区块链技术和电子产品代码
    (EPC) 物联网标签支持的食品保护系统追踪设施。通过智能合约，这项技术可以专门阻止机密信息的拦截和披露。为了证明其有效性，已经投入了所提架构的模型。


    # 智能制造


    制造业正从机械技术转向智能技术。大数据分析对于制造业的这一进步至关重要。在商品生命周期的每个阶段都会产生大量信息，包括原材料采购、设计、共享、制造、售后维修和制品的销售。然而，由于生产数据的碎片化，需要对信息进行聚合和分析。IIoT
    通过 P2P 网络集成基于 IIoT 的系统解决了互操作性问题，促进了各个工业部门之间的信息共享。例如，通常构建多个分布式区块链来支持不同的行业。通过 IIoT，可以增强智能制造的安全性
    [12]。


    大多数增强固件在从中央服务器分发后物理安装在 IIoT 节点上。固件更新必须以分布式方式组织，这既昂贵又耗时。这项工作建议整个行业都是围绕处理固件改进策略的智能合约组织的。智能合约通过设计实现，并供节点用于安装和导入固件。提出了一种基于区块链的自主制造解决方案，以提供比典型的中心化架构更强的安全性。此外，区块链被用于开发一种基于移动的人群感知系统，以解决智能制造中的信息问题。


    # 区块链驱动物联网与工业物联网


    # 医疗保健领域


    数字技术领域的快速发展对医疗服务的进步起着重要作用，它潜力释放临床数据并为增强医疗成果和过程提供更实用的手段。由于医院资源有限，医疗服务目前面临着新的障碍。近期可穿设备技术和医疗领域大数据分析的进展。结果是，医院资源得到了定期且有效的释放。例如，居住在家的老年人的医疗设备持续测量并收集数据，包括血压、心率和血糖。


    通过医疗网络，医疗团队和实验室助理可以随时随地访问医疗信息。然而，由于使用医疗数据引发了对安全、隐私和机密性的担忧。基于区块链的网络集成可以成功解决医疗数据和机密性问题。

