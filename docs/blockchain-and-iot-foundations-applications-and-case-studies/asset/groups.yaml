    ## OPEN SOURCE BLOCKCHAIN IMPLEMENTATION


    Bitcoin miners need cryptographic strategies, consensus methods, smart contracts,
    and peer-to-peer networks. There are diverse styles of proof strategies, including
    PoW, PoS, PBFT, and DPoS. The cryptography virtual signature algorithm is used
    for authentication. Public key encryption gadgets there are RSA, Diffie–Hellman,
    and elliptic curve cryptography.


