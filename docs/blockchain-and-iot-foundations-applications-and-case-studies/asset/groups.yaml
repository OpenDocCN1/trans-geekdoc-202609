    can help the death rate decrease. In the existing system, physiological systems
    require multiple ranges of electrodes. These electrodes are linked to which there
    is a wall-mounted display of units. In this research, the novelty is the use of
    wireless and biosensors, and biotype sensors that are easy and convenient to use
    Souri et al. [3] introduced IoT to monitor the behavioral and physiological conditions
    of students. IoT is used for healthcare monitoring where it detects biological
    and behavioral patterns of the student. By the experimental approach, the results
    are evaluated where they attain the proper accuracy of 99.1% in the range. Using
    different machine learning algorithms such as random forest, decision tree, and
    neural network, the results are determined.


    Abdullah al. [4] proposed a way to detect lower-back pain. A machine learning
    approach was used to diagnose the disease at an early stage. The significant vital
