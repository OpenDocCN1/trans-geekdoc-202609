    is very important to properly prescribe medicine to patients, with blockchain
    being capable of historically improving the healthcare infrastructure.


    A blockchain comprises records that are arranged in a block structure in an ordered
    manner. Each data block comprises a hash that is a unique identifier (like a digital
    fingerprint), hash of the previous block, and timestamps of recent transactions.
    Various blocks are linked in chronological order with this design, and the blocks
    that are connected are a blockchain. It''s virtually unfeasible to alter any of
    the blocks that are in the chain.


