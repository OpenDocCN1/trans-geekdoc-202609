    根据国际数据公司（IDC）2013 年的研究，物联网设备预计到 2020 年将增长到 410 亿个，价值达到 8.9 万亿美元。人类责任的缺失区分了物联网与传统互联网的使用。IoT
    节点可以产生人类活动数据、进行分析并选择最佳方案。IoT 服务已使提高生活质量成为可能。但在通过 IoT 设备提取人类界面数据时，隐私和数据保护至关重要。


    ## 物联网障碍


