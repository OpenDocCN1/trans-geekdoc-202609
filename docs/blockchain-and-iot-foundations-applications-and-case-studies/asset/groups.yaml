    and so on. Currently, flexible regulations may need to be standardized and regulated
    to cope with attacks, threats, and vulnerabilities.


    ## Corda


    Corda is a public digital ledger technology, not a blockchain, because it creates
    a network by which messages and other information flow. It is more reliable, transparent,
    immutable, reduces risk, flexible, and regulated. It controls financial transactions
    by recording financial agreements, validating transactions between two parties,
    and providing the perfect flow of information in a regulated and supervised manner.
    Corda automatically produces legal documents representing individuals'' legal
    rights. Corda is suitable for use-case. A drawback is the generation of millions
    of long-lasting threads [38]. Permissions of the blockchain are not like the regular
    ones because it is not more secure. It can connect to any node, which can add
    blocks to the blockchain.


    ### Applications


    In the economic sense, traditional Bitcoins need built-in incentives or rewards,
    a centralized and decentralized Bitcoin economic system, currency exchanges, mixers,
    digital wallet services, and mining pools (Figure 1.8 and Figure 1.9). There are
    intermediaries that helped in the development of Bitcoin [14]:


    - i. **Currency exchanges**: Like traditional currencies, it charges from 0.2%
    to 2%.

    - ii. **Digital wallets**: Wallets account information, private/public information,
    and recorded transactions. Some users use private wallets that offer a wide range
    of services. The files are shared through web servers or mobiles.

    - iii. **Mixers**: The transactions are mixed in random order so to prevent any
    guess or tracking of transactions.

    - iv. **Mining Pools**: Bitcoins are permitted by the miners after solving the
    puzzle (need high computational power). So instead of having only one miner, miners
    are kept in a row to speed up the process.


