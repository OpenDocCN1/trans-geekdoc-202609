    ## ISSUES AND CHALLENGES


    Since Bitcoin is a growing technology, it has limitations, including technical,
    business model, government regulation, and privacy challenges for personal data.
    Blockchains have the following issues and challenges. Bitcoin size is limited
    to 1 MB. It is mined and can handle several transactions per second; therefore,
    it requires a larger storage and lower propagation delay. It has no ownership,
    which results in a management issue. Other challenges are resource including energy,
    authentication, verification, cross-lock chain, and decentralized storage. Some
    of the crucial challenges are as follows:


    - **Throughput or scalability:** A maximum seven transactions per second is possible
    while systems like VISA and Twitter allow 2000 to 5000 transactions per second,
    respectively [2, 41]. Efforts to increase scalability include store optimization
    and redesigning the blockchain.

    - **Bandwidth, computing power, and size:** The size of blockchain is increasing
    by year, so to process it requires more bandwidth and size. Electricity current
    consumption is 2.55 GW and the average electricity per transaction is 300 KWH
    and more power is expected for the future.

    - **Latency:** To complete a transaction takes around ten minutes. Contemporary
    systems like VISA take only a few seconds.

    - **Resource wastage:** There a lot of resource wastage because of the proof-of-process.

    - **Privacy leakage:** Though it is safe, many people can still generate many
    addresses due to information leakage. Bitcoins can be leaked to reveal their information.
    Anonymity methods are proposed like mixing. A blockchain created by a small network
    has the 51% probability of being attacked [6].


    - Blockchains are analyzed by a transaction graph (T, L), where T is the transactions
    set and L is the input-output relations.

    - Address graph A (A, L''), where A is the address of Bitcoins and L'' is the
    directed assignments of connecting addresses.

    - Entity graph: It merges the addresses of the same users and it is represented
    by E (E, L''), where E is the set of entities.

    - Ownership: Mapping of addresses to destinations. This causes the analysis of
    using multiple addresses by the same user for multi-entry transactions; with change,
    curious, or malicious mixing services; blockchain peer-to-peer network privacy;
    and web payments.


    - **Self mining:** Some nodes do not broadcast their share and cheat, even if
    they have less than 51% hashing power for transmission.

    - **Usage:** The development of API is challenging. An easy-to-use Bitcoin API
    is needed.


    ## PRIVACY, SECURITY, AND RISK


    Bitcoin supports consistency, integrity, availability, tampering resistance, resistance
    to double-spending, pseudonymity, consensus algorithms, and signature verification
    public as pseudonyms [48–52]. They are supposed to incorporate unlinkability,
    confidentiality, resistance to majority consensus attack mining, and anonymous
    signatures. With Bitcoin privacy quantification [1, 17], an adversary is not allowed
    to link two addresses or two transactions of a user, known as activity unlinkability.

