    # Utilizing Blockchain and Interplanetary File System


    # ADOPTION OF BLOCKCHAIN FOR ENHANCED SECURITY


    At present, blockchain technology is seen as the long-term security approach in
    IoT for multiple reasons. Blockchain induces information bound in the form of
    a block and is connected using cryptography. A chain of blocks is made. Blockchain
    is characterized by integrity, security, and faster processing. However, there
    are various reported limitations of blockchain, and the concept is still in the
    initial stage of development.


    **Enhanced security:** The decentralized nature of blockchain technology and the
    application of cryptographic techniques make it possible to store medical information
    in a way that is both secure and difficult to alter. Due to the distributed nature
    of blockchain, it is excellently suited for malicious actors to alter or manipulate
    the data.


    **Interoperability and data exchange:** The use of blockchain technology provides
    a framework that is standardized for data interchange between the different healthcare
    organizations, systems, and platforms. It makes seamless interoperable feasible,
    assures accurate and consistent data exchange across all parties, avoids unnecessary
    duplication, and improves the coordination of healthcare.


    **Data integrity and immutability:** A chronological and permanent record of every
    transaction and input by the blockchain, results in an audit trail that cannot
    be altered in any way. This function ensures that the data included in medical
    records are accurate and prevents unauthorized changes from being made. As a result,
    the electronic health record (EHR) system becomes more trustworthy and reliable.


    **Efficient and accurate auditing:** Due to the immutability and transparency
    of blockchain technology, auditing may be conducted more efficiently. The capacity
    for healthcare practitioners, authorities, and auditors to readily trace and verify
    the origin, access, and change histories of health information improves accountability
    and compliance.


    **Disaster recovery and resilience:** The distributed design of a blockchain makes
    it feasible to implement disaster recovery and resilience strategies.


    # SECURE BLOCKCHAIN-BASED IOT INFORMATION STORAGE AND RETRIEVAL


    Blockchain suffers from space constraints when storing large files as every node
    maintains complete network data. IPFS provides a promising solution to the present
    issue. In IPFS, the hashed value of the data is embedded in the chain transaction.
    Unless private information is stored, IPFS doesn''t preselected nodes to store
    the data. IPFS uses an access control list for distributing hashed data among
    listed communicating parties. Smart contracts are employed in the Ethereum blockchain
    to provide the access control list to the requester. Smart contracts are verified
    before file uploading and retrieving.


    The IPFS is a peer-to-peer network protocol for storing data among obtainable
    distributed file systems. The content addressing scheme uniquely identifies each
    file in this distributed system. The content is stored as a distributed hash table
    (DHT)'
