    # 将区块链整合到医疗领域以数据安全


    ## 文献综述


    以往的研究已经强调了医疗机构面临的隐私和安全担忧，并分析了一些可以帮助解决这些问题的解决方案 [1, 2]。Agbo 等人 [3] 的研究重点关注了以患者为中心的互操作性带来的挑战，包括数据、隐私和安全的标准、可扩展性、速度、区块链激励机制以及区块链/医疗治理。Attaran
    [4] 概述了 Hyperledger fabric 的现状、它如何被用于构建解决方案，以及事务在 Hyperledger fabric 中是如何执行的。


    Aste 等人 [5] 描述了区块链的概念，并对其风险和挑战提供了视角。其他人员将电子医疗健康中的隐私视为一个以通信为中心的问题进行了研究，因为电子健康系统的未来很可能是高度分布的，并且需要所有子系统的互操作性
    [6–8]。此外，这些论文还描述了与患者以外的其他人员相关的隐私需求。其他人员还识别了医疗行业中与 IT 相关的隐私问题 [9–11]。Tariq 等人 [2]
    对上述领域在安全需求和智能医疗中遇到的各种挑战和直接问题进行了调查。他们还讨论了区块链技术作为一种潜在且强大的安全措施的能力，并分析了不同的基于区块链的方法。


    之前的研究对区块链架构提供了详细且抽象的说明，并将其与各种区块链中使用的一些常用共识算法进行了比较。人们已经努力从专业人士和研究人员社区中整合许多引人注目的观点，他们致力于提高区块链的安全性和隐私
    [17–21]。学者们还描述了区块链如何使交易和相关数据以安全的方式存储，并在不需要任何中央机构的情况下进行验证 [22–25]。


    ## 问题描述


    医疗系统以系统化的方式共享数据是非常重要的。此外，它们应该为数据提供隐私保护、增加访问和控制能力，并为使用系统的个人保证匿名性。如果隐私性、安全性低且信任处理差被视为代价，那么个人将不愿提供其敏感的重要信息，甚至会避免治疗。目前，许多医疗数据系统依赖中心机构来管理机密和敏感的医疗数据，这非常容易受到单点故障的影响。然而，由于分布式特性，区块链技术可以改变这种依赖。区块链能够以不可篡改和分布的方式解决技术问题和系统攻击。同时，它还包含了一条记录，用于跟踪数据的所有权和真实性。


    ## 现有系统


    在现代技术进步之前，医疗行业依赖于一种基于手写纸质医疗记录的系统。这种纸质医疗记录系统是杂乱无章、效率低下且容易被篡改的。此外，系统还面临数据冗余和重复的问题，因为患者去的所有医院都有其医疗记录的不同副本。医疗部门随后转向了电子健康记录（EHRs）。这些记录系统用于存储实验室结果和临床观察。建议加强患者数据的完整性，防止数据泄露，并增加对存储信息的访问。EHR
    系统的主要目标是解决依赖纸质的医疗系统所面临的问题，建立一个能够彻底改变医疗行业的可靠系统。它们面临着不可靠、安全性低、医院之间缺乏互操作性以及对用户友好性差的问题。鉴于许多
    EHR 系统被用于不同的机构，人们发现这些系统没有通用的定义标准。


    ## 提议系统


    本研究的主要目标是将区块链与医疗保健相结合，创建一个系统，以确保患者数据仅供授权人员访问，且不会被第三方出于恶意原因更改。将配置一个区块链网络，使用区块链框架平台来保护收集的数据。患者和医疗工作人员将作为区块链网络的一部分，部署为具有访问权限的账户，数据将在被区块链共识机制认为有效后进行存储。将设计一个图形用户界面（GUI），允许网络内的授权用户（医生、护士）进行操作。


    ## 需求收集


    （注：此处原文未提供具体英文文本，仅有标题。根据上文逻辑，“提议系统”部分已提到“将设计一个图形用户界面（GUI），允许网络内的授权用户（医生、护士）进行操作。”之后即无具体内容，此处根据要求仅翻译标题。）


