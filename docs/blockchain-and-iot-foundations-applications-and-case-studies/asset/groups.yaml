    2009年，中本聪聪开发了区块链以使比特币更加安全。截至2018年1月，比特币的市值为800亿美元。区块链是一个跨学科的主题，涉及数学、大数据、物联网（IoT）和云计算。然而，区块链并非总是被证明，但它也被用作比特币的主要软件。区块是区块链的一部分，由区块头组成，区块头分为基础哈希、区块模型、时间戳、随机数、简单记录和
    Merkle 根。区块还包含一系列带有加密和共享账本的信息。它通过共识、智能合约、首选账本和跨链生成执行异常操作。每个区块都与不同的区块（节点）连接，并在点对点网络中知道前一个和后续的哈希值。区块链用户无法删除或更改区块。它具有验证机制，每个区块必须经过完全验证。区块具有去中心化、匿名性、独立性、开放性、不可变性、安全性和性、集体维护、可编程性、透明性、不可伪造性和可审计性
    [5]（图1）。


    当用户之间交换比特币时，交易会以区块中记录的指令或信息列表的形式从公共账本中删除。交易中的客户通过区块链地址参与 [16]，并使用钱包进行控制。用户并不局限于一个地址；他们可以访问钱包中的多个比特币地址。这些地址通过转换特性映射到唯一的公钥/私钥对
