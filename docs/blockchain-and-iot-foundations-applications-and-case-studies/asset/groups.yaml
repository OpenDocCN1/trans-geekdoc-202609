    # Integrating Blockchain in Healthcare to Secure Data


    ## LITERATURE REVIEW


    Previous research has highlighted the privacy and security concerns faced by health
    organizations and analyzed some of the solutions that could help solve those issues
    [1, 2]. The research by Agbo et al. [3] focuses on the challenges arising from
    patient-centered interoperability, which includes standards for data, privacy,
    and security, scalability, speed, incentives for blockchain, and blockchain/healthcare
    governance. Attaran [4] gives an overview of how Hyperledger fabric is, how it
    can be used to build solutions, and how transactions get executed in Hyperledger
    fabric.


    Aste et al. [5] describe blockchain''s concepts and provide a perspective on its
    risks and challenges. Others have investigated privacy in electronic healthcare
    as a communication-centered issue since the future of electronic health systems
    will probably be quite distributed and need the interoperability of all subsystems
    [6–8]. In addition, the papers also describe the privacy needs related to research
    for others than patients. Others have also identified the IT-related privacy issues
    that occurred in the healthcare industry [9–11]. Tariq et al. [2] present a survey
    on the various challenges and direct issues encountered in security requirements
    and smart healthcare of the mentioned domains. They also discuss the capabilities
    of blockchain technology as a potential and strong security measure and analyze
    different blockchain-based approaches.


    Previous studies provide a detailed and abstract account on blockchain architecture
    and compare it with some common consensus algorithms that are used in various
    blockchains. Efforts have been made to incorporate a lot of the compelling ideas
    from the community of professionals and researchers involved in improving the
    security and privacy of blockchain [17–21]. Scholars have also described how blockchain
    enables transactions and related data to be stored in a secure manner and verified
    without requiring any central authority [22–25].


    ## PROBLEM DESCRIPTION


    It is quite important that healthcare systems share data in a systematic way.
    Also, they should give privacy, increased access and control to the data, and
    guaranteed anonymity to the individual using the system. If there is a score for
    less privacy, lower security, and trust handling, the person will be unwilling
    to give their sensitive and important information or even refrain from getting
    treatment. At present, lot of healthcare data systems depend on a central party
    for managing confidential and sensitive healthcare data, which can be very susceptible
    to single-of-failure. However, due to its distributive nature, the technology
    of blockchain could alter this dependency. Blockchain can present the ability
    to solve technical issues and system attacks in an immutable and distributive
    way. Along with this, a record is included to track the ownership and authenticity
    of data.


    ## EXISTING SYSTEM


    Before the advancement of present-day technology, the healthcare industry was
    dependent on a system based on handwritten, paper medical records. This paper-based
    system of medical records was unorganized, inefficient, and vulnerable to tampering.
    Also, the system encountered the problem of redundancy and duplication of data
    since all the hospitals that the patient went to had different copies of his or
    her medical records. The healthcare sector then shifted to electronic health records
    (EHRs). These record systems were used to store laboratory-based results and clinical
    observations. It was recommended to strengthen the strength of the data of the
    patients, breaches be prevented and access to the stored information increased.
    The main aim of EHR systems had to fix the issues faced by the healthcare system
    that was dependent on paper to build a reliable system that could revolutionize
    the healthcare industry. They faced the problems of being unreliable, less secure,
    lacking interoperability among hospitals, and less user-friendly. Given that a
    lot of these EHR systems are used in different institutions, it was found that
    the systems had no universally defined standard.


    ## PROPOSED SYSTEM


    The primary aim of this research is to integrate blockchain with healthcare to
    create a system to ensure that patients'' data is accessed only by authorized
    persons and isn''t changed by a third party for malicious reasons. A blockchain
    network will be configured to secure the collected data using a blockchain framework
    platform. The patients and healthcare workers will be a part of the blockchain
    network deployed as accounts having access to it and data will be stored after
    being considered as valid by the blockchain consensus mechanism. A Graphical User
    Interface (GUI) will be designed that allows an authorized user within the network
    (doctors, nurses, patients) to view patients'' records.


    ## REQUIREMENT GATHERING


    The collected data is secured after every transaction in the blockchain for healthcare
    devices. One of the main sources from which the data will be collected from patients''
    healthcare reading devices. More precisely, data collected from patient-connected
    devices will be sent to the blockchain system as a transaction. The action is
    considered valid by a node in the blockchain network, then it will be added as
    a block to the network. All nodes (patient/doctor computers) that are part of
    the network will also be updated with the new data.


    ## ANALYSIS OF REQUIREMENTS


    ### Functional Requirements


    - Allow users or patients to register with their Ethereum address.

    - Allow patients to give permission to doctors to edit their records.

    - Allow doctors to enter medical reports for patients and attach their digital
    signature with it.

    - The patient can view and share their records. No unauthorized person can view
    the records.


    ### Nonfunctional Requirements


    - Efficiency requirement: The system should use the available resources and dataset
    efficiently to produce fast and accurate results.

    - Reliability requirement: The software system should be a reliable and easier
    to handle for both owners and customers. Since it is a very sensitive application,
    the software system should be reliable and not fail in any case. There must be
    recovery protocols established in order to avoid such issues.

    - Implementation requirement: Implementation of the system is done using JavaScript
    and solidity, which makes it versatile and flexible to be used in any type of
    work environment.

    - Delivery requirement: The complete system is envisioned to be delivered within
    four to five months, including an evaluation by the project guide every week.


    ## DATA SOURCE


    The data for our project was collected from the internet.


    ## COST ESTIMATION


    The researchers will use an organic type COCOMO model for approximate cost estimation:
    KLOC = Thousand lines of code (estimate) = 2


    - Effort undertaken = E = a/(KLOC)^b = 2.4(2)^1.05 = 4.969 person-months.

    - Time required = D = c(E)d = 2.5(4.969)^0.38 = 4.597 months.

    - Staff size = ss = E/D = 4.969/4.597 = 1.08 (roughly 1–2 persons).


    ## SYSTEM ARCHITECTURE


    Figure 10.1 presents the overall blockchain system. The diagram provides an overphysical
    arrangement of the blockchain model of the researchers. The diagram shows how
    a healthcare worker creates a medical record in the application, how MetaMask
    verifies transactions by generating digital signatures, and can patients view
    their medical records from the application.


    ## INTERFACE PROTOTYPING (UI)


