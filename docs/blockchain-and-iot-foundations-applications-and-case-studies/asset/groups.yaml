    # Review of Blockchain Technology Used in Industrial Solutions 69


    According to Maersk, the logistics company, administration costs can be higher
    than the physical transport costs for a short journey involving a container. However,
    they can be significantly reduced by using blockchain. Like Siemens, Maersk is
    also working on a blockchain project with its information technology supplier
    IBM.


    # CONCLUSION


    Blockchain has been a hot topic for several years. It has long been apparent that
    the distributed database and record system, first for Bitcoin, is capable of more
    than just enabling cryptocurrencies. Today, blockchain is used to build smart
    contracts that have variables and values specific to each transaction written
    into the code. It accomplishes this without the use of an intermediary, which
    is typically used to mediate real or electronic contracts between clients and
    customers.


    The fact that blockchain is a decentralized system, which promotes trust in a
    digital ecosystem without the middlemen, as well as its transparency, which enables
    all users to audit transactions and precisely trace stored data back to its point
    of origin, are just few of the benefits that make it appealing for a variety of
    industries. The potential for creating new company models is enormous.


    Due to the fact that blockchain creates confidence between parties who might not
    typically get along, future developments will focus more on shared goals and collaboration.
    Where there was no openness before, blockchain creates it.


    Finally, blockchain technology is progressing as many organizations, like Siemens,
    are researching various business use cases.


