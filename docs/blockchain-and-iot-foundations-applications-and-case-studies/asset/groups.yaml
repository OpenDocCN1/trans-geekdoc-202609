    - 位置和区域的选择。\n- 检查车位状态。\n- 车位更新。\n- 可视化。\n\n## 架构\n\n该架构代表了停车系统的整体工作原理（图 6.14）。它由两个模块实现：硬件实现和\
    \ Web 服务器。两个模块都会更新车位状态并在屏幕上显示输出。在第一个模块中，我们实现了硬件组件，使用 Arduino 板板开发停车系统。Arduino\
    \ 板板作为微控制器工作并控制整个系统。停车系统中有一个入口和出口门，用于允许车辆进入系统。\n\n红外传感器用于感知车辆并向 Arduino 发送有关车辆状态的信号。Wi-Fi\
    \ 模块用于将 Arduino 与 Web 服务器集成，以更新车位状态。\n\nWeb 服务器使用 Arduino IDE 开发，用于为用户更新车位状态。在\
