    2008 by someone under the pseudonym Satoshi Nakamoto, blockchain technology gained
    widespread public awareness with the introduction and use of the Bitcoin network.
    The blueprint schemes described in the article are used by many contemporary cryptocurrencies.
    The first of numerous blockchain-based apps is Bitcoin.


    The various elements of blockchain technology and their key characteristics that
    make blockchain a compelling technology can sometimes make it challenging to understand.
    Blockchain is in the form of blocks that create distributed digital ledgers that
    hold transfers that have been secured in each block. Further, a block itself is
    cryptographically linked to the previous block forming a chain of blocks, after
    validations and undergoing consensus decisions. Because of this, if the data is
    altered in one block, its unique identifier will change and be visible in the
    next block (providing tamper evidence). All users within the blockchain can determine
    whether the data in a prior block has been altered with this domino effect. A
    blockchain network offers a robust way of cooperative recordkeeping because it
    is challenging to alter or delete.


