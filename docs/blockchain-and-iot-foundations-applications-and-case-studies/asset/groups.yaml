    # 9种医疗保健物联网数据安全的区块链驱动解决方案


    P K Jawahar, S Mubeena, V Jean Shilpa, R Anitha, and S Anusooya


    ## 引言


    最近，物联网（IoT）的趋势和技术进步使得许多行业的自动化、数据收集和分析成为可能。物理设备之间的通信通过物联网实现，例如使用传感器在互联网上与其他设备进行数据收集和交换。枢纽连接各种设备，聚集实时数据，进行分析并在本地共享。物联网的应用包括智能水务和智能医疗保健级监控、智能太阳能电池板、智能家居、智能废物管理和智能农业。


    物联网使得库存材料通过互联网进行连接成为可能；信息可以传递或接收。物联网影响着多种技术，包括嵌入式系统、人工智能传感器和实时分析。智能设备可以收集信息并将其传输以执行特定的日常任务。智能城市、网络化医疗保健系统、智能交通系统和其他物联网应用均可实现。医疗领域的物联网实施集中于各种设备、人工智能、诊断工具和高科技成像设备
    [1]。


    在数据连接到控制系统并从患者附近或身上的传感器处收集后，它会被传输到健康监测单元。云端用于存储数据，这有助于在保持安全的同时管理数据量。由于对低资源设备加密数据具有挑战性，安全性是物联网的一个至关重要的方面。当数据发送到云端时，其完整性和机密性可能会受到破坏。由于其分布式特性，云是存储健康信息的最佳选择，既让临床医生能够访问，又能为居住远处的患者提供护理。物联网和云使用实时处理，这增加了复杂性
    [2]。


    物联网是一系列网络，在服务器-客户端范式下通过云服务器连接经过识别、验证和链接的设备，需要大量的计算能力和存储空间。此外，Gadekulla 等人 [5]
    指出可重构、去中心化且可追踪的区块链网络具有重构和当前物联网系统的潜力，并为其提供更高程度的安全性。被称为 BEoT 的新范式将边缘物（EoT）与区块链相结合，专门作为未来服务应用的潜在介质而创建。研究人员审查了
    BEoT 技术的变化，并研究了其在系列应用领域的巨大潜力。BEoT 用于多种商业应用，如智能电网、智能房屋、智能城市和智能医疗保健。


    Zhaibei 等人 [6] 提出了 SHealth，为消费者提供了最大的自主性。它通过易于使用的图形界面利用智能合约来启动关于不同请求和问题，例如咨询、诊断程序、处方、医疗干预或针对患者的实践。SHealth
    易用、可靠、高效、安全且全自动。存储健康相关数据的分布式数据库所有系统参与者均可访问，且不会对数据完整性造成任何危险。论文讨论了涉及 SHealth 覆盖的健康系统的某些场景。


    Wu 等人 [7] 了一种基于区块链的安全交易网络、一种基于三重主题目的的访问控制（TS-PBAC）范式，以及在医疗物联网（IoMT）场景中具有多种功能和职责的访问控制。在边缘计算环境中，研究人员创建了基于隐私差异（LDP）的策略和基于角色的身份验证机制，以授予授权用户细粒度的权限，从而加强针对内部攻击者的重要特征的安全性。实验结果表明，推荐的隐私保护方案通过在发布者和具有不同目的的需求之间进行可靠且持续的访问选择，比传统的访问控制策略能更好地保护
    IoMT 环境下的患者隐私。


    ## 物联网层架构


    医疗保健系统中的物联网对于以高速方式在设备之间收集、共享和传输数据至关重要 [2, 8]。医疗保健中的传感器包括脉搏氧仪、ECG 传感器、温度传感器和血压计。物联网使用
    MQTT、CoAP、TCP 和 WebSocket 等多种协议进行数据传输 [9, 10]。用于物联网的网络技术包括高达 5G 的蜂窝技术、蓝牙、Wi-Fi、RFID
    和低功耗广网。智能医疗保健设备收集大量数据，这些设备用于偏远村庄，人们可以在那里监控并与医生诊断 [11–13]。


    物联网可以分为五个不同的层（图 9.1）。它们是感知层，用于使用传感器和执行器将模拟信号转换为数字信号以及数字信号。网络层用于通过 Wi-Fi、以太网、Zigbee、MQTT
    和 HTTP 等协议在物理设备之间进行通信 [14]。处理层用于捕获、存储和处理数据以满足进一步需求。应用层用于在数据完成后为业务模型做出决策。业务层用于带有处理后数据的业务模型
    [3, 5, 16]。


    - **感知层**：用于将模拟信号转换为数字并将数字信号转换为模拟形式。传感器、执行器和机器设备被用应用协议 [17–19]。血压计、工作灯和脉搏氧仪是医疗设备的一些示例。医疗设备包括血氧仪、工作...


    142

    区块链与物联网

    ![](img/7237166d8c6f79ea99cc6e305e5ec1f_154_0.png)

    图 9.1 物联网层架构。


    ...血压计、工作灯。


    - **网络层**：通信在物理设备和物联网架构之间进行。Wi-Fi、Zigbee、蓝牙、MQTT 和以太网是使用的其他一些协议 [22–24]。


    - **处理层**：处理层用于捕获、存储和处理数据以满足进一步需求。CRM、ERP 是使用的一些应用协议 [25]。


    - **应用层**：数据被进一步处理和分析以获得商业智能。在这里，人工智能和机器学习是一些使用的应用协议 [26]。


    - **业务层**：所有者和其他利益相关者根据过去和现在的数据制定准确的未来计划。分析是层使用的应用协议 [27]。


