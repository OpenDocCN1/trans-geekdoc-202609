    # 区块链与物联网（IoT）


    任何节点都可以根据请求以哈希的形式检索内容数据。数据以 256 千字节的文件形式上传，经过进一步哈希处理并使用内容标识进行标识。在没有服务器连接的情况下，主机可以从其对等节点下载哈希内容。为了高效存储和检索文件，完整文件通过
    Merkle 有向无环图（DAG）连接。DAG 额外帮助将节点与其特定的标识符连接。因此，节点使用 DHT 来检索 IPFS 数据。


    图 3.4 有三层：感知层、区块链网络层和应用层。采集时通过二维码 扫描器创建的药材信息由感知层提供。


    制造现场原始药品数据（D）的生成使用二维码 扫描器。与数据和 RSA 相比，AES 用于加密大小文件。AES 密钥分发非常麻烦。因此，使用 AES 加密数据并使用
    RSA 在通信中传输加密的 AES 密钥。对称密钥 K 使用零售商 (R)、供应商 (S)、消费者 (C)、管理员 (Ad)、数据管理器 (DM) 和患者
    (P) 的公钥进行加密，以产生公式 3.1–3.8 中的密文。


    ![](img/7237166d8c6f79ea99cc6e305e5ec1f5_66_0.png)


    图 3.4 带有 IPFS 的区块链架构。


    # 利用区块链与星际文件系统


    ```

    $CK_R = RSA(K, PK_R)$

    ```


    ```

    $CK_S = RSA(K, PK_S)$

