    This section analysis makes some concerns surrounding Bitcoin [19]:


    - i. **Iraqi Swiss Dinar**: This currency was neither recognized by the government
    nor a commodity, but never collapsed.

    - ii. **Confidence**: Many people are afraid of investing in bitcoins because
    of technical and legal issues like improper use of discretionary authority, superior
    and competent currency, government crackdown, and deflationary spiral.

    - iii. **Anonymity failure authentication problem**: Since transactions are in
    public and online, there can be account identification issues and breaking of
    the anonymity. It will degrade the performance of Bit as well as the authenticity
    of the blockchain.

    - iv. **Theft**: Since it is in the form of digital currency, it is possible that
    it can be lost or stolen.

    - v. **Denial of service**: Some malicious nodes have enormous computing power
    and can disrupt transaction processing.

    - vi. **Integrated cost and hesitancy**: To maintain a blockchain, a lot of computing
    resources are required. Because of some legal and economic risks, there exists
    some hesitancy in using blockchain for public transactions.

    - vii. **Fraud**: Many consumers want fraud protection. Bitcoins are stolen because
    they are digital virtual cryptocurrencies.


    # BLOCKCHAIN APPLICATIONS


    Some of the main applications of blockchains are as follows (also see Figure 1.12):


    - i. **Finance**: Financial services, P2P financial market, risk management, enterprise
    transformation, financial transactions.


    # Architecture, Security, and Privacy for Blockchain


    ![](img/7237166d8c6f79ea99cc6e305e5ec1f5_33_0.png)


