    ## 2 由区块链驱动的物联网与工业物联网

    ### 关于释放潜力的研究


    S Sandhya, M Senthil Kumar, B Chidambambarajan, 和 S K Susee


    ## 引言


    物联网（IoT）是一种有效的互联网和管理环境，通过共同工作创造了一个智能互联的世界 [1]。IoT 用户可以广播其放置在服务器上的数据，以便在服务器上进行智能处理。目前，IoT
    已应用于许多领域，如企业、工业、环境工程、移动设备和治理。IoT 还有助于交通、医疗保健、农业、能源和环境管理行业。IoT 支持了服务、制造、物流和食品生产领域的许多商业倡议。学术界和工业界对工业物联网（IIoT）高度关注，这在未来的工业方案转型中可能至关重要。IoT
    在工业 4.0 中发挥着至关重要的作用，也是学术和政治领域最重要的话题之一。IoT 与 IIoT 的主要区别在于，IoT 经常应用于智能工厂和智能制造等应用，而
    IIoT 环境通常具有各种自动化设备和工业设备的特征。


    IoT 通过驱动器、传感器设备、泛在网络和处理能力为工业系统提供连接性。实施 IoT 旨在提高制造效率和业务生产力，减少设备停机时间并提高最终输出质量。具体而言，IoT
    具有以下特征：IoT 系统的去中心化、各种基于 IoT 的应用方案、基于 IoT 的信息的异构性和网络压力 [2]。


    ## 区块链与物联网


    区块链技术的增加了解决 IIoT 挑战的机会。比特币的核心技术是区块链。区块链使得计算机程序能够以广泛接受（点对点）的方式发送和接收消息或维护交易。区块链正在迅速流行，主要用于分布式存储、智能合约应用和数字资产
    [3]。将区块链用于 IIoT 的应用包括存储属性（如温度、湿度或位置设备）以及创建可供特定用户（供应链的特定参与者）理解的区块式挑战账本。区块链技术已从一种不可行的方法转变为一种可靠的解决问题。


    智能合约（SCs）已在基于区块链 2.0 的数字经济中自动运行，而区块链 1.0 通常与加密货币和开销（例如比特币）相关联。近期区块链 3.0 的重点是满足数字世界的需求，例如工业
    4.0 对智能城市的关注。IIoT 持续为工业 4.0 注入能量。工业 4.0 与 IIoT 相关。尽管人们可能认为 IIoT 是 IoT 的改进，但它也涉及对工业中
    IIoT 的进一步关注。工业 4.0 经常与伦理制造场所小组相关。


    区块链的内部时序和空间数据可以被发现和验证以实现追溯。存储在区块链中的每个数据块都有相应的时间戳，以确保数据的发现。


    通过 IIoT 和物理设备，互操作性可以交换数据。构建一个跨许多 IIoT 方法并具有持久访问的早期 P2P 网络，将实现区块链复合层内的互操作性。


    自主交互中讨论了 IIoT 在没有受信任第三方（TTP）干预的情况下运行的潜力。区块链使智能合约能够这种自主性。特别是由智能合约封装的合约条款将在特定情况满足后习惯性地执行。


    ## 动机


    云制造（CBM）是生产最推荐模式中的一种新现象。通过最少的服务提供商管理努力或归益于 CBR 的内容、合适、随随的网络连接，可以快速配置一组隔离的灵活生产资源。这处于一个去中心化的、点对点的
    IIoT 系统中。通过一个中央 CBR 运营商，BIIoT 系统改进了旧 CBR 系统的实用性，特别是在云环境中集成过时的车间设备时。此外，CBR 按需启用了用于生产的资源，这使得在无法签订生产服务合同的用户之间的交易中需要使用信誉的分销商。


    尽管 IIoT 是 IIoT 的认可，但在成功实施和实现其潜力之前，需要克服许多问题。因此，本章的目的是对报告困难的架构提供详细概述，并探索与 BIIoT
    相关的研究问题。


    ## 贡献与综述的比较


    本文以已发表文章的形式讨论了区块链与 IIoT 的结合。例如，Wen 等人描述了一种使用 IIoT 的基于区块链的供应链（SC）网络信息发布系统。该系统将
    IIoT 节点连接到区块链，监控 IIoT 节点并使用智能合约在网络内存储并发数据。此外，还了一种基于区块链的供应链设计。他们建议这些设计提了连接各种商品的供应链协作方案。在该供应链概念内部提出了一种用于细粒度分布的信息系统。


    Li 等人描述了一种基于联盟链的能源安全业务模型 [5]。这种区块链通常用于国际点对点（P2P）购电协议，因为它消除了中间人。此外，它减少了由于能源区块链上验证合同时延迟导致的合同限制影响。许多研究人员提出了一种基于信誉的定价策略，以鼓励持续和短期的购电协议。Tesla
    等人提供了 IIoT 中使用的区块链平台列表 [6]。检查了最常见的共识机制，以及公共链和私有链的独特特征。


    通过对之前工作的分析，旨在：


    - 1. 介绍关于 IoT、IIoT 和区块链的概念性引言。

    - 2. 允许研究将 IoT 集成到区块链中的可行性。

    - 3. 创建解决 BIIoT 挑战的方法。


    以下是贡献的简要总结：


    - 4. 引言中介绍了 IoT 的关键要素。此外，提供了 IoT 挑战的总结。

    - 5. 提供了 IIoT 的简要概述，以及其主要属性。


    ## 物联网：概述


    “物联网（IoT）”术语是指通过网络连接的软件、执行器和传感器的“物”集合，以交换信息。IoT 节点由产生功率的传感器设备组成，在许多行业中都很常见。图 2.1
    显示了到 IoT 的设备。家居自动化是指使用数字控制的网络连接系统来实现家电自动化以维护人口安全。IoT 系统可以通过被称为智能网的组件远程监控和控制任何设备
    [7]。


    由于恶劣天气和地震，交通标志、停车、交通拥堵和预测等电力波动受到影响。IoT 设备


