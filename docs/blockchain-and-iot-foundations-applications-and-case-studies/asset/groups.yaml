    - ix. Supply chain management: Blockchain technology manages the distributed ledger,
    and the ordering of goods with transparency, reliability, traceability, and security.
    The supply chain of any organization often involves the raw material supply, wholesaler,
    manufacturer, distributor, retailers, and end users.


    # RESULTS AND DISCUSSIONS


    Blockchain is the modern era for safe transactions concerning finance, privacy,
    IoT, agreements, and public social offerings. Its features include a decentralized
