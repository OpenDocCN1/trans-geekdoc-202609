    # Blockchain-Based Parking System Using IoT


    # SYSTEM ANALYSIS


    This research works to facilitate users and admins to park vehicles in a well-defined
    method. This study helps to show updates about empty parking slots in the location
    chosen by the users. The research uses Arduino to monitor and control the parking
    system. The Wi-Fi module ESP8266 NodeMCU is used to communicate between the IoT
    and the web server. The web server updates the user about empty parking slots
    every three minutes.


    Infrared (IR) sensors are affixed to the entry gate and exit gates to sense objects
    and when to open the gate. The servomotors collect the signal from the IR sensors
    in the entry and exit gates. The IR sensors used in the parking slots sense the
    status of the slots and send a signal to Arduino. The LCD display at the entry
    gate will display the number of empty and filled slots in the parking area. Users
    can check slot status through the web server. Users can choose to display the
    status of their desired parking location.


    # REQUIREMENT SPECIFICATION


    # HARDWARE REQUIREMENTS


    The various hardware requirements are shown in Figures 6.4 to 6.8.


    # SOFTWARE REQUIREMENTS


    +   - Tools required: Arduino IDE (Figure 6.9)


    Operating system: Linux OSPre requisite JDK 1.6 or above


