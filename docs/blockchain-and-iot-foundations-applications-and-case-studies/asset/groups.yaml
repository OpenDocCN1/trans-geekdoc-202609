    # 结论


    许多科技进步改变了医疗健康领域。区块链技术通过拜庭容错（Byzantine fault tolerance）实现，这是一种用于物联网数据安全的共识过程。本项目提出了一种改进的
    PBFT，其中共识过程结合了识别故障节点并抵抗这些节点的机制。使用 BFT 的 P2P 网络提高了共识效率和性能速度。通过使用 BFT 算法，基于物联网的电子健康记录的区块链交易被提交到分布式系统中的节点，且节点之间的交易速度得到了提升。最后，电子健康记录数据存储在边缘服务器中，从而减轻了数据存储问题。


