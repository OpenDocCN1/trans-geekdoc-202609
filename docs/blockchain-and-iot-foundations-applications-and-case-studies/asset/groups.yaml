    # CONTRIBUTIONS AND COMPARISON WITH THE SURVEY


    The pairing of blockchain with IIOT is discussed in a manner of published articles.
    For instance, Wen et al. describe a blockchain-based information distribution
    system for supply chain (SC) networks using IIOT. The system connects IIOT nodes
    to the blockchain, monitors IIOT nodes, and uses smart contracts to store concurrent
    data within the network. In addition, a blockchain-based supply chain design is
    suggested. They suggested that designs propose supply chain collaboration options
    that link various commodities. An information system for fine-grained distribution
    is proposed inside this supply chain concept.


    Li et al. describe a consortium blockchain-based energy secure business model
    [5]. This kind of blockchain is often used in international peer-to-peer (P2P)
    power purchase agreements as it removes the middleman. Additionally, it decreases
    the effects of contract restriction caused by delays during the verification of
    contracts on the energy blockchain. Many researchers have proposed a credit-based
    pricing strategy to encourage continuous and short-term power purchase agreements.
    The list of blockchain platforms used in IIOT is provided by Tesla et al. [6].
    The most common consensus techniques are examined, together with the unique traits
    of public blockchain and private blockchain.


    Through the analysis of prior work, one aims to:


    +   1. Present a conceptual preamble on IoT, IIOT, and blockchain.

    2. Permit the examination of the viability of integrating IIOT into blockchains.

    3. Create a facility of consultations in a perceptive way on how to address technological
    challenges while implementing BIIo.


    Here is a quick summary of the contributions:


    +   4. An outline of the key elements of IoT was given in the introduction. Additionally,
    a summary of IoT difficulties is provided.

    5. In addition, a concise overview of IIOT is given, along with a list of its
    main properties.


    In addition, the IIOT research problems are listed.


    # IOT: AN OVERVIEW


    The term “Internet of Things (IoT)” refers to a collection of “things” that are
    composed of software, electronics, actuators, sensors and sensors connected via
    the web in order to exchange information. IoT nodes are made up of producing power
    and sensor devices, which are common in numerous industries. Figure 2.1 shows
    the devices that are connected to IoT. IoT home automation refers to the capacity
    to automate household appliances by using digitally controlled, network-connected
    systems to uphold the safety of the population. An IoT system can monitor and
    control anything remotely, including lights, through the component known as a
    smart grid [7].


    As a result of severe weather and earthquakes, electricity influxes like traffic
    signs, traffic congestion, parking, and predictions of things are affected. IoT
    devices'
