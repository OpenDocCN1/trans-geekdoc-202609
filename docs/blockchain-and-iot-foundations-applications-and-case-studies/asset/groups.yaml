    gathered using the unsupervised learning approach. Using principal component analysis
    and the supervised learning approach, the abnormality in the spinal region is
    determined. From the comparative analysis, the better performance is evaluated
    by the KNN classifier. The KNN classifier has a higher percentage when compared
    to the RF classifier approach. Fuentes et al. [5] defined four stages of child
