    # SUPPLY CHAIN MANAGEMENT OF TOOLS IN SERVICING OPERATIONS OF POWER PLANTS


    Siemens uses blockchain in its chain management activities specifically for managing
    the tools in servicing operations for power plants all over the world. The SCM
    DigiNiNetwork, an informal company-wide group of digitalization enthusiasts who
    design and implement solutions in this field, was behind the original initiative.
    The tool management sector where blockchain is involves a wide range of equipment
    and tools, from a simple cordless screwdriver to a CNC machine costing over a
    million euros.


    The challenge that the tool management sector faces is that the contents of the
    return canters the individual tools shipped to the location of use in the first
    place. Previously, the number and condition of the devices and tools that were
    packed, transported, and received were recorded manually by the relevant employees.
    However, this manual documentation is error-prone and does not work well. This
    is why Siemens decided to use blockchain technology in it to guarantee the integrity
    of the new digitized process.


    When a transport order is generated, it is automatically entered into the blockchain.
    This will show a list of associated and relevant partners (such as the logistics
    company), access to the document, and all papers associated with the freight shipment.
    All amendments are recorded and visible to all authorized parties. The blockchain
    technology used by the Siemens tool management gives Siemens the ability to view
    whether a tool is still in customs or being transported, whether the returned
    kits contain drills that need to be sharpened, or if an open-ended spanner is
    bent out of shape.


