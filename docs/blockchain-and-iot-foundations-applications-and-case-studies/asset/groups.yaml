    ![](img/7237166d8c6f79ea99cc6e305e5ec1f5_9_0.png)


    Souvik Pal is a professor in the Department of Computer Science and Engineering
    at Sister Nivedita University (Techno Group), Kolkata, India. Prior to that, he
    was associated with Global Institute of Management and Technology; Brainware University,
    Kolkata; JIS College of Engineering, Nadia; Elite College of Engineering, Kolkata;
    and Nalanda Institute of Technology, Bhubaneswar, India. Pal received his MTech
    and PhD in the field of computer science and engineering from KIIT University,
    Bhubaneswar, India. He has more than a decade of academic experience. He has fifteen
    books from reputable publishers and holds three patents. He serves as a series
    editor for Advances in Learning Analytics for Intelligent Cloud-IoT Systems (Scopus-indexed);
    the Internet of Things: Data-Centric Intelligent Computing, Informatics, and Communication,
    published by CRC Press, Taylor & Francis Group, USA; and the Conference. He was
    the organizing chair of RICE 2019, Vietnam; RICE 2020 Vietnam; Turkey, New Delhi;
