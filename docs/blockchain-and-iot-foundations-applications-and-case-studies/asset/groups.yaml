    # 7 Blockchain-Based Online Attendance Management System


    Latha Parthiban, S Sahunthala, and R Parthiban


    # INTRODUCTION


    The practice of marking student attendance is traditionally done using a logbook.
    New methods of marking attendance have evolved with automation. But special care
    must be taken to store the data safely from later, unauthorized modification.
    Many applications use the Internet of Things (IoT) to capture attendance with
    biometrics. Parents can access the attendance of their ward and track a problem
    if there is an issue. For scholarships, the government can directly access the
    data.


    A blockchain is made of a growing list of records blocks that are linked by encryption.
    Many blockchain frameworks have been proposed to integrate it with industrial
    advancements. Again integrating it with federated learning helps it work collaboratively
    in a distributed environment.


    # LITERATURE SURVEY


    Avoade et al. [1] created a trusted blockchain environment for managing data.
    Androukali et al. [2] created a Hyperledger fabric for blockchain. Aazam et al.
    [3] designed an internet cloud of things and resolved most problems in integration.
    Makhdoom et al. [4] proposed methods and solutions for the use of blockchain.
    Ramezan et al. [5] proposed a routing protocol for IoT, and Lim et al. [6] proposed
