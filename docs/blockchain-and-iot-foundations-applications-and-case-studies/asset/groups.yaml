    several devices and expands quickly due to its broad phase. According to predictions,
    there will be about 26.66 billion IoT devices operating by 2019 and 75 billion
    IoT devices available and wirelessly connected by 2025. Millions of wearable sensors
    are among these connected gadgets, and are extensively used in healthcare systems.
    IoT-related spending reached $737 billion in 2016 and was expected to reach $1.29
