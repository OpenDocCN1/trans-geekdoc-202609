  md: 'small amount of data is used to build models. The privacy of health data is
    a primary concern for healthcare organizations, such as hospitals and pathological
    laboratories. However, the robustness of AI models often requires vast amounts
    of data. The dynamic nature of different patients’ cases and problems demands
    new technologies and tools to link and collaboratively combine data from various
    hospitals effectively. For this reason, an increasing number of hospitals are
    seeking secure methods to share data to predict and diagnose new types of viruses
    and disease symptoms.


    To address the privacy challenges faced by healthcare organizations in the IoMT
    industry 4.0 [16–18], numerous efforts have been made to refine and optimize the
    protection of individual privacy [19, 20]. Currently, approaches based on federated
    learning have shown promise in resolving privacy concerns by preserving edge intelligence
    in distributed scenarios [21, 22].


    Effectively handling data privacy also significantly reduces the cost of data
    transmission. This reduction occurs because each node in the centralized network
    optimizes a local model using its own data and only transmits the learned model
    parameters [20]. Generally, in most cases, the optimization of the local model
    employs the gradient descent algorithm. Through this process, each node (for instance,
    a hospital, pathology laboratory, or another healthcare organization) retains
    its local data. The shared learned parameters are then aggregated by a central
    curator to collaboratively develop a global model [23–27]. However, the collaboration
    scheme in federated learning still faces significant risks and challenges, particularly
    concerning the trustworthiness of participant nodes and the quality of their local
    models. For instance, while [28] proposed a distributed model for sharing gradients,
    their methods have shown vulnerabilities to passive attackers [29, 30].


    # 1.1. Motivation


    In the last few years, blockchain and federated learning have become emerging
    approaches that facilitate a distributed and secure solution to share the data
    of each node [27]. Features of blockchain, such as traceability, anonymity, and
    tamper-proof properties, have been given a significant amount of attention by
    researchers to enhance node and data security in many areas such as smart grids,
    vehicular networks, and healthcare data networks [3]. This transition aligns with
    the need for secure platforms to manage sensitive health data, as highlighted
    by various studies, including the use of blockchain to optimize data privacy and
    system security [9, 11, 31]. On the other hand, Shen et al. [1] designed a multi-collaborative
    system based on federated learning in the medical domain. The incentive of existing
    works only considers the server-based aggregation of the model [23–27, 32], while
    our work considers blockchain-based aggregation in the medical domain. Moreover,
    Kumar et al. [3] combined the blockchain and federated learning approach to create
    a decentralized model, but the drawback of [3] does not consider the trust mechanism
    between the new local models.


    Bonawitz et al. [33] designed a privacy protection framework to safely aggregate
    gradients using a federated learning global model, whereas [34] proposed a homomorphic
    encryption (HE) scheme and threshold secret sharing to protect the gradient. However,
    each aggregation in these schemes requires multiple rounds, which are unsuitable
    for blockchain distributed networks. Additionally, their approaches were restricted
    to learning predefined categories (diseases in this case) and cannot learn from
    new categories. Overall, some important research issues must be addressed with
    appropriate answers. Some of these important research questions (RQ) are covered
    more below.


    +   * **RQ1:** How can a collaborative processing system that integrates multiple
    parties be developed?

    +   * **RQ2:** How can trust in new local models be built while maintaining the
    quality of the local models?

    +   * **RQ3:** How can a mechanism be developed to ensure the privacy of hospitals?


    # 1.2. Research approach and contributions


    To enhance user privacy and trust, we integrate blockchain with federated learning
    techniques. The blockchain provides a reliable scheme for training a global model
    among untrusted participants, facilitating efficient data sharing [35]. This proposed
    scheme compares the accuracy of the new model with that of existing models to
    establish trust. In this way, blockchain fosters trust among parties and ensures
    accurate model training. We have also designed a blockchain-based distributed
    architecture for secure data sharing, minimizing the risk of privacy leaks. This
    is achieved by using an encryption scheme that secures model parameters, while
    the blockchain ensures accurate model training. The aim of this paper is to design
    a medical data-sharing framework based on AI federated learning and blockchain.
    This framework is beneficial for predicting new cases and securely sharing medical
    data. It provides a robust trust mechanism and guarantees privacy. The main contributions
    of this paper are summarized as follows:


    +   1. We propose a quality-aware, blockchain-based federated learning approach
    to ensure the quality of the model, thereby ensuring end-to-end trust in a decentralized
    network.

    +   2. This paper designs a keychain-based federated learning algorithm with a
    secure key-sharing mechanism to protect local model parameters and ensure data
    security, aiming to improve the security of federated learning in the healthcare
    sector.

    +   3. We propose a blockchain-based method for collaboratively collecting locally
    trained model weights from different sources to train a global model.

    +   4. We demonstrate the adaptability and scalability of our block-chain-based
    federated learning framework, showcasing its efficacy and its potential applicability
    in diverse healthcare scenarios beyond brain tumor segmentation.


    # 1.3. Organization of the article


    The rest of the paper is organized as follows. We discuss the foundation of our
    work in Section 2. In Sections Section 3 and 4, we discuss the system model, local
    model, and federated learning model. Then, we discuss the performance analysis
    and security analysis in Section 5. In Section 6, we discuss the limitations of
    the study. Finally, we conclude this work in Section 7.


    # 2. Preliminaries


    # 2.1. Background of federated learning


    Federated learning is a decentralized and privacy-preserving approach to deep
    learning, allowing the development of a collective global model while ensuring
    the confidentiality of the data from all contributing clients. Furthermore, federated
    learning introduces a mechanism to collect data from various parties or hospitals
    without breaching their privacy [24, 36–38]. An advantage of the federated learning
    model is its ability to lower resource usage, such as memory and power, for each
    participant while simultaneously improving the quality of the trained model. In
    other words, federated learning learns the model collaboratively and shares the
    trained model with the participating local clients/machines. To be more specific,
    each user \(u \in U\) has his or her own private dataset \(D_u \subset D\). The
    equation for the mini-batch dataset \(D'' = \bigcup_{u \in U} D''_u\) with SGD
    at iteration \(t\) is shown below.


    ```

    \(w^{t+1} \leftarrow w^t - \eta \frac{\sum_{u \in U} \nabla_w L(D''_u, w^t)}{|U|}\)
    (1)

    ```


    Users contribute their local model parameters to the blockchain''s distributed
    ledger for training the shared global model. Afterward, users or hospitals upload
    new data, including gradients or weights, to update and enhance the global model.
    Additionally, for optimization in'
