    are four Down layers, each including a max-pooling operation for down-sampling,
    followed by a DoubleConv layer.


    Decoder Block: The decoder block contains four Up layers. Each Up layer includes
    an up-sampling operation using either trilinear interpolation or a transpose convolution,
    followed by a concatenation with the corresponding encoder feature map and a DoubleConv
    layer.


    Output Layer: A final convolutional layer maps the features to the desired number
    of classes.


    The model architecture is summarized in Table 3.


    Blockchain configuration: We use blockchain federated learning to train the model
    in parallel and updating the model with averaged parameters from each participant.
    However, for blockchain privacy the following are parameters: (i) α = 0.1 (ii).
    Hash function = SHA-256, (iii) The length of secret key = 256 bits, and (iv) γ
    = 0.8. Syft and Pytorch [32,47] Python libraries are used for the implementation
    of our proposed blockchain federated learning framework. We used a machine with
    a Quad-Core Intel Core i7 performance, 64 bits, 3.2 GHz PC with NVIDIA GEFORCE
    RTX 3080 GPU PC.


    Baseline methods: In evaluating the performance of the proposed blockchain-based
    federated learning method, we selected two federated learning algorithms and the
    centralized baseline method for the FL brain tumor segmentation task. We fine-tuned
    the baseline models with the same hyper-parameters settings as the proposed approach.
    The brief description of the FL algorithms are provided below:


    +   1. FedBN [48,49]: An effective FL algorithm that uses local batch normalization
    to alleviate the feature shift before averaging the local models of participating
    clients.

    +   2. FedAvg [50]: The defacto FL algorithm upon which all other federated learning
    algorithms are re-parameterized. It most widely used and effective FL algorithm
    in use today and provides comprehensive study of its convergence rate.

    +   3. Centralized training : A centralized training which uses the same model
    architecture on the whole training set.


    # 5.3. Performance analysis


    We evaluate the performance of our proposed method and the baseline methods by
    reporting both qualitative and quantitative results on the BraTS 20 dataset. For
    the qualitative results, we analyze the segmentation results on the whole tumor
    (WT), tumor core (TC), and enhancing tumor (ET) for the different competing methods.
    The quantitative results include the Dice score and the 95% Hausdorff distance
    evaluated on the test dataset.


    In blockchain federated learning, each institute trains the model in parallel
    and updates the averaged model parameters. We analyze the medical perspective
    segmentation performance of all baseline methods as shown in Fig. 2.'
