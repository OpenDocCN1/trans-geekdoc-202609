    # ### 3.2. Federated learning for model broadcasting


    First, we present the algorithm for training both local and global models. Algorithm
    1 displays the pseudocode for training the \(i_{th}\) local model using its dataset,
    which operates independently on the local client''s machine. The definitions of
    basic notations are presented in Table 1.


    The federated learning algorithm is used to train our model for the distributed
    hospital dataset. The _H_ hospitals is collaborating to train a global model by
    using each hospital''s private data without data leakage. Each hospital _H<sub>i</sub>_|
    \(i \in \{1, ..., n\}\), where _n_ represents the number of hospitals, has a local
    dataset _D<sub>i</sub>_ with _X<sub>i</sub>_ scheduled training sample per-trained
    model. The loss weight of the local model of each hospital, constrained on the
    model weights _w<sub>i</sub>_ calculated as


    ```

    L(w, D) = \frac{\sum_{i=1}^n L_i (w_i, D_i)}{n}, \tag{6}

    ```


    Multiple hospitals send blockchain ledger requests for the global trained model,
    and the blockchain nodes automatically adjust the number of hospitals that receive
    feedback at different times. The function that controls the _n_ requests is represented
    as follows:


    ```

    n = \gamma C, \tag{7}

    ```


    where _C_ shows the coefficient, and \(\gamma\) is the coefficient threshold.
    To this end, _n_ represents multiple hospitals that control the blockchain network
    (see Fig. 1).


    Using the following formulae, this paper optimize the objective function by decreasing
    the value of the loss function for faster model convergence:


    ```

    w^* = \min L(w) \tag{8}

    ```


    To share the weight vectors among _H_ hospitals, we employ the secret _s_ sharing
    technique. In the first phase, it generates a _m_-1 polynomial degree, where \(\beta(0)\)
    is secret key to be shared. This ensures that


    each hospital do not generate its own random number \(B_1, B_2, ..., B_{m-1}\).
    The hospitals only need to send \(s_1 = \beta(1), s_2 = \beta(2), s_3 = \beta(n)\)
    to \(H_1, H_2, ..., H_n\). The _m_ and \(\beta(1), \beta(2)...\beta(n)\) can be
    solved together, _m_-1 is not a correct solution of _s_. Homophobic encryption
    is introduce by Shamir to share the secret key [42]. Where \(\beta(d)\) is calculated
    as


    ```

    \beta(d) = s + \beta_1 d + \beta_2 d^2 + \cdots + \beta_{m-1} d^{m-1} \mod p \tag{9}

    ```


    To prevent access to each hospital''s private dataset, we implement a dynamic
    secret key sharing scheme. The time component of the secret key is divided into
    multiple parts, with each fragmented part being updated at the outset. The instance
    at time _t_ of each hospital''s snapshot of the distributed global model is recorded
    in the blockchain ledger \(s''_i\).


    Federated learning aggregates the local model parameters trained by each hospital.
    In addition to aggregating the local model weights _w_, we employ both the stochastic
    gradient descent and batch gradient descent algorithms to optimize the loss function,
    ensuring the convergence of the global model. To prevent data leakage and enhance
    data security, a secret key sharing technique is implemented to mask the model
    parameters.


    # ## 4. Blockchain based collaborative learning with effective latency


    # ### 4.1. Collaborative learning


    A deep learning model is used for the tumor segmentation task. Specifically, we
    utilized a convolutional neural network model to build the global model for collaborative
    learning on datasets from different clients. Since the medical data contains multiple
    class instances, we use the categorical cross-entropy loss function, which is
    calculated as follows:


    ```

    L = - \sum_{r=1}^{class} z_r \log (T_r) , \tag{10}

    ```'
