- pgno: 6
  md: '''whole tumor (WT)'', ''tumor core (TC)'', and ''enhancing tumor (ET)''. The
    training dataset comprises multi-parametric MRI (mpMRI) scans from 369 patients
    with diffuse glioma. Each set of mpMRI scans includes four distinct sequences:
    native T1-weighted (T1), T2-weighted (T2), post-contrast T1-weighted (T1ce), and
    T2 Fluid-Attenuated Inversion Recovery (FLAIR). All MRI volumes have been processed
    to remove the skull, co-registered to a standard anatomical atlas, and resampled
    to a voxel size of 1 mm³. Expert annotators provided ground truth tumor labels,
    which are categorized into three previously defined classes.


    Further details on the imaging and annotation protocols can be found in [44].
    This dataset includes cohorts from BraTS 2017, BraTS 2018, BraTS 2019, as well
    as new subjects, and is popularly used to benchmark machine learning algorithms
    in tumor segmentation. It is publicly available, consisting of 369 scans for training
    and 95 scans for testing. We use this dataset to evaluate our proposed blockchain-based
    FL method and the baseline algorithms for the multi-modal and multi-class segmentation
    task. For training the local clients in the framework, we adapt the state-of-the-art
    training pipeline, originally designed for centralized training scenarios.


    FL model and data setup: The proposed FL framework has ten (10) participating
    clients. First of all, we split the 369 BraTS 2020 training dataset into training
    and validation group where 300 samples and 69 samples are for the model training
    and validation, respectively. For the 300 training samples, we randomly distributed
    them among the 10 participating clients in the FL framework, with each client
    receiving 30 cases. Each case consists of four different MRI sequences: T1, T1ce,
    T2, and FLAIR. The validation set of 69 samples was used to fine-tune the FL model
    during the model validation process. The evaluation on the 95 testing samples
    was performed by the BraTS team using their test evaluation submission platform.
    Each case includes four MRI sequences that have undergone a preprocessing pipeline,
    which involves aligning the sequences to a standardized anatomical template, resampling
    the images to achieve a uniform 1 mm isotropic voxel resolution, and eliminating
    non-brain tissues through skull stripping. The performance assessment of the model
    on the test dataset is conducted using the online evaluation platform provided
    by the BraTS challenge.


    Concerning the model design of the FL framework, we utilize a modified 3D-UNet
    convolutional network [45] as our underlying FL model segmentation backbone and
    use the following training hyperparameters for all experiments: the input shape
    of the network was 155 voxels, and the learning rate for the model was 5 × e^-4.
    As in previous segmentation works [46], we minimize a soft Dice loss using the
    Adam optimizer with a learning rate of 5 × e^-4, batch size of 1, β1 of 0.9, β2
    of 0.999, and the reduce on plateau learning rate decay function. Also, we apply
    a patience of 2 for the training of the FL model. In our experimental setup, we
    configure the federated learning process to execute for a total of 200 rounds,
    with each round comprising two local epochs. A local epoch is characterized as
    the point at which each client has processed its local training samples precisely
    once. To ensure randomization, the data is shuffled locally for every client at
    the commencement of each epoch. To facilitate a comparative analysis of model
    convergence, we additionally train a centralized baseline model for 200 epochs
    using the aggregated data. The hyperparameters employed in the training of the
    federated learning model are detailed in Table 2.


    Model Architecture: The proposed federated learning (FL) model utilizes a 3D U-Net
    as its base, specifically designed for volumetric medical image segmentation.
    The model features an encoder–decoder structure complemented by skip connections,
    which effectively combine low-level spatial information with high-level semantic
    insights. The architecture is configured with 4 input channels, 3 output classes,
    and a factor of 24 output channels for convolutions.


    Encoder Block: The encoder block contains DoubleConv layers and Down layers. Each
    DoubleConv layer consists of two 3D convolutional layers followed by Group Normalization
    and ReLU activation. There


