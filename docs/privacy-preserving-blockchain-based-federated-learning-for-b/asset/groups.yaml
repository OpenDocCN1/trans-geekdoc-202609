    ## 基于区块链的隐私保护联邦学习用于脑肿瘤分割


    Rajesh Kumar ^{a}, Cobbinah M. Bernard ^{a,*}, Aman Ullah ^{a}, Riaz Ullah Khan
    ^{a}, Jay Kumar ^{b}, Delanyo K.B. Kulevome ^{c}, Rao Yunbo ^{a}, Shaoning Zeng
    ^{a}


    ^{a} 长三角地区研究所（湖州），电子科技大学，中国湖州 313001

    ^{b} 达尔豪西大学大数据分析研究所，哈利法克斯，新斯科舍省，加拿大

    ^{c} 齐鲁工业大学智能制造与控制工程系，济南，山东，250200，中国


    ## 文章信息


    - 脑肿瘤

    - 隐私保护

    - 联邦学习

    - 区块链

    - 分割


    ## 摘要


    医疗服务提供商之间改进的数据共享可以提高准确诊断的概率、更有效的治疗以及增强医疗组织的能力。一个关键的关注领域是脑肿瘤分割，这是一项复杂的任务，因为肿瘤的外观异质、形状不规则且位置可变。准确的分割对于正确的诊断和有效的治疗规划至关重要，但由于这些复杂性，当前技术往往不尽如人意。然而，健康数据的敏感性质往往禁止其共享。此外，医疗行业面临重大问题，包括保护模型的隐私和在模型中建立信任。本文提出了一种框架，通过引入使用联邦学习训练全球模型并通过许可区块链共享加密后的学习参数的机制，以解决这些隐私和信任问题。我们设计的区块链-联邦学习算法在许可区块链中聚合梯度以去中心化全球模型，而引入的掩码方法保留了模型参数的隐私。与传统的原始数据共享不同，这种方法使医院或医学研究中心能够为全球学习模型做出贡献，从而提高所有参与医疗实体的中央模型性能。因此，全球模型可以了解几种特定疾病，并为每个贡献者带来新疾病诊断任务，从而带来更好的治疗选择。所提议的算法在聚合本地模型时确保模型数据的质量，使用异步联邦学习程序来评估共享模型的质量。实验结果表明，所提议方案对于脑肿瘤分割这一关键且具有挑战性的任务具有效性。具体来说，与基线方法相比，我们的方法在增强肿瘤的Dice相似系数方面实现了1.99%的改进，在全肿瘤的Hausdorff距离方面实现了19.08%的减少，突显了分割性能和可靠性的显著提升。


    ## 1. 引言


    医疗物联网（IoMT）技术的大规模增长，加上机器学习的近期快速发展，已经彻底改变了医学科学领域 [1–4]。用于疾病部分诊断的新外科设备的设计，为患者治疗打开了许多可能性。在过去十年中，AI方法已被广泛采用以解决关键问题，大量研究人员致力于脑部MRI分析
    [5]、肺部CT扫描分析 [6,7]、临床处方分析 [8,9] 以及更多问题 [10,11]。此外，AI技术的进步促进了诊断准确性的提升，例如增强的癫痫发作识别
    [10] 以及使用卷积神经网络分类猴痘等复杂病症的创新方法 [12]。这些方法凸显了AI在彻底改变诊断和患者治疗策略方面的潜力，尤其是在与IoMT设备集成时。与其他领域（如车辆重新识别
    [13] 和传感器数据分析 [14]）的研究问题不同，健康数据高度机密 [15]。因此，利用的AI方法有限，仅使用少量数据来构建模型。健康数据的隐私是医院和病理实验室等医疗组织的首要关切。然而，AI模型的鲁棒性通常需要大量数据。不同患者病例和问题的动态性要求新技术和工具来有效链接和协作整合来自不同医院的数据。出于这个原因，越来越多的医院正在寻求安全的数据共享方法，以预测和诊断新型病毒和疾病症状。


    为了解决IoMT工业4.0中医疗组织面临的隐私挑战 [16–18]，已作出大量努力来完善和优化个人隐私保护 [19, 20]。目前，基于联邦学习的方法通过在分布式场景中保留边缘智能，在解决隐私问题方面显示出希望
    [21, 22]。


    有效处理数据隐私还显著降低了数据传输成本。这种减少是因为集中式网络中的每个节点使用其自身数据优化本地模型，并且仅传输学习到的模型参数 [20]。一般来说，在大多数情况下，本地模型优化采用梯度下降算法。通过此过程，每个节点（例如医院、病理实验室或其他医疗组织）保留其本地数据。随后，共享的学习参数由中央协调者聚合，以协作开发全球模型
    [23–27]。然而，联邦学习中的协作方案仍然面临重大风险和挑战，特别是关于参与节点的可信度及其本地模型的质量。例如，虽然 [28] 提出了一种用于共享梯度的分布式模型，但他们的方法已显示出对被动攻击者的脆弱性
    [29, 30]。


    ### 1.1. 动机


    在过去几年中，区块链和联邦学习已成为促进每个节点数据分布式和安全共享的新兴方法 [27]。区块链的特性，如可追溯性、匿名性和防篡改性，已引起研究人员的大量关注，以增强智能电网、车联网和医疗数据网络等许多领域的节点和数据安全
    [3]。这一转变与管理敏感健康数据的安全平台的需求相一致，正如各项研究所强调的，包括使用区块链来优化数据隐私和系统安全 [9, 11, 31]。另一方面，Shen
    et al. [1] 在医疗领域设计了一种基于联邦学习的多协作系统。现有工作的激励机制仅考虑基于服务器的模型聚合 [23–27, 32]，而我们的工作则考虑医疗领域的基于区块链的聚合。此外，Kumar
    et al. [3] 结合了区块链和联邦学习方法来创建去中心化模型，但 [3] 的缺点是不考虑新本地模型之间的信任机制。


    Bonawitz et al. [33] 设计了一个隐私保护框架，以使用联邦学习全球模型安全地聚合梯度，而 [34] 提出了一种同态加密（HE）方案和阈值秘密共享来保护梯度。然而，这些方案中的每次聚合都需要多轮，不适合区块链分布式网络。此外，他们的方法仅限于学习预定义的类别（在此情况下为疾病），无法从新类别中学习。总的来说，必须以适当的答案解决一些重要的研究问题。这些重要的研究问题（RQ）中的一些将在下面进一步介绍。


    - **RQ1:** 如何开发一个集成多方的协作处理系统？

    - **RQ2:** 如何在保持本地模型质量的同时建立对新本地模型的信任？

    - **RQ3:** 如何开发一种机制来确保医院的隐私？


    ### 1.2. 研究方法与贡献


    为了增强用户隐私和信任，我们将区块链与联邦学习技术相结合。区块链为在不受信任的参与者之间训练全球模型提供了一种可靠的方案，从而促进高效的数据共享 [35]。所提议的方案通过比较新模型与现有模型的准确性来建立信任。这样，区块链在各方之间建立信任，并确保准确的模型训练。我们还设计了一种基于区块链的分布式架构，用于安全数据共享，最大限度地降低隐私泄露的风险。这是通过使用保护模型参数的加密方案来实现的，同时区块链确保准确的模型训练。本文旨在设计一种基于AI联邦学习和区块链的医疗数据共享框架。该框架有助于预测新病例并安全共享医疗数据。它提供了强大的信任机制并保证隐私。本文的主要贡献总结如下：


    1. 我们提出了一种基于区块链的质量感知联邦学习方法，以确保模型质量，从而在去中心化网络中确保端到端的信任。

    2. 本文设计了一种基于密钥链的联邦学习算法，具有安全的密钥共享机制，以保护本地模型参数并确保数据安全，旨在提高医疗领域联邦学习的安全性。

    3. 我们提出了一种基于区块链的方法，用于协作收集来自不同来源的本地训练模型权重，以训练全局模型。

    4. 我们展示了我们基于区块链的联邦学习框架的适应性和可扩展性，凸显了其有效性及其在脑肿瘤分割之外的多种医疗场景中的潜在适用性。


    ### 1.3. 文章组织


    本文的其余部分组织如下。我们在第2节中讨论工作的基础。在第3节和第4节中，我们讨论系统模型、本地模型和联邦学习模型。然后，我们在第5节中讨论性能分析和安全性分析。在第6节中，我们讨论研究的局限性。最后，我们在第7节中总结这项工作。


