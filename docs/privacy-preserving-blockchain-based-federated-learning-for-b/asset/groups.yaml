    We also examine the latency of the blockchain. Fig. 5 shows the convex shape of
    the Signal-to-noise ratio (SNR), and \(\lambda\) is decreased when SNR is increased.
    The block generation rate depends on the average latency rate of blockchain federated
    learning. Our proposed model calculates the latency of the blockchain to generate
    the blocks in federated learning.


    The trustworthiness of the proposed blockchain-based approach was rigorously analyzed.
    Fig. 4a illustrates that setting \(\alpha\) to 0.05 led to an initial decrease
    and subsequent gradual increase in trust values. Conversely, with \(\alpha\) set
    to 0.2, hospital trust values fluctuated dramatically, obscuring the relationship
    between trust values and the model''s accuracy. To mitigate rapid fluctuations
    in trust values within a short timeframe, \(\alpha\) was adjusted to 0.1. This
    adjustment facilitated a more stable observation of the impact of model accuracy
    on trust values over an extended period. Specifically, it depicts the influence
    of model accuracy on the trust value over a longer period.


    Additionally, we evaluated the computational efficiency of our proposed model
    in comparison to the baseline methods. The average training runtime of the proposed
    blockchain federated framework is 32 h. In contrast, the runtimes for FedBN, FedAvg,
    and centralized methods are 29.5, 30, and 29 h, respectively. Although our model
    exhibited the longest runtime, this was a trade-off for enhanced segmentation
    performance and robust privacy within the federated learning framework. This evaluation
    highlights the balance between computational efficiency and privacy preservation
    inherent in our approach.


    ## 5.4. Comparison with other methods


    Many studies have been conducted to detect brain tumors, including [44,52,53,55,58–60].
    These studies, however, often overlook the importance of data sharing in enhancing
    global model performance, particularly in medical imaging where data scarcity,
    due to privacy concerns, is a significant hurdle. Our proposed framework addresses
    this gap by incorporating a privacy-preserving mechanism that enables collaborative
    training while maintaining data confidentiality. Unlike traditional methods, our
    approach ensures robust performance even in data-limited scenarios. We provide
    a detailed comparison of our federated permissioned blockchain algorithm with
    both contemporary deep learning models and classical approaches in brain tumor
    detection (refer to Table 6). Our results demonstrate that our method maintains
    high accuracy, comparable to scenarios where the entire dataset is used, by effectively
    distributing data across multiple entities and securely aggregating model weights
    through our innovative blockchain-based federated learning system. The proposed
    method outperforms these methods across all metrics, which includes the Dice score
    and Hausdorff distance for enhancing tumor (ET), whole tumor (WT), and tumor core
    (TC) on both validation and test datasets of BraTS 2020.


    These findings can be attributed to the effective aggregation of local model updates
    within the blockchain-based federated learning (FL) framework, which appears to
    enhance the model’s generalization capabilities across diverse data distributions
    from various institutions. The consistent performance across different tumor regions
    indicates that the proposed method can adeptly handle the variability and complexity
    inherent in brain tumor segmentation tasks.


    By examining the convergence graphs, it is clear that the proposed method achieves
    robustness and generalization more rapidly than baseline methods. This is likely
    due to its proficiency in managing statistical heterogeneity among the data from
    different clients. This underscores the potential of blockchain-based FL not only
    to preserve privacy but also to bolster collaborative learning in a decentralized
    and secure environment.


    Additionally, these outcomes not only underscore the feasibility of our approach
    in real-world medical applications but also highlight its potential to transform
    collaborative medical data analytics.


    ## 7. Conclusion


    In this article, we focused on the problem of secure data sharing and trained
    a federated learning model in a decentralized network. The proposed framework,
    composed of federated learning and blockchain, provides secure data sharing and
    protects the data. Moreover, the blockchain-based algorithm aggregates local model
    updates while ensuring data privacy. Furthermore, we integrate the blockchain-based
    federated learning technique to develop an intelligent model that preserves the
    privacy of data providers and fosters trust in the data training process. The
    experimental results showed that our proposed method achieved a 1.99% improvement
    in the Dice similarity coefficient for enhancing tumors and a 19.08% reduction
    in Hausdorff distance for whole tumors compared to the baseline methods. These
    improvements are significant as they demonstrate enhanced accuracy and robustness
    in brain tumor segmentation, leading to better diagnostic capabilities and treatment
    planning. By addressing privacy concerns and improving segmentation performance,
    our framework represents a substantial step forward in the application of federated
    learning in medical image analysis. Future research will focus on optimizing the
    computational efficiency and latency of blockchain operations, exploring more
    efficient consensus algorithms, implementing parallel processing strategies, and
    addressing data heterogeneity challenges. These efforts aim to develop more robust,
    scalable, and practical solutions for secure data sharing and collaborative learning
    in the healthcare domain.


    ## 6. Limitation and future works


    The blockchain-based federated learning framework we propose shows promise in
    enhancing privacy and security for collaborative brain tumor segmentation. However,
    it is important to recognize the limitations of our study and suggest potential
    areas for future research.


    A significant limitation of the current framework is the increased computational
    overhead and latency caused by the blockchain process. Unlike traditional federated
    learning methods, our approach requires additional computations to maintain the
    blockchain and achieve consensus among nodes, resulting in longer training times
    and decreased efficiency. To address this issue and improve practically for real-world
    applications, further optimizations are necessary. Future research should investigate
    more efficient consensus algorithms and parallel processing strategies to streamline
    blockchain operations and reduce computational demands.


    Another limitation lies in the framework’s ability to handle extreme data heterogeneity
    among participating clients. In practical scenarios, data distributions and characteristics
    can differ significantly across various hospitals or medical institutions. The
    performance and robustness of our framework under these heterogeneous conditions
    necessitate extensive evaluation. Future research should broaden the scope of
    experiments to include a larger number of clients with diverse data distributions,
    simulating varying levels of heterogeneity to assess the framework’s generalizability
    and identify areas for improvement. Moreover, exploring techniques such as transfer
    learning, domain adaptation, or personalized federated learning could help tackle
    the challenges posed by non-IID data distributions.


    Ultimately, while the proposed blockchain-based federated learning framework represents
    a significant step towards enabling secure and privacy-preserving collaborative
    medical image analysis, there is still room for improvement and further investigation.
    By addressing the limitations related to computational efficiency and data heterogeneity,
    future research can build upon the foundation laid by this study and contribute
    to developing more robust, scalable, and practical solutions for secure data sharing
    and collaborative learning in the healthcare domain.


