    # Privacy-preserving blockchain-based federated learning for brain tumor segmentation


    Rajesh Kumar ^{a}, Cobbinah M. Bernard ^{a,*}, Aman Ullah ^{a}, Riaz Ullah Khan
    ^{a}, Jay Kumar ^{b}, Delanyo K.B. Kulevome ^{c}, Rao Yunbo ^{a}, Shaoning Zeng
