    \n### 2.2. 区块链背景\n\n为工业 4.0 训练有效的 AI 模型需要从多个来源收集数据，同时不损害隐私。为了对用户进行身份验证，区块链网络是必不可少的。在中央服务器上的联邦学习中仍然存在一些挑战，例如激励不足和中毒攻击的风险。为了解决这些问题，一些作者，例如\
