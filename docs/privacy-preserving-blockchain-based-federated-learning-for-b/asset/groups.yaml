    提出的方法在分割任务中平衡了时间权衡，增强了隐私、信任和鲁棒性。


    我们还考察了区块链的延迟。图 5 显示了信噪比（SNR）的凸形，当 SNR 增加时，\(\lambda\) 会降低。区块生成率取决于联邦学习区块链的平均延迟率。我们提出的模型计算联邦学习中生成区块的区块链延迟。


    提出的基于区块链的方法的可信度经过了严格分析。图 4a 表明，将 \(\alpha\) 设置为 0.05 会导致信任值最初下降，随后逐渐上升。相反，当 \(\alpha\)
    设置为 0.2 时，医院的信任值剧烈波动，掩盖了信任值与模型准确率之间的关系。为了缓解短时间内信任值的快速波动，将 \(\alpha\) 调整为 0.1。这一调整有助于在更长的时间段内更稳定地观察模型准确率对信任值的影响。具体而言，它描绘了模型准确率在较长时间内对信任值的影响。


    此外，我们将所提模型的计算效率与基线方法进行了评估。所提联邦区块链框架的平均训练运行时间为 32 小时。相比之下，FedBN、FedAvg 和集中式方法的运行时间分别为
    29.5、30 和 29 小时。尽管我们的模型运行时间最长，但这是在联邦学习框架内以提升分割性能和强健隐私为代价所做的权衡。此次评估凸显了我们方法中计算效率与隐私保护之间的平衡。


    ## 5.4. 与其他方法的比较


    已有大量研究致力于脑肿瘤检测，包括 [44,52,53,55,58–60]。然而，这些研究常常忽视数据共享对提升全局模型性能的重要性，尤其是在医学影像领域，由于隐私顾虑导致的数据稀缺是一个重大障碍。我们提出的框架通过引入隐私保护机制来弥补这一差距，该机制在保持数据机密性的同时支持协作训练。与传统方法不同，我们的方法即使在数据受限的场景中也能确保强健的性能。我们对联邦许可型区块链算法与当代深度学习模型以及脑肿瘤检测的经典方法进行了详细对比（参见表
    6）。研究结果表明，我们的方法能够通过有效跨多个实体分发数据，并借助创新的基于区块链的联邦学习系统安全聚合模型权重，在使用完整数据集的场景中保持可比的高准确率。所提方法在
    BraTS 2020 的验证集和测试集中，针对增强肿瘤（ET）、全肿瘤（WT）和肿瘤核心（TC）的 Dice 得分和豪斯多夫距离等所有指标上均优于这些方法。


    这些发现可归因于基于区块链的联邦学习（FL）框架内对本地模型更新的有效聚合，该机制似乎增强了模型跨不同机构多样数据分布的泛化能力。在不同肿瘤区域中保持一致的性能表明，所提方法能够娴熟处理脑肿瘤分割任务中固有的变异性和复杂性。


    通过考察收敛曲线，可以清楚地看出，所提方法比基线方法更快地实现了鲁棒性和泛化能力。这很可能归功于其在管理不同客户端数据统计异质性方面的熟练能力。这凸显了基于区块链的
    FL 不仅能保护隐私，还能在去中心化和安全的环境中增强协作学习的潜力。


    此外，这些结果不仅凸显了我们方法在现实医疗应用中的可行性，还强调了其转变协作医疗数据分析的潜力。


    ## 7. 结论


    在本文中，我们着重解决安全数据共享问题，并在去中心化网络中训练了联邦学习模型。所提框架由联邦学习和区块链组成，可提供安全数据共享并保护数据。此外，基于区块链的算法在确保数据隐私的同时聚合本地模型更新。再者，我们将基于区块链的联邦学习技术集成起来，开发出一种智能模型，以保护数据提供者的隐私并增强对数据训练过程的信任。实验结果表明，与基线方法相比，我们提出的方法在增强肿瘤的
    Dice 相似系数上提升了 1.99%，在全肿瘤的豪斯多夫距离上降低了 19.08%。这些改进具有重要意义，因为它们表明脑肿瘤分割的准确性和鲁棒性得到提升，从而带来更好的诊断能力和治疗规划。通过解决隐私问题并提升分割性能，我们的框架在联邦学习于医学影像分析中的应用方面迈出了重要一步。未来研究将重点放在优化区块链操作的计算效率和延迟、探索更高效的共识算法、实现并行处理策略以及应对数据异质性挑战上。这些努力旨在为医疗领域中的安全数据共享和协作学习开发更加强健、可扩展且实用的解决方案。


    ## 6. 局限性与未来工作


    我们提出的基于区块链的联邦学习框架在增强协作脑肿瘤分割的隐私和安全性方面前景广阔。然而，认识到本研究的局限性并提出未来研究的潜在方向至关重要。


    当前框架的一个显著局限性是区块链过程导致的计算开销和延迟增加。与传统的联邦学习方法不同，我们的方法需要额外的计算来维护区块链并实现节点间共识，从而导致更长的训练时间和较低的效率。为了解决这一问题并提升实际应用性，有必要进行进一步优化。未来研究应探索更高效的共识算法和并行处理策略，以简化区块链操作并降低计算需求。


    另一个局限性在于该框架处理参与客户端间极端数据异质性的能力。在实际场景中，不同医院或医疗机构的数据分布和特征可能存在显著差异。框架在这些异质条件下的性能和鲁棒性需要进行广泛评估。未来研究应扩大实验范围，纳入更多具有多样化数据分布的客户端，模拟不同程度的异质性，以评估框架的泛化能力并找出改进领域。此外，探索迁移学习、域适应或个性化联邦学习等技术，有助于应对非
    IID 数据分布所带来的挑战。


    最终，尽管所提基于区块链的联邦学习框架在实现安全、保护隐私的协作医学图像分析方面迈出了重要一步，但仍有改进和进一步探究的空间。通过解决与计算效率和数据异质性相关的局限性，未来研究可以在此研究奠定的基础上，为医疗领域中的安全数据共享和协作学习开发更加强健、可扩展且实用的解决方案。


