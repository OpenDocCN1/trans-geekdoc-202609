    live how to create a GPU instance on Amazon AWS EC2, and prove to you that training
    a neural network with GPU optimization can be orders of magnitude faster than
    on your CPU.


    [Data Science: Practical Deep Learning in Theano and TensorFlow](https://www.udemy.com/data-science-deep-learning-in-theano-tensorflow/)


    [https://www.udemy.com/data-science-deep-learning-in-theano-tensorflow](https://www.udemy.com/data-science-deep-learning-in-theano-tensorflow)


    When you’ve got the basics of deep learning down, you’re ready to explore alternative
    architectures. One very popular alternative is the convolutional neural network,
    created specifically for image classification. These have promising applications
    in medical imaging, self-driving vehicles, and more. In this course, I show you
    how to build convolutional nets in Theano and TensorFlow.


    [Deep Learning: Convolutional Neural Networks in Python](https://www.udemy.com/deep-learning-convolutional-neural-networks-theano-tensorflow)


    [https://www.udemy.com/deep-learning-convolutional-neural-networks-theano-tensorflow](https://www.udemy.com/deep-learning-convolutional-neural-networks-theano-tensorflow)


    In part 4 of my deep learning series, I take you through unsupervised deep learning
    methods. We study principal components analysis (PCA), t-SNE (jointly developed
    by the godfather of deep learning, Geoffrey Hinton), deep autoencoders, and restricted
    Boltzmann machines (RBMs). I demonstrate how unsupervised pretraining on a deep
    network with autoencoders and RBMs can improve supervised learning performance.


    [Unsupervised Deep Learning in Python](https://www.udemy.com/unsupervised-deep-learning-in-python)


    [https://www.udemy.com/unsupervised-deep-learning-in-python](https://www.udemy.com/unsupervised-deep-learning-in-python)


    Would you like an introduction to the basic building block of neural networks
    - logistic regression? In this course I teach the theory of logistic regression
    (our computational model of the neuron), and give you an in-depth look at binary
    classification, manually creating features, and gradient descent. You might want
    to check this course out if you found the material in this book too challenging.'
