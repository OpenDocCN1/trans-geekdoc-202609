    to specify the parameter updates.


    The downside to this is you are stuck with the optimization methods that Google
    has implemented. There are a wide variety in addition to pure gradient descent,
    including RMSProp (an adaptive learning rate method), and MomentumOptimizer (which
    allows you to move out of local minima using the speed of past weight changes).


    I suspect that the full list will be updated in the near future, since forum posts
    indicate that Nesterov momentum is currently being worked on.


    Next, create an op to initialize your variables (for this problem, it’s just “u”):


    init = tf.initialize\_all\_variables()


    And lastly, run your session:


    with tf.Session() as session:


    session.run(init)


    for i in xrange(12):


    session.run(train\_op)


    print "i = %d, cost = %.3f, u = %.3f" % (i, cost.eval(), u.eval())


    A neural network in TensorFlow


    Let’s create our input, target, and weight variables. Notice I have again omitted
    the bias terms for you to do as an exercise. Also notice that a Theano shared
    = TensorFlow variable:


    X = tf.placeholder(tf.float32, shape=(None, D), name=''X'')


    T = tf.placeholder(tf.float32, shape=(None, K), name=''T'')


    W1 = tf.Variable(W1\_init.astype(np.float32))


    W2 = tf.Variable(W2\_init.astype(np.float32))


    Let me repeat, since it’s kind of confusing - a Theano variable != TensorFlow
    variable.


    We can specify “None” in our shapes because we want to be able to pass in variable
    lengths - i.e. batch size, test set size, etc.


    Now let’s calculate the output (notice I’m using ReLU as my hidden layer nonlinearity,
    which is a little different from sigmoid and softmax):


    Z = tf.nn.relu( tf.matmul(X, W1) )


    Yish = tf.matmul(Z, W2)


    I call this “Yish” because we haven’t done the final softmax step.


    The reason we don’t do this is because it’s included in how we compute the cost
    function (that’s just how TensorFlow functions work). You don’t want to softmax
    this variable because you’d effectively end up softmax-ing twice. We calculate
    the cost as follows:


    cost = tf.reduce\_sum(


    tf.nn.softmax\_cross\_entropy\_with\_logits(


    Yish,


    T


    )


    )


    While these functions probably all seem unfamiliar and foreign, with enough consultation
    of the TensorFlow documentation, you will acclimate yourself to them.


    Like our Theano example, we want to create train and predict functions also:


    train\_op = tf.train.RMSPropOptimizer(


    learning\_rate,


    decay=0.99,


    momentum=0.9).minimize(cost)


    predict\_op = tf.argmax(Yish, 1)


    Notice how, unlike Theano, I did not even have to specify a weight update expression!
    One could argue that it is sort of redundant since you are pretty much always
    going to use w += learning\_rate\*gradient. However, if you want different techniques
    like adaptive learning rates and momentum you are at the mercy of Google. Luckily,
    their engineers have already included RMSProp (for an adaptive learning rate)
    and momentum, which I have used above. To learn about their other optimization
    functions, consult their documentation.


    In TensorFlow, you need to call a special function to initialize all the variable
    objects. You do that like this:


    init = tf.initialize\_all\_variables()


    And then finally, you run your train and predict functions in a loop, inside a
    session:


    with tf.Session() as session:


    session.run(init)


    for i in xrange(max\_iter):


    for j in xrange(n\_batches):


    Xbatch = Xtrain\[j\*batch\_sz:(j\*batch\_sz + batch\_sz),\]


    Ybatch = Ytrain\_ind\[j\*batch\_sz:(j\*batch\_sz + batch\_sz),\]


    session.run(train\_op, feed\_dict={X: Xbatch, T: Ybatch})


    if j % print\_period == 0:


    test\_cost = session.run(cost, feed\_dict={X: Xtest, T: Ytest\_ind})


    prediction = session.run(predict\_op, feed\_dict={X: Xtest})


    print error\_rate(prediction, Ytest)


    Notice we are again using batch gradient descent.


    The error\_rate function was defined as:


    def error\_rate(p, t):


    return np.mean(p != t)


    Ytrain\_ind and Ytest\_ind are defined as before.


    Exercise


    Run your TensorFlow neural network on the MNIST dataset:


    Create a 1-hidden layer neural network with 500, 1000, 2000, and 3000 hidden units.
    What is the impact on training error and test error?


    Create neural networks with 1, 2, and 3 hidden layers, all with 500 hidden units.
    What is the impact on training error and test error? (Hint: It should be overfitting
    when you have too many hidden layers).


    Chapter 7: Improving backpropagation with modern techniques - momentum, adaptive
    learning rate, and regularization


    All of the techniques I describe in this section are simple to explain. However,
    this simplicity hides their usefulness and can be a bit misleading.


    Why do I say this?


    Every single one of these techniques, I could explain to you in a few minutes.


    But remember that what we are doing here is computer science - programming.


    The simple act of me telling you an equation is not what is going to make you
    good.


    If I elaborate on the idea, it will still not make you good.


    If you watch me derive the equations on YouTube, it will still not make you good.


    If you watch me put them into my code, it will still not make you good.


    If you watch me run the code, it will still not make you good.


    So how do you get good?


    Well, this is the field of programming. So you have to program. Take the equation,
    put it into your code, and watch it run. Compare its performance to plain backpropagation.


    Take your time, observe and experiment.


    This is what will enhance your intuition and understanding.


    Momentum


    Momentum in gradient descent works like momentum in physics. If you were moving
    in a certain direction already, you will continue to move in that direction, carried
    forward by your momentum.


    Momentum is defined as the last weight change.


    v(t) = dw(t - 1)


    The next weight change is a function of both the gradient of the cost with respect
    to the weights and the momentum.


    w(t) = w(t-1) + mu\*v(t) - learning\_rate\*dJ(t)/dw


    Where mu is called the momentum parameter (usually set to around 0.99).


    You can simplify this as follows:


    dw(t) = mu\*dw(t-1) - learning\_rate\*dJ(t)/dw


    And then:


    w(t) += dw(t)


    Momentum greatly speeds up the learning process.


    Adaptive learning rate


    There are many types of adaptive learning rate, but they all have one theme in
    common - decreasing over time.


    For example, you could just halve your learning rate every 10 epochs.


    e.g.


    if epoch % 10 == 0:


    learning\_rate /= 2


    Another method is inverse decay:


    learning\_rate = A/(1 + kt)


    Another method is exponential decay:


    learning\_rate = A \* exp(-kt)'
