- fmt: "\nThere is no way for us to “solve for W and V” in closed form. Recall from\
    \ calculus that the typical way to do this is to find the derivative and set it\
    \ to 0. We have to instead “optimize” our objective function using a method called\
    \ gradient descent.\n\n### What is the objective function we’ll use?\n\n`J = -sum_from_n=1..N\
    \ ( sum_from_k=1..K ( T[n,k] * logY[n,k] ) )`\n\nYou’ll notice that this is just\
    \ the negative log-likelihood. (Think about how you would calculate the likelihood\
    \ of the faces of a die given a dataset of die rolls, and you should get a result\
    \ in a similar form).\n\nAnd if you turned your label/target variables (now called\
    \ `T`) into an indicator matrix like I mentioned, it should now be, well, a matrix,\
    \ thus having 2 indices, `n` and `k`, as above.\n\nIn Numpy this could be calculated\
    \ as follows:\n\n```python\ndef cost(T, Y):\n    return -(T*np.log(Y)).sum()\n\
    ```\n\nSo now that we have an objective function, how do we optimize it? We use\
    \ a method called “gradient descent”, where we “travel” along the gradient of\
    \ `J` with respect to `W` and `V`, until we hit a minimum.\n\nIn a picture, gradient\
    \ descent looks like this.\n\n![pasted-image.jpg](images/00005.jpeg)\n\nConvince\
    \ yourself that by going along the direction of the gradient, we will always end\
    \ up at a “lower” `J` than where we started.\n\nIn general, knowing how to compute\
    \ the gradient is not necessary unless you want to know how to code a neural network\
    \ yourself in Numpy, which we do in my course at [https://udemy.com/data-science-deep-learning-in-python].\
    \ In this book, since we are focusing on Theano and TensorFlow, we will not do\
    \ this.\n\nOnce you find the gradient, you want to take small steps in that direction.\n\
    \nYou can imagine that if your steps are too large, you’ll just end up on the\
    \ “other side” of the canyon, bouncing back and forth!\n\nThus we do our weight\
    \ updates like so:\n\n`weight = weight - learning_rate * gradient_of_J_wrt_weight`\n\
    \nIn a more “mathy” form:\n\n`w = w - learning_rate * dJ/dw`\n\nWhere the learning\
    \ rate is a very small number, i.e., `0.00001`. (Note: if the number is too small,\
    \ gradient descent will take a very long time. I show you how to optimize this\
    \ value in my Udemy course).\n\nThat is all there is to it!\n\nIf you want to\
    \ convince yourself that this works, I would recommend trying to optimize a function\
    \ you already know how to solve, such as a quadratic.\n\nFor example, your objective\
    \ would be `J = x**2 + x`, and the gradient of `J` is `2x + 1`, so the minimum\
    \ can be found at `-1/2`.\n\nThere is one slight problem with this update formula\
    \ as it concerns neural networks - and that is, unlike logistic regression which\
    \ has a global minimum - with neural networks you are susceptible to local minima.\n\
    \nSo you may see your error curve fall and then eventually become flat, but the\
    \ final error it is attempting to reach is not the best possible. Some more advanced\
    \ methods, like momentum, can help alleviate this problem.\n\n### Why is it called\
    \ “backpropagation”?\n\nConsider a neural network:\n\n`o--W--V--o`\n`x z y`\n\n\
    Where I have replaced the usual “multi-node” representations of `x`, and `y` by\
    \ single nodes representing those vectors. This becomes more convenient when you\
    \ consider deeper networks.\n\nIf you are proficient in multi-variable calculus\
    \ and would like to attempt to derive the gradient of `J` yourself, you will begin\
    \ to notice some patterns. First that the error at `y` is always `t - y`, where\
    \ `t` is the target variable. The weight `V` depends on `t - y` - the error at\
    \ `y`. When you derive the gradient for `W`, you will notice that it depends on\
    \ the error at `z`. If you extended this network to have more than 1 layer, you\
    \ would notice the same pattern. It is a recursive structure, and you will see\
    \ it directly in the code.\n\nThe error of a weight will always depend on the\
    \ nodes to the immediate right (which themselves depend on the errors to the right,\
    \ etc.) This graphical recursive structure is what allows libraries like Theano\
    \ and TensorFlow to automatically calculate gradients for you. (Note: If you would\
    \ like to see me derive the gradients with respect to the weights in a deep neural\
    \ network by hand, check out my course at [https://www.udemy.com/data-science-deep-learning-in-python]).\n\
    \n### Exercise\n\nUse gradient descent to optimize the following:\n- `maximize\
    \ J = log(x) + log(1-x)`, `0 < x < 1`\n- `maximize J = sin(x)`, `0 < x < pi`\n\
    - `minimize J = 1 - x^2 - y^2`, `0 <= x <= 1`, `0 <= y <= 1`, `x + y = 1`\n\n\
    ### More Code\n\nBefore we start looking at Theano and TensorFlow, I want you\
    \ to get a neural network set up with pure Numpy and Python. Assuming you’ve went\
    \ through the previous chapters, you should already have code to load the data\
    \ and feed the data into the neural network in the forward direction.\n\n```python\n\
    # ... load data into X, T...\n# ... initialize W1 and W2\n\ndef forward(X, W1,\
    \ W2):\n    Z = sigmoid(X.dot(W1))\n    Y = softmax(Z.dot(W2))\n    return Y,\
    \ Z\n\ndef grad_W2(Z, T, Y):\n    return Z.T.dot(Y - T)\n\ndef grad_W1(X, Z, Y,\
    \ W2):\n    return X.T.dot(((Y - T).dot(W2.T)) * (1 - Z)))\n\nfor i in xrange(epochs):\n\
    \    Y, Z = forward(X, W1, W2)\n    W2 -= learning_rate * grad_W2(Z, T, Y)\n \
    \   W1 -= learning_rate * grad_W1(X, Z, Y, W2)\n    print cost(T, Y)\n```\n\n\
    And watch the cost magically decrease on every iteration of the loop! Some notes\
    \ about this code:\n\n- I have renamed the target variables `T` and the output\
    \ of the neural network `Y`. In the previous chapter I called the targets `Y`\
    \ and the output of the network `p_y_given_x`.\n- Notice we return both `Z` (the\
    \ hidden layer values) as well as `Y` in the `forward()` function. That’s because\
    \ we need both to calculate the gradient.\n- Don’t worry about how I calculated\
    \ the gradient functions, unless you know enough calculus to derive them yourself\
    \ and then implement them in code.\n\nSo what exactly is backpropagation? It just\
    \ means the “error” is getting propagated backward through the neural network.\
    \ Notice how `Y - T` shows up in both gradients. If you had more than 1 hidden\
    \ layer in the neural network, you would notice more patterns emerge. Notice that\
    \ we loop through a number of `epochs`, calculating the error on the entire dataset\
    \ at the same time. Refer back to chapter 2, when I talked about repetition in\
    \ biological analogies. We are just repeatedly showing the neural network the\
    \ same samples again and again.\n\n### Exercise\n\nUse the above code on the MNIST\
    \ dataset, or whatever dataset you chose to download. Add bias terms, or add a\
    \ column of 1s to the matrix `X` and `Z` so that you effectively have bias terms.\
    \ In addition to printing the cost, also print the classification rate or error\
    \ rate. Does a lower cost guarantee a lower error rate?\n\n# Chapter 5: Theano\n\
    \nTheano is a Python library that is very popular for deep learning. It allows\
    \ you to take advantage of the GPU for faster floating point calculations, since,\
    \ as you may have seen, gradient descent can take quite awhile.\n\nIn this book\
    \ I show you how to write Theano code, but if you want to know the particulars\
    \ about how to get a machine that has GPU capabilities and how to tweak your Theano\
    \ code and commands to use them, you’ll want to consult my course at: [https://udemy.com/data-science-deep-learning-in-theano-tensorflow].\n\
    \nIf you would like to view this code in a Python file on your computer, please\
    \ go to: [https://github.com/lazyprogrammer/machine_learning_examples/tree/master/ann_class2].\
    \ The relevant files are:\n- `theano1.py`\n- `theano2.py`\n\n# Theano Basics\n\
    \nLearning Numpy when you already know Python is pretty easy, right? You simply\
