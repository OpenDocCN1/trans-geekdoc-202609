    The grad function takes in 2 parameters: the function you want to take the gradient
    of, and the variable you want the gradient with respect to. You can pass in multiple
    variables as a list into the 2nd parameter, as we’ll be doing later for each of
    the weights of the neural network.


    Now let’s create a Theano train function. We’re going to add a new argument called
    the updates argument. It takes in a list of tuples, and each tuple has 2 things
    in it. The first thing is the shared variable to update, and the 2nd thing is
    the update expression to use.


    train = theano.function(inputs=\[\], outputs=cost, updates=\[(x, x\_update)\])


    Notice that ‘x’ is not an input, it’s the thing we update. In later examples,
    the inputs will be the data and labels. So the inputs param takes in data and
    labels, and the updates param takes in your model parameters with their updates.


    Now we simply write a loop to call the train function again and again:


    for i in xrange(25):


    cost\_val = train()


    print cost\_val


    And print the optimal value of x:


    print x.get\_value()


    Now let’s take all these basic concepts and build a neural network in Theano.


    A neural network in Theano


    First, I’m going to define my inputs, outputs, and weights (the weights will be
    shared variables):


    thX = T.matrix(''X'')


    thT = T.matrix(''T'')


    W1 = theano.shared(np.random.randn(D, M), ''W1'')


    W2 = theano.shared(np.random.randn(M, K), ‘W2'')


    Notice I’ve added a “th” prefix to the Theano variables because I’m going to call
    my actual data, which are Numpy arrays, X and T.


    Recall that M is the number of units in the hidden layer.


    Next, I define the feedforward action.


    thZ = T.tanh( thX.dot(W1))


    thY = T.nnet.softmax( thZ.dot(W2) )


    T.tanh is a non-linear function similar to the sigmoid, but it ranges between
    -1 and +1.


    Next I define my cost function and my prediction function (this is used to calculate
    the classification error later).


    cost = -(thT \* T.log(thY)).sum()


    prediction = T.argmax(thY, axis=1)


    And I define my update expressions. (notice how Theano has a function to calculate
    gradients!)


    update\_W1 = W1 - lr\*T.grad(cost, W1)


    update\_W2 = W2 - lr\*T.grad(cost, W2)


    I create a train function similar to the simple example above:


    train = theano.function(


    inputs=\[thX, thT\],


    updates=\[(W1, update\_W1),(W2, update\_W2)\],


    )


    And I create a prediction function to tell me the cost and prediction of my test
    set so I can later calculate the error rate and classification rate.


    get\_prediction = theano.function(


    inputs=\[thX, thT\],


    outputs=\[cost, prediction\],


    )


    And similar to the last section, I do a for-loop where I just call train() again
    and again until convergence. (Note that the derivative at a minimum will be 0,
    so at that point the weight won’t change anymore). This code uses a method called
    “batch gradient descent”, which iterates over batches of the training set one
    at a time, instead of the entire training set. This is a “stochastic” method,
    meaning that we hope that over a large number of samples that come from the same
    distribution, we will converge to a value that is optimal for all of them.


    for i in xrange(max\_iter):


    for j in xrange(n\_batches):


    Xbatch = Xtrain\[j\*batch\_sz:(j\*batch\_sz + batch\_sz),\]


    Ybatch = Ytrain\_ind\[j\*batch\_sz:(j\*batch\_sz + batch\_sz),\]


    train(Xbatch, Ybatch)


    if j % print\_period == 0:


    cost\_val, prediction\_val = get\_prediction(Xtest, Ytest\_ind)


