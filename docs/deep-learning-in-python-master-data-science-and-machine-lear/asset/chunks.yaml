  raw: 'A more modern adaptive method is AdaGrad. This involves keeping a cache of
    the weight changes so far. Each dimension of each weight has its own cache.


    cache = cache + gradient \* gradient


    Notice that’s element-by-element multiplication as per Numpy convention. Then:


    w -= learning\_rate \* gradient / (sqrt(cache) + epsilon)


    Where epsilon is a small number like 10^-10 to avoid dividing by 0.


    Researchers have found that AdaGrad often drops too aggressively. RMSprop is another
    method similar to AdaGrad, where the cache is “leaky” (i.e. only holds a fraction
    of its previous value).


    In this case:


    cache = decay\_rate \* cache + (1 - decay\_rate) \* grad^2


    And the weight update formula remains the same.


    Regularization


    L1 and L2 regularization have been well-known for a long time and have been applied
    before neural networks came to prominence.


    L1 regularization is simply just the usual cost added to the absolute value of
    the weights times a constant:


    J\_L1 = J + L1\_const \* (|W1| + |b1| + |W2| + |b2| + …)


    Similarly, L2 regularization is just the usual cost added to the square of the
    weights times a constant:


    J\_L2 = J + L2\_const \* (|W1|² + |b1|² + |W2|² + …)


    Note that that’s element-by-element squaring.


    Sometimes, both L1 and L2 regularization can be used in unison.


    What’s the difference between these two? They both penalize your weights from
    going to infinity (which they are bound to do since the pre-sigmoid activation
    wants to go as close to infinity as possible).


    The difference is that the derivative of the square function goes to 0 as you
    approach 0. So L2 regularization encourages the weights to be small. But once
    they are small, the penalty also becomes small, and the gradient of the penalty
    also becomes small, so the influence of L2 regularization decreases here.


    The derivative of the absolute value function is constant on either side of 0.
    Therefore, even when your weights are small, the gradient remains the same, until
    you actually get to 0. There, the gradient is technically undefined, but we treat
    it as 0, so the weight ceases to move. Therefore, L1 regularization encourages
    “sparsity”, where the weights are encouraged to be 0. This is a common technique
    in linear regression, where statisticians are interested in a small number of
    very influential effects.


    Early stopping


    Stopping backpropagation early is another well-known old method of regularization.
    With so many parameters, you are bound to overfit. You may also use a validation
    set to help with early stopping, since an increase of the cost on the validation
    set would mean you are overfitting.


    Noise Injection


    Adding random noise to your inputs during training is yet another method of regularization.
    Usually, we choose a Gaussian-distributed random variable with 0-mean and small
    variance. This simulates having more data and will result in a more robust predictor.


    Data Augmentation


    Suppose the label for your image is “dog”. A dog in the center of your image should
    be classified as dog. As should a dog on the top right, or top left, or bottom
    right, or bottom left. An upside-down dog is still a dog. A dog of slightly different
    color is still a dog.


    By creating your own data and training on both the original data and hand-crafted
    data, you are teaching the neural network to recognize different variants of the
    same thing, resulting in a more robust predictor.


    What I mentioned above was translational invariance, rotational invariance, and
    color invariance. Can you think of other invariances? Would rotational invariance
    work with MNIST?


    Dropout


    Dropout is a new technique that has become very popular in the deep learning community
    due to its effectiveness. It is similar to noise injection, except that now the
    noise is not Gaussian, but a binomial bitmask.


    In other words, at every layer of the neural network, we simply multiply the nodes
    at that layer by a bitmask (array of 0s and 1s, of the same size as the layer).


    We usually set the probability of 1 (call this p) to be 0.5 in the hidden layers
    and 0.8 at the input layer.


    What this does effectively is creates an ensemble of neural networks. Because
    every node can either be “on” or “off”, this technique emulates an ensemble of
    2^N neural networks.


    This method is called “dropout” because setting the value of a node to 0 is the
    same as completely “dropping” it from the network.


    We only set nodes to 0 during the training phase. During the prediction phase,
    we instead just multiply the outgoing weights of a node by that node’s p. Note
    that this is an approximation to actually calculating the output of each ensemble
    and averaging the resulting predictions, but it works well in practice.


    One Problem


    What do all these methods have in common? While they work well, there is still
    one major issue: they add more hyperparameters to your model! Thus, the hyperparameter
    search space becomes even larger.


    Exercise


    Add all of these methods to your Theano code and experiment with different values.
    Compare to vanilla backpropagation.


    Note that TensorFlow includes many of these methods in its optimizers, so incorporating
    them into your training with TensorFlow would be trivial.


    Chapter 8: Unsupervised learning, autoencoders, restricted Boltzmann machines,
    convolutional neural networks, and LSTMs


    Wow! So at this point, you’ve already learned what I consider to be the “basics”
    of deep learning. These are the fundamental skills that will be carried over to
    more complex neural networks, and these topics will be repeated again and again,
    albeit in more complex forms.


    However, I don’t want to leave you in a place where “you don’t know what you don’t
    know”.


    There is lots more to learn about deep learning! Where do you go from here?


    Well, this book focused primarily on “supervised learning”, which I think makes
    a lot more sense to most people. You want to teach a machine how to behave by
    showing it examples of how to do things “correctly”, while “penalizing” it when
    it does something incorrectly.


    But there are other “optimization” functions that neural networks can train on,
    that don’t even need a label at all! This is called “unsupervised learning”, and
    algorithms like k-means clustering, Gaussian mixture models, and principal components
    analysis fall into this family.


    Neural networks have 2 popular ways of doing unsupervised learning: Autoencoders
    and Restricted Boltzmann Machines.


    Surprisingly, when you “pre-train” a neural network using either of these unsupervised
    methods, it helps you achieve a better final accuracy!


    Deep learning has also been successfully applied to reinforcement learning (which
    is rewards-based rather than trained on an error function), and that has been
    shown to be useful for playing video games like Flappy Bird and Super Mario.


    Special neural network architectures have been applied to particular problems
    (whereas we have been talking about data in the abstract sense in this book).


    For image classification, convolutional neural networks have been shown to perform
    well. These use the convolution operator to pre-process the data before feeding
    it into the final logistic layer.


    For sequence classification, LSTMs, or long short-term memory networks have been
    shown to work well. These are a special type of recurrent neural network, which
    up until recently, researchers have been saying are very hard to train.


    What other domains have you thought about applying deep learning to? The stock
    market? Gambling? Self-driving vehicles?


    There is tons of untapped potential out there!


    Exercise


    Send me an email at [info@lazyprogrammer.me](mailto:info@lazyprogrammer.me) and
    let me know which of the above topics you’d be most interested in learning about
    in the future. I always use student feedback to decide what courses and books
    to create next!


    Chapter 9: You know more than you think you know


    The great thing about the digital format is I can update this book as often as
    I need or want.'
