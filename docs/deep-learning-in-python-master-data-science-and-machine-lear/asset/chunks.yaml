  raw: 'Using the logistic unit as a building block, how would you calculate the output
    of a neural network Y? If you can’t get it now, don’t worry, we’ll cover it in
    Chapter 3.


    Chapter 2: Biological analogies


    I described in the previous chapter how an artificial neural network is analogous
    to a brain physically, but what about with respect to learning and other “high
    level” attributes?


    Excitability Threshold


    The output of a logistic unit must be between 0 and 1. In a classifier, we must
    choose which class to predict (say, is this is a picture of a cat or a dog?)


    If 1 = cat and 0 = dog, and the output is 0.7, what do we say? Cat!


    Why? Because our model is saying, “the probability that this is an image of a
    cat is 70%”.


    The 50% line acts as the “excitability threshold” of a neuron, i.e. the threshold
    at which an action potential would be generated.


    Excitatory and Inhibitory Connections


    Neurons have the ability when sending signals to other neurons, to send an “excitatory”
    or “inhibitory” signal. As you might have guessed, excitatory connections produce
    action potentials, while inhibitory connections inhibit action potentials.


    These are like the weights of a logistic regression unit. A very positive weight
    would be a very excitatory connection. A very negative weight would be a very
    inhibitory connection.


    Repetition and Familiarity


    “Practice makes perfect” people often say. When you practice something over and
    over again, you become better at it.


    Neural networks are the same way. If you train a neural network on the same or
    similar examples again and again, it gets better at classifying those examples.


    Your mind, by practicing a task, is lowering its internal error curve for that
    particular task.


    You will see how this is implemented in code when we talk about backpropagation,
    the training algorithm for a neural network.


    Essentially what we are going to do is do a for-loop a number of times, looking
    at the same samples again and again, doing backpropagation on them each time.


    Exercise


    In preparation for the next chapter, you’ll need to make sure you have the following
    installed on your machine: Python, Numpy, and optionally Pandas.


    Chapter 3: Getting output from a neural network


    Get some data to work with


    Assuming you don’t yet have any data to work with, you’ll need some to do the
    examples in this book. [https://kaggle.com](https://kaggle.com) is a great resource
    for this. I would recommend the MNIST dataset. If you want to do binary classification
    you’ll have to choose another dataset.


    The data you’ll use for any machine learning problem often has the same format.


    We have some inputs X and some labels or targets Y.


    Each sample (pair of x and y) is represented as a vector of real numbers for x
    and a categorical variable (often just 0, 1, 2, …) for y.


    You put all the sample inputs together to form a matrix X. Each input vector is
    a row. So that means each column is a different input feature.


    Thus X is an N x D matrix, where N = number of samples and D = the dimensionality
    of each input. For MNIST, D = 784 = 28 x 28, because the original images, which
    are 28 x 28 matrices, are “flattened” into 1 x 784 vectors.


    If y is not a binary variable (0 or 1), you can turn it into a matrix of indicator
    variables, which will be needed later when we are doing softmax.


    So for the MNIST example you would transform Y into an indicator matrix (a matrix
    of 0s and 1s) where Y\_indicator is an N x K matrix, where again N = number of
    samples and K = number of classes in the output. For MNIST of course K = 10.


    Here is an example of how you could do this in Numpy:


    def y2indicator(y):


    N = len(y)


    ind = np.zeros((N, 10))


    for i in xrange(N):


    ind\[i, y\[i\]\] = 1


    return ind


    In this book, I will assume you already know how to load a CSV into a Numpy array
    or Pandas dataframe and do basic operations like multiplying and adding Numpy
    arrays.


    Architecture of an artificial neural network


    Unlike biological neural networks, where any one neuron can be connected to any
    other neuron, artificial neural networks have a very specific structure. In particular,
    they are composed of layers.


    Each layer feeds into the next layer. There are no “feedback” connections. (Actually
    there can be, and these are called recurrent neural networks, but they are outside
    the scope of this book.)


    You already saw what a neural network looks like in Chapter 1, and how to calculate
    the output of a logistic unit.


    Suppose we have a 1-hidden layer neural network, where x is the input, z is the
    hidden layer, and y is the output layer (as in the diagram from Chapter 1).


    Feedforward action


    Let us complete the formula for y. First, we have to compute z[1] and z[2].


    z1 = s(w11\*x1 + w12\*x2)


    z2 = s(w21\*x1 + w22\*x2)


    s() can be any non-linear function (if it were linear, you’d just be doing logistic
    regression). The most common 3 choices are, 1:


    def sigmoid(x):


    return 1 / (1 + np.exp(-x))


    Which we saw earlier.


    2, the hyperbolic tangent: np.tanh()


    And 3, the rectifier linear unit, or ReLU:


    def relu(x):


    if x < 0:


    return 0


    else:


    return x


    Prove to yourself that this alternative way of writing relu is correct:


    def relu(x):


    return x \* (x > 0)


    This latter form is needed in libraries like Theano which will automatically calculate
    the gradient of the objective function.


    And then y can be computed as:


    y = s’(v1\*z1 + v2\*z2)


    Where s’() can be a sigmoid or softmax, as we discuss in the next sections.


    Note that inside the sigmoid functions we simply have the “dot product” between
    the input and weights. It is more computationally efficient to use vector and
    matrix operations in Numpy instead of for-loops, so we will try to do so where
    possible.


    This is an example of a neural network using ReLU and softmax in vectorized form:


    def forward(X, W, V):


    Z = relu(X.dot(W))


    Y = softmax(Z.dot(V))


    return Y


    Binary classification


    As you can see, the last layer of our simple sigmoid network is just a logistic
    regression layer. We can interpret the output as the probability that Y=1 given
    X.


    Of course, since binary classification can only output a 0 or 1, then the probability
    that Y=0 given X:


    P(Y=0 | X) = 1 - P(Y=1 | X),


    because they must sum to 1.


    Softmax


    What if we want to classify more than 2 things? For example, the famous MNIST
    dataset contains the digits 0-9, so we have 10 output classes.


    In this scenario, we use the softmax function, which is defined as follows:


    softmax(a\[k\]) = exp(a\[k\]) / { exp(a\[1\]) + exp(a\[2\]) + … + exp(a\[k\])
    + … + exp(a\[K\]) }


    Note that the “little k” and the “big K” are different.


    Convince yourself that this always adds up to 1, and thus can also be considered
    a probability.


    Now in code!


    Assuming that you have already loaded your data into Numpy arrays, you can calculate
    the output y as we do in this section.


    Note that there is a little bit of added complexity since the formulas shown above
    only calculate the output for one input sample. When we are doing this in code,
    we typically want to do this calculation for many samples simultaneously.


    def sigmoid(a):


    return 1 / (1 + np.exp(-a))


    def softmax(a):


    expA = np.exp(a)


    return expA / expA.sum(axis=1, keepdims=True)


    X,Y = load\_csv(“yourdata.csv”)


    W = np.random.randn(D, M)


    V = np.random.randn(M, K)


    Z = sigmoid(X.dot(W))


    p\_y\_given\_x = softmax(Z.dot(V))


    Here “M” is the number of hidden units. It is what we call a “hyperparameter”,
    which could be chosen using a method such as cross-validation.


    Of course, the outputs here are not very useful because they are randomly initialized.
    What we would like to do is determine the best W and V so that when we take the
    predictions of P(Y | X), they are very close to the actual labels Y.


    Exercise


    Add the bias term to the above examples.


    Chapter 4: Training a neural network with backpropagation'
