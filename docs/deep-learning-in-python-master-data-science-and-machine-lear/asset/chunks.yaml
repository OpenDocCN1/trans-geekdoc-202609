- fmt: "\nUsing the logistic unit as a building block, how would you calculate the\
    \ output of a neural network `Y`? If you can’t get it now, don’t worry, we’ll\
    \ cover it in Chapter 3.\n\n# Chapter 2: Biological analogies\n\nI described in\
    \ the previous chapter how an artificial neural network is analogous to a brain\
    \ physically, but what about with respect to learning and other “high level” attributes?\n\
    \n### Excitability Threshold\n\nThe output of a logistic unit must be between\
    \ 0 and 1. In a classifier, we must choose which class to predict (say, is this\
    \ is a picture of a cat or a dog?)\n\nIf `1` = cat and `0` = dog, and the output\
    \ is `0.7`, what do we say? Cat!\n\nWhy? Because our model is saying, “the probability\
    \ that this is an image of a cat is 70%”.\n\nThe 50% line acts as the “excitability\
    \ threshold” of a neuron, i.e the threshold at which an action potential would\
    \ be generated.\n\n### Excitatory and Inhibitory Connections\n\nNeurons have the\
    \ ability when sending signals to other neurons, to send an “excitatory” or “inhibitory”\
    \ signal. As you might have guessed, excitatory connections produce action potentials,\
    \ while inhibitory connections inhibit action potentials.\n\nThese are like the\
    \ weights of a logistic regression unit. A very positive weight would be a very\
    \ excitatory connection. A very negative weight would be a very inhibitory connection.\n\
    \n### Repetition and Familiarity\n\n“Practice makes perfect” people often say.\
    \ When you practice something over and over again, you become better at it.\n\n\
    Neural networks are the same way. If you train a neural network on the same or\
    \ similar examples again and again, it gets better at classifying those examples.\n\
    \nYour mind, by practicing a task, is lowering its internal error curve for that\
    \ particular task.\n\nYou will see how this is implemented in code when we talk\
    \ about backpropagation, the training algorithm for a neural network.\n\nEssentially\
    \ what we are going to do is do a `for-loop a number of times, looking at the\
    \ same samples again and again, doing backpropagation on them each time.\n\n###\
    \ Exercise\n\nIn preparation for the next chapter, you’ll need to make sure you\
    \ have the following installed on your machine: `Python`, `Numpy`, and optionally\
    \ `Pandas`.\n\n# Chapter 3: Getting output from a neural network\n\n### Get some\
    \ data to work with\n\nAssuming you don’t yet have any data to work with, you’ll\
    \ need some to do the examples in this book. `https://kaggle.com` is a great resource\
    \ for this. I would recommend the MNIST dataset. If you want to do binary classification\
    \ you’ll have to choose another dataset.\n\nThe data you’ll use for any machine\
    \ learning problem often has the same format.\n\nWe have some inputs `X` and some\
    \ labels or targets `Y`.\n\nEach sample (pair of `x` and `y`) is represented as\
