    \ = tf.Variable(W1_init.astype(np.float32))\nW2 = tf.Variable(W2_init.astype(np.float32))\n\
    ```\n\nLet me repeat, since it’s kind of confusing - a Theano variable != TensorFlow\
    \ variable.\n\nWe can specify “None” in our shapes because we want to be able\
    \ to pass in variable lengths - i.e. batch size, test set size, etc.\n\nNow let’s\
    \ calculate the output (notice I’m using ReLU as my hidden layer nonlinearity,\
    \ which is a little different from sigmoid and softmax):\n\n```python\nZ = tf.nn.relu(\
