    # Python 深度学习


    使用 Python、Theano 和 TensorFlow 编写现代神经网络，掌握数据科学与机器学习


    作者：The LazyProgrammer ([`lazyprogrammer.me`](http://lazyprogrammer.me))


    - 引言

    - 第 1 章：什么是神经网络？

    - 第 2 章：生物学类比

    - 第 3 章：从神经网络获取输出

    - 第 4 章：使用反向传播训练神经网络

    - 第 5 章：Theano

    - 第 6 章：TensorFlow

    - 第 7 章：用现代技术改进反向传播 - 动量、自适应学习率和正则化

    - 第 8 章：无监督学习、自动编码器、受限玻尔兹曼机、卷积神经网络和 LSTM

    - 第 9 章：你懂的比你想象的得多

    - 结


    ## 引言


    深度学习正在掀起波澜。在本书写作期间（2016 年 3 月），谷歌的 AlphaGo 程序刚刚在围棋这一中国棋类中击败了九段职业棋手李世石。


    人工智能领域的专家曾认为我们距离击败顶级职业棋手还有 10 年时间，但进展似乎已经加速了！


    虽然深度学习是一个复杂的主题，但它的学习难度并不比任何其他机器学习算法大。我写这本书是为了向你介绍神经网络的基础知识。你只需要本科水平的数学和编程技能就能很好地应对。


    书中的所有材料都可以免费下载和安装。我们将使用 Python 编程语言以及数值计算库 `Numpy`。我还将在随后的章节中向你展示如何使用 `Theano`
    和 `TensorFlow` 构建深度网络，这些是专门为深度学习构建的库，可以利用 GPU 加速计算。


    与其他机器学习算法不同，深度学习特别强大，因为它能自动学习特征。这意味着你不需要花费时间尝试构思并测试“内核”（kernels）或“交互作用”（interaction
    effects）——这是只有统计学家才喜欢做的。相反，我们将让神经网络为我们学习这些内容。神经网络的每一层学习的都是与前几层不同的抽象表示。例如，在图像分类中，第一层可能会学习不同的笔画，在下一层将笔画组合起来学习形状，在再下一层将形状组合形成面部特征，在下一层形成脸部的高级表示。


    你想对这门“黑艺术”有一个温和的介绍吗？并配有你可以立即尝试并应用到自己数据的实用代码示例？那么这本书就适合你。


    ## 第 1 章：什么是神经网络？


    神经网络之所以被称为这个名字，是因为在历史上的某个时刻，计算机科学家正试图用计算机代码来模拟大脑。


    最终目标是创建一个“通用人工智能”，对我来说，这意味着一个可以学习任何你或我能学习的内容的程序。我们还没有达到那一步，所以不需要担心机器接管人类。目前神经网络非常擅长单一任务，如图像分类和语音识别。


    与大脑不同，这些人工神经网络具有预定义的结构。


    大脑是由神经元通过电信号和化学信号相互通信组成的（因此被称为神经网络）。在人工神经网络中，我们不区分这两种信号，从现在起我们只说信号是通过“动作电位”从一个神经元传递到另一个神经元。


    最终目标是创建一个“通用人工智能”。目前神经网络非常擅长单一任务，如图像分类和语音识别。


    （注：原文后续存在大量重复的信号传递描述，已根据指令要求仅翻译核心内容。）


    这是“动作电位”的原理。


