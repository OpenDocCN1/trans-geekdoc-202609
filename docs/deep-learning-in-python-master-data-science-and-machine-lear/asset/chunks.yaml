    \ it’s included in how we compute the cost function (that’s just how TensorFlow\
    \ functions work). You don’t want to softmax this variable because you’d effectively\
    \ end up softmax-ing twice. We calculate the cost as follows:\n\n```python\ncost\
    \ = tf.reduce_sum(\n    tf.nn.softmax_cross_entropy_with_logits(\n        Yish,\n\
    \        T\n    )\n)\n```\n\nWhile these functions probably all seem unfamiliar\
    \ and foreign, with enough consultation of the TensorFlow documentation, you will\
    \ acclimate yourself to them.\n\nLike our Theano example, we want to create train\
    \ and predict functions also:\n\n```python\ntrain_op = tf.train.RMSPropOptimizer(\n\
    \    learning_rate,\n    decay=0.99,\n    momentum=0.9).minimize(cost)\npredict_op\
    \ = tf.argmax(Yish, 1)\n```\n\nNotice how, unlike Theano, I did not even have\
    \ to specify a weight update expression! One could argue that it is sort of redundant\
    \ since you are pretty much always going to use `w += learning_rate*gradient`.\
    \ However, if you want different techniques like adaptive learning rates and momentum\
    \ you are at the mercy of Google. Luckily, their engineers have already included\
    \ `RMSProp` (for an adaptive learning rate) and momentum, which I have used above.\
    \ To learn about their other optimization functions, consult their documentation.\n\
    \nIn TensorFlow, you need to call a special function to initialize all the variable\
    \ objects. You do that like this:\n\n```python\ninit = tf.initialize_all_variables()\n\
    ```\n\nAnd then finally, you run your train and predict functions in a loop, inside\
    \ a session:\n\n```python\nwith tf.Session() as session:\n    session.run(init)\n\
    \    for i in xrange(max_iter):\n        for j in xrange(n_batches):\n       \
    \     Xbatch = Xtrain[j*batch_sz:(j+1)*batch_sz]\n            # ... logic for\
    \ training ...\n            if i % period == 0:\n                print \"i = %d,\
    \ cost = %.3f, u = %.3f\" % (i, cost.eval(), u.eval())\n```\n\n# Chapter 7: Improving\
    \ backpropagation with modern techniques - momentum, adaptive learning rate, and\
    \ regularization\n\nAll of the techniques I describe here are simple to explain.\
    \ However, this simplicity hides their usefulness and can be a bit misleading.\
    \ Why do I say this? Every single one of these techniques, I could explain to\
    \ you in a few minutes. But the simple act of telling you an equation is not what\
    \ is going to make you good. Remember that what we are doing here is computer\
    \ science - programming. If I elaborate on the idea, it will still not make you\
    \ good. If you watch me derive the equations on YouTube, it will still not make\
    \ you good. If you watch me put them into my code, it will still not make you\
    \ good. If you watch me run the code, it will still not make you good. So how\
    \ do you get good? Well, this is the field of programming. So you have to program.\
    \ Take the equation, put it into your code, and watch it run. Compare its performance\
    \ to plain backpropagation. Take your time, observe and experiment. This is what\
    \ will enhance your intuition and understanding.\n\n## Momentum\n\nMomentum in\
    \ gradient descent works like momentum in physics. If you were moving in a certain\
    \ direction already, you will continue to move in that direction, carried forward\
    \ by your momentum. Momentum is defined as:\n\n`v(t) = dw(t - 1)`\n\nThe next\
    \ weight change is a function of both the gradient with respect to the weights\
    \ and the momentum.\n\n`w(t) = w(t-1) + mu*v(t) - learning_rate*dJ(t)/dw`\n\n\
    Where `mu` is called the momentum parameter (usually set to around 0.99).\n\n\
    You can simplify this as follows:\n\n`dw(t) = mu*dw(t-1) - learning_rate*dJ(t)/dw`\n\
    \nAnd then:\n\n`w(t) += dw(t)`\n\n## Adaptive learning rate\n\nThere are many\
    \ types of adaptive learning rate, but they all have one theme in common - decreasing\
    \ over time. For example, you could just halve your learning rate every 10 epochs.\n\
    \n```python\nif epoch % 10 == 0:\n    learning_rate /= 2\n```\n\nAnother method\
    \ is inverse decay:\n\n`learning_rate = A/(1 + kt)`\n\nAnother method is exponential\
    \ decay:\n\n`learning_rate = A * exp(-kt)`\n"
