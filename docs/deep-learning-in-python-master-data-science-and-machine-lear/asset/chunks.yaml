  trans: "\n我们无法通过闭式解来“解出 W 和 V”。回想微积分，这种操作的典型方法是求导数并将其设为 0。相反，我们必须使用一种称为“梯度下降”的方法来“优化”我们的目标函数。\n\
    \n### 我们将使用的目标函数是什么？\n\n`J = -sum_from_n=1..N ( sum_from_k=1..K ( T[n,k] * logY[n,k]\
    \ ) )`\n\n你会发现这仅仅是负对数似然。（想想你如何根据一组骰子掷出的数据集计算骰子各个面出现的似然，你应该得到一个形式相似的结果）。\n\n而且，如果你像我提到的那样，将你的标签/目标变量（现在称为\
    \ `T`）转换为指示器矩阵，那么它现在应该是……嗯，一个矩阵，因此像上面一样具有两个索引，`n` 和 `k`。\n\n在 Numpy 中，可以按如下方式计算：\n\
    \n```python\ndef cost(T, Y):\n    return -(T*np.log(Y)).sum()\n```\n\n现在我们已经有了目标函数，如何优化它呢？我们使用一种称为“梯度下降”的方法，我们沿着\
    \ `J` 相对于 `W` 和 `V` 的梯度“移动”，直到遇到最小值。\n\n在图中，梯度下降看起来是这样的。\n\n![pasted-image.jpg](img/00005.jpeg)\n\
    \n请相信，通过沿着梯度的方向移动，我们最终将得到比起始位置更“低”的 `J`。\n\n通常情况下，知道如何计算梯度是没有必要的，除非你想自己用 Numpy\
    \ 编写神经网络代码，这会在我的课程 [https://udemy.com/data-science-deep-learning-in-python] 中介绍。在本书中，由于我们专注于\
    \ Theano 和 TensorFlow，我们不会这样做。\n\n一旦找到梯度，你就想沿着那个方向迈出小步。\n\n你可以想象，如果步长太大，你就会落在峡谷的“另一边”，来回跳！\n\
    \n因此，我们这样更新权重：\n\n`weight = weight - learning_rate * gradient_of_J_wrt_weight`\n\
    \n用更具“数学味”的形式：\n\n`w = w - learning_rate * dJ/dw`\n\n其中学习率是一个非常小的数字，例如 `0.00001`。（注意：如果数字太小，梯度下降将花费很长时间。我在\
    \ Udemy 课程中向你展示如何优化这个值）。\n\n就这些！\n\n如果你想相信这种方法有效，我建议尝试优化一个你已经知道如何求解的函数，例如二次函数。\n\
    \n例如，你的目标是 `J = x**2 + x`，`J` 的梯度是 `2x + 1`，因此可以在 `-1/2` 处找到最小值。\n\n这个更新公式在涉及神经网络时有一个小问题——那就是，与具有全局最小值的逻辑回归不同——在神经网络你很容易陷入局部陷阱。\n\
    \n所以，你可能会看到误差曲线下降并最终变得平坦，但它试图达到的最终误差并不是最好的。一些更高级的方法（如动量）可以缓解这个问题。\n\n### 为什么它被称为“反向传播”？\n\
    \n考虑一个神经网络：\n\n`o--W--V--o`\n`x z y`\n\n在这里我用代表这些向量的单个节点替换了 `x` 和 `y` 的通常“多节点”表示。在考虑更深层的网络时，这变得更加方便。\n\
    \n如果你精通多变量微积分并想尝试自己推导 `J` 的梯度，你将注意到一些模式。首先，`y` 处的误差总是 `t`。一旦你找到梯度，你就想沿着那个方向迈出小步。\n\
    \n你可以想象，如果步长太大，你就会落在峡谷的“另一边”，来回跳！\n"
- fmt: "\nSo let’s first talk about Theano variables. Theano has different types of\
    \ variable objects based on the number of dimensions of the object. For example,\
    \ a 0-dimensional object is a scalar, a 1-dimensional object is a vector, a 2-dimensional\
    \ object is a matrix, and a 3+ dimensional object is a tensor.\n\nThey are all\
    \ within the `theano.tensor` module. So in your import section:\n\n```python\n\
    import theano.tensor as T\n```\n\nYou can create a scalar variable like this:\n\
    \n```python\nc = T.scalar('c')\n```\n\nThe string that is passed in is the variable’s\
    \ name, which may be useful for debugging.\n\nA vector could be created like this:\n\
    \n```python\nv = T.vector('v')\n```\n\nAnd a matrix like this:\n\n```python\n\
    A = T.matrix('A')\n```\n\nSince we generally haven’t worked with tensors in this\
    \ book, we are not going to look at those. When you start working with color images,\
    \ this will add another dimension, so you’ll need tensors. (Ex. a 28x28 image\
    \ would have the dimensions 3x28x28 since we need to have separate matrices for\
    \ the red, green, and blue channels).\n\nWhat is strange about regular Python\
    \ vs. Theano is that none of the variables we just created have values!\n\nTheano\
    \ variables are more like nodes in a graph.\n\n(Come to think of it, isn’t the\
    \ neural network I described in Chapter 1 simply a graphical model?)\n\nWe only\
    \ “pass in” values to the graph when we want to perform computations like feedforward\
    \ or backpropagation, which we haven’t defined yet. TensorFlow works in the same\
    \ way.\n\nDespite that, we can still define operations on the variables.\n\nFor\
    \ example, if you wanted to do matrix multiplication, it is similar to Numpy:\n\
    \n```python\nu = A.dot(v)\n```\n\nYou can think of this as creating a new node\
    \ in the graph called `u`, which is connected to `A` and `v` by a matrix multiply.\n\
    \nTo actually do the multiply with real values, we need to create a Theano function.\n\
    \n```python\nimport theano\nmatrix_times_vector = theano.function(inputs=[A,v],\
    \ outputs=[u])\n\nimport numpy as np\nA_val = np.array([[1,2], [3,4]])\nv_val\
    \ = np.array([5,6])\nu_val = matrix_times_vector(A_val, v_val)\n```\n\nUsing this,\
    \ try to think about how you would implement the “feedforward” action of a neural\
    \ network.\n\nOne of the biggest advantages of Theano is that it links all these\
    \ variables up into a graph and can use that structure to calculate gradients\
    \ for you using the chain rule, which we discussed in the previous chapter.\n\n\
    In Theano regular variables are not “updateable”, and to make an updateable variable\
    \ we create what is called a shared variable.\n\nSo let’s do that now:\n\n```python\n\
    x = theano.shared(20.0, 'x')\n```\n\nLet’s also create a simple cost function\
    \ that we can solve ourselves and we know it has a global minimum:\n\n```python\n\
    cost = x*x + x\n```\n\nAnd let’s tell Theano how we want to update `x` by giving\
    \ it an update expression:\n\n```python\nx_update = x - 0.3*T.grad(cost, x)\n\
    ```\n\nThe `grad` function takes in 2 parameters: the function you want to take\
    \ gradient of, and the variable you want the gradient respect to. You can pass\
    \ in multiple variables as a list into 2nd parameter, as we’ll be doing later\
    \ for each of the weights of neural network.\n\nNow let’s create a Theano train\
    \ function. We’re going to add a new argument called `updates`. It takes in a\
    \ list of tuples, and each tuple has 2 things in it. The first thing is the shared\
    \ variable to update, and 2nd thing is the update expression to use.\n\n```python\n\
    train = theano.function(inputs=[], outputs=cost, updates=[(x, x_update)])\n```\n\
    \nNotice that ‘x’ is not an input, it’s the thing we update. In later examples,\
    \ the `inputs` will be the data and labels. So the `inputs` param takes in data\
    \ and labels, and the `updates` param takes in model parameters with their updates.\n\
    \nNow we simply write a loop to call `train` function again and again:\n\n```python\n\
    for i in xrange(25):\n    cost_val = train()\nprint cost_val\n```\n\nAnd print\
    \ the optimal value of `x`:\n\n```python\nprint x.get_value()\n```\n\nNow let’s\
    \ take all these basic concepts and build a neural network in Theano.\n\n### Neural\
    \ network in Theano\n\nFirst, I’m going to define my inputs, outputs, and weights\
    \ (the weights will be shared variables):\n\n```python\nthX = T.matrix('X')\n\
    thT = T.matrix('T')\nW1 = theano.shared(np.random.randn(D, M), 'W1')\nW2 = theano.shared(np.random.randn(M,\
    \ K), 'W2')\n```\n\nNotice I’ve added a “th” prefix to the variables because I’m\
    \ going to call my actual data, which are Numpy arrays, `X` and `T`. Recall that\
    \ `M` is the number of units in the hidden layer.\n\nNext I define the feedforward\
    \ action:\n\n```python\nthZ = T.tanh(thX.dot(W1))\nthY = T.nnet.softmax(thZ.dot(W2))\n\
    ```\n\n`T.tanh` is a non-linear function similar to the sigmoid, but it ranges\
    \ between -1 and +1.\n\nNext I define my cost function and my prediction function\
    \ (this is used to calculate the classification error).\n\n```python\ncost = -(thT\
    \ * T.log(thY)).sum()\nprediction = T.argmax(thY, axis=1)\n```\n\nAnd I define\
    \ my update expressions (notice how Theano has a function to calculate gradients!).\n\
    \n```python\nupdate_W1 = W1 - lr*T.grad(cost, W1)\nupdate_W2 = W2 - lr*T.grad(cost,\
    \ W2)\n```\n\nI create a `train` function similar to the example above:\n\n```python\n\
    train = theano.function(\n    inputs=[thX, thT],\n    updates=[(W1, update_W1),\
    \ (W2, update_W2)]\n)\n```\n\nAnd I create a prediction function to tell me the\
    \ cost and prediction of my test set so I can later calculate the error rate and\
    \ classification rate.\n\n```python\nget_prediction = theano.function(\n    inputs=[thX,\
    \ thT],\n    outputs=[cost, prediction]\n)\n```\n\nAnd similar to the last section,\
    \ I do a for-loop where I just call `train()` again and again until convergence\
    \ (Note that the derivative at a minimum will be 0, so at that point the weight\
    \ won’t change anymore). This code uses a method called “batch gradient descent”,\
    \ which iterates over batches of the training set one at a time, instead of the\
    \ entire training set. This is a “stochastic” method, meaning that we hope over\
    \ a large number of samples that come from the same distribution, we will converge\
    \ to a value that is optimal for all of them.\n\n```python\nfor i in xrange(max_iter):\n\
    \    for j in xrange(n_batches):\n        Xbatch = Xtrain[j*batch_sz:j*batch_sz\
    \ + batch_sz]\n        Ybatch = Ytrain_ind[j*batch_sz:j*batch_sz + batch_sz]\n\
    \        train(Xbatch, Ybatch)\n        if j % print_period == 0:\n          \
    \  cost_val, prediction_val = get_prediction(Xtest, Ytest_ind)\n```\n\n### Exercise\n\
    \nComplete the code above by adding the following:\n1. A function to convert the\
    \ labels into an indicator matrix (if you haven’t done so yet) (Note that the\
    \ examples above refer to the variables `Ytrain_ind` and `Ytest_ind` – that’s\
    \ what these are).\n2. Add bias terms at the hidden and output layers and add\
    \ the update expressions for them as well.\n3. Split your data into training and\
    \ test sets to conform the code above.\n4. Try it on a dataset like MNIST.\n\n\
    # Chapter 6: TensorFlow\n\nIf you would like to view this code in a Python file\
    \ on your computer, please go to:\n`https://github.com/lazyprogrammer/machine_learning_examples/tree/master/ann_class2`\n\
    \nThe relevant files are:\n- `tensorflow1.py`\n- `tensorflow2.py`\n\n## TensorFlow\
    \ Basics\n\nTensorFlow is a newer library than Theano developed by Google. It\
    \ does a lot of nice things for us like Theano does, like calculating gradients.\
    \ In this first section we are going to cover basic functionality as we did with\
    \ Theano - variables, functions, and expressions.\n\nTensorFlow’s web site will\
    \ have a command you can use to install the library. I won’t include it here because\
    \ the version number is likely to change.\n\nIf you are on a Mac, you may need\
    \ to disable “System Integrity Protection” (rootless) temporarily by booting into\
    \ recovery mode, typing in `csrutil disable`, and then rebooting. You can check\
    \ if it is disabled or enabled by typing `csrutil status` in your console.\n\n\
    Once you have TensorFlow installed, come back to the book and we’ll do a simple\
    \ matrix multiplication example like we did with Theano.\n\nImport as usual:\n\
    \n```python\nimport tensorflow as tf\n```\n\nWith TensorFlow we have to specify\
    \ the type (Theano variable = TensorFlow placeholder):\n"
