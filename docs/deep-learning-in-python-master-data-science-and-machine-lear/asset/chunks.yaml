    If you think a topic that is not currently included in this book should’ve been
    included in this book, please just let me know.


    Keep in mind that this book was created to teach you the fundamentals, not the
    latest and greatest research. To be frank, understanding that kind of stuff is
    going to take you months or perhaps years of effort. And without the fundamentals,
    it’s not going to make much sense anyway.


    Now you might have read this book and thought to yourself, “wait a minute - all
    you taught me was how to stack logistic regressions together and then do gradient
    descent, which is an algorithm that I already know from doing logistic regression?”


    That’s the real beauty of this. My job as a teacher is to make things seem easy
    for you as a student.


    If everything seems too simple, then I’ve done my job.


    As a sidenote, I think it’s a person’s ego that makes them feel like they need
    to learn something hard. Don’t let your ego get in the way of your learning!


    Now, whereas the last chapter was based on showing you what you don’t know, this
    chapter is devoted to showing you what you DO know, and you probably know more
    than you think after reading this book.


    ## Logistic Regression


    First, let’s go back to logistic regression. Remember that all supervised machine
    learning models have the same API.


    `train(X, Y)` and `predict(X)`


    For logistic regression this is simple. Prediction is:


    `y = s(Wx)`


    Training is similarly simple. We just take the derivative of the cost and move
    in that direction:


    `W = W - a*dJ/dW`


    Now let’s look at neural networks.


    Prediction is almost the same, with just one additional step:


    `y = s(W[1]s(W[2]x))`


    How do we train? Same thing as before. Take the derivative, move in that direction:


    `W[i] = W[i] - a*dJ/dW[i]`


    Remember that neural networks can be arbitrarily deep, so we can have `W1`, `W2`,
    `W3`, and so on.


    What about convolutional neural networks? Prediction is again, simply just the
    addition of one new step:


    `y = s(W1s(W2 * x)`


    The `*` operator means convolution, which you learn about in courses like signal
    processing and linear systems.


    I go through the basics of convolution and how it can be used to do things like
    add filters like the delay filter on sound, or edge detection and blurring on
    images, in my course [Deep Learning: Convolutional Neural Networks in Python](https://www.udemy.com/deep-learning-convolutional-neural-networks-theano-tensorflow).


    How do we train a CNN? Same as before, actually. Just take the derivative, and
    move in that direction.


    `W[i] = W[i] - a*dJ/dW[i]`


    Hopefully you’re seeing a pattern here.


    What about recurrent neural networks?


    Just like how we introduced one new thing with convolutional nets, we’ll introduce
    one new thing here - time.


    In particular, we’ll split up the 2 calculations, so that the first calculation
    (the state of the hidden unit), can depend on its last value.


    Prediction becomes:


    `h(t) = s(W[x]x(t) + W[h]h(t-1))`


    `y(t) = s(W[o]h(t))`


    If you guessed that the way we train these is by taking the derivative of the
    cost, and moving in that direction, you would be correct! Good job!


    `W[i] = W[i] - a*dJ/dW[i]`


    So what is the moral of this story? Knowing and understanding the method in this
    book - gradient descent a.k.a. backpropagation is absolutely essential to understanding
    deep learning.


    Unfortunately, the Kindle format only allows me to do so much in the way of presenting
    formulae, however, I do go through how to take the derivatives in my online video
    courses.


    There are instances where you don’t want to take the derivative anyway. The difficulty
    of taking derivatives in more complex networks is what held many researchers back
    in the field.


    Now, with tools like Theano and TensorFlow, which can do automatic differentiation,
    we have one less thing to worry about.


    Now we can design deep networks to our heart’s content, because we know that the
    update will remain:


    `W = W - learning_rate * T.grad(cost, W)`


    In fact, the only reason a handful of neural network architectures have “bubbled
    up” to the top is because they have performed well.


    But good performance on benchmark datasets is not what makes you a competent deep
    learning researcher. Many papers get published where researchers are simply attempting
    some novel idea. They may not have superior performance compared to the state
    of the art, but they may perform on-par, which is still interesting.


    All research, whether it led to success or failure, got us to where we are today.


    Don’t forget that people gave up on neural networks for decades.


    This is more about creativity and thinking big.


    ## Conclusion


    I really hope you had as much fun reading this book as I did making it.


