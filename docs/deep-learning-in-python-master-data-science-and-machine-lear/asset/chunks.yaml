    [https://udemy.com/data-science-deep-learning-python](https://udemy.com/data-science-deep-learning-python)


    Are you comfortable with this material, and you want to take your deep learning
    skillset to the next level? Then my follow-up course on deep learning is for you.
    Similar to this book, I take you through the basics of Theano and TensorFlow -
    creating functions, variables, and build up neural networks from scratch. I teach
    you about ways to accelerate the learning process, including batch gradient descent,
    momentum, and adaptive learning rates. I also show you live how to create a GPU
    instance on Amazon EC2, and prove to you that training a neural network with GPU
    can be orders of magnitude faster than on your CPU.


