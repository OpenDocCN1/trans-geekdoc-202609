    \ 感谢 Doctrine 2！在给我们的演示应用添加更多功能之前，我们现在将了解 Doctrine 2 的一些基本概念。\n\n### 4.4 核心概念概览\n\
    \n在深入了解 Doctrine 2 的细节之前，让我们退一步，看看它的核心概念。\n\n我们已经定义了实体：实体是由 Doctrine 2 管理并在数据库中持久化的具有标识的对象。实体是应用程序的领域对象。保存实体并从数据库中检索它们对应用程序至关重要。在本书中，“实体”一词有两种不同的含义：一方面，它用于单个持久化对象；另一方面，它用于作为持久化对象模板的\
    \ PHP 类。使用 Doctrine 2 的持久化对象（即实体）始终处于特定状态。该状态可以是“NEW”、“MANAGED”、“DETACHED”或“REMOVED”。我们将在本书后面了解这些内容。\n\
    \n实体管理器是 Doctrine 的核心对象。作为应用程序开发人员，您会频繁地与实体管理器交互。实体管理器负责持久化新实体，同时也负责更新和删除实体。仓库是通过实体管理器获取的。\n\
    \n简单来说，仓库是特定类型的所有实体的容器。它允许通过所谓的 `查找方法` 或 `查找器` 来查找实体。某些查找器默认可用，如果需要，也可以手动添加其他查找器。\n\
    \n`Doctrine 的数据库访问层 (DBAL)` 是 Doctrine 2 ORM 库的基础。它是一个独立组件，即使不使用 Doctrine 的 ORM\
    \ 功能也可以使用。从技术上讲，DBAL 是 PHP PDO 扩展的封装，与单独使用 PDO 相比，它使处理数据库更加容易。不过，同样，Doctrine 2\
    \ ORM 使处理数据库比单独使用 DBAL 更加容易。\n\n## 5 定义实体\n\n我们已经了解将成员变量映射到数据库表中的字段是多么容易。让我们来看看这究竟是如何工作的。\n\
    \n### 5.1 映射格式\n\n一般来说，映射可以使用实体内部的注解定义，也可以使用外部 XML 或 YAML 文件定义。在使用缓存时，不同映射实现方式之间的性能没有差异。因此，通常更倾向于使用注解，仅仅是因为它使编码更加容易——所有持久化元数据都位于同一文件中。在以下示例中，将专用注解。\n\
    \n### 5.2 将对象映射到表\n\n首先，作为持久化对象模板的类需要获取 `Entity` 注解：\n\n```php\n<?php\n/**\n *\
    \ @Entity\n */\nclass User\n{\n\t// [..]\n}\n```\n\n"
