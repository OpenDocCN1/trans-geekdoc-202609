    \ * @Entity\n * @Table(name=\"posts\")\n */\nclass Post\n{\n\n    // [..]\n\n\
    \    /**\n     * @ManyToOne(targetEntity=\"Entity\\Category\")\n     * @JoinColumn(name=\"\
    category_id\", referencedColumnName=\"id\")\n     **/\n    private $category;\n\
    \n    // [..]\n\n    public function setCategory($category)\n    {\n        $this->category\
    \ = $category;\n    }\n\n    public function getCategory()\n    {\n        return\
    \ $this->category;\n    }\n}\n```\n\n就这样——不需要更多配置，因为这是一个单向关联。`Category` 也不需要扩展。事实上，即使\
    \ `@JoinColumn` 注解也是多余的，因为它的配置与 Doctrine 的默认值相同。\n\n### 6.8 一对一关系，自引用\n\nDoctrine\
    \ 2 允许定义同一类型实体之间的关联，即所谓的“自引用”关系。在我们的演示应用中，一个 `User` 可以声明另一个 `User` 为其伴侣。关联的两端都允许访问被引用的伴侣。自引用关联所需的持久化配置如下所示：\n\
    \n```\n<?php\nnamespace Entity;\n\n/**\n * @Entity\n * @Table(name=\"users\")\n\
    \ */\nclass User\n{\n    /**\n     * @OneToOne(targetEntity=\"Entity\\User\")\n\
    \     **/\n    private $lifePartner;\n\n    // [..]\n\n    public function setLifePartner($lifePartner)\n\
    \    {\n        $this->lifePartner = $lifePartner;\n    }\n\n    public function\
    \ getLifePartner()\n    {\n        return $this->lifePartner;\n    }\n}\n```\n\
    \n如果数据库结构由架构工具创建，Doctrine 2 会自动在 `users` 表中添加一个名为 `lifeParter_id` 的列来维护引用。同样，Doctrine\
    \ 的默认值在此处生效。如果需要，可以添加 `@JoinColumn` 注解并覆盖默认值：\n\n```\n<?php\n// [..]\n\n/**\t\n\
