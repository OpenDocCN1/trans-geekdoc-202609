- raw: "Expressions are used in the SELECT, WHERE, HAVING or GROUP part of a query.\
    \ However, the query shown above can also be created without using the `Expr`\
    \ class:\n\n```\n 1 <?php\n 2 $qb = $this->_em->createQueryBuilder();\n 3 \n 4\
    \ $qb->select('u')\n 5 \t->addSelect(\"CONCAT(u.firstName, u.lastName)\")\n 6\
    \ \t->from('Entity\\User', 'u')\n 7 \t->where('u.lastName = ?1')\n 8 \t->setParameter(1,\
    \ \"Mustermann\");\n 9 \n10 $users = $qb->getQuery()->getResult();\n```\n\nThis\
    \ might be necessary sometimes, since not every function or arithmetic operator\
    \ can be constructed via the `Expr` class. The following aggregate functions are\
    \ allowed in SELECT and GROUP BY clauses:\n\n*   AVG\n\n*   COUNT\n\n*   MIN\n\
    \n*   MAX\n\n*   SUM\n\nThe following functions are supported in SELECT, WHERE\
    \ and HAVING clauses:\n\n*   IDENTITY\n\n*   ABS(arithmetic\\_expression)\n\n\
    *   CONCAT(str1, str2)\n\n*   CURRENT\\_DATE()\n\n*   CURRENT\\_TIME()\n\n*  \
    \ CURRENT\\_TIMESTAMP()\n\n*   LENGTH(str)\n\n*   LOCATE(needle, haystack \\[,\
    \ offset\\])\n\n*   LOWER(str)\n\n*   MOD(a, b)\n\n*   SIZE(collection)\n\n* \
    \  SQRT(q)\n\n*   SUBSTRING(str, start \\[, length\\])\n\n*   TRIM(\\[LEADING\
    \ | TRAILING | BOTH\\] \\[“trchar” FROM\\] str)\n\n*   UPPER(str)\n\n*   DATE\\\
    _ADD(date, days, unit)\n\n*   DATE\\_SUB(date, days, unit)\n\n*   DATE\\_DIFF(date1,\
    \ date2)\n\nVia `setParameter()` or `setParameters($array)` values can be given\
    \ for placeholders within queries. In the example shown above, number placeholders\
    \ are used (starting with a “?” symbol). Alternatively, a string placeholder may\
    \ be used (starting with a “:” symbol):\n\n```\n 1 <?php\n 2 // [..]\n 3 $qb =\
    \ $this->_em->createQueryBuilder();\n 4 \n 5 $qb->select('u')\n 6 \t->addSelect($qb->expr()->concat('u.firstName',\
    \ 'u.lastName'))\n 7 \t->from('Entity\\User', 'u')\n 8 \t->where($qb->expr()->eq('u.lastName',\
    \ ':lastName'))\n 9 \t->setParameter(\"lastName\", \"Mustermann\");\n10 \n11 $users\
    \ = $qb->getQuery()->getResult();\n```\n\nWhatever way is preferred, one needs\
    \ to stick to it within a query. Mixing is not allowed.\n\n### 8.4 Constructing\
    \ join queries\n\nDoctrine 2 supports two different types of joins. While regular\
    \ joins are needed, e.g. to limit results via a WHERE clause, so-called *fetch\
    \ joins* are used to fetch related entities for further usage:\n\n```\n 1 <?php\n\
    \ 2 // [..]\n 3 $qb = $this->_em->createQueryBuilder();\n 4 \n 5 $qb->select('u',\
    \ 'c')\n 6 \t->from('Entity\\User', 'u')\n 7 \t->leftJoin('u.contactData', 'c')\n\
    \ 8 \t->where($qb->expr()->eq('u.lastName', '?1'))\n 9 \t->setParameter(1, \"\
    Mustermann\");\n10 \n11 $users = $qb->getQuery()->getResult(); \n```\n\nThe `select('u',\
    \ 'c')` makes the join a fetch join. The referenced `ContactData` object is part\
    \ of the result set. However, when omitting the `'c'` in the `select` clause,\
    \ the `ContactData` object is not part of the result anymore, however, it can\
    \ still be used e.g. within the `where` clause:\n\n```\n 1 <?php\n 2 // [..]\n\
    \ 3    \t \n 4 $qb = $this->_em->createQueryBuilder();\n 5 \n 6 $qb->select('u')\n\
    \ 7 \t->from('Entity\\User', 'u')\n 8 \t->leftJoin('u.contactData', 'c')\n 9 \t\
    ->where($qb->expr()->eq('u.lastName', '?1'))\n10 \t->andWhere($qb->expr()->eq('c.email',\
    \ '?2'))\n11 \t->setParameter(1, \"Mustermann\")\n12 \t->setParameter(2, \"max.mustermann@example.com\"\
    );\n13 \n14 $users = $qb->getQuery()->getResult();\n```\n\n## 9 Command line tools\n\
    \nDoctrine 2 ships with powerful command line support. The command line tools\
    \ can broadly be divided into DBAL-related and ORM-related operations. Via the\
    \ `list` command, a list of all commands available can be printed:\n\n```\n1 $\
    \ ./doctrine list\n```\n\nThe `help` command-or the command parameter `--help`\
    \ in conjunction with other commands-prints the instructions for a command given.\
    \ For example, if we need help dealing with the `orm:info` command, we can ask\
    \ for help like that:\n\n```\n1 $ ./doctrine orm:info --help\n```\n\nAlso will\
    \ work:\n\n```\n1 $ ./doctrine help orm:info\n```\n\nBoth commands print the identical\
    \ output to the console.\n\n### 9.1 Setting up the command line tools\n\nBefore\
    \ Doctrine 2 can be used on the command line, some basic configuration code is\
    \ needed. The command line tools require-like the application itself-a ready-to-go\
    \ database connection and entity manager-if ORM-related commands are needed.\n\
    \nThe configuration of the command line tools first looks somewhat strange-Doctrine\
    \ 2 requires that a file called `cli-config.php` exists within the folder, in\
    \ which the tools are executed on the command line. If Doctrine 2 was installed\
    \ using Composer, the command line tools are located in `vendor/bin`. Therefore,\
    \ this is the place where a file called `cli-config.php` needs to be set up with\
    \ the following basic code:\n\n```\n 1 <?php\n 2 include '../../vendor/autoload.php';\n\
    \ 3 \n 4 use Doctrine\\ORM\\Tools\\Setup;\n 5 use Doctrine\\ORM\\EntityManager;\n\
    \ 6 \n 7 $paths = array(__DIR__ . \"/../../entity/\");\n 8 $isDevMode = true;\n\
    \ 9 \n10 $dbParams = array(\n11 \t'driver'   => 'pdo_mysql',\n12 \t'user'    \
    \ => 'root',\n13 \t'password' => '',\n14 \t'dbname'   => 'app',\n15 );\n16 \n\
    17 $config = Setup::createAnnotationMetadataConfiguration($paths,$isDevMode);\n\
    18 $em = EntityManager::create($dbParams, $config);\n19 \n20 $helperSet = new\
    \ \\Symfony\\Component\\Console\\Helper\\HelperSet(array(\n21 'db' => new \\Doctrine\\\
    DBAL\\Tools\\Console\\Helper\\ConnectionHelper(\n22 \t$em->getConnection()\n23\
    \ ),\n24 'em' => new \\Doctrine\\ORM\\Tools\\Console\\Helper\\EntityManagerHelper(\n\
    25 \t$em\n26 )\n27 )); \n```\n\nThe code shown above is similar to the `index.php`\
    \ file used in the demo app. First, autoloading is configured, then the entity\
    \ manager is instantiated. If both clients-web application and command line tools-share\
    \ the same credentials, externalizing this data may be helpful.\n\nIf now the\
    \ command line tools are invoked, Doctrine 2 automatically includes the `cli-config.php`\
    \ file and also looks for a so-called *helper set* defined in the global namespace.\
    \ The *helper set* provides the command line tools with the database connection\
    \ via key `db` (needed for the DBAL commands) as well as the entity manager via\
    \ key `em` (needed for the ORM commands).\n\n### 9.2 DBAL commands\n\n#### 9.2.1\
    \ Execute an SQL statement\n\nSQL commands can easily be executed via the command\
    \ line with Doctrine’s command line tooling. The command `dbal:run-sql` requires\
    \ a single parameter, a valid SQL statement:\n\n```\n1 $ ./doctrine dbal:run-sql\
    \ \"SELECT * FROM users;\"\n```\n\nThe result of the query is printed to the console.\n\
    \n#### 9.2.2 Import SQL files\n\nIf one needs to execute multiple statements,\
    \ importing a SQL file might be a great option via the `./doctrine dbal:import`\
    \ command. It takes one or more paths to SQL files, delimited by space:\n\n```\n\
    1 $ ./doctrine dbal:import /tmp/import-data.sql\n```\n\n### 9.3 ORM commands\n\
    \n#### 9.3.1 Validate persistence configuration\n\nOne of the most helpful commands\
    \ is `orm:validate-schema`. It validates the current persistence configuration\
    \ and also makes sure it matches the existing data schema in the database. If\
    \ all is good, the following command prints a positive message to the console:\n\
    \n```\n1 $ ./doctrine orm:validate-schema\n2 > [Mapping]  OK - The mapping files\
    \ are correct.\n3 > [Database] OK - The database schema is in sync with the mapping\
    \ files.\n```\n\nThe command `orm:info` prints an overview of the application\
    \ entities known to Doctrine:\n\n```\n1 $ ./doctrine orm:info\n2 > Found 2 mapped\
    \ entities:\n3 > [OK]   Entity\\Post\n4 > [OK]   Entity\\User\n```\n\n#### 9.3.2\
    \ The Schema Tool\n\nWith the help of the commands\n\n*   `orm:schema-tool:create`,\n\
    \n*   `orm:schema-tool:drop` and\n\n*   `orm:schema-tool:update`\n\none can manipulate\
    \ a database data schema based on the entity persistence configuration. However,\
    \ when running these commands, nothing actually happens-it’s just a “dry run”.\
    \ If the commands are executed with parameter `--dump-sql` again only a dry run\
    \ occurs, however, this time, the schema tool prints all SQL statements, which\
    \ would otherwise have been fired against the database, to the screen. Only if\
    \ one uses the parameter `--force`, the schema tool finally executes the statements:\n\
    \n```\n1 $ ./doctrine orm:schema-tool:drop --force\n```"
