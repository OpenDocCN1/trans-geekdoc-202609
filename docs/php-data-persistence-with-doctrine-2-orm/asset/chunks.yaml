    \ `orm:generate-entities` can be identified running the following command:\n\n\
    ```\n1 $ ./doctrine orm:generate-entities --help\n```\n\nWith the help of the\
    \ command `orm:generate-repositories`, also repository classes can be auto-generated.\n\
    \n#### 9.3.4 Execute a DQL command\n\nSimilar to `dbal:run-sql`, also DQL statements\
    \ can easily be executed using the command `orm:run-dql`.\n\n#### 9.3.5 Cache\
    \ related commands\n\nWith the commands\n\n*   `orm:clear-cache:metadata`,\n\n\
    *   `orm:clear-cache:query` and\n\n*   `orm:clear-cache:result`\n\nthe various\
    \ Doctrine caches can be purged. These commands are especially helpful when deploying\
    \ a new application version. They make sure that no outdated configuration or\
    \ data is used in conjunction with a new application version-usually, this would\
    \ lead to unrecoverable errors.\n\n#### 9.3.6 Converting commands\n\nRarely used,\
    \ but very helpful are the commands `orm:convert-d1-schema` and `orm:convert-mapping`.\
    \ The command `orm:convert-d1-schema` is used to transform the old Doctrine 1\
    \ persistence configuration format to the one used by Doctrine 2-very handy when\
    \ upgrading an existing application. The command `orm:convert-mapping` on the\
    \ other hand allows to go from one Doctrine 2 mapping format to another, e.g.\
    \ from XML to YAML.\n\n#### 9.3.7 Production-ready configuration\n\nThe following\
    \ command validates if Doctrine’s configuration is ready for production usage:\n\
    \n```\n1 $ ./doctrine orm:ensure-production-settings\n```\n\nIf this is the case,\
    \ it prints a positive message on the console:\n\n```\n1 > Environment is correctly\
    \ configured for production.\n```\n\nA lot of configuration aspects can cause\
    \ a negative result. This could be missing proxy classes created by running the\
    \ proper command or missing caches. Both is considered by Doctrine 2 to be a must\
    \ for usage in productive systems.\n\n| ![information](images/leanpub_information.png)\
    \ || \n\n#### Custom commands\n\nDoctrine 2 allows to develop custom commands\
    \ that can be hooked into the command line tooling. More information about this\
    \ topic can be found in the [official documentation](http://docs.doctrine-project.org/en/latest/reference/tools.html#adding-own-commands).\
    \ |\n\n| --- | --- |\n\n## 10 Caching\n\n### 10.1 Introduction to ORM cache types\n\
    \nDue to its nature and the way Doctrine 2 works, applications using Doctrine\
    \ 2 naturally run a bit slower compared to others. However, with good caching\
    \ strategies applied, this issue can nearly completely be removed. Doctrine 2\
    \ ORM brings native support for three different types of caches: The “meta cache”,\
    \ the “query cache” and the “result cache”. When setting up the entity manager,\
    \ the different caches can be added to the entity manager\\`s configuration. In\
    \ addition, the cache instance might be used for custom values as well.\n\n###\
    \ 10.2 Caching backends\n\nStoring cached data can be done in different so-called\
    \ “caching backends”. Doctrine 2 supports multiple technologies to be used as\
    \ a caching backend:\n\n*   APC\n\n*   Array\n\n*   Filesystem\n\n*   Memcached\n\
    \n*   Redis\n\n*   WinCache\n\n*   Xcache\n\n*   ZendDataCache\n\nBased on the\
    \ situation or technologies used, one can choose between the different technologies.\n\
    \n#### 10.2.1 Metadata Cache\n\nThe metadata cache holds the entity mapping data\
    \ given as annotations or external XML or YAML files. Caching this data means\
    \ that Doctrine 2 does not need to perform reflection or XML or YAML parsing for\
    \ every single request, which saves a significant amount of processing time.\n\
    \nWhen setting up the entity manager, the cache can easily be configured:\n\n\
    ```\n 1 <?php\n 2 // [..]\n 3 $paths = array(__DIR__ . \"/../src/Entity/\");\n\
    \ 4 $isDevMode = false;\n 5 \n 6 $dbParams = array(\n 7 \t'driver'   => 'pdo_mysql',\n\
    \ 8 \t'user'     => 'root',\n 9 \t'password' => '',\n10 \t'dbname'   => 'app',\n\
    11 );\n12 \n13 $config = Setup::createAnnotationMetadataConfiguration(\n14 \t\
    $paths, $isDevMode\n15 );\n16 \n17 $config->setMetadataCacheImpl(\n18 \tnew \\\
    Doctrine\\Common\\Cache\\FilesystemCache('/tmp/doctrine2')\n19 );\n20 \n21 $em\
    \ = EntityManager::create($dbParams, $config);\n```\n\nIn the configuration shown\
    \ above, we tell Doctrine 2 to cache meta data locally in the filesystem-we could\
    \ use other caching backends here as well. The caching path needs to be given\
    \ when using the `FilesystemCache`. Next time, when entities are processed, Doctrine\
    \ 2 starts setting up a somewhat cryptic files & folders structure in the caching\
    \ path given. Luckily, one doesn’t need to care about it-Doctrine 2 takes care\
    \ of all things caching. We only need to make sure that the caching path given\
    \ is writable to Doctrine 2. When caching via Memcached or Redis, these services\
    \ need to be up and running and accessible to Doctrine 2 as well. If not, an exception\
    \ will be raised.\n\n#### 10.2.2 Query Cache\n\nThe query cache ensures that DQL\
    \ statements need to be translated into SQL only once. This again speeds up a\
    \ Doctrine 2 application significantly:\n\n```\n 1 <?php\n 2 // [..]\n 3 $paths\
    \ = array(__DIR__ . \"/../src/Entity/\");\n 4 $isDevMode = false;\n 5 \n 6 $dbParams\
    \ = array(\n 7 \t'driver'   => 'pdo_mysql',\n 8 \t'user'     => 'root',\n 9 \t\
    'password' => '',\n10 \t'dbname'   => 'app',\n11 );\n12 \n13 $config = Setup::createAnnotationMetadataConfiguration($paths,\
    \ $isDevMode);\n14 $cachingBackend = new \\Doctrine\\Common\\Cache\\FilesystemCache('/tmp/doctrine2');\n\
    15 $config->setMetadataCacheImpl($cachingBackend);\n16 $config->setQueryCacheImpl($cachingBackend);\n\
    17 $em = EntityManager::create($dbParams, $config);\n```\n\nIn the configuration\
    \ shown above, we first set up a general caching backend which now powers both,\
    \ the metadata cache and the query cache.\n\n#### 10.2.3 Result Cache\n\nLast\
    \ but not least, there is the result cache. Using a result caching prevents executing\
    \ the same queries against the database again and again:\n\n```\n 1 <?php\n 2\
    \ // [..]\n 3 $paths = array(__DIR__ . \"/../src/Entity/\");\n 4 $isDevMode =\
    \ false;\n 5 \n 6 $dbParams = array(\n 7 \t'driver'   => 'pdo_mysql',\n 8 \t'user'\
    \     => 'root',\n 9 \t'password' => '',\n10 \t'dbname'   => 'app',\n11 );\n12\
    \ \n13 $config = Setup::createAnnotationMetadataConfiguration($paths, $isDevMode);\n\
    14 $cachingBackend = new \\Doctrine\\Common\\Cache\\FilesystemCache('/tmp/doctrine2');\n\
    15 $config->setMetadataCacheImpl($cachingBackend);\n16 $config->setQueryCacheImpl($cachingBackend);\n\
    17 $config->setResultCacheImpl($cachingBackend);\n18 $em = EntityManager::create($dbParams,\
    \ $config);\n```\n\nVia method `setResultCacheImpl()`, the result cache now is\
    \ ready for action. In contrast to the two other caching types, one has to actively\
    \ tell Doctrine 2 to cache results for a query given:\n\n```\n1 <?php\n2 \n3 //\
    \ [..]\n4 $query = $em->createQuery($dqlString);\n5 $query->useResultCache(true);\n\
    ```\n\nNow, the result is cached.\n\n## 11 Advanced Topics\n\n### 11.1 Zend Framework\
    \ 2 integration\n"
  trans: "\n\n上面所示的命令会使所有表和数据消失：\n\n```\n1 > Dropping database schema...\n2 > Database\
    \ schema dropped successfully!\n```\n\n| ![information](img/leanpub_information.png)\
    \ || \n\n#### 危险！可能会丢失数据！\n\n架构工具可以删除表和/或数据。因此，必须确保这些命令谨慎使用。 |\n\n| --- | ---\
    \ |\n\n执行\n\n```\n1 $ ./doctrine orm:schema-tool:create\n```\n\n会从头开始创建数据结构，而\n\
    \n```\n1 $ ./doctrine orm:schema-tool:update\n```\n\n则将现有数据架构从当前状态迁移到与当前持久化配置匹配的状态，前提是现有数据架构尚未更新。\n\
    \n#### 9.3.3 生成命令\n\n借助命令 `orm:generate-proxies`，可以为定义的实体创建代理类，否则这些代理类会由 Doctrine\
    \ 2 在需要时自动创建。通过命令 `orm:generate-entities`，可以生成实体类本身——当持久化配置通过 XML 或 YAML 提供时，这尤其有帮助。执行命令\n\
    \n```\n1 $ ./doctrine orm:generate-entities /tmp\n```\n\n会在 `/tmp` 中创建实体类，或者更准确地说，在\
    \ `/tmp/Entity` 中。有关命令 `orm:generate-entities` 的更多选项，可以通过运行以下命令来识别：\n\n```\n1\
    \ $ ./doctrine orm:generate-entities --help\n```\n\n借助命令 `orm:generate-repositories`，还可以自动生成仓库类。\n\
    \n#### 9.3.4 执行 DQL 命令\n\n与 `dbal:run-sql` 类似，也可以使用命令 `orm:run-dql` 轻松执行 DQL 语句。\n\
    \n#### 9.3.5 缓存相关命令\n\n借助命令\n\n*   `orm:clear-cache:metadata`，\n\n*   `orm:clear-cache:query`\
    \ 和\n\n*   `orm:clear-cache:result`\n\n可以清除各种 Doctrine 缓存。在部署新应用程序版本时，这些命令特别有用。它们确保不会在新应用程序版本中使用过时的配置或数据——通常，这会导致无法恢复的错误。\n\
    \n#### 9.3.6 转换命令\n\n很少使用，但非常有用的是命令 `orm:convert-d1-schema` 和 `orm:convert-mapping`。命令\
    \ `orm:convert-d1-schema` 用于将旧的 Doctrine 1 持久化配置格式转换为 Doctrine 2 使用的格式——在升级现有应用程序时非常方便。另一方面，命令\
    \ `orm:convert-mapping` 允许在一种 Doctrine 2 映射格式与另一种格式之间转换，例如从 XML 转换为 YAML。\n\n\
    #### 9.3.7 生产就绪配置\n\n以下命令验证 Doctrine 的配置是否已准备好用于生产环境：\n\n```\n1 $ ./doctrine orm:ensure-production-settings\n\
    ```\n\n如果是，它会在控制台上打印一条肯定的消息：\n\n```\n1 > Environment is correctly configured for\
    \ production.\n```\n\n许多配置方面都可能导致负面结果。这可能是缺少通过运行适当命令创建的代理类，或缺少缓存。Doctrine 2 认为两者都是生产系统使用的必需条件。\n\
    \n| ![information](img/leanpub_information.png) || \n\n#### 自定义命令\n\nDoctrine\
    \ 2 允许开发可以挂钩到命令行工具的自定义命令。有关此主题的更多信息可以在 [官方文档](http://docs.doctrine-project.org/en/latest/reference/tools.html#adding-own-commands)\
    \ 中找到。 |\n\n| --- | --- |\n\n## 10 缓存\n\n### 10.1 ORM 缓存类型简介\n\n由于其性质以及 Doctrine\
    \ 2 的工作方式，使用 Doctrine 2 的应用程序自然会比其他应用程序运行得稍慢一些。但是，通过应用良好的缓存策略，几乎可以完全消除这个问题。Doctrine\
    \ 2 ORM 原生支持三种不同类型的缓存：“元数据缓存”、“查询缓存”和“结果缓存”。在设置实体管理器时，可以将不同的缓存添加到实体管理器的配置中。此外，缓存实例还可以用于自定义值。\n\
    \n### 10.2 缓存后端\n\n缓存数据可以存储在不同的所谓“缓存后端”中。Doctrine 2 支持多种技术作为缓存后端：\n\n*   APC\n\
    \n*   Array\n\n*   Filesystem\n\n*   Memcached\n\n*   Redis\n\n*   WinCache\n\n\
    *   Xcache\n\n*   ZendDataCache\n\n根据情况或使用的技术，可以在不同的技术之间进行选择。\n\n#### 10.2.1 元数据缓存\n\
    \n元数据缓存保存作为注释或外部 XML 或 YAML 文件给出的实体映射数据。缓存此数据意味着 Doctrine 2 不需要为每个请求执行反射或 XML\
    \ 或 YAML 解析，这节省了大量处理时间。\n\n在设置实体管理器时，缓存可以轻松配置：\n\n```\n 1 <?php\n 2 // [..]\n\
    \ 3 $paths = array(__DIR__ . \"/../src/Entity/\");\n 4 $isDevMode = false;\n 5\
    \ \n 6 $dbParams = array(\n 7 \t'driver'   => 'pdo_mysql',\n 8 \t'user'     =>\
    \ 'root',\n 9 \t'password' => '',\n10 \t'dbname'   => 'app',\n11 );\n12 \n13 $config\
    \ = Setup::createAnnotationMetadataConfiguration(\n14 \t$paths, $isDevMode\n15\
    \ );\n16 \n17 $config->setMetadataCacheImpl(\n18 \tnew \\Doctrine\\Common\\Cache\\\
    FilesystemCache('/tmp/doctrine2')\n19 );\n20 \n21 $em = EntityManager::create($dbParams,\
    \ $config);\n```\n\n在上面所示的配置中，我们告诉 Doctrine 2 在本地文件系统中缓存元数据——我们也可以在这里使用其他缓存后端。使用\
    \ `FilesystemCache` 时，需要给出缓存路径。下次处理实体时，Doctrine 2 会在给定的缓存路径中开始设置某种神秘的文件和文件夹结构。幸运的是，不需要关心它——Doctrine\
    \ 2 会处理所有缓存事项。我们只需要确保给定的缓存路径对 Doctrine 2 可写。通过 Memcached 或 Redis 缓存时，这些服务需要正在运行并且对\
    \ Doctrine 2 可访问。如果不是，将引发异常。\n\n#### 10.2.2 查询缓存\n\n查询缓存确保 DQL 语句只需翻译一次为 SQL。这又显著加快了\
    \ Doctrine 2 应用程序的速度：\n\n```\n 1 <?php\n 2 // [..]\n 3 $paths = array(__DIR__\
    \ . \"/../src/Entity/\");\n 4 $isDevMode = false;\n 5 \n 6 $dbParams = array(\n\
    \ 7 \t'driver'   => 'pdo_mysql',\n 8 \t'user'     => 'root',\n 9 \t'password'\
    \ => '',\n10 \t'dbname'   => 'app',\n11 );\n12 \n13 $config = Setup::createAnnotationMetadataConfiguration($paths,\
    \ $isDevMode);\n14 $cachingBackend = new \\Doctrine\\Common\\Cache\\FilesystemCache('/tmp/doctrine2');\n\
    15 $config->setMetadataCacheImpl($cachingBackend);\n16 $config->setQueryCacheImpl($cachingBackend);\n\
    17 $em = EntityManager::create($dbParams, $config);\n```\n\n在上面所示的配置中，我们首先设置了一个通用缓存后端，它现在同时为元数据缓存和查询缓存提供支持。\n\
    \n#### 10.2.3 结果缓存\n\n最后，还有结果缓存。使用结果缓存可以防止反复对数据库执行相同的查询：\n\n```\n 1 <?php\n 2\
    \ // [..]\n 3 $paths = array(__DIR__ . \"/../src/Entity/\");\n 4 $isDevMode =\
    \ false;\n 5 \n 6 $dbParams = array(\n 7 \t'driver'   => 'pdo_mysql',\n 8 \t'user'\
    \     => 'root',\n 9 \t'password' => '',\n10 \t'dbname'   => 'app',\n11 );\n12\
    \ \n13 $config = Setup::createAnnotationMetadataConfiguration($paths, $isDevMode);\n\
    14 $cachingBackend = new \\Doctrine\\Common\\Cache\\FilesystemCache('/tmp/doctrine2');\n\
    15 $config->setMetadataCacheImpl($cachingBackend);\n16 $config->setQueryCacheImpl($cachingBackend);\n\
    17 $config->setResultCacheImpl($cachingBackend);\n18 $em = EntityManager::create($dbParams,\
    \ $config);\n```\n\n通过方法 `setResultCacheImpl()`，结果缓存现在已准备就绪。与其他两种缓存类型不同，必须主动告诉\
    \ Doctrine 2 为给定查询缓存结果：\n\n```\n1 <?php\n2 \n3 // [..]\n4 $query = $em->createQuery($dqlString);\n\
    5 $query->useResultCache(true);\n```\n\n现在，结果已被缓存。\n\n## 11 高级主题\n\n### 11.1 Zend\
    \ Framework 2 集成\n\n"
