- raw: "*   **postLoad**: Occurs for an entity after the entity has been loaded from\
    \ the database.\n\nWith `loadClassMetadata`, `onFlush` and `onClear`, additional\
    \ events are triggered that are persistence related, but are not specific to a\
    \ single entity.\n\nWith these events available, one may hook into persistence\
    \ processing, with a so-called *lifecycle callback*, which are implemented as\
    \ a method of an entity class.\n\nLet’s assume we want to add login data for each\
    \ `User` to our demo application. While the username can be picked be the user,\
    \ the password is auto-generated on signup. This can be achieved by adding a lifecycle\
    \ callback to the `User` class:\n\n```\n 1 <?php\n 2 namespace Entity;\n 3 \n\
    \ 4 /**\n 5 * @Entity\n 6 * @HasLifecycleCallbacks\n 7 * @Table(name=\"users\"\
    )\n 8 */\n 9 class User\n10 {\n11 \t// [..]\n12 \n13 \tconst GENERATED_PASSWORD_LENGTH\
    \ = 6;\n14 \n15 \t// [..]\n16 \n17 \t/** @PrePersist */\n18 \tpublic function\
    \ generatePassword()\n19 \t{\n20 \t\tfor($i = 1; $i <= self::GENERATED_PASSWORD_LENGTH;\
    \ $i++) {\n21 \t\t\t$this->password .= chr(rand(65, 90)); // 65 -> A, 90 -> Z\n\
    22 \t\t}\n23 \t}\n24 }\n```\n\nFirst, we need to declare that lifecycle callbacks\
    \ are present by using the `@HasLifecycleCallbacks` annotation. Then we add the\
    \ lifecycle annotation `@PrePersist` to the `generatePassword()` method. That’s\
    \ it! Now, before persisting a new entity, this method is called automatically\
    \ and the `User`’s password is auto-generated.\n\n### 7.8 Cascading operations\n\
    \nWhen creating a new or modifying an existing entity, all operations by default\
    \ only affect a single entity. A powerful, but somewhat dangerous feature, is\
    \ the option to define “operation cascades”. Let’s consider the following example.\
    \ If we delete a `User` in our demo application, we also want all of its `Post`s\
    \ being deleted. This can be achieved by adding the `cascade` attribute to the\
    \ association definition:\n\n```\n 1 <?php\n 2 namespace Entity;\n 3 \n 4 /**\n\
    \ 5 * @Entity\n 6 * @HasLifecycleCallbacks\n 7 * @Table(name=\"users\")\n 8 */\n\
    \ 9 class User\n10 {\n11 \t// [..]\n12  \n13 \t/**\n14 \t* @OneToMany(targetEntity=\"\
    Entity\\Post\", mappedBy=\"user\", cascade={\"remove\"})\n15 \t*/\n16 \tprivate\
    \ $posts; \n17 \n18 \t// [..]\n19 }\n```\n\nNow, when removing a user via\n\n\
    ```\n1 <?php\n2 $user = $em->getRepository('Entity\\User')->find($id);\n3 $em->remove($user);\n\
    4 $em->flush();\n```\n\nthe `User` is gone and also are all its `Post`s. When\
    \ setting `cascade` to value `all`, the cascade will be applied on others operations,\
    \ e.g. `persist`, as well.\n\nWhen adding the `cascade` attribute, the side matters.\
    \ In the code shown above, all referenced `Post` entities are removed, when a\
    \ `User` is removed. When adding `cascade` to the `Post` entity like shown in\
    \ the following code, the `User` entity will be removed, if one of its referenced\
    \ `Post` entities is deleted:\n\n```\n 1 <?php\n 2 namespace Entity;\n 3 \n 4\
    \ /**\n 5 * @Entity(repositoryClass=\"Repository\\Post\")\n 6 * @Table(name=\"\
    posts\")\n 7 */\n 8 class Post\n 9 {\n10 \t// [..]\n11 \n12 \t/**\n13 \t* @ManyToOne(targetEntity=\"\
    Entity\\User\", inversedBy=\"posts\", cascade={\"remove\"})\n14 \t* @JoinColumn(name=\"\
    user_id\", referencedColumnName=\"id\")\n15 \t*/\n16 \tprotected $user;\n17 \t\
    \n18 \t// [..]\n19 }\n```\n\nAssuming that this is not the desired behavior, it\
    \ is absolutely crucial to verify the cascade configuration to prevent data loss.\n\
    \nAnother way to achieve automatic deletion of referenced entities like shown\
    \ above is *orphan removal* for one-to-one and one-to-many associations. Orphan\
    \ removal means Doctrine 2 will automatically remove referenced entities without\
    \ a parent entity:\n\n```\n 1 /**\n 2 * @Entity\n 3 * @HasLifecycleCallbacks\n\
    \ 4 * @Table(name=\"users\")\n 5 */\n 6 class User\n 7 {\n 8 \t// [..]\n 9  \n\
    10 \t/**\n11 \t* @OneToMany(targetEntity=\"Entity\\Post\", mappedBy=\"user\",\
    \ orphanRemoval=true)\n12 \tprivate $posts; \n13 \n14 \t// [..]\n15 }\n```\n\n\
    Again, when the `User` is gone, also all of its `Post`s are gone.\n\nWhile cascading\
    \ operation are useful, they can be expensive. The reason for this is that all\
    \ operations on the referenced entities happen in RAM. They will be loaded and\
    \ reconstructed from the database first and then be modified. Depending on the\
    \ size of the collection, this could be resource intensive.\n\nLuckily, Doctrine\
    \ 2 also offers “database level” cascading operations for updates and deleted\
    \ via the \\`@JoinColumn’ annotation:\n\n```\n 1 <?php\n 2 namespace Entity;\n\
    \ 3 \n 4 /**\n 5 * @Entity(repositoryClass=\"Repository\\Post\")\n 6 * @Table(name=\"\
    posts\")\n 7 */\n 8 class Post\n 9 {\n10 \t/**\n11 \t* @ManyToOne(targetEntity=\"\
    Entity\\User\", inversedBy=\"posts\")\n12 \t* @JoinColumn(name=\"user_id\", referencedColumnName=\"\
    id\", onDelete=\"CASCADE\")\n13 \t*/\n14 \tprotected $user;  \n15 \t\n16 \t//\
    \ [..]\n17 }\n```\n\n### 7.9 Transactions\n\nA transaction is an atomic unit of\
    \ one or more database statements. All insert-, update- or delete-operations done\
    \ through the entity manager are queued as long as the `flush()` method has been\
    \ called on the entity manager. Technically speaking, the queue is an implementation\
    \ of the so-called [*unit of work*](http://martinfowler.com/eaaCatalog/unitOfWork.html)\
    \ pattern. When calling `flush()`, all queued operations in the unit of work are\
    \ fired against the database as a single transaction. If one of these operations\
    \ fail, Doctrine 2 automatically rolls back the entire transaction-this is all\
    \ operations queued-and mainly quits itself to prevent data loss due to inconsistencies.\n\
    \nDoctrine 2 offers a convenient way to wrap several database operations into\
    \ a single transaction. The following code demonstrates how to “reset” a `User`\
    \ in the demo application. First, the existing `User` is deleted, then a new one\
    \ is created by using its current first and last name:\n\n```\n 1 <?php\n 2 //\
    \ [..]\n 3 $em->transactional(function($em) {\n 4 \t$oldUser = $em->getRepository('Entity\\\
    User')->find(1);\n 5 \t$newUser = new Entity\\User();\n 6 \t$newUser->setFirstName($oldUser->getFirstname());\n\
    \ 7 \t$newUser->setLastName($oldUser->getLastname());\n 8 \t$em->persist($newUser);\n\
    \ 9 \t$em->remove($oldUser);\n10 });\n```\n\nBoth operations only take effect,\
    \ if there was no exception thrown for one of them. Otherwise, both operations\
    \ are rolled back.\n\nAnother issue may arise when two or more persons simultaneously\
    \ work on the same sets of data, which is not unlikely, e.g. for web applications.\
    \ Doctrine 2 fully supports a strategy called *optimistic locking*. The core idea\
    \ behind optimistic locking is that multiple users can all read data sets, however,\
    \ whenever changing data, only the first person writing is privileged to persist\
    \ its changes. All other users now working with an outdated version of the entity\
    \ will get an exception when trying to persist their individual changes. As this\
    \ strategy allows for concurrent reading operations and only controls write operations,\
    \ read-intensive application won’t be slowed down, compared to a pessimistic locking\
    \ strategy.\n\nTo make optimistic locking happen, Doctrine 2 allows to add a special\
    \ `integer` or `datetime` version field to an entity. The current value of this\
    \ field is compared to the value loaded before and if it doesn’t match on write,\
    \ an `OptimisticLockException` is thrown. If this happens, another user already\
    \ modified the entity in the meantime. A version field can be set up by adding\
    \ the `@Version` annotation:\n\n```\n 1 <?php\n 2 namespace Entity;\n 3 \n 4 /**\n\
    \ 5 * @Entity(repositoryClass=\"Repository\\Post\")\n 6 * @Table(name=\"posts\"\
    )\n 7 */\n 8 class Post\n 9 {\n10 \t// [..]\n11 \t\n12 \t/** @Version @Column(type=\"\
    integer\") */\n13 \tprotected $version;\n14 \t\n15 \t// [..]\n16 }\n```\n\nWhen\
    \ creating the corresponding data schema via Doctrine 2, a column called `version`\
    \ is added to the `posts` table. For every new `Post` entity, Doctrine 2 automatically\
    \ assigns a value of `1`. The value is increased by one with each following modification:\n\
    \n```\n1 $post = $em->getRepository('Entity\\Post')->find(1);\n2 $post->setTitle(\"\
    New title\");\n3 $em->flush();\n4 $em->clear();\n5 $post = $em->getRepository('Entity\\\
    Post')->find(1);\n6 $post->setTitle(\"Again, a new title\");\n7 $em->flush();\
    \  \n```"
