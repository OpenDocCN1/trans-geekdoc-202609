    | discr | VARCHAR | 255 | | | |\n| videoUrl | VARCHAR | 255 | YES | | |\n| imageUrl\
    \ | VARCHAR | 255 | YES | | |\n\n现在，所有三种类型的实体都可以轻松地被持久化。这种方法的缺点是，取决于层次结构的复杂程度以及涉及的类型之间的差异程度，表格会不断增长，其中包含许多特定类型永远不会使用的字段。在我们的例子中，`videoUrl`\
    \ 永远不会被 `ImagePost` 类型的实体使用。`imageUrl` 不会被 `VideoPost` 实体使用，而对于 `Post` 实体来说，这两个字段都将保持空白。\n\
    \n这种方法的优点是，由于其本质，这种策略允许在层次结构中的所有类型之间进行非常高效的排队，而无需任何连接。\n\n#### 5.4.2 类表继承\n\n\
    虽然单表继承为所有类型只使用一个表，但 *类表继承* 是一种不同的方法，其中层次结构中的每个类都映射到多个表。虽然这无疑提供了最佳的灵活性，但这也意味着重建实体将需要在数据库中进行连接。由于连接是昂贵的操作，通常，类表继承的性能不如单表继承。\n\
    \n配置的主要区别在于 `Post`：\n\n```php\n<?php\nnamespace Entity;\n\n/**\n * @Entity(repositoryClass=\"\
    Repository\\Post\")\n * @Table(name=\"posts\")\n * @InheritanceType(\"JOINED\"\
    )\n * @DiscriminatorColumn(name=\"discr\", type=\"string\")\n * @DiscriminatorMap({\"\
    text\"=\"Post\",\"video\"=\"VideoPost\",\"image\"= \"ImagePost\"})\n */\nclass\
    \ Post\n{\n\t// member variables and associations shared between all types\n}\n\
    ```\n\n现在不再使用继承类型“SINGLE\\_TABLE”，而是使用“JOINED”。这告诉 Doctrine 2 应用类表继承策略。由于将为每个类型使用表，因此为子类配置表名可能很有用：\n\
    \n```php\n<?php\nnamespace Entity;\n\n/**\n * @Entity\n * @Table(name=\"posts_image\"\
    )\n */\nclass ImagePost extends Post\n{\n\t/** @Column(type=\"string\") */\n\t\
    protected $imageUrl;\n\n\t/**\n\t * @param mixed $imageUrl\n\t */\n\tpublic function\
    \ setImageUrl($imageUrl)\n\t{\n\t\t$this->imageUrl = $imageUrl;\n\t}\n\n\t/**\n\
    \t * @return mixed\n\t */\n\tpublic function getImageUrl()\n\t{\n\t\treturn $this->imageUrl;\n\
    \t}\n}\n```\n\n表名 `posts_image` 对于 `ImagesPost` 实体很有用。我们也为 `VideoPost` 实体添加了相同风格的配置：\n\
    \n```php\n<?php\nnamespace Entity;\n\n/**\n * @Entity\n * @Table(name=\"posts_video\"\
    )\t\n */\nclass VideoPost extends Post\n{\n\t/** @Column(type=\"string\") */\n\
    \tprotected $videoUrl;\n\n\t/**\n\t * @param mixed $videoUrl\n\t */\n\tpublic\
