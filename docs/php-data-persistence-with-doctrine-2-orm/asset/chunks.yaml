  trans: "\n\n我们写了一大堆代码——却只能从数据库中读取数据并将其转换为对象。我们甚至没有推进自己的应用程序。看来构建 ORM 系统既费力又耗时。而且我们才刚刚开始。让我们花更多时间来增强我们的\
