  fmt: "\nAlso, entities of type `VideoPost` aren’t organized in categories called\
    \ channels. We can overwrite the association like shown below:\n\n```\n<?php\n\
    namespace Entity;\n\n/**\n * @Entity\n * @Table(name=\"posts_video\")\n * @AssociationOverrides({\n\
    \ *     @AssociationOverride(name=\"category\",\n *         joinColumns=@JoinColumn(\n\
    \ *              name=\"channel_id\", referencedColumnName=\"id\"\n *        \
    \ )\n *     )\n * })\n */\nclass VideoPost extends Post\n{\n\t// [..]\n}\n```\n\
    \n## 6 References between Entities\n\nEntities usually are part of a bigger, interconnected\
    \ object graph. They have references to other entities. A `User` holds references\
    \ to its `Post`s, while a `Post` references a `Category` which reference back\
    \ to the `User` who set the `Category` up and so forth. As we will see in the\
    \ following, there are a lot of different ways to establish connections between\
    \ entities. Connections are characterized by the number of items they connect\
    \ and the association’s direction. Let’s take a look!\n\n### Domain model of the\
    \ demo app Talking\n\nThe following code samples are related to the domain model\
    \ of the demo app introduced earlier in the book. The drawing of the domain model\
    \ might be helpful as a reference throughout this chapter.\n\n### 6.1 One to one\
    \ relationship, unidirectional\n\nIn contrast to foreign key relationships in\
    \ a database, joining two tables in both directions always, this is not true for\
    \ objects. Therefore, Doctrine 2 differentiates between unidirectional and bidirectional\
    \ associations between objects. Unidirectional means that one objects points to\
    \ the other, but the latter does not have a pointer back.\n\nTo set up this type\
    \ of a relationship between two entities, one simply needs to pick a member variable\
    \ acting as the pointer:\n\n```\n<?php\nnamespace Entity;\n\n/**\n * @Entity\n\
    \ * @Table(name=\"users\")\n */\nclass User\n{\n\t// [..]\n\n\t/**\n\t* @OneToOne(targetEntity=\"\
    Entity\\ContactData\")\n\t*/\n\tprivate $contactData;\n\t\n\t// [..]\n}\n```\n\
    \nThe `@OneToOne` annotation defines the type of the relationship-a one to one\
    \ relationship. The `targetEntity` attribute defines the entity class the pointer\
    \ references to. The class given with the `targetEntity` attribute needs to be\
    \ fully qualified including a namespace if applicable. In any case, one must not\
    \ add a leading backslash.\n\nIt’s now already possible to reach a referenced\
    \ entity (`ContactData`) through a loaded `User`, if a getter method has been\
    \ added as well beforehand:\n\n```\n<?php\nvar_dump($user->getContactData());\n\
    ```\n\nHowever, the simple persistence configuration shown above only works because\
    \ `ContactData` has a member variable called `id`:\n\n```\n<?php\nnamespace Entity;\n\
    \n/**\n * @Entity\n * @Table(name=\"contact_data\")\n */\nclass ContactData\n\
    {\n\t/**\n\t* @Id @Column(type=\"integer\")\n\t* @GeneratedValue\n\t*/\n\tprivate\
    \ $id;\n\t\n\t// [..]\n}\n```\n\nIf the member variable has a different name,\
    \ like `contactDataId` or something similar, one needs to tell Doctrine 2 about\
    \ it:\n\n```\n<?php\nnamespace Entity;\n\n/**\n * @Entity\n * @Table(name=\"users\"\
    )\n */\nclass User\n{\n\t// [..]\n\n\t/**\n\t* @OneToOne(targetEntity=\"Entity\\\
    ContactData\")\n\t* @JoinColumn(name=\"id\", referencedColumnName=\"contactDataId\"\
    )\n\t*/\n\tprivate $contactData;\n\t\n\t// [..]\n}\n```\n\nLater in this book,\
    \ we will learn more about the details of the `@JoinColumn` annotation.\n\nLoading\
    \ a `User` and its `ContactData`-like shown above-only works, if the data structure\
    \ in the database has also been set up beforehand, in addition to the PHP class\
    \ and the persistence configuration. If not, all this won’t work and errors are\
    \ reported by Doctrine 2. Based on the situation, one of the following will be\
    \ true:\n\n* We have an existing data structure given in the database and we adapt\
    \ the persistence configuration to it.\n\n* We don’t have an existing data structure\
    \ given and the persistence configuration has no external restrictions. In this\
    \ case, the Doctrine 2 `schema tool` can even create the data structure in the\
    \ database simply based on the persistence configuration. More about how to auto-create\
    \ a data structure in a database can be found in chapter “Doctrine 2 on the command\
    \ line” later in this book.\n\nIn any case, its important that the data structure\
    \ and the Doctrine 2 persistence mappings match. If not, one will be in trouble\
    \ for sure. The schema tool can also be used to verify that data structure and\
    \ persistence mappings match.\n\nIn the following, let’s assume, we always create\
    \ the data structure for the demo application using the schema tool. In this case,\
    \ the table `users` will be created after invoking the proper schema tool commands:\n\
    \n| Col | Type | Length | NULL? | KEY | Extras |\n| --- | --- | --- | --- | ---\
    \ | --- |\n| id | INT | 11 | | PRI | auto_increment |\n| first_name | VARCHAR\
    \ | 255 | Y | | |\n| last_name | VARCHAR | 255 | Y | | |\n| gender | INT | 11\
    \ | Y | | |\n| name_prefix | VARCHAR | 255 | Y | | |\n| contactData_id | INT |\
    \ 11 | Y | UNI | |\n\nThe table `contact_data` created looks like this:\n\n| Col\
    \ | Type | Length | NULL? | KEY | Extras |\n| --- | --- | --- | --- | --- | ---\
    \ |\n| id | INT | 11 | | PRI | |\n| email | VARCHAR | 255 | Y | | |\n| phone |\
    \ VARCHAR | 255 | Y | | |\n\n### 6.2 One to one relationship, bidirectional\n\n\
    In contrast to the unidirectional one to one relationship two pointers exist:\
    \ One pointing from object A to object B and another pointing from object B to\
    \ object A. Its important that we talk about two separate pointers here, as we\
    \ will see in a minute. Let’s take the a `User` entity again with a reference\
    \ to a `UserInfo` entity:\n\n```\n<?php\nnamespace Entity;\n\n/**\n * @Entity\n\
    \ * @Table(name=\"users\")\n */\nclass User\n{\n\t// [..]\n\n\t/**\n\t* @OneToOne(targetEntity=\"\
    Entity\\UserInfo\")\n\t*/\n\tprivate $userInfo;\n\n\t// [..]\n}\n```\n\nIf we\
    \ now want the `UserInfo` entity to point back to the `User` entity, we need to\
    \ extend the configuration of the `User` entity by adding `inversedBy=\"user\"\
    `:\n\n```\n<?php\nnamespace Entity;\n\n/**\n * @Entity\n * @Table(name=\"users\"\
    )\n */\nclass User\n{\n\t// [..]\n\n\t/**\n\t* @OneToOne(targetEntity=\"Entity\\\
    UserInfo\", inversedBy=\"user\")\n\t*/\n\tprivate $userInfo;\n\n\t// [..]\n}\n\
    ```\n\nWe configured, that the `UserInfo` entity has a pointer called `$user`\
    \ to a `UserInfo` entity. The `UserInfo` entity itself looks like this:\n\n```\n\
    <?php\nnamespace Entity;\n\n/**\n * @Entity\n * @Table(name=\"user_info\")\n */\n\
    class UserInfo\n{\n\t/**\n\t* @Id @Column(type=\"integer\")\n\t* @GeneratedValue\n\
    \t*/\n\tprivate $id;\n\n\t/** @Column(type=\"datetime\", nullable=true) */\n\t\
    private $signUpDate;\n\n\t/** @Column(type=\"datetime\", nullable=true) */\n\t\
    private $signOffDate = null;\n\n\t/**\n\t* @OneToOne(targetEntity=\"Entity\\User\"\
    , mappedBy=\"userInfo\")\n\t*/\n\tprivate $user;\n\n\tpublic function setId($id)\n\
    \t{\n\t\t$this->id = $id;\n\t}\n\n\tpublic function getId()\n\t{\n\t\treturn $this->id;\n\
    \t}\n\n\tpublic function setSignOffDate($signOffDate)\n\t{\n\t\t$this->signOffDate\
    \ = $signOffDate;\n\t}\n\n\tpublic function getSignOffDate()\n\t{\n\t\treturn\
    \ $this->signOffDate;\n\t}\n\n\tpublic function setSignUpDate($signUpDate)\n\t\
    {\n\t\t$this->signUpDate = $signUpDate;\n\t}\n\n\tpublic function getSignUpDate()\n\
    \t{\n\t\treturn $this->signUpDate;\n\t}\n\n\tpublic function setUser($user)\n\t\
    {\n\t\t$this->user = $user;\n\t}\n\n\tpublic function getUser()\n\t{\n\t\treturn\
    \ $this->user;\n\t}\n}\n"
  trans: "\n\n另外，类型为 `VideoPost` 的实体并未按名为“频道”的分类进行组织。我们可以像下面这样覆盖关联：\n\n```\n<?php\n\
    namespace Entity;\n\n/**\n * @Entity\n * @Table(name=\"posts_video\")\n * @AssociationOverrides({\n\
    \ *     @AssociationOverride(name=\"category\",\n *         joinColumns=@JoinColumn(\n\
    \ *              name=\"channel_id\", referencedColumnName=\"id\"\n *        \
    \ )\n *     )\n * })\n */\nclass VideoPost extends Post\n{\n\t// [..]\n}\n```\n\
    \n## 6 实体之间的引用\n\n实体通常是更大、相互关联的对象图的一部分。它们持有对其他实体的引用。一个 `User` 持有其 `Post`s 的引用，而一个\
    \ `Post` 引用一个 `Category`，该 `Category` 又引用回设置该 `Category` 的 `User`，以此类推。正如我们将在下文中看到，建立实体之间连接的方式有很多种。连接由它们连接的项目数量以及关联的方向来表征。让我们来看看！\n\
    \n### 演示应用 Talking 的领域模型\n\n下面的代码示例与本书前面介绍的演示应用的领域模型相关。领域模型的图示在本章中可能作为参考很有帮助。\n\
    \n### 6.1 单向一对一关系\n\n与数据库中外键关系不同，数据库中两张表总是双向连接，但对象并非如此。因此，Doctrine 2 在对象之间区分单向关联和双向关联。单向意味着一个对象指向另一个对象，但后者没有指回的指针。\n\
    \n要在两个实体之间建立这种类型的关系，只需选择一个作为指针的成员变量即可：\n\n```\n<?php\nnamespace Entity;\n\n/**\n\
    \ * @Entity\n * @Table(name=\"users\")\n */\nclass User\n{\n\t// [..]\n\n\t/**\n\
    \t* @OneToOne(targetEntity=\"Entity\\ContactData\")\n\t*/\n\tprivate $contactData;\n\
    \t\n\t// [..]\n}\n```\n\n`@OneToOne` 注解定义了关系的类型——一对一关系。`targetEntity` 属性定义了指针引用的实体类。使用\
    \ `targetEntity` 属性给出的类需要完全限定，包括命名空间（如果适用）。无论如何，都不能添加前导反斜杠。\n\n现在，只要事先添加了 getter\
    \ 方法，就可以通过加载的 `User` 访问引用的实体（`ContactData`）：\n\n```\n<?php\nvar_dump($user->getContactData());\n\
    ```\n\n然而，上面所示的简单持久化配置之所以有效，仅仅是因为 `ContactData` 有一个名为 `id` 的成员变量：\n\n```\n<?php\n\
    namespace Entity;\n\n/**\n * @Entity\n * @Table(name=\"contact_data\")\n */\n\
    class ContactData\n{\n\t/**\n\t* @Id @Column(type=\"integer\")\n\t* @GeneratedValue\n\
    \t*/\n\tprivate $id;\n\t\n\t// [..]\n}\n```\n\n如果成员变量的名称不同，例如 `contactDataId`\
    \ 或类似名称，则需要告诉 Doctrine 2：\n\n```\n<?php\nnamespace Entity;\n\n/**\n * @Entity\n\
    \ * @Table(name=\"users\")\n */\nclass User\n{\n\t// [..]\n\n\t/**\n\t* @OneToOne(targetEntity=\"\
    Entity\\ContactData\")\n\t* @JoinColumn(name=\"id\", referencedColumnName=\"contactDataId\"\
    )\n\t*/\n\tprivate $contactData;\n\t\n\t// [..]\n}\n```\n\n本书后面我们将了解更多关于 `@JoinColumn`\
    \ 注解的细节。\n\n加载 `User` 及其 `ContactData`（如上所示）只有在数据库中的数据结构也事先设置好（除了 PHP 类和持久化配置之外）时才能工作。如果不这样做，这一切都不会工作，Doctrine\
    \ 2 会报告错误。根据情况，以下之一将为真：\n\n* 我们有一个在数据库中给定的现有数据结构，并将持久化配置调整为适应它。\n\n* 我们没有给定的现有数据结构，且持久化配置没有外部限制。在这种情况下，Doctrine\
    \ 2 的 `schema tool` 甚至可以仅根据持久化配置在数据库中创建数据结构。关于如何在数据库中自动创建数据结构的更多信息，可以在本书后面的章节“Doctrine\
    \ 2 on the command line”中找到。\n\n无论如何，重要的是数据结构和 Doctrine 2 持久化映射必须匹配。如果不匹配，肯定会遇到麻烦。schema\
    \ tool 也可以用来验证数据结构和持久化映射是否匹配。\n\n在下文中，让我们假设我们总是使用 schema tool 为演示应用程序创建数据结构。在这种情况下，调用适当的\
    \ schema tool 命令后，将创建表 `users`：\n\n| Col | Type | Length | NULL? | KEY | Extras\
    \ |\n| --- | --- | --- | --- | --- | --- |\n| id | INT | 11 | | PRI | auto_increment\
    \ |\n| first_name | VARCHAR | 255 | Y | | |\n| last_name | VARCHAR | 255 | Y |\
    \ | |\n| gender | INT | 11 | Y | | |\n| name_prefix | VARCHAR | 255 | Y | | |\n\
    | contactData_id | INT | 11 | Y | UNI | |\n\n创建的表 `contact_data` 如下所示：\n\n| Col\
    \ | Type | Length | NULL? | KEY | Extras |\n| --- | --- | --- | --- | --- | ---\
    \ |\n| id | INT | 11 | | PRI | |\n| email | VARCHAR | 255 | Y | | |\n| phone |\
    \ VARCHAR | 255 | Y | | |\n\n### 6.2 双向一对一关系\n\n与单向一对一关系相反，双向一对一关系存在两个指针：一个从对象\
    \ A 指向对象 B，另一个从对象 B 指向对象 A。这里要谈论两个独立的指针很重要，我们马上就会看到。让我们再拿一个 `User` 实体，它引用一个 `UserInfo`\
    \ 实体：\n\n```\n<?php\nnamespace Entity;\n\n/**\n * @Entity\n * @Table(name=\"users\"\
    )\n */\nclass User\n{\n\t// [..]\n\n\t/**\n\t* @OneToOne(targetEntity=\"Entity\\\
    UserInfo\")\n\t*/\n\tprivate $userInfo;\n\n\t// [..]\n}\n```\n\n如果我们现在希望 `UserInfo`\
    \ 实体指回 `User` 实体，则需要通过添加 `inversedBy=\"user\"` 来扩展 `User` 实体的配置：\n\n```\n<?php\n\
    namespace Entity;\n\n/**\n * @Entity\n * @Table(name=\"users\")\n */\nclass User\n\
    {\n\t// [..]\n\n\t/**\n\t* @OneToOne(targetEntity=\"Entity\\UserInfo\", inversedBy=\"\
    user\")\n\t*/\n\tprivate $userInfo;\n\n\t// [..]\n}\n```\n\n我们配置了 `UserInfo` 实体有一个名为\
    \ `$user` 的指针指向 `UserInfo` 实体。`UserInfo` 实体本身如下所示：\n\n```\n<?php\nnamespace Entity;\n\
    \n/**\n * @Entity\n * @Table(name=\"user_info\")\n */\nclass UserInfo\n{\n\t/**\n\
    \t* @Id @Column(type=\"integer\")\n\t* @GeneratedValue\n\t*/\n\tprivate $id;\n\
    \n\t/** @Column(type=\"datetime\", nullable=true) */\n\tprivate $signUpDate;\n\
    \n\t/** @Column(type=\"datetime\", nullable=true) */\n\tprivate $signOffDate =\
    \ null;\n\n\t/**\n\t* @OneToOne(targetEntity=\"Entity\\User\", mappedBy=\"userInfo\"\
    )\n\t*/\n\tprivate $user;\n\n\tpublic function setId($id)\n\t{\n\t\t$this->id\
    \ = $id;\n\t}\n\n\tpublic function getId()\n\t{\n\t\treturn $this->id;\n\t}\n\n\
    \tpublic function setSignOffDate($signOffDate)\n\t{\n\t\t$this->signOffDate =\
    \ $signOffDate;\n\t}\n\n\tpublic function getSignOffDate()\n\t{\n\t\treturn $this->signOffDate;\n\
    \t}\n\n\tpublic function setSignUpDate($signUpDate)\n\t{\n\t\t$this->signUpDate\
    \ = $signUpDate;\n\t}\n\n\tpublic function getSignUpDate()\n\t{\n\t\treturn $this->signUpDate;\n\
    \t}\n\n\tpublic function setUser($user)\n\t{\n\t\t$this->user = $user;\n\t}\n\n\
    \tpublic function getUser()\n\t{\n\t\treturn $this->user;\n\t}\n}\n\n"
