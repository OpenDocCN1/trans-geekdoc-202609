    integer\")\n\t * @GeneratedValue\n\t */\n\tprotected $id;\n\n} \n```\n\n现在我们有三个具体的实体类型和一个不是实体的超类。这会导致数据库中有三个表：`posts_text`、`posts_images`\
    \ 和 `posts_video`。\n\n如上所示，重要的是每个实体都有其 ID 列指定，而映射超类没有。它只继承成员变量和关联，但不继承 ID 列定义。\n\
