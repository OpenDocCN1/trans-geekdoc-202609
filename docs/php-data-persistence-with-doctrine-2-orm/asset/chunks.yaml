    ```\n<?php\nnamespace Entity;\n\n/**\n * @Entity\n * @Table(name=\"users\")\n\
    \ */\nclass User\n{\n    // [..]\n    \n    /**\n     * @ManyToMany(targetEntity=\"\
    Entity\\User\")\n     * @JoinTable(name=\"friends\",\n     *      joinColumns={@JoinColumn(name=\"\
    user_id\",\n     *          referencedColumnName=\"id\")},\n     *      inverseJoinColumns={@JoinColumn(name=\"\
    friend_user_id\",\n     *          referencedColumnName=\"id\")}\n     * )\n \
    \    **/\n    private $myFriends;\n\n    public function __construct()\n    {\n\
    \        // [..]\n        $this->myFriends = new \\Doctrine\\Common\\Collections\\\
    ArrayCollection();\n    }\n\n    // [..]\n    \n    public function setMyFriends($myFriends)\n\
    \    {\n        $this->myFriends = $myFriends;\n    }\n\n    public function getMyFriends()\n\
    \    {\n        return $this->myFriends;\n    }\n}\n```\n\n如果再次应用架构工具，它会在此处报告错误，因为\
    \ Doctrine 2 想要将连接表的两列都标记为“user\\_id”，这是无效的。在这种情况下，需要添加 `@JoinTable` 注解以提供不同的持久化配置。此外，默认情况下，连接表将被称为\
    \ `users_users`，除非另有定义。在我们的情况中，我们告诉 Doctrine 2 将其称为 `friends`，这是我们情况中更有意义的表命名。如果处理现有数据结构，无论如何都需要自定义配置。\n\
    \n## 7 管理实体\n\n### 7.1 创建新实体\n\n一旦领域模型建模完成，就可以开始使用它了。新实体可以简单地基于实体类的新对象来创建：\n\n\
    ```\n<?php\n$newPost = new \\Entity\\Post();\n$newPost->setTitle('A new post!');\n\
    $newPost->setContent('This is the body of the new post.');\n$em->persist($newPost);\n\
    $em->flush();\n```\n\n上面显示的代码预期 `$em` 引用一个可用的实体管理器。首先，创建一个新的 `Post`，然后分配数据，然后将对象传递给实体管理器进行持久化。\n\
    \n必须记住，`persist()` 方法调用不会立即导致发出 SQL INSERT 语句。实体仅计划在下一次刷新时持久化。只要没有发生刷新，实体就处于称为\
    \ `MANAGED` 的状态——这意味着实体管理器识别新实体，并从现在开始。\n\n只有在实体管理器上调用 `flush()` 方法后，才会向数据库写入新记录。否则，脚本结束后实体将丢失。\n\
    \n### 7.2 加载现有实体\n\n主要有两种不同的方法来加载现有实体：要么通过查询并从其对应的仓库中检索它，要么通过另一个已加载实体给定的关联来访问它。\n\
    \n#### 7.2.1 使用仓库\n\n我们已经了解到，仓库是特定类型所有实体的容器。仓库由查找方法装饰，用于根据查询搜索实体。虽然有几种开箱即用的查找方法，但也可以稍后添加自定义查找方法。自定义查找方法可以被视为典型查询的“快速访问”。借助查找方法，可以查找实体，例如按其\
    \ ID 如下所示：\n\n```\n<?php\n$post = $em->getRepository('Entity\\Post')->findOneById($id);\n\
    ```\n\n首先，我们从实体管理器请求仓库，然后在其上执行查找方法。默认情况下，有四种查找方法可用。要根据 ID 查找单个实体，使用 `find()` 方法：\n\
    \n"
