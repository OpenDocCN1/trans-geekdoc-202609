  trans: "\n\n在 `UserInfo` 实体中，我们通过 `targetEntity=\"Entity\\User\"` 定义目标实体类，并通过添加\
    \ `mappedBy=\"contactData\"` 让 Doctrine 2 知道 `User` 实体通过 `contactData` 反向引用。\n\
    \n到目前为止，一切顺利！我们刚刚在两个实体之间建立了双向连接。现在让我们来讨论 `inversedBy` 和 `mappedBy` 配置。\n\n假设存在一个\
    \ `User` 实体和一个 `UserInfo` 实体，两者相互关联并以双向方式指向对方：`$userInfo` 指向一个 `UserInfo` 实例，`$user`\
    \ 指向一个 `User` 实例。如果我们现在想要断开两者的连接，则需要移除这两个指针：\n\n```\n<?php\n// [..]\n$user = $em->getRepository('Entity\\\
    User')->findOneById($id);\n$user->getUserInfo()->setUser(null);\n$user->setUserInfo(null);\n\
    $em->flush();\n```\n\n但是，如果我们只移除了两个指针中的一个呢？实际上，这会导致不一致。哪个引用告诉 Doctrine 2 关于这两个对象及其关联的真相？一个实体说“是的，我们已连接”，另一个实体说“不，我们根本没有连接”。请记住，这个问题只存在于面向对象的世界中，不存在于关系型数据库宇宙中。在关系型数据库中，引用始终是双向的。不存在单向关系的概念。回到不一致性问题：在处理持久化时，Doctrine\
    \ 2 应该听从哪个实体？解决方案如下：存疑时，Doctrine 2 会听取携带 `inversedBy` 属性的实体。这意味着以下代码不会移除两个实体之间的关联：\n\
    \n```\n<?php\n// [..]\n$user = $em->getRepository('Entity\\User')->findOneById($id);\n\
    $user->getUserInfo()->setUser(null);\n$em->flush();\n```\n\n相反，以下代码会移除关联：\n\n\
    ```\n<?php\n// [..]\n$user = $em->getRepository('Entity\\User')->findOneById($id);\n\
    $user->setUserInfo(null);\n$em->flush();\n```\n\n原因是 `User` 实体具有 `inversedBy`\
    \ 属性，并充当所谓的 `owning side`（拥有方）。拥有方是 Doctrine 2 在确定连接是否存在时所监听的一方。另一方，即所谓的 `inverse\
    \ side`（反向方）在这里无关紧要。Doctrine 2 不关心反向方的说法。\n\n但是，即使我们正确地从拥有方切断了两者之间的连接，此更改只有在执行\
    \ flush 后才会持久化：\n\n```\n<?php\nuse Doctrine\\ORM\\EntityManager;\n// [..]\n$em\
    \ = EntityManager::create($dbParams, $config);\n$em->flush();\n```\n\n只要没有执行 flush，运行中的程序中仍然存在不一致：\n\
    \n```\n<?php\n$user = $em->getRepository('Entity\\User')->findOneById($id);\n\
    $userInfo = $user->getUserInfo();\n$user->setUserInfo(null);\nvar_dump($user->getUserInfo());\
    \ // NULL\nvar_dump($userInfo->getUser()); // object(Entity\\User)\n$em->flush();\n\
    var_dump($user->getUserInfo()); // NULL\nvar_dump($userInfo->getUser()); // NULL\n\
    ```\n\n只有在执行 `$em->flush()` 之后，`var_dump($userInfo->getUser())` 才会最终返回 `NULL`。在此之前，它仍然返回引用的对象。在某些情况下，这种情况可能导致难以调试的问题。这里的一个好建议是，始终确保同时移除两个引用，以便即使运行中的程序也能保持完整：\n\
    \n```\n<?php\nnamespace Entity;\n\n/**\n * @Entity\n * @Table(name=\"users\")\n\
    \ */\nclass User\n{\n\t// [..]\n\n\tpublic function removeUserInfo()\n\t{\n\t\t\
    $this->userInfo->setUser(null);\n\t\t$this->userInfo = null;\n\t}\t\n}\n```\n\n\
    以下代码现在始终处于一致状态：\n\n```\n<?php\n$user = $em->getRepository('Entity\\User')->findOneById($id);\n\
    $userInfo = $user->getUserInfo();\n$user->removeUserInfo();\nvar_dump($user->getUserInfo());\
    \ // NULL\nvar_dump($userInfo->getUser()); // NULL\n$em->flush();\nvar_dump($user->getUserInfo());\
    \ // NULL\nvar_dump($userInfo->getUser()); // NULL\n```\n\n作为最佳实践，应该始终在拥有方上添加支持持久化的方法。\n\
    \n让我们回顾一下：双向关系始终有一个拥有方和一个反向方。单向关系只有一个拥有方，而且不需要显式声明。关于关联，只有对拥有方的更改与持久化相关。Doctrine\
    \ 2 在此问题上不关心反向方。被声明为拥有方的实体的数据库表持有外键。连接的哪一方被定义为拥有方，由应用程序开发者决定。\n\n给定双向关联，拥有方可以通过识别\
    \ `inversedBy` 属性来确定，而反向方则携带 `mappedBy` 属性。\n\n### 6.3 一对多关系，双向\n\n在“Hello, Doctrine\
    \ 2！”章节中，我们在演示应用中为 `User` 及其 `Post`s 添加了一个双向的一对多关系。再次，让我们仔细看看我们是如何实现的。`User` 实体有一个名为\
    \ `$posts` 的成员变量：\n\n```\n<?php\nnamespace Entity;\n\n/**\n * @Entity\n * @Table(name=\"\
    users\")\n */\nclass User\n{\n\t/**\n\t* @OneToMany(targetEntity=\"Entity\\Post\"\
    , mappedBy=\"user\")\n\t*/\n\tprivate $posts;\n\t\n\t// [..]\n}\n```\n\n`@OneToMany`\
    \ 注解定义了与 `Post` 实体（`targetEntity`）的一对多关系。由于给出了 `mappedBy` 属性，这是一个双向关系。`Post` 实体如下所示：\n\
    \n```\n<?php\nnamespace Entity;\n\n/**\n * @Entity\n * @Table(name=\"posts\")\n\
    \ */\nclass Post\n{\n\t/**\n\t* @ManyToOne(targetEntity=\"Entity\\User\", inversedBy=\"\
    posts\")\n\t*/\n\tprivate $user;\n\t\n\t// [..]\n}\n```\n\n在这里我们找到了对应的注解 `@ManyToOne`。在一对一关系中，应用程序开发者可以自由决定哪一方声明为拥有方。但这里不是这种情况。携带\
    \ `@ManyToOne` 注解的实体必须成为拥有方并获取 `inversedBy` 属性。\n\n如果再次使用架构工具根据持久化配置创建数据结构，将设置以下表：\n\
    \n| Col | Type | Length | NULL? | KEY | Extras |\n| --- | --- | --- | --- | ---\
    \ | --- |\n| id | INT | 11 | | PRI | auto_increment |\n| first_name | VARCHAR\
    \ | 255 | Y | | |\n| last_name | VARCHAR | 255 | Y | | |\n| gender | INT | 11\
    \ | Y | | |\n| name_prefix | VARCHAR | 255 | Y | | |\n| contactData_id | INT |\
    \ 11 | Y | UNI | |\n| userInfo_id | INT | 11 | Y | UNI | |\n\n表 `user_info` 如下所示：\n\
    \n| Col | Type | Length | NULL? | KEY | Extras |\n| --- | --- | --- | --- | ---\
    \ | --- |\n| id | INT | 11 | | PRI | |\n| user_id | INT | 11 | | MUL | |\n| title\
    \ | VARCHAR | 255 | | | |\n| content | VARCHAR | 255 | | | |\n\n如我们所见，表 `user_info`\
    \ 持有外键，该外键可能出现多次。从给定的 `User` 实体访问 `User` 的 `Post`s 时，Doctrine 使用 `Doctrine\\ORM\\\
    PersistentCollection` 来提供引用的 `Post` 实体。它扩展了其他类，例如 `\\Countable`、`\\IteratorAggregate`\
    \ 和 `\\ArrayAccess`，这使得 `Doctrine\\ORM\\PersistentCollection` 非常类似于常规 PHP 数组，这意味着它可以轻松地在\
    \ PHP foreach 循环中使用。\n\n只要引用的 `Post`s 至少被访问一次，成员变量 `$user` 的值就是 `null`，而不是已分配的\
    \ `Doctrine\\ORM\\PersistentCollection` 类的对象。如果在 Doctrine 2 设置之前想要使用集合，这可能是一个问题。因此，作为最佳实践，持有持久化关联的成员变量应始终初始化：\n\
    \n"
