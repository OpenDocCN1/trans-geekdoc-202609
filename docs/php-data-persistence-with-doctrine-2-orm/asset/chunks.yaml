    \ __construct()\n13 \t{\n14 \t\t$this->posts = new \\Doctrine\\Common\\Collections\\\
    ArrayCollection();\n15 \t}\n16 \n17 \t// [..]\n18 }\n```\n\n### 6.4 Many to many\
    \ relationship, unidirectional\n\nIn our demo app, one `User` may act in different\
    \ `Role`s with different access rights. Let’s distinguish between base- and pro-users\
    \ and administrators. `User` with the base `Role` can read `Post`s, but can’t\
    \ write `Post`s. Pro-users can also write `Post`s. Administrators can manage the\
    \ overall application and various settings. We design the relationship in a way,\
    \ that from given a `User` entity, we can access the `User`’s `Role`s, but not\
    \ the other way round. To do so, we simply need to add the following persistence\
    \ configuration:\n\n```\n 1 <?php\n 2 namespace Entity;\n 3 \n 4 /**\n 5 * @Entity\n\
    \ 6 * @Table(name=\"users\")\n 7 */\n 8 class User\n 9 {\n10 \t// [..]\n11 \t\n\
    12 \t/**\n13 \t* @ManyToMany(targetEntity=\"Entity\\Role\")\n14 \t**/\n15 \tprivate\
    \ $roles;\n16 \t\n17 \t// [..]\n18 }\n```\n\nThe `Role` entity definitions are\
    \ straight forward as well:\n\n```\n 1 <?php\n 2 namespace Entity;\n 3 \n 4 /**\n\
    \ 5 * @Entity\n 6 * @Table(name=\"role\")\n 7 */\n 8 class Role\n 9 {\n10 \t/**\n\
    11 \t* @Id @Column(type=\"integer\")\n12 \t* @GeneratedValue\n13 \t*/\n14 \tprivate\
    \ $id;\n15 \n16 \t/** @Column(type=\"string\") */\n17 \tprivate $label;\n18 \n\
    19 \tpublic function setId($id)\n20 \t{\n21 \t\t$this->id = $id;\n22 \t}\n23 \n\
    24 \tpublic function getId()\n25 \t{\n26 \t\treturn $this->id;\n27 \t}\n28 \n\
    29 \tpublic function setLabel($label)\n30 \t{\n31 \t\t$this->label = $label;\n\
    32 \t}\n33 \n34 \tpublic function getLabel()\n35 \t{\n36 \t\treturn $this->label;\n\
    37 \t}\n38 }\n```\n\nRunning the schema tool creating the data structure in the\
    \ database, we now have a new table called `role`:\n\n| Col || Type || Length\
    \ || NULL? || KEY || Extras |\n\n| --- | --- | --- | --- | --- | --- |\n\n| id\
    \ || INT || 11 ||   || PRI || auto\\_increment |\n\n| --- | --- | --- | --- |\
    \ --- | --- |\n\n| label || VARCHAR || 255 ||   ||   ||   |\n\nAlso, we find a\
    \ table called `user_role` allowing to persist a many to many reference:\n\n|\
    \ Col || Type || Length || NULL? || KEY || Extras |\n\n| --- | --- | --- | ---\
    \ | --- | --- |\n\n| user\\_id || INT || 11 ||   || MUL ||   |\n\n| --- | ---\
    \ | --- | --- | --- | --- |\n\n| role\\_id || INT || 11 ||   || MUL ||   |\n\n\
    The reason for the fact that the join table shown above looks like it does, is\
    \ that Doctrine 2 again has a default configuration applied for the `@JoinTable`\
    \ annotation, which itself is not given with our code, but which implicitly is\
    \ considered by Doctrine 2. If needed, our join table can be defined differently,\
    \ e.g. if an existing data structure in a database needs to be used:\n\n```\n\
    \ 1 <?php\n 2 namespace Entity;\n 3 \n 4 /**\n 5 * @Entity\n 6 * @Table(name=\"\
    users\")\n 7 */\n 8 class User\n 9 {\n10 \t// [..]\n11 \t\n12 \t/**\n13 \t* @ManyToMany(targetEntity=\"\
    Entity\\Role\")\n14 \t* @JoinTable(name=\"users_roles\",\n15 \t*      joinColumns={@JoinColumn(name=\"\
    user\", referencedColumnName=\"id\")},\n16 \t*      inverseJoinColumns={@JoinColumn(name=\"\
    role\",\n17 \t*\t\t\treferencedColumnName=\"id\")\n18 \t*\t\t}\n19 \t* )\n20 \t\
    **/\n21 \tprivate $roles;\n22 \t\n23 \t// [..]\n24 }\n```\n\nThe persistence configuration\
    \ now looks way more complex and tells Doctrine to deal with a join table that\
    \ looks like this:\n\n| Col || Type || Length || NULL? || KEY || Extras |\n\n\
    | --- | --- | --- | --- | --- | --- |\n\n| user || INT || 11 ||   || MUL ||  \
    \ |\n\n| --- | --- | --- | --- | --- | --- |\n\n| role || INT || 11 ||   || MUL\
    \ ||   |\n\nThe `@JoinTable` annotation has an attribute called `name` to define\
    \ the join table name as well as the attributes `joinColumns` and `inverseJoinColumns`,\
    \ which both utilize another annotation called `@JoinColumn` to map the individual\
    \ columns.\n\n### 6.5 Many to many relationship, bidirectional\n\nThe author of\
    \ a `Post` (a `User`) should be able to assign one or more `Tag`s. A `Tag` itself\
    \ may be re-used in different `Post`s. In contrast to the relationship betweens\
    \ a `User` and its `Role`s we design the association to be bidirectional. First,\
    \ let’s set up the new `Tag` entity:\n\n```\n 1 <?php\n 2 namespace Entity;\n\
    \ 3 \n 4 /**\n 5 * @Entity\n 6 * @Table(name=\"tag\")\n 7 */\n 8 class Tag\n 9\
    \ {\n10 \t/**\n11 \t* @Id @Column(type=\"integer\")\n12 \t* @GeneratedValue\n\
    13 \t*/\n14 \tprivate $id;\n15 \n16 \t/** @Column(type=\"string\") */\n17 \tprivate\
    \ $label;\n18 \t\n19 \t/**\n20 \t* @ManyToMany(targetEntity=\"Entity\\Post\",\
    \ mappedBy=\"tags\")\n21 \t*/\n22 \tprivate $posts;\n23 \n24 \tpublic function\
    \ __construct()\n25 \t{\n26 \t\t$this->posts = new \\Doctrine\\Common\\Collections\\\
    ArrayCollection();\n27 \t}\n28 \n29 \tpublic function setId($id)\n30 \t{\n31 \t\
    \t$this->id = $id;\n32 \t}\n33 \n34 \tpublic function getId()\n35 \t{\n36 \t\t\
    return $this->id;\n37 \t}\n38 \n39 \tpublic function setLabel($label)\n40 \t{\n\
    41 \t\t$this->label = $label;\n42 \t}\n43 \n44 \tpublic function getLabel()\n\
    45 \t{\n46 \t\treturn $this->label;\n47 \t}\n48 \t\n49 \tpublic function setPosts($posts)\n\
    50 \t{\n51 \t\t$this->posts = $posts;\n52 \t}\n53 \n54 \tpublic function getPosts()\n\
    55 \t{\n56 \t\treturn $this->posts;\n57 \t}\n58 }\n```\n\nThe `Post` entity needs\
    \ to be extended as well by a new member variable:\n\n```\n 1 <?php\n 2 namespace\
    \ Entity;\n 3 \n 4 /**\n 5 * @Entity\n 6 * @Table(name=\"posts\")\n 7 */\n 8 class\
    \ Post\n 9 {\n10 \t// [..]\n11 \n12 \t/**\n13 \t* @ManyToMany(targetEntity=\"\
    Entity\\Tag\", inversedBy=\"posts\")\n14 \t*/\n15 \tprivate $tags;\n16 \n17 \t\
    public function __construct()\n18 \t{\n19 \t\t$this->tags = new \\Doctrine\\Common\\\
    Collections\\ArrayCollection();\n20 \t}\n21 \n22 \t// [..]\n23 }\n```\n\nWhen\
    \ setting up a many to many relationship, one can choose freely the owning side.\n\
    \nThe schema tool once more creates the join table `post_tag` for us, if we run\
    \ the proper commands:\n\n| Col || Type || Length || NULL? || KEY || Extras |\n\
    \n| --- | --- | --- | --- | --- | --- |\n\n| post\\_id || INT || 11 ||   || MUL\
    \ ||   |\n\n| --- | --- | --- | --- | --- | --- |\n\n| tag\\_id || INT || 11 ||\
    \   || MUL ||   |\n\nAgain, defaults are applied here. If desired, the `@JoinTable`\
    \ annotation can be used to alter the labels of the table and its columns.\n\n\
    ### 6.6 One to many relationship, unidirectional\n\nA `User` can set up multiple\
    \ `Category`s for its `Post`s. We will use a unidirectional association for this\
    \ domain model aspect, which requires-in contract to the bidirectional one to\
    \ many relationship-a join table as well. Also, we need to use the `@ManyToMany`\
    \ annotation, even though we don’t set up a many to many annotation (this might\
    \ be somewhat confusing). With the help of a unique constraint, it finally results\
    \ in a one to many relationship. The `User` entity is extended by the `$categories`\
    \ member variable:\n\n```\n 1 <?php\n 2 namespace Entity;\n 3 \n 4 /**\n 5 * @Entity\n\
    \ 6 * @Table(name=\"users\")\n 7 */\n 8 class User\n 9 {\n10 \t// [..]\n11 \n\
    12 \t/**\n13 \t* @ManyToMany(targetEntity=\"Entity\\Category\")\n14 \t* @JoinTable(name=\"\
    users_categories\",\n15 \t*      joinColumns={@JoinColumn(name=\"user\", referencedColumnName=\"\
    id\")},\n16 \t*      inverseJoinColumns={@JoinColumn(name=\"category\",\n17 \t\
    * \t\treferencedColumnName=\"id\", unique=true)}\n18 \t* )\n19 \t*/\n20 \tprivate\
    \ $categories;\n21 \n22 \tpublic function __construct()\n23 \t{\n24 \t\t// [..]\n\
    25 \t\t$this->categories = new \\Doctrine\\Common\\Collections\\ArrayCollection();\n\
    26 \t}\n27 \n28 \tpublic function setCategories($categories)\n29 \t{\n30 \t\t\
    $this->categories = $categories;\n31 \t}\n32 \n33 \tpublic function getCategories()\n\
    34 \t{\n35 \t\treturn $this->categories;\n36 \t}\n37 \n38 \t// [..]\n39 }\n```\n\
    \nThe annotations and attributes used are already known from the many to many\
    \ relationship. New is just the `unique=true` configuration, which makes it a\
    \ one to many relationship. The `Category` entity is simple:"
