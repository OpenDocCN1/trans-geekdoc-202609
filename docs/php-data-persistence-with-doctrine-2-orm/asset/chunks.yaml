    \ Post\n 9 {\n10 \t/** @Column(type=\"string\") */\n11 \tprotected $imageUrl;\n\
    12 \n13 \t/**\n14 \t* @param mixed $imageUrl\n15 \t*/\n16 \tpublic function setImageUrl($imageUrl)\n\
    17 \t{\n18 \t\t$this->imageUrl = $imageUrl;\n19 \t}\n20 \n21 \t/**\n22 \t* @return\
