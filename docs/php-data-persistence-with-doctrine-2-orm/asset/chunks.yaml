    )\n 8 * @DiscriminatorColumn(name=\"discr\", type=\"string\")\n 9 * @DiscriminatorMap({\"\
    text\"=\"Post\",\"video\"=\"VideoPost\",\"image\"= \"ImagePost\"})\n10 */\n11\
    \ class Post\n12 {\n13 \t// member variables and associations shared between all\
