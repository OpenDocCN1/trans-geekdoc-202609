    \n\t/**\n\t * @return mixed\n\t */\n\tpublic function getVideoUrl()\n\t{\n\t\t\
    return $this->videoUrl;\n\t}\n}\n```\n\n当让 Doctrine 2 创建数据库架构时，我们将为这个层次结构得到三个表，而\
    \ `posts` 表保存主要信息：\n\n| Col | Type | Length | NULL? | KEY | Extras |\n| --- |\
    \ --- | --- | --- | --- | --- |\n| id | INT | 11 | | PRI | auto\\_increment |\n\
    | user\\_id | INT | 11 | YES | MUL | |\n| category\\_id | INT | 11 | YES | MUL\
    \ | |\n| title | VARCHAR | 255 | | | |\n| content | LONGTEXT | | | | |\n| discr\
    \ | VARCHAR | 255 | | | |\n\n`posts_video` 表仅保存该类型的特定信息：\n\n| Col | Type | Length\
    \ | NULL? | KEY | Extras |\n| --- | --- | --- | --- | --- | --- |\n| id | INT\
    \ | 11 | | PRI | |\n| videoUrl | VARCHAR | 255 | YES | | |\n\n`posts_image` 也是如此：\n\
    \n| Col | Type | Length | NULL? | KEY | Extras |\n| --- | --- | --- | --- | ---\
    \ | --- |\n| id | INT | 11 | | PRI | |\n| imageUrl | VARCHAR | 255 | YES | | |\n\
    \n通过评估外键引用，可以通过表连接重建 `ImagePost` 和 `VideoPost` 类型的实体。\n\n#### 5.4.3 映射超类\n\n最后，可以使用\
    \ *映射超类* 策略。与我们已经讨论的另外两种策略的主要区别在于，超类本身不能是实体。以上面的例子为例，这意味着类 `Post` 本身不能是实体。它只是将成员变量和关联继承给其子类。\n\
    \n要配置映射超类策略，需要将 `@MappedSuperclass` 注释添加到 `Post` 类：\n\n```php\n<?php\nnamespace\
    \ Entity;\n\n/** @MappedSuperclass */\nclass Post\n{\n\t// member variables and\
    \ associations shared between all types\n}\n```\n\n两个子类 `ImagePost` 和 `VideoPost`\
    \ 不需要更改。但是，应用映射超类策略后，我们无法再持久化 `Post` 类型的对象，这些对象主要由文本组成。我们可以通过添加另一个名为 `TextPost`\
    \ 的新类型来解决这个问题：\n\n```php\n<?php\nnamespace Entity;\n\n/**\n * @Entity\n * @Table(name=\"\
