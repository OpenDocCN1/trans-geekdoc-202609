    ```\n\nIt couldn’t be much easier - thank you, Doctrine 2! Before we add more\
    \ features to our demo app, we will now look at some basics concepts of Doctrine\
    \ 2.\n\n### 4.4 Core concepts at a glance\n\nBefore we deep-dive into the details\
    \ of Doctrine 2, let’s step back and look at its core concepts.\n\nWe already\
    \ defined an entity as an object with identity that is managed by Doctrine 2 and\
    \ persisted in a database. Entities are the domain objects of an application.\
    \ Saving entities and retrieving them from the database is essential to an application.\
    \ The term “entity” is used with two different meanings throughout this book:\
    \ On one hand, its used for single, persistent objects, on the other hand, its\
    \ used for PHP classes that act as a template for persistent objects. A persistent\
    \ object with Doctrine 2, an entity, always is in a specific state. This state\
    \ can be “NEW”, “MANAGED”, “DETACHED” or “REMOVED”. We will learn about this later\
    \ in the book.\n\nThe entity manager is Doctrine’s core object. As an application\
    \ developer, one does interact a lot with the entity manager. The entity manager\
    \ is responsible for persisting new entities, but also takes care of updating\
    \ and deleting them. Repositories are retrieved via the entity manager.\n\nSimply\
    \ speaking, a repository is a container for all entities of a specific type. It\
    \ allows to look-up entities via so-called *finder methods* or *finders*. Some\
    \ finders are available by default, others may be added manually if needed.\n\n\
    *Doctrine’s database access layer (DBAL)* is the foundation for the Doctrine 2\
    \ ORM library. It’s a stand-alone component that might be used even without using\
    \ Doctrine’s ORM capabilities. Technically, DBAL is a wrapper for PHP’s PDO extension\
    \ that makes dealing with databases even easier compared to PDO alone. However,\
    \ again, Doctrine 2 ORM makes dealing with databases even more easy compared to\
    \ DBAL alone.\n\n## 5 Defining entities\n\nWe already learned how easy it is to\
    \ map member variables to fields in a database table. Let’s take a look at how\
    \ this works exactly.\n\n### 5.1 Mapping formats\n\nIn general, mappings can be\
    \ defined using annotation within the entities itself, or with external XML or\
    \ YAML files. In terms of performance, there is no difference between the different\
    \ ways for implementing the mapping when using a cache. Therefore, using annotations\
    \ often is preferred, simply because it make coding easier-all the persistence\
    \ metadata is located in the same file. In the following examples, annotations\
    \ are used exclusively.\n\n### 5.2 Mapping objects to tables\n\nFirst of all,\
    \ a class that acts as a template for persistent objects needs to get the `Entity`\
    \ annotation:\n\n```\n1 <?php\n2 /**\n3 * @Entity\n4 */\n5 class User\n6 {\n7\
    \ \t// [..]\n8 }\n```"
