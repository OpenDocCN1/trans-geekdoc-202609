- raw: "Also, entities of type `VideoPost` aren’t organized in categories called channels.\
    \ We can overwrite the association like shown below:\n\n```\n 1 <?php\n 2 namespace\
    \ Entity;\n 3 \n 4 /**\n 5 * @Entity\n 6 * @Table(name=\"posts_video\")\n 7 *\
    \ @AssociationOverrides({\n 8 *     @AssociationOverride(name=\"category\",\n\
    \ 9 *         joinColumns=@JoinColumn(\n10 *              name=\"channel_id\"\
    , referencedColumnName=\"id\"\n11 *         )\n12 *     )\n13 * })\n14 */\n15\
    \ class VideoPost extends Post\n16 {\n17 \t// [..]\n18 }\n```\n\n## 6 References\
    \ between Entities\n\nEntities usually are part of a bigger, interconnected object\
    \ graph. They have references to other entities. A `User` holds references to\
    \ its `Post`s, while a `Post` references a `Category` which reference back to\
    \ the `User` who set the `Category` up and so forth. As we will see in the following,\
    \ there are a lot of different ways to establish connections between entities.\
    \ Connections are characterized by the number of items they connect and the association’s\
    \ direction. Let’s take a look!\n\n| ![information](images/leanpub_information.png)\
    \ || \n\n#### Domain model of the demo app Talking\n\nThe following code samples\
    \ are related to the domain model of the demo app introduced earlier in the book.\
    \ The drawing of the domain model might be helpful as a reference throughout this\
    \ chapter. |\n\n| --- | --- |\n\n### 6.1 One to one relationship, unidirectional\n\
    \nIn contrast to foreign key relationships in a database, joining two tables in\
    \ both directions always, this is not true for objects. Therefore, Doctrine 2\
    \ differentiates between unidirectional and bidirectional associations between\
    \ objects. Unidirectional means that one objects points to the other, but the\
    \ latter does not have a pointer back.\n\nTo set up this type of a relationship\
    \ between two entities, one simply needs to pick a member variable acting as the\
    \ pointer:\n\n```\n 1 <?php\n 2 namespace Entity;\n 3 \n 4 /**\n 5 * @Entity\n\
    \ 6 * @Table(name=\"users\")\n 7 */\n 8 class User\n 9 {\n10 \t// [..]\n11 \n\
    12 \t/**\n13 \t* @OneToOne(targetEntity=\"Entity\\ContactData\")\n14 \t*/\n15\
    \ \tprivate $contactData;\n16 \t\n17 \t// [..]\n18 }\n```\n\nThe `@OneToOne` annotation\
    \ defines the type of the relationship-a one to one relationship. The `targetEntity`\
    \ attribute defines the entity class the pointer references to. The class given\
    \ with the `targetEntity` attribute needs to be fully qualified including a namespace\
    \ if applicable. In any case, one must not add a leading backslash.\n\nIt’s now\
    \ already possible to reach a referenced entity (`ContactData`) through a loaded\
    \ `User`, if a getter method has been added as well beforehand:\n\n```\n1 <?php\n\
    2 var_dump($user->getContactData());\n```\n\nHowever, the simple persistence configuration\
    \ shown above only works because `ContactData` has a member variable called `id`:\n\
    \n```\n 1 <?php\n 2 namespace Entity;\n 3 \n 4 /**\n 5 * @Entity\n 6 * @Table(name=\"\
    contact_data\")\n 7 */\n 8 class ContactData\n 9 {\n10 \t/**\n11 \t* @Id @Column(type=\"\
    integer\")\n12 \t* @GeneratedValue\n13 \t*/\n14 \tprivate $id;\n15 \t\n16 \t//\
    \ [..]\n17 }\n```\n\nIf the member variable has a different name, like `contactDataId`\
    \ or something similar, one needs to tell Doctrine 2 about it:\n\n```\n 1 <?php\n\
    \ 2 namespace Entity;\n 3 \n 4 /**\n 5 * @Entity\n 6 * @Table(name=\"users\")\n\
    \ 7 */\n 8 class User\n 9 {\n10 \t// [..]\n11 \n12 \t/**\n13 \t* @OneToOne(targetEntity=\"\
    Entity\\ContactData\")\n14 \t* @JoinColumn(name=\"id\", referencedColumnName=\"\
    contactDataId\")\n15 \t*/\n16 \tprivate $contactData;\n17 \t\n18 \t// [..]\n19\
    \ }\n```\n\nLater in this book, we will learn more about the details of the `@JoinColumn`\
    \ annotation.\n\nLoading a `User` and its `ContactData`-like shown above-only\
    \ works, if the data structure in the database has also been set up beforehand,\
    \ in addition to the PHP class and the persistence configuration. If not, all\
    \ this won’t work and errors are reported by Doctrine 2. Based on the situation,\
    \ one of the following will be true:\n\n*   We have an existing data structure\
    \ given in the database and we adapt the persistence configuration to it.\n\n\
