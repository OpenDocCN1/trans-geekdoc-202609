    \ ||   |\n\n| --- | --- | --- | --- | --- | --- |\n\n| videoUrl || VARCHAR ||\
    \ 255 || YES ||   ||   |\n\nThe same is true for `posts_image`:\n\n| Col || Type\
    \ || Length || NULL? || KEY || Extras |\n\n| --- | --- | --- | --- | --- | ---\
    \ |\n\n| id || INT || 11 ||   || PRI ||   |\n\n| --- | --- | --- | --- | --- |\
    \ --- |\n\n| imageUrl || VARCHAR || 255 || YES ||   ||   |\n\nBy evaluating the\
    \ foreign key reference, entities of type `ImagePost` and `VideoPost` can be re-constructed\
    \ by table joins.\n\n#### 5.4.3 Mapped Superclass\n\nLastly, a *mapped superclass*\
    \ strategy can be used. The main difference to the other two strategies we already\
    \ discussed, is that the superclass itself cannot be an entity. Taken the example\
    \ above, this means that class `Post` cannot be an entity itself. It simply inherits\
    \ member variables and associations to its subclasses.\n\nTo configure the mapped\
    \ superclass strategy means adding the `@MappedSuperclass` annotation to the `Post`\
    \ class:\n\n```\n1 <?php\n2 namespace Entity;\n3 \n4 /** @MappedSuperclass */\n\
    5 class Post\n6 {\n7 \t// member variables and associations shared between all\
    \ types\n8 }\n```\n\nBoth subclasses, `ImagePost` and `VideoPost` do not need\
    \ to be changed. However, with the Mapped Superclass strategy applied, we cannot\
    \ persist objects of type `Post` anymore, which mainly consist of text. We could\
    \ fix this by adding another new type called `TextPost`:\n\n```\n 1 <?php\n 2\
    \ namespace Entity;\n 3 \n 4 /**\n 5 * @Entity\n 6 * @Table(name=\"posts_text\"\
    )\t\n 7 */\n 8 class TextPost extends Post\n 9 {\n10 \t/**\n11 \t* @Id @Column(type=\"\
    integer\")\n12 \t* @GeneratedValue\n13 \t*/\n14 \tprotected $id;\n15 \n16 } \n\
    ```\n\nNow we have three concrete entity types and one superclass not being an\
    \ entity. This results in three tables in the database: `posts_text`, `posts_images`\
    \ and `posts_video`.\n\nAs shown above, it’s important that each entity has its\
    \ ID column specified, while the mapped superclass does not. It only inherits\
    \ member variables and associations, but not the ID column definition.\n\nWhen\
    \ inheriting attributes or associations like shown above, one may want to overwrite\
    \ certain definitions.\n\nLet assume we don’t want to talk about `content` in\
