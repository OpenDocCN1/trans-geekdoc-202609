- raw: "In the `UserInfo` entity we define the target entity class via `targetEntity=\"\
    Entity\\User\"` and let Doctrine 2 know by adding `mappedBy=\"contactData\"`,\
    \ that the `User` entity references back via `contactData`.\n\nSo far, so good!\
    \ We just established a bidirectional connection between two entities. Let’s now\
    \ talk about the `inversedBy` and `mappedBy` configuration.\n\nFor a moment, let’s\
    \ image there exists a `User` entity and a `UserInfo` entity, both belonging together\
    \ and pointing to each other in a bidirectional manner: `$userInfo` points to\
    \ a `UserInfo` instance and `$user` points to a `User` instance. We if now want\
    \ to disconnect the two, we remove both pointers:\n\n```\n1 <?php\n2 // [..]\n\
    3 $user = $em->getRepository('Entity\\User')->findOneById($id);\n4 $user->getUserInfo()->setUser(null);\n\
    5 $user->setUserInfo(null);\n6 $em->flush();\n```\n\nBut what if we only remove\
    \ one of the two pointers existing? Actually, we would create an inconsistency.\
    \ Which reference tells Doctrine 2 the truth about the two objects and their association?\
    \ One entity says “yes, we are connected”, the other says “no, we aren’t connected\
    \ at all”. Remember that this problem only exists in the object oriented world,\
    \ not in the relational database universe. In a relational database, references\
    \ are always bidirectional. There is no concept of a unidirectional relationship.\
    \ Back to the inconsistency issue: Which entity should Doctrine 2 listen two when\
    \ taking care of persistence? The solutions looks like this: In doubt, Doctrine\
    \ 2 listens to the entity, which carries the `inversedBy` attribute. This means\
    \ that the following code would not remove the association between the two entities:\n\
    \n```\n1 <?php\n2 // [..]\n3 $user = $em->getRepository('Entity\\User')->findOneById($id);\n\
    4 $user->getUserInfo()->setUser(null);\n5 $em->flush();\n```\n\nIn contract, the\
    \ following code would remove the association:\n\n```\n1 <?php\n2 // [..]\n3 $user\
    \ = $em->getRepository('Entity\\User')->findOneById($id);\n4 $user->setUserInfo(null);\n\
    5 $em->flush();\n```\n\nThe reason is that the `User` entity has the `inversedBy`\
    \ attribute and acts as the so-called *owning side* of the connection. The owning\
    \ side is the side Doctrine 2 listens to while determining if a connection exists\
    \ or not. The other side, the so-called *inverse side* doesn’t matter here. Doctrine\
    \ 2 doesn’t care about what the inverse side says.\n\nHowever, even if we correctly\
    \ cut the connection between the two from the owning side, this change is durable\
    \ only after flushing:\n\n```\n1 <?php\n2 use Doctrine\\ORM\\EntityManager;\n\
    3 // [..]\n4 $em = EntityManager::create($dbParams, $config);\n5 $em->flush();\n\
    ```\n\nAs long as no flushing happend, we have still have an inconsistency in\
    \ the running program:\n\n```\n1 <?php\n2 $user = $em->getRepository('Entity\\\
    User')->findOneById($id);\n3 $userInfo = $user->getUserInfo();\n4 $user->setUserInfo(null);\n\
    5 var_dump($user->getUserInfo()); // NULL\n6 var_dump($userInfo->getUser()); //\
    \ object(Entity\\User)\n7 $em->flush();\n8 var_dump($user->getUserInfo()); //\
    \ NULL\n9 var_dump($userInfo->getUser()); // NULL\n```\n\nOnly once `$em->flush()`\
    \ has been executed will `var_dump($userInfo->getUser())` finally return `NULL`.\
    \ Before that, it still returns the referenced object. In some cases, this situation\
    \ may lead to difficult-to-debug issues. A good advice here is to always make\
    \ sure that both references are removed simultaneously so that even the running\
    \ program stays intact:\n\n```\n 1 <?php\n 2 namespace Entity;\n 3 \n 4 /**\n\
    \ 5 * @Entity\n 6 * @Table(name=\"users\")\n 7 */\n 8 class User\n 9 {\n10 \t\
    // [..]\n11 \n12 \tpublic function removeUserInfo()\n13 \t{\n14 \t\t$this->userInfo->setUser(null);\n\
    15 \t\t$this->userInfo = null;\n16 \t}\t\n17 }\n```\n\nThe following code now\
    \ always deals with a consistent state:\n\n```\n1 <?php\n2 $user = $em->getRepository('Entity\\\
    User')->findOneById($id);\n3 $userInfo = $user->getUserInfo();\n4 $user->removeUserInfo();\n\
    5 var_dump($user->getUserInfo()); // NULL\n6 var_dump($userInfo->getUser()); //\
    \ NULL\n7 $em->flush();\n8 var_dump($user->getUserInfo()); // NULL\n9 var_dump($userInfo->getUser());\
    \ // NULL\n```\n\nAs a good practice, one should always add a persistence supporting\
    \ method on the owning side.\n\nLet’s recap: A bidirectional relationship always\
    \ has an owning side and an inverse side. Unidirectional relationships only have\
    \ an owning side, which also does not need to be declared explicitly. Regarding\
    \ associations, only chances to the owning side are relevant for persistence.\
    \ Doctrine 2 doesn’t care about the inverse side in this concern. The data base\
    \ table of the entity declared as the owning side holds the foreign key. Which\
    \ side of the connection is defined as the owning side is decidable by the application\
    \ developer.\n\nGiven a bidirectional association, the owning side can be identified\
    \ by spotting the `inversedBy` attribute, while the inverse side carries the `mappedBy`\
    \ attribute.\n\n### 6.3 One to many relationship, bidirectional\n\nIn chapter\
    \ “Hello, Doctrine 2!”, we added a bidirectional one to many relationship to the\
    \ demo app between a `User` and its `Post`s. Again, let’s take a close look at\
    \ how we got that working. The `User` entity has a member variable called `$posts`:\n\
    \n```\n 1 <?php\n 2 namespace Entity;\n 3 \n 4 /**\n 5 * @Entity\n 6 * @Table(name=\"\
    users\")\n 7 */\n 8 class User\n 9 {\n10 \t/**\n11 \t* @OneToMany(targetEntity=\"\
    Entity\\Post\", mappedBy=\"user\")\n12 \t*/\n13 \tprivate $posts;\n14 \t\n15 \t\
    // [..]\n16 }\n```\n\nThe `@OneToMany` annotation defines the one to many relationship\
    \ to the `Post` entity (`targetEntity`). As the `mappedBy` attribute is given,\
    \ it’s a bidirectional relationship. The `Post` entity looks like this:\n\n```\n\
    \ 1 <?php\n 2 namespace Entity;\n 3 \n 4 /**\n 5 * @Entity\n 6 * @Table(name=\"\
    posts\")\n 7 */\n 8 class Post\n 9 {\n10 \t/**\n11 \t* @ManyToOne(targetEntity=\"\
    Entity\\User\", inversedBy=\"posts\")\n12 \t*/\n13 \tprivate $user;\n14 \t\n15\
    \ \t// [..]\n16 }\n```\n\nHere we find the counterpart annotation `@ManyToOne`.\
    \ In a one to one relationship, the application developer can decide freely which\
    \ side to declare as the owning side. This isn’t the case here. The entity carrying\
    \ the `@ManyToOne` annotation must become the owning side and get the `inversedBy`\
    \ attribute.\n\nIf again the schema tool is used to create the data structure\
    \ based on the persistence configuration, the following tables are set up:\n\n\
    | Col || Type || Length || NULL? || KEY || Extras |\n\n| --- | --- | --- | ---\
    \ | --- | --- |\n\n| id || INT || 11 ||   || PRI || auto\\_increment |\n\n| ---\
    \ | --- | --- | --- | --- | --- |\n\n| first\\_name || VARCHAR || 255 || Y ||\
    \   ||   |\n\n| last\\_name || VARCHAR || 255 || Y ||   ||   |\n\n| gender ||\
    \ INT || 11 || Y ||   ||   |\n\n| name\\_prefix || VARCHAR || 255 || Y ||   ||\
    \   |\n\n| contactData\\_id || INT || 11 || Y || UNI ||   |\n\n| userInfo\\_id\
    \ || INT || 11 || Y || UNI ||   |\n\nThe table `user_info` looks like this:\n\n\
    | Col || Type || Length || NULL? || KEY || Extras |\n\n| --- | --- | --- | ---\
    \ | --- | --- |\n\n| id || INT || 11 ||   || PRI ||   |\n\n| --- | --- | --- |\
    \ --- | --- | --- |\n\n| user\\_id || INT || 11 ||   || MUL ||   |\n\n| title\
    \ || VARCHAR || 255 ||   ||   ||   |\n\n| content || VARCHAR || 255 ||   ||  \
    \ ||   |\n\nAs we can see, table `user_info` holds the foreign key, which may\
    \ occur more than once. When accessing a `User`’s `Post`s from a given `User`\
    \ entity, Doctrine uses a `Doctrine\\ORM\\PersistentCollection` to provide the\
    \ referenced `Post` entities. It extends other classes such as `\\Countable`,\
    \ `\\IteratorAggregate` and `\\ArrayAccess`, which makes a `Doctrine\\ORM\\PersistentCollection`\
    \ very similar to a regular PHP array, meaning it can easily be used e.g. in PHP\
    \ foreach loops.\n\nAs long as the referenced `Post`s haven’t been accessed at\
    \ least once, the member variable `$user` has value `null` and not yet an object\
    \ of class `Doctrine\\ORM\\PersistentCollection` assigned. If once wants to work\
    \ with the collection, before it has been set up by Doctrine 2, this could be\
    \ an issue. Therefore, as a good practice, a member variable holding a persistent\
    \ association should always be initialized:"
