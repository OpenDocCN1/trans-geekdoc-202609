    \ and `onClear`, additional events are triggered that are persistence related,\
    \ but are not specific to a single entity.\n\nWith these events available, one\
    \ may hook into persistence processing, with a so-called `lifecycle callback`,\
    \ which are implemented as a method of an entity class.\n\nLet’s assume we want\
    \ to add login data for each `User` to our demo application. While the username\
    \ can be picked be the user, the password is auto-generated on signup. This can\
    \ be achieved by adding a lifecycle callback to the `User` class:\n\n```\n 1 <?php\n\
    \ 2 namespace Entity;\n 3 \n 4 /**\n 5 * @Entity\n 6 * @HasLifecycleCallbacks\n\
    \ 7 * @Table(name=\"users\")\n 8 */\n 9 class User\n10 {\n11 \t// [..]\n12 \n\
    13 \tconst GENERATED_PASSWORD_LENGTH = 6;\n14 \n15 \t// [..]\n16 \n17 \t/** @PrePersist\
    \ */\n18 \tpublic function generatePassword()\n19 \t{\n20 \t\tfor($i = 1; $i <=\
    \ self::GENERATED_PASSWORD_LENGTH; $i++) {\n21 \t\t\t$this->password .= chr(rand(65,\
    \ 90)); // 65 -> A, 90 -> Z\n22 \t\t}\n23 \t}\n24 }\n```\n\n首先，我们需要通过使用 `@HasLifecycleCallbacks`\
    \ 注解来声明存在生命周期回调。然后，我们将生命周期注解 `@PrePersist` 添加到 `generatePassword()` 方法。就这样！现在，在持久化新实体之前，此方法会自动调用，并且\
    \ `User` 的密码会自动生成。\n\n### 7.8 级联操作\n\n创建新实体或修改现有实体时，默认情况下所有操作仅影响单个实体。一个强大但有些危险的功能是定义“操作级联”的选项。让我们考虑以下示例。如果我们在演示应用程序中删除一个\
    \ `User`，我们也希望删除其所有 `Post`s。这可以通过在关联定义中添加 `cascade` 属性来实现：\n\n```\n 1 <?php\n\
    \ 2 namespace Entity;\n 3 \n 4 /**\n 5 * @Entity\n 6 * @HasLifecycleCallbacks\n\
    \ 7 * @Table(name=\"users\")\n 8 */\n 9 class User\n10 {\n11 \t// [..]\n12  \n\
    13 \t/**\n14 \t* @OneToMany(targetEntity=\"Entity\\Post\", mappedBy=\"user\",\
    \ cascade={\"remove\"})\n15 \t*/\n16 \tprivate $posts; \n17 \n18 \t// [..]\n19\
    \ }\n```\n\n现在，当通过以下方式删除用户时：\n\n```\n1 <?php\n2 $user = $em->getRepository('Entity\\\
    User')->find($id);\n3 $em->remove($user);\n4 $em->flush();\n```\n\n`User` 将被删除，其所有\
    \ `Post`s 也将被删除。当将 `cascade` 设置为值 `all` 时，级联也将应用于其他操作，例如 `persist`。\n\n添加 `cascade`\
    \ 属性时，侧面很重要。在上面显示的代码中，当删除 `User` 时，所有引用的 `Post` 实体都会被删除。当将 `cascade` 添加到 `Post`\
    \ 实体（如以下代码所示）时，如果引用的 `Post` 实体之一被删除，则会删除 `User` 实体：\n\n```\n 1 <?php\n 2 namespace\
    \ Entity;\n 3 \n 4 /**\n 5 * @Entity(repositoryClass=\"Repository\\Post\")\n 6\
    \ * @Table(name=\"posts\")\n 7 */\n 8 class Post\n 9 {\n10 \t// [..]\n11 \n12\
    \ \t/**\n13 \t* @ManyToOne(targetEntity=\"Entity\\User\", inversedBy=\"posts\"\
    , cascade={\"remove\"})\n14 \t* @JoinColumn(name=\"user_id\", referencedColumnName=\"\
    id\")\n15 \t*/\n16 \tprotected $user;\n17 \t\n18 \t// [..]\n19 }\n```\n\n假设这不是所需的行为，验证级联配置以防止数据丢失至关重要。\n\
    \n实现上述所示引用实体自动删除的另一种方法是针对一对一和一对多关联的 `orphan removal`。孤儿删除意味着 Doctrine 2 将自动删除没有父实体的引用实体：\n\
    \n```\n 1 /**\n 2 * @Entity\n 3 * @HasLifecycleCallbacks\n 4 * @Table(name=\"\
    users\")\n 5 */\n 6 class User\n 7 {\n 8 \t// [..]\n 9  \n10 \t/**\n11 \t* @OneToMany(targetEntity=\"\
    Entity\\Post\", mappedBy=\"user\", orphanRemoval=true)\n12 \tprivate $posts; \n\
    13 \n14 \t// [..]\n15 }\n```\n\n同样，当 `User` 消失时，其所有 `Post`s 也将消失。\n\n虽然级联操作很有用，但可能代价高昂。原因是引用实体上的所有操作都在\
    \ RAM 中发生。它们首先会从数据库加载和重建，然后进行修改。取决于集合的大小，这可能会消耗大量资源。\n\n幸运的是，Doctrine 2 还通过 `@JoinColumn`\
    \ 注解为更新和删除提供了“数据库级别”的级联操作：\n\n```\n 1 <?php\n 2 namespace Entity;\n 3 \n 4 /**\n\
    \ 5 * @Entity(repositoryClass=\"Repository\\Post\")\n 6 * @Table(name=\"posts\"\
    )\n 7 */\n 8 class Post\n 9 {\n10 \t/**\n11 \t* @ManyToOne(targetEntity=\"Entity\\\
    User\", inversedBy=\"posts\")\n12 \t* @JoinColumn(name=\"user_id\", referencedColumnName=\"\
    id\", onDelete=\"CASCADE\")\n13 \t*/\n14 \tprotected $user;  \n15 \t\n16 \t//\
    \ [..]\n17 }\n```\n\n### 7.9 事务\n\n事务是一个或多个数据库语句的原子单元。只要对实体管理器调用了 `flush()` 方法，通过实体管理器执行的所有插入、更新或删除操作都会排队。从技术上讲，队列是所谓的\
    \ `unit of work` 模式的实现。当调用 `flush()` 时，工作单元中的所有排队操作都会作为单个事务针对数据库执行。如果这些操作中有一个失败，Doctrine\
    \ 2 会自动回滚整个事务——即所有排队的操作——并主要退出自身，以防止因不一致导致数据丢失。\n\nDoctrine 2 提供了一种方便的方法，将多个数据库操作包装到单个事务中。以下代码演示了如何在演示应用程序中“重置”\
    \ `User`。首先，删除现有的 `User`，然后使用其当前的名和姓创建一个新的 `User`：\n\n```\n 1 <?php\n 2 // [..]\n\
    \ 3 $em->transactional(function($em) {\n 4 \t$oldUser = $em->getRepository('Entity\\\
    User')->find(1);\n 5 \t$newUser = new Entity\\User();\n 6 \t$newUser->setFirstName($oldUser->getFirstname());\n\
    \ 7 \t$newUser->setLastName($oldUser->getLastname());\n 8 \t$em->persist($newUser);\n\
    \ 9 \t$em->remove($oldUser);\n10 });\n```\n\n只有在没有为其中任何操作抛出异常的情况下，两个操作才会生效。否则，两个操作都会被回滚。\n\
    \n当两个或更多人同时处理同一组数据时，可能会出现另一个问题，这并不罕见，例如对于 Web 应用程序。Doctrine 2 完全支持一种称为 `optimistic\
    \ locking` 的策略。乐观锁背后的核心思想是，多个用户都可以读取数据集，但是，每当更改数据时，只有第一个写入者有权持久化其更改。所有其他用户现在正在使用实体的过时版本，当尝试持久化其各自的更改时，会收到异常。由于该策略允许并发读取操作并仅控制写入操作，与悲观锁策略相比，读密集型应用程序不会变慢。\n\
    \n要实现乐观锁，Doctrine 2 允许向实体添加特殊的 `integer` 或 `datetime` 版本字段。该字段的当前值与之前加载的值进行比较，如果在写入时不匹配，则会抛出\
    \ `OptimisticLockException`。如果发生这种情况，则另一个用户在此期间已修改了实体。可以通过添加 `@Version` 注解来设置版本字段：\n\
    \n```\n 1 <?php\n 2 namespace Entity;\n 3 \n 4 /**\n 5 * @Entity(repositoryClass=\"\
    Repository\\Post\")\n 6 * @Table(name=\"posts\")\n 7 */\n 8 class Post\n 9 {\n\
    10 \t// [..]\n11 \t\n12 \t/** @Version @Column(type=\"integer\") */\n13 \tprotected\
    \ $version;\n14 \t\n15 \t// [..]\n16 }\n```\n\n通过 Doctrine 2 创建相应的数据架构时，会向 `posts`\
    \ 表添加一个名为 `version` 的列。对于每个新的 `Post` 实体，Doctrine 2 会自动分配值 `1`。每次后续修改，该值都会加一：\n\
    \n```\n1 $post = $em->getRepository('Entity\\Post')->find(1);\n2 $post->setTitle(\"\
    New title\");\n3 $em->flush();\n4 $em->clear();\n5 $post = $em->getRepository('Entity\\\
    Post')->find(1);\n6 $post->setTitle(\"Again, a new title\");\n7 $em->flush();\
    \  \n```\n\n"
