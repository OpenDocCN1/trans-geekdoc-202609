    **Listing 1.1**\n\n这里有趣的是方法 `assembleDisplayName()`。它根据用户的数据为用户创建“显示名称”。显示名称用于打印帖子的作者。代码\n\
    \n```php\n<?php\ninclude('../entity/User.php');\n\n$user = new Entity\\User();\n\
    $user->setFirstName('Max');\n$user->setLastName('Mustermann');\n$user->setGender(0);\n\
    $user->setNamePrefix('Prof. Dr');\n\necho $user->assembleDisplayName();\n```\n\
    \n**Listing 1.2**\n\n结果为\n\n```\n1 Mr. Prof. Dr. Max Mustermann\n```\n\n因此，方法\
    \ `assembleDisplayName()` 定义了 `User` 对象的特定行为。\n\n如果用户的主数据从数据库中检索，则必须以一种方式进行转换，使上述行为附加到它上面。换句话说：从数据库中检索的用户主数据必须转换为\
    \ `User` 对象，因为在应用程序中，我们主要总是想要处理我们领域的对象，并通过简单调用其 `assembleDisplayName()` 方法来轻松创建用户的显示名称。让我们将此构建到我们的\
    \ ORM 工具中。\n\n首先，我们设置数据库结构：\n\n```sql\nCREATE TABLE users(\n\tid int(10) NOT NULL\
    \ auto_increment, \n\tfirst_name varchar(50) NOT NULL,\n\tlast_name varchar(50)\
    \ NOT NULL, \n\tgender ENUM('0','1') NOT NULL,\n\tname_prefix varchar(50) NOT\
    \ NULL,\n\tPRIMARY KEY (id)\n);\n```\n\n然后，让我们为“Max Mastermann”（顺便说一句，这是德国的“John\
    \ Doe”）添加虚拟数据：\n\n```sql\nINSERT INTO users (first_name, last_name, gender, name_prefix)\n\
    VALUES('Max', 'Mustermann', '0', 'Prof. Dr.');\n```\n\n现在，如果我们想要从数据库重建 `User`\
    \ 对象，可以这样做：\n\n```php\n<?php\ninclude('../entity/User.php');\n\n$db = new \\PDO('mysql:host=localhost;dbname=app',\
    \ 'root', '');\n$userData = $db->query('SELECT * FROM users WHERE id = 1')->fetch();\n\
    \n$user = new Entity\\User();\n$user->setId($userData['id']);\n$user->setFirstName($userData['first_name']);\n\
    $user->setLastName($userData['last_name']);\n$user->setGender($userData['gender']);\n\
    $user->setNamePrefix($userData['name_prefix']);\n\necho $user->assembleDisplayName();\n\
    ```\n\n| ![information](img/leanpub_information.png) || \n\n#### 数据库凭据在生产系统中\n\
    \n在生产系统中，你使用强关键字并且不使用用户“root”，对吧？上面显示的代码只是一个示例 … |\n\n| --- | --- |\n\n通过这些代码行，我们开始实现自己的\
    \ ORM 系统，该系统允许通过从数据库获取数据来重建领域对象。让我们进一步改进它。\n\n为了封装上面显示的“数据映射”，我们将代码移动到其自己的类中：\n\
    \n```php\n<?php\nnamespace Mapper;\n\nclass User\n{\n\tprivate $mapping = array(\n\
    \t\t'id' => 'id',\n\t\t'firstName' => 'first_name',\n\t\t'lastName' => 'last_name',\n\
    \t\t'gender' => 'gender',\n\t\t'namePrefix' => 'name_prefix'\n\t);\n\n\tpublic\
    \ function populate($data, $user)\n\t{\n\t\t$mappingsFlipped = array_flip($this->mapping);\n\
    \n\t\tforeach($data as $key => $value) {\n\t\t\tif(isset($mappingsFlipped[$key]))\
    \ {\n\t\t\t\tcall_user_func_array(\n\t\t\t\t\tarray($user, 'set'. ucfirst($mappingsFlipped[$key])),\n\
    \t\t\t\t\tarray($value)\n\t\t\t\t);\n\t\t\t}\n\t\t}\n\n\t\treturn $user;\n\t}\n\
    }\n```\n\n它并不完美，但能完成工作。现在，我们的调用代码看起来像这样：\n\n```php\n<?php\ninclude_once('../entity/User.php');\n\
    include_once('../mapper/User.php');\n\n$db = new \\PDO('mysql:host=localhost;dbname=app',\
    \ 'root', '');\n$userData = $db->query('SELECT * FROM users WHERE id = 1')->fetch();\n\
    \n$user = new Entity\\User();\n$userMapper = new Mapper\\User();\n$user = $userMapper->populate($userData,\
    \ $user);\n\necho $user->assembleDisplayName();\n```\n\n但是，我们可以通过将 SQL 语句移动到其自己的对象（即所谓的\
    \ *repository*）来使其更加简单：\n\n```php\n<?php\nnamespace Repository;\n\ninclude_once('../entity/User.php');\n\
    include_once('../mapper/User.php');\n\nuse Mapper\\User as UserMapper;\nuse Entity\\\
    User as UserEntity;\n\nclass User\n{\n\tprivate $em;\n\tprivate $mapper;\n\n\t\
    public function __construct($em)\n\t{\n\t\t$this->mapper = new UserMapper;\n\t\
    \t$this->em = $em;\n\t}\n\n\tpublic function findOneById($id)\n\t{\n\t\t$userData\
    \ = $this->em\n\t\t\t->query('SELECT * FROM users WHERE id = ' . $id)\n\t\t\t\
    ->fetch();\n    \n\t\treturn $this->mapper->populate($userData, new UserEntity());\n\
    \t}\n}\n```\n\n最后，我们将连接到数据库的代码移动到名为 `EntityManager` 的类中，并通过它使新的 `User` 仓库可用：\n\
    \n```php\n<?php\n\ninclude_once('../repository/User.php');\n\nuse Repository\\\
    User as UserRepository;\n\nclass EntityManager\n{\n\tprivate $host;\n\tprivate\
    \ $db;\n\tprivate $user;\n\tprivate $pwd;\n\tprivate $connection;\n\tprivate $userRepository;\n\
    \n\tpublic function __construct($host, $db, $user, $pwd)\n\t{\n\t\t$this->host\
    \ = $host;\n\t\t$this->user = $user;\n\t\t$this->pwd = $pwd;\n\n\t\t$this->connection\
    \ = new \\PDO(\n\t\t\t\"mysql:host=$host;dbname=$db\", \n\t\t\t$user, \n\t\t\t\
    $pwd);\n\n\t\t$this->userRepository = null;\n\t}\n\n\tpublic function query($stmt)\n\
    \t{\n\t\treturn $this->connection->query($stmt);\n\t}\n\n\tpublic function getUserRepository()\n\
    \t{\n\t\tif (!is_null($this->userRepository)) {\n\t\t\treturn $this->userRepository;\n\
    \t\t} else {\n\t\t\t$this->userRepository = new UserRepository($this);\n\t\t\t\
    return $this->userRepository;\n\t\t}\n\t}\n}\n```\n\n实体管理器现在充当主入口点——它打开数据库连接并使数据库查询可用于客户端代码。重构后，结果仍然保持不变：\n\
    \n```\n1 Mr. Prof. Dr. Max Mustermann\n```\n\n"
