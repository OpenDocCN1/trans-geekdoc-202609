  trans: "\n\n### 6.4 多对多关系，单向\n\n在我们的演示应用中，一个 `User` 可能拥有不同的 `Role`s，并拥有不同的访问权限。让我们区分基础用户、专业用户和管理员。拥有基础\
    \ `Role` 的 `User` 可以读取 `Post`s，但不能写入 `Post`s。专业用户也可以写入 `Post`s。管理员可以管理整个应用程序和各种设置。我们设计关系的方式是，从给定的\
    \ `User` 实体，我们可以访问 `User` 的 `Role`s，但不能反过来。为此，我们只需添加以下持久化配置：\n\n```php\n<?php\n\
    namespace Entity;\n\n/**\n * @Entity\n * @Table(name=\"users\")\n */\nclass User\n\
    {\n\t// [..]\n\t\n\t/**\n\t* @ManyToMany(targetEntity=\"Entity\\Role\")\n\t**/\n\
    \tprivate $roles;\n\t\n\t// [..]\n}\n```\n\n`Role` 实体的定义也很简单：\n\n```php\n<?php\n\
    namespace Entity;\n\n/**\n * @Entity\n * @Table(name=\"role\")\n */\nclass Role\n\
    {\n\t/**\n\t* @Id @Column(type=\"integer\")\n\t* @GeneratedValue\n\t*/\n\tprivate\
    \ $id;\n\n\t/** @Column(type=\"string\") */\n\tprivate $label;\n\n\tpublic function\
    \ setId($id)\n\t{\n\t\t$this->id = $id;\n\t}\n\n\tpublic function getId()\n\t\
    {\n\t\treturn $this->id;\n\t}\n\n\tpublic function setLabel($label)\n\t{\n\t\t\
    $this->label = $label;\n\t}\n\n\tpublic function getLabel()\n\t{\n\t\treturn $this->label;\n\
    \t}\n}\n```\n\n运行架构工具在数据库中创建数据结构后，我们现在有一个名为 `role` 的新表：\n\n| Col | Type | Length\
    \ | NULL? | KEY | Extras |\n| --- | --- | --- | --- | --- | --- |\n| id | INT\
    \ | 11 | | PRI | auto_increment |\n| label | VARCHAR | 255 | | | |\n\n此外，我们发现一个名为\
    \ `user_role` 的表，允许持久化多对多引用：\n\n| Col | Type | Length | NULL? | KEY | Extras |\n\
    | --- | --- | --- | --- | --- | --- |\n| user_id | INT | 11 | | MUL | |\n| role_id\
    \ | INT | 11 | | MUL | |\n\n上述连接表看起来是这样的原因是 Doctrine 2 为 `@JoinTable` 注解应用了默认配置，而该注解在我们的代码中未给出，但\
    \ Doctrine 2 会隐式考虑它。如果需要，我们的连接表可以定义得不同，例如，如果需要使用数据库中现有的数据结构：\n\n```php\n<?php\n\
    namespace Entity;\n\n/**\n * @Entity\n * @Table(name=\"users\")\n */\nclass User\n\
    {\n\t// [..]\n\t\n\t/**\n\t* @ManyToMany(targetEntity=\"Entity\\Role\")\n\t* @JoinTable(name=\"\
    users_roles\",\n\t*      joinColumns={@JoinColumn(name=\"user\", referencedColumnName=\"\
    id\")},\n\t*      inverseJoinColumns={@JoinColumn(name=\"role\",\n\t*\t\t\treferencedColumnName=\"\
    id\")\n\t*\t\t}\n\t* )\n\t**/\n\tprivate $roles;\n\t\n\t// [..]\n}\n```\n\n持久化配置现在看起来复杂得多，并告诉\
    \ Doctrine 处理一个看起来像这样的连接表：\n\n| Col | Type | Length | NULL? | KEY | Extras |\n\
    | --- | --- | --- | --- | --- | --- |\n| user | INT | 11 | | MUL | |\n| role |\
    \ INT | 11 | | MUL | |\n\n`@JoinTable` 注解有一个名为 `name` 的属性来定义连接表名称，以及 `joinColumns`\
    \ 和 `inverseJoinColumns` 属性，这两个属性都利用另一个名为 `@JoinColumn` 的注解来映射各个列。\n\n### 6.5\
    \ 多对多关系，双向\n\n`Post` 的作者（一个 `User`）应该能够分配一个或多个 `Tag`s。一个 `Tag` 本身可以在不同的 `Post`s\
    \ 中重复使用。与 `User` 和其 `Role`s 之间的关系不同，我们将关联设计为双向。首先，让我们设置新的 `Tag` 实体：\n\n```php\n\
    <?php\nnamespace Entity;\n\n/**\n * @Entity\n * @Table(name=\"tag\")\n */\nclass\
    \ Tag\n{\n\t/**\n\t* @Id @Column(type=\"integer\")\n\t* @GeneratedValue\n\t*/\n\
    \tprivate $id;\n\n\t/** @Column(type=\"string\") */\n\tprivate $label;\n\t\n\t\
    /**\n\t* @ManyToMany(targetEntity=\"Entity\\Post\", mappedBy=\"tags\")\n\t*/\n\
    \tprivate $posts;\n\n\tpublic function __construct()\n\t{\n\t\t$this->posts =\
    \ new \\Doctrine\\Common\\Collections\\ArrayCollection();\n\t}\n\n\tpublic function\
    \ setId($id)\n\t{\n\t\t$this->id = $id;\n\t}\n\n\tpublic function getId()\n\t\
    {\n\t\treturn $this->id;\n\t}\n\n\tpublic function setLabel($label)\n\t{\n\t\t\
    $this->label = $label;\n\t}\n\n\tpublic function getLabel()\n\t{\n\t\treturn $this->label;\n\
    \t}\n\t\n\tpublic function setPosts($posts)\n\t{\n\t\t$this->posts = $posts;\n\
    \t}\n\n\tpublic function getPosts()\n\t{\n\t\treturn $this->posts;\n\t}\n}\n```\n\
    \n`Post` 实体也需要通过一个新的成员变量进行扩展：\n\n```php\n<?php\nnamespace Entity;\n\n/**\n * @Entity\n\
    \ * @Table(name=\"posts\")\n */\nclass Post\n{\n\t// [..]\n\n\t/**\n\t* @ManyToMany(targetEntity=\"\
    Entity\\Tag\", inversedBy=\"posts\")\n\t*/\n\tprivate $tags;\n\n\tpublic function\
    \ __construct()\n\t{\n\t\t$this->tags = new \\Doctrine\\Common\\Collections\\\
    ArrayCollection();\n\t}\n\n\t// [..]\n}\n```\n\n在设置多对多关系时，可以自由选择拥有方。\n\n如果我们运行适当的命令，架构工具再次为我们创建连接表\
    \ `post_tag`：\n\n| Col | Type | Length | NULL? | KEY | Extras |\n| --- | --- |\
    \ --- | --- | --- | --- |\n| post_id | INT | 11 | | MUL | |\n| tag_id | INT |\
    \ 11 | | MUL | |\n\n这里同样应用了默认值。如果需要，可以使用 `@JoinTable` 注解来更改表及其列的标签。\n\n### 6.6\
    \ 一对多关系，单向\n\n一个 `User` 可以为其 `Post`s 设置多个 `Category`s。我们将为这个领域模型方面使用单向关联，这与双向一对多关系不同，也需要一个连接表。此外，我们需要使用\
    \ `@ManyToMany` 注解，尽管我们并没有设置多对多注解（这可能有点令人困惑）。借助唯一约束，最终结果是一对多关系。`User` 实体通过 `$categories`\
    \ 成员变量进行扩展：\n\n```php\n<?php\nnamespace Entity;\n\n/**\n * @Entity\n * @Table(name=\"\
    users\")\n */\nclass User\n{\n\t// [..]\n\n\t/**\n\t* @ManyToMany(targetEntity=\"\
    Entity\\Category\")\n\t* @JoinTable(name=\"users_categories\",\n\t*      joinColumns={@JoinColumn(name=\"\
    user\", referencedColumnName=\"id\")},\n\t*      inverseJoinColumns={@JoinColumn(name=\"\
    category\",\n\t* \t\treferencedColumnName=\"id\", unique=true)}\n\t* )\n\t*/\n\
    \tprivate $categories;\n\n\tpublic function __construct()\n\t{\n\t\t// [..]\n\t\
    \t$this->categories = new \\Doctrine\\Common\\Collections\\ArrayCollection();\n\
    \t}\n\n\tpublic function setCategories($categories)\n\t{\n\t\t$this->categories\
    \ = $categories;\n\t}\n\n\tpublic function getCategories()\n\t{\n\t\treturn $this->categories;\n\
    \t}\n\n\t// [..]\n}\n```\n\n使用的注解和属性已在多对多关系中已知。新的只是 `unique=true` 配置，它使其成为一对多关系。`Category`\
    \ 实体很简单：\n\n"
