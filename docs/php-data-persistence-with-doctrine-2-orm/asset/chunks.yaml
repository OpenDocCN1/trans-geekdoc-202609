- raw: "```\n 1 <?php\n 2 namespace Entity;\n 3 \n 4 /**\n 5 * @Entity\n 6 * @Table(name=\"\
    category\")\n 7 */\n 8 class Category\n 9 {\n10 \t/**\n11 \t* @Id @Column(type=\"\
    integer\")\n12 \t* @GeneratedValue\n13 \t*/\n14 \tprivate $id;\n15 \n16 \t/**\
    \ @Column(type=\"string\") */\n17 \tprivate $label;\n18 \n19 \tpublic function\
    \ setId($id)\n20 \t{\n21 \t\t$this->id = $id;\n22 \t}\n23 \n24 \tpublic function\
    \ getId()\n25 \t{\n26 \t\treturn $this->id;\n27 \t}\n28 \n29 \tpublic function\
    \ setLabel($label)\n30 \t{\n31 \t\t$this->label = $label;\n32 \t}\n33 \n34 \t\
    public function getLabel()\n35 \t{\n36 \t\treturn $this->label;\n37 \t}\n38 }\n\
    ```\n\n### 6.7 Many to one relationship, unidirectional\n\nMultiple posts can\
    \ be grouped in a `Category`, but every `Post` can only be in one `Category`.\
    \ To allow access to a `Category` from a `Post`, the `Post` must be extended:\n\
    \n```\n 1 <?php\n 2 namespace Entity;\n 3 \n 4 /**\n 5 * @Entity\n 6 * @Table(name=\"\
    posts\")\n 7 */\n 8 class Post\n 9 {\n10 \n11 \t// [..]\n12 \n13 \t/**\n14 \t\
    * @ManyToOne(targetEntity=\"Entity\\Category\")\n15 \t* @JoinColumn(name=\"category_id\"\
    , referencedColumnName=\"id\")\n16 \t**/\n17 \tprivate $category;\n18 \n19 \t\
    // [..]\n20 \n21 \tpublic function setCategory($category)\n22 \t{\n23 \t\t$this->category\
    \ = $category;\n24 \t}\n25 \n26 \tpublic function getCategory()\n27 \t{\n28 \t\
    \treturn $this->category;\n29 \t}\n30 }\n```\n\nAnd that’s it-nothing more configuration\
    \ is needed, as it’s a unidirectional association. The `Category` doesn’t need\
    \ to be extended as well. In fact, even the `@JoinColumn` annotation is redundant,\
    \ because its configuration is identical with Doctrine’s defaults.\n\n### 6.8\
    \ One to one relationship, self-referencing\n\nDoctrine 2 allows to define association\
    \ between entities of the same type, so-called “self-referencing” relations. In\
    \ our demo app a `User` can declare another `User` as its life partner. Both ends\
    \ of the association allow to access the referenced life partner. The persistence\
    \ configuration needed for a self-referencing association looks like this:\n\n\
    ```\n 1 <?php\n 2 namespace Entity;\n 3 \n 4 /**\n 5 * @Entity\n 6 * @Table(name=\"\
    users\")\n 7 */\n 8 class User\n 9 {\n10 \t/**\n11 \t* @OneToOne(targetEntity=\"\
    Entity\\User\")\n12 \t**/\n13 \tprivate $lifePartner;\n14 \n15 \t// [..]\n16 \n\
    17 \tpublic function setLifePartner($lifePartner)\n18 \t{\n19 \t\t$this->lifePartner\
    \ = $lifePartner;\n20 \t}\n21 \n22 \tpublic function getLifePartner()\n23 \t{\n\
    24     \treturn $this->lifePartner;\n25 \t}\n26 }\n```\n\nIf the database structure\
    \ is created by the schema tool, Doctrine 2 automatically adds a column called\
    \ `lifeParter_id` to the `users` table to maintain the reference. Again, Doctrine’s\
    \ defaults are at play here. If needed, one may add the `@JoinColumn` annotation\
    \ and overwrite the defaults:\n\n```\n 1 <?php\n 2 // [..]\n 3 \n 4 /**\t\n 5\
    \ * @OneToOne(targetEntity=\"Entity\\User\")\n 6 * @JoinColumn(name=\"partner\"\
    , referencedColumnName=\"id\")\n 7 **/\n 8 private $lifePartner;\n 9 \n10 // [..]\n\
    ```\n\n### 6.9 One to many relationship, self-referencing\n\nWith a self-referencing\
    \ one to many relationship, e.g. a category tree can be built. A `Category` may\
    \ have multiple child categories and one parent category (the root node won’t\
    \ have a parent category). The persistence configuration for a self-referencing\
    \ one to many relationship is similar to a regular bidirectional one to many relationship:\n\
    \n```\n 1 <?php\n 2 namespace Entity;\n 3 \n 4 /**\n 5 * @Entity\n 6 * @Table(name=\"\
    category\")\n 7 */\n 8 class Category\n 9 {\t\n10 \t/**\n11 \t* @OneToMany(targetEntity=\"\
    Entity\\Category\", mappedBy=\"parent\")\n12 \t**/\n13 \tprivate $children;\n\
    14 \n15 \t/**\n16 \t* @ManyToOne(targetEntity=\"Entity\\Category\", inversedBy=\"\
    children\")\n17 \t* @JoinColumn(name=\"parent_id\", referencedColumnName=\"id\"\
    )\n18 \t**/\n19 \tprivate $parent;\n20 \n21 \t// [..]\n22 \n23 \tpublic function\
    \ __construct() {\n24 \t\t$this->children = new \\Doctrine\\Common\\Collections\\\
    ArrayCollection();\n25 \t}\n26 \n27 \tpublic function setParent($parent)\n28 \t\
    {\n29 \t\t$this->parent = $parent;\n30 \t}\n31 \n32 \tpublic function getParent()\n\
    33 \t{\n34 \t\treturn $this->parent;\n35 \t}\n36 \n37 \t// [..]\n38 }\n```\n\n\
    The configuration shown above extends table `category` by column `parent_id`,\
    \ if the already developed data structure again is extended using Doctrine’s schema\
    \ tool. The relationship is designed in a way, that allows to reach a parent and\
    \ children from a `Category` given.\n\n### 6.10 Many to many relationship, self-referencing\n\
    \nMany to many self-referencing relationships can be defined as well. In our demo\
    \ app, this type of a relationship is used to describe the social network of a\
    \ `User`:\n\n```\n 1 <?php\n 2 namespace Entity;\n 3 \n 4 /**\n 5 * @Entity\n\
    \ 6 * @Table(name=\"users\")\n 7 */\n 8 class User\n 9 {\n10 \t// [..]\n11 \t\n\
    12 \t/**\n13 \t* @ManyToMany(targetEntity=\"Entity\\User\")\n14 \t* @JoinTable(name=\"\
    friends\",\n15 \t*      joinColumns={@JoinColumn(name=\"user_id\",\n16 \t* \t\t\
    \treferencedColumnName=\"id\")},\n17 \t*      inverseJoinColumns={@JoinColumn(name=\"\
    friend_user_id\",\n18 \t*\t\t\treferencedColumnName=\"id\")}\n19 \t* )\n20 \t\
    **/\n21 \tprivate $myFriends;\n22 \n23 \tpublic function __construct()\n24 \t\
    {\n25 \t\t// [..]\n26 \t\t$this->myFriends = new \\Doctrine\\Common\\Collections\\\
    ArrayCollection();\n27 \t}\n28 \n29 \t// [..]\n30 \t\n31 \tpublic function setMyFriends($myFriends)\n\
    32 \t{\n33 \t\t$this->myFriends = $myFriends;\n34 \t}\n35 \n36 \tpublic function\
    \ getMyFriends()\n37 \t{\n38 \t\treturn $this->myFriends;\n39 \t}\n40 }\n```\n\
    \nIf once more the schema tool is applied, it will report an error here, because\
    \ Doctrine 2 wants to label both columns of the join table with “user\\_id”, which\
    \ is invalid. In this case, one will need to add the `@JoinTable` annotation to\
    \ provide a different persistence configuration. Also, by default, the join table\
    \ will be called `users_users`, if not defined otherwise. In our case, we tell\
    \ Doctrine 2 to call it `friends`, a more meaningful table naming in our case.\
    \ If one deals with an existing data structure, custom configuration would be\
    \ necessary anyway.\n\n## 7 Managing Entities\n\n### 7.1 Creating a new Entity\n\
    \nOnce the domain model is modeled, it is time for using it. A new entity can\
    \ simply be created based on a new object of an entity class:\n\n```\n1 <?php\n\
    2 $newPost = new \\Entity\\Post();\n3 $newPost->setTitle('A new post!');\n4 $newPost->setContent('This\
    \ is the body of the new post.');\n5 $em->persist($newPost);\n6 $em->flush();\n\
    ```\n\nThe code shown above anticipates that `$em` references a ready-to-use entity\
    \ manager. First, a new `Post` is created, then data is assigned and then the\
    \ object is passed to the entity manager for persistence.\n\nOne must remember\
    \ that the `persist()` method call does not yet cause an SQL INSERT statement\
    \ to be issued. The entity only is scheduled for persistence with the next flushing.\
    \ As long as no flushing took place, the entity is in a state called `MANAGED`-meaning\
    \ that the entity manager recognizes the new entity and from now.\n\nOnly once\
    \ the `flush()` method is invoked on the entity manager, a new record is written\
    \ to the database. Otherwise, the entity will be lost after the script has finished.\n\
    \n### 7.2 Loading an existing Entity\n\nMainly, there are two different ways to\
    \ load an existing entity: Either by querying and retrieving it from its corresponding\
    \ repository or by accessing it through an association given by another, already\
    \ loaded entity.\n\n#### 7.2.1 Using a repository\n\nWe already learned that a\
    \ repository is a container for all entity of a specific type. A repository is\
    \ decorated by finder methods to search entities based on a query. While several\
    \ finder methods are available out-of-the-box, custom finder methods can also\
    \ be added later on. A custom finder method can be imagined as a “quick access”\
    \ to a typical query. With the help of finder methods, once can look-up an entity,\
    \ e.g. by its ID like this:\n\n```\n1 <?php\n2 $post = $em->getRepository('Entity\\\
    Post')->findOneById($id);\n```\n\nFirst we request the repository from the entity\
    \ manager and then execute a finder method on it. By default, four finder methods\
    \ are available. To find a single entity based on its ID, the `find()` method\
    \ is used:"
