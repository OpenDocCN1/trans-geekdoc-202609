    \ {\n 35 \t\t\t\tcall_user_func_array(\n 36 \t\t\t\t\tarray($user, 'set'. ucfirst($mappingsFlipped[$key])),\n\
    \ 37 \t\t\t\t\tarray($value)\n 38 \t\t\t\t);\n 39 \t\t\t}\n 40 \t\t}\n \n 42 \t\
    \treturn $user;\n 43 \t}\n 44 }\n```\n\n这就是我们从对象中提取数据的方式。实体管理器，通过一个 `saveUser()`\
    \ 方法扩展，现在可以将新记录插入数据库：\n\n```\n 1 <?php\n 2 \n 3 include_once('../repository/User.php');\n\
    \ 4 include_once('../mapper/User.php');\n 5 \n 6 use Repository\\User as UserRepository;\n\
    \ 7 use Mapper\\User as UserMapper;\n 8 \n 9 class EntityManager\n10 {\n11 \t\
    private $host;\n12 \tprivate $db;\n13 \tprivate $user;\n14 \tprivate $pwd;\n15\
    \ \tprivate $connection;\n16 \tprivate $userRepository;\n \n 18 \tpublic function\
    \ __construct($host, $db, $user, $pwd)\n 19 \t{\n 20 \t\t$this->host = $host;\n\
    \ 21 \t\t$this->user = $user;\n 22 \t\t$this->pwd = $pwd;\n 23 \t\t\n 24 \t\t\
    $this->connection = \n 25 \t\t\tnew \\PDO(\"mysql:host=$host;dbname=$db\", $user,\
    \ $pwd);\n 26 \t\t\n 27 \t\t$this->userRepository = null;\n 28 \t}\n \n 30 \t\
    public function query($stmt)\n 31 \t{\n 32 \t\treturn $this->connection->query($stmt);\n\
    \ 33 \t}\n \n 35 \tpublic function saveUser($user)\n 36 \t{\n 37 \t\t$userMapper\
    \ = new UserMapper();\n 38 \t\t$data = $userMapper->extract($user);\n 39 \t\t\
    $columnsString = implode(\", \", array_keys($data));\n \n 41 \t\t$valuesString\
    \ = implode(\n 42 \t\t\t\"', \n 43 \t\t\t'\", \n 44 \t\t\tarray_map(\"mysql_real_escape_string\"\
    , $data)\n 45 \t\t);\n \n 47 \t\treturn $this->query(\n 48 \t\t\t\"INSERT INTO\
    \ users ($columnsString) VALUES('$valuesString')\"\n 49 \t\t);\n 50 \t}\n \n 52\
    \ \tpublic function getUserRepository()\n 53 \t{\n 54 \t\tif (!is_null($this->userRepository))\
    \ {\n 55         \treturn $this->userRepository;\n 56 \t\t} else {\n 57 \t\t\t\
    $this->userRepository = new UserRepository($this);\n 58 \t\t\treturn $this->userRepository;\n\
    \ 59 \t\t}\n 60 \t}\n 61 }\n```\n\n现在添加新记录的工作方式如下：\n\n```\n 1 <?php\n 2 include_once('../EntityManager.php');\n\
    \ 3 $em = new EntityManager('localhost', 'app', 'root', '');\n 4 $user = $em->getUserRepository()->findOneById(1);\n\
    \ 5 echo $user->assembleDisplayName() . '<br />';\n 6 \n 7 $newUser = new Entity\\\
    User();\n 8 $newUser->setFirstName('Ute');\n 9 $newUser->setLastName('Musermann');\n\
    10 $newUser->setGender(1);\n11 $em->saveUser($newUser);\n12 \n13 echo $newUser->assembleDisplayName();\n\
    ```\n\n到目前为止，一切顺利！但是如果我们想要更新现有记录呢？如何识别我们正在处理的是新记录还是现有记录？在我们的例子中，我们可能只需检查对象是否已经为\
    \ `id` 字段赋值。它是一个“自增”字段，MySQL 会为任何新记录自动填充它。当然，这不是人们能想到的最优雅的方法。我们可以使用所谓的 `identity\
    \ map`，它带来更多优势：在不再次查询数据库的情况下重新读取已加载的数据库。身份映射主要只是一个关联数组，用于根据 ID 保存对已加载实体的引用。身份映射的一个好位置是实体管理器及其\
    \ `saveUser()` 方法：\n\n```\n 1 <?php\n 2 \n 3 include_once('../repository/User.php');\n\
    \ 4 include_once('../mapper/User.php');\n 5 \n 6 use Repository\\User as UserRepository;\n\
    \ 7 use Mapper\\User as UserMapper;\n 8 \n 9 class EntityManager\n10 {\n11 \t\
    private $host;\n12 \tprivate $db;\n13 \tprivate $user;\n14 \tprivate $pwd;\n15\
    \ \tprivate $connection;\n16 \tprivate $userRepository;\n17 \tprivate $identityMap;\n\
    \ \n 19 \tpublic function __construct($host, $db, $user, $pwd)\n 20 \t{\n 21 \t\
    \t$this->host = $host;\n 22 \t\t$this->user = $user;\n 23 \t\t$this->pwd = $pwd;\n\
    \ 24 \t\t\n 25 \t\t$this->connection = \n 26 \t\t\tnew \\PDO(\"mysql:host=$host;dbname=$db\"\
    , $user, $pwd);\n 27 \t\t\n 28 \t\t$this->userRepository = null;\n 29 \t\t$this->identityMap\
    \ = array('users' => array());\n 30 \t}\n \n 32 \tpublic function query($stmt)\n\
    \ 33 \t{\n 34 \t\treturn $this->connection->query($stmt);\n 35 \t}\n \n 37 \t\
    public function saveUser($user)\n 38 \t{\n 39 \t\t$userMapper = new UserMapper();\n\
    \ 40 \t\t$data = $userMapper->extract($user);\n \n 42 \t\t$userId = call_user_func(\n\
    \ 43 \t\t\tarray($user, 'get'. ucfirst($userMapper->getIdColumn()))\n 44 \t\t\
    );\n \n 46 \t\tif (array_key_exists($userId, $this->identityMap['users'])) {\n\
    \ 47         \t$setString = '';\n \n 49 \t\t\tforeach ($data as $key => $value)\
    \ {\n 50 \t\t\t\t$setString .= $key.\"='$value',\";\n 51 \t\t\t}\n \n 53 \t\t\t\
    return $this->query(\n 54 \t\t\t\t\"UPDATE users SET \" . substr($setString, 0,\
    \ -1) .\n 55 \t\t\t\t\" WHERE \" . $userMapper->getIdColumn() . \"=\" . $userId\n\
    \ 56 \t\t\t);\n \n 58 \t\t} else {\n 59 \t\t\t$columnsString = implode(\", \"\
    , array_keys($data));\n 60 \t\t\t$valuesString = implode(\n 61 \t\t\t\t\"', \n\
    \ 62 \t\t\t\t'\", \n 63 \t\t\t\tarray_map(\"mysql_real_escape_string\", $data)\n\
    \ 64 \t\t\t);\n \n 66 \t\t\treturn $this->query(\n 67 \t\t\t\t\"INSERT INTO users\
    \ ($columnsString) VALUES('$valuesString')\"\n 68 \t\t\t);\n 69 \t\t}\n 70 \t\
    }\n \n 72 \tpublic function getUserRepository()\n 73 \t{\n 74 \t\tif (!is_null($this->userRepository))\
    \ {\n 75 \t\t\treturn $this->userRepository;\n 76 \t\t} else {\n 77 \t\t\t$this->userRepository\
    \ = new UserRepository($this);\n 78 \t\t\treturn $this->userRepository;\n 79 \t\
    \t}\n 80 \t}\n \n 82 \tpublic function registerUserEntity($id, $user)\n 83 \t\
    {\n 84 \t\t$this->identityMap['users'][$id] = $user;\n 85 \t\treturn $user;\n\
    \ 86 \t}\n 87 }\n```\n\n可以看出，我们还添加了一个 `getIdColumn()` 方法。它返回“id”。现在以下代码可以正常工作：\n\
    \n```\n1 <?php\n2 include_once('../EntityManager.php');\n3 $em = new EntityManager('localhost',\
    \ 'app', 'root', '');\n4 $user = $em->getUserRepository()->findOneById(1);\n5\
    \ echo $user->assembleDisplayName() . '<br />';\n6 \n7 $user->setFirstname('Moritz');\n\
    8 $em->saveUser($user); \n```\n\n实体在数据库中被更新，并且没有添加额外的记录。\n\n### 3.3 关联\n\n现在我们终于想要列出特定\
    \ `User` 的所有帖子。因此，我们想要简单地遍历 `User` 的 `Post`s 集合并打印每个 `Post` 的标题：\n\n```\n 1 <?php\n\
    \ 2 include_once('../EntityManager.php');\n 3 $em = new EntityManager('localhost',\
    \ 'app', 'root', '');\n 4 $user = $em->getUserRepository()->findOneById(1);\n\
    \ 5 ?>\n 6 <h1><?echo $user->assembleDisplayName(); ?></h1>\n 7 <ul>\n 8 <?php\
    \ foreach($user->getPosts() as $post) { ?>\n 9 <li><?php echo $post->getTitle();\
    \ ?></li>\n10 <?php } ?>\n11 </ul>\n```\n\n我们需要做什么才能实现这一点？\n\n首先，我们创建数据结构：\n\n\
    ```\n1 CREATE TABLE posts(\n2 \tid int(10) NOT NULL auto_increment, \n3 \tuser_id\
    \ int(10) NOT NULL,\n4 \ttitle varchar(255) NOT NULL, \n5 \tcontent text NOT NULL,\n\
    6 \tPRIMARY KEY (id)\n7 );\n```\n\n"
