    \ of the result set. However, when omitting the `'c'` in the `select` clause,\
    \ the `ContactData` object is not part of the result anymore, however, it can\
    \ still be used e.g. within the `where` clause:\n\n```\n<?php\n// [..]\n    \t\
    \ \n$qb = $this->_em->createQueryBuilder();\n\n$qb->select('u')\n\t->from('Entity\\\
    User', 'u')\n\t->leftJoin('u.contactData', 'c')\n\t->where($qb->expr()->eq('u.lastName',\
    \ '?1'))\n\t->andWhere($qb->expr()->eq('c.email', '?2'))\n\t->setParameter(1,\
    \ \"Mustermann\")\n\t->setParameter(2, \"max.mustermann@example.com\");\n\n$users\
    \ = $qb->getQuery()->getResult();\n```\n\n## 9 Command line tools\n\nDoctrine\
    \ 2 ships with powerful command line support. The command line tools can broadly\
    \ be divided into DBAL-related and ORM-related operations. Via the `list` command,\
    \ a list of all commands available can be printed:\n\n```\n$ ./doctrine list\n\
    ```\n\nThe `help` command-or the command parameter `--help` in conjunction with\
    \ other commands-prints the instructions for a command given. For example, if\
    \ we need help dealing with the `orm:info` command, we can ask for help like that:\n\
    \n```\n$ ./doctrine orm:info --help\n```\n\nAlso will work:\n\n```\n$ ./doctrine\
    \ help orm:info\n```\n\nBoth commands print the identical output to the console.\n\
    \n### 9.1 Setting up the command line tools\n\nBefore Doctrine 2 can be used on\
    \ the command line, some basic configuration code is needed. The command line\
    \ tools require-like the application itself-a ready-to-go database connection\
    \ and entity manager-if ORM-related commands are needed.\n\nThe configuration\
    \ of the command line tools first looks somewhat strange-Doctrine 2 requires that\
    \ a file called `cli-config.php` exists within the folder, in which the tools\
    \ are executed on the command line. If Doctrine 2 was installed using Composer,\
    \ the command line tools are located in `vendor/bin`. Therefore, this is the place\
    \ where a file called `cli-config.php` needs to be set up with the following basic\
    \ code:\n\n```\n<?php\ninclude '../../vendor/autoload.php';\n\nuse Doctrine\\\
    ORM\\Tools\\Setup;\nuse Doctrine\\ORM\\EntityManager;\n\n$paths = array(__DIR__\
    \ . \"/../../entity/\");\n$isDevMode = true;\n\n$dbParams = array(\n\t'driver'\
    \   => 'pdo_mysql',\n\t'user'     => 'root',\n\t'password' => '',\n\t'dbname'\
    \   => 'app',\n);\n\n$config = Setup::createAnnotationMetadataConfiguration($paths,$isDevMode);\n\
    $em = EntityManager::create($dbParams, $config);\n\n$helperSet = new \\Symfony\\\
    Component\\Console\\Helper\\HelperSet(array(\n'db' => new \\Doctrine\\DBAL\\Tools\\\
    Console\\Helper\\ConnectionHelper(\n\t$em->getConnection()\n),\n'em' => new \\\
    Doctrine\\ORM\\Tools\\Console\\Helper\\EntityManagerHelper(\n\t$em\n)\n)); \n\
    ```\n\nThe code shown above is similar to the `index.php` file used in the demo\
    \ app. First, autoloading is configured, then the entity manager is instantiated.\
    \ If both clients-web application and command line tools-share the same credentials,\
    \ externalizing this data may be helpful.\n\nIf now the command line tools are\
    \ invoked, Doctrine 2 automatically includes the `cli-config.php` file and also\
    \ looks for a so-called *helper set* defined in the global namespace. The *helper\
    \ set* provides the command line tools with the database connection via key `db`\
    \ (needed for the DBAL commands) as well as the entity manager via key `em` (needed\
    \ for the ORM commands).\n\n### 9.2 DBAL commands\n\n#### 9.2.1 Execute an SQL\
    \ statement\n\nSQL commands can easily be executed via the command line with Doctrine’s\
    \ command line tooling. The command `dbal:run-sql` requires a single parameter,\
    \ a valid SQL statement:\n\n```\n$ ./doctrine dbal:run-sql \"SELECT * FROM users;\"\
    \n```\n\nThe result of the query is printed to the console.\n\n#### 9.2.2 Import\
    \ SQL files\n\nIf one needs to execute multiple statements, importing a SQL file\
    \ might be a great option via the `./doctrine dbal:import` command. It takes one\
    \ or more paths to SQL files, delimited by space:\n\n```\n$ ./doctrine dbal:import\
    \ /tmp/import-data.sql\n```\n\n### 9.3 ORM commands\n\n#### 9.3.1 Validate persistence\
    \ configuration\n\nOne of the most helpful commands is `orm:validate-schema`.\
    \ It validates the current persistence configuration and also makes sure it matches\
    \ the existing data schema in the database. If all is good, the following command\
    \ prints a positive message to the console:\n\n```\n$ ./doctrine orm:validate-schema\n\
    > [Mapping]  OK - The mapping files are correct.\n> [Database] OK - The database\
    \ schema is in sync with the mapping files.\n```\n\nThe command `orm:info` prints\
    \ an overview of the application entities known to Doctrine:\n\n```\n$ ./doctrine\
    \ orm:info\n> Found 2 mapped entities:\n> [OK]   Entity\\Post\n> [OK]   Entity\\\
    User\n```\n\n#### 9.3.2 The Schema Tool\n\nWith the help of the commands\n\n*\
    \ `orm:schema-tool:create`,\n* `orm:schema-tool:drop` and\n* `orm:schema-tool:update`\n\
    \none can manipulate a database data schema based on the entity persistence configuration.\
    \ However, when running these commands, nothing actually happens-it’s just a “dry\
    \ run”. If the commands are executed with parameter `--dump-sql` again only a\
    \ dry run occurs, however, this time, the schema tool prints all SQL statements,\
    \ which would otherwise have been fired against the database, to the screen. Only\
    \ if one uses the parameter `--force`, the schema tool finally executes the statements:\n\
    \n```\n$ ./doctrine orm:schema-tool:drop --force\n```\n"
