    \       type = \"text\"\n *         )\n *     )\n * })\n */\nclass VideoPost extends\
    \ Post\n{\n\t// [..]\n}\n```\n\n虽然 Doctrine 2 要求成员变量必须是 `private` 或 `protected`，但重要的是要记住，这里成员变量需要是\
