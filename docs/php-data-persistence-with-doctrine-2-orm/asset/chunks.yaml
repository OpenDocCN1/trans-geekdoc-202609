  trans: "\n\n### 1.4 本书使用的约定\n\n代码清单会高亮显示并带有行号。以 `$` 符号开头的清单代表命令行，以 `>` 符号开头的行代表命令输出。新术语在首次出现时使用\
    \ *斜体* 表示。\n\n### 1.5 给亚马逊客户的重要通知\n\n如果您在亚马逊购买了本书，目前要确保自动收到所有更新会有些困难。为避免问题，请发送一封简短的邮件，主题行写上“Updates\
    \ Doctrine 2 book”，发送至 mail@michael-romer.de。这样一来，您可以确保始终拥有本书的最新版本。作为对您努力的感谢，您还将额外获得本书的\
    \ PDF 和 EPUB 版本。\n\n## 2 简介\n\n### 2.1 面向对象编程（OOP）与领域模型\n\n如今，PHP 开发者大多以面向对象的方式思考和编码。应用程序功能是使用类、对象、方法、继承以及其他面向对象技术构建的。起初，OOP\
    \ 主要用于应用程序的一般技术方面，例如 MVC 框架或日志和邮件库。所有这些组件或多或少都可以“原样”用于所有应用程序，无论应用程序处于什么领域：电子商务、门户或社区网站。对于复杂系统，以及当可维护性和可扩展性等方面很重要时，在领域特定代码中使用\
    \ OOP 也是一种优势。主要来说，每个应用程序都由两种不同类型的代码组成：一般技术代码和领域特定代码。一般技术代码通常作为库或框架构建时是可重用的，而领域特定代码通常过于定制，无法重用。\n\
    \n面向对象的领域特定代码的特征在于存在所谓的 *领域模型*。领域模型主要意味着：\n\n*   类和对象代表领域的主要概念，即所谓的 *实体*（严格来说，这些元素也可以是\
    \ *值对象*，但与实体相比，值对象没有持久标识）。在在线商店中，主要元素将是“客户”、“订单”、“产品”、“购物车”等等。\n\n*   领域特定的类和对象之间可能存在关联。同样，在在线商店中，“订单”通常至少引用一个“客户”，以及一个或多个引用所订购的“产品”。\n\
    \n*   领域特定的函数作为实体的一部分实现。在在线商店中，“购物车”通常有一个 `calculateTotalPrice()` 方法，用于根据购物车中的商品及其数量计算最终价格。\n\
    \n*   跨越多个实体的函数通常在所谓的 *服务* 中实现，仅仅是因为它们无法明确分配给单个实体。同样，在在线商店中，“结账”服务可能负责降低库存、开票、更新订单历史等。该服务一次处理多个不同的实体。\n\
    \n*   尽可能使用领域特定对象，而不是通用数据容器，如 PHP 数组（这里例外证明规则）。\n\n*   尽可能在应用程序的领域对象中实现业务逻辑（如业务规则），而不是在例如控制器中（控制器用于基于\
    \ MVC 的框架中处理用户输入）。\n\n领域模型的主要优势在于将领域特定代码集中在定义的类和对象中，支持维护和更改。在更改或扩展代码时，意外破坏功能的可能性会降低。通过将领域特定代码与一般技术代码隔离，支持可移植性。例如，在从一个应用程序框架迁移到另一个框架时，这很有帮助。\n\
    \n除了上述优势，领域模型还支持团队合作。通常，在构建和推出新软件产品时，除了程序员，业务和营销人员也会参与其中。领域模型可以通过统一使用的术语，弥合业务与\
    \ IT 之间的思维差距。仅凭这一点，领域模型就无价之宝。\n\n### 2.2 演示应用程序\n\n具体示例能让事物更容易理解。在本书中，名为“Talking”的演示应用程序将帮助将理论付诸实践。Talking\
    \ 是一个（简单的）Web 应用程序，允许用户在线发布内容。该应用程序的领域模型如下：\n\n![Demo application \"Talking\"\
    \ - Domain Model](img/domain-model-talking.jpeg)\n\nDemo application “Talking”\
    \ - Domain Model\n\n一个 `User` 可以写 `Post`s。一个 `Post` 始终只有一个作者，且两个实体互相引用。一个 `User`\
    \ 可以担任一个或多个 `Role`s。一个 `User` 引用其 `Role`s，但从给定的 `Role`，无法访问该角色中的 `User`s。一个 `User`\
    \ 引用 `UserInfo`，其中包含注册日期和（如果有的话）注销日期。`UserInfo` 引用回一个 `User`。一个 `User` 引用 `ContactData`，其中保存电子邮件和电话号码。`ContactData`\
    \ 不引用回其 `User`。一个 `User` 可以引用另一个 `User` 作为其伴侣。如果已知，`USER` 的伴侣会引用回。一个 `User` 可以拥有无限数量的朋友。给定一个\
    \ `User`，可以识别其朋友，但没有引用回。一个 `User` 的 `Post` 可以拥有无限数量的 `Tag`s。一个 `Tag` 可以在多个 `Post`s\
    \ 中重复使用。`Post` 与其 `Tag`s 之间存在双向关联。一个 `Post` 引用其 `Category`，但是，没有从 `Category` 到其\
    \ `Post`s 的引用。一个 `Category` 可以有它引用的子类别，以及（如果有的话）父 `Category`。类别是用户特定的。一个 `User`\
    \ 引用其类别，但没有引用回。\n\n领域模型的设计旨在尽可能使用多种不同的关联类型，以便我们可以在演示应用程序的范围内看到 Doctrine 2 的大部分功能。在实际应用程序中，领域模型可能看起来会有所不同。如您所见，实体之间的每个关联都不是双向的。正如我们将在本书后面看到的，这本质上是像\
    \ Doctrine 2 这样的 ORM 系统在面向对象世界中的一个特性。在关系数据库中，没有单向关联。它们在设计上始终是双向的。\n\n## 3 自制 ORM\n\
    \n| ![information](img/leanpub_information.png) || \n\n#### 直接进入 Doctrine 2？\n\
    \n本节描述了 Doctrine 2 对应用程序开发人员为何是如此大的帮助。我们将逐步自行实现 Doctrine 2 已经自带的某些 ORM 功能。本章不是学习\
    \ Doctrine 2 所必需的，但它有助于理解为什么应该学习它。 |\n\n| --- | --- |\n\n### 3.1 加载实体\n\n领域模型是一件好事。只要应用程序开发人员在其熟悉的面向对象世界中行事，在设计和实现领域模型时就没有障碍。如果涉及将领域模型的对象持久化到关系数据库，或加载和重建先前存储的对象，则会变得更加困难。例如，对象不仅仅是简单的数据结构。通过其方法，它们也具有行为。让我们考虑一下演示应用程序\
    \ Talking 的 `User` 实体定义：\n\n"
