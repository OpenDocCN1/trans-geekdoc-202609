    \n## 1 About this book\n\n> “I would have written a shorter book, but I did not\
    \ have the time.” freely adapted from Blaise Pascal (French mathematician, logician,\
    \ physicist and theologian.)\n\n### 1.1 Software version\n\nThis book is based\
    \ on Doctrine 2.3, however, most of its content will still be valid for later\
    \ versions.\n\n### 1.2 Database system\n\nAll examples in this book are based\
    \ on [MySQL](http://www.mysql.com). However, Doctrine 2 supports other DBMS such\
    \ as [PostgreSQL](http://www.postgresql.org/) or [SQLite](http://www.sqlite.org/).\
    \ Most examples will work with other DBMS right away, some may need to be adopted.\n\
    \n### 1.3 Code downloads\n\nMost of the code shown in this book can be found in\
    \ a [public repository GitHub](https://github.com/michael-romer/doctrine2buch).\
    \ While the code of chapter 3 (“A self-made ORM”) can be found on the [master\
    \ branch](https://github.com/michael-romer/doctrine2buch), there is [another branch\
    \ available called “doctrine”](https://github.com/michael-romer/doctrine2buch/tree/doctrine),\
    \ which holds the modifications made in chapter 4 (“Hello, Doctrine 2!”). There\
    \ is a third [branch called “application”](https://github.com/michael-romer/doctrine2buch/tree/application)\
    \ holding the modifications made in the later chapters. As the demo application\
    \ grows throughout the book, the “application branch” also includes a basic MVC-framework\
    \ called [Slim](http://www.slimframework.com/) to better structure the application’s\
    \ code as well as [Twitter’s Bootstrap](http://getbootstrap.com) for some basic\
    \ UI styling."
