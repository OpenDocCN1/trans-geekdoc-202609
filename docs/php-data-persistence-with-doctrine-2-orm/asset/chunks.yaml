  fmt: "\n```php\n<?php\nnamespace Entity;\n\n/**\n * @Entity\n */\nclass ImagePost\
    \ extends Post\n{\n\t/** @Column(type=\"string\") */\n\tprotected $imageUrl;\n\
    \n\t/**\n\t * @param mixed $imageUrl\n\t */\n\tpublic function setImageUrl($imageUrl)\n\
    \t{\n\t\t$this->imageUrl = $imageUrl;\n\t}\n\n\t/**\n\t * @return mixed\n\t */\n\
    \tpublic function getImageUrl()\n\t{\n\t\treturn $this->imageUrl;\n\t}\n}\n```\n\
    \nThe same is true for the `VideoPost`:\n\n```php\n<?php\nnamespace Entity;\n\n\
    /**\n * @Entity\n */\nclass VideoPost extends Post\n{\n\t/** @Column(type=\"string\"\
    ) */\n\tprotected $videoUrl;\n\n\t/**\n\t * @param mixed $videoUrl\n\t */\n\t\
    public function setVideoUrl($videoUrl)\n\t{\n\t\t$this->videoUrl = $videoUrl;\n\
    \t}\n\n\t/**\n\t * @return mixed\n\t */\n\tpublic function getVideoUrl()\n\t{\n\
    \t\treturn $this->videoUrl;\n\t}\n}\n```\n\nThe data structure used by Doctrine\
    \ 2 looks like this:\n\n| Col | Type | Length | NULL? | KEY | Extras |\n| ---\
    \ | --- | --- | --- | --- | --- |\n| id | INT | 11 | | PRI | auto\\_increment\
    \ |\n| user\\_id | INT | 11 | YES | MUL | |\n| category\\_id | INT | 11 | YES\
    \ | MUL | |\n| title | VARCHAR | 255 | | | |\n| content | LONGTEXT | | | | |\n\
    | discr | VARCHAR | 255 | | | |\n| videoUrl | VARCHAR | 255 | YES | | |\n| imageUrl\
    \ | VARCHAR | 255 | YES | | |\n\nNow all three types of entities can easily be\
    \ persisted. The downside of this approach is that-depending on how complex the\
    \ hierarchy is and how different the types involved are-the table grows and grows\
    \ with many fields never used by certain types. In our case, the `videoUrl` won’t\
    \ ever be used by entities of type `ImagePost`. The `imageUrl` won’t be used by\
    \ `VideoPost` entities and for `Post` entities even both fields will remain blank.\n\
    \nThe upside is-due to its nature-that this strategy allows for very efficient\
    \ queueing across all types in the hierarchy without any joins.\n\n#### 5.4.2\
    \ Class Table Inheritance\n\nWhile single table inheritance uses only one table\
    \ for all types, *class table inheritance* is a different approach where each\
    \ class in the hierarchy is mapped to several tables. While this gives the best\
    \ flexibility for sure, this also means that reconstructing entities will require\
    \ joins in the database. Since joins are expensive operations, usually, the performance\
    \ with class table inheritance is not as good as with single table inheritance.\n\
    \nThe main difference in configuration is in `Post`:\n\n```php\n<?php\nnamespace\
    \ Entity;\n\n/**\n * @Entity(repositoryClass=\"Repository\\Post\")\n * @Table(name=\"\
    posts\")\n * @InheritanceType(\"JOINED\")\n * @DiscriminatorColumn(name=\"discr\"\
    , type=\"string\")\n * @DiscriminatorMap({\"text\"=\"Post\",\"video\"=\"VideoPost\"\
    ,\"image\"= \"ImagePost\"})\n */\nclass Post\n{\n\t// member variables and associations\
    \ shared between all types\n}\n```\n\nInstead of inheritance type “SINGLE\\_TABLE”,\
    \ now “JOINED” is used. This tells Doctrine 2 to apply the class table inheritance\
    \ strategy. Since tables will be used for each type, configuring the tables names\
    \ may be useful for subclasses:\n\n```php\n<?php\nnamespace Entity;\n\n/**\n *\
    \ @Entity\n * @Table(name=\"posts_image\")\n */\nclass ImagePost extends Post\n\
    {\n\t/** @Column(type=\"string\") */\n\tprotected $imageUrl;\n\n\t/**\n\t * @param\
    \ mixed $imageUrl\n\t */\n\tpublic function setImageUrl($imageUrl)\n\t{\n\t\t\
    $this->imageUrl = $imageUrl;\n\t}\n\n\t/**\n\t * @return mixed\n\t */\n\tpublic\
    \ function getImageUrl()\n\t{\n\t\treturn $this->imageUrl;\n\t}\n}\n```\n\nThe\
    \ table name `posts_image` is handy for `ImagesPost` entities. We add the same\
    \ style of configuration to `VideoPost` entities as well:\n\n```php\n<?php\nnamespace\
    \ Entity;\n\n/**\n * @Entity\n * @Table(name=\"posts_video\")\t\n */\nclass VideoPost\
    \ extends Post\n{\n\t/** @Column(type=\"string\") */\n\tprotected $videoUrl;\n\
    \n\t/**\n\t * @param mixed $videoUrl\n\t */\n\tpublic function setVideoUrl($videoUrl)\n\
    \t{\n\t\t$this->videoUrl = $videoUrl;\n\t}\n\n\t/**\n\t * @return mixed\n\t */\n\
    \tpublic function getVideoUrl()\n\t{\n\t\treturn $this->videoUrl;\n\t}\n}\n```\n\
    \nWhen letting Doctrine 2 create the database schema, we will end up with three\
    \ tables for this hierarchy, while the `posts` table holds the main information:\n\
    \n| Col | Type | Length | NULL? | KEY | Extras |\n| --- | --- | --- | --- | ---\
    \ | --- |\n| id | INT | 11 | | PRI | auto\\_increment |\n| user\\_id | INT | 11\
    \ | YES | MUL | |\n| category\\_id | INT | 11 | YES | MUL | |\n| title | VARCHAR\
    \ | 255 | | | |\n| content | LONGTEXT | | | | |\n| discr | VARCHAR | 255 | | |\
    \ |\n\nThe `posts_video` table only holds the specifics of this type:\n\n| Col\
    \ | Type | Length | NULL? | KEY | Extras |\n| --- | --- | --- | --- | --- | ---\
    \ |\n| id | INT | 11 | | PRI | |\n| videoUrl | VARCHAR | 255 | YES | | |\n\nThe\
    \ same is true for `posts_image`:\n\n| Col | Type | Length | NULL? | KEY | Extras\
    \ |\n| --- | --- | --- | --- | --- | --- |\n| id | INT | 11 | | PRI | |\n| imageUrl\
    \ | VARCHAR | 255 | YES | | |\n\nBy evaluating the foreign key reference, entities\
    \ of type `ImagePost` and `VideoPost` can be re-constructed by table joins.\n\n\
    #### 5.4.3 Mapped Superclass\n\nLastly, a *mapped superclass* strategy can be\
    \ used. The main difference to the other two strategies we already discussed,\
    \ is that the superclass itself cannot be an entity. Taken the example above,\
    \ this means that class `Post` cannot be an entity itself. It simply inherits\
    \ member variables and associations to its subclasses.\n\nTo configure the mapped\
    \ superclass strategy means adding the `@MappedSuperclass` annotation to the `Post`\
    \ class:\n\n```php\n<?php\nnamespace Entity;\n\n/** @MappedSuperclass */\nclass\
    \ Post\n{\n\t// member variables and associations shared between all types\n}\n\
    ```\n\nBoth subclasses, `ImagePost` and `VideoPost` do not need to be changed.\
    \ However, with the Mapped Superclass strategy applied, we cannot persist objects\
    \ of type `Post` anymore, which mainly consist of text. We could fix this by adding\
    \ another new type called `TextPost`:\n\n```php\n<?php\nnamespace Entity;\n\n\
    /**\n * @Entity\n * @Table(name=\"posts_text\")\t\n */\nclass TextPost extends\
    \ Post\n{\n\t/**\n\t * @Id @Column(type=\"integer\")\n\t * @GeneratedValue\n\t\
    \ */\n\tprotected $id;\n\n} \n```\n\nNow we have three concrete entity types and\
