    \ even both fields will remain blank.\n\nThe upside is-due to its nature-that\
    \ this strategy allows for very efficient queueing across all types in the hierarchy\
    \ without any joins.\n\n#### 5.4.2 Class Table Inheritance\n\nWhile single table\
    \ inheritance uses only one table for all types, *class table inheritance* is\
