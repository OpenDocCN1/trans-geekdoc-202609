- raw: "We wrote a whole bunch of code-and yet can’t do anything more than reading\
    \ data from a database and making an object out of it. We didn’t even push our\
    \ own application forward. Looks like building an ORM system is hard work and\
    \ time-consuming. And we just started. Let’s spend some more time enhancing our\
    \ ORM, so that later, we even more appreciate Doctrine 2 existing.\n\n### 3.2\
    \ Saving an entity\n\nSo far, we implemented a really trivial use case: Loading\
    \ a single object from the database based on an ID given. But what about writing\
    \ operations? Actually, there are two types of write operations: inserts and updates.\
    \ Let’s first deal with the insert operation by adding an `extract()` method to\
    \ the `User` mapper:\n\n```\n 1 <?php\n 2 namespace Mapper;\n 3 \n 4 class User\n\
    \ 5 {\n 6 \tprivate $mapping = array(\n 7 \t\t'id' => 'id',\n 8 \t\t'firstName'\
    \ => 'first_name',\n 9 \t\t'lastName' => 'last_name',\n10 \t\t'gender' => 'gender',\n\
    11 \t\t'namePrefix' => 'name_prefix'\n12 \t);\n13 \n14 \tpublic function extract($user)\n\
    15 \t{\n16 \t\t$data = array();\n17 \n18 \t\tforeach($this->mapping as $keyObject\
    \ => $keyColumn) {\n19 \n20         \tif ($keyColumn != 'id') {\n21          \
    \   \t$data[$keyColumn] = call_user_func(\n22                 \tarray($user, 'get'.\
    \ ucfirst($keyObject))\n23             \t);\n24         \t}\n25     \t}\n26 \n\
    27     \treturn $data;\n28 \t}\n29 \n30 \tpublic function populate($data, $user)\n\
    31 \t{\n32 \t\t$mappingsFlipped = array_flip($this->mapping);\n33 \n34 \t\tforeach($data\
    \ as $key => $value) {\n35 \t\t\tif(isset($mappingsFlipped[$key])) {\n36 \t\t\t\
    \tcall_user_func_array(\n37 \t\t\t\t\tarray($user, 'set'. ucfirst($mappingsFlipped[$key])),\n\
    38 \t\t\t\t\tarray($value)\n39 \t\t\t\t);\n40 \t\t\t}\n41 \t\t}\n42 \n43 \t\t\
    return $user;\n44 \t}\n45 }\n```\n\nThis is how we extract the data from the object.\
    \ The entity manager, extended by a `saveUser()` method, now can insert a new\
    \ record into the database:\n\n```\n 1 <?php\n 2 \n 3 include_once('../repository/User.php');\n\
    \ 4 include_once('../mapper/User.php');\n 5 \n 6 use Repository\\User as UserRepository;\n\
    \ 7 use Mapper\\User as UserMapper;\n 8 \n 9 class EntityManager\n10 {\n11 \t\
    private $host;\n12 \tprivate $db;\n13 \tprivate $user;\n14 \tprivate $pwd;\n15\
    \ \tprivate $connection;\n16 \tprivate $userRepository;\n17 \n18 \tpublic function\
    \ __construct($host, $db, $user, $pwd)\n19 \t{\n20 \t\t$this->host = $host;\n\
    21 \t\t$this->user = $user;\n22 \t\t$this->pwd = $pwd;\n23 \t\t\n24 \t\t$this->connection\
    \ = \n25 \t\t\tnew \\PDO(\"mysql:host=$host;dbname=$db\", $user, $pwd);\n26 \t\
    \t\n27 \t\t$this->userRepository = null;\n28 \t}\n29 \n30 \tpublic function query($stmt)\n\
    31 \t{\n32 \t\treturn $this->connection->query($stmt);\n33 \t}\n34 \n35 \tpublic\
    \ function saveUser($user)\n36 \t{\n37 \t\t$userMapper = new UserMapper();\n38\
    \ \t\t$data = $userMapper->extract($user);\n39 \t\t$columnsString = implode(\"\
    , \", array_keys($data));\n40 \n41 \t\t$valuesString = implode(\n42 \t\t\t\"',\
    \ \n43 \t\t\t'\", \n44 \t\t\tarray_map(\"mysql_real_escape_string\", $data)\n\
    45 \t\t);\n46 \n47 \t\treturn $this->query(\n48 \t\t\t\"INSERT INTO users ($columnsString)\
    \ VALUES('$valuesString')\"\n49 \t\t);\n50 \t}\n51 \n52 \tpublic function getUserRepository()\n\
    53 \t{\n54 \t\tif (!is_null($this->userRepository)) {\n55         \treturn $this->userRepository;\n\
    56 \t\t} else {\n57 \t\t\t$this->userRepository = new UserRepository($this);\n\
    58 \t\t\treturn $this->userRepository;\n59 \t\t}\n60 \t}\n61 }\n```\n\nAdding\
    \ a new record now works like this:\n\n```\n 1 <?php\n 2 include_once('../EntityManager.php');\n\
    \ 3 $em = new EntityManager('localhost', 'app', 'root', '');\n 4 $user = $em->getUserRepository()->findOneById(1);\n\
    \ 5 echo $user->assembleDisplayName() . '<br />';\n 6 \n 7 $newUser = new Entity\\\
    User();\n 8 $newUser->setFirstName('Ute');\n 9 $newUser->setLastName('Musermann');\n\
    10 $newUser->setGender(1);\n11 $em->saveUser($newUser);\n12 \n13 echo $newUser->assembleDisplayName();\n\
    ```\n\nSo far, so good! But what if we want to update an existing record? How\
    \ to identify, if we deal with a new or an existing record? In our case, we might\
    \ simply check, if the object already has a value given for the `id` field. It’s\
    \ an “auto_increment” field and MySQL will populate it automatically for any new\
    \ record. For sure, this is not the most elegant way one may come up with. We\
    \ might use a so-called *identity map* that brings some more advantages: Re-reading\
    \ an already loaded database without querying the database again. An identity\
    \ map mainly is nothing else but an associative array holding references to already\
    \ loaded entities based on IDs. A good place for an identity map is the entity\
    \ manager and its `saveUser()` method:\n\n```\n 1 <?php\n 2 \n 3 include_once('../repository/User.php');\n\
    \ 4 include_once('../mapper/User.php');\n 5 \n 6 use Repository\\User as UserRepository;\n\
    \ 7 use Mapper\\User as UserMapper;\n 8 \n 9 class EntityManager\n10 {\n11 \t\
    private $host;\n12 \tprivate $db;\n13 \tprivate $user;\n14 \tprivate $pwd;\n15\
    \ \tprivate $connection;\n16 \tprivate $userRepository;\n17 \tprivate $identityMap;\n\
    18 \n19 \tpublic function __construct($host, $db, $user, $pwd)\n20 \t{\n21 \t\t\
    $this->host = $host;\n22 \t\t$this->user = $user;\n23 \t\t$this->pwd = $pwd;\n\
    24 \t\t\n25 \t\t$this->connection = \n26 \t\t\tnew \\PDO(\"mysql:host=$host;dbname=$db\"\
    , $user, $pwd);\n27 \t\t\n28 \t\t$this->userRepository = null;\n29 \t\t$this->identityMap\
    \ = array('users' => array());\n30 \t}\n31 \n32 \tpublic function query($stmt)\n\
    33 \t{\n34 \t\treturn $this->connection->query($stmt);\n35 \t}\n36 \n37 \tpublic\
    \ function saveUser($user)\n38 \t{\n39 \t\t$userMapper = new UserMapper();\n40\
    \ \t\t$data = $userMapper->extract($user);\n41 \n42 \t\t$userId = call_user_func(\n\
    43 \t\t\tarray($user, 'get'. ucfirst($userMapper->getIdColumn()))\n44 \t\t);\n\
    45 \n46 \t\tif (array_key_exists($userId, $this->identityMap['users'])) {\n47\
    \         \t$setString = '';\n48 \n49 \t\t\tforeach ($data as $key => $value)\
    \ {\n50 \t\t\t\t$setString .= $key.\"='$value',\";\n51 \t\t\t}\n52 \n53 \t\t\t\
    return $this->query(\n54 \t\t\t\t\"UPDATE users SET \" . substr($setString, 0,\
    \ -1) .\n55 \t\t\t\t\" WHERE \" . $userMapper->getIdColumn() . \"=\" . $userId\n\
    56 \t\t\t);\n57 \n58 \t\t} else {\n59 \t\t\t$columnsString = implode(\", \", array_keys($data));\n\
    60 \t\t\t$valuesString = implode(\n61 \t\t\t\t\"', \n62 \t\t\t\t'\", \n63 \t\t\
    \t\tarray_map(\"mysql_real_escape_string\", $data)\n64 \t\t\t);\n65 \n66 \t\t\t\
    return $this->query(\n67 \t\t\t\t\"INSERT INTO users ($columnsString) VALUES('$valuesString')\"\
    \n68 \t\t\t);\n69 \t\t}\n70 \t}\n71 \n72 \tpublic function getUserRepository()\n\
    73 \t{\n74 \t\tif (!is_null($this->userRepository)) {\n75 \t\t\treturn $this->userRepository;\n\
    76 \t\t} else {\n77 \t\t\t$this->userRepository = new UserRepository($this);\n\
    78 \t\t\treturn $this->userRepository;\n79 \t\t}\n80 \t}\n81 \n82 \tpublic function\
    \ registerUserEntity($id, $user)\n83 \t{\n84 \t\t$this->identityMap['users'][$id]\
    \ = $user;\n85 \t\treturn $user;\n86 \t}\n87 }\n```\n\nAs one can see, we added\
    \ a method `getIdColumn()` as well. It returns “id”. Now the following code works\
    \ nicely:\n\n```\n1 <?php\n2 include_once('../EntityManager.php');\n3 $em = new\
    \ EntityManager('localhost', 'app', 'root', '');\n4 $user = $em->getUserRepository()->findOneById(1);\n\
    5 echo $user->assembleDisplayName() . '<br />';\n6 \n7 $user->setFirstname('Moritz');\n\
    8 $em->saveUser($user); \n```\n\nThe entity is updated in the database and no\
    \ additional record is added.\n\n### 3.3 Associations\n\nNow we finally want to\
    \ list all posts from a specific `User`. Therefore, we want to simply iterate\
    \ over a `Post`s collection of a `User` and print each `Post`’s title:\n\n```\n\
    \ 1 <?php\n 2 include_once('../EntityManager.php');\n 3 $em = new EntityManager('localhost',\
    \ 'app', 'root', '');\n 4 $user = $em->getUserRepository()->findOneById(1);\n\
    \ 5 ?>\n 6 <h1><?echo $user->assembleDisplayName(); ?></h1>\n 7 <ul>\n 8 <?php\
    \ foreach($user->getPosts() as $post) { ?>\n 9 <li><?php echo $post->getTitle();\
    \ ?></li>\n10 <?php } ?>\n11 </ul>\n```\n\nWhat do we have to do to make this\
    \ happen?\n\nFirst, we create the data structure:\n\n```\n1 CREATE TABLE posts(\n\
    2 \tid int(10) NOT NULL auto_increment, \n3 \tuser_id int(10) NOT NULL,\n4 \t\
    title varchar(255) NOT NULL, \n5 \tcontent text NOT NULL,\n6 \tPRIMARY KEY (id)\n\
    7 );\n```"
