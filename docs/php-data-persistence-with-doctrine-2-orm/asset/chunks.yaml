    \ @Entity\n * @Table(name=\"posts_video\")\n * @AttributeOverrides({\n *     @AttributeOverride(name=\"\
    content\",\n *         column=@Column(\n *             name = \"closed_caption\"\
    ,\n *             type = \"text\"\n *         )\n *     )\n * })\n */\nclass VideoPost\
    \ extends Post\n{\n\t// [..]\n}\n```\n\nWhile Doctrine 2 requires member variables\
    \ being either `private` or `protected`, it’s important to remember that member\
    \ variables need to be `protected` here. Otherwise they won’t be available in\
    \ the subclass. When overwriting property `content` with `closed_caption` like\
    \ shown above, this leads to a `closed_caption` column in the database for this\
    \ type of entity.\n"
