- raw: "We add a test `User` and some test `Post`s, so that we can actually test the\
    \ implementation. Next, we need to extend a whole bunch of classes. The `User`\
    \ entity gets a `getPosts()` method, which loads the `User`’s `Post`s on first\
    \ invocation via the corresponding repository:\n\n```\n 1 <?php\n 2 namespace\
    \ Entity;\n 3 \n 4 class User\n 5 {\n 6 \t// [..]\n 7 \n 8     private $postRepository;\n\
    \ 9 \n10 \tpublic function getPosts()\n11 \t{\n12     \tif (is_null($this->posts))\
    \ {\n13         \t$this->posts = $this->postRepository->findByUser($this);\n14\
    \     \t}\n15    \n16     \treturn $this->posts;\n17 \t}\n18 \n19 \t// [..]\n\
    20 }\n```\n\nThis will only work if the `User` entity has access to the `Post`\
    \ repository. To make it available, the `User` repository method `findOneById()`\
    \ needs to be extended:\n\n```\n 1 <?php\n 2 namespace Repository;\n 3 \n 4 include_once('../entity/User.php');\n\
    \ 5 include_once('../mapper/User.php');\n 6 \n 7 use Mapper\\User as UserMapper;\n\
    \ 8 use Entity\\User as UserEntity;\n 9 \n10 class User\n11 {\n12 \tprivate $em;\n\
    13 \tprivate $mapper;\n14 \n15 \tpublic function __construct($em)\n16 \t{\n17\
    \ \t\t$this->mapper = new UserMapper;\n18 \t\t$this->em = $em;\n19 \t}\n20 \n\
    21 \tpublic function findOneById($id)\n22 \t{\n23 \t\t$userData = $this->em\n\
    24 \t\t\t->query('SELECT * FROM users WHERE id = ' . $id)\n25 \t\t\t->fetchAll();\n\
    26 \n27 \t\t$newUser = new UserEntity();\n28 \t\t$newUser->setPostRepository($this->em->getPostRepository());\n\
    29 \n30 \t\treturn $this->em->registerUserEntity(\n31 \t\t\t$id,\n32 \t\t\t$this->mapper->populate($userData,\
    \ $newUser)\n33 \t\t);\n34 \t}\n35 }\n```\n\nThe entity manager needs to be extended\
    \ by the method `getPostRepository()` as well:\n\n```\n 1 <?php\n 2 \n 3 // [..]\n\
    \ 4 \n 5 class EntityManager\n 6 {\n 7 \t// [..]\n 8     \n 9 \tprivate $postRepository;\n\
    10 \t\n11 \tpublic function getPostRepository()\n12 \t{\n13 \t\tif (!is_null($this->postRepository))\
    \ {\n14 \t\t\treturn $this->postRepository;\n15 \t\t} else {\n16 \t\t\t$this->postRepository\
    \ = new PostRepository($this);\n17 \t\t\treturn $this->postRepository;\n18 \t\t\
    }\n19 \t}\n20 }\n```\n\nNow, the Post entity and the `Post` mapper must be implemented:\n\
    \n```\n 1 <?php\n 2 namespace Entity;\n 3 \n 4 class Post\n 5 {\n 6 \tprivate\
    \ $id;\n 7 \tprivate $title;\n 8 \tprivate $content;\n 9 \n10 \tpublic function\
    \ setContent($content)\n11 \t{\n12 \t\t$this->content = $content;\n13 \t}\n14\
    \ \n15 \tpublic function getContent()\n16 \t{\n17 \t\treturn $this->content;\n\
    18 \t}\n19 \n20 \tpublic function setId($id)\n21 \t{\n22 \t\t$this->id = $id;\n\
    23 \t}\n24 \n25 \tpublic function getId()\n26 \t{\n27 \t\treturn $this->id;\n\
    28 \t}\n29 \n30 \tpublic function setTitle($title)\n31 \t{\n32 \t\t$this->title\
    \ = $title;\n33 \t}\n34 \n35 \tpublic function getTitle()\n36 \t{\n37 \t\treturn\
    \ $this->title;\n38 \t}\n39 }\n```\n\nAnd here the mapper:\n\n```\n 1 <?php\n\
    \ 2 namespace Mapper;\n 3 \n 4 class Post\n 5 {\n 6 \tprivate $mapping = array(\n\
    \ 7 \t\t'id' => 'id',\n 8 \t\t'title' => 'title',\n 9 \t\t'content' => 'content',\n\
    10 \t);\n11 \n12 \tpublic function getIdColumn()\n13 \t{\n14 \t\treturn 'id';\n\
    15 \t}\n16 \n17 \tpublic function extract($user)\n18 \t{\n19 \t\t$data = array();\n\
    20 \n21 \t\tforeach ($this->mapping as $keyObject => $keyColumn) {\n22 \t\t\t\
    if ($keyColumn != $this->getIdColumn()) {\n23 \t\t\t\t$data[$keyColumn] = call_user_func(\n\
    24 \t\t\t\t\tarray($user, 'get'. ucfirst($keyObject))\n25 \t\t\t\t);\n26 \t\t\t\
    }\n27 \t\t}\n28 \n29 \t\treturn $data;\n30 \t}\n31 \n32 \tpublic function populate($data,\
    \ $user)\n33 \t{\n34 \t\t$mappingsFlipped = array_flip($this->mapping);\n35 \n\
    36 \t\tforeach ($data as $key => $value) {\n37 \t\t\tif (isset($mappingsFlipped[$key]))\
    \ {\n38 \t\t\t\tcall_user_func_array(\n39 \t\t\t\t\tarray($user, 'set'. ucfirst($mappingsFlipped[$key])),\n\
    40 \t\t\t\t\tarray($value)\n41 \t\t\t\t);\n42 \t\t\t}\n43 \t\t}\n44 \n45 \t\t\
    return $user;\n46 \t}\n47 }\n```\n\nAnd last but not least, the `Post` repository:\n\
    \n```\n 1 <?php\n 2 namespace Repository;\n 3 \n 4 include_once('../entity/Post.php');\n\
    \ 5 include_once('../mapper/Post.php');\n 6 \n 7 use Mapper\\Post as PostMapper;\n\
    \ 8 use Entity\\Post as PostEntity;\n 9 \n10 class Post\n11 {\n12 \tprivate $em;\n\
    13 \tprivate $mapper;\n14 \n15 \tpublic function __construct($em)\n16 \t{\n17\
    \ \t\t$this->mapper = new PostMapper;\n18 \t\t$this->em = $em;\n19 \t}\n20 \n\
    21 \tpublic function findByUser($user)\n22 \t{\n23 \t\t$postsData = $this->em\n\
    24 \t\t\t->query('SELECT * FROM posts WHERE user_id = ' . $user->getId())\n25\
    \ \t\t\t->fetchAll();\n26 \n27 \t\t$posts = array();\n28 \n29 \t\tforeach($postsData\
    \ as $postData) {\n30 \t\t\t$newPost = new PostEntity();\n31 \t\t\t$posts[] =\
    \ $this->mapper->populate($postData, $newPost);\n32 \t\t}\n33 \n34 \t\treturn\
    \ $posts;\n35 \t}\n36 }\n```\n\nThat’s it! Up to this point, the application’s\
    \ files and folder structure looks like this:\n\n```\n 1 EntityManager.php\n 2\
    \ entity/\n 3 \tPost.php\n 4 \tUser.php\n 5 mapper/\n 6 \tPost.php\n 7 \tUser.php\n\
    \ 8 repository/\n 9 \tPost.php\n10 \tUser.php\n11 public/\n12 \tindex.php\n```\n\
    \n### 3.4 Next steps\n\nGreat! We built our own little ORM tool. However, our\
    \ code already doesn’t look that good anymore. The fact that technical code is\
    \ mixed-up with domain specific code is an issue. Our solutions to the problems\
    \ faced are more or less only valid to our concrete use case. Also, it smells\
    \ like “copy & paste” in here! In fact, some refactoring already needs to be done.\n\
    \nAnd what about composite primary keys? Adding and deleting associations? Many-to-many\
    \ associations? Inheritance, performance, caching and entities, mappers and repositories\
    \ for the tons of yet missing core elements of the application? Also, what happens\
    \ if the data structures change? This would mean refactoring of multiple classes\
    \ already! Looks like it is time for Doctrine 2 to enter the stage.\n\n## 4 Hello,\
    \ Doctrine 2!\n\n| ![information](images/leanpub_information.png) || \n\n####\
    \ Don’t worry!\n\nWe run through Doctrine 2 quickly in this chapter but we will\
    \ look into each single aspect of it in depth later in the book again. |\n\n|\
    \ --- | --- |\n\n### 4.1 Installation\n\nThe easiest way to install Doctrine 2\
    \ is by using “Composer” which can be downloaded from its [Website](http://getcomposer.org/download/).\
    \ The phar file must be stored in the root directory of the application. Then,\
    \ a file `composer.json` needs to be created with the following contents (one\
    \ may need to adjust the version number given):\n\n```\n1 {\n2 \t\"require\":\
    \ {\n3 \t\t\"doctrine/orm\": \"2.3.1\"\n4 \t}\n5 }\n```\n\nExecuting the command\n\
    \n```\n1 $ php composer.phar install\n```\n\nin the root directory of the application\
    \ downloads Doctrine 2 to the subfolder `vendor` and makes it available to the\
    \ application by configuring autoloading for its classes. One then does only need\
    \ to add\n\n```\n1 <?php\n2 // [..]\n3 if (file_exists('vendor/autoload.php'))\
    \ {\n4     $loader = include 'vendor/autoload.php';\n5 }\n```\n\nto the `index.php`\
    \ file. Once down, all Doctrine 2 classes are loaded automatically on demand.\
    \ Nice!\n\n### 4.2 A first Entity\n\nBased on the first section of this book,\
    \ in which we developed our own little ORM system, we now can radically simplify\
    \ the code needed by adding Doctrine 2 annotations to the `User` entity:"
  fmt: "\nWe add a test `User` and some test `Post`s, so that we can actually test\
    \ the implementation. Next, we need to extend a whole bunch of classes. The `User`\
    \ entity gets a `getPosts()` method, which loads the `User`’s `Post`s on first\
    \ invocation via the corresponding repository:\n\n```\n<?php\nnamespace Entity;\n\
    \nclass User\n{\n\t// [..]\n\n    private $postRepository;\n\n\tpublic function\
    \ getPosts()\n\t{\n    \tif (is_null($this->posts)) {\n        \t$this->posts\
    \ = $this->postRepository->findByUser($this);\n    \t}\n    \n    \treturn $this->posts;\n\
    \t}\n\n\t// [..]\n}\n```\n\nThis will only work if the `User` entity has access\
    \ to the `Post` repository. To make it available, the `User` repository method\
    \ `findOneById()` needs to be extended:\n\n```\n<?php\nnamespace Repository;\n\
    \ninclude_once('../entity/User.php');\ninclude_once('../mapper/User.php');\n\n\
    use Mapper\\User as UserMapper;\nuse Entity\\User as UserEntity;\n\nclass User\n\
    {\n\tprivate $em;\n\tprivate $mapper;\n\n\tpublic function __construct($em)\n\t\
    {\n\t\t$this->mapper = new UserMapper;\n\t\t$this->em = $em;\n\t}\n\n\tpublic\
    \ function findOneById($id)\n\t{\n\t\t$userData = $this->em\n\t\t\t->query('SELECT\
    \ * FROM users WHERE id = ' . $id)\n\t\t\t->fetchAll();\n\n\t\t$newUser = new\
    \ UserEntity();\n\t\t$newUser->setPostRepository($this->em->getPostRepository());\n\
    \n\t\treturn $this->em->registerUserEntity(\n\t\t\t$id,\n\t\t\t$this->mapper->populate($userData,\
    \ $newUser)\n\t\t);\n\t}\n}\n```\n\nThe entity manager needs to be extended by\
    \ the method `getPostRepository()` as well:\n\n```\n<?php\n\n// [..]\n\nclass\
    \ EntityManager\n{\n\t// [..]\n    \n\tprivate $postRepository;\n\t\n\tpublic\
    \ function getPostRepository()\n\t{\n\t\tif (!is_null($this->postRepository))\
    \ {\n\t\t\treturn $this->postRepository;\n\t\t} else {\n\t\t\t$this->postRepository\
    \ = new PostRepository($this);\n\t\t\treturn $this->postRepository;\n\t\t}\n\t\
    }\n}\n```\n\nNow, the Post entity and the `Post` mapper must be implemented:\n\
    \n```\n<?php\nnamespace Entity;\n\nclass Post\n{\n\tprivate $id;\n\tprivate $title;\n\
    \tprivate $content;\n\n\tpublic function setContent($content)\n\t{\n\t\t$this->content\
    \ = $content;\n\t}\n\n\tpublic function getContent()\n\t{\n\t\treturn $this->content;\n\
    \t}\n\n\tpublic function setId($id)\n\t{\n\t\t$this->id = $id;\n\t}\n\n\tpublic\
    \ function getId()\n\t{\n\t\treturn $this->id;\n\t}\n\n\tpublic function setTitle($title)\n\
    \t{\n\t\t$this->title = $title;\n\t}\n\n\tpublic function getTitle()\n\t{\n\t\t\
    return $this->title;\n\t}\n}\n```\n\nAnd here the mapper:\n\n```\n<?php\nnamespace\
    \ Mapper;\n\nclass Post\n{\n\tprivate $mapping = array(\n\t\t'id' => 'id',\n\t\
    \t'title' => 'title',\n\t\t'content' => 'content',\n\t);\n\n\tpublic function\
    \ getIdColumn()\n\t{\n\t\treturn 'id';\n\t}\n\n\tpublic function extract($user)\n\
    \t{\n\t\t$data = array();\n\n\t\tforeach ($this->mapping as $keyObject => $keyColumn)\
    \ {\n\t\t\tif ($keyColumn != $this->getIdColumn()) {\n\t\t\t\t$data[$keyColumn]\
    \ = call_user_func(\n\t\t\t\t\tarray($user, 'get'. ucfirst($keyObject))\n\t\t\t\
    \t);\n\t\t\t}\n\t\t}\n\n\t\treturn $data;\n\t}\n\n\tpublic function populate($data,\
    \ $user)\n\t{\n\t\t$mappingsFlipped = array_flip($this->mapping);\n\n\t\tforeach\
    \ ($data as $key => $value) {\n\t\t\tif (isset($mappingsFlipped[$key])) {\n\t\t\
    \t\tcall_user_func_array(\n\t\t\t\t\tarray($user, 'set'. ucfirst($mappingsFlipped[$key])),\n\
    \t\t\t\t\tarray($value)\n\t\t\t\t);\n\t\t\t}\n\t\t}\n\n\t\treturn $user;\n\t}\n\
    }\n```\n\nAnd last but not least, the `Post` repository:\n\n```\n<?php\nnamespace\
    \ Repository;\n\ninclude_once('../entity/Post.php');\ninclude_once('../mapper/Post.php');\n\
    \nuse Mapper\\Post as PostMapper;\nuse Entity\\Post as PostEntity;\n\nclass Post\n\
    {\n\tprivate $em;\n\tprivate $mapper;\n\n\tpublic function __construct($em)\n\t\
    {\n\t\t$this->mapper = new PostMapper;\n\t\t$this->em = $em;\n\t}\n\n\tpublic\
    \ function findByUser($user)\n\t{\n\t\t$postsData = $this->em\n\t\t\t->query('SELECT\
    \ * FROM posts WHERE user_id = ' . $user->getId())\n\t\t\t->fetchAll();\n\n\t\t\
    $posts = array();\n\n\t\tforeach($postsData as $postData) {\n\t\t\t$newPost =\
    \ new PostEntity();\n\t\t\t$posts[] = $this->mapper->populate($postData, $newPost);\n\
    \t\t}\n\n\t\treturn $posts;\n\t}\n}\n```\n\nThat’s it! Up to this point, the application’s\
    \ files and folder structure looks like this:\n\n```\nEntityManager.php\nentity/\n\
    \tPost.php\n\tUser.php\nmapper/\n\tPost.php\n\tUser.php\nrepository/\n\tPost.php\n\
    \tUser.php\npublic/\n\tindex.php\n```\n\n### 3.4 Next steps\n\nGreat! We built\
    \ our own little ORM tool. However, our code already doesn’t look that good anymore.\
    \ The fact that technical code is mixed-up with domain specific code is an issue.\
    \ Our solutions to the problems faced are more or less only valid to our concrete\
    \ use case. Also, it smells like “copy & paste” in here! In fact, some refactoring\
    \ already needs to be done.\n\nAnd what about composite primary keys? Adding and\
    \ deleting associations? Many-to-many associations? Inheritance, performance,\
    \ caching and entities, mappers and repositories for the tons of yet missing core\
    \ elements of the application? Also, what happens if the data structures change?\
    \ This would mean refactoring of multiple classes already! Looks like it is time\
    \ for Doctrine 2 to enter the stage.\n\n## 4 Hello, Doctrine 2!\n\n| ![information](images/leanpub_information.png)\
    \ || \n\n#### Don’t worry!\n\nWe run through Doctrine 2 quickly in this chapter\
    \ but we will look into each single aspect of it in depth later in the book again.\
    \ |\n\n| --- | --- |\n\n### 4.1 Installation\n\nThe easiest way to install Doctrine\
    \ 2 is by using “Composer” which can be downloaded from its [Website](http://getcomposer.org/download/).\
    \ The phar file must be stored in the root directory of the application. Then,\
    \ a file `composer.json` needs to be created with the following contents (one\
    \ may need to adjust the version number given):\n\n```\n{\n\t\"require\": {\n\t\
    \t\"doctrine/orm\": \"2.3.1\"\n\t}\n}\n```\n\nExecuting the command\n\n```\n$\
    \ php composer.phar install\n```\n\nin the root directory of the application downloads\
    \ Doctrine 2 to the subfolder `vendor` and makes it available to the application\
    \ by configuring autoloading for its classes. One then does only need to add\n\
    \n```\n<?php\n// [..]\nif (file_exists('vendor/autoload.php')) {\n    $loader\
    \ = include 'vendor/autoload.php';\n}\n```\n\nto the `index.php` file. Once down,\
    \ all Doctrine 2 classes are loaded automatically on demand. Nice!\n\n### 4.2\
    \ A first Entity\n\nBased on the first section of this book, in which we developed\
    \ our own little ORM system, we now can radically simplify the code needed by\
    \ adding Doctrine 2 annotations to the `User` entity:\n"
  trans: "\n\n我们添加一个测试 `User` 和一些测试 `Post`s，以便我们可以实际测试实现。接下来，我们需要扩展一大堆类。`User` 实体获得一个\
    \ `getPosts()` 方法，该方法通过相应的仓库在首次调用时加载 `User` 的 `Post`s：\n\n```\n<?php\nnamespace\
    \ Entity;\n\nclass User\n{\n\t// [..]\n\n    private $postRepository;\n\n\tpublic\
    \ function getPosts()\n\t{\n    \tif (is_null($this->posts)) {\n        \t$this->posts\
    \ = $this->postRepository->findByUser($this);\n    \t}\n    \n    \treturn $this->posts;\n\
    \t}\n\n\t// [..]\n}\n```\n\n只有当 `User` 实体可以访问 `Post` 仓库时，这才能正常工作。为了使其可用，`User`\
    \ 仓库方法 `findOneById()` 需要扩展：\n\n```\n<?php\nnamespace Repository;\n\ninclude_once('../entity/User.php');\n\
    include_once('../mapper/User.php');\n\nuse Mapper\\User as UserMapper;\nuse Entity\\\
    User as UserEntity;\n\nclass User\n{\n\tprivate $em;\n\tprivate $mapper;\n\n\t\
    public function __construct($em)\n\t{\n\t\t$this->mapper = new UserMapper;\n\t\
    \t$this->em = $em;\n\t}\n\n\tpublic function findOneById($id)\n\t{\n\t\t$userData\
    \ = $this->em\n\t\t\t->query('SELECT * FROM users WHERE id = ' . $id)\n\t\t\t\
    ->fetchAll();\n\n\t\t$newUser = new UserEntity();\n\t\t$newUser->setPostRepository($this->em->getPostRepository());\n\
    \n\t\treturn $this->em->registerUserEntity(\n\t\t\t$id,\n\t\t\t$this->mapper->populate($userData,\
    \ $newUser)\n\t\t);\n\t}\n}\n```\n\n实体管理器还需要扩展方法 `getPostRepository()`：\n\n```\n\
    <?php\n\n// [..]\n\nclass EntityManager\n{\n\t// [..]\n    \n\tprivate $postRepository;\n\
    \t\n\tpublic function getPostRepository()\n\t{\n\t\tif (!is_null($this->postRepository))\
    \ {\n\t\t\treturn $this->postRepository;\n\t\t} else {\n\t\t\t$this->postRepository\
    \ = new PostRepository($this);\n\t\t\treturn $this->postRepository;\n\t\t}\n\t\
    }\n}\n```\n\n现在，`Post` 实体和 `Post` 映射器必须实现：\n\n```\n<?php\nnamespace Entity;\n\n\
    class Post\n{\n\tprivate $id;\n\tprivate $title;\n\tprivate $content;\n\n\tpublic\
    \ function setContent($content)\n\t{\n\t\t$this->content = $content;\n\t}\n\n\t\
    public function getContent()\n\t{\n\t\treturn $this->content;\n\t}\n\n\tpublic\
    \ function setId($id)\n\t{\n\t\t$this->id = $id;\n\t}\n\n\tpublic function getId()\n\
    \t{\n\t\treturn $this->id;\n\t}\n\n\tpublic function setTitle($title)\n\t{\n\t\
    \t$this->title = $title;\n\t}\n\n\tpublic function getTitle()\n\t{\n\t\treturn\
    \ $this->title;\n\t}\n}\n```\n\n这是映射器：\n\n```\n<?php\nnamespace Mapper;\n\nclass\
    \ Post\n{\n\tprivate $mapping = array(\n\t\t'id' => 'id',\n\t\t'title' => 'title',\n\
    \t\t'content' => 'content',\n\t);\n\n\tpublic function getIdColumn()\n\t{\n\t\t\
    return 'id';\n\t}\n\n\tpublic function extract($user)\n\t{\n\t\t$data = array();\n\
    \n\t\tforeach ($this->mapping as $keyObject => $keyColumn) {\n\t\t\tif ($keyColumn\
    \ != $this->getIdColumn()) {\n\t\t\t\t$data[$keyColumn] = call_user_func(\n\t\t\
    \t\t\tarray($user, 'get'. ucfirst($keyObject))\n\t\t\t\t);\n\t\t\t}\n\t\t}\n\n\
    \t\treturn $data;\n\t}\n\n\tpublic function populate($data, $user)\n\t{\n\t\t\
    $mappingsFlipped = array_flip($this->mapping);\n\n\t\tforeach ($data as $key =>\
    \ $value) {\n\t\t\tif (isset($mappingsFlipped[$key])) {\n\t\t\t\tcall_user_func_array(\n\
    \t\t\t\t\tarray($user, 'set'. ucfirst($mappingsFlipped[$key])),\n\t\t\t\t\tarray($value)\n\
    \t\t\t\t);\n\t\t\t}\n\t\t}\n\n\t\treturn $user;\n\t}\n}\n```\n\n最后，`Post` 仓库：\n\
    \n```\n<?php\nnamespace Repository;\n\ninclude_once('../entity/Post.php');\ninclude_once('../mapper/Post.php');\n\
    \nuse Mapper\\Post as PostMapper;\nuse Entity\\Post as PostEntity;\n\nclass Post\n\
    {\n\tprivate $em;\n\tprivate $mapper;\n\n\tpublic function __construct($em)\n\t\
    {\n\t\t$this->mapper = new PostMapper;\n\t\t$this->em = $em;\n\t}\n\n\tpublic\
    \ function findByUser($user)\n\t{\n\t\t$postsData = $this->em\n\t\t\t->query('SELECT\
    \ * FROM posts WHERE user_id = ' . $user->getId())\n\t\t\t->fetchAll();\n\n\t\t\
    $posts = array();\n\n\t\tforeach($postsData as $postData) {\n\t\t\t$newPost =\
    \ new PostEntity();\n\t\t\t$posts[] = $this->mapper->populate($postData, $newPost);\n\
    \t\t}\n\n\t\treturn $posts;\n\t}\n}\n```\n\n就这样！到目前为止，应用程序的文件和文件夹结构如下：\n\n```\n\
    EntityManager.php\nentity/\n\tPost.php\n\tUser.php\nmapper/\n\tPost.php\n\tUser.php\n\
    repository/\n\tPost.php\n\tUser.php\npublic/\n\tindex.php\n```\n\n### 3.4 下一步\n\
    \n太棒了！我们构建了自己的小型 ORM 工具。然而，我们的代码已经不再那么好看了。技术代码与特定领域代码混合在一起是一个问题。我们面临问题的解决方案或多或少仅对我们的具体用例有效。而且，这里有一种“复制粘贴”的味道！事实上，已经需要进行一些重构了。\n\
    \n复合主键呢？添加和删除关联？多对多关联？继承、性能、缓存以及应用程序中大量缺失的核心元素的实体、映射器和仓库呢？如果数据结构发生变化会怎样？这意味着已经需要重构多个类！看起来是时候让\
    \ Doctrine 2 登场了。\n\n## 4 Hello, Doctrine 2!\n\n| ![information](img/leanpub_information.png)\
    \ || \n\n#### 不要担心！\n\n我们将在本章中快速浏览 Doctrine 2，但我们会在书中后面再次深入探讨它的每一个方面。 |\n\n| ---\
    \ | --- |\n\n### 4.1 安装\n\n安装 Doctrine 2 的最简单方法是使用“Composer”，可以从其 [Website](http://getcomposer.org/download/)\
    \ 下载。phar 文件必须存储在应用程序的根目录中。然后，需要创建一个文件 `composer.json`，内容如下（可能需要调整给定的版本号）：\n\n\
    ```\n{\n\t\"require\": {\n\t\t\"doctrine/orm\": \"2.3.1\"\n\t}\n}\n```\n\n在应用程序的根目录中执行命令\n\
    \n```\n$ php composer.phar install\n```\n\n将 Doctrine 2 下载到子文件夹 `vendor`，并通过为其类配置自动加载使其可用于应用程序。然后只需将以下内容添加到\
    \ `index.php` 文件中：\n\n```\n<?php\n// [..]\nif (file_exists('vendor/autoload.php'))\
