- raw: "```\n1 <?php\n2 public function find($id, $lockMode = LockMode::NONE, $lockVersion\
    \ = null);\n```\n\nTo find a single entity based on criteria, the `findOneBy()`\
    \ method is used:\n\n```\n1 <?php\n2 public function findOneBy(array $criteria,\
    \ array $orderBy = null);\n```\n\nTo find all entities of a specific type, the\
    \ `findAll()` method is used:\n\n```\n1 <?php\n2 public function findAll();\n\
    ```\n\nTo find multiple entities based on criteria, the `findBy()` method is used:\n\
    \n```\n1 <?php\n2 public function findBy(\n3 \tarray $criteria, \n4 \tarray $orderBy\
    \ = null, \n5 \t$limit = null, \n6 \t$offset = null\n7 );\n```\n\nOne may define\
    \ the order, limit and offset values when using `findBy()`.\n\nAlso helpful are\
    \ the so-called *magic finders*. They allow to include search criteria directly\
    \ in a finder method’s name. The next two statements produce the same result:\n\
    \n```\n1 <?php\n2 $tag = $em->getRepository('Entity\\Tag')->findOneBy(array('label'=>$label));\n\
    3 $tag = $em->getRepository('Entity\\Tag')->findOneByLabel($label);\n```\n\nAdding\
    \ a custom repository with individual finder methods is a two step process. First,\
    \ a new repository class needs to be set up:\n\n```\n 1 <?php\n 2 namespace Repository;\n\
    \ 3 \n 4 use Doctrine\\ORM\\EntityRepository;\n 5 \n 6 class Post extends EntityRepository\n\
    \ 7 {\n 8 \tpublic function findAllPostsWithTag($tag)\n 9 \t{\n10 \t\t// DQL statement\
    \ goes here\n11 \t}\n12 }\n```\n\nNext, Doctrine 2 needs to know about the new\
    \ repository. This is done through the corresponding entity:\n\n```\n 1 <?php\n\
    \ 2 namespace Entity;\n 3 \n 4 /**\n 5 * @Entity(repositoryClass=\"Repository\\\
    Post\")\n 6 * @Table(name=\"posts\")\n 7 */\n 8 class Post\n 9 {\n10 \t// [..]\n\
    11 }\n```\n\nThat’s all! The `findAllPostsWithTag()` finder method now can easily\
    \ be invoked:\n\n```\n1 <?php\n2 $posts = $em->getRepository('Entity\\Post')->findAllPostsWithTag($tag);\n\
    ```\n\nWe will learn more about DQL-the *Doctrine Query Language*\\-later in the\
    \ book. It is used to phrase a query.\n\n#### 7.2.2 Using an association\n\nLet’s\
    \ assume we already have a loaded `User` entity available. Instead of loading\
    \ the `User`’s contact data by utilizing its repository, we may also simply reach\
    \ this entity from the given `User` entity:\n\n```\n 1 <?php\n 2 namespace Entity;\n\
    \ 3 \n 4 /**\n 5 * @Entity\n 6 * @Table(name=\"users\")\n 7 */\n 8 class User\n\
    \ 9 {\n10 \t// [..]\n11 \n12 \t/**\n13 \t* @OneToOne(targetEntity=\"Entity\\ContactData\"\
    )\n14 \t*/\n15 \tprivate $contactData;\n16 \n17 \t// [..]\n18 \t\n19 \tpublic\
    \ function getContactData()\n20 \t{\n21 \t\treturn $this->contactData;\n22 \t\
    }\n23 }\n```\n\nIn this case, when calling `getContactData()`, the referenced\
    \ `ContactData` entity is loaded on demand by Doctrine’s proxy mechanism.\n\n\
    We could even make sure that the referenced `ContactData` entity is already loaded\
    \ when loading the `User` itself-and save an additional database query:\n\n```\n\
    1 <?php\n2 // [..]\n3 /**\n4 * @OneToOne(targetEntity=\"Entity\\ContactData\"\
    , fetch=\"EAGER\")\n5 */\n6 private $contactData;\n```\n\nBy using `fetch=\"EAGER\"\
    `, we tell Doctrine 2 to always load the referenced `ContactData` entity when\
    \ the `User` itself is loaded.\n\nLoading eagerly sometimes has its advantages.\
    \ Especially when it’s likely to access a referenced entity later in the process.\
    \ If the `fetch` attribute is omitted, Doctrine 2 fetches `LAZY` by default. This\
    \ means it loads the entity on first access. The third option is `EXTRA_LAZY`,\
    \ which is helpful for huge datasets. Even if one decides to lazy load references,\
    \ the referenced entities are still all loaded fully into RAM. Depending on the\
    \ amount and size of the entities referenced, this could be a serious performance\
    \ issue. When `EXTRA_LAZY` is used, several methods can be executed on the collection\
    \ of referenced entities without fully loading them into the RAM right away. This\
    \ is true for:\n\n*   `contains()`\n\n*   `count()`\n\n*   `offsetSet()`\n\n*\
    \   `add()`\n\n*   `count()`\n\n*   `slice()`\n\nThis way, e.g. a pagination feature\
    \ can be built without performance issues.\n\n### 7.3 Changing an existing Entity\n\
    \nModifying an exiting, already loaded entity is easy. All changes made to such\
    \ an entity are auto-detected by Doctrine 2 when flushing the entity manager:\n\
    \n```\n1 <?php\n2 // [..]\n3 $post = $em->getRepository('Entity\\Post')->find(1);\n\
    4 $post->setTitle(\"New title\");\n5 $em->flush();\n```\n\nThere is no need for\
    \ explicitly telling Doctrine 2 again about the fact that this entity has been\
    \ changed. The method `persist($entity)` does not need to be called on the entity\
    \ manager again.\n\n### 7.4 Removing an Entity\n\nRemoving an existing entity\
    \ can easily be done through the entity manager, if a handle to a loaded entity\
    \ is available:\n\n```\n1 <?php\n2 $em->remove($post);\n3 $em->flush();\n```\n\
    \nThe SQL statement needed to physically delete the record in the database is\
    \ not issued as long as `flush()` hasn’t been invoked.\n\n### 7.5 Sorting an association\n\
    \nWhen accessing entities via an association, the order of the entities retrieved\
    \ is not defined. As a part of the entity mapping definitions, one can define\
    \ the order of entities using the `@OrderBy` annotation. If we get back to our\
    \ demo application, we could define the order of a `User`’s `Post`s in a way,\
    \ that the most recent `Post` is shown first in its list of `Post`s, simply by\
    \ modifying the mapping configuration in the `User` entity:\n\n```\n 1 <?php\n\
    \ 2 namespace Entity;\n 3 \n 4 /**\n 5 * @Entity\n 6 * @Table(name=\"users\")\n\
    \ 7 */\n 8 class User\n 9 {\n10 \t// [..]\n11 \t\n12 \t/**\n13 \t* @OneToMany(targetEntity=\"\
    Entity\\Post\", mappedBy=\"user\")\n14 \t* @OrderBy({\"id\" = \"DESC\"})\n15 \t\
    */\n16 \tprivate $posts;\n17 \t\n18 \t// [..]\n19 }\n```\n\nAlternatively, one\
    \ may sort a collection with PHP after retrieving the entities from the database.\n\
    \n### 7.6 Removing an association\n\nRemoving an association is as straight-forward\
    \ as removing of an entity is:\n\n```\n 1 <?php\n 2 $newPost = new \\Entity\\\
    Post();\n 3 $newPost->setTitle('A new post!');\n 4 $newPost->setContent('This\
    \ is the body of the new post.');\n 5 $user = $em->getRepository('Entity\\User')->findOneById(1);\n\
    \ 6 $newPost->setUser($user);\n 7 $em->flush();\n 8 \n 9 $newPost->setUser(null);\n\
    10 $em->flush();\n```\n\nFirst, a new `Post` entity is created in the example\
    \ above. Then, an existing `User` entity is loaded and associated with the new\
    \ post. After flushing, the reference has been persisted to the database. Next,\
    \ we remove the association again by setting `User` to `null`. After the next\
    \ flushing, the reference is gone in the database.\n\nWe need to keep in mind\
    \ here that we have established a bidirectional relationship between the `User`\
    \ and its `Post`s, while the `Post` entity is the owning side of the association.\
    \ If, for example, we would take the `User` entity and remove the `Post` from\
    \ its collection `$posts`, nothing would happen on flushing:\n\n```\n1 <?php\n\
    2 // [..]\n3 $user->getPosts()->removeElement($newPost);\n4 $em->flush();\n```\n\
    \nThe `removeElement()` method, which is used to remove an element from a given\
    \ Doctrine 2 collection based on an entity loaded, is without the desired effect.\
    \ However, there *is* an effect. While the change won’t be persisted, the element\
    \ has been removed from the collection in RAM. One won’t find the element when\
    \ looking it up in the collection anymore.\n\n### 7.7 Life Cycle events\n\nWhen\
    \ working with entities, several events are triggered by Doctrine 2:\n\n*   **preRemove**:\
    \ Occurs for a given entity before the respective EntityManager remove operation\
    \ for that entity is executed.\n\n*   **postRemove**: Occurs for an entity after\
    \ the entity has been deleted. It will be invoked after the database delete operations.\n\
    \n*   **prePersist**: Occurs for a given entity before the respective EntityManager\
    \ persist operation for that entity is executed.\n\n*   **postPersist**: Occurs\
    \ for an entity after the entity has been made persistent. It will be invoked\
    \ after the database insert operations.\n\n*   **preUpdate**: Occurs before the\
    \ database update operations to entity data.\n\n*   **postUpdate**: Occurs after\
    \ the database update operations to entity data."
  fmt: "\n# 使用 Doctrine 2 查找实体\n\n要根据条件查找单个实体，使用 `findOneBy()` 方法：\n\n```php\n<?php\n\
    public function findOneBy(array $criteria, array $orderBy = null);\n```\n\n要查找特定类型的所有实体，使用\
    \ `findAll()` 方法：\n\n```php\n<?php\npublic function findAll();\n```\n\n要根据条件查找多个实体，使用\
    \ `findBy()` 方法：\n\n```php\n<?php\npublic function findBy(\n\tarray $criteria,\
    \ \n\tarray $orderBy = null, \n\t$limit = null, \n\t$offset = null\n);\n```\n\n\
    在使用 `findBy()` 时，可以定义 order、limit 和 offset 值。\n\n此外，还有所谓的“魔术查找器”（magic finders），它们允许将搜索条件直接包含在查找器方法的名称中。下面两条语句产生相同的结果：\n\
    \n```php\n<?php\n$tag = $em->getRepository('Entity\\Tag')->findOneBy(array('label'=>$label));\n\
    $tag = $em->getRepository('Entity\\Tag')->findOneByLabel($label);\n```\n\n添加带有自定义查找器方法的自定义仓库是一个两步过程。首先，需要设置一个新的仓库类：\n\
    \n```php\n<?php\nnamespace Repository;\n\nuse Doctrine\\ORM\\EntityRepository;\n\
    \nclass Post extends EntityRepository\n{\n\tpublic function findAllPostsWithTag($tag)\n\
    \t{\n\t\t// DQL statement goes here\n\t}\n}\n```\n\n接下来，Doctrine 2 需要了解新仓库。这是通过相应的实体完成的：\n\
    \n```php\n<?php\nnamespace Entity;\n\n/**\n * @Entity(repositoryClass=\"Repository\\\
    Post\")\n * @Table(name=\"posts\")\n */\nclass Post\n{\n\t// [..]\n}\n```\n\n\
    就这样！`findAllPostsWithTag()` 查找器方法现在可以轻松调用：\n\n```php\n<?php\n$posts = $em->getRepository('Entity\\\
    Post')->findAllPostsWithTag($tag);\n```\n\n我们将在本书后面部分了解更多关于 DQL（Doctrine Query\
    \ Language，Doctrine 查询语言）的内容，它用于构建查询。\n\n## 7.2.2 使用关联\n\n假设我们已经有一个已加载的 `User`\
    \ 实体。我们可以不通过其仓库加载 `User` 的联系人数据，而是直接从给定的 `User` 实体访问该实体：\n\n```php\n<?php\nnamespace\
    \ Entity;\n\n/**\n * @Entity\n * @Table(name=\"users\")\n */\nclass User\n{\n\t\
    // [..]\n\n\t/**\n\t * @OneToOne(targetEntity=\"Entity\\ContactData\")\n\t */\n\
    \tprivate $contactData;\n\n\t// [..]\n\t\n\tpublic function getContactData()\n\
    \t{\n\t\treturn $this->contactData;\n\t}\n}\n```\n\n在这种情况下，调用 `getContactData()`\
    \ 时，引用的 `ContactData` 实体会由 Doctrine 的代理机制按需加载。\n\n我们甚至可以确保在加载 `User` 本身时，引用的 `ContactData`\
    \ 实体已经加载，从而节省一次额外的数据库查询：\n\n```php\n<?php\n// [..]\n/**\n * @OneToOne(targetEntity=\"\
    Entity\\ContactData\", fetch=\"EAGER\")\n */\nprivate $contactData;\n```\n\n通过使用\
    \ `fetch=\"EAGER\"`，我们告诉 Doctrine 2 在加载 `User` 本身时始终加载引用的 `ContactData` 实体。\n\n\
    加载策略有时很有优势，特别是在流程后期可能会访问引用实体的情况下。如果省略 `fetch` 属性，Doctrine 2 默认使用 `LAZY`，这意味着它会在首次访问时加载实体。第三个选项是\
    \ `EXTRA_LAZY`，它对大型数据集很有帮助。即使决定对引用实体进行懒加载，引用的实体仍然会全部加载到 RAM 中。根据引用实体的数量和大小，这可能会成为严重的性能问题。当使用\
    \ `EXTRA_LAZY` 时，可以在引用实体的集合上执行多个方法，而无需立即将它们全部加载到 RAM 中。这适用于：\n\n*   `contains()`\n\
    *   `count()`\n*   `offsetSet()`\n*   `add()`\n*   `count()`\n*   `slice()`\n\n\
    这样，例如，可以构建一个分页功能而不会出现性能问题。\n\n## 7.3 修改现有实体\n\n修改已加载的现有实体很容易。在刷新实体管理器时，Doctrine\
    \ 2 会自动检测对该实体所做的所有更改：\n\n```php\n<?php\n// [..]\n$post = $em->getRepository('Entity\\\
    Post')->find(1);\n$post->setTitle(\"New title\");\n$em->flush();\n```\n\n无需再次明确告知\
    \ Doctrine 2 该实体已更改。不需要在实体管理器上再次调用 `persist($entity)` 方法。\n\n## 7.4 删除实体\n\n如果可以获取已加载实体的句柄，可以通过实体管理器轻松删除现有实体：\n\
    \n```php\n<?php\n$em->remove($post);\n$em->flush();\n```\n\n除非调用了 `flush()`，否则不会发出物理删除数据库中记录所需的\
    \ SQL 语句。\n\n## 7.5 排序关联\n\n通过关联访问实体时，检索到的实体顺序是未定义的。作为实体映射定义的一部分，可以使用 `@OrderBy`\
    \ 注解定义实体的顺序。如果回到我们的演示应用程序，可以通过修改 `User` 实体中的映射配置，定义 `User` 的 `Post`s 的顺序，使最新的\
    \ `Post` 在其 `Post` 列表中首先显示：\n\n```php\n<?php\nnamespace Entity;\n\n/**\n * @Entity\n\
    \ * @Table(name=\"users\")\n */\nclass User\n{\n\t// [..]\n\t\n\t/**\n\t * @OneToMany(targetEntity=\"\
    Entity\\Post\", mappedBy=\"user\")\n\t * @OrderBy({\"id\" = \"DESC\"})\n\t */\n\
    \tprivate $posts;\n\t\n\t// [..]\n}\n```\n\n或者，也可以在从数据库检索实体后使用 PHP 对集合进行排序。\n\n\
    ## 7.6 删除关联\n\n删除关联与删除实体一样简单：\n\n```php\n<?php\n$newPost = new \\Entity\\Post();\n\
    $newPost->setTitle('A new post!');\n$newPost->setContent('This is the body of\
    \ the new post.');\n$user = $em->getRepository('Entity\\User')->findOneById(1);\n\
    $newPost->setUser($user);\n$em->flush();\n\n$newPost->setUser(null);\n$em->flush();\n\
    ```\n\n在上面的示例中，首先创建一个新的 `Post` 实体。然后，加载一个现有的 `User` 实体并将其与新帖子关联。刷新后，引用已持久化到数据库。接下来，通过将\
    \ `User` 设置为 `null` 来再次删除关联。下一次刷新后，数据库中的引用已消失。\n\n需要记住的是，我们在 `User` 和其 `Post`s\
    \ 之间建立了双向关系，而 `Post` 实体是关联的拥有方。例如，如果取 `User` 实体并从其集合 `$posts` 中删除 `Post`，刷新时不会发生任何事情：\n\
    \n```php\n<?php\n// [..]\n$user->getPosts()->removeElement($newPost);\n$em->flush();\n\
    ```\n\n`removeElement()` 方法用于从给定的 Doctrine 2 集合中删除基于已加载实体的元素，但没有达到预期效果。然而，确实有一个效果。虽然更改不会被持久化，但元素已从内存中的集合中删除。在集合中查找时，将找不到该元素。\n\
    \n## 7.7 生命周期事件\n\n使用实体时，Doctrine 2 会触发多个事件：\n\n*   **preRemove**: 在为给定实体执行相应的\
    \ EntityManager 删除操作之前发生。\n*   **postRemove**: 在实体被删除后发生。它将在数据库删除操作之后调用。\n*  \
    \ **prePersist**: 在为给定实体执行相应的 EntityManager 持久化操作之前发生。\n*   **postPersist**: 在实体已被持久化后发生。它将在数据库插入操作之后调用。\n\
    *   **preUpdate**: 在对实体数据执行数据库更新操作之前发生。\n*   **postUpdate**: 在对实体数据执行数据库更新操作之后发生。\n"
