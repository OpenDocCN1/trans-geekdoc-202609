  trans: "\n\n上面所示的代码会对 ID 值为 `1` 的 `Post` 实体进行两次修改。在两次更改都应用后，`value` 列的值为 `3`。`$em->clear()`\
    \ 语句在这里很重要：如果省略它，我们就会自己产生一个 `OptimisticLockException`。原因是，将标题更改为“New title”并刷新实体管理器会在数据库中将该实体的版本值加一。然而，RAM\
    \ 中 `Post` 实体对象中存储的值仍然是旧值 `1`，因此现在已过时——它不会自动更新到最新的版本值。因此，再次尝试修改标题会因 `OptimisticLockException`\
    \ 而失败。如果我们尝试持久化对实体的更改，而该实体在此期间已被其他人修改，情况也是如此。如何处理 `OptimisticLockException` 情况，完全取决于应用程序开发者。\n\
    \n## 8 Doctrine 查询语言\n\n### 8.1 简介\n\n在本书前面部分，我们学习了仓库，即特定类型实体的容器。它们用于根据特定条件查找实体、执行更新或删除等操作。它们借助查找器方法来完成工作，这些查找器方法是使用\
    \ Doctrine 自身的实体查询语言 DQL（Doctrine 查询语言）实现的。确切地说，DQL 不绑定于查找器方法或仓库，不过，通常人们主要希望将所有\
    \ DQL 语句都放在那里，以保持条理清晰。\n\nDQL 本身是一种用于查询实体的语言。它看起来很像 SQL——这使得学习 DQL 更容易——但它不是 SQL。虽然\
    \ DQL 语句可以像这样写成字符串：\n\n```\n<?php\n// [..]\n$query = $em->createQuery(\n\t'SELECT\
    \ u FROM Entity\\User u WHERE u.lastName = \"Mustermann\"'\n);\n\n$users = $query->getResult();\
    \  \n```\n\n但使用 `query builder` 更加方便，尤其是在构建动态查询时：\n\n```\n<?php\n// [..]\n$qb\
    \ = $this->_em->createQueryBuilder();\n\n$qb->select('u')\n\t->from('Entity\\\
    User', 'u')\n\t->where($qb->expr()->eq('u.lastName', '?1'))\n\t->setParameter(1,\
    \ \"Mustermann\");\n\n$users = $qb->getQuery()->getResult();\n```\n\n我们假设 `$this->_em`\
    \ 持有对实体管理器的引用（对于每个扩展 `Doctrine\\ORM\\EntityRepository` 的仓库都是如此）。实体管理器能够提供查询构建器，而查询构建器又可以用于以编程方式构建查询。得益于其流畅的接口，代码看起来非常优雅。与第一个示例相比，我们还使用了值参数和\
    \ `Expr` 类，我们将在一分钟后详细介绍。\n\n### 8.2 检索结果\n\n执行查询时，有多种检索结果的选项。在查询对象上调用 `getResult()`\
    \ 时，会返回一个包含所有匹配实体对象的 PHP 数组。或者，可以使用 `getArrayResult()` 以数组形式获取所有数据。不会返回对象，只会返回一个容器数组中包含的所有实体数据数组。在处理较大数据集或不需要对象进行处理的简单显示任务时，这非常有用。`getScalarResult()`\
    \ 会创建类似的结果，但完全是扁平的，完全不嵌套。当只需要单个结果时，调用 `getSingleResult()` 或 `getSingleScalarResult()`\
    \ 即可。如果在未找到匹配项时希望返回 null，可以使用 `getOneOrNullResult()` 方法。\n\n如果查询选择的不仅仅是实体，那么返回的结果集就是所谓的“混合”结果——它既包含对象，也包含标量值：\n\
    \n```\n<?php\n// [..]\n$qb = $this->_em->createQueryBuilder();\n\n$qb->select('u')\n\
    \t->addSelect($qb->expr()->concat('u.firstName', 'u.lastName'))\n\t->from('Entity\\\
    User', 'u')\n\t->where($qb->expr()->eq('u.lastName', '?1'))\n\t->setParameter(1,\
    \ \"Mustermann\");\n\n$users = $qb->getQuery()->getResult();\n```\n\n在这个查询中，我们不仅检索实体，还将用户的名和姓连接起来。查询结果如下所示：\n\
    \n```\narray \n\t[0]\n\t\t[0] => Object\n\t\t[1] => \"Max Mustermann\"\n\t[1]\n\
    \t\t// ..\n```\n\n通过 `setFirstResult($offset)` 和 `setMaxResults($limit)` 可以限制结果集，例如在构建分页功能时。\n\
    \nDoctrine 2 提供的另一个功能是检索部分对象，即仅从数据库部分重建的实体。要检索部分对象，需要使用特殊语法：\n\n```\n<?php\n//\
    \ [..]\n$qb = $this->_em->createQueryBuilder();\n\n$qb->select('partial u.{id,\
    \ firstName}')\n\t->from('Entity\\User', 'u')\n\t->where($qb->expr()->eq('u.lastName',\
    \ '?1'))\n\t->setParameter(1, \"Mustermann\");\n\n$users = $qb->getQuery()->getResult();\n\
    ```\n\n这样，我们会得到 `User` 对象，它们是从数据库部分重建的。如果省略 `partial` 语法而仅列出单个字段，否则结果将是一个不含对象的普通数组：\n\
    \n```\narray(1) { \n\t[0]=> \n\t\tarray(2) { \n\t\t\t[\"id\"]=> int(1) \n\t\t\t\
    [\"firstName\"]=> string(3) \"Max\" \n\t\t} \n}\n```\n\n在部分对象定义中始终包含标识符（本例中为 `id`）非常重要。否则会抛出异常。\n\
    \n虽然部分对象非常有用，例如在调整应用程序性能时，但也可能带来问题。处理部分对象的代码需要意识到，返回的不是“真实”实体，某些字段或关联可能不可用。必须小心使用部分对象。\n\
    \n### 8.3 构建基本查询\n\n查询构建器为查询的不同部分提供了方法，例如上面所示的方法：\n\n*   `public function select($select\
    \ = null);`\n*   `public function delete($delete = null, $alias = null);`\n* \
    \  `public function update($update = null, $alias = null);`\n*   `public function\
    \ set($key, $value);`\n*   `public function from($from, $alias = null);`\n*  \
    \ `public function where($where);`\n*   `public function andWhere($where);`\n\
    *   `public function orWhere($where);`\n*   `public function groupBy($groupBy);`\n\
    *   `public function addGroupBy($groupBy);`\n*   `public function having($having);`\n\
    *   `public function andHaving($having);`\n*   `public function orHaving($having);`\n\
    *   `public function orderBy($sort, $order = null);`\n*   `public function addOrderBy($sort,\
    \ $order = null);`\n\n像上面所示的表达式是使用 `Expr` 对象构建的，该对象在调用查询构建器的 `expr()` 方法时提供。`Expr`\
    \ 对象提供多种方法来构建表达式：\n\n*   `public function andX($x = null);`\n*   `public function\
    \ orX($x = null);`\n*   `public function eq($x, $y);`\n*   `public function neq($x,\
    \ $y);`\n*   `public function lt($x, $y);`\n*   `public function lte($x, $y);`\n\
    *   `public function gt($x, $y);`\n*   `public function gte($x, $y);`\n*   `public\
    \ function isNull($x);`\n*   `public function isNotNull($x);`\n*   `public function\
    \ prod($x, $y);`\n*   `public function diff($x, $y);`\n*   `public function sum($x,\
    \ $y);`\n*   `public function quot($x, $y);`\n*   `public function exists($subquery);`\n\
    *   `public function all($subquery);`\n*   `public function some($subquery);`\n\
    *   `public function any($subquery);`\n*   `public function not($restriction);`\n\
    *   `public function in($x, $y);`\n*   `public function notIn($x, $y);`\n*   `public\
    \ function like($x, $y);`\n*   `public function between($val, $x, $y);`\n*   `public\
    \ function trim($x);`\n*   `public function concat($x, $y);`\n*   `public function\
    \ substr($x, $from, $len);`\n*   `public function lower($x);`\n*   `public function\
    \ upper($x);`\n*   `public function length($x);`\n*   `public function avg($x);`\n\
    *   `public function max($x);`\n*   `public function min($x);`\n*   `public function\
    \ abs($x);`\n*   `public function sqrt($x);`\n*   `public function count($x);`\n\
    *   `public function countDistinct($x);`\n\n"
