- raw: "Simply adding `@Entity` without additional configuration means that Doctrine\
    \ 2 looks for a database table named `user` in this case. If the table has another\
    \ name, this can be configured like this:\n\n```\n1 <?php\n2 /**\n3 * @Entity\n\
    4 * @Table(name=\"users\")\n5 */\n6 class User\n7 {\n8 \t// [..]\n9 }\n```\n\n\
    The optional attribute `indexes` of the `@Table` annotation can be used to create\
    \ indexes automatically using Doctrine’s schema tool that we will discuss later\
    \ in the book. For now, one should remember that this attribute has no meaning\
    \ during runtime. Some persistence metadata is important only in conjunction with\
    \ “offline” tools like the schema tool, while other metadata is evaluated during\
    \ runtime. An index definition to the users table goes like this:\n\n```\n 1 <?php\n\
    \ 2 /**\n 3 * @Entity\n 4 * @Table(name=\"users\",\n 5 *\tindexes={@Index(name=\"\
    search_idx\", columns={\"name\", \"email\"})}\n 6 * )\n 7 */\n 8 class User\n\
    \ 9 {\n10 \t// [..]\n11 }\n```\n\nThe `indexes` attribute of annotation `@Table`\
    \ itself has an annotation with attributes as its value. The annotation `@Index`\
    \ needs the attribute `name` (name of the index) and the list of columns to be\
    \ considered. Multiple values may be given using curly braces.\n\nThe same applies\
    \ to another optional attribute called `uniqueConstraints` which defines special\
    \ unique values indexes:\n\n```\n 1 <?php\n 2 /**\n 3 * @Entity\n 4 * @Table(name=\"\
    users\",\n 5 * \tuniqueConstraints={@UniqueConstraint(name=\"user_unique\",\n\
    \ 6 * \t\tcolumns={\"username\"})}, \n 7 *\tindexes={@Index(name=\"user_idx\"\
    , columns={\"email\"})}\n 8 * )\n 9 */\n10 class User \n11 {\n12 \t// [..] \n\
    13 } \n```\n\n### 5.3 Mapping scalar member variables to fields\n\nMapping scalar-valued\
    \ member variables (e.g. numbers or strings) to a database table is super simple:\n\
    \n```\n1 <?php\n2 \n3 // [..]\n4 \n5 /** @Column(type=\"string\") */\n6 private\
    \ $lastName;\n```\n\nFirst, it’s important that all member variables mapped to\
    \ database fields are declared as `private` or `protected`. Doctrine 2 often applies\
    \ a technique called “lazy loading” which means that data is loaded just in the\
    \ moment its needed, but not earlier. To make this happen, Doctrine 2 implements\
    \ so-called *proxy objects* which rely on the entities’ getter methods. Therefore,\
    \ one will want to make sure they are set-up.\n\nThe main annotation here is `@Column`.\
    \ Its attribute `type` is the only mandatory attribute and is important to make\
    \ persistence work correctly. If a wrong type is defined, one may lose information\
    \ on saving to or while reading from the database. In addition, there is a bunch\
    \ of other optional attributes like `name`, which allows to configure the table\
    \ column name. It defaults to the name of the member variable. The attribute `length`\
    \ only is needed for “strings” and it defines the max length of a string value.\
    \ It defaults to 255 if not defined differently. If one encounters truncated values\
    \ in the database, a wrong `length` configuration often is the root cause.\n\n\
    The attributes `precision` and `scale` are only valid for values of type “decimal”,\
    \ while `unique` ensures uniqueness and `nullable` tells Doctrine 2, if value\
    \ `NULL` is allowed (`true`) or not (`false`):\n\n```\n1 <?php\n2 \n3 // [..]\n\
    4 \n5 /**\n6 * @Column(type=\"string\", \n7 * \tname=\"last_name\", length=32,\
    \ unique=true, nullable=false)\n8 */\n9 protected $lastName;\n```\n\n#### 5.3.1\
    \ Data types\n\nDoctrine 2 ships with a set of data types. They map the PHP data\
    \ types to the SQL data types. All Doctrine 2 data types are compatible to the\
    \ most common database systems:\n\n*   string: Type that maps an SQL VARCHAR to\
    \ a PHP string.\n\n*   integer: Type that maps an SQL INT to a PHP integer.\n\n\
    *   smallint: Type that maps a database SMALLINT to a PHP integer.\n\n*   bigint:\
    \ Type that maps a database BIGINT to a PHP string.\n\n*   boolean: Type that\
    \ maps an SQL boolean to a PHP boolean.\n\n*   decimal: Type that maps an SQL\
    \ DECIMAL to a PHP double.\n\n*   date: Type that maps an SQL DATETIME to a PHP\
    \ DateTime object.\n\n*   time: Type that maps an SQL TIME to a PHP DateTime object.\n\
    \n*   datetime: Type that maps an SQL DATETIME/TIMESTAMP to a PHP DateTime object.\n\
    \n*   text: Type that maps an SQL CLOB to a PHP string.\n\n*   object: Type that\
    \ maps a SQL CLOB to a PHP object using serialize() and unserialize()\n\n*   array:\
    \ Type that maps a SQL CLOB to a PHP object using serialize() and unserialize()\n\
    \n*   float: Type that maps a SQL Float (Double Precision) to a PHP double. IMPORTANT:\
    \ Works only with locale settings that use decimal points as separator.\n\n| ![information](images/leanpub_information.png)\
    \ || \n\n#### Custom data types\n\nIf needed, one may define custom data types,\
    \ mappings between PHP data types and SQL data types. The [official documentation\
    \ covers this topic in depth.](http://docs.doctrine-project.org/en/latest/reference/basic-mapping.html#custom-mapping-types)\
    \ |\n\n| --- | --- |\n\n#### 5.3.2 Entity identifier\n\nAn entity class must define\
    \ a unique identifier. The `@Id` annotation is used for this:\n\n```\n1 <?php\n\
    2 \n3 // [..]\n4 \n5 /**\n6 * @Id @Column(type=\"integer\")\n7 */\n8 private $id;\n\
    ```\n\nIf the `@GeneratedValue` annotation is used as well, the unique identifier\
    \ doesn’t need to be given by the application developer but is assigned automatically\
    \ be the database system. The way this value is generated depends on the “strategy”\
    \ defined. By default, Doctrine 2 identifies the best approach on its own. When\
    \ using MySQL for instance, Doctrine 2 uses the `auto_increment` function. There\
    \ are additional strategies that can be used, however, mainly they don’t work\
    \ cross-platform and therefore should be avoided.\n\nBy the way: The `@Id` annotation\
    \ can be used with multiple member variables to define composite keys. Clearly,\
    \ the `@GeneratedValue` annotation can then not be used anymore. In this case,\
    \ the application developer needs to take care of assigning unique keys.\n\n###\
    \ 5.4 Inheritance\n\nDoctrine 2 supports persistence of hereditary structures\
    \ with three different strategies:\n\n*   Single Table Inheritance\n\n*   Class\
    \ Table Inheritance\n\n*   Mapped Superclass\n\n#### 5.4.1 Single Table Inheritance\n\
    \nThe *single table inheritance* strategy uses a single database table with a\
    \ so-called “discriminator column” to differentiate between the different types.\
    \ All classes of a hierarchy go into the same table. Let’s say our demo application\
    \ differentiates between different types of posts. The supported types are:\n\n\
    *   `Post`: A simple, text based post.\n\n*   `ImagePost`: A post with text and\
    \ image.\n\n*   `VideoPost`: A post with text and video.\n\nBoth, `ImagePost`\
    \ and `VideoPost`, extend `Post` and add an image or video URL. To set up this\
    \ hierarchy, the topmost `Post` class holds the configuration needed as well as\
    \ all member variables and associations that are shared between the three types:\n\
    \n```\n 1 <?php\n 2 namespace Entity;\n 3 \n 4 /**\n 5 * @Entity(repositoryClass=\"\
    Repository\\Post\")\n 6 * @Table(name=\"posts\")\n 7 * @InheritanceType(\"SINGLE_TABLE\"\
    )\n 8 * @DiscriminatorColumn(name=\"discr\", type=\"string\")\n 9 * @DiscriminatorMap({\"\
    text\"=\"Post\",\"video\"=\"VideoPost\",\"image\"= \"ImagePost\"})\n10 */\n11\
    \ class Post\n12 {\n13 \t// member variables and associations shared between all\
    \ types\n14 }\n```\n\nSince the `Post` itself can be an entity, it has the typical\
    \ entity-related annotations. In addition, via the `@InheritanceType` annotation,\
    \ it configures single table inheritance. The `@DiscriminatorColumn` annotation\
    \ is used to label the column which indicates the type persisted. Lastly, via\
    \ the `@DiscriminatorMap`, the values are defined which can be present in the\
    \ discriminator column. In our case, Doctrine 2 writes “text” into the discriminator\
    \ column, if the entity is a `Post`. If the entity is a `VideoPost`, Doctrine\
    \ 2 writes “video” and if the entity is a `ImagePost` the value used is “image”.\n\
    \nThe `ImagePost` itself is straight-forward:"
  fmt: "\nSimply adding `@Entity` without additional configuration means that Doctrine\
    \ 2 looks for a database table named `user` in this case. If the table has another\
    \ name, this can be configured like this:\n\n```\n<?php\n/**\n * @Entity\n * @Table(name=\"\
    users\")\n */\nclass User\n{\n\t// [..]\n}\n```\n\nThe optional attribute `indexes`\
    \ of the `@Table` annotation can be used to create indexes automatically using\
    \ Doctrine’s schema tool that we will discuss later in the book. For now, one\
    \ should remember that this attribute has no meaning during runtime. Some persistence\
    \ metadata is important only in conjunction with “offline” tools like the schema\
    \ tool, while other metadata is evaluated during runtime. An index definition\
    \ to the users table goes like this:\n\n```\n<?php\n/**\n * @Entity\n * @Table(name=\"\
    users\",\n *\tindexes={@Index(name=\"search_idx\", columns={\"name\", \"email\"\
    })}\n * )\n */\nclass User\n{\n\t// [..]\n}\n```\n\nThe `indexes` attribute of\
    \ annotation `@Table` itself has an annotation with attributes as its value. The\
    \ annotation `@Index` needs the attribute `name` (name of the index) and the list\
    \ of columns to be considered. Multiple values may be given using curly braces.\n\
    \nThe same applies to another optional attribute called `uniqueConstraints` which\
    \ defines special unique values indexes:\n\n```\n<?php\n/**\n * @Entity\n * @Table(name=\"\
    users\",\n * \tuniqueConstraints={@UniqueConstraint(name=\"user_unique\",\n *\
    \ \t\tcolumns={\"username\"})}, \n *\tindexes={@Index(name=\"user_idx\", columns={\"\
    email\"})}\n * )\n */\nclass User \n{\n\t// [..] \n} \n```\n\n### 5.3 Mapping\
    \ scalar member variables to fields\n\nMapping scalar-valued member variables\
    \ (e.g. numbers or strings) to a database table is super simple:\n\n```\n<?php\n\
    \n// [..]\n\n/** @Column(type=\"string\") */\nprivate $lastName;\n```\n\nFirst,\
    \ it’s important that all member variables mapped to database fields are declared\
    \ as `private` or `protected`. Doctrine 2 often applies a technique called “lazy\
    \ loading” which means that data is loaded just in the moment its needed, but\
    \ not earlier. To make this happen, Doctrine 2 implements so-called `proxy objects`\
    \ which rely on the entities’ getter methods. Therefore, one will want to make\
    \ sure they are set-up.\n\nThe main annotation here is `@Column`. Its attribute\
    \ `type` is the only mandatory attribute and is important to make persistence\
    \ work correctly. If a wrong type is defined, one may lose information on saving\
    \ to or while reading from the database. In addition, there is a bunch of other\
    \ optional attributes like `name`, which allows to configure the table column\
    \ name. It defaults to the name of the member variable. The attribute `length`\
    \ only is needed for “strings” and it defines the max length of a string value.\
    \ It defaults to 255 if not defined differently. If one encounters truncated values\
    \ in the database, a wrong `length` configuration often is the root cause.\n\n\
    The attributes `precision` and `scale` are only valid for values of type “decimal”,\
    \ while `unique` ensures uniqueness and `nullable` tells Doctrine 2, if value\
    \ `NULL` is allowed (`true`) or not (`false`):\n\n```\n<?php\n\n// [..]\n\n/**\n\
    \ * @Column(type=\"string\", \n * \tname=\"last_name\", length=32, unique=true,\
    \ nullable=false)\n */\nprotected $lastName;\n```\n\n#### 5.3.1 Data types\n\n\
    Doctrine 2 ships with a set of data types. They map the PHP data types to the\
    \ SQL data types. All Doctrine 2 data types are compatible to the most common\
    \ database systems:\n\n*   `string`: Type that maps an SQL VARCHAR to a PHP string.\n\
    \n*   `integer`: Type that maps an SQL INT to a PHP integer.\n\n*   `smallint`:\
    \ Type that maps a database SMALLINT to a PHP integer.\n\n*   `bigint`: Type that\
    \ maps a database BIGINT to a PHP string.\n\n*   `boolean`: Type that maps an\
    \ SQL boolean to a PHP boolean.\n\n*   `decimal`: Type that maps an SQL DECIMAL\
    \ to a PHP double.\n\n*   `date`: Type that maps an SQL DATETIME to a PHP DateTime\
    \ object.\n\n*   `time`: Type that maps an SQL TIME to a PHP DateTime object.\n\
    \n*   `datetime`: Type that maps an SQL DATETIME/TIMESTAMP to a PHP DateTime object.\n\
    \n*   `text`: Type that maps an SQL CLOB to a PHP string.\n\n*   `object`: Type\
    \ that maps a SQL CLOB to a PHP object using `serialize()` and `unserialize()`\n\
    \n*   `array`: Type that maps a SQL CLOB to a PHP object using `serialize()` and\
    \ `unserialize()`\n\n*   `float`: Type that maps a SQL Float (Double Precision)\
    \ to a PHP double. IMPORTANT: Works only with locale settings that use decimal\
    \ points as separator.\n\n| ![information](images/leanpub_information.png) ||\
    \ \n\n#### Custom data types\n\nIf needed, one may define custom data types, mappings\
    \ between PHP data types and SQL data types. The [official documentation covers\
    \ this topic in depth.](http://docs.doctrine-project.org/en/latest/reference/basic-mapping.html#custom-mapping-types)\
    \ |\n\n| --- | --- |\n\n#### 5.3.2 Entity identifier\n\nAn entity class must define\
    \ a unique identifier. The `@Id` annotation is used for this:\n\n```\n<?php\n\n\
    // [..]\n\n/**\n * @Id @Column(type=\"integer\")\n */\nprivate $id;\n```\n\nIf\
    \ the `@GeneratedValue` annotation is used as well, the unique identifier doesn’t\
    \ need to be given by the application developer but is assigned automatically\
    \ be the database system. The way this value is generated depends on the “strategy”\
    \ defined. By default, Doctrine 2 identifies the best approach on its own. When\
    \ using MySQL for instance, Doctrine 2 uses the `auto_increment` function. There\
    \ are additional strategies that can be used, however, mainly they don’t work\
    \ cross-platform and therefore should be avoided.\n\nBy the way: The `@Id` annotation\
    \ can be used with multiple member variables to define composite keys. Clearly,\
    \ the `@GeneratedValue` annotation can then not be used anymore. In this case,\
    \ the application developer needs to take care of assigning unique keys.\n\n###\
    \ 5.4 Inheritance\n\nDoctrine 2 supports persistence of hereditary structures\
    \ with three different strategies:\n\n*   Single Table Inheritance\n\n*   Class\
    \ Table Inheritance\n\n*   Mapped Superclass\n\n#### 5.4.1 Single Table Inheritance\n\
    \nThe `single table inheritance` strategy uses a single database table with a\
    \ so-called “discriminator column” to differentiate between the different types.\
    \ All classes of a hierarchy go into the same table. Let’s say our demo application\
    \ differentiates between different types of posts. The supported types are:\n\n\
    *   `Post`: A simple, text based post.\n\n*   `ImagePost`: A post with text and\
    \ image.\n\n*   `VideoPost`: A post with text and video.\n\nBoth, `ImagePost`\
    \ and `VideoPost`, extend `Post` and add an image or video URL. To set up this\
    \ hierarchy, the topmost `Post` class holds the configuration needed as well as\
    \ all member variables and associations that are shared between the three types:\n\
    \n```\n<?php\nnamespace Entity;\n\n/**\n * @Entity(repositoryClass=\"Repository\\\
    Post\")\n * @Table(name=\"posts\")\n * @InheritanceType(\"SINGLE_TABLE\")\n *\
    \ @DiscriminatorColumn(name=\"discr\", type=\"string\")\n * @DiscriminatorMap({\"\
    text\"=\"Post\",\"video\"=\"VideoPost\",\"image\"= \"ImagePost\"})\n */\nclass\
    \ Post\n{\n\t// member variables and associations shared between all types\n}\n\
    ```\n\nSince the `Post` itself can be an entity, it has the typical entity-related\
    \ annotations. In addition, via the `@InheritanceType` annotation, it configures\
    \ single table inheritance. The `@DiscriminatorColumn` annotation is used to label\
    \ the column which indicates the type persisted. Lastly, via the `@DiscriminatorMap`,\
    \ the values are defined which can be present in the discriminator column. In\
    \ our case, Doctrine 2 writes “text” into the discriminator column, if the entity\
    \ is a `Post`. If the entity is a `VideoPost`, Doctrine 2 writes “video” and if\
    \ the entity is a `ImagePost` the value used is “image”.\n\nThe `ImagePost` itself\
    \ is straight-forward:\n"
  trans: "\n\n简单地添加 `@Entity` 而不进行额外配置，意味着 Doctrine 2 在这种情况下会查找名为 `user` 的数据库表。如果表有其他名称，可以这样配置：\n\
    \n```\n<?php\n/**\n * @Entity\n * @Table(name=\"users\")\n */\nclass User\n{\n\
    \t// [..]\n}\n```\n\n`@Table` 注解的可选属性 `indexes` 可以用于使用 Doctrine 的架构工具自动创建索引，我们将在本书后面讨论该工具。目前，应记住此属性在运行时没有意义。某些持久化元数据仅在与“离线”工具（如架构工具）结合使用时才重要，而其他元数据则在运行时被评估。对\
    \ users 表的索引定义如下：\n\n```\n<?php\n/**\n * @Entity\n * @Table(name=\"users\",\n\
    \ *\tindexes={@Index(name=\"search_idx\", columns={\"name\", \"email\"})}\n *\
    \ )\n */\nclass User\n{\n\t// [..]\n}\n```\n\n注解 `@Table` 本身的 `indexes` 属性本身具有一个带有属性作为其值的注解。注解\
    \ `@Index` 需要属性 `name`（索引名称）和要考虑的列列表。可以使用花括号给出多个值。\n\n另一个可选属性 `uniqueConstraints`\
    \ 也适用同样的情况，它定义特殊的唯一值索引：\n\n```\n<?php\n/**\n * @Entity\n * @Table(name=\"users\"\
    ,\n * \tuniqueConstraints={@UniqueConstraint(name=\"user_unique\",\n * \t\tcolumns={\"\
    username\"})}, \n *\tindexes={@Index(name=\"user_idx\", columns={\"email\"})}\n\
    \ * )\n */\nclass User \n{\n\t// [..] \n} \n```\n\n### 5.3 将标量成员变量映射到字段\n\n将标量值成员变量（例如数字或字符串）映射到数据库表非常简单：\n\
    \n```\n<?php\n\n// [..]\n\n/** @Column(type=\"string\") */\nprivate $lastName;\n\
    ```\n\n首先，重要的是所有映射到数据库字段的成员变量都声明为 `private` 或 `protected`。Doctrine 2 经常应用一种称为“惰性加载”的技术，这意味着数据仅在需要时加载，而不是更早。为了实现这一点，Doctrine\
    \ 2 实现了所谓的 `proxy objects`，它们依赖于实体的 getter 方法。因此，需要确保它们已正确设置。\n\n这里的主要注解是 `@Column`。其属性\
    \ `type` 是唯一的强制属性，对于正确持久化非常重要。如果定义了错误的类型，可能会在保存到数据库或从数据库读取时丢失信息。此外，还有许多其他可选属性，例如\
    \ `name`，它允许配置表列名称。默认情况下，它为成员变量的名称。属性 `length` 仅用于“字符串”，它定义字符串值的最大长度。如果未另行定义，则默认为\
    \ 255。如果在数据库中遇到截断的值，错误的 `length` 配置通常是根本原因。\n\n属性 `precision` 和 `scale` 仅对类型为“decimal”的值有效，而\
    \ `unique` 确保唯一性，`nullable` 告诉 Doctrine 2 是否允许值 `NULL`（`true`）或不允许（`false`）：\n\
    \n```\n<?php\n\n// [..]\n\n/**\n * @Column(type=\"string\", \n * \tname=\"last_name\"\
    , length=32, unique=true, nullable=false)\n */\nprotected $lastName;\n```\n\n\
    #### 5.3.1 数据类型\n\nDoctrine 2 自带一组数据类型。它们将 PHP 数据类型映射到 SQL 数据类型。所有 Doctrine 2\
    \ 数据类型都与最常见的数据库系统兼容：\n\n*   `string`: 将 SQL VARCHAR 映射到 PHP 字符串的类型。\n\n*   `integer`:\
    \ 将 SQL INT 映射到 PHP 整数的类型。\n\n*   `smallint`: 将数据库 SMALLINT 映射到 PHP 整数的类型。\n\n\
    *   `bigint`: 将数据库 BIGINT 映射到 PHP 字符串的类型。\n\n*   `boolean`: 将 SQL 布尔值映射到 PHP 布尔值的类型。\n\
    \n*   `decimal`: 将 SQL DECIMAL 映射到 PHP double 的类型。\n\n*   `date`: 将 SQL DATETIME\
    \ 映射到 PHP DateTime 对象的类型。\n\n*   `time`: 将 SQL TIME 映射到 PHP DateTime 对象的类型。\n\n\
    *   `datetime`: 将 SQL DATETIME/TIMESTAMP 映射到 PHP DateTime 对象的类型。\n\n*   `text`:\
    \ 将 SQL CLOB 映射到 PHP 字符串的类型。\n\n*   `object`: 使用 `serialize()` 和 `unserialize()`\
    \ 将 SQL CLOB 映射到 PHP 对象的类型。\n\n*   `array`: 使用 `serialize()` 和 `unserialize()`\
    \ 将 SQL CLOB 映射到 PHP 对象的类型。\n\n*   `float`: 将 SQL Float（双精度）映射到 PHP double 的类型。重要：仅适用于使用小数点作为分隔符的区域设置。\n\
    \n| ![information](img/leanpub_information.png) || \n\n#### 自定义数据类型\n\n如果需要，可以定义自定义数据类型，即\
    \ PHP 数据类型和 SQL 数据类型之间的映射。[官方文档深入介绍了此主题。](http://docs.doctrine-project.org/en/latest/reference/basic-mapping.html#custom-mapping-types)\
    \ |\n\n| --- | --- |\n\n#### 5.3.2 实体标识符\n\n实体类必须定义唯一标识符。`@Id` 注解用于此目的：\n\n```\n\
    <?php\n\n// [..]\n\n/**\n * @Id @Column(type=\"integer\")\n */\nprivate $id;\n\
    ```\n\n如果同时使用 `@GeneratedValue` 注解，则唯一标识符不需要由应用程序开发人员提供，而是由数据库系统自动分配。此值的生成方式取决于定义的“策略”。默认情况下，Doctrine\
    \ 2 会自行确定最佳方法。例如，使用 MySQL 时，Doctrine 2 使用 `auto_increment` 函数。还有其他可用的策略，但它们主要不支持跨平台，因此应避免使用。\n\
    \n顺便说一句：`@Id` 注解可以与多个成员变量一起用于定义复合键。显然，在这种情况下无法再使用 `@GeneratedValue` 注解。在这种情况下，应用程序开发人员需要负责分配唯一键。\n\
    \n### 5.4 继承\n\nDoctrine 2 支持使用三种不同的策略持久化遗传结构：\n\n*   单表继承\n\n*   类表继承\n\n*  \
    \ 映射超类\n\n#### 5.4.1 单表继承\n\n`单表继承` 策略使用一个带有所谓“鉴别列”的单个数据库表来区分不同的类型。层次结构中的所有类都进入同一个表。假设我们的演示应用程序区分不同类型的帖子。支持的类型有：\n\
    \n*   `Post`: 简单的基于文本的帖子。\n\n*   `ImagePost`: 带有文本和图像的帖子。\n\n*   `VideoPost`:\
    \ 带有文本和视频的帖子。\n\n`ImagePost` 和 `VideoPost` 都扩展 `Post` 并添加图像或视频 URL。要设置此层次结构，最顶层的\
    \ `Post` 类包含所需的配置以及三种类型共享的所有成员变量和关联：\n\n```\n<?php\nnamespace Entity;\n\n/**\n\
    \ * @Entity(repositoryClass=\"Repository\\Post\")\n * @Table(name=\"posts\")\n\
    \ * @InheritanceType(\"SINGLE_TABLE\")\n * @DiscriminatorColumn(name=\"discr\"\
    , type=\"string\")\n * @DiscriminatorMap({\"text\"=\"Post\",\"video\"=\"VideoPost\"\
    ,\"image\"= \"ImagePost\"})\n */\nclass Post\n{\n\t// member variables and associations\
    \ shared between all types\n}\n```\n\n由于 `Post` 本身可以是一个实体，它具有典型的实体相关注解。此外，通过 `@InheritanceType`\
    \ 注解，它配置单表继承。`@DiscriminatorColumn` 注解用于标记指示持久化类型的列。最后，通过 `@DiscriminatorMap`，定义了可以出现在鉴别列中的值。在我们的情况中，如果实体是\
    \ `Post`，Doctrine 2 将“text”写入鉴别列。如果实体是 `VideoPost`，Doctrine 2 写入“video”，如果实体是\
    \ `ImagePost`，则使用的值是“image”。\n\n`ImagePost` 本身很简单：\n\n"
