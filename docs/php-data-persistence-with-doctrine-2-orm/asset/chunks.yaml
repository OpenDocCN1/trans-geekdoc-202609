    \ class ImagePost extends Post\n 8 {\n 9 \t/** @Column(type=\"string\") */\n10\
    \ \tprotected $imageUrl;\n11 \n12 \t/**\n13 \t* @param mixed $imageUrl\n14 \t\
    */\n15 \tpublic function setImageUrl($imageUrl)\n16 \t{\n17 \t\t$this->imageUrl\
    \ = $imageUrl;\n18 \t}\n19 \n20 \t/**\n21 \t* @return mixed\n22 \t*/\n23 \tpublic\
