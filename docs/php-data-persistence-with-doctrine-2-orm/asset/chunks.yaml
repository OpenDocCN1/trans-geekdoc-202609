    \ Language，Doctrine 查询语言）的内容，它用于构建查询。\n\n## 7.2.2 使用关联\n\n假设我们已经有一个已加载的 `User`\
    \ 实体。我们可以不通过其仓库加载 `User` 的联系人数据，而是直接从给定的 `User` 实体访问该实体：\n\n```php\n<?php\nnamespace\
    \ Entity;\n\n/**\n * @Entity\n * @Table(name=\"users\")\n */\nclass User\n{\n\t\
    // [..]\n\n\t/**\n\t * @OneToOne(targetEntity=\"Entity\\ContactData\")\n\t */\n\
    \tprivate $contactData;\n\n\t// [..]\n\t\n\tpublic function getContactData()\n\
    \t{\n\t\treturn $this->contactData;\n\t}\n}\n```\n\n在这种情况下，调用 `getContactData()`\
    \ 时，引用的 `ContactData` 实体会由 Doctrine 的代理机制按需加载。\n\n我们甚至可以确保在加载 `User` 本身时，引用的 `ContactData`\
    \ 实体已经加载，从而节省一次额外的数据库查询：\n\n```php\n<?php\n// [..]\n/**\n * @OneToOne(targetEntity=\"\
    Entity\\ContactData\", fetch=\"EAGER\")\n */\nprivate $contactData;\n```\n\n通过使用\
    \ `fetch=\"EAGER\"`，我们告诉 Doctrine 2 在加载 `User` 本身时始终加载引用的 `ContactData` 实体。\n\n\
    加载策略有时很有优势，特别是在流程后期可能会访问引用实体的情况下。如果省略 `fetch` 属性，Doctrine 2 默认使用 `LAZY`，这意味着它会在首次访问时加载实体。第三个选项是\
    \ `EXTRA_LAZY`，它对大型数据集很有帮助。即使决定对引用实体进行懒加载，引用的实体仍然会全部加载到 RAM 中。根据引用实体的数量和大小，这可能会成为严重的性能问题。当使用\
    \ `EXTRA_LAZY` 时，可以在引用实体的集合上执行多个方法，而无需立即将它们全部加载到 RAM 中。这适用于：\n\n*   `contains()`\n\
    *   `count()`\n*   `offsetSet()`\n*   `add()`\n*   `count()`\n*   `slice()`\n\n\
    这样，例如，可以构建一个分页功能而不会出现性能问题。\n\n## 7.3 修改现有实体\n\n修改已加载的现有实体很容易。在刷新实体管理器时，Doctrine\
    \ 2 会自动检测对该实体所做的所有更改：\n\n```php\n<?php\n// [..]\n$post = $em->getRepository('Entity\\\
    Post')->find(1);\n$post->setTitle(\"New title\");\n$em->flush();\n```\n\n无需再次明确告知\
    \ Doctrine 2 该实体已更改。不需要在实体管理器上再次调用 `persist($entity)` 方法。\n\n## 7.4 删除实体\n\n如果可以获取已加载实体的句柄，可以通过实体管理器轻松删除现有实体：\n\
    \n```php\n<?php\n$em->remove($post);\n$em->flush();\n```\n\n除非调用了 `flush()`，否则不会发出物理删除数据库中记录所需的\
    \ SQL 语句。\n\n## 7.5 排序关联\n\n通过关联访问实体时，检索到的实体顺序是未定义的。作为实体映射定义的一部分，可以使用 `@OrderBy`\
    \ 注解定义实体的顺序。如果回到我们的演示应用程序，可以通过修改 `User` 实体中的映射配置，定义 `User` 的 `Post`s 的顺序，使最新的\
    \ `Post` 在其 `Post` 列表中首先显示：\n\n```php\n<?php\nnamespace Entity;\n\n/**\n * @Entity\n\
    \ * @Table(name=\"users\")\n */\nclass User\n{\n\t// [..]\n\t\n\t/**\n\t * @OneToMany(targetEntity=\"\
    Entity\\Post\", mappedBy=\"user\")\n\t * @OrderBy({\"id\" = \"DESC\"})\n\t */\n\
    \tprivate $posts;\n\t\n\t// [..]\n}\n```\n\n或者，也可以在从数据库检索实体后使用 PHP 对集合进行排序。\n\n\
    ## 7.6 删除关联\n\n删除关联与删除实体一样简单：\n\n```php\n<?php\n$newPost = new \\Entity\\Post();\n\
    $newPost->setTitle('A new post!');\n$newPost->setContent('This is the body of\
    \ the new post.');\n$user = $em->getRepository('Entity\\User')->findOneById(1);\n\
    $newPost->setUser($user);\n$em->flush();\n\n$newPost->setUser(null);\n$em->flush();\n\
    ```\n\n在上面的示例中，首先创建一个新的 `Post` 实体。然后，加载一个现有的 `User` 实体并将其与新帖子关联。刷新后，引用已持久化到数据库。接下来，通过将\
    \ `User` 设置为 `null` 来再次删除关联。下一次刷新后，数据库中的引用已消失。\n\n需要记住的是，我们在 `User` 和其 `Post`s\
    \ 之间建立了双向关系，而 `Post` 实体是关联的拥有方。例如，如果取 `User` 实体并从其集合 `$posts` 中删除 `Post`，刷新时不会发生任何事情：\n\
    \n```php\n<?php\n// [..]\n$user->getPosts()->removeElement($newPost);\n$em->flush();\n\
    ```\n\n`removeElement()` 方法用于从给定的 Doctrine 2 集合中删除基于已加载实体的元素，但没有达到预期效果。然而，确实有一个效果。虽然更改不会被持久化，但元素已从内存中的集合中删除。在集合中查找时，将找不到该元素。\n\
    \n## 7.7 生命周期事件\n\n使用实体时，Doctrine 2 会触发多个事件：\n\n*   **preRemove**: 在为给定实体执行相应的\
    \ EntityManager 删除操作之前发生。\n*   **postRemove**: 在实体被删除后发生。它将在数据库删除操作之后调用。\n*  \
    \ **prePersist**: 在为给定实体执行相应的 EntityManager 持久化操作之前发生。\n*   **postPersist**: 在实体已被持久化后发生。它将在数据库插入操作之后调用。\n\
    *   **preUpdate**: 在对实体数据执行数据库更新操作之前发生。\n*   **postUpdate**: 在对实体数据执行数据库更新操作之后发生。\n\
    \n"
