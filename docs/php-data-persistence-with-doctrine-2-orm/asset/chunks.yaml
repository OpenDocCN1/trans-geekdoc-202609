- raw: "The easiest way to use to Doctrine 2 with Zend Framework 2 (ZF2) is a Composer\
    \ based installation. The ZF2 module [doctrine-orm-module](https://github.com/doctrine/DoctrineORMModule)\
    \ not only ships the glue code to make both libraries work together, but also\
    \ ensure that the Doctrine 2 library itself is downloaded and installed in an\
    \ existing ZF2 application. One simply needs to add the following line to the\
    \ `require` block of the projects’ `composer.json`:\n\n```\n1 \"doctrine/doctrine-orm-module\"\
    : \"dev-master\"\n```\n\nAbove the `require` block the following line must also\
    \ be added:\n\n```\n1 \"minimum-stability\": \"alpha\"\n```\n\nIf this configuration\
    \ is missing, Composer might refuse to install the module. In fact, with this\
    \ configuration, we tell Composer to install even non-stable modules.\n\nThe following\
    \ commands start the download and the installation process:\n\n```\n1 $ php composer.phar\
    \ update\n```\n\nAs one can see, a whole bunch of other ZF2 modules and additional\
    \ libraries are downloaded.\n\nLast but not least two ZF2 modules must be activated\
    \ via the `application.config.php`:\n\n```\n 1 <?php\n 2 return array(\n 3 \t\
    'modules' => array(\n 4 \t\t'Application',\n 5 \t\t'DoctrineModule',\n 6 \t\t\
    'DoctrineORMModule'\n 7 \t),\n 8 \t'module_listener_options' => array(\n 9 \t\t\
    'config_glob_paths'    => array(\n10 \t\t\t'config/autoload/{,*.}{global,local}.php',\n\
    11 \t\t),\n12 \t\t'module_paths' => array(\n13 \t\t\t'./module',\n14 \t\t\t'./vendor',\n\
    15 \t\t),\n16 \t),\n17 );\n```\n\nThe modules register several services in Main\
    \ Service Manager, all starting with the label “doctrine”, e.g. `doctrine.cache.apc`\
    \ and `doctrine.sqlloggercollector.ormdefault`.\n\nThe entity manager can be obtained\
    \ using a long-winded label:\n\n```\n1 <?php\n2 // [..]\n3 $this->getServiceLocator()->get('doctrine.entitymanager.orm_default');\n\
    ```\n\nBut before this works, some additional configuration is need. Doctrine\
    \ 2 needs to know where the entity classes are located and what the caching strategy\
    \ looks like. The following example from the `module.php` tells Doctrine that\
    \ the mappings are given as annotation, the entities are located in `__DIR__ .\
    \ '/../src/Application/Entity'` and caching takes place via PHP arrays:\n\n```\n\
    \ 1 <?php\n 2 // [..]\n 3 'doctrine' => array(\n 4 \t'driver' => array(\n 5 \t\
    \t'my_annotation_driver' => array(\n 6 \t\t\t'class' => 'Doctrine\\ORM\\Mapping\\\
    Driver\\AnnotationDriver',\n 7 \t\t\t'cache' => 'array',\n 8 \t\t\t'paths' =>\
    \ array(__DIR__ . '/../src/Application/Entity')\n 9 \t\t)\n10 \t)\n11 )\n12 //\
    \ [..]\n```\n\nTo allow other ZF2 modules to provide entities to the application,\
    \ a so-called “Driver Chain” allow to combine multiple entity sources even with\
    \ different mapping formats and caching strategies:\n\n```\n 1 <?php\n 2 // [..]\n\
    \ 3 'doctrine' => array(\n 4 \t'driver' => array(\n 5 \t\t'my_annotation_driver'\
    \ => array(\n 6 \t\t\t'class' => 'Doctrine\\ORM\\Mapping\\Driver\\AnnotationDriver',\n\
    \ 7 \t\t\t'cache' => 'array',\n 8 \t\t\t'paths' => array(__DIR__ . '/../src/Application/Entity')\n\
    \ 9 \t\t),\n10 \t\t'orm_default' => array(\n11 \t\t\t'drivers' => array(\n12 \
    \                'Application\\Entity' => 'my_annotation_driver'\n13         \
    \    )\n14         )\n15 \t)\n16 )\n17 // [..]\n```\n\nNow the database connection\
    \ must be configured. Usually, a dedicated config file in the `autoload` folder\
    \ is used, e.g. `db.local.php`:\n\n```\n 1 <?php\n 2 return array(\n 3 \t'doctrine'\
    \ => array(\n 4 \t\t'connection' => array(\n 5 \t\t\t'orm_default' => array(\n\
    \ 6 \t\t\t\t'driverClass' => 'Doctrine\\DBAL\\Driver\\PDOMySql\\Driver',\n 7 \t\
    \t\t\t'params' => array(\n 8 \t\t\t\t\t'host'     => 'localhost',\n 9 \t\t\t\t\
    \t'port'     => '3306',\n10 \t\t\t\t\t'user'     => 'username',\n11 \t\t\t\t\t\
    'password' => 'password',\n12 \t\t\t\t\t'dbname'   => 'database',\n13 \t\t\t\t\
    )\n14 \t\t\t)\n15 \t\t)\n16 \t),\n17 );\n```\n\nOnce done, we can start dealing\
    \ with entities (e.g. a `Product` entity) through Doctrine 2:\n\n```\n 1 <?php\n\
    \ 2 namespace Application\\Entity;\n 3 \n 4 use Doctrine\\ORM\\Mapping as ORM;\n\
    \ 5 \n 6 /**\n 7  * @ORM\\Entity\n 8  * @ORM\\Table(name=\"product\")\n 9  */\n\
    10 class Product\n11 {\n12 \t/**\n13 \t* @ORM\\Id @ORM\\Column(type=\"integer\"\
    )\n14 \t* @ORM\\GeneratedValue\n15 \t*/\n16 \tprotected $productId;\n17 \n18 \t\
    /** @ORM\\Column(type=\"string\", nullable=true) */\n19 \tprotected $name;\n20\
    \ \n21 \t/** @ORM\\Column(type=\"integer\") */\n22 \tprotected $stock;\n23 \n\
    24 \t/** @ORM\\Column(type=\"string\", nullable=true) */\n25 \tprotected $description;\n\
    26 \n27 \t/** @ORM\\Column(type=\"string\", nullable=true) */\n28 \tprotected\
    \ $features;\n29 \n30 \tpublic function setDescription($description)\n31 \t{\n\
    32 \t\t$this->description = $description;\n33 \t}\n34 \n35 \tpublic function getDescription()\n\
    36 \t{\n37 \t\treturn $this->description;\n38 \t}\n39 \n40 \tpublic function setFeatures($features)\n\
    41 \t{\n42 \t\t$this->features = $features;\n43 \t}\n44 \n45 \tpublic function\
    \ getFeatures()\n46 \t{\n47 \t\treturn $this->features;\n48 \t}\n49 \n50 \tpublic\
    \ function setProductId($productId)\n51 \t{\n52 \t\t$this->productId = $productId;\n\
    53 \t}\n54 \n55 \tpublic function getProductId()\n56 \t{\n57 \t\treturn $this->productId;\n\
    58 \t}\n59 \n60 \tpublic function setName($name)\n61 \t{\n62 \t\t$this->name =\
    \ $name;\n63 \t}\n64 \n65 \tpublic function getName()\n66 \t{\n67 \t\treturn $this->name;\n\
    68 \t}\n69 \n70 \tpublic function setStock($stock)\n71 \t{\n72 \t\t$this->stock\
    \ = $stock;\n73 \t}\n74 \n75 \tpublic function getStock()\n76 \t{\n77 \t\treturn\
    \ $this->stock;\n78 \t}\n79 }\n```\n\nFrom a controller, a finder method provided\
    \ by a repository can be accessed like this:\n\n```\n1 <?php\n2 // [..]\n3 $this->getServiceLocator()->get('doctrine.entitymanager.orm_default')\n\
    4 \t->getRepository('Application\\Entity\\Product')\n5 \t->findOneByProductId($id);\n\
    6 // [..]\n```\n\nThe Doctrine 2 command line tools are available as well. One\
    \ needs to bring up a command line and change to the project’s root folder:\n\n\
    ```\n1 $ php vendor/bin/doctrine-module orm:validate-schema\n```\n\n### 11.2 Native\
    \ SQL statements\n\nDoctrine 2 ships with a special class called `NativeQuery`\
    \ that allows to execute native SQL select statements and to map the results returned\
    \ to entity objects. What usually works out-of-the-box with Doctrine 2, can be\
    \ implemented by hand in cases where native queries are needed or where they are\
    \ the better solution to a problem. `NativeQuery` allows to retrieve “raw data”\
    \ and then work with entity objects in the following. The [official documentation](http://docs.doctrine-project.org/en/latest/reference/native-sql.html)\
    \ holds further information about how to properly implement native SQL statements.\n\
    \nLastly, in general, one needs to remember that it’s always possible to execute\
    \ arbitrary SQL statements via the underlying database connection:\n\n```\n1 <?php\n\
    2 // [..]\n3 $em->getConnection()->exec('DELETE FROM posts');\n```\n\nWhile it\
    \ is possible, it should always be the last option. It bypasses the Entity Manager\
    \ and might produce hard-to-debug issues and data inconsistencies.\n\n### 11.3\
    \ Doctrine 2 Extensions\n\nWhile Doctrine 2 already ships with tons and tons of\
    \ features, there is even more. In the [Doctrine 2 extension repository](https://github.com/l3pp4rd/DoctrineExtensions)\
    \ on GitHub, one will find several extensions with solutions to typical problems,\
    \ which otherwise must be solved individually by each application developer again\
    \ and again:\n\n*   Tree: Automates the tree handling process and adds some tree\
    \ specific functions on repositories.\n\n*   Translatable: Gives a very handy\
    \ solution for translating records into different languages.\n\n*   Sluggable:\
    \ Takes a specified field from an entity and makes it compatible for URLs.\n\n\
    *   Timestampable: Updates date fields on create, update and even property change.\n\
    \n*   Blameable: Updates string or reference fields on create, update and even\
    \ property change with a string or object (e.g. user).\n\n*   Loggable: Helps\
    \ tracking changes and history of objects, also supports version management.\n\
    \n*   Sortable: Makes any entity sortable.\n\n*   Translator: Supports handling\
    \ translations.\n\n*   Softdeleteable: Allows to mark entities as deleted, without\
    \ physically deleting them.\n\n*   Uploadable: Provides file upload handling to\
    \ entity fields.\n\n*   References: Supports linking entities in Documents and\
    \ visa versa."
  fmt: "\n# 使用 Doctrine 2 与 Zend Framework 2\n\nThe easiest way to use to Doctrine\
    \ 2 with Zend Framework 2 (ZF2) is a Composer based installation. The ZF2 module\
    \ [doctrine-orm-module](https://github.com/doctrine/DoctrineORMModule) not only\
    \ ships the glue code to make both libraries work together, but also ensure that\
    \ the Doctrine 2 library itself is downloaded and installed in an existing ZF2\
    \ application. One simply needs to add the following line to the `require` block\
    \ of the projects’ `composer.json`:\n\n```\n\"doctrine/doctrine-orm-module\":\
    \ \"dev-master\"\n```\n\nAbove the `require` block the following line must also\
    \ be added:\n\n```\n\"minimum-stability\": \"alpha\"\n```\n\nIf this configuration\
    \ is missing, Composer might refuse to install the module. In fact, with this\
    \ configuration, we tell Composer to install even non-stable modules.\n\nThe following\
    \ commands start the download and the installation process:\n\n```\n$ php composer.phar\
    \ update\n```\n\nAs one can see, a whole bunch of other ZF2 modules and additional\
    \ libraries are downloaded.\n\nLast but not least two ZF2 modules must be activated\
    \ via the `application.config.php`:\n\n```\n<?php\nreturn array(\n\t'modules'\
    \ => array(\n\t\t'Application',\n\t\t'DoctrineModule',\n\t\t'DoctrineORMModule'\n\
    \t),\n\t'module_listener_options' => array(\n\t\t'config_glob_paths'    => array(\n\
    \t\t\t'config/autoload/{,*.}{global,local}.php',\n\t\t),\n\t\t'module_paths' =>\
    \ array(\n\t\t\t'./module',\n\t\t\t'./vendor',\n\t\t),\n\t),\n);\n```\n\nThe modules\
    \ register several services in Main Service Manager, all starting with the label\
    \ “doctrine”, e.g. `doctrine.cache.apc` and `doctrine.sqlloggercollector.ormdefault`.\n\
    \nThe entity manager can be obtained using a long-winded label:\n\n```\n<?php\n\
    // [..]\n$this->getServiceLocator()->get('doctrine.entitymanager.orm_default');\n\
    ```\n\nBut before this works, some additional configuration is need. Doctrine\
    \ 2 needs to know where the entity classes are located and what the caching strategy\
    \ looks like. The following example from the `module.php` tells Doctrine that\
    \ the mappings are given as annotation, the entities are located in `__DIR__ .\
    \ '/../src/Application/Entity'` and caching takes place via PHP arrays:\n\n```\n\
    <?php\n// [..]\n'doctrine' => array(\n\t'driver' => array(\n\t\t'my_annotation_driver'\
    \ => array(\n\t\t\t'class' => 'Doctrine\\ORM\\Mapping\\Driver\\AnnotationDriver',\n\
    \t\t\t'cache' => 'array',\n\t\t\t'paths' => array(__DIR__ . '/../src/Application/Entity')\n\
    \t\t)\n\t)\n)\n// [..]\n```\n\nTo allow other ZF2 modules to provide entities\
    \ to the application, a so-called “Driver Chain” allow to combine multiple entity\
    \ sources even with different mapping formats and caching strategies:\n\n```\n\
    <?php\n// [..]\n'doctrine' => array(\n\t'driver' => array(\n\t\t'my_annotation_driver'\
    \ => array(\n\t\t\t'class' => 'Doctrine\\ORM\\Mapping\\Driver\\AnnotationDriver',\n\
    \t\t\t'cache' => 'array',\n\t\t\t'paths' => array(__DIR__ . '/../src/Application/Entity')\n\
    \t\t),\n\t\t'orm_default' => array(\n\t\t\t'drivers' => array(\n             \
    \   'Application\\Entity' => 'my_annotation_driver'\n            )\n        )\n\
    \t)\n)\n// [..]\n```\n\nNow the database connection must be configured. Usually,\
    \ a dedicated config file in the `autoload` folder is used, e.g. `db.local.php`:\n\
    \n```\n<?php\nreturn array(\n\t'doctrine' => array(\n\t\t'connection' => array(\n\
    \t\t\t'orm_default' => array(\n\t\t\t\t'driverClass' => 'Doctrine\\DBAL\\Driver\\\
    PDOMySql\\Driver',\n\t\t\t\t'params' => array(\n\t\t\t\t\t'host'     => 'localhost',\n\
    \t\t\t\t\t'port'     => '3306',\n\t\t\t\t\t'user'     => 'username',\n\t\t\t\t\
    \t'password' => 'password',\n\t\t\t\t\t'dbname'   => 'database',\n\t\t\t\t)\n\t\
    \t\t)\n\t\t)\n\t),\n);\n```\n\nOnce done, we can start dealing with entities (e.g.\
    \ a `Product` entity) through Doctrine 2:\n\n```\n<?php\nnamespace Application\\\
    Entity;\n\nuse Doctrine\\ORM\\Mapping as ORM;\n\n/**\n * @ORM\\Entity\n * @ORM\\\
    Table(name=\"product\")\n */\nclass Product\n{\n\t/**\n\t* @ORM\\Id @ORM\\Column(type=\"\
    integer\")\n\t* @ORM\\GeneratedValue\n\t*/\n\tprotected $productId;\n\n\t/** @ORM\\\
    Column(type=\"string\", nullable=true) */\n\tprotected $name;\n\n\t/** @ORM\\\
    Column(type=\"integer\") */\n\tprotected $stock;\n\n\t/** @ORM\\Column(type=\"\
    string\", nullable=true) */\n\tprotected $description;\n\n\t/** @ORM\\Column(type=\"\
    string\", nullable=true) */\n\tprotected $features;\n\n\tpublic function setDescription($description)\n\
    \t{\n\t\t$this->description = $description;\n\t}\n\n\tpublic function getDescription()\n\
    \t{\n\t\treturn $this->description;\n\t}\n\n\tpublic function setFeatures($features)\n\
    \t{\n\t\t$this->features = $features;\n\t}\n\n\tpublic function getFeatures()\n\
    \t{\n\t\treturn $this->features;\n\t}\n\n\tpublic function setProductId($productId)\n\
    \t{\n\t\t$this->productId = $productId;\n\t}\n\n\tpublic function getProductId()\n\
    \t{\n\t\treturn $this->productId;\n\t}\n\n\tpublic function setName($name)\n\t\
    {\n\t\t$this->name = $name;\n\t}\n\n\tpublic function getName()\n\t{\n\t\treturn\
    \ $this->name;\n\t}\n\n\tpublic function setStock($stock)\n\t{\n\t\t$this->stock\
    \ = $stock;\n\t}\n\n\tpublic function getStock()\n\t{\n\t\treturn $this->stock;\n\
    \t}\n}\n```\n\nFrom a controller, a finder method provided by a repository can\
    \ be accessed like this:\n\n```\n<?php\n// [..]\n$this->getServiceLocator()->get('doctrine.entitymanager.orm_default')\n\
    \t->getRepository('Application\\Entity\\Product')\n\t->findOneByProductId($id);\n\
    // [..]\n```\n\nThe Doctrine 2 command line tools are available as well. One needs\
    \ to bring up a command line and change to the project’s root folder:\n\n```\n\
    $ php vendor/bin/doctrine-module orm:validate-schema\n```\n\n## 11.2 Native SQL\
    \ statements\n\nDoctrine 2 ships with a special class called `NativeQuery` that\
    \ allows to execute native SQL select statements and to map the results returned\
    \ to entity objects. What usually works out-of-the-box with Doctrine 2, can be\
    \ implemented by hand in cases where native queries are needed or where they are\
    \ the better solution to a problem. `NativeQuery` allows to retrieve “raw data”\
    \ and then work with entity objects in the following. The [official documentation](http://docs.doctrine-project.org/en/latest/reference/native-sql.html)\
    \ holds further information about how to properly implement native SQL statements.\n\
    \nLastly, in general, one needs to remember that it’s always possible to execute\
    \ arbitrary SQL statements via the underlying database connection:\n\n```\n<?php\n\
    // [..]\n$em->getConnection()->exec('DELETE FROM posts');\n```\n\nWhile it is\
    \ possible, it should always be the last option. It bypasses the Entity Manager\
    \ and might produce hard-to-debug issues and data inconsistencies.\n\n## 11.3\
    \ Doctrine 2 Extensions\n\nWhile Doctrine 2 already ships with tons and tons of\
    \ features, there is even more. In the [Doctrine 2 extension repository](https://github.com/l3pp4rd/DoctrineExtensions)\
    \ on GitHub, one will find several extensions with solutions to typical problems,\
    \ which otherwise must be solved individually by each application developer again\
    \ and again:\n\n*   Tree: Automates the tree handling process and adds some tree\
    \ specific functions on repositories.\n\n*   Translatable: Gives a very handy\
    \ solution for translating records into different languages.\n\n*   Sluggable:\
    \ Takes a specified field from an entity and makes it compatible for URLs.\n\n\
    *   Timestampable: Updates date fields on create, update and even property change.\n\
    \n*   Blameable: Updates string or reference fields on create, update and even\
    \ property change with a string or object (e.g. user).\n\n*   Loggable: Helps\
    \ tracking changes and history of objects, also supports version management.\n\
    \n*   Sortable: Makes any entity sortable.\n\n*   Translator: Supports handling\
    \ translations.\n\n*   Softdeleteable: Allows to mark entities as deleted, without\
    \ physically deleting them.\n\n*   Uploadable: Provides file upload handling to\
    \ entity fields.\n\n*   References: Supports linking entities in Documents and\
    \ visa versa.\n"
  trans: "\n\n# 使用 Doctrine 2 与 Zend Framework 2\n\n使用 Doctrine 2 与 Zend Framework\
    \ 2 (ZF2) 的最简单方式是基于 Composer 的安装。ZF2 模块 [doctrine-orm-module](https://github.com/doctrine/DoctrineORMModule)\
    \ 不仅提供了使两个库协同工作的胶水代码，还确保 Doctrine 2 库本身被下载并安装到现有的 ZF2 应用程序中。只需将以下行添加到项目 `composer.json`\
    \ 的 `require` 块中：\n\n```\n\"doctrine/doctrine-orm-module\": \"dev-master\"\n```\n\
    \n在 `require` 块之上还必须添加以下行：\n\n```\n\"minimum-stability\": \"alpha\"\n```\n\n如果缺少此配置，Composer\
    \ 可能会拒绝安装该模块。事实上，通过此配置，我们告诉 Composer 安装甚至非稳定模块。\n\n以下命令启动下载和安装过程：\n\n```\n$ php\
    \ composer.phar update\n```\n\n如所见，会下载一大堆其他 ZF2 模块和附加库。\n\n最后但同样重要的是，必须通过 `application.config.php`\
    \ 激活两个 ZF2 模块：\n\n```\n<?php\nreturn array(\n\t'modules' => array(\n\t\t'Application',\n\
    \t\t'DoctrineModule',\n\t\t'DoctrineORMModule'\n\t),\n\t'module_listener_options'\
    \ => array(\n\t\t'config_glob_paths'    => array(\n\t\t\t'config/autoload/{,*.}{global,local}.php',\n\
    \t\t),\n\t\t'module_paths' => array(\n\t\t\t'./module',\n\t\t\t'./vendor',\n\t\
    \t),\n\t),\n);\n```\n\n这些模块在主服务管理器中注册多个服务，全部以标签“doctrine”开头，例如 `doctrine.cache.apc`\
    \ 和 `doctrine.sqlloggercollector.ormdefault`。\n\n实体管理器可以使用冗长的标签获取：\n\n```\n<?php\n\
    // [..]\n$this->getServiceLocator()->get('doctrine.entitymanager.orm_default');\n\
    ```\n\n但在此之前，还需要一些额外配置。Doctrine 2 需要知道实体类位于何处以及缓存策略是什么样子。以下 `module.php` 中的示例告诉\
    \ Doctrine，映射以注解形式给出，实体位于 `__DIR__ . '/../src/Application/Entity'`，缓存通过 PHP 数组进行：\n\
    \n```\n<?php\n// [..]\n'doctrine' => array(\n\t'driver' => array(\n\t\t'my_annotation_driver'\
    \ => array(\n\t\t\t'class' => 'Doctrine\\ORM\\Mapping\\Driver\\AnnotationDriver',\n\
    \t\t\t'cache' => 'array',\n\t\t\t'paths' => array(__DIR__ . '/../src/Application/Entity')\n\
    \t\t)\n\t)\n)\n// [..]\n```\n\n为了允许其他 ZF2 模块向应用程序提供实体，所谓的“驱动程序链”允许组合多个实体来源，即使具有不同的映射格式和缓存策略：\n\
    \n```\n<?php\n// [..]\n'doctrine' => array(\n\t'driver' => array(\n\t\t'my_annotation_driver'\
    \ => array(\n\t\t\t'class' => 'Doctrine\\ORM\\Mapping\\Driver\\AnnotationDriver',\n\
    \t\t\t'cache' => 'array',\n\t\t\t'paths' => array(__DIR__ . '/../src/Application/Entity')\n\
    \t\t),\n\t\t'orm_default' => array(\n\t\t\t'drivers' => array(\n             \
    \   'Application\\Entity' => 'my_annotation_driver'\n            )\n        )\n\
    \t)\n)\n// [..]\n```\n\n现在必须配置数据库连接。通常，在 `autoload` 文件夹中使用专用配置文件，例如 `db.local.php`：\n\
    \n```\n<?php\nreturn array(\n\t'doctrine' => array(\n\t\t'connection' => array(\n\
    \t\t\t'orm_default' => array(\n\t\t\t\t'driverClass' => 'Doctrine\\DBAL\\Driver\\\
    PDOMySql\\Driver',\n\t\t\t\t'params' => array(\n\t\t\t\t\t'host'     => 'localhost',\n\
    \t\t\t\t\t'port'     => '3306',\n\t\t\t\t\t'user'     => 'username',\n\t\t\t\t\
    \t'password' => 'password',\n\t\t\t\t\t'dbname'   => 'database',\n\t\t\t\t)\n\t\
    \t\t)\n\t\t)\n\t),\n);\n```\n\n完成后，我们可以开始通过 Doctrine 2 处理实体（例如 `Product` 实体）：\n\
    \n```\n<?php\nnamespace Application\\Entity;\n\nuse Doctrine\\ORM\\Mapping as\
    \ ORM;\n\n/**\n * @ORM\\Entity\n * @ORM\\Table(name=\"product\")\n */\nclass Product\n\
    {\n\t/**\n\t* @ORM\\Id @ORM\\Column(type=\"integer\")\n\t* @ORM\\GeneratedValue\n\
    \t*/\n\tprotected $productId;\n\n\t/** @ORM\\Column(type=\"string\", nullable=true)\
    \ */\n\tprotected $name;\n\n\t/** @ORM\\Column(type=\"integer\") */\n\tprotected\
    \ $stock;\n\n\t/** @ORM\\Column(type=\"string\", nullable=true) */\n\tprotected\
    \ $description;\n\n\t/** @ORM\\Column(type=\"string\", nullable=true) */\n\tprotected\
    \ $features;\n\n\tpublic function setDescription($description)\n\t{\n\t\t$this->description\
    \ = $description;\n\t}\n\n\tpublic function getDescription()\n\t{\n\t\treturn\
    \ $this->description;\n\t}\n\n\tpublic function setFeatures($features)\n\t{\n\t\
    \t$this->features = $features;\n\t}\n\n\tpublic function getFeatures()\n\t{\n\t\
    \treturn $this->features;\n\t}\n\n\tpublic function setProductId($productId)\n\
    \t{\n\t\t$this->productId = $productId;\n\t}\n\n\tpublic function getProductId()\n\
    \t{\n\t\treturn $this->productId;\n\t}\n\n\tpublic function setName($name)\n\t\
    {\n\t\t$this->name = $name;\n\t}\n\n\tpublic function getName()\n\t{\n\t\treturn\
    \ $this->name;\n\t}\n\n\tpublic function setStock($stock)\n\t{\n\t\t$this->stock\
    \ = $stock;\n\t}\n\n\tpublic function getStock()\n\t{\n\t\treturn $this->stock;\n\
    \t}\n}\n```\n\n从控制器中，可以像这样访问仓库提供的查找方法：\n\n```\n<?php\n// [..]\n$this->getServiceLocator()->get('doctrine.entitymanager.orm_default')\n\
    \t->getRepository('Application\\Entity\\Product')\n\t->findOneByProductId($id);\n\
    // [..]\n```\n\nDoctrine 2 命令行工具也可用。需要打开命令行并切换到项目的根文件夹：\n\n```\n$ php vendor/bin/doctrine-module\
    \ orm:validate-schema\n```\n\n## 11.2 原生 SQL 语句\n\nDoctrine 2 自带一个名为 `NativeQuery`\
    \ 的特殊类，允许执行原生 SQL select 语句并将返回的结果映射到实体对象。通常在 Doctrine 2 中开箱即用的功能，在需要原生查询或原生查询是解决问题的更好方案的情况下，可以手动实现。`NativeQuery`\
    \ 允许检索“原始数据”，然后在后续操作中使用实体对象。[官方文档](http://docs.doctrine-project.org/en/latest/reference/native-sql.html)\
    \ 提供了关于如何正确实现原生 SQL 语句的更多信息。\n\n最后，一般来说，人们需要记住，始终可以通过底层数据库连接执行任意 SQL 语句：\n\n```\n\
    <?php\n// [..]\n$em->getConnection()->exec('DELETE FROM posts');\n```\n\n虽然可行，但这应始终是最后的选择。它绕过了实体管理器，可能会产生难以调试的问题和数据不一致。\n\
    \n## 11.3 Doctrine 2 扩展\n\n虽然 Doctrine 2 已经自带了大量功能，但还有更多。在 GitHub 上的 [Doctrine\
    \ 2 扩展仓库](https://github.com/l3pp4rd/DoctrineExtensions) 中，你会发现几个扩展，它们提供了解决典型问题的方案，否则每个应用程序开发人员都必须反复独立解决：\n\
    \n*   Tree: 自动化树处理过程，并在仓库中添加一些特定于树的函数。\n\n*   Translatable: 为将记录翻译成不同语言提供了非常方便的解决方案。\n\
    \n*   Sluggable: 从实体中获取指定字段并使其与 URL 兼容。\n\n*   Timestampable: 在创建、更新甚至属性更改时更新日期字段。\n\
    \n*   Blameable: 在创建、更新甚至属性更改时，用字符串或对象（例如用户）更新字符串或引用字段。\n\n*   Loggable: 帮助跟踪对象的更改和历史记录，还支持版本管理。\n\
    \n*   Sortable: 使任何实体都可排序。\n\n*   Translator: 支持处理翻译。\n\n*   Softdeleteable: 允许将实体标记为已删除，而无需物理删除它们。\n\
    \n*   Uploadable: 为实体字段提供文件上传处理。\n\n*   References: 支持在文档中链接实体，反之亦然。\n\n"
