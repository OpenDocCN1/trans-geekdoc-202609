- raw: "The code shown above modifies the `Post` entity with an ID value of `1` two\
    \ times. After both changes have been applied, the `value` column has a value\
    \ of `3`. The `$em->clear()` statement is important here: If we omit it, we would\
    \ produce an `OptimisticLockException` ourselves. The reason for this is that\
    \ changing the title to “New title” and flushing the entity manager increments\
    \ the version value for this entity by one in the database. However, the value\
    \ stored in the `Post` entity object in RAM still has the old value of `1` and\
    \ therefore now is outdated-it is not being updated to the latest version value\
    \ automatically. Therefore, trying to modifying the title again will fail with\
    \ an `OptimisticLockException`. The same will be true, if we would try to persist\
    \ changes to an entity, which has been modified in the meantime by somebody else.\
    \ How an `OptimisticLockException` situation is handled, is fully up to the application\
    \ developer.\n\n## 8 Doctrine Query Language\n\n### 8.1 Introduction\n\nEarlier\
    \ in this book, we learned about repositories, containers for entities of a specific\
    \ type. They are used to look up entities by specific criteria, do updates or\
    \ deletes and so on. They do their work with the help of finder methods, which\
    \ are implemented using Doctrine’s own entity query language DQL-the Doctrine\
    \ Query Language. To be exact, DQL is not bound to finder methods or repositories,\
    \ however, usually, one mainly will want to put all DQL statements there, just\
    \ to keep things organized.\n\nDQL itself is a language to query entities. It\
    \ looks much like SQL-which makes learning DQL easier-but it isn’t SQL. While\
    \ DQL statements can be written as a string like this\n\n```\n1 <?php\n2 // [..]\n\
    3 $query = $em->createQuery(\n4 \t'SELECT u FROM Entity\\User u WHERE u.lastName\
    \ = \"Mustermann\"'\n5 );\n6 \n7 $users = $query->getResult();  \n```\n\nit is\
    \ much more convenient to use the *query builder*, especially when constructing\
    \ dynamic queries:\n\n```\n 1 <?php\n 2 // [..]\n 3 $qb = $this->_em->createQueryBuilder();\n\
    \ 4 \n 5 $qb->select('u')\n 6 \t->from('Entity\\User', 'u')\n 7 \t->where($qb->expr()->eq('u.lastName',\
    \ '?1'))\n 8 \t->setParameter(1, \"Mustermann\");\n 9 \n10 $users = $qb->getQuery()->getResult();\n\
    ```\n\nWe assume that `$this->_em` holds a reference to the entity manager (which\
    \ is true for every repository that extends `Doctrine\\ORM\\EntityRepository`).\
    \ The entity manager is capable of providing a query builder, which in turn can\
    \ be used to programmatically construct a query. Thanks to its fluent interface,\
    \ the code looks pretty elegant. In contrast to the first example, we also utilize\
    \ value parameters and the `Expr` class, which we will look at in detail in a\
    \ minute.\n\n### 8.2 Retrieving results\n\nWhen executing a query, multiple options\
    \ exist for retrieving results. When calling `getResult()` on a query object,\
    \ a PHP array is returned containing all matching entity objects. Alternatively,\
    \ `getArrayResult()` can be used to get all data in form of an array. No objects\
    \ are returned, only all entities data as an array in a container array. This\
    \ is pretty useful when dealing with bigger dataset or for simple display tasks,\
    \ where no objects are needed in the processing. A similar result, but fully flat,\
    \ not nested at all, creates `getScalarResult()`. When a single result is desired,\
    \ calling `getSingleResult()` or `getSingleScalarResult()` will do. Method `getOneOrNullResult()`\
    \ may be used if null is desired when no match was found.\n\nIf not only entities\
    \ are selected by a query, the result set returned is so-called “mixed”-it includes\
    \ objects as well as scalar values as well:\n\n```\n 1 <?php\n 2 // [..]\n 3 $qb\
    \ = $this->_em->createQueryBuilder();\n 4 \n 5 $qb->select('u')\n 6 \t->addSelect($qb->expr()->concat('u.firstName',\
    \ 'u.lastName'))\n 7 \t->from('Entity\\User', 'u')\n 8 \t->where($qb->expr()->eq('u.lastName',\
    \ '?1'))\n 9 \t->setParameter(1, \"Mustermann\");\n10 \n11 $users = $qb->getQuery()->getResult();\n\
    ```\n\nIn this query, we not only retrieve entities, but also concatenate the\
    \ user’s first and last name. The result of the query looks like this:\n\n```\n\
    1 array \n2 \t[0]\n3 \t\t[0] => Object\n4 \t\t[1] => \"Max Mustermann\"\n5 \t\
    [1]\n6 \t\t// ..\n```\n\nVia `setFirstResult($offset)` and `setMaxResults($limit)`\
    \ the result set can be limited, e.g. when building a pagination feature.\n\n\
    Another feature Doctrine 2 offers is retrieving partial objects, entities, which\
    \ have been recreated from the database only partially. To retrieve a partial\
    \ object, a special syntax is required:\n\n```\n 1 <?php\n 2 // [..]\n 3 $qb =\
    \ $this->_em->createQueryBuilder();\n 4 \n 5 $qb->select('partial u.{id, firstName}')\n\
    \ 6 \t->from('Entity\\User', 'u')\n 7 \t->where($qb->expr()->eq('u.lastName',\
    \ '?1'))\n 8 \t->setParameter(1, \"Mustermann\");\n 9 \n10 $users = $qb->getQuery()->getResult();\n\
    ```\n\nThis way, we get back `User` objects, partly reconstituted from the database.\
    \ When omitting the `partial` syntax and simply stating individual fields, the\
    \ result otherwise is a plain array without objects:\n\n```\n1 array(1) { \n2\
    \ \t[0]=> \n3 \t\tarray(2) { \n4 \t\t\t[\"id\"]=> int(1) \n5 \t\t\t[\"firstName\"\
    ]=> string(3) \"Max\" \n6 \t\t} \n7 }\n```\n\nIts important to always include\
    \ the identifier (`id` in this case) in a partial object definition. Otherwise\
    \ an exception is thrown.\n\nWhile Partial objects can be very helpful, e.g. while\
    \ tweaking the performance of an app, they can be problematic as well. Code dealing\
    \ with partial objects needs to be aware of the fact, that no “real” entities\
    \ are returned and certain fields or associations might not be available. One\
    \ will need to use partial objects with care.\n\n### 8.3 Constructing basic queries\n\
    \nThe query builder provides methods for the different parts of a query, such\
    \ as the one shown above:\n\n*   public function select($select = null);\n\n*\
    \   public function delete($delete = null, $alias = null);\n\n*   public function\
    \ update($update = null, $alias = null);\n\n*   public function set($key, $value);\n\
    \n*   public function from($from, $alias = null);\n\n*   public function where($where);\n\
    \n*   public function andWhere($where);\n\n*   public function orWhere($where);\n\
    \n*   public function groupBy($groupBy);\n\n*   public function addGroupBy($groupBy);\n\
    \n*   public function having($having);\n\n*   public function andHaving($having);\n\
    \n*   public function orHaving($having);\n\n*   public function orderBy($sort,\
    \ $order = null);\n\n*   public function addOrderBy($sort, $order = null);\n\n\
    Expressions like the ones shown above are built using an `Expr` object, which\
    \ is provided by the query builder when calling its `expr()` method. The `Expr`\
    \ object provides several methods to construct an expression:\n\n*   public function\
    \ andX($x = null);\n\n*   public function orX($x = null);\n\n*   public function\
    \ eq($x, $y);\n\n*   public function neq($x, $y);\n\n*   public function lt($x,\
    \ $y);\n\n*   public function lte($x, $y);\n\n*   public function gt($x, $y);\n\
    \n*   public function gte($x, $y);\n\n*   public function isNull($x);\n\n*   public\
    \ function isNotNull($x);\n\n*   public function prod($x, $y);\n\n*   public function\
    \ diff($x, $y);\n\n*   public function sum($x, $y);\n\n*   public function quot($x,\
    \ $y);\n\n*   public function exists($subquery);\n\n*   public function all($subquery);\n\
    \n*   public function some($subquery);\n\n*   public function any($subquery);\n\
    \n*   public function not($restriction);\n\n*   public function in($x, $y);\n\n\
    *   public function notIn($x, $y);\n\n*   public function like($x, $y);\n\n* \
    \  public function between($val, $x, $y);\n\n*   public function trim($x);\n\n\
    *   public function concat($x, $y);\n\n*   public function substr($x, $from, $len);\n\
    \n*   public function lower($x);\n\n*   public function upper($x);\n\n*   public\
    \ function length($x);\n\n*   public function avg($x);\n\n*   public function\
    \ max($x);\n\n*   public function min($x);\n\n*   public function abs($x);\n\n\
    *   public function sqrt($x);\n\n*   public function count($x);\n\n*   public\
    \ function countDistinct($x);"
