    *   `public function addGroupBy($groupBy);`\n*   `public function having($having);`\n\
    *   `public function andHaving($having);`\n*   `public function orHaving($having);`\n\
    *   `public function orderBy($sort, $order = null);`\n*   `public function addOrderBy($sort,\
    \ $order = null);`\n\nExpressions like the ones shown above are built using an\
    \ `Expr` object, which is provided by the query builder when calling its `expr()`\
    \ method. The `Expr` object provides several methods to construct an expression:\n\
    \n*   `public function andX($x = null);`\n*   `public function orX($x = null);`\n\
    *   `public function eq($x, $y);`\n*   `public function neq($x, $y);`\n*   `public\
    \ function lt($x, $y);`\n*   `public function lte($x, $y);`\n*   `public function\
    \ gt($x, $y);`\n*   `public function gte($x, $y);`\n*   `public function isNull($x);`\n\
    *   `public function isNotNull($x);`\n*   `public function prod($x, $y);`\n* \
    \  `public function diff($x, $y);`\n*   `public function sum($x, $y);`\n*   `public\
    \ function quot($x, $y);`\n*   `public function exists($subquery);`\n*   `public\
    \ function all($subquery);`\n*   `public function some($subquery);`\n*   `public\
    \ function any($subquery);`\n*   `public function not($restriction);`\n*   `public\
    \ function in($x, $y);`\n*   `public function notIn($x, $y);`\n*   `public function\
    \ like($x, $y);`\n*   `public function between($val, $x, $y);`\n*   `public function\
    \ trim($x);`\n*   `public function concat($x, $y);`\n*   `public function substr($x,\
    \ $from, $len);`\n*   `public function lower($x);`\n*   `public function upper($x);`\n\
    *   `public function length($x);`\n*   `public function avg($x);`\n*   `public\
    \ function max($x);`\n*   `public function min($x);`\n*   `public function abs($x);`\n\
