    content\",\n 9 *         column=@Column(\n10 *             name = \"closed_caption\"\
    ,\n11 *             type = \"text\"\n12 *         )\n13 *     )\n14 * })\n15 */\n\
    16 class VideoPost extends Post\n17 {\n18 \t// [..]\n19 }\n```\n\nWhile Doctrine\
    \ 2 requires member variables being either `private` or `protected`, it’s important\
    \ to remember that member variables need to be `protected` here. Otherwise they\
    \ won’t be available in the subclass. When overwriting property `content` with\
    \ `closed_caption` like shown above, this leads to a `closed_caption` column in\
