    mode theory is applied to the radiated noise model of pile driving. Normal mode
    theory is one of the commonly used theories to describe the propagation law of
    the sound field in the ocean and is suitable for sound field modeling in the horizontally
    layered medium. It is an important calculation method of the shallow water sound
    field and has been widely practiced. The main idea of normal mode theory is to
    decompose the sound field into horizontal traveling waves and vertical standing
    waves, and only partially normal waves of one frequency can travel long distances
    in one waveguide. Assuming that the underwater acoustic environment is a two-dimensional
    axisymmetric layered medium, a cylindrical coordinate system is established with
    the radial axis and the vertical axis. Ignoring the time factor, the Helmholtz
    equation can be written as


    ```

    \frac{1}{r} \frac{\partial}{\partial r} (r \frac{\partial p}{\partial r}) + \frac{\partial^2
    p}{\partial z^2} + k^2 p = 0

    ```


    where p is the sound pressure, k = \frac{\omega}{c} is the wave number in the
    water. Using the separation variable method, the sound pressure can be expressed
    as


    ```

    p = \Phi(x)R(r)

    ```


    Substituting Equation (13) into Equation (12) and introducing a separation constant
    k_m, we can get


    ```

    \frac{\partial^2 \Phi_r(x)}{\partial x^2} + (k^2 - k_m^2)\Phi_m(x) = 0

    ```


    ```

    \frac{1}{r} \frac{\partial}{\partial r} (r \frac{\partial R(r)}{\partial r}) +
    k_m^2 R(r) = 0

    ```


    where the separation constant k_m is the horizontal wave number.


    In shallow seas, the boundary conditions of the seabed and sea surface have an
    important influence on the vibration of the structure and the radiation of underwater
    sound propagation. In axial coordinate of the pile, namely the depth direction
    of the sea, a sea surface is usually regarded as a soft boundary (pressure release
    boundary) when the sea surface scattering is not considered. There are many kinds
    of seabed boundaries, which can be roughly divided into hard boundaries, liquid
    boundaries, elastic boundaries, and porous boundaries. Here the seabed is assumed
    to be a hard boundary'
