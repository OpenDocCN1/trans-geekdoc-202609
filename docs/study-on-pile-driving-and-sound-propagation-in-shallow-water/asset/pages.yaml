    # 4.3. Advantages and outlook


    There are many characteristics and advantages of the proposed PINN method in solving
    problems of pile driving. Firstly, the proposed deep learning method is quite
    innovative with its revolutionary concept of numerical computation. It uses a
    specifically designed neural network with physical knowledge for training and
    learning. Thanks to the mighty strength of approximation, it works well with the
    pile driving model. Secondly, compared with FEM and FDM, the proposed PINN method
    is almost independent with mesh, frequency, and geometrical domain, which means
    it cost less time in high-frequency ranges and a long-range distance than other
    methods. Thirdly, the proposed method is very solid to solve partial differential
    equations and learn from actual data in contrast with deriving and computing complex
    solutions in inverse problems.


    According to our research, we can optimistically believe that various vibroacoustic
    problems of structures in ocean engineering are supposed and expected to be addressed
    by using PINN, and we will focus on those problems as much as possible and devote
    ourselves to the optimization of the algorithm in our further research. One of
    the most interesting and exciting research territories to be explored is underwater
    noise radiating from pile driving using PINN with real measured data, which will
    greatly help us to investigate the fluid-pile-soil coupled dynamic model and underwater
    acoustic model. Based on deep learning and practical engineering, our ultimate
    goals of the preservation of marine life and the ocean environment can be achieved
    in the future.


    # 5. Conclusion


    In this paper, we provide a novel way to help us study pile driving problems and
    show the potential of the PINN method for solving'
