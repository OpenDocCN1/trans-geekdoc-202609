    finite element method (FEM), using PINN to approximate the solution is a mesh-free
    method, which means the computational efficiency is irrelevant to the frequency
    of models (Karniadakis et al., 2021; Sacchetti et al., 2022). And more importantly,
    by data-driven modeling techniques, PINN has the extraordinary ability to solve
    unknown parameters at very little cost (Tartakovsky et al., 2020; He et al., 2020;
    Lu et al.,


    2021). Once Feed-forward-Neural Network (FNN) is built and the physical law is
    embedded as additional knowledge, the inverse problems, with minimal coding, can
    be easily solved based only on very few data.


    The main work of this paper includes two parts, the dynamic and acoustic studies
    based on PINN frameworks. The first section is the dynamic behavior study of offshore
    pipe piles in water using a physical-informed neural network, including forward
    problems and inverse problems. In this part, the accuracy, efficiency, and convenience
    of the proposed PINN method to predict some unknown parameters of coupled pile
    driving model are demonstrated. The other is the study on acoustic propagation
    in shallow water based on the normal mode theory, in which the significant advantage
    of the PINN method is found as a frequency-independent and distance-independent
    method.


    # 2. Mathematical formulations


    # 2.1. Pile driving


    An offshore pipe pile can be modeled as a vertical, thin, and elastic cylindrical
    shell, and the loss factor is usually so small that can be neglected. The toe
    of the pipe pile is in the seabed and its top end is impacted by external force.
    There are two typical kinds of pile driving, impact pile driving and vibratory
    pile driving. Impact pile driving is rapid and broadband, while vibratory pile
    driving is with a narrower frequency band and lower underwater sound pressure
    level. No matter which way to drive a pile into the soil, the study of the vibrational
    characteristics of the pile is primary. In the model of pile driving, a thin elastic
    cylindrical pile pipe is considered to investigate its dynamic behavior (Junger
    and Feit, 1986). And the sound propagation of pile driving in shallow water is
    studied using the normal mode theory (Ellis and Chapman, 1985). The main concern
    of our work is to investigate the ability of PINN to study the dynamic behaviors
    and underwater sound pressure radiated from the pile driving in shallow water.
    So, the effects of the seabed on the pile are considered but replaced by a reasonable
    approximation.


    Define $x$ and $r$ as the axial coordinate and radial coordinate of the pile,
    $u$ and $w$ as the axial displacement and radial displacement of the pile, respectively.
    Also, there are some geometric and material symbols as follows: $\rho$, the density
    of the pile, $E$, Young''s modulus of elasticity, $\mu$, Poisson ratio, $L$, the
    length of the pile, $R$, the radius of the pile, $h$, the wall thickness of the
    pile. In the dynamic analysis of a thin cylindrical shell in water, such assumptions
    are made in advance: 1) The azimuthal vibration is independent among three types
    of vibration; 2) There is no variation with radius in partial differential equations;
    3) Only sound pressure is considered as an external force; 4) Torsion and bending
    involving fourth order terms are neglected. Therefore, the equations of motion
    can be simplified to


    ```

    \(\frac{\partial^2 u(x,t)}{\partial x^2} + \frac{\mu}{R} \frac{\partial w(x,t)}{\partial
    x} = \frac{\rho(1-\mu^2)}{E} \frac{\partial^2 u(x,t)}{\partial t^2}\) (1a)

    ```


    ```

    \(\frac{\mu}{R} \frac{\partial u(x,t)}{\partial x} + \frac{w(x,t)}{R^2} = -\frac{\rho(1-\mu^2)}{E}
    \left( \frac{P_a}{\rho h} + \frac{\partial^2 w(x,t)}{\partial t^2} \right)\) (1b)

    ```


    where $P_a$ is the fluid radiation pressure and acts normally to the wall of the
    pipe pile. Via a coupled fluid-structure interaction (FSI), its expression can
    be given as


    ```

    \(P_a(x,t) = Z(x,t) \frac{\partial w(x,t)}{\partial t}\) (2)

    ```


