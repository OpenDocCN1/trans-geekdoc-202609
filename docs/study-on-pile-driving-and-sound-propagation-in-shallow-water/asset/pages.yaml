    neural network


    Quanzhou Jiang $^{a}$, Xianzhong Wang $^{a,b,*}$, Min Yu $^{a,b}$, Min Tang $^{c}$,
    Bixin Zhan $^{a}$, Shuai Dong $^{a}$


    $^{a}$ School of Naval Architecture, Ocean and Energy Power Engineering, Wuhan
    University of Technology, Wuhan, 430063, PR China

    $^{b}$ Key Laboratory of High Performance Ship Technology (Wuhan University of
    Technology), Ministry of Education, Wuhan, 430063, PR China

    $^{c}$ National Engineering Research Center Water Transport Safety (Wuhan University
    of Technology), Ministry of Education, Wuhan, 430063, PR China


    ARTICLE INFO


    Handling Editor: Prof. A.I. Incencik


    Keywords:

    Pile driving

    Underwater sound propagation

    Physics-informed neural network

    Deep learning


    # ABSTRACT


    A novel, effective, and precise physical-informed neural network (PINN) is presented
    in this paper to learn and investigate pile driving and sound propagation in shallow
    water. The validation of the proposed PINN framework is proved by comparing analytical
    and predicted displacements of the pile and underwater sound pressure radiated
    from pile driving. The optimization of the PINN algorithms is studied in detail
    by tuning the hyper-parameters. And then, a fast computing PINN framework with
    good inverse-solving abilities is constructed. A suggestion to help the neural
    network learn partial differential equations better by adding non-zero boundary
    conditions is put forward. It is shown that the neural network made up of a small
    number of neurons, a shallow network with a few layers and the activation of the
    sine function is reliable and satisfying. The identification of unknown parameters
    in the PINN framework is carried out and discussed via various tests, and the
    PINN method accurately predicts the solution of motion of pile driving and approximates
    the underwater sound pressure in shallow water for a wide range of frequencies
    and propagation distance. The advantage of the proposed PINN method is that it
    is a powerful tool to deal with inverse problems and is independent of the frequency
    and the distance.


    # 1. Introduction


    In coastal and offshore engineering, the pile is one of the most important structures
    as foundations and support structures. There are roughly two kinds of piles in
    terms of cross-section, solid pile and pipe pile. The pipe pile is widely used
    because of its good mechanical properties and lower cost. The installation of
    piles is an essential practice in offshore engineering. However, intense impulsive
    underwater noise due to pile driving can affect aquatic life, for example, fishes,
    sea turtles, and marine mammals (Henninger and Watson, 2005; Madsen et al., 2006;
    Popper and Hastings, 2009; Bailey et al., 2010; Knaap Inge et al., 2022; 2011;
    MacGillivray, 2013; Marshall, 2013; Ryan Wilkes et al., 2014; Lippert and Otto
    von Estorff, 2014; Amaral et al., 2022), the vibro-acoustic physical model of
    pile driving has not been established on common ground (Lippert et al., 2016).
    There are several common problems when these theoretical and numerical models
    are used and compared to each other, for instance, the absence of an analytical
    solution for the problem, the lack of available measurement data, and the high
    computational costs. One of the toughest problems of all these numerical methods
    and theoretical models is the uncertain values or unknown parameters in these
    proposed physical models according to measured data or experimental results which
    are usually sparse, limited, and expensive.


    According to the universal approximation theorem, a potential and powerful way
    to address the above problem is to use the artificial neural network (ANN), an
    advancing and intelligent tool, to learn from certain data and invert the significant
    parameters of those physical models. Many studies of deep learning have been carried
    out recently to solve physical problems, such as partial differential equations,
    including the Poisson equation, Laplace equation, Helmholtz equation, Burgers'
