    # 3. Physics-informed neural network


    In this section, we briefly illustrate how the physics-informed neural network
    for solving problems of pile driving and sound propagation in shallow water is
    constructed. And then we put forward a suggestion to help the neural network avoid
    lazy learning and learn partial differential equations better.


    # 3.1. Implement procedure


    In this study, we use DeepXDE to implement our tasks including forward and inverse
    problems. DeepXDE is a library in python on open-source deep learning platforms
    (TensorFlow, PyTorch, JAX, PaddlePaddle). The motivation for using DeepXDE is
    that it is a developed


    tool and is believed to be able to train, test, predict and solve partial differential
    equations, and compute unknown parameters in the vibroacoustic model of pile driving.


    The brief workflow of DeepXDE for solving partial differential equations of pile
    driving is illustrated in Table 1, and the brief workflow for function approximation
    of sound propagation in shallow water is shown in Table 2.


    The computational domain in our work is one or two-dimension, namely the position
    along the axial direction of the pile or radial distance along the horizontal
    direction, and the output is axial displacement, radial displacement, and sound
    pressure as follows


    ```

    $x \in \mathbb{R}^{d_{in}}$ (18a)


    $u, w \in \mathbb{R}^{d_{low}}$ (18b)


    $x, r \in \mathbb{R}^{d_{low}}$ (19a)


    $p \in \mathbb{R}^{d_{low}}$ (19b)

    ```


    A neural network with inputs, N-layers, and outputs is built for simulating partial
    differential equations of pile driving or approximating sound propagation in shallow
    water, and can be mathematically expressed as


    ```

    $N \left( x, u; \frac{\partial u}{\partial x} \frac{\partial^2 u}{\partial x^2},
    w, \frac{\partial w}{\partial x}, \cdots \right) = 0, x \in \mathbb{R}^{d_{in}}$
    (20)

    ```


    The neural network includes an input layer, hidden layers, and an output layer,
    in which the relu function, the sigmoid function, the sine function, and the hyperbolic
    tangent function are used as the nonlinear activation function. For instance,
    using the sine function as the activation function, a neuron in a hidden layer
    can be written as


    ```

    $y^{i+1}(x) = \sigma(W^i x + b^i) = sin(W^i x + b^i)$ (21)

    ```


    where $W^i$ and $b^i$ are weights and biases in the i layer, respectively.


    Hence, a forward and inverse neural network of the pile driving model is depicted
    in Fig. 2. Compared forward problems and inverse problems, it is clearly shown
    that additional training data is needful in inverse problems and its loss is included
    in total loss.


    To solve partial differential equations of pile driving, specific boundary conditions,
    such as Dirichlet, Neumann, and periodic boundary conditions, are necessary and
    critical. Normally, additional boundary conditions are not requisite, because
    they constrain the same mathematical solution. However, under certain circumstances,
    additional boundary conditions can be used to avoid lazy learning, which we


