    coordinate, namely the axial coordinate, and the outputs are the axial displacement
    and radial displacement of the pile. The experimental results of different neurons,
    layers, and activations are shown in Fig. 3, Fig. 4, and Fig. 5, respectively.
    It is apparent that there is barely a significant difference in the mean squared
    error of different neurons in Fig. 3. Even if only 40 neurons are applied, the
    loss of train and test can be reduced to a satisfactory degree, which shows the
    great ability of the neural network to fit. A slight difference can be found in
    Fig. 4, that is, with the increasing of layers, the loss and ocillations of computation
    can be further reduced. As we expected, there are huge differences in diverse
    activations. Because of the mathematical form of the solution, the sine function
    exactly works and performs best, while other activations do not learn so well,
    especially the activation of the relu function. Moreover, for any sine-shaped
    solution, like the Fourier expansion, the sine function with its derivative is
    the best choice as an activation, while a PINN algorithm with other activations
    has to tune at cost, more or less.


    Also studying the effect of the learning rate on the learning process is vital
    because the learning rate can heavily affect the results according to other studies
    (Lee et al., 2021). We choose 0.001 (a conservative learning rate used in many
    algorithms), 0.002, 0.003, and 0.004 as the learning rate with the same other
    parameters to investigate the effect of the learning rate for the PINN framework.
    As can be seen from Fig. 6, there is a big difference between these four cases.
    As the learning rate increases, convergence and numerical stability are badly
    affected. When the learning rate reaches 0.003, the losses of the train and test
    are no longer convergent, and the predicted values are far from the exact solutions.
    So, a steady strategy is recommended with a smaller learning rate and longer iterations.


    The best results of the parametric study of the PINN framework are shown in Table
    5, which testify the PINN algorithms are mostly credible. Finally, we choose one
    of the algorithms as a basic model, as displayed in Table 6, and carry out some
    experimental studies of our interest. The experiments of forward and inverse problems
    for pile driving and the approximation of sound propagation in shallow water using
    the PINN method are given and discussed in next section.


    # 4.2. Numerical results


    According to the tuning results, we finally choose a set of parameters as displayed
    in Table 6, and construct a dependable PINN framework to investigate the dynamic
    behavior of the offshore pipe pile and sound propagation in shallow water.


    We applied the PINN framework for both the forward and inverse problems of pile
    driving. The parameters of the pile driving model follow the previous ones in
    Table 4. As shown in Fig. 7 and Fig. 8 the predicted axial displacement and radial
    displacement using the proposed PINN method match the exact solutions very well,
    just as we expected, and the losses of the train, test, and prediction are low
    enough to assure the quick and stable convergence of the model (Best model: Train
    loss 10^-8, test loss 10^-8, metric 10^-5 in forward problems; Train loss 10^-4,
    test loss 10^-4, metric 10^-3 in inverse problems). Also, we can observe that
    forward problems are easier to train in comparison to inverse problems because
    the loss function of the latter contains additional terms, a few anchor points,
    to be minimized.


    Next, we put the key point on the frequency characteristics in pile driving problems.
    Many classical and popular numerical methods are limited by the frequency of the
    interest. For instance, FEM is usually valid and efficient in low frequency. As
    mentioned above, the PINN method is independent of frequency, and the tool that
    works is the neural network. So, we choose a frequency band from 0 Hz to 4000
    Hz with a step of 100 Hz to study the effectiveness and accuracy of the PINN method.
    As exhibited in Fig. 9, Fig. 10, and Fig. 11, there is nearly no difference in
    the accuracy of prediction with the frequency changing. However, we have to admit
    that data sets and parameters should be fine-tuned when the frequency increases
    sharply and hugely, for instance,


    adding training data points for avoiding overfitting.


    We next study changes of parameters on inverse problems. In this part, C0 is the
    unknown value to be predicted. To implement inverse problems, we organize and
    assign the train data as pointset boundary conditions. Taking the geometrical
    parameters for example, the geometrical parameters are constant values in forward
    problems, while they are constant and parameterized values in inverse problems,
    so that we can investigate the adaptation of the PINN framework to the change
    of the pile driving model. As shown in Table 7, losses are all below 10^-3, which
    shows that the PINN framework has a great ability to predict the unknown parameters
    in inverse problems.


    The inputs of the sound propagation model in shallow water are the spatial coordinate,
    x and r, while the underwater sound pressure is the output of the neural network.
    The depth of the water is set to 10 m and the radiating distance is set to 50
    m. We regard the sea surface as a pressure-release boundary and take the seabed
    as a hard boundary. km is the radial wave number of underwater sound pressure,
    and it could be a real number or an imaginary number. The value of km determines
    the characteristics of sound propagation and attenuation in the radial direction.
    When km is imaginary, sound pressure cannot effectively spread into the distance.
