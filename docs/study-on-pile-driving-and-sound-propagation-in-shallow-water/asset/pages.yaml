  md: 'will discuss in detail in the next section. The same situation is also found
    in the approximation of sound propagation in shallow water. To illustrate our
    algorithm, the two kinds of boundary conditions divided by their values can be
    shown as


    $B_{zero}(u, w, x) = 0 \text{ on } \partial\Omega$ (22a)


    $B_{non-zero}(u, w, x) = C \text{ on } \partial\Omega$ (22b)


    where $\partial\Omega$ is the domain boundary, and $C$ is the value on non-zero
    boundaries.


    In inverse problems of pile driving, the data of the exact solution is given to
    solve some unknown parameters, for example, geometric parameters, material parameters,
    and the natural frequency of the pile. By anchoring and matching values of some
    points, there are also extra losses added to the total losses to be minimized.


    After restricting the neural network to satisfy the physical law, we start to
    train the model by minimizing the loss based on stochastic gradient descent (SGD).
    The loss function involves several parts, such as the PDE module, boundary conditions
    module, and so on. Notice that loss functions of non-zero boundary conditions
    are also defined automatically. The total loss function can be universally defined
    as


    $L_{total} = w_f L_f + w_{B_{zero}} L_{B_{zero}} + w_{B_{non-zero}} L_{B_{non-zero}}$
    (23)


    where


    $L_f = \frac{1}{|T_f|} \sum_{x \in T_f} \left\| f \left( x; u, \frac{\partial
    u}{\partial x} \frac{\partial^2 u}{\partial x^2}, u, \frac{\partial w}{\partial
    x}; \dots \right) \right\|_2^2$ (24a)


    $L_{B_{zero}} = \frac{1}{|T_{B_{zero}}|} \sum_{x \in T_{B_{zero}}} \| B_{zero}(u,
    w, x) \|_2^2$ (24b)


    $L_{B_{non-zero}} = \frac{1}{|T_{B_{non-zero}}|} \sum_{x \in T_{B_{non-zero}}}
    \| B_{non-zero}(u, w, x) \|_2^2$ (24c)


    and $w_f, w_{B_{zero}}$ and $w_{B_{non-zero}}$ are weights of each part.


    Optimizer "Adam" is chosen to minimize the loss function by gradient descent.
    Also, optimizer "L-BFGS" can be used then to help train the model further. The
    test metric of the pile driving model and the sound propagation model is as follows


    $metric = \frac{u_{true} - \widehat{u}}{u_{true}} + \frac{w_{true} - \widehat{w}}{w_{true}}$
    (25a)


    $metric = \frac{p_{true} - \widehat{p}}{p_{true}}$ (25b)


    where $\widehat{u}, \widehat{w}$ and $\widehat{p}$ are the expected values of
    the axial displacement of the pile, the radial displacement of the pile, and the
    underwater sound pressure.


    Compared with common numerical techniques, such as the finite element method and
    the finite difference method, which both involve numerical discretization, we
    can find that the PINN framework implements the solving procedure through a neural
    network. The discretization of those methods is decided by the highest frequency
    of interest, which restricts their application. However, the PINN method is a
    mesh-free and frequency-independent method, and it can address physical problems
    with a suitable framework and proper hyperparameters.


    # 3.2. Additional measure


    Boundary conditions in solving dynamic and vibrational problems of structures
    are widely applied. For example, common boundary conditions of vibration of a
    pile (just taking the beam theory as an example) include the free boundary condition,
    the simply supported boundary condition, and the clamped boundary condition. Those
    traditional


    boundary conditions work well in theoretical derivation and mathematical solving,
    unfortunately not in deep learning sometimes. For some partial differential equations,
    such as free vibration problems of beams, plates, and shells without any externally
    coupled term, it is discovered that those neural networks tend to become lazy,
    so we call this phenomenon "lazy learning". In these cases, the neural network
    is much less accurate than the exact solutions. To be specific, the objective
    functions to be trained, usually displacement functions, are apt to be functions
    of zero, which also satisfy the partial differential equations. Having pointed
    out this problem, the way to avoid lazy learning is proposed in this study by
    setting additional synthetic non-zero boundary conditions as shown in Table 3.


    The values of $D_1, D_2, D_3$ and $D_4$ in Table 3 are obtained from the exact
    solution of model shape functions, respectively. In this way, the neural network
    has to satisfy those non-zero boundary conditions in the procedure of minimizing
    the loss. We can also tune a neural network by setting the loss weights of boundary
    conditions and other parts. Note that not all of the non-zero boundary conditions
    should be adopted based on consideration of training speed and convergence in
    specific situations. Non-zero boundary conditions are used in our work to help
    maximize the training effect in the next section.


    # 4. Results and discussion


    In this section, firstly we optimize the PINN framework by tuning the network
    and hyperparameters. Then we validate the predicted values given by the PINN method
    with the exact solution of PDEs, and investigate the dynamic behavior and sound
    propagation of offshore piles in shallow water. Lastly, we illustrate the advantages
    of the proposed PINN method and give the plan for our further work.


    The operating environment is with an NVIDIA GeForce GTX 1650 SUPER GPU and an
    Intel UHD Graphics 630 GPU. The grammar of TensorFlow is used, and the PINN framework
    is implemented in DeepXDE version 0.8.3.


    # 4.1. Fine-tuning


    The initial work of solving physical equations by using PINN is to try to found
    a good network structure with specific parameters. To build a reliable, robust,
    and efficient deep learning neural network, neither overfitting nor underfitting,
    we first construct a moderate one, and then try different network structures to
    identify the sensitivity of hyperparameters to the PINN framework. After analyzing
    the effects of the hyperparameters on the PINN framework, we choose a reasonable
    PINN framework to learn the dynamic behavior of pile driving and sound propagation
    in shallow water.


    Among all network frameworks and parameters of the PINN algorithm, some, built
    on the consensus with other researchers, can be adopted without any hesitation.
    For instance, the fully connected neural network is proved suitable for similar
    questions; "Adam" is one of the most popular optimization algorithms and can be
    used as the optimizer, which is proved appropriate and effective in general. Let
    us consider a common PINN framework of pile driving and sound propagation in shallow
    water, and its parameters are listed in Table 4. Notice that the same parameters
    are used for the following tuning procedure.


    When it comes to the structure of the network in the PINN framework, neurons,
    layers, and activations are the most important hyperparameters to be tuned prudently.
    The number of neurons and layers is not always better to be more. On the one hand,
    the increase in the number of neurons and layers will lead to an increase in the
    computational quantity. On the other hand, it may lead to overfitting and other
    problems. In addition, an activation function essentially renders the neural network
    nonlinear, which is also crucial to the approximation of the exact solutions.
    Our goal is to build a simple, practical, and adaptable neural network. Therefore,
    we set a series of tests to help us find one neural network with good comprehensive
    coordination of hypermeters.'
