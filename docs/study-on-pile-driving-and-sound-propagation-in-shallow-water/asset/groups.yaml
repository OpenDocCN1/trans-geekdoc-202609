    ## 基于物理信息神经网络的桩打和浅水声传播研究


    蒋泉舟 $^{a}$, 王显中 $^{a,b,*}$, 于敏 $^{a,b}$, 唐敏 $^{c}$, 展必新 $^{a}$, 董帅 $^{a}$


    $^{a}$ 武汉理工大学船海与能源动力工程学院, 武汉, 430063, 中国

    $^{b}$ 教育部高性能船舶技术重点实验室（武汉理工大学）, 武汉, 430063, 中国

    $^{c}$ 教育部水路运输安全国家工程研究中心（武汉理工大学）, 武汉, 430063, 中国


    ## 文章信息


    责任编辑：A.I. Incencik 教授


    关键词：

    桩打

    水下声传播

    物理信息神经网络

    深度学习


    ## 摘要


    本文提出了一种新颖、高效且精确的物理信息神经网络（PINN），用于学习和研究桩打及其在浅水中的声传播。通过将桩的解析位移与预测位移以及桩打产生的水下声压进行对比，验证了所提
    PINN 框架的有效性。通过调整超参数，详细研究了 PINN 算法的优化。随后，构建了一个具有良好反求能力的快速计算 PINN 框架。提出了一种通过添加非零边界条件来帮助神经网络更好地学习偏微分方程的建议。研究表明，由少量神经元、少数几层的浅层网络以及正弦函数激活函数组成的神经网络是可靠且满意的。通过各种测试对
    PINN 框架中未知参数的辨识进行了研究和讨论，PINN 方法能够准确预测桩打运动的解，并对广频段和传播距离范围内的浅水水下声压进行近似。所提 PINN 方法的优势在于，它是处理反问题的强大工具，并且与频率和距离无关。


    ## 1. 引言


    在沿海与海洋工程中，桩作为基础和支撑结构是最重要的结构之一。按截面分类，桩大约分为实心桩和管桩两种。由于管桩具有良好的力学性能和较低的成本，因此被广泛使用。桩的安装是海洋工程中的重要环节。然而，桩打产生的强烈脉冲水下噪声会影响水生生物，例如鱼类、海龟和海洋哺乳动物（Henninger
    and Watson, 2005; Madsen et al., 2006; Popper and Hastings, 2009; Bailey et al.,
    2010; Knaap Inge et al., 2022; 2011; MacGillivray, 2013; Marshall, 2013; Ryan
    Wilkes et al., 2014; Lippert and Otto von Estorff, 2014; Amaral et al., 2022），桩打的振动声学物理模型尚未建立统一基础（Lippert
    et al., 2016）。在使用和相互比较这些理论和数值模型时，存在若干常见问题，例如问题缺乏解析解、缺少可用测量数据以及计算成本高昂。所有这些数值方法和理论模型中最棘手的问题之一是，根据通常稀疏、有限且昂贵的测量数据或实验结果，这些拟议物理模型中存在不确定值或未知参数。


    根据通用逼近定理，解决上述问题的一种潜在且强大的方法是使用人工神经网络（ANN），这是一种先进且智能的工具，从某些数据中学习并反演这些物理模型的重要参数。最近，已开展了许多深度学习研究来解决物理问题，例如偏微分方程，包括泊松方程、拉普拉斯方程、亥姆霍兹方程、伯格斯方程、


