    from partial differential equations and real data for solving forward and inverse
    problems of pile driving. In our research, the ability of PINN to solve unknown
    parameters is quite good based on an excellent feed-forward network. Lastly, to
    distinguish the proposed PINN method from other methods and to explore the possibility
    of the proposed PINN method, we mainly carry out some numerical experiments on
    the frequency domain and geometrical domain. The results of displacements and
    underwater sound pressure given by the PINN method agree very well with the exact
