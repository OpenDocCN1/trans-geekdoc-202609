    ### 3.2. 附加措施


    边界条件在求解结构动力学和振动问题中得到广泛应用。例如，桩的振动常见边界条件（以梁理论为例）包括自由边界条件、简支边界条件和固支边界条件。这些传统边界条件在理论推导和数学求解中效果良好，但不幸的是有时在深度学习中效果不佳。对于某些偏微分方程，例如没有任何外部耦合项的梁、板和壳的自由振动问题，发现这些神经网络容易变得“懒惰”，因此我们将此现象称为“懒惰学习”。在这些情况下，神经网络的精度远低于精确解。具体来说，待训练的目标函数（通常是位移函数）倾向于成为零函数，而零函数也满足偏微分方程。在指出这一问题后，本研究通过设置额外的合成非零边界条件（如表
    3 所示）提出了避免懒惰学习的方法。


    表 3 中 $D_1, D_2, D_3$ 和 $D_4$ 的值分别从模型形函数的精确解中获得。这样一来，神经网络在最小化损失的过程中必须满足这些非零边界条件。我们也可以通过设置边界条件和其他部分的损失权重来调整神经网络。请注意，并非所有非零边界条件都应被采用，具体取决于训练速度和特定情况下的收敛性考虑。在本工作中，非零边界条件用于帮助最大化下一节的训练效果。


    ## 4. 结果与讨论


    在本节中，首先通过调整网络和超参数来优化 PINN 框架。然后，用偏微分方程的精确解验证 PINN 方法给出的预测值，并研究浅水中近海桩的动态行为和声传播。最后，说明所提
    PINN 方法的优势，并给出未来工作计划。


    运行环境配备 NVIDIA GeForce GTX 1650 SUPER GPU 和 Intel UHD Graphics 630 GPU。使用 TensorFlow
    语法，PINN 框架在 DeepXDE 版本 0.8.3 中实现。


    ### 4.1. 微调


    使用 PINN 求解物理方程的初始工作是尝试找到具有特定参数的良好网络结构。为了构建既不过拟合也不过欠拟合的可靠、鲁棒且高效的深度学习神经网络，我们首先构建一个适中的网络，然后尝试不同的网络结构以识别超参数对
    PINN 框架的敏感性。分析超参数对 PINN 框架的影响后，我们选择一个合理的 PINN 框架来学习桩锤打桩和浅水声传播的动态行为。


    在 PINN 算法的所有网络框架和参数中，一些基于与其他研究人员共识构建的参数可以毫不犹豫地采用。例如，全连接神经网络已被证明适用于类似问题；"Adam"
    是最流行的优化算法之一，可用作优化器，通常被证明是合适且有效的。让我们考虑一个常见的桩锤打桩和浅水声传播 PINN 框架，其参数列于表 4。请注意，后续调优过程使用相同的参数。


    关于 PINN 框架中网络结构，神经元、层数和激活函数是需要谨慎调整的最重要超参数。神经元和层数的数量并非越多越好。一方面，神经元和层数的增加会导致计算量增加；另一方面，可能导致过拟合等问题。此外，激活函数本质上使神经网络具有非线性，这对于精确解的近似也至关重要。我们的目标是构建一个简单、实用且适应性强的神经网络。因此，我们设置了一系列测试，以帮助找到超参数综合协调良好的神经网络。


    由于桩锤打桩模型的对称性，输入变量是空间坐标，即轴向坐标，输出是桩的轴向位移和径向位移。不同神经元、层数和激活函数的实验结果分别见图 3、图 4 和图 5。可以看出，图
    3 中不同神经元的均方误差几乎没有显著差异。即使只应用 40 个神经元，训练和测试损失也可以降低到令人满意的程度，这表明神经网络具有很强的拟合能力。图 4
    中可以发现微小差异，即随着层数的增加，计算损失和振荡可以进一步减少。正如我们所预期的，不同激活函数之间存在巨大差异。由于解的数学形式，正弦函数效果确切且表现最好，而其他激活函数学习效果不佳，尤其是
    relu 函数的激活。此外，对于任何正弦形状的解（如傅里叶展开），正弦函数及其导数是作为激活函数的最佳选择，而使用其他激活函数的 PINN 算法则或多或少需要付出代价进行调整。


    同样，研究学习率对学习过程的影响至关重要，因为根据其他研究（Lee et al., 2021），学习率会严重影响结果。我们选择 0.001（许多算法中使用的保守学习率）、0.002、0.003
    和 0.004 作为学习率，其他参数相同，以研究 PINN 框架中学习率的影响。从图 6 可以看出，这四种情况之间存在巨大差异。随着学习率增加，收敛性和数值稳定性受到不利影响。当学习率达到
    0.003 时，训练和测试损失不再收敛，预测值与精确解相差甚远。因此，建议采用较小的学习率和更长的迭代次数的平稳策略。


    PINN 框架参数研究的最佳结果列于表 5，证明 PINN 算法大多可信。最后，我们选择一种算法作为基本模型（如表 6 所示），并进行我们感兴趣的某些实验研究。下一节将给出并讨论使用
    PINN 方法进行桩锤打桩的正问题和反问题以及浅水声传播近似的实验。


    ### 4.2. 数值结果


    根据调优结果，我们最终选择一组参数（如表 6 所示），构建一个可靠的 PINN 框架，以研究近海管桩的动态行为和浅水声传播。


    我们将 PINN 框架应用于桩锤打桩的正问题和反问题。桩锤打桩模型的参数遵循表 4 中的先前参数。如图 7 和图 8 所示，使用所提 PINN 方法预测的轴向位移和径向位移与精确解非常吻合，正如我们所期望的那样，训练、测试和预测损失足够低，以确保模型快速稳定地收敛（最佳模型：正问题中训练损失
    10^-8，测试损失 10^-8，指标 10^-5；反问题中训练损失 10^-4，测试损失 10^-4，指标 10^-3）。此外，可以看出与反问题相比，正问题更容易训练，因为后者的损失函数包含待最小化的额外项，即少数几个锚点。


    接下来，我们重点研究桩锤打桩问题中的频率特性。许多经典且流行的数值方法受感兴趣频率的限制。例如，FEM 通常在低频下有效且高效。如上文所述，PINN 方法与频率无关，其工作工具是神经网络。因此，我们选择
    0 Hz 到 4000 Hz 的频率带，步长为 100 Hz，以研究 PINN 方法的有效性和准确性。如图 9、图 10 和图 11 所示，频率变化时预测精度几乎没有差异。然而，我们必须承认，当频率急剧且大幅增加时，数据集和参数应进行精细调整，例如增加训练数据点以避免过拟合。


    接下来，我们研究参数变化对反问题的影响。在此部分，C0 是待预测的未知值。为了实现反问题，我们将训练数据组织并分配为点集边界条件。以几何参数为例，几何参数在正问题中是常数值，而在反问题中是常数和参数化值，因此我们可以研究
    PINN 框架对桩锤打桩模型变化的适应性。如表 7 所示，损失均低于 10^-3，表明 PINN 框架具有很强的能力来预测反问题中的未知参数。


    浅水声传播模型的输入是空间坐标 x 和 r，而水下声压是神经网络的输出。水深设置为 10 m，辐射距离设置为 50 m。我们将海面视为声释放边界，将海床视为硬边界。km
    是水下声压的径向波数，可以是实数也可以是虚数。km 的值决定了径向方向声传播和衰减的特性。当 km 为虚数时，声压不能有效传播到远处。我们考虑 km 为实数值（如图
    12 所示），因为所提 PINN 框架在实数域中进行。现在我们使用 PINN 方法根据公式 (17) 构建声压近似。如图 13、图 14 和图 15 所示，在
    1000 Hz、2000 Hz 和 3000 Hz 频率下，预测的水下声压与精确解吻合良好。由于 PINN 方法求解浅水声传播的结果非常好，然后我们关注 PINN
    框架在宽频率范围和长距离下求解相同问题的能力。如图 16 和图 17 所示，PINN 方法近似得到的水下声压在大多数情况下并非完全准确但可接受，指标低于 10^-3，这也可以证明
    PINN 方法的有效性相当好。


    ### 4.3. 优势与展望


    所提 PINN 方法在求解桩锤打桩问题中具有许多特性和优势。首先，所提深度学习方法具有革命性的数值计算概念，非常创新。它使用包含物理知识的专门设计神经网络进行训练和学习。凭借强大的近似能力，它在桩锤打桩模型中效果良好。其次，与
    FEM 和 FDM 相比，所提 PINN 几乎与网格、频率和几何域无关，这意味着在高频范围和长距离下，它比其他方法耗时更少。第三，所提方法在求解偏微分方程和从实际数据中学习方面非常稳健，与反问题中推导和计算复杂解相比尤为如此。


    根据我们的研究，我们可以乐观地相信，海洋工程中结构的各种振动声学问题有望使用 PINN 来解决，我们将尽可能专注于这些问题，并在未来研究中致力于算法优化。最有趣、最令人兴奋的待探索研究领域之一是使用
    PINN 和真实测量数据研究桩锤打桩产生的水下噪声辐射，这将大大帮助我们研究流体-桩-土耦合动态模型和水下声学模型。基于深度学习和实际工程，我们在未来可以实现保护海洋生物和海洋环境的最终目标。


    ## 5. 结论


    在本文中，我们提供了一种新方法来帮助研究桩锤打桩问题，并展示了 PINN 方法求解方面的潜力


