    2020; Wight and Jia, 2021; Salvatore et al., 2022）。一种强大的工具被开发为所谓的物理信息神经网络（PINN）来求解偏微分方程（Raissi
    et al., 2019）。PINN 已在许多物理领域中被研究、使用和优化，例如流体力学与振动（Raissi et al., 2020; Chen et al.,
    2021）、结构耐久性（Xue et al., 2022）、波传播（Alkhdhar and Mohamed, 2021）。不同于有限元法（FEM），使用
    PINN 近似解是一种无网格方法，这意味着计算效率与模型频率无关（Karniadakis et al., 2021; Sacchetti et al., 2022）。更重要的是，通过数据驱动建模技术，PINN
    具有以极低成本求解未知参数的非凡能力（Tartakovsky et al., 2020; He et al., 2020; Lu et al, 2021）。一旦构建了前馈神经网络（FNN）并将物理定律作为额外知识嵌入，反问题只需极少量编码，即可仅基于极少数据轻松求解。


    本文的主要工作包括两部分，基于 PINN 框架的动力学和声学研究。第一部分是在水中利用物理信息神经网络研究海上管桩的动力学行为，包括正问题和反问题。在这一部分，展示了所提
    PINN 方法预测耦合桩打模型某些未知参数的准确性、效率和便捷性。另一部分是基于正模理论的浅水声传播研究，其中发现 PINN 方法作为一种与频率和距离无关的方法具有显著优势。


    ## 2. 数学模型


    ### 2.1. 桩打


    海上管桩可以建模为垂直、薄壁的弹性圆柱壳，且损耗因子通常很小，可予以忽略。管桩桩尖位于海床，桩顶受外力冲击。桩打主要有两种典型方式：冲击桩打和振动桩打。冲击桩打迅速且宽频带，而振动桩打频率带较窄，水下声压级较低。无论采用哪种方式将桩打入土中，研究桩的振动特性都是首要任务。在桩打模型中，考虑一根薄壁弹性圆柱桩管以研究其动力学行为（Junger
    and Feit, 1986）。并利用正模理论研究桩打在浅水中的声传播（Ellis and Chapman, 1985）。本工作的主要目的是探究 PINN
    研究桩打动力学行为及其在浅水中辐射的水下声压的能力。因此，考虑海床对桩的影响，但用合理的近似替代。


    定义 $x$ 和 $r$ 分别为桩的轴向坐标和径向坐标，$u$ 和 $w$ 分别为桩的轴向位移和径向位移。此外，几何和材料符号如下：$\rho$，桩的密度，$E$，弹性模量，$\mu$，泊松比，$L$，桩的长度，$R$，桩的半径，$h$，桩的壁厚。在水中薄圆柱壳的动力学分析中，预先做出如下假设：


    - 三种振动类型之间的方位向振动相互独立；

    - 偏微分方程中没有半径方向的变化；

    - 仅将声压视为外力；

    - 涉及四阶项的扭转和弯曲被忽略。


    因此，运动方程可简化为


    \[

    \frac{\partial^2 u(x,t)}{\partial x^2} + \frac{\mu}{R} \frac{\partial w(x,t)}{\partial
    x} = \frac{\rho(1-\mu^2)}{E} \frac{\partial^2 u(x,t)}{\partial t^2} \tag{1a}

    \]


    \[

    \frac{\mu}{R} \frac{\partial u(x,t)}{\partial x} + \frac{w(x,t)}{R^2} = -\frac{\rho(1-\mu^2)}{E}
    \left( \frac{P_a}{\rho h} + \frac{\partial^2 w(x,t)}{\partial t^2} \right) \tag{1b}

    \]


    其中 $P_a$ 为流体辐射压力，垂直作用于管桩壁面。通过耦合流固相互作用（FSI），其表达式可表示为


    \[

    P_a(x,t) = Z(x,t) \frac{\partial w(x,t)}{\partial t} \tag{2}

    \]


    其中 $Z(x,t)$ 表示管桩壁面处桩与水之间的阻抗关系，可通过逆傅里叶变换计算如下


