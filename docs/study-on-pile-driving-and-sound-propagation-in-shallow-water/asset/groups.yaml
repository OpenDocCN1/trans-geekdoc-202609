    Equation (14) describes the characteristics of the sound field for the radial
    coordinate (propagation direction), which is a classic Bessel equation, and its
    solution is a combination of two Hankel functions. Since the time factor is chosen
    as \(e^{i\omega t}\), the first type of Hankel function represents diffuse waves
    and the second type of Hankel function represents convergent waves. To satisfy
    the infinite radiation condition, the latter does not exist. Therefore, the solution
    of Equation (14) can be written as


    ```

    \(p(x, r) = \sum_n A_n \Phi_n(k_{zn}x_0) \Phi_n(k_{zn}x) H_n^{(1)}(k_m r)\)

    ```


    where \(k_{zn}\) is the vertical wave number, \(x_0\) is the depth of a sound
    source, and the coefficient \(A_n\) is decided by the sound source and boundary
