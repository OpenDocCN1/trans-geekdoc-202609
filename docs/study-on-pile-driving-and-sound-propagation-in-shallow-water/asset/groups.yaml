    ## 3. 物理信息神经网络


    本节简要说明了用于求解桩打问题和浅水声波传播问题的物理信息神经网络的构建方法。随后提出了一项建议，帮助神经网络避免偷懒学习并更好地学习偏微分方程。


    ### 3.1. 实现程序


    本研究使用 DeepXDE 来实现包括正问题和逆问题在内的任务。DeepXDE 是开源深度学习平台（TensorFlow、PyTorch、JAX、PaddlePaddle）上的一个
    Python 库。使用 DeepXDE 的动机在于，它是一个已开发的工具，被认为能够训练、测试、预测并求解偏微分方程，以及计算桩打振动声学模型中的未知参数。


    DeepXDE 求解桩打偏微分方程的简要工作流程如表 1 所示，浅水声波传播函数逼近的简要工作流程如表 2 所示。


    本工作中的计算域为一维或二维，即沿桩轴向的位置或沿水平方向的径向距离，输出为轴向位移、径向位移和声压，如下所示


    ```

    $x \in \mathbb{R}^{d_{in}}$ (18a)


    $u, w \in \mathbb{R}^{d_{low}}$ (18b)


    $x, r \in \mathbb{R}^{d_{low}}$ (19a)


    $p \in \mathbb{R}^{d_{low}}$ (19b)

    ```


    构建一个具有输入、N 层和输出的神经网络，用于模拟桩打偏微分方程或逼近浅水声波传播，可数学表达为


    ```

    $N \left( x, u; \frac{\partial u}{\partial x} \frac{\partial^2 u}{\partial x^2},
    w, \frac{\partial w}{\partial x}, \cdots \right) = 0, x \in \mathbb{R}^{d_{in}}$
    (20)

    ```


    神经网络包括输入层、隐藏层和输出层，其中 ReLU 函数、Sigmoid 函数、正弦函数和双曲正切函数用作非线性激活函数。例如，使用正弦函数作为激活函数，隐藏层中的一个神经元可写为


    ```

    $y^{i+1}(x) = \sigma(W^i x + b^i) = sin(W^i x + b^i)$ (21)

    ```


