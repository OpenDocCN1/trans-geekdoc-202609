    problems in dynamics and acoustics. A deep learning framework using PINN is built
    to study the motion of pile driving and sound propagation in shallow water. The
    hyperparameter sensitivity of the proposed PINN method is analyzed in detail.
    It is found that: 1) A small number of neurons in the neural network can get a
    satisfying result; 2) A flat and shallow neural network is good enough to fit,
    but the increasing of layers can make the loss of training and testing reduce
    steadily; 3) As nonlinear operators, activations play an important role in mapping
    inputs to outputs, and the sine function is the best choice for pile driving problems
    in our research; 4) A small learning rate is recommended because of its good stability.
    Furthermore, we suggest using a new technique, namely non-zero boundary conditions,
    to help the neural network avoid lazy learning.


    After building and optimizing the PINN framework, we test its ability to learn
    from partial differential equations and real data for solving forward and inverse
    problems of pile driving. In our research, the ability of PINN to solve unknown
    parameters is quite good based on an excellent feed-forward network. Lastly, to
    distinguish the proposed PINN method from other methods and to explore the possibility
    of the proposed PINN method, we mainly carry out some numerical experiments on
    the frequency domain and geometrical domain. The results of displacements and
    underwater sound pressure given by the PINN method agree very well with the exact
    values over a wide frequency and distance range.


