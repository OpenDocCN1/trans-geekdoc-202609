    solutions in inverse problems.


    According to our research, we can optimistically believe that various vibroacoustic
    problems of structures in ocean engineering are supposed and expected to be addressed
    by using PINN, and we will focus on those problems as much as possible and devote
    ourselves to the optimization of the algorithm in our further research. One of
    the most interesting and exciting research territories to be explored is underwater
    noise radiating from pile driving using PINN with real measured data, which will
    greatly help us to investigate the fluid-pile-soil coupled dynamic model and underwater
    acoustic model. Based on deep learning and practical engineering, our ultimate
    goals of the preservation of marine life and the ocean environment can be achieved
    in the future.


