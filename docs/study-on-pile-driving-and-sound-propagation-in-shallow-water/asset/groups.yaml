    theory is one of the commonly used theories to describe the propagation law of
    the sound field in the ocean and is suitable for sound field modeling in the horizontally
    layered medium. It is an important calculation method of the shallow water sound
    field and has been widely practiced. The main idea of normal mode theory is to
    decompose the sound field into horizontal traveling waves and vertical standing
    waves, and only partially normal waves of one frequency can travel long distances
