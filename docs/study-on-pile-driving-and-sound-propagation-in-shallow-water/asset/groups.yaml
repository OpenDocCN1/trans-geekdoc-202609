    ```

    \frac{\partial^2 \Phi_r(x)}{\partial x^2} + (k^2 - k_m^2)\Phi_m(x) = 0

    ```


    ```

    \frac{1}{r} \frac{\partial}{\partial r} (r \frac{\partial R(r)}{\partial r}) +
    k_m^2 R(r) = 0

    ```


    其中分离常数 k_m 为水平波数。


