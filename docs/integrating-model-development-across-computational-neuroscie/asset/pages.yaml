    model''s structure and functionality. Upon formation, ModECI carried out a series
    of workshops to engage with and get direction from the diverse communities it
    is intended to serve. This involved representatives from academia, industry, and
    non-


    profit organizations devoted to the support of open science and interdisciplinary
    exchange (https://modeci.org/#community Page). These workshops reaffirmed the
    potential value of developing an MDF and provided a clear set of desiderata, priorities,


    and challenges for its development, outlined here. (1) The effort should focus
    specifically on translation between existing programming and execution environments
    (Figure 1A) and not the creation of a new, general-purpose simulation'
