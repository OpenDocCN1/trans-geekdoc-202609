- pgno: 1
  md: 'exchange of such technology and the insights that can emerge from them.³ For
    example, investigators interested in how response properties of individual neuronal
    cell types may impact learning at the circuit level must choose between developing
    their models in neuroscience-specific environments, such as NEURON (https://neuron.yale.edu/neuron),
    that support the creation of biophysically realistic models of neuronal function,
    and ones from ML, such as PyTorch (https://pytorch.org) and TensorFlow (https://tensorflow.org),
    that support computationally efficient network-level algorithms for learning.
    At present there are no automated means for translating models between these environments.
    Understandably, this has been driven by differences in phenomena of interest,
    levels of analysis, and approaches to modeling. However, computational approaches
    and tools developed in one domain or for one purpose often are found to have fundamental
    value in others (e.g., Bayesian methods, deep learning). Similarly, advances in
    the tools for developing and evaluating models (e.g., hyper-parameterization and
    data fitting) are proving useful across domains. Unfortunately, the development
    of software tools that exploit this convergence has not kept pace. Some widely
    used tools have emerged for modeling in particular domains (e.g., NEURON for computational
    neuroscience and PyTorch and TensorFlow for ML). However, rarely do tools created
    for computational modeling in one domain interoperate with those in other domains
    even when the foundational constructs—and the insights that can be gained from
    them—are closely related or the same. This imposes inefficiencies at best; at
    worst, it obscures opportunities for sharing ideas and technologies that can generate
    new insights and drive progress. Even where there are close parallels in the approaches
    and tooling needs across domains, often each uses its own application-specific
    software, making it difficult to see shared opportunities; even where those are
    recognizable, translating individual models or adapting tools developed in one
    environment for use in another is not considered to be worth the cost. Anyone
    involved in computational modeling is painfully familiar with the burden of porting
    code for a model from another laboratory (and sometimes even from individuals
    within


    their own laboratory), which often requires translation into a different language
    and/or is lacking clear documentation. At best this costs many hours of effort,
    and at worst reimplementation is prone to errors and corresponding replication
    failures. Furthermore, when deemed worthwhile, such efforts usually focus on translating
    a specific model between two particular environments, which does not solve the
    problem for other models or environments. Creating a means by which models generated
    in one software environment can be automatically translated into a common format,
    examined, validated, and then shared with and/or integrated into other environments
    would have a transformative impact on the ability for interdisciplinary interactions
    and cross-fertilization going forward, as discussed further below.


    # Hardware optimization


    As models become increasingly sophisticated, whether to accommodate the complexity
    of mechanisms in the brain or to address the complexity of functions required
    to achieve natural intelligence in machines, the need for optimization of execution
    (ensuring the model runs as efficiently as possible in the chosen software/hardware
    environment) has become critical. This, in turn, has carried with it the “Tower
    of Babel” problem described above: tools for optimization are typically specialized
    for specific software and/or hardware environments, presenting a barrier to their
    use with others.


    One approach to this has been the development of “intermediate representations”
    (IRs)—standard formats into which models created using higher-level software tools
    (such as PyTorch and TensorFlow) can be translated and then optimized for different
    hardware platforms. For example, this is the approach being taken with formats
    such as ONNX (Open Neural Network Exchange; https://onnx.ai). However, such efforts
    have been designed largely for the optimization of applications in ML and are
    not as easily accessed by or adapted to environments used in other domains, such
    as NeuroML⁴ in neuroscience or ACT-R⁵ in cognitive science. Other tools that take
    a more general-purpose approach (such as LLVM; https://llvm.org) are usually at
    too low a level to be practical for those constructing computational models in
    neuroscience and cognitive science. Limitations


    in the number and effectiveness of tools for acceleration of models developed
    in those scientific disciplines, and the expertise required to use them, has substantially
    limited the scope and sophistication of such modeling efforts and their interactions
    with similar efforts in AI and ML. The ability to translate models created in
    those domains into a standard format, and from there into existing IRs, would
    open up a tremendous opportunity for neuroscientists and cognitive scientists
    to leverage the considerable efforts being put into optimization by the ML community.
    A fully general standard would also open other novel opportunities for optimization.
    Existing ML IRs have targeted traditional computing hardware, such as CPUs and
    GPUs, but have not yet exploited emerging technologies, such as quantum computing.
    Such hardware may have particular value for a broad class of models that—complementary
    to those that use deep learning methods—address the dynamics of constraint satisfaction
    and decision-making (see below). Such models often involve highly interdependent,
    fine-grained interactions among processing units and multiple time scales of interaction,
    factors that are not addressed by current approaches in AI or ML. They are also
    not well served by standard techniques such as loop vectorization and may be more
    effectively addressed by novel (e.g. polyhedral) approaches to optimization and
    hardware implementation (e.g. quantum approaches). These, in turn, may be most
    suitable for a graph-based format that preserves access to higher-level model
    structure and operations.


    # A STANDARDIZED MODEL DESCRIPTION FORMAT


    The goal of enhancing interactions of computational neuroscientists and cognitive
    scientists with ML and AI researchers prompted the formation of the Model Exchange
    and Convergence Initiative (ModECI; https://modeci.org). The aim of this effort
    is to define, implement, and maintain a standard Model Description Format (MDF;
    https://github.com/ModECI/MDF) that can be used to exchange models across disparate
    modeling software environments in machine-readable form, and/or lower them to
    IRs for machine optimization, in a manner that fully preserves a'
