- pgno: 3
  md: 'and/or programming environment. (2) Accordingly, the format should prioritize
    model translation (in a way that preserves model structure) over efficiency of
    execution—that is, *transpilation* rather than *compilation*—a tradeoff that favors
    the expression of a model as a computational graph. (3) The format should support
    arbitrary patterns of control flow, which presents a challenge for standard forms
    of computational graphs. (4) The initial focus should be on standardizing the
    specification of the structure and execution of the model itself, rather than
    procedures for its use (e.g., parameterization, training protocols, data-fitting),
    with the latter as a subsequent target for further development.


    Based on these considerations, ModECI contributors have developed an initial specification
    for MDF (https://mdf.readthedocs.io/specification). This expresses models a serialized
    format as a computational graph (Figure 1B) in which “nodes” carry out mathematical
    operations, with “ports” that are used to receive input for those operations and
    provide the output to other nodes and “edges” that transmit information between
    ports on different nodes. The formal specification of the format includes a control
    flow syntax that can specify arbitrary orders and dependencies of node execution
    (based on defined “conditions”), including nodes with different timescales of
    computation, cyclic graphs, and hierarchically structured patterns of execution.
    The standard is augmented with a function ontology (https://mdf.readthedocs.io/functions)
    that includes all non-conditional operators in the ONNX function library (https://onnx.ai/onnx/operators)
    and can be extended with additional functions that may be of broad use or of use
    within specific scientific domains (e.g. FitzHugh Nagumo integrator in neuroscience
    or the drift diffusion integrator in cognitive science). MDF also has detailed
    online documentation (https://mdf.readthedocs.io) and an open-source Python library
    of tools (https://github.com/ModECI/MDF) that includes a reference importer and
    exporter of models serialized in JSON, YAML, or binary formats; visualization
    tools for structural validation; and an execution engine that can be used to validate
    expected behavior of models. This Python package is intended to be used as the
    basis for other libraries that


    employ MDF for the automated exchange of models across existing tools for the
    analysis, optimization, and visualization of models from multiple disciplines.


    MDF supports specification of models at many levels of analysis (Figures 1C–1E),
    from biophysically detailed individual neurons and synapses to neural populations
    and abstract tensor-based models, such as those widely used in ML. To demonstrate
    this flexibility, prototype interpreters have been developed with corresponding
    demonstration examples that translate models between MDF and widely used domain-specific
    exchange formats (e.g. NeuroML in neuroscience and ONNX in ML), as well as model
    design and execution environments (e.g., PyTorch in ML).


    # CONCLUSION AND FUTURE WORK


    The current version of MDF, while functional, should still be considered a prototype
    intended to highlight the practicality and potential of such a format and to serve
    as a foundation for further development. ModECI, responsible for the continued
    development of MDF, is an effort in support of an open-source, community-driven
    software project. Current efforts are focused on maturing existing interfaces
    between MDF and widely used resources, such as NeuroML and PyTorch, broadening
    its scope to include others (such as The Virtual Brain, Emergent, Nengo, ACT-R,
    and TensorFlow), expanding MDF capabilities to include the specification of model
    execution environments (such as training and hyper-parameterization protocols),
    and interfacing with data sharing efforts such as Neurodata Without Borders and
    the Brain Imaging Data Structure, BIDS. A guide to the current status of the specification,
    the prototype implementation, supported import/export environments, and examples
    of models and datasets in the format can be found here: https://modeci.org/quickstart.


    ModECI welcomes the participation of anyone interested in these efforts to broaden
    the capabilities and scope of MDF and, more generally, its goal of promoting the
    fluid exchange of models across levels of analysis and disciplines involved in
    computational modeling of the functioning of the human brain and


    reproducing its capabilities in synthetic systems. In these ways, ModECI promises
    not only to provide a medium for interdisciplinary research, but also to serve
    as a model for how this can be effectively pursued in a community-based manner.


    # ACKNOWLEDGMENTS


    The idea for the MDF standard described here initially arose from a workshop sponsored
    by the Center for Reproducible Neuroscience held at Princeton in July 2019, and
    its initial development—as well as formation of ModECI—was supported by a grant
    from the NSF Convergence Accelerator program. We are grateful to the following
    individuals for their considerable contributions to the ModECI effort: Abhishek
