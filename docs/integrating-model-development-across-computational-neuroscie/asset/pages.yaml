  md: '# NeuroView


    # Integrating model development across computational neuroscience, cognitive science,
    and machine learning


    Padraig Gleeson, 1,* Sharon Crook, 2 David Turner, 3 Katherine Mantel, 4 Mayank
    Raunak, 5 Ted Willke, 5 and Jonathan D. Cohen 4,*


    +   1 Department of Neuroscience, Physiology and Pharmacology, University College
    London, London, UK

    +   2 School of Mathematical and Statistical Sciences, Arizona State University,
    Tempe, AZ, USA

    +   3 Princeton Institute for Computational Science & Engineering, Princeton University,
    Princeton, NJ, USA

    +   4 Princeton Neuroscience Institute, Princeton University, Princeton, NJ, USA

    +   5 Intel Labs, Intel Corp., Hillsboro, OR, USA

    +   * Correspondence: p.gleeson@ucl.ac.uk (P.G.), jdc@princeton.edu (J.D.C.)

    +   https://doi.org/10.1016/j.neuron.2023.03.037


    Neuroscience, cognitive science, and computer science are increasingly benefiting
    through their interactions. This could be accelerated by direct sharing of computational
    models across disparate modeling software used in each. We describe a Model Description
    Format designed to meet this challenge.


    # BACKGROUND


    Research in neuroscience, cognitive science, and the areas of artificial intelligence
    (AI) and machine learning (ML) in computer science have long shared common questions
    concerning the mechanisms underlying intelligence, and progress in each field
    has been driven profusely by interactions with the others. For example, McCulloch
    and Pitts,¹ as well as Hebb,² were inspired in their work on the brain by that
    of Turing in defining the principles of computation, and in turn, their work inspired
    Rosenblatt’s Perceptron. Work in neuroscience and psychology provided the foundations
    for breakthroughs in ML for reinforcement learning, which in turn transformed
    our understanding of neuro-modulatory mechanisms such as the brain’s dopamine
    system, while the development of the backpropagation learning algorithm and convolutional
    neural networks, jointly by psychologists and computer scientists, provided the
    foundation for the explosion of work on deep learning. Most recently, insights
    into specific brain subsystems (such the hippocampus) have inspired the development
    of new forms of external memory (such as used in the Neural Turing Machine), while,
    conversely, the development of algorithms for recurrent neural networks has guided
    models of how working memory is implemented in brain struc-


    tures such as the prefrontal cortex and basal ganglia.


    We are now at a critical juncture. On the one hand, as suggested above, neuroscience
    and cognitive science have generated mechanistically explicit models of critical
    brain subsystems, as well as many higher-level cognitive functions. At the same
    time, machines designed by computer scientists now match or surpass humans in
    tasks long considered to be the unique province of the human brain, such as visual
    object recognition, game playing (e.g., Jeopardy, chess, Go), and natural language
    processing. On the other hand, despite this progress, the flexibility and efficiency
    of processing in the human brain remain unique. No existing machine exhibits a
    scope of capabilities as diverse as an adult human or the ability to acquire these
    through training, no less with the efficiency or processing that the brain exhibits
    (all while relying on approximately 20 W of power). Understanding how the brain
    achieves this, and how it can be achieved in artificial form, remains one of the
    greatest challenges facing science and technology. It seems inevitable that, as
    in the past, progress will require the fluid exchange of ideas, discoveries, and
    methods across the relevant disciplines. However, the dramatic increase in sophistication
    of modeling efforts required to address this challenge has brought


    with it a new set of obstacles to the exchange of innovations and advances across
    these disciplines, and thereby, their continued potential for transformative impact.


    # CURRENT OBSTACLES TO MODEL AND KNOWLEDGE EXCHANGE


    Historically, the exchange of ideas across scientific disciplines in a precise
    form has relied on mathematical expressions that are readily interpretable. However,
    as the focus of research has progressed to increasingly complex mechanisms and
    capabilities, progress has come to rely increasingly on numerical methods—that
    is, computational modeling. This poses two closely related, and rapidly increasing,
    challenges to the acceleration of progress: (1) siloing of communities: the proliferation
    of domain-specific software tools for building, executing, and analyzing increasingly
    complex computational models; and (2) hardware optimization: the need to make
    the execution of such models tractable at scale.


    # Siloing of communities


    Reflecting a “Tower of Babel” problem, many of the powerful software tools for
    constructing and executing computational models have been developed independently,
    within and across different (sub)fields, within and substantial barriers to the
    fields, posing substantial barriers to the'
