    Figure 1. The MDF ecosystem, proposed structure of the format, and examples (A)
    Overview of potential scope of ModECI effort, with MDF as a “hub” that allows
    the translation and exchange of computational models over “spokes” that connect
    to modeling environments at multiple levels of analysis and in diverse domains.
