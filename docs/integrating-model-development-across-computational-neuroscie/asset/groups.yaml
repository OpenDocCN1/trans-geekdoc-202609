    (https://mdf.readthedocs.io/functions)，其中包含 ONNX 函数库 (https://onnx.ai/onnx/operators)
    中的所有非条件运算符，并可扩展其他可能具有广泛用途或在特定科学领域内有用的函数（例如，神经科学中的 FitzHugh Nagumo 积分器或认知科学中的漂移扩散积分器）。MDF
    还拥有详细的在线文档 (https://mdf.readthedocs.io) 和一个开源的 Python 工具库 (https://github.com/ModECI/MDF)，其中包括用于
    JSON、YAML 或二进制格式序列化模型的参考导入器和导出器；用于结构验证的可视化工具；以及可用于验证模型预期行为的执行引擎。这个 Python 包旨在作为其他库的基础，这些库使用
    MDF 在现有工具之间自动交换模型，用于多学科模型的分析、优化和可视化。


    MDF 支持多种分析层级的模型规范（图 1C–1E），从生物物理细节丰富的单个神经元和突触到神经元种群和基于抽象张量的模型（例如 ML 中广泛使用的模型）。为展示这种灵活性，已开发出原型解释器及相应的演示示例，用于在
    MDF 与广泛使用的领域特定交换格式（例如，神经科学中的 NeuroML 和 ML 中的 ONNX）以及模型设计和执行环境（例如，ML 中的 PyTorch）之间转换模型。


    ## 结论与未来工作


    MDF 的当前版本虽然功能完备，但仍应被视为一个原型，旨在突出此类格式的实用性和潜力，并为后续开发奠定基础。负责 MDF 持续开发的 ModECI 是一项支持开源社区驱动软件项目的努力。当前工作重点是完善
    MDF 与广泛使用资源（例如 NeuroML 和 PyTorch）之间的现有接口，将其范围扩展到其他资源（例如 The Virtual Brain、Emergent、Nengo、ACT-R
    和 TensorFlow），扩展 MDF 功能以包含模型执行环境的规范（例如训练和超参数化协议），并与 Neurodata Without Borders
    和脑影像数据结构（BIDS）等数据共享工作对接。关于规范当前状态、原型实现、受支持的导入/导出环境以及该格式中的模型和数据集示例的指南可在此处找到：https://modeci.org/quickstart。


    ModECI 欢迎任何有兴趣的人参与这些努力，以扩展 MDF 的功能和范围，并更广泛地实现其目标：促进跨分析层级和学科的模型流畅交换，这些学科涉及人脑功能的计算建模及其在合成系统中的能力复现。通过这些方式，ModECI
    不仅承诺为跨学科研究提供一个媒介，还承诺成为在社区驱动方式中有效推进此类工作的典范。


