    模型的结构和功能。成立后，ModECI 开展了一系列研讨会，以与其旨在服务的多元社区互动并获取方向。这涉及来自学术界、工业界以及致力于支持开放科学和跨学科交流的非营利组织的代表
    (https://modeci.org/#communityPage)。这些研讨会再次确认了开发 MDF 的潜在价值，并为其发展提供了一组清晰的期望、优先事项和挑战，概述如下：


    - 该工作应专注于现有编程和执行环境之间的转换（图 1A），而非创建新的通用模拟和/或编程环境。

