    ## NeuroView

    ## 整合计算神经科学、认知科学和机器学习中的模型开发


    Padraig Gleeson, ¹,* Sharon Crook, ², David Turner, ³, Katherine Mantel, ⁴, Mayank
    Raunak, ⁵, Ted Willke, ⁵, and Jonathan D. Cohen, ⁴,-*


    - 1 伦敦大学学院神经科学、生理学与药理学系，伦敦，英国

    - 2 亚利桑那州立大学数学与统计科学学院，坦佩，亚利桑那州，美国

    - 3 普林斯顿大学普林斯顿计算科学与工程学院，普林斯顿，新泽西州，美国

    - 4 普林斯顿大学普林斯顿神经科学研究所，普林斯顿，新泽西州，美国

    - 5 英特尔公司英特尔实验室，希尔斯伯勒，俄勒冈州，美国

    - * 通讯作者：p.gleeson@ucl.ac.uk (P.G.), jdc@princeton.edu (J.D.C.)

    - https://doi.org/10.1016/j.neuron.2023.03.037


    神经科学、认知科学和计算机科学正在通过相互作用日益受益。通过直接共享各自使用的不同建模软件中的计算模型，可以加速这一进程。我们描述了一种旨在应对这一挑战的模型描述格式。


    ## 背景


    神经科学、认知科学以及计算机科学中人工智能（AI）和机器学习（ML）领域的研究长期以来一直共享关于智能底层机制的共同问题，各领域的进步在很大程度上由彼此间的交互所驱动。例如，麦卡洛克和皮茨¹，以及赫布²，在其脑研究工作中受到图灵在定义计算原理方面工作的启发，反过来，他们的工作启发了罗森布拉特的感知机。神经科学和心理学的工作为机器学习中强化学习的突破奠定了基础，而这反过来又改变了我们对脑调节机制（如大脑的多巴胺系统）的理解；同时，由心理学家和计算机科学家共同开发的反向传播学习算法和卷积神经网络，为深度学习工作的爆炸式增长奠定了基础。最近，对特定大脑子系统（如海马体）的洞察启发了新形式外部记忆（如神经图灵机中使用的）的发展；而反之，循环神经网络算法的发展则指导了关于工作记忆如何在前额叶皮层和基底神经节等大脑结构中实现的模型。


    我们现在处于关键转折点。一方面，如上所述，神经科学和认知科学已生成了关键大脑子系统以及许多高级认知功能的机制明确模型。与此同时，计算机科学家设计的机器现在在长期被认为是人脑独有领域的任务上与人类相匹配或超越人类，例如视觉对象识别、游戏（如危险边缘、国际象棋、围棋）以及自然语言处理。另一方面，尽管取得了这些进展，人脑处理的灵活性和效率仍然独一无二。没有任何现有机器表现出与成年人类一样多样的能力范围，或通过训练获得这些能力的能力，更不用说具备大脑展现的效率或处理能力了（这一切都只依赖约
    20 瓦的功率）。理解大脑如何实现这一点，以及如何在人工形式中实现，仍然是科学和技术面临的最大挑战之一。似乎不可避免的是，如同过去一样，进步将需要跨相关学科流畅地交流思想、发现和方法。然而，为应对这一挑战所需的建模工作日益精巧，给跨学科交流创新和进步带来了新的障碍，从而也阻碍了其持续的变革潜力。


    ## 模型和知识交流的当前障碍


    历史上，科学学科之间以精确形式交流思想一直依赖于易于解释的数学表达式。然而，随着研究重点转向越来越复杂的机制和能力，进步越来越依赖于数值方法——即计算建模。这给加速进步带来了两个密切相关且快速增加的挑战：（1）社区孤岛：用于构建、执行和分析越来越复杂的计算模型的领域特定软件工具激增；（2）硬件优化：需要使这种模型的执行在规模上变得可行。


    ### 社区孤岛


    反映“巴别塔”问题，许多用于构建和执行计算模型的强大软件工具是在不同（子）领域内部及之间独立开发的，对这种技术及其可能产生的见解的交流构成了重大障碍。³ 例如，有兴趣了解单个神经元细胞类型的响应特性如何影响电路层面学习的研究人员，必须在神经科学特定环境（如支持创建生物物理现实的神经元功能模型的
    NEURON (https://neuron.yale.edu/neuron)）和机器学习环境（如支持高效网络层面学习算法的 PyTorch (https://pytorch.org)
    和 TensorFlow (https://tensorflow.org)）之间进行选择。目前，在这些环境之间翻译模型没有自动化手段。可以理解的是，这是由感兴趣现象、分析水平和建模方法的差异所驱动的。然而，在一个领域或为一个目的开发的计算方法和工具通常被发现对其他领域具有基本价值（例如，贝叶斯方法、深度学习）。同样，开发和评估模型的工具的进步（例如，超参数化和数据拟合）正在跨领域证明其有用性。不幸的是，利用这种融合的软件工具的发展没有跟上步伐。一些广泛使用的工具已为特定领域的建模出现（例如，NEURON
    用于计算神经科学，PyTorch 和 TensorFlow 用于机器学习）。然而，为一个领域创建的计算建模工具很少与其他领域的工具互操作，即使基础构造——以及从中可以获得的洞察——密切相关或相同。这最好只会造成低效率；最坏的情况是，它会掩盖共享能产生新见解并推动进步的想法和技术的机会。即使跨领域的方法和工具需求存在密切相似之处，通常每个领域都使用自己的应用特定软件，使得难以看到共享机会；即使这些机会可识别，将单个模型进行翻译或将一个环境中开发的工具调整到另一个环境中使用也不被认为值得成本。任何参与计算建模的人都痛ingly熟悉将另一个实验室（有时甚至是自己实验室内的个人）的模型代码移植过来的负担，这通常需要翻译成不同的语言和/或缺乏清晰的文档。最好的情况，这会耗费许多小时的精力；最坏的情况是，重新实现容易出错并导致相应的复制失败。此外，当被认为值得时，此类努力通常集中在将特定模型在两个特定环境之间进行翻译，这并未解决其他模型或环境的问题。创建一种方式，使在一个软件环境中生成的模型可以自动翻译成通用格式、经过检查和验证，然后与其他环境共享和/或集成，将对跨学科互动和交叉受精的能力产生变革性影响，如下文进一步讨论。


    ### 硬件优化


    随着模型变得越来越复杂，无论是为了适应大脑中机制的复杂性，还是为了解决在机器中实现自然智能所需功能的复杂性，对执行优化（确保模型在所选软件/硬件环境中尽可能高效运行）的需求已变得至关重要。这反过来又带来了上面描述的“巴别塔”问题：优化工具通常专门针对特定的软件和/或硬件环境，构成了与其他环境一起使用的障碍。


    解决这一问题的一种方法是开发“中间表示”（IR）——标准格式，使用高级别软件工具（如 PyTorch 和 TensorFlow）创建的模型可以被翻译成这种格式，然后针对不同的硬件平台进行优化。例如，这就是
    ONNX (Open Neural Network Exchange; https://onnx.ai) 等格式所采取的方法。然而，此类努力在很大程度上是为机器学习应用的优化而设计的，不容易被其他领域使用的环境所访问或调整，例如神经科学中的
    NeuroML⁴ 或认知科学中的 ACT-R⁵。其他采用更通用方法的工具（如 LLVM; https://llvm.org）通常处于过低的层级，对于在神经科学和认知科学中构建计算模型的人来说不切实际。那些科学领域中模型加速工具的数量和有效性有限，以及使用它们所需的专业知识，在很大程度上限制了此类建模工作的范围和精巧程度，以及它们与
    AI 和 ML 中类似工作的互动。能够将在这些领域创建的模型翻译成标准格式，并从中转换为现有 IR，将为神经科学家和认知科学家开辟巨大的机遇，让他们能够利用机器学习社区在优化方面投入的巨大努力。一个完全通用的标准也将为优化开辟其他新颖机会。现有
    ML IR 已针对传统计算硬件（如 CPU 和 GPU），但尚未利用新兴技术，如量子计算。这种硬件可能对一大类模型特别有价值，这些模型（与使用深度学习方法的模型互补）涉及约束满足和决策的动态（见下文）。此类模型通常涉及处理单元之间高度相互依赖的细粒交互以及多个时间尺度的交互，这些因素未被
    AI 或 ML 中的当前方法解决。它们也不太适合循环向量化等标准技术，可能更有效地通过新颖（例如多面体）的优化和硬件实现方法（例如量子方法）来解决。这些反过来可能最适合一种基于图的格式，该格式保留对更高级别模型结构和操作的访问。


