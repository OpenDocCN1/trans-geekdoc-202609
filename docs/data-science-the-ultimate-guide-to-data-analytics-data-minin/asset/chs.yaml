- "# 数据科学：数据分析、数据挖掘、数据仓库、数据可视化、回归分析、数据库查询、商业大数据及机器学习初学者指南\n\n\n\n\n\n# 第一部分：数据科学\n\
  ## 顶尖数据科学家关于数据分析、数据挖掘、统计学、机器学习和大数据的认知——而你还不知道的\n![](img/0001.jpeg)\n\n### 引言\n数据是一项重要的资源。然而，如果你没有正确的手段来处理它，那么你无法从其价值中获益多少。数据科学是跨学科领域之一，其核心目标是通过各种手段从数据中提取价值。本书将利用数据及其结构来探索数据科学领域。此外，它还将描述人们用于将数据转化为价值的高级流程。\n\
  \n你知道数据科学是一个过程。但这并不意味着它缺乏创造力。事实上，当你深入处理数据的各个阶段时，从清洗数据源到机器学习，最后到数据可视化，你会发现处理原始数据涉及许多复杂的步骤。\n\
  \n将原始数据转化为价值的步骤也各不相同。例如，在解释性分析中，你可能有一个已经清理好并准备导入 `R` 的数据集，你对结果进行了可视化但并没有部署模型。\n\n\
  数据以不同的形式存在，但在高级阶段，它分为三大类。这些类别是结构化数据、半结构化和非结构化数据。数据科学家是专家，负责收集、分析和解释海量数据以帮助企业和机构。在本书的所有章节中，你将学习到顶尖数据科学家关于数据分析、机器学习、大数据、数据挖掘和统计学的知识。由于数据科学是一门跨学科领域，本书涵盖了你成为专业数据科学家所必须掌握的关键概念。\n\
  \n## 第一章：什么是数据科学？\n大数据的到来导致了存储空间的扩张。结果，存储成为大多数企业面临的最大障碍。此外，组织和企业都需要建立一个框架并开发解决方案来存储数据。因此，开发了\
  \ `Hadoop` 等其他框架来解决这个问题。一旦这个问题解决，重点就转向了如何处理数据。谈到数据处理时，很难不提到数据科学。这就是为什么理解什么是数据科学以及它如何为业务增加价值非常重要。本章将带你了解数据科学的定义以及它在复杂数据中提取重要见解所起的作用。\n\
  \n### 为什么数据科学很重要？\n传统上，数据是结构化的且规模较小。这意味着如果你想分析数据，并没有困难。为什么？因为可以使用简单的 BI 工具来分析数据。但现代数据是非结构化的，与传统数据不同。因此，你需要先进的数据分析方法。下图所示，在\
  \ 2020 年之前，超过 80% 的数据将是非结构的。\n\n![](img/0002.jpeg)\n\n这些数据来自不同的来源，例如文本文件、财务日志、传感器、多媒体格式和仪器。由于数据的海量特性，无法使用简单的\
  \ BI 工具处理这类数据。因此，需要复杂先进的分析工具和处理算法。这类工具帮助数据科学家分析数据并从中得出重要的见解。\n\n\n\n\n数据科学被进一步应用于预测性分析。这包括气象预报、雷达和卫星等领域。人们已经创建了许多模型，不仅可以预测天气，还能预测自然灾害。这有助于个人预先采取正确的措施并拯救许多生命。下方提供的信息图展示了数据科学产生巨大影响的领域。\n\
  \n![](img/00003.gif)\n\n# 那么，什么是数据科学？\n\n“数据科学”一词在如今非常常见，但它意味着什么呢？一个人要被称为数据科学家需要具备哪些技能？在数据科学中，是如何做出预测和决策的？数据科学与商业智能（Business\
  \ Intelligence）之间是否存在区别？这些都是你将在不久后能找到答案的问题。\n\n## 首先，让我们定义数据科学\n\n数据科学是指多种工具、机器学习原理和算法的结合，其目的是从原始数据中发现隐藏的模式。人们可能会好奇它与统计学有有多不同。下面的图表包含了所有的答案。\n\
  \n![](img/00004.jpeg)\n\n上图显示，数据分析师通过处理历史历史数据来解释正在发生的一切。相反，数据科学家不仅会解释并从中提取洞察，还会使用不同的高级机器学习算法来突出未来特定事件的发生。数据科学家从不同的视角和角度来看待数据。\n\
  \n因此，数据科学帮助个人通过利用规范性分析、机器学习和预测性因果分析来预测预测并做出决策。\n\n* **规范性分析（Prescriptive Analytics）**。如果你需要一个具有智能和能力做出自己决策的模型，那么规范性分析是最佳选择。这个新领域提供建议；它不仅仅是预测，还会建议不同的规范性行动和相关结果。说明这一点的最佳例子是谷歌自动驾驶汽车。车辆收集的数据被用于训练汽车。你可以通过使用算法对这些数据进行进一步挖掘以揭智能。这将允许你的汽车做出决策，例如何时转向、走哪条路径，以及何时加速或减速。\n\
  * **模式发现的机器学习（Machine Learning for Pattern Discovery）**。假设你没有资源可以用于预测；这需要你确定数据集中的隐藏模式以进行准确预测。应用于模式发现中最流行的算法是`Clustering`（聚类）。假设你在一家电话公司工作，想要通过在该地区安装铁塔来确定网络。因此，你可以使用聚类技术来确定铁塔的位置，以确保所有用户拥有最大的信号强度。\n\
  * **使用机器学习进行预测（Make Predictions with Machine Learning）**。如果你想构建一个可以预测公司未来趋势的模型，那么机器学习算法是最佳选择。这属于监督学习；之所以被称为监督学习，是因为已经存在了你可以用于训练机器的标记数据。\n\
  * **预测性因果分析（Predictive Causal Analytics）**。如果你需要一个可以帮助预测未来某个给定事件发生概率的模型，你需要使用预测性因果分析。\n\
  \n# 数据科学与数据洞察的发现\n\n数据科学的主要方面是从数据中发现发现。它涉及挖掘隐藏的洞察，使公司能够做出明智的商业决策。例如：\n\n* 突出其客户群内部的关键细分群体以及这些细分中的特殊购物行为。这引导信息面向不同的市场受众。\n\
  * Netflix 从电影观看模式中提取数据，以发现是什么驱动了用户的兴趣，并据此做出决策。\n* 宝洁（Procter and Gamble）利用时间序列模型理解未来需求。这允许人员规划生产水平。\n\
  \n但数据科学家是如何提取数据洞察的呢？如果你曾问过自己，答案是：它始于数据探索。当面对困难的问题时，数据科学家会变得好奇。他们试图寻找线索并理解数据中的特征。为了实现这一点，个人必须具备更高水平的创造力。\n\
  \n此外，他们可能选择使用定量技术来深入研究。一些例子包括时间序列预测、推断模型、分群分析、合成控制实验等。目标是对数据汇总一个取证观点。因此，数据驱动的洞察是提供战略指导的关键。换句话说，数据科学家的角色是引导利益相关者，让他们学会如何应对发现。\n\
  \n# 数据产品开发（Development of Data Product）\n\n数据产品指的是利用数据作为输入并处理数据以显示结果的技术资产。数据产品的一个经典例子是推荐引擎，它根据数据构建个性化推荐。以下是数据产品的例子：\n\
  \n* 应用于自动驾驶汽车的计算机视觉\n* Gmail 的垃圾邮件过滤器\n* 亚马逊推荐引擎\n\n这与之前讨论的“数据洞察”不同，后者是为了向执行团队提供建议以帮助他们做出更好的决策。相反，数据产品具有技术功能，包含算法并直接封装到应用程序中。在后台运行的一些热门应用示例包括：\n\
  \n* 亚马逊首页\n* Gmail 收件箱\n* 自动驾驶软件\n\n数据科学家在创建产品中发挥着重要作用。这包括构思算法、测试、技术部署和优化。在这种情况下，数据科学家充当构建可广泛利用资产的技术人员。\n\
  \n# 数据科学家的必备技能组合\n\n## 数学能力\n\n挖掘数据洞察和开发数据产品的核心是通过定量视角观察数据的潜力。数据中存在相关性、纹理和维度，可以用数学表示。开发利用数据的解决方案涉及启发式和定量技术。\n\
  \n大多数业务问题的答案包括建立在复杂数学基础上的分析模型，理解模型后的原理非常重要。\n\n另一个误区是数据科学主要是统计学。尽管统计学在数据科学中至关重要，但它不是唯一的数学类型。统计学分为两类：贝叶斯统计和频率统计。大多数人在谈论统计时倾向于指频率统计。然而，需要具备这两种统计学的知识。例如，确定数据集中隐藏特征的常用方法是`SVD`。这种方法根于矩阵数学，与频率统计关系不大。通常，数据科学家具备数学知识的广深度都是的。\n\
  \n## 敏锐的商业头脑（Strong Business Acumen）\n\n\n\n在这种情况下，黑客（Hacking）指的是在应用技术技能为问题定义智能解决方案时所表现出的创造力和智慧。\n\
  \n黑客的能力非常重要，因为数据科学家利用技术来收集海量数据集并处理高级算法。这需要的是先进的工具，而不是 `Excel`。数据科学家必须开发快速解决方案，并将其与复杂的数据系统集成。与数据科学相关的主要的语言包括\
  \ `SAS`、`Python` 和 `R`。其他语言还包括 `Julia` 和 `Java`。\n\n然而，仅仅掌握语言并不是关键。黑客应该能够以创造性的方式解决技术挑战，以便程序代码能够正常运行。\n\
  \n此外，数据科学领域的黑客应该对算法有深彻的理解。他们可以拆解困难且混乱的问题，使其变得可以解决。这非常重要，因为数据科学家工作在一个复杂的算法环境中。因此，他们应该拥有强大的心态来理解复杂的数据。\n\
  \n## 数据科学家 – 好奇心与训练\n\n### 心态\n大多数数据科学家的一个共同特征是他们思考得深，并且具有强烈的智力好奇心。数据科学要求人们具有好奇心。个人必须经常地提出新问题、发现新事物并学习新知识。\n\
  \n事实上，驱动他们工作的不是金钱，而是利用创造力提出问题解决方案的能力，并频繁地投入到好奇之中。从数据中提取高维线索不仅仅是简单的观察。相反，这核心在于发现隐藏在表面之下的真相。数据科学家对他们所做充满感激和热情，并在接受挑战中获得巨大的满足感。\n\
  \n### 训练\n有一种普遍的误解，认为要成为认证数据科学家，必须拥有 `Ph.D.`（博士学位）。这种观点没有考虑到数据科学是一门多学科学科。\n\n##\
  \ 第二章：数据科学的艺术\n涉及到数据分析时，它并没有看起来那么简单。困难的原因之一是因为只有少数人掌握了数据分析的艺术。这意味着只有少数人能够解释它是如何实现的。\n\
  \n惊讶的是，很多人每天都尝试分析数据，但大多数人的努力失败了。这是因为该领域的专家还没有花时间解释他们在分析数据时是如何思考的。\n\n数据科学是一门艺术。它不是人们可以教给计算机的概念。数据分析师使用不同的工具来完成任务，从`线性回归`到`分类树`不一。尽管计算机知道所有这些工具，但数据分析师的角色是找到一种方法，收集所有工具并将将其集成到数据中，以为一个问题开发正确的答案。\n\
  \n然而，数据分析的过程还没有被很好地记录下来。虽然有很多关于`统计学`的书，但没有一本书试图解决如何创建一个真实世界的数据分析解决方案。另一方面，建立一个重要的框架涉及到使用抽象语言对数据分析的元素进行分类。在某些情况下，这种语言可能是数学。相反，分析的相同细节使得每项分析都变得复杂而有趣。\n\
  \n### 分析的循环\n你可能观察数据分析并认为它遵循一个线性的、一步步执行的过程，并有一个良好的结果。然而，数据分析是一种迭代且非线性的方法，由一系列本周运动描述。在这种方法中，每一步都会学习到信息，然后决定是重新执行并完善已经执行的下一步，还是继续进入下一步。\n\
  \n在涉及到分析数据时，迭代过程被用于数据分析的所有步骤中。此外，由于不同软件中封装的算法，某些数据分析可能看起来是固定且线性的。\n\n因此，理解“数据分析”这一术语的含义非常重要。虽然数据研究涉及制定和实施收集数据的计划，但数据分析假设数据已经收集完毕。最重要的是，一项研究将涉及假设的创建、数据收集程序的设计、数据的收集以及对数据的解释。然而，由于数据分析假设数据应该已经收集好，这涉及到。\n\
  \n数据分析的五项主要活动：\n\n1. 提出问题\n2. 探索数据\n3. 创建模型\n4. 解释数据\n5. 沟通结果\n\n这些活动在各种情况下都会发生。例如，在一天内完成，也可以在超过一个月的时间内完成。最重要的是，对于上述每项活动，建议包含以下步骤：\n\
  \n1. 定义期望\n2. 收集信息并与数据进行对比\n3. 如果不符合期望，则修改或修复数据\n\n\n\n\n1. 你的成本估算与支票上的金额匹配\n2.\
  \ 你的成本估算不匹配\n\n如果成本估算和金额匹配，你就可以进行下一个活动。或者，如果你的预期成本是 60 美元，但支票金额是 30 美元，那么你的预期和数据就不符。在这种情况下，产生差异可能有两个原因：第一，你可能预期有误，需要修正；第二，支票可能是错误的并包含了错误。可以预示你数据分析状态的一个关键指标，是将你收集的数据与原始预期进行匹配的难易程度。\n\
  \n## 体量、速度与多样性\n\n大数据有各种“V”。主要的包括速度（Velocity）、多样性（Variety）和体量（Volume）。大数据超过了普通数据库的存储能力。生成的数据规模是巨大的。截至今天，产生了海量的数据。其原因之一是因为交互的增加。交互是数据交易之外的种新现象。数据交互来自浏览器活动、个人数字记录器和地理位置。\n\
  \n随着“物联网”的到来，产生了海量数据，人类花费整个时间试图分析它们。\n\n优秀的数据科学家应该知道如何控制体量。他或她应该知道如何创建算法，能够智能地有效利用数据规模。当你拥有巨大数据时，事物会获得新的方向，因为每个相似性都变得重要，且人们很容易得出错误的结论。在大多数业务应用中，提取相关性就足够了。然而，的数据科学使用了基于这些相关性来确定原因的技术。\n\
  \n数据速度将一直加速。Facebook 帖子、推文以及许多用户生成的财务信息正在增加，且速度更快。速度增加了数据的体量并缩短了数据保留时间。例如，高频交易活动依赖于数据流和快速信息。但数据的真实性会迅速下降。\n\
  \n最后，数据多样性已经进入深层次。由于计算能力的提高，仅依赖于少数变量的模型现在可以产生数百个变量。体量、速度和数据多样性的变化率对于新的经济指标和各种工具来说是可能的。\n\
  \n## 机器学习\n\n机器学习指的是系统如何从它们处理的各种类型的数据中学习。可以根据特定数据训练系统以做出决策。训练过程持续进行，以便系统能够进行更新并增强决策能力。使用垃圾邮件过滤器的系统是演示机器学习应用的绝佳示例。这些系统使用\
  \ `Bayesian filter` 来改变决策。\n\n因此，它将继续领先于垃圾邮件发送者。动态学习的能力很重要，因为它有助于防止垃圾邮件发送者操纵过滤器。信用卡审批使用\
  \ `neural-nets`，是机器学习技术的绝佳示例。此外，与判断相比，机器学习更偏于数据。因此，优秀的数据科学家应该同时具备这两种者。机器学习已帮助找到感兴趣的问题的答案，并进一步证明是一个游戏规则的改变者。让机器学习变得非常有趣的是机器智能的四个特征：\n\
  \n1. 它建立在理论突破的坚实基础之上\n2. 它重新定义了当前的经济范式\n3. 最终结果是商品化\n4. 它从数据科学中挖掘新数据\n\n## 监督学习与无监督学习\n\
  \n系统学习有两类广义的方法：监督学习和无监督学习。\n\n监督学习是系统根据输入的数据类型做出决策的情况。自动信用卡审批和垃圾邮件过滤器应用了监督学习来实现其功能。系统被提供输出和输入的历史数据样本。基于这种类型的数据，系统使用机器学习技术建立两者之间的关系。你将需要使用你的判断来选择处理该任务的最优技术。\n\
  \n无监督学习发生在你只有输入数据（`X`）而没有相应的输出变量时。无监督学习旨在建立数据底层结构的模型，以便你可以了解更多数据信息。它被称为无监督学习，是因为没有正确答案和老师。算法被留用来决定并发现数据中有趣的结构。\n\
  \n聚类分析是无监督学习的一个示例。聚类分析选择一组具有不同属性的实体，并根据属性实体之间的距离远近来划分实体空间。这将通过使用额外的标签对数据进行标记、重新排列和重新定义。`Factor\
  \ analysis` 是无监督学习技术的一部分。\n\n## 预测与预报\n\n数据科学涉及预报和预测。然而，两者之间存在区别。预测（Predictions）侧于突出单一结果。如果一个人说“明天会冷”，他或她就在进行预测。但如果他们说“明天冷的概率是\
  \ 40%”，他们应该是做了一个预报（Forecast）。这是因为预报以概率的形式提供结果。\n\n## 第 3 章：作为变革代理的数据科学\n\n数据科学是一个变革代理。尽管它尚未实现，但这应该是组织准备好的完美时机。计划在未来几年内变化的公司应该通过收集正确的数据和投资分析能力来定位自己。\n\
  \n在构建预测模型时考虑的首要任务是建立你想预测的任何内容，并收集允许你做到此的大型数据集。尽管通过应用预测模型来实现变革还有很一段路程，但组织可以通过采用正确的工具和收集准确的数据来保持在正确的路径上。\n\
  \n### 使用数字参与工具\n\n总会有新系统被创建，允许组织从员工那里收集实时反馈。目前，组织可以利用这些工具并帮助增强他们的服务。这些工具大部分开发和安装时具有更多功能，以揭示更多关于员工的信息。这些工具显示的不仅仅是员工每次在想什么。大多数这些工具为管理提供了相关的改变，并能进一步让我们判断变化是否在所有地点得到了相同的接收。\n\
  \n通过与大型旅游公司合作，它有助于创建一个实时员工反馈的系统。这提供了一个在特定群体中尝试各种变化策略的机会。实时反馈意味着必须快速学会沟通和互动策略是如何被接收的。因此，它以天而非周来优化行动。这些特定数据随后被馈到预测模型中，帮助我们准确识别可以改进特定员工群体采用新实践和行为的行动。\n\
  \n社交媒体分析与利益相关者情绪\n\n\n\n\n变革管理者还有另一种选择，即超越企业的局限，获取与变革计划影响相关的见解。客户、投资者和供应商是变革计划中的主要利益相关者。他们很有可能参与社交媒体，并对公司计划进行的变革发表评论。\n\
  \n语言文本分析的进步意味着，人们可以从使用的词汇选择中检测出与行动和行为相关的线索。此外，某些短语、文章和代词的使用可以帮助个人发现对方的感受。通过应用此类工具分析公司的电子邮件，更容易发现员工对已实施的各种变革的见解和反应。因此，当分析组织内部对话产生的见解与外部社交媒体数据结合时，其效果将更加强大。\n\
  \n## 在当前项目中记录与变革相关的参考数据\n\n你会发现，大多数组织侧重于衡量库存周转率、运营性能和制造效率的微小变化。\n\n然而，处理变革问题的跟踪性能很低。即使项目具有独特的特征，但在改变系统、改进流程和重组项目方面，存在许多相似之处。有机会记录与团队相关的信息、实施所需的时间以及所采用的策略。构建类似的参考数据集可能不会产生即时收益，但整个数据集会不断增加。因此，人们很容易建立一个准确的预测模型，这对于改变组织非常有帮助。\n\
  \n## 数据在变革中的重要性\n\n多年来，公司依赖数据驱动的技术来选择适合高级职位的候选人。如今，零售业务也采用了预测分析来招聘员工。\n\n结果是这些工具提高了项目的性能，并有助于开发新的数据集。假设团队的每位领导和成员在项目开始前都经过心理测试和评估。从这些测试产生的数据对于识别因果模型非常有用，它可以产生正确的变革项目。\n\
  \n## 创建仪表板\n\n想象每个组织都拥有一个与公司领导团队共同创建的定制仪表板。这反映了组织的优先级、未来计划和竞争地位。通过这种方式，仪表板可以对组织创建的特定转型投资产生重大见解。\n\
  \n贡献这些指标的大多数数据已经可用，但尚未被收集。`Change Logic` 的客户已经开发了一个仪表板，用于识别必胜人才的流失和招聘。这并不困难，但它有助于管理团队了解如何使用数据做出直觉决策。虽然创建此类工具可能需要一些时间，但组织需要开始创建仪表板。如果可能，它们应该将其自动化。截至今天，大多数仪表板都容易受到版本控制问题、内部政治和人为错误的影响。仪表板的数字化使其变得客观且透明。\n\
  \n当公司收集数据并使用 `Data Scientists` 构建准确的模型时，所有变革管理者必须有信心聘请 `Data Scientists` 来解读并解释允许公司实现目标的程序。\n\
  \n指标的创建并非易事，因为指标不是一劳永逸的安装。相反，这是一个捕捉数据、精炼仪表板和创建模型的承诺周期。开发可靠的数据集需要时间。数据质量是一个关键问题，还需要一种共享的数据语言，使组织意识到他们正在衡量正确的事物。这一直是其他领域\
  \ `Data Analytics` 的主要问题之一。\n\n（注：提供的原始文本包含大量重复，以上翻译仅涵盖了核心逻辑内容。）\n\n\n\n\n例如，在马诸塞理工学院（MIT），城市演示提供了一种手段，让人们在这些概念可能盈利之前，必须探索它们是否在文化或社会上是能够接受的。通过倡导能够产生社会效益并在追求利润之前达成共识的倡议，它有助于丰富那些未参与过商业运作的成员的分析能力。\n\
  \n## 4. 专精之前的博学性\n\n数据科学包含一个多学科的概念，不能孤立运行。为了确保你能够与其他方合作，专家必须学习其领域专业知识之外的知识。某些机构可能会陷入一种陷阱，认为做数据科学必须拥有`Ph.D.`（博士学位）。但事实并非如此，因为这种实践要求人们具备增强的好奇心，以帮助学习其他学科的语言，并对协作学习有深度的渴求。这些都是博学者的某些特质，使团队准备好与组织中从设计、产品管理、沟通、财务等许多不同角色的人员进行互动。近期，`AI\
  \ Designer`和`Product Scientist`等术语在行业内日益兴起，强调了用科学方法连接不同学科的重要性。同时，来自科学、技术、数据偏见和算法等跨学科领域的特定观点已成为数据科学主要主题的一部分。\n\
  \n一个通用型专家将提供跨学科知识，倡导创意并对组织或社会的需求有更深入的理解。与专家团队相比，由通用型专家组成的团队对于复杂、深层次且非常规的领域提供了更好的通才视角。\n\
  \n## 第 4 章：数据科学技术\n\n无论你对数据科学主题有何种观点，都很很难忽视数据的作用以及分析、收集和背景化数据的能力。\n\n不仅如此，随着机器学习技术的发展以及`Deep\
  \ Learning`（深度学习）等被证明对研究人员具有重要领域的出现，数据科学家继续享受着创新和技术带来的进步。\n\n尽管强大的编码技能至关重要，但数据科学包含了软件工程概念。数据科学家应该具备编码和批判性思维的结合。`Bayes’\
  \ theorem`随后被用于估计响应类别的概率。这些模型可以是线性的也可以是二次的。\n\n### 二次判别分析\n该分析包含另一种选择。与`QDA`类似，该分析假设从从`Y`\
  \ 类中抽取的观测值来自高斯分布。另一个假设是每个类都有一个协方差矩阵。\n\n### 线性判别分析\n该技术通过独立变量的线性组合确定每个观测值的`discriminant\
  \ scores`（判别分数）。在这里，同样假设记录在每个类中的所有观测值来自多元高斯分布。\n\n## 3. 子集选择\n\n该方法将搜索一个与响应相似的`p`预测变量子集。接下来，通过取子集特征的最小平方创建一个模型。\n\
  \n### Best 子集选择\n在这里，对`p`预测变量的每种可能的组合应用不同的回归`OLS`并观察模型拟合情况。该算法有两个阶段：\n\n- 拟合一个具有`k`预测变量的模型。\n\
  - 使用交叉验证预测突出一个模型。\n\n不应忘记使用验证误差，因为`RSS`和`R²`会随着变量的增加而单调增加。最佳使用方法是交叉验证，并使用最高`R²`和最低`RSS`来确定误差估计并进行建模。\n\
  \n### 前向逐步选择\n该技术考虑较小的`p`预测变量子集。它从一个没有预测变量的模型开始，不断向模型中添加预测变量，直到所有预测变量都存在模型中。\n\n\
  ### 后向逐步选择\n这从模型中的预测变量开始工作，然后每次移除最低的预测变量。\n\n## 4. 收缩\n\n这最适用于所有都有预测变量的模型。然而，根据最小二乘估计，估计系数会被减为零。收缩还会降低方差。取决于使用的方法类型，某些系数可以被近似为零。最流行的收缩技术是`lasso`和`ridge\
  \ regression`（岭回归）。\n\n\n\n\n\n## 岭回归\n\n这与最小二乘法相似，唯一的区别在于系数的估计。岭回归选择能够减少 `RSS`\
  \ 的系数估计。但当系数趋于零时，它带有一个惩罚项。这种惩罚可以将系数的估计值降低为零。这就是为什么知道岭回归会移除列空间方差最小的特征非常重要。岭回归的问题在于它在最终模型中包含了所有的\
  \ `p` 个预测变量。此外，惩罚项会将其余的预测变量设为零。通常，当你想要准确预测时，这不是问题，但它可能会导致模型结果难以解释。Lasso 为这个问题提供了答案，因为只要系数足够小，它就可以强制特定的系数移到零。\n\
  \n## 5 降维\n\n这把近似 `p + 1` 个系数的问题简化为 `M + 1` 个系数的简单问题。在这种情况下，`M < p`。你可以通过计算 `M`\
  \ 个不同的线性组合和变量投影来实现这一点。在这种情况下，提取出 `M` 个投影并将其作为线性回归模型的预测变量。可以采用的最常用方法包括部分最小二乘法和成分回归。\n\
  \n### 主成分回归\n\n该技术帮助个人从大量变量中提取一组低维属性。数据的第一个主成分（`PC`）方向的观测值变化很大。这意味着第一个 `PC` 代表了一条紧密拟合数据的直线。可以拟合\
  \ `p` 个不同的主成分。下一个 `PC` 指的是与第一个 `PC`不同的变量的线性组合，并且在约束条件下包含最大的方差。关键点在于，主成分通过在随后的正交方向上对数据进行线性组合，保留了数据中最大的方差。因此，结合相关变量的影响以从可用数据中发现更多信息是正确的。\n\
  \n这种方法涉及突出 `X` 的线性组合，这些组合代表了最佳 `X` 预测变量。这意味着这些组合是无监督的，因为响应变量 `Y` 在确定主成分方向上至关重要。\n\
  \n换句话之，响应变量 `Y` 不能监督主成分的选择。因此，无法保证定义预测变量的方向就可以预测响应。\n\n部分最小二乘法是监督学习的替代方案。它是一种选择一组新的较小特征的方法，这些特征包含旧特征的线性组合。与\
  \ `PCR` 不同，部分最小二乘法使用响应变量来突出新特征。\n\n## 6 非线性模型\n\n在非线性回归分析中，使用模型参数的非线性组合函数对观测数据建模。此外，它依赖于多个独立变量。在这种方法中，通过连续近似来应用数据。以下是你可以用于处理非线性模型的几种技术：\n\
  \n*   **分段函数 (A Piecewise Function)**：该函数通过多个子函数定义，这些子函数适用于主函数定义的特定区间。分段是一种表示函数的方式，而不是特征函数本身。\n\
  *   **样条 (A Spline)**：这指的是使用多项式定义分段的特殊函数。在计算机图形学中，样条表示分段多项式参数曲线。样条由于其构造简单，是指一种流行的曲线。\n\
  \n## 7 基于树的方法\n\n你可以在回归和与分类相关的问题上中使用这种方法。其中一些问题包括分割预测空间以构建简单的区域。由于在预测空间中使用一组划分规则，你可以决定将其总结为一棵树。这种方法被称为决策树方法。以下是最常见的树方法：\n\
  \n*   **自助袋装法 (Bagging)**：这指的是通过从初始数据产生额外的训练数据来减少预测方差的方法。这是通过重复的混合实现的，产生多步相似的因果。如果你能够增加训练集的大小，那么就会减少方差。\n\
  *   **提升法 (Boosting)**：该方法使用不同的模型计算输出，并通过加权平均技术对结果进行平均。通过整合以下技术的优缺点，你可以开发出适用于大规模数据的良好预测能力。\n\
  *   **随机森林 (Random Forest)**：这种算法类似于自助袋装法。在这种算法中，个人可以生成训练集的随机自助样本。除了自助样本，你还可以构建随机特征子集来训练树。由于随机特征选择，自助中的每棵树都被分配了完整的特征集。此外，可以让树之间更加独立，通常会导致更好的预测性能。\n\
  \n## 8 支持向量机 (SVM)\n\n支持向量机是机器学习中属于监督学习模型的一种分类技术。在不同的语言中，它被用于在高维（如 2D 和 3D）中计算超平面。超平面被定义为\
  \ n 维空间的 n-1 维子空间，能够最好地区分具有最大间隔的两类点。基本上，这是一个带有约束的优化问题。\n\n支撑超平面的点位于两侧，被称为支持向量。在数据不可分的情况下，必须将点定义到更高维的空间，在那里线性分离可能是可能的。一个由多个类别的问题可以分为若干一对一二分类问题。\n\
  \n## 9 无监督学习\n\n在无监督学习中，数据组是未知的。这留给学习算法来确定提供的数据模式。聚类是无监督学习的一个很好的例子，将不同的数据集分成紧密相关的组。\n\
  \n![](img/00005.jpeg)\n\n主成分分析 (PCA)。这种方法将帮助你生成数据集的最小维表示。数据集是通过定义一组具有最大方差且相互不相关的线性属性产生的。这种线性降维方法对于帮助人们理解无监督设置中的潜在交互很重要。\n\
  \n层次聚类：通过构建聚类树开发多层次的聚类结构。\n\nK 均聚类：根据到聚类中心的距离将数据划分为 `K` 个不同的簇。\n\n\n\n\n\n## 简介\n\
  \n公司每分钟都会产生并收集数据。从数据分析师到员工，每个人都希望从不同的数据集中获取一些信息，帮助人们做出更好的决策并更高效地工作。\n\n无论你拥有的数据规模有多大，掌握重要关系的最佳方法是通过复杂的分析和易于理解的可视化。没有人希望遗漏任何关键的相关性，或得出可能严重影响其决策的错误结论。当快速进行复杂分析时，结果可以用一种易于使用的方式显示，并允许探索和查询。因此，组织中的每个人都有机会深入挖掘数据并开发洞察，以做出更快、更有效的决策。\n\
  \n要从数据中开发出显著的可视化效果，有一些需要考虑的标准内容。其中一些内容包括数据类型、数据大小和列组成。\n\n数据科学家处理大型数据集。他们面临的最大挑战之一是决定使用什么方法来展示数据。你可能需要对数据进行压缩和折。然而，你仍然需要显示大多数决策者熟悉的图形和图表。不要忘记在当今社会中，可视化是至关重要的。因此，确保它在手机上良好显示。\n\
  \n同时，让人们能够与数据进行实时交互也是很好的。例如，`SAS Visual Analytics` 支持多个业务客户在没有任何任何数据科学技能的情况下，从数据中得出显著的洞察。\n\
  \n智能和自动图表工具有助于根据突出显示的数据类型创建最佳的可视化效果。这些工具将识别相关的发现，而不需要用户编写算法。此外，智能可视化将允许数据科学家和分析师快速构建原型，并减少在实验上花费的时间。\n\
  \n## 图表\n\n## 折线图\n\n折线图揭示了变量之间存在的关系。这些图还追踪一个变量与另一个变量之间的关系。如果你有很多项目并想进行一些比较，那么折线图是最好的方法。为什么呢？它有堆叠线，能够最好地比较不同变量的个体值。\n\
  \n当变量发生变化或必须显示变量，且信息的变更率具有价值时，个人可能会选择应用折线图。同样重要的是，因为在折线图中数据点，所以并不需要选择折线图。然而，取决于你拥有的数据点数量，它将决定要使用的可视化类型。所以，如果你想知道是否应该使用折线图，请计算需要显示的数据点的数量。\n\
  \n## 柱状图\n\n当你想要比较不同组之间的数量时，柱状图是最好的。属于特定类别的值通过柱体显示，然后显示为垂直柱或水平柱。\n\n在值是不同的的情况下，很容易通过我们眼睛观察柱体的外观来注意到它们之间的差异。然而，如果值非常接近，或者有大量值需要显示，比较柱体就会变得困难。\n\
  \n为了确保存在某些视觉差异，你可以为柱体分配不同的颜色。颜色可以揭示如状态或范围等信息。如果你决定给柱体上色，它看起来既漂亮又智能。不同的颜色将允许观众看到柱体之间的差异。\n\
  \n柱状图有不同的种类。例如，渐进柱状图显示了原始值的衡量标准在交易期间如何增加或减少。第一个柱体从初始值开始，每个后续柱体从初始柱体结束的地方继续。这个柱具有长度和方向，用来指示交易的规模和类型。\n\
  \n## 散点图\n\n散点图是一种描述两个数据项共同差异的二维图表。散点图中的每个标记都是一个观测值。标记的位置将揭示每个观测值的值。\n\n当你想要在 `X`\
  \ 和 `Y` 变量之间建立关系时，应该使用散点图。当存在依赖关系且每个变量都可以影响另一个变量时，这些变量被认为是相关的。例如，利润和收入之间存在关系。当收入增加时，利润也会增加。散点图是使用以可视化关系的最佳工具。散点图允许人员通过关联和回归来进行统计分析。在图中定义变量的关系时，关联是重要的。另一方面，回归允许人员识别数据中的特定关系。\n\
  \n一旦所有数据点都绘制完成，就可以根据特定关系来开发数据。使用散点图可以帮助你查看分布。当你有大量数据点时，建议使用散点图。然而，如果你有一个较小的数据，表格可能是有效的。\n\
  \n## 气泡图\n\n气泡图是散点图的一种，其中标记用气泡标识。气泡图将揭示三个测量值之间的关系。如果你有两个测量值，可以使用坐标轴来突出。第三个测量值通过气泡定义。\n\
  \n当你有数百个值时，最好使用气泡图。你可以选择应用颜色来说明测量值，并对气泡演示数据的变化。地理气泡地图显示在地图上。每个气泡都设置在特定的地理位置。\n\n\
  ## 饼图和环形图\n\n饼图和环形图一直存在巨大的讨论。两者都帮助个人创建部分之间的比较。但是很难注意到，因为人类的眼睛无法容易估计面积和比较角度。所以，如果你决定使用图表，你会发现很难比较大小相似的数据。\n\
  \n如果你构建仪表板，建议考虑环形图或饼图的工作原理。饼图或环形图的效率由图表尺寸报告所需的空间揭示。由于这些图表是圆形的，大多数都需要额外的空间。\n\n\n\
  \n\n处理海量数据并非易事；你可能会发现很难理解它，因此建议使用更好的可视化工具。SAS Visual Analytics 内置的自动图表功能会根据数据的大小和类型对数据进行审查。它是最优秀的可视化工具。正因如此，业务分析师和员工可以轻松使用该工具进行数据可视化。它将帮助他们创建数据分级，并以非常有交互的方式探索数据。\n\
  \n数据量可能会成为问题，因为传统的架构和软件可能无法处理海量数据。\n\n尽管如此，在处理大数据时，最常用的描述性统计计算可能会变得复杂。例如，如果数据集有十亿行，而你想构建一个包含两个测量值的散点图，可能很难看到大量的数据点。同样，帮助个人视觉化数据的应用程序类型也可能失效。唯一可以求助的另一种解决方案是分箱（binning）。分箱要求个人从两个轴收集数据，以便他们以最有效的方式可视化大数据。\n\
  \n箱线图描述了五种统计量的地理显示。这五种统计量包括中、下四位数、上四位数、最大值和最小值。当你想要创建一个摘要来定义一组数据的分布时，上述所有五个统计量都关重要。\n\
  \n通常，箱线图对数据科学家来说是有效的，因为它识别了被称为离群值的异常点。通常，数据中离群值的百分比在 1-5%之间波动。对于传统规模的数据集，这种特定的比例并不容易发现。然而，对于那些处理海量数据集的人来说，识别非常困难。\n\
  \n## 如何可视化半结构化和非结构化数据\n\n大数据的差异导致了若干挑战。这些之所以是因为结构化和半结构化数据都需要可视化技术。词云可视化可以用于非结构化数据，帮助指示词的频率。这种频率可以低，也可以高。\n\
  \n在 SAS Visual Analytics 中，词云在分类和关联创建中非常重要。根据单词的使用方式，单词被进一步分类分类。\n\n数据科学家还使用网络图来可视化半结构化数据。网络图根据代表个人之间关系的节点检查关系。网络图中的节点代表点，而连线（ties）代表线。\n\
  \n你可以在不同的学科和应用中使用网络图。例如，分析社交网络的企业可以发现客户的互动。\n\n## 第 6 章：数据科学中的机器学习\n\n机器学习指的是一种分析数据方法，通过训练计算机来执行人类和动物天生就能完成的任务。它完全关乎从经验中学习。机器学习算法具有计算方法，可以帮助个人从数据中发现信息，而无需等待预定义的方程。当用于学习的样本增加时，这些算法会动态地提高数据性能。\n\
  \n### 为什么机器学习很重要？\n\n大数据的增长使得机器学习成为解决问题的本质方法，例如：\n\n- 图像处理和计算机视觉\n- 用于负载预测的能源生产\n\
  - 用于算法交易和信用评分的计算金融\n- 用于帮助识别语音的自然语言处理\n- 航空、汽车和制造业的预测性维护\n\n机器学习算法识别数据中的自然模式以得出见解并做出明智决策。它每天被用于股票交易、医疗诊断和预测中的关键决策。\n\
  \n机器学习应用的示例包括：媒体网站在建议用户可能下载或观看的电影之前，先分析客户数据。此外，零售商必须从客户购买产品的方式中提取出重要信息。\n\n### 什么时候应用机器学习是正确的？\n\
  \n当你准备处理一项复杂任务或问题时，那就是应用机器学习的最佳时机。\n\n### 机器学习的真相\n\n机器学习有其局限性。构建像《星际迷航》或《2001 太空漫游》中的\
  \ Hal 9000 那样的智能机器是不可能的。但在许多真实世界的处理应用中，机器学习运行得如丝般。以下是机器学习应用的热门类别：\n\n#### 图像处理\n\
  \n它要求人们分析图像并获取数据或执行某些转换。示例包括：\n\n- 图像标记（Image Tagging）。这类似于 Facebook，算法可以自动识别照片中你的脸或你朋友的脸。基本上，机器学习算法将从手动标记的照片中学习。\n\
  - 光字符识别（Optical Character Recognition）。一旦算法学会了如何将扫描的文本文档转换为数字版本，算法就必须知道如何将图像转换为相应数字字母的手写字符。\n\
  \n#### 文本分析\n\n这是从电子邮件、文档、聊天和推文中分类或提取信息的过程。流行的示例包括：\n\n- 情感分析（Sentiment Analysis）。这是文本分类的另一个应用领域。在此类分类中，算法必须知道根据作者表现的情绪，将观点分类为中性、积极或负面。\n\
  - 信息提取（Information Extraction）。这涉及学习提取特定的信息或数据。\n- 垃圾邮件过滤（Spam filtering）。这是最广泛使用的文本分类应用之一。垃圾邮件过滤器根据内容和主题将电子邮件分类为垃圾邮件。\n\
  \n#### 数据挖掘\n\n这是一种用于从数据中确定预测的方法。该定义看起来是通用的，但可以将其看作是从数据库中的巨型表中提取重要信息。每一行都由训练实例和一列特征组成。你可能对预测表中依赖于其他所有列的新列感兴趣。例如：\n\
  \n- 关联规则（Association Rules）。以超市或电子商务网站为例。通过查看一起购买的产品类型可以确定客户的购买习惯。这种信息对于营销目的很有用。\n\
  - 异常检测（Anomaly Detection）。寻找离群值。例如，在信用卡欺诈检测中，你可能从用户的正常购买模式中识别交易类型和离群值。\n- 预测（Predictions）。这涉及从其他变量预测一个变量。例如，你可以通过学习现有客户的信用分和简介，预测银行新客户的信用分。\n\
  \n### 机器学习应用的步骤\n\n每个机器学习任务分为几个步骤：\n\n1. **选择机器学习方法**\n在开始任何步骤之前，必须表达机器学习问题。自己你想发现什么？你想对数据分类、预测新值还是根据某些因素进行分组？一旦选择了你想执行的机器学习任务类型，就可以进入模型阶段。\n\
  \n2. **收集数据**\n在这一步中，你可以选择将数据写在纸上、将电子表格存储在 SQL 数据库中并记录文本文件。收集的数据应该是电子格式，以便于分析。\n\
  \n3. **探索和准备数据**\n机器学习项目的有效性取决于它所使用数据的质量。建议将 80% 的精力投入到数据准备。这一步需要大量的人工干预。\n\n\n\n\
  \n## 4. 在数据上训练模型\n\n正确的机器学习任务将识别出正确的算法。在此阶段，你可以将数据输入到模型中。学习器（learner）指的是在某些数据上进行训练，并以最佳方式调整以适应数据的机器学习算法。\n\
  \n## 5. 评估模型性能\n\n由于每个学习器生成的解决方案都带有偏置，因此确定算法从经验中学习的最优方式是很有意义的。根据所应用的模型，你可以使用测试数据集来确定学习器的准确性。\n\
  \n## 6. 增强模型性能\n\n如果需要更好的性能，使用高级机制来提高模型的性能是很有意义的。\n\n一旦完成这些步骤且模型看起来运行良好，它就会被部署以执行其所需的任务。模型可以用于为预测生成评分、为新数据生成预测值，并为研究和营销提供重要的洞察。\n\
  \n跟踪已部署模型的成功与失败至关重要，这可以帮助个人产生额外数据来训练下一代模型。\n\n## 选择机器学习算法\n\n你选择的机器学习算法类型取决于现有的数据以及手头的任务。在数据收集、探索和数据清洗过程中，考虑这一过程至关重要。\n\
  \n### 输入数据\n\n所有的机器学习算法都需要一些训练数据。训练数据以特征（features）和示例（examples）的形式存在。\n\n示例包含了所学习的基础概念的单一样例实例。它指的是描述分析中所关注的原子单元的单个数据集。如果你正在开发一种选择垃圾邮件的学习算法，示例将包括来自电子消息的数据。对于要识别癌症肿瘤，示例可能需要来自不同患者的活检样本。\n\
  \n特征（feature）指的是属性的特性或示例。它对于学习正确的概念至关重要。在之前的示例中，垃圾邮件检测数据集中的属性可能包括邮件消息中使用的单词和域名。在癌症数据集示例中，它可能是来自活检细胞的基因组数据，甚至是患者的测量特征，如年龄、体重、血压和身高。\n\
  \n特征以不同的形式存在。。如果一个特征揭示了用数字测量的特性，则被称为数值型（numeric）。例如，体重和身高就是数值型的。同时，如果有一个特征决定了由一组分类器表示的属性，则该特征被称为命名型（nominal）或类别型（categorical）。如果以下类别具有特定的顺序，则该特征被称为序数型（ordinal）。注意这些特征代表了什么至关重要，因为数据集中特征的数量和类型都有助于定义正确的机器学习算法。\n\
  \n### 机器学习算法\n\n它们分为两种：监督学习器（supervised learners）和无监督学习器（unsupervised learners）。你已经对这两种类型的算法了解了一两点。简而言之，监督学习器创建预测模型，而无监督学习器构建描述模型。数据科学家应该选择哪种类型取决于当前的任务以及他们需要实现什么。\n\
  \n如果你的任务是通过应用数据集中的另一个值来改变一个值的预测，那么使用预测模型是最佳选择。\n\n学习算法将尝试识别并建模目标特征与其他特征之间的关联。预测模型并不要求人们去预测未来事件。\n\
  \n由于预测模型对于根据正样本和负样本进行学习所需所需的详细指令，这一过程被描述为监督学习。在这种情况下，监督并不描述人类的参与，而是目标值提供了监督作用，引导学习器学习它们需要学习的任何内容。最重要的是，当给定一组数据时，算法将尝试优化一个函数，以确定生成目标输出的特征值组合。\n\
  \n应该预测的目标特征是一个类别特征，被称为类（class），并由不同的类别水平（levels）组成。一个类可以包含多个水平。\n\n监督学习器可以进一步帮助预测数值值，例如实验室值、收入和测试分数。为了预测这些数值值，应用了线性回归模型。尽管回归模型不是唯一的模型，但它们是最常用的模型。\n\
  \n描述模型（descriptive model）用于处理可能从数据摘要中获得洞察的任务。尽管它预测一个特定的感兴趣的目标，但它的不同之处在于没有哪个特征比另一个更重要。\n\
  \n鉴于描述模型没有要学习的目标，训练描述模型的过程被称为无监督学习。这些方法非常适合用于数据挖掘。描述建模的示例是模式发现（pattern discovery）。这种方法允许人们识别数据中的共同关系。模式发现在购物篮分析中非常常见。在购物篮分析中执行的最重要任务是选择客户喜欢成对购买的产品。\n\
  \n在现代世界中，数据集不断扩大并增加复杂度。机器学习方法在生物医学领域和构建预测模型方面已变得重要。大多数研究人员并没有接受过构建和解释这些模型的良好训练。因此，为给定的数据集选择正确的方法可能非常困难。\n\
  \n识别研究目标至关重要，这样你才能确定它需要监督学习还是无监督学习。例如，如果主要目标是开发一个可以预测患者疾病状态的模型，那么使用监督方法是正确的。选择使用无监督方法（如聚类）可能会混合信号并产生最糟糕的预测器。相反，如果目标是开发数据集的概述以确定最强模式以及样本是否可以分为子组，则应该应用无监督方法。\n\
  \n采用监督方法时要记住的另一个因素是，必须显式地搜索与你想预测的标注相关的模式。你可能会在海量数据空间中发现某些东西，可以预测当前数据集中的标注。但这并不是你的目标。然而，你感兴趣的是确定特定模型是否可以泛化。\n\
  \n\n\n\n大数据并没有创造新的存储机制和新的数据类型，但它开发了新的分析方法。本章将定义大数据分析，并回顾分析大数据以开发模式和关系的不同方法。此外，你将学习如何从海量信息流中做出明智的预测并推导出业务洞察。\n\
  \n需要注意的是，大数据并不是一组独立的活动。因此，你需要一套凝聚的解决方案来帮助进行大数据分析、收集数据并发现新的洞察，以帮助做出频繁的决策。大多数组织通过同时应用商业组件和开源组件来完成任务。构建一个集成的大数据分析架构，使人员能够执行不同类型的活动，并在组件之间传输数据。\n\
  \n## 什么是大数据？它为什么重要？\n\n大数据描述的是规模超过了数据库软件工具（如存储、捕获和分析）正常功能的数据集。\n\n它指的是一组非常庞大且复杂的数据，使得无法使用简单的数据库管理工具进行处理。\n\
  \n## 大数据分析\n\n`Big Data Analytics`（大数据分析）一词在如今的市场已被广泛使用。在大多数情况下，它与`Data Mining`（数据挖掘）和`Business\
  \ Intelligence`（商业智能）等其他相关概念一起使用。虽然所有这些术语指的是如何分析数据，但当多个交易、数据量和数据源变得巨大且复杂时，大数据就不一样了。在这种情况下，需要特定的方法和技术从数据中提取洞察。\n\
  \n这引出了大数据的通用定义，它包含三个 V：`Velocity`（速度）、`Variety`（多样性）和`Volume`（量）。\n\n* `Volume`（量）。指的是大型数据集。\n\
  * `Variety`（多样性）。描述来自不同数据源的数据。数据可能来自外部和内部数据源。最重要的是数据可以是任何格式。它可以是日志数据，甚至是来自数据库表格的结构化数据以及半结构化数据，如`XML`。\n\
  * `Velocity`（速度）。描述来自交易的大规模数据，其特征是数据流具有更高的刷新率、速度和时间性。\n\n根据上述描述，大数据可以被视为一个高速度、高容量和高多样性的信息库，需要成本效益且创新的信息处理手段。这一过程导致了洞察力的提高、更好的决策以及流程自动化的改进。\n\
  \n到目前为止，显而易见的是大数据不仅关乎数据量有多大，数据还应该以快速的速度和复杂的形式到达。此外，它应该来自不同的来源。\n\n最重要的一点要强调的是，尝试定义构成大数据的元素可能具有巨大的价值。每个人都应该知道，今天的大数据可能与明天的数据不同，因为技术在不断变化。简而言之，它是相对的。\n\
  \n## 我们所讨论的数据类型\n\n组织具有捕获交易数据的传统。此外，组织还以快速从其运行环境中捕获并存储额外数据。示例包括：\n\n* `Text data`（文本数据）。这是最大且最流行的大数据类型之一。其目标完全是从文本中开发主要事实，并将这些事实作为剩余分析过程的输入。\n\
  * `Web data`（网络数据）。可以捕获网络用户的数据，如搜索、阅读、页面浏览和购买。这可以用于提高流失模型、定向广告和客户细分等领域的性能。\n* `Smart\
  \ grid and sensor data`（智能电网和传感器数据）。如今，从油管、汽车和风力涡轮机记录传感器数据。数据以极高的频率收集。传感器数据产生与机械和发动机性能相关的深度信息。它有助于问题的诊断并更快速地开发缓解机制。\n\
  * `Time and location data`（时间和位置数据）。`GPS`、`WI-FI`连接和手机使得时间和位置成为一个良好的数据源。结果，大多数组织已经理解了监控客户移动的重要性。组织接受了需要知道客户在任何给定时刻所在地。另一个重要点是能够查看聚合的时间和位置数据。在聚合层面查看时间和位置数据产生了许多应用。因此，时间和位置数据成为最敏感的大数据类型之一，必须谨慎对待。\n\
  * `Social network data`（社交网络数据）。在`Facebook`、`Instagram`和`LinkedIn`等社交网络中，可以进行链路分析并发现网络。社交网络分析可以展示哪些广告可以吸引用户。这是通过考虑用户的兴趣和他们的社交圈实现的。\n\
  \n对于许多此类大数据源，优势不在于数据类型，而在于它与其他数据源结合时所产生的价值。\n\n## 大数据与传统数据的区别\n\n大数据与传统数据源在几个方面有所不同。首先，大数据可以被视为一种新的数据源。执行的交易类型与传统的实施的并没有很大区别。组织可以记录`Web\
  \ transactions`，但这与几年前的交易没有区别。区别在于捕获的行为。行为可能包括浏览器行为，这代表了新数据的形式。\n\n其次，人们也可以认为数据的速度已经增加到足以被视为新数据源的程度。例如，电表过去是手动读取的。现在有了智能电表可以每分钟自动读取一次。人们可以进一步认为，频率已经增加到支持不同深度分析的程度。\n\
  \n\n\n\n个人有必要处理大数据而非传统数据。如果你读了许多似乎在炒作大数据的内容，很容易认为仅仅因为大数据具有高容量、多样性和高速度，它实际上就比数据更好。然而，事实并非如此。大数据的威力在于分析结果出来后你所采取的分析和行动。`Big\
  \ Data` 本身没有任何价值。只有当你获得关于数据的某些洞察时，它才是至关重要的。这种洞察可以用来做出决策。\n\n## 洞察的不同类型\n\n除了数据之外，根据分析重点的不同，还有一种被称为范式转移的概念。这指的是从描述性分析向预测性分析和规范性分析的转变。涉及到描述性分析时，它试图回答关于过去发生了什么的问题。通常，这都是与报告有关。以下是描述性分析处理的一些问题示例：\n\
  \n* 哪个客户或产品利润最高？\n* 一年第一季度产生了多少销售收入？\n* 我们在上半年流失或赢得了多少客户？\n* 由于促销活动，我们赢得了多少客户？\n\
  \n预测性分析侧重于接下来可能发生的事情。这非常困难，涉及到对未来趋势和模式的延伸。问题示例包括：\n\n* 下个季度呼叫中心的预计人数是多少？\n* 为该客户提供的下一个最佳优惠是什么？\n\
  * 哪些客户可能会流失？\n\n规范性分析试图回答与“我该如何处理这个问题？”相关的问题。这是分析变得业务化的点。它完全取决于业务和案例。说明这一点的一些示例包括：\n\
  \n* 得知某人流失概率较高，因此向他/她提供了一个价值包。\n* 确定客户在网页上的观看历史，然后建议客户接下来可以阅读的文章。\n\n上述所有示例在大数据时代就已经存在。然而，当时的重点完全在于报告。但随着\
  \ `Big Data` 的到来，现在可以：\n\n* 获得前瞻性的洞察。\n* 增加对快速且可操作的洞察的需求和能力。\n\n前瞻性的洞察意味着企业可以预测接下来可能发生什么。传统上这是可能的，但准确性非常有限。\n\
  \n因此，`Big Data` 改变了这个方程式。快速且可操作的洞察意味着无论从数据分析中得出什么，它必须对业务流程和嵌入流程产生影响。\n\n例如，推荐系统可以自动生成个性化推荐，就像\
  \ Amazon 根据观看历史的差异，推荐用户购买与他人想要购买的不同物品。这并不意味着描述性分析不重要。事实上，报告将继续是业务生活中一个重要的组成部分。在实践中，建议个人应该灵活并应用不同的分析——什么能带来最佳结果取决于所提问题的性质以及为正确的工作选择正确的工具。\n\
  \n## 大数据分析的业务价值\n\n`Big Data` 为任何企业带来了巨大的益处。它帮助从数据中提取洞察，根据洞察做出明智决策并实现决策自动化。\n\n\
  在详细层，每个 `Big Data` 解决方案都解决组织中存在的特定问题。因此，在开发一个业务案例时……（根据输入文本已截断）\n\n\n\n\n这是一个开源数据可视化与分析工具，专为非数据科学专家的人士而设计。它具有简单的交互式工作流和高级工具箱，帮助用户构建一个可以分析和可视化数据的交互式工作流。然而，Orange\
