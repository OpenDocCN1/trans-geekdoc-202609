    An open source data visualization and analysis tool designed to be used by those
    people who are not experts in Data Science. It has a simple interactive workflow
    and an advanced toolbox to help a person build an interactive workflow that they
    can analyze and visualize data. However, the type of visualization which Orange
    creates is different from scatter plots, bar charts, and dendrograms.


    ### 3. Knime

    KNIME is another open source solution to use in data analysis. This tool allows
    an individual to explore and discover hidden insights in data. The tool has over
    1000 modules and hundreds of examples that one can run to learn how to use it.
    In addition, there is an advanced range of integrated tools and complex algorithms.
    KNIME offers some of the best toolboxes that any Data Scientist can use.


    ### 4. R-Programming

    This is considered as the standard tool among statistical programming languages.
    Some people consider it the “golden boy” of Data Science. R is also open source
    software that anyone can install and use in statistical computing and graphics.
    It is compatible with Windows, MacOS platforms, and UNIX. It is useful in Data
    Science, and it has many job opportunities if you are an expert.


    Since R is free, anybody can install it, use it, upgrade it, modify it, clone
    it and resell it. R will help one to save money on technological projects and
    offer regular updates that are useful for any statistical programming language.
    It is a high-performance language that will help users deal with an extensive
    data package and build a great tool to help manage Big Data. Also, it is best
    to use for resource-intensive applications.


    Apart from Data Mining, using the R programming gives you the chance to apply
    a statistical and graphical technique. This includes linear and nonlinear modeling,
    time-series analysis, classical statistical tests, and clustering among many other
    methods.


    ### 5. RapidMiner

    Similar to KNIME, RapidMiner deals with visual programming and is the best when
    it comes to modeling, analyzing, and manipulation of data. RapidMiner improves
    the productivity of Data Science teams. It has an open-source platform to support
    Machine Learning, model deployment, and data preparation. Since it is an integrated
    Data Science platform, it speeds the development of a complete analytical workflow
    from model validation, Machine Learning, and deployment.


    ### 6. Pentaho

    Pentaho deals with problems that affect the ability of an organization to accept
    value from different data. The platform will simplify data preparation and data
    blending as well as a collection of tools used in the analysis, visualization,
    reporting, exploration, and prediction. Pentaho is designed to ensure that each
    member of a team can transform data into value.


    ### 7. Weka

    Another open source software designed with the capability to handle Machine Learning
    algorithms to use in Data Mining tasks. You can directly use the algorithm to
    process a data set. It is also the best to use in developing a new Machine Learning
    scheme because it is implemented fully in the `JAVA` programming.


    Since the Graphical User Interface of Weka is simple and easy to use, it facilitates
    an easy transition into the field of data science. Written in the `Java` language,
    anyone experienced in Java can invoke the library into their code.


    ### 8. The NodeXL

    A data visualization and analysis tool that shows relationships in a data set.
    Since it is open-source software, it is free to use to analyze and create visualizations
    from data. It is one of the best tools in Statistics that you can use to analyze
    data. It has different modules such as social network data importers and automation.
    With NodeXL, you will still analyze your data fast and easy.


    ### 9. Gelphi

    Written in `Java` language, Gelphi comes as an open-source visualization and network
    analysis tool.


    ### 10. Talend

    It is the leading open source integration software provider to most data-driven
    enterprises. Talend allows customers from any place to connect easily.


    ## Data Visualization


    ### 11. Datawrapper

    It is an online data-visualization software that one can use to build interactive
    charts. A user will upload data from `CSV`, `Excel` or `PDF` files into the field.
    This tool processes the data and generates a map, bar, and line. Graphs produced
    by Datawrapper can be installed into any website that is built with ready to use
    embed codes.


    ### 12. Tableau Public

    This tool will democratize visualization in a very elegant and simple way. It
    is a very powerful tool to use in any type of business. One can identify data
    insights with the help of Tableau data visualization tools. When it comes to analytics,
    visualization in Tableau allows a Data Scientist to explore data before moving
    into a complex statistical process.


    ### 13. Infogram

    It has over 35 interactive charts and over 500 maps to allow an individual to
    visualize data in the most beautiful way. It creates different charts such as
    word cloud, pie, and bar. Infogram also supports a map module that can capture
    the attention of the audience.


    ### 14. Google Fusion Tables

    This is one of the most interesting and powerful data analysis tools. It is the
    best to use when you have a large data set that you want to visualize and map.
    With its powerful mapping software, Google plays an important role in creating
    this tool.


    ### 15. Solver

    This is built with the ability to support effective financial reporting, budgeting
    and analysis. It has a push-button that will let anyone to access and interact
    with data that generates more profit in a company.


    ## Sentiment Tools


    ### 16. OpenText

    This is a specialized classification engine applied in the identification and
    evaluation of expressions and patterns in a textual content. The analysis takes
    place at the document, sentence, and topic level.


    ### 17. Trackur

    An automated sentiment analysis software which highlights a particular keyword
    tracked by an individual. Trackur has an algorithm which monitors all social media
    and mainstream news to draw important insights through the discovery of trends.


    ### 18. Opinion Crawl

    Another online sentiment analysis software applied in the analysis of the latest
    news, products, and companies. It gives freedom to every visitor to access Web
    sentiment in a specific topic. Anyone can type, participate in a topic, and receive
    ad-hoc sentiment assessment. For each topic, there is a pie chart to display the
    latest real-time sentiment and a list of current news headlines. Besides that,
    there are different thumbnail images and a cloud tag to include different concepts
    that the public can easily relate with. This tool allows a person to see events
    which affect the sentiment positively or negatively. To create a comprehensive
    analysis, Web crawlers search for the latest content published on common subjects
    and current public issues.


    ## Data Extraction Tools


    ### 19. Content Grabber

    This is a tool designed for enterprises. The tool is built with the function to
    support content mining from any website and save that in a structured format.
    This consists of `CSV`, `XML`, and `Excel` reports. It is the best tool for an
    expert at programming because it has scripting and editing module. Also, users
    can still use `C#`, `VB.NET` to debug and write script information to take of
    the crawling process.


    ### 20. IBM Cognos Analytics

    Before this tool was developed, Cognos Business Intelligence was the one used.
    It is designed with a Web-based interface to support data visualization in the
    BI product. It has modules for data governance, self-service analytics, and management.
    This tool also supports the integration of data from different source to create
    reports and visualizations.


    ### 21. Sage Live

