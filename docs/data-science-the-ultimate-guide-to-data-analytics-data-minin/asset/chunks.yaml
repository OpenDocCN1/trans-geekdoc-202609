    mistakes and generate an alert. This basic technique can be deployed to work for
    security applications. The applications help determine intrusion on a company
    network as well as discover users who go against corporate policies and task management.


    With the presence of Machine Learning, both algorithms and models can now be improved
    to reflect changes in staff behavior, and changes in technology to help reduce
