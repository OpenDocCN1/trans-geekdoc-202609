    \ eliminated. Bloom filtering is a wonderful technique that one can use to filter\
    \ streams to allow elements in a given set to pass through while foreign elements\
    \ are deleted.\n\nMembers in the selected set are hashed into buckets to form\
    \ bits. The bits are then set to 1. If you would like to test an element of a\
