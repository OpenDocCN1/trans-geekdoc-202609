    used with these goals in mind:


    * To help detect mistakes in the data

    * To check any assumptions presented with the data

    * To help with a preliminary selection of appropriate models

    * To assess the relationships and the direction of the different variables.


    Make sure that you are not mistaking the `EDA` with the initial data analysis,
    which will focus on checking assumptions that are necessary for model fitting
    and hypothesis testing. It can even handle missing values and adjust the variables
    – if you need to ensure you get the right information from the data.


    ## Types of EDA


    There are a few different types of `EDA` that you can work on. The one that you
    will want to choose will depend on the information that you want to use and what
    you want to do with the data that you have. Some of the types of `EDA` include:


    ### Univariate non-graphical EDA


    This is the first step to analyzing the data. With this type, there will be just
    one variable or characteristic that is being observed, and that is used to help
    represent the sample. Usually, the objective of univariate non-graphical EDA is
    to create a better appreciation of the sample distribution and to help carefully
    conclude the compatible population distribution and sample distribution. Since
    this is a non-graphical method, the data used for it will be objective and qualitative.


    ### Univariate graphical EDA


    This focuses on a single variable of a sample distribution. However, when working
    with univariate graphical EDA, it will deal more with quantitative data than qualitative
    data. Some of the techniques include quantile-normal plots, boxplots, stem and
    leaf plots, and histograms.


    ### Multivariate non-graphical EDA


    This illustrates the relationship between at least two variables through cross-tabulation
    or statistics, like covariance and correlation.


    ### Multivariate graphical EDA


    This shows some of the relationships between variables; however, like the univariate
    graphical EDA, the data used is more quantitative. The technique that is used
    commonly for this is a grouped bar plat.

