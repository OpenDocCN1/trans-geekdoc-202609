- raw: " Data Science is further applied in predictive analytics. This includes places\
    \ such as weather forecasting, radars, and satellites. Models have been created\
    \ that will not only forecast weather but also predict natural calamities. This\
    \ helps an individual to take the right measures beforehand and save many lives.\
    \ The infographic presented below shows domains where Data Science is causing\
    \ a big impact. \n\n![](images/00003.gif) \n\nSo, What is Data Science?\n\nThe\
    \ term Data Science is common nowadays, but what does it mean? What skills does\
    \ a person need to have to be called a Data Scientist? How are predictions and\
    \ decisions made in Data Science? Is there a difference between Data Science and\
    \ Business Intelligence? These are some of the questions that you are going to\
    \ find answers to in a short while.\n\nFirst, let’s define Data Science. \n\n\
    Data Science refers to a combination of several tools, Machine Learning principles,\
    \ and algorithms whose purpose is to discover hidden patterns from raw data. One\
    \ might wonder how different it is from Statistics. The figure below has all the\
    \ answers. \n\n![](images/00004.jpeg)\n\nThe figure above shows that a Data Analyst\
    \ explains whatever is happening by processing history of the data. On the other\
    \ hand, a Data Scientist will not only explain to extract insights from it, but\
    \ they will also use different advanced Machine Learning algorithms to highlight\
    \ the occurrence of a specific event in the future. A Data Scientist looks at\
    \ the data from different perspectives and angles.\n\nTherefore, Data Science\
    \ helps an individual predict and make decisions by taking advantage of prescriptive\
    \ analytics, machine learning, and predictive causal analytics. \n\n• Prescriptive\
    \ Analytics. If you need a model that has the intelligence and capability to make\
    \ its own decisions, then prescriptive analytics is the best to use. \n\nThis\
    \ new field delivers advice; it doesn’t just predict, but it also recommends different\
    \ prescribed actions and related outcomes. The best example to illustrate this\
    \ is the Google self-driving car. Data that is collected by the vehicle is used\
    \ to train the cars. You can further mine this data by using algorithms to reveal\
    \ intelligence. This will allow your car to make decisions such as when to turn,\
    \ which path to take, as well as when to speed up or slow down.\n\n• Machine Learning\
    \ for Pattern Discovery. Let’s say that you don’t have resources that you can\
    \ apply to make predictions; it will require you to determine the hidden patterns\
    \ in the data set to predict correctly. The most popular algorithm applied in\
    \ pattern discovery is Clustering. Assume that you work in a telephone company,\
    \ and you want to determine a network by installing towers in the region. Therefore,\
    \ you may use the clustering technique to determine the tower location that will\
    \ make sure all users have the maximum signal strength. \n\n• Make Predictions\
    \ with Machine Learning. If you want to build a model that can predict the future\
    \ trend of a company, then Machine Learning algorithms are the best to go with.\
    \ This falls under supervised learning; it is called supervised because data is\
    \ already present that you can use to train machines.\n\n• Predictive Causal Analytics.\
    \ If you need a model that can help predict chances of a given event happening\
    \ in future, you need to use the predictive causal analytics. \n\nData Science\
    \ and Discovery of Data Insight\n\nThe main aspect of Data Science is to discover\
    \ findings from data. It involves unearthing hidden insight that can allow companies\
    \ to make smart business decisions. For example:\n\n• Highlighting key customer\
    \ segments inside its base as well as special shopping behaviors in the segments.\
    \ This directs messages to different market audiences.\n\n• Netflix extracts data\
    \ from movie viewing patterns to find out what drives user interest and uses it\
    \ to make decisions. \n\n• Proctor and Gamble make use of time series models to\
    \ understand future demand. This allows a person to plan for production levels.\n\
    \nBut how do Data Scientists extract data insights? If you ever asked yourself\
    \ this question, the answer is: it begins with data exploration. When faced with\
    \ a difficult question, Data Scientists become curious. They attempt to find leads\
    \ and understand characteristics within the data. To achieve this, an individual\
    \ must have a higher level of creativity. \n\nIn addition, they may choose to\
    \ use quantitative techniques to move deeper. Some examples are time series forecasting,\
    \ inferential models segmentation analysis, synthetic control experiments, and\
    \ many more. The aim is to put together a forensic view of what the data means.\
    \ Hence, data-driven insight is the key in delivering strategic guidance. In other\
    \ words, the role of Data Scientists is to guide business stakeholders so that\
    \ they can learn how to respond to findings.\n\nDevelopment of a Data Product\n\
    \nA data product refers to a technical asset which makes use of data as input\
    \ and processes the data to display the results of an algorithm. A classic example\
    \ of a data product is a recommendation engine which takes user data and builds\
    \ a personalized recommendation depending on the data. Below are examples of data\
    \ products:\n\n• A computer vision applied in self-driving cars\n\n• Gmail’s spam\
    \ filter \n\n• Amazon recommendation engine\n\nThis is not similar to “data insights”\
    \ discussed previously where the final result is to generate advice to an executive\
    \ team to help them make better business decisions. Conversely, a data product\
    \ has a technical functionality that includes an algorithm and is developed to\
    \ be encapsulated directly into the major applications. Some of the popular examples\
    \ of applications that have a data product working behind the scenes are:\n\n\
    • Amazon’s home page\n\n• Gmail’s inbox\n\n• Autonomous driving software\n\nData\
    \ Scientists play a major role in creating a product. This includes coming up\
    \ with algorithms, testing, technical deployment, and refinement. In this case,\
    \ Data Scientists act as technical developers who build assets which can be leveraged\
    \ at a wide view.\n\nRequisite Skillset for a Data Scientist\n\nMathematics Ability\n\
    \nAt the center of mining data insight and developing a data product is the potential\
    \ to see data through a quantitative lens. There are correlations, textures, and\
    \ dimensions in data that one can represent mathematically. Developing solutions\
    \ that make use of data involves heuristics and quantitative techniques. \n\n\
    Answers to most business problems include building analytic models that are grounded\
    \ in the complex math where it is important to understand the principle behind\
    \ the models.\n\nAnother misconception spread by people is that Data Science is\
    \ mainly Statistics. Even though Statistics is critical in Data Science, it is\
    \ not the only type of math learned. There are two categories of Statistics namely\
    \ Bayesian Statistics and Classical Statistics. Most people tend to refer to Classical\
    \ Statistics when they speak about stats. However, one is required to have knowledge\
    \ of both types of Statistics. For instance, a common method to determine hidden\
    \ characteristics in a data set is the SVD. This method is rooted in matrix math\
    \ and has little to do with the classical stats. In general, it is good for Data\
    \ Scientists to have both breadth and depth of mathematics knowledge.\n\nStrong\
    \ Business Acumen\n\nIt is good for a Data Scientist to have the traits of a tactical\
    \ business consultant. By working alone with data, they have the edge to discover\
    \ new concepts from data in ways that no one can. As a result, they have the task\
    \ to translate observations that they see into a shared knowledge and recommend\
    \ strategies in which they can solve major business problems. Therefore, a Data\
    \ Scientist should be able to use data to create a story. The story has to be\
    \ a cohesive narrative of the problem and solution. \n\nTechnology and Hacking"
