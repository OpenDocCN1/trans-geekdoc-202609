    ## Software Architecture and Quality Attributes


    Software architects design a software system that is cloud-based. This system
    may represent a product, service or a task dependent on the computing system.


    One of the tasks involved in building software architecture includes selecting
    the right language to program. This may call for much consideration, especially
    centered on the purpose of the system. This part of software architecture requires
    a person who is experienced and skilled.


    Cloud computing enhances an agile culture. It is a mature market, and several
    large companies have started to build effective and elastic cloud environments.
    Some of these environments have been deployed on pools of server, networking resources,
    and storage. They are more cost-effective, and this seems to increase the ROI
    of advanced analytics.


    Generally, applications built to support and use cloud embrace and allow fast-moving
    as well as enhance creativity from teams. Additionally, teams are taking advantage
    of the big space in the cloud to store more data and discover a lot of use cases
    for data. With cloud computing, it is possible to release a feature now and have
    it tested immediately to reveal whether it adds value.


    ## Sharing Big Data in the Cloud


    In the enterprise world, the role of Big Data cannot be ignored. Also, the cloud
    makes it easy to track and analyze insights. Once it is integrated, Big Data delivers
    value to all types of organizations.


    Traditionally, it was risky to let business process wired data into silos. Teams
    had a big problem when they wanted to share insights. Collaboration used to be
    a big problem, not forgetting to mention the difficulty in transferring large
    amounts of data. Cloud computing has reduced most of these problems and made it
    easy for teams to work together across different distances.


    It is very difficult to ignore the benefits of cloud computing in the Big Data
    field. In fact, most companies across the world rely on the cloud. Take Uber and
    Airbnb for example. These companies adopt cloud computing as a means to improve
    information sharing and data.


    ## Getting Big Data Insights Fast Using Cloud


    There was a time when Big Data was considered expensive and overwhelming. During
    this period, efforts in Big Data needed to be reactionary and generate insights.


    Cloud computing removed the need of a data warehouse. This means that you don’t
    need to worry about analyzing, compiling, and collecting data because you will
    have the best tools to use in Big Data.


    Take the example of gathering customer analytics in Data Science. If you choose
    to use cloud and Big Data technology, it will make the whole process easy and
    allow you to collect information from various sources in sales, marketing, and
    web analytics.


    Even without the need of massive servers, companies can get data and quickly analyze
    it before making use of it. They can do this by using `Hadoop` and other applications
    discussed in the other chapters. Whether large or small, companies can take advantage
    of Big Data by adopting cloud-based servers, software, and technologies. This
    will help reduce the cost of IT and increase flexibility and scalability.


    ## Cloud and Big Data Governance


    Cloud is a great thing, right? However, most companies are scared about how to
    regulate governance, privacy, and control. Big Data comes with its challenges,
    and implementation of cloud data brings with it issues on privacy and security.


    This is the reason why it is critical to develop a solid governance plan in your
    cloud solutions. Make sure that it is an open architecture and forward compatible.
    This will ensure that your cloud solution remains robust and governable.


    ## Why Do Data Scientists Need Cloud Tools to Deliver the Value of Data for Businesses?


    Data Scientists help organizations to begin using data for transformative purposes.
    Data Scientists continue to be in great demand today because of the massive data
    that organizations have and need to deal with. There is about 80% of unstructured
    data that organizations receive in the form of social media, emails, videos, and
    images.


    With the growth in cloud computing, Data Scientists need to deal with new workloads
    from `IoT`, `AI`, and analytics. Accessing data in the cloud is important to any
    Data Scientist, and they require a centralized platform across all teams. As digital
    growth continues to power many companies and industries, there is an increasing
    need to record and manage new and legacy data.


    ## Artificial Neural Networks


    Machine Learning is a branch of computer science which powers the rapid development
    of Artificial Intelligence. Machine Learning will study an algorithm and let machines
    recognize patterns, develop models, and generate videos and images via learning.
    Machine Learning algorithms can be created using different methods such as clustering,
    decision trees, linear regression, and many more.


    ### What is an Artificial Neural Network?


    Artificial Neural Network is propelled by biological models of brain and biological
    neural networks. In brief, `Artificial Neural Network (ANN)` refers to a computational
    representation of the human neural network which alters human intelligence, memory,
    and reasoning.


    The major principle behind `ANN` is that neural networks are effective in advanced
    computations and hierarchical representation of knowledge. Dendrites and axons
    connect neurons into complex neural networks that can pass and exchange information
    as well as store intermediary computation results.


    The perception algorithm created in 1957 was the trial to build a computational
    model of a biological neural network. However, advanced neural networks that have
    multiple layers, neurons, and nodes became possible just recently.

