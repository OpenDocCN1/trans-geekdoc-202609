    \ make its own decisions, then prescriptive analytics is the best to use. This\
    \ new field delivers advice; it doesn’t just predict, but it also recommends different\
    \ prescribed actions and related outcomes. The best example to illustrate this\
    \ is the Google self-driving car. Data that is collected by the vehicle is used\
    \ to train the cars. You can further mine this data by using algorithms to reveal\
    \ intelligence. This will allow your car to make decisions such as when to turn,\
    \ which path to take, as well as when to speed up or slow down.\n* **Machine Learning\
    \ for Pattern Discovery**. Let’s say that you don’t have resources that you can\
    \ apply to make predictions; it will require you to determine the hidden patterns\
    \ in the data set to predict correctly. The most popular algorithm applied in\
    \ pattern discovery is `Clustering`. Assume that you work in a telephone company,\
    \ and you want to determine a network by installing towers in the region. Therefore,\
    \ you may use the clustering technique to determine the tower location that will\
    \ make sure all users have the maximum signal strength.\n* **Make Predictions\
    \ with Machine Learning**. If you want to build a model that can predict the future\
    \ trend of a company, then Machine Learning algorithms are the best to go with.\
    \ This falls under supervised learning; it is called supervised because data is\
    \ already present that you can use to train machines.\n* **Predictive Causal Analytics**.\
    \ If you need a model that can help predict chances of a given event happening\
    \ in future, you need to use the predictive causal analytics.\n\n# Data Science\
    \ and Discovery of Data Insight\n\nThe main aspect of Data Science is to discover\
    \ findings from data. It involves unearthing hidden insight that can allow companies\
    \ to make smart business decisions. For example:\n\n* Highlighting key customer\
    \ segments inside its base as well as special shopping behaviors in the segments.\
    \ This directs messages to different market audiences.\n* Netflix extracts data\
    \ from movie viewing patterns to find out what drives user interest and uses it\
    \ to make decisions.\n* Proctor and Gamble make use of time series models to understand\
    \ future demand. This allows a person to plan for production levels.\n\nBut how\
    \ do Data Scientists extract data insights? If you ever asked yourself this question,\
    \ the answer is: it begins with data exploration. When faced with a difficult\
    \ question, Data Scientists become curious. They attempt to find leads and understand\
    \ characteristics within the data. To achieve this, an individual must have a\
    \ higher level of creativity.\n\nIn addition, they may choose to use quantitative\
    \ techniques to move deeper. Some examples are time series forecasting, inferential\
    \ models segmentation analysis, synthetic control experiments, and many more.\
    \ The aim is to put together a forensic view of what the data means. Hence, data-driven\
    \ insight is the key in delivering strategic guidance. In other words, the role\
    \ of Data Scientists is to guide business stakeholders so that they can learn\
    \ how to respond to findings.\n\n# Development of a Data Product\n\nA data product\
    \ refers to a technical asset which makes use of data as input and processes the\
    \ data to display the results of an algorithm. A classic example of a data product\
    \ is a recommendation engine which takes user data and builds a personalized recommendation\
    \ depending on the data. Below are examples of data products:\n\n* A computer\
    \ vision applied in self-driving cars\n* Gmail’s spam filter\n* Amazon recommendation\
    \ engine\n\nThis is not similar to “data insights” discussed previously where\
    \ the final result is to generate advice to an executive team to help them make\
    \ better business decisions. Conversely, a data product has a technical functionality\
    \ that includes an algorithm and is developed to be encapsulated directly into\
    \ the major applications. Some of the popular examples of applications that have\
    \ a data product working behind the scenes are:\n\n* Amazon’s home page\n* Gmail’s\
    \ inbox\n* Autonomous driving software\n\nData Scientists play a major role in\
    \ creating a product. This includes coming up with algorithms, testing, technical\
    \ deployment, and refinement. In this case, Data Scientists act as technical developers\
    \ who build assets which can be leveraged at a wide view.\n\n# Requisite Skillset\
    \ for a Data Scientist\n\n## Mathematics Ability\n\nAt the center of mining data\
    \ insight and developing a data product is the potential to see data through a\
    \ quantitative lens. There are correlations, textures, and dimensions in data\
    \ that one can represent mathematically. Developing solutions that make use of\
    \ data involves heuristics and quantitative techniques.\n\nAnswers to most business\
    \ problems include building analytic models that are grounded in the complex math\
    \ where it is important to understand the principle behind the models.\n\nAnother\
    \ misconception spread by people is that Data Science is mainly Statistics. Even\
    \ though Statistics is critical in Data Science, it is not the only type of math\
    \ learned. There are two categories of Statistics namely Bayesian Statistics and\
    \ Classical Statistics. Most people tend to refer to Classical Statistics when\
    \ they speak about stats. However, one is required to have knowledge of both types\
    \ of Statistics. For instance, a common method to determine hidden characteristics\
    \ in a data set is `SVD`. This method is rooted in matrix math and has little\
    \ to do with the classical stats. In general, it is good for Data Scientists to\
    \ have both breadth and depth of mathematics knowledge.\n\n## Strong Business\
    \ Acumen\n\nIt is good for a Data Scientist to have the traits of a tactical business\
    \ consultant. By working alone with data, they have the edge to discover new concepts\
    \ from data in ways that no one can. As a result, they have the task to translate\
    \ observations that they see into a shared knowledge and recommend strategies\
    \ in which they can solve major business problems. Therefore, a Data Scientist\
    \ should be able to use data to create a story. The story has to be a cohesive\
    \ narrative of the problem and solution.\n\n## Technology and Hacking\n"
  trans: '

    数据科学被进一步应用于预测性分析。这包括气象预报、雷达和卫星等领域。人们已经创建了许多模型，不仅可以预测天气，还能预测自然灾害。这有助于个人预先采取正确的措施并拯救许多生命。下方提供的信息图展示了数据科学产生巨大影响的领域。


    ![](img/00003.gif)


    # 那么，什么是数据科学？


    “数据科学”一词在如今非常常见，但它意味着什么呢？一个人要被称为数据科学家需要具备哪些技能？在数据科学中，是如何做出预测和决策的？数据科学与商业智能（Business
    Intelligence）之间是否存在区别？这些都是你将在不久后能找到答案的问题。


    ## 首先，让我们定义数据科学


    数据科学是指多种工具、机器学习原理和算法的结合，其目的是从原始数据中发现隐藏的模式。人们可能会好奇它与统计学有有多不同。下面的图表包含了所有的答案。


    ![](img/00004.jpeg)


    上图显示，数据分析师通过处理历史历史数据来解释正在发生的一切。相反，数据科学家不仅会解释并从中提取洞察，还会使用不同的高级机器学习算法来突出未来特定事件的发生。数据科学家从不同的视角和角度来看待数据。


    因此，数据科学帮助个人通过利用规范性分析、机器学习和预测性因果分析来预测预测并做出决策。


    * **规范性分析（Prescriptive Analytics）**。如果你需要一个具有智能和能力做出自己决策的模型，那么规范性分析是最佳选择。这个新领域提供建议；它不仅仅是预测，还会建议不同的规范性行动和相关结果。说明这一点的最佳例子是谷歌自动驾驶汽车。车辆收集的数据被用于训练汽车。你可以通过使用算法对这些数据进行进一步挖掘以揭智能。这将允许你的汽车做出决策，例如何时转向、走哪条路径，以及何时加速或减速。

    * **模式发现的机器学习（Machine Learning for Pattern Discovery）**。假设你没有资源可以用于预测；这需要你确定数据集中的隐藏模式以进行准确预测。应用于模式发现中最流行的算法是`Clustering`（聚类）。假设你在一家电话公司工作，想要通过在该地区安装铁塔来确定网络。因此，你可以使用聚类技术来确定铁塔的位置，以确保所有用户拥有最大的信号强度。

    * **使用机器学习进行预测（Make Predictions with Machine Learning）**。如果你想构建一个可以预测公司未来趋势的模型，那么机器学习算法是最佳选择。这属于监督学习；之所以被称为监督学习，是因为已经存在了你可以用于训练机器的标记数据。

    * **预测性因果分析（Predictive Causal Analytics）**。如果你需要一个可以帮助预测未来某个给定事件发生概率的模型，你需要使用预测性因果分析。


    # 数据科学与数据洞察的发现


    数据科学的主要方面是从数据中发现发现。它涉及挖掘隐藏的洞察，使公司能够做出明智的商业决策。例如：


    * 突出其客户群内部的关键细分群体以及这些细分中的特殊购物行为。这引导信息面向不同的市场受众。

    * Netflix 从电影观看模式中提取数据，以发现是什么驱动了用户的兴趣，并据此做出决策。

    * 宝洁（Procter and Gamble）利用时间序列模型理解未来需求。这允许人员规划生产水平。


    但数据科学家是如何提取数据洞察的呢？如果你曾问过自己，答案是：它始于数据探索。当面对困难的问题时，数据科学家会变得好奇。他们试图寻找线索并理解数据中的特征。为了实现这一点，个人必须具备更高水平的创造力。


    此外，他们可能选择使用定量技术来深入研究。一些例子包括时间序列预测、推断模型、分群分析、合成控制实验等。目标是对数据汇总一个取证观点。因此，数据驱动的洞察是提供战略指导的关键。换句话说，数据科学家的角色是引导利益相关者，让他们学会如何应对发现。


    # 数据产品开发（Development of Data Product）


    数据产品指的是利用数据作为输入并处理数据以显示结果的技术资产。数据产品的一个经典例子是推荐引擎，它根据数据构建个性化推荐。以下是数据产品的例子：


    * 应用于自动驾驶汽车的计算机视觉

    * Gmail 的垃圾邮件过滤器

    * 亚马逊推荐引擎


    这与之前讨论的“数据洞察”不同，后者是为了向执行团队提供建议以帮助他们做出更好的决策。相反，数据产品具有技术功能，包含算法并直接封装到应用程序中。在后台运行的一些热门应用示例包括：


    * 亚马逊首页

    * Gmail 收件箱

    * 自动驾驶软件


    数据科学家在创建产品中发挥着重要作用。这包括构思算法、测试、技术部署和优化。在这种情况下，数据科学家充当构建可广泛利用资产的技术人员。


    # 数据科学家的必备技能组合


    ## 数学能力


    挖掘数据洞察和开发数据产品的核心是通过定量视角观察数据的潜力。数据中存在相关性、纹理和维度，可以用数学表示。开发利用数据的解决方案涉及启发式和定量技术。


    大多数业务问题的答案包括建立在复杂数学基础上的分析模型，理解模型后的原理非常重要。


    另一个误区是数据科学主要是统计学。尽管统计学在数据科学中至关重要，但它不是唯一的数学类型。统计学分为两类：贝叶斯统计和频率统计。大多数人在谈论统计时倾向于指频率统计。然而，需要具备这两种统计学的知识。例如，确定数据集中隐藏特征的常用方法是`SVD`。这种方法根于矩阵数学，与频率统计关系不大。通常，数据科学家具备数学知识的广深度都是的。


    ## 敏锐的商业头脑（Strong Business Acumen）

    '
