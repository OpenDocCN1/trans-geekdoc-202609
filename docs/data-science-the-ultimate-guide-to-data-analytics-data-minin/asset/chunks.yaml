    As with any other Data Science project, professionals in security can only advance
    when they have the correct data. However, with the decreasing cost of storing
    data and the ease of collecting data, businesses can find themselves collecting
    a lot of information and holding to it as long as they want.


    When it comes to security, a lot of data makes it hard to validate use in cases
