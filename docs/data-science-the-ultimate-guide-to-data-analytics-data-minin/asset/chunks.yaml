    ANN is the reason for recent success in computer vision and image recognition.
    Natural Language Processing and other applications seek to extract complex patterns
    from data. Neural networks are very useful when one wants to study nonlinear hypothesis
    that has many features. Building a precise hypothesis for massive space may need
    one to have multiple order that would inevitably result in overfitting. This is
    a situation where model reveals random noise instead of underlying patterns. Here,
    each pixel represents a feature.


    ### A Simple Neural Network That Has Single Neuron


    The simplest neural network has a single `neuron` as shown below.


    ![](images/00011)


    By applying biological analogy, this neuron represents computational unit that
    assumes inputs and transfers them using axons to the next network. In the above
    simple network, dendrites refer to input features (`x1`, `x2`) and the output
    is the result of `hw(x)`. Apart from the input features, the input layer of the
    neural network contains a bias unit that is equivalent to `1`. A bias unit is
    required to apply constant in function.


    In machine learning, the above network contains a single input layer, a hidden
    layer, and one output layer. To implement the learning process for this network,
    the input layer accepts input features for every training sample and feeds it
    to the activation function which computes the hypothesis in the hidden layer.


    An activation function is applied in classification. However, other options are
    also possible. In the above case, a single neuron is similar to input-output mapping
    defined by logistic regression.


    ![](images/00012)


    ### Multi-layered Neural Network


    To understand how neural network operates, it is important to formalize the model
    and explain it in a real-world scenario. The image below represents a multilayer
    network that has three layers and various neurons. In this case, just like single-neuron
    network, there is one input layer that has three inputs (`x1`, `x2`, `x3`) that
    has an added bias unit (`+1`). The second network layer is a hidden layer that
    has units represented by activation functions. This is called a hidden layer because
    the values that are computed in it aren’t observed. Basically, a neural network
    contains multiple hidden layers that pass advanced computations and functions
    from surface layers to the bottom of the neural network. The design of a neural
    network that has a lot of hidden layers is constantly used in Deep Learning.


    ![](images/00013)


    The hidden layer 2 has three neurons (`a12`, `a22`, `a32`). Each neuron of a hidden
    layer activates layer `j`. In this case, unit `a1` activates the first neuron
    of the second layer. Activation means that the value that is computed by function
    activation in this layer is output by the same node to the next layer.


    Layer 3 is the output layer that receives results from the hidden layer and applies
    its own activation function. This layer calculates the final value of the hypothesis.
    Next, the cycle continues until that point when the neural network comes up with
    the model and weights which best predict the values of training data.


    # Chapter 13: Data Science Modeling and Featurization


    Data modeling is an important aspect of Data Science. It is one of the most rewarding
    processes that receive the most attention among learners of Data Science. However,
    things aren’t the same as they might look because there is so much to it rather
    than applying a function to a given class of package.


    The biggest part of Data Science is assessing a model to make sure that it is
    strong and reliable. In addition, Data Science modeling is highly associated with
    building information feature set. It involves different processes which make sure
    that the data at hand is harnessed in the best way.


    ### Robust Data Model


    Robust data models are important in creating the production. First, they must
    have better performance depending on different metrics. Usually, a single metric
    can mislead the way a model performs because there are many aspects in classification
    problems.


    Sensitivity analysis describes another important aspect of Data Science modeling.
    This is something that is important for testing a model to make sure that it is
    strong. Sensitivity refers to a condition which the output of a model is meant
    to change considerably if the input changes slightly. This is very undesirable
    because it must be checked since the robust model is stable.


    Lastly, interpretability is an essential aspect even though it is not always possible.
    This is usually related to how easy one can interpret the results of a model.
    But most modern models resemble black boxes. This makes it hard for one to interpret
    them. Besides that, it is better to go for an interpretable model because you
    might need to defend the output from others.


    ### How Featurization Is Achieved


    For a model to work best, it must require information that has a rich set of features.
    The latter is developed in different ways. Whichever the case, cleaning the data
    is a must.


    Before the variables are used in a model, you must perform normalization on them.
    This is achieved using a linear transformation on making sure that the variable
    rotate around a given range. Usually, normalization is enough for one to turn
    variables into features.


    Binning is another process which facilitates featurization. It involves building
    nominal variables which can be broken down into binary features.


    Lastly, some reduction methods are important in building a feature set. This involves
    building a linear combination of features that display the same information in
    fewer dimensions.

