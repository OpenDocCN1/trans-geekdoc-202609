- raw: "Ridge Regression. This is similar to the least squares with the only difference\
    \ being the estimate of the coefficients. Ridge regressions select coefficient\
    \ estimates that reduce RSS. But it has a penalty when the coefficients approach\
    \ zero. This penalty can reduce the estimate of the coefficient to zero. That\
    \ is why it is important to know that ridge regression removes traits with the\
    \ smallest column space variance. The problem with ridge regression is that it\
    \ has all p predictors available in the final model. In addition, the penalty\
    \ term sets the rest of the predictors to zero. Usually, this is not a problem\
    \ when you want to predict accurately, but it can make the model difficult to\
    \ interpret the results. Lasso has the answer to this problem because it can force\
    \ specific coefficients to move to zero as long as it is small. \n\n5.   Dimension\
    \ Reduction\n\nThis reduces the issue of approximating p + 1 coefficient to a\
    \ simple problem of M + 1 coefficient. In this case, M< p. You can achieve this\
    \ by computing M different linear combinations and variable projections. In this\
    \ case, M projections are extracted and used as predictors for a linear regression\
    \ model. The most popular approaches that one can apply include partial least\
    \ squares and component regression. \n\nPrincipal Components Regression\n\nThis\
    \ technique helps an individual extract a low-dimensional set of properties from\
    \ a large group of variables. The first principal component (PC) direction of\
    \ data has observations that change a lot. This means that the first PC represents\
    \ a line that fits close to the data. It is possible for one to fit p distinct\
    \ principal components. The next PC refers to a linear combination of variables\
    \ that are different from the first PC and contain the largest variance subject\
    \ of the constraint. The point is that the principal components retain the most\
    \ variance in the data by applying a linear combination of the data in subsequent\
    \ orthogonal directions. Therefore, it is correct to combine the effects of associated\
    \ variables to find more information from the available data.\n\nThis method involves\
    \ highlighting linear combinations of X which represent the best X predictors.\
    \ This means that the combinations are unsupervised because the response Y is\
    \ important in determining the principal component directions.\n\n In other words,\
    \ Y response cannot supervise the selection of the principal components. Hence,\
    \ it is not a guarantee that the directions which define the predictors can be\
    \ used to predict a response. \n\nA Partial Least Square is an alternative to\
    \ supervised. It is a mechanism which selects a new smaller set of features that\
    \ contain a linear combination of previous features. Unlike PCR, Partial Least\
    \ square uses the response variable to highlight the new features.\n\n6.   Nonlinear\
    \ Models\n\nIn a nonlinear regression analysis, observational data is modeled\
    \ using a nonlinear combination function of the model parameters. Additionally,\
    \ it relies on more than one independent variable. In this method, data is applied\
    \ by using successive approximations. Below are a few techniques that you can\
    \ use to handle nonlinear models:\n\n*    A Piecewise Function. This function\
    \ is defined with the help of multiple sub-functions which apply a specific interval\
    \ of the main function’s domain. Piecewise is a way in which one can express the\
    \ function instead of the characteristic function itself.\n\n*    A Spline. This\
    \ refers to a special function defining piecewise using a polynomial. In computer\
    \ graphics, spline represents a piecewise polynomial parametric curve. Spline\
    \ refers to popular curves as a result of simplicity in the construction. \n\n\
    7.   The Tree-Based Methods \n\nYou can use this method in regression and issues\
    \ related to classification. Some of these issues include segmenting the predictor\
    \ space to build simple regions. Since a set of splitting rules is used in the\
    \ predictor space, you can decide to summarize that into a tree. This type of\
    \ approach is called a decision-tree method. Below are some of the most common\
    \ tree methods: \n\n*    Bagging. This refers to the way one can reduce the variance\
    \ of the prediction by producing extra training data from the initial data set.\
    \ This is realized through a mix of repetitions that produce a multistep of similar\
    \ carnality. If you can manage to increase the size of the training set, then\
    \ you will have decreased the variance. \n\n*    Boosting. This method computes\
    \ the output using different models and averages the result through a weighted\
    \ average technique. By integrating the merits and pitfalls of the following technique,\
    \ you can develop a good predictive force to be applied in a large size of input\
    \ data.\n\n*    Random Forest. This algorithm resembles bagging algorithm. In\
    \ this algorithm, an individual can develop random bootstrap samples of the training\
    \ set. Besides the bootstrap samples, you can also build a random subset of features\
    \ to use to train individual trees. In bagging, each tree is assigned a full set\
    \ of features because of the random feature selection. In addition, an individual\
    \ can make the trees more independent of each other rather than the regular bagging\
    \ that usually leads to better predictive performance. \n\n8.   Support Vector\
    \ Machines (SVM)\n\nThe Support Vector Machine is a classification technique categorized\
    \ below the supervised learning models in the Machine Learning. In a different\
    \ language, it is used to calculate the hyperplane in higher dimensions such as\
    \ 2D and 3D. A hyperplane is defined as an n-1 dimensional subspace of an n-dimensional\
    \ space which best differentiates two classes of points that have the maximum\
    \ margin. Basically, it is a constrained optimization problem in which the margin\
    \ is optimized. \n\nThe data points which support the hyperplane lie on either\
    \ side and are called support vectors. In situations where there is inseparable\
    \ data, the points have to be defined to a higher dimensional space where linear\
    \ separation might be possible. A problem that consists of multiple classes can\
    \ be divided into various one-versus-one binary classification problems.\n\n9.\
    \   The Unsupervised Learning\n\n In unsupervised learning, groups of data are\
    \ not known. This is left for the learning algorithm to determine the patterns\
    \ in the provided data. Clustering is a great example of unsupervised learning\
    \ where different data sets are grouped into groups that are closely related.\
    \ \n\n![](images/00005.jpeg)\n\nPrincipal Component Analysis. This is method will\
    \ help you generate the least dimensional representation of the data set. The\
    \ data set is produced by defining a set of linear properties that have a maximum\
    \ variance and are mutually unrelated. This linear dimensionality approach could\
    \ be important to help a person understand latent interaction in the unsupervised\
    \ setting. \n\nHierarchical Clustering. This develops a multilevel hierarchy of\
    \ clusters by building a cluster tree. \n\nK-means Clustering. This will partition\
    \ data into K distinct cluster depending on the distance to the centroid of a\
    \ cluster. \n\nThis is a skeleton of basic statistical techniques that can assist\
    \ a Data Science program manager to develop a better understanding of what is\
    \ happening besides Data Science terms. The truth is that there are certain Data\
    \ Science terms which run algorithms via R and python libraries. Despite this,\
    \ if you can understand the basics of statistical analysis, it will provide your\
    \ team with a better approach. Develop insight related to the smallest parts to\
    \ support easy abstraction and manipulation.\n\n# Chapter 5: Data Visualization\n\
    \nWhen you want to understand, and discover important data insights, a picture\
    \ turns out to be an essential tool. Visuals are helpful when you want to discover\
    \ relationships between hundreds of variables. "
