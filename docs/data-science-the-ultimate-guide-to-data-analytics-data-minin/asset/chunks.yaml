    决策树是由算法生成的，这些算法通过不同的形式将数据划分为段。这些段组合成一棵倒置的决策树，以根节点作为树顶的起点。分析的目的在根节点中被确定。这在决策树界面中可以是一个简单的一维显示。数据分析的主要字段将与字段中发现的值分布并列显示。下面展示了一个简单的决策树。这种特定类型的树代表了连续和分类形式的客观分析。


    决策树受决策规则引导，它必须在根节点下方形成分支。这源于一种识别对象分析与目标字段之间关系的方法，以及许多其他作为输入以构建分支的字段。输入中包含的值被称为响应或因变量。


    一旦建立了这种关系，构建一个描述输入和目标之间存在关系的决策树就变得容易了。然后可以选择这些规则并使用它们来演示决策树，这种树提供了一种你可以视觉化描述和检查树状网络关系的方法。


    决策树具有预测新值或隐藏观测值的潜力，这些值对于特定输入具有值，但在特定目标上可能没有值。


    决策树规则根据数据中某一列的值，将数据集中的每个派生观测值分配到一个段。用于构建规则的列被称为输入。尽管如此，决策树中存在划分规则。这些规则一个接一个应用，以帮助构建嵌套分支，从而生成决策树的整体形状。分支的分层结构被称为决策树，树中的每个段被称为节点。如果一个节点拥有所有的子节点，它就形成了该节点的额外段或分支。决策树底部的节点被称为叶节点。


    对于每个叶节点，决策树都有特定的特殊路径让数据进入定义为该叶节点的类。决策树中的所有节点共享一种被称为互斥分配规则的规则。因此，来自父数据集的记录和观测值只能存在单个节点中。一旦定义了决策树，就可以使用这些规则根据未见过的数据生成其他节点值。在预测建模中，决策树将生成一个预测值。


    决策树的思想诞生于 50 多年前；最早的决策树由 Belson 在 1956 年用于电视广播的研究中。从那时起，开发了许多不同类型的决策树，旨在为数据挖掘和机器学习领域提供新功能。例如，决策树的一种形式涉及随机森林的发展。


    随机森林由多树委员会组成，这些委员会应用随机抽样的数据和输入。此外，它还有一种奖励技术来构建多棵树，这些树在整合时会生成关于决策树结构的强力预测。


    除了数据建模之外，你还可以决策树对业务分析和商业智能中存在的维度立方体数据进行探索和分类。


    ## 使用更多建模技术应用决策树


    决策树与回归等其他建模技术结合使用效果最好。这些技术在选择输入或生成哑变量以表示处理回归方程中的交互效应时非常重要。


    分层回归的要点在于识别并理解数据中的这种关系并不易于拟合到线性回归方程。


    决策树在数据科学中被使用的另一个原因是，它们将一组分类值压缩到与给定目标变量值对齐的特定范围内。这也被称为最优值压缩。将分类值合并在一起的常用方法是将类别合并为一个。由于决策树支持将有关某些目标值水平的具有相似值的类别进行组合，因此在合并类别时信息损失非常小。这导致了预测和分类结果的。


    ## 为什么决策树非常重要？


    决策树是多变量分析的一种。所有类型的多变量分析都允许我们解释、描述和分类目标。包含分析的多变量的一个例子是，由于多个输入变量、维度和因素的影响而导致的销售概率或对营销活动做出反应的机会。决策树的多变量分析允许个人在多种影响背景下探索其他关系并发现以及解释事物。


    事实上，多变量分析在当前的现代问题解决中是关重要的——因为决定成功的每个关键结果都取决于多个因素。此外，现在变得清楚，即使很容易建立一个单因模型，这种方法也可能导致昂贵且误导性的结果。


    根据心理学领域的不同研究，已经发现妥善掌握和操纵不同知识块的能力受到物理和认知限制的限制。这增加了能够反映和保留高维关系的维度呈现技术的利用。


    目前存在许多多变量技术。决策树的吸引人之处取决于其易用性、稳健性以及针对不同数据和测量水平的相对效力。决策树是以增量风格进行构建和呈现的。因此，多种影响的集合是一组在递归类型决策树中展示的单因、单效应关系。


    这意味着决策树以有效的方式处理了人类短期记忆问题，并且其方式比复杂的多变量技术更易理解。决策树将原始数据转换为对业务、科学和工程问题的详细知识和意识。这使得能够以一种简单但强大的人类可读形式部署知识。


    决策树试图在构建数据集的观测值集中发现输入值与目标值之间的强关系。如果一组输入值被选为与目标值具有特定关联，则所有目标值都被分类到一个形成决策树分支的箱中。


    这种特定的分组通过箱值与目标值之间观测到的关系被突显出来。例如，如果输入创建的三个箱的平均目标值差异很大，那么分箱将选择每个输入并确定输入值如何与目标相关。


    当关于输入值的知识增强了预测目标值的能力时，就会形成稳健的输入-目标关系。强关系将允许你理解目标的本质。因此，使用这种关系来预测目标值是可以的。


    # 结论


    在最后一章中，本书审查了顶尖数据科学家在执行数据科学任务时已知并应用的重要概念。机器学习定义为使用算法分析数据并从中学习的实践，是数据科学家帮助预测未来趋势的关键。


