    \ exist in a stream, you might have to count from the start of the stream. Flajolet-Martin\
    \ is a method which often hashes elements to integers, described as binary numbers.\
    \ By using a lot of the hash functions and integrating these estimates, you finally\
    \ get a reliable estimate.\n\n5.   Frequent Item – Set Analysis \n\nThe market-basket\
