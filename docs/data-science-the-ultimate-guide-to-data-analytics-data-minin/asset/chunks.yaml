    ANN（人工神经网络）是近期计算机视觉和图像识别领域取得成功的原因。自然语言处理和其他应用试图从数据中提取复杂的模式。当人们想要研究具有许多特征的非线性假设时，神经网络非常有用。为巨大的空间构建精确的假设可能需要人们具有多个阶数，这不可避免地会导致过拟合。在这种模型揭示了随机噪声而非底层模式的情况。在这里，每个像素都代表一个特征。


    ### 具有单个神经元的简单神经网络


    最简单的神经网络只有一个`neuron`（神经元），所示。


    ![](img/00011)


    通过应用生物学类比，这个神经元代表一个计算单元，它接收输入并通过轴突将其传输到网络的下一个。在上面的简单网络中，树突指的是输入特征（`x1`、`x2`），输出是
    `hw(x)` 的结果。除了输入特征外，神经网络的输入层还包含一个等同于 `1` 的偏置单元（bias unit）。需要偏置单元是为了在函数中应用常数。


    在机器学习中，上述网络包含一个输入层、一个隐藏层和一个输出层。为了实现该网络的学习过程，输入层接收每个训练样本的输入特征，并将其传递给激活函数，激活函数计算隐藏层中的假设。


