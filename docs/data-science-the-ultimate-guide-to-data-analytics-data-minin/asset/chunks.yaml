    ## 4. The Training Model on the Data


    The right Machine Learning task will identify the right algorithm. You can then
    feed the data into the model during this stage. A learner refers to a Machine
    Learning algorithm trained on some data and adjusted to suit the data in the best
    possible means.


    ## 5. Evaluate the Performance of a Model


    Since each learner generates a biased solution, it is good to determine the best
    way in which an algorithm learns from its experience. Based on the model applied,
    you could be able to determine the accuracy of the learner by using a test data
    set.


    ## 6. Enhance Model Performance


    In case a better performance is required, it is good to use an advanced mechanism
    to improve the performance of a model.


    Once these steps are over and the model seems to work well, it is deployed for
    its required task. The model can be used to generate scores for predictions, projected
    values for novel data, and important insight for research and marketing.


    It is essential to track the success and failures of a deployed model to help
    an individual produce additional data to train the next generation model.


    ## Select a Machine Learning Algorithm


    The type of Machine Learning algorithm you choose depends on the data present
    and the proposed task at hand. It is critical to think about this process during
    the collection of data, exploration, and data cleaning.


    ### Input Data


    All Machine Learning algorithms need to have some training data. Training data
    is available in the form of features and examples.


    An example includes a single exemplary instance of the underlying concept learned.
    It refers to a single set of data that describes the atomic unit of interest applied
    in the analysis. In case you are developing a learning algorithm to select spam
    email, the examples would include data from electronic messages. For one to identify
    cancer tumors, examples may need to comprise biopsies from different patients.


    A feature refers to a characteristic or example of an attribute. It can be important
    for learning the correct concept. In the previous example, attributes in the spam
    detection data set might include words applied in the email messages and domain
    names. In the cancer data set example, it could be genomic data from biopsied
    cells or even a measured characteristic of the patient such as age, weight, blood
    pressure, and height.


    Features are available in different forms. If a feature reveals a characteristic
    measured in numbers, it is referred to as numeric. For instance, weight and height
    are numeric. At the same time, if there is a feature which determines an attribute
    represented by a set of classifiers, the feature is referred to as nominal or
    categorical. If the following categories have a specific order, then the feature
    is referred to as ordinal. It is vital to pay attention to what these features
    represent because both the number and type of features in the data set assist
    in defining the correct Machine Learning algorithm.


    ### Machine Learning Algorithms


    They are two types: supervised learners and unsupervised learners. You already
    know one or two things about these two types of algorithm. In brief, supervised
    learners create a predictive model while unsupervised learners build a descriptive
    model. Which type a Data Scientist should select depends on the task at hand and
    what he or she needs to achieve.


    A predictive model is the best to use if you have tasks that alter the prediction
    of one value by applying another value in the data set.


    The learning algorithm will try to identify and model the association between
    the target feature and other features. Predictive models don’t require one to
    forecast future events.


    Since predictive models have a detailed instruction of what is required to learn
    based on positive and negative instances, this process is described as supervised
    learning. In this case, supervision does not describe human involvement, but the
    target values deliver a supervisory role that guides the learner in whatever they
    need to learn. Most importantly, when given a set of data, the algorithm will
    try to optimize a function to determine a combination of feature values that generate
    the target output.


    The target feature that should be predicted is a categorical feature referred
    to as a class and is made up of different categories called levels. A class can
    consist of multiple levels.


    Supervised learners can further help predict numeric values such as laboratory
    values, income, and test scores. To predict these numeric values, linear regression
    models are applied. Even though regression models are not the only model, they
    are the most commonly used models.


    A descriptive model is used to handle tasks that could generate insight gained
    from data summarization. Although it predicts a specific target of interest, it
    is different because no single feature is more important than another.


    Given that a descriptive model does not have a target to learn, the procedure
    of training a descriptive model is called unsupervised learning. These methods
    are good for one to use to mine data. Example of descriptive modeling is pattern
    discovery. This method allows one to identify common relations in data. Pattern
    discovery is very common in market basket analysis. The most important task carried
    out in market basket analysis is to select products which customers like to purchase
    in pairs.


    In the modern world, data sets continue to expand and increase in complexity.
    Machine Learning methods have become important in the biomedical community and
    building predictive models. Most researchers aren’t well trained to build and
    interpret these models. Therefore, it can be very difficult to select the right
    approach to a given data set.


    It is essential to identify the goal of a study so that you can determine whether
    it needs supervised or unsupervised learning. For instance, if the main goal is
    to develop a model that can predict the disease status of a patient, it is right
    to use a supervised approach. Choosing to use an unsupervised method, such as
    clustering, can mix the signal and produce the worst predictor. Conversely, if
    the goal is to develop an overview of a data set to determine the strongest patterns
    and whether the samples can be divided into subgroups, then the unsupervised method
    should be applied.


    Another factor to remember when adopting supervised methods is that you will have
    to search explicitly for patterns related to the annotation you want to predict.
    It is likely that you will discover something in the vast data space which can
    predict the annotation in the current data set. But this is not what you are aiming
    at. However, you are interested in determining whether a specific model can generalize.
    Therefore, supervised models should always be validated in independent data sets.
    Additionally, a good predictive performance in the training data does not mean
    that a model is good.


    # Chapter 7: Data Science and Big Data Analytics


    Regardless of whether you are going to enhance the supply chains, monitor floor
    operations, measure consumer sentiment or any large scale analytic problems, Big
    Data has a huge effect on the enterprise. The size of business data produced has
    increased by a huge value each year, and various types of information are stored
    in digital formats.


    One of the biggest challenges involves learning how you can handle new data types
    and discover the type of information that offers value to your business. It is
    not just about how you can access new data sources, but the inter-relationships
    among elements and patterns are also important. Gathering different types of data
    rapidly does not produce value. You must use analytics to discover insights which
    will support the business.

    '
  trans: '


    ## 4. 在数据上训练模型


    正确的机器学习任务将识别出正确的算法。在此阶段，你可以将数据输入到模型中。学习器（learner）指的是在某些数据上进行训练，并以最佳方式调整以适应数据的机器学习算法。


    ## 5. 评估模型性能


    由于每个学习器生成的解决方案都带有偏置，因此确定算法从经验中学习的最优方式是很有意义的。根据所应用的模型，你可以使用测试数据集来确定学习器的准确性。


    ## 6. 增强模型性能


    如果需要更好的性能，使用高级机制来提高模型的性能是很有意义的。


    一旦完成这些步骤且模型看起来运行良好，它就会被部署以执行其所需的任务。模型可以用于为预测生成评分、为新数据生成预测值，并为研究和营销提供重要的洞察。


    跟踪已部署模型的成功与失败至关重要，这可以帮助个人产生额外数据来训练下一代模型。


    ## 选择机器学习算法


    你选择的机器学习算法类型取决于现有的数据以及手头的任务。在数据收集、探索和数据清洗过程中，考虑这一过程至关重要。


    ### 输入数据


    所有的机器学习算法都需要一些训练数据。训练数据以特征（features）和示例（examples）的形式存在。


    示例包含了所学习的基础概念的单一样例实例。它指的是描述分析中所关注的原子单元的单个数据集。如果你正在开发一种选择垃圾邮件的学习算法，示例将包括来自电子消息的数据。对于要识别癌症肿瘤，示例可能需要来自不同患者的活检样本。


    特征（feature）指的是属性的特性或示例。它对于学习正确的概念至关重要。在之前的示例中，垃圾邮件检测数据集中的属性可能包括邮件消息中使用的单词和域名。在癌症数据集示例中，它可能是来自活检细胞的基因组数据，甚至是患者的测量特征，如年龄、体重、血压和身高。


    特征以不同的形式存在。。如果一个特征揭示了用数字测量的特性，则被称为数值型（numeric）。例如，体重和身高就是数值型的。同时，如果有一个特征决定了由一组分类器表示的属性，则该特征被称为命名型（nominal）或类别型（categorical）。如果以下类别具有特定的顺序，则该特征被称为序数型（ordinal）。注意这些特征代表了什么至关重要，因为数据集中特征的数量和类型都有助于定义正确的机器学习算法。


    ### 机器学习算法


    它们分为两种：监督学习器（supervised learners）和无监督学习器（unsupervised learners）。你已经对这两种类型的算法了解了一两点。简而言之，监督学习器创建预测模型，而无监督学习器构建描述模型。数据科学家应该选择哪种类型取决于当前的任务以及他们需要实现什么。


    如果你的任务是通过应用数据集中的另一个值来改变一个值的预测，那么使用预测模型是最佳选择。


    学习算法将尝试识别并建模目标特征与其他特征之间的关联。预测模型并不要求人们去预测未来事件。


    由于预测模型对于根据正样本和负样本进行学习所需所需的详细指令，这一过程被描述为监督学习。在这种情况下，监督并不描述人类的参与，而是目标值提供了监督作用，引导学习器学习它们需要学习的任何内容。最重要的是，当给定一组数据时，算法将尝试优化一个函数，以确定生成目标输出的特征值组合。


    应该预测的目标特征是一个类别特征，被称为类（class），并由不同的类别水平（levels）组成。一个类可以包含多个水平。


    监督学习器可以进一步帮助预测数值值，例如实验室值、收入和测试分数。为了预测这些数值值，应用了线性回归模型。尽管回归模型不是唯一的模型，但它们是最常用的模型。


    描述模型（descriptive model）用于处理可能从数据摘要中获得洞察的任务。尽管它预测一个特定的感兴趣的目标，但它的不同之处在于没有哪个特征比另一个更重要。


    鉴于描述模型没有要学习的目标，训练描述模型的过程被称为无监督学习。这些方法非常适合用于数据挖掘。描述建模的示例是模式发现（pattern discovery）。这种方法允许人们识别数据中的共同关系。模式发现在购物篮分析中非常常见。在购物篮分析中执行的最重要任务是选择客户喜欢成对购买的产品。


    在现代世界中，数据集不断扩大并增加复杂度。机器学习方法在生物医学领域和构建预测模型方面已变得重要。大多数研究人员并没有接受过构建和解释这些模型的良好训练。因此，为给定的数据集选择正确的方法可能非常困难。


    识别研究目标至关重要，这样你才能确定它需要监督学习还是无监督学习。例如，如果主要目标是开发一个可以预测患者疾病状态的模型，那么使用监督方法是正确的。选择使用无监督方法（如聚类）可能会混合信号并产生最糟糕的预测器。相反，如果目标是开发数据集的概述以确定最强模式以及样本是否可以分为子组，则应该应用无监督方法。


    采用监督方法时要记住的另一个因素是，必须显式地搜索与你想预测的标注相关的模式。你可能会在海量数据空间中发现某些东西，可以预测当前数据集中的标注。但这并不是你的目标。然而，你感兴趣的是确定特定模型是否可以泛化。


    '
