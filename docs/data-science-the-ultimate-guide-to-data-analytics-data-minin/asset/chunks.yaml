    处理海量数据并非易事；你可能会发现很难理解它，因此建议使用更好的可视化工具。SAS Visual Analytics 内置的自动图表功能会根据数据的大小和类型对数据进行审查。它是最优秀的可视化工具。正因如此，业务分析师和员工可以轻松使用该工具进行数据可视化。它将帮助他们创建数据分级，并以非常有交互的方式探索数据。


    数据量可能会成为问题，因为传统的架构和软件可能无法处理海量数据。


    尽管如此，在处理大数据时，最常用的描述性统计计算可能会变得复杂。例如，如果数据集有十亿行，而你想构建一个包含两个测量值的散点图，可能很难看到大量的数据点。同样，帮助个人视觉化数据的应用程序类型也可能失效。唯一可以求助的另一种解决方案是分箱（binning）。分箱要求个人从两个轴收集数据，以便他们以最有效的方式可视化大数据。


    箱线图描述了五种统计量的地理显示。这五种统计量包括中、下四位数、上四位数、最大值和最小值。当你想要创建一个摘要来定义一组数据的分布时，上述所有五个统计量都关重要。


    通常，箱线图对数据科学家来说是有效的，因为它识别了被称为离群值的异常点。通常，数据中离群值的百分比在 1-5%之间波动。对于传统规模的数据集，这种特定的比例并不容易发现。然而，对于那些处理海量数据集的人来说，识别非常困难。


    ## 如何可视化半结构化和非结构化数据


    大数据的差异导致了若干挑战。这些之所以是因为结构化和半结构化数据都需要可视化技术。词云可视化可以用于非结构化数据，帮助指示词的频率。这种频率可以低，也可以高。


    在 SAS Visual Analytics 中，词云在分类和关联创建中非常重要。根据单词的使用方式，单词被进一步分类分类。


    数据科学家还使用网络图来可视化半结构化数据。网络图根据代表个人之间关系的节点检查关系。网络图中的节点代表点，而连线（ties）代表线。


    你可以在不同的学科和应用中使用网络图。例如，分析社交网络的企业可以发现客户的互动。


    ## 第 6 章：数据科学中的机器学习


    机器学习指的是一种分析数据方法，通过训练计算机来执行人类和动物天生就能完成的任务。它完全关乎从经验中学习。机器学习算法具有计算方法，可以帮助个人从数据中发现信息，而无需等待预定义的方程。当用于学习的样本增加时，这些算法会动态地提高数据性能。


    ### 为什么机器学习很重要？


    大数据的增长使得机器学习成为解决问题的本质方法，例如：


    - 图像处理和计算机视觉

    - 用于负载预测的能源生产

    - 用于算法交易和信用评分的计算金融

    - 用于帮助识别语音的自然语言处理

    - 航空、汽车和制造业的预测性维护


    机器学习算法识别数据中的自然模式以得出见解并做出明智决策。它每天被用于股票交易、医疗诊断和预测中的关键决策。


    机器学习应用的示例包括：媒体网站在建议用户可能下载或观看的电影之前，先分析客户数据。此外，零售商必须从客户购买产品的方式中提取出重要信息。


    ### 什么时候应用机器学习是正确的？


    当你准备处理一项复杂任务或问题时，那就是应用机器学习的最佳时机。


    ### 机器学习的真相


    机器学习有其局限性。构建像《星际迷航》或《2001 太空漫游》中的 Hal 9000 那样的智能机器是不可能的。但在许多真实世界的处理应用中，机器学习运行得如丝般。以下是机器学习应用的热门类别：


    #### 图像处理


    它要求人们分析图像并获取数据或执行某些转换。示例包括：


    - 图像标记（Image Tagging）。这类似于 Facebook，算法可以自动识别照片中你的脸或你朋友的脸。基本上，机器学习算法将从手动标记的照片中学习。

    - 光字符识别（Optical Character Recognition）。一旦算法学会了如何将扫描的文本文档转换为数字版本，算法就必须知道如何将图像转换为相应数字字母的手写字符。


    #### 文本分析


    这是从电子邮件、文档、聊天和推文中分类或提取信息的过程。流行的示例包括：


    - 情感分析（Sentiment Analysis）。这是文本分类的另一个应用领域。在此类分类中，算法必须知道根据作者表现的情绪，将观点分类为中性、积极或负面。

    - 信息提取（Information Extraction）。这涉及学习提取特定的信息或数据。

    - 垃圾邮件过滤（Spam filtering）。这是最广泛使用的文本分类应用之一。垃圾邮件过滤器根据内容和主题将电子邮件分类为垃圾邮件。


    #### 数据挖掘


    这是一种用于从数据中确定预测的方法。该定义看起来是通用的，但可以将其看作是从数据库中的巨型表中提取重要信息。每一行都由训练实例和一列特征组成。你可能对预测表中依赖于其他所有列的新列感兴趣。例如：


    - 关联规则（Association Rules）。以超市或电子商务网站为例。通过查看一起购买的产品类型可以确定客户的购买习惯。这种信息对于营销目的很有用。

    - 异常检测（Anomaly Detection）。寻找离群值。例如，在信用卡欺诈检测中，你可能从用户的正常购买模式中识别交易类型和离群值。

    - 预测（Predictions）。这涉及从其他变量预测一个变量。例如，你可以通过学习现有客户的信用分和简介，预测银行新客户的信用分。


    ### 机器学习应用的步骤


    每个机器学习任务分为几个步骤：


    1. **选择机器学习方法**

    在开始任何步骤之前，必须表达机器学习问题。自己你想发现什么？你想对数据分类、预测新值还是根据某些因素进行分组？一旦选择了你想执行的机器学习任务类型，就可以进入模型阶段。


    2. **收集数据**

    在这一步中，你可以选择将数据写在纸上、将电子表格存储在 SQL 数据库中并记录文本文件。收集的数据应该是电子格式，以便于分析。


    3. **探索和准备数据**

    机器学习项目的有效性取决于它所使用数据的质量。建议将 80% 的精力投入到数据准备。这一步需要大量的人工干预。

    '
