    \ documents and baskets to be sentenced. \n\nProperties of Frequent-Item Sets\
    \ to Know\n\n•    Association rules. These refer to implications in case a basket\
    \ has a specific set of items. \n\n•    Monotonicity. One of the most important\
    \ properties of item-sets is that if a set is frequent, then all its subsets are\
    \ frequent. \n\n# Chapter 15: The Concept of Decision Trees in Data Science\n\n\
    Decision trees are a powerful and simple type of multiple variable analyses. This\
