    \ of the page. \n\n4.   Data Streaming\n\nIn most of the Data Mining situations,\
    \ you can’t know the whole data set in advance. There are times when data arrives\
    \ in the form of a stream, and then gets processed immediately before it disappears\
    \ forever. \n\nFurthermore, the speed at which data arrives very fast, and that\
    \ makes it hard to store in the active storage. In short, the data is infinite\
    \ and non-stationary. Stream management, therefore, becomes very important. \n\
    \nIn the data stream management system, there is no limit to the number of streams\
    \ that can fit into a system. Each data stream produces elements at its own time.\
    \ The elements should then have the same data rates and time in a particular stream.\
    \ \n\nStreams can be archived into a store, but this will make it impossible to\
    \ reply to queries from the archival store. This can later be analyzed under special\
    \ cases by using a specific retrieval method. \n\nFurthermore, there is a working\
    \ store where summaries are placed so that one can use to reply to queries. The\
    \ active store can either be a disk or main memory. It all depends on the speed\
    \ at which one wants to process the queries. Whichever way, it does not have the\
    \ right capacity to store data from other streams. \n\nData streaming has different\
    \ problems as highlighted below:\n\n*    Sampling Data in a Stream \n\nTo create\
    \ a sample of the stream that is used in a class of queries, you must select a\
    \ set of attributes to be used in a stream. By hashing the key of an incoming\
    \ stream element, the hash value can be the best to help determine whether all\
    \ or none of the elements in the key belong to the sample. \n\n*    Filtering\
    \ Streams\n\nTo accept tuples that fit a specific criterion, accepted tuples should\
