    The equation that is there to explain the phenomenon, depending on the size of
    the data that you are looking to model, could be obtained through either automated
    or manual means depending on the what you would use the results for. When it comes
    to the case of data science, the amount of data that the analysts would use is
    often going to require them to go with software that can automate the process.
    There is just too much data present to try and go it all manually, and it would
    take too long, and human error would cause something to be missed.


    ## The difference between exploring and explaining


    When it comes to data science, there are two schools of thoughts that are taking
    the lead. The first one is a group of those who believe that the use of data science
    should be there to satisfy the curiosity of the user. They believe that going
    through the data to find the different phenomena and patterns that are there should
    be enough for the data scientists and they shouldn’t need to do anything else
    with it.


    There is also the second school of thought which believes that this information
    should be used. It may not be enough just to see the information. This group believes
    that the patterns and the phenomena that are found in the data should be used
    by companies and organizations to create decisions. Whether the company decides
    to do this manually or automatically doesn’t matter.


    If you are using data science for business, it is likely that you are going to
    fall in with the second group of thinkers. You will want to use the information
    and patterns that you collect from your analysis of the data to make decisions
    for the business. These decisions could be about how to serve your customers better,
    what products to try out, and what important decisions to make in the future.
    No matter what, you are using the information to help you make important business
    decisions.


    # Chapter 2: How Big Data Works in Data Science


    To get started with data science, you must first understand where the information
    that you will be using comes from. Data science is not possible without any data
    present – or else you wouldn’t have anything to analyze in the process. Moreover,
    with the infrastructure that is provided by different technologies – that process
    a lot of information efficiently – many companies are starting to take advantage
    of sources like the internet to collect information. This is where Big Data will
    come in.


    Let’s take a closer look at Big Data so we can learn how it works in data science.


    ## The definition of Big Data


    To keep it simple, Big Data are data sets that are too complex or too large to
    be captured and managed or processed in a bearable time by using tools that are
    common. Using the relational database management system would not work because
    there is too much information to process so it would take too long.


    Because there was not much software to help keep up with this, and companies still
    wanted to be able to go through all that information to help make decisions, new
    database platforms were created. These include such options as `Hadoop` and `NoSQL`.


    When talking about Big Data, there are five unique data characteristics. The three
    main ones include:


    * **Volume**: This is the amount of data that is produced or received by the company
    in a day. This would amount to terabytes. Because of this, the volume of the Big
    Data will be so large that it must be stored on several different servers. This
    can also present a big challenge because it would take an unreasonable amount
    of time to analyze the data if it is done manually.

    * **Velocity**: The Big Data has to be available as close to real-time as possible.
    The faster that the right people can get to the data, the better advantage they
    will have to make good decisions for their business. The information that you
    collected even an hour ago could end up losing its relevance by the time you can
    do anything with it.

    * **Variety**: Data needs to come from many different formats or sources. You
    may be able to get Big Data from smartphone GPS data, in-house devices, forums,
    social network trends, and even comments on social networks. The variety that
    you get your data from will provide you with a better data set.


    ## Types of data


    There are three main types of data: structured, unstructured, and semi-structured.


    **Structured data** has a predetermined format and length. The pieces of information
    that come with structured data are ones that can be sorted, grouped, and organized
    quickly. A good example of this is what you can find when looking at databases
    like `Access` and `SQL`.


    **Unstructured data** is the kind that does not have a predetermined format. It
    is hard for an individual to be efficient when going through the information.
    They would need software and algorithms to go through the information efficiently.
    Some examples of this would include documents, emails, social media posts, videos,
    and photos.


    **Semi-structured data** is any data that will not fit into relational databases
    or data tables, but it still contains some attributes and tags. This type is often
    called self-describing data. This means that the structure will have embedded
    itself in the data. Examples of this would be `JavaScript Object Notation` and
    `Extensible Markup Language`, which are different data-driven mobile applications.


    ## The architecture of Big Data


    You will find that when working with Big Data, it will come in five layers. Let’s
    look at each layer and see what they will mean for your data:


    ### Layer 0


    Big Data requires a physical infrastructure that is redundant to handle the enormous
    requirements to compute it. This infrastructure will be linked by a network to
    enable the sharing of resources between the computers that hold the information,
    and it is there to create backups of the information in case there is a computer
    failure along the way. The performance, availability, scalability, flexibility,
    and the cost of this infrastructure are all important, and you need to take them
    into account before starting.


    ### Layer 1


    There needs to be the right amount of security to make sure that the data inside
    will stay safe. It is often necessary to use high-grade encryption so that no
    one can mess with the integrity of the data. Security measures need need to be
    in place so that you can detect threats to the data, such as a data leak, and
    data loss should also be taken into account. Access to the data and all the applications
    surrounding it need to be minimized so that there are fewer risks from human error.


    ### Layer 2


    The infrastructure needs to employ the storage of all types of data, including
    the three types that were discussed earlier. There needs to also be some atomicity,
    consistency, isolation, and the durability of the infrastructure’s, or database’s,
    behavior.


    ### Layer 3


    It is important for the infrastructure to be organized and compiled using technologies
    that are from a distributed filed system. It also needs things like serialization
    and coordination services, `ETL` tools, and workflow services.


    ### Layer 4


    Finally, the infrastructure should consolidate data gathered from relational and
    other databases for ease of access for later analysis.


    ## The benefits of using Big Data


    With all the work that comes with Big Data, you may wonder why someone would want
    to work with it rather than trying to work with something else? There are actually
    many great benefits that come with Big Data. To start, Big Data can provide a
    company or business with valuable data that they can use for risk analysis. Supply
    managers create demand forecasts and supply planning in anticipation, and mitigate
    any variance to resource availability.

