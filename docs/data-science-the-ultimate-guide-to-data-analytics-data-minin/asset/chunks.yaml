    这是一个开源数据可视化与分析工具，专为非数据科学专家的人士而设计。它具有简单的交互式工作流和高级工具箱，帮助用户构建一个可以分析和可视化数据的交互式工作流。然而，Orange
    创建的可视化类型与散点图、柱状图和树图有所不同。


    ### 3. Knime

    KNIME 是另一个用于数据分析的开源解决方案。该工具允许个人探索并发现数据中隐藏的洞察。该工具拥有超过 1000 个模块和数百个示例，用户可以通过运行示例来学习如何使用它。此外，还有一系列高级的集成工具和复杂算法。KNIME
    提供了任何数据科学家都可以使用的顶级工具箱。


    ### 4. R 语言编程

    这被认为是统计编程语言中的标准工具。一些人认为它是数据科学的“黄金小子”。R 也是一种开源软件，任何人都可以安装并将其用于统计计算和图形。它兼容 Windows、MacOS
    和 UNIX 平台。它在数据科学中非常有用，如果你是一个专家，它将提供很多就业机会。


    由于 R 是免费的，任何人都可以安装、使用、升级、修改、克隆和转售它。R 将帮助人们在技术项目中节省资金，并提供对任何统计编程语言都有用的定期更新。它是一种高性能语言，将帮助用户处理大量的数据包，并构建强大的工具来帮助管理大数据。此外，它最适用于资源密集型应用程序。


    除了数据挖掘之外，使用 R 语言还让你有机会应用统计和图形技术。这包括线性和非线性建模、时间序列分析、经典统计检验和聚类在内的许多方法。


    ### 5. RapidMiner

    与 KNIME 类似，RapidMiner 处理视觉化编程，在数据建模、分析和处理方面表现最佳。RapidMiner 提高了数据科学团队的生产力。它有一个开源平台来支持机器学习、模型部署和数据准备。由于它是一个集成的数据科学平台，它加速了从模型验证、机器学习到部署的完整分析工作流的开发。


    ### 6. Pentaho

    Pentaho 处理影响组织从不同数据中获取价值的问题。该平台将简化数据准备、数据融合，以及一组用于分析、可视化、报告、探索和预测的工具集。Pentaho
    的设计旨在确保团队的每个成员都能将数据转化为价值。


    ### 7. Weka

    另一款开源软件，设计有处理用于数据挖掘任务的机器学习算法的能力。你可以直接使用该算法处理数据集。它也是开发新机器学习方案的最优工具，因为它完全用 `JAVA`
    编程语言实现。


    由于 Weka 的图形用户界面简单且易用，它有助于人们轻松地过渡到数据科学领域。它用 `Java` 语言编写，任何具有 Java 经验的人都可以将该库调用到他们的代码中。


    ### 8. NodeXL

    这是一种数据可视化和分析工具，用于显示数据集中的关系。由于它是开源软件，可以免费用于分析数据并从数据中创建可视化。它是统计学中你可以用于分析数据的最佳工具之一。它具有不同的模块，例如社交网络数据导入器和自动化工具。通过
    NodeXL，你仍然可以快速方便地分析你的数据。


    ### 9. Gelphi

    Gelphi 用 `Java` 语言编写，是一款开源的可视化和网络分析工具。


    ### 10. Talend

    它是大多数数据驱动企业的领先开源集成软件提供商。Talend 允许任何地方的客户轻松连接。


    ## 数据可视化


    ### 11. Datawrapper

    这是一种在线数据可视化软件，用户可以用它构建交互式图表。用户将从 `CSV`、`Excel` 或 `PDF` 文件上传数据到字段。该工具处理数据并生成地图、柱图和折线图。Datawrapper
    生成的图表可以使用即用的嵌入代码安装到构建的任何网站中。


    ### 12. Tableau Public

    该工具将以非常优雅且简单的方式实现可视化民主化。它是任何类型业务中使用的非常强大的工具。人们可以借助 Tableau 数据可视化工具的帮助来识别数据洞察。在涉及分析时，Tableau
    中的可视化允许数据科学家在进入复杂的统计过程之前探索数据。


    ### 13. Infogram

    它拥有超过 35 种交互式图表和 500 多幅地图，允许个人以最美的方式可视化数据。它能创建不同的图表，如词云、饼图和柱状图。Infogram 还支持一个地图模块，可以吸引观众的注意力。


    ### 14. Google Fusion Tables

    这是最有趣且强大的数据分析工具之一。当你有一个想要可视化和映射的大型数据集时，它是最佳选择。通过其强大的制图软件，Google 在创建这一工具方面发挥了重要作用。


    ### 15. Solver

    该工具构建了支持有效的财务报告、预算和分析的能力。它有一个按钮，可以让任何人访问并交互数据，从而为公司产生更多利润。


    ## 情感分析工具


    ### 16. OpenText

    这是一种专门的分类引擎，应用于文本内容中表达和模式的识别与评估。分析发生在文档、句子主题层面。


    ### 17. Trackur

    这是一种自动情感分析软件，可以突出个人跟踪的特定关键词。Trackur 拥有一种算法，监控所有社交媒体和主流新闻，通过发现趋势来得出重要的洞察。


    ### 18. Opinion Crawl

    另一款在线情感分析软件，应用于最新新闻、产品和公司的分析。它让每位访问者都能自由访问特定主题的情感。任何人都可以输入、参与一个主题并接收即时情感评估。对于每个主题，有一个饼图来显示最新的实时情感和当前新闻标题列表。此外，还有不同的缩略图和词云标签，包含了公众可以产生共鸣的概念。该工具允许人们看到对情感产生正面或负影响影响事件。为了创建全面的分析，网络爬虫会搜索在常见主题和当前公共问题上的最新内容。


    ## 数据提取工具


