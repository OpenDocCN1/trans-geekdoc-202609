    \ main characteristics. You can use a statistical model to do this, but EDA is\
    \ there to see what a data set can tell you beyond formal modeling or hypothesis\
    \ testing. However, it is more concerned with observational data than data from\
    \ formally design testing. It is not confined to a set of techniques, but a philosophy\
    \ about how the data analysis should be done. \n\nWhen you are ready to use EDO,\
    \ you need to remember that the techniques are used with these goals in mind:\n\
    \n*    To help detect mistakes in the data\n\n*    To check any assumptions presented\
    \ with the data\n\n*    To help with a preliminary selection of appropriate models\n\
    \n*    To assess the relationships and the direction of the different variables.\
    \ \n\nMake sure that you are not mistaking the EDA with the initial data analysis,\
    \ which will focus on checking assumptions that are necessary for model fitting\
    \ and hypothesis testing. It can even handle missing values and adjust the variables\
    \ – if you need to ensure that you get the right information from the data. \n\
    \nTypes of EDA\n\nThere are a few different types of EDA that you can work on.\
    \ The one that you will want to choose will depend on the information that you\
    \ want to use and what you want to do with the data that you have. Some of the\
    \ types of EDA include:\n\nUnivariate non-graphical EDA\n\nThis is the first step\
    \ to analyzing the data. With this type, there will be just one variable or characteristic\
    \ that is being observed, and that is used to help represent the sample. Usually,\
    \ the objective of univariate non-graphical EDA is to create a better appreciation\
    \ of the sample distribution and to help carefully conclude the compatible population\
    \ distribution and sample distribution. Since this is a non-graphical method,\
    \ the data used for it will be objective and qualitative. \n\nUnivariate graphical\
    \ EDA\n\nThis focuses on a single variable of a sample distribution. However,\
    \ when working with univariate graphical EDA, it will deal more with quantitative\
    \ data rather than qualitative data. Some of the techniques include quantile-normal\
    \ plots, boxplots, stem and leaf plots, and histograms. \n\nMultivariate non-graphical\
    \ EDA\n\nThis illustrates the relationship between at least two variables through\
    \ cross-tabulation or statistics, like covariance and correlation. \n\nMultivariate\
    \ graphical EDA \n\nThis shows some of the relationships between variables; however,\
    \ like the univariate graphical EDA, the data used is more quantitative. The technique\
    \ that is used commonly for this is a grouped bar plat. "
