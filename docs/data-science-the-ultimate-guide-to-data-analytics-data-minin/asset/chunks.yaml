- raw: "Text is another form of data, and like any other form of data that you want\
    \ to work with, it can be transformed so that it is easier to analyze. Unfortunately,\
    \ text works differently because it is an unstructured form of data and this can\
    \ make it difficult when you want it analyzed by different types of technologies.\
    \ However, when it comes to text, there is a lot of potential information, so\
    \ it is hard to pass up on it. \n\nThe database of the company alone could hold\
    \ a lot of information in the form of text. This could come in consumer complaint\
    \ logs, medical records, product inquiries, and customer records. If this is done\
    \ the right way, the data that is taken from text could help the business gain\
    \ an insight into how their customers behave and into the preferences of their\
    \ customers. Knowing this information would allow the business to create better\
    \ services, products, and customer service. \n\nA lot of the information that\
    \ you are going to want from the Internet will come in the form of text. You will\
    \ find this text on social media, blog posts, review articles, and personal web\
    \ pages. Being able to get the information out of the text from these sources\
    \ will make a big difference in how much data you can use. \n\nThe reason that\
    \ text is so difficult to work with is due to the fact it is an unstructured data\
    \ source that you would normally have in table links, fixed meaning, fields, and\
    \ tables. It is meant to be understood by a human, but computers do not easily\
    \ understand it. In addition to lots of different lengths of words, text fields,\
    \ and even word orders, it is possible that people will write using the wrong\
    \ spelling and grammar and also with random punctuations and abbreviations. \n\
    \nBecause of all these variables, it becomes really hard to data mine the text\
    \ that you want to use. The good news is that it is possible to take the text\
    \ that you have and convert it to text. \n\nHow to convert your text into usable\
    \ data\n\nA body of text first needs to be changed into a set of data before you\
    \ can feed it through an algorithm of data mining. This is generally done through\
    \ the same technology that various search engines are going to use, such as Bing\
    \ and Google. There are a few different options that you can use:\n\nBag of words\n\
    \nThis approach converts text into a structured form. This is usually going to\
    \ be in the feature-vector form. This treats each document as a simple collection\
    \ of individual words. It won’t look at it all as a whole but at each little part.\
    \ It will also ignore punctuation, sentence structure, word order, and even grammar.\
    \ Each individual word inside the document will be treated like a potential keyword\
    \ that has some importance. \n\nMany businesses like to use this method because\
    \ it is easy and inexpensive to generate and it will work well for most of the\
    \ tasks that they want to do with data mining. \n\nTerm frequency\n\nWith this\
    \ approach, the system will look at how many times a word shows up in a particular\
    \ document and then will use this to determine how important the term is. The\
    \ more frequently it appears in the document, the more valuable and important\
    \ that term is. \n\nEvery word in the document will first need to be converted\
    \ so that it is in lowercase format. This will help because it would count words\
    \ that are in different cases to be counted as the same thing. Also, words that\
    \ are stemmed or have suffixes will be removed, so that the system can count the\
    \ word, no matter what the original form is. And the stop words, or words that\
    \ are really common, such as ‘the’, ‘and’, ‘of’ and ‘on’, will be removed, so\
    \ they don’t mess with the results of this test. \n\nInverse document frequency\n\
    \nThis approach is used when measuring the frequency of a term in a collection\
    \ of documents. It is not just responsible for measuring how often a term or a\
    \ word appears though. It will impose an upper and a lower limit for the term\
    \ to be considered as important. It is doing this to make sure that a specific\
    \ term is not too rare or not too common to be included in the results. \n\nWithout\
    \ this option, the data mining system would consider the distribution of words\
    \ throughout the whole set of documents. This is because a term that may appear\
    \ in fewer documents can sometimes be more significant in the documents that do\
    \ contain it. \n\nHere is a formula to use when looking for inverse document frequency:\n\
    \nIDF(t) = 1 + log( Total number of documents / number of documents containing\
    \ t) \n\nWith this, the (t) will be for whatever term is being looked up. \n\n\
    TFIDF\n\nTerm frequency-inverse document frequency, or TFIDF, is a combination\
    \ of the two approaches already discussed. It evaluates how important a term or\
    \ a word is to the document inside a series of documents. The importance of this\
    \ term will increase the more that it shows up in a document, but this can be\
    \ offset by the frequency of said term when you look at all the documents. This\
    \ approach is the one that search engines use when they want to score and rank\
    \ to figure out if a web page or a document is relevant to a given search query.\
    \ The formula for TFIDF is:\n\nTFIDF(t, d) = TF(t, d) X IDF(t)\n\nN-gram sequences\n\
    \nThis approach counts the sequences of adjacent words as terms. An example of\
    \ this is a sentence like, The quick brown fox jumps. When looking for this in\
    \ a document, it will be considered as one whole term and tokens would be created,\
    \ so it looks like quick\\_brown, brown\\_fox, and fox\\_jumps. This approach\
    \ would be useful when the phrases are significant in a document but the words\
    \ making up the phrases are not that important. \n\nNamed entity extraction\n\n\
    With the named entity extraction approach, the significant phrases will either\
    \ be names of a person, a location, expressions of times, organizations, quantities,\
    \ monetary values, or percentages that will be counted as a term. This would include\
    \ any of their known iterations when looking through the documents. An example\
    \ of this would be: \n\nG.O.T. or GOT for Game of Thrones. \n\nNY Mets for New\
    \ York Mets. \n\nThese are just a few examples with the abbreviations, and the\
    \ named entity extraction would ensure finding the right words, even if the user\
    \ went with a different way to write it out. \n\nThis approach is very intensive\
    \ of the knowledge that it provides. Moreover, it will work well if the person\
    \ has been trained on a large number of documents or if you hand code it to have\
    \ the knowledge that you want with all of these different names. \n\nData mining\
    \ text can provide a unique challenge when working on mining information that\
    \ you want. However, since the text can provide a lot of important information\
    \ to the business about their customers and the products and services that they\
    \ provide, it is still really valuable to have. You can choose to use one of the\
    \ methods above to ensure that you get the right information that you need, based\
    \ on what you are looking for, to make some great business decisions. \n\n# Chapter\
    \ 6: Basic Machine Learning Algorithms to Know \n\nAlgorithms are going to play\
    \ a big role in all the stages when working on data science. It is used to mine\
    \ valuable data from any type of data, including the unstructured form of text.\
    \ It is further even used to organize structured data. And, more importantly,\
    \ it is there to create and then test models that the business would use to create\
    \ the solutions needed for various situations. \n\nWith the help of machine learning,\
    \ all of this is done automatically. This is why you should learn some of the\
    \ algorithms for machine learning if you would like to be able to work with data\
    \ science. \n\nGoing through all of the information on your own is not always\
    \ going to be the most efficient use of your time. If there is a large amount\
    \ of data to sort through, it can take up too much time. Or you may end up missing\
    \ out on things because there is just too much information to go through. "
