    你可以使用的 EDA（探索性数据分析）类型取决于你正在查看的信息类型、你要处理的信息量，以及在完成工作后你想对这些信息做什么。只要你对从数据中寻找什么心中有数，这些方法都可以非常有效。你甚至可以尝试不同的方法，以找出哪种最符合你的需求以及哪种能提供最好的信息。


    # 第 4 章：数据挖掘工作


    存储在数据库和其他基础设施中的数据具有巨大的潜力。然而，如果人们必须缓慢地遍历所有数据，花时间梳理所有数据是不现实的。这就是数据挖掘过程用用场。它是一种可靠且自动的技术，旨在寻找对业务可能感兴趣的模式。


    在业务所有者或经理思考他们认为数据科学可以解决的问题之后，探索数据可能是下一步——或者，它可以帮助为数据科学家提供一个观察角度，从而为改进业务提供价值贵的见解。数据挖掘可以更轻松地帮助完成工作。


    让我们来看看如何开始这个过程。


    ## 什么是数据挖掘？


    数据挖掘是一个自动化的、旨在数据探索的过程。它通过定义良好的子任务（后文将讨论）从大量数据集中发现模式。数据挖掘通过变量之间是否存在关系来理解所有海量数据。它还可以查看过去行为的解释以及对未来行为的预测。


    在不考虑数据挖掘时无法获得问题的解决方案，这本身就是失败。数据挖掘是对数据的探索，可以为未来的数据集创建基础或预测。


    ## 数据挖掘的任务


    如上文所述，数据挖掘必须依赖子任务来寻找大量数据中可能存在的模式。某些任务包括以下内容：


    ### 分类 (Classification)


    这是尝试预测大量数据中人口的每个个体属于哪一类。这可以帮助分离信息，从而更容易理解和找到所需的信息。业务中这的一个很好的例子是：“在公司的现有客户中，哪些人最可能对特定的优惠做出响应。”这将产生两个类别：会响应的人和不会响应的人。根据试图从信息中弄清楚什么内容，可能会有许多不同的类别。


    ### 回归 (Regression)


    此任务尝试估计数据集中每个部分变量的数值值。可能的变量可能包括根据数据集中每个人的历史使用情况确定的服务使用率等。


    ### 相似性匹配 (Similarity matching)


    顾名思，这项任务试图识别人口中与从人口中选出的个体具有相似变量的个体。一个很好的例子是找到与被视为公司最佳选择的客户变量匹配的个体。


    相似性是许多数据科学方法和解决业务问题的解决方案的基础。如果两个事物（例如产品公司和人）在某些方面是相似的，它们通常也会具有不同的特征。数据挖掘程序可以基于相似性对事物进行分组，或者允许搜索所需的相似性。


    这在之前的某些章节中已经看到——建模程序在实例具有目标变量的相似值时会创建边界将它们分分在一起。在本章的稍后部分，我们将更详细地查看相似性，并展示它如何被应用于各种任务中。


    ### 聚类 (Clustering)


    此任务尝试在不输入任何参数的情况下，根据数据集中个体的相似性进行分组。这是一个探索的过程，以发现数据集中是否存在组，如果存在组，可以使用创建这些组的变量。


    在你处理的某些应用中，你可能想要通过查看来寻找对象组。例如，你可以用它来寻找客户组，但不由某些预定义的目标特征驱动。你可以用它来发现你的客户之间是否形成了一些自然的自然群体或细分？这对于为业务提供大局观可能有用，然后你可以借此进行适当营销。它还可以帮助决策者提出一些重要问题，如：我们真的了解与我们一起购物的人吗？


    你也可以用它来确定客户需求。业务是否可以通过理解自然子群体来开发出更好的营销活动、更好的销售方法、更好的产品或更好的客户服务？这是一个将对业务与其客户互动方式产生巨大影响的理念。聚类的基本想法是你想找到一组对象——无论它们是客户、消费者还是其他什么——其中组内的对象是相似的，但在不同组中发现的对象之间并不真正相似。


    你还可以发现分层次聚类（hierarchical clusterings）。这些通常是从每个属于其自身簇的节点开始形成的。然后合并簇，直到只剩下一个主簇。这些簇的合并基于多种因素，包括它们的相似性，甚至是所选的距离函数。


    对于分层次聚类，你需要在簇之间拥有某种距离函数，将个体实例视为最小的簇。这通常被称为链接函数（linkage function）。例如，链接函数可以是每个簇中最近点之间的欧几里得距离，这可以应用于任何两个簇。


    ### 共现分组 (Co-occurrence Grouping)


    此任务试图寻找在相同交易中发生的实体之间的联系。一个很好的例子是亚马逊等在线购物网站的推荐功能。这些推荐功能会展示人们已经购买过的与之相似的产品。


    ### 画像分析 (Profiling)


    这试图为个体、群体或人口的行为设定基准。它还可以查看购买行为、交易位置和服务使用情况。这通常被用于检测消费者行为的异常，并当你想查看是否存在欺诈问题时使用。


    '
