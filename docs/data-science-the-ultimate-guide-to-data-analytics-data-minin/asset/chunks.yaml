    \ users using more than simple CAPTCHA codes and simple image techniques that\
    \ human beings can solve trivially.\n\n•    Be ready for unlikely incidents.\n\
    \n•    Stay familiar with pen testing and red-teaming tools.\n\n3.   Model compliance\n\
    \nGlobal laws determine the design, engineering, and operational costs of security\
    \ Data Science solutions. The laws provide strict guidelines on the handling of\
    \ data, movement, and model-building constraints. Model compliance is not a one-time\
    \ investment. Privacy laws can change depending on the political landscape. \n\
    \nCreating models which adhere to compliance laws is critical. Some of the actions\
