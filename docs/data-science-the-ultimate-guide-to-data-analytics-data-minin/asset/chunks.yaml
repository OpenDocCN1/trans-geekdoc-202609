- raw: "*    DBSCAN will begin with a starting point that is arbitrary, but which\
    \ has not been visited. The neighborhood of this point will be extracted using\
    \ a distance epsilon. This means that all of the points within the epsilon distance\
    \ will be considered neighborhood points. \n\n*    If there are enough points\
    \ in this neighborhood, then the clustering process will start, and the current\
    \ data point is known as the first point in your brand-new cluster. \n\n*    If\
    \ there are not enough points, that starting point is labeled as noise. Sometimes\
    \ it can become a part of another cluster. However, either way, that point will\
    \ be marked as visited.\n\n*    For the first point in your new cluster, the points\
    \ that are within the epsilon distance neighborhood are also going to become a\
    \ part of that cluster. This procedure will be repeated for all of the new points\
    \ that were added to the cluster group. \n\n*    This process will be repeated\
    \ until the points are all determined in the cluster. This ensures that all of\
    \ the points have been visited and labeled as well. \n\n*    When you are done\
    \ with the current cluster, the system will go through and find an unvisited point\
    \ to start processing. This will keep on happening until all the points are marked,\
    \ and any that are unattached to a cluster are called noise. \n\nDBSCAN can give\
    \ you many advantages over some of the other clustering algorithms. First, you\
    \ do not need to have a specific number of clusters to make it happen. It can\
    \ also identify the outliers as noise, so they don’t just get thrown in and mess\
    \ up some of the results. \n\nThe biggest negative that comes with using DBSCAN\
    \ is that it won’t perform as well as some of the other algorithms when the clusters\
    \ come in at varying density. This is because the setting of the distance threshold\
    \ can make it difficult. This drawback will occur data is high-dimensional. \n\
    \nExpectation-Maximization (EM) Clustering with the help of Gaussian Mixture Models\
    \ (GMM)\n\nOne of the major issues that you are going to run into when using k-means\
    \ is that it is naïve when it uses mean value for the center of your cluster.\
    \ This isn’t always the best way to do things and can make some mixed results.\
    \ However, you will find that the Gaussian Mixture Models (GMMs) can give you\
    \ some more flexibility. With GMMs, we can assume that the data points are Gaussian\
    \ distributed. This helps because it is less restrictive. \n\nTo help you find\
    \ the parameters of the Gaussian for each cluster, or the mean and standard deviation,\
    \ you will need to use an algorithm that is known as the Expectation Maximization\
    \ or EM. To do this, you will need to follow these steps:\n\n*    To begin, you\
    \ will need to select how many clusters you would like and then randomly initialize\
    \ the distribution parameters of Gaussian for the clusters. You can try to come\
    \ up with a good estimate of this to help set up the initial parameters just by\
    \ looking at your data if there isn’t too much of it. \n\n*    Given the Gaussian\
    \ distributions that you pick for each cluster, you would then want to compute\
    \ the probability that each data point belongs to a particular cluster. When a\
    \ point is close to the center, the more likely it is to be in that cluster. This\
    \ makes a lot of sense if you assume that most of the data you are looking for\
    \ will lie closest to the center of your cluster. \n\n*    Based on this probability,\
    \ you can compute a new set of parameters so that you are getting the maximum\
    \ probabilities of data points in those clusters. \n\n*    You can compute these\
    \ new parameters with the help of a weighted sum of the positions of the data\
    \ points. Here you are going to look at where the weights are and the probabilities\
    \ of the data point belonging to that cluster. \n\n*    This would keep on repeating\
    \ until you get a convergence where the distributions are going to change much\
    \ more, if at all, from one iteration to another one. \n\nTwo main advantages\
    \ come from using the GMMs. First, these are more flexible when it comes to the\
    \ covariance of the cluster. This is because of the standard deviation parameter\
    \ that allows the clusters to take on any type of ellipses shape rather than having\
    \ to be in a circle.  \n\nAgglomerative Hierarchical Clustering\n\n![](images/00021.jpeg)\n\
    \nWhen it comes to using algorithms that are hierarchical, they fall into two\
    \ categories: bottom-up and top-down. \n\nThe bottom-up algorithms are the ones\
    \ that treat each data point as a single cluster but then will start merging pairs\
    \ of these clusters. It will continue to do this until you end up with one cluster\
    \ that will hold onto all of the data points. \n\nThe hierarchy of clusters will\
    \ look like a tree. The root of this tree will be the unique cluster that can\
    \ gather all of the samples until you end up with just one sample. \n\nThere are\
    \ several steps needed for this clustering:\n\n*    You are going to start out\
    \ by taking each data point and treating it like it belongs to its own cluster.\
    \ So, if you have 1,000 data points in the data set, then you would start out\
    \ with 1,000 clusters. \n\n*    From here, you are going to select a distance\
    \ metric. This is there to help measure the distance between two clusters. You\
    \ will use average linkage which will define the distance between two clusters\
    \ to be the distance average between data points that are in the first cluster\
    \ against those that are in the second cluster. \n\n*    With each iteration that\
    \ you go through, you will end up combining two clusters into one. The two clusters\
    \ that end up combining will be selected because they are the ones that have the\
    \ average linkage that is the smallest. This means that they do not have a very\
    \ large distance between each other and are very similar. This tells the program\
    \ that they are similar and need to be combined. \n\n*    You will continue repeating\
    \ the steps above until you reach what is known as the root of the tree. This\
    \ gives you a result where you have one single cluster that will contain all of\
    \ the data points. So, with the example above, you will start with 1,000 clusters\
    \ and then end up with just one when this is all done. \n\n*    You can use this\
    \ to pick out how many clusters you would like to end up with. You would tell\
    \ the program when you would like it to stop – by saying when it should stop combining\
    \ the clusters. Thus, instead of letting it go down to one, you would decide on\
    \ five clusters or whatever number you would like. \n\nHierarchical clustering\
    \ does not make it a requirement that you pick out how many clusters you would\
    \ like to use. You can let it keep going until you end up with just one cluster.\
    \ However, you can go through and add in more clusters if you would like. This\
    \ works out great if you are looking to separate out the demographics of who shop\
