    1. Your cost estimations match the amount on the check

    2. Your cost estimations fail to match


    If both the cost estimations and amount match, then you can move on to the next
    activity. Alternatively, if your expectations cost 60 dollars, but the check is
    30 dollars, then your expectations and data are different. In this case, there
    could be two possible reasons for the difference: the first is that you may have
    wrong expectations and you need to revise; and second, the check may be wrong
    and contains errors. One key indicator that can hint on the status of your data
    analysis is the easiness or difficultness to match the data you collected to your
    original expectations.


    ## Volume, Velocity, and Variety


    Big Data has various “V”s. The major ones include velocity, variety, and volume.
    Big Data surpasses the storage capacity of normal databases. The scale of data
    generated is massive. As of today, a huge amount of data is generated. One reason
    for this is because of the increase in interaction. Interaction is a new phenomenon
    besides just transaction of data. Data interaction comes from activities of the
    browser, personal digital recorders, and geo-location.


    With the advent of the “internet of things”, massive data is produced that humans
    spend their entire time trying to analyze.


    A good Data Scientist should know how to control volume. He or she should know
    how to create algorithms that can intelligently use the size of the data effectively.
    Things acquire a new direction when you have gargantuan data because each similarity
    becomes important, and one can easily make false conclusions. In most business
    applications, extraction of correlation is enough. However, the right Data Science
    uses techniques that determine the cause based on these correlations.


    Data velocity will always accelerate. There is an increase in Facebook posts,
    tweets, and financial information generated by many users at a higher speed. Velocity
    increases the volume of data and reduces the time of data retention. For example,
    a high-frequency trading activity depends on data streams and fast information.
    But the authenticity of the data reduces rapidly.


    Lastly, data variety has gone deep. Models which depend on just a handful of variables
    can now produce hundreds of variables because of the increase in computing power.
    The rate of change in volume, velocity, and data variety is currently possible
    for new economic-metrics and various tools.


    ## Machine Learning


    Machine Learning refers to how systems learn from various types of data they process.
    It is possible to train a system based on particular data to make decisions. The
    training process occurs continuously to enable systems to make updates and enhance
    decision-making ability. Systems that use spam filters are a great example to
    demonstrate how Machine Learning is applied. These systems use a `Bayesian filter`
    to change decisions.


    Therefore, it will continue to stay ahead of spammers. The ability to dynamically
    learn is important because it helps prevent spammers from gaming the filter. Credit
    approvals use `neural-nets` and are a great example of Machine Learning technique.
    Besides that, Machine Learning prefers data compared to judgments. Hence, a good
    Data Scientist should have a variety of both. Machine Learning has helped in finding
    answers to questions of interest, and it has further proved to be a game-changer.
    What makes Machine Learning very interesting is the four characteristics of machine
    intelligence:


    1. It is built on a strong foundation of a theoretical breakthrough

    2. It redefines the current economic paradigm

    3. The final result is commoditization

    4. It unearths new data from Data Science


    ## Supervised and Unsupervised Learning


    There are two broad ways that a system can learn: supervised and unsupervised
    learning.


    Supervised learning is where a system makes decisions depending on the type of
    data entered. Automated credit card approvals and spam filters apply supervised
    learning to achieve their functions. The system is supplied with a historical
    data sample of outputs and inputs. Based on this type of data, the system establishes
    the relationship between the two using Machine Learning techniques. You will need
    to use your judgment to choose the best technique to handle the task.


    Unsupervised learning happens when you only have input data (`X`) without a corresponding
    output variable. Unsupervised learning aims to build a model of the underlying
    structure in the data order so that you can learn more about the data. It is called
    unsupervised learning because there is no correct answer and teacher. Algorithms
    are left to decide and discover interesting structure in the data.


    Cluster analysis is an example of unsupervised learning. Cluster analysis selects
    a group of entities each with a different attribute and divides the entity space
    based on how far or near the entities of the attributes are. This will rearrange
    and redefine data by labeling it using additional tags. `Factor analysis` is part
    of the unsupervised learning technique.


    ## Predictions and Forecasts


    Data Science involves making forecasts and predictions. However, there is a distinction
    between the two. Predictions focus on highlighting a single outcome. If a person
    says that “it will be cold tomorrow,” he or she has predicted. But if they say
    that “the chance of tomorrow being cold is 40%,” they shall have made a forecast.
    This is because a forecast provides outcomes in the form of probabilities.


    # Chapter 3: Data Science as a Change Agent


    Data Science is a change agent. Even though it has not been realized yet, this
    should be the perfect time for organizations to be ready. Companies that plan
    to change in the next couple of years should position themselves by gathering
    the correct data and investing in analytics capacity.


    The main thing to consider while building a predictive model is to establish whatever
    it is that you want to predict and gather massive data sets which will permit
    you to do so. Even though it is still far to realize the change in management
    by applying predictive models, organizations can remain on the right path by adopting
    the right tools and collecting accurate data.


    ### Use Digital Engagement Tools


    There are always new systems created to allow organizations to collect real-time
    feedback from employees. As of now, organizations can take advantage of these
    tools and help enhance their services. Most of these tools have been developed
    and installed with more functionality to reveal more information about an employee.
    These are tools which will indicate more than just what employees think every
    time. Most of these tools provide a relevant change to the management and can
    further let one determine whether a change is received equally across many locations.


    By working with large travel tourism firms, it helps create a system for real-time
    employee feedback. This provides a chance to experiment with various change strategies
    in a particular population company. The real-time feedback implies that one has
    to learn quickly how communications and interaction tactics are received. Therefore,
    it optimizes the actions in days instead of weeks. This particular data is then
    fed into a predictive model that will help one to accurately identify actions
    that can improve the adoption of a new practice and behavior by a specific group
    of employees.


    Commercial tools that are available include `IQ polls` and sampling groups of
    employees through a smartphone app on a weekly basis to extract real-time insights.
    Many of these tools generate a big change but the data stream produced is even
    more important. As a result, it is essential to deploy these tools to achieve
    the success that comes with a change in data-driven processes.


    ## Social Media Analytics and Stakeholder Sentiment

