- raw: "Hacking, in this case, refers to the creativity and ingenuity in the application\
    \ of technical skills to define intelligent solutions to problems. \n\nThe ability\
    \ to hack is important because Data Scientists make use of technology to amass\
    \ massive data sets and work with advanced algorithms. This will need advanced\
    \ tools rather than Excel. A Data Scientist has to develop quick solutions and\
    \ integrate them with complicated data systems. The main languages linked with\
    \ Data Science include SAS, Python, and R. Other languages include Julia and Java.\
    \ \n\nHowever, it is not just mastering the language that is the key. A hacker\
    \ should be able to solve technical challenges creatively so that a program code\
    \ can function correctly.\n\nFurthermore, a Data Science hacker should have a\
    \ solid understanding of the algorithm. They can break down difficult and messy\
    \ problems so that they become solvable. This is very important because Data Scientists\
    \ work in an environment of complex algorithms. Therefore, they should have a\
    \ strong mindset to understand complex data. \n\nData Scientist – Curiosity and\
    \ Training\n\nThe Mindset\n\nA popular trait of most Data Scientists is that they\
    \ think deep and have an intense intellectual curiosity. Data Science calls for\
    \ one to be inquisitive. An individual has to regularly ask new questions, make\
    \ new discoveries, and learn new things. \n\nIn fact, it is not money that drives\
    \ them in their job but the ability to use their creativity to come up with solutions\
    \ to problems and frequently engage in their curiosity. Extracting high dimensional\
    \ leads from data goes just beyond making an observation. Instead, it is all about\
    \ discovering the truth hidden beneath the surface. Data Scientists are grateful\
    \ and passionate about what they do and find great satisfaction in taking on a\
    \ challenge.\n\nTraining\n\nThere is a popular misconception that to be a certified\
    \ Data Scientist, you must have a Ph.D. This view fails to consider that Data\
    \ Science is multidisciplinary. \n\n# Chapter 2: The Art of Data Science\n\nWhen\
    \ it comes to data analysis, it is not as easy as it looks. One of the reasons\
    \ why it is difficult is because only a few people have mastered the art of data\
    \ analysis. This means that only a few people can explain how it is done. \n\n\
    Surprisingly, many people try to analyze data daily, but the majority fails in\
    \ their efforts. This is because experts in this field haven’t taken time to explain\
    \ how they think while analyzing data.\n\nData Science is an art. It is not a\
    \ concept that one can teach a computer. Data analysts use different tools to\
    \ achieve their task, right from linear regression to classification trees. Even\
    \ though all these tools are known to the computer, it is the role of the data\
    \ analyst to figure out a way in which he or she can gather all the tools and\
    \ integrate them to data to develop the correct answer to a question. \n\nHowever,\
    \ the process of data analysis has not been written down properly. While there\
    \ are many books written about Statistics, none of them tries to address how one\
    \ can create a real-world data analysis solution. On the other hand, coming up\
    \ with an important framework involves classifying elements of data analysis using\
    \ an abstract language. In some cases, this language might be mathematics. Conversely,\
    \ the same details of the analysis are what make each analysis complex and interesting.\
    \ \n\nThe Cycle of Analysis\n\nYou might look at data analysis and think that\
    \ it follows a linear, step-by-step process that has a well-developed result.\
    \ However, data analysis is an iterative and non-linear approach that is depicted\
    \ by a series of epicycles. In this approach, information is learned at each step\
    \ which then decides whether to redo and refine the next step that is already\
    \ performed or proceed to the next step. \n\nWhen it comes to analyzing data,\
    \ the iterative process is used in all steps of the data analysis. Besides this,\
    \ certain data analysis might appear fixed and linear because of the algorithms\
    \ encapsulated in the different software. \n\nTherefore, it is important that\
    \ one understand what it means by the term “data analysis”. Although a study of\
    \ data involves creating and implementing a plan for gathering data, data analysis\
    \ assumes that data is already gathered. Most importantly, a study will involve\
    \ the creation of a hypothesis, designing of a data collection procedure, gathering\
    \ of data, and interpretation of the data. However, since data analysis assumes\
    \ that data should be collected already, it involves the development and refinement\
    \ of a question and process of analyzing and interpreting data. \n\nThere are\
    \ Five Major Activities of Data Analysis:\n\n1.   State and refine the question\n\
    \n2.   Explore the data\n\n3.   Create formal statistical models\n\n4.   Interpret\
    \ the results\n\n5.   Communicate the results\n\nAll the above activities happen\
    \ on different occasions. For instance, it is possible to go through all of them\
    \ in a day but handle each in detail in a period of more than one month. So, let’s\
    \ look at the overall framework applied in each of these activities. \n\nWhile\
    \ there are many different types of activities that one can engage in while performing\
    \ data analysis, each aspect of the whole process can be undertaken through an\
    \ interactive process. Most importantly, for each of the above five activities,\
    \ it is advised that you include the following steps:\n\n1.   Define or set the\
    \ expectations\n\n2.   Collect information and compare the data to your expectations\
    \ \n\n3.   If the data fails to match your expectations, revise or fix the data\
    \ so that both your expectations and data match\n\nGoing through all the three\
    \ steps above is what is referred to as the cycle of the data analysis. While\
    \ you navigate through every stage of the analysis, you will be required to go\
    \ through the epicycle to constantly revise your question, formal models, interpretation,\
    \ and communication. A repeated cycle through each of these five major activities\
    \ forms the largest part of data analysis. \n\nDefine the Expectations\n\nIn this\
    \ step, you intentionally lay down what you expect before you can do anything\
    \ such as performing a procedure, inspecting your data or typing a command. For\
    \ the experienced data analyst, creating expectations might be automatic or a\
    \ subconscious process. Despite this, it is important to think about it. For instance,\
    \ if you are going to shop with friends and you have to stop by an ATM to withdraw\
    \ some money, you need to decide on the amount of money that you want to withdraw.\
    \ You need to have some expectations of the price of the things you are going\
    \ to buy. This could be something that you have no problem with if you know the\
    \ price/s of the product/s you are going to buy. This is an example of prior knowledge.\
    \ Another example of prior knowledge would be to know the time that a specific\
    \ restaurant closes. Using that information, you can schedule your time and activities\
    \ so that you show up for dinner before it closes. \n\nYou can also find out additional\
    \ information from your friends that will help you come up with expectations or\
    \ Google a restaurant to learn more about their working hours. This procedure\
    \ that you apply on prior information to develop expectation or implement an analysis\
    \ procedure is the same used in every main activity of the analysis process.\n\
    \nInformation Collection\n\nThis step requires one to collect information related\
    \ to the question or data. For questions, one collects information by doing a\
    \ literature research or finding out from experts. For the data, once you have\
    \ developed some expectations about what the result can be when the data is inspected,\
    \ it is okay to go ahead and carry out the operation. The results of this activity\
    \ include data that you need to collect and determine whether the collected data\
    \ matches your expectations. \n\nComparison of Expectations\n\nOnce you have the\
    \ data in your hands, the next step is to compare your expectations to the data.\
    \ Here, there are two possible results:"
