- raw: "Data Scientists can create a prescriptive uplift model to determine the chances\
    \ of converting a lead with a given offer. For example, to determine whether sending\
    \ a sign-on bonus can affect a prospective employee’s chances of accepting a job.\
    \ \n\nThis way, it becomes important for proactive planning. In addition, it creates\
    \ a line difference between machine and human interactions. Older predictive models,\
    \ for example, provide end users with insight into the likelihood of an event.\
    \ It is then left to human agents to decide on what they can do with that information.\
    \ \n\nHowever, the prescriptive uplift model can determine the events of an outcome\
    \ if the end users decide to follow a given course of action. Therefore, it helps\
    \ determine if a marketing campaign can win over a given demographic or provide\
    \ solutions for a political campaign to win votes.\n\nThe prospective applications\
    \ of this type of proactive data are unmeasured. They are especially important\
    \ when a person wants to predict results in retail, marketing, politics, and charitable\
    \ donations. \n\nDeep Learning: Machines Performing the Processing Patterns\n\n\
    The response to prescriptive modeling is a significant development as a result\
    \ of the popularity of Machine Learning technologies. Modern Data Scientists are\
    \ called to closely work with software engineers to develop new automated tools.\
    \ \n\nMost of these tools that they create use Machine Learning technology. The\
    \ chances are that you might have heard of technological development. It is very\
    \ popular in the Data Science field. But the thing that is most popular is Machine\
    \ Learning because of how it relates to the Big Data and Data Science.\n\nMachine\
    \ Learning provides powerful applications of Big Data and statistical probability.\
    \ It helps break down divisions that exist between data processing and data collection.\n\
    \nIn this case, the machine continuously adjusts its behavior and responds depending\
    \ on the environmental data. A good example of this is Amazon’s recommendation\
    \ tool – the more data that is fed into the tool by users via buying and browsing,\
    \ the more precise the recommendation.\n\nTools such as these represent evidence\
    \ of real-time interaction between devices and humans. While humans respond to\
    \ results, machines customize their next offerings depending on the feedback.\
    \ This is like a conversation compared to a chain of commands.\n\nDeep Learning\
    \ is a branch of Machine Learning. It models a structure and processes patterns\
    \ of the human mind. Deep Learning computers are created using neural networks\
    \ that have layers of nodes developed on top of one another. This kind of architecture\
    \ creates connections with another nonlinear fashion. \n\nTechnologies in Deep\
    \ Learning are important at emulating the type of visual processing carried out\
    \ by the brain when it responds to signals from the eyes. For example, Google\
    \ Translate app has Deep Learning to translate unembedded text from images into\
    \ another language. A user that is traveling into a different country can take\
    \ a picture of a box of cereal and upload it to Google Translate. Google can then\
    \ identify text on the box and return a translation in the native language.\n\n\
    In the same way, there is another Google project called Google Sunroof which takes\
    \ images from the Google Earth application and builds 3D models of rooftops using\
    \ a solar installation. By using Deep Learning neural networks, the Sunroof tool\
    \ can distinguish roof surfaces from cars or trees, even when obscuring factors\
    \ exist such as tree coverage and shadow.\n\nDeep Learning tools such as these\
    \ permit Data Scientists to develop predictive models depending on the unstructured\
    \ data like audio, video, and images instead of depending on structured information\
    \ such as numbers and text. \n\nData Science Converging with AI\n\nBoth Deep Learning\
    \ and Machine Learning are applications of Artificial Intelligence and the ever-changing\
    \ use of AI technologies. These kinds of applications heavily affect the practice\
    \ of Data Science. AI intelligence tools extend the data gathering process to\
    \ data processing and go even a step further to synthesize data into solutions\
    \ and designs. \n\nFor example, the Autodesk’s Project Dreamcatcher uses AI to\
    \ produce 3D product designs depending on criteria generated by designers such\
    \ as functional objectives, manufacturing methods, and budget. \n\nThe distinction\
    \ between this kind of project and other tools is that it doesn’t only let users\
    \ create designs. However, it provides different sets of data depending on solutions\
    \ and allows designers to create prototypes that focus on customized problems.\n\
    \nSuch tools expect a future where Data Science shifts from a strict analytical\
    \ function and delivers insights and recommendations to product development and\
    \ R & D applications.\n\nApart from AI tools performing human functions, they\
    \ also do it most effectively. Machines like these can determine insights that\
    \ only humans can feel. For instance, the Affectiva applies AI equipment to identify\
    \ human emotions such as joy, anger, and surprise. \n\nEnd of Human-Driven Data\
    \ Science\n\nThe success of automated Machine Learning tools has led to the argument\
    \ of whether there will be a time when human experts won’t be necessary at all.\
    \ The advanced nature of neural networks might very well automate the role of\
    \ neural networks, and this could also automate the work of Data Scientists. \n\
    \n# Chapter 14: Five Mining Techniques Data Scientists Require for Their Own Toolbox\n\
    \nOne of the major strengths of Data Scientists is a strong background in Math\
    \ and Statistics. Mathematics helps them create complex analytics. Besides this,\
    \ they also use mathematics to create Machine Learning models and Artificial Intelligence.\
    \ Similar to software engineering, Data Scientists must interact with the business\
    \ side. This involves mastering the domain so that they can draw insights. Data\
    \ Scientists need to analyze data to help a business, and this calls for some\
    \ business acumen. Lastly, the results need to be assigned to the business in\
    \ a way that anyone can understand. This calls for the ability to verbally and\
    \ visually communicate advanced results and observations in a manner that a business\
    \ can understand as well as work on it. \n\nTherefore, it is important for any\
    \ wannabe Data Scientists to have knowledge about Data Mining. Data Mining describes\
    \ the process where raw data is structured in such a way where one can recognize\
    \ patterns in the data via mathematical and computational algorithms. \n\nBelow\
    \ are five mining techniques that every data scientist should know:\n\n1.   MapReduce\n\
    \nThe modern Data Mining applications need to manage vast amounts of data rapidly.\
    \ To deal with these applications, one must use a new software stack. Since programming\
    \ systems can retrieve parallelism from a computing cluster, a software stack\
    \ has a new file system called a distributed file system. \n\nThe system has a\
    \ larger unit than the disk blocks found in the normal operating system. A distributed\
    \ file system replicates data to enforce security against media failures. \n\n\
