    by using a specific retrieval method.


    Furthermore, there is a working store where summaries are placed so that one can
    use to reply to queries. The active store can either be a disk or main memory.
    It all depends on the speed at which one wants to process the queries. Whichever
    way, it does not have the right capacity to store data from other streams.


    Data streaming has different problems as highlighted below:


    - `Sampling Data in a Stream`

    To create a sample of the stream that is used in a class of queries, you must
    select a set of attributes to be used in a stream. By hashing the key of an incoming
    stream element, the hash value can be the best to help determine whether all or
    none of the elements in the key belong to the sample.

    - `Filtering Streams`

    To accept tuples that fit a specific criterion, accepted tuples should go through
    while the rest are deleted. `Bloom filtering` is a wonderful technique that one
    can use to filter streams. Members in the selected set are hashed into buckets
    to form bits. The bits are then set to 1. If you would like to test an element
    of a stream, you must hash it into a set of bits.

    - `Count Specific Elements in a Stream`

    Consider stream elements chosen from a universal set. If you wanted to know the
    number of unique elements that exist in a stream, you might have to count from
    the start. `Flajolet-Martin` is a method which often hashes elements to integers.


    ## 5. Frequent Item – Set Analysis


    The market-basket model features many relationships. On one side, there are items,
    and on the opposite side, there are baskets. Every basket contains a set of items.
    The hypothesis created here is that the number of items in the basket is always
    smaller than the total number of items. In reference to the distributed file system,
    baskets represent the original file.


    As a result, a popular family technique to characterize data depending on the
    market-basket model is to discover frequent item-sets. These are sets of items
    that reveal the most baskets.


    ### Properties of Frequent-Item Sets to Know


    - `Association rules`. These refer to implications in case a basket has a specific
    set of items.

    - `Monotonicity`. One of the most important properties of item-sets is that if
    a set is frequent, then all its subsets are frequent.


    ### Market Basket Analysis


    Market basket analysis was previously applied in supermarket and chain stores.
    These stores track down the contents of each market basket that a customer brings
    to the checkout. Items represent products sold by the store while baskets are
    a set of items found in a single basket.


    That said, this same model can be applied in many different data types such as:


    - Similar concepts. Let items represent words and baskets documents. Therefore,
    a document or basket has words or items available. If you were to search for words
    that are repeated in a document, sets would contain the most words.

    - Plagiarism. You can let the items represent documents and baskets to be sentenced.


    # Chapter 15: The Concept of Decision Trees in Data Science


    Decision trees are a powerful and simple type of multiple variable analyses. This
    offers a unique functionality to complement for:


    Data variety mining techniques and tools

    - Traditional methods of analysis

    - Recently invented multidimensional methods of analysis and reporting in the
    field of intelligence.

    '
  trans: '

    距离度量基本上指的是一种处理该类问题的技术。它在高维空间中搜索最近邻居。对于每一个应用，定义相似性的含义都是关重要的。最流行的定义是 `Jaccard Similarity`（Jaccard
    相似性）。它指的是交集集合与并集之间的比例。它是揭示文档中文本相似性和客户特定行为的最优相似性标准。


    例如，在寻找相同文档时，针对这一特定示例有不同的实例。可能会有很多份文档的一个小片段无序地出现，有更多文档待比较，以及大到无法放入主内存的文档。为了处理这些问题，寻找相似文档有三个重要步骤：


    - `Shingling`（成圈）。这涉及将文档转换为集合。

    - `Min-Hashing`（最小哈希）。这涉及将大集合转换为短签名，同时保持相似性。

    - `Locality Sensitive Hashing`（局部敏感哈希）。专注于可能来自相似文档的签名对。


    表示文档资产最强有的方法是从文档中检索一组短字符串。


    - `k-Shingle` 指文档中可能出现的任何 `k` 个字符。

    - `min-hash` 作用于集合。

    - `Locality-Sensitive Hashing`。


    ## 3. 链接分析


    传统的搜索引擎由于容易受到垃圾信息攻击无法提供准确的搜索结果。然而，`Google` 成功通过使用以下技术克服了这个问题：


    - `PageRank`。它使用模拟方法。如果用户浏览网页时从一个随机页面开始，`PageRank` 尝试聚集，以防它监控到用户所在页面的特定大纲。整个过程是迭代运行的，这意味着用户较多的页面排名高于没有用户访问的页面。

    - 页面中的内容由页面使用的特定短语以及与外部页面的链接决定的。虽然垃圾邮件发送者很容易修改他们作为管理员的页面，但他们要在他们不是管理员的外部页面上做同样的操作就非常困难。


    换句话说，`PageRank` 代表一个为网页分配实数的函数。其意图是让一个具有较高 `page rank`（页面排名）的页面比没有 `page rank`
    的页面更重要。没有固定的算法来分配 `page rank`，但存在多种变。


    对于强连接的 Web 图形，`PageRank` 应用了转移矩阵原理。该原理对于计算页面的排名非常有用。


    为了计算 `page rank` 的行为，它模拟了随机用户在页面上的操作。


    人们对 `PageRank` 有不同的改进方法。第一种被称为 `Topic-Sensitive PageRank`（主题敏感页面排名）。这种类型的改进可以根据其的主题对某些页面赋予更高的权重。如果你知道某个特定页面的查询内容，那么可能会对该页面的排名产生偏差。


    ## 4. 数据流


    在大多数数据挖掘场景中，你无法预先知道整个数据集。有时数据以流的形式到达，并在其永久消失之前立即进行处理。


    此外，数据到达的速度非常快，这使得很难存储在活动存储器中。简而言之，数据是无限的且非平稳的。因此，流式管理变得非常重要。


    在数据流管理系统中，进入系统的流数量没有限制。每个数据流在它自己的时间产生元素。随后这些元素在特定流中应该具有相同的数据速率和时间。


    流可以被归档到存储器中，这将导致无法从归档存储器响应查询。这以后可以通过特定的检索方法在特殊情况下进行分析。


    此外，还有一个工作存储器，其中放置了摘要，以便用于响应查询。活动存储器可以是磁盘也可以是主内存。这完全取决于人们处理查询的速度。无论哪种方式，它都没有足够的容量来存储来自其他流的数据。


    数据流具有以下不同问题：


    - 采样数据。为了创建一个流的样本，你必须选择一组属性。

    - 过滤流。接受符合特定标准的元组，而其他元组被删除。`Bloom filtering`（布隆过滤）是一种过滤流的绝佳技术。所选集合中的成员被哈希到位中，然后这些位被设置为
    1。如果你想测试流中的元素，必须将其哈希到位中。

    - 在流中计数元素。考虑从通用集合选择的流元素。如果你想知道流中唯一元素的数量，可能需要从头开始。`Flajolet-Martin` 是一种经常将元素哈希为整数的方法。


    ## 5. 频繁项目集分析


    市场篮模型具有许多特征。在这一侧是项目，另一侧是篮子。每个篮子包含一组项目。


    结果，一种取决于市场篮模型的流行家族技术是发现频繁项目集。这些是揭示最多篮子的项目集合。


    ### 需要熟悉的频繁项目集属性


    - `关联规则`。这些指的是在篮子具有特定项目集时的隐含关系。

    - `单调性`。项目集最重要的属性之一是，如果一个集合是频繁的，那么它的子集也是频繁的。


    ### 购物篮分析


    市场篮分析以前应用于超市和连锁店。这些商店跟踪客户带到结账处的每个购物篮的内容。项目代表商店出售的产品，而篮子是单个篮子中发现的项目集。


    [content]

    决策树是一种强大且简单的多变量分析类型。它提供了一种独特的功能，可以补充：


    - 数据多样性挖掘技术和工具

    - 传统分析方法

    - 智能领域最近发明的多维分析和报告方法。

    '
