- raw: "This is where algorithms come in. They are going to do a lot of the work for\
    \ you to ensure you find the exact kind of information that you need, no matter\
    \ what it is and no matter how much data you want to go through. \n\nWhat are\
    \ algorithms?\n\nThese are complex codes that give instructions. They can do this\
    \ for helping to complete a task or solve a problem and can be set up to be completely\
    \ automated or at least partially automated. It is an independent sequence of\
    \ actions that have been designed to accomplish the purpose needed and, in this\
    \ case, it is problem-solving. It also has the capability of performing calculations,\
    \ data processing, and doing automated reasoning tasks. \n\nBasically, the algorithms\
    \ that we are going to take a look at are there to help give the system the directions\
    \ that you need to start. You can memorize these algorithms or put them somewhere\
    \ safe so you can pull them up when you need to use them. \n\nLinear regression\
    \ algorithm\n\nThis is originally from statistics and is one of the best known\
    \ and most used algorithms when using machine learning. It will model the relationship\
    \ between the scalar dependent variable that is denoted as y and one or more independent\
    \ variable that is denoted as x. When we are working with machine learning, this\
    \ is the one that is used to make sure that the predictive ability of a model\
    \ is improved because it uses historical data. For the most part, the linear regression\
    \ will be a supervised algorithm. \n\nk-Nearest Neighbors\n\nThis one can also\
    \ be denoted with the k-NN. This algorithm stores all the cases needed and classifies\
    \ the new cases by going with the similarity measure. It will be used to help\
    \ with both regression and classification predictive problems. A common application\
    \ used with this would be, Will a customer pick this product? Would it be good\
    \ to target them for a certain type of advertising? And is it possible to develop\
    \ more business with that customer? All of these are important things to understand\
    \ how to work with when running a business, and the k-NN algorithm can help out\
    \ with this. \n\nk-means\n\n![](images/00017.jpeg)\n\nThis is another algorithm\
    \ that is part of unsupervised learning. It is responsible for finding groups\
    \ inside of data. The k stands for the number of clusters or groups in the data.\
    \ The algorithm groups data points based on the features that they share in common.\
    \ This would net results of either grouping of data points that you can label\
    \ new data, or as training data. \n\nWhen doing this in business, this kind of\
    \ algorithm is used to find groups within employees or customers that have not\
    \ been given a label. This can sometimes work to a business’ advantage because,\
    \ depending on who is in it, it could present a brand-new demographic that can\
    \ be used to maximize sales. Sometimes, this new demographic may not have even\
    \ been considered as an option, and other times it may have been researched to\
    \ see if a customer base fell into it. \n\nIf k-means is used to help with categorizing\
    \ employees, it could end up providing a demographic group that has specific professional\
    \ or educational backgrounds, and this could end up being the way a business figures\
    \ out who is the best candidate for a new team inside of the organization. They\
    \ would be able to go through their personal team already and figure out who is\
    \ the best fit for that new team, rather than trying to hire someone new or picking\
    \ the wrong people because they were not able to sort through the information\
    \ in the right way. \n\nUsing algorithms is one of the best ways to work with\
    \ the large data sets inside of an organization. A business wants to make sure\
    \ that they can find the specific things that are needed by the organization to\
    \ get the best results. Using these specific algorithms can make it easier to\
    \ find exactly what is needed, no matter how large the data set is. \n\n![](images/00018.jpeg)\n\
    \nNow we need to look at an example of how this is done: \n\n*    To begin, we\
    \ first select the number of groups or classes that we want to use. Make sure\
    \ that you initialize their center points randomly for these groups. \n\n*   \
    \ To help you figure out the number of classes that you want to use, you can take\
    \ a look at the data that you have and see if distinct groups encompass the majority\
    \ of the data that you have. The center points are vectors of the same length\
    \ as each data point vector and are your X’s in the graphic above. \n\n*    Each\
    \ of the data points will be classified simply by computing the distance between\
    \ that point and the center of each group. You would then classify the point to\
    \ be in the group where it is closest to one of the centers. \n\n*    Based on\
    \ these points that you chose, you can recompute the group center by taking the\
    \ mean of all the vectors in your group. \n\n*    You would then keep repeating\
    \ these steps for the set amount of iterations that you want. Or you would keep\
    \ going until the group centers didn’t change much between the iterations. \n\n\
    *    Sometimes it is best to randomly initialize the centers a few times and then\
    \ pick out the run that looks like it provided the best results. \n\nYou will\
    \ find that the k-means have the advantage over some of the other options because\
    \ it is pretty fast. The only thing that you are doing with it is computing the\
    \ distance between the points and their group centers. It does not have very many\
    \ computations to work with, so that makes it a bit easier to get the results\
    \ that you want. \n\nMean Shift Clustering\n\n![](images/00019.jpeg)\n\nAnother\
    \ option that you can go with is known as mean shift clustering. This is a sliding\
    \ window-based algorithm that works to find dense areas inside of all your data\
    \ points. It is also a centroid based algorithm, which just means that the goal\
    \ of it is to figure out the center points of each class or group and it will\
    \ work because it can update candidates for the center point to be the mean of\
    \ the points in your sliding windows. \n\nThese particular candidate windows are\
    \ then filtered during your post-processing stage, so you make sure that you get\
    \ rid of any duplicates. When you are done, you are going to end up with a final\
    \ set of center points along with their corresponding groups. \n\nSome of the\
    \ things that you will need to do to work with the mean shift clustering include:\n\
    \n*    To help explain the mean shift, you will need to consider a set of points\
    \ that are placed in a two-dimensional space. You would begin with a sliding window\
    \ of a circle that is centered at point C. The point C is one that is randomly\
    \ chosen, and it will have a radius r as a kernel. Mean shift is a hill climbing\
    \ algorithm which will involve having you shift the kernel iteratively to a higher\
    \ density region in each step until you reach convergence. \n\n*    At every iteration,\
    \ this sliding window will shift towards a region that has a higher density. It\
    \ can this by shifting the center point to the mean of the points that are inside\
    \ that window. \n\n*    The density that is within this sliding window will be\
    \ proportional to how many points are inside of it. When you do this, you will\
    \ naturally move towards areas that have more points there. \n\n*    You can continue\
    \ to shift the sliding window by the mean until there isn’t a direction or it\
    \ isn’t able to hold onto any more points in your kernel. \n\n*    You will repeat\
    \ the steps above with a lot of sliding windows until you can get all the points\
    \ inside this window. When you have several windows that overlap, the one that\
    \ has the most points inside will be the one that is kept. \n\nDensity-based spatial\
    \ clustering of applications with noise (DBSCAN)\n\n![](images/00020.jpeg)\n\n\
    The next type of algorithm that you can work with is known as DBSCAN. This is\
    \ a clustered algorithm that is based on density. It is similar to what you find\
    \ with the mean shift, but some advantages come with it. Some of the things that\
    \ you need to know when working with the DBSCAN include:"
