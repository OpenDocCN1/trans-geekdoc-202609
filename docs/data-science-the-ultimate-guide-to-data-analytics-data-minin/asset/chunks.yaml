    \ and the feedback that they are getting from their customers, they find that\
    \ it is much easier to understand the Big Data that they receive. Furthermore,\
    \ they can use that information to help them progress into the future. \n\n# Chapter\
    \ 3: Explorative Data Analysis\n\nWith the help of all the available technologies\
    \ that are out there to help automate data analysis, it is easier to take for\
    \ granted why there may be a benefit of having the human mind and eye look over\
    \ the data that you have. A study or research and the results that you get is\
    \ only as good as the quality of the data used in it. \n\nThis means that even\
    \ with technology, a data scientist needs to investigate the quality of the data\
    \ that is used. They should not just look at the information that they are presented\
    \ with and take it at face value. They need to look and see if it is high-quality\
    \ or if something seems wrong with the process. This is where explorative data\
    \ analysis can be beneficial. \n\nIt is not always a good idea to rely on the\
    \ information that the other methods are presenting. Sometimes they are great,\
    \ but it is always best to go through and make sure that the information makes\
    \ sense. Those who just take the information that they receive, and then run with\
    \ it to make their decisions, may find it works at some points, but it is not\
    \ going to be the best bet. In fact, it will often lead to making poor decisions\
    \ for a business and running it into the ground. \n\nIt is much better to take\
    \ a look at the data. You can use some of the other methods out there that have\
    \ the technology to help; however, then you need to go through and check the information\
