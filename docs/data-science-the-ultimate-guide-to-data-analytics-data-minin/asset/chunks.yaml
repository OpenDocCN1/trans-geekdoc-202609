- raw: "The type of EDA that you can use depends on the type of information that you\
    \ are looking at, how much information you are going to work with, and what you\
    \ would like to do with the information when you are all done. Each of these can\
    \ work really well as long as you have an idea of what you are looking for out\
    \ of the data. You can even experiment with the different ones to figure out what\
    \ will work the best for your needs and what gives the best information. \n\n\
    # Chapter 4: Working with Data Mining\n\nThe data that is stored in your databases\
    \ and other infrastructures has a lot of potentials. However, taking the time\
    \ to comb through all the data would end up being impractical if people had to\
    \ go through all of it slowly. This is where the process of data mining comes\
    \ in. It is a reliable and automated technology that is designed to seek out patterns\
    \ that may be of interest to the business. \n\nExploring data could then be the\
    \ next step after the owner or manager of the business ponder a problem that they\
    \ think data science could solve – or it could help to provide an observation\
    \ for a data scientist to look into that could provide valuable insight into improving\
    \ the business. Data mining can make it easier to help get this done. \n\nLet’s\
    \ take a look at how to get started with this process. \n\nWhat is data mining?\n\
    \nData mining is a process that is automated and aimed at data exploration. It\
    \ finds patterns out of a large set of data using well-defined subtasks (which\
    \ is discussed later). Data mining makes sense of all the large data regarding\
    \ the absence or presence of the relationships between the variables. It can also\
    \ look at the explanation of past actions and a prediction to future actions.\
    \ \n\nThe inability to attain a solution to a problem when data mining is not\
    \ considered is a failure in itself. Data mining is an exploration of data that\
    \ could create a basis or a prediction for future data sets. \n\nThe tasks of\
    \ data mining\n\nAs mentioned above, data mining has to rely on subtasks to find\
    \ the patterns that may be present inside a large amount of data. Some of the\
    \ tasks include the following:\n\nClassification\n\nThis is the attempt to forecast\
    \ which class each individual of a population in a large amount of data belongs\
    \ to. This can help to separate out the information, so it is easier to understand\
    \ and find the information needed. A good example of this in a business would\
    \ be “In the existing customers of the company, which ones are most likely to\
    \ respond to a given offer.” This will have two categories: those who would respond\
    \ and those who would not respond. It is possible to have many different categories\
    \ based on what is trying to be figured out from the information. \n\nRegression\n\
    \nThis task attempts to estimate the numerical value of a variable for each part\
    \ of the data set. The possible variables could include things such as the rate\
    \ of usage for the service based on the historical usage of each person in the\
    \ data set. \n\nSimilarity matching\n\nAs the name implies, this task tries to\
    \ identify individuals in the population that have similar variables to those\
    \ individuals that are selected out of the population. A good example of this\
    \ is to find individuals that will match the variables for the customers who are\
    \ seen as the best option for the company. \n\nThe similarity underlies many data\
    \ science methods and solutions to a problem of the business. If two things, such\
    \ as a product company, and people, are similar in some ways, they are going to\
    \ often come with different characteristics as well. Data mining procedures can\
    \ be based on grouping things by similarity or by allowing the search for the\
    \ similarity needed. \n\nThis was seen with some of the previous chapters – where\
    \ modeling procedures create boundaries to group instances together when they\
    \ come with similar values for the target variables. Later in this chapter, we\
    \ are going to take a look at the similarity in more detail and show how it will\
    \ be applied to a variety of tasks. \n\nClustering\n\nThis task attempts to group\
    \ individuals of a data set based on the similarities that they have, without\
    \ putting in any parameters. It is a time to explore, to find out the presence\
    \ of groups in a set of data, and if there are groups, one can use the variables\
    \ that create the said groups. \n\nIn some of the applications that you work with,\
    \ you may want to look through to find groups of objects. For example, you could\
    \ use it to find groups of customers, but not driven by some pre-specified target\
    \ characteristic. You can use it to find out if your customers form some natural\
    \ groups or segments among themselves? This could be useful in giving a business\
    \ a view of the bigger picture, and then you can use this to market properly.\
    \ It can also help decision-makers to ask some important questions like, Do we\
    \ really understand the people who shop with us?\n\nYou can also use it to figure\
    \ out what the customer needs. Could the business use it to develop some better\
    \ marketing campaigns, better sales methods, better products, or better customer\
    \ service by understanding the natural subgroups? This is a concept that will\
    \ make a big difference to businesses in how they work with their customers. The\
    \ basic idea with clustering is that you want to find groups of objects – whether\
    \ they are customers, consumers, or something else – where the objects within\
    \ groups are similar, but the objects that are found in different groups are not\
    \ really similar. \n\nYou can also find hierarchical clusterings. These are often\
    \ going to be formed by starting with each node that is part of its own cluster.\
    \ Then the clusters are merged until there is only one main cluster left. These\
    \ clusters are merged on a variety of factors, including their similarity or even\
    \ the distance function that is chosen. \n\nFor hierarchical clustering, you need\
    \ to have some distance function between clusters, considering individual instances\
    \ to be the smallest clusters. This is often called the linkage function. For\
    \ example, the linkage function could be the Euclidean distance between the closest\
    \ points in each of the clusters, which could then apply to any two clusters.\
    \ \n\n Co-occurrence Grouping\n\nThis task attempts to find connections between\
    \ entities that occurred in the same transactions. A good example is the recommendation\
    \ feature of online shopping websites like Amazon. These recommendation features\
    \ are going to present products that people have already purchased that are similar\
    \ to what others have gotten. \n\nProfiling\n\nThis attempts to set behavioral\
    \ norms to an individual, a group, or a population’s actions. It can also look\
    \ at buying behavior, transaction locations, and service usage. This is often\
    \ going to be used to detect anomalies in the behavior of a consumer and can be\
    \ used when you want to look and see if there is an issue with fraud. \n\nThe\
    \ two methods of data mining\n\nData mining through a set of data can be done\
    \ in two ways: supervised and unsupervised. \n\nWhen data mining is done in an\
    \ unsupervised manner, the patterns and the structures will be sought in data\
    \ that is unlabeled. This is usually used to create the basis for further data\
    \ mining tasks, which are then going to be done supervised. The result of this\
    \ is known as labeled data. \n\nYou can also use supervised data mining. These\
    \ are done by going through your set of data with the labeled data as an aid.\
    \ This labeled data will be used to identify individuals in the set of data. Identification\
    \ could be based on any variable, such as a group, correlation, or causality.\
    \ This labeled data could come from the data set that supervised data mining is\
    \ being done or on a new data set. \n\n# Chapter 5: Data Mining Text \n\n[![](images/00016.jpeg)](https://pixabay.com/en/analytics-information-innovation-3088958/)"
