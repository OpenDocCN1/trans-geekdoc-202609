    method to use to retrieve meaningful information from it. In fact, it is very
    hard to tell what is going on underneath the data. To deal with this problem,
    a small amount of data is extracted and studied. However, a small chunk of data
    is not satisfactory. It is important to take a look at multiple chunks to increase
    confidence in the results.


    Let’s assume that you have the level of cholesterol of people from country A.
    Then it is possible to determine the mean, median, and mode of the data. You can
    plot a histogram that contains meaningful ranges and review the data. Assume that
    the data resembles the figure shown below. The mean of the following data is 153.2.


    ![](images/00006.jpeg)


    This is an extensive data that is going to be very difficult to process. To process
    the data, data of 50 people is extracted and used to calculate the mean.


    Next, another sample of 50 people is taken and used to calculate the mean. This
    is done several times before the mean of these samples is plotted.


    ![](images/00007.jpeg)


    As you can see, the above sample means to create a frequency distribution that
    appears symmetrical. The frequency close to the original data is the highest and
    reduces once you move farther from the mean. This implies that if we extract cholesterol
    levels of 50 people and calculate the mean, it will range from 150 to 160. Only
    a few mean values will go past 170 and be lower than 140.


    ## Normal Distribution


    Earlier, it was referred to as a bell curve. It appears like this:


    ![](images/00008.jpeg)


    A normal distribution is perfectly symmetrical to the mean. Probabilities in a
    normal distribution move the same direction as the mean. The area under the curve
    is 1 and adding all the possible probabilities will result in 1.


    This type of distribution can change depending on how data is spread. If the data
    has a high range and standard deviation, the normally distributed curve spreads
    out and flatters.


    Apart from this, the majority of the values don’t lie close to the mean. Therefore,
    the probability of data being close to the mean decreases. Again, if the standard
    deviation is low, it means that the values will be close to the mean. So, there
    is a higher chance for the sample mean to be close to the mean. Remember: the
    higher the standard deviation, the bigger and flatter the curve gets.


    ![](images/00009.jpeg)


    ### Main Points:


    * There is an extensive probability for means to get close to the actual mean
    of the data instead of being far away.

    * The area of the probability density function represents the probability of a
    random variable in that range.

    * Normal distributions large standard deviation expands compared to lower standard
    deviations.


    ## Area in the Normal Distribution


    Assume that you have a cholesterol data set of various patients and you would
    like to determine the probability of healthy patients. The mean value (`µ`) for
    all patients’ cholesterol is equivalent to 150, and the standard deviation is
    equivalent to 15.


    Can you see that patients who are healthy are one standard deviation on either
    side of the mean? This means that you have to compute the area under the curve
    letting `135` and `165` as the limits.


    This particular area for normal distribution has been calculated, and the percentage
    is 68%.


    ![](images/00010.jpeg)


    ## Z scores


    In Statistics, there are many cases where the probability will be less or more
    than a particular value. This value won’t equal `1σ` or `2σ` as the distance from
    the mean. Z score is the distance that depends on the number of standard deviations
    and observed value from the mean.


    When you have a positive `z score`, the observed value is `Z` standard deviations
    more than the mean. On the other hand, a negative `Z score` means that the value
    is below the mean.


    `Observed value = µ+zσ` while `µ` is the mean and `σ` represents the standard
    deviation.


    # Chapter 11: Data in the Cloud


    Data Science refers to an intersection of many important concepts.


    To be a Data Scientist, you need to have solid programming skills. Even though
    you might not be familiar with all programming concepts, such as general production
    software architecture and infrastructure, you are required to have some basic
    skills in computer science concepts. Before you start a Data Science class, it
    is a must that you install `R` language and `Python` on your computer.


    While advanced analytics continues to expand, Data Science teams continue to evolve.
    This calls for a collaborative solution such as a recommendation system, predictive
    analytics and so on. Research and notebook tools integrated with code source control
    are an example of a collaboration solution.


    Collaborative requires inclusion of those working outside especially when Data
    Science sets out to accomplish business goals.


    ## What is a Cloud?


    While it sounds hypothetical and abstract, a cloud has a concrete meaning. Before
    moving on, here are some definitions of a few concepts that you need to know:


    **Network**. This refers to a collection of computers connected together that
    share resources. The internet is a good example of a network. Home networks like
    `Wi-Fi Service Set` and `Local Area Network` have multiple computers connected.
    Shared resources include media, web pages, app servers, data storage, and printers.


    Computers in a network are referred to as `nodes`. Intercommunication between
    computers is through internet protocols such as `HTTP`, `TCP`, and `IP`. Some
    of these communication protocols can help update a status, make a request, and
    many other uses.


    Additionally, it is hard for computers to be located on premise. In other words,
    both data and applications are found on computers in the data center. A data center
    is useful because it has the necessary infrastructure to support security and
    protection among others.


    Since the cost of computers and storage has continued to reduce over time, many
    solutions now involve multiple computers that work together, and they aren’t that
    costly when one wants to scale. This is very different from scaling solutions
    which include buying a powerful and expensive computing device. The reason for
    collaboration is to facilitate continuous operation even if a single computer
    breaks down. Besides this, collaboration enhances the system so that it can automatically
    scale and handle any load that is applied. evenPopular social networking sites
    such as `YouTube`, `Netflix`, and `Facebook` are good examples of cloud applications
    that must be scaled. It is rare to see these applications failing. This is because
    they have their systems hosted in the cloud.


    A `cluster` refers to a group of computers connected to the same network and all
    work to accomplish a similar task. You can consider it as a single computer that
    can improve performance, scalability, and availability.


    Next, let’s define the cloud. In simple terms, cloud refers to the process where
    a single entity can have total control over a group of network computers and generate
    software solutions. Depending on how the cloud is defined, the internet is said
    to be a network and not a cloud.


    ## Data Science in the Cloud


    Anyone who is familiar with Data Science is aware that the process takes place
    in the local machine of the Data Scientists. The computer is already installed
    with a programming language. This can be `R` or `Python`. The Data Scientist further
    installs relevant development packages using a manager such as `Anaconda` or installs
    individual packages manually.


    Once the development environment is ready, then the usual Data Science workflow
    starts, with data as the only element needed.


    Sometimes, it is not a must to carry out all the Data Science and Big Data related
    tasks in a different local development environment. Here are the reasons why:


    * The development environment processing power fails to carry out tasks in a reasonable
    amount of time.

    '
  trans: '


    当你有大量数据需要处理时，你可能会发现很难决定使用什么方法从中检索有意义的信息。事实上，要判断数据底层发生了什么是非常困难的。为了解决这个问题，我们会提取并研究少量的数据。然而，仅仅一小块数据是不够的。查看多个数据块以增加结果的信心至关重要。


    假设你拥有 A 国人员的胆固醇水平数据。那么就可以确定数据的平均值、中位数和众数。你可以绘制包含有意义范围的直方图并审查数据。假设数据如如下所示。以下数据的平均值为
    153.2。


    ![](img/00006.jpeg)


    这是一组大量数据，处理起来非常困难。为了处理这些数据，提取了 50 个人的数据并用于计算平均值。


    接着，取另一个 50 人的样本并计算平均值。在绘制这些样本的平均值之前，会重复多次。


    ![](img/00007.jpeg)


    如你所示，上述样本均值创建了一个对称的频率分布。接近原始数据的频率最高，随着离均值的距离增加，频率会降低。这意味着，如果我们提取 50 个人的胆固醇水平并计算平均值，其范围将在
    150 到 160 之间。只有少数平均值会超过 170 或低于 140。


    ## 正态分布


    早些时候它被称为钟形曲线。它看起来如下：


    ![](img/00008.jpeg)


    正态分布相对于均值完全对称的。正态分布中的概率移动方向与均值相同。曲线下的面积为 1，所有可能的概率之和的结果将是 1。


    这种分布会根据数据的分布程度而变化。如果数据具有高范围和标准差，正态分布曲线就会展开并变得平坦。


    除外，大多数值并不接近均值。因此，数据接近均值的概率会降低。同样，如果标准差较小，意味着值将接近均值。因此，样本均值接近均值的概率更高。记住：标准差越大，曲线越大越扁坦。


    ![](img/00009.jpeg)


    #### 要点：


    * 均值有很大概率接近数据的实际平均值，而不是远离它。

    * 概率密度函数的面积代表随机变量在该范围内的概率。

    * 正态分布的大标准差与低标准差相比会发生扩张。


    ## 正态分布中的面积


    假设你有一组各种患者的胆固醇数据集，并且你想确定健康患者的概率。所有患者胆固醇的平均值（`µ`）等于 150，标准差等于 15。


    你能看到健康患者位于均值两侧一个标准差的范围内吗？这意味着你必须计算曲线下的面积，以 `135` 和 `165` 为边界。


    正态分布的这一特定区域已经计算得出，百分比为 68%。


    ![](img/00010.jpeg)


    ## Z 分数


    在统计学中，有很多情况概率小于或大于某个特定值。这个值不会等于距离均值的 `1σ` 或 `2σ`。Z 分数是取决于标准差个数和观测值离均值的距离。


    当你有一个正的 `z score` 时，观测值比均值高 `Z` 个标准差。相反，负的 `Z score` 意味着该值低于均值。


    `Observed value = µ+zσ`，其中 `µ` 是平均值，`σ` 代表标准差。


    # 第 11 章：云端数据


    数据科学是指许多重要概念的交叉。


    要成为一名数据科学家，你需要具备扎实的编程技能。尽管你可能不熟悉所有的编程概念（例如通用生产软件架构和基础设施），但你被具备一些计算机科学概念的基本技能。在开始数据科学课程之前，必须在你的计算机上安装
    `R` 语言和 `Python`。


    随着高级分析的不断扩展，数据科学团队不断演进。这需要协作解决方案，例如推荐系统、预测分析等。与代码版本控制集成的研究和笔记本工具就是协作解决方案的一个示例。


    协作需要包含外部工作的人员，特别是当数据科学致力于实现业务目标时。


    ## 什么是云？


    虽然它听起来是假设且抽象，但云有具体的含义。在继续之前，这里是你需要了解的几个概念的定义：


    **网络**。指的是连接在一起并共享资源的计算机集合。互联网是网络的一个例子。像 `Wi-Fi Service Set` 和 `Local Area Network`（局域网）这样的家庭网络连接了多计算机。共享资源包括媒体、网页、应用服务器、数据存储和打印机。


    网络中的计算机称为 `nodes`（节点）。计算机之间的通信通过互联网协议如 `HTTP`、`TCP` 和 `IP` 实现。这些通信协议中的可以帮助更新状态、发出请求以及许多其他用途。


    此外，将计算机部署在现场是困难的。换句话说，数据和应用程序都位于数据中心的计算机上。数据中心是有用的，因为它具有必要的设施来支持安全和保护等。


    由于计算机和存储的成本随时间推移持续降低，许多解决方案涉及多台工作的计算机，当想要扩展时，它们并不昂贵。这与购买昂贵的计算设备的扩展方案非常不同。协作的原因是为了即使单台计算机故障也能持续运行。


    `cluster`（集群）指的是连接到同一网络并共同工作完成相似任务的计算机组。你可以将其视为一个提高性能、扩展性和可用性的单一计算机。


    接下来，让我们定义云。简单来说，云是指单个实体可以对一组网络计算机拥有完全控制并生成软件解决方案的过程。根据对云的定义，互联网被认为是网络而不是云。


    ## 云端数据科学


    任何熟悉数据科学的人都知道，过程是在数据科学家的本地机器上进行的。计算机已经安装了编程语言。这可以是 `R` 或 `Python`。数据科学家进一步使用 `Anaconda`
    等管理器安装相关的开发包，或手动安装单个包。


    一旦开发环境准备就绪，通常的数据科学工作流就开始，数据是唯一的元素。


    有时，不必在不同的本地开发环境中执行所有的数据科学和大数据相关的任务。以下是原因：


    * 开发环境的处理能力无法在合理的时间内完成任务。


    '
