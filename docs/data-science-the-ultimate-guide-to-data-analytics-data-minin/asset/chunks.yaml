- raw: "Decision trees are generated by algorithms which have different forms of splitting\
    \ data into segments. These segments combine to become an inverted decision tree\
    \ that has a root node as the origin at the top of the tree. The purpose of the\
    \ analysis is identified in the root node. This can be a simple, one-dimensional\
    \ display in the decision tree interface. The main field of data analysis is shown\
    \ alongside the distribution of values found in the field. A simple decision tree\
    \ is shown below. This particular type of tree represents a continuous and categorical\
    \ form of objective analysis. \n\nA decision tree is guided by the decision rule\
    \ where it must form branches below the root node. This originated from a method\
    \ which identifies the relationship between object analysis and target field and\
    \ many other fields which act as input to build branches. The values contained\
    \ in the input are referred to as response or a dependent variable.\n\nOnce the\
    \ relationship is developed, then it becomes easy to build a decision tree which\
    \ describes the relationship that exists between inputs and targets. Rules can\
    \ then be selected and used to demonstrate the decision tree that offers a way\
    \ in which you can visually describe and examine the tree-like network relationship.\
    \ \n\nDecision trees have the potential to predict new values or hidden observations\
    \ that have values for specific inputs but may be without values for specific\
    \ targets.\n\nThe decision tree rule allocates every derived observation from\
    \ the data set to a segment depending on the value of one of the columns in the\
    \ data. Columns that are taken to build rules are referred to as inputs. Still,\
    \ there are splitting rules in decision trees. These rules are applied one after\
    \ the other to help build a nest of branches that generate the general shape of\
    \ a decision tree. The hierarchy of branches is called a decision tree, and every\
    \ segment in the tree is called a node. If a node has all its children, it forms\
    \ an extra segment or branch of the node. Nodes at the bottom of the decision\
    \ tree are called leaves. \n\nFor every leaf, the decision tree has a special\
    \ path for data to get into the class defined as the leaf. All nodes in the decision\
    \ tree share a rule referred to as a mutually exclusive assignment rule. Therefore,\
    \ records and observations from the parent data set can only exist in a single\
    \ node alone. Once the decision trees are defined, it is then easy to use the\
    \ rules to generate other node values depending on the unseen data. In predictive\
    \ modeling, a decision tree will generate a predicted value.\n\nThe idea of a\
    \ decision tree came to life more than 50 years ago; the earliest decision tree\
    \ was used in the study of television broadcasting in 1956 by Belson. From that\
    \ time, many different types of decision trees were developed that aim to offer\
    \ new capabilities in the field of Data Mining and Machine Learning. For instance,\
    \ one form of the decision tree involved the development of random forests.\n\n\
    A random forest consisted of multi-tree committees which apply a randomly drawn\
    \ sample of data and inputs. In addition, it has a rewarding technique to build\
    \ multiple trees which, when integrated, generate a strong prediction about the\
    \ structure of the decision tree.\n\nApart from data modeling, you can use a decision\
    \ tree to explore and categorize data for dimensional cubes that exist in business\
    \ analytics and Business Intelligence. \n\nApplying the Decision Tree with More\
    \ Modeling Techniques\n\nDecision trees work best with other modeling techniques\
    \ like regression. These techniques are important at selecting inputs or generating\
    \ dummy variables to represent the effects of interaction in equations dealing\
    \ with regression. \n\nThe main point in stratified regression is to identify\
    \ and understand that relationship in data is not easily fitted for linear regression\
    \ equation. \n\nAnother reason why decision trees are used in Data Science is\
    \ that they collapse a group of categorical values into specific ranges aligned\
    \ with the values of a given target variable. This is also called optimal value\
    \ collapsing. A normal method to collapse categorical values together is to combine\
    \ categories into one. Since decision trees support a combination of categories\
    \ with similar values concerning the level of certain target values, there is\
    \ a very minimum information loss in collapsing categories together. This results\
    \ in an improved prediction and classification results. \n\nWhy Are Decision Trees\
    \ Very Important?\n\nDecision trees are a type of multiple variable analyses.\
    \ All types of multiple variable analyses allow us to explain, describe, and classify\
    \ the target. An example of a multiple variable that includes analysis is the\
    \ probability of sale or chance to respond to a marketing campaign due to the\
    \ effects of multiple input variables, dimensions, and factors. The multiple variable\
    \ analysis abilities of decision trees allow an individual to explore other relationships\
    \ and discover as well as explain things in the context of multiple influences.\
    \ \n\nIn fact, multiple variable analyses are essential in current modern problem-solving\
    \ – since every critical outcome that determines success depends on multiple factors.\
    \ Additionally, it is now getting clear that even if it is easy to build a single-cause,\
    \ this approach may result in a costly and misleading outcome.\n\nAccording to\
    \ different studies done in psychology, it has been discovered that the ability\
    \ to properly master and manipulate different chunks of knowledge is limited by\
    \ both the physical and cognitive limitations in processing. This adds up on the\
    \ utilization of dimensional presentation techniques and manipulation that are\
    \ capable of reflecting and preserving a high-dimensional relationship in a more\
    \ comprehensive way. \n\nThere are many multiple variable techniques present.\
    \ The attractive side of decision trees depends on their ease of use, robustness,\
    \ and relative power with different data and level of measurements. Decision trees\
    \ are constructed and presented in an incremental style. Therefore, the joined\
    \ set of multiple influences is a group of one-cause, one-effect relationships\
    \ demonstrated in the recursive type of decision tree. \n\nThis implies that a\
    \ decision tree handles human short memory issues in an effective way and in a\
    \ manner that is easy to understand than complex, multiple variable techniques.\
    \ Decision trees transform raw data into a detailed knowledge and awareness of\
    \ business, scientific, and engineering issues. This allows one to deploy knowledge\
    \ in a simple but yet powerful human readable form.\n\nDecision trees try to discover\
    \ a strong relationship between input values and target values in a set of observations\
    \ that build a data set. In case a set of input values is selected as having a\
    \ specific association with a target value, all the target values are classified\
    \ into a bin that forms a branch on the decision tree.\n\n This specific kind\
    \ of grouping is highlighted by the observed relationship between bin values and\
    \ the target. For instance, if the average target value is very different in the\
    \ three bins created by the input, then binning will select every input and determine\
    \ how the input values are linked to the target. \n\nA robust input-target relationship\
    \ develops when knowledge about the value of input enhances the ability to predict\
    \ the value of the target. A strong relationship will allow you to understand\
    \ the nature of the target. It is therefore okay for this type of relationship\
    \ to be used to predict the values of the targets. \n\n# Conclusion\n\nIn the\
    \ final chapter, this book examined the important concepts that the best Data\
    \ Scientists know and apply in carrying out Data Science tasks. Machine Learning,\
    \ defined as the practice of using algorithms to analyze data and learning from\
    \ it, is the key for a Data Scientist to help forecast future trends. "
