    大数据并没有创造新的存储机制和新的数据类型，但它开发了新的分析方法。本章将定义大数据分析，并回顾分析大数据以开发模式和关系的不同方法。此外，你将学习如何从海量信息流中做出明智的预测并推导出业务洞察。


    需要注意的是，大数据并不是一组独立的活动。因此，你需要一套凝聚的解决方案来帮助进行大数据分析、收集数据并发现新的洞察，以帮助做出频繁的决策。大多数组织通过同时应用商业组件和开源组件来完成任务。构建一个集成的大数据分析架构，使人员能够执行不同类型的活动，并在组件之间传输数据。


    ## 什么是大数据？它为什么重要？


    大数据描述的是规模超过了数据库软件工具（如存储、捕获和分析）正常功能的数据集。


    它指的是一组非常庞大且复杂的数据，使得无法使用简单的数据库管理工具进行处理。


    ## 大数据分析


    `Big Data Analytics`（大数据分析）一词在如今的市场已被广泛使用。在大多数情况下，它与`Data Mining`（数据挖掘）和`Business
    Intelligence`（商业智能）等其他相关概念一起使用。虽然所有这些术语指的是如何分析数据，但当多个交易、数据量和数据源变得巨大且复杂时，大数据就不一样了。在这种情况下，需要特定的方法和技术从数据中提取洞察。


    这引出了大数据的通用定义，它包含三个 V：`Velocity`（速度）、`Variety`（多样性）和`Volume`（量）。


    * `Volume`（量）。指的是大型数据集。

    * `Variety`（多样性）。描述来自不同数据源的数据。数据可能来自外部和内部数据源。最重要的是数据可以是任何格式。它可以是日志数据，甚至是来自数据库表格的结构化数据以及半结构化数据，如`XML`。

    * `Velocity`（速度）。描述来自交易的大规模数据，其特征是数据流具有更高的刷新率、速度和时间性。


    根据上述描述，大数据可以被视为一个高速度、高容量和高多样性的信息库，需要成本效益且创新的信息处理手段。这一过程导致了洞察力的提高、更好的决策以及流程自动化的改进。


    到目前为止，显而易见的是大数据不仅关乎数据量有多大，数据还应该以快速的速度和复杂的形式到达。此外，它应该来自不同的来源。


    最重要的一点要强调的是，尝试定义构成大数据的元素可能具有巨大的价值。每个人都应该知道，今天的大数据可能与明天的数据不同，因为技术在不断变化。简而言之，它是相对的。


    ## 我们所讨论的数据类型


    组织具有捕获交易数据的传统。此外，组织还以快速从其运行环境中捕获并存储额外数据。示例包括：


    * `Text data`（文本数据）。这是最大且最流行的大数据类型之一。其目标完全是从文本中开发主要事实，并将这些事实作为剩余分析过程的输入。

    * `Web data`（网络数据）。可以捕获网络用户的数据，如搜索、阅读、页面浏览和购买。这可以用于提高流失模型、定向广告和客户细分等领域的性能。

    * `Smart grid and sensor data`（智能电网和传感器数据）。如今，从油管、汽车和风力涡轮机记录传感器数据。数据以极高的频率收集。传感器数据产生与机械和发动机性能相关的深度信息。它有助于问题的诊断并更快速地开发缓解机制。

    * `Time and location data`（时间和位置数据）。`GPS`、`WI-FI`连接和手机使得时间和位置成为一个良好的数据源。结果，大多数组织已经理解了监控客户移动的重要性。组织接受了需要知道客户在任何给定时刻所在地。另一个重要点是能够查看聚合的时间和位置数据。在聚合层面查看时间和位置数据产生了许多应用。因此，时间和位置数据成为最敏感的大数据类型之一，必须谨慎对待。

    * `Social network data`（社交网络数据）。在`Facebook`、`Instagram`和`LinkedIn`等社交网络中，可以进行链路分析并发现网络。社交网络分析可以展示哪些广告可以吸引用户。这是通过考虑用户的兴趣和他们的社交圈实现的。


    对于许多此类大数据源，优势不在于数据类型，而在于它与其他数据源结合时所产生的价值。


    ## 大数据与传统数据的区别


    大数据与传统数据源在几个方面有所不同。首先，大数据可以被视为一种新的数据源。执行的交易类型与传统的实施的并没有很大区别。组织可以记录`Web transactions`，但这与几年前的交易没有区别。区别在于捕获的行为。行为可能包括浏览器行为，这代表了新数据的形式。


    其次，人们也可以认为数据的速度已经增加到足以被视为新数据源的程度。例如，电表过去是手动读取的。现在有了智能电表可以每分钟自动读取一次。人们可以进一步认为，频率已经增加到支持不同深度分析的程度。


    '
