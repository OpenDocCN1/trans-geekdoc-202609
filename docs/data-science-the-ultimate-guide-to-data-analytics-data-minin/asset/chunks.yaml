    Since the word “science” is used inside of the name, data science is sometimes
    seen as a scientific approach to extracting knowledge or other insight from the
    data. Just like you did with the scientific approach, data science will begin
    with the use of observation.


    In this case, the act of observation will include an analysis of data. This can
    be done through either an automated or manual means, to bring about patterns from
    that information. There is also the chance to formulate a hypothesis by verifying
    the observed patterns as valid, rather than just getting a coincidence of data.
    Lastly, you will also need to do some testing to verify the created model that
    you are given.


    In addition to being a type of science, data science can be seen as a field of
    study that is still in its infancy. Because it is still so new, there are some
    different opinions and positions as to the process of how it should be done. In
    this book, we will look at three approaches to help you gain a level of understanding
    and appreciation.


    ## The benefits and negatives of data science


    The first question that a business will have before they get started with data
    science for their needs is the benefits and the negatives of data science. First,
    we are going to take a look at some of the benefits to see how it can help the
    business.


    The first benefit is that it can help the business to make some important decisions.
    In the past, the business had to rely on their experience and knowledge about
    the market and their industry to figure out whether they were making smart choices.
    Those who had been in the industry for a long time could be good at this, but
    they may still miss out on important information that could help them out. Those
    who are new to the industry could easily make a lot of mistakes.


    The data science field helps managers and decision-makers look at information
    from different sources to help them make better decisions. They may be able to
    figure out which products to develop, how to provide better customer service,
    and even if there are new demographics to put their marketing efforts towards.


    With the right data science techniques, the information can be combed through
    in no time at all. This information is often so big that it would take years or
    more for a person to go through and by then, the information would be out of date.
    The data science field would be able to help you get through this information
    in no time so that you can actually use it in real time to help make your business
    stronger.


    However, it is important to realize that you need to look through the data and
    not always just take it at face value. There is often a lot of great information
    that is collected with data science, but if you are not careful, you may get the
    wrong information out of it. You need to take an objective look at the information
    to see if it makes sense. And then add in what you already know about the industry
    and the market to see if you can combine those to really propel your business
    forward.


    ## Blitzstein and Pfister


    The first step in this data science process is to ask a question that is interesting.
    During this stage, you will use the information that you know, as well as your
    curiosity about a subject, your experiences, and any expertise that you have to
    formulate questions. This can help you direct the way that you analyze the information
    that you are presented. Some of the questions that you may want to try out during
    this stage include:


    * What is the goal?

    * What would you like to do if you had access to all of the data?

    * What would you like to do?


    After you formulate your question, it is time to move on to the second step. This
    step is when you collect the data. There are several ways you can do this, including:


    * Querying

    * Cleaning

    * Web scraping


    Some of the questions you may ask during this stage include:


    * How will we sample?

    * Are there any anomalies?


    From here, you will move on to the next step. This step is exploring the data.
    You will want to start with:


    * Familiarizing yourself with the data

    * Developing hypotheses


    Some of the questions you can present include:


    * How can we plot this?

    * Are there any patterns?


    Under this method, you will move on to the fourth step. This step is when you
    model the data. You could use a few options including:


    * Data validation

    * Machine learning

    * Regression analysis


    And then you will move on to the last step. This is where you communicate the
    data through an easily understood manner. Valuable questions to make sure you
    do include:


    * What did we learn?

    * Do the results we are getting make sense?

    * Can we tell a story?


    ## Provost and Fawcett


    With this model, data science will be presented as an area that is separate from
    big data technologies, data process, and data engineering. It will differentiate
    itself because these could be used only to improve various processes in the organization,
    but they are not really there to help aid in decision-making.


    ## O’Neill and Schutt


    Another model that you can use is the O’Neill and Schutt model. With this one,
    data is collected from various sources in the environment. This could include
    a platform that the users of interest can interact with, a website, or another
    type of database. The data that is collected from this source is processed to
    produce a clean data set, and then it will usually be presented in a data table.
    This data set will be used for a few things such as statistical modeling and data
    analysis. Both of these are used to complete further modeling.


    ## Exploratory data analysis


    This approach analyzes data sets to summarize them out into their main characteristics.
    For the most part, this analysis is used to visualize what the data can present
    beyond hypothesis testing and formal modeling tasks.


    ## Statistical modeling


    Another thing that we need to discuss concerning data science is statistical modeling.
    This is a model that will approximate a real-world phenomenon, and then it can
    sometimes predict from that approximation using some simple mathematical equations.

