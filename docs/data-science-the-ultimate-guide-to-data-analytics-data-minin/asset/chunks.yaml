- raw: "By reviewing data sets associated with network behavior, companies can identify\
    \ mistakes and generate an alert. This basic technique can be deployed to work\
    \ for security applications. The applications help determine intrusion on a company\
    \ network as well as discover users who go against corporate policies and task\
    \ management. \n\nWith the presence of Machine Learning, both algorithms and models\
    \ can now be improved to reflect changes in staff behavior, and changes in technology\
    \ to help reduce the increasing number of unnecessary alerts that staff is called\
    \ to respond to. As with any other Data Science project, professionals in security\
    \ can only advance when they have the correct data. However, with the decreasing\
    \ cost of storing data and the ease of collecting data, businesses can find themselves\
    \ collecting a lot of information and holding to it as long as they want.\n\n\
    When it comes to security, a lot of data makes it hard to validate use in cases\
    \ for Data Science. Even though it is difficult to carry out predictive analytics,\
    \ Data Science for security trends must be more focused. When looking for patterns\
    \ and anomalies, it might be profitable to carry out on a smaller data sample.\
    \ But until now, how Data Science is used in information security remains a puzzle.\n\
    \n# Chapter 10: Mastering Your Data with Probability\n\nIt is hard to be a Data\
    \ Scientist without having knowledge of probability. All Data Scientist experts\
    \ have a good knowledge of probability and mathematics. \n\nIt is worthy to think\
    \ of probability as a means of validating the uncertainty linked with events selected\
    \ from a certain universe of events. Instead of mastering the technical terms\
    \ of probabilities, imagine rolling a dice. The universe is made up of all outcomes.\
    \ Any subset of the following results is an event. For example, “the die rolls\
    \ a four” or “the die rolls an odd number”.\n\nThe mathematical notation for probability\
    \ is P (E) to refer to “the probability of the event E”.\n\nThe probability theory\
    \ helps one to build models. In this chapter, you will learn how probability theory\
    \ is used to examine models. \n\nDependence and Independence\n\nBasically, two\
    \ events E and F are said to be dependent if by having knowledge about whether\
    \ E takes place generates information about whether F happens. If not, then it\
    \ is said to be independent.\n\nFor example, if you flip a two-sided coin twice\
    \ and the first flip is a Head, it does not mean that on the second flip you will\
    \ get a Head. In other words, these two events are independent. Conversely, if\
    \ by flipping the first event generates information to help us determine the outcome\
    \ of the second event, then both events are said to be dependent.\n\nIn mathematics,\
    \ events E and F are said to be independent if the probability that both take\
    \ place is the product of probabilities of each one happening. \n\nP (E, F) =\
    \ P (E) P (F)\n\nIn the example of tossing a coin, the probability of the first\
    \ flip is 0.5, and the probability of both flips is 0.25. However, as you can\
    \ imagine, if there’s two flips being made, the probability of the first toss\
    \ being a Head, and both flips being Tails is 0. \n\nConditional Probability\n\
    \nWhen two events E and F are independent, then it is defined as:\n\nP (E, F)\
    \ = P (E) P (F)\n\nIn case they aren’t independent, and the probability of F is\
    \ not zero, then the probability of E is said to be conditional on F: \n\nP (E/F)\
    \ = P (E, F) / P (F)\n\nThis can be paraphrased as the probability of E taking\
    \ place given that F happens.\n\nThis can be rewritten as:\n\nP (E, F) = P (E/\
    \ F) P (F)\n\nIf E and F are independent, then you can move on to confirm:\n\n\
    P (E / F) = P (E)\n\nThis is a mathematical expression which means that having\
    \ knowledge about the occurrence of F does not provide extra information about\
    \ the occurrence of E.\n\nA popular example to explain this concept is the family\
    \ with two unknown children. \n\nIf that is the assumption, then:\n\n1.   Every\
    \ child is equally likely to be a girl or boy. \n\n2.   The gender of the second\
    \ child does not depend on the gender of the first child.\n\nTherefore, the event\
    \ “no girls” will have the probability of 0.25, the event “one girl, one boy”\
    \ will have the probability of 0.5., and finally the event “two girls” will have\
    \ the probability 0.25. So you can move on and find out the probability of “both\
    \ children are girls” conditional on the event “the older child is a girl” by\
    \ application of the conditional probability. \n\nBayes’ Theorem \n\nIt is one\
    \ of the best theorems for Data Scientists. Bayes’ theorem involves reversing\
    \ conditional probabilities. Take for instance when you want to figure out the\
    \ probability of event E conditional on another event F happening. However, the\
    \ only information available is the probability of F conditional on E occurring.\
    \ \n\nThe Bayes’ theorem is usually used to show why Data Scientists are more\
    \ intelligent than doctors. For example, a specific disease affects 1 out of 10,000\
    \ people. Imagine that there is a test for this particular disease which displays\
    \ the correct result “diseased” in case you have the disease and “no diseased”\
    \ if you don’t have the disease 99% of the time.\n\nSo, what will a positive test\
    \ show? According to Bayes’s theorem, the probability that you have the disease,\
    \ conditional on testing positive, is 0.98%. As you can see, this is less than\
    \ 1% of the people who test positive. While Bayes’ theorem presents us with this\
    \ result, many doctors will approximate it as 2%. \n\nAnother way you can look\
    \ at this is by imagining a population made up of 1 million people. You might\
    \ expect 100 of them to have the disease and 99 out of those 100 people to test\
    \ positive. Conversely, you may expect 999,900 of them to be free of the disease,\
    \ while 9,999 to test positive. In other words, you will expect only 99 from (99\
    \ + 9999) positive testers to have the disease. \n\nRandom Variables\n\nA random\
    \ variable describes a variable whose positive value is associated with the probability\
    \ distribution. A simple random variable is equivalent to 1 if tossing a coin\
