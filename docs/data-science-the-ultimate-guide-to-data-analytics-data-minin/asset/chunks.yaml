    在这种情况下，黑客（Hacking）指的是在应用技术技能为问题定义智能解决方案时所表现出的创造力和智慧。


    黑客的能力非常重要，因为数据科学家利用技术来收集海量数据集并处理高级算法。这需要的是先进的工具，而不是 `Excel`。数据科学家必须开发快速解决方案，并将其与复杂的数据系统集成。与数据科学相关的主要的语言包括
    `SAS`、`Python` 和 `R`。其他语言还包括 `Julia` 和 `Java`。


    然而，仅仅掌握语言并不是关键。黑客应该能够以创造性的方式解决技术挑战，以便程序代码能够正常运行。


    此外，数据科学领域的黑客应该对算法有深彻的理解。他们可以拆解困难且混乱的问题，使其变得可以解决。这非常重要，因为数据科学家工作在一个复杂的算法环境中。因此，他们应该拥有强大的心态来理解复杂的数据。


    ## 数据科学家 – 好奇心与训练


    ### 心态

    大多数数据科学家的一个共同特征是他们思考得深，并且具有强烈的智力好奇心。数据科学要求人们具有好奇心。个人必须经常地提出新问题、发现新事物并学习新知识。


    事实上，驱动他们工作的不是金钱，而是利用创造力提出问题解决方案的能力，并频繁地投入到好奇之中。从数据中提取高维线索不仅仅是简单的观察。相反，这核心在于发现隐藏在表面之下的真相。数据科学家对他们所做充满感激和热情，并在接受挑战中获得巨大的满足感。


    ### 训练

    有一种普遍的误解，认为要成为认证数据科学家，必须拥有 `Ph.D.`（博士学位）。这种观点没有考虑到数据科学是一门多学科学科。


    ## 第二章：数据科学的艺术

    涉及到数据分析时，它并没有看起来那么简单。困难的原因之一是因为只有少数人掌握了数据分析的艺术。这意味着只有少数人能够解释它是如何实现的。


    惊讶的是，很多人每天都尝试分析数据，但大多数人的努力失败了。这是因为该领域的专家还没有花时间解释他们在分析数据时是如何思考的。


    数据科学是一门艺术。它不是人们可以教给计算机的概念。数据分析师使用不同的工具来完成任务，从`线性回归`到`分类树`不一。尽管计算机知道所有这些工具，但数据分析师的角色是找到一种方法，收集所有工具并将将其集成到数据中，以为一个问题开发正确的答案。


    然而，数据分析的过程还没有被很好地记录下来。虽然有很多关于`统计学`的书，但没有一本书试图解决如何创建一个真实世界的数据分析解决方案。另一方面，建立一个重要的框架涉及到使用抽象语言对数据分析的元素进行分类。在某些情况下，这种语言可能是数学。相反，分析的相同细节使得每项分析都变得复杂而有趣。


    ### 分析的循环

    你可能观察数据分析并认为它遵循一个线性的、一步步执行的过程，并有一个良好的结果。然而，数据分析是一种迭代且非线性的方法，由一系列本周运动描述。在这种方法中，每一步都会学习到信息，然后决定是重新执行并完善已经执行的下一步，还是继续进入下一步。


    在涉及到分析数据时，迭代过程被用于数据分析的所有步骤中。此外，由于不同软件中封装的算法，某些数据分析可能看起来是固定且线性的。


    因此，理解“数据分析”这一术语的含义非常重要。虽然数据研究涉及制定和实施收集数据的计划，但数据分析假设数据已经收集完毕。最重要的是，一项研究将涉及假设的创建、数据收集程序的设计、数据的收集以及对数据的解释。然而，由于数据分析假设数据应该已经收集好，这涉及到。


    数据分析的五项主要活动：


    1. 提出问题

    2. 探索数据

    3. 创建模型

    4. 解释数据

    5. 沟通结果


    这些活动在各种情况下都会发生。例如，在一天内完成，也可以在超过一个月的时间内完成。最重要的是，对于上述每项活动，建议包含以下步骤：


    1. 定义期望

    2. 收集信息并与数据进行对比

    3. 如果不符合期望，则修改或修复数据

    '
