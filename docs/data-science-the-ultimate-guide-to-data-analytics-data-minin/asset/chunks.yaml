    # Introduction


    Companies produce and gather data every minute. Everyone from data analysts to
    employees wants to pick up something from the different sets of data which can
    help a person make a better decision and work more effectively.


    No matter the size of the data you have, the best way to master important relationships
    is through complex analysis and an easy to understand visualization. No one wants
    to miss any critical correlation or develop the wrong conclusion that might heavily
    affect their decision making. When complex analysis is rapidly carried out, the
    outcome can be displayed in a way that is simple to use as well as allow exploration
    and queries. As a result, everybody in the organization has the chance to dig
    deep into data and develop insights for faster and effective decisions.


    To develop some significant visuals from data, there are standard things one needs
    to consider. Some of these things include data type, data size, and column composition.


    Data Scientists work with a large data set. One of the greatest challenges that
    they face is determining which method to use to show data. You may need to condense
    and collapse data. However, you will still need to display graphs and charts that
    most decision makers know. Don’t forget that in the current society, visualization
    is essential. Therefore, ensure that it is well-displayed in smartphones.


    At the same time, it is good to give people the freedom to interact with data
    in real time. For instance, `SAS Visual Analytics` supports several business customers
    to draw significant insights from data without having any Data Science skill.


    Intelligent and auto-charting tools facilitate the creation of the best visual
    based on the type of data highlighted. These tools will identify the relevant
    findings without asking users to write algorithms. Additionally, smart visualization
    will allow Data Scientists and analysts to build prototypes quickly and reduce
    the time spent on experiments.


    # Charting


    ## Line Charts


    Line charts reveal the existing relationship between variables. These charts also
    track the relationship between one variable and another one. If you have a lot
    of items and want to make some comparisons, then a line chart is the best approach
    to use. Why? It has stack lines that best draw comparisons of individual values
    for different variables.


    An individual may choose to apply a line chart when there is a variable change,
    or a variable has to be displayed, and rate-of-change of information is of value.
    It is important also to note that because in a line chart you have the data points,
    there is no need to choose a line chart. However, depending on the number of data
    points that you have, it will determine the type of visual to use. So, if you
    want to know whether to use a line chart or not, count the number of data points
    that need to be displayed.


    ## Bar Charts


    Bar charts are the best when you want to make comparisons between quantities of
    different groups. Values belonging to a particular category are shown using bars
    and then displayed as a vertical bar or horizontal bar.


    In case the values are distinct, it is easy to notice the difference in the bars
    by how they look to our eyes. However, if the values are very close or there are
    a large number of values to be displayed, it becomes hard to compare bars.


    To ensure that there is some visual difference, you can assign the bars different
    colors. The colors can reveal things such as status or range. If you decide to
    color the bars, it will look beautiful and smart. The different colors will allow
    viewers to see the differences between bars.


    There are different kinds of bar charts. For instance, the progressive bar chart
    shows how a measure of an original value can increase or decrease during a transaction.
    The first bar starts at the initial value, and each subsequent bar resumes from
    where the initial bar ends. This bar has a length and direction to indicate the
    magnitude and type of transaction.


    ## Scatter Plots


    A scatter plot is a two-dimensional plot which describes a shared difference of
    two data items. Each marker in a scatter plot is an observation. The position
    of the marker will reveal the value of each observation.


    You should use scatter plots when you want to create a relationship between `X`
    and `Y` variables. The variables are said to be correlated when there is a dependency,
    and every variable can affect another one. For example, there is a relationship
    between profit and revenue.


    The relationship could be that any time revenue increases, profit also increases.
    A scatter plot is the best tool to use to visualize relationships in data. Scatter
    plot allows a person to use statistical analysis by combining correlation and
    regression. Correlation is important to help an individual identify the extent
    of a statistical correlation between every variable in the plot. On the other
    hand, regression allows a person to define the relationship between variables
    in the plots.


    Once all data points have been plotted, you can move on to identify data points
    that have a specific relationship. Using a scatter plot, it will help you develop
    an idea of how you can spread out the data present in the distributions. It is
    recommended to use scatter plots when you have a lot of data points. However,
    if you have a small data set, a table could be effective to help display the information.


    ## Bubble Plots


    These are a type of scatter plot where markers are identified with bubbles. A
    bubble plot will reveal the relationship between three measurements. If you have
    two measurements, you can use plot axes to highlight. The third measure is defined
    with the help of a bubble.


    It is better to use a bubble plot when you have hundreds of data values. You can
    choose to apply color to illustrate extra measurements and animate the bubbles
    to demonstrate changes in the data. A geo bubble map is displayed on a geographic
    map. Each bubble is set up at a specific geographic location.


    ## Pie and Donut Charts


    There has been a huge discussion around pie and donut charts. Both help an individual
    to create comparisons between parts. But it is difficult to notice because the
    eyes of a human being cannot easily estimate areas and compare visual angles.
    So, if you decide to use a chart, you will find it hard to compare data that is
    similar in size.


    If you build a dashboard, you are advised to consider how a donut chart or pie
    chart works. The efficiency of a pie or donut chart is revealed by the amount
    of space that chart needs to size a report. Since these charts are round, most
    of them will require additional space.


    In general, there are many types of charts that one can pick to show and analyze
    data. The choice to use a chart depends on the number of measures that an individual
    would like to visualize.


    # How to Visualize Big Data


    Big Data presents specific problems when you want to visualize data because of
    the speed, size, and diversity of the data.


    The most common definition of Big Data consists of three important terms: velocity,
    volume, and variety. `SAS Visual Analytics` has a creative approach to handle
    issues to do with Big Data visualization. The use of in-memory capabilities integrates
    `SAS Analytics` to reveal new ways of representing and analyzing data.


    ## Dealing with Large Data Volumes


    Let’s face it: Data Scientists find it hard when they want to present the results
    of a data exploration and analysis. One could be forced to apply a new method
    of reviewing data and intuitively combine results. You might also be required
    to display the available results through a mobile device and support users who
    want to explore data in real time.

    '
