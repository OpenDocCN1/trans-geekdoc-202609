    - `DBSCAN` will begin with a starting point that is arbitrary, but which has not
    been visited. The neighborhood of this point will be extracted using a distance
    epsilon. This means that all of the points within the epsilon distance will be
    considered neighborhood points.

    - If there are enough points in this neighborhood, then the clustering process
    will start, and the current data point is known as the first point in your brand-new
    cluster.

    - If there are not enough points, that starting point is labeled as noise. Sometimes
    it can become a part of another cluster. However, either way, that point will
    be marked as visited.

    - For the first point in your new cluster, the points that are within the epsilon
    distance neighborhood are also going to become a part of that cluster. This procedure
    will be repeated for all of the new points that were added to the cluster group.

    - This process will be repeated until the points are all determined in the cluster.
    This ensures that all of the points have been visited and labeled as well.

    - When you are done with the current cluster, the system will go through and find
    an unvisited point to start processing. This will keep on happening until all
    the points are marked, and any that are unattached to a cluster are called noise.


    DBSCAN can give you many advantages over some of the other clustering algorithms.
    First, you do not need to have a specific number of clusters to make it happen.
    It can also identify the outliers as noise, so they don’t just get thrown in and
    mess up some of the results.


    The biggest negative that comes with using DBSCAN is that it won’t perform as
    well as some of the other algorithms when the clusters come in at varying density.
    This is because the setting of the distance threshold can make it difficult. This
    drawback will occur data is high-dimensional.


    ## Expectation-Maximization (EM) Clustering with the help of Gaussian Mixture
    Models (GMM)


    One of the major issues that you are going to run into when using k-means is that
    it is naïve when it uses mean value for the center of your cluster. This isn’t
    always the best way to do things and can make some mixed results. However, you
    will find that the Gaussian Mixture Models (`GMMs`) can give you some more flex
    flexibility. With `GMMs`, we can assume that the data points are Gaussian distributed.
    This helps because it is less restrictive.


    To help you find the parameters of the Gaussian for each cluster, or the mean
    and standard deviation, you will need to use an algorithm that is known as the
    Expectation Maximization or `EM`. To do this, you will need to follow these steps:


    - To begin, you will need to select how many clusters you would like and then
    randomly initialize the distribution parameters of Gaussian for the clusters.
    You can try to come up with a good estimate of this to help set up the initial
    parameters just by looking at your data if there isn’t too much of it.

    - Given the Gaussian distributions that you pick for each cluster, you would then
    want to compute the probability that each data point belongs to a particular cluster.
    When a point is close to the center, the more likely it is to be in that cluster.
    This makes a lot of sense if you assume that most of the data you are looking
    for will lie closest to the center of your cluster.

    - Based on this probability, you can compute a new set of parameters so that you
    are getting the maximum probabilities of data points in those clusters.

    - You can compute these new parameters with the help of a weighted sum of the
    positions of the data points. Here you are going to look at where the weights
    are and the probabilities of the data point belonging to that cluster.

    - This would keep on repeating until you get a convergence where the distributions
    are going to change much more, if at all, from one iteration to another one.


    Two main advantages come from using the `GMMs`. First, these are more flexible
    when it comes to the covariance of the cluster. This is because of the standard
    deviation parameter that allows the clusters to take on any type of ellipses shape
    rather than having to be in a circle.


    ## Agglomerative Hierarchical Clustering


    ![](images/00021.jpeg)


    When it comes to using algorithms that are hierarchical, they fall into two categories:
    bottom-up and top-down.


    The bottom-up algorithms are the ones that treat each data point as a single cluster
    but then will start merging pairs of these clusters. It will continue to do this
    until you end up with one cluster that will hold onto all of the data points.


    The hierarchy of clusters will look like a tree. The root of this tree will be
    the unique cluster that can gather all of the samples until you end up with just
    one sample.


    There are several steps needed for this clustering:


    - You are going to start out by taking each data point and treating it like it
    belongs to its own cluster. So, if you have 1,000 data points in the data set,
    then you would start out with 1,000 clusters.

    - From here, you are going to select a distance metric. This is there to help
    measure the distance between two clusters. You will use average linkage which
    will define the distance between two clusters to be the distance average between
    data points that are in the first cluster against those that are in the second
    cluster.

    - With each iteration that you go through, you will end up combining two clusters
    into one. The two clusters that end end up combining will be selected because
    they are the ones that have the `average linkage` that is the smallest. This means
    that they do not have a very large distance between each other and are very similar.
    This tells the program that they are similar and need to be combined.

    - You will continue repeating the steps above until you reach what is known as
    the root of the tree. This gives you a result where you have one cluster that
    will contain all of the data points. So, with the example above, you will start
    with 1,000 clusters and then end up with just one. even- You can use this to pick
    out how many clusters you would like. You would tell the program when you would
    like to stop – by saying when it should stop combining the clusters. Thus, instead
    of letting it go down to one, you would decide on five or whatever number you
    would like.


    Hierarchical clustering does not make it a requirement that you pick out how many
    clusters you would like to use. You can let it keep going until you end up with
    just one. However, you can go through and add in more clusters if you would like.
    This works out great if you are looking to separate out the demographics of who
    shop with you or if you already know how many of these groups you are going need
    from the beginning.


    In addition, this kind of algorithm is not going to be sensitive to the choice
    of the distance metric. They are all going to work equally well, while with the
    other algorithms, the choice of the distance metric will be pretty important.


    You will find that working with a hierarchical algorithm is often a good one to
    use when you have data that is hierarchical in structure, and you want to be able
    to recover that same thing. Other algorithms for clustering are not able to do
    this as well as this method. However, you should know that while there are many
    advantages to using hierarchical clustering, it is not as efficient as some of
    the other methods. It takes up more time compared to the other methods – so if
    you are short on time, this may not be the best one for you.

