    For instance, at the Massachusetts Institute of Technology (MIT), urban demos
    provided a means where one has to explore whether the concepts are culturally
    or socially acceptable before they were potentially profitable. By championing
    for initiatives that would result in social good and at the same time align people
    before profit, it helps enrich the analytical capacities with members that may
    not have participated in the commercial ventures.


    ## 4. Polymathy Before Expertise


    Data Science includes a multidisciplinary concept and cannot work in isolation.
    To ensure that you can collaborate with other parties, specialists must learn
    beyond their domain expertise. There are certain organizations which may fall
    into the trap that it is a must to have a `Ph.D.` to do Data Science. This is
    not true because this practice calls for one to have an enhanced sense of curiosity
    to help learn the language of other disciplines and an in-depth appetite for collaborative
    learning. These are some of the traits of a polymath that makes a team ready to
    interact with people with diverse roles in the organization from design, product
    management, communication, finance, and many more. Of late, terms such as `AI
    Designer` and `Product Scientist` have risen in the industry to emphasize the
    importance of connecting different disciplines with the scientific method. At
    the same time, specific views from interdisciplinary domains such as science,
    technology, data bias and algorithmic have become part of the major themes of
    Data Science.


    A generalized specialist will deliver an interdisciplinary knowledge that champions
    for creativity and a deeper understanding of what an organization or society needs.
    A team made up of generalized specialists present a better general perspective
    for complex, deep, and unconventional areas compared to a team of experts.


    # Chapter 4: Data Science Techniques


    No matter what your opinion is about the subject of Data Science, it is very hard
    to look down upon the role of data and the ability to analyze, gather and contextualize
    data.


    Not only that but with the development of Machine Learning technology and the
    emergence of fields such as `Deep Learning` that prove to be of importance to
    researchers, Data Scientists continue to enjoy innovations and technological developments.


    Although a strong coding skill is critical, Data Science includes software engineering
    concepts. Data Scientists should have a mixture of coding, critical class. `Bayes’
    theorem` is then used to estimate the probability of a response class. These models
    can either be linear or quadratic.


    ### Quadratic Discriminant Analysis

    This analysis contains an alternative choice. Similar to `QDA`, this analysis
    assumes that observations drawn from a class of `Y` come from the Gaussian distribution.
    Another assumption is that each class has a covariance matrix.


    ### Linear Discriminant Analysis

    This technique determines `discriminant scores` for each observation detected
    by linear combinations of independent variables. Here, it is also assumed that
    all observations recorded in each class come from a multivariate Gaussian distribution.


    ## 3. Subset Selection


    This method will search for a subset of `p` predictors similar to the response.
    Next, a model is created by taking the least number of squares of the subset features.


    ### The Best Subset Selection

    Here, a different regression `OLS` is applied for each possible combination of
    `p` predictors and an observation of the model fit. The algorithm has two stages:


    - Fit a model with `k` predictors.

    - Highlight a model using a cross-validated prediction.


    One should not forget to use validation error because `RSS` and `R²` increase
    monotonically as variables increase. The best way to use is to cross-validate
    and model using the highest `R²` and lowest `RSS` on determining the error estimates.


    ### Forward Stepwise Selection

    This technique considers a smaller subset of `p` predictors. It begins with a
    model without predictors and adds predictors to the model until that point when
    all predictors exist in the model.


    ### Backward Stepwise Selection

    This begins to work with predictors in the model and then removes the lowest predictor
    each time.


    ## 4. Shrinkage


    This is the best to use for models which all have predictors. However, estimate
    coefficients are reduced to zero depending on the least squares estimates. Shrinkage
    also reduces the variance. Depending on the type of method used, some coefficients
    can be approximated to zero. The most popular shrinking techniques are `lasso`
    and `ridge regression`.

