    # Part 1: Data Science

    ## What the Best Data Scientists Know About Data Analytics, Data Mining, Statistics,
    Machine Learning, and Big Data – That You Don''t

    ![](0001.jpeg)


    ### Introduction

    Data is an important resource. However, if you do not have the right means to
    process it, then there is not much that you can benefit from its value. Data Science
    is one of those multidisciplinary areas whose major focus is to derive value from
    data in all means. This book will explore the field of Data Science using data
    and its structure. In addition, it will describe high-level processes that one
    uses to change data into value.


    You know that Data Science is a process. However, this does not mean that it lacks
    creativity. In fact, when you move deep into the stages of processing data, right
    from munging data sources to Machine Learning and finally data visualization,
    you will start to see that complex steps are involved in working with raw data.


    The steps that one follows in transforming raw data into value also vary. For
    instance, in an explanatory analysis, you may have a cleaned data set that is
    ready to be imported into `R`, and you visualize the result but don’t deploy the
    model.


    Data comes in different forms, but at an advanced level, it exists in three major
    categories. Those categories are structured, semi-structured, and unstructured.
    Data Scientists are experts responsible for gathering, analyzing and interpreting
    large amounts of data to help businesses and organizations. Throughout all the
    chapters in this book, you are going to learn what the best Data Scientists know
    about Data Analytics, Machine learning, Big Data, Data Mining, and Statistics.
    Since Data Science is a multidisciplinary field, this book covers very critical
    concepts that you must know to become a Professional Data Scientist.


    ## Chapter 1: What is Data Science?

    The arrival of Big Data resulted in the expansion of storage space. As a result,
    storage became the biggest hurdle to most enterprises. Besides this, both organizations
    and enterprises are required to build a framework and develop a solution to store
    data. Therefore, `Hadoop` and other frameworks were developed to solve this problem.
    Once this issue was solved, the focus shifted to how data could be processed.
    When it comes to data processing, it is hard not to talk about Data Science. That
    is why it is important to understand what Data Science is and how it can add value
    to a business. This chapter will take you through the definition of Data Science
    and the role it plays in extracting important insights from complex data.


    ### Why is Data Science Important?

    Traditionally, data was structured in a small size. This means that there was
    no problem if you wanted to analyze data. Why? There were simple BI tools that
    you could use to analyze data. But modern data is unstructured and different from
    traditional data. Therefore, you need to have advanced methods of data analysis.
    The image below indicates that before the year 2020, more than 80% of the data
    will be unstructured.


    ![](0002.jpeg)


    This data comes from different sources such as text files, financial logs, sensors,
    multimedia forms, and instruments. Simple BI tools cannot be used to process this
    kind of data as a result of the massive nature of data. For this reason, complex
    and advanced analytical tools and processing algorithms are required. These types
    of tools help a Data Scientist analyze and draw important insights from data.

