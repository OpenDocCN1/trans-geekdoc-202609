    Big Data does not create new storage mechanisms and new data types, but it develops
    new analyses. This chapter will define Big Data analysis and review different
    ways that one can analyze Big Data to develop patterns and relationships. In addition,
    you will learn how to make informed predictions and derive business insight from
    a huge influx of information.


    It is important to note that Big Data is not an independent set of activities.
    Therefore, you require a cohesive set of solutions to help in Big Data analysis,
    collect data, and discover new insights to help make frequent decisions. Most
    organizations achieve their tasks by application of both commercial and open source
    components. Building an integrated architecture for Big Data analysis enables
    a person to perform different types of activities and transfer data among components.


    ## Big Data? How does it matter?


    Big Data describes data sets that have a size that surpass the normal function
    of database software tools such as storage, capturing, and analyzing.


    It refers to a collection of data sets that are very large and complex such that
    one cannot process using simple database management tools.


    ## Big Data Analytics


    The term `Big Data Analytics` has widely been used in the market today. In most
    cases, it is used together with other related concepts such as `Data Mining` and
    `Business Intelligence`. While all these terms refer to how data is analyzed,
    Big Data is not the same when several transactions, data volumes, and data sources
    become big and complex. In this situation, specific methods and technologies are
    required to extract insight from data.


    This leads to the general definition of Big Data which includes the three V: `Velocity`,
    `Variety`, and `Volume`.


    * `Volume`. Refers to a large data set.

    * `Variety`. Describes data that comes from different data sources. It is possible
    to have data that originates from external and internal data sources. The most
    important thing is that the data can be in any format. It can be log data or even
    structured data from database tables and semi-structured data such as `XML`.

    * `Velocity`. Describes large sizes of data from transactions featuring higher
    refresh rates in data streams that have a higher speed and time.


    From the above description, Big Data can be considered as a high-velocity, high-volume,
    and high variety information repository that require a cost-effective and innovative
    means of information processing. This process leads to improved insight, better
    decision making, and improved process automation.


    Up to this point, it should be obvious that Big Data is not just about how large
    the data is volume, but the data should also arrive at a fast speed and in a complicated
    form. In addition, it should arrive from different sources.


    Most important, it is good to highlight that there could be much value in attempting
    to define the elements that constitute Big Data. Every individual should know
    that the Big Data of today may not be the same as the Big Data of tomorrow because
    technologies keep changing. In short, it is relative.


    ## The Kind of Data We Are Talking About


    Organizations have a tradition of capturing transactional data. Besides that,
    organizations capture and store extra data from its operational environment at
    a fast speed. Some examples include:


    * `Text data`. This is one of the biggest and most popular types of Big Data.
    The goal is all about developing major facts from a text and using the facts as
    inputs to remaining analytic process.

    * `Web data`. The data from Web users such as searches, reading, page views, and
    purchasing can be captured. This can be used to improve performance in fields
    such as churn modeling, targeted advertisement, and customer segmentation.

    * `Smart grid and sensor data`. Nowadays, sensor data is recorded from oil pipes,
    cars, and windmill turbines. This data is collected in an extremely higher frequency.
    The sensor data generates in-depth information related to the performance of machinery
    and engines. It facilitates the diagnosis of problems and faster development of
    mitigation mechanisms.

    * `Time and location data`. The `GPS`, `WI-FI` connections, and mobile phones
    make time and location a good source of data. As a result, most organizations
    have come to understand the importance of monitoring the movements of their customers.
    The organizations embrace the need to know where their customers are at any given
    time. Another important thing is being able to look at time and location data
    at an aggregate level. While more individuals continue to open their location
    data and time, many good applications arise. Therefore, time and location data
    becomes one of the most privacy-sensitive Big Data types that must be treated
    with caution.

    * `Social network data`. Within the social network sites such as `Facebook`, `Instagram`,
    and `LinkedIn`, it is possible for one to perform link analysis and discover the
    network of a given user. Social network analysis can present insights into what
    type of advertisements can appeal to users. This is achieved by taking into consideration
    the interests of customers and their circle of friends.


    With many of these Big Data sources, the advantage doesn’t lie in the type of
    data source but the value that it can generate in combination with other data
    sources. It is the combination that is very important.


    ## The Difference between Big Data and the Traditional Data Sources


    There are several ways in which Big Data differs from traditional data sources.
    First, Big Data can be viewed as a new data source. The type of transactions carried
    out isn’t that different from transactions that would have been traditionally
    implemented. An organization can record `Web transactions`, but it will not be
    different from the transactions recorded a few years ago. The only difference
    comes to the behavior captured. The behavior may include browser behavior which
    then represents a form of new data.


    Secondly, one can also argue that the speed of data has increased to the point
    where it merits to be considered as a new data source. For instance, the power
    meter used to be manually read. Nowadays, there is a smart meter that can automatically
    read power after ten minutes. One can further argue that frequency has increased
    to the point where it supports a different in-depth level of analysis.


    Another difference between Big Data and traditional data is that there is an increase
    in semi-structured and unstructured data. The majority of the traditional sources
    fall in the structured realm. Structured data include receipts from the grocery
    store, data in the salary slip, accounting details on the spreadsheet, and any
    other thing that can be entered in a relational database. Each piece of information
    provided arrives in a specific format and particular order. This makes it very
    easy to handle.


    Unstructured sources of data include that which one doesn’t have any control over
    its format. Video data, text data, and audio data belong to this category. Unstructured
    data is very difficult to deal with because the meaning of bits and bytes is not
    predefined.


    In the midst of structured and unstructured data, there lies semi-structured data.
    This is the type of data that is irregular and incomplete. In addition, its structure
    changes rapidly and unpredictably. In general, it has a structure, but it does
    not fit a fixed schema. `Weblogs` is a great example of semi-structured data.

