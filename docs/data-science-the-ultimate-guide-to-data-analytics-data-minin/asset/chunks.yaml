    # 第一部分：数据科学

    ## 顶尖数据科学家关于数据分析、数据挖掘、统计学、机器学习和大数据的认知——而你还不知道的

    ![](img/0001.jpeg)


    ### 引言

    数据是一项重要的资源。然而，如果你没有正确的手段来处理它，那么你无法从其价值中获益多少。数据科学是跨学科领域之一，其核心目标是通过各种手段从数据中提取价值。本书将利用数据及其结构来探索数据科学领域。此外，它还将描述人们用于将数据转化为价值的高级流程。


    你知道数据科学是一个过程。但这并不意味着它缺乏创造力。事实上，当你深入处理数据的各个阶段时，从清洗数据源到机器学习，最后到数据可视化，你会发现处理原始数据涉及许多复杂的步骤。


    将原始数据转化为价值的步骤也各不相同。例如，在解释性分析中，你可能有一个已经清理好并准备导入 `R` 的数据集，你对结果进行了可视化但并没有部署模型。


    数据以不同的形式存在，但在高级阶段，它分为三大类。这些类别是结构化数据、半结构化和非结构化数据。数据科学家是专家，负责收集、分析和解释海量数据以帮助企业和机构。在本书的所有章节中，你将学习到顶尖数据科学家关于数据分析、机器学习、大数据、数据挖掘和统计学的知识。由于数据科学是一门跨学科领域，本书涵盖了你成为专业数据科学家所必须掌握的关键概念。


    ## 第一章：什么是数据科学？

    大数据的到来导致了存储空间的扩张。结果，存储成为大多数企业面临的最大障碍。此外，组织和企业都需要建立一个框架并开发解决方案来存储数据。因此，开发了 `Hadoop`
    等其他框架来解决这个问题。一旦这个问题解决，重点就转向了如何处理数据。谈到数据处理时，很难不提到数据科学。这就是为什么理解什么是数据科学以及它如何为业务增加价值非常重要。本章将带你了解数据科学的定义以及它在复杂数据中提取重要见解所起的作用。


    ### 为什么数据科学很重要？

    传统上，数据是结构化的且规模较小。这意味着如果你想分析数据，并没有困难。为什么？因为可以使用简单的 BI 工具来分析数据。但现代数据是非结构化的，与传统数据不同。因此，你需要先进的数据分析方法。下图所示，在
    2020 年之前，超过 80% 的数据将是非结构的。


    ![](img/0002.jpeg)


    这些数据来自不同的来源，例如文本文件、财务日志、传感器、多媒体格式和仪器。由于数据的海量特性，无法使用简单的 BI 工具处理这类数据。因此，需要复杂先进的分析工具和处理算法。这类工具帮助数据科学家分析数据并从中得出重要的见解。


    '
