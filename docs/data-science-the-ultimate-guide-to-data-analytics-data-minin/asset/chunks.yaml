    [![](images/00022.jpeg)](https://pixabay.com/en/chart-analytics-graph-bar-chart-cubes-cu-1585605/)


    The next topic is known as data modeling. The data science process is always going
    to provide you with some kind of model. This model is used to report to the management
    so that they can use it to make some new business decisions. Or it can be used
    to predict phenomena that could help save the company some money or maximize the
    opportunities they have with as little risk as possible. Data modeling can do
    all of this for a company, and we are going to take a closer look at what it is
    and how you can test the models.


    ## What is a model


    A model is a simplified representation of reality created to serve some purpose
    for the user and which will be based on certain data. The purpose can be several
    things but is usually there to preserve information that is relevant or to simplify
    the information even more.


    Other than the two things mentioned above, a model can also be used to forecast
    or predict what will happen in the future, based on the data the company has now,
    so that the company can make decisions ahead of time to help them increase profits,
    help customers, provide better products, or at least reduce their risks.


    When we are working on data science, these models are there to create a nice picture
    of the data. It makes the data easier to read so that it is easier to make good
    decisions from that data. The model is there to provide any explanations that
    are needed so that the managers can stay on track and avoid big issues. If it
    is used properly, it will help the business to avoid painful losses that they
    may have to deal with if they only relied on intuition to make their decisions.


    ## Examples of models


    There are a few different types of models that a data scientist can work with
    to get the results that they want. Some of the options include:


    ### Descriptive model


    These show some of the real-world events that are going on as well as the relationships
    between the factors that can cause these events. This model will be used by a
    business to help them target the right people when they are marketing and advertising.
    It will be generated by using statistics to help pick out the differences and
    the similarities between customer groups. It could help provide many insights
    based on the purchasing behavior, interests, and demographics (among other things)
    of the target group.


    ### Linear model


    This has a few different options based on the context and how the business would
    like to use it. It can sometimes be used for time series and regression models.
    A linear regression model, for example, is there to show the relationship between
    at least one independent variable and a scalar dependent variable.


    ### Predictive model


    This is a formula that is meant to estimate the unknown value of interest. This
    will come either in a logical statement or a mathematical formula and sometimes
    it is a combination of the two. These types of models will be created and then
    tested based on some historical data. A good example is a credit scoring estimate
    which would use your credit history to predict how likely it is that you would
    default on a future loan. Or an email service that filters out spam by receiving
    information from other users on what was reported as spam.


    ### Probabilistic model


    This incorporates random variables and probability distributions. The variable
    that you use here will represent any potential outcomes that can happen for an
    uncertain event. This will incorporate uncertainty right in the model and can
    help the business to look over things that are uncertain for them.


    ### Classification model


    This designates items in a collection to certain categories or classes that you
    can specify. It will aim to forecast the target class for items in the data with
    various properties of an item that is present in the data set. An example is to
    classify a loan applicant as either low, medium, or high credit risk. Alternatively,
    with your business, it could be used to classify a customer as an infrequent,
    frequent, or loyal customer for your company.


    ## Model evaluation techniques


    Now that we have looked at some of the most common models that you can use with
    data science, you will want to learn how to test them. You will test the models
    before you deploy them into the system or report them back to the management team.
    This will ensure that it will be applicable even outside of the data set which
    it was built upon. Some of the different model evaluation techniques that you
    can use for this include:


    * **Confidence interval**: This tests how reliable the statistical estimate is.
    When the test resulted in a wide confidence interval, this means that the model
    you are testing will be a poor one or that the data that was used was pretty noisy
    and messed with the data.

    * **Confusion matrix**: This tests the validity of your clustering algorithms.
    The higher the concentration of observations found in the diagonal of the confusion
    matrix, the more accuracy there is in that clustering algorithm.

    * **Gain and lift chart**: This measures how effective a predictive model is.
    The effectiveness will be calculated as a ratio between the results that were
    obtained with the model and the results that were obtained without the model.

    * **Kolmogorov-Smirnov chart**: This compares how close two different distributions
    are to one another. Out of these two distributions, one of them will be a theoretical
    model of these observations. The other one will be the non-parametric distribution
    that was computed from your observations.

    * **Chi-square**: This is similar to the test above, but is considered a parametric
    test.

    * **ROC curve**: This is a shorter version of what is known as the receiver operating
    characteristic curve. It is a plot on a graph that will test how probable it is
    that a false alarm will occur with your probability detection.

    * **Gini coefficient**: This measures statistical dispersion. It was originally
    intended to be used to see the inequality of the wealth distribution of a nation’s
    residents.

    * **Cross-validation**: This method assesses the performance of the model in the
    future. It can sometimes be used with model selection.

    * **Predictive power**: This is a synthetic metric that is used to choose which
    subset of features in a specific set of data.

    * **Root mean square error**: This is often used because it is good at telling
    you if there is goodness of fit. It can be used to test whether your model fits
    the indicators as recorded by your data.


    # Chapter 8: Data Visualization


    [![](images/00023.jpeg)](https://pixabay.com/en/document-paper-business-chart-3268750/)


    Data visualization is important. Even if the data is in a model or a structured
    format, the data in its basic form can sometimes be hard to make sense of or even
    turn into a visual representation. Even when it is complicated, the data scientist
    will at some point need to present their findings over to the management. The
    management will not need to have the same expertise about the process like a data
    scientist does, but they do need to be able to understand the information that
    they are presented with.


    It is up to the data scientist to go through and make sure that not only can organize
    the information that they have from the data, but they can present it in a way
    that the managers can look over and understand.

    '
