    \ this, it is important to think about it. For instance, if you are going to shop\
    \ with friends and you have to stop by an `ATM` to withdraw some money, you need\
    \ to decide on the amount of money that you want to withdraw. You need to have\
    \ some expectations of the price of the things you are going to buy. This could\
    \ be something that you have no problem with if you know the price of the products\
    \ you are going to buy. This is an example of prior knowledge. Another example\
    \ of prior knowledge would be to know the time that a specific restaurant closes.\
    \ Using that information, you can schedule your time and activities so that you\
    \ show up for dinner before it closes.\n\nYou can also find out additional information\
    \ from your friends that will help you come up with expectations or Google a restaurant\
    \ to learn more about their working hours. This procedure that you apply on prior\
    \ information to develop expectation or implement an analysis procedure is the\
    \ same used in every main activity of the analysis process.\n\n#### Information\
    \ Collection\nThis step requires one to collect information related to the question\
    \ or data. For questions, one collects information by doing a literature research\
    \ or finding out from experts. For the data, once you have developed some expectations\
    \ about what the result can be when the data is inspected, it is okay to go ahead\
    \ and carry out the operation. The results of this activity include data that\
    \ you need to collect and determine whether the collected data matches your expectations.\n\
    \n#### Comparison of Expectations\nOnce you have the data in your hands, the next\
    \ step is to compare your expectations to the data. Here, there are two possible\
    \ results:\n"
