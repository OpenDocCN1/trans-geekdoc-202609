- raw: "Big Data does not create new storage mechanisms and new data types, but it\
    \ develops new analyses. This chapter will define Big Data analysis and review\
    \ different ways that one can analyze Big Data to develop patterns and relationships.\
    \ In addition, you will learn how to make informed predictions and derive business\
    \ insight from a huge influx of information. \n\nIt is important to note that\
    \ Big Data is not an independent set of activities. Therefore, you require a cohesive\
    \ set of solutions to help in Big Data analysis, collect data, and discover new\
    \ insights to help make frequent decisions. Most organizations achieve their tasks\
    \ by application of both commercial and open source components. Building an integrated\
    \ architecture for Big Data analysis enables a person to perform different types\
    \ of activities and transfer data among components.\n\nBig Data? How does it matter?\n\
    \nBig Data describes data sets that have a size that surpass the normal function\
    \ of database software tools such as storage, capturing, and analyzing. \n\nIt\
    \ refers to a collection of data sets that are very large and complex such that\
    \ one cannot process using simple database management tools.\n\nBig Data Analytics\n\
    \nThe term Big Data Analytics has widely been used in the market today. In most\
    \ cases, it is used together with other related concepts such as Data Mining and\
    \ Business Intelligence. While all these terms refer to how data is analyzed,\
    \ Big Data is not the same when several transactions, data volumes, and data sources\
    \ become big and complex. In this situation, specific methods and technologies\
    \ are required to extract insight from data. \n\nThis leads to the general definition\
    \ of Big Data which includes the three V: Velocity, Variety, and Volume.\n\n*\
    \    Volume. Refers to a large data set.\n\n*    Variety. Describes data that\
    \ comes from different data sources. It is possible to have data that originates\
    \ from external and internal data sources. The most important thing is that the\
    \ data can be in any format. It can be log data or even structured data from database\
    \ tables and semi-structured data such as XML.\n\n*    Velocity. Describes large\
    \ sizes of data from transactions featuring higher refresh rates in data streams\
    \ that have a higher speed and time.\n\nFrom the above description, Big Data can\
    \ be considered as a high-velocity, high-volume, and high variety information\
    \ repository that require a cost-effective and innovative means of information\
    \ processing. This process leads to improved insight, better decision making,\
    \ and improved process automation. \n\nUp to this point, it should be obvious\
    \ that Big Data is not just about how large the data is volume, but the data should\
    \ also arrive at a fast speed and in a complicated form. In addition, it should\
    \ arrive from different sources.\n\nMost important, it is good to highlight that\
    \ there could be much value in attempting to define the elements that constitute\
    \ Big Data. Every individual should know that the Big Data of today may not be\
    \ the same as the Big Data of tomorrow because technologies keep changing. In\
    \ short, it is relative. \n\nThe Kind of Data We Are Talking About\n\nOrganizations\
    \ have a tradition of capturing transactional data. Besides that, organizations\
    \ capture and store extra data from its operational environment at a fast speed.\
    \ Some examples include:\n\n*    Text data. This is one of the biggest and most\
    \ popular types of Big Data. The goal is all about developing major facts from\
    \ a text and using the facts as inputs to remaining analytic process.\n\n*   \
    \ Web data. The data from Web users such as searches, reading, page views, and\
    \ purchasing can be captured. This can be used to improve performance in fields\
    \ such as churn modeling, targeted advertisement, and customer segmentation.\n\
    \n*    Smart grid and sensor data. Nowadays, sensor data is recorded from oil\
    \ pipes, cars, and windmill turbines. This data is collected in an extremely higher\
