- raw: "The equation that is there to explain the phenomenon, depending on the size\
    \ of the data that you are looking to model, could be obtained through either\
    \ automated or manual means depending on the what you would use the results for.\
    \ When it comes to the case of data science, the amount of data that the analysts\
    \ would use is often going to require them to go with software that can automate\
    \ the process. There is just too much data present to try and go through it all\
    \ manually, and it would take too long, and human error would cause something\
    \ to be missed. \n\nThe difference between exploring and explaining \n\nWhen it\
    \ comes to data science, there are two schools of thoughts that are taking the\
    \ lead. The first one is a group of those who believe that the use of data science\
    \ should be there to satisfy the curiosity of the user. They believe that going\
    \ through the data to find the different phenomena and patterns that are there\
    \ should be enough for the data scientists and they shouldn’t need to do anything\
    \ else with it. \n\nThere is also the second school of thought which believes\
    \ that this information should be used. It may not be enough just to see the information.\
    \ This group believes that the patterns and the phenomena that are found in the\
    \ data should be used by companies and organizations to create decisions. Whether\
    \ the company decides to do this manually or automatically doesn’t matter. \n\n\
    If you are using data science for business, it is likely that you are going to\
    \ fall in with the second group of thinkers. You will want to use the information\
    \ and patterns that you collect from your analysis of the data to make decisions\
    \ for the business. These decisions could be about how to serve your customers\
    \ better, what products to try out, and what important decisions to make in the\
    \ future. No matter what, you are using the information to help you make important\
    \ business decisions. \n\n# Chapter 2: How Big Data Works in Data Science\n\n\
    To get started with data science, you must first understand where the information\
    \ that you will be using comes from. Data science is not possible without any\
    \ data present – or else you wouldn’t have anything to analyze in the process.\
    \ Moreover, with the infrastructure that is provided by different technologies\
    \ – that process a lot of information efficiently – many companies are starting\
    \ to take advantage of sources like the internet to collect information. This\
    \ is where Big Data will come in. \n\nLet’s take a closer look at Big Data so\
    \ we can learn how it works in data science. \n\nThe definition of Big Data\n\n\
    To keep it simple, Big Data are data sets that are too complex or too large to\
    \ be captured and managed or processed in a bearable time by using tools that\
    \ are common. Using the relational database management system would not work because\
    \ there is too much information to process so it would take too long. \n\nBecause\
    \ there was not much software to help keep up with this, and companies still wanted\
    \ to be able to go through all that information to help make decisions, new database\
    \ platforms were created. These include such options as Hadoop and NoSQL. \n\n\
    When talking about Big Data, there are five unique data characteristics. The three\
    \ main ones include:\n\n*    Volume: This is the amount of data that is produced\
    \ or received by the company in a day. This would amount to terabytes. Because\
    \ of this, the volume of the Big Data will be so large that it must be stored\
    \ on several different servers. This can also present a big challenge because\
    \ it would take an unreasonable amount of time to analyze the data if it is done\
    \ manually. \n\n*    Velocity: The Big Data has to be available as close to real-time\
    \ as possible. The faster that the right people can get to the data, the better\
    \ advantage they will have to make good decisions for their business. The information\
    \ that you collected even an hour ago could end up losing its relevance by the\
    \ time you can do anything with it. \n\n*    Variety: Data needs to come from\
    \ many different formats or sources. You may be able to get Big Data from smartphone\
    \ GPS data, in-house devices, forums, social network trends, and even comments\
    \ on social networks. The variety that you get your data from will provide you\
    \ with a better data set. \n\nTypes of data\n\nThere are three main types of data:\
    \ structured, unstructured, and semi-structured. \n\nStructured data has a predetermined\
    \ format and length. The pieces of information that come with structured data\
    \ are ones that can be sorted, grouped, and organized quickly. A good example\
    \ of this is what you can find when looking at databases like Access and SQL.\
    \ \n\nUnstructured data is the kind that does not have a predetermined format.\
    \ It is hard for an individual to be efficient when going through the information.\
    \ They would need software and algorithms to go through the information efficiently.\
    \ Some examples of this would include documents, emails, social media posts, videos,\
    \ and photos. \n\nSemi-structured data is any data that will not fit into relational\
    \ databases or data tables, but it still contains some attributes and tags. This\
    \ type is often called self-describing data. This means that the structure will\
    \ have embedded itself in the data. Examples of this would be JavaScript Object\
    \ Notation and Extensible Markup Language, which are different data-driven mobile\
    \ applications. \n\nThe architecture of Big Data\n\nYou will find that when working\
    \ with Big Data, it will come in five layers. Let’s look at each layer and see\
    \ what they will mean for your data: \n\nLayer 0\n\nBig Data requires a physical\
    \ infrastructure that is redundant to handle the enormous requirements to compute\
    \ it. This infrastructure will be linked by a network to enable the sharing of\
    \ resources between the computers that hold the information, and it is there to\
    \ create backups of the information in case there is a computer failure along\
    \ the way. The performance, availability, scalability, flexibility, and the cost\
    \ of this infrastructure are all important, and you need to take them into account\
    \ before starting. \n\nLayer 1\n\nThere needs to be the right amount of security\
    \ to make sure that the data inside will stay safe. It is often necessary to use\
    \ high-grade encryption so that no one can mess with the integrity of the data.\
    \ Security measures need to also be in place so that you can detect threats to\
    \ the data, such as a data leak, and data loss should also be taken into account.\
    \ Access to the data and all the applications surrounding it need to be minimized\
    \ so that there are fewer risks from human error. \n\nLayer 2 \n\nThe infrastructure\
    \ needs to employ the storage of all types of data, including the three types\
    \ that were discussed earlier. There needs to also be some atomicity, consistency,\
