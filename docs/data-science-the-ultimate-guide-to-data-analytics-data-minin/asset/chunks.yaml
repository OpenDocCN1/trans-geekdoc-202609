    If you are going to make a visual for your boss or manager of a company based
    on the data that you find, you must make sure that they can read through it properly.
    If you don’t make a good visual, then all the work that you did is worthless.
    This chapter will take a look at data visualization and what you need to do to
    get started and make great visuals of the data you find.


    ## Perception and cognition


    Variations in orientation, color, length, and shape are things that the human
    mind can distinguish between. Even if you have a table that shows the trends in
    domestic and international sales of your product every month, you would want to
    consider using color or different shapes to show this information. The managers
    could look closely at it and probably figure it all out, but you want to make
    sure that it is as easy as possible for them to read through so you would make
    these changes.


    One way to do this is to have the international sales in red and the domestic
    sales in blue. This helps the observer to see what is going on with the trends
    of each in just a few seconds. They would then be able to look on your graph to
    see when the high and low months are for the sales, whether one is falling behind
    the other, and if any concerns are coming up.


    As a data scientist, it is not enough to just go through and look at the information
    and understand it yourself. You want to make sure that the view to the manager
    is easy to understand. This will not only make them appreciate your work a bit
    more but can ensure that they read through the information properly.


    To make sure that you take full advantage of the understanding through the perception
    of the brain, the data that you present should indicate the nature of the relationship
    between the different variables. It needs to show the quantities that you want
    accurately through different types of graphs just by looking at them. Moreover,
    it should also be designed in a way that an observer can easily compare the different
    quantities through things like colors or labeling.


    You need to use the best visual aid possible based on the data that you have.
    This will vary based on the information that you were looking through for the
    manager. And it should make it obvious how people should use any of the information
    that is on your visual aid. Overall, you want to make sure that any visualization
    of the data is easily judged based on its accuracy, efficiency, ease, and how
    the story of the information is delivered.


    ## Gestalt Principles of Perception


    In business, decisions need to be made as quickly as possible. The decision-makers
    do not want to spend a ton of time looking through the graph and hoping that they
    will be able to figure out the information. The reason that they hired a data
    scientist in the first place is so that they can get through information quickly
    and easily rather than sifting through it on their own.


    A good thing to follow, when you are trying to make graphs and other visuals that
    are easy to look through, is the Gestalt Principles of Perception. This was a
    result of a study that was done in 1912. It was done to figure out how people
    perceive organization, form, and pattern. Even today, the results of the study
    are still accurate.


    You will be able to use the basic principles from this idea to make it easier
    to visualize data from data science. The principles that you need to follow include:


    *   **Proximity**: Items that you put close together will be seen as one group.
    If you do not want them to be from the same group, then they need to be spaced
    apart.

    *   **Similarity**: Items that are the same shape or color will be seen as one
    group.

    *   **Enclosure**: Items that are inside of an illustration and bordered by a
    line or shape will be one group.

    *   **Closure**: Any open images or shapes can be seen as complete or regular,
    and that is how many people will see them.

    *   **Continuity**: Shapes or items that are brought into line with one another
    will be seen as one group.

    *   **Connection**: Items that are interconnected are seen as one group. Be careful
    how you arrange them to make sure you are grouping the right things.


    All of these can be important when you are learning how to group information inside
    of the graphs that you create. You want to make sure that things that are alike
    are grouped together, but you also have to make sure that you aren’t accidentally
    grouping things that shouldn’t be. When you are creating your graph, take a look
    at the six principles of perception above and see if you can use them to make
    your graph more visually appealing to the observer.


    ## How to use diagrams for visualization


    There are several different types of diagrams that you can use to showcase the
    information that you are presenting. The one that you use will depend on the information
    that you are showing and what will make it look the best. Some of the options
    that you have when it comes to diagrams include:


    *   **Line graph**: This visualizes the value of your variable over a period of
    time. This could be over a few days, months, or even years. The `x-axis` of this
    graph will represent how much time is covered in the graph, and the `y-axis` is
    responsible for showing off the amount or the value that you need.

    *   **Bar chart**: This is responsible for comparing values of different dependent
    variables in the same independent variable. Your dependent variables can be a
    variety of things, including the income of your company, production, performance,
    or how your salespeople or others in the business are doing. You can compare them
    to each other in the same company or even compare to industry averages.

    *   **Scatter plot**: This is responsible for visualizing the relationship between
    the variable (`x-axis`) and another variable (`y-axis`) within multiple periods
    of time. You can also work with a three-dimensional scatter plot to help showcase
    the information that you have. This one is created when you just add in a new
    variable on your `z-axis`. This can be very helpful when working in data science
    because it allows you to have more variables present.

    *   **Pie chart**: This visualizes the distribution of groups in a population.
    You could pull information to find out the age of your customers, and the pie
    chart would tell you what percentage of your customers fall into each age group.
    This could be done with many demographics for your customers – what products they
    like, and more – and will provide some valuable information.

    *   **Histogram**: This assesses the probability of distribution of a variable.
    This graph can do this by illustrating the frequencies of observation that will
    occur within a certain range of values.


    All of these graphs can be useful when it comes to putting together the information
    that you need to present after going through all of the data. Often the type of
    data that you find will determine which of these graphs is the best one for you.
    Make sure that whatever one you choose is easy to use, makes sense for the data,
    and will be easy to put together and look nice in your presentation.


    # Chapter 9: How to Use Data Science Right


    [![](images/00024.jpeg)](https://pixabay.com/en/monitor-binary-binary-system-computer-bi-1307227/)


    While there is a lot that you can do with data science, you must remember that
    it is mainly just a tool that you use in business. If you know how to use it properly
    and you make sure to stay efficient with it, data science can be a great tool
    that helps limit your risk and even make you more money. However, if you do not
    use it properly, it could easily cause a lot more harm to your business than it
    does good.

    '
  trans: '


    如果你要根据发现的数据为公司的老板或经理制作可视化图表，你必须确保他们能够顺畅阅读。如果你没有做出良好的可视化效果，那么你所做的一切都是徒劳的。本章将介绍数据可视化，以及为了入门并为你发现的数据制作出出色的可视化图表，你需要做什么。


    ## 感知与认知


    人类大脑能够区分方向、颜色、长度和形状的差异。即使你有一张显示了你产品每月国内和国际销售趋势的表格，你可能也会考虑使用颜色或不同的形状来展示这些信息。经理们可能会仔细观察并可能弄明白所有情况，但你希望确保他们阅读起来越容易越好，因此来进行这些更改。


    实现这一点的方法是将国际销售额设为红色，国内销售设为蓝色。这有助于观察者在几秒钟内看到每种趋势的状况。他们就可以查看你的图表，了解销售额的高低月份、其中一个是否落后于另一个，以及是否出现了任何问题。


    作为一名数据科学家，仅仅浏览信息并自己理解它们是不够的。你想要确保提供给经理的视图是易理解的。这不仅能让他们更欣赏你的工作，还能确保他们能够正确阅读这些信息。


    为了确保充分利用大脑感知的理解能力，你展示的数据应该指示不同变量之间关系的性质。它需要通过不同类型的图表，仅通过观察就能准确地显示你想要的数量。此外，它的设计方式还应该让观察者能够通过颜色或标签等元素轻松比较不同的数量。


    你需要根据所拥的数据使用最好的视觉辅助工具。这将取决于你为经理查看的信息。它应该让人们清楚地知道如何使用你视觉辅助工具上的任何信息。总而言之，你希望确保任何数据可视化都能根据其准确性、效率、易用性以及信息故事的传递方式被容易判断。


    ## 格式塔感知原理


    在商业中，决策需要尽可能地做出。决策者不希望花费大量时间查看图表，并希望他们能弄清楚信息。他们最初聘佣数据科学家的原因是为了让他们能够快速、方便地获取信息，而不是自己去筛选。


    当你尝试制作易于查看的图表和其他可视化效果时，一个值得遵循的好方法是格式塔感知原理（Gestalt Principles of Perception）。这是
    1912 年的一项研究结果，旨在弄人们如何感知组织、形式和模式。即使在今天，这项研究的结果仍然准确。


    你将能够利用这一思想中的基本原理，使数据科学数据的可视化变得更容易。你需要遵循的原理包括：


    *   **邻近性 (Proximity)**：你放在一起的各个项目会被视为一组。如果你不希望它们属于同一组，那么它们需要隔开距离。

    *   **相似性 (Similarity)**：形状相同或颜色相同的项目会被视为一组。

    *   **封闭性 (Enclosure)**：位于插图内部并由线条或形状界定的项目将是一组。

    *   **闭合性 (Closure)**：任何开放的图像或形状都可以被视为完整或规则，许多人正是这样看待它们的。

    *   **连续性 (Continuity)**：彼此对齐的形状或项目会被视为一组。

    *   **连接性 (Connection)**：相互连接的项目被视为一组。注意你的安排方式，以确保你对正确的内容进行了分组。


    当你学习如何在创建的图表对信息进行分组时，所有这些都可能是重要的。你想要确保相似的内容分在一起，但你必须确保不会无意中将不应该分组的内容分组。在创建图表时，查看上述六个感知原理，看看是否可以使用它们让你的图表对观察者更有视觉吸引力。


    ## 如何使用图表进行可视化


    有几种不同类型的图表可以用来展示你呈现的信息。你使用的类型取决于你展示的信息以及什么能让它看起来最好。在图表方面，你拥有的选项包括：


    *   **折线图 (Line graph)**：这可视化了变量在一段时间内的值。这可以跨越几天、几个月，甚至几年。此图表的 `x-axis` 代表图表涵盖的时间范围，而
    `y-axis` 负责显示你需要的数量或值。

    *   **柱状图 (Bar chart)**：负责比较相同自变量下不同因变量的值。你的因变量可以是各种事物，包括公司的收入、产量、绩效，或者你的销售人员或业务中其他人员的表现如何。你可以在同一家公司内将它们相互比较，甚至与行业平均水平进行比较。

    *   **散点图 (Scatter plot)**：负责可视化多个时间段内变量（`x-axis`）与另一个变量（`y-axis`）之间的关系。你也可以使用三维散点图来展示你拥的信息。当你在
    `z-axis` 上添加一个新变量时，就会创建这种图。这在数据科学工作中非常有帮助，因为它允许你呈现更多的变量。

    *   **饼图 (Pie chart)**：可视化了人口中组别的分布。你可以提取信息来查找客户的年龄，饼图会告诉你你的客户中每个年龄组的百分比。可以针对客户的许多个人口统计数据进行分析——他们喜欢什么产品等——并提供一些有价值的信息。

    *   **直方图 (Histogram)**：评估变量分布的概率。这种图表通过描绘在特定值范围内会发生的观测频率来实现这一点。


    在处理完所有数据后汇总你需要呈现的信息时，所有这些图表都是很有用的。通常，你发现的数据类型将决定哪种图表最适合你。确保无论你选择哪一种，都是易于使用的、对数据有意义的并且在你的演示中易于组合且看起来美观。


    # 第 9 章：如何正确使用数据科学


    ![](https://pixabay.com/en/monitor-binary-binary-system-computer-bi-1307227/)


    虽然数据科学可以做很多事情，但你必须记住它主要只是你的一种业务中使用一种工具。如果你知道如何正确使用它并确保保持高效，数据科学可以成为一个极好的工具，帮助你限制风险甚至让你赚更多钱。然而，如果你使用得不当，它对你业务造成的伤害可能远大于带来的益处。


    '
