    \ some of the best tips that you can use when you get started with data science.\
    \ \n\nUnderstand the business before starting to solve any problems\n\nWhile the\
    \ data scientist may be excited to get started, you have to understand what you\
    \ are looking for before you can do the work. Otherwise, you may use the wrong\
    \ method or algorithm, or you are going to just end up with a lot of information\
    \ that looks like a mess. It is best to understand the business before you take\
    \ up the project. If you already work for that company and you do this in-house,\
    \ then it shouldn’t be an issue. \n\nSome of the things that you should explore\
    \ about the business to help you out include:\n\n*    Customer level information:\
    \ You need to have some ideas about the customers the company has. This could\
    \ be a month on month customer attrition, a number of active customers, and more.\
    \ \n\n*    Business strategies: This would be a look at the way that the company\
    \ gets new customers and how they work to keep their valuable customers. \n\n\
    *    Product information: You also need to have some information on the product\
    \ or services that the company offers. You can ask how the customer will interact\
    \ with the products and how they earn money through the product. Learn as much\
    \ about the product as possible before starting. \n\nIf you can go through and\
    \ answer these questions, then you have a good start to working on the project.\
    \ \n\nFigure out the right evaluation method you should use\n\nThis is not meant\
    \ to be a difficult puzzle to solve for you as an analyst, but this is also a\
    \ trap that some will find themselves in. \n\nLet’s say that you are doing the\
    \ data science to come up with a targeting model for a new marketing campaign.\
    \ You need to know which model you are going to use to get the right information\
    \ out of your data set. \n\nThe best way to figure this out is to take a look\
    \ at the information that you have and figure out which method would be the best\
    \ for you. Some types of data are going to lend themselves better to one method\
    \ over another, and you will see this pretty quickly. Other times, you may have\
    \ to try a few of the methods to see which one gives you the best results, or\
    \ at least the results that look the least confusing. \n\nBreak out of the industry\
    \ silos to get alternate solutions\n\nAnalytics is being used in almost all business\
