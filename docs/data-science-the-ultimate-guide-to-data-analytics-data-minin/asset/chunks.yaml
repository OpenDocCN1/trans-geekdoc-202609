    To work with a vast size of data is not that easy; you may find it hard to understand,
    and as a result, it is advised to use better visualization tools. The auto-charting
    function built in SAS Visual Analytics reviews data based on the size and type
    of data. It is the best visualization tool to use. For that reason, business analytics
    and employees can easily use this tool to visualize data. It will help them create
    a hierarchy of data and explore data in a very interactive manner.


    The volume of data can be a problem because traditional architecture and software
    may not define a vast size of data promptly.


    Still, the most popular descriptive Statistics calculations can be complicated
    when handling Big Data. For instance, if a data set has a billion rows and you
    want to build a scatter plot that contains two measurements, it can be hard to
    see numerous data points. Similarly, the type of application that helps an individual
    visualize the data may fail to work. The only other solution that one can resort
    to is binning. Binning requires an individual to gather data from both axes so
    that they can visualize the Big Data in the most effective manner.


    A box plot describes a geographical display of five Statistics. The five Statistics
    consists of medial, lower quartile, upper quartile, maximum and minimum. All the
    above five Statistics are important when you want to create a summary to define
    the distribution of a set of data.


    Usually, box plots prove effective to Data Scientists because it identifies abnormal
    points called outliers. Generally, the percentage of outliers in data ranges between
    1-5%. For the traditional size data sets, this particular data proportion is not
    hard to notice. However, for those working with a vast data set, it can be very
    hard to identify.


    ## How to Visualize Semi-structured and Unstructured Data


    The difference in Big Data leads to several challenges. These challenges exist
    because both structured and semi-structured data requires visualization techniques.
    A word cloud visual can be applied to unstructured data to help indicate the frequency
    of words. This can either be low or high.


    In the SAS Visual Analytics, word clouds are important in the classification and
    creation of associations. The words are further classified into topics depending
    on the way the words are used.


    Data Scientists also use network diagram to visualize semi-structured data. The
    network diagrams examine relationships based on nodes that represent relationships
    between individuals. The networks in network diagram have nodes which represent
    points while ties represent lines.


    You can use network diagrams in different disciplines and applications. For example,
    businesses that analyze social networks discover interactions with customers.


    ## Chapter 6: Machine Learning for Data Science


    Machine Learning refers to an analytic data method that trains computers to perform
    something that comes naturally to both humans and animals. It is all about learning
    from experience. Machine Learning algorithms have computational methods to help
    an individual discover information from data without waiting for a predetermined
    equation. These algorithms dynamically improve the performance of data when the
    number of samples available for learning increases.


    ### Why is Machine Learning important?


    An increase in Big Data makes Machine Learning an essential method to solve problems
    such as:


    - Image processing and computer vision

    - Energy production for load forecasting

    - Computational finance for algorithmic trading and credit scoring

    - Natural language processing to help recognize a voice

    - Aerospace, automotive, and manufacturing for predictive maintenance


    Machine Learning algorithms identify natural patterns in data to draw insight
    and make smart decisions. It is used daily to make critical decisions in stock
    trading, medical diagnosis, and forecasting.


    Examples of Machine Learning application include media sites that analyze customer
    data before suggesting possible movies that a user can download or view. Additionally,
    retailers have to draw significant information in the manner in which customers
    buy products.


    ### When is it Right to Apply Machine Learning?


    When you are about to work on a complex task or issue, that is the perfect time
    to apply Machine Learning.


    ### The Real Deal about Machine Learning


    Machine learning has its limits. It is not possible to build intelligent machines
    such as in Star Trek and 2001: A Space Odyssey’s Hal 9000. But there are many
    examples of real-world processing applications where Machine Learning operates
    like a charm. Below are popular categories where Machine Learning is applied:


    #### Image Processing


    It requires one to analyze images and get data or perform certain transformations.
    Examples include:


    - Image Tagging. This is similar to Facebook where an algorithm can automatically
    identify your face or the face of your friends in a photo. Basically, a Machine
    Learning algorithm will learn from the photos that are manually tagged.

    - Optical Character Recognition. Once an algorithm learns how to change a scanned
    text document into a digital version, the algorithm must know how to change an
    image into a written character of the corresponding digital letter.


    #### Text Analysis


    This is the process in which information is classified or extracted from emails,
    documents, chats, and tweets. Popular examples include:


    - Sentiment Analysis. It is another application area of text classification. In
    this type of classification, an algorithm must know how to classify an opinion
    as neutral, positive or negative depending on the mood displayed by the writer.

    - Information Extraction. It involves learning to extract a given piece of information
    or data.

    - Spam filtering. It is one of the most widely used text classification application.
    Spam filters help classify an email as spam based on the content and subject.


    #### Data Mining


    This is a method used to determine predictions from data. The definition appears
    generic, but one can look at it as extracting important information from a massive
    table in a database. Every row would consist of training instances and a column
    feature. You could be interested in forecasting a new column in the table that
    relies on the rest of the columns. For instance:


    - Association Rules. Take the example of a supermarket or an e-commerce site.
    It is possible to determine customer purchasing habits by taking a look at the
    type of products bought together. This type of information can be useful for marketing
    purposes.

    - Anomaly Detection. Look for outliers. For instance, in the credit card fraud
    detection, you may identify the type of transactions and outliers from the normal
    purchasing pattern of a user.

    - Predictions. This involves prediction of a variable from the rest of the variables.
    For instance, you can predict the credit score of new customers in the bank by
    learning from the credit score and profiles of current customers.


    ### Steps in the Application of Machine Learning


    Every Machine Learning task is divided into several steps:


    1. **Choose the Machine Learning Approach**

    Before you can begin any steps, a Machine Learning problem must be expressed.
    Ask yourself what you want to find out? Do you want to categorize data, predict
    new values or group data based on some factors? Once you choose the type of Machine
    Learning task you want to perform, you can move on and select the model.


    2. **Collect Data**

    In this step, you can choose to write data on paper, store spreadsheets in an
    SQL database, and record text files. The data collected should be in an electronic
    format to make it easy to analyze.


    3. **Explore and Prepare Data**

    The effectiveness of a Machine Learning project is defined by the quality of data
    that it uses. It is recommended that 80% of the effort generated in ML be directed
    to data preparation. This step calls for a great deal of human intervention.

