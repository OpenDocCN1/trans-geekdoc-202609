    通过审查与网络行为相关的数据集，可以识别错误并生成警报。这种基础技术可以部署到安全应用程序中。这些应用程序有助于判断公司网络是否被入侵，并发现违反公司政策和任务管理的用户。


    随着机器学习的出现，算法和模型现在可以不断改进，以反映员工行为和技术的变化，帮助减少员工需要响应的不断增加的不必要警报。与任何其他数据科学项目一样，安全领域的专业人员只有在拥有正确数据的情况下才能进展。然而，随着数据存储成本的降低和数据收集的便利化，企业可能会发现自己正在收集大量信息，并根据意愿长期保留它们。


    当涉及到安全时，大量数据使得在数据科学案例中验证用途变得困难。尽管执行预测分析很困难，但安全领域的数据科学趋势必须更加集中。在寻找模式和异常时，在较小的数据样本上进行操作可能会更有利。但直到为止，数据科学在信息安全中的应用仍然是一个谜团。


    # 第 10 章：利用概率掌握你的数据


    如果没有概率知识，很难成为数据科学家。所有数据科学家专家都对概率和数学有良好的了解。


    将概率视为一种验证手段是值得的，它用于验证从特定事件空间中选择的事件相关的不确定性。与其掌握概率的专业术语，不如想象掷骰子。样本空间由所有结果组成。以下结果的任何子集都是一个事件。例如，“骰子掷出了
    4”或“骰子掷出了奇数”。


    概率的数学符号是 `P (E)`，表示“事件 E 的概率”。


    概率论有助于人们建立模型。在本章中，你将学习如何使用概率论来检查模型。


    ## 相关性与独立性


    基本上，两个事件 `E` 和 `F` 被认为是相关的的，如果通过了解 `E` 是否发生会产生关于 `F` 是否发生的信息。如果不是，则认为它是独立的。


    例如，如果你投掷两次双面硬币，第一次投掷是正面，并不意味着第二次投掷你会得到正面。换句话说，这两个事件是独立的。反之，如果通过投掷第一个事件产生的信息可以帮助我们确定第二个事件的结果，那么这两个事件就被认为是相关的的。


    在数学中，如果两个事件同时发生的概率是它们各自发生概率的乘积，则称事件 `E` 和 `F` 是独立的。


    ```

    P (E, F) = P (E) P (F)

    ```


    在掷硬币的示例中，第一次投掷的概率是 `0.5`，两次投掷的概率是 `0.25`。然而，正如你可以想象的，如果进行了两次投掷，第一次掷为正面且两次均为反面的概率为
    `0`。


    ## 条件概率


    当两个事件 `E` 和 `F` 独立时，则定义为：


    ```

    P (E, F) = P (E) P (F)

    ```


    如果它们不独立，且 `F` 的概率不为零，则 `E` 的概率被称为关于 `F` 的条件概率：


    ```

    P (E/F) = P (E, F) / P (F)

    ```


    这可以表述为在 `F` 发生的情况下 `E` 发生的概率。


    这可以重写为：


    ```

    P (E, F) = P (E/ F) P (F)

    ```


    如果 `E` 和 `F` 是独立的，你可以确认：


    ```

    P (E / F) = P (E)

    ```


    这是一个数学表达式，意味着了解 `F` 发生的情况不会提供关于 `E` 发生的额外信息。


    解释这一概念的流行例子是一个有两个未知小孩的家庭。


    如果是这个假设，那么：


    1. 每个孩子是女孩或男孩的概率相等。

    2. 第二个孩子的性别不依赖于第一个孩子的性别。


    因此，“没有女孩”的事件概率将为 `0.25`，“一女一男”的事件概率为 `0.5`，最后，“两个女孩”的事件概率将为 `0.25`。因此，你可以通过应用条件概率，找出在“大孩子是女孩”这一事件的条件条件下，“两个孩子都是女孩”的概率。


    ## 贝斯定理


    这是对数据科学家来说最好的定理之一。贝斯定理涉及条件概率的反转。例如，当你想要计算在另一个事件 `F` 发生的情况下事件 `E` 的概率时。然而，唯一可获得的信息是在
    `E` 发生的情况下 `F` 的概率。


    贝斯定理通常用于解释为什么数据科学家比医生更智能。例如，某种疾病影响 10,000 人中的 1 人。假设有一种针对这种特定疾病的测试，在你患病时它显示正确的结果“患病”，在你没有患病时它显示“未患病”的概率为
    `99%`。


    那么，阳性测试结果会显示什么？根据贝斯定理，在测试结果呈阳性的情况下，你患病的概率是 `0.98%`。你可以看到，这少于检测性人数的 `1%`。虽然贝斯定理给了我们这个结果，但许多医生会近似为
    `2%`。


    另一种观察此的方法是想象一个由 100 万人组成的群体。你可能预计其中 100 人患病，9999 人呈阳性。反之，你可能预计其中 999,900 人没有疾病，而
    9,999 人呈阳性。换句话说，你预计只有 9999 个阳性检测者患病。


    ## 随机变量


    随机变量描述了一个正值与概率分布相关的变量。一个简单的随机变量等于：掷硬币显示正面为 `1`，显示反面为 `0`。一个更高级的变量可以记录掷十次硬币时记录正面的次数。


    有一个叫做随机变量期望值的方面，你很快就会学到。这是其值按其概率加权后的平均值。掷硬币变量的期望值为 `1/2`，范围 `(10)` 变量包含 `4.5`
    的期望值。


    ## 连续分布


    掷硬币等同于离散分布。在这种情况下，正概率与离散结果相关。通常，个人可能想要对跨连续结果的结果进行建模。例如，均匀分布在 `0` 和 `1` 之间的所有数字上分配相等的。


    ## 正态分布


    这是所有分布之王。它是经典的钟形曲线分布，由两个参数决定：均值和标准差。均值将显示钟形中心的位置，而标准差则说明了它的宽度。


    '
