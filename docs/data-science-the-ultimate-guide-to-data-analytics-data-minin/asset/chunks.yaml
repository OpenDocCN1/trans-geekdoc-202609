    \ but they are not really there to help aid in the decision-making process. \n\
    \nO’Neill and Schutt\n\nAnother model that you can use is the O’Neil and Schutt\
    \ model. With this one, data is collected from various sources in the environment.\
    \ This could include a platform that the users of interest can interact with,\
    \ a website, or another type of database. The data that is collected from this\
    \ source is processed to produce a clean data set, and then it will usually be\
    \ presented in a data table. This data set will be used for a few things such\
    \ as statistical modeling and data analysis. \n\nThe result of this analysis is\
    \ then going to produce either a new data set or a new type of data that you would\
    \ then be able to process for another data set. Both of these are used to complete\
    \ further statistical modeling. The result here is that they could be a data product\
    \ that will be sent back to the environment or it is a report that could be used\
    \ to make decisions in the company. \n\nExploratory data analysis\n\nThis approach\
    \ analyzes data sets to summarize them out into their main characteristics. This\
    \ may be presented as a visual aid or in some other manner. For the most part,\
    \ this analysis is used to visualize what the data can present beyond hypothesis\
    \ testing and formal modeling tasks. In some cases, the results that you get could\
    \ be used to help with statistical models. We will spend more time covering these\
    \ in a later chapter. \n\nStatistical modeling\n\nAnother thing that we need to\
    \ discuss concerning data science is statistical modeling. This is a model that\
    \ will approximate a real-world phenomenon, and then it can sometimes predict\
    \ from that approximation using some simple mathematical equations. Depending\
    \ on where you decide to apply this kind of modeling, the equation could be shown\
    \ as a simple linear regression, or it could be as complicated as a multivariate\
    \ factor analysis. "
