    \ comes from the data mining process, but you must think it through and combine\
    \ your knowledge and expertise to get the best results. \n\nOf course, this is\
    \ not to say that the management needs to be data scientists to understand the\
    \ information and to use it. It just means that the managers of an organization\
    \ at least need to know some of the basics to appreciate the different opportunities\
    \ that it will provide. You do not want to waste the valuable resources that data\
    \ science can provide simply because you don’t understand how it works or what\
    \ all it can do for you and your company. \n\nAs a manager, there are a few things\
    \ that you should be able to do, even if you are not a data scientist. You should\
