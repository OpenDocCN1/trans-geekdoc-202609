    \ inputs and transfers them using axons to the next network output.\n\nIn the\
    \ above simple neural network, dendrites refer to input features (x1, X2) and\
    \ the output is the result of the hypothesis hw,b(x). Apart from the input features,\
    \ the input layer of the neural network contains a bias unit that is equivalent\
    \ to 1. A bias unit is required to apply a constant term in the function hypothesis.\n\
    \nIn machine learning, the above network contains a single input layer, a hidden\
    \ layer, and one output layer. To implement the learning process for this network,\
    \ the input layer accepts input features for every training sample and feeds it\
    \ to the activation function which computes the hypothesis in the hidden layer.\n\
    \nAn activation function is a logistic regression applied in classification. However,\
    \ other options are also possible. In the above case, a single neuron is similar\
    \ to the input-output mapping defined by a logistic regression. \n\n![](images/00012.jpeg)\n\
    \nMulti-layered Neural Network\n\nTo understand how neural network operates, it\
    \ is important to formalize the model and explain it in a real-world scenario.\
    \ The image below represents a multilayer network that has three layers and various\
    \ neurons. In this case, just like a single-neuron network, there is one input\
    \ layer that has three inputs (x1, x2, x3) that has an added bias unit (+1). The\
    \ second network layer is a hidden layer that has three units represented by activation\
    \ functions. This is called a hidden layer because the values that are computed\
    \ in it aren’t observed. Basically, a neural network contains multiple hidden\
    \ layers that pass advanced computations and functions from surface layers to\
    \ the bottom of the neural network. The design of a neural network that has a\
    \ lot of hidden layers is constantly used in Deep Learning. \n\n![](images/00013.jpeg)\n\
    \nThe hidden layer 2 has three neurons (a12, a22, a32). Each neuron of a hidden\
    \ layer activates layer j. In this case, a unit a1 activates the first neuron\
    \ of the second layer. Activation means that the value that is computed by function\
    \ activation in this layer is output by the same node to the next layer. \n\n\
    Layer 3 is the output layer that receives results from the hidden layer and applies\
    \ its own activation function. This layer calculates the final value of the hypothesis.\
    \ Next, the cycle continues until that point when the neural network comes up\
    \ with the model and weights which best predict the values of the training data.\n\
    \n# Chapter 13: Data Science Modeling and Featurization\n\nData modeling is an\
    \ important aspect of Data Science. It is one of the most rewarding processes\
    \ that receive the most attention among learners of Data Science. However, things\
    \ aren’t the same as they might look because there is so much to it rather than\
    \ applying a function to a given class of package.\n\nThe biggest part of Data\
    \ Science is assessing a model to make sure that it is strong and reliable. In\
    \ addition, Data Science modeling is highly associated with building information\
    \ feature set. It involves different processes which make sure that the data at\
    \ hand is harnessed in the best way. \n\nRobust Data Model\n\nRobust data models\
    \ are important in creating the production. First, they must have better performance\
    \ depending on different metrics. Usually, a single metric can mislead the way\
    \ a model performs because there are many aspects in the classification problems.\n\
    \nSensitivity analysis describes another important aspect of Data Science modeling.\
    \ This is something that is important for testing a model to make sure it is strong.\
    \ Sensitivity refers to a condition which the output of a model is meant to change\
    \ considerably if the input changes slightly. This is very undesirable because\
    \ it must be checked since the robust model is stable.\n\nLastly, interpretability\
    \ is an essential aspect even though it is not always possible. This is usually\
    \ related to how easy one can interpret the results of a model. But most modern\
    \ models resemble black boxes. This makes it hard for one to interpret them. Besides\
    \ that, it is better to go for an interpretable model because you might need to\
    \ defend the output from others.\n\nHow Featurization Is Achieved\n\nFor a model\
    \ to work best, it must require information that has a rich set of features. The\
    \ latter is developed in different ways. Whichever the case, cleaning the data\
    \ is a must. This calls for fixing issues with the data points, filling missing\
    \ values where it is possible and in some situations removing noisy elements.\
    \ \n\nBefore the variables are used in a model, you must perform normalization\
    \ on them. This is achieved using a linear transformation on making sure that\
    \ the variable values rotate around a given range. Usually, normalization is enough\
    \ for one to turn variables into features once they are cleaned.\n\nBinning is\
    \ another process which facilitates featurization. It involves building nominal\
    \ variables which can further be broken down into different binary features applied\
    \ in a data model.\n\nLastly, some reduction methods are important in building\
    \ a feature set. This involves building a linear combination of features that\
    \ display the same information in fewer dimensions. \n\nImportant Considerations\n\
    \nBesides the basic attributes of Data Science modeling, there are other important\
    \ things that a Data Scientist must know to create something valuable. Things\
    \ such as in-depth testing using specialized sampling, sensitivity analysis, and\
    \ different aspects of the model performance to improve a given performance aspect\
    \ belong to Data Science modeling. \n\nThe Future of Data Science and Predictive\
    \ Modeling\n\nThere’s no question on how predictive analytics is important. The\
    \ new algorithm-based discipline has empowered us to deliver insights on the probability\
    \ of a given outcome. \n\nUse cases of Data Science and predictive modeling appear\
    \ like trip-planning tools to help customers define locations, dates, hotel needs,\
    \ and other factors which impact travel details. These products represent an evolution\
    \ toward a user-friendly Data Science tool that can change a customer into a Data\
    \ Scientist.\n\nFrom Predictive to Prescriptive\n\nData Scientists are shifting\
    \ toward a practical application of prescriptive instead of predictive modeling.\
    \ While the latter applies historical data to predict the probability of future\
    \ events, the former makes an assumption that an active human agent is capable\
    \ of affecting outcomes.\n\nQuick definitions\n\n•    Descriptive analytics: This\
    \ represents the first stage of business analytics where you look at historical\
    \ data and performance.\n\n•    Prescriptive analytics: This represents the third\
    \ stage of business analytics where one determines the best course of action to\
    \ take.\n\n•    Predictive analytics: This is the second stage of business analytics\
    \ where you choose the best course of action. "
