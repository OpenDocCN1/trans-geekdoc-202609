    \ of items that reveal the most baskets. \n\nMarket basket analysis was previously\
    \ applied in supermarket and chain stores. These stores track down the contents\
    \ of each market basket that a customer brings to the checkout. Items represent\
    \ products sold by the store while baskets are a set of items found in a single\
    \ basket. \n\nThat said, this same model can be applied in many different data\
    \ types such as:\n\n• Similar concepts. Let items represent words and baskets\
    \ documents. Therefore, a document or basket has words or items available in the\
