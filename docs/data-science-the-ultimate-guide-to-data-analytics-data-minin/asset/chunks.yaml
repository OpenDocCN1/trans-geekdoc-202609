    # 简介


    公司每分钟都会产生并收集数据。从数据分析师到员工，每个人都希望从不同的数据集中获取一些信息，帮助人们做出更好的决策并更高效地工作。


    无论你拥有的数据规模有多大，掌握重要关系的最佳方法是通过复杂的分析和易于理解的可视化。没有人希望遗漏任何关键的相关性，或得出可能严重影响其决策的错误结论。当快速进行复杂分析时，结果可以用一种易于使用的方式显示，并允许探索和查询。因此，组织中的每个人都有机会深入挖掘数据并开发洞察，以做出更快、更有效的决策。


    要从数据中开发出显著的可视化效果，有一些需要考虑的标准内容。其中一些内容包括数据类型、数据大小和列组成。


    数据科学家处理大型数据集。他们面临的最大挑战之一是决定使用什么方法来展示数据。你可能需要对数据进行压缩和折。然而，你仍然需要显示大多数决策者熟悉的图形和图表。不要忘记在当今社会中，可视化是至关重要的。因此，确保它在手机上良好显示。


    同时，让人们能够与数据进行实时交互也是很好的。例如，`SAS Visual Analytics` 支持多个业务客户在没有任何任何数据科学技能的情况下，从数据中得出显著的洞察。


    智能和自动图表工具有助于根据突出显示的数据类型创建最佳的可视化效果。这些工具将识别相关的发现，而不需要用户编写算法。此外，智能可视化将允许数据科学家和分析师快速构建原型，并减少在实验上花费的时间。


    # 图表


    ## 折线图


    折线图揭示了变量之间存在的关系。这些图还追踪一个变量与另一个变量之间的关系。如果你有很多项目并想进行一些比较，那么折线图是最好的方法。为什么呢？它有堆叠线，能够最好地比较不同变量的个体值。


    当变量发生变化或必须显示变量，且信息的变更率具有价值时，个人可能会选择应用折线图。同样重要的是，因为在折线图中数据点，所以并不需要选择折线图。然而，取决于你拥有的数据点数量，它将决定要使用的可视化类型。所以，如果你想知道是否应该使用折线图，请计算需要显示的数据点的数量。


    ## 柱状图


    当你想要比较不同组之间的数量时，柱状图是最好的。属于特定类别的值通过柱体显示，然后显示为垂直柱或水平柱。


    在值是不同的的情况下，很容易通过我们眼睛观察柱体的外观来注意到它们之间的差异。然而，如果值非常接近，或者有大量值需要显示，比较柱体就会变得困难。


    为了确保存在某些视觉差异，你可以为柱体分配不同的颜色。颜色可以揭示如状态或范围等信息。如果你决定给柱体上色，它看起来既漂亮又智能。不同的颜色将允许观众看到柱体之间的差异。


    柱状图有不同的种类。例如，渐进柱状图显示了原始值的衡量标准在交易期间如何增加或减少。第一个柱体从初始值开始，每个后续柱体从初始柱体结束的地方继续。这个柱具有长度和方向，用来指示交易的规模和类型。


    ## 散点图


    散点图是一种描述两个数据项共同差异的二维图表。散点图中的每个标记都是一个观测值。标记的位置将揭示每个观测值的值。


    当你想要在 `X` 和 `Y` 变量之间建立关系时，应该使用散点图。当存在依赖关系且每个变量都可以影响另一个变量时，这些变量被认为是相关的。例如，利润和收入之间存在关系。当收入增加时，利润也会增加。散点图是使用以可视化关系的最佳工具。散点图允许人员通过关联和回归来进行统计分析。在图中定义变量的关系时，关联是重要的。另一方面，回归允许人员识别数据中的特定关系。


    一旦所有数据点都绘制完成，就可以根据特定关系来开发数据。使用散点图可以帮助你查看分布。当你有大量数据点时，建议使用散点图。然而，如果你有一个较小的数据，表格可能是有效的。


    ## 气泡图


    气泡图是散点图的一种，其中标记用气泡标识。气泡图将揭示三个测量值之间的关系。如果你有两个测量值，可以使用坐标轴来突出。第三个测量值通过气泡定义。


    当你有数百个值时，最好使用气泡图。你可以选择应用颜色来说明测量值，并对气泡演示数据的变化。地理气泡地图显示在地图上。每个气泡都设置在特定的地理位置。


    ## 饼图和环形图


    饼图和环形图一直存在巨大的讨论。两者都帮助个人创建部分之间的比较。但是很难注意到，因为人类的眼睛无法容易估计面积和比较角度。所以，如果你决定使用图表，你会发现很难比较大小相似的数据。


    如果你构建仪表板，建议考虑环形图或饼图的工作原理。饼图或环形图的效率由图表尺寸报告所需的空间揭示。由于这些图表是圆形的，大多数都需要额外的空间。


