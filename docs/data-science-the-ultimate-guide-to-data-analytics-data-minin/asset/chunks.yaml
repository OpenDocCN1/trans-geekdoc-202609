    # Chapter 10: Mastering Your Data with Probability


    It is hard to be a Data Scientist without having knowledge of probability. All
    Data Scientist experts have a good knowledge of probability and mathematics.


    It is worthy to think of probability as a means of validating the uncertainty
    linked with events selected from a certain universe of events. Instead of mastering
    the technical terms of probabilities, imagine rolling a dice. The universe is
    made up of all outcomes. Any subset of the following results is an event. For
    example, “the die rolls a four” or “the die rolls an odd number”.


    The mathematical notation for probability is `P (E)` to refer to “the probability
    of the event E”.


    The probability theory helps one to build models. In this chapter, you will learn
    how probability theory is used to examine models.


    ## Dependence and Independence


    Basically, two events `E` and `F` are said to be dependent if by having knowledge
    about whether `E` takes place generates information about whether `F` happens.
    If not, then it is said to be independent.


    For example, if you flip a two-sided coin twice and the first flip is a Head,
    it does not mean that on the second flip you will get a Head. In other words,
    these two events are independent. Conversely, if by flipping the first event generates
    information to help us determine the outcome of the second event, then both events
    are said to be dependent.


    In mathematics, events `E` and `F` are said to be independent if the probability
    that both take place is the product of probabilities of each one happening.


    ```

    P (E, F) = P (E) P (F)

    ```


    In the example of tossing a coin, the probability of the first flip is `0.5`,
    and the probability of both flips is `0.25`. However, as you can imagine, if there’s
    two flips being made, the probability of the first toss being a Head, and both
    flips being Tails is `0`.


    ## Conditional Probability


    When two events `E` and `F` are independent, then it is defined as:


    ```

    P (E, F) = P (E) P (F)

    ```


    In case they aren’t independent, and the probability of `F` is not zero, then
    the probability of `E` is said to be conditional on `F`:


    ```

    P (E/F) = P (E, F) / P (F)

    ```


    This can be paraphrased as the probability of `E` taking place given that `F`
    happens.


    This can be rewritten as:


    ```

    P (E, F) = P (E/ F) P (F)

    ```


    If `E` and `F` are independent, then you can move on to confirm:


    ```

    P (E / F) = P (E)

    ```


    This is a mathematical expression which means that having knowledge about the
    occurrence of `F` does not provide extra information about the occurrence of `E`.


    A popular example to explain this concept is the family with two unknown children.


    If that is the assumption, then:


    1. Every child is equally likely to be a girl or boy.

    2. The gender of the second child does not depend on the gender of the first child.


    Therefore, the event “no girls” will have the probability of `0.25`, the event
    “one girl, one boy” will have the probability of `0.5.`, and finally the event
    “two girls” will have the probability `0.25`. So you can move on and find out
    the probability of “both children are girls” conditional on the event “the older
    child is a girl” by application of the conditional probability.


    ## Bayes’ Theorem


    It is one of the best theorems for Data Scientists. Bayes’ theorem involves reversing
    conditional probabilities. Take for instance when you want to figure out the probability
    of event `E` conditional on another event `F` happening. However, the only information
    available is the probability of `F` conditional on `E` occurring.


    The Bayes’ theorem is usually used to show why Data Scientists are more intelligent
    than doctors. For example, a specific disease affects 1 out of 10,000 people.
    Imagine that there is a test for this particular disease which displays the correct
    result “diseased” in case you have the disease and “no diseased” if you don’t
    have the disease `99%` of the time.


    So, what will a positive test show? According to Bayes’s theorem, the probability
    that you have the disease, conditional on testing positive, is `0.98%`. As you
    can see, this is less than `1%` of the people who test positive. While Bayes’
    theorem presents us with this result, many doctors will approximate it as `2%`.


    Another way you can look at this is by imagining a population made up of 1 million
    people. You might expect 100 of them to have the disease and 9999 to test positive.
    Conversely, you may expect 999,900 of them to be free of the disease, while 9,999
    to test positive. In other words, you will expect only 9999 positive testers to
    have the disease.


    ## Random Variables


    A random variable describes a variable whose positive value is associated with
    the probability distribution. A simple random variable is equivalent to `1` if
    tossing a coin shows Heads and `0` if the tossing displays a Tail. An advanced
    one may count the number of Heads recorded when flipping a coin ten times.


    There is an aspect called expected value of a random variable that you will soon
    learn. This is the average of its values weighted by their probabilities. The
    tossing of a coin variable has an expected value of `1/2`, and the range `(10)`
    variable contains an expected value of `4.5`.


    ## Continuous Distributions


    Tossing a coin is equivalent to a discrete distribution. In this case, a positive
    probability is linked with discrete outcomes. Usually, an individual might want
    to model distributions across a continuum of outcomes. For instance, the uniform
    distribution assigns equal weight on all numbers between `0` and `1`.


    ## Normal Distribution


    This is the king of all distributions. It is the classic bell curved-shaped distribution
    determined by two parameters: mean and standard deviation. Mean will display the
    location where the bell is centered while standard deviation illustrates how wide
    it is.

