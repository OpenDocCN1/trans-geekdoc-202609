  trans: '


    人们很容易被数据科学可能带来的各种可能性所吸引。但如果你的企业负担不起这项费用，或者你只是在没有正确经验或知识的情况下尝试使用它，那么你最终会为企业带来大量资金损失。避免这种情况的最佳方法是确保数据科学团队和管理团队在此过程中意识到一些关键点。


    ### 管理层需要了解的


    为了从企业拥有的海数据以及互联网信息中获取最大价值，管理层必须以分析性的思维思考数据。如果管理层无法做到这一点，他们将完全依赖数据挖掘的结果，而不会独立思考。数据挖掘过程会产生大量信息，但你必须进行深思，并结合你的知识和专业能力才能获得最佳结果。


    当然，这并不是说管理层需要成为数据科学家才能理解并使用这些信息。这意味着组织的管理人员至少需要了解一些基础知识，以欣赏它将提供的不同机会。你不希望仅仅因为不理解它的工作原理或不知道它能为你和你的公司做什么，就浪费了数据科学提供的宝贵资源。


    作为一名经理，即使你不是数据科学家，也应该能够做到几件事。你应该能够欣赏这些信息提供的所有机会，确保数据科学团队拥有完成工作所需的资源，并愿意投入时间和金钱以便进行数据实验。最后，你必须能够与你的团队合作，确保他们保持正轨，并帮助你获取有助于推动业务发展的信息。


    ### 数据科学如何提供竞争优势


    数据科学只要使用得当，就能为企业在市场中带来巨大的竞争优势。要比竞争对手领先，你必须确保自己始终领先他们一到两步。这可以通过愿意并采取投资新的数据资产，以及开发新的能力和技术来实现。它还要求你不仅要把这些投资和结果视为资产，还要以同样的方式对待你的数据科学团队和数据科学领域。


    拥有最好的数据科学团队，你将能够获得帮助业务迈向未来所需的有用洞察。有许多企业仅仅依靠经验和知识来帮助自己。如果你已经在该行业呆了很久，你可能会过得很好。但大多数初次进入某个行业的人最终会因这种方式而失败。


    然而，即使你进展顺利，数据科学也可以为你提供一些实用的信息，并开启你过去可能没有想过的新门。


    # 第 10 章：数据科学技巧


    当你想要改进业务时，开始学习数据科学是一个极好的主意，但你希望确保自己做出的决策是明智的——而不是盲目跳跃而不知道自己在做什么。拥有一些技巧可以让过程变得更容易，并对你看到的结果产生巨大影响。


    让我们来看看在开始接触数据科学时可以使用的一些最佳技巧。


    ### 在开始解决任何问题之前先了解业务


    虽然数据科学家可能对开始感到兴奋，但在开始工作之前，你必须理解你在寻找什么。否则，你可能会使用错误的方法或算法，或者最终只得到一堆看起来混乱无章的信息。最好是在接手项目之前了解业务。如果你已经在该公司工作并在内部完成这项任务，那么这应该不是一个问题。


    为了帮助你，你应该对业务探索的一些内容包括：


    *   **客户层级信息**：你对对公司拥有的客户有一些了解。这可能包括月度客户流失率、活跃客户数量等。

    *   **业务策略**：这将是对对公司获取新客户的方式以及他们如何留住价值客户的观察。

    *   **产品信息**：你还需要一些关于公司提供的产品或服务的信息。你可以询问客户将如何与产品互动，以及他们如何通过产品盈利。在开始之前尽可能多了解产品。


    如果你能梳理并回答这些问题，那么你就为开展项目打下了良好的基础。


    ### 确定你应该使用的正确评估方法


    对于分析师来说，这并不是一个难以解决的难题，但这也是某些人会掉进去的陷阱。


    假设你正在通过数据科学为一项新的营销活动建立目标模型。你需要知道将使用哪种模型来从你的数据集中提取正确的信息。


    确定这一点的最佳方法是查看你拥有的信息，并判断哪方法对你最好。某些类型的数据更适合某种方法，你会很快发现这一点。其他情况下，你可能需要尝试几种方法，看看哪种能给你最好的结果，或者至少是看起来最混乱的结果。


    ### 突破行业孤岛以获取替代方案


    分析已用于几乎所有的业务行业。因此，与其留在你特定业务中的传统方法，为什么不跨越一步，看看其他行业是否找到了你正在寻找的解决方案呢？


    一个很好的例子是电子商务行业实施的视频推荐解决方案，它可以在你做博客门户时使用。然而，这一任务的唯一方法是与另一个行业工作的人互动。这可以帮助你学习如何实现它，并从他们身上学习。


    如果你只是坐在自己的行业里尝试完成任务，你可能会看到一些成功，但你错过了一些极佳的机会。我们的世界变化很快，许多行业以不同的方式使用相同的技术。学习这些行业如何使用数据科学最终可以帮助你自己的业务，即使它们之间并没有真正的关联。


    ### 与你的业务伙伴互动


    你不应该独立完成整个分析。这会导致你错过很多重要事情。你必须与其他的业务伙伴互动，讨论他们正在寻找什么、关于他们业务的一些重要事情等等。在整个过程中，你应该确保与他们保持联系。


    有时这很难。当你为某个业务进行分析时，他们往往希望远离技术细节，因为他们担心这些细节太复杂了。他们只想在最后收到结果，然后对其进行处理并做出决策。然而，如果你想尽可能做出最好的分析，你必须与你服务的人之间保持持续的互动。这有助于你在整个过程中保持正轨，找到正确的信息，甚至发现一些如果你独立完成整个项目时可能会错过的模式。


    ### 保持语言简单


