    \ investing it in the company. \n\nThe context of data\n\nIt is important that\
    \ while you can get a lot of information out of Big Data, having access to it\
    \ is not necessarily enough to gain a competitive advantage through data science.\
    \ Context is just as important, as it gives meaning to what the whole data is\
