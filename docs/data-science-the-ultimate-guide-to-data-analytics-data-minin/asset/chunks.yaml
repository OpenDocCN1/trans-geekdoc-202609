- raw: "It is necessary for an individual to work with Big Data rather than traditional\
    \ data. If you read a lot of content that seems to hype Big Data, it is easy to\
    \ think that simply because Big Data has a high volume, variety, and velocity,\
    \ it is actually better than data. Well, this is not the case. The power of Big\
    \ Data lies in the analysis and actions you take after the results of the analysis\
    \ are out. Big Data by itself does not have any value. It is critical when you\
    \ receive some insight about the data. And this kind of insight can be used to\
    \ make a decision.\n\nThe Different Types of Insight\n\nBesides data, there is\
    \ something called paradigm shift based on the analytic focus. This refers to\
    \ a change from descriptive analytics to predictive and prescriptive analytics.\
    \ When it comes to descriptive analytics, it attempts to respond to questions\
    \ about what happened in the past. Typically, this is all about reporting. Below\
    \ are some examples of questions that are dealt with in descriptive analytics:\n\
    \n*    Which is the most profitable customer or product?\n\n*    What amount of\
    \ sales revenue was generated in the first quarter of the year?\n\n*    How many\
    \ customers did we lose or win in the first half-year?\n\n*    How many customers\
    \ did we win as a result of the promotional campaigns?\n\nPredictive analytics\
    \ focuses on something that may happen next. This is very difficult, and it involves\
    \ extending trends and patterns of the future. Examples of questions include:\n\
    \n*    What is the approximated number of a call center in the next quarter?\n\
    \n*    What is the next best offer for this customer?\n\n*    Which customers\
    \ are likely to churn?\n\nThe prescriptive analysis attempts to respond to questions\
    \ related to “how can I handle this?” This is the point when analytics becomes\
    \ operational. It is entirely business and case dependent. Some of the examples\
    \ to demonstrate the point include:\n\n*    Knowing that an individual has a higher\
    \ chance to churn, so he or she is presented with a value package.\n\n*    Determining\
    \ the viewing history of a customer on the Web, then suggesting articles that\
    \ the customer can read next.\n\nAll the above examples existed before Big Data.\
    \ However, the major focus was entirely on reporting. But with the arrival of\
    \ Big Data, it is now possible to:\n\n*    Derive a forward-looking insight.\n\
    \n*    Increase the appetite and ability for quick and actionable insight. \n\n\
    A forward-looking insight means that a business could predict what may happen\
    \ next. Traditionally, this was possible, but the accuracy was very limited. \n\
    \nTherefore, Big Data changed this equation. A fast and actionable insight meant\
    \ that no matter what is derived from the data analysis, it has to have an effect\
    \ on the business process and the embedded process. \n\nFor instance, a recommendation\
    \ system can automatically generate personalized recommendations like the way\
    \ Amazon recommends one to buy a different thing from what another person wants\
    \ to buy because of the difference in viewing history. This doesn’t mean that\
    \ descriptive analytics is not that important. In fact, reporting will continue\
    \ to be an important element in business life. In practice, it is advised that\
    \ an individual should be flexible and apply different analytics – what will deliver\
    \ the best results depends on the nature of the questions created and picking\
    \ the correct tool for the right job. \n\nBusiness Value of Big Data Analytics\n\
    \nBig Data delivers a significant benefit to any business. It helps draw insights\
    \ from data, make smart decisions depending on the insight, and automate decisions.\n\
    \nIn a detailed level, every Big Data solution addresses a specific problem that\
    \ exists in organizations. As a result, when developing a business case that should\
    \ be applied in a Big Data Analytics project, one should begin with a business\
    \ problem instead of technology or data. Choosing to collect data or buy a given\
    \ technology without having a clear business target is a wrong strategy. \n\n\
    The New Web: Visual, Semantic and API-POWERED\n\nSince the introduction of the\
    \ new Web, the Web has greatly changed. The Web as of today has become even more\
    \ visual.\n\nTo upload a photo on the Web is just a click of a button. But this\
    \ was not the case 20 years ago. If you can go back to the 1990s and think about\
    \ how computers and the internet were then, you will realize how much effort has\
    \ been made to improve and redefine technology. \n\nLinked Data and Semantic Web\n\
    \nIt is not just that data has increased in size alone, but also the Web grows,\
    \ and data silos continue to reduce. Data has also continued to be interconnected.\
    \ As of today, we are not close to connecting all the data. Most data sets cannot\
    \ be easily connected to each other. However, major steps have been achieved now.\
    \ The Web has continued to become more semantic.\n\nLinked data refers to the\
    \ practice of sharing, exposing, and integrating pieces of data, knowledge, and\
    \ information on the same semantic Web. Both computing devices and human beings\
    \ gain when data that is unconnected is connected. This is normally done through\
    \ Web technologies such as uniform resource identifiers and Resource Description\
    \ Framework. \n\nThe Ease of Accessing Data\n\nYes, there is a lot of data, more\
    \ than what you can imagine, and most organizations have a challenge when it comes\
    \ to drawing important insight from the data. Luckily, all hope is not lost. The\
    \ available data management tools in organizations have never been so good and\
    \ effective than today. \n\nBefore the internet era, many large organizations\
    \ transferred their data from many different databases, systems, and data warehouses.\
    \ Database experts and administrators created scripts and stored procedures which\
    \ automated most of these processes. Batch procedures would run early in the morning.\
    \ \n\nBetter Efficiency in the Clouds\n\nIt is true that Web cloud is causing\
    \ a big impact in many organizations across the globe. The history of the Web\
    \ started as the mainframe era before it went to the client-server era, and now\
    \ we are in the mobile-cloud computing era. To move from one era to another called\
    \ for a lot of developments and effort – this doesn’t happen overnight. \n\nThe\
    \ dawn of Big Data and Open Data created a lot of opportunities and room for organizations\
    \ to enhance their operations. As a result, there has been a huge improvement\
    \ in Business Intelligence solutions and statistical packages. \n\nLevel of Measurement\n\
    \nA decision tree can accommodate both quantitative and qualitative data. Quantitative\
    \ data consists of weight and height. It describes quantities that one can modify\
    \ using arithmetic operations such as subtraction, multiplication, and addition.\
    \ On the other hand, qualitative may consist of gender and cannot be applied in\
    \ arithmetic operations, but it is presented in decision trees. \n\nOther types\
    \ of data such as shoe size may both be quantitative and qualitative. For instance,\
    \ you may fail to perform a meaningful arithmetic with shoe size although the\
    \ number sequence in shoe size is in order. \n\n# Chapter 8: Data Science Tools\
    \ Towards Data Science\n\nThere are a lot of Big Data tools that one can use for\
    \ analysis. In simple terms, data analysis is defined as a process of inspecting,\
    \ cleaning, transforming and modeling data with the sole reason to discover important\
    \ information, conclusions and suggest the right decision. This chapter will outline\
    \ to you the best tools which Data Scientists use in the process of cleaning,\
    \ modeling, transforming, and analyzing data. \n\nOpen Source Data Tools\n\n1.\
    \   OpenRefine\n\nThis was formally called Google Refine. It is a great tool to\
    \ use to work with data that is disorganized. This tool lets a Data Scientist\
    \ clean and change the format of data. Additionally, a Data Scientist can decide\
    \ to integrate the data with external data. The tool helps an individual perform\
    \ large-scale data exploration and discover patterns in data easily.\n\n2.   Orange"
