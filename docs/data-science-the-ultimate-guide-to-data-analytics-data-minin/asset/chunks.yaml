- raw: "Most of the security data does not have labels, and this makes it even difficult\
    \ to use Deep Learning networks in a large number of information security cases.\
    \ \n\nBut the industry has chosen to deal with this problem by producing class\
    \ labels. For instance, detection of malware and ranking of DNS domains is completely\
    \ done by application of Machine Learning techniques. \n\nAnother way these cases\
    \ are applied in security Data Science is in the development of a baseline for\
    \ every network, then making comparisons to discover anomalies. \n\nMajor Data\
    \ Sources and Use Cases \n\nThe information security has an extensive number of\
    \ logs. Both the volume of data and variety depends on the organization’s size\
    \ and domain. Below is a list of a typical data source for information security:\n\
    \nEndpoints: Applications, processes, host-based IDS alerts, registry changes,\
    \ operating system logs, file system changes, and anti-virus alerts.\n\nThreat\
    \ Intelligence: These indicate whether a system is compromised. \n\nVulnerability\
    \ Logs\n\nNetwork: Network packets and flows, network topology, firewall logs,\
    \ DNS logs, Bro logs, and HTTP proxy logs.\n\nAsset Management Logs\n\nMajority\
    \ of the above logs show visibility related to the adversary’s presence and activities.\
    \ \n\nThe Evolution of Security Data Science \n\nThe security Data Science has\
    \ undergone the evolution of three phases:\n\n1.   Rule-based and Detection of\
    \ An Anomaly By Systems\n\nData Science has been playing an important role, especially\
    \ in information security. This started with rule-based techniques that helped\
    \ an individual discover strange activities in the intrusion detection system\
    \ and prevention. \n\nRules are defined and set up by security experts. In case\
    \ of an intrusion, an alert is sent out. For instance, if an attacker tries to\
    \ break into a system and reaches the maximum count of attempts, an alert is sent\
    \ out to the security experts. \n\nThese anomaly detection systems usually depend\
    \ on the normal behavior of network and hosts. This means that when something\
    \ extends beyond the normal behavior, an alert is generated. Fortunately, there\
    \ are anomaly detection algorithms to detect any unusual activity. \n\nAnomaly-based\
    \ algorithms are built on networks to facilitate:\n\n*    Hosts and users that\
    \ have abnormal behavior\n\n*    Excessive DNS failures\n\n*    Anomalous ports\n\
    \n*    Unusual traffic from a host\n\nHowever, many of the AD systems generated\
    \ false alarms and call for security analysts to confirm the alerts.\n\n2.   Security\
    \ Data Lakes\n\nIt is important to transfer an alert and combine multiple data\
    \ sources in the security data lake.\n\n3.   Malware Detection\n\nBig Data frameworks\
    \ have a new security Data Science technique. This makes it possible to use row\
    \ logs in real time and generates alerts. As a result, new user and entity behavior\
    \ have been created to leverage on Spark and detection of an anomaly. So far,\
    \ enterprises can quickly notice when there is an inside attack because of the\
    \ new solutions invented. However, there are still some issues with the same means\
    \ to detect an anomaly. \n\nAnother area that has increasingly gained attention\
    \ is the endpoint security where there is Deep Learning applied in the detection\
    \ and classification of malware. Supervised ML algorithms are applied in the classification\
    \ of malicious scripts, detection of DNS tunnels, malware detection, application\
    \ of attacks, and a lot of known threats that include labels present in the training\
    \ system.\n\n4.   Deception-triggered Data Science\n\nIn the modern world, a new\
    \ paradigm shift for information security field has evolved. In the security defense,\
    \ deception is applied first in the entire enterprise network. Next, Data Science\
    \ is used to profile the behavior of an adversary and their actions in the network.\
    \ \n\nDeception triggered Data Science is not the same with normal data security\
