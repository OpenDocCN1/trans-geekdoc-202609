    个人有必要处理大数据而非传统数据。如果你读了许多似乎在炒作大数据的内容，很容易认为仅仅因为大数据具有高容量、多样性和高速度，它实际上就比数据更好。然而，事实并非如此。大数据的威力在于分析结果出来后你所采取的分析和行动。`Big
    Data` 本身没有任何价值。只有当你获得关于数据的某些洞察时，它才是至关重要的。这种洞察可以用来做出决策。


    # 洞察的不同类型


    除了数据之外，根据分析重点的不同，还有一种被称为范式转移的概念。这指的是从描述性分析向预测性分析和规范性分析的转变。涉及到描述性分析时，它试图回答关于过去发生了什么的问题。通常，这都是与报告有关。以下是描述性分析处理的一些问题示例：


    * 哪个客户或产品利润最高？

    * 一年第一季度产生了多少销售收入？

    * 我们在上半年流失或赢得了多少客户？

    * 由于促销活动，我们赢得了多少客户？


    预测性分析侧重于接下来可能发生的事情。这非常困难，涉及到对未来趋势和模式的延伸。问题示例包括：


    * 下个季度呼叫中心的预计人数是多少？

    * 为该客户提供的下一个最佳优惠是什么？

    * 哪些客户可能会流失？


    规范性分析试图回答与“我该如何处理这个问题？”相关的问题。这是分析变得业务化的点。它完全取决于业务和案例。说明这一点的一些示例包括：


    * 得知某人流失概率较高，因此向他/她提供了一个价值包。

    * 确定客户在网页上的观看历史，然后建议客户接下来可以阅读的文章。


    上述所有示例在大数据时代就已经存在。然而，当时的重点完全在于报告。但随着 `Big Data` 的到来，现在可以：


    * 获得前瞻性的洞察。

    * 增加对快速且可操作的洞察的需求和能力。


    前瞻性的洞察意味着企业可以预测接下来可能发生什么。传统上这是可能的，但准确性非常有限。


    因此，`Big Data` 改变了这个方程式。快速且可操作的洞察意味着无论从数据分析中得出什么，它必须对业务流程和嵌入流程产生影响。


    例如，推荐系统可以自动生成个性化推荐，就像 Amazon 根据观看历史的差异，推荐用户购买与他人想要购买的不同物品。这并不意味着描述性分析不重要。事实上，报告将继续是业务生活中一个重要的组成部分。在实践中，建议个人应该灵活并应用不同的分析——什么能带来最佳结果取决于所提问题的性质以及为正确的工作选择正确的工具。


    # 大数据分析的业务价值


    `Big Data` 为任何企业带来了巨大的益处。它帮助从数据中提取洞察，根据洞察做出明智决策并实现决策自动化。


    在详细层，每个 `Big Data` 解决方案都解决组织中存在的特定问题。因此，在开发一个业务案例时……（根据输入文本已截断）

