    \nThe arrival of Big Data resulted in the expansion of storage space. As a result,\
    \ storage became the biggest hurdle to most enterprises. Besides this, both organizations\
    \ and enterprises are required to build a framework and develop a solution to\
    \ store data. Therefore, Hadoop and other frameworks were developed to solve this\
    \ problem. Once this issue was solved, the focus shifted to how data could be\
    \ processed. When it comes to data processing, it is hard not to talk about Data\
    \ Science. That is why it is important to understand what Data Science is and\
    \ how it can add value to a business. This chapter will take you through the definition\
    \ of Data Science and the role it plays in extracting important insights from\
    \ complex data. \n\nWhy is Data Science Important?\n\nTraditionally, data was\
    \ structured in a small size. This means that there was no problem if you wanted\
    \ to analyze data. Why? There were simple BI tools that you could use to analyze\
    \ data. But modern data is unstructured and different from traditional data. Therefore,\
    \ you need to have advanced methods of data analysis. The image below indicates\
    \ that before the year 2020, more than 80% of the data will be unstructured. \n\
    \n![](images/00002.jpeg)\n\nThis data comes from different sources such as text\
    \ files, financial logs, sensors, multimedia forms, and instruments. Simple BI\
    \ tools cannot be used to process this kind of data as a result of the massive\
    \ nature of data. For this reason, complex and advanced analytical tools and processing\
    \ algorithms are required. These types of tools help a Data Scientist analyze\
    \ and draw important insights from data. \n\nThere are still other reasons why\
    \ Data Science has increasingly become popular. Let’s take a look at how Data\
    \ Science is applied in different domains.\n\nHave you ever thought of having\
    \ the ability to understand the exact requirements of your customers from existing\
    \ data such as purchase history, past browsing history, income, and age? The truth\
    \ is: now it is possible. There are different types of data which you can use\
    \ to effectively train models and accurately recommend several products to customers.\n\
    \nLet’s use a different example to demonstrate the role of Data Science in decision\
    \ making. What if your car is intelligent enough to drive you home? That would\
    \ be cool. Well, that is how the self-driving cars have been designed to work.\
    \ \n\nThese cars gather live data from sensors to build a map of the surroundings.\
    \ Based on this data, the car can make decisions such as when to slow down, when\
    \ to overtake, and when to take a turn. These cars have complex Machine Learning\
    \ algorithms that analyze the data collected to develop a meaningful result. "
