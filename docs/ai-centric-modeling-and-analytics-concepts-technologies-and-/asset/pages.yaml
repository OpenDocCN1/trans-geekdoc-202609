    copyright bots, and chatbots. Bad bots include content scraping and click fraud
    bots, as shown in Figure 18.1.


    # ### 18.1.1  SPAM


    Some researchers of scientific papers have proposed that spam is an acronym that
    stands for “stupid pointless annoying malware.” Spam refers to fake messages,
    news, images, links, or video formats that are usually sent to OSN users (Roy
    et al., 2020).


    Spam may be categorized as an Internet spam, in which unwanted fake news or messages
    are sent over the Internet to users. To send these unwanted messages, spam bots
