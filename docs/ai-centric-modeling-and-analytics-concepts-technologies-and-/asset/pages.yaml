  md: '# 2 Exploration of Machine Learning Models for Business Ecosystem


    *Akanksha Goel, Babasaheb Jadhav, Alex Khang, and Mily Lal*


    # 2.1 INTRODUCTION


    Industry 4.0 is a term used to describe the fourth industrial revolution, which
    involves the integration of advanced know-how, such as artificial intelligence
    (AI), robotics, and Internet of things (IoT) into manufacturing processes. Industry
    4.0 is bringing significant changes to the way businesses operate and interact
    with their ecosystems, as shown in Figure 2.1.


    Machine learning (ML) is a key technology driving these changes, enabling businesses
    to analyze large amounts of data and make predictions, forecast, automate processes,
    and optimize operations (Khang et al., 2023c).


    Machine learning is a subfield of AI that focuses on developing algorithms and
    statistical models that enable computer vision to learn from data and make predictions
    or decisions without being programmed explicitly (Khang et al., 2023a).


    In other words, ML involves algorithms to recognize patterns and relationships
    in data, and then uses that knowledge to make predictions or take actions on new
    data, as shown in Figure 2.2. The algorithms are designed to iteratively learn
    from the data, refining their performance over time and improving their accuracy
    (Chen et al., 2023).


    The types of ML methods are as follows:


    +   1. **Supervised learning**: The algorithms are trained on a labeled dataset,
    where the desired output is known. The algorithm recognizes patterns in data input
    and output.

    +   2. **Semi-supervised learning**: A small amount of labeled data and a large
    amount of unlabeled data are used to develop a model.

    +   3. **Unsupervised learning**: The algorithms are trained on the unlabeled
    dataset, where the desired output is not known. The algorithm identifies data
    patterns and structures without specific guidance.

    +   4. **Reinforcement learning**: The algorithm takes actions in datasets to
    maximize a reward. It receives feedback on the success or failure of its actions
    and adjusts its behavior accordingly.'
  merge: -1
  img_proc: true
