- pgno: 74
  md: 'Nowadays, AI and chatbots are currently gaining popularity because they are
    widely used in a variety of industries, including e-commerce, healthcare, and
    education (Rani et al., 2021).


    The development of chatbot technology has accelerated in recent years, in part
    as a result of developments in machine learning and natural language processing.


    “Can machines think?,” an article by Alan Turing (Copeland, 2023) on computing
    machinery and intelligence in the 1950s, is considered the origin of chatbots.


    Since then, quite a few chatbots have been developed, some of which are still
    in use today (Wang et al., 2022). The R&S technologies (speech recognition and
    synthesis), customizable interaction, connectivity with outside apps, omnichannel
    deployment, context awareness, and multi-turn capabilities are just a few of the
    new functionalities that modern chatbots have included.


    As a result, a variety of chatbots are now integrated into many electronic devices,
    programs, and applications, such as messaging apps (WhatsApp, Telegram, Kik, and
    Slack), video games and gaming platforms (Xbox and Roblox), and social networks
    (Instagram, Facebook Messenger, and X/Twitter). In fact, there are incredibly
    few fields in which chatbots are not either present or will not be in the near
    future.


    According to Belda-Medina & Calvo-Ferrer (2022), the term “chatbot” might be confusing
    because it can be used to describe a wide range of programs that are used in various
    formats and for various purposes. A chatbot is generally understood to be an AI-based
    computer software that mimics human dialogue through text and/or audio.


    But today’s use of terms linked to chatbots that do not all mean the same thing
    includes terms, such as “chatter bot,” “smart bot,” “edubot,” “quizbot,” “digital
    assistant,” “personal assistant,” “virtual instructor,” and “conversational agent”
    (Hahanov et al., 2022).


    In addition, conversational AI has the potential to be helpful resources as constant
    tutors and companions in language learning, especially in situations and circumstances
    where formal education and access to native speakers are not options.


    The accuracy of this type of chatbot and its advantages and attitudes among current
    students and in-service professors have been the major topics of works published
    too far.


    Recent advances in AI technology indicate that the responsibilities of English
    as a foreign language (EFL) educators are also being challenged. There is technology
    that can do what instructors do now. There are apps that use AI to correct students’
    grammar mistakes, for example.


    Feedback is provided along with detailed yet concise explanations and examples;
    it can be a useful tool for students to learn grammar in context and with a more
    individualized approach. There are additional applications for learning other
    aspects of the English language beyond grammar, such as speaking, writing, and
    vocabulary (Wang et al., 2018).


    Additionally, smartphone versions of these applications are available, making
    education more accessible and convenient for students. This app places students
    in a real-world learning environment where they can practice self-regulation skills
    (Reeve & Stephanie, 2020).'
