    # 15.4.5 ANALYSIS BASED ON STRUCTURES OF KNOWLEDGE


    To understand the research questions in the present study, three structures of
    knowledge are analyzed with the help of bibliometric analysis using Biblioshiny.


    # 15.4.5.1 Conceptual Structure of Knowledge


    Aria & Cuccurullo (2020) discovered that conceptual structure investigates the
    key ideas and issues, and illustrates the connections between research topics.
    The conceptual structure of the current study is mapped using two methods, namely,
    co-words network and factor analysis.


    The multiple correspondence analysis (MCA) technique is used to analyze the factor
    of the author’s keywords to reduce the dimensionality of the data. This technique
    is beneficial in analyzing various relationships of the categorical dependent
    variables, also known as an extension of correspondence analysis (Abdi & Valentin,
    2007).'
