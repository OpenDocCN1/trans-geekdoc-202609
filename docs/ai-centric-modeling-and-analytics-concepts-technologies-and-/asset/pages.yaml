    One of the main goals for Industry 4.0 is that the smart devices created should
    be able to display a more human condition, that is, they should be able to communicate
    with each other, exchange information within themselves, and finally try to realize
    this communication with humans.


    This is the basis for the later industrial revolution. So, the next revolution,
