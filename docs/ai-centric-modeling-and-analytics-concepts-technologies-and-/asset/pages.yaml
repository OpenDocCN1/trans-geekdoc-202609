    # 18.1.3 CYBERBULLYING


    Online social networks are considered one of the most popular social tools utilized
    by adolescents and account for their daily Internet activity. Currently, these
    platforms offer a chance for young people to be subjected to cyberbullying.


    Cyberbullying involves one person repeatedly harassing and threatening another
    person using electronic devices. It takes place in various platforms, such as
    instant messages, online games, text messages, and social media (Bozyigit et al.,
    2021).


    The major issues in cyberbullying detection are lack of identifiable parameters,
    clearly quantifiable standards, and definitions that are used to classify tweets
    as bullying or non-bullying (Kumari & Jyoti Prakash, 2021). With social networks
    consuming people''s entire time, cyberbullying has emerged as a social issue that
    demands the best solution. Therefore, automated detection is essential for identifying
    the occurrence of cyberbullying (Kumar et al., 2021).


    Cyberbullying is not commonly observed among Spanish school students (Castellanos
    et al., 2021). Conventional methods for detecting cyberbullying activities comprise
    the guidelines and development of standards that all users must adhere to, the
    use of profane word lists, the employment of human editors to manually check for
    bullying behavior, and the use of regular expressions (Abarna, 2022).


    As a result, the maintenance of these methods is time consuming and labor intensive.
    Therefore, because of widespread cyberbullying, it is important to develop detection
    methods to identify new instances of cyberbullying (Mahbub et al., 2021).


    # 18.1.4 Types of Cyberbullying


    Cyberbullying can occur in many forms, including flooding, flaming, harassment,
    cyberstalking, cyber threats, and racism.


    There is a high likelihood of flooding occurring in online groups and chat rooms,
    as reported by Xu and Paula (2021). In online games, sending unwanted text messages
    to individuals in a chat room is referred to as flaming (Zhang, 2021).


    Cyberbullying through harassment can spread quickly by sending abusive or insulting
    text messages. Compared with flaming, persistence is identifiable in harassment
    (Song, 2021). Cyberstalking is defined as posting threatening, hurtful, or destructive
    text messages.


    Cyber stalkers often seek to destroy their target''s friendships and reputation
    (Kaur et al., 2021). Cyberthreats can be categorized into two types: direct threats
    and distressing materials. Direct threats are threats that cause a person to commit
    suicide, as shown in Figure 18.5.'
