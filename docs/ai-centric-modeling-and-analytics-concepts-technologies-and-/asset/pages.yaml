    From these results, the researchers concluded that the students felt comfortable
    learning interactive speaking by incorporating AI chatbots. It was also stated
    that some indicators of student engagement are getting assignments done, submitting
    assignments on time, getting good marks in the class, inspiring others in the
    classroom, taking part in classroom activities, and doing self-study when necessary
    to gain a better understanding of the subject.


    Students engage with the curriculum and find concepts and principles to apply
    in real-life situations by actively and enthusiastically participating in lesson
    discussions and posts, that is, students answer in a timely manner.'
