    The participants of this study were second-year students of English language education
    study program class A who were enrolled in interactive speaking class.


    The class consisted of 38 students. Their participation was voluntary. Informed
    consent was acquired by informing the participants verbally, and those who agreed
    took part in the study, as shown in Table 4.2 to Table 4.8.


    Two instruments were utilized to achieve the goals:


    +   - A questionnaire that gauged student engagement in the classroom by involving
    AI chatbots, which was distributed via Google Form.

    +   - An interview that supported the data about the interaction and the students’
    responses toward the usage of AI chatbots in teaching English.'
