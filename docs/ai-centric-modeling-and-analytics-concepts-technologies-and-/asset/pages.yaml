  md: '# 7.3 MATHEMATICAL ASSUMPTIONS


    According to Figure 7.1, we can assume that the total population can be divided
    into five subpopulations: susceptible, exposed, infected, quarantined, and recovered.


    Migrant, newborn, and immigrant populations with a travel history belong to the
    susceptible population at rate A. A susceptible individual is exposed to AI approaches
    at rate β. According to the law of mass action, the individual becomes infected
    in βSI. The exposed population was infected after testing using different AI approaches
    at rate μ. The infected population decided to undergo hospitalization or quarantine
    at rate α.


    The hospitalized or quarantined population that started AI treatment and monitoring
    at rate δ recovered from COVID-19. Natural mortality was represented as d₁, and
    the diseases induced by death were represented as d₂. It is assumed that every
    subpopulation is dynamic. Therefore, these populations will change with respect
    to time (Divvela et al., 2023).


    A flow diagram and its pictorial representation are shown in Figures 7.1 and 7.2,
    respectively. As shown in the figures, the AI-based technique has formulated a
    mathematical model and its ability to combat COVID-19.


    # 7.4 MATHEMATICAL MODEL (SEIQR)


    Figure 7.2 shows a diagrammatic representation of COVID-19 using the AI technique.
    Because COVID-19 is dynamic, it can vary from one population to another with respect
    to time.


    The first equation explains how the susceptible population changes over time.
    When the susceptible population decreased over time, the rate of change was negative.
    The rate of change is directly proportional to the infected population, in which
    the susceptible population was in contact.


    When the population that includes the recruited migrants, immigrants, and newborn
    (A) gets exposed, they may become susceptible.


    Here, we consider the five subpopulations, in which the number of susceptible
    population changed because of the addition of recruited migrants, immigrants,
    and newborn (A), and decreased as a result of death and COVID-19 infection (βSI).
    The rate of change of the susceptible population is governed by Equation 7.1:


    $$\frac{dS}{dt} = A - \beta SI - d_1 S \tag{7.1}$$


    The second equation illustrates how the exposed (latent period) population varies
    over time. The first term is the same as the previous term on the right-hand side.
    The sign is positive because of the increase in the infected population.


    Natural deaths and deaths due to COVID-19 are assumed to have decreased. After
    some time, the exposed population changes with an increased infection (βSI), becomes
    infected at μE, and decreases by death at d₁. The rate of change in the population
    is governed by Equation 7.2:'
