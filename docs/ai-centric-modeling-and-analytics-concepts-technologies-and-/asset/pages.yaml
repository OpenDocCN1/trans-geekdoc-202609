  md: '# 14.5.2.3 UiPath Robot


    The steps developed or recorded by UiPath Studio can be executed step by step
    using UiPath Robot. It is a window service that is alternatively known as an execution
    or a runtime agent. Therefore, it is referred to as a robot.


    Robots connected to Orchestrator can execute processes. Local licensing of robots
    can also be used as an alternative approach for program execution. Some robots
    are licensed, while others are not, but their use completely depends on the manner
    in which they are deployed.


    UiPath software robots can be classified as attended or unattended.


    +   - **Attended robot:** It operates in coordination with humans to complete
    daily tasks allocated at the workstation. User events trigger the attended robot,
    and Orchestrator cannot be used for the same purpose. These robots cannot run
    under a locked screen.

    +   - **Unattended robot:** This type of robot is independent of the user, as
    it does not require any attention in a virtual environment. This robot can automate
    several processes. The configuration set in the Orchestrator is responsible for
    the execution of this program. Along with the capabilities of an attended robot,
    this robot can also perform scheduling, remote execution, and monitoring tasks.
    It can also provide support for work queues. One of the advantages of the unattended
    robot is that it easily captures employee performance data, departmental task
    daily volume data, and other related data.

    +   - **Free robots:** These robots work similarly to unattended robots, but they
    have no application in the production environment and can be used only for development
    testing purposes.


    # 14.5.3 Automation Anywhere


    Automation helps make business processes more efficient and effective by reducing
    or replacing the human workforce. Automation Anywhere is one of the most used
    RPA tools that automate complex business tasks using powerful features. It uses
    cloud technology along with AI and is a web-based platform. It gives end-to-end
    automation (Tailor et al., 2022a).


    Different bots, such as IQ bots, meta bots, and task bots, can be developed using
    components of Automation Anywhere. It easily adapts to new environments and is
    useful for deployment in the cloud, data centers, or desktops. It requires zero
    programming skill.


    The recorders can be used for manual action recording, and the task editor can
    be used to edit the action as follows:


    +   - It provides intelligent automation for business and IT operations.

    +   - It provides bank grade-level security.

    +   - It can be hosted on premises or in the cloud.

    +   - It has low-code or no-code platform for automating processes.

    +   - It automates complicated and complex tasks.'
