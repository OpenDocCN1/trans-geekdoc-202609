  md: '# 11.3 TECHNICAL APPROACH


    # 11.3.1 Dataset Description


    The following are the publicly available datasets considered for this work:


    +   - **ACRIMA** (Fan et al., 2020) is a public dataset of fundus images that
    contains annotations of glaucoma made by two experts. The dataset contains 705
    images, with 396 images labelled as glaucomatous and 309 images labelled as normal.
    It is crucial to remember that no additional clinical information was taken into
    account; the comments were made simply on the basis of how the fundus pictures
    appeared.

    +   - **The Drishti-GS** (Sivaswamy et al., 2014) dataset is a publicly accessible
    dataset for glaucoma evaluation that contains 101 monocular fundus pictures, 70
    of which are glaucoma images and 31 are normal images. It is split into two sets:
    testing and training. Four professional segmentations of an optic disc and cup
    are included in the training package.

    +   - **The High-Resolution Fundus (HRF) Image Database** is a collection of images
    of the retina, or the inner lining of the eye, which are used for research and
    medical purposes (Li et al., 2019). The images in the database are high resolution,
    meaning that they have a high level of detail and clarity. The HRF Image Database
    is often used by researchers and medical professionals to study the structure
    and function of the retina and to develop and evaluate new technologies and methods
    for diagnosing and treating eye conditions. The HRF dataset, consisting of 45
    images that were split into three groups and labelled as diabetic retinopathy,
    glaucomatous, and healthy, is a dataset for fragmenting retinal vessels. In the
    present study, only glaucomatous and healthy subjects were considered (Khang et
    al., 2022).

    +   - **ORIGA** is an online repository of retinal fundus photographs developed
    for glaucoma examinations and studies. Photographs of the retina, optic disc,
    and blood vessels at the back of the eye are called retinal fundus images. Glaucoma
    is a group of eye conditions that can damage the optic nerve and cause vision
    loss (Zhuo et al., 2010). The ORIGA-light dataset is anticipated to be a helpful
    resource for researchers looking into the underlying biological reasons for the
    condition, as well as academics and clinicians focusing on glaucoma diagnosis
    and treatment. ORIGA30 includes 168 photographs of glaucoma patients and 482 photographs
    of healthy people, in addition to disc and cup segments.

    +   - **Multi Eye Disease Dataset** is a collection of eye-related medical photographs
    that were divided into four groups: normal, cataract, glaucoma, and retinal disease.
    The dataset was developed in an Indian hospital and has 500 photographs in total,
    with 100 images for each of the three illness groups and 300 photographs for the
    healthy category. Because the data have been anonymised, it is unlikely that the
    dataset contains any private information about the people in the photographs.
    The dataset appears to have been built using the data fusion procedure, and it
    was developed for research on'
