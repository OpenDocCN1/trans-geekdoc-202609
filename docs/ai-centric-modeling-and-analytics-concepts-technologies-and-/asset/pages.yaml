    # 6.6.2 LANGUAGE MODELS


    Language models form the core components of NLP. All popular NLP applications,
    such as Siri, Google Assistant and Alexa, are powered by language models. The
    language model predicts the probability of a sequence of words.


    Language models are used in machine translation, speech recognition, parts of
    speech tagging and information retrieval. Two prominent types of language models
    are statistical language models and neural language models. Statistical'
