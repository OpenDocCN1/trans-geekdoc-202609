    # 9.2.1 DATA MINING


    The process of extracting knowledge (or useful information) from the data is addressed
    in knowledge discovery in databases (KDD). In this process, a step called data
    mining (DM) uses specific algorithms to draw patterns from data.


    Nonetheless, a number of publications and business actors refer to the entire
    KDD process as DM, including the concept of the cross-industry standard procedure
    for data mining. According to Sugiyarti et al. (2018), the KDD step known as DM
    deals with the applications of specialized algorithms to extract patterns from
    data and is denoted by the term "data mining".


    # 9.2.2 MACHINE LEARNING


    There is a substantial difference between the ML and DM overlap. As they usually
    use the same methods and have a great deal in common, these two ideas are often
    confused. The ML pioneer states that a field of research that offers computers
    the ability to learn without being explicitly taught is ML.


    According to Rajkomar et al. (2019), finding fresh characteristics in the data
    is the basic objective of DM. It places more emphasis on learning new and fascinating
    information than it does on requiring the domain to have a clear aim. Machine
    learning can be thought of as the older sibling of DM.


    Data mining was initially used in the late 1980s. Some researchers opt to refer
    to their work as DM (Gao et al., 2021). The techniques used in the papers retrieved
    by the first and second queries did not differ noticeably.


