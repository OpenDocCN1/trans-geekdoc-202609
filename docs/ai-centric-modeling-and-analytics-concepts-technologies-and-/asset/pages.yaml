    The specific objectives are listed as follows:


    +   - To compare various classification techniques and build an ensemble model
    to improve accuracy

    +   - To develop a prediction system for patients with breast cancer with higher
    accuracy than other systems


    # 8.1.2 REQUIREMENT FOR OUR SYSTEM


    The Centers for Disease Control and Prevention, the United States national public
    health agency, published a dataset known as Wisconsin Breast Cancer Database (WBCD)
    for public use under CCO license (Praveen et al., 2023).


    The dataset contains 569 instances and 32 attributes, where there are two classes
    (malignant and benign), as shown in Table 8.1. The proportion of malignant people
    is 32.7% and nondiabetic is 62.7% (Wolberg et al., 2021).


    Feature information includes radius, texture, perimeter, area, smoothness (local
    variation in radius lengths), compactness (perimeter²/area − 1.0), concavity (severity
    of concave portions of the contour), concave points (number of concave portions
    of the contour), symmetry, and fractal dimension (‘coastline approximation’ −
    1).


    From Table 8.1, it is clear that the data are slightly imbalanced, which implies
    that the building model is sufficient, so further treatment is required.


    # 8.2 LITERATURE REVIEW


    Depending on the severity of breast cancer symptoms, patients may be exposed to
    a variety of tests to diagnose the disease, including ultrasonography, biopsy,
    and mammography (Khang et al., 2022b). Biopsy, the most evident of these approaches,
    entails the removal of sample tissues or cells for analysis. Fine-needle aspiration
    (FNA) is a method used to take cell samples from the breast, which are subsequently
    sent to a pathology laboratory for microscopic inspection (Khourdifi & Bahaj,
    2018).


    Numerical properties, such as radius, roughness, perimeter, and area, can be calculated
    using microscopic images of cells and tissues. The FNA results are then compared
    to imaging data to determine the possibility of a patient having a malignant tumor
    (Richard O. Duda, 2000).


    Kumari et al., (2021) compared AdaBoost, logistic regression, support vector machine,
    random forest, and other state-of-the-art techniques and base classifiers.'
