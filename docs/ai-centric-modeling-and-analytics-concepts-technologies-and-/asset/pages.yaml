  img_proc: true
- pgno: 145
  md: '```

    \frac{dE}{dt} = \beta SI - (d_1 + \mu)E \quad (7.2)

    ```


    The third equation states how the infected (latent) population became infected
    during the COVID-19 pandemic through contact with an infected population.


    The infected population increased with rate μE and resulted in the transition
    from exposed to infected. The population decreased because of natural death (d₁)
    and death due to COVID-19 (d₂). This is represented by Equation 7.3.


    ```

    \frac{dI}{dt} = \mu E - (d_1 + d_2 + \alpha)I \quad (7.3)

    ```


    The fourth equation explains the rate of change in the quarantined population.


    The development of the AI technique aids in the screening and testing processes
    and confirms that the infected population has undergone isolation or quarantine
    (Khang et al., 2023a).


    The quarantined population increased at rate αI. Natural deaths and deaths due
    to COVID-19 decreased at rate (d₁ + d₂)Q. This transition can be represented by
    the differential, as shown in Equation 7.4:


    ```

    \frac{dQ}{dt} = \alpha I - (d_1 + d_2 + \delta)Q \quad (7.4)

    ```


    The last equation elaborates the transition of the quarantined population that
    recovered over time after the improvement of the medical and isolation processes.
    We assume that infection and death rates depend on the availability of high-quality
    medical care and isolation rooms.


    The population increased because of clinical treatment or isolation at rate δQ
    and decreased because of death d₁. This can be explained by Equation 7.5:


    ```

    \frac{dR}{dt} = \delta Q - d_1 R \quad (7.5)

    ```


