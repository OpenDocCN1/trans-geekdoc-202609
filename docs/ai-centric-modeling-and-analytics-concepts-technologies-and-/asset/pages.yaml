    Since 2008, Airbnb has allowed travelers to travel in a more distinctive, customized
    fashion, and it has quickly risen to the top of the list of websites used to book
    vacation accommodations (Lutz & Newlands, 2018).


    Sharma et al. (2021) used explainable ML techniques to understand the features
    of customer experience that are important for pricing a variety of accommodations,
    which can assist businesses in deciding the components of the customer experience
    for future progress.


    # 15.3 METHODOLOGY


    The present study used a bibliometric analysis method, beginning with a search
    of the Scopus database, to better understand, quantify, and analyze the available
    scientific literature on AI in the T&HI.


    The study was conducted using a three-phase technique that included an implementation
    plan, data collection, and bibliometrics. The bibliometric analysis was made up
    of two events.


    The first focused on the domain and used numerous metrics, such as Bradford’s
    law and Lotka’s law, to provide unbiased and quantifiable information to understand
    trends.


    The second, which focused on knowledge structures, assessed social, intellectual,
    and conceptual structures using factorial analysis and scientific mapping utilizing
    bibliometric techniques, such as cooperation, co-citation, and co-word (Cuccurullo
    et al., 2016).


    Science mapping enables statistical investigation and creation of a global image
    of scientific knowledge. It primarily uses the three knowledge structures to convey'
  merge: -1
  img_proc: true
- pgno: 291
  md: 'the dynamics of scientific inquiry (Van, 2007) and structural elements and
    to identify representations of intellectual links (Small, 1999).


    The social structure demonstrates the relationships among authors, institutions,
    and countries. The conceptual structure indicates what science is debating, including
    critical issues and trends, whereas the intellectual framework illustrates how
    a particular author’s contributions impact a specific scientific field. Together,
    these structures provide a comprehensive view of knowledge (Aria & Cuccurullo,
    2017).


    Therefore, the main research questions of this bibliometric study are as follows:


    +   - RQ1: What are the main keywords of AI in the hospitality/tourism/aviation/catering
    industry?

    +   - RQ2: How do authors determine the impact of AI on the hospitality/tourism/aviation/catering
    industry?

    +   - RQ3: How do authors, institutions, and countries collate their AI findings
    in the hospitality/tourism/aviation/catering industry?

    +   - RQ4: How do we explore the understudied and overstuddied research keywords
    in the last 35 years? The data collection and search criteria were as follows.


    A data search was performed on July 5, 2022, through one of the most reliable
    data sources (i.e., Scopus) from the virtual private network (VPN) of Chandigarh
    University. Keywords, such as “Machine learning” OR “Artificial intelligence,”
    OR “AI” OR “Robotics,” AND (“Hospitality” OR “Tourism” OR “Aviation” OR “Catering”),
    and language=English were searched in the Scopus database since its inception.


    A research article, conference proceedings, and published and unpublished articles
    were extracted. A total of 1348 metadata were extracted, but some of the data
    had missing, incorrect, or inappropriate information, which was removed during
    data cleaning. After removing 196 data (153 lecture notes; 43 no author names)
    from the metadata, 1152 data were found fit for final analysis; 12.44% of the
    annual growth rate of the present publication context was found during the study.


    In the current study, articles accessible through the Scopus database between
    1987 and July 5, 2022, were considered and exported as an a.csv file containing
    citations, bibliographic data, abstract and keyword data, funding, details, and
    other information.


    # ## 15.4 RELATED WORK


    # ### 15.4.1 ANALYSIS AND VISUALIZATION OF DATA


    For the bibliometric analysis, we used open-source statistical software (i.e.,
    Bibliometrix R package 4.2.0) through the Biblioshiny version in the present study.


    Biblioshiny produces an abundance of outputs, including a summary of the key facts,
    annual citations, annual scientific output, three field plots, sources, the most
    pertinent and locally cited sources, Bradford’s law, source impact, and source
    dynamics.


    In addition, it generates authors based on their importance, local citation frequency,
    productivity over time, Lotka’s law, and influence. Affiliations, countries,'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'documents, clustering, conceptual structures, intellectual structures, and
    social structures can also be analyzed and viewed (Aria & Cuccurullo, 2017).


    For publication trends and citation analysis, Microsoft Excel 2016 (www.microsoft.com)
    was used to present the histogram, chart, graph, and trend line and to better
    understand the increasing/decreasing importance of AI since its inception.


    The VOSviewer software was used to visualize the network in the present study
    for mapping and clustering, as it uses a unified structure (Waltman et al., 2010).
    Since 2006, more than 500 publications have used it for graphical representation
    (www.vosviewer.com/publications).


    The VOSviewer software is a handy tool for building and viewing large bibliometric
    maps, with focus on a visual representation that includes journals, institutions,
    or authors based on co-citation, bibliographic coupling, citation, or co-authorship
    relationships. It uses circles, lines, and colors to depict the relationships
    between authors, documents, countries, etc.


    Bibliometrix (Biblioshiny) and the VOSviewer software are used to visualize and
    extract the desired information in tables and images required for further analysis.


    # 15.4.2 MAIN INFORMATION ABOUT THE STUDY


    This study explores the importance of ML in the hospitality/tourism/aviation/catering
    industry using a quantitative approach to metadata extracted from the Scopus database.


    Data regarding AI from 1987 to July 5, 2022, found 629 sources (journals, books,
    etc.) and 1152 documents with an annual growth rate of 12.44%, which can be considered
    very well and explains the area’s growing demand.


    The average age of the documents was 4.68, the average number of citations per
    year was 11.2, and the total number of references was 1568.


    Two types of keywords were identified (i.e., 3748 KeyWords Plus and 3127 authors’
    keywords). A total of 3030 authors were identified in the metadata, and 179 single-author
    documents were found in the study.


