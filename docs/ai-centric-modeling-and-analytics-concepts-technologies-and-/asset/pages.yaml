  img_proc: true
- pgno: 106
  md: 'While some locations may not have access to the Internet, telephone connections
    are available everywhere and can be used to transmit information.


    Several breakthroughs have already been made as a result of the use of technol-
    ogy in the agricultural sector. However, many others have failed because the tech-
    nology is overly complex, cumbersome to use, and is perceived to be more harmful
    than helpful.


    The problems faced by farmers have increased. One major conclusion is that whatever
    technology is deployed should not be a burden. Another issue is con- nectivity
    problem, which means that most technological devices need a constant con- nection
    to the cloud to provide assistance, which is not feasible in remote locations
    (Khang et al., 2023b).


    Another problem is the setup fee, which means that neither the government nor
    farmers could afford the technology’s initial setup fee. After consideration of
    each factor, it was determined that the technology needs to be a cutting edge
    while still being widely available. This should be simple for everyone.


    For this, machine learning (ML) is used to forecast values, and a web application
    was created to make access for everyone simpler and easier.


    # 5.2 RELATED WORK


    Crop prediction using ML is an active research area that has received considerable
    attention in recent years. The following recent studies may be of interest:


    +   *   **Crop yield prediction using ML**: An overview of the study by Ramesh
    and Rudra (2021) provided recent advances in crop yield expectations using ML,
    including data collection, pre-processing, and model selection. In a comparative
    study of ML algorithms for crop yield prediction (Bharath et al., 2020), support
    vector regression, decision trees, and random forests were evaluated for their
    efficacy in predicting agricultural yields.


    +   *   **Crop yield prediction using deep learning techniques**: Saeed and Lizhi
    (2019) reviewed convolutional neural networks and recurrent neural networks together
    with other contemporary deep learning approaches for agricultural production prediction.


    +   *   **Crop yield prediction using ML**: Van Klompenburg et al. (2020) made
    a framework suggestion for crop vintage forecast that combines ML with remote
    sensing data.


    +   *   **Crop yield prediction using ML**: In a case study of rice production
    (Niketa & Owais, 2016), crop output was predicted using ML algorithms for rice
    production.


    Smart irrigation systems using ML are another active research area. The following
    recent studies may be of interest:


    +   *   **Smart irrigation systems**: David et al. (2023) provided an overview
    of smart irrigation systems involving the planning and optimization of irriga-
    tion using ML techniques. Youness et al. (2022) presented a smart irrigation'
  merge: -1
