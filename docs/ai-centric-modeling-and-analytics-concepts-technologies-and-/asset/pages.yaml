  md: '+   1. **Predictive maintenance**: ML algorithms can predict whether the equipment
    is likely to succeed or break down, reduce downtime, and improve reliability and
    safety.

    +   2. **Quality control**: ML algorithms can analyze images of products to recognize
    defects and irregularities, enabling businesses to detect issues early and reduce
    waste.

    +   3. **Supply chain optimization**: ML algorithms can optimize supply chain
    operations by analyzing data from suppliers, logistics service providers, and
    customers. This will result in cost reduction, minimize delivery times, and enhance
    customer satisfaction.

    +   4. **Autonomous systems**: ML is driving the development of human-free systems,
    such as driverless cars, drones, and robots. These technologies can perform tasks
    independently, reducing labor costs and increasing efficiency.

    +   5. **Energy management**: ML algorithms can analyze energy usage and identify
    areas of waste. It is helpful in the reduction of carbon footprint and saves cost.

    +   6. **Customer engagement**: ML algorithms can analyze customer data for personalized
    marketing and recommendations, increasing customer engagement and loyalty.


    Overall, ML is enabling businesses to optimize their operations, reduce costs,
    and improve customer satisfaction. By leveraging the power of data, businesses
    can make more informed decisions and create new opportunities for growth and innovation
    (Khang et al., 2024).


    # 2.2.1 MACHINE LEARNING MODELS


    Machine learning models have become an integral part of businesses and their ecosystems
    in recent years. They are used to analyze data, find patterns, and make predictions
    (Khang et al., 2023b). The well-known ML models used by businesses are as follows
    (Jamwal et al., 2022):


    +   1. **Regression models**: These are used to predict an uninterrupted variable,
    such as sales or revenue, based on other variables. These models are commonly
    used in finance and marketing to forecast future performance.

    +   2. **Decision trees**: These are used in decision-making based on a set of
    rules. These models are commonly used in finance, healthcare, and retail to make
    decisions about customer segmentation and risk analysis.

    +   3. **Random forest**: It is a method that combines multiple decision trees
    to enhance the correctness of predictions. This model is commonly used in finance,
    healthcare, and e-commerce.

    +   4. **Support vector machines**: They are used for the classification of tasks,
    such as predicting whether a customer will churn or not. These models are commonly
    used in marketing, finance, and healthcare (Vrushank & Khang, 2023).

    +   5. **Neural networks**: They are used for complex tasks, such as face recognition
    and NLP. These models are used in healthcare, finance, and e-commerce.'
