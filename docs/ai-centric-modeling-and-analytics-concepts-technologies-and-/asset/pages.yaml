    AI refers to the ability of a system to learn based on algorithms. Further, some
    technological fronts help AI in decision-making, namely, deep learning and big
    data (Bhambri et al., 2022).


    In today’s complex era, the problems are not simple but much more complex, and
    the data required to make decisions are in a completely unstructured format. Therefore,
    data in an unstructured format must have some pre-processing and a similar format
    form, where they can be inputted into the ML algorithm. The tools used to collect
    data are enterprise resource planning, data captured through various applications
    such as Excel, comma-separated values, and third-party tools such as NoSQL cloud
    services (Rani et al., 2023).


    The collected data are required to be formatted using the extract, transform,
    and load (ETL) processes. The ETL reports must be inputted into an algorithm that
    is developed using any language, such as Python, R, or Java.


    The data must be provided for AI processes to handle anomaly detection, and the
    algorithm may forecast decisions that may be directly applied based on human interventions.
    The AI-centric process is illustrated in Figure 1.3.


    Artificial intelligence can make decisions, but the decisions are not only based
    on facts and figures but also on the organization’s vision, mission, and long-term
    and short-term strategies that can be analyzed by human beings only.


    Further, AI requires data input to process and obtain the desired output, but
    how the data will be gathered or generated remains a question for everyone. To
    test a program or system application for decision-making, it is essential to understand
    the input process and desired output.


    The decision-making process mostly requires structural data, and every organization
    has processes to gather structural data. At present, data are collected over computer
    systems by either sharing Google Forms or questionnaires, or captured through
