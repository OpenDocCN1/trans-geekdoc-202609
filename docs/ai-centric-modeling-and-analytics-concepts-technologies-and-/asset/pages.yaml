  md: 'If any of these symptoms are seen, refer to an ophthalmologist (a doctor whose
    specialization includes eye care unlike optometrists and opticians). Ophthalmologists
    have specific training and experience in the diagnosis and treatment of vision
    conditions (Weinreb et al., 2014).


    +   - **Tronometry**: This device measures intraocular pressure (IOP) or pressure
    inside the eyes. Before the test, numbing eye drops are applied to expose the
    eye, increasing the comfort of the test. The corneas are mildly indented by the
    device, and the resistance to this indentation is measured using the measuring
    equipment.

    +   - **Ophthalmoscopy**: This examination is used to determine the size and shape
    of the optic nerve, retina, optic disc, and blood vessels.

    +   - **Perimetry**: This is an example of visual field testing. The visual field
    describes the distance the eyes can see while focusing on a single location. This
    test determines whether a patient’s vision has any blind spots.

    +   - **Gonioscopy**: This is performed to determine the precise angle at which
    the iris and cornea meet. A numbing drop is applied to the eye, followed by a
    customised contact lens containing a mirror to show the angle between the iris
    and the cornea. If the angle is blocked, there is a dramatic increase in IOP.
    This examination also reveals aberrant blood vessels and damage caused by earlier
    trauma.

    +   - **Pachymetry**: This is performed to measure the corneal thickness. Because
    of its ability to alter IOP, a probe measures its thickness. This is necessary
    because corneal thickness can interfere with an accurate reading of IOP, resulting
    in misinterpretation of internal pressure and possibly misdiagnosis.


    The following are glaucoma medications and treatments (Weinreb et al., 2014):


    +   - Medication: Eye drops, such as Xalatan, Lumigan, and beta blockers

    +   - Surgery: laser surgery

    +   - Medical procedure: trabeculoplasty


    To detect the presence of glaucoma, we considered various publicly available binary
    classifiable datasets obtained from tonometry examinations. The behaviour of the
    eye dataset is observed on various EfficientNetV2 models with varying activation
    functions to improve the baseline results, and the behaviour of the same is analysed.


    Older age, family background, African heritage, high IOP, and specific medical
    disorders, including blood pressure and diabetes, are other risk factors for glaucoma
    (Weinreb et al., 2014). People with these risk factors should undergo frequent
    eye examinations to check for early indications of glaucoma.


    What are the benefits of transfer learning (TL) in the health sector (especially
    in glaucoma detection)? Transfer learning has the potential to be highly beneficial
    in the health sector (Khang et al., 2023c), specifically in the detection of glaucoma.
    The following are some of the benefits of TL in glaucoma detection:


    +   - **High accuracy**: TL can improve the performance of models for glaucoma
    detection because pre-trained models can be fine-tuned on a smaller dataset'
  merge: -1
  img_proc: true
