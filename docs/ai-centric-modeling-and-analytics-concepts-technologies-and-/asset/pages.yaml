    | $a$ | Rate of quarantine or isolation of people who tested positive |

    | $\delta$ | Rate of recovery after receiving proper treatment from a hospital,
    quarantine, or isolation |

    | $d_1$ | Rate of natural death due to some other disease |

    | $d_2$ | Death rate due to COVID-19 |


