  img_proc: true
- pgno: 335
  md: 'The techniques were evaluated before classifying various evasion tests as passed
    or failed, based on their evasion rates. In contrast to the original generative
    adversarial deep neural network, which randomly perturbs features, their threat
    model has a greater capacity for evasion detection.


    In the work of Abdulrahman et al. (2023), cloud infrastructure and deep learning
    frameworks are employed for web phishing detection, while bidirectional transformers
    and machine learning models were employed for spam detection in another study
    (Bhamri et al., 2022).


    Advances in data science have disrupted the cybersecurity industry, with far-reaching
    mitigation potential. The capacity to collect and analyze high-resolution data
    from every computer, virtual machine, and network tap in even the largest global
    computer networks in close to real time has been made possible by improvements
    in the collection, storage, and big data infrastructure (Khang et al., 2022).


    We now have tremendous visibility into the operating network, resolved down to
    individual assets reporting nearly continually, as opposed to the data of the
    past, which were measured at the perimeter of a cyber system and merely aggregate
    summaries. These data can be produced and stored in petabyte storage facilities
    and can be condensed in a variety of logs, metadata, low-level operating system,
    and network telemetry (Khang et al., 2023a).


    The operating systems of machines connected to the network are an important source
    of data. Endpoint detection and response technology, recently introduced by the
    cybersecurity sector, can collect these data (Hero et al., 2023).


    Endpoint detection and response entails the addition of monitoring software that
    runs on operating systems, collects various telemetry relevant to security, and
    uploads it to either on-premises or cloud servers for analysis (Vrushank et al.,
    2023).


    Among the many behaviors are changes to the registry and file system, command-line
    usage, process use, and network telemetry. These data can be used to detect malicious
    execution by file-based malware; in fact, this is how antivirus software functions.


    As mentioned previously, data science approaches employed in the literature to
    mine useful datasets exhibit various threats to the internal validity of the models
    used (Rani et al., 2021).


    For those that used machine learning tools, EDA was not implemented prior to their
    predictive analytics.


    Exploratory analytics is expected to help infer actionable insights into the nature
    and status of the predictive attributes contained in training sets (Olaye et al.,
    2023).


    This will make informed decisions on the choice of learner algorithm and feature
    engineering techniques that could enhance the capacity of the predictive model,
    especially the feature selection technique, which has been proven to enhance the
    performance metrics of machine learning algorithms (Olaye et al., 2022).


    # **17.3 PROPOSED METHODOLOGY**


    The conceptual framework employed in this study is discussed in this section,
    which addresses some of the threats to the internal validity of the proposed methodologies
    in the literature for phishing detection.'
