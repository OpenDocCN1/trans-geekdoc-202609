    Keywords Plus, Titles, and Abstracts


    The authors’ keywords in the co-occurrence network identified eight clusters with
    46 keywords. Three clusters dominated the co-occurrence network, with AI, tourism,
    and ML as the dominating areas.


    Under AI, cluster robots, service robots, technology, automation, and sustainable
    development have a strong relationship. Tourism clusters have shown the relationship
    between big data, IoT (Rani et al., 2021), decision support systems, forecasting,'
