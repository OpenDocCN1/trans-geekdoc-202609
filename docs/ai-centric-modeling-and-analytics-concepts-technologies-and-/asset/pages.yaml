    # 14.6 ROBOTIC PROCESS AUTOMATION IN BUSINESS DATA MANAGEMENT


    Different strategic objectives can help build and implement an efficient RPA.
    Trivial and manual tasks, such as entering sales data and orders, SAP automation,
    Citrix Automation, and automating user interface and recordings, can be replaced
    by RPA.


    Smaller routine tasks can be integrated into a major task to create good business
    models. The categories of RPA can be understood according to the complexity of
    the processes they execute, given by:


    +   - **Routine task**: Copied and combined data from different application systems
    are used.

    +   - **Structured task**: Data from various application systems are used and
    evaluated using some pre-defined rules. The decisions made by these tasks are
    rule-based.

    +   - **Unstructured tasks**: In these tasks, experience and cognition play a
    vital role along with existing data and rules.


    Robotic process automation works similarly to other information systems. Robotic
    process automation systems have a spectrum of variations ranging from single systems
    to fully integrated subsystems. These systems operate in the cloud, on premise,
    or on hybrid systems.


    Robotic process automation implementations still pose a challenge, as they typically
    result from standard software systems. Software robots are intelligent machines
    with the following components:


    +   - **Sensors**: They leverage and manipulate data from the environment.

    +   - **Actuators**: They communicate with the environment, and their outputs
    can be used as inputs for other systems.

    +   - **Intelligent Center**: It generates output data by using sensor input data.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# 14.7  ROBOTIC PROCESS AUTOMATION USE CASES

    IN BUSINESS DATA MANAGEMENT


    As research and development in the RPA domain progresses, new use cases can be
    explored to implement the same. Some are back-end processes, such as customer
    onboarding, billing management, validation of data, and customer facing, and others
    are front-end processes, such as customer service management, contract initiation,
    and management.


    Front-end processes generally use AI technologies, such as machine learning, deep
    learning, and other technologies, to obtain the input and classify unstructured
    data.


    These data are then provided to enterprise applications for application creation.
    These AI-enabled methods are known as cognitive RPA.


    +   - **How variable the input source is:** The input source plays a very significant
    role in cognitive automation. It also means that for good cognitive automation,
    the variation must be short.

    +   - **How readable the source is:** The machine-readable format of the input
    process is of primary importance in the RPA. It is converted into a readable format
    if it is not machine-readable.

    +   - **What technology can be leveraged:** The cost of intelligent automation
    technology should be bearable with the technology being mature enough to be used
    by the firm without compromising its security policies.

    +   - **How much data are available:** Data availability is an essential component
    of an AI engine. Data must be available in ample amounts always so that AI engines
    can leverage the efficiencies of machine learning models (Khang et al, 2023a).

    +   - **How to standardize and re-engineer:** Message delivery to the customers
    should always be in a standard format. It should not use cognitive automation;
    instead, common formats can be adapted. In addition, algorithms can be used on
    unstructured data. Thus re-engineering and standardization can help make RPA systems
    more efficient with minimum use of AI.

    +   - **How to model risk:** Underwriting is an effective process for cognitive
    automation, but it is not helpful in efficient decision-making. Therefore, proper
    assessment methods must be followed before taking machine-based decisions that
    involve human judgment.


    Robotic process automation differs from cognitive automation in many aspects,
    some of which are listed as follows:


    +   - Approach used to work with human workers

    +   - Data types

    +   - Project timelines

    +   - Approaches used for programming


    According to Tailor et al. (2022), RPA is a technology that takes the robot out
    of the human, whereas in cognitive automation, we put humans into robots. Business'
  merge: -1
  img_proc: true
