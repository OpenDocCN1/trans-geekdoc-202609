  img_proc: true
- pgno: 77
  md: 'The authors also discovered that when students could communicate with instructors
    who were reachable via a variety of channels, they valued learner–instructor interaction
    tactics and felt a feeling of belonging. The most highly regarded engagement tactic
    was deemed to be consistent instructor presence (Axelson & Flick, 2010).


    Furthermore, learning achievement has been shown to be strongly correlated with
    engagement (Fryer et al., 2020). Student engagement was first regarded as a single
    behavioral component factor. This viewpoint led to the simple definition of engagement
    as “students’ participation in diverse activities relevant to learning” (Haristiani,
    2019).


    By emphasizing its behavioral traits, Gao and Cui (2022) defined engagement as
    attitudes toward the learning program or participatory behavior. These criteria,
    however, do not take into account other factors, such as the acceptance of learning
    and the psychological condition of the learner (Kılıçkaya, 2020). Student participation
    is currently defined in a number of different ways.


    Engagement, according to Kılıçkaya (2020), is the amount of effort devoted to
    educational activities that provide excellent performance. Engagement is the degree
    to which learners’ thoughts, feelings, and activities are actively involved in
    learning.


    Axelson and Flick (2010) divided student engagement into three categories: the
    behavioral type, which includes perseverance, effort, and sustained concentration
    in learning; the emotional type, which includes excitement and interest in learning;
    and the psychological type, which includes preference for challenges, independence,
    and involvement in tasks.


    Every student has interests, objectives, and aspirations. Being intrinsically
    driven and supporting personal growth goals are just a natural component of human
    motivational architecture (Axelson & Flick, 2010).


    Students become more interested in class activities when teachers encourage them
    to express and pursue their particular interests and ambitions. Students occasionally
    share their hopes and aspirations in front of the class (Reeve & Stephanie, 2020).
    Students discuss their interests with the teacher and request classroom opportunities
    to pursue their goals.


    However, there are students who choose not to and instead prefer concealing their
    internal driving forces from their teachers. This makes sense, especially when
    students learn that other people may not always be interested in learning about
    personal goals.


    Some teachers do recognize and passionately support their students’ individual
    goals, and these teachers voluntarily alter the direction of their lesson plans
    to take into account student feedback.


    When a student in a foreign language class requests to learn about the country,
    culture, and values of the people who speak the language in addition to the language
    itself, the teacher responds with “yes” or “okay” and adapts the lesson accordingly.


    Yet, some educators ignore, discount, or are oblivious to students’ personal goals.
    These instructors fail to elicit students’ interests and learning objectives.
    The lesson plan for the day is instead unilaterally announced (for example, learning
    20 new vocabulary terms), and then an instruction that best attains the instructional
    goal is given.


    Moreover, students’ agentic engagement or involvement entails behavior and action.
    Agentic engagement, which is what students say and do to create a more motivationally
    supportive learning environment for themselves, is their constructive input to
    the flow of teaching they receive (Fryer et al., 2020; Reeve & Stephanie, 2020).'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'Passivity (also known as agentic disengagement), on the other hand, is when
    a learner simply and passively accepts whatever instruction, events, and circumstances
    happen to come their way.


    Students purposefully and aggressively attempt to personalize and otherwise enhance
    both what is to be learned and the circumstances in which it is to be learned
    by making ideas, expressing preferences, and speaking to their inner motivations.


    Agentic engagement is the fourth type of engagement, similar to behavioral engagement,
    emotional engagement, and cognitive engagement (Fletcher, 2015), but it is a particularly
    proactive and reciprocal variety.


    The teacher assigns a learning activity (such as a book to read or an assignment
    to finish), and students respond by putting forth more or less effort, zeal, and
    strategic thought while working on the activity. This is known as behavioral,
    emotional, and cognitive engagement.


    Student engagement is not always successful (Fletcher, 2015). Its success is largely
    dependent on how attentive the teacher (or the learning environment as a whole)
    is to the students’ initiative. Reciprocal causation is likely to happen, and
    the instructor and student will become more in sync when teachers respond to students’
    comments and recommendations.


    Yet, when teachers are unresponsive, unilateral causation is more likely to happen
    (in which teachers affect students and not the other way around), and the teacher
    and student become more antagonistic. In this scenario, a student’s agentic participation
    may even “backfire” and enrage the teacher (e.g., “Stop your whining, interrupting,
    and back talking. You are disrupting the entire class.”).


    This chapter proposes AI chatbots as a learning aid that is representative of
    digital transformation as the output of revolutionized teaching in Industry 5.0.
    It is a sophisticated tool integrated into learning interactive speaking.


    # 4.2.2 Chatbots and Language Learning


    Human–computer contact is becoming more prevalent and can sometimes serve the
    same functions as human acquaintances in social networking. Among these interactive
    technologies, chatbot conversational agents, designed to communicate with people
    using natural language, are among the most advanced tools.


    They are also extremely common. More than 275,000 developers have produced more
    than 325,000 chatbots on the Pandora Bot platform, which is dedicated to the creation
    of chatbots (Pandorabots, 2021). Although some of these chatbots may be used by
    the general public in routine e-commerce transactions, chatbots are being developed
    for more in-depth conversations and to provide social engagement.


    Intelligent chatbots can learn details about their users to utilize in future
    discussions. This raises the possibility that these conversational agents will
    soon offer individualized social support to a range of users. This is promising
    according to research. A recent literature analysis by Pandorabots (2021) showed
    that users do receive some social support from their interactions with social
    chatbots that are now in use.


    People do not seem to be overly suspicious of the software, as evidenced by the
    fact that they disclose just as frequently to a conversational partner they believe
    is a bot as they do to one they believe is human. Evidence also suggests that
    people perceive chatbots as conversationally competent and credible.'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'Computer-assisted coaching has a long history in the field of human–technology
    interaction that supports learning (for a recent review, see Belda-Medina & Calvo-Ferrer,
    2022). Since then, the concept of language tutors has been pushed to enhance language
    learning in classrooms and increasingly using mobile technologies.


    A second area of advancement has emerged from fields unrelated to education or
    language instruction: chatbots are computer programs designed to have human-to-human
    discussions. At the moment, they play a minimal or peripheral role in formal language
    instruction. What little research there is in this area has mainly concentrated
    on how understandable they are and how they motivate their users.


    Chatbot applications for language acquisition, language learners generally liked
    communicating with chatbots, as well as the fact that some students preferred
    speaking with chatbots than with other students or professors, as shown in Table
    4.1.


    At that time, it was claimed that chatbots would be most helpful for motivated
    and/or advanced students. In studies that followed, the role of chatbots in fostering
    motivational factors, such as learner autonomy, intrinsic motivation, and an inquiry-oriented
    mindset, was investigated (Allouch et al., 2021).


    Early studies revealed the shortcomings of chatbots as tools for language practice
    (Beldа-Medina & Calvo-Ferrer, 2022).


    Both user input (e.g., necessity of correct spelling) and chatbot output (e.g.,
    inability to stay “on topic”) concerns were raised as issues that needed to be
    overcome for chatbots to be of widespread utility to language learners.


    Few educational academics have recently reassessed chatbots’ language proficiency
    due to the relatively modest advancements in this area. Paschek et al. (2022a)
    evaluated five popular chatbots and found that they have greatly improved. Three
    of the five presented 90% of their responses as being grammatically correct. Although
    encouraging, this evidence was insufficient to categorize chatbots as universally
    effective for language practice.


    In contrast, Belda-Medina & Calvo-Ferrer (2022) examined 100 messaging exchanges
    and discovered that people engaged in chatbot conversations for noticeably longer
    than they did with normal people. This discovery illustrated the simplicity with
    which humans can interact with chatbots and the volume of conversational


    **TABLE 4.1**


    **Role of AI in Language Learning Adopted from Axelson and Flick (2010) and Muthmainnah
    et al. (2022).**


    | Language skill | Learning outcomes | Engagement aspect |

    |---|---|---|

    | • Vocabulary<br>• Listening<br>• Speaking<br>• Reading<br>• Writing<br>• Grammar<br>•
    Vocabulary<br>• Pronunciation<br>• Integrated whole language | Changes in one’s
    language skills, knowledge, contemporary abilities, emotional and mental states,
    and behavior patterns | Cognitive engagement, affective, behavioral, emotional,
    social, and cultural |'
