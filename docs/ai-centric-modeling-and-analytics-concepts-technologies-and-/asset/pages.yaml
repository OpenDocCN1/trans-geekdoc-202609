    # 18.4.2 Spam Bot Detection in X/Twitter Using Deep Learning


    Among all the OSNs, X/Twitter is considered the most preferred social network
    community for interacting with all users. X/Twitter users can post messages with
    more than 230 characters, termed tweets (Harrigan et al., 2021).


    As a result of the large number of X/Twitter users, the platform has become a
    target for spam bots and other cyber criminals. To gather user profile or information,
    spammers send unwanted messages, links, and videos. X/Twitter is considered the
    most spam-ridden social media platform (Cresci et al., 2019).


    Many researchers have proposed novel techniques to detect all spam bots on X/
    Twitter platform. Figure 18.13 shows the proposed model, the dataset used, and
    the performance metrics evaluated for SBD in OSN, especially X/Twitter.


    An NLP approach was introduced to effectively differentiate spam users. Initially,
    feature extraction was employed to extract features from the experimental datasets.
    Subsequently, the feature selection approach was evaluated to remove unwanted
    noise from the extracted features. For the classification of the outcome, DL approaches,
    such as RNN, LSTM, and Bi-LSTM, were used. In the experimental scenario, the maximum
    accuracy attained was approximately 98%, the F measure'
