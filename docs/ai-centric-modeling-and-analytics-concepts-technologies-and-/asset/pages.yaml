  md: '# 17.3.3.3.3 Output Layer


    The output of the output layer neuron can be calculated by applying a weighted
    sum of the hidden layer outputs and adding a bias term, followed by a sigmoid
    activation function.


    The sigmoid function maps the output to a probability value between 0 and 1, which
    can be interpreted as the probability of the URL being phishing. The output layer
    can be represented in Equation 17.15:


    z (2) = W (2) a (1) + b (2) a (2) = sigmoid (z (2)) (17.15)


    where W (2) is a 1 × m weight matrix that contains the weights of the connections
    between the hidden layer and the output layer, and b (2) is a scalar bias term.


    The output of the neural network can be interpreted as the probability of the
    URL being phishing or not. We define a threshold value of 0.5 and classify URLs
    with outputs above the threshold as phishing and those below the threshold as
    not phishing.


    To train the neural network, we define a loss function that measures the difference
    between the predicted and true outputs for a given input feature vector.


    We used the binary cross-entropy loss function for this task. The objective of
    the training process was to determine the weights and biases that minimized the
    loss function.


    To find the optimal values of the weights and biases, we used a backpropagation
    algorithm with stochastic gradient descent (SGD) optimization (Altschuler & Talwar,
    2022).


    The backpropagation algorithm computes the gradient of the loss function with
    respect to the weights and biases, and updates them accordingly.


    The SGD optimization updates the weights and biases after each batch of input
    feature vectors, where a batch is a subset of the URL training set.


    The ANN model can be summarized as follows:

    Input layer as Equation 17.16


    a (0) = x (17.16)


    Hidden layer as Equation 17.17


    z (1) = W (1) a (0) + b (1), a (1) = tanh(z(1)) (17.17)


    Output layer as Equation 17.18


    z (2) = W (2) a (1) + b (2), a (2) = sigmoid (z(2)) (17.18)


    where x = [x1, x2 … x11] is the input feature vector;


    W (1) is an m × n weight matrix that contains the weights of the connections between
    the input layer and the hidden layer.

    b (1) is an m-dimensional bias vector;

    z (1) is the output of the hidden layer before activation;'
