  md: '# 12 Disaster Management System for Forest Fire Prediction


    # Fog and Cloud Data-Driven Analytical Compatible Model


    Radhika Kumari, Kiranbir Kaur, and Salil Bharany


    # 12.1 INTRODUCTION


    A disaster is a crisis that causes widespread damage that is beyond the ability
    to recover. In 2015, 346 natural disasters caused 22,764 deaths, 110.3 million
    victims worldwide, and economic damages of US$ 70.3 billion (Guha-Sapir et al.,
    2016).


    Humans are unable to prevent disasters, especially natural disasters, but assessment
    and planning can mitigate the various harmful effects and damage caused by such
    events to a great extent (Zhao et al., 2014). Therefore, international agencies
    and governments of vulnerable countries are transitioning towards disaster management.


    Disaster management is one of the most promising research fields because of its
    economic and social implications (Hibino & Shaw, 2014; Anderson, 2015). Many studies
    have been conducted on disaster management for early warning and timely intervention
    to reduce disruption and loss of life.


    A disaster is a natural or human-made recurring calamitous affair that quantitatively
    and qualitatively affects the socioeconomic life of human society and may have
    an adverse impact on the environment (Monacelli et al., 2005).


    Disasters have the potential to cause large-scale financial and environmental
    damage that is beyond the reach of society to recover its own resources. Forests
    encompass nearly one-third of the earth’s land surface area and are a vital resource
    for humanity (Trivedi & Srivastava, 2014).


    Forests are economically and socially significant in addition to being ecologically
    important. Forest fires are a global threat. Wildfires, also known as wildland
    fires or forest fires, burn 4 to 5 million acres (1.6 to 2 million hectares) of
    land in the United States on average every year (Yoon et al., 2012).


    As a result of global warming, wildfires are expected to become more frequent
    and intense. Therefore, accurate wildfire forecasting and detection are important
