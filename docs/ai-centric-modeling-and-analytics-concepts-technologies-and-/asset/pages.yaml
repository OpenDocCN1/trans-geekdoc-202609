  md: '# 10 Robotics in Real-Time Applications Using Bayesian Hyper-Tuned Artificial
    Neural Network


    Arvind Kumar Shukla, Poongodi S.,

    Alex Khang, and Shashi Kant Gupta


    # 10.1 INTRODUCTION


    A robot must adapt to a limited set of measurements while functioning in real-world
    robotics contexts where it may encounter unexpected visual features. A broad shift
    toward system robotics capable of responding to complicated dynamic settings and
    tackling a variety of uncertainties has recently taken place (Haleem et al., 2022).


    The employment of increasingly smart robots in a broader variety of tasks has
    been made possible by recent developments in robotics and automation systems that
    have increased their competence (Hajimahmud et al., 2022).


    The ability to grasp multiple distinct morphological features is crucial for robotics
    to achieve more versatile functions. The spatial capabilities of public robotics
    can be implemented to identify mechanical end-sensor layouts and to directly and
    securely hold and carry heavy objects without sliding (Mayoral-Vilches, 2022).


    The robotics sector has emerged over the past 50 years. However, the creation
    of robots frequently lacks cybersecurity risks, which is typically a sign that
    a system remains in its infancy. Automated cybersecurity is often confused with
    automated protection.


    The majority of these devices, from commercial to customers to expert robots,
    are vulnerable to security assaults. Security is a fundamental priority for both
    designers and the current regulations. Privacy is not considered significant (Tuomas,
    2022).


    A single safety and protection risk framework was created as a consequence of
    the convergence of these sectors from a value perspective. Cybersecurity aims
    to protect networks from threats offered by bad attackers, while robotic safety
    is often defined as building preventive procedures for incidents or defects, as
    shown in Figure 10.1.


    Another viewpoint is that privacy concerns defending the robots from a different
    area, while protection concerns defending the surroundings from a specific robot
    (Bhardwaj et al., 2022).'
