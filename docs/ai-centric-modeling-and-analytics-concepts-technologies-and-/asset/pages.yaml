- pgno: 97
  md: 'This demonstrates how the presence of peer feedback gives students opportunities
    to learn from one another, motivates them to actively clarify their ideas as they
    explain their work to the peers who corrected their writing, enjoys the challenge
    that the lecturer provided, and increases their interest in learning better interactive
    speaking by comparing and contrasting their work with AI chatbots.


    The sixth indicator of student engagement was participation in sharing the topic
    in the classroom and providing feedback.


    Almost all of them shared ideas or arguments during class discussions. They were
    confident in delivering their opinions on their friends’ work, asking about their
    difficulty, expressing their opinions without feeling shy, and giving suggestions
    regarding the error.


    The researcher suggested that this indicator could also explore some aspects in
    detail that might have been ignored when they did the previous indicator (giving
    a friend’s work feedback).


    This indicator had a positive impact on their speaking by letting them know the
    importance of certain ideas as well as information and inviting them to speak
    up as they had a chance to participate through a whole-class discussion.


    Similarly, the use of nonverbal cues, such as emoticons and memes, as well as
    multimedia materials, such as movies, increased participant engagement (P2), demonstrating
    the multimodal character of contemporary computer-mediated communication (instant
    messaging and social networking).


    Because potential users will demand multimodal communication, this component may
    be especially important for younger generations and has strong ramifications for
    future chatbot designers.


    In terms of gender, it appeared that the female participants paid greater attention
    to and showed greater appreciation for the use of inclusive design and language.
    The results of the thematic analysis showed that they questioned their conversation
    partners more than their male counterparts regarding gender and social minority
    concerns (P4).


    According to a recent study on chatbot design and gender stereotyping (Hsu & Mu-Sheng,
    2022), the majority of voice-based conversational agents (Alexa et al., etc.)
    are meant to be female. The female participants were generally highly forceful
    and worried about the possibility of such gender stereotypes being replicated
    in the digital environment.


    Some participants expressed serious concerns about data privacy as a result of
    some chatbots. In particular, Replika and Kuki repeatedly requested for their
    consent to access their social media accounts and utilize their cameras for video
    calls. The majority of participants expressed worry about the storage and manipulation
    of their personal data, and hence declined to give authorization.


    They also demonstrated that this might pose a significant barrier to the usage
    of chatbots by young language learners. The conclusion for chatbot developers
    is that data privacy and safety must be prioritized in chatbot design, especially
    if they are directed at young learners or utilized in education (Bhambri et al.,
    2022).'
