    # 10.4 PERFORMANCE EVALUATION


    We proposed the BH-ANN. The experiment used security, sensing level, robustness,
    and implementation cost. Existing methods, such as IoT, AI, and cloud computing,
    are compared to the proposed work (Khang et al., 2023b).


    # 10.4.1 SECURITY


    Because of the ongoing development of robotic systems and the rise in security
    and safety threats and issues, the interdisciplinary field of robotics security
    is becoming more relevant and significant (Khang et al., 2022).


    According to the local police, robots can patrol the streets. They received training
    to recognize and apprehend all street criminalities, as shown in Figure 10.3.


