    3.11 co-authored per document were identified, and 3.472% of international co-authorships
    were found. The information contained various materials, including articles, books,
    book chapters, and conference papers.


    The maximum contribution was found in a conference paper (i.e., 565), whereas
    the minimum contribution was from a short survey (i.e., one shown in Table 15.1).


