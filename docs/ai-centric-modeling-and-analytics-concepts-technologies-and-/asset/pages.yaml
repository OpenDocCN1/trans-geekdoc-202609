- pgno: 214
  md: 'm = beta 1* m + (1- beta 1)* gradient    (11.2)


    v = beta 2* v + (1- beta 2)* gradient ²    (11.3)


    where beta 1 and beta 2 are the two hyper-parameters, commonly set as 0.9 and
    0.999, respectively.


    It should be noted that the Adam optimiser uses an exponentially weighted moving
    average; therefore, the most recent gradient has a higher weight than the older
    gradients.


    # 11.5.2 SIGMOID (ACTIVATION FUNCTION)


    The sigmoid activation function is a specific type of activation function that
    uses the sigmoid function as its mathematical formula (Papers with Code, 2023).
    The function f(x) = 1 / (1 + e^{-x}) is called sigmoid function. When the output
    of a neural network reflects a probability or a binary choice, this function is
    frequently utilised at the output layer of the network, as shown in Figure 11.1.


    The output of the sigmoid function, which ranges from 0 to 1, may be considered
    the likelihood that the input belongs to a certain class. The output value is
    also helpful when attempting to train the model using the backpropagation approach
    because it is simple to calculate the gradient of the sigmoid function.


