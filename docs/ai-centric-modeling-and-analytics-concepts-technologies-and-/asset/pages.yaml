  md: 'This Lozinskii measure (2023) is mieу with respect to the norm of the block
    matrices B12 and B21, which are the operator norms.


    Hence, $g_1$ and $g_2$ are reduced to Equation 7.30:


    $$\begin{aligned}

    g_1 &= -d_1 - \beta I + \frac{E''}{E} \\

    g_2 &= -d_1 + \alpha + d_2 + \frac{E''}{E}

    \end{aligned} \tag{7.30}$$


    Thus


    $$\mu(B) \leq \sup\{g_1,g_2\} \leq \frac{E''}{E} - d_1 + \sup\{-\beta I, d_2+\alpha\}$$


    Hence, $\mu(B) \leq \frac{E''}{E} - d_1$; thus


    $$\int_0^t \mu(B)\,dt \leq \left(\log E(t)-d_1t\right)$$


    Hence, finally as Equation 7.31


    $$\bar{q}_2 = \frac{\int_0^t \mu(B)\,dt}{t} < \frac{\log E(t)}{t} - d_1 < \frac{d_1}{2}
    - d_1 < 0 \tag{7.31}$$


    Therefore, the criteria $\bar{q}_2 < 0$ is satisfied. Hence, the endemic equilibrium
    of the system is globally stable.


    # 7.6 RESULTS AND DISCUSSION


    The analytical results cannot be proven without numerical simulations. These figures
    explain the behavior of the model in different populations during COVID-19.


    The deviation of the populations with respect to time for the parameters is shown
    in these figures. AI techniques are being developed to detect COVID-19 and to
    determine the stability of the disease. The major objective is visualization to
    control infections caused by COVID-19.


    Based on different situations during the COVID-19 period, we used different parameters
    with the help of AI techniques. The COVID-19-free equilibrium point was stable
    for $R_0 < 1$ (Figure 7.3).


    The best uses of the combined effect of isolation and exposure are displayed in
    the figures. As a result, the quarantine/hospitalization rates after using AI
    in the exposed population decreased, as shown in Figure 7.4.


    This figure indicates that the exposed population quickly survived and went to
    quarantine if they experienced some illness symptoms, as shown in Figure 7.5.'
