  md: '# 14.7.2.5  **Information Segregation and Classification**


    Not-so-clean data become difficult to handle and cannot provide business insights.
    Intelligent bots using NLP can serve the purpose of text classification in the
    following ways:


    +   - Automatically detect spam in the email and transfer it to the respective
    folder.

    +   - Vital information on a candidate’s resume, such as education, skills, and
    work experience, can be automatically extracted using NLP-enabled bots.

    +   - Intelligent bots can interpret customer responses or feedback and automatically
    suggest corrective actions (Shanee et al., 2020). For example, if the customer
    sends a message, ‘The product is awesome but too expensive’, the information that
    could be inferred would be the customer is interested, but the cost is a concern.
    In this case, emails can be sent to customers at discounted prices.

    +   - Intelligent bots can effectively transfer tickets raised by customers regarding
    any issue for a transaction or service to respective departments or persons. This
    would help improve customer engagement and satisfaction.


    Natural language processing plays an important role in business operations (Shruti
    et al., 2017) in the following ways:


    +   - **Financial domain and banking institutions:** Market data analysis can
    be performed using NLP, thereby helping banks and other financial institutions
    in optimal strategy design for better output. In addition, NLP can be used for
    fraud detection and identifying illegal transactions.

    +   - **Insurance domain:** Claim settlement and false claim identification are
    the major concerns of insurance companies that can be complemented by NLP and
    RPA. Natural language processing can analyze the doubtful communications of fraudulent
    customers, thereby flagging financial fraud and, in some cases, preventing it.
    Automatic feature extraction using RPA and NLP can help insurance companies outsmart
    their competitors and develop effective strategies and product planning (Jianwei
    & Haixia, 2022).

    +   - **Retail domain:** Customer behavior can be automatically analyzed to provide
    insights into the sentiments and behaviors of customers. This can help retailers
    make better and quicker decisions about products, pricing, drives, etc. Streamlined
    and need-based information can be fed to customers so that their needs are identified
    and automatically satisfied, thereby increasing their foot count.

    +   - **Healthcare domain:** Symptomatic and diagnostic treatments can be provided
    to patients on a timely basis using automated analysis of the communications they
    performed through emails, help lines, chatbots, and interactions. These activities
    can be performed by using NLP along with automation tools (Khang et al., 2024b).'
