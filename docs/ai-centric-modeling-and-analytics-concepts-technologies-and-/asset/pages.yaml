    # 6.4 NATURAL LANGUAGE PROCESSING: TEXT SIMILARITY AND SEMANTIC ANALYSIS


    Text similarity in NLP determines the degree of closeness between two or more
    text corpora. This degree of closeness can be established either at the surface
    or deep down, referring to the context and meaning of a text corpus.


    Accordingly, it can be a plain text similarity or semantic analysis in NLP. In
    terms of text similarity, various similarity metrics have been proved to be effective
    (Liang & Zhang, 2021).


    Dense vectors are one of the standard approaches for the conversion of language
    to a machine-readable format. An example of understanding the concept is shown
    in Figure 6.2.


    Using this approach, words with similar meanings will have close proximity or
    a similar orientation in terms of vectors. Although there are many, the three
    most popular metrics to find the similarity index are as follows:


    +   - Euclidian distance

    +   - Dot product

    +   - Cosine similarity


    # 6.4.1 EUCLIDIAN DISTANCE


    Euclidian distance is a basic mathematical technique that is used to find the
    shortest distance between two points.


    When seen from the context of NLP, these two points represent two vectors and,
    in turn, these two vectors represent two separate texts. Therefore, the objective
    here is to determine the similarity between the two texts by determining the closeness
    between the corresponding vectors.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'As an illustration, consider the following three vectors, as shown in Equation
    1.3:


    $x = \begin{bmatrix}0.02\\0.05\\0.3\end{bmatrix}\quad y = \begin{bmatrix}0.02\\0.06\\0.33\end{bmatrix}\quad
    z = \begin{bmatrix}0.91\\0.86\\0.7\end{bmatrix}\tag{1.3}$


    Vectors $x$ and $y$ are placed closer as opposed to $y$ and $z$ or $z$ and $x$.
    Mathematically, the same can be verified by applying the formula for the Euclidian
    distance, which is given by Equation 1.4:


    $d(a,b)=\sqrt{\sum_{i=1}^{n}(a_i-b_i)^2}\tag{1.4}$


    When applied to vectors $x$ and $y$ as Equations 1.5 and 1.6


    $d(x,y)=\sqrt{\sum_{i=1}^{n}(x_1-y_1)^2+(x_2-y_2)^2+(x_3-y_3)^2}\tag{1.5}$


    $d(x,y)=\sqrt{\sum_{i=1}^{3}(0.02-0.02)^2+(0.05-0.06)^2+(0.3-0.33)^2}\tag{1.6}$

    $= 0.031$


    Similarly, Equations 1.7 and 1.8


    $d(y,z)=\sqrt{\sum_{i=1}^{3}(0.02-0.91)^2+(0.06-0.86)^2+(0.33-0.7)^2}\tag{1.7}$

    $= 1.25$


    $d(z,x)=\sqrt{\sum_{i=1}^{3}(0.91-0.02)^2+(0.86-0.05)^2+(0.7-0.3)^2}\tag{1.8}$

    $= 1.268$


    establish the fact that $x$ and $y$ are nearer in Euclidian space.


    # 6.4.2 Dot Product


    The Euclidian distance concept is magnitude oriented; on the other hand, the concept
    of a dot product considers both magnitude and orientation.


    But why consider orientation at all if magnitude works fine? This is because vector
    magnitude is the indicator of word frequency. Now, if we have the word “hello”
    appearing 50 times and “hi” appearing two times, they may not be similar in machine
    learning because of their frequency, and hence vector magnitude.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'However, if one more parameter of orientation is added, then some degree of
    closeness can be marked. This is achieved by dot product. The dot product is calculated
    as shown by Equation 1.9:


    $$u \cdot v = \lVert u \rVert \lVert v \rVert \cos \theta$$


    A higher orientation between vectors will produce a higher dot product.


    # 6.4.3  COSINE SIMILARITY


    The shortcoming of the dot product approach lies in its limitation to normalize,
    which is very well addressed in the cosine similarity method. Similarity between
    two-word vectors can be calculated by Equation 1.10:


    $$\operatorname{Sim}(x,y)=\frac{x\cdot y}{\lVert x\rVert\lVert y\rVert}=\frac{\sum_{i=1}^{n}x_i
    y_i}{\sqrt{\sum_{i=1}^{n}x_i^2}\sqrt{\sum_{i=1}^{n}y_i^2}}$$


    All methods are heavily used in NLP using Sklearn implementation.


    # 6.5  SEMANTIC ANALYSIS


    Semantic analysis in NLP deals with capturing the meaning of a natural language
    rather than only finding the similarity of words (Elnagar et al., 2021).


    Semantic analysis is a deeper technique, as it takes into account the context,
    grammar roles and logical structuring of the sentences. It detects emotion and
    sarcasm in the text and extracts meaningful inferences while looking for the dictionary
    meaning of the words in the sentence.


    If the meaning is similar, the words are classified as similar even if they have
    entirely different forms from the alphabet (i.e., spelling). Semantic analysis
    can be divided into two parts: lexical semantic analysis and compositional semantic
    analysis.


    Lexical semantic analysis involves fetching the dictionary meaning of a word in
    a given text corpus. Therefore, lexical semantic analysis works at the word level.
    On the other hand, compositional semantic analysis is a step forward.


    To understand a text, understanding each individual word is a pre-requisite, but
    because of ambiguities in the language, the context, scenario and sentiment must
    also be completely understood to understand a phrase, sentence or document.


    Consider the following texts:


    +   - Text 1: Bitcoin is not declared a legal tender.

    +   - Text 2: Legal tender of the bridge is declared.'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'Despite the fact that the presented two texts have similar root words (declared,
    legal and tender), they convey entirely different meanings.


    The task of compositional semantic analysis is to extract the exact meaning of
    similar root words. Processes, such as relationship extraction and word sense
    disambiguation, are often used to accomplish this task.


    # 6.6 PROBABILITY MODELS IN NATURAL LANGUAGE PROCESSING


    # 6.6.1 Hidden Markov Model


    Markov model tells about the probabilities of the sequences of random variables.
    These variables are often referred to as states. In the context of NLP, the states
    are individual tokens, which can be unigrams, bigrams, trigrams, etc. To illustrate,
    consider a text vocabulary of three unigrams, as shown in Figure 6.3.


    Figure 6.3 depicts the probability of the sequences of the unigrams. For each
    state, the probability of the next state is defined by the transition probability
    matrix in the Markov model. Because there is a connection between each state,
    the transitional probability matrix is a square matrix, as shown in Equation 1.11:


    P(a red apple) = P(a) × P( red | a ) × (apple | red ) (1.11)


    It should be noted that the true probability is different from the probability
    of the Markov model. For the case shown in Figure 6.2, the true probability is
    given by Equation 1.12:


    P(a red apple) = P(a) × P(red | a) × ( apple | a, red ) (1.12)


    Therefore, the Markov model simplifies the assumption that the probability of
    a subsequent token will only depend on the previous token, not considering the
    historical tokens but only the immediate previous one.


    Thus, it can be concluded that the Markov chain is particularly useful when computing
    a probability for a sequence of text. Much research has been carried out on spam
    and ham email segregation, which proves that the hidden Markov model (HMM) outperforms
    the traditional naive Bayes-based algorithms (Independent University, 2017).


    Nevertheless, it is often required to determine some hidden text property, for
    instance, whether a word is a noun, adjective or some other part of speech. As
    with actual words, these parts of speech are hidden, so some observations are
    required that are mapped back to these hidden states. This is where the HMM is
    presented.


    An HMM considers the temporal relationships between hidden states and how these
    hidden states exhibit observations. Because it is more likely that a noun is followed
    by a verb rather than by an adjective and an adjective is followed by a noun rather
    than by a verb, this kind of transitional probability structure is proved to be
    very useful in tagging the text with hidden states.


    The process of finding the most probable sequence of hidden states from the observation
    sequence is known as decoding, as shown in Figure 6.4.'
  merge: -1
  img_proc: true
