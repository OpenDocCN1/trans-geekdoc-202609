    # 18.5 RESEARCH GAP ANALYSIS


    In this section, the most common issues related to SBD and cyberbullying detection
    in OSNs, as well as future research directions, are discussed.


    +   - The collection and analysis of huge amounts of data and unbiased datasets
    with user profiles and other content for real-time SBD techniques are challenging.

    +   - Scalability is another challenge in validating the effectiveness of DL models
    because of the growing rate of OSN data.

    +   - There are many OSNs; however, researchers have proposed models only for
    commonly used social networks.

    +   - Using an existing dataset is a challenge.

    +   - Another important challenge is the lack of a security system to protect
    user activities in most spam-attacked networks (Khang et al., 2022).

    +   - All countries use OSN of different languages that also comprise tweets or
    spam bots of different languages. These tweets of different languages should also
    be detected using various techniques.

    +   - Researchers have also noted that spam bots can communicate with other accounts,
    post tweets on various topics, and behave like humans.

    +   - It is noticed from the literature review that the interaction of users in
    OSNs is updated because of the use of different slang and languages.

    +   - In noisy text, SBD is a challenging task because of sparseness issues and
    irresponsibility for language use on OSNs.

    +   - Analysis of the computational time and time complexity of the proposed method
    is a major challenge when considering the method to be more effective in detecting
    spam bots and cyberbullying.


    # 18.6 OUTCOME OF LITERATURE SURVEY


    The proposed systematic review provides a clear explanation for spam bot and cyberbullying
    detection in OSNs using various DL techniques.'
