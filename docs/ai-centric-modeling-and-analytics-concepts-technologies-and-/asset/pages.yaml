    # 6.8.3 Recurrent Neural Network


    Recurrent neural networks (RNNs) are a class of ANN that are extensively exploited
    in the fields of NLP, speech recognition, language translation and many more.


    With sequential and time series data as the foundation, RNN is the appropriate
    choice for temporal and ordinal applications, such as NLP.


    In contrast to CNN, where the information flow is unidirectional, RNN incorporates
    feedback loops, such as backpropagation through time (BPTT) to ensure a constant
    supply of information. These bidirectional recurrent neural networks (BRNNs) predict
    the future based on forward projections and evaluate the past based on backward
    projections (Rana et al., 2021).


    To facilitate reinforcement learning in an RNN, the weights that are fixed for
    a specific layer are continuously adjusted during the process of backpropagation
    and gradient descent; the gradient is the slope of the loss function.


    Owing to the functioning of the RNN, where the parameters are shared across the
    layers, the BPTT sums up the errors at each time step. The current trend in geotagging
    on social media platforms has led to location-specific sentiment analysis using
    RNN (Qi et al., 2019).'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'A vivid variety of applications, such as machine translation, medical text
    interpretation (Mugisha & Paik, 2021), music generation and sentiment classification,
    can be addressed with different types of RNNs. In addition to BRNN, another popular
    RNN architecture is long short-term memory (LSTM).


    This RNN architecture is a rescue to the vanishing gradient problem commonly observed
    in deeply layered networks for complex datasets. The LSTM network addresses the
    issue encountered when RNNs grow bigger and more complex, especially those based
    on gradient-based learning methods (Khang et al., 2023a).


    Long short-term memories have played a pivotal role in critical NLP concerns,
    such as privacy and security issues related to language-based applications (Feng
    et al., 2020). These are well integrated with Internet of Things platforms to
    address security and privacy violations (Breve et al., 2022).


    Long short-term memory-based RNNs essentially segregate the data based on short-term
    and long-term memory, which means that LSTM has cells in the hidden layers with
    three gates vis-à-vis the input gate, output gate and forget gate, controlling
    the required information flow to make predictions (Liang & Zhang, 2021).


    A precision as high as 0.94 is achieved by LSTM for fake news detection by employing
    RNNs. In addition, sentiment analysis of customer reviews is another popular application
    for business decision-making (Houssein et al., 2021; Jain et al., 2022).


    # 6.9 CONCLUSION


    The blockchain integration of NLP is an emerging trend that is gaining interest
    in the NLP community (Shahbazi & Byun, 2021). The integration of blockchain technology
    and NLP can lead to new opportunities for secure and transparent data sharing,
    decentralized applications and new business models (Khang & Khang, 2021).


    Here are some potential future trends in which blockchain integration can be beneficial
    for NLP:


    +   - **Secure data sharing:** One of the main benefits of blockchain technology
    is its ability to securely store and share data. In the context of NLP, this can
    be used to securely store and share sensitive data, such as medical records or
    financial data (Khang et al., 2024).


    +   - **Decentralized applications:** Blockchain technology can facilitate the
    development of decentralized NLP applications, which can be more resistant to
    censorship and provide a more transparent user experience.


    +   - **Transparency in data usage:** With blockchain technology, data ownership
    and usage can become more transparent. This can be beneficial for users who want
    to know how their data are being used and can also help researchers access more
    data for their studies.


    +   - **Smart contracts:** Smart contracts can be used to automate and enforce
    the terms of data sharing agreements in the context of NLP. This can ensure that
    the data are only used for agreed-upon purposes and can help prevent misuse.'
