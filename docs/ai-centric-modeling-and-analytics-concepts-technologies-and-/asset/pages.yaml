  img_proc: true
- pgno: 142
  md: 'Artificial intelligence has established a hypothesis change in healthcare.
    This is applicable in the medical field to combat viruses.


    The use of AI software can accelerate the diagnosis and tracking of COVID-19 patients
    to reduce the burden on healthcare. Several authors have presented mathematical
    models for combating diseases (Bimal et al., 2020; Aswin et al., 2021; Bimal et
    al., 2021; Binayak et al., 2021; Jangyadatta et al., 2021).


    Mathematical models for virus propagation are valuable tools for understanding
    the behavior of viruses and for quantitatively making control decisions and preventive
    measures.


    Artificial intelligence tools are used for epidemiological forecasting, control,
    and prediction. In this chapter, we propose a mathematical model-based framework
    for AI to combat COVID-19.


    The rest of the chapter is organized as follows:


    +   - In section 1.2, we present the nomenclature for the considered parameters.

    +   - In section 1.3, we discuss the mathematical assumptions by comparing them
    with the AI-based framework.

    +   - In section 1.4, we discuss the formation of the mathematical model, present
    the positivity boundedness of the model, and derive the basic reproduction number.

    +   - In section 1.5, we analyze the stability of the equilibrium point in both
    the COVID-19-free equilibrium and endemic equilibrium points.

    +   - In section 1.6, we discuss the results of the model.

    +   - Conclusions are presented in section 1.7.


    The nomenclature and pictorial form of situations are explained as follows. Let
    S(t), E(t), I(t), Q(t), and R(t) represent the susceptible, exposed or not infected
    but can become infected, isolated, quarantined, and recovered populations with
    time t, respectively.


    The number of persons being added from migration, immigration, or new birth is
    assumed to be constant at rate A.


    +   - The contact rate of the COVID-19 transmission is β.

    +   - The exposed population can become infected at rate μ.

    +   - Confirmed infected people are isolated or hospitalized for treatment at
    rate α .


    At rate δ, people undergo quarantine/isolation and take medicines to be free from
    the disease.


    +   - Natural death during the COVID-19 pandemic is represented by d₁, whereas
    death due to COVID-19 is represented by d₂.

    +   - The world’s population is represented by N.

    +   - The nomenclature is explained in terms of mathematical symbols.


    # 7.2 NOMENCLATURE


    These figures explain that during the COVID-19 pandemic, AI techniques played
    an important role in tracing, screening, testing, and diagnosing the disease without
    having any contact with people, as shown in Table 7.1.'
