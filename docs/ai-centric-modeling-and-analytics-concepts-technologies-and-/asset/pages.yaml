    indicate that American countries are leading from the front, but Europe and Asia
    are still catching up with their approach. A European country’s (Germany) average
    article citations are at the top.


    # 15.5.6 Objective 6: To Investigate Scientific Production by Sources and Dissemination
    by Sources


    While investigating scientific production by source (journals), 433 journals were
    identified with published articles related to AI in tourism/hospitality/scientific
    journals.


    These sources were identified based on their impact (“H-index,” “G-index,” “M-index,”
    and “total citations”) since their inception.


    *International Journal of Contemporary Hospitality Management* started in 2002
    and published 17 publications; it has an H-index of 10 and total citations of
    531.


    *Tourism Management* began in 2003, has an entire citation (i.e., 975), and the
    same H-index (i.e., 10) but published less than the former.


    *Annals of Tourism Research* ranked third in the top 20 sources list, which started
    publishing in 2019 but has an H-index and G-index of 7 and an M-index of 1.757,
    higher than the top two journals with a total citation of 437. These three sources
    cover the hospitality and tourism area of articles.


    In contrast, *Expert Systems with Applications*, which is not related to hospitality
    and tourism, published the current area of articles and started publishing in
    2009 with the same H-index and G-index of 7 and has less M-index (i.e., 0.5) but
    with maximum total citations (i.e., 996).


    However, it has fewer publications; only seven are exhibited in Table 15.2. Recently,
    an upward trend has been seen in *Sustainability (Switzerland)* publications in
    the current area of research.


