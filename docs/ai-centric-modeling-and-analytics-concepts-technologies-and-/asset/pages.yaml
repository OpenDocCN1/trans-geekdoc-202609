  md: 'For the purpose of this study, the URL length, parameter length, and domain
    length are further classified as basic, high, higher, and highest, depending on
    the data distribution.


    However, after feature selection to identify the most significant attributes out
    of 112, the identified features were employed for predictive analytics in the
    third phase of this study.


    The selected attributes do not require pre-processing, as the set has been annotated
    and labeled for a supervised machine learning task.


    # 17.3.2 EXPLORATORY DATA ANALYSIS


    The initially selected 11-no attributes were evaluated using statistical analysis
    of the interquartile range (IQR) through the box plot and correlation analysis
    using the heat map plot.


    However, IG was employed to identify the most significant attributes, out of the
    entire 112, for the detection of phishing or legitimate websites during the machine
    learning phase.


    The IQR serves as a gauge for where a dataset’s “middle 50” lies, just as it measures
    where the majority of the values lay. Data points in the dataset are first organized
    in ascending order from the smallest to the largest, and then the first and third
    quartile locations are used, as computed in Equations 17.1 and 17.2, to calculate
    the entire range:


    Q1 = { (n+1)/4 }th (17.1)


    as the most centered value in the first half of the rank-organized dataset, as
    computed in Equation 17.2:


    Q3 = { 3(n+1)/4 }th (17.2)


    as the most centered value in the second half of the rank-organized dataset. Q2
    is the median and computed as Equation 17.3: Q2 = Q3 − Q1 (17.3)


    By altering a dataset, IG is the decrease in entropy or surprise and is determined
    by contrasting the dataset’s entropy before and after a change. For the website
    data with C ground truths as Equation 17.4: E = − Σ_{i}^{C} p_i log 2 p_i (17.4)
    where p_i is the likelihood that a class i element will be chosen at random (i.e.,
    the proportion of the dataset made up of class i).'
  merge: -1
  img_proc: true
- pgno: 338
  md: 'The correlation coefficient (ρ) is a metric that assesses how closely the movements
    of two different variables are related, with range of potential values from −1.0
    to 1.0. Therefore, the numbers cannot be more than 1.0 or lower than −1.0.


    A perfect negative correlation is represented by a correlation of −1.0, and a
    perfect positive correlation is represented by a correlation of 1.0. A positive
    link exists between the status of a website and any of the 112 attributes if the
    correlation coefficient between them is greater than zero.


    However, a negative association exists if the value is less than zero. If the
    value is zero, then there is no correlation between the two variables. Before
    determining the correlation, the covariance of the two variables must first be
    calculated, and hence, the standard deviation of each variable.


    By dividing the covariance by the sum of the standard deviations of the two variables,
    the correlation coefficient was computed as Equation 17.5:


    ```

    $$\mathrm{Correlation}=P=\frac{\mathrm{COV}(x,y)}{\sigma_X\sigma_Y}\tag{17.5}$$

    ```


    where X and Y are the attribute and ground truth, respectively.


    The IQR and correlation evaluation analysis, through box and heat map plots, were
    implemented using the object-oriented Python programming libraries of Seaborn,
    Matplotlib, and DataFrame in a Jupyter notebook.


    The IG computation for feature selection was implemented using the Orange data
    mining toolkit (Borondics et al., 2020) with Python libraries. The result of feature
    selection determines the dataset features that will be used to train the algorithm
    for the next phase of the conceptual framework.


    # 17.3.3 Predictive Analytics of Uniform Resource Locators


    This subsection describes the supervised machine learning approach of the conceptual
    framework for detecting phishing in website URLs.


    The machine learning algorithms to be trained with the prominent parameters emerging
    from the IG analysis are presented and discussed.


    The training set, which consists of the prominent parameters returned by IG, is
    used to train the learner algorithms of NB and a neural network.


    Bayes theorem and strong (naive) independence assumptions between the features
    serve as the foundation for the collection of simple probabilistic classifiers
    known as NB (Olaleye et al., 2023). The mathematical model of the supervised NB
    learning is presented as follows.


    # 17.3.3.1 Naive Bayes Mathematical Model


    The NB algorithm assumes that all independent variables are conditionally independent
    given the response variable.


    +   - **Y**: the target variable (1 if the URL is phishing; 0 if otherwise)

    +   - **X1, X2, …, X11**: the URL predictive attributes to approximate the target
    variable **Y**'
