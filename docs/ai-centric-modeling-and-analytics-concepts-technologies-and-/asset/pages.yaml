    # 16.3.1 EXPONENTIAL DECAY AND LOGISTIC MODELS FOR REMOVAL OF PHENOL


    First, the adsorption of phenol in the presence of rutile-phase TiO₂ nanoparticles
    was considered. To evaluate phenol adsorption in the presence of TiO₂ nanoparticles,
    we performed an experiment.


    The amount of phenol remaining in the solution was measured after 2 hours of phenol
    adsorption. We used an exponential decay and a logistic model to estimate this
    process.


    Further information on these models can be found in any mathematical modeling
    or calculus book (Hughes-Hallett et al., 2009). For both simulations, we estimated
    the amount of phenol in the solution after adsorption for reference values of
    TiO₂.


    The results for the exponential model are as follows:


    The exponential growth or decline model assumes constant growth rate (Equation
    16.1):


    $$\frac{dP}{dt}=cP\tag{16.1}$$


    where P is the population at time t, and c is the constant. The solution of Equation
    16.2 is


    $$P(t)=P_0e^{ct},\ t\ge 0\tag{16.2}$$


    where P₀ is the initial population, P(t₀)=P₀.


    The time required for the complete removal of phenol from a 1 mg L⁻¹ phenol solution
    with the addition of TiO₂ is shown in Figure 16.6.'
