  md: '# 11.7.2 EVALUATION OF MODELS USING CONFUSION MATRIX


    Models are evaluated using confusion matrix, loss vs. epoch curve, accuracy vs.
    epoch curve, classification report, and model training time.


    # 11.7.2.1 Confusion Matrix


    A table called a confusion matrix is used to describe the performance of a classification
    system. It is used to quantify the accuracy of model predictions (Mohan & Manas,
    2015).


    Typically, the matrix is shown in a 2 × 2 arrangement, with the columns representing
    the anticipated values and the rows indicating the real values. The diagonal members
    of the matrix reflect the number of accurate forecasts, whereas the off-diagonal
    components represent the opposite.


    When many cells of the matrix are colour-coded to reflect various values, a confusion
    matrix is also referred to as a heat map. The heat map will help understand the
    performance of the model and spot trends in the data.


    For instance, in a binary classification job, a heat map may be made with true
    positives (TPs) represented by a green colour, false negatives (FNs) by a red
    colour, false positives (FPs) by a yellow colour, and true negatives (TNs) by
    a blue colour.


    This type of visualisation makes it easy to identify where the model is making
    errors, such as a large number of red cells, indicating a high number of FNs.
    It can also help identify patterns in the data, such as a large number of yellow
    cells, indicating that the model is biased towards one class.


    # 11.7.2.2 Loss vs. Epoch Curve


    It is a curve used to assess how well a model performs during training (Gershoni,
    1979). The loss function value is plotted on the y-axis, and the number of training
    iterations (or “epochs”) is plotted on the x-axis. Loss reduction over time demonstrates
    model learning and improvement.


    # 11.7.2.3 Accuracy vs. Epoch Curve


    The accuracy vs. epoch curve is a plot used, like loss vs. epoch curve, to assess
    how well a model performs during training (Gershoni, 1979). The y-axis shows the
    accuracy of the model, while the x-axis shows the number of training steps (or
    “epochs”). Accuracy improvements over time show that the model is being developed
    and learned.


    # 11.7.2.4 Classification Report


    The results of the classification model on a test dataset for which the real values
    are known are summarised in a classification report. Every class in the dataset
    offers several assessment measures, including the accuracy, recall, and F1 score.


    Precision measures the ratio of accurate positive forecasts to all the positive
    predictions. Recall is the ratio of correctly predicted positive outcomes to all
    positively observed outcomes. The F1 score, which measures the harmony between
    accuracy and recall, is the harmonic mean of these two metrics.'
