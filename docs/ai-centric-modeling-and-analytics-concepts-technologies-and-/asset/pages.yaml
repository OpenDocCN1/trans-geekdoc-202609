  md: '# 9.1.4 MACHINE LEARNING IN INTERNET OF MEDICAL THINGS


    Machine learning (ML) is an additional method for protecting IoMT systems.


    In addition, when compared to traditional authentication techniques, a detailed
    assessment of existing IoMT system security procedures and attacks is required
    because of advancements in IoMT system security defense techniques, as well as
    new attack types. Hence, it analyses state-of-the-art security and attacks on
    IoMT system strategies (Blazek et al., 2022).


    Our main contributions are summarized as follows:


    +   - In this chapter, we will look at the security requirements for IoMT systems,
    as well as a number of methods for gathering, sending, and storing data in a secure
    manner.

    +   - We discuss the security measures that are now available and how well they
    stand up to different types of attacks. According to our argument, no method can
    completely protect against the vast majority of known attacks on these systems.

    +   - We examine the attack surface of IoMT and show how these security mechanisms
    can thwart various assaults. This chapter lists the current attacks that have
    been launched against IoMT systems.

    +   - We offer a security architecture for IoMT systems that incorporates some
    properties of this technique. The security of IoMT systems is addressed by this
    framework during data collection, transmission, and storage. In our framework,
    we consider the constraints on these devices.


    The remainder of this chapter is organized into five parts.


    +   - Section 1.2 explains the present method and its drawback of data security
    techniques in IoMT.

    +   - Section 1.3 explains the proposed techniques in data privacy in IoMT with
    better ML support vector machine (SVM) techniques.

    +   - Section 1.4 presents the experimental results and their graphical analysis.

    +   - Section 1.5 provides a conclusion.


    # 9.2 LITERATURE REVIEW


    This section discusses the existing systems and techniques used for data privacy
    in the IoMT healthcare system.


    Various authors have discussed several strategies for securing IoMT. Data encryption
    is a fundamental strategy for protecting IoMT. The receiver is subsequently given
    access to the public channel to receive cipher text.


    The recipient then decrypts the message. There are various methods for encrypting
    the data. A lightweight end-to-end key management technique was created because
    of resource constraints and privacy concerns (Singh et al., 2020), where keys
    are exchanged while utilizing the fewest resources possible.


    The proposed protocol offers both high-security features and limited resources
    from a security perspective. Given the characteristics of IoT, Aman et al. (2021)'
