- pgno: 149
  md: 'Hence, by applying the Routh–Hurwitz condition, it is locally asymptotically
    stable.


    # Theorem 2


    If the basic reproduction number $R_0 < 1$, then the COVID-19-free equilibrium
    is globally asymptotically stable.


    Proof: Consider the Thieme Horst and Lyapunov (2011) Equation 7.18:


    $M = \mu E + (d_1 + \mu) I$

    $\Rightarrow \frac{dM}{dt} = \frac{\mu dE}{dt} + \frac{(d_1 + \mu) dI}{dt} \tag{7.18}$

    $\Rightarrow \frac{dM}{dt} = (d_1 + \mu)(d_1 + d_2 + \alpha)(R_0 - 1) I$


    If $R_0 < 1$, then $\frac{dM}{dt} < 0$ and $\frac{dM}{dt} = 0$ only if $I = 0$
    or $R_0 = 1$. Thus, by LaSalle’s invariance principle, the set is globally asymptotically
    stable in the region $\Omega_0$.


    # 7.5.2 STABILITY ANALYSIS OF THE ENDEMIC EQUILIBRIUM


    For the stability analysis for endemic equilibrium for $\Omega^* (S^*, E^*, I^*,
    Q^* R^*)$, we solve the simultaneous system of Equation 7.19:


    $S^* = \frac{1}{R_0}$


    $E^* = \frac{A}{(d_1 + \mu)} \left(1 - \frac{1}{R_0}\right)$


    $I^* = \frac{\mu (R_0 - 1)}{\beta} \tag{7.19}$


    $Q^* = \frac{\alpha d_1 (R_0 - 1) \beta}{(d_1 + d_2 + \delta) \beta}$


    $R^* = \frac{\alpha \delta (R_0 - 1)}{(d_1 + d_2 + \delta)}$


    # Theorem 3


    If $R_0 > 1$, then system (2) has a unique endemic equilibrium $\Omega^* (S^*,
    E^*, I^*, Q^*)$, which is locally asymptotically stable.


    Proof: In linearization of Equation 7.20, the Jacobian of the matrix is


    $\Omega^* = \begin{pmatrix} -d_1 - \beta I^* & 0 & -\beta S^* & 0 \\ \beta I^*
    & -(d_1 + \mu) & \beta S^* & 0 \\ 0 & \mu & -(d_1 + d_2 + \alpha) & 0 \\ 0 & 0
    & \alpha & -(d_1 + d_2 + \delta) \end{pmatrix} \tag{7.20}$'
