- pgno: 150
  md: 'The eigenvalues are $\lambda = -(d_1 + d_2 + \delta)$.


    The other three eigenvalues in solving the cubic equation are $\lambda^3 + A\lambda^2
    + B\lambda + C = 0$ where


    $A = \beta I^* + 3d_1 + d_2 + \alpha + \mu$

    $B = 3d_1^2 + 2d_1\mu + 2d_1d_2 + 2d_1\alpha + 2d_1\beta I^* + \mu\beta I^* +
    d_2\beta I^* + \alpha\beta I^* + \mu d_2 + \alpha\mu - \alpha\beta S^*$

    $C = d_1^3 + d_1^2 d_2 + \alpha d_1^2 + \mu d_1^2 + \mu d_1 d_2 + d_1\alpha\mu
    + d_1^2\beta I^* + d_1 d_2\beta I^* + d_1\alpha\beta I^* + \mu d_1\beta I^* +
    \mu d_2\beta I^* + \mu\alpha\beta I^* + \mu\beta S^* d_1 + 2\mu\beta^2 I^* S^*$
    (7.21)


    Since $A > 0$, $B > 0$, and $C > 0$, then $AB > C$.


    Therefore, by applying the Routh–Hurwitz condition, the endemic equilibrium is
    locally asymptotically stable.


    # 7.5.3 GLOBAL STABILITY OF THE ENDEMIC EQUILIBRIUM


    In this section, we discuss the global stability of the endemic equilibrium using
    the geometric approaches. The sufficient condition for global stability of the
    equilibrium points is followed by the Bendixson condition.


    For $R_0 > 1$, we infer the uniform persistence of the system of equations, which
    means that there exists a positive constant $C$ such that the initial condition
    $((S(0)E(0), I(0)Q(0))$ lies in the interior of the region $\Omega$.


    Any solution $(S(t),E(t),I(t),Q(t))$ Satisfying $\min\{\liminf_{t\to\infty} S(t),\liminf_{t\to\infty}
    E(t),\liminf_{t\to\infty} I(t),\liminf_{t\to\infty} Q(t)\} > C$


    The preceding condition along with boundedness of the region $\Omega$ verifies
    the endemic equilibrium point interior to $\Omega$.


    # Theorem 4


    The unique endemic equilibrium $\Omega^*$ is globally asymptotically stable in
    the interior of $\Omega$ if $R_0 > 1$.


    Proof: For the general solution of the system as Equation 7.22.

    $J = \begin{pmatrix} -d_1 - \beta I & 0 & -\beta S & 0 \\ \beta I & -(d_1 + \mu)
    & \beta S & 0 \\ 0 & \mu & -(d_1 + d_2 + \alpha) & 0 \\ 0 & 0 & \alpha & -(d_1
    + d_2 + \delta) \end{pmatrix}$ (7.22)'
