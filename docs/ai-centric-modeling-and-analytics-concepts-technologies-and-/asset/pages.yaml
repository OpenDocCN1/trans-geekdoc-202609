  md: 'of medical images, which can detect specific diseases, such as glaucoma. This
    can lead to a higher accuracy in detecting glaucoma compared to training a model
    from scratch.


    +   - **Limited data availability**: In healthcare, limited amounts of data are
    often available because of privacy and ethical concerns. Transfer learning can
    help overcome this limitation by allowing models to be fine-tuned on smaller datasets,
    making it possible to train models in scenarios in which data are scarce (Vrushank
    et al., 2023).

    +   - **High computational resources**: The detection of glaucoma requires a large
    amount of computational resources and memory. Transfer learning can help reduce
    the computational resources required by using pre-trained models that are already
    trained on large datasets.

    +   - **Continual learning**: Glaucoma detection is a dynamic field, and new treatments
    and drugs are constantly emerging. Transfer learning can update models with new
    data, allowing the model to continually learn and adapt to new information.

    +   - **Explainable AI**: Transfer learning can also improve the interpretability
    of models, as the pre-trained models have already learned features from large
    amounts of data, and fine-tuning on task-specific data can help understand the
    decision-making process of the model.


    The upcoming sections in the paper contain dataset descriptions that provide information
    about number of glaucoma datasets available and considered, and the number of
    images employed for the training and testing of the TL models available in the
    Keras module.


    In the next section, the methodology contains the procedure that is employed and
    the process of implementation results and discussions. Finally, the conclusion
    provides a clear idea about the model to be used for the glaucoma-related dataset.


    # 11.2 LITERATURE SURVEY


    Ambreen et al. (2019) conducted a meta-analysis of 42 academic articles, mostly
    from the IEEE, ACM, and Springer digital libraries, on automated glaucoma systems,
    suggested in the previous 10 years. Thirty-seven of them were devoted exclusively
    to automated glaucoma detection methods.


    The anatomical and functional aspects of both eyes that were used in the automatic
    glaucoma diagnosis were also included in the study. For more precise glaucoma
    detection, a hybrid feature set encompassing the combined structural and textural
    aspects of retinal pictures is suggested.


    Jaja et al. (2020) collected data from 50 pictures of human eye optical coherence
    tomography (OCT) and fundus images, including control and glaucomatous images,
    which can be useful for developing an automated system for glaucoma diagnosis.


    To diagnose glaucoma, Shinde et al. (2021) suggested an offline computer-aided
    diagnosis approach based on images of the retinal fundus.'
