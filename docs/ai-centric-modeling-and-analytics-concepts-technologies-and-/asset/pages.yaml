  md: 'With each step, the models become more complex and powerful, capable of learning
    from larger and more diverse datasets, and can fine-tune specific tasks to achieve
    improved performance.


    # 11.4  WHY EFFICIENTNETV2?


    The architecture of EfficientNetV2 is based on the idea of scaling up CNNs in
    a “smart” way (Luke et al., 2023). This is achieved using a compound scaling method,
    which scales up the dimensions of the network in a more structured manner than
    simple scaling. The compound scaling method adjusts the following network dimensions:


    +   - **Width:** The number of channels in the convolutional layers is increased.

    +   - **Depth:** The number of layers in the network is increased.

    +   - **Resolution:** The input image resolution is increased.


    In addition to the compound scaling method, EfficientNetV2 also uses several other
    techniques to improve efficiency, such as lightweight convolutional layers, global
    depth-wise convolution, and a linear bottleneck structure.


    Overall, the goal of the EfficientNetV2 architecture was to achieve the best performance
    with the smallest number of parameters and computational resources.


    The main differences between EfficientNetV2 and the original EfficientNet architecture
    are as follows:


    +   - EfficientNetV2 adjusts the model dimensions (depth, width, and resolution)
    in a more balanced manner using a different technique termed compound scaling.

    +   - EfficientNetV2 introduces a new version of the Swish activation function,
    called memory-efficient Swish, which is more memory efficient than the original
    Swish activation function.

    +   - EfficientNetV2 introduces a new version of the bottleneck building block,
    called the EfficientNetV2 block, which is more efficient than the original bottleneck
    block used in EfficientNet.


    The models considered under EfficientNetV2 series are as follows.


    # 11.4.1  EFFICIENTNETV2B0


    EfficientNet-V2B0 is a variant of the EfficientNet-B0 architecture that is designed
    to be efficient and scalable. The architecture is based on MobileNetV2 architecture
    and is trained using a combination of manual and automated methods.


    The EfficientNet-V2B0 architecture is characterized by its use of depth-wise separable
    convolutions and a lightweight residual block called mobile inverted residual
    bottleneck.


    It also uses a compound scaling method that scales the dimensions of the network,
    along with the number of channels and the resolution of the input images. This'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'allows the network to maintain a high level of accuracy while being more efficient
    in terms of computational resources.


    EfficientNetV2B0 architecture consists of a stack of EfficientNetV2 blocks, with
    varying number of filters and layers in each block.


    The input to the model is a 224 × 224 image, and the output is a 1000-dimensional
    vector showing the class probabilities of the image. The model also includes a
    fully linked layer at the end as well as a global average pooling layer.


    With only a few parameters, EfficientNet-V2B0 performs well on a range of tasks,
    including semantic segmentation, object identification, and picture classification.
    It is suitable for use in areas with limited resources, such as portable devices
    or edge computing settings.


    # 11.4.2 EfficientNetV2B1


    EfficientNet-V2B1 is one of the models in this family, and it is a variant of
    the EfficientNet-V2 model.


    The architecture of the EfficientNet-V2B1 model relies on the MobileNetV2 model,
    which is CNN developed for efficient picture categorisation. It employs depth-wise
    separable convolutions and residual connections to decrease the number of parameters
    and calculations needed while maintaining high performance (Subhashini & Khang,
    2023).


    EfficientNet-architecture V2B1 consists of a succession of convolution layers
    followed by batch normalisation layers and the rectified linear unit (ReLU) activation
    functions.


    A global average pooling layer lowers the spatial dimension of the feature maps
    to a single number per channel, and a fully connected layer with only a Softmax
    activation function delivers the final class probabilities. The cross-entropy
    loss function is used to train the model.


    EfficientNet-V2B1 is a relatively small model with only 3.2 million parameters,
    but it is still able to achieve good performance on image classification tasks.
    It is well suited for use on mobile devices and other resource-constrained platforms,
    where computational efficiency is important.


    Some of the key features of EfficientNetV2B1 are as follows:


    +   - It is an efficient architecture that is designed to be smaller and faster
    than other models while still achieving good performance.

    +   - It uses a compound scaling method to scale the dimensions of the network,
    which helps improve the efficiency and accuracy of the model.

    +   - It has a balanced number of parameters and computational cost, making it
    a good choice for a wide range of applications.

    +   - It employs a mix of depth-wise and pointwise convolutions, which lowers
    the model''s parameter count and increases its effectiveness.

    +   - It includes a number of other design innovations, such as an inverted residual
    block and a linear bottleneck, which help to further improve the efficiency and
    accuracy of the model.'
