- pgno: 162
  md: 'Khuriwa and Mishra (2018) used the voting algorithm approach to evaluate an
    ensemble of two machine learning algorithms, artificial neural network (ANN) and
    logistic regression, to identify and diagnose breast cancer. They achieved 98%
    accuracy when using an ANN approach compared with logistic algorithm.


    Naji et al. (2021) used individual-based machine learning algorithms such as support
    vector machine, logistic regression, decision tree, k-nearest neighbor, naive
    Bayes, and well-known majority voting ensemble models.


    There are two groups of people in the offered dataset of 569 cases. One group
    composed of 212 people was diagnosed with possible cancerous tissue termed malignant.
    The other group, composed of 357 people, was recognized as having benign tumors
    (Wolberg et al., 2021).


    The most important aspect of meaningful evaluation of machine learning algorithms
    is to ensure that they are all tested on the same data (Khang et al., 2022a).
    This was accomplished by requiring each algorithm to be assessed using a standardized
    test harness. Four different categorization techniques were examined using a single
    dataset:


    +   - Logistic regression

    +   - K-nearest neighbors

    +   - Support vector machine

    +   - Decision tree


    These models were combined and used in the ensemble model to determine whether
    the overall accuracy of the classification model could be improved.


    These models were then integrated and used in an ensemble model to determine whether
    the overall accuracy of the classification model could be improved. The following
    ensemble models were used in this project:


    +   - Hard/majority voting

    +   - Soft voting

    +   - Weighted average


    The classifier method was designed to run on 70% training data and 30% test data.


    # 8.3 METHODOLOGY


    # 8.3.1 IMPLEMENTING ENVIRONMENT


    The project was implemented in Python version 3.3 using the Jupyter notebook as
    a standard platform. Libraries, such as Panda, Sklearn, and Pyplot, were used.
    JupyterLab was used to run the models and analyze the data.


    # 8.3.2 DATASET ANALYSIS AND PRE-PROCESSING


    The data used were from the UC Irvine Machine Learning Repository for the breast
    cancer dataset, known as WBCD. This is a publicly available dataset that consists
    of 569 instances and 32 attributes (Wolberg et al., 2021).'
