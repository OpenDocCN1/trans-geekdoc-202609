- pgno: 73
  md: 'Sustainability is a major priority of Industry 4.0. Hence, a conversation regarding
    the idea of Industry 5.0 started in 2019. This idea entails bringing back the
    human element to industry, that is, boosting cooperation between people and intelligent
    production systems and fusing the best of both worlds: automation’s speed and
    accuracy with people’s cognitive abilities and critical thinking (Luke et al.,
    2024).


    Scholars in science and technology debated the idea of Industry 5.0 from July
    2 to July 9, 2020, under the auspices of the Directorate “Prosperity” of Directorate-General
    for Research and Innovation of the European Commission (EC).


    One can find presumptions about the idea of “Industry 5.0” in the EC publication.
    This document’s main focus is on important directions for change that will transform
    the sector into one that is more human-centered and sustainable (Sindhwani et
    al., 2022).


    The interaction between people and machines is the emphasis of Industry 5.0 (Machado
    et al., 2020). In the modern world, humans coexist with machines and are linked
    to smart factories by intelligent devices.


    Rapid change is taking place in the fields of technology, mass customization,
    and advanced manufacturing. Because of advancements in AI and the ability to connect
    robots to the human mind, robots are becoming ever more crucial (Sindhwani et
    al., 2022).


    These days, robots operate in collaboration with humans rather than as competitors,
    as shown in Figure 4.1.


    ![](img/66ecdb8eb8654ae1c99705e55a45a836_73_0.png)


    # FIGURE 4.1 Five Industrial Revolutions and Robots Operate in Collaboration with
    Humans rather than as Competitors.


