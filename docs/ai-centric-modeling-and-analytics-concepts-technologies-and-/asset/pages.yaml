    the proposed methods for spam bot and cyberbullying detection.


    The next part contains the SBD in OSN using DL techniques. Deep learning models,
    such as deep forest, DNN, CNN, BiLSTM, GNN, DGNN, RNN, LSTM, RGA, BGSRD, and GAN,
    are used to detect spam bots in OSNs.


    The main aim of these models is to detect spam bots from user profiles, posts,
    comments, hashtags, SMS, interactions, and accounts. The datasets used by the
    authors to train and to validate the models are honeypot, X/Twitter, Kaggle, Weibo,
    and Cresci datasets.


    The major drawback of all the methods of SBD using DL techniques is that they
    do not choose the optimal features for SBD. Moreover, all the models consume more
    time to perform a particular task.


    The computational complexity, cost, and structure complexity are also main drawbacks
    of the SBD methods.


    The next section contains the SBD in OSN using DL techniques, particularly on
    the X/Twitter platform. One of the globally used OSN is the X/Twitter platform,
    with 330 million users actively using X/Twitter.


    The drawbacks of these techniques are similar to those of the aforementioned technique.
    Many authors have attempted to make their methods superior by providing various
    results in terms of accuracy, F-measure recall, and precision.


    However, these techniques failed to show their effectiveness by providing computational
    and time complexities. Therefore, methods that use DL or ML techniques must provide
    an analysis of the computational and time complexities to reveal the effectiveness
    of the proposed method.


    The next section describes cyberbullying detection in OSNs using DL techniques.
    Most authors have used only the models to classify a tweet or an account as non-bullying
    or bullying. To accurately classify tweets or accounts into two classes, it is
    important to perform pre-processing, feature extraction, and feature selection.


    Many authors have used pre-processing, feature extraction, and classification,
    but they have refused to add feature selection. Feature selection using bio-inspired
    optimization algorithms allows the model to classify tweets or accounts into two
    classes more accurately. These are few outcomes of the systematic review on spam
    bot and cyberbullying detection in OSNs.'
