  md: '590 million people and has caused the death of over 6 million people (www.worl-dometers.info/coronavirus/).


    The travel and hospitality sectors have recognized the potential usefulness of
    big data analytics. It has developed the capacity to transform big data into beneficial
    real-world information and insights, such as enhancing T&H management practices,
    which are considered significant viable benefits (Liu et al., 2017).


    Tourism is still one of the most lively industries in the economy and has evolved
    significantly over time. It is well recognized that adopting information and communication
    technology may benefit general businesses and hotel establishments (Buhalis &
    Law, 2008). This industry had to quickly adjust to a changing technological environment
    to stay competitive.


    The relevance of the topic is highlighted by the presence of only a few thorough
    literature evaluations of ample data in the T&H sector (Lyu et al., 2022).


    Businesses in the hotel sector can use artificial intelligence (AI) to better
    utilize on-site services and procedures and enhance client (guest) experiences.
    It is crucial to stay in touch with visitors and attend to their demands to maintain
    the overall quality.


    Because AI makes it possible to provide individualized experiences, the idea of
    a “smart hotel” has recently gained significant attention from academic (Buhalis
    & Leung, 2018) and corporate (Perini, n.d.) communities (Krce et al., 2012). Therefore,
    machine learning (ML)/AI has become necessary to survive and propel toward the
    objectives.


    Recent research indicates that ML fundamentally alters commercial landscapes.
    Its vast possibilities have been shown to disrupt labor and drive organizations
    to reevaluate their marketing tactics (Juaneda-Ayensa et al., 2016).


    The present study uses Biblioshiny (Bibliometrix analysis using R) to examine
    the scientific development of AI and ML in T&HI, and VOSviewer to investigate
    the publication and citation trend (objective 1), scientific production of countries
    (objective 2), scientific production of authors (objective 3), scientific production
    of institutions (objective 4), scientific collaboration of countries (objective
    5), scientific production by sources and dissemination of sources (objective 6),
    classification and analysis of keywords (objective 7), citation analysis (objective
    8), and segregation of keywords based on centrality and density.


    # 15.2 ARTIFICIAL INTELLIGENCE/MACHINE LEARNING


    The push to incorporate ML, a subset of artificial AI, into the T&H sector has
    grown since the dawn of the 21st century. This topic has recently gathered attention
    with numerous advancements in AI-based decision assistance approaches.


    A branch of AI called ML uses computers to analyze data and build models that
    can be used to solve problems. Machine learning differs from conventional programming
    in several aspects. Traditionally, rules are not explicitly learned from the data
    but are coded in a computer language.


    In contrast to traditional programming, ML creates predictive models that can
    be applied to forecasts using upcoming data. Owing to the intricacy of the code,
    much work might be required to design a rule-based program for certain problems.'
