- pgno: 95
  md: '# 4.4.2 DISCUSSION


    The discussion was designed to investigate student engagement in learning interactive
    speaking in blended learning for each indicator.


    First, students were actively involved in the learning activities that consist
    of three items. As shown in Table 4.1, this indicator received a high category,
    which means that the students were active and enthusiastic when learning interactive
    speaking when Replika AI and Pandorabots were incorporated in the learning process.


    In addition to increasing motivation and enthusiasm for learning, inserting AI
    chatbots (Replika AI and Pandorabots) in an interactive speaking class can also
    create a fun learning atmosphere. This is in line with Muthmainnah et al. (2022),
    who found that the main objective of teaching English is for students to learn
    how to speak, read, and write in English. This is accomplished by teaching students
    the language lexicon and grammar. Additionally, it teaches students how to compose
    and analyze documents using the English language.


    Both the goal and method of language development center on communication. To educate
    and learn effectively, it is crucial to incorporate both conventional and digital
    communication techniques.


    We present practical language skill training using AI applications, such as simulation
    and communication programs that simulate real-life scenarios for debate and conversation
    in English, and educational games based on language use are crucial. It is possible
    to create environments in which students can practice pronouncing words using
    communication technology.


    Second, the peer collaboration component describes exercises in which students
    share information and work together to solve challenges. Collaborative learning,
    which involves developing and comprehending knowledge with peers, is a key component
    of student involvement.


    A student revealed that it is noteworthy that collaborative learning emerged as
    a separate component in this study because interaction and collaborative learning
    are becoming increasingly crucial in the era of Industry 5.0. Students’ participation
    in the pair-work segment demonstrated their level of engagement. Students were
    engaging in the classroom. Nearly all of the students correctly and totally identified
    the topic and the conversation between them and Replika.


    Third, the students’ encouragement and learning needs consisted of three items.
    As shown in Table 4.3, this indicator received a high score category, which means
    in learning interactive speaking by involving Replika and Kuki, the students were
    encouraged to learn and had learning needs. This finding is supported by previous
    studies (Saud et al., 2022). This element is connected to learners’ active and
    self-directed learning activities in an autonomous learning setting.'
  merge: -1
  img_proc: true
- pgno: 96
