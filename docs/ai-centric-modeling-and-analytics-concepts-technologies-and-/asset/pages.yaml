    # 15.7 LIMITATIONS


    This study had several limitations. Even though Scopus is one of the most reputed
    databases, some journals still need to be indexed, which means that publications
    in these journals may have to be recovered. Some pre-processing options, such
    as removing duplicate documents, are unavailable in the Bibliometrix package of
    R software.


    Moral-Muñoz et al. (2020) claimed that pre-processing elements in bibliometric
    tools are underdeveloped. To overcome this restriction and eliminate duplicate
    documents, we used a two-stage data extraction strategy in this study.


    To obtain helpful, complete, and comparable metadata, we narrowed the search by
    source. Only 10 journals were used in our study. The objective was to choose the
    top journals for the research. The outcomes would have been different if we had
    utilized various journals and an alternative index, like the Web of Science.


    Furthermore, some authors may use numerous names, initials, or names in various
    publications. This restriction may lead to inaccuracies in the output of these
    institutions or authors and may result in discrepancies in the bibliographic analysis.
    The most currently available technologies exhibit issues when working with large
    datasets, whereas constrained datasets can provide better output.


    Metadata were extracted from the Scopus database; however, these international
    databases may need to include relevant studies from emerging and underdeveloped
    nations. We also noted that the authors cannot read full articles and abstracts
    in languages other than English, which were not considered.


    # 15.8 FURTHER RESEARCH


    This study can be expanded in future research to incorporate the literature from
    emerging and developing nations. We have included additional pertinent publications,
    books, and executive insights to make the investigation more thorough. As a result,
    our study contributes to the application of AI in the hospitality and tourism
    industry in emerging and developing countries (Khang et al., 2022a).


    The present study used AI in T&HI, and further research may involve the same in
    the field of other service industries by following the same methodology and can
    be compared with the output of the present study. A conclusion can be drawn based
    on the same results.


