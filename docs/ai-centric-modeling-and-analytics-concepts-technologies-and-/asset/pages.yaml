    # 18.1.2 Spam Bot Detection Methods


    Researchers have introduced many methods to reduce the spread of spam bots on
    online social media, as shown in Figure 18.3.


    # 18.1.2.1 Crowdsourcing-Based Method


    The crowdsourcing-based method is a spam bot detection (SBD) method proposed by
    Wang et al. (2019), which is defined using two layers. The first is the filtration
    layer, the function of which is to segregate a doubtful profile from genuine spam
    bots using certain techniques.


    The other layer is the crowdsourcing layer, which evaluates doubtful profiles
    and identifies spam bots. Tuskers are people involved in the crowdsourcing layer.
    Compared with other methods, this method yields very low false-negative and false-positive
    rates.


    The accuracy of this method can be maximized by eliminating tuskers using a voting
    system. The main risk of using this method is that it can affect the privacy of
    the user (Aroyo et al., 2019).


    # 18.1.2.2 Graph-Based Method


    The graph-based method is used to construct a social network structure. It focuses
    on social network graphs to distinguish social spam bots from genuine users. Three
    other methods are integrated to detect spam bots in OSN.


    The first method is trust propagation, in which the honest relationship between
    the objects of the two graphs is analyzed whether strong or weak. The next method


