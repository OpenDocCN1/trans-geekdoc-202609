    # 3.3 BIG DATA PROCESS LIFE CYCLE


    A framework called big data process life cycle assists organizations in controlling
    the entire process of working with big data. It consists of a number of stages,
    each involving certain tasks and tools. The steps of the big data process life
    cycle are as follows:


    # 3.3.1 Data Ingestion


    The process of importing, gathering, and putting substantial amounts of data from
    diverse sources into a centralized repository or data lake for analysis is known
    as data ingestion. Because it lays the groundwork for all upcoming stages, this
    stage is essential to the big data process life cycle.


    Data ingestion is crucial for a number of reasons:


    +   1. **Data sources:** Data for organizations are kept in a variety of places,
    including databases, logs, social media, and IoT devices (Khang et al., 2024a).
    Organizations can gather data from many sources and combine them in a single spot
    for analysis, thanks to data intake.

    +   2. **Data volume:** Manual data management is challenging given the exponential
    expansion of data. Data ingestion enables businesses to swiftly acquire and process
    massive volumes of data through automation (Hajimahmud et al., 2022).

    +   3. **Variety in data:** The data gathered may be in unstructured, semi-structured,
    or structured format. Organizations can benefit from data ingestion by transforming
    the data into a standardized format that is simple to evaluate.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '+   4. **Real-time data:** Some applications call for the continuous collection
