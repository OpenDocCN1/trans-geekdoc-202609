    # P4 (Ry)


    About Mitsuku: Interaction is not hampered, although errors are not corrected:
    She replied to my question, “Who’s your favorite singer?” by sending me a picture
    of a French musician named Mathieu Tota, along with some information about him
    and links to his music on Spotify and YouTube. I believe that using multimedia
