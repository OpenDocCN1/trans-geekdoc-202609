    The data obtained are raw and unstructured. The main issues are the processing,
    compilation, and structured form of these data. Here, we will consider two concepts:
    data analysis (or data analytics) and big data (big data analytics).


    Data analysis is the process of extracting meaningful information from the various
    datasets available. This process is mainly done on big data.


    However, the application areas of data analysis are wide. That is, it can be applied
    to obtain meaningful (necessary) information in many areas. With the help of data
    analytics, individual or group decision-making can be done.


    There are many types of analytics. Here are some of them.


    +   1. **Descriptive analysis**: This is the very first type of analysis. Descriptive
