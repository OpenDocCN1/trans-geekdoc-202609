    to others (Rani et al., 2021).


    AI is not only a buzzword or any special feature of computer science; it collaborates
    with other computer science areas, such as ML, deep learning, big data analytics,
    and natural language processing. Artificial intelligence uses multiple programming
    languages and supports multiple tools to record data as well as to build an algorithm
    to create a model based on data.


    AI has three phases: assisted intelligence, where insights of data are shared
    with a human being to make decisions; augmented intelligence, where ML capabilities
    are utilized to generate the outcome; and full automation, where inputs, processes,
    outputs, and decision-making are taken care of by AI (Dordevic, 2022).


    AI decision-making is aware of the process of measuring data with or without the
    support of human beings to make accurate decisions for a complex problem. In addition,
    AI can handle big data, data collected from different sources, current trends,
    anomalies, and data crunching to generate final decisions with or without human
    intervention (Khang et al., 2023e).


    AI creates a model based on all the clusters required to solve any problem; a
    cluster includes technology and data sources. Based on the model, production is
    generated, and a decision is made. The structural model layout is shown in Figure
    1.4.


    An AI cluster provides support to decisions, argumentation to justify the solution,
