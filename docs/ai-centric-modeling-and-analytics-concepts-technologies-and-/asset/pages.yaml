  md: '# 16 Data-Centric Predictive Analytics for Solving Environmental Problems


    *Elmina Gadirova Musrat and Vugar Abdullayev*


    # 16.1 INTRODUCTION


    One of the ecotoxicants is phenol and its derivatives, which enter water with
    effluents from organic synthesis enterprises. Chlorophenols, which are formed
    during the chlorination of drinking water and serve as starting materials for
    the formation of dioxins or a group of tricyclic aromatic compounds classified
    as the most highly toxic persistent organic pollutants with mutagenic and carcinogenic
    properties (Alekseev, 2007), pose an increased risk.


    Therefore, water purification from phenol and its derivatives is a serious environmental
    challenge, and this topic is applied to solve environmental problems in the building
    stage of smart cities (Khang et al., 2023a).


    Existing methods for cleaning organic pollutants include biological, physical,
    chemical, and adsorption methods (Marsh, 2006). The latter are more often used
    in the post-treatment stages and are most effective when using materials with
    high adsorption activity for smart city environments (Khang et al., 2022).


    In addition, adsorption is a fairly simple technological process in contrast to
    chemical and biological methods that can be implemented at rather high flow rates
    of the media to be purified. The most widespread process of phenol adsorption
    is activated carbon. There are also scientific studies using other sorbents (Isaevа,
    2009).


    The adsorption purification of phenol is an area of research aimed at solving
    environmental problems (SEPs). The adsorption purification of water from phenol
    is the most important chemical direction because sorption treatment is widespread.
    According to the literature, adsorption processes in the presence of TiO₂ are
    known contain information on the adsorption of titanium oxide. The use of TiO₂
    as an adsorbent with photocatalytic properties provides many advantages. TiO₂
    is chemically and thermally more stable than TiO₂, which has a photocatalytic
    effect and is widely used for the purification of various materials from toxic
    substances (Rani et al., 2022). In Japan and China, TiO₂ is added to concrete
    reinforcement and wall masonry in closed tunnels to purify the air from nitrogen
    gases (Ghafari, 2019). The use of photocatalysis for the purification of wastewater
    from organic pollutants is an interesting alternative that has attracted great
    interest from many'
