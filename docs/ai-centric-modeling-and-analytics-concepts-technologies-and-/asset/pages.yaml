- pgno: 209
  md: '# 11.4.3 EfficientNetV2B2


    The EfficientNetV2B2 model is a variant of the EfficientNetV2 architecture with
    a depth of 2 (hence the “B2” in its name). It is a relatively small model, with
    around 0.5 million parameters. It is well suited for image classification tasks
    with limited computational resources, such as mobile devices.


    The EfficientNet V2B2 architecture is based on the EfficientNet architecture,
    which uses a compound scaling method to scale up the network size and capacity
    while also improving its efficiency.


    The specific details of the V2B2 architecture may vary; however, in general, it
    is likely to have a larger number of layers and more filters per layer than the
    smaller models in the EfficientNet family. It may also use techniques, such as
    depth-wise separable convolutions and squeeze-and-excitation (SE) blocks to improve
    the model’s efficiency.


    # 11.4.4 EfficientNetV2B3


    EfficientNet V2B3 is a specific member of the EfficientNet family, characterised
    by its use of the “B3” size configuration.


    The EfficientNet architecture is based on the idea of scaling up neural network
    models by carefully balancing the width, depth, and resolution of the network.
    The model hyper-parameters employed, which include the number of layers, total
    number of filters for each layer, and the resolution of an input picture, are
    referred to as the “B3” size configuration.


    The EfficientNet-V2 B3 variation is a larger model with a higher computational
    complexity to obtain better performance. It is composed of 10 blocks that alternate
    convolutional and maximum pooling layers, must have a dimensionality of the data
    of 224 × 224 pixels, and is completely linked after the global average pooling
    layer.


    As the network develops, the convolutional layers contain more filters, and the
    model employs skip connections to enhance information flow across the network.


    The B3 variation is frequently used for tasks, such as image classification, object
    identification, and semantic segmentation. It comprises more than 25 million parameters.


    # 11.4.5 EfficientNetV2S


    EfficientNetV2S is a member of the EfficientNet family. It is a smaller version
    of EfficientNet, with fewer parameters and lower computational complexity. It
    is designed for scenarios in which the model size and computational resources
    are limited, such as on mobile devices or edge devices.'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'One key aspect of the EfficientNet V2S architecture is its use of compound
    scaling, which involves scaling the network dimensions (width, depth, and resolution)
    in a compound manner to achieve better performance. This allows the network to
    maintain a good performance even when the input size is reduced.


    The implementation of a depth-wise separable convolution layer and the use of
    a global average pooling layer at the end of the network are two more crucial
    components of the EfficientNet V2S design. These design decisions aid in reducing
    the number of parameters inside the network, increasing the efficiency and simplifying
    the training process.


    The architecture of EfficientNet-V2s is based on the MobileNetV2 architecture,
    which uses inverted residual blocks with linear bottlenecks and width multipliers
    to control model complexity.


    The EfficientNet-V2s model also includes additional enhancements, such as an SE
    block, which helps improve the model’s representational power by adaptively recalibrating
    the channel-wise feature responses, and a Swish activation function, which helps
    improve the model’s performance and training speed.


    In summary, the architecture of EfficientNet-V2s consists of a series of inverted
    residual blocks with linear bottlenecks and SE blocks followed by a classification
    head. The model is designed to be flexible and can be modified by adjusting the
    width multipliers and resolution of the input image to achieve a trade-off between
    performance and efficiency (Khanh & Khang, 2021).


    # 11.4.6 EfficientNet-V2M


    The EfficientNet architecture, which was created to increase the effectiveness
    of CNNs for computer vision applications, has a variation called EfficientNet-V2M.
    The study “EfficientNet: Rethinking Model Scaling for Convolutional Neural Networks”
    presented EfficientNet-V2, which it extends.


    The publication “EfficientNet-EdgeTPU: Hardware-aware Neural Network Design for
    Edge TPUs” debuted the V2M version of EfficientNet. It is particularly suited
    for use in edge devices that have limited resources, such as Google’s Edge Vector
    Processing Elements, because it was created to be more efficient in terms of computing
    and memory needs tensor processing units (TPUs).


    The main differences between EfficientNet-V2M and EfficientNet-V2 are as follows:


    +   - EfficientNet-V2M has fewer filters per layer than EfficientNet-V2.

    +   - EfficientNet-V2M uses depth-wise separable convolutions in the middle layers
    instead of regular convolutions, which reduces the number of required parameters
    and computations.

    +   - EfficientNet-V2M uses a modified version of the Swish activation function,
    which is more computationally efficient than ReLU.


    Overall, EfficientNet-V2M is a highly efficient CNN architecture that is well
    suited for deployment on edge devices with limited resources.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# 11.4.7 EfficientNetV2L


    EfficientNet-V2L is a variant of the EfficientNet family of models, which is designed
    to be more efficient and accurate than other models in their class. The “V2L”
    in the name stands for “Variant 2, Large.”


    The following is a brief summary of the architecture of EfficientNet-V2L:


    +   1. Input size: 224 × 224

    +   2. Number of layers: 32

    +   3. Filter expansion: 3.1

    +   4. Depth-wise convolution expansion: 6

    +   5. Width expansion: 2.6

    +   6. Resolution expansion: 2.2

    +   7. Output stride: 16


    EfficientNet-V2L uses a combination of depth-wise separable and traditional convolutions
    to build its network. It also uses a number of techniques to increase the efficiency
    of the model, including using Swish activation functions, using a mobile inverted
    bottleneck (MBConv) block as its building block, and using a grid search to optimise
    the architecture.


    The EfficientNet v2L model was built using the EfficientNet architecture, which
    is based on a combination of the following key ideas:


    +   1. Scaling up model size: The model is scaled up systematically, starting
    from a baseline model and increasing the model size and complexity in a way that
    is designed to improve accuracy.

    +   2. Using effective convolutional layers: To decrease the number of parameters
    and increase the model performance, the model employs depth-wise separable convolution
    and a global average pooling layer.

    +   3. Reducing the resolution of input images: The model uses an input resolution
    that is smaller than the typical input size for image classification models, which
    reduces the amount of computation required and allows the model to run faster.


    # 11.4.8 EfficientNetV2XL


    EfficientNetV2-XL is a version of the EfficientNet model, which is a family of
    CNNs designed to be more efficient and accurate than previous CNN architectures.


    EfficientNetV2-XL is the largest and most powerful version of the EfficientNet
    family, with the highest number of parameters and the best performance in image
    classification tasks. It is designed to be used on large-scale image datasets
    and is trained using the latest techniques in neural architecture search (NAS)
    and TL, as shown in Table 11.1.


    In Table 11.1, the models are listed in increasing order of accuracy.'
