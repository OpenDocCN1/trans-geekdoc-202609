  md: '# # 8 Breast Cancer Prediction Using Voting Classifier Model


    *Sujeet Kumar Jha and Alex Khang*


    # ## 8.1 INTRODUCTION


    Breast cancer, mostly targeting the female population, is a major concern for
    the World Health Organization, as it is persistent worldwide. It is the most common
    type of cancer in the world (Sung et al., 2021; World Health Organization, 2021).


    Depending on the severity of breast cancer symptoms, patients may be exposed to
    a variety of tests to diagnose the disease, including ultrasonography, biopsy,
    and mammography. Biopsy is the most evident of these approaches, which entails
    the removal of sample tissues or cells for analysis.


    A fine-needle aspiration (FNA) method is used to take a sample of cells from the
    breast, which is subsequently sent to a pathology laboratory for microscopic inspection
    (Khourdifi & Bahaj, 2018).


    Numerical properties, such as radius, roughness, perimeter, and area, can be calculated
    using microscopic images of cells and tissues. The FNA results are then compared
    to imaging data to determine the possibility of a patient having a malignant tumor
    (Bhamri et al., 2022).


    The fatality rate of breast cancer is comparatively higher than the other types
    of cancer. Therefore, there seems to be a necessity for a model that can analyze
    whether a person developing symptoms is vulnerable to cancer or not. If a preliminary
    scan cannot be conducted in person, this kind of automation is beneficial for
    both patients and doctors.


    In this chapter, the data were extracted from the archive of UC Irvine Machine
    Learning Repository (Wolberg et al., 2021). Here, several machine learning-based
    classification algorithms are used to predict whether a patient is susceptible
    to a malignant tumor or not.


    # ### 8.1.1 PROBLEM


    The main objective of this chapter is to survey the current trends and algorithms
    in disease prediction systems and propose a model that performs efficient and
    reliable prediction of patient health at a minimum cost (Khang et al., 2023a).'
  merge: -1
  img_proc: true
