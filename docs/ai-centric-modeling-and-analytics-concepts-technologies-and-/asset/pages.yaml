- pgno: 76
  md: '# 4.2 RELATED WORK


    # 4.2.1 STUDENT ENGAGEMENT


    Student engagement is how involved or interested students appear to be in their
    learning and how attached they are to their classrooms, their institutions, and
    each other, according to Axelson and Flick (2010).


    Student engagement is any continuous relationship a learner has with any part
    of learning, schools, or education. According to Fletcher (2015) and Axelson and
    Flick (2010), student involvement is increasingly seen as a sign of excellent
    classroom instruction and an indicator of institutional greatness.


    Barkley (2010) devised a classroom-based paradigm to comprehend student engagement
    and utilized the words “passion” and “excitement” to describe the phenomenon.


    Student engagement, according to Barkley (2010), is a process and a product that
    is experienced on a continuum and arises from the synergistic relationship between
    motivation and active learning. Although helpful for enhancing student learning,
    this concept only offers a monolithic view of student participation.


    The constructivist premise that learning is influenced by how a person engages
    in activities with a learning purpose forms the basis for the idea of student
    learning engagement. Student engagement is the outcome of intrinsic drive or personal
    needs that cause students to feel good and persevere in their activities with
    self-assurance.


    According to term of student engagement, it is defined as the expressing of opinions,
    attitudes, and behaviors by students. The notion that student participation can
    be divided into the following three aspects is consistent.


    +   1. **Participation in behavior**: Students adhere to behavioral standards,
    such as attendance and participation.

    +   2. **Arousal of emotions**: Emotionally active students have affective responses,
    such as curiosity or delight.

    +   3. **Cognitive involvement**: Students who are actively using their brains
    will try to go above and beyond what is required and will enjoy a challenge.


    In addition, the concept of engagement has several facets, including behavioral,
    emotional, and cognitive components (Wang et al., 2022). The term “behavioral
    engagement” refers to participation, which includes taking part in extracurricular,
    social, or academic activities.


    Affective responses to professors, classmates, and the setting in which the learning
    takes place are all included in emotional involvement. Finally, cognitive engagement
    includes consideration and the willingness to put up the effort to understand
    material and acquire skills.


    Axelson and Flick (2010) highlighted several components of engagement in the context
    of online learning, including the degree of academic difficulty, active and collaborative
    learning, student–faculty contact, and meaningful educational experiences.


    Moreover, (Paschek et al., 2022b) stated that learner–learner, learner–instructor,
    and learner–content interactions are three types of interactions that promote
    student engagement.'
