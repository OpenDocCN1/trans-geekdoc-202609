  md: '# 14.2 ROBOTIC PROCESS AUTOMATION IN DATA MANAGEMENT


    Robotic process automation is an easy-to-use minimum-code technology that even
    non-voice developers in business departments can utilize to automate their business
    processes.


    Robotic process automation can be easily understood as software robots. They are
    programs that perform repetitive tasks that are beneficial to firms looking to
    automate data management tasks. These tasks include data cleansing, data normalization,
    data wrangling, and management of metadata.


    # 14.2.1 ROBOTIC PROCESS AUTOMATION APPLICATION IN DATA CLEANING


    Robotic process automation is applied in data cleansing to detect corrupt data
    and update records with accurate and useful information.


    Uniqueness of the data is preserved by removing duplicate files. In data cleansing,
    incorrect or corrupted data are removed, and grammatical errors and incorrect
    number files are corrected.


    In data cleansing, the usefulness of data is also considered so that data are
    standardized and unnecessary content is cleared. Thus, data cleansing provides
    pre-robotics solutions by standardizing the information from multiple sources
    in bot-understandable templates.


    If data cleansing is not dealt with diligently, it can cost companies financial
    losses and delays. A pre-robotics solution in terms of data cleansing provides
    an efficient and agile approach to handling unstructured information. This is
    done through information mining following specific rules in business and computerized
    processes with minimum human intervention (Khanh & Khang, 2021).


    # 14.2.2 ROBOTIC PROCESS AUTOMATION APPLICATION IN DATA NORMALIZATION


    The process of data normalization is often cumbersome and time-consuming, and
    can carry many errors. Complex data systems constitute a large part of the current
    workplace. The verification of mappable (i.e., able to be represented by a map)
    data from source to target is an important aspect of data onboarding so that uniformity
    in data is maintained (Christian & Peter, 2021).


    To manage data efficiently and effectively, calculated columns are added. Data
    are restored according to custom criteria. Matching data formatting with an analytics
    engine using normalization ensures a better interaction with the dataset.


    Susceptibility to human errors can be minimized if this dataset is handled correctly;
    otherwise, it can result in significant downstream rework and an increase in staff
    hours.


    # 14.2.3 HOW IS ROBOTIC PROCESS AUTOMATION USED IN DATA WRANGLING?


    Data wrangling is the immediate process after data collection. Data wrangling
    begins with data discovery and ends in publishing.'
