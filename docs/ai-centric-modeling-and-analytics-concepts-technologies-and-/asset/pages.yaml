  md: '# 17 Phishing Attack

    and Defense


    # *An Exploratory Data Analytics

    of Uniform Resource

    Locators for Cybersecurity*


    *Taiwo O. Olaleye, Oluwasefunmi T. Arogundade,

    Agbaegbu Johnbosco, Olayemi O. Sadare,

    Adekunle M. Azeez, Azeez A. Opatunji, Ayobami

    A. Tewogbade, and Saminu Akintunde*


    # 17.1 INTRODUCTION


    The Internet has developed into a crucial infrastructure that greatly facilitates
    human and societal coexistence (Sekiya, 2021). However, the Internet also has
    inevitable security issues, such as phishing, dangerous malware, and privacy revelation,
    which have already posed severe dangers to users (Sekiya, 2021).


    The venture of mimicking a legitimate website by fraudsters, referred to as phishing,
    is a cybercrime that continues to evolve with respect to the dynamic nature of
    the World Wide Web. It is a criminal tactic that uses both social engineering
    and technological deception to steal users’ personal identifying information and
    log-in credentials to defraud them of tangible and intangible assets (Qurashi
    et al., 2021a).


    In this scenario, unsuspecting Internet users take a fake website as authentic,
    and hence become vulnerable during the course of interaction with the fictitious
    website. Moreover, phishing tactics have expanded in variety over the years and
    may now be more harmful than ever.


    # 17.1.1 BACKGROUND


    With the incorporation of social media and log-in options, an attacker may be
    able to steal pieces of personal information about a person with a single phished
    password, leaving them open to ransomware assaults (Khang et al., 2023b).


    In another approach, a perpetrator uses a fake domain name or a uniform resource
    locator (URL) to pose as a reliable organization or individual (Salah and Zuhair,'
  merge: -1
  img_proc: true
- pgno: 333
  md: '2021). Attackers also employ phishing emails to disseminate malicious URLs
    or attachments that are capable of performing a number of tasks.


    Hence, phishing is now more widely propagated than through conventional channels,
    such as email, short message service (SMS), and pop-up windows. Although the popularity
    of mobile Internet and social networks has made life easier for users, they have
    also been used to spread phishing, including spear phishing, QR code phishing,
    and the spoofing of mobile applications (Morais, 2022).


    In addition, because many people assume that hypertext transfer protocol (HTTPS)
    websites are probably authentic, many crafty phishing attacks are located on websites
    that have HTTPS and secure socket layer certificates (Kalabarige et al., 2022).
    Therefore, phishing is an evolving trend that brings new obstacles for its detection.


    Hence, security professionals and researchers have invested considerable time
    and energy in the detection of phishing websites despite the poisonous and covert
    nature of phishers. Blacklists and whitelists are frequently employed in the identification
    of phishing websites to shield users from phishing attacks, as Google makes a
    constantly updated blacklist of harmful websites available (Gillis, 2020).


    However, studies show that 63% of phishing websites barely last for 2 hours, and
    that 47% to 83% of phishing websites are added to blacklists after 12 hours (Kalabarige
    et al., 2022). As a result, updating the blacklist lags far behind the creation
    of phishing websites.


    # 17.1.2 METHODOLOGY


    The machine learning use case of artificial intelligence (AI) is employed for
    phishing website detection with a higher accuracy level by depending on extracted
    features from both legitimate and fraudulent website URLs.


    Several studies, including Sekiya (2021), Yang et al. (2019), Odeh et al. (2021),
    and Tang and Mahmoud (2021), have employed the predictive analytics approach relying
    on several extracted features of their employed URL datasets.


    However, the recently released phishing website dataset by Mendeley (Vrbančič,
    2020) has been widely employed in detection studies, including Sekiya (2021),
    Qurashi et al. (2021b), Salah and Zuhair (2021), and Morais (2022), without a
    prior exploratory data analysis (EDA) to unravel actionable insights from the
    various attributes that make up the dataset.


    This important research gap has been noted as a threat to the internal validity
    of the proposed machine learning-based models in the literature (Olaleye et al.,
    2023) and forms the motivation of this chapter.


    The result of the EDA would help dictate the pace of the ensuing prediction while
    revealing indispensable patterns that determine the status of a feature website
    as either phishing or legitimate.


    Therefore, this study employed statistical data analysis to identify trends and
    patterns in the Mendeley Phishing Websites Dataset prior to predictive analytics
    using naive Bayes (NB) and neural network learner algorithms (Khanh & Khang, 2021).'
