    These text classification strategies for cyberbullying detection are based on
    the traditional bag-of-words (BoW) model. It generates a group of abusive, hateful,
    and sensitive words. Then, it uses algorithms to identify the words in online
    content that must be analyzed (Hang, 2019). The lexicon-based methods work using
    N-gram techniques and BoW.'
