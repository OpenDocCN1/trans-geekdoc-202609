  md: "Therefore, based on the presented descriptions, the corresponding mathematical\
    \ equations are given by a system of nonlinear ordinary differential equations\
    \ (Equation 7.6):\n\n# Mathematical model\n\n$$\frac{dS}{dt}=A-\beta SI-d_{1}S$$\n\
    $$\frac{dE}{dt}=\\beta SI-(d_{1}+\\mu)E$$\n$$\frac{dI}{dt}=\\mu E-(d_{1}+d_{2}+\\\
    alpha)I$$\n$$\frac{dQ}{dt}=\\alpha I-(d_{1}+d_{2}+\\delta)Q$$\n$$\frac{dR}{dt}=\\\
    delta Q-d_{1}R$$\n(7.6)\n\n# 7.4.1 Model Analysis for Boundedness and Positivity\n\
    \nIn this section, we define the region in which the solution to the model is\
    \ uniformly bounded as set Ω (Equation 7.7):\n\n$$\\Omega \\in R_{+}^{5}=\\{(S,E,I,Q,R)\\\
    in R_{+}^{5}, S\\ge0, E\\ge0, I\\ge0, Q\\ge0, R\\ge0\\}$$\n(7.7)\n\nThis is positively\
    \ invariant for system (1). Clearly, the interaction functions on the right-hand\
    \ side of system (1) are continuously differentiable. Therefore, the solution\
    \ of system (1) exists and is unique. In addition, all solutions of system (1)\
    \ with nonnegative initial conditions are uniformly bounded in the following theorem.\n\
    \nAll solutions of system (1), which are initiated in $R_{+}^{5}$, are uniformly\
    \ bounded.\n\n# Proof:\n\nLet $(S(t),E(t),I(t),Q(t),R(t))$ be any solution of\
    \ system (1) with nonnegative initial condition $(S(0),E(0),I(0),Q(0),R(0))$.\
    \ Therefore, adding all the individuals $N(t)=S(t)+E(t)+I(t)+Q(t)+R(t)$ results\
    \ in Equations 7.8 and 7.9:\n\n$$\frac{dN}{dt}=\\frac{dS}{dt}+\\frac{dE}{dt}+\\\
    frac{dI}{dt}+\\frac{dQ}{dt}+\\frac{dR}{dt}$$\n(7.8)\n$$\n\frac{dN}{dt}=A-d_{1}N-d_{2}(I+Q)$$\n\
    (7.9)\n\nIn the absence of any infection, the total population becomes $\\frac{A}{d_{1}}$.\n\
    As $t \\to 0$, then $N \\to \\frac{A}{d_{1}}$."
