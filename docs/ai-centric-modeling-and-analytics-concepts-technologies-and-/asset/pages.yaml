    The remainder of this chapter is organized into five parts. Section 1.2 explains
    the present method and its drawbacks of job scheduling in business and production.
    Section 1.3 explains the proposed techniques for assigning jobs using hybrid PSO
    techniques. Section 1.4 presents the experimental results and their graph analysis,
    and section 1.5 provides a conclusion.


    # 13.2 LITERATURE REVIEW


    Linear programming (LP) was utilized by Abdel-Basset et al. (2019). It is a mathematical
    technique for determining how to obtain the optimal result, for example, the model''s
    highest profit or lowest cost. A particular instance of mathematical optimization
    is LP.


    Dynamic programming (DP) was used by Guo et al. (2019) as an implicit enumerative
    search technique. In DP, a complex problem is deconstructed into multiple smaller,
    independent subproblems before attempting to solve it. Every minor subproblem
    is solved, and the solutions are saved for later use.


    Chan et al. (2020) presented a DP method to the lot scheduling problem. On a regular
    basis, they considered the timing of production of multiple items inside the same
    facility. The infrastructure of the system allows the production and processing
    of only one item at once. Setup time and cost are related to the item produced.
    Every item''s demand rate is known and remains the same over an endless planning
    horizon. All requests must be fulfilled.


    Anna et al. (2018) created the branch-and-bound algorithms for the makespan minimization
    problem with the permutation flow shop.'
