- pgno: 128
  md: 'language models combine the nuances of language with probabilistic approach
    (Khang et al., 2023b).


    A statistical language model predicts the succeeding word in a sequence given
    the preceding words. These words can be a set of two, three or even a single word
    based on which they are called N-gram, where ‘N’ is the amount of context that
    the model is trained to consider. Thus, it can be a unigram, bigram, trigram or
    another language model.


    Other variations in statistical language models are based on exponential and continuous
    space concepts, in which feature functions and nonlinear combinations of weights
    are considered.


    On the other hand, neural language model is a more advanced form of a language
    model based on neural networks. The shortcomings of statistical language models
    include data sparsity issue, conditioning on large context sizes and generalization
    in different contexts. Neural language models are fast becoming the preferred
    approach in NLP.


    # 6.7 MACHINE LEARNING METHODS FOR NATURAL LANGUAGE PROCESSING


    # 6.7.1 Spam Detection–Naive Bayes


    Since the late 1980s, the field of NLP has relied on data-driven computation,
    which largely involves probability, statistics and most importantly machine learning
    (Otter et al., 2021).


    Machine learning techniques and algorithms have played a pivotal role in emerging
    NLP applications in different regional and global languages (HMI, 2016; Marco
    et al., 2021).


    One of the most popular machine learning algorithms for text classification is
    naive Bayes (Mertiya & Singh, 2016). Naive Bayes has its foundation laid on Bayes
    theorem given by Equation 1.13:


    P(A / B) = P(B / A)P(A) / P(B) (1.13)


    Bayes theorem describes the tendency or probability of the occurrence of an event
    ‘A’ when event ‘B’ has already occurred. As postulated by Bayes, it will depend
    on the reverse conditional probability, which means the chances of the occurrence
    of event ‘B’ when event ‘A’ has already occurred multiplied by the independent
    probability of event ‘A’ and divided by the independent probability of event ‘B’.
    Two questions arise from this point of understanding. How is it connected to NLP?
    Why is the word ‘naive’ in the naive Bayes algorithm? In the context of NLP, talking
    particularly about text classification applications, such as spam email detection
    and sentiment analysis, if looked closely, we are only seeing the probability
    of certain words given that certain sets of words are already there, and based
    on this probability being greater or lesser than the'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'threshold, we classify the text into one of the two classes and hence segregate
    spam emails from non-spam (ham) emails.


    Second, the two events occurring simultaneously can be either dependent on or
    completely independent of each other. Although in real-life use cases, events
    or features cannot be ruled out to be dependent on each other. On the contrary,
    the naive Bayes machine learning algorithm works on the assumption of all the
    events being independent, which is a very ‘naïve’ assumption.


    Hence the name. Classifying natural language descriptions as a challenge, the
    naive Bayes algorithm together with the count vectorizer is used in applications
    related to genre-based mobile app classification (Qiu et al., 2022).


    Furthermore, naive Bayes, along with the sentiment scoring approach, is deployed
    and produces fruitful results to analyze even government decisions on political
    fronts based on free opinions from forums, blogs, tweets, etc. (JAC-ECC, 2018;
    Bunyamin et al., 2022).


    Implementation of the multinomial naive Bayes algorithm in the medical and healthcare
    domains creates waves in the NLP domain (ICCES, 2020; Alawad et al., 2021; Ishikawa
    et al., 2022).


    # 6.7.2 SENTIMENT ANALYSIS–LOGISTIC REGRESSION


    The analysis of sentiments or emotions is a daunting and challenging task. Sentiments
    can be positive, negative, neutral or mixed. In addition, when expressed via natural
    language, it becomes more ambiguous.


    In the quest to classify sentiments expressed through natural language, various
    machine learning algorithms have been introduced, improvised and implemented to
    achieve higher accuracy and enhanced crystal clarity in terms of the segregation
    and classification of one sentiment from another. One such approach is the logistic-regression
    machine learning algorithm (Khang et al., 2022a).


    This approach focuses on the binary classification of sentiments while ignoring
    neutral sentiments. The steps involved in the process are shown in Figure 6.5.
    In NLP, the neutrality of sentiments is handled in different ways, depending on
    the technique being applied.


