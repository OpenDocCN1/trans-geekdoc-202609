    The innovations promised by the fourth industrial revolution are quite diverse.
    But each of them is precisely related to digitalization. Therefore, this era can
    also be called the era of digitalization. In short, Industry 4.0 is the key to
    a smart industrial world. It is also one of the cornerstones of the future industrial
