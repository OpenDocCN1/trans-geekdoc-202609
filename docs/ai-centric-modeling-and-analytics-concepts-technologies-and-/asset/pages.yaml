    # 11.6 PROPOSED METHODOLOGY


    The suggested technique involves training models using all five datasets combined
    and then dividing them into three separate datasets: training, testing, and validation
    datasets, and by using a combination of training, testing, and validation datasets,
    with certain datasets serving as the former, as shown in Figures 11.1 and 11.2.


