    is obtained from those descriptions. An example is medical descriptive data analysis
    in medicine. The best thing about descriptive data is that they can describe large
    amounts of data in a concise and simple form.

    +   2. **Diagnostic analysis**: This is the second type of analysis, which is
    mainly carried out after descriptive analysis. The data obtained from the descriptive
    analysis are taken, and the analysis is carried out to find the reason for these
    results.

    +   3. **Predictive analysis**: This is the third type of analysis. As the name
    suggests, this analysis is used to predict what may happen in the future. Predictive
