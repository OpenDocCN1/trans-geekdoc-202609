    # 14.3  WHAT MAKES ROBOTIC PROCESS AUTOMATION SO SPECIAL?


    People often get confused between RPA and business process automation (BPA), as
    well as business process management (BPM) and BPO (Tom & Apps Publication, 2020).
    Before stating the differences, we discuss the definitions of all the three terms
    stated.


    # 14.3.1  BUSINESS PROCESS AUTOMATION


    Business processes are not just record keeping or data handling and manipulation
    activities, but they have a wider scope. Business process automation is defined
    as the automation of difficult business processes and functions using advanced
    technologies.


    The focus of BPA is always on running and not counting the businesses, thereby
    making it effective and efficient. Business process automation is always an event-driven,
    focused fundamental process.


    A business process is an activity or a set of activities with a target to fulfill
    the goals of an organization, such as producing a product, building an employee
    resource pool, and creating a new customer base.


    Business processes occur in many domains, such as HR and marketing, operations,
    and management, to carry out recurring, time-intensive, collaborative tasks that
    require compliance and audit trials. Examples are employee onboarding, IT service
    desk support, and marketing automation.


    # 14.3.2  BUSINESS PROCESS MANAGEMENT


    Business process management is a domain, in which business processes are discovered,
    modeled, measured, analyzed, improved or optimized, and automated. The methods
    used to manage a company’s work come under business processes. These processes
    can be structured or unstructured and generally use technology for growth purposes.


    Business process management is a time-consuming and extensive process, as it is
    detail oriented. Detailing is required for both documents and training. Thus,
    regulated industries, such as healthcare and banking, generally prefer BPM.'
