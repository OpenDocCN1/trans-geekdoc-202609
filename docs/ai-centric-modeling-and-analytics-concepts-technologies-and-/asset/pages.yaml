  md: '# 18.7 CONCLUSION


    Online social networks are energetic tools used by people worldwide to communicate
    with one another. This systematic review provides online social SBD using DL models
    from 2018 to 2022. Basic information about the botnet, spam and its types, and
    social media bots was provided. The steps involved in detecting spam bots in OSN
    using DL were also discussed.


    X/Twitter is considered the most accessible spam bot social network. Therefore,
    the technique used to detect spam bots on the X/Twitter platform was also analyzed.
    There are many OSNs, but SBD techniques have been proposed only for rare social
    networks, such as Facebook, Instagram, YouTube, and X/ Twitter.


    A plethora of studies have centered around the X/Twitter platform. Prior research
    has mainly concentrated on detecting spam bots and cyberbullying through anomaly-based
    methods, using single feature sets and simple relation structures to identify
    anomalous messages or accounts.


    Anomaly detection techniques that rely on a single feature set have faced more
    difficulties in accurately detecting anomalous events, users, and spam bots. This
    chapter has reviewed the most significant challenges in this area and provided
    solutions to address these challenges (Rana et al., 2021).


    # 18.8 FUTURE SCOPE


    To protect OSN users’ data and profiles from potential spam attacks, it is crucial
    to implement decentralized blockchain techniques in social networks. This will
    ensure that user information is secure and not accessible to third-party authentication
    (Khanh & Khang, 2021).


    Given the ever-increasing size of OSN data, existing methods are no longer adequate
    to manage these data. Therefore, big data techniques can be employed to develop
    more effective ways of handling such data. Because the existing database contains
    outdated information, it can be archived, deleted, or marked as private. In preparation
    for future research, a new database can be created.


    A smaller number of hybrid techniques are being used to detect spam and cyberbullying
    in OSNs. Therefore, there is a need to encourage the use of hybrid techniques
    for detecting spam bots and cyberbullying among researchers. Researchers are primarily
    focused on developing new approaches to detect spam bots and cyberbullying in
    popular social networks, such as Facebook, X/ Twitter, and email.


    In addition to these OSNs, there are other social networks, such as LinkedIn,
    Pinterest, and YouTube, that are also susceptible to spam bots and cyberbullying.
    It is essential to employ proper techniques to detect and prevent these malicious
    activities in the future.


    The detection of multilingual cyberbullying is a challenging task that requires
    further research. Developing an optimization algorithm to prolong the lifespan
    of techniques used for spam bot and cyberbullying detection is crucial for the
    future (Khang et al., 2023c).'
