  md: '# 15.5.3 Objective 3: To Investigate the Scientific Production by Authors


    The present study identified the involvement of 3030 authors in writing 1152 documents
    (articles) from 1987 to 2022 (July 5, 2022). Zhan et al., who published 14 articles
    (maximum), have a 6.23 article fractionalized value, followed by Liu Y, Wang S,
    Wang Y, and Li X, who published 12, 12, 10, and 10 articles and have fractionalized
    values of 5.80, 4.69, 4.37, and 2.79, respectively.


    When assessing an author’s relevance to a specific topic, productivity and influence
    are two critical factors. Both metrics are considered to provide a general summary
    of the top 10 most productive authors over the past 36 years.


    The author’s publication over a specified period was used to measure the productivity.
    This impact was assessed by considering the number of annual citations. Zhang
    Y, Liu Y, and Wang S are the authors who produced the most work, and Law R and
    Wang S are the authors who received the most citations each year.


    Furthermore, Law R has a continuous stream of papers on the subject and is a crucial
    figure in the field, as shown in Figure 15.18. According to Lotka’s law (Lokta,
    1926) of author’s contribution to the publication, only a few authors have published
    more than 10 documents, whereas 2725 authors published only one document. It justifies
    Lotka’s law (the more publications, the fewer authors can be found).


