    # 6.7.3 LATENT SEMANTIC ANALYSIS–SINGULAR VALUE DECOMPOSITION


    In the NLP domain, data are mostly unstructured and high in dimensions. Latent
    semantic analysis (LSA) is a technique used to transform unstructured data into
    structured data. However, this is easier said than done. In addition to its unstructured
    nature, dimensionality reduction is another challenge that needs to be addressed
    in NLP.


    The idea of dimensionality reduction is similar to inferring and understanding
    a three-dimensional object from its two-dimensional shadow, which is possible
    only if the highest level of variability is maintained and preserved in doing
    so.


    Similarly, LSA, besides reducing the dimension, transforms the text into a structured
    form. Latent dimension is a theme hidden behind a cluster of similar words. This
    theme can only emerge on the foundation of a sufficient corpus of words, which
    means that most words are semantically related to a set of other words making
    up a theme or topic.


    Latent semantic analysis strives to bring forth this hidden latent dimension using
    a machine learning algorithm called singular value decomposition (SVD). It primarily
    decomposes a document–term matrix into three component matrices, as shown in Figure
    6.5.'
