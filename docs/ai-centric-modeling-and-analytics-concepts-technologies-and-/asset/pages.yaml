  md: '# 10.4.2 SENSING LEVEL


    Robotic sensing mostly employs algorithms that require environmental input or
    sensory data to enable robots to see, touch, hear, and move (Hahanov et al., 2022).


    The three main sensor types (visual, force/torque, and tactile) identify the three
    most common robotic control strategies: visual serving control, force control,
    and tactile control. They are often the foundation of robotic controllers that
    interpret and evaluate sensory data, as shown in Figure 10.4.


    In contrast to existing methods, such as IoT (65%), AI (75%), cloud computing
    (88%), and BH-ANN (93%), the proposed work is evaluated.


    # 10.4.3 ROBUSTNESS


    The control policy desired actions (such as those brought on by a step) and undesirable
    actions (such as those brought on by a fall) may be used to classify a robot’s
    robustness, as shown in Figure 10.5.


    # 10.4.4 IMPLEMENTATION COST


    The costs associated with developing and implementing an implementation strategy
    that focuses on one or more particular evidence-based treatments are known as
    implementation costs. The approach will have a direct impact on the next intervention,
    perhaps affecting its effectiveness, use, or quality, as shown in Figure 10.6.


