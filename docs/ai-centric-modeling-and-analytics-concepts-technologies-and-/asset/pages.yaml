  md: 'Human touch cannot be replaced with technology because of various factors,
    such as personalization, customization, and empathy, but technology is becoming
    helpful in generating efficient and effective businesses.


    Artificial intelligence is becoming very effective for T&HI. A bibliometric analysis
    using Biblioshiny (using R) and VOSviewer was performed to investigate its growing
    importance.


    Metadata were extracted from the Scopus database (July 5, 2022) from its inception
    1987 to 2022. After filtering the data, 1152 clean datasets were used for the
    final study. Various research gaps were identified, and the research objectives
    were framed based on these gaps.


    # 15.5.1 OBJECTIVE 1: TO INVESTIGATE THE RESEARCH TREND, CLUSTER RESEARCH, AND
    THE EVOLUTION OF RECENT RESEARCH DOMAINS IN TOURISM AND THE HOSPITALITY INDUSTRY


    Research trends were investigated with the help of Biblioshiny, and 1152 documents
    published in the last 35 years were found in 629 sources (journals, conference
    proceedings, books, etc.), with an annual growth rate of 12.44%.


    A total of 3030 authors were identified, of which a single author wrote 179 documents.
    Single-author document collaboration was found at 195, and co-authors per document
    were seen at 3.11. In contrast, the international co-authorship percentage or
    collaboration index (CI) was found to be 3.472, which was found stable and exciting
    compared to other research themes.


    “Social media” and “sustainable tourism” have a CI of 3.4, which is equivalent
    to that of the present study (Martí-Parreño & Gómez-Calvet, 2020). In contrast,
    “Airbnb” has a CI of 2.26 (Andreu et al., 2020), “revenue management in airlines”
    has a CI of 1.85 (Raza et al., 2020), and “information technologies” has the lowest
    CI of 0.71 (Khaparde Professor & Pawar, 2013).


    Owing to the multidisciplinary and interdisciplinary nature of the authors, as
    it covers engineering, management, hospitality, and tourism, the CI is probably
    high.


    Using MCA, a conceptual analysis of the author keywords generated five clusters,
    as shown in Figure 15.7.


    The most significant and impactful cluster is in red, showing the collaboration
    of AI, smart tourism, the COVID-19 pandemic, tourism, marketing, the hospitality
    industry, big data, etc., in an emerging area. The cluster in blue is the second
    most impactful, followed by green, violet, and orange (least collaborative).


    The main keywords associated with the research domain from 1987 to 2013 are artificial
    intelligence, collaboration with the IoT, AHP, e-tourism, tourism, and artificial
    intelligence (Bham bri et al., 2022).


    From 2014 to 2018, modeling (biggest) collaborated with forecasting, service robot,
    the COVID-19 pandemic, and AI. Forecasting was the most significant contributor
    between 2019 and 2020, collaborating with bibliometrics, text mining, smart city,
    AI, and chatbots (Khang et al., 2022b).


    From 2020 to 2021, bibliometrics was the most significant keyword contributor,
    collaborating with AI and COVID-19, as shown in Figure 15.16.'
