  md: 'The confusion matrix in Figure 11.3 represents the performance of the model
    on a binary classification task for a glaucoma dataset, where class 1 is labelled
    as glaucomatous and class 2 is labelled as non-glaucomatous. The matrix is organised
    as follows:


    +   - [[True positives (TPs) | false negatives (FNs)],

    +   - [False positives (FPs) | true negatives (TNs)]]


    The number of cases in which the model successfully identified glaucoma was measured
    as TPs. In this instance, 110 patients were appropriately classified as glaucomatous
    by the model.


    The number of situations in which the model misclassified a situation as not having
    glaucoma is shown by the FNs. The model misclassified 41 instances as not being
    glaucomatous.


    The number of cases in which the model misdiagnosed glaucoma is known as FPs.
    The model misidentified 19 patients as having glaucoma.


    The TNs show the number of occurrences of the model properly identified as non-glaucomatous.
    In total, 207 instances were accurately classified as non-glaucomatous by the
    model.


    This matrix provides insight into the performance of the model. However, it does
    not provide information on class imbalance and the relative importance of each
    class.


    To address this, the matrix can be normalised and the ratios of misclassification
    can be presented in terms of precision and recall.


    # 11.7.2.7  Loss vs. Epoch Curve, Accuracy vs. Epoch Curve, and Model Training
    Time


    The loss vs. epoch curve can gauge how well the model is trained. The model’s
    over- or under-fitting may be identified by examining the curve, and the model
    architecture with hyper-parameters can be changed accordingly.


    The accuracy vs. epoch curve may assess the model’s performance throughout training
    in a manner similar to the loss vs. epoch curve. We can determine whether the
    model is developing and achieving a reasonable degree of accuracy by examining
    the curve.


    The model training time is an important consideration when working with large
    datasets or when deploying models in real-world scenarios, as shown in Figure
    11.4. By evaluating the training time, we can determine whether the model is practical
    for the intended application and make adjustments to the model architecture or
    hyper-parameters accordingly.


    The loss vs. epoch curve shows the change in the loss function over time as the
    model was trained. Because the model was trained over multiple epochs, the loss
    function should decrease as the model becomes better at predicting the correct
    output.


    As the training goes on, the loss in the example reduces, starting at a value
    of 1.3 and ending at 0.1468 at the conclusion of the 30th epoch. The accuracy
    against the epochs graph shows how the model’s accuracy changes as it is trained
