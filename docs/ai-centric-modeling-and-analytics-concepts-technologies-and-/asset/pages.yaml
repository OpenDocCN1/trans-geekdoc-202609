  md: '# 1 Artificial Intelligence-Based Model and Applications in Business Decision-Making


    *Babasaheb Jadhav, Alex Khang, Ashish Kulkarni, Pooja Kulkarni, and Sagar Kulkarni*


    # 1.1 INTRODUCTION


    Data is the buzzword of today’s technology-based era, and almost everyone is running
    behind, capturing data from every individual to provide technical support and
    make their lives easy. Captured data are used to create innovations or products
    that can help individuals make decisions related to their challenges.


    The simplest examples are healthcare applications that check daily footsteps,
    blood pressure, pulse rate, oxygen level, stress level, etc. Data are captured
    either through a mobile-based app or smartwatch, and the application installed
    on a mobile device or computer shows graphs of the daily and monthly data based
    on height and weight measurements that we input. Further, these apps store/generate
    a lot of data from us and show a health dashboard that can further predict health
    issues (Khang et al., 2023d).


    The decision-making process, which is based purely on data gathered from various
    sources and used to resolve a problem, is called a data-centric model. The organization
    creates a mechanism to resolve the issues that occur in its processes. The challenges
    or issues can be as simple as approving the leave request of an employee, or as
    large as launching a new product in the market.


    All problems, from simple to complex, can be solved based on the proper analysis
    of data gathered through various stakeholders, as shown in Figure 1.1. For example,
    Google cuts the attrition rate by half by conducting surveys on the workforce,
    better managers, and talent pipeline, and analysis of the survey helps improve
    the quality of 75% of their lowest-performing managers. This is the power of data
    (UNSCJAMBL, 2021).


    Data analysis is performed by simple calculations, either manually using the human
    brain or on paper, or by using any computer-generated program. The answer may
    lead to another problem or may become useful in another situation. With the connectivity,
    feasibility, and availability provided by the Internet, many organizations rely
    on computer systems for data collection.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '![](img/66ecdb8eb8654ae1c99705e55a45a836_30_0.png)


    FIGURE 1.1 General Approach toward Problem-Solving.


    Source: Khang (2021)


    In such cases, Google and Microsoft have created many applications that can be
    used to collect information from various sources. Tools, like Microsoft Excel,
    provide some kind of pre-processing before pre-processing the data and preparing
    the data for analysis.


    Further advancements in computer applications provide analysis tools that provide
    hands-on information for deciding with some level of forecasting.


    Many organizations are product-based with a common domain, such as marketing,
    finance, human resources, operations, and supply chain management. From a broader
    perspective, all organizations are working on the common goal of making a profit;
    hence, it is assumed that organizations may face similar issues or may be in different
    circumstances. Therefore, to make decisions, organizations develop cases along
    with data. Such outcomes, results, or decisions based on this situation lead to
    the development of the framework/model, which may be used at a certain level of
    issues with some set of data.


    Many studies have attempted to adopt this model and create computer application-based
    platforms where data can be loaded, the situation can be set, and the result can
    be tested before it is applied. The best example of this approach is cloud computing,
    in which we can share software and infrastructure as a service and test our results
    (Rani et al., 2023).


    Furthermore, if this model is applied with artificial intelligence (AI), then
    the solution can be applied directly and tested on a set of data. Hence, in the
    current era, the AI-centric model is preferred for business decision-making (Khang
    et al., 2023a).


    # 1.2 LITERATURE SURVEY


    The authors of the article, “AI in Strategic Marketing Decision-Making” have identified
    a research gap in the application of AI to strategic marketing decision-making.
    They emphasized the need to conduct more research in this field to enable the
    effective implementation of AI in strategic marketing decision-making (Stone et
    al., 2020). This requires researchers to collect and analyze more data to develop
    suitable models for decision-making (Khang et al., 2023b). Overall, this study
    highlights the need for further investigation into the use of AI in strategic
    marketing and its potential benefits.


    Nayal (2022) explored the potential role of AI in the formulation of marketing
    strategies. The author suggests that AI can be effectively used to respond to
    external contingencies, such as high volumes of data, uncertain environmental
    conditions,'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'and limited managerial cognition. By using AI to analyze data and generate
    insights, marketers can create information-rich and effective strategies.


    Gang (2007) created a comprehensive conceptual framework for AI adoption in B2B
    marketing. According to the author, the drivers of AI adoption are current marketing
    shortcomings and the external pressures caused by information.


    The author also identified seven outcomes of AI adoption, including efficiency
    improvements, accuracy improvements, better decision-making, improved customer
    relationships, increased sales, cost reductions, and risk reductions.


    The author utilized information processing theory and organizational learning
    theory to create an integrated conceptual framework that explains the relationship
    between each AI adoption construct in B2B marketing.


    Meyer (2020) explored how AI can be utilized by firms to achieve competitive advantage
    in the market and make informed decisions. The study focused on the role of computer-mediated
    AI agents in detecting crises related to events in a firm.


    Because crises can significantly impact organizational performance, the study
    proposes a structural model that employs statistical and sentimental big data
    analytics to detect critical events related to business activities. The research
    findings suggest that analyzing day-to-day data communications, such as email
    communications, can provide valuable insights for the timely detection and effective
    management of crises.


    Overall, the study highlights the potential of AI in crisis management and emphasizes
    the importance of data-driven strategies for efficient and effective decision-making
    in the B2B market. The study provides valuable insights for firms seeking to leverage
    AI to enhance their market engagement and competitive advantage.


    López Jiménez (2021) aimed to understand the current and growing influence of
    AI and automation in the communication industry and to identify the necessary
    skills and training required to cope with its effects.


    The findings suggest that communication professionals need two types of training:
    first, to gain experience with current AI and automated tools, and second, to
    focus on developing human qualities that AI cannot replicate.


    Overall, the study emphasizes the importance of addressing the impact of AI and
    automation on the communication industry and recommends the development of human
    skills in tandem with technological advancements. This study provides valuable
    insights for communication professionals seeking to adapt to the changing landscape
    of their industry.


    # 1.3 ARTIFICIAL INTELLIGENCE-CENTRIC BUSINESS MODELS


    Data considered to be a focal point for all events can be collected from multiple
    sources based on the utilization of social media, health applications, delivery
    applications (food, grocery, medicine, etc.), and many more applications currently
    generating a huge amount of data (Khang et al., 2023c).


    Emerging organizations can capture these data and generate more entrepreneurial
    opportunities. Computer software developers consider this as an opportunity to
    learn the system through machine learning (ML) and create an artificially based
    application that can either be a new product or service for creating some new
    AI-based applications, as shown in Figure 1.2.'
