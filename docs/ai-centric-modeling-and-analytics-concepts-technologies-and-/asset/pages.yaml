- pgno: 100
  md: '# 4.5 CONCLUSION


    Chatbots are a prime illustration of how AI is increasingly being used in language
    learning. The primary conclusions and implications may be drawn from this case
    study on knowledge, degree of satisfaction as part of students’ affective engagement,
    and response regarding chatbot integration among prospective instructors (Khang
    et al., 2023b).


    Their understanding of contemporary chatbots is restricted to the use of a few
    intelligent personal assistants.


    Students use sophisticated learning tools that can boost their enthusiasm and
    motivation in language learning.


    Incorporating AI chatbots increases students’ interest and enthusiasm in learning
    and teaches students to work together, be solid, and help each other complete
    challenges or every question item from Replika and Kuki.


    Because of the massive Industry 5.0, which forces everyone to be more active in
    adjusting to technology and AI as part of life, preparation, and recent developments
    in the use of AI for language acquisition, the EFL curriculum has to be improved.


    Future educators should be well-versed in many chatbot varieties, as well as their
    advantages and limitations.


    The knowledge gained from this research will help instructors better support their
    students as they apply AI lesson plans throughout the learning process by demonstrating
    how AI may be used to enhance the student engagement (Khang et al., 2023c), such
    as


    +   - **ChatGPT chatbot**: ChatGPT chatbot is an AI chatbot developed by OpenAI
    and released in November 2022. It is built on top of OpenAI’s GPT-3.5 and GPT-4
    families of large language models and has been fine-tuned using both supervised
    and reinforcement learning techniques.

    +   - **Google Bard AI chatbot**: Bard chatbot is a conversational AI chatbot
    developed by Google, based on the Language Model for Dialogue Applications family
    of large language models. It was developed as a direct response to the rise of
    OpenAI’s ChatGPT and released in a limited capacity in March 2023 to lukewarm
    responses.

    +   - **Bing AI chatbot**: The Bing AI chatbot was built by Microsoft using GPT-4
    technology that was developed by OpenAI. GPT-4 is a generative AI model, which
    means that it can be trained by providing it with data, which it then synthesizes
    into answers using natural language.


    As a result, students develop self-reliance and take charge of their education.
    Additionally, curriculum developers may use these results to include AI in cross-disciplinary
    learning methodologies in existing courses (Ahmad et al., 2023).


    Consequently, they can apply learning techniques more effectively. Another area
    in which this research can be useful is to enhance students’ cognitive, behavioral,
    affective engagement, and linguistic proficiency in EFL in the Indonesian context.'
