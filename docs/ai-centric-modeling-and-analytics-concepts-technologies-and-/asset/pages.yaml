    # 18.3 PERFORMANCE METRICS FOR SPAM BOT AND CYBERBULLYING DETECTION


    The most commonly used performance metrics for the methods proposed by different
    researchers to detect spam bots and cyberbullying in OSNs using a DL approach
    are accuracy and average accuracy, precision and average precision, recall and
    average recall, F-measure and average F-measure, G-measure, specificity, and average
    specificity.


    # 18.3.1 Accuracy and Average Accuracy


    The degree to which the number of predicted genuine and fake tweets in a dataset
    is correct is referred to as accuracy. If the accuracy level is 100%, then the
    proposed method will be of value. Equations 18.1 and 18.2 were used to calculate
    accuracy and average accuracy, respectively:


    $A = \frac{S_p + S_n}{S}$ (18.1)


    $AA = \frac{1}{n} \cdot \sum_{k=1}^{n} A_k$ (18.2)


    where $S$ is the total population. The $S$ denoted here represents


    $S_p + S_n + R_p + R_n$


    # 18.3.2 Precision and Average Precision


    Precision is the measurement of the number of accurately classified genuine bots
    among all the information in the testing set. Equations 18.3 and 18.4 were used
    to calculate precision and average precision, respectively:


    $A = \frac{S_p}{S_p + R_p}$ (18.3)'
