  md: 'The way people perceive humor has become a contentious issue, especially during
    discussions with Kuki. The three conversational partners used humor and purposeful
    meaning (pragmatics) in various ways, although this is still difficult to do (Haristiani,
    2019). Overall, the participants were pleased with Replika in this regard.


    However, some students were taken aback and even disturbed by Kuki’s use of humor
    (P7), which they said was occasionally offensive or disparaging and could be detrimental
    to some language learners. Because of their lack of judgment, conversational AI
    has been discovered to have several benefits for learners, one of which is a reduction
    in language anxiety (Gao & Cui, 2022).


    Zhang (2022) also revealed that chatbots are a valuable tool for assisting students
    in participating in classes, particularly during practice activities using mobile
    applications via social networks. Students are eager to discuss their performance
    and understanding with their peers.


    According to data from the current study, a grammatical point is best grasped
    with students’ autonomy in learning and their positive moods in a relaxed style.
    This study was found to be in line with earlier studies that applied Information
    and Communications Technology (ITC) to language teaching and learning (Rani et
    al., 2023).


    The students then had to successfully accomplish the tasks given by the ITC applications,
    and they quickly became fond of the new method of learning, particularly when
    a chatbot was used in an experimental setting. When students learn a foreign language
    through a chatbot in addition to class meetings, their performance significantly
    improves.


    Moreover, the innovative findings of this study have pedagogical value for EFL
    education and instructors. According to Aeni et al. (2021), the three elements
    that make up the incredibly complex educational tool known as gamification are
    ICT, creativity, and a project-based approach to language development.


    Teachers who intend to integrate technology instruction into English teaching
    must be well-trained and well-prepared before teaching to achieve high learning
    results, particularly with regard to teaching materials and classroom activities.


    To create an English course that incorporates AI and ICT in many aspects, teachers
    must first understand the issues, needs, and interests of their students. This
    is especially true when multimedia technology tools may be limited, in which case
    captioned instruction may be recognized as a potential medium to boost learning.


    Future chatbot developers must ensure that chatbots can adapt (or be altered)
    to students’ language proficiency if they want to create chatbots expressly for
    language practice (or at least with that in mind).


    In addition, in line with the earlier idea, students need to view chatbots as
    a chance to learn more (or learn in a different way) than they could with a human
    partner. Future chatbot developers could collaborate with educators to improve
    this crucial component.


    Human language proficiency is a crucial concern in human–technology language practice
    that must be addressed at the outset of the design process (Fryer et al., 2019).
    The easiest strategy might be to construct a wide variety of chatbots (or versions),
    both for different topics and a range of levels, as a chatbot that is sufficiently
    clever to adapt to learners’ levels is still not yet accessible.'
