  md: 'enable them to guide their thoughts and change their personalities in a virtual
    environment comparable to games (Vrushank et al., 2024).


    In an era where AI is widely employed, humankind will concentrate on improving
    their fundamental skills. Intelligent tools or intelligent systems will take on
    tasks, including environment sensing, data collecting, principle discovery, prediction,
    and control based on experience (Rana et al., 2021).


    The growth of AI will motivate individuals to continually seek out new opportunities
    and objectives. People will evaluate and deposition themselves as the binary order
    “physical space—social space” transforms into the ternary order “physical space—social
    space—cyber space.”


    They will obtain a thorough awareness of the possibilities between themselves
    and the outside world as intelligence systems advance and human partial abilities
    are externalized, as well as a wider developing space and more plentiful valuable
    resources (Khanh & Khang, 2021).


    As revolutionized teaching is a human-centric design approach that aims to address
    the issues raised by Industry 4.0 and involves humans and cobots collaborating
    in a shared working space.


    In addition, a related idea known as Society 5.0 has emerged in recent years to
    address the issues in contemporary society (Khang et al., 2022a). Society 5.0
    is a supersmart, futuristic society in which everyone can live high-quality, comfortable
    lives by fusing cyberspace and physical space and making full use of information
    and communication technology (ICT) (Lee et al., 2019).


    Industry 4.0 refers to the incorporation of intelligent devices and systems as
    well as adjustments to existing industrial procedures to boost productivity. Resilient
    technology, innovative working methods, and the place of people in the industry
    are all part of Industry 4.0 (Khang et al., 2022b).


    A wide range of innovations at the level of plants and factories belonging to
    different industries and services, as well as the operation of entire societies,
    are among the changes brought about by Industry 4.0.


    Industry 4.0, also known as the Internet of Things, cloud computing, cognitive
    computing, and AI, is fundamentally a movement toward automation and data sharing
    in industrial technologies and processes (Lee et al., 2019).


    Regarding the argument that industrial value production must be centered on sustainability,
    Industry 4.0 can be seen as a step toward more sustainable industrial value generation
    (Rani et al., 2022).


    Consumers, business models, and the economy all place a lot of emphasis on sustainability
    issues in Industry 4.0. Processes, resources, and energy usage can all be optimized
    across the value network by giving specific information about each site of production
    (Khang et al., 2023a).


    The innovative technology approaches of Industry 4.0 are anticipated to improve
    product environmental performance over the course of their life cycles. Also,
    this implies a rise in demand for intelligent products and production techniques
    (Hajimahmud et al., 2022).


    According to (Machado et al., 2020) the concept that industrial value production
    must be centered on sustainability, Industry 4.0 can be seen as a step toward
    more sustainable industrial value generation.'
