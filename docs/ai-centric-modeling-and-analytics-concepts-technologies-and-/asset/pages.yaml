  md: 'In addition, the researchers interviewed students willing to set the time to
    be interviewed.


    **Question 1:** Do you like studying interactive speaking courses by incorporating
    AI power tools (Replika AI and Pandorabots) in it? Why or why not?


    Fourteen students said they liked it because it was fun and interesting.


    Six students said that this class was fun, felt alive, and encouraged them to
    work together to solve every clue given.


    **Question 2:** What do you like and dislike most about learning interactive speaking
    by integrating AI (Replika AI and Pandorabots)?


    Twelve students said that material topics, especially the speaking exercises,
    encouraged them to find partners and organize groups for practice. These activities
    stimulated and attracted them to keep talking and communicating among themselves.
    The topics were interesting and helped them lessen their fear of speaking. The
    chat-bots were really suitable for speaking activities, and they can explore and
    practice speaking with Replika and Kuki, so it was fun.


    Five students thought that the views and features were challenging, which helped
    them to understand better by doing the exercises.


    Three students liked the look and play of the Replika AI and Pandorabots/Kuki.
    This helped them practice their conversations. The first-year students enjoyed
    it. This learning process was highly motivating for all students, from those who
    are usually passive to those who are active in the classroom. This can encourage
    them to practice conversation and speaking activities without any pressure.


    **Question 3:** Do you find it difficult to follow the teaching and learning process
    by inserting Replika AI and Pandorabots? If yes, mention it!


    Most of the students were involved in the process of learning and were excited;
    however, they had difficulty in installing Replika AI.


    **Question 4:** How should Replika AI and Pandorabots/Kuki be adapted to meet
    your needs?


    Most students said that learning interactive speaking should be more interactive
    and involve more exploration of AI. Ten students stated that online learning must
    be more creative and innovative to be able to attract requests, motivation, and
    attention from students to become more active.


    **Question 5:** What do you like most from these AI chatbots?


    Most of the students stated that Replika was really interactive and unique. They
    could communicate with Replika and Kuki without feeling hesitant. They were really
    sophisticated tools in the teaching and learning process.


    **Question 6:** What is your point of view about Replika and Mitsuku as your AI
    friends?


    **P2 (Ar):**


    About Replika: Configurable avatar (you can choose their gender/sex, with the
    option of non-binary as well; very progressive; no obvious gender bias once they
    are talking to you): When I asked my male Replika about his position on the issue'
