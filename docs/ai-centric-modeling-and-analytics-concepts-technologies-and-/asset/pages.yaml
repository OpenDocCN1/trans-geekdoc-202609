    # 5.3.5 IRRIGATION SYSTEM


    Traditional agriculture is the cornerstone of global development. Despite this,
    because of the population’s exponential growth and increasing consumption, farmers
    need water to irrigate the land.


    Because of the scarcity of this resource, farmers need a solution that changes
    the way they operate. To keep up with and meet demand, new technology has been
    implemented, giving rise to the concept of “Farm 4.0”.


    The irrigation method suggested in this study is clever, adaptable, and low in
    cost and usage. This smart agriculture strategy is based on ML algorithms. To
    achieve this, we used a set of sensors (soil, humidity, temperature, and rain),
    which were placed in an environment that promoted better plant growth for months.


    We then used the Node-RED platform and MongoDB to collect data based on the acquisition
    map from these sensors. Based on our data, we used a variety of models, including
    k-nearest neighbor (KNN), logistic regression, neural networks, SVM, and naive
    Bayes (Khang et al., 2022b).


    In comparison with other models, the findings demonstrated that KNNs perform better,
    with a recognition rate of 98.3% and an RMSE of 0.12.


    Finally, to provide better visualization and oversight of our surroundings, we
    offered a web application that combined various data produced by the sensors with
    forecasts from our model.'
