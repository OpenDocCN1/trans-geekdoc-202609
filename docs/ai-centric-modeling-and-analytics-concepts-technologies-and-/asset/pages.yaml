  md: '# 7 Application of Artificial Intelligence in Healthcare System Management
    with Dynamic Modeling of COVID-19 Diagnosis


    Yerra Shankar Rao and Binayak Dihudi


    # 7.1 INTRODUCTION


    In December 2019, a novel virus caused severe acute respiratory syndrome (SARS)
    coronavirus disease 2019 (COVID-19). The virus is believed to have originated
    from China and subsequently spread worldwide (WHO, 2021).


    When people are in physical contact with each other, this virus is generally transmitted
    from person to person either by face-to-face contact or by droplets that come
    from sneezing. It rapidly attacks the upper part of the respiratory system and
    causes severe infection of the lungs, resulting in breathing problems.


    Initially, no vaccine was available. People, especially the elderly and those
    with chronic diseases, were quickly infected. The healthcare system has been paralyzed
    because of the rapid rise in infection and causality rates (Khang et al., 2023b).


    Governments worldwide have faced significant challenges in improving the healthcare
    system and resources. Hence, different procedures have been adopted for better
    clinical care to control the spread of infections and reduce the morbidity and
    mortality associated with COVID-19.


    Artificial intelligence (AI) is an important tool in today’s society. Hence, artificial
    techniques are utilized in the analysis of chest X-rays and computerized tomography
    (CT) scan images to determine the spread of infection in lungs of patients (Agrebi
    et al., 2020; Mei et al., 2020; Li et al., 2020).


    Almost all countries were affected by SARS COVID-19, which led to widespread loss
    of lives and collapse of the healthcare system, economics, and logistics. According
    to the WHO data on 16 March 2021, approximately 120 million people were already
    infected and approximately 2.7 million people have died (Rani et al., 2021).'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'Artificial intelligence plays a vital role in all fields of science and technology
    (Singh, 2020). Identifying COVID-19 patients and contact tracing have been difficult
    during the early months of the pandemic; thus, AI and modeling simulations have
    been used to explore COVID-19 data (Rana et al., 2021).


    Recently, researchers have observed AI as a promising technology in the field
    of advanced healthcare issues, as it provides better results and enhances processing
    power (Khang et al., 2022a).


    Artificial intelligence has many applications in the field of decision-making
    and for solving critical problems in healthcare systems based on algorithms. This
    technology has also been used for the prediction, detection, and diagnosis of
    COVID-19.


    The latest AI testing methods for diagnosing COVID-19 include nucleic acid testing,
    CT scan, chest scan, medical imaging process, and swab testing. Artificial intelligence
    has made remarkable improvements, particularly in predictive machine learning
    (ML) models for medical system care (Lalmuanawma et al., 2020; Tuli et al., 2020;
    Sathwik et al., 2021).


    Complex architectures of artificial neural networks can be framed using deep learning,
    such as ML languages. After providing a sufficient training dataset, deep learning
    exhibits significant discriminative performance that is essential for forecasting.
    Different techniques are used in the healthcare system, such as Bayesian network,
    fuzzy approaches, and neural networks (Khanh & Khang, 2021).


    Artificial intelligence has been used to fight COVID-19 (McCall, 2020; Zhao et
    al., 2021). With the use of AI and mathematical modeling, the medical sector must
    continuously review how to minimize the infection and death rates caused by COVID-19.
    This will help in the diagnosis of COVID-19 within a limited time period, and
    as a result, patients can be isolated/quarantined earlier to reduce the spread
    of infections.


    Artificial intelligence in medicine (Chawla et al., 2020; Saad et al., 2020; Gaur
    et al., 2021) improves the quality of healthcare systems, increases the accuracy
    of diagnosis, exhibits error-free potential, and rapidly generates data from patients.
    Artificial intelligence models can immediately determine high-risk patients and
    identify the epidemiology of COVID-19 through training data.


    Artificial intelligence-based methods can be used to develop vaccines by evaluating
    viral mutations and screening for potential adjuvants to enhance the effectiveness
    of vaccines and drugs.


    During the pandemic, thermal imaging was used to scan potentially infected individuals
    and areas without social distancing measures.


    Combined with large-scale data, the operation of core clinical services, high-speed
    and accurate diagnosis, improved monitoring, effective treatments and vaccines,
    and countermeasures helped suppress the spread of COVID-19.


    Different methods are used to diagnose COVID-19, some of which are user-friendly,
    inexpensive, and produce immediate results (Chawla et al., 2020).


    Artificial intelligence sensors are available that can detect COVID-19 symptoms
    such as fever, shortness of breath, and dryness of mouth. The combined use of
    AI and mathematical modeling produces significant results in the health sector
    (Khang et al., 2022b).'
