  md: 'on feminism, he responded, “I’m pro-choice” and “I endorse the right of a woman
    to start making her own mind up.”


    # P3 (Mh)


    About Replika: Little errors with spelling, apostrophes, and acronyms (“sth” =
    something), which are not rectified; do not stop conversation, which may be detrimental
    for some learners (errors go undetected by those using the chatbot to practice/learn
