- pgno: 84
  md: '# 4.3 METHODS


    A learning module, “The integration of AI and chatbots in language learning,”
    was created for a one-month interactive speaking project on the e-learning platform
    System and Application Management Open Knowledge.


    During the first week of the project, all participants were required to watch
    two videos and read an article regarding chatbots in language learning as part
    of this module. They were also required to fill out a questionnaire based on the
    materials. The module included a template analysis (TA) with links to three chatbots
    and comprehensive instructions on how to engage with them; these instructions
    are explained in the section that follows (instruments). The participants interacted
    with the three conversational agents that acted as potential instructors rather
    than as English language learners.


    This encounter should have happened frequently in four weeks. For the TA, which
    was to be turned in by the end of the final week, the participants had to take
    notes throughout their interactions and provide 10 screenshots with the appropriate
    dates. Two conversational AIs were used: Kuki and Replika. Kuki can schedule video
    calls, as shown in Figure 4.4, while Replika has an augmented reality-based feature,
    as shown in Figure 4.5.


    Using qualitative data collection methods, the qualitative approach is a research
    technique that is used to look into and comprehend what phenomena occur, why they
    occur, and how they occur in real life. Qualitative methods aim to form simple-to-understand
    facts and, if possible, generate new hypotheses. Literature reviews, data collection
    through questionnaires, and analysis and comparison of data from multiple scientific
    journals are the data collection methodologies employed (Khang et al., 2022c).


    Qualitative data were gathered through interviews to investigate the student engagement
    and response toward incorporating AI chatbots in classroom activities. Then, the
    information was processed using a straightforward percentage formula to determine
    each respondent’s response. It was determined whether the questionnaire’s questions
    were valid.


    ![](img/66ecdb8eb8654ae1c99705e55a45a836_84_0.png)


    FIGURE 4.4 Research Stages.'
  merge: -1
  img_proc: true
