    **FIGURE 10.2** Working Principle of the Proposed Work.


    are affected by network and management weaknesses, which can interrupt manufacturing
    and commercial operations and lead to economic shortfalls.


    More specifically, these may cause network blocking, communication eavesdropping,
    report generation, and bodily harm (Jin et al., 2022).


    # 10.3 PROPOSED WORK


    Robotic automation has swiftly emerged as one of the most important strategies
    for helping firms improve their efficiency for main contributions. People can
    no longer need to perform hazardous tasks, even though robotic systems can operate
    under these conditions (Tailor et al., 2022).


    People are capable of handling routine tasks, dangerous substances, and heavy
    loads. This has caused companies to avoid numerous hazards while also protecting
    their time and money. Figure 10.2 represents the working principle of the proposed
    system.


    # 10.3.1 DATA COLLECTION


    The multimodal human–robot interaction dataset is intended for human-guided engaging
    material perception. This dataset depicts a scenario in which a person instructs
    the robots regarding modeling techniques by using a limited range of mission actions.


    Instead of researching actual human–robot cooperation, this data collection aims
    to educate robots by using a human’s natural teaching capacity (Khang et al.,
    2023c).


    Thirteen women out of the 24 candidates were chosen from the Pittsburgh region.
    The ages of 17 people ranged from 18 to 24, four from 25 to 30, one from 31 to
    35, and two from 41 to 45.


    The candidate sample was vetted to ensure that none of the participants had performed
    the task before using this robotic system in other experiments.


    The research was conducted in the Human and Robot Partners Laboratory of Carnegie
    Mellon University. For their waking hours of one-and-a-half hours, the participants
    received $15 (Newman et al., 2022).'
