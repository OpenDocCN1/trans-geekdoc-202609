- pgno: 80
  md: 'interaction that was achievable, despite the fact that each message delivered
    to the chatbot was briefer and the vocabulary was less varied.


    The development of chatbot technology has come at a good moment. A majority of
    people use computers and social media platforms to conduct social interactions,
    and most people own a variety of technological devices (Machado et al., 2020).


    Some people already use chat-based services (e.g., 7 Cups and Crisis Text Line)
    to connect with other people online for social support during difficult times.
    People also appear to feel at ease talking with chatbots online, perhaps for these
    reasons. Research has nonetheless identified a number of barriers to natural human–chatbot
    interactions.


    Moreover, Fletcher (2015) revealed that software that supports language learners
    through intelligent, scaffolding practice would be the sharp end of technology’s
    tent pole supporting the pavilion of language learning. This transformation in
    how we learn or at least practice a new language seems about to start with the
    chatbot industry.


    Because chatbots are free and available online, they give language learners from
    all over the world a chance to actively communicate in their chosen second or
    foreign language.


    Chatbots may aid in the development of competence and perseverance required for
    students to continue their language studies. Chatbots are available online even
    if their potential for helping the language-learning community has not yet been
    completely realized.


    Chatbots, even in their imperfect condition, provide EFL students (i.e., in countries
    where English is not the first or second language) free and accessible sources
    of linguistic contact. Therefore, studies are crucial to identify the best ways
    to employ these language partners both inside and outside formal education.


    Chatbots have advanced through the years. Even though there is no significant
    advancement in their ability to connect with people in language, most people still
    find them entertaining enough that can be played with. This is encouraging in
    and of itself because play is known to be a crucial part of the learning process
    (Sindhwani et al., 2022).


    Play gives us a safe environment in which to push ourselves beyond our existing
    limits. This is a benefit that technology is well known for being able to provide.
    Therefore, further research should be done to determine whether chatbots can play
    a role in arousing curiosity and in the moment interest.


    However, there are limitations to using chatbots in teaching. Some of these limitations,
    which are main targets of criticism, are their rehearsed responses that make them
    somewhat predictable, their restricted comprehension (vocabulary range and purposeful
    meaning), and their inefficient communication skills (using off-topic, nonsensical
    words).


    The (lack of) student interest in such predictable technologies and the (in) efficiency
    of chatbot–human dialogues in language acquisition are the issues most frequently
    brought up. Aeni et al. (2021) assessed the influence of chatbots on student interest
    by comparing chatbot–human to human–human talks through various activities.


    The authors concluded that while student enthusiasm in courses may be predicted
    by human partner tasks, it decreases when chatbot partners are used. Therefore,
    educators need to do extra work and be more creative in dealing with AI chatbots.
    The different results of this study are shown in Figure 4.2.'
