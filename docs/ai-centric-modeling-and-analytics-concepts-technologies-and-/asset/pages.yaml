    # 18.4.3 Cyberbullying Detection in Online Social Network Using Deep Learning


    Cyberbullying is referred to as the utilization of the Internet community to send
    unwanted tweets and messages by injuring or hurting the Internet users.


    The major effect of cyberbullying is that it can make a person commit suicide
    (Yao et al., 2019). There are two methods involved in the detection of cyberbullying:
    textual-based and multimodal-based methods.


    The textual-based method uses only textual data to detect cyberbullying, whereas
    a multimodal-based method uses both textual and additional features to detect
    cyberbullying (Dadvar & Kai, 2020).


    Al-Ajlan et al. (2018) proposed a DL-based cyberbullying detection method in the
    X/Twitter network community. An optimized DL-based cyberbullying detection model
    is used to detect cyberbullying in social networks.'
