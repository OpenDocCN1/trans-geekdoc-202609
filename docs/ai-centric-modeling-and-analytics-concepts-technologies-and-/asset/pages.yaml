  md: '# 16.3.2 RESULTS FOR THE LOGISTIC MODEL


    The logistic model assumes the growth rate proportional to the factor of $P\left(1-\frac{P}{L}\right)$,
    which means that the growth rate is close to zero when $P$ is too small or $P$
    is close to $L$. In other words, for the logistic model, the relative growth rate
    is proportional to $(1-P/L)$, whereas the growth rate of the exponential growth
    model is a constant.


    Here, $L$ is the carrying capacity (i.e., the maximum population that lives in
    the area for the population growth problem), and the resulting model is shown
    in Equation 16.4:


    $\frac{dP}{dt}=rP\left(1-\frac{P}{L}\right)$

    (16.4)


    The solution of Equation 16.4 is Equation 16.5:


    $P(t)=\frac{L}{1+Ae^{rt}},\,t\ge0$

    (16.5)


    where $A=\frac{L-P_0}{P_0}$ depends on the initial population $P(t_0)=P_0$. We
    used the data in Table 16.1 to obtain logistic solution for the problem. By using
    regression analysis in GeoGebra, which is a dynamic mathematics software, we obtained
    the following solution for the solution in Equation 16.5 as Equation 16.6:


    $P(t)=\frac{2.4202}{1+1.4202e^{1.7826t}},\,t\ge0$

    (16.6)


    We plotted the logistic solution with data in Figure 16.8 and provide some estimation
    results via the logistic solution in Table 16.3.


    As shown in Table 16.3, the results obtained with the logistic model are similar
    to the results of the exponential decay model. The phenol concentration reached
    0.01 and 0.5 within approximately an hour and 0.54 hour, respectively, after the
    process started (Gadirova et al., 2024).


    **TABLE 16.3**

    **Estimation Times by Logistic Solution Required for the Complete Removal of Phenol
    from a 1 mg L⁻¹ Phenol Solution with the Addition of TiO₂.**


    | Time (hours) | TiO₂ (g) |

    |---|---|

