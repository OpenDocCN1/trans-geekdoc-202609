    using multiple options, such as pay-per-use fees or pay monthly. Public cloud
    service providers monitor these services. Therefore, there is no requirement for
    users to hold these services at their own data centers.


    A public cloud is helpful for companies that do not wish to expand their physical
    infrastructure. A virtual desktop license can be a good alternative to a physical
    desktop machine, as the virtual machine can be used and deactivated in a very
    short period (minutes) and is portable.


    Data storage is another application of the public cloud, as the stored data are
    easily accessible from anywhere and have backup as per the needs. The infrequently
    used data can also be stored inexpensively on the cloud. One of the concerns of
    using the public cloud is security, which must be considered (Bham... et al.,
    2022).


    # 14.4.2 PRIVATE CLOUD


    A private cloud can also be termed an exclusive service of cloud facilities and
    computing given to an organization where other organizations are automatically
    not involved. Thus, the company owns the data center. Private clouds are more
    secure and controllable than public clouds.


    # 14.4.3 HYBRID CLOUD


    Hybrid cloud is a combination of public and private clouds, with features from
    both. For example, a public cloud can handle fewer mission-critical functions.
    In RPA, cloud services are used differently and have different implications.


    First, a platform must deal with complex distributed applications, which may be
    difficult when custom programs are developed by the company on cloud services.


    In addition, RPA platforms generally fail to scale up from the on-premise software
    to the cloud. Developing cloud-native systems is a difficult and uphill task for
    an RPA because deep connections are required across many applications and environments.


    # 14.5 GENERALLY USED ROBOTIC PROCESS AUTOMATION TOOLS


    The following are the five generally used RPA tools:


    +   - Blue Prism

    +   - UiPath'
