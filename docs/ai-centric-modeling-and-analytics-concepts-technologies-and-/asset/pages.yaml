    use Spotify to listen to music, particularly dance music.


    We believe you meant to say, “You have” instead of “You had.” Did you skip class
    on that particular day? When I tried to duplicate her responses on another time,
    she caught me and said, “Are you copying my replies for a reason?” I responded
    by doing the same, to which she stated, “You can’t be too brilliant if you have
