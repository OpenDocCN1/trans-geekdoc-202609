  md: 'In contrast to the literature, the adsorbent properties of TiO₂ nanoparticles
    with a complete rutile phase have been studied. TiO₂ nanoparticles were prepared
    using the sol–gel method. TiO₂ nanoparticles were analyzed according to the structural
    equation modeling (SEM) methods.


    The TiO₂ nanoparticles have a spherical shape with sizes varying from 10 to 30
    nm. The SEM data correlated well with the results obtained from the X-ray powder
    diffraction (XRD) analysis.


    The purity and crystalline properties of the TiO₂ nanoparticles were investigated
    by the powder XRD method. X-ray structure analysis graphs of the studied nanocomposite
    materials were recorded on a Rigaku Mini Flex 600 powder diffractometer.


    X-ray tube with a copper anode (Cu Kα radiation, 30 kV and mA) was used to draw
    the diffraction spectra at room temperature. At 2θ = 20°–80° in the discrete growth
    mode, these spectra were obtained at 2θ = 0.05°, and the exposure time was τ =
    5 seconds (Elmina et al., 2020).


    In this work, TiO₂ nanoparticles were used to remove phenols from wastewater.
    For this, a solution (5 ml) of 0.05 g of TiO₂ in 10 ml of distilled water was
    prepared. The nanoparticles were completely mixed in the presence of X-ray radiation
    for a uniform discharge in distilled water. The resulting TiO₂ was used to absorb
    a phenol solution with a concentration of 1 mg L⁻¹.


    A mixture of 5 ml of the rutile-phase TiO₂ composite with 20 ml of a 1 mg L⁻¹
    phenol solution was absorbed for 2 hours at 25°C. Based on the curves obtained,
    adsorption was found to be slow. The process was investigated using a “Varian
    Cary 50” device (Khang et al., 2024).


    # 16.3  DISCUSSION AND RESULTS


    The following graph shows the dependence of the absorption coefficient of 1 mg
    L⁻¹ phenol solution on the wavelength, as shown in Graph 16.1. There was no adsorption
    in the process; therefore, curves compatible with phenol were obtained in the
    270 nm area.


    As shown in Figure 16.1, phenol-similar curves were obtained at 200–300 nm. It
    is also known from the literature that the curve obtained at 270 nm wavelengths
    corresponds to that of phenol, as shown in Figure 16.2.


    After 2 hours of adsorption process, the phenol solution was filtered off. This
    solution was then transferred to the “Varian Cary 50” spectrophotometer. In this
    case, curves corresponding to phenol (270 nm) were again observed; however, according
    to the measurements on the degree graph, a decrease in phenol (30%) was observed
    in the solution, indicating weak adsorption.


    After 60 minutes of the process, the adsorption curves practically did not change,
    which is associated with the capture of the surface of the TiO₂ nanoparticles
    attributable to chemisorption. Consequently, adsorption occurred over a period
    of time and then did not occur. Figure 16.3 shows a comparison of the adsorption
    curves for 30, 60, 90, and 120 minutes.


    Figure 16.4 shows a comparison of the adsorption curves for 30 and 120 minutes.
    As shown in Figures 16.3 and 16.4, phenol-specific peaks were observed in the
    obtained curves.'
