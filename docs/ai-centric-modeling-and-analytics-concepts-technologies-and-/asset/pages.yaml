  md: 'Le-Net utilised the brightest spot approach to extract the return on investment
    and achieved 98.67% accuracy for input photo validation. They also employed the
    U-Net design, which, for such segmentation of the optic disc and optic cup, yielded
    dice coefficients of 0.93 and 0.87, respectively.


    The optic disc region was first divided using the DeepLabv3+ architecture proposed
    by Sreng et al. (2020), which is a fully automated glaucoma screening approach.


    However, the encoder module was replaced with several deep convolutional neural
    networks (CNNs). For their three ideas, they used pre-trained deep CNNs: (1) TL,
    (2) learning feature descriptors with support vector machines (SVMs), and (3)
    constructing an ensemble of methods from (1) and (2).


    These methods were evaluated on five datasets comprising 2787 retinal images.
    DeepLabv3+ and MobileNet were combined to yield the best results for optic disc
    segmentation, with an accuracy of 99.7%, a dice coefficient of 91.73%, and an
    intersection over union of 84.89%.


    Kumar et al. (2016) proposed a collection of image processing techniques for identifying
    glaucoma. They found that using a glaucoma screening approach that employed super
    pixel classification on a set of 650 pictures resulted in overlapping errors of
    9.5% and 24% in the optic disc and optic cup, respectively.


    They found that glaucoma detection without segmentation had an 86% success rate
    on 200 real-world photographs using three different classifiers: naive Bayes,
    k-nearest neighbour, and SVM.


    Zhuo et al. (2010) proposed an approach that uses deep neural network (DNN)-based
    modules, such as a retinal sickness diagnosis and clinical description generator,
    and a DNN visual explanation module.


    They trained a DNN-based model on the DeepEyeNet dataset to effectively learn
    resilient features of retinal images. Their method can generate therapeutically
    useful descriptions and explanations of retinal images.


    To categorise glaucoma, Hafsa Ines et al. (2014) suggested extracting certain
    traits from retinal fundus images. The cup-to-disc ratio (CDR), a crucial physiological
    parameter for the diagnosis of glaucoma, and the neuroretinal rim ratio inside
    the inferior, superior, nasal, and temporal quadrants (ISNT quadrants), a measure
    used to confirm the ISNT rule, are examples of these features.


    Three different databases – Digital Mean Elevation Data, FAU (An online collection
    that may include articles, statistics, images, music and/or other types of information),
    and Methods to Evaluate Segmentation and Indexing Techniques in the field of Retinal
    Ophthalmology —were used to assess the suggested approaches. When evaluated on
    80 retinal images, the method exhibited a 97.5% accuracy rate and required an
    average computation time of 0.8141 seconds.


    Fathima and Subhija (2019) discovered that when collaborating with the Center
    of Prevention and Attention of Glaucoma in Bucaramanga, Colombia, the success
    rate of glaucoma identification using fundus photographs was 88.5%.


    Ophthalmologists estimated the CDR for each image, and measurements were obtained
    across a group of 26 fundus photographs of both unhealthy and healthy eyes. The
    error percentage was 19.2%, while the absolute error was 8.6%.'
