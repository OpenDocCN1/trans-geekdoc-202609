  md: '# 5 Application of Artificial Intelligence in AgroWeb


    Reethika A., Danush R., Akshaya E., and Kanaga Priya P.


    # 5.1 INTRODUCTION


    The project''s goal is to aid the expansion of the agricultural sector, which
    is the foundation of the Indian economy. Modernization must satisfy the demands
    of the expanding market, and the use of technology is crucial.


    Approximately 18% of the gross domestic product and 40% of the net domestic product
    go to the agricultural sector. Although it has a significant impact on the economy,
    the agricultural sector has lost ground as an effect of improper practices of
    technology that could have benefited farmers and others involved in the industry
    (Khang et al., 2023a).


    The most populated in the world, India, will need to fulfill demand, which will
    hurt the economy and make life difficult for families in the lower and middle
    classes because food will not be as inexpensive. Many policies have been created
    for this industry to ensure that farmers have little risk because they are given
    financial support. The minimum support price was introduced to ensure that nothing
    is wasted, but very few policies have been created to improve the quality and
    yield of production.


    Very few policies aid farmers in expanding their capabilities. Farmers in the
    21st century require not just policies but also technologies that could directly
    benefit them by boosting their output yield and quality.


    Despite having enormous machines, farmers still need technology assistance, such
    as Internet of Things sensors installed in their fields that can sense information
    and relay real-time data. The implementation of such a technology is also challenging
    because the majority of farmers lack formal education (Khang et al., 2022a).


    As a result, everything needs to be made clear and simple so that everyone can
    understand it. To raise their harvest, many farmers still rely on outdated techniques,
    experiences, and rumors that create issues.


    Moreover, not all farmers have expansive fields or work in agriculture as their
    primary profession; many rely on farming as their secondary source of income,
    which means they consume the crops they cultivate and at the same time sell them
    for very little money, primarily to neighborhood merchants (Khang, 2023c).


    The issue with the Internet that existed around ten years ago that connection
    was not possible everywhere has also been resolved. Nowadays, the majority of
    locations have Internet access to distribute information.'
