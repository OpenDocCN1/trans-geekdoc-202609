  md: 'The second compounded matrix is given by Equation 7.23:


    J^{[2]} = \begin{pmatrix} -2d_{1} - \beta I - \mu & \beta S & 0 & 0 & 0 & 0 \\
    \mu & -2d_{1} - d_{2} - \alpha - \beta I & 0 & 0 & 0 & 0 \\ 0 & \alpha & -2d_{1}
    - d_{2} - \delta - \beta I & 0 & 0 & -\beta S \\ 0 & \beta I & 0 & -(2d_{1} +
    d_{2} + \mu + \alpha) & 0 & 0 \\ 0 & 0 & \beta I & \alpha & -(2d_{1} + \mu + d_{2}
    + \delta) & \beta S \\ 0 & 0 & 0 & 0 & \mu & -(2d_{1} + 2d_{2} + \alpha + \delta)
    \end{pmatrix} \tag{7.23}


    To obtain the matrix B in the Bendixson matrices condition, we define the diagonal
    matrix M as Equation 7.24:


    M = \operatorname{diag}\left(1, \frac{E}{I}, \frac{E}{I}, \frac{E}{I}, \frac{E}{I},
    \frac{E}{I}\right) \tag{7.24}


    We can define a vector field of the system then Equations 7.25 and 7.26:


    M_{f} M^{-1} = \operatorname{diag}\left(0, \frac{E''}{E} - \frac{I''}{I}, \frac{E''}{E}
    - \frac{I''}{I}, \frac{E''}{E} - \frac{I''}{I}, \frac{E''}{E} - \frac{I''}{I},
    \frac{E''}{E} - \frac{I''}{I}\right) \tag{7.25}


    B = M_{f} M^{-1} + M J^{[2]} M^{-1} = \begin{pmatrix} -2d_{1} - \beta I - \mu
    & \frac{\beta S I}{E} & 0 & \frac{\beta S I}{E} & 0 & 0 \\ \frac{E \mu}{I} & -2d_{1}
    - d_{2} - \alpha - \beta I + \frac{E''}{E} - \frac{I''}{I} & 0 & 0 & 0 & 0 \\
    0 & \alpha & \frac{E''}{E} - \frac{I''}{I} -2d_{1} - d_{2} - \delta - \beta I
    & 0 & 0 & -\beta S \\ 0 & \beta I & 0 & \frac{E''}{E} - \frac{I''}{I} - (2d_{1}
    + d_{2} + \mu + \alpha) & 0 & 0 \\ 0 & 0 & \beta I & \alpha & \frac{E''}{E} -
    \frac{I''}{I} - (2d_{1} + \mu + d_{2} + \delta) & \beta S \\ 0 & 0 & 0 & 0 & \mu
    & \frac{E''}{E} - \frac{I''}{I} - (2d_{1} + 2d_{2} + \alpha + \delta) \end{pmatrix}
    \tag{7.26}'
