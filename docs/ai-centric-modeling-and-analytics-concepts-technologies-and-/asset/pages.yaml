    # 12.6 CONCLUSION


    This chapter presented the fog-based model for the prediction of forest fires.
    The dataset for forest fire prediction was derived from the benchmark website.
    The dataset pre-processing mechanism within the acquisition layer handles all
    the abnormalities and finalizes the classification accuracy stored within the
    cloud layer.


    The data acquisition layer is fed into the fog layer. The fog layer contains the
    mechanism of energy conservation, which is achieved through a reduction mechanism
    using PCA. The exploratory data analysis mechanism reduces the size based on the
    correlation calculated using the PCA. The obtained result for the fog layer is
    entered within the cloud layer (Geetha et al., 2023).


    The result from the cloud layer can be extracted by administrators with an account
    within the cloud layer. The result of the classification accuracy is in the range
    of 95%, which is almost 7% better than that of the existing model, which proves
    the worth of the study.


