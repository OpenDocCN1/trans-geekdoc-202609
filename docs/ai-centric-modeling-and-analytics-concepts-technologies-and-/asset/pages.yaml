  md: '# 7.7 **CONCLUSION**


    A dynamic epidemic *SEIQR* model for coronavirus was formulated using AI, both
    numerically and mathematically. An AI technique was used to detect COVID-19.


    The existence of equilibrium points in the model was investigated. The observation
    of the model was stable and depended on the basic reproduction number. The local
    stability of a disease is asymptotically stable when its number is less than unity.


    When the number is greater than unity, the situation becomes pandemic.


    +   - This pandemic can be handled by improving medical facilities and developing
    vaccines in a short time.

    +   - This AI technique also plays an important role in epidemiology.

    +   - This can help in the diagnosis, detection, prediction, and social control
    for combating COVID-19 due to latency between the susceptible and infected populations.
    The *SEIQR* model is more suitable for modeling.


    The AI technique was combined with mathematical modeling to speed up the elimination
    of the virus without human intervention.


    To control the spread of the virus, the AI technique rapidly isolated or quarantined
    people. The developed forecasting model can help in the policymaking and in tackling
    COVID-19.


    Control methods may include booster dose vaccination of susceptible individuals.
    This model suggested that the healthcare system build up a team with data to control
    emergency cases.


    Our mathematical model shows that quarantine during the pandemic changed the situation.
    This optimal strategy helped in the recovery of patients from different geographical
    locations and emphasized the focus of the AI technique on the healthcare system
    rather than on individuals.


    This AI model helps the medical sector move forward to a better solution for the
    diagnosis and treatment of diseases. Artificial intelligence improves efficiency
    and productivity by reducing manual errors (Khang et al., 2023c).


    Quarantine and social distancing norms play a crucial role that must be addressed
    with careful consideration.


    Artificial intelligence knowledge of equipment may be effectively used to deal
    with some of these challenges and assist in solving fundamental problems in global
    disasters. The simulated results are supported by real parametric values.


