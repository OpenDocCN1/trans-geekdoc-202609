  md: '$$\mathrm{AP}=\frac{1}{n}\sum_{k=1}^{n}P_k \tag{18.4}$$


    # ### 18.3.3  Recall and Average Recall


    Recall is the measurement of the number of accurately divided genuine bots among
    all genuine information in the testing set. Equations 18.5 and 18.6 were used
    to evaluate recall and average recall, respectively:


    $$A=\frac{S_p}{S_p+R_n} \tag{18.5}$$


    $$\mathrm{AR}=\frac{1}{n}\sum_{k=1}^{n}r_k \tag{18.6}$$


    # ### 18.3.4  F-Measure


    F-measure is the balanced mean of both the recall and precision metrics. Equations
    18.7 and 18.8 were used to calculate F-measure and average F-measure, respectively:


    $$F=2\times\frac{P\times r}{P+r} \tag{18.7}$$


    $$\mathrm{AF}=\frac{1}{n}\sum_{k=1}^{n}F_k \tag{18.8}$$


    # ### 18.3.5  G-Measure


    G-measure is the square root of precision and recall. Equation 18.9 was used to
    calculate G-measure:


    $$g=\sqrt{P\times r} \tag{18.9}$$


    # ### 18.3.6  Specificity and Average Specificity


    Specificity was used to calculate the capacity of the classifier to accurately
    identify true-negative results. Equations 18.10 and 18.11 were used to evaluate
    specificity and average specificity, respectively:


    $$\mathrm{Sp}=\frac{S_{pn}}{S_n+R_p} \tag{18.10}$$


    $$\mathrm{ASp}=\frac{1}{n}\sum_{k=1}^{n}Sp_k \tag{18.11}$$'
