  md: 'Tanaka and Tierney (2018) used the branch-and-bound method to schedule jobs
    with sequence-dependent setup times on a single processor to reduce the overall
    number of tool adjustments.


    This approach has limited computational flexibility and is only appropriate for
    small-scale applications. Deng et al. (2019) examined two distinct flow-shop scheduling
    issues. These occur when one machine in a two-machine situation exhibits sequence-dependent
    setup time.


    The goal was to find a schedule to reduce the makespan. An effective DP formulation
    was created for each of these problems after the best permutation schedules have
    been determined. Dai et al. (2019) developed genetic algorithm-based algorithms
    that draw inspiration from Darwin’s idea of natural selection and survival.


    According to Rius-Sorolla et al. (2020), formulating scheduling issues as mathematical
    programming models is a natural approach to solving them. The outcomes were unsatisfactory
    because many of these strategies could not produce workable answers to issues.
    As a result, the practical utility of these strategies is limited.


    Tomazella and Nagano (2020) reduced the cost of machine configuration, Istatic
    scheduling issues with m machines, and resolved n jobs mathematically using the
    branch-and-bound technique. They hypothesized that the setup times were dependent
    on the order of events. The processing times were not considered.


    Only small issues were solved using this technique. This provided insight into
    the composition of ideal solutions. They can be applied to create effective heuristic
    rules. Heuristic rules are typically more suitable for solving large-scale scheduling
    problems when the computational work for optimizing procedures increases rapidly
    with problem size.


    The adaptive heuristic method known as artificial immune system (AIS) is influenced
    by the human immune system. The two key components of the immune response mechanism
    are as follows:


    +   1) Clonal selection principle

    +   2) Affinity maturation.


    Silva et al. (2020) employed a heuristic for hybrid flow shops based on AIS. Houben
    and Van de Poel (2019) reduced the overall flow time in permutation flow shops
    by using two ant colony optimization algorithms. An initial seed sequence was
    produced using these algorithms. At the conclusion of each iteration, a local
    search was conducted.


    In a flow shop scheduling setting, an artificial neural network (ANN) was utilized
    to minimize the dual criterion of the makespan and total flow time. They demonstrated
    that the ANN produces a solution quality that is either comparable to or superior
    to that of classical heuristics. They concluded that as the number of training
    exemplars increased, the ANN gradually increased the quality of the solutions.


    According to Iqbal et al. (2020), big data have a huge impact on creating useful
    smart cities and sustaining contemporary societies. Businesses use big data to
    enhance operations, develop tailored marketing campaigns, and perform'
