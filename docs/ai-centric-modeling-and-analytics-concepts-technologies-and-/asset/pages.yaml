    # 11.7.2.5 Model Training Time


    The length of time required to train a model on a certain dataset is referred
    to as the model training time. The quantity of the dataset, computing resources
    available, and complexity of the model architecture can all have an impact on
    this (Ajayi & John, 2023).


    While deploying models for real-world settings or when working with large datasets,
    it is crucial to consider the training time because models with longer training
    time may not be suitable for certain applications.


    A model’s efficiency may be increased by making improvements after analysing the
    training duration to detect bottlenecks in the model’s design or training procedure.


    The evaluation of models using a confusion matrix, loss vs. epoch curves, accuracy
    vs. epoch curve, feature maps, and model training time can provide valuable insights
    into the performance of a model.


    # 11.7.2.6 Confusion Matrix


    By analysing the confusion matrix, we can determine the number of TPs, TNs, FPs,
