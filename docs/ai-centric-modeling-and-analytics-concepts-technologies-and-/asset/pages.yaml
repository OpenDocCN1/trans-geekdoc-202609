    The basic methodology shown in Figure 18.4 for detecting spam bots in OSNs using
    deep learning (DL) includes data collection, pre-processing, feature extraction,
    training the model using DL techniques, testing the model, and evaluating the
    performance measure.


    # 18.1.2.5  Data Collection


    Online social network datasets can be either non-graph-based or graph-based. If
    graphs are constructed from a social network, those datasets are known as graph-based
    datasets. However, if datasets are taken from the extracted features of OSNs using
    APIs, such datasets are known as non-graph-based datasets (Wang et al., 2019).
    Every OSN community has its own APIs, such as Facebook APIs and Twitter4J APIs,
    to create datasets.


    # 18.1.2.6  Data Pre-Processing


    After gathering all the data from the social networks, the next step is to pre-process
    the data. The data gathered must be cleaned or filtered using pre-processing mechanisms
    before applying it to DL models (Cheng et al., 2019). The pre-processing stage
    involves several stages, such as cleaning or filtering, stemming, removal of stop
    words, tokenization, and segmentation.


    # 18.1.2.7  Feature Extraction


    The model is trained only based on the best feature extracted data. Therefore,
    the best feature extraction techniques must be utilized in further processes.
    This is the main concept for improving the efficiency and effectiveness of the
    DL model.


    The feature extraction techniques can effectively remove unnecessary features
    from a set of features (Jogin et al., 2018). This reduces the complexity of the
    proposed model. In addition, the reduced features can diminish the overfitting
    problem and increase the accuracy of the proposed DL model.


    Some of the feature selection methods used are information gain and optimization
    algorithms, such as particle swarm optimization (PSO), whale optimization algorithm,
    and ant colony optimization (Sharma & Manu, 2021).


    # 18.1.2.8  Training the Model Using Deep Learning Techniques


    Using the extracted features, the proposed model is trained using DL techniques.
