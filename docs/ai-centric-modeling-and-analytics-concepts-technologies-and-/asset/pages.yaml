    # 15.6  CONCLUSION


    COVID-19 taught us a lesson to maintain social distancing; improved the importance
    of hygiene, cleanliness, and sanitation in our daily routine; and increased an
    individual’s privacy, especially hotel guests. It brought one of the worst conditions
    for the hospitality and tourism industry because of its real, not virtual, experience.


    People have become trapped in their homes during the COVID-19 pandemic. Still,
    they slowly started availing themselves of the virtual facility to enjoy their
    dream destinations, and the demand for online food deliveries also increased due
    to safety concerns.


    Slowly, when people started moving from their homes to outstations for leisure,
    pleasure, sports, medical, or business purposes, the government also imposed guidelines
    for the safety of guests and their employees.


    Here comes touchless check-in, barcode menu scanning, mobile room key, and so
    on. All of these guest activities were being tracked/noticed by the mobile or
    software cookies. It started by suggesting an area of concern and interest to
    the guest with the help of AI/ML. This study proposes a systematic review of AI/ML
    based on statistical methodologies to identify dominant publications, authors,
    and research groups.


    To examine the social, intellectual, and conceptual structures of knowledge, it
    was decided to carry out network visualization using VOSviewer and data exploration
    (Biblioshiny using R). After applying the qualifying requirements and eliminating
    duplicates, inadequate, and missing data, 1152 publications, 3030 authors, 629
    sources, and 109 countries, published between 1987 and July 5, 2022, were examined.


    Over time, the increasing number of keywords demonstrates the importance of AI
    and power phrases, such as robots, service robots, technology, automation, and
    sustainable development.


    Because of the importance of AI in improving the guest experience while staying
    in a hotel room, scanning menu cards, paying an online bill, maintaining social
    distancing, and enjoying touchless expertise are considered the most conventional
    and significant research paths (Khang et al., 2023b).


    According to our study, there has been a significant increase in publications
    on AI in hospitality and tourism. The most critical and pertinent factor for the
    hospitality and tourism industry’s success lies in AI/ML to understand guests’
    happiness, satisfaction, trust, and revisit intention.


    The relationship between big data, IoT, decision support systems, forecasting,
    innovation, and marketing was significant. Machine learning is a cluster with
    keywords, such as deep learning, smart tourism, neural language processing, sentiment
    analysis, social media, and recommendation system, which can attract people’s
    attention in T&HI (Khang et al., 2024).'
