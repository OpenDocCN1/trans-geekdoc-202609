    # 17.5 CONCLUSION


    This study employed predictive analytics and statistical data analysis to evaluate
    the Mendeley dataset for detecting phishing websites.


    The IG feature selection technique was employed to identify five prominent feature
    attributes from the entire 88,647 websites in the dataset.


    Prominent attributes are used to train a neural network and the naive learner
    algorithms to predict the status of a particular website as either positive (phishing)
    or negative (legitimate).


    Other data attributes that relate to the URL, domain name, and parameters were
    further analyzed to identify their location, skewness, and dispersions on the
    interquartile range and their correlation coefficient with the ground truths of
    being malicious or legitimate.


    The experimental results revealed that the slash (/) character in the file directory
    or domain has the highest IG, and hence determines the status of a website. The
    results show that the slash character is more prominent on phishing websites than
    on legitimate websites.


    The length of website URLs and domains as well as the number of vowels in the
    domain of a website have a positive correlation with their phishing status. The'
