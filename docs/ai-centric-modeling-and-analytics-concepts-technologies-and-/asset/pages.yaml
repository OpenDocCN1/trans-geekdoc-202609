    The United Nations Office for Disaster Risk Reduction (ESCAP, 2015) has cautioned
    that wildfires would become more recurrent and destructive as global temperatures
    soar, drought conditions plague, and temperature changes in many regions of the
    world (Saoudi et al., 2016; Sinha et al., 2017).


    Therefore, to combat these wildfires, it is essential to adopt a comprehensive
    multifaceted approach that enables continuous monitoring of wildfire-susceptible
    terrains as well as reporting of time-critical and latency-sensitive data and
    events for early prediction and forecasting of wildfires (Loomba & Anderson, 2018).


    Over the years, various techniques have been deployed to monitor wildfire-susceptible
    regions and fight wildfires (Jha et al., 2015). Wildfire detection systems based
    on satellite imagery have been extensively used, but they are not suitable for
    real-time applications because of various issues, such as lengthy scanning cycles,
    poor resolution, and high cost (Giuntini et al., 2017).


    Furthermore, systems based on short-range optical infrared and thermal images
    have been proposed; however, these systems suffer from sensitivity to outliers,
    such as direct and strong sunlight, inadequate light, or smoke.


    In addition, these systems are extremely prone to false alarms (Bornmann & Leydesdorff,
    2014). To address the aforementioned challenges, there has been a shift towards
    the use of wireless sensor networks (WSNs) for time-critical applications (Jan
    et al., 2018), such as real-time wildfire prediction and detection, to minimize
    the destruction caused by them.


    Several wildfire detection systems centred on WSNs have been proposed; however,
    the majority of these systems are designed to detect wildfires upon their outbreak
    (Dhar et al., 2017). However, once wildfires break out, they become extremely
    difficult to contain because of their uncontrolled and unpredictable rapid growth
    and behaviour.'
