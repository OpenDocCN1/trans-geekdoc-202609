  md: '# 3.2.2.4.1 Smart Devices/Sensors


    Smart devices and sensors form the basis of the IoT ecosystem. These devices interact
    with each other, being special AI-based devices. When we say smart device, in
    the simplest case, we can give examples of cellphones, computers, televisions,
    air conditioners, and refrigerators that we use every day.


    With an intelligent network (IoT) created by connecting these devices together,
    we can control them even if we are far away from them. For example, you left the
    house but you do not remember turning off the air conditioner.


    With the help of a smart home system (in which smart home is another area where
    IoT is applied), you can turn off the air conditioner while you are on the go.
    Smart devices include not only devices in everyday life but also devices used
    in various fields (for example, smart medicine containers in medicine and various
    warning devices).


    On the other hand, small smart devices called sensors are also one of the main
    parts of the AI ecosystem. These small devices detect certain changes in the environment
    and collect information about them. These devices can detect things, such as temperature,
    pressure, and motion, and if they are connected to a network, they can share the
    data they collect over the network (Rana et al., 2021).


    In short, data collected through AI sensors are transmitted to the cyber environment
    and analyzed. Here, we often come across the concept of KFS (Khanh & Khang, 2021).


    There are different types of AI sensors: temperature, motion, pressure, chemical,
    gas, infrared, water quality, humidity, optical sensors, and others (Hahanov et
    al., 2022).


    # 3.2.2.4.2 Connection


    Internet of Things communication refers to connecting smart devices through different
    (methods) ways, such as applications, gateways, and routers.


    In most cases, IoT devices connect to an IoT gateway or other external device,
    where data can be analyzed locally or sent to the cloud for analysis (Posey &
    Shea, 2022).


    # 3.2.2.4.3 Data Processing/Management


    Data processing is a stage of data management. To process data, data must first
    be collected. These stages are implemented through AI sensors. Data obtained through
    AI sensors are first sent to an external computing system. The processed data
    are then sent to the cloud. In general, the system can process data, compile them,
    and send them to the cloud on a daily basis.


    As mentioned previously, the concept of KFS, which we often come across, implements
    the connection between the physical environment and the cyber environment, where
    data collection and processing are carried out with the help of devices in the
    physical environment.


    Information processed in the cyber environment is sent back to the physical environment
    as needed. For example, the collected data are always ready for use with the help
    of the network, and if necessary, these data are processed and used.'
