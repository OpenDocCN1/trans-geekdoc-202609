    # 9.5 CONCLUSION


    We proposed and tested an approach for intrusion detection using SVMs on a set
    of selected data. It provides high data accuracy and demonstrates a compatible
    level of performance.


    Everything in the IoT sends data packets, and as the number of linked devices
    increases exponentially, this communication requires reliable connectivity, storage,
    and security (Khang et al., 2022a).


    An organization must manage, watch over, and secure enormous amounts of data and
    connections from scattered devices when using IoT (Rani et al., 2021).


    A healthy, democratic society requires privacy, which is more than just a concern
    for individualistic personal data. As technology advances, so will personal and
    healthcare (Khang et al., 2023a).


    We investigated the newly proposed privacy-preserving SVM classification system
    and discovered that its primary protocol is a secure technique for determining
    whether the sign of encrypted numbers has a soundness issue or a security leak.
    Then, we propose a new technique that can be applied to assist privacy-preserving
    SVM classification and is secure and accurate for finding the signs of encrypted
    integers (Vrushank et al., 2023).


    The experiments show that the MR-SVM model can effectively solve the problem of
    rapid increases in the SVM cost associated with increase in data volume. However,
    two nodes were used in the experiment, and the data transfer speed was limited.
    Multiple nodes can be established for cybersecurity in future studies.


