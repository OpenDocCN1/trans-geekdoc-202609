    to be validation datasets; and Drishti-GS and 20% of ACRIMA datasets are considered
    to be testing datasets.


    The ACRIMA dataset contains particular variation data in the photographs of fundus,
    allowing it to be considered in all three datasets.


    There are numerous different options for selecting the training, testing, and
    validation datasets, but this one is chosen because it meets the 80:20:20 ratio
    (training:testing:validation).'
