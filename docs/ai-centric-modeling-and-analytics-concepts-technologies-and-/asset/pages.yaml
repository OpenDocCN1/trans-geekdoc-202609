  md: '![](img/66ecdb8eb8654ae1c99705e55a45a836_191_0.png)


    # FIGURE 10.1 Benefits of Using Robotic Automation.


    Cybersecurity is not just a product. The scale and complexity make this important.
    The tremendous functionality of modern robotic applications often results in broad
    security attacks and several possible attack routes, rendering the use of standard
    approaches challenging.


    Consequently, this creates the following research questions: What is the state
    of robotics cybersecurity? How can robot security be effectively enhanced?


    By applying basic functionalities, distributing computational capabilities to
    enable trainees to distribute the processing of complicated processes over a network,
    and establishing programmer groups around them to exchange scripts and equipment,
    robotics and automated testing conceal the difficulty of controlling varied devices.


    Initially, the robotics data are gathered and pre-processed using min-max normalization.
    Feature extraction is performed using kernel linear discriminant analysis (KLDA).
    Feature detection is then achieved by our novel Bayesian hyper-tuned artificial
    neural network (BH-ANN).


    Finally, the performance of the system is evaluated, and the parameters are compared
    with those of existing approaches.


    The remainder of this chapter is organized as follows. Section 10.2 presents the
    problem statements. The proposed method is presented in section 10.3. Section
    10.4 presents the performance analysis, and section 10.5 offers the conclusion.


    # 10.2 PROBLEM STATEMENT


    Interactions involving robots/machines and people are unsafe and vulnerable to
    different assaults because of a lack of private connections. Cyberattacks that
    utilize common passwords and login credentials result from improper validation,
    which is readily breached by a specific hacker.


    Creating automaton clusters, enhancing mobility and discovery, and creating artificial
    intelligence (AI) that can acquire understanding and deploy ordinary sense to
    render ethical and societal judgments are several tasks that concentrate on basic
    issues in robotic systems.


    The working mechanism, movement, and human-centered automation are the three main
    obstacles, with communication being the most difficult component needed for such
    automated systems.


    Detection, location, cognitive, and control system are the four primary competency
    components in navigation. Automated robotic functionality and effectiveness'
