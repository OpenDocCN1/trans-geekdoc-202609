    # P5 (Ms)


    About Mitsuku: The conversation can occasionally feel monotonous and repetitive
    since similar comments that contain the same key words cause Kuki to respond in
    the same ways. She responded on two separate occasions when I typed “no worries”
    and “don’t worry” (meaning “it’s ok”), for instance: People worry about things
    all the time, but I don’t have emotions like you humans do. When I said, “I see,”
