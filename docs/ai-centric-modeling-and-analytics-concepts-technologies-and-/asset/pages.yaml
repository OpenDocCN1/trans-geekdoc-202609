- pgno: 132
  md: '# 6.8 **DEEP LEARNING METHODS**


    In challenging domains, such as NLP, deep neural networks (DNNs) have outperformed
    conventional statistic-based methods. Deep neural network is essentially an extension
    to artificial neural network (ANN) with enhanced functionalities and performance
    owing to its multiple hidden layers between the input and output layers (Chitty-Venkata
    et al., 2022).


    The concept of DNN is derived from neurobiology. A human brain has a basic unit
    called neuron, which makes all decisions. At a higher level, a neuron receives
    input signals through synapses and outputs a single action stream through an axon.
    This is the inspiration that an ANN has units that combine many inputs and provide
    a single output.


    Although natural language has gained momentum, it remains a challenge in the medical
    field. Medical texts consist of largely unstructured data, such as images, free
    text, abbreviations and spelling mistakes in prescriptions (Khang et al., 2023c).


    In such scenarios, the attention mechanism along with deep learning and NLP models
    have proved useful in three main architectures of a DNN (Jin et al., 2020).


    # 6.8.1 **MULTILAYER PERCEPTRON**


    Multilayer perceptron (MLP) is essentially a deep feedforward neural network consisting
    of an input layer, an output layer and more than one hidden layer with multiple
    neurons stacked together (Qi et al., 2022).


    Linearly inseparable data are classified by implementing a nonlinear model that
    activates the logistic or tangent function.


    The network is fully connected, in the sense that all nodes in a layer are connected
    to all other nodes in the preceding and succeeding layers. Therefore, it is a
    neural network with a nonlinear mapping between the inputs and outputs.


    In MLP, learning the weights and minimizing the cost function is the key that
    is achieved by a process called backpropagation. Backpropagation iteratively adjusts
    the weights and minimizes the cost function.


    A perceptron is a neural network consisting of one neuron that is fit for linear
    data. However, MLPs with expanded architectures have many layers of neurons that
    are capable of learning complex patterns (Wu et al., 2021).


    Multilayer perceptron with its feedforward and backpropagation mechanism is suitable
    for NLP applications that have high-dimensional ambiguous data, as shown in Figure
    6.8.


    # 6.8.2 **CONVOLUTIONAL NEURAL NETWORK**


    A convolutional neural network (CNN) is believed to be a synonym for computer
    vision because of the breakthroughs achieved in the image processing domain. The
    CNN applications have a wide bandwidth, from automated photo tagging to self-driving
    cars (Jayashree et al., 2023).'
  merge: -1
  img_proc: true
- pgno: 133
  md: '![](img/66ecdb8eb8654ae1c99705e55a45a836_133_0.png)


    # FIGURE 6.8 Multilayer Perceptron.


    Source: Khang (2021)


    In simple words, convolution is a sliding window function applied to a matrix,
    where every element of this matrix precisely represents a pixel of an image, and
    the sliding window is called a filter, feature detector or kernel (Anuj Kumar
    & Khang, 2023).


    Recently, CNNs have been applied to the ambiguous NLP domain (Liao & Zhou, 2021;
    Peng & Han, 2021). In the case of image processing, this input matrix can conveniently
    be replaced by a matrix representing sentences or documents; each row corresponds
    to a token.


    In contrast to image processing, where the kernel strides over the local patches
    of an image, in the case of NLP, the kernel strides over the complete row of the
    matrix, thus fixing the filter width to the width of the matrix in the case of
    NLP applications.


    Figure 6.9 gives an elaborate visualization of the CNN architecture for text classification.
    Two filters were identified with three region sizes: 2, 3 and 4.


    Feature maps were generated as a result of the convolution. These feature maps
    undergo pooling, which is a dimensionality reduction step, and generates six univariate
    feature vectors. These are further concatenated into one feature vector, which
    is fed as input to the final Softmax layer to classify the text, as shown in Figure
    6.9.


    Assuming binary classification, two possible output states or classes are obtained
    at the output layer.


    Owing to the high computational requirements of neural networks, a novel concept
    of neural architecture search benchmarks with pre-computed neural architecture
    has also evolved for both computer vision and NLP domains (Klyuchnikov et al.,
    2022).'
