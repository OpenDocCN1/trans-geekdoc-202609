  md: 'The primary keywords were categorized into four quadrants, namely, niche theme,
    motor theme, basic theme, and emerging or declining theme.


    A two-dimensional thematic map was created that mapped the field’s most important
    subjects based on the authors’ keywords, as shown in Figure 15.19. The map shows
    how strongly the exterior (density) and internal relationships are connected (centrality).


    According to Solomon et al. (2016), the map is divided into four quadrants: high
    density and centrality in quadrant 1, low density and centrality in quadrant 2,
    high density and low centrality in quadrant 3, and motifs with common values on
    both axes in quadrant 4.


    The literature considers that the research topics in quadrant 1 have common themes
    because they have strong internal and external links. This quadrant contains forecasting,
    a decision support system, and decision-making. These issues are pertinent to
    this body of research because AI helps the hospitality and tourism industry forecast
    their business and can be used as a decision support system.


    The study subjects in quadrant four must be stronger, emerging or declining themes
    that need further exploration because they have low ratings for density and centrality.
    The major subjects of this cluster are education and remote sensing.


    It can be concluded that this research stream is distinct from other issues in
