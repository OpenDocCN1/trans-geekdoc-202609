  md: '![](img/66ecdb8eb8654ae1c99705e55a45a836_163_0.png)


    FIGURE 8.1 Distribution Diagnosis Variable.


    Data pre-processing is a tried-and-true method for tackling such issues. Data
    pre-processing is an important and necessary step. The project was accompanied
    by the following process (Rani et al., 2021).


    The pre-processing operations remove irrelevant columns (id), which are referred
    to as unnamed: 32 because they contain missing values.


    To aid in further implementation, prefix the field diagnostic from ‘M’ and ‘B’
    to a numerical value of 1 and 0, respectively. The numbers of cases of benign
    and malignant tumors are represented by the graph in Figure 8.1.


    Feature selection is a technique that helps select important features that contain
    maximum information so that it can play an important role in the prediction variable
    with significant output.


    In this feature selection project, a set of methods is applied to minimize the
    number of features.


    # 8.3.2.1 Univariate Selection


    In univariate selection, statistical tests were used to choose the variables/features
    that have a high correlation with the target variable.


    The SelectKBest method selects the feature using chi-square to find the functional
    association between the feature and the target variable (Vijayvargia, 2018).


    # 8.3.2.2 Feature Importance


    We use an extra tree classifier to extract the ranking of the features from the
    dataset based on score. It calculates the entropy of the features and ranks their
    importance according to their scores (Vijayvargia, 2018), as shown in Figure 8.2.'
