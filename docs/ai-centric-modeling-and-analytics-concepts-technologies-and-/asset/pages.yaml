    # 12.3 DISCUSSION AND RESULTS


    The methodology of the proposed work starts with dataset acquisition. The dataset
    corresponding to states of Jammu and Kashmir was collected.


    The dataset was collected corresponding to the states of Jammu and Kashmir in
    India. The structure of the dataset is presented in Table 12.3.


    The data acquisition layer will receive this dataset and perform an initial analysis.
    The details of the used layers are given as follows.


    # 12.3.1 Data Acquisition Layer


    This layer is critical for the operation of a fog-based forest fire prediction
    model. This layer receives the dataset and removes noise from the dataset. The
    noise in terms of missing and unnamed values is addressed through replacement
    with ‘0.’


    Outliers indicating extreme values will be tackled using the box plot method.
    The values inside the box plot are retained, and the remaining values are outliers.
    These outliers are handled using the median values. The pre-processed dataset
    is fed into the fog layer.


