    This illustrates that the suggested system is slightly over-fitted; however, when
    ample training data are collected, the model becomes more generalized. It also
    confirms that the proposed approach works with unseen real-world data.


    Table 8.1 demonstrates how the proposed weighted average-based voting mechanism
    compares to previous work on breast cancer prediction using the WBCD. All papers
    have been published on a well-known platform; thus, they may be trusted.


    # 8.6 CONCLUSION


    This project is associated with an intelligent healthcare system. Here, various
    machine learning classifiers were used in the experiments to determine the best
    model for use in the ensemble voting mechanism. Thus, the system can predict whether
    the tumor present in a patient’s breast is malignant or benign (Divvela et al.,
    2023).


    The proposed system was built in the following two phases: pre-processing of the
    dataset and prediction of diseases using an ensemble voting classifier. In this
    project, 16 attributes were considered, which form the primary basis for the tests
    and gave more or less accurate results (Khang et al., 2024).


    The primary objective of this project was to obtain the optimum accuracy and algorithm
    for predicting the types of tumors.


    An ensemble learning model was developed using a voting classifier and probability.
    The hard voting/majority voting classifier-based ensemble model yielded an accuracy,
    precision, recall, and F1 score of 0.9820, 1.00, 0.955, and 0.977, respectively.


    The soft voting classifier-based ensemble model yielded an accuracy, precision,
    recall, and F1 score of 0.976, 1.00, 0.939, and 0.969, respectively, and the average
    weighted classifier-based ensemble model yielded an accuracy, precision, recall,
    and F1 score of 0.988, 1.00, 0.970, and 0.985, respectively.


    Observations show that the weighted average ensemble model achieves better performance
    when compared with other classification methods. It was concluded that the best
    algorithm based on the given dataset is the average weighted ensemble voting classifier
    (Khang et al., 2023b).'
