  md: '![](img/66ecdb8eb8654ae1c99705e55a45a836_249_0.png)


    # FIGURE 13.1 Distributed Job Scheduler.


    Source: Khang (2021)


    # 13.1.1 JOB SCHEDULING


    Job management is key concept in cloud computing systems. Problems with task scheduling
    are significant because they affect the overall effectiveness of the cloud computing
    system (Rani et al., 2023).


    Job scheduling is a technique that links user tasks to the choice and utilization
    of relevant resources. It is convenient and flexible for scheduling jobs.


    Depending on the operational requirements, needs, and priorities, jobs and job
    streams can be scheduled to run at any time. Without the requirement of support
    workers, job streams and procedures can be scheduled daily, weekly, monthly, and
    yearly in advance and executed as needed.


    # 13.1.2 DATA CLEANING


    Data cleaning is the process of deleting inaccurate, flawed, poorly organized,
    duplicate, or insufficient data from a dataset.


    Regardless of whether local or international web-based information systems are
    used, data cleaning has become increasingly crucial. This is because sources typically
    include redundant information in various formats (Borner et al., 2019). To provide
    access to correct and consistent data, it is necessary to combine various data
    representations and to remove redundant data.'
