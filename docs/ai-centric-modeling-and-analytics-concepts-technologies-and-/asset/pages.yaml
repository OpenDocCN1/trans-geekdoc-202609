  md: '# 3 The Role of Big Data and Data Analysis Tools in Business and Production


    Alex Khang, Vugar Abdullayev, Triwiyanto, Salahddine Krit, Qaffarova Zeynab Mehman,
    and Mammadova Bilqeyis Azer


    # 3.1 INTRODUCTION


    Big data is often used to describe datasets that are so enormous and intricate
    that they are difficult to handle or analyze using conventional data processing
    techniques. These datasets frequently originate from different sources, including
    social media, sensors, and other sources, that produce a lot of data.


    To process, manage, and analyze huge datasets quickly and effectively, organizations
    require new tools and methodologies. Because of this, new big data-focused technologies
    and methodologies, such Hadoop, Spark, and NoSQL databases, have been created.


    Global data production has increased dramatically in recent years, and this growth
    is anticipated to continue. The ubiquitous usage of social media, the Internet
    of Things (IoT), and the growing digitization of business operations are just
    a few of the causes that are fueling this expansion.


    Organizations increasingly must manage enormous amounts of data that are too complex
    and massive to be handled by means of conventional data processing techniques.
    Organizations must use new tools and technology created expressly to handle big
    data to manage and analyze these data effectively.


    The study and interpretation of big data using machine learning, artificial intelligence
    (AI), and other methods have given rise to new fields, such as data science.


    Effective big data management necessitates a thorough knowledge of the big data
    process life cycle and the technologies utilized at each level. The following
    steps are often included in the big data process life cycle:


    +   1. **Data ingestion**: Raw data are gathered from multiple sources and stored
    in a data repository during the data ingestion stage. The data are often unstructured;
    therefore, processing is necessary before analysis.

    +   2. **Data storage**: The data are kept in a data warehouse or a distributed
    file system, such as Hadoop Distributed File System (HDFS), at this'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'point. To save space, the data are typically saved in a compressed and optimized
    format.


    +   3. **Data processing:** The data are analyzed at this step to draw conclusions
    and discover patterns. Complex processing operations, such as data transformation,
    filtering, and aggregation, are involved in this level. At this point, technologies,
    such as Apache Spark, Hadoop MapReduce, and Apache Flink, are used.

    +   4. **Data analysis:** The processed data are examined in this step to draw
    conclusions and make decisions. Various data analysis methods, including statistical
    analysis, machine learning, and data visualization, are used during this step.
    During this phase, technologies, such as Apache Hive, Apache Impala, and Apache
    Drill, are used.

    +   5. **Data visualization:** The insights discovered through data analysis are
    displayed at this step using visual tools, such as charts, graphs, and dashboards.
    This phase aids stakeholders in comprehending and interpreting data analysis findings.
    During this phase, technologies, such as Tableau, Power BI, and QlikView, are
    used.


    Organizations may construct efficient big data systems that can handle massive
    volumes of data, extract insights, and improve decisions by knowing the big data
    process life cycle and the technologies involved in each stage.


    # 3.2 DEFINITION OF BIG DATA


    Big data describes extraordinarily vast, intricate, and varied datasets that are
    difficult to process with conventional data management and processing techniques.
    Big data is distinguished by its quantity, speed, and variety.


    ![](img/66ecdb8eb8654ae1c99705e55a45a836_54_0.png)


    FIGURE 3.1 Advantages of Big Data Analytics.


    Source: Khang (2021)'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'The sheer amount of data, which can range from terabytes to petabytes or more,
    is referred to as the volume of big data. Big data velocity is the rate at which
    data are created, processed, and analyzed; this rate might be in real time or
    very close to real time.


    Big data is diverse because it generates a wide range of data kinds, including
    structured, semi-structured, and unstructured data.


    +   1. **Structured data:** A set of data that have a certain structure are called
    structured data. Such information can be processed more easily because its structure
    is known. This includes, for example, datasets that correspond to tabular structures.

    +   2. **Semi-structured:** It is a hybrid of both structured and unstructured
    data. This includes email, web pages, and more.

    +   3. **Unstructured data:** This type of data does not have a specific structure;
    it is a kind of preliminary data. This includes information, such as audio, video,
    and image. It is a dataset that is easy to collect but relatively difficult to
    process.


    Big data analytics has several advantages:


    Organizations can find patterns, trends, and linkages by examining big datasets
    that would not be visible using conventional data analysis techniques. This can
    assist businesses in streamlining their operations, enhancing customer support,
    and creating new goods and services.


    Second, big data is crucial because it helps businesses become more competitive.
    Organizations can better understand their clients, rivals, and market trends by
    utilizing big data. They can get a competitive edge by using this information
    to assist them in making strategic decisions.


    Finally, big data is crucial because it spurs technological innovation. Big data
    has sparked the growth of new industries, such as data science and machine learning,
    which are opening up new possibilities and uses for the technology.


    # ### 3.2.1 Managing Big Data


    Managing Big Data presents several significant difficulties, including:


    +   1. **Data integration:** Big data is challenging to integrate and evaluate
    because it frequently arrives from several sources and in different formats.

    +   2. **Data quality:** Big data needs to be cleaned and transformed because
    it is frequently insufficient, erroneous, or inconsistent.

    +   3. **Scalability:** To manage massive volumes of data, big data requires highly
    scalable storage and processing systems.

    +   4. **Security:** Big data is a target for cyberattacks and data breaches because
    it is highly valuable and sensitive.

    +   5. **Talent shortage:** Because of the increased demand for people with knowledge
    of big data, there is a talent gap that makes it challenging for businesses to
    efficiently manage and analyze big data.'
