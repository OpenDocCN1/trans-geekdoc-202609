  md: '# 3.3.5  BIG DATA ANALYTICS


    Big data includes any large dataset. Different information is collected from different
    sources. With the help of big data, organizations can make future decisions and
    create different strategies by monitoring and analyzing their customers and the
    customers’ behavior (for example, through social media).


    Different sets of data are collected for different purposes. There are data obtained
    from social media, various scientific research data, health datasets, business
    datasets, and others.


    Big data analytics is the application of advanced analytical techniques to very
    large, diverse big datasets that include structured, semi-structured, and unstructured
    data from various sources and sizes ranging from terabytes to zettabytes (IBM,
    2023).


    For data analysis in big data, there are a number of technologies accessible,
    and each has distinct advantages and disadvantages. Three popular technologies
    for data analysis are presented as follows.


    # 3.3.5.1  Apache Hive


    Large datasets stored in the HDFS can be queried and analyzed using Apache Hive,
    an open-source data warehousing program. It is based on Hadoop MapReduce and enables
    users to create sophisticated queries using a syntax similar to SQL. Data warehousing,
    online analytical processing, and extract, transform, and load processes are all
    supported natively by Hive.


    # 3.3.5.2  Apache Impala


    An open-source SQL engine called Apache Impala enables users to instantly query
    and analyze data held in HDFS, Apache HBase, and other Hadoop-compatible file
    systems.


    A variety of analytical operations, like as aggregations, joins, and window functions,
    are supported by Impala, which offers a user interface that is reminiscent to
    SQL. For ad hoc queries and interactive analytics, it is made to offer quick response
    times.


    # 3.3.5.3  Apache Drill


    Using the American National Standards Institute SQL syntax, users can query and
    analyze data stored in a variety of data sources, such as HDFS, NoSQL databases,
    and cloud storage systems, using Apache Drill, an open-source distributed SQL
    query engine. It supports a wide range of data formats, including JavaScript Object
    Notation, Parquet, and Avro, and it is built to offer low-latency queries.


    In conclusion, a variety of technologies are accessible for data analysis in big
    data, and each has distinct advantages and disadvantages.


    Popular options for analyzing massive amounts of data include Apache Hive, Apache
    Impala, and Apache Drill. These programs are utilized in a variety of fields,
    including finance, healthcare, and e-commerce.'
  merge: -1
  img_proc: true
