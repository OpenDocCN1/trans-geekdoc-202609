    Fourth, interesting activities in learning consisted of three items. As shown
    in Table 4.5, this indicator received a high category, which means that the students
    were engaged and motivated in learning activities. The results confirmed the theory
    of Yang et al. (2022) that an interesting activity can help in the teaching and
    learning process and motivate students to learn.


    In the group discussion section, the students showed their engagement. All students
    demonstrated interest and involvement in the task activities, which shows their
    mastery of the group discussion activity based on task-based learning.


    Not only did they work well together during the discussion, but they also reviewed
    data from the pair-work session during the group discussion and shared their knowledge
    of the subject, which increased the significance of their activity and helped
    them better prepare for their conversation. The students had an extended time
    to interact with Replika and Kuki before they practiced speaking in front of the
    class.


    Fifth, the relationship or sense of community that formed among students who were
    enrolled in the same online courses is an example of how community support factor
    relates to the psychological state of the learners.


    An emotional sense of belonging can play a significant role in preventing dropouts
    and promoting student engagement in the classroom. One factor contributing to
    the high dropout rate is the absence of connections or a sense of community among
    students participating in interactive speaking.


    The lack of a sense of community or belonging among students makes them more likely
    to leave class early or miss it altogether, which may eventually cause them to
    drop out. To boost student retention, teachers aim to build richer communication,
    such as net meetings for interaction, to boost retention rates. As revealed by
    Lee et al., this is why numerous studies have stressed the significance of belonging.


    However, the indicators used to gauge learners’ levels of psychological or emotional
    engagement in e-learning are typically quantitative measures of learning engagement,
    such as attendance and assignment submission. In light of this perspective, it
    is important to note that this study’s community support component, which was
    generated from assessments of learners’ psychological state, is noteworthy.


    The students were involved in providing feedback on a friend’s work. Nearly all
    students engaged in the task activity offered helpful ideas on their friends’
    topic of discussion with their peers and Replika or Kuki.


    They provided a list of topics, commented on or explained something in the suggestion
    box, and complimented their friend’s excellent performance by using an emoticon
    or a thumbs-up image.'
