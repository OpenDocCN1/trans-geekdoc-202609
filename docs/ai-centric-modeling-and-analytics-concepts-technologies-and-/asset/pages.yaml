    *Santhosh Kumar A. V., Suresh Kumar N., Kanniga Devi R., and Muthukannan M.*


    # 18.1 INTRODUCTION


    Online social networks (OSNs) have become a current interest for individuals to
    meet new people and collect views on different problems. Some applications are
    frequently used worldwide because of the creation of free accounts and usage (Shetty
    et al., 2022). However, some OSN users fraudulently handle the platform to profit
    by posting false content.


    Without proper prediction tools for posting false content and trustworthiness
    of other social network users, common people with a good mindset are addicted
    to many problems (Alkhamees et al., 2021).


    Bots are computer programs designed to execute many tasks that run over the Internet.
    A botnet is a group of Internet devices connected over the Internet, which controls
    many bots. The term social botnet refers to botnets that use OSNs as a platform.
    Botnets are used to send spam messages or any unsolicited communication sent in
    bulk.


    Spam is usually sent via email, short message service (SMS), social media, or
    phone calls. Spam messages often come in the form of harmless (although annoying)
    promotional emails. However, spam can sometimes be fraudulent or malicious, as
    it takes data and helps hijackers access user information (Latah, 2020).


    A spam bot helps send or display false content over social networking sites where
    people interact. Spam refers to an unrequested false report on various products
    and advertisements in the form of links, images, or videos that attract social
    network users (Latah, 2019).'
