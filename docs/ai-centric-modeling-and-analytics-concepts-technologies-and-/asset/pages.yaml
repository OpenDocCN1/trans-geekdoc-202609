  md: 'EfficientNetV2 models can achieve good accuracy despite having fewer parameters
    than the other models because of their efficient architecture. They are more efficient
    in terms of computational resources while maintaining good performance.


    The secret behind this efficiency is the use of a compound scaling method, where
    the depth, width, and resolution of the model are scaled together in a balanced
    manner. This method allows the model to learn more complex features from the input
    data while reducing the number of parameters required.


    EfficientNetV2 models use a technique called automated machine learning (AutoML)
    to search for the optimal architecture and hyper-parameters, which can lead to
    better performance.


    AutoML is an approach that automates the process of selecting the best model architecture
    and hyper-parameters for a given task, and it is based on a combination of NAS
    and hyper-parameter optimisation techniques.


    EfficientNetV2 models also use a technique called EfficientNet-Edge, which applies
    a specific set of operations to the model''s architecture, which further improves
    the efficiency of the model.


    # 11.5 HYPER-PARAMETERS USED


    # 11.5.1 Adam (Optimizer)


    Adam is a stochastic gradient descent version that employs moving averages of
    the parameters to give a running estimate of the mean and variance of the second
    raw moments of the gradients. Adam is the name of the algorithm, which uses an
    adaptive approach to stochastic optimisation.


    The adaptive moment estimation is abbreviated as “Adam” (Kingma & Ba, 2015).


    Compared to the common stochastic gradient descent technique, the Adam optimiser
    often uses less memory and computes the update step for each parameter more quickly.


    Equation 11.1 is used by the Adam optimiser to modify the parameters of the neural
    network:


    param = param − lr * m / sqrt(v + epsilon) (11.1)


    where


    +   - param is the current value of the parameter that we want to update

    +   - lr (learning rate) is a hyper-parameter that controls the step size of the
    update (here, it is set to 0.001)

    +   - m is the first moment of the gradient (i.e., the mean)

    +   - v is the second moment of the gradient (i.e., the variance)

    +   - epsilon is a small value added to the denominator to prevent division by
    zero


    The moving average of the first and second moments are computed using Equations
    11.2 and Equation 11.3:'
