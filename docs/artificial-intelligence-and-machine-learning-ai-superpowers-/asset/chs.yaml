- "# 人工智能与机器学习：AI 超能力与人机协作——金融、医学与商业领域的愿景性革命。用现代方法发现时代的顶影响力人物。\n\n\n\n\n\n\n\n## 引言\n\
  感谢购买《人工智能与机器学习：AI 超能力与人类+机器：金融、医学与商业领域的远见性革命。通过现代方法探索时代最具影响力的人物》，感谢您的支持。\n\n随着大数据世界的兴起，我们被迫开发有效的策略来帮助自己做出明智的决策。由于对从现有数据中提取价值的最有效方法的需求日益增长，所有专业领域都变得极其复杂。通过下载这本书，你已经迈向学习如何使用大数据以及人工智能如何能够应对自然增长的大数据运动的第一步。\n\
  \n你在后续章节中发现的信息至关重要，因为它们将帮助你学习人工智能是如何影响人类行为的及其在未来可能产生的影响。为此，本书对人工智能和机器学习进行了深度概述，突出了它们在历史演变以及在金融、商业和医学等各个领域的应用。它涵盖了人工智能如何与人类智能相互作用，包括人类与机器之间可能的伙伴关系以及彼此相互的影响。\n\
  \n人们可以从人工智能和机器学习中利用许多知识来改善生活并提高生产力。书中涵盖的一个有趣概念是全球范围内的 AI 超能力，以及它们如何影响现在及未来 AI 的发展。这些包括\
  \ `Uber` 的 `Amit Singhal`、百度的 `Andrew Ng`、`SpaceX` 的 `Elon Musk` 以及 `Tesla` 等。尽管市场上有很多关于人工智能和机器学习的书籍供选择，但我非常感谢你考虑这一本！祝你阅读愉快！\n\
  \n\n\n\n\n# 第一章：理解人工智能\n\n“到目前为止，人工智能最大的危险在于人们过早地认为他们理解了它。” – 埃利泽·尤德科斯基（Eliezer\
  \ Yudkowsky）\n\n\n可能无法确定现代社会的哪些部分没有受到人工智能（AI）的影响或作用。智能机器影响着我们生活的每一个方面，包括业务运营和日常活动，其目的是提高效率。AI\
  \ 与我们所做的一切都密织在一起，以以想象没有它的生活。AI 是第四次工业革命破坏性变化的主要影响者；这些变化可能会挑战人类的思想。它正在以加速的方式改变我们的互动和生活方式，使城市变得更加智能并帮助我们管理生活。尽管人工智能和机器学习非常流行，但这两个概念的目的和细节并不被充分理解。在本章中，我们将讨论人工智能和机器学习的关键概念。\n\
  \n## 定义人工智能和机器学习\n\n通常定义，人工智能是机器以人类人类进行决策和学习的能力。它通常被称为计算机科学的一个分支，涉及模拟计算机智能的行为。人工智能通常缩写为\
  \ AI，是指能够完成通常需要人类智能的任务的计算机系统，包括语音识别、视觉感知、决策和语言翻译。这项技术影响了多种消费产品，并促进了物理和医疗保健领域的突破。\n\
  \n机器学习是人工智能的一个分支，即所有机器学习都是 AI 的组成部分，但并非所有 AI 都属于后者。它是计算机科学的一个分支，其目标是构建和利用现有算法以建立提供模式和准确预测的通用模型。此类算法通常基于数学和统计优化。假设你的目标是使用历史数据识别某种现象的模式；你可以使用机器学习算法对数据进行分组并分析聚类结果。通过分析，机器学习有助于随着时间的推移生成自动聚类或分类。\n\
  \n## AI 和机器学习的历史\n\n尽管人工智能和机器学习已经存在了几个世纪，但直到 20 世纪 50 年代后期才得以实现。一系列哲学家、科学家和数学家试图探索人工智能的概念，但直到第二次世界大战，英国多才学者阿兰·图灵（Alan\
  \ Turing）才向人们建议如何利用可用信息做出决策并解决问题。阿兰能够破译并理解德国武装部队用于安全发送消息的 `Enigma` 密码。阿兰和他的团队一起发明了\
  \ `Bombe` 机器，这有助于破译信息。图灵得出结论认为，一种能够与人类对话的机器可以被称为“智能”物体。\n\n20 世纪 50 年代，美国顶尖计算机科学家约翰·马卡西（John\
  \ McCarthy）组织了一次会议，并创造了“人工智能”这一术语。全美的研究人员对理解人工智能的概念产生了兴趣，从而探索这一主题。赫伯特·西蒙（Herbert\
  \ Simon）和阿伦·纽威尔（Allen Newell）在促进后将改变世界的人工智能领域方面发挥了非常重要的作用。1951 年，一台独特的机器 Ferranti\
  \ Mark I 成功地使用算法分析并掌握了国际跳棋。反之，西蒙和纽威尔发明了一种通常被称为 `General Problem Solver`（通用问题求解器）的算法来解决数学问题。\n\
  \n此外，在 20 世纪 50 年代，约翰·马卡西开发了 `LISP` 编程语言，这被认为是人工智能和机器学习的重要部分。20 世纪 60 年代，一些研究人员强调算法的发展以解决数学问题。在同一个十年内，计算机科学家发现了用于控制机器人的`机器视觉学习`（Machine\
  \ Vision Learning），并于 1972 年在日本建立了第一个智能机器人 `WABOT-1`。\n\n然而，在全球努力增强 AI 应用背景下，计算机科学家意识到在机器中创建智能是挑战性的。为了让人工智能和机器学习取得成功，科学家需要海量的数据。\n\
  \n\n\n\n\n# 第二 2 章：人工智能 VS 人类智能\n\n“事实已显而易见，我们的技术已经超越了人人性。” — 阿伯特·爱因斯坦 ![](img/Image00003.jpg)\n\
  \n人工智能（Artificial Intelligence）和自动化（Automation）是经常交替使用的术语。它们与编程、机器人或电子设备有关，这些使我们能够更高效、更成功地工作——无论是工业车辆装配还是发送一封跟进邮件。在任何情况下，它的含义都比这复杂得多。\n\
  \n自动化的本质是制造硬件或软件，使其能够自动执行某些任务——无需人工干预。“人工智能”这一术语由约翰·马卡锡（John McCarthy）创立，意指一种制造明智机器的工程科学。基于计算机的智能与试图让机器或软件模仿并在从长远来看超越人类的行为和智能联系在一起。人类目前正朝着这种理想状况的方向发展：自动化机器收集数据——AI\
  \ 系统“理解”这些数据。我们面对的是两个完全不同的框架，它们完美地互为补充。\n\n## 自动化\n\n自动化系统是在几秒钟内记录你分期付款情况的银行，也是组织向客户发送群发邮件的原因。它让你能够在下单后几小时内完成货物的发运和送达。\n\
  \n自动化的单一目的是：给机器一个执行单调、重复性活动的机会，或者正如某些个人所说，“消除人类中的机器人化”。它为个人节省了时间，让他们能够集中于日益重要的、需要人类触感和判断的创新任务。最终产物是一个日益精进、务实的企业，以及一支生产力不断提高的劳动力队伍。一个顺从的先进机器人，它从不请假，也不休假，并始终如一地处理业务。组织如此轻易地采用自动化，并不令人意外。\n\
  \n自动化机器由手动配置（如工作流程、编程边缘情况等）驱动——基本上是一台听从指令的士兵机器。自动化在未来几年内将逐渐影响工业革命。自动化的影响已经在某些行业中体现，某些国家受到的影响比其他国家更为严重。自动化的专门可能性在不同行业和活动之间存在差异。随着自动化创新（例如机器人技术和机器学习）在日常活动中承担着极其巨大的工作，它们对工作环境可能的影响已成为研究和公众关注的焦点。讨论倾向于一种二元论的推测游戏，即机器是否会取代工作。虽然自动化技术在未来几年内取代的职业很少，但它也将根据员工所涉及的工作类型，影响几乎所有员工的较高或更低水平。自动化目前正在跨越标准制造业，至少在技术可行性方面，具有改变某些领域的潜力，例如医疗和金融领域，这些领域包含了大量的事务处理工作。\n\
  \n### 理解自动化的潜力\n\n在论及自动化技术时，我们指的是通过调整现有的测试技术使特定任务自动化的可能性。换句话说，无论任何设备或活动的自动化是否可行，每个职业都由不同类型的职责和任务组成，每种任务都有波动的可行性。例如，零售业的工作包括收集或处理信息、与客户互动和联系以及布置产品展示等活动。\n\
  \n技术可行性是自动化的必要前提条件；但并不是判断活动是否可以自动化的唯一指标。要评估的后续因素是创建和发送待自动化设备及产品的成本。与供给和劳动力因素相关的成本涉及另一个随后的因素：如果劳动力充足且大部分比自动化便宜，这种结果可能会成为反对自动化的决定性论点。另一个需要检查的因素是超越劳动力成本交换的优势；包括更高的产量、更高的质量和更少的错误。例如，行政或社会问题（机器在特定环境中的价值）也应进行衡量。例如，机器人可能会取代医疗医生的一些活动。但目前，这种可能实际发生的预期对于习惯于期待人类接触的患者来说，可能是令人不快的。\n\
  \n自动化在某个行业或职业中萌生的可能性，反映了这些活动及其之间一种不易察觉的交换。即使机器最终接管了某个职业中几项人类职责的控制，这并不意味着该职业的终结。尽管与预期的不同，其他职业将会增长以填补这一空白。例如，在美国，20\
  \ 世纪 80 年代标准化条形码扫描仪及相关销售终端的大规模分发，使每家商店的劳动力成本降低了高达 4.8%，食品成本降低了 1.2%。它还赋能了各种进步，包括晋升机会的增加。无论如何，收银员也是必不可少的；事实上，在\
  \ 1980 年到 2013 年间，他们的工作需求以平均 2%的速度增长。\n\n## 人机伙伴关系\n\n这一代最伟大的大脑，无论是特斯拉的埃隆·马斯克还是斯蒂芬·霍金，都反对人工智能。他们表达的方式完全符合那种反乌托邦的格言：“机器人和人工智能将拥有比我们进步的选择，创造出我们作为人类面临的最大风险。”此外，我们还有强有力的\
  \ AI 支持者，他们认为 AI 将支持人类但不会控制或干预他们的生活。这是 AI 的总体目标：取得能够模拟人类言语、思考和行为的进步，而这些通常不会受到自然脆弱性（人会衰老死亡）的影响。此外，与大多数人一样，这意味着\
  \ AI 在主要遵循指令方面非常糟糕。这并不是它的意图所在；它的目的是一直寻找模式（像人类一样），从经验中获益（像人类一样），并在情况下自主选择合适的反应（像人类一样）。这样一来，AI\
  \ 不是我或你的复制。它与创造一个比我们想象的更强大的系统联系在一起。\n\n驱动自动化系统和 AI 的是与人类非常相似的东西：数据。目前正在超越标准制造业的自动化，至少在技术可行性方面具有改变某些领域（例如医疗和金融，这些领域包含了大量的事务处理工作）的潜力。驱动自动化系统和\
  \ AI 的是数据。这显然是由于许多因素的影响，可能会导致巨大的收入增长。自动化的业务表现更好；更好的业务效率，以及最重要的——准备好专注于创新和关键任务的劳动力。我们尚未准备好\
  \ AI。我们正处于智能自动化的边缘。如果我们继续通过为其注入大量数据来实现智能自动化，我们可以创造出一个比我们想象的更强大的系统——作为人类和作为组织。如果我们想象\
  \ 2030 年的世界，人与机器之间的关系将重塑生活。机器将补充人类的能力并帮助他们实现更显著的效率。\n\n### 未来伙伴关系\n\n人类长期以来一直与技术或机器紧密生活和工作——从打字机到智能手机的扩展。而且，由于软件、大数据和处理能力的巨大进步，我们进入了一个具有惊人结果的世界。我们将观察到人与机器关系的变化——表现为显著提高生产力、统一性和可能性。随着技术力量在五年内增加，我们对技术的依赖也会随之增加，产生一种共生关系。人类将带来诸如创造力和批判性思维等能力，而机器将在全球范围内带来速度、自动化和全新的效率。机器不会取代我们；相反，它们将使我们能够完成更多任务。\n\
  \n### 人类作为指挥\n\n人机合作使组织能够以新的、更有效的方式与代表和客户联系。例如，像`Cortana`这样的 AI 助手鼓励个人之间的互动。谷歌和亚马逊的助手可以集成到家庭、汽车和智能手机中，执行在线购物、播放音乐、预约美容以及提供定制时尚建议。2030\
  \ 年，我们将依赖机器来管理生活的更多部分。我们将成功转型数字指挥。技术将作为我们的延伸，帮助我们更好地管理日常活动。当 AI 助手处理基本请求时，人类代表可以专注于更复杂的问题，特别是那些需要额外支持的客户。\n\
  \n### 重新思考业务\n\n这种关系的影响远超我们的日常生活，进入业务管理。工作环境将在发现能力、管理资产和促进职业方面发生变革。到 2030 年，工作将不再是特定的，而是一个任务序列。智能分析、数据可视化和声誉引擎将人类的态度和技能变得可用，组织将寻求顶级人才并减少偏见。在任何方面，无论是寻找顶级人才、培训员工还是调用各种服务，深层次的人机关系都将是\
  \ 2030 年的变革力量。我们正在接近每个业务都由软件控制的技术时代。\n\n### 新兴技术\n\n随随学习到 2030 年，获取新信息的能力将比目前的知识更有价值。员工不仅将有很多工作，而且任务和责任将与所学的截然不同。他们将获得有效执行工作所需的和技能。他们将经常即兴发挥，相互学习并开辟自己的道路。这些因素结合在一起，将真正挑战组织去“边做边学”。\n\
  \n### 人类辅助机器\n\n人类应该承担三个角色：我们应该训练机器执行特定任务；解释已完成的结果（特别是当结果不合或存疑时）；以及维护机器负责的使用（例如防止机器人伤害人类）。机器学习算法必须被教授如何执行预定的工作。因此，收集了大量的训练数据集以展示识别疾病的机器识别应用程序，以及用于帮助决策的推荐引擎。此外，AI\
  \ 框架必须学会如何最好地与人类交流。这些例子已经存在，例如教练被要求构建`Alexa`的性格，而苹果的`Siri`只有一点点鲁莽，因为这可能是客户对科技巨头苹果的预期。\n\
  \n### 解释\n\nAI 越来越多地通过透明程序（也称为黑箱问题）得出结论，AI 需要相关领域的专家来披露其行为模式。这些“解释者”在证明领域尤为重要，例如医学和法律，在这些领域，专业人士需要看到机器判断的步骤是如何导致事故的。此外，解释者正成为管理业务的必要条件——任何客户输出都可能被测试为不公正或有偏见。例如，欧盟最新的数据保护条例（`GDPR`）为客户提供了对任何基于设计的决策获得解释的权利。这解释了一个\
  \ AI 将有助于扩大就业和法律问题的领域。专家认为，组织应该做出大约 75%的决策，并使用 AI“维护者”——确保 AI 系统运行安全且可靠的代表。AI 可以帮助我们的逻辑和能力，并提高创造力。\n\
  \n\n\n\n\n# 第三章：人机界面背后的技术\n\n“技术正在改变我们作为人类互动的方式。” —— 丹·布朗斯\n\n在本章中，我们将涵盖以下内容：\n\
  * 人机界面 (HMI) 的定义及其用途。\n* HMI 的样式。\n* 类人机器界面。\n* 智能自动化对生活方式和关系的影响。\n* 硬件与软件。\n* 配置类型。\n\
  * 市场动态。\n\n## 人机界面 (HMI) 的定义\n\n人机界面（`HMI`）是精密设备的组成部分，擅长控制人机关系。其引擎边界由硬件和软件组成，允许操作员的输入转换为机器的指示，随后机器再次向操作员输出所需的结果。\n\
  \n`HMI` 专业知识已应用于微电子、娱乐业、医疗和军事等无数的生产领域。它帮助了将人类整合到多部分高科技系统中。人机界面也可以称为人与机器界面（`MMI`）、人机界面或计算机-人机界面。\n\
  \n`HMI` 有两种交互类型，即人到机器和机器到人。由于 `HMI` 无处不在，错综复杂的边界可能包括波形雷达、控制和边缘设备、对话确认，以及使用光、声音、高温和其他感知手段进行的交互信息交换，这些都可以认为是\
  \ `HMIs` 的一部分。\n\n尽管 `HMI` 被认为是一个独立的技术领域，但它也可以用作其他技术的适配器。它们基于类人的身体、行为和心理能力构建，这意味着人体工程学将制定\
  \ `HMIs` 背后的理念。除了能够增强用户体验和效率之外，它们还可以为提交、智慧和修复提供无与比的机会。更重要的是，`HMI` 可以与外部设备建立良好且自然的关系。\n\
  \n![](img/Image00005.jpg)\n图 1：一个 HIM 界面\n\n引入 `HMIs` 有许多优点，包括：减少误差折扣、扩大方案、提高消费者有效性、升级一致性、增强可维护性、提高消费者认可度和福祉、减少对准备和专业知识的需求、身体用户、职责过载、增加工业化预算和效率等等。触摸屏和外壳改装可以作为\
  \ `HMIs` 的示例。其知识在很大程度上应用于关键和平扁平化性能、阵列响应、互联网入口、微电子记录参与以及信息合成。存在像 `GEIA` 和 `ISO` 这样的认证团体，它们提供了可以应用于人机界面技术的标准和指南。\n\
  \n## 人机界面的用途\n\n`HMI` 系统：\n* `HMI` 是一种为用户与机器之间的界面设计的软件。\n* `HMI` 是一种在 `PLC` 和操作员之间当边界的设备。\n\
  * `HMI` 用于工业，增强机器与生产工厂之间的通信。\n* `HMI` 将提供工业控制的图形化可视化，并监控其系统提供实时数据采集。\n\n`HMI` 元素：\n\
  这些元素包括：\n* 静态屏幕的开发。\n* 动态链接。\n* 趋势。\n* 设置报警和安全。\n* `HMI` 以及 `PLC` 与 `HMI` 之间的交互。\n\
  \n## HMI 的优点\n\n* 对于非技术人员易于使用。\n* 用户友好。\n* 数据记录。\n* 提高生产力。\n* 增强通信。\n* 降低成本。\n*\
  \ 易于工厂管理。\n\n人机界面产品具有核心电子设备，用于调节和信号指示工业环境中的不同类型自动化设备。`HMI` 产品从带有标准 LED 指示屏幕的简单设计到带有触摸屏和许多不同功能的更复杂的\
  \ `HMI` 系统不等。`HMI` 系统必须坚固并能够承受恶劣的环境。`HMI` 应该防尘、防水并耐极端温度，甚至在某些情况下抵御恶性化学品。\n\n在您的工厂或设施中安装\
  \ `HMI` 有许多用途，如下所示：\n\n### 报警\n工厂操作员可以看到由人机界面提供的信号，以识别任何设备故障并迅速做出反应。报警有助于在紧急情况发生之前预防并警告操作员。报警还可以帮助追踪其他问题并有助于优化生产过程以提高生产力。\n\
  \n### 可靠的消息\n作为操作员，当发生特定事件时，你可以依靠 `HMI` 消息处理 Facebook 页面、传真等许多。在其他情况下，当机器燃料水位低且需要加注时，操作员会自动收到报警。\n\
  \n### 更容易的工厂通用管理\n`HMI` 技术将高效地管理和执行配方。它具有高质量的图形，提供工厂运行的真实视图，让操作员从中央监视器轻松控制。\n\n\
  ### 模拟精确测试\n工厂主管可以使用带有模拟功能的灵活 `HMI` 快速检查设备和装置。你可以在办公室的舒适的环境中实现测试，而无需任何设备。这将有助于缩短启动时间并增强整体生产。\n\
  \n### 降低成本\n`HMI` 通过替换数百个选择器、指示灯和推按钮降低了运营成本，这意味着它将减少面板、电缆和控制台的增加。\n\n### 增强通信\n\
  通过远程、以太网、串口、动态数据交换等更多方法增强设施内各种类型设备之间的通信。你可以注意到，拥有 `HMI` 可以对您的设施运行、安全和生产产生益。工业行业甚至为苛刻的应用提供了各种\
  \ `HMI` 产品。\n\n## 人机界面的类型\n\n有不同类型的 `HMI`，如下所示：\n\n### 自动替换\n通过将所有功能整合到一个位置来优化制造过程。它替换了\
  \ LED、开关和按钮。\n\n### 数据处理\n这种 `HMI` 通常适用于需要持续性响应的应用程序。\n\n### 管理主\nHMI 对于任何涉及 `SCADA`\
  \ 的演示、窗口和端口非常重要。\n\n### 程序选择\n程序编写有三组可以从中选择：\n* **标记软件**：这是构建者提供的友好软件，它是无压力的并允许快速开发。\n\
  * **自主软件**：这是第三方软件，供各种类型使用并提供自由。\n* **脆弱软件**：这种软件允许架构师在范围内拥有广泛的信息，由操作员仔细选择。\n\n\
  ## 人机界面应用\n\n有各种请求，如下：\n* 方便性可以使用 `HMIs` 来注意水传输和废水处理。\n* 它们用于制造过程中，帮助控制速度、故障更改，`HMI`\
  \ 在工业中做得快得多。\n\n## 人机界面优点\n\n* HMI 降低了成本。\n* 它提高了效率和生产力。\n* 它节省了时间，从而增加了利润。\n* 它们可以保存数据，供未来的故障使用。\n\
  * HMI 拥有比以前先进的技术和能力。它们可以提供高技术紧急情况，如鼠标控制和硬件。\n\n## 人机通信\n\n如果你想有用、激励且有趣，就必须创建真正的认知。认知是一种通过获取知识的心理过程，IBM\
  \ 可以它们识别为可以理解、推理、学习并预期互的系统。为了实现这一点，认知系统将分析大量数据以构成明智的、环境感知的持续与用户连接。理解、推理、学习，有各种人类元素：\n\
  * **良好**：应用程序将根据预训练来分类和组织信息。\n* **更好**：应用程序能够从实时源分类和组织信息。\n* **最佳**：应用程序将带来用户的预期，并直接响应它们，创建对您的需求和背景有益的建议。\n\
  \n### 部分。输出：自然响应\n\n推理应用程序通过轻松提供存储在其知识库中的真实信息来与程序进行智能通信。通过其关于用户的经验，认知应用程序将超越准确翻译，并给出更受欢迎的宏观回答。推理可以认为是应用程序通过感知、知识和动机具有认知通信的能力。如果一个稳定的知识库产生了智能响应，如果应用程序没有服务个人并以某种方式考虑您的背景，它不是认知的。单通信在同时使用具有更多能力，但认知应用程序将根据其目前学习的内容编写响应，并根据程序对该特定的的改进未来的答案。推理是一种基于上下文和历史知识具有智能通信的应用：\n\
  * **良好**：应用可以生成针对领域或定向问题空间的预定义响应。它在创建响应时不必使用感知或动机能力，而是依赖预训练知识。\n* **更好**：它创建丰富的响应，并在创建响应时依赖感知、动机和知识能力。\n\
  * **最佳**：它将带来用户的预期，并直接响应它们，创建对您的需求和背景有益的建议。\n\n### 学习\n\n在有交互的地方，认知应用程序根据程序的响应更新他们关于程序、当前数据和世界的知识。存在用户在不检查内容的情况下立即点击建议的链接的情况。认知系统通常根据个人和集体历史经验的发现来更新与人的互动方式。它们记住过去的通信，并根据这些研究调整调整响应。学习被认为是应用程序解释用户响应并随时间推移应用知识：\n\
  * **良好**：应用程序将允许用户训练预包信息。\n* **更好**：应用程序通过用户通信和行为学习。\n* **最佳**：应用程序自行更新其知识库，无需任何用户干预。\n\
  \n## 智能自动化对生活方式和关系的影响\n\n在过去的几年里，商业发生了重大中断。过去的病态现在是未来和数字化的大趋势。许多人从购买商品转向消费服务，商户不得不改变他们的运营模式。你可以通过以下内容的自动化来实现：\n\
  \n### 工业部门\n\n建筑公司、机器人技术和人工智能 (`AI`) 将在未来五年内通过审批。看到已经在发生，例如在西班牙的工厂中增加生产能力。\n\n###\
  \ 大数据和分析\n\n用于传感器和微处理器的整个供应链，使生产下降且易于管理。\n\n### 最后公里交付\n\n当涉及到配送时，公司已经在研究如何解决最后一公里问题。人们允许从当地杂货店购物并参考它们。感知统计是诸如位置、日期、表情、心情、环境、网络和地方等。感知统计。\n\
  \n### 高街的过期\n\n如果买家现在在线购物，那么它们在未来五年内可能会结束。像亚马逊这样的行业将在不同城市创建总面积超过百万平方米的区域配送中心。这并不是唯一途径，只有受到波动影响的贸易，而且供应链的创新将带来影响。\n\
  \n\n\n\n\n## 第 4 章：人工智能关键领军者与极具的初创公司\n\n“如今作为初创公司开发实体设备要困难得多。” — Marc Andreessen\
  \ ![](img/Image00006.jpg)\n\n人工智能正在飞速发展。它现在正从农业到通信的所有行业技术世界中发挥着至关重要的作用。从 `Google`\
  \ 到 `Apple` 再到 `Microsoft`，每一家大型科技公司都投入了大量资源致力于人工智能的突破。每家公司现在都知道，为了保持竞争力，你的故事中必须有\
  \ `Machine Learning`（机器学习）。几家私营公司在美国和全球人工智能领域拥有着巨大的权力和影响力。这些公司正在以意义的方式使用这项技术，并成功地展示了其实业务潜力。以下是一些有能力和资源利用人工智能技术塑造你未来的巨头列表：\n\
  \n## Twitter\n`Twitter` 投入了大量资源进入人工智能学习领域。该公司已经相继收购了四家人工智能公司。其中最著名的是 `Magic Pony`。该公司以\
  \ 1.5 亿美元的巨价收购了 `Magic Pony`。这家人工智能公司开发了用于网页和移动设备视觉处理的 `Machine Learning` 方法，`Twitter`\
  \ 将利用此在不久的未来改进其在你时间线中推荐特定推文的系统。\n\n## SenseTime\n人工智能公司 `SenseTime` 已经拥有大客户，其中包括中国政府。该公司正在向中国政府提供人脸识别技术以追踪其公民。这项技术被誉为最佳，在人脸识别方面优于\
  \ `Google` 和 `Facebook` 产品。目前，`SenseTime` 正在集中资源开发自动驾驶技术。\n\n## Qualcomm\n`Qualcomm`\
  \ 是一家致力于人工智能的芯片制造公司。人工智能在其开发的 855 个移动平台中起着至关重要的作用。该芯片使用信号处理器处理 AI 语音、音频和图像功能。`Qualcomm`\
  \ 的 `Snapdragon`（骁龙）驱动了今天市场上一些最受欢迎的智能手机。如果你是手机技术爱好者，想要体验新的 AI 手机功能，请密切关注 `Qualcomm`。\n\
  \n## Nvidia\n`Nvidia` 也许是成立最久的人工智能公司之一，今天仍然起着至关重要的作用。`Nvidia` 的图形是机器学习和人工智能的核心。该公司在医疗、高等教育、零售和机器人领域非常活跃。该公司正在开发将集成到车辆制造和自动驾驶每个层面的\
  \ AI 技术。\n\n## Microsoft\n`Microsoft` 在消费者和业务端都参与了人工智能。`Microsoft` 的 AI 数字助手 `Cortana`\
  \ 与 `Amazon` 的 `Alexa`、`Apple` 的 `Siri` 以及 `Google` 的数字助手直接竞争。人工智能功能利用公司的 `Azure\
  \ Cloud` 服务为业务界一些最大的名字提供聊天机器人和机器学习。`Microsoft` 仅在 2018 年就购买了数家 AI 公司。\n\n## Intel\n\
  `Intel` 一直对多家人工智能公司进行大采购。在近期，`Intel` 收购了 `Nervana`、`Movidius` 以及几家较小的 AI 初创公司。`Nervana`\
