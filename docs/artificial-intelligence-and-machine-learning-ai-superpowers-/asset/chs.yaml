  \ Bloomberg Beta\n作为市场生态系统的策展者，Shivon 将机器智能带入了地图。你可以寻找 Shivon 来影响 AI 公司的方向，并在获得支持。\n\
  \n### Sinan Ozdemir, Kylie\nSinan 曾是 `Johns Hopkins University` 的数据教授，目前是 `Kylie`\
  \ 的创始人，这是一个克隆工人特征以自动化行业和买家的 AI。他是《数据科学原理》的编辑。\n\n### Comet Labs Team\n在 10 列表中，你不能错过来自\
  \ `Comet Labs` 的团队。他们专注于将 AI 和机器人带入市场，搭建更好的舞台。\n\n## AI 的贡献\n\n以下是对客户体验的一些影响：\n\n\
  ### 智能传播\n你必须考虑口袋里想要什么。不要考虑硬币。因为你是在一个人类知识被形成的特定门户中。不要再感到惊讶了，而是考虑你的数字助手，它可以回答问题、规划你的生活并将你连接到全球资源。快速且高效的时钟交互是\
  \ AI 对认知的一个重要方面。\n\n### 电商个性化\n当你看向聊天机器人之外，网站正在变得越来越聪明。针对技术的机器学习技术正在改进并推动电子商务理解的明智机会。当你加载网站时看到广告时，它们是为你量身定制的，并且基于其他因素或你喜欢和不喜欢的东西。大多数零售网站将根据你访问和查看的页面以及你在网站上的活动来推崇产品。现在，看到网站通过你的名字问候你也很常见了。如果网站没有通过你的名字识别你，它将知道你的浏览网站。可能会根据你的位置提供优惠，或者一个为新访客提供折扣的弹出窗口。\n\
  \n### 了解客户\n这不是在线访问的最明智东西。你可以看到诸如 `WebVR` 之类，例如在决定购买之前，你可以看到一副眼镜戴在脸上长什么样。你可以看到 360\
  \ 度网站，它们在艺术环境中吸引你，并允许你与视频游戏等部分进行交流。生物识别技术也在兴起，你的 `iPhone` 是通过脸部解锁的。品牌已经在将这种技术用于现代化结账。这增强了使用指纹完成\
  \ `PayPal` 交易。很快你将进行使用脸部或语音识别验证的交易。\n\n### 润滑你的入职\n不仅是浏览变得更加顺畅。你回想一下上次下载应用、数字产品，甚至在线下载免费软件试用是什么时候？下载需要多久？我你你下载了各种东西让它运行，你经历过咨询说明吗？所有乏味的入职体验都是过去式了。\n\
  \n\n\n\n\n## 第 6 章：AI 应用：人工智能对金融、医疗和商业的影响\n\n“开采小行星最终将从许多方面造福地球内外的人类。” —— 彼得·迪亚曼迪\
  \ ![](img/Image00008.jpg)\n\n人工智能（Artificial Intelligence）或增强智能（Augmented Intelligence）具有意义，因为它它可以帮助解决不同领域的麻烦问题，例如制造业、零售、医疗、娱乐、运输和公用事业。人工智能的应用可以归为以下几类：\n\
  \n*   **数据**：展示世界信息的能力。例如，财务管理、资产交易预测、法律评估、游戏和自主武器系统。\n*   **推理**：通过逻辑推演解决问题的能力。例如，广告、营销和预测分析。\n\
  *   **管理**：设定并实现目标的能力。例如，股票管理、需求预测、预测支持、物理及高级系统增强、导航、预订、物流。\n*   **通信**：理解文字和口语语言的能力。例如，对口语和书面方的持续解释、持续翻译、AI\
  \ 虚拟助手、语音控制。\n*   **观察**：利用声音、图片和其他实体信息源解释关于世界的能力。此特征的示例包括医疗诊断与治疗、自动驾驶车辆、监控。\n\n\
  ## 商业中的 AI\n\n人工智能可以说是是计算机代码的复兴。它是各种能够自主决策的计算机代码，甚至可以在程序员未预见到的事件中采取行动。与传统软件相比，AI\
  \ 具有更广阔的决策空间。这些特质使人工智能成为多个行业中的宝贵资产；无论是协助客户和员工快速开发他们在公司区域内的行动方案，还是执行诸如监控涡轮以预测其下次维修等复杂的任务。\n\
  \n机器学习通常用于采集大量数据的系统。例如，智能能源管理系统从安装在不同资产上的传感器收集数据。然后，机器学习算法对这些数据库进行上下文化处理，并将其交给人类决策者，以便更上感知能源使用和维护需求。许多企业采用计算机科学（`AI`）技术来降低成本、提高效率、增加收入并改善客户体验。\n\
  \n### 人工智能对业务的影响\n\n通过部署适当的 AI 技术，您的业务可以获得能力：\n\n1.  通过自动化和优化常规流程和任务来节省成本和金钱。\n\
  2.  提高生产力和功能效率。AI 为当今业务活动和功能提供的自动化潜力已经超过了历史上的生产线。在许多业务职中（如促销和分发），AI 已经准备好加速流程并为决策者提供可靠的洞察。以广告为例，市场细分和活动管理的自动化已使许多结构良好的决策和快速行动成为可能。你获得了对客户的宝贵洞察，这可能帮助你增强与他们的互动。营销自动化是适当的客户关系管理应用中最实用的功能之一。\n\
  3.  由认知功能技术支持的输出做出更快的业务决策。每个营销决策都有多个复杂性。你必须观察并理解客户的愿望和需求，并将商品与这些愿望和需求匹配。同样，对客户行为的良好理解对于在短期和长期内创建最有效的销售选择至关重要。AI\
  \ 建模和模拟技术为你的买家画像（empor personas）提供了可靠的洞察。\n4.  只要 AI 系统创建得当，就可以避免错误和“人为错误”。人为错误的范围仍然大于\
  \ AI 错误的范围。而且主要的，AI 错误的来源很大程度上是人为错误。需要投资来改进对每种错误的错误检测，以减轻其影响。随着人类和机器的共同演进，新错误出现的概率将增加（而传统错误减少），这需要充分的风险管理努力。\n\
  5.  利用洞察预测客户偏好并为他们提供更精彩、个性化的体验。组织正在利用 AI，因为它允许他们向客户提供个性化的促销，这将不断增加参与度，有助于提高客户忠诚度并提高销量。AI\
  \ 的另一个优势是它准备好识别客户浏览习惯和购物行为中的模式，因此能够能够能够为客户定制极具针对性的报价。\n6.  挖掘海量数据以产生高质量线索并扩大客户群。基于云的\
  \ AI 应用非常先进，它们在处理大数据时会迅速发现重要信息和相关发现。这一特征为企业提供了对此前未发现数据的洞察，为它们在市场中提供了更高的优势。\n7. \
  \ 通过注意和增加销售机会来增加收入。先驱看重产生收入的应用而非节省成本的应用。成为 AI 先驱是产生可能不可逾越的竞争优势的最优边缘。\n8.  通过实现预测和风险分析并提供智能建议和支持来增加经验。最后，AI\
  \ 的奇妙之处在于它将根据数据分析预测结果。例如，它检测客户信息中的模式，显示目前在售的商品是否可能售出以及需求量可能会减少。\n\n### 业务机会\n\n\
  在业务中采用 AI 的最大推动是竞争优势。之后，动力来自：\n*   高管领导的决策\n*   特定公司的运营或技术劣势\n*   客户需求\n*   即时答案\n\
  \n开始只需要开阔的视野并在可行的地方拥抱新机会。但请记住，AI 是一种新兴技术，因此它是动态且快速节奏的，可能会带来意意之外的挑战。\n\n### 业务中 AI\
  \ 的风险和局限性\n\n虽然市场上存在许多 AI 的商业机会，但也需要注意障碍。实施 AI 的重大障碍之一是数据可用性。数据经常被存档或质量较差，这为试图规模化价值的企业带来了挑战。为了克服这一点，你必须对\
  \ AI 依赖的数据有一个透明的框架。采用 AI 的另一个关键障碍是技能短缺，因此具备部署和运行 AI 解决方案所需的专业知识的技术人员匮乏。研究表明，`数据科学家`稀缺，精通`机器学习`、训练`智能模型`等的专业`数据专业人员`也是如此。\n\
  \n成本是获取 AI 的另一个主要考虑因素。缺乏内部技能或缺乏 AI 经验的企业通常需要外包，其中价格和维护的挑战依然存在。得于其先进性，适当的技术将价格很高，你将为维修和升级产生额外成本。处理训练数据也可能是一项额外支出。软件需要定期升级以适应动态的业务环境，并在发生故障时引入丢失关键信息的风险。然而，在系统设计良好且你让\
  \ AI 理解你的需求和选项的情况下，这种风险是可以管理的。其他 AI 局限性包括：\n*   实施时间可能是非常长的\n*   与不同系统和平台的可用性和互操作性\n\
  *   客户隐私\n*   潜在缺乏透明度\n\n### 伦理问题\n\n智能技术正在增强我们的工作。随着技术变得越来越强大，我们的生活变得高效。然而，尽管技术的发展，像\
  \ `IBM`、`Amazon` 或 `Microsoft` 这样的科技巨头以及像 `Hawking` 这样的天才认为，现在是讨论技术未来及其影响世界的时候了。这些问题是道德问题，也是长期风险。那么，人们担心的是什么？\n\
  \n1.  自动化技术导致工作流失的潜力。随着我们倾向于演进并构建其他方式来自动化工作，我们为未来的人类提供了高级职位机会。由于工作流失，通常需要部署或重新培训员工以让他们留在其他职位上。\n\
  2.  机器创造的财富的公平分配。金融系统依赖机器对经济的贡献。然而，通过使用 AI，组织可以降低对人类的依赖，这表明收入可以分配给更多的人。因此，拥有 AI\
  \ 驱动的企业可以积累所有财富。\n3.  机器对人类行为的影响。虽然人类在某些程度上受限于注意和善良，但机器人将把无限资源投入到与人类的关系中。这仅仅是我们将与机器更频繁互动的时代的开始。\n\
  4.  处理源于人类偏见的算法偏见的需求。尽管计算机科学能够速度和处理能力，但无法永远诚实和公正。Google 及其母公司 Alphabet 在涉及人工智能的方面是领导者。正如\
  \ Google 照片服务所示，AI 被用于识别人、物体和场景，有时可能会出错，例如产生族裔偏见。如果被负责任地使用或用于社会进步，AI 将成为积极催化剂。\n\
  5.  AI 系统的安全性（例如自主武器）可能会造成伤害。随着技术变得越来越强大，网络安全变得更加必要，毕竟我们正在应对意外后果。\n6.  为了减轻意外后果的需求。由于我们倾向于独立开发智能机器，这些系统被可靠地认为是教学的。在这种情况下，某些遗传算法快速产生多个实例；然而，只有最成功的会生存，其余的被删除。如果被负责任地使用，AI\
  \ 有强大且实用的潜力。\n\n### 金融中的 AI\n\n在 AI 在零售和制造业等领域的巨大成功之后，它目前已准备好转型银行和金融服务。以下是银行将利用的几个用例。金融公司信任计算机和数据科学家来确定市场的未来。商业主要依赖于准确预测未来的能力，没有人比机器在短时间内处理海量数据更好。机器可能会学习数据中的模式并预测这些模式在未来可能重复。\n\
  \n数字化转型驱动于：\n*   传统银行与 `FinTech` 以及纯数字银行之间持续的竞争。\n*   经济中多个部门的自动化、大数据和相关创新。\n* \
  \  客户变得日益数字化和精通技术（特别是三十岁以下的人），需要 AI 解决方案来提高利润。\n\n应用内银行今天，几乎所有银行都有至少一个用于执行日常银行操作的应用，如查询余额、交易和订购新支票。然而，少数银行在他们的应用中利用\
  \ AI 来实现卓越的客户体验。由自然语言处理控制的 AI Chat 机器人可以通过记录常规查询和任务（如支付账单）快速高效地为银行客户服务。\n\n销售流程聊天机器人更擅长响应查询。它们将作为虚拟员工。销售主管有工作时间和交易信息等限制。聊天机器人之类的智能系统没有任何限制。无论什么时候，它们都会回答任何查询，因为系统存储了大量的交易数据。通过利用这个数据库，系统将创建评估以确认当前状况与一个月前相同。\n\
  \n交易今天，投资公司正在寻找数据科学家而非市场专家来看长期趋势。他们产生复杂的机器学习算法，通过观察趋势发现市场中的未来模式。这些算法在几秒内消耗数 TB 数据，并可能帮助个人交易者做出买入、持有或出售等决策。\n\
  \n合控制每个金融机构都面临高水平的审查。银行每分钟产生的大量信息需要几个月才能发现操纵资金、违反规定等违当行为。\n\n风险分析人工智能技术应用于风险分析是因为它具有处理不确定性、不完整不准确的信息以及定性数据的能力。当需要处理非结构化数据时，人工智能与风险管理相一致。AI\
  \ 解决方案准备好为金融机构提供可靠和实时的信息。\n\n预测分析正如名称所示，预测分析“预测”客户的未来状态，即他们是否会像现在一样支付和投资。机器算法还可以作为客户的私人财务顾问，为他们提供如何改善其状况的建议。\n\
  \n数据富化交易数据对于每天多次花费和接收现金的人来说通常是模糊的。交易数据通过将交易分类，将难以理解的交易信息转换为易懂的信息。它帮助客户监控信用评分、预算、消费习惯并预测未来的收入和支出。\n\
  \n欺诈识别全球交易的数量和金额都是在线欺诈的威胁。标准的在线欺诈检测仅考虑几个数据点，而基于 AI 的算法考虑更多位点以检测欺诈。欺诈检测是 AI 在金融服务中的显著用途。例如，`MasterCard`\
  \ 使用决策智能技术检查虚假交易，提高持续准确性并减少不必要的交易延迟。机器学习帮助大型支付科技 `MasterCard` 减少了百分之五十的欺诈活动。银行可能已经拥有所有的交易信息，因为存储了过去的银行记录。欺诈顾问在参与机器学习模型时，必须标记欺诈交易和非欺诈交易，当系统被训练时。\n\
