    to infer some situations even if they are not mentioned in the notes. Currently,
    the company has more than 20 health systems and pharmaceutical clients in the
    states and across the globe. Armorblox Armorblox launched into the cybersecurity
    market two years ago. It aims to protect customers from socially engineered attacks,
    like phishing emails which takes advantage of your missteps. It uses natural language
