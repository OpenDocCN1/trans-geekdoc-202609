    \ to a higher or lower level, depending upon the sort of work they involve. Automation,\
    \ presently progressing past standard manufacturing, has the likelihood, at least\
    \ as to its technical feasibility, to change sectors, for example, medical and\
    \ financial, which include a significant portion of information duties.\n\n###\
    \ Understanding Automation Potential\n\nIn talking about automated technology,\
    \ we allude to the possibility that a given task could be automated by adapting\
