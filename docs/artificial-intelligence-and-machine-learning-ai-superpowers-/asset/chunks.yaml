    Rhode Island and Columbus, Ohio where you can get a scenic tour of the city as
    a passenger aboard the self-driving shuttles. Artificial Intelligence Startup
    Companies Building Your Smarter Tomorrow It is not only the big companies who
    are infusing their products and services with artificial intelligence. Other smaller
    companies are at work, developing their intelligence technology and services.
    And, well, they are doing a remarkable job! Here is a list of intelligence startup
