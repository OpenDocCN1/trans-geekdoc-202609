    # 第 5 章：AI 发展领域最具影响力的 10 位人物及其贡献


    “技术正在释放我们对同类与有的同情心。” —— 比尔·盖斯


    一旦某种技术运行顺畅，它就不再需要被称为 AI 了。约翰·麦卡锡（John McCarthy）在 1995 年发明了`Artificial Intelligence`（人工智能）这个词，从那以后
    AI 公司经历了各种艰难与顺利的时刻。这些时刻伴随着进步，但也夹杂着许多失望和幻灭的承诺。随着海量信息的出现、快速处理的紧迫需求以及来自“美国黑手”合理改进的热情，AI
    尊严地在一个可能超过互联网本身的尺度上创造了关注点。当世界准备见证 AI 公司的转型时，每一个与现代化生活相关的个人都将意识到，AI 将如何或将不会对他们公司的日常生活产生影响。


    ## 第一部分：公司巨头（超级力量）


    以下人物帮助了塑造和增强了 AI 行业，使其完全成长为一门蓬勃发展的性行业。


    ### Amit Singhal, Uber

    在被任命 `Uber` 工程团队的新任主席后，Amit 将进行许多改变，以帮助整个 `Uber` 车队实现自动驾驶汽车的突破。


    ### Andrew Ng, 百度

    他是 `Google` 创立背后的大脑之一，现在被任命为 `Baidu`（“中国谷歌”）的首席科学家。Andrew 正在塑造全球两个主要经济体的 AI 交互。他作为
    `Coursera` 的联合创始人也并无害处，而且他的 Twitter 账号上有 10 万粉丝。


    ### Elon Musk, SpaceX, and Tesla

    他可能不是某家 AI 公司的研究员，但当 Elon 谈论这个行业时，很多人都会倾听他的话。他是 `Open` 的主席。他最近的宣布是成立了初创公司 `Neuralink`，该公司将通过
    AI 创建将计算机接口连接到人脑的植入物。根据他的说法，这项技术将通过神经外科机器人向人脑植入微小、灵活的电极。


    ### Jeff Dean, Google

    他是 `MapReduce`、`Google Brain`、`TensorFlow` 的创造者，Jeff 被认为 `Google` 最关键项目的核心，并继续在这一首创了“AI
    优先”方法的行业中引起浪潮。Dean 与 Google 员工一起，最近宣布了 `Google` 正在进行的当前 AI 项目，包括协助人们在不使用语音控制 `Google
    Assistant` 的 `Project Diva`、旨在聋人的语音识别应用 `Live Relay`，以及 `project Euphonia`（该项目旨在帮助语言障碍人士更轻松地交流）。


    ### Ginni Rometty, IBM

    自自从 74 岁的 Ken Jennings 在 2004 年在 `Jeopardy` 节目中获胜以来，`IBM` 一直致力于 `Watson`。`IBM`
    将所有的精力和未来都放在了 `Watson` 上。Ginni 也希望 `Watson` 也能为她推特。评审团虽然关注了 `Watson`，但表扬了 Ginni
    将这个拥有 105 年历史行业的重心转向了 AI。


    ### Martin Ford

    他是《机器人崛起》（Rising of the Robots）的作者和创造者；他塑造了围绕 AI 和机器人的自然交互。他被认为创作了许多关于 AI 和未来的畅销书。根据
    `GE Reports`，他最近的预测表明，与新就业相比，AI 将毁灭许多工作。他指出，AI 可能会威胁到几乎每一个本质上是常规性的工作。


    ### Ray Kurzweil, Google

    该协会的主要教祖 Ray Kurzweil 多年来一直对 `Computer Company` 给出非常准确的预测。他提出了“奇点”（Singularity）理论，预测在未来的几十年里，我们将达到一个点，那时计算能力将占据主导地位，以至于会掩盖任何人类试图处理创新速度的过程。


    ### Sebastian Thrun, Udacity

    他是自动驾驶前线大脑之一，Sebastian 还曾创立了 `Udacity`。来自 `Stanford` 的 AI 教授们曾询问过为什么要创立一个在线学习行业。这是因为
    AI 的颠覆需要社会重新教育。


    ### Yann LeCun, Facebook

    他是 `Facebook` 纽约团队的负责人。关于这一点没有进一步的解释。接触 AI 的固有本质意味着它将给许多人带来积极影响。Yann 同时也肩负着巨大的责任。


    ## 第二部分：后起星


    这些人的兴起将发挥重要作用。他们中的许多人现在并不知名，但在未来将贡献积极能量。


    ### Boris Sofman, ANKI

    通过结合软件和硬件的力量，`ANKI` 正在生产智能产品。它首次在 2010 年的 `Apple WWDC` 上揭晓。


    ### Bryan Johnson, Kernel

    很多人认识 Bryan 是因为他的初创公司 `Braintree`，他对 AI 的探索是最大胆的步骤之一。他雄心勃勃，并一直在通过直接同化提高人类能力。


    ### Carol Reiley, Drive.ai

    Carol 正在推动自动驾驶革命。她是机器人领域的长期领导者，也是 `Andrew Ng` 的妻子。这是美国第一个 AI 家族。


    ### Charles Jolley, Ozlo

    如果你需要一个朋友，不要担心，获取 `Ozlo`。行业一直在训练 `Ozlo` 成为一个伟大且高效的助手，成为你生活的有用部分。


    ### Matt Zeiler, Clarifai

    为了让 AI 与现实世界产生交互，他们需要首先看到世界。这就是 Matt 的公司 `Clarifai` 发明的地方。它帮助图像和视频识别平台，许多 AI 产品将在未来使用。


    ### Nikhil Budama, Remedy Medical

    自从从 `Johns Hopkins University` 毕业后，Nikhil 和他的团队一直在努力让医疗变得更容易获得、更易管理，并提高专业性。`Remedy
    Medical` 能够帮助医生完成行政任务并让患者获得更好的照顾。


    ### Rand Hindi, Snips

    他被认为处于创造智能技术的竞赛中。与 `Snips` 的所有明星成员一起，他们正在制造一种无障碍且即插用的人工助手。


    ### Riva Tez, Permutation Ventures

    Riva 以身为 AI 投资者和传教者闻名，将医疗问题带入焦点。在克服了个人困难后，Riva 现在正致力于改变 AI 和风险资本行业。


    ### Shivon Zilis, Bloomberg Beta

    作为市场生态系统的策展者，Shivon 将机器智能带入了地图。你可以寻找 Shivon 来影响 AI 公司的方向，并在获得支持。


    ### Sinan Ozdemir, Kylie

    Sinan 曾是 `Johns Hopkins University` 的数据教授，目前是 `Kylie` 的创始人，这是一个克隆工人特征以自动化行业和买家的
    AI。他是《数据科学原理》的编辑。


    ### Comet Labs Team

    在 10 列表中，你不能错过来自 `Comet Labs` 的团队。他们专注于将 AI 和机器人带入市场，搭建更好的舞台。


    ## AI 的贡献


    以下是对客户体验的一些影响：


    ### 智能传播

    你必须考虑口袋里想要什么。不要考虑硬币。因为你是在一个人类知识被形成的特定门户中。不要再感到惊讶了，而是考虑你的数字助手，它可以回答问题、规划你的生活并将你连接到全球资源。快速且高效的时钟交互是
    AI 对认知的一个重要方面。


    ### 电商个性化

    当你看向聊天机器人之外，网站正在变得越来越聪明。针对技术的机器学习技术正在改进并推动电子商务理解的明智机会。当你加载网站时看到广告时，它们是为你量身定制的，并且基于其他因素或你喜欢和不喜欢的东西。大多数零售网站将根据你访问和查看的页面以及你在网站上的活动来推崇产品。现在，看到网站通过你的名字问候你也很常见了。如果网站没有通过你的名字识别你，它将知道你的浏览网站。可能会根据你的位置提供优惠，或者一个为新访客提供折扣的弹出窗口。


    ### 了解客户

    这不是在线访问的最明智东西。你可以看到诸如 `WebVR` 之类，例如在决定购买之前，你可以看到一副眼镜戴在脸上长什么样。你可以看到 360 度网站，它们在艺术环境中吸引你，并允许你与视频游戏等部分进行交流。生物识别技术也在兴起，你的
    `iPhone` 是通过脸部解锁的。品牌已经在将这种技术用于现代化结账。这增强了使用指纹完成 `PayPal` 交易。很快你将进行使用脸部或语音识别验证的交易。


    ### 润滑你的入职

    不仅是浏览变得更加顺畅。你回想一下上次下载应用、数字产品，甚至在线下载免费软件试用是什么时候？下载需要多久？我你你下载了各种东西让它运行，你经历过咨询说明吗？所有乏味的入职体验都是过去式了。


