    financial management, asset trading forecast, legal assessment, gaming, and autonomous
    weapons systems.

    *   **Reason**: The capacity to tackle issues through logical derivation. For
    example, advertising, marketing, and predictive analysis.

    *   **Management**: The ability to set and accomplish objectives. For example,
    stock administration, forecasting demands, predictive support, physical and advanced
    system enhancement, navigation, booking, logistics.

    *   **Communication**: The capacity to comprehend written and spoken language.
    For example, constant interpretation of spoken and composed dialects, continuous
    translation, AI virtual assistants, voice control.

    *   **Observation**: The capacity to interpret things about the world by employing
    sounds, pictures, and other tangible information sources. Examples of this feature
    are medical diagnosis and treatment, self-driven vehicles, surveillance.


