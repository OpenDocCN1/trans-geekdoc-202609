  fmt: "\n# Chapter 2: Artificial Intelligence Vs. Human Intelligence\n\n\"It has\
    \ become appallingly obvious that our technology has exceeded our humanity.\"\
    \ — Albert Einstein ![](Image00003.jpg)\n\nArtificial Intelligence and Automation\
    \ are terms that are frequently used interchangeably. They are related to programming,\
    \ or robots, and electronic machines that enable us to work more productively\
    \ and successfully - regardless of whether it is an industrial vehicle assembly\
    \ or sending a follow-up email. In any case, it is more nuanced than that.\n\n\
    Automation is fundamentally making hardware or software that can do things automatically\
    \ - without human mediation. The term artificial intelligence was coined by John\
    \ McCarthy as an engineering science of making smart machines. Computer-based\
    \ intelligence is tied in with attempting to make machines or software mimic,\
    \ and in the long run, supersede human behavior and intelligence. The ideal situation,\
    \ which humankind is moving in the direction of currently, is this: Automated\
    \ machines gather data — AI systems “understand” it. We are looking at two altogether\
    \ different frameworks that impeccably complement one another.\n\n## Automation\n\
    \nAutomated systems are the explanation banks that record your installments in\
    \ a matter of seconds, and are the reason why organizations send mass emails to\
    \ their clients. It is what enables you to get your consignment shipped and delivered\
    \ on the same day within hours of ordering.\n\nAutomation has a singular purpose:\
    \ To give machines a chance to perform monotonous, repetitive activities or as\
