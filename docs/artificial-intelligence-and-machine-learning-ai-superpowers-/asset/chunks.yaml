    to operate faster and smarter. The company has attracted tremendous  investment
    partners, including SoftBank, the Japanese telecommunication giant. Apple Apple
    sees artificial intelligence as a critical part of its future. Consequently, the
    company has been busy acquiring A.I. startups in recent years. The company has
    developed products such as Siri and the company''s new Create ML Tool, which macOS
    and iOS developers made to create efficient and straightforward training courses
    for their apps. Viz.ai The company aims at reducing the number of stroke victims
    who don''t receive the right treatment in time. Its software cross-references
    CT images of a patient''s brain with its database of scans and can alert specialists
    in minutes to early signs of broad vessel occlusion strokes that may have otherwise
    been missed or may have taken too long to spot. The AI product from the company
