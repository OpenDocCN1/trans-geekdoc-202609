    actionable insights. These technological advancements make Salesforce one of the
    new members on the list of best A.I. companies to invest in. Amazon.com Stock
    The company has a valuation of $1trillion, and it is investing heavily in artificial
    intelligence. Amazon uses AI to power key capabilities like forecasting product
    demand, optimizing  logistics and warehousing and improving the voice-powered
    Amazon Alexa virtual assistant. With about 360 AI jobs posted nationwide, the
    company is at the leading front in the A.I. world. Putting your money in the stock
    of this company guarantees you handsome returns. How to Create an AI Start-up
    Artificial intelligence is the  craze right now. If you are wondering how you
    can build your own AI startup, then here are some brief steps on how you can get
    started: Pick a Topic You Are Interested In You need to select a topic of interest
    to you to stay motivated and involved in the learning process. Focus on an existing
    problem and look at the solution. If you are not successfully solving a problem
    that customers are willing to pay for, then your start up is going nowhere. Before
    you go far, test whether or not people are willing to pay for what you are planning
    to build. Play the Data Gathering/AI building a Game Once you are assured of ready
    customers for your product, then build the first generation of your AI. You need
    to gather as much data as possible touching on your pet project, then curate  it
    to make sure it is useful and then design a model and train it. You need to note
    that the process of data gathering, curating, and training is the most challenging
    part of your project. Training a model is very demanding and time-consuming. You
    will spend a bulk of your problem-solving efforts on gathering and understanding
    data. Build your Product At this point, you should be having a working AI. You
    need to improve your A.I. capabilities to make it user-friendly. This means you
    have to package your AI into a product which the market can respond to positively.
    Your product should have a user face with a range of capabilities. Your product
    must also be able to efficiently solve the problem it was created to do, within
    a short time and in an affordable way. Develop a Means for Improving Your AI Once
    you launch your new startup, you need to continue gathering more data that was
    not available for you when you were training your AI. You then use this data to
    improve your A.I. to improve its accuracy. Determine the number of times you will
    train your AI in a given period. Finally, in case you are having any trouble building
    your startup, consider enrolling in the online courses such as: ● Learn with Google
    - this is a project launched by Google to help you understand what A.I. is and
    how it works. It has a  machine learning course for beginners such as GOOGLE''s
    TensorFlow. ● Stanford University Machine Learning - the course is available on
    Courser. The course can be offered for free, or you pay a fee if you want a certificate.
    The course will familiarize you with examples of A.I. driven technologies. You
    also learn the basics of software engineering. ● Nvidia-Fundamentals of Deep Learning
    for Computer Vision - computer vision is a discipline that focuses on creating
    computers capable of analyzing the visual information as the human brain does.
    The course covers the necessary technical fundamentals along with practical applications
    of object classification and object recognition. You will also learn how to build
    your neural net application. Global Human Machine Industry (HMI) What is HMI?
    Human Machine Interface is a central control system that communicates operator
    inputs and receives real-time data and feedback from a PLC logic controller. An
    HMI provides an essential visual of what is going on inside a control system.
    It records crucial production information, including cycle count times and recipes
    for different processes. HMI has become the standard interface for operator control
    on new and upgraded plant equipment and process control system . HMI and the Global
    Market The global HMI market is expected to generate revenues of more than $8billion
    by the year 2023.  The increasing importance of safety, energy, better productivity,
    and sustainability will lead to the rapid expansion of the global human machine
    interface market. Moreover, the implementation of supervisory control and data
    acquisition (SCADA) and Programmable Logic Controllers (PLC) in factory automation
    systems will transform the market over the years. The global HMI market is driven
    by growing demand from semiconductor fabrication plants that requires control
    centers, clean rooms, and assembling plants for effective equipment control. HMIs
    facilitate a high degree of customizations and are increasingly finding their
    application in equipment which is characterized by ruggedness and reliability
    in the human-machine interface market. HMI Market – Geography The global HMI market
    is divided into North America, Asia Pacific, Europe, and the Rest of the World.
    Currently, this market is dominated by the region of North America. A rising GDP
    and recovery from economic slowdown are the main factors driving the North American
    HMI market. Other factors that make North America dominate the market include
    the  growth in discrete industries, high adoption of advanced manufacturing practices,
    and increasing demand for advanced software solutions in manufacturing industries.
    However, it is expected that the Asia Pacific HMI market will witness the highest
    rate of growth owing to rapidly growing economies like India, South Korea, Indonesia,
    and China, and the growth of automation in these regions. The companies in the
    global HMI market are: ABB Ltd., Advantech Company, Ltd Beijer Electronics, Inc.
    Honey Wall International, Mitsubishi Electric Corporation, Siemens AG, General
    Electric Co., Kontron AG, Ltd Rockwell Automation, Yokogawa Electric Corporation.
    Estimation of HMI Market It is estimated that the Global Human Machine Interface
    Market will expand to US$5,579 million by 2019 as industrial efficiency takes
    center stage. The market is widely expected to grow at CAGR of 10.4% between 2013
    and 2019 with the exception of topping the market with a value of US$5579 million
    by 2019. The Global HMI market is also expected to further grow to US$8.96 billion
    by the year 2026, GROWING at a CAGR of 9.8%. The rising need for efficiency and
    monitoring in  manufacturing plants and the evolution of industrial internet of
    things (IIOT) and the growing demand for smart automation solution are some of
    the key factors propelling market growth. Future Technological Advances You Can
    Look Out For The technological landscape is witnessing so many advancements nearing
    maturity. In a decade several of them will be accepted as part of your everyday
    life. They will influence how you live, work, and entertain yourself. Most will
    be promoted by business first before being taken by the wider society. While they
    will make life easier some will bring fear and uncertainty at the loss of independence
    and control over your life. Here is a futuristic look at how the world is likely
    to change in the next decade with technology and innovations. Flying Taxis Mobility
    is expected to change with the introduction of the on-demand flying taxis. An
    experiment in the area of flying taxis is being orchestrated by ride-sharing provider
    Uber Technologies as part of its Uber Elevate program. The company plans to deploy
    Uber Air - the electric aerial vehicles capable of vertical take-off and landing
    . Mobile Phone Advancement A decade from now, mobile phones will have features
    that you usually see in movies. Such features include the hologram. In the next
    few years, hologram displays will be commonplace on smartphones. Your phone will
    also evolve to become increasingly part of the internet and the Internet of Things
    (IoT). Future mobile and communication devices will be able to recognize mobile
    phones uniquely wherever they go shopping or take a pod to the nearest Hyperloop
    station. Drones A future with drones in it is probably closer than you can imagine.
    There are a million experiments on drone use across the globe. Amazon is currently
    working on drones which will make deliveries. There are also companies working
    on drones that will make medicine delivery to remote hilly areas of the world.
    Creative Learning in Schools From the infrastructural point of view, advances
    in technology will bring to bear many tools for teaching and learning. A good
    example is a virtual reality which brings alive various concepts, creating an
    immersive environment in the classroom. With the  availability of Cloud computing
    and storage, students will have access to their lessons and worksheets wherever
    place they are. Teachers will have to reinvent their roles. They will become catalysts
    for problem-solving and for connecting students and the industry in the process
    of learning will become highly interactive. Medical Services You will no longer
    have to go to the hospital for medical services. You can access these essential
    services right at your home. For example, portable versions of large scanning
    machines are being built by startups and medical technology companies. These new-generation
    devices make diagnostics available at home. Moreover, wearable devices that can
    monitor patients round the clock and upload data to the Cloud securely to the
    patients'' health records are already a reality. They allow doctors to be alerted
    to a change in a patient''s condition and help them determine the severity of
    the illness. '
  fmt: "\n# Chapter 4: Artificial Intelligence Key Leading Players and Promising Startups\n\
    \n“It's much harder these days as a start-up to do physical devices.” — Marc Andreessen\
    \ ![](Image00006.jpg)\n\nArtificial intelligence is moving forward very fast.\
    \ It is now playing a critical role in your technological world across all industries,\
    \ from Agriculture to Communication. From `Google` to `Apple` and `Microsoft`,\
    \ every major tech company is dedicating a lot of resources to breakthroughs in\
    \ artificial intelligence. Every company now knows you must-have `Machine Learning`\
    \ in your story to stay competitive. Several private companies wield immense power\
    \ and influence in the world of A.I. both in the U.S. and across the globe. Such\
    \ companies are using the  technology in a meaningful way, and they are succeeding\
    \ in demonstrating real business potential from doing so. Here is a list of the\
    \ big players which have the power and resources to shape your future using artificial\
    \ intelligence technology:\n\n## Twitter\n`Twitter` has invested a lot of resources\
    \ to get into Artificial Intelligence Learning. The company has already acquired\
    \ four artificial intelligence companies in quick succession. The most notable\
    \ of this is the `Magic Pony`. The company acquired `Magic Pony` for a whopping\
    \ $150 million. The A.I. company has developed `Machine Learning` approaches for\
    \ visual processing on the web and mobile devices, and `Twitter` will use this\
    \ to improve its systems for recommending specific tweets in your timeline in\
    \ the near future.\n\n## SenseTime\n`SenseTime` artificial intelligence company\
    \ already has big clients, including the Chinese government on its list. The company\
    \ is supplying the Chinese government with face-recognizing technology to track\
    \ its citizens. The technology has been lauded as the best, better than what `Google`\
    \ and `Facebook` are doing when it comes to face recognition. Currently, `SenseTime`\
    \ is concentrating its resources on developing autonomous driving technology .\n\
    \n## Qualcomm\n`Qualcomm` is a chip manufacturing company that is committed to\
    \ artificial intelligence. A.I. plays an essential role in 855 mobile platforms\
    \ developed by the company. The chip uses a signal processor for AI speech, audio,\
    \ and image function. `Qualcomm` `Snapdragons` powers some of your most popular\
    \ smartphones in the market today. Keep a close eye on `Qualcomm` if you are a\
    \ fan of the smartphone technology for new exciting AI smartphone features.\n\n\
    ## Nvidia\n`Nvidia` is perhaps one of the longest established AI companies and\
    \ still plays a crucial role today. `Nvidia`'s graphics are the be-all and end-all\
    \ for machine learning and artificial intelligence. The company is active in healthcare,\
    \ higher education, retail, and robotics. The company is developing AI technologies\
    \ that will be integrated into every level of vehicle manufacturing and autonomous\
    \ driving.\n\n## Microsoft\n`Microsoft` is involved in Artificial intelligence\
    \ on both the consumer and business side. `Cortana`, `Microsoft`'s AI, digital\
    \ assistant, is in direct competition with `Amazon`'s `Alexa`, `Apple’s `Siri`,\
    \ and `Google`'s digital assistant . The Artificial intelligence features use\
    \ the company's `Azure Cloud` service to provide chatbots and machine learning\
    \ to some of the biggest names in the business. `Microsoft` has also purchased\
    \ several AI companies in 2018 alone.\n\n## Intel\n`Intel` has been on a shopping\
    \ spree for several artificial intelligence companies. `Intel` has acquired `Nervana`\
    \ and `Movidius` and several smaller A.I. startups in the recent past. `Nervana`\
    \ enables companies to develop specific deep learning software while `Movidius`\
    \ was founded to bring AI application devices with deficient performance. `Intel`\
    \ has also partnered with `Microsoft` to provide AI Acceleration for the `Bing`\
    \ search engine.\n\n## IBM\nThe company has been active in AI ever since the 1950s.\
    \ It is one of the pioneer companies of artificial intelligence and is still active\
    \ up to date. With `Watson`, `IBM` has come up with a machine learning platform\
    \ that can integrate artificial intelligence into business processes such as building\
    \ a chatbot for customer support. `IBM`'s clients include big companies like `KPMG`,\
    \ `Four Auditor` and Brazil's bank, `Bradesco` .\n\n## HiSilicon\n`HiSilicon`\
    \ is the manufacturer of `Huawei`'s `Kirin 980` chip which was unveiled at IFA\
    \ 2018 in Berlin. `Karin 980` has significantly enhanced the second generation\
    \ of the world's first Artificial Intelligence smartphone chip. The chip can do\
    \ things like face recognition, intelligence translation, and image segmentation\
    \ at a very high speed. The chip has led to the development of many other smartphone\
    \ chips by its competitors.\n\n## Google\nThis is one of the largest and most\
    \ important AI company. Over the years, `Google` has been acquiring several AI\
    \ startups at crazy speeds. It has also created over 12 new artificial intelligence\
    \ companies in the recent past. `Google` acquired `DeepMind` for a sum of $400\
    \ million. `DeepMind` is the board game playing champion. The company is also\
    \ funding the ongoing `Tensor AI` chip project for `Machine Learning` on the device.\
    \ The company hopes to evolve from a mobile-first to an AI-first world in the\
    \ computer industry.\n\n## Facebook\n`Facebook` has allocated immense resources\
    \ in artificial intelligence, perhaps in recognition of how AI technology will\
    \ play a critical role in the future world of business. `Facebook`s AI research\
    \ group is known as `FAIR`, has been hard at work to advance the field of Machine\
    \ Intelligence and in developing new technologies to provide people with better\
    \ ways to communicate. The company also worked with two AIs known as `Alice` and\
    \ `Bob` among others, but the project was terminated prematurely because of a\
    \ technical malfunctioning that enables the couple to communicate in their secret\
    \ language.\n\n## DJI\nThis is perhaps one of the most famous Chinese artificial\
    \ intelligence companies. The company is currently valued at 15 billion dollars,\
    \ with 70 percent market share in the global drone market. The company is increasingly\
    \ entering the lucrative autonomous vehicles and robotics markets with the latest\
    \ AI and image recognition to avoid objects while in flight. `DJI` has also recently\
    \ partnered with `Microsoft` for drone project.\n\n## Banjo\nThe company was started\
    \ soon after Marathon in 2013. The company uses AI to search social media to identify\
    \ real-time events and situations are critical for emergency services and other\
    \ organizations. The company has attracted tremendous investment including `SoftBank`,\
    \ the Japanese telecommunication giant.\n\n## Apple\n`Apple` sees artificial intelligence\
    \ as a critical part of its future. Consequently, the company has been busy acquiring\
    \ AI startups in recent years. The company has developed products such as `Siri`\
    \ and the company's new `ML`, which `iOS` developers made to create straightforward\
    \ courses.\n\n## Viz.ai\nThe company aims at reducing the number of stroke victims\
    \ who don't receive the right treatment in time. Its software cross-references\
    \ images of patient's brain with database and can alert specialists in minutes\
    \ to signs that may have been missed. The product is already in use in major hospitals\
    \ such as `Mount Sinai` in New York and Health System in Denver.\n\n## Deep \n\
    The company has developed an AI product that helps researchers find the specific\
    \ conditions and traits. The system's language understanding engine has been trained\
    \ to infer some situations in the states and across the globe.\n\n## Armorblox\n\
    `Armorblox` launched into the cybersecurity market two years ago. It aims to protect\
    \ customers from socially engineered attacks like phishing emails which takes\
    \ natural language processing which allows machines to learn and understand context\
    \ and automatically flags possible attempts or accidental disclosures.\n\n## DefinedCrowd\n\
    `DefinedCrowd` taps human contributors to build bespoke datasets for clients through\
    \ a platform called `Neevo` and assigns them tasks like labeling images or recording\
    \ audios, hastening their work with Machine Learning where possible.\n\n## May\
    \ Mobility\n`May Mobility` is taking on the self-driving challenge with a factor\
    \ that is more predictable than cars. They have developed autonomous shuttles.\
    \ The company's software has powered services in Providence Rhode Island and Columbus\
    \ Ohio where you can get a scenic tour of the city.\n\n## Artificial Intelligence\
    \ Startup Companies Building Your Smarter Tomorrow\nIt is not only the big companies\
    \ who infusing their products and services with artificial intelligence. Other\
    \ smaller companies are at work, developing their technology and services. And,\
    \ well, they are doing a remarkable job! Here is a list of intelligence startup\
    \ companies you may not know today, but will definitely define your tomorrow in\
    \ a big way:\n\n### Tempus\nThe company headquartered in Chicago Illinois majorly\
    \ focuses on health tech, biotech, and big data. `Tempus` uses A.I. to gather\
    \ and analyze massive pools of clinical data at scale. The company uses AI to\
    \ provide precision medicine that personalizes and optimizes treatments to each\
    \ individual's specific health needs. It relies on the patient's available data,\
    \ such as genetic makeup and history to diagnose and treat. The company is currently\
    \ using AI to create breakthroughs in cancer research.\n\n### DataRobot\nThe company\
    \ is headquartered in Boston, Massachusetts. The company provides data scientists\
    \ with a platform for building and deploying Machine Learning models. The software\
    \ helps companies solve challenges by finding the best predictive model for their\
    \ data. The company's software is used in healthcare, manufacturing, insurance,\
    \ FinTech, and sports analytics.\n\n### Narrative Science\nThe company is headquartered\
    \ in Chicago Illinois. Natural science creates `Natural Language Generation (NLG)`\
    \ technology that can translate data into stories. By highlighting only the most\
    \ relevant and exciting information, businesses can make quicker decisions regardless\
    \ of staff experience with data or analytics.\n\n### Cognitive Scale\nThe company\
    \ from Austin Texas focuses on software and Cloud. `Cognitive Scale` builds augmented\
    \ intelligence for the healthcare, insurance, financial services, and digital\
    \ commerce industries. Its technology helps businesses increase customer acquisition\
    \ and engagement while improving processes like billing and claims. `Cognitive\
    \ Scale`'s products are used by big companies like `JP Morgan`, `NBC`, `Chase`,\
    \ and `Macy's`.\n\n### AlphaSense\n`AlphaSense` concentrates its model in FinTech.\
    \ It is an AI-powered search engine designed to help investment firms, banks,\
    \ and Fortune 500 companies find essential information within a large pool of\
    \ scripts, filings, news, and research. The technology uses Artificial Intelligence\
    \ to expand keyword searches for the relevant content.\n\n### Clarifai\nThis software\
    \ company `Clarifai` headquarters in New York is is an image recognition platform\
    \ that helps users to organize, curate, filter, and search their popular media.\
    \ The platform allows images and videos to be tagged, teaching the intelligent\
    \ technology to learn which objects are to be displayed in a piece of media.\n\
    \n### Neurala\n`Neurala` is developing ‘The Neurala Brain', a deep learning neural\
    \ network software that makes devices like cameras, phones, and drones smarter\
    \ and easier to use. The company's product is currently used on more than a million\
    \ devices across the globe. Big companies and organizations such as `NASA`, `Motorola`,\
    \ and `Huawei` are also using this technology.\n\n### NuTonomy\nThe company focuses\
    \ on developing applications for the automotive and transportation industries.\
    \ With a deisssion of providing safe and efficient driverless vehicles, the company\
    \ is developing software that powers autonomous cars in cities around the world.\
    \ The company uses AI to combine mapping, perception, control, and decision making\
    \ into software designed to eliminate accidents.\n\n### Sift Science\n`Sift Science`\
    \ provides multi management services all in one platform. `Sift` uses thousands\
    \ of data points from around the web to train in detecting fraud. The company's\
    \ product is used by leading companies such as `Twitter`, `Airbnb`, and `Zillow`.\n\
    \n### Zebra medical vision\nThe company `Zebra` has developed software for radiology\
    \ and medical imaging which enhanced diagnostic abilities while maximizing focus\
    \ on patient care. `Zebra` works with millions of clinical records to identify\
    \ high-risk patients the earliest and help medical professionals identify symptoms.\n\
    \n### Sherpa\n`Sherpa` is a virtual assistant powered by predictive intelligence.\
    \ `Sherpa` integrates with the user's entire web of devices, continually learning\
    \ and analyzing to keep the information updated. The company is also partnered\
    \ with Anthem to let members see for free.\n\n### OpenAI\n`OpenAI` is a non-profit\
    \ research company with a mission to create safe artificial intelligence (AGI).\
    \ `AGI` aims at creating machines similar to human beings. To advance AI safely\
    \ and responsibly, the company has received sponsorship from big companies like\
    \ `Microsoft` and `Amazon`.\n\n### Tamr\nThe data management company was born\
    \ out of MIT research project to apply `Machine Learning` to clean and organize\
    \ dirty data that is incomplete or inconsistent. `Tamr`'s system identifies sources\
    \ of data across the company that is useful together, like `Toyota`, `GSK`, and\
    \ `GE`.\n\n### Bossa Nova Robotics\nThe startup `Bossa Nova Robotics` has rolled\
    \ out slow moving robots to `Walmart`. The robots help keep shelves well-stocked.\
    \ Its systems read price labels for discrepancies and find gaps on shelves.\n\n\
    ### Pymetrics\n`Pymetrics` online recruiting platform helps companies find their\
    \ right employees by looking beyond experiences and skills on their resume. It\
    \ has over 80 enterprise customers including `LinkedIn`, `Accenture`, `MasterCard`,\
    \ and `Unilever`. The companies use the platform to have a set of assessments\
    \ for different roles. `Pymetrics` gleans emotional and cognitive traits and increases\
    \ diversity in a big way.\n\n### K health\nThe company `K health` has developed\
    \ software that enables you to access medical services without having to step\
    \ into any hospital. The company's app draws on more than 2 billion anonymized\
    \ medical records sending subtle patterns in data to give users personalized health\
    \ advice. The company is also partnered with insurance company `Anthem`.\n\n##\
    \ Ways to Invest in Artificial Intelligence\nArtificial intelligence is making\
    \ serious inroads in the investment world. From funds to stocks to money managers,\
    \ AI is infiltrating the investment landscape in ways no one imagined. What makes\
    \ AI more attractive to potential investors is the fact that AI is touching all\
    \ modern industries, including finance, national security, healthcare, criminal\
    \ justice, transportation, and many more.\n\n### Invest in Low-Level AI Funds\n\
    There are a wide range of exchange-traded funds for you to choose from. You can\
    \ pick a fund with low fees because this means that more of your money will go\
    \ to investment rather than to management. Generally, one-year-old `iShares Evolved\
    \ U.S. Technology` levies a 0.18% expense ratio and uses a proprietary algorithm\
    \ to select technology shares. You can get a return of 23% from your investment\
    \ in a year which is more than double the 10.77% category average. For more AI\
    \ options, `iShares` offers these low-fee funds: Evolved U.S. Consumer Staples\
    \ ETF`, `iShares evolved discretionary spending ETF`, `iShares Evolved U.S. Financial\
    \ ETF` and `iShares Evolved U.S. Media and Entertainment ETF`.\n\n### Invest in\
    \ AI Top Stocks\nIf you prefer investing in stocks and you want to grow your A.I.\
    \ stock portfolio, then consider investing from these firms:\n* `Micron Technology`:\
    \ a memory chip manufacturer which is likely to benefit from the demand for increased\
    \ computing power .\n* `Nvidia corp` - this is another chip manufacturer with\
    \ a bright future. The company has been trending lately and is expected to post\
    \ positive results over the coming years.\n* `Baidu`: this is a massive Chinese\
    \ company which is investing heavily in AI with about 1.4 billion Chinese citizens,\
    \ `Baidu` can capture a tremendous amount of `machine learning` data to both use\
    \ and sell. The company promises good returns with the Chinese government deploying\
    \ AI nationwide.\n\n### Invest in Funds that Focus on Robotics\nStock picking\
    \ is not easy. You may have a challenge picking the losers and winners. If you\
    \ want to avoid this risk associated with stock picking, then invest in a fund.\
    \ Investing in funds spreads the risks around. Robotics is a field of robots that\
    \ are trained to perform as humans. It is a clear example of A.I. in practice.\
    \ There are two popular robotics funds you can invest in: `iShares Robotic and\
    \ Artificial Intelligence ETF(IRBO)` and `ROBO Global Robotics and Automated Index\
    \ ETF (ROBO)`. `ROBO` has returned 16.7% to date while `IRBO` returned 19%.\n\n\
    ### Invest in AI Customized Solutions\nBig companies are now using AI to understand\
    \ and meet their customers better. Such companies use data and AI to analyze shopping\
    \ and browsing patterns. For example, `McDonald’s` has embraced solution and technology\
    \ with ordering and delivery services. You can invest in such customized solutions\
    \ using funds like `Wefunder`, `Seed`, and `Angels`.\n\n### Invest in AI Startups\n\
    Hundreds of new startups focusing on AI have sprung up recently. While shares\
    \ of these companies aren't publicly traded yet, you can still invest in them\
    \ using funds like `Wefunder`, `Seed`, and `Angels`.\n\n### Invest in Artificial\
    \ Intelligence ETFs\nMore AI-based ETFs are being developed, but two ETFs which\
    \ can help you get exposure at the moment:\n* `Global Robotics and Artificial\
    \ Intelligence ETF (BOTZ)`\n* `Nasdaq Artificial Intelligence and Robotics ETF\
    \ (ROBT)`\n\n### The Top Intelligence Stocks for Investment\nThere are a few companies\
    \ working on getting intelligence more involved. If you prefer to invest in stocks,\
    \ then these companies are projected to offer handsome returns.\n\n## How to Create\
    \ an AI Startup\nArtificial intelligence is the craze now. If you are wondering\
    \ how you can build your own AI startup, then here are some brief steps on how\
    \ you can get started:\n\n1. **Pick a Topic You Are Interested In**: You need\
    \ to select a topic of interest to you to stay motivated and involved in the learning\
    \ process. Focus on an existing problem and look at the solution. If you are not\
    \ solving a problem that customers are willing to pay for, then your startup is\
    \ nowhere. Before you go far, test whether or not people are willing to pay for\
    \ what you are planning to build.\n2. **Play the Data Gathering/AI building a\
    \ Game**: Once you are assured of ready customers for your product, then build\
    \ the first generation of your AI. You need to gather as much data as possible\
    \ touching on your pet project, then curate it to make sure it is useful then\
    \ design a model and train it. You need to note that the process of data gathering,\
    \ curating, and training is the most challenging part of your project. Training\
    \ a model is very demanding and time-consuming. You will spend a bulk of your\
    \ problem-solving efforts on gathering and understanding data.\n3. **Build your\
    \ Product**: At this point, you should be having a working AI. You need to improve\
    \ your AI capabilities to make it user-friendly. This means you have to package\
    \ your AI into a product which the market can respond to positively. Your product\
    \ should have a user face with a range of capabilities. Your product must also\
    \ be able to efficiently solve the problem it was created to do, within a short\
    \ time and in an affordable way.\n4. **Develop a Means for Improving Your AI**:\
    \ Once launch your new startup, you need to continue gathering more data that\
    \ was not available for you when you were training your AI. You then use this\
    \ data to improve your AI to improve its accuracy. Determine the number of times\
    \ you will train your AI in a given period.\n5. **Finally, in case you are having\
    \ any trouble building your startup, consider enrolling in the online courses\
    \ such as**:\n    * `Learn with Google`: this is a project launched by `Google`\
    \ to help you understand what AI is and how it works. It has a machine learning\
    \ course for beginners such as `GOOGLE's TensorFlow`.\n    * `Stanford University\
    \ Machine Learning`: the course is available on `Courser`. The course can be offered\
    \ for free, or you pay a fee if you want a certificate. The course will familiarize\
    \ you with examples of AI-driven technologies. You also learn the basics of software\
    \ engineering.\n    * `Nvidia-Fundamentals of Deep Learning for Computer Vision`:\
    \ computer vision is a discipline that focuses on creating computers capable of\
    \ analyzing the visual information as the human brain does. The course covers\
    \ the necessary technical fundamentals along with practical applications of object\
    \ classification and object recognition. You will also learn how to build your\
    \ neural network.\n"
  trans: "\n\n# 第 4 章：人工智能关键领军者与极具的初创公司\n\n“如今作为初创公司开发实体设备要困难得多。” — Marc Andreessen\
    \ ![](img/Image00006.jpg)\n\n人工智能正在飞速发展。它现在正从农业到通信的所有行业技术世界中发挥着至关重要的作用。从 `Google`\
    \ 到 `Apple` 再到 `Microsoft`，每一家大型科技公司都投入了大量资源致力于人工智能的突破。每家公司现在都知道，为了保持竞争力，你的故事中必须有\
    \ `Machine Learning`（机器学习）。几家私营公司在美国和全球人工智能领域拥有着巨大的权力和影响力。这些公司正在以意义的方式使用这项技术，并成功地展示了其实业务潜力。以下是一些有能力和资源利用人工智能技术塑造你未来的巨头列表：\n\
    \n## Twitter\n`Twitter` 投入了大量资源进入人工智能学习领域。该公司已经相继收购了四家人工智能公司。其中最著名的是 `Magic Pony`。该公司以\
    \ 1.5 亿美元的巨价收购了 `Magic Pony`。这家人工智能公司开发了用于网页和移动设备视觉处理的 `Machine Learning` 方法，`Twitter`\
    \ 将利用此在不久的未来改进其在你时间线中推荐特定推文的系统。\n\n## SenseTime\n人工智能公司 `SenseTime` 已经拥有大客户，其中包括中国政府。该公司正在向中国政府提供人脸识别技术以追踪其公民。这项技术被誉为最佳，在人脸识别方面优于\
    \ `Google` 和 `Facebook` 产品。目前，`SenseTime` 正在集中资源开发自动驾驶技术。\n\n## Qualcomm\n`Qualcomm`\
    \ 是一家致力于人工智能的芯片制造公司。人工智能在其开发的 855 个移动平台中起着至关重要的作用。该芯片使用信号处理器处理 AI 语音、音频和图像功能。`Qualcomm`\
    \ 的 `Snapdragon`（骁龙）驱动了今天市场上一些最受欢迎的智能手机。如果你是手机技术爱好者，想要体验新的 AI 手机功能，请密切关注 `Qualcomm`。\n\
    \n## Nvidia\n`Nvidia` 也许是成立最久的人工智能公司之一，今天仍然起着至关重要的作用。`Nvidia` 的图形是机器学习和人工智能的核心。该公司在医疗、高等教育、零售和机器人领域非常活跃。该公司正在开发将集成到车辆制造和自动驾驶每个层面的\
    \ AI 技术。\n\n## Microsoft\n`Microsoft` 在消费者和业务端都参与了人工智能。`Microsoft` 的 AI 数字助手 `Cortana`\
    \ 与 `Amazon` 的 `Alexa`、`Apple` 的 `Siri` 以及 `Google` 的数字助手直接竞争。人工智能功能利用公司的 `Azure\
    \ Cloud` 服务为业务界一些最大的名字提供聊天机器人和机器学习。`Microsoft` 仅在 2018 年就购买了数家 AI 公司。\n\n## Intel\n\
    `Intel` 一直对多家人工智能公司进行大采购。在近期，`Intel` 收购了 `Nervana`、`Movidius` 以及几家较小的 AI 初创公司。`Nervana`\
    \ 使公司能够开发特定的深度学习软件，而 `Movidius` 的创立是为了带来性能不足的 AI 应用设备。`Intel` 还与 `Microsoft` 合作，为\
    \ `Bing` 搜索引擎提供 AI 加速。\n\n## IBM\n该公司自 20 世纪 50 年代以来一直在 AI 领域活跃。它是人工智能的先驱公司之一，至今仍然活跃。通过\
    \ `Watson`，`IBM` 开发了一个机器学习平台，可以将人工智能集成到业务流程中，例如为客户支持构建聊天机器人。`IBM` 的客户包括 `KPMG`、`Four\
    \ Auditor` 以及巴西银行 `Bradesco` 等大公司。\n\n## HiSilicon\n`HiSilicon` 是华为 `Kirin 980`\
    \ 芯片的制造商，该芯片在 2018 年柏林 IFA 上发布。`Karin 980` 显著增强了全球首款人工智能手机芯片的第二代。该芯片可以高速处理人脸识别、智能翻译和图像分割等任务。该芯片引发了竞争对手开发许多其他手机芯片。\n\
    \n## Google\n这是最大的 AI 公司之一。多年来，`Google` 一直以疯狂的速度收购几家 AI 初创公司。在近期，它还创建了 12 多家新的人工智能公司。`Google`\
    \ 以 4 亿美元收购了 `DeepMind`。`DeepMind` 是棋盘游戏冠军。该公司还在资助正在进行的设备端机器学习 `Tensor AI` 芯片项目。该公司希望在计算机行业进化从“移动优先”转向“AI\
    \ 优先”的世界。\n\n## Facebook\n`Facebook` 在人工智能领域分配了巨大资源，也许是意识到了 AI 技术将在未来的业务世界中发挥至关重要的作用。`Facebook`\
    \ 的 AI 研究小组被称为 `FAIR`，一直致力于推进机器智能领域，并开发新技术为人们提供更好的沟通方式。该公司还与两个名为 `Alice` 和 `Bob`\
    \ 的 AI 合作，但该项目由于技术故障过早终止，该故障使这对能够使用秘密语言进行通信。\n\n## DJI\n这可能是最著名的中国人工智能公司之一。该公司目前估值为\
    \ 150 亿美元，在全球无人机市场占率为 70%。该公司利用最新的 AI 和图像识别来规避飞行中的物体，正日益进入利润丰厚的汽车和机器人市场。`DJI`\
    \ 最近还与 `Microsoft` 合作无人机项目。\n\n## Banjo\n该公司成立于 2013 年 `Marathon` 之后。该公司使用 AI\
    \ 搜索社交媒体以识别实时事件和情况，这对于紧急服务至关重要。该公司吸引了包括电信巨头 `SoftBank` 在内的投资。\n\n## Apple\n`Apple`\
    \ 将人工智能视为未来的关键部分，近年来一直在收购 AI 初创公司。`Apple` 开发了如 `siri` 等产品，`iOS` 开发者创建了简单的课程。\n\
    \n## Viz.ai\n该公司旨在减少未能及时获得正确治疗的中风患者人数。其软件交叉引用患者的图像和数据库，并在几分钟内提醒专家可能被遗漏的迹象。该产品已在纽约的\
    \ `Mount Sinai` 和丹佛 Health System 使用。\n\n## Deep\n该公司开发了一项 AI 产品帮助研究人员寻找特定状况和特征。该公司目前正在使用\
    \ AI 在癌症研究方面取得突破。\n\n## Armorblox\n`Armorblox` 两年前进入网络安全市场。它利用自然语言处理允许机器学习并理解上下文，保护客户免受网络钓鱼邮件等社交工程攻击。\n\
    \n## DefinedCrowd\n`DefinedCrowd` 通过一个名为 `Neevo` 的平台为贡献者构建定制数据集，利用 `Machine Learning`\
    \ 完成标记图像或录制音频等任务。\n\n## May Mobility\n`May Mobility` 正在应对自动驾驶挑战，一个比汽车更具预测性的因素。他们开发了自动驾驶穿梭车。该公司的软件在罗德岛州和俄亥俄州的城市运行，你可以获得城市的观览。\n\
    \n## Artificial Intelligence Startup Companies Building Your Smarter Tomorrow\n\
    不仅有那些将产品和服务注入人工智能的大公司，其他较小的公司也在工作，开发他们的技术和服务。而且，他们工作得非常出色！以下是一些你可能不知道但将定义你未来的人工智能初创公司列表：\n\
    \n### Tempus\n总部位于芝加哥。该公司主要关注健康科技、生物技术和大数据。`Tempus` 使用 AI 收集并分析大规模临床数据。该公司依赖患者的可用数据（如基因组成和历史）来进行诊断和治疗，使用\
    \ AI 提供针对每个个人健康需求的精准医疗。\n\n### DataRobot\n该公司总部位于马萨诸塞州波士顿。该公司为数据科学家提供构建和部署机器学习模型的平台。软件帮助公司通过寻找最佳预测模型来解决挑战。该软件用于医疗保健、制造、保险和体育分析。\n\
    \n### Narrative Science\n该公司总部位于芝加哥。Natural science 创建了自然语言生成 (NLG) 技术，可以将数据翻译成故事。通过突出最相关和令人兴奋的信息，企业可以更快做出决策，无论是否有数据或分析经验。\n\
    \n### Cognitive Scale\n这家来自德克萨斯州的公司专注于软件和云。`Cognitive Scale` 为医疗保健、保险、金融服务和数字商务行业构建增强智能。其技术帮助企业增加客户获取和参与度，同时改进账单和索赔等流程。`Cognitive\
    \ Scale` 的产品被 `JP Morgan`、`NBC`、`Chase` 和 `Macy's` 等大公司使用。\n\n### AlphaSense\n\
    `AlphaSense` 专注于金融科技。它是一个由 AI 驱动的搜索引擎，旨在帮助投资公司、银行和财富 500 强公司在大量的脚本、文件、新闻和研究中寻找关键信息。该技术使用人工智能扩展相关内容的关键词搜索。\n\
    \n### Clarifai\n这家总部位于纽约的软件公司 `Clarifai` 是一个图像识别平台，帮助用户组织、策划、过滤和搜索他们的媒体。该平台允许对图像和视频进行标记，教智能技术学习媒体文件中应该显示哪些物体。\n\
    \n### Neurala\n`Neurala` 正在开发“Neurala Brain”，这是一种深度学习神经网络软件，使相机、手机和无人机等设备更智能、更容易使用。该公司的产品目前在全球超过百万台设备上使用。`NASA`、`Motorola`\
    \ 和华为等大公司和组织也在使用这项技术。\n\n### NuTonomy\n该公司专注于开发汽车和运输行业的应用程序。凭借提供安全高效无人驾驶车辆的决定，该公司正在开发驱动全球城市自动驾驶汽车的软件。该公司使用\
    \ AI 将映射、感知、控制和决策集成到旨在消除事故的软件中。\n\n### Sift Science\n`Sift Science` 在一个平台上提供多管理服务。`Sift`\
    \ 使用来自网络的数千个数据点来训练检测欺诈。该公司的产品被 `Twitter`、`Airbnb` 和 `Zillow` 等领先公司使用。\n\n### Zebra\
    \ medical vision\n`Zebra` 公司开发了放射科和医学影像软件，增强了诊断能力，同时极大化了对患者护理的关注。`Zebra` 与数百万临床记录合作，尽早识别高风险患者并帮助医疗专业人员识别症状。\n\
    \n### Sherpa\n`Sherpa` 是由预测智能驱动的虚拟助手。`Sherpa` 与用户的整个设备集成，不断学习和分析以保持信息更新。该公司与 `Anthem`\
    \ 合作让成员免费查看。\n\n### OpenAI\n`OpenAI` 是一家非营利研究公司，使命是创建通用人工智能 (AGI)。`AGI` 旨在创建与人类类似的机器。为了安全且负责任地推进人工智能，该公司获得了\
    \ `Microsoft` 和 `Amazon` 的赞助。\n\n### Tamr\n数据管理公司诞生于 MIT 研究项目。`Tamr` 运用机器学习来清理和组织不完整或不一致的数据。`Tamr`\
    \ 的系统识别跨公司的数据源，这对 `Toyota`、`GSK` 和 `GE` 非常有用。\n\n### Bossa Nova Robotics\n初创公司\
    \ `Bossa Nova Robotics` 推出了慢速机器人以帮助 `Walmart` 保持货充足。其系统读取标签以发现差异并发现空白。\n\n###\
    \ Pymetrics\n`Pymetrics` 在线招聘平台通过查看简历之外经验和技能帮助公司找到合适的员工。它拥有 `LinkedIn`、`Accenture`、`MasterCard`\
    \ 和 `Unilever` 等企业。`Pymetrics` 使用平台评估情感和认知特征，增加了多样性。\n\n### K health\n`K health`\
    \ 公司开发了让你无需进入医院即可获得医疗服务的软件。该应用程序利用 20 亿条匿名医疗记录提供个性化建议。该公司与保险公司 `Anthem` 合作。\n\n\
    ## 投资人工智能的方式\n人工智能正在投资界取得长足进展。从基金到股票，AI 正在以人们想象的方式渗透投资领域，包括金融、国家安全、医疗、交通等。\n\n\
    ### 投资低水平 AI 基金\n有广泛的交易基金供你选择。你可以选择费用较低的基金，这意味着你的更多钱将用于投资而不是管理。`iShares Evolved\
    \ U.S. Technology` 收 0.18% 的费用率并使用专利算法选择技术。你可以从投资中获得 23% 的回报，高于平均水平 10.77%。对于更多\
    \ AI 选项，`iShares` 提供这些低费用基金：`evolved Consumer Staples`、`ved discretionary spending`、`evolved\
    \ Financial` 和 `ved Media and Entertainment`。\n\n### 投资 AI 热门股票\n如果你喜欢投资股票并希望增长你的\
    \ AI 股票组合，请考虑投资这些公司：\n*   `Micron Technology`：一家内存芯片制造商，可能受益于对计算能力的需求。\n*   `Nvidia\
    \ corp`：这是另一家拥有光明前景的芯片制造商。该公司最近一直处于趋势中，预计在未来几年发布良好业绩。\n*   `Baidu`：这是一个巨大的中国公司，在人工智能方面投入巨大。对于约\
    \ 14 亿中国公民，`Baidu` 可以获取大量的 `machine learning` 数据进行使用和销售。该公司在中国政府范围内部署 AI 并承诺良好的回报。\n\
    \n### 投资专注于机器人的基金\n选股并不容易。你可能面临挑选失败者和胜者的挑战。如果你想避免与选股相关的风险，请投资基金。投资基金可以分散风险。机器人是一个经过训练像人类一样工作的领域。它是人工智能实践的明确例子。有两个你可以投资的机器人基金：`iShares\
    \ Robotic and Artificial Intelligence ETF(IRBO)` 和 `ROBO Global Robotics and Automated\
    \ Index ETF (ROBO)`。`ROBO` 至今回报 16.7%，而 `IRBO` 回报 19%。\n\n### 投资 AI 定制解决方案\n大公司现在使用人工智能来更好地理解和满足他们的客户。此类公司使用数据和\
    \ AI 分析购物和浏览模式。例如，McDonald’s 已经接受了订单和交付服务的解决方案和技术。你可以使用 `Wefunder`、`Seed` 和 `Angels`\
    \ 等基金投资此类定制解决方案。\n\n### 投资 AI 初创公司\n近期涌出了数百专注于 AI 的新初创公司。虽然这些公司的股票尚未上市，但你仍然可以使用\
    \ `Wefunder`、`Seed` 和 `Angels` 等基金投资它们。\n\n### 投资人工智能 ETF\n更多的基于 AI 的 ETF 正在开发中，但目前可以帮助你接触的\
    \ ETF 有：\n*   `Global Robotics and Artificial Intelligence ETF (BOTZ)`\n*   `Nasdaq\
    \ Artificial Intelligence and Robotics ETF (ROBT)`\n\n### 投资的顶级智能股票\n有几公司致力于让智能更多参与。如果你喜欢投资股票，那么这些公司预计将提供丰厚的回报。\n\
    \n## 如何创建一个 AI 初创公司\n人工智能是现在的狂热。如果你在想如何建立你自己的 AI 初创公司，这里是一些如何开始的简要步骤：\n\n1.  **选择你感兴趣的话题**：你需要选择一个你感兴趣的话题，以保持动力并参与学习过程。关注现有问题并寻找解决方案。如果你没有解决客户愿意付费的问题，那么你的初创公司将无从谈起。在走得远之前，测试人们是否愿意为你计划构建的内容付费。\n\
    2.  **通过你感兴趣的话题收集数据/构建 AI**：一旦你的你的客户准备就绪，就构建你的第一代 AI。你需要尽可能收集关于你的项目的数据，并对其进行处理以确保有用。你需要注意，数据收集、处理和训练是项目中最挑战性的部分。训练模型非常耗费且耗时。你的大部分解决问题的精力放在收集和理解数据上。\n\
    3.  **构建你的产品**：到这时，你应该已经有一个可以工作的 AI。你需要改进你的 AI 能力使其易于使用。这意味着你要将 AI 封装成市场可以积极反应的产品。你的产品应该具有一系列功能。你的产品还能够以快捷且负担得起的方式解决创建的问题。\n\
    4.  **开发改进你 AI 的方法**：一旦启动新初创公司，你需要继续收集你在训练 AI 时无法获得的数据。然后你使用这些数据改进你的 AI 以提高其准确性。确定你在特定时间内训练\
    \ AI 的次数。\n5.  **最后，如果你在建立初创公司时遇到任何困难，考虑参加以下在线课程：\n    *   `Learn with Google`：这是由\
    \ `Google` 发起的项目，帮助你理解人工智能以及它是如何工作的。它有一门针对初学者的机器学习课程如 `GOOGLE's TensorFlow`。\n\
    \    *   `Stanford University Machine Learning`：该课程在 `Courser` 上。课程可以免费提供，如果你想要证书则需要付费。该课程将让你熟悉\
    \ AI 驱动技术的示例。你还学习了软件工程的基础。\n\n"
