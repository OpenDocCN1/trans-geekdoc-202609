    # Chapter 1: Understanding Artificial Intelligence


    “By far, the greatest danger of Artificial Intelligence is that people conclude
    too early that they understand it.” – Eliezer Yudkowsky


    ![](Image00002.jpg)


    It might not be possible to identify what part of modern society has not been
    affected or influenced by artificial intelligence (AI). Intelligence machines
    are influencing almost every facet of our lives, including business operations
    and our daily activities, with the aim of improving efficiencies. AI is so intertwined
    into everything we do that it is hard to imagine living without it . AI is the
    major influencer of the 4th Industrial Revolution disruptive changes; the changes
    that will probably challenge human ideas. It is transforming the way we interact
    and live in an accelerating manner, making our cities become smarter and helping
    us to manage our lives. Despite the popularity of AI and machine learning, the
    purpose, and details of the two concepts are not well understood. In this chapter,
    we are going to discuss the key concepts of artificial intelligence and machine
    learning.


    ## Defining Artificial Intelligence and Machine Learning


    As commonly defined, artificial intelligence is the ability of machines to make
    decisions and learn in a similar manner as humans. It is commonly known as a branch
    of computer science that deals with the simulation of behaviors of computer intelligence.
    Commonly abbreviated as AI, artificial intelligence refers to a computer system
    that can complete tasks that normally require the intelligence of humans, including
    recognition of speech, visual perception, decision-making, and language translations.
    This technology has influenced several consumer products and has promoted breakthroughs
    in physics and healthcare .


    Machine learning is a sub-branch of artificial intelligence, i.e., all machine
    learning are components of AI, but not all AI count as the latter. It refers to
    the component of computer science whose aim is to build and leverage existing
    algorithms in order to establish generalized models that offer patterns and accurate
    predictions. Such algorithms are usually based on mathematical and statistical
    optimization. Suppose that your goal is to identify the patterns of a phenomenon
    using historical data; you may use machine learning algorithms to group the data
    and analyze the cluster results. With a bit of analysis, machine learning helps
    in the generation of automatic clusters or categories over time.


    ## History of AI and Machine Learning


    Amidst the fact that artificial intelligence and machine learning have been around
    for centuries, their revelation was not possible until the late 1950s. A series
    of philosophers, scientists, and mathematicians attempted to explore the concept
    of AI, but it was not until World War II when Alan Turing, a British Polymath,
    suggested to people how to use available information to make decisions and solve
    problems. Alan was able to figure out and understand the `Enigma` code that was
    used by the armed forces in Germany to securely send messages. Together with his
    team, Alan invented the `Bombe` machine, which helped in deciphering the messages.
    Turing concluded that a machine that was able to converse with humans could be
    referred to as an “intelligent” object.


    In the early 1950s, John McCarthy, the top computer scientist in the US, organized
    a conference where the term, “Artificial Intelligence” was invented. Researchers
    across America became interested in understanding the concept of AI, thus exploring
    the subject. Both Herbert Simon and Allen Newell were very instrumental in promoting
    the field of AI that would later transform the world. In 1951, Ferranti Mark I,
    a unique machine, was able to use an algorithm successfully to analyze and master
    checkers. In turn, Simon and Newell invented an algorithm, commonly known as the
    `General Problem Solver`, to solve mathematical problems.


    Also, in the 1950s, John McCarthy developed the `LISP` programming language, which
    was considered a significant part of AI and machine learning. In the 1960s, the
    development of algorithms was emphasized by several researchers to address mathematical
    problems. In the same decade, computer scientists discovered `Machine Vision Learning`
    which could be used in controlling robots, and in 1972 the first intelligent robot,
    `WABOT-1`, was established in Japan.


    However, amidst the global effort to enhance AI applications, computer scientists
    realized that it was challenging to create intelligence in machines. In order
    for AI and machine learning to become successful, scientists needed an enormous
    amount of data. However, the computers that were available at the time were not
    well-developed to handle such magnitude of data. Corporations and governments
    lost faith in AI, and in the 1970s and 1990s, scientists experienced a shortage
    in the funding of AI research.


    In the 90s, several giant companies once again developed an interest in developing
    AI. The government of Japan unveiled the plans to come up with the 5th generation
    computers in order to advance machine learning. The enthusiasts of AI believed
    that computers would soon carry conversations, interpret photos, translate languages
    and reason like humans. In 1997, the `Deep Blue`, IBM’s computer, became the first
    to beat all computers in holding and interpreting information. Over time, the
    exponential gains in the processing powers and storage ability of computers enabled
    companies to store vast quantities of data. In the past 15 years, superpowers
    such as Google, Amazon, Baidu, and other companies have exploited AI and machine
    learning to a great commercial advantage .


    ## The Goals of AI


    The key goals of AI include:


    ### Knowledge Representation and Reasoning

    This is a field within AI that focuses on the implementation and design of computer
    representations, which are able to process information. AI aims to automate these
    types of reasoning through the codification of relationships or rules in a way
    that can be interpreted easily by the computer system. Some of the common uses
    of knowledge representation and reasoning include a natural-language user interface
    that aids communication between computers and humans and computer-aided diagnosis
    that assists physicians to interpret medical records in the form of images.


    ### Automated Planning and Scheduling

    This is another subcomponent of AI that deals with the production of automated
    action sequences that correspond to the measurements, which can be executed using
    AI systems. The goal of AI planning is to mechanize and automate the generation
    of any plan based on a set of actions as well as predetermined objectives and
    goals. One of the examples is `AI planning`.


    ### Natural Language Processing

    Another significant goal of AI is `Natural Language Processing`.


    ### Computer Vision

    Another goal of AI is `Computer Vision`.


    ### Robotics

    Another goal of AI is `Robotics`.


    ### Artificial General Intelligence

    The goal of AI is `Artificial General Intelligence`.


    ## Goals of Machine Learning


    The goals of machine learning include:


    ### Clustering

    Clustering refers to the unsupervised technique used to group data. The common
    algorithms used for this goal include `hierarchical clustering` and `K-means`.


    ### Supervised Classification (Two-Class and Multi-Class)

    Classification involves placing data into a pre-defined category. An example is
    `two-class classification`.


    ### Regression Analysis: Univariate and Multivariate

    As opposed to discrete classes, regression assigns a continuous response to observed
    data. The algorithms used to achieve this goal include `simple linear regression`,
    `forest`, `decision tree`, `artificial neural network`, `Poisson regression`,
    and `ordinal regression`.


    ### Detection of Anomaly

    Anomaly detection helps in identifying errors or malfunctions. Common algorithms
    used to achieve these goals are `principal component analysis` (PCA) or `support
    vector machine`.


    ### Recommendation Systems/Engine

    Recommendation engine refers to an information filtering system used to make recommendations.
    Common approaches include `collaborative filtering` and `content-based filtering`.


    ## The Relationship Between AI and Machine Learning


    Many times, researchers and students get confused in distinguishing between AI
    and machine learning. However, machine learning is particularly the study of computer
    algorithms that improve with experience.

    '
