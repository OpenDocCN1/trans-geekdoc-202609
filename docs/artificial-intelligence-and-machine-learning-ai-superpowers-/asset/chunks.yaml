    company has also partnered with an insurance company, Anthem to let members see
    how medical practitioners diagnose and treat people with similar symptoms for
    free. The software also enables you to have a live chat with the doctor, but for
    a fee. Ways to Invest in Artificial Intelligence Artificial intelligence is making
