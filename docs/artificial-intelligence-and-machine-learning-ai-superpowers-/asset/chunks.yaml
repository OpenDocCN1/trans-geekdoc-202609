    # 第二 2 章：人工智能 VS 人类智能


    “事实已显而易见，我们的技术已经超越了人人性。” — 阿伯特·爱因斯坦 ![](img/Image00003.jpg)


    人工智能（Artificial Intelligence）和自动化（Automation）是经常交替使用的术语。它们与编程、机器人或电子设备有关，这些使我们能够更高效、更成功地工作——无论是工业车辆装配还是发送一封跟进邮件。在任何情况下，它的含义都比这复杂得多。


    自动化的本质是制造硬件或软件，使其能够自动执行某些任务——无需人工干预。“人工智能”这一术语由约翰·马卡锡（John McCarthy）创立，意指一种制造明智机器的工程科学。基于计算机的智能与试图让机器或软件模仿并在从长远来看超越人类的行为和智能联系在一起。人类目前正朝着这种理想状况的方向发展：自动化机器收集数据——AI
    系统“理解”这些数据。我们面对的是两个完全不同的框架，它们完美地互为补充。


    ## 自动化


    自动化系统是在几秒钟内记录你分期付款情况的银行，也是组织向客户发送群发邮件的原因。它让你能够在下单后几小时内完成货物的发运和送达。


    自动化的单一目的是：给机器一个执行单调、重复性活动的机会，或者正如某些个人所说，“消除人类中的机器人化”。它为个人节省了时间，让他们能够集中于日益重要的、需要人类触感和判断的创新任务。最终产物是一个日益精进、务实的企业，以及一支生产力不断提高的劳动力队伍。一个顺从的先进机器人，它从不请假，也不休假，并始终如一地处理业务。组织如此轻易地采用自动化，并不令人意外。


    自动化机器由手动配置（如工作流程、编程边缘情况等）驱动——基本上是一台听从指令的士兵机器。自动化在未来几年内将逐渐影响工业革命。自动化的影响已经在某些行业中体现，某些国家受到的影响比其他国家更为严重。自动化的专门可能性在不同行业和活动之间存在差异。随着自动化创新（例如机器人技术和机器学习）在日常活动中承担着极其巨大的工作，它们对工作环境可能的影响已成为研究和公众关注的焦点。讨论倾向于一种二元论的推测游戏，即机器是否会取代工作。虽然自动化技术在未来几年内取代的职业很少，但它也将根据员工所涉及的工作类型，影响几乎所有员工的较高或更低水平。自动化目前正在跨越标准制造业，至少在技术可行性方面，具有改变某些领域的潜力，例如医疗和金融领域，这些领域包含了大量的事务处理工作。


    ### 理解自动化的潜力


    在论及自动化技术时，我们指的是通过调整现有的测试技术使特定任务自动化的可能性。换句话说，无论任何设备或活动的自动化是否可行，每个职业都由不同类型的职责和任务组成，每种任务都有波动的可行性。例如，零售业的工作包括收集或处理信息、与客户互动和联系以及布置产品展示等活动。


    技术可行性是自动化的必要前提条件；但并不是判断活动是否可以自动化的唯一指标。要评估的后续因素是创建和发送待自动化设备及产品的成本。与供给和劳动力因素相关的成本涉及另一个随后的因素：如果劳动力充足且大部分比自动化便宜，这种结果可能会成为反对自动化的决定性论点。另一个需要检查的因素是超越劳动力成本交换的优势；包括更高的产量、更高的质量和更少的错误。例如，行政或社会问题（机器在特定环境中的价值）也应进行衡量。例如，机器人可能会取代医疗医生的一些活动。但目前，这种可能实际发生的预期对于习惯于期待人类接触的患者来说，可能是令人不快的。


    自动化在某个行业或职业中萌生的可能性，反映了这些活动及其之间一种不易察觉的交换。即使机器最终接管了某个职业中几项人类职责的控制，这并不意味着该职业的终结。尽管与预期的不同，其他职业将会增长以填补这一空白。例如，在美国，20
    世纪 80 年代标准化条形码扫描仪及相关销售终端的大规模分发，使每家商店的劳动力成本降低了高达 4.8%，食品成本降低了 1.2%。它还赋能了各种进步，包括晋升机会的增加。无论如何，收银员也是必不可少的；事实上，在
    1980 年到 2013 年间，他们的工作需求以平均 2%的速度增长。


    ## 人机伙伴关系


    这一代最伟大的大脑，无论是特斯拉的埃隆·马斯克还是斯蒂芬·霍金，都反对人工智能。他们表达的方式完全符合那种反乌托邦的格言：“机器人和人工智能将拥有比我们进步的选择，创造出我们作为人类面临的最大风险。”此外，我们还有强有力的
    AI 支持者，他们认为 AI 将支持人类但不会控制或干预他们的生活。这是 AI 的总体目标：取得能够模拟人类言语、思考和行为的进步，而这些通常不会受到自然脆弱性（人会衰老死亡）的影响。此外，与大多数人一样，这意味着
    AI 在主要遵循指令方面非常糟糕。这并不是它的意图所在；它的目的是一直寻找模式（像人类一样），从经验中获益（像人类一样），并在情况下自主选择合适的反应（像人类一样）。这样一来，AI
    不是我或你的复制。它与创造一个比我们想象的更强大的系统联系在一起。


    驱动自动化系统和 AI 的是与人类非常相似的东西：数据。目前正在超越标准制造业的自动化，至少在技术可行性方面具有改变某些领域（例如医疗和金融，这些领域包含了大量的事务处理工作）的潜力。驱动自动化系统和
    AI 的是数据。这显然是由于许多因素的影响，可能会导致巨大的收入增长。自动化的业务表现更好；更好的业务效率，以及最重要的——准备好专注于创新和关键任务的劳动力。我们尚未准备好
    AI。我们正处于智能自动化的边缘。如果我们继续通过为其注入大量数据来实现智能自动化，我们可以创造出一个比我们想象的更强大的系统——作为人类和作为组织。如果我们想象
    2030 年的世界，人与机器之间的关系将重塑生活。机器将补充人类的能力并帮助他们实现更显著的效率。


    ### 未来伙伴关系


    人类长期以来一直与技术或机器紧密生活和工作——从打字机到智能手机的扩展。而且，由于软件、大数据和处理能力的巨大进步，我们进入了一个具有惊人结果的世界。我们将观察到人与机器关系的变化——表现为显著提高生产力、统一性和可能性。随着技术力量在五年内增加，我们对技术的依赖也会随之增加，产生一种共生关系。人类将带来诸如创造力和批判性思维等能力，而机器将在全球范围内带来速度、自动化和全新的效率。机器不会取代我们；相反，它们将使我们能够完成更多任务。


    ### 人类作为指挥


    人机合作使组织能够以新的、更有效的方式与代表和客户联系。例如，像`Cortana`这样的 AI 助手鼓励个人之间的互动。谷歌和亚马逊的助手可以集成到家庭、汽车和智能手机中，执行在线购物、播放音乐、预约美容以及提供定制时尚建议。2030
    年，我们将依赖机器来管理生活的更多部分。我们将成功转型数字指挥。技术将作为我们的延伸，帮助我们更好地管理日常活动。当 AI 助手处理基本请求时，人类代表可以专注于更复杂的问题，特别是那些需要额外支持的客户。


    ### 重新思考业务


    这种关系的影响远超我们的日常生活，进入业务管理。工作环境将在发现能力、管理资产和促进职业方面发生变革。到 2030 年，工作将不再是特定的，而是一个任务序列。智能分析、数据可视化和声誉引擎将人类的态度和技能变得可用，组织将寻求顶级人才并减少偏见。在任何方面，无论是寻找顶级人才、培训员工还是调用各种服务，深层次的人机关系都将是
    2030 年的变革力量。我们正在接近每个业务都由软件控制的技术时代。


    ### 新兴技术


    随随学习到 2030 年，获取新信息的能力将比目前的知识更有价值。员工不仅将有很多工作，而且任务和责任将与所学的截然不同。他们将获得有效执行工作所需的和技能。他们将经常即兴发挥，相互学习并开辟自己的道路。这些因素结合在一起，将真正挑战组织去“边做边学”。


    ### 人类辅助机器


    人类应该承担三个角色：我们应该训练机器执行特定任务；解释已完成的结果（特别是当结果不合或存疑时）；以及维护机器负责的使用（例如防止机器人伤害人类）。机器学习算法必须被教授如何执行预定的工作。因此，收集了大量的训练数据集以展示识别疾病的机器识别应用程序，以及用于帮助决策的推荐引擎。此外，AI
    框架必须学会如何最好地与人类交流。这些例子已经存在，例如教练被要求构建`Alexa`的性格，而苹果的`Siri`只有一点点鲁莽，因为这可能是客户对科技巨头苹果的预期。


    ### 解释


    AI 越来越多地通过透明程序（也称为黑箱问题）得出结论，AI 需要相关领域的专家来披露其行为模式。这些“解释者”在证明领域尤为重要，例如医学和法律，在这些领域，专业人士需要看到机器判断的步骤是如何导致事故的。此外，解释者正成为管理业务的必要条件——任何客户输出都可能被测试为不公正或有偏见。例如，欧盟最新的数据保护条例（`GDPR`）为客户提供了对任何基于设计的决策获得解释的权利。这解释了一个
    AI 将有助于扩大就业和法律问题的领域。专家认为，组织应该做出大约 75%的决策，并使用 AI“维护者”——确保 AI 系统运行安全且可靠的代表。AI 可以帮助我们的逻辑和能力，并提高创造力。


