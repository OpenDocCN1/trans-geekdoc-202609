    *   Regularly test security processes and systems.


    ## Information Security


    *   Maintain a policy that deals with information security.


    # Chapter 15


    # Backdoor Attacks


    A backdoor attack is a type of malware that bypasses the normal process of authentication
    to access a network. Consequently, remote access to resources in the application
    is granted. Once this is done, the perpetrator can issue system commands remotely
    and even update malware. Attackers achieve backdoor installation by taking advantage
    of any susceptible areas in a web application. After it is installed, it is difficult
    to detect since files are highly concealed in most cases. Web Server backdoor
    can be used for all kinds of malicious activities such as:


    *   Server hijacking

    *   Advanced persistent threat assaults

    *   Infecting web visitors

    *   Launching of DDoS attacks

    *   Data theft

    *   Website defacing


    Backdoors are commonly installed through remote file inclusion (RFI). This is
    an attack vendor that takes advantage of weaknesses in apps that reference external
    scripts dynamically. In an RFI situation, a backdoor A Trojan is downloaded from
    a remote host by the referencing function.


    Hackers usually look for targets using scanners; they identify websites with outdated
    or unpatched components that allow file injection. When a scanner is successful,
    it uses the susceptibility to install the backdoor into the underlying server.
    After it has been installed, the attacker can access it whenever he wants, even
    long after the vulnerability has been patched. In most cases, a backdoor Trojan
    injection is carried out in two steps to bypass security regulations that limit
    the upload of files exceeding a certain size. In the first step, a dropper is
    installed—this is a small file that is solely used to obtain the bigger file.
    The second step is then initiated, and it involves downloading and installing
    the backdoor script into the server.


    ## Backdoor Shell Removal: The Challenge


    Backdoors are not easy to weed out. Generally, detection is performed using a
    software scanner to identify known malware signatures in a system. This method
    is prone to error. Backdoor shells are hidden by using code obfuscation and alias
    names. In other cases, multiple layers of encryption are used. Detection is anything
    but simple because many applications are created on external frameworks (which
    use third-party plugins). Sometimes these plugins are laden with built-in backdoors
    or vulnerabilities. Scanners that depend on signature-based and heuristic rules
    are not efficient at identifying hidden codes in frameworks like these.


    Even after a scanner has detected a backdoor, it will be difficult to eliminate
    it from an application using typical mitigation tactics. This is especially true
    if the backdoor has a recurring presence in rewritable memory.


    ## Reducing Backdoor Shell Attacks with Imperva


    Imperva uses a combination of tried and tested methods to block backdoor installation,
    as well as detect and seclude any existing backdoor shells. The Imperva WAF (web
    application firewall) combines user-defined and default security rules to stop
    RFI attacks from infecting your application. This WAF is deployed at your network''s
    edge and blocks any malicious requests before they can interact with your app.
    If you already have a compromised web server, Imperva has a backdoor protection
    solution that will detect and eliminate shells from your system.


