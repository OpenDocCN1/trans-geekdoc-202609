    # Chapter 23


    # Ethical Hacking Tools


    ![image](d2d_images/chapter_title_below.png)


    The rise of automatic tools has seen a dramatic change in the world of penetration
    testing or ethical hacking. There are tools that are still being processed to
    help speed up the testing process. Ethical hacking provides a way for organizations
    to protect their systems and information. It is one of the best ways through which
    organizations can augment security professional skills. When ethical hacking is
    made a part of security measures, the company could reap tremendous benefits.
    Some of the tools commonly used in ethical hacking include: Nmap (Network Mapper)
    one of the best tools for hacking ever. It is used in a phase of ethical hacking
    known as port scanning. It was originally a command-line tool, but it was eventually
    modified for Unix- or Linux-based operating systems. Currently, Nmap has a Windows
    version. Nmap is a mapper for network security. It can discover hosts and services
    on a network and, consequently, develop a network map. There are several features
    offered by this software for the purpose of probing computer networks, detecting
    operating networks, and host discovery. It is script extensible and can, therefore,
    offer advanced detection of vulnerabilities and adapt to latency, congestion and
    other network conditions while scanning. Nessus is the most popular vulnerability
    scanner in the world. It was developed by tenable network security. Experts recommend
    it for non-enterprise use—it is also free. This scanner is very efficient and
    will find bugs on any network. Here are the vulnerabilities that can be detected
    by Nessus:


    ●  Different system vulnerabilities


    ●  Weak passwords—common and default


    ●  Misconfiguration and unpatched services


    Nikto web scanner scans and tests quite a number of web servers and identifies
    dangerous files or CGIs, outdated software, among other related issues. It can
    perform both generic and server-specific prints and checks by capturing cookies
    that have been received. This tool is free and open-source. It checks across 270
    servers for version-specific problems and finds default files and programs. These
    are some of the main features of Nikto:


    Open source tool


    Checks misconfigured files and plugins


    Identifies insecure files and programs


    Scans servers for versions that are outdated and other version-specific issues


    Scans web servers to find potentially dangerous files or more than 6400 CGIs


    Kismet is the best for wardriving or hacking wireless LAN and testing wireless
    networks. It identifies networks, gathers packets, and identifies hidden and non-beaconing
    networks using data traffic. Basically, Kismet is a wireless network detector
    and sniffer. It supports raw-monitoring mode and works in conjunction with other
    wireless cards.  The following are some of the basic characteristics of Kismet:


    ●  Sometimes applicable to Windows


    ●  Runs on Linux OS


    NetStumbler prevents wardriving. It works on Windows operating systems. It can
    detect three types of networks. It also has a newer version known as MiniStumbler.


    The following are uses of NetStumbler:


    ●  Detects unauthorized access points


    ●  Accesses strength of received signals


    ●  Determines cause of interference


    ●  Identifies Access Point (AP) network configuration


