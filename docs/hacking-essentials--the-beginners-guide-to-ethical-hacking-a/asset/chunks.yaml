- raw: 'Moreover, businesses are required to restrict access to the data of a cardholder
    and monitor all access to the network resources. When your business is PCI compliant,
    customers are assured that their information is safe. Besides, the reputational
    and monetary cost of noncompliance is enough to make any business treat data security
    with importance.  There are four levels of PCI compliance depending on the number
    of debit or credit card transactions per year. This classification determines
    what is required of an enterprise. Level 1: this is for merchants processing over
    6 million card transactions in a year. An annual internal audit is a must and
    it should be carried out by a PCI auditor. They must also submit to a PCI scan
    once a quarter by an ASV (Approved Scanning Vendor).  Level 2: this is for businesses
    processing between 1 million and 6 million card transactions in a year. An assessment
    using a Self-Assessment Questionnaire (SAQ) is required of them every once in
    a year. A PCI scan every quarter may also be necessary. Level 3: this is for businesses
    processing between 20,000 and 1 million transactions annually. A yearly assessment
    is a must, using the appropriate SAQ. They may be subject to a quarterly PCI scan.
    Level 4: this is for businesses processing not more than 20,000 card transactions
    in a year. An annual SAQ assessment is required. They may also be subject to a
    quarterly PCI scan. There are 12 requirements by the PCI SSC that should be adhered
    to when dealing with cardholder data. They are distributed over six larger goals.
    An enterprise must fulfill them to become compliant.


    Secure Network


    ●  A firewall configuration must put in place and maintained.


    ●  System passwords should not be vendor-supplied but original.


    Secure Cardholder Data


    ●  Protect stored cardholder data.


    ●  Encrypt transmissions of cardholder information across all public networks.


    Vulnerability Management


    ●  Use anti-virus software and update it regularly.


    ●  Develop and maintain secure applications and systems.


    Access Control


    ●  Access to cardholder data must be restricted.


    ●  Staff with computer access should be given a unique ID.


    ●  Restriction of physical access to the data of a cardholder.


    Network Monitoring and Testing


    ●  Monitor access to network resources and cardholder data.


    ●  Regularly test security processes and systems.


    Information Security


    ●  Maintain a policy that deals with information security. 


