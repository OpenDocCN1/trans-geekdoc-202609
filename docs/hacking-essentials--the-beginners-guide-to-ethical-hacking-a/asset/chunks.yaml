- raw: 'Sometimes, rootkits are embedded in trustworthy software and users install
    them unknowingly. When the software is granted administrator permission to install
    on the system, the rootkit also installs discreetly.


    Blended Threat


    Rootkits do not have the ability to infect computers on their own. Perpetrators
    may create blended threats to take advantage of various susceptibilities and compromise
    a system. In many cases, this is accomplished by merging the rootkit with a loader
    and a dropper. Dropper: this is a file or program that the hacker uses to install
    a rootkit on the victim’s computer. There are multiple methods of distributing
    a dropper including through a brute force attack or a social engineering attack.
    Loader: once the dropper program is initiated by the user (by executing or opening
    a file), a malicious code (what is known as a loader) launches. Rootkits come
    in multiple types including: Application or user-mode rootkit: these ones function
    at the application layer. They can change API and application behavior. Application
    rootkits can be easily detected since antivirus programs operate at the same layer.
    Kernel-mode: they are deployed within the kernel module of an operating system.
    Here, they can control all kinds of system processes. It is difficult to detect
    them. Bootkits: these ones take over the target system by infecting the MBR (master
    boot record). They enable malware to open before the operating system loads. Firmware
    rootkits: they infiltrate the system running a device such as system BIOS, hard
    drives, network cards, and routers. Rootkit hypervisors: they take over a machine
    by exploiting hardware virtualization features.


    Anti-Rootkit Measures


    To protect your system from rootkits, you need to scan for any existing malware
    in addition to preventing any new programs from being installed. Rootkit scanners:
    these are programs that parse a system to remove active rootkits. These scanners
    may not help much with some rootkits and you should combine several scanners.
    Preemptive blocking: this involves training users in your organizations to avoid
    opening or downloading files from suspicious sources.


