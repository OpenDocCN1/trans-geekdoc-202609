    # Chapter 17


    # Malware Types


    ![image](d2d_images/chapter_title_below.png)


    Malware is malicious software dispatched by a perpetrator to infect an organization’s
    network or individual computers. It exploits vulnerabilities in a target’s system
    such as a bug. There are many types of malware and each has its area of focus
    and application. The seven most common include the following. When Ransomware
    is installed into a computer system and/or an entire network, it encrypts the
    files. The attacker informs the user through a popup display that the files will
    only be decrypted if a ransom is paid. Ransomware gets into a computer through
    a suspicious download or an email attachment. Originally, worms were made to infect
    systems, clone themselves, then infect other computers using another medium. Hackers
    create botnets using worms from many connected devices. Examples of worms include:


    ●  NgrBot: it arrives through social networking sites and chat messengers.


    ●  ILOVEYOU: this one entices people using a fake love interest. The user may
    be encouraged to open an email infected with a worm.


    Trojan is type of malware that masquerades as legitimate. Unlike worms, it does
    not replicate itself. However, it contains additional types of malware such as
    spyware, ransomware, rootkits, and backdoors. Trojan attacks like to target the
    banking industry. Typically, a malware is installed on the target computer via
    a software vulnerability.  When the user visits the site, a spoofed screen is
    overlaid requesting personal data such as credit card details. Rootkits are prepared
    and customizable. They give access to the sensitive sections of an applications,
    change the configurations of a system, and enable file execution. They are usually
    deployed via a social engineering attack (which may lead to the theft of login
    credentials) and when installed, the hacker is able to access a network. This
    malware subverts all anti-malware software— the perpetrator is then free to do
    whatever he or she wants. Flame is a great example of a rootkit. It was used to
    monitor network traffic, record keystrokes, and steal screenshots. Backdoors negates
    the normal authentication process used to access a network. It is always installed
    as part of a targeted attack. The perpetrator researches the victim and steals
    their login credentials via a social engineering attack and consequently, gains
    access to the network, system, or application. Backdoors often try to avoid being
    detected and attackers use them to establish a control center. The attacker can
    then initiate system commands and update malware remotely. Hackers use backdoors
    for all kinds of malicious activities including infection of visitors’ computers,
    denial of service, and data theft. It is also the first step undertaken by attackers
    when they want to execute an APT (advanced persistent threat). Adware is one of
    the oldest types of malware. It was a free software that had so many popup ads
    that kept appearing. It was not necessarily malware, but it was annoying— it still
    exists to this day. Spyware collects your personal data and sells it to a third-party
    (a perpetrator) without your consent.


