    - Update plugins and browsers.


    ### For Publishers


    - Vet ad networks carefully and be inquisitive about the oaths of ad delivery.

    - Scan display ads.

    - Maybe only show certain types of files in an ad frame.


    ---


    # Chapter 30: Vulnerability Assessment


    This is the process of reviewing security weaknesses systematically in an information
    system. The system is evaluated to see if there are any vulnerabilities and the
    severity level of the vulnerabilities. A mitigation or remediation is then recommended
    if needed. A vulnerability assessment can help prevent several threats including:


    - **Insecure defaults**: this is software that comes with insecure settings, for
    instance, a guessable admin password.

    - **XSS**, **SQL injection** and similar attacks

    - **Escalation of privileges**


    Vulnerability assessments come in different types such as:


    - **Host assessment**: this is where critical servers are assessed. If they are
    not tested adequately, they become vulnerable to attacks.

    - **Network and wireless assessment**: practices and policies are assessed to
    block any unauthorized access to public or private networks and resources accessible
    through the network.

    - **Database assessment**: big data systems and databases are assessed for misconfigurations
    and vulnerabilities for the purpose of identifying insecure dev/test environments
    or rogue databases and classifying sensitive information in an organization.

    - **Application scans**: security vulnerabilities are identified in web applications
    and automated scans used to source their code on the front-end.


    ## Vulnerability Assessment: The Process of Security Scanning


    There are four steps involved in this process.


    ### Vulnerability Identification (Testing)


    The purpose of this step is to come up with a comprehensive list of the vulnerabilities
    of an application. Analysts check the security health status of an application
    and any other systems. They either use automated tools to scan or do it manually.
    These analysts also depend on threat intelligence feeds, asset management systems,
    vendor vulnerability announcements and vulnerability databases to find security
    weaknesses.


    ### Vulnerability Analysis


    This step seeks to find out the root cause and the source of the vulnerabilities
    uncovered in the step above. System components that led to the vulnerabilities
    are identified. For instance, a vulnerability could have resulted from an open
    source library''s old version. With this finding, it is easy to patch up the vulnerability.


    ### Risk Assessment


    The purpose of this step is to prioritize vulnerabilities. Security analysts assign
    a severity score or rank to each susceptibility. Here are the factors they consider:


    - Potential damage that could result from the vulnerability

    - The severity of an attack

    - Ease of compromise or attack

    - The business functions that are at risk

    - The data at risk

    - The systems that are affected


    ### Remediation


    In this step, all the security gaps are closed. It is a joint effort by development
    and operation teams and security staff. They determine the best approach for mitigation
    or remediation of each vulnerability.


    Specific steps of remediation include:


    - Introducing new security tools, measures and procedures.

    - Updating configuration or operation changes.

    - Developing and implementing vulnerability patches.


    > **Note**: Vulnerability assessment is not a one-time activity.


    ## Vulnerability Assessment Tools


    These tools are meant to scan for existing and new threats targeting your application.
    They include:


    - **Web application scanners**: they scan for and simulate attack patterns.

    - **Protocol scanners**: they look for vulnerable network services, ports and
    protocols.

    - **Network scanners**: they identify warning signals such as suspicious packet
    generation, spoofed packets, and stray IP addresses.


    ---


    # Chapter 31: Zero-Day Exploit


    This is a cyber-attack that targets a software''s vulnerability— one that is unknown
    to antivirus vendors or the software vendor. The perpetrator scans the software
    for a vulnerability before anyone else does, comes up with an attack plan and
    then uses it to infiltrate the software. These attacks usually have a high chance
    of success because there are no defenses in place. Zero-day attacks should, therefore,
    be taken seriously. Common targets include certain file types (Flash, PDF, Excel,
    or Word), web browsers and email attachments.


    ## Typical targets


    - **Internet of Things (IoT)**, firmware and hardware devices

    - Home users with a vulnerable system

    - People with access to sensitive business information

    - Large enterprises

    - Government departments


    ## Zero-Day Attacks Examples

