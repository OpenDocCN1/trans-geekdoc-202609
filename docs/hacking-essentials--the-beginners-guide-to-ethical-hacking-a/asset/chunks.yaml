    uses a malicious web application to make your browser execute unwanted action.
    Theoretically, thorough input/output sanitization can remove all vulnerabilities
    and make an application safe from unlawful manipulation. However, complete sanitization
    is never practical as many applications are in a developmental state continually.
    Additionally, applications integrate with each other frequently creating a very
    complex coded environment. Web Application Firewall (WAF) are software and hardware
    solutions that are used to mitigate application security threats. They are developed
    to evaluate incoming traffic and block any attack attempts. To deploy a WAF, you
    do not need to change your application. Various heuristics are used by WAFs to
    identify the traffic that can interact with an application and that which needs
    to be blocked. A signature pool that is constantly updated lets them identify
