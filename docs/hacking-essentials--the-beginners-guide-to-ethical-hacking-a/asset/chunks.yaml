    # Chapter 27


    # Rootkit


    ![image](d2d_images/chapter_title_below.png)


    This is a malicious software program that allows privileged access to a PC discreetly.
    It can risk your personal information and affect your computer’s performance.
    Once a rootkit has been installed, it boots while the operating system is booting
    or a few moments after. Some rootkit types boot before the operating system. 
    A rootkit may have many consequences including: Concealed malware: attackers can
    install other types of malware on already infected computers. The malicious programs
    are hidden from anti-virus software and the user. Information theft: perpetrators
    can use rootkits to steal credit card information, login credentials, and other
    sensitive information. File deletion: a rootkit can erase files and operating
    system code from a system. Eavesdropping: using a rootkit, a hacker can eavesdrop
    and intercept personal information. File execution: attackers can execute files
    remotely on target computers. Remote access: rootkits may change the configuration
    settings on a system such as tweaking startup scripts.


    Rootkit Injection


    A rootkit can be installed on a system through several ways.


