    # Chapter 2


    # Advanced Persistent Threat (APT)


    ![image](d2d_images/chapter_title_below.png)


    An APT is a broad term. It describes an attack campaign by an intruder, where
    they establish a malicious, long-term presence on a network with the aim of mining
    sensitive data. The intruder or team of intruders carefully search and pick their
    targets, usually government networks or large corporations. These intrusions can
    cause a lot of damage, including:


    ●  Theft of intellectual property


    ●  Compromise of sensitive information


    ●  Total takeover of sites


    ●  Sabotaging of critical infrastructure


    APT attacks are a little different from traditional web application attacks in
    that:


    ●  They are executed manually


    ●  They are way more complex


    ●  They are never hit-and-run attacks


    ●  Their goal is usually to penetrate an entire network


    APT Progression


    A successful advanced persistent threat happens in three stages: In most cases,
    enterprises are infiltrated via the compromising of one of the following: authorized
    human users, network resources, or web assets. This can be achieved through social
    engineering attacks such as spear phishing or malicious uploads such an SQL injection.
    Moreover, intruders can execute a DDoS attack simultaneously against the target.
    This distracts the network personnel and weakens the security perimeter. As soon
    as the initial access has been achieved, the infiltrators install a backdoor shell.
    This malware gives them network access and remote control. Once they have established
    a foothold, they spread their presence. They move up the hierarchy of the organization
    and compromise staff members by accessing very sensitive data. In this process,
    they gather the business’ critical information such as financial records, employee
    data and product line information.


    They can sell this information to competitors or sabotage the product line and
    destroy the company. During the APT event, the thieves store the stolen data somewhere
    within the network they are assaulting, in a secure place. After they have collected
    enough data, they extract it quietly without being noticed. Your security team
    is distracted using white noises as the information is being extracted. The best
    way to block the extraction of stolen data and prevent the installation of backdoors
    is monitoring egress and ingress traffic. Make a habit of inspecting traffic in
    your network perimeter so any unusual behavior does not go unnoticed. Deploy a
    web application firewall on your network perimeter to help filter the traffic
    being driven to your web application servers. Network firewalls and other internal
    traffic monitoring services can also help. Whitelisting controls the domains that
    are accessible from your network and the applications that users can install.
    It reduces the attack surfaces that are available to intruders. This security
    measure is not foolproof. To make it more effective, always have strict updated
    policies so that your users run updated versions of your applications. Your employees
    are the largest and the most susceptible soft-spot. There are three categories
    of targets:


    ●  Careless users


    ●  Malicious insiders


    ●  Compromised users


    Carefully review all your employees and the information that they have access
    to. Always patch any OS and software network vulnerabilities as soon as they are
    uncovered. Encrypt remote connections so that intruders do not use them to access
    your network. Filter incoming emails. This prevents phishing attacks and spam.


    Log security events immediately to improve whitelists and any other policies.


