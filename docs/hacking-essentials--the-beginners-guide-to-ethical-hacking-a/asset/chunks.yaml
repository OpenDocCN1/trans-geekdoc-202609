    # Chapter 32


    # Vulnerability Management


    ![image](d2d_images/chapter_title_below.png)


    What Is Vulnerability Management? Vulnerability: a weakness in an application
    that can be exploited. Vulnerabilities are used to execute attacks which may lead
    to server takeovers, malware injection, data theft, among other repercussions.
    Vulnerability management involves rooting out and removing these susceptibilities
    before bad actors abuse them. The following methods are used to achieve that:
    Vulnerability scanning: sanitizing code environments using code review and pen
    testing. It is usually performed after an application has been updated. Patch
    management: patches for new vulnerabilities are deployed in third-party software
    that is used by your application. Input validation/sanitization: incoming traffic
    is verified and filtered using a WAF. Consequently, attacks are blocked even before
    they take advantage of the vulnerabilities. It is a great alternative to sanitizing
    the application code. In vulnerability scanning, a hardware-based scanner or software
    is used to identify soft spots in the code that an attacker can exploit. Soft
    spots are usually brought on by unsensitized code. Scans are carried out using
    code reviews and pen tests to reveal weak spots in an application and then code
    updates are done to eliminate these vulnerabilities. Another rescan is done to
    make sure that the vulnerabilities are not there. This process should be undertaken
    every time the code updates and whenever new attack vectors have been discovered.
    Generally, vulnerability scanning has several operational issues. First, new vulnerabilities
    are always popping up. For this reason, scanning is a frequent process that requires
    a lot of resources. Even then, it is hard to achieve total code sanitization since
    the body code is in a state of continual change. On top of that, you cannot predict
    all attack scenarios. Finally, vulnerability scanning does not offer a quick solution
    to newly discovered threats. This matters a lot because many exploits are executed
    as soon as new vulnerabilities are announced. The time it takes to respond to
    these threats is crucial in any strategy of vulnerability management. A third-party
    must come up with patches and test them. Your DevOps and security teams are then
    responsible for putting these patches in your system. Patching delays occur often
    usually because of: The time your security team takes to deploy the patch and
    check its implementation. The ability of your software creator to design and test
    new patches. How long it takes for your team to receive a threat notification.
    Input Validation/Sanitization is the process of placing a WAF on your network
    edge. It reviews the incoming traffic and filters out any malicious input. Input
    validation solves patch management and vulnerability scanning issues effectively
    for these reasons: It does not require code updates: the patching and scanning
    processes are not very effective because they depend on code updates which are
    prone to delay. It is handled by security experts: some WAF providers offer the
    solution as a managed service. It has customizable security rules. Virtual patch
    management: this allows for effective mitigation of immediate threats.


