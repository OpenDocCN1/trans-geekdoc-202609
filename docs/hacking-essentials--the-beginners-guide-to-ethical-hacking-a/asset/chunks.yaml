    # Chapter 13


    # Social Engineering


    ![image](d2d_images/chapter_title_below.png)


    Social engineering refers to malicious attacks carried out via human interactions.
    These attacks manipulate the victim psychologically, causing them to give sensitive
    information or make a security mistake. A social engineering attack can happen
    in multiple steps or just one. The attacker researches the target victim to get
    background information. Next, he/she tries to win the trust of the victim and
    encourages them to take a subsequent action that compromises sensitive information. 
    Social engineering attacks are dangerous because instead of relying on weaknesses
    in an operating system or software, they rely on human error.  There are many
    types of social engineering attacks and they can be carried out anywhere if there
    is human interaction. However, some forms are more common than others and here
    are five of the well-known ones: Baiting attacks prey on a victim’s curiosity
    or greed. The perpetrator lures the victim into a trap, giving them the ability
    to install malware or steal sensitive information. Physical media is widely used
    in this kind of social engineering attack. A malicious hacker may leave a flash
    drive infected with malware as bait in a conspicuous area such as parking lot,
    bathroom, elevator, etc. As soon as the victim inserts the drive into a home or
    work computer, the system becomes infected. Scareware is also known as fraudware,
    rogue scanner software, and deception software. It slaps victims with fictitious
    threats and false alarms. The attacker leads the user to think that their system
    has malware. He then prompts the victim to install a (fake) anti-malware software.
    This software is usually malware. Scareware attacks are usually presented in the
    form of a genuine-looking popup in a browser informing you of a possible virus
    in your system. They can also arrive via spam emails. Pretexting is when a perpetrator
    uses lies to gather information. He asks for sensitive information from the victim
    by impersonating tax officials, a bank, a co-worker, or the police. In most cases,
    he will ask questions prompting you to confirm your identity. A lot of personal
    information can be stolen using this tactic, such as phone records, phone numbers,
    and social security numbers. Phishing is a very popular kind of social engineering
    attack. A phishing scam is a text message or email campaign that tries to create
    a sense of fear, curiosity, or urgency in the victim. The victims are then tricked
    into clicking on malicious links, opening malware-laden attachment, or giving
    sensitive information. Spear Phishing a type of phishing scam but it is usually
    targeted. The perpetrator chooses certain enterprises or individuals. He then
    crafts a very specific message based on the victim’s contacts, job position, or
    characteristics. He impersonates his victim and tricks their co-workers or contacts
    into giving sensitive information.


    Social Engineering Prevention


    ●  Have anti malware or antivirus software and keep it updated.


    ●  Do not accept tempting offers.


    ●  Consider using multi-factor authentication.


    ●  Do not open suspicious emails or attachments.


