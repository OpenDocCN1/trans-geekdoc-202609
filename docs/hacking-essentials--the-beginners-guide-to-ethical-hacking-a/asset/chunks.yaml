    # CSRF Attack Prevention and Mitigation


    There are several methods through which CSRF attacks can be prevented and mitigated.
    For users, a CSRF attack can be prevented by denying access to unauthorized actors
    in applications and safeguarding their login credentials.


    Here are a few great practices:


    - Secure passwords and usernames

    - Log off from web applications when they are not in use

    - Prevent browsers from remembering passwords

    - Avoid browsing simultaneously when signed into an application


    Web applications can also take advantage of the solutions available to block malicious
    traffic and stop attacks. One common method of mitigation is creating random tokens
    for each ID or session request. The server subsequently checks and verifies them.
    Any session requests with missing values or duplicate tokens are blocked. If a
    request does not match the token of its session ID, it is also blocked from getting
    to the application. CSRF attacks can also be blocked using the method of double
    submission of cookies. Just like with the method described above, both a request
    parameter and cookies are assigned random tokens. Before access to the application
    is granted, the server must make sure that the tokens match. Tokens are not 100%
    effective.


    # Chapter 21: Structured Query Language (SQL) Injection


    **SQL injection** or **SQLI** is where a malicious SQL code is used to manipulate
    backend database in order to access sensitive information (private customer details,
    user lists, etc.). SQL injection can have quite the impact on a business. If an
    attack like this one is successful, user lists can be viewed by unauthorized persons,
    entire tables could be deleted, and in extreme cases, the perpetrator may attain
    admin rights to a database. When talking about the loss that an organization may
    incur due to SQLI, it is important to mention damaged relationships with customers
    should their personal information (credit card details, addresses, and phone numbers)
    be stolen. Any SQL database can suffer this attack, but websites are the most
    targeted. SQL is standardized language for accessing and manipulating databases
    for the purpose of creating customizable views for every user. SQL queries help
    in executing commands like record removal, data retrieval, and updates. There
    are different SQL elements that are used to carry out these tasks. The following
    is a typical SQL database query of an eStore:


    ```

    SELECT ItemName, ItemDescription

    FROM Item

    WHERE ItemNumber = ItemNumber

    ```


    From this query, the web application creates a string query and sends it to the
    database as one SQL statement:


    ```

    sql_query = "

    SELECT ItemName, ItemDescription

    FROM Item

    WHERE ItemNumber = " & Request.QueryString("ItemID")

    ```


    An input provided by a user `http://www.estore.com/items/items.asp?itemid=999`
    then develops this query:


    ```

    SELECT ItemName, ItemDescription

    FROM Item

    WHERE ItemNumber = 999

    ```


    From the syntax, you can see that this query gives the description of item number
    999.


    ## SQL Injection Example


    When a perpetrator wants to carry out an SQLI, he uses a typical SQL query to
    take advantage of input vulnerabilities that have not been validated in a database.
    An attacker can execute this attack vector in several ways, some of which are
    illustrated here. The input mentioned above, for example, extracts information
    about a specific product. It can be changed to `http://www.estore.com/items/items.asp?itemid=999
    or 1=1`


    The corresponding SQL query will then be:


    ```

    SELECT ItemName, ItemDescription

    FROM Items

    WHERE ItemNumber = 999 OR 1=1

    ```


    `1=1` is a statement that is always true so the query will return every item name
    and description from the database, including those that you are not allowed to
    access.


    Perpetrators can also exploit characters that have been incorrectly filtered to
    change SQL commands—this includes semicolons to separate fields. For instance,
    this input `http://www.estore.com/items/iteams.asp?itemid=999; DROP TABLE Users`
    will generate this SQL query:


    ```

    SELECT ItemName, ItemDescription

    FROM Items

    WHERE ItemNumber = 999; DROP TABLE USERS

    ```


    This could lead to deletion of the user database.


    ## SQLI Mitigation and Prevention


    You can prevent SQLI attacks from happening in multiple ways and protect against
    them if they occur.


    Some of the best ways include:


    - **Input sanitization/validation** – write code that can recognize user inputs
    that are illegitimate. This is a good practice, but it is still not 100% effective.

    - **WAF (web application firewall)** – this one filters out SQLI among other online
    threats.


    # Chapter 22: DNS Spoofing


    **DNS (Domain Name Server) spoofing** is also known as **DNS cache poisoning**.
    It is an attack that uses changed DNS records to redirect traffic to a malicious
    website instead of the intended one. This fraudulent site looks so much like the
    legitimate one. Once they are in the attacker''s site, the victim is prompted
    to sign in to what looks like their account. During this event, the bad actor
    steals the user''s sensitive information and login credentials. Moreover, the
    attacker can install viruses or worms on the user''s computer, achieving long-term
    access to other kinds of data.


    A DNS spoofing attack can be executed using certain methods including:


    - **Man in the middle (MITM)**: this is whereby a perpetrator intercepts communication
    between a DNS server and a user and, consequently, routes the victim to a fraudulent
    IP address.

    - **DNS server compromise**: this is where an attacker directly hijacks a DNS
    server and configures it to return a fraudulent IP address.


    In this example, the perpetrator (whose IP is `192.168.6.300`) intercepts a channel
    of communication between the server computer of `www.estores.com` (whose IP is
    `192.168.4.200`) and their client (whose IP is `192.168.1.100`). In this case,
    the client is tricked using a tool such as `arpspoof` to think that the attacker''s
    IP address is the server''s. In the same way, the server is tricked into believing
    that the attacker''s IP address is the client''s.


    This is how that would play out:


    1. The perpetrator issues this command using `arpspoof`: `arpspoof 192.168.1.100
    192.168.2.200`. The MAC IP addresses in the ARP table of the server are modified
    so it thinks that the PC of the perpetrator is the client.

    2. Again, the attacker issues this command using `arpspoof`: `arpspoof 192.168.2.200
    192.168.1.100`. This makes the client think that the perpetrator''s PC belongs
    to the server.

    3. The next step for the perpetrator is to issue a Linux command: `echo 1 > /proc/sys/net/ipv4/ip_forward`
    so that the packets that are exchanged between the server and the client are forwarded
    to the computer of the attacker.

    4. The perpetrator creates the host file, `estores.com 192.168.3.300`, on his
    local computer. It maps the legitimate website to his local IP.

    5. The attacker creates a web server on the IP address of the local computer and
    sets up a malicious website that looks like the legitimate one.

    6. Finally, the perpetrator uses a tool such as `dnsspoof` so all DNS requests
    are directed to his local host file. When users try to access the real website,
    the fake one comes up and when they interact with it, their computers get infected
    with malware.


    ## Mitigation of DNS Spoofing Using DNSSEC (Domain Name Server Security)


    DNS is a protocol that is not encrypted, and DNS servers never validate IP addresses
    when they redirect traffic. DNSSEC adds extra verification methods. It sets up
    a cryptographic signature that is unique to you to authenticate DNS responses.
    It is very effective but has a few downsides including:

