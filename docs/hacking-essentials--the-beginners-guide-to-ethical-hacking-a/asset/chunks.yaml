    following may happen: Drive-by download— adware or malware is installed on the
    user’s computer. Browser vulnerabilities make such attacks possible. The browser
    is forced to redirect to a malicious site. Malicious content, unwanted advertisements,
    or popups can be displayed. When a user clicks on the malicious ad, the following
    can happen: They may execute a code which installs adware or malware into their
    computer. The user may be redirected to a malicious site instead of the one that
    the ad suggested. The user may be redirected to a malicious site where the attacker
    carries out a phishing attack.


    Effects of Malvertisements to Publishers


    Publishers will suffer loss of revenues and traffic in addition to a damaged reputation.
    They may also incur legal liabilities due to the damages that users suffer. It
    is difficult for publishers to block or even test for malicious ads.


    How Malware Is Injected into Ads


    ●  Malware in ad calls


    ●  Malware injected post-click


    ●  Malware in ad creative


    ●  Malware within a pixel


    ●  Malware within video


    ●  Malware within Flash video


    ●  Malware on a landing page


    Mitigation and Prevention of Malvertising


    It is not easy to mitigate or prevent malvertising so both publishers and end
    users must take action.


    For End-Users


    ●  Install antivirus to protect your PC against malicious code and drive-by downloads.


    ●  Make good use of ad blockers.


    ●  Avoid using Java and the Flash.


    ●  Update plugins and browsers.


    For Publishers


    ●  Vet ad networks carefully and be inquisitive about the oaths of ad delivery.


    ●  Scan display ads.


    ●  Maybe only show certain types of files in an ad frame.


