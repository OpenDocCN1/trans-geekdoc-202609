    # Chapter 18


    # Internet of Things Security


    ![image](d2d_images/chapter_title_below.png)


    IoT is a network of devices that are connected. Each of them has a unique identifier
    which exchanges and collects data automatically over a network. There are many
    industries and sectors that use IoT devices such as: Consumer applications: some
    IoT consumer products include smart homes, smart watches, and smartphones. Business
    applications: these include sensors, smart trackers, and smart security cameras.
    Governmental applications: these include devices that track wildlife, issue alerts
    for natural disasters, and monitor traffic congestions. The widespread use of
    IoT devices has opened a door for security issues which are discussed here in
    detail. IoT Devices are managed both externally (interaction with other devices)
    and internally (software maintenance). Every device is connected to a command
    and control center(C&C) which is the management unit. These centers take care
    of firmware updates, configurations, and software maintenance. They are also responsible
    for authentication of tasks. Communication between IoT devices are through APIs
    (application program interfaces). When the API of a device is exposed, other applications
    or devices can gather data through it and communicate.


