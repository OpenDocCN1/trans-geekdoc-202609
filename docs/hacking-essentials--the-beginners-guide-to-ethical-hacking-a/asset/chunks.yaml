    # Chapter 7


    # Incident Response


    ![image](d2d_images/chapter_title_below.png)


    An incident, in web application security, is the attempted violation or violation
    of the security policies of an application. Altering a site’s content, data theft,
    unauthorized access attempts, vulnerability exploits and network breaches are
    good examples. Incident response is the mitigation or prevention of such threats.
    Enterprises come up with an organized approach to help them improve their network
    defenses and block security breaches.


    This is achieved by:


    ●  Figuring out the weak spots of an application.


    ●  Enhancing security parameters against threats.


    ●  Safeguarding the access to all the sensitive parts/data of an application.


    Even when an attempt is unsuccessful, it is still wise to treat it as an incident.


    Web application firewalls (WAFs) are a very important part of incident response
    strategies. It is helpful to understand how they are used so that you can come
    up with an efficient incident response policy. This lifecycle can be divided into
    three phases: there is the preparation phase, the detection/analysis phase, and
    post incident activity. In each phase, WAF technology has a different role to
    play. The Preparation Phase is a two-part process. It involves putting in place
    security configurations and testing the application for any weaknesses. There
    are several steps you can take to prepare for a threat while still protecting
    the sensitive areas of your application: Deploying a WAF: a WAF conducts an analysis
    of incoming traffic and blocks all attempts of an attack aimed at the application
    layers. Some WAFs will even protect your application from zero-day attacks. Setting
    up access control policies: this is where the parts of your application and website
    containing sensitive information are identified and secured.  This is done using
    2FA (two-factor authentication). It offers extra access control. Security orchestration:
    this involves developing a cohesive work flow by streamlining security measures.
    For example, redefining the tasks and roles of each security team member. Testing
    for Weaknesses, you test your application, usually using a pen test, to see if
    there are any soft spots that an intruder can exploit. Adjustments are then made
    to patch the identified soft spots. Once deployed, security measures analyze and
    filter all the incoming web traffic. If any incident is detected, they block malicious
    requests, raise an alarm, and document all the details concerning the threat in
    a comprehensive security log known as incident detection analysis.


    The log includes:


    ●  The geolocation and IP data of the perpetrator.


    ●  The attack vectors


    ●  The HTTP fingerprint of the intruder


    ●  The attempt entry page.


    When you have a detailed description of the security event, you can understand
    it and come up with an appropriate response. Post-Incident Activity is the last
    phase of the entire process and it is devoted to using the lessons learned in
    the other phases. It has three parts including:


    ●  Reviewing the logs to figure out whether the incident unraveled any soft spots.


    ●  Changing WAF rules and coming up with new policies to remove weaknesses.


    ●  Testing out the new rules.


    Rinse and Repeat is a continual process. Every incident is a learning opportunity.
    It will help you improve your enterprise’s security and enhance your preparedness.


