    # DNSSEC（域名系统安全扩展）


    DNSSEC 是一套增强 DNS（域名系统）安全性的扩展，通过确认结果未被篡改来保障安全。DNSSEC 可帮助企业加强其 DNS 安全性。DNS 欺骗是针对
    DNS 基础设施攻击的一个典型案例。攻击者劫持 DNS 解析器的缓存。当用户访问该网站时，他们会收到错误的 IP 地址，从而查看攻击者的恶意站点，而非合法站点。组织可使用
    DNSSEC 保护其 DNS 服务器中的定义和敏感数据。主机信息、邮件交换服务器详情和 IP 地址均属于 DNS 中的数据示例。DNSSEC 保护这些数据。它还可阻止通过
    DNS 进行的数据渗漏。DNSSEC 旨在确保名称服务器发送给客户端的回复是真实的。这是通过数字签名技术实现的。加密签名被添加到 DNS 记录中，从而保护发布在
    DNS 中的信息。DNSSEC 为 DNS 定义了新的资源记录类型，以增强数字签名验证。


    - **资源记录签名 (`RRSIG`)**：包含特定记录集的加密签名。

    - **DNSKEY 记录**：包含用于 DNS 认证过程的公钥。

    - **DS（授权签名者）记录**：公共 `DNSKEY` 的指纹，保存在父区域中。

    - **NSEC（下一条安全记录）**：利用 DNSSEC 排序顺序提取下一个有效的记录名称。因此，DNS 解析器可证明某 DNS 记录不存在。

    - **NSEC3**：通过在区域中对所有记录名称进行加密哈希，克服了 NSEC 遍历的潜在风险。


    ## NSEC3 参数 (`NSEC3PARAM`)


    它为 DNS 服务器提供参数，以确定针对不存在名称的 DNSSEC 请求响应中将包含的 `NSEC3` 记录。DNSSEC 可验证 DNS 请求，因此有助于降低
    DNS 欺骗风险。但它并不解决利用 DNS 服务器的 DDoS（分布式拒绝服务）攻击。事实上，它可能会放大攻击效果。DNSSEC 包含额外的加密信息和字段来验证记录，因此针对
    DNS 问题发送的回复数据包更大。大响应使攻击者能获得更大的攻击流量。


    ## DNSSEC 验证流程


    DNSSEC 验证流程包含以下阶段：


    1. 用户输入 URL 地址。

    2. 浏览器查询本地计算机的 DNS 解析器以确定主机名的 IP 地址。

    3. 若 IP 地址在解析器缓存中，则直接反馈给浏览器。

    4. 若未找到，请求被传递给递归解析器。

    5. 若递归解析器有该地址，则返回它。

    6. 若没有，则启动递归查询以确定持有所请求域名权威信息的 DNS 服务器。

    7. 首先联系根 DNS 服务器，它将解析器引荐给该域名的 TLD（顶级域）DNS 服务器。

    8. 解析器随后被 TLD DNS 引荐给权威名称服务器。

    9. 在所有阶段中，解析器都会请求与 DNS 区域关联的 DNSSEC 密钥，以验证服务器的真实性。

    10. 解析器将验证 `RRSIG` 并确认其在传输过程中未被篡改。


    ---


    # 第 9 章：反射型跨站脚本（XSS）攻击


    Web 应用程序的一种漏洞，允许入侵者将代码注入到外部网站的内容中，这被称为跨站脚本攻击（XSS）。当有人访问该网站上被感染的页面时，代码会在其浏览器中执行。因此，入侵者绕过了浏览器的“同源策略”，并可访问受害者的私密信息。


    **反射型 XSS 攻击**，也称为非持久性攻击。当恶意脚本从 Web 应用反射到受害者的浏览器时发生。脚本通过链接激活。发送一个带有漏洞的请求到网站，从而使恶意脚本得以执行。此漏洞通常由未充分清理传入请求引起，这使
    Web 应用程序的功能面临被操纵的风险。攻击者将恶意链接嵌入第三方网站或电子邮件以进行分发。链接提示用户点击，从而发起 XSS 请求。


    反射型攻击与存储型攻击的区别在于：后者要求攻击者寻找允许注入恶意脚本的网站；而反射型攻击中，脚本嵌入在链接上。要使该事件成功，用户必须点击该链接。


    存储型和反射型 XSS 攻击的差异：


    - 反射型攻击更为常见

    - 警惕的用户可避免反射型攻击

    - 两者的影响范围不同


    XSS 攻击中的攻击者玩的是概率游戏。他将链接发送给成千上万的用户以增加成功几率。即使只有极小比例的用户决定点击链接，他仍将拥有大量受感染的论坛用户。这些用户将被定向到论坛网站，恶意脚本将在其浏览器中反射执行。因此，攻击者可通过窃取其会话
    Cookie 劫持其账户。


    您可以通过多种方式预防和缓解 XSS 攻击。首先，对用户而言，保持警惕是防御 XSS 脚本的最佳手段。具体来说，用户应避免点击任何可疑链接，因为您永远不知道哪个链接包含恶意代码。您可在以下位置发现可疑链接：


    - 社交媒体动态

    - 未知联系人发送的电子邮件

    - 网站的评论区


    网站运营商也应保护其用户免受潜在滥用。


    Web 应用程序防火墙（`WAF`）在预防反射型 XSS 攻击方面大有裨益。它们可阻止输入清理缺失的异常请求。在存储型攻击中，阻止的是攻击者对网站的恶意请求；而在反射型攻击中，阻止的是用户的请求。这保护了用户和旁路受害者（其他网站用户）。一些
    Web 应用程序防火墙使用签名过滤来对抗反射型 XSS 攻击。这些 `WAF` 利用众包技术自动收集整个网络的攻击数据。


    ---


    # 第 10 章：入侵检测和入侵防范


    入侵检测和入侵防范都是广泛的术语。它们描述了用于减少攻击和防范新威胁的应用安全实践。


    - **检测**是一种被动措施。它使用入侵检测系统（`IDS`）识别并中和正在进行的攻击。它清除现有恶意软件并检查社会工程学攻击。

    - **防范**是主动的。它使用入侵防范系统（`IPS`）预先阻止应用攻击。


    `IDS` 是一种软件应用或硬件设备，它使用已知的入侵特征检测并分析出站和入站网络流量，以检查异常活动。


    这通过以下方式实现：


    - 将系统文件与恶意软件特征进行比对

    - 通过扫描进程检测有害模式的迹象

    - 通过监控用户行为检测恶意意图

    - 监控系统配置和设置

    '
