    这是一个通用术语，指攻击者拦截应用程序与用户之间的对话。攻击者可以伪装成其中一方或窃听，使对话看起来正常。中间人攻击（MITM）的目的是窃取信用卡号、账户详情、登录凭证和其他敏感信息。攻击者通常针对电商网站、SaaS
    企业、金融应用及其他需要登录的网站的用户。攻击者收集的信息可用于未经授权的密码修改、非法资金转移和身份盗窃。此外，攻击者可在高级持续性威胁（APT）的渗透阶段利用它在安全网络中建立立足点。为了更好地理解
    MITM 攻击，可以想象邮递员查看你的银行对账单，记下你的详细信息，然后重新封好信封投递给你。成功的 MITM 攻击有两个不同阶段：拦截和解密。在第一步中，攻击者利用其网络在用户流量到达预期目的地之前将其拦截。最简单且最常见的方法是创建恶意的免费
    Wi-Fi 热点并向公众开放。这些热点通常不受密码保护。当用户将设备连接到此网络时，攻击者即可访问其在线数据交换。部分攻击者可能倾向于通过以下方法采取主动方式：


    - **IP 欺骗**：攻击者更改 IP 地址数据包头部并伪装成应用程序。任何尝试访问该应用程序 URL 的用户都会被重定向到攻击者的网站。

    - **ARP 欺骗**：攻击者使用伪造的 ARP 消息将合法用户的 IP 地址与其 MAC 地址关联。一旦发生这种情况，本应从用户发往主机 IP 地址的数据会转发给攻击者。

    - **DNS 欺骗**：攻击者渗透 DNS 服务器并更改网站的地址记录。


    拦截步骤成功后，必须在应用程序和用户不知情的情况下隐蔽地解密双向 SSL 流量。有几种实现方法：


    - **HTTPS 欺骗**：在首次成功连接到安全网站后，向受害者的浏览器发送伪造证书。

    - **SSL BEAST**：将恶意 JavaScript 注入用户计算机，从而拦截从 Web 应用程序发送的任何加密 Cookie。

    - **SSL 劫持**：在 TCP 握手期间，攻击者向应用程序和用户传递伪造的认证密钥。

    - **SSL 剥离**：将 HTTPS 连接降级为 HTTP。


    ## 中间人攻击防范


    ### 针对用户：


    - 避免可疑的 Wi-Fi 连接

    - 留意浏览器关于不安全网站的警告

    - 始终从应用程序登出

    - 避免使用公共网络


    网站运营者应通过确保传输数据的加密和认证来强化安全通信协议。


    ---


    # 第 26 章


    # 定向钓鱼攻击


    这是一种社会工程学攻击，攻击者伪装成受信任的个人，诱骗受害者点击短信或伪造邮件中的恶意链接。用户随后在不知情的情况下在其计算机/网络上安装恶意软件、执行 APT
    的第一阶段或泄露敏感信息等。虽然定向钓鱼看起来像鲸钓攻击和普通钓鱼，但它与典型的社会工程学攻击略有不同，且执行方式异常。因此，在制定安全策略时需要给予特别关注。以下是一个定向钓鱼攻击及其后果的示例。一名声称代表数据库管理
    SaaS 提供商 `www.itservices.com` 的人员向企业系统管理员发送伪造邮件。他使用的邮件模板属于 `itservices.com`。邮件称
    `itservices.com` 正在限时提供一项新服务，并邀请用户使用附带链接注册。系统管理员点击链接后，会被带到一个网站 `itservice.com`
    的登录页面，该页面酷似 `itservices.com` 的注册页面。此时，攻击者在系统管理员的计算机上安装了控制与命令代理。随后，攻击者可将其作为后门进入企业网络并执行
    APT 的第一阶段。


    ## 钓鱼攻击、鲸钓攻击与定向钓鱼攻击的对比


    鲸钓攻击、钓鱼攻击和定向钓鱼攻击在目标受害者和复杂程度上有所不同。在钓鱼攻击中，攻击者伪装成受信任方向尽可能多的用户发送恶意邮件。例如，攻击者可能发送一封看似来自
    PayPal 的邮件，要求用户点击链接验证凭证，这可能导致恶意软件安装在接收者计算机上。钓鱼邮件通常不具个性化，包含拼写错误等失误，且批量发送。许多人从未注意到这些提示。定向钓鱼邮件难以检测，它们看起来像来自目标身边的人，且邮件内容个性化。鲸钓攻击针对组织高层的决策者，这些高管可访问管理员账户密码、商业机密等高度敏感信息。攻击者伪装成组织或个人（如客户）发送邮件。鲸钓攻击利用来自新闻、网站或社交媒体的信息针对特定个人。虽然鲸钓攻击针对高层个人，但定向钓鱼攻击的目标则是低调的目标。


    ## 定向钓鱼攻击缓解措施


    - **双因素认证**：要求用户通过两层/步骤验证。

    - **密码管理策略**：确保员工不在恶意网站上使用企业密码。

    - **教育活动**：培训员工并提高安全意识。


    ---


    # 第 27 章


    # Rootkit


    这是一种恶意软件程序，允许隐蔽地获取对 PC 的特权访问。它会危及个人信息并影响计算机性能。一旦安装，Rootkit 会在操作系统启动时或稍后启动。某些类型的
    Rootkit 甚至在操作系统启动前运行。Rootkit 可能导致以下后果：


    - **隐藏恶意软件**：攻击者可在已感染的计算机上安装其他类型的恶意软件。这些恶意程序对杀毒软件和用户不可见。

    - **信息窃取**：攻击者可利用 Rootkit 窃取信用卡信息、登录凭证和其他敏感信息。

    - **文件删除**：Rootkit 可擦除系统中的文件和操作系统代码。

    - **窃听**：黑客可利用 Rootkit 窃听并拦截个人信息。

    - **文件执行**：攻击者可在目标计算机上远程执行文件。

    - **远程访问**：Rootkit 可能更改系统配置设置，如修改启动脚本。


    ## Rootkit 注入


    Rootkit 可通过多种方式安装在系统上。


    ### 搭便车

