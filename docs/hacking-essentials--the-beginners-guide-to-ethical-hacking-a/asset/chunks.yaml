    The countries that were most affected include Indonesia, India and Iran. Iran’s
    uranium enrichment plants were the key target. The intention was to disrupt the
    nuclear program of the country. Sony zero-day attack: a zero-day attack was carried
    out against Sony Pictures in 2014. This attack crippled their network and sensitive
    corporate information was shared. The information included executives’ personal
    email addresses, business plans and forthcoming movies. The exact details of the
    vulnerability that was exploited are still unknown. RSA: RSA, a security company,
    had their network accessed by hackers in 2011. The bad actors used an unpatched
    susceptibility in Adobe Flash Player. RSA employees received emails from the attackers.
    These emails had Excel spreadsheet attachments with a Flash file embedded. When
    employees opened it, Poison Ivy got installed on their system. Operation Aurora:
    this attack took place in 2009 and targeted major companies’ intellectual properties.
    These companies included Dow Chemical, Yahoo, Adobe Systems and Google. The vulnerabilities
    were in Perforce and Internet Explorer.  Zero-day exploits target vulnerabilities
    that have no antivirus or patches yet, so they are not easy to detect. You can,
    however, detect software vulnerabilities that were previously unknown in several
    ways: Vulnerability scanning: several zero-day exploits can be detected with vulnerability
    scanning. Companies that offer vulnerability scanning services simulate attacks
    to identify any new vulnerabilities. This approach is not suitable for all zero-day
    exploits. Patch management: this involves patching software vulnerabilities as
    soon as they are discovered. This will not necessarily prevent zero-day attacks,
    but it can reduce the chances of an attack happening. The problem with this is
    that it takes time for vulnerabilities to be discovered and antivirus software
    to be developed and distributed. If the process takes long, an attack could occur.
    Input validation and sanitization: this method is very effective (probably the
    best). It involves deploying a WAF (web application firewall) on the edge of the
    network. This WAF will review all the traffic coming in and filter out whatever
    malicious outputs may be there. Zero-day initiative: this is a program that rewards
    security researchers who disclose vulnerabilities responsibly as opposed to selling
    this information to bad actors.


