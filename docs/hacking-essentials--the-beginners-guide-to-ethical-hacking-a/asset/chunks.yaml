    # Chapter 22


    # DNS Spoofing


    ![image](d2d_images/chapter_title_below.png)


    DNS (Domain Name Server) spoofing is also known as DNS cache poisoning. It is
    an attack that uses changed DNS records to redirect traffic to a malicious website
    instead of the intended one. This fraudulent site looks so much like the legitimate
    one. Once they are in the attacker’s site, the victim is prompted to sign in to
    what looks like their account. During this event, the bad actor steals the user’s
    sensitive information and login credentials. Moreover, the attacker can install
    viruses or worms on the user’s computer, achieving long-term access to other kinds
    of data.  A DNS spoofing attack can be executed using certain methods including:
    Man in the middle (MITM): this is whereby a perpetrator intercepts communication
    between a DNS server and a user and, consequently, routes the victim to a fraudulent
    IP address. DNS server compromise: this is where an attacker directly hijacks
    a DNS server and configures it to return a fraudulent IP address. In this example,
    the perpetrator (whose IP is 192.168.6.300) intercepts a channel of communication
    between the server computer of www.estores.com (whose IP is 192.168.4.200) and
    their client (whose IP is 192.168.1.100). In this case, the client is tricked
    using a tool such as arpspoof to think that the attacker’s IP address is the servers.
    In the same way, the server is tricked into believing that the attacker’s IP address
    is the client’s This is how that would play out: The perpetrator issues this command
    using arpspoof “arpspoof 192.168.1.100 192.168.2.200”. The MAC IP addresses in
    the ARP table of the server are modified so it thinks that the PC of the perpetrator
    is the client. Again, the attacker issues this command using arpspoof “arpspoof
    192.168.2.200 192.168.1.100”. This makes the client think that the perpetrator’s
    PC belongs to the server. The next step for the perpetrator is to issue a Linux
    command “echo 1> /proc/sys/net/ipv4/ip forward so that the packets that are exchanged
    between the server and the client are forwarded to the computer of the attacker.
    The perpetrator creates the host file, estores.com 192.168.3.300, on his local
    computer. It maps the legitimate website to his local IP. The attacker creates
    a web server on the IP address of the local computer and sets up a malicious website
    that looks like the legitimate one. Finally, the perpetrator uses a tool such
    as dnsspoof so all DNS requests are directed to his local host file. When users
    try to access the real website, the fake one comes up and when they interact with
    it, their computers get infected with malware. Mitigation of DNS Spoofing Using
    DNSSEC (Domain Name Server Security) DNS is a protocol that is not encrypted,
    and DNS servers never validate IP addresses when they redirect traffic. DNSSEC
    adds extra verification methods. It sets up a cryptographic signature that is
    unique to you to authenticate DNS responses. It is very effective but has a few
    downsides including:'
