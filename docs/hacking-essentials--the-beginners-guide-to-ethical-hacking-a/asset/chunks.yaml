    to the application. CSRF attacks can also be blocked using the method of double
    submission of cookies. Just like with the method described above, both a request
    parameter and cookies are assigned random tokens. Before access to the application
    is granted, the server must make sure that the tokens match. Tokens are not 100%
    effective.


