    # Chapter 20


    # Cross Site Request Forgery (CSRF) Attack


    ![image](d2d_images/chapter_title_below.png)


    CSRF (otherwise known as Session Riding, Sea Surf or XSRF) is a kind of an attack
    that manipulates a web browser into carrying out an undesired action in the application
    that a user is logged on to.  When a CSRF attack is successful, both the user
    and the business are affected. It can lead to unauthorized transfer of funds,
    data theft (including session cookies), changed passwords, or damaged relationships
    with clients. CSRFs are usually executed using social engineering attacks such
    as links or emails that manipulate the user into sending a counterfeit request
    to the server. The application authenticates the unsuspecting user during the
    attack—this makes it difficult to tell the difference between a forged request
    and a legitimate one.


    Example of a CSRF Attack


    A perpetrator takes some time to study an application so that the request can
    look just like a legitimate one. Take the example of a GET request for say, a
    $200 bank transfer. It will typically look like this: GET http://netbank.com/transfer.do?acct=PersonB&amount=$200
    HTTP/1.1


    A perpetrator may tweak this script and transfer t$200 to his account. The malicious
    request may be something like this: GET http://netbank.com/transfer.do?acct=AttackerA&amount=$200
    HTTP/1.1


    The attacker may then embed this request into a link that seems very innocent:


    <a href=” http://netbank.com/transfer.do?acct=AttackerA&amount=$200”>Read more!
    </a>


    The next step for the bad actor is to send out this link to as many bank customers
    as possible via email. Anyone who clicks through while signed into their bank
    account may end up unintentionally transferring $200 to the hacker. A malicious
    request carried out using the <a> href tag cannot be successful if the bank only
    uses POST requests. Nonetheless, the attacker can still use a <form> tag together
    with automatic execution of an embedded JavaScript.


    For example:


    <body onload="document.forms\[0\].submit()">


    <form action="http://netbank.com/transfer.do" method="POST">


    <input type="hidden" name="acct" value="AttackerA"/>


    <input type="hidden" name="amount" value="$100"/>


    <input type="submit" value="View my pictures!"/>


    </form>


    </body>'
