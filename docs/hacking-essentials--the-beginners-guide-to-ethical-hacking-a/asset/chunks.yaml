    # Chapter 5


    # Ethical Hacking


    ![image](d2d_images/chapter_title_below.png)


    An ethical hacker, also known as a white hat hacker, is an IT security expert
    with the same skill set as a malicious hacker (black hat hacker). They use the
    same technology as the black hat hacker to unravel weaknesses and vulnerabilities
    in companies’ systems. A malicious hacker does not obtain the consent of the victims
    before he operates, and he does so to cause damage, gain fame, or make money.
    An ethical hacker, on the other hand, is asked by an organization to hack the
    same organization’s systems to see if there are any security gaps that can be
    used by a black hat hacker. The first-time people tried to hack into computer
    systems was back in the ‘60s. Sometime in the ‘70s, companies and governments
    created “tiger teams”. Their job was to look for any vulnerabilities in the computing
    and telecom systems—they were the first white hat hackers. In the ‘80s and ‘90s,
    more people obtained personal computers, and this made hacking a global phenomenon.
    The term “ethical hacking” was coined by John Patrick in 1995. After some time,
    ethical hacking became a legitimate profession.


    Certified Ethical Hacker (CEH) Certification


    Having a certification as an ethical hacker is very important. Before an organization
    employs a white hat hacker, they need to make sure that the hacker is technically
    skilled and will use their skills for good of the company and not cause any damages.
    The Certified Ethical Hacker certification was defined by a non-profit organization
    in New Mexico, known as the Electronic Commerce Council (EC-Council). This certification
    legitimizes information security professionals and allows them to be recognized
    as ethical hackers. This certification is very demanding. It covers a myriad of
    security tools, attack vectors, and concepts that every student must understand
    in depth. There are many organizations that accredit it, among them the US Department
    of Defense and the National Security Agency (NSA). To qualify as a certified hacker,
    a student must pass the CEH exam. In preparation for the exam:


    ●  A student can take the CEH training program offered by the EC-Council. The
    three Accredited Training Centers include Affinity IT Security, Pearson Vue Testing
    Center and EC-Council.


    ●  The EC-Council offers a CEH Exam Blueprint and a CEH Handbook on their website.


    ●  Several organizations offer prep courses.


    ●  The EC-Council encourages candidates to take practice tests.


    To be able to take the CEH exam, a candidate must complete the training program
    offered by EC-Council and prove to be experienced in not less than 3 of the 5
    domains. Alternatively, they need to have two years of experience in the field
    of information security. Web applications are a key target for hackers. They are
    vulnerable because of their complicated multi-tier architecture. They also store
    sensitive data and can be easily accessed from outside. Certified hackers have
    a wide understanding of modern attack technologies, threat vectors, and software
    systems. They can use this knowledge to help companies understand their web applications’
    security posture, the level of threat, and how they can improve their security.


