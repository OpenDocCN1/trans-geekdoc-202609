    # Chapter 19


    # Domain Name Server (DNS) Hijacking


    ![image](d2d_images/chapter_title_below.png)


    DNS hijacking (or DNS redirection) is a DNS attack where DNS queries are resolved
    incorrectly so that users can be unexpectedly redirected to malicious sites. For
    them to carry out the attack, the bad actor can install malware on the victim’s
    PC, hack/intercept DNS communication, or take over routers. Attackers use DNS
    hijacking for phishing or pharming. DNS hijacking is also used by many ISPs (Internet
    Service Providers) to take over the DNS requests of a user and gather statistics.
    DNS hijacking is also used by governments for censorship—users are redirected
    to government sites that are authorized. There are four main forms of DNS redirection:
    Local DNS hijack: the perpetrator installs Trojan malware on the computer of the
    victim. He then tweaks the local DNS settings, so the victim is redirected to
    malicious sites. Router DNS hijack: most routers have firmware vulnerabilities
    or default passwords. When an attacker takes over a router, he can overwrite the
    DNS settings which affects all the users that are connected to the router. Man
    in the middle DNS attacks: a perpetrator intercepts communication between a DNS
    server and a user then gives another destination IP address that points to a malicious
    site. Rogue DNS Server: the perpetrator hacks a DNS server and tweaks DNS records.
    Consequently, DNS requests are redirected to malicious sites. A DNS spoofing attack
    occurs when an attacker redirects traffic from a legitimate site to a malicious
    site. DNS spoofing can be carried out using DNS redirection. For instance, by
    compromising a DNS server, attackers can spoof legitimate websites then redirect
    the users to other malicious sites. Cache poisoning can also be used to execute
    DNS spoofing without the need to rely on DNS hijacking.  A bad actor can put in
    an illegitimate DNS entry and poison the DNS cache. This entry contains an alternative
    IP destination. Until the cache is refreshed, the domain is resolved to the spoofed
    website. Strong security measures are required for a DNS name server since it
    is a very sensitive infrastructure. Hackers can hijack it and use it to execute
    DDoS attacks. Resolvers on the network: shut down any DNS resolvers that are not
    needed. As for the legitimate resolvers, ensure that they are behind a firewall
    and inaccessible from outside. Access to name servers should be restricted: use
    network security measures, firewall, physical security, and multi-factor access.
    Take caution against cache poisoning: lower/upper case in domain names and query
    ID should be randomized and try to use a random port source. Take care of known
    vulnerabilities: attackers are always looking for susceptible DNS servers. Resolver
    should be separated from authoritative name server: the two should not be run
    on the same server. Ensure that zone transfers are restricted. For end users,
    actions such as installing antivirus, changing router passwords, and use an encrypted
    VPN channel will protect them from DNS hijacking.


    Mitigation for Site Owners


    Steps to take:


    ●  DNSSEC


    ●  Client lock


    ●  Secure access


