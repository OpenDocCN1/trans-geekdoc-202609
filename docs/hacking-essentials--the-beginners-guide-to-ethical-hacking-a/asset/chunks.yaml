  fmt: "\n# Chapter 1: Phishing Attacks\n\nPhishing is a social engineering attack.\
    \ In most cases, it is used to access and steal user data such as credit card\
    \ numbers and login credentials. This kind of attack occurs when an intruder masquerades\
    \ as a trusted party and deceives the victim into opening a text message, instant\
    \ message, or email. Next, the victim is duped into clicking a link which allows\
    \ the attacker to freeze the system or install malware. This kind of attack can\
    \ be damaging and may lead to identity theft, stealing of funds, and unauthorized\
    \ purchases. In governmental or corporate networks, phishing grants the intruder\
    \ a foothold and opens the door for a larger attack like an APT (advanced persistent\
    \ threat). In an APT, the organization can suffer substantial financial losses\
    \ among many other damages.\n\nPhishing attack examples can be emails like for\
    \ example `myuniversity.edu` which may be sent out to faculty members. The email\
    \ tells the recipient that their user password is going to expire in a short time.\
    \ Instructions will be included, guiding the user to go to `myuniversity.edu/renewal`\
    \ so they can renew their password. When the recipient clicks the link, a few\
    \ things may happen:\n\n*   They may be redirected to a bogus page, `myuniversity.edurenewal.com`,\
    \ which is very similar to the actual renewal page. The user is asked to enter\
    \ the old and new password. The attacker monitors the page and gets the original\
    \ password which will give them access to the university network.\n*   The link\
    \ may redirect the user to the real password renewal page. During the redirection\
    \ process, the infiltrator activates a malicious script in the background, hijacking\
    \ the session cookie of the user. The result is a reflected XSS attack that gives\
    \ the attacker access to privileged information.\n\nEmail phishing scams are a\
    \ numbers game. The fraudulent message is sent to a huge number of recipients,\
    \ so even if only a small percentage of the recipients fall for this scam, the\
    \ attacker will still gather a lot of information. Intruders have techniques to\
    \ give them high success rates. They make sure the phishing message looks a lot\
    \ like an actual email from the targeted information. They create a sense of urgency\
    \ to push the recipients into action. The links included in the messages look\
    \ like the legitimate links.\n\nSpear phishing is not aimed at random people;\
    \ it targets a specific enterprise or person. It is an advanced version of phishing\
    \ and special knowledge about the organization is required. When an attacker gets\
    \ valid login credentials, they may successfully carry out a first stage APT.\n\
    \nTo protect an organization from phishing attacks, both the enterprise and users\
    \ need to take precautionary measures:\n\n*   **Users need to be vigilant.** Any\
    \ spoofed message has little mistakes that will expose it.\n*   **Enterprises\
    \ should follow several steps to reduce both spear phishing and phishing attacks:**\n\
    \    *   Establish a two-factor authentication (2FA). This method requires an\
    \ extra step of verification from users when they are accessing sensitive information.\n\
    \    *   In addition to 2FA, companies should have strict password management\
    \ policies. Employees should change their passwords regularly and use different\
    \ passwords for different applications.\n    *   The enterprise should organize\
    \ educational campaigns.\n\n---\n\n# Chapter 2: Advanced Persistent Threat (APT)\n\
    \nAn APT is a broad term. It describes an attack campaign by an intruder, where\
    \ they establish a malicious, long-term presence on a network with the aim of\
    \ mining sensitive data. The intruder or team of intruders carefully search and\
    \ pick their targets, usually government networks or large corporations. These\
    \ intrusions can cause a lot of damage, including:\n\n*   Theft of intellectual\
    \ property\n*   Compromise of sensitive information\n*   Total takeover of sites\n\
    *   Sabotaging of critical infrastructure\n\nAPT attacks are a little different\
    \ from traditional web application attacks in that:\n\n*   They are executed manually\n\
    *   They are way more complex\n*   They are never hit-and-run attacks\n*   Their\
    \ goal is usually to penetrate an entire network\n\n## APT Progression\n\nA successful\
    \ advanced persistent threat happens in three stages:\n\n1.  **Infiltration:**\
    \ In most cases, enterprises are infiltrated via the compromising of one of the\
    \ following: authorized human users, network resources, or web assets. This can\
    \ be achieved through social engineering attacks such as spear phishing or malicious\
    \ uploads such as SQL injection. Moreover, intruders can execute a DDoS attack\
    \ simultaneously against the target. This distracts the network personnel and\
