    ![image](d2d_images/chapter_title_above.png)


    # Chapter 10


    # Intrusion Detection and Intrusion Prevention


    ![image](d2d_images/chapter_title_below.png)


    Intrusion detection and intrusion prevention are both broad terms. They describe
    practices in application security that are used to reduce attacks and prevent
    new threats. Detection is a reactive measure. It identifies and neutralizes ongoing
    attacks with an intrusion detection system. It weeds out existing malware and
    checks social engineering assaults. Intrusion is proactive. It uses intrusion
    prevention systems to block application attacks preemptively. An IDS is a software
    application or a hardware device that detects and analyzes outbound and inbound
    network traffic using known intrusion signatures to check for abnormal activities.


    This is achieved through:


    ●  Comparing system files against malware signatures


    ●  Detecting signs of harmful patterns by scanning processes


    ●  Detecting malicious intent by monitoring user behavior


    ●  Monitoring system configurations and settings'
