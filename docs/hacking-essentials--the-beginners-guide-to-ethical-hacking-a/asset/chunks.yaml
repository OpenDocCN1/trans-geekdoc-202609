- raw: 'A cyber-attack, just like any other ambitious endeavor, must be planned carefully
    and executed precisely for it to be successful. According to industry research,
    advanced attacks remain inside organizations’ systems for an average of 200 days
    before they are discovered. If you think of it, that is a long time. All this
    while, an attacker is gathering data, mapping the network, and monitoring communications.
    If you understand the steps that attackers take to successfully carry out an attack,
    from their point of view, then you can either prevent it from happening to your
    organization or reduce the time it takes to discover it. Reconnaissance means
    checking out something before acting. Hackers start by identifying a weak target
    and they then come up with the best way to exploit it. They learn the structure
    of the organization, look for any weak link employees, and decide whether to attack
    a third party or the company website.  Anyone can be the initial target. All the
    attackers need is a single point of entry. Once the hackers have identified a
    target, they look for a weak point that will give them access. They do this by
    checking the organization’s network using tools from the internet known as scanning.
    This process can take some time. Access and Escalation will take place once they
    have identified the vulnerabilities in the network, they access it and move through
    it without being detected. In situations like these, they need privileged access
    so that they can move freely. Tools such as rainbow tables help hackers steal
    credentials and give them admin privileges. They can then access any system through
    the administrator’s account. With the elevated privileges, the intruders have
    basically taken over and now “own” the network. With the ability to move freely
    around the network, hackers can access the most sensitive data in an organization’s
    system and extract it. They may not only be interested in stealing private data—if
    they want, they can delete or change files. Their next step is to remain in the
    network quietly. They may decide to install rootkits and other malicious programs
    that allow them to come back as often as they want. Now that they have elevated
    privileges, they are not relying on a single point of entry. Every cyber-attack
    will not have an assault mode. In this stage, things can get very ugly. The intruders
    may change the functionality of the hardware or even disable it completely. In
    this step, the attackers may not be quiet any more. Sometimes, hackers will want
    to cover their tracks while other times, they can decide to leave a calling card.
    A trail obfuscation is meant to disorientate, confuse, and divert the process
    of forensic examination. Some of the tools and techniques covered in trail obfuscation
    include Trojan commands, zombie accounts, backbone hopping, misinformation, spoofing,
    and log cleaners. About 97% of organizations have been compromised at least once,
    according to Mandiant. The most effective defense against a cyber-attack is to
    control privileged access.


