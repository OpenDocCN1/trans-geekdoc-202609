    # Chapter 12


    # Clickjacking


    ![image](d2d_images/chapter_title_below.png)


    Clickjacking is a cyber\-attack in which the victim is tricked into clicking an
    invisible web element or one that is represented as another element. The victim
    can then unknowingly download malware, give sensitive information/credentials,
    visit malicious pages, buy products online, or transfer money.  Usually, in a
    clickjacking attack, an invisible HTML element or page is displayed within an
    iframe at the top of the user’s current web page. The user clicks on it thinking
    it is the visible page while, in fact, it is an invisible element. The invisible
    page may be a page that the victim had no intention to visit or a malicious page.
    Clickjacking attacks occur in several forms such as: likejacking: a trick that
    manipulates the Facebook “Like” button, causing people to like pages that they
    did not mean to like. Cursor jacking: a technique in which the position of the
    cursor is changed. This attack used to rely on susceptibilities in Firefox and
    Flash—which have since been fixed.


    Clickjacking Attack Example'
