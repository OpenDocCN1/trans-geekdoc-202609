    are discussed here in detail. IoT Devices are managed both externally (interaction
    with other devices) and internally (software maintenance). Every device is connected
    to a command and control center (C&C) which is the management unit. These centers
    take care of firmware updates, configurations, and software maintenance. They
    are also responsible for authentication of tasks. Communication between IoT devices
    are through APIs (application program interfaces). When the API of a device is
    exposed, other applications or devices can gather data through it and communicate.


    ## IoT Security Issues and Vulnerabilities

