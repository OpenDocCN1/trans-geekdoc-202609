    # Chapter 11: Ping Sweep


    When a security policy violation, configuration error, or a virus is detected,
    an IDS can get the offender off the network and inform security personnel of the
    incident. An IDS has immense benefits including attack detection and network traffic
    analysis. However, it has its downside. It may not detect newly discovered threats
    because it only uses known intrusion signatures. Moreover, an IDS does not detect
    incoming assaults, only ongoing attacks. An intrusion prevention system, therefore,
    is necessary.


    An IPS (Intrusion Prevention) inspects the incoming traffic of a system and removes
    any malicious requests. A regular IPS configuration utilizes traffic filtering
    solutions and web application firewalls to secure applications. It drops malicious
    packets, blocks malevolent IPs, and informs security personnel of any potential
    threats. Because systems like these use an already existing database for signature
    recognition, they can be programmed to identify attacks based on behavioral and
    traffic anomalies. IPS systems are very efficient when it comes to blocking attack
    vectors, but they still have limitations. They rely too much on predefined rules
    and are, therefore, vulnerable to false positives.


    Imperva cloud WAF solutions are totally customizable tools. They block any security
    threats and reduce false positives. Here are some of Imperva cloud WAF IPS features:


    *   **WAF (web application firewall):** This cloud-based firewall is placed on
    the edge of your network. It will secure your existing IPS using signature, behavioral,
    and reputational heuristics to filter application attacks and malicious incoming
    requests. There are advanced features such as application-aware technologies,
    dynamic profiling, and access control to mitigate false positives.

    *   **Custom rules:** Imperva cloud WAF capabilities are expanded to allow you
    to apply your own access control and security policies. Customization is useful
    in mitigating false positives and removing any hidden threats that are unique
    to your organization.

    *   **Two-factor authentication (2FA):** 2FA requires users to go through two
    means/steps of verification when they are logging into a system such as a one-time
    passcode (OTP) and a password. This extra layer of protection protects sensitive
    data.

    *   **Backdoor protection:** Since IDS configurations rely on known malware signatures
    to identify backdoors, it is a halfway measure. Perpetrators can easily avoid
    recognition. Backdoor Protection from Imperva solves this problem fully.


    ## Ping Sweep


    Ping is the network-based utility of a system used to know whether a host is dead
    or alive. Technically, it is called an echo reply. The term "alive" here means
    that the host (website, network, system, computer, etc.) is active. The term "dead"
    means that it is in shutdown mode.


    > **Note:** A host can be anything such as a network, printer, computer system,
    website, or any other device.


    So, what is a Ping sweep? It is a technique of gathering information that is used
    to identify the hosts that are alive by pinging them. To go into more technical
    details: A Ping sweep can also be referred to as a two-way handshake protocol,
    an ICMP sweep (Internet Control Message Protocol), or a Ping scan. A host sends
    packets (data), another host validates it and returns feedback (packets, again)
    confirming whether the ping was successful—that is why it is called a two-way
    handshake protocol.


    There are several purposes for which a Ping sweep can be used: After identifying
    the host''s IP address, you can ping the address to know whether the host is dead
    or alive. If the packets are correctly received, then you know that the host is
    alive, and you can continue with your attack on the victim (the host).


    There are so many tools available for a regular Ping sweep such as `Nmap`, `gping`,
    and `fping`. You can also do it directly on Linux and Windows platforms using
    looping shell script.


    To do it on Windows:

    1.  Go to **Start** > **Run** > `CMD`.

    2.  Type `PING 127.0.0.1` (host''s IP address).


    ### Flood Pinging


    Flood Pinging is a type of denial attack. It is done by flooding many pings to
    a host or a website. The result of this is that a legitimate or normal user will
    be unable to access that website since every host (victim network or website)
    has a maximum capacity limit. Flood Pinging goes beyond that limit and jams the
    network. The host will then stop responding.


    Flood Pinging is done by creating automated scripts or with the use of a flood
    Pinging software. Sometimes flood Pinging is referred to as the Ping of Death
    because when it is carried out, it causes the host to act like a dead host.


    > **Note:** This can only be successful if the bandwidth of the attacker is more
    than that of the host. Doing this in groups, however, can do the trick.


    Generally, not many website owners have unlimited bandwidth plans because they
    are too expensive. They opt, instead, for other plans (like 10GB bandwidth). If
    you try to flood Ping from a 2 or 4 Mbps connection, you will not be successful.
    If you do it with a group of, say, 20 people, you may succeed. Launching the attack
    from 20 computers at the same time, each with a 2 Mbps connection will see your
    host get hit with 40 Mbps. Is this possible when the bandwidth of the host is
    10GB? Hackers usually create many connections from one PC, and this is enough
    to slow down the database and functionality of the website.


    # Chapter 12: Clickjacking


    Clickjacking is a cyber-attack in which the victim is tricked into clicking an
    invisible web element or one that is represented as another element. The victim
    can then unknowingly download malware, give sensitive information/credentials,
    visit malicious pages, buy products online, or transfer money.


    Usually, in a clickjacking attack, an invisible HTML element or page is displayed
    within an `iframe` at the top of the user''s current web page. The user clicks
    on it thinking it is the visible page while, in fact, it is an invisible element.
    The invisible page may be a page that the victim had no intention to visit or
    a malicious page.


    Clickjacking attacks occur in several forms such as:


    *   **Likejacking:** A trick that manipulates the Facebook "Like" button, causing
    people to like pages that they did not mean to like.

    *   **Cursor jacking:** A technique in which the position of the cursor is changed.
    This attack used to rely on susceptibilities in Firefox and Flash—which have since
    been fixed.


    ## Clickjacking Attack Example

