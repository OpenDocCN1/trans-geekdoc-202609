  trans: '

    当新的蠕虫或病毒发起攻击时，系统管理员和用户通常会措手不及。但是，一两年后，系统管理员和用户继续让相同的威胁未被检测到，这可以接受吗？您的 ISP 和互联网上大量的带宽是否应该继续被蠕虫流量和病毒消耗，而这些本可以轻松预防？最近许多蠕虫和病毒的攻击目标是早已有补丁可用的漏洞，甚至早在数月前就已发布补丁。如果管理员和用户能及时修补漏洞，病毒根本不会对其系统构成威胁。另一点是，当出现新威胁时，操作系统和杀毒软件供应商会推出更新和补丁以覆盖漏洞或检测并清除威胁，所有用户都应采取必要措施保护其系统和互联网社区的其他成员。但如果用户无知或选择不采取任何必要行动来遏制威胁，反而传播感染；社区应该做出回应吗？根据许多人的观点，这在伦理和道德上是错误的。这被视为私刑执法。持这一观点的人认为，报复并自行处理问题，在法律上讲，使你与最初的威胁一样糟糕。最近互联网上传播着
    W32/Fizzer@MM 蠕虫。一些运营商决定编写代码以自动禁用该蠕虫。这段代码被移除，以便对该策略的合法性进行进一步调查。它应该被合法化吗？在上述情况下，任何未感染的机器都不会受到影响。运营商并没有创建反蠕虫程序，而更像是一种“疫苗”代码，且该代码位于一个已被蠕虫感染的站点上。只有拥有受感染设备的人才会想要连接到该站点。即使这些设备的所有者不知道蠕虫的存在，运营商通过清理他们的设备，仍然是在为他们提供服务，对吧？这种行为可以定义为自卫，但在这种情况下，存在用户甚至不知道自己被感染的情况。当一个无防护的用户被感染时，整个互联网都处于风险之中。虽然这样的用户对其设备拥有主权，但他们对互联网的其他部分没有主权。当用户连接到互联网时，应该有准则约束每一位用户。与现实生活不同，没有互联网警察部队。然而，应该有一个或多个组织拥有制定病毒疫苗或反蠕虫程序的权限。它们将寻找受感染的计算机并尝试清理它们。从道德上讲，入侵某人的计算机以尝试清理它，并不比最初攻击该设备的蠕虫或病毒更糟糕。这是一个滑坡谬误，反黑客行为处于降至恶意开发者水平与合理自卫之间的灰色地带。


