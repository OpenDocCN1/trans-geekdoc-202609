    # Chapter 29


    # Malvertising


    ![image](d2d_images/chapter_title_below.png)


    This is when an attacker inserts malicious code into online advertising networks.
    This code then sends users to fraudulent websites. This attack gives hackers an
    opportunity to target users of reputable websites such as The London Stock Exchange,
    The Atlantic, The New York Times Online, and Spotify. The ecosystem of online
    advertising is a very complex network. It involves content delivery networks (CDNs),
    retargeting networks, ad servers, ad exchanges, and publisher sites. When an internet
    user clicks on a certain ad, several redirections between various servers occur.
    A perpetrator takes advantage of this complexity and places his malware in places
    that ad networks and publishers would not suspect. People often confuse malvertising
    with adware or ad malware. Adware is a program that runs on the computer of the
    user. In most cases, it is embedded in legitimate software and the user installs
    it unsuspectingly. It mines the user’s data for the purpose of targeting advertisements,
    brings up unwanted ads, and redirects the user’s search requests to other advertising
    websites. Ad malware and malvertising are different in several ways: Adware targets
    individual users while the malicious code in malvertising is deployed to the web
    page of an advertiser. The only people affected by malvertising are those who
    visit the infected web page while adware continues to operate on the infected
    computer.


    Effects of Malvertisements on Web Users'
  fmt: '

    有时，Rootkit 嵌入在可信软件中，用户在不知情的情况下安装了它们。当软件被授予管理员权限在系统上安装时，Rootkit 也会隐蔽地安装。


    ## Blended Threat


    Rootkit 本身没有感染计算机的能力。攻击者可能会创建混合威胁，利用各种漏洞来攻破系统。在许多情况下，这是通过将 Rootkit 与 Loader 和
    Dropper 合并来实现的。


    **Dropper**：这是黑客用于在受害者计算机上安装 Rootkit 的文件或程序。分发 Dropper 的方法有多种，包括通过暴力攻击或社会工程学攻击。


    **Loader**：一旦用户启动了 Dropper 程序（通过执行或打开文件），一段恶意代码（即 Loader）就会启动。


    Rootkit 有多种类型，包括：


    *   **Application or user-mode rootkit**：这些在应用层运行。它们可以更改 API 和应用程序行为。应用层 Rootkit
    容易被检测到，因为杀毒程序在同一层运行。

    *   **Kernel-mode**：它们部署在操作系统的内核模块中。在这里，它们可以控制各种系统进程。很难检测它们。

    *   **Bootkits**：这些通过感染 MBR（主引导记录）来接管目标系统。它们使恶意软件能在操作系统加载前运行。

    *   **Firmware rootkits**：它们渗透运行设备的系统，如系统 BIOS、硬盘、网卡和路由器。

    *   **Rootkit hypervisors**：它们通过利用硬件虚拟化功能来接管机器。


    ## Anti-Rootkit Measures


    为了保护系统免受 Rootkit 侵害，你需要扫描任何现有的恶意软件，并防止任何新程序被安装。


    **Rootkit scanners**：这些是解析系统以移除活动 Rootkit 的程序。这些扫描器可能对某些 Rootkit 帮助不大，你应该结合使用多个扫描器。


    **Preemptive blocking**：这涉及培训组织中的用户，避免打开或下载来自可疑来源的文件。


