- raw: 'It is a suite of extensions that enhance DNS (Domain Name System) security
    by confirming that the results have not been compromised. DNSSEC can help enterprises
    reinforce their DNS security. DNS spoofing is a good example of an attack on the
    infrastructure of DNS. A perpetrator hijacks the cache of a DNS resolver. When
    users visit that website, they receive the wrong IP address and view the malicious
    site of the attacker instead of the legitimate site. Organizations can use DNSSEC
    to protect definitions and sensitive data in their DNS server. Host information,
    mail exchange server details, and IP addresses are examples of data found in the
    DNS. DNSSEC protects this data. It can also block data exfiltration done via DNS.
    DNSSEC tries to make sure that replies sent to clients by name servers are authentic.
    This is done with digital signature technology. Cryptographic signatures are added
    to DNS records hence protecting the information published in the DNS. DNSSEC defines
    new resource record types for DNS to enhance digital signature validation. Resource
    record signature has cryptographic signature for a specific record set. DNSKEY
    record has a public key which is used in the authentication process of the DNS.
    The DNS namespace can be divided into several zones in a process called DNS delegation.
    A DS (delegation signer) is a fingerprint of the public DNSKEY. It is kept in
    the parent zone. NSEC (next secure record) uses the DNSSEC sorting order to bring
    up the next valid record name. Consequently, a DNS resolver can disprove the existence
    of a DNS record. NSEC3 overcomes the NSEC-walking potential by hashing all record
    names cryptographically in a zone.


    NSEC3 Parameter (NSEC3PARAM)


    It provides the DNS server with parameters to determine the NSEC3 records that
    will be included in responses to DNSSEC requests for names that do not exist.
    DNSSEC can verify DNS requests and is, therefore, useful for reducing DNS spoofing
    risks. It does not, however, address DDoS (Distributed Denial of Service) attacks
    that leverage DNS servers. As a matter of fact, it can amplify the effect of the
    attack. DNSSEC has additional cryptographic information and fields to verify records,
    so the replies sent for DNS questions are larger here. Large responses make it
    possible for the perpetrator to gain much more attack volume.


    DNSSEC Validation Process


    These are the stages of a DNSSEC validation process: A user enters a URL address.
    The browse queries the DNS resolver of the local computer to determine the hostname
    IP address. If the IP address is in the resolver cache, it gives feedback to the
    browser. If it is not found, the request is passed to a recursive resolver. If
    this one has the address, it returns it. If not, a recursive query is started
    to identify the DNS server holding the requested domain authoritative information.
    The root DNS server is contacted first and refers the resolver to the TLD (top-level
    domain) DNS server for that domain. The resolver will then be referred by the
    TLD DNS to an authoritative name server. In all stages, the resolver will request
    the DNSSEC key associated with the DNS zone. This is to verify the authenticity
    of the server. The resolver will validate the RRSIG and confirm that it was not
    tampered with in transit.


