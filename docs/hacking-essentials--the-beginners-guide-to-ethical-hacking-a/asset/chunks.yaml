    \ and remote control.\n2.  **Expansion:** Once they have established a foothold,\
    \ they spread their presence. They move up the hierarchy of the organization and\
    \ compromise staff members by accessing very sensitive data. In this process,\
    \ they gather the business’ critical information such as financial records, employee\
    \ data and product line information. They can sell this information to competitors\
    \ or sabotage the product line and destroy the company.\n3.  **Extraction:** During\
    \ the APT event, the thieves store the stolen data somewhere within the network\
    \ they are assaulting, in a secure place. After they have collected enough data,\
    \ they extract it quietly without being noticed. Your security team is distracted\
    \ using white noises as the information is being extracted.\n\n## Mitigation Strategies\n\
    \n*   The best way to block the extraction of stolen data and prevent the installation\
    \ of backdoors is monitoring egress and ingress traffic. Make a habit of inspecting\
    \ traffic in your network perimeter so any unusual behavior does not go unnoticed.\n\
    *   Deploy a web application firewall on your network perimeter to help filter\
    \ the traffic being driven to your web application servers. Network firewalls\
    \ and other internal traffic monitoring services can also help.\n*   Whitelisting\
    \ controls the domains that are accessible from your network and the applications\
    \ that users can install. It reduces the attack surfaces that are available to\
    \ intruders. This security measure is not foolproof. To make it more effective,\
    \ always have strict updated policies so that your users run updated versions\
    \ of your applications.\n*   Your employees are the largest and the most susceptible\
    \ soft-spot. There are three categories of targets:\n    *   Careless users\n\
    \    *   Malicious insiders\n    *   Compromised users\n*   Carefully review all\
    \ your employees and the information that they have access to.\n*   Always patch\
    \ any OS and software network vulnerabilities as soon as they are uncovered.\n\
    *   Encrypt remote connections so that intruders do not use them to access your\
    \ network.\n*   Filter incoming emails. This prevents phishing attacks and spam.\n\
    *   Log security events immediately to improve whitelists and any other policies.\n\
    \n---\n\n# Chapter 3: Penetration Testing\n"
  trans: "\n\n# 第 1 章：网络钓鱼攻击\n\n网络钓鱼是一种社会工程学攻击。在大多数情况下，它被用于访问并窃取用户数据，例如信用卡号和登录凭证。当入侵者伪装成受信任的一方，并欺骗受害者打开短信、即时消息或电子邮件时，就会发生此类攻击。随后，受害者被诱导点击链接，从而允许攻击者冻结系统或安装恶意软件。这种攻击具有破坏性，可能导致身份盗窃、资金被盗和未经授权的购买。在政府或企业网络中，网络钓鱼授予入侵者立足点，并为更大规模的攻击（如\
    \ APT，高级持续性威胁）打开大门。在 APT 攻击中，组织可能遭受重大经济损失以及许多其他损害。\n\n网络钓鱼攻击示例可以是电子邮件，例如 `myuniversity.edu`，可能会发送给教职员工。邮件告知收件人其用户密码将在短时间内过期。邮件将包含说明，引导用户前往\
    \ `myuniversity.edu/renewal` 以更新密码。当收件人点击链接时，可能会发生以下几种情况：\n\n*   他们可能被重定向到一个虚假页面\
    \ `myuniversity.edurenewal.com`，该页面与实际的更新页面非常相似。系统要求用户输入旧密码和新密码。攻击者监控该页面并获取原始密码，从而获得对大学网络的访问权限。\n\
    *   链接可能将用户重定向到真实的密码更新页面。在重定向过程中，入侵者在后台激活恶意脚本，劫持用户的会话 Cookie。结果是形成了一次反射型 XSS 攻击，使攻击者能够访问特权信息。\n\
    \n电子邮件钓鱼诈骗是一场数字游戏。欺诈性消息会发送给大量收件人，因此即使只有极少比例的收件人上当受骗，攻击者仍能收集大量信息。入侵者拥有提高成功率的技巧。他们确保钓鱼消息看起来非常像目标机构发出的实际邮件。他们制造紧迫感，迫使收件人采取行动。消息中包含的链接看起来像合法链接。\n\
    \n鱼叉式网络钓鱼并非针对随机人员；它针对特定企业或个人。它是网络钓鱼的高级版本，需要关于组织的特殊知识。当攻击者获取有效的登录凭证时，他们可能成功实施第一阶段的\
    \ APT 攻击。\n\n为了保护组织免受网络钓鱼攻击，企业和用户都需要采取预防措施：\n\n*   **用户需要保持警惕。** 任何伪造的消息都会有一些小错误暴露其真面目。\n\
    *   **企业应遵循以下几个步骤，以减少鱼叉式网络钓鱼和网络钓鱼攻击：**\n    *   建立双因素认证 (2FA)。此方法要求用户在访问敏感信息时进行额外的验证步骤。\n\
    \    *   除了 2FA，公司还应制定严格的密码管理策略。员工应定期更换密码，并为不同的应用程序使用不同的密码。\n    *   企业应组织教育宣传活动。\n\
    \n---\n\n# 第 2 章：高级持续性威胁 (APT)\n\nAPT 是一个宽泛的术语。它描述了入侵者发起的一次攻击活动，旨在在网络上建立恶意的长期存在，以窃取敏感数据。入侵者或入侵者团队会仔细搜寻并挑选目标，通常是政府网络或大型企业。这些入侵可能造成巨大损害，包括：\n\
    \n*   知识产权窃取\n*   敏感信息泄露\n*   网站完全被接管\n*   关键基础设施遭到破坏\n\nAPT 攻击与传统的 Web 应用程序攻击略有不同，因为：\n\
    \n*   它们是人工执行的\n*   它们复杂得多\n*   它们绝非一击即走式攻击\n*   它们的目标通常是渗透整个网络\n\n## APT 发展阶段\n\
    \n一次成功的高级持续性威胁分三个阶段发生：\n\n1.  **渗透：** 在大多数情况下，企业是通过以下方式之一被渗透的：授权人类用户、网络资源或 Web\
    \ 资产遭到攻陷。这可以通过社会工程学攻击（如鱼叉式网络钓鱼）或恶意上传（如 SQL 注入）来实现。此外，入侵者可以同时对目标发起 DDoS 攻击。这会分散网络人员的注意力并削弱安全边界。一旦实现初始访问，入侵者就会安装后门\
    \ Shell。这种恶意软件赋予他们网络访问权限和远程控制权。\n2.  **扩展：** 一旦建立了立足点，他们就会扩大存在范围。他们沿着组织的层级向上移动，通过访问高度敏感的数据来攻陷员工。在此过程中，他们收集企业的关键信息，如财务记录、员工数据和产品线信息。他们可以将这些信息出售给竞争对手，或破坏产品线并摧毁公司。\n\
    3.  **提取：** 在 APT 事件期间，窃贼将窃取的数据存储在他们正在攻击的网络内部某个安全的地方。收集到足够数据后，他们会在不被察觉的情况下悄悄提取数据。当信息被提取时，您的安全团队会被“白噪音”干扰分散注意力。\n\
    \n## 缓解策略\n\n*   阻止被盗数据提取和防止后门安装的最佳方法是监控出站和入站流量。养成检查网络边界流量的习惯，以便任何异常行为都不会被忽视。\n\
    *   在网络边界部署 Web 应用程序防火墙，以帮助过滤发往 Web 应用程序服务器的流量。网络防火墙和其他内部流量监控服务也有帮助。\n*   白名单控制网络可访问的域和用户可安装的应用程序。它减少了入侵者可利用的攻击面。此安全措施并非万无一失。为了使其更有效，始终要有严格的更新策略，确保用户运行应用程序的更新版本。\n\
    *   您的员工是最大且最脆弱的软肋。目标分为三类：\n    *   粗心的用户\n    *   恶意内部人员\n    *   被攻陷的用户\n* \
    \  仔细审查所有员工及其有权访问的信息。\n*   一旦发现操作系统和软件网络漏洞，立即修补。\n*   加密远程连接，以防入侵者利用它们访问您的网络。\n\
    *   过滤传入邮件。这可以防止网络钓鱼攻击和垃圾邮件。\n*   立即记录安全事件，以改进白名单和任何其他策略。\n\n---\n\n# 第 3 章：渗透测试\n\
    \n"
