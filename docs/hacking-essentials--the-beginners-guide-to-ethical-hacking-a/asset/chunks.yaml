    # Chapter 26


    # Spear Phishing


    ![image](d2d_images/chapter_title_below.png)


    This is a form of social engineering attack where an attacker pretends to be a
    trusted individual and tricks the victim into clicking a malicious link in a text
    message or spoofed email. The user then unsuspectingly installs malware on their
    computer/network, carries out the first stage of an ATP, or gives out sensitive
    information, among other consequences. Although spear phishing appears like whaling
    attacks and phishing, it is a little different from typical social engineering
    attacks and is executed in an unusual way. Due to this, you need to give it special
    attention when creating a security strategy. Here is an example of a spear phishing
    attack and consequences. A person who claims to represent a database management
    SaaS provider, www.itservices.com, sends a spoofed email to the sysadmin of an
    enterprise. The mailing template he uses is that of itservices.com.  The email
    says that there is a new service being offered by itservices.com for a limited
    amount of time. It goes on to invite users to use the enclosed link and sign up.
    Once the sysadmin clicks on the link, they are taken to a login page on a website,
    itservice.com. It looks so much like the registration page of itservices.com. 
    Currently, the perpetrator installs a control and command agent on the computer
    of the sysadmin. From there, he can use it as a backdoor into the network of the
    enterprise and can carry out stage one of an APT.


    Phishing and Whaling Attacks Vs. Spear Phishing


    Whaling attacks, phishing, and spear phishing are different in terms of the victims
    they target and their sophistication levels. In a phishing attack, the perpetrator
    sends a malicious email pretending to be a trusted party to as many users as possible.
    For instance, an attacker may send out an email that appears to be from PayPal.
    The email asks the user to click on the enclosed link and verify their credentials.
    This may lead to malware being installed on the recipient’s computer. Phishing
    emails are not usually personal, they contain mistakes such as spelling errors
    and are sent in bulk. Many people never see these hints. Spear phishing emails
    are not easy to detect. They look like they are from someone close to the target
    and the emails themselves are personalized. Whaling targets decision makers in
    high levels of an organization. These executives have access to very sensitive
    information such as passwords to admin accounts, trade secrets, etc. The perpetrator
    sends an email pretending to be an organization or individual, such as a client.
    Whaling attacks target specific individuals using information sourced from the
    press, websites, or social media. While whaling attacks target high-level individuals,
    spear phishing attacks go for low profile targets.


    Spear Phishing Mitigation


    Two-factor authentication: users are required to go through two layers/steps of
    verification.


    Password management policies: this policy will ensure that employees do not use
    corporate passwords on malicious websites. Educational campaigns: train employees
    and raise awareness.


