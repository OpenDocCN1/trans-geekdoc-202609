- raw: 'This is a general term that refers to the act of an attacker intercepting
    conversations between an application and a user. He can masquerade as one of the
    parties or eavesdrop making it seem as though the conversation is normal. The
    aim of a MITM is to steal credit card numbers, account details, login credentials,
    and other sensitive information. Attackers typically target users of e-commerce
    sites, SaaS businesses, financial applications, and other sites that require logging
    in.  The information that a perpetrator gathers in an attack like this one can
    be used for all kinds of purposes such as unauthorized password changes, illicit
    fund transfers, and identity theft. Moreover, the attacker can use it to attain
    a foothold in a secured network in the infiltration stage of an ATP (advanced
    persistent threat). To have a better understanding of a MITM attack, think of
    a mailman accessing your bank statements, taking your details, and delivering
    the envelope to you after resealing it. There are two distinct phases of a successful
    MITM attack: interception and decryption. In this first step, the attacker uses
    his network to intercept user traffic before it gets to the intended destination.
    The simplest and most common way of accomplishing this is by making free Wi-Fi
    hotspots that are malicious. He makes them available to the general public. These
    hotspots are not usually protected by passwords. When a user connects their device
    to this network, the perpetrator can access their online data exchange. Some attackers
    may prefer to take an active approach via the following methods: IP spoofing:
    a perpetrator changes IP address packet headers and masquerades as an application.
    Any user that tries to access the application’s URL gets redirected to the website
    of the attacker. ARP spoofing: an attacker uses fake ARP messages to link a legitimate
    user’s IP address with his MAC address. Once this happens, data that is supposed
    to go to the host IP address from the user goes to the attacker. DNS spoofing:
    this is where a DNS server is infiltrated, and the address record of the website
    changed. Once the interception step is successful, a two-way SSL traffic must
    be decrypted discreetly without the knowledge of the application or the user.
    There are several ways of accomplishing this: HTTPS spoofing: a phony certificate
    is sent to the browser of the victim after the first successful connection to
    a secure site. SSL BEAST: malicious JavaScript is injected into the user’s computer
    making it possible to intercept any encrypted cookies sent from a web application.
    SSL hijacking: in a TCP handshake, the perpetrator passes a fake authentication
    key to the application and the user. SSL tripping: where HTTPS connections are
    downgraded to HTTP.


    Man in the Middle Attack Prevention


    For users:


    ●  Avoid suspicious Wi-Fi connections


    ●  Heed browser warnings about unsecured websites


    ●  Always log out of apps


    ●  Avoid public networks


    Website operators should reinforce secure communication protocols by ensuring
    the encryption and authentication of transmitted data.


