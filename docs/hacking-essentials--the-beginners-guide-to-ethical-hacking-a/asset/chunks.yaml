    # Chapter 14


    # PCI DSS


    ![image](d2d_images/chapter_title_below.png)


    The PCI DSS (Payment Card Industry Data Security Standard) is a series of security
    standards created by American Express, JCB International, Discover Financial Services,
    MasterCard, and Visa in 2004. The compliance scheme is governed by the PCI SSS
    (Security Standard Council) and its goal is to protect debit card and credit card
    transactions from fraud and data theft. The PCI SSC cannot legally compel compliance
    but all businesses that process debit or credit card transactions are required
    to have PCI certification. PCI certification safeguards your business’ card data
    using requirements formed by the PCI SSC. Some of the requirements are well-known
    practices such as:


    ●  Using anti-virus software


    ●  Encryption of data transmissions


    ●  Firewalls installation'
  fmt: '

    # Chapter 13: Social Engineering


    Social engineering refers to malicious attacks carried out via human interactions.
    These attacks manipulate the victim psychologically, causing them to give sensitive
    information or make a security mistake. A social engineering attack can happen
    in multiple steps or just one. The attacker researches the target victim to get
    background information. Next, he/she tries to win the trust of the victim and
    encourages them to take a subsequent action that compromises sensitive information.
    Social engineering attacks are dangerous because instead of relying on weaknesses
    in an operating system or software, they rely on human error.


    There are many types of social engineering attacks and they can be carried out
    anywhere if there is human interaction. However, some forms are more common than
    others and here are five of the well-known ones:


    ## Baiting

    Baiting attacks prey on a victim''s curiosity or greed. The perpetrator lures
    the victim into a trap, giving them the ability to install malware or steal sensitive
    information. Physical media is widely used in this kind of social engineering
    attack. A malicious hacker may leave a flash drive infected with malware as bait
    in a conspicuous area such as a parking lot, bathroom, elevator, etc. As soon
    as the victim inserts the drive into a home or work computer, the system becomes
    infected.


    ## Scareware

    Scareware is also known as fraudware, rogue scanner software, and deception software.
    It slaps victims with fictitious threats and false alarms. The attacker leads
    the user to think that their system has malware. He then prompts the victim to
    install a (fake) anti-malware software. This software is usually malware. Scareware
    attacks are usually presented in the form of a genuine-looking popup in a browser
    informing you of a possible virus in your system. They can also arrive via spam
    emails.


    ## Pretexting

    Pretexting is when a perpetrator uses lies to gather information. He asks for
    sensitive information from the victim by impersonating tax officials, a bank,
    a co-worker, or the police. In most cases, he will ask questions prompting you
    to confirm your identity. A lot of personal information can be stolen using this
    tactic, such as phone records, phone numbers, and social security numbers.


    ## Phishing

    Phishing is a very popular kind of social engineering attack. A phishing scam
    is a text message or email campaign that tries to create a sense of fear, curiosity,
    or urgency in the victim. The victims are then tricked into clicking on malicious
    links, opening malware-laden attachments, or giving sensitive information.


    ## Spear Phishing

    Spear Phishing is a type of phishing scam but it is usually targeted. The perpetrator
    chooses certain enterprises or individuals. He then crafts a very specific message
    based on the victim''s contacts, job position, or characteristics. He impersonates
    his victim and tricks their co-workers or contacts into giving sensitive information.


    ## Clickjacking

    The perpetrator builds an enticing page where the user is promised a free trip
    to Hawaii. The attacker checks in the background to see whether the victim is
    logged onto their banking site. If they are logged on, the perpetrator loads the
    page that allows for funds transfer and then uses query parameters to fill his
    bank credentials into the form. The money transfer page is placed in an invisible
    `<iframe>` at the top of the gift page. The "Confirm Transfer" button is aligned
    exactly on top of the "Receive Gift" button. The victim goes to the page and innocently
    clicks on the "Book My Free Trip" button. What the user does not know is that
    they are clicking on a hidden frame and they just clicked on "Confirm Transfer"
    and they unknowingly send money to the perpetrator. The victim is again redirected
    to a web page with details about the gift. They still have no idea what just happened.


    There are two main ways to prevent a clickjacking attack:


    ### Client-side methods

    **Frame Busting** is the most common here. Client-side methods are effective sometimes,
    but they can be bypassed easily so they are not the best.


    ### Server-side methods

    **X-Frame-Options** is the most common. Security experts recommend these methods.


    ### Reducing Clickjacking with X-Frame-Options Response Header

    This method indicates whether a browser has permission to have a page inside an
    `<iframe>` or `<frame>` tag. The `X-Frame-Options` header allows three values:


    *   **DENY**: No domain can display the page within a frame.

    *   **SAMEORIGIN**: The page can be displayed in a frame on other pages if they
    are within the current domain.

    *   **ALLOW-FROM URI**: An in-frame display of the current page is only allowed
    in a specific URI.


    ### Limitations of X-Frame-Options

    *   The `SAMEORIGIN` option does not allow for cross-site application.

    *   You cannot create a whitelist of allowed domains.

    *   You cannot use several options on a single page.

    *   Not all browsers support the `ALLOW-FROM` option.

    *   Most browsers have deprecated `X-Frame-Options`.


    ## Social Engineering Prevention

    *   Have anti-malware or antivirus software and keep it updated.

    *   Do not accept tempting offers.

    *   Consider using multi-factor authentication.

    *   Do not open suspicious emails or attachments.


    ---


    # Chapter 14: PCI DSS


    The **PCI DSS** (Payment Card Industry Data Security Standard) is a series of
    security standards created by American Express, JCB International, Discover Financial
    Services, MasterCard, and Visa in 2004. The compliance scheme is governed by the
    **PCI SSC** (Security Standards Council) and its goal is to protect debit card
    and credit card transactions from fraud and data theft. The PCI SSC cannot legally
    compel compliance but all businesses that process debit or credit card transactions
    are required to have PCI certification. PCI certification safeguards your business''
    card data using requirements formed by the PCI SSC. Some of the requirements are
    well-known practices such as:


    *   Using anti-virus software

    *   Encryption of data transmissions

    *   Firewalls installation

    '
