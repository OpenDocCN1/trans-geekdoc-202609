- raw: 'When a new worm or virus attacks, system administrators and users are usually
    caught by surprise.  But, is it okay for system administrators and users to continue
    having the same threats go undetected a year or two later? Should a significant
    size of the bandwidth on your ISP and the internet keep on being eaten up by worm
    traffic and viruses which can be easily prevented?  Many of the recent worms and
    viruses have aimed their attacks at vulnerabilities that already have patches
    available even months prior. If the administrators and users would patch up the
    susceptibilities in time, the virus would not be a threat to their systems at
    all. Another thing, when there is a new threat around OS and antivirus vendors
    come up with updates and patches to cover any vulnerabilities or detect and remove
    the threat, all users should take the necessary measures to protect their systems
    and the rest of the internet community.  But what if a user is ignorant or chooses
    not to take any necessary actions to keep the threat at bay, and propagates the
    infection; should the community respond? According to many people, it is ethically
    and morally wrong. It is considered vigilantism. People who stand for this point
    believe that retaliating and taking the matter into your own hands makes you just
    as bad as the original threat, legally speaking. There was the W32/Fizzer@MM worm
    that was spreading around the internet recently. Some operators decided to write
    code in order to disable the worm automatically. This code was removed to allow
    for further investigations on the legalities of a strategy like this. Should it
    be legalized? In a case like the one above, any uninfected machine will not be
    affected. The operators did not create an anti-worm but something more of a “vaccine”
    code and it was on a site that was already infected by the worm. Only the people
    who had infected devices would want to connect to the site. Even if the owners
    of these devices were ignorant of the worm, the operators were still doing them
    service by cleaning up their devices, right? This action can be defined as self-defense
    but in this situation, there is the case of users who do not even know that they
    are infected. When an unprotected user is infected, the entire internet is at
    risk. Although a user like this one has sovereignty over their device, they do
    not have sovereignty over the rest of the internet. There should be guidelines
    that every user is subjected to when they connect to the internet.  Unlike in
    real life, there is no internet police force. There should, however, be an organization
    or several of them with the authority to come up with virus vaccines or counter-worms.
    They will be looking for infected computers and try to clean them up. Invading
    someone’s computer in attempt to clean it is not any worse than the worm than
    the worm or virus that attacked the device in the first place, ethically speaking. 
    This is a slippery slope and counter-hacking is a gray area between sinking to
    the level of the malicious developer and reasonable self-defense.


