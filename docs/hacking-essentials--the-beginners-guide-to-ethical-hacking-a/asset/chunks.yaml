    # Introduction


    ![image](d2d_images/chapter_title_below.png)


    One effective way of ensuring that your IT infrastructure, services, and applications
    are secure is by asking a freelance white hat hacker to hack it. Whether you like
    it or not, hackers will penetrate your system, so it will benefit you to be a
    part of the process in order to tie up loose ends. Unfortunately, many companies
    do not have enough resources for penetration testing. Crowdsourcing is a great
    option for small companies that need this service at a lower price. You can get
    the talent you need at the right time—and at an affordable price. When you do
    not personally know the players, you are at risk of having someone who is not
    as experienced as they claim or one who will not do the job well. The biggest
    risk is that they will keep the information they gather and use it later. Fortunately,
    there are trusted firms that act as intermediaries between you and the hackers.
    They connect you with a skilled, vetted hacker, and offer the framework and program,
    at a fee. Some of the biggest and most common crowdsourcing companies include
    HackerOne, Bugcrowd, and Synack. These companies, and others like them, offer
    three main services:


    ●  Bug bounty programs


    ●  Penetration testing


    ●  Vulnerability disclosure


    Vulnerability Disclosure involves the customer creating and publishing a vulnerability
    disclosure program. It defines how and where hackers can contact the intermediary
    or customer with newly discovered bugs. Included are the expectations and responsibilities
    of the hacker, the intermediary, and the customer. There are hackers who have
    been known to irresponsibly disclose their findings to the public before they
    gave the vendor a chance to patch up the vulnerabilities. However, they only did
    that because they were frustrated by the company’s unreasonable response. Penetration
    testing is the service that generates the most money for crowdsourcing businesses.
    They connect a customer with a group of highly skilled hackers at a certain price
    for a specific scope of work. Most hackers that work with these companies do it
    part-time—not many of them do it full-time. The amount of money that a crowdsourced
    hacker can make on a single job depends on the kind of job they get selected for,
    experience, and skill set. Some hackers do it voluntarily to secure the government
    resources of their country while others give their earnings to charity. Bug bounty
    firms can save you a lot of money and time. All hacker-reported bugs are not easily
    reproducible or a threat to security. Bug bounty program vendors tell you the
    reported bugs that you need to fix. Their job is to figure out which bugs are
    real. It does not matter how good your IT security team is, companies should require
    a bug bounty program. Depending on the duration of the project, amount of work
    experience, and level of the hackers, this may cost you anywhere from a few thousand
    dollars to tens of thousands of dollars. Determine your budget and the type of
    services you want done. If you are sure crowdsourcing is necessary, talk to a
    firm that will manage the process for you and remove much of the risk.


