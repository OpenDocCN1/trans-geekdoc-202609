    # Chapter 11


    # Ping Sweep


    ![image](d2d_images/chapter_title_below.png)


    Ping is the network\-based utility of a system used to know whether a host is
    dead or alive. Technically, it is called an echo reply. The term “alive” here
    means that the host (website, network, system, computer, etc.) is active. The
    term “dead” means that it is in shutdown mode. Note: a host can be anything such
    as a network, printer, computer system, website, or any other device.  So, what
    is a Ping sweep? It is a technique of gathering information that is used to identify
    the hosts that are alive by pinging them. To go into more technical details: A
    Ping sweep can also be referred to as a two-way handshake protocol, an ICMP sweep
    (Internet Control Message Protocol) or a Ping scan. A host sends packets (data),
    another host validates it and returns feedback (packets, again) confirming whether
    the ping was successful—that is why it is called a two-way handshake protocol.
    There are several purposes for which a Ping sweep can be used: After identifying
    the host’s IP address, you can ping the address to know whether the host is dead
    or alive. If the packets are correctly received, then you know that the host is
    alive, and you can continue with your attack on the victim (the host). There are
    so many tools available for a regular Ping sweep such as Nmap, gping and fping.
    You can also do it directly on Linux and Windows platforms using looping shell
    script. To do it on Windows, go to Start > Run > CMD. Next, type PING 127.0.0.1
    (host’s IP address). Flood Pinging is a type of denial attack. It is done by flooding
    many pings to a host or a website. The result of this is that a legitimate or
    normal user will be unable to access that website since every host (victim network
    or website) has a maximum capacity limit. Flood Pinging goes beyond that limit
    and jams the network. The host will then stop responding. Flood Pinging is done
    by creating automated scripts or with the use of a flood Pinging software. Sometimes
    flood Pinging is referred to as the Ping of Death because when it is carried out,
    it causes the host to act like a dead host. Note: this can only be successful
    if the bandwidth of the attacker is more than that of the host. Doing this in
    groups, however, can do the trick. Generally, not many website owners have unlimited
    bandwidth plans because they are too expensive. They opt, instead, for other plans
    (like 10GB bandwidth). If you try to flood Ping from a 2 or 4 Mbps connection,
    you will not be successful. If you do it with a group of, say 20 people, you may
    succeed. Launching the attack from 20 computers at the same time, each with a
    2 Mbps connection will see your host get hit with 40 Mbps. Is this possible when
    the bandwidth of the host is 10GB? Hackers usually create many connections from
    one PC, and this is enough to slow down the database and functionality of the
    website.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


