    # Chapter 24


    # Web Scraping


    ![image](d2d_images/chapter_title_below.png)


    This is where bots are used to extract data and content from websites. It is different
    from screen scraping in that, instead of copying pixels on the screen, it extracts
    the underlying HTML code along with the data in a database. Next, this scrapper
    may replicate this website content somewhere else. There are different types of
    digital businesses that depend on data harvesting and they use web scraping for
    that. Some legitimate uses include: When search engine bots crawl a site to analyze
    its content for the purpose of ranking. Sites that compare prices deploy bots
    to fetch product descriptions and prices for seller websites. Market research
    organizations may use scrapers to fetch data from social media and forums. Web
    scraping can be used by perpetrators to carry out illegal reasons like stealing
    copyrighted content and undercutting prices. The results of such an action can
    have severe repercussions for an online entity such as financial losses— it is
    even worse if the business is a content distributor or depends on competitive
    pricing models. Scraper Tools and Models are software designed to maneuver through
    databases and fetch data. Different types of bots are used. They are customized
    to:


    ●  Identify one-of-a-kind HTML site structures


    ●  Store the scraped data


    ●  Extract API information


    ●  Extract and change content


    All types of scraping bots are meant to access data from sites, so it is not easy
    to tell the malicious ones from the legitimate ones. However, there are two major
    differences that may help to differentiate the two: If a bot is legitimate, it
    is identified with the company that uses it. Take the example of a Googlebot.
    In the HTTP header, it identifies itself with Google. Suspicious bots impersonate
    real traffic and create a fake HTTP user agent. Bots from legitimate organizations
    abide the robot.txt file of a site, which has a list of all pages that the bot
    can access and those that it is not. Malicious bots crawl a website with no regard
    for whatever is allowed. There are so many resources required to run web scraping
    bots. When an attacker cannot afford these resources, he opts for a botnet.


    Malicious Web Scraping Examples


    Web scraping is malicious when it is done without a website owner’s permission.
    The most common cases include content theft and price scraping.


    Price Scraping


    In this case, an attacker uses a botnet to send scraper bots to survey databases
    of competing businesses with the goal of boosting sales, undercutting rivals and
    accessing pricing information. These attacks are common in industries where price
    has a huge effect on purchasing decisions. Content Scraping involves the stealing
    of large amounts of content from a certain site. Websites that depend on digital
    content and online product catalogues are the most targeted.


    Web Scraping Protection


    Most measures have become ineffective due to the advancement of scraper bots.
    Granular traffic analysis is one of the best methods for countering bot operations.
    It is characterized by cross verification of factors such as:


    ●  HTML fingerprint


    ●  IP reputation


    ●  Behavior analysis


    ●  Progressive challenges


