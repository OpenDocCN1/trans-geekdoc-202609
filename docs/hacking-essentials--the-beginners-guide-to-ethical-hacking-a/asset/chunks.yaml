    # Web Application Security


    It is the protection of online services and websites from various security threats
    that seek to take advantage of vulnerabilities in the code of an application.
    Content management systems such as `WordPress`, SaaS applications, and database
    administration tools are the most common targets for these attacks. Attackers
    always target web applications because:


    *   They have a complex source code and are, therefore, likely to have unattended
    vulnerabilities.

    *   There is so much to gain in terms of sensitive private information gathered
    when a source code is successfully manipulated.

    *   The attacks are easy to execute because they can be automated and deployed
    indiscriminately to thousands upon thousands of targets at once.


    Web applications that are not secured are at a higher risk of being attacked.
    The results of these attacks include legal proceedings, revoked licenses, damaged
    relationships with clients, and information theft. Vulnerabilities are caused
    by the lack of code sanitization which attackers use to gain access or manipulate
    the source code. The vulnerabilities allow for the following attack vectors:


    ## SQL Injection

    An attacker manipulates a backend database using malicious SQL code, giving him
    access to information. He can then go on and illegally view lists, gain administrative
    access, or delete tables.


    ## Cross-site Scripting (XSS)

    This is an attack in which the perpetrator targets users so they can modify page
    content, activate Trojans, or access accounts.


    ## Remote File Inclusion

    This attack is used to inject a file remotely into a web application server. Malicious
    code or scripts can then be executed in the application. The attacker may also
    steal or manipulate data.


    ## Cross-site Request Forgery (CSRF)

    This attack may lead to unauthorized transfer of funds, data thefts, or password
    changes. It occurs when an attacker uses a malicious web application to make your
    browser execute unwanted action.


    Theoretically, thorough input/output sanitization can remove all vulnerabilities
    and make an application safe from unlawful manipulation. However, complete sanitization
    is never practical as many applications are in a developmental state continually.
    Additionally, applications integrate with each other frequently creating a very
    complex coded environment.


    ## Web Application Firewall (WAF)

    `Web Application Firewall (WAF)` are software and hardware solutions that are
    used to mitigate application security threats. They are developed to evaluate
    incoming traffic and block any attack attempts. To deploy a `WAF`, you do not
    need to change your application. Various heuristics are used by `WAFs` to identify
    the traffic that can interact with an application and that which needs to be blocked.
    A signature pool that is constantly updated lets them identify bad actors instantly.
    Most `WAFs` can be customized to suit a specific security case and to take care
    of any emerging threats.


    ## Other Security Methods

    Other than `WAFs`, web applications can be secured using other methods. These
    processes must be in every checklist:


    *   **Information gathering**: Review the application manually to know client-side
    codes and entry points.

    *   **Authorization**: Have the application tested for path transversals.

    *   **Cryptography**: Ensure that all data transmissions are secured.

    *   **Denial of service**: Enhance reinforcement against denial of service threats.


    ---


    # Conclusion


    Originally, the term “hacker” referred to a programmer who was skilled in computer
    operating systems and machine code. Today, it refers to anyone who performs hacking
    activities. Hacking is the act of changing a system’s features to attain a goal
    that is not within the original purpose of the creator. The word “hacking” is
    usually perceived negatively especially by people who do not understand the job
    of an ethical hacker. In the hacking world, ethical hackers are good guys. What
    is their role? They use their vast knowledge of computers for good instead of
    malicious reasons. They look for vulnerabilities in the computer security of organizations
    and businesses to prevent bad actors from taking advantage of them.


    For someone that loves the world of technology and computers, it would be wise
    to consider an ethical hacking career. You get paid (a good amount) to break into
    systems. Getting started will not be a walk in the park—just as with any other
    career. However, if you are determined, you can skyrocket yourself into a lucrative
    career.


    When you decide to get started on this journey, you will have to cultivate patience.
    The first step for many people is usually to get a degree in computer science.
    You can also get an `A+` certification (`CompTIA`)—you must take and clear two
    different exams. To be able to take the qualification test, you need to have not
    less than 500 hours of experience in practical computing. Experience is required,
    and a `CCNA` or `Network+` qualification to advance your career.


    Once you get the necessary qualifications, you are ready to move on to the next
    stage in network support. In this step, you will do things like updating and monitoring,
    testing for weakness, and installing security programs. You will need experience
    in the network security field and your goal should be to become a network engineer.
    With experience in network support, you can expect to start earning a great salary.
    Instead of supporting networks, you will be planning and designing them. Since
    you want to become an ethical hacker, your focus should be on the Security part
    of things. Work at getting a security certification such as `TICSA`, `CISSP`,
    or `Security+`. Information Security is very crucial.


    You will now be in Information Security. Your role will be to evaluate the network
    and system security, and deal with any security breaches. While working here,
    focus on penetration testing and try to obtain a `CEH` (`Certified Ethical Hacker`)
    certification. Your main role as an ethical hacker is to use all your security
    and technical knowledge to try and breach network securities. You will then give
    a detailed report of your findings and suggestions to improve the network. The
    average salary for ethical hackers is $71,000 (without bonus payments) or more
    to freelance depending on experience or skills.


