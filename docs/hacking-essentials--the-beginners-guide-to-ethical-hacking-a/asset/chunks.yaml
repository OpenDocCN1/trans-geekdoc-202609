    # Chapter 9


    # Reflected Cross Site Scripting (XSS) Attacks


    ![image](d2d_images/chapter_title_below.png)


    A web application susceptibility that allows an intruder to inject code into an
    outside website’s contents is what is referred to as a cross-site scripting (XSS).
    When someone visits the infected page on that website the code is executed in
    their browser. Because of this, the intruder bypasses the “same origin policy”
    of the browser and can access private information from the victim. A Reflected
    XSS attack, also called a non-persistent attack. It occurs when a malevolent script
    reflects off a web app to a victim’s browser. The script is activated using a
    link. A request with a vulnerability is send to a website and this enables malicious
    scripts to be executed. This vulnerability is usually caused by not sanitizing
    incoming requests sufficiently which opens the web application’s functions to
    manipulation. An attacker embeds the malicious link into a third-party website
    or an email to distribute it. The link prompts the user to click on it and this
    initiates the XSS request.  Reflected attacks differ from stored attacks in that,
    the latter requires the attacker to look for a website that will allow for the
    injection of the malevolent script while with a reflected attack, the script is
    embedded on a link. For this incident to be successful, the user must click on
    the link.


    Stored and reflected XSS attacks have some differences:


    ●  Reflected attacks are far more common


    ●  Vigilant users can avoid reflected attacks


    ●  The two don’t have the same reach


    The attacker in a XSS attack plays a number game. He sends the link to thousands
    of users to increase his chances of success. Even if a very small fraction of
    the users decides to click on the link, he will still have a good number of infected
    forum users. These users will be directed to the forum’s website and the malevolent
    script will reflect on their browser. Consequently, the perpetrator can hijack
    their accounts by stealing their session cookies. You can prevent and mitigate
    an XSS attack in several ways. First, for users, being vigilant is the best defense
    against XSS scripting. To be specific, users should avoid clicking on any suspicious
    links because you never know which one contains a malicious code. You can find
    suspicious links in:


    ●  Social media feed


    ●  Emails send by unknown contacts


    ●  The comment section of a website


    A website operator should also protect their users from potential abuse.


    Web application firewalls (WAFs) go a long way in preventing reflected XSS attacks.
    They can block abnormal requests where input sanitization is lacking. In a stored
    attack, the malicious request of a perpetrator to a site is blocked while in a
    reflected attack, the request of the user is blocked. This protects the user and
    collateral damage (other website users). Some web application firewalls counter
    reflected XSS attacks using signature filtering. These WAFs use crowdsourcing
    technology to automatically collect attack data from an entire network.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) ||  || ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


