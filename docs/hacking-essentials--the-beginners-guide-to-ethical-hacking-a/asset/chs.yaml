  \ | --- | --- |\n\n![image](img/chapter_title_above.png)\n\n### Chapter 32\n\n###\
  \ Vulnerability Management\n\n![image](img/chapter_title_below.png)\n\n## What Is\
  \ Vulnerability Management?\n\n**Vulnerability（漏洞）**：应用程序中可被利用的弱点。漏洞被用于执行攻击，可能导致服务器被接管、恶意软件注入、数据窃取等后果。\n\
  \n**Vulnerability management（漏洞管理）**涉及在不法分子滥用这些弱点之前将其根除。实现这一目标的方法如下：\n\n- **Vulnerability\
  \ scanning（漏洞扫描）**：使用代码审查和渗透测试对代码环境进行清理。通常在应用程序更新后执行。\n- **Patch management（补丁管理）**：将新漏洞的补丁部署到您的应用程序所使用的第三方软件中。\n\
  - **Input validation/sanitization（输入验证/清理）**：使用 WAF 验证和过滤传入流量。因此，攻击在利用漏洞之前就被阻断了。这是清理应用程序代码的一个很好的替代方案。\n\
  \n在漏洞扫描中，使用基于硬件的扫描器或软件来识别攻击者可利用的代码中的薄弱环节。薄弱环节通常由未清理的代码引起。扫描通过代码审查和渗透测试来揭示应用程序中的弱点，然后进行代码更新以消除这些漏洞。随后进行一次重新扫描，以确保漏洞已不复存在。每当代码更新或发现新的攻击向量时，都应执行此过程。\n\
  \n一般来说，漏洞扫描存在若干操作问题。首先，新漏洞层出不穷。因此，扫描是一个频繁的过程，需要大量资源。即便如此，由于代码库处于持续变化状态，很难实现完全的代码清理。此外，您无法预测所有攻击场景。最后，漏洞扫描无法为新发现的威胁提供快速解决方案。这非常关键，因为许多漏洞利用会在新漏洞公布后立即执行。响应这些威胁所需的时间在任何漏洞管理策略中都至关重要。\n\
  \n第三方必须编制补丁并对其进行测试。然后您的 DevOps 和安全团队负责将这些补丁部署到您的系统中。补丁延迟经常发生，通常是因为：\n\n- 您的安全团队部署补丁并检查其实施所需的时间。\n\
  - 您的软件供应商设计和测试新补丁的能力。\n- 您的团队接收威胁通知所需的时间。\n\n**Input Validation/Sanitization（输入验证/清理）**是在网络边缘放置\
  \ WAF 的过程。它审查传入流量并过滤掉任何恶意输入。输入验证有效地解决了补丁管理和漏洞扫描的问题，原因如下：\n\n- **它不需要代码更新**：修补和扫描过程不是很有效，因为它们依赖于容易延迟的代码更新。\n\
  - **由安全专家处理**：一些 WAF 提供商将解决方案作为托管服务提供。\n- **它具有可自定义的安全规则**。\n- **Virtual patch management（虚拟补丁管理）**：这允许有效缓解即时威胁。\n\
  \n---\n\n| ![image](img/chapter_title_corner_decoration_left.png) ||  || ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n| --- | --- | --- | --- |\n\n![image](img/chapter_title_above.png)\n\n### Chapter\
  \ 33\n\n### Web Application Security\n\n![image](img/chapter_title_below.png)\n\n\
  \n\n\n# Web 应用安全\n\n它是保护在线服务和网站免受各种安全威胁的侵害，这些威胁试图利用应用程序代码中的漏洞。内容管理系统（如 `WordPress`）、SaaS\
  \ 应用程序和数据库管理工具是此类攻击最常见的目标。攻击者总是以 Web 应用程序为目标，因为：\n\n*   它们拥有复杂的源代码，因此很可能存在未被发现的漏洞。\n\
  *   一旦成功操纵源代码，攻击者可以获取大量敏感私人信息，获利巨大。\n*   攻击易于执行，因为它们可以实现自动化，并一次性不加区分地部署到成千上万个目标上。\n\
  \n未加防护的 Web 应用程序面临更高的被攻击风险。这些攻击的后果包括法律诉讼、许可证被吊销、客户关系受损和信息窃取。漏洞是由缺乏代码清理引起的，攻击者利用这一点来获取访问权限或操纵源代码。这些漏洞允许以下攻击向量：\n\
  \n## SQL 注入\n攻击者使用恶意 SQL 代码操纵后端数据库，从而获取信息访问权。随后，他可以非法查看列表、获得管理员访问权限或删除表。\n\n## 跨站脚本攻击\
  \ (XSS)\n这是一种攻击者以用户为目标的攻击，以便他们可以修改页面内容、激活特洛伊木马或访问账户。\n\n## 远程文件包含\n此攻击用于将文件远程注入\
  \ Web 应用程序服务器。随后可在应用程序中执行恶意代码或脚本。攻击者还可能窃取或操纵数据。\n\n## 跨站请求伪造 (CSRF)\n此攻击可能导致未经授权的资金转移、数据窃取或密码更改。当攻击者使用恶意\
  \ Web 应用程序诱导你的浏览器执行非预期操作时，就会发生这种情况。\n\n理论上，彻底的输入/输出清理可以消除所有漏洞，使应用程序免受非法操纵。然而，完全清理在实践中从来都不切实际，因为许多应用程序处于持续开发状态。此外，应用程序之间频繁集成，创造了一个非常复杂的编码环境。\n\
  \n## Web 应用防火墙 (WAF)\n`Web 应用防火墙 (WAF)` 是用于缓解应用安全威胁的软件和硬件解决方案。它们旨在评估传入流量并阻断任何攻击尝试。部署\
  \ `WAF` 无需更改你的应用程序。`WAF` 使用各种启发式方法来识别可以与应用程序交互的流量以及需要阻断的流量。一个持续更新的签名库让它们能即时识别恶意行为者。大多数\
  \ `WAF` 可定制以适应特定的安全场景，并应对任何新出现的威胁。\n\n## 其他安全方法\n除了 `WAF`，Web 应用程序还可以使用其他方法进行保护。这些流程必须包含在每个清单中：\n\
  \n*   **信息收集**：手动审查应用程序以了解客户端代码和入口点。\n*   **授权**：对应用程序进行路径遍历测试。\n*   **加密学**：确保所有数据传输均已加密保护。\n\
  *   **拒绝服务**：加强针对拒绝服务威胁的防护。\n\n---\n\n### 结论\n\n最初，“黑客”一词指的是精通计算机操作系统和机器代码的程序员。如今，它指从事黑客活动的任何人。黑客行为是改变系统特性以达到非创建者原始目的的目标的行为。“黑客”一词通常被负面看待，尤其是那些不了解道德黑客工作的人。在黑客世界里，道德黑客是好人。他们的角色是什么？他们利用自己渊博的计算机知识造福而非作恶。他们寻找组织和企业计算机安全中的漏洞，以防止恶意行为者利用它们。\n\
  \n对于热爱技术和计算机世界的人来说，考虑从事道德黑客职业将是明智之举。你可以通过“入侵”系统获得报酬（且数额可观）。起步并非易事——正如其他任何职业一样。然而，如果你下定决心，你可以迅速跻身于这一利润丰厚的职业。\n\
  \n当你决定踏上这段旅程时，你必须培养耐心。对许多人来说，第一步通常是获得计算机科学学位。你也可以获得 `A+` 认证 (`CompTIA`)，你必须参加并通过两门不同的考试。要参加资格考试，你需要拥有不少于\
  \ 500 小时的实际计算经验。需要经验，以及 `CCNA` 或 `Network+` 资格来提升你的职业生涯。\n\n一旦获得必要的资格，你就可以进入网络支持的下一阶段。在这一步中，你将进行更新和监控、弱点测试、安装安全程序等工作。你需要网络安全领域的经验，你的目标应该是成为一名网络工程师。凭借网络支持经验，你可以期待开始获得丰厚的薪水。你将不再只是支持网络，而是规划和设计它们。既然你想成为一名道德黑客，你的重点应放在安全方面。努力获得安全认证，如\
  \ `TICSA`、`CISSP` 或 `Security+`。信息安全至关重要。\n\n你现在将处于信息安全领域。你的角色将是评估网络和系统安全，并处理任何安全漏洞。在此工作期间，专注于渗透测试并尝试获得\
  \ `CEH` (`Certified Ethical Hacker` 认证道德黑客) 认证。作为一名道德黑客，你的主要角色是利用你所有的安全和技术知识尝试突破网络安全。然后，你将提供一份详细的发现报告和改进网络的建议。道德黑客的平均薪资为\
  \ 71,000 美元（不含奖金），自由职业者收入更高，具体取决于经验或技能。\n\n---\n\n### 参考文献\n\n*   Walker, Matt;\
