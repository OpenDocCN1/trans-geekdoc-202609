    \ fopen( )\n\n2.                                                                                          \
    \ feadfile( )\n\n3.                                                                                          \
    \ fgets( )\n\n4.                                                                                          \
    \ file( )\n\n5.  Answer:  D\n\nExplanation:\n\nfile( ) function can get the entire\
    \ contents of a file in such a way that it may be used as part of an expression.\n\
    \nfopen( ) opens a file.\n\nfgets() function returns a line from an open file.\n\
    \nreadfile( ) reads whole file to output buffer, but it cannot be used as part\
    \ of an expression.\n\n6.  Which following line is not correct?\n\nGiven: <input\
    \ type=”file” name=”FileUpLoad” size=”50”>\n\n<?php echo $\\_FILES\\[‘FileUpLoad’\\\
    ]\\[‘name’\\];?>  // line1\n\n<?php echo $\\_FILES\\[‘FileUpLoad’\\]\\[‘length’\\\
    ];?>  // line 2\n\n<?php echo $\\_FILES\\[‘FileUpLoad’\\]\\[‘type’\\];?>  // line\
    \ 3\n\n<?php echo $\\_FILES\\[‘FileUpLoad’\\]\\[‘error’\\];?>  // line 4\n\n1.\
