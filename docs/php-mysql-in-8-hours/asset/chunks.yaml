  trans: "\n\n子类的对象可以使用父类的变量和函数。\n\n## 示例：\n\n```php\nclass animal{\n    var $head;\n\
    \    function tail( ) {…}\n}\n\nclass dog extends animal{\n    // 子类定义\n}\n\n\
    $d = new dog( );\n$d->$head = “big”;\n$d->tail( );\n```\n\n## 解释：\n\n`$d` 是一个子类对象。\n\
    \n`$d->$head` 引用了父类的变量。\n\n`$d->tail( );` 调用父类的函数。\n\n`Class:: method ( )`\n\n\
    `Class` 可以使用 `::` 来引用变量或调用函数。\n\n| class-name :: variable;class-name :: function(\
    \ ); |\n| --- |\n\n## 示例：\n\n```php\nclass animal{\n    var head;\n    function\
    \ tail( ) {…}\n}\n\nclass dog extends animal{\n    animal :: head;\n    animal\
    \ :: tail( );\n}\n```\n\n## 解释：\n\n`“animal :: head;` 意味着在子类 `dog` 中，名为 `animal`\
    \ 的类引用了父类中的变量 `head`。\n\n`“animal::tail( );` 意味着在子类 `dog` 中，名为 `animal` 的类调用了父类中的函数\
    \ `tail( )`。\n\n# 附录 1：安全提示\n\n### 什么是安全代码？\n\n确保互联网上 PHP 网站的安全非常重要。来自匿名黑客的各种危险攻击。这些风险列举如下：\n\
    \n| 名称 | 恶意行为 |\n| --- | --- |\n| 跨站脚本 (XSS) | 窃取用户信息 |\n| 伪造表单 | 移除客户端数据 |\n\
    | SQL 注入 | 破坏数据库数据 |\n| 远程代码注入 | 被攻击者控制 |\n| 命令注入 | 执行恶意命令 |\n| 会话固定 | 设置他人的 SID\
    \ |\n| 会话劫持 | 劫持用户会话密钥 |\n| …… | …… |\n\n攻击者在 HTML 表单中输入恶意代码。\n\n```html\n<input\
    \ type=”password” name= “password”>\n<input type= “text” name= “characters” />\
    \ \n<textarea name = “words” rows= size1 cols= size2>\n```\n\n### 过滤恶意密码\n\n|\
    \ ctype\\_alnum( $\\_POST\\[ “password ” \\]) |\n| --- |\n`ctype\\_alnum ( )`\
    \ 仅接受 a 到 z 的字符和 0 到 9 的数字，并返回 true。不要允许 `<`, `%`, `!`, `#`, `$`, `%`, `^`, `&`,\
    \ `\\*` 以及任何其他符号。\n\n#### 示例：\n\n为了过滤恶意密码，PHP 代码如下：\n\n```php\n$clean = array(\
    \ );\nif ( ctype\\_alnum ( $\\_POST\\[“password”\\]))\n{\n    $clean \\[“password”\\\
    ] = $\\_POST\\[“password”\\]\n}\n```\n\n#### 解释：\n\n`“$clean = array( );` 定义了一个名为\
    \ `$clean$` 的数组。\n\n`“ctype\\_alnum ( $\\_POST\\[“password”\\])” 仅允许 a 到 z 和 0\
    \ 到 9，并返回 true。\n\n`“$clean \\[“password”\\]” 存储字符或数字，不包含其他符号如 `@`, `#`, `$`,\
    \ `%`, `&`, `<`, `%`, `!` ……`\n\n### 过滤恶意字符\n\n| ctype\\_alpha( $\\_POST\\[ “characters”\
    \ \\]) |\n| --- |\n`ctype\\_alpha( )` 仅接受 a 到 z 的字符，并返回 true。不要允许 0 到 9 的数字以及\
    \ `<`, `%`, `!`, `#`, `$`, `%`, `^`, `&` 等任何其他符号。\n\n#### 示例：\n\n为了过滤恶意字符，PHP\
    \ 代码如下：\n\n```php\n$clean = array( );\nif ( ctype\\_alpha ( $\\_POST\\[“characters”\\\
    ]))\n{\n    $clean \\[“characters”\\] = $\\_POST\\[“characters”\\]\n}\n```\n\n\
    #### 解释：\n\n`“$clean = array( );` 定义了一个名为 `$clean$` 的数组。\n\n`“ctype\\_alpha (\
    \ $\\_POST\\[“characters”\\])” 允许 a 到 z 的字符，并返回 true。\n\n`“$clean \\[“characters”\\\
    ]” 仅存储字符，不包含数字和其他符号如 `@`, `#`, `$`, `%`, `<`, `%`, `!`\n\n### 过滤恶意输入\n\n| str\\\
    _replace(\"ch1\", \"ch2 \", $\\_POST\\[“text” ) |\n| --- |\n`str\\_replace( )`\
    \ 可以将输入中的字符 `ch1` 替换为 `char2`。\n\n`$\\_POST\\[text\\]` 是用户输入的文本。\n\n#### 示例：\n\
    \n```php\n$clean = array( );\n$clean \\[“text\\]=str\\_replace(\"malicious\",\
    \ \" \", $\\_POST\\[text\\]);\n$clean \\[“text\\]= str\\_replace(\"%\", \"percent\"\
    , $\\_POST\\[text\\]);\n```\n\n#### 解释：\n\n`“str\\_replace(\"malicious\", \" \"\
    , $\\_POST\\[text\\]” 将 `malicious` 替换为空字符串。\n\n`“$str\\_replace(\"@\", \"(at)\"\
    , $\\_POST\\[text\\])” 将 `@` 替换为 `(at)`。\n\n`“str\\_replace(\"%\", \"percent\"\
    , $\\_POST\\[text\\])” 将 `%` 替换为 `percent`。\n\n`$clean\\[“text\\]` 存储了你需要的文本。\n\
    \n### 限制指定输入\n\n| in\\_array( $\\_POST\\[“words”], myarray ) |\n| --- |\n`in\\\
    _array ( )` 可以限制用户输入的单词。允许指定的单词。\n\n`in\\_array ( $\\_POST\\[“words”], myarray\
    \ )` 检查输入的单词是否在数组中。\n\n```php\n$clean = array( );\nif ( in\\_array(\\_POST\\[\\\
    \"words\\\"], myarray) )\n{\n    // 逻辑\n}\n```\n\n#### 解释：\n\n`$clean = array(\
    \ );` 检查了单词是否。\n\n。\n\n`text\n\n` 存储。\n\n"
- fmt: "\n| `mysql_close()` | Closes the connection with MySQL server |\n| `mysql_connect()`\
    \ | Creates an initial connection with MySQL server |\n| `mysql_create_db()` |\
    \ Creates a database on the MySQL server |\n| `mysql_data_seek()` | Adjusts the\
    \ result pointer to a random row in the results |\n| `mysql_db_query()` | This\
    \ function was deprecated in PHP 5.3.0 |\n| `mysql_error()` | Returns a string\
    \ with the error description |\n| `mysql_fetch_array()` | Returns an array of\
    \ strings associated with fetched row |\n| `mysql_fetch_assoc()` | Returns an\
    \ associative array of strings of fetched row |\n| `mysql_fetch_row()` | Returns\
    \ an indexed array of strings of the fetched row |\n| `mysql_free_result()` |\
    \ Clears the system memory associated with the result |\n| `mysql_get_server_info()`\
    \ | Returns a string with the MySQL server version |\n| `mysql_num_rows()` | Returns\
    \ the number of rows in the result set |\n| `mysql_query()` | Submits a query\
    \ to the database on the server |\n| `mysql_real_escape_string()` | Escapes special\
    \ characters in a string for MySQL |\n| `mysql_result()` | Returns a string of\
    \ one cell from a MySQL result set |\n| `mysql_select_db()` | Selects the database\
    \ to use by database name |\n\n# Appendix 3\n# 100 Tests for Interview, Answers\
    \ & Explanations\n\n## Chapter 1 PHP Basic\n\n### 1. Which following tags is not\
    \ for PHP?\n1. `<?php……?>`\n2. `<?......?>`\n3. `<script Language=”php”……</script>`\n\
    4. `<php…...>`\n\n(The answer & explanation is in the next page.)\n\n**1. Answer:\
    \ D**\n\nExplanation:\nA is PHP standard tag.\nB is PHP short tag.\nC is PHP script\
    \ tag.\nD is not a PHP tag.\nNote: short tag and script tag are considered deprecated\
    \ and strongly not recommended.\n\n### 2. Which following type is not for PHP\
    \ comment?\n1. `//` for PHP single line comment\n2. `#` for PHP single line comment\n\
    3. `( )` for PHP multi-line comment\n4. `/* */` for PHP multi-line comment\n\n\
    **2. Answer: C**\n\nExplanation:\n`( )` is not for PHP comments.\n\n### 3. Which\
    \ following express is not correct?\n1. `a += b` means `a = (a + b)`\n2. `a *=\
    \ b` means `a = (a * b)`\n3. `a != b` means `a = (a ! b)`\n4. `a %= b` means `a\
    \ = (a % b)`\n\n**3. Answer: C**\n\nExplanation:\n`!=` means “not equal to”.\n\
    About `!b`, if the variable `b` had a value of true, then `!b` would have a value\
    \ of false.\n\n### 4. Which following variable name is invalid?\n1. `$var`\n2.\
    \ `$_var`\n3. `$10var`\n4. `&$var`\n\n**4. Answer: C**\n\nExplanation:\nPHP variable\
    \ cannot start with numbers.\nPHP variables always start with a dollar sign, character\
    \ and underscore.\n`&$var` is a reference to the `$var` variable.\nVariable naming\
    \ rule:\n- It can start with a dollar sign `$`.\n- It can start with character\
    \ or underscore character.\n- It must not start with a number.\n\n### 5. Which\
    \ following operator description is not correct?\n1. `+` is used in addition\n\
    2. `–` is used in subtraction\n3. `*` is used in multiplication\n4. `%` is used\
    \ in division\n\n**5. Answer: D**\n\nExplanation:\n`%` is used in modulus. `/`\
    \ is used in division.\n\n### 6. Which following statement is not correct?\n```php\n\
    $num=1;\necho $num++; // line 1, output 1, $num now equals to 2.\necho ++$num;\
    \ // line 2, output 3, $num now equals to 3.\necho $num- -; // line 3, output\
    \ 3, $num now equals to 2.\necho - -$num; // line 4, output 2, $num now equals\
    \ to 1.\n```\n1. line 1\n2. line 2\n3. line 3\n4. line 4\n\n**6. Answer: D**\n\
    \nExplanation:\nIt should be: `echo - -$num; // line 4, output 1, $num now equals\
    \ to 1.`\n`$num++` returns current value, and then plus 1.\n`++$num` current value\
    \ plus 1, then returns new value.\n`$num- -` returns current value, and then minus\
    \ 1.\n`- -$num` current value minus 1, then returns new value.\n\n### 7. Which\
    \ following statement is not correct?\n```php\n$x=0; echo ~$x;      // line 1\
    \ outputs -1.\n$x=0; echo ~$x;      // line 2 outputs 1.\n$x=1; echo $x<<1;  \
    \   // line 3 outputs 2.\n$x=8; echo $x>>1;     // line 4 outputs 4.\n```\n1.\
    \ line 1\n2. line 2\n3. line 3\n4. line 4\n\n**7. Answer: B**\n\nExplanation:\n\
    `~` is bitwise operator “binary not”, which negates all the bits of an integer.\n\
    `<<` Bitwise left shift. `$x<<n` multiplies 2n.\n`>>` Bitwise right shift. `$x>>n`\
    \ divides 2n.\n\n### 8. Which following declaration of variable is correct?\n\
    1. `string $str=”PHP”;`\n2. `int $num=100;`\n3. `boolean $boo=true;`\n4. `$var=30;`\n\
    \n**8. Answer: D**\n\nExplanation:\nData type is not used to declare a variable.\n\
    \n### 9. When the value of Boolean is False, which number can be substitute?\n\
    1. -1\n2. 0\n3. 1\n4. Not above.\n\n**9. Answer: B**\n\nExplanation:\nBoolean\
    \ value 1, meaning true.\nBoolean value 0, meaning false.\n\n### 10. If you don’t\
    \ want the client to show the error of PHP running, which following configuration\
    \ should be set as “off” in php.ini?\n1. `show_errors`\n2. `log_errors`\n3. `display_errors`\n\
    4. `view_errors`\n\n**10. Answer: C**\n\nExplanation:\nFor security reasons, you\
    \ should set `display_errors` as “off” in php.ini.\n`log_errors` is used to record\
    \ the errors to the file.\n`A` and `D` are not configuration of php.ini.\n\n###\
    \ 11. What is the output in the following code?\n```php\n<?php\n$var=\"I like\
    \ PHP!\";\n$new_var=$var;\n$new_var=\"PHP is very good!\";\necho $var;\n?>\n```\n\
    1. I like PHP!\n2. PHP is very good!\n3. I like PHP! PHP is very good!\n4. PHP\
    \ is very good! I like PHP!\n\n**11. Answer: B**\n\nExplanation:\n`&` is used\
    \ to reference a variable. By reference, the left-hand operand becomes “connected”\
    \ with the right-hand one, `&` can reverse assign the value.\n```php\n$a=100;\n\
    $b=$a;\n$b=200;\necho $a; // outputs 200\n```\n\n### 12. Which following statement\
    \ is not correct?\n1. `\\n` can be used to move to a new line.\n2. `\\t` can be\
    \ used to tab across text area.\n3. `\\\"` can be used to show `\"` symbol.\n\
    4. `\\$` can be used to show variable value.\n\n**12. Answer: D**\n\nExplanation:\n\
    `\\$` is used to show `$` symbol.\n\n### 13. What is the output in the following\
    \ code?\n```php\n<?php\n$num=10;\nfunction test() { echo $num; }\ntest();\n?>\n\
    ```\n1. 10\n2. 0\n3. no output\n4. running failure\n\n**13. Answer: C**\n\nExplanation:\n\
    Local variable `$num` inside the function `test()` has not assigned any new value.\n\
    It should be changed the local variable as `global $num;`.\n```php\n<?php\n$num=10;\n\
    function test() { global $num; }\ntest();\n?>\n```\nThe output is 10.\n\n### 14.\
    \ Which following line is not correct?\n```php\n<?php\nfunction test() {\n   \
    \ static $var=sqrt(121); // line 1\n    $str=\"OK\";             // line 2\n \
    \   static $int=10;        // line 3\n    echo $int;             // line 4\n}\n\
    ?>\n```\n1. line 1\n2. line 2\n3. line 3\n4. line 4\n\n**14. Answer: A**\n\nExplanation:\n\
    `static` cannot define an expression. For example:\n`static $int=100+200; // error`\n\
    `static` only defines a variable.\n\n### 15. What is the output in the following\
