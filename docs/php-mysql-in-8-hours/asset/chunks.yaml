    ## 示例：


    ```php

    $add=100+200; echo $add;

    $div=800/2; echo $div;

    $mod=10%3; echo $mod;

    $inc=10; echo ++$inc;

    $str=”abc”.”de”; echo $str;

    ```


    ## 解释：


    `$add=100+200; echo $add;` 输出 300


    `$div=800/2; echo $div;` 输出 400


    `$mod=10%3; echo $mod;` 输出 1


    `$inc=10; echo ++$inc;` 输出 11


    `$str=”abc”.”de”; echo $str;` 输出 abcde。


    ## 逻辑运算符


    | 运算符 | 等价于 |

    | --- | --- |

    | `&&` | `and` |

    | `||` | `or` |

    | `!` | `not` |


    使用逻辑运算符后，结果将为真（true）或假（false）。


    ## 示例：


    ```php

    $x=true; $y=false;

    $a=$x && $y; echo $a; // 输出: false

    $b=$x || $y; echo $b; // 输出: true

    $c=! $x; echo $c; // 输出: false

    ```


    ## 解释：


    | `true && true; 返回 true;` | `true && false; 返回 false;` | `false &&false; 返回 false;`
    |

    | --- | --- | --- |

    | `true || true; 返回 true;` | `true || false; 返回 true;` | `false || false;return
    false;` |

    | `! false;返回 true;` | `! true;返回 false;` | |


    ## 赋值运算符


    | 运算符 | 示例： | 等价于： |

    | --- | --- | --- |

    | `+=` | `$x+=$y` | `$x=$x+$y` |

    | `-=` | `$x-=$y` | `$x=$x-$y` |

    | `*=` | `$x*=$y` | `$x=$x\*$y` |

    | `/=` | `$x/=$y` | `$x=$x/$y` |

    | `%=` | `$x%=$y` | `$x=$x%$y` |

    | `.`=` | `$x.=$y` | `$x=$x.$y` |


    ## 示例：


    ```php

    $x=200; $y=100;

    $x+=$y; echo $x;

    $x/=$y; echo $x;

    $x-=$y; echo $x;

    $m=”abc"; $n=”de";

    $m.=$n echo $m;

    ```


    ## 解释：


    `$x+=$y;` // `$x=$x+$y; echo $x;` 输出 300

    `$x/=$y;` // `$x=$x/$y; echo $x;` 输出 2

    `$x-=$y;` // `$x=$x-$y; echo $x;` 输出 100

    `$m.=$n;` // `$m=$m.$n; echo $m;` 输出 abcde


    ## 比较运算符


    | 运算符 | 说明 |

    | --- | --- |

    | `>` | 大于 |

    | `<` | 小于 |

    | `>=` | 大于等于 |

    | `<=` | 小于等于 |

    | `==` | 等于 |

    | `!=` | 不等于 |


    使用比较运算符后，结果将为真（true）或假（false）。


    ## 示例：


    ```php

    $a=100; $b=200;

    $result = ($a>$b); echo $result;

    $result = ($a==b); echo $result;

    $result = ($a!=$b); echo $result;

    ```


    ## 解释：


    `$result = ($a>$b);` 输出 false

    `$result = ($a==b);` 输出 false

    `$result = ($a!=$b);` 输出 true


    ## 三元运算符


    `表达式 (条件) ? 真值表达式 : 假值表达式`

    三元运算符类似于 `if-else` 语句。


    ## 示例：


    ```php

    $a=10;

    $b=20;

    $result = ($a>$b) ? "a" : "b"; echo $result; // 输出: b

    ```


    ## 解释：


    `$result = ($a>$b) ? "a" : "b";` 如果 `$a` 大于 `$b`，则返回 "a"，否则返回 "b"。


    ## 算运算符


    | 运算符 | 说明 |

    | --- | --- |

    | `++` | 自增 |

    | `--` | 自减 |

    | `+` | 加法 |

    | `-` | 减法 |

    | `*` | 乘法 |

    | `/` | 除法 |

    | `%` | 取模 |

    | `.` | 字符串连接 |


    ## 示例：


    ```php

    $x=10;

    echo ++$x; // 输出 11

    echo $x++; // 输出 11

    echo --$x; // 输出 10

    echo $x--; // 输出 10

    ```


    ## 解释：


    `++$x` 先自增后输出。

    `$x++` 先输出后自增。

    `--$x` 先自减后输出。

    `$x--` 先输出后自减。


    ## 运算符优先级


    | 运算符 | 优先级 |

    | --- | --- |

    | `++`, `--` (前置) | 最高 |

    | `*`, `/`, `%` | |

    | `+`, `-` | |

    | `.` | |

    | `==`, `!=` | |

    | `>`, `<`, `>=`, `<=` | |

    | `!` | |

    | `&&` | |

    | `||` | 最低 |


    在 PHP 中，运算符的优先级在 `if-else` 和三元运算符之前。


    ## 示例：


    ```php

    $result = 10 + 5 * 2; // 输出 20

    ```


    ## 解释：


    乘法 `*` 的优先级高于加法 `+`。


