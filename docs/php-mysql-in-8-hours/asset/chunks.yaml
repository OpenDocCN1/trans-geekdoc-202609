  trans: "\n\n当对不可访问的属性使用 `unset()` 时，会调用 `_unset()`。\n\n当脚本尝试将对象当作函数调用时，会调用 `_invoke()`。\n\
    \n### 4. 下面哪一个关键字可以用于连接接口？\n\n1. `extends`\n2. `implements`\n3. `interfaces`\n\
    4. `combines`\n\n4. 答案：B\n\n**解释：**\n\n`implements` 可以连接接口。例如：\n\n```php\ninterface\
    \ colors{\n    function show( );\n}\n\nclass green implements color{  // 使用 implement\
    \ \n    function show( ){\n        echo “Shows green”;\n    }\n}\n```\n\n### 5.\
    \ 在 PHP 中，我们可以使用 ____ 来声明抽象类。\n\n1. `abstract`\n2. `theoretical`\n3. `conceptual`\n\
    4. `intangible`\n\n5. 答案：A\n\n**解释：**\n\n`abstract` 可用于声明抽象类。例如：\n\n```php\nabstract\
    \ class color{  // 使用 abstract\nabstract function show( );\n}\n\nclass blue extends\
    \ color{\n    function show( ){\n        echo “Show blue”;\n    }\n}\n```\n\n\
    ### 6. 类和方法可以声明为 ____ 以防止进一步的继承。\n\n1. `private`\n2. `protected`\n3. `final`\n\
    4. `public`\n\n6. 答案：C\n\n**解释：**\n\n`final` 可以防止从其他类继承。\n\n```php\nfinal class\
    \ test{  // 声明 final\n    function abc( ){…}\n}\n```\n\n### 7. 要确定一个 PHP 变量是否是某个类的实例化对象，应该使用\
    \ ____？\n\n1. `_class()`\n2. `_object()`\n3. `_variable()`\n4. `instanceof`\n\n\
    7. 答案：D\n\n**解释：**\n\n`instanceof` 可以识别对象属于哪个类。\n\n例如：\n\n```php\nclass MyClass{\
    \ }\n$a = new MyClass;\nvar_dump($a instanceof MyClass);\n```\n\n输出结果：`bool(true)`\n\
    \n### 8. 在 PHP 5 中，所有对象都通过 ____ 传递。\n\n1. `value`\n2. `reference`\n3. `constant`\n\
    4. `variable`\n\n8. 答案：B\n\n**解释：**\n\nPHP 5 中的所有对象都通过引用传递。\n\n例如：\n\n```php\n\
    $myInstance=new myClass( );\n$copyInstance=$myInstance;\n```\n\n那么，$myInstance`\
    \ 和 `$copyInstance` 是同一个对象。\n\n### 9. 要检查对象中不存在的变量或方法，请使用 ________。\n\n1. `_isset()`\
    \ `_unset()`\n2. `_construct()` `_destruct()`\n3. `_sleep()` `_wakeup()`\n4. `_set()`\
    \ `_get()`\n\n9. 答案：D\n\n**解释：**\n\n`_set()` 和 `_get()` 可以检查对象中不存在的变量或方法。例如：\n\
    \n```php\nclass test{\n    function _set($name, $val){\n        echo “Nothing”;\n\
    \    }\n}\n\n$obj=new test( );\n$obj->myar=10;  /* $myvar 尚未定义，$obj 引用了一个不存在的变量。\
    \ */\n```\n\n### 10. 要防止方法被重写，在方法名之前使用 ____ 关键字。\n\n1. `public`\n2. `private`\n\
    3. `protected`\n4. `final`\n\n10. 答案：D\n\n**解释：**\n\n`final` 可以防止方法被重写。\n\n例如：\n\
    \n```php\nclass A{\n    final function test( ){ }\n}\n\nclass B extends A{\n \
    \   function test( ){ }  /* 类 B 中的 test() 不能重写类 A 中的 test()。 */\n}\n```\n\n---\n\
    \n# 第 10 章 错误\n\n### 1. 代码中下面哪行是不正确的？\n\n```php\n$a=100;\n$b=200;\nif ($a>$b {\
    \  // line 1\necho “$a is greater than $b.”;  // line 2\n}\nelse {  // line 3\n\
    echo “$a is less than $b”;  // line 4\n}\n```\n\n1. `line 1`\n2. `line 2`\n3.\
    \ `line 3`\n4. `line 4`\n\n1. 答案：A\n\n**解释：**\n\n`if()` 缺少一个“$)”。\n\n应该是：`if ($a>$b)`\n\
    \n### 2. 代码中下面哪行是不正确的？\n\n```php\n$a=100, b=200; // line 1\nif ($a>$b) {  \necho\
    \ “$a is greater than $b.”;  // line 2\n}\nelse {  // line 3\necho “$a is less\
    \ than $b”;  // line 4\n}\n```\n\n1. `line 1`\n2. `line 2`\n3. `line 3`\n4. `line\
    \ 4`\n\n2. 答案：A\n\n**解释：**\n\n“b” 缺少 `$` 符号。\n\n应该是：`$b=200;`\n\n### 3. 代码中下面哪行是不正确的？\n\
    \n```php\n$a=10;\ndo{\n$++;\nwhile\n```\n\n1. `line 1`\n2. `line 2`\n3. `line\
    \ 3`\n\n3. 答案：D\n\n**解释：**\n\n`while` 缺少一个表达式。\n\n### 4. 代码中下面哪行是不正确的？\n\n```php\n\
    <?php\n$str=\"\";\nfunction \n```\n\n1. `line 1`\n2. `line 2`\n3. `line 3`\n\n\
    4. 答案：A\n\n**解释：**\n\n`function` 缺少一个名称。\n\n### 5. 代码中下面哪行是不正确的？\n\n```php\n$a=100;\n\
    b=200; \nif ($a>$b) { \necho “$a is greater than $b.”; \n}\n```\n\n1. `line 1`\n\
    2. `line 2`\n3. `line 3`\n4. `line 4`\n\n5. 答案：A\n\n**解释：**\n\n`b` 缺少一个分号。\n\n"
