    \ `super::`\n2. `superior::`\n3. `parent::`\n4. `senior::`\n\n**10. Answer: C**\n\
    \n**Explanation:**\n`parent` can express parent class.\n\n## Chapter 7 MySQL\n\
    \n### 1. Which following command can create a new database?\n\n1. `create database-name;`\n\
