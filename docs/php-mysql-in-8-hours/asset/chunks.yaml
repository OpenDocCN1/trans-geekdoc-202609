    \n# Appendix 3\n\n# 100 Tests for Interview & Answers\n\n## What is PHP?\nPHP\
    \ is a server-side language for web development, meaning “Personal Homepage”.\
    \ The syntax of PHP looks like this:\n\n```php\n<?php\necho(\"Hello World!\");\n\
    ?>\n```\nOutput: `Hello World!`\n\nExplanation:\nPHP code begins with `<?php`\
    \ and ends with `?>`, its syntax looks like this:\n```php\n<?php\necho(\"Hello\
    \ World\");\n?>\n```\n`echo` is a command of PHP, meaning “output” or “display”.\
    \ `echo(\"Hello World\")` will output `Hello World`.\n\n## Reserved Words\nSome\
    \ words are only used by PHP itself. They may not be used when choosing identifiers\
    \ for variable, function, and labels. The following words are PHP reserved words:\
    \ `array`, `break`, `case`, `const`, `default`, `do`, `else`, `empty`, `eval`,\
    \ `extends`, `exit`, `false`, `for`, `foreach`, `global`, `if`, `include`, `include_once`,\
    \ `isset`, `list`, `new`, `null`, `print`, `require`, `require_once`, `return`,\
    \ `static`, `switch`, `unset`, `while`. \n\n`const` and `continue` are not used\
    \ as variable name, function name, or label name.\n\n## Comments\n`//` is used\
    \ in single-line comments. `/*……*/` are used in multi-line comments. `#` is used\
    \ in single-line comments sometimes.\n\n**Example:**\n```php\n<?php\necho(\"OK\"\
    ); // output OK.\necho(\"Hello\"); /* echo(\"Hello\"); is a PHP statement, echo\
    \ is a reserved word, it displays a word \"OK\". PHP is very easy to learn. */\n\
    ?>\n```\nOutput: `OK`\n\nExplanation:\n`// output OK;` is a single-line comment.\
    \ `/* echo(\"Hello\"); is a PHP statement, echo is a keyword, display a word OK.\
    \ PHP is very easy to learn.*/` is a multi-line comment.\n\n## Variables\nA variable\
    \ is a symbolic name associated with a value. Variable name starts with the `$`\
    \ symbol.\n\n**Example:**\n```php\n<?php\n$var;\n$abcde;\n$my_variable;\n?>\n\
    ```\nExplanation:\n`$var`, `$abcde` and `$my_variable` are all variables. They\
    \ can store some value, e.g.:\n```php\n$var=100;\n$abcde=\"Hello World\";\n$my_variable=true;\n\
    ```\nNotice that variable naming cannot start with number, cannot have space.\
    \ e.g., `$23var`, `$abc de` are invalid variable names. But `$var23`, `$abcde`\
    \ are valid variable names.\n\n## Data Types\n- **String**: characters within\
    \ double or single quotation.\n- **Integer**: numbers without decimal point.\n\
    - **Boolean**: a value with true or false.\n- **Float**: numbers with decimal\
    \ point.\n\n**Example:**\n```php\n$str='I am a string';\n$int=168;\n$float=12.88;\n\
    $bool=true;\n```\nExplanation:\n`$str='I am a string';` // `$str` data type is\
    \ `String`.\n`$int=168;` // `$int` data type is `Integer`.\n`$float=12.88;` //\
    \ `$float` data type is `Float`.\n`$bool=true;` // `$bool` data type is `Boolean`.\n\
    Note: Double quotes or single quotes are always used in string, e.g., `\"abcde\"\
    `, `'learning'`.\n\n## Escaping Characters\nThe `\\` backslash character can be\
    \ used to escape characters. `\\n` outputs content to the next new line. `\\r`\
    \ outputs a carriage return. `\\t` makes a tab. `\\\"` outputs a double quote.\
    \ `\\'` outputs a single quote.\n\n**Example:**\n```php\n<?php\necho(\"Hello World\"\
    );\n?>\n```\nOutput: `Hello World`\n\n## Functions\nA function is a code block\
    \ that can repeat many times. To define a function, use `function`.\n\n**Example:**\n\
    ```php\n<?php\nfunction test(){\n    echo(\"show sample\");\n}\ntest();\n?>\n\
    ```\nOutput: `show sample`\n\nExplanation:\n`function(){ }` is a declaration of\
    \ PHP. `test()` is a call.\n\n## Function with Arguments\nA function can have\
    \ one or more arguments inside the brackets, used to pass data.\n\n**Example:**\n\
    ```php\n<?php\nfunction test($arg){\n    echo(\"Hello World\");\n}\ntest(\"arg\"\
    );\n?>\n```\nOutput: `Hello World`\n\nExplanation:\n`$arg` is an argument of function.\
    \ `test(\"arg\")` calls the function.\n\n## Variable Scope\nGlobal variable is\
    \ declared outside the function, it can be used everywhere. A local variable is\
    \ declared inside the function, it is only used inside the current function.\n\
    \n**Example:**\n```php\n<?php\n$num=200; // This $num is global variable.\nfunction\
    \ test(){\n    $num=100; // This $num is local variable.\n}\necho $num;\n?>\n\
    ```\nOutput: `200`\n\nExplanation:\n`echo $num` outputs `200`, which means `$num`\
    \ stores a global variable value. If you want to declare a global variable inside\
    \ a function, you should use the keyword `global` preceding the variable name,\
    \ e.g., `function test(){ global $num; }`.\n\n## Multiple Arguments\nA function\
    \ may have several arguments; these arguments pass data simultaneously for the\
    \ function.\n\n**Example:**\n```php\n<?php\nfunction test($arg1, $arg2, $arg3){\n\
    \    $sum=$arg1+$arg2+$arg3;\n    echo $sum;\n}\ntest(3, 6, 9);\n?>\n```\nOutput:\
    \ `18`\n\nExplanation:\nWhen `test(3, 6, 9)` calls the function `test($arg1, $arg2,\
    \ $arg3)`, arguments `3,6,9` pass to `$arg1, $arg2, $arg3`, the `$sum` is assigned\
    \ the value of `18`. The output is `18`.\n\n# Hour 2\n# PHP Basic\n## Arithmetical\
    \ Operators\n| Operators | Running |\n| --- | --- |\n| `+` | add |\n| `-` | subtract\
    \ |\n| `*` | multiply |\n| `/` | divide |\n| `%` | get modulus |\n| `++` | increase\
    \ 1 |\n| `--` | decrease 1 |\n| `.` | connect two strings |\n"
