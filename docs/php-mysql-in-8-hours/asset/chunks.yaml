  trans: "\n\n```php\n$sql=”alter table colortable modify color4 char(30)\";\n\n$query=mysqli_query(\
    \ $sql, $con);\n\nif( $query ) {\necho  “ Alter data type successfully! ”;\n}\n\
    ```\n( 输出: Alter data type successfully! )\n\n## 解释\n\n`alter table colortable\
    \ modify color4 char(30)` 将 `color4` 数据类型更改为 `char(30)`, `mysqli_query($sql, $con)`\
    \ 执行查询。\n\n## 获取表数据\n\n| $sql=”select column from table-name\";$query=mysqli_query(\
    \ $sql, $con); |\n| --- |\n\n`$sql=\"select column from table-name\"` 用于通过列名从表中检索表数据。\n\
    `$query=mysqli_query($sql, $con)` 执行查询。\n`$con` 是 MySQL 服务器的连接。（参见上一页）。\n\n##\
    \ 示例\n\n```php\n$sql=”select color1 from colortable\";\n\n$query=mysqli_query(\
    \ $sql, $con);\n\nif( $query ) {\necho  “ Retrieve data successfully! ”;\n}\n\
    ```\n( 输出: Retrieve data successfully! )\n\n## 解释\n\n`select color1 from colortable`\
    \ 从 `colortable` 中通过 `color1` 获取表数据。`mysqli_query($sql, $con)` 执行查询。\n\n## mysqli_fetch_row()\n\
    \n| mysqli_fetch_row( ); |\n| --- |\n\n`mysqli_fetch_row()` 返回行的索引数组。其键始终是数字类型。例如：`[\
    \ number ] => value`。\n\n## 示例 \n\ntest_table\n\n| Name || State || City |\n|\
    \ --- | --- | --- |\n| Don || Ma || Stone |\n| Kan || Nh || Water |\n\n```php\n\
    $sql=select \\* from test_table;  // \\* 代表所有列\n\n$query=myslqi_query( $sql);\n\
    \n$array=mysqli_fetch_row ($query);\n\nprint_r($array);  // print_r( ) 用于打印数组。\n\
    ```\n( 输出: [0]=>Don [1]=>Ma [2]=>Stone )\n\n## 解释\n\n`mysqli_fetch_row()` 返回该行的数组，其键始终是数字类型。`print_r()`\
    \ 用于打印数组。\n\n## mysqli_fetch_assoc()\n\n| mysqli_fetch_assoc( ); |\n| --- |\n\n\
    `mysqli_fetch_assoc()` 返回行的关联数组。其键始终是字符串类型。例如：`[ string ]=> value`。\n\n## 示例\n\
    \ntest_table\n\n| Name || State || City |\n| --- | --- | --- |\n| Don || Ma ||\
    \ Stone |\n| Kan || Nh || Water |\n\n```php\n$sql=select \\* from test_table;\
    \  // \\* 代表所有列\n\n$query=myslqi_query( $sql);\n\n$array=mysqli_fetch_assoc ($query);\n\
    \nprint_r($array);  // print_r( ) 用于打印数组。\n```\n( 输出: [Name]=>Don [State]=>Ma\
    \ [City]=>Stone )\n\n## 解释\n\n`mysqli_fetch_assoc()` 返回该行的数组，其键始终是字符串类型。`print_r()`\
    \ 用于打印数组。\n\n## mysqli_fetch_array()\n\n| mysqli_fetch_array( ); |\n| --- |\n\n\
    `mysqli_fetch_array()` 返回行的索引数组和关联数组。它们的键既是数字类型也是字符串类型。例如：`[number]=>value [ string\
    \ ]=>value`。\n\n## 示例\n\ntest_table\n\n| Name || State || City |\n| --- | ---\
    \ | --- |\n| Don || Ma || Stone |\n| Kan || Nh || Water |\n\n```php\n$sql=select\
    \ \\* from test_table;  // \\* 代表所有列\n\n$query=myslqi_query( $sql);\n\n$array=mysqli_fetch_array($query);\n\
    \nprint_r($array);  // print_r( ) 用于打印数组。\n```\n( 输出: [0] => Don [1] => State\
    \ [2] => City [Name] => Don [State] => Ma [City] => Stone )\n\n## 解释\n\n`mysqli_fetch_array()`\
    \ 返回该行的数组，其键始终都是数字类型和字符串类型。\n\n## mysqli_num_rows()\n\n| mysqli_num_rows( $query\
    \ ); |\n| --- |\n\n`mysqli_num_rows($query)` 返回 `$query` 中的总行数，该结果由 `mysqli_query()`\
    \ 生成。\n\n## 示例\n\ntest_table\n\n| Name || State || City |\n| --- | --- | --- |\n\
    | Don || Ma || Stone |\n| Kan || Nh || Water |\n\n```php\n$sql=select \\* from\
    \ test_table;  // \\* 代表所有列\n\n$query=myslqi_query( $sql);\n\n$row_number=mysqli_num_rows(\
    \ $query );\n\necho $row_number;\n```\n( 输出: 2 )\n\n## 解释\n\n`mysqli_num_rows($query)`\
    \ 返回 `$query` 中的总行数，结果为 2。\n\n## mysqli_close()\n\n| mysqli_close( ); |\n| ---\
    \ |\n\n关闭之前打开的 MySQL 数据库连接。\n\n## 示例\n\n```php\n<?php\n$con= mysqli_connect( “host”,\
    \ “user”, “password” );\n//某些代码...\nmysqli_close($con);\n?>\n```\n\n 解释\n\n`mysqli_close($con)`\
    \ 关闭与 MySQL 服务器的 `$con` 连接。\n\n## 类与对象\n\n### 类定义\n\n类是对象的模板。\n\n```php\nclass\
    \ Person {\n  // 属性和方法\n}\n```\n\n### 实例化\n\n使用 `new` 关键字来创建类的实例。\n\n```php\n\
    $person = new Person();\n```\n\n### 属性\n\n属性是类中的变量。\n\n```php\nclass Person {\n\
    \  public $name;\n  public $age;\n}\n\n$person = new Person();\n$person->name\
    \ = \"John\";\n```\n\n### 方法\n\n方法是类中的函数。\n\n```php\nclass Person {\n  public\
    \ function sayHello() {\n    echo \"Hello!\";\n  }\n}\n\n$person = new Person();\n\
    $person->sayHello();\n```\n\n### 构造函数\n\n构造函数是在创建对象实例时自动调用的方法。它使用 `__construct()`\
    \ 定义。\n\n```php\nclass Person {\n  public $name;\n  public function __construct($name)\
    \ {\n    $this->name = $name;\n  }\n}\n\n$person = new Person(\"John\");\n```\n\
    \n### 继承\n\n类可以使用 `extends` 关键字继承另一个类。这意味着子类可以使用父类的属性和方法。\n\n```php\nclass Animal\
    \ {\n  public function eat() {\n    echo \"Eating...\";\n  }\n}\n\nclass Dog extends\
    \ Animal {\n  public function bark() {\n    echo \"Barking...\";\n  }\n}\n\n$myDog\
    \ = new Dog();\n$myDog->eat();\n$myDog->bark();\n```\n\n### 访问修饰符\n\n访问修饰符控制属性和方法的可见性。\n\
    \n- `public`: 属性或方法可以在任何地方被访问。\n- `private`: 属性或方法仅在类内部可访问。\n- `protected`: 属性或方法可以在类内部及其子类中被访问。\n\
    \n```php\nclass Parent {\n  public $var1;\n  protected $var2;\n  private $var3;\n\
    }\n```\n\n### 静态成员\n\n静态属性和方法属于类本身，而不是类的实例。使用 `::` 运算符来访问。\n\n```php\nclass MyClass\
    \ {\n  public static $count = 0;\n  public static function increment() {\n   \
    \ self::$count++;\n  }\n}\n\nMyClass::increment();\necho MyClass::$count;\n```\n\
    \n### 常量\n\n常量是在定义后无法更改的值。使用 `const` 关键字定义。\n\n```php\nclass Config {\n  const\
    \ PI = 3.14;\n}\n\necho Config::PI;\n```\n\n### 接口\n\n接口定义了类必须实现的方法 set，但不包含具体实现。使用\
    \ `implements` 关键字。\n\n```php\ninterface Shape {\n  public function draw();\n\
    }\n\nclass Circle implements Shape {\n  public function draw() {\n    echo \"\
    Drawing a circle.\";\n  }\n}\n```\n\n### 抽象类\n\n抽象类是不能被实例化的类。它可以作为其他类的模板。使用 `abstract`\
    \ 关键字定义。\n\n```php\nabstract class Animal {\n  abstract public function makeSound();\n\
    \  public function sleep() {\n    echo \"Zzz...\";\n  }\n}\n\nclass Cat extends\
    \ Animal {\n  public function makeSound() {\n    echo \"Meow!\";\n  }\n}\n```\n"
- fmt: "\nThe object of sub class can use the variable and function of parent class.\n\
    \n## Example:\n\n```php\nclass animal{\n    var $head;\n    function tail( ) {…}\n\
    }\n\nclass dog extends animal{\n    // sub class definition\n}\n\n$d = new dog(\
    \ );\n$d->$head = “big”;\n$d->tail( );\n```\n\n## Explanation:\n\n`$d` is an object\
    \ of sub class.\n\n`$d->$head` references a variable of parent class.\n\n`$d->tail(\
    \ );` calls a function of parent class.\n\n`Class:: method ( )`\n\n`Class` can\
    \ use `::` to references a variable or calls a function.\n\n| class-name :: variable;class-name\
    \ :: function( ); |\n| --- |\n\n## Example:\n\n```php\nclass animal{\n    var\
    \ head;\n    function tail( ) {…}\n}\n\nclass dog extends animal{\n    animal\
    \ :: head;\n    animal :: tail( );\n}\n```\n\n## Explanation:\n\n`“animal :: head;`\
    \ means in sub class `dog`, a class named `animal` references a variable `head`\
    \ in parent class.\n\n`“animal::tail( );` means in sub class `dog`, a class named\
    \ `animal` calls a function `tail( )` in parent class.\n\n# Appendix 1: Security\
    \ Tips\n\n### Why Security Code?\n\nIt is very important to ensure the safety\
    \ of PHP web site on Internet. There are various dangerous attacks from anonymous\
    \ hackers. These risks list as following:\n\n| Name | Malicious Behaviors |\n\
    | --- | --- |\n| Cross-Site Scripting | Steal user information |\n| Spoofed Forms\
    \ | Remove client-side data |\n| SQL Injection | Ruin database data |\n| Remote\
    \ Code Injection | Controlled by attacker |\n| Command Injection | Execute bad\
    \ commands |\n| Session Fixation | Set another person's SID |\n| Session Hijack\
    \ | Hijack user session key |\n| …… | …… |\n\nAttacker inputs malicious codes\
    \ in HTML form.\n\n```html\n<input type=”password” name= “password”>\n<input type=\
    \ “text” name= “characters” /> \n<textarea name = “words” rows= size1 cols= size2>\n\
    ```\n\n### Filter Malicious Password\n\n| ctype\\_alnum( $\\_POST\\[ “password\
    \ ” \\]) |\n| --- |\n`ctype\\_alnum ( )` only accepts a to z characters and 0\
    \ to 9 numbers, and returns true. Don’t allow `<`, `%`, `!`, `#`, `$`, `%`, `^`,\
    \ `&`, `\\*` and any other symbols. \n\n#### Example:\n\nTo filter malicious password,\
    \ the PHP codes look like this:\n\n```php\n$clean = array( );\nif ( ctype\\_alnum\
    \ ( $\\_POST\\[“password”\\]))\n{\n    $clean \\[“password”\\] = $\\_POST\\[“password”\\\
    ]\n}\n```\n\n#### Explanation:\n\n`“$clean = array( );` defines an array named\
    \ `$clean$`.\n\n`“ctype\\_alnum ( $\\_POST\\[“password”\\])”` only allows a to\
    \ z and 0 to 9, and return true.\n\n`“$clean \\[“password”\\]” stores the characters\
    \ or numbers, without other symbols such as `@`, `#`, `$`, `%`, `&`, `<`, `%`,\
    \ `!` ……`\n\n### Filter Malicious Characters\n\n| ctype\\_alpha( $\\_POST\\[ “characters”\
    \ \\]) |\n| --- |\n`ctype\\_alpha( )` only accepts a to z characters, and returns\
    \ true. Don’t allow 0 to 9 numbers and `<`, `%`, `!`, `#`, `$`, `%`, `^`, `&`\
    \ any other symbols.\n\n#### Example:\n\nTo filter malicious characters, the PHP\
    \ codes look like this:\n\n```php\n$clean = array( );\nif ( ctype\\_alpha ( $\\\
    _POST\\[“characters”\\]))\n{\n    $clean \\[“characters”\\] = $\\_POST\\[“characters”\\\
    ]\n}\n```\n\n#### Explanation:\n\n`“$clean = array( );` defines an array named\
    \ `$clean$`.\n\n`“ctype\\_alpha ( $\\_POST\\[“characters”\\])”` allows a to z\
    \ characters, and return true.\n\n“$clean \\[“characters”\\]”` stores characters\
    \ only, without numbers and other symbols as `@`, `#`, `$`, `%`, `<`, `%`, `!`\n\
    \n### Filter Malicious Input\n\n| str\\_replace(\"ch1\", \"ch2 \", $\\_POST\\\
    [“text” ) |\n| --- |\n`str\\_replace( )` can replace character `ch1` by `char2`\
    \ in what inputted.\n\n`$\\_POST\\[text\\]` is the text inputted by user.\n\n\
    #### Example:\n\n```php\n$clean = array( );\n$clean \\[“text\\]=str\\_replace(\"\
    malicious\", \" \", $\\_POST\\[text\\]);\n$clean \\[“text\\]= str\\_replace(\"\
    %\", \"percent\", $\\_POST\\[text\\]);\n```\n\n#### Explanation:\n\n`“str\\_replace(\"\
    malicious\", \" \", $\\_POST\\[text\\]”` replaces `malicious` by an empty string.\n\
    \n`“$str\\_replace(\"@\", \"(at)\", $\\_POST\\[text\\])”` replaces `@` by `(at)`.\n\
    \n`“str\\_replace(\"%\", \"percent\", $\\_POST\\[text\\])”` replaces `%` by `percent`.\n\
    \n`$clean\\[“text\\]` stores the text you need.\n\n### Limit Specified Input\n\
    \n| in\\_array( $\\_POST\\[“words”], myarray ) |\n| --- |\n`in\\_array ( )` can\
    \ limit the inputted words from users. Allow specified characters or numbers that\
    \ can be inputted, and returns true.\n\n#### Example:\n\n```php\n$clean = array(\
    \ );\n$myarray = array( “Rose”, “Judy”, “Tomy” );\nif ( in\\_array( $\\_POST\\\
    [“words”], $myarray ) )\n{\n    $clean \\[“words”\\] = $\\_POST\\[“words”\\];\n\
    }\n```\n\n#### Explanation:\n\n`“$myarray = array( “Rose”, “Judy”, “Tomy” );`\
    \ specifies the inputted words that are one of `Rose`, `Judy`, `Tomy` only.\n\n\
    `“in\\_array( $\\_POST\\[“words”], $myarray)” checks the inputted words if accord\
    \ with the specified characters or numbers in `$myarray`.\n\n`“$clean\\[“words”\\\
    ]” stores the specified words only.\n\n### Escape Output\n\nEscape output means\
    \ encoding the output so that the original meaning is preserved, which prevents\
    \ the user from damaging commands.\n\n| htmlentities( );htmlspecialchars( ); |\n\
    | --- |\n`htmlentities( );` and `htmlspecialchars( )` can convert characters to\
    \ HTML entities in source code.\n\n#### Example:\n\n```php\n$str = \"< © Ray >\"\
    ;\necho htmlentities ( $str ); \n// Output in source code: &lt;&copy;Ray;&gt;\n\
    ```\n\n#### Explanation:\n\n`htmlentities($str)` converts the `< © Ray>` to html\
    \ entities.\n\n`&lt;` are html entities, meaning `<`.\n\n`&copy` are html entities,\
    \ meaning `©`.\n\n`&gt` are html entities, meaning `>`.\n\n`htmlspecialchars(\
    \ )` is almost the same as `htmlentities( )`.\n\n### Protect Database\n\n| mysql\\\
    _real\\_escape\\_string( ) |\n| --- |\n`mysql\\_real\\_escape\\_string( )` can\
    \ eliminate the risk of SQL injection attacks.\n\nBefore using MySQL query, do\
    \ two things:\n\n1. Always use clean parameters.\n2. Always use `mysql_real_escape_string(\
    \ )` to escape the output for Database, prevent SQL injection attacks.\n\n####\
    \ Example:\n\n```php\n$mysql = array( );\n$mysql \\[‘product’ \\] = mysql\\_real\\\
    _escape\\_string( $clean\\[‘product’\\] );\n$sql = “SELECT \\* FROM catalog WHERE\
    \ product = ‘{ $mysql \\[‘product’ \\] }’”;\n```\n\n#### Explanation:\n\n`“$clean\\\
    [‘product’\\]` is a clean parameter.\n\n`“$mysql \\[‘product’ \\]” has been escaped,\
    \ which can be used to MySQL query.\n\n# Appendix 2: MYSQL Commands\n\n### Charts\n\
    \n#### (1) Database Commands\n\n| MySQL Commands | Descriptions |\n| --- | ---\
    \ |\n| CREATE DATABASE database-name | create database |\n| USE database-name\
    \ | use a database |\n| SHOW database-name | show a database |\n| DROP database-name\
    \ | remove a database |\n\n#### (2) Table Commands\n\n| MySQL Commands | Descriptions\
    \ |\n| --- | --- |\n| CREATE TABLE table-name | create table |\n| SHOW TABLE |\
    \ show all tables |\n| DESCRIBE | show fields property |\n| SHOW COLUMNS FROM\
    \ table-name | show a field property |\n| SHOW INDEX FROM table-name | list index\
    \ field property |\n| ALTER TABLE table-name | change data of a field |\n| DROP\
    \ TABLE table-name | remove a table |\n| OPTIMIZE table-name | optimize a table\
    \ |\n\n#### (3) Field Modifiers\n\n| Modifier | Descriptions |\n| --- | --- |\n\
    | AUTO\\_INCREMENT | automatically generate a serial number |\n| NUT NULL | cannot\
    \ be empty value |\n| NULL | can be empty value |\n| UNIQUE | cannot duplicate\
    \ any entry |\n| PRIMARY KEY | specify as a primary key |\n| DEFAULT | specify\
    \ a default value for a field |\n| INDEX | specify an index field for table |\n\
    \n#### (4) Operation Commands\n\n| Modifier | USE |\n| --- | --- |\n| SELECT field\
    \ FROM table WHERE condition | query data |\n| INSERT INTO table ( field ) VALUES\
    \ (value) | insert data |\n| DELETE FROM table WHERE condition | delete data |\n\
    | UPDATE table SET field = value WHERE condition | update data |\n| PEPLACE INTO\
    \ table (field ) VALUES (value) | replace data |\n\n#### (5) mysql\\_xxx\\_xxx\
    \ ( ) )\n\n| Commands | Description |\n| --- | --- |\n| mysql\\_affected\\_row\
    \ ( ) | Returns the number of row affected by query |\n"
