    \ |\n| --- | --- | --- |\n| `true || true; returns true;` | `true || false; returns\
    \ true;` | `false || false;return false;` |\n| `! false;returns true;` | `! true;returns\
    \ false;` | |\n\n## Assignment Operators\n\n| Operators | Examples: | Equivalent:\
