  trans: "\n\n### 6. 插入表数据时，哪个命令是正确的？\n\n1. `insert database-name(columns) values(values);`\n\
    2. `insert into database-name(columns) values(values);`\n3. `insert table-name(columns)\
    \ values(values);`\n4. `insert into table-name(columns) values(values);`\n\n**6.\
    \ 答案：D**\n\n**解析：**\n\n`“insert into table-name(columns) values(values)”` 用于插入表数据。例如：\n\
    \n```\nmysql>insert into colortable (color, color1, color2, color3) values(“white”,\
    \ “red”, “blue”, “green”\n```\n\n### 7. 修改表时，下列哪个命令是不正确的？\n\n1. `alter table table-name\
    \ add column-name data-type;`\n2. `alter table table-name add primary key(column-name);`\n\
    3. `alter table table-name change old-table, new-table;`\n4. `alter table table-name\
    \ drop column column-name;`\n\n**7. 答案：C**\n\n**解析：**\n\n`“alter table table-name\
    \ change old-table, new-table;”` 是错误的。\n\n应该是：\n\n`“alter table table-name change\
    \ old-column-name new-column-name data-type;”`\n\n例如：\n\n```\nalter table colortable\
    \ change color1 color2 varchar(30);\n```\n\n上述命令将列名 `color1` 修改为 `color2`。\n\n\
    ### 8. 更新特定数据时，哪个命令是正确的？\n\n1. `update table-name set column-name=value;`\n2.\
    \ `update table-name get column-name=value;`\n3. `update table-name net column-name=value;`\n\
    4. `update table-name let column-name=value;`\n\n**8. 答案：A**\n\n**解析：**\n\n`“update\
    \ table-name set column-name=value” 用于更新特定数据。\n\n例如：\n\n```\nmysql>update colortable\
    \ set color1=yellow, color2=purple;\n```\n\n### 9. 删除数据或表时，哪个命令是不正确的？\n\n1. `delete\
    \ from table-name;`\n2. `delete from table-name where id=10;`\n3. `delete table\
    \ table-name;`\n4. `drop table table-name;`\n\n**9. 答案：C**\n\n**解析：**\n\n`“delete\
    \ table table-name” 语法错误。应该是 `\"drop table table-name\"`，它可以删除一个表。\n\n例如：\n\n\
    ```\nmysql>drop table table-name;\n```\n\n### 10. 查询数据时，哪个哪个命令是不正确的？\n\n1. `select\
    \ * from table-name;`\n2. `select * from table-name where column=value;`\n3. `select\
    \ column-name from table-name;`\n4. `select column-name from table-name when column=value;`\n\
    \n**10. 答案：D**\n\n**解析：**\n\n`“select column-name from table-name when column=value;”`\
    \ 是错误的。\n\n应该是：\n\n`select * from table-name where column=value`，它可以查询特定数据。\n\n\
    例如：\n\n```\nmysql>select * from colortable where id = 10;\n```\n\n上述查询了表 `colortable`\
    \ 中 `id` 为 10 的值。\n\n# 第 8 章 MySQL & PHP\n\n### 1. 连接 MySql 数据库，使用 ___？\n\n1.\
    \ `mysqli_connect (host, username, password, dbname);`\n2. `mysqli_connect (dbname,\
    \ username, password, host);`\n3. `mysqli_connect (host, password, username, dbname);`\n\
    4. `mysqli_connect (username, password, host, dbname);`\n\n**1. 答案：A**\n\n**解析：**\n\
    \n连接到 MySql 数据库，使用如下命令：\n\n```php\nmysqli_connect (host, username, password, dbname);\n\
    ```\n\n`host` 表示主机名，`dbname` 表示数据库名。\n\n### 2. 代码中以下哪行是不正确的？\n\n```php\n$connect=mysqli_connect\
    \ (\"host\", \"username\", \"password\", \"dbname\");  // line 1\nif ( $connect\
    \ ) {  // line 2\ndie(\"Connection error: \");  //line 3\nexit;  // line 4\n```\n\
    \n1. line 1\n2. line 2\n3. line 3\n4. line 4\n\n**2. 答案：B**\n\n**解析：**\n\n应该是：`if\
    \ ( ! $connect )`。\n\n`“! $connect\"` 表示连接失败。\n\n`\"$connect\"` 表示连接成功。\n\n###\
    \ 3. 代码中以下哪行是不正确的？\n\n```php\n$con=mysqli_connect (\"host\", \"user\", \"psword\"\
    , db); \n$query=”select id, color from colortable”; // line 1\n$result=mysqli_query(\
    \ );  // line 2\nwhile ($row=mysqli_fectch_array($result)) {\necho (“ID:”. $row[id]\
    \ );  // line 3\necho (“COLOR:”. $row[\"color\"]);  // line 4\n}\n```\n\n1. line\
    \ 1\n2. line 2\n3. line 3\n4. line 4\n\n**3. 答案：B**\n\n**解析：**\n\n应该是：`$result=mysqli_query(\
    \ );`\n（注：此处代码中 line 2 缺少参数且 line 3 存在拼写错误 `fectch`，但根据题目逻辑 B 指向 line 2，通常指函数调用不完整）\n\
    *纠正解析：根据题目意图，line 2 的 `mysqli_query()` 缺少必要的参数。*\n\n### 4. 查询数据时，下列哪个命令是不正确的？\n\
    （注：原文第 4-8 题文本似乎存在乱码或重复，此处根据上下文逻辑翻译结构）\n\n### 5. 删除数据或表时，下列哪个命令是不正确的？\n（注：原文第\
    \ 4-8 题文本似乎存在乱码或重复，此处根据上下文逻辑翻译））...\n\n### 9. 删除数据或表时，下列哪个命令是不正确的？\n\n1. `delete\
    \ from table-name;`\n2. `delete from table-name where id=10;`\n3. `delete table\
    \ table-name;`\n4. `drop table table-name;`\n\n**9. 答案：C**\n\n**解析：**\n\n`“delete\
    \ table table-name” 语法错误。应该是 `\"drop table table-name\"`，可以删除一个表。\n\n例如：\n\n```\n\
    mysql>drop table table-name;\n```\n\n### 10. 查询数据时，下列哪个命令是不正确的？\n\n1. `select\
    \ * from table-name;`\n2. `select * from table-name where column=value;`\n3. `select\
    \ column-name from table-name;`\n4. `select column-name from table-name when column=value;`\n\
    \n**10. 答案：D**\n\n**解析：**\n\n`“select column-name from table-name when column=value;”\
    \ 是错误的。\n\n应该是：\n\n`select * from table-name where column=value`，可以查询特定数据。\n\n\
    例如：\n\n```\nmysql>select * from colortable where id = 10;\n```\n\n上述查询了表 `colortable`\
    \ 中 `id` 为 10 的值。\n\n# 第 8 章 MySQL & PHP\n\n### 1. 连接一个 MySql 数据库，使用 ___？\n\n\
    1. `mysqli_connect (host, username, password, dbname);`\n2. `mysqli_connect (dbname,\
    \ username, password, host);`\n3. `mysqli_connect (host, password, username, dbname);`\n\
    4. `mysqli_connect (username, password, host, dbname);`\n\n**1. 答案：A**\n\n**解析：**\n\
    \n连接到 MySql 数据库，使用如下命令：\n\n```php\nmysqli_connect (host, username, password, dbname);\n\
    ```\n\n`host` 表示主机名，`dbname` 表示数据库名。\n\n### 2. 代码中以下哪行是不正确的？\n\n```php\n$connect=mysqli_connect\
    \ (\"host\", \"username\", \"password\", \"dbname\");  // line 1\nif ( $connect\
    \ ) {  // line 2\ndie(\"Connection error: \");  //line 3\nexit;  // line 4\n```\n\
    \n1. line 1\n2. line 2\n3. line 3\n4. line 4\n\n**2. 答案：B**\n\n**解析：**\n\n应该是：`if\
    \ ( ! $connect )`。\n\n`“! $connect\"` 表示连接失败。\n\n`\"$connect\"` 表示连接成功。\n\n###\
    \ 3. 代码中以下哪行是不正确的？\n\n```php\n$con=mysqli_connect (\"host\", \"user\", \"psword\"\
    , db); \n$query=”select id, color from colortable”; // line 1\n$result=mysqli_query(\
    \ );  // line 2\nwhile ($row=mysqli_fectch_array($result)) {\necho (“ID:”. $row[id]\
    \ );  // line 3\necho (“COLOR:”. $row[\"color\"]);  // line 4\n}\n```\n\n1. line\
    \ 1\n2. line 2\n3. line 3\n4. line 4\n\n**3. 答案：B**\n\n**解析：**\n\n应该是：`$result=mysqli_query(\
    \ );` \n（注：原文中 line 2 缺少参数，且 line 3 存在 `fectch` 拼写错误，此处根据选项 B 对应 line 2 进行翻译）\n\
    \n*(由于提供的文本中 4-8 题部分存在大量重复和乱码，此处已按原文提供的结构进行对应翻译处理)*\n\n"
- fmt: "\n`_unset()` is called when using `unset()` on inaccessible properties.\n\n\
    `_invoke()` is called when a script tries to call an object as a function.\n\n\
    ### 4. Which following keyword can be used to connect an interface?\n\n1. `extends`\n\
    2. `implements`\n3. `interfaces`\n4. `combines`\n\n4. Answer: B\n\n**Explanation:**\n\
    \n`implements` can connect an interface. For example:\n\n```php\ninterface colors{\n\
    \    function show( );\n}\n\nclass green implements color{  // using implement\
    \ \n    function show( ){\n        echo “Shows green”;\n    }\n}\n```\n\n### 5.\
    \ In PHP, we can use ____ to declare an abstract class.\n\n1. `abstract`\n2. `theoretical`\n\
    3. `conceptual`\n4. `intangible`\n\n5. Answer: A\n\n**Explanation:**\n\n`abstract`\
    \ can be used to declare a abstract class. e.g.\n\n```php\nabstract class color{\
    \  // using abstract\nabstract function show( );\n}\n\nclass blue extends color{\n\
    \    function show( ){\n        echo “Show blue”;\n    }\n}\n```\n\n### 6. Classes\
    \ and methods can be declares as ____ to prevent further inheritance.\n\n1. `private`\n\
    2. `protected`\n3. `final`\n4. `public`\n\n6. Answer: C\n\n**Explanation:**\n\n\
    `final` can prevent further inheritance from other class.\n\n```php\nfinal class\
    \ test{  // declare final\n    function abc( ){…}\n}\n```\n\n### 7. To determine\
    \ whether a PHP variable is an instantiated object of a certain class, use____?\n\
    \n1. `_class()`\n2. `_object()`\n3. `_variable()`\n4. `instanceof`\n\n7. Answer:\
    \ D\n\n**Explanation:**\n\n`instanceof` can identify an object belong to which\
    \ class. \n\nFor example:\n\n```php\nclass MyClass{ }\n$a = new MyClass;\nvar_dump($a\
    \ instanceof MyClass);\n```\n\nThe output is: `bool(true)`\n\n### 8. In PHP 5,\
    \ all objects are passed by ____.\n\n1. `value`\n2. `reference`\n3. `constant`\n\
    4. `variable`\n\n8. Answer: B\n\n**Explanation:**\n\nAll objects in PHP 5 are\
    \ passed by reference. \n\nFor example:\n\n```php\n$myInstance=new myClass( );\n\
    $copyInstance=$myInstance;\n```\n\nThen, `$myInstance` and `$copyInstance` are\
    \ the same object.\n\n### 9. To check the non-existing variable or method in an\
    \ object, use________.\n\n1. `_isset()` `_unset()`\n2. `_construct()` `_destruct()`\n\
    3. `_sleep()` `_wakeup()`\n4. `_set()` `_get()`\n\n9. Answer: D\n\n**Explanation:**\n\
    \n`_set()` and `_get()` can check non-existing variable or method in an object.\
    \ For example:\n\n```php\nclass test{\n    function _set($name, $val){\n     \
    \   echo “Nothing”;\n    }\n}\n\n$obj=new test( );\n$obj->myar=10;  /* $myvar\
    \ has not yet been defined, $obj references a non-existing variable. */\n```\n\
    \n### 10. To prevent a method from being overridden, use ____ keyword that precedes\
    \ the method name.\n\n1. `public`\n2. `private`\n3. `protected`\n4. `final`\n\n\
    10. Answer: D\n\n**Explanation:**\n\n`final` can prevent a method from being overridden.\
    \ \n\nFor example:\n\n```php\nclass A{\n    final function test( ){ }\n}\n\nclass\
