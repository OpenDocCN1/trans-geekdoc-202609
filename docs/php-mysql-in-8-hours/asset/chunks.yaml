  trans: "\n\n## 解析\n\n通过以上内容，你可以知道：\n\n- `$color[0]` 的值是黄色。\n- `$color[1]` 的值是紫色。\n\
    - `$color[2]` 的值是橙色。\n\n注意索引从零开始计数。\n\n## 获取数组大小\n\n有两个函数可以获取数组的大小。\n\n| `count($array);`\
    \ |\n| --- |\n| `sizeof($array);` |\n\n## 示例\n\n```php\n<?php\n$color = array(“yellow”,\
    \ “purple”, “orange”);\n$size=count($color);  // 或 sizeof($color);\necho ( $size\
    \ );\n?>\n```\n(输出: 3)\n\n## 解析\n\n`count($color)` 或 `sizeof($color)` 可以返回数组 `$color`\
    \ 的大小，并将大小赋值给 `$size`。\n`array(“yellow”, “purple”, “orange”)` 有三个元素，所以它的大小为 3。\n\
    \n## 添加数组元素\n\n| `array_unshift( array, value1, value2…);` |\n| --- |\n| `array_push(\
    \ array, value1, value2… );` |\n\n`array_unshift( array, value1, value2)` 将 `value1`、`value2`\
    \ 添加到数组开头。\n`array_push( array, value1, value2… )` 将 `value1`、`value2` 添加到数组末尾。\n\
    \n## 示例\n\n```php\n$myarray=array(“A”, “B”, ”C”);\narray_unshift($myarray, “D”,\
    \ “E”);\narray_push($myarray, “F”, “G”);\necho ( $myarray );\n```\n(输出: DEABCFG)\n\
    \n## 解析\n\n`array_unshift($myarray, “D”, “E”)` 在 `$myarray` 元素 `A`, `B`, `C` 的开头添加元素\
    \ `D`, `E`。\n`array_push($myarray, “F”, “G”)` 在 `$myarray` 元素 `A`, `B`, `C` 的末尾添加元素\
    \ `F`, `G`。\n\n## 移除数组元素\n\n| `array_shift( array );` |\n| --- |\n| `array_pop(\
    \ array);` |\n\n`array_shift( array )` 移除数组开头的元素。\n`array_pop( array )` 移除数组末尾的元素。\n\
    \n## 示例\n\n```php\n$myarray=array(“A”, “B”, “C”, “D”, “E” ):\n$beginning=array_shift($myarray);\n\
    $ending=array_pop($myarray):\necho ( $beginning );  // 显示第一个移除的元素。\necho ( $ending\
    \ );  // 显示最后一个移除的元素。\n```\n(输出: AE)\n\n## 解析\n\n`array_shift($myarray)` 移除并返回\
    \ `$myarray` 中的第一个元素，返回 `A`。\n`array_pop($myarray)` 移除并返回 `$myarray` 中的最后一个元素，返回\
    \ `E`。\n\n## 合并数组\n\n| `array_merge( array1, array2 );` |\n| --- |\n`array_merge(\
    \ array1, array2 )` 可以合并 `array1` 和 `array2` 并创建一个新数组。\n\n## 示例\n\n```php\n$array1=array\
    \ (“A”, “B”, “C”);\n$array2=array (“D”, “E”, “F”);\n$array=array_merge( $array1,\
    \ $array2 );\necho ( $array );\n```\n(输出: ABCDEF)\n\n## 解析\n\n`array_merge($array1,\
    \ $array2 )` 可以两个数组合并为一个新数组 `$array`，该数组包含两个数组的六个元素，返回 `ABCDEF`。\n\n## 提取数组\n\n\
    | `array_slice( array, start, length );` |\n| --- |\n`array_slice( array, start,\
    \ length )` 可以从数组的 `start` 位置根据 `length` 提取某些元素并创建一个新数组。\n\n## 示例\n\n```php\n\
    $array=array(“A”,”B”,”C”,”D”,”E”);\n$arr=array_slice( array, 2, 3 );\necho $arr;\n\
    ```\n(输出: CDE)\n\n## 解析\n\n`array_slice( array, 2, 3 )` 从 `$array` 的位置 2 开始提取\
    \ 3 个元素。位置从 0 开始。\n\n## 排序数组\n\n| `sort( array );` |\n| --- |\n`sort(array)` 可以按值对数组进行排序。\n\
    \n## 示例\n\n```php\n$color=array(“yellow”, “red”, “blue”);\nsort (color );\n```\n\
    (输出: blue red yellow)\n\n## 解析\n\n`sort($color )` 按值重新排列 `$color` 元素的顺序。\n\n##\
    \ 数组键值对\n\n数组元素由键值对组成。\n\n| `array( key1=>value1, key2=>value2, key3=>value3);`\
    \ |\n| --- |\n`=>` 用于连接键和值（索引相同）。\n\n## 示例\n\n```php\n<?php\n$book=array (“1st”=>”JSP”,\
    \ “2nd”=>”ASP”, “3th”=>”PHP”);\necho $book[\"3th\"];\n?>\n```\n(输出: PHP)\n\n##\
    \ 遍历数组\n\n| `foreach(array as $key=>$value)` |\n| --- |\n每次循环迭代，将数组的键赋值给 `$key$，值赋值给\
    \ `$value$，直到最后一个元素。\n\n## 示例\n\n```php\n$book=array (“1st”=>”JSP”, “2nd”=>”ASP”,\
    \ “3th”=>”PHP”);\nforeach ($book as $key=>$value){\necho $key book is about $value\\\
    n;\n}\n```\n(输出: \n1st book is about JSP.\n2nd book is about ASP.\n3th book is\
    \ about PHP.)\n\n## 解析\n\n`foreach ($book as $key=>$value)` 将 `$book` 的键赋值给 `$key`，每次循环迭代。\n\
    \n## 表单基础\n\n### 创建表单\n\nHTML 表单将数据提交到服务器。\n\n| `<form action=”url” method=”get/post\"\
    >...</form>` |\n| --- |\n`action` 属性指定处理表单数据的 PHP 文件。\n`method` 属性指定传递数据的方法。可以是\
    \ `get` 或 `post`。\n\n## 示例\n\n```html\n<form action=“myfile.php” method=”get”\
    \ >\n\n``` 解析\n\n`action=\"myfile.php\"` 指定处理此表单数据的 PHP 文件 `myfile.php`。\n`method=\"\
    get\"` 指定传递数据的方法为 `get`，这是一种公开的数据传递方式。\n`method=\"post\"` 指定传递数据的方法为 `post`，这是一种隐藏的数据传递方式。\n\
    \n### 文本输入\n\n| `<input type=”text” name=”xxx”>` |\n| --- |\n`type` 属性指定输入类型，可以是\
    \ `text`、`password`、`radio`、`checkbox`、`hidden` 等。\n`text` 类型用于输入基础数据。\n`name`\
    \ 属性指定传递给 PHP 文件的内容。\n\n## 示例\n\n```html\n<form action=”myfile.php” method=”get”>\n\
    <input type=”text” name=”information”>\n</form>\n```\n(显示: \n|  |\n| --- | \n\
    )\n\n## 解析\n\n`input type=\"text\"` 指定输入类型为 `text`，`name=\"information\"` 指定传递给\
    \ PHP 文件的内容。\n\n### 密码输入\n\n| `input type=\"\"password” name=”yyy”` |\n| --- |\n\
    `type` 属性指定输入类型，可以是 `text`、`password`、`radio`、`checkbox`、`hidden` 等。\n`password`\
    \ 类型用于输入密码。\n`name` 属性指定传递给 PHP 文件的密码。\n\n## 示例\n\n```html\n<form action=”myfile.php”\
    \ method=”post”>\n<input type=”password” name=”secret”>\n</form>\n```\n\n## 解析\n\
    \n`input type=\"password\"` 指定输入类型为 `password`，`name=\"secret\"` 指定传递给 PHP 文件的密码。\n\
    \n### 提交输入\n\n| `<input type=”submit” value=”xxx”>` |\n| --- |\n`submit` 类型用于向服务器提交所有数据。\n\
    `value` 属性指定显示在按钮上的字符。\n\n## 示例\n\n```html\n<form action=”myfile.php” method=”post”>\n\
    <input type=”text” name=”information”>\n<input type=”submit” value=”Send”>\n</form>\n\
    ```\n(显示: \n| <form>………… \n| Send |\n| --- |\n</form>)\n\n## 解析\n\n`input type=\"\
    submit\"` 将将所有数据提交到服务器。\n`value=\"Send\"` 意味着按钮上显示的单词是“Send”。\n\n### 重置输入\n\n\
    | `<input type=\"\"reset” value=”xxx”>` |\n| --- |\n`reset` 类型用于清空表单中的所有数据。\n\
    `value` 属性指定显示在按钮上的字符。\n\n## 示例\n\n```html\n<form action=”myfile.php” method=”post”>\n\
    <input type=”text” name=”information”>\n<input type=”reset” value=”Clear”>\n</form>\n\
    ```\n(显示: \n| <form>………… \n| Clear |\n| --- |\n</form>)\n\n## 解析\n\n`input type=\"\
    reset\"` 将清空表单中的所有数据。\n`value=\"Clear\"` 意味着按钮上显示的单词是“Clear”。\n\n### Textarea\
    \ 输入\n\n| `<textarea name=”xxx” rows=”num” cols=”num”>` |\n| --- |\n`textarea`\
    \ 类型用于在文本区域内输入数据。\n`rows` 指定行数。\n`cols` 指定列数。\n\n## 示例\n\n```html\n<form action=”myfile.php”\
    \ method=”post”>\n<textarea name=”knowledge” rows=”5” cols=”10”></textarea>\n\
    </form>\n```\n(显示: \n|  |\n| --- | \n)\n\n"
- fmt: "\n## Explanation\n\n`name=\"knowledge\"` specifies the inputted contents that\
    \ will be passed to the `php` file for processing.\n\n`rows` specifies the number\
    \ of row as `5`.\n\n`cols` specifies the number of column as `10`.\n\n### Radio\
    \ Inputs\n\n| `<input type=\"radio\" name=\"data\" value=\"myvalue\">` |\n| ---\
    \ |\n\n`type=\"radio\"` is used to input data by single choice.\n\n`name=\"data\"\
    ` specifies the inputted contents that will be passed to the `php` file for processing.\n\
    \n`value=\"myvalue\"` specifies one of the optional contents.\n\n### Example\n\
    \n```html\n<input type=\"radio\" name=\"color\" value=\"red\">\n<input type=\"\
    radio\" name=\"color\" value=\"blue\">\n<input type=\"radio\" name=\"color\" value=\"\
    pink\">\n```\n\n( Display:\n○　red\x80○　blue　           　○　pink\n )\n\n### Explanation\n\
    \n`type=\"radio\"` allows you select one of the circles you like.\n\n`name=\"\
    color\"` specifies the selected contents that will be passed to the `php` file\
    \ for processing.\n\n`value=\"red\"` specifies one of the contents that is red.\n\
    \n### Checkbox Inputs\n\n| `<input type=\"checkbox\" name=\"data\" value=\"myvalue\"\
    >` |\n| --- |\n\n`type=\"checkbox\"` is used to input data by multiple choice.\n\
    \n`name=\"data\"` specifies the inputted contents that will be passed to the `php`\
    \ file for processing.\n\n`value=\"myvalue\"` specifies one of the optional contents.\n\
    \n### Example\n\n```html\n<input type=\"checkbox\" name=\"color\" value=\"red\"\
    >\n<input type=\"checkbox\" name=\"color\" value=\"blue\">\n<input type=\"checkbox\"\
    \ name=\"color\" value=\"pink\">\n```\n\n( Display:\n□　red　　　　　　　〠〠〠□　blue　　　　　　　　　□　pink\n\
    \ )\n\n### Explanation\n\n`type=\"checkbox\"` allows you check the box you like.\n\
    \n`name=\"color\"` specifies the selected contents that will be passed to the\
    \ `php` file for processing.\n\n`value=\"red\"` specifies one of the contents\
    \ that is red.\n\n### Form Works with PHP\n\n| `$data=$_GET[data];` |\n| --- |\n\
    \nIn `php` file, `$data=$_GET[data]`: get data from HTML form and assign to `$data`.\
    \ (Note that form `method=\"get\"`).\n\n#### Example\n\n```html\n<form action=\"\
    myfile.php\" method=\"get\">\n<input type=\"text\" name=\"information\">\n</form>\n\
    ```\n\n( Input “Hello” in the form.)\n\n```php\n<?php // This is myfile.php\n\
    $information = $_GET[information];\necho $information;\n?>\n```\n\n( Output: Hello!\
    \ )\n\n#### Explanation\n\nIn `myfile.php`, `$_GET[information]` gets the data\
    \ “information” from html form, and assign to `$information`.\n\n### Form Works\
    \ with PHP\n\n| `$data=$_POST[data];` |\n| --- |\n\nIn `php` file, `$data=$_POST[data]`:\
    \ get data from HTML form and assign to `$data`. (Note that form `method=\"post\"\
    `).\n\n#### Example\n\n```html\n<form action=\"myfile.php\" method=\"post\">\n\
    <textarea name=\"knowledge\" rows=\"10\" cols=\"5\">\n</form>\n```\n\n( Input\
    \ “Hello World! Welcome to PHP!”.)\n\n```php\n<?php // This is myfile.php\n$knowledge\
    \ = $_POST[knowledge];\necho $knowledge;\n?>\n```\n\n( Output: Hello World! Welcome\
    \ to PHP! )\n\n#### Explanation\n\nIn `myfile.php`, `$_POST[knowledge]` gets the\
    \ data “Hello World! Welcome to PHP!” from html form, and assign to `$knowledge`.\n\
    \n# Hour 5\n# Dynamic Data\n\n### Date & Time\n\n| `date(\"M d Y\"); date(\"h\
    \ : i : s\"); date(\"D H A\");` |\n| --- |\n\n`date(\"M d Y\")` displays month,\
    \ date, year.\n\n`date(\"h : i : s\")` displays hour, minutes, second.\n\n`date(\"\
    D H A\")` displays Day, Hour, AM/PM\n\n#### Example\n\n```php\n$date = date(\"\
    M d Y\");\n$hour = date(\"h : i : s\");\n$week = date(\"D H A\");\necho $date;\n\
    echo $hour;\necho $week;\n```\n\n( Output: Feb 10 2015 11:20:30 Mon 11 AM )\n\n\
    #### Explanation\n\n| M: Jan-Dec || d: 01-31 || Y: YYYY |\n| --- | --- | --- |\n\
    | h: 01-12 || i: 00-59 || s: 00-59 |\n| D: Sun-Sat || H: 00-23 || A: AM/PM |\n\
    \n### String Process\n\n| `strlen()` | `strtoupper()` | `strtolower()` |\n| ---\
    \ | --- | --- |\n\n`strlen()` returns the length of a string.\n\n`strtoupper()`\
    \ returns uppercase.\n\n`strtolower()` returns lowercase.\n\n#### Example\n\n\
    ```php\n$string=\"Hello World!\";\necho strlen($string);\necho strtoupper($string);\n\
    echo strtolower($string);\n```\n\n### Redirection\n\n| `header(\"Location=$url\"\
    )` |\n| --- |\n\n`header(\"Location=$url\")` can redirect the browser to `$url`.\n\
    \n#### Example\n\n```php\n$url=\"http://example.com\";\nheader(\"Location=$url\"\
    );\n```\n\n#### Explanation\n\n`header(\"Location=$url\")` redirects the browser\
    \ to the specified URL.\n"
