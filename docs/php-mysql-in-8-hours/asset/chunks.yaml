    \n### 1. 已知：\n\n```php\n$array = array (5 =>100);\n$array[] = ‘ok’;\n```\n\n`$array`\
    \ 数组的键（key）是什么？\n\n1. 0\n2. ok\n3. 6\n4. 不确定\n\n### 1. 答案：C\n\n解释：\n\n现在 `$array`\
    \ 的键为 6。\n\n当没有键地向数组添加新元素时，将在原数组中已最大的数字键的基础上加 1。\n\n### 2. 下列哪个函数是打印数组的最佳方法？\n\
    \n1. `echo ( )`\n2. `print ( )`\n3. `printf ( )`\n4. `var_dump ( )` 或 `print_r(()`\n\
    \n### 2. 答案：D\n\n解释：\n\n`var_dump ( )` 或 `print_r( )` 适用于输出数组。\n`print( )` 用于表达式，且有返回类型。\n\
    `echo( )` 不用于表达式，且没有返回类型。\n`printf ( )` 用于生成格式化输出。\n\n### 3. 下列哪个陈述不能创建一个新数组？\n\
