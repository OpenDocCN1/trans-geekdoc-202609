    \ a class, use\\_\\_\\_?\n\n1.  define class class-name { }\n\n2.  new class class-name\
    \ { }\n\n3.  create class class-name { }\n\n4.  class class-name { }\n\n1.  Answer:\
    \ D\n\nExplanation:\n\nTo declare a class, using class class-name { }. For example:\
    \ \n\nclass myClass {\n\n// define properties \n\n// define methods\n\n}\n\n2. \
    \ To instantiate an object, use\\_\\_\\_\\_?\n\n1.  myClass $myInstance = create\
    \ myClass ( ); \n\n2.  $myInstance = create myClass ( );\n\n3.  myClass $myInstance\
    \ = new myClass( );\n\n4.  $myInstance = new myClass ( );\n\n2.  Answer:  D\n\n\
    Explanation:\n\nTo instantiate an object, use $myInstance = new myClass ( ); For\
    \ example: \n\nclass color {\n\n$blue = new color( );\n\n$red=new new color( );\n\
    \n}\n\n3.  To call a method by an object, use\\_\\_\\_?\n\n1.  $obj=>myMethod(\
    \ );\n\n2.  $obj->myMethod( );\n\n3.  $obj.myMethod( );\n\n4.  $obj:myMethod(\
    \ );\n\n3.  Answer:  B\n\nExplanation:\n\n\\-> symbol is used to call a method\
    \ or reference a variable.\n\nFor example:\n\n$obj-> myFunction( );\n\n$obj->myVar=100;\n\
    \n4.  Which following line is not correct?\n\nClass A {\n\n     function display(\
    \ ){\n\n     echo “Shows A”;  // line 1\n\n      }\n\n}\n\nClass B extends A{\n\
    \n      function display( ){  // line 2\n\n      echo “Shows B”;  // line 3\n\n\
          } \n\nA->display( );  // line 4\n\n}\n\n1.  line 1\n\n2.  line 2\n\n3. \
    \ line 3\n\n4.  line 4\n\n4.  Answer:  D\n\nExplanation:\n\nIt should be:  A::display(\
    \ );\n\nWhen calling a same name method in parent class from a sub class, use\
    \ :: symbol.\n\nIf using a class name calls a method, you can use:\n\n “class-name::\
    \ method( );”\n\nThe output of above code:  Shows B   Shows A\n\n5.  Which following\
    \ line is not correct?\n\nClass myClass\n\n{\n\n$myVar=”123”  // line 1\n\nfunction\
    \ myFunction ( )  // line 2\n\n{\n\n$value=$this->myVar;  // line 3\n\n echo “$value”; \
    \ // line 4\n\n }\n\n}\n\n1.  line 1\n\n2.  line 2\n\n3.  line 3\n\n4.  line 4\n\
    \n5.  Answer:  A\n\nExplanation:\n\nWhen defining a variable inside class, “var”\
    \ should be used.\n\nFor example:\n\nclass color{ \n\nvar $ed;\n\nvar $blue;\n\
    \n}\n\n6.  Which following line is not correct?\n\nclass myClass{ \n\nvar $myVar; \
    \ // line 1\n\nfunction myClass ($temp)  // line 2\n\n{\n\n$obj->myVar = $temp; \
    \ // line 3\n\n}\n\n}\n\n$obj = new myClass (“ok”);  // line 4\n\n1.  line 1\n\
    \n2.  line 2\n\n3.  line 3\n\n4.  line 4\n\n6\\. Answer:  C\n\nExplanation:\n\n\
    It should be:  $this->myVar = $temp;\n\nWhen using var or method inside a class,\
    \ “$this” should be used to reference a var or call a method.\n\n7.  Which following\
    \ code can be use to define a variable inside a class?\n\n1.  variable\n\n2. \
    \ define\n\n3.  set\n\n4.  var\n\n7.  Answer:  D\n\nExplanation: \n\nInside a\
    \ class, you should use “var” to define a variable.\n\nFor example: class myClass\
    \ { var $myVariable;… }\n\n8.  Which follow code can reference a variable or call\
    \ a function inside a class?\n\n1.  $reference->\n\n2.  $this->\n\n3.  $call->\n\
    \n4.  $object->\n\n8.  Answer:  B\n\nExplanation:\n\n“$this” should be used to\
    \ reference a variable or call a method inside a class.  For Example:\n\nclass\
    \ myClass{ var $name=”abc”;}   $this->abc;\n\n9.  Which following keyword can\
    \ be used to inherit a parent class?\n\n1.  succeeds\n\n2.  follows\n\n3.  expands\n\
    \n4.  extends\n\n9.  Answer:  D\n\nExplanation:\n\nIt should use “extends”. When\
    \ a defined class extends another class, it needs “extends”, to follow a parent\
    \ class.\n\nFor example:\n\nclass sub-class extends parent-class { … }\n\n10. \
    \ When calling a same name function in parent class from a sub class, which following\
    \ keyword can be used?\n\n1.  super::\n\n2.  superior::\n\n3.  parent::\n\n4.\
    \  senior::\n\n10.  Answer: C\n\nExplanation:\n\n“parent” can express parent class.\n\
    \nIf using a class name calls a method, you can use:\n\n “class-name:: method(\
    \ );”\n\nFor example:\n\nclass A{\n\nfunction test( ){ \n\necho “ok”;\n\n}\n\n\
    }\n\nclass B extends A{ \n\nfunction test( ){ \n\nparent::test( );//call a same\
    \ name function in parent class.\n\n}\n\n}\n\nChapter 7  MySQL\n\n1\\. Which following\
    \ command can create a new database?\n\n1.  create database database-name;\n\n\
    2.  create database-name;\n\n3.  new database database-name;\n\n4.  new database-name;\n\
    \n1.  Answer:  A\n\nExplanation:\n\nTo create a new database, use command “create\
    \ database database-name;”   For example:\n\nmysql> create database myDatabase;\n\
    \n2.  Which following command can select a database to work with?\n\n1.  select\
    \ database-name;\n\n2.  open database-name;\n\n3.  use database-name;\n\n4.  run\
    \ database-name;\n\n2.  Answer: C\n\nExplanation:\n\n To select a database to\
    \ work with, use command “use database-name”.  For example:\n\nmysql>use myDatabase;\n\
    \n3.  Which following command can create a database table?\n\n1.  create table-name;\n\
    \n2.  create table table-name;\n\n3.  new table-name;\n\n4.  new table table-name;\n\
    \n3.  Answer:  B\n\nExplanation:\n\nTo create a database table, use command “create\
    \ table table-name;” For example:\n\nmysql>create table myTable;\n\n4.  Which\
    \ following statement is not correct about MySql data types?\n\n1.  int: An integer\
    \ from -2147483648 to 2147483647\n\n2.  date: A date with format of YYYY-MM-DD\
    \ \n\n3.  text: A string with length from 1 to 65535 characters.\n\n4.  char(\
    \ ): A string of defined variable length up to 255 characters long.\n\n4\\. Answer:\
    \ D\n\nExplanation: \n\nchar( ) means a string with defined fixed length from\
    \ 1 to 255 character long. For example: char(90) pads a smaller string to make\
    \ it 90 characters long.\n\nvarchar( ) means a string of defined variable length\
    \ from 1 to 255 characters long with padding.\n\n5.  Which follow word is not\
    \ a MySql table modifier?\n\n1.  null\n\n2.  unique\n\n3.  auto\\_increment\n\n\
    4.  primary key( )\n\n5.  Answer:  A\n\nExplanation: \n\n“null” is not a MySql\
    \ table modifier. It should be “not null”. For example:\n\nmysql> create table\
    \ myTable( \n\nid int auto\\_crement, \n\ndata1 char (30) not null, \n\ndata2\
    \ varchar(30) not null, \n\nprimary key(id) \n\n);"
