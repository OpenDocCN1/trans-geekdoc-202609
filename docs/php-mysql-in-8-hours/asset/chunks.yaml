    \ :: function( ); |\n\n| --- |\n\n## Example:\n\nclass animal{\n\nvar head;\n\n\
    function tail( ) {…}\n\n}\n\nclass dog extends animal{\n\nanimal :: head;\n\n\
    animal :: tail( );\n\n}\n\n## Explanation:\n\n“animal :: head;” means in sub class\
    \ “dog”, a class named “animal” references a variable “head” in parent class.\n\
    \n“animal::tail( );” means in sub class ”dog”, a class named “animal” calls a\
    \ function ”tail( )” in parent class.\n\n#  \n\n#  \n\n#  \n\n# Appendix 1\n\n\
    # Security Tips\n\nWhy Security Code?\n\nIt is very important to ensure the safety\
    \ of PHP web site on Internet. There are various dangerous attacks from anonymous\
    \ hackers. These risks list as following:\n\n| Name || Malicious Behaviors |\n\
    \n| --- | --- |\n\n| Cross-Site Scripting || Steal user information |\n\n| Spoofed\
    \ Forms || Remove client-side data |\n\n| SQL Injection || Ruin database data\
    \  |\n\n| Remote Code Injection || Controlled by attacker |\n\n| Command Injection\
    \ || Execute bad commands |\n\n| Session Fixation || Set another person's SID\
    \ |\n\n| Session Hijack || Hijack user session key |\n\n| …… || …… |\n\nAttacker\
    \ inputs malicious codes in HTML form.\n\n<input type=”password” name= “password”>\n\
    \n<input type= “text” name= “characters” /> \n\n<textarea name = “words” rows=\
    \ size1 cols= size2>\n\nFilter Malicious Password\n\n| ctype\\_alnum( $\\_POST\\\
    [ “password ” \\]) |\n\n| --- |\n\n“ctype\\_alnum ( )” only accepts a to z characters\
    \ and 0 to 9 numbers, and returns true. Don’t allow <?, <%, <!, #, $, %, ^, &,\
    \ \\* and any other symbols.\n\n## Example:\n\nTo filter malicious password, the\
    \ PHP codes look like this:\n\n$clean = array( );         // defines an array\
    \ \n\nif ( ctype\\_alnum ( $\\_POST\\[“password”\\]))\n\n{\n\n$clean \\[“password”\\\
    ] = $\\_POST\\[“password”\\]\n\n}\n\n## Explanation:\n\n“$clean = array( );” defines\
    \ an array named “$clean”.\n\n“ctype\\_alnum ( $\\_POST\\[“password”\\])” only\
    \ allows a to z and 0 to 9, and return true.\n\n“$clean \\[“password”\\]” stores\
    \ the characters or numbers, without other symbols such as @, #, $, %, &, <?,\
    \ <%, <! …….\n\nFilter Malicious Characters\n\n| ctype\\_alpha( $\\_POST\\[ “characters”\
    \ \\]) |\n\n| --- |\n\n“ctype\\_alpha( )” only accepts a to z characters, and\
    \ returns true. Don’t allow 0 to 9 numbers and <?, <%, <!, #, $, %, ^, &, and\
    \ any other symbols.\n\n## Example:\n\nTo filter malicious characters, the PHP\
    \ codes look like this:\n\n$clean = array( );         // defines an array \n\n\
    if ( ctype\\_alpha ( $\\_POST\\[“characters”\\]))\n\n{\n\n$clean \\[“characters”\\\
    ] = $\\_POST\\[“characters”\\]\n\n}\n\n## Explanation:\n\n“$clean = array( );”\
    \ defines an array named “$clean”.\n\n“ctype\\_alpha ( $\\_POST\\[“characters”\\\
    ])” only allows a to z characters, and return true.\n\n“$clean \\[“characters”\\\
    ]” stores characters only, without any numbers and other symbols such as @, #,\
    \ $, %, &, <?, <%, <! …….\n\nFilter Malicious Input\n\n| str\\_replace(\"ch1\"\
    , \"ch2 \", $\\_POST \\[“text”\\] ) |\n\n| --- |\n\n“str\\_replace( )” can replace\
    \ character1 by charcter2 in what user have inputted.\n\n“$\\_POST\\[text\\]”\
    \ is the text inputted by user.\n\n##  \n\n## Example:\n\n$clean = array( );   \
    \ // define an array\n\n$clean\\[“text”\\]=str\\_replace(\"malicious\", \"  \"\
    , $\\_POST\\[text\\]);   \n\n$clean\\[“text”\\]= str\\_replace(\"@\", \"(at)\"\
    , $\\_POST\\[text\\]);\n\n$clean\\[“text”\\]= str\\_replace(\"%\", \"percent\"\
    , $\\_POST\\[text\\]);\n\n## Explanation:\n\n“str\\_replace(\"script\", \"  \"\
    , $\\_POST\\[text\\]” replaces “malicious” by an empty string.\n\n“$str\\_replace(\"\
    @\", \"(at)\", $\\_POST\\[text\\]);” replaces @ by “(at)”.\n\n“str\\_replace(\"\
    %\", \"percent\", $\\_POST\\[text\\]);” replaces % by “percent”.\n\n$clean\\[“text”\\\
    ] stores the text you need.\n\nLimit Specified Input\n\n| in\\_array( $\\_POST\
    \ \\[“words”\\], myarray ) |\n\n| --- |\n\n“in\\_array ( )” can limit the inputted\
    \ words from users. Allow specified characters or numbers that can be inputted,\
    \ and returns true.\n\n## Example:\n\n$clean = array( );    // define an array\n\
    \n$myarray = array( “Rose”, “Andy”, “Judy”, “Tomy” );\n\nif ( in\\_array( $\\\
    _POST\\[“words”\\], $myarray ) )\n\n{ \n\n$clean\\[“words”\\] = $\\_POST\\[“words”\\\
    ];\n\n}\n\n## Explanation:\n\n“$myarray = array( “Rose”, “Andy”, “Judy”, “Tomy”\
    \ );” specifies  the inputted words that are one of the “Rose”, “Andy”, “Judy”,\
    \ “Tomy” only.\n\n“in\\_array( $\\_POST\\[“words”\\],  $myarray)” checks the inputted\
    \ words if accord with the specified characters or numbers in $myarray. \n\n“$clean\\\
    [“words”\\]” stores the specified words only.\n\nEscape Output\n\nEscape output\
    \ means encoding the output so that the original meaning is preserved, which can\
    \ prevents the user from potentially damaging commands.\n\n| htmlentities( );htmlspecialchars(\
    \ ); |\n\n| --- |\n\n “htmlentities( );” and “htmlspecialchars( )” can convert\
    \ characters to HTML entities in source code.\n\n## Example:\n\n## $str = \"<\
    \ © Ray >\";\n\n## echo htmlentities ( $str ); \n\n(   Output in source code:  \
    \ &lt;&copy;Ray;&gt;     )\n\n## Explanation\n\n“htmlentities($str)” converts\
    \ the \"< © Ray \\>\" to html entities.\n\n“&lt;” are html entities, meaning “<”.\n\
    \n“&copy” are html entities, meaning “©”.\n\n“&gt” are html entities, meaning\
    \ “>”.\n\nhtmlspecialchars( ) is almost the same as htmlentities( ).\n\nTo check\
    \ the source code in IE browser: view-> source\n\nProtect Database\n\n| mysql\\\
    _real\\_escape\\_string( ) |\n\n| --- |\n\n“mysql\\_real\\_escape\\_string( )”\
    \ can eliminate the risk of SQL injection attacks. \n\nBefore using MySQL query,\
    \ do two things:\n\n(1) Always use clean parameters.\n\n(2) Always use “mysql\\\
    _real\\_escape\\_string(  )” to escape the output for Database, prevent SQL injection\
    \ attacks.\n\n## Example:\n\n$mysql = array( );       //  define an array\n\n\
    $mysql \\[ ‘product’ \\] =\n\n   mysql\\_real\\_escape\\_string( $clean\\[‘product’\\\
    ] );\n\n$sql = “SELECT \\*\n\n            FROM   catalog     // catalog is a table\n\
    \n            WHERE   product = ‘{ $mysql \\[ ‘product’ \\] }’”;\n\n## Explanation:\n\
    \n “$clean\\[‘product’\\]” is a clean parameter.\n\n“$mysql \\[ ‘product’ \\]”\
    \ has been escaped, which can be used to MySQL query. \n\n#  \n\n# Appendix 2\n\
    \nMYSQL Commands\n\nCharts\n\n(1)          Database Commands\n\n| MySQL Commands\
    \ || Descriptions |\n\n| --- | --- |\n\n| CREATE DATABASE database-name || create\
    \ database |\n\n| USE database-name || use a database |\n\n| SHOW database-name\
    \ || show a database |\n\n| DROP database-name || remove a database |\n\n(2)        \
    \ Table Commands\n\n| MySQL Commands || Descriptions |\n\n| --- | --- |\n\n| CREATE\
    \ TABLE  table-name || create table |\n\n| SHOW TABLE || show all tables |\n\n\
    | DESCRIBE || show fields property |\n\n| SHOW COLUMNS FROM table-name || show\
    \ a field property |\n\n| SHOW INDEX FROM table-name || list index field property\
    \ |\n\n| ALTER TABLE table-name || change data of a field |\n\n| DROP TABLE table-name\
    \ || remove a table |\n\n| OPTIMIZE table-name || optimize a table |\n\n(3)        \
    \ Field Modifiers\n\n| Modifier || Descriptions |\n\n| --- | --- |\n\n| AUTO\\\
    _INCREMENT || automatically generate a serial number |\n\n| NUT NULL || cannot\
    \ be empty value |\n\n| NULL || can be empty value |\n\n| UNIQUE || cannot not\
    \ duplicate any entry |\n\n| PRIMARY KEY || specify as a primary key  |\n\n| DEFAULT\
    \ || specify a default value for a field |\n\n| INDEX || specify an index field\
    \ for table |\n\n(4)        Operation Commands\n\n| Modifier || USE |\n\n| ---\
    \ | --- |\n\n| SELECT field FROM table WHERE condition || query data |\n\n| INSERT\
    \ INTO table ( field ) VALUES (value) || insert data |\n\n| DELETE FROM table\
    \ WHERE condition || delete data |\n\n| UPDATE table SET field = value WHERE condition\
    \ || update data |\n\n| PEPLACE INTO table (field ) VALUES (value) || replace\
    \ data |\n\n(5)         mysql\\_xxx\\_xxx (  )\n\n| Commands || Description |\n\
    \n| --- | --- |\n\n| mysql\\_affected\\_row ( ) || Returns the number of row affected\
    \ by query |"
