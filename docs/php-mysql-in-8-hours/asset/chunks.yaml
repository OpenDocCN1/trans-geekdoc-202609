    \ table-name;`\n3. `new table-name;`\n4. `new table-name;`\n\n**3. Answer: B**\n\
    \n**Explanation:**\nTo create a database table, use `create table-name;`. For\
    \ example: `mysql>create myTable;`\n\n### 4. Which following statement is not\
    \ correct about MySql data types?\n\n1. `int`: An integer from -2147483648 to\
    \ 2147483647\n2. `date`: A date with format of YYYY-MM-DD\n3. `text`: A string\
    \ with length from 1 to 65535 characters.\n4. `char( ): A string of defined variable\
    \ length up to 255 characters long.\n\n**4. Answer: D**\n\n**Explanation:**\n\
    `char( )` means a string with defined fixed length from 1 to 255 character long.\
    \ For example: `char(90)` pads a smaller string to make it 90 characters long.\
    \ `varchar( )` means a string of defined variable length from 1 to 255 characters\
    \ long with padding.\n\n### 5. Which follow word is not a MySql table modifier?\n\
    \n1. `null`\n2. `unique`\n3. `auto_increment`\n4. `primary key( )`\n\n**5. Answer:\
    \ A**\n\n**Explanation:**\n`null` is not a MySql table modifier. It should be\
    \ `not null`. For example:\n```sql\nmysql> create myTable(\nid int auto_crement,\n\
    data1 char (30) not null,\ndata2 varchar(30) not null,\nprimary key(id) \n);\n\
    ```\n"
