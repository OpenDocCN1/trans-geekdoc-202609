    \ // line1\nvar_dump ($arr1===$arr2); // line2\nvar_dump ($arr1==$arr3); // line3\n\
    var_dump ($arr1===$arr4); // line4\n```\n\n1. line 1\n2. line 2\n3. line 3\n4.\
    \ line 4\n\n### 4. 答案：A\n\n解释：\n\n如果两个数组包含相同的键/值对，`==` 返回 true。\n如果两个数组包含相同的键/值对，且顺序相同、数据类型相同，`===`\
    \ 返回 true。\n\n### 5. 下列哪一行返回 true？\n\n```php\n$arr= array(‘a’=>10, ‘b’=20);\n\
