    1. `%s` outputs a string.

    2. `%f` outputs a floating-point number.

    3. `%d` outputs a decimal number.

    4. `%h` outputs a hexadecimal number.

    5. **Answer: D**


    **Explanation:**

    You should use `%x` or `%X` instead of `%h`.

    `%x` outputs a number as hexadecimal with lowercase letters.

    `%X` outputs a number as hexadecimal with uppercase letters.


    6. Which following output is not correct?

    1. `printf(“%05d”, 68);` // output: 68000

    2. `printf(“%\*5.2f, 12.345”);` // output: `***12.35`

    3. `printf(“%o”, 100);` // output: 144

    4. `printf(“%x”, 100);` // output: 64


    6. **Answer: A**


    **Explanation:**

    It should be `00068`.

    If the output occupies fewer characters than the total, zeroes will fill the difference.


    7. Which following statement is not correct about Regular Expressions?

    1. `^` matches the start of the string.

    2. `$` matches the end of the string.

    3. `\\w` matches the whitespace character.

    4. `\\d` matches the any digit.


    7. **Answer: C**


    **Explanation:**

    `\\w` matches any word character.

    `\\s` matches any whitespace character.


    8. Which following statement is not correct about Regular Expression?

    1. `\*` means that the character can appear zero or more times.

    2. `\+` means that the character can appear one or more times.

    3. `?` means that the character can appear zero or one times.

    4. `{x,y}` means that the character can appear x times or y times.


    8. **Answer: D**


    **Explanation:**

    `{x,y}` means that the character can appear at least x times, and no more than
    y times.


    9. Which following line is not correct?

    ```php

    <form action=”myfile.php” method=”post”> // line 1

    <input type=”text” name=”username”>  // line 2

    </form>


    <?php  // myfile.php

    $username=$__GET\[‘username’\];  // line 3

    echo $username;  // line 4

    ?>

    ```

    1. line 1

    2. line 2

    3. line 3

    4. line 4


    9. **Answer: C**


    **Explanation:**

    It should be `$username=$__POST\[‘username’\]`.

    Because submission method is “post” in line 1, instead of “get”.

    If the submission method is unknown, the values can be referenced from the special
    `$_REQUEST[]` array.


    10. Given:

    ```php

    <form method=”post” action=”?>>

    ```

    If you want current file as an action file, which following environment variable
    should use?

    1. `$_ENV`

    2. `$_SERVER\[‘PHP_SELF’\]`

    3. `$HTTP_SERVER_VARS[''HTTP_HOST’\]`

    4. `$_FILES`


    10. **Answer: B**


    **Explanation:**

    Calling `$_SERVER\[‘PHP_SELF’\]` can reload the current page.

    You can set the action file like this:

    ```php

    $self=$_SERVER\[‘PHP_SELF’\];

    <form method=”post” action=“<?php $self ?>”>

    ```

    Then, the action file is the current file.


    # Chapter 5 File Process


    1. The `fopen(fileName, operatingMode)` requires two argument: the file name and
    an operating mode. Which following statement is not correct in the following operating
    mode?

    1. `r+` opens the file for reading and writing, puts the pointer at the beginning
    of the file.

    2. `w` opens the file for writing only, puts the pointer at the beginning of the
    file, and truncates it to zero length.

    3. `a+` opens the file for reading and writing, puts the pointer at the beginning
    of the file.

    4. `x+` creates a new file for reading and writing.


    1. **Answer: C**


    **Explanation:**

    `a+` puts the pointer at the end of the file, instead of the beginning of the
    file.


    2. Which following line is not correct?

    ```php

    $filename=”myFile.txt”;

    $file=fopen($filename, “r”);  // line 1

    $filesize=filesize($file);  // line 2

    $test=fread($file, $filesize);  // line 3

    fclose($file);  // line 4

    ```

    1. line 1

    2. line 2

    3. line 3

    4. line 4


    2. **Answer: B**


    **Explanation:**

    It should be `$filesize=filesize($filename);`.

    The argument of `filesize()` should use the `$filename` variable.

    `fopen()` opens file. `fread()` reads file. `fclose()` closes file.


    3. To record the IP address of visitors to the web page, use____

    1. `$_SERVER\[‘HTTP_REFERER’\]`

    2. `$_SERVER\[‘PHP_SELF’\]`

    3. `$_SERVER\[‘HTTP_USER_AGENT’\]`

    4. `$_SERVER\[‘REMOTE_ADDR’\]`


    3. **Answer: D**


    **Explanation:**

    `$_SERVER\[‘REMOTE_ADDR’\]` can record the visitor’s IP address.

    `$_SERVER\[‘HTTP_REFERER’\]` returns the complete URL of the current page.

    `$_SERVER\[‘PHP_SELF’\]` returns the filename of the currently executing script.

    `$_SERVER\[‘HTTP_USER_AGENT’\]` can identify the user’s browser.


    4. Which following line is not correct?

    ```php

    <?php

    echo “Hello World!”; // line 1

    $location=”http://www.example.com”; // line 2

    header(''Location:$location'');  // line 3

    exit( );  // line 4

    ?>

    ```

    1. line 1

    2. line 2

    3. line 3

    4. line 4


    4. **Answer: A**


    **Explanation:**

    Important notice: The `header()` function must appear at the very start of the
    page, before any content is sent. Namely `header()` must be called before any
    output is sent. Otherwise, it will cause an error.


    5. Which of the functions get the entire contents of a file in such way that it
    may be used as part of an expression?

    1. `fopen()`

    2. `feadfile()`

    3. `fgets()`

    4. `file()`


    5. **Answer: D**


    **Explanation:**

    `file()` can get the entire contents of a file in such way that it may be used
    as part of an expression.

    `fopen()` opens file. `fgets()` reads line by line.


    6. Which following line is not correct?

    Given:

    ```html

    <input type=""file” name=”FileLoad” size=0>

    ```

    ```php

    <?php echo $_FILES\[‘FileLoad’\]\[‘name’\];?> // line 1

    <?php echo $_FILES\[‘FileLoad’\]\[‘length’\];?> // line 2

    <?php echo $_FILES\[‘FileLoad’\]\[‘type’\];?> // line 3

    <?php echo $_FILES\[‘FileLoad’\]\[‘error’\];?> // line 4

    ```

    1. line 1

    2. line 2

    3. line 3

    4. line 4

