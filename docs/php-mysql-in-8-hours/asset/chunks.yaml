    \ “ Select db successfully! ”;\n\n}\n\n( Output:  Select db successfully! )\n\n\
    ## Explanation:\n\n“$select=mysqli\\_select\\_db( $con, “mydatabase” )” try to\
    \ make PHP select MySql database. If succeed it returns true. If fail it returns\
    \ false. The result assigns to $select.\n\n“if ( $select )” can test $select true\
    \ or false.\n\nInsert Table Data\n\n| $sql=”insert into table-name (columns) value\
    \ (\\\\”values\\\\”)”; $query=mysqli\\_query( $sql, $con); |\n\n| --- |\n\n$sql=”insert\
    \ into table-name (columns) value (\\\\”values\\\\”)” is used to insert table\
    \ data.\n\n$query=mysqli\\_query( $sql, $con) executes the query.\n\n “$con” is\
    \ the connection of MySql server. (See previous page).\n\n## Example:\n\n$sql=”insert\
    \ into table-name (color4) value (\\\\”$red\\\\”)”;\n\n$query=mysqli\\_query(\
    \ $sql, $con);\n\nif( $query ) {\n\necho  “ Insert data successfully! ”;\n\n}\n\
    \n( Output: Insert data successfully! )\n\n## Explanation:\n\ninsert into table-name\
    \ (color4) value (\\\\”$red\\\\”) inserts $red to color4, mysqli\\_query( $sql,\
    \ $con) performs the query.\n\nAlter Table Data Type\n\n| $sql=”alter table table-name\
    \ modify column data type”; $query=mysqli\\_query( $sql, $con); |\n\n| --- |\n\
    \n$sql=”alter table table-name modify column data type” is used to change data\
    \ type of the column name.\n\n$query=mysqli\\_query( $sql, $con) executes the\
    \ query.\n\n“$con” is the connection of MySql server. (See previous page).\n\n\
    ## Example:"
