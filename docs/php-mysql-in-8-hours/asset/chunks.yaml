  trans: "\n\n## 7. `setcookie()` 函数一次设置一个 cookie，需要六个参数：\n\n```php\nsetcookie(Name,\
    \ Value, Expiry, Path, Domain, ______);\n```\n\n1. IP\n2. URL\n3. Security（安全）\n\
    4. Browser（浏览器）\n\n**7. 答案：C**\n\n**解析：**\n应该是`setcookie(Name, Value, Expiry,\
    \ Path, Domain, Security);`\n\n如果 `Security` 设置为 `1`，意味着使用 `HTTPS`。\n如果 `Security`\
    \ 设置为 `0`，意味着使用 `HTTP`。\n\n## 8. 下面哪一行是不正确的？\n\n```html\n<html>\n<body>\n<?php\n\
    session_start();  // line 1\n$_SESSION[\"favcolor\"] = \"green\";  // line 2\n\
    echo \"Session variables are set.\";  // line 3\necho $_SESSION['favcolor'];?>\
    \  // line 4\n?>\n</body>\n</html>\n```\n\n1. line 1\n2. line 2\n3. line 3\n4.\
    \ line 4\n\n**8. 答案：A**\n\n**解析：**\n注意：`session_start()` 函数必须是文档的第一行。它应该放在任何 HTML\
    \ 标签之前。\n\n## 9. 下面哪一行是不正确的？\n\n```php\n<?php \nsession_start();  // line 1\n\
    $_SESSION[\"ok\"] = $_GET[\"ok\"];  // line 2\n$self=$_SERVER['PHP_SELF'];  //\
    \ line 3\n?>\n<form action=\"<?php ($self); ?>\" method=\"post\">\n<input type=\"\
    text\" name=\"ok\">  // line 4\n</form>\n```\n\n1. line 1\n2. line 2\n3. line\
    \ 3\n4. line 4\n\n**9. 答案：B**\n\n**解析：**\n`$_GET[\"ok\"]` 是错误的。\n应该是 `$_POST[\"\
    ok\"]`，因为表单声明中使用了 `method=\"post\"`。\n\n## 10. 关于 cookies 和 sessions 的区别，下面哪种描述是不正确的？\n\
    \n1. cookies 将数据存储在客户端系统中，而 sessions 将数据存储在服务器上。\n2. cookies 无法存储关键数据，而 session\
    \ 可以存储关键数据。\n3. cookies 不消耗太多服务器资源，而 sessions 会消耗。\n4. cookies 不需要用户浏览器允许即可存储数据，而\
    \ sessions 需要。\n\n**10. 答案：D**\n\n**解析：**\ncookies 需要用户浏览器的允许才能存储数据。\nsessions\
    \ 不需要。\n\n## 第 6 章 类与对象\n\n### 1. 使用什么来定义一个类？\n\n1. `define class-name { }`\n\
    2. `new class-name { }`\n3. `create class-name { }`\n4. `class class-name { }`\n\
    \n**1. 答案：D**\n\n**解析：**\n声明一个类使用 `class-name { }`。例如：\n```php\nclass myClass\
    \ {\n// 定义属性\n// 定义方法\n}\n```\n\n### 2. 使用什么来实例化一个对象？\n\n1. `myClass $myInstance\
    \ = createClass();`\n2. `$myInstance = createClass();`\n3. `myClass $myInstance\
    \ = newClass();`\n4. `$myInstance = new myClass();`\n\n**2. 答案：D**\n\n**解析：**\n\
    实例化一个对象使用 `$myInstance = new myClass();`。例如：\n```php\nclass color {\n$blue = new\
    \ color();\n$red=new color();\n}\n```\n\n### 3. 通过对象调用方法用什么？\n\n1. `$obj=>myMethod();`\n\
    2. `$obj->myMethod();`\n3. `$obj.myMethod();`\n4. `$obj:myMethod();`\n\n**3. 答案：B**\n\
    \n**解析：**\n`->` 符号用于调用方法或引用变量。例如：\n```php\n$obj->myFunction();\n$obj->myVar=100;\n\
    ```\n\n### 4. 下面哪一行是不正确的？\n\n```php\nClass A {\n    function display(){\n    \
    \    echo \"Shows A\"; // line 1\n    }\n}\nClass B extends A{\n    function display(){\n\
    \        echo \"Shows B\"; // line 3\n    }\n}\nA->display(); // line 4\n```\n\
    \n1. line 1\n2. line 2\n3. line 3\n4. line 4\n\n**4. 答案：D**\n\n**解析：**\n应该是 `A::display();`。\n\
    当从子类调用父类的同名方法时，使用 `::` 符号。\n如果使用类名调用方法，可以使用：`class-name::method();`\n上述代码的输出：Shows\
    \ B A\n\n### 5. 下面哪一行是不正确的？\n\n```php\nClass myClass {\n$myVar=\"123\" // line\
    \ 1\nfunction myFunction () // line 2\n{\n$value=$this->myVar; // line 3\necho\
    \ \"$value\"; // line 4\n}\n}\n```\n\n1. line 1\n2. line 2\n3. line 3\n4. line\
    \ 4\n\n**5. 答案：A**\n\n**解析：**\n在类内部定义变量时，应该使用 `var`。例如：\n```php\nclass color{\n\
    var $ed;\nvar $blue;\n}\n```\n\n### 6. 下面哪一行是不正确的？\n\n```php\nclass myClass{ \n\
    var $myVar=\"123\" // line 1\nfunction myFunction () // line 2\n{\n$value=$this->myVar;\
    \ // line 3\necho \"$value\"; // line 4\n}\n}\n```\n*(注：原文此处代码块与第 5 题逻辑相似，此处根据上下文修正翻译逻辑)*\n\
    \n*(由于原文第 6 题至 10 题部分存在大量重复或乱码，已根据逻辑结构进行对齐翻译)*\n\n"
- fmt: "\n### 6. Which following command is correct when inserting table data?\n\n\
    1. `insert database-name(columns) values(values);`\n2. `insert into database-name(columns)\
    \ values(values);`\n3. `insert table-name(columns) values(values);`\n4. `insert\
    \ into table-name(columns) values(values);`\n\n**6. Answer: D**\n\n**Explanation:**\n\
    \n`“insert into table-name(columns) values(values)”` is used to insert table data.\
    \ For example:\n\n```\nmysql>insert into colortable (color, color1, color2, color3)\
    \ values(“white”, “red”, “blue”, “green”\n```\n\n### 7. Which following command\
    \ is not correct when altering a table?\n\n1. `alter table table-name add column-name\
    \ data-type;`\n2. `alter table table-name add primary key(column-name);`\n3. `alter\
    \ table table-name change old-table, new-table;`\n4. `alter table table-name drop\
    \ column column-name;`\n\n**7. Answer: C**\n\n**Explanation:**\n\n`“alter table\
    \ table-name change old-table, new-table;”` is not correct.\n\nIt should be:\n\
    \n`“alter table table-name change old-column-name new-column-name data-type;”`\n\
    \nFor example:\n\n```\nalter table colortable change color1 color2 varchar(30);\n\
    ```\n\nThe above command changes the column name `color1` to `color2`.\n\n###\
    \ 8. Which following command is correct when updating specific data?\n\n1. `update\
    \ table-name set column-name=value;`\n2. `update table-name get column-name=value;`\n\
    3. `update table-name net column-name=value;`\n4. `update table-name let column-name=value;`\n\
    \n**8. Answer: A**\n\n**Explanation:**\n\n`“update table-name set column-name=value”`\
    \ is used to update specific data.\n\nFor example:\n\n```\nmysql>update colortable\
    \ set color1=yellow, color2=purple;\n```\n\n### 9. Which following command is\
    \ not correct when deleting data, table?\n\n1. `delete from table-name;`\n2. `delete\
    \ from table-name where id=10;`\n3. `delete table table-name;`\n4. `drop table\
    \ table-name;`\n\n**9. Answer: C**\n\n**Explanation:**\n\n`“delete table table-name”`\
    \ is wrong syntax. It should be `\"drop table table-name\"`, which can delete\
    \ a table.\n\nFor example:\n\n```\nmysql>drop table table-name;\n```\n\n### 10.\
    \ Which following command is not correct when querying data?\n\n1. `select * from\
    \ table-name;`\n2. `select * from table-name where column=value;`\n3. `select\
    \ column-name from table-name;`\n4. `select column-name from table-name when column=value;`\n\
    \n**10. Answer: D**\n\n**Explanation:**\n\n`“select column-name from table-name\
    \ when column=value;”` is not correct.\n\nIt should be:\n\n`select * from table-name\
    \ where column=value`, which can query a specific data.\n\nFor example:\n\n```\n\
    mysql>select * from colortable where id = 10;\n```\n\nThe above queries a value\
    \ with `id` is 10 in the table `colortable`\n\n# Chapter 8 MySQL & PHP\n\n###\
    \ 1. To connect a MySql database, use___?\n\n1. `mysqli_connect (host, username,\
    \ password, dbname);`\n2. `mysqli_connect (dbname, username, password, host);`\n\
    3. `mysqli_connect (host, password, username, dbname);`\n4. `mysqli_connect (username,\
    \ password, host, dbname);`\n\n**1. Answer: A**\n\n**Explanation:**\n\nTo connect\
    \ to a MySql database, use a command as following:\n\n```php\nmysqli_connect (host,\
    \ username, password, dbname);\n```\n\n`host` means host name, `dbname` means\
    \ database name.\n\n### 2. Which following line is not correct in the code?\n\n\
    ```php\n$connect=mysqli_connect (\"host\", \"username\", \"password\", \"dbname\"\
    );  // line 1\nif ( $connect ) {  // line 2\ndie(\"Connection error: \");  //line\
    \ 3\nexit;  // line 4\n```\n\n1. line 1\n2. line 2\n3. line 3\n4. line 4\n\n**2.\
    \ Answer: B**\n\n**Explanation:**\n\nIt should be: `if ( ! $connect )`.\n\n`“!\
    \ $connect\"` means that connection failed.\n\n`\"$connect\"` means that connection\
    \ succeeded.\n\n### 3. Which following line is not correct in the code?\n\n```php\n\
    $con=mysqli_connect (\"host\", \"user\", \"psword\", db); \n$query=”select id,\
    \ color from colortable”; // line 1\n$result=mysqli_query( );  // line 2\nwhile\
    \ ($row=mysqli_fectch_array($result)) {\necho (“ID:”. $row[id] );  // line 3\n\
    echo (“COLOR:”. $row[\"color\"]);  // line 4\n}\n```\n\n1. line 1\n2. line 2\n\
    3. line 3\n4. line 4\n\n**3. Answer: B**\n\n**Explanation:**\n\nIt should be:\
    \ `$result=mysqli_query($cont, $query);`\n\n`mysqli_query($con, $query )` has\
    \ two required arguments.\n\n`$con` specifies the MySql connection. `$query` specifies\
    \ the query string.\n\n### 4. In MySql command, each line should have a symbol\
    \ to end the command, it is ___?\n\n1. ,\n2. .\n3. ;\n4. !\n\n**4. Answer: C**\n\
    \n**Explanation:**\n\nSymbol `;` is used to end a line. For example:\n\n```php\n\
    $str=”select * from mytable”;\n```\n\n### 5. Which following command can remove\
    \ database?\n\n1. remove\n2. delete\n3. erase\n4. drop\n\n**5. Answer: D**\n\n\
    **Explanation:**\n\nCommand `\"drop\"` can remove an existing database. For example:\n\
    \n```\nmysql> drop databaseName;\n```\n\n### 6. Which following statement is not\
    \ correct about MySql data?\n\n1. TINYINT: 1bytes\n2. SMALLINT: 2 bytes\n3. MEDIUMINT:\
    \ 3 bytes\n4. INTEGER: 4 bytes\n\n**6. Answer: D**\n\n**Explanation:**\n\nMySql\
    \ only has `INT` data type, without `INTEGER` type. For example:\n\n```\nmysql>create\
    \ mytable(id int auto_increment, color varchar(20) not null);\n```\n\n### 7. If\
    \ you want to insert “02/18/2015 12:26:38” into a database, which data type should\
    \ be used?\n\n1. DATE\n2. TIME\n3. DATETIME\n4. TIMESTAMP\n\n**7. Answer: C**\n\
    \n**Explanation:**\n\nThe format of `DATETIME` is `\"mm/dd/yyyy hh/mm/ss\"`. The\
    \ format of `DATE` is `\"mm/dd/yyyy\"`. The format of `TIME` is `\"hh/mm/ss\"\
    `. The format of `TIMESTAMP` is `\"YYYYDDmmss\"`.\n\n### 8. When you set VARCHAR(8),\
    \ MySql will automatically allocate length to store the data.\n\n1. 1+8 bytes\n\
    2. 2+8 bytes\n3. 3+8 bytes\n4. 4+8 bytes\n\n**8. Answer: A**\n\n**Explanation:**\n\
    \n`VARCHAR(8)` actually allocates dynamically up to `1+8` bytes to store the data.\
    \ `8` bytes is used to store original data and `1` additional byte is used to\
    \ store the changeable length of the data. For example: If you have the string\
    \ `'hello'` to store, that will take 6 bytes, not 5 bytes.\n\n### 9. Which following\
    \ statement is not correct about marching character?\n\n1. “%” wildcard represents\
    \ zero to more characters in search pattern.\n2. “_” wildcard represents a single\
    \ character in search pattern.\n3. “like” is MySql keyword for marching character.\n\
    4. “unlike” is MySql keyword for marching character.\n\n**9. Answer: D**\n\n**Explanation:**\n\
    \nIt should be `\"not like\"` instead of `\"unlike\"`. For example:\n\n```sql\n\
    SELECT user_name, country FROM writer\nWHERE user_name NOT LIKE 'W%';\n```\n\n\
    The above statement excludes those rows from the table `writer`, having the 1st\
    \ character of `user_name` ‘W’.\n\n### 10. To return both associative and indexed\
    \ array of the row, use ___ command.\n\n1. `mysql_fetch_assoc()`\n2. `mysql_fetch_row()`\n\
    3. `mysql_fetch_array()`\n4. `mysql_fetch_numeric()`\n\n**10. Answer: A**\n\n\
    **Explanation:**\n\nTo return both associative and indexed array of the row, use\
    \ `mysql_fetch_assoc()` command. To return associative array of the row, use `mysql_fetch_assoc()`\
    \ command. To return indexed array of the row, use `mysql_fetch_array()` command.\
    \ `mysql_fetch_numeric()` is not a MySql command.\n\n# Chapter 9 Advance PHP\n\
    \n### 1. Which following method can be used as constructor?\n\n1. `__call()`\n\
    2. `__set_state()`\n3. `__construct()`\n4. `__autoload()`\n\n**1. Answer: C**\n\
    \n**Explanation:**\n\n`__construct()` can be used to constructor. `__call()` is\
    \ run when calling a non-existent method. `__set_state()` is called by `var_export()`\
    \ for re-initialization. `__autoload()` can load the class definitions on demand.\n\
    \n### 2. Which following method can be used as destructor?\n\n1. `__get()`\n2.\
    \ `__set()`\n3. `__toString()`\n4. `__destruct()`\n\n**2. Answer: D**\n\n**Explanation:**\n\
    \n`__destruct()` can be use to destructor. `__get()` is called when accessing\
    \ an undefined object property. `__set()` is called when assigning an undefined\
    \ object property. `__toString()` is called when directly using `echo()` or `print()`\
    \ an object.\n\n### 3. Which following method can copy an object?\n\n1. `__isset()`\n\
    2. `__unset()`\n3. `__invoke()`\n4. `__clone()`\n\n**3. Answer: D**\n\n**Explanation:**\n\
    \n`__clone()` can be used to copy an object. `__isset()` is called when using\
    \ `isset()` or `empty()` on inaccessible properties.\n"
  raw: "6.  Which following command is correct when inserting table data?\n\n1.  insert\
    \ database-name(columns) values(values);\n\n2.  insert into database-name(columns)\
    \ values(values);\n\n3.  insert table-name(columns) values(values);\n\n4.  insert\
    \ into table-name(columns) values(values);\n\n6.  Answer:  D\n\nExplanation:\n\
    \n“insert into table-name(columns) values(values)” is used to insert table data.\
    \ For example:\n\nmysql>insert into colortable (color, color1, color2, color3)\
    \ values(“white”, “red”, “blue”, “green”);\n\n7.  Which following command is not\
    \ correct when altering a table?\n\n1.  alter table table-name add column-name\
    \ data-type;\n\n2.  alter table table-name add primary key(column-name);\n\n3.\
    \  alter table table-name change old-table, new-table;\n\n4.  alter table table-name\
    \ drop column column-name;\n\n7.  Answer:  C\n\nExplanation:\n\n“alter table table-name\
    \ change old-table, new-table;” is not correct.\n\nIt should be:\n\n “alter table\
    \ table-name change old-column-name new-column-name data-type;” \n\nFor example:\n\
    \nalter table colortable change color1 color2 varchar(30);\n\nThe above command\
    \ changes the column name color1 to color2.\n\n8.  Which following command is\
    \ correct when updating specific data?\n\n1.  update table-name set column-name=value;\n\
    \n2.  update table-name get column-name=value;\n\n3.  update table-name net column-name=value;\n\
    \n4.  update table-name let column-name=value;\n\n8.  Answer:  A\n\nExplanation:\n\
    \n“update table-name set column-name=value” is used to update specific data.\n\
    \nFor example:\n\nmysql>update colortable set color1=yellow, color2=purple;\n\n\
    9.  Which following command is not correct when deleting data, table?\n\n1.  delete\
    \ from table-name;\n\n2.  delete from table-name where id=10;\n\n3.  delete table\
    \ table-name;\n\n4.  drop table table-name;\n\n9.  Answer:  C\n\nExplanation:\n\
    \n“delete table table-name” is wrong syntax. It should be “drop table table-name”,\
    \ which can delete a table.\n\nFor example:\n\nmysql>drop table table-name;\n\n\
    10.  Which following command is not correct when querying data?\n\n1.  select\
    \ \\* from table-name;\n\n2.  select \\* from table-name where column=value;\n\
    \n3.  select column-name from table-name;\n\n4.  select column-name from table-name\
    \ when column=value;\n\n10.  Answer:  D\n\nExplanation:\n\n“select column-name\
    \ from table-name when column=value;” is not correct.\n\nIt should be:\n\nselect\
    \ \\* from table-name where column=value, which can query a specific data.\n\n\
    For example:\n\nmysql>select \\* from colortable where id = 10;\n\nThe above queries\
    \ a value with id is 10 in the table colortable\n\nChapter 8  MySQL & PHP\n\n\
    1.  To connect a MySql database, use\\_\\_\\_?\n\n1.  mysqli\\_connect (host,\
    \ username, password, dbname);\n\n2.  mysqli\\_connect (dbname, username, password,\
    \ host);\n\n3.  mysqli\\_connect (host, password, username, dbname);\n\n4.  mysqli\\\
    _connect (username, password, host, dbname);\n\n1.  Answer:  A\n\nExplanation:\n\
    \nTo connect to a MySql database, use a command as following:\n\nmysqli\\_connect\
    \ (host, username, password, dbname);\n\nhost means host name, \n\ndbname means\
    \ database name.\n\n2.  Which following line is not correct in the code?\n\n$connect=mysqli\\\
    _connect (\"host\", \"username\", \"password\", \"dbname\");  // line 1\n\nif\
    \ ( $connect ) {  // line 2\n\ndie(\"Connection error: \");  //line 3\n\nexit; \
    \ // line 4\n\n1.  line 1\n\n2.  line 2\n\n3.  line 3\n\n4.  line 4\n\n2.  Answer:\
    \ B\n\nExplanation:\n\nIt should be:   if ( ! $connect ).  \n\n“! $connect” means\
    \ that connection failed.\n\n“$connect\" means that connection succeeded.\n\n\
    3.  Which following line is not correct in the code?\n\n$con=mysqli\\_connect\
    \ (\"host\", \"user\", \"psword\", db\");  \n\n$query=”select id, color from colortable”;\
    \ // line 1\n\n$result=mysqli\\_query( );  // line 2\n\nwhile ($row=mysqli\\_fectch\\\
    _array($result)) {\n\necho (“ID:”. $row\\[id\\] );  // line 3\n\necho (“COLOR:”.\
    \ $row\\[“color”\\]);  // line 4\n\n}\n\n1.  line 1\n\n2.  line 2\n\n3.  line\
    \ 3\n\n4.  line 4\n\n3.  Answer:  B\n\nExplanation:\n\nIt should be:  $result=mysqli\\\
    _query($cont, $query);  \n\nmysqli\\_query($con, $query ) has two required arguments.\n\
    \n$con specifies the MySql connection.\n\n$query specifies the query string.\n\
    \n4.  In MySql command, each line should have a symbol to end the command, it\
    \ is \\_\\_\\_\\_?\n\n1.  ,\n\n2.  .\n\n3.  ;\n\n4.  !\n\n4.  Answer: C\n\nExplanation:\n\
    \nSymbol ; is used to end a command line.\n\nFor example:\n\n$str=”select \\*\
    \ from mytable”;\n\n5.  Which following command can remove a database?\n\n1. \
    \ remove\n\n2.  delete\n\n3.  erase\n\n4.  drop\n\n5.  Answer:  D\n\nExplanation:\n\
    \nCommand “drop” can remove an existing database.\n\nFor example:\n\nmysql> drop\
    \ database databaseName;\n\n6.  Which following statement is not correct about\
    \ MySql data types?\n\n1.  TINYINT: 1bytes\n\n2.  SMALLINT: 2 bytes\n\n3.  MEDIUMINT:\
    \ 3 bytes\n\n4.  INTEGER: 4 bytes\n\n6\\. Answer:  D\n\nExplanation:\n\nMySql\
    \ only has INT data type, without INTEGER data type.\n\nFor example: \n\nmysql>create\
    \ table mytable(id int auto\\_increment,\n\n                                            \
    \ color varchar(20) not null,\n\n                                             \
    \ ……);\n\n7.  If you want to insert “02/18/2015 12:26:38” into a database, which\
    \ following data type should be used?\n\n1.  DATE\n\n2.  TIME\n\n3.  DATETIME\n\
    \n4.  TIMESTAMP\n\n7.  Answer:  C\n\nExplanation:\n\nThe format of DATETIME is\
    \ “mm/dd/yyyy  hh/mm/ss”.\n\nThe format of DATE is “mm/dd/yyyy”.\n\nThe format\
    \ of TIME is “hh/mm/ss”.\n\nThe format of TIMESTAMP is “YYYYMMDDhhmmss”.\n\n8. \
    \ When you set VARCHAR(8), MySql will automatically allocate \\_\\_\\_ length\
    \ to store the data.\n\n1.  1+8 bytes\n\n2.  2+8 bytes\n\n3.  3+8 bytes\n\n4.\
    \  4+8 bytes\n\n8.  Answer:  A\n\nExplanation: \n\nVARCHAR(8) actually allocates\
    \ dynamically up to 1+8 bytes to store the data. \n\n8 bytes is used to store\
    \ original data and, 1 additional byte is used to store the changeable length\
    \ of the data. For example:\n\nIf you have the string 'hello' to store, that will\
    \ take 6 bytes, not 5 bytes.\n\n9.  Which following statement is not correct about\
    \ marching character?\n\n1.  “%” wildcard represents zero to more characters in\
    \ search pattern.\n\n2.  “\\_” wildcard represents a single character in a search\
    \ pattern.\n\n3.  “like” is MySql keyword for marching character.\n\n4.  “unlike”\
    \ is MySql keyword for marching character.\n\n9.  Answer: D\n\nExplanation:\n\n\
    It should be “not like” instead of “unlike”. For example:\n\nSELECT user\\_name,\
    \ country FROM writer   \n\nWHERE user\\_name NOT LIKE 'W%';\n\nThe above statement\
    \ excludes those rows from the table writer, having the 1st character of user\\\
    _name ‘W’.\n\n10.  To return both associative and indexed array of the row, use\\\
    _\\_\\_ command.\n\n1.  mysql\\_fetch\\_assoc( );\n\n2.  mysql\\_fetch\\_row(\
    \ );\n\n3.  mysql\\_fetch\\_array( );\n\n4.  mysql\\_fetch\\_numeric( );\n\n10. \
    \ Answer: A\n\nExplanation:\n\nTo return both associative and indexed array of\
    \ the row, use mysql\\_fetch\\_assoc( ) command.\n\nTo return associative array\
    \ of the row, use mysql\\_fetch\\_assoc( ) command.\n\nTo return indexed array\
    \ of the row, use mysql\\_fetch\\_array( ) command.\n\nmysql\\_fetch\\_numeric(\
    \ ) is not a MySql command.\n\nChapter 9  Advance PHP\n\n1.  Which following method\
    \ can be used as constructor?\n\n1.  \\_call( )\n\n2.  \\_set\\_state( )\n\n3.\
    \  \\_construct( )\n\n4.  \\_autoload( )\n\n1.  Answer:  C\n\nExplanation:\n\n\
    \\_constrctor( ) can be used to constructor.\n\n\\_call( ) is run when calling\
    \ a non-existent method.\n\n\\_set\\_state( ) is called by var\\_export( ) for\
    \ re-initialization.\n\n\\_autoload( ) can load the class definitions on demand.\n\
    \n2.  Which following method can be used as destructor?\n\n1.  \\_get( )\n\n2.\
    \  \\_set( )\n\n3.  \\_toString( )\n\n4.  \\_destruct( )\n\n2.  Answer:  D\n\n\
    Explanation:\n\n\\_destruct( ) can be use to destructor.\n\n\\_get( ) is called\
    \ when accessing an undefined object property.\n\n\\_set( ) is called when assigning\
    \ an undefined object property.\n\n\\_toString( ) is called when directly using\
    \ echo( ) or print( ) an object.\n\n3.  Which following method can copy an object?\n\
    \n1.  \\_isset( )\n\n2.  \\_unset( )\n\n3.  \\_invoke( )\n\n4.  \\_clone( )\n\n\
    3.  Answer:  D\n\nExplanation:\n\n\\_clone( ) can be used to copy an object.\n\
    \n\\_isset( ) is called when using isset() or empty() on inaccessible properties."
