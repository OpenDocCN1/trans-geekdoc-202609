    echo in_array(30, $arr); // line 3\necho is_array($arr); // line 4\n```\n\n1.\
    \ line 1\n2. line 2\n3. line 3\n4. line 4\n\n### 5. 答案：D\n\n解释：\n\n`is_array(\
    \ )` 检查是否为数组。\n`isset( )` 检查指定的键是否存在。\n`array_key_exists( )` 检查数组中是否存在键。\n`in_array(\
    \ )` 检查数组中是否存在值。\n\n### 6. 下列代码的输出是什么？\n\n```php\n<?php\necho strtr(\"Hilla Warld\"\
    ,\"eo\");\n```\n\n1. ia\n2. eo\n3. Hilla Warld\n4. Hello World\n\n### 6. 答案：D\n\
    \n解释：\n\n`strtr()` 函数替换某些字符。在这里 `i` 被替换为 `e`，`a` 被替换为 `o`。\n\n### 7. 下列代码的输出是什么？\n\
    \n```php\n$str1= “123456789”;\n$str2 = “56”;\necho strstr(str1, $str2);\n```\n\
    \n1. 1234\n2. 13456\n3. 56789\n4. 56\n\n### 7. 答案：C\n\n解释：\n\n`strstr()` 函数在另一个字符串中搜索字符串第一次出现的位置。在这里在\
    \ `\"123456789\"` 中找到 `\"56\"` 并返回剩余的字符串。\n\n### 8. 下列代码的输出是什么？\n\n```php\n$str1=\
    \ “123456789”;\n$str2 = “56”;\necho strpos (str1, str2);\n```\n\n1. 3\n2. 4\n\
    3. 5\n4. 6\n\n### 8. 答案：B\n\n解释：\n\n`strpos()` 函数在另一个字符串中搜索字符串第一次出现的位置。在这里找到了字符串\
    \ `\"56\"` 的位置。\n\n### 9. 下列代码的输出是什么？\n\n```php\nfunction test(&$str2){\n$str2\
    \ .= ‘World’;\n}\n$str1 = ‘Hello ';\ntest ($str1);\necho $str1;\n```\n\n1. Hello\n\
    2. World\n3. Hello World\n4. 无输出\n\n### 9. 答案：C\n\n解释：\n\n注意函数参数中有 `&` 符号。\n如果你想通过引用传递参数，可以使用\
    \ `&`。\n`&` 可以反向赋值，例如 `str1=$str2`。\n\n### 10. 下列哪个输出格式不正确？\n\n假设现在是：November\
    \ 18 2015 18:30:50。\n\n```php\n$now1=date(“M j, Y”); \n$now2=date(“m.d.y”); \n\
    $now3=date(“g:i a”); \n$now4=date(“H:i:s”); \n```\n\n1. echo $now1; // 输出: Nov\
    \ 18, 2015\n2. echo $now2; // 输出: 11.18.15\n3. echo $now3; // 输出: 6:30 pm\n4.\
    \ echo $now4; // 输出: 06:30:50\n\n### 10. 答案：D\n\n解释：\n\n应该输出 18:30:50。\n因为 `date(“H:i:s”)`\
    \ 中的 `H` 代表 24 小时制（00-23）。\n\n---\n\n## 第 4 章 动态数据\n\n### 1. 下列哪个陈述是不正确的？\n\n\
    1. `strcmp( )` 区分大小地比较两个字符串。\n2. `strcasecmp( )` 不区分大小地比较两个字符串。\n3. `str_compare\
    \ ( )` 从指定的起始位置比较两个字符串。\n4. `substr_compare ( )` 从指定的起始位置比较两个字符串。\n\n### 1. 答案：C\n\
    \n解释：\n\nPHP 没有 `str_compare( )` 函数。\n注意 `substr_compare( )` 是二进制安全的，并且可选区分大小写。\n\
    \n### 2. 下列代码的输出是什么？\n\n```php\n<?php\necho str_replace (\"morning\", \"evening\"\
    , \"Good morning!\");\n?>\n```\n\n1. morning\n2. evening\n3. Good morning!\n4.\
    \ Good evening!\n\n### 2. 答案：D\n\n解释：\n\n`str_replace (find, replace, string)`\
    \ 将字符串中的某些字符替换为其他字符。\n`str_replace (\"morning\", \"evening\", \"Good morning!\"\
    )` 将字符串 `\"Good morning!\"` 中的字符 `\"morning\"` 替换为 `\"evening\"`。\n\n### 3. 下列代码的输出是什么？\n\
    \n```php\n<?php\necho substr_replace(\"Good\", \"Morning!\",0);\n?>\n```\n\n1.\
    \ Good\n2. Morning!\n3. 0\n4. 不确定\n\n### 3. 答案：B\n\n解释： \n\n`substr_replace(string,\
    \ replacement, start)` 用另一个字符串替换字符串的一部分。参数 `start` 指定从字符串的何处开始替换。\n`echo substr_replace(\"\
    Good\", \"Morning!\",0)` 将 \"Good\" 替换为 \"Morning!\"。`0` 将从第一个字符开始替换。\n\n### 4.\
