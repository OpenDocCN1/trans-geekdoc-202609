    \ |\n\nAfter using comparison operators, the result will be true or false.\n\n\
    ## Example:\n\n```php\n$a=100; $b=200;\n$result = ($a>$b); echo $result;\n$result\
    \ = ($a==b); echo $result;\n$result = ($a!=$b); echo $result;\n```\n\n## Explanation:\n\
    \n`$result = ($a>$b);` // test `100>200` outputs false\n`$result = ($a==b);` //\
    \ test `100==200` outputs false\n`$result = ($a!=$b);` // test `100!=200` outputs\
    \ true\n\n## Conditional Operator\n\nThe syntax of conditional operator looks\
    \ like this:\n`(test-expression) ? (if-true-do-this) : (if-false-do-this)`\n`test-expression`\
    \ looks like `$a<$b`, `$x=$y`, `$n`, etc.\n\n## Example:\n\n```php\n<?php\n$a=100;\
    \ $b=200;\n$result=($a<$b) ? ”apple” : ”boy”;\necho $result;\n?>\n```\n( Output:\
    \ apple )\n\n## Explanation:\n\nThe output is “apple”. The conditional operator\
    \ use `($a<$b)` to test `$a` and `$b`, because `$a` is less than `$b`, it is true.\n\
    \n## If Statement\n\n`if ( test-expression ) { // if true do this; }`\n“if statement”\
    \ executes codes inside `{ }` only if specified condition is true, does not execute\
    \ any codes inside `{}` if the condition is false.\n\n## Example:\n\n```php\n\
    $a=200; $b=100;\nif (a>b){\necho ”a is greater than b.”\n}\n```\n(Output: a is\
    \ greater than b.)\n\n## Explanation:\n\n`(a>b)` is a test expression, namely\
    \ `(200>100)`, if returns true, it will execute the codes inside the `{ }`.\n\n\
    ## If-else Statement\n\n`if ( test-expression) { // if true do this; } else {\
    \ // if false do this; }`\n“if...else statement” runs some code if a condition\
    \ is true and another code if the condition is false.\n\n## Example:\n\n```php\n\
    $a=100; $b=200;\nif (a>b){\necho ”a is greater than b.”\n}\nelse {\necho “a is\
    \ less than b”;\n}\n```\n(Output: a is less than b.)\n\n## Explanation:\n\n`(a>b)`\
    \ is a test expression, namely `(100>200)`, if returns false, it will output “a\
    \ is less than b”.\n\n## Switch Statement\n\n`switch ( $variable ) { case 1: equals\
    \ this case, do this; break; case 2: equals this case, do this; break; case 3:\
    \ equals this case, do this; break; default : not equals any case, run default\
    \ code; break; }`\nThe value of `$variable` will compare each case first, if equals\
    \ one of the “case” value; it will execute that “case” code. `break;` terminates\
    \ the code running.\n\n## Example:\n\n```php\n$number=20;\nswitch ( $number )\
    \ {\ncase 10 : echo “Running case 10”; break;\ncase 20 : echo “Running case 20”;\
    \ break;\ncase 30 : echo “Running case 30”; break;\ndefault : echo “Running default\
    \ code”; break;\n}\n```\n(Output: Running case 20)\n\n## Explanation:\n\nThe `$number`\
    \ value is 20, it will match `case 20`, so it will run the code in `case 20`.\n\
    \n## For Loop\n\n`for( init, test-expression, increment) { // some code; }`\n\
    “for loop” runs a block of code by specified number of times.\n\n## Example:\n\
    \n```php\n<?php\nfor ($x = 0; $x <= 5; $x++) {\n    echo \"$x \";\n}\n?>\n```\n\
    (Output: 012345 )\n\n## Explanation:\n\n`$x = 0` is initializer, `$x <= 5` is\
    \ test-expression, `$x++` is increment.\n\n## While Loop\n\n`while ( test-expression\
    \ ) { // some code; }`\n“while loop” runs a block of code while specified condition\
    \ is true.\n\n## Example:\n\n```php\n$counter=0;\nwhile(counter<5){\n    echo\
    \ \"a\";\n    $counter++;\n}\n```\n(Output: abcde)\n\n## Explanation:\n\n`counter<5`\
    \ is test expression, if true it will execute the code inside the `{ }`. If false,\
    \ it stops.\n\n## Do-While Loop\n\n`do { some code; } while (test-expression);`\n\
    “do...while” runs code once and then repeats the loop while condition is true.\n\
    \n## Example:\n\n```php\n$counter=0;\ndo {\n    echo ”@”;\n    $counter++;\n}\
    \ while ($counter<8);\n```\n( Output: @@@@@@@@ )\n\n## Explanation:\n\n`counter<8`\
    \ is condition, if true, it repeats the loop. If false, it stops.\n\n## Array\n\
    \nCreate an Array\n\nAn array is a particular variable, which can contain one\
