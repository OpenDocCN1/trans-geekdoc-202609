  trans: "\n\n## 解析\n\n`name=\"knowledge\"` 指定了将传递到 `php` 文件进行处理的输入内容。\n\n`rows` 指定行数为\
    \ `5`。\n\n`cols` 指定了列数为 `10`。\n\n#### 单选框 (Radio Inputs)\n\n| `<input type=\"\
    radio\" name=\"data\" value=\"myvalue\">` |\n| --- |\n\n`type=\"radio\"` 用于通过单选输入数据。\n\
    \n`name=\"data\"` 指定了将传递到 `php` 文件进行处理的输入内容。\n\n`value=\"myvalue\"` 指定了可选内容之一。\n\
    \n### 示例\n\n```html\n<input type=\"radio\" name=\"color\" value=\"red\">\n<input\
    \ type=\"radio\" name=\"color\" value=\"blue\">\n<input type=\"radio\" name=\"\
    color\" value=\"pink\">\n```\n\n( 显示:\n○　red\x80○　blue　　　　　　　○　pink\n )\n\n###\
    \ 解析\n\n`type=\"radio\"` 允许你选择你喜欢的圆圈中的一个。\n\n`name=\"color\"` 指定了将传递到 `php` 文件进行处理的选中内容。\n\
    \n`value=\"red\"` 指定了红色的内容之一。\n\n#### 复选框 (Checkbox Inputs)\n\n| `<input type=\"\
    checkbox\" name=\"data\" value=\"myvalue\">` |\n| --- |\n\n`type=\"checkbox\"\
    ` 用于通过多选输入数据。\n\n`name=\"data\"` 指定了将传递到 `php` 文件进行处理的输入内容。\n\n`value=\"myvalue\"\
    ` 指定了可选内容之一。\n\n### 示例\n\n```html\n<input type=\"checkbox\" name=\"color\" value=\"\
    red\">\n<input type=\"checkbox\" name=\"color\" value=\"blue\">\n<input type=\"\
    checkbox\" name=\"color\" value=\"pink\">\n```\n\n( 显示:\n□　red　　　　　　　〠〠〠□　blue　　　　　　　　　□　pink\n\
    \ )\n\n### 解析\n\n`type=\"checkbox\"` 允许你勾选你喜欢的框。\n\n`name=\"color\"` 指定了将传递到 `php`\
    \ 文件进行处理的选中内容。\n\n`value=\"red\"` 指定了红色的内容之一。\n\n#### 表单与 PHP 协作\n\n| `$data=$_GET[data];`\
    \ |\n| --- |\n\n在 `php` 文件中，`$data=$_GET[data]`：从 HTML 表单获取数据并赋值给 `$data`。（注意表单的\
    \ `method=\"get\"`）。\n\n#### 示例\n\n```html\n<form action=\"myfile.php\" method=\"\
    get\">\n<input type=\"text\" name=\"information\">\n</form>\n```\n\n( 在表单中输入 “Hello”。\
    \ )\n\n```php\n<?php // 这是 myfile.php\n$information = $_GET[information];\necho\
    \ $information;\n?>\n```\n\n( 输出: Hello! )\n\n#### 解析\n\n在 `myfile.php` 中，`$_GET[information]`\
    \ 从 html 表单获取数据 “information”，并赋值给 `$information`。\n\n### 表单与 PHP 协作\n\n| `$data=$_POST[data];`\
    \ |\n| --- |\n\n在 `php` 文件中，`$data=$_POST[data]`：从 HTML 表单获取数据并赋值给 `$data`。（注意表单的\
    \ `method=\"post\"`）。\n\n#### 示例\n\n```html\n<form action=\"myfile.php\" method=\"\
    post\">\n<textarea name=\"knowledge\" rows=\"10\" cols=\"5\">\n</form>\n```\n\n\
    ( 输入 “Hello World! Welcome to PHP!”。 )\n\n```php\n<?php // 这是 myfile.php\n$knowledge\
    \ = $_POST[knowledge];\necho $knowledge;\n?>\n```\n\n( 输出: Hello World! Welcome\
    \ to PHP! )\n\n#### 解析\n\n在 `myfile.php` 中，`$_POST[knowledge]` 从 html 表单获取数据 “Hello\
    \ World! Welcome to PHP! ”，并赋值给 `$knowledge`。\n\n# 第 5 小时\n# 动态数据\n\n### 日期与时间\n\
    \n| `date(\"M d Y\"); date(\"h : i : s\"); date(\"D H A\");` |\n| --- |\n\n`date(\"\
    M d Y\")` 显示月份、日期、年份。\n\n`date(\"h : i : s\")` 显示小时、分钟、秒。\n\n`date(\"D H A\")`\
    \ 显示星期几、小时、上午/下午。\n\n### 示例\n\n```php\n$date = date(\"M d Y\");\n$hour = date(\"\
    h : i : s\");\n$week = date(\"D H A\");\necho $date;\necho $hour;\necho $week;\n\
    ```\n\n( 输出: Feb 10 2015 11:20:30 Mon 11 AM )\n\n#### 解析\n\n| M: Jan-Dec || d:\
    \ 01-31 || Y: YYYY |\n| --- | --- | --- |\n| h: 01-12 || i: 00-59 || s: 00-59\
    \ |\n| D: Sun-Sat || H: 00-23 || A: AM/PM |\n\n### 字符串处理\n\n| `strlen()` | `strtoupper()`\
    \ | `strtolower()` |\n| --- | --- | --- |\n\n`strlen()` 返回字符串的长度。\n\n`strtoupper()`\
    \ 返回大写。\n\n`strtolower()` 返回小写。\n\n#### 示例\n\n```php\n$string=\"Hello World!\"\
    ;\necho strlen($string);\necho strtoupper($string);\necho strtolower($string);\n\
    ```\n\n### 重定向\n\n| `header(\"Location=$url\")` |\n| --- |\n\n`header(\"Location=$url\"\
    )` 可以将浏览器重定向到 `$url`。\n\n#### 示例\n\n```php\n$url=\"http://example.com\";\nheader(\"\
    Location=$url\");\n```\n\n#### 解析\n\n`header(\"Location=$url\")` 将浏览器重定向到指定的 URL。\n\
    \n"
- fmt: "\n```\nfclose($openfile);\n```\n\n`$openfile` specifies the file that has\
    \ been opened.\n\nIt is good practice to close the opened file after using that.\
    \ You can release the memory, other processes may be able to use that file.\n\n\
    ## Example:\n\n```php\n$filename = “myfile.txt”;\n$openfile = fopen( $filename,\
    \ r );\n……\nfclose( $openfile) ;\n```\n\n## Explanation:\n\nAfter using the file\
    \ `myfile.txt`, `fclose($openfile)` closes the opened file.\n\n# Hour 6: MySql\
    \ Basic\n\n## Select a Database\n\n```sql\nuse database-name;\n```\n\nOnce you\
    \ get connection with `MySQL` server, it is required to select a particular database\
    \ to work with.\n\n`use database-name` can select a database.\n\n## Example:\n\
    \n```mysql\nmysql>use mydatabase;\nDatabase changed\n```\n\n## Explanation:\n\n\
    `mysql>` is a prompt of `MySQL`.\n\n`use mydatabase` selects a database named\
    \ `mydatabase`.\n\n`Database changed` is a responded text from `MySQL`.\n\n##\
    \ Create a Database\n\n```sql\ncreate database database-name;\n```\n\n`create\
    \ database database-name` can create a database.\n\n`database-name` specifies\
    \ a database name.\n\n## Example:\n\n```mysql\nmysql> create database newdatabase;\n\
    Query OK,……\n```\n\n## Explanation:\n\n`create database newdatabase` creates a\
    \ database named `newdatabase`.\n\n`Query OK,……” is a responded text from `MySQL`.\n\
    \n## Create & show a table\n\n```sql\ncreate table table-name(column type, column\
    \ type,…); show tables;\n```\n\n`create table table-name` can create a table.\n\
    \n`column type, column type,…` specifies the column name and its data type.\n\n\
    `show tables` can show all tables.\n\n## Example:\n\n```mysql\nmysql> create table\
    \ colortable(id int, color varchar(20));\nmysql> show tables;\n```\n\n## Explanation:\n\
    \n`create table colortable` creates a table named `colortable`.\n\n`id int` specifies\
    \ a column named `id`, data type as `int`.\n\n`color varchar(20)` specifies a\
    \ column named `color`, data type as `varchar(20)`.\n\n`show tables` can display\
    \ all tables in database.\n\n## MySQL Data Type\n\n| Type | Explanation |\n| :---\
    \ | --- |\n| int | An integer |\n| decimal | A floating point number |\n| date\
    \ | A date in YYYY-MM-DD format |\n| time | A time in HH:MM:SS format |\n| year\
    \ | A year in YYYY format |\n| char( ) | A string of defined fixed length |\n\
    | varchar( ) | A string of defined changeable length |\n| text | A string from\
    \ 0 to 65535 characters |\n\n## Example:\n\n```mysql\nmysql> create table colortable(\
    \ id int, color varchar(20) );\n```\n\n## Explanation:\n\n`id int`: the data type\
    \ of `id` is `int`, which is an integer.\n\n`color varchar(20)`: the data type\
    \ of `color` is `varchar(20)`, which is a string of defined changeable length.\n\
    \n## Column Name Modifiers\n\n| Modifiers | Explanation |\n| \\--- | --- |\n|\
    \ auto\\_increment | automatically increase a value |\n| not null | must contain\
    \ data |\n| unique | must be only one of its kind |\n| primary key(arg) | specifies\
    \ its argument as primary key |\n\n## Example:\n\n```mysql\nmysql> create table\
    \ colortable( id int auto\\_increment, \ncolor varchar(20) not null );\n```\n\n\
    ## Explanation:\n\n`id int auto\\_increment`: the value `id` can automatically\
    \ increase than previous value.\n\n`color varchar(20) not null`: the data in `color`\
    \ column must be included.\n\n## Insert Data to Table\n\n```sql\ninsert into table-name\
    \ ( column1, column2, column3 ) values (value1, value2, value3);\n```\n\n`column1,\
    \ column2, column3` will be respectively inserted data by `value1, value2, value3`\n\
    \n## Example:\n\n```mysql\nmysql>insert into colortable(color1, color2, color3)\
    \ values(“red”, “blue”, “green”);\n( Output: colortable )\n```\n\n| id | color1\
    \ | color2 | color3 |\n| --- | --- | --- | --- |\n| 1 | red | blue | green |\n\
    \n## Explanation:\n\nThe specified columns `color1, color2, color3` will be respectively\
    \ inserted data by `red, blue, green`.\n\n## Alter a table\n\n```sql\nalter table\
    \ table-name add column-name type;\n```\n\nNew column can be added to a table\
    \ by using the `alter` command.\n\n## Example:\n\n```mysql\nmysql>alter table\
    \ colortable add color4 varchar(20);\n( Output: colortable)\n```\n\n| id | color1\
    \ | color2 | color3 | color4 |\n| --- | --- | --- | --- | --- |\n| 1 | red | blue\
    \ | green | null |\n\n## Explanation:\n\n`add color4 varchar(20)` adds a new column\
    \ named `color4`.\n\nFrom above table, you can see the new column name is `color4`.\n\
    \n## Update Specific Data\n\n```sql\nupdate table-name set column-name=value where\
    \ id=int;\n```\n\nA value can be changed in a column by its `id`.\n\n## Example:\n\
    \n```mysql\nmysql> update table-name set column-name=value where id=int;\n```\n\
    \n## Explanation:\n\nA value can be changed in a column by its `id`.\n\n## Delete\
    \ Data\n\n```sql\ndelete from table-name where id=int;\n```\n\nSome row can be\
    \ deleted using the `delete` command.\n\n## Example:\n\n```mysql\nmysql> delete\
    \ from colortable where id=1;\n```\n\n## Explanation:\n\n`delete from table-name\
    \ where id=int` deletes the row where `id` is equal to the `int` value.\n\n##\
    \ Select Queries\n\n```sql\nselect * from table-name;\n```\n\n`select * from table-name`\
    \ selects all columns.\n\n## Example:\n\n```mysql\nmysql> select * from colortable;\n\
    ```\n\n## Explanation:\n\n`select * from colortable` shows all columns.\n"
