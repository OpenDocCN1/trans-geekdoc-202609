    \ \n\n“function” defines a function in class. Function is also known as “method”.\n\
    \n## Example:\n\nclass color {\n\nvar c1; var c2;\n\nfunction brightness ( ) {…}\n\
    \n}\n\n## Explanation:\n\n“class color” defines a class named “color”. “var” defines\
    \ two variables named “c1” and “c2”. “function” defines a function named “brightness”.\n\
    \n$this-> variable\n\n| $this-> variable; |\n\n| --- |\n\n“$this-> variable;”\
    \ is used to access the variable in current class.\n\n## Example:\n\nclass color\
    \ {\n\nvar c1;\n\nfunction brightness ( ) {  \n\n$this->c1\\=”red”; \n\necho $this->c1;\n\
    \n}\n\n}\n\n( Output:  red )\n\n##  \n\n## Explanation:\n\n“$this->c1” access\
    \ the variable “c1” in current class.\n\n“$this->c1=’red’;” assigns the value\
    \ “red” to “c1”. \n\nObject Declaration\n\nObject is an instance of a class.\n\
    \n| $object = new class-name;$object->variable;$object->function-name( ); |\n\n\
    | --- |\n\n“$object = new class-name;” creates a new object named “$object”.\n\
    \n“$object->variable;” means that $object references a variable.\n\n“$object->\
    \ function-name ( );” means that $object calls a function.\n\n## Example:\n\n\
    $obj = new color;\n\n$obj->c2;\n\n$obj->brightness ( );\n\n( Output:  red )\n\n\
    ## Explanation:\n\n“$obj = new color;” creates an object named” $obj”.\n\n“ $obj->c2”\
    \ means $obj references variable “c2”.\n\n “$obj->brightness ( );” means that\
    \ “$obj” calls the function brightness( ){…}, outputs the result “red”.\n\nConstructor\
    \ (1)\n\nWhen a function name is the same as a class name, the function is known\
    \ as constructor.\n\nConstructor is used to initialize class’s variable when create\
    \ a new object.\n\n## Example:\n\nclass color{\n\nvar c1;\n\nvar c2;\n\nfunction\
    \ color( $arg ) {  // This is a constructor\n\n$this->c1= $arg;  \n\n}  \n\n}\n\
    \n$obj= new color( yellow );\n\n## Explanation:\n\n“function color( $arg ) { \
    \ $this-c1= $arg;  }” is a constructor.\n\nWhen create an object $obj, color(yellow)\
    \ calls the constructor, and passes the argument “yellow” to constructor by $arg,\
    \ than $arg assigns the value to “c1”.\n\nConstructor (2)\n\nYou can use \\_construct(\
    \ ) to work as constructor.\n\n| \\_construct( ); |\n\n| --- |\n\nConstructor\
    \ is used to initialize class’s variable when create a new object.\n\n## Example:\n\
    \nclass color{\n\nvar c1;\n\nfunction \\_construct ( $arg ) {  // This is a constructor\n\
    \n$this-c1= $arg;  \n\n}  \n\n}\n\n$obj= new color( yellow );\n\n## Explanation:\n\
    \n“function \\_construct ( $arg ) {  $this-c1= $arg;  }” is a constructor.\n\n\
    When creating an object $obj, color(yellow) calls the constructor, and passes\
    \ the argument “yellow” to constructor by $arg, than $arg assigns the value to\
    \ “c1”.\n\nDestructor\n\n\\_destruct( ) can work as destructor to destroy an object.\n\
    \n| \\_destructor( ); |\n\n| --- |\n\nWhen ending a class instance, \\_destructor\
    \ can be used.\n\n## Example:\n\nclass color{\n\nvar c1;\n\n……\n\nfunction \\\
    _destructor {  // This is a destructor\n\necho “Using destructor…”;\n\n}  \n\n\
    }\n\n(  Output:  Using destructor…)\n\n## Explanation:\n\n“function \\_destructor”\
    \ is a destructor, which ends a class instance.\n\nExtend Class\n\nWhen a sub\
    \ class extends a parent class, sub class obtains the variable and function from\
    \ parent class.\n\n| class sub-class extends parent-class {……} |\n\n| --- |\n\n\
    ##  \n\n## Example:\n\nclass animal{\n\n// parent class definition\n\n}\n\nclass\
    \ dog extends animal{\n\n// sub class definition\n\n}\n\nclass monkey extends\
    \ animal{\n\n// sub class definition.\n\n}\n\n## Explanation:\n\nclass dog and\
    \ class monkey are two sub class, they extend their parent class “animal”, including\
    \ its variable and function. \n\nThe Use of Inheritance"
