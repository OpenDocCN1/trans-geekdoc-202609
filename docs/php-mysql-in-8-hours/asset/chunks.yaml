    \ line 2\n\n3.                                                                                          \
    \ line 3\n\n4.                                                                                          \
    \ line 4\n\n6.  Answer:  B\n\nExplanation:\n\nThe argument should be “size” instead\
    \ of “length”.\n\n<?php echo $\\_FILES\\[‘FileUpLoad’\\]\\[‘size’\\];?> is correct.\
