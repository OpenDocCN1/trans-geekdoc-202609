  trans: "\n\n| `mysql_close()` | 关闭与 MySQL 服务器的连接 |\n| `mysql_connect()` | 与 MySQL\
    \ 服务器建立初始连接 |\n| `mysql_create_db()` | 在 MySQL 服务器上创建数据库 |\n| `mysql_data_seek()`\
    \ | 将结果指针调整到结果中的随机行 |\n| `mysql_db_query()` | 此函数在 PHP 5.3.0 中已被弃用 |\n| `mysql_error()`\
    \ | 返回一个包含错误描述的字符串 |\n| `mysql_fetch_array()` | 返回与获取的行相关的字符串数组 |\n| `mysql_fetch_assoc()`\
    \ | 返回与获取的行相关的字符串关联数组 |\n| `mysql_fetch_row()` | 返回与获取的行相关的索引数组 |\n| `mysql_free_result()`\
    \ | 清除与结果相关的系统内存 |\n| `mysql_get_server_info()` | 返回包含 MySQL 服务器版本的字符串 |\n| `mysql_num_rows()`\
    \ | 返回结果集中的行数 |\n| `mysql_query()` | 向服务器上的数据库提交查询 |\n| `mysql_real_escape_string()`\
    \ | 为 MySQL 转义字符串中的特殊字符 |\n| `mysql_result()` | 返回 MySQL 结果集中一个单元的字符串 |\n| `mysql_select_db()`\
    \ | 通过数据库名称选择要使用的数据库 |\n\n# 附录 3\n# 100 道面试题、答案与解析\n\n## 第 1 章 PHP 基础\n\n### 1.\
    \ 下列标签不是 PHP？\n1. `<?php……?>`\n2. `<?......?>`\n3. `<script Language=”php”……</script>`\n\
    4. `<php…...>`\n\n（答案与解析在下一页。）\n\n**1. 答案：D**\n\n解析：\nA 是 PHP 标准标签。\nB 是 PHP 短标签。\n\
    C 是 PHP 脚本标签。\nD 不是 PHP 标签。\n注意：短标签和脚本标签被认为已弃用，且强烈不建议使用。\n\n### 2. 下列哪种类型不是用于\
    \ PHP 注释？\n1. `//` 用于 PHP 单行注释\n2. `#` 用于 PHP 单行注释\n3. `( )` 用于 PHP 多行注释\n4. `/*\
    \ */` 用于 PHP 多行注释\n\n**2. 答案：C**\n\n解析：\n`( )` 不用于 PHP 注释。\n\n### 3. 下列哪个表达式不正确？\n\
    1. `a += b` 意味着 `a = (a + b)`\n2. `a *= b` 意味着 `a = (a * b)`\n3. `a != b` 意味着\
    \ `a = (a ! b)`\n4. `a %= b` 意味着 `a = (a % b)`\n\n**3. 答案：C**\n\n解析：\n`!=` 意味着“不等于”。\n\
    关于 `!b`，如果变量 `b` 的值为 true，那么 `!b` 的值为 false。\n\n### 4. 下列哪个变量名无效？\n1. `$var`\n\
    2. `$_var`\n3. `$10var`\n4. `&$var`\n\n**4. 答案：C**\n\n解析：\nPHP 变量不能与数字开头。\nPHP\
    \ 变量始终以美元符号、字符或下划线开头。\n`&$var` 是变量 `$var` 的引用。\n变量命名规则：\n- 它可以以美元符号 `$` 开头。\n\
    - 它可以以字符或下划线开头。\n- 它不能以数字开头。\n\n### 5. 下列哪个操作符的描述不正确？\n1. `+` 用于加法\n2. `–` 用于减法\n\
    3. `*` 用于乘法\n4. `%` 用于除法\n\n**5. 答案：D**\n\n解析：\n`%` 用于取模。`/` 用于除法。\n\n### 6. 下列哪个语句不正确？\n\
    ```php\n$num=1;\necho $num++; // line 1，输出 1，$num 现在等于 2。\necho ++$num; // line\
    \ 2，输出 3，$num 现在等于 3。\necho $num- -; // line 3，输出 3，$num 现在等于 2。\necho - -$num;\
    \ // line 4，输出 2，$num 现在等于 1。\n```\n1. 第 1 行\n2. 第 2 行\n3. 第 3 行\n4. 第 4 行\n\n\
    **6. 答案：D**\n\n解析：\n应该是：`echo - -$num; // line 4，输出 1，$num 现在等于 1。`\n`$num++`\
    \ 返回当前值，然后加 1。\n`++$num` 当前值加 1，然后返回新值。\n`$num- -` 返回当前值，然后减 1。\n`- -$num` 当前值减\
    \ 1，然后返回新值。\n\n### 7. 下列哪个语句不正确？\n```php\n$x=0; echo ~$x;      // line 1 输出 -1。\n\
    $x=0; echo ~$x;      // line 2 输出 1。\n$x=1; echo $x<<1;     // line 3 输出 2。\n\
    $x=8; echo $x>>1;     // line 4 输出 4。\n```\n1. 第 1 行\n2. 第 2 行\n3. 第 3 行\n4. 第\
    \ 4 行\n\n**7. 答案：B**\n\n解析：\n`~` 是位运算符“二进制按位取反”，它会反转整数的所有位。\n`<<` 位左移。`$x<<n`\
    \ 乘以 2 的 n。\n`>>` 位右移。`$x>>n` 除以 2 的 n。\n\n### 8. 下列哪个变量声明是正确的？\n1. `string $str=”PHP”;`\n\
    2. `int $num=100;`\n3. `boolean $boo=true;`\n4. `$var=30;`\n\n**8. 答案：D**\n\n\
    解析：\n声明变量时不使用数据类型。\n\n### 9. 当布尔值为值为 False 时，可以用哪个数字代替？\n1. -1\n2. 0\n3. 1\n4.\
    \ 以上均不是。\n\n**9. 答案：B**\n\n解析：\n布尔值 1 意味着 true。\n布尔值 0 意味着 false。\n\n### 10. 如果你不希望客户端显示\
    \ PHP 运行时的错误，应该在 php.ini 中将哪个配置设为“off”？\n1. `show_errors`\n2. `log_errors`\n3.\
    \ `display_errors`\n\n**10. 答案：C**\n\n解析：\n`show_errors` 用于显示错误。\n`log_errors`\
    \ 用于记录错误。\n`display_errors` 用于显示错误。\n\n### 10. 如果你不希望客户端显示 PHP 运行时的错误，应该在 php.ini\
    \ 中将哪个配置设为“off”？\n1. `show_errors`\n2. `log_errors`\n3. `display_errors`\n\n**10.\
    \ 答案：C**\n\n解析：\n`show_errors` 用于显示错误。\n`log_errors` 用于记录错误。\n`display_errors`\
    \ 用于显示错误。\n\n### 10. 如果你不希望客户端显示 PHP 运行时的错误，应该在 php.ini 中将哪个配置设为“off”？\n1. `show_errors`\n\
    2. `log_errors`\n3. `display_errors`\n\n**10. 答案：C**\n\n解析：\n`show_errors` 用于显示错误。\n\
    `log_errors` 用于记录错误。\n`display_errors` 用于显示错误。\n\n### 10. 如果你不希望客户端显示 PHP 运行时的错误，应该在\
    \ php.ini 中将哪个配置设为“off”？\n1. `show_errors`\n2. `log_errors`\n3. `display_errors`\n\
    \n**10. 答案：C**\n\n解析：\n`show_errors` 用于显示错误。\n`log_errors` 用于记录错误。\n`display_errors`\
    \ 用于显示错误。\n\n### 10. 如果你不希望客户端显示 PHP 运行时的错误，应该在 php.ini 中将哪个配置设为“off”？\n1. `show_errors`\n\
    2. `log_errors`\n3. `display_errors`\n\n**10. 答案：C**\n\n解析：\n`show_errors` 用于显示错误。\n\
    `log_errors` 用于记录错误。\n`display_errors` 用于显示错误。\n\n### 10. 如果你不希望客户端显示 PHP 运行时的错误，应该在\
    \ php.ini 中将哪个配置设为“off”？\n1. `show_errors`\n2. `log_errors`\n3. `display_errors`\n\
    \n**10. 答案：C**\n\n解析：\n`show_errors` 用于显示错误。\n`log_errors` 用于记录错误。\n`display_errors`\
    \ 用于显示错误。\n\n### 10. 如果你不希望客户端显示 PHP 运行时的错误，应该在 php.ini 中将哪个配置设为“off”？\n1. `show_errors`\n\
    2. `log_errors`\n3. `display_errors`\n\n**10. 答案：C**\n\n解析：\n`show_errors` 用于显示错误。\n\
    `log_errors` 用于记录错误。\n`display_errors` 用于显示错误。\n\n### 10. 如果你不希望客户端显示 PHP 运行时的错误，应该在\
