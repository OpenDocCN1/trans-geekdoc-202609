  trans: "\n\n```\nfclose($openfile);\n```\n\n`$openfile` 指定了已打开的文件。\n\n在使用该文件后将其关闭是一个良好的习惯。你可以释放内存，其他进程可能可以使用该文件。\n\
    \n## 示例：\n\n```php\n$filename = “myfile.txt”;\n$openfile = fopen( $filename, r\
    \ );\n……\nfclose( $openfile) ;\n```\n\n## 解释：\n\n在使用文件 `myfile.txt` 后，`fclose($openfile)`\
    \ 关闭了打开的文件。\n\n# 第 6 小时：MySQL 基础\n\n## 选择数据库\n\n```sql\nuse database-name;\n```\n\
    \n一旦你与 `MySQL` 服务器建立连接，就需要选择一个特定的数据库进行工作。\n\n`use database-name` 可以选择一个数据库。\n\n\
    ## 示例：\n\n```mysql\nmysql>use mydatabase;\nDatabase changed\n```\n\n## 解释：\n\n\
    `mysql>` 是 `MySQL` 的提示符。\n\n`use mydatabase` 选择名为 `mydatabase` 的数据库。\n\n`Database\
    \ changed` 是 `MySQL` 的响应文本。\n\n## 创建数据库\n\n```sql\ncreate database database-name;\n\
    ```\n\n`create database database-name` 可以创建一个数据库。\n\n`database-name` 指定了数据库名称。\n\
    \n## 示例：\n\n```mysql\nmysql> create database newdatabase;\nQuery OK,……\n```\n\n\
    ## 解释：\n\n`create database newdatabase` 创建了一个名为 `newdatabase` 的数据库。\n\n`Query\
    \ OK,……” 是 `MySQL` 的响应文本。\n\n## 创建并显示表\n\n```sql\ncreate table table-name(column\
    \ type, column type,…); show tables;\n```\n\n`create table table-name` 可以创建一个表。\n\
    \n`column type, column type,…` 指定了列名及其数据类型。\n\n`show tables` 可以显示所有表。\n\n## 示例：\n\
    \n```mysql\nmysql> create table colortable(id int, color varchar(20));\nmysql>\
    \ show tables;\n```\n\n## 解释：\n\n`create table colortable` 创建了一个名为 `colortable`\
    \ 的表。\n\n`id int` 指定了一个名为 `id` 的列，数据类型为 `int`。\n\n`color varchar(20)` 指定了一个名为\
    \ `color` 的列，数据类型为 `varchar(20)`。\n\n`show tables` 可以显示数据库中的所有表。\n\n## MySQL 数据类型\n\
    \n| 类型 | 解释 |\n| :--- | --- |\n| int | 整数 |\n| decimal | 浮点数 |\n| date | YYYY-MM-DD\
    \ 格式的日期 |\n| time | HH:MM:SS 格式的时间 |\n| year | YYYY 格式的年份 |\n| char( ) | 固定长度字符串\
    \ |\n| varchar( ) | 可变长度的字符串 |\n| text | 0 到 65535 个字符的字符串 |\n\n## 示例：\n\n```mysql\n\
    mysql> create table colortable( id int, color varchar(20) );\n```\n\n## 解释：\n\n\
    `id int`: `id` 的数据类型是 `int`，一个整数。\n\n`color varchar(20)`: `color` 的数据类型是 `varchar(20)`，一个可变长度字符串。\n\
    \n## 列修饰符\n\n| 修饰符 | 解释 |\n| \\--- | --- |\n| auto\\_increment | 自动增加值 |\n| not\
    \ null | 必须包含数据 |\n| unique | 必须是唯一的 |\n| primary key(arg) | 指定其参数为主键 |\n\n##\
    \ 示例：\n\n```mysql\nmysql> create table colortable( id int auto\\_increment, \n\
    color varchar(20) not null );\n```\n\n## 解释：\n\n`id int auto\\_increment`: `id`\
    \ 的值可以比之前的值自动增加。\n\n`color varchar(20) not null`: `color` 列必须包含数据。\n\n## 向表插入数据\n\
    \n```sql\ninsert into table-name ( column1, column2, column3 ) values (value1,\
    \ value2, value3);\n```\n\n`column1, column2, column3` 将被分别通过 `value1, value2,\
    \ value3` 插入数据。\n\n## 示例：\n\n```mysql\nmysql>insert into colortable(color1, color2,\
    \ color3) values(“red”, “blue”, “green”);\n( Output: colortable )\n```\n\n| id\
    \ | color1 | color2 | color3 |\n| --- | --- | --- | --- |\n| 1 | red | blue |\
    \ green |\n\n## 解释：\n\n指定的列 `color1, color2, color3` 将分别通过 `red, blue, green`\
    \ 插入数据。\n\n## 修改表\n\n```sql\nalter table table-name add column-name type;\n```\n\
    \n可以使用 `alter` 命令向表中添加新列。\n\n## 示例：\n\n```mysql\nmysql>alter table colortable\
    \ add color4 varchar(20);\n( Output: colortable)\n```\n\n| id | color1 | color2\
    \ | color3 | color4 |\n| --- | --- | --- | --- | --- |\n| 1 | red | blue | green\
    \ | null |\n\n## 解释：\n\n`add color4 varchar(20)` 增加了一个名为 `color4` 的新列。\n\n从上面的表中，你可以看到新列名是\
    \ `color4`。\n\n## 更新特定数据\n\n```sql\nupdate table-name set column-name=value where\
    \ id=int;\n```\n\n可以通过 `id` 修改列中的值。\n\n## 示例：\n\n```mysql\nmysql> update table-name\
    \ set column-name=value where id=int;\n```\n\n## 解释：\n\n可以通过 `id` 修改列中的值。\n\n\
    ## 删除数据\n\n```sql\ndelete from table-name where id=int;\n```\n\n可以使用 `delete`\
    \ 命令删除某些行。\n\n## 示例：\n\n```mysql\nmysql> delete from colortable where id=1;\n\
    ```\n\n## 解释：\n\n`delete from table-name where id=int` 删除 `id` 等于 `int` 值的行。\n\
    \n## 查询语句\n\n```sql\nselect * from table-name;\n```\n\n`select * from table-name`\
    \ 选择所有列。\n\n## 示例：\n\n```mysql\nmysql> select * from colortable;\n```\n\n## 解释：\n\
    \n`select * from colortable` 显示所有列。\n\n"
- fmt: "\n```php\n$sql=”alter table colortable modify color4 char(30)\";\n\n$query=mysqli_query(\
    \ $sql, $con);\n\nif( $query ) {\necho  “ Alter data type successfully! ”;\n}\n\
    ```\n( Output: Alter data type successfully! )\n\n## Explanation\n\n`alter table\
    \ colortable modify color4 char(30)` alters `color4` data type to `char(30)`,\
    \ `mysqli_query($sql, $con)` performs the query.\n\n## Retrieve Table Data\n\n\
    | $sql=”select column from table-name\";$query=mysqli_query( $sql, $con); |\n\
    | --- |\n\n`$sql=\"select column from table-name\"` is used to retrieve table\
    \ data by the column name from a table.\n`$query=mysqli_query($sql, $con)` executes\
    \ the query.\n`$con` is the connection of MySql server. (See previous page).\n\
    \n## Example\n\n```php\n$sql=”select color1 from colortable\";\n\n$query=mysqli_query(\
    \ $sql, $con);\n\nif( $query ) {\necho  “ Retrieve data successfully! ”;\n}\n\
    ```\n( Output: Retrieve data successfully! )\n\n## Explanation\n\n`select color1\
    \ from colortable` retrieves table data by the `color1` from `colortable`. `mysqli_query($sql,\
    \ $con)` performs the query.\n\n## mysqli_fetch_row()\n\n| mysqli_fetch_row( );\
    \ |\n| --- |\n\n`mysqli_fetch_row()` returns an indexed array of the row. Its\
    \ key is always a number type. e.g. `[ number ] => value`.\n\n## Example \n\n\
    test_table\n\n| Name || State || City |\n| --- | --- | --- |\n| Don || Ma || Stone\
    \ |\n| Kan || Nh || Water |\n\n```php\n$sql=select \\* from test_table;  // \\\
    * represents all columns\n\n$query=myslqi_query( $sql);\n\n$array=mysqli_fetch_row\
    \ ($query);\n\nprint_r($array);  // print_r( ) is used to print array.\n```\n\
    ( Output: [0]=>Don [1]=>Ma [2]=>Stone )\n\n## Explanation\n\n`mysqli_fetch_row()`\
    \ returns an array of the row, its key are always number type. `print_r()` is\
    \ used to print array.\n\n## mysqli_fetch_assoc()\n\n| mysqli_fetch_assoc( );\
    \ |\n| --- |\n\n`mysqli_fetch_assoc()` returns an assoc array of the row. Its\
    \ key is always a string type. e.g. `[ string ]=> value`.\n\n## Example\n\ntest_table\n\
    \n| Name || State || City |\n| --- | --- | --- |\n| Don || Ma || Stone |\n| Kan\
    \ || Nh || Water |\n\n```php\n$sql=select \\* from test_table;  // \\* represents\
    \ all columns\n\n$query=myslqi_query( $sql);\n\n$array=mysqli_fetch_assoc ($query);\n\
    \nprint_r($array);  // print_r( ) is used to print array.\n```\n( Output: [Name]=>Don\
    \ [State]=>Ma [City]=>Stone )\n\n## Explanation\n\n`mysqli_fetch_assoc()` returns\
    \ an array of the row, its key are always string type. `print_r()` is used to\
    \ print array.\n\n## mysqli_fetch_array()\n\n| mysqli_fetch_array( ); |\n| ---\
    \ |\n\n`mysqli_fetch_array()` returns both indexed and associative array of the\
    \ row. Their keys are both number type and string type. e.g. `[number]=>value\
    \ [ string ]=>value`.\n\n## Example\n\ntest_table\n\n| Name || State || City |\n\
    | --- | --- | --- |\n| Don || Ma || Stone |\n| Kan || Nh || Water |\n\n```php\n\
    $sql=select \\* from test_table;  // \\* represents all columns\n\n$query=myslqi_query(\
    \ $sql);\n\n$array=mysqli_fetch_array($query);\n\nprint_r($array);  // print_r(\
    \ ) is used to print array.\n```\n( Output: [0] => Don [1] => State [2] => City\
    \ [Name] => Don [State] => Ma [City] => Stone )\n\n## Explanation\n\n`mysqli_fetch_array()`\
    \ returns an array of the row, their key are always both number type and string\
    \ type.\n\n## mysqli_num_rows()\n\n| mysqli_num_rows( $query ); |\n| --- |\n\n\
    `mysqli_num_rows($query)` returns the total number of rows from `$query`, which\
    \ is generated by `mysqli_query()`.\n\n## Example\n\ntest_table\n\n| Name || State\
    \ || City |\n| --- | --- | --- |\n| Don || Ma || Stone |\n| Kan || Nh || Water\
    \ |\n\n```php\n$sql=select \\* from test_table;  // \\* represents all columns\n\
    \n$query=myslqi_query( $sql);\n\n$row_number=mysqli_num_rows( $query );\n\necho\
    \ $row_number;\n```\n( Outputs: 2 )\n\n## Explanation\n\n`mysqli_num_rows($query)`\
    \ returns the total number of row from `$query`, which is 2.\n\n## mysqli_close()\n\
    \n| mysqli_close( ); |\n| --- |\n\nClose a previously opened database connection\
    \ to MySql.\n\n## Example\n\n```php\n<?php\n$con= mysqli_connect( “host”, “user”,\
    \ “password” );\n//some code...\nmysqli_close($con);\n?>\n```\n\n Explanation\n\
    \n`mysqli_close($con)` closes `$con` connection to the MySql server.\n\n## Class\
    \ & Object\n\n### Class Definition\nA class is a template for object, and creates\
    \ an object.\n\n```php\nclass class-name{\n  var $variable;\n  function-name(\
    \ ){\n}\n```\nExplanation: `class class-name {...}` is used to define a class.\
    \ `var` defines a variable in class, also known as `property`. `function` defines\
    \ a function in class, also known as `method`.\n\n### Example\n```php\nclass color\
    \ {\nvar c1; var c2;\nfunction brightness ( ) {…}\n}\n```\nExplanation: `class\
    \ color` defines a class named `color`. `var` defines two variables named `c1`\
    \ and `c2`. `function` defines a function named `brightness`.\n\n### Variable\n\
    `$this->variable` is used to access the variable in current class.\n\n### Example\n\
    ```php\nclass color {\nvar c1;\nfunction brightness ( ) { \n$this->c1=”red”; \n\
    echo $this->c1;\n}\n```\n( Output: red )\n\nExplanation: `$this->c1` access the\
    \ variable `c1` in current class. `$this->c1='red'` assigns the value `red` to\
    \ `c1`.\n\n### Object Declaration\nObject is an instance of a class.\n\n```php\n\
    $object = new class-name;\n$object->variable;\n$object->function-name( );\n```\n\
    Explanation: `$object = new class-name` creates a new object named `$object`.\
    \ `$object->variable` means that `$object` references a variable. `$object->function-name()`\
    \ means that `$object` calls a function.\n\n### Example\n```php\n$obj = new color;\n\
    $obj->c2;\n$obj->brightness ( );\n```\n( Output: red )\n\nExplanation: `$obj =\
    \ new color` creates an object named `$obj`. `$obj->c2` means `$obj` references\
    \ variable `c2`. `$obj->brightness()` means that `$obj` calls the function `brightness()`.\n\
    \n## Constructor (1)\n\nWhen a function name is the same as a class name, the\
    \ function is known as constructor. Constructor is used to initialize class’s\
    \ variable when creating a new object.\n\n## Example\n```php\nclass color{\nvar\
    \ c1; var c2;\nfunction color( $arg ) { // This is a constructor\n$this->c1=$arg;\
    \ \n}\n$obj= new color( yellow );\n```\nExplanation: `function color($arg) {$this->c1=$arg;}`\
    \ is a constructor. When creating an object `$obj`, `color(yellow)` calls the\
    \ constructor, and passes the argument `yellow` to constructor by `$arg`, then\
    \ `$arg` assigns the value to `c1`.\n\n## Constructor (2)\n\nYou can use `__construct()`\
    \ to work as constructor. Constructor is used to initialize class’s variable when\
    \ creating a new object.\n\n## Example\n```php\nclass color{\nvar c1;\nfunction\
    \ __construct( $arg ) { // This is a constructor\n$this->c1=$arg; \n}\n$obj= new\
    \ color( yellow );\n```\nExplanation: `function __construct($arg) {$this->c1=$arg;}`\
    \ is a constructor. When creating an object `$obj`, `color(yellow)` calls the\
    \ constructor, and passes the argument `yellow` to constructor by `$arg`, then\
    \ `$arg` assigns the value to `c1`.\n\n## Destructor\n\n`__destruct()` can work\
    \ as destructor to destroy an object. When ending a class instance, `__destruct()`\
    \ can be used.\n\n## Example\n```php\nclass color{\nvar c1;\n……\nfunction __destruct\
    \ { // This is a destructor\necho “Using destructor…”;\n} \n}\n```\n( Output:\
    \ Using destructor…)\n\nExplanation: `function __destruct` is a destructor, which\
    \ ends a class instance.\n\n## Extend Class\n\nWhen a sub class extends a parent\
    \ class, sub class obtains the variable and function from the parent class.\n\n\
    ```php\nclass sub-class extends parent-class {……}\n```\n\n## Example\n```php\n\
    class animal{\n// parent class definition\n}\nclass dog extends animal{\n}\nclass\
    \ monkey extends animal{\n}\n```\nExplanation: `class dog` and `class monkey`\
    \ are two sub class, they extend their parent class `animal`, including its variable\
    \ and function.\n"
