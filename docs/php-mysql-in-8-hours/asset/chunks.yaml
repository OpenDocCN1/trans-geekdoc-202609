    \ {‘a’=>1, ‘b’=>2, ‘c’=>3}` 因为使用了 `{ }` 无法创建数组，你应该使用 `( )` 代替 `{ }`。\n\n### 4.\
    \ 下列哪一行返回 true？\n\n```php\n$arr1=array (10, 20, 30);\n$arr2=array (2=>30, 1=>20,\
