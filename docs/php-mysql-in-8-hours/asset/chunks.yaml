    8. [Ray Yao 的其他书籍](http://www.amazon.com/Ray-Yao/e/B00RG5FG6K/ref=ntt_dp_epwbk_0)


    ## 前言


    “8 小时学会 PHP & MYSQL”是一本适合初学者的书籍。你可以快速轻松地学习 PHP & MYSQL 的完整基础知识。直观的定义、通俗易懂的示例、详尽的解释以及整洁美丽的布局是本非常有帮助且具有教育意义的书的特点。你会被这种独特的写作风格所吸引。阅读这本书是一种享受！你可以在
    8 小时内掌握所有核心 PHP & MySQL 技能。从今天开始编程吧！


    （本书附录包括：

    (1) 6 条安全提示

    (2) MySQL 命令表

    (3) 100 道面试题、答案及解析）


    ## 目录


    - 第 1 小时

