    \ of the file.\n\n2.  Which following line is not correct?\n\n$filename=”myFile.txt”;\n\
    \n$file=fopen($filename, “r”);  // line 1\n\n$filesize=filesize($file);  // line\
    \ 2\n\n$test=fread($file, $filesize);  // line 3\n\nfclose($file);  // line 4\n\
    \n1.                                                                                          \
    \ line 1\n\n2.                                                                                          \
    \ line 2\n\n3.                                                                                          \
    \ line 3\n\n4.                                                                                          \
    \ line 4\n\n2.  Answer:  B\n\nExplanation:\n\nIt should be $filesize=filesize($filename); \
    \ \n\nThe argument of filesize($filename) should use the $filename variable.\n\
    \nfopen( ) opens file. fread( ) reads file. fclose( ) closes file.\n\n3.  To record\
    \ the IP address of visitors to the web page, use\\_\\_\\_\\_\\_\\_.\n\n1.                                                                                          \
    \ $\\_SERVER\\[‘HTTP\\_REFERER’\\]\n\n2.                                                                                          \
    \ $\\_SERVER\\[‘PHP\\_SELF’\\]\n\n3.                                                                                          \
    \ $\\_SERVER\\[‘HTTP\\_USER\\_AGENT’\\]\n\n4.                                                                                          \
    \ $\\_SERVER\\[‘REMOTE\\_ADDR’\\]\n\n3.  Answer:  D\n\nExplanation:\n\n$\\_SERVER\\\
    [‘REMOTE\\_ADDR’\\] can record the visitor’s IP address.\n\n$\\_SERVER\\['HTTP\\\
    _REFERER'\\] returns the complete URL of the current page.\n\n$\\_SERVER\\['PHP\\\
    _SELF'\\] returns the filename of the currently executing script. \n\n$\\_SERVER\\\
    [‘HTTP\\_USER\\_AGENT’\\] can identify the user’s browser.\n\n4\\. Which following\
    \ line is not correct?\n\n<?php\n\necho “Hello World!”; // line 1\n\n$location=”http://www.example.com”;\
    \ // line 2\n\nheader('Location:$location');  // line 3\n\nexit( );  // line 4\n\
    \n?>\n\n1.                                                                                          \
    \ line 1\n\n2.                                                                                          \
    \ line 2\n\n3.                                                                                          \
    \ line 3\n\n4.                                                                                          \
    \ line 4\n\n4.  Answer:  A\n\nExplanation:\n\nImportant notice: The header( )\
    \ function must appear at the very start of the page, before any content is sent\
    \ to the browser. Namely the header() must be called before any actual output\
    \ is sent. Otherwise, it will cause an error.\n\n5.   Which of the following functions\
    \ get the entire contents of a file in such a way that it may be used as part\
