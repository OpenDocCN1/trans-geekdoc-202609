  trans: "\n\n```php\n$num=100;\n\n(boolean) $num;\n\necho $num;\n```\n\n1. 1\n2.\
    \ 0\n3. true\n4. 100\n\n18. **答案: D**\n\n**解释：**\n转换为 `Boolean` 会创建一个转换后的相同值并存储在\
    \ `$num` 中。实际上，它不会改变存储在该处的值。\n\n19. **以下代码的输出是什么？**\n\n```php\n$str1=”apple”;\n\
    $str2=”Apple\";\necho (int)($str1>$str2);\n```\n\n1. true\n2. false\n3. 1\n4.\
    \ 0\n\n19. **答案: C**\n\n**解释：**\n因为字符 “a” (97) 的 ASCII 值高于字符 “A” (65)。因此，“apple”大于“Apple”。`1`\
    \ 代表真（true）。\n\n20. **哪个运算符的优先级更高？**\n\n1. `||`\n2. `&&`\n3. `!`\n4. `++`\n\n\
    20. **答案: D**\n\n**解释：**\n`++` 运算符的优先级高于其他三个运算符。\n运算符的优先级顺序为：`++`>`! `>`&&`>`||`。\n\
    \n21. **以下代码的输出是什么？**\n\n```php\n<?php\n$arr=array(5=>”100”, “101”, “102”, “103”,\
    \ 10>=”105”);\necho $arr[9];\n?>\n```\n\n1. “9”\n2. “104”\n3. “0”\n4. null\n\n\
    21. **答案: C**\n\n**解释：**\n当数组元素尚未分配任何值时，默认值为零字符串。\n`$arr[5]` 的值为 “100”。\n`$arr[6]`\
    \ 的值为 “101”。\n`$arr[7]` 的值为 “102”。\n`$arr[8]` 的值为 “103”\n`$arr[9]` 的值为 “0”。\n\
    `$arr[10]` 的值为 “105”。\n\n22. **以下代码的输出是什么？**\n\n```php\n$arr=array(“A”, “B”, “C”,);\n\
    array_unshift($arr, “D”, “E”,);\narray_push($arr, “F”, “G”);\nforeach ($arr as\
    \ $value)\n{ \n    each $value;\n}\n```\n\n1. FGABCDE\n2. DEABCFG\n3. DEABC\n\
    4. ABCFG\n\n22. **答案: B**\n\n**解释：**\n可以通过 `array_unshift()` 在数组开头添加额外元素，可以通过\
    \ `array_push()` 在数组末尾添加额外元素。\n\n23. **以下代码的输出是什么？**\n\n```php\n$arr=array(“A”，“B”，“C”);\n\
    $first=array_shift($arr);\n$last=array_pop($arr);\necho ($first+$last);\n```\n\
    \n1. A\n2. B\n3. C\n4. AC\n\n23. **答案: D**\n\n**解释：**\n可以通过 `array_shift()` 移除数组中的第一个元素，可以通过\
    \ `array_pop()` 移除最后一个元素。\n\n24. **以下哪个语句可以获取数组的大小？**\n\n1. `count($array)`\n\
    2. `size($array)`\n3. `length($array)`\n4. `$array.length`\n\n24. **答案: A**\n\n\
    **解释：**\n`count()` 可用于确定数组中的元素总数。\n注意 `sizeof()` 是 `count()` 的别名。\n\n25. **以下代码后，$arr\
    \ 数组的内容是什么？**\n\n```php\n<?php\n$arr=array(1,2,3);\nforeach($arr as $k=>$v)\n\
    {\n    $v+=1;\n}\n?>\n```\n\n1. array(1,2,3)\n2. array(2,3,4)\n3. 4 见 5\n\n25.\
    \ **答案: A**\n\n**解释：**\n`foreach` 结构作用于 `$arr` 的副本，因此原始值没有发生变化。\n\n26. **以下代码后，$arr\
    \ 数组的内容是什么？**\n\n```php\n<?php\n$arr=array(1,2,3);\nforeach($arr as $k&$v)\n{\n\
    \    $v+=1;\n}\n?>\n```\n\n1. array(1,2,3)\n2. array(2,3,4)\n3. array(3,4,5)\n\
    4. array(4,5,6)\n\n26. **答案: B**\n\n**解释：**\n`&` 赋值通过引用工作。迭代变量应该是引用而非值。\n\n27.\
    \ **以下哪个语句是不正确的？**\n\n```php\n$arr1=array(2,4,6,8);\n$arr2=array(1,3,6,7);\n$arr3=array_merge($arr1,$arr2);\n\
    $arr4=array_unique($arr1,$arr2);\n$arr5=array_intersect($arr1,$arr2);\n$arr6=array_flip($arr5);\n\
    ```\n\n1. `$arr3` 的元素是：2,4,6,8,1,3,6,7\n2. `$arr4` 的元素是：1,2,3,4,6,7,8\n3. `$arr5`\
    \ 的元素是：6\n4. 1\n\n27. **答案: D**\n\n**解释：**\n`$arr6` 的元素应该是 0。`array_flip()` 会交换键和值，键变成值，值变成键。例如：\n\
    `$arr5[0]=6;`\n`$arr6=array_flip($arr5);`\n运行 `array_flip()` 后，将得到结果 `$arr5[6]=0`。因此，`$arr6`\
    \ 的元素应该是 0。\n\n28. **以下哪个语句是不正确的？**\n\n1. `asort()` 用于值排序关联数组。\n2. `rsort()` 按值倒序排序数组。\n\
    3. `ksort()` 按键排序数组。\n4. `usort()` 使用自定义函数按键排序数组。\n\n28. **答案: D**\n\n**解释：**\n\
    `usort()` 使用自定义函数按值排序数组，而不是按键。\n\n29. **以下哪个语句是不正确的？**\n\n1. `echo()` 不返回值。\n\
    2. `print()` 返回值。\n3. `echo()` 可以作为表达式的一部分。\n4. `print()` 可以作为表达式的一部分。\n\n29.\
    \ **答案: C**\n\n**解释：**\n`echo()` 不能作为表达式的一部分。\n\n30. **以下哪行是不正确的？**\n\n```php\n\
    define('EMAIL’, ‘xxx@xxx.net’); // line1\ndefine（1CONSTON’, ‘value’); // line2\n\
    define（BOOL’, false); // line3\necho BOOL; //line4\n```\n\n1. line1\n2. line2\n\
    3. line3\n4. line4\n\n30. **答案: B**\n\n**解释：**\n常量名通常使用大写字母，除了 `$` 之外遵循相同的变量命名要求。\n\
    常量命名规则：\n可以以字母开头。\n可以以下划线字符开头。\n不能以数字开头。\n\n# 第 2 章 语句\n\n1. **哪个语句最能表示以下“if”条件？**\n\
    \n```php\nif(100==$var)\n{\n    echo ’Yes’;\n}\nelse\n{\n    echo ‘No’;\n}\n```\n\
