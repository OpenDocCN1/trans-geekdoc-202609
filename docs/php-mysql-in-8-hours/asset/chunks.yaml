- fmt: "\n## Explanation\n\nFrom above, you can know:\n\n- The value of `$color[0]`\
    \ is yellow.\n- The value of `$color[1]` is purple.\n- The value of `$color[2]`\
    \ is orange.\n\nNote that the indexes begin counting from zero.\n\n## Get the\
    \ Size of Array\n\nTwo functions can get the size of an array.\n\n| `count($array);`\
    \ |\n| --- |\n| `sizeof($array);` |\n\n## Example\n\n```php\n<?php\n$color = array(“yellow”,\
    \ “purple”, “orange”);\n$size=count($color);  // Or sizeof($color);\necho ( $size\
    \ );\n?>\n```\n(Output: 3)\n\n## Explanation\n\n`count($color)` or `sizeof($color)`\
    \ can return the size of array `$color`, and assigns the size of array to `$size`.\n\
    `array(“yellow”, “purple”, “orange”)` has three elements, so its size is 3.\n\n\
    ## Add Array Elements\n\n| `array_unshift( array, value1, value2…);` |\n| ---\
    \ |\n| `array_push( array, value1, value2… );` |\n\n`array_unshift( array, value1,\
    \ value2)` adds `value1`, `value2` at beginning of array.\n`array_push( array,\
    \ value1, value2… )` adds `value1`, `value2` at end of array.\n\n## Example\n\n\
    ```php\n$myarray=array(“A”, “B”, ”C”);\narray_unshift($myarray, “D”, “E”);\narray_push($myarray,\
    \ “F”, “G”);\necho ( $myarray );\n```\n(Output: DEABCFG)\n\n## Explanation\n\n\
    `array_unshift($myarray, “D”, “E”)` adds the element `D`, `E` at the beginning\
    \ of the element `A`, `B`, `C` in `$myarray`.\n`array_push($myarray, “F”, “G”)`\
    \ adds the element `F`, `G` at the end of element `A`, `B`, `C` in `$myarray`.\n\
    \n## Remove Array Elements\n\n| `array_shift( array );` |\n| --- |\n| `array_pop(\
    \ array);` |\n\n`array_shift( array )` removes element at beginning of the array.\n\
    `array_pop( array )` removes element at end of the array.\n\n## Example\n\n```php\n\
    $myarray=array(“A”, “B”, “C”, “D”, “E” ):\n$beginning=array_shift($myarray);\n\
    $ending=array_pop($myarray):\necho ( $beginning );  // shows the first removed\
    \ element.\necho ( $ending );  // shows the last removed element.\n```\n(Output:\
    \ AE)\n\n## Explanation\n\n`array_shift($myarray)` removes and returns the first\
    \ element in the `$myarray`, returns `A`.\n`array_pop($myarray)` removes and returns\
    \ the last element in the `$myarray`, returns `E`.\n\n## Merge Array\n\n| `array_merge(\
    \ array1, array2 );` |\n| --- |\n`array_merge( array1, array2 )` can merge `array1`\
    \ and `array2`, and create a new array.\n\n## Example\n\n```php\n$array1=array\
    \ (“A”, “B”, “C”);\n$array2=array (“D”, “E”, “F”);\n$array=array_merge( $array1,\
    \ $array2 );\necho ( $array );\n```\n(Output: ABCDEF)\n\n## Explanation\n\n`array_merge($array1,\
    \ $array2 )` can merge two arrays to a new array `$array`, which holds six elements\
    \ from two arrays, returns `ABCDEF`.\n\n## Extract Array\n\n| `array_slice( array,\
    \ start, length );` |\n| --- |\n`array_slice( array, start, length )` can extract\
    \ some elements from an array, at the `start` position and by `length`, and create\
    \ a new array.\n\n## Example\n\n```php\n$array=array(“A”,”B”,”C”,”D”,”E”,”F”);\n\
    $arr=array_slice( array, 2, 3 );\necho $arr;\n```\n(Output: CDE)\n\n## Explanation\n\
    \n`array_slice( array, 2, 3 )` extracts 3 elements at position 2 from `$array`.\
    \ Note that the beginning of position starts with 0.\n\n## Sort Array\n\n| `sort(\
    \ array );` |\n| --- |\n`sort(array)` can sort the array by value.\n\n## Example\n\
    \n```php\n$color=array(“yellow”, “red”, “blue”);\nsort ( $color );\n```\n(Output:\
    \ blue red yellow)\n\n## Explanation\n\n`sort($color )` rearranges the order of\
    \ `$color` elements by value. After sorting, the array list is “blue red yellow”.\n\
    \n## Array keys & Values\n\nArray elements consist of key and value pair.\n\n\
    | `array( key1=>value1, key2=>value2, key3=>value3…);` |\n| --- |\n`=>` is used\
    \ to connect key and value (index is the same).\n\n## Example\n\n```php\n<?php\n\
    $book=array( “1st”=>”JSP”, “2nd”=>”ASP”, “3th”=>”PHP”);\necho $book[\"3th”];\n\
    ?>\n```\n(Output: PHP)\n\n## Explanation\n\nA string can act as an index of array\
    \ to show the value.\n\n## Iterate Array\n\n| `foreach(array as $key=>$value){`\
    \ |\n| --- |\nFor every loop iteration, the key of the current array is assigned\
    \ to `$key`, the value is assigned to `$value`, until the last array element.\n\
    \n## Example\n\n```php\n$book=array( “1st”=>”JSP”, “2nd”=>”ASP”, “3th”=>”PHP”);\n\
    foreach ($book as $key=>$value){\necho “The $key book is about $value\\n”;\n}\n\
    ```\n(Output: \n1st book is about JSP.\n2nd book is about ASP.\n3th book is about\
    \ PHP.)\n\n## Explanation\n\n`foreach ($book as $key=>$value)` assigns `$book`’s\
    \ key to `$key`, assigns `$book’s value to `$value` on each loop iteration. On\
    \ the first loop iteration, “1st” is assigned to `$key`, “JSP” is assigned to\
    \ `$value`, and so on…\n\n## Form Basic\n\n### Create a Form\n\nHtml form submits\
    \ data to server.\n\n| `<form action=”url” method=”get/post\">...</form>` |\n\
    | --- |\nThe `action` attribute specifies the url of the PHP file that processes\
    \ data from the form.\nThe `method` attribute specifies the way to pass data to\
    \ PHP file. Its value may be `get` or `post`.\n\n## Example\n\n```html\n<form\
    \ action= “myfile.php” method=”get” >\n……\n</form>\n```\n\n## Explanation\n\n\
    `action=\"myfile.php\"` specifies a PHP file `myfile.php` that processes the data\
    \ from this form.\n`method=\"get\"` specifies the pass-data method is `get`, which\
    \ is an open way to pass data.\n`method=\"post\"` specifies the pass-data method\
    \ is `post`, which is a hidden way to pass data.\n\n### Text Inputs\n\n| `<input\
    \ type=”text” name=”xxx”>` |\n| --- |\n`type` attribute specifies the input type,\
    \ which may be `text`, `password`, `radio`, `checkbox`, `hidden`……etc.\n`text`\
    \ type is used to input basic data.\n`name` attribute specifies the inputted contents\
    \ that will be passed to the php file for processing.\n\n## Example\n\n```html\n\
    <form action=”myfile.php” method=”get”>\n<input type=”text” name=”information”>\n\
    </form>\n```\n(Display: \n|  |\n| --- | \n) \n\n## Explanation\n\n`input type=\"\
    text\"` specifies input type is `text`, `name=\"information\"` specifies the inputted\
    \ contents that will be passed to the php file for processing.\n\n### Password\
    \ inputs\n\n| `input type=\"\"password” name=”yyy”` |\n| --- |\n`type` attribute\
    \ specifies the input type, which may be `text`, `password`, `radio`, `checkbox`,\
    \ `hidden`……etc.\n`password` type is used to input password.\n`name` attribute\
    \ specifies the inputted password that will be passed to the php file for processing.\n\
    \n## Example\n\n```html\n<form action=”myfile.php” method=”post”>\n<input type=”password”\
    \ name=”secret”>\n</form>\n```\n\n## Explanation\n\n`input type=\"password\"`\
    \ specifies input type is `password`, `name=\"secret\"` specifies the inputted\
    \ password that will be passed to the php file for processing.\n\n### Submit Inputs\n\
    \n| `<input type=”submit” value=”xxx”>` |\n| --- |\n`submit` type is used to submit\
    \ all data to server.\n`value` attribute specifies the characters will be displayed\
    \ on a button.\n\n## Example\n\n```html\n<form action=”myfile.php” method=”post”>\n\
    <input type=”text” name=”information”>\n<input type=”submit” value=”Send”>\n</form>\n\
    ```\n(Display: \n| <form>………… \n| Send |\n| --- |\n</form>)\n\n## Explanation\n\
    \n`input type=\"submit\"` will submit all data to the server.\n`value=\"Send\"\
    ` means the word “Send” shown on button.\n\n### Reset Inputs\n\n| `<input type=\"\
    \"reset” value=”xxx”>` |\n| --- |\n`reset` type is used to clear all data in the\
    \ form.\n`value` attribute specifies the characters will be displayed on a button.\n\
    \n## Example\n\n```html\n<form action=”myfile.php” method=”post”>\n<input type=”text”\
    \ name=”information”>\n<input type=”reset” value=”Clear”>\n</form>\n```\n(Display:\
    \ \n| <form>………… \n| Clear |\n| --- |\n</form>)\n\n## Explanation\n\n`input type=\"\
    reset\"` will clear all data in the form.\n`value=\"Clear\"` means the word “Clear”\
    \ shown on button.\n\n### Textarea Inputs\n\n| `<textarea name=”xxx” rows=”num”\
    \ cols=”num”>` |\n| --- |\n`textarea` type is used to input data in a text area.\n\
    `rows` specifics the number of row.\n`cols` specifics the number of column.\n\n\
    ## Example\n\n```html\n<form action=”myfile.php” method=”post”>\n<textarea name=”knowledge”\
    \ rows=”5” cols=”10”></textarea>\n</form>\n```\n(Display: \n|  |\n| --- | \n)\n"
