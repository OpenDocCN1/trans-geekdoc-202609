    \ cols=”num”> |\n\n| --- |\n\n“textarea” type is used to input data in a text\
    \ area.\n\n“rows” specifics the number of row.\n\n“cols” specifics the number\
    \ of column.\n\n## Example:\n\n<form action=”myfile.php”  method=”post”>\n\n<textarea \
    \ name=”knowledge”  rows=”5”  cols=”10”>\n\n </form>\n\n(  Display:\n\n|   |\n\
    \n| --- |\n\n)"
