    \ = $\\_COOKIE\\[‘color’\\];   echo  $mycolor;\n\n?>\n\n(  Output:  blue )\n\n\
    ## Explanation:\n\nIn a.php, setcookie(“color”, “blue”) sets a cookie name as\
    \ color and value as blue.\n\nIn b.php, $\\_COOKIE\\[“color”\\] gets a value blue\
    \ by color.\n\nSession\n\n| session\\_start( );  // Begin to use session $\\_SESSION\\\
    [“name”\\]=value;  // set session name & value. $\\_SESSION\\[“name”\\];  // get\
    \ session value by name. |\n\n| --- |\n\nA session is usually used to identify\
    \ a user. It is a way to store information across multiple pages.\n\n## Example:\n\
    \n<?php  session\\_start( );    // in a.php\n\n$\\_SESSION \\[“color”\\] = green;\n\
    \nheader(“location: b.php”);  exit( );\n\n?>\n\n<?php  session\\_start( );   \
    \ // in b.php\n\n$carcolor = $\\_SESSION \\[“color”\\];\n\n?>\n\n( Output:  green\
    \ )\n\n## Explanation:\n\nIn a.php, “$\\_SESSION\\[“color”\\] = green” set a session\
    \ name as color and value as green.\n\nIn b.php, $\\_SESSION \\[“color”\\] gets\
    \ a value green by color.\n\nOpen a File\n\n| fopen ($filename, mode); |\n\n|\
    \ --- |\n\nfopen ($filename, mode) opens a file or URL.\n\n| Mode || Operation\
    \ |\n\n| --- | --- |\n\n| r || open file for reading only, read from beginning.\
    \ |\n\n| w || open file for writing only, clear original content. |\n\n| a ||\
    \ open file for writing only, append new content. |\n\n| x || create a new file\
    \ for writing only. |\n\nImportant Notice: If above modes with “+” sign, means\
    \ opening the file for reading and writing. e.g. r+, w+, a+, x+\n\n## Example:\n\
    \n$filename = “myfile.txt”;\n\nfopen( $filename, r );\n\nfopen( $filename, w );\n\
    \n## Explanation:\n\n“fopen( $filename, r )” opens myfile.txt for reading only,\
    \ and reads from the beginning.\n\n“fopen( $filename, w )” opens myfile.txt for\
    \ writing only, and clear the original contents.\n\nRead a File\n\n| fread( $openfile,\
    \ length ); |\n\n| --- |\n\n“$openfile” specifies the opened file to read.\n\n\
    “length” Specifies the maximum number of bytes to read.\n\n##  \n\n## Example:\n\
    \n$filename = “myfile.txt”;\n\n$openfile = fopen( $filename, r );\n\n$content\
    \ = fread( $openfile, 20 );\n\n##  \n\n## Explanation:\n\n“fread( $openfile, 20\
    \ )” reads 20 bytes from myfile.txt, and read from beginning.\n\n$content = fread(\
    \ ) assigns the reading contents to $content.\n\nWrite a File\n\n| fwrite( $openfile,\
    \ “string”); |\n\n| --- |\n\n“$openfile” specifies the opened file to write.\n\
    \n“string” specifies the string to write.\n\n## Example:\n\n$filename = “myfile.txt”;\n\
    \n$openfile = fopen( $filename, w );\n\n$content = fwrite( $openfile, “Hello World!”\
    \ );\n\n##  \n\n## Explanation:\n\n“fwrite( $openfile, “Hello World!” )” clears\
    \ the original content first, and writes “Hello World!” at the beginning of specified\
    \ file.\n\nClose a File"
