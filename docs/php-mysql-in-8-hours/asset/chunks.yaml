    `//` 用于单行注释。`/*……*/` 用于多行注释。`#` 有时用于单行注释。\n\n**示例：**\n```php\n<?php\necho(\"OK\"\
    ); // output OK.\necho(\"Hello\"); /* echo(\"Hello\"); is a PHP statement, echo\
    \ is a reserved word, it displays a word \"OK\". PHP is very easy to learn. */\n\
    ?>\n```\n输出：`OK`\n\n解释：\n`// output OK;` 是单行注释。`/* echo(\"Hello\"); is a PHP statement,\
    \ echo is a keyword, display a word OK. PHP is very easy to learn.*/` 是多行注释。\n\
    \n## 变量\n变量是与值关联的符号名称。变量名以 `$` 符号开头。\n\n**示例：**\n```php\n<?php\n$var;\n$abcde;\n\
    $my_variable;\n?>\n```\n解释：\n`$var`, `$abcde` 和 `$my_variable` 都是变量。它们可以存储某些值，例如：\n\
    ```php\n$var=100;\n$abcde=\"Hello World\";\n$my_variable=true;\n```\n注意变量命名不能以数字开头，不能有空格。例如，`$23var`,\
    \ `$abc de` 是无效的变量名。但 `$var23`, `$abcde` 是有效的变量名。\n\n## 数据类型\n- **String (字符串)**：双引号或单引号内的字符。\n\
    - **Integer (整数)**：不带小数点的数字。\n- **Boolean (布尔值)**：true 或 false 的值。\n- **Float\
    \ (浮点数)**：带小数点的数字。\n\n**示例：**\n```php\n$str='I am a string';\n$int=168;\n$float=12.88;\n\
    $bool=true;\n```\n解释：\n`$str='I am a string';` // `$str` 数据类型为 `String`。\n`$int=168;`\
    \ // `$int` 数据类型为 `Integer`。\n`$float=12.88;` // `$float` 数据类型为 `Float`。\n`$bool=true;`\
    \ // `$bool` 数据类型为 `Boolean`。\n注意：字符串始终使用双引号或单引号，例如 `\"abcde\"`, `'learning'`。\n\
    \n## 转义字符\n反斜杠 `\\` 用于转义字符。`\\n` 将内容输出到下一行。`\\r` 输出回车。`\\t` 制制表。`\\\"` 输出双引号。`\\\
    '` 输出单引号。\n\n**示例：**\n```php\n<?php\necho(\"Hello World\");\n?>\n```\n输出：`Hello\
    \ World`\n\n## 函数\n函数是一个可以多次重复的代码块。要定义函数，使用 `function`。\n\n**示例：**\n```php\n<?php\n\
    function test(){\n    echo(\"show sample\");\n}\ntest();\n?>\n```\n输出：`show sample`\n\
    \n解释：\n`function(){ }` 是 PHP 的声明。`test()` 是一个调用。\n\n## 带参数的函数\n函数括号内可以有一个或多个参数，用于传递数据。\n\
    \n**示例：**\n```php\n<?php\nfunction test($arg){\n    echo(\"Hello World\");\n}\n\
    test(\"arg\");\n?>\n```\n输出：`Hello World`\n\n解释：\n`$arg` 是函数的参数。`test(\"arg\"\
    )` 调用函数。\n\n## 变量作用域\n全局变量在函数外部声明，可以在地方使用。局部变量在函数内部声明，仅在当前函数内部使用。\n\n**示例：**\n\
    ```php\n<?php\n$num=200; // 这个 $num 是全局变量。\nfunction test(){\n    $num=100; //\
    \ 这个 $num 是局部变量。\n}\necho $num;\n?>\n```\n输出：`200`\n\n解释：\n`echo $num` 输出 `200`，这意味着\
    \ `$num` 存储的是全局变量的值。如果你想在函数内部声明全局变量，应该在变量名前使用关键字 `global`，例如 `function test(){\
    \ global $num; }`。\n\n## 多参数\n函数可以有多个参数；这些参数同时为函数传递数据。\n\n**示例：**\n```php\n<?php\n\
    function test($arg1, $arg2, $arg3){\n    $sum=$arg1+$arg2+$arg3;\n    echo $sum;\n\
    }\ntest(3, 6, 9);\n?>\n```\n输出：`18`\n\n解释：\n当 `test(3, 6, 9)` 调用函数 `test($arg1,\
    \ $arg2, $arg3)` 时，参数 `3,6,9` 传递给 `$arg1, $arg2, $arg3`，$sum` 被赋值为 `18`。输出为 `18`。\n\
    \n# 第二小时\n# PHP 基础\n## 算术运算符\n| 运算符 |  |\n| --- | --- |\n| `+` | 加法 |\n| `-` |\
    \ 减法 |\n| `*` | 乘法 |\n| `/` | 除法 |\n| `%` | 取模 |\n| `++` | 加 1 |\n| `--` | 减 1\
    \ |\n| `.` | 连接两个字符串 |\n\n"
