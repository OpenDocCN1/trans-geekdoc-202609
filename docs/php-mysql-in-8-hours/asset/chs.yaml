  3. “0”\n4. null\n\n21. **答案: C**\n\n**解释：**\n当数组元素尚未分配任何值时，默认值为零字符串。\n`$arr[5]`\
  \ 的值为 “100”。\n`$arr[6]` 的值为 “101”。\n`$arr[7]` 的值为 “102”。\n`$arr[8]` 的值为 “103”\n\
  `$arr[9]` 的值为 “0”。\n`$arr[10]` 的值为 “105”。\n\n22. **以下代码的输出是什么？**\n\n```php\n$arr=array(“A”,\
  \ “B”, “C”,);\narray_unshift($arr, “D”, “E”,);\narray_push($arr, “F”, “G”);\nforeach\
  \ ($arr as $value)\n{ \n    each $value;\n}\n```\n\n1. FGABCDE\n2. DEABCFG\n3. DEABC\n\
  4. ABCFG\n\n22. **答案: B**\n\n**解释：**\n可以通过 `array_unshift()` 在数组开头添加额外元素，可以通过 `array_push()`\
  \ 在数组末尾添加额外元素。\n\n23. **以下代码的输出是什么？**\n\n```php\n$arr=array(“A”，“B”，“C”);\n$first=array_shift($arr);\n\
