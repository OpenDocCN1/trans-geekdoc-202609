  \n## 前言\n\n“8 小时学会 PHP & MYSQL”是一本适合初学者的书籍。你可以快速轻松地学习 PHP & MYSQL 的完整基础知识。直观的定义、通俗易懂的示例、详尽的解释以及整洁美丽的布局是本非常有帮助且具有教育意义的书的特点。你会被这种独特的写作风格所吸引。阅读这本书是一种享受！你可以在\
  \ 8 小时内掌握所有核心 PHP & MySQL 技能。从今天开始编程吧！\n\n（本书附录包括：\n(1) 6 条安全提示\n(2) MySQL 命令表\n\
  (3) 100 道面试题、答案及解析）\n\n\n- 处理数据\n- Cookie\n- 跳转\n- 文件\n- 读取文件\n- 写入文件\n- 关闭文件\n\
  - 列类型\n- 插入表\n- 修改表\n- 更新特定数据\n- 删除数据\n- 选择查询\n- 连接 MySQL 服务器\n- 选择数据库\n- 插入表数据\n\
  - 修改表数据\n- 检索表数据\n- mysqli_fetch_row()\n- mysqli_fetch_assoc()\n- mysqli_fetch_array()\n\
  - mysqli_num_rows()\n- 类与对象\n\n\n\n\n\n### 类定义\n\n## `$this->variable`\n\n## 对象声明\n\
  \n## 构造函数 (1)\n\n## 构造函数 (2)\n\n## 析构函数\n\n## 类\n\n## 继承的使用\n\n## `Class::method()`\n\
  \n\n\n\n# 100 道面试题与答案\n\n## 什么是 PHP？\nPHP 是一种用于 Web 开发的服务器端语言，意为“Personal Homepage”。PHP\
  \ 的语法如下：\n\n```php\n<?php\necho(\"Hello World!\");\n?>\n```\n输出：`Hello World!`\n\
  \n解释：\nPHP 代码以 `<?php` 开始，以 `?>` 结束，其语法如下：\n```php\n<?php\necho(\"Hello World\"\
  );\n?>\n```\n`echo` 是 PHP 的命令，意为“输出”或“显示”。`echo(\"Hello World\")` 将输出 `Hello World`。\n\
  \n## 关键字\n某些单词仅供 PHP 自身使用。在为变量、函数和标签选择标识符时不能使用它们。以下单词是 PHP 关键字：`array`, `break`,\
  \ `case`, `const`, `default`, `do`, `else`, `empty`, `eval`, `extends`, `exit`,\
  \ `false`, `for`, `foreach`, `global`, `if`, `include`, `include_once`, `isset`,\
  \ `list`, `new`, `null`, `print`, `require`, `require_once`, `return`, `static`,\
  \ `switch`, `unset`, `while`。\n\n`const` 和 `continue` 不能用变量名、函数名或标签名。\n\n## 注释\n\
  `//` 用于单行注释。`/*……*/` 用于多行注释。`#` 有时用于单行注释。\n\n**示例：**\n```php\n<?php\necho(\"OK\"\
  ); // output OK.\necho(\"Hello\"); /* echo(\"Hello\"); is a PHP statement, echo\
  \ is a reserved word, it displays a word \"OK\". PHP is very easy to learn. */\n\
  ?>\n```\n输出：`OK`\n\n解释：\n`// output OK;` 是单行注释。`/* echo(\"Hello\"); is a PHP statement,\
  \ echo is a keyword, display a word OK. PHP is very easy to learn.*/` 是多行注释。\n\n\
  ## 变量\n变量是与值关联的符号名称。变量名以 `$` 符号开头。\n\n**示例：**\n```php\n<?php\n$var;\n$abcde;\n$my_variable;\n\
  ?>\n```\n解释：\n`$var`, `$abcde` 和 `$my_variable` 都是变量。它们可以存储某些值，例如：\n```php\n$var=100;\n\
  $abcde=\"Hello World\";\n$my_variable=true;\n```\n注意变量命名不能以数字开头，不能有空格。例如，`$23var`,\
  \ `$abc de` 是无效的变量名。但 `$var23`, `$abcde` 是有效的变量名。\n\n## 数据类型\n- **String (字符串)**：双引号或单引号内的字符。\n\
  - **Integer (整数)**：不带小数点的数字。\n- **Boolean (布尔值)**：true 或 false 的值。\n- **Float (浮点数)**：带小数点的数字。\n\
  \n**示例：**\n```php\n$str='I am a string';\n$int=168;\n$float=12.88;\n$bool=true;\n\
  ```\n解释：\n`$str='I am a string';` // `$str` 数据类型为 `String`。\n`$int=168;` // `$int`\
  \ 数据类型为 `Integer`。\n`$float=12.88;` // `$float` 数据类型为 `Float`。\n`$bool=true;` //\
  \ `$bool` 数据类型为 `Boolean`。\n注意：字符串始终使用双引号或单引号，例如 `\"abcde\"`, `'learning'`。\n\n\
  ## 转义字符\n反斜杠 `\\` 用于转义字符。`\\n` 将内容输出到下一行。`\\r` 输出回车。`\\t` 制制表。`\\\"` 输出双引号。`\\'`\
  \ 输出单引号。\n\n**示例：**\n```php\n<?php\necho(\"Hello World\");\n?>\n```\n输出：`Hello World`\n\
  \n## 函数\n函数是一个可以多次重复的代码块。要定义函数，使用 `function`。\n\n**示例：**\n```php\n<?php\nfunction\
  \ test(){\n    echo(\"show sample\");\n}\ntest();\n?>\n```\n输出：`show sample`\n\n\
  解释：\n`function(){ }` 是 PHP 的声明。`test()` 是一个调用。\n\n## 带参数的函数\n函数括号内可以有一个或多个参数，用于传递数据。\n\
  \n**示例：**\n```php\n<?php\nfunction test($arg){\n    echo(\"Hello World\");\n}\n\
  test(\"arg\");\n?>\n```\n输出：`Hello World`\n\n解释：\n`$arg` 是函数的参数。`test(\"arg\")`\
  \ 调用函数。\n\n## 变量作用域\n全局变量在函数外部声明，可以在地方使用。局部变量在函数内部声明，仅在当前函数内部使用。\n\n**示例：**\n```php\n\
  <?php\n$num=200; // 这个 $num 是全局变量。\nfunction test(){\n    $num=100; // 这个 $num 是局部变量。\n\
  }\necho $num;\n?>\n```\n输出：`200`\n\n解释：\n`echo $num` 输出 `200`，这意味着 `$num` 存储的是全局变量的值。如果你想在函数内部声明全局变量，应该在变量名前使用关键字\
  \ `global`，例如 `function test(){ global $num; }`。\n\n## 多参数\n函数可以有多个参数；这些参数同时为函数传递数据。\n\
  \n**示例：**\n```php\n<?php\nfunction test($arg1, $arg2, $arg3){\n    $sum=$arg1+$arg2+$arg3;\n\
  \    echo $sum;\n}\ntest(3, 6, 9);\n?>\n```\n输出：`18`\n\n解释：\n当 `test(3, 6, 9)` 调用函数\
  \ `test($arg1, $arg2, $arg3)` 时，参数 `3,6,9` 传递给 `$arg1, $arg2, $arg3`，$sum` 被赋值为\
  \ `18`。输出为 `18`。\n\n# 第二小时\n## PHP 基础\n## 算术运算符\n| 运算符 |  |\n| --- | --- |\n| `+`\
  \ | 加法 |\n| `-` | 减法 |\n| `*` | 乘法 |\n| `/` | 除法 |\n| `%` | 取模 |\n| `++` | 加 1 |\n\
  | `--` | 减 1 |\n| `.` | 连接两个字符串 |\n\n\n\n\n\n#### 示例：\n\n```php\n$add=100+200; echo\
  \ $add;\n$div=800/2; echo $div;\n$mod=10%3; echo $mod;\n$inc=10; echo ++$inc;\n\
  $str=”abc”.”de”; echo $str;\n```\n\n#### 解释：\n\n`$add=100+200; echo $add;` 输出 300\n\
  \n`$div=800/2; echo $div;` 输出 400\n\n`$mod=10%3; echo $mod;` 输出 1\n\n`$inc=10; echo\
  \ ++$inc;` 输出 11\n\n`$str=”abc”.”de”; echo $str;` 输出 abcde。\n\n## 逻辑运算符\n\n| 运算符\
  \ | 等价于 |\n| --- | --- |\n| `&&` | `and` |\n| `||` | `or` |\n| `!` | `not` |\n\n\
  使用逻辑运算符后，结果将为真（true）或假（false）。\n\n#### 示例：\n\n```php\n$x=true; $y=false;\n$a=$x\
  \ && $y; echo $a; // 输出: false\n$b=$x || $y; echo $b; // 输出: true\n$c=! $x; echo\
  \ $c; // 输出: false\n```\n\n#### 解释：\n\n| `true && true; 返回 true;` | `true && false;\
  \ 返回 false;` | `false &&false; 返回 false;` |\n| --- | --- | --- |\n| `true || true;\
  \ 返回 true;` | `true || false; 返回 true;` | `false || false;return false;` |\n| `!\
  \ false;返回 true;` | `! true;返回 false;` | |\n\n## 赋值运算符\n\n| 运算符 | 示例： | 等价于： |\n\
  | --- | --- | --- |\n| `+=` | `$x+=$y` | `$x=$x+$y` |\n| `-=` | `$x-=$y` | `$x=$x-$y`\
  \ |\n| `*=` | `$x*=$y` | `$x=$x\\*$y` |\n| `/=` | `$x/=$y` | `$x=$x/$y` |\n| `%=`\
  \ | `$x%=$y` | `$x=$x%$y` |\n| `.`=` | `$x.=$y` | `$x=$x.$y` |\n\n#### 示例：\n\n```php\n\
  $x=200; $y=100;\n$x+=$y; echo $x;\n$x/=$y; echo $x;\n$x-=$y; echo $x;\n$m=”abc\"\
  ; $n=”de\";\n$m.=$n echo $m;\n```\n\n#### 解释：\n\n`$x+=$y;` // `$x=$x+$y; echo $x;`\
  \ 输出 300\n`$x/=$y;` // `$x=$x/$y; echo $x;` 输出 2\n`$x-=$y;` // `$x=$x-$y; echo $x;`\
  \ 输出 100\n`$m.=$n;` // `$m=$m.$n; echo $m;` 输出 abcde\n\n## 比较运算符\n\n| 运算符 | 说明 |\n\
  | --- | --- |\n| `>` | 大于 |\n| `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n| `==`\
  \ | 等于 |\n| `!=` | 不等于 |\n\n使用比较运算符后，结果将为真（true）或假（false）。\n\n#### 示例：\n\n```php\n\
  $a=100; $b=200;\n$result = ($a>$b); echo $result;\n$result = ($a==b); echo $result;\n\
  $result = ($a!=$b); echo $result;\n```\n\n#### 解释：\n\n`$result = ($a>$b);` 输出 false\n\
  `$result = ($a==b);` 输出 false\n`$result = ($a!=$b);` 输出 true\n\n## 三元运算符\n\n`表达式\
  \ (条件) ? 真值表达式 : 假值表达式`\n三元运算符类似于 `if-else` 语句。\n\n#### 示例：\n\n```php\n$a=10;\n\
  $b=20;\n$result = ($a>$b) ? \"a\" : \"b\"; echo $result; // 输出: b\n```\n\n#### 解释：\n\
  \n`$result = ($a>$b) ? \"a\" : \"b\";` 如果 `$a` 大于 `$b`，则返回 \"a\"，否则返回 \"b\"。\n\n\
  ## 算运算符\n\n| 运算符 | 说明 |\n| --- | --- |\n| `++` | 自增 |\n| `--` | 自减 |\n| `+` | 加法\
  \ |\n| `-` | 减法 |\n| `*` | 乘法 |\n| `/` | 除法 |\n| `%` | 取模 |\n| `.` | 字符串连接 |\n\n\
  #### 示例：\n\n```php\n$x=10;\necho ++$x; // 输出 11\necho $x++; // 输出 11\necho --$x;\
  \ // 输出 10\necho $x--; // 输出 10\n```\n\n#### 解释：\n\n`++$x` 先自增后输出。\n`$x++` 先输出后自增。\n\
  `--$x` 先自减后输出。\n`$x--` 先输出后自减。\n\n## 运算符优先级\n\n| 运算符 | 优先级 |\n| --- | --- |\n| `++`,\
  \ `--` (前置) | 最高 |\n| `*`, `/`, `%` | |\n| `+`, `-` | |\n| `.` | |\n| `==`, `!=`\
  \ | |\n| `>`, `<`, `>=`, `<=` | |\n| `!` | |\n| `&&` | |\n| `||` | 最低 |\n\n在 PHP\
  \ 中，运算符的优先级在 `if-else` 和三元运算符之前。\n\n#### 示例：\n\n```php\n$result = 10 + 5 * 2; //\
  \ 输出 20\n```\n\n#### 解释：\n\n乘法 `*` 的优先级高于加法 `+`。\n\n\n\n\n\n## 解析\n\n通过以上内容，你可以知道：\n\
  \n- `$color[0]` 的值是黄色。\n- `$color[1]` 的值是紫色。\n- `$color[2]` 的值是橙色。\n\n注意索引从零开始计数。\n\
  \n## 获取数组大小\n\n有两个函数可以获取数组的大小。\n\n| `count($array);` |\n| --- |\n| `sizeof($array);`\
  \ |\n\n## 示例\n\n```php\n<?php\n$color = array(“yellow”, “purple”, “orange”);\n$size=count($color);\
  \  // 或 sizeof($color);\necho ( $size );\n?>\n```\n(输出: 3)\n\n## 解析\n\n`count($color)`\
  \ 或 `sizeof($color)` 可以返回数组 `$color` 的大小，并将大小赋值给 `$size`。\n`array(“yellow”, “purple”,\
  \ “orange”)` 有三个元素，所以它的大小为 3。\n\n## 添加数组元素\n\n| `array_unshift( array, value1, value2…);`\
  \ |\n| --- |\n| `array_push( array, value1, value2… );` |\n\n`array_unshift( array,\
  \ value1, value2)` 将 `value1`、`value2` 添加到数组开头。\n`array_push( array, value1, value2…\
  \ )` 将 `value1`、`value2` 添加到数组末尾。\n\n## 示例\n\n```php\n$myarray=array(“A”, “B”, ”C”);\n\
  array_unshift($myarray, “D”, “E”);\narray_push($myarray, “F”, “G”);\necho ( $myarray\
  \ );\n```\n(输出: DEABCFG)\n\n## 解析\n\n`array_unshift($myarray, “D”, “E”)` 在 `$myarray`\
  \ 元素 `A`, `B`, `C` 的开头添加元素 `D`, `E`。\n`array_push($myarray, “F”, “G”)` 在 `$myarray`\
  \ 元素 `A`, `B`, `C` 的末尾添加元素 `F`, `G`。\n\n## 移除数组元素\n\n| `array_shift( array );` |\n\
  | --- |\n| `array_pop( array);` |\n\n`array_shift( array )` 移除数组开头的元素。\n`array_pop(\
  \ array )` 移除数组末尾的元素。\n\n## 示例\n\n```php\n$myarray=array(“A”, “B”, “C”, “D”, “E”\
  \ ):\n$beginning=array_shift($myarray);\n$ending=array_pop($myarray):\necho ( $beginning\
  \ );  // 显示第一个移除的元素。\necho ( $ending );  // 显示最后一个移除的元素。\n```\n(输出: AE)\n\n## 解析\n\
  \n`array_shift($myarray)` 移除并返回 `$myarray` 中的第一个元素，返回 `A`。\n`array_pop($myarray)`\
  \ 移除并返回 `$myarray` 中的最后一个元素，返回 `E`。\n\n## 合并数组\n\n| `array_merge( array1, array2\
  \ );` |\n| --- |\n`array_merge( array1, array2 )` 可以合并 `array1` 和 `array2` 并创建一个新数组。\n\
  \n## 示例\n\n```php\n$array1=array (“A”, “B”, “C”);\n$array2=array (“D”, “E”, “F”);\n\
  $array=array_merge( $array1, $array2 );\necho ( $array );\n```\n(输出: ABCDEF)\n\n\
  ## 解析\n\n`array_merge($array1, $array2 )` 可以两个数组合并为一个新数组 `$array`，该数组包含两个数组的六个元素，返回\
  \ `ABCDEF`。\n\n## 提取数组\n\n| `array_slice( array, start, length );` |\n| --- |\n\
  `array_slice( array, start, length )` 可以从数组的 `start` 位置根据 `length` 提取某些元素并创建一个新数组。\n\
  \n## 示例\n\n```php\n$array=array(“A”,”B”,”C”,”D”,”E”);\n$arr=array_slice( array,\
  \ 2, 3 );\necho $arr;\n```\n(输出: CDE)\n\n## 解析\n\n`array_slice( array, 2, 3 )` 从\
  \ `$array` 的位置 2 开始提取 3 个元素。位置从 0 开始。\n\n## 排序数组\n\n| `sort( array );` |\n| ---\
  \ |\n`sort(array)` 可以按值对数组进行排序。\n\n## 示例\n\n```php\n$color=array(“yellow”, “red”,\
  \ “blue”);\nsort (color );\n```\n(输出: blue red yellow)\n\n## 解析\n\n`sort($color\
  \ )` 按值重新排列 `$color` 元素的顺序。\n\n## 数组键值对\n\n数组元素由键值对组成。\n\n| `array( key1=>value1,\
  \ key2=>value2, key3=>value3);` |\n| --- |\n`=>` 用于连接键和值（索引相同）。\n\n## 示例\n\n```php\n\
  <?php\n$book=array (“1st”=>”JSP”, “2nd”=>”ASP”, “3th”=>”PHP”);\necho $book[\"3th\"\
  ];\n?>\n```\n(输出: PHP)\n\n## 遍历数组\n\n| `foreach(array as $key=>$value)` |\n| ---\
  \ |\n每次循环迭代，将数组的键赋值给 `$key$，值赋值给 `$value$，直到最后一个元素。\n\n## 示例\n\n```php\n$book=array\
  \ (“1st”=>”JSP”, “2nd”=>”ASP”, “3th”=>”PHP”);\nforeach ($book as $key=>$value){\n\
  echo $key book is about $value\\n;\n}\n```\n(输出: \n1st book is about JSP.\n2nd book\
  \ is about ASP.\n3th book is about PHP.)\n\n## 解析\n\n`foreach ($book as $key=>$value)`\
  \ 将 `$book` 的键赋值给 `$key`，每次循环迭代。\n\n## 表单基础\n\n### 创建表单\n\nHTML 表单将数据提交到服务器。\n\n\
  | `<form action=”url” method=”get/post\">...</form>` |\n| --- |\n`action` 属性指定处理表单数据的\
  \ PHP 文件。\n`method` 属性指定传递数据的方法。可以是 `get` 或 `post`。\n\n## 示例\n\n```html\n<form action=“myfile.php”\
  \ method=”get” >\n\n``` 解析\n\n`action=\"myfile.php\"` 指定处理此表单数据的 PHP 文件 `myfile.php`。\n\
  `method=\"get\"` 指定传递数据的方法为 `get`，这是一种公开的数据传递方式。\n`method=\"post\"` 指定传递数据的方法为 `post`，这是一种隐藏的数据传递方式。\n\
  \n### 文本输入\n\n| `<input type=”text” name=”xxx”>` |\n| --- |\n`type` 属性指定输入类型，可以是\
  \ `text`、`password`、`radio`、`checkbox`、`hidden` 等。\n`text` 类型用于输入基础数据。\n`name` 属性指定传递给\
  \ PHP 文件的内容。\n\n## 示例\n\n```html\n<form action=”myfile.php” method=”get”>\n<input\
  \ type=”text” name=”information”>\n</form>\n```\n(显示: \n|  |\n| --- | \n)\n\n##\
  \ 解析\n\n`input type=\"text\"` 指定输入类型为 `text`，`name=\"information\"` 指定传递给 PHP 文件的内容。\n\
  \n### 密码输入\n\n| `input type=\"\"password” name=”yyy”` |\n| --- |\n`type` 属性指定输入类型，可以是\
  \ `text`、`password`、`radio`、`checkbox`、`hidden` 等。\n`password` 类型用于输入密码。\n`name`\
  \ 属性指定传递给 PHP 文件的密码。\n\n## 示例\n\n```html\n<form action=”myfile.php” method=”post”>\n\
  <input type=”password” name=”secret”>\n</form>\n```\n\n## 解析\n\n`input type=\"password\"\
  ` 指定输入类型为 `password`，`name=\"secret\"` 指定传递给 PHP 文件的密码。\n\n### 提交输入\n\n| `<input\
  \ type=”submit” value=”xxx”>` |\n| --- |\n`submit` 类型用于向服务器提交所有数据。\n`value` 属性指定显示在按钮上的字符。\n\
  \n## 示例\n\n```html\n<form action=”myfile.php” method=”post”>\n<input type=”text”\
  \ name=”information”>\n<input type=”submit” value=”Send”>\n</form>\n```\n(显示: \n\
  | <form>………… \n| Send |\n| --- |\n</form>)\n\n## 解析\n\n`input type=\"submit\"` 将将所有数据提交到服务器。\n\
  `value=\"Send\"` 意味着按钮上显示的单词是“Send”。\n\n### 重置输入\n\n| `<input type=\"\"reset” value=”xxx”>`\
  \ |\n| --- |\n`reset` 类型用于清空表单中的所有数据。\n`value` 属性指定显示在按钮上的字符。\n\n## 示例\n\n```html\n\
  <form action=”myfile.php” method=”post”>\n<input type=”text” name=”information”>\n\
  <input type=”reset” value=”Clear”>\n</form>\n```\n(显示: \n| <form>………… \n| Clear\
  \ |\n| --- |\n</form>)\n\n## 解析\n\n`input type=\"reset\"` 将清空表单中的所有数据。\n`value=\"\
  Clear\"` 意味着按钮上显示的单词是“Clear”。\n\n### Textarea 输入\n\n| `<textarea name=”xxx” rows=”num”\
  \ cols=”num”>` |\n| --- |\n`textarea` 类型用于在文本区域内输入数据。\n`rows` 指定行数。\n`cols` 指定列数。\n\
  \n## 示例\n\n```html\n<form action=”myfile.php” method=”post”>\n<textarea name=”knowledge”\
  \ rows=”5” cols=”10”></textarea>\n</form>\n```\n(显示: \n|  |\n| --- | \n)\n\n\n\n\
  \n\n## 解析\n\n`name=\"knowledge\"` 指定了将传递到 `php` 文件进行处理的输入内容。\n\n`rows` 指定行数为 `5`。\n\
  \n`cols` 指定了列数为 `10`。\n\n#### 单选框 (Radio Inputs)\n\n| `<input type=\"radio\" name=\"\
  data\" value=\"myvalue\">` |\n| --- |\n\n`type=\"radio\"` 用于通过单选输入数据。\n\n`name=\"\
  data\"` 指定了将传递到 `php` 文件进行处理的输入内容。\n\n`value=\"myvalue\"` 指定了可选内容之一。\n\n## 示例\n\n\
  ```html\n<input type=\"radio\" name=\"color\" value=\"red\">\n<input type=\"radio\"\
  \ name=\"color\" value=\"blue\">\n<input type=\"radio\" name=\"color\" value=\"\
  pink\">\n```\n\n( 显示:\n○　red\x80○　blue　　　　　　　○　pink\n )\n\n## 解析\n\n`type=\"radio\"\
  ` 允许你选择你喜欢的圆圈中的一个。\n\n`name=\"color\"` 指定了将传递到 `php` 文件进行处理的选中内容。\n\n`value=\"red\"\
  ` 指定了红色的内容之一。\n\n#### 复选框 (Checkbox Inputs)\n\n| `<input type=\"checkbox\" name=\"\
  data\" value=\"myvalue\">` |\n| --- |\n\n`type=\"checkbox\"` 用于通过多选输入数据。\n\n`name=\"\
  data\"` 指定了将传递到 `php` 文件进行处理的输入内容。\n\n`value=\"myvalue\"` 指定了可选内容之一。\n\n## 示例\n\n\
  ```html\n<input type=\"checkbox\" name=\"color\" value=\"red\">\n<input type=\"\
  checkbox\" name=\"color\" value=\"blue\">\n<input type=\"checkbox\" name=\"color\"\
  \ value=\"pink\">\n```\n\n( 显示:\n□　red　　　　　　　〠〠〠□　blue　　　　　　　　　□　pink\n )\n\n##\
  \ 解析\n\n`type=\"checkbox\"` 允许你勾选你喜欢的框。\n\n`name=\"color\"` 指定了将传递到 `php` 文件进行处理的选中内容。\n\
  \n`value=\"red\"` 指定了红色的内容之一。\n\n#### 表单与 PHP 协作\n\n| `$data=$_GET[data];` |\n|\
  \ --- |\n\n在 `php` 文件中，`$data=$_GET[data]`：从 HTML 表单获取数据并赋值给 `$data`。（注意表单的 `method=\"\
  get\"`）。\n\n## 示例\n\n```html\n<form action=\"myfile.php\" method=\"get\">\n<input\
  \ type=\"text\" name=\"information\">\n</form>\n```\n\n( 在表单中输入 “Hello”。 )\n\n```php\n\
  <?php // 这是 myfile.php\n$information = $_GET[information];\necho $information;\n\
  ?>\n```\n\n( 输出: Hello! )\n\n## 解析\n\n在 `myfile.php` 中，`$_GET[information]` 从 html\
  \ 表单获取数据 “information”，并赋值给 `$information`。\n\n#### 表单与 PHP 协作\n\n| `$data=$_POST[data];`\
  \ |\n| --- |\n\n在 `php` 文件中，`$data=$_POST[data]`：从 HTML 表单获取数据并赋值给 `$data`。（注意表单的\
  \ `method=\"post\"`）。\n\n## 示例\n\n```html\n<form action=\"myfile.php\" method=\"\
  post\">\n<textarea name=\"knowledge\" rows=\"10\" cols=\"5\">\n</form>\n```\n\n\
  ( 输入 “Hello World! Welcome to PHP!”。 )\n\n```php\n<?php // 这是 myfile.php\n$knowledge\
  \ = $_POST[knowledge];\necho $knowledge;\n?>\n```\n\n( 输出: Hello World! Welcome\
  \ to PHP! )\n\n## 解析\n\n在 `myfile.php` 中，`$_POST[knowledge]` 从 html 表单获取数据 “Hello\
  \ World! Welcome to PHP! ”，并赋值给 `$knowledge`。\n\n# 第 5 小时\n## 动态数据\n\n### 日期与时间\n\
  \n| `date(\"M d Y\"); date(\"h : i : s\"); date(\"D H A\");` |\n| --- |\n\n`date(\"\
  M d Y\")` 显示月份、日期、年份。\n\n`date(\"h : i : s\")` 显示小时、分钟、秒。\n\n`date(\"D H A\")` 显示星期几、小时、上午/下午。\n\
  \n## 示例\n\n```php\n$date = date(\"M d Y\");\n$hour = date(\"h : i : s\");\n$week\
  \ = date(\"D H A\");\necho $date;\necho $hour;\necho $week;\n```\n\n( 输出: Feb 10\
  \ 2015 11:20:30 Mon 11 AM )\n\n## 解析\n\n| M: Jan-Dec || d: 01-31 || Y: YYYY |\n\
  | --- | --- | --- |\n| h: 01-12 || i: 00-59 || s: 00-59 |\n| D: Sun-Sat || H: 00-23\
  \ || A: AM/PM |\n\n### 字符串处理\n\n| `strlen()` | `strtoupper()` | `strtolower()` |\n\
  | --- | --- | --- |\n\n`strlen()` 返回字符串的长度。\n\n`strtoupper()` 返回大写。\n\n`strtolower()`\
  \ 返回小写。\n\n## 示例\n\n```php\n$string=\"Hello World!\";\necho strlen($string);\necho\
  \ strtoupper($string);\necho strtolower($string);\n```\n\n## 重定向\n\n| `header(\"\
  Location=$url\")` |\n| --- |\n\n`header(\"Location=$url\")` 可以将浏览器重定向到 `$url`。\n\
  \n## 示例\n\n```php\n$url=\"http://example.com\";\nheader(\"Location=$url\");\n```\n\
  \n## 解析\n\n`header(\"Location=$url\")` 将浏览器重定向到指定的 URL。\n\n\n\n\n\n```\nfclose($openfile);\n\
  ```\n\n`$openfile` 指定了已打开的文件。\n\n在使用该文件后将其关闭是一个良好的习惯。你可以释放内存，其他进程可能可以使用该文件。\n\n\
  #### 示例：\n\n```php\n$filename = “myfile.txt”;\n$openfile = fopen( $filename, r );\n\
  ……\nfclose( $openfile) ;\n```\n\n#### 解释：\n\n在使用文件 `myfile.txt` 后，`fclose($openfile)`\
  \ 关闭了打开的文件。\n\n# 第 6 小时：MySQL 基础\n\n## 选择数据库\n\n```sql\nuse database-name;\n```\n\
  \n一旦你与 `MySQL` 服务器建立连接，就需要选择一个特定的数据库进行工作。\n\n`use database-name` 可以选择一个数据库。\n\n\
  #### 示例：\n\n```mysql\nmysql>use mydatabase;\nDatabase changed\n```\n\n#### 解释：\n\
  \n`mysql>` 是 `MySQL` 的提示符。\n\n`use mydatabase` 选择名为 `mydatabase` 的数据库。\n\n`Database\
  \ changed` 是 `MySQL` 的响应文本。\n\n## 创建数据库\n\n```sql\ncreate database database-name;\n\
  ```\n\n`create database database-name` 可以创建一个数据库。\n\n`database-name` 指定了数据库名称。\n\
  \n#### 示例：\n\n```mysql\nmysql> create database newdatabase;\nQuery OK,……\n```\n\n\
  #### 解释：\n\n`create database newdatabase` 创建了一个名为 `newdatabase` 的数据库。\n\n`Query\
  \ OK,……” 是 `MySQL` 的响应文本。\n\n## 创建并显示表\n\n```sql\ncreate table table-name(column\
  \ type, column type,…); show tables;\n```\n\n`create table table-name` 可以创建一个表。\n\
  \n`column type, column type,…` 指定了列名及其数据类型。\n\n`show tables` 可以显示所有表。\n\n#### 示例：\n\
  \n```mysql\nmysql> create table colortable(id int, color varchar(20));\nmysql> show\
  \ tables;\n```\n\n#### 解释：\n\n`create table colortable` 创建了一个名为 `colortable` 的表。\n\
  \n`id int` 指定了一个名为 `id` 的列，数据类型为 `int`。\n\n`color varchar(20)` 指定了一个名为 `color` 的列，数据类型为\
  \ `varchar(20)`。\n\n`show tables` 可以显示数据库中的所有表。\n\n## MySQL 数据类型\n\n| 类型 | 解释 |\n\
  | :--- | --- |\n| int | 整数 |\n| decimal | 浮点数 |\n| date | YYYY-MM-DD 格式的日期 |\n|\
  \ time | HH:MM:SS 格式的时间 |\n| year | YYYY 格式的年份 |\n| char( ) | 固定长度字符串 |\n| varchar(\
  \ ) | 可变长度的字符串 |\n| text | 0 到 65535 个字符的字符串 |\n\n#### 示例：\n\n```mysql\nmysql> create\
  \ table colortable( id int, color varchar(20) );\n```\n\n#### 解释：\n\n`id int`: `id`\
  \ 的数据类型是 `int`，一个整数。\n\n`color varchar(20)`: `color` 的数据类型是 `varchar(20)`，一个可变长度字符串。\n\
  \n## 列修饰符\n\n| 修饰符 | 解释 |\n| \\--- | --- |\n| auto\\_increment | 自动增加值 |\n| not\
  \ null | 必须包含数据 |\n| unique | 必须是唯一的 |\n| primary key(arg) | 指定其参数为主键 |\n\n####\
  \ 示例：\n\n```mysql\nmysql> create table colortable( id int auto\\_increment, \ncolor\
  \ varchar(20) not null );\n```\n\n#### 解释：\n\n`id int auto\\_increment`: `id` 的值可以比之前的值自动增加。\n\
  \n`color varchar(20) not null`: `color` 列必须包含数据。\n\n## 向表插入数据\n\n```sql\ninsert\
  \ into table-name ( column1, column2, column3 ) values (value1, value2, value3);\n\
  ```\n\n`column1, column2, column3` 将被分别通过 `value1, value2, value3` 插入数据。\n\n####\
  \ 示例：\n\n```mysql\nmysql>insert into colortable(color1, color2, color3) values(“red”,\
  \ “blue”, “green”);\n( Output: colortable )\n```\n\n| id | color1 | color2 | color3\
  \ |\n| --- | --- | --- | --- |\n| 1 | red | blue | green |\n\n#### 解释：\n\n指定的列 `color1,\
  \ color2, color3` 将分别通过 `red, blue, green` 插入数据。\n\n## 修改表\n\n```sql\nalter table\
  \ table-name add column-name type;\n```\n\n可以使用 `alter` 命令向表中添加新列。\n\n#### 示例：\n\
  \n```mysql\nmysql>alter table colortable add color4 varchar(20);\n( Output: colortable)\n\
  ```\n\n| id | color1 | color2 | color3 | color4 |\n| --- | --- | --- | --- | ---\
  \ |\n| 1 | red | blue | green | null |\n\n#### 解释：\n\n`add color4 varchar(20)` 增加了一个名为\
  \ `color4` 的新列。\n\n从上面的表中，你可以看到新列名是 `color4`。\n\n## 更新特定数据\n\n```sql\nupdate table-name\
  \ set column-name=value where id=int;\n```\n\n可以通过 `id` 修改列中的值。\n\n#### 示例：\n\n\
  ```mysql\nmysql> update table-name set column-name=value where id=int;\n```\n\n\
  #### 解释：\n\n可以通过 `id` 修改列中的值。\n\n## 删除数据\n\n```sql\ndelete from table-name where\
  \ id=int;\n```\n\n可以使用 `delete` 命令删除某些行。\n\n#### 示例：\n\n```mysql\nmysql> delete\
  \ from colortable where id=1;\n```\n\n#### 解释：\n\n`delete from table-name where\
  \ id=int` 删除 `id` 等于 `int` 值的行。\n\n## 查询语句\n\n```sql\nselect * from table-name;\n\
  ```\n\n`select * from table-name` 选择所有列。\n\n#### 示例：\n\n```mysql\nmysql> select\
  \ * from colortable;\n```\n\n#### 解释：\n\n`select * from colortable` 显示所有列。\n\n\n\
  \n\n\n```php\n$sql=”alter table colortable modify color4 char(30)\";\n\n$query=mysqli_query(\
  \ $sql, $con);\n\nif( $query ) {\necho  “ Alter data type successfully! ”;\n}\n\
  ```\n( 输出: Alter data type successfully! )\n\n## 解释\n\n`alter table colortable modify\
  \ color4 char(30)` 将 `color4` 数据类型更改为 `char(30)`, `mysqli_query($sql, $con)` 执行查询。\n\
  \n## 获取表数据\n\n| $sql=”select column from table-name\";$query=mysqli_query( $sql,\
  \ $con); |\n| --- |\n\n`$sql=\"select column from table-name\"` 用于通过列名从表中检索表数据。\n\
  `$query=mysqli_query($sql, $con)` 执行查询。\n`$con` 是 MySQL 服务器的连接。（参见上一页）。\n\n## 示例\n\
  \n```php\n$sql=”select color1 from colortable\";\n\n$query=mysqli_query( $sql, $con);\n\
  \nif( $query ) {\necho  “ Retrieve data successfully! ”;\n}\n```\n( 输出: Retrieve\
  \ data successfully! )\n\n## 解释\n\n`select color1 from colortable` 从 `colortable`\
  \ 中通过 `color1` 获取表数据。`mysqli_query($sql, $con)` 执行查询。\n\n## mysqli_fetch_row()\n\
  \n| mysqli_fetch_row( ); |\n| --- |\n\n`mysqli_fetch_row()` 返回行的索引数组。其键始终是数字类型。例如：`[\
  \ number ] => value`。\n\n## 示例 \n\ntest_table\n\n| Name || State || City |\n| ---\
  \ | --- | --- |\n| Don || Ma || Stone |\n| Kan || Nh || Water |\n\n```php\n$sql=select\
  \ \\* from test_table;  // \\* 代表所有列\n\n$query=myslqi_query( $sql);\n\n$array=mysqli_fetch_row\
  \ ($query);\n\nprint_r($array);  // print_r( ) 用于打印数组。\n```\n( 输出: [0]=>Don [1]=>Ma\
  \ [2]=>Stone )\n\n## 解释\n\n`mysqli_fetch_row()` 返回该行的数组，其键始终是数字类型。`print_r()` 用于打印数组。\n\
  \n## mysqli_fetch_assoc()\n\n| mysqli_fetch_assoc( ); |\n| --- |\n\n`mysqli_fetch_assoc()`\
  \ 返回行的关联数组。其键始终是字符串类型。例如：`[ string ]=> value`。\n\n## 示例\n\ntest_table\n\n| Name\
  \ || State || City |\n| --- | --- | --- |\n| Don || Ma || Stone |\n| Kan || Nh ||\
  \ Water |\n\n```php\n$sql=select \\* from test_table;  // \\* 代表所有列\n\n$query=myslqi_query(\
  \ $sql);\n\n$array=mysqli_fetch_assoc ($query);\n\nprint_r($array);  // print_r(\
  \ ) 用于打印数组。\n```\n( 输出: [Name]=>Don [State]=>Ma [City]=>Stone )\n\n## 解释\n\n`mysqli_fetch_assoc()`\
  \ 返回该行的数组，其键始终是字符串类型。`print_r()` 用于打印数组。\n\n## mysqli_fetch_array()\n\n| mysqli_fetch_array(\
  \ ); |\n| --- |\n\n`mysqli_fetch_array()` 返回行的索引数组和关联数组。它们的键既是数字类型也是字符串类型。例如：`[number]=>value\
  \ [ string ]=>value`。\n\n## 示例\n\ntest_table\n\n| Name || State || City |\n| ---\
  \ | --- | --- |\n| Don || Ma || Stone |\n| Kan || Nh || Water |\n\n```php\n$sql=select\
  \ \\* from test_table;  // \\* 代表所有列\n\n$query=myslqi_query( $sql);\n\n$array=mysqli_fetch_array($query);\n\
  \nprint_r($array);  // print_r( ) 用于打印数组。\n```\n( 输出: [0] => Don [1] => State [2]\
  \ => City [Name] => Don [State] => Ma [City] => Stone )\n\n## 解释\n\n`mysqli_fetch_array()`\
  \ 返回该行的数组，其键始终都是数字类型和字符串类型。\n\n## mysqli_num_rows()\n\n| mysqli_num_rows( $query\
  \ ); |\n| --- |\n\n`mysqli_num_rows($query)` 返回 `$query` 中的总行数，该结果由 `mysqli_query()`\
  \ 生成。\n\n## 示例\n\ntest_table\n\n| Name || State || City |\n| --- | --- | --- |\n\
  | Don || Ma || Stone |\n| Kan || Nh || Water |\n\n```php\n$sql=select \\* from test_table;\
  \  // \\* 代表所有列\n\n$query=myslqi_query( $sql);\n\n$row_number=mysqli_num_rows( $query\
  \ );\n\necho $row_number;\n```\n( 输出: 2 )\n\n## 解释\n\n`mysqli_num_rows($query)`\
  \ 返回 `$query` 中的总行数，结果为 2。\n\n## mysqli_close()\n\n| mysqli_close( ); |\n| --- |\n\
  \n关闭之前打开的 MySQL 数据库连接。\n\n## 示例\n\n```php\n<?php\n$con= mysqli_connect( “host”,\
  \ “user”, “password” );\n//某些代码...\nmysqli_close($con);\n?>\n```\n\n 解释\n\n`mysqli_close($con)`\
  \ 关闭与 MySQL 服务器的 `$con` 连接。\n\n## 类与对象\n\n### 类定义\n\n类是对象的模板。\n\n```php\nclass Person\
  \ {\n  // 属性和方法\n}\n```\n\n## 实例化\n\n使用 `new` 关键字来创建类的实例。\n\n```php\n$person = new\
  \ Person();\n```\n\n## 属性\n\n属性是类中的变量。\n\n```php\nclass Person {\n  public $name;\n\
  \  public $age;\n}\n\n$person = new Person();\n$person->name = \"John\";\n```\n\n\
  ## 方法\n\n方法是类中的函数。\n\n```php\nclass Person {\n  public function sayHello() {\n \
  \   echo \"Hello!\";\n  }\n}\n\n$person = new Person();\n$person->sayHello();\n\
  ```\n\n## 构造函数\n\n构造函数是在创建对象实例时自动调用的方法。它使用 `__construct()` 定义。\n\n```php\nclass\
  \ Person {\n  public $name;\n  public function __construct($name) {\n    $this->name\
  \ = $name;\n  }\n}\n\n$person = new Person(\"John\");\n```\n\n## 继承\n\n类可以使用 `extends`\
  \ 关键字继承另一个类。这意味着子类可以使用父类的属性和方法。\n\n```php\nclass Animal {\n  public function eat()\
  \ {\n    echo \"Eating...\";\n  }\n}\n\nclass Dog extends Animal {\n  public function\
  \ bark() {\n    echo \"Barking...\";\n  }\n}\n\n$myDog = new Dog();\n$myDog->eat();\n\
  $myDog->bark();\n```\n\n## 访问修饰符\n\n访问修饰符控制属性和方法的可见性。\n\n- `public`: 属性或方法可以在任何地方被访问。\n\
  - `private`: 属性或方法仅在类内部可访问。\n- `protected`: 属性或方法可以在类内部及其子类中被访问。\n\n```php\nclass\
  \ Parent {\n  public $var1;\n  protected $var2;\n  private $var3;\n}\n```\n\n##\
  \ 静态成员\n\n静态属性和方法属于类本身，而不是类的实例。使用 `::` 运算符来访问。\n\n```php\nclass MyClass {\n  public\
  \ static $count = 0;\n  public static function increment() {\n    self::$count++;\n\
  \  }\n}\n\nMyClass::increment();\necho MyClass::$count;\n```\n\n## 常量\n\n常量是在定义后无法更改的值。使用\
  \ `const` 关键字定义。\n\n```php\nclass Config {\n  const PI = 3.14;\n}\n\necho Config::PI;\n\
  ```\n\n## 接口\n\n接口定义了类必须实现的方法 set，但不包含具体实现。使用 `implements` 关键字。\n\n```php\ninterface\
  \ Shape {\n  public function draw();\n}\n\nclass Circle implements Shape {\n  public\
  \ function draw() {\n    echo \"Drawing a circle.\";\n  }\n}\n```\n\n## 抽象类\n\n\
  抽象类是不能被实例化的类。它可以作为其他类的模板。使用 `abstract` 关键字定义。\n\n```php\nabstract class Animal {\n\
  \  abstract public function makeSound();\n  public function sleep() {\n    echo\
  \ \"Zzz...\";\n  }\n}\n\nclass Cat extends Animal {\n  public function makeSound()\
  \ {\n    echo \"Meow!\";\n  }\n}\n```\n\n\n\n\n子类的对象可以使用父类的变量和函数。\n\n#### 示例：\n\n\
  ```php\nclass animal{\n    var $head;\n    function tail( ) {…}\n}\n\nclass dog\
  \ extends animal{\n    // 子类定义\n}\n\n$d = new dog( );\n$d->$head = “big”;\n$d->tail(\
  \ );\n```\n\n#### 解释：\n\n`$d` 是一个子类对象。\n\n`$d->$head` 引用了父类的变量。\n\n`$d->tail( );`\
  \ 调用父类的函数。\n\n`Class:: method ( )`\n\n`Class` 可以使用 `::` 来引用变量或调用函数。\n\n| class-name\
  \ :: variable;class-name :: function( ); |\n| --- |\n\n#### 示例：\n\n```php\nclass\
  \ animal{\n    var head;\n    function tail( ) {…}\n}\n\nclass dog extends animal{\n\
  \    animal :: head;\n    animal :: tail( );\n}\n```\n\n#### 解释：\n\n`“animal ::\
  \ head;` 意味着在子类 `dog` 中，名为 `animal` 的类引用了父类中的变量 `head`。\n\n`“animal::tail( );` 意味着在子类\
  \ `dog` 中，名为 `animal` 的类调用了父类中的函数 `tail( )`。\n\n# 附录 1：安全提示\n\n### 什么是安全代码？\n\n\
  确保互联网上 PHP 网站的安全非常重要。来自匿名黑客的各种危险攻击。这些风险列举如下：\n\n| 名称 | 恶意行为 |\n| --- | --- |\n|\
  \ 跨站脚本 (XSS) | 窃取用户信息 |\n| 伪造表单 | 移除客户端数据 |\n| SQL 注入 | 破坏数据库数据 |\n| 远程代码注入 | 被攻击者控制\
  \ |\n| 命令注入 | 执行恶意命令 |\n| 会话固定 | 设置他人的 SID |\n| 会话劫持 | 劫持用户会话密钥 |\n| …… | …… |\n\
  \n攻击者在 HTML 表单中输入恶意代码。\n\n```html\n<input type=”password” name= “password”>\n<input\
  \ type= “text” name= “characters” /> \n<textarea name = “words” rows= size1 cols=\
  \ size2>\n```\n\n### 过滤恶意密码\n\n| ctype\\_alnum( $\\_POST\\[ “password ” \\]) |\n\
  | --- |\n`ctype\\_alnum ( )` 仅接受 a 到 z 的字符和 0 到 9 的数字，并返回 true。不要允许 `<`, `%`, `!`,\
  \ `#`, `$`, `%`, `^`, `&`, `\\*` 以及任何其他符号。\n\n#### 示例：\n\n为了过滤恶意密码，PHP 代码如下：\n\n\
  ```php\n$clean = array( );\nif ( ctype\\_alnum ( $\\_POST\\[“password”\\]))\n{\n\
  \    $clean \\[“password”\\] = $\\_POST\\[“password”\\]\n}\n```\n\n#### 解释：\n\n\
  `“$clean = array( );` 定义了一个名为 `$clean$` 的数组。\n\n`“ctype\\_alnum ( $\\_POST\\[“password”\\\
  ])” 仅允许 a 到 z 和 0 到 9，并返回 true。\n\n`“$clean \\[“password”\\]” 存储字符或数字，不包含其他符号如 `@`,\
  \ `#`, `$`, `%`, `&`, `<`, `%`, `!` ……`\n\n### 过滤恶意字符\n\n| ctype\\_alpha( $\\_POST\\\
  [ “characters” \\]) |\n| --- |\n`ctype\\_alpha( )` 仅接受 a 到 z 的字符，并返回 true。不要允许 0\
  \ 到 9 的数字以及 `<`, `%`, `!`, `#`, `$`, `%`, `^`, `&` 等任何其他符号。\n\n#### 示例：\n\n为了过滤恶意字符，PHP\
  \ 代码如下：\n\n```php\n$clean = array( );\nif ( ctype\\_alpha ( $\\_POST\\[“characters”\\\
  ]))\n{\n    $clean \\[“characters”\\] = $\\_POST\\[“characters”\\]\n}\n```\n\n####\
  \ 解释：\n\n`“$clean = array( );` 定义了一个名为 `$clean$` 的数组。\n\n`“ctype\\_alpha ( $\\_POST\\\
  [“characters”\\])” 允许 a 到 z 的字符，并返回 true。\n\n`“$clean \\[“characters”\\]” 仅存储字符，不包含数字和其他符号如\
  \ `@`, `#`, `$`, `%`, `<`, `%`, `!`\n\n### 过滤恶意输入\n\n| str\\_replace(\"ch1\", \"\
  ch2 \", $\\_POST\\[“text” ) |\n| --- |\n`str\\_replace( )` 可以将输入中的字符 `ch1` 替换为 `char2`。\n\
  \n`$\\_POST\\[text\\]` 是用户输入的文本。\n\n#### 示例：\n\n```php\n$clean = array( );\n$clean\
  \ \\[“text\\]=str\\_replace(\"malicious\", \" \", $\\_POST\\[text\\]);\n$clean \\\
  [“text\\]= str\\_replace(\"%\", \"percent\", $\\_POST\\[text\\]);\n```\n\n#### 解释：\n\
  \n`“str\\_replace(\"malicious\", \" \", $\\_POST\\[text\\]” 将 `malicious` 替换为空字符串。\n\
