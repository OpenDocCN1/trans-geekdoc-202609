  _replace(\"%\", \"percent\", $\\_POST\\[text\\])” 将 `%` 替换为 `percent`。\n\n`$clean\\\
  [“text\\]` 存储了你需要的文本。\n\n### 限制指定输入\n\n| in\\_array( $\\_POST\\[“words”], myarray\
