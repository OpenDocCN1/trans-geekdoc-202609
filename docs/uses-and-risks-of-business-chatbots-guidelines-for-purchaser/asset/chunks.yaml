- raw: '*   Fortunately we escaped a public flop like DB had to endure, see the video
    reportage by the German tabloid Bildzeitung. The brief mishap—SEMMI did start
    working perfectly after a “false start” —went viral somewhat on chat apps like
    Twitter retweeting blog posts about it, as well at RT (Russia Today) doing an
    extensive video reportage on the supposed failure, even though the footage showed
    journalists successfully communicating with the robot head after 10 minutes or
    so, in both German and English.


    *   The negative “press” pilloried the poor computer scientists employed by Deutsche
    Bahn because their creation became silent and refused to answer for a while! Not
    long, only five or ten minutes, but that was long enough to cause publicity damage
    to the new product launch in this emerging tech, which seems like an easy target
    to get a lot of hits if you write an exciting, amusing story about the innovation
    with a great deal of Schadenfreude and few facts.


    Unforeseen (positive) Consequences of Chatbot Growth


    Where the Business Insider forecast did not materialize or else did not predict
    the evolution:


    *   Oracle market researchers, McKinsey consultants, BI analysts, and the U.S.
    Department officials did not see that chatbots would be morphing into (a) IVAs,
    now known as AI-powered bots or AI bots


    *   That IVAs would be further developed into voice-based bots


    *   And that companies with agile proprietary algorithms like mine would end up
    pivoting from 2D chatbot production to 3D cognitive avatars, thereby challenging
    the two main U.S. tech giants in this space, Google and Amazon, with Mixed Reality
    AI bots like holograms and AR integrating chatbots or IVAs


    *   That challengers to the tech giants, upstarts as they are called, would also
    be more agile and able to customize the various personalized user interfaces


    *   A new term would come into its own: Cognitive Interfaces would be the next-gen
    chatbots leaving the 2D static rule-based earlier versions somewhat behind.


    *   Consequently, legacy pioneers like Nuance Communications, Pandora Chatbots,
    and Chatfuel, not to mention a plethora of thousands of bot developers who can
    “only” create 2D online chatbots


    *   Proprietary algorithms rather than open source and bot platforms with APIs
    would lead this cutting edge of the experience economy run by voice or speech
    recognition; indeed a new term has entered the lexicon, CxO or Customer Experience
    Officer! The overarching executive who makes sure the customer is experiencing
    the product or service in the best, most enjoyable, and memorable way.


    The Biggest Risks of Voice Bots (Chatbots With Speech Recognition)


    1.  Can be hacked leading to people as well as their vehicles being manipulated
    via IoT technology. See the frequently cited lack of cybersecurity in smart appliances
    and toys, which the German government was one of the first to legislate for enforcing
    better industrial design and above all cybersecurity from the manufacturers.


    2.  Can be transcribed and listened in to as Amazon and Google have been “caught”
    listening to their customers, with Der Spiegel and other media revealing that
    both tech giants have illegally stored and analyzed data or conversations that
    were not meant to be heard let alone archived and analyzed.


    3.  Particularly insidious is that even music can contain hacker messages to the
    IoT devices to give instructions unheard by the user, for example, transfer money,
    open doors, and garages and give info.


    4.  Voice impersonators with people’s voices imitated or in fact stolen; this
    has already led to this new type of stolen “digital password” stored in rogue
    countries in voice banks, after fraudsters have hacked into an IoT home or infrastructure
    deployment.


    Nevertheless, Ivy League researchers who looked into psychology and Internet users’
    well-being have spoken out that the devices are creating addiction due to people
    retreating into solitude with them and their online interaction only. In a Yale
    University dialogue recorded for the Coursera MOOC course on “The Science of Well-Being”
    by Professor Dr Laurie Santos of Yale’s Psychology Faculty, she interviews Professor
    Nicholas Epley of the University of Chicago Booth School of Business.[14](#Introduction.xhtml#footnote-005)
    Epley unexpectedly suggests that adding voice to all our devices would alleviate
    this antisocial phenomenon. Applied to his “real life experiments on Chicago commuter
    trains,” it could force smartphone and tablet users to begin interacting again
    socially by using their own voices and hearing the voice of others.[15](#Introduction.xhtml#footnote-004)
    An extension of Epley’s insight, I think is that the voice added to the device
    could be botified or human in order to bring about a global, revolutionary and
    fundamentally healthy use of the Internet manifested in its social media form
    and smartphone connectivity.


    Overarching Risks of AI Bot Technologies


    *   There is a risk and danger of being overwhelmed by too many choices. See the
    plethora and abundance of search results when you use just a few keywords like
    “chatbots” or “Intelligent Virtual Assistant.”


    *   However, so many independent bot developers without provenance could mean
    trouble—who is behind the code, is it robust against hackers, has it been partly
    programmed by hackers with “doors” they can open at a later date? Is malware hidden
    inside your bot?


    *   As the EU Department for Competition has already started fining, there is
    a risk of seeming cartels leaving the field of enterprise solutions to just a
    few players like Google, Amazon, Samsung, Apple, Microsoft, and IBM. If there
    is a lack of voice-based BaaS at a sophisticated level, then only this small group
    will control the pricing and also control the services available at what conditions.
    This clearly is not an issue for the 2D chatbot scene or the less advanced IVAs.


    *   Look at how the Facebook monopoly over Messenger bots caused chatbot entrepreneurs
    to go out of business during the Cambridge Analytica expose. We lost a big client
    in Munich as we could not access the demo bot we had prepared for the contract
    signing. I discuss this in Case Study #10 in this book. Monopolies like Amazon
    and eBay mean they can cut off satellite businesses without much reproof or redress.


    *   Privacy and data protection, which I will go into detail in the section on
    the GDPR.


    *   Poor coding that allows infiltration and manipulation with offensive libelous
    speech and publishing.


    *   Lack of enforcement for breaches of these software standards, no uniform legislation.


    *   See my VentureBeat articles[16](#Introduction.xhtml#footnote-003) from 2016,
    which foreshadow core issues that are now magnified in the year 2020:


    1.  Hate speech has given rise to the Far Right, racism, red baiting as a type
    of uncensored “Reddit war” on liberal intellectuals; as [Chapter 2](#02_Chapter_2.xhtml)
    examines, reactionary policies are reinforced with armies of chatbots spamming
    social media accounts (pro-Trump bots, for instance). My post on Microsoft Tay’s
    Hate Speech is still being read today on VB; I discuss this case study in depth
    in the next chapter.[17](#Introduction.xhtml#footnote-002)


    2.  Fringe views of the Far Left and the Far Right, not to mention of terrorists,
    can be disseminated more rapidly with Twitter bots. Political entities like Russians
    and North Korean propaganda campaigns are utilizing them; China has been accused
    of the same re. State-run censorship, surveillance, and intimidation.


    3.  See my VentureBeat post on the “Swiss chatbot arrest,” so on the issues of
    control and ownership as well as liability for what a bot says and does.[18](#Introduction.xhtml#footnote-001)


    4.  As I discuss later in this book, the “provenance” of advanced bots versus
    simple bots is crucial to performance as well as cybersecurity. When they truly
    interact and learn as AI should through conversations with human, then that is
    the reason why bots are disruptive.'
  fmt: "\n## 正文\n\n幸运的是，我们避免了像德国铁路（DB）那样遭遇公开的惨败，详见德国小报《图片报》的视频报道。这一短暂的失误——`SEMMI`\
    \ 在“错误启动”后确实开始完美运行——在聊天应用（如 Twitter 转发相关博文）以及 `RT`（俄罗斯今日电视台）的大量视频报道中某种程度上“病毒式”传播，尽管视频显示记者在\
    \ 10 分钟左右后成功用德语和英语与机器人头部进行了交流。\n\n负面“舆论”将受雇于德国铁路的可怜计算机科学家钉在了耻辱柱上，因为他们的作品一度沉默不语、拒绝回答！时间不长，仅五到十分钟，但这足以给这项新兴技术的新产品发布造成声誉损害，这似乎成了一个容易的靶子——如果你写一个关于创新的激动人心、令人发笑的故事，夹杂大量的幸灾乐祸和极少的事实，就能获得大量点击。\n\
    \n## 未预见的（积极）聊天机器人增长后果\n\n《商业内幕》的预测未能实现，或者未能预测到的演变方向：\n\n*   甲骨文市场研究人员、麦肯锡顾问、商业智能分析师和美国政府官员没有预见到聊天机器人会演变为\
    \ **IVA**（智能虚拟助手），即现在所谓的 AI 驱动机器人或 AI 机器人\n*   IVA 会进一步发展为基于语音的机器人\n*   像我这样拥有敏捷专有算法的公司，最终会从\
    \ 2D 聊天机器人生产转型为 3D 认知化身，从而通过混合现实 AI 机器人（如全息图和集成聊天机器人或 IVA 的 AR）向该领域的两大美国科技巨头 **Google**\
    \ 和 **Amazon** 发起挑战\n*   向科技巨头发起挑战的“后来者”也将更加敏捷，能够定制各种个性化用户界面\n*   一个新术语应运而生：**认知界面**\
    \ 将成为下一代聊天机器人，使早期的 2D 静态基于规则的版本略显落后\n*   因此，像 **Nuance Communications**、**Pandora\
    \ Chatbots** 和 **Chatfuel** 这样的传统先驱，更不用说成千上万“只能”创建 2D 在线聊天机器人的机器人开发者\n*   专有算法而非开源及带有\
    \ API 的机器人平台，将引领这个由语音或语音识别驱动的体验经济前沿；确实，一个新术语已进入词汇表：**CxO**（首席体验官）！这位统筹高管确保客户以最佳、最愉快、最难忘的方式体验产品或服务\n\
    \n## 语音机器人（带语音识别的聊天机器人）的最大风险\n\n1.  **可能被黑客攻击**，导致人员及其车辆通过物联网技术被操控。请参阅智能家电和玩具中常被引用的网络安全缺失，德国政府是最早立法强制制造商改进工业设计、尤其是加强网络安全的国家之一\n\
    2.  **可能被转录和窃听**，因为 **Amazon** 和 **Google** 曾被“抓包”偷听客户，《明镜周刊》等媒体披露，两大科技巨头非法存储和分析了本不该被听到、更不用说被存档和分析的数据或对话\n\
    3.  **特别隐蔽的是**，即使是音乐也可能包含发给物联网设备的黑客指令，用户听不到这些指令，例如：转账、开门、开车库门和泄露信息\n4.  **声音模仿者**\
    \ 模仿或窃取他人声音；这已导致一种新型被盗“数字密码”存储在流氓国家的声纹库中，这是骗子黑入物联网家庭或基础设施部署后的结果\n\n尽管如此，研究心理学和互联网用户福祉的常春藤盟校研究人员已发声称，这些设备正因人们退缩到与它们独处、仅进行在线互动而制造成瘾。在为\
    \ Coursera 慕课课程《幸福科学》录制的耶鲁大学对话中，耶鲁心理学院 **Laurie Santos** 教授采访了芝加哥大学布斯商学院 **Nicholas\
    \ Epley** 教授。Epley 出人意料地建议，给所有设备添加语音功能将缓解这种反社会现象。应用到他在“芝加哥通勤列车上的真实实验”中，这能迫使智能手机和平板电脑用户通过使用自己的声音和聆听他人的声音，重新开始社交互动。我认为，Epley\
    \ 洞察的延伸是：添加到设备上的语音可以是机器人化的，也可以是人类的，从而带来互联网在社交媒体形式和智能手机连接中全球性的、革命性的、根本健康的使用。\n\n\
    ## AI 机器人技术的总体风险\n\n*   **面临选择过多而不知所措的风险和危险**。请看当你仅使用“聊天机器人”或“智能虚拟助手”等几个关键词搜索时，出现的大量搜索结果\n\
    *   **然而，如此多缺乏渊源的独立机器人开发者可能意味着麻烦**——代码背后是谁？它能抵御黑客吗？是否部分由黑客编程，留有他们日后可打开的“后门”？你的机器人里藏有恶意软件吗？\n\
    *   **正如欧盟竞争部门已开始罚款的那样**，存在看似卡特尔将企业级解决方案领域仅留给 **Google**、**Amazon**、**Samsung**、**Apple**、**Microsoft**\
    \ 和 **IBM** 等寥寥几家巨头的风险。如果缺乏高水平的基于语音的 **BaaS**（机器人即服务），那么只有这小群体将控制定价，也将控制可用服务及其条件。这显然不是\
    \ 2D 聊天机器人领域或不太先进的 IVA 面临的问题\n*   **看看 Facebook 对 Messenger 机器人的垄断**，在剑桥分析公司丑闻曝光期间，如何导致聊天机器人创业者倒闭。我们失去了慕尼黑的一个大客户，因为我们无法访问为签约准备的演示机器人。我在本书\
    \ **案例研究 #10** 中讨论了这一点。**Amazon** 和 **eBay** 等垄断者意味着它们可以在几乎无需负责或补救的情况下切断卫星业务\n\
    *   **隐私和数据保护**，我将在 **GDPR**（通用数据保护条例）一节中详述\n*   **编码粗劣**，允许渗透和操控，发布冒犯性诽谤言论\n\
    *   **缺乏对违反这些软件标准行为的执法，没有统一立法**\n*   **请参阅我的 VentureBeat 文章**，这些 2016 年的文章预示了如今在\
    \ 2020 年被放大的核心问题：\n\n    1.  **仇恨言论助长了极右翼、种族主义、红色诱饵**，成为一种未经审查的“Reddit 战争”，攻击自由派知识分子；正如\
    \ **第 2 章** 所探讨的，反动政策通过机器人大军垃圾邮件轰炸社交媒体账号得到强化（例如亲特朗普机器人）。我关于 **Microsoft Tay**\
    \ 仇恨言论的帖子至今仍在 VB 上被阅读；我在下一章深入讨论此案例\n    2.  **极左和极右的边缘观点**，更不用说恐怖分子的观点，可以通过 Twitter\
    \ 机器人更快地传播。**俄罗斯** 和 **朝鲜** 等政治实体正在利用它们进行宣传活动；**中国** 也被指控利用国家运营的审查、监控和恐吓做同样的事\n\
    \    3.  **请看我的 VentureBeat 帖子“瑞士聊天机器人逮捕案”**，涉及控制权、所有权以及机器人言行的法律责任问题\n    4. \
    \ **正如我稍后在书中讨论的**，**“渊源”**（先进机器人与简单机器人的对比）对性能和网络安全至关重要。当它们真正像 AI 应该做的那样，通过与人类对话进行交互和学习时，那才是机器人具有颠覆性的原因\n"
