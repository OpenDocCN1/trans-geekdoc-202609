- raw: 'Immersive Reality, see Mixed Reality


    Industrie 4.0


    This term originated in Germany in the early 2000s. It denotes the 4th Industrial
    Revolution and is a concept referred to outside of Germany as the next industrial
    revolution, post industrial and the Digital Age or Age of Convergence.


    A lot of German government policies about growth and economic planning were focused
    on Industrie 4.0 which has also come to be known as Digitalisierung or digitization
    (see the definition in this glossary).


    Even in 2019 there is a widespread fear that German businesses, especially SMEs,
    are not using digital technologies optimally, whether it is the cloud and Software
    as a Service or simply marketing adequately online with social media and integrated
    marketing campaigns that leverage the web.


    Industrie 5.0 is thus focused on Digitalisierung, Artificial Intelligence and
    moving toward Quantum computing which is one of Germany’s strengths in Informatik
    or Information Technology.


    Intelligent Virtual Assistants, IVAs. Also known as chatbots and bots, Virtual
    Assistants


    Intelligent Virtual Assistants as many Americans in the field like to term them,
    are the Next Gen chatbots. They have moved on from manually coded chatbots that
    relied on fairly basic Natural Language Processing, as was the case from the 1950s
    to the early 2000s.


    Then we began to see the beginnings of Conversational AI and cleverer bots with
    improved Natural Language Understanding. The smarter Virtual Assistants or chatbots
    were part of the bot Hype Cycle as defined by the analyst firm Gartner, where
    after Mark Zuckerberg announcing notification was the future as did Microsoft’s
    Satya Nadella, the investment boom and Use Cases flourished. This financial rush
    really only happened in the Silicon Valley and less so in Europe.


    The defining element distinguishing a standard basic chatbot and AI bots is Emotional
    Intelligence (EI). Or a more complex form of communicating as I describe in my
    VentureBeat article from 2016 “Why Chatbots are so disruptive.”[1](#07_Glossory_7.xhtml#footnote-076)
    EI applied to advanced chatbots means that they can not only imitate humans to
    convince users they are not talking to a machine, they can also surprise them
    by showing intuition or emotional qualities like kindness and empathy.


    In this higher level or better performing stage of AI bots, the human machine
    interaction provides a satisfying experience. The user may realize that they are
    talking with a machine but they have moments that they think the bot could be
    almost human like or humanoid. The classic Turing Test goal for all bot developers!


    Iterations


    This means the latest version of the bot in development. It can also mean a clone
    or new interpretation of a bot brain. So based on the foundation character or
    personality of the avatar, the developers then release a similar bot but with
    newer content or quite different character. However, some of the original content
    is still the basis of the chatbot.


    Machine Learning, also Deep Learning and Neural Networks


    Has now replaced Neural Networks as the term of choice that signifies source code
    that is able to learn from its mistakes and gradually improve its knowledge base
    on its own. Abbreviated in tech circles as ML, it is forming the foundation of
    much of data mining these days which is also called Deep Learning when the algorithm
    is able to self-correct.


    Machine Learning is being applied to biotech for better diagnoses of medical conditions,
    as well as green tech for crunching numbers and providing advice. Similarly, fintech
    has long used Deep Learning and the legacy codes are now being rejuvenated or
    replaced with AI which means in this instance Machine Learning.


    Mixed Reality, Mixed Reality Installations or Experiences, also Immersive Reality,
    including Augmented Reality (AR) and Virtual Reality (VR)


    This is a term referring to a mixture of media forms such as holograms, robots,
    Virtual Reality and Augmented Reality. It is a catch all term that also indicates
    usually speech recognition in the MR mix, so the hybrid tech is voice based. My
    company is now specializing in bespoke holograms with multimedia elements that
    can include VR experiences. We can also integrate our chatbot algorithm into some
    Augmented Reality algorithms that allow integration. That then becomes the Mixed
    Reality experience which will be key for the upcoming Experience Economy.


    Virtual Reality is generally defined as people wearing special glasses that give
    them the 3D experience that is very intense spatially and in most sensory ways
    even including smell with some applications. Very few applications work without
    the eyewear to alter human’s perceptions of what they are seeing.


    Critics have pointed to the induced nausea of these experiences while fans say
    VR can even have healing powers to cure affected users of PTSD and phobias by
    showing them the feared images and making them relive the traumatic or feared
    experience. VR is widely used commercially to promote travel and tourism deals
    and of course in gaming or computer games.


    Augmented Reality is the opposite and rarely requires special glasses or eyewear
    to make the AR experience work. It most commonly works by the user holding up
    a tablet or smartphone over a surface which then “pops up” as a 3D video or film
    of what the experience has been designed for.


    AR apps have most frequently used by the travel and tourism sector to promote
    sightseeing spectacles or car manufactures that show the latest model with the
    chosen color, tires or features in the extended 3D virtual image.


    Natural Language Processing (NLP) or Natural Language Understanding (NLU)


    This is a type of basic programming of the more simplistic chatbots, nearly all
    2D avatars operating online. The early ones were live on websites only. Then with
    the advent of Instant Messaging platforms, a new breed of NLP chatbots were developed
    for those mediums. So the avatars were able to IM or chat with users via the apps
    that allowed botification, that is, chatbot integration.


    NLU claims to be a more complex rendering of the legacy NLP language processing
    to enable these 2D chatbots to demonstrate more comprehension and sentiment. They
    are not however to be classified as Cognitive Interfaces nor Conversational AI.
    They can be categorized as successful legacy examples of Conversational Commerce
    before the rise of Mixed Reality installations with botified interfaces like 3D
    AI holograms.


    Speech Recognition, ASR or Voice tech, see Voice


    Three dimensional interfaces, 3D AI bots


    This is the cutting edge. So far only my company is doing it for 3D holograms
    that interact. There are many pilots at trade shows, most of them are recordings
    and you can converse with them. There have been a few interactive attempts but
    none have made it to market. Deutsche Bahn for robot heads as Wayfinder and timetable
    info. Pepper robots and other robots in Japan, South Korea and China for retail
    deployments.


    See also “Cognitive Interfaces” for 3D bots.


    Two dimensional bots, 2D bots or Instant Messaging interfaces, see Intelligent
    Virtual Assistants (IVAs)


    UX, User Experience, see CX Customer Experience


    Virtual Assistants, see IVAs or Intelligent Virtual Assistants


    Virtual Reality, see Mixed Reality


    Voice, voice-based, also Speech Recognition (ASR)


    We are now seeing chatbot conferences replaced by voice tech summits. This means
    that more bot developers are seeing the advantages of literally “plugging in”
    a voice to give their avatar more personality, much like making it animated instead
    of just two dimensional and static. Not all voice bots are the same though. You
    may interact with a basic NLP chatbot that has been given voice. This means it
    is using speech recognition software to understand what you are saying to it,
    then “parsing” the reply back to you as speech instead of its usual text messages.'
