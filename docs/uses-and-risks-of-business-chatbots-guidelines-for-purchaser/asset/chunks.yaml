    # 我为肯特大学就业能力积分实习生撰写的案例研究


    我为肯特大学就业能力积分实习生撰写的案例研究，是探讨这款定制版 Messenger 聊天机器人在欧洲进行政治部署所带来影响的第一步。该 2D 聊天机器人的职责是“迎接”访问该页面的访客。它相当成功地完成了这一任务，尽管我记得与它的对话测试了它的局限性。例如，在打过招呼、说声欢迎后，它便直接进入政策推荐和新闻快讯环节。到目前为止一切顺利，但对于一个所谓“自发”的、机器人与人类之间实时的有机对话来说，这可能会显得重复。


    尽管如此，这款小型 NLP 聊天机器人尽管存在内容和对话上的局限，却成为了工党党员人数激增至创纪录数字（增加了数十万）的巨大推动因素。当然，很大一部分归功于一个名为“动力”的左翼青年运动以及英国工会运动的面对面竞选活动。但在英国历史这一选举时期，迄今为止被忽视的是，这款定制版
    Messenger 机器人是如何增加其 Facebook 页面粉丝数量的。


    我无法获取那些具体统计数据，但在选举活动期间的几个月里，我通过多次使用他们的 Facebook 页面亲眼目睹了粉丝数量的增长。这纯粹源于职业好奇心，想看看这款勇敢的
    NLP 聊天机器人在激烈的政治争议中，作为一款 Messenger 机器人表现如何。聊天机器人历史上另一个被忽视且代表巨大伦理争议的事实是：工党支持者和/或党员在
    Facebook 上复制了这款“英国玫瑰”Logo 头像。随后，他们将这款 2D 聊天机器人部署在一个约会网站上，没有 Logo 或头像，仅使用大量真实人名，正如我将在下文所述。


    争议在于：


    1.  这款聊天机器人采用了各种人设，或使用了作为工党成员/支持者的真实人员的姓名。

    2.  拥有真实人名的这款聊天机器人的各种人格，被赋予了各种不同的个人地址和邮政编码。为什么？

    3.  因为这种约会部署是一种高度战略性、创新性的竞选方法，旨在赢得摇摆选民。如何做到的？

    4.  工党头像的各种克隆体被部署在工党可能从保守党手中赢得边缘席位的摇摆选区或城镇/地区。它们虚构的地址使它们能够联系到该约会应用上“寻找爱情”的单身男女。

    5.  问题在哪里？问题在于这些孤独的（人类）真心并不知道他们正在被一个聊天机器人联系，更不知道这是一个经过政治改造的 2D 机器人，其唯一目的就是影响他们在这场激烈竞争的大选中的特定投票。

    6.  这款克隆的、多重人格的工党机器人是如何做到的？它向约会网站上的人类目标发送自动短信，用口语化、非正式且极具说服力的英语“方言”或俚语询问：“亲爱的，你今天打算投给谁？我投工党！”以及类似的信息。

    7.  这款具有政治动机、拥有众多 ID（显然患有严重的多重人格障碍）的聊天机器人在约会网站上实施的“致命部署”或约会短信，是在投票前一天发出的。“别忘了去投票哦，亲爱的！”以及类似的话语。


    我们不知道或没有该机器人短信对人类孤独之心的成功率或转化率的实际指标。我只能说，机器人管理者承担伦理和法律风险实施此举，显然是值得的！


    因为直到今天仍没有关于这一事件的正式案例研究，所以我让我忙碌的两周项目实习生们如果有空去调查一下。我们发现，据称无意中托管了这一任性行为的约会网站公司当时发布了一份在线新闻稿，发表了公开声明。


    他们遗憾地表示，他们的用户被工党支持者这样利用了。他们正在调查该事件并将采取行动。我认为他们从未真正采取过行动。工党自然与整个“机器人化”的在线恶作剧划清界限，声称这不是党中央、行政人员或党员所为，只是一些粉丝因渴望工党获胜而在网上冲动行事。


    ---


    # 第三章：最佳实践用例与最坏案例场景


    ## 通过“它不是什么”来定义认知界面：“日本全息女友”


    我为 2017 年秋季学期剑桥贾奇商学院的一大批 MBA 学生和教职员工创建了这个案例研究。我不会在本书中重复该案例研究，因为它作为播客免费在线提供，可在
    YouTube 上观看，并配有 SWAY PowerPoint 的视觉资料。[¹] 分析的核心在于：Gatebox 在日本创建的交互式全息投影**不是**认知界面。它不会成长或学习。它是一个优秀的、高质量的动画
    3D 头像。


    迄今为止，“全息女友”曾被部署在一个小型半透明圆柱体中供 B2C 使用或大众消费，主要使用日语，尽管其英文版在美国也有一定采用率。然而，盒子里包含的个性**不是**
    AI 机器人全息投影，因为它运行在循环或重复内容上。它不会从主人或与人类的互动中学习以扩展其技能库。


    话虽如此，它作为一个独立的 3D 全息投影，满足特定细分市场需求的表现是非凡的。其最佳创新——并因迅速被东京一家大公司并购而获得回报——是“全息女友”作为家庭环境中物联网设备的成功，它连接到主人的家电，并能通过智能手机给他发短信，一个以
    2D 副本形式与主人沟通的 3D NLP 聊天机器人。


    另写一本书来按大洲审视聊天机器人历史可能是个好主题，例如非洲、亚洲、印度、澳大利亚[²]、美洲[³]。我们收到过来自南美的 RFP（提案请求），并注意到那里最流行的即时通讯应用是
    Telegram，上面也运行着成千上万个用于各种用例的交互式基础 NLP 聊天机器人。


    我不断偶然发现日本、韩国、中国、印度尼西亚、马来西亚和新加坡的聊天机器人，更别提印度市场上涌现的成千上万个。许多已经存在了几十年，比如这家成立于 1990
    年代初的韩国 AI 公司，通过即时通讯平台提供 2D 聊天机器人应用的企业用例。[⁴]


    ## 八大行业垂直领域用例


    为我们的营销宣传资料，我的公司 AI BaaS 定义了以下用例：


    1.  **导览与资讯娱乐**——用于商场、机场、火车站和体育场馆，包括在用户与现场 3D 多媒体格式的 velmai AI 机器人全息头像聊天期间，针对“想知道”用户的赞助营销定向投放。

    2.  **会议与贸易展**——见 Portia 实验。当你可以派遣一个定制的 3D 全息头像代替员工时，可节省时间、金钱和精力！她在 AMLD 向 AI
    专家发表演讲并回答现场提问。随后全息投影可安装在活动现场，进行进一步的一对一互动。

    3.  **旅游向导与酒店礼宾**——类似于用例 1，但内容更定制化，解答酒店客人常见问题并实现目的地营销目标。

    4.  **大学校园**——用于安保和课程表查询，实时掌握教室变动。3D 形象是大学的吉祥物，我们可以授权学生团队访问，即他们可通过 CRM 上传新信息。2D
    副本可通过大学和学生社团的社交媒体页面传播这些信息。我们还受邀开发一款用于校园心理支持的学生福利机器人。


    [¹]: [03_Chapter_3.xhtml#footnote-060]

    [²]: [03_Chapter_3.xhtml#footnote-059]

    [³]: [03_Chapter_3.xhtml#footnote-058]

    [⁴]: [03_Chapter_3.xhtml#footnote-057]


