- raw: 'My company was one of only 12 startups nationally to be invited. This meant
    we had a stand to speak with attendees during the intervals and lunch break of
    the one day seminar on AI in the technology park. Of the dozens of industry people
    I spoke with, this university came to us about a bespoke application. The Faculty
    Head of Engineering approached our stand. We brainstormed the use case specific
    to his wishes—to increase the number of girls and pupils from minority backgrounds
    applying to get into his university and STEM subjects. We later visited the campus
    in the UK. This is what resulted.


    Estimate for the University Use Case for Related Verticals (for Example, Psychology
    and Accommodation)


    In order to write this complex estimate in response to their RFP, we had to send
    our UK sales agent to a large meeting of the heads of staff and departments. Around
    eight people from the client side attended, just one from our side. It was to
    coordinate complex uses of the chatbot in 2D form and 3D form. As mentioned earlier,
    they want to see a secondary school adoption of their 2D chatbot so that it could
    “go out as an Ambassador” to graduating pupils and convince them to enroll in
    a STEM subject at their university. A way of casting the net wide to attract the
    best and most suitable first year students.


    Once there, they wanted these first years to be greeted by the 3D avatar of the
    2D “outreach” bespoke bot. Obviously branded by the university with a cosponsor
    from industry in order to finance the mixed reality bot build. The Facebook Messenger
    chatbot build will only cost them ca £10,000. But to scale it up as 3D Wayfinder
    on campus, they are looking at a minimum of £100,000 investment for up to five
    years.


    A specific design request was—similar to the Australian RFP—for the students to
    be able to learn from the active 2D and 3D bots. So they will need a CRM (Customer
    Relationship Management) system as an easy to use, intuitive software in the cloud
    to allow any number of students access to the content management system (CMS)
    built within the CRM. That way the students will actively participate in shaping
    the growing bot brain and be able to update it with new content, for example,
    student-run events that week or semester.


    More importantly for the university administrators, this easy access CMS and CRM
    would upskill their students in a real-life commercial situation: the university
    botifying its student contact and customizing the content of the human–machine
    interaction on a day-to-day basis. The students could be responsible for:


    *   Managing sponsors and sponsorship requests;


    *   Analyzing, vetting, and vetoing any brand they thought inappropriate;


    *   That could be, for instance, alcohol or tobacco companies, large franchises
    instead of a local SME service, for example, a coffee shop or banning companies
    that do not have any green or clean tech credentials from promoting themselves
    via the 2D and 3D bots on campus and off.


    The staff were really excited about all the potential tasks, functionalities,
    and features this University Ambassador 3D avatar with its 2D replica could carry
    out. They brainstormed with our sales rep during a three-hour meeting the following
    variations of the main use case:


    *   It could recruit female pupils and ethnic minority students by showing them,
    while still at school, short videos of “role models” or university students like
    them who had “made it” and decided for a career in STEM industries. Lack of role
    models was identified as one of the biggest obstacles in persuading hesitant schoolleavers
    who weren’t confident about going to tertiary education, let alone embarking on
    what was perceived to a difficult degree pathway.


    *   Once on campus, the 2D and 3D hologram bots could be a friend and “familiar
    face,” assisting them with student welfare questions such as feeling overwhelmed
    or giving them pep talks and coaching advice on how best to manage their time,
    get their coursework done, assignments and tutorials. Part of its memory or infotainment
    would be their specific timetable that could be customized to the individual student
    user.


    *   If the student became more seriously worried about being at university, the
    24/7 bot could “catch them” before they fell into depression, anxiety, or worse.[2](#04_Chapter_4.xhtml#footnote-062)
    With their permission, the ever present chatbot on their smartphone could encourage
    them to get professional help like an appointment with a counselor or careers
    adviser on campus.[3](#04_Chapter_4.xhtml#footnote-061)


    *   Meanwhile the 3D AI bot holograms as Wayfinder on campus could be actual security
    guards when most universities are struggling with budgets and unable to afford
    much-needed 24-hour security personnel. See the discussion of the Smart City Wayfinder
    in [Chapter 2](#02_Chapter_2.xhtml) for details on how this security functionality
    can work.


    *   The university admissions and accommodation managers were present at the meeting.
    They were excited about all the rote and routine Frequently Asked Questions being
    taken off their hands. A lot of their time was spent daily in replying to the
    same questions with the same answers thousands of times a week. Over and over
    each semester, each year. A big productivity killer!


    *   And they immediately grasped the levels of efficiency and accuracy that could
    be reached for these routine Questions and Answers, for example, “are there any
    rooms left in Accommodation X, Y, Z?” “How much does it cost per semester?” “Is
    there a bond?” “When can I give notice?” “Is there a kitchen/shared bathroom/guest
    room?” “When will you send me confirmation of my enrolment?” “How can I quit a
    subject/end my enrolment/defer a subject?”


    *   The Engineering Faculty was particularly happy because they wanted their students
    to use the CRM to understand the commercialization process of new technologies,
    even if they could not participate in programming it.


    *   NB. We also had the same request from the Australian university for their
    Computer Science students to contribute to our source code. That is not possible
    because it is our intellectual property that is not open source, that is, can
    be contributed to by anybody outside of our company. Our proprietary algorithm
    is kept a trade secret for purposes of privacy, provenance, and valuation, in
    particular because we do not want to open up the quality of our code to poor programming
    and thus enable hacking or cybersecurity risks to our IP.


    Roll-Out 2020


    At this stage, we anticipate a roll-out in 2020. It is the usual story: the internal
    advocates love it. Then all the stakeholders in endless number of silos within
    the university organization prefer to take the attitude “when in doubt, don’t.”
    The “do or die” sense of urgency simply is not there to progress the negotiations
    to a final contract stage within a two- to four-year period from the point of
    the initial contact at the trade exhibition in Cambridge to the execution.


    We have an estimate that has sign off in principle. They are just waiting on a
    way to find funding for the project. Given the massive uncertainty of Brexit and
    all the delays and uncertainty, we have lost nearly three years in waiting for
    this use case to be realized. And then they will still be the first university
    in the world to put 3D AI bot Wayfinder on campus, unless our Australian and Singaporean
    clients beat them to it!


    For Your Information: our Asia Pac clients are also experiencing financing delays.
    Being an external contractor, there is only so much pressure we can put on them
    for confirmation of the order, prepayment, and a start date. We can only provide
    them with the information they need to put in to their grant awarding bodies.'
