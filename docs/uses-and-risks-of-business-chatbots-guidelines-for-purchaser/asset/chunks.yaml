    7.  Marketing avatars, for example at banks, insurance companies, and other services
    that have cut back on sales and reception staff. But as the first point of contact
    for clients, business partners, and suppliers, a 3D AI bot hologram on site is
    a 24/7 ambassador that can bring the IoT of the firm and the essential info together
    in “one brain.”


    8.  Education generally: we have had many RFPs for tutor bots, for example, at
    MOOCs.


    RFP Case Studies for “Dos & Don’ts”: Hypotheticals Based on True Events


    Case Study #5: Diplomatic Mission’s Facebook Page and Messenger 2D Chatbot


    This deal came about after a call from or to the Deputy Ambassador of an Embassy
    in London (I can’t recall how this RFP was initiated exactly). They wanted us
    to solve a political, technical, and social problem. Curiously, it was to do with
    Brexit and populism.


    Without giving too many details, we can say that this entity ran a Facebook page
    that had thousands of fans visiting it regularly. At the time we drew up our proposal,
    there were 4 or 5,000 fans or followers on the FB page). Sadly, that number included
    numerous trolls and a few very aggressive Brexiteers who saw a conspiracy in everything.


    So our task was to build a Facebook Messenger bot tailored to the mission statement
    and purpose of the page. It was to meet and greet the visitors in real time, for
    example, “Hi Thanks for visiting our FB page. How are you? Can I help you with
    information?” And then a tree structure with “pick your answers” that would graduate
    to a free form or unstructured response of the bespoke bot replying “naturally”
    to the spontaneous comment or question.


    The main task, however, was for the bot to solve the problem of constant, random
    trolling of the site. The challenge was for it to identify abusive language and
    give automated warnings 24/7. The idea was to take the heat out of the escalating
    “discussions” among the “fans” of this FB page by having a calming, neutral, and
    “diplomatic” bot take care of basic communications without being provoked, angered,
    or upset by any personal attacks or verbal abuse by the visiting, “hostile” Facebook
    users.


    It would have been the perfect case study to show how even a basic messenger bot
    could defuse hate speech online especially on Facebook, which is notoriously slow
    to remove offensive comments. Despite the platform making billions in profit a
    year in every corner of the globe, Facebook remains unable to deal with or police
    the nasty perpetrators of bullying and trolling.


    Again, almost de rigor, we were about to start building this bot after it got
    sign off from all the stakeholders. Then Brexit took a bad turn and it was evident
    that those involved would have to change their policy and wind up this Facebook
    page as an “outreach” or PR project in the UK. The client could not justify the
    budget of £10,000 for the final 12 months of this online campaign before they
    were obliged to wrap it up, due to political changes and social pressures regarding
    the viability of running the project amid the furor of populist beliefs, unproductive
    negotiations, and the British public’s escalating anger or frustration, as is
    the case now on the October 5, 2019, a matter of weeks before the Brexit Deal—or
    not.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c3fig1.JPG)


    Figure 3.1 © Cliff Lee, CCO from velmai Ltd. “Albert the Online Butler” (an iteration
    of Batman’s butler Alfred) was the prototype that attracted the attention of this
    client in London. Albert was also voted the best innovation at the London Digital
    Travel Summit in 2017. [https://youtube.com/watch?v=6coVEQzE27A](https://www.youtube.com/watch?v=6coVEQzE27A)[](https://www.youtube.com/watch?v=6coVEQzE27A)


    Our chatbot company had invested time in face-to-face meetings and PowerPoints
    tailored to the goals and objectives of the job. The 10K was not the decisive
    factor for us, obviously a first mover client of this stature would have been
    a boon beyond the initial revenues! I later turned this proposal or request for
    a proposal (RFP) into a live case study for my Masters of Science students at
    an international business school in the south of France.


    The challenge was to revive the project with other branches of this diplomatic
    envoy and organization in other countries. The course was on “Negotiations and
    the Use of CRMs.” It turned out to be a very productive use of the students’ imaginative
    ability to put themselves in the role of the entrepreneur and the nongovernment
    or NGO decision makers. They nearly closed two deals in Germany and Italy, with
    several other pitches drawing positive feedback and scoring a won deal by the
    end of semester, which they dutifully tracked in their ERPs in the cloud.


    Case Study #6: International TV Station and Digital Broadcaster: Online Bot as
    Infotainment


    This deal was won in a strangely “covert” way, without pitching directly for it.
    Instead we were unwittingly put into a “live experiment” and then chosen from
    our peers! We had received an invitation from New York for a one-day closed door
    seminar on chatbots with leaders from our competitors and our peers. The number
    of actual BaaS providers was limited to just two dozen at the most.


    I didnʼt understand the conference organizers’ business model at the time. As
    a one-day Londoner seminar for 20 of my competitors and less than a roomful of
    attendees, there were also no obvious sponsors of the event. Business participants
    attended for free, on the entrepreneur side. As we later realized, the people
    in the room, apart from the BBC, which interviewed me and two others on our AI
    bot panel in the afternoon, were from big corporations. They were purchasers or
    buyers.


    Clearly, they were paying to “go undercover” to see us perform in our natural
    environment as was later explained to me by several HR experts. They had seen
    parallel practices in their fields obviously. Some of my peers unwittingly discussed
    big flops of bot deployments and failures in delivering, believing we were all
    there as BaaS providers.


    The attendees did not have name tags and I only found out where some of them were
    from over lunch. I luckily landed on the table with the TV corporation that later
    gave me a call. It was between us and another company regarding winning the purchasing
    contract!


    We were asked to quote on:


    *   A 2D bespoke bot.


    *   It was to do be a type of menu bot that helped users navigate the content
    of their online sites.


    *   It was the beginning of on-demand service in the UK and this corporation was
    already at the forefront for certain verticals.


    The Pitch and Outcomes


    In response to the stated needs of the client outlined mentioned earlier:


    *   We created a name and character for the avatar which his team liked.


    *   However, the marketing director was afraid of the bot''s automation and typically
    for marketing and business development (biz dev) people, thought there was an
    in-house plot afoot to undermine their authority and control of the site.


    *   The content had millions of users globally and we agreed to limit a first
    deployment to Europe only.


    This was suddenly called off, after we had gone to the effort to send them a bespoke
    licensing agreement. The TV company did not replace us with a competitor bot.
    To my knowledge, there is still no botification of this site or any of the content
    available online.'
