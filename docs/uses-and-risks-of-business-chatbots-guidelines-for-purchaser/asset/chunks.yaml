  trans: '


    ## 即使客户对机器人的性能感到满意


    即使客户对机器人的性能感到满意，机器人开发人员仍应寻求关于对话式 AI 的内容和信息传递的进一步意见。这至关重要，因为定制机器人的首个迭代版本构成了所有其他版本、后续输入和改进的基础或框架。


    一旦隐藏 URL 或页面上的聊天机器人“草稿”经过改进令各方满意，聊天机器人将获得一个发布日期。当 2D 机器人用于网站时，则需要客户的网站管理员参与。如果是社交媒体，则该信息流的管理者（例如
    Facebook 的 Messenger 平台）需要知情。


    对于复杂的 3D AI 机器人全息图，我们建议采用低调的面向公众的安装发布日期，然后在机器人通过实时引导与用户相互了解几周或几个月后，与利益相关者和公司嘉宾举行新闻发布会或发布活动。


    ## 加速器


    见 `Incubator`。


    ## 算法或源代码


    见 `Proprietary Algorithm`。


    ## 人工智能或 AI


    遗憾的是，这已成为一个陈词滥调，以至于它要么失去了大量含义，要么让技术圈外的人感到困惑。甚至一些科学家也被行话搞糊涂了，所以你不必觉得要成为 AI 世界的“内行”有什么严格规则！


    AI 很“性感”，这毋庸置疑。这导致了编写这本教科书的主要原因：消除将其与聊天机器人和“由 AI 驱动”的机器人结合使用以定义或描述它们时的炒作和误导性定义。


    它可以指处理数据并分析自身错误的算法——请参阅本词汇表中机器学习和深度学习的定义。如果机器人能够纠正其行为或“思想”，也被认为拥有 AI，例如那些会踢足球的微型机器人，它们跌倒后能自己爬起来，并缓慢运用从过往比赛中学到的策略。


    Deep Mind Technologies 在被美国科技巨头 Google 收购前在伦敦赢得的中国围棋比赛，以及 IBM Watson 在电视问答节目《危险边缘》中的著名胜利，是最著名的例子。然而，这属于相当狭窄但深度的
    AI 应用，更类似于本词汇表中机器学习下描述的深度学习。


    圣杯在于通用 AI，那将意味着一个类人机器人，不仅能像我们一样移动，更重要的是能像人类一样做决策，结合了理性、合理性、情商、道德理解和逻辑。还有一丝直觉，那将是其情商装备的一部分。


    就聊天机器人而言，它标志着那些也能自我纠正并从错误中学习的 AI 机器人，尽管这种能力可能很微弱。这样它就拥有了一个有机的机器人大脑，能缓慢但稳步地改进，以提供更好的
    CX 或客户体验。


    根据我公司在语音混合现实集成前沿的经验，它也可以意味着 AI 教会虚拟形象如何识别任何语言的口音和含义。它通过体验对话来学习。另见本词汇表中的 `NLU`
    和 `NLP`。


    ## 增强现实，AR


    见 `Mixed Reality`。


    ## 自动化，自动化流程


    在企业界，人们大谈特谈自动化。它始于重工业，例如大型机器人制造汽车零件，甚至整车，机械臂取代流水线上的人类，仓库里的机器人搬运箱子，现在甚至能为面对客户或
    B2B 合作伙伴的人类搜寻并递送物品。


    对企业而言，自动化通常意味着使工作流程更加精简的数字化流程。是的，除非人力资源部门能将他们调配到公司的其他部位，否则这也意味着人类失业。AI 自动化事物的一个例子可以是算法为记者撰写文本，或利用图像识别为医生工作，筛查
    X 光片和诊断结果，例如试图发现癌症迹象或眼部退化。


    ## 虚拟形象


    这指代表机器人大脑的卡通人物或人物图像。虚拟形象的选择在电脑游戏中由来已久，标志着玩家选择一个在游戏中象征自己的面孔或图像。它就像你个人资料的 ID，而不是一张实际照片。


    在机器人化中，它指我们在本书中讨论的人机交互中的那个作为“机器”的交互式角色或形象——即独立实体。作为一种认知界面，你可以创建一个没有虚拟形象的机器人大脑。但我公司在试点和测试中发现，人们仅使用语音（例如对着智能手机对虚拟助手说话）而没有虚拟形象角色可供聚焦、产生共鸣或拟人化，会阻碍大规模使用。人类喜欢将虚拟形象、机器人或全息图拟人化，无论它们是类人、类动物、物体还是符号。


    ## BaaS，机器人即服务


    源自软件即服务或 `SaaS`，机器人即服务或缩写 `BaaS` 指示在云端运营的总体行业。这意味着聊天机器人和 3D 机器人可以远程运行和托管，而无需安装在客户的服务器或硬件系统上。


    我公司自称 AI BaaS，旨在打破新科技初创公司取怪异名字的潮流。AI BaaS 基本上说明了我们的业务——带有 AI 的机器人即服务。然而，我们以前的名字
    velmai Ltd.（Virtual Empirical Lifeforms with Multimedia AI，多媒体 AI 虚拟实证生命体）确实犯了取极客风险投资名字的错误。我就此为购买者不必猜测神秘公司首字母缩略词的观点休庭陈词！


    ## 机器人化，使机器人化


    这是一个新术语，可在表面或机器变得具备认知能力时应用。简单的例子是当你能与吸尘器、冰箱、电视和汽车对话或互动时！所以不仅是家庭环境，还包括自动驾驶和混合动力或半自动化车辆。


    本质上，它意味着你在人机交互中放入了一个虚拟形象。例如，如果你在 SurveyMonkey 或在线表单上与调查互动，那是人机交互最简单的形式。当你将聊天机器人植入该沟通中，让像我们的市场研究员
    Sophia 这样的机器人（见视频演示中的以下截图）来运行调查，你可以说在线问卷已被机器人化。


    当汽车拥有个性（就语音而言），不一定需要视觉虚拟形象，该车辆就已被机器人化。苹果手机也是如此——Siri 执行机器人化。我们仍在探索从个人电器到可穿戴设备的万物机器人化方式。另见“认知界面”。


    ## 机器人


    见 `Intelligent Virtual Assistants`。


    ## 聊天机器人，或机器人


    见 `Intelligent Virtual Assistants`。


    ## 认知界面，CI 或认知市场、对话式 AI、对话式商务


    正如本词汇表中虚拟形象和人工智能定义前文所讨论的，它表示人机交互。本质上，计算机与人类之间的对话必须显示出证据：


    1.  实体或虚拟形象能自发（甚至有创造性地）响应

    2.  它证明如果反复纠正，它能随时间学习

    3.  它能通过与人类的增加互动来构建其知识库和情商


    ## 客户体验或 CX，源自 UX 或用户体验


    这对客户满意度至关重要。如果用户与技术的体验不好，他们就不会再次使用它。因此，如果技术糟糕的 CX 导致用户数量少和互动质量差，它就会失去商业价值。它无法创造预期的
    ROI 或投资回报率。


    ## 深度学习


    见 `Machine Learning`。


    ## 早期采用者


    见 `First Movers`。


    ## 新兴技术


    见 `New Technologies`。


    ## 绿地项目


    见 `Pilot`。


    ## 人机交互


    见 `Intelligent Virtual Assistants` 和/或见 `Artificial Intelligence`。


    '
