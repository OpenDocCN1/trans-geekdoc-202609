- raw: 'In short, with a long commute to the client site up to four times a week for
    nearly two months, this was a heavy investment of time, money and energy on velmai’s
    part in order to get the prototype up and running in a public space. The things
    that needed to be trained on site in German for the bot brain were the following:


    *   It had to be tested for the “map knowledge” of its surroundings, so the 30+
    shops and facilities, restaurants, cafes, and services. Her overall performance
    with this was excellent, as I documented it here in my Medium post at the time.[32](#02_Chapter_2.xhtml#footnote-023)


    *   Amalia needed continual practice—on site in a quiet office space above the
    mall—to understand the new information and random greetings and ways of addressing
    her in German only in real time.


    *   She needed to speak with Native Speakers of German because my German is spoken
    with a heavy English accent. That confused her and she kept replying to me in
    English, though she had understood my questions and comments in German![33](#02_Chapter_2.xhtml#footnote-022)


    *   Some information we had (not) been given by the client had to be added at
    the last minute, for example, the underground floor was called Basement in both
    English and German, and they used the foreign English word for Untergeschoss.
    So that had to be tweaked for all the shops and food court eateries as well as
    the loos and baby changing room, plus the exit to the subway.


    *   The subway had to be referred to as the underground train or tube because
    the food outlet Subway was also located in the Basement. This confused Amalia’s
    organically learning bot brain! As did other company brand names in English, for
    example, Flying Tiger Copenhagen, “Only” (a clothes store), Depot, the beauty
    chain store “Rituals,” Comfort Baby, Claire’s, Hair Express, the Barber, US Nails,
    Bun n Roll and Fruit World.


    *   I wrote a particularly funny piece about Amalia making jokes about the Iris
    Photography shop called Eyesight in one of my three Medium posts about this.[34](#02_Chapter_2.xhtml#footnote-021)
    We had to change some of the entries like the iris photography shop which we humans
    had wrongly thought was an optician selling glasses and eyewear. In fact, it was
    a gift shop that Amalia ended up giving a lot of reflective thought to and making
    an unwitting joke out of.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c2fig3.JPG)


    Figure 2.3 © AI BaaS UG, Munich, 2019. Amalia I was deployed in a shopping center
    in Cologne with 10 million shoppers per annum. Here you see her successor Amalia
    II about to be deployed in Munich to small and large crowds for multilingual automation
    of Frequently Asked Questions and Infotainment


    Lessons Learned From a Business Development and Client Liaison Angle


    What we had discovered in our trial in Cologne was


    *   Don’t be too ambitious—as a Minimum Viable Product (MVP), the bells and whistles
    must come later.


    *   If the client insists on certain features that were not agreed upon in writing,
    then you can work out a timeline for adding those elements on at a later date,
    for example, in the next phase of the pilot.


    *   Control the client’s expectations before, during, and after the implementation.


    *   Only work with reliable suppliers of hardware or any other external module
    you need.


    *   Off-the-shelf software plug-ins are easiest to add rather than getting bespoke
    coding done by partners.


    *   Bring it all in-house as much as possible! Then you are no longer vulnerable
    to the failures and lateness—including repeated delays and delivery of faulty
    equipment—of external suppliers and third party partners.


    *   We now send a client a template for the customization that must be filled
    out before we start building the bespoke bot brain. See our new company AI BaaS
    UG’s standard template for clients in the following case study about Car Showrooms.


    *   We now have a standard contract that must be agreed and signed before we commence
    any type of pilot or corporate campaign. This stipulates payment terms and delivery
    milestones for all those concerned.


    To date, nearly all hologram projections you see around the world do not have
    an AI bot brain. That makes AI BaaS UG the first bot developer globally to create
    a Cognitive Interface with voice via a hologram.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c2fig4.JPG)


    Figure 2.4 © Realfiction, Copenhagen, 2019. This Danish company is our hardware
    supplier and has been creating high grade “pre-recorded” holograms for nearly
    a decade. Their 3D holograms have limited interactivity, usually through a keyboard,
    buttons in the device and/or gestures


    Case Study #3 A “Meet and Greet” Sales Hologram in Car Showrooms


    This is a Request for a Proposal that our production and sales team were working
    on at the time of my completing this book, in autumn 2019. I will report on it
    in the next edition of this textbook, if not as a sequel or an article in a relevant
    journal. After we ran the shopping center bot hologram installations, our sales
    team decided the best next prototype in our pipeline would be a car showroom mixed
    reality installation. Unlike the shopping center AI bot hologram, this creation
    would do less Wayfinding and more direct selling.


    To be installed at a point of sale, this means that the AI bot must understand
    tentative enquiries, hesitant questions about stock and inventory, and not being
    too pushy when it comes to the bot suggesting that the prospective customer speak
    with their human colleague. Obviously to progress the sale to a deal stage.


    Our sales team need to manage expectations during the sales process so the client
    and other people in their organization mistakenly believe they have just ordered
    a humanoid robot or an AI clone like from a science fiction movie. Of which there
    are many to confuse and overhype what “The Uninitiated” in AI expect from our
    inventions and creations! For that reason, we have started creating demo videos
    and will have our prototypes operating live on various sites in Germany. If the
    prospect cannot travel to our host or showroom in Bingen am Rhein or on the Cote
    d’Azur, then they can participate in a livestreaming session with the AI bot hologram
    in both 3D avatar form and chat with its 2D self.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c2fig5.JPG)


    Figure 2.5 © AI BaaS UG, October 2019. Screenshot of our promotional video on
    our company landing pages [www.ai-baas.com](http://www.ai-baas.com). The new venture
    launched from the Bavaria Film City suburb of Gruenwald in Munich in the autumn
    of last year


    Case Study #4: UK Labour Party Bot Goes Rogue on a Dating Site


    During the national general election in 2017, the UK Labour Party used a bespoke
    Facebook Messenger chatbot to devastating effect. I have used this example as
    an Ethics Test during my internship program that I have run twice now at the University
    of Kent in Canterbury. The international and local students who were our velmai
    interns for two weeks only were delighted by this challenge of “Dos and Don’ts”
    when creating chatbots for any purpose.


    Essentially, the Labour Party created a chatbot on their official Party Facebook
    page. This meant that when you visited the UK Labour Party FB page during that
    election campaign (it was later deactivated), even without being a fan or member,
    you would be greeted by their avatar, which happened to be the English Rose, the
    logo of the party. I really should have taken recordings and screenshots of this
    phenomenon, as this little bot was to become quite historic in global chatbot
    evolution though the history may not have been written yet.'
