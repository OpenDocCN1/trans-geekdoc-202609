- raw: 'Time and again these purchasers from the public and private sectors have been
    disappointed and left angry at being missold these bot services. Some corporations
    have outlaid hundreds of thousands of dollars, euros, and pounds over years to
    see nothing come of their experimentation with customized, 2D NLP chatbots. Nothing
    at all except a near risk of losing customers rather than winning them. They were
    not told how to run the integrated marketing campaigns that should have accompanied
    these botification pilots.


    Worst of all, the chatbot brains they were promised did not learn on their own.
    They were as cognitive as the Japanese Hologram Girlfriend. They were on a loop
    and did not learn new content without the injection of it by their creators, the
    bot developers. Several burned public and private sector clients have told me
    how in addition to the 100K budgets paid to the tech giants, they then had to
    spend more on paying their own staff additional hours to try to mop up the content
    mess and manually adding material to the bot brains they had ordered.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c5fig2.JPG)


    Figure 5.2 The sex industry and pornography have always been an easy, lucrative
    direct route to market for digital innovations and leaps forward in robotics.
    Sex shops filled with robotic sex dolls can be found in the USA, China, Japan
    and parts of Asia (see the Australian SBS documentary “Robot Love in Japan” from
    2017. In this German film, a romantic domestic companion/lover called “Harmony”
    is collected by her new owner from this “sex doll laboratory” in the USA, complete
    with a set of instructions for her maintenance and usage. Taken from the film
    Hi, AI by Isa Willinger © Kloos & Co Medien, Berlin, 2019


    There are endless tales of cheap and nasty chatbots that simply didn’t work, annoyed
    customers or stakeholders rather than assisting them, or just overall performed
    poorly. The three phases I outline here should help you avoid such disappointments
    and unforgiveable cases of misspelling and failure to deliver. It makes me quite
    annoyed because it damages the market for all the good bot developers out there!


    Phase 1: Beginning the Process of Procurement in the Confusing Tech Eco System


    *   Do a shout out on LinkedIn, Xing, or wherever you have your work profiles
    for the best conferences on the subject you are looking at. Peer knowledge and
    recommendations will help with a short list of trade shows and events to go to
    over a three-month period.


    *   Ask an intern or junior to scour online for relevant articles for a week and
    write a short synopsis of each and why it fits with your goals for getting new
    tech in.


    *   Inform your managers over an informal chat that you think you should look
    into this because of three reasons.


    *   Ask your team and those responsible to you what do they think—be prepared
    to be surprised if several or more turn out to be tech fans in their private lives.
    They will be an invaluable source of support and info at this phase and future
    stages.


    *   Ask Human Resources if they can recommend other hidden experts in your organization
    join a local tech group that is relevant, for example, SaaS and innovation. Check
    out the Meetup groups and Eventbrite, which are rich sources of these events usually
    free.


    *   Ask your local Chamber of Commerce what relevant events they are holding planning
    or had in the past. Get in touch with the chamber’s recommended list of experts,
    but make it clear you want to source tech directly not engage costly consultants
    to do this.


    Phase 2: Selecting the Startup, Entrepreneurial Team, and Fixing the Conditions


    After identifying the prospects, have a short list of three to four companies
    to interview. Prior to meeting the entrepreneurs, here is your checklist:


    *   Have you met the owners of the company?


    *   Did you prepare for that meeting by reading interviews with them or articles
    about the technology they are involved in?


    *   Prior to meeting the founders of the venture, discuss the innovation with
    some trusted colleagues to crowdsource some ideas about how it could be of direct
    use and value to your company, department, products, services, and operations.


    *   Write up a list of questions to ask the technology innovators at your first
    meeting. It might be an overwhelming discussion so it is best to have notes from
    your initial research and discussion with you.


    *   Questions to ask the founders: what are your goals, who are your first customers
    or which companies are willing to do a pilot or trial of the tech in the near
    future?


    *   Due to the nature of emerging tech, it will not always be possible to provide
    you with testimonials. In fact, if there are a lot of testimonials, then innovation
    is already established and not emerging.


    *   Where there are a number of testimonials relevant to your company and its
    ideas for harnessing the innovation, ask permission from the entrepreneurs to
    contact these people.


    *   After at least three or four discussions with your peers, you will soon see
    if their testimonial is genuine or invented, for example, in the case it was created
    as a favor for a friend or old colleague or in extreme cases completely made up
    by the entrepreneurs.


    *   Obviously if the testimonials have been faked, you no longer want to have
    any further dealings with that venture or those entrepreneurs. Trust would be
    impossible to regain but unfortunately there are always some who are prepared
    to fake it rather than forgo first-mover business.


    *   Sadly, the business world has lost sight of whistleblowers and enforcing such
    standards in basic ethical conduct for trading. Celebrity status seems easy on
    social media and some unethical players think it is won by deceit or embellishing
    the truth. I wonder where they got those ideas from with the current state of
    leadership and caliber of politicians.


    *   On the subject of hype—do your own research on the innovation claims of the
    entrepreneurs.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c5fig3.JPG)


    Figure 5.3 Unfortunately there have been many false or hyped claims about how
    intelligent an AI (ro)bot is over the past decade or so. Purchasers are often
    duped by watching credible videos and convincing demos in a controlled environment.
    This is the fascination of this authentic documentary by Willinger, because she
    and her production team capture “real interactions” where the human-machine interaction
    is recorded spontaneously without being faked. See my e-mail exchange with Willinger
    about this topic in Figure 5.1. Taken from the film Hi, AI by Isa Willinger ©
    Kloos & Co Medien, Berlin, 2019


    Getting Expert Advice Independently If It Becomes Too Much to Research on Your
    Own


    If it is too confusing because the topic of AI attracts all sorts of hyped claims
    even from the established tech giants as explained at the start of this chapter,
    then call the following experts who would be happy to give you five minutes of
    their time to help you support the emerging tech scene:


    1.  Professors and PhD researchers. They have the depth of knowledge and reading
    to quickly assist. Due to their professional code of conduct, they must remain
    independent.


    2.  However, if the university department is sponsored by a big corporation, or
    even their Chair or position is funded by a brand in the industry, be cautious.
    Better still avoid them all together and pick a lesser known academic whose salary
    is paid for the traditional way, by the government. That ensures neutrality and
    independence.'
