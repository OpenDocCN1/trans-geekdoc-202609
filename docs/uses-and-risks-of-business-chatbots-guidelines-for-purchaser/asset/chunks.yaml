  trans: '


    # 我司是全国仅有的 12 家受邀初创企业之一


    这意味着我们在科技园举办的为期一天的 AI 研讨会期间，拥有一个展位，可在间歇和午餐休息时间与与会者交流。在与数十位业内人士交谈中，这所大学向我们提出了定制应用开发的需求。工程学院院长走到了我们的展位前。我们针对他的具体愿望进行了头脑风暴——增加女生和少数族裔背景学生申请进入该校及
    STEM 学科（科学、技术、工程、数学）的比例。随后我们访问了位于英国的校区。这就是最终的成果。


    ## 面向大学相关垂直领域用例的预估（例如心理学与住宿）


    为了响应他们的 RFP（需求建议书）撰写这份复杂的预估，我们不得不派遣英国销售代理参加员工主管和部门主管的大型会议。客户方约有八人出席，我方仅一人。会议旨在协调聊天机器人在
    2D 和 3D 形式下的复杂用例。如前所述，他们希望看到中学采用其 2D 聊天机器人，以便它能“作为大使走出去”，面向毕业生，说服他们报名攻读该校的 STEM
    学科。这是一种广撒网的方式，旨在吸引最优秀、最合适的大一新生。


    一旦学生入学，他们希望这些大一新生能由 2D“外联”定制机器人的 3D 化身来迎接。显然，该形象将带有大学品牌，并由工业界的联合赞助商冠名，以资助混合现实机器人的构建。Facebook
    Messenger 聊天机器人的构建成本仅约为 10,000 英镑。但要将其扩展为校园内的 3D 向导，他们预计需要至少 100,000 英镑的投资，为期长达五年。


    一个具体的设计需求——类似于澳大利亚的 RFP——是让学生能够从活跃的 2D 和 3D 机器人中学习。因此，他们将需要一个`CRM`（客户关系管理）系统，作为一款易用、直观的云端软件，允许任意数量的学生访问内置于`CRM`中的内容管理系统（`CMS`）。这样，学生将能积极参与塑造不断成长的机器人大脑，并能用新内容更新它，例如本周或本学期的学生活动。


    对大学管理者而言更重要的是，这种易于访问的`CMS`和`CRM`将在真实的商业情境中提升学生技能：大学将其学生联系“机器人化”，并按日定制人机交互的内容。学生可负责：


    *   管理赞助商和赞助请求；

    *   分析、审核并否决他们认为不合适的任何品牌；

    *   例如，酒精或烟草公司、大型连锁加盟店而非本地`SME`（中小企业）服务（如咖啡店），或禁止那些没有任何绿色或清洁技术资质的公司通过校内外的 2D 和
    3D 机器人进行自我推广。


    员工们对这位大学大使 3D 化身及其 2D 复制体所能执行的所有潜在任务、功能和特性感到非常兴奋。他们在为期三小时的会议中与我们的销售代表就主用例的以下变体进行了头脑风暴：


    *   它可以在女生和少数族裔学生还在上学时，通过展示“榜样”或像她们一样“成功”并选择投身 STEM 行业的大学生的短视频，来招募她们。缺乏榜样被确认为说服犹豫不决的毕业生的最大障碍之一——这些毕业生对接受高等教育缺乏信心，更别提踏上被认为艰难的学位之路了。

    *   一旦入校，2D 和 3D 全息机器人可以成为朋友和“熟悉的面孔”，协助他们解决学生福利问题，如感到不知所措，或给予他们打气谈话和辅导建议，教导如何最好地管理时间、完成课程作业、任务和辅导课。其记忆或资讯娱乐功能的一部分将是针对个别学生用户定制的专属课程表。

    *   如果学生对大学生活变得更加严重担忧，24/7 在线的机器人可以在他们陷入抑郁、焦虑或更糟的情况之前“接住他们”。[²] 在获得许可的情况下，手机上无处不在的聊天机器人可以鼓励他们寻求专业帮助，如预约校内的心理咨询师或职业顾问。[³]

    *   同时，校园内作为向导的 3D AI 机器人全息图可以充当实际安保人员，因为大多数大学因预算紧张，无法负担急需的 24 小时安保人员。详情请参阅第 2
    章中关于智慧城市向导的讨论，了解此安保功能如何运作。

    *   大学招生和住宿管理人员也出席了会议。他们对所有繁琐、重复的常见问题（FAQ）能从他们手中移交出去感到兴奋。他们每天花费大量时间反复回答相同的问题，每周数千次。每学期、每年反复如此。这是巨大的生产力杀手！

    *   他们立刻意识到，在处理这些常规问答时可以达到的效率和准确性水平，例如：“住宿区 X、Y、Z 还有空房吗？”“每学期费用多少？”“有押金吗？”“何时可以通知退租？”“有厨房/共用浴室/客房吗？”“何时发送我的录取确认函？”“如何退课/终止注册/延期选课？”

    *   工程学院特别高兴，因为他们希望学生使用`CRM`来理解新技术商业化的过程，即使他们无法参与编程。


    **注。** 我们也收到了来自澳大利亚大学的相同请求，希望他们的计算机科学学生能为我们的源代码做贡献。这是不可能的，因为这是我们的知识产权，并非开源，即不能由公司外部的任何人贡献代码。我们的专有算法作为商业机密予以保护，旨在保障隐私、来源和估值，特别是因为我们不想向外界开放代码质量，从而因糟糕的编程导致黑客攻击或对我们
    IP（知识产权）的网络安全风险。


    ## 2020 年推广计划


    在此阶段，我们预计将于 2020 年推广。这是老生常谈：内部倡导者喜欢它。然后，大学组织内无数孤岛般的利益相关者倾向于采取“存疑不决，不予推进”的态度。那种“背水一战”的紧迫感根本不存在，无法推动谈判在从剑桥贸易展初次接触起两到四年内进入最终合同阶段。


    我们有一份原则上已签署的预估书。他们只是在等待寻找项目资金的途径。考虑到脱欧的巨大不确定性以及所有的延误和不确定性，我们在等待这个用例落地的过程中已经损失了近三年时间。即便如此，除非我们的澳大利亚和新加坡客户抢在前面，否则他们仍将成为全球首家在校园部署
    3D AI 机器人向导的大学！


    **供参考：** 我们的亚太客户也面临融资延迟。作为外部承包商，我们能施加的压力有限，只能催促他们确认订单、预付款和开始日期。我们只能为他们提供所需信息，以便提交给资助机构。


    [²]: 参考脚注 062。

    [³]: 参考脚注 061。


    '
