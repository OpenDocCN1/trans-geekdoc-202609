- raw: 'Even if the client is happy with the performance of the bot, the bot developer
    should be seeking further input about the content and messaging of the Conversational
    AI. This is essential as the first iteration of the bespoke bot forms the foundation
    or framework for all other versions, later input and improvements.


    Once the chatbot “draft” on the hidden URL or page has been improved to everyone’s
    satisfaction, then the chatbot will be given a Release Date. When the 2D bot is
    for a website, then the client’s webmaster needs to be involved. If its social
    media, then the manager of the feed for example, Facebook’s Messenger platform
    needs to be in the loop.


    For complex 3D AI bot holograms, we suggest a low key installation public facing
    release date, then after a few weeks or months of the bot getting to know its
    users and vice versa through live on boarding then hold a press conference or
    launch event with stakeholders and company guests.


    Accelerator, see Incubator


    Algorithm or Source Code, see Proprietary Algorithm


    Artificial Intelligence or AI


    This has sadly become a hackneyed term to the point where it either loses a lot
    of meaning or becomes confusing for those outside of the technology world. Even
    some scientists are confused by the jargon, so you shouldn’t feel like there are
    strict rules for becoming an “insider” in the AI world!


    AI is “sexy,” it goes without saying. This has led to the main reason for writing
    this textbook: to dispel the hype and misleading definitions when it is used in
    conjunction to define or describe chatbots and bots “powered by AI.”


    It can mean the algorithms that crunch data, and analyze their own mistakes—see
    the definition in this Glossary of Machine Learning and Deep Learning. Robots
    are also said to have AI if they can correct their actions or “thoughts” so for
    example the football playing tiny robots that pick themselves up when they fall
    and slowly use strategies they have learnt from past games.


    Go the Chinese chess game that Deep Mind Technologies won in London before they
    were acquired by the U.S. tech giant Google and IBM Watson’s famous win at the
    TV quiz Jeopardy are the most famous examples. However, it is fairly narrow though
    deep AI applications, more like the Deep Learning described in this glossary under
    Machine Learning.


    The Holy Grail is then General AI which would mean a humanoid robot capable of
    moving like us and more importantly making decisions like humans with a combination
    of reason, rationality, Emotional Intelligence, moral understanding and logic.
    And a dash of intuition which would be part of its EI equipment.


    In terms of chatbots, it signals those AI bots that can also self-correct and
    learn from mistakes, minimal though they may be. In that way it as organic bot
    brain that can improve slowly but surely to provide a better CX or Customer Experience.


    In my company’s experience at the frontier of this Mixed Reality integration with
    voice, it can also mean the AI teaches the avatar how to ­recognize speech in
    accents and meaning, in any language. It learns through experiencing conversation.
    See also NLU and NLP in this glossary.


    Augmented Reality, AR, see Mixed Reality


    Automation, Automated Processes


    In the corporate world, people talk a lot about automation. It began with heavy
    industry for example, Big robots manufacturing car parts, even whole cars, robotic
    arms replacing humans on assembly lines, robots in warehouses lifting boxes and
    now even searching for and delivering items to the humans facing the customers
    or B2B partners.


    Automation for corporations usually means digitized processes that make the work
    flow more streamlined. Yes, it also means job losses for humans unless HR can
    redeploy them in another part of the company. An example of AI automating things
    can be an algorithm writing a text for a journalist or working for doctors using
    image recognition to screen xrays and diagnostic results for example, trying to
    spot cancer signs or eye deterioration.


    Avatar


    This means the figure like a cartoon or image of a person that represents the
    bot brain. Avatar choice has been used for ages in computer gaming and signifies
    the player choosing a face or image that symbolizes them during the game. It is
    like the ID for your profile instead of an actual photo.


    In botification it means the independent entity that is the interactive character
    or figure that is the “machine” in the human-machine interation we have been discussing
    in this book. As a cognitive interface, you could create a bot brain without an
    avatar. But then my company has found in pilots and beta testing that people just
    using voice for example, speaking at your smartphone to a Virtual Assistant without
    an avatar character to focus on, relate to or anthromorphise, is a deterrent to
    widespread use. Humans like to anthromorphise the avatar, robot or hologram, humanoid
    or animal like, object or symbol.


    BaaS, Bots as a Service


    Taken from Software as a Service or SaaS, Bots as a Service or the abbreviation
    BaaS indicates the general industry that operates in the cloud. That means chatbots
    and 3D bots can be run and hosted remotely, without having to be installed on
    the client’s servers or hardware systems.


    My company has called itself AI BaaS in order to buck the trend of New Tech startups
    with really weird names. AI BaaS basically says what we do—Bots as a Service with
    Artificial Intelligence. However we were guilty of nerdy venture names with our
    former one, velmai Ltd. Virtual Empirical Lifeforms with Multimedia AI. I rest
    my case for purchasers not having to second guess cryptic company acronyms!


    Botification, to botify


    It is a new term that can be applied when a surface or machine becomes cognitive.
    Easy examples are when you can talk or interact with your vacuum cleaner, fridge,
    TV and car! So not just a Home Environment also self-driving and hybrid or semiautomated
    vehicles.


    Essentially, it means that you put an avatar into the human-machine interaction.
    For example, if you are interacting with a survey say on SurveyMonkey or an online
    form, then that is human-machine interaction in its simplest form. When you bot
    a chatbot into that communication, so a bot like our Sophia the Market Researcher
    (see the following screenshot image from the video demo) runs the survey, you
    can say that the online questionnaire has been botified.


    When a car has a personality in terms of voice, so not necessarily a visual avatar,
    then that vehicle has been botified. Same goes for an Apple phone—Siri performs
    the botification. We are still exploring ways to botify everything from your personal
    appliances to your wearables. See also “Cognitive Interfaces.”


    Bots, see Intelligent Virtual Assistants


    Chatbots, or Bots, see Intelligent Virtual Assistants


    Cognitive Interface, CI or Cognitive Market, Conversational AI, Conversational
    Commerce


    As discussed earlier in the definitions of Avatar and Artificial Intelligence
    in this glossary, it denotes human-machine interaction. Essentially the conversation
    between the computer and the human must show evidence that


    1.  the entity or avatar is responding spontaneously if not creatively


    2.  it demonstrates that it can learn over time if corrected repeatedly


    3.  that it can build its knowledge base and Emotional Intelligence through increased
    interaction with humans


    Customer Experience or CX, developed from UX or User Experience


    This is essential for customer satisfaction. If the user has not had a good experience
    with the technology, they will not re-engage with it. It therefore loses its commercial
    value if the tech’s poor CX leads to low user numbers and bad quality interactions.
    It will not create the desired ROI or Return on Investment.


    Deep Learning, see Machine Learning


    Early Adopters, see First Movers


    Emerging Tech, see New Technologies


    Greenfield Project, see Pilot


    Human-Machine Interaction, see Intelligent Virtual Assistants and/or see Artificial
    Intelligence'
