- raw: "3.  The middle men known as media agencies or advertising agencies sell “ad\
    \ inventory” to big brands and multinational corporations. More accurately they\
    \ buy the digital ad space from providers such as DOOH billboards, Wayfinder,\
    \ outdoor signage, and online platforms. And SEO native ad placements in real\
    \ time.\n\n4.  Their profit margins have been cut by Facebook and Google, among\
    \ other digital ad platforms like native advertising providers and auction places,\
    \ because these U.S. tech giants do not need the middle men to sell their ad inventory.\n\
    \n5.  The brands and businesses, company owners, and marketing directors can buy\
    \ the ad space and campaigns direct from FB and Google, for example. Meanwhile\
    \ the purchasing of FB campaigns has become ever more automated and user intuitive,\
    \ so easy for an unskilled person to utilize. The service supposedly has transparent\
    \ metrics.\n\n6.  I say supposedly because Mark Zuckerberg himself said at the\
    \ FB staff pow wow in San Francisco a few years ago, confessing that their ad\
    \ inventory sales system was not working.\n\n7.  Instead of trying to drive revenues\
    \ through selling advertising space to small business owners and large corporations,\
    \ FB would instead devote their resources to a far more profitable revenue stream\
    \ from January 2017 onward: chatbots on its Messenger platform. And probably its\
    \ newly acquired WhatsApp instant messaging app to assist in a near total monopoly\
    \ of the new digital advertising, global landscape!\n\n8.  Microsoft’s Satya Nadella\
    \ followed Zuckerberg’s chatbot initiative, declaring Microsoft Bot Network and\
    \ its pervasive deployment of Cortana as the new world dominating B2C and B2B\
    \ chatbot interface would be the new revenue stream to beat all others.\n\n9.\
    \  In fact, Cortana was deemed to become the world master bot for all other chatbots.\
    \ Something that has not eventuated since these Microsoft and Facebook declarations\
    \ in 2020 and unlikely to occur as these tech giants have failed to demonstrate\
    \ true AI bot capabilities in the evident lack of user adoption of Cortana and\
    \ the many Messenger bot flops.\n\nThen 2017–2018 saw the hype slump to serious\
    \ turnover “lows.” Now at the end of 2019 we are seeing a hype cycle begin again.\
    \ This is evident in all the trade show invitations that land in my inbox daily—an\
    \ AI bot conference on somewhere in the world every month! 2020 will be a boom\
    \ year and finally see the predicted trillion dollar growth, slowly but surely.\n\
    \nAt last a more modest upswing in bot orders and sustained deployment of their\
    \ avatars, not just online. Being confined to 2D online chats in the past were\
    \ highly restrictive and actually prevented users adopting chat. It wasn’t really\
    \ conversational AI as it wasn’t AI at all as I look at in [Chapter 3](#03_Chapter_3.xhtml)\
    \ with the Japanese Hologram Wife.\n\nConfidentiality Agreements Mean Fewer Case\
    \ Studies\n\nSeveral of these case studies are about competitors to the company\
    \ I co-own. The rest are about the Mixed Reality 3D avatars created bespoke by\
    \ our new tech venture in Bavaria, AI BaaS UG in Munich, as well as the frequently\
    \ frustrating, “sales cycle” and long lead time situations we repeatedly found\
    \ ourselves in with my predecessor 2D chatbot startup velmai Ltd in Devon, UK.\n\
    \n![Image](/library/view/uses-and-risks/9781949443448/Images/c1fig4.JPG)\n\nFigure\
    \ 1.4 Most of our old venture’s avatars were 2D chatbots that we deployed on websites\
    \ and a few on Facebook Messenger for short experiments. Here you can see Albert\
    \ the Online Butler who also switched to the author’s Private Secretary using\
    \ a wake word, plus Hans-Pierre who is a tourist guide and concierge working in\
    \ tourist regions in DACH countries and the South of France. © Cliff Lee in Devon\n\
    \n![Image](/library/view/uses-and-risks/9781949443448/Images/c1fig5.JPG)\n\nFigure\
    \ 1.5 Mixed reality installations are now at the forefront of point-of-sale user\
    \ interaction, especially in large public spaces and where multilingual human–machine\
    \ interaction is required to automate communications and enhance the customer\
    \ experience. © AI BaaS Munich 2019\n\nThe reason for the few number of competitor\
    \ case studies is that we are not privy to the production details, manufacture,\
    \ and deployment issues of many of the “public cases” like Microsoft Tay.ai, Semmi,\
    \ and Franny by Deutsche Bahn or the Labour Party of England and Wales. For the\
    \ outsider, even for me as an expert commentator, we can only speculate as to\
    \ why things go wrong for bot developers when they do.\n\nVery few of them will\
    \ ever release details or turn their pilot into a case study as I have done with\
    \ my companies’ projects here. For the tech ventures I have co-owned, I am able\
    \ to publish details about problems in real-life situations, even where I have\
    \ had to anonymize the client or facts and figures for the sake of our industry\
    \ typical nondisclosure agreements (NDAs) and to ensure that our confidentiality\
    \ agreements are kept intact.\n\n* * *\n\n![Image](Images/BC.jpg)\n\n[CHAPTER\
    \ 2](#contents.xhtml#c2)\n\n[Most Young People Want Bots, Yet Purchasers Don’t\
    \ Buy Them](#contents.xhtml#c2)\n\nChat apps have attracted billions of users,\
    \ and bots are the mechanism that enable organizations to deliver highly personalized\
    \ interactions at scale. Improved personalization delivers a more relevant user\
    \ experience, and the high levels of automation used by bots enable cost-effective\
    \ delivery at scale. As a result, businesses can engage with customers and achieve\
    \ open rates that typically outperform e-mail and social networks.\n\nYet studies\
    \ indicate corporate adoption of chatbots currently lags behind consumer openness\
    \ to the technology, and that businesses would be wise to pick up the pace. According\
    \ to a survey by Retale, “59 percent of US Millennials and 60 percent of US Gen\
    \ X-ers have used chatbots on a messaging app” and chatbots have higher long-term\
    \ retention rates than traditional apps. Yet Forrester reports that as of late\
    \ 2016, only 4 percent of businesses launched a bot.\n\n7 Reasons Why Corporate\
    \ and Government Purchasers Should Deploy Bots\n\nThe best argument I have found\
    \ was by the Canadian VC investment firm Georgian Partners, specialists in Conversational\
    \ AI, based in Toronto. I am quoting them earlier from one of their many recent\
    \ white papers on AI and (chat)bots. Georgian Partners has provided the best summary\
    \ I have seen.[1](#02_Chapter_2.xhtml#footnote-054)\n\nThe figures are startling;\
    \ if nearly 60 percent of U.S. millennials and Gen Xers have used them and want\
    \ to keep using chatbots, then why don’t we see 2D bots as an everyday tool, like\
    \ a chat app? According to the Canadian bot analysts, 2D chatbot deployments and\
    \ purchasing ­decisions accomplish seven key business goals:\n\n1.  One-to-one\
    \ Conversation at Scale\n\n    Leveraging automation, businesses can carry on\
    \ thousands or millions of simultaneous ongoing chats using the app’s native UX.\n\
    \n2.  Personalization\n\n    With a rich trove of data, companies can tailor messaging\
    \ at the individual level based on interests, past behavior, and responses within\
    \ the bot conversation.\n\n3.  High Engagement via Push Notifications\n\n    Once\
    \ positive experiences have been delivered, businesses can leverage push messages\
    \ that go directly into user inboxes. Marketers, in turn, can rely on high open\
    \ rates and an effective ongoing mechanism for re-engagement.\n\n4.  A Cure for\
    \ the Brand App Blues\n\n    ComScore reports that smartphone users spend [80\
