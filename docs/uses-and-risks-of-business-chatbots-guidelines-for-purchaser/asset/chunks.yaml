    ## 献词


    献给我的朋友们、同事们和家人，特别是我的丈夫安德鲁，感谢他们持续的支持和对我的坚定信念，因为我们生活在一个——遗憾的是，依然压倒性地——“男性的世界”中。


    本书也献给未来更公平、偏见更少的（聊天）机器人和民主智能实体，由一位来自此时此地的新兴“后人类主义神秘主义者”敬献。几十年来，欧盟和美国的研究人员一直在深入探索与人工智能进步相关的“后人类主义”，特别是其对个人信仰体系、一般哲学、女权主义、平等机会、自由主义价值观、商业、社会以及我们日常开展业务方式的影响。[¹]


    为了致敬她的“第二次迭代”，我还必须向我们 AI 机器人的一个活着的、更新的版本“Amalia II”表示敬意的感谢。下面你可以看到 3D 虚拟形象 Amalia
    II 准备“进入盒子”或“硬件外壳”的静态“实验室照片”，在那里她会实时变成一个多语言的混合现实全息影像。


    ![Image](img/dedi1.PNG)


    ***献词图 1 © AI BaaS UG, Munich, 2019. 混合现实需要认知接口和对话式 AI/商业前沿的尖端技术***


    ![Image](img/dedi2.PNG)


    ***献词图 2 © AI BaaS UG, Munich, 2019. Amalia II 作为其 3D 虚拟形象的新迭代而栩栩如生，基于其 2D 聊天机器人自我或在线人格***


    [¹]: Braidotti, R., and M. Hlavajova., eds. 2018. *Posthuman Glossary*. London/New
    York: Bloomsbury Academic. 我还推荐美国哲学家 N. Katherine Hales 的著作，她现为杜克大学教授。如 Donna
    Haraway. 1999. Hales 的经典文本预见了 AI 机器人的进步：*How We Became Posthuman: Virtual Bodies
    in Cybernetics, Literature, and Informatics*. Chicago, IL: Chicago University
    Press.


    ## 摘要


    虽然本书主要面向公私部门采购部门的采购者和决策者，但它既适合你的青少年子女，也适合你的祖父母。它有助于 MBA 和高管了解关于（聊天）机器人的真相，区分往往危险的炒作与确凿的事实。它将协助他们决定如何最好地投入时间、精力和公司资源在这项不断（重新）涌现的技术上。


    流行术语**人工智能**常被不想错过 AI 技术浪潮的管理层强加给员工。然而，简单的首字母缩写“AI”可以指代无数的软件和移动应用程序，从**认知接口**、**智能虚拟助手**到工业机械臂和监测我们健康的个性化智能手表。


    因此，词汇表是本书的关键部分，**核对清单和指南**也是如此，它们面向 AI 的采购者和管理者，无论他们为政府/非政府组织工作，还是身处工业界/“企业界”。对于新技术领域的学者、讲师、研究人员和教师来说，这本教材是必读之作，其结构类似于一种成人教育课程，旨在提升学生和毕业生、中年职场人士、失业人员以及需要重新掌握技能的年长工作者的技能。


    本书以日常语言编写，词汇表连同案例研究是关键的学习工具。这 14 个案例研究——大品牌和机器人开发者试点项目的公开信息以及我来自我们**认知接口**创业项目的第一手经验的混合体——以叙事、讲故事的方式进行解释，这将使公司和政府机构内的教育工作者和技术人员的生活更轻松。它将使在同行中“传播”关于部署商业机器人的用途和风险以及如何采用
    AI 等新技术变得更容易。


    ## 关键词


    对话式 AI；对话式商业；认知接口；AI；机器人即服务；人工智能；聊天机器人；IVA；智能虚拟助手；语音技术；语音识别；混合现实；机器人化；智能设备；使用聊天机器人和
    AI 的企业级解决方案；全息图；3D 虚拟形象；增强现实和虚拟现实


