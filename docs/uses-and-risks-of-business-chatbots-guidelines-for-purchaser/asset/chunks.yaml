    # 第 1 章


    # 机器人化简史


    世界于 1950 年代首次见证了交互式机器人的概念出现，当时 Alan Turing 教授试图用机器重现他已故的男友。随后出现了原型聊天机器人 Alice
    和 Eliza，作为作为机器-人类交互运行的首批智能代理。


    这些机器人化的女性 2D 头像是著名图灵测试在 1960 年代后应用的开端。该测试源自 Turing 教授对新兴领域的思考，它指出：当外行人与计算机交谈时，如果在通过机器界面交谈五分钟后，他们不确定聊天对象是人还是机器，那么达到
    AI 的图灵测试就算通过。


    ![Image](img/c1fig1.JPG)


    **图 1.1** 从 20 世纪到 21 世纪的“聊天机器人演变”时间线，为会议演讲、推介和商业计划而开发。© Cliff Lee, CCO from velmai
    Ltd


    这项测试的前提条件——最著名的是以最初源自纽约的 Loebner 奖为象征的年度聊天机器人锦标赛——是人类参与者事先不知道，通过认知界面与他们交谈的对话伙伴中，哪一个是实际的机器，或被称为聊天机器人。


    18 世纪的英国计算机科学家 Ada Lovelace 现被公认为 AI 的奠基“母亲”。上图始于 AI 机器人、聊天机器人、虚拟助手、认知界面或人机交互定义最流行的“奠基之父”，来自英国的计算机科学家、工程师和密码破译者
    Alan Turing。该图表曾被 velmai Ltd 用作销售推介文件，velmai Ltd 是一家我共同拥有多年的英国 2D 聊天机器人早期创业公司。


    我们已从 2D 机器人开发进步到认知界面的机器人化。会议机器人全息影像 Portia 曾在 2019 年 1 月的洛桑应用机器学习日上，从我们的 Porto
    实验室通过 Devon 实验室实时直播（仅用几秒钟）发表了主题演讲。未来 12 个月 Portia 和其他定制 AI 机器人全息影像将非常忙碌，它们受邀作为自主主题演讲嘉宾，出席全球各地的
    AI 会议和贸易展。1


    我曾考虑不使用行业术语来编写这本指南和清单汇编。然而，就本文而言，那实际上会适得其反。本书旨在具有教育意义，并作为企业管理者和政府决策者提升技能的有用工具，帮助他们做出日益困难的软件即服务（SaaS）采购决策。因此，对抗我可能说的是一堆令人困惑、恐慌和沮丧的标签、术语和指代新兴技术与趋势的潮人黑话的最佳良方，就是本书末尾的术语表。


    ![Image](img/c1fig2.JPG)


    **图 1.2** “会议 AI 机器人 Portia”全息影像于 2019 年 1 月实时直播至享有盛誉的瑞士年度会议——洛桑应用机器学习日（AMLD）。此处可见机器人大脑的第二代迭代，作为向导
    Amalia，而 Portia 作为其备用人格，通过语音“唤醒词”激活。© AI BaaS UG, Munich, 2019


    请频繁使用它。这是学习新事物的最佳方式，特别是术语、定义和概念，如果你不断翻回术语表检查你对各种“交叉”或汇聚于这个现普遍称为“AI”的迷人世界的组合定义的理解和记忆。撇开机器人和终结者不谈，一旦你读到一个令人困惑的术语或概念的简短简单定义，会有大量内容变得非常直白，是“不费脑筋”就能懂的。请将本书同时作为字典和指南、一份实操的注意事项清单和卖点核对单，用于任何销售推介或合同谈判中。


    实践出真知。然而，我真正理解当这个常被过度炒作的科学领域——以及日益广泛的“销售驱动、误导性销售”虚构内容——变得令人不知所措且前后不一时，那种想要按下恐慌按钮的冲动冲动。不幸的是，对于我们各自社会中一些最优秀的创新者和企业家来说，无论我们生活在哪里或移民到哪里，采购方的膝跳式反应一直是瘫痪。


