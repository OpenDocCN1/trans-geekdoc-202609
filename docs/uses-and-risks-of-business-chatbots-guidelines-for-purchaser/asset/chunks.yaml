  trans: '

    另一个令人好奇的特朗普化身是 Donald Trumpbot，它在 2015 年至 2016 年作为 NLP 聊天机器人存活了一年多的时间里，作为 Twitter
    机器人粉丝数未达 900，点赞数仅有七个。11 同样已停运的 Trumpbot 听起来在被其讽刺意味浓厚的创作者停用之前，曾非常有趣：


    现在，有几个唐纳德·特朗普和 Trumpbot 之间重要的区别需要牢记。当然，显而易见的区别有：唐纳德·特朗普是一位 69 岁的商业大亨；Trumpbot
    则是用 `Python` 编程语言编写的约 75 行代码。唐纳德·特朗普正在竞选美国总统；Trumpbot 正运行在北美某处的一台服务器上。但 Trumpbot
    也有优点：与真正的特朗普不同，它永远不会拒绝回答你（尽管它有时会转移话题）。它永远不会索要 500 万美元的出场费（尽管它实际上只能出现在网页内部）。而且它永远不会发布其医生的奇怪信件（它没有实体，因此也没有医生）。偶尔
    Trumpbot 的回答与你的实际问题毫无关系。从这个角度看，Trumpbot 确实很像特朗普。12


    据我所知，大多数 Messenger 机器人都是为由民主党和共和党支持者创建并运营的 Facebook 页面而构建的。


    另一个很好的例子是一家美国媒体机构创建了讽刺聊天机器人 BFF Trump，并承认它有偏见，因为它“以前为民主党工作过。”然而，重要的是要注意，作为克林顿竞选活动政治宣传武器而创建的两个官方聊天机器人，是由她办公室拥有聊天机器人构建技能的工作人员开发的。我想你可以称这种活动或职位为一种政治“内部创业者”。


    > **BFF Trump 是一款** Facebook Messenger 机器人，它还会向你发送唐纳德·特朗普说过的最具冒犯性的一些言论。这款面向年轻选民的机器人由
    SS+K 制作，该机构有与民主党合作的历史。据 Fast Company 报道，SS+K 还重新设计了民主党的标志。


    近期，BFF Trump 一直是 Botlist 上最受欢迎的机器人之一。HelloVote 选民登记机器人的创建者 Elana Berkowitz 曾与克林顿竞选团队合作，但竞选团队发言人表示，克林顿的两个竞选机器人均由克林顿技术团队内部开发。13


    随后我读到 SS+K 与 Dexter 合作，赢得了超过 200 万美元的风险投资，用于创建聊天机器人平台！提供该投资信息的同一来源——即前文引用的同一份
    VB 报告——还推荐 FutureStates 公司作为一个非党派的聊天机器人提供商，提供作为互动化身的政客，并给出他们引用政策的来源。与许多仅使用识别关键词的基础
    NLP 机器人大脑的同行不同（因此它们经常针对查询给出错误信息，例如：为什么不给我们看看你的纳税记录？回答却是关于税收政策的推文或即时消息）。


    然而，正如你从这里的 BFF Trump Facebook 页面所见，它在 2016 年很早就停用了，粉丝和关注者不足 600 个。14 鉴于前述的热烈描述，你可以看到，仅凭一个精美的网站、一些知名人士、可信的发言人、令人印象深刻的营销材料和一些听起来严肃的报道，单个聊天机器人是多么容易被炒作起来。


    在 2019 年 7 月的 ABC 昆士兰电台采访中，15 我提到了克林顿竞选团队创建的这些官方讽刺聊天机器人之一。我在直播中解释说，有人在运行一个唐纳德·特朗普机器人，它是讽刺性的，因为我只是在澳大利亚广播公司采访后研究这本书时，才发现这个聊天机器人是一个官方党派机器人。


    VB 的 Khari Johnson 之前的报告证实了这一世界首创现象：一位政治家在全国竞选期间“战略性部署”了官方聊天机器人。请注意，我们将更仔细研究的“Text
    Trump”聊天机器人，是被设计为存在于官方 `www.hillaryclinton.com` 网站上，而非社交媒体。与其许多聊天机器人同伴一样，它是一个暂时的化身，现已停用，即它不再弹出于希拉里·克林顿的网站上。


    Johnson 通过直接从机器人创建源头获取声明，做了一番不错的调查性报道（感谢 VB 的报道标准，为了技术史留存！）：


    克林顿竞选设计师兼创作者 Suelyn Yu 今天在一条推文中重点介绍了该机器人。克林顿竞选发言人通过电子邮件告诉 VentureBeat，它利用的后端数据库与“Literally
    Trump”相同，后者是首次总统辩论期间使用的 hillaryclinton.com 事实核查页面。16


    与本书中我的其他案例研究更为相关的是——关于英国工党的 Facebook Messenger 机器人被多次克隆，用于在一个所谓的私人约会网站上进行（非法）竞选活动，以及我代表另一个英国政党创建的肯特大学实习挑战——民主党竞选办公室创建了第二个竞选
    Messenger 机器人，实现了高度针对性、真实的选票转化效果。


    克林顿竞选团队今天还推出了 I Will Vote Facebook Messenger 机器人。它帮助你登记投票或核实你是否已登记投票。它还能指引你找到当地的投票站，并声称能回答“你关于投票的任何问题”。竞选首席技术官
    Stephanie Hannon 在今天的一条推文中表示，该机器人由 Hillary for America 技术团队制作。17


    我经常引用的 The Donald 讽刺机器人的例子是，它通过实时事实核查凸显特朗普候选人最荒谬或站不住脚的言论，为克林顿竞选团队赢得了政策分数。它将基础自然语言处理“机器人化”，用于一个良好的搜索查找交付用例。总结其成功之处：


    *   当用户登陆官方希拉里·克林顿网站——无论政治倾向如何——当聊天机器人弹出时，他们可以选择与 Text Trump 化身互动。他们可以向他提问，他会闲聊并保持互动，同时提供真实特朗普在竞选途中发表的**名言**以及政策文件或视频的链接。

    *   如果用户提问迟缓，Text Trump 会敏捷地发短信给他们说，“快点问我点什么，否则你就被**解雇了！！！**”，这正是我们所熟知的真正特朗普式、单边的推文风格——就严肃的政策制定和为公共利益服务而言，我们大多数人都厌恶这种风格。


    Khari Johnson 指出，Text Trump 实际上关乎民主党筹款，因为这个聪明的 2D NLP 聊天机器人的信息娱乐部分，通向注册和真实货币交易的转化目标或目的，所有这些在像上届美国大选这样激烈的政治竞选中都会累积起来。


    看来 Text Trump 也在希拉里·克林顿的官方 Facebook 页面上作为 Messenger 机器人运行。由于社交媒体历史仍相当短暂，我们只能通过联系记者或机器人创作者直接确认这一点。正如
    Johnson 所解释的，“最终，机器人会问你是否想接收克林顿竞选团队的推广短信，或者要求你捐款 5 美元给竞选团队。”18 同时，许多克林顿聊天机器人，显然由极右翼、布赖特巴特类型的狂热者或亲特朗普机器人极客运行，显然旨在通过重新分发口号、反克林顿指控以及旨在抵消民主党立场的政策来破坏她的竞选活动。

    '
