  trans: '


    这项调查实际上是由 Oracle 进行的，顺便提一句，他们最终在各个平台上发布了自己的“最先进”聊天机器人，用于其高端 CRM 系统。Oracle 的调查——四年前曾以“80%
    的公司已实现或即将实现机器人化”的主张在主流媒体上占据全球头条——预测，由聊天机器人部署触发的自动化将不可避免地改变经济：


    根据 Public Tableau 的数据，美国 29% 的客户服务职位可通过聊天机器人和其他技术实现自动化。我们估计这相当于每年节省 230 亿美元的薪资成本，这甚至还不包括医疗保险等额外的人力成本。9


    他们的预测基于这张引人注目的图表；其数据来源为麦肯锡咨询公司和美国人事管理局。


    ![Image](img/intro3.JPG)


    ### I.3 © Tania Peitzker on gravatar.com 2012-2019


    在这里你可以看到我之前的创业项目 velmai 作为无偿 Greenfield 项目所承担的许多 2D 聊天机器人试点。尽管对机器人的快速普及抱有强烈期待，但用户（因此也是潜在客户）却犹豫是否采用这项用于销售、营销和沟通的新技术。（于
    2019 年 11 月 3 日访问 [`en.gravatar.com/taniapeitzker`](https://en.gravatar.com/taniapeitzker)）


    好吧，现在是 2020 年。这种转变真的发生了吗？如果没有，为什么？毋庸置疑，在此期间关于潜在和实际失业的社会影响有过大量讨论。这是围绕 AI 和人工智能这两个词的普遍炒作的一部分。媒体常将其称为危言耸听，基调是“机器人正在抢走我们的工作”，或者在科幻叙事中普遍存在那种熟悉的、生存层面的威胁情节：“AI
    将取代你。”


    ## 聊天机器人将成为万亿美元市场


    MarketsandMarkets 发布了关于我所在特定行业细分领域的冗长报告；主要关于聊天机器人、智能虚拟助手（IVA）和基于语音的认知接口，预计到 2025
    年价值将超过 1 万亿美元。从 2017 年起，我已接受过四次深度采访，由印度的一支商业智能（BI）分析师团队录制，每次超过一小时，外加填写了他们详细的采访后调查。这是作为他们报告的来源，这些报告关于
    IVA、认知市场、对话式 AI 和对话式商务，每份定价 8,000 美元以上。10


    作为对我自己反问的一个引言式回答——Business Insider 的预测成真了吗？请考虑以下几点：


    *   是的，社交媒体聊天机器人及其企业采用已显著倍增。只需在线搜索“聊天机器人”或虚拟助手，你就会看到关于成千上万家机器人开发公司和虚拟形象的无尽页面和广告。

    *   现在有无数企业机器人和用例，例如联合利华聊天机器人和英国 Google Ubisend 的 Archant 媒体新闻档案机器人；仅仅几年前，网上只能找到几百个聊天机器人。

    *   它们的数量因托管在提供模板给各层级机器人开发者的框架或 API 上而激增，仅限 2D 的如 `wit.ai` 和 `open.ai`，在全球大多数语言中增强了独立机器人开发。

    *   2020 年，我们现在看到新颖的用例，如迪士尼的《疯狂动物城》机器人与儿童和互动侦探角色合作解谜，以及漫威的“银河护卫队”角色。11

    *   其他数字媒体公司创建了“自选电影结局”、儿童小说，或带有定制聊天机器人角色的互动电脑游戏。12

    *   ChatFuel 和成千上万家 2D 聊天机器人公司正在发布特定用例，如“DIY 拖拽式 Ada”、联合国难民调查以支持寻求庇护者在抵达避难国后通过智能手机提交申请、各种协助律师而非客户的法律机器人、Skype
    上的食谱机器人，以及用于房地产、记账、Slack、Kik、Telegram 和 WeChat 团队协作消息传递的聊天机器人服务。

    *   是的，2020 年确实看起来像一个万亿美元的市场！在主要 SaaS 提供商的 B2C 后端系统中，绝对有比以往更多的聊天机器人，如 SAGE (Peg)、Accenture
    (Amy) 和 Publicis (Marcel)，更别提 Oracle 了——请看本章节末尾关于其 AI 机器人能力的说服力视频。

    *   是的，有更多 CRM 和企业解决方案聊天机器人系统提供商，例如法国的 [www.recast.ai](http://www.recast.ai)，由两位年轻女性在法国孵化器中创建。该公司于
    2018 年以估计 4000 万欧元的价格出售给了著名的德国 CRM SaaS 跨国公司 SAP！

    *   此类并购——例如伦敦的 Bloomsbury AI 最近被一家美国公司收购，据报道估值约 3000 万美元 13——鼓励了中学、毕业生和大学阶段的最新一代程序员创建更多应用型聊天机器人任务，必胜客和
    CNN 机器人似乎只是冰山一角，正如早期开创性的荷兰 KLM 和阿拉斯加航空公司在其品牌预订网站上推出的 2D 聊天机器人行业首秀，协助乘客在线预订航班和获取信息。

    *   是的，预测看起来是正确的，因为 IBM Watson 致力于将其大部分数据挖掘软件和算法深度学习功能白标化为机器人化的认知接口，例如，我最近在印度遇到一个白标的
    Watson Health 应用，正在向澳大利亚市场销售；微软也是如此，其机器人网络拟推出主控机器人 Cortana，尽管她仍保持相当低调，即微软桌面聊天机器人没有明显的大规模消费者采用。

    *   德国铁路公司 (Deutsche Bahn) 让我的科技创业项目 velmai/AI BaaS 意外惊喜，在我们于科隆一家商场试用 Amalia 3D
    AI 机器人全息图一个月后，他们在柏林中央车站发布了 SEMMI。SEMMI 的硬件实际上是一个显示全息人脸的瑞典机器人头。

    *   她的面部全息图能眨眼并显示一些表情，但实际的机器人头活动不大，只能左右旋转。它似乎配备了极佳的扬声器，以听取旅客关于德国铁路时刻表和行程的问题。

    *   和我们的 Amalia I 一样，SEMMI 也能在回应“哪里能买到咖啡”、天气或出口等问题时指引人们前往厕所和咖啡馆。虽然我们认为我们的原型在内容方面更先进，Amalia
    I 不仅提供指引，还能根据要求为我们购物中心的 30 多家零售商、餐厅和服务提供详细描述。

    *   Amalia I 比 SEMMI 看起来更具对话性。例如，Amalia 会主动与购物者互动，询问他们今天过得怎么样，也许他们需要给家人买礼物（然后为商场的各个零售商提出建议），以及软性推销“一年四季任何时候都该给妈妈买份礼物以表感激”这一想法！

    *   和德国铁路的 SEMMI 一样，Amalia I 也仅公开试运行了短短四周，我们就将她“带回实验室”以改进硬件和调整软件。


    '
