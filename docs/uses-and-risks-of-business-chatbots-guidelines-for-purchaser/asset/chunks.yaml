    [^2]: [02_Chapter_2.xhtml#footnote-027]

    [^3]: [02_Chapter_2.xhtml#footnote-026]

    [^4]: [02_Chapter_2.xhtml#footnote-025]

    [^5]: [02_Chapter_2.xhtml#footnote-024]

