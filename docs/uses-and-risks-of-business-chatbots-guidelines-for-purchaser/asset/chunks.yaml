    ## 适用于美食、健身与日常生活的 Alexa 技能


    ### 美食与外卖技能


    *   同样，**Meal Idea** 也会提供食谱创意，所需食材均为常见的日常用品，你的储藏室里很可能已经备齐了。它建议制作诸如骨头汤（用罐装番茄汤和肘子面）以及由生菜叶、罐装甜菜根和山羊奶酪制成的沙拉等菜品。其中至少有一款听起来很棒。

    *   我个人最喜欢的技能之一是 **Domino''s（达美乐）**。你只需对着设备说：“Alexa，打开达美乐并下我的简易订单”，即可**下达美乐简易订单**。你也可以通过说“Alexa，打开达美乐以追踪我的订单”来查询已下单的订单状态。

    *   如果你偏爱 **Pizza Hut（必胜客）**，也有相应的技能可用。要开始使用，请先启用该技能，关联你的账户，然后说：“Alexa，告诉必胜客我要下单。”

    *   **Starbucks（星巴克）** 让你可以使用 **星巴克复购** 技能通过 Alexa 下单。启用技能后，你需要关联账户。除非你此前曾在 Android
    或 iOS 上通过星巴克 App 下过手机订单，否则该技能将无法工作。它可以在你最近亲自光顾过的 10 家星巴克门店中的任意一家下单。你也可以查询账户余额，并在你最近的五个手机订单之间切换。


    ### 健身与健康技能


    *   对于熟悉 **7 分钟锻炼** 的人来说，会很高兴地得知 Alexa 音箱上提供了这项著名锻炼的技能。说：“Alexa，打开 7 分钟锻炼。” 锻炼将开始。你可以根据需要暂停和恢复锻炼。

    *   同样，也有 **5 分钟平板支撑锻炼** 技能。该技能会指导你进行五分钟的各式平板支撑，每个动作间隔 10 秒休息。

    *   如果你佩戴 **Fitbit** 追踪器，可以启用 **Fitbit** 技能。使用该技能，你可以询问 Alexa 关于你的活动进展或前一晚的睡眠情况。不过，在使用该技能前，你需要访问
    `alexa.amazon.com` 的技能页面关联你的 Fitbit 账户。

    *   为了记录饮食，你可以使用 **Track by Nutritionix** 技能，它允许你用语音记录饮食摄入量，或查询食物的热量值（Alexa 默认执行后者）。你可以说：“Alexa，告诉食物追踪器记录一杯杏仁奶”，或者“Alexa，问食物追踪器两个鸡蛋和三片培根有多少卡路里。”

    *   **引导冥想** 每天会提供不同的冥想练习，时长从 3 到 8 分钟不等。如果你不喜欢当前的练习，可以说“Alexa，播放下一个”跳到下一个练习。


    > **延伸阅读：** *用于锻炼、改善睡眠和缓解压力的最佳 Alexa 指令*。


    ## 隐私、数据与商业模式


    任何有过与媒体互动经验的人，无论是电视、印刷媒体还是数字媒体，都明白其商业模式通常是：用户观看广告 = 用户购买广告商品 + 为广告平台及商品制造商或提供商赚钱。显而易见，仅仅通过询问日常需求，如做什么菜、如何锻炼、甚至如何睡眠，你就将关于你自己、你的日常习惯、你的购物偏好，以及最重要的是你愿意为之掏腰包的程度——从而形成你的消费记录——这些宝贵数据免费提供给了免费技能背后的“赞助商”或广告商。


    这是新“数据即石油”时代的黄金。而我们不清楚，通过无处不在的广告软文和持续不断的推销，提供这些进入你汽车、家中乃至卧室的“免费”服务的主导者——本质上是垄断力量——我们究竟在隐私和数据保护方面付出了多大代价。


    即使只是查看这组幻灯片，其中展示了亚马逊 Alexa 能为我做什么的图片，这些图片嵌入在前文讨论的 CNET 文章中[¹]，我就正在被 CNET、亚马逊以及想要获取我的
    Cookie 用于营销目的的不知名第三方广告商追踪。一旦选择“加入”，用户该如何才能“退出”？


    ![Image](img/c6fig3.JPG)


    **图 6.3** © Realfiction, Copenhagen, 2019. 混合现实体验将变得越来越复杂，对感官的冲击力也越来越强。图中一位女性沉浸在投影在她对夜晚城市景观实时感知之上的全息建筑与物体幻觉中。这是艺术还是商业体验？这种融合似乎是
    21 世纪初新体验经济的必然趋势，让位于本书讨论的 CX 技术与创新。


    为了确保我们数字生活的未来包含多样性与洞见，当下需要更多自由奔放的交流，而非仅在受控环境中精心编排的谨慎互动——大学研讨会、学术会议，甚至贸易展小组辩论，最终可能沦为同行闭门会议的“安全空间”。如果我们未能可持续地在理论家与实践者之间建立起稳固的对话，我们将面临我所谓的**断联风险**。


    当关于“人工智能伦理”以及如何“控制风险”等宏大议题的理论探讨——这些风险由 AI 机器人、无处不在的虚拟助手和认知界面的某些用途带来——实际上变得无关紧要时，这种风险就发生了，因为它们与这个令人兴奋的新的人机交互混合现实世界脱节了。正如我在本书献词页所解释的“后人类时代”。享受增强的连接性，并留意在关于这个永恒迷人主题的交流中，你排除了谁、纳入了谁；一旦炒作消退，我们开始体验多重（混合）现实，它很快将成为我们日常生活中赋能的一面。


    ![Image](img/c6fig4.JPG)


    **图 6.4** 一个动作精准的大型机器人在厨房里自主制作爆米花，即无人监督、独立完成，尽管许多人会认为这是一个高风险、甚至危险的情境和任务——对机器人技术和
    AI 而言。取自 Isa Willinger 执导的电影《Hi, AI》 © Kloos & Co Medien, Berlin, 2019.


    ![Image](img/c6fig5.JPG)


    **图 6.5** 中国如今已成为拥有 AI 交互能力（如识别情绪和辨认人脸）的机器人制造大国。与此同时，据报道日本每月都在制造数千种新型机器人。日本机器人通常拟人化，如图中这款拥有“逼真皮肤”和会眨眼的逼真眼睛的机器人。然而，这尚未能完全让它们摆脱“恐怖谷”效应，即外观和行为酷似人类的机器人会让普通人感到毛骨悚然，因为它们看起来几乎像人，但又不完全是。取自
    Isa Willinger 执导的电影《Hi, AI》 © Kloos & Co Medien, Berlin, 2019.


    ---


    ## 术语表


    ### 科技术语与行业黑话词典


    #### AB 测试或工作流的最后阶段


    这是指委托客户获得近乎完善的聊天机器人，在“隐藏页面”上自行测试。该网站页面位于一个链接或 URL 处，客户可将其分发给团队、管理层、传播和市场部门人员以及任何其他利益相关者。


    ![Image](img/Glo1.JPG)


    **术语表 1** © Realfiction, Copenhagen, 2019. 一只全息蝴蝶在绚丽色彩中翩翩起舞，为购物者和路人增添乐趣。


    这款近乎完整的聊天机器人将全天候在线，以便收集关于其在不同设备、浏览器和各种语言下运行情况的重要反馈。这是关键时刻，客户会反馈其预期是否得到满足，如果没有，他们会解释聊天机器人哪里需要改进。


    [¹]: 参考原文献第 10 条脚注（第 6 章，脚注 66）。


