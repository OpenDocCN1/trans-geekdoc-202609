    On Thursday, October 17, 2019 13:20, Jon <jon@leftfieldmedia.com.au> wrote:


    I agree with, ‘I bet nobody has even mentioned it at all to the Top Dog’!


    And having been in this position myself, multiple times, what you said about,
    ‘It’s simply not fair to start ups to make them repeat pitches over and over to
    different silos’, is just so, so true.


    Startups who are being starved of oxygen and who don’t have the luxury of time
    on their sides, and have a critical need to gain traction and commercialize their
    product.


    Not too pushy at all Tania, in fact I think you have struck a nice balance between
    stating the facts, and presenting the benefits to him here.


