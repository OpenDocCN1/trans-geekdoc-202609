    # Immersive Reality


    见 Mixed Reality


    # Industrie 4.0


    该术语起源于 2000 年代初的德国。它代表第四次工业革命，在德国以外被称为下一次工业革命、后工业时代、数字时代或融合时代。


    许多关于增长和经济规划的德国政府政策都聚焦于 Industrie 4.0，后者也被称为 Digitalisierung 或数字化（参见本词汇表中的定义）。


    即使在 2019 年，人们仍普遍担心德国企业（尤其是中小企业）未能最优地使用数字技术，无论是云和软件即服务，还是仅仅是利用社交媒体和整合营销活动在线进行充分的营销。


    因此，Industrie 5.0 专注于 Digitalisierung、人工智能，并向量子计算迈进，后者是德国在 Informatik（信息技术）领域的优势之一。


    # Intelligent Virtual Assistants (IVAs)


    也称为聊天机器人和机器人，Virtual Assistants


    该领域的许多美国人喜欢称其为 Intelligent Virtual Assistants，它们是新一代聊天机器人。它们已超越了依赖相当基础的自然语言处理（NLP）的手工编码聊天机器人，后者是
    1950 年代至 2000 年代初的情况。


    随后我们开始看到 Conversational AI 的开端，以及具有改进的自然语言理解（NLU）的更聪明的机器人。更智能的虚拟助手或聊天机器人是分析公司
    Gartner 定义的机器人炒作周期的一部分。在 Mark Zuckerberg 宣布通知是未来、微软的 Satya Nadella 也持相同观点后，投资热潮和用例蓬勃发展。这种资金涌入主要发生在硅谷，欧洲较少。


    区分标准基础聊天机器人和 AI 机器人的决定性要素是情商（EI）。或者如我在 2016 年 VentureBeat 文章《Why Chatbots are
    so disruptive》[1](#07_Glossory_7.xhtml#footnote-076)中所述，一种更复杂的沟通形式。应用于高级聊天机器人的
    EI 意味着它们不仅能模仿人类以说服用户他们不是在与机器交谈，还能通过展示直觉或善良、同理心等情感特质来给用户惊喜。


    在这个更高级或表现更好的 AI 机器人阶段，人机交互提供了令人满意的体验。用户可能意识到他们在与机器交谈，但会有时刻认为该机器人几乎像人类或类人。这是所有机器人开发者的经典图灵测试目标！


    # Iterations（迭代）


    这指开发中的机器人的最新版本。也可以指机器人大脑的克隆或新诠释。因此，基于虚拟形象的基础角色或个性，开发者随后发布一个类似的机器人，但具有更新的内容或截然不同的角色。然而，部分原始内容仍然是聊天机器人的基础。


    # Machine Learning（机器学习）


    也包括 Deep Learning（深度学习）和 Neural Networks（神经网络）


    现已取代 Neural Networks 成为首选术语，表示能够从错误中学习并逐步自行改进其知识库的源代码。在技术圈中缩写为 ML，它构成了当今大部分数据挖掘的基础，当算法能够自我纠正时，这也被称为
    Deep Learning。


    Machine Learning 正被应用于生物技术以更好地诊断医疗状况，以及绿色技术以进行数值计算并提供建议。同样，金融科技长期以来一直使用 Deep Learning，遗留代码现在正被
    AI 复兴或替代，在此例中 AI 指 Machine Learning。


    # Mixed Reality（混合现实）


    Mixed Reality Installations or Experiences（混合现实装置或体验），也称为 Immersive Reality（沉浸式现实），包括
    Augmented Reality (AR)（增强现实）和 Virtual Reality (VR)（虚拟现实）


    该术语指多种媒体形式的混合，如全息图、机器人、Virtual Reality 和 Augmented Reality。它是一个统称，通常也表示混合现实组合中包含语音识别，因此混合技术基于语音。我的公司现在专注于定制全息图，包含可包含
    VR 体验的多媒体元素。我们还可以将聊天机器人算法集成到某些允许集成的 Augmented Reality 算法中。这便成为混合现实体验，将成为即将到来的体验经济的关键。


    Virtual Reality 通常定义为人们佩戴特殊眼镜，获得在空间上非常强烈、在大多数感官方面甚至包括嗅觉（某些应用）的 3D 体验。极少数应用无需眼镜即可改变人类对所见事物的感知。


    批评者指出这些体验会诱发恶心，而粉丝称 VR 甚至具有治愈能力，通过展示恐惧图像并让受影响的用户重温创伤或恐惧经历，治愈创伤后应激障碍（PTSD）和恐惧症。VR
    广泛用于商业推广旅游交易，当然也用于游戏或电脑游戏。


    Augmented Reality 则相反，极少需要特殊眼镜或眼镜来实现 AR 体验。它最常见的工作方式是用户将平板电脑或智能手机举过表面，然后该表面“弹出”体验设计的
    3D 视频或影片。


    AR 应用最常被旅游部门用于推广观光奇观，或汽车制造商在扩展的 3D 虚拟图像中展示所选颜色、轮胎或功能的最新车型。


    # Natural Language Processing (NLP) 或 Natural Language Understanding (NLU)


    这是较简单聊天机器人的基础编程类型，几乎所有在线运行的 2D 虚拟形象均属此类。早期的仅在网站上运行。随后随着即时通讯平台的出现，为这些媒介开发了新类型的
    NLP 聊天机器人。因此虚拟形象能够通过允许机器人化（即聊天机器人集成）的应用程序与用户进行即时通讯或聊天。


    NLU 声称是遗留 NLP 语言处理的更复杂渲染，使这些 2D 聊天机器人能展示更多理解和情感。然而，它们不应被归类为 Cognitive Interfaces（认知接口）或
    Conversational AI（对话式 AI）。它们可被归类为 Conversational Commerce（对话式商务）兴起前、具有机器人化接口的
    Mixed Reality 装置（如 3D AI 全息图）出现之前的成功遗留案例。


    # Speech Recognition（语音识别）


    ASR 或 Voice tech，见 Voice


    # Three dimensional interfaces（三维界面），3D AI bots


    这是前沿领域。目前仅我的公司在为交互式 3D 全息图做这项工作。贸易展上有许多试点，大多数是录制的，你可以与它们对话。曾有几次交互尝试，但尚无产品上市。Deutsche
    Bahn 用于寻路和时刻表信息的机器人头部。日本、韩国和中国用于零售部署的 Pepper 机器人和其他机器人。


    另见“Cognitive Interfaces”了解 3D 机器人。


    # Two dimensional bots（二维机器人），2D bots 或 Instant Messaging interfaces（即时通讯界面）


    见 Intelligent Virtual Assistants (IVAs)


    # UX，User Experience


    见 CX Customer Experience


    # Virtual Assistants


    见 IVAs 或 Intelligent Virtual Assistants


    # Virtual Reality


    见 Mixed Reality


    # Voice（语音），voice-based（基于语音），也称为 Speech Recognition (ASR)


    我们现在看到聊天机器人会议被语音技术峰会取代。这意味着更多机器人开看到了为虚拟形象“插入”语音以赋予其更多个性的优势，就像使其动画化而非仅仅是二维静态一样。不过，并非所有语音机器人都相同。你可能与一个被赋予语音的基础
    NLP 聊天机器人交互。这意味着它使用语音识别软件理解你对它说的内容，然后将回复“解析”为语音返回给你，而不是其通常的文本消息。

