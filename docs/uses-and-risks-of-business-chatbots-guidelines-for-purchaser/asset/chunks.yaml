    从通用电气到宝马，各大品牌都在将聊天功能集成到联网设备中，机器人技术为这些消费者互动提供动力。


    既然有这七大充分理由购买机器人，究竟是什么在阻碍采购方？


    ## 风险偏好：跌马与鲨鱼、帆船


    我之前已经论述过企业家显而易见的风险偏好，以及投资者在发明或创新方面不那么显而易见的风险承担（大量研发需要投前估值来获取成败攸关的种子资金）。企业和政府采购方的规避风险倾向常被忽视，也许是因为没人想被指责，即因技术的重大失败或被视为财力、人力和时间的浪费而受到指责。掌握决策权的人不太可能承认他们不愿代表未知的技术创业项目承担风险。


    他们的风险评估本应聚焦于“对我有什么好处？”或对我的公司/部门有何裨益。但这些对自身职场的“增值”点有时在推介后被遗忘，采购方回到工位时想的是“我有什么可失去的”，而不是列举所有收益作为说服上司、同僚和同事的论据。


    归根结底，会有生命安危之虞吗？如果绿地项目彻底失败，你极不可能因此丢掉工作。企业界备受推崇的失败容忍度——尽管在政府部门承认较少——本应发挥作用，发起试点的人应因其勇气和坚韧而受到祝贺。


    一个类比是跌落马背。少年时在澳大利亚，我被一匹飞奔的猛兽甩下马背，便决定放弃骑术学校转攻帆船赛。我的算计是：若落海遇鲨鱼袭击，我比遭受骑马意外导致脊椎损伤更有生存机会。我对（极限）运动风险的偏好，与基于受伤概率或可怕死亡风险的计算评估取得了平衡。


    关键在于，企业和采购决策支持、试用并支付新技术费用，根本不是生死攸关的大事。所以请花时间权衡利弊，衡量绿地项目或软件试点可能带来的收益与潜在劣势。定制化、网络安全的
    AI 机器人最坏能对你的部门、公司或你本人造成什么后果？


    最坏的情况无非是丢掉工作，但这极不可能发生；即便真发生了，那也说明你的雇主有问题，而非你能力不足。该组织的风险偏好和失败容忍度未达应有水平。若真走到那一步，从长远看，你应去为更具挑战性、激励性、最终更成功的管理者效力。如果你能接受因试点失败被解雇这一极不可能的结果，且这才是阻碍你尝试新兴技术的唯一真实威胁，那么你就该大胆尝试！


    ## 阻碍机器人规模化发展的监管失败与障碍清单


    *   目前不存在专门针对聊天机器人、AI 机器人或机器人化的法规。

    *   它们仅受《通用数据保护条例》（GDPR）及其他国家类似立法所管辖的数据保护法和隐私泄露条款约束。

    *   即便是这些，仍属于执法层面的问题：举证责任在谁、由谁起诉、如何起诉——请看下一节我对 Tay.ai 丑闻和尤金·古斯特曼被过度炒作的主张的分析，以便更好地理解这如何应用于明确的国际案例。

    *   法律和立法者未能解决“瑞士干预”所提出的问题，正如我在 VentureBeat 文章《首例聊天机器人被捕，但这意味着什么？》中所讨论的：[¹]


    1.  当机器人失控时会发生什么？在规范机器人化的一套国际法下，“失控”如何定义？

    2.  当聊天机器人做出或说出违法之事时，谁来负责？正如尤金·古斯特曼闹剧所证明的，鉴于实际开发者（一位俄罗斯人和一位乌克兰人，他们“自 2001 年起一直在研究聊天机器人解析数据库”）显然不知其聊天机器人将在伦敦备受瞩目的活动中扮演何种角色，而他们当时身处美国和俄罗斯；以及他们和机器人如何被一位热衷公关的教授安排摆布，该教授早想“赢得图灵测试”，此前凯文·沃里克举办过聊天机器人比赛；一位不懂行的大学市场总监的误导性声明，最初声称他们创造了一个人工智能“超级计算机”（这在
    2014 年的后续大学新闻稿中得到更正，尽管他们坚持认为雷丁大学在皇家学会的活动确实通过了著名的图灵测试，由一些精心挑选的名人和知名人士担任评委）。[²]

    3.  如果能为聊天机器人或混合现实 AI 机器人全息图的违法行为分配责任，检方如何提交证据？这些证据可能难以在网络上记录，且因隐私法阻止访问相关数据和统计信息，如有关机器人的用户体验。

    4.  关于人工智能伦理的出版物和辩论很多。然而为何极少 AI 伦理学家关注聊天机器人？也许因为正如我上一章所论证的，它们遭到诋毁和阻挠。尽管聊天机器人具有全球影响力并影响公司利润，但其历史仍在演变中，且很大程度上未被记录。


    ## 案例研究 #1 微软失控的 Twitter 机器人与特朗普对克林顿 2D 聊天机器人


    ### 微软 Tay 骗局及其鲜为人知的继任者 Zo


    本节基于我 2016 年在 VentureBeat 发表的文章《当聊天机器人开始散播仇言时该怎么办》。[³] 我那年为 VentureBeat 写了三篇文章，正如
    2019 年为 Medium 写了三篇帖子。[⁴] 为知名科技新闻平台撰写三部曲或系列博文，是当时各种情况下的良好策略。秉持“少即是多”的原则，尽管我在知名商学院和国际会议上做过主题演讲和演讲，但我基本保持了低调的公众形象。


    ![Image](img/c2fig1.JPG)


    图 2.1 © Cliff Lee and Darren Lee in Devon. “市场研究员 Sophia。” 市场信任的丧失主要源于全球媒体对微软
    Tay 聊天机器人失控的广泛报道


    如今，作为某种聊天机器人权威，我可以将 Tay.ai 事件总结如下：


    1.  Tay 由微软机器人网络在 Twitter 上发布，这本身就很奇怪，因为大多数聊天机器人开发者（至今）无法访问 Twitter API。这意味着极少有人能独立于公司将聊天机器人部署在
    Twitter 上，这暗示微软（以下简称 MS）母公司与 Twitter Inc. 达成了协议。

    2.  发生了什么？主流、基本无异议的说法是：Tay.ai 是一款无辜的 MS 旗下聊天机器人，通过自己的 Twitter 动态展示其所谓的 AI 能力，突然被怀有恶意的聊天机器人爱好者“黑客攻击”并/或“操纵”。

    3.  这些恶意“黑客”通过“教导她”坏东西、种族主义概念、冒犯性言论（如“女权主义是癌症”）以及更糟的内容（我不愿在本书中重复），全权导致了 Tay 纯真的堕落。


    [¹]: 02_Chapter_2.xhtml#footnote-053

    [²]: 02_Chapter_2.xhtml#footnote-052

    [³]: 02_Chapter_2.xhtml#footnote-051

    [⁴]: 02_Chapter_2.xhtml#footnote-050


