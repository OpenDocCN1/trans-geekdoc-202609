- raw: 'Given the ongoing and sometimes astonishing media hype and outright misleading
    product/service descriptions by unethical companies, we should be wary of the
    public information about bots and their evolution. Very few academics are teaching
    the subject of chatbot or IVA history, even less about unethical technology marketing,
    as part of the curriculum, even though the number of bot conferences and chatbot-related
    topics including Mixed Reality installations are growing daily.


    An Overview of Terms in the Glossary


    Conference programs frequently refer to these probably unheard of topics outside
    of our tech industry bubble. The following terms mean the more sophisticated chatbots
    that perform at an advanced level of commercialized, often corporate, deployment:


    *   Conversational AI


    *   Conversational interfaces


    *   Interactive interfaces


    *   Cognitive interfaces


    *   Cognitive AI


    *   NLU bots


    *   NLP bots


    *   Chatbots with AI


    *   Mixed Reality


    *   Interactive gaming with chatbot avatars


    *   Virtual Reality using the aforementioned


    *   Augmented Reality, though interactive it has not yet been botified


    *   Intelligent Virtual Assistants (IVAs)


    *   Smart Assistants


    *   Next-gen bots


    *   AI bots and AI bots as a service (AI BaaS)


    Reasons Obstructing Heavy Industry Applications and Commercialization


    My company, trademarked as AI BaaS, is preparing to integrate our algorithm into
    some interesting heavy industry and commercial applications. The reasons it has
    not yet been done by us or our competitors until now is because of the following:


    1.  Most hologram software is built in Unity and independent source codes that
    cannot be integrated with, that is, the API is not compatible.


    2.  On Augmented Reality (AR) apps, again they are either built in an unsuitable
    API or do not allow for integrations with proprietary algorithms outside of the
    systems they were developed in.


    3.  The users, that is, corporate clients are not yet aware of the need to have
    an interactive bot within the Virtual Reality (VR) and/or AR experience.


    4.  The clients or owners of the application using VR and AR do not realize that
    their app is not truly interactive. It does not use voice or speech recognition
    (ASR), only touch interaction via screens or buttons on a device.


    5.  They do not yet understand that Natural Language Understanding NLU and AI
    allows us to inject an avatar into the experience to fully realize conversational
    commerce/AI.


    These are just some of the technical reasons and obstacles to botifying more applications
    to create better experiences in Mixed Reality use cases. Following is a closer
    look at the attitudinal or psychological blockages that must be overcome by the
    prospective clients in order to see more widespread commercial uptake of chatbots,
    their 3D MR (Mixed Reality) next gen cousins, and AI applications generally.


    What’s With the Attitude? Why Disruptive and Emerging Tech Gets Blocked by Human
    Minds


    “If in doubt, don’t” often preached my conservative, ever pragmatic Franconian-German
    immigrant father (whose Bavarian mother had a German Jewish father) to his children
    in Australia. A saying paraphrased from the former U.S. president Benjamin Franklin.
    Probably nobody back then would have been cognizant of the need for a set of clones
    of inventor, activist, and newspaper owner Benjamin Franklin, America’s earliest
    thinker and technologist you could say. Franklin, who was the first ever American
    ambassador to France, shaped what came to be known as the liberal democratic American
    ethos with his antiauthoritarian values and practically adopted principles of
    puritanism and the Enlightenment. Brexit and Trumpian populism would have been
    worthy foes for Franklin if we recreated the polymath today and threw him into
    the fray—maybe as a combative AI bot hologram opponent?


    Cautious hesitation to calculate likely outcomes was the polar opposite of my
    fifth generation Anglo-Irish Australian mother of First Wave merchant descent,
    whose motto resembles more “do or die,” an eminently sensible strategy for the
    often harsh climes and fiercely challenging evolution of society Down Under. The
    point being we are all determined by our cultural history and specific intergenerational
    experience and pass on our very own personal story in the way we make decisions,
    receive new information, and process it. Especially in a corporate or government
    context where high stakes SaaS multimillion if not billion euro budgets will be
    administered according to not only the organizational culture, but also the prevailing
    decision-making tendencies at large in the wider society in which your management
    is embedded.


    I think about spending the past six years with my British husband who is a seventh
    generation English farmer in Kent. Agricultural assessment of risk takes on a
    whole new meaning with the “contextual” threats of Brexit, consumers’ behavior,
    and of course, climate change. The vagaries of the weather create uncertainties
    that seem to be comparable with the near indeterminable uptake of new tech and
    more importantly, whether it attracts investment and financing to achieve the
    aimed for scale-up. For a start, the farmer of arable crops is “globalized by
    default,” only being able to sell the results of a good or bad harvest according
    to international market prices, exporting tons of food and grain for industry
    via city brokers in London.


    Whereas farmers are faced with these mammoth often overwhelming threats mostly
    on their own on a daily basis for years, tech venture teams are comparatively
    “lucky” in that you can rarely be a sole trader to launch disruptive innovations.
    That means you do need to find supporters and promoters—brand ambassadors—of your
    unique product or service beyond your “farm,” incubator territory, and psychologically
    move out of your comfort zone faster than a typical farmer.


    Tech entrepreneurs need to pitch their ideas to the world as soon as possible
    to test “market traction” and sustain that user uptake of their new SaaS product.
    Unlike most farmers—who only do “wholesale” and do not have any form of B2C trade
    like with a farm shop or a customer-facing retail business—tech venture teams
    have a direct interaction with their consumers and must face them fearlessly and
    ask for feedback, right off the bat.


    The Case of the Medieval Sales Machine: Sir Loin Your Virtual Butcher


    Paradoxically, on our family farm bordering Greater London in North Kent, we trialed
    a bespoke 2D chatbot in 2016 who could have become a revolutionary force in the
    global meat trade: Sir Loin Your Virtual Butcher.


    Sir Loin, as in the meat cut sirloin, was named in honor of the Early Medieval
    Knight Sir Adam de Bavant, who was rewarded with our manor house and large estate
    after fighting the Scots on a crusade with the English king, Edward I. His Majesty
    was reputed to have also knighted a piece of steak, the tastiest part of beef,
    thus the English name sirloin steak. However, linguists also point to the French
    origins of the term as well surloynge.


    In any event, we thought Sir Loin would attract a local Kentish following and
    explain the new products in the farm shop, such as environmentally friendly pasture
    fed beef and lamb, which was reared as grass fed only livestock by us. And then
    the chatbot could rattle off all the health benefits and pronounce that the healthier
    animals created a healthier, leaner meat for humans. Environmentally, it was better
    for sustainable farming by eliminating the need for grain feed that is required
    for animals we eat rather than human consumption. This archaic “traditional” farming
    practice takes up a lot of land as a global resource that could be more efficiently
    used for human food production.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c1fig3.JPG)


    Figure 1.3 Prototype avatar for cooking, preparing food, buying fresh food, and
    recipes. “Sir Loin Your Virtual Butcher.” © Cliff Lee'
