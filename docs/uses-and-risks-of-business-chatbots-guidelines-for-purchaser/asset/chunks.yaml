- raw: 'Senior as he was, he said he assumed AI could “now recover our old Bohemian
    dialect and languages” given its evident capabilities in Google Translate. Just
    when you least expect it, a first mover appears from oldest segment of society.
    That’s why I always keep an open mind and respond to enquiries promptly. The world
    is full of surprises about “who gets it” and where social entrepreneurship might
    spring from.


    Case Study #14: A Political Party in England and Wales


    We won this opportunity by me contacting their Digital Officer and other Party
    representatives in my county, Kent. As well as in London, the Party’s HQ in Oxford
    and other MPs and MEPs in southeast England. Without wanting to give away which
    political party this was, I will outline the challenge they set my University
    of Kent team of interns.


    I used this prospective client situation to train up some very capable graduates
    and third year students—from Economics and Humanities BTW. The following year
    I had a group of interns were even more diverse; IT and technology students and
    graduates from the Arts, Business and Languages. Perfect!


    So I briefed the interns in the first two-hour session about what the prospect
    was thinking in terms of getting a bespoke chatbot installed on the Party’s official
    Facebook page. I will summarize the wish list, the pitching points we then presented
    in an hour-long video conference call to Oxford and London HQ, and then the follow-up
    of the pitch with a decision made by the Party’s social media officer primarily.


    They realized that political parties, in particular in the United States (see
    my analysis of the Trump, Clinton, and Obama chatbots in this book), were utilizing
    bespoke chatbots in social media to further their electioneering and constant
    campaign pushes. This Party had some internal advocates which meant I ended up
    doing a series of call with four people at a time and ccing up to 12 Party executives
    and senior members who were decision makers nationally.


    The lead up to the actual briefing of my intern team had taken two to three months
    of consulting in depth with these Party members and following up by email, just
    to get to pitch stage. They wanted a meet and greet chatbot in Messenger that
    would encourage visitors to:


    1.  Become Members of the Party;


    2.  Join their newsletter;


    3.  Like their page and follow them;


    4.  Share the FB page and the videos the Party posted there;


    5.  Encourage their friends and family to join and support the Party’s initiatives;


    6.  Disseminate policies and campaign information;


    7.  Request them to become volunteers, convincing them with the bespoke videos.


    Our interns eagerly prepared this video conference call pitch as we decided not
    to travel from Canterbury to the London HQ as it was too expensive by public transport
    and too difficult to organize by private cars. Thus the video conference call,
    which ended up having connection issues and put the interns under a lot of stress
    to abandon their script and notes by pitching impromptu. We lost nearly 20 minutes
    due to telco issues on both ends.


    The pitch was effectively:


    *   Yes, velmai could provide such a bespoke Messenger bot on their FB page.


    *   Yes, we would send the Party automated reporting schedules so all could see
    the user uptake and the nature of the enquiries asked of the bot 24/7. (Facebook
    doesn’t allow voice for bots by the way!)


    *   Yes, we could get the Party chatbot to do all the things required, we would
    need a few hours input from the Social Media manager, and a few of the marketing
    and campaign managers about which content to prioritize.


    We were sending them a template so they could automate the avatar creation and
    tell us which links, which videos, which priority campaign messages and images
    were to be distributed by the chatbot.


    We would of course offer AB testing so all members of the Party could be satisfied
    the chatbot was performing in the way they imagined it would. Recruitment of members
    and volunteers would be its primary focus. Some of the interns also wanted to
    work for the Party as a matter of personal passion and interest!


    This was all too much for the social media manager. We had asked her why the Messenger
    function was shut off. Her response was that they were understaffed and did not
    want to be contacted!


    Her greatest fear was the success of this chatbot—if it was talking to people
    24/7 that would generate a lot of new enquiries and new FB followers that she
    would have to deal with. That was too many. In other words, the whole project
    was voted down by one person who felt they would not get enough organizational
    support to cope personally and professionally with our chatbotʼs Mission Accomplished!


    If the chatbot was able to generate so many more new members, volunteers, requests
    for info, requests for this and that from humans who had to deal with the more
    complex side of policy statements then this was a bad thing in the eyes of the
    person who was chiefly responsible for this silo. We tried to reassure her that
    the chatbot would be alleviating her of a backlog of messages and contact requests
    on Facebook if she would only switch on Messenger and let us launch the bot.


    We were only going to charge them £10,000. This was the other issue. That was
    an unaffordable budget for this Party that had other financial priorities for
    its impending fundraising efforts for the next general election, then all the
    county, regional, and Parish elections. We tried to reason that the ROI would
    be even greater because we could tweak or alter the chatbot content per election
    priority and even localize where the chatbot appeared by using the geographic
    location of the user (the IP and other data Facebook gave us).


    No, we were voted down because a few people were afraid of the botification success
    in generating an onslaught of new members (as the Labour Party chatbot was doing
    at the time this process was going on as it turned out!). And then a lack of imagination
    as to how the ROI for the 10K would be repaid tenfold with one single bot build
    deployed for various campaigns and a multitude of elections in one 12-month licensing
    period.


    * * *


    [CHAPTER 5](#contents.xhtml#c5)


    [The Checklists and Guidelines](#contents.xhtml#c5)


    The Major Issue of Pricing: You Really Get What You Pay for!


    I once read a chatbot blogger commenting in a very precise way about why the better
    chatbots don’t get to market, or why if they do, they are not more widely known
    or used. He said the reason is that purchasers expect a Ferrari but want to pay
    the price of a second hand, very basic car. Then naturally they are disappointed
    when their basic, cheap NLP chatbot does not become the outstanding “AI miracle
    of interaction” that the hype has led them to expect.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c5fig1.JPG)


    Figure 5.1 What is real and what is fake? “Hi, AI” shows actual dialogue that
    was not staged that is conversations between “spontaneous” robots and their “real
    carers or companions”, not actors. This e-mail exchange between the author and
    the filmmaker is about Isa Willinger’s 2019 documentary “Hi, AI”. © Tania Peitzker


    My 2D chatbot company velmai Ltd experienced this many times. We could not cut
    through the mass hype and misleading sales talk of hundreds of our competitors,
    which became a disappointing clamor over the past few years. Every purchaser we
    encountered had had a very bad experience with a 2D chatbot. They were led to
    believe by some tech giant competitors that if they paid this well-known brand
    and provider of human–machine interaction @$100,000 or more for a “complex” bot
    build over six months or so, then they would have a better, satisfying experience.'
  fmt: '

    # Case Study #14: A Political Party in England and Wales


    Senior as he was, he said he assumed AI could “now recover our old Bohemian dialect
    and languages” given its evident capabilities in Google Translate. Just when you
    least expect it, a first mover appears from oldest segment of society. That’s
    why I always keep an open mind and respond to enquiries promptly. The world is
    full of surprises about “who gets it” and where social entrepreneurship might
    spring from.


    We won this opportunity by me contacting their Digital Officer and other Party
    representatives in my county, Kent. As well as in London, the Party’s HQ in Oxford
    and other MPs and MEPs in southeast England. Without wanting to give away which
    political party this was, I will outline the challenge they set my University
    of Kent team of interns.


    I used this prospective client situation to train up some very capable graduates
    and third year students—from Economics and Humanities BTW. The following year
    I had a group of interns were even more diverse; IT and technology students and
    graduates from the Arts, Business and Languages. Perfect!


    So I briefed the interns in the first two-hour session about what the prospect
    was was that they were understaffed and did not want to be contacted!


    Her greatest fear was the success of this chatbot—if it was talking to people
    24/7 that would generate a lot of new enquiries and new FB followers that she
    would have to deal with. That was too many. In other words, the whole project
    was voted down by one person who felt they would not get enough organizational
    support to cope personally and professionally with our chatbotʼs Mission Accomplished!


    If the chatbot was able to generate so many more new members, volunteers, requests
    for info, requests for this and that from humans who had to deal with the more
    complex side of policy statements then this was a bad thing in the eyes of the
    person who was chiefly responsible for this silo. We tried to reassure her that
    the chatbot would be alleviating her of a backlog of messages and contact requests
    on Facebook if she would only switch on Messenger and let us launch the bot.


    We were only going to charge them £10,000. This was the other issue. That was
    an unaffordable budget for this Party that had other financial priorities for
    its impending fundraising efforts for the next general election, then all the
    county, regional, and Parish elections. We tried to reason that the ROI would
    be even greater because we could tweak or alter the chatbot content per election
    priority and even localize where the chatbot appeared by using the geographic
    location of the user (the IP and other data Facebook gave us).


    No, we were voted down because a few people were afraid of the botification success
    in generating an onslaught of new members (as the Labour Party chatbot was doing
    at the time this process was going on as it turned out!). And then a lack of imagination
    as to how the ROI for the 10K would be repaid tenfold with one single bot build
    deployed for various campaigns and a multitude of elections in one 12-month licensing
    period.


    ---


    # Chapter 5: The Checklists and Guidelines


    ## The Major Issue of Pricing: You Really Get What You Pay for!


    I once read a chatbot blogger commenting in a very precise way about why the better
    chatbots don’t get to market, or why if they do, they are not more widely known
    or used. He said the reason is that purchasers expect a Ferrari but want to pay
    the price of a second hand, very basic car. Then naturally they are disappointed
    when their basic, cheap NLP chatbot does not become the outstanding “AI miracle
    of interaction” that the hype has led them to expect.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c5fig1.JPG)


    **Figure 5.1** What is real and what is fake? “Hi, AI” shows actual dialogue that
    was not staged that is conversations between “spontaneous” robots and their “real
    carers or companions”, not actors. This e-mail exchange between the author and
    the filmmaker is about Isa Willinger’s 2019 documentary “Hi, AI”. © Tania Peitzker


    My 2D chatbot company `velmai Ltd` experienced this many times. We could not cut
    through the mass hype and misleading sales talk of hundreds of our competitors,
    which became a disappointing clamor over the past few years. Every purchaser we
    encountered had had a very bad experience with a 2D chatbot. They were led to
    believe by some tech giant competitors that if they paid this well-known brand
    and provider of human–machine interaction @$100,000 or more for a “complex” bot
    build over six months or so, then they would have a better, satisfying experience.

