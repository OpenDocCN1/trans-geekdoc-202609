- raw: '4.  If you search for “Tay chatbot” the headlines of the search results tell
    their own tale: the mainstream media and even a lot of tech experts promoted that
    idea that an essentially good AI bot had been tainted and corrupted by so called
    “evil, malicious humans.”


    5.  Why was this untrue? Because there is no objective evidence this Twitter account
    was hacked and Twitter itself would have taken action to block the feed immediately
    if it had been.


    6.  Which begs the next question, why didn’t the owners of the Twitter feed and
    the installed chatbot Tay block the account as soon as there was trouble? They
    could have easily taken down the account early on but instead they let it remain
    active, tweeting the most offensive remarks and retweeting comments for at least
    two days.


    7.  Seemingly enjoying the PR and marketing boon much like a Bad Boy YouTuber
    gets when an Influencer causes offense in the millions of views, Microsoft let
    Tay continue to “innocently” repeat the worst humankind had to offer, along the
    lines of Reddit and Breitbart styles of uncensored sewage of commentary.


    8.  Microsoft was not sued—at least not that we know of successfully—by any human
    rights advocacy groups, ethnic groups that were maligned or government regulators.


    9.  Their immediate “defense” issued by the MS Comms Directors was that Microsoft
    was an innocent owner of a chatbot that had been cruelly led astray and caused
    offense to millions of people—unwittingly because Tay was just a chatbot after
    all.


    The glaring holes in this argument are as follows:


    1.  Microsoft being a multinational multibillion corporation would have had staff
    watching this chatbot around the world, so all time zones in that first 24 hours
    of public-facing performance. Why on earth didn’t one single Microsoft manager
    or staffer take the decision to banish the malfunctioning chatbot?


    2.  It is relatively easy to build in defenses like filters to stop a chatbot,
    no matter how smart or dumb, from learning “bad words” and offensive ideas. That
    is Create a Bot Tutorial 101.


    3.  It is even easier to switch off or hide a bad bot instantly. Hiding it is
    easy because you deactivate it in the account it is operating in, Twitter, Facebook
    Messenger, or Microsoft Bot Network in this instance.


    4.  The killer evidence that quashes all of Microsoft’s protestations of innocence
    and “lack of liability” for the chatbot’s misdemeanors and crimes, for example,
    incitement to hatred and violence, defamation of identifiable groups and so on.
    is simply where is the good chatbot now?


    5.  Microsoft did release a successor to Tay, and she was called Zo and lasted
    from 2016 to early 2019.[6](#02_Chapter_2.xhtml#footnote-049)


    Perhaps the AI capabilities of a Microsoft build chatbot never existed. Surely
    if Microsoft possessed the Holy Grail, the AI that all bot developers want to
    demonstrate, they would do so in the successor chatbots to Tay? But they have
    not, to this day in 2020.


    It may well go down as the greatest deliberate hoax in chatbot history. It hasn’t
    been called out by many of us, only a few brave tech bloggers like me. Because
    there is a lot to fear when a U.S. giant effectively rules the word processing
    world. And is part of a tech giant cartel that can distribute punishment as much
    as it can offer to merge and acquire you. The worst outcome was the fact it became
    very hard for many 2D chatbot developers to sell their independent services to
    prospective clients—they all lost trust in bot developers abilities to “control
    their avatars.” If Microsoft couldn’t control Tay, how can you control yours or
    stop it from being “corrupted”? It really damaged sales for many of us, in particular
    several challenger chatbots my old company velmai had released around this time.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c2fig2.JPG)


    Figure 2.2 © Cliff Lee for the avatar UX and Darren Lee for the website graphic
    design. The financial Services 2D chatbot Sophie became hard to sell after the
    Microsoft “Tay disaster”


    The Clinton Versus Trump Chatbot Wars


    I will keep this summary brief because it is fairly self-explanatory. If you search
    online (I recommend the search engines Qwant from France or Startpage.com from
    the Netherlands), then you will find secure independent results for this query
    “trump clinton chatbots.” There is a plethora of blog posts and news items about
    the effect these avatars had on the last, highly passionate, and controversial
    U.S. election. Needless to say a lot of the spam bots against Clinton that ranted
    on Twitter and FB were guilty of hate speech, harassment, and ethnic vilification
    or incitement to hatred, automated or not.


    The primary presidential contenders Hilary Clinton from the Democrats and Donald
    Trump from Republicans were neck and neck. Curiously this is the first time in
    global and chatbot history that two mainstream American political parties both
    and/or their supporters resorted to avatar deployment, even being analyzed and
    taken very seriously by the iconic, traditional Washington Post![7](#02_Chapter_2.xhtml#footnote-048)
    In fact, one bot developer SapientX created chatbots for both sides of politics
    simultaneously, presumably taking an unbiased Trump versus Clinton stance to get
    views and interactions of their tech.[8](#02_Chapter_2.xhtml#footnote-047)


    A VentureBeat editor was very impressed by the AskHilaryandDonald.com platform,
    which is now defunct if you try to click through by the way. Here is Khari Johnson’s
    introduction:


    There may be an app and (pretty soon) a bot for just about everything, but this
    might be a first. SapientX, a company that has been in stealth mode for the last
    year, has created chatbots for Donald Trump and Hillary Clinton that provide words
    directly from the candidate’s mouth on topics ranging from abortion to taxes and
    terrorism.


    The chatbots are able to answer questions in text or voice about roughly 100 topics,
    like: “What do you think about the Black Lives Matter movement?” or “Do you think
    that women should be paid as much as men?” A full list of sample questions and
    topics is available [in](https://www.askhillaryanddonald.com/assets/Sample_Questions.pdf)
    a Venture Beat article.[9](#02_Chapter_2.xhtml#footnote-046)


    Interestingly though Johnson says SapientX has been in “stealth mode,” they then
    quote one of the founders who says they have actually been operating sometime
    with “Conversational AIs” and voice-based chatbots—with no less than the U.S.
    Intelligence Agencies (CIA, FBI).


    The Hillary and Donald bots are SapientX’s first publicly shared bots. Before
    launching these voice recognition political bots, SapientX was working with “various
    departments of US intelligence on AI and bot technology for more than a decade,”
    Hirshon said.[10](#02_Chapter_2.xhtml#footnote-045)


    Johnson also mentions several other Trump Bot platforms that were caricatures
    or satirical spoof avatars functioning independently of the Presidential Candidate
    in 2016, a year after both he and Clinton announced they were running for the
    top job.


    [www.deepdrumpf.com](http://www.deepdrumpf.com) was based on a satirical piece
    by the well-known British comedian migrant to the United States, John Oliver,
    in his Last Week Tonight weekly comedy show broadcast on HBO. DeepDrumpf is a
    Twitter bot that became defunct (like many 2D chatbots that have gone to an early
    grave!) in May 2017, a bit over a year after it had its account created in March
    2016. The avatar’s Twitter feed profile states enigmatically, in an attempt to
    crowdfund its own existence:


    DeepDrumpf


    @DeepDrumpf


    I’m a Neural Network trained on Trump’s transcripts. Priming text in \[ \]s. Donate
    ([http://gofundme.com/deepdrumpf](http://gofundme.com/deepdrumpf%20) ) to interact!
    Created by [@hayesbh](https://twitter.com/hayesbh).'
