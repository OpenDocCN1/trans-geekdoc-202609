- raw: 'In the autumn of 2019, a backlash about Amazon Alexa was unleashed by a reportage
    on Channel 4 news about how Alexa reading bedtime stories to kids had contributed
    to them “not knowing what a book is or how to use it” as well as their poor verbal
    skills such as speaking in a whole sentence or even in an intelligible way. As
    the articles echoing the Channel 4 report show, four- and five-year-olds were
    looking at their peers conversant in the English language for their age group
    “as if they were not understanding foreigners.” Quite shockingly, even for me
    as an industry expert, these kids were trying to swipe books as they did not know
    about turning pages.


    I am focusing on this broadsheet, the working class Daily Mail[7](#06_Chapter_6.xhtml#footnote-069)
    coverage, for several reasons. The “scandal” was heralded by the supposedly “intellectual’s
    choice of news delivery,” Channel 4 news. However, as I explain in the following,
    it wasn’t, tragically, really news at all in Britain.


    News Headline: Parents’ reliance on AI means some children are starting school
    unable to speak in sentences as it emerges many are even being read bedtime stories
    by devices like Alexa


    Parents’ reliance on AI means some children are starting school unable to speak
    in sentences as it emerges many are even being read bedtime stories by devices
    like Alexa


    *   Reception teachers have children starting school not knowing how to use books


    *   One teacher even claimed more than half their intake cannot speak in sentences


    *   Another claimed that children now go to sleep after Alexa reads them a story


    Children are being read bedtime stories by Alexa and are starting school unable
    to speak in sentences, teachers warn.


    A survey found that families are relying on the virtual assistant to entertain
    their children—while some four and five-year-olds try to ‘swipe’ books as they
    are so addicted to mobile phones.


    The findings were revealed in a poll of 100 reception teachers about pupils who
    started school this month.


    One teacher said more than half their intake ‘cannot speak in sentences or be
    reliably understood by adults’. Another told researchers many children ‘now go
    to sleep with a story from Alexa rather than a parent’ \[File photo\]


    Eighty-two per cent said “increasing numbers of children aren’t adequately prepared
    to start school.”


    The same proportion claim there are more speech and language issues than five
    years ago.


    One teacher said more than half their intake “cannot speak in sentences or be
    reliably understood by adults.”


    Some 72 per cent of those surveyed have at least one child in their class who
    has “no idea” how to use a book.


    Channel 4 News, which broadcast the research last night, was told by one teacher:
    “Many of the children now go to sleep with a story from Alexa rather than a parent.”


    A survey found that families are relying on the virtual assistant to entertain
    their children—while some four and five-year-olds try to ‘swipe’ books as they
    are so addicted to mobile phones \[File photo\]


    The following discussion the by piece by Daily Mail readers, shows an increasing
    anti-tech stance by this segment of the population. They want to go back to the
    good old days of manners, proper education of toddlers, traditional schooling
    like reading books, and more importantly, restoring the parental relationship
    and role by reading bedtime stories yourself to your child, not replacing parents
    with machines like a Virtual Assistant device, a robot, a Smart TV, a permanently
    online tablet, a smartphone or gaming terminal.


    But as I searched for further media coverage of this Channel 4 breaking news story,
    I found disconcerting headlines repeating the findings. From 2013! And 2018! What
    does that mean? Even though the earlier breaking news stories, which were founded
    again on government-backed or state-run polling of primary school teachers and
    kindergarten carers, did not mention Amazon Alexa as it was prior to the market
    dominance of this branded device, they had the same findings.


    Kids starting schools in nappies, unsocialized, unable to speak the English language
    in a rudimentary form or full sentences, low attention span, not being familiar
    with books, and very low on literacy and verbal skills. In fact, earlier reports
    and studies had already dubbed this phenomenon in Britain as the “Education Underclass.”
    Then enter Amazon Alexa, which in its own marketing material online, touts that
    it can only enhance a young child’s educational experience and support learning
    by reading to children.


    Curiously apart from the Daily Mail take up of the Channel 4 2019 reportage, the
    only other reference I found quickly online was a discussion on the famous [www.mumsnet.com](http://www.mumsnet.com)
    I read through the comments section in the thread that began the discussion about
    the Channel 4 piece the night before. Quite unexpectedly, a number of mothers,
    in fact the majority of comments, were trying to downplay the whole situation,
    one even saying it wasn’t reliable data because “only 100 teachers were interviewed.”
    Others justified late toilet training, dummy sucking, nappies in school and so
    on.


    Relevant to the backlash against Amazon Alexa reading to children were the repeatedly
    defensive reactions of these British mothers on Mumsnet. They didn’t actually
    name Amazon or Alexa but referred to the whole digitization phenomenon that everyone
    was actually digitized and reading most material online. From books to magazines.
    A typical comment was “I often catch myself trying to swipe magazine pages” or
    “I catch myself looking at the top of the page for the time, or tap a book page
    to turn it” [8](#06_Chapter_6.xhtml#footnote-068) In other words, these mothers
    on Mumsnet were endorsing the encroachment of interactive tech in their daily
    lives, AI or otherwise. What was good enough for Mum as a willing Digital Native,
    was defensible for the toddlers’ behavior in the first classroom of their young
    lives.


    I wrote about the positive effects of 2D and 3D avatars disrupting advertising
    by being more transparent about users opting in and then the Return on Investment
    for advertisers with automated direct metrics on human–machine interaction and
    conversion rates, there belies a real danger of “ads by stealth.” So without ethical
    opt ins of users either under the GDPR or elsewhere. Take a look at this CNET
    promotion (is meant to be an article but it reads like an advertorial). The tech
    journalist uncritically lists all of Amazon Alexa’s “awesome” capabilities without
    once questioning how the obvious advertisers behind each skill is making money
    out of you innocently asking a listening device for a recipe, the weather or to
    turn on switches in your home.[9](#06_Chapter_6.xhtml#footnote-067)


    Food and drink


    *   If you’re anything like me, you have no idea which wines pair well with which
    food. Fortunately, the *MySomm* skill will tell you. Just ask, “Alexa, ask Wine
    Gal what goes with a pot roast?”


    *   The same goes for beer and the *What beer?* skill. The invocation for this
    particular skill is clever, making the phrasing natural and easy to remember.
    Just say, “Alexa, ask what beer goes with ramen.”


    *   To kick up your home-bartending skills a notch, enable *The Bartender*. You
    can ask what a drink is made of, and it will tell you the ingredients and the
    recipe. The answers are a lot to take in for a single response all at once, but
    this skill can definitely help you dissect your favorite cocktails.


    *   To double-check what internal temperature is considered safe when cooking
    different meats, use Meat Thermometer. Say, “Alexa, ask *Meat Thermometer* what
    is the best temperature for steak.”


    *   For recipes and food recommendations, try the B*est Recipes* skill. You can
    find recipes based on up to three ingredients and narrow the results to breakfast,
    lunch, or dinner. To get started, say, “Alexa, tell Best Recipes I’m hungry” or
    “Alexa, ask Best Recipes what’s for dinner.”'
  fmt: '

    2019 年秋天，第四频道新闻（Channel 4 News）的一篇报道引发了对 Amazon Alexa 的强烈反弹。报道指出，Alexa 给孩子们讲睡前故事，导致他们“不知道什么是书，也不懂得如何使用书”，且语言能力差，甚至不会说完整的句子或以可理解的方式表达。正如呼应第四频道报道的文章所显示的，四五岁的孩子看着同龄、英语流利的同伴，“仿佛他们在看不懂语言的外国人”。更令人震惊的是，甚至连我这位行业专家都感到震惊，这些孩子试图滑动书页，因为他们不知道要翻页。


    我之所以关注这篇《每日邮报》（Daily Mail）[7](#06_Chapter_6.xhtml#footnote-069)的报道（一份面向工薪阶层的大众报纸），有几个原因。这起“丑闻”最初是由所谓的“知识分子首选新闻媒体”——第四频道新闻曝光的。然而，正如我将在下文解释的，悲剧的是，这在英国其实根本不算什么“新闻”。


    **新闻标题：家长依赖 AI 导致部分儿童入学时不会说句子，甚至由 Alexa 等设备讲睡前故事**


    *   接待班老师发现入学儿童不会使用书籍

    *   一位老师甚至声称其班级过半学生不会说完整句子

    *   另一位老师称孩子们现在都是听完 Alexa 讲的故事后入睡


    教师们警告称，孩子们由 Alexa 讲睡前故事，导致入学时不会说句子。


    一项调查发现，家庭依赖虚拟助手来娱乐孩子——一些四五岁的孩子甚至尝试“滑动”书本，因为他们过度沉迷手机。


    这些发现来自对 100 名接待班教师的民意调查，调查对象是本月入学的学生。


    一位老师表示，其班级过半学生“无法用句子表达，或无法被成人可靠理解”。另一位告诉研究人员，许多孩子“现在都是听完 Alexa 讲的故事而不是父母讲的故事后入睡”
    [File photo]


    82% 受访者表示“入学准备不足的儿童数量在增加”。


    同比例受访者称，语言障碍问题比五年前更多。


    一位老师表示，其班级过半学生“无法用句子表达，或无法被成人可靠理解”。


    72% 受访教师班级中至少有一个孩子“完全不知道”如何使用书籍。


    第四频道新闻昨晚播出了该研究，一位老师告诉他们：“现在许多孩子都是听完 Alexa 讲的故事而不是父母讲的故事后入睡。”


    一项调查发现，家庭依赖虚拟助手来娱乐孩子——而一些四五岁的孩子尝试“滑动”书本，因为他们过度沉迷手机 [File photo]


    《每日邮报》读者的以下讨论显示，这部分人群持有越来越强烈的反科技立场。他们渴望回到礼仪规范、幼儿正确教育、阅读书籍等传统学校教育的美好旧时光，更重要的是，恢复父母亲自给孩子讲睡前故事的亲子关系和角色，而不是用虚拟助手设备、机器人、智能电视、永久在线的平板电脑、智能手机或游戏终端等机器取代父母。


    但当我搜索这则第四频道独家新闻的更多媒体报道时，发现了令人不安的重复标题——来自 2013 年！和 2018 年！这意味着什么？尽管早期的独家新闻同样基于政府支持或国家运营的小学教师和幼儿看护人员民调，但因早于
    Amazon Alexa 占据市场主导地位，未提及该品牌设备，却得出了相同的发现。


    孩子们穿着纸尿裤入学、未社会化、无法用基础英语或完整句子交流、注意力短暂、不熟悉书籍、读写和语言能力极低。事实上，早期的报告和研究已将这一现象在英国称为“教育底层阶级”。随后
    Amazon Alexa 登场，其在线营销材料吹嘘只能增强幼儿教育体验、通过给孩子读书来支持学习。


    有趣的是，除了《每日邮报》转载第四频道 2019 年报道外，我快速在网上找到的唯一其他参考是著名的 [www.mumsnet.com](http://www.mumsnet.com)
    上的一个讨论。我阅读了前一天晚上开始讨论第四频道报道的帖子下的评论区。出乎意料的是，许多母亲（实际上是大多数评论者）试图淡化整个情况，甚至有人称数据不可靠，因为“只采访了
    100 位老师”。其他人为晚如厕训练、吸奶嘴、上学穿纸尿裤等现象辩护。


    与针对 Amazon Alexa 给孩子读书的反弹相关的是，这些英国母亲在 Mumsnet 上表现出的反复防御性反应。她们没有点名 Amazon 或 Alexa，而是指代整个数字化现象——每个人都已数字化，在线阅读大部分材料，从书籍到杂志。典型评论包括：“我经常发现自己试图滑动杂志页面”或“我发现自己看页面顶部找时间，或点击书页翻页”
    [8](#06_Chapter_6.xhtml#footnote-068) 换句话说，这些 Mumsnet 上的母亲作为甘愿的“数字原住民”，认可了交互式技术（无论是否
    AI）对日常生活的侵蚀。对妈妈够好的，对幼儿在人生第一间教室里的行为也就可辩护了。


    我曾撰文论述 2D 和 3D 虚拟形象通过更透明地让用户选择加入（opt-in）来颠覆广告，以及广告主通过自动化的人机交互和转化率直接指标获得的投资回报，其背后隐藏着“隐形广告”的真实危险。如果没有用户在
    GDPR 或其他地方的道德选择加入机制。请看这个 CNET 推广（本意是文章但读起来像软广）。这位科技记者未加批判地列举了 Amazon Alexa 所有“很棒”的功能，从未质疑每个技能背后显而易见的广告商，如何从你天真地向一个监听设备询问食谱、天气或控制家中开关中赚钱。[9](#06_Chapter_6.xhtml#footnote-067)


    **餐饮**


    *   如果你像我一样，完全不知道哪款酒搭配哪道菜。幸运的是，`MySomm` 技能会告诉你。只需问：“Alexa, ask Wine Gal what goes
    with a pot roast?”

    *   啤酒同理，有 `What beer?` 技能。该技能的调用措辞巧妙，自然易记。只需说：“Alexa, ask what beer goes with
    ramen.”

    *   想提升家庭调酒技巧，可启用 `The Bartender`。你可以问某款饮料的成分，它会告诉你配料和配方。答案一次性给出信息量很大，但这项技能绝对能帮你拆解最爱的鸡尾酒。

    *   想查询烹饪不同肉类时安全的内部温度，可用 `Meat Thermometer`。说：“Alexa, ask `Meat Thermometer` what
    is the best temperature for steak.”

    *   想找食谱和美食推荐，可试用 `Best Recipes` 技能。你可以基于最多三种食材找食谱，并按早餐、午餐或晚餐筛选。开始使用请说：“Alexa,
    tell Best Recipes I’m hungry”或“Alexa, ask Best Recipes what’s for dinner.”

    '
