    ## 3. 中间商：媒体代理与广告代理


    被称为媒体代理或广告代理的中间商向大品牌和跨国公司出售“广告库存”。更准确地说，他们从 DOOH 广告牌、Wayfinder、户外标牌和在线平台等提供商处购买数字广告位，以及实时的
    SEO 原生广告投放。


    ## 4. 利润率被压缩


    Facebook 和 Google 等数字广告平台（包括原生广告提供商和拍卖平台）削减了他们的利润率，因为这些美国科技巨头不需要中间商来出售他们的广告库存。


    ## 5. 品牌方可直接购买


    品牌和企业、公司所有者及营销总监可以直接从 FB 和 Google 等平台购买广告位和广告系列。同时，FB 广告系列的购买流程变得越来越自动化和直观，即使是非专业人士也能轻松使用。该服务号称拥有透明的指标体系。


    ## 6. 扎克伯格的自白


    我说“号称”，是因为马克·扎克伯格本人几年前在旧金山的 FB 内部全员大会上亲口承认，他们的广告库存销售系统并未正常运作。


    ## 7. 战略转向：聊天机器人


    FB 不再致力于通过向中小企业主和大公司出售广告位来驱动营收，而是从 2017 年 1 月起将资源投入到一个利润丰厚得多的收入来源：其 Messenger
    平台上的聊天机器人。并可能利用其新收购的 WhatsApp 即时通讯应用，协助实现对新数字广告全球格局的近乎完全垄断！


    ## 8. 微软跟进


    微软的萨提亚·纳德拉紧随扎克伯格的聊天机器人倡议，宣布微软机器人网络及其 Cortana 的普遍部署将成为新的世界级主导 B2C 和 B2B 聊天机器人界面，并将成为超越所有其他来源的新收入流。


    ## 9. 现实与预期的差距


    事实上，Cortana 被寄予厚望，要成为所有其他聊天机器人的“主控机器人”。然而，自 2020 年这些微软和 Facebook 的声明以来，这一愿景并未实现，未来也难以实现，因为这些科技巨头未能展示真正的
    AI 机器人能力，这从用户对 Cortana 缺乏采用以及 Messenger 机器人的多次失败中可见一斑。


    随后 2017–2018 年见证了热潮跌至严重的营业额“低谷”。如今在 2019 年底，我们又看到一个炒作周期开始。这从每天落入我收件箱的各种贸易展邀请函中可见一斑——全球每月都有一场
    AI 机器人大会！2020 年将是繁荣之年，最终将看到预测的万亿美元级增长，虽缓慢但稳健。


    终于迎来了机器人订单的温和上扬及其化身的持续部署，不再局限于线上。过去仅限于 2D 在线聊天的模式高度受限，实际上阻碍了用户采用聊天。那并非真正的对话式 AI，因为根本就不是
    AI，正如我在[第 3 章](#03_Chapter_3.xhtml)中结合日本全息妻子所分析的。


    ## 保密协议导致案例研究稀缺


    以下几个案例研究涉及我合资公司的竞争对手。其余案例研究则关注我们在巴伐利亚的新技术合资企业——慕尼黑的 AI BaaS UG 创建的定制混合现实 3D 化身，以及我们在我之前位于英国德文郡的
    2D 聊天机器人初创公司 velmai Ltd 中反复遭遇的、经常令人沮丧的“销售周期”和长交付周期情况。


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c1fig4.JPG)


    **图 1.4** 我们旧企业的大多数化身都是部署在网站上的 2D 聊天机器人，少数在 Facebook Messenger 上进行过短期实验。这里可以看到在线管家
    Albert，他也可通过唤醒词切换为作者的私人秘书；还有 Hans-Pierre，他是一名旅游向导和礼宾，在 DACH 国家和法国南部的旅游区工作。© Cliff
    Lee in Devon


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c1fig5.JPG)


    **图 1.5** 混合现实装置现在处于销售点用户交互的最前沿，特别是在大型公共场所，以及需要多语言人机交互以实现通信自动化和提升客户体验的场景。© AI
    BaaS Munich 2019


    案例研究数量稀少的原因在于，我们无法知晓许多“公开案例”（如 Microsoft Tay.ai、Semmi、Deutsche Bahn 的 Franny 或英格兰和威尔士工党的案例）的生产细节、制造过程和部署问题。对于局外人，甚至对我这种专家评论员来说，我们只能推测机器人开发者在出问题时的原因。


    极少数开发者会发布详细信息或将其试点项目转化为案例研究，就像我在这里为我合资公司的项目所做的那样。对于我合资拥有的技术企业，我能够发布真实场景中遇到的问题细节，即使为了遵守行业典型的保密协议（NDA）并确保保密协议完整，我不得不对客户或事实数据进行匿名化处理。


