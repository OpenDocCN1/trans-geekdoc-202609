- raw: 'My case study for the Employability Points interns at the University of Kent
    was a first step to discussing the implications of this political deployment of
    a bespoke Messenger chatbot in Europe. The 2D chatbot was there to “meet and greet”
    visitors to the page. It did that quite successfully though I recall my conversations
    with it tested its limitations. For example, after saying hello and welcome, it
    launched into policy recommendations and news flashes. So far so good, but that
    can be repetitious for a supposedly “spontaneous,” organic conversation between
    bot and human in real time.


    Nevertheless, this little NLP chatbot, despite its content and conversational
    limitations, became a huge contributing factor where the Labour Party increased
    membership to record numbers, by the hundreds of thousands no less. Sure a lot
    of that was face-to-face campaigning by a leftist youth movement called Momentum,
    as well as the British Union Movement. But what has been overlooked to date in
    this electoral period of British history is how the bespoke Messenger bot increased
    the FB numbers on their FB page.


    I am not privy to those statistics but I witnessed an increase through use of
    their FB page several times over a period of months during the election campaign.
    Purely out of professional curiosity to see how the brave NLP chatbot was doing
    as a Messenger bot amid heated political controversy. Also overlooked and representing
    a huge ethical controversy in chatbot history is the fact that Labour supporters
    and/or members replicated this English Rose logo avatar on Facebook. They then
    deployed this 2D chatbot on a dating site, without a logo or avatar, just a multitude
    of people’s real names, as I explain in the following.


    The controversy lies in the fact that:


    1.  This chatbot took on various personas or the names of real people who were
    members/supporters of the Labour Party.


    2.  The various personalities of this chatbot with real people’s names were then
    given a variety of different personal addresses and post codes. Why?


    3.  Because the dating deployment was a highly strategic, innovative campaign
    method to win swinging voters. How?


    4.  The various clones of the Labour Party avatar were deployed in swinging electorates
    or townships/regions where Labour could win a marginal seat away from the Tory
    Party. Their professed fake addresses enabled them to contact single men and women
    “looking for love” on this dating app.


    5.  The problem? The issue is that these lonely (human) hearts did not know they
    were being contacted by a chatbot, let alone a politically repurposed 2D bot who
    had the sole aim of influencing their particular vote in this hotly contested
    general election.


    6.  How did the cloned, multiple personalities Labour bot accomplish this? It
    sent out automated text messages to its human targets on the dating site, asking
    them in colloquial informal and very convincing English “dialects” or slang “How
    are you going to vote today love? I’m for Labour!” And similar messages.


    7.  The killer deployment or dating message by this politically motivated chatbot
    with numerous IDs so evidently a Multiple Personality Disorder executed on the
    dating site was a text the day before polling day. “Don’t forget to vote honey!”
    and the like.


    We don’t know or have the actual metrics of the success rate or conversion rate
    of the bot missives to human lonely hearts. All I can say it was obviously worth
    the ethical and legal risk the bot managers took to do this!


    Because no formal case study exists on this episode to this day, I got my interns
    in their busy two-week program with me to look into it, if they had time. We saw
    that the dating site company that had supposedly unwittingly hosted this caprice
    and had made a public statement about it with an online press release at the time.


    They regretted that their users had been used like this by Labour Party supporters.
    They were investigating the incident and were taking action. I don’t think they
    ever did. The Labour Party of course distanced themselves from the whole botified
    online shenanigans and said it wasn’t the Party Head Office, administrators, or
    members, just some fans who got carried away online in their zest for a Labour
    win.


    * * *


    [CHAPTER 3](#contents.xhtml#c3)


    [Use Cases of the Best Practices and Worse Case Scenarios](#contents.xhtml#c3)


    Defining a Cognitive Interface by What It Is Not; the “Japanese Hologram Girlfriend”


    I created this case study for a large audience of MBAs and staff at Cambridge
    Judge Business School in autumn semester 2017. I won’t repeat the case study in
    this book because it is freely available online as a podcast on YouTube accompanied
    by the visuals in a SWAY PowerPoint.[1](#03_Chapter_3.xhtml#footnote-060) The
    essence of the analysis was that the interactive hologram created by Gatebox in
    Japan was not a cognitive interface. It does not grow or learn. It is an excellent,
    high-grade animated 3D avatar.


    The Hologram Girlfriend ever deployed in a small semitransparent cylinder for
    B2C use or mass consumption, to date largely in Japanese though there is uptake
    for her English version in the United States. However, the personality contained
    in the box is not an AI bot hologram as it is on a loop or repeated content. It
    doesn’t learn from its owner or from interactions with humans to expand its repertoire.


    Having said that, its performance as a standalone 3D hologram satisfying the needs
    of a particular market segment is remarkable. Its best innovation, rewarded with
    a fairly quick M&A takeover by a larger corporation in Tokyo, is the Hologram
    Girlfriend’s success in being an IoT device in home environments, connected to
    the owners’ appliances and being able to text him via his smartphone, a NLP chatbot
    in 3D communicating as a 2D replica with her owner.


    It may be the subject of another book to look at chatbot history by continent,
    for example, in Africa, Asia, India, Australia,[2](#03_Chapter_3.xhtml#footnote-059)
    the Americas.[3](#03_Chapter_3.xhtml#footnote-058) We have had RFPs from South
    America and we noted that the most popular instant messaging app there is Telegram,
    which is also running thousands of interactive, basic NLP chatbots for a variety
    of use cases.


    I stumble across Japanese, Korean, Chinese, Indonesian, Malaysian, and Singaporean
    chatbots constantly, not to mention the thousands coming on the Indian market.
    Many have been around for decades, like these corporate use cases for 2D chatbot
    applications via instant messaging platforms by a South Korean AI company that
    was established in the early 1990s.[4](#03_Chapter_3.xhtml#footnote-057)


    Eight Use Cases for Industry Verticals


    For our marketing collateral, my company AI BaaS defined the following use cases:


    1.  Wayfinder and infotainment at malls, airports, train stations, and sports
    stadiums including sponsored marketing targeting “want to know” users during their
    chat sessions with velmai AI bot holograms on site in 3D multimedia format.


    2.  Conferences and trade shows—see the Portia experiment. Saves time, money,
    and energy when you can send a bespoke 3D hologram avatar instead of staff! She
    made a speech to AI experts at AMLD and took questions from the floor. The hologram
    can then be installed at the event for further one-on-one interactions.


    3.  Tourist guide and hotel concierge—similar to use case 1 but more bespoke content
    answering the FAQs of hotel guests and destination marketing goals.


    4.  University campuses for security and timetabling queries regarding room changes
    in real time. 3D is a mascot of the university that we can grant student teams
    access to, that is, they can upload new info via a CRM. The 2D replica can disseminate
    this via the university’s and student clubs’ social media pages. We have also
    been asked to do a Student Welfare bot for psychological support on campus.'
