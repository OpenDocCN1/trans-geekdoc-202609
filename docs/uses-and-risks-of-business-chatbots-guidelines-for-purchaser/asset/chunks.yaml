    # 第二章：大多数年轻人想要机器人，但采购方却不买单


    [CHAPTER 2](#contents.xhtml#c2)


    [Most Young People Want Bots, Yet Purchasers Don’t Buy Them](#contents.xhtml#c2)


    聊天应用吸引了数十亿用户，而机器人是使组织能够大规模提供高度个性化交互的机制。改进的个性化提供了更相关的用户体验，机器人使用的高度自动化实现了大规模的成本效益交付。因此，企业可以与客户互动，并实现通常优于电子邮件和社交网络的打开率。


    然而，研究表明，企业对聊天机器人的采用目前落后于消费者对该技术的开放度，企业明智的做法是加快步伐。根据 Retale 的一项调查，“59% 的美国千禧一代和
    60% 的美国 X 世代曾在通讯应用上使用过聊天机器人”，且聊天机器人的长期留存率高于传统应用。然而 Forrester 报告称，截至 2016 年底，仅有
    4% 的企业推出了机器人。


    ## 企业和政府采购方应部署机器人的 7 大理由


    我找到的最佳论据来自加拿大风投公司 Georgian Partners，该公司专注于对话式 AI，总部位于多伦多。我引用了他们最近一份关于 AI 和（聊天）机器人的白皮书中的观点。Georgian
    Partners 提供了我见过的最佳总结。[1](#02_Chapter_2.xhtml#footnote-054)


    数据令人震惊：如果近 60% 的美国千禧一代和 X 世代使用过并希望继续使用聊天机器人，为什么我们却看不到 2D 机器人像聊天应用一样成为日常工具？据加拿大机器人分析师称，2D
    聊天机器人部署和采购决策可实现七大关键业务目标：


    ### 1. 大规模一对一对话


    利用自动化，企业可以使用应用的原生 UX 同时进行数千或数百万个持续的聊天会话。


    ### 2. 个性化


    凭借丰富的数据资源，公司可以根据兴趣、过往行为以及机器人对话中的响应，在个人层面定制消息传递。


    ### 3. 通过推送通知实现高参与度


    一旦提供了积极的体验，企业就可以利用直接进入用户收件箱的推送消息。营销人员反过来可以依赖高打开率和有效的持续再互动机制。


    ### 4. 治愈“品牌 App 忧郁症”


    ComScore 报告称，智能手机用户将[80% 的应用使用时间](http://fortune.com/2015/09/24/apps-smartphone-facebook/)花在仅有的三个应用上。随着多款通讯应用在全球应用排行榜上名列前茅，在这些平台上拥有一块“数字房产”是构建自有品牌应用的一个有吸引力的替代方案。


    ### 5. 营收


    AI 驱动的聊天机器人可以引导消费者完成从认知到购买的整个销售漏斗。


    ### 6. 效率与生产力


    机器人能够通过呈现有用信息或完成日程安排等重复性任务来增强用户间的对话。


    ### 7. 环境式聊天

