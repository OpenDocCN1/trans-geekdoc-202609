  trans: "\n\n# 对于 3D 虚拟形象，语音是最佳选择\n\n对于 3D 虚拟形象，语音是最佳选择，因为它符合整体混合现实工业设计。它们能够识别语音，借助更好的\
    \ ASR 插件还能识别方言。这一细分领域正作为核心竞争力迅速发展。\n\n语音技术专家将使更多机器人开发者能够接入其专业音频软件，这是自然语言处理的一种高级形式，但不一定是独立的人工智能。它需要与一个已展现出认知思维的优秀“大脑”相结合，才能被归类为对话式\
    \ AI 或认知界面。\n\n## 语音激活\n\n参见 唤醒词\n\n## 唤醒词\n\n使用唤醒词的最著名的语音机器人当然是 Amazon Alexa。在这种情况下，唤醒词是“Alexa”，说出它是为了唤醒机器以便其响应。媒体（如《明镜周刊》）的多次曝光表明，Amazon\
    \ 的设备（包括 Echo 和 Dot）潜在地“一直在听你说话”。\n\n报道证实，这些设备在未经许可的情况下，在主人最亲密和私密的时刻录制了他们，也就是说，并未给出唤醒词来示意它们开始监听。设备也没有通过响应来提醒用户它们处于激活状态。相反，Amazon\
    \ 总部非法录制了人们的私人对话，并将其发送到世界各地的后台办公室进行“转录和分析，以便改进我们的软件和语音识别”。关于语音识别是什么，请参见语音定义。\n\
    \n唤醒词可用于 2D 聊天机器人以及 3D 机器人。例如，三星希望你说“Bixby”来唤醒其内置聊天机器人，当然还有史上最著名的智能手机虚拟助手——苹果设备上的\
    \ Siri。Microsoft 将 2D 机器人 Cortana 放到了其 PC 和台式机上，希望用户能对她说话并使用唤醒词来激活这个内置在每台 Microsoft\
    \ 设备中的虚拟助手。许多机器人开发者纷纷效仿，尤其是基于语音的 IVA。我的公司 AI BaaS 也使用此功能。\n\n![Image](img/Glo2.JPG)\n\
    \nGlossary2 © Realfiction, Copenhagen, 2019. 下一代观众着迷地注视着一枚全息火箭在混合现实中以全音效和色彩发射升空。这意味着火箭被投射到你在\
    \ MR 设备或“Deep Frame”（制造商 Realfiction 称其产品为“Deep Frame”）后方看到的真实海洋上，创造出实时体验，尽管全息表演是在工作室或实验室中创建的，旨在利用真实生活场景和音频进行部署。\n\
    \n---\n\n# 作者简介\n\n技术专家 Tania Peitzker 是 AI Bots as a Service 的 CEO 兼联合所有者。这家混合现实德国企业为多语言\
    \ 2D 和 3D 定制虚拟形象构建“大脑”或 AI 机器人全息图。这些独特的类人或中性角色具备语音或语音识别（ASR）功能，可在任何设备上说 130 多种语言。\n\
    \nAI BaaS 在其专有的可定制机器人化算法上投入了十多年的研发；它被称为 VAIP [Virtual Artificially Intelligent\
    \ Patois，虚拟人工智能方言]。要获取她生平和工作的最新摘要，您可以收听 2019 年在她的家乡凯恩斯与 ABC（澳大利亚广播公司）进行的广播采访。时长\
    \ 10 分钟，可在她的作品集网站 www.taniapeitzker.expert 上作为播客在线收听。\n\n![Image](img/About1.JPG)\n\
    \n© Tania Peitzker, 2018 年圣让卡费拉海岸自拍\n\n![Image](img/About2.JPG)\n\n© AI BaaS UG\
    \ 公司徽标，慕尼黑，2019 年\n\n这位拥有波茨坦大学英语语言文学博士学位的澳德双重国籍人士，现为欧洲多所商学院的 AI 管理与数字化兼职教授。由于英国多年的“脱欧动荡”，她从英国往返于位于慕尼黑——她父亲的故乡巴伐利亚——的德国技术企业总部，并将大部分时间花在欧洲大陆上。\n\
