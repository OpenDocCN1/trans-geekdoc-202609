    鉴于持续存在且有时令人惊讶的媒体炒作，以及不道德公司公然误导性的产品/服务描述，我们应对关于机器人及其演进的公开信息保持警惕。极少有学者将聊天机器人或 IVA
    历史，更不用说不道德的技术营销，作为课程的一部分进行讲授，尽管机器人会议和与聊天机器人相关的主题（包括混合现实装置）正在每日增长。


    ## 词汇表术语概览


    会议议程经常提及这些在我们科技行业圈子之外可能鲜为人知的主题。以下术语指代那些在高级商业化（通常为企业级）部署中表现出色的更复杂的聊天机器人：


    *   `Conversational AI`（对话式 AI）

    *   `Conversational interfaces`（对话式界面）

    *   `Interactive interfaces`（交互式界面）

    *   `Cognitive interfaces`（认知界面）

    *   `Cognitive AI`（认知 AI）

    *   `NLU bots`（NLU 机器人）

    *   `NLP bots`（NLP 机器人）

    *   `Chatbots with AI`（带 AI 的聊天机器人）

    *   `Mixed Reality`（混合现实）

    *   `Interactive gaming with chatbot avatars`（带聊天机器人化身的交互式游戏）

    *   `Virtual Reality using the aforementioned`（使用上述技术的虚拟现实）

    *   `Augmented Reality`（增强现实），尽管具有交互性，但尚未实现“机器人化”

    *   `Intelligent Virtual Assistants (IVAs)`（智能虚拟助理）

    *   `Smart Assistants`（智能助手）

    *   `Next-gen bots`（下一代机器人）

    *   `AI bots and AI bots as a service (AI BaaS)`（AI 机器人和 AI 机器人即服务）


    ## 阻碍重工业应用与商业化的原因


    我的公司（商标为 `AI BaaS`）正准备将我们的算法集成到一些有趣的重工业和商业应用中。直到现在，我们或竞争对手尚未实现这一点，原因如下：


    1.  大多数全息软件构建于 `Unity` 和独立源代码中，无法与之集成，即 `API` 不兼容。

    2.  在增强现实（`AR`）应用上，同样它们要么构建于不合适的 `API` 中，要么不允许与开发系统之外的专有算法进行集成。

    3.  用户（即企业客户）尚未意识到在虚拟现实（`VR`）和/或 `AR` 体验中拥有交互式机器人的必要性。

    4.  使用 `VR` 和 `AR` 的应用程序的客户或所有者没有意识到他们的应用并非真正具有交互性。它不使用语音或语音识别（`ASR`），仅通过屏幕或设备上的按钮进行触控交互。

    5.  他们尚未理解自然语言理解 `NLU` 和 `AI` 允许我们将化身注入体验中，以充分实现对话式商业/AI。


    这些只是将更多应用“机器人化”以在混合现实用例中创造更好体验的一些技术原因和障碍。以下将更深入地审视必须由潜在客户克服的态度或心理障碍，以便更广泛地商业化采用聊天机器人、其
    3D `MR`（混合现实）下一代近亲以及 `AI` 应用程序。


    ## 态度为何物？为何颠覆性与新兴技术会被人类思维阻挡？


    “拿不准时，别做”常是我那保守、务实的法兰克尼亚-德国裔移民父亲（其巴伐利亚母亲有一位德国犹太裔父亲）在澳大利亚对子女的教诲。这句谚语源自美国前总统 `Benjamin
    Franklin`。当时恐怕没人会意识到需要一套发明家、活动家和报业大亨 `Benjamin Franklin` 的克隆体——可以说他是美国最早的思想家和技术专家。`Franklin`
    是首任驻法美国大使，他以反权威价值观和实际上采纳的清教徒及启蒙原则，塑造了后来被称为自由民主美国精神的内核。如果我们今天重现这位博学家并将他投入战场——也许作为一个好斗的
    `AI` 机器人全息对手？`Brexit` 和 `Trumpian populism`（特朗普式民粹主义）将是他的劲敌。


    谨慎犹豫地计算可能结果，与我的第五代英裔爱尔兰裔澳大利亚母亲截然不同，她出身首波商人家庭，其座右铭更像“孤注一掷”，这是应对澳洲往往恶劣的气候和社会演变极具挑战性的极其明智的策略。关键在于，我们都由文化历史和特定的跨代经历决定，并通过决策方式、接收新信息及处理信息的方式，传递我们独特的个人故事。特别是在企业或政府背景下，高风险的
    `SaaS` 数百万乃至数十亿欧元预算的管理，不仅取决于组织文化，还取决于管理层所处的更广泛社会中盛行的决策倾向。


    我回想起与我的英国丈夫共度的过去六年，他是肯特郡第七代英格兰农场主。农业风险评估因“情境化”威胁——`Brexit`、消费者行为，当然还有气候变化——而获得全新含义。天气的变幻莫测造成的不确定性，似乎与新技术近乎不可确定的采纳率，以及更重要的、是否能吸引投资和融资以实现规模化扩张目标，可谓异曲同工。首先，耕作农户“默认全球化”，只能根据国际市场价格出售丰收或歉收的成果，通过伦敦城市经纪人出口吨位级食品和谷物供工业用途。


    农民常年独自面对这些往往令人不堪重负的巨大威胁，而科技创业团队相对“幸运”，因为你很少能以个体经营者身份推出颠覆性创新。这意味着你需要在你的“农场”、孵化器领地之外，寻找你独特产品或服务的支持者和推广者——品牌大使——并比典型农民更快地在心理上走出舒适区。


    科技创业者需要尽快向世界推介想法，以测试“市场牵引力”，并维持其新 `SaaS` 产品的用户采纳。与大多数只做“批发”、没有任何形式的 `B2C` 贸易（如农场商店或面向客户的零售业务）的农民不同，科技创业团队与消费者有直接互动，必须从一开始就无畏地面对他们并索取反馈。


    ## 中世纪销售机器案例：`Sir Loin Your Virtual Butcher`（萨洛因虚拟屠夫）


    矛盾的是，在我们位于北肯特、毗邻大伦敦的家族农场上，我们在 2016 年试用了一个定制的 2D 聊天机器人，它本可能成为全球肉类贸易的一股革命性力量：`Sir
    Loin Your Virtual Butcher`。


    `Sir Loin`，即肉排“西冷”，其命名是为了纪念早期中世纪骑士 `Sir Adam de Bavant`。他在随英王 `Edward I` 远征苏格兰的十字军东征中立功，获赐我们的庄园宅邸和大片领地。据传
    `His Majesty` 还封过一块牛排——牛肉最美味的部位，由此得名 `sirloin steak`（西冷牛排）。不过，语言学家也指出该词源于法语 `surloynge`。


    无论如何，我们以为 `Sir Loin` 会吸引当地肯特郡的追随者，并在农场商店讲解新产品，如环保的草饲牛肉和羊肉，这些牲畜由我们纯草饲养殖。接着聊天机器人可以列举所有健康益处，并宣称更健康的动物为人类创造了更健康、更瘦的肉。环保方面，它通过消除我们食用的动物所需的饲料谷物需求，有利于可持续耕作。这种古老的“传统”耕作方式占用了大量土地这一全球资源，而这些资源本可更高效地用于人类粮食生产。


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c1fig3.JPG)


    Figure 1.3 Prototype avatar for cooking, preparing food, buying fresh food, and
    recipes. “Sir Loin Your Virtual Butcher.” © Cliff Lee

