- raw: 'As the serious newspapers’ reporting uncovered, there were two sisters on
    the board/investees of the now insolvent Cambridge Analytic firm, super-rich British
    Brexiteers who ran PR campaigns and worked closely with the key investor Stephen
    Bannon, a Koo Klux Clan support act at the Far Right American news platform Breitbart.
    Bannon of course was later belligerently famous as Trump’s media and strategy
    adviser until he was unceremoniously kicked out of the White House, as have been
    so many of President Trump’s dodgiest acolytes.


    Off the record, I was interviewed by the Technology Editor of the Establishment,
    centuries old newspaper, Die Suddeutsche Zeitung, in Munich about the call to
    ban “social bots” in Germany when I was a keynote speaker at CeBIT Hannover in
    March 2017. He was making the case for Business Bots as opposed to the much feared
    “social bots” possibly about to be banned under German law as a danger to democracy
    if allowed to manipulate people during election time. Note the German commentators
    combined the English keywords into “social bots” to discuss the phenomenon of
    manipulative, NLP 2D chatbots online, as opposed to a term they coined in English
    for German debates on this: “Business Bots vs Social Bots.”


    Incidentally, I have frequently been interviewed off the record by leading technology
    editors. Three times by the BBC to date, with the last in-depth interview being
    about “how does it feel to switch off or deactivate an AI bot that you have created?”
    That was for an in-depth report by Zoe Kleinman in London, who had already interviewed
    me live at an event with peers, the New Yorker “UTTR on Chatbots” conference in
    London.[27](#02_Chapter_2.xhtml#footnote-028)


    I have had several chats with BBC tech editor, Leo Kelion, in person at the Beeb’s
    HQ in London, and over the phone on the subject of the Microsoft Tay.ai hoax.
    I think he had read my VentureBeat article on “What to do when chatbots start
    spewing hate?” which was critical of Microsoft’s “bad bot goes rogue stunt.” As
    explained in this chapter, Tay’s antics had seriously damaged the market for us
    and all other bot developers. Purchasers simply didn’t trust chatbots anymore,
    after all, if a Microsoft bot could get out of control, how could smaller companies
    manage theirs?


    In this chapter and the previous one, I assessed the often kneejerk subjective
    reaction of purchasers when faced with decisions about unknown, “experimental”
    new technologies. In the aftermath of Tay.ai and the media storm that was hyped
    up around it, ignoring the tech bloggers flagging it was probably a corporate
    hoax, the risks implied in adopting NLP chatbots were assessed to be far greater
    than they actually were. It was clearly a case of “when in doubt, don’t” and the
    prospect of potentially being eaten by sharks as a better alternative to breaking
    your neck while riding a horse did not assuage the corporate purchasers or the
    public sector procurement fears.


    Case Study #2: A World First Wayfinder AI Bot Hologram in a German Shopping Center


    Our pilot in a Cologne shopping center turned out to be an adventure, quite a
    drawn out one, but a roller-coaster of successes and failures none the less! We
    made several errors of judgment rather than wrong design choices or flawed code.
    Our proprietary algorithm on our side was solid and performed robustly. However,
    we did not anticipate the glitches from the side of our partners, suppliers and
    client.


    Without going into those mistakes and slip ups in too much detail, I will summarize
    here the objectives and achievements of this deliberately anonymized greenfield
    project with two leading property developers who shall remain unnamed for the
    purposes of this book. Nonetheless determined researchers can find out who they
    are if they look at my ResearchGate profile or the publicly accessible Medium.com
    posts I wrote at the time, including photos from our mall trial.[28](#02_Chapter_2.xhtml#footnote-027)


    My ResearchGate account and Medium author profile was set up to log the findings
    of our pilot after I was interviewed by academic researchers at Harvard, Yale,
    and Delft universities. The published photos and comments would help them to independently
    conduct their research and citing of my company in their work.[29](#02_Chapter_2.xhtml#footnote-026)
    One of the Ivy League researchers considered our Amalia Prototype to already be
    in the league of Google Home and Amazon Alexa (I am under a confidentiality obligation
    so I cannot specify who from where). She told me excitedly, “What you are doing
    is completely different to all the other commercial trials!”


    Perhaps due to the anxieties caused by emerging technology, we lost far too much
    time just negotiating the contracts with the clients and hardware supplier. The
    e-mail chains and chasing the stakeholders could take up over 20 hours a week
    of my time as CEO for months. We first pitched in Cologne in April 2018 and then
    after a series of vacations and absences for the decision makers, plus an unexpected
    replacement of the hardware supplier first chosen by our side, we finally executed
    12 months later.


    We began 2019 with a live demo livestreamed on the last day of January 2019 to
    the Applied Machine Learning Days at the EPFL in Geneva.[30](#02_Chapter_2.xhtml#footnote-025)
    That demo was the sister bot Portia, the Conference AI bot hologram, whereas the
    bespoke Wayfinder bot was Amalia. You can view the three video captures taken
    from the livestream in January 2019 in the film section of my Amazon author profile
    page. Just scroll to the right to find the short videos of Portia in action.[31](#02_Chapter_2.xhtml#footnote-024)


    Note that these two hologram personalities, Portia and Amalia, were built on separate
    bot brains, with specific bespoke content. Portia gives keynote addresses to conferences
    and does Q&A with the audience and moderators, customized to the specific topic
    of the session and overall conference theme. Meanwhile Amalia’s multilingual brain
    has been built to talk mostly about shopping centers, the bespoke list of retailers
    and services within a mall, and the customized content about that point of sale
    for brands as well as the city she finds herself in.


    Preparing the Software, Hardware + Customization for the Multiple Client(s)


    Picture this: as a startup that has been sitting on its R&D for 10 years, we were
    pretty keen to get this (fully unpaid and entirely at our own cost) pilot underway.
    Off the back of this world first Wayfinder, we hoped to attract a whole lot of
    replica sales, the well-known multiplicator effect in sales and marketing. That
    was a calculated risk and investment on behalf of velmai Ltd in the UK.


    Then visualize the harsh realities: me spending six weeks away from my Kentish
    home in my German family’s holiday apartment in Bonn’s Bad Godesberg, so I could
    do the two-hour commute each day by tram directly to the door of the shopping
    center in Cologne. As we had absolutely no cash coming in, only a lot of it going
    out plus all the sweat equity of our programming, bot coaching, customer liaison,
    client coaching, and partner relations, there were very few choices as to how
    to execute this with a zero budget. Self-financed or bootstrapped goes without
    saying!


    Sales and marketing were actually taken care of for free with a Google Maps Local
    Tour Guide account for our twin bot Amalia and Portia. She started posting photos
    of her arrival in Cologne and attracted thousands of views within a matter of
    weeks! This evident curiosity for the deployment of new tech was reflected in
    the comments and engagement of the shoppers when she was finally released into
    the public space of the mall, being located in the center of it right by the escalators
    and across from the elevators.'
