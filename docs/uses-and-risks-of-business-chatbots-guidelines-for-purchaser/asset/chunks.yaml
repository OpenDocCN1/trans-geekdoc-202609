    B2C use or mass consumption, to date largely in Japanese though there is uptake
    for her English version in the United States. However, the personality contained
    in the box is not an AI bot hologram as it is on a loop or repeated content. It
    doesn’t learn from its owner or from interactions with humans to expand its repertoire.


    Having said that, its performance as a standalone 3D hologram satisfying the needs
    of a particular market segment is remarkable. Its best innovation, rewarded with
    a fairly quick M&A takeover by a larger corporation in Tokyo, is the Hologram
    Girlfriend’s success in being an IoT device in home environments, connected to
    the owners’ appliances and being able to text him via his smartphone, a NLP chatbot
    in 3D communicating as a 2D replica with her owner.


    It may be the subject of another book to look at chatbot history by continent,
    for example, in Africa, Asia, India, Australia,[^2] the Americas.[^3] We have
    had RFPs from South America and we noted that the most popular instant messaging
    app there is Telegram, which is also running thousands of interactive, basic NLP
    chatbots for a variety of use cases.


    I stumble across Japanese, Korean, Chinese, Indonesian, Malaysian, and Singaporean
    chatbots constantly, not to mention the thousands coming on the Indian market.
    Many have been around for decades, like these corporate use cases for 2D chatbot
    applications via instant messaging platforms by a South Korean AI company that
    was established in the early 1990s.[^4]


    ## Eight Use Cases for Industry Verticals


    For our marketing collateral, my company AI BaaS defined the following use cases:


    1.  **Wayfinder and infotainment** at malls, airports, train stations, and sports
    stadiums including sponsored marketing targeting “want to know” users during their
    chat sessions with velmai AI bot holograms on site in 3D multimedia format.

    2.  **Conferences and trade shows**—see the Portia experiment. Saves time, money,
    and energy when you can send a bespoke 3D hologram avatar instead of staff! She
    made a speech to AI experts at AMLD and took questions from the floor. The hologram
    can then be installed at the event for further one-on-one interactions.

    3.  **Tourist guide and hotel concierge**—similar to use case 1 but more bespoke
    content answering the FAQs of hotel guests and destination marketing goals.

    4.  **University campuses** for security and timetabling queries regarding room
    changes in real time. 3D is a mascot of the university that we can grant student
    teams access to, that is, they can upload new info via a CRM. The 2D replica can
    disseminate this via the university’s and student clubs’ social media pages. We
    have also been asked to do a Student Welfare bot for psychological support on
    campus.


    [^1]: [03_Chapter_3.xhtml#footnote-060]

    [^2]: [03_Chapter_3.xhtml#footnote-059]

    [^3]: [03_Chapter_3.xhtml#footnote-058]

    [^4]: [03_Chapter_3.xhtml#footnote-057]

