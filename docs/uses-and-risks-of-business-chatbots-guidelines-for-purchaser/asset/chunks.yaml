    ## 图 4.3


    © Cliff Lee & velmai Ltd. kik.com 上的银行家 Sophie。在此次对话中，她寻求澄清，随后在“谁想和谁交谈”的问题上出现了混淆。她的训练进展如下


    ![Image](img/c4fig4.JPG)


    ## 图 4.4


    © Cliff Lee & velmai Ltd. kik.com 上的银行家 Sophie。遵循 GDPR，并在收到特定请求或指令后删除某人的数据。这在聊天中可以做得更通用一些，关于“forget
    about it”（忘掉它）作为一种表达，而不是依据 GDPR 规则行使您的被遗忘权。


    ## 案例研究 #10：因剑桥分析公司丑闻而失单的德国出版商


    2018 年上半年，我在法国蔚蓝海岸的一所国际商学院任教。出于个人和职业原因，我那年的大部分时间都在蔚蓝海岸度过，例如，我们正在为位于圣让卡费拉的面向游客的展厅奠基，那是一个介于尼斯和摩纳哥之间、拥有高端住宅和度假村的奢华半岛。


    我担任兼职教授的 MBA 课程名为“全球化与数字化”。在这个拥有近 100 名来自法国及世界各地学生的冬季学期中，剑桥分析公司丑闻爆发了。当我们在为他们的数字营销硕士学位分析
    Facebook 及社交媒体的使用时，我立即将这起数据泄露和选举操纵事件变成了一个官方案例研究。


    毋庸置疑，我是在亲身经历这个案例研究，而不仅仅是撰写、阅读和教授它！Facebook 突然冻结其 Messenger 聊天机器人平台，直接冲击了我当时在英国的聊天机器人公司。我们原定要在慕尼黑会见一家著名德国出版商的高层管理人员。正如所述，由于保密协议（NDA），我们无法透露他们是谁，也无法透露其行业垂直领域，否则会暴露其身份。我们只能说，这家有着数十年历史的中型企业，在其细分内容的交付和分发方面拥有近乎垄断的地位。这位德国业主想必从澳大利亚报业大亨鲁伯特·默多克的媒体帝国扩张手册中汲取了灵感！


    这家德国媒体细分帝国显然拥有超过 2000 万读者，因此其每个杂志主标题都拥有数百万 Facebook 粉丝或关注者。他们甚至已将业务多元化，拓展到其行业或垂直领域的纯在线内容。并配有相应的
    FB 群组和 WhatsApp 粉丝群，他们在其中讨论电子杂志和博客的文章及议题。


    这是我们的完美客户。我们遇到一些障碍，但即将克服它们时，FB 丑闻爆发了：


    1.  CEO 任命了一位社交媒体经理，负责调研聊天机器人，以及如何将其在线内容平台、每个杂志主标题和兴趣小组的 Facebook 页面“机器人化”。

    2.  问题在于，他是一位年轻工程师和“传统程序员”，对聊天机器人持怀疑态度。他可能与许多糟糕或平庸的聊天机器人交谈过。

    3.  这使得他在商业应用方面很难被说服。他“看不出聊天机器人的用处”。他“不理解聊天机器人对公司的益处”，也不认为它们是好的投资回报。显然，如果他拒绝看到任何优点，只看到他测试的聊天机器人界面的缺点。


    面对这些几乎不懂营销价值、更别提为销售和公关目的进行高效沟通的风险厌恶型工程师的消极态度，我们必须说服这位把关人，我们的聊天机器人将为这家出版公司的利润增加价值。我们让他打开了大门，并安排了他、几位同事和
    CEO 参加的会议，时间定在我在法国蔚蓝海岸的教学学期结束时。


    那年春天我从未去成慕尼黑，因为 Facebook 泄露事件的后果巨大。在我们预定会见德国出版商及其怀疑论者经理的前一周，他们切断了我们对 Messenger
    平台的访问权限。Facebook 随意关闭了所有 2D 聊天机器人提供商的接入。他们突然失去了业务收入，且无法向现有客户做出解释。据我观察，数百家甚至数千家公司在几周内倒闭。谢天谢地，我的公司没有建立在创建和变现
    Messenger 机器人上的商业模式。


    对于我们的竞争对手来说，他们不得不费力解释这不是他们的错。他们不是“可疑分子”，也没有因任何显而易见的原因被科技巨头 Facebook 关闭。他们只是无法访问客户的聊天机器人来控制内容和更新消息，持续了数周甚至数月。且没有任何解释。


    然而，Facebook 解释称，Messenger 机器人平台“正在审查中”，以保护 Facebook 用户并确保他们的安全。可怜的 FB 高管们被不道德的机器人开发者利用和滥用，这些开发者窃取了
    FB 账户所有者的个人数据。这并非 FB 所不知情；他们知道这些数据可被第三方访问，一旦被移除或复制，就会被违规者用于其选择的任何邪恶目的。他们讲了一个故事：FB
    是好的，机器人开发者是坏的，因为他们不值得信任，不会不去利用 FB 历史上对全球数十亿人大规模数据收集中明显存在的漏洞。


    事实是，这是 Facebook 的错。他们的系统本不应允许数据被滥用。但它不仅允许未经用户选择加入的个人数据被窃取用于销售和营销，实际上还从中牟利。他们将这些数据出售给第三方，并未料到会被抓现行。然而我们就身处这场剑桥分析公司“泄露事件”中，那是他们无意中促成或被一群邪恶的机器人开发者、数据挖掘者和政治黑客（误）利用的结果，后者随后试图操纵美国大选、英国大选，以及在那五年期间全球几乎所有有争议的选举或政治竞选。


    所有这些错综复杂的信息、丑闻、支持和反对 Facebook 的头条新闻的综合效应，导致该平台宣称自身无辜，甚至连其传奇 CEO 马克·扎克伯格在面对美国华盛顿部长、英国威斯敏斯特以及基本上全球各国元首的质询时（他们代表关切且理所当然愤怒的公民）也是如此。慕尼黑的那位怀疑论者社交媒体经理决定不干了——聊天机器人风险太大，回报太少。显然，剑桥分析公司事件证明机器人开发者不可靠，对日常运营毫无价值，更别提那个模糊的销售和营销任务了。


    他取消了我们的会议，因为我们无法现场演示为推介准备的聊天机器人。而且没人知道全能的 FB 何时会再次授予我们和其他机器人开发者访问权限。显然，如果控制权可能被任意剥夺，那么对他的雇主来说投资回报率
    (ROI) 就是不稳定的。且科技巨头本身给我们在 FB 平台上的存在蒙上了一层阴影，质疑我们的诚信。


    舔舐伤口之际，我对这个我们亲历、进行危机公关、最终却因之亏损金钱和业务的案例研究进行了后续跟进。Facebook 继续向其数十亿客户推销其自有品牌的机器人，即由硅谷值得信赖的
    FB 程序员内部创建的 Messenger 聊天机器人。没必要冒险去尝试那些未知的、未经考验的、未经测试的外部机器人开发者，他们不是 Facebook，根本不值得信任。


    ## 案例研究 #11：英国某大学工程学院的 2D 和 3D BaaS


    这笔交易源于剑桥的一场非常有针对性的“迷你贸易展”。它是剑桥无线网络系列活动的一部分。主办方称这是首个完全专注于应用人工智能的活动。


    '
