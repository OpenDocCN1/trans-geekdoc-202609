    Case Study #10: German Publisher Lost Due to the Cambridge Analytica Scandal


    The first semester of 2018 I was teaching at an international business school
    on the French Riviera. I spent much of that year on the Cote d’Azur for personal
    and professional reasons, for example, we were laying the foundation for our tourist-oriented
    Showroom on Saint Jean Cap Ferrat, the luxurious half peninsula of high-end homes
    and resorts lying halfway between Nice and Monaco.


    The MBA course I was an Adjunct Professor for was called “globalization and digitization.”
    During this winter semester with nearly 100 students from France and around the
    world, the Cambridge Analytica scandal erupted. As we were analyzing Facebook
    and the use of social media for their Digital Marketing Masters degree, I immediately
    turned the data breach and election manipulation into an official case study.


    Needless to say, I was living the case study, not just writing, reading, and teaching
    it! Facebook’s sudden freezing of their bot platform for Messenger chatbots had
    a direct impact on my chatbot company in Britain at the time. We were scheduled
    to meet the upper management of a famous German publisher in Munich. As explained,
    due to nondisclosure agreements (NDAs), we cannot disclose who they are or their
    industry vertical or it will reveal their identity. We can say this decades old
    mid-sized business has a virtual monopoly over its niche content in terms of delivery
    and distribution. The German proprietor must have taken a leaf from the media
    empire expansion handbook of Australian newspaper monopolist Rupert Murdoch!


    This German media niche empire had apparently over 20 million+ readers and consequently
    millions of Facebook fans or followers for each of their magazine mastheads. They
    even had diversified into online only content for their industry or vertical.
    With the accompanying FB groups and WhatsApp fans who discussed the articles and
    issues of their e-mags and blogs.


    Perfect client for us. We had some obstacles and we were nearly overcoming them
    when the FB scandal broke out:


    1.  The CEO had appointed a Social Media Manager who was investigating chatbots
    and how they could botify their online content platforms as well as their Facebook
    pages per masthead and interest group.


    2.  The problem was he was a young engineer and “traditional programmer” who was
    very skeptical about chatbots. He had probably spoken with a lot of bad or mediocre
    ones.


    3.  This made him very hard to persuade for the commercial application of them.
    He could “not see the use of chatbots.” He “didn’t understand their benefit to
    the company” nor did he think they were a good return on investment. Obviously,
    if he refused to see any pros and only the cons from the chatbot interfaces he
    was testing.


    Against this negative attitude of risk averse engineers who have virtually no
    comprehension of the value of marketing, let alone efficient communications for
    a sales and PR purpose, we had to convince this gatekeeper that our chatbots would
    add value to their bottom line as a publishing house. We got him to open the gates
    and a meeting with him, some colleagues and the CEO was scheduled for the end
    of my semester teaching on the French Riviera.


    I never made it to Munich that spring because the repercussions of the Facebook
    breach were massive. They switched off our access to the Messenger platform the
    week before we were due to meet the German publisher and his skeptical manager.
    Arbitrarily, Facebook shut down all the 2D chatbot providers. They suddenly had
    no business revenue and no explanation for their existing customers. From my observation,
    hundreds if not thousands went out of business within weeks. My company thankfully
    had not built a business model on creating and monetizing Messenger bots. Thank
    goodness.


    For our competitors, they were hardpressed to explain that it wasn’t their fault.
    They were not “dodgy,” and they had not been shut down by the tech giant Facebook
    for any obvious reason. They were simply not able to access their clients’ chatbots
    to control their content and update their messaging for weeks and months. Without
    explanation.


    Facebook explained, however, that the Messenger bot platform “was under review”
    to protect Facebook users and ensure their safety and security. Poor FB executives
    had been used and abused by unethical bot developers who had siphoned off personal
    data of FB account owners. This was not without FB’s knowledge; they knew this
    data could be accessed by third parties and once removed or copied, used for whatever
    nefarious purposes the offenders chose. They told a story that FB was good, the
    bot developers were bad because they could not be trusted to not exploit an apparent
    loophole in FB’s historic, massive data gathering of billions of people on the
    planet.


    The truth of the matter was it was Facebook’s fault. Their system should not have
    allowed the data misuse. But not only did it permit the siphoning off of personal
    data for sales and marketing that was not opted into by the user, it actually
    made money from it. They sold this data to third parties and had not expected
    to be caught out for it. And yet here we were, with the Cambridge Analytica “breach”
    that they had accidentally enabled or been (mis)used by a bunch of nefarious bot
    developers, data miners, and political hackers who went on to try to manipulate
    the U.S. elections, the UK elections, and just about any other contentious election
    or political campaign going on in the world in that five-year period.


    The effect of all this convoluted information, scandal, and headlines for and
    against Facebook was the platform’s professed innocence even by its legendary
    CEO Mark Zuckerberg when confronted by Washington ministers and heads of state
    in the United States, Westminster, and basically the entire globe on behalf of
    its concerned and understandably often outraged citizens. Our skeptical social
    media manager in Munich decided no—chatbots were too much risk, not enough reward.
    Evidently the Cambridge Analytica proved that bot developers were dubious and
    had no value for daily operations, let alone that nebulous task of sales and marketing.


    He canceled our meeting because we could not demonstrate live the chatbot we had
    prepared for the pitch. And nobody knew when the all-powerful FB would grant access
    again to us and other bot developers. Clearly, the ROI for his employer was precarious
    if it could arbitrarily be taken out of our control. And a shadow cast on our
    integrity for even being on the FB platform by the tech giant itself.


    Licking our wounds, I did a follow-up to this case study that we lived through,
    did damage control for, and ultimately lost money and business from. Facebook
    went on to sell to its billions of customers its Home Brand of Bots, Messenger
    chatbots created inhouse by the trustworthy FB programmers in the Silicon Valley.
    No need to take any risk with all those unknown, untried, untested bot developers
    out there who are not Facebook and simply cannot be trusted.


    Case Study #11: Engineering Faculty at a British University for 2D and 3D BaaS


    This deal came about at a very selective, “mini trade show” in Cambridge. It was
    part of the Cambridge Wireless Network’s series of events. And they said the first
    one dedicated wholly to applied Artificial Intelligence.'
