- raw: 'Another curious Trumpian avatar was Donald Trumpbot, which did not quite reach
    900 followers and only had seven likes as a Twitter bot in just over a year’s
    life as a NLP chatbot from 2015 to 2016.[11](#02_Chapter_2.xhtml#footnote-044)
    The similarly defunct Trumpbot also sounded like it was hugely entertaining before
    it too was decommissioned by its satirically minded creators:


    Now, there are some important differences between Donald Trump and Trumpbot to
    keep in mind. There are the obvious ones, of course: Donald Trump is a 69-year-old
    business tycoon; Trumpbot is about 75 lines of code written in the Python programming
    language. Donald Trump is running to be president of America; Trumpbot is running
    on a server somewhere in North America. But there are some upsides to Trumpbot:
    Unlike the real Trump, it will never refuse to answer you (although it might change
    the subject sometimes). It will never demand $5 million for an appearance (although
    it can’t actually appear anywhere except inside a webpage). And it will never
    release a strange letter from its doctor (it has no physical form and, subsequently,
    no doctor). Occasionally Trumpbot’s responses have nothing to do with your actual
    questions. In that way, Trumpbot is certainly Trump-like.[12](#02_Chapter_2.xhtml#footnote-043)


    From what I understand, most of the Messenger bots were built for Facebook pages
    created and run by supporters of the Democrat and Republican political parties.


    Another good example is an American media agency that created the BFF Trump satirical
    chatbot, admitting that it was biased in that it had “worked for the Democrat
    Party before.” However, it is important to note that the two official chatbots
    created as political propaganda weapons for the Clinton campaign were developed
    by staffers with chatbot building skills in her office. A type of political intrapreneur
    I guess you could call this activity or job role.


    \[BFF Trump was a\] Facebook Messenger bot that also sends you some of the most
    offensive things Donald Trump has ever said. The bot aimed at young voters was
    made by SS+K, an agency with a history of working with the Democratic Party. SS+K
    also redesigned the Democratic Party logo, according to Fast Company.


    In recent days, BFF Trump has been one of the most popular bots on Botlist. Elana
    Berkowitz, creator of the HelloVote voter registration bot, has worked with the
    Clinton campaign, but both of the Clinton campaign bots were made in-house by
    the Clinton tech team, a campaign spokesperson said.[13](#02_Chapter_2.xhtml#footnote-042)


    I then read SS+K joined with Dexter to win over $2 million in Venture Capital
    to create a chatbot platform! The same source of this investment info, from the
    same VB report quoted earlier, also recommends the company FutureStates as a nonpartisan
    chatbot provider of politicians as interactive avatars, giving you sources for
    the policies they quote. Unlike many of its peers that only use basic NLP bot
    brains that recognize keywords, so they often give you wrong information for a
    query, for example, why don’t you show us your tax records? With the response
    being a tweet or Instant Message about a tax policy instead.


    Yet as you can see from the BFF Trump Facebook page here, it became deactivated
    very early on in 2016 and had less than 600 fans and followers.[14](#02_Chapter_2.xhtml#footnote-041)
    Given the aforementioned rapturous descriptions, you can see how easily one single
    chatbot can be hyped up just through a good-looking website, some established
    names, credible spokespeople, impressive marketing materials and some serious
    sounding reportage.


    In my ABC Queensland radio interview in July 2019,[15](#02_Chapter_2.xhtml#footnote-040)
    I refer to one of these official chatbot satires created by the Clinton campaign.
    What I explained live on radio was that someone was running a Donald Trump bot
    that was satirical as I only discovered this chatbot was an official party one
    while researching this book post Australian Broadcasting Corp interview.


    The previous report by VB’s Khari Johnson confirms this world first phenomenon
    of an official chatbot “strategically deployed” by a politician during a national
    campaign. Note the “Text Trump” chatbot we are going to look at more closely here
    was designed to live on the official [www.hillaryclinton.com](http://www.hillaryclinton.com)
    website not on social media. Like many of its chatbot cohort, it was a temporal
    avatar that has now been deactivated, that is, it no longer pops up on the Hillary
    Clinton site.


    Johnson does a good bit of investigative reporting by getting statements directly
    from the source of the bot creation (thank you to VB’s standards of reporting
    for the sake of tech posterity!):


    The bot was highlighted in a tweet today by creator and Clinton campaign designer
    Suelyn Yu. It draws on the same backend database as Literally Trump, a hillaryclinton.com
    fact-checking page used during the first presidential debate, a Clinton campaign
    spokesperson told VentureBeat in an e-mail.[16](#02_Chapter_2.xhtml#footnote-039)


    Even more relevant to my other case studies in this book—on the UK Labour Party’s
    Facebook Messenger bot that was cloned multiple times for (illegal) electioneering
    on a supposedly private dating site and the University of Kent internship challenge
    I created for on behalf of another British political Party—is the fact the Democrat’s
    Campaign Office created a second electioneering Messenger bot to highly targeted,
    real vote conversion effect.


    The Clinton campaign also launched the I Will Vote Facebook Messenger bot today.
    It helps you register to vote or verify that you are registered to vote. It can
    also point you to your local polling station, and it says it can answer “any questions
    you have about voting.” The bot was made by the Hillary for America tech team,
    said campaign CTO Stephanie Hannon in a tweet today.[17](#02_Chapter_2.xhtml#footnote-038)


    The example I often cite of The Donald satirical bot was that it scored policy
    points for the Clinton campaign by highlighting the most ludicrous or untenable
    claims of the Trump candidate vis-a-vis fact-checking live. It put basic natural
    language processing, botified, to a good search and find delivery use case. To
    summarize its success:


    *   When a user landed on the official Hillary Clinton website—of any political
    persuasion—they could opt to engage with the Text Trump avatar when the chatbot
    popped up. They could ask him questions, he would chit chat and be engaging while
    delivering Notable Quotes from the Real Life Trump on the campaign trail and links
    to policy documents or videos.


    *   If the user was slow in asking another question, then Text Trump would snappily
    text them saying, “Hurry up and ask me something or you are FIRED!!!” in true
    Trumpian, unilateral tweeting style as we’ve come to know and—for most of us—loathe
    it in terms of serious policy making and delivery for the common good.


    Khari Johnson makes the point that Text Trump is really about Democrat fundraising,
    as the infotainment part of this clever 2D NLP chatbot leads to a conversion target
    or objectives for sign ups and real monetary transactions that all add up in a
    heated political campaign like the last U.S. election.


    It seems that Text Trump was also operating as a Messenger bot on Hillary Clinton’s
    Official Facebook page. As social media histories are still fairly ephemeral,
    we could only confirm this by contacting the journalist or the bot creators directly.
    As Johnson explains, “Eventually, the bot will ask you if you want to receive
    promotional SMS messages from the ­Clinton campaign or ask you to give $5 to the
    campaign.”[18](#02_Chapter_2.xhtml#footnote-037) Meanwhile many of the Clinton
    chatbots, run clearly by Far Right, Breitbart type enthusiasts or pro-Trump bot
    geeks, were clearly out to derail her campaign by redistributing slogans, anti-Clinton
    allegations, and policies designed to counteract the Democrats’ positions.'
