- raw: 'As you will see in these case studies, new technologies and innovation can
    often be blocked by those fearful of change. They become fierce opponents of emerging
    tech, even when their job title or role within the company is to scout for innovative
    ways of doing business.


    Often they fail to counteract the silos, focusing instead on the Software as a
    Service, the price, the cost of implementation, and not the long-term return on
    investment (ROI). Sadly, they can prevent a relationship of trust building between
    the business and the external entrepreneurs, because they have (mis)understood
    their role to be fierce gatekeepers, trying to keep innovators out of the organization
    rather than letting them in.


    Take this survey to see if you tend to be more of an advocate or an opponent of
    technological change in your company or organization. Be truthful with yourself.
    There is no right or wrong. We are just trying to provide self-knowledge about
    your attitudes to risk, change, and innovation. That way if you come out more
    on the opposing side, you might gain more from reading this book and the real-life
    case studies by building an empathy with the situations that the entrepreneurs
    find themselves in. It is often a workplace context that blocks innovation and
    causes it to fail, rather than any inherent weakness or fault of the tech itself.


    Do this Survey Before and After Reading These Mini Case Studies


    Multiple Choice


    1.  If an entrepreneur emails you out of the blue, making a connection to your
    job title and/or industry you work in, how do your respond?


    1.  Be encouraging and ask them for more information and some examples online.


    2.  Send them an irritated email telling them if they want to pitch, then they
    need to email a colleague of yours


    3.  Ignore the email and hope they don’t contact you again.


    1.  You meet an entrepreneur at a trade show or conference. They follow up by
    calling the mobile on the business card you gave them. How do you react:


    1.  Tell them what a nice surprise and promise you will try to organize a meeting
    if your colleagues see potential for a greenfield project.


    2.  Act warily and ask a lot of questions, then schedule a follow-up phone call,
    which you may cancel at the last minute if you are too busy at work.


    3.  Let them know you are annoyed and they should have emailed you first, requesting
    a conference call to be scheduled.


    1.  You are on a flight for work and reading the inhouse magazine, which is presenting
    a whole lot of innovations relevant to your field. You are curious to contact
    some of these company owners about an application or new use case for your company
    so you do the following:


    1.  Rip out the page from the magazine and look them up online as soon as you
    are back in the office. If it checks out, then you email them requesting a conference
    call or meeting.


    2.  Make a note of their names and websites, asking your assistant or junior to
    do some online research on them. If they find anything interesting, you may email
    them but it is not a priority and you have enough to do at work.


    3.  You are amazed that people take risks like this all the time to try something
    new. You mention it at work but nobody really seems interested so you soon forget
    about it.


    4.  Your boss is uptight about the company not competing well in terms of new
    products and services. They say your competitors have invested in R&D and new
    tech. You are asked to do something about this and work out a plan to “catch up”
    with innovation. Your first steps are the following:


    1.  Call a meeting in your department to brainstorm and work out an action plan.
    You crowdsource business intelligence from your team to figure out where your
    company has gone wrong and what sort of innovation would benefit you most.


    2.  You think the management is being harsh because you are convinced your company
    has a solid USP. If it isn’t broken, why fix it? Secretly you think it’s the fault
    of your sales department but you start researching relevant innovations online
    anyway. How you action what you find is causing you some sleepless nights.


    3.  You panic because you don’t agree with the boss. Your department has done
    their best and the last thing you need is to start experimenting with unknown
    technologies. You look up your competitors and feel uneasy that they are coming
    out with new products and services.


    1.  You watch a documentary on TV about how your country needs to support entrepreneurs
    and innovation. Otherwise the future will be bleak if your economy can’t grow
    by leveraging from all those startups and university spin out ventures. You think
    that:


    1.  This is absolutely correct and you can’t wait to get to the office tomorrow
    to do something about it: launching a new greenfield project, setting targets
    for annual R&D pilots and better metrics for measuring your company’s adoption
    of new tech like AI.


    2.  You think it is a depressing version of what is really going on—the startups
    need billionaire backers not you! Why should you feel responsible about whether
    these risk takers get to market or not? Besides you are not well-informed enough
    to make decisions about what new technologies to adopt for your company; best
    leave that to your boss.


    3.  This is not for you. You don’t feel any responsibility for this situation
    and you don’t even understand what AI and similar new technologies are. If your
    boss tells you to do it, then of course you will have to do something. But only
    if you have enough colleagues on board as support to minimize the risk to your
    job and prevent failure.


    Mostly A’s


    You take calculated risks and are adventurous in being a pioneer. You are not
    afraid of failure which requires “corporate bravery” at the workplace. Well done!


    Your commitment to innovation is twofold: you see it as a way for your company
    to make more sustained profits and also a way to promotion for yourself as a champion
    of new tech. You may also be a keen public speaker who wants to attend conferences
    to publicize the pioneering work you are leading at your business or convincing
    upper management to adopt.


    You may even admit to the tech entrepreneurs you hire that you secretly have always
    wanted to start and own your own company. But for various reasons you could not
    take the plunge.


    Mostly B’s


    You are genuinely curious about new technologies and would love to support innovation
    because it fits your creative, tech streak. You also feel some empathy for entrepreneurs
    who are taking high risks for the benefit of society. However, you prefer that
    others at your work take the lead and be the advocate to management. After sign
    off, you are more than happy to push the project forward to a satisfactory conclusion.


    Once you feel confident the project is a clear success, you would be willing to
    participate in media and marketing to promote the “win” for your company, the
    local tech scene and national goals for innovation. But only when others agree
    the pilot has succeeded conclusively.


    Mostly C’s


    You are really afraid of using new tech personally and also because you fear that
    there may job consequences, that is, you could lose your job if the experimental
    project goes belly up! You are reluctant to take any responsibility for something
    as risky as “new tech.” The idea of emerging tech scares you because of all the
    unknowns.


    You need to see a first mover before even entertaining the idea of talking to
    the entrepreneur or colleagues about a greenfield project or pilot. And even if
    you were convinced or pressured to adopt new tech like AI from the top down, you
    would need reassurances from your managers and supervisors that you will not made
    liable for any failure or risk.'
