- raw: 'A Guardian investigation has established that 140 councils out of 408 have
    now invested in the software contracts, which can run into millions of pounds,
    more than double the previous estimates. The systems are being deployed to provide
    automated guidance on benefit claims, prevent child abuse, and allocate school
    places. But concerns have been raised about privacy and data security, the ability
    of council officials to understand how some of the systems work, and the difficulty
    for citizens in challenging automated decisions.[1](#Introduction.xhtml#footnote-018)


    What has this got to do with chatbots or Artificial Intelligence? As it turns
    out, the embodiment of these “automated systems and software contracts” is going
    to be 2D online Virtual Assistants who will converse 24/7 with the citizens they
    are meant to serve. Chatbot Public Servants, no less! And the systems referred
    to actually use Machine Learning or AI tech to automate their number crunching
    and processing of people’s data.


    Significantly, British government’s reported budgets for just this one application
    or use case has been—up until the time of writing this book, which is literally
    “Brexit eve”—in the multiple billions of pounds, not just millions of sterling.
    Here is a quick tally of the numbers exposed in the investigative journalism of
    the left-wing newspaper and media ­platform, The Guardian in London:


    *   The Department for Work and Pensions (DWP) hired around 1,000 IT staff over
    18 months.


    *   In that time, they increased spending to about £8 million per annum on an
    “intelligent automation garage” to develop over 100 welfare robots; 16 are already
    communicating with claimants of welfare payments, according to The Guardian.


    *   The DWP spokesperson interviewed described the overall departmental, government
    budget as “£95 billion for a compassionate safety net creating a digital service
    that suits the way most people use technology.”


    *   The official, openly accessible, published DWP Digital Budget has risen by
    17 percent to £1.1 billion over a 12-month period.[2](#Introduction.xhtml#footnote-017)


    The Guardian’s special investigation—which I discuss again in the “Intrapreneurship”
    section of [Chapter 5](#05_Chapter_5.xhtml) and in the Conclusion of this book—was
    echoed by the right-wing tabloids after the leftist reporters broke the news.
    The Mirror followed The Guardian’s headline of “March of the ‘Welfare Robot’ Triggers
    Fear for Poorest” and its editorial comparing the British “digital poorhouse”
    to the negative, democracy threatening developments in the United States, India,
    and Australia.[3](#Introduction.xhtml#footnote-016)


    As The Guardian explained on its front page, this British “Ministry” or federal
    department for social welfare payments and retiree’s public pensions had engaged
    foreigners (mostly Americans) to run these systems that would create a “digital
    identity” or check your profile online to detect fraud and (over)payments. “As
    well as contracts with the outsourcing multinationals IBM, Tata Consultancy and
    Capgemini, it is also working with UiPath, a New York-based firm co-founded by
    Daniel Dines, the world’s first ‘bot billionaire’ who last month said: ‘I want
    a robot for every person.’”[4](#Introduction.xhtml#footnote-015)


    I discuss this UK example again in the Intrapreneurship section about the public
    sector, the Government Guidelines and Checklists. Suffice to say at this point,
    the confusion around the terms “robot,” “chatbot,” AI, and automation are evident
    in this tabloid story. When you scroll to the bottom of The Mirror report, you
    discover that actually no “robots” nor chatbots for that matter have actually
    been deployed by the DWP. Not a single member of the public has used the Conversational
    AI interface of the American billionaire: “A 2018 blog by DWP senior product owner
    Shaun Williamson said officials were ‘exploring the potential of chatbots’—claiming
    they could cut calls about sickness benefit by 200,000 per week. A DWP spokeswoman
    said there are not currently any claimant-facing chatbots in the system.”[5](#Introduction.xhtml#footnote-014)


    This is a clear example of the hype and fears surrounding chatbot deployment.
    Anxieties seep from the public domain into the private homes of the collective
    “user,” spurred on by the media bandying about misconceptions even misinformation
    within a single article. It is important to stress though their overarching ethical,
    human rights concerns about data protection and privacy are indeed be valid. Too
    often however, the commercial outcome is that the private sector providers of
    Bots as a Service (BaaS), are left high and dry in the confusion.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/intro2.PNG)


    I.2 © Cliff Lee, Devon, 2019. Prototype of a chatbot newsreader presenting the
    news from the European Union’s RSS news feeds in Australia. This botification
    was too early to market as users/readers did not even know what a chatbot was
    in 2011–2012, let alone how to use it. Nor were chat apps in existence, it could
    only be trialled online via a website


    I do not wish to discount the genuine fears and examples of the automation system
    “gone wrong,” where according to the aforementioned journalists, claimants have
    died from hunger (in India), suicided, or had mental breakdowns ending in homelessness
    (in the UK and the United States). That is truly appalling and inexcusable when
    “the system” lets them down in such tragic, inhumane ways. The United Nations,
    at the time of writing, was just about to release an alarming report on “UN studies
    of poverty in the UK and US, as well as submissions from experts and governments
    from 34 countries,” warning of the dangers of “digitising social protection…addressing
    the harassment, targeting and punishment of those living in the digital poorhouse.”[6](#Introduction.xhtml#footnote-013)


    Yet I believe that it is infinitely worse for welfare recipients and vulnerable
    elderly or disabled to be caught in human-caused backlogs that delay their payments
    because of staff inefficiencies and loss of oversight by managers. With the media
    ready to “get on their case,” we must be confident that government bodies like
    the DWP will have “real people” available to “solve complex cases” once the (chat)bots
    have flagged urgent and/or life-threatening situations, as the officials are indeed
    promising in the following. For the sake of balanced reporting, the Guardian’s
    social affairs correspondent included “the Government’s response” by a DWP spokesperson
    who basically makes my argument mentioned earlier:


    The DWP said humans remained available to help: “We continue to invest in frontline
    colleagues, from phone lines to work coaches to front-of-house staff,” said a
    spokesperson. “This means people who struggle with digital services, or are worried
    about a wrong decision, can get the help they need.”[7](#Introduction.xhtml#footnote-012)


    The massive British public sector budgets for this one “vertical”—social welfare
    and pensions—and its use cases within just one governmental department demonstrate
    conclusively that chatbots are here to stay. In 2016, the well-known, American
    financial news platform Business Insider (though it’s now German-owned by Axel
    Springer), predicted that by this year, 80 percent of businesses globally would
    have, be planning for, or want a chatbot integrated into their back end CRMs and/or
    public facing systems.


    The survey included responses from 800 decision makers including chief marketing
    officers, chief strategy officers, senior marketers, and senior sales executives
    from France, the Netherlands, South Africa, and the UK. When asked which emerging
    technologies they are already using and which they intended to implement, 80 percent
    of respondents said they already used or planned to use chatbots by 2020.[8](#Introduction.xhtml#footnote-011)'
