- raw: 'The only clue we had to yet another cancellation preproduction was that the
    Project Manager who had engaged with us over lunch, actually a senior executive,
    had been seconded suddenly to another country and there was “new management” in
    the UK subsidiary. They were not open to continuing discussions of bots and botification
    to support users to find content on their site.


    It could have helped users to locate videos and films they wanted to view. More
    importantly, it could have promoted and publicized content they were not going
    to discover on their own. Being an in-house trusted corporate publicist, on-demand
    24/7 in any language would have sent hit rates and user engagement skyrocketing.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c3fig2.JPG)


    Figure 3.2 © Cliff Lee in Devon. “Charlie the Spoof Newsreader” was a prototype
    2D chatbot for this content managing bot that was to promote the shows and topical
    documentaries online and also conduct “mini polls” and user quizzes on behalf
    of the brand or client


    Yet again, internal politics and problems at a global multinational corporation
    led to the obstruction of low-cost innovation and the delay of this emerging tech
    adoption.


    Case Study #7: An Internationally Franchised TV Show: 2D Search and 3D AI Bots


    We won the invitation to pitch for this TV deal, similar to the other on demand
    one discussed in this section, in an unexpected way. I had given a guest lecture
    at the prestigious Cambridge Judge Business School. It was announced as a talk
    on AI bots from an industry perspective. And the next thing I knew there was a
    huge queue to get into their biggest auditorium, with students having to sit in
    the stairwell and stand in the aisles.


    After I spoke for nearly an hour on the Japanese Girlfriend and botification generally
    (see my discussion of this in [Chapter 1](#01_Chapter_1.xhtml)), someone who had
    RSVPed but could not attend in person met with me one-on-one in Cambridge. They
    worked at a famous broadcaster and within a month or two, we were having a meeting
    with the Executive Producers of this nationally well-known TV show, which was
    also available online.


    They had spent a lot of money on Amazon Alexa skills.[5](#03_Chapter_3.xhtml#footnote-056)
    And they wanted us to fix them because they weren’t really working to their satisfaction.
    The growing customer, user, and developer dissatisfaction with the product and
    bots as a service is relatively easy to find in (ironically) critical reviews
    on Amazon.


    127 customer reviews


    ![Image](/library/view/uses-and-risks/9781949443448/Images/Capture.JPG)


    MR G S BOOTH


    2.0 out of 5 stars Waste of money


    July 13, 2018


    Format: Paperback Verified Purchase


    This really is a waste of money—it’s easier to find much more info on the Internet.
    Why Amazon cannot produce a proper Manual (including all the commands Alexa can
    understand) along with complete instructions as to how to set up all the built
    in skills beggars belief. Finding out for example that after setting up a free
    Spotify account, it isn’t until you try and link it that you are told it must
    be a paid premium account. This sort of time wasting is infuriating.


    37 people found this helpful


    Review of an Amazon Echo book on how build Alexa Skills.[6](#03_Chapter_3.xhtml#footnote-055)
    I discuss the problems arising socially and psychologically with the mass uptake
    of Amazon Alexa globally in [Chapter 6](#06_Chapter_6.xhtml), in the conclusion
    and afterword of this book.


    The skills that had been taught to the Alexa platform were meant to give search
    results from their massive archive via voice queries. However, the Amazon API
    and bot development was having trouble:


    1.  Understanding the voice queries;


    2.  Responding appropriately; and


    3.  Finding the correct results.


    One of the biggest problems was that to create the skills and then correct these
    issues was taking a lot of time, more human resources than they had anticipated
    and wasting a lot of time of their TV production crew and back office. That was
    not what they had bargained for when paying for this development. And then paying
    more again to fix the problem.


    Why were we offered the job and then it was rescinded within a week? Because they
    didn’t want to pay us because we were a no-name startup. We were meant to fix
    Amazon Alexa skills for this famous TV show forfree and then go on to provide
    our better-performing AI bot with full integration into their archive and database
    of search results/user demanded content for free. Of course we said no. No, we
    didn’t want the fame of working without pay for a famous TV production. Global
    or not. No thank you.


    Case Study #8: Chamber of Commerce 2D Chatbot for Membership Recruitment


    Again I am not sure which side initiated this first. I think we were interested
    in becoming members of this chamber. Then the CEO became personally interested
    in our technology, pilots, and innovation. We became his protege project within
    the organization for at least 12 months leading up to the U.S. elections at the
    end of 2017.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c3fig3.JPG)


    Figure 3.3 © Cliff Lee. “Sir Loin Your Virtual Butcher” and several of our 2D
    chatbot pilots inspired the prospective client to ask us to “fix Amazon Alexa”
    because the food-related “Skills” were not working. See Sir Loin’s avatar in my
    Introduction which discusses this “alternative farm butchery and sustainability
    comms” case study


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c3fig4.JPG)


    Figure 3.4 © Cliff Lee, cofounder of viledge Ltd. This was the prototype startup
    before velmai. It was a social forum before social media i.e. before Twitter,
    chat apps and Facebook. Its purpose was remarkably similar: to connect people
    with each other through the use of “undercover” or incognito 2D chatbots. We were
    pioneers in deploying online bots who texted each other and the human members
    on the site, recruiting user numbers into the tens of thousands all on their own,
    without disclosing themselves as chatbots


    In one way, this was an incredibly simple bot to build, and in another, it was
    hugely challenging in terms of stakeholder interests! It took over a year to negotiate
    due to us being put in a role of service provider with special privileges. For
    example, we were going to be used as an exemplary proponent of chatbots in business.
    This would lead to us running a forum and networking group within the organization
    for members to explore notification, not just with us obviously but with all service
    providers.


    We were about to create this female avatar who was to be the websiteʼs meet and
    greet bespoke bot. Her primary purpose was to recruit new members and also keep
    existing members abreast of events and initiatives. What happened? Without giving
    away the name of the longstanding entity, I can only say that a monumental election
    took place in their country of origin. From one month to the next, the CEO was
    replaced. Most of his team was sacked. And we were suddenly notified that the
    whole deal was off.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c3fig5.JPG)


    Figure 3.5 © Realfiction, Copenhagen, 2019. Image of a hardware device to house
    AI bots in hologram form or high quality holographic visuals. In 2020, we see
    the beginning of a shift from 2D online platforms to Mixed Reality devices that
    enable a person to obtain and hear information via voice. The hologram design
    is improving rapidly so that they will be able to replace website interfaces.
    People will interact with animated images, moving pictures and command the 3D
    visuals by speaking, interacting with gestures and chatting. What is already known
    as Conversational Commerce (applied to business) or Conversational AI


    * * *


    [CHAPTER 4](#contents.xhtml#c4)


    [Winning “Buy In” From Internal and External Stakeholders](#contents.xhtml#c4)


    Are You an Advocate of New Tech or an Opponent?'
