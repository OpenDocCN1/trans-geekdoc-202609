    ## 剑桥分析公司丑闻与媒体报道


    正如严肃报纸的报道所揭露，已破产的剑桥分析公司董事会/投资人中有两位姐妹，她们是超级富有的英国脱欧支持者，经营公关活动并与关键投资人 Stephen Bannon
    密切合作。后者是美国极右翼新闻平台 Breitbart 的三K党支持者。Bannon 后来作为 Trump 的媒体和战略顾问而臭名昭著，直到被不体面地踢出白宫，这与
    Trump 总统许多最可疑的追随者的下场一样。


    ## 德国媒体对“社交机器人”的讨论


    在 2017 年 3 月我在 CeBIT Hannover 做主题演讲期间，我接受了德国百年老报《南德意志报》技术编辑的非公开采访，地点在慕尼黑，内容关于德国呼吁禁止“社交机器人”。他在为“商业机器人”辩护，反对人们所担心的“社交机器人”，后者可能根据德国法律被禁止，因为如果允许它们在选举期间操纵民众，就会对民主构成危险。请注意，德国评论家将英文关键词组合为“social
    bots”来讨论网络上操纵性的 NLP 2D 聊天机器人现象，这与他们为德国辩论创造的英文术语“Business Bots vs Social Bots”形成对比。


    ## 与主流媒体的深度交流


    顺便提一下，我经常接受领先技术编辑的非公开采访。迄今为止已接受 BBC 采访三次，最近一次深度采访是关于“关闭或停用你创建的 AI 机器人是什么感觉？”那是
    Zoe Kleinman 在伦敦制作的一个深度报道，她之前已经在伦敦的 New Yorker “UTTR on Chatbots” 会议上现场采访过我和同行。[^1]


    我曾多次与 BBC 技术编辑 Leo Kelion 面谈，地点在伦敦的 BBC 总部，也通过电话讨论过 Microsoft Tay.ai 事件。我想他读过我在
    VentureBeat 上的文章“当聊天机器人开始散布仇恨言论该怎么办？”，该文批评了 Microsoft 的“失控坏机器人噱头”。正如本章所解释的，Tay
    的行为严重损害了我们和所有其他机器人开发商的市场。购买者不再信任聊天机器人，毕竟，如果 Microsoft 的机器人都能失控，小公司怎么管理得了自己的机器人？


    在本章和上一章中，我评估了采购者在面对未知的、“实验性”新技术决策时，往往表现出的膝跳式主观反应。在 Tay.ai 事件及其周围被炒作的媒体风暴之后（无视科技博主指出这很可能是一场企业骗局），采用
    NLP 聊天机器人所暗示的风险被评估为远大于实际风险。这显然是一个“存疑不买”的案例，即“被鲨鱼吃掉比骑马摔断脖子好”这种前景，并不能缓解企业采购者或公共部门采购的恐惧。


    ## 案例研究 #2：德国购物中心的世界首个向导 AI 机器人全息投影


    我们在科隆购物中心的试点项目变成了一场冒险，过程相当漫长，但充满了成功与失败的过山车式体验！我们犯了几个判断错误，而非错误的设计选择或有缺陷的代码。我们专有的算法可靠且表现稳健。然而，我们没有预料到合作伙伴、供应商和客户那边出现的故障。


    不深究那些错误和失误的细节，我在此总结这个刻意匿名的绿地项目的目标和成就，项目涉及两家领先的房地产开发商，为本书目的暂不透露其名称。不过，有决心的研究人员如果查看我的
    ResearchGate 个人资料或我当时撰写的公开 Medium.com 帖子（包含商场试验照片），就能找出他们是谁。[^2]


    在我接受哈佛、耶鲁和代尔夫特大学的学术研究人员采访后，我建立了 ResearchGate 账号和 Medium 作者档案，以记录我们试点的发现。发布的照片和评论将帮助他们独立开展研究，并在其工作中引用我的公司。[^3]
    一位常春藤盟校的研究人员认为我们的 Amalia 原型已经处于 Google Home 和 Amazon Alexa 的水平（我有保密义务，无法透露具体是谁）。她兴奋地告诉我：“你们在做的事情与所有其他商业试验完全不同！”


    或许是由于新兴技术引起的焦虑，我们在与客户和硬件供应商谈判合同时浪费了太多时间。邮件往来和追踪利益相关者每周可能占用我作为 CEO 的 20 多个小时，持续了几个月。我们于
    2018 年 4 月在科隆首次推介，随后由于决策者的假期和缺席，加上我们最初选定的硬件供应商意外更换，最终在 12 个月后才签署合同。


    我们于 2019 年 1 月 31 日开始现场演示，向日内瓦 EPFL 的应用机器学习日直播。[^4] 该演示的是姊妹机器人 Portia，会议 AI 机器人全息投影，而定制的向导机器人是
    Amalia。你可以在我的 Amazon 作者个人页面的影片部分查看 2019 年 1 月直播中拍摄的三个视频片段。向右滚动即可找到 Portia 实际运行的短视频。[^5]


    请注意，这两个全息投影人格 Portia 和 Amalia 构建在独立的机器人大脑上，拥有特定的定制内容。Portia 面向会议发表主题演讲，并与观众和主持人进行问答，内容针对特定会议主题和整体会议主题定制。同时，Amalia
    的多语言大脑主要用于谈论购物中心、商场内定制的零售商和服务列表、以及品牌的销售点定制内容和她所在的城市。


    ## 为多个客户准备软件、硬件 + 定制


    想象一下：作为一家拥有 10 年研发积累的初创公司，我们非常渴望启动这个（完全无偿且完全自费）试点项目。依托这个世界首个向导机器人，我们希望吸引大量复制销售，即销售营销中众所周知的乘数效应。这是
    velmai Ltd 在英国经过计算的风险和投资。


    再设想一下残酷的现实：我离开肯特的家，住在波恩 Bad Godesberg 的德国家庭度假公寓里长达六周，以便每天乘电车往返两小时，直达科隆购物中心大门。因为我们完全没有现金流入，只有大量流出，加上我们在编程、机器人训练、客户联络、客户指导和合作伙伴关系上的所有汗水股权，在零预算下执行此项目的选择非常少。自筹资金或自举式创业更是不言而喻！


    销售和营销实际上通过 Google Maps Local Tour Guide 账户免费为我们的双子机器人 Amalia 和 Portia 解决了。她开始发布抵达科隆的照片，在几周内吸引了数千次浏览！当她最终被释放到商场的公共空间时，位于扶梯旁和电梯对面的中心位置，购物者评论和互动中体现出的这种对新技术部署的明显好奇心显而易见。


