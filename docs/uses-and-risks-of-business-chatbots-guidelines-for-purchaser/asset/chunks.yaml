  trans: '


    因此，终止作为绿地项目创建的那个试点项目，给内部创业者带来的财务痛苦较小，因为他们毕竟是领薪员工，并且拥有情感上的安全感——确切知道下一笔薪水何时到账。且会提前被告知，如果项目“失败”或终止，他们的薪资将会停发。


    通常，这些团队成员会由人力资源部重新部署到公司的其他部门，并且因完成了这个与著名品牌 X 或知名公司 Y 合作的试点项目而变得更具“就业竞争力”。受雇进行实验所获得的声誉，使他们在就业市场上处于有利地位，因为其中许多人会被处于扩张期的新企业“战略性招募”。因此，那些愿意承担更多财务风险、接受初创公司这种相对不稳定的雇佣形式的人——或许已获得风投或天使投资支持，或靠初期收入维持——通常在初创生态系统中会有多个职位可供选择。


    我对某人个人、文化、种族及心理层面的风险承担态度，以及长期适应高压环境能力的评论，将在很大程度上决定一名内部创业者是转为全职薪金或合同制员工，还是留在永远波动、充满不确定性的新兴科技领域。即使你最终获得了
    C-suite（高管层）头衔，而公司里不足五个人！工作更多、灵活性更大、对业务发展的掌控更强，希望能以此换取更多财务收益和直接的薪酬“回报”，以补偿那种忙碌的生活方式。


    两者都面临销售死胡同，只是内部创业者受到的保护更好。初创公司缩减规模或突然倒闭，可能意味着创业者失去房产、汽车和积蓄。这就是风险、汗水股权和“亲身下注”的含义！


    正如本书通过众多案例研究所明确指出的，为提案请求、演示、合同谈判及项目启动准备投入了巨大工作量，却突然陷入“销售死胡同”，这对许多创业者来说可能是致命的。企业采购方和公务员采购部门必须时刻意识到，他们正在与社会中的高价值创新者打交道。仅凭这一点，他们就值得尊重。并在沟通项目获批并付款的概率——或不获批的原因时，给予礼遇。


    遗憾的是，在当今全球社会，新企业常被公私部门“利用完就弃”。许多大型公共广播机构、电信运营商、能源巨头、国有基础设施（如交通或大型银行）拥有源源不断的资金，让研发部门运行并扩张数十年。但将它们谨慎、保守的绿地实验与初创企业在极度紧张预算下进行的“生死软启动”和“高调大推广”相比，前者成果寥寥。这些内部创业者常对组织外的新兴竞争对手“吊着胃口”或虚假接触，承诺许可其小众创新并为其软件或设备付费。


    然而，我必须指出这一悲哀的现实——基于道听途说和亲身经历——十有八九，这些充满信任的初创企业会被榨取其专有技术、创意，甚至公然窃取其知识产权。这些成果被领薪的内部创业者复制，或被高管们通过他处“更便宜”地修改采购，因为这些高管认为直接打交道那些看似游手好闲、过度激情的创业者太麻烦，且若日后项目搞砸，可能会给他们个人带来无法挽回的地位损失。


    回顾我在初创生态系统领域的 20 年，从柏林到悉尼、伦敦到旧金山、墨尔本到新加坡、法国到非洲，以及看似不可撼动的美国科技巨头的统治地位——它们有时像卡特尔一样协同行动，在互联网影响力和定价上达成一致，仅受到来自中国、日本和韩国为数不多、同样不透明的技术垄断巨头的制衡——我可以看到创新是如何被无耻地扼杀的。


    美国民主党领袖伊丽莎白·沃伦及其团队理所应当地呼吁遏制美国科技巨头摧毁和阻挠甚至初出茅庐的竞争对手的权力。事实上，Facebook 公开承认他们有一套“雷达系统”，用于探测来自全球初创生态系统的任何新兴威胁，哪怕只能抢走它们极微小的一小部分市场份额。


    当一个城市的生态系统出现威胁时，我们看到了属于 FAANG 集团的其他科技巨头迅速采取的扼杀行动，因为现在大多数创业中心都是按城市和区域基础设施建立的。它们收购有前景的初创公司，将其纳入自家的“青年未知数”马厩。大公司对小公司的并购，在主流媒体中普遍被描绘为凯旋，以及该并购发生地的科技中心（由政府投入数百万纳税人的钱建设）实现商业化成功的典范。


    多么悲哀，下一代创新者被其官方政府出资方、国家资助的商业顾问、科技律师、会计师，以及最重要的是其生态系统同行告知：终极目标和成功的衡量标准，是被一家通常是美国的公司收购？立志成为世代相传的家族企业去哪了？靠创新本身以及创造独特卖点（USP）所投入的数十年资源和无偿劳动，让公司自行运营并盈利去哪了？


    立志成为德国人所说的、颇受尊敬且常令人羡慕的“中型企业”（Mittelstand，中坚力量）的一员去哪了？甚至在公开股票市场上市似乎也已从可实现的里程碑中被移除，取而代之的希望是你或许能被合并或收购。并因拥有将创业“推过终点线”的那份七天无休的辛勤工作和无数小时变现的眼光，而被视为聪明的赢家。


    如果你倾向于出售给大竞争对手，而不是坚持经营公司并使其成为科技巨头的挑战者，这表明你对自己知识产权的稳健性失去了信心。当然，作为全球经济中的小角色，它们会搞破坏、让你日子难过。但我认为这个问题必须在我们中间被提出来。从买方和卖方、创新者和采购方来看，在工业
    4.0 的技术时代，创新必须蓬勃发展。


    如果科技创业者过于愿意在大竞争对手伸手索要时，就毫不犹豫地交出他们的知识产权和专有算法，市场的多样性、有竞争力的价格和质量提升的动力将从何而来？


    ## 3. 实验


    以下摘自乔纳森·赖琴塔尔关于“政府服务的未来”需考虑的五件事的清单。他和这篇论文的合著者确定了政府采购的最佳实践，以及政府采纳新技术的最佳实践。3 面向公务员和政府官员的前两项“推荐行为”是（a）领导力和（b）愿景。以下是赖琴塔尔和乔杜里关于其他最佳实践及其应用领先案例的论述：欧盟的爱沙尼亚、中东的迪拜和阿拉伯联合酋长国（UAE）。


    '
  toc: []
- raw: 'In our research we have found that agencies that have great constituent experiences,
    are also open to experimentation of ideas. They prototype and pilot. They try
    different approaches. They take more risk. They also recognize that failure is
    an option and if they do fail, they learn and then move forward. Experimentation
    is a favorable behavior and a contributing factor in almost all successful innovation.


    4\. Cocreation


    Great organizations build solutions together with their customers. They bring
    them in early, they experiment and design together, and then they deploy together.
    All stakeholders, internal and external, take responsibility when there is success
    and humbly accept when things don’t work out right. In the government, bringing
    in constituents to cocreate solutions adds enormous value to the process. At a
    minimum, they will likely have great ideas that haven’t been considered from the
    perspective of the government agency, and they will be able to guide the process
    of enhancing the customer journey.


    5\. Action


    Finally, an agency can have all the leadership and vision it needs, but if it
    doesn’t have a disposition for action, it’s all for nothing. Sure, action has
    risk and there are always many reasons to defer, stall, and postpone. But action
    is where, well, where the action is! Agencies with a proclivity for doing things,
    even when the outcome is more uncertain than they would like, move the ball forward.
    A vision for high quality government experiences requires a lot of action versus
    a bureaucratic approach that plagues most government entities.


    The Future


    There are many examples to point to, but we particularly think the e-service work
    in Estonia reflects the five behaviors we’ve identified. They provide the best
    outcome of a deliberate effort to change the game in government experiences. Another
    good example can be cited from the work happening in Dubai and Abu Dhabi in the
    United Arab Emirates (UAE) where the government is leading from the front in enhancing
    the customer experience around services using multiple techniques like mystery
    shopping, cocreation, experimentation, prototyping, service bundling based on
    life events, and more.


    Sure, the situations in Estonia or UAE have their own uniqueness, but our five
    behaviors are not aligned with any particular culture or circumstance. In fact,
    we recognize that these five behaviors can be applied in a wide variety of contexts.
    Use them liberally.


    There’s a remarkable opportunity all over the world to change how people engage
    with government. It’s not only essential for better outcomes, but it’s what constituents
    would like to experience. The tools, techniques, and talent exist. What remains
    is a choice.


    At the World Government Summit in Dubai in February this year, leaders from around
    the world discussed these challenges at a government services forum. You can read
    the report of that discussion here: [https://gx.ae/en/resources/government-services-forum-at-the-world-government-summit-2019-detailed-report](https://gx.ae/en/resources/government-services-forum-at-the-world-government-summit-2019-detailed-report)


    Afterword


    As I finish writing this book at the end of autumn 2019, I look back on my physical
    and virtual journeys while working on it for the past year or so. Almost in a
    “multiverse” sense! As an ad hoc subscriber to the Posthumanism school of thought,
    where IT innovation can optimistically improve our daily lives and introduce Equal
    Opportunity rather than destroy it, I am also a mystic in the sense of the Japanese
    and their Shintoism, which allows them to form meaningful relationships with not
    just AI-infused robots and objects but the spiritual forces of nature.


    More and more people are making the connection between Shintoism and a way to
    “deal with” AI-powered entities, such as the BBC’s Aleks Krotoski in her Digital
    Human Series episode on “Animism:”[4](#06_Chapter_6.xhtml#footnote-072)


    Aleks Krotoski explores our anxieties around AI and automation. Comparing western
    philosophy to that of the east, she’ll ask if some of fears around technology
    are cultural. Much of western thinking is still strongly influenced by Christian
    traditions which places humanity at the top of the tree of creation. We rebel
    against anything that challenges that. Whether it be Galileo telling us we’re
    not the center of the universe or Darwin telling us we’re nothing more than shaved
    monkeys.


    It can be argued that the invention of AI is just that sort of challenge to our
    supremacy. But in Japan they see things very differently; Shintoism leads to a
    philosophy without the Christian hierarchy. In their “creation” everything is
    alive and connected to everything else. Just like the modern digital world. What
    can we learn from looking at technology differently.


    I share the “general public’s” concerns about how the unchecked, that is, unregulated
    roll out of Artificial Intelligence applications can be detrimental for large
    segments of a country’s population. In [Chapter 2](#02_Chapter_2.xhtml) with the
    first case study, I raised the alarm of what happens when we get chatbots influencing
    humans during an election campaign. This has now been proven to be the case with
    the noncompromising Zealot Bots as named by University of Cambridge researchers.[5](#06_Chapter_6.xhtml#footnote-071)


    The Guardian’s expose, as discussed earlier in this book, has pointed to the international
    creation of a “digital poorhouse” that is being created by the governments of
    the United States, UK, Australia, and India primarily, according to their investigative
    journalism.[6](#06_Chapter_6.xhtml#footnote-070) It is not so much the robotic
    form of humanoid robots like Pepper running amok or playing with our emotions
    and manipulating humans, as in the 2019 German cult classic documentary Hi, AI
    so cleverly presented to us in narrative filmic form, rather it is the AI-powered
    applications like facial recognition and data mining that causes me sleepless
    nights.


    Facial recognition unchecked, as the UK Civil Liberties groups have determined
    by calling out police use of it without the public’s awareness, and even corporate
    use of facial recognition on the streets around Kings Cross and London—maybe elsewhere
    in the UK, who knows?—is now on the agenda of Civil Rights organizations to fight
    within their own countries, not abroad in developing or poor countries where we
    normally expect human rights to be broached if not consistently abused. They are
    taking their cause to the TV talk shows and the internet social media forums.
    Facial recognition technology’s main problem is its low success rate or big failure
    to correctly identify people. For that reason, it has recently been banned by
    the U.S. authorities in policing because it cannot reliably identify criminals
    and/or distinguish between the sought target and ordinary members of the public.


    Do you know you are under surveillance by AI-powered software? If not, how can
    you find out? The starting point is obviously all the surveillance issues surrounding
    the tech giants and social media companies’ use of our personal data and private
    messaging. For me the biggest risks are social manipulation and deskilling of
    humans—basic “skills” like raising children and how to vote, things that are so
    private and public but never been disrupted in a negative way to the core.'
