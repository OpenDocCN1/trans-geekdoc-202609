    ---


    # Chapter 6


    # Conclusion


    ## Support the Local Economy, Regional Infrastructure, and National Productivity
    Goals


    There is a strong case to be made that as Procurement and Purchasing specialists
    and decision makers, you should put your immediate goals for your company or government
    body in the wider context of innovation development. How did this innovation come
    to be? Was it from your immediate regional infrastructure in terms of a tech hub,
    incubator, or accelerator that has been largely funded by taxpayers’ money? Is
    the new venture a privately owned startup with transparency over who owns the
    intellectual property? Or is it a spin-out from a large corporation or a university,
    which means the entrepreneurs do not necessarily own the IP completely?


