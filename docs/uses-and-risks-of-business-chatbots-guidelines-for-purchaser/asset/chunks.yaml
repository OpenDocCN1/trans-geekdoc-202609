    # 《卫报》对自动化福利系统的调查


    《卫报》的一项调查确定，在 408 个地方议会中，有 140 个现已投资软件合同，金额可达数百万英镑——是此前估计的两倍多。这些系统被部署用于提供福利申请的自动化指导、预防儿童虐待以及分配学位。但人们对隐私和数据安全、议会官员理解某些系统运作方式的能力，以及公民质疑自动化决策的难度提出了担忧。1


    ## 与聊天机器人和人工智能的关联


    这与聊天机器人或人工智能有什么关系？结果表明，这些“自动化系统和软件合同”的具体化身将是二维在线虚拟助手，它们将全天候 24/7 与其服务的公民对话：简直就是聊天机器人公务员！而所提及的系统实际上使用机器学习或
    AI 技术来自动化其数字运算和人员数据处理。


    ## 英国政府预算分配


    值得注意的是，就在撰写本书之时——字面上就是“脱欧前夕”——英国政府据报仅针对这一应用或用例的预算就高达数十亿英镑，而非仅仅数百万英镑。以下是伦敦左翼报纸和媒体平台《卫报》调查性新闻曝光的数字快速统计：


    *   劳动与养老金部（DWP）在 18 个月内聘用了约 1,000 名 IT 员工。

    *   在此期间，他们将“智能自动化车库”的支出增加到每年约 800 万英镑，以开发 100 多个福利机器人；据《卫报》报道，其中已有 16 个正在与福利金领取者沟通。

    *   受访的 DWP 发言人将部门总体政府预算描述为“950 亿英镑，用于打造一个充满同情心的安全网，创建一项适应大多数人使用技术方式的数字服务。”

    *   官方公开发布的 DWP 数字预算在 12 个月内上涨了 17%，达到 11 亿英镑。2


    ## 媒体报道与公众反应


    《卫报》的这项专项调查——我将在第 5 章的“内部创业”部分和本书的结论中再次讨论——在左翼记者爆出新闻后，得到了右翼小报的呼应。《每日镜报》跟进了《卫报》的标题“‘福利机器人’大举进军引发对最贫困者的担忧”，及其将英国“数字贫民窟”与美国、印度和澳大利亚负面的、威胁民主的发展进行比较的社论。3


    正如《卫报》在头版所解释的，这个负责社会福利支付和退休人员公共养老金的英国“部”或联邦部门，聘用了外国人（主要是美国人）来运行这些系统，这些系统将创建“数字身份”或在线检查您的档案以发现欺诈和（超额）支付。“除了与外包跨国公司
    IBM、塔塔咨询和凯捷签订合同外，它还在与 UiPath 合作，这是一家总部位于纽约的公司，由丹尼尔·迪内斯共同创立，他是世界首位‘机器人亿万富翁’，他在上个月表示：‘我想让每个人都拥有一个机器人。’”4


    我将在关于公共部门、政府指南和清单的内部创业部分再次讨论这个英国案例。此时只需说明，这篇小报故事中围绕“机器人”、“聊天机器人”、AI 和自动化等术语的混淆显而易见。当你滚动到《每日镜报》报道的底部时，你会发现实际上
    DWP 并未部署任何“机器人”，更不用说聊天机器人了。没有一位公众成员使用过这位美国亿万富翁的对话式 AI 界面：“DWP 高级产品负责人肖恩·威廉森 2018
    年的一篇博客称，官员们正在‘探索聊天机器人的潜力’——声称它们每周可减少 20 万通关于疾病福利的咨询电话。一位 DWP 女发言人表示，系统中目前没有任何面向领取者的聊天机器人。”5


    这是围绕聊天机器人部署的炒作与恐惧的一个典型例子。焦虑从公共领域渗透到集体“用户”的私人住宅中，这是媒体在单篇文章中混淆视听、甚至传播错误信息所煽动的。但必须强调的是，他们关于数据保护和隐私的总体伦理和人权担忧确实是合理的。然而，商业结果往往是，在混乱中，作为服务的机器人（BaaS）私营部门提供商被晾在一边。


    ![Image](img/intro2.PNG)


    **I.2** © Cliff Lee, Devon, 2019. 聊天机器人新闻播报员原型，在澳大利亚展示来自欧盟 RSS 新闻源的新闻。这种机器人化上市太早，因为用户/读者在
    2011-2012 年甚至不知道什么是聊天机器人，更别提如何使用它了。当时聊天应用也不存在；只能通过网站在线试用。


    ## 人力成本与系统性低效


    我无意淡化自动化系统“出错”的真实恐惧和案例，据上述记者报道，领取者因饥饿而死（在印度）、自杀，或因精神崩溃而流落街头（在英国和美国）。当“系统”以这种悲剧性、非人道的方式让他们失望时，这实在是令人震惊且不可原谅的。在撰写本书时，联合国即将发布一份令人不安的报告，内容关于“联合国对英国和美国贫困的研究，以及来自
    34 个国家的专家和政府提交的材料”，警告“数字化社会保护……针对生活在数字贫民窟中的人们的骚扰、针对性打击和惩罚”的危险。6


    然而我认为，对于福利领取者和弱势老人或残疾人来说，因员工效率低下和管理者监管缺失导致的人为积压拖延付款，后果要糟糕得多。在媒体随时准备“追究其责任”的情况下，我们必须确信，一旦（聊天）机器人标记出紧急及/或危及生命的情况，像
    DWP 这样的政府机构将像官员们承诺的那样，安排“真人”来“解决复杂案件”。为了平衡报道，《卫报》的社会事务通讯员引述了 DWP 发言人的“政府回应”，基本上印证了我前面提到的论点：


    > DWP 表示人工服务依然可用：“我们继续投资一线同事，从电话热线到工作教练再到前台员工，”一位发言人说。“这意味着那些在使用数字服务上有困难，或担心决策错误的人，可以获得他们需要的帮助。”7


    ## 市场预测与采用趋势


    英国公共部门仅针对这一“垂直领域”——社会福利和养老金——及其在仅一个政府部门内的用例所投入的巨额预算，确凿地证明了聊天机器人将长期存在。2016 年，著名的美国财经新闻平台《商业内幕》（虽现由阿克塞尔·施普林格集团拥有，属德资）预测，到今年，全球
    80% 的企业将会拥有、计划拥有或希望拥有集成到其后端 CRM 和/或面向公众系统中的聊天机器人。


    该调查包含来自法国、荷兰、南非和英国的 800 名决策者的回复，包括首席营销官、首席战略官、高级营销人员和高级销售主管。当被问及他们已在使用哪些新兴技术以及打算实施哪些技术时，80%
    的受访者表示，他们已在使用或计划在 2020 年前使用聊天机器人。8

    '
