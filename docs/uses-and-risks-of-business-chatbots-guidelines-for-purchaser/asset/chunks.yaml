- raw: '5.  As my key VB article also pointed out, it is the main reason we have been
    blocked by the advertising industry: top-performing bots produce the most transparent,
    cost-effective return on investment with absolute clarity of metrics.[19](#Introduction.xhtml#footnote-000)


    Overarching Benefits of Commercial “Botification” Use Cases


    *   The reason there are hundreds of thousands of bot developers is because businesses
    want them!


    *   They work! They are adding value to the enterprise—its branding awareness,
    sales and marketing campaigns—and improving the bottom line with direct sales
    and cost savings through more productive staff.


    *   Despite the past decades of simplistic, “legacy,” manually coded chatbots,
    who have now been overtaken by the smarter, more versatile and cognitive AI bots,
    the evolution has carved out a path for the incumbent next-gen AI bots with voice.
    It has propelled improvements to the 2D hybrids of machine and humans interacting
    to improve customer service and satisfaction in the Experience Economy for the
    post-Millennial generation.


    *   Big brands and big corporations are creating their own cross-platform bespoke
    bots inhouse because they add value B2B and internally for staff relations, employee
    contentment, and stakeholder interest and involvement.


    *   Banks are now adopting them after initially rejecting them; they trust their
    performance now after many greenfield projects and pilots by them and competitors.
    Often these trials were done internally for staff to use so the banks’ customers
    never interacted with these first generation chatbots.


    *   Fintech in the form of financial services and more transparent credit checks—under
    GDPR you have the potential to get your personal data more quickly and reliably
    asking a chatbot instead on an online contact form or phone call, ditto if you
    want your private info deleted.


    *   Real estate and intensive service bots are converting more leads to sales.


    *   FAQs for customer service use cases, sales and marketing for all verticals
    and industries at scale are working! See the British Ubisend’s myriad of published
    case studies on their corporate website as just one example, or LivePerson, CreativeVirtual,
    PandoraBots, ChatFuel, Inbenta, Watson, Artificial Solutions and so on.


    *   Mental health bots to tackle depression epidemic and morbid obesity, dieting,
    and welfare of youth to stop cyberbullying, self-harm, suicide.


    *   See Case Study #5 about an (anonymized) embassy or diplomatic mission wanting
    to curb hate speech on its Facebook page run from London.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/intro4.JPG)


    I.4 Here the robot “Pepper” is deployed in a Home Environment and so becomes an
    “anti-loneliness measure” purchased by a son for the mental health of his solitary
    mother in Tokyo. This “real scene with real people not actors” was recorded in
    a German documentary which follows the human-machine relationships in this family,
    in parallel to a Road Trip love story involving another robot and human American
    (see [Chapter 5](#05_Chapter_5.xhtml) for illustrations). Taken from the film
    “Hi, AI” by Isa Willinger © Kloos & Co Medien, Berlin, 2019


    * * *


    [CHAPTER 1](#contents.xhtml#c1)


    [A Brief Historical Overview of Botification](#contents.xhtml#c1)


    The world first saw the concept of interactive bots emerge in the 1950s with Professor
    Alan Turing’s attempts to recreate his lost boyfriend in a machine. Then came
    the prototypical chatbots Alice and Eliza as the first intelligent agents operating
    as machine–human interaction.


    These botified, female 2D avatars were the beginning of the post-1960s application
    of the now famous Turing Test. Derived from Professor Turing’s musings on the
    emergent field, it says we as a species will have achieved Artificial Intelligence
    (AI) when laypeople talk with a computer. If after five minutes of conversing
    via the machine interface they are not sure if it is a human or not they are chatting
    with, then the Turing Test for reaching AI will have been reached.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c1fig1.JPG)


    Figure 1.1 Timeline of “chatbot evolution” from the 20th to the 21st centuries,
    developed for conference talks, pitches, and business plans. © Cliff Lee, CCO
    from velmai Ltd


    The prerequisite for this test—best known as the annual chatbot championships
    symbolized by the Loebner Prize originally from New York—is that the human participants
    do not know from the outset which of their conversational partners via a cognitive
    interface is the actual machine, or what has come to be known as a chatbot.


    The English computer scientist from the 18th century Ada Lovelace is now acknowledged
    as the founding “mother of AI.” The previous chart begins with its most popular
    “founding father” of definitions of AI bots, chatbots, virtual assistants, and
    cognitive interfaces or human–machine interaction, the computer scientist, engineer,
    and code breaker Alan Turing from the United Kingdom. The chart was used as a
    sales pitch document by velmai Ltd, a 2D chatbot early stage venture that I co-owned
    for many years in Britain.


    We have progressed from 2D bot development to botification of cognitive interfaces.
    Portia the Conference Bot hologram gave a keynote speech on her own when she was
    livestreamed from our Porto Lab via our Devon Lab—within seconds—to Lausanne for
    the Applied Machine Learning Days in January 2019. We have a busy 12 months ahead
    for Portia and other bespoke AI bot holograms who have been requested to be autonomous
    keynote speakers at AI conferences and trade shows around the world.[1](#01_Chapter_1.xhtml#footnote-020)


    I contemplated writing this guidebook and checklist compilation without my industry’s
    jargon. However, for the purposes of this text that would in fact be counterproductive.
    This book is meant to be educational and a helpful tool in the upskilling of corporate
    managers and government decision makers for the ever more difficult software-as-a-service
    (SaaS) purchasing decision they must make. Therefore the best remedy against confusion,
    panic, and dismay that I may be speaking an incomprehensible mish-mash of labels,
    terms, and hipster speak designating emerging tech and trends is the glossary
    at the end of this book.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c1fig2.JPG)


    Figure 1.2 “Portia the conference AI bot” hologram was livestreamed to the prestigious
    Swiss annual conference, the Applied Machine Learning Days (AMLD) in Lausanne
    in January 2019. Here you see the bot brain in its second iteration, as Amalia
    the Wayfinder with Portia as an alter ego who is activated with a spoken “wake
    word.” © AI BaaS UG, Munich, 2019


    Please use it. Frequently. It is the best way to learn new stuff, especially terminology,
    definitions, and concepts, if you keep flicking back to the glossary to check
    your understanding and memory of various combined definitions that “crossover”
    or converge into in the fascinating world of what is now known universally as
    “AI.” Robots and Terminators aside, there is a lot of content that is quite straightforward
    and a “no brainer” once you read a short simple definition for a baffling term
    or concept. Use this book equally as a dictionary and a guide, a hands-on list
    of things to watch out for and selling points to check in any sales pitch or contract
    negotiation.


    Practice certainly does make perfect. However, I truly understand the impulsive
    urge to press the panic button when this often hyped up field of science—and increasingly
    widespread “sales- inspired, misselling” fiction—becomes overwhelming and inconsistent.
    Unfortunately for some of the best innovators and entrepreneurs in our individual
    societies, wherever we may live or have emigrated to, the knee jerk reaction of
    purchasers has been paralysis.'
