- raw: 'So ending that pilot you have created as a greenfield project causes less
    financial pain to the intrapreneurs because they are, after all, salaried staff
    and have the emotional security of knowing when the next paycheck arrives. And
    being notified ahead of time that their pay will end if the project has “failed”
    or is discontinued.


    Often these team members will be redeployed by HR to other parts of the company
    and have become more “employable” by virtue of having done this pilot project
    with famous Brand X or established Company Y. The kudos of having been paid to
    experiment puts them in a good place in the employment market as many of them
    will be “strategically recruited” to new ventures that are scaling up. So those
    who are prepared to take more financial risks and be in a less secure form of
    employment in a startup—perhaps already backed by VCs or a business angel, or
    otherwise existing on first revenues—will usually have a choice of positions in
    the startup ecosystem.


    My comments on someone’s personal, cultural, ethnic, and psychological attitude
    to risk-taking and ability to adapt to pressurized situations for long period
    of times will greatly determine whether an intrapreneur converts to a full-time
    salary or contract employee status instead of staying in the permanently fluctuating,
    ever uncertain emerging tech scene. Even if you do end up with a C-suite title
    and there are less than five of you in the business! More work, more flexibility,
    more control over the business development, and hopefully resulting in more financial
    benefits and direct payment “rewards” in return for the hectic lifestyle.


    Both have a sales dead end though the intrapreneurs are better protected. A startup
    winding down or ending suddenly could mean the entrepreneurs lose their house,
    car, and savings. That is the meaning of risk, sweat equity, and skin in the game!


    As this book makes clear with reference to many case studies where enormous amounts
    of work and preparation went into requests for proposals, presentations, contract
    negotiations, and readiness to begin the project yet ended abruptly in a “sales
    dead end,” this can be fatal for many entrepreneurs. Corporate purchasers and
    civil service procurement units must, at all times, be aware that they are engaging
    with high-value innovators in society. They are to be respected for that fact
    alone. And treated with courtesy when communicating the probability of projects
    being approved—and paid for—or the reasons as to why they may not.


    Sadly in today’s society globally, new ventures are routinely “used and abused”
    by both the public and private sectors. Many like big public broadcasters, telcos,
    energy corporations, state-run infrastructure like transport or large banks have
    endless funds to keep R&D units going and growing for decades on end. With very
    few results when you compare their careful, cautious greenfield experiments with
    the do-or-die soft launches and big splashes of startups on a shoestring. These
    intrapreneurs often “lead on” or falsely engage their emerging competitors outside
    of their organization, promising to license their niche innovation and pay them
    for their software or device.


    However, I must flag the sad circumstance—from hearsay and personal experience—that
    nine times out of ten, these trusting young ventures are exploited for their knowhow,
    ideas, and often blatantly their intellectual property. It is copied by the salaried
    intrapreneurs or else modified and sourced elsewhere “cheaper” by executives who
    think having to deal directly with apparently freewheeling, overly passionate
    entrepreneurs is too much hassle and potentially an irreparable loss of status
    for them personally if things go belly up down the track.


    Looking back over my 20 years in this startup ecosystem space, from Berlin to
    Sydney, London to San Francisco, Melbourne to Singapore, France to Africa and
    the overarching dominance of a seemingly unassailable U.S. tech giants, at times
    working in unison like a cartel in terms of internet presence and pricing, countered
    only by comparatively few, equally opaque, technology monopolizing monoliths coming
    out of China, Japan, and South Korea, I can see how innovation has been shamelessly
    stifled.


    The U.S. Democrat leader Elisabeth Wilson and her cohort have rightfully called
    for U.S. tech giants to be curtailed in their power to destroy and obstruct even
    fledgling competitors. In fact, Facebook openly admits they have a “radar system”
    to detect any emergent threat coming from the global startup ecosystem that could
    take even a fraction of a fraction of their market share away.


    We see the fast-acting, smothering actions of other tech giants belonging to the
    FAANGs when a threat emerges from a city’s ecosystem, as most hubs of entrepreneurship
    are now developed per city and via regional infrastructure. They buy up the promising
    startup and put it in their stable of young unknowns. The M&A of a small company
    by a giant corporation is universally portrayed in the mainstream media as a triumph,
    and a commercialization success story for the respective government that has poured
    millions of taxpayers’ money into building the tech hub the M&A took place in.


    How sad it is that the next generation of innovators are being told by their official
    government funders, the state-sponsored business advisers, their tech solicitors,
    accountants, and above all their ecosystem peers that the ultimate goal and measure
    of success is to be bought by an invariably American corporation? What happened
    to aspiring to be a family-owned company run for generations? What about making
    the innovation and all the decades of resources, unpaid, used to create the USP,
    pay for itself by keeping the company going yourselves?


    What about aspiring to become an SME or KMU part of the Mittelstand (middle sector)
    as it is called, quite respectfully and often admiringly, in Germany? Even a listing
    on the public stock exchanges seems to have been removed as an achievable milestone
    in the hope you might just be merged or acquired instead. And be considered a
    smart winner for having the nous to cash in on your hard work and endless hours
    of your seven day week to get your venture “over the line.”


    It signals a loss of confidence in the robustness of your intellectual property,
    if you prefer to sell out to a big competitor rather than keep the company going
    and make it a challenger to the tech giants. Sure, they sabotage and make life
    tough for you as small fry in the global economy. But I think this issue has to
    be raised among us. From the buyer and seller side, the innovators and the purchasers
    need innovation to thrive and grow in the technological age of Industry 4.0.


    If the tech entrepreneurs are all too willing to hand over their IP and proprietary
    algorithms at the drop of a hat to a giant competitor, where will the diversity
    of the market and drive for competitive prices and quality improvements come from?


    Following is an excerpt from Jonathan Reichental’s list of five things to consider
    for the “future of government services.” He and his coauthor of this paper have
    identified what makes best practices for government procurement and above all,
    governmental adoption of new tech.[3](#06_Chapter_6.xhtml#footnote-073) The first
    two “recommended behaviors” for civil servants and government officials are (a)
    leadership and (b) vision. Here is what Reichental and Choudhury say about the
    other best practices and leading examples of where they are applied: Estonia in
    the EU, Dubai in the Middle East, and the United Arab Emirates (UAE).


    3\. Experimentation'
