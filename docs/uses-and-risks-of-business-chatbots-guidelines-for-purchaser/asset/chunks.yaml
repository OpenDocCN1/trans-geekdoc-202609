- raw: 'Our sales representative in Melbourne even had to do an hour-long interview
    with inspectors from the Department of Education for the 2D high-school chatbot
    that we are meant to create for the Smart City roll-out with the university down
    the road and the local government for outdoor tourism and locals infotainment
    Wayfinder. As discussed in [Chapter 1](#01_Chapter_1.xhtml) of this book, the
    attitude of the purchasers as much as the structures they are bound up in are
    the biggest problems in blocking and adopting emerging tech like AI and botification.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c4fig5.JPG)


    Figure 4.5 © In future, when a user requests their data to be deleted, they will
    need to ask the holographic AI bot brain they see in front of them in a device
    like this. Using their voice, they can tell the 3D avatar to delete their information
    if it was opted in by them during Conversational Commerce. That would be Privacy
    by Design under the EU’s GDPR laws. Or the bot developer can build bot brains
    with Privacy as Default, which is what AI BaaS UG does so that our 3D AI bot holograms
    do not ever collect the information of the people they are chatting with, unless
    they specifically request them to give permission for example for a market survey,
    a branding poll or customer feedback that is opted in to


    Case Study #12: Global Cruise Ship Line for Conversational AI Bespoke 2D and 3D
    Avatars


    This deal came about after a meeting at an industry-specific conference for their
    vertical. I approached the MD after he presented the company’s innovative plans
    as a keynote on the last day. This became a multimedia deployment before the idea
    of mixed reality installations really took hold in the tech world.


    We were asked to quote on doing 3D and 2D AI bot holograms for a fleet of smart
    ships, cruise liners to be precise. This well-known corporation has been in the
    passenger cruise ship holidays business for many decades. They wanted to innovate
    and weren’t happy with our competitor forcing their guests to always say Alexa.
    We offered to give the avatar(s) their own bespoke corporate names.


    We won the contract that took months to negotiate and write up the licensing agreement
    details because our competitors were unable to do the following:


    1.  They could not name the avatar in a customized way.


    2.  The wake words needed to be personalized to each ship in the fleet plus have
    an overarching brand option.


    3.  Most importantly, our competitors could not deliver on the tech specs requiring
    the algorithm to be portable.


    On the last point, let me explain. We needed to put the servers on the ship because
    the company did not want our bots to be using the satellite to power them. That
    would cost a lot of money if 7,000 passengers were all chatting to our bots at
    various times of day and night. Like the old fashioned, expensive landlines but
    out at sea! They could not use Wi-Fi out there either.


    So the only option was for us to put two or three servers “down below” in their
    data room in the bottom of the cruise liner. They initially asked if we could
    put our algorithm on their existing servers on board. No way! Then we could lose
    our intellectual property! Even if the client didn’t deliberately steal our source
    code, our “secret sauce,” it would be opening ourselves up to hackers would take
    our decade of hard programming work away from us, without pay, and probably never
    to be traced on the Dark Web.


    The company postponed the whole pilot just as we were about to start work on the
    first 3D and 2D AI bots. The feeling we got as to the reasons were the following:


    *   Their passengers were not yet ready as the trial ships for the existing 2D
    chatbot were not seeing the wished for uptake. There were also app development
    problems.


    *   Apart from the marketing and user adoption issues on board and on shore, one
    of our key competitors put in a very aggressive bid for this contract. From what
    we could tell, they tried to copy what we had put in the quote and contract. However,
    they were unable to deliver.


    We know our competitor did not deliver for this lost/postponed client because
    they:


    *   Tried aggressively to recruit our team through a third party HR squad who
    kept calling me and offering any salary for us to disband our venture and join
    theirs;


    *   We haven’t seen any PR or marketing about the accomplished tech goals we had
    set for this roll-out in the middle of the ocean! and


    *   To our knowledge, we still don’t have competitors able to condense their algorithm
    down to a few portable servers that operate independently out at sea and do not
    rely on satellite internet or any type of Wi-Fi to the main data center onshore.


    Case Study #13: Recovering Lost Languages: Aboriginal and Islander Voices


    This highly innovative application came about while meeting with other prospects
    and leads. We were investigating how we could implement the AI bot hologram Wayfinder
    on the Australian campus, when I thought to catch up with an old school friend
    who is now a Professor of Indigenous Languages and Cultures at this institution.
    She and her colleagues mentioned how much recovery work their linguists were doing
    so that the next generation would be able to know and speak their tribe’s long
    lost languages and vocabularies.


    I asked if there were any AI-powered databases around that were promoting the
    linguists work and digitizing their salvaging of lost words and meanings. Aboriginal
    and Islander languages were not written after all, so this has been a massive
    task in voice cultures. Right up our alley! Oral cultures and oral history that
    was being revived by voice recovery, recording the phonetics, pronunciation, meaning,
    and definitions for each clan, tribes, and region in Australia and the Torres
    Strait Islands!


    No, there wasn’t. Enter AI BaaS with our newly ordained task of teaching our Australian
    bots the required local “black languages” of the Aboriginal and Indigenous tribes
    in the area. We did a quick check before our on-site discussions with the clients:
    New Zealand has managed to restore Maori and have it as a language on Google Translate.
    It must be technically possible with our technology and voice plug-ins into our
    bespoke bot brains. We just require the users or the willing participation of
    the subjects we are doing this for. The native speakers of these First Peoples’
    tongues!


    Weeks later, I happened to go on a guided tour of a state art gallery in Sydney
    where they were keenly interested in exhibiting the contemporary artworks of Aboriginal
    and Islander artists from around the country: painters, sculptors, and especially
    Installation art. My personal guide affirmed that the gallery had consulted local
    linguists to correctly display the signs and descriptions for each artwork. It
    was another example of recovered speech and that was reinforced by my visit to
    the NSW Library bookshop that was showcasing “recovered black languages” so linguists
    popularizing this phenomenon to the general public.


    These books contain a lot of presumably digitized tables of lexicons, dictionaries,
    thesaurus, and glossaries, in other words they are emerging dictionaries we can
    use to feed this exciting new social enterprise bot brain. Curiously, upon my
    arrival in Munich this week to open our headquarters of AI BaaS in Bavaria, I
    fielded an enquiry from an elderly German man who I suspect was nearly 100 years
    old or past the centenary mark. He was a Bohemian—they were/are a German-speaking
    group or tribe if you like in former Czechoslovakia, in what was once called Prussia
    and also up around the Polish border, known in English as Silesia. This “Old Boy”
    as I name him, is also a leader that ethnic minority’s association in Germany.'
