    ## 结束语：奥巴马机器人


    有一个奥巴马机器人曾在华盛顿奥巴马总统的政府官方页面上正式运行了一段时间。如果你读过约翰·布兰登在其 VentureBeat 评论文章中对奥巴马机器人的分析，他对其显而易见的局限性进行了相当尖锐的批评。19
    布兰登有力地论证了我在这本书中所主张的观点：有许多先进的机器人技术因为被视为新兴技术而遭到封杀，未能走向市场。


    这并不是说奥巴马机器人故意阻挠其更具颠覆性和 AI 能力的“表亲”们。然而，正如布兰登所言，选择一个“稳妥之选”——一个在服务常见问题时重复乏味的 NLP
    聊天机器人——对聊天机器人行业是一种损害。它本应是历史上最著名的聊天机器人——或者理应成为最著名的一个——但显然，它已在不如它强大却更臭名昭著的聊天机器人（如
    `Tay.ai` 和 `Eugene Goostman`）的光芒下被遗忘，后者据称于 2015 年在伦敦皇家学会通过一场精心策划的尝试通过了图灵测试。20


    ## 尤金·古斯特曼 2014 年“赢得”图灵测试：聊天机器人炒作的争议？


    雷丁大学的凯文·沃里克教授早已于 2008 年在其大学举办过洛布纳奖或图灵测试，当时来自德国和瑞典的 `Elbot` 获胜。21 沃里克向来是个有争议的人物，例如，他曾声称自己是世界上第一个半机械人！正如我当时在博客中所写，真正的过错在于媒体（包括
    BBC），他们以“不加掩饰”的标题——“计算机 AI 在‘世界首例’中通过图灵测试”——引发了一场相当激烈的国际媒体炒作浪潮。22


    一些勇敢的博主和在线科技新闻平台（如《赫芬顿邮报》和 Mashable）站出来反对夸大其词的说法，质疑古斯特曼 2D 聊天机器人通过了图灵测试。23 我也曾向科技编辑提供一些不公开的分析，因为我不想被视为竞争对手，试图贬低包括英国皇家学会高层在内的多家机构备受全球赞誉的成就。毋庸赘言，在聊天机器人历史上，借助几个著名名字来炒作技术进步是多么容易，例如那些不知情地被拉来公开测试
    `Eugene Goostman` 的名人——在伦敦皇家学会拍摄电视节目——并作为一场全球图灵测试运行，以庆祝艾伦·图灵诞辰，这位英国赠予 AI 世界的礼物。


    ## 德国对政治聊天机器人和剑桥分析公司骗局的反应


    如果你认为我在夸大政治制造的聊天机器人对上届美国大选的影响，请三思。欧洲人怀着民主和知识分子的恐惧，注视着垃圾机器人在 Twitter 上所谓的“娱乐性”推进——参见前文对微软
    `Tay` 精心策划事件的讨论，以及其继任者 `Zo` 如何愚蠢到在 2019 年被停用，此前仅运行了几年，用户相对较少，且几乎没有关于微软“神奇 AI 机器人”的公关或技术讨论。事实是，如果
    `Tay` 如此聪明，她的妹妹 `Zo` 怎么会如此平庸，显然只是另一个 NLP 聊天机器人。


    与此同时，购买者对机器人技术失去了更多信任。垃圾机器人，特别是 Twitter 和 Facebook 上的骚扰型，或 Skype 和 `kik.com` 上的骚扰型，实际上已经破坏了严肃机器人开发者的市场。直到
    2020 年，糠秕才从干草中分离出来，因此才有了本书的理由和时机。


    回顾过去十年，我的 2D 聊天机器人创业项目在英国徘徊在上市前的研发阶段，这对互联网监管、隐私法、竞选规则以及社会大众在社交媒体和网站上遭遇大量低性能、单一维度的
    2D 聊天机器人冲击后的总体福祉和满意度，产生了什么后果？


    德国总理默克尔的反应——得到其更为保守的巴伐利亚盟友基民盟（CDU）的支持，后者诡异地与德国绿党和 `Die Linke`（左翼党，曾是东德共产党）在这个问题上罕见地保持一致——建议禁止能够影响选举的社交（媒体）机器人。这一政策（如果不是立法）呼吁发生在剑桥分析公司丑闻曝光和中情局确认俄罗斯干预美国大选之前。英国情报机构和其他来源也表明，俄罗斯（至少通过
    Facebook 广告操纵，并有一些证据显示使用了政治化聊天机器人）在英国大选中也这样做了，当然还有那场极具分裂性的脱欧公投。


    我在 第 6 章 的后记中再次讨论了上述政治事件。如果你不知何故错过了剑桥分析公司滥用数百万人 Facebook 数据进行政治定向的全球性隐私泄露事件，我强烈建议你观看
    2019 年 7 月发布的 Netflix 纪录片《大黑客窃取案》（*The Great Hack*）。这是对该丑闻深远维度的最佳分析和总结。24


    《大黑客窃取案》未能展示剑桥分析公司的投资者是拥有激进议程的脱欧派，以及公司投资者中有过去和现在的保守党议员，更不用说英国前国防部长和其他公务员了。所有这些都在随后调查性报道的狂潮中曝光，揭示了这家所谓中立的私营数据挖掘公司重叠的利益和妥协的政治关系。


    《纽约书评》记者塔姆辛·肖同意我的这一观点。我在烂番茄（Rotten Tomatoes）的《大黑客窃取案》页面上看到了她经过策评的评论。25 肖是《观察家报》和《卫报》英国记者卡罗尔·卡德沃拉德的朋友和同事。正是卡德沃拉德揭露了
    Facebook 在剑桥分析公司侵犯个人数据事件中的核心作用，随后遭受死亡威胁、被指名肇事者提起法律诉讼，并持续受到厌女辱骂。


    正如肖在《大黑客窃取案》发布时所沉思的，真正的故事是亿万富翁和威权主义个人如何试图破坏和控制民主制度，而不仅仅是侵犯你我等数十亿普通人的数据以扩张自身权力和触角：


    > 更大的图景——那是卡罗尔和我在之前几个月里一直在讨论的——是剑桥分析公司的故事如何打开了一扇窗，让我们窥见了一群国际亿万富翁、腐败政客和战争获利者正在明显积聚巨大权力的新星座。这个故事不仅关乎技术、数据和心理画像；从根本上说，它也是一个关于根深蒂固的经济不平等后果、基本公共资产和政府职能（甚至包括国家安全）私有化后果的故事，以及国际克勒普特克拉特（kleptocrats，掠夺统治者）之间达成的交易对传统外交政策构成的挑战。它告诉我们，除了在社交媒体上被操纵，我们为什么要关心像剑桥分析公司这样的企业——以及为什么我们应该关注穆勒调查未能揭露的内容。26


    '
