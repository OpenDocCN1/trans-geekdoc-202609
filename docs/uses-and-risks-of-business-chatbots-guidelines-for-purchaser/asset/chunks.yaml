- raw: 'This survey was actually conducted by Oracle, who incidentally ended up releasing
    their own “state-of-the-art” chatbot across platforms for their high-end CRM system.
    Oracle’s survey— that made headlines worldwide four years ago in the mainstream
    media with their 80 percent of botified or about to botify companies claim—predicted
    that the automation triggered by chatbot deployments would inevitably transform
    the economy:


    Twenty-nine percent of customer service positions in the US could be automated
    through chatbots and other tech, according to Public Tableau. We estimate this
    translates to $23 billion in savings from annual salaries, which does not even
    factor in additional workforce costs like health insurance.[9](#Introduction.xhtml#footnote-010)


    Their predictions were based on this remarkable graph; its data sources were McKinsey
    consultancy and the U.S. Office of Personnel Management.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/intro3.JPG)


    I.3 © Tania Peitzker on gravatar.com 2012-2019. Here you can see many of the 2D
    chatbot pilots my former venture velmai undertook as unpaid Greenfield projects.
    Expectations of quick uptake of bots were strong yet users and therefore prospective
    clients hesitated to adopt this new technology for sales, marketing and communication.
    (accessed [https](https://en.gravatar.com/taniapeitzker)[](https://en.gravatar.com/taniapeitzker)[](https://en.gravatar.com/taniapeitzker)
    on November 3, 2019)


    Well, it is the year 2020. Did this shift actually happen? If not, why not? Needless
    to say, there has been a lot of discussion in that time about the social impact
    of potential and actual job losses. This is part of the general hype around the
    words AI and Artificial Intelligence. Known often as scaremongering in the media,
    along the lines that “the robots are taking our jobs” or else prevalent in science
    fiction narratives with the ever familiar, existentially threatening plot that
    “AI will replace you.”


    Chatbots Set to Be a Trillion Dollar Market


    MarketsandMarkets has published lengthy reports on my particular industry niche;
    mostly about chatbots, Intelligent Virtual Assistants (IVAs), and voice-based
    cognitive interfaces being worth over $1 trillion by 2025. From 2017 onward, I
    have been interviewed four times in depth, recorded for over an hour by a team
    of business intelligence (BI) analysts in India, plus filled out their detailed
    survey postinterview. This was as a source for their reports, priced at $8,000+
    each on IVAs, the Cognitive Market, Conversational AI, and Conversational Commerce.[10](#Introduction.xhtml#footnote-009)


    As an introductory reply to my own rhetorical question, did the Business Insider
    prediction come true, consider these points:


    *   Yes, there has been a significant multiplication of social media chatbots
    and their corporate adoption. Just search online for “chatbots” or Virtual Assistants
    and you will see endless pages and ads about thousands of bot developer companies
    and avatars.


    *   There are now countless number of corporate bots and use cases such as the
    Unilever chatbot and Archant media news archive bot by Google Ubisend in the UK;
    only a few years ago, there were just a few hundred chatbots you could point to
    online.


    *   They have exploded in numbers by being hosted on frameworks or APIs that give
    templates to bot developers at all levels, 2D ones only like wit.ai and open.ai
    enhancing independent bot development in most languages globally.


    *   In 2020, we now see novel use cases like Disney’s Zootopia bot cooperating
    with children and the interactive detective character to solve a mystery and Marvel’s
    “Guarding the Galaxy” character.[11](#Introduction.xhtml#footnote-008)


    *   Other digital media firms have created “choose your own ending of films,”
    children’s novels, or else interactive computer gaming with a bespoke chatbot
    character.[12](#Introduction.xhtml#footnote-007)


    *   ChatFuel and thousands of 2D chatbot companies are releasing specific use
    cases like “Do it Yourself Drag and Drop Ada,” the UN Refugee survey to support
    asylum seekers lodge their claim via their smartphone once they arrive at their
    destination country of refuge, various law bots to support solicitors rather than
    the client, recipe bots on Skype, and chatbot services like real estate, bookkeeping,
    messaging for team work in Slack, Kik, Telegram, and WeChat.


    *   Yes 2020 does seem like a trillion dollar market! There are definitely more
    chatbots than ever in the B2C backend systems of major SaaS providers like SAGE
    (Peg), Accenture (Amy), and Publicis (Marcel) not to mention Oracle—see their
    persuasive video about their AI bot capabilities at the end of this section in
    the chapter.


    *   Yes, there are more CRM and enterprise solution providers of chatbot systems,
    for example, [www.recast.ai](http://www.recast.ai) in France, created by a couple
    of young women in a French incubator. This company was sold to the famous German
    CRM SaaS multinational corporation SAP for an estimated €40 million in 2018!


    *   Such M&As—for example Bloomsbury AI from London was a recent acquisition by
    a U.S. firm reported to be valued at about $30 million,[13](#Introduction.xhtml#footnote-006)—have
    encouraged the latest generation at secondary school, school leaver, and tertiary
    level coders and programmers to create more applied chatbot tasks with Pizza Hut
    and CNN bots seeming like the tip of the iceberg, as were the early days of the
    pioneering Dutch KLM and Alaska Airlines with their inaugural industry pilots
    of 2D chatbots to assist passengers online with flight bookings and information,
    run on the respective airlines’ branded booking websites.


    *   Yes, the forecast looks correct, as IBM Watson endeavors to white label much
    of its data mining software and deep learning features of its algorithm as botified
    cognitive interfaces, for example, I came across a white-labeled Watson Health
    application from India recently, selling into the Australian market; ditto for
    Microsoft with its Bot Network featuring the proposed Master Bot Cortana, though
    she still keeps a pretty low profile, that is, no evident mass consumer uptake
    of the Microsoft desktop chatbot.


    *   Deutsche Bahn surprised my tech venture velmai/AI BaaS with the release of
    SEMMI in Berlin Central Station a month after we trialed our Amalia 3D AI bot
    hologram in a mall in Cologne. SEMMI’s hardware was in fact a Swedish robot head
    displaying a hologram face.


    *   Her facial hologram could blink and show some expressions, yet the actual
    robotic head could not move much, only rotate from side to side. It appears to
    have had excellent speakers to hear travelers’ questions about timetables and
    trips with the German rail system.


    *   Like our Amalia I, SEMMI could also direct people to the toilets and cafes
    in response to the question “where can I get a coffee,” the weather, or exits.
    Though we think our prototype was more advanced in terms of content, Amalia I
    not only gave directions, she also provided upon request detailed descriptions
    for over 30 retailers, restaurants, and services in our shopping center.


    *   Amalia I was more conversational than SEMMI appears to be. For instance, Amalia
    proactively engaged with shoppers by asking them how their day was, perhaps they
    needed to buy a gift for someone in their family (then making suggestions for
    various retailers in the mall) as well as soft selling the idea the person should
    get a present for their mother, just to say you appreciate her anytime of the
    year!


    *   Like SEMMI by Deutsche Bahn, Amalia I was only trialed publicly for just on
    four weeks before we took her “back to the lab” to improve her hardware and tweak
    her software.'
