    ## 4. Cocreation


    Great organizations build solutions together with their customers. They bring
    them in early, they experiment and design together, and then they deploy together.
    All stakeholders, internal and external, take responsibility when there is success
    and humbly accept when things don’t work out right. In the government, bringing
    in constituents to cocreate solutions adds enormous value to the process. At a
    minimum, they will likely have great ideas that haven’t been considered from the
    perspective of the government agency, and they will be able to guide the process
    of enhancing the customer journey.


    ## 5. Action


    Finally, an agency can have all the leadership and vision it needs, but if it
    doesn’t have a disposition for action, it’s all for nothing. Sure, action has
    risk and there are always many reasons to defer, stall, and postpone. But action
    is where, well, where the action is! Agencies with a proclivity for doing things,
    even when the outcome is more uncertain than they would like, move the ball forward.
    A vision for high quality government experiences requires a lot of action versus
    a bureaucratic approach that plagues most government entities.


