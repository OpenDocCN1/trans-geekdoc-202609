- raw: '*   In the last century, this problem was mostly solved with employment contracts
    stipulating that all of the R&D belonged to the “corporation as investor” who
    hired them to be intrapreneurs.


    *   However, today with the rapidity of inventions and convergence, it may be
    very hard to find the most talented people who will agree to these conditions
    that they forgo the innovation they may be responsible for in a small coding team.


    *   For the sake of motivation, it may be useful to offer them part ownership
    and shareholder stakes in the company, especially if they succeed in spinning
    out the invention into a separate company from the “mother corporation” that you
    all work for as salaried employees and/or as contractors.


    Government Procurement Checklist


    *   Have you checked with the relevant departments if they have anything in the
    pipeline for trialing this technology?


    *   Don’t assume there is nothing happening it may not have been communicated
    yet—the good old silo divisions often prevent knowledge being shared.


    *   Ask the HR head if they know of any initiatives.


    *   Where possible circulate a call or e-newsletter for ideas and feedback at
    the planning stage; ask to meet in the canteen individually or if there is a strong
    response, suggest an “AI lunch” or whatever topic once a month after work or lunchtime
    to generate staff “buy in” and crowdsource their ideas ongoing.


    *   If you work for a large corporation, government, or an international NGO,
    check with the company’s librarians and archivists for literature and records
    of past pilots and current policy papers for implementing the emerging tech fields
    you want to trial.


    *   Ask your managers what they think regarding the current policies and planning.


    *   Ask your junior staff and colleagues from other departments about their plans
    for new tech to see if there is overlap and potential for interdepartmental collaboration
    that you haven’t thought of yet.


    *   Publicize the proposed implementation date on the staff e-newsletter.


    *   Ask colleagues if they have heard of the ventures and/or entrepreneurs on
    your shortlist.


    *   Check with the government funding agencies if they know of them or can recommend
    any new tech startups as suppliers.


    *   Compare your goals and plans with other countries and their ministries or
    departments; you will be surprised by the similarities and learn from the differences.


    *   Where there is a similar project done or underway in another country, contact
    your counterpart ask for a video conference call to share experiences.


    *   Check with university researchers, business schools, and institutes.


    *   As a government official or civil servant, you are best to avoid going to
    the tech giants or established companies for peer reviews—see the previous discussion.
    This will by nature not be neutral as their goal is to demolish any incumbents
    as legacy systems—they don’t want their market share disrupted.


    *   Similarly, you must be careful about talking with VCs and consultants who
    will inevitably have vested interests in companies they already own or have invested
    in. They are obviously going to present their proteges as your best bet and cannot
    be relied upon to declare this conflict of interest. Sad but true in today’s world
    of shaky business ethics!


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c5fig4.JPG)


    Figure 5.4 © Realfiction, Copenhagen, 2019. This is a perfect example of Augmented
    Reality imaging in Real Time being used to promote a product or brand. With the
    addition of Cognitive Interfaces in future, such as AI botifaction with voice,
    the AR experience of just seeing a car like this in commercial setting will become
    a more interactive branding experience. Voice tech will let shoppers chat with
    the car itself or its human hologram ambassador or sales rep


    Special Considerations for Government Decision Makers


    *   Follow the same due diligence steps as the aforementioned corporate checklists
    and be aware of the pitfalls in sourcing reliable information about unknown tech.


    *   When asking for information from other related government agencies it may
    not be forthcoming. Even other departments at your level of government, for example,
    Council, Local, County, State, Federal, or national may also be defensive if they
    have missed a trend or not been agile enough to spot it. Or else they are plain
    old opponents of new tech, as per the quiz in this book!


    *   Often semigovernment experts have become too comfortable and reluctant to
    make any fundamental changes like adopting new tech, especially (ironically) if
    they are in funding agencies like grants and government financing schemes.


    *   They have so many eager entrepreneurs wanting to pitch to them desperate for
    funds, that some government officials and civil servants may rest on their laurels
    and are quick to cover up their deficiencies, lack of knowledge of current trends,
    and overstate their past achievements.


    *   Coverups and nondisclosure of similar tests and trials of the same technology
    or related innovations may occur because they were flops. It is human nature to
    want to downplay failures you may be personally or indirectly responsible for.
    In government, this unwillingness can reach epic proportions as they have different
    dynamics for disclosing departmental incidents and somewhat secretive protocols
    for not sharing information, even with colleagues.


    *   In the private sector, the financial necessity of profits and economies of
    scale is the determining factor. People are reluctant to withhold information
    because it will soon come to light that they caused a failure due to a lack of
    information sharing.


    *   Tech ventures in the early stages are usually lean and mean operations of
    five people, sometimes a team of ten. There is nowhere to hide and so accountability
    in disclosing to your colleagues failed attempts or “accounts lost” is almost
    guaranteed. Or you will find your contract terminated abruptly. A lean and mean
    startup has no time to lose, and no money to waste due to staff’s personal feelings
    of discomfort about failure.


    *   Check with industry experts you respect but do not tell them who are you are
    checking on due to the anti-competitive clauses in your nondisclosure agreement
    with the external entrepreneurs. It is just general good practice in the highly
    competitive world of launching innovation.


    *   See the aforementioned checklist for corporate purchasers which goes in depth
    into this aspect. I have not applied it to the same extent to the public sector
    because in my experience, there is more awareness of—and openly strict rules for—public
    servants for discretion and following the departmental guidelines on purchasing.


    *   Civil servants are employed on the basis of neutrality, which is enforced
    by strict codes of conduct and also internal guidelines for procurement and tenders
    for suppliers, that is, most governments have separate units dedicated to sourcing
    providers and suppliers according to strict, public procurement guidelines to
    avoid corruption, bribery and favoritism in public and/or political office.


    For Both the Public and Private Sectors


    Key Advice


