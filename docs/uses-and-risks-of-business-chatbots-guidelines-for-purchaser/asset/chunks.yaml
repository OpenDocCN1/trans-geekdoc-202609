    ## 5. 政府部门和非政府组织


    同样作为现场信息娱乐向导，部署在大型政府建筑和场所中。面向消费者（B2C）交互的二维机器人及定制化服务，让政府服务在实时对话中“活”起来，助力办成官僚事务。


    ## 6. 销售点销售助理


    在店内或特别促销活动中——社交媒体和企业网站上的二维数字分身强化了现场三维全息 AI 机器人的销售工作与互动。


    ## 7. 营销化身


    例如在银行、保险公司及其他削减了销售和前台接待人员的服务机构中。但作为客户、商业合作伙伴和供应商的首个接触点，现场的三维 AI 机器人全息像是一位 7×24
    小时的大使，能将企业的物联网（IoT）与核心信息汇聚于“一脑”之中。


    ## 8. 教育领域总体


    我们收到过许多关于导师机器人的 RFP（提案请求），例如针对 MOOCs（大规模开放在线课程）。


    ## “做与不做”案例研究：基于真实事件的假设场景


    ### 案例研究 #5：外交使团的 Facebook 页面与 Messenger 二维聊天机器人


    这笔交易源于伦敦一位副大使的来电或去电（我已不记得这份 RFP 最初是如何发起的）。他们希望我们解决一个政治、技术和社会层面的问题。有趣的是，这与脱欧和民粹主义有关。


    在不透露过多细节的前提下，我们可以透露：该实体运营着一个 Facebook 页面，定期有数千名粉丝访问。在我们起草提案时，该 FB 页面有 4000 到 5000
    名粉丝或关注者。遗憾的是，其中包含大量网络喷子和几名极具攻击性的“脱欧派”，他们在任何事物中都能看到阴谋。


    因此，我们的任务是构建一个符合该页面使命声明和目的的 Facebook Messenger 机器人。它要实时迎接访客，例如：“嗨，感谢访问我们的 FB 页面。您好！我能为您提供什么信息帮助吗？”随后采用“选择答案”的树状结构，逐步过渡到定制机器人对自发评论或问题进行“自然”的自由形式或非结构化回复。


    然而，主要任务是让机器人解决网站持续、随机遭遇喷子骚扰的问题。挑战在于让它识别辱骂性语言并全天候自动发出警告。初衷是让一个冷静、中立且“外交辞令”式的机器人处理基础沟通，从而降低该
    FB 页面“粉丝”之间不断升级的“讨论”温度——该机器人不会被来访“敌对” Facebook 用户的任何人身攻击或语言辱骂所激怒、愤怒或困扰。


    这本将是一个完美的案例研究，展示即使是基础的 Messenger 机器人也能缓和网络仇恨言论，尤其是在 Facebook 上，该平台因迟迟不删除冒犯性评论而臭名昭著。尽管该平台在全球各地每年赚取数十亿利润，Facebook
    仍无法应对或管控霸凌和喷子这些恶劣肇事者。


    再次，几乎是惯例，在获得所有利益相关者签署批准后，我们即将开始构建该机器人。随后脱欧局势急转直下，显而易见，相关人员将不得不改变政策，并将这个作为“外联”或公关项目的
    Facebook 页面在英国关闭。客户无法为这项在线活动最后 12 个月的 1 万英镑预算做出合理解释，因为由于政治变革和社会压力——关于在民粹主义信仰狂热、无成效谈判以及英国公众日益高涨的愤怒或挫败感中维持项目可行性的问题（截至
    2019 年 10 月 5 日，距离脱欧协议达成与否仅剩几周）——他们被迫收尾。


    ![Image](img/c3fig1.JPG)


    **图 3.1** © Cliff Lee, CCO from velmai Ltd. “在线管家 Albert”（蝙蝠侠管家 Alfred 的一个迭代版本）是吸引这位伦敦客户注意的原型。Albert
    还在 2017 年伦敦数字旅游峰会上被评为最佳创新。[`youtube.com/watch?v=6coVEQzE27A`](https://www.youtube.com/watch?v=6coVEQzE27A)


    我们的聊天机器人公司投入了时间进行面对面会议，并制作了针对工作目标和任务量身定制的 PowerPoint 演示文稿。对我们而言，1 万英镑显然不是决定性因素，如此规模的首个客户带来的价值远超初始收入！后来，我将这份提案或提案请求
    (RFP) 转化为一个现场案例研究，供我在法国南部一所国际商学院的理科硕士学生学习。


    挑战在于在其他国家复兴该项目，与这位外交特使和组织的其他分支合作。该课程主题为“谈判与 CRM 的运用”。结果证明，这极大地激发了学生的想象力，让他们设身处地扮演企业家和非政府组织或
    NGO 决策者的角色。他们在德国和意大利几乎达成两笔交易，其他几次推介也获得积极反馈，并在学期结束前成功追踪到一笔成交记录，他们忠实地在云端 ERP 系统中记录了这些进展。


    ### 案例研究 #6：国际电视台与数字广播商：作为信息娱乐的在线机器人


    这笔交易以一种奇怪的“隐蔽”方式赢得，并非直接推介竞标。相反，我们在不知情的情况下被置入一场“现场实验”，随后从同行中脱颖而出！我们收到了来自纽约的邀请，参加一个关于聊天机器人的为期一天的闭门研讨会，与会者包括我们的竞争对手和同行领袖。实际的
    BaaS（机器人即服务）提供商数量最多仅限二十几家。


    当时我不理解会议组织者的商业模式。作为一个面向 20 位竞争对手的为期一天的伦敦研讨会，与会者不足一屋子，也没有明显的活动赞助商。商业参与者免费参加，站在企业家一方。正如我们后来意识到的，除下午在我们的
    AI 机器人小组讨论中采访了我和其他两人的 BBC 外，现场人员均来自大型企业。他们是采购方或买家。


    显然，他们付费“卧底”来观察我们在自然环境中的表现，这后来由几位人力资源专家向我解释。他们显然在自己的领域见过类似做法。我的一些同行在不知情的情况下讨论了机器人部署的重大失败案例和交付失误，以为我们大家都是作为
    BaaS 提供商在场。


    与会者没有姓名牌，我只在午餐时偶然得知部分人来自哪里。我有幸坐在了后来给我打电话的那家电视公司的餐桌上。最终竞标赢得采购合同的在我们和另一家公司之间！


    我们被要求就以下内容报价：


    *   一个二维定制机器人。

    *   它是一种菜单型机器人，帮助用户浏览其在线网站的内容。

    *   这是英国点播服务的开端，而这家公司在特定垂直领域已处于领先地位。


    #### 推介与结果


    针对前文所述的客户明确需求：


    *   我们为化身创建了一个名字和角色，其团队很喜欢。

    *   然而，市场总监担心机器人的自动化特性，这在市场和业务开发（biz dev）人员中很典型——他们以为公司内部有人密谋削弱他们的权威和对网站的控制。

    *   该内容拥有全球数百万用户，我们同意首期部署仅限欧洲。


    在我们付出努力发送定制许可协议后，此事突然被叫停。该电视公司并未用竞争对手的机器人取代我们。据我所知，该网站或其任何在线内容至今仍未实现“机器人化”。


    '
