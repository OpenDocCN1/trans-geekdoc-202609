    ## 商业“机器人化”用例的总体效益


    5. 正如我那篇关键的 VB 文章所指出的，这是我们被广告行业屏蔽的主要原因：表现最好的机器人能以绝对清晰的指标，产生最透明、最具成本效益的投资回报率。19


    *   之所以有成千上万的机器人开发者，是因为企业需要它们！

    *   它们有效！它们为企业增加价值——品牌知名度、销售和营销活动——并通过直接销售以及更高效员工带来的成本节约，改善了利润底线。

    *   尽管过去几十年简单的、“传统的”、手工编码的聊天机器人已被更智能、更通用、更具认知能力的 AI 机器人所超越，但这种演变为具备语音能力的新一代 AI
    机器人铺平了道路。它推动了机器与人类交互的 2D 混合模式的改进，以在后千禧一代的体验经济中提升客户服务和满意度。

    *   大品牌和大公司正在内部开发自己的跨平台定制机器人，因为它们在 B2B 及内部员工关系、员工满意度、利益相关者的兴趣和参与度方面增加了价值。

    *   银行在最初拒绝后现正采用它们；在它们及竞争对手进行了许多绿地项目和试点后，它们现在信任这些机器人的性能。通常这些试验是在内部进行供员工使用，因此银行客户从未与这些第一代聊天机器人互动过。

    *   以金融服务和更透明的信用检查形式出现的金融科技——根据 GDPR，你有可能通过询问聊天机器人，比通过在线联系表单或电话更快、更可靠地获取个人数据，删除私人信息亦是如此。

    *   房地产和密集型服务机器人正在将更多线索转化为销售。

    *   面向所有垂直领域和行业规模的客户服务用例 FAQ、销售和营销正在发挥作用！请看英国 Ubisend 公司网站上发布的无数案例研究，仅举一例；还有 LivePerson、CreativeVirtual、PandoraBots、ChatFuel、Inbenta、Watson、Artificial
    Solutions 等。

    *   心理健康机器人用于应对抑郁症流行和病态肥胖、节食，以及青少年福利以阻止网络霸凌、自残、自杀。

    *   请参阅案例研究 #5，了解一家（匿名的）大使馆或外交使团希望遏制其在伦敦运营的 Facebook 页面上的仇恨言论。


    ![Image](img/intro4.JPG)


    **I.4** 此处机器人“Pepper”被部署在家庭环境中，从而成为一项“抗孤独措施”，由一名儿子为其独居在东京的母亲的心理健康而购买。这个“真实场景真人非演员”被记录在一部德国纪录片中，该片平行讲述了这个家庭的人机关系，以及另一段涉及另一个机器人和美国人的公路旅行爱情故事（插图见第
    5 章）。摘自 Isa Willinger 执导的电影《Hi, AI》© Kloos & Co Medien, Berlin, 2019


