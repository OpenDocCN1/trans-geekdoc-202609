    ## On a Closing Note: The Obama Bot


    There was an Obama Bot that worked officially on President Obama’s government
    page in Washington for a while. If you read John Brandon’s analysis of the Obama
    Bot in his VentureBeat opinion piece, he was quite scathing about its obvious
    limitations.[19](#02_Chapter_2.xhtml#footnote-036) Brandon made a good case to
    show what I am arguing in this book: there are a lot of advanced bot technologies
    that have not gone to market because they were blocked as emerging tech.


    Not to say that the Obama Bot deliberately stood in the way of its more disruptive
    and AI-capable cousins. However, as Brandon argues, the “safe choice” of a boring
    NLP chatbot that was repetitious in its servicing of Frequently Asked Questions
    was a disservice to the chatbot industry. It was historically the most famous
    chatbot—or should have been the most famous one—yet it is clearly forgotten in
    the wake of less capable but more notorious chatbots like `Tay.ai` and `Eugene
    Goostman` that supposedly had passed the Turing Test via an orchestrated attempt
    run at the Royal Society in London in 2015.[20](#02_Chapter_2.xhtml#footnote-035)


    ## Eugene Goostman Winning the Turing Test in 2014: A Controversy of Chatbot Hype?


    Professor Kevin Warwick at the University of Reading had already run a Loebner
    Prize or Turing Test at his university in 2008 when `Elbot` from Germany and Sweden
    won.[21](#02_Chapter_2.xhtml#footnote-034) Warwick has often been a controversial
    figure, for example, when he claimed to be the world’s first cyborg as well! As
    I blogged at the time, the real fault was the media including the BBC for triggering
    a fairly intense, international wave of media hype with their unequivocal headline:
    “Computer AI passes Turing test in ‘world first.’”[22](#02_Chapter_2.xhtml#footnote-033)


    Some brave bloggers and online tech news platforms like the Huffington Post and
    Mashable took a stand against the overstated claims and disputed that the Goostman
    2D chatbot had passed the Turing test.[23](#02_Chapter_2.xhtml#footnote-032) I
    also gave some off-the-record analysis to tech editors about this as I did not
    want to be seen as a competitor trying to take down the globally lauded achievements
    of several institutions, including the British Royal Society echelons, no less.
    It is needless to say how easy it has been to hype advances in chatbot history,
    with a few famous names, for example, the celebrities roped in unwittingly who
    tested `Eugene Goostman` publicly—filmed for TV—at the Royal Society in London
    and run as a global Turing test to celebrate the birthday of Alan Turing, Britain’s
    gift to the world of AI.


    ## Germany’s Reaction to the Political Chatbots and the Cambridge Analytica Scam


    If you think I am exaggerating the effect of politically created chatbots on the
    last U.S. general election, then think again. Europeans watched in democratic,
    intellectual horror the supposedly entertaining advance of spam bots on Twitter—see
    the previous discussion of Microsoft’s `Tay` orchestration and how her successor
    `Zo` was so dumb she was deactivated in 2019 after only a few years in operation
    with comparatively few users and hardly any PR or tech discussion of Microsoft’s
    “magic AI bot.” The fact is, if `Tay` was so clever, how could her sister `Zo`
    be so ordinary and clearly just another NLP chatbot.


    In the meantime, purchasers lost even more trust in bot tech. Spam bots, particularly
    the harassing sort on Twitter and Facebook or the annoying ones on Skype and `kik.com`,
    have actually wrecked the market for serious bot developers. That is until the
    year 2020 when the chaff has become separated from the hay, thus the rationale
    and timing of this book.


    Looking back on the past decade that my 2D chatbot venture in Britain languished
    in a premarket, R&D phase, what were the repercussions for Internet regulation,
    privacy laws, electoral campaigning rules, and society’s general well-being and
    satisfaction with the onslaught of fairly low-performing, one-dimensional 2D chatbots
    on social media and websites?


    The German Chancellor Merkel’s reaction—supported by her even more Conservative
    Bavarian counterparts the CDU weirdly in unison on this with the Green Party of
    Germany and `Die Linke`, the far Leftists who were once the Communists of East
    Germany—was to suggest banning the social (media) bots that can influence an election.
    This policy, if not legislation, call was before the exposure of the Cambridge
    Analytica scandal and confirmation of Russian interference in U.S. elections by
    the CIA. British Intelligence and other sources have also indicated that the Russians
    did this (via Facebook advertising manipulation at the very least, with some evidence
    of politicized chatbots) in the UK general elections and, of course, the deeply
    divisive Brexit referendum.


    I discuss the aforementioned political events again in the afterword in [Chapter
    6](#06_Chapter_6.xhtml). If you somehow missed the Cambridge Analytica global
    breach of privacy by misusing millions of people’s Facebook data to politically
    target them, I strongly recommend you watch this Netflix documentary released
    in July 2019, *The Great Hack*. It is the best analysis and summary of the far-reaching
    dimensions of this scandal.[24](#02_Chapter_2.xhtml#footnote-031)


    *The Great Hack* falls short of showing the involvement of Cambridge Analytica’s
    investors as being Brexiteers with a fierce agenda, as well as having investors
    in the company who were Tory MPs past and present, not to mention former Heads
    of Defense and other civil servants in Britain. This all came out in the subsequent
    flurry of investigative reporting into the overlapping interests and compromising
    political ties of a supposedly neutral, privately held data mining company.


    The New York Review of Books journalist Tamsin Shaw concurs with me in this view.
    I spotted her review curated on the film criticism platform Rotten Tomatoes’ page
    for *The Great Hack*.[25](#02_Chapter_2.xhtml#footnote-030) Shaw is a friend and
    colleague of the British journalist at *The Observer* and *The Guardian*, Carole
    Cadwalladr. It was Cadwalladr who broke the story on Facebook’s integral involvement
    in the Cambridge Analytica breach of personal data, subsequently suffering death
    threats, legal action by the named perpetrators, and ongoing misogynistic abuse.


    As Shaw muses upon the release of *The Great Hack*, the real story was how billionaires
    and authoritarian individuals were attempting to undermine and control democratic
    institutions, not just breach the data of billions of ordinary people like you
    and me to further their own power and reach:


    > The bigger picture, which Carole and I had been discussing during those preceding
    months, was the way in which the Cambridge Analytica story opened a window onto
    a new constellation of international billionaires, corrupt politicians, and war
    profiteers who were apparently amassing enormous power. That story isn’t only
    about technology, data, and psychographic profiling; it’s also, at root, a story
    about the consequences of entrenched economic inequality, the privatization of
    essential public assets and government functions, including even national security,
    and the challenge to conventional foreign policy posed by the bargains being struck
    between international kleptocrats. And it tells us why, beyond being manipulated
    on social media, we should care about businesses like Cambridge Analytica—and
    why we should be concerned about what the Mueller investigation failed to expose.[26](#02_Chapter_2.xhtml#footnote-029)

    '
