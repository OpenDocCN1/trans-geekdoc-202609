    They may be hard to reach but if you flick them an e-mail with the name of your
    company or government department and “seeking advice” in the header, you are certain
    to get a reply and at least five minutes of their scheduled time. It makes the
    journalist feel important and more importantly in touch with trends, for example,
    which major purchaser is backing what. Again, their code of conduct for the profession
    will guarantee that your chat is kept secret. Unless you call a tech editor from
    the sensationalist tabloid press, which means you can’t rely on them following
    the traditional professional standards of confidentiality and conversations that
    you declare must stay “off the record.”


    4.  Thinktanks and independent research institutes. If you google AI and the keywords
    of the software innovation that you are investigating, you may be surprised that
    there will be an institute somewhere in your country or another that is dedicated
    to this emerging tech field.


    5.  The reason for this is academic funding and philanthropic sponsorship. In
    order to maintain neutrality in research, these outlier researchers outside of
    your normal universities and business schools are living off their reputations
    as independent sources of reliable information. They will also have more time
    to talk with you and provide you with a rounded picture of the field.


    6.  Again, if their institute is tagged with an industry player’s brand name,
    approach with caution. With corporate funding of research comes inevitable limitations
    and influence of their topic parameters and, harder to prove, hard to detect manipulation
    of research results. Why do you think the tobacco industry and the climate change
    deniers have lasted so long? Let alone pesticide manufacturers, but that is another
    problematic altogether.


    7.  Also check that the thinktank or research institute is not attached to a political
    party because an increasing number of them are, for example, the Brexit debate
    in Britain has created a number of politically biased institutes that seek to
    influence public debate from their point of view. Ditto if the thinktank has been
    set up secretly by an industry lobby group under the guise of independent research
    seeking to inform public discourse.


    8.  To balance out the tech editor and academic outlook on the emerging tech and
    its use cases, talk to peers in your industry who you believe have tried related
    technologies or are at least willing to do so. They can provide you with insights
    about the trials and tribulations they experienced. Again it is a type of crowdsourcing
    information on use cases that may not yet be in the public domain or mainstream
    due to confidentiality agreements and NDAs. At the very least you will get ideas
    and suggestions through a support network of first-mover thinkers and doers!


    9.  Another source of expertise to vouch for the entrepreneurs or validate the
    extent of the innovation and its originality or usefulness are venture capitalists,
    known as VCs or sophisticated investors. Often private equity firms and VCs have
    resident technology scouts and experts looking for the kind of venture you are
    dealing with.


    Important to Note in This Due Diligence Process


    *   Be careful with regard to confidentiality agreements and NDAs. You will need
    to get express permission to discuss what you are doing or thinking of doing with
    the tech company especially if you have signed an NDA with them.


    *   The problem is not that these VCs are aligned with the tech giants necessarily,
    though many of the investors and advisors in their organizations are in fact ex-Facebook,
    ex-Google, ex-IBM Microsoft and so on. That is already a warning bell with regard
    to confidentiality and for that reason alone the entrepreneurs may withhold their
    permission. Increasingly, the VCs you meet are former entrepreneurs who have told
    their innovative emerging tech to a larger competitor or established corporation.


    *   More to the point, their trade secrets if shared with you may be passed on
    (wrongly) to a competitor venture that is in stealth mode and not yet visible.
    That means that this hidden venture could be incubating inside the VCs’ pipeline
    for deal flow or already have received funding and is in R&D about to go to market.


    *   That could be fatal for the tech venture you want to give a chance to! You
    could also be sued for breaching the NDA or confidentiality implied if you discuss
    too freely with competitors or experts funding these potential future or currently
    hidden competitors. Just because you and your peers may not have heard of this
    innovation until now, it is quite likely the trend of the innovation had already
    been spotted years ago by their talent and trend scouts at the private equity
    firm. That is their job and how they make money, they want to be first movers!


    *   However the sad fact is, it is frequently very hard for bootstrapped, unheard
    of ventures to win capital investment from these big investors in an early stage
    of business development. That is why you will feel like you are entering a world
    of smokescreens, cloak and daggers.


    *   It is high stakes. We are talking about “pre money” ventures worth tens of
    millions of dollars before they have their first paying customer or show profits—for
    high-profit groundbreaking innovation. And it is often about strategic positioning
    and strategic communications. Which is why it is so hard for you to make purchasing
    decision.


    *   This vicious circle will always present itself with really new, exciting,
    innovative technologies. You will need to scratch below the surface to get the
    information and do the due diligence you will need to do to commit to a six-month
    pilot or longer. Anything less is of less value and not really viable for the
    tech entrepreneur in terms of marketing, new client acquisition, and using you
    as a crucial testimonial from a first-mover client.


    Approach any competitor to your entrepreneurs or any corporate-sponsored expert
    with extreme caution. I used to think what has a tech giant got to be afraid of?
    The reality is, none of the dominant players ever want to lose even a slice of
    their market share even to a minnow like a completely unknown, unmonetized early
    stage venture run by unpaid cofounders.


    Sadly, too many tech giants and their past and present executives are known to
    act badly even unethically to stop an innovative tech company in its tracks. They
    do not want the slightest bit of competition. If the startup survives as a new
    venture—gets traction on the market as the jargon goes—and becomes a serious threat
    to the giant’s market share, then they will bid to acquire it more often than
    not. This is called an M&A, a merger and acquisition whereby the new venture is
    basically taken over by the old.


    But until that point, a truly disruptive and innovative tech venture must strategically
    guard its first-mover client list, its marketing strategies, even the names of
    its team. Given these life-and-death sensitivities, you must be ethical at all
    times and check with the entrepreneurs about who they are comfortable with regards
    to you checking on them. A big competitor’s name attached to an expert’s salary
    or organization should signal a big red flag for you in this context.


