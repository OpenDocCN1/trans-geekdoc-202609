  trans: '


    # 案例研究 #14：英格兰和威尔士的一个政党


    尽管他年事已高，但他表示，鉴于 AI 在 Google 翻译中表现出的显著能力，他以为 AI “现在可以恢复我们古老的波希米亚方言和语言”。就在你最意想不到的时候，一位先行者从社会最年长的群体中出现了。这就是为什么我始终保持开放的心态并及时回复询问。世界充满了关于“谁懂了”以及社会创业可能从何处涌现的惊喜。


    我通过联系他们的数字事务官以及我所在郡（肯特郡）的其他党代表，赢得了这个机会。此外还有伦敦、该党位于牛津的总部，以及英格兰东南部的其他下议院议员 (MPs)
    和欧洲议会议员 (MEPs)。在不透露是哪个政党的前提下，我将概述他们给我的肯特大学实习生团队设定的挑战。


    我利用这个潜在客户的情境，培训了一些非常优秀的毕业生和三年级学生——顺带一提，他们来自经济学和人文学科。第二年，我带的一组实习生背景甚至更加多元；既有 IT
    和技术专业的学生和毕业生，也有文科、商科和语言专业的。完美！


    所以我在第一个两小时的会议中向实习生们简要介绍了潜在客户的情况，即他们人手不足且**不希望**被联系！


    她最大的担忧是这个聊天机器人的成功——如果它 24/7 与人交谈，会产生大量新的询问和新的 Facebook 关注者，而这些都是她必须处理的。那太多了。换句话说，整个项目被一位人士否决了，因为她觉得在组织层面无法获得足够的支持，无法在个人和职业上应对我们聊天机器人“任务完成”后的局面！


    如果聊天机器人能产生更多新成员、志愿者、信息请求、各种请求，而这些都需要由人类来处理政策声明中更复杂的一面，那么在主要负责这个孤岛部门的人眼中，这就是一件坏事。我们试图向她保证，如果她只开启
    Messenger 让我们上线机器人，聊天机器人将会减轻她在 Facebook 上积压的消息和联系请求。


    我们只打算收取 10,000 英镑。这是另一个问题。对于这个有其他财务优先事项、即将为下届大选筹款，随后还要应对所有郡选举、地区选举和教区选举的政党来说，这是一个无法负担的预算。我们试图讲明投资回报率
    (ROI) 会更高，因为我们可以根据选举优先事项调整或修改聊天机器人内容，甚至利用用户的地理位置（Facebook 提供的 IP 和其他数据）来本地化聊天机器人的展示位置。


    不行，我们被否决了，因为有几个人害怕“机器人化”成功带来的新成员潮（正如当时工党聊天机器人正在做的那样！）。还有就是缺乏想象力，无法意识到仅需一次机器人构建，在一个
    12 个月的许可期内部署到各种竞选活动和多场选举中，这 1 万英镑的投资回报率将达到十倍。


    ---


    # 第 5 章：核对清单与指南


    ## 定价的主要问题：一分价钱一分货！


    我曾读到一位聊天机器人博主非常精准地评论过，为什么更好的聊天机器人无法进入市场，或者即使进入了，也鲜为人知或鲜少被使用。他说原因在于采购者期望得到一辆法拉利，却想付一辆非常基础的二手车的价格。于是当他们廉价、基础的
    NLP 聊天机器人没有成为炒作所誓言的杰出“AI 交互奇迹”时，他们自然会感到失望。


    ![Image](img/c5fig1.JPG)


    **图 5.1** 什么是真，什么是假？《嗨，AI》展示了未经安排的真实对话，那是“自发”机器人与其“真正的照料者或伴侣”之间的对话，而非演员。这是作者与电影制作人之间关于伊莎·维林格
    2019 年纪录片《嗨，AI》的电子邮件交流。© Tania Peitzker


    我的 2D 聊天机器人公司 `velmai Ltd` 经历过多次这种情况。我们无法穿透数百家竞争对手制造的大规模炒作和误导性销售话术，这在过去几年里变成了一片令人失望的喧嚣。我们遇到的每一位采购者都曾与
    2D 聊天机器人有过非常糟糕的体验。一些科技巨头竞争对手让他们相信，如果他们支付给这个知名品牌和人机交互提供商 100,000 美元或更多，用六个月左右时间构建一个“复杂”机器人，他们就会获得更好、更满意的体验。


    '
