    Dedication


    To my friends, colleagues, and family, in particular my husband Andrew, for their
    ongoing support and unwavering belief in me because we are all living in this—sadly,
    still overwhelmingly—“man’s world.”


    This book is also dedicated to the fairer, less biased (chat)bots and democratic
    intelligent entities of the future, by an emerging “Posthumanist Mystic” from
    the here and now. For several decades, researchers in the European Union and the
    United States have been exploring “post-humanism” in depth in relation to the
    advance of Artificial Intelligence, in particular its effects on personal belief
    systems, philosophy generally, feminism, equal opportunity, liberal values, commerce,
    society, and how we do business from day to day. [1](#dedi.xhtml#footnote-019)


    In acknowledgement of her “second iteration,” I must also give respectful thanks
    to one of our AI bot’s living, updated versions, “Amalia II.” Below you can see
    a static, “lab shot” of the 3D avatar Amalia II getting ready to go “into her
    box” or “hardware shell” where she becomes a mixed reality hologram in real time,
    multilingual with voice.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/dedi1.PNG)


    ***Dedication 1 © AI BaaS UG, Munich, 2019. mixed reality requires sophisticated
    technology at the cutting edge of Cognitive Interfaces and Conversational AI /
    Commerce***


    ![Image](/library/view/uses-and-risks/9781949443448/Images/dedi2.PNG)


    ***Dedication 2 © AI BaaS UG, Munich, 2019. Amalia II comes to life as a new iteration
    of her 3D avatar, based on her 2D chatbot self or online personality***


    * * *


    [1](#dedi.xhtml#footnote-019-backlink) Braidotti, R., and M. Hlavajova., eds.
    2018. Posthuman Glossary. London/New York: Bloomsbury Academic. I also recommend
    the work of American philosopher N. Katherine Hales, now Professor at Duke University.
    Like Donna Haraway. 1999. Hales’ Classic Text Foresaw the Advance of AI Bots:
    How We Became Posthuman: Virtual Bodies in Cybernetics, Literature, and Informatics.
    Chicago, IL: Chicago University Press.


    Abstract


    Though aimed primarily at purchasers and decision makers in Procurement departments
    in the public and private sectors, this book is for your teenager as much as your
    grandparents. It is beneficial for MBAs and executives who want to understand
    what is true about (chat)bots, distinguishing the often dangerous hype from the
    evident facts. It will assist with decision making about how to best spend their
    time, energy, and company resources on this continually (re)emerging tech.


    The popular term Artificial Intelligence (AI) is often thrust at staff by management
    who don’t want to miss the boat on AI technologies. Yet the simple acronym “AI”
    can mean a myriad of software and mobile applications from Cognitive Interfaces,
    Intelligent Virtual Assistants to industrial robot arms and personalized smart
    watches monitoring our health.


    For that reason, the glossary is a key part of this book as are the Checklists
    and Guidelines for purchasers and managers of AI regardless of whether they work
    for Government/NGOs or are in industry/the “corporate world.” For academics, lecturers,
    researchers, and teachers of new technologies, this textbook is essential reading
    and is structured as a type of adult education course to upskill students and
    graduates, as well as mid-career staff, the unemployed and older workers needing
    to reskill.


    Written in everyday language, the Glossary together with the case studies are
    the key learning tools. The 14 case studies—a mixture of publicly released information
    about big brands and bot developers’ pilots as well as my own first-hand experience
    from our Cognitive Interfaces ventures—are explained in a narrative, storytelling
    way, which will make life easier for educators and technologists within companies
    and government bodies. It will make it easier to “spread the word” among peers
    as to what are the uses and risks of deploying business bots and how to adopt
    new tech like AI.


    Keywords


    conversational ai; conversational commerce; cognitive interfaces; ai; bots as
    a service; artificial intelligence; chatbots; ivas; intelligent virtual assistants;
    voice tech; speech recognition; mixed reality; botification; smart devices; enterprise
    solutions using chatbots and ai; holograms; 3d avatars; augmented reality and
    virtual reality


