    ## Alexa Skills for Food, Fitness, and Daily Life


    ### Food & Delivery Skills


    *   Similarly, **Meal Idea** will give you recipe ideas that call for common,
    everyday items you likely already have in your pantry. It suggested things like
    bone soup (out of canned tomato soup and elbow noodles) and a salad made of salad
    greens, canned beets, and goat cheese. At least one of those sounds great.

    *   One of my personal favorite skills is **Domino''s**. You can **place your
    Domino''s Easy Order** just by speaking, "Alexa, open Domino''s and place my Easy
    Order." You can also track the status of an order you''ve placed by saying, "Alexa,
    open Domino''s to track my order."

    *   If **Pizza Hut** is your jam, there''s a skill for that, too. To get started,
    first enable the skill, link your account, and say, "Alexa, tell Pizza Hut to
    place an order."

    *   **Starbucks** lets you place an order using Alexa with the **Starbucks Reorder**
    skill. After you enable the skill, you will need to link your account. The skill
    will not work unless you''ve previously placed a mobile order with the Starbucks
    app on Android or iOS. It can place an order at one of the last 10 Starbucks locations
    you''ve visited in person. You can also check your account balance and switch
    between your five previous mobile orders.


    ### Fitness & Wellness Skills


    *   For those familiar with the **7-Minute Workout**, you''ll be happy to learn
    there is a skill for the famous workout available on Alexa speakers. Say, "Alexa,
    open 7-Minute Workout." The workout will begin. You can pause and resume workouts
    as needed.

    *   Similarly, there is a skill for a **5-Minute Plank Workout**. This skill walks
    you through five minutes of various planks with a 10-second break between each.

    *   If you wear a **Fitbit** tracker on your wrist, you can enable the **Fitbit**
    skill. With this skill, you can ask Alexa about your progress or how you slept
    the night before. Before you can use the skill, however, you will need to link
    your Fitbit account by going to the skill page at `alexa.amazon.com` and linking
    your accounts.

    *   For tracking your food, you can use the **Track by Nutritionix** skill, which
    lets you record your food intake using your voice, or ask for caloric values of
    foods. (Alexa does the latter by default.) Say things like, "Alexa, tell Food
    Tracker to log a cup of almond milk" or "Alexa, ask Food Tracker how many calories
    are in two eggs and three slices of bacon."

    *   Each day, **Guided Meditation** will give you a different meditation routine,
    ranging from three to eight minutes. If you''re not digging the current routine,
    you can say, "Alexa, play next" to skip to the next exercise.


    > **Read more:** *The best Alexa commands for exercise, better sleep and stress
    relief*.


    ## Privacy, Data, and the Business Model


    Anyone with any experience of interacting with media, whether it is TV, print,
    or digital, understands that the business model is frequently: user watches ads
    = user buys advertised stuff + makes money for the ad platform and the manufacturer
    or provider of said stuff. Clearly, by simply asking for everyday needs like what
    to cook, how to exercise, even how to sleep, you are providing the "sponsor" or
    advertiser behind the freely given Skill precious data about you, your daily habits,
    your preferences for buying stuff, and most importantly, how much you are prepared
    to shell out—thus creating a track record of your spending.


    This is gold in the new "Data is Oil" era. And we are unclear through the advertorials
    and online incessant pitching of the dominant, essentially monopoly power providing
    these "free" services into your car, home, and very bedroom, how much we are actually
    paying for it in terms of privacy and data protection.


    Even viewing this slideshow of images of what Amazon Alexa can do for me, embedded
    within the CNET article discussed earlier,[^1] I am being tracked by CNET, Amazon,
    and who knows which third-party advertisers who want my cookies for marketing
    purposes. Once opted in, how can a user ever opt out?


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c6fig3.JPG)


    **Figure 6.3** © Realfiction, Copenhagen, 2019. Mixed Reality experiences will
    become ever more sophisticated and overpowering for the senses. Here a woman immerses
    herself in the hologram illusions of buildings and objects projected over her
    Real Time perception of a night cityscape. Is it art or a commercial experience?
    The convergence seems to be necessary in the early 21st century''s new Experience
    Economy giving way to CX tech and innovations like the ones discussed in this
    book.


    To ensure that the future of our digital lives entails diversity and insight,
    right now there needs to be more freewheeling exchange and less cautious interaction
    only ever orchestrated in controlled environments—university seminars, academic
    conferences, and even trade show panel debates that can end up being "safe spaces"
    for peer-only meetings. If we fail to get this dialogue between theorists and
    practitioners firmly established sustainably, we risk what I call **disconnectivity**.


    This occurs when the theorizing on the grand topics of the "ethics of Artificial
    Intelligence" and how to "control the risks" presented by some uses of AI bots
    and ubiquitous Virtual Assistants and Cognitive Interfaces actually become irrelevant
    because they are disconnected from the Mixed Reality of this exciting new world
    of human–machine interaction. The "Posthumanist Age," as I explained in the Dedication
    pages of this book. Enjoy enhanced connectivity and be mindful of who you are
    excluding and including in your exchanges about this ever-riveting subject that
    will soon become an empowering aspect to our everyday lives, as soon as the hype
    dissipates and we begin to experience a multitude of (mixed) realities.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c6fig4.JPG)


    **Figure 6.4** A large robot with finely-tuned movements cooks popcorn autonomously,
    i.e., unsupervised by humans on its own, in a kitchen despite what many would
    perceive to be a high-risk, even dangerous situation and task—for robotics and
    AI. Taken from the film "Hi, AI" by Isa Willinger © Kloos & Co Medien, Berlin,
    2019.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c6fig5.JPG)


    **Figure 6.5** China is now a huge manufacturer of robots with AI interactivity
    such as reading emotions and recognizing faces of individuals. Meanwhile, Japan
    is reported to be manufacturing several thousand new types of robot every month.
    Japanese robots are often humanoid like this one with "convincing skin" and realistic
    blinking eyes. However, this has not yet completely removed them from the "Valley
    of the Uncanny" whereby human-looking and acting robots "freak out" ordinary people
    who feel uneasy that the robot is almost like them, but not quite. Taken from
    the film "Hi, AI" by Isa Willinger © Kloos & Co Medien, Berlin, 2019.


