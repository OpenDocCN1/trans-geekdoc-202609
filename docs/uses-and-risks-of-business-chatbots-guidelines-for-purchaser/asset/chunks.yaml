    ## 4. 如果你搜索“Tay chatbot”


    搜索结果的标题讲述了它们自己的故事：主流媒体甚至许多技术专家都宣扬了一种观点，即一个本质上良好的 AI 机器人被所谓的“邪恶、恶意的人类”玷污和腐蚀了。


    ## 5. 为什么这是不真实的？


    因为没有客观证据表明该 Twitter 账户被黑客入侵，如果真被入侵，Twitter 本身会立即采取行动屏蔽该信息流。


    ## 6. 这引出了下一个问题


    为什么 Twitter 信息流的所有者和安装的聊天机器人 Tay 在出现麻烦时没有立即封锁该账户？他们本可以轻易在早期就撤下账户，但却让它保持活跃，发布最具冒犯性的言论并转发评论，至少持续了两天。


    ## 7. 似乎在享受公关和营销红利


    这很像一个“恶棍 YouTuber”在网红引发冒犯并获得数百万观看时所获得的关注一样，微软让 Tay 继续“天真地”重复人类最糟糕的言论，风格类似于 Reddit
    和 Breitbart 那种未经审查的评论污水。


    ## 8. 微软未被起诉


    至少据我们所知，没有任何人权倡导团体、受诽谤的族群或政府监管机构成功起诉过微软。


    ## 9. 他们发布的即时“辩护”


    由微软传播总监发布的声明称，微软是一个聊天机器人的无辜所有者，该机器人被残酷地引入歧途，无意中冒犯了数百万人——毕竟 Tay 只是一个聊天机器人。


    这个论点中显而易见的漏洞如下：


    1.  作为一家跨国数十亿美元的公司，微软本应有员工在全球范围内全天候监控这个聊天机器人，覆盖其公开亮相的前 24 小时所有时区。究竟为什么没有一位微软经理或员工做出决定，封禁这个故障聊天机器人？

    2.  构建防御机制（如过滤器）以阻止聊天机器人（无论多聪明或愚蠢）学习“脏话”和冒犯性观点，这相对容易。这是《创建机器人教程 101》的基础内容。

    3.  瞬间关闭或隐藏一个坏机器人甚至更容易。隐藏它很简单，因为你只需在其运行的账户（本例中为 Twitter、Facebook Messenger 或 Microsoft
    Bot Network）中将其停用。

    4.  粉碎微软所有关于清白和“缺乏责任”抗辩的决定性证据——针对聊天机器人的渎职和罪行（例如煽动仇恨和暴力、诽谤可识别群体等）——仅仅在于：那个好的聊天机器人现在在哪里？

    5.  微软确实发布了 Tay 的继任者，名为 Zo，存在时间从 2016 年到 2019 年初。[6](#02_Chapter_2.xhtml#footnote-049)


    也许微软构建的聊天机器人从未具备真正的 AI 能力。如果微软拥有所有机器人开发者梦寐以求展示的“圣杯”般的 AI，他们肯定会在 Tay 的继任者身上展示出来？但直到
    2020 年的今天，他们仍未这样做。


    这很可能会成为聊天机器人历史上最大的故意骗局。我们中只有少数勇敢的技术博主（像我）揭露了这一点，因为当一家美国巨头实际上统治了文字处理领域，并属于一个既能施加惩罚也能提供并购机会的科技巨头卡特尔时，有太多东西需要恐惧。最糟糕的结果是，许多
    2D 聊天机器人开发者变得很难向潜在客户推销其独立服务——他们都失去了对机器人开发者“控制其化身”能力的信任。如果微软无法控制 Tay，你如何控制你的机器人或阻止它被“腐蚀”？这确实损害了我们许多人的销售，特别是我的老公司
    velmai 当时发布的几个挑战者聊天机器人。


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c2fig2.JPG)


    **图 2.2** © Cliff Lee（化身 UX 设计）和 Darren Lee（网站平面设计）。金融服务 2D 聊天机器人 Sophie 在微软“Tay
    灾难”后变得难以销售。


    ## 克林顿对特朗普聊天机器人大战


    我将简要总结，因为这相当不言自明。如果你在网上搜索（我推荐法国的 Qwant 或荷兰的 Startpage.com 搜索引擎），你会找到关于“trump clinton
    chatbots”查询的安全独立结果。大量博客文章和新闻报道了这些化身在上一届高度激烈且有争议的美国大选中产生的影响。毋庸赘述，许多在 Twitter 和
    FB 上抨击克林顿的垃圾机器人犯有仇恨言论、骚扰、种族诽谤或煽动仇恨罪，无论是否自动化。


    主要总统竞争者——民主党的希拉里·克林顿和共和党的唐纳德·特朗普——势均力敌。有趣的是，这是全球和聊天机器人历史上首次出现两个主流美国政党及/或其支持者都诉诸化身部署的情况，甚至被标志性的传统媒体《华盛顿邮报》严肃分析和对待！[7](#02_Chapter_2.xhtml#footnote-048)
    事实上，一位机器人开发者 SapientX 同时为双方政治阵营创建了聊天机器人，推测是采取了无偏见的特朗普对克林顿立场，以获取其技术的观看量和互动。[8](#02_Chapter_2.xhtml#footnote-047)


    《VentureBeat》的一位编辑对 AskHilaryandDonald.com 平台印象深刻（顺便说一句，如果你尝试点击进入，该平台现已失效）。以下是
    Khari Johnson 的介绍：


    > 可能几乎所有事情都有相应的应用程序（很快也会有机器人），但这可能是首创。SapientX 是一家处于隐身模式一年的公司，为唐纳德·特朗普和希拉里·克林顿创建了聊天机器人，它们能直接从候选人嘴中提供关于从堕胎到税收再到恐怖主义等话题的原话。

    >

    > 这些聊天机器人能以文本或语音回答约 100 个话题的问题，例如：“你怎么看 Black Lives Matter 运动？”或“你认为女性应该获得同工同酬吗？”完整的示例问题和话题列表可在
    [此处](https://www.askhillaryanddonald.com/assets/Sample_Questions.pdf) 的 VentureBeat
    文章中找到。[9](#02_Chapter_2.xhtml#footnote-046)


    有趣的是，尽管 Johnson 称 SapientX 处于“隐身模式”，但他们随后引用创始人之一的话称，他们实际上已经运营了一段时间，拥有“Conversational
    AIs” 和基于语音的聊天机器人——客户不亚于美国情报机构（CIA、FBI）。


    希拉里和唐纳德机器人是 SapientX 首次公开分享的机器人。在推出这些语音识别政治机器人之前，SapientX 曾与“美国情报部门的各个部门在 AI 和机器人技术上合作了十多年”，Hirshon
    表示。[10](#02_Chapter_2.xhtml#footnote-045)


    Johnson 还提到了其他几个特朗普机器人平台，它们是讽刺或恶搞化身，独立于 2016 年的总统候选人运作，那是特朗普和克林顿宣布竞选最高职位一年后的事。


    [www.deepdrumpf.com](http://www.deepdrumpf.com) 基于著名的英国喜剧演员、移民美国的 John Oliver
    在 HBO 播出的《Last Week Tonight》周喜剧节目中的一段讽刺作品。DeepDrumpf 是一个 Twitter 机器人，于 2017 年
    5 月失效（像许多早夭的 2D 聊天机器人一样！），比其账户于 2016 年 3 月创建晚了一年多。该化身的 Twitter 个人资料神秘地陈述道，试图为其存在众筹：


    ```

    DeepDrumpf

    @DeepDrumpf

    I’m a Neural Network trained on Trump’s transcripts. Priming text in []s. Donate
    (http://gofundme.com/deepdrumpf ) to interact! Created by @hayesbh.

    ```

    '
