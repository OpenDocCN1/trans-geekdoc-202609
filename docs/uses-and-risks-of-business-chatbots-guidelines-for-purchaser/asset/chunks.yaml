  trans: '

    简而言之，由于 velmai 需要每周最多往返客户现场四次，持续近两个月，这在时间、金钱和精力上都是一项巨大的投入，旨在让原型机在公共空间投入运行。需要在现场用德语训练机器人大脑的内容如下：


    *   必须测试其对周围环境的“地图知识”，即 30 多家商店和设施、餐厅、咖啡馆及服务。她在这方面的整体表现极佳，我当时在 Medium 博文中对此进行了记录。32

    *   Amalia 需要在商场上方安静的办公空间里进行现场持续练习，以便实时理解德语中的新信息、随机问候语和称呼方式。

    *   她需要与德语母语者对话，因为我的德语带有浓重的英语口音。这让她感到困惑，她一直用英语回复我，尽管她已经用德语理解了我的问题和评论！33

    *   有些客户（未）提供的信息必须在最后一刻添加，例如，地下楼层在英语和德语中都被称为 Basement，他们用外来语 Basement 代替了德语单词
    Untergeschoss。因此，必须为所有商店、美食广场餐厅、洗手间、婴儿护理室以及通往地铁的出口调整这一称呼。

    *   地铁必须称为 underground train 或 tube，因为食品连锁店 Subway 也位于 Basement。这让 Amalia 正在有机学习的机器人大脑感到困惑！其他英文公司品牌名也是如此，例如
    Flying Tiger Copenhagen、“Only”（一家服装店）、Depot、美妆连锁店 “Rituals”、Comfort Baby、Claire’s、Hair
    Express、the Barber、US Nails、Bun n Roll 和 Fruit World。

    *   我在关于此事的三篇 Medium 博文之一中，专门写了一篇趣文，讲述 Amalia 如何对名为 Eyesight 的虹膜摄影店开玩笑。34 我们不得不更改一些条目，比如虹蜂摄影店，我们人类误以为它是卖眼镜和眼部护理产品的验光师。实际上，它是一家礼品店，Amalia
    最终对其进行了大量深思熟虑，并无意中讲了一个笑话。


    ![Image](img/c2fig3.JPG)


    图 2.3 © AI BaaS UG, Munich, 2019. Amalia I 部署在一家年客流量达 1000 万的科隆购物中心。此处可见其继任者 Amalia
    II 即将在慕尼黑部署，面对大小人群，实现常见问题解答和资讯娱乐的多语言自动化。


    ## 从业务开发和客户联络角度吸取的教训


    我们在科隆的试验中发现：


    *   不要过于野心勃勃——作为**最小可行性产品 (MVP)**，花哨的功能必须留到以后再加。

    *   如果客户坚持要求书面协议中未约定的某些功能，则可以制定时间表，在稍后阶段添加这些元素，例如在试点的下一阶段。

    *   在实施前、中、后控制客户的预期。

    *   仅与可靠的硬件供应商或所需的任何其他外部模块供应商合作。

    *   现成的软件插件最容易添加，而不是让合作伙伴进行定制编码。

    *   尽可能**将一切纳入内部**！这样你就不再容易受到外部供应商和第三方合作伙伴的失败和延误的影响——包括反复延期和交付故障设备。

    *   我们现在会在开始构建定制机器人大脑之前，发送一份定制模板给客户填写。请参阅我们新公司 AI BaaS UG 关于汽车展厅案例研究中的标准客户模板。

    *   我们现在有一份标准合同，必须在开始任何类型的试点或企业活动之前达成一致并签署。其中规定了所有相关方的付款条款和交付里程碑。


    迄今为止，你在世界各地看到的几乎所有全息投影都没有 AI 机器人大脑。这使得 AI BaaS UG 成为全球首家通过全息图创建带语音的**认知界面**的机器人开发商。


    ![Image](img/c2fig4.JPG)


    图 2.4 © Realfiction, Copenhagen, 2019. 这家丹麦公司是我们的硬件供应商，近十年来一直在创建高品质的“预录制”全息图。他们的
    3D 全息图互动性有限，通常通过键盘、设备上的按钮和/或手势进行。


    ## 案例研究 #3：汽车展厅中的“迎宾销售”全息图


    这是我们的生产和销售团队在我完成本书（2019 年秋季）时正在处理的一份提案请求。我将在该教材的下一版中对此进行报告，如果不作为续集或相关期刊的文章发表的话。在我们运行了购物中心机器人全息图安装后，销售团队决定我们管道中的下一个最佳原型将是汽车展厅混合现实装置。与购物中心
    AI 机器人全息图不同，该装置将减少导航功能，增加直接销售功能。


    安装在销售点意味着 AI 机器人必须理解试探性询问、关于库存的犹豫提问，并且在建议潜在客户与其人类同事交谈时不能过于咄咄逼人。显然是为了将销售推进到成交阶段。


    我们的销售团队需要在销售过程中管理预期，以免客户及其组织中的其他人错误地认为他们刚订购了一个类人机器人或像科幻电影里的 AI 克隆体。这类电影有很多，让“AI
    门外汉”对我们的发明和创造物产生困惑和过高期望！因此，我们开始制作演示视频，并将在德国的各个地点让原型机现场运行。如果潜在客户无法前往我们在宾根莱茵河畔或蔚蓝海岸的主办方/展厅，他们可以参加与
    AI 机器人全息图的直播会话，既可以看到其 3D 虚拟形象，也可以与其 2D 形态聊天。


    ![Image](img/c2fig5.JPG)


    图 2.5 © AI BaaS UG, 2019 年 10 月. 我们公司登陆页面 [www.ai-baas.com](http://www.ai-baas.com)
    上宣传视频的屏幕截图。新企业于去年秋天从慕尼黑郊区格吕恩瓦尔德的巴伐利亚电影城启动。


    ## 案例研究 #4：英国工党机器人在约会网站上“失控”


    2017 年全国大选期间，英国工党使用定制的 Facebook Messenger 聊天机器人取得了毁灭性效果。我在我在坎特伯雷肯特大学举办的实习项目（目前已举办两届）中，将此例作为道德测试使用。我们为期两周的
    velmai 国际和本地实习生们，对创建聊天机器人的“该做和不该做”这一挑战感到欣喜。


    本质上，工党在其官方党部 Facebook 页面上创建了一个聊天机器人。这意味着，在该竞选活动期间（后来被停用），当你访问英国工党 FB 页面时，即使不是粉丝或成员，也会收到其虚拟形象的问候，该形象恰好是英国玫瑰，即该党的标志。我本该对此现象进行录制和截图，因为这个小机器人注定将在全球聊天机器人演变史上占据重要地位，尽管这段历史可能尚未被书写。

