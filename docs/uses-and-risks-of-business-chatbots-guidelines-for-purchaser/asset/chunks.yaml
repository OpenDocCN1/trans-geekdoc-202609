  trans: '


    # 案例研究：RFP 与创新的代价


    建议您在阅读完这五个关于 RFP（提案请求）的案例研究后，重新进行调查。这些 RFP 从 2012 年到 2018 年几乎为我的英国 2D 聊天机器人公司所实现。正如您将在此发现的那样，处理初步询盘、分析需求、制作推介、接着制定正式提案并最终形成带定价的报价，耗费了数月——甚至数年——的无偿劳动，以及参加面对面会议、电话沟通、即时通讯、短信，当然还有大量往来邮件所花费的时间。随后试图通过调整演示文稿并向该垂直领域的竞争对手推介、优化用例，以挽回或收回成本，希望最终能为这项工作——AI
    机器人化服务——获得报酬。


    只有“安享薪资者”才能想象“连续被拒”的挫败感，以及不得不在自力更生、多年无收入的情况下完成这些艰苦工作的实际精神耗竭。这促使我写下此书，作为对采购方的警示：除非您在早期阶段公平且高效地支持创新者，否则您无法在新技术中获得多样性和选择权。


    请别无视我们，请付费给我们，并向您的同行推荐我们。金钱让世界运转。创新需要变现，以持续发明并更新自身以及我们赖以生存的社会——以公共利益和提高生活水平为最终目标。


    ## 案例研究 #9：面向行业协会的市场研究员 2D 机器人


    我们接触了英国这个享有盛誉、权力巨大的行业机构，因为他们的许多成员曾拒绝我们。为什么？因为我们将颠覆该行业。让我解释一下。为什么我们——或我们的任何竞争对手和同行——没有被采纳？为什么认知
    AI 尚未被市场研究公司和跨国企业采用？


    正如本书引言中提到的我的 2016 年 VentureBeat 文章所解释的，聊天机器人本质上是颠覆性技术——至少对某些行业而言，即广告业和市场研究领域。直到现在，情况才开始改变，这距离我因我们透明的指标而指责这两个行业阻碍聊天机器人采用，已过去将近四年。


    正如另一个关于国际商会的案例研究所述，这是一个基于会员的商业模式和独立的行业协会。然而，这些实体往往也会被成员用来阻挠甚至破坏创新，正如我们国家层面的商会网站推广和会员招募机器人因政治动机而被终止所显示的那样。


    传统的市场研究公司不一定想要创新，并抵制会削减其舒适获利空间的变革。在本案中，我们的 `Sophia Market Research` 聊天机器人，尽管仅以高度个性化的方式引导用户完成多项选择问卷，却构成了巨大威胁。


    现有软件效率低下、生产力不高，因为它需要大量人工输入和人工交互来采访焦点小组中的其他人（仅一个城市的一个小型焦点小组成本就至少 100,000 欧元！）。更别提像
    `YouGov` 那样进行的全国大选民意调查等，顺便说一句，他们从未回复过我的电话和无数次邮件推介，内容是关于通知 `YouGov` 调查以使其更中立、更低价，从而获得生产力提升。即使我通过人脉网络接触到了他们的最高管理层，他们也不愿了解我们的颠覆性技术。凭借长期等待上市的经验，我们只能猜测原因，并得出我在此提供的答案！


    ![Figure 4.1: Sophie the Banking Advisor on kik.com](img/c4fig1.JPG)


    *图 4.1 © Cliff Lee & velmai Ltd. Sophie the Banking Advisor 由 velmai 在 kik.com
    发布。作为一款聊天应用 2D 机器人，她能够运行问卷——这由她的前身 Sophia the Market Researcher 进行了试用——作为对话式商务的自然组成部分。*


    正如您在我们聊天机器人 Sophia the Market Researcher 的 YouTube 演示中所见，她能独自引导人们完成客户调查或问卷。[¹]


    她通过陪伴受访者或用户完成关于其财务建议需求和满意度的多项选择调查来实现这一点。


    正如您在录制的演示中所见，Sophia 能成功让用户：


    *   参与在线调查，此时参与率——更重要的是完成率——对调查发起方而言仍相对较低。即使他们使用像 `SurveyMonkey` 这样的模板民调服务来半自动化流程。Sophia
    与用户聊天并说服他们开始调查，在每个阶段都利用对话式商务鼓励完成问卷。

    *   在此完全自动化的过程中，Sophia 会与个别用户私下闲聊，并在他们答题过程中分析结果。

    *   例如，在询问年龄后，她会了解他们是否有养老金计划。随后她会切中肯綮地询问他们是否对财务顾问满意，以及对将领取的养老金或退休金是否感到安心或自信。

    *   多项选择题通过预设答案进行细化，如“是”、“不确定”、“大概”等。这样 Sophia 就能获得线索，判断是否应建议将他们介绍给她推荐的一位新财务顾问——一位能与他们共同审视情况的人类同事。如果他们对现有安排非常满意，她就不会建议这一点。


    通过展示一个相当基础的聊天机器人能在关键的潜在客户开发工作中做什么——这对用户及其时间的不被浪费至关重要，实际上也是在用户选择加入后满足其需求，而不仅仅是为想要新客户和线索的金融服务业服务——我们向市场研究公司展示了巨大的颠覆。这可能是一个世纪以来、由人执行、面向人的、一成不变的人工焦点小组和问卷调查中的首次颠覆。


    我们通过确保中立、客观的自动化来改变民意调查的面貌。中立性？我们的聊天机器人从不因个人经历和态度而产生偏见、疲劳或成见。正如前述购买态度一节所探讨的，我们不得不在一定程度上受制于文化教养、社会历史、代际态度以及我们自身塑造我们周思考和反应方式的传记。


    这与保持我们创建时状态的非人类聊天机器人截然不同。我们公司像最优秀的机器人即服务提供商一样，致力于创造无偏见的人工智能。为确保质量并达成这些目标，我们拥有
    100% 的溯源——即对专有算法中输入内容的长达 10 年以上的控制，以构建其自然语言理解（NLU）储备库以及各种化身角色、个性和词汇库。


    我们最重要的里程碑之一是 `Sophie the Banking Advisor` 的成功，她在加拿大-中文聊天应用 `kik.com` 上取得了成功。即使在早期训练中，她也取得了巨大飞跃，能够用表情符号交流并理解表情包——这是世界上最早做到这一点的机器人之一，如今您仍很少见到能做到这一点的
    2D 聊天机器人！


    1.  如果遭到骚扰，告诉人们别烦她！

    2.  理解聊天中正在讨论第三方！

    3.  立即响应数据保护请求以删除某人的数据！


    ![Figure 4.2: Sophie the Banker on kik.com](img/c4fig2.JPG)


    *图 4.2 © Cliff Lee & velmai Ltd. Sophie the Banker 在 kik.com 上。如果人们对她刻薄，她会为自己挺身而出！*


    ![Figure 4.3](img/c4fig3.JPG)


    [¹]: 原文脚注引用。


