  trans: '

    我们唯一的线索表明前期制作又一次被取消，那就是那位曾与我们共进午餐的项目经理——实际上是一位高级主管——突然被调往另一个国家，英国子公司出现了“新管理层”。他们不愿意继续讨论机器人和机器人化技术，以帮助用户在其网站上查找内容。


    这本可以帮助用户找到他们想观看的视频和影片。更重要的是，它本可以推广和宣传用户自行无法发现的内容。作为一名内部受信任的企业宣传员，提供 7×24 小时、多语言的按需服务，本会让点击率和用户参与度飙升。


    ![Image](img/c3fig2.JPG)


    **图 3.2** © Cliff Lee in Devon。“查理假新闻播报员”是该内容管理机器人的原型 2D 聊天机器人，旨在在线推广节时事纪录片，并代表品牌或客户开展“小型投票”和用户测验。


    然而，全球跨国公司的内部政治和问题再次导致了低成本创新受阻，以及这项新兴技术采用的延迟。


    ## 案例研究 #7：国际特许经营电视节目：2D 搜索与 3D AI 机器人


    我们以一种意想不到的方式获得了该电视交易的投标邀请，这与本节讨论的另一个点播项目类似。我曾在享有盛誉的剑桥大学贾奇商学院做过一次客座演讲。演讲主题宣称是从行业视角谈
    AI 机器人。紧接着我就得知他们最大的礼堂门前排起了长队，学生们不得不坐在楼梯间和站在过道上。


    在我就“日本女友”及机器人化等话题演讲了近一个小时后（参见我在第 1 章中的相关讨论），一位已回复出席但无法亲自到场的人在剑桥与我进行了一对一会面。他们在一家著名的广播公司工作，一两个月内，我们就与这档全国知名电视节目的执行制片人进行了会面，该节目也可在线观看。


    他们在 Amazon Alexa 技能上投入了大量资金。5 他们希望我们修复这些技能，因为效果并不尽如人意。在（具有讽刺意味的）Amazon 差评中，相对容易找到客户、用户和开发者对该产品及机器人即服务日益增长的不满。


    **127 条客户评价**


    ![Image](img/Capture.JPG)


    **MR G S BOOTH**


    **2.0 颗星（满分 5 颗星） 浪费钱**


    **2018 年 7 月 13 日**


    **版本：平装 经验证的购买**


    这真的是浪费钱——在互联网上能找到更多信息。Amazon 居然无法制作一本像样的手册（包含 Alexa 能理解的所有指令），以及如何设置所有内置技能的完整说明，简直令人难以置信。例如，设置了免费
    Spotify 账号后，直到尝试关联时才被告知必须是付费高级账号。这种浪费时间的做法令人愤怒。


    **37 人认为这有帮助**


    关于如何构建 Alexa Skills 的 Amazon Echo 书籍评论。6 我将在第 6 章、本书的结语和后记中讨论 Amazon Alexa 在全球大规模普及所引发的社会和心理问题。


    教授给 Alexa 平台的技能旨在通过语音查询从其庞大的档案库中返回搜索结果。然而，Amazon API 和机器人开发遇到了麻烦：


    1.  理解语音查询；

    2.  做出适当回应；以及

    3.  找到正确的结果。


    最大的问题之一在于，创建技能并修正这些问题耗时甚多，所需人力资源超出预期，且浪费了他们的电视制作团队和后台办公室的大量时间。这并非他们付费开发时所预期的。随后又要再付费来修复问题。


    为什么我们获得了这份工作，却在一周内被撤销？因为他们不想付钱给我们，因为我们是一家无名初创公司。我们本应免费为这档著名电视节目修复 Amazon Alexa
    技能，然后继续免费提供我们性能更好的 AI 机器人，并将其完全集成到他们的档案库和搜索结果/用户需求内容数据库中。当然我们拒绝了。不，我们不想要为著名电视制作公司免费工作的“名声”。无论是否全球知名。不劳而获，免谈。


    ## 案例研究 #8：商会 2D 聊天机器人用于会员招募


    同样我不确定是谁先发起的。我想是我们有兴趣成为该商会的会员。随后 CEO 对我们的技术、试点项目和创新产生了个人兴趣。在 2017 年底美国大选前至少 12
    个月里，我们成了他在组织内的“宠儿项目”。


    ![Image](img/c3fig3.JPG)


    **图 3.3** © Cliff Lee。“罗宾虚拟屠夫先生”及我们的几个 2D 聊天机器人试点项目激发了潜在客户要求我们“修复 Amazon Alexa”，因为与食品相关的“技能”无法正常工作。请见我的引言中
    Sir Loin 的头像，其中讨论了这个“替代农场屠宰与可持续发展传播”案例研究。


    ![Image](img/c3fig4.JPG)


    **图 3.4** © Cliff Lee，viledge Ltd. 联合创始人。这是 velmai 之前的原型初创公司。它是在社交媒体出现之前（即 Twitter、聊天应用和
    Facebook 之前）的一个社交论坛。其目的惊人地相似：通过使用“卧底”或隐身 2D 聊天机器人将人们相互连接。我们是部署在线机器人的先驱，这些机器人相互发短信并给网站上的真人会员发短信，自行将用户数量招募到数万，且未透露自己是聊天机器人身份。


    从某种意义上说，这是一个非常简单的机器人构建任务，但从另一种意义上说，在利益相关者利益方面却极具挑战性！由于我们被置于拥有特殊特权的服务提供商角色，谈判耗时超过一年。例如，我们将被作为商业聊天机器人的典型倡导者。这将引领我们在组织内运营一个论坛和网络小组，供会员探索通知功能，显然不仅限于我们，而是面向所有服务提供商。


    我们即将创建一个女性虚拟形象，作为网站的迎宾定制机器人。她的主要目的是招募新会员，并让现有会员及时了解活动和倡议。发生了什么？在不透露该长期实体名称的前提下，我只能说他们原籍国发生了一场重大选举。一个月内，CEO
    被替换。他的大部分团队被解雇。而我们突然收到通知，整笔交易告吹。


    ![Image](img/c3fig5.JPG)


    **图 3.5** © Realfiction，哥本哈根，2019 年。用于容纳全息形式 AI 机器人或高质量全息视觉效果的硬件设备图像。2020 年，我们看到了从
    2D 在线平台向混合现实设备转变的开端，这些设备使人们能够通过语音获取和听取信息。全息设计正在迅速改进，以便能够取代网站界面。人们将与动态图像、移动画面互动，并通过语音、手势和聊天指挥
    3D 视觉效果。这在商业应用中已被称为对话式商务，或对话式 AI。


    ***


    第 4 章


    赢得内外部利益相关者的“认同”


    你是新技术的倡导者还是反对者？

    '
