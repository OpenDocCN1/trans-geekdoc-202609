- raw: 'I suggest you redo the survey after reading these five case studies about
    RFPs, Requests for Proposals, that nearly materialized for my British 2D chatbot
    company from 2012 to 2018. As you will discover here, dealing with the initial
    enquiries, analyzing needs, creating a pitch, then a formal proposal leading into
    an estimate with pricing took months even years of unpaid labor and time spent
    in face to face meetings and on the phone, Instant Messaging, texting and of course,
    a multitude of emails back and forth. Then trying to salvage or recoup costs by
    tweaking the presentations and pitching to competitors in that vertical, refining
    the use case in the hope of finally being paid for the work, the service of AI
    botification.


    The frustration of “serial rejections” and actual mental exhaustion of having
    to do these hard yards bootstrapping and without an income for years can only
    be imagined by the “securely salaried.” It was the impetus of writing this book,
    as a salutary warning to purchasers that you won’t get diversity and choice in
    new technologies unless you fairly, efficiently support the innovators in the
    early stages.


    Don’t dismiss us, pay us, and promote us to your peers. Money makes the world
    go around. Innovation needs monetization to keep inventing and renewing itself
    and the societies we live in—for the common good and betterment of living standards
    as the ultimate goal.


    Case Study #9: A Market Researcher 2D Bot for an Industry Association


    We approached this prestigious, powerful industry body in the UK because many
    of their members had rebuffed us. Why? Because we were going to disrupt the industry.
    Let me explain. Why werenʼt we—or any of our competitors and peers—taken up? Why
    isn’t cognitive AI already adopted by the market research companies and multinational
    corporations?


    As my 2016 VentureBeat article mentioned at the Introduction of this book explains,
    chatbots are essentially disruptive technology. At least for certain industries,
    namely the advertising sector and the market research space. It is only changing
    now, almost four years after I called both industries out for their blocking chatbot
    take up because of our transparent metrics.


    Much like the other case study about an international Chamber of Commerce, it
    is a members-based business model and an independent industry association. However,
    often these entities can also be used by members to block and even sabotage innovation,
    as was the politically motivated termination of our national roll-out of the Chamber
    website and membership recruitment bot.


    Legacy companies like market research corporations donʼt necessarily want innovation
    and resist change that will cut their comfortably attained profit margins. In
    this instance, our Sophia Market Research chatbot, simple as she was in guiding
    users through a multiple choice questionnaire but in a highly personalized manner,
    was a huge threat.


    The incumbent software was not efficient and productive because it required a
    lot of human input and human interaction for interviewing the other humans in
    focus groups (one small focus group in one city alone can cost a minimum of €100,000!
    Not to mention national polling for elections and the like as done by YouGov.
    Who never answered my calls and numerous email pitches by the way about notifying
    YouGov surveys to make them more neutral and lower priced for the productivity
    gains. Even when I networked to their very top management, they didnʼt want to
    know about our disruption. We can only wonder why and come up with the answers
    I have provided here, from long time, waiting to go to market experience!


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c4fig1.JPG)


    Figure 4.1 © Cliff Lee & velmai Ltd. Sophie the Banking Advisor was released by
    velmai on kik.com As a chat app 2D bot, she was able to run questionnaires—as
    trialled by her predecessor Sophia the Market Researcher—as a natural part of
    the Conversational Commerce


    As you can see in this YouTube demo of our chatbot, Sophia, the Market Researcher,
    she could guide people through a customer survey or questionnaire.[1](#04_Chapter_4.xhtml#footnote-063)
    On her own. She did this by accompanying the interviewee or user through a multiple
    choice survey on their financial advice needs and satisfaction.


    As you can see in the recorded demo, Sophia could successfully get the user to


    *   Participate in an online survey when the engagement rates—and most importantly
    completion rates—remain comparably low for survey holders. Even if they semiautomate
    the process by using a template polling service like SurveyMonkey. Sophia chatted
    with the user and persuaded them to start the survey and at every stage used conversational
    commerce to encourage the completion of the questionnaire.


    *   During this fully automated process, Sophia would chit-chat with the individual
    user privately and analyze their results as they went through the questions.


    *   For example, she would find out if they had a superannuation plan after asking
    their age. She then pointedly asked if they were satisfied with their financial
    adviser and were they feeling good or confident about the super or pension they
    would be paid.


    *   The multiple choice questions were nuanced with prequalified answers, like
    yes, not sure, probably and so on. That way Sophia got a cue as to whether she
    should offer to put them in touch with a new financial adviser she could recommend,
    a human colleague who could review their situation with them. If they were very
    happy with their existing arrangements she would not suggest this.


    By showing what a fairly basic chatbot could do in this crucial lead generation
    work—crucial for the user and their time not being wasted or in fact a need being
    met after opting in, not just for the financial services industry wanting fresh
    clients and leads—we presented the market research companies with a huge disruption.
    Probably one of the first in a century of unchanging, human-run focus groups,
    and questionnaires executed by people to people.


    We change the face of polling by ensuring neutral, objective automation. Neutrality?
    Our chatbots are never biased, tired, or prejudiced given their personal stories
    and attitudes. As explored in the aforementioned purchasing attitudes section,
    we cannot help but be captive to a certain degree by our cultural upbringing,
    social history, intergenerational attitudes, and our own biographies shaping us
    how we think and react week to week year to year.


    Unlike the nonhuman chatbot that remains as we created it. Our company is striving
    like the best-in-class Bots as a Service providers to create unbiased Artificial
    Intelligence. To ensure quality and that these goals are reached, we have 100
    percent provenance, that is, control over what has gone into the proprietary algorithm
    over more than 10 years to build up its reservoir of Natural Language Understanding
    (NLU) and repertoire of various avatar characters, personalities, and vocabulary.


    One of our most important thresholds was reached with Sophia the Banking Advisor
    who succeeded on the Canadian-Chinese chat app, kik.com. Even in her early training,
    she made big leaps being able to communicate in emoticons and understanding emojis—one
    of the first in the world to do so and you still rarely see 2D chatbots able to
    do this!


    (a) Telling people to leave her alone if she was being harassed!


    (b) Understanding that a third person was being discussed in a chat.


    (c) Acting immediately on data protection requests to delete someone’s data!


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c4fig2.JPG)


    Figure 4.2 © Cliff Lee & velmai Ltd. Sophie the Banker on kik.com. Sticking up
    for herself if people are being mean to her!


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c4fig3.JPG)'
