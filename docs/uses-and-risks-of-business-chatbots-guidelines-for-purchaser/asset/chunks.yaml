- raw: "Loads of complex facts to do with our farm shop and its new food lines were\
    \ indeed successfully presented by Sir Loin in the form of an approachable chat\
    \ on the farm website. He even conversed about my husband’s Green Credentials\
    \ as a No Till, that is, no plowing farmer who was reducing the carbon footprint\
    \ and fighting climate change using alternative farming methods like cover cropping.\
    \ Sir Loin was a hit—in Seattle, San Francisco, and New York. Not sadly in his\
    \ target market: Londoners and the Home Counties where we could deliver fresh\
    \ meat packages when ordered online via Sir Loin.\n\nOur medieval Knight with\
    \ a special trade got such a following in the United States on Twitter that we\
    \ actually met with a UKTI Export Adviser about how we might export:\n\n*   Fresh\
    \ mince burger patties (beef, lamb, and game/venison);\n\n*   Bags of homemade\
    \ pork crackling;\n\n*   Frozen meat pies; and\n\n*   Pasties and sausage rolls.\n\
    \nall made by our Court Farm Butchery & Country Larder—to thousands of geeky IT\
    \ nerds who had rapidly become fans of Sir Loin. The British export advisers out\
    \ of their depth and couldn’t grasp how the chatbot had gathered these demographics\
    \ and statistics.\n\nThey exclaimed how did we gather this data when “normally”\
    \ you had to do months of laborious research on the foreign market, the product\
    \ segment, hire marketers over there, travel to the destination country to meet\
    \ industry experts, join Chambers of Commerce to get introductions to partners\
    \ to help with importing goods into their markets, and ultimately spend a lot\
    \ of time, resources, and money over at least six months before trialing the export.\n\
    \nI tried to explain that Sir Loin was our special envoy who had managed to do\
    \ a lot of that groundwork in a matter of weeks via chatting online and using\
    \ the “pull factor” instead of “push.” In the end, there were just too many UK\
    \ export hurdles for shipping fresh produce abroad. We had to abandon our plan\
    \ to leverage sales from Sir Loin.\n\nSadly we had to switch off or deactivate\
    \ Sir Loin Your Virtual Butcher after just six months working on our farm’s website.\
    \ He wasn’t on our Facebook page because Messenger bots were not widely used or\
    \ known at the time. Merely as an online 2D chatbot, customized for our family\
    \ business as an SME, he was too controversial and “too clever.” Too many of the\
    \ villagers, that is, our farm shop’s regular customers over decades were “freaked\
    \ out” by this thing alive on their local farm’s website. Some of the feedback\
    \ I got was “Is it going to steal my credit card details or e-mail address?” and\
    \ others told me they refused to talk with Sir Loin because they simply weren’t\
    \ “computerized enough” and preferred to chat with our human butchers whom they\
    \ trusted.\n\nBecoming an Advocate of Entrepreneurs\n\nMore often than not, an\
    \ individual decision maker will not want to risk their own job “going in to bat”\
    \ for an emerging tech entrepreneur. That is the bad news or worst case scenario\
    \ for the entrepreneur. The “when in doubt do not purchase” mode kills off any\
    \ turbo charged, hugely impressive sales pitch or carefully nurtured and immaculately\
    \ conducted negotiation. There’s nothing you can do about human psychological\
    \ needs and instincts for safety and security: “I will do anything—or nothing\
    \ as the case maybe—to not endanger my job or position.”\n\nThe best case scenario\
    \ is the opposite case: where an entrepreneur of new SaaS or innovative AI wins\
    \ a corporate or government (internal) advocate who not only understands their\
    \ USP and “cause” to bring this world-changing tech to market, but also undertakes\
    \ to do that within their own company or organization.\n\nThese people are harder\
    \ to find and engage for your entrepreneurial cause because once they get a reputation\
    \ among startups in a city that they are “gate openers” as opposed to skeptical,\
    \ unnecessarily negative gatekeeping guardians, then it is increasingly difficult\
    \ for even the best ventures to get an audience with these perceptive, courageous\
    \ individuals with vision and foresight.\n\nThe more robust entrepreneurs will\
    \ court such decision makers vociferously seeing their opportunity to secure often\
    \ multimillion dollar or euro contracts for their hard fought, preciously guarded\
    \ portfolio of first-mover clients. Too many innovators falsely believe their\
    \ uniqueness or genuinely “different” or more competitive / cost-effective software\
    \ will “win” due to its merits alone.\n\nLike with job applications and who gets\
    \ the formal offer from HR, this is sadly not always the case. The best “interview\
    \ performer” very often wins, much like the best performing “pitchers” of new\
    \ ideas, whether they are genuinely new and unique, competitive, and productive\
    \ or not. Be aware of this scenario and its pitfalls from the outset.\n\nThis\
    \ is like enacting a play or drama over and over. The script is familiar—passionate,\
    \ terribly eager entrepreneur, cool distant purchaser, months of information exchange,\
    \ due diligence, and then the final yes or no, just for an (often unpaid) pilot\
    \ of this emerging technology.\n\nWhat Is Preventing Purchasers From Buying\n\n\
    Yet who wins this “do or die” opportunity may not always be the one deserving\
    \ to win based on simple merits, due to a variety of reasons that I will explore\
    \ in this book through case studies, commentaries, observations, and the guidelines\
    \ at the end. A brief indication is:\n\n*   Purchasers not having the experience\
    \ to distinguish hype from reality\n\n*   Not knowing where the correct or most\
    \ relevant knowledge base can be found\n\n*   The independence of analysis fails\
    \ due to “influencers” of the wrong kind\n\n*   Not being given the essentials\
    \ of how to upskill themselves in a hurry to make an assessment of the proposal\
    \ put forward by the tech entrepreneurs (the RFP or estimate)\n\n*   Not understanding\
    \ that business chatbots basically fall into just two categories: \n\n    1. \
    \ Bespoke, boutique bot customizations created outside your company.\n\n    2.\
    \  “Off-the-shelf” bot APIs that are then tweaked and customized inhouse by your\
    \ webmaster or a specially designated R&D team, often known as a greenfield project,\
    \ with test implementation/deployment or pilot, for example, the summer 2019 Mixed\
    \ Reality pilot of “Semmi” by Deutsche Bahn in the Berlin Central Station.\n\n\
    These issues remain a matter that must be repeatedly addressed openly and in a\
    \ fearless way on a regular basis given the speed of scientific and technological\
    \ advancements impacting on the whole world, not just your society, your city,\
    \ your company, office, and ultimately, your job.\n\nIn conclusion, let’s reflect\
    \ on my definitions and observations from my 2016 article for the San Francisco\
    \ tech news platform VentureBeat, cited earlier in this chapter. Why are chatbots\
    \ disruptive? My VB article is still being read today because over three years\
    \ on, things have not essentially changed! Why isn’t everyone aware of the disruptiveness\
    \ of chatbots? Why isn’t every vertical deploying one?\n\nOne reason is that bot\
    \ developers have become the arch enemy of the advertising industry, as I explored\
    \ in my post about how the transparency of the user engagement metrics expose\
    \ the lack of transparency in the legacy reporting schedules of the advertising\
    \ middle men, the large and mid-sized media agencies who have tried to stop the\
    \ advance of these independent customer experience measurements. Ultimately it\
    \ will put them out of business if they cannot justify their multimillion ad spends\
    \ with accurate, coherent tracking of sales leads to conversion rates, the demographics\
    \ of the opted in consumers, and the outcomes of the incredibly lucrative digital\
    \ out of home (DOOH) ad and marketing accounts they have held for decades for\
    \ most brands you know.\n\nWhy the Advertising Industry Is Threatened by Disruptive\
    \ Bots\n\nWhy don’t the advertisers like us? Because of these key reasons:\n\n\
    1.  We cut their profit margins.\n\n2.  We can deliver transparent metrics unlike\
    \ most other forms of advertising."
  fmt: "\n## Loads of complex facts to do with our farm shop\n\nLoads of complex facts\
    \ to do with our farm shop and its new food lines were indeed successfully presented\
    \ by Sir Loin in the form of an approachable chat on the farm website. He even\
    \ conversed about my husband’s Green Credentials as a No Till, that is, no plowing\
    \ farmer who was reducing the carbon footprint and fighting climate change using\
    \ alternative farming methods like cover cropping. Sir Loin was a hit—in Seattle,\
    \ San Francisco, and New York. Not sadly in his target market: Londoners and the\
    \ Home Counties where we could deliver fresh meat packages when ordered online\
    \ via Sir Loin.\n\nOur medieval Knight with a special trade got such a following\
    \ in the United States on Twitter that we actually met with a UKTI Export Adviser\
    \ about how we might export:\n\n*   Fresh mince burger patties (beef, lamb, and\
    \ game/venison);\n*   Bags of homemade pork crackling;\n*   Frozen meat pies;\
    \ and\n*   Pasties and sausage rolls.\n\nAll made by our Court Farm Butchery &\
    \ Country Larder—to thousands of geeky IT nerds who had rapidly become fans of\
    \ Sir Loin. The British export advisers were out of their depth and couldn’t grasp\
    \ how the chatbot had gathered these demographics and statistics.\n\nThey exclaimed\
    \ how did we gather this data when “normally” you had to do months of laborious\
    \ research on the foreign market, the product segment, hire marketers over there,\
    \ travel to the destination country to meet industry experts, join Chambers of\
    \ Commerce to get introductions to partners to help with importing goods into\
    \ their markets, and ultimately spend a lot of time, resources, and money over\
    \ at least six months before trialing the export.\n\nI tried to explain that Sir\
    \ Loin was our special envoy who had managed to do a lot of that groundwork in\
    \ a matter of weeks via chatting online and using the “pull factor” instead of\
    \ “push.” In the end, there were just too many UK export hurdles for shipping\
    \ fresh produce abroad. We had to abandon our plan to leverage sales from Sir\
    \ Loin.\n\nSadly we had to switch off or deactivate Sir Loin Your Virtual Butcher\
    \ after just six months working on our farm’s website. He wasn’t on our Facebook\
    \ page because Messenger bots were not widely used or known at the time. Merely\
    \ as an online 2D chatbot, customized for our family business as an SME, he was\
    \ too controversial and “too clever.” Too many of the villagers, that is, our\
    \ farm shop’s regular customers over decades were “freaked out” by this thing\
    \ alive on their local farm’s website. Some of the feedback I got was “Is it going\
    \ to steal my credit card details or e-mail address?” and others told me they\
    \ refused to talk with Sir Loin because they simply weren’t “computerized enough”\
    \ and preferred to chat with our human butchers whom they trusted.\n\n## Becoming\
    \ an Advocate of Entrepreneurs\n\nMore often than not, an individual decision\
    \ maker will not want to risk their own job “going in to bat” for an emerging\
    \ tech entrepreneur. That is the bad news or worst case scenario for the entrepreneur.\
    \ The “when in doubt do not purchase” mode kills off any turbo charged, hugely\
    \ impressive sales pitch or carefully nurtured and immaculately conducted negotiation.\
    \ There’s nothing you can do about human psychological needs and instincts for\
    \ safety and security: “I will do anything—or nothing as the case maybe—to not\
    \ endanger my job or position.”\n\nThe best case scenario is the opposite case:\
    \ where an entrepreneur of new SaaS or innovative AI wins a corporate or government\
    \ (internal) advocate who not only understands their USP and “cause” to bring\
    \ this world-changing tech to market, but also undertakes to do that within their\
    \ own company or organization.\n\nThese people are harder to find and engage for\
    \ your entrepreneurial cause because once they get a reputation among startups\
    \ in a city that they are “gate openers” as opposed to skeptical, unnecessarily\
    \ negative gatekeeping guardians, then it is increasingly difficult for even the\
    \ best ventures to get an audience with these perceptive, courageous individuals\
    \ with vision and foresight.\n\nThe more robust entrepreneurs will court such\
    \ decision makers vociferously seeing their opportunity to secure often multimillion\
    \ dollar or euro contracts for their hard fought, preciously guarded portfolio\
    \ of first-mover clients. Too many innovators falsely believe their uniqueness\
    \ or genuinely “different” or more competitive / cost-effective software will\
    \ “win” due to its merits alone.\n\nLike with job applications and who gets the\
    \ formal offer from HR, this is sadly not always the case. The best “interview\
    \ performer” very often wins, much like the best performing “pitchers” of new\
    \ ideas, whether they are genuinely new and unique, competitive, and productive\
    \ or not. Be aware of this scenario and its pitfalls from the outset.\n\nThis\
    \ is like enacting a play or drama over and over. The script is familiar—passionate,\
    \ terribly eager entrepreneur, cool distant purchaser, months of information exchange,\
    \ due diligence, and then the final yes or no, just for an (often unpaid) pilot\
    \ of this emerging technology.\n\n## What Is Preventing Purchasers From Buying\n\
    \nYet who wins this “do or die” opportunity may not always be the one deserving\
    \ to win based on simple merits, due to a variety of reasons that I will explore\
    \ in this book through case studies, commentaries, observations, and the guidelines\
    \ at the end. A brief indication is:\n\n*   Purchasers not having the experience\
    \ to distinguish hype from reality\n*   Not knowing where the correct or most\
    \ relevant knowledge base can be found\n*   The independence of analysis fails\
    \ due to “influencers” of the wrong kind\n*   Not being given the essentials of\
    \ how to upskill themselves in a hurry to make an assessment of the proposal put\
    \ forward by the tech entrepreneurs (the RFP or estimate)\n*   Not understanding\
    \ that business chatbots basically fall into just two categories:\n    1.  Bespoke,\
    \ boutique bot customizations created outside your company.\n    2.  “Off-the-shelf”\
    \ bot APIs that are then tweaked and customized inhouse by your webmaster or a\
    \ specially designated R&D team, often known as a greenfield project, with test\
    \ implementation/deployment or pilot, for example, the summer 2019 Mixed Reality\
    \ pilot of “Semmi” by Deutsche Bahn in the Berlin Central Station.\n\nThese issues\
    \ remain a matter that must be repeatedly addressed openly and in a fearless way\
    \ on a regular basis given the speed of scientific and technological advancements\
    \ impacting on the whole world, not just your society, your city, your company,\
    \ office, and ultimately, your job.\n\n## In conclusion\n\nLet’s reflect on my\
    \ definitions and observations from my 2016 article for the San Francisco tech\
    \ news platform VentureBeat, cited earlier in this chapter. Why are chatbots disruptive?\
    \ My VB article is still being read today because over three years on, things\
    \ have not essentially changed! Why isn’t everyone aware of the disruptiveness\
    \ of chatbots? Why isn’t every vertical deploying one?\n\nOne reason is that bot\
    \ developers have become the arch enemy of the advertising industry, as I explored\
    \ in my post about how the transparency of the user engagement metrics expose\
    \ the lack of transparency in the legacy reporting schedules of the advertising\
    \ middle men, the large and mid-sized media agencies who have tried to stop the\
    \ advance of these independent customer experience measurements. Ultimately it\
    \ will put them out of business if they cannot justify their multimillion ad spends\
    \ with accurate, coherent tracking of sales leads to conversion rates, the demographics\
    \ of the opted in consumers, and the outcomes of the incredibly lucrative digital\
    \ out of home (DOOH) ad and marketing accounts they have held for decades for\
    \ most brands you know.\n\n## Why the Advertising Industry Is Threatened by Disruptive\
    \ Bots\n\nWhy don’t the advertisers like us? Because of these key reasons:\n\n\
    1.  We cut their profit margins.\n2.  We can deliver transparent metrics unlike\
    \ most other forms of advertising.\n"
  trans: "\n\n## 关于我们农场商店的大量复杂事实\n\n大量关于我们农场商店及其新食品系列的复杂事实，确实由“西冷爵士”以一种平易近人的聊天形式，在农场网站上成功呈现出来。他甚至还聊到了我丈夫作为“免耕农”（即不翻耕土地的农民）的“绿色资质”，这位农民正通过覆盖作物等替代耕作方式减少碳足迹、应对气候变化。西冷爵士大受欢迎——在西雅图、旧金山和纽约。遗憾的是，在他的目标市场——伦敦人和伦敦周边郡县（我们可在网上通过西冷爵士下单后配送鲜肉包裹）却并非如此。\n\
    \n我们这位拥有特殊行当的中世纪骑士，在美国推特上获得了如此众多的追随者，以至于我们真的与英国贸易投资总署（UKTI）的一位出口顾问会面，探讨我们该如何出口：\n\
    \n*   鲜肉汉堡饼（牛肉、羊肉和野味/鹿肉）；\n*   自制猪皮脆片袋装；\n*   冷冻肉馅饼；以及\n*   馅饼和香肠卷。\n\n所有产品均由我们的宫廷农场肉铺与乡村食品储藏室制作——卖给了数千名迅速成为西冷爵士粉丝的极客\
    \ IT 宅男。英国出口顾问们对此束手无策，无法理解聊天机器人是如何收集到这些人口统计数据和统计数据的。\n\n他们惊呼：我们是如何收集这些数据的？因为“通常”情况下，你必须在国外市场、产品细分领域进行数月艰苦的研究，在当地雇佣营销人员，前往目的地国家会见行业专家，加入商会以获取合作伙伴介绍，协助商品进口进入当地市场，最终在至少六个月的试运行前，耗费大量时间、资源和金钱。\n\
    \n我试图解释，西冷爵士是我们的特别使者，他通过在线聊天和利用“拉力”而非“推力”，在几周内就完成了大量此类基础工作。最终，英国出口鲜活农产品的障碍实在太多。我们不得不放弃利用西冷爵士撬动销售的计划。\n\
    \n遗憾的是，在我们农场网站上工作了仅仅六个月后，我们不得不关闭或停用“西冷爵士——您的虚拟屠夫”。他不在我们的 Facebook 页面上，因为当时 Messenger\
    \ 机器人尚未被广泛使用或知晓。仅作为一个定制化的在线 2D 聊天机器人，为我们这个中小企业（SME）家庭业务服务，他太具争议性，也“太聪明”了。太多村民，即几十年来我们农场商店的老主顾，被他们当地农场网站上这个“活物”“吓坏了”。我收到的一些反馈是：“它会偷走我的信用卡详情或电子邮件地址吗？”还有人告诉我，他们拒绝与西冷爵士交谈，因为他们根本不“懂电脑”，更愿意与他们信任的人类屠夫聊天。\n\
    \n## 成为企业家的倡导者\n\n通常情况下，个人决策者不愿冒着丢饭碗的风险为新兴科技企业家“挺身而出”。这对企业家而言是坏消息，也是最坏的情况。“有疑虑就不采购”的模式，会扼杀任何充满激情、极具感染力的销售说辞，或精心培育、完美执行的谈判。你无法改变人类对安全感的心理需求和本能：“我会做任何事——或者什么都不做——只为不危及我的工作或地位。”\n\
    \n最理想的情况恰恰相反：新兴 SaaS 或创新 AI 的企业家赢得了一位企业或政府（内部）倡导者，这位倡导者不仅理解他们的独特卖点（USP）和将这项改变世界的技术推向市场的“事业”，还承诺在自己的公司或组织内部推动此事。\n\
    \n这些人更难寻找和争取为你的创业事业效力，因为一旦他们在城市的初创企业圈子里获得了“开门人”而非怀疑论者、不必要的消极“看门人”的声誉，即使是最优秀的创业项目，也越来越难获得这些有洞察力、有勇气、有远见和预见力的个人的接见。\n\
    \n更强健的企业家会热烈追逐此类决策者，看中了他们为自己艰苦奋斗、珍视守护的首批种子客户组合，争取往往高达数百万英镑或欧元的合同机会。太多创新者错误地认为，他们软件的独特性或真正“不同”、更具竞争力/性价比的特性，会仅凭优势就“获胜”。\n\
    \n就像求职申请和谁能拿到 HR 的正式录用通知一样，遗憾的是，情况并不总是如此。最佳“面试表现者”往往获胜，就像最佳“推销者”推销新想法往往获胜一样，无论这些想法是否真正新颖独特、具有竞争力和生产力。从一开始就要意识到这种情形及其陷阱。\n\
    \n这就像一遍遍上演一出戏剧。剧本耳熟能详——激情澎湃、渴望万分的企业家，冷淡疏离的采购方，数月的信息交换、尽职调查，最后才是同意或拒绝，往往只是针对这项新兴技术的一个（通常是无偿的）试点项目。\n\
    \n## 是什么阻碍了采购方购买\n\n然而，谁能赢得这“生死攸关”的机会，未必总是那个凭借简单优势理应获胜的人，原因多种多样，我将在本书中通过案例研究、评论、观察和结尾的指南进行探讨。简要迹象如下：\n\
    \n*   采购方缺乏区分炒作与现实的经验\n*   不知道在哪里能找到正确或最相关的知识库\n*   分析的独立性因“错误类型的影响者”而失效\n*  \
    \ 未获得如何在短时间内提升技能以评估科技企业家提出的建议书（RFP 或报价）的要点\n*   不了解商业聊天机器人基本上仅分为两类：\n    1.  在公司外部创建的定制化、精品化机器人。\n\
    \    2.  “现成的”机器人 API，随后由贵公司网站管理员或专门指定的研发团队在内部进行调整和定制，通常称为“绿地项目”，包含测试实施/部署或试点，例如\
    \ 2019 年夏季柏林中央车站德国铁路公司“Semmi”混合现实试点。\n\n考虑到科学技术进步影响全世界的速度，而不仅仅是你的社会、城市、公司、办公室，最终是你的工作，这些问题必须以公开、无畏的方式定期反复探讨。\n\
    \n## 结语\n\n让我们反思一下我在 2016 年为旧金山科技新闻平台 VentureBeat 撰写的文章（本章前文引用）中的定义和观察。为什么聊天机器人具有颠覆性？三年多过去了，我的\
    \ VB 文章至今仍在被阅读，因为事情本质上没有改变！为什么不是人人都意识到聊天机器人的颠覆性？为什么不是每个垂直领域都在部署一个？\n\n原因之一是，机器人开发者已成为广告行业的宿敌，正如我在帖子中探讨的那样，用户参与度指标的透明度暴露了广告中间商——那些试图阻止独立客户体验衡量标准发展的大型和中型媒体代理商——传统报告时间表缺乏透明度。如果他们无法用准确、连贯的销售线索转化率追踪、选择加入消费者的人口统计数据，以及他们几十年来为大多数知名品牌掌控的极具利润的数字户外（DOOH）广告和营销账户的成果，来证明其数百万广告支出的合理性，最终将导致他们倒闭。\n\
    \n## 为什么广告行业受到颠覆性机器人的威胁\n\n为什么广告商不喜欢我们？因为有以下关键原因：\n\n1.  我们压缩了他们的利润率。\n2.  我们能提供透明的指标，这与大多数其他广告形式不同。\n\
    \n"
