    你需要重新审视采购创新的方式，并将其置于回报的框架中：我承担了更多风险，但始终可以用“在本地经济中创造了就业岗位”这一事实来证明其合理性。这使我的公司或政府机构与区域基础设施提供商（例如，地方政府服务、商会/商业团体）建立了良好关系，因为我们从本地卖家而非外国公司采购——后者甚至可能不在你的国家缴纳企业税，因此无法通过涓滴效应为上述基础设施和技术中心提供资金！


    最重要的是，你可以将采购决策置于国家生产力目标的框架内。具体而言，这如何体现到你日常的办公生活和工作惯例中？让我们聚焦于电子邮件和聊天机器人的例子。正如我们在本书中所见，许多商业智能公司将聊天机器人或
    IVA（智能虚拟助手）视为通信的未来，这不可避免地使电子邮件变得多余——如果在许多方面它尚未如此的话。


    ## 根据伦敦游说平台和市长的观点，聊天机器人是未来（2019 年）


    以下摘自《CognitionX Taster White Paper 2019》，非常清楚地表明：“大多数聊天机器人部署计划在未来一年左右，大多数聊天机器人计划预期将进行大量投资并产生重大影响，自然语言的使用预计将大幅增长。”[1](#06_Chapter_6.xhtml#footnote-075)
    我们需要认真对待他们的研究，因为尽管 CogX 是一个相对较新的 AI 机器人平台，旨在支持英国的利基产业，但它获得了政府最高层的支持，这在英国经济背景下至关重要。


    它得到了伦敦市长 Sadiq Khan 的支持，后者于 2019 年夏季在首都举行的 CogX 年度会议上发表了讲话。它还得到了现任英国政府的明确支持，通过
    CogX 的高调联合创始人 Tabitha Goldstaub（来自温布尔登的成功连续创业者）体现。Goldstaub 在科技界拥有强大的女权主义声誉，公开倡导让更多女性进入
    STEM 领域，特别是进入人工智能公司，以减少算法偏见在开发和商业推广中的影响。


    正如前文 CogX 摘要所述，聊天机器人将接管世界！它描述“聊天机器人的未来无处不在，就像人类的语言一样。”这很好，因为正如我们从以下美国用例中看到的，即使是绝对必要的商业或教育人类对话，对于下一代来说也远非有保障，这部分归咎于技术，也部分由技术解决。


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c6fig1.JPG)


    Figure 6.1 © Realfiction, Copenhagen, 2019. 这家丹麦制造商制造的相框能创造 3D 全息体验，如恐龙骨架突然复活，是
    CX 技术的先驱。即使是自然历史博物馆的参观者，客户体验（CX）也达到了新的期望和消费者满意度标杆。像这样的混合现实体验为用户交互或 UX 提供了基准。


    ## 波士顿的大学园区“机器人化”面向新一代人类


    让我们看看这家总部位于波士顿的挑战者科技公司 AdmitHub 的优秀数据。完全公开：我在 2016 年底的 Re-Work Deep Learning Summit
    首届聊天机器人专场会议上见到了联合创始人 Andrew Maggioli。我喜欢 Andrew 在主题演讲中分享的案例研究，并钦佩地关注着 AdmitHub
    以来的指数级增长，因为尽管本书讨论了关于 2D 聊天机器人的种种误解，他们依然开拓前行。他们在高等教育垂直领域说服了足够多的用户认可其特定用例。


    这里关于生产力的关键点在于：AdmitHub 的研究发现，Z 世代仅打开高等教育管理者、招生中心、讲师及相关大学服务提供商发送给他们的 **20% 的电子邮件**。[2](#06_Chapter_6.xhtml#footnote-074)
    这代表了学生-管理员沟通中高达 **80% 的生产力损失**！我曾听到英国、澳大利亚、法国和德国的高等教育运营商重复这一痛点，他们来到我的公司 AI Bots
    as a Service 寻求提案请求，所以这绝对是一个全球趋势。


    这意味着对于宝贵的大学预算——在大多数发达经济体中主要由纳税人和政府资助——大量资金浪费在了学生忽略的沟通上。他们该怎么办？给叛逆的 Z 世代发送鸽子和烟信号？在校园内中断他们的
    Wi-Fi 以广播官方新闻和通讯，就像 1950 年代电视和广播向全国发布警报的黄金时代那样？


    答案在于聊天机器人，因为 2D 机器人处于 Z 世代确实会参与的媒介中：短信，或更准确地说是即时通讯（IM）。AdmitHub 发布了一份白皮书断言：与忽略
    80% 发给他们的电子邮件相反，**98% 的大学生会打开并阅读短信或 IM 通知，且几乎是即时完成**。在富有成效的沟通方面，以及在校园内投入的大量人力、时间和组织资源方面，**40%
    的 Z 世代学生也会回复管理员的消息**！


    AdmitHub 巧妙地将这些新兴数据整合进了他们的销售话术，我注意到其波士顿员工大多数是销售和市场客户经理。他们现在称为聊天机器人解决方案的 2D AI
    机器人可以帮助实现那 40% 的转化率，并为学生-管理员沟通恢复一定程度的生产力。


    面对现实吧——不到五分之一的目标受众甚至阅读你关于他们即将到来的考试日期、换教室、考试成绩和录取信息等重要事项的通告，这只能被视为对时间的非生产性浪费。聊天机器人来拯救局面，至少它们能送达信息，并获得双倍机会得到回复、反应（如果不是行动的话）来自沟通目标对象。


    ## 创业、内部创业与销售死胡同


    正如我们在前面的检查清单部分所见，对于与组织外部合作的创业者，与招募内部创业者（即从公司内部雇佣的新员工来运行试点）相比，需要不同的方法。如果你失误并终止试点，可能意味着外部创业项目的终结。你可能刚刚在公共领域扼杀了一家初创公司。对你而言是坏声誉，消息在你是合作伙伴/采购方的技术圈子里会传开，大家会避开你。如今“点名羞辱”可能非常不加掩饰地发生，但确实会发生。


    关闭内部研发单位则是另一回事。财务风险通常通过强制在预定义预算内运营而降至最低，资金在内部创业团队甚至还未在分配的办公空间启动前就已“给予”他们。一种被培育的舒适感，消除了自筹资金和“必须想办法筹钱支付成本”的巨大压力，但这也移除了正常初创场景中那种生存和呼吸的紧迫感。


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c6fig2.JPG)


    Figure 6.2 © Realfiction Copenhagen, 2019. 这只恐龙是一个动画等身全息图的例子。这种混合现实是 AI BaaS 使用的多媒体格式，用于“植入各种机器人大脑”，有效地将巨大的硬件设备变成一个外壳或物理框架，供一个活着的、有机发展的认知接口使用。

