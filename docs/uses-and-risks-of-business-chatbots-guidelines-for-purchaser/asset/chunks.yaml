- raw: 'Remember at the beginning of this textbook I discussed what is happening in
    the public sector in Britain. Specifically at the UK Department for Workplace
    and Pensions and their multibillion pound budget to roll out chatbots and AI.
    I know from firsthand experience that they have been talking with external bot
    developers about plugging in chatbots from the private sector, adapted to their
    public service needs. So I was curious to read shortly before Brexit Eve as I
    name the end of October 2019, that the DWP had decided to establish a high-powered,
    extensive intrapreneurship department and centers around the country.


    The DWP is also rapidly expanding its own private technology company, Benefits
    and Pensions Digital Technology Services Ltd, which recruited more than 400 staff
    in the year to April, while DWP Digital recruited 520.


    A spokesperson for the DWP insisted it was using artificial intelligence to help
    people find work, to reduce the burden on claimants to prove their circumstances,
    and to help vulnerable people access welfare more easily without having to provide
    evidence of their digital identity.[1](#05_Chapter_5.xhtml#footnote-065)


    This DWP example is a clear case of public sector procurement, not of external
    entrepreneurs to commission botification services, but recruiting intrapreneurs
    or new full-time staff to conceptualize, develop, and realize greenfield projects
    and pilots from within the multitude of governmental organizations that make up
    the Department or Ministry.


    Alternatively you can choose a tech venture from outside your company who you
    want to bring in and run a greenfield project. Alternatively, some companies are
    “sourcing entrepreneurs and coders” themselves and giving them short-term contracts
    to develop an application from within the company.


    I think there is an erroneous belief that creating your own startup from inside
    your organization somehow gives you more control and security. However, there
    are many pitfalls with this type of intrapreneurship, and I cover these points
    in the following. For both entrepreneurs outside your company providing the pilot,
    and the intrapreneurs doing R&D for a project within your organization the following
    points should be considered:


    *   Set realistic milestones.


    *   Be flexible and fair on deadlines.


    *   Keep communication lines open at all time.


    *   Be reliable in giving feedback on time, tell them if you don’t understand
    something—it can be fatal to a project to not admit your failure to comprehend
    any detail or overall description of the collaboration and it creates an unnecessary
    working atmosphere of friction and potentially resentment.


    *   Get your team and managers to give feedback after each milestone where possible.


    Dealing With External Entrepreneurs for Projects Created and Run Externally


    *   Keep the media away until the AB testing has been completed to the venture’s
    satisfaction and yours.


    *   Discuss with the entrepreneurs how you want the media coverage and future
    external comms (communications, media liaison, marketing, PR) to be handled, how
    they are to be portrayed, and what is their tech story.


    *   Work out a PR and marketing strategy with your resident marketers and comms
    directors so they don’t feel cut out of the loop. They will probably need to give
    you and the project sign off, not just your bosses.


    *   Communicate clearly to all stakeholders at every point what the expectations
    are and where there are delays explain why, don’t cover them up, that is, don’t
    not communicate the issues in a timely, fair way.


    *   Most people understand pilots will have unexpected problems. Given the tech
    venture is operating externally to your company or organization, the entrepreneurs
    will inevitably be working on other prototypes and pitching to other first-mover
    clients, if not already working on several pilots in parallel. That is inevitable
    if you are not paying them for this work or paying little.


    *   If you don’t like the fact they are not focused on your company’s pilot, then
    you may have to sign an exclusivity contract which negotiates their time and how
    long it should be devoted to your pilot alone. Entrepreneurs will want to be paid
    (extra possibly) for this.


    *   However, don’t expect the external tech venture to give you exclusivity over
    their technology! That is an anti-competitive ask that should be rewarded or compensated
    for monetarily, without question or much argument.


    *   If you want them to not offer the innovative solution to your competitors,
    you will have to put a higher payment clause in the contract, that is, so the
    entrepreneurs are not put at a financial disadvantage giving up other clients
    and contracts to focus only on you.


    *   Intellectual property lawyers will probably get involved then to calculate
    the worth of the tech now and in \[the period of time for the exclusivity\] and
    arrive at a pricing range that is fair to the entrepreneurs.


    *   It is not a monopoly situation if this payment system for exclusivity is agreed
    upon as a fair exchange to give the paying client a first-mover advantage over
    their competitors who have been too slow to adopt the new tech of the entrepreneurs.


    For Intrapreneurs


    *   Encourage positivity and optimism for all involved.


    *   If people at your company are unduly negative and skeptical, call them out
    on this attitude. Get them to do the quiz at the start of [Chapter 4](#04_Chapter_4.xhtml),
    ask them if they are an advocate of new technologies or an opponent.


    *   Nipping it in the bud can prevent a mobbing type of effect at the launch date
    where if something goes wrong, the company doesn’t hit the panic button and kill
    off the innovative project without proper consideration and reasoned planning,
    for example, agreeing on a postponed second release with new milestones and budgets.


    *   Where hired coders are working nine-to-five on your internal pilot and R&D
    in an intrapreneurship situation (like the DWP’s new business and staff), those
    time constraints in themselves turn it into an office job rather than a startup.
    Don’t be surprised if progress becomes slower than with tech entrepreneurs driven
    and motivated by ownership of their intellectual property, the reward of profits
    and dividends and building a business (scaling up) on their own outside the company.


    *   For this reason, it might be useful to have as an early milestone to spin
    out the pilot as a standalone venture, that is, register it independently of your
    company so that the coders and business development managers have a sense of ownership
    and autonomous control. Many universities operate in this way have full-time salaried
    commercialization or knowledge transfer manager to shepherd this process. Even
    to IPO stage for a university spin out company that gets seed funding from its
    university. Note that means the entrepreneurs/academics often lose the full ownership
    of their intellectual property, which is then shared with the university as its
    business angel providing the incubator environment for them.


    *   This might sound scary for large corporations and some SMEs, however this
    has become common practice for R&D projects with proven traction and promise of
    relatively fast commercialization to become their own companies as spin-outs (UK)
    and spinoff (U.S.) from the parent company.


    *   It is a term most frequently used for university and business school lab experiments
    and long-term research that gathers momentum.


    *   The academic structure usually provides a unit of specialists to supervise
    spinning out these ventures mostly created by their own students, graduates, and
    academic staff.


    *   Like the university version, as corporate investors in your own spin out ventures,
    you ought to look carefully at the intellectual property arrangements—who owns
    the IP if the innovation began “inhouse”? If the coder team says it was their
    invention, who else can claim that it wasn’t?'
