- raw: 'This e-mail between our Head of Asia Pacific Sales in Melbourne, Jon Field,
    and myself sitting on a farm in Kent, chasing deals globally online, sums it all
    up really.[2](#05_Chapter_5.xhtml#footnote-064) Be fair to entrepreneurs, they
    are usually working nearly 20 hours a day on average.


    When you don’t become their internal advocate after you are convinced they have
    an innovation your company should adopt, you are wearing them out with needless
    pitches and meetings. Startup owners make these sessions comfortable and easy
    for you, that is their job. Behind the scenes, it takes enormous energy and resources
    to make just these corporate pitches happen, often on a shoestring or nonexistent
    budget.


    Here are some more tips on how you can make your entrepreneurial journey more
    pleasurable and better prepared for all those involved, even down to your company’s
    inhouse maintenance staff who may have the mundane task of installing the electrical
    and Internet connections for the device or mixed reality experience:


    *   Watch videos on YouTube and TED conference talks relevant to what you want
    to implement.


    *   If time allows, go to as many conferences and tech trade shows as possible,
    ask to be introduced to leading speakers who have been paid to be there, not the
    other way around. Sadly the business model of most trade shows and tech conferences
    is that the companies with the biggest marketing budgets pay the organizers to
    put them on stage. And then everyone pretends they are not listening to veiled
    advertisement.


    *   Be clear on what you want to achieve and how you are going to publicize it
    in relation to your brand, your department, your company, or organization, so
    that the entrepreneurs understand their role in the media plan and what confidentiality
    levels are required.


    *   If journalists and tech editors get wind of your pilot somehow and start contacting
    you, for example, is the government going to replace civil servants with robots?
    Is corporation X going to use artificial intelligence instead of business analysts,
    chatbots instead of call centers, digitization and remote working instead of offices
    and a headquarters, then you may need to prepare a response. No comment may be
    taken as assent in some media.


    *   Work this out with your organization media team and the wishes of the entrepreneurs
    if they are external, and intrapreneurs if they have been recruited to work for
    you inhouse on an R&D greenfield project.


    Guidelines for AI Apps: Understanding What You Want and Measuring It


    Dos and Don’ts


    *   Cybersecurity—make sure all the parties involved have covered the anti-hacking
    measures adequately to prevent hackers or malware entering or spreading from your
    pilot.


    *   Data protection—getting an MOU (Memorandum of Understanding) signed that has
    clauses stating who is liable for data breaches under GDPR is essentially all
    you need to do here. But best to check this!


    *   Respecting the creative work and IP of the tech venture at all times, as much
    as possible either by actions, word or written praise of milestones achieved together.


    *   Acknowledge the commercial value of this emerging tech with payment if possible.
    If this is an unpaid pilot on the basis of an exchange of marketing campaigns
    in return for the trial of technology, then make sure you keep your end of the
    bargain and promote the startup’s innovation clearly and reliably to their satisfaction.


    *   Be a reliable partner—communicate what is going on and don’t leave the team
    hanging in radio silence. They are working in underfunded, pressurized environments!


    *   Give fair testimonials—you can put an early stage venture out of business
    within a week if you give unfair criticism to a prospective new client.


    *   Scaling up for a startup is a slow and painful process so you are in a privileged
    position of power over their future and past investment. Be mindful and don’t
    abuse your power to put a rapid end to their innovation.


    *   Don’t lose patience, remember the extreme conditions these entrepreneurs are
    working under—no pay, or inadequately paid for years to do R&D, and bootstrapping
    their venture under pressure of cash flow issues and trying to fund new client
    acquisitions.


    *   Don’t reveal secrets to competitors, even if these competitors are “famous”
    established brands who approach you directly or indirectly to gather business
    intelligence or even to try to steal the contract away from the startup you are
    nurturing. Stay committed and keep your integrity intact by not divulging any
    details to the Goliaths of industry.


    *   Encourage them in entrepreneurship and acknowledge the many sacrifices they
    have made to get their tech to market, both in their personal life and their professional
    life, for example, they have forgone a highly paid, full-time salary like yours!


    General Guidelines When Botifying Websites, Databases, and Public Spaces


    When commissioning a 2D chatbot for online deployment (usually on an Instant Messaging
    platform), or if you want to be a pioneer in the 3D Mixed Reality avatar space,
    AI bot holograms or Virtual Reality/AR experiences, then you should make sure
    you consider all of these points:


    *   Privacy


    *   Data protection


    *   Contextual practices and cultural expectations


    *   Demographic expectations


    *   User habits


    *   Defined consumers


    *   Random exchanges


    *   Unpredictable interactions


    *   Website are less used than apps


    *   Most people, anywhere in the world, only use a maximum of five apps on their
    phone on a regular basis


    *   Therefore Instant Messaging is and will be the preferred medium of communication
    between people and brands


    *   Social media and installations, for example, immersive reality.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c5fig5.JPG)


    Figure 5.5 © Realfiction, Copenhagen, 2019. To date, Augmented Reality and Virtual
    Reality have not botified the experience. The interaction has been created through
    gesture as you see here. The man is waving at the AR image to select a color button.
    Once the gesture is understood by the AR software, it will change the color of
    the car for the shopper. Voice commands is the next interactive step, as is the
    “implanting” of a bot brain which my company AI BaaS is currently doing in our
    HQ in Munich and Mixed Reality lab in Devon, UK


    * * *


    [CHAPTER 6](#contents.xhtml#c6)


    [Conclusion](#contents.xhtml#c6)


    Support the Local Economy, Regional Infrastructure, and National Productivity
    Goals


    There is a strong case to be made that as Procurement and Purchasing specialists
    and decision makers, you should put your immediate goals for your company or government
    body in the wider context of innovation development. How did this innovation come
    to be? Was it from your immediate regional infrastructure in terms of a tech hub,
    incubator, or accelerator that has been largely funded by taxpayers’ money? Is
    the new venture a privately owned startup with transparency over who owns the
    intellectual property? Or is it a spin-out from a large corporation or a university,
    which means the entrepreneurs do not necessarily own the IP completely?


    These factors matter because it is easy enough to Spend Other People’s Money—in
    this case the budget you have been allocated by your department, unit or boss—on
    a surefire brand that everybody knows. Without mentioning names here, it is a
    low risk option to just sign for the package that comes from a big name Software
    as a Service provider that is omnipresent. What could go wrong?'
