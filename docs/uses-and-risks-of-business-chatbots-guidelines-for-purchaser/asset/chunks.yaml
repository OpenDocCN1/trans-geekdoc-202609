  fmt: "\n# For 3D Avatars, Voice Is Optimal\n\nFor 3D avatars, voice is optimal because\
    \ it fits with the overall Mixed Reality industrial design. They recognize speech\
    \ and also dialects with the better ASR plug-ins. This niche is developing rapidly\
    \ as a core competence.\n\nThe voice tech people will enable more bot developers\
    \ to plug in to their specialist audio software which is an advanced form of Natural\
    \ Language Processing but not necessarily standalone Artificial Intelligence.\
    \ It needs to be combined with a good “bot brain” that has demonstrated cognitive\
    \ thinking in order to be classified as Conversational AI or a Cognitive Interface.\n\
    \n## Voice Activated\n\nSee [Wake Words](#wake-words)\n\n## Wake Words\n\nThe\
    \ most famous voice-based bot using wake words is of course Amazon Alexa. The\
    \ wake words are “Alexa” in this instance, which is said to awaken the machine\
    \ to respond. It has been shown that Amazon’s devices including Echo and Dot are\
    \ “always listening to you” potentially, after a number of exposes by the media,\
    \ such as Der Spiegel.\n\nThe reportage proved that the devices had recorded their\
    \ owners in the most intimate and private moments without permission, that is,\
    \ they had not been given the wake words to signal them to listen. The devices\
    \ did not respond either to alert the users that were active. Instead Amazon HQ\
    \ illegally recorded people’s private conversations and sent them to back offices\
    \ around the world to be “transcribed and analysed so that our software and speech\
    \ recognition could be improved.” See the Voice definition for what speech recognition\
    \ is.\n\nWake words can be used by 2D chatbots as well as 3D bots. For instance,\
    \ Samsung wants you to say “Bixby” to awaken its built-in chatbot, as of course\
    \ the most famous smartphone Virtual Assistant of all, Siri on Apple devices.\
    \ Microsoft has put 2D bot Cortana onto its PCs and desktops in the hope that\
    \ users will speak to her and use the wake words to activate this Virtual Assistant\
    \ built into every Microsoft device. Many bot developers are following suit, especially\
    \ voice-based IVAs. My company AI BaaS also uses this feature.\n\n![Image](/library/view/uses-and-risks/9781949443448/Images/Glo2.JPG)\n\
    \nGlossary2 © Realfiction, Copenhagen, 2019. The next generation watch fascinated\
    \ as a hologram rocket takes off in full sound and color in Mixed Reality. This\
    \ means the rocket is projected onto the real ocean that you see behind the MR\
    \ device or “Deep Frame,” as the manufacturer Realfiction calls their product,\
    \ creating the experience in Real Time, even though the holographic performance\
    \ was created in a studio or lab to be deployed using real life settings and audio.\n\
    \n---\n\n# About the Author\n\nThe technologist Tania Peitzker is the CEO and\
    \ co-owner of AI Bots as a Service. This Mixed Reality German venture builds “bot\
    \ brains” or AI bot holograms for multilingual 2D and 3D bespoke avatars. The\
    \ unique humanoid or unisex characters feature voice or speech recognition (ASR)\
    \ and speak over 130 languages on any device.\n\nAI BaaS has invested over a decade\
    \ of R&D in its own proprietary algorithm for customizable botification; it’s\
    \ called VAIP [Virtual Artificially Intelligent Patois]. To get the very latest\
    \ summary of her life and work, you can listen to a 2019 radio interview in her\
    \ original hometown of Cairns with the ABC (Australian Broadcasting Corporation).\
    \ It’s 10 minutes and online as a podcast on her portfolio site www.taniapeitzker.expert.\n\
    \n![Image](/library/view/uses-and-risks/9781949443448/Images/About1.JPG)\n\n©\
    \ Tania Peitzker, Selfie on the shores of Saint Jean Cap Ferrat, 2018\n\n![Image](/library/view/uses-and-risks/9781949443448/Images/About2.JPG)\n\
    \n© Company logo of AI BaaS UG in Munich, 2019\n\nAn Australian-German with a\
    \ doctorate in Anglistik from the University of Potsdam, she’s now an Adjunct\
    \ Professor for AI Management and digitization at various business schools in\
    \ Europe. Due to Britain’s years of “Brexit upheavals,” she commutes to her German\
    \ technology venture’s headquarters in Munich—in Bavaria where her father hails\
    \ from—from Britain and spends much of her time on the European Continent.\n\n\
