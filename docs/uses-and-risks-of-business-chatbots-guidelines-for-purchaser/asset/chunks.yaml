- raw: '    Major brands from GE to BMW are integrating chat functionality into Internet-connected
    devices, with bot technology powering those consumer interactions.


    So given these seven brilliant reasons to buy a bot, what on earth is holding
    the purchasers back?


    Appetite for Risk: Horses and Falls Versus Sharks and Yachting


    What I have addressed previously is the appetite for risk of the entrepreneur
    somewhat obviously, and less obviously the risk-taking of investors in their invention
    or innovation (a lot of R&D needs premoney valuations to get make or break seed
    capital). Often overlooked are the risk averse tendencies of the corporate and
    government purchasers, perhaps because nobody wants to have the finger pointed
    at them, that is, blamed for a massive failure of the tech or perceived waste
    of financial resources, human resources, and time. Those with decision-making
    power are less likely to own up to their reluctance to take a risk seemingly on
    the behalf of an unknown tech venture.


    Their risk assessment ought to focus on the “what’s in it for me?” or my company/department.
    But these “value-add” points for their own workplace are sometimes forgotten postpitch
    and the purchasers return to their desk thinking, “What have I got to lose” rather
    than listing all the gains as a persuasive argument to put their bosses, peers,
    and colleagues.


    Is there are risk to life and limb at the end of the day? It is highly improbable
    that you will lose your job if the greenfield project goes belly up. The much
    lauded tolerance of failure in the corporate world—though admittedly less so in
    government—is meant to kick in and the person who launched the pilot ought to
    be congratulated for their courage and fortitude.


    An analogy is falling off a horse. As a teenager in Australia, when I was thrown
    off a galloping beast I decided to swap equestrian school for yacht racing. My
    calculation was that I could survive a shark attack if I fell overboard in the
    sea more easily than spinal injuries caused by horseback mishaps. My appetite
    for (extreme) sports risks was balanced with a calculated assessment of the immediate
    threat or probability of injury if not a nasty death.


    The point being corporate and purchasing decisions to support, trial, and pay
    for new technologies are simply not a life-and-death matter. So take your time
    to weigh up the pros and cons, the benefits versus the possible disadvantages
    a greenfield project or piloting of software could bring. What is the worst a
    customized, cybersecure AI bot could do to your department, company, or you?


    The very worst case that you could lose your job is highly unlikely and if that
    came about, it says more about your employer than your capabilities. And the organization’s
    appetite for risk and tolerance of failure is not where it should be. If it ever
    came to that, you ought to be working for more challenging, stimulating, and ultimately
    successful managers in the long term. If you can live with the improbable outcome
    of being sacked for a failed pilot and that is the only real threat prohibiting
    your attitude to experimenting with emerging tech, then you should take the plunge!


    List of Regulatory Failures and Obstacles Blocking Bot Scaleups


    *   No regulation exists specifically for chatbots, AI bots, or botification.


    *   They are only affected via data protection laws and privacy breaches as guarded
    by the GDPR and similar legislation in other countries


    *   Even that remains a matter for enforcement, who has the onus of proof, who
    prosecutes and how—look at my analysis of the Tay.ai scandal and the Eugene Goostman
    hypedup claims in the next section to understand this better applied to clear
    international cases


    *   The laws and legislators have failed to address the issues that the Swiss
    Intervention was raising as discussed in my VentureBeat article “First chatbot
