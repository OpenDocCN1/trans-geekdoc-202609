- raw: 'You need to reframe the way you look at purchasing innovation and put it in
    terms of payoff: I take more risk but can always justify it with the knowledge
    that it has created jobs in the local economy. It has put my company or government
    body in good stead with the regional infrastructure providers, for example, local
    government services and Chambers of Commerce/business groups because we have bought
    from local sellers rather than foreign companies that may not even pay corporate
    tax in your country, so no trickled down into funding the said infrastructure
    and tech hubs!


    Above all, you can reframe your purchasing decision in terms of national productivity
    goals. What is that tangibly speaking and put into your everyday office life and
    work routine? Well, let’s focus on the example of emails and chatbots. As we have
    seen in this book, many business intelligence firms are picking chatbots or IVAs
    as the future of communications, which inevitably makes emailing redundant, if
    it is not already so in many aspects.


    Chatbots Are the Future According To a Londoner Lobby Platform and The Mayor in
    2019


    The following extract from the CognitionX Taster White Paper 2019 makes it very
    clear that “most chatbot deployment plans are in the next year or so, most chatbot
    plans expect substantial investment and impact, the use of natural language is
    expected to grow substantially.”[1](#06_Chapter_6.xhtml#footnote-075) We need
    to take their research seriously because although CogX is a relatively new AI
    bots platform campaigning to support the UK niche industry, it has support at
    the highest levels of government, which is all important in the British economic
    context.


    It has been backed by the London mayor Sadiq Khan who spoke at their annual conference
    in the capital in summer 2019. And it has the express backing of the current UK
    government through CogX’s high profile cofounder Tabitha Goldenstaub from Wimbledon
    and a successful serial entrepreneur. Goldstaub has a powerful reputation as a
    feminist in the tech world, visibly campaigning to get more women into STEM and
    especially into artificial intelligence companies in order to reduce algorithmic
    bias in its development and commercial roll-out.


    As the previous CogX excerpt summarizes, chatbots will be taking over the world!
    It describes the “future of chatbots as ubiquitous, much like speech in humans.”
    Just as well because as we can see from this American use case as shown in the
    following, even absolutely necessary business or educational human conversations
    are far from guaranteed with the next generation(s), partly the fault of technology
    and partly solved by it.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c6fig1.JPG)


    Figure 6.1 © Realfiction, Copenhagen, 2019. The Danish manufacturer of this frame
    that creates 3D hologram experiences like this dinosaur skeleton suddenly coming
    to life, is a pioneer in CX tech. The Customer Experience, even for visitors to
    a natural history museum, has reached a new bar of expectations and consumer satisfaction.
    Mixed Reality experiences like this one is providing a benchmark for user interaction
    or UX


    Boston’s Botification of University Campuses for Next-Gen Humans


    Let’s look at the excellent statistics of this Boston-based challenger tech company
    AdmitHub. Full disclosure: I met the cofounder Andrew Maggioli at the Re-Work
    Deep Learning Summit, their inaugural Chatbots Track, end of 2016. I enjoyed Andrew’s
    case studies he shared during his keynote and have followed AdmitHub’s exponential
    growth since then admiringly given they have forged ahead despite all the misconceptions
    about 2D chatbots as discussed in this book. They have convinced enough users
    in their vertical of higher education of their specific use case.


    The point here about productivity is that AdmitHub’s research has found that Generation
    Z only opens 20 percent of the emails sent to them by the higher education administrators,
    the Admissions Centers, their lecturers, and the associated university service
    providers.[2](#06_Chapter_6.xhtml#footnote-074) That represents a staggering 80
    percent loss in productivity for this student–admin communication! I have heard
    this pain point repeated by UK, Australian, French, and German higher education
    operators who have come to my company AI Bots as a Service for Requests for Proposals,
    so it definitely is a global trend.


    This means for the precious university budgets—again largely taxpayer and government
    funded in most advanced economies—large amounts are being wasted on communicating
    students who ignore these communications. What should they do? Send out pigeons
    and smoke signals to the recalcitrant Gen Zers? Interrupt their Wi-Fi on campus
    to broadcast Official News and comms like in the Golden Days of 1950s television
    and radio alerts to the nation before that?


    The answer lies in chatbots because the 2D bots are in the medium that Gen Z does
    engage with: texting or more accurately Instant Messaging. AdmitHub has published
    a white paper asserting that as opposed to the ignoring of 80 percent of emails
    sent to them, 98 percent university or college students will open and read text
    messages or IM notifications, and do so more or less immediately. Radically in
    terms of productive communications and the massive resources spent in terms of
    staff, time, and organization on campus, 40 percent of Gen Z students will also
    reply to the administrators’ messages!


    AdmitHub has cleverly integrated this emerging data into their sales pitch and
    I note the majority of its Bostonian staff are sales and marketing account managers.
    Their 2D AI bots they are now calling their chatbot solution can help with that
    40 percent conversion rate and restore some element of productivity to student–administrator
    communications.


    Let’s face it—less than one-fifth of your target audience even reading what you
    say about something as important as their upcoming exam dates, changes of rooms,
    exam results, and admission info can only be considered an unproductive waste
    of time. Chatbots to the rescue in that at least they will get the message through
    and have double the chance of obtaining a response, a reaction if not an action
    from the target of the comms.


    Entrepreneurial, Intrapreneurial, and the Sales Dead End


    As we have seen in the previous checklists section, a different approach is required
    for entrepreneurs engaged with outside of your organization as opposed to recruiting
    intrapreneurs, that is, new recruits hired to run a pilot from within your company.
    If you misstep and end the pilot, it could be the end of the venture externally.
    You could have just killed off a startup in the public domain. Bad kudos for you
    and word gets around in the tech scene you are a partner/purchaser to avoid. Naming
    and shaming can happen these days very indiscreetly, but it does happen.


    Closing down an internal R&D unit is another matter. Financial risk is often absolutely
    minimized by being forced to operate in a predefined budget, with money “given”
    to the intrapreneurial team before they even startup in their allocated office
    space. A comfortable feeling of being nurtured and removing the enormous stress
    of bootstrapping and “having to find the money to cover costs somehow” also removes
    the urgency that is lived and breathed in a normal startup scenario.


    ![Image](/library/view/uses-and-risks/9781949443448/Images/c6fig2.JPG)


    Figure 6.2 © Realfiction Copenhagen, 2019. This dinosaur is an example of an animated
    life-sized hologram. This type of Mixed Reality is the multimedia format used
    by AI BaaS to “implant various bot brains” effectively turning the giant hardware
    device into a shell or physical framework for a live, organically developing Cognitive
    Interface'
