- raw: '**DNA (Deoxyribonucleic acid**) the polymer that encodes genetic material
    and therefore the structures of proteins and many animal traits.


    **EHR (Electronic Health Record)** a subset of each CDO’s EMR, presently assumed
    to include summaries, such as ASTM’s Continuity of Care Record (CCR) and HL7’s
    Care Record Summary (CRS), and possibly information from pharmacy benefit management
    firms, reference labs and other organizations about the health status of patients
    in the community (Garets and Davis 2005).


    **EHR-derived phenotype** phenotype based on Electronic Health Record (EHR).


    **Electronic medical records (EMS)** computerized legal clinical records created
    in CDOs, such as hospitals and physician offices (Garets and Davis 2005).


    **Epigenetic** relating to, being, or involving a modification in gene expression
    that is independent of the DNA sequence of a gene (e.g., epigenetic carcinogenesis,
    epigenetic inheritance) (Merriam-Webster 2007).


    **Epigenome** the epigenome consists of chemical compounds that modify, or mark,
    the genome in a way that tells it what to do, where to do it, and when to do it.
    Different cells have different epigenetic marks. These epigenetic marks, which
    are not part of the DNA itself, can be passed on from cell to cell as cells divide,
    and from one generation to the next (NHGRI 2011).


    **Epiphenomenon** an additional condition or symptom in the course of a disease,
    not necessarily connected with the disease (Houghton Mifflin Company 2007).


    **Etiology** the study of all factors that may be involved in the development
    of a disease, including the susceptibility of the patient, the nature of the disease
    agent, and the way in which the patient’s body is invaded by the agent (Mosby
    2009).


    **Exposome** characterization of both exogenous and endogenous exposures that
    can have differential effects at various stages during a person’s lifetime (Wild
    2005; Rappaport 2011).


    **Gel electrophoresis** electrophoresis in which molecules (as proteins and nucleic
    acids) migrate through a gel and especially a polyacrylamide gel and separate
    into bands according to size (Merriam-Webster 2007).


    **GenBank** the GenBank sequence database is an annotated collection of all publicly
    available nucleotide sequences and their protein translations (Mizrachi 2002).


    **Gene-environment interactions** an influence on the expression of a trait that
    results from the interplay between genes and the environment. Some traits are
    strongly influenced by genes, while other traits are strongly influenced by the
    environment. Most traits, however, are influenced by one or more genes interacting
    in complex ways with the environment (NHGRI 2011).


    **Gene expression** is the process by which the information encoded in a gene
    is used to direct the assembly of a protein molecule. The cell reads the sequence
    of the gene in groups of three bases. Each group of three bases (codon) corresponds
    to one of 20 different amino acids used to build the protein (NHGRI 2011).


    **Gene expression profiling** is the measurement of the activity of thousands
    of genes at once to create a global picture of cellular function. These profiles
    can, for example, distinguish between cells that are actively dividing, or show
    how the cells react to a particular treatment. Many experiments of this sort measure
    an entire genome simultaneously, that is, every gene present in a particular cell
    (InfoGlobalLink 2011).


    **Genetic polymorphisms** the recurrence within a population of two or more discontinuous
    genetic variants of a specific trait in such proportions that they cannot be maintained
    simply by mutation. Examples include the sickle cell trait, the Rh factor, and
    the blood groups (Mosby 2009).


    **Genetic privacy** the protection of genetic information about an individual,
    family, or population group from unauthorized disclosure (Kahn and Ninomiya 2010).


    **Genome** the full sequence of genetic material encoded in DNA in an organism.


    **Genome-Wide Association Study (GWAS)** a study that identifies markers across
    genomes to find genetic variation associated with a disease or condition (PCAST
    2008).


    **Genotype** the genetic sequence of an individual organism, often categorized
    in terms of known genetic variants. This can either refer to known alleles (or
    types) of a single gene or to collections of genes. For example, some lung cancers
    have a mutant Egf receptor genotype while other lung cancers have a wild-type
    (or normal) Egf receptor genotype.


    **Geographic Information System (GIS)** an organized collection of computer hardware,
    software, geographic data, and personnel designed to efficiently capture, store,
    update, manipulate, analyze, and display all forms of geographically referenced
    information (ESRI 1990).


    **Health Insurance Portability and Accountability Act (HIPAA)** an act of Congress,
    passed in 1996, that affords certain protections to persons covered by health-care
    plans, including continuity of coverage when changing jobs, standards for electronic
    health-care transactions, and privacy safeguards for individually identifiable
    patient information (Mosby 2009).


    **Heterozygous** having inherited different forms of a particular gene from each
    parent. A heterozygous genotype stands in contrast to a homozygous genotype, where
    an individual inherits identical forms of a particular gene from each parent (NHGRI
    2011).


    **Histology** the science dealing with the microscopic identification of cells
    and tissue (Mosby 2009).


    **Human Microbiome Project (HMP)** a National Institutes of Health initiative
    that aims to characterize the microbial communities found at several different
    sites on the human body, including nasal passages, oral cavities, skin, gastrointestinal
    tract, and urogenital tract, and to analyze the role of these microbes in human
    health and disease.


    **Institutional Review Board (IRB)** a group of physicians, scientists, ethicists,
    lawyers, and community members that review human subjects research to ensure that
    the research will be performed ethically and that it will benefit patients. Individual
    institutions, such as universities, often have their own IRBs that must approve
    all human subjects research before it is conducted within the institution.


    **International Classification of Diseases (ICD)** an official list of categories
    of diseases, physical and mental, issued by the World Health Organization (WHO).
    It is used primarily for statistical purposes in the classification of morbidity
    and mortality data. Any nation belonging to WHO may adjust the classification
    to meet specific needs (Mosby 2009).


    **Linkage analysis (LA)** a gene-hunting technique that traces patterns of heredity
    in large, high-risk families in an attempt to locate a disease-causing gene mutation
    by identifying traits co-inherited with it; the formal study of the association
    between the inheritance of a condition in a family and a particular chromosomal
    locus; LA is based on certain ground rules of genetics (McGraw-Hill 2002).


    **Lipidome** the totality of lipids in cells (Quehenberger et al. 2010).


    **Longitudinal study** a research study that collects repeated observations of
    the same items over a long period of time (PCAST 2008).


    **Metabolic profiling** identifying the types and amounts of known metabolic intermediates
    present in a biological specimen.


    **Metabolome** can be defined as the complete complement of all small molecule
    (<1500 Da) metabolites found in a specific cell, organ, or organism. It is a close
    counterpart to the genome, the transcriptome, and the proteome. Together these
    four ‘omes’ constitute the building blocks of systems biology (Wishar et al. 2007).


    **Microbiome** term used to describe the collective genome of our indigenous microbed
    (microflora) (Hooper and Gordon 2001 in IOM 2010b). Identification of the types
    of microbes present in a biological specimen or that are associated with another
    organism, such as a human.'
