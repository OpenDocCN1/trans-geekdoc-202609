  trans: "\n委员会构想了这项宏大的计划，其执行跨度将是十年而非几年，并将通过自上而下和自下而上的活动相结合的方式进行。一个主要的自上而下组成将由资助和监管生物医学研究的公立和私人机构发起，确保各个项目的结果能够整合起来，创建一个广泛适用且易于获取的`信息公社`（Information\
    \ Commons），并为个人患者数据成为广泛共享的研究资源时，可能产生的无数社会、伦理和法律问题制定指南。然而，作为框架性研究的一部分，委员会并未尝试设计`信息公社`、`知识网络`（Knowledge\
    \ Network）或`新分类法`（New Taxonomy）本身，并且不建议资助机构在尝试创建这些实体的初期阶段对其其进行过度规定。委员会认为，需要的是一个创性的自下而上研究阶段，通过规模和程度不断增加的试点项目进行组织，委员会有信心从中将产生最佳实践。特别是考虑到医疗保健事业的规模和多样性，任何一种填充`信息公社`的数据方法都不可能适用于所有贡献者。与任何此类复杂的倡议一样，需要的是恰当的协调，并鼓励许多需要合作以创建`信息公社`和`知识网络`并开发`新分类法`的参与者。如果协调过于僵化，急需的创新对当地情况的适应将受到抑制；如果协调过于松散，则无法将收集的数据整合成一个整体，其整体的价值将远大于部分之和，而委员会认为这一目标通过有效的中央领导是可以实现的。\n\
    \n![images/p2.jpg](img/p2.jpg)\n\n**图 S-1** 创建`新分类法`首先需要一个`信息公社`，其中大规模患者群体的数据可以广泛用于研究使用；以及一个`知识网络`，该网络通过强调数据之间的相互连接性并将其与不断发展的的基础生物学过程知识相结合，从而为这些数据增加价值](../Text/contents.xhtml#fi_S-1)。\n\
    \n来源：开发疾病新分类法框架委员会。\n\n# 结论\n\n委员会举办了一场为期两天的研讨会，召集了基础和临床疾病生物学领域的各类专家，讨论创建“基于分子生物学的人类疾病新分类法”的可性、必要性、范围、影响和后果。研讨会上传递的信息和意见指导并影响了委员会在六个月内进行的一系列密集审议（线下和电话会议），并得出以下结论：\n\
    \n1. **新分类法将带来更好的医疗保健。** 由于生物医学研究中的新信息和概念无法以最优方式整合到当今的疾病分类中，我们错过了更精确地定义疾病和指导医疗决策的机会。许多具有不同分子原因的疾病亚型仍被归类为一种疾病；反之，多种不同的疾病共享的分子原因。未能优化整合新的生物学见解导致新实践指南的采用推迟，并对仅对特定亚组有效的治疗造成了医疗支出的浪费。\n\
    \n2. **现在是疾病分类法现代化的时机。** 分子生物学的巨大进展使得对临床样本进行快速、全面且具有成本效益的分析成为可能，导致相关数据爆炸式增长，具有从上改变疾病分类的潜力。基础发现研究正在从分子水平上定义和驱动生理功能的过程。这些发展，结合信息技术和电子病历的并行进展，为创建一个分类疾病的新系统提供了转型的契机。\n\
    \n3. **应当开发新分类法。** 以动态、迭代的方式将多参数分子数据与临床数据、环境数据和健康结果整合的新分类法是可行的，并且应当被开发。委员会构想了一种全面的疾病分类法，将生物医学研究、公共卫生和医疗保健社区聚集在一起，共同实现理解疾病发病机制和改善健康的相关目标。\n\
    \   - 除了传统的物理“体征和症状”，还根据其内在生物学特性描述和定义疾病。\n   - 超越描述，直接联系疾病机制、发病机制和治疗的更深层次理解。\n\
    \   - 具有高度动态性，至少当作为研究工具时，不断纳入新出现的疾病信息。\n\n4. **疾病知识网络将使新分类法成为。** 创建具有上述特征的`新分类法`所需的信息基础设施，与使许多其他生物医学研究和患者护理现代化所需的设施相重叠。这种基础设施需要一个`信息公社`，其中大规模患者群体的数据可以广泛用于研究使用；以及一个`知识网络`，该网络通过强调数据之间的相互连接性并将其与不断发展的的基础生物学过程知识相结合，从而为这些数据增加价值。\n\
    \n5. **基于人群的研究的新模型将实现知识网络的开发.** 目前基于人群的研究效率较低，可能产生与更广泛人群不相关的结论。电子病历在医疗系统中的广泛整合将使得在常规医疗服务过程中，“护理旁”（point-of-care）进行此类研究成为可能。此外，只有在常规诊疗过程中获取关联的表型数据，才可能在经济上对足够数量的患者进行特征描述，并最终创建一个给自足的系统（即收集个人患者分子数据的成本在成本效益方面上具有医学合理性的系统）。\n\
    \n6. **资源的重定向可以促进疾病知识网络的发展。** 开发新分类法的倡议——及其基础的信息公社和知识网络——是对当前整合分子、环境和表型数据方法的必要现代化改造，而不是对现有研究计划的“附加”。为了实现本报告中的许多目标，人们已经付出了巨大努力。委员会认为，缺乏的是一种系统性的重点，即将将大规模分子数据的获取转移到护理旁环境，以及确保研究成果能聚合成信息公社和知识网络所需的协调，从而从中推导出新分类法（以及许多其他益处）。鉴于这一结论，委员会未对新分类法倡议的资源需求提出任何建议。显然，新的资源可以加速这一过程；然而，委员会建议的主旨可以通过重定向已用于增加个人患者大规模分子数据医学价值的资源来实现。\n\
    \n# 建议\n\n为了创建新分类法及其基础的信息公社和知识网络，委员会提出以下建议：\n\n"
