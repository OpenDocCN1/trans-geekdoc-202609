  trans: '

    Morrison 博士在达尔豪斯大学获得生物学和化学学士学位（1991 年），随后在斯坦福大学获得免疫学博士学位（1996 年），并在加州理工学院（Caltech）完成神经生物学博士后研究（1999
    年）。1999 年至 2011 年间，Morrison 博士任于密歇根大学，担任干细胞生物学中心主任。近期，Morrison 博士迁至德克萨斯大学西南南部医学中心，担任新成立儿童研究所的创始院长。Morrison
    博士曾是塞尔尔学者（2000–2003 年），获得总统早期科学家与工程师奖（2003 年）、国际血液学与干细胞学会 McCulloch 和 Till 奖（2007
    年）、美国解剖学家协会 Harland Mossman 奖（2008 年）以及国立老龄研究所颁发的 MERIT 奖（2009 年）。


    Morrison 博士还活跃于干细胞研究相关的公共政策问题。例如，他曾两次在国会作证，并在保护密歇根州宪法中干细胞研究的“2 号提案”运动中担任领导者。


    ### David G. Nichols


    David G. Nichols 是约翰霍普金斯大学的麻醉学/重症医学及儿科教授，玛丽·华莱斯·斯坦顿教育教授。自 1984 年加入医学院教团队以来，他在麻醉与重症医学科以及全校范围内担任过众多领导职务。Nichols
    博士于 2000 年被任命为教学副院长，负责本科生、研究生、住院医、博士后及继续医学教育计划，以及威尔奇医学图书馆的管理。他领导了多项重大倡措，以改进医学院在教育中对技术的创新应用；更新医学院课程；通过修订终身制和晋升指南来改进教职工发展；重组研究生医学教育；监督一座耗资
    5000 万美元的新型医学教育大楼的设计；并增强整个约翰霍普金斯医学部的多样性。


    1984 年至 1987 年，Nichols 博士担任麻醉与重症医学科住院医教育计划副主任。1988 年，他成为儿科重症监护室和儿童重症监护单元（PICU）的分部主任。在
    Nichols 博士的领导下，该部门于 1997 年与儿科麻醉学合并。在此期间，他培训并指导了 50 多名博士后研究员，其中许多人现在是美国及国外的教授或
    PICU 院院长。Nichols 博士于 1998 年成为麻醉学/重症医学及儿科正教授，并于 2005 年获得玛丽·华莱斯·斯坦顿教育教授。他撰写了 80
    多篇专业期刊文章和摘要，担任过 17 次客座教授，主持了 20 多场座谈会，并进行了 115 多次客座演讲。他还担任了儿科重症医学领先教材的主编，并编校了《罗杰儿童重症监护学》（`Rogers
    Textbook of Pediatric Intensive Care`）和《婴儿和儿童严重心脏疾病》。


    ### Maynard V. Olson


    Maynard V. Olson 是华盛顿大学医学与基因组荣誉教授。他于 1970 年在斯坦福大学获得化学博士学位，1965 年在加州理工学院获得化学学士学位。他的研究兴趣集中在细菌和人类自然遗传变异的研究。这项研究涉及人类遗传学、基因组学、分子遗传学、分析生物化学和计算生物学的活动。Olson
    博士对跨学科研究有特殊兴趣，特别是在化学、计算机科学和生物学之间的交叉领域。


    Olson 博士参与了人类基因组计划科学政策的制定，担任国家研究委员会人类基因组制图与测序委员会成员，以及国立人类基因组研究所计划规划委员会成员。为了其其遗传学和基因组学方面的研究，他于
    1992 年获得美国遗传学会奖章、2000 年获得医学城市奖、2002 年获得 Gairdner 国际奖以及 2007 年获得 Gruber 遗传学奖。


    ### Charmaine D. Royal


    Charmaine D. Royal 是杜克大学基因组科学与政策研究所以及非洲及非裔美国人研究系的副座研究教授。她在霍华德大学获得了遗传咨询硕士学位和人类遗传学博士学位。随后，她在美国国立卫生研究院（NIH）国立人类基因组研究所的生物伦理与特殊人群研究计划，以及霍华德大学癌症中心的流行病学与行为医学分部完成了博士后训练。


    在 2007 年加入杜克大学教团队之前，Royal 博士曾任霍华德大学儿科教授及国立人类基因组中心 GenEthics 单元主任。她担任了雏马基金会生物伦理咨询委员会、美国人类遗传学会社会问题委员会、《美国生物伦理杂志》（`American
    Journal of Bioethics`）编辑部以及其他专业委员会和董事会的成员。


    Royal 博士的研究和学术工作主要关注遗传学/基因组学与“种族”、祖先、族裔和身份概念交汇处的伦理、心理社会、社会和生物医学问题。她的具体兴趣包括遗传变异和对种族的（重新）概念化、研究和临床实践中使用种族和祖先、健康与健康差异中的基因-环境交互、遗传祖先推断、历史边缘化和代表性不足群体在遗传和基因组研究中的参与，以及基因组学与全球健康。她在这些及其他相关领域教学、演讲、发表并获得了资助。她研究计划的一个核心目标是通过加强遗传和基因组研究与行为、社会科学及人文科学研究的整合，推动一种更全面、更符合伦理的方法来理解和改善人类健康与福祉。


