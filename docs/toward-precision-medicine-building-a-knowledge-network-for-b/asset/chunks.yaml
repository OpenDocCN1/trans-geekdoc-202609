- raw: 'Dr. Morrison completed a BSc in biology and chemistry at Dalhousie University
    (1991), then a Ph.D. in immunology at Stanford University (1996), and a postdoctoral
    fellowship in neurobiology at the California Institute of Technology (Caltech;
    1999). From 1999 to 2011, Dr. Morrison was at the University of Michigan where
    he directed the Center for Stem Cell Biology. Recently, Dr. Morrison moved to
    the University of Texas Southwestern Medical Center where he is the founding Director
    of the new Children’s Research Institute. Dr. Morrison was a Searle Scholar (2000–2003),
    received the Presidential Early Career Award for Scientists and Engineers (2003),
    the International Society for Hematology and Stem Cell’s McCulloch and Till Award
    (2007), the American Association of Anatomists Harland Mossman Award (2008), and
    a MERIT Award from the National Institute on Aging (2009).


    Dr. Morrison has also been active in public policy issues surrounding stem cell
    research. For example, he has twice testified before Congress and was a leader
    in the successful “Proposal 2” campaign to protect stem cell research in Michigan’s
    state constitution.


    **David G. Nichols** is Professor of Anesthesiology/Critical Care Medicine and
    Pediatrics and the Mary Wallace Stanton Professor of Education at Johns Hopkins
    University. Since joining the School of Medicine faculty in 1984, he has held
    numerous leadership posts in both the Department of Anesthesiology and Critical
    Care Medicine and school-wide. Named Vice Dean for Education in 2000, Dr. Nichols
    oversees undergraduate, graduate, residency, postdoctoral and continuing medical
    education programs, as well as the Welch Medical Library. He has led a wide variety
    of significant initiatives to improve the School of Medicine’s innovative use
    of technology in education; update the Medical School’s curriculum; improve faculty
    development by revising tenure and promotion guidelines; restructure graduate
    medical education; oversee the design of a new $50 million medical education building;
    and enhance diversity throughout Johns Hopkins Medicine.


    From 1984 to 1987, Dr. Nichols was Associate Director of the Residency Education
    Program in the Department of Anesthesiology and Critical Care Medicine. He became
    Director of the Division of Pediatric Critical Care and of the pediatric intensive
    care unit (PICU) in 1988. The division was merged with pediatric anesthesiology
    under Dr. Nichols’ leadership in 1997. During this period, he trained and mentored
    more than 50 postdoctoral fellows, many of whom now are professors or directors
    of PICUs in the United States and abroad. Dr. Nichols became a full professor
    of anesthesiology/critical care medicine and pediatrics in 1998 and became the
    recipient of the Mary Wallace Stanton Professorship for Education in 2005. He
    has written more than 80 professional journal articles and abstracts, held 17
    guest professorships, headed more than 20 symposia, and delivered more than 115
    guest lectures. He also has been editor-in-chief of the leading textbooks in pediatric
    critical care medicine and edited *Rogers Textbook of Pediatric Intensive Care*
    and *Critical Heart Disease in Infants and Children*.


    **Maynard V. Olson** is Professor Emeritus of Medicine and Genome Sciences at
    the University of Washington. He received his Ph.D. in Chemistry at Stanford University
    in 1970 and a BS in Chemistry from the California Institute of Technology in 1965.
    His research interests focus on studies of natural genetic variation in both bacteria
    and humans. This research involves activities in human genetics, genomics, molecular
    genetics, analytical biochemistry, and computational biology. Dr. Olson has a
    special interest in interdisciplinary research, particularly at the interfaces
    between chemistry, computer science, and biology.


    Dr. Olson was involved in shaping scientific policy toward the Human Genome Project,
    serving on the National Research Council Committee on Mapping and Sequencing the
    Human Genome, the Program Advisory Committee of the National Center for Human
    Genome Research Institute. In recognition of his research in genetics and genomics,
    he received the Genetics Society of America Medal in 1992, the City of Medicine
    Award in 2000, the Gairdner International Award in 2002, and the Gruber Prize
    in Genetics in 2007.


    **Charmaine D. Royal** is an Associate Research Professor in the Institute for
    Genome Sciences & Policy and the Department of African and African American Studies
    at Duke University. She received her M.S. in Genetic Counseling and Ph.D. in Human
    Genetics from Howard University. She subsequently completed her postdoctoral training
    in the Bioethics and Special Populations Research Program at the National Human
    Genome Research Institute of the National Institutes of Health, and in the Division
    of Epidemiology and Behavioral Medicine at the Howard University Cancer Center.


    Prior to joining the Duke faculty in 2007, Dr. Royal was Assistant Professor of
    Pediatrics and Director of the GenEthics Unit in the National Human Genome Center
    at Howard University. She serves on the Bioethics Advisory Committee of the March
    of Dimes Foundation, Social Issues Committee of the American Society of Human
    Genetics, Editorial Board of the *American Journal of Bioethics*, and various
    other professional committees and boards.


    Dr. Royal’s research and scholarship focus primarily on ethical, psychosocial,
    societal, and biomedical issues at the intersection of genetics/genomics and concepts
    of “race”, ancestry, ethnicity, and identity. Her specific interests include genetic
    variation and the (re)conceptualization of race, use of race and ancestry in research
    and clinical practice, gene-environment interactions in health and health disparities,
    genetic ancestry inference, involvement of historically marginalized and underrepresented
    groups in genetic and genomic research, and genomics and global health. She has
    taught, presented, published, and received funding in these and other related
    areas. A key objective of her research program is to advance a more holistic and
    ethical approach to understanding and improving human health and well-being through
    increased integration of genetic and genomic research with behavioral, social
    science, and humanities research.'
