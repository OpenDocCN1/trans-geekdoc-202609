    \ may have been adequate in an era when treatments were largely directed toward\
    \ symptoms rather than underlying causes, there is a clear risk that continued\
    \ reliance on hierarchical taxonomies will inhibit efforts—already successful\
    \ in the case of some diseases—to exploit rapidly expanding mechanistic insights\
    \ therapeutically.\n\n[**Box 1-2  \n\nA Flexnerian Moment?**](../Text/contents.xhtml#bo_1-2)\n\
    \nIn 1910 educator Abraham Flexner released a report that revolutionized American\
    \ medical education by advocating a commitment to professionalization, high academic\
    \ standards, and close integration with basic science (Flexner 1910). The subsequent\
    \ rise of academic medical centers with a strong emphasis on research—coupled,\
    \ after World War II, with greatly expanded merit-based funding of research through\
    \ the National Institutes of Health and other public and private entities—allowed\
    \ the United States to capture global leadership in medical research, launch the\
