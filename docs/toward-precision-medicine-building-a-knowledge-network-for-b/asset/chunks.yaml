- raw: 'For these benefits to be realized, however, much work remains to be done.
    Some in the life sciences community are calling for the launch of a wide-ranging
    new program to use molecular and systems approaches to build a new “taxonomy”
    of human diseases. The feasibility of such a program, including the readiness
    of the technology, willingness of the scientific community to pursue it, and compelling
    nature of the gaps it would fill, remains to be explored. Embarking on such a
    program would require that existing data linking molecular, environmental, and
    experiential factors to disease states be surveyed and compiled, and that gaps
    in these data be identified and priorities set and acted upon to fill these gaps.
    In addition, effective and acceptable mechanisms and policies for selection, collection,
    storage, and management of data, as well as perception, construction, and manipulation
    network relationships within the data, are clearly needed. Criteria must also
    be established for providing or denying access to and interpretation of data.
    Roles of and interfaces among the involved communities (public and private funders,
    data contributors, clinicians, patients, industry, and others) would need to be
    explored and defined. And the many ethical considerations surrounding such a program
    would need to be addressed.


    Each of these areas is technically complex. Some are also vast, e.g., the compilation
    of current knowledge and the scientific research efforts needed to fill gaps.
    Undertaking such a program would clearly require the participation and collaboration
    of many government and private entities over a considerable period of time. To
    ensure that progress is being made, goals and milestones against which program
    success can be measured would need to be developed. The NIH seeks the advice of
    an expert NRC Committee charged with exploring the feasibility and need, and developing
    a framework, for a potential “New Taxonomy of Disease” effort. The Committee would
    leverage the expertise of additional scientists, clinicians, and others by holding
    a large (approximately 100 participants) workshop to obtain ideas from the broader
    scientific and medical communities. Following the workshop, the Committee will
    use the workshop results to distill its findings and recommendations for the structure
    and components of a framework into a consensus report to NIH. The Committee will
    also consider recommending a small number of case studies that might be used as
    an initial test for the framework.


    [Appendix B](../Text/contents.xhtml#a44)


    [Committee Biographies](../Text/contents.xhtml#a44)


    COMMITTEE MEMBERS


    **Susan Desmond-Hellmann**, M.D., M.P.H., is Chancellor of the University of California,
    San Francisco. She assumed the post August 3, 2009.


    UCSF is a leading university dedicated to promoting health worldwide through advanced
    biomedical research, graduate-level education in the life sciences and health
    professions, and excellence in patient care. UCSF is the only campus in the 10-campus
    UC system devoted exclusively to the health sciences.


    Dr. Desmond-Hellmann previously served as president of product development at
    Genentech, a position she held from March 2004 through April 30, 2009. In this
    role, she was responsible for Genentech’s preclinical and clinical development,
    process research and development, business development and product portfolio management.
    She also served as a member of Genentech’s executive Committee, beginning in 1996.
    She joined Genentech in 1995 as a clinical scientist, and she was named chief
    medical officer in 1996. In 1999, she was named executive vice president of development
    and product operations. During her time at Genentech, several of the company’s
    patient therapeutics (Lucentis, Avastin, Herceptin, Tarceva, Rituxan and Xolair)
    were approved by the U.S. Food and Drug Administration, and the company became
    the nation’s No. 1 producer of anti-cancer drug treatments.


    She completed her clinical training at UCSF and is board-certified in internal
    medicine and medical oncology. She holds a bachelor of science degree in pre-medicine
    and a medical degree from the University of Nevada, Reno, and a master’s degree
    in public health from the University of California, Berkeley.


    Prior to joining Genentech, Dr. Desmond-Hellmann was associate director of clinical
    cancer research at Bristol-Myers Squibb Pharmaceutical Research Institute. While
    at Bristol-Myers Squibb, she was the project team leader for the cancer-fighting
    drug Taxol.


    Dr. Desmond-Hellmann also has served as associate adjunct professor of epidemiology
    and biostatistics at UCSF. During her tenure at UCSF, she spent two years as visiting
    faculty at the Uganda Cancer Institute, studying HIV/ AIDS and cancer. She also
    spent two years in private practice as a medical oncologist before returning to
    clinical research.


    In January 2009, Desmond-Hellmann joined the Federal Reserve Bank of San Francisco’s
    Economic Advisory Council for a three-year term. In July 2008, she was appointed
    to the California Academy of Sciences board of trustees. Dr. Desmond-Hellmann
    was named to the Biotech Hall of Fame in 2007 and as the Healthcare Businesswomen’s
    Association Woman of the Year for 2006. She was listed among *Fortune* magazine’s
    “top 50 most powerful women in business” in 2001 and from 2003 to 2008. In 2005
    and 2006, the *Wall Street Journal* listed dr. Desmond-Hellmann as one of its
    “women to watch.” From 2005 to 2008, Dr. Desmond-Hellmann served a three-year
    term as a member of the American Association for Cancer Research board of directors,
    and from 2001 to 2009, she served on the executive committee of the board of directors
    of the Biotechnology Industry Organization. She served on the corporate board
    of Affymetrix from 2004–2009.


    **Charles L. Sawyers**, M.D., is an Investigator of the Howard Hughes Medical
    Institute and the inaugural Director of the Human Oncology and Pathogenesis Program
    (HOPP) at Memorial Sloan-Kettering Cancer Center (MSKCC), where he is building
    a program of lab-based translational researchers across various clinical disciplines
    and institutional infrastructure to enhance the application of global genomics
    tools to clinical trials.


    Dr. Sawyers’ laboratory is currently focused on characterizing signal transduction
    pathway abnormalities in prostate cancer, with an eye toward translational implications.
    His research is best demonstrated through his earlier studies of BCR-ABL tyrosine
    kinase function in chronic myeloid leukemia, his work with Brian Druker and Novartis
    in the development of the kinase inhibitor imatinib/Gleevec as primary therapy
    for CML, and his discovery that imatinib resistance is caused by BCR-ABL kinase
    domain mutations. This discovery led Dr. Sawyers to evaluate second-generation
    Abl kinase inhibitors, such as the dual Src/Abl inhibitor dasatinib, which received
    fast-track approval at the FDA in June 2006.'
