- raw: '**Molecular biology** (A) a branch of biology dealing with the ultimate physicochemical
    organization of living matter and especially with the molecular basis of inheritance
    and protein synthesis (Merriam-Webster 2007); (B) field of science concerned with
    the chemical structures and processes of biological phenomena at the molecular
    level (Merriam-Webster 2007).


    **Moore’s Law** the number of transistors that can be placed inexpensively on
    an integrated circuit doubles approximately every two years (Moore 1965).


    **National Center for Biotechnology Information (NCBI)** the National Center for
    Biotechnology Information advances science and health by providing access to biomedical
    and genomic information (NCBI 2011).


    **Natural language processing** a theoretically motivated range of computational
    techniques for analyzing and representing naturally occurring texts at one or
    more levels of linguistic analysis for the purpose of achieving human-like language
    processing for a range of tasks or applications (Liddy 2001)


    **Observational studies** although molecular data will be collected from individuals
    in the normal course of health care, no changes in the treatment of the individuals
    would be contingent on the data collected.


    **Ontology** a branch of metaphysics concerned with the nature and relations of
    being (Merriam-Webster 2007).


    **Oophorectomy** the surgical removal of an ovary (Merriam-Webster 2007).


    **Outcomes research** the systematic study of the effects of different therapeutic
    interventions on health outcomes.


    **Pathogenesis** the origination and development of a disease (Merriam-Webster
    2007).


    **Pathology** (A) the study of the essential nature of diseases and especially
    of the structural and functional changes produced by them; (B**)** something abnormal:
    *a* : the structural and functional deviations from the normal that constitute
    disease or characterize a particular disease (Merriam-Webster 2007).


    **Pathophysiology** the physiology of abnormal states; *specifically* : the functional
    changes that accompany a particular syndrome or disease (Merriam-Webster 2007).


    **Patient oriented research** observation and scientific study of individuals
    or small groups of subjects for an understanding of their physiologic and pathophysiologic
    characteristics. The primary focus of the research is on mechanisms of disease
    on the clinical observations and laboratory studies that define these mechanisms
    as well as interventions that modify the course of the disease (APOR 2011).


    **Personalized medicine (also see: Precision medicine)** “refers to the tailoring
    of medical treatment to the individual characteristics of each patient. It does
    not literally mean the creation of drugs or medical devices that are unique to
    a patient, but rather the ability to classify individuals into subpopulations
    that differ in their susceptibility to a particular disease or their response
    to a specific treatment. Preventive or therapeutic interventions can then be concentrated
    on those who will benefit, sparing expense and side effects for those who will
    not” (PCAST 2008). This term is now widely used, including in advertisements for
    commercial products, and it is sometimes misinterpreted as implying that unique
    treatments can be designed for each individual. For this reason, the Committee
    thinks that the term “precision medicine” is preferable to “personalized medicine”
    to convey the meaning intended in this report.


    **Phenome-Wide Association Study (PheWAS)** akin to the genome-wide association
    studies (GWAS) widely used today to find single nucleotide polymorphisms (SNPs)
    that are genetically linked in a population to a particular disease trait—except
    that PheWAS is GWAS in reverse. GWAS associates genotypes with a given phenotype,
    such as height or a genetic disease. In contrast, PheWAS attempts to determine
    the range of clinical phenotypes associated with a given genotype (Mak 2011).


    **Phenotype** the idiosyncratic traits exhibited by an organism, often categorized
    in terms of known trait variants. This can either refer to a specific trait or
    to a collection of traits. For example, blue eyes and brown eyes are phenotypes
    exhibited in subsets of humans.


    **Phenotype-genotype association (or correlation)** the association between the
    presence of a certain mutation or mutations (genotype) and the resulting physical
    trait, abnormality, or pattern of abnormalities (phenotype). With respect to genetic
    testing, the frequency with which a certain phenotype is observed in the presence
    of a specific genotype determines the positive predictive value of the test **(**[http://ghr.nlm.nih.gov/glossary=genotypephenotypecorrelation](http://ghr.nlm.nih.gov/glossary=genotypephenotypecorrelation)).


    **Precision medicine (also see: Personalized Medicine)** as used in this report,
    “precision medicine” refers to the tailoring of medical treatment to the individual
    characteristics of each patient. It does not literally mean the creation of drugs
    or medical devices that are unique to a patient, but rather the ability to classify
    individuals into subpopulations that differ in their susceptibility to a particular
    disease, in the biology and/or prognosis of those diseases they may develop, or
    in their response to a specific treatment. Preventive or therapeutic interventions
    can then be concentrated on those who will benefit, sparing expense and side effects
    for those who will not. Although the term “personalized medicine” is also used
    to convey this meaning, that term is sometimes misinterpreted as implying that
    unique treatments can be designed for each individual. For this reason, the Committee
    thinks that the term “precision medicine” is preferable to “personalized medicine”
    to convey the meaning intended in this report. It should be emphasized that in
    “precision medicine” the word “precision” is being used in a colloquial sense,
    to mean both “accurate” and “precise” (in the scientific method, the **accuracy**
    of a measurement system is the degree of closeness of measurements of a quantity
    to that quantity’s actual (true) value whereas the **precision** of a measurement
    system, also called reproducibility or repeatability, is the degree to which repeated
    measurements under unchanged conditions show the same results). [http://en.wikipedia.org/wiki/Accuracy\_and\_precision](http://en.wikipedia.org/wiki/Accuracy_and_precision).
    the point where pharmacogenetics and personalised medicine meet (The Economist
    2009).


    **Precompetitive collaboration** collaboration among competitors to achieve goals
    that can be more effectively accomplished by a group effort and have the potential
    to benefit everyone (IOM 2010a).


    **Proteome** the entire complement of proteins and associated modifications produced
    by an organism (PCAST 2008).


    **Public–private partnerships** agreement between a public agency (federal, state,
    or local) and a private sector entity. Through this agreement, the skills and
    assets of each sector (public and private) are shared in delivering a service
    or facility for the use of the general public (NCPP 2011).


    **Radioisotopic labeling** the incorporation of radioactive atoms into DNA so
    that the DNA can be detected and visualized based on its emission of radioactivity.


    **Recombinant DNA** the artificial synthesis of sequences of DNA that may or may
    not exist in nature using genetic engineering techniques. These techniques are
    central to much of molecular biology and to the development of modern drugs.


    **Sequelae** a pathological condition resulting from a prior disease, injury,
    or attack ([MedicineNet.com](http://MedicineNet.com). 2011).


    **Single Nucleotide Polymorphism (SNP)** single genetic variation; DNA sequence
    variations caused by single base changes at a given position in a genome. (PCAST
    2008).


    **Signs and symptoms** objective evidence of disease perceptible to the examining
    physician (sign) and subjective evidence of disease perceived by the patient (symptom).'
