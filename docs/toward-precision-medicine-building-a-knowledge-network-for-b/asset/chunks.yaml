    \ Clinic professor and leader in the development of ICD-11, said that the potential\
    \ of the genomic transformation of medicine “far exceeds the introduction of antibiotics\
    \ and aseptic surgery.” However, achieving the full potential of the molecular\
    \ revolution will require—and to an important extent enable—re-thinking both biomedical\
    \ research and health care on a Flexnerian scale. Creation of a Knowledge Network\
    \ of Disease that consolidates and integrates basic, clinical, social, and behavioral\
    \ information, and that helps to inform a New Taxonomy that enables the delivery\
    \ of improved, more individualized health care, will be a crucial element of this\
    \ revolutionary change (Chute 2011)."
