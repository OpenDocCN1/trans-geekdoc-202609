- raw: '3.  ***Gradual elimination of institutional, cultural, and regulatory barriers
    to widespread sharing of the molecular profiles and health histories of individuals,
    while still protecting patients’ rights****.* The sharing of data about individual
    patients among multiple parties—including patients, physicians, insurance companies,
    the pharmaceutical industry, and academic research groups—will be essential. Current
    policies on consent, confidentiality, data protection and ownership, health cost
    reimbursement, and intellectual-property will need to be modified to ensure the
    free flow of research data between all stakeholders without compromising patient
    interests.


    [A NEW DISCOVERY MODEL FOR DISEASE RESEARCH](../Text/contents.xhtml#a32)


    The current model for relating molecular data to diagnoses and clinical outcomes
    typically involves abstracting clinical data for a modest number of patients from
    a clinical to a research setting, then attempting to draw correlations between
    the abstracted clinical data and molecular data such as genetic polymorphisms,
    gene-expression levels, and metabolomic profiles. When discoveries are judged
    definitive and potentially useful, an effort is made to return this information
    to the clinical setting—for example, as a genetic or genomic diagnostic test.
    This model creates a large gulf between the point of discovery and the point of
    care with many opportunities for mis- and even non-communication between key stakeholders.
    For example, there have been approximately ten times more genome-wide association
    studies (GWASs) performed on individuals of European ancestry than other groups
    (Need and Goldstein 2009). The current model also fails to exploit the wealth
    of molecular data that are likely to be generated routinely in the future as personalized
    genomics and perhaps other personalized “omics” become routine in clinical settings.
    Perhaps most seriously, the current discovery model offers no path toward economically
    sustainable integration of data-intensive biology with medicine.


    The Committee views it as both desirable and ultimately inevitable that this discovery
    model be fundamentally transformed. Instead of moving clinical data and patient
    samples to research groups to allow analysis, the molecular data of patients should
    instead be directly available to researchers and healthcare providers. The Committee
    recognizes that this is a radical departure from current practice and one that
    faces significant challenges, nonetheless, because we believe this new discovery
    model would have dramatic benefits, we believe that aggressive steps should be
    taken to implement it.


    The changes in science, information technology, medicine and social attitudes—as
    discussed in [Chapter 2](../Text/chapter02.xhtml)—provides the opportunity to
    implement this model. Indeed, there are concrete instances of research initiatives
    already underway that substantiate the Committee’s belief that a special effort
    to implement its core recommendations can be achieved. In addition to the eMERGE
    Consortium discussed in [Chapter 2](../Text/chapter02.xhtml), an excellent example
    is a collaboration between Kaiser-Permanente Northern California and the University
    of California at San Francisco (UCSF). Kaiser members were asked to participate
    in a study that would allow genetic and other molecular data to be compared with
    their full electronic health records. The study has faced major hurdles, and required
    more than ten years to progress from its conceptualization to large-scale acquisition
    of genetic data. A pivotal challenge was to build trust between Kaiser’s members,
    management, and oversight groups such as the relevant Institutional Review Boards.
    While all parties recognized it was essential that the Kaiser members who were
    being asked to “opt in” to the research study be fully aware of its aims, the
    outreach infrastructure required to educate members had to be created nearly from
    scratch. A second major challenge was acquiring funding to cover the cost of generating
    extensive molecular data that lacked direct and immediate relevance to patient
    care—a responsibility that Kaiser itself could not be expected to take on given
    the pressure to constrain health-care costs. Moreover, changing perceptions about
    what constitutes appropriate informed consent required costly and time-consuming
    reconsenting of the participants. Nonetheless, the ability of committed investigators—working
    within strongly supportive institutions—to overcome these obstacles has been impressive:
    nearly 200,000 Kaiser members have joined the study and large-scale data collection
    is now underway.


    The pioneering UCSF-Kaiser study makes clear that a discovery model based on direct
    use of patient data is possible, even as its implementation faces significant
    hurdles. In order to address and resolve these hurdles, the Committee envisions
    the design of several targeted pilot studies. These studies would probe key aspects
    of this new research paradigm and demonstrate to healthcare providers the value
    of a molecularly informed taxonomy of disease. By demonstrating value for patients,
    the pilot studies will seek to lay the groundwork for a sustainable discovery
    model in which relevant clinically validated molecular data are routinely generated
    at the “point of care” because they meet the commonly accepted risk-benefit criteria
    that apply to all clinical test results.


    [PILOT STUDIES SHOULD DRAW UPON OBSERVATIONAL STUDIES](../Text/contents.xhtml#a33)


    As emphasized above, the Committee believes that much of the initial work necessary
    to develop the Information Commons should take the form of observational studies.
    In this context, what we mean by observational studies is that, although molecular
    and other patient-specific data would be collected from individuals in the normal
    course of health care, no changes in the treatment of the individuals would be
    contingent on the data collected. This approach to discovery is already in use
    today, although most current initiatives draw in a very limited range of clinical
    data. Notably, many GWASs have compared the genetic make-ups of individuals who
    receive a diagnosis of a disease to those who do not (McCarthy et al. 2008). For
    example, GWASs comparing individuals with and without a diagnosis of Crohn’s disease
    securely identified a number of gene variants that implicate autophagy in the
    pathophysiology of Crohn’s disease while similar comparisons for Age-Related Macular
    Degeneration implicated complement factor H (McCarthy et al. 2008; Ryu et al.
    2010). In other instances, clinically relevant genotype-phenotype correlations
    have been discovered in the course of observational studies performed during randomized
    clinical trials. For example, a randomized clinical trial was performed to compare
    the efficacy of different formulations of interferon alpha in the treatment of
    chronic infection with hepatitis C. A subsequent observational study used a GWAS
    to identify variation near the IL28B gene as strongly correlated with response
    to treatment (Ge et al. 2009). Tests for the genetic variants identified in this
    study are already in widespread clinical use (PRNewswire 2011; Scripps Health
    2011).


    The enrollment of individuals in these studies had no bearing on their diagnoses,
    treatments, or in most cases, anything else in their lives. The goal of these
    observational studies was simply to ask the question “Are there gene variants
    in the general population that are associated with who ends up with a particular
    diagnosis or experiences a particular treatment response?”'
