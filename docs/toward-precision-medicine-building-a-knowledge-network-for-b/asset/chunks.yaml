- raw: '**Isaac (Zak) S. Kohane** is Director of the Children’s Hospital Informatics
    Program and is the Henderson Professor of Pediatrics and Health Sciences and Technology
    at Harvard Medical School (HMS). He is also Co-Director of the HMS Center for
    Biomedical Informatics and Director of the HMS Countway Library of Medicine. Dr.
    Kohane leads multiple collaborations at Harvard Medical School and its hospital
    affiliates in the use of genomics and computer science to study diseases (particularly
    cancer and autism). He has developed several computer systems to allow multiple
    hospital systems to be used as “living laboratories” to study the genetic basis
    of disease while preserving patient privacy. Among these, the i2b2 (Informatics
    for Integrating Biology and the Bedside) National Computing Center has been deployed
    at over 52 academic health centers internationally.


    Dr. Kohane has published over 180 papers in the medical literature and authored
    a widely used book on microarrays for integrative genomics. He has been elected
    to multiple honor societies including the American Society for Clinical Investigation,
    the American College of Medical Informatics, and the Institute of Medicine. He
    leads a doctoral program in genomics and bioinformatics at the Division of Health
    Sciences and Technology at Harvard and MIT. He is also a practicing pediatrics
    endocrinologist and father of three energetic children.


    **Manuel Llinás** is an Assistant Professor of Molecular Biology and a member
    of the Lewis-Sigler Institute for Integrative Genomics at Princeton University.
    Dr. Llinás earned a Ph.D. in molecular and cell biology from the University of
    California-Berkeley and did postdoctoral work in the lab of Joseph DeRisi at the
    University of California-San Francisco. He joined the Princeton faculty in 2005.
    Dr. Llinás’ laboratory studies the deadliest of the four human Plasmodium parasites,
    *Plasmodium falciparum.* His research combines tools from functional genomics,
    molecular biology, computational biology, biochemistry, and metabolomics to understand
    the fundamental molecular mechanisms underlying the development of this parasite.
    The focus is predominantly on the red blood cell stage of development, which is
    the stage in which all of the clinical manifestations of the malaria disease occur.
    His research has focused on two major areas: the role of transcriptional regulation
    in orchestrating parasite development, and an in-depth characterization of the
    malaria parasite’s unique metabolic network. On the transcription side, Dr. Llinás’
    lab works on the characterization of the first family of DNA binding proteins
    to be identified in the *P. falciparum* genome, the Apicomplexan AP2 (ApiAP2)
    proteins. The metabolomics work has begun to identify unique biochemical pathway
    architectures in the parasite including a novel branched TCA cycle. These two
    approaches explore relatively virgin areas in the malaria field with the goal
    of identifying novel strategies for therapeutic intervention.


    **Bernard Lo**, M.D., is Professor of Medicine and Director of the Program in
    Medical Ethics at UCSF. He is also National Program Director for the Greenwall
    Faculty Scholars Program in Bioethics, a career development award for bioethics
    researchers. He directs the Regulatory Knowledge Support Component of the NIH-funded
    Clinical and Translational Science Institute at UCSF and is Co-Director of the
    Policy and Ethics Core of the Center for AIDS Prevention Studies. He chairs the
    UCSF Stem Cell Research Oversight Committee. He is Co-Chair of the Standards Working
    Group of the California Institute of Regenerative Medicine, which recommends regulations
    for stem cell research funded by the state of California. He is a member of the
    Centers for Disease Control and Prevention (CDC) Ethics Subcommittee of the Advisory
    Committee to the Director. He serves on DSMBs for NIH-sponsored HIV vaccine trials,
    the Long-Term Oxygen Treatment Trial (LOTT), and on the Ethics Working Group of
    the HIV Prevention Trials Network. He also serves on the Board of Directors of
    the Association for the Accreditation of Human Research Protection Programs. He
    is a member of the Institute of Medicine (IOM), served on the IOM Council and
    as chair of the IOM Board on Health Sciences Policy. He chaired a 2009 IOM Committee
    on conflicts of interest in medicine and several earlier reports. Dr. Lo is author
    of *Resolving Ethical Dilemmas: A Guide for Clinicians* (4th ed., 2010) and of
    *Ethical Issues in Clinical Research* (2010).


    **Tom Misteli** is a Senior Investigator and Head of the Cell Biology of Genomes
    group at the National Cancer Institute, NIH. Dr. Misteli obtained his Ph.D. from
    the University of London, UK, and joined the NCI after postdoctoral work at the
    Cold Spring Harbor Laboratory, New York. He has pioneered the field of genome
    cell biology by developing live-cell microscopy approaches to study the nuclear
    organization of the genome and gene expression in intact cells, and his laboratory
    aims to apply this knowledge to the development of novel diagnostic and therapeutic
    strategies for cancer and aging. Dr. Misteli has received numerous awards for
    his work, and currently serves as Editor-in-Chief of the *Journal of Cell Biology*
    and of *Current Opinion in Cell Biology*.


    **Sean J. Morrison**, Ph.D., is the Director of the Children’s Research Institute
    and the Mary McDermott Cook Chair in Pediatric Genetics at the University of Texas
    Southwestern Medical Center as well as an Investigator of the Howard Hughes Medical
    Institute.


    The Morrison laboratory is investigating the mechanisms that regulate stem cell
    function in the nervous and hematopoietic systems and the ways in which these
    mechanisms are hijacked by cancer cells to enable neoplastic proliferation and
    metastasis. The Morrison laboratory is particularly interested in the mechanisms
    that regulate stem cell self-renewal, stem cell aging, and the role these mechanisms
    play in cancer. Parallel studies of these mechanisms in two tissues reveals the
    extent to which different types of stem cells and cancer cells depend upon similar
    mechanisms to regulate their function.


    The Morrison laboratory has discovered a number of critical mechanisms that distinguish
    stem cell self-renewal from the proliferation of restricted progenitors. They
    have shown that stem cell self-renewal is regulated by networks of proto-oncogenes
    and tumor suppressors and that the balance between protooncogenic and tumor suppressor
    signals changes with age. This likely explains why the mutation spectrum changes
    with age in cancer patients, as different mechanisms become competent to hyper-activate
    self-renewal pathways in patients at different ages. The Morrison laboratory has
    further shown that in some cancers many tumor cells are capable of driving disease
    growth and progression while other cancers are driven by minority subpopulations
    of cancer cells that adopt “stem cell” characteristics. These insights into the
    cellular and molecular mechanisms of self-renewal have suggested new approaches
    for promoting normal tissue regeneration and cancer treatment.'
