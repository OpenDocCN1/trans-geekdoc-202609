- raw: 'The example of a patient such as Patient 1 with breast cancer, described in
    the Introduction, illustrates the potential of a Knowledge Network of Disease
    to provide patients with valuable information even when there is no difference
    in treatment for different diseases subtypes (e.g., sporadic vs. *BRCA1/2*\-associated
    breast cancer). While mutations in the tumor-suppressor genes *BRCA1* and *BRCA2*
    strongly predispose women to breast and ovarian cancer, the extent to which particular
    germline mutations in these genes increase cancer risk often remains uncertain
    (Gayther et al. 1995). Consequently, patients and physicians must currently make
    decisions about whether to undertake more intensive cancer surveillance (for example,
    by breast magnetic resonance imaging or vaginal ultrasound) without being able
    clearly to assess the risks and benefits of such increased screening and the anxiety
    and potential morbidity that arises from inevitable false positives. Furthermore,
    some patients elect to undergo prophylactic mastectomies or oophorectomies without
    definitive information about the extent to which these drastic procedures actually
    would reduce their cancer risk.


    Studies attempting to quantify these risks have largely focused on particular
    ethnic groups in which a limited set of mutations occur at high enough frequencies
    to allow reliable conclusions from analyses carried out on a practical scale.
    If *BRCA1/2* genotypes and health histories could be compared across the large
    datasets currently segregated among different health-care organizations, it would
    become possible to assess accurately cancer risks for people with different mutations
    and genetic backgrounds. Such data would allow more rational recommendations regarding
    risk-reduction strategies, thereby creating enormous value for individual patients,
    health-care providers, and payers, by making it possible to avoid unnecessary
    screening and treatment while reducing cancer incidence and promoting early detection.


    ***Drug development.*** Molecular similarities among seemingly unrelated diseases
    would also be of direct relevance to drug discovery as it would lead to targeted
    investigation of disease-relevant pathways that are shared between molecularly
    related diseases. In addition, ongoing access to molecular profiles and health
    histories of large numbers of patients taking already-approved drugs would undoubtedly
    lead to improved drug safety by allowing identification of individuals at higher-than-normal
    risk of adverse drug reactions. Indeed, our limited understanding of—and lack
    of a robust system for studying—rare adverse reactions is a major barrier to the
    introduction of new drugs in our increasingly risk-aversive and litigious society.


    ***Health disparities***. Major disparities in the health profiles of different
    “racial”, ethnic, and socio-economic groups within our diverse society have proven
    discouragingly refractory to amelioration. As discussed above, it is quite likely
    that key contributors to these disparities can be most effectively addressed through
    public-health measures and other public policies that have little to do with the
    molecular basis of disease, at least as we presently understand it. However, the
    Committee regards the Information Commons and Knowledge Network of Disease, as
    potentially powerful tools for understanding and addressing health disparities
    because they would be informed by data on the environmental and social factors
    that influence the health of individual patients. For the first time, these resources
    would bring together, in the same place, molecular profiles, health histories,
    and data on the many determinants of health and disease, thereby optimizing the
    ability to decipher the mechanisms through which exogenous factors give rise to
    endogenous, biological inputs, directly affecting health. Researchers and policy
    makers would then be better able to sort out the full diversity of possible reasons
    for observed individual and group differences in health and to devise effective
    strategies to prevent and combat them.


    [A HIERARCHY OF LARGE DATASETS WOULD BE THE FOUNDATION OF THE KNOWLEDGE NETWORK
    OF DISEASE AND ITS PRACTICAL APPLICATIONS](../Text/contents.xhtml#a24)


    The establishment of a Knowledge Network, and its research and clinical applications,
    would depend on the availability of a hierarchy of large, well-integrated datasets
    describing what we know about human disease. These datasets would establish the
    foundation for the New Taxonomy and many other basic and applied activities throughout
    the health-care system. The Information Commons would contain the raw information
    about individual patients from which meaningful links and relationships could
    be derived. Recognizing that the Knowledge Network would need to be informed by
    vast amounts of information external to the network itself, the Committee envisions
    the need for substantial research in medical informatics directed at all steps
    of the creation and curation of the network, and, equally importantly, its use
    by individuals with diverse backgrounds and goals. The creation of the Knowledge
    Network and its underlying Information Commons would enable the continuous compilation
    and analysis of molecular, environmental, behavioral, social, and clinical data
    in a dynamic, shared platform. Such an information platform would need to be accessible
    by users across the entire spectrum of research and clinical care, including payers.
    Data would be continuously deposited by the research community and extracted directly
    from the medical records of participating patients. The roles of the different
    datasets in this information resource are schematized in [Figure 3-1](../Text/chapter03.xhtml#fig_3-1).


    The precise structures of both the Information Commons and Knowledge Network of
    Disease remain to be determined and would be informed by pilot studies, as discussed
    in [Chapter 4](../Text/chapter04.xhtml). However, given its purpose, the Committee
    envisions the Information Commons as (see also [Figure 1-2](../Text/chapter01.xhtml#fig_1-2))*:*


    ***Multilayered***. Given the inclusion of multiple parameters ranging from genomic
    to environmentally modulated disease factors, the Information Commons would likely
    have a multi-layered structure with each layer containing the information for
    one disease parameter, such as “signs and symptoms”, genetic mutations, epigenetic
    patterns, metabolic characteristics, or other risk factors (including social,
    behavioral, and environmental influences).


    ***Individual-centric***. The Information Commons should register all measurements
    with respect to individuals so that the multitude of influences on pathophysiological
    states can be viewed at scales that span all the way from the molecular to the
    social level. Only in this way could, for example, individual environmental exposures
    be matched to individual changes in molecular profiles. These data would need
    to be stored in an escrowed, encrypted depository that allows graded release of
    data depending on the questions asked, the access level of the individual making
    the inquiry, and other parameters that would undoubtedly emerge in the course
    of pilot studies. The Committee realizes that this is a radical approach and intense
    public education and outreach about the value of the Information Commons to the
    progress of medicine would be essential to harness informed volunteerism, the
    support of disease-specific advocacy groups, and the engagement of other stakeholders.
    The Committee regards careful handling of policies to ensure privacy as the central
    issue in its entire vision of the Information Commons, the Knowledge Network of
    Disease, and the New Taxonomy. Hence, this topic is discussed in more detail in
    [Chapter 4](../Text/chapter04.xhtml).'
