    # 第一章


    `../Text/chapter01.xhtml` 以两个具有说明性的临床案例作为开篇。尽管这些案例并非基于特定的患者，但它们反映了当前的医疗实践，也是每天成千上万造访美国诊所的真实患者的缩影。患者
    1 号——一位其他方面健康的乳腺癌女性——是近几十年来科学医学惊人进步的直接受益者。她的医生了解威胁她生命的病理过程的分子细节，并掌握了能够直接靶向患者 1
    号细胞中发生的异常分子事件的疗法。这些疗法的安全性和有效性已通过与患者 1 号在疾病分子细节上高度匹配的其他患者的随机临床试验得到了证实。她的预后非常好。随着科学医学的不断进步，患有此类乳腺癌的类似患者（我们开始理解其分子病理学）有望获得更安全、更有效、成本更低且副作用更少的治疗方法。


    患者 2 号的情况则是另一个故事。除了一个早已已的诊断和治疗方案外，现代医学几乎无法为他提供任何帮助。在经过 50 年的密集研究后，人类对糖尿病的科学理解取得了实质性进展。与许多在生命早期突然发糖尿病的儿童不同，我们知道患者
    2 号的体内循环胰岛素水平较高。他的医生最终可能会考虑尝试通过使用更多的胰岛素来控制他的糖尿病，但这个病例中的根本问题——以及数百万其他 2 型糖尿病患者的问题——是他的细胞对胰岛素的反应非常微弱。即使当细胞接收到摄取并代谢糖分的强烈信号时，血糖仍然保持异常高水平。高水平循环糖的隐性毒性影响威胁着患者
    2 号血管的健康。随着年龄增长，许多 2 型糖尿病患者遭受血管系统恶化的严重后果。当他们脚部的轻微伤口无法愈合时，他们往往面临截肢的风险。当视网膜毛细血管破裂时，许多人会失明。治疗方法几十变化变化，运动和饮食习惯的改变对某些患者的影响大于其他患者。患者
    2 号可能会面临医疗干预不断升级、健康下降和残障增加的未来。患者 2 号所面临的人类、社会和经济成本令人敬畏，且在老年人群中非常典型。


    ## 委员会的任务


    委员会被分配的任务是“探索基于分子生物学的‘新分类法’的可行性和需求，并制定一个潜在框架”。虽然“新”一词在委员会的任务中引发了热烈的讨论——对于新的疾病分类法是否会与现有分类法有巨大差异意见不一——但在一个更重要的问题上立即达成了共识：委员会的每个人都同意需要一种更好的分类法，而且我们拥有绝大机会。此外，委员会清楚地认识，开发和实施疾病网络具有独特潜力，其影响远超疾病分类，成为改变研究方式和患者治疗的催化剂。患者
    1 号很有可能克服她的致命疾病，并继续健康、富有活力的生活。这些前景直接取决于根据分子分析识别她所患癌症的具体类型并对其进行理性治疗的新能力。委员会认为，为患者
    2 号创造一个同样光明前景的最佳途径在于通过建立疾病网络及其相关的新分类法来实现对其疾病的精确理解。


    ## 策略方法


    委员会意识到其任务有两个关键点：首先，改进疾病分类法只是利用生物医学研究以获得更好健康结果这一挑战的一个方面（尽管这是一个非常重要的方面）；其次，生物医学研究界的任何单一活动流都无法独立完成这一有限目标。这两点表明，我们可以通过宽泛定义“新分类法”挑战来最好地应对我们的任务。许多结论和建议也可以适用于“转化研究”中的其他挑战，例如评估和完善现有治疗以及开发新疗法。然而，疾病分类与医学的所有进步密不可分，委员会认为，发起一项应对这一挑战的雄心勃勃的计划——特别是使所需研究的“发现模式”现代化——是一个极佳的起点。委员会认为，成功的关键在于建立跨越美国医学整个研究和患者护理活动领域的新关系。正如
    `../Text/chapter02.xhtml` 中讨论的那样，由于基础研究和转化研究、信息技术、药物开发、公众态度以及医疗服务系统的变革，委员会认为现在是面对疾病网络并从中推导出新分类法这一挑战的良机。


    '
