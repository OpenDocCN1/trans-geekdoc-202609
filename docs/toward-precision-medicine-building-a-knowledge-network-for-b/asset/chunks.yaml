  trans: '

    传统上，医生的办公室或诊所与学术研究实验室之间很少有直接联系。在这种环境下，以患者为导向的研究——特别是当涉及使用尖端科学技术和实验设计对患者或患者来源样本的研究时——需要在研究环境与临床环境之间进行大规模的分工。通常，研究人员利用非正式的转诊网络来与负责研究人员感兴趣疾病的医生建立联系。一旦加入研究项目，患者（或在某些情况下，仅是组织样本和少量临床信息）就会进入一个研究环境，该环境拥有自己的基础设施，包括机构审查委员会
    (`IRBs`)、患者协调员、临床评估中心、仪器设备、实验室设施和数据分析中心。这种方法产生的结果往往是描述性和轶事性的，对于更大（且更多元）的患者群体而言相关性不确定。此外，做出贡献的患者不太可能与研究过程保持联系，也不会知晓结果^(1)。这种研究模型并不适用于患者的长期随访，因为它从初就不是为此目的设计的。


    尽管这种传统的临床研究方法在测试明确假设的原始目标方面取得了巨大成功，但它并不适用于回答当前关于人类健康的问题，这些问题通常比过去通常解决的问题更具开放且范围更大。根据委员会的经验以及在研究过程中来自多个利益相关者的投入（包括为期两天的研讨会），委员会确定了当前研究设计与当前需求不匹配的几个原因。传统设计：


    - 需要非常大的样本量——因此大多数研究不可避免地效能不足。如上所述，基因型-表型相关性中固有的问题数量和复杂性几乎是无限的。具有特殊信息量基因型和表型的患者（往往难以预先识别或无法识别）通常是稀有的。只有通过在巨大的患者队列中结合分子和临床信息，才可能识别并招募足够的患者，以获取关于其疾病的临床可操作信息。

    - 涉及高昂成本，由于研究环境和临床环境基础设施之间冗余性的增加，这些成本在很大程度上是非必要的。执行大规模患者群体数据密集型分子研究所需的大部分内容已存在于医疗体系中，或者随着大型协调医疗机构吸收日益增长患者群体，未来将会存在：`EHRs`
    得到了更广泛的实施，医疗决策越来越多地受分子分析驱动（特别是在肿瘤学领域，但其他亚专科也日益如此），且治疗的知情标准在结果和分子研究方面趋于一致。

    - 鼓励建立封闭的而非开放的研究系统。将职业生涯致力于构建上述研究基础设施、培养医生网络以及应对 `IRB` 流程的研究人员，几乎没有动力广泛分享患者样本和数据。事实上，年轻研究人员为了渗透这一系统必须克服的一系列障碍是参与以患者为导向的研究的主要消极因素。此外，许多选择将工作集中在模型生物（如果蝇、线虫和老鼠）上的才华横溢的生物医学研究人员很少机会与临床研究人员分享见解或合作。

    - 让大多数研究人员和医生生活在分离的、很大程度上不联系的社区中。目前的生物医学培训系统从教育的最早期阶段就将研究人员和医生分开，创造了专业但有限的知识孤岛。当前生物医学系统的封闭性不利于跨学科合作，并对培训、研究设计、研究工作优先排序以及新研究发现的转化产生了重大的负面影响。

    - 不适用于患者的长期随访。进行第一代基因型-表型研究并不需要长期随访。所调查的问题通常是“所有的囊性纤维化患者是否有 `CFTR` 基因的功能缺失突变？”。因此，寻求建立基因型在特定表型中因果作用的研究人员只需要确认患者得到了正确的诊断。然而，诸如“具有特定基因型的囊性纤维化患者在几十年内接受特定治疗的效果是否更好？”等问题则长期随访。

    - 可能无法提供临床相关结果以整合到患者的临床护理中。在遗传生系变异和/或体细胞基因模式可预测预后或反应的范围内，结果对个体研究受者的临床反馈可能取决于复杂的因素，包括原始知情同意文件、重新联系受者的物流、科学结果的感知有效性（可能随时间变化）、样本采集与结果生成之间的时间，以及实验室工作是否在允许结果反馈的方案下进行。这些限制因素意味着大多数研究结果没有整合到临床护理中。对于“告知研究参与者临床相关结果的义务”，专家意见很大。事实上，许多研究人员不愿意向共同资源贡献数据，因为这可能会让他们暴露在关于对参与者提供反馈是否必要或理想的质疑中。


    由于这些以及许多其他原因，开发信息公社、疾病知识网络和新分类法项目需要长期视角。在某种意义上，这一挑战与欧洲伟大大教堂的建造具有相似之处——由一代开始的研究将由另一代完成，计划将随着新技术的开发和知识的演变随时间改变。随着医疗体系的成本日益被长寿老龄化人口的健康问题占据，可以想象持续
    5、10 年甚至 50 年的研究可以回答许多医生向研究人员寻求指导的关键问题。许多患者在 40、50 和 60 岁时就开始使用强效药物，并一直使用到终老。某些癌症治疗的成功将注意力从短期生存转向治疗的长期后遗症。由于所有这些原因，遗传研究人员只需要血液样本和可靠诊断的时代正在过去。


    结果研究还为医学与数据密集型生物学的紧密结合创造了新机会。医疗服务的成本限制——以及对传统医学智慧错误频率日益增加认识——导致了日益增长的结果研究企业，这种企业在几十年前几乎不存在。结果研究人员对大规模患者群体统一医疗记录的需求，与分子导向研究人员的需求非常相似。

    '
