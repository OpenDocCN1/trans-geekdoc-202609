    [THE PROPOSED KNOWLEDGE NETWORK OF DISEASE WOULD GO BEYOND DESCRIPTION](../Text/contents.xhtml#a23)


    A Knowledge Network of Disease would aspire to go far beyond disease description.
    It would seek to provide a unifying framework within which basic biology, clinical
    research, and patient care could co-evolve. The scope of the Knowledge Network’s
    influence would encompass:


    ### Disease classification

    The use of multiple molecular-based parameters to characterize disease may lead
    to more accurate and finer-grained classification of disease (see [Box 3-2](../Text/chapter03.xhtml#box_3-2)).
    Disease classification is not merely an academic exercise: more nuanced diagnostic
    accuracy and ability to recognize disease subtypes would undoubtedly have important
    therapeutic consequences, allowing treatment regimes to be customized based on
    the precise molecular features of a patient’s disease.


    ### Disease-mechanism discovery

    A Knowledge Network in which diseases are increasingly understood and defined
    in terms of molecular pathways has the potential to accelerate discovery of underlying
    disease mechanisms. In a molecularly-based Knowledge Network, a researcher could
    readily compare the molecular fingerprint (such as one defined by the transcriptome
    or proteome) of a disease with an unknown pathogenic mechanism to the information
    available for better understood diseases. Similarities between the molecular profiles
    of diseases with known and unknown pathogenic mechanisms might point directly
    to shared disease mechanisms, or at least serve as a starting point for directed
    molecular interrogation of cellular pathways likely to be involved in the pathogenesis
    of both diseases.


    **Box 3-2 Distinguishing Disease Types**](../Text/contents.xhtml#bo_3-2)


    Recent progress in the classification of lymphomas illustrates how a Knowledge
    Network could help distinguish diseases or disease states with similar symptoms
    and clinical presentations. Gene-expression profiling led to the discovery that
    B-cell lymphomas comprise two distinct subtypes of disease with different driver
    mutations and different prognoses (Alizadeh et al. 2000; Sweetenham 2011). One
    subtype bears a gene-expression profile similar to germinal center B-cells and
    has a good prognosis, while a second subtype bears a gene-expression profile similar
    to activated B-cells and has a poor prognosis. Recognition of these biological
    and clinical differences between subtypes of B-cell lymphomas makes it possible
    to predict patient prognosis more accurately and guide treatment decisions.


    Similarly, leukemias are also now categorized based on differences in driver mutations,
    revealing subtypes with different prognoses and responses to particular treatment
    approaches. Acute myeloid leukemias with `FLT3/ITD` mutations have a poorer prognosis
    than acute myeloid leukemias with a normal `FLT3` gene (Kiyoi et al. 1999; Kottaridis
    et al. 2001). As a consequence, patients bearing `FLT3/ITD` mutations are more
    likely to receive allogenic bone-marrow transplants or be offered experimental
    therapy with `FTLs` kinase inhibitors, while patients who do not have `FLT3/ITD`
    mutations are more likely to be treated only with chemotherapy. These are two
    of many known examples in which molecular data have been used to distinguish subtypes
    of malignancies with different prognoses and that benefit from different treatments.
    The proposed Knowledge Network of Disease could be expected to lead to many more
    insights of this type. By allowing any researcher to carry out analyses of this
    type on large numbers of patients, tracked over long periods of time, it is likely
    that insights such as the clinical relevance of `FLT3` mutations in leukemia could
    be achieved for many other cancers and in situations where tumor behavior depends
    on a more complex interplay of influences.


    ### Disease detection and diagnosis

    A Knowledge Network that integrates data from many levels of disease collected
    from individual subjects over time may reveal new opportunities for detection
    and early diagnosis by identifying correlations among diverse datasets (including
    clinical, social, economic, environmental, and lifestyle factors) and disease
    incidence, treatment decisions, outcomes. In some instances, these advances would
    follow from new insights into pathogenic mechanisms discussed above. The most
    robust early-detection tests—for example, assessment of an asymptomatic patient’s
    HIV status—are based on a clear understanding of pathogenic mechanism. In other
    cases, however, molecular profiles may prove sufficiently predictive of a patient’s
    health long before the mechanistic rationale is understood.


    ### Disease predisposition

    A Knowledge Network of Disease that links information from many levels of disease,
    from genetic to environment, will improve our ability to predict and survey for
    diseases. Following outcomes in individual patients over time will allow the prognostic
    value of molecular-based classifications to be tested and, ideally, verified.
    Multi-parameter data across the entire spectrum of disease will become available.
    Obviously, the clinical utility of identifying disease predispositions depends
    on the availability of interventions that would either prevent or delay onset
    of disease or perhaps ameliorate disease severity.


    ### Disease treatment

    The ultimate goal of most clinical research is to improve disease treatments and
    health outcomes. There are many ways in which a Knowledge Network of Disease and
    its derived taxonomy may be expected to impact disease treatment and to contribute
    to improved health outcomes for patients. Accurate diagnosis is the foundation
    of all medical interventions. As many of the examples already discussed illustrate,
    finer-grained diagnoses often are the key to choosing optimal treatments. In some
    instances, a molecularly informed disease classification offers improved options
    for disease prevention or management even when different disease subtypes are
    treated identically (see [Box 3-3](../Text/chapter03.xhtml#box_3-3)). A Knowledge
    Network that integrates data from multiple levels of disease determinants will
    also facilitate the development of new therapies by identifying new therapeutic
    targets and may suggest off-label use of existing drugs. In other cases, the identification
    of links between environmental factors or lifestyle choices and disease incidence
    may make it possible to reduce disease incidence by lifestyle interventions.


    Importantly, as discussed below, the Committee believes the Knowledge Network
    and its underlying Information Commons would enable the discovery of improved
    treatments by providing a powerful new research resource that would bring together
    researchers with diverse skills and integrate knowledge about disease processes
    in an unprecedented way. Indeed, it is quite possible that the transition to a
    modernized “discovery model” in which disease data generated during the course
    of normal health care and analyzed by a diverse set of researchers would ultimately
    prove to be a Knowledge Network of Disease’s greatest legacy for biomedical research.


    **Box 3-3 Information to Guide Treatment Decisions**](../Text/contents.xhtml#bo_3-3)

    '
