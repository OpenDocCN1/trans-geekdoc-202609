- raw: "The Committee envisions this ambitious program, which would play out on a\
    \ time scale of decades rather than years, as proceeding through a blend of top-down\
    \ and bottom-up activity. A major top-down component, initiated by public and\
    \ private agencies that fund and regulate biomedical research, would be required\
    \ to ensure that results of individual projects could be combined to create a\
    \ broadly useful and accessible Information Commons and to establish guidelines\
    \ for handling the innumerable social, ethical, and legal issues that will arise\
    \ as data on individual patients become widely shared research resources. However,\
    \ as is appropriate for a framework study, the Committee did not attempt to design\
    \ the Information Commons, the Knowledge Network, or the New Taxonomy itself and\
    \ would discourage funding agencies from over-specifying these entities in advance\
    \ of initial efforts to create them. What is needed, in the Committee’s view,\
    \ is a creative period of bottom-up research activity, organized through pilot\
    \ projects of increasing scope and scale, from which the Committee is confident\
    \ best practices would emerge. Particularly given the size and diversity of the\
    \ health-care enterprise, no one approach to gathering the data that will populate\
    \ the Information Commons is likely to be appropriate for all contributors. As\
    \ in any initiative of this complexity, what will be needed is the right level\
    \ of coordination and encouragement of the many players who will need to cooperate\
    \ to create the Information Commons and Knowledge Network and thereby develop\
    \ a New Taxonomy. If coordination is too rigid, much-needed innovation and adaptation\
    \ to local circumstances will be stifled, while if it is too lax, it will be impossible\
    \ to integrate the data that are gathered into a whole whose value greatly exceeds\
    \ that of the sum of its parts, an objective the Committee believes is achievable\
    \ with effective central leadership.\n\n![images/p2.jpg](Images/p2.jpg)\n\n[**FIGURE\
    \ S-1** Creation of a New Taxonomy first requires an “Information Commons” in\
    \ which data on large populations of patients become broadly available for research\
    \ use and a “Knowledge Network” that adds value to these data by highlighting\
    \ their inter-connectedness and integrating them with evolving knowledge of fundamental\
    \ biological processes](../Text/contents.xhtml#fi_S-1).  \n\nSOURCE: Committee\
    \ on A Framework for Developing a New Taxonomy of Disease.\n\nCONCLUSIONS\n\n\
    The Committee hosted a two-day workshop that convened diverse experts in both\
    \ basic and clinical disease biology to address the feasibility, need, scope,\
    \ impact, and consequences of creating a “New Taxonomy of human diseases based\
    \ on molecular biology”. The information and opinions conveyed at the workshop\
    \ informed and influenced an intensive series of Committee deliberations (in person\
    \ and by teleconference) over a six-month period, which led to the following conclusions:\
    \  \n\n1\\. **A New Taxonomy will lead to better health care.** Because new information\
    \ and concepts from biomedical research cannot be optimally incorporated into\
    \ the disease taxonomy of today, opportunities to define diseases more precisely\
    \ and to inform health-care decisions are being missed. Many disease subtypes\
    \ with distinct molecular causes are still classified as one disease and, conversely,\
    \ multiple different diseases share a common molecular cause. The failure to incorporate\
    \ optimally new biological insights results in delayed adoption of new practice\
    \ guidelines and wasteful health-care expenditures for treatments that are only\
    \ effective in specific subgroups.\n\n2\\. **The time is right to modernize disease\
    \ taxonomy.** Dramatic advances in molecular biology have enabled rapid, comprehensive\
    \ and cost-efficient analysis of clinical samples, resulting in an explosion of\
    \ disease-relevant data with the potential to dramatically alter disease classification.\
    \ Fundamental discovery research is defining at the molecular level the processes\
    \ that define and drive physiology. These developments, coupled with parallel\
    \ advances in information technologies and electronic medical records, provide\
    \ a transformative opportunity to create a new system to classify disease.\n\n\
    3\\. **A New Taxonomy should be developed.** A New Taxonomy that integrates multi-parameter\
    \ molecular data with clinical data, environmental data, and health outcomes in\
    \ a dynamic, iterative fashion, is feasible and should be developed. The Committee\
    \ envisions a comprehensive disease taxonomy that brings the biomedical-research,\
    \ public health, and health-care-delivery communities together around the related\
    \ goals of advancing our understanding of disease pathogenesis and improving health.\
    \ Such a New Taxonomy would\n\n• Describe and define diseases based on their intrinsic\
    \ biology in addition to traditional physical “signs and symptoms.”\n\n• Go beyond\
    \ description and be directly linked to a deeper understanding of disease mechanisms,\
    \ pathogenesis, and treatments.\n\n• Be highly dynamic, at least when used as\
    \ a research tool, continuously incorporating newly emerging disease information.\n\
    \n4\\. **A Knowledge Network of Disease would Enable a New Taxonomy.** The informational\
    \ infrastructure required to create a New Taxonomy with the characteristics described\
    \ above overlaps with that required to modernize many other facets of biomedical\
    \ research and patient care. This infrastructure requires an “Information Commons”\
    \ in which data on large populations of patients become broadly available for\
    \ research use and a “Knowledge Network” that adds value to these data by highlighting\
    \ their inter-connectedness and integrating them with evolving knowledge of fundamental\
    \ biological processes.\n\n5\\. **New models for population-based research will\
    \ enable development of the Knowledge Network and New Taxonomy.** Current population-based\
    \ studies of disease are relatively inefficient and can generate conclusions that\
    \ are not relevant to broader populations. Widespread incorporation of electronic\
    \ medical records into the health-care system will make it possible to conduct\
    \ such research at “point-of-care” in conjunction with the routine delivery of\
    \ medical services. Moreover, only if the linked phenotypic data is acquired in\
    \ the ordinary course of clinical care is it likely to be economically feasible\
    \ to characterize a sufficient number of patients and ultimately to create a self-sustaining\
    \ system (i.e., one in which the costs of gathering molecular data on individual\
    \ patients can be medically justified in cost-benefit terms).\n\n6\\. **Redirection\
    \ of resources could facilitate development of the Knowledge Network of Disease.**\
    \ The initiative to develop a New Taxonomy—and its underlying Information Commons\
    \ and Knowledge Network—is a needed modernization of current approaches to integrating\
    \ molecular, environmental, and phenotypic data, not an “add-on” to existing research\
    \ programs. Enormous efforts are already underway to achieve many of the goals\
    \ of this report. In the Committee’s view, what is missing is a system-wide emphasis\
    \ on shifting the large-scale acquisition of molecular data to point-of-care settings\
    \ and the coordination required to ensure that the products of the research will\
    \ coalesce into an Information Commons and Knowledge Network from which a New\
    \ Taxonomy (and many other benefits) can be derived. In view of this conclusion,\
    \ the Committee makes no recommendations about the resource requirements of the\
    \ New Taxonomy initiative. Obviously, the process could be accelerated with new\
    \ resources; however, the basic thrust of the Committee’s recommendations could\
    \ be pursued by redirection of resources already dedicated to increasing the medical\
    \ utility of large-scale molecular datasets on individual patients.\n\nRECOMMENDATIONS\n\
    \nTo create a New Taxonomy and its underlying Information Commons and Knowledge\
    \ Network, the Committee recommends the following:"
  fmt: "\nThe Committee envisions this ambitious program, which would play out on\
    \ a time scale of decades rather than years, as proceeding through a blend of\
    \ top-down and bottom-up activity. A major top-down component, initiated by public\
    \ and private agencies that fund and regulate biomedical research, would be required\
    \ to ensure that results of individual projects could be combined to create a\
    \ broadly useful and accessible `Information Commons` and to establish guidelines\
    \ for handling the innumerable social, ethical, and legal issues that will arise\
    \ as data on individual patients become widely shared research resources. However,\
    \ as is appropriate for a framework study, the Committee did not attempt to design\
    \ the `Information Commons`, the `Knowledge Network`, or the `New Taxonomy` itself\
    \ and would discourage funding agencies from over-specifying these entities in\
    \ advance of initial efforts to create them. What is needed, in the Committee’s\
    \ view, is a creative period of bottom-up research activity, organized through\
    \ pilot projects of increasing scope and scale, from which the Committee is confident\
    \ best practices would emerge. Particularly given the size and diversity of the\
    \ health-care enterprise, no one approach to gathering the data that will populate\
    \ the `Information Commons` is likely to be appropriate for all contributors.\
    \ As in any initiative of this complexity, what will be needed is the right level\
    \ of coordination and encouragement of the many players who will need to cooperate\
    \ to create the `Information Commons` and `Knowledge Network` and thereby develop\
    \ a `New Taxonomy`. If coordination is too rigid, much-needed innovation and adaptation\
    \ to local circumstances will be stifled, while if it is too lax, it will be impossible\
    \ to integrate the data that are gathered into a whole whose value greatly exceeds\
    \ that of the sum of its parts, an objective the Committee believes is achievable\
    \ with effective central leadership.\n\n![images/p2.jpg](Images/p2.jpg)\n\n**FIGURE\
