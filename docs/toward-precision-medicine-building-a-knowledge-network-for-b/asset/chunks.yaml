- raw: "These treatment decisions do not need to be made based on such fragmentary\
    \ information. If all patients who test positive for *BRCA1* or *BRCA2* mutations\
    \ were tracked by their health-care providers long term, it would be possible\
    \ to determine what percentage of patients with each mutation develop cancer,\
    \ and which cancers. It would be possible to assess the extent to which prophylactic\
    \ surgeries reduced risk. It would be possible to assess the effectiveness of\
    \ increased cancer screening, the best ways to screen these patients, and the\
    \ complications that arise from the inevitable false-positive results that come\
    \ from increased screening. Efforts along these lines have so far been based on\
    \ modest numbers of patients or cohorts that are not fully representative of the\
    \ larger population because it has not been practical to integrate genetic information,\
    \ treatment decisions, and outcomes data for large numbers of unselected patients.\
    \ However, recent advances in genomic and information technologies now make it\
    \ possible to address systematically these issues by integrating large datasets\
    \ that already exist (see [Box 2-2](../Text/chapter02.xhtml#box_2-2)).\n\n*BRCA1*\
    \ and *BRCA2* are only two of many genes in which differences between individuals\
    \ have significant implications for disease risk and treatment decisions. We have\
    \ approximately 20,000 genes in our genome and many of these genes may have many\
    \ disease-relevant alleles, just like *BRCA1*. Even if only a subset of this variation\
    \ has significant implications for disease risk or treatment response we have\
    \ the potential to improve the detection, diagnosis, and treatment of disease\
    \ dramatically by large-scale efforts to assess phenotype-genotype correlations.\
    \ By integrating patient genotype with health information and outcomes data a\
    \ New Taxonomy could identify many new genetic variants with significant implications\
    \ for health care.\n\nThere is every reason to expect that the genetic influences\
    \ on most common diseases will be complex. In each patient, variants in multiple\
    \ genes will affect disease onset, progression, and response to treatment, and\
    \ long-term environmental modulation of these processes will be the rule rather\
    \ than the exception. While recent breakthroughs have focused on genomics as a\
    \ consequence of the rapid development of technology in that area, the future\
    \ may see comparable advances in our ability to understand epigenetic, environmental,\
    \ microbial, and social contributions to disease risk and progression. Under these\
    \ circumstances, there is an obvious need to categorize diseases with finer granularity,\
    \ greater reference to the underlying biology, and in the context of a dynamic\
    \ Knowledge Network that has the capacity to integrate the new information on\
    \ many levels. Unraveling these diverse influences on human diseases will be a\
    \ major scientific challenge of the 21st century.\n\n[DRAMATIC ADVANCES IN INFORMATION\
    \ TECHNOLOGY ARE DRIVING SYSTEMIC CHANGE](../Text/contents.xhtml#a13)\n\nThe United\
    \ States and other countries are currently making multibilliondollar investments\
    \ to implement electronic health records (EHRs) to improve clinical care. The\
    \ development of such records creates several new opportunities to integrate health-care\
    \ information and biological data and to search for new links between clinical\
    \ test results, patient data, and outcomes.\n\n*   The increased functionality\
    \ of EHRs and the improved performance of search tools open the door to conduct\
    \ large cohort studies on a wide range of diseases. Patients with characteristics\
    \ of interest—for example, those with rheumatoid arthritis or lacking response\
    \ to antidepressants—could be selected via EHRs. Patients in these groups could\
    \ then be recruited to provide samples or have their discarded clinical samples\
    \ analyzed for research.\n\n*   EHRs could be used to provide additional clinical\
    \ characterization or to help fill in missing details on subjects studied in a\
    \ cohort or biobank. In either case, the result would be a rich clinical characterization\
    \ of patients at low cost and with linkages to corresponding biological samples\
    \ that can be used for molecular studies. Research questions could be addressed\
    \ faster and at lower cost as compared to the current standard practice of designing\
    \ large, labor-intensive prospective studies.\n\n*   EHRs permit longitudinal\
    \ analyses of data from millions of people. When linked with genomic information—yielding\
    \ what has been called EHR genomic research—EHRs could provide the large numbers\
    \ of subjects and detailed information needed to resolve many of the questions\
    \ that smaller cohorts cannot address.\n\n[**Box 2-2  \n\nProspective Cohort Studies—A\
    \ Special Role**](../Text/contents.xhtml#bo_2-2)\n\nMuch of our knowledge about\
    \ “risk factors” that predispose to complex diseases comes from observational\
    \ epidemiological studies, either case-control studies in which aspects of the\
    \ life experience of a series of cases are compared with those of appropriate\
    \ controls, or prospective cohort studies in which large numbers of people are\
    \ followed over time and the life experience of those who develop a specific disease\
    \ are compared with those of the much larger number who have not.\n\nFor example,\
    \ much of what is known about the predictive value of biochemical factors that\
    \ are measured in plasma or serum, such as the relation of cholesterol or other\
    \ lipid with risk of heart attack, is derived from prospective cohort studies\
    \ such as the Framingham Heart Study (FHS). Prospective studies are particularly\
    \ valuable because the occurrence or treatment of disease may alter the levels\
    \ of the biochemical factors so that inference based on levels measured in a series\
    \ of already diagnosed cases may be biased. These biomarkers can be combined with\
    \ information on lifestyle risk factors such as smoking and body mass index, and\
    \ measurements that may also change after diagnosis such as blood pressure, to\
    \ create a risk score such as the Framingham Risk Score, that is widely used to\
    \ predict the 10-year risk of heart attack (Anderson et al. 1991). The Risk Score\
    \ was based on data from slightly more than 5,500 subjects, among whom several\
    \ hundred coronary heart disease (CHD) events occurred. A study of this size is\
    \ adequate for relatively common disease events such as CHD, or quantitative traits\
    \ such as blood pressure or bone density for which every participant has a value,\
    \ but too small to provide enough cases of less common diseases such as site-specific\
    \ cancers. Larger prospective cohort studies such as the Nurses’ Health Study\
    \ (Missmer et al. 2004), and the European Prospective Investigation into Cancer\
    \ (EPIC) (Kaaks et al. 2005), have explored the relationship between circulating\
    \ steroid hormone levels and risk of breast cancer in cohorts of tens of thousands\
    \ of women, with many hundreds of cases, but the number of cases occurring in\
    \ the FHS is still relatively small due to the smaller size of the cohort. For\
    \ risk factors with small effects, or to study the interactions between multiple\
    \ risk factors, even the largest cohort studies may have too few cases to generate\
    \ statistical power, and consortia such as the NCI Breast & Prostate Cohort Consortium\
    \ (Campa et al. 2005) are needed to generate the thousands of cases necessary\
    \ for adequate power. For less common diseases, consortia are again needed as\
    \ no single study will have enough cases.\n\nSome countries have established very\
    \ large prospective cohort studies such as the UK Biobank (about 500,000 persons)\
    \ (Palmer 2007), and some have advocated for a similar study in the United States\
    \ (Collins 2004). However, the cost of enrolling half a million or more persons\
    \ in a such a research study in the US, tracking them over decades, and obtaining\
    \ information on medical diagnoses for a research database are estimated to be\
    \ several billion dollars (Willett et al. 2007), even if the many feasibility\
    \ issues can be overcome."
