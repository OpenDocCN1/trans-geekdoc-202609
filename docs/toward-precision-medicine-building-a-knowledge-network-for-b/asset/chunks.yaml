  trans: '

    虽然观察性研究将是开发关于患者分组的新型且临床实用方法假设的主要工具，但此类研究得出的结果需要通过其他方法进行确认和调查。例如，根据分子数据对患者进行分类的方法可能有很多，但只有部分具有临床实用价值。通常情况下，临床实用性需要通过随机临床试验来评估。


    观察性研究之后还需要进行功能性研究，以确定观察到的分子关联与临床结果之间的机制基础。这种结合发现路径的一个示例是确定 `BCL11` 是镰刀细胞贫血症程度的修饰因子。该基因最初在
    `GWAS` 研究中被认为涉及这一作用，其关联的生物学基础通过重点分析迅速确定，证实了 `BCL11A` 作为胎血红蛋白的抑制因子发挥作用。正是 `BCL11`
    位点具有特定变异的患者中，胎血红蛋白在成年期持续存在，缓解了镰刀细胞贫变的症状（Sankaran *et al.* 2008）。我们预计，此类实验室研究将有助于阐明分子数据与临床结果之间观察到的关联的底层原因，且这些机制见解将在建立知识网络和指导其使用方面发挥关键作用。


    ### 委员会设想的试点研究应能够：


    1. 具有足够的规模以及科学和组织复杂性，以便根据实际经验揭示开发床旁发现工作方面面临的最重大障碍。

    2. 解决一个或多个未满足的医疗需求，对疾病进行更深层次的生物学理解可能会导致治疗范式和健康结果的近期变化。

    3. 包括生成和分析多种分子数据类型，可能包括但不限于基因组数据（序列和表达）、代谢组学数据、蛋白质组数据和/或微生物组数据。

    4. 由一个负责提供医疗保健并与研究人员建立强大合作伙伴关系的组织领导。

    5. 获得资金的支持以建立一个“原理证明”。

    6. 涉及与广泛利益相关者（包括公共和私人）的合作，包括医疗提供者、患者、支付方以及在基因组学、流行病学、社会科学和分子生物学方面拥有知识的科学家。

    7. 寻求消除数据共享障碍，并为保护和尊重个人权利提供伦理和法律框架。

    8. 开发足够规模的 IT 网络，以便对整合数据集进行组装分析和共享。

    9. 利用实验室研究来评估分子数据与临床结果之间关联的生物学基础。

    10. 为临床、基于证据的决策建立验证标准。


    以下，我们概述了两个试点研究的示例；第一个“百万美国基因组计划”被选中用于试点一种“准备就绪”的组学（‘omic）信息关键层的使用。该试点项目将有助于向信息共享地（Information
    Commons）填充相关数据，并促进学习如何与其他层建立联系。通过关注处于不同健康和疾病状态的医疗服务接收者，该项目还将通过允许在种系序列与广泛表型之间建立关联，有助于评估这种新的发现范式。第二个“2
    型糖尿病的代谢组学谱”是针对特定疾病，旨在确保将另一种组学层（代谢组学）尽早引入信息共享地，并对新发现范式中更具针对性的问题进行试点评估。


    ### 试点研究示例 1：百万美国基因组计划


    一百万个基因组的测序将涵盖足够范围的不同健康结果的个体，并具有足够的统计效力来检测关联。例如，莫西林林克拉维酸是一种广泛使用的抗生素，在每 15,000 次暴露中会导致
    1 例严重的肝损伤。在一百万名患者的样本中，我们预计将包含许多具有此类（以及同样罕见的）药物反应和其他医疗状况的个体。此外，样本量足够大以构建一个没有特定诊断的个体中基因变异分布的具体画像也是至关重要的。


    ### 试点研究示例 2：2 型糖尿病的代谢组学谱


    最近对随后发生 2 型糖尿病的个体血液样本进行的代谢组学谱分析显示，血液中采样的支链氨基酸特征存在显著差异（Wang *et al.* 2011）。这些早期分析表明，代谢组学分析有助于识别患糖尿病风险最高的人群，特别是可能有助于阐明从胰岛素抵抗前期糖尿病向完全糖尿病转变过程中的生理步骤。因此，我们设想了一个专注于利用血液代谢组学谱理解这一转变的试点项目。这项工作将从目标定量代谢组学研究开始，随着时间的推移转向更全面的代谢组学谱。

