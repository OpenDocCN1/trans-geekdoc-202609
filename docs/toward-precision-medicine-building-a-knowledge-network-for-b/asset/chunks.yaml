- raw: '1.  **Conduct pilot studies that begin to populate the Information Commons
    with data.** Pilot observational studies should be conducted in the health-care
    setting to assess the feasibility of integrating molecular parameters with medical
    histories and health outcomes in the ordinary course of clinical care. These studies
    would address the practical and ethical challenges involved in creating, linking,
    and making broadly accessible the datasets that would underlie the New Taxonomy.
    Best practices defined by the pilot studies should then be expanded in scope and
    scale to produce an Information Commons and Knowledge Network that are adequately
    powered to support a New Taxonomy. As this process evolves, there should be ongoing
    assessment of the extent to which these new informational resources actually contribute
    to improved health outcomes and to more cost-effective delivery of health care.


    2.  **Integrate Data to Construct a Disease Knowledge Network.** As data from
    point-of-care pilot studies, linked to individual patients, begin to populate
    the Information Commons, substantial effort should go into integrating these data
    with the results of basic biomedical research in order to create a dynamic, interactive
    Knowledge Network. This network, and the Information Commons itself, should leverage
    state-of-the-art information technology to provide multiple views of the data,
    as appropriate to the varying needs of different users (e.g., basic researchers,
    clinicians, outcomes researchers, payers).


    3.  **Initiate a process within an appropriate federal agency to assess the privacy
    issues associated with the research required to create the Information Commons.**
    Because these issues have been studied extensively, this process need not start
    from scratch. However, in practical terms, investigators who wish to participate
    in the pilot studies discussed above—and the Institutional Review Boards who must
    approve their human-subjects protocols—will need specific guidance on the range
    of informed-consent processes appropriate for these projects. Subject to the constraints
    of current law and prevailing ethical standards, the Committee encourages as much
    flexibility as possible in the guidance provided. As much as possible, on-the-ground
    experience in pilot projects carried out in diverse health-care settings, rather
    than top-down dictates, should govern the emergence of best practices in this
    sensitive area, whose handling will have a make-or-break influence on the entire
    Information Commons/Knowledge Network/New Taxonomy initiative. Inclusion in these
    deliberations of health-care providers, payers, and other stakeholders outside
    the academic community will be essential.


    4.  **Ensure data sharing.** Widespread data sharing is critical to the success
    of each stage of the process by which the Committee envisions creating a New Taxonomy.
    Most fundamentally, the molecular and phenotypic data on individual patients that
    populate the Information Commons must be broadly accessible so that a wide diversity
    of researchers can mine them for specific purposes and explore alternate ways
    of deriving Knowledge Networks and disease taxonomies from them. Current standards
    developed and adopted by federally sponsored genome projects have addressed some
    of these issues, but substantial barriers, particularly to the sharing of phenotypic
    and health-outcomes data on individual patients, remain. Data-sharing standards
    should be created that respect individual privacy concerns while enhancing the
    deposition of data into the Information Commons. Importantly, these standards
    should provide incentives that motivate data sharing over the establishment of
    proprietary databases for commercial intent. Resolving these impediments may require
    legislation and perhaps evolution in the public’s expectations with regard to
    access and privacy of health-care data.


    5.  **Develop an efficient validation process to incorporate information from
    the Knowledge Network of Disease into a New Taxonomy.** Insights into disease
    classification that emerge from the Information Commons and the derived Knowledge
    Network will require validation of their reproducibility and their utility for
    making clinically relevant distinctions (e.g., regarding prognosis or choice of
    treatment) before adoption into clinical use. A process should be established
    by which such information is validated for incorporation into a New Taxonomy to
    be used by physicians, patients, regulators, and payers. The speed and complexity
    with which such validated information emerges will undoubtedly accelerate and
    will require novel decision-support systems for use by all stakeholders.


    6.  **Incentivize partnerships.** The Committee envisions that a New Taxonomy
    incorporating molecular data could become self-sustaining by accelerating delivery
    of better health through more accurate diagnosis and more effective and cost-efficient
    treatments. However, to cover initial costs associated with collecting and integrating
    data for the Information Commons, incentives should be developed that encourage
    public–private partnerships involving government, drug developers, regulators,
    advocacy groups, and payers.


    A major beneficiary of the proposed Knowledge Network of Disease and New Taxonomy
    would be what has been termed “precision medicine.” The Committee is of the opinion
    that realizing the full promise of precision medicine, whose goal is to provide
    the best available care for each individual, requires that researchers and health-care
    providers have access to vary large sets of health and disease-related data linked
    to individual patients. These data are also critical for the development of the
    Information Commons, the Knowledge Network of Disease, and the development and
    validation of the New Taxonomy.


    [1](../Text/contents.xhtml#a1)


    [Introduction](../Text/contents.xhtml#a1)


    [THE CURRENT OPPORTUNITY](../Text/contents.xhtml#a2)


    Biomedical research and the practice of medicine, separately and together, are
    reaching an inflection point: the capacity for description and for collecting
    data, is expanding dramatically, but the efficiency of compiling, organizing,
    manipulating these data—and extracting true understanding of fundamental biological
    processes, and insights into human health and disease, from them—has not kept
    pace. There are isolated examples of progress: research in certain diseases using
    genomics, proteomics, metabolomics, systems analyses, and other modern tools has
    begun to yield tangible medical advances, while some insightful clinical observations
    have spurred new hypotheses and laboratory efforts. In general, however, there
    is a growing shortfall: without better integration of information both within
    and between research and medicine, an increasing wealth of information is left
    unused.


    As illustration, consider the following clinical scenarios;^([1](#chapter01.xhtml#ch1_fn1))
    in the first example, molecular understanding of disease has already begun to
    play an important role in informing treatment decisions, while in the second,
    it has not.


    Patient 1 is consulting with her medical oncologist following breast cancer surgery.
    Twenty-five years ago, the patient’s mother had breast cancer, when therapeutic
    options were few: hormonal suppression or broad-spectrum chemotherapy with significant
    side effects. Today, Patient 1’s physician can suggest a precise regimen of therapeutic
    options tailored to the molecular characteristics of her cancer, drawn from among
    multiple therapies that together focus on her particular tumor markers. Moreover,
    the patient’s relatives can undergo testing to assess their individual breast
    cancer predisposition (Siemens Healthcare Diagnostics Inc. 2008).'
