    ## 总结


    委员会的任务是探索“基于分子生物学的新型人类分类法”的可行性和必要性，并为其制定一个潜在的框架。显然，这项研究的动力是人类分子数据的爆炸式增长，特别是与患者相关的数据，而且人们感觉到存在巨大的尚未开发的机遇，利用这些数据来改善健康结果。委员会同意这一观点，并且确实认为，开发疾病新分类法的挑战仅仅是一个真正具有历史意义的挑战中的一个元素，尽管它非常重要。


    考虑到委员会审议的范围，本报告的开头通过追踪一条统一委员会主要发现和建议的逻辑线索，并将其与其任务说明联系起来，是恰当的。委员会的任务强调了分类法在医学中的重要性，以及利用分子数据改进疾病分类的潜力。在医学实践中，分类法通常指的是《国际疾病分类》（ICD），这是一个
    100 多年前建立的系统，世界卫生组织用它跟踪疾病发病率，医生将其作为标准化诊断的依据，医疗保健行业（特别是临床、医院和支付方）用它来确定护理报销。尽管委员会意识到任何新的分类计划必须服务于
    ICD 及相关分类系统的需求，但他们得出结论，实现这一目标的最好方法是将未来的改进植根于`信息共享地`（Information Commons）和`知识网络`Knowledge
    Network），这些还将发挥许多其他作用。


