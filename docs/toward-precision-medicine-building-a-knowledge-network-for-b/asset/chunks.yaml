    A further limitation of taxonomic systems is the intrinsically static nature of
    their information content. The `ICD` system is designed to be updated every ten
    years with minor updates every three years. But many organizations are still working
    with `ICD-9`, which was released in 1977, even though `ICD-10` was released in
    1992. Because of the time it takes to implement `ICD` revisions in administrative
    systems, the current taxonomic system is perpetually outdated. Moreover, the static
    structure of current taxonomies does not lend itself to the continuous integration
    of new disease parameters as they become available. This is particularly troublesome
    given that new data regarding the molecular nature of disease are becoming available
    at an ever-increasing rate.


    ### Efforts to Revise the ICD Classification


    Current efforts to revise the `ICD` classification attempt to address these limitations.
    `ICD-11` will be based on a foundational layer from which “linearizations” will
    be derived (Tu et al. 2010). While the linearizations will be relatively static
    and hierarchical, the foundational layer is being designed to support multi-parent
    hierarchies and connections, and to be updated continuously.^([4](#chapter01.xhtml#ch1_fn4))
    Importantly, the new classification will combine phenomenological characterization
    of phenotype with genomic factors that might explain or at least distinguish phenotypes.^([5](#chapter01.xhtml#ch1_fn5))
    Different lung cancers, for example, could be explicitly differentiated by genomic
    characterization. This is important because knowledge about the specific molecular
    pathways contributing to the biology of particular types of lung cancer can be
    used to guide selection of the most appropriate treatment for such patients.


    ### The Knowledge Network of Disease


    Although the release of `ICD-11` will mark an important step forward, the Committee
    thinks that the amount of information available for this effort can be vastly
    increased by a two-stage process leading to a `Knowledge Network of Disease`.
    As discussed in detail in following sections of this report, the first stage in
    developing this `Knowledge Network` would involve creating an `Information Commons`
    containing a combination of molecular data, medical histories (including information
    about social and physical environments), and health outcomes for large numbers
    of individual patients. The Committee envisions this stage occurring in conjunction
    with the ongoing delivery of clinical care to these patients, rather than in specialized
    settings specifically crafted for research purposes. The second stage, the construction
    of the `Knowledge Network` itself, would involve data mining of the `Information
    Commons` and integration of these data with the scientific literature—specifically
    with evolving knowledge of the fundamental biological mechanisms underlying disease.


    Such a `Knowledge Network of Disease` would enable development of a more molecularly-based
    taxonomy. This “New Taxonomy” could, for example, lead to more specific diagnosis
    and targeted therapies for muscular dystrophy patients based on the specific mutations
    in their genes. In other cases, it could suggest targeted therapies for patients
    with the same genetic mechanism of disease despite very different clinical presentations.


    [AN INFORMATION COMMONS, A KNOWLEDGE NETWORK, AND A NEW TAXONOMY THAT WOULD INTEGRATE
    MANY TYPES OF INFORMATION AND SERVE ALL STAKEHOLDERS](../Text/contents.xhtml#a7)


    ### The Information Commons and GIS Analog


    As will be described later in the report, the Committee envisions that the `Information
    Commons`, which would underlie the `Knowledge Network of Disease` and the `New
    Taxonomy`, would have some analogies with geographical information systems (`GISs`),
    which are designed to capture, store, manipulate, and analyze all types of geographically
    referenced data and make them widely accessible in applications (ESRI 1990) such
    as `Google Maps` ([Figure 1-2](../Text/chapter01.xhtml#fig_1-2)). Most users would
    interact with these resources at the higher-value-added levels, the `Knowledge
    Network` and the `New Taxonomy`, rather than at the level of the underlying `Information
    Commons` ([Figure 1-3](../Text/chapter01.xhtml#fig_1-3)). Investigators using
    the `Knowledge Network of Disease` could propose hypotheses about the importance
    of various inter- and intra-layer connections that contribute to disease origin,
    severity, or progression, or that support the subclassification of particular
    diseases into those with different molecular mechanisms, prognoses, and/ or treatments,
    and these ideas then could be tested in an attempt to establish their validity,
    reproducibility, and robustness. Validated findings that emerge from the `Knowledge
    Network of Disease` and are shown to be useful for defining new diseases or subtypes
    of diseases that are clinically relevant (e.g., which have implications for patient
    prognosis or therapy) could be incorporated into the `New Taxonomy` to improve
    diagnosis and treatment. Whether the “New Taxonomy” that is informed and refined
    by the `Knowledge Network of Disease` would best be realized as a modification
    of the `ICD` taxonomy, or should represent an entirely distinct taxonomy that
    exists in parallel with `ICD` and other taxonomies, will depend on a number of
    factors. However, in either case, the goal of basing the `New Taxonomy` on the
    `Knowledge Network of Disease` will be to improve markedly the quantity and quality
    of information that can be used in biomedicine for the basic discovery of disease
    mechanisms, improved disease classification, and better medical care.


    ![images/p17.jpg](Images/p17.jpg)


    [FIGURE 1-2 An Information Commons might use a GIS-type structure](../Text/contents.xhtml#fi_1-2).


    The proposed, individual-centric `Information Commons` (right panel) is somewhat
    analogous to a layered `GIS` (left panel). In both cases, the bottom layer defines
    the organization of all the overlays. However, in a `GIS`, any vertical line through
    the layers connects related snippets of information since all the layers are organized
    by geographical position. In contrast, data in each of the higher layers of the
    `Information Commons` will overlay on the patient layer in complex ways (e.g.,
    patients with similar microbiomes and symptoms may have very different genome
    sequences).


    SOURCE: FPA 2011 (left panel).


    ![images/p18.jpg](Images/p18.jpg)


    [FIGURE 1-3 A knowledge network of disease would enable a new taxonomy](../Text/contents.xhtml#fi_1-3).


    An individual-centric `Information Commons`, in combination with all extant biological
    knowledge, will inform a `Knowledge Network of Disease`, which will capture the
    exceedingly complex causal influences and pathogenic mechanisms that determine
    an individual’s health. The `Knowledge Network of Disease` would allow researchers
    to hypothesize new intralayer cluster and interlayer connections. Validated findings
    that emerge from the `Knowledge Network`, such as those which define new diseases
    or subtypes of diseases that are clinically relevant (e.g., which have implications
    for patient prognosis or therapy) would be incorporated into the `New Taxonomy`
    to improve diagnosis and treatment.


    SOURCE: Committee on A Framework for Developing a New Taxonomy of Disease.


    [RATIONALE AND ORGANIZATION OF THE REPORT](../Text/contents.xhtml#a8)


    Today, historic forces are transforming biomedical research and health care. Information
    technology, clinical medicine, and the public attitudes that govern the ways that
    science, medicine, and society interact are all in flux.


    A `Knowledge Network of Disease` could embrace and inform rapidly expanding efforts
    by the biomedical research community to define at the molecular level the disease
    predispositions and pathogenic processes occurring in individuals. This network
    has the potential to play a critical role across the globe for the public-health
    and health-care-delivery communities by enabling development of a more accurate,
    molecularly-informed taxonomy of disease.

    '
  trans: '


    分类系统的另一个局限性是其信息内容内在的静态性。`ICD` 系统设计为每十年更新一次，每三年进行一次小幅更新。但尽管 `ICD-10` 已于 1992 年发布，许多医疗机构仍在使用
    1977 年发布的 `ICD-9`。由于在行政系统中实施 `ICD` 修订版需要时间，导致目前的分类系统始终处于过时的状态。此外，当前分类法的静态结构并不利于在新的疾病参数出现时对其进行持续整合。鉴于有关疾病分子特性的新数据正以不断加快速度出现，这一点变得尤尤为棘手。


    ### 修订 ICD 分类的努力


    目前修订 `ICD` 分类的努力试图解决这些局限性。`ICD-11` 将基于一个基础层，并在此基础上推导出“线性化”表示（Tu 等人，2010）。虽然这些线性化表示是相对静态且分层次的，但基础层的设计旨在支持多父级层级结构和连接，并进行持续更新.^(4)。重要的是，新的分类法将结合表型的现象学描述与基因组因素，后者可能解释或至少能区分表型。(([5)例如，不同的肺癌可以通过基因组学表征进行明确区分。这非常重要，因为有关导致特定类型肺癌生物学的特定分子通路的知识，可以指导为此类患者选择最合适的治疗方案。


    ### 疾病知识网络


    尽管 `ICD-11` 的发布标志着向前的一一步，但委员会认为，通过导致“疾病知识网络”（`Knowledge Network of Disease`）的两阶段过程可以大幅增加该工作的可用信息量。正如报告后续章节详细讨论的那样，开发该“知识网络”的第一阶段将涉及创建一个“信息公社”（`Information
    Commons`），其中包含分子数据、病史（包括有关社会和物理环境的信息）以及大量个体患者的健康结果。委员会设想这一阶段将与对这些患者持续提供的临床护理相结合进行，而不是在专门为研究目的而创建的特殊环境中进行。第二阶段是“知识网络”本身的构建，它将涉及对“信息公社”进行数据挖掘，并将这些数据与科学文献相结合——特别是与关于疾病基础生物机制的不断发展的知识相结合。


    这种“疾病知识网络”将能够实现更加基于分子的分类法。这种“新分类法”例如可以根据患者基因中的特定突变，为肌营养不良症患者提供更具体的诊断和针对性治疗。在其他情况下，它可能为临床表现完全不同但疾病遗传机制相同的患者建议针对性治疗。


    一个信息公社、一个知识网络以及一种整合多种类型信息并为所有利益相关者服务的分类分类


    ### 信息公社与 GIS 类比


    正如报告后面将描述的，委员会设想“信息公社”（`Information Commons`）作为“疾病知识网络”和“新分类法”的基础，它与地理信息系统（`GISs`）具有某些相似之处。GIS
    旨在捕、存储、处理和分析所有类型的地理引用数据，并使其在诸如 `Google Maps`（ESRI 1990）的应用中被广泛使用（图 1-2）。大多数用户将在高附加值层面（即“知识网络”和“新分类法”）与这些资源交互，而不是在底层的“信息公社”层面（图
    1-3）。使用“疾病知识网络”的研究人员可以对各种层间和层内连接重要性提出假设，这些连接有助于疾病的起源、严重程度或进展，或者支持特定疾病的亚分类。


    '
