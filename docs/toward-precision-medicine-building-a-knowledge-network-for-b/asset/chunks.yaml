  trans: '


    引言中描述的如 `Patient 1` 等乳腺癌患者示例说明了疾病知识网络（Knowledge Network of Disease）的潜力：即使不同疾病亚型之间的治疗没有差异（例如散发性与`BRCA1/2`相关的乳腺癌），它也能为患者提供价值信息。虽然抑癌基因
    `BRCA1` 和 `BRCA2` 的突变会增加女性患乳腺癌和卵巢癌风险，但这些基因中特定生殖系突变增加癌症风险的程度往往仍不确定（Gayther 等，1995）。因此，患者和医生目前在决定是否进行更密集的癌症监测（例如通过乳腺磁共振成像或阴道超声）时，无法清楚评估此类增加的筛查带来的益处，以及不可避免的假阳性所带来的焦虑和潜在发病率。此外，某些患者选择接受预防性乳腺切除术或卵巢切除术，但对于这些极端手术实际上在多大程度上降低了癌症风险缺乏明确信息。


    试图量化这些风险的研究主要集中在特定的族群，在这些群体中，有限的突变发生频率足够高，允许通过实际规模的分析得出可靠结论。如果能将 `BRCA1/2` 基因型和健康史跨越目前不同医疗机构之间的大型数据集进行比较，将可能准确评估具有不同突变和遗传背景的人的癌症风险。此类数据将允许对风险降低策略做出更合理的建议，通过避免不必要的筛查和治疗，同时降低癌症发生率并促进早期发现，为个体患者、医疗保健提供者支付方创造巨大的价值。


    ### 药物开发


    看似不相关的疾病之间的分子相似性对药物发现也具有直接相关，因为它将导致对分子相关疾病共有的疾病相关通路进行针对性研究。此外，持续获取大量服用已批准药物患者的分子图谱和健康史，无疑将通过识别具有高于常常药物不良反应风险的个体，从而提高药物安全性。事实上，我们对罕见不良反应的理解有限，且缺乏研究这些反应的稳健系统，这是在我们日益规避风险且诉讼频繁的社会中引入新药的主要障碍。


    ### 健康不平等


    在我们多元化的社会中，不同“种族”、民族和社会经济群体在健康状况方面的巨大差异已被证明极难改善，令人沮丧。如上所述，这些不平等的关键因素很可能通过公共卫生措施和其他公共政策得到最有效的解决，而这些措施与我们目前所理解的疾病分子基础关系较小。然而，委员会认为，信息公地（Information
    Commons）和疾病知识网络是理解和解决健康不平等的潜在有力工具，因为它们将受到影响个体患者健康的环境和社会因素数据的支持。这些资源将首次在同一地点汇集分子图谱、健康史，以及关于影响健康和疾病的许多决定因素的数据，从而优化解码外源因素如何产生内源生物输入并直接影响健康的能力。研究人员和政策制定者随后能够更好地梳理观察到的个体和群体健康差异的各种可能性原因，并制定有效的策略来预防和应对这些差异。


    ### 大型数据集的层级结构将成为疾病知识网络及其实际应用的基础


    知识网络的建立及其研究和临床应用，将取决于一个分层的、良好整合的大型数据集的可用，这些数据集描述了我们对人类疾病的认知。这些数据集将为“新分类法”（New
    Taxonomy）以及整个医疗保健系统中许多其他基础和应用活动奠定基础。信息公地将包含个体患者的原始信息，从中可以推导出有意义的链接和关系。鉴于知识网络需要来自网络外部的海量信息支持，委员会预见医学信息学领域需要针对网络创建和策划的所有步骤进行实质性研究，同样重要的是，针对具有不同背景和目标的人员进行使用。知识网络的创建及其底层信息公地将实现在动态的共享平台上，对分子、环境、行为、社会和临床数据进行持续编译和分析。此类信息平台需要让整个研究和临床护理范围内的用户（包括支付方）访问。研究社区将持续提交数据，并直接从参与患者的病历中提取数据。不同数据集在这一信息资源中的作用在图
    3-1 中进行了示意。


    信息公地和疾病知识网络的精确结构仍待确定，并将如第 4 章所述，通过试点研究提供依据。然而，考虑到其目的，委员会将信息公地设想为另见图 1-2）：


    #### 多层级


    鉴于包含了从基因组到环境调节的疾病因素等多个参数，信息公地可能具有多层结构，每层包含一个疾病参数的信息，例如“体征和症状”、基因突变、表观遗传模式、代谢特征或其他风险因素（包括社会、行为和环境影响）。


    #### 以个体为中心


    信息公地应记录所有关于个体的测量数据，以便对病理生理状态的多种影响可以跨越从分子到社会水平的所有尺度进行观察。只有这样，例如才能将个体的环境暴露与个体分子图谱的变化相匹配。这些数据需要存储在托管的、加密的仓库中，根据所提的问题、提问者的访问权限以及在试点研究过程中无疑出现的其他参数，允许分级发布数据。委员会意识到这是一种激进的方法，因此关于信息公地对医学进步的价值进行强烈的公众教育和外展活动，对于利用知情自愿精神、获得特定疾病倡导小组的支持以及其他利益相关者的参与至关重要。委员会认为，确保隐私的谨慎政策处理是其对信息公地、疾病知识网络和新分类法整个愿景的核心问题。因此，这一主题在第
    4 章 中进行了更详细的讨论。


    '
