    \ 3:00 | 休\n\n# 附录 D：eMERGE 联盟数据使用协议\n\n 条与定义\n电子医疗记录与基因组 (`eMERGE`) 网络是由美国国立健康研究院（NIH）组织并资助的美国医疗研究机构联盟\
    \ (`eMERGE Network`)。`eMERGE Network` 的主要目标是开发、传播和应用将 DNA 生物库与电子医疗记录 (`EMR`) 系统相结合的研究方法，用于大规模、高通量的遗传研究。参与该联盟的机构利用全基因组关联\
    \ (`GWAS`) 分析技术，研究遗传变异与临床相关人类特征之间的关系。此类研究涉及在患有和不患某种疾病的人身上检测数十万个被称为单核苷酸多态性的全基因组组遗传变异。此外，联盟还关注隐私、机密性和与更广泛社区互动等和社会伦理问题。有关\
    \ eMERGE 网络的详细信息可以查阅 eMERGE 网站 (`www.gwas.org`)。\n\n 网络成员\n以下实体为 eMERGE 网络成员 (`eMERGE\
    \ Network Members` 或 `Members`)：\n*   `Group Health/University of Washington`、`Marsh-field\
    \ Clinic`、`Mayo Clinic`、`Northwestern University` 和 `Vanderbilt University` 担任临床站点\
    \ (`Clinical Sites`)。\n*   `Vanderbilt University` 同时也担任联盟的协调中心 (`Coordinating\
    \ Center`)。\n*   `Broad Institute` 和 `Center for Inherited Disease Research` 均担任基因分型设施\
    \ (`Genotyping Facilities`)。\n*   `国家生物技术信息中心 (NCBI)、NIH`；`国家人类基因组研究所 (NHGRI)、NIH`\
    \ (`Program Officials`) 担任科学和项目经理及技术顾问。\n\n由 `eMERGE Network Member` 雇佣的在基因组学、统计学、伦理、信息学和临床医学方面拥有广泛知识的研究人员参与\
    \ `eMERGE network`，包括：`eMERGE 临床站点`、`协调中心`、`基因分型设施`的首席研究员，以及来自`国家生物技术信息中心`和`国家人类基因组研究所`的`项目官员`。\n\
