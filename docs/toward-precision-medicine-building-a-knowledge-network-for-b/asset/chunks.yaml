    \ easy cross-comparison and cross-correlation of any desired dataset, making it\
    \ a versatile tool for a wide spectrum of applications ranging from basic research\
    \ to clinical studies and healthy system administration.\n\n***Widely accessible.***\
    \ The Knowledge Network would need to be accessible and usable by a wide range\
    \ of stakeholders from basic scientists to clinicians, health-care workers, and\
    \ the public. Furthermore, the available information would need to be mineable\
    \ in ways that are custom-tailored to the needs of different users, possibly by\
    \ implementation of purpose-specific user interfaces.\n\nWhile the Committee agreed\
    \ upon the generalities listed above and illustrated in [Figure 3-1](../Text/chapter03.xhtml#fig_3-1)\
    \ about the Information Commons and Knowledge Network—and their relationship to\
    \ a New Taxonomy— specifics of implementation such as the detailed design of the\
    \ Information Commons, the information technology platforms used to create it,\
    \ questions about where key infrastructure should be physically housed, who would\
    \ oversee it, and how the Information Commons would be financed, were considered\
    \ beyond the scope of the Committee’s charge in a framework study. Nonetheless,\
    \ dramatic developments in the fields of medical information technology—and other\
    \ developments discussed in [Chapter 2](../Text/chapter02.xhtml)—give the Committee\
    \ confidence that the creation and implementation of this ambitious and novel\
    \ infrastructure is a feasible goal.\n\n[THE PROPOSED KNOWLEDGE NETWORK WOULD\
    \ FUNDAMENTALLY DIFFER FROM CURRENT BIOMEDICAL INFORMATION SYSTEMS](../Text/contents.xhtml#a25)\n\
