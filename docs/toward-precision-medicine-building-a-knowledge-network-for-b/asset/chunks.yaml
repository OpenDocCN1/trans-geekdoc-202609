    ### 1. 开展试点研究，开始向信息共享（Information Commons）填充数据。

    应在医疗保健环境中开展试点观察性研究，以评估在临床护理过程中将分子参数与病史及健康结果相结合的可性。这些研究将解决在创建、链接和广泛访问作为新分类法（New
    Taxonomy）基础数据集时涉及的实际和伦理挑战。试点研究定义的最佳实践随后应在范围和规模上进行扩展，以产生能够支持新分类法的信息共享和知识网络。随着这一过程的演变，应持续评估这些新的信息资源在多大程度上有助于改善健康结果并实现更具成本效益的医疗保健。


    ### 2. 整合数据以构建疾病知识网络。

    随着个体床旁试点研究数据开始填充信息共享，应投入大量精力将这些数据与基础生物医学研究的结果整合，以创建一个动态的、交互的知识网络。该网络以及信息共享本身，应利用先进的信息技术，根据不同用户（例如基础研究人员、临床医生、结果研究人员、支付方）的不同需求，提供数据的多种视图。


    ### 3. 在适当的联邦机构内部启动流程，评估与创建信息共享所需的研究相关的隐私问题。

    由于这些问题已过广泛研究，该过程无需从头开始。然而，在实践中，希望参加上述试点研究的调查人员，以及必须批准其人类受试者方案的机构审查委员会（IRB），需要就适用于这些项目的知情同意流程范围获得特定指导。在当前法律限制和流行伦理标准的约束下，委员会鼓励在提供的指导中尽可能保持灵活性。应尽可能依靠在不同医疗环境中开展的试点项目的实地经验，而非自上而下的指令，来主导这一敏感领域最佳实践的形成，而该领域的处理方式将对整个信息共享/知识网络/新分类法倡议产生决定性影响。在这些讨论中纳入医疗保健提供者、支付方以及学术社区之外的其他利益相关者将关重要的。


    ### 4. 确保数据共享。

    广泛的数据共享对于委员会设想创建新分类法过程中每个阶段的成功至关重要。最根本的是，填充信息共享的个体患者分子和表型数据必须广泛开放，以便多样化的研究人员为了特定目的对其进行挖掘，并探索从中得出知识网络和疾病分类法的替代方法。由联邦资助基因组项目开发并采用的现有标准已解决了其中一些问题，但仍存在巨大障碍，特别是对于个体患者表型和健康结果数据的共享。应建立数据共享标准，既能尊重个人隐私顾虑，又增强数据向信息共享的提交。重要的是，这些标准应提供激励措施，鼓励数据共享，而非为了商业意图而建立专有数据库。解决这些障碍可能需要立法，或许还需要公众对医疗保健数据访问和隐私的预期发生演变。


    ### 5. 开发一种高效的验证流程，将疾病知识网络中的信息纳入新分类法。

    从信息共享和派生知识网络中得出的疾病分类见解，在采纳用于临床之前，需要对其可重复性以及对于做出临床相关区分（例如关于预后或治疗选择）的效用进行验证。应建立一种流程，对此类信息进行验证并将其纳入新分类法，供医生、患者、监管机构和支付方使用。此类验证信息的出现速度和复杂性无疑将加速进程，并要求所有利益相关者使用新型决策支持系统。


    ### 6. 激励合作伙伴关系。

    委员会设想，结合分子数据的新分类法可以通过通过更准确的诊断以及更有效、更具成本效益的治疗来加速提供更好的健康，从而实现自持续。然而，为了涵盖与信息共享收集和整合数据相关的初始成本，应开发激励措施，鼓励涉及政府、药物开发人员、监管机构、倡导小组和支付方的公私合作伙伴关系。


    拟议的疾病知识网络和新分类法的主要受益者将是“精准医学”。委员会认为，要实现精准医学的全部潜力（其目标是为每个个体提供最佳可用护理），需要研究人员和医疗提供者能够访问与个体患者相关的海量健康和疾病相关数据。这些数据对于信息共享、疾病知识网络以及新分类法的开发和验证也至关重要。


    1


    介绍


    ### 当前的机遇（../Text/contents.xhtml#a2）


    生物医学研究和医学实践，无论是单独还是共同，正处于一个转折点：描述和收集数据的能力正在剧扩张，但编译、组织、处理这些数据的效率——以及从中提取对基础生物过程的真实理解以及对人类健康和疾病的洞察的效率——并未跟上。进展的例子是孤立的：利用基因组学、蛋白质组学、代谢组学、系统分析和其他现代工具对某些疾病的研究开始取得切实的医学进展，而一些富有见地的临床观察引发了新的假设和实验室工作。然而，总体存在日益扩大的缺口：如果没有研究与医学内部及之间更好的信息整合，日益丰富的信息将被闲置。


    作为说明，考虑以下临床场景；^(1) 在第一个例子中，对疾病的分子理解已开始在指导治疗决策方面发挥重要作用，而在第二个例子中，尚未如此。


    患者 1 正在乳腺癌术后咨询她的肿瘤内科医生。二十五年前，患者的母亲曾患有乳腺癌，当时治疗选择很少：激素抑制或具有显著副作用的广谱化疗。今天，患者 1 的医生可以根据其癌症的分子特征建议一种精确的治疗方案，这些方案是从多种共同关注其特定肿瘤标志物的疗法中出的。此外，患者的亲属可以接受检测以评估他们各自的乳腺癌易感性（Siemens
    Healthcare Diagnostics Inc. 2008）。


