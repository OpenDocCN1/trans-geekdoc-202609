- raw: "The tremendous recent progress in genetics, molecular biology, and information\
    \ technology has been projected to lead to novel therapeutics and improved health-care\
    \ outcomes with reduced overall health-care costs. However, there is little evidence\
    \ that these benefits are accruing in mainstream medicine (OECD 2011). Instead,\
    \ health-care costs have steadily increased, and these increased costs have not\
    \ necessarily translated into significantly better clinical outcomes (OECD 2011).\
    \ This situation has created a “perfect storm” for a wide variety of stakeholders,\
    \ including health-care providers, payers, regulators, patients, and drug developers.\
    \ The economics of the present situation are not sustainable and demand change.\n\
    \nClinical and basic researchers have learned that for their collective efforts\
    \ to provide affordable improvements in health care, increased collaboration and\
    \ coordination are required. Public–private collaborations are needed to combine\
    \ longitudinal health outcomes data with new advances in technology and basic\
    \ research. Such initiatives are essential to gain and apply the specific biological\
    \ knowledge required to develop new approaches to treat and prevent disease. A\
    \ dynamically evolving Knowledge Network of Disease would provide a framework\
    \ in which a closer, more effective, relationship between clinical and basic researchers\
    \ could thrive.\n\nNowhere is the need for change more evident and urgent than\
    \ in the pharmaceutical and biotechnology industries. Despite a massive increase\
    \ in the amount of genomic and molecular information available over the past decade,\
    \ the number of effective new therapies developed each year has remained stable,\
    \ while the cost of developing each successful therapy has increased dramatically\
    \ (Munos 2009). While the new molecular technologies have identified a large number\
    \ of novel drug targets, an inadequate biological understanding of these targets\
    \ has resulted in an ever-increasing failure rate of expensive clinical trials\
    \ (Arrowsmith 2011a,b). The present situation in drug development is not sustainable.\
    \ The pharmaceutical and biotechnology industries are now leading proponents for\
    \ developing public–private collaborations and consortia in which longitudinal\
    \ clinical outcomes data can be combined with new molecular technology to develop\
    \ the deep biological understanding needed to re-define disease based on biological\
    \ mechanisms. Given the time scale on which private entities must seek return\
    \ on investment, there is an increased willingness to regard much of this information\
    \ as precompetitive. Hence, the information itself, and the costs of acquiring\
    \ it, must be widely shared.\n\nA major beneficiary of the proposed Knowledge\
    \ Network of Disease and New Taxonomy would be what has been termed “precision\
    \ medicine.” In precision medicine, the ultimate end point is the selection of\
    \ a subset of patients, with a common biological basis of disease, who are most\
    \ likely to benefit from a drug or other treatment, such as a particular surgical\
    \ procedure. Today, researchers look for relatively small differences between\
    \ treated and untreated patients in trials that involve unselected patients, with\
    \ little insight into the biological heterogeneity among the patients or their\
    \ diseases. This approach requires a much larger number of patients, more time,\
    \ and greater costs to assess the effectiveness of new therapies than would more\
    \ targeted study designs. By using a precision-medicine approach to focus on those\
    \ patients early in the drug-development process who are most likely to be helped,\
    \ fewer side effects and reduced costs are likely to ensue. In such studies, compliance\
    \ will likely be better, treatment duration longer, and therapeutic benefits more\
    \ obvious than is the case with traditional designs. Greater therapeutic differences\
    \ could also result in more efficient regulatory approval, and faster adoption\
    \ by physicians and payers.\n\n[**Box 2-4  \n\nPrecision Medicine for Drug Development**](../Text/contents.xhtml#bo_2-4)\n\
    \nA successful example of the precision medicine approach to drug development\
    \ involves the drug Crizotinib, an inhibitor of the MET and ALK kinases, which\
    \ began clinical development in a broad population of patients with lung cancer\
    \ (Kwak et al. 2010). During the early stages of the initial Crizotinib clinical\
    \ trial conducted by pharmaceutical industry scientists, an independent group\
    \ of academic scientists published their discovery that a particular chromosomal\
    \ translocation involving the gene encoding ALK drives tumor growth in a subset\
    \ of non-small cell lung cancer patients (Soda et al. 2007). Access to this knowledge\
    \ allowed the pharmaceutical industry scientists to modify their clinical trial\
    \ to look specifically at a cohort of patients with this translocation, and the\
    \ results were dramatic. For those patients who had the translocation, the median\
    \ disease-free survival with Crizotinib was a year, compared to just a few months\
    \ with the standard of care. Thus, even in a trial that involved only a small\
    \ number of patients that were compared to historical controls, it was obvious\
    \ that the drug was active. In contrast, in an unselected patient population,\
    \ most patients did not benefit from this drug and it was unclear whether the\
    \ drug had any activity.\n\n(Crizotinib is expected to receive regulatory approval\
    \ for treatment of ALK translocation-positive lung cancer within the next year.)\n\
    \nAs illustrated in [Box 2-4](../Text/chapter02.xhtml#box_2-4), data sharing is\
    \ essential to the development of precision medicine. Data sharing needs to occur\
    \ across companies and across academic institutions to ensure that everyone benefits\
    \ from fundamental biological knowledge. Institutions need to be convinced that\
    \ they gain from openness. Broad engagement of a vast array of public and private\
    \ stakeholders, including university scientists, regulators, health-care providers,\
    \ payers, government, and perhaps most importantly the public at large, will be\
    \ required to support and sustain the changes required for development of innovative\
    \ new therapies that improve health outcomes based on the proposed Knowledge Network\
    \ of Disease and associated New Taxonomy.\n\n[PUBLIC ATTITUDES TOWARD INFORMATION\
    \ AND PRIVACY ARE IN FLUX](../Text/contents.xhtml#a17)\n\nGenetic privacy was\
    \ a central preoccupation during the early years of genomics, which led to implementation\
    \ of stringent regulatory procedures to limit the use of genetic data in patient-oriented\
    \ research (Andrews and Jaeger 1991). Many privacy-related issues—ranging from\
    \ insurance coverage to employment discrimination, social stigmatization, and\
    \ the simple desire to be left alone—are by no means resolved, although passage\
    \ of the Genetic Information Nondiscrimination Act (GINA) alleviates many concerns\
    \ about such discrimination (Hudson et al. 2008). During the ensuing years, the\
    \ diffusion of the internet into every corner of our lives is driving massive\
    \ changes in public attitudes toward privacy. Research studies of public attitudes\
    \ reveal deep ambivalence about informational privacy. In the particular arena\
    \ of genetic information and health records, members of focus groups typically\
    \ grasp the broad social benefits of sharing data. A consistent theme is that\
    \ people who contribute their own information to public databases want to be asked\
    \ for permission, to have a clear explanation of how the data will be used, and\
    \ to be treated as true partners in the research process (Damschroder et al. 2007;\
    \ Trinidad et al. 2010; Haga and O’Daniel 2011). Although privacy concerns remain,\
    \ there is little evidence that the public has the extreme sensitivity toward\
    \ genetic data that many researchers anticipated 25 years ago.\n\n[THE PROPOSED\
    \ KNOWLEDGE NETWORK OF DISEASE COULD CATALYZE CHANGES IN BIOLOGY, INFORMATION\
    \ TECHNOLOGY, MEDICINE, AND SOCIETY](../Text/contents.xhtml#a18)"
  fmt: '

    The tremendous recent progress in genetics, molecular biology, and information
    technology has been projected to lead to novel therapeutics and improved health-care
    outcomes with reduced overall health-care costs. However, there is little evidence
    that these benefits are accruing in mainstream medicine (OECD 2011). Instead,
    health-care costs have steadily increased, and these increased costs have not
    necessarily translated into significantly better clinical outcomes (OECD 2011).
    This situation has created a “perfect storm” for a wide variety of stakeholders,
    including health-care providers, payers, regulators, patients, and drug developers.
    The economics of the present situation are not sustainable and demand change.


    Clinical and basic researchers have learned that for their collective efforts
    to provide affordable improvements in health care, increased collaboration and
    coordination are required. Public–private collaborations are needed to combine
    longitudinal health outcomes data with new advances in technology and basic research.
    Such initiatives are essential to gain and apply the specific biological knowledge
    required to develop new approaches to treat and prevent disease. A dynamically
    evolving `Knowledge Network of Disease` would provide a framework in which a closer,
    more effective, relationship between clinical and basic researchers could thrive.


    Nowhere is the need for change more evident and urgent than in the pharmaceutical
    and biotechnology industries. Despite a massive increase in the amount of genomic
    and molecular information available over the past decade, the number of effective
    new therapies developed each year has remained stable, while the cost of developing
    each successful therapy has increased dramatically (Munos 2009). While the new
    molecular technologies have identified a large number of novel drug targets, an
    inadequate biological understanding of these targets has resulted in an ever-increasing
    failure rate of expensive clinical trials (Arrowsmith 2011a,b). The present situation
    in drug development is not sustainable. The pharmaceutical and biotechnology industries
    are now leading proponents for developing public–private collaborations and consortia
    in which longitudinal clinical outcomes data can be combined with new molecular
    technology to develop the deep biological understanding needed to re-define disease
    based on biological mechanisms. Given the time scale on which private entities
    must seek return on investment, there is an increased willingness to regard much
    of this information as precompetitive. Hence, the information itself, and the
    costs of acquiring it, must be widely shared.


    ### Precision Medicine


    A major beneficiary of the proposed `Knowledge Network of Disease and New Taxonomy`
    would be what has been termed “precision medicine.” In precision medicine, the
    ultimate end point is the selection of a subset of patients, with a common biological
    basis of disease, who are most likely to benefit from a drug or other treatment,
    such as a particular surgical procedure. Today, researchers look for relatively
    small differences between treated and untreated patients in trials that involve
    unselected patients, with little insight into the biological heterogeneity among
    the patients or their diseases. This approach requires a much larger number of
    patients, more time, and greater costs to assess the effectiveness of new therapies
    than would more targeted study designs. By using a precision-medicine approach
    to focus on those patients early in the drug-development process who are most
    likely to be helped, fewer side effects and reduced costs are likely to ensue.
    In such studies, compliance will likely be better, treatment duration longer,
    and therapeutic benefits more obvious than is the case with traditional designs.
    Greater therapeutic differences could also result in more efficient regulatory
    approval, and faster adoption by physicians and payers.


    [Box 2-4 Precision Medicine for Drug Development](../Text/contents.xhtml#bo_2-4)


    A successful example of the precision medicine approach to drug development involves
    the drug `Crizotinib`, an inhibitor of the `MET` and `ALK` kinases, which began
    clinical development in a broad population of patients with lung cancer (Kwak
    et al. 2010). During the early stages of the initial `Crizotinib` clinical trial
    conducted by pharmaceutical industry scientists, an independent group of academic
    scientists published their discovery that a particular chromosomal translocation
    involving the gene encoding `ALK` drives tumor growth in a subset of non-small
    cell lung cancer patients (Soda et al. 2007). Access to this knowledge allowed
    the pharmaceutical industry scientists to modify their clinical trial to look
    specifically at a cohort of patients with this translocation, and the results
    were dramatic. For those patients who had the translocation, the median disease-free
    survival with `Crizotinib` was a year, compared to just a few months with the
    standard of care. Thus, even in a trial that involved only a small number of patients
    that were compared to historical controls, it was obvious that the drug was active.
    In contrast, in an unselected patient population, most patients did not benefit
    from this drug and it was unclear whether the drug had any activity.


    (Crizotinib is expected to receive regulatory approval for treatment of ALK translocation-positive
    lung cancer within the next year.)


    As illustrated in [Box 2-4](../Text/chapter02.xhtml#box_2-4), data sharing is
    essential to the development of precision medicine. Data sharing needs to occur
    across companies and across academic institutions to ensure that everyone benefits
    from fundamental biological knowledge. Institutions need to be convinced that
    they gain from openness. Broad engagement of a vast array of public and private
    stakeholders, including university scientists, regulators, health-care providers,
    payers, government, and perhaps most importantly the public at large, will be
    required to support and sustain the changes required for development of innovative
    new therapies based on the proposed `Knowledge Network of Disease` and associated
    New Taxonomy.


    ### Public Attitudes Toward Information and Privacy


    Genetic privacy was a central preoccupation during the early years of genomics,
    which led to implementation of stringent regulatory procedures to limit the use
    of genetic data in patient-oriented research (Andrews and Jaeger 1991). Many privacy-related
    issues—ranging from insurance coverage to employment discrimination, social stigmatization,
    and the simple desire to be left alone—are by no means resolved, although passage
    of the `Genetic Information Nondiscrimination Act (GINA)` alleviates many concerns
    about such discrimination (Hudson et al. 2008). During the ensuing years, the
    diffusion of the internet into every corner of our lives is driving massive changes
    in public attitudes toward privacy. Research studies of public attitudes reveal
    deep ambivalence about informational privacy. In the particular arena of genetic
    information and health records, members of focus groups typically grasp the broad
    social benefits of sharing data. A consistent theme is that people who contribute
    their own information to public databases want to be asked for permission, to
    have a clear explanation of how the data will be used, and to be treated as true
    partners in the research process (Damschroder et al. 2007; Trinidad et al. 2010;
    Haga and O’Daniel 2011). Although privacy concerns remain, there is little evidence
    that the public has the extreme sensitivity toward genetic data that many researchers
    anticipated 25 years ago.

    '
  trans: '

    遗传学、分子生物学和信息技术近期取得了巨大进展，预计将带来新的治疗方法并改善医疗保健成果，同时降低整体医疗成本。然而，几乎没有证据表明这些益处正落实于主流医学（OECD
    2011）。相反，医疗成本在稳步增长，而且这些成本的增加并不一定会导致临床结果的显著改善（OECD 2011）。这种局面为广泛的利益相关者（包括医疗提供者、付费方、监管机构、患者和药物开发人员）制造了“完美风暴”。现状的经济状况是不可持续的，需要发生改变。


    临床和基础研究人员已经了解到，为了让他们集体努力能够提供负担得起的医疗保健改进，需要加强合作与协调。需要公私部门的合作，将纵向健康结果数据与技术和基础研究的新进展相结合。此类倡议对于获取和应用开发治疗和预防新方法所需的特定生物学知识至关重要。一个动态演化的`Knowledge
    Network of Disease`（疾病知识网络）将提供一个框架，使临床与基础研究人员之间更密切、更有效的关系蓬勃发展。


    在制药和生物技术行业，变革的需求比任何地方都更加明显和紧迫。尽管过去十年中可用基因组和分子信息量大幅增加，但每年开发的有效新疗法数量一直保持稳定，而开发每种成功疗法的成本却剧增（Munos
    2009）。虽然新的分子技术识别了大量新药物靶点，但对这些靶点的生物学理解不足，导致昂贵的临床试验的失败率不断上升（Arrowsmith 2011a,b）。药物开发的现状是不可持续的。制药行业和生物技术行业现在正成为开发公私合作和联盟的领先倡导者，在这些联盟中，纵向临床结果数据可以与新的分子技术相结合，以开发基于生物学机制重新定义疾病所需的深度生物学理解。鉴于私人实体寻求投资回报的时间跨度，他们更有意愿将其中许多信息视为非竞争性信息。因此，信息本身以及获取这些信息的成本必须被广泛共享。


    ### 精准医疗


    拟议的`Knowledge Network of Disease and New Taxonomy`（疾病知识网络与新分类法）的主要受益者将是所谓的“精准医疗”。在精准医疗中，最终终点是选出一组具有共同疾病生物学基础的患者，这些患者最有可能从药物或其他治疗（如特定的手术程序）中获益。如今，研究人员在涉及未筛选患者的试验中，寻找受治疗患者与未治疗患者之间相对微小的差异，而对患者或疾病之间的生物学异质性缺乏洞察。与更具针对性的研究设计相比，这种方法在评估新疗法有效方面需要更多的患者、更多的时间和更高的成本。通过精准医疗方法关注药物开发过程中早期那些最有可能受益的患者，可能会产生更少的副作用并降低成本。在此类研究中，合从性可能会更好，治疗持续时间更长，治疗效益也比传统设计更明显。更大的治疗差异还可能导致更高效的监管审批，以及被医生和付费方更快地采纳。


    Box 2-4 用于药物开发的精准医疗


    精准医疗方法开发药物的一个成功案例涉及药物`Crizotinib`（克瑞替尼），它是 `MET` 和 `ALK` 激酶的抑制剂，在广泛的肺癌患者群体中开始临床开发（Kwak
    et al. 2010）。在制药行业科学家进行的首次`Crizotinib`临床试验早期，一个独立的学术科学家小组发表了发现：一种涉及编码 `ALK` 基因的特定染色体易位驱动了部分非小细胞肺癌患者的肿瘤生长（Soda
    et al. 2007）。获取这一知识使制药行业科学家能够修改他们的临床试验，专门针对具有这种易位的患者组进行，结果是惊人的。对于那些具有易位的患者，使用`Crizotinib`
    的中位无进展生存期为一年，而标准治疗法仅为短短几个月。因此，即使在一个仅涉及少数患者并与历史对照组进行比较的试验中，也显而易见该药物是有效的。相比之下，在未筛选的患者群体中，大多数患者并未从这种药物中获益，尚不清楚该药物是否有任何活性。


    （Crizotinib 预计将在明年内获得治疗 ALK 易位阳性肺癌的监管批准。）


    如 Box 2-4 所示，数据共享对于精准医疗的发展至关重要。数据共享需要在跨公司和跨学术机构之间进行，以确保每个人都能从基础生物学知识中获益。需要说服这些机构从开放中获益。需要广泛参与大量的公共和私人利益相关者，包括大学科学家、监管机构、医疗提供者、付费方、政府以及可能最重要的广大公众，以支持和维持基于拟议的`Knowledge
    Network of Disease`及相关新分类法开发创新疗法所需的改变。


    ### 公众对信息和隐私的观点


    遗传隐私是基因组学早期的核心关注，这导致了严格监管程序的实施，以限制遗传数据在以患者为向的研究中使用（Andrews and Jaeger 1991）。许多隐私问题——从保险覆盖到就业歧视、社会污名化以及简单的不被打扰的意愿——完全没有解决，尽管《遗传信息无歧视法》（GINA）的通过通过缓解了许多对此类歧视的担忧（Hudson
    et al. 2008）。在随后的几年里，互联网渗透到生活的每一个角落，正驱动着公众隐私态的发生巨大变化。对公众态度的研究显示了他们对信息隐私的深层矛盾心理。在遗传信息和健康记录的特定领域，焦点小组的成员通常能理解共享数据的广泛社会利益。一个贯的主题是，向公共数据库贡献信息的人希望被征求，获得有关数据如何使用的清晰解释，并被视为研究过程中的真正伙伴（Damschroder
    et al. 2007; Trinidad et al. 2010; Haga and O’Daniel 2011）。尽管隐私担忧仍然存在，但没有证据表明公众对遗传数据的敏感程度达到了许多研究人员
    25 年前预想的那种程度。

    '
