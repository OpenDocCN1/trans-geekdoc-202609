    试点研究旨在建立遗传或代谢组变异与疾病亚分类之间新的联系，这通常对疾病管理和预防具有意义。更重要的是，这些研究将为加速分子数据使用方式的转变提供必要的经验。例如，具有足够范围和规模的试点项目可能会导致新的发现模型的发展，包括患者小组根据共同的临床特征进行自组织，并随后努力产生相关的分子数据模型。此类倡议还允许以有利于未来的方式解决许多物流、伦理和生物信息学挑战，并引导床旁发现（point-of-care
    discovery）工作向可持续的实施迈进。


    ## 基于开放数据共享的研究模型需要对数据访问、知情同意和共享政策进行更改


    开发疾病知识网络的研究需要解决复杂的伦理和政策挑战，包括知情同意、保密、向患者返回个人结果以及监管（Cambon-Thomsen et al. 2007;
    Greely 2007; Hall et al. 2010）。


    委员会对疾病知识网络的愿景及其对未来患者的相关利益，只有在公众支持“研究对材料和临床数据的访问”与“对捐赠者价值观和偏好的尊重”之间达成新平衡时才能成为现实。最终，“患者数据或材料”与“从这些研究中受益的人”之间不应存在二元对立。为研究提供材料和数据的患者也将获得研究导致知识网络以及由此产生的新分子基础分类法带来的益处。


    如何解决这些伦理和政策挑战，以便前述试点研究能够进行？委员会建议由适当的联邦机构启动流程，以评估与创建知识网络和信息公社（Information Commons）所需的研究相关的隐私问题。由于这些问题已经得到了广泛研究，该过程无需从头开始。然而，在实践中，希望参加上述试点研究的研究人员，以及必须批准其人类受试方案的机构审查委员会（IRB），需要关于适用于这些项目的知情同意流程范围的特定指导。在现行法律和通行伦理标准的限制下，委员会鼓励在提供的指导中尽可能保持灵活性。应尽可能通过在不同医疗环境中开展的试点项目中所获得的一线经验，而非自上而下的指令，来主这一敏感领域最佳实践的形成，该领域的处理方式将对整个信息公社/知识网络/新分类法倡议产生决定性的影响。纳入医疗提供者和其他学术界以外的利益相关者是至关重要的。


    解决这些问题的方法包括：


    1. **关于包含健康和疾病个人中心数据的信息公社的收益进行深入对话。这种对话应包括研究人员、公众、患者代表和疾病倡导小组。** 那些因历史滥用行为而对研究产生怀疑的社区将加强信任。在委员会召开的研讨会上，我们听到患者倡导者和公众代表有力地认为，提高研究透明度以及加强研究人员、研究机构与公众之间的合作将促进研究。例如，在进行建设性参与时，倡导小组通过帮助设计对患者有吸引力的研究、宣传项目、帮助招募参与者以及募集资金支付研究经费，推动了生物医学研究的发展（Giusti
    2011; Patients [LikeMe.com](http://LikeMe.com) 2011）。


    2. **探索知情同意的方法，允许患者对细节尚不确定的未来研究提供广泛同意。** 一旦获得关于其数据和生物材料将如何用于研究的简洁、易懂的信息，许多患者只要被视为提供广泛公共利益的活动中的真实伙伴，就愿意同意（IOM
    2010a; Trinidad et al. 2011）。另一方面，一些患者会普遍反对将最初为临床目的而收集的“剩余”标本进行研究使用，或者更具体地说，反对将其用于某些类型的研究。这些担忧必须得到审慎处理。目前的研究知情同意方法依赖于冗长、复杂的同意表，这可能会阻碍参与，同时对帮助参与者理解研究本质几乎没有帮助。正如下文所述，《健康保险可携带性与责任法案》（`HIPAA`）要求每项特定研究都需要获得授权或豁免：对这一要求的常见解释如此严苛，以至于研究人员和机构审查委员会阻碍或实质性地延迟了开发信息公社所需的此类类型的研究。


    3. **在监管和治理方面提供强有力的公众代表和投入。** 公众对生物样本库和研究项目的参与将建立信任（Levy et al. 2010），并帮助解决研究过程中出现的问题，例如是否向分析了其生物材料的人员返回个人研究结果（Beskow
    et al. 2010a）。如前所述，关于研究人员可能对参与者具有临床相关结果的“告知义务”的灰色地带需要进一步明确。


    `HIPAA` 要求联邦政府制定保护个人健康信息隐私的法规。`HIPAA` 隐私法规旨在保护患者隐私，但从几个方面抑制了需要对个人患者数据进行广泛共享和多用途使用的研究（IOM
    2009）：首先，关于个人的丰富分子数据（特别是全基因组测序）在 `HIPAA` 下可能被视为独特的生物标识符，即使去除了明显的标识符。尽管在某些可能会授予使用可识别健康信息的豁免，但许多医疗机构不愿参与。其次，由于
    `HIPAA` 不允许对未指定的未来研究或多个项目同时授权，必须对患者数据的每次特定用途进行授权。第三，向患者说明数据研究用途的账目说明”的要求负担过重，并阻碍了数据共享。这些法规是对本报告所设想的试点项目的有力威慑。

    '
