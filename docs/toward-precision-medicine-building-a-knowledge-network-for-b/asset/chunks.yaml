    即便在 100 年前，《国际死因清单手册》第二修订版（Wilbur 1911）——该手册随时间推演演变为《疾病和相关健康问题国际统计分类》（`ICD`）——也将肺癌和脑癌归类为“其他器官或未指明的癌症”。当时的分类方法未能对
    1 型和 2 型糖尿病进行区分，内分泌疾病被归类为“一般疾病”，并存在“神经性热”、“衰竭”和“发现尸体”等类别。


    如今，正处于第十次修订的 `ICD` 仍然是最常用的疾病分类方法（WHO 2007）。`ICD-10` 由世界卫生组织（WHO）发布，用于统计分析、报销和决策支持，使其成为全球医疗保健体系不可或缺的一部分。正如后文将讨论的，`ICD`
    目前正在进行重大修订，预计于 2015 年左右发布 `ICD-11`。


    # 生物医学研究与医学实践界的分类需求


    ../Text/contents.xhtml#a5


    分类法支撑着许多健康相关系统，例如医学教育课程的组织、已发表的生物医学文献^(3)、教科以及如 `ICD` 等疾病编码系统。尽管分类法基于对疾病的科学理解，但像
    `ICD` 必须满足全球不断扩张的公共卫生和医疗保健社区的需求。像 WHO 这样的组织必须获取多个大陆准确且及时的疾病发病率和患病率数据以做出建议。同样，美国的医疗行业也依赖准确的疾病分类系统来跟踪医疗服务的提供并确定报销率。这两个社区都依赖高度稳健的数据收集实践来做出影响数百万人的决策。在这种背景下，正式的命名法对于清晰的交流和理解至关重要。目前定期更新
    `ICD` 命法的做法试图平衡两点：（1）需要一致的术语，以便根据公认标准定义的疾病进行清晰沟通；（2）需要确保分类系统（即分类法）能够充分反映我们对导致疾病起源和病变的分子通路及环境因素理解的进展。


    然而，部分由于必须服务于公共卫生和医疗保健社区的行政需求，当前的 `ICD` 分类法与大部分生物医学研究社区是脱节的（参见 图 1-1）。事实上，很少有基础研究人员知道
    `ICD` 的存在，更少有人使用这种分类。因此，两个广泛的利益相关群体——一方面是生物医学研究人员、生物技术和制药行业，另一方面是临床医生、卫生机构和支付方——被广泛认为很大程度上相互独立，具有不同的利益和目标，因此具有不同的分类需求。这是遗憾的，因为来自基础研究的人类疾病新见解，以及基础生物学和医学信息的爆炸，潜力彻底变革疾病分类、诊断、治疗开发和临床决策。然而，在充分实现这一潜力并获得更多个性化治疗和改善患者预后等相关收益之前，还需要对这些多样化社区可用信息资源进行更多整合。


    ![images/p14.jpg](img/p14.jpg)


    **图 1-1** 整合将使所有利益相关社区受益../Text/contents.xhtml#fi_1-1。


    (A) 认为不同的利益相关社区具有不同的分类和信息需求。(B) 信息的整合和需求的合并可以更好地服务所有利益相关者。


    来源：疾病新分类开发框架委员会。


    # 当前分类法错失的机会


    ../Text/contents.xhtml#a6


    目前使用的疾病分类法具有限制其信息内容和可用性的属性。最重要的是，当前的疾病分类法（包括 `ICD-10`）主要基于症状、对患病组织和细胞的显微检查以及其他形式的实验室和影像研究，其设计未能优化整合或利用快速涌的分子数据、患者偶然特征或社会环境对疾病的影响。当前分类系统整合基础知识的能力也受其基础结构的限制。从历史上看，分类法依赖层级结构，将单个疾病相继细分为类型和亚型。这种僵化的组织结构阻止了描述疾病之间以及疾病与大量病因之间复杂的相互关系。它还会导致根据不同症状将具有分子机制的疾病人为分开。例如，`LMNA`
    基因的突变会导致一系列多样化的疾病，包括埃默里-德雷弗肌肉萎缩症、夏科特-马氏轴性神经病、脂肪营养不良和早早衰老疾病。然而，尽管这些疾病具有显著的遗传、分子和细胞相似性，它们目前仍被归类为关系较远。虽然这种方法在治疗主要针对症状而非病因的时代可能是充分的，但存在一个明显的风险：继续依赖层级分类法将阻碍（尽管某些疾病已成功）在治疗上利用快速扩展的的努力。


    ## 框 1-2 费克斯纳时刻？../Text/contents.xhtml#bo_1-2


    1910 年，教育家亚伯拉罕姆·费克斯纳（Abraham Flexner）发布了一份报告，通过倡导专业化、高学术标准以及基础科学的紧密结合，彻底改变了医学教育（Flexner
    1910）。随后，强调研究的学术医学中心的兴起——结合二战后通过国家卫生协会和其他公共私营实体大幅增加基于绩效的研究经费——使美国能够在医学研究领域占据全球领先地位，创立了生物技术行业，并引领了无数基于科学的医疗创新。


    目前正在进行的分子知识大扩张，其收益可能与 20 世纪初医学和生物医学研究专业化所伴随的影响相当。事实上，在委员会研讨会的演讲中，梅奥医学学院教授、`ICD-11`
    开发领导者 Christopher G. Chute 博士表示，基因组学转型医学的潜力“远超抗生素和无菌手术的引入”。然而，实现分子革命的全部潜力将需要——并在很大程度上能够——以费克斯纳规模重新思考生物医学研究和医疗保健。


    '
