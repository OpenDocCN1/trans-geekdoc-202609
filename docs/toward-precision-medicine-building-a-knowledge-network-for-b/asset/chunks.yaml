  trans: '

    `Isaac (Zak) S. Kohane` 是儿童医院信息学计划主任，同时也是哈佛医学院（HMS）儿科与健康科学及技术的亨德森教授。他还担任`HMS 生物医学信息学中心`的共同主任以及`HMS
    Countway 医学图书馆`的馆长。Kohane 博士在哈佛医学院及其附属医院领导了多项合作项目，利用基因组学和计算机科学来研究疾病（特别是癌症和自闭症）。他开发了多项计算机系统，允许多个医院系统作为“活实验室”，在保护患者隐私的同时研究疾病的遗传基础。其中，`i2b2`（整合生物学与临床床的信息学）国家计算中心已部署在国际范围内的
    52 多个学术医疗健康中心。


    Kohane 博士在医学文献上发表了 180 多篇论文，并撰写了一本关于微阵列在整合基因组学广泛应用的著作。他被选入多个荣誉协会，包括美国临床调查协会、美国医学信息学学院和医学研究所。他领导哈佛和麻省理工健康科学与技术学院的基因组学与生物信息学博士课程。他也是一名执业儿科内分泌学家，三个三个充满活力的孩子的父亲。


    `Manuel Llinás` 是普林顿大学分子生物学助理教授，也是该校 Lewis-Sigler 整合基因组学研究所的成员。Llinás 博士在加州大学伯克利分校获得分子与细胞生物学博士学位，并在加州大学旧金山分校的`Joseph
    DeRisi`实验室进行博士后工作。他于 2005 年加入普林顿大学教职工。Llinás 博士的实验室研究人类疟原虫中最致命的——间疟虫（`Plasmodium
    falciparum`）。他的研究结合了功能基因组学、分子生物学、计算生物学、生物化学和代谢组学的工具，以理解导致这种寄生虫发育的基础分子机制。其重点范围内是红细胞发育阶段，这是疟疾疾病所有临床表现发生的阶段。他的研究集中在两个主要领域：转录调节在协调寄生虫发育中的作用，以及对疟原虫独特代谢网络的深度表征。在转录方面，Llinás
    实验室致力于表征在`间疟虫`基因组中发现的首类 DNA 结合蛋白——棘形虫`AP2`（`ApiAP2`）蛋白。代谢组学工作开始识别寄生虫中独特的生化通路结构，包括一种新型的分支
    TCA 循环。这两种方法探索了疟疾领域相对处女的领域，旨在寻找治疗干预的新策略。


    `Bernard Lo`医学博士是加州大学旧金山分校（UCSF）医学教授及医学道德计划主任。他还是生物伦理`Greenwall 教授学者计划`的国家项目主任，这是一项针对生物伦理研究者的职业发展奖。他指导
    NIH 资助的 UCSF 临床转化科学研究所的`监管知识支持部分`，并担任艾病预防研究中心`政策与伦理核心`的共同主任。他担任`UCSF 干细胞研究监督委员会`主席。他还是加州再生医学协会`标准工作小组`的共同主席，该小组负责为加州政府资助的干细胞研究提供监管建议。他是疾病控制预防中心（`CDC`）主任顾问委员会伦理小组的成员。他担任
    NIH 资助的 HIV 疫苗试验、长期氧疗法试验（`LOTT`）的数据监员委员会（`DSMBs`）成员，以及 HIV 预防试验网络的伦理工作小组成员。他还是人类研究保护计划认证协会的董事会成员。他是医学研究所（`IOM`）成员，曾担任`IOM
    委员会`成员以及`IOM 健康科学政策委员会`主席。他曾担任 2009 年关于医学利益冲突的 `IOM 委员会`主席以及此前若干报告的负责人。Lo 博士是《解决伦理困境：临床医生指南》（第
    4 版，2010 年）和《临床研究中的伦理问题》（2010 年）的作者。


    `Tom Misteli` 是美国国家癌症研究所（NIH）高级研究员及`基因组细胞生物学`组长。Misteli 博士在英国伦敦大学获得博士学位，在纽约`冷泉港实验室`完成博士后工作后加入了`NCI`。他通过开发活细胞显微镜技术研究完整细胞中的基因组核组织和基因表达，开创了基因细胞生物学领域，他的实验室旨在将这些知识用于开发癌症和衰老的新型诊断和治疗策略。Misteli
    博士因其工作获得多项奖项，目前担任《细胞生物学杂志》和《当前细胞生物学观点》的主编。


    `Sean J. Morrison` 博士是德克萨斯大学西南医学中心儿童研究中心主任及儿科遗传学玛丽·麦德森·库教授，同时也是霍华·霍格斯医学研究所的研究员。


    Morrison 实验室正在研究调节神经和造血系统中干细胞功能的机制，以及这些机制如何被癌症细胞劫持以实现肿瘤增殖和转移。Morrison 实验室特别关注调节干细胞自我更新、干细胞衰老的机制以及这些机制在癌症中的作用。在两种组织中对这些机制进行平行研究揭示了不同类型的干细胞和癌症细胞在多大程度上依赖相似机制来调节其功能。


    Morrison 实验室发现了许多区分干细胞自我更新与限制性祖细胞增殖的关键机制。他们证明干细胞自我更新受原癌基因和肿瘤抑制基因网络的调节，且原癌基因与肿瘤抑制基因信号之间的平衡随年龄变化。这可能解释了为什么癌症患者的突变谱会随年龄变化，因为不同的机制在不同年龄的患者中能够过度激活自我更新通路。Morrison
    实验室进一步表明，在某些癌症中，许多肿瘤细胞能够驱动疾病的生长和进展，而另一些癌症是由少数具有“干细胞”特征的细胞亚群驱动的。这些对自我更新细胞和分子机制的见解，为促进正常组织再生和癌症治疗提供了新方法。

