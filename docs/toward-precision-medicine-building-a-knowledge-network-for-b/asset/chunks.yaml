    [Summary](../Text/contents.xhtml#a0)


    The Committee’s charge was to explore the feasibility and need for “a New Taxonomy
    of human disease based on molecular biology” and to develop a potential framework
    for creating one. Clearly, the motivation for this study is the explosion of molecular
    data on humans, particularly those associated with individual patients, and the
    sense that there are large, as-yet-untapped opportunities to use these data to
    improve health outcomes. The Committee agreed with this perspective and, indeed,
    came to see the challenge of developing a New Taxonomy of Disease as just one
    element, albeit an important one, in a truly historic set of health-related challenges
    and opportunities associated with the rise of data-intensive biology and rapidly
    expanding knowledge of the mechanisms of fundamental biological processes. Hence,
    many of the implications of the Committee’s findings and recommendations ramify
    far beyond the science of disease classification and have substantial implications
    for nearly all stakeholders in the vast enterprise of biomedical research and
    patient care.


    Given the scope of the Committee’s deliberations, it is appropriate to start this
    report by tracing the logical thread that unifies the Committee’s major findings
    and recommendations and connects them to its statement of task. The Committee’s
    charge highlights the importance of taxonomy in medicine and the potential opportunities
    to use molecular data to improve disease taxonomy and, thereby, health outcomes.
    Taxonomy is the practice and science of classification, typically considered in
    the context of biology (e.g., the Linnaean system for classifying living organisms).
    In medical practice, taxonomy often refers to the International Classification
    of Diseases (ICD), a system established more than 100 years ago that the World
    Health Organization uses to track disease incidence, physicians use as a basis
    for standardized diagnoses, and the health-care industry (specifically, clinicians,
    hospitals, and payers) uses to determine reimbursement for care. Although the
    Committee was cognizant that any new-taxonomy initiative must serve the needs
    of the ICD and related classification systems, it concluded that this goal could
    best be met by rooting future improvements in disease classification in an “Information
    Commons” and “Knowledge Network” that would play many other roles, as well. The
    Committee envisions these data repositories as essential infrastructure, necessary
    both for creating the New Taxonomy and, more broadly, for integrating basic biological
    knowledge with medical histories and health outcomes of individual patients. The
    Committee believes that building this infrastructure—the Information Commons and
    Knowledge Network—is a grand challenge that, if met, would both modernize the
    ways in which biomedical research is conducted and, over time, lead to dramatically
    improved patient care (see [Figure S-1](../Text/frontmatter06.xhtml#fig_S-1)).'
