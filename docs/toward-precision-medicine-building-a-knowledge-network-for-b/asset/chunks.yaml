- raw: "An Information Commons and Knowledge Network with appropriate informatic and\
    \ consent mechanisms could generate similar large longitudinal sample sets and\
    \ data through the provision of regular medical care, rather than considering\
    \ these as research studies external to the health systems.\n\nWhile the use of\
    \ data from EHRs faces many difficulties, none of these difficulties is insurmountable.\
    \ The cost advantages and potential to advance clinical care make expanding and\
    \ accelerating studies using EHRs a high priority. Several health-care systems\
    \ in the United States have started accruing large EHR databases linked to clinical\
    \ biosamples. Notable among the U.S. efforts are the Harvard University/Partners\
    \ Healthcare i2b2 effort, the Vanderbilt BioVu effort (Roden et al. 2008), the\
    \ UCSF-Kaiser collaboration (discussed in [Chapter 4](../Text/chapter04.xhtml))\
    \ and the multi-center eMERGE Network (McCarty et al. 2011) (see [Box 2-3](../Text/chapter02.xhtml#box_2-3)).\n\
    \nSince EHR systems cover a broad swath of human illness, they provide a unique\
    \ research opportunity to explore genotype-phenotype associations across many\
    \ diseases. As articulated by Jones et al. (2005) and implemented by Denny et\
    \ al. (2010), all diseases can be scanned using EHRs for significant associations\
    \ with any genetic variant or set of variants. For example, a single genetic variant\
    \ (e.g., a single nucleotide polymorphism or SNP) associated with diabetes in\
    \ a standard genetics study can be promptly assessed for correlation with every\
    \ EHR-derived phenotype such as obesity, heart disease, smoking history, and hypothyroidism.\
    \ This approach has been colloquially termed PheWAS (Phenome-Wide Association\
    \ Study), in contrast with the more widely developed approach called GWAS (Genome-Wide\
    \ Association Study). Such a scan may show that the original association is either\
    \ an epiphenomenon of another pathology or part of a broader pathotype (Loscalzo\
    \ et al. 2007). This approach provides an opportunity to explore this broader\
    \ range of pathological mechanisms across a variety of disease types, which is\
    \ not possible in single phenotype studies. The power of such association studies\
    \ to detect relationships between genotype and disease is limited by the granularity\
    \ and precision of the current taxonomic system for disease. A knowledge-network-derived\
    \ taxonomy that distinguishes diseases with different biological drivers would\
    \ enhance the power of association studies to uncover new insights.\n\n[**Box\
    \ 2-3  \n\nThe eMERGE Consortium**](../Text/contents.xhtml#bo_2-3)\n\nThe Electronic\
    \ Medical Records and Genomics (eMERGE) Network ([www.gwas.org](http://www.gwas.org))\
    \ is an NIH-funded consortium of five institutions with DNA data linked to electronic\
    \ medical records. (All of the institutions agreed to contribute their genomic\
    \ association results to dbGAP at the National Library of Medicine.) The goal\
    \ of the consortium is to assess the utility of electronic medical records (EMRs)\
    \ as resources for genomic science. The project includes an ethics component,\
    \ community engagement, and the use of natural language processingto interpret\
    \ EMRs. Each institution individually had proposed a genome-wide association study\
    \ (GWAS) of about 3,000 subjects with a particular phenotype of interest (e.g.\
    \ type 2 diabetes, cataracts, dementia, heart disease, and peripheral vascular\
    \ disease) and an associated comparison group.\n\nSeveral important lessons have\
    \ been learned from the consortium’s experience. First, patient data, obtained\
    \ during the normal course of clinical care, has proven to be a valid source for\
    \ replicating genome-phenome associations that previously had been reported only\
    \ in carefully qualified research cohorts. Second, although the individual institutions\
    \ initially thought that they had large enough effect sizes and odds ratios to\
    \ be adequately powered, in most cases, the entire network was needed to determine\
    \ genome-wide association. Third, high-quality EMR-derived phenotypes require\
    \ four elements: codes (including ICD codes, though codes have to be repeated\
    \ multiple times to gain validity), laboratory-medicine results, medication histories,\
    \ and natural language processing of physician comments. The ability to extract\
    \ high-quality phenotypes from narrative text is essential along with codes, laboratory\
    \ results, and medication histories to get high predictive values. Fourth, although\
    \ the five electronic medical systems have widely varying structures, coding systems,\
    \ user interfaces, and users, once validated at one site, the information transported\
    \ across the network with almost no degradation of its specificity and precision.\n\
    \nAnother lesson of critical importance was that the major impediments that the\
    \ eMERGE Consortium has had to address are policy related, rather than technical.\
    \ For instance, a particular challenge has been to achieve both meaningful data\
    \ sharing and respect for patient privacy concerns, while adhering to applicable\
    \ regulations and laws (Kho et al. 2011; Masys 2011; McGuire et al. 2011) (eMERGE\
    \ has addressed this issue, in part, by developing a simplified Data Use Agreement—see\
    \ [Appendix D](../Text/backmatter05.xhtml).)\n\n[GATHERING INFORMATION FROM INFORMAL\
    \ DATA SOURCES](../Text/contents.xhtml#a14)\n\nThe explosive growth of social\
    \ networks, particularly in the context of healthcare issues, may also serve as\
    \ a novel source of data on health and disease. Evidence is already accumulating\
    \ that these alternative and “informal” sources of health-care data, including\
    \ information shared by individuals from ubiquitous technologies such as smart\
    \ phones and social networks, can contribute significantly to collecting disease\
    \ and health data (Brownstein et al. 2008, 2009, 2010a,b).\n\nMany data sources\
    \ exist outside of traditional health-care records that could be extremely useful\
    \ in biomedical research and medical practice. Informal reports from large groups\
    \ of people (also known as “crowd sourcing”), when properly filtered and refined,\
    \ can produce data complementary to information from traditional sources. One\
    \ example is the use of information from the web to detect the spread of disease\
    \ in a population. In one instance, a system called HealthMap, which crawls about\
    \ 50,000 websites each hour using a fully automated process, was able to detect\
    \ an unusual respiratory illness in Veracruz, Mexico, weeks before traditional\
    \ public-health agencies (Brownstein et al. 2009). It also was able to track the\
    \ progression and spread of H1N1 on a global scale when no particular public-health\
    \ agency or health-care resource could produce that kind of a picture.\n\nThe\
    \ use of mobile phones also has tremendous potential, especially with developers\
    \ building apps that engage patient populations. For example, a recent app called\
    \ Outbreaks Near Me allows people to use their cell phones to learn about all\
    \ the disease events in their neighborhood. People also can report back to the\
    \ system, putting their own health information into the system.\n\nMany of the\
    \ social networking sites built around medical conditions are patient specific\
    \ and allow individuals to share unstructured information about health outcomes.\
    \ Mining that information within proper ethical guidelines provides a novel opportunity\
    \ to monitor health outcomes. For example, Google has mined de-identified search\
    \ data to build a picture of flu trends. The advent of these inexpensive ways\
    \ of collecting health information creates new opportunities to integrate information\
    \ that will enhance the diagnosis and treatment of disease.\n\n[INTEGRATING CLINICAL\
    \ MEDICINE AND BASIC SCIENCE](../Text/contents.xhtml#a15)"
