  trans: '


    ### 3. 逐步消除制度、文化和监管障碍，以广泛共享个人分子图谱和健康史，同时保护患者的权利。


    在多方（包括患者、医生、保险公司、制药行业和学术研究小组）之间共享个人患者数据是至关重要的。目前关于知情、保密、数据保护与所有权、医疗费用报销以及知识产权的政策需要进行修改，以确保研究数据在不损害患者利益的情况下在所有利益相关者之间自由流动。


    #### 疾病研究的新发现模型


    目前将分子数据与诊断及临床结果联系起来的模型，通常涉及将少数患者的临床数据从临床环境抽象化并转移到研究环境，然后尝试在抽象的临床数据与分子数据（如遗传多态性、基因表达水平和代谢组图谱）之间建立相关性。当发现被判定为确定性且具有潜在价值时，将努力将这些信息返回临床环境——例如，作为遗传或基因组诊断测试。


    这种模型在发现点和治疗点之间造成了巨大的鸿沟，导致关键利益相关者之间存在许多误解甚至不沟通的机会。例如，针对欧洲血裔的人群进行的全基因组关联研究（`GWASs`）数量是其他群体的约十倍（Need
    and Goldstein 2009）。随着个性化基因组学以及其他个性化“组学”成为临床环境的常态，目前的模型也未能利用未来可能常规生成的丰富分子数据。也许最严重的是，目前的发现模型没有为数据密集型生物学与医学之间经济上可持续的整合提供路径。


    委员会认为，对这种发现模型进行根本性转变既是理想的，也是最终不可避免的。与其将临床数据和患者样本转移到研究小组进行分析，不如应该让患者的分子数据直接供研究人员和医疗保健供应商使用。委员会意识到这是对当前实践的彻底背离，面临着重大挑战，尽管如此，由于我们相信这种新发现模型将带来巨大的收益，我们认为应该采取激进的步骤来实现它。


    科学、信息技术、医学和社会态度的变化——如`第 2 章`中讨论的——为实施这一模型提供了机会。事实上，已经有一些进行的研究倡议具有具体实例，证实了委员会的信念：通过特别努力实施其核心建议是可以实现的。除了`第
    2 章`中讨论的`eMERGE 联盟`之外，一个很好的例子是`Kaiser-Permanente 北加州`与`加州大学圣弗朗西分校 (UCSF)`之间的合作。Kaiser
    成员被邀请参加一项研究，该研究将允许遗传和其他分子数据与其完整的电子健康记录进行比较。这项研究面临了巨大的障碍，从概念化到大规模获取遗传数据花费了十多年时间。一个关键挑战是在
    Kaiser 成员、管理层和监督小组（如相关的机构审查委员会）之间建立信任。虽然所有方都认为，让被要求“加入（opt in）”研究的 Kaiser 成员充分了解其目标是至关重要的，但用于教育成员的宣展基础设施几乎是是从零开始创建的。第二个重大挑战是获得资金以涵盖生成与患者护理缺乏直接即时相关性的大量分子数据的成本——考虑到限制医疗成本的压力，不能期望
    Kaiser 本身承担这项责任。此外，改变对何构成适当知情同意的认知，需要对参与者进行昂贵且耗时的重新征得同意。尽管如此，在强力支持的机构内工作的坚定研究人员克服这些障碍的能力令人印象深刻：近
    20 万 Kaiser 成员加入了该研究，大规模数据收集现在正在进行。


    开创性的 UCSF-Kaiser 研究清楚地，基于直接使用患者数据的发现模型是可能的，即使其实施面临着重大障碍。为了应对和解决这些障碍，委员会设想设计几项针对性的试点研究。这些研究将探测这一新研究范式的关键方面，并向医疗保健供应商证明基于分子信息的疾病分类的价值。通过证明对患者的价值，试点研究将寻求为可持续的发现模型奠定基础，在该模型中，相关的经过验证的分子数据将在“治疗点”常规生成，因为它们符合适用于所有临床测试结果的通用风险效益标准。


    #### 试点研究应借鉴观察性研究


    如上所述，委员会认为，开发信息公社（Information Commons）所需的大部分初期工作应以观察性研究的形式进行。在这种情况下，我们说的观察性研究是指在正常的医疗过程中从个体身上收集分子和其他患者特定的数据，但对个人治疗的任何改变都不会取决于这些数据。这种发现方法已在使用，尽管目前大多数倡议引入的临床数据范围非常有限。注意的是，许多
    `GWASs` 比较了确诊疾病的人与未确诊疾病的人的基因组成（McCarthy et al. 2008）。例如，比较患有克罗恩病和未患克罗恩病的人的 `GWASs`
    确定了一些涉及克罗恩病病理生理学的基因变异，而对年龄相关性黄斑变性进行的类似比较则涉及补体因子 H（McCarthy et al. 2008; Ryu et
    al. 2010）。在其他情况下，在随机临床试验期间进行的观察性研究过程中，发现了临床相关的基因型-表型相关性。例如，进行了一项随机临床试验，以比较不同配方的干扰素
    α 在治疗慢性肝炎病毒感染中的。随后的观察性研究使用 `GWAS` 鉴定出 `IL28B` 基因附近的变异与治疗反应强相关（Ge et al. 2009）。该研究中识别出的基因变异检测已在广泛的临床中使用（PRNewswire
    2011; Scripps Health 2011）。


    个人参与这些研究对他们的诊断、治疗，以及大多数情况下对他们生活的其他任何情况都没有影响。这些观察性研究的目标仅仅是提出这样一个问题：“普通人群中是否存在某些基因变异，与最终获得特定诊断或产生特定治疗反应有关？”


    '
