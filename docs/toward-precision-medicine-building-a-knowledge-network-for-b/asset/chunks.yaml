- raw: 'The pilot studies are intended to lead to new connections between genetic
    or metabolomic variation and disease subclassifications, often with implications
    for disease management and prevention. More importantly, they will provide the
    lessons necessary to facilitate a more rapid transition in the way molecular data
    are used. For example, pilot projects of sufficient scope and scale could lead
    to the development of new discovery models, including those in which patient groups
    self-organize in recognition of shared clinical features and then pursue efforts
    to generate relevant molecular data. Such an initiative also would permit many
    logistical, ethical, and bioinformatic challenges to be addressed in ways that
    would benefit future efforts and lead toward the sustainable implementation of
    point-of-care discovery efforts.


    [A RESEARCH MODEL BASED ON OPEN DATA SHARING REQUIRES CHANGES TO DATA ACCESS,
    CONSENT, AND SHARING POLICIES](../Text/contents.xhtml#a37)


    Research to develop a Knowledge Network of Disease will need to resolve complex
    ethical and policy challenges including consent, confidentiality, return of individual
    results to patients, and oversight (Cambon-Thomsen et al. 2007; Greely 2007; Hall
    et al. 2010).


    The Committee’s vision of a Knowledge Network of Disease and its associated benefits
    for future patients will become a reality only if the public supports a new balance
    between research access to materials and clinical data and respect for the values
    and preferences of donors. Ultimately, there should be no dichotomy between “patient
    data or materials” and “those who benefit from this research.” The patients who
    are giving their materials and data for research would also receive the benefits
    of research leading to a Knowledge Network and the resulting new molecularly-based
    taxonomy.


    How might these ethical and policy challenges be resolved so that the pilot studies
    described previously might be carried out? The Committee recommends that an appropriate
    federal agency initiate a process to assess the privacy issues associated with
    the research required to create the Knowledge Network and Information Commons.
    Because these issues have been studied extensively, this process need not start
    from scratch. However, in practical terms, investigators who wish to participate
    in the pilot studies discussed above—and the Institutional Review Boards who must
    approve their human-subjects protocols—will need specific guidance on the range
    of informed-consent processes appropriate for these projects. Subject to the constraints
    of current law and prevailing ethical standards, the Committee encourages as much
    flexibility as possible in the guidance provided. As much as possible, on-the-ground
    experience in pilot projects carried out in diverse health-care settings, rather
    than top-down dictates, should govern the emergence of best practices in this
    sensitive area, whose handling will have a make-or-break influence on the entire
    Information Commons/Knowledge Network/New Taxonomy initiative. Inclusion of healthcare
    providers and other stakeholders outside the academic community will be essential.


    An approach to these issues might include:


    1.  *Intensive dialog about the benefits of an Information Commons containing
    individual-centric data about health and disease. This dialog should include researchers
    and the public, patient representatives, and disease advocacy groups.* Reaching
    out to communities that have been suspicious of research because of historical
    abuses would strengthen trust. At the workshop the Committee convened, we heard
    patient advocates and public representatives argue forcefully that more transparency
    regarding research and more collaboration among researchers, research institutions,
    and the public would facilitate research. For example, when constructively engaged,
    advocacy groups have advanced biomedical research by helping to design studies
    that are attractive to patients, publicized the projects, helped to recruit participants,
    and raised money to help pay for the research (Giusti 2011; Patients [LikeMe.com](http://LikeMe.com)
    2011).


    2.  *Exploration of approaches to informed consent that would allow patients to
    give broad consent for future studies whose details remain unspecified.* Once
    provided with concise, understandable information on how their data and biological
    materials would be used for research, many patients are willing to consent provided
    they are treated as true partners in an activity that will provide broad public
    benefit (IOM 2010a; Trinidad et al. 2011). On the other hand, some patients will
    object generally to the research use of “leftover” specimens originally collected
    for clinical purposes or, more narrowly, object to their use in certain types
    of research. These concerns must be carefully addressed. Current approaches to
    informed consent for research rely on long, complex consent forms that may deter
    participation while doing little to help participants understand the nature of
    the research. As noted below, the Health Insurance Portability and Accountability
    Act (HIPAA) requires authorization or waiver for each specific research study:
    common interpretations of this requirement are so restrictive that investigators
    and Institutional Review Boards thwart or substantially delay research of the
    type that will be needed to develop the Information Commons.


    3.  S*trong public representation and input on oversight and governance.* Public
    participation in biobanks and research projects would build trust (Levy et al.
    2010) and help resolve issues that arise in the course of research, such as whether
    to offer to return individual research results to persons whose biological materials
    are analyzed (Beskow et al. 2010a) As noted earlier, the gray areas around the
    potential that researchers may have a “duty to inform” participants of clinically
    relevant results need to be clarified.


    The HIPAA required the federal government to develop regulations for protecting
    the privacy of personal health information. The HIPAA privacy regulations, which
    are intended to protect patient privacy, inhibit research that requires widespread
    sharing and multi-purpose use of data on individual patients in several ways (IOM
    2009): First, rich molecular data about an individual (particularly whole-genome
    sequencing) could be considered a unique biological identifier under HIPAA, even
    if overt identifiers are removed. Although a waiver of authorization to use identifiable
    health information may be granted under certain circumstances, many health-care
    organizations are reluctant to participate. Secondly, because HIPAA does not allow
    authorization for unspecified future research or for several projects at one time,
    authorization must be given for each specific use of patient data. Thirdly, requirements
    for “accounting” to patients for research uses of data are burdensome and discourage
    data sharing. These regulations are strong deterrents to the kinds of pilot projects
    envisaged in this report.'
