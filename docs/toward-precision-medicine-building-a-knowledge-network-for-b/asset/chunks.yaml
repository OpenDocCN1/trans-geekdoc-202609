- raw: "Despite the focus on the individual patient in the creation of the Information\
    \ Commons, the Committee expects that the inclusion of patients from diverse populations\
    \ coupled with the incorporation of various types of information contained in\
    \ the exposome will result in a Knowledge Network that could also inform the identification\
    \ of population-level interventions and the improvement of population health.\
    \ For example, a better understanding of the impact of a sedentary lifestyle at\
    \ the molecular level could conceivably facilitate the development of new approaches\
    \ to physical education in early childhood. In addition, findings from the Knowledge\
    \ Network and the New Taxonomy could reveal yet unidentified behavioral, social,\
    \ and environmental factors that are associated with particular diseases or subclassifications\
    \ of diseases in certain populations and are amenable to public health interventions.\n\
    \n[**Box 3-1  \n\nThe Exposome**](../Text/contents.xhtml#bo_3-1)\n\nThe exposome\
    \ is a characterization of both exogenous and endogenous exposures that can have\
    \ differential effects on disease predisposition at various stages during a person’s\
    \ lifetime (Wild 2005; Rappaport 2011). The emerging science of exposomics is\
    \ concerned with the application of innovative approaches to comprehensively measure\
    \ a person’s exposure events, from conception to death, and determine how those\
    \ exposures relate to health and disease (CDC 2010; NAS 2010; Rappaport 2011).\
    \ A long-range goal is to ascertain the combined effects of these exposures by\
    \ assessing the biomarkers and diseases they influence.\n\nIn its broadest definition,\
    \ the exposome encompasses all exposures—internal (such as the microbiome, described\
    \ elsewhere in this report) and external—across the lifespan. Physical environment\
    \ (e.g., occupational hazards, exposure to industrial and household pollutants,\
    \ water quality, climate, altitude, air pollution, and living conditions (Smith\
    \ et al. 2008; Klecka et al. 2010; Alexeeff et al. 2011; Brookhart et al. 2011;\
    \ Cutts et al. 2011; Yorifuji et al. 2011; Zanobetti et al. 2011; McMichael and\
    \ Lindgren 2011) and lifestyle and behavior (e.g., diet, physical activity, cultural\
    \ practices, and use of addictive substances \\[DHHS 2010; Hu and Malik 2010;\
    \ Arem et al. 2011\\]), are some of the more apparent exogenous exposures. However,\
    \ the concept of the exposome extends beyond these factors to include social factors,\
    \ such as socioeconomic status, quality of housing, neighborhood, social relationships,\
    \ access to services, and experience of discrimination that can contribute to\
    \ psychological stress, poor health, and health inequities (Epel et al. 2004;\
    \ Krieger et al. 2005; IOM 2006; Cole et al. 2007; Unnatural Causes 2008; Bruce\
    \ et al. 2009; Gravlee 2009; Williams and Mohammed 2009; Cardarelli et al. 2010;\
    \ Kim et al. 2010; Pollack et al. 2010; CDC 2011; Karelina and DeVries 2011; Sternthal\
    \ et al. 2011; WHO 2011).\n\nDespite the many practical and methodological challenges\
    \ in characterizing and measuring these variables, rigorous evaluation of human\
    \ exposures is needed. By incorporating data derived from multi-level assessments,\
    \ a Knowledge Network of Disease could lead to better understanding of the variables\
    \ and mechanisms underlying disease and health disparities, thereby helping to\
    \ reveal a truer picture of the ecology of human health and facilitating a more\
    \ holistic approach to health promotion and disease prevention.\n\nThe Healthy\
    \ People 2020 Initiative (Healthy [People.gov](http://People.gov). 2011) emphasizes\
    \ an ecological approach to disease prevention and health promotion that focuses\
    \ on both individual-level and population-level determinants of health and interventions.\
    \ While molecular variables are often more easily measured and more directly tied\
    \ to disease outcomes, if the modifiable factors that have contributed to the\
    \ signature are known, we will be better able to prevent disease and to phenotype,\
    \ genotype, and treat patients.\n\nAsthma illustrates the interplay of social,\
    \ behavioral, environmental, and genetic factors in disease classification. It\
    \ is estimated that various types of asthma affect more than 300 million people\
    \ worldwide. The term “asthma” is now used to refer to a set of “signs and symptoms”\
    \ including reversible airway narrowing (“wheezing”), airway inflammation and\
    \ remodeling, and airway hyper-reactivity. These various signs and symptoms likely\
    \ reflect distinct etiologies in different patients. Many subjects with asthma\
    \ have an allergic component, while in other cases, no clear allergic contributor\
    \ can be defined (Hill et al. 2011; Lee et al. 2011). In some patients, asthma\
    \ attacks are precipitated by exercise or aspirin (Cheong et al. 2011). Some patients,\
    \ particularly those with severe asthma, may be resistant to treatment with corticosteroids\
    \ (Searing et al. 2010). This phenomenological approach to asthma diagnosis has\
    \ led to a plethora of asthma subtypes such as “allergic asthma,” “exercise-induced\
    \ asthma,” and “steroid-resistant asthma” that may be clinically useful but provide\
    \ little insight into underlying etiologies.\n\nOver the years, linkage-analysis,\
    \ candidate-gene, and genome-wide-association approaches have been applied to\
    \ the study of the genetic underpinnings of asthma, leading to the identification\
    \ of several associated genes and subphenotypes (Lee et al. 2011). However, these\
    \ findings still leave most of the genetic influences of asthma unexplained (Li\
    \ et al. 2010; Moffatt et al. 2010). Moreover, pediatric asthma research, in particular,\
    \ has focused on a broad range of social and environmental, as well as genetic,\
    \ contributors to the increased prevalence and severity of illness (Hill et al.\
    \ 2011). Since the burden of asthma disproportionately affects children living\
    \ in socioeconomically disadvantaged neighborhoods (D.R. Williams et al. 2009;\
    \ Quinn et al. 2010), asthma may prove useful as a model for testing the Knowledge\
    \ Network’s value in attaining a broader and deeper understanding of disease and\
    \ health, in both the clinical and public-health policy domains. A knowledge-network-derived-taxonomy\
    \ based on the biology of disease may help to divide patients with asthma—as well\
    \ as many other diseases—into subtypes in which the different etiologies of the\
    \ disorder can be better understood, and for which appropriate, subtype-specific\
    \ approaches to treatment and prevention can be devised and tested.\n\n[THE PROPOSED\
    \ KNOWLEDGE NETWORK OF DISEASE WOULD INCLUDE INFORMATION ABOUT PATHOGENS AND OTHER\
    \ MICROBES](../Text/contents.xhtml#a22)\n\nParticularly because of advances in\
    \ genomics, the proposed Knowledge Network of Disease has unprecedented potential\
    \ to incorporate information about disease-causing and disease-associated microbial\
    \ agents. Thousands of microbial genomes have been sequenced, providing a wealth\
    \ of data on pathogenic and non-pathogenic organisms, and there has been an associated\
    \ renaissance in studies of the molecular mechanisms of host-pathogen interactions.\
    \ In parallel with these advances in microbiology, the analysis of human-genome\
    \ sequences is enhancing the understanding of host responses and variation in\
    \ individual susceptibility to microbial pathogens and infectious diseases. Today,\
    \ sequence data, combined with other biochemical and microbiological information,\
    \ are being used to understand microbial contribution to health, improve detection\
    \ of pathogens, diagnose infectious diseases, and identify potential new targets\
    \ for novel drugs and vaccines. In addition, comparing the sequences of different\
    \ strains, species, and clinical isolates is crucial for identifying genetic polymorphisms\
    \ that correlate with phenotypes such as drug resistance, morbidity, and infectivity.\
    \ Combining this information with the molecular signature of the host will provide\
    \ a more complete picture of an individual’s diseases allowing custom-tailoring\
    \ of therapeutic interventions."
