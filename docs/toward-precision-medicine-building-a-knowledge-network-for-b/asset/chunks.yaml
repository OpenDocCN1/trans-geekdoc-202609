  trans: '

    一个具有适当信息处理和同意机制的公共信息共享与知识网络，可以通过提供常规医疗服务产生的大的大纵向样本集和数据，而不是将这些视为医疗系统外部的研究项目。


    虽然使用 `EHRs` 数据面临许多困难，但这些困难中没有不可逾越的。成本优势和推进临床护理的潜力使得扩大和加速使用 `EHRs` 的研究成为首要任务。美国的几个医疗保健系统已经开始积累与临床生物样本关联的大型
    `EHR` 数据库。美国这些工作中值得关注的是哈佛大学/合作伙伴医疗机构的 i2b2 项目、范德堡的 BioVu 项目（Roden 等人，2008）、UCSF-Kaiser
    合作项目（在 `第 4 章` 中讨论）以及多中心 eMERGE 网络（McCarty 等人，2011）（参见 `框 2-3 网络（`[www.gwas.org](http://www.gwas.org)`）是一个由
    NIH 资助的联盟，其 DNA 数据与电子医疗记录关联。（所有机构均同意将其基因组关联结果提交给国家医学图书馆的 `dbGAP`。）联盟的目标是评估电子医疗记录
    (`EMRs`) 作为基因组科学资源的效用。该项目包括伦理组成、社区参与以及使用自然语言处理来解释 `EMRs`。每个机构分别提议了针对约 3000 名具有特定感兴趣表型（例如
    2 型糖尿病、白内障、痴呆、心脏病和外周血管疾病）及相关比较组的受者的基因组关联研究 (`GWAS`)。


    从联盟的经验中获得了几条重要的教训。首先，在常规医疗过程中获得的患者数据已被证明是复制基因-表型关联的有效来源，而这些关联之前仅在经过仔细筛选的研究队列中报告过。其次，尽管各机构最初认为他们的效应量和优势比足够大，具有足够的统计效能，但在大多数情况下，需要整个网络来确定全基因组关联。第三，高质量的源自
    `EMR` 的表型需要四个要素：代码（包括 `ICD` 代码，尽管必须重复多次代码以获得有效性）、实验室医学结果、药史以及对医生注释的自然语言处理。从叙述性文本中提取高质量表型的能力与代码、实验室结果和药史同样至关重要，以获得高预测值。第四，尽管这五个电子医疗系统在结构、编码系统、用户界面和用户方面存在巨大差异，一旦在一个站点通过验证，跨越网络传输的信息其特异性和精确性几乎没有退化。


    另一个至关重要的教训是，`eMERGE` 联盟必须解决的主要障碍与政策有关，而非技术有关。例如，一个特殊的挑战是在遵守适用法规和法律的同时，实现有意义的数据共享和对患者隐私关注的尊重（Kho
    等人，2011；Masys 2011；McGuire 等人，2011）（`eMERGE` 通过开发简化的数据使用协议部分解决了这一问题——参见 `附录 D`）。


    ### 从非正式数据源获取信息


    `[../Text/contents.xhtml#a14]`


    社交网络的爆炸式增长，特别是在健康问题背景下，也可以作为健康和疾病数据的新颖来源。已有证据表明，这些替代性和“非正式”的医疗数据来源（包括个人通过手机和社交网络等无处不在的技术共享的信息）对收集疾病和健康数据有重大贡献（Brownstein
    等人，2008, 2009, 2010a,b）。


    传统的医疗保健记录之外存在许多数据源，这些源在生物医学研究和医学实践中可能极其有用。来自人群的非正式报告（也称为“众包”）在经过适当过滤和提炼后，可以产生与传统来源信息互补的数据。一个例子是利用网络信息检测人群中疾病传播。HealthMap
    系统每小时自动爬取约 50,000 个网站，在传统的公共卫生机构几周之前检测到墨西哥韦拉克鲁斯的一种罕见呼吸道疾病（Brownstein 等人，2009）。当没有特定的公共卫生机构或医疗资源能够产生此类图景时，它还能在全球范围内追踪
    `H1N1` 的进展和扩散。


    手机的使用也具有巨大的潜力，特别是开发者正在构建能够吸引患者群的应用程序。例如，最近一个名为 `Outbreaks Near Me` 的应用程序允许人们使用手机了解他们所在社区的所有疾病事件。人们还可以向系统反馈，将自己的健康信息输入系统。


    许多围绕医学疾病建立的社交网站是针对特定患者的，允许个人分享有关健康结果的非结构化信息。在适当的伦理准则下挖掘这些信息为监测健康结果提供了新颖机会。例如，`Google`
    挖掘了去标识的搜索数据以构建流感趋势图。这些廉价收集健康信息的方式出现为整合信息创造了新机会，从而增强疾病的诊断和治疗。


    ### 整合临床医学与基础科学


    `[../Text/contents.xhtml#a15]`

