    `Keith R. Yamamoto` 博士是加州大学旧金山分校细胞与分子药理学教授，该医学院执行副院长。他自 1976 年以来一直是 UCSF 的教职人员成员，曾担任
    `PIBS` 生物化学与分子生物学研究生计划主任（1988–2003 年）、生物化学与生物物理学系副主任（1985–1994 年）、细胞与分子药理学系主任（1994–2003
    年）以及医学院研究副院长（2002–2003 年）。


    Yamamoto 博士的研究关注细胞内受体的信号传导和转录调控，这些受体介导了多类必需激素和细胞信号的作用；他结合机制研究和系统方法，在纯分子、细胞和整个有机体中研究这些问题。Yamamoto
    博士是《细胞分子生物学》杂志的创始编辑，并担任多个编辑委员会、科学顾问委员会以及关注公共与科学政策、公众对生物研究的理解与支持和科学教育的国家委员会的成员；他担任生命科学联盟（原公共政策联合指导委员会）主席，并在国家科学院担任生命科学委员会主席。


    Yamamoto 博士长期参与美国国立卫生研究院（NIH）的同行评审过程及其管理该过程的政策，曾担任 `分子生物学研究分段`主席、`NIH` 主长关于研究拨款分工的工作组成员、`NIH`
    科学评审中心（`CSR`）咨询委员会主席、`NIH` 主长同行评审监督小组成员，并担任 `NIH` 主长同行评审委员会成员，以及 `R01` 奖项转化委员会联合主席。Yamamoto
    博士曾于 1988 年当选美国艺术学院成员，1989 年当选国家科学院成员，2003 年当选医学学会成员，并在 2002 年成为美国科学协会会员。


    ## 国家研究委员会工作人员


    `India Hook-Barnard` 是国家研究委员会生命科学委员会的项目官员。她从国立卫生研究院进入国家科学院，在那里 2003 年至 2008 年担任博士后研究员。她的研究关注基因表达的
    RNA 聚合酶相互作用。Hook-Barnard 博士在密苏里大学分子与免疫学系获得了博士学位。她的研究生研究了核糖体的结合机制。在国家科学院，她参与了分子生物学、微生物学、生物安全和基因组学等领域的项目。她是
    2010 年基于序列的选择性因子报告的研究主任，并继续指导国际脑研究组织。


    `Orin Luke` 是国家研究委员会生命科学委员会的项目助理。他从马里兰大学学院帕克分校获得英语学学士学位。自 2011 年加入生命科学委员会以来，他担任过多个项目助理，包括`分子动力学
    (*2011)`、`跨课程的演变` (2011) 以及 `为国立卫生研究院关于波斯顿大学 NEIDL 的双重用途研究准备的额外风险评估` (2011) 提供持续协助等。在加入生命科学委员会之前，他曾担任环境研究与毒理学委员会的项目助理。


    `Amanda Mazzawi` 最近在国家科学院担任高级项目助理，在那里协助了多次会议、项目、文件和报告的筹备。在 `NAS` 工作之前，她在北卡罗来纳州立大学卓越课程中心与高级管理层密切合作了两年。她领导了项目并实施了计划，大大扩大了学生在
    `NCSU` 校园及周边社区服务学习项目的参与度。Amanda 目前与丈夫和两个月大的儿子住在纽约州伊塔卡。


    `Carl-Gustav Anderson` 是国家研究委员会生命科学委员会的项目助理。他于 2009 年获得美国大学的哲学学士学位。他目前正在美国大学完成哲学史硕士学位学习。在
    2009 年加入生命科学委员会之前，他曾与马来西亚全妇女行动协会密切合作，帮助年轻男性参与女性主义对话，并对当代马来西亚独特的身份政治提出女性主义的回应。他目前的研究重点是佛教哲学和美国实用主义对女性主义和酷儿认识论的潜在贡献。


    自 2009 年加入生命科学委员会以来，他担任过多个项目的项目助理，包括`生物选择性因子和毒素的负责任研究` (2009)、`生命科学研究中双重用途教育的挑战与机遇`
    (2010)、`基于序列的选择性因子分类：更清晰的路线` (2010)、`美国国土安全部在堪萨斯州曼哈顿计划的国家生物农业防御设施的特定场地风险评估` (2010)、`生命科学中双重用途问题教育的挑战与机遇`
    (2010)、`生物防御研究中的前线保护：特殊免疫计划` (2011) 以及`具有双重用途潜力的生命科学研究：科学教育国际教师培养项目` (2011) 等。除了几项正在进行的研究外，他还担任国际脑研究组织美加区域委员会的助理助理。


