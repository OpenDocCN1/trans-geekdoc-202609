  trans: '


    # 数据共享指导原则

    所有数据共享将遵循：1) 研究参与者同意的同意条款；2) 适用的法律法规；以及 3) 原则，即网络内的各个站点根据每个项目，对于其站点数据是否被使用或共享拥有最终决定权。这些原则旨在最大限度地促进
    eMERGE 成员生成的 GWAS 数据在成员内部、成员之间，以及与更广泛的科学社区之间的共享，同时在不损害数据安全或用于研究的数据和/或样本个人机密性的情况下进行。


    # 数据共享责任

    每个 eMERGE 临床站点的首席研究员（PI）可以指定用于完成 eMERGE 批准的研究项目中定义的活动的数据（eMERGE 数据），并按以下方式共享：(1)
    通过 `dbGaP` 分发；(2) 在 eMERGE 网络内分发；和/或 (3) 发送到 eMERGE 协调中心。在 eMERGE 内部共享的 eMERGE
    数据将仅提供给签署本协议的 eMERGE 网络成员。所有 eMERGE 网络成员和 eMERGE 协调中心可以汇总所有成员站点的 eMERGE 数据，并在贡献站点在每次提交前获得书面批准后，将上述
    eMERGE 数据提交至 `dbGaP` 和/或由美国国立卫生（NIH）管理的其他数据库。每个 eMERGE 网络成员可以在无需其他成员批准的情况下将其自己的数据与外部合作者共享。如果另一个成员外部共享从任何成员接收的
    eMERGE 数据，必须获得并记录提供该 eMERGE 数据的成员的事先批准。从外部共享 eMERGE 数据的成员还必须确保每个外部 eMERGE 数据接收者同意遵守本协议中概述或法律可能要求的关于
    eMERGE 数据使用和披露的、适用于成员及成员代表的同等限制和条件。


    # 保密声明

    通过签署本协议，代表 eMERGE 网络成员的授权官员证明，其本人以及从事 eMERGE 相关项目的首席研究员、研究研究员、学生和研究人员（统称为“网络成员代表”）知晓该成员维护的关于研究参与者的数据具有机密性，并知晓维护该机密性的必要性。


    eMERGE 网络成员同意不尝试根据 eMERGE 数据身份识别任何 eMERGE 参与者，并同意不尝试联系除其所属站点外的任何 eMERGE 参与者。该成员同意在与
    eMERGE 的关联关系期间或结束后，除非本协议允许或法律要求，否则不传输或披露任何机密数据或任何个人 eMERGE 参与者的信息。该成员同意为 eMERGE
    数据提供足够的安全保障，包括但不限于防止未经授权使用或披露此类信息的措施。此外，每个成员同意向其他成员书面报告其获悉的任何未获得本协议许可的数据任何部分的使用或披露，包括法律要求的披露。


    eMERGE 网络成员同意确保其网络成员代表在遵守协议允许或法律要求的情况下，不向任何非 eMERGE 网络成员使用、披露或传输任何 eMERGE 数据。此外，该成员同意在终止与
    eMERGE 网络的关联关系后，将所有 eMERGE 数据返回给 eMERGE 协调中心，或删除/销毁所有电子 eMERGE 数据，并在完成后通知 eMERGE
    协调中心。


    # 数据使用限制

    eMERGE 网络成员同意确保网络成员代表仅以符合披露成员为特定研究指定并经指导委员会同意的任何限制的方式使用 eMERGE 数据，并确保遵守所有监管此类数据使用的适用州和联邦法律法规，包括适用的
    1996 年《健康保险流通与责任法》（`HIPAA`），以及任何及所有未来的修订。


    eMERGE 网络成员同意遵守所有规范 eMERGE 数据获取、分析、报告、出版、使用和分发的既有政策。


    本协议取代并替换了 eMERGE 网络成员之间之前的所有协议。


