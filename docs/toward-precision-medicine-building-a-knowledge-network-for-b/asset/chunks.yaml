    委员会希望强调“以个人为中心”的信息共享空间的新颖性和力量。正如在第二章中讨论的，一个实用的类比是地理信息系统（GIS），例如 Google Maps（参见图
    1-2


    尽管对疾病（特别是发病机制的分子机制）的认识仍然有限，但进步的速度从未如此之快。通过丰富的分子方法，以及对环境因素重要性的新见解，关于疾病生物学的新见解正在迅速涌现。然而，更新当前疾病分类的系统间隔为多年，这并不允许新信息的快速纳入，从而导致了那些随时间推移可能指导主流实践的进展在引入时被推后。信息共享空间“以个人为中心”的特性是确保知识网络底层数据及其衍生分类法能够不断更新的重要手段。随着参与的患者接受新的测试和治疗，相关信息将进入信息共享空间，并基于这些数据，如
    `ICD` 等分类法可以被持续更新。这种动态系统不仅能接受既有疾病参数的新输入，还能容纳由新开发的产生的新类型信息，这些技术用于识别、获取、测量和分析疾病的新生物学特征。


    ## 新分类法需要持续验证


    错误的信息比没有信息更糟糕。临床上有用分类法的一个关键特征是需要一个验证系统。分类方案的逻辑，特别是其在实际应用中的效用，需要经过仔细且持续的测试。当患者和医生使用新分类法来指导临床决策时，这一点尤为重要。新分类法应定期进行测试，为所有利益相关者提供数据，表明根据其引导的决策可以在多大程度上充满心地做出。显然，某些患者和医生在基于临床直觉而非事实证据做出决策时，会比其他人感到更自在。然而，医生应该能够查询新分类法底层的知识网络，以了解其他人是否也做过类似的决策，如果是，后果如何。


    例如，如果一种药物被引入用于针对癌症中的特定驱动突变，医生需要知道是否已经通过严谨的临床测试确定该药物是安全有效的。该药物是否仅在某些可以通过方式识别的患者中有效（例如，通过分析影响细胞生长或药物代谢的基因变异）？同样，如果一个实验室检测被认为是疾病后期发展的候选预测因子，该假设是否经过了严谨的验证？该候选检测在某些患者组中有效而在另一些组中无效？无论给定的测试用于识别疾病的预测因子还是疾病的存在，测试结果都必须在结果“正常范围”的背景下进行解释。这一要求并非微不足道的考虑，特别是对于基于海量数据整合的测试，例如患者的基因组、转录组和代谢组。


    即使是传统的测序测试，也很难以确定判断序列变化是致疾病的还是无关紧要的。对于基因组水平测试，这种困境增加了许多倍。来自全人类基因组测序数据的初步结果显示了这一问题的规模：大多数个体拥有数十到数百个序列变异，从生物化学角度来看很容易被识别为潜在致病性的：例如导致蛋白质过早截断或丢失正常终止密码子的变异（Ge
    et al. 2009; Pelak et al. 2010），然而几乎所有此类变异的临床意义仍然不明。要定义并不断完善我们对此类测试的正常“参考范围”的理解，需要能够访问并有效分析来自大型且种族多样化的人群的生物学和其他相关的临床数据。最终，新分类法底层的知识网络将使开发决策支持工具成为可能，这些工具将整合信息并提醒医疗保健提供者来自知识网络且与考虑的临床决策相关的所有经过验证的见解。


    ## 新分类将在继续使用现有分类法的同时并行发展


