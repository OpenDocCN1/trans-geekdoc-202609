- raw: 'Traditionally, a physician’s office or clinic has had few direct connections
    with academic research laboratories. In this environment, patient-oriented research—particularly
    if it involved studying patients or patient-derived samples with state-of-the-art
    scientific techniques and experimental designs—required a major division of labor
    between the research and clinical settings. Typically, researchers have used informal
    referral networks to make contact with physicians caring for patients with diseases
    of special interest to the researchers. Once enrolled in a research study, the
    patient—or, in some cases, simply a tissue sample and a little clinical information—passed
    into a research setting that maintained its own infrastructure, including Institutional
    Review Boards (IRBs), patient coordinators, clinical evaluation centers, instrumentation,
    laboratory facilities, and data analysis centers. This approach often yielded
    descriptive and anecdotal results of uncertain relevance to larger (and more diverse)
    patient populations. Moreover, the patients who contributed are unlikely to remain
    connected to the research process or be aware of outcomes.^([1](#chapter02.xhtml#ch2_fn1))
    This research model is ill-suited to long-term follow-up of patients since it
    was never designed for this purpose.


    Although remarkably successful in addressing its original goals of testing clearly
    defined hypotheses, this traditional approach to clinical research is poorly suited
    to answering current questions about human health that are often more open-ended
    and larger in scope than those typically addressed in the past. Based on committee
    experience and the input from multiple stakeholders during the course of this
    study, including the two-day workshop, the Committee identified several reasons
    that current study designs are mismatched to current needs. Traditional designs:


    *   **Require very large sample sizes—hence most studies are inevitably under-powered.**
    As emphasized above, the number and complexity of questions inherent in genotype-phenotype
    correlations is virtually unbounded. Patients with particularly informative genotypes
    and phenotypes—often difficult or impossible to recognize in advance—will typically
    be rare. Identification and recruitment of such patients in sufficient numbers
    to acquire clinically actionable information about their diseases will be possible
    only if molecular and clinical information can be combined in huge patient cohorts.


    *   **Involve high costs that are largely unnecessary because of increasing redundancy
    between the infrastructure present in research and clinical settings.** Most of
    what is needed to carry out data-intensive molecular studies of huge patient populations
    already exists in the health-care system or, increasingly, will exist as large
    coordinated health-care organizations absorb increasing portions of the patient
    population, EHRs are more widely implemented, medical decisions are increasingly
    driven by molecular analyses (particularly in the realm of oncology, but increasingly
    in other subspecialties as well), and consent standards for treatment converge
    with those for both outcomes and molecular research.


    *   **Encourage building closed rather than open research systems.** Researchers
    who devote their careers to building the research infrastructure described above,
    cultivating the physician networks, and navigating the IRB process have little
    incentive to share patient samples and data widely. Indeed, the suite of obstacles
    that a young investigator must overcome to penetrate this system are a major disincentive
    for involvement in patient-oriented research. In addition, the many talented biomedical
    researchers who choose to focus their work on model organisms (such as flies,
    worms, and mice) have little opportunity to share insights or collaborate with
    clinical researchers.


    *   **Leave most researchers and physicians living in separate, largely disconnected
    communities.** The current biomedical training system separates researchers and
    physicians from the earliest stages of their education and creates silos of specialized,
    but limited knowledge. The insular nature of the current biomedical system does
    not encourage interdisciplinary collaborations and has significant negative effects
    on training, study design, prioritization of research efforts, and translation
    of new research findings.


    *   **Are poorly suited to long-term follow-up of patients.** Long-term follow-up
    was not required to conduct the first generation of genotype-phenotype studies.
    The questions under investigation were typically of the nature “Do all cystic
    fibrosis patients have loss-of-function mutations in the *CFTR* gene?” Therefore,
    researchers who sought to establish the causal role of genotypes in particular
    phenotypes only needed confidence that patients had been correctly diagnosed.
    However, questions such as “Do cystic fibrosis patients with particular genotypes
    do better over a period of decades with particular treatments?” require long-term
    follow-up.


    *   **May not provide feedback on clinically relevant results for integration
    into a patient’s clinical care.** To the extent that inherited germline variation
    and/or somatic genomic patterns are predictive of prognosis or response, the feedback
    of results to the clinical care of the individual research subjects may or may
    not occur according to a complex mixture of factors including the original informed-consent
    documents, the logistics of re-contacting subjects, the perceived validity of
    the scientific results (which may change over time), the time that has elapsed
    between when a sample was taken and the results were generated, and whether the
    laboratory work was performed under protocols that permit results feedback. These
    limiting factors mean that most research results are not integrated into clinical
    care. Expert opinion on the “duty to inform” research participants of clinically
    relevant results vary widely. Indeed, many researchers are reluctant to contribute
    data to a common resource as it may expose them to questions about whether feedback
    to participants is necessary or desirable.


    For these, and many other reasons, the project of developing an Information Commons,
    a Knowledge Network of disease, and a New Taxonomy requires a long-term perspective.
    In a sense, this challenge has parallels with the building of Europe’s great cathedrals–studies
    started by one generation will be completed by another, and plans will change
    over time as new techniques are developed and knowledge evolves. As costs in the
    health-care system are increasingly dominated by the health problems of a long-lived,
    aging population, one can imagine that studies that last 5, 10, or even 50 years
    can answer many of the key questions on which clinicians will look to researchers
    for guidance. Many patients are already put on powerful drugs in their 40s, 50s,
    and 60s that they will take for the rest of their lives. The very success of some
    cancer treatments is shifting attention from short-term survival to the long-term
    sequelae of treatment. For all these reasons, the era during which a genetic researcher
    simply needed a blood sample and a reliable diagnosis is passing.


    Outcomes research is also creating new opportunities for a close integration of
    medicine and data-intensive biology. Cost constraints on health-care services—as
    well as an increasing appreciation of how often conventional medical wisdom is
    wrong—has led to a growing outcomes-research enterprise that barely existed a
    few decades ago. The requirements of outcomes researchers for access to uniform
    medical records of large patient populations are remarkably similar to those of
    molecularly oriented researchers.


    [MULTIPLE STAKEHOLDERS ARE READY FOR CHANGE](../Text/contents.xhtml#a16)'
