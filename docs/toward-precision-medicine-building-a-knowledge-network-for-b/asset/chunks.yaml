    美国人类基因组计划研究所估计，2001 年获取单个人类基因组序列的总成本为 9500 万美元（Wetterstrand 2011；参见图 2-1）。此后，成本按照电子领域描述的“摩尔定律”轨迹呈指数级下降，这意味着每每两年就会降低
    50%，直到 2007 年春季，此时单个人类基因组序列的估算成本仍接近 1000 万美元。那时，基于大规模并行、微型化分析的第二代自动 DNA 测序仪的引入，导致成本下降速度远快于摩尔定律的预测。2011
    年 1 月的最新更新估计，完成全基因组序列的成本为 21,000 美元，且成本仍在快速下降，“**1000 美元基因组**”将在未来几年内成为一个现实目标（Wolinsky
    2007; MITRE Corporation 2010; Mardis 2011）。虽然与大多数临床实验室检测的标准相比，全基因组测序仍然昂贵，但趋势线毫无疑问地表明，成本将在几年内下降到许多常规临床检测的范围内。全基因组测序很快将比目前许多广泛订购的特定基因检测更便宜，最终与常规医疗护理的成本相比，可能会变得微不足道。因此，DNA
    测序的成本很快将不再是限制因素（MITRE Corporation 2010）。相反，基因组序列的临床用途以及公众对其使用的接受度将驱动未来的发展。


    ![images/p23.jpg](img/p23.jpg)


    **图 2-1** 完成全基因组测序成本的骤降](../Text/contents.xhtml#fi_2-1)。


    全基因组测序的成本下降速度快于摩尔定律。成本仍在快速下降，“1000 美元基因组”将在未来几年内成为一个现实目标。


    来源：Wetterstrand 2011。


    诚然，DNA 测序的成本轨迹是一个不寻成功案例，即使以高科技标准来看如此。然而，它绝非独特：分子分析其他领域的并行发展（例如大量小分子代谢物和蛋白质的分析，以及单分子检测）可能会消除许多数据密集型分子方法向生物医学研究和临床医学扩散的纯经济障碍。这些技术将使得监测并最终理解和预测健康与疾病中复杂分子网络成为可能。


    ## 将数据密集型生物学与医学结合）。

    *   现在已经很清楚，大多数胃溃疡（曾被认为是由压力和其他非感染因素引起）是由于幽门螺杆菌 `Helicobacter pylori` 定植胃黏膜引起的，这种细菌在人类中非常常见（Atherton
    2006）。这一发现彻底改变了这种疾病的治疗。`H. pylori` 感染也被认为会导致胃癌的发展，表明治疗这种感染既有助于治愈胃溃疡，也可能减少胃癌。此外，流行病学研究和其他数据提出`幽门螺杆菌`
    感染可能会降低个体患过敏疾病甚至肥胖的概率（Blaser and Falkow 2009），表明感染这种有机体与人类健康和疾病之间完整的复杂关系仍有待确定。


