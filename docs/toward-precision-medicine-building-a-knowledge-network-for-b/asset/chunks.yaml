    beyond classification of disease to act as a catalyst that would help to revolutionize
    the way research is done and patients are treated. Patient 1 has a high likelihood
    of overcoming her life-threatening disease and going on to live a long, healthy,
    and productive life. These prospects are a direct result of a new ability to recognize,
    based on molecular analyses, the precise type of breast cancer she has and to
    target a rational therapy to her disease. The Committee believes that the best
