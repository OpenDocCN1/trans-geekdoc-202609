- raw: 'The Committee would like to emphasize the novelty and power of an Information
    Commons that is “individual-centric.” As discussed in [Chapter 2](../Text/chapter02.xhtml),
    a useful analogy is geographical information systems (GISs) such as Google Maps
    (see [Figure 1-2](../Text/chapter01.xhtml#fig_1-2)). Following public access to
    the Global Positioning System (GPS) and dramatic improvements in database technology
    in many ways analogous to the driving forces current advances in data generation
    and handling in biomedicine, it became apparent to many users of geographically
    indexed information that a surprisingly high portion of the world’s information
    could be organized around GPS coordinates. Like the proposed Information Commons,
    GISs are layered data structures that inter-connect vast amounts of information
    and can be mined for information that is not readily apparent in the primary GPS
    of an object. For example, given the coordinates of a large number of, say, backyard
    barbecue grills, one can suddenly overlay a vast amount of socio-economic, ethnic,
    climatological, and other data on what—at the start of the investigation—appeared
    a peculiar, anecdotal inquiry. In some respects, this approach is counter-intuitive.
    The GPS coordinates of someone’s backyard barbecue grill may appear to take one
    away from useful generalizations about grills: it reveals more detail than one
    might want to know about an individual grill without laying any obvious foundations
    for developing an integrated perspective on the cultural practice of backyard-barbecuing.
    However, it is the precise GPS coordinates of an individual grill that are the
    key to inter-connecting whatever has been learned about this particular grill
    to a larger world of information.


    Despite significant challenges to constructing an individual-centric Information
    Commons, the Committee concluded that this is a realistic undertaking and would
    be essential to the success of the Knowledge-Network/New Taxonomy initiative.
    *The Committee is of the opinion that “precision medicine,” designed to provide
    the best accessible care for each individual, is not achievable without a massive
    reorientation of the information systems on which researchers and health-care
    providers depend: these systems, like the medicine they aspire to support, must
    be individualized.* Generalizations must be built up from information on large
    numbers of individuals. Efforts to reverse this process will fail since indispensable
    information is lost when molecular profiles, data on other aspects of an individual’s
    circumstances, and health histories are abstracted away from the individual at
    the very beginning of investigations into the determinants of health and disease.


    [A KNOWLEDGE NETWORK OF DISEASE WOULD CONTINUOUSLY EVOLVE](../Text/contents.xhtml#a26)


    Although knowledge of disease, and particularly molecular mechanisms of pathogenesis,
    is still limited, the pace of progress has never been greater. New insights into
    the biology of disease are emerging rapidly from a wealth of molecular approaches,
    as well as from new insights into the importance of environmental factors. However,
    the system for updating current disease taxonomies, at intervals of many years
    does not permit the rapid incorporation of new information, thereby contributing
    to the delayed introduction of advances that have the potential, over time, to
    guide mainstream practice. The individual-centric nature of an Information Commons
    is an important means of ensuring that the data underlying the Knowledge Network,
    and its derived taxonomy, would be constantly updated. As participating patients
    undergo new tests and treatments, associated information would enter the Information
    Commons and, on the basis of these data, the taxonomies, such as the ICD, could
    be updated continuously. Such a dynamic system would not only accept new inputs
    for established disease parameters, it would also accommodate new types of information
    generated by newly developed technologies to identify, acquire, measure, and analyze
    new biological features of disease.


    [THE NEW TAXONOMY WOULD REQUIRE CONTINUOUS VALIDATION](../Text/contents.xhtml#a27)


    Bad information is worse than no information. A key feature of a clinically useful
    taxonomy is the requirement for a validation system. The logic of the classification
    scheme, and especially its utility for practical applications, needs to be carefully
    and continuously tested. This is particularly important when patients and clinicians
    use the New Taxonomy to inform clinical decisions. The New Taxonomy should be
    routinely tested to provide all stakeholders with data indicating the extent to
    which decisions guided by it can be made with confidence. Clearly, some patients
    and clinicians will be more comfortable than others with making decisions that
    are based on clinical intuition rather than proven evidence. However, a physician
    should be able to interrogate the Knowledge Network that underlies the New Taxonomy
    to learn whether others have had to make a similar decision, and, if so, what
    the consequences were. For example, if a drug has been introduced to target a
    particular driver mutation in a cancer, a physician needs to know whether or not
    rigorous clinical testing has determined that the drug is safe and effective.
    Is the drug effective only in some patients who can be identified in some way,
    such as by analyzing variants of genes that affect cell growth or drug metabolism?
    Similarly, if a laboratory test is considered to be a candidate predictor for
    the later development of disease, has that hypothesis been rigorously validated?
    Is the candidate test valid in some patient groups but not others? Whether a given
    test is used to identify predictors of disease or the existence of disease, the
    test result must be interpreted in the context of knowledge about the “normal
    range” of results. This requirement is not a trivial consideration, especially
    for tests based on integration of vast amounts of data, such as the genome, transcriptome,
    and metabolome of the patient. Even with a conventional sequencing test, it is
    often difficult to ascertain with certainty whether a sequence change is disease-causing
    or insignificant. This dilemma is multiplied many times over for genome-level
    testing. Some initial results from whole-human-genome-sequencing data indicate
    the scale of this problem: most individuals have dozens to hundreds of sequence
    variants that are readily recognizable, on biochemical grounds, as potentially
    pathogenic: examples include variants that cause premature-protein truncation
    or loss of normal stop codons (Ge et al. 2009; Pelak et al. 2010)—yet the clinical
    significance of nearly all such variants remains obscure. Defining and continuously
    refining our understanding of the normal “reference range” for such tests would
    require being able to access and effectively analyze biological and other relevant
    clinical data derived from large and ethnically diverse populations. Ultimately,
    the Knowledge Network that underlies the New Taxonomy will make it possible to
    develop decision-support tools that synthesize information and alert health-care
    providers to all validated insights that emerge from the Knowledge Network and
    that are relevant to clinical decisions under consideration.


    [THE NEW TAXONOMY WOULD DEVELOP IN PARALLEL WITH THE CONTINUED USE OF CURRENT
    TAXONOMIES](../Text/contents.xhtml#a28)'
