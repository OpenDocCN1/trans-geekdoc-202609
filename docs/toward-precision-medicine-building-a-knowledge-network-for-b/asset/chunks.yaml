- raw: 'At the core of the Committee’s optimism is a conviction that dramatic advances
    in biological knowledge can be coupled more effectively than they are now to the
    goal of improving the health outcomes of individual patients. Biology has flourished
    in the 50+ years since the discovery of the molecular basis of inheritance. Powerfully
    reinforced by the Human Genome Project, genetics is in a “golden age” of discovery.
    Sequence similarity between genes studied in fruit flies and those studied in
    humans allows nearly instant recognition of the potential medical relevance of
    the most basic advances in biochemistry and cell biology. Increasingly, this process
    also works in reverse: unusual human patients call attention to molecules and
    biochemical pathways whose importance in basic biology had been overlooked or
    was otherwise inaccessible. Indeed, there are already many areas of basic biology
    in which human studies are leading the way to deep new insights into the way organisms
    work. A good example is color vision. For the simple reason that one can ask a
    research subject what she sees when looking at a pattern of light—instead of having
    to develop a crude behavioral test to find out whether she sees anything at all—we
    know far more about the molecular details of light reception in humans than we
    could ever have learned from studying mice. Particularly as biomedical research
    puts an increasing emphasis on unraveling the molecular underpinnings of behavior,
    the advantages of starting research studies with humans, rather than model organisms,
    are likely to grow. Experience tells us that translation of intensifying knowledge
    of basic biology into clinical advances is a daunting task. Nonetheless, the many
    examples of success encourage optimism. Furthermore, the Committee shares the
    sense that basic biology is at an “inflection point” in which there is every reason
    to expect increasing payoffs from the large investments in basic science that
    have brought us to this point. However, the grand challenge of coupling basic
    science more effectively to medicine will require a rethinking of current practices
    on a scale commensurate with the challenge. The Committee regards the initiative
    it proposes to develop the tripartite Information Commons, Knowledge Network,
    and New Taxonomy, as having the potential to rise to this level.


    Information technology is the key contributor to the technological convergence
    the Committee perceives. Information technology, quite simply, has made the rise
    of data-intensive biology possible: molecular biology, as now practiced, could
    not exist without modern computing systems. In medicine, information technology
    offers perhaps the best hope of increasing efficiency and improving our collective
    learning about what works and what does not. Throughout society, technology is
    changing attitudes toward information. In a mere 20 years, people have made the
    transition from regarding most human knowledge as locked away in the dusty backrooms
    of research libraries to expecting it to be at their finger tips. Understandably,
    the public is losing patience with barriers to the sharing and dissemination of
    information. The social-networking phenomenon is a particularly dramatic illustration
    of changing attitudes toward information and associated blurring of the line between
    the public and private. For all these reasons, the Committee sees powerful forces
    converging in a way that favors the dismantling of existing barriers—institutional,
    cultural, economic, and legal—between the biomedical research environment, the
    clinic, and the public.


    The Committee recognizes that some aspects of the world we envision are more readily
    approachable than others. Even the easiest steps will be challenging. As emphasized
    throughout this report, there are many impediments to progress along the path
    we outline. That is the reason the Committee recommends pilot projects of increasing
    scope and scale as the vehicle for moving forward. Although we consider the creation
    of an improved classification of disease valuable in its own right, we do not
    recommend a crash program to pursue this goal in isolation from the broader reforms
    we emphasize. We regard smaller projects on the recommended path as preferable
    to larger, narrower initiatives that would distract attention and resources from
    these reforms. We think the impediments can best be overcome and the optimum design
    of the Information Commons, Knowledge Network, and the New Taxonomy best emerge
    in the context of pilot projects of increasing scope and scale.


    Even some stakeholders in the health-care system who find the Committee’s basic
    vision compelling may ask whether or not a special, organized effort is required
    to achieve the Committee’s goals. In particular, some might argue that there are
    already enough examples—many have been cited in this report—in which data-intensive
    laboratory tests have such clear benefits for patients that the traditional system
    of test development and insurance reimbursement will allow a smooth transition
    to a new era of molecular medicine. We would caution against this conclusion.
    Indeed, there is real risk of a backlash against premature claims of the efficacy
    of genomic medicine (Kolata 2011). The key to avoiding such a backlash is development
    of a robust system for discovering applications that have real clinical benefits
    and validating those claims through open processes. The Committee believes that
    expecting or pressuring payers in the health-care system to bear the costs of
    integrating data-intensive biology and medicine without clear evidence of the
    safety, efficacy, and economic feasibility of particular applications would fail—indeed,
    such an effort could easily be counter-productive. On the other hand, as some
    of the scenarios sketched above indicate, the Committee believes that a well planned
    public investment in creating the system the Committee envisions would lead relatively
    quickly to robust public–private partnerships that would allow all stakeholders
    to build on early successes. Perhaps even more importantly, the Committee believes
    that its approach offers the most realistic available path to ultimate sustainability
    of precision medicine. Public investment in research can play an essential role
    in building a solid foundation for precision medicine, but it cannot sustain its
    dissemination: precision medicine will only become a routine aspect of health
    care when it pays its own way.


    To bring the discussion back to the Committee’s core mission, we close by re-emphasizing
    our view toward disease taxonomy. Diagnosis is the foundation of medicine. Accurately
    and precisely defining a patient’s condition does not assure effective treatment,
    but it is unequivocally the place to start. Hence, in exploiting the convergent
    forces acting throughout the health-care system, a long-term focus on developing
    the new informational resources proposed in this report would be a powerful unifying
    principle for biomedical researchers, physicians, patients, and all stakeholders
    in this vast enterprise. Whether the payoff from such a commitment would occur
    in time to help Patient 2, the 40-year-old type II diabetic described at the beginning
    of this report, is impossible to say. However, the Committee believes that implementation
    of its core recommendations would bring many new allies to the cause of improving
    this patient’s health prospects and would equip these diverse players with powerful
    new tools and resources that are unlikely to emerge without an organized effort
    to create them.


