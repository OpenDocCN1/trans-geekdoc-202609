    In the last decade, genetic analyses have allowed a more precise diagnostic classification
    of type 2 diabetes. Children and young adults with mild glucose intolerance and
    often a strong family history of diabetes were previously categorized as having
    “Maturity Onset Diabetes of the Young (MODY)”. MODY is now understood to represent
    a series of specific genetic variants that affect pancreatic beta cell function
    (Fajans et al. 2001) such that the American Diabetes Association classification
    of type 2 diabetes has replaced the descriptive term MODY with the specific genetic
    defects (e.g., chromosome 7, glucokinase; chromosome 12, hepatic nuclear factor
    1—alpha; etc.) A dynamic, continuously evolving Knowledge Network of Disease will
    be needed to accommodate future additions to this list of specific genetic predispositions
    to in type 2 diabetes (with the vision of adding clarity to the diagnosis of Patient
    2).


    ## Box 2-1 Distinguishing Types of Lung Cancer ([../Text/contents.xhtml#bo_2-1)


    Lung cancer is the leading cause of cancer-related death in the United States
    as well as worldwide, causing more than one million total deaths annually (ACS
    2011). Traditionally, lung cancers have been divided into two main types based
    on the tumors’ histological appearance: small-cell lung cancer and non-small-cell
    lung cancer. Non-small-cell lung cancer is comprised of three subgroups, each
    of them defined by histology, including adenocarcinoma, squamous-cell carcinoma,
    and large-cell carcinoma.


    Since 2004, knowledge of the molecular drivers of non-small-cell lung cancer has
    exploded ([Figure 2-2](../Text/chapter02.xhtml#fig_2-2)). Drivers are mutations
    in genes that contribute to inappropriate cellular proliferation. These driver
    mutations are necessary for tumor formation and tumor maintenance. If the inappropriate
    function of the mutant protein is shut down, dramatic anti-tumor effects can ensue.


    In 2004 two drugs were in development, Gefitinib and Erlotinib, which inhibited
    the function of certain receptor tyrosine kinases, including epidermal growth
    factor receptor (EGFR). These receptors were known to send signals that promote
    cellular proliferation and survival, and increased signaling was thought to contribute
    to some cancers. In early trials, the drugs were shown to produce dramatic anti-tumor
    effects in about 10 percent of patients with non-small-cell lung cancer (MSKCC
    2005). Other patients did not appear to respond at all. However, the dramatic
    tumor shrinkage in some patients was enough for U.S. Food and Drug Administration
    approval in 2003, even though the molecular basis for the response was then unknown.
    Without the ability to recognize the responding patients as a biologically distinct
    subset, these agents were tried unsuccessfully on a broad range of lung-cancer
    patients, doing nothing for most patients other than increasing costs and side
    effects. In retrospect, some clinical trials with these agents probably failed
    because the actual responders represented too small a proportion of the patients
    in the trials (Pao and Miller 2005).


    Subsequently, it was discovered that the responding patients carried mutations
    that activated EGFR in their cancers (Kris et al. 2003; Lynch et al. 2004; Paez
    et al. 2004; Pao et al. 2004). This made it possible to predict which patients
    would respond to the therapy and to administer the therapy only to this subset
    of patients. This led to the design of much more effective clinical trials as
    well as reduced treatment costs and increased treatment effectiveness.


    Since then, many studies have further divided lung cancers into subsets that can
    be defined by driver mutations. Not all of these driver mutations can currently
    be targeted with drugs and cancer cells are quick to develop resistance to targeted
    drugs even when they are available. Nonetheless, this recent information makes
    it possible to develop new targeted therapies that can extend and improve the
    quality of life for cancer patients.


    ![images/p27.jpg](Images/p27.jpg)


    ## FIGURE 2-2 Knowledge of non-small-cell lung cancer has evolved substantially
    in recent decades ([../Text/contents.xhtml#fi_2-2)


    The traditional characterization of lung cancers based on histology has been replaced
    over the past 20 years by classifications based on driver mutations. In 1987,
    this classification was rudimentary as only one driver mutation had been identified,
    KRAS. However, the sophistication of this system for molecular classification
    has improved with the advent of more genetic information and the identification
    of many more driver mutations. Similar approaches could improve the diagnosis,
    classification, and treatment of many other diseases.


    SOURCE: Pao and Girard 2011.


    The human genome and microbiome projects are only two examples of emerging biological
    information that has the potential to inform health care. It is similarly likely
    that other molecular data (such as epigenetic or metabolomic data), information
    on the patient’s history of exposure to environmental agents, and psychosocial
    or behavioral information will all need to be incorporated into a Knowledge Network
    and New Taxonomy that would enhance the diagnosis and treatment of disease.


    ## THE URGENT NEED TO BETTER UNDERSTAND PHENOTYPE-GENOTYPE CORRELATIONS ([../Text/contents.xhtml#a12)


    While dramatic progress in understanding the relationship between molecular features
    and phenotype is being made, there is an urgent need to understand these links
    better and to develop strategies to deal with their implications for the individual
    patient. `BRCA1` and `BRCA2` genes are a good example. The discovery of mutations
    in `BRCA1` and `BRCA2` in some people made it possible to identify individuals
    at increased risk of cancer, allowing them to manage their risk with increased
    cancer screening and prophylactic surgeries. A database cataloging `BRCA1` mutations
    recently listed 2,136 distinct variants of the gene (NHGRI 2011). Of these, 1,167
    were judged by the database’s curators as likely to be clinically significant,
    while most of the rest were categorized as “unknown” clinical significance. Among
    the mutations that are believed to be clinically significant, some are thought
    to confer a higher risk of cancer than others (Gayther et al. 1995) but there
    remains uncertainty about the extent to which most mutations increase cancer risk
    (Fackenthal and Olopade 2007).


    As a consequence, people with `BRCA1` and `BRCA2` mutations are forced to make
    life-altering treatment decisions with incomplete information. To what extent
    does their mutation increase their risks of breast and ovarian cancer and how
    do these risks change with age? Should they have prophylactic mastectomies or
    oophorectomies, and if so, when? Should they wait until after childbearing and
    how would that affect their risks? All of these real-life decisions carry heavy
    personal consequences as well as implications for health-care costs.

