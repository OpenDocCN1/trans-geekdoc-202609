    提议的疾病知识网络


    疾病知识网络的目标是远超对疾病的描述。它寻求提供一个统一的框架，使基础生物学、临床研究和患者护理在该框架内共同演化。知识网络的影响范围涵盖：


    ### 疾病分类

    使用多个基于分子的参数来表征疾病可能会导致更准确、更精细的疾病分类（参见框 3-2）。疾病分类不仅仅是一项学术活动：更细致的诊断准确性和识别疾病亚型的能力无疑将产生重要的治疗意义，允许根据患者疾病的精确分子特征来定制治疗方案。


    ### 疾病机制发现

    在疾病知识网络中，疾病越来越多地从分子通路的角度被理解和定义，这具有加速潜在疾病机制的潜力。在基于分子的知识网络中，研究人员可以很容易将未知致病机制疾病的分子指纹（例如由转录组或蛋白质组定义的）与已了解疾病的可用信息进行比较。已知致病机制与未知致病机制疾病的分子谱之间的相似性可能直接指向共同的疾病机制，或者至少可以对可能涉及两种疾病发病机制的细胞通路进行定向分子探测的起点。


    **框 3-2 区分疾病类型**](../Text/contents.xhtml#bo_3-2)


    淋巴瘤分类的最新进展说明了知识网络如何帮助区分具有相似症状和临床表现的疾病或状态。基因表达谱发现 B 细胞淋巴瘤包含两种具有不同驱动突变和不同预后的不同亚型（Alizadeh
    et al. 2000; Sweetenham 2011）。一种亚型具有类似于生中心 B 细胞的基因表达谱，预后良好；而第二种亚型具有类似于激活 B 细胞的基因表达谱，预后不良。识别
    B 细胞淋巴瘤亚型之间的这些生物和临床差异，更准确地预测患者预后并指导治疗决策成为可能。


    同样，白血病现在根据驱动突变的差异进行分类，揭示了具有不同预后和对特定治疗方法反应不同的亚型。带有 `FLT3/ITD` 突变的急性髓性白血病预后比具有正常
    `FLT3` 基因的急性髓性白血病更差（Kiyoi et al. 1999; Kottaridis et al. 2001）。因此，带有 `FLT3/ITD`
    突变的患者更有可能接受异体骨髓移植或接受 `FTLs` 激酶抑制剂的实验治疗，而没有 `FLT3/ITD` 突变的患者更有可能仅接受化疗。这是许多已知示例中的两个，分子数据被用于区分具有不同预后并受益于不同治疗的恶性肿瘤亚型。提议的疾病知识网络有望带来更多此类见解。通过允许任何研究人员对长期追踪的大患者进行此类分析，白血病中
    `FLT3` 突变的临床相关性等见解可能适用于许多其他癌症以及肿瘤行为取决于更复杂因素相互作用的情况。


    ### 疾病检测与诊断

    整合了随时间从个体受试者收集的多个层面疾病数据的知识网络，通过识别多种数据集（包括临床、社会、经济、环境和生活方式因素）与疾病发生率、治疗决策、结果之间的关联，揭示检测和早期诊断的新机会。在某些情况下，这些进展将源于对上述致病机制的新见解。最稳健的早期检测测试——例如对无症状患者的
    HIV 状态进行评估——是基于对致病机制的清晰理解。然而在其他情况下，分子谱在机制机理被理解之前可能就证明对患者健康具有足够的预测性。


    ### 疾病易感性

    连接从遗传到环境等多个层面疾病信息的疾病知识网络将提高我们预测和调查疾病的能力。随时间跟踪个体患者的结果将允许对基于分子的分类的预后价值进行测试并在理想情况下进行验证。跨越整个疾病谱系的多参数数据将变得可用。显然，识别疾病易感性的临床用途取决于是否存在能够预防或延迟疾病发生、或许减轻疾病严重性的干预措施。


    ### 疾病治疗

    大多数临床研究的最终目标是改善疾病治疗和健康结局。疾病知识网络及其派生的分类法预计会对疾病治疗产生影响，并为改善患者健康结局做出贡献。准确诊断是所有医疗干预的基础。正如已讨论的许多示例所示，更精细的诊断通常是选择最佳治疗的关键。在某些情况下，即使不同的疾病亚型接受相同的治疗，基于分子信息的疾病分类也为疾病的预防或管理提供了更好的选择（参见框
    3-3


    '
