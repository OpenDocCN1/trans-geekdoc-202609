    # Chapter 1


    `../Text/chapter01.xhtml` opened with two illustrative clinical scenarios. Although
    not based on specific patients, these scenarios reflect current medical practice
    and are typical of thousands of real people who visit American clinics every day.
    Patient 1—an otherwise healthy woman with breast cancer—is a direct beneficiary
    of the stunning advances in science and medicine that have occurred during recent
    decades. Her physician knows the molecular details of the pathological processes
    that threaten her life and has at her command therapies that directly target the
    aberrant molecular events occurring in Patient 1’s cells. The safety and efficacy
    of these therapies have been confirmed by randomized clinical trials involving
    other patients well matched with Patient 1 in the molecular details of their disease.
    Her prognosis is excellent. With continuing advances in science and medicine,
    similar patients with this type of breast cancer, whose molecular pathology we
    are beginning to understand, may expect access to treatments that are even safer,
    more effective, less expensive, and have fewer side effects.


    Patient 2 presents a different story. Contemporary medicine has little to offer
    him beyond a long-available diagnosis and treatment plan. After 50 years of intensive
    study, substantial headway has been made in the scientific understanding of diabetes.
    Unlike many children who have a sudden onset of diabetes early in life, we know
    that Patient 2 has high levels of circulating insulin. His physician may ultimately
    consider attempting to control his diabetes with still more insulin, but the fundamental
    problem in this case—and with millions of other patients with type 2 diabetes—is
    that his cells respond only weakly to insulin. His blood sugar remains abnormally
    high even as his cells receive a strong signal to take the sugar up and metabolize
    it. The insidiously toxic effects of high levels of circulating sugar threaten
    the health of Patient 2’s blood vessels. As they age, many type 2 diabetics suffer
    severe consequences of a deteriorating vasculature. When minor wounds to their
    feet fail to heal, they often face amputation. As capillaries in their retinas
    rupture, many go blind. Responses to drug treatments, which have changed little
    for decades, are highly variable. Similarly, changes in exercise habits and diet
    help some patients more than others. There is a high likelihood that Patient 2
    faces a future of escalating medical interventions, declining health, and increasing
    disability. The human, social, and economic costs associated with patients such
    as Patient 2 are daunting and distressingly typical of those seen for patients
    with chronic diseases throughout our aging population.


    ## The Committee’s Task


    The Committee’s assigned task was to “explore the feasibility and need, and develop
    a potential framework, for creating a ‘New Taxonomy’ of human diseases based on
    molecular biology.” While the adjective “new” in the Committee’s charge provoked
    much lively discussion—there were varying opinions as to whether a new disease
    classification would be likely to differ dramatically in kind from existing taxonomies—there
    was immediate consensus on the more important point: everyone on the Committee
    agreed that a better taxonomy is needed and that we have a spectacular opportunity
    to create one. Moreover, the Committee clearly recognized that developing and
    implementing a Knowledge Network of Disease has the unique potential to go far
    beyond classification of disease to act as a catalyst that would help to revolutionize
    the way research is done and patients are treated. Patient 1 has a high likelihood
    of overcoming her life-threatening disease and going on to live a long, healthy,
    and productive life. These prospects are a direct result of a new ability to recognize,
    based on molecular analyses, the precise type of breast cancer she has and to
    target a rational therapy to her disease. The Committee believes that the best
    prospects for creating a similarly bright future for Patient 2 lies in achieving
    a similarly precise understanding of his disease by creating a Knowledge Network
    of Disease and an associated New Taxonomy.


    ## Strategic Approach


    The Committee recognized two key points about its charge: first, development of
    an improved disease taxonomy is only one facet, albeit an important one, of the
    challenge of leveraging advances in biomedical research to achieve better health
    outcomes for patients; secondly, no single stream of activity—led by any single
    segment of the biomedical research community—can tackle even this limited goal
    on its own. Both these points suggested that we could best address our charge
    by framing the “new-taxonomy” challenge broadly. Many of the conclusions and recommendations
    could apply, as, , to other challenges in “translational research” such as evaluating
    and refining existing treatments and developing new ones. However, disease classification
    is inextricably linked to all progress in medicine, and the Committee took the
    view that an ambitious initiative to address this challenge—and particularly to
    modernize the “discovery model” for the needed research—is an excellent place
    to start. The Committee thinks that the key to success lies in building new relationships
    that must span the whole spectrum of research and patient-care activities that
    comprise American medicine. As discussed in `../Text/chapter02.xhtml`, the Committee
    thinks that now is a propitious time to confront the challenge of developing a
    Knowledge Network of Disease and deriving a New Taxonomy from it because of changes
    that are sweeping across basic and translational research, information technology,
    drug development, public attitudes, and the health-care-delivery system.


    ## Recommendations


    Our recommendations seek to empower stakeholder communities by providing them
    with informational resources—the Information Commons, the Knowledge Network, and
    the New Taxonomy itself—that would transform the way they work and make decisions.
    We make no specific promises about the benefits that would ensue as this transformation
    occurs but have every confidence that this initiative would be a powerful, constructive
    force for change throughout a large enterprise that plays an increasingly central
    role in science, technology, the economy, and each of our lives—and one that is
    notoriously difficult to reform.

    '
