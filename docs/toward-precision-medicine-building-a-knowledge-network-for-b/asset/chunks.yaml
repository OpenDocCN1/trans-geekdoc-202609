  trans: '


    影响基础学研究、信息技术、临床医学以及公众对健康记录和个人遗传信息隐私态度的强大力量，创造了一个前所未有的机会，以改变生物医学研究的开展方式并改善健康结果。拟议“疾病知识网络”（Knowledge
    Network of Disease）及其相关的“新分类法”（New Taxonomy）可以利用这些力量来激发革命性的变化。本委员会认为，致力于开发这些资源是一个强大的统一理念，它可以汇聚——并在适当程度上重新引导关键利益相关者的创造能量，以充分发挥生物学在改善健康结果方面的潜力。


    也存在一些显著的例外，例如弗兰明汉心脏研究（Framingham Heart Study）和护士健康研究（Nurses’ Health Study），这些研究从一开始就旨在长期追踪一组患者。参见框
    2-2：前瞻性队列研究——特殊作用。


    # 疾病知识网络和新分类法将会是什么样？


    在上一章中，委员会概述了其得出现在是时候开发疾病知识网络和新分类法的理由。但这些资源会是什么样？它们对疾病分类、基础研究、临床护理和医疗保健体系产生什么影响？本章描述了委员会对全面的疾病知识网络和新分类法的愿景，该网络将生物医学研究、公共卫生和医疗保健社区联合起来，共同实现推进疾病发病学理解和改善健康的共同目标。委员会预计拟议的资源将具有几个关键特征：


    *   它们将推动疾病分类法的发展，除了传统的物理“体征和症状”外，还将根据内在生物学描述和定义疾病。

    *   它们将超越描述，直接与对疾病机制、发病和治疗的更深理解联系起来。

    *   它们将具有高度的动态性，不断纳入新出现的疾病信息。

    *   它们将基于信息共享（Information Commons），从尽可能大量的个体患者中获取疾病相关信息。

    *   填充信息共享的大部分数据将在常规护理过程中产生。


    # 疾病知识网络将整合多个参数，并实现一种深度植根于疾病内在生物学的分类法


    物理体征和症状是医生和患者观察到的疾病的显性表现。然而，症状并不是疾病最佳的描述符。症状往往是非特异性的，很少能明确识别出某种疾病。物理体征和症状通常也难以进行量化测量。此外，许多疾病——包括癌症、心血管疾病和
    HIV 感染等一些常见疾病——在早期阶段是无症状的。事实上，从严格意义上说，所有疾病在病理过程开始后预计都会经历一段“潜伏期”。因此，仅基于传统的“体征和症状”进行诊断面临着错过预防机会的风险，或者早期干预可能完全误诊患者。即使进行了组织学分析（通常是在疾病变得临床明显后获取组织上进行的），获得最佳诊断结果也可能取决于在标准组织学基础上补充辅助的遗传或免疫组化检测，以识别特定的突变或标记蛋白。


    基于生物学的疾病指标（如基因突变、标记蛋白分子和其他代谢产物）具有成为疾病精确描述符的潜力。它们可以被准确、精确地测量——无论是以标准生化分析的形式还是基因序列的形式——从而能够对独立研究获得的数据集进行比较。特别是当多个分子指标与传统的临床、组织学和实验室发现结合使用时，它们为疾病提供了更准确、更精确的描述和分类的可能。


    已有许多基于分子的疾病标志，其数量在未来将迅速增长。疾病最突出的参数包括个体的：


    *   基因组 (Genome)

    *   转录组 (Transcriptome)

    *   蛋白质组 (Proteome)

    *   代谢组 (Metabolome)

    *   脂质组 (Lipidome)

    *   表观基因组 (Epigenome)


    正如第 2 章讨论的，为每个个体患者获取有关这些生物特征的大量信息越来越可行。个体基因组测序的成本迅速下降，而在全球范围内廉价表征个体受蛋白质组、代谢组、脂质组、表观基因组和微生物组能力方面的重大进展将持续，为未来个体日益丰富的分子表征创造潜力。最终，对个体进行广泛的分子表征可能会作为医疗服务的常规部分出现——即使在疾病出现之前，从而允许远超目前水平的规模收集患者和健康个体的数据。除了为疾病过程的研究提供新资源外，这些数据还将提供一个比现在更灵活、更有用的“正常”状态定义，涵盖其所有多样性。这种对非受影响组织和受疾病改变的位点进行此类测量的能力，允许对许多疾病的发展和自然史进行监测，而目前这些疾病甚至最基本的信息都是缺失的。


    # 知识网络和新分类法所依据的信息共享将包含许多目前无法用分子术语描述的信息


    众所周知，健康结果、疾病表型和治疗反应是由从分子到环境的各种因素单独和共同作用决定的（Collins 2004; IOM 2006; HealthyPeople.gov
    2011）。基因环境相互作用涉及多种疾病和病理过程，包括一些心理疾病（Caspi et al. 2010）、高血压（Franks et al. 2004）、肿瘤生长（J.B.
    Williams et al. 2009）、HIV（Nunez et al. 2010）、哮喘（Chen et al. 2009）和心血管反应（Williams
    et al. 2001; Snieder et al. 2002）。此外，许多全基因组关联研究（GWASs）揭示了疾病风险的危险比相当小（尽管具有极高的统计学显著性），这一事实凸显了调查遗传和非遗传因素之间相互作用的必要性，以识别传统
    GWAS 研究中未发现的特定疾病风险因素（Khoury and Wacholder 2009; Murcray et al. 2009; Cornelis
    et al 2010）。因此，添加到信息共享中的数据不应限于目前理解的分子参数：在对疾病特征的彻底描述中，还需要考虑与环境、行为和社会经济因素的患者相关数据（见框
    3-1）。


    '
