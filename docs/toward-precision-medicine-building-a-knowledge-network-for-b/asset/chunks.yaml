    本报告阐述了开发疾病知识网络及相关新分类法的依据。`第 2 章` 提出了“为什么是现在？”它审视了研究、信息技术、临床医学和公众态度的基本趋势，这些趋势创造了前所未有的机会，能够影响生物医学研究和医疗服务交付，从而造及所有利益者。


    `第 3 章` 提出了“疾病知识网络和新分类法会是什么样？”它描述了为什么该系统需要是动态的、不断演化的、整合的且灵活，以及为什么它需要让从基础科学家到临床医生、医疗工作人员和普通大众广泛用户进行查询。


    `第 4 章` 提出了“我们如何到达那里？”它描述了需要一系列试点研究，以评估创建一个以个人为中心的信息公共地（Information Commons）并据此推导出知识网络和新分类法的可行性，并开始探索这些资源在改善个人健康结果方面的效用。本章还讨论了需要克服的障碍，以及在疾病知识网络及其产生的新分类法能够充分发挥其改善人类健康的潜力之前，医学教育需要进行的变革。


    在`第 5 章` 中，报告以结语结束，总结了委员会对其建议的理由，并描述了本报告描述的新资源如何满足基础科学家、转化研究人员、政策制定者、保险公司、医学学员、临床医生和患者的需求。


    ^(1) 这些场景是描述典型患者的说明性示例。它们并非基于具体的个人，而是反映了当前的医疗实践。


    ^(2) 需要澄清的是，委员会并不是建议所有疾病都具有同样精确的分类法，而是每种疾病都应该根据关于疾病机制的现有最佳分子信息进行分类并提供治疗。


    ^(3) 例如，临床医生和研究人员广泛使用的信息资源 `PubMed/MEDLINE` 是基于 `MeSH` 疾病术语层结构构建的。


    ^(4) `ICD-11` 的修订过程与 `SNOMED` 密切协调——`SNOMED` 是由国际健康术语标准制定组织 (`IHTSDO`) 开发的医学系统化命名法。`SNOMED`
    是一个大型、关注临床的本体，使用高层节点来聚合更细粒的数据。`WHO` 和 `IHTSDO` 签署了谅解备录，使这两个系统互补而非竞争。其意图是协调这两个系统，使
    `SNOMED` 的聚合层与 `ICD-11` 对应，而 `ICD-11` 的扩展部分成为 `SNOMED` 的元素。


    ^(5) 应该注意的是，国际肿瘤疾病分类法 (`ICD-O`) 已经尝试获取与疾病定义相关的基因组数据。`WHO` 肿瘤病学与遗传学单行的第三系列试图将可用的基因组数据整合到疾病定义中，事实上，今天许多肿瘤类型已在分子水平上定义（Vardiman
    et al. 2009;. Campo et al. 2011; Travis et al. 2011）。


    `2`


    `为什么是现在？`


    ## 为什么是现在？


    数据密集型生物学的兴起、信息技术的进步以及医疗交付方式的变化，创造了一个引人注的机会：通过开发知识网络及相关的新分类法来改善疾病的诊断和治疗，这将整合以往无法企及的生物学、患者和结果数据。这一机会的关键推动因素包括：


    *   以 20 年前无法想象的规模汇总患者分子数据的新能力。

    *   在利用分子信息改善疾病诊断和治疗方面日益取得成功。

    *   信息技术的进步（例如电子健康记录的出现），使得获取大量个人患者的详细临床信息以及在海量数据集中搜索意外的相关性成为可能。

    *   利益者之间的“完美风暴”增强了对整个生物医学研究和医疗服务交付系统根本性变革的接受度。

    *   公众对分子数据和医疗信息隐私态度的转变。


    科学研究、信息技术、医学和公众态度都在经历着前所未有的变化。生物学已经获得了以 20 年前无法想象的规模系统地汇编分子数据的能力。多样化的技术进步使得能够以促进生物医学研究和临床护理的方式来收集、整合、分析和传播与健康相关的生物数据。与此同时，健康和疾病的分子影响巨大的科学复杂性带来的挑战日益显而易见，表明需要强大的新的研究资源。所有这些变化为生物医学科学和临床社区提供了一个共同努力，以改进新知识的发现和医疗服务。正如本章讨论的，委员会得出结论，这一机会可以通过长期致力于创建一个信息公共地、疾病知识网络和分类法得到最佳利用。


    ## 生物学已成为数据密集型科学


    `DNA-sequencing`技术的进步有力地说明了生物学向数据密集型科学的转变。描述实用`DNA`测序方法的首次论文发表于 1977 年（Maxam and
    Gilbert 1977; Sanger et al. 1977）。这些方法需要对`DNA`进行放射同位素标记、手工制作大型电泳胶，并在生物化学和重组 DNA
    技术方面具有专业知识。尽管早期 DNA 测序方法对生物发现的影响是深远的，但直到 1997 年，此类数据的中央存储库 `GenBank` 中的序列总量才超过
    10 亿个碱基（单个人类基因组长度的三分之一）（NCBI 2011a），而且在第一代自动仪器广泛使用后才达到这一里程碑（Favello et al. 1995）。此之后已有超过
    300 亿个碱基（Benson et al. 2011）被存入，说明了过去 20 年基因组数据的持续爆炸。


    '
