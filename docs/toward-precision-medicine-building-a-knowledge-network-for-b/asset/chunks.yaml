    Sawyers 博士在前列腺癌方面通过对小鼠模型人类组织的研究，定义了疾病发生和进展的关键信号通路。这项临床前工作促成了新型抗雄激素药物 `MDV3100`
    的开发，这是与 UCLA 化学家 `Michael Jung` 合作发现的一种小分子抑制剂，旨在针对激素耐药性疾病中增加的雄激素受体水平。基于 I/II 期研究中令人印象深刻的临床结果，`MDV3100`
    目前正处于 III 期注册试验阶段。Sawyers 博士是美国临床调查协会前主席，曾任国家癌症研究所科学顾问委员会成员。他曾获得过众多荣誉和奖项，包括理查德和辛达·罗森哈尔基金会奖、美国癌症研究协会的多萝西·兰登奖、美国临床肿瘤学会的卫·A·卡尔诺夫斯基奖以及
    2009 年拉斯斯基-德·贝基临床医学研究奖。他是医学研究所成员，并于 2010 年当选国家科学院院士。


    `David R. Cox` 医学博士、哲学博士担任辉瑞全球研发部应用定量基因治疗部门首席科学官。这个新部门整合了人类遗传学、系统生物学和细胞生物学，将内部能力与外部合作相结合，专注于增加临床前靶标验证，旨在显著提高临床生存率。Cox
    博士是 Perlegen 的联合创始人，且自公司 2000 年成立以来一直担任该公司的首席科学官。Cox 博士曾任斯坦福大学医学院遗传学和儿科教授，并任斯坦福基因组中心联合主任。他在布朗恩大学获得文学学士学位和科学硕士学位，在华盛顿大学西雅图分校获得医学博士和哲学博士学位。他在耶鲁-新哈文医院完成了儿科住院培训，并在加利福尼亚大学旧金山分校担任遗传学和儿科的研究员。Cox
    博士拥有美国儿科科学委员会和美国医学遗传学委员会的认证。在进行涉及人类遗传疾病分子基础的研究时，他一直是人类基因组计划大规模制图和测序工作的积极参与者。Cox
    博士曾担任多个委员会和理事成员，包括国家生物伦理咨询委员会 (`NBAC`）和医学研究所健康科学政策委员会。他还担任过多个国际委员会成员，包括人类基因组组织委员会
    (`HUGO`)。他发表了超过 100 篇同行评审科学论文，并担任过多个编辑委员会。Cox 博士的荣誉包括当选国家科学院医学研究所院士。


    `Claire M. Fraser-Liggett` 是巴尔的摩马里兰大学医学院基因组科学所长兼医学教授。在此之前，她是位于马里兰州罗克维尔基因组研究所的院长兼主主任。Fraser-Liggett
    博士在人类、动物、植物和微生物基因组的测序和分析中发挥了作用，以更好地理解基因在发育、演化、生理和疾病中起的作用。她曾领导团队测序了多种微生物的基因组，包括重要的人类和动物病原体，因此帮助开启了比较基因组学时代。她曾担任国家研究委员会关于反生物恐怖主义、国内动物基因组、极地生物学和宏基因学的多个委员会成员。Fraser-Liggett
    博士拥有 200 多篇科学出版物，并担任国家科学基金会、能源部和国家卫生研究院的委员会成员。她在纽约州立大学获得药理学博士学位。


    `Stephen J. Galli` 分别于 1968 年和 1973 年在哈佛大学获得文学学士和医学博士，并在马萨诸塞总医院 (`MGH`) 完成解剖病学的住院和主治培训。在
    `MGH` 与 `Harold Dvorak` 完成博士后工作后，他于 1979 年至 1999 年担任哈佛医学院教员，直到 1999 年他加入斯坦福大学担任病理系主任、玛丽·希威·洛莱斯病理学教授以及斯坦福基因中心联合主任。Galli
    博士的研究专注于肥大细胞和碱性细胞（过敏反应和过敏的关键参与者）的发育功能，以及开发动物模型来研究健康和疾病中的这些细胞。他因在人类群体遗传学方面工作获得英国首批国家颁发的拉斯斯基-沃尔夫森研究奖之一，并于
    2008 年因对 HIV-1 控制宿主决定因素的研究获得《三角商业杂志》医疗英雄奖。最近，他被任命为 2011 年和 2013 年人类遗传学与基因组戈登研究会议的联合主席和主席。


    `David B. Goldstein` 目前是杜克大学分子遗传学与微生物学教授兼人类基因组变异中心主任。他于 1994 年在斯坦福大学获得生物科学哲学博士，并在
    1999 年至 2005 年担任伦敦大学学院遗传学学教授。Goldstein 博士在群体遗传学和医学遗传学领域发表了 150 多篇学术论文。他的工作专注于人类疾病和治疗反应的遗传学，重点关注精神疾病和感染性反应的宿主决定因素。他因在人类群体遗传学方面工作获得英国首批国家颁发的拉斯斯基-沃尔夫森研究奖之一，并当选国家科学院医学与工程研究所院士。


    `David J. Hunter` 目前是哈佛大学卫生学院学术事务院长，流行病学与营养系癌症预防系文森·L·格雷戈教授。他的研究兴趣包括癌症流行病学以及分子遗传流行病学。Hunter
    博士利用分子技术和研究环境暴露的分子标志物分析癌症和其他慢性疾病的遗传易感性。他是美国癌症研究所乳腺和前列腺癌队列联盟的联合主席，也是美国癌症研究所癌症易感遗传标记
    (`CGEMS`) 特别计划的联合主任。

