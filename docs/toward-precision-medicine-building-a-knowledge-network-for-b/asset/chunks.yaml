    # 委员会乐观主义的核心在于一种信念：生物学知识的巨大进展，可以比现在更有效地与改善个体患者健康结果的目标相结合。自从发现遗传的分子基础以来，在 50 多年来，生物学取得了蓬勃发展。在人类基因组计划的有力推动下，遗传学正处于发现的“黄金时代”。果蝇研究的基因与人类研究的基因之间的序列相似性，使得我们能够几乎瞬间识别出生物化学和细胞生物学领域最基础进展的潜在医学相关性。这一过程越来越多地也反过来起：异常的人类病例引起人们关注某些分子和生化通路，而这些通路在基础生物学中的性曾被忽视或无法获取。事实上，在基础生物学的许多领域，人类研究正引导我们对生物体运作方式产生深层次的新见解。


    色视觉就是一个很好的例子。仅仅因为一个简单的原因——我们可以询问受试者在观察光线图案时看到了什么，而不需要开发一种粗糙的行为测试来确定她是否能看到任何东西——我们对人类光感受分子细节的了解，远比通过研究小鼠能学到的多得多。特别是随着医学研究日益强调揭示行为的分子基础，从人类而非模型生物开始研究的优势可能会增加。经验告诉我们，将不断加深的基础生物学知识转化为临床进展是一项艰巨的任务。尽管如此，许多成功案例鼓舞了我们的乐观情绪。


    此外，委员会也认同这样一种观点：基础生物学正处于一个“转折点”，有理由预期那些使我们走到这一步的大额基础科学投资将产生日益的回报。然而，将基础科学更有效地与医学相结合的这一宏大挑战，要求我们与挑战相称的规模对现行实践进行反思。委员会认为，其提议开发的`Information
    Commons`（信息公社）、`Knowledge Network`（知识网络）和`New Taxonomy`（新分类法）三体系具有潜力达到这一水平。


    ## 信息技术的作用


    信息技术是委员会感知到的技术收敛的关键贡献者。简单来说，信息技术使数据密集型生物学的兴成为可能：目前的分子生物学如果没有现代计算系统将无法存在。在医学领域，信息技术可能提供了提高效率和改进我们对哪些有效、哪些无效的集体学习的最佳希望。在整个社会，技术正在改变人们对信息的态度。在短短
    20 年里，人们已经完成了转变，从认为大多数人类知识被锁在研究图书馆落灰的后室，转变为期望它们触手可及。


    可以理解，公众对信息共享和传播的障碍正在失去耐心。社交网络现象是对信息态度变化以及相关的公共与私有界限模糊化的一个极具戏剧性色彩的说明。由于所有这些原因，委员会看到强大的力量正在汇聚，这种趋势有利于拆解生物医学研究环境、临床与公众之间现有的障碍——包括制度、文化、经济和法律。


    ## 实施策略与试点项目


    委员会意识到，我们所设想世界的某些方面比其他方面更容易实现。即使是最容易的步骤也将具有挑战性。正如本报告贯穿强调的那样，在我们概述的道路上，进步面临着许多障碍。这就是为什么委员会建议将扩大范围和规模的试点项目作为前进的手段。


    尽管我们认为建立改进疾病分类本身具有价值，但我们并不建议采取孤立于我们强调的更广泛改革的“突击计划”来追求这一目标。我们认为，在建议路径上的较小项目比那些会分散这些改革注意和资源的更大、更狭窄的倡议更佳。我们认为，在范围和规模不断扩大的试点项目背景下，能够得到最好的克服，`Information
    Commons`、`Knowledge Network` 和 `New Taxonomy` 的最佳设计也能得出来。


    ## 应对挑战与可持续性


    即使是医疗保健系统中一些对委员会基本愿景深表认同的利益相关者也可能询问是否需要特殊的、有组织的努力来实现委员会的目标。特别是，有些人可能会认为，已经有足够的例子（本报告已引用了许多），数据密集型实验室测试对患者具有如此明显的益处，以传统的测试开发和保险报销系统将允许平稳过渡到分子医学的新时代。


    我们对这一结论表示。事实上，过早声称基因医学的有效性存在反噬的风险（`Kolata 2011`）。避免这种反噬的关键在于建立一个稳健的系统来发现具有真实临床效益的应用，并通过开放过程验证这些主张。委员会认为，在没有关于特定应用安全性、有效性和经济可行性的明确证据的情况下，期望或迫使医疗保健系统的支付者承担整合数据密集型生物与医学的成本是失败的——事实上，这种努力很容易适得其反。


    另一方面，正如上述描绘的一些情景所示，委员会认为，对创建委员会设想的系统进行良好的公共投资，将迅速导致建立稳健的公私合作伙伴关系，允许所有利益相关者在早期成功的基础上进行发展。可能更重要的是，委员会认为其方法为精准医学的最终可持续性提供了最现实的路径。对研究的公共投资可以在为精准医学建立坚实基础方面发挥关键作用，但它无法维持其传播：精准医学只有在能够自担时，才会成为医疗保健的常规方面。


    ## 结论


    回到委员会的核心使命，由于诊断是医学的基础，准确精确地定义患者的状况不能确保有效治疗，但它无疑是这一切的起点。因此，在利用作用于整个医疗保健系统的收敛力量时，长期关注开发本报告提出的新信息资源，将成为生物医学研究人员、医生、患者以及这一巨大事业中所有利益相关者的强有力统一原则。


    这种承诺的回报是否能及时帮助`Patient 2`（本报告开头描述的 40 岁 II 型糖尿病患者）是不可能得出的。然而，委员会认为，实施其核心建议将为改善该患者健康前景的事业带来许多新盟友，并为这些多元化的参与者提供强大的新工具和资源，而这些资源如果没有有组织的努力创造是不可能出现的。


    '
