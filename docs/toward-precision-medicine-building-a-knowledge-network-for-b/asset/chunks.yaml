    相比之下，患者 2 在 40 岁时被诊断患有 2 型糖尿病，这是一个不精确的类别，主要用于将其疾病与通常发生在较年轻时期（1 型糖尿病）或怀孕期间（妊娠期糖尿病）的糖尿病区分开来。该诊断对疾病特定的分子病理生理学及其并发症几乎没有启发；同样，根据患者的病理生理学来定制治疗方案也缺乏依据。患者的内科医生可能会开方`二甲双胍`，这是一种已使用
    50 多年的药物，目前仍是美国 2 型糖尿病最常见的治疗方法。目前没有具体的分子信息可以定制患者 2 的治疗方案，以降低其肾衰竭、失明或其他糖尿病相关并发症的风险。也没有相应的测试可以衡量其兄弟姐妹和子女的糖尿病风险。患者
    2 及其家人尚未从当今疾病病理生理学信息的爆炸式增长中受益（A.D.A.M. 医学百科书 2011; Gordon 2011; Kellett 2011）。


    我们研究和医疗事业中的哪些元素使得患者 1 的情况成为特例，而患者 2 的情况成为典型？难道像我们目前的疾病分类系统如此基础的东西，实际上正在`抑制`进步吗？如今的分类系统很大程度上基于可衡量的“体征和症状”，例如乳腺肿块或血糖升高，以及对组织或细胞的描述，往往未能规定驱动疾病或作为治疗目标的分子通路。^(2)考虑这样一个世界：诊断本身就能常规提供对特定致病途径的洞察。考虑这样一个世界：临床信息（包括分子特征）成为巨大的“疾病知识网络”的一部分，支持精确诊断和个体化治疗。如果看似完全不同的疾病所共有的分子特征在暗示根本新治疗方案方面的潜力得到充分实现会怎样？在这样的世界中，一种新的、更准确更精确的“疾病分类法”可以使每位患者都能从已知知识中受益并做出贡献。


    ## 委员会的任务


    考虑到这些可能性，并根据国家健康研究所（`National Institutes of Health`）主任的请求，国家研究委员会（`National Research
    Council`）成立了一个特别委员会（`Committee`），以探索创建“基于分子生物学的新人类疾病分类法”的可性和需求，并制定一个潜在的框架（Box
    1-1），聚集了基础生物学和临床医学领域的各类专家，探讨创建“基于分子生物学的新人类疾病分类法”的可行性、需求、范围、影响和后果。研讨会上传递的信息和意见指导并影响了委员会在六个月内进行的一系列密集审议（包括面对面和电话会议）。委员会强调，分子生物学是“新分类法”的重要信息基础（`base`）之一，而非限制或约束。此外，委员会并未将其任务视为规定一种特定的新疾病命名法。相反，委员会认为其挑战在于构一个一个框架，整合快速扩展的生物学、行为和经验信息的范围及细节，以促进基础发现，并推动更准确更精确的疾病分类（即“新分类法”）的发展，从而实现更优的医疗水平。


    ### Box 1-1 任务声明


    应`NIH`主任办公室的要求，国家研究委员会的一个特别委员会（`Committee`）将探索创建基于分子生物学的人类疾病“新分类法”的可行性和需求，并制定一个潜在的框架。作为审议的一部分，委员会将举办一个为期两天的大型研讨会，汇集基础和临床疾病生物学领域的各类专家，探讨定义这一新分类法的可行性、需求、范围、影响和后果。研讨会参与者还将通过讨论包括但不限于以下主题来考虑框架的核心要素：


    *   汇编来自人类疾病分子研究的海量多样化数据，以评估已知情况、识别空白并为填补这些空白建议优先事项。

    *   为数据的选择、收集、存储和管理制定有效且接受的机制和政策，以及访问和解释这些数据的方法。

    *   定义利益相关者社区之间的角色和接口——包括公共和私立资助者、数据贡献者、临床医生、患者、行业和其他。

    *   考虑如何应对此类计划启动后可能出现的许多伦理问题。


    委员会还将考虑建议少数案例研究，将其作为该框架的初步测试。


    特别委员会将在开发共识报告中的框架建议时，将研讨会的结果用于审议。该报告可以作为政府和其他研究资助机构关于人类疾病分子研究的依据。然而，报告将不包括与资金、政府组织或政策问题相关的建议。


    受拟议的“知识网络”启发的新分类法愿景与广泛讨论的“个性化医疗”概念某些相似之处，该概念近期由总统科学与技术顾问委员会（PCAST）定义为“根据每位患者的个体特征对医疗治疗进行定制……将个人分类为对特定疾病易感性或对特定治疗反应不同的亚群。然后，预防性或治疗性干预措施可以集中在那些将受益的人身上，从而为无法受益的人节省费用并减少副作用”（PCAST
    2008, p. 1）。其他人使用了相关术语“精准医学”来指代非常相似的概念（见词表）。倾向于后者术语的人部分是因为它不太可能被误解为每个患者的治疗都与其他任何患者不同。然而，明确的是，本报告中任何术语的使用均指
    PCAST 的定义。


    ## 疾病分类法简史


    疾病科学分类的早期尝试之一是由林奈（Carolus Linnaeus）进行的，他开发了至今仍用于分类生物的分类分类系统。他在 1763 年出版的《疾病属》（`Genera
    Morborum`，Linné 1763）将疾病分为发疹性（伴有皮疹的发热）、炎症性（伴有脉搏沉重和局部疼痛的发热）和疼痛性（疼痛的）等类别。由于对疾病生物学基础缺乏足够的理解，这一努力在很大程度上失败了。例如，由于缺乏疾病病原学，狂犬病因为晚期出现的脑功能障碍而被描述为一种精神疾病。这说明了脱离疾病生物学基础的分类系统如何误导并阻碍开发更好治疗方法的努力。


    '
