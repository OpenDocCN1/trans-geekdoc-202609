- raw: "Apart from the culture of competition there are other impediments related\
    \ to cost pressures. Cost pressures within the health-care system are such that\
    \ providers and payers are unlikely to be willing to invest substantially (or\
    \ in some cases, at all) in the collection of biological data for research purposes.\
    \ Over the long term, once such data have been shown to yield clinically useful\
    \ information, it will become justifiable to expend health-care resources on the\
    \ collection of actionable data, just as is presently done for standard diagnostic\
    \ tests. However, until such data are shown to be clinically useful, it is unrealistic\
    \ to expect that the Information Commons will become populated by biological data\
    \ (such as genome sequences) acquired from providers and payers. Similarly, the\
    \ information technology challenges associated with integration of large datasets\
    \ and new disease classification systems are substantial. For example, Aetna is\
    \ currently engaged in a multi-year effort to update its information technology\
    \ systems to support the planned conversion to the ICD-10 coding standards. This\
    \ effort alone will cost tens of millions of dollars. While the goals of integrating\
    \ datasets and changing classification systems are achievable in principle, they\
    \ will be beyond the technical capacity of all but the largest and most technologically\
    \ sophisticated providers and payers. Thus, the transition to non-proprietary\
    \ Knowledge Networks into which all data would be deposited would have to involve\
    \ strong incentives for payers and providers. This may mean that the government\
    \ will ultimately need to require participation in such Knowledge Networks for\
    \ reimbursement of health care expenses. At an even more fundamental level, the\
    \ longstanding issue of equity in access to a sufficiently advanced level of health\
    \ care should also be addressed if the data in the Knowledge Network is to adequately\
    \ represent the diversity of our society.\n\n[THE DEVELOPMENT OF A KNOWLEDGE NETWORK\
    \ OF DISEASE WILL REQUIRE AND INFORM THE EDUCATION OF HEALTH-CARE PROVIDERS AT\
    \ ALL LEVELS](../Text/contents.xhtml#a40)\n\nDecision-making based on a Knowledge\
    \ Network of Disease and the New Taxonomy, which will incorporate a multitude\
    \ of parameters, will represent a significant adjustment in the practical work\
    \ of the primary care physician. Given the demands on the time of physicians and\
    \ other care-givers in the present health-care environment, few are likely to\
    \ have the time or to feel qualified to interpret the results of “omics”-scale\
    \ analyses of their patients. The importance of this issue will escalate over\
    \ time as the Knowledge Network and its linked molecular-based taxonomy evolve\
    \ into a system whose sheer complexity greatly exceeds current approaches to disease\
    \ classification.\n\nOne concern is that the infusion of large molecular datasets\
    \ into clinical records will reinforce a tendency many perceive as already crediting\
    \ genetic and other molecular findings with more weight than they deserve. In\
    \ extreme cases, this cultural bias has enabled the promoting and marketing of\
    \ “omic” tests with no clinical value whatsoever (Kolata 2011). In other cases\
    \ genetic or “omic” tests with real value in specific contexts may be over-interpreted\
    \ and thereby occlude consideration of other relevant clinical data. To develop\
    \ the Knowledge Network of Disease and the New Taxonomy that will be derived from\
    \ it, health-care providers will need to develop much greater literacy in the\
    \ interpretation and application of molecular data.\n\nTo meet these challenges,\
    \ health-care providers will require both decision-support systems and new training\
    \ paradigms. The decision-support systems will need to provide useful information\
    \ about the propensity of patients to develop disease, facilitate a correct diagnosis,\
    \ guide selection of the most appropriate strategies for disease prevention or\
    \ treatment, inform the patient about the prognosis and management of the disease,\
    \ and provide the opportunity for both physicians and patients to access more\
    \ detailed information about the disease on an “as interested” or “as needed”\
    \ basis. Whenever possible, such decision-support systems should enable shared\
    \ decision-making by patients and their care-givers. Such systems should be readily\
    \ updatable as more information is acquired about disease classification, the\
    \ ability of particular test results to predict disease development, progression,\
    \ or response to treatment, and the success of particular disease-prevention and\
    \ management strategies.\n\n![images/p72.jpg](Images/p72.jpg)\n\n[**FIGURE 4-1**\
    \ Curriculum for biomedical graduate program—proposed new model](../Text/contents.xhtml#fi_4-1).\
    \  \n\nThe current model of the first-year curriculum in a typical biomedical\
    \ graduate program (top) and an alternative model (bottom). The multicolored bars\
    \ in the nodes and connections course represent fundamental principles and essential\
    \ facts about each key process integrated across scales.  \n\nSOURCE: Modified\
    \ with permission from Lorsch 2011.\n\nIn order to prepare physicians for the\
    \ use of a comprehensive, dynamically changing Knowledge Network, biomedical education\
    \ will need to adjust. Lorsch and Nichols (2011) recently proposed that graduate\
    \ and medical life sciences curricula would significantly benefit from a major\
    \ shift away from the current discipline-specific model to a vertically integrated\
    \ nodes-and-connections framework (see [Figure 4-1](../Text/chapter04.xhtml#fig_4-1)).\
    \ This model is not the only possible way of reorganizing instruction to reflect\
    \ new knowledge about molecular processes, but it demonstrates how the development\
    \ of a molecularly-based taxonomy, and the underlying Knowledge Network of Disease,\
    \ could lead to major changes in education, while preparing students pursuing\
    \ research careers to function in a scientific landscape that increasingly requires\
    \ multidisciplinary approaches to solve biomedical problems (NRC 2009; MIT 2011).\
    \ It also would give future physicians a more holistic view of biological processes,\
    \ which reflects what will be required to fulfill the promises of genomics and\
    \ personalized medicine (Ashley et al. 2010; Wiener et al. 2010).\n\nThe teaching\
    \ model proposed by Lorsch and Nichols very closely mirrors the properties of\
    \ the Knowledge Network of Disease described in [Chapter 3](../Text/chapter03.xhtml).\
    \ In this teaching model a given topic—for example, gene expression—would be taught\
    \ in a vertically integrated fashion, with essential information all the way from\
    \ the atomic to the whole-organism scale discussed. Adjusting teaching strategies\
    \ to reflect the biological reality of the material has the potential to create\
    \ significant synergies. Students may retain more knowledge of basic science when\
    \ this information is directly connected to medicine. The enhanced ability to\
    \ use the New Taxonomy in medical practice and research would reinforce the student’s\
    \ conception of biology. Although it is beyond the scope of this report to suggest\
    \ detailed reforms of the medical-school curriculum, the Committee would like\
    \ to emphasize that full realization of the power of the Knowledge Network of\
    \ Disease and the New Taxonomy derived from it would almost certainly require\
    \ a major shift in educational strategy.\n\n[5](../Text/contents.xhtml#a41)\n\n\
    [Epilogue](../Text/contents.xhtml#a41)"
