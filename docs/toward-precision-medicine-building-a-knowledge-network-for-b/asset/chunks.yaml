  trans: '

    在过去的十年里，遗传学分析使得 2 型糖尿病的诊断分类更加精确。以往，患有轻度葡萄糖耐量异常且通常有糖尿病家族史的儿童和青少年被归类为“青少年发型糖尿病（MODY）”。现在，MODY
    被认为代表一系列影响胰腺β细胞功能的特定基因变异（Fajans et al. 2001），因此美国糖尿病协会对 2 型糖尿病的分类已用特定的遗传缺陷取代了描述性术
    MODY（例如：7 号染色体，葡萄糖激酶；12 号染色体，肝核因子 1-α；等）。未来需要一个动态的、不断演化的疾病知识网络，以适应未来对这一 2 型糖尿病特定遗传易感性列表的补充（愿景是增加对患者
    2 诊断的清晰度）。


    ## 框 2-1 区分肺癌类型


    肺癌是美国及全球癌症死亡的首要原因，每年导致超过一百万死亡（ACS 2011）。传统上，肺癌根据肿瘤的组织学外观分为两大主类：小细胞肺癌和非小细胞肺癌。非小细胞肺癌由三个亚组组成，每个亚组通过组织学定义，包括腺癌、鳞状细胞癌和大细胞癌。


    自 2004 以来，关于非小细胞肺癌分子驱动因子的知识爆炸式增长（图 2-2）。驱动因子是导致细胞异常增殖的基因突变。这些驱动突变对于肿瘤的形成和维持是必要的。如果关闭突变蛋白的异常功能，可能会产生显著的抗肿瘤效果。


    2004 年有两种药物正在研发中，即吉非替尼和和厄洛替尼（Erlotinib），它们抑制某些受体酪氨酸激酶的功能，包括表皮生长因子受体（EGFR）。这些受体已知会发送促进细胞增殖和生存的信号，信号增强被认为会导致某些癌症。在早期试验中，这些药物在约
    10%的小细胞肺癌患者中产生了显著的抗肿瘤效果（MSKCC 2005）。其他患者似乎完全没有反应。然而，某些患者肿瘤的剧烈缩小已足以获得美国食品药品监督管理局在
    2003 年的批准，尽管当时这种反应的分子基础尚未知。由于无法识别出反应性患者是一个生物学上不同的亚群，这些药物在广泛的肺癌患者中尝试均未成功，对大多数患者除了增加成本和副作用外没有产生任何作用。回溯起来，使用这些药物的某些临床试验可能失败，是因为实际的反应者在试验患者中所占的比例太小（Pao
    and Miller 2005）。


    随后，发现反应性患者携带了激活其癌症中 EGFR 的突变（Kris et al. 2003; Lynch et al. 2004; Paez et al.
    2004; Pao et al. 2004）。这使得预测哪些患者会对治疗产生反应并仅对这一亚组患者进行治疗成为可能。这导致了更有效的临床试验设计，并降低了治疗成本，提高了治疗效果。


    从那时起，许多研究将肺癌进一步分为由驱动突变定义的亚组。目前并非所有的驱动突变都能通过药物靶向，而且在药物可用的情况下，癌细胞也能迅速对靶向药物产生药性。尽管如此，这些最新信息使得开发新的靶向疗法成为可能，从而延长并改善癌症患者的生活质量。


    ![images/p27.jpg](img/p27.jpg)


    ## 图 2-2 非小细胞肺癌知识在近几十年发生了显著演变


    在过去的 20 年里，基于组织学的肺癌传统特征描述已被基于驱动突变的分类所取代。1987 年，这种分类是非常原始的，因为当时只鉴定出一种驱动突变——KRAS。然而，随着更多遗传信息的出现和更多驱动突变的鉴定，这种分子分类系统的精密复杂性得到了提高。类似的方法可以改善许多其他疾病的诊断、分类和治疗。


    来源：Pao and Girard 2011。


    人类基因组和微生物组计划只是具有医疗保健信息潜力的新兴生物信息的两个例子。同样，其他分子数据（如表观遗传学或代谢组学数据）、患者接触环境因素的历史信息以及心理社会或行为信息也可能需要纳入知识网络和新分类法中，以增强疾病的诊断和治疗。


    ## 迫切需要更好地理解表型-基因型相关性


    虽然在理解分子特征与表型之间的关系方面取得了巨大进展，但迫切需要更好地理解这些联系，并制定策略应对它们对个体患者的影响。`BRCA1`和`BRCA2`基因就是一个很好的例子。在某些人身上发现`BRCA1`和`BRCA2`突变，使得识别癌症风险增加的个体成为可能，允许他们通过增加癌症筛查和预防性手术来管理风险。一个记录`BRCA1`突变的数据库最近列出了该基因的
    2136 种不同变异（NHGRI 2011）。其中，1167 个被数据库编辑判断为可能具有临床意义，而其余大部分被归类为“未知”临床意义。在认为具有临床意义的突变中，某些被认为比其他具有更高的癌症风险（Gayther
    et al. 1995），但对于大多数突变增加癌症风险的程度仍存在不确定性（Fackenthal and Olopade 2007）。


    因此，携带`BRCA1`和`BRCA2`突变的个人被迫在信息不全的情况下做出改变生活的治疗决策。他们的突变在多大程度上增加了乳腺癌和卵巢癌的风险？风险如何随年龄变化？是否应该进行预防性乳腺切除术或卵巢切除术？如果是的话，什么时候进行？应该等到生育后？这将如何影响他们的风险？所有这些现实决策都带有深重的个人后果，并对医疗成本产生影响。

    '
