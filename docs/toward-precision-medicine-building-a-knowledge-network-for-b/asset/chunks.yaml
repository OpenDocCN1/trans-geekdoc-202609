    ^([1](#chapter03.xhtml#ch3_ft1)) As with all patient-related data in electronic
    medical records and contributed to the Information Commons, information in the
    exposome layer requires that attention be paid to data sharing, informed consent,
    and privacy issues; see discussion Chapter 4.


