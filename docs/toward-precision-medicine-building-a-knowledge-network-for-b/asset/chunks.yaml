    The National Human Genome Research Institute estimated that the total cost of
    obtaining a single human-genome sequence in 2001 was $95 million (Wetterstrand
    2011; see [Figure 2-1](../Text/chapter02.xhtml#fig_2-1)). Costs subsequently dropped
    exponentially following a trajectory described in electronics as Moore’s Law,
    connoting a reduction of cost by 50 percent every two years, until the spring
    of 2007, at which point the estimated cost of a single human-genome sequence was
    still nearly $10 million. At that point, introduction of a second generation of
    automated DNA-sequencing instruments, based on massively parallel, miniaturized
    analysis, led to a collapse in costs far faster than the Moore’s Law projection.
    The most recent update, in January 2011, estimates the cost of a complete-genome
    sequence at $21,000, and the cost is still dropping rapidly, with a “$1000 genome”
    becoming a realistic target within a few years. (Wolinsky 2007; MITRE Corporation
    2010; Mardis 2011) While whole-genome sequencing remains expensive by the standards
    of most clinical laboratory tests, the trend-line leaves little doubt that costs
    will drop into the range of many routine clinical tests within a few years. Whole-genome
    sequencing will soon become cheaper than many of the specific genetic tests that
    are widely ordered today and ultimately will likely become trivial compared to
    the cost of routine medical care. Hence, the costs of DNA sequencing will soon
    cease to be a limiting factor (MITRE Corporation 2010). Instead, the clinical
    utility of genome sequences and public acceptance of their use will drive future
    developments.


    ![images/p23.jpg](Images/p23.jpg)


    **FIGURE 2-1** The plummeting cost of complete genome sequencing](../Text/contents.xhtml#fi_2-1).


    The cost of complete genome sequencing is falling faster than Moore’s Law. The
    cost is still dropping rapidly, with a “$1000 genome” becoming a realistic target
    within a few years.


    SOURCE: Wetterstrand 2011.


    Admittedly, the cost trajectory of DNA sequencing is an unusual success story,
    even by high-tech standards. However, it is by no means unique: parallel developments
    in other areas of molecular analysis, such as the analysis of large numbers of
    small-molecule metabolites and proteins, and the detection of single molecules,
    are likely to sweep away purely economic barriers to the diffusion of many data-intensive
    molecular methods into biomedical research and clinical medicine. These technologies
    will make it possible to monitor and ultimately to understand and predict the
    functioning of complex molecular networks in health and disease.


    ## THE OPPORTUNITY TO INTEGRATE DATA-INTENSIVE BIOLOGY WITH MEDICINE](../Text/contents.xhtml#a11


    Human physiology is far more complex than any known machine. The molecular idiosyncrasies
    of each human being underlie both the exhilarating potential and daunting challenges
    associated with “personalized medicine”. Individual humans typically differ from
    each other at millions of sites in their genomes (Ng et al. 2009). More than ten
    thousand of these differences are known to have the potential to alter physiology,
    and this estimate is certain to grow as our understanding of the genome expands.
    All of this new genetic information could potentially improve diagnosis and treatment
    of diseases by taking into account individual differences among patients. We now
    have the technology to identify these genetic differences—and, in some instances,
    infer their consequences for disease risk and treatment response. Some successes
    along these lines have already occurred; however, the scale of these efforts is
    currently limited by the lack of the infrastructure that would be required to
    integrate molecular information with electronic medical records during the ordinary
    course of health care.


    The human microbiome project represents an additional opportunity to inform human
    health care. The microorganisms that live inside and on humans are estimated to
    outnumber human somatic cells by a factor of ten. “If humans are thought of as
    a composite of microbial and human cells”, then “the human genetic landscape is
    the aggregate of the genes in the human genome and the microbiome, and human metabolic
    features” are “a blend of human and microbial traits” (Turnbaugh et al. 2007).
    A growing list of diseases, including obesity, inflammatory bowel disease, gastrointestinal
    cancers, eczema, and psoriasis, have been associated with changes in the structure
    or function of human microbiota. The ultimate goal of studying the human microbiome
    is to better understand the impact of microbial variation across individuals and
    populations and to use this information to target the human microbiome with antibiotics,
    probiotics, and prebiotics as therapies for specific disorders. While this field
    is in its infancy, growing knowledge of the human microbiome and its function
    will enable disease classification and medicine.


    There are already compelling examples of improvements in patient care that have
    emerged from studies of the human genome and microbiome:


    *   Some patients with high cholesterol are heterozygous for a non-functional
    variant of low-density-lipoprotein-receptor gene, a genotype found in one of every
    500 individuals. Lifestyle interventions alone are ineffective in these individuals
    at reducing the likelihood of cardiovascular disease (Huijgen et al. 2008). Consequently,
    the ability to identify the patients who carry the non-functional receptor makes
    it possible to proceed directly to the use of statin drugs, rather than first
    attempting to control cholesterol with diet and exercise. There is strong evidence
    that the early use of statin drugs in these individuals provide a therapeutic
    benefit.

    *   In the United States it is estimated that 0.06 percent of the population carries
    mutations in the tumor suppressor `BRCA1` and 0.4 percent of people carry mutations
    in `BRCA2` (Malone et al. 2006). These mutations predispose to cancer, particularly
    breast and ovarian cancer (King et al. 2003). Women who carry these mutations
    can reduce their risk of death from cancer through increased cancer screening
    or through prophylactic surgeries to remove their breasts or ovaries (Roukos and
    Briasoulis 2007); until these mutations were identified it was not possible to
    determine who carried the mutations or to take proactive steps to manage risk.

    *   Lung cancer patients can now be separated by the genetic profiles of their
    cancers into distinct groups that benefit from different treatments (see [Box
    2-1](../Text/chapter02.xhtml#box_2-1)).

    *   It is now clear that most cases of stomach ulcers, once thought to be caused
    by stress and other non-infectious factors, are due to colonization of the stomach
    lining with the `Helicobacter pylori` bacterium, which is very common in human
    populations (Atherton 2006). This finding has radically changed the treatment
    of this disorder. `H. pylori` infection also is thought to predispose to the development
    of stomach cancer, suggesting that treatment of this infection can both help cure
    gastric ulcers and also may reduce the development of cancer of the stomach. In
    addition, epidemiological studies and other data have raised the possibility that
    `H. pylori` infection may reduce the individual’s likelihood of developing allergic
    diseases or even obesity (Blaser and Falkow 2009), suggesting that the full complexity
    of the relationship between infection with this organism and human health and
    disease remains to be determined.

