    尽管在创建信息共同体（Information Commons）时关注的是个体患者，但委员会预计，来自不同人群的患者，结合暴露组（exposome）包含的各种类型信息，将产生一个`Knowledge
    Network`，该网络还可以指导群体水平干预措施的识别并改善人群健康。例如，从分子水平更好地理解久坐生活方式的影响，上可以促进早期体育教育新方法的发展。此外，`Knowledge
    Network`和`New Taxonomy`（新分类）的发现可能会揭示尚未识别的行为、社会和环境因素，这些因素与某些人群的特定疾病或疾病亚分类有关，并且易于公共卫生干预。


    ### 框图 3-1 暴露组


    暴露组是对外源性和内源性暴露的表征，这些暴露在人生命中的不同阶段可能对疾病易感性产生不同影响（Wild 2005; Rappaport 2011）。新兴的暴露组学科学（exposomics）关注如何应用创新方法全面测量一个人从受精到死亡的暴露事件，并确定这些暴露与健康和疾病的关系（CDC
    2010; NAS 2010; Rappaport 2011）。一个长期目标是通过评估这些暴露影响的生物标志物和疾病，确定这些暴露的综合效应。


    从最广泛的定义来说，暴露组涵盖了整个生命期的所有暴露——内部（如本报告其他部分描述的微生物组）和外部暴露。物理环境（例如职业危害、工业和家庭污染物的暴露、水质、气候、海拔、空气污染和居住条件（Smith
    et al. 2008; Klecka et al. 2010; Alexeeff et al. 2011; Brookhart et al. 2011;
    Cutts et al. 2011; Yorifuji et al. 2011; Zanobetti et al. 2011; McMichael and
    Lindgren 2011））以及生活方式和行为（例如饮食、身体活动、文化实践和成瘾物质的使用[DHHS 2010; Hu and Malik 2010;
    Arem et al. 2011]），是一些较为明显的外源暴露。然而，暴露组的概念超出了这些因素，还包含了社会因素，例如社会经济地位、住房质量、社区、社会关系、服务获取情况以及歧视经历，这些因素可能导致心理压力、健康不良和健康不公（Epel
    et al. 2004; Krieger et al. 2005; IOM 2006; Cole et al. 2007; Unnatural Causes
    2008; Bruce et al. 2009; Gravlee 2009; Williams and Mohammed 2009; Cardarelli
    et al. 2010; Kim et al. 2010; Pollack et al. 2010; CDC 2011; Karelina and DeVries
    2011; Sternthal et al. 2011; WHO 2011）。


    尽管在表征和测量这些变量面临许多实践和方法论上的挑战，但仍对人类暴露进行严谨评估。通过整合来自人类暴露的数据，`Knowledge Network`可能会对疾病和健康产生更好的理解。


    ### 暴露组在健康中的作用


    尽管在表征和测量这些变量面临许多实践和方法论上的挑战，但仍对人类暴露进行严谨评估。通过整合来自人类暴露的数据，`Knowledge Network`可能会对疾病和健康产生更好的理解。


    [健康人 2020](http://People.gov)强调了群体水平的健康决定因素。


    哮喘说明了社会、环境和遗传因素之间的相互作用。估计哮喘在全球范围内影响超过 3 亿人。`asthma`一词现在指一组症状，包括`气道狭窄`、`气道炎症`、`重塑`和`气道反应性`。这些发现导致了亚型的产生，如`过敏性哮喘`、`运动诱发性哮喘`和`类固醇性哮喘`。


    多年来，`连锁分析`、`候选基因`和`全基因组关联`方法已应用于哮喘的研究。然而，这些发现使得哮喘的大部分遗传影响仍无法解释。


    ### 拟议的疾病知识网络将包含有关病原和其他微生物的信息


    特别由于基因组学的进展，拟议的`Knowledge Network of Disease`具有前所未有的潜力来整合有关致病和疾病相关微生物剂的信息。数千万个微生物基因组已经测序，为病原体和非病原体提供了丰富的数据。这增强了对宿主-病原体相互作用分子机制的理解。比较不同菌、物种和临床分离物的序列，对于识别与耐药、发病和传染性等表型相关的遗传多态性至关重要。将这些信息与宿主的分子特征相结合，将提供关于个人疾病更完整的图景。


    '
