    \ of basic biology, health, and disease, even as many components of this knowledge\
    \ base have grown super-exponentially. The National Library of Medicine and its\
    \ National Center for Biotechnology Information division (NCBI), created in 1988,\
    \ maintains the closest current counterpart to the information infrastructure\
    \ that the Committee envisions. The NCBI maintains a vast array of information\
    \ about basic biology, health, and disease—ranging from the PubMed system for\
    \ indexing the biomedical literature to GenBank, the primary depository for DNA-sequence\
    \ data—and its databases are queried daily by nearly anyone involved in biomedical\
    \ research. So, what is the difference between the Committee’s vision of the Information\
    \ Commons and Knowledge Network of Disease and reasonable extrapolations of what\
    \ the NCBI has already accomplished?\n\nThe key difference is that the Information\
    \ Commons, which would underlie the other databases, would be “individual-centric.”\
    \ The various databanks curated by NCBI generally only contain a single disease\
    \ parameter and even if multiple pieces of information from an individual make\
    \ it into multiple databanks—say a breast cancer patient’s transcriptome stored\
    \ in the GeneOmnibus database of published microarray data and information about\
    \ her chromosome translocations in the Cancer Chromosome databank—they are not\
    \ linked between databases. An independent researcher, who was not involved in\
    \ the study that contributed these entries, has no way of knowing that they are\
    \ from the same individual. As a consequence, relationships between multiple parameters\
    \ that determine disease status in a given individual are impossible to extract.\
