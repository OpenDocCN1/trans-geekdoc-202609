- raw: "Even 100 years ago, the *Manual of the International List of Causes of Death*,\
    \ second revision, (Wilbur 1911), which over time would become the International\
    \ Statistical Classification of Diseases and Related Health Problems (ICD), lumped\
    \ lung cancer and brain cancer into the category of “cancer of other organs or\
    \ not specified.” No distinction was made between type 1 and type 2 diabetes,\
    \ endocrine diseases were categorized under General Diseases, and categories existed\
    \ for “nervous fever,” “inanition,” and “found dead.”\n\nToday, the ICD, which\
    \ is currently in its tenth revision, remains the most commonly used categorization\
    \ of disease (WHO 2007). Published by the World Health Organization (WHO), ICD-10\
    \ is used for statistical analyses, reimbursement, and decision support, making\
    \ it an integral part of health-care systems throughout the world. As will be\
    \ discussed, the ICD is currently undergoing a major revision, which will result\
    \ in the publication of ICD-11 in approximately 2015.\n\n[THE TAXONOMIC NEEDS\
    \ OF THE BIOMEDICAL RESEARCH AND MEDICAL PRACTICE COMMUNITIES](../Text/contents.xhtml#a5)\n\
    \nTaxonomies underpin many health-related systems, such as the organization of\
    \ the curriculum of medical education, the published biomedical literature,^([3](#chapter01.xhtml#ch1_fn3))\
    \ textbooks, and disease coding systems such as the ICD. Although grounded in\
    \ a scientific understanding of disease, taxonomies such as the ICD must address\
    \ the needs of the ever-expanding public health and health-care delivery communities\
    \ across the globe. Organizations such as WHO must have access to accurate and\
    \ timely measures of disease incidence and prevalence in multiple continents to\
    \ make recommendations. Similarly, the health-care industry in the United States\
    \ depends on an accurate disease classification system to track the delivery of\
    \ medical care and to determine reimbursement rates. Both of these communities\
    \ rely on highly robust data collection practices to make decisions that can impact\
    \ millions of individuals. In this context, a formalized nomenclature is essential\
    \ for clear communication and understanding. The current practice of updating\
    \ the ICD nomenclature periodically attempts to balance: (1) the need for a consistent\
    \ terminology to permit clear communication about diseases that are defined by\
    \ agreed upon criteria, with (2) the need to ensure that the classification system\
    \ (i.e., the taxonomy) properly reflects advances in our understanding of molecular\
    \ pathways and environmental factors that contribute to disease origin and pathology.\n\
    \nHowever, in part because it must serve the administrative needs of the public\
    \ health and health-care delivery communities, the current ICD taxonomy is disconnected\
    \ from much of the biomedical research community (see [Figure 1-1](../Text/chapter01.xhtml#fig_1-1)).\
    \ Indeed, few basic researchers know of the existence of ICD, and even fewer use\
    \ this classification in any way. Thus, two extensive stakeholder groups, represented\
    \ on one hand by biomedical researchers, and biotechnology and pharmaceutical\
    \ industries, and on the other by clinicians, health agencies and payers, are\
    \ widely perceived to be largely unrelated, and to have distinct interests and\
    \ goals, and therefore taxonomic needs. This is unfortunate because new insights\
    \ into human disease emerging from basic research and the explosion of information\
    \ both in basic biology and medicine have the potential to revolutionize disease\
    \ taxonomy, diagnosis, therapeutic development, and clinical decisions. However,\
    \ more integration of the informational resources available to these diverse communities\
    \ will be required before this potential can be fully realized with the attendant\
    \ benefits of more individualized treatments and improved outcomes for patients.\n\
    \n![images/p14.jpg](Images/p14.jpg)\n\n[**FIGURE 1-1** Integration would benefit\
    \ all stakeholder communities](../Text/contents.xhtml#fi_1-1).  \n\n(A) Different\
    \ stakeholder communities are perceived to have distinct taxonomic and informational\
    \ needs. (B) Integration of information and a consolidation of needs could better\
    \ serve all stakeholders.  \n\nSOURCE: Committee on A Framework for Developing\
    \ a New Taxonomy of Disease.\n\n[MISSED OPPORTUNITIES OF CURRENT TAXONOMIES](../Text/contents.xhtml#a6)\n\
    \nCurrently used disease classifications have properties that limit their information\
    \ content and usability. Most importantly, current disease taxonomies, including\
    \ ICD-10, are primarily based on symptoms, on microscopic examination of diseased\
    \ tissues and cells, and on other forms of laboratory and imaging studies and\
    \ are not designed optimally to incorporate or exploit rapidly emerging molecular\
    \ data, incidental patient characteristics, or socio-environmental influences\
    \ on disease. The ability of current taxonomic systems to incorporate fundamental\
    \ knowledge is also limited by their basic structure. Taxonomies historically\
    \ have relied on a hierarchical structure in which individual diseases are successively\
    \ subdivided into types and subtypes. This rigid organizational structure precludes\
    \ description of the complex interrelationships that link diseases to each other,\
    \ and to the vast array of causative factors. It also can lead to the artificial\
    \ separation of diseases based on distinct symptoms that have related underlying\
    \ molecular mechanisms. For example, mutations in the *LMNA* gene give rise to\
    \ a remarkably diverse set of diseases, including Emery-Dreyfus muscular dystrophy,\
    \ Charcot-Marie-Tooth axonal neuropathy, lipodystrophy, and premature aging disorders.\
    \ However, despite their remarkable genetic, molecular, and cellular similarities,\
