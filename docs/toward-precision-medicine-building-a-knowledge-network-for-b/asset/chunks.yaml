    \ and Charles Sawyers\n(Committee will meet for an hour in closed session)\n\n\
    ## 3:00 PM | Adjourn\n\n# Appendix D: eMERGE Consortium Data Use Agreement\n\n\
    \ TERMS AND DEFINITIONS\nThe Electronic Medical Records and Genomics (`eMERGE`)\
    \ Network is a National Institutes of Health (NIH)-organized and -funded consortium\
    \ of U.S. medical research institutions (`eMERGE Network`). The primary goal of\
    \ the `eMERGE Network` is to develop, disseminate, and apply approaches to research\
    \ that combine DNA biorepositories with electronic medical record (`EMR`) systems\
    \ for large-scale, high-throughput genetic research. Member institutions participating\
    \ in the consortium study the relationship between genetic variations and clinically\
    \ relevant human traits, using the technique of genome-wide association (`GWAS`)\
    \ analysis. Such studies involve testing hundreds of thousands of genetic variants\
    \ called single nucleotide polymorphisms throughout the genome in people with\
    \ and without a condition. In addition, the consortium includes a focus on social\
    \ and ethical issues such as privacy, confidentiality, and interactions with the\
    \ broader community. Detailed information on the eMERGE network can be found at\
    \ the eMERGE website (`www.gwas.org`).\n\n MEMBERS OF THE NETWORK\nThe following\
    \ entities are eMERGE Network members (`eMERGE Network Members` or `Members`):\n\
    *   `Group Health/University of Washington`, `Marsh-field Clinic`, `Mayo Clinic`,\
    \ `Northwestern University` and `Vanderbilt University` serve as the clinical\
    \ sites (`Clinical Sites`).\n*   `Vanderbilt University` also serves as the consortium’s\
    \ coordinating center (`Coordinating Center`).\n*   `Broad Institute` and `Center\
    \ for Inherited Disease Research` both serve as genotyping facilities (`Genotyping\
    \ Facilities`).\n*   `National Center for Biotechnology Information (NCBI)`, `NIH`;\
    \ and the `National Human Genome Research Institute (NHGRI)`, `NIH` (`Program\
    \ Officials`) serve as scientific and programmatic managers and technical advisors.\n\
    \nResearchers with a wide range of expertise in genomics, statistics, ethics,\
    \ informatics, and clinical medicine employed by an `eMERGE Network Member` participate\
    \ in the `eMERGE network`, including: Principal Investigators of the `eMERGE Clinical\
    \ Sites`, the `Coordinating Center`, the `Genotyping Facilities`, and `Program\
    \ Officials` from the `National Center for Biotechnology Information` and the\
    \ `National Human Genome Research Institute`.\n"
