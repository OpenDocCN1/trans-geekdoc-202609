    In contrast, Patient 2 has been diagnosed at age 40 with type 2 diabetes, an imprecise
    category that serves primarily to distinguish his disease from diabetes that typically
    occurs at younger ages (type 1) or during pregnancy (gestational). The diagnosis
    gives little insight into the specific molecular pathophysiology of the disease
    and its complications; similarly there is little basis for tailoring treatment
    to a patient’s pathophysiology. The patient’s internist will likely prescribe
    `metformin`, a drug used for over 50 years and still the most common treatment
    for type II diabetes in the United States. No concrete molecular information is
    available to customize Patient 2’s therapy to reduce his risk for kidney failure,
    blindness or other diabetes-related complications. No tests are available to measure
    risk of diabetes for his siblings and children. Patient 2 and his family are not
    yet benefitting from today’s explosion of information on the pathophysiology of
    disease (A.D.A.M. Medical Encyclopedia 2011; Gordon 2011; Kellett 2011).


    What elements of our research and medical enterprise contribute to making the
    Patient 1 scenario exceptional, and Patient 2 typical? Could it be that something
    as fundamental as our current system for classifying diseases is actually `inhibiting`
    progress? Today’s classification system is based largely on measurable “signs
    and symptoms,” such as a breast mass or elevated blood sugar, together with descriptions
    of tissues or cells, and often fail to specify molecular pathways that drive disease
    or represent targets of treatment.^([2](#chapter01.xhtml#ch1_fn2)) Consider a
    world where a diagnosis itself routinely provides insight into a specific pathogenic
    pathway. Consider a world where clinical information, including molecular features,
    becomes part of a vast “Knowledge Network of Disease” that would support precise
    diagnosis and individualized treatment. What if the potential of molecular features
    shared by seemingly disparate diseases to suggest radically new treatment regimens
    were fully realized? In such a world, a new, more accurate and precise “taxonomy
    of disease” could enable each patient to benefit from and contribute to what is
    known.


    ## THE CHARGE TO THE COMMITTEE


    In consideration of such possibilities, and at the request of the Director of
    the `National Institutes of Health`, an ad hoc `Committee` of the `National Research
    Council` was convened to explore the feasibility and need, and to develop a potential
    framework, for creating “a New Taxonomy of human diseases based on molecular biology”
    ([Box 1-1](../Text/chapter01.xhtml#box_1-1)). The `Committee` hosted a two- day
    workshop (see [Appendix C](../Text/backmatter04.xhtml)) that convened diverse
    experts in both basic biology and clinical medicine to address the feasibility,
    need, scope, impact, and consequences of creating a “New Taxonomy of human diseases
    based on molecular biology”. The information and opinions conveyed at the workshop
    informed and influenced an intensive series of `Committee` deliberations (in person
    and by teleconference) over a six-month period. The `Committee` emphasized that
    molecular biology was one important `base` of information for the “New Taxonomy”,
    but not a limitation or constraint. Moreover, the `Committee` did not view its
    charge as prescribing a specific new disease nomenclature. Rather, the `Committee`
    saw its challenge as crafting a framework for integrating the rapidly expanding
    range and detail of biological, behavioral, and experiential information to facilitate
    basic discovery, and to drive the development of a more accurate and precise classification
    of disease (i.e., a “New Taxonomy”), which in turn will enable better medicine.


    ### Box 1-1 Statement of Task


    At the request of the Director’s Office of `NIH`, an ad hoc `Committee` of the
    `National Research Council` will explore the feasibility and need, and develop
    a potential framework, for creating a “New Taxonomy” of human diseases based on
    molecular biology. As part of its deliberations, the `Committee` will host a large
    two-day workshop that convenes diverse experts in both basic and clinical disease
    biology to address the feasibility, need, scope, impact, and consequences of defining
    this New Taxonomy. The workshop participants will also consider the essential
    elements of the framework by addressing topics that include, but are not limited
    to:


    *   Compiling the huge diversity of extant data from molecular studies of human
    disease to assess what is known, identify gaps, and recommend priorities to fill
    these gaps.

    *   Developing effective and acceptable mechanisms and policies for selection,
    collection, storage, and management of data, as well as means to provide access
    to and interpret these data.

    *   Defining the roles and interfaces among the stakeholder communities—public
    and private funders, data contributors, clinicians, patients, industry, and others.

    *   Considering how to address the many ethical concerns that are likely to arise
    in the wake of such a program.


    The `Committee` will also consider recommending a small number of case studies
    that might be used as an initial test for the framework.


    The ad hoc `Committee` will use the workshop results in its deliberations as it
    develops recommendations for a framework in a consensus report. The report may
    form a basis for government and other research funding organizations regarding
    molecular studies of human disease. The report will not, however, include recommendations
    related to funding, government organization, or policy issues.


    The vision for a New Taxonomy informed by the proposed “Knowledge Network” shares
    some similarities with the widely discussed concept of “Personalized Medicine,”
    recently defined by the President’s Council on Advisors on Science and Technology
    (PCAST) as “the tailoring of medical treatment to the individual characteristics
    of each patient … to classify individuals into subpopulations that differ in their
    susceptibility to a particular disease or their response to a specific treatment.
    Preventative or therapeutic interventions can then be concentrated on those who
    will benefit, sparing expense and side effects for those who will not” (PCAST
    2008, p. 1). Others have used the related term “Precision Medicine” to refer to
    a very similar concept (see Glossary). Those who favor the latter term do so in
    part because it is less likely to be misinterpreted as meaning that each patient
    will be treated differently from every other patient. However, to be clear, the
    use of either term in this report refers to the PCAST definition.


    ## A BRIEF HISTORY OF DISEASE TAXONOMIES


    One of the first attempts to establish a scientific classification of disease
    was undertaken by Carolus Linnaeus, who developed the taxonomic system that is
    still used to classify living organisms. His 1763 publication `Genera Morborum`
    (Linné 1763) classified diseases into such categories as exanthematic (feverish
    with skin eruptions), phlogistic (feverish with heavy pulse and topical pain),
    and dolorous (painful). The effort was largely a failure because of the lack of
    an adequate understanding of the biological basis of disease. For example, without
    a germ theory of disease, rabies was characterized as a psychiatric disorder because
    of the brain dysfunction that occurs in advanced cases. This illustrates how a
    classification system for disease that is divorced from the biological basis of
    disease can mislead and impede efforts to develop better treatments.

