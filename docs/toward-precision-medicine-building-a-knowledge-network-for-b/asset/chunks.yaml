    Despite the focus on the individual patient in the creation of the Information
    Commons, the Committee expects that the inclusion of patients from diverse populations
    coupled with the incorporation of various types of information contained in the
    exposome will result in a `Knowledge Network` that could also inform the identification
    of population-level interventions and the improvement of population health. For
    example, a better understanding of the impact of a sedentary lifestyle at the
    molecular level could conceivably facilitate the development of new approaches
    to physical education in early childhood. In addition, findings from the `Knowledge
    Network` and the `New Taxonomy` could reveal yet unidentified behavioral, social,
    and environmental factors that are associated with particular diseases or subclassifications
    of diseases in certain populations and are amenable to public health interventions.


    ### Box 3-1 The Exposome](../Text/contents.xhtml#bo_3-1)


    The exposome is a characterization of both exogenous and endogenous exposures
    that can have differential effects on disease predisposition at various stages
    during a person’s lifetime (Wild 2005; Rappaport 2011). The emerging science of
    exposomics is concerned with the application of innovative approaches to comprehensively
    measure a person’s exposure events, from conception to death, and determine how
    those exposures relate to health and disease (CDC 2010; NAS 2010; Rappaport 2011).
    A long-range goal is to ascertain the combined effects of these exposures by assessing
    the biomarkers and diseases they influence.


    In its broadest definition, the exposome encompasses all exposures—internal (such
    as the microbiome, described elsewhere in this report) and external—across the
    lifespan. Physical environment (e.g., occupational hazards, exposure to industrial
    and household pollutants, water quality, climate, altitude, air pollution, and
    living conditions (Smith et al. 2008; Klecka et al. 2010; Alexeeff et al. 2011;
    Brookhart et al. 2011; Cutts et al. 2011; Yorifuji et al. 2011; Zanobetti et al.
    2011; McMichael and Lindgren 2011) and lifestyle and behavior (e.g., diet, physical
    activity, cultural practices, and use of addictive substances [DHHS 2010; Hu and
    Malik 2010; Arem et al. 2011]), are some of the more apparent exogenous exposures.
    However, the concept of the exposome extends beyond these factors to include social
    factors, such as socioeconomic status, quality of housing, neighborhood, social
    relationships, access to services, and experience of discrimination that can contribute
    to psychological stress, poor health, and health inequities (Epel et al. 2004;
    Krieger et al. 2005; IOM 2006; Cole et al. 2007; Unnatural Causes 2008; Bruce
    et al. 2009; Gravlee 2009; Williams and Mohammed 2009; Cardarelli et al. 2010;
    Kim et al. 2010; Pollack et al. 2010; CDC 2011; Karelina and DeVries 2011; Sternthal
    et al. 2011; WHO 2011).


    Despite the many practical and methodological challenges in characterizing and
    measuring these variables, rigorous evaluation of human exposures is needed. By
    incorporating data derived from human exposures, a `Knowledge Network` could lead
    to a better understanding of disease and health.


    ### The Role of the Exposome in Health


    Despite the many practical and methodological challenges in characterizing and
    measuring these variables, rigorous evaluation of human exposures is needed. By
    incorporating data derived from human exposures, a `Knowledge Network` could lead
    to a better understanding of disease and health.


    The [Healthy People 2020](http://People.gov) emphasizes population-level determinants
    of health.


    Asthma illustrates the interplay of social, environmental, and genetic factors.
    It is estimated that asthma affects more than 300 million people worldwide. The
    term `asthma` is now used to refer to a set of symptoms including `airway narrowing`,
    `airway inflammation`, `remodeling`, and `airway-reactivity`. These findings have
    led to subtypes such as `allergic asthma`, `exercise-induced asthma`, and `steroid-resistant
    asthma`.


    Over the years, `linkage-analysis`, `candidate-gene`, and `genome-wide-association`
    approaches have been applied to the study of asthma. However, these findings still
    leave most of the genetic influences of asthma unexplained.


    ### The Proposed Knowledge Network of Disease Would Include Information About
    Pathogens and Other Microbes](../Text/contents.xhtml#a22)


    Particularly because of advances in genomics, the proposed `Knowledge Network
    of Disease` has unprecedented potential to incorporate information about disease-causing
    and disease-associated microbial agents. Thousands of microbial genomes have been
    sequenced, providing a wealth of data on pathogenic and non-pathogenic organisms.
    This enhances the understanding of the molecular mechanisms of host-pathogen interactions.
    Comparing the sequences of different strains, species, and clinical isolates is
    crucial for identifying genetic polymorphisms that correlate with phenotypes such
    as drug resistance, morbidity, and infectivity. Combining this information with
    the molecular signature of the host will provide a more complete picture of an
    individual’s diseases.

