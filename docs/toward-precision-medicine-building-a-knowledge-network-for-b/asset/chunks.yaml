- raw: 'The powerful forces affecting basic biological research, information technology,
    clinical medicine, and public attitudes toward the privacy of health records and
    personal genetic information create an unprecedented opportunity to change how
    biomedical research is conducted and to improve health outcomes. The development
    of the proposed Knowledge Network of Disease and its associated New Taxonomy could
    take advantage of these forces to inspire revolutionary change. This Committee
    regards commitment to the development of these resources as a powerful unifying
    idea that could harness—and, to an appropriate degree, redirect—the creative energies
    of the key constituencies to achieve the full potential of biology to improve
    health outcomes.


    \_\_\_\_\_\_\_\_\_\_\_\_\_


    ^([1](#chapter02.xhtml#ch2_ft1)) There are notable exceptions such as the Framingham
    Heart Study and Nurses’ Health Study, which were designed from the outset to follow
    a cohort of patients over an extended period of time. See Box 2-2: Prospective
    Cohort Studies—A Special Role.


    [3](../Text/contents.xhtml#a19)


    [What Would a Knowledge Network and New Taxonomy Look Like?](../Text/contents.xhtml#a19)


    In the previous chapter, the Committee outlined the reasons it concluded that
    the time is right to develop a Knowledge Network of Disease and New Taxonomy.
    But what would these resources look like and what implications would they have
    for disease classification, basic research, clinical care, and the health-care
    system? This chapter describes the Committee’s vision of a comprehensive Knowledge
    Network of Disease and New Taxonomy that would unite the biomedical-research,
    public-health, and health-care-delivery communities around the related goals of
    advancing our understanding of disease pathogenesis and improving health. The
    Committee envisions that the proposed resources would have several key features:


    *   They would drive development of a disease taxonomy that describes and defines
    diseases based on their intrinsic biology in addition to traditional physical
    “signs and symptoms”.


    *   They would go beyond description and be directly linked to a deeper understanding
    of disease mechanisms, pathogenesis, and treatments.


    *   They would be highly dynamic, continuously incorporating newly emerging disease
    information.


    *   They would be based on an Information Commons that draws upon as much disease-related
    information, from as large a number of individual patients, as possible.


    *   Much of the data that would populate the Information Commons would be generated
    during the ordinary course of clinical care.


    [THE KNOWLEDGE NETWORK OF DISEASE WOULD INCORPORATE MULTIPLE PARAMETERS AND ENABLE
    A TAXONOMY HEAVILY ROOTED IN THE INTRINSIC BIOLOGY OF DISEASE](../Text/contents.xhtml#a20)


    Physical signs and symptoms are the overt manifestations of disease observed by
    physicians and patients. However, symptoms are not the best descriptors of disease.
    Symptoms are often non-specific and rarely identify a disease unambiguously. Physical
    signs and symptoms are generally also difficult to measure quantitatively. Furthermore,
    numerous diseases—including some of the most common ones such as cancer, cardiovascular
    disease, and HIV infection—are asymptomatic in early stages. Indeed, in a strict
    sense, all diseases are presumably asymptomatic for some “latent period” following
    the initiation of pathological processes. As a consequence, diagnosis based on
    traditional “signs and symptoms” alone carries the risk of missing opportunities
    for prevention, or early intervention can readily misdiagnose patients altogether.
    Even when histological analysis is performed, typically on tissue obtained after
    diseases become clinically evident, obtaining optimal diagnostic results can depend
    on supplementing standard histology with ancillary genetic or immunohistochemical
    testing to identify specific mutations or marker proteins.


    Biology-based indicators of disease such as genetic mutations, marker-protein
    molecules, and other metabolites have the potential to be precise descriptors
    of disease. They can be measured accurately and precisely—be it in the form of
    a standardized biochemical assay or a genetic sequence—thus enabling comparison
    across datasets obtained from independent studies. Particularly when multiple
    molecular indicators are used in combination with conventional clinical, histological,
    and laboratory findings, they offer the opportunity for a more accurate and precise
    description and classification of disease.


    Numerous molecularly-based disease markers are already available, and the number
    will grow rapidly in the future. Among the most prominent parameters of disease
    are an individual’s:


    *   Genome


    *   Transcriptome


    *   Proteome


    *   Metabolome


    *   Lipidome


    *   Epigenome


    As discussed in [Chapter 2](../Text/chapter02.xhtml), it is increasingly feasible
    to obtain substantial information about these biological features for each individual
    patient. The cost of sequencing an individual’s genome is rapidly dropping, and
    significant advances in the ability to globally and affordably characterize proteomes,
    metabolomes, lipidomes, epigenomes, and microbiomes of individual subjects will
    continue, creating the potential for an increasingly rich molecular characterization
    of individuals in the future. Eventually, it is likely that extensive molecular
    characterization of individuals will occur routinely as a normal part of health
    care—even prior to appearance of disease, thereby allowing the collection of data
    on both sick and healthy individuals on a scale vastly exceeding current practice.
    In addition to providing a new resource for research on disease processes, these
    data would provide a far more flexible and useful definition of the “normal” state,
    in all its diversity, than now exists. The ability to make such measurements on
    both non-affected tissues and in sites altered by disease would allow monitoring
    of the development and natural history of many disorders about which even the
    most basic information is presently unavailable.


    [THE INFORMATION COMMONS ON WHICH THE KNOWLEDGE NETWORK AND NEW TAXONOMY WOULD
    BE BASED WOULD INCORPORATE MUCH INFORMATION THAT CANNOT PRESENTLY BE DESCRIBED
    IN MOLECULAR TERMS](../Text/contents.xhtml#a21)


    It is well recognized that health outcomes, disease phenotypes, and treatment
    response are determined by the individual and combined effects of various factors
    ranging from the molecular to the environmental (Collins 2004; IOM 2006; [HealthyPeople.gov](http://HealthyPeople.gov)
    2011). Gene-environment interactions have been implicated in a diverse group of
    diseases and pathological processes, including some psychological illnesses (Caspi
    et al. 2010), hypertension (Franks et al. 2004), tumor growth (J.B. Williams et
    al. 2009), HIV (Nunez et al. 2010), asthma (Chen et al. 2009), and cardiovascular
    reactivity (Williams et al. 2001; Snieder et al. 2002). Furthermore, the fact
    that numerous genome-wide association studies (GWASs) have revealed rather modest,
    albeit highly statistically significant, hazard ratios of disease risk highlights
    the need to investigate interactions among genetic and non-genetic factors to
    identify specific disease risk factors not found in conventional GWAS studies
    (Khoury and Wacholder 2009; Murcray et al. 2009; Cornelis et al 2010 ). Therefore,
    data added to the Information Commons should not be limited to molecular parameters
    as they are currently understood: patient-related data on environmental, behavioral,
    and socioeconomic factors will need to be considered as well in a thorough description
    of disease features^([1](#chapter03.xhtml#ch3_fn1)) (see [Box 3-1](../Text/chapter03.xhtml#box_3-1)).'
