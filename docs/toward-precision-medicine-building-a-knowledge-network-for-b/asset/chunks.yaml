    然而，要实现这些收益，仍有许多工作需要完成。生命科学领域的某些人士呼吁启动一项广泛的新计划，利用分子和系统方法来构建一套人类疾病的新型“分类法”。此类计划的可行性，包括技术的准备就绪情况、科学界追求它的意愿，以及其将填补的空白的紧迫性，仍待探索。启动这样的计划需要对现有的将分子、环境和经验因素与疾病状态联系起来的数据进行调查和编制，并识别这些数据中的空白，设定优先级并采取行动来填补这些空白。此外，明确需要有效且可接受的机制和政策，用于数据的选择、收集、存储和管理，以及数据内部网络关系的感知、构建和操纵。还必须建立提供或拒绝访问数据以及解释数据的标准。需要探索和定义参与各社区（公立和私营资助者、数据贡献者、临床医生、患者、行业和其他）之间的角色和接口。而且，与此类计划有关的许多伦理考量也需要得到解决。


    这些每一个领域在技术上都是复杂的。有些领域也非常庞大，例如现有知识的编制以及填补空白所需的科学研究工作。开展这样的计划显然需要许多政府和私营实体在相当长时间内的参与和协作。为了确保取得进展，需要开发可以衡量计划成功的目标和里程碑。美国国立卫生研究所（NIH）寻求专家
    NRC 委员会的建议，该委员会负责探索潜在的“疾病新分类法”工作的可行性和需求，并制定一个框架。委员会将通过举办大型研讨会（约 100 名参与者），利用其他科学家、临床医生等人的知识，从更广泛的科学和医学界获取意见。研讨会结束后，委员会将利用会议结果将其关于框架结构和组成部分的发现和建议提炼成一份共识报告提交给
    NIH。委员会还将考虑推荐少数案例研究，作为框架的初步测试。


    ## 附录 B


    ## 委员简介


    ## 委员会成员


    `Susan Desmond-Hellmann`, M.D., M.P.H., 是加州大学旧金山分校校长。她于 2009 年 8 月 3 日任此职。


    UCSF 是一所领先的大学，致力于通过先进的生物医学研究、生命科学和健康专业的研究生水平教育以及卓越的患者护理，促进全球健康发展。UCSF 是加州大学系统（共
    10 个校区）中唯一专门从事健康科学的校区。


    Desmond-Hellmann 博士曾在基因瑞奇（Genentech）担任产品开发总裁，任时间从 2004 年 3 月到 2009 年 4 月 30 日。在此职位上，她负责基因瑞奇的临床前和临床开发、工艺研发、业务发展和产品组合管理。她还从
    1996 年开始担任基因瑞奇执行委员会成员。她于 1995 年作为临床科学家加入基因瑞奇，并于 1996 年被任命为首席医学官。1999 年，她被任命为开发和产品运营副总裁。在任职基因瑞奇期间，公司的几种患者治疗药物（Lucentis、Avastin、Herceptin、Tarceva、Rituxan
    和 Xolair）获得了美国食品药品管理局（FDA）的批准，该公司成为该国抗癌治疗药物的第一大生产商。


    她在 UCSF 完成了临床训练，并获得内科和医学肿瘤学的董事会认证。她拥有内华达大学里诺分校的医学学士和医学，以及加州大学伯克利分校的公共卫生硕士学位。


    在加入基因瑞奇之前，Desmond-Hellmann 博士曾担任布尔迈贵鲍（Bristol-Myers Squibb）药物研究所的临床癌症研究副主任。在布尔迈贵鲍任职期间，她是抗癌药物紫杉醇（Taxol）的项目组长。


    Desmond-Hellmann 博士还担任 UCSF 流行病学和生物统计学的兼职教授。在 UCSF 工作期间，她在乌甘达癌症学院担任了两年的访问教授，研究
    HIV/艾滋和癌症。在回到临床研究之前，她曾从事了两年的医学肿瘤科实践。


    2009 年 1 月，Desmond-Hellmann 加入了旧金山联邦储备银行的经济顾问委员会，任期三年。2008 年 7 月，她被任命为加州科学院信托会成员。Desmond-Hellmann
    博士于 2007 年入选生物技术名人堂，并荣获 2006 年医疗行业女性协会年度女性。她曾在 2001 年以及 2003 年至 2008 年间列入《财富》杂志的“商界最有权力的
    50 位女性”。2005 年和 2006 年，《华尔街日报》将 Desmond-Hellmann 博士列为“值得关注的女性之一”。2005 年至 2008
    年，Desmond-Hellmann 博士担任美国癌症研究协会董事会成员，任期三年；2001 年至 2009 年，她担任生物技术行业协会董事会执行委员会成员。她于
    2004 年至 2009 年担任 Affymetrix 公司的董事会。


    `Charles L. Sawyers`, M.D., 是霍华德·休斯学院的研究员，也是纪念斯隆凯基林癌症中心（MSKCC）人类肿瘤与发病学计划（HOPP）的首任主任，他在那里正在建立一个跨多个临床学科和机构基础设施的实验室转化研究计划，以增强全球基因组学工具在临床试验中的应用。


    Sawyers 博士的实验室专注于前列腺癌信号传导通路异常，并关注其转化意义。他的研究通过早期对慢性髓性白血病 BCR-ABL 酪氨酸激酶功能的研究得到了最好的证明，他与
    Brian Druker 和诺华（Novartis）合作开发了激酶抑制剂伊马替尼（imatinib/Gleevec）作为 CML 的首选疗法，并发现了伊马替尼耐药性是由
    BCR-ABL 激酶域突变引起的。这一发现导致 Sawyers 博士开始评估第二代 Abl 激酶抑制剂，例如双重 Src/Abl 抑制剂达沙替尼（dasatinib），该药物于
    2006 年 6 月获得了 FDA 快速通道批准。

