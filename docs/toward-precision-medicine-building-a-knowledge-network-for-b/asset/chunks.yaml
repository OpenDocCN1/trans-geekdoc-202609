    is not a trivial consideration, especially for tests based on integration of vast
    amounts of data, such as the genome, transcriptome, and metabolome of the patient.


    Even with a conventional sequencing test, it is often difficult to ascertain with
    certainty whether a sequence change is disease-causing or insignificant. This
    dilemma is multiplied many times over for genome-level testing. Some initial results
    from whole-human-genome-sequencing data indicate the scale of this problem: most
    individuals have dozens to hundreds of sequence variants that are readily recognizable,
    on biochemical grounds, as potentially pathogenic: examples include variants that
    cause premature-protein truncation or loss of normal stop codons (Ge et al. 2009;
    Pelak et al. 2010)—yet the clinical significance of nearly all such variants remains
    obscure. Defining and continuously refining our understanding of the normal “reference
    range” for such tests would require being able to access and effectively analyze
    biological and other relevant clinical data derived from large and ethnically
