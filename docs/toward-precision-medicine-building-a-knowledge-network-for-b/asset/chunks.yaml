- raw: "A further limitation of taxonomic systems is the intrinsically static nature\
    \ of their information content. The ICD system is designed to be updated every\
    \ ten years with minor updates every three years. But many organizations are still\
    \ working with ICD-9, which was released in 1977, even though ICD-10 was released\
    \ in 1992. Because of the time it takes to implement ICD revisions in administrative\
    \ systems, the current taxonomic system is perpetually outdated. Moreover, the\
    \ static structure of current taxonomies does not lend itself to the continuous\
    \ integration of new disease parameters as they become available. This is particularly\
    \ troublesome given that new data regarding the molecular nature of disease are\
    \ becoming available at an ever-increasing rate.\n\nCurrent efforts to revise\
    \ the ICD classification attempt to address these limitations. ICD-11 will be\
    \ based on a foundational layer from which “linearizations” will be derived (Tu\
    \ et al. 2010). While the linearizations will be relatively static and hierarchical,\
    \ the foundational layer is being designed to support multi-parent hierarchies\
    \ and connections, and to be updated continuously.^([4](#chapter01.xhtml#ch1_fn4))\
    \ Importantly, the new classification will combine phenomenological characterization\
    \ of phenotype with genomic factors that might explain or at least distinguish\
    \ phenotypes.^([5](#chapter01.xhtml#ch1_fn5)) Different lung cancers, for example,\
    \ could be explicitly differentiated by genomic characterization. This is important\
    \ because knowledge about the specific molecular pathways contributing to the\
    \ biology of particular types of lung cancer can be used to guide selection of\
    \ the most appropriate treatment for such patients.\n\nAlthough the release of\
    \ ICD-11 will mark an important step forward, the Committee thinks that the amount\
    \ of information available for this effort can be vastly increased by a two-stage\
    \ process leading to a Knowledge Network of Disease. As discussed in detail in\
    \ following sections of this report, the first stage in developing this Knowledge\
    \ Network would involve creating an Information Commons containing a combination\
    \ of molecular data, medical histories (including information about social and\
    \ physical environments), and health outcomes for large numbers of individual\
    \ patients. The Committee envisions this stage occurring in conjunction with the\
    \ ongoing delivery of clinical care to these patients, rather than in specialized\
    \ settings specifically crafted for research purposes. The second stage, the construction\
    \ of the Knowledge Network itself, would involve data mining of the Information\
    \ Commons and integration of these data with the scientific literature—specifically\
    \ with evolving knowledge of the fundamental biological mechanisms underlying\
    \ disease.\n\nSuch a Knowledge Network of Disease would enable development of\
    \ a more molecularly-based taxonomy. This “New Taxonomy” could, for example, lead\
    \ to more specific diagnosis and targeted therapies for muscular dystrophy patients\
    \ based on the specific mutations in their genes. In other cases, it could suggest\
    \ targeted therapies for patients with the same genetic mechanism of disease despite\
    \ very different clinical presentations.\n\n[AN INFORMATION COMMONS, A KNOWLEDGE\
    \ NETWORK, AND A NEW TAXONOMY THAT WOULD INTEGRATE MANY TYPES OF INFORMATION AND\
    \ SERVE ALL STAKEHOLDERS](../Text/contents.xhtml#a7)\n\nAs will be described later\
    \ in the report, the Committee envisions that the Information Commons, which would\
    \ underlie the Knowledge Network of Disease and the New Taxonomy, would have some\
    \ analogies with geographical information systems (GISs), which are designed to\
    \ capture, store, manipulate, and analyze all types of geographically referenced\
    \ data and make them widely accessible in applications (ESRI 1990) such as Google\
    \ Maps ([Figure 1-2](../Text/chapter01.xhtml#fig_1-2)). Most users would interact\
    \ with these resources at the higher-value-added levels, the Knowledge Network\
    \ and the New Taxonomy, rather than at the level of the underlying Information\
    \ Commons ([Figure 1-3](../Text/chapter01.xhtml#fig_1-3)). Investigators using\
    \ the Knowledge Network of Disease could propose hypotheses about the importance\
    \ of various inter- and intra-layer connections that contribute to disease origin,\
    \ severity, or progression, or that support the subclassification of particular\
    \ diseases into those with different molecular mechanisms, prognoses, and/ or\
    \ treatments, and these ideas then could be tested in an attempt to establish\
    \ their validity, reproducibility, and robustness. Validated findings that emerge\
    \ from the Knowledge Network of Disease and are shown to be useful for defining\
    \ new diseases or subtypes of diseases that are clinically relevant (e.g., which\
    \ have implications for patient prognosis or therapy) could be incorporated into\
    \ the New Taxonomy to improve diagnosis and treatment. Whether the “New Taxonomy”\
    \ that is informed and refined by the Knowledge Network of Disease would best\
    \ be realized as a modification of the ICD taxonomy, or should represent an entirely\
    \ distinct taxonomy that exists in parallel with ICD and other taxonomies, will\
    \ depend on a number of factors. However, in either case, the goal of basing the\
    \ New Taxonomy on the Knowledge Network of Disease will be to improve markedly\
    \ the quantity and quality of information that can be used in biomedicine for\
    \ the basic discovery of disease mechanisms, improved disease classification,\
    \ and better medical care.\n\n![images/p17.jpg](Images/p17.jpg)\n\n[**FIGURE 1-2**\
    \ An Information Commons might use a GIS-type structure](../Text/contents.xhtml#fi_1-2).\
    \  \n\nThe proposed, individual-centric Information Commons (right panel) is somewhat\
    \ analogous to a layered GIS (left panel). In both cases, the bottom layer defines\
    \ the organization of all the overlays. However, in a GIS, any vertical line through\
    \ the layers connects related snippets of information since all the layers are\
    \ organized by geographical position. In contrast, data in each of the higher\
    \ layers of the Information Commons will overlay on the patient layer in complex\
    \ ways (e.g., patients with similar microbiomes and symptoms may have very different\
    \ genome sequences).  \n\nSOURCE: FPA 2011 (left panel).\n\n![images/p18.jpg](Images/p18.jpg)\n\
    \n[**FIGURE 1-3** A knowledge network of disease would enable a new taxonomy](../Text/contents.xhtml#fi_1-3).\
    \  \n\nAn individual-centric Information Commons, in combination with all extant\
    \ biological knowledge, will inform a Knowledge Network of Disease, which will\
    \ capture the exceedingly complex causal influences and pathogenic mechanisms\
    \ that determine an individual’s health. The Knowledge Network of Disease would\
    \ allow researchers to hypothesize new intralayer cluster and interlayer connections.\
    \ Validated findings that emerge from the Knowledge Network, such as those which\
    \ define new diseases or subtypes of diseases that are clinically relevant (e.g.,\
    \ which have implications for patient prognosis or therapy) would be incorporated\
    \ into the New Taxonomy to improve diagnosis and treatment.  \n\nSOURCE: Committee\
    \ on A Framework for Developing a New Taxonomy of Disease.\n\n[RATIONALE AND ORGANIZATION\
    \ OF THE REPORT](../Text/contents.xhtml#a8)\n\nToday, historic forces are transforming\
    \ biomedical research and health care. Information technology, clinical medicine,\
    \ and the public attitudes that govern the ways that science, medicine, and society\
    \ interact are all in flux.\n\nA Knowledge Network of Disease could embrace and\
    \ inform rapidly expanding efforts by the biomedical research community to define\
    \ at the molecular level the disease predispositions and pathogenic processes\
    \ occurring in individuals. This network has the potential to play a critical\
    \ role across the globe for the public-health and health-care-delivery communities\
    \ by enabling development of a more accurate, molecularly-informed taxonomy of\
    \ disease."
