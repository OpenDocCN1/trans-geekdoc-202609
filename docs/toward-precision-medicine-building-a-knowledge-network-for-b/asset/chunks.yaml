    \ influence on the entire Information Commons/Knowledge Network/New Taxonomy initiative.\
    \ Inclusion in these deliberations of health-care providers, payers, and other\
    \ stakeholders outside the academic community will be essential.\n\n### 4. Ensure\
    \ data sharing.\nWidespread data sharing is critical to the success of each stage\
    \ of the process by which the Committee envisions creating a New Taxonomy. Most\
    \ fundamentally, the molecular and phenotypic data on individual patients that\
    \ populate the Information Commons must be broadly accessible so that a wide diversity\
    \ of researchers can mine them for specific purposes and explore alternate ways\
    \ of deriving Knowledge Networks and disease taxonomies from them. Current standards\
    \ developed and adopted by federally sponsored genome projects have addressed\
    \ some of these issues, but substantial barriers, particularly to the sharing\
    \ of phenotypic and health-outcomes data on individual patients, remain. Data-sharing\
    \ standards should be created that respect individual privacy concerns while enhancing\
    \ the deposition of data into the Information Commons. Importantly, these standards\
    \ should provide incentives that motivate data sharing over the establishment\
    \ of proprietary databases for commercial intent. Resolving these impediments\
    \ may require legislation and perhaps evolution in the public’s expectations with\
    \ regard to access and privacy of health-care data.\n\n### 5. Develop an efficient\
    \ validation process to incorporate information from the Knowledge Network of\
    \ Disease into a New Taxonomy.\nInsights into disease classification that emerge\
    \ from the Information Commons and the derived Knowledge Network will require\
    \ validation of their reproducibility and their utility for making clinically\
    \ relevant distinctions (e.g., regarding prognosis or choice of treatment) before\
    \ adoption into clinical use. A process should be established by which such information\
    \ is validated for incorporation into a New Taxonomy to be used by physicians,\
    \ patients, regulators, and payers. The speed and complexity with which such validated\
    \ information emerges will undoubtedly accelerate and will require novel decision-support\
    \ systems for use by all stakeholders.\n\n### 6. Incentivize partnerships.\nThe\
    \ Committee envisions that a New Taxonomy incorporating molecular data could become\
    \ self-sustaining by accelerating delivery of better health through more accurate\
    \ diagnosis and more effective and cost-efficient treatments. However, to cover\
    \ initial costs associated with collecting and integrating data for the Information\
    \ Commons, incentives should be developed that encourage public–private partnerships\
    \ involving government, drug developers, regulators, advocacy groups, and payers.\n\
    \nA major beneficiary of the proposed Knowledge Network of Disease and New Taxonomy\
    \ would be what has been termed “precision medicine.” The Committee is of the\
    \ opinion that realizing the full promise of precision medicine, whose goal is\
    \ to provide the best available care for each individual, requires that researchers\
    \ and health-care providers have access to vary large sets of health and disease-related\
    \ data linked to individual patients. These data are also critical for the development\
    \ of the Information Commons, the Knowledge Network of Disease, and the development\
    \ and validation of the New Taxonomy.\n\n[1](../Text/contents.xhtml#a1)\n\n[Introduction](../Text/contents.xhtml#a1)\n\
    \n### THE CURRENT OPPORTUNITY (../Text/contents.xhtml#a2)\n\nBiomedical research\
    \ and the practice of medicine, separately and together, are reaching an inflection\
    \ point: the capacity for description and for collecting data, is expanding dramatically,\
    \ but the efficiency of compiling, organizing, manipulating these data—and extracting\
    \ true understanding of fundamental biological processes, and insights into human\
    \ health and disease, from them—has not kept pace. There are isolated examples\
    \ of progress: research in certain diseases using genomics, proteomics, metabolomics,\
    \ systems analyses, and other modern tools has begun to yield tangible medical\
    \ advances, while some insightful clinical observations have spurred new hypotheses\
    \ and laboratory efforts. In general, however, there is a growing shortfall: without\
    \ better integration of information both within and between research and medicine,\
    \ an increasing wealth of information is left unused.\n\nAs illustration, consider\
    \ the following clinical scenarios;^([1](#chapter01.xhtml#ch1_fn1)) in the first\
    \ example, molecular understanding of disease has already begun to play an important\
    \ role in informing treatment decisions, while in the second, it has not.\n\n\
    Patient 1 is consulting with her medical oncologist following breast cancer surgery.\
    \ Twenty-five years ago, the patient’s mother had breast cancer, when therapeutic\
    \ options were few: hormonal suppression or broad-spectrum chemotherapy with significant\
    \ side effects. Today, Patient 1’s physician can suggest a precise regimen of\
    \ therapeutic options tailored to the molecular characteristics of her cancer,\
    \ drawn from among multiple therapies that together focus on her particular tumor\
    \ markers. Moreover, the patient’s relatives can undergo testing to assess their\
    \ individual breast cancer predisposition (Siemens Healthcare Diagnostics Inc.\
    \ 2008).\n"
