    附录 E


    术语表


    # 术语表

    **生物库**：用于生物医学研究的生物样本库。


    **生物标志物 (Biomarker)**：一种经过客观测量和评估的特征，作为正常生物过程、病理过程或对治疗干预产生药物反应的指标 (IOM 2010a)。


    **生物样本 (Biosamples)**：生物材料的样本。


    **候选基因 (Candidate gene)**：其染色体位置与特定疾病或其他表型相关的基因。由于其位置，该基因被怀疑会导致疾病或其他表型 (NHGRI
    2011)。


    **染色体易位 (Chromosomal translocation)**：染色体片段断裂并附接到另一条染色体上的情况。取决于哪块染色体移动到何处，这会导致多种问题，如白血病、乳腺癌、精神分裂症或肌肉不良症
    (USC 2011)。


    **临床实用性 (Clinical utility)**：筛选或诊断测试根据测试结果采取有效治疗以预防或改善不良健康结果（如死亡、发病或残疾）的能力 (Khoury
    2003)。


    **众包 (Crowd sourcing)**：大量非正式报告


    **基因型与表型数据库 (dbGap)**：用于存档和传播基因型与表型相互作用的研究结果 (NCBI 2011)。


    **数据密集型生物学 (Data-intensive biology)**：通过数学、统计和计算机科学的模型与算法，利用新技术产生的海量数据来理解生物过程
    (`http://sc11.supercomputing.org/schedule/event_detail.php?evid=wksp120`)。


    **决策支持系统 (Decision-support systems)**：支持业务和组织决策活动的特定计算机信息系统 (Information Builders
    2011)。


    **疾病标记 (Disease marker)**：特定的分子特征、生理测量、基因型结构或功能特征、代谢变化或其他决定因素，这些因素可以简化诊断过程、提高诊断准确性、区分疾病病因或使医生能够在症状出现前进行诊断并跟踪疾病进展
    (Medical Dictionary 2011)


    **疾病风险 (Disease risk)**：最初无疾病的个体在特定时间或年龄间隔内（例如一年或终身）发生给定疾病的概率 (Pigeot 2005)。


    **疾病分类学 (Disease taxonomy)**：疾病分类的科学。


