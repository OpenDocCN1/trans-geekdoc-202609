- raw: "**The Knowledge Network of Disease, created by integrating data in the Information\
    \ Commons with fundamental biological knowledge, drawn from the biomedical literature\
    \ and existing community databases such as GenBank, would be the centerpiece of\
    \ the informational resources underlying the New Taxonomy. The Committee envisions\
    \ this network as:**\n\n***Highly inter-connected***. In order to extract relationship\
    \ information between multiple parameters—for example, the transciptome and the\
