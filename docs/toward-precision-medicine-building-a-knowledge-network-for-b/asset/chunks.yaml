  trans: '


    **DNA（脱氧核糖酸）** 编码遗传物质的聚合物，因此决定了蛋白质结构和许多动物特征。


    **EHR（电子健康记录）** 每个医疗数据组织（CDO）电子医疗记录（EMR）的一个集，目前认为包含摘要，如 `ASTM` 的连续护理记录 (`CCR`)
    和 `HL7` 的护理记录摘要 (`CRS`)，并可能包含来自药品福利管理公司、参考实验室和其他机构关于社区患者健康状况的信息（Garets and Davis
    2005）。


    **EHR 衍生表型** 基于电子健康记录（`EHR`）的表型。


    **电子医疗记录（EMS）** 在医疗数据组织（CDOs）如医院和医生诊所中创建的计算机法律临床记录（Garets and Davis 2005）。


    **表观遗传** 与、属于或涉及基因表达的修饰，这种修饰与基因的 DNA 序列无关（例如，表观遗传致癌、表观遗传遗传）（Merriam-Webster 2007）。


    **表观基因组** 表观基因组由化学化合物组成，这些化合物以一种方式修改或标记基因组，告诉基因组做什么、在何做以及何时做。不同的细胞具有不同的表观遗传标记。这些表观遗传标记不是
    DNA 本身的一部分，可以随着细胞分裂从细胞传递到细胞，并从一种代传递到下一代（NHGRI 2011）。


    **副现象** 疾病过程中的额外状况或症状，不一定与疾病有关（Houghton Mifflin Company 2007）。


    **病因学** 对所有可能参与疾病发展的因素进行的研究，包括患者的易感性、病原体的性质以及病原体入侵患者身体的方式（Mosby 2009）。


    **暴露组** 对外源性和内源性暴露的表征，这些暴露在人一生中的不同阶段可能产生差异性影响（Wild 2005; Rappaport 2011）。


    **凝胶电泳** 一种电泳技术，其中分子（如蛋白质和核酸）通过凝胶（特别是聚丙酰胺胶）迁移，并根据大小分离成条带（Merriam-Webster 2007）。


    **GenBank** `GenBank` 序列数据库是一个所有公开的核苷酸序列及其蛋白质翻译的注释合集（Mizrachi 2002）。


    **基因与环境相互作用** 基因与环境之间的相互作用导致对特征表达的影响。某些特征受基因强烈影响，而另一些特征受环境强烈影响。然而，大多数特征受一个或多个基因以复杂方式与环境相互作用的影响（NHGRI
    2011）。


    **基因表达** 是利用基因中编码的信息指导蛋白质分子组装的过程。细胞以三个碱基为一组读取基因序列。每组三个碱基（`密码子`）对应于构建蛋白质的 20 种不同氨基酸之一（NHGRI
    2011）。


    **基因表达谱分析** 一次测量数千个基因的活性，以创建细胞功能的全局图谱。这些谱谱可以区分正在活跃分裂的细胞，或显示细胞如何对特定治疗做出反应。此类许多实验同时测量整个基因组，即测量特定细胞中存在的每一个基因（InfoGlobalLink
    2011）。


    **遗传多态性** 群群中特定特征的两种或两种不连续遗传变异的复发，其比例使其无法简单地通过突变维持。示例包括镰形细胞细胞特征、Rh 因子和血型（Mosby
    2009）。


    **遗传隐私** 保护个人、家庭或人群的遗传信息免受未经授权的披露（Kahn and Ninomiya 2010）。


    **基因组** 生物体中 DNA 编码的遗传物质的完整序列。


    **全基因组关联研究（GWAS）** 一种通过识别跨基因组标记来寻找与疾病或状况相关的遗传变异的研究（PCAST 2008）。


    **基因型** 个体生物的遗传序列，通常根据已知的遗传变异进行分类。这可以是指单个基因的已知等位基因（或类型），也可以是指基因集合。例如，某些肺癌具有突变的
    `Egf` 受体基因型，而另一些肺癌具有野生型（或正常）的 `Egf` 受体基因型。


    **地理信息系统（GIS）** 一种组织的计算机硬件、软件、地理数据和人员集合，旨在高效地采集、存储、更新、处理、分析和显示所有形式的地理参考信息（ESRI
    1990）。


    **健康保险流通性与责任法案（HIPAA）** 1996 年通过的一项国会法，为受医疗计划保障的人员提供某些保护，包括更换工作时的保障连续性、电子医疗保健标准以及对个人可识别身份的患者信息的隐私保护措施（Mosby
    2009）。


    **杂合** 从每个父母那里继承了特定基因的不同形式。杂合基因型与纯合基因型形成对比，后者是指个体从每个父母那里继承了特定基因相同的形式（NHGRI 2011）。


    **组织学** 涉及细胞和组织显微镜识别的科学（Mosby 2009）。


    **人类微生物组计划（HMP）** 美国国立卫生研究院的一项倡议，旨在表征发现人体几个不同部位的微生物群落，包括鼻腔、口腔、皮肤、胃肠道和尿生殖道，并分析这些微生物对人类健康和疾病的认知。


    **机构审查委员会（IRB）** 由医生、科学家、伦理学家、律师和社区成员组成的群体，负责审查人类受试者研究以确保研究符合伦理并对患者有利。个人机构（如大学）通常有自己的
    `IRBs`，必须在进行前批准人类受试者研究。


    **国际疾病分类（ICD）** 世界卫生组织（`WHO`）发布的物理和精神疾病分类官方列表。主要用于发病率和死亡率数据的统计目的。任何属于 `WHO` 的国家都可以调整分类以满足特定需求（Mosby
    2009）。


    **连锁分析（LA）** 一种基因搜索技术，通过追踪高风险家族中的遗传模式，试图通过识别与其共遗传的状来定位致病基因突变；对状况遗传与特定染色体位点关联的正式研究；LA
    基于遗传学的某些基本规则（McGraw-Hill 2002）。


    **脂质组** 细胞中脂质的总和（Quehenberger et al. 2010）。


    **纵向研究** 一种在长时间内对同一对象进行重复观察的研究（PCAST 2008）。


    **代谢图谱分析** 鉴定生物学样本中存在的代谢中间产物的类型和数量。


    **代谢组** 可以定义为特定细胞、器官或生物体中发现的所有小分子（<1500 Da）代谢产物的完全补充。它是基因组、转录组和蛋白质组的密切对应物。这四个“组”共同成了系统生物学的基石（Wishar
    et al. 2007）。


    **微生物组** 用于描述我们土著微生物群集体基因组的术语（Hooper and Gordon 2001 见 IOM 2010b）。识别生物学样本中存在的或与其他生物（如人类）相关的微生物类型。


