- raw: 'Dr. Sawyers’ work in prostate cancer has defined critical signaling pathways
    for disease initiation and progression through studies in mouse models and humane
    tissues. This preclinical work led to the development of a novel antiandrogen
    MVD3100, a small molecule inhibitor discovered in collaboration with UCLA Chemist
    Michael Jung, which targets the increased levels of androgen receptor found in
    the hormone refractory disease. Based on impressive clinical results in a phase
    I/II study, MDV3100 is currently in phase III registration trial. Dr. Sawyers
    is past President of the American Society of Clinical Investigation and served
    on the National Cancer Institute’s Board of Scientific Councilors. He has won
    numerous honors and awards, including the Richard and Hinda Rosenthal Foundation
    Award; the Dorothy Landon Prize from the American Association of Cancer Research;
    the David A. Karnofsky Award from the American Society of Clinical Oncology; and
    the 2009 Lasker DeBakey Clinical Medical Research Award. He is a member of the
    Institute of Medicine and in 2010 was elected to the National Academy of Sciences.


    **David R. Cox**, M.D., Ph.D., serves as Chief Scientific Officer for the Applied
    Quantitative Genotherapeutics Unit of Pfizer’s Worldwide Research & Development.
    This new unit brings together human genetics, systems biology, and cell biology,
    combining internal capabilities with outside collaborations, to focus on increasing
    preclinical target validation with the aim of significantly improving clinical
    survival. Dr. Cox is a co-founder of Perlegen, and was most recently Chief Scientific
    Officer of the company since its formation in 2000. Dr. Cox was Professor of Genetics
    and Pediatrics at the Stanford University School of Medicine as well as the co-director
    of the Stanford Genome Center. He obtained his A.B. and M.S. degrees from Brown
    University and his M.D. and Ph.D. degrees from the University of Washington, Seattle.
    He completed a pediatric residency at the Yale-New Haven Hospital and was a Fellow
    in both genetics and pediatrics at the University of California, San Francisco.
    Dr. Cox is certified by the American Board of Pediatrics and the American Board
    of Medical Genetics. He was an active participant in the large-scale mapping and
    sequencing efforts of the Human Genome Project while carrying out research involving
    the molecular basis of human genetic disease. Dr. Cox has been a member of several
    commissions and boards, including the National Bioethics Advisory Commission (NBAC)
    and the Health Sciences Policy Board of the Institute of Medicine. He has also
    served on a number of international committees, including the Council of the Human
    Genome Organization (HUGO). He has authored over 100 peer-reviewed scientific
    publications and has served on numerous editorial boards. Dr. Cox’s honors include
    election to the Institute of Medicine of the National Academy of Sciences.


    **Claire M. Fraser-Liggett** is Director of the Institute for Genome Sciences
    and a Professor of Medicine at the University of Maryland School of Medicine in
    Baltimore. Previously she was the President and Director of the Institute for
    Genomic Research in Rockville, Maryland. Dr. Fraser-Liggett has played a role
    in the sequencing and analysis of human, animal, plant and microbial genomes to
    better understand the role that genes play in development, evolution, physiology,
    and disease. She led the teams that sequenced the genomes of several microbial
    organisms, including important human and animal pathogens, and as a consequence
    helped to initiate the era of comparative genomics. She has served on a number
    of National Research Council Committees on counterbioterrorism, domestic animal
    genomics, polar biology, and metagenomics. Dr. Fraser-Liggett has more than 220
    scientific publications, and has served on committees of the National Science
    Foundation, Department of Energy, and National Institutes of Health. She received
    her Ph.D. in pharmacology from the State University of New York at Buffalo.


    **Stephen J. Galli** received his B.A. and M.D. from Harvard, in 1968 and 1973,
    respectively, and completed a residency and chief residency in Anatomic Pathology
    at Massachusetts General Hospital (MGH) in 1977. After postdoctoral work with
    Harold F. Dvorak at MGH, he served on the faculty at Harvard Medical School from
    1979 until 1999, when he moved to Stanford as Chair of the Department of Pathology,
    Chief of Pathology at Stanford Hospital & Clinics, Professor of Pathology and
    of Microbiology and Immunology, and the Mary Hewitt Loveless, MD Professor. He
    is also Co-Director of the Stanford Center for Genomics and Personalized Medicine.
    Dr. Galli’s research focuses on the development and function of mast cells and
    basophils (key players in anaphylaxis, allergies, asthma and many other biological
    responses), and on developing new animal models to study the diverse roles of
    these cells in health and disease. Dr. Galli serves on the editorial boards of
    several medical journals and is a co-editor of the *Annual Review of Pathology:
    Mechanisms of Disease*. He received a MERIT Award from the National Institutes
    of Health (1995), Scientific Achievement Awards from the International Association
    of Allergy & Clinical Immunology (1997), and the World Allergy Organization (2011),
    and is an Honorary Fellow of the College of American Pathologists. He was President
    of the American Society for Investigative Pathology (2005–2006) and has been elected
    to the Pluto Club (Association of University Pathologists), the Collegium Internationale
    Allergologicum (he began a four year term as President in 2010), the American
    Society for Clinical Investigation, the Association of American Physicians, the
    Institute of Medicine of the National Academies, and the Accademia Nazionale dei
    Lincei (the National Academy of the Lynxes) in Rome, considered the oldest secular
    scientific society in the Western world. In 2006–2007, the last year of a three-year
    elected term, Dr. Galli was the Chair of the Advisory Board to the President and
    Provost of Stanford University.


    **David B. Goldstein** is currently Professor of Molecular Genetics & Microbiology
    and Director of the Center for Human Genome Variation at Duke University. He received
    his Ph.D. in Biological Sciences from Stanford University in 1994, and from 1999
    to 2005 was Wolfson Professor of Genetics at University College London. Dr. Goldstein
    is the author of over 150 scholarly publications in the areas of population and
    medical genetics. His work focuses on the genetics of human disease and treatment
    response, with a concentration on neuropsychiatric disease and host determinants
    of response to infectious diseases. He is the recipient of one of the first seven
    nationally awarded Royal Society/Wolfson research merit awards in the UK for his
    work in human population genetics and was awarded the *Triangle Business Journal*
    Health Care Heroes Award in 2008 for his work on host determinants of control
    of HIV-1. Most recently, he was appointed the Co-Chair and Chair of the Gordon
    Research Conference meeting on human genetics and genomics for 2011 and 2013.


    **David J. Hunter** is currently the Dean for Academic Affairs at the Harvard
    School of Public Health and the Vincent L. Gregory Professor in Cancer Prevention
    in the Departments of Epidemiology and Nutrition. His research interests include
    cancer epidemiology and molecular and genetic epidemiology. Dr. Hunter analyzes
    inherited susceptibility to cancer and other chronic diseases using molecular
    techniques and studying molecular markers of environmental exposures. He is Co-Chair
    of the NCI Breast and Prostate Cancer Cohort Consortium and Co-Director of the
    NCI Cancer Genetic Markers of Susceptibility (CGEMS) Special Initiative.'
