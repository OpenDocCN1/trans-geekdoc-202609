    [How Do We Get There?](../Text/contents.xhtml#a31)


    After reaching consensus on the need for a New Taxonomy, the Committee deliberated
    extensively on the question “How do we get there?” In this context, “there” refers
    to successful creation of a system for acquiring and analyzing information relating
    the molecular profiles and health histories of large numbers of individuals. In
    [Chapter 3](../Text/chapter03.xhtml), we describe the properties we would expect
    a Knowledge Network of Disease and the New Taxonomy to have and the type of Information
    Commons that would be needed to create them. However, we also emphasized that
    these resources will forever remain “works in progress.” As information technology,
    basic science, health research, and medicine undergo successive waves of change,
    both the content and structure of the New Taxonomy and Information Commons are
    expected to evolve, likely in directions that are presently impossible to envision.
    Consider, by analogy, early attempts to conceptualize the world-wide web compared
    to the use of the internet today. The Committee’s view is that we presently lack
    the infrastructure required to produce a dramatically improved disease taxonomy.
    Rather, we propose a path forward to develop the infrastructure and research system
    needed to create the Knowledge Network of Disease that we believe would be an
    essential underpinning of a molecularly-based taxonomy. We also address the sustainability
    of this initiative. Just as public leadership and investment played essential
    roles in bringing the world-wide web into existence, we believe such investment
    will be critical if we are to achieve a grand synthesis of data-intensive biology
    and medicine. However, we also recognize that, just as the world-wide web needed
    to pay its own way before it could truly flourish, the Knowledge Network and its
    underlying Information Commons will need to do the same.


    The Committee believes that initiatives will be required in three areas to exploit
    the wealth of information now emerging on molecular mechanisms of disease by creating
    a dynamic and comprehensive, yet practical and widely-used, Knowledge Network:


    1.  ***Design of appropriate strategies to collect and integrate disease-relevant
    information.*** The Information Commons would be developed by linking molecular
    data to patient information on a massive scale. Creating a system for establishing
    this linkage for increasing numbers of individuals—and making the resulting data
    widely available to researchers—is the key step in moving toward a Knowledge Network
    and New Taxonomy. Such coupled data can be generated in several ways—including
    the modest-scale, targeted molecular studies on patient materials that dominate
    current practice. However, the most direct and effective discovery paradigm involves
    observational studies that seek to relate molecular data to complete patient medical
    records available as by-products of routine health care. Effective follow-up of
    the most promising hypotheses generated through such studies will require laboratory-based
    biological investigations designed to seek explanations at the biochemical or
    physiological levels.


    2.  ***Implementation of pilot studies to establish a practical framework to discover
    relationships between and among molecular and other patient-specific data, patient
    diagnoses, and clinical outcomes****.* The new discovery model will involve the
    mining of large sets of patient data acquired during the ordinary course of health
    care. This is a novel, largely untested discovery approach. Pilot studies designed
    to identify and overcome obstacles to successful implementation of this approach
    will be required before a set of “best practices” can emerge.'
