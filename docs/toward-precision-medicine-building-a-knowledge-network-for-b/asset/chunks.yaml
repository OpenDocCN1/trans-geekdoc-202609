  trans: '


    委员会发现有必要重新解释——或者说重新制定——HIPAA 法规，并同意 2009 年医学研究院（IOM）的报告《超越 HIPAA 隐私规则：通过研究增强隐私、改善健康》。该报告指出，HIPAA
    隐私规则未能实现预期的隐私保护作用（IOM 2009），而且按照目前的实施方式阻碍了重要的健康研究，并施加了沉重的行政负担（IOM 2009）。该 IOM
    报告得出结论，与要求患者授权将可识别数据用于研究相比，更严格的安全措施将是保护隐私的更好方法。它建议许多基于现有材料和数据的研究应免受修订后的 HIPAA
    隐私规则限制（IOM 2009）。例如，委员会建议研究人员与“安全、信誉且无冲突的中间机构”合作，开发一种协议或“密钥”，以链接来自不同来源的可识别数据（IOM
    2009）。生物样本库可以作为上述试点项目的信誉中间机构，仅向研究人员提供没有明显标识符的数据和材料，但保留编码样本的密钥，以便在适宜时更新临床信息或重新联系患者或捐赠者。此外，IOM
    报告建议“存储个人身份数据的研究人员、机构和组织应建立强大的安全保障措施，并对数据访问设置限制”（IOM 2009）。这些预防措施可能包括：对数据物理安全的要求，以及材料和数据传输协议中的规定，禁止接收去标识数据的研究人员尝试重新识别患者或捐赠者，或直接与他们联系。


    此外，新的知情同意方法正在被提出和测试。一些示例包括：(1) 整合患者对其个人健康信息数据使用的高度特定偏好（PCAST 2010），(2) 针对参与生物样本库使用简版知情同意书，并为希望更多信息的参与者提供额外的补充信息（Beskow
    et al. 2010b），(3) Vanderbilt 和 i2b2 使用的基于去标识数据的退出模型（opt-out model）（Pulley et al.
    2010），以及 (4) 同意全基因组测序和所有表型研究，同时尊重对返回临床验证结果的个性化偏好（Biesecker et al. 2009）。委员会预见，通过不同的同意模式以及向参与者返回具有临床意义的结果，将产生最佳实践和最终的共识标准。


    ## 竞争前协作


    `../Text/contents.xhtml#a38`


    为了加速基于疾病知识网络的新测试和产品的开发，非营利组织与行业之间以及不同营利公司之间的竞争前协作是理想的（IOM 2010b, 2011）。构建“信息公地”（Information
    Commons）的研究需要涉及大量患者的海量数据项目，如果此类协作能够在学术界与工业界之间、以及历史上具有竞争关系的营利公司之间开展，将进展得更加高效（Altshuler
    et al. 2010）。


    这些协作可能包括开发通用标准和数据库格式，以及建立促进数据共享的基础。可以组织财团来广泛共享虽没有直接市场潜力但对下游产品开发至关重要的上研究发现。此类研究的示例包括生物标志物和药物不良反应预测的识别与验证。为了建立繁荣的竞争前协作文化，药物公司需要克服分享已完成临床试验所有数据的抵触情绪，而不仅仅是与监管程序相关的选定数据。最后，最重要的是，需要澄清知识产权指南，并解决对失去知识产权的担忧。只有当个人和组织有动力加入时，竞争前协作才会出现（Vargas
    et al. 2010）。委员会认为，如果没有此类激励，在精准医学（及其在改善健康成果和降低医疗成本方面的辅助效益）成为广泛现实之前，必须获取的新信息将证明是困难甚至是不可能的。


    无论协作涉及商业实体还是局限于学术界，类似的原理都适用。为了鼓励收集材料和数据，收集这些内容的组织和研究人员应获得将其用于研究的优先权，同时确保其他人能够及时获得。在为了向“信息公地”填充数据并从中推导出知识网络而所需的研究背景下，委员会并不认为“人类基因组计划”期间采用的“即时数据发布”模型具有可行性或必要性。然而，它认为对于与创建者无关的研究人员来说，及时、无限制地访问数据集是至关重要的。向信息公地填充数据的成本使得公共资助的研究项目无法进行大量的冗余。同时，这些数据集的规模和复杂性——以及对其分析需要多样化、竞争性投入的需求——使得任何小组无法对其进行长期控制。它们必须被视为公共资源，供广泛且多样化的研究使用，以探索改善医疗和提高医疗交付效率的方法。


    由于委员会怀疑“一刀切”的政策能够同时兼顾激励研究人员与确保数据充分访问之间的冲突价值观，它认为扩大范围和规模的试点项目应重点关注与数据共享相关的挑战，而不是专注于数据收集和分析。


    ## 医疗系统中的竞争与共享


    `../Text/contents.xhtml#a39`


    一个独特且关键的问题是，支付方（如医疗保险公司）是否会开放其庞大的患者和结果数据数据库，以及他们是否愿意将这些数据与其他公司和研究人员的数据整合，以创建如`第三章`（`../Text/chapter03.xhtml`）中描述的知识网络。一方面，这些组织意识到此类努力可能带来的潜在价值和成本节约。另一方面，存在巨大的障碍。主要障碍之一是文化上的：许多此类组织将其数据视为专有资产，用于产生相对于其他组织的竞争优势。例如，大型医疗系统和保险提供者兴趣为医生开发决策支持工具，以减少误诊或不当治疗决策导致的巨大浪费。将生物数据、患者数据和结果信息整合到汇总多个来源数据的知识网络中，可以极大地加速此类努力。然而，如果数据和研究结果被共享，将削弱大型数据提供者可能拥有的某种竞争优势。这种情况下，对整个医疗系统有益的共享与个体提供者和支付者的短期竞争本能之间存在紧张关系。


    '
