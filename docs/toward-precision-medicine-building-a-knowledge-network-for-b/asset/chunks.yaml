    `Keith R. Yamamoto`, Ph.D., is Professor of Cellular and Molecular Pharmacology
    and Executive Vice Dean of the School of Medicine at the University of California,
    San Francisco. He has been a member of the UCSF faculty since 1976, serving as
    Director of the `PIBS` Graduate Program in Biochemistry and Molecular Biology
    (1988–2003), Vice Chair of the Department of Biochemistry and Biophysics (1985–1994),
    Chair of the Department of Cellular and Molecular Pharmacology (1994–2003), and
    Vice Dean for Research, School of Medicine (2002–2003).


    Dr. Yamamoto’s research is focused on signaling and transcriptional regulation
    by intracellular receptors, which mediate the actions of several classes of essential
    hormones and cellular signals; he uses both mechanistic and systems approaches
    to pursue these problems in pure molecules, cells, and whole organisms. Dr. Yamamoto
    was a founding editor of `Molecular Biology of the Cell`, and serves on numerous
    editorial boards and scientific advisory boards, and national committees focused
    on public and scientific policy, public understanding and support of biological
    research, and science education; he chairs the Coalition for the Life Sciences
    (formerly the Joint Steering Committee for Public Policy) and for the National
    Academy of Sciences, he chairs the Board on Life Sciences.


    Dr. Yamamoto has long been involved in the process of peer review and the policies
    that govern it at the National Institutes of Health, serving as Chair of the `Molecular
    Biology Study Section`, member of the `NIH` Director’s Working Group on the Division
    of Research Grants, Chair of the Advisory Committee to the `NIH` Center for Scientific
    Review (`CSR`), member of the `NIH` Director’s Peer Review Oversight Group, member
    of the `CSR` Panel on Scientific Boundaries for Review, member of the Advisory
    Committee to the `NIH` Director, Co-Chair of the Working Group to Enhance `NIH`
    Peer Review, and Co-Chair of the Review Committee for the Transformational `R01`
    Award. Dr. Yamamoto was elected as a member of the American Academy of Arts and
    Sciences in 1988, the National Academy of Sciences in 1989, the Institute of Medicine
    in 2003, and as a fellow of the American Association for the Advancement of Sciences
    in 2002.


    ## NATIONAL RESEARCH COUNCIL STAFF


    `India Hook-Barnard` is a program officer with the Board on Life Sciences of the
    National Research Council. She came to the National Academies from the National
    Institutes of Health where she was a Postdoctoral Research Fellow from 2003 to
    2008. Her research investigating the molecular mechanism of gene expression focused
    on the interactions between `RNA polymerase` and promoter DNA. Dr. Hook-Barnard
    earned her Ph.D. from the Department of Molecular Microbiology and Immunology
    at the University of Missouri. Her graduate research examined translational regulation
    and ribosome binding in `Escherichia coli`. At the National Academies, she contributes
    to projects in a variety of topic areas. Much of her current work is related to
    issues of molecular biology, microbiology, biosecurity, and genomics. She was
    study director for the 2010 report `Sequence-Based Classification of Select Agents:
    A Brighter Line,`, and continues to direct the U.S. National Committee to the
    International Brain Research Organization.


    `Orin Luke` is a Program Assistant with the Board on Life Sciences of the National
    Research Council. He received a B.A. in English from the University of Maryland,
    College Park. Since joining the Board on Life Sciences in 2011, he has served
    as Program Assistant for a variety of projects, including `Molecular Dynamics
    (*2011)`, `Evolution Across the Curriculum` (2011), and `Continuing Assistance
    to the National Institutes of Health on Preparation of Additional Risk Assessments
    for the Boston University NEIDL` (2011) among others. Prior to joining the Board
    on Life Sciences he was a Program Assistant with the Board on Environmental Studies
    and Toxicology.


    `Amanda Mazzawi` most recently worked at The National Academy of the Sciences
    as a Senior Program Assistant, where she had the opportunity to assist in the
    logistical planning and implantation of multiple meetings, projects, documents
    and reports. Prior to her work at `NAS` she spent two years working closely with
    senior management at the North Carolina State University’s Center for Excellence
    in Curricular Engagement. She lead projects and implemented programs that have
    greatly expanded student participation in student/community involvement programs
    across the `NCSU` campus and surrounding communities to facilitate the concept
    of Service-Learning. Amanda currently lives in Ithaca, NY with her husband and
    2 month old son.


    `Carl-Gustav Anderson` is a Program Associate with the Board on Life Sciences
    of the National Research Council. He received a B.A. in Philosophy from American
    University in 2009. He is currently completing his M.A. in the History of Philosophy
    at American University. Before joined the Board on Life Sciences in 2009, he worked
    closely with the All Women’s Action Society (Malaysia), helping to engage young
    men in feminist dialogue and to present a feminist response to the unique identity
    politics of contemporary Malaysia. His current research focuses on the potential
    contributions of Buddhist philosophy and American pragmatism to feminist and queer
    epistemologies.


    Since joining the Board on Life Sciences in 2009, he has served as Program Associate
    for variety of projects, including `Responsible Research with Biological Select
    Agents and Toxins` (2009), `Challenges and Opportunities for Education about Dual
    Use Issues in Life Sciences Research` (2010), `Sequence-Based Classification of
    Select Agents: A Brighter Line` (2010), `Evaluation of a Site-Specific Risk Assessment
    for the Department of Homeland Security’s Planned National Bio- and Agro-Defense
    Facility in Manhattan, Kansas` (2010), `Challenges and Opportunities for Education
    About Dual Use Issues in the Life Sciences` (2010), `Protecting the Frontline
    in Biodefense Research: The Special Immunizations Program` (2011), and `Research
    in the Life Sciences with Dual Use Potential: An International Faculty Development
    Project on Education About the Conduct of Science` (2011), among others. In addition
    to several ongoing studies, he also serves as Program Associate for the United
    States-Canada Regional Committee to the International Brain Research Organization.

