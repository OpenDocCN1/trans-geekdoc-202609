    [Appendix E](../Text/contents.xhtml#a47)


    [Glossary](../Text/contents.xhtml#a47)


    **Biobank** a bank of biological specimens for biomedical research.


    **Biomarker** a characteristic that is objectively measured and evaluated as an
    indicator of normal biological processes, pathogenic processes, or pharmacologic
    responses to a therapeutic intervention (IOM 2010a).


    **Biosamples** Samples of biological materials


    **Candidate gene** a gene whose chromosomal location is associated with a particular
    disease or other phenotype. Because of its location, the gene is suspected of
    causing the disease or other phenotype (NHGRI 2011).


    **Chromosomal translocation** a condition where a fragment of one chromosome is
    broken off and is then attached to another. Depending on which piece of chromosome
    is moved to where, this results in a wide range of medical problems, such as leukemia,
    breast cancer, schizophrenia, or muscular dystrophy (USC 2011).


    **Clinical utility** the ability of a screening or diagnostic test to prevent
    or ameliorate adverse health outcomes such as mortality, morbidity, or disability
    through the adoption of efficacious treatments conditioned on test results (Khoury
    2003).


    **Crowd sourcing** informal reports of large groups of people


    **Database of Genotypes and Phenotypes (dbGap)** developed to archive and distribute
    the results of studies that have investigated the interaction of genotype and
    phenotype (NCBI 2011).


    **Data-intensive biology** understanding of biological processes through models
    and algorithms of mathematics, statistics, and computer science using the vast
    volumes of data generated by new technologies ([http://sc11.supercomputing.org/schedule/event\_detail.php?evid=wksp120](http://sc11.supercomputing.org/schedule/event_detail.php?evid=wksp120)).


    **Decision-support systems** a specific class of computerized information system
    that supports business and organizational decision-making activities (Information
    Builders 2011).


    **Disease marker** specific molecular signature of disease, physiological measurement,
    genotype structural or functional characteristic, metabolic changes, or other
    determinant that may simplify the diagnostic process, make diagnoses more accurate,
    distinguish different causes of disease, or enable physicians to make diagnoses
    before symptoms appear and to track disease progression (Medical Dictionary 2011)


    **Disease risk** the probability that an individual who is initially disease-free
    will developed given disease over specified time or age interval (e.g. one year
    or lifetime) **(**Pigeot 2005).


    **Disease taxonomy** the science of disease classification.'
