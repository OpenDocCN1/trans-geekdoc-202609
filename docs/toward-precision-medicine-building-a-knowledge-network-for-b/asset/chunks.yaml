    \ commonly would be many-to-one, and one-to-many (e.g., particular signs and symptoms\
    \ arise when other parameters fall into many otherwise unrelated clusters). The\
    \ interrelationships among such features within and between the layers could be\
    \ characterized through a variety of representations that attempt to extract meaning\
    \ from the Information Commons. For example, distinct transcriptomes may define\
    \ several types of B-cell lymphomas. Meanwhile, different types of lymphomas,\
    \ defined by transcriptome analysis, may have distinct metabolomic profiles. The\
    \ similarities of multiple diseases could be discerned either from relationships\
    \ among the networks of individual parameters (e.g., transcriptomes of multiple\
    \ B-cell lymphomas) or from common patterns that emerge once multiple parameters\
    \ are combined.\n\n![images/p52.jpg](Images/p52.jpg)\n\n[**FIGURE 3-1** Building\
    \ a biomedical Knowledge Network for basic discovery and Medicine](../Text/contents.xhtml#fi_3-1).\
