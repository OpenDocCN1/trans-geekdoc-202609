    or hobby.


    **Systematized Nomenclature of Medicine (SNOMED)** a comprehensive clinical terminology,
    originally created by the College of American Pathologists (CAP) and, as of April
    2007, owned, maintained, and distributed by the International Health Terminology
    Standards Development Organisation (IHTSDO), a not-for-profit association in Denmark.


    **Systems analyses** analysis of all aspects of a project along with ways to collect
    information about the operation of its parts ([wordnetweb.princeton.edu/perl/webwn](http://wordnetweb.princeton.edu/perl/webwn)).


    **Transcriptome** the complete set of RNA transcripts produced by the genome at
    any one time. The transcriptome is dynamic and changes under different circumstances
    due to different patterns of gene expression. The study of the transcriptome is
    termed transcriptomics ([MedicineNet.com](http://MedicineNet.com). 2011).


    **Translational research** transforms scientific discoveries arising from laboratory,
    clinical, or population studies into clinical applications to reduce cancer incidence,
    morbidity, and mortality. (NCI 2011). [http://www.cancer.gov/researchandfunding/trwg/TRWG-definition-and-TR-continuum](http://www.cancer.gov/researchandfunding/trwg/TRWG-definition-and-TR-continuum).


    **Whole-genome sequencing** determining the sequence of deoxyribonucleotides that
    compose an entire genome, including all of its chromosomes.


