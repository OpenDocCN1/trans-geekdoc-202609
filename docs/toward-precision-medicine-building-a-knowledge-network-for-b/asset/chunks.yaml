    **Queta Bond**（*伯鲁斯-威尔尔姆基金*）监督。他们由国家研究委员会任命，负责确保按照机构程序对本报告进行独立审查，并仔细考虑了所有的评审意见。报告最终内容的责任完全由编写委员会和机构承担。


