- raw: "While observational studies will be primary tools used to develop hypotheses\
    \ about new and clinically useful ways to group patients, the findings emerging\
    \ from such studies will need confirmation and investigation using other approaches.\
    \ For example, there are likely to be a great many ways to classify patients based\
    \ on molecular data, and only some will have clinical utility. In general, clinical\
    \ utility will need to be evaluated using randomized clinical trials.\n\nObservational\
    \ studies will also need to be followed by functional studies that seek to determine\
    \ the mechanistic basis of observed molecular associations with clinical outcomes.\
    \ An example of this type of combined discovery path is the identification of\
    \ BCL11 as a modifier of the severity of sickle cell disease. Initially implicated\
    \ in this role in GWAS studies, the biological basis of the association was quickly\
    \ determined by focused analyses that established that BCL11A acts as a repressor\
    \ of fetal hemoglobin. It is the persistence of fetal hemoglobin into adulthood\
    \ in patients with particular variants at the BCL11 locus that ameliorates the\
    \ symptoms of sickle cell disease (Sankaran et al. 2008). We anticipate that laboratory-based\
    \ research of this sort will be essential to elucidate the underlying reasons\
    \ for observed associations between molecular data and clinical outcomes and that\
    \ these mechanistic insights will play an essential part in establishing the Knowledge\
    \ Network and guiding its use.\n\nThe Committee envisions pilot studies that would:\n\
    \n1.  Be of a sufficient size, as well as scientific and organizational complexity,\
    \ to reveal on the basis of actual experience the most significant barriers to\
    \ the development of point-of-care discovery efforts.\n\n2.  Address one or more\
    \ unmet medical needs for which deeper biological understanding of a disorder\
    \ would likely lead to near-term changes in treatment paradigms and health outcomes.\n\
    \n3.  Include the generation and analysis of a range of molecular-data types potentially\
    \ including, but not limited to genomic data (sequence and expression), metabolomic\
    \ data, proteomic data, and/or microbiome data.\n\n4.  Be led by an organization\
    \ charged with delivering health care with strong partnerships with researchers.\n\
    \n5.  Be supported by research funding to establish a “proof of principle.”\n\n\
    6.  Involve partnerships with a broad array of stakeholders, both public and private,\
    \ including health-care providers, patients, payers, and scientists with expertise\
    \ in genomics, epidemiology, social science, and molecular biology.\n\n7.  Seek\
    \ to remove barriers to data sharing and provide an ethical and legal framework\
    \ for protecting and respecting individual rights.\n\n8.  Develop IT networks\
    \ of sufficient scale to allow assembly analysis and sharing of the integrated\
    \ datasets.\n\n9.  Draw on laboratory research to assess the biological underpinnings\
    \ of associations between molecular data and clinical outcomes.\n\n10.  Establish\
    \ validation standards for clinical, evidence-based decision-making.\n\nBelow,\
    \ we outline two example pilot studies; the first, “The Million American Genomes\
    \ Initiative”, is selected to pilot the use of one of the key layers of ‘omic\
    \ information that is “ready to go”. This pilot project would help to populate\
    \ the Information Commons with relevant data and facilitate learning how to establish\
    \ connections with other layers. By focusing on health care recipients in diverse\
    \ states of health and disease, this project would also help evaluate the new\
    \ discovery paradigm by allowing correlations to be made between germline sequences\
    \ and a vast range of phenotypes. The second “Metabolomic Profiles in Type 2 Diabetes”\
    \ is disease specific and is designed to ensure the early introduction of a different\
    \ ‘omic layer (metabolomics) into the Information Commons and to pilot evaluation\
    \ of more targeted questions in the new discovery paradigm.\n\n[EXAMPLE PILOT\
    \ STUDY 1:  \n\nTHE MILLION AMERICAN GENOMES INITIATIVE (MAGI)](../Text/contents.xhtml#a34)\n\
    \nA natural pilot study that would contribute to the development of the Information\
    \ Commons and Knowledge Network of Disease would involve the sequencing of the\
    \ genomes of one million or more individuals and the establishment of appropriate\
    \ infrastructure for drawing correlations between the sequence data and the medical\
    \ histories of these individuals. In focusing on a pilot study involving complete\
    \ sequence data, we do not intend to elevate sequence data above other data in\
    \ their importance to the Knowledge Network. Instead, this proposal recognizes\
    \ that sequencing methods are “ready to go,” or nearly so, for very-large-scale\
    \ implementation and the acquisition of such data in a point-of-care setting would,\
    \ of necessity, require addressing key challenges related to informed consent,\
    \ protection of data, data storage, and data analysis that will be common to all\
    \ types of data. This proposal also recognizes that sequencing on this scale will\
    \ inevitably be undertaken in the near future in an effort to make connections\
    \ between human-genome-sequence data and common diseases. We view it as important\
    \ to the development of the Knowledge Network that this effort be grounded in\
    \ the new discovery model, which would make possible systematic comparisons of\
    \ the molecular data with electronic medical records, now and into the future:\
    \ that is, the study design should allow correlations between genotypes determined\
    \ now and health outcomes that occur years or decades later.\n\nThe sequencing\
    \ of one million genomes would include a sufficient range of individuals with\
    \ different health outcomes and sufficient statistical power to detect associations.\
    \ For example, amoxicillin-clavulanic acid is a widely used antibiotic that causes\
    \ severe liver injury in one out of approximately 15,000 exposures. In a one-million-patient\
    \ sample we would expect to include many individuals with this—and other similarly\
    \ rare—adverse drug reactions and other medical conditions. It is also essential\
    \ that the sample size be large enough to build a concrete picture of the distribution\
    \ of gene variants in individuals free of specific diagnoses.\n\n[EXAMPLE PILOT\
    \ STUDY 2:  \n\nMETABOLOMIC PROFILES IN TYPE 2 DIABETES](../Text/contents.xhtml#a35)\n\
    \nRecent metabolomic profiling of blood samples from individuals who subsequently\
    \ developed type 2 diabetes showed marked differences in the characteristics of\
    \ branched-chain amino acids sampled from blood draws (Wang et al. 2011). These\
    \ early analyses suggest the potential of metabolomic analyses to help identify\
    \ those individuals at most risk of developing diabetes, and in particular, may\
    \ help to elucidate the physiological steps involved in the transition between\
    \ insulin-resistant pre-diabetes and full-blown diabetes. We therefore envision\
    \ a pilot project focused on understanding this transition using metabolomic profiles\
    \ in blood. This work would begin with targeted quantitative metabolomic studies\
    \ transitioning toward more comprehensive metabolomic profiles over time. Such\
    \ an effort, combined with knowledge gained from Pilot 1 and research from other\
    \ layers of the Information Commons (such as the microbiome and exposome) could\
    \ contribute substantially to strategies to delay or prevent the development of\
    \ type 2 diabetes.\n\n[ANTICIPATED OUTCOMES OF THE PILOT STUDIES](../Text/contents.xhtml#a36)"
  fmt: '

    While observational studies will be primary tools used to develop hypotheses about
    new and clinically useful ways to group patients, the findings emerging from such
    studies will need confirmation and investigation using other approaches. For example,
    there are likely to be a great many ways to classify patients based on molecular
    data, and only some will have clinical utility. In general, clinical utility will
    need to be evaluated using randomized clinical trials.


    Observational studies will also need to be followed by functional studies that
    seek to determine the mechanistic basis of observed molecular associations with
    clinical outcomes. An example of this type of combined discovery path is the identification
    of `BCL11` as a modifier of the severity of sickle cell disease. Initially implicated
    in this role in `GWAS` studies, the biological basis of the association was quickly
    determined by focused analyses that established that `BCL11A` acts as a repressor
    of fetal hemoglobin. It is the persistence of fetal hemoglobin into adulthood
    in patients with particular variants at the `BCL11` locus that ameliorates the
    symptoms of sickle cell disease (Sankaran *et al.* 2008). We anticipate that laboratory-based
    research of this sort will be deential to elucidate the underlying reasons for
    observed associations between molecular data and clinical outcomes and that these
    mechanistic insights will play an essential part in establishing the Knowledge
    Network and guiding its use.


    ### The Committee envisions pilot studies that would:


    1. Be of a sufficient size, as well as scientific and organizational complexity,
    to reveal on the basis of actual experience the most significant barriers to the
    development of point-of-care discovery efforts.

    2. Address one or more unmet medical needs for which deeper biological understanding
    of a disorder would likely lead to near-term changes in treatment paradigms and
    health outcomes.

    3. Include the generation and analysis of a range of molecular-data types potentially
    including, but not limited to genomic data (sequence and expression), metabolomic
    data, proteomic data, and/or microbiome data.

    4. Be led by an organization charged with delivering health care with strong partnerships
    with researchers.

    5. Be supported by research funding to establish a “proof of principle.`.

    6. Involve partnerships with a broad array of stakeholders, both public and private,
    including health-care providers, patients, payers, and scientists with expertise
    in genomics, epidemiology, social science, and molecular biology.

    7. Seek to remove barriers to data sharing and provide an ethical and legal framework
    for protecting and respecting individual rights.

    8. Develop IT networks of sufficient scale to allow assembly analysis and sharing
    of the integrated datasets.

    9. Draw on laboratory research to assess the biological underpinnings of associations
    between molecular data and clinical outcomes.

    10. Establish validation standards for clinical, evidence-based decision-making.


    Below, we outline two example pilot studies; the first, “The Million American
    Genomes Initiative”, is selected to pilot the use of one of the key layers of
    ‘omic information that is “ready to go”. This pilot project would help to populate
    the Information Commons with relevant data and facilitate learning how to establish
    connections with other layers. By focusing on health care recipients in diverse
    states of health and disease, this project would also help evaluate the new discovery
    paradigm by allowing correlations to be made between germline sequences and a
    vast range of phenotypes. The second “Metabolomic Profiles in Type 2 Diabetes”
    is disease specific and is designed to ensure the early introduction of a different
    ‘omic layer (metabolomics) into the Information Commons and to pilot evaluation
    of more targeted questions in the new discovery paradigm.


    ### EXAMPLE PILOT STUDY 1: THE MILLION AMERICAN GENOMES INITIATIVE


    The sequencing of one million genomes would include a sufficient range of individuals
    with different health outcomes and sufficient statistical power to detect associations.
    For example, amoxicillin-clavulanic acid is a widely used antibiotic that causes
    severe liver injury in one out of 15,000 exposures. In a one-million-patient sample
    we would expect to include many individuals with this—and similarly rare—adverse
    drug reactions and other medical conditions. It is also essential that the sample
    size be large enough to build a concrete picture of the distribution of gene variants
    in individuals free of specific diagnoses.


    ### EXAMPLE PILOT STUDY 2: METABOLOMIC PROFILES IN TYPE 2 DIABETES


    Recent metabolomic profiling of blood samples from individuals who subsequently
    developed type 2 diabetes showed marked differences in the characteristics of
    branched-chain amino acids sampled from blood (Wang *et al.* 2011). These early
    analyses suggest the potential of metabolomic analyses to help identify those
    individuals at most risk of developing diabetes, and in particular, may help to
    elucidate the physiological steps involved in the transition between insulin-resistant
    pre-diabetes and full-blown diabetes. We therefore envision a pilot project focused
    on understanding this transition using metabolomic profiles in blood. This work
    would begin with targeted quantitative metabolomic studies transitioning toward
    more comprehensive metabolomic profiles over time.

