    This report lays out the case for developing such a Knowledge Network of Disease
    and associated New Taxonomy. `[Chapter 2](../Text/chapter02.xhtml)` asks “Why
    now?” It examines basic trends in research, information technology, clinical medicine,
    and public attitudes that have created an unprecedented opportunity to influence
    biomedical research and health-care delivery in ways that will benefit all stakeholders.


    `[Chapter 3](../Text/chapter03.xhtml)` asks “What would a Knowledge Network of
    Disease and New Taxonomy look like?” It describes why the system needs to be dynamic,
    continuously evolving, integrative, and flexible, and why it needs to enable interrogation
    by a wide range of users, from basic scientists to clinicians, health-care workers,
    and the general public.


    `[Chapter 4](../Text/chapter04.xhtml)` asks “How do we get there?” It describes
    the need for a series of pilot studies to evaluate the feasibility of creating
    an individual-centric Information Commons and deriving a Knowledge Network and
    New Taxonomy from it, and to begin to explore the utility of these resources for
    improving individual health outcomes. This chapter also addresses the impediments
    that need to be overcome and changes in medical education that will be required
    before the Knowledge Network of Disease and resulting New Taxonomy can be expected
    to achieve their full potential for improving human health.


    In `[Chapter 5](../Text/chapter05.xhtml)`, the report closes with an epilogue
    that summarizes the Committee’s rationale for its recommendations and describes
    how the new resources described in this report could serve the needs of basic
    scientists, translational researchers, policy makers, insurers, medical trainees,
    clinicians, and patients.


    ^([1](#chapter01.xhtml#ch1_ft1)) These scenarios are illustrative examples describing
    typical patients. They are not based on individual patients, but reflect current
    medical practice.


    ^([2](#chapter01.xhtml#ch1_ft2)) To clarify, the committee is not suggesting that
    all diseases would have an equally precise taxonomy, rather each disease should
    be classified, and treatment provided, using the best available molecular information
    about the mechanism of disease.


    ^([3](#chapter01.xhtml#ch1_ft3)) For example, an information resource used extensively
    by both clinicians and researchers, `PubMed/MEDLINE`, is built on the `MeSH` terminology
    hierarchy of diseases.


    ^([4](#chapter01.xhtml#ch1_ft4)) The `ICD-11` revision process is closely coordinated
    with `SNOMED`—the Systematized Nomenclature of Medicine developed by the International
    Health Terminology Standards Development Organization (`IHTSDO`). `SNOMED` is
    a large, clinically focused ontology that uses high-level nodes to aggregate more
    granular data. The `WHO` and `IHTSDO` have signed a memorandum of understanding
    so that the two systems will be complementary rather than competing. The intent
    is to harmonize the two systems so that the aggregation layer of `SNOMED` corresponds
    to `ICD-11` and the extensions of `ICD-11` become elements of `SNOMED`.


    ^([5](#chapter01.xhtml#ch1_ft5)) It should be noted that the International Classification
    of Diseases for Oncology (`ICD-O`) already attempts to capture genomic data relevant
    to disease definitions. The third series of the `WHO` Monographs on the Pathology
    and Genetics of Tumours sought to integrate genomic data, where available, into
    disease definitions and indeed today many tumor types are molecularly defined
    (Vardiman et al. 2009;. Campo et al. 2011; Travis et al. 2011).


    `[2](../Text/contents.xhtml#a9)`


    `[Why Now?](../Text/contents.xhtml#a9)`


    ## Why Now?


    The rise of data-intensive biology, advances in information technology, and changes
    in the way health care is delivered have created a compelling opportunity to improve
    the diagnosis and treatment of disease by developing a Knowledge Network, and
    associated New Taxonomy, that would integrate biological, patient, and outcomes
    data on a scale hitherto beyond our reach. Key enablers of this opportunity include:


    *   New capabilities to compile molecular data on patients on a scale that was
    unimaginable 20 years ago.

    *   Increasing success in utilizing molecular information to improve the diagnosis
    and treatment of disease.

    *   Advances in information technology, such as the advent of electronic health
    records, that make it possible to acquire detailed clinical information about
    large numbers of individual patients and to search for unexpected correlations
    within enormous datasets.

    *   A “perfect storm” among stakeholders that has increased receptivity to fundamental
    changes throughout the biomedical research and healthcare-delivery systems.

    *   Shifting public attitudes toward molecular data and privacy of healthcare
    information.


    Scientific research, information technology, medicine, and public attitudes are
    all undergoing unprecedented changes. Biology has acquired the capacity to systematically
    compile molecular data on a scale that was unimaginable 20 years ago. Diverse
    technological advances make it possible to gather, integrate, analyze, and disseminate
    health-related biological data in ways that could greatly advance both biomedical
    research and clinical care. Meanwhile, the magnitude of the challenges posed by
    the sheer scientific complexity of the molecular influences on health and disease
    are becoming apparent and suggest the need for powerful new research resources.
    All these changes provide an opportunity for the biomedical science and clinical
    communities to come together to improve both the discovery of new knowledge and
    health-care delivery. As discussed in this chapter, the Committee concluded that
    this opportunity could best be exploited through a major, long-term commitment
    to create an Information Commons, a Knowledge Network of Disease, and a New Taxonomy.


    ## [BIOLOGY HAS BECOME A DATA-INTENSIVE SCIENCE](../Text/contents.xhtml#a10)


    Advances in `DNA-sequencing` technology powerfully illustrate biology’s conversion
    to a data-intensive science. The first papers describing practical methods of
    `DNA` sequencing were published in 1977 (Maxam and Gilbert 1977; Sanger et al.
    1977). These methods required radioisotopic labeling of `DNA`, hand-crafting of
    large electrophoretic gels, and considerable expertise with biochemical and recombinant-DNA
    techniques. Although the impact of these early-DNA-sequencing methods on biological
    discovery was profound, the total amount of sequence deposited in `GenBank`, the
    central depository for such data, did not pass one billion base pairs (one-third
    of the length of a single human genome) until 1997 (NCBI 2011a), and it only reached
    this landmark after a first generation of automated instruments came into widespread
    use (Favello et al. 1995). Since then > 300 billion base pairs (Benson et al.
    2011) have been deposited, illustrating the still ongoing explosion of genomic
    data in the last 20 years.

