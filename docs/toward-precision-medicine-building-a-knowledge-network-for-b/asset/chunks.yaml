    \ an individual-centric database, dbGap (the database of Genotypes and Phenotypes).\
    \ This database was “developed to archive and distribute the results of studies\
    \ that have investigated the interaction of genotype and phenotype” (NCBI 2011b).\
    \ The Committee considers NCBI’s success in doing so—despite severe current constraints\
    \ on the sharing of phenotypic information about individuals—as evidence that\
    \ the obstacles to creating an Information Commons can be overcome. This issue\
    \ is discussed in more detail in [Chapter 4](../Text/chapter04.xhtml). However,\
    \ the important point is that little of the NCBI’s vast current store of information\
    \ could, even in principle, be organized along the lines suggested for the Information\
    \ Commons. This information was not collected in a way that allows the individual\
    \ to be the central organizing principle, and no amount of redesign of the inter-connections\
    \ between different entries in the current system could achieve the goals the\
    \ Committee has outlined."
  fmt: '

    The Knowledge Network of Disease, created by integrating data in the Information
    Commons with fundamental biological knowledge, drawn from the biomedical literature
    and existing community databases such as `GenBank`, would be the centerpiece of
    the informational resources underlying the New Taxonomy. The Committee envisions
    this network as:


    ### Highly inter-connected

    In order to extract relationship information between multiple parameters—for example,
    the transciptome and the exposome—the multiple data layers must be inter-connected
    (see [Figure 3-1](../Text/chapter03.xhtml#fig_3-1)). Ideally, each information
    layer would be connected to every other layer: thus, “signs and symptoms” would
    be linked to mutations, mutations to metabolic defects, exposome to the epigenome,
    and so forth. The links could be one-to-one but most commonly would be many-to-one,
    and one-to-many (e.g., particular signs and symptoms arise when other parameters
    fall into many otherwise unrelated clusters). The interrelationships among such
    features within and between the layers could be characterized through a variety
    of representations that attempt to extract meaning from the Information Commons.
    For example, distinct transcriptomes may define several types of B-cell lymphomas.
    Meanwhile, different types of lymphomas, defined by transcriptome analysis, may
    have distinct metabolomic profiles. The similarities of multiple diseases could
    be discerned either from relationships among the networks of individual parameters
    (e.g., transcriptomes of multiple B-cell lymphomas) or from common patterns that
    emerge once multiple parameters are combined.


    ![images/p52.jpg](Images/p52.jpg)


    [**FIGURE 3-1** Building a biomedical Knowledge Network for basic discovery and
    Medicine](../Text/contents.xhtml#fi_3-1).


    At the center of a comprehensive biomedical information network is an Information
    Commons that contains current disease information linked to individual patients
    and is continuously updated by a wide set of new data emerging though observational
    studies during the course of normal health care. The data in the Information Commons
    and Knowledge Network serve three purposes: (1) they provide the basis to generate
    a dynamic, adaptive system that informs taxonomic classification of disease; (2)
    they provide the foundation for novel clinical approaches (diagnostics, treatments,
    strategies), and (3) they provide a resource for basic discovery. Validated findings
    that emerge from the Knowledge Network, such as those which define new diseases
    or subtypes of diseases that are clinically relevant (e.g., which have implications
    for patient prognosis or therapy) would be incorporated into the New Taxonomy
    to improve diagnosis (i.e., disease classification) and treatment. The fine-grained
    nature of the taxonomic classification would aid in clinical decision-making by
    more accurately defining disease.


    SOURCE: Committee on A Framework for Developing a New Taxonomy of Disease.


    ### Flexible

    A highly inter-connected Knowledge Network would link multiple individual networks
    of parameters in a flexible way. A user could chose to interrogate only a small
    part of the network by limiting his or her analysis to a single information layer,
    or even a small portion of this layer; alternatively, a user could interrogate
    the complex interrelationship of multiple parameters. High flexibility ensures
    easy cross-comparison and cross-correlation of any desired dataset, making it
    a versatile tool for a wide spectrum of applications ranging from basic research
    to clinical studies and healthy system administration.


    ### Widely accessible

    The Knowledge Network would need to be accessible and usable by a wide range of
    stakeholders from basic scientists to clinicians, health-care workers, and the
    public. Furthermore, the available information would need to be mineable in ways
    that are custom-tailored to the needs of different users, possibly by implementation
    of purpose-specific user interfaces.


    While the Committee agreed upon the generalities listed above and illustrated
    in [Figure 3-1](../Text/chapter03.xhtml#fig_3-1) about the Information Commons
    and Knowledge Network—and their relationship to a New Taxonomy— specifics of implementation
    such as the detailed design of the Information Commons, the information technology
    platforms used to create it, questions about where key infrastructure should be
    physically housed, who would oversee it, and how the Information Commons would
    be financed, were considered beyond the scope of the Committee’s charge in a framework
    study. Nonetheless, dramatic developments in the fields of medical information
    technology—and other developments discussed in [Chapter 2](../Text/chapter02.xhtml)—give
    the Committee confidence that the creation and implementation of this ambitious
    and novel infrastructure is a feasible goal.


    ###THE PROPOSED KNOWLEDGE NETWORK WOULD FUNDAMENTALLY DIFFER FROM CURRENT BIOMEDICAL
    INFORMATION SYSTEMS](../Text/contents.xhtml#a25)


    Immense progress has been made during the past 25 years in organizing our knowledge
    of basic biology, health, and disease, even as many components of this knowledge
    base have grown super-exponentially. The National Library of Medicine and its
    National Center for Biotechnology Information division (`NCBI`), created in 1988,
    maintains the closest current counterpart to the information infrastructure that
    the Committee envisions. The `NCBI` maintains a vast array of information about
    basic biology, health, and disease—ranging from the `PubMed` system for indexing
    the biomedical literature to `GenBank`, the primary depository for DNA-sequence
    data—and its databases are queried daily by nearly anyone involved in biomedical
    research. So, what is the difference between the Committee’s vision of the Information
    Commons and Knowledge Network of Disease and reasonable extrapolations of what
    the `NCBI` has already accomplished?


    The key difference is that the Information Commons, which would underlie the other
    databases, would be “individual-centric.” The various databanks curated by `NCBI`
    generally only contain a single disease parameter and even if multiple pieces
    of information from an individual make it into multiple databanks—say a breast
    cancer patient’s transcriptome stored in the `GeneOmnibus` database of published
    microarray data and information about her chromosome translocations in the `Cancer
    Chromosome` databank—they are not linked between databases. An independent researcher,
    who was not involved in the study that contributed these entries, has no way of
    knowing that they are from the same individual. As a consequence, relationships
    between multiple parameters that determine disease status in a given individual
    are impossible to extract. However, motivated by the recent proliferation of GWAS
    studies, `NCBI` has developed an individual-centric database, `dbGap` (the database
    of Genotypes and Phenotypes). This database was “developed to archive and distribute
    the results of studies that have investigated the interaction of genotype and
    phenotype” (`NCBI 2011b`). The Committee considers `NCBI`’s success in doing so—despite
    severe current constraints on the sharing of phenotypic information about individuals—as
    evidence that the obstacles to creating an Information Commons can be overcome.
    This issue is discussed in more detail in [Chapter 4](../Text/chapter04.xhtml).
    However, the important point is that little of the `NCBI`’s vast current store
    of information could, even in principle, be organized along the lines suggested
    for the Information Commons. This information was not collected in a way that
    allows the individual to be the central organizing principle, and no amount of
    redesign of the inter-connections between different entries in the current system
    could achieve the goals the Committee has outlined.

    '
  trans: '


    疾病知识网络（Knowledge Network of Disease）通过整合信息公共池（Information Commons）中的数据以及源自生物医学文献和现有社区数据库（如
    `GenBank`）的基础生物学知识，成为新分类法（New Taxonomy）底层信息资源的核心。委员会设该网络具有：


    ### 高互连性

    为了提取多个参数（例如转录组和暴露组）之间的关系信息，多个数据层必须相互连接（参见图 3-1）。理想情况下，每个信息层都将连接到其他所有层：因此，“体征”将与突变关联，突变与代谢缺陷关联，暴露组与表观基因组关联，以此此类推。这些链接可以是一对一，但最常见的是多对一和一对多（例如，当其他参数落在许多互不相关的簇时，会出现特定的体征）。此类特征在层内及层间之间的相互关系可以通过多种表示方法来表征，试图从信息公共池中提取意义。例如，不同的转录组可能定义多种
    B 细胞淋巴瘤。同时，通过转录组分析定义的不同类型淋巴瘤可能具有不同的代谢组概谱。多种疾病的相似性可以从单个参数网络之间的关系（例如多种 B 细胞淋巴瘤的转录组）中，也可以从多个参数结合后出现的共同模式中发现。


    ![images/p52.jpg](img/p52.jpg)


    **图 3-1** 构建用于基础发现和医学的生物医学知识网络。


    综合生物医学信息网络的核心是一个信息公共池，它包含了与个体关联的当前疾病信息，并根据正常护理过程中观察研究产生的大量新数据不断更新。信息公共池和知识网络中的数据有三个用途：(1)它们为生成动态、自适应系统提供了基础，该系统指导疾病的分类；(2)它们为新型临床方法（诊断、治疗、策略）提供了基础；(3)它们为基础发现提供了资源。来自知识网络的经过验证的发现，例如定义新疾病或具有临床意义的疾病亚型（例如对患者预后或治疗有影响的亚型），将被纳入新分类法，以改进诊断（即疾病分类）和治疗。分类法的细粒度特征将通过更准确地定义疾病来辅助临床决策。


    来源：建立疾病新分类法框架委员会。


    ### 灵活性

    高度互连的知识网络将以灵活的方式将多个参数的个体网络连接起来。用户可以选择将其分析限制在单个信息层，甚至是该层的一小部分，从而只查询网络的一小部分；或者，用户也可以查询多个参数之间复杂的相互关系。高灵活性确保了任何所需数据集都能轻松进行交叉比较和交叉相关分析，使其成为适用于从基础研究到临床研究以及健康系统管理的广泛应用领域的多功能工具。


    ### 广泛可访问性

    知识网络需要供从基础科学家到临床医生、医疗工作人员和公众在内的广泛利益相关者访问和使用。此外，可用信息需要以针对不同用户需求定制的方式进行挖掘，这可能通过实现针对特定目的的用户界面来实现。


    虽然委员会对上述列出的以及在图 3-1 中说明的关于信息公共池和知识网络——以及它们与新分类法之间关系的般性描述达成共识，但实施的具体细节，例如信息公共池的详细设计、用于创建它的信息技术平台、关于关键基础设施应物理存放在何处、谁来监督它以及信息公共池如何资助的问题，被认为超出委员会在框架研究中的职责范围。尽管如此，医学信息技术领域的巨大发展——以及第
    2 章中讨论的其他进展——使委员会有信心认为创建和实施这一心心勃勃且新颖的基础是一个可行的目标。


    ### 拟的知识网络从根本上区别于目前的生物医学信息系统](../Text/contents.xhtml#a25)


    在过去的 25 年里，在组织我们对基础生物学、健康和疾病的知识方面取得了巨大进展，尽管该知识库的许多组件呈超指数级增长。创建于 1988 年的国家医学图书馆及其国立生物技术信息中心（`NCBI`）部门维持着与委员会设想的信息基础设施最接近的当前对应物。`NCBI`
    维护着关于基础生物学、健康和疾病的海量信息——从用于索引生物医学文献的 `PubMed` 系统到 DNA 序列数据的主要存储库 `GenBank`——其数据库每天被几乎参与生物医学研究的人员查询。那么，委员会设想的信息公共池和疾病知识网络，与
    `NCBI` 已完成成就的合理推断之间有什么区别？


    关键区别在于，作为其他数据库基础的信息公共池将是“以个体为中心的”。`NCBI` 策划的各种数据库通常只包含单一疾病参数，即使来自一个个体的多个部分信息进入了多个数据库——例如，一个乳腺癌患者的转录组存储在已发表微阵数据的
    `GeneOmnibus` 数据库中，而她的染色体易位信息存储在 `Cancer Chromosome` 数据库中——但它们在数据库之间并没有关联。一个没有参与贡献这些条目研究的独立研究人员无法知道这些信息来自同一个个体。结果是决定给定个体疾病状态的多个参数之间的关系是不提取的。然而，受近期全基因组关联分析（GWAS）研究激增的推动，`NCBI`
    开发了一个以个体为中心的数据库 `dbGap`（基因型与表型数据库）。该数据库“是为了存储和分发研究基因型与表型相互作用而开发的”（`NCBI 2011b`）。委员会认为
    `NCBI` 在这方面的成功（尽管目前在共享个体表型信息方面存在严重限制）证明了克服创建信息公共池障碍是可能的。这个问题在第 4 章中进行了更详细的讨论。然而，重要点是，`NCBI`
    目前的海量存储信息大部分即使在原则上也无法按照信息公共池建议的方式进行组织。这些信息的收集方式无法允许个体成为核心组织原则，对现有系统中不同条目之间的连接进行任何重新设计，也无法实现委员会所概述的目标。


    '
