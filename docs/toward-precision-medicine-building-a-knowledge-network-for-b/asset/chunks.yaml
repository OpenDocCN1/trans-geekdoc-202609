    \ biological processes](../Text/contents.xhtml#fi_S-1).\n\nSOURCE: Committee on\
    \ A Framework for Developing a New Taxonomy of Disease.\n\n# CONCLUSIONS\n\nThe\
    \ Committee hosted a two-day workshop that convened diverse experts in both basic\
