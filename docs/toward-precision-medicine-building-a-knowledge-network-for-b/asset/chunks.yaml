    这些治疗决策不需要基于此类碎片化的信息做出。如果所有 `BRCA1` 或 `BRCA2` 突变呈阳性的患者都能受到其医疗保健人员的长期追踪，那么就能确定每种突变患者中患癌症的比例，以及患的是哪种癌症。我们可以评估预防性手术降低风险的程度。我们可以评估增加癌症筛查的有效性、筛选这些患者的最佳方法，以及由于增加筛查不可避免的假阳性结果而导致的并发症。到目前为止，这些努力主要基于较少患者数量或不能完全代表更大人群的队列，因为对大量未筛选的患者整合遗传信息、治疗决策和结果数据在实践上是不行的。然而，基因组和信息技术的最新进展使得通过整合已存在的大数据集来系统地解决这些问题成为可能（参见框
    2-2）。


    `BRCA1` 和 `BRCA2` 只是许多基因中的两个，个体之间的差异对疾病风险和治疗决策具有重要影响。人类基因组大约有 20,000 个基因，其中许多基因可能像
    `BRCA1` 一样具有许多疾病相关的等位基因。即使这些变异中只有一部分对疾病风险或治疗反应具有重要影响，我们也有潜力通过大规模评估表型-基因型相关性的工作，大大提高疾病的检测、诊断和治疗。通过将患者的基因型与健康信息和结果数据相结合，新的分类法可以识别出许多对医疗保健具有重要意义的新遗传变异。


    有充分理由预计遗传对大多数常见疾病的影响将是复杂的。在每个患者身上，多个基因的变异都会影响疾病的发生、进展和对治疗的反应，对这些过程的长期环境调节将是规律而非例外。虽然最近的突破专注于该领域技术快速发展的基因组学，但未来我们在理解表观遗传、环境、微生物和社会对疾病风险和进展的贡献方面可能会取得类似的进展。在这种情况下，迫切需要以更细的粒度、更多地参考底层生物学，并在一个能够多层次整合新信息的动态知识网络背景下对疾病进行分类。揭示这些对人类疾病的多样影响将是
    21 世纪的一项重大科学挑战。


    # [信息技术的飞速进展正驱动系统性变化](../Text/contents.xhtml#a13


    美国和其他国家目前正在投入数十亿美元的资金来实施电子健康记录（EHRs），以改善临床护理。此类记录的开发为整合医疗保健信息和生物学数据创造了若干新机会，并为寻找临床检测结果、患者数据和结果之间的新联系提供了可能。


    *   `EHRs` 功能的增强和搜索工具性能的提升为对各种疾病进行大规模队列研究打开了大门。具有感兴趣特征的患者——例如，风湿性关节炎患者或对抗抑郁药物无反应的患者——可以通过
    `EHRs` 进行筛选。这些组中的患者可以被招募提供样本，或对其丢弃的临床样本进行研究分析。

    *   `EHRs` 可用于提供额外的临床描述，或帮助填充队列或生物库中研究受试者的缺失细节。无论哪种情况，结果都将是丰富的临床描述。

    *   `EHRs` 功能的增强和搜索工具性能的提升为对各种疾病进行大规模队列研究打开了大门。具有感兴趣特征的患者——例如，风湿性关节炎患者或对抗抑郁药物无反应的患者——可以通过
    `EHRs` 进行筛选。这些组中的患者可以被招募提供样本，或对其丢弃的临床样本进行研究分析。

    *   `EHRs` 可用于提供额外的临床描述，或帮助填充队列或生物库中研究受试者的缺失细节。无论哪种情况，结果都将是丰富的临床描述。

    *   `EHRs` 功能的增强和搜索工具性能的提升为对各种疾病进行大规模队列研究打开了大门。具有感兴趣特征的患者——例如，风湿性关节炎患者或对抗抑郁药物无反应的患者——可以通过
    `EHRs` 进行筛选。这些组中的患者可以被招募提供样本，或对其丢弃的临床样本进行研究分析。


    # [框 2-2 前瞻性队列研究——特殊作用](../Text/contents.xhtml#bo_2-2


    关于诱发复杂疾病的“风险因素”的大部分知识来自观察性研究，包括将病例组的生活经验与对照组比较的病例对照研究，或是对大量人群的前瞻性队列研究。


    例如，关于在血浆或血清中测量的生化因子（如胆固醇或其他具有心脏发作风险的脂质）预测价值的许多已知，很大程度上源于前瞻性研究，如弗明格汉心脏研究（`FHS`）。前瞻性研究特别有价值，因为疾病的发生或治疗可能会改变水平，导致基于确诊病例水平的推断产生偏差。这些生物标志物可以与吸烟、体重指数等生活方式风险因素的信息，以及诊断后可能变化的测量值（如血压）相结合，创建出如弗明格汉风险评分之类的评分，广泛用于预测
    10 年心脏发作风险（Anderson et al. 1991）。该风险评分基于略多 5,500 名受试者的数据，其中发生了数百例心脏病（`CHD`）事件。这种规模的研究对于像
    `CHD` 等相对常见的疾病事件是充足的，但对于罕见疾病来说太小了。更大的前瞻性队列研究，如护士健康研究（Missmer et al. 2004）和欧洲癌症展望调查（`EPIC`）（Kaaks
    et al. 2005），探索了数万名女性队列中循环类固醇激素水平与乳腺癌风险之间的关系，尽管有数百例病例，但 `FHS` 中的病例数量仍然较少。对于效应较小的风险因素，或研究多个风险因素之间的相互作用，即使是最大的队列研究病例也不足以产生效力，因此需要如
    NCI 乳腺与前列腺队列联盟（Campa et al. 2005）这样的联盟来产生所需的数千例病例。对于较不常见的疾病，再次需要联盟，因为单一研究将没有足够的病例。


    一些国家已经建立了大型前瞻性队列研究，如英国生物库（约 50 万人）（Palmer 2007），一些国家也提议在美国进行类似的研究（Collins 2004）。然而，在美国这样的研究研究中招募
    50 万或更多人员、追踪几十年、并为研究数据库获取医疗诊断信息，估计成本将达到数十亿美元（Willett et al. 2007），即使许多可行性问题可以得到解决。

