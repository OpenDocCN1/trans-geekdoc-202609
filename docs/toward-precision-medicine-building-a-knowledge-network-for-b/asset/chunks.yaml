    \ Commons that contains current disease information linked to individual patients\
    \ and is continuously updated by a wide set of new data emerging though observational\
    \ studies during the course of normal health care. The data in the Information\
    \ Commons and Knowledge Network serve three purposes: (1) they provide the basis\
    \ to generate a dynamic, adaptive system that informs taxonomic classification\
    \ of disease; (2) they provide the foundation for novel clinical approaches (diagnostics,\
    \ treatments, strategies), and (3) they provide a resource for basic discovery.\
    \ Validated findings that emerge from the Knowledge Network, such as those which\
    \ define new diseases or subtypes of diseases that are clinically relevant (e.g.,\
    \ which have implications for patient prognosis or therapy) would be incorporated\
    \ into the New Taxonomy to improve diagnosis (i.e., disease classification) and\
    \ treatment. The fine-grained nature of the taxonomic classification would aid\
    \ in clinical decision-making by more accurately defining disease.  \n\nSOURCE:\
    \ Committee on A Framework for Developing a New Taxonomy of Disease.\n\n***Flexible***.\
    \ A highly inter-connected Knowledge Network would link multiple individual networks\
    \ of parameters in a flexible way. A user could chose to interrogate only a small\
    \ part of the network by limiting his or her analysis to a single information\
    \ layer, or even a small portion of this layer; alternatively, a user could interrogate\
