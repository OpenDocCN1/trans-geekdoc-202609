- raw: 'The Committee found a need to re-interpret—or perhaps reformulate—HIPAA regulations,
    and is in agreement with the 2009 IOM report “Beyond the HIPAA Privacy Rule: Enhancing
    Privacy, Improving Health Through Research,” which found that the HIPAA privacy
    rule fails to protect privacy as intended (IOM 2009), and, as currently implemented,
    impedes important health research and imposes burdensome administrative requirements
    (IOM 2009). This IOM report concluded that stricter security would be a better
    approach to protect privacy than requiring patient authorization to use identifiable
    data for research. It recommended that much research based on existing materials
    and data be exempted from an amended HIPAA privacy rule (IOM 2009). For example,
    the Committee suggested that researchers be allowed to work with “secure, trusted,
    non-conflicted intermediaries that could develop a protocol, or key,” for linking
    identifiable data from different sources (IOM 2009). A biobank might serve as
    a trusted intermediary for the pilot projects described above, giving researchers
    only data and materials without overt identifiers but retaining a key to coded
    samples so they could update clinical information or re-contact patients or donors
    when appropriate. Furthermore, the IOM report recommended that “researchers, institutions,
    and organizations that store personally identifiable data should establish strong
    security safeguards and set limits on access to data” (IOM 2009). These precautions
    might include, for example, requirements for physical security of data and provisions
    in materials and data-transfer agreements that forbid researchers who receive
    de-identified data from trying to re-identify patients or donors or to contact
    them directly.


    Furthermore, new approaches to informed consent are being proposed and tested.
    Some examples include: (1) incorporating highly specific patient preferences regarding
    use of their personal health information data (PCAST 2010), (2) using a short
    form for informed consent for participating in biobanks, with additional supplemental
    information for participants who desire more information (Beskow et al. 2010b),
    (3) de-identified data-based, opt-out model used by Vanderbilt and i2b2 (Pulley
    et al. 2010), and (4) consent for whole genome sequencing and study of all phenotypes,
    coupled with respect for individualized preferences regarding the return of clinically
    validated results (Biesecker et al. 2009). The Committee envisages that best practices
    and ultimately consensus standards will emerge from the different models of consent
    and return of clinically significant results to participants.


    [PRECOMPETITIVE COLLABORATIONS](../Text/contents.xhtml#a38)


    To accelerate the development of new tests and products based on a Knowledge Network
    of Disease, precompetitive collaboration between nonprofits and industry and among
    different for-profit companies would be desirable (IOM 2010b, 2011). The research
    needed to build the Information Commons, which will require projects involving
    vast amounts of data from large numbers of patients, will proceed more efficiently
    if such collaborations can be developed both between academia and industry and
    among for-profit companies that have historically been competitors (Altshuler
    et al. 2010).


    These collaborations could include developing common standards and database formats
    and building infrastructure to facilitate data sharing. Consortia might be organized
    to share upstream research findings widely that have no immediate market potential
    but are critical to downstream product development. Examples of such upstream
    research include the identification and validation of biomarkers and predictors
    of adverse drug reactions. To build a flourishing culture of precompetitive collaboration,
    drug companies will need to overcome their reluctance to share all data from completed
    clinical trials, not just the selected data relevant to regulatory proceedings.
    Finally, and most significantly, guidelines for intellectual property need to
    be clarified and concerns about loss of intellectual-property rights addressed.
    Precompetitive collaborations will only emerge if individuals and organizations
    have incentives to join them (Vargas et al. 2010). The Committee believes that
    without such incentives, it will prove difficult or impossible to collect the
    new information that must be acquired before precision medicine, with its attendant
    benefits in improved health outcomes and reduced health-care costs, can become
    a widespread reality.


    Similar principles apply whether the collaborations involve commercial entities
    or are confined to academia. To encourage the collection of materials and data,
    organizations and researchers who collect them should have first access to their
    use for research, while still ensuring their timely availability to others. The
    Committee does not envision the desirability or need, in the context of the research
    required to populate the Information Commons with data and derive a Knowledge
    Network from it, for the instant-data-release model adopted during the Human Genome
    Project. However, it does believe that timely, unrestricted access to datasets
    by researchers with no connections to the investigators who created them will
    be essential. The cost of populating the Information Commons with data precludes
    extensive redundancy in publicly financed research projects. At the same time,
    the size and complexity of these datasets—as well as the need for diverse, competitive
    inputs to their analysis—precludes giving any one group prolonged control over
    them. They must be regarded as public resources available for widespread and diverse
    research into ways to improve health care and to increase the efficiency of health
    care delivery.


    Because the Committee is skeptical that one-size-fits-all policies can accommodate
    the conflicting values associated with incentivizing researchers and insuring
    adequate access to data, it believes that pilot projects of increasing scope and
    scale should put substantial emphasis on addressing the challenges associated
    with data sharing, rather than focusing exclusively on data collection and analysis.


    [COMPETITION AND SHARING IN THE HEALTH-CARE SYSTEM](../Text/contents.xhtml#a39)


    A distinct and critical question is whether payers, such as health insurance companies,
    will provide access to their vast databases of patient and outcomes data and whether
    they will be willing to integrate these data with data from other companies and
    researchers with the goal of creating Knowledge Networks such as those described
    in [Chapter 3](../Text/chapter03.xhtml). On one hand, these organizations recognize
    the potential value and cost saving that could emerge from such an effort. On
    the other hand there are considerable impediments. One of the main impediments
    is cultural: many of these organizations view their data as a propriety asset
    to be used in efforts to generate competitive advantages relative to other organizations.
    For example, large health-care systems and insurance providers are interested
    in developing decision-support tools for physicians that would cut down on the
    substantial waste caused by misdiagnosis or inappropriate treatment decisions.
    Integration of biological data, patient data, and outcomes information into Knowledge
    Networks that aggregate data from many sources could dramatically accelerate such
    efforts. However, if the data and the research results are shared, it would undermine
    one type of competitive advantage that large data providers might otherwise have.
    In this way, there is a tension between the sharing that would be good for the
    health-care system as a whole and the short-term competitive instincts of individual
    providers and payers.'
