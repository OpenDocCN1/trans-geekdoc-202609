    现有的疾病分类法（如 `ICD`）显然具有价值，并可能在未来的很长一段时间内继续被整个医疗体系采用。系统地替换这些系统所产生的组织和财务成本是巨大的。此外，如上述所示，负责修订
    `ICD` 分类法的人员正积极将疾病的分子特征纳入该系统。因此，新分类法（New Taxonomy）最终很有可能涵盖 `ICD` 系统，而后者将包含经过严格验证的疾病分类子集。这些问题必须得到解决，但考虑到启动`信息公社`（Information
    Commons）和`疾病知识网络`（Knowledge Network of Disease）的创建并并完成其形成阶段的任务规模巨大，对这些问题的考虑可以安全地推迟多年。


    ## 拟议的信息基础设施将对全球健康产生影响


    `疾病知识网络`（Knowledge Network of Disease）最终应能提供全球性的利益。不可避免的是，知识网络最初将主要通过获取数据、将其放入`信息公社`并由发达国家的研究人员和医疗机构进行分析来设计。然而，一个全面且充分完善的`疾病知识网络`必须包含许多疾病，包括传染性疾病，以及在范围内中低收入地区特有的、与地理局限的环境暴露相关的疾病。因此，`知识网络`的努力应该扩展到包含对在这些环境下产生的数据进行分析。


    在世界上医疗体系落后的地区，提高疾病定义的精确性尤为重要。在这些环境中，疾病的误诊导致了治疗的不当，并在致病传染原体中产生了广泛的耐药性。疟疾就是一种误诊常见的疾病，后果严重且成本高昂（D’Acremont
    et al. 2009）。通常情况下，在疟疾流行地区出现发热的患者在没有直接证据证明其实患有疟疾的情况下会接受抗疟药物治疗。在某种程度上，这种做法是因为资源有限——大多数地区先进的诊断方法是基于显微镜的血涂片诊断，这需要专家培训。缺乏足够的床时诊断测试来确定患者是否患有疟疾，构成了选择合适靶向治疗的重大障碍。因此，目前正在投入大力开发用于疟疾以及结核病等其他大杀杀手的分子诊断技术（Boehme
    et al. 2010; Small and Pai 2010）。最终，此类诊断将需要能够区分各种病原体的测试，并考虑到宿主中的遗传或分子标记，这些标记影响宿主对感染或潜在治疗的反应。一个全球相关的`信息公社`和`知识网络`可能有助于这一过程——例如，区分由间性疟虫（Plasmodium
    falciparum）和间间疟虫（Plasmodium vivax）引起的疟疾，后者对不同的抗疟药物敏感（malERA Consultative Group
    on Diagnoses and Diagnostics 2011）。`知识网络**及其相关的分类法不应仅为具有先进医疗系统的国家的需求而设计。事实上，`信息公社`以个人为中心的特征——以及包含贡献者的可用数据，包括关于他们生活何处及环境的信息——为建立`疾病知识网络`提供了一条前所未有的路径，能够满足全球医疗保健和疾病预防的需求。


    与电子医疗记录中以及贡献给`信息公社`的所有患者相关数据一样，暴露组层中的信息需要关注数据共享、知情同意和隐私问题；参见第 4 章的讨论。


    ## 我们如何到达那里？


    在对需要新分类法达成共识后，委员会对“我们如何到达那里？”这一问题进行了广泛辩论。在这种背景下，“那里”指的是成功创建一个系统，用于获取和分析与大量个体分子特征和健康史相关的信息。在`第
    3 章`中，我们描述了我们预期`疾病知识网络`和新分类法具备的属性，以及创建它们所需的`信息公社`类型。然而，我们也强调了，这些资源将永远是“进行中的工作”。随着信息技术、基础科学、健康研究和医学经历一波又波的变化，新分类法和`信息公社`的内容和结构预计将不断演变，且可能朝着目前无法想象的方向发展。类比一下，考虑早期对万维网概念的尝试与今天使用互联网的对比。委员会的观点是，我们目前缺乏生产大幅改进疾病分类法的基础设施。相反，我们提出了一条前进的，以开发创建`疾病知识网络`所需的基础设施和研究系统，我们认为这将是基于分子的分类法的关键基石。我们还讨论了这一倡议的可持续性。正如公共领导和投资在万维网的诞生中起着关键作用一样，我们认为，要实现数据密集型生物学和医学的大综合，这种投资将是至关重要的。然而，我们也意识到，正如万维网在真正繁荣之前需要自筹资金一样，`知识网络`及其底层的`信息公社`也需要。


    委员会认为，需要在三个领域采取行动，以利用目前出现的关于疾病分子机制的丰富信息，方法是创建一个动态、全面且实用并广泛使用的`知识网络`：


    1. **设计适当的策略收集并整合疾病相关信息。** `信息公社`将通过大规模将分子数据与患者信息连接起来来开发。创建一个为增加的个体建立这种关联的系统——并使产生的数据对研究人员广泛可用——是迈向`知识网络`和新分类法的关键步骤。此类耦合数据可以通过多种方式生成——包括目前实践主导的、针对患者材料的小规模针对性分子研究。然而，最直接、有效的发现范式涉及观察性研究，旨在将分子数据与日常医疗服务的副产品完整患者病历相关联。


    2. **实施试点研究以建立一个实用的框架，发现分子数据与其他患者特有数据、患者诊断和临床结果之间的关系。** 新的发现模型将涉及对在日常医疗过程中获得的大型患者数据集进行挖掘。这是一种全新的、未经测试的发现方法。在出现一套“最佳实践”之前，需要设计试点研究来识别并克服成功实施该方法的的障碍。

