    Apart from the culture of competition there are other impediments related to cost
    pressures. Cost pressures within the health-care system are such that providers
    and payers are unlikely to be willing to invest substantially (or in some cases,
    at all) in the collection of biological data for research purposes. Over the long
    term, once such data have been shown to yield clinically useful information, it
    will become justifiable to expend health-care resources on the collection of actionable
    data, just as is presently done for standard diagnostic tests. However, until
    such data are shown to be clinically useful, it is unrealistic to expect that
    the Information Commons will become populated by biological data (such as genome
    sequences) acquired from providers and payers. Similarly, the information technology
    challenges associated with integration of large datasets and new disease classification
    systems are substantial. For example, Aetna is currently engaged in a multi-year
    effort to update its information technology systems to support the planned conversion
    to the `ICD-10` coding standards. This effort alone will cost tens of millions
    of dollars. While the goals of integrating datasets and changing classification
    systems are achievable in principle, they will be beyond the technical capacity
    of all but the largest and most technologically sophisticated providers and payers.
    Thus, the transition to non-proprietary Knowledge Networks into which all data
    would be deposited would have to involve strong incentives for payers and providers.
    This may mean that the government will ultimately need to require participation
    in such Knowledge Networks for reimbursement of health care expenses. At an even
    more fundamental level, the longstanding issue of equity in access to a sufficiently
    advanced level of health care should also be addressed if the data in the Knowledge
    Network is to adequately represent the diversity of our society.


    [THE DEVELOPMENT OF A KNOWLEDGE NETWORK OF DISEASE WILL REQUIRE AND INFORM THE
    EDUCATION OF HEALTH-CARE PROVIDERS AT ALL LEVELS](../Text/contents.xhtml#a40)


    Decision-making based on a Knowledge Network of Disease and the New Taxonomy,
    which will incorporate a multitude of parameters, will represent a significant
    adjustment in the practical work of the primary care physician. Given the demands
    on the time of physicians and other care-givers in the present health-care environment,
    few are likely to have the time or to feel qualified to interpret the results
    of “omics”-scale analyses of their patients. The importance of this issue will
    escalate over time as the Knowledge Network and its linked molecular-based taxonomy
    evolve into a system whose sheer complexity greatly exceeds current approaches
    to disease classification.


    One concern is that the infusion of large molecular datasets into clinical records
    will reinforce a tendency many perceive as already crediting genetic and other
    molecular findings with more weight than they deserve. In extreme cases, this
    cultural bias has enabled the promoting and marketing of “omic” tests with no
    clinical value whatsoever (Kolata 2011). In other cases genetic or “omic” tests
    with real value in specific contexts may be over-interpreted and thereby occlude
    consideration of other relevant clinical data. To develop the Knowledge Network
    of Disease and the New Taxonomy that will be derived from it, health-care providers
    will need to develop much greater literacy in the interpretation and application
    of molecular data.


    To meet these challenges, health-care providers will require both decision-support
    systems and new training paradigms. The decision-support systems will need to
    provide useful information about the propensity of patients to develop disease,
    facilitate a correct diagnosis, guide selection of the most appropriate strategies
    for disease prevention or treatment, inform the patient about the prognosis and
    management of the disease, and provide the opportunity for both physicians and
    patients to access more detailed information about the disease on an “as interested”
    or “as needed” basis. Whenever possible, such decision-support systems should
    enable shared decision-making by patients and their care-givers. Such systems
    should be readily updatable as more information is acquired about disease classification,
    the ability of particular test results to predict disease development, progression,
    or response to treatment, and the success of particular disease-prevention and
    management strategies.


    ![images/p72.jpg](Images/p72.jpg)


    [`FIGURE 4-1` Curriculum for biomedical graduate program—proposed new model](../Text/contents.xhtml#fi_4-1).


    The current model of the first-year curriculum in a typical biomedical graduate
    program (top) and an alternative model (bottom). The multicolored bars in the
    nodes and connections course represent fundamental principles and essential facts
    about each key process integrated across scales.


    SOURCE: Modified with permission from Lorsch 2011.


    In order to prepare physicians for the use of a comprehensive, dynamically changing
    Knowledge Network, biomedical education will need to adjust. Lorsch and Nichols
    (2011) recently proposed that graduate and medical life sciences curricula would
    significantly benefit from a major shift away from the current discipline-specific
    model to a vertically integrated nodes-and-connections framework (see [Figure
    4-1](../Text/chapter04.xhtml#fig_4-1)). This model is not the only possible way
    of reorganizing instruction to reflect new knowledge about molecular processes,
    but it demonstrates how the development of a molecularly-based taxonomy, and the
    underlying Knowledge Network of Disease, could lead to major changes in education,
    while preparing students pursuing research careers to function in a scientific
    landscape that increasingly requires multidisciplinary approaches to solve biomedical
    problems (NRC 2009; MIT 2011). It also would give future physicians a more holistic
    view of biological processes, which reflects what will be required to fulfill
    the promises of genomics and personalized medicine (Ashley et al. 2010; Wiener
    et al. 2010).


    The teaching model proposed by Lorsch and Nichols very closely mirrors the properties
    of the Knowledge Network of Disease described in [Chapter 3](../Text/chapter03.xhtml).
    In this teaching model a given topic—for example, gene expression—would be taught
    in a vertically integrated fashion, with essential information all the way from
    the atomic to the whole-organism scale discussed. Adjusting teaching strategies
    to reflect the biological reality of the material has the potential to create
    significant synergies. Students may retain more knowledge of basic science when
    this information is directly connected to medicine. The enhanced ability to use
    the New Taxonomy in medical practice and research would reinforce the student’s
    conception of biology. Although it is beyond the scope of this report to suggest
    detailed reforms of the medical-school curriculum, the Committee would like to
    emphasize that full realization of the power of the Knowledge Network of Disease
    and the New Taxonomy derived from it would almost certainly require a major shift
    in educational strategy.

    '
  trans: '


    除了竞争文化之外，还有其他与成本压力相关的障碍。医疗保健体系内部的成本压力使得提供者和付费方不太愿意为研究目的的生物数据收集投入大量资金（在某些情况下甚至完全不投入）。从长远来看，一旦此类数据被证明能产生临床有用信息，投入医疗保健资源来收集具有操作价值的数据将是合理的，就像目前标准诊断测试所那样。然而，在这些数据被证明具有临床用途之前，期望信息公地充斥从提供者和付费方获取的生物数据（如基因组序列）是不现实的。同样，与整合大型数据集和新疾病分类系统相关的信息技术挑战也是巨大的。例如，安泰（Aetna）目前正致力于一项为期多年的努力，更新其信息技术系统，以支持计划转换为
    `ICD-10` 编码标准。单此项工作将花费数千万美元。虽然整合数据集和改变分类系统的目标在原则上是可以实现的，但对于除规模最大、技术最先进的提供者和付费方之外的人来说将超出其技术能力。因此，向存储所有数据的非专有知识网络进行过渡，将必须为付费方和提供者提供强有力的激励。这可能意味着政府最终需要要求参与此类知识网络以报销医疗费用。在更基础的层面上，如果知识网络中的数据要充分代表我们社会的多样性，那么长期以来存在的获取足够先进水平医疗服务的公平性问题也应该得到解决。


    疾病知识网络的开发将需要并指导各层次医疗保健提供者的教育


    基于疾病知识网络和将包含大量参数的**新分类法**（the New Taxonomy）的决策制定，将代表初级保健医生实际工作中的一项重大调整。考虑到目前医疗保健环境中对医生和其他护理人员时间的需求，很少有人会有时间或自认为有能力来解读其患者的“组学”（omics）规模分析结果。随着知识网络及其关联的基于分子的分类法演变为一个其复杂性程度远超当前疾病分类方法的系统，这一问题的重要性将随着时间的推移而增加。


    一个担忧是，将大型分子数据集注入临床记录将会加剧一种许多人认为已经存在的倾向，即赋予遗传和其他分子发现的权重超过了其应得的权重。在极端情况下，这种文化偏见已导致某些毫无临床价值的“组学”测试的推广和营销（Kolata
    2011）。在其他情况下，在特定背景下具有真实价值的遗传或“组学”测试可能会被过度解读，从而掩盖对其他相关临床数据的考虑。为了开发疾病知识网络以及由此衍生出的新分类法，医疗保健提供者需要在分子数据的解释和应用方面培养出更丰富的素养。


    为了应对这些挑战，医疗保健提供者既需要决策支持系统也需要新的培训范式。决策支持系统需要提供有关患者患病倾向的有用信息，促进正确诊断，引导选择预防或治疗疾病的最合适策略，告知患者疾病的预后和管理，并为医生和患者提供“根据兴趣”或“根据需要”获取更多关于疾病详细信息的机会。在可能的情况下，此类决策支持系统应实现患者及其护理人员的共同决策。随着获得有关疾病分类、特定测试结果预测疾病发生、进展或对治疗反应的能力，以及特定疾病预防和管理策略成功的信息不断增加，此类系统应当易于更新。


    ![images/p72.jpg](img/p72.jpg)


    `图 4-1` 生物医学研究生课程课程——拟议的新模型。


    典型生物医学研究生课程第一年课程的当前模型（顶部）和替代模型（底部）。节点与连接课程中的彩色条形代表了跨越尺度的基本原理和基本事实。


    来源：经 Lorsch 2011 许可修改。


    为了让医生能够使用全面的、动态变化的知识网络，生物医学教育需要调整。Lorsch 和 Nichols (2011) 最近提出，研究生和医学科学课程如果从目前的学科特定模式转向垂直整合的“节点与连接”框架，将极大受益（见图
    4-1）。这种模型不是组织教学以反映分子过程知识的唯一可能方法，但它展示了基于分子的分类法及其底层疾病知识网络如何导致教育的重大变革，同时让追求研究职业的学生能够在日益需要跨学科方法解决生物医学问题的科学环境中工作（NRC
    2009; MIT 2011）。它还将为未来的医生提供更全面的生物过程视角，这反映了实现基因组学和个性化医疗承诺所需的能力（Ashley et al. 2010;
    Wiener et al. 2010）。


    Lorsch 和 Nichols 提出的教学模型与第 3 章中描述的疾病知识网络的属性非常相似。在这种教学模型中，给定的主题（例如基因表达）将以垂直整合的方式进行教学，涵盖从原子尺度到整个有机体尺度的关键信息。调整教学策略以反映材料的生物学现实具有产生显著协同效应的潜力。当基础科学信息与医学直接联系时，学生可能会记住更多知识。在医学实践和研究中使用新分类法的能力增强将强化学生对生物学的概念。虽然对医学院课程进行详细建议超本报告的范围，但委员会想强调，充分发挥疾病知识网络及其衍生出的新分类法的力量，几乎肯定需要教育策略的重大转变。


    '
