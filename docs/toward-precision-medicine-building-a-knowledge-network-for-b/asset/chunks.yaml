- raw: '**Data Sharing Guiding Principles**: All data sharing will adhere to 1) the
    terms of consent agreed to by research participants; 2) applicable laws and regulations,
    and; 3) the principle that individual sites within the network have final authority
    regarding whether their site’s data will be used or shared, on a per-project basis.
    These principles are intended to maximize sharing of GWAS data generated by the
    eMERGE Members among and between other Members as well as with the wider scientific
    community, and to do this without compromising data security or the confidentiality
    of information about individuals whose data and/or samples are used for research.


    **Data Sharing Responsibilities**: Principal Investigators of each eMERGE Clinical
    Site may designate data to accomplish activities defined in eMERGE sanctioned
    research studies (eMERGE data) to be shared as follows: (1) distribution through
    dbGaP; (2) distribution within the eMERGE Network; and/ or (3) distribution to
    the eMERGE Coordinating Center. The eMERGE data to be shared within eMERGE will
    be provided only to eMERGE Network Members that have signed this Agreement. All
    eMERGE Network Members and the eMERGE Coordinating Center may aggregate eMERGE
    data from all Member sites and, with documented approval prior to each submission
    from the contributing site(s), submit said eMERGE data to dbGaP and/or other databases
    administered by the National Institutes of Health. Each eMERGE Network Member
    may share its own data with external collaborators without approval of the other
    Members. If eMERGE data received from any Member is shared externally by another
    Member, prior approval from the Member providing the eMERGE data must be obtained
    and documented. Members sharing eMERGE data externally must also ensure that each
    external eMERGE data recipient agrees to the same restrictions and conditions
    applicable to Members and Member Representatives regarding the use and disclosure
    of the eMERGE data as outlined in this Agreement or as may be required by law.


    **Statement of Confidentiality**: By signing this Agreement, the authorized official
    representing an eMERGE Network Member, certifies that s/he and the Principal Investigators,
    fellows, students, and research staff (collectively, “Network Member Representatives”)
    working on eMERGE-related projects are aware of the confidential nature of data
    on research participants maintained by the Member and of the necessity for maintaining
    that confidentiality.


    The eMERGE Network Member agrees not to attempt to personally identify any eMERGE
    participant based on eMERGE data and agree not to attempt to contact any eMERGE
    participant of a site other than their own. The Member agrees not to transfer
    or disclose any confidential data or any information about individual eMERGE participants,
    except as permitted by this Agreement or as required by law, either during or
    after the conclusion of the affiliation with eMERGE. The Member agrees to provide
    adequate security for the eMERGE data, including but not limited to safeguards
    intended to prevent unauthorized use or disclosure of such information. In addition
    each Member agrees to report in writing to the other Members any use or disclosure
    of any portion of the data of which it becomes aware that is not permitted by
    this Agreement including disclosures that are required by law.


    The eMERGE Network Member agrees to ensure that its Network Member Representatives
    do not use, disclose or transfer any eMERGE data to anyone who is not an eMERGE
    Network Member except as permitted by this Agreement or as required by law. Further,
    the Member agrees to return all eMERGE data to the eMERGE Coordinating Center
    or delete/destroy all electronic eMERGE data upon termination of its affiliation
    with the eMERGE Network and to notify the eMERGE Coordinating Center when it has
    done so.


    **Limitations of Data Use**: The eMERGE Network Member agrees to ensure that Network
    Member Representatives will only use eMERGE data in a manner that is consistent
    with any limitations that have been specified for individual studies by the disclosing
    Member and agreed to by the Steering Committee and shall ensure compliance with
    all applicable state and federal laws and regulations governing the use of such
    data including the Health Insurance Portability and Accountability Act of 1996
    (HIPAA), if applicable, including any and all future amendments.


    The eMERGE Network Member agrees to comply with all established policies of eMERGE
    governing the acquisition, analysis, reporting, publication, use and distribution
    of eMERGE data.


    This Agreement supersedes and replaces all prior agreements made between eMERGE
    Network Members.


